  text: Mockery and reproach are for the proud[b][a], and vengeance will lie in wait for him like a lion.
translation:
  language: pt
  text: Zombaria e afronta são para os orgulhosos[a], e a vingança ficará à espreita dele como um leão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os arrogantes”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o emboscará como um leão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπαιγμός
  choice: zombaria
  rationale: Expressa o ato ou tratamento de ridicularizar de modo natural e claro em português atual.
- source_word: ὀνειδισμός
  choice: afronta
  rationale: Preserva a ideia de insulto que expõe alguém à vergonha, sem reduzir o termo a mera crítica verbal.
- source_word: ὑπερηφάνων
  choice: os orgulhosos
  rationale: Representa o genitivo plural substantivado e mantém a referência genérica a pessoas marcadas pelo orgulho ou arrogância.
- source_word: ἐκδίκησις
  choice: vingança
  rationale: Mantém a força retributiva do termo grego e a severidade da imagem do leão, sem identificar um agente que o texto não especifica.
- source_word: ἐνεδρεύσει
  choice: ficará à espreita
  rationale: Comunica a ação de aguardar ocultamente para atacar e preserva a imagem predatória.
- source_word: αὐτόν
  choice: dele
  rationale: Conserva o objeto masculino singular do grego, que individualiza um integrante da classe plural anteriormente mencionada.
theological_decisions:
- issue: Concordância entre o antecedente plural ὑπερηφάνων e o pronome singular αὐτόν
  choice: Manter o singular em “dele”
  alternative: Usar o plural “deles” ou a expressão “de tal pessoa”
  rationale: O grego passa deliberadamente da classe plural ao indivíduo singular. A tradução conserva essa tensão e a força proverbial, embora a mudança de número seja marcada em português.
- issue: Força retributiva de ἐκδίκησις
  choice: Traduzir por “vingança”
  alternative: “Retribuição”, “castigo” ou “justiça”
  rationale: “Vingança” preserva a intensidade lexical e a ameaça figurada, sem suavizar o texto nem determinar quem executa essa vingança.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Afronta” conserva o tom sapiencial sem recorrer ao menos corrente “opróbrio”. A construção “ficará à espreita dele” mantém a metáfora do predador e o singular inesperado do original.
