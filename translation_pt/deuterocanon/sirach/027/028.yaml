  naturalness: O português é moderno, claro e de registro sapiencial apropriado. “Ficará à espreita dele como um leão” é uma formulação natural e mantém a imagem predatória sem explicá-la em excesso. A passagem do plural “os orgulhosos” ao singular “dele” é levemente marcada, mas é intencional e fiel ao grego.
