translation:
  language: pt
  text: Odiei muitas coisas, e não me tornei semelhante a ele; e o Senhor o odiará.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὰ
  choice: muitas coisas
  rationale: O neutro plural é substantivado; “muitas coisas” explicita naturalmente o objeto de ἐμίσησα em português.
- source_word: ἐμίσησα
  choice: odiei
  rationale: O pretérito perfeito traduz de modo direto o aoristo e mantém a força proverbial da declaração.
- source_word: οὐχ ὡμοίωσα αὐτῷ
  choice: não me tornei como ele
  rationale: Neste contexto, ὁμοιόω exprime tornar-se semelhante a alguém. A formulação comunica com clareza a comparação moral sem impor uma explicação adicional.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: O título refere-se a Deus no contexto sapiencial e é vertido pela forma portuguesa consagrada “o Senhor”.
- source_word: μισήσει
  choice: odiará
  rationale: O futuro de μισέω é traduzido diretamente, preservando tanto a severidade da expressão quanto a repetição lexical do verbo usado na primeira oração.
- source_word: αὐτόν
  choice: o
  rationale: O pronome masculino singular retoma de forma concisa o homem mencionado no contexto.
theological_decisions:
- issue: Linguagem de ódio atribuída ao Senhor
  choice: o Senhor o odiará
  alternative: o Senhor o detestará
  rationale: A repetição da raiz μισέω liga o ódio do falante à resposta futura do Senhor. Manter “odiar” conserva a força retórica e evita suavizar a tensão teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com ordem natural para leitores brasileiros e compreensão ampla no mundo lusófono. A conjunção “mas” expressa naturalmente o contraste implicado por καί no contexto.
