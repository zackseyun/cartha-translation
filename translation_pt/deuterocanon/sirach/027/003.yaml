  text: If he does not hold fast with diligence in the fear of the Lord[a], his house will quickly be overthrown.
translation:
  language: pt
  text: Se ele não se mantiver diligentemente no temor do Senhor, sua casa[a] logo será arruinada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua família logo será arruinada”. A palavra grega traduzida por “casa” também pode indicar a família, a unidade doméstica ou o estabelecimento de uma pessoa.'
    reason: Alternativa lexical que preserva a amplitude semântica de οἶκος.
lexical_decisions:
- source_word: ἐὰν μὴ
  choice: Se não
  rationale: Reproduz de modo claro e natural a condição negativa do grego, sem convertê-la numa afirmação categórica.
- source_word: ἐν φόβῳ Κυρίου
  choice: no temor do Senhor
  rationale: Mantém a expressão bíblica tradicional e sua força própria na literatura sapiencial, sem reduzi-la apenas a reverência ou devoção.
- source_word: κρατήσῃ
  choice: se mantiver firme
  rationale: Expressa a ideia de perseverar ou conservar-se firmemente ligado a uma postura; em português, é mais natural aqui do que o literal 'agarrar-se firmemente', cujo complemento ficaria pouco claro.
- source_word: κατὰ σπουδήν
  choice: com diligência
  rationale: Preserva a noção de empenho sério e aplicação cuidadosa, além de refletir a construção adverbial grega.
- source_word: ἐν τάχει
  choice: depressa
  rationale: Comunica diretamente a rapidez do resultado anunciado e mantém um registro atual e digno.
- source_word: καταστραφήσεται
  choice: será arruinada
  rationale: O futuro passivo indica que a casa sofrerá queda ou ruína. 'Será arruinada' funciona tanto para uma construção quanto para a casa entendida como família ou unidade doméstica.
- source_word: αὐτοῦ ὁ οἶκος
  choice: sua casa
  rationale: Conserva a imagem ampla de οἶκος, que pode abranger residência, família, casa doméstica ou estabelecimento, sem restringir indevidamente o sentido.
theological_decisions:
- issue: Sentido de 'temor do Senhor'
  choice: Manter a expressão tradicional 'temor do Senhor'.
  alternative: reverência ao Senhor; devoção ao Senhor
  rationale: A expressão possui peso teológico e conexões próprias na literatura sapiencial. Uma paráfrase eliminaria parte de sua tensão entre temor, reverência e fidelidade.
- issue: Amplitude de 'casa'
  choice: Usar 'casa' no texto e explicar sua amplitude em nota.
  alternative: família; unidade doméstica; patrimônio familiar
  rationale: O grego οἶκος não obriga a escolher apenas o edifício ou apenas as pessoas e os bens associados a ele; a tradução preserva essa ambiguidade genuína.
- issue: Forma do título divino Κυρίου
  choice: Senhor
  alternative: SENHOR
  rationale: O texto-fonte grego traz κύριος; por isso, 'Senhor' traduz diretamente a forma disponível sem pressupor graficamente o tetragrama hebraico.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem foi levemente ajustada para a fluidez do português, sem alterar a relação entre condição e consequência. As vírgulas destacam 'com diligência' como expressão de modo.
