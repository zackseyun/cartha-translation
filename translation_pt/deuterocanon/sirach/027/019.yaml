  text: And as a bird from your hand you have let go[a], so you have let your neighbor go, and you will not catch him.
translation:
  language: pt
  text: Assim como você soltou um pássaro da sua mão, também deixou seu próximo ir, e não o caçará.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não o capturará”. O verbo grego traz a imagem da caça.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πετεινὸν
  choice: pássaro
  rationale: Termo amplo para uma ave; “pássaro” é natural em português atual e mantém clara a comparação.
- source_word: ἐκ χειρός σου
  choice: da mão
  rationale: Preserva a imagem concreta da ave que é solta da mão; o possessivo fica naturalmente implícito após “você soltou”.
- source_word: ἀπέλυσας
  choice: você soltou
  rationale: Expressa diretamente o ato de liberar a ave e conserva a imagem de algo que escapou ao domínio da pessoa.
- source_word: ἀφῆκας
  choice: deixou ... ir
  rationale: O paralelo com ἀπέλυσας favorece o sentido de deixar partir ou soltar, sem ativar aqui o sentido possível de perdoar.
- source_word: τὸν πλησίον
  choice: seu próximo
  rationale: Mantém a expressão ética tradicional para uma pessoa socialmente próxima, em linguagem compreensível e não excessivamente específica.
- source_word: οὐ θηρεύσεις
  choice: não conseguirá capturá-lo
  rationale: Comunica o resultado da metáfora — a impossibilidade de recuperar aquele que foi deixado ir — enquanto “capturar” ainda preserva parte da imagem de caça.
theological_decisions:
- issue: Se o verbo final deve explicitar a imagem da caça ou destacar o resultado de não recuperar o próximo
  choice: não conseguirá capturá-lo
  alternative: não o caçará
  rationale: O grego θηρεύω evoca a caça, mas no provérbio a força principal é que, depois de deixado ir, o próximo não será recuperado. A tradução escolhida preserva a metáfora de captura em português natural; a alternativa mais literal é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com formas de tratamento em “você” para ampla legibilidade brasileira. A ordem “soltou da mão um pássaro” mantém a imagem concreta sem soar excessivamente literal. O marcador da nota foi colocado junto ao verbo final ao qual a alternativa se refere.
