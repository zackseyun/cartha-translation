  text: The speech of the godly is always wisdom[b][a], but the fool changes like the moon.
translation:
  language: pt
  text: A fala de quem é devoto é sempre sabedoria, mas o insensato muda como a lua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A comparação provavelmente alude às fases da lua: o insensato é instável ou inconstante.'
    reason: cultural_note
lexical_decisions:
- source_word: διήγησις
  choice: conversa
  rationale: O substantivo pode significar narração, relato ou discurso. Neste provérbio, “conversa” comunica de modo natural aquilo que a pessoa habitualmente diz, sem limitar o sentido a uma narrativa formal.
- source_word: εὐσεβοῦς
  choice: de quem é devoto
  rationale: O genitivo singular substantivado designa uma pessoa piedosa ou devota. Esta formulação preserva o sentido religioso e moral em linguagem atual, sem sugerir que o texto fale coletivamente de todos os devotos.
- source_word: διὰ παντός
  choice: sempre
  rationale: A expressão idiomática significa continuamente ou em todo tempo; “sempre” é conciso e natural.
- source_word: σοφία
  choice: sabedoria
  rationale: Mantém o substantivo predicativo do grego e a força aforística da frase.
- source_word: ἄφρων
  choice: o insensato
  rationale: Termo típico da literatura sapiencial para quem carece de bom senso; “insensato” é claro, digno e menos propenso a ser entendido apenas como insulto.
- source_word: ἀλλοιοῦται
  choice: muda
  rationale: O verbo indica mudar ou tornar-se diferente. “Muda” conserva sua força verbal e combina naturalmente com a imagem das fases lunares.
- source_word: ὡς σελήνη
  choice: como a lua
  rationale: Reproduz diretamente a comparação explícita do grego.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A construção conserva o paralelismo sapiencial e o predicado nominal “sabedoria”. “Conversa” foi preferido a “discurso” por ser mais corrente, embora o termo grego também possa significar “discurso” ou “relato”.
