  text: If you pursue righteousness[a], you will attain it, and put it on like a robe of glory.
translation:
  language: pt
  text: Se você buscar com empenho o que é justo[a], você o alcançará e se revestirá dele como de uma veste longa de glória.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a justiça”; também pode ser traduzido por “a retidão”. A expressão grega abrange tanto a retidão pessoal quanto a conduta justa.
    reason: lexical_alternative
lexical_decisions:
- source_word: διώκῃς
  choice: buscar com empenho
  rationale: O verbo expressa a ideia ativa de perseguir ou correr atrás de algo. “Buscar com empenho” conserva essa intensidade moral sem a conotação negativa que “perseguir” frequentemente tem em português.
- source_word: τὸ δίκαιον
  choice: o que é justo
  rationale: O neutro substantivado designa de modo amplo aquilo que é certo ou justo, podendo abranger tanto a retidão pessoal quanto a conduta justa. A formulação evita restringir o sentido ao âmbito jurídico.
- source_word: καταλήμψῃ
  choice: alcançará
  rationale: O verbo pode significar alcançar, apanhar ou tomar posse. “Alcançará” mantém a imagem de uma busca que chega com êxito ao seu objetivo.
- source_word: ἐνδύσῃ
  choice: o vestirá
  rationale: A expressão preserva diretamente a metáfora de pôr uma virtude como vestimenta. O pronome retoma “o que é justo”.
- source_word: ποδήρη
  choice: manto
  rationale: O termo se refere a uma veste comprida, que chega aos pés. “Manto” comunica de modo natural a imagem de uma veste solene; o comprimento específico não precisa ser explicitado no corpo do versículo.
- source_word: δόξης
  choice: de glória
  rationale: A construção nominal mantém a linguagem elevada do grego e permite tanto a ideia de esplendor quanto a de honra.
theological_decisions:
- issue: Amplitude ética de τὸ δίκαιον no contexto sapiencial
  choice: o que é justo
  alternative: a justiça; a retidão
  rationale: O grego admite uma referência ampla ao que é moralmente certo e justo. “O que é justo” preserva essa amplitude sem limitar o texto à justiça social ou jurídica, nem transformar automaticamente a expressão em um termo técnico doutrinário.
translation_notes:
  register: Português atual, claro e digno, com uso de “você” para ampla legibilidade brasileira. A expressão “buscar com empenho” reproduz a força ativa da busca, e “manto de glória” conserva a metáfora solene do original.
