  source_fidelity: A tradução de τὸ δίκαιον como “o que é justo” e de καταλήμψῃ como “alcançará” preserva bem a amplitude ética e a progressão da imagem grega. “Buscar com empenho” comunica adequadamente o valor figurado e intenso de διώκῃς. Contudo, “o vestirá” em português normalmente significa vestir algo ou alguém, e não vestir-se de algo; assim, não expressa com clareza o valor médio de ἐνδύσῃ nem a metáfora de revestir-se daquilo que se alcançou. “Veste longa” recupera também a nuance de ποδήρη, uma vestimenta que chega aos pés.
