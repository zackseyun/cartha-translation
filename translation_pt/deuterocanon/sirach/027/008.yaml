  terminology: “O que é justo” é uma escolha apropriada e não estreita τὸ δίκαιον a um sentido jurídico ou doutrinário. A nota apresenta de forma equilibrada as alternativas “a justiça” e “a retidão”. “Glória” preserva δόξης; “veste longa” traduz com maior precisão o caráter de ποδήρη sem perder o registro digno.
