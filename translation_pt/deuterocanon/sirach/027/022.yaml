  text: One who winks with the eye devises evil things[a], and no one will turn him away from them.
translation:
  language: pt
  text: Quem pisca o olho trama males, e ninguém o afastará disso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “dele” ou “disso”, no singular; a expressão provavelmente retoma os males que a pessoa trama.
    reason: lexical_alternative
lexical_decisions:
- source_word: διανεύων ὀφθαλμῷ
  choice: Quem pisca o olho
  rationale: O particípio indica fazer um sinal; com o dativo instrumental “com o olho”, descreve naturalmente um gesto ocular discreto. “Pisca o olho” é conciso e corrente, sem explicitar além do texto a quem o sinal é dirigido.
- source_word: τεκταίνει
  choice: trama
  rationale: Embora o verbo possa significar literalmente fabricar ou construir, neste contexto moral expressa a elaboração intencional de algo mau. “Trama” conserva a ideia de ação calculada e soa natural em português.
- source_word: κακά
  choice: males
  rationale: O neutro plural tem sentido amplo. “Males” preserva tanto o plural quanto a força moral, sem restringi-lo interpretativamente a planos, delitos ou danos específicos.
- source_word: οὐδεὶς
  choice: ninguém
  rationale: Equivalente direto, idiomático e abrangente do pronome negativo grego.
- source_word: ἀποστήσει
  choice: o afastará
  rationale: O futuro causativo expressa fazer alguém se separar ou desviar de algo. “O afastará” mantém essa imagem sem decidir se se trata de impedimento, persuasão ou desistência.
- source_word: ἀπʼ αὐτοῦ
  choice: disso
  rationale: A forma grega é singular e pode ser vertida por “disso”, que retoma de modo natural a prática ou o mal tramado, preservando melhor a indefinição formal do que um plural explícito.
theological_decisions: []
translation_notes:
  register: Português atual, digno e acessível, com formulação proverbial concisa. “Trama males” mantém a amplitude moral do grego, e “disso” conserva a oscilação entre a forma singular do pronome e o antecedente plural em sentido.
