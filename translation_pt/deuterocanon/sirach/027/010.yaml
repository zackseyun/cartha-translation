  text: A lion lies in wait for prey[a]; so sins do for those who practice injustice.
translation:
  language: pt
  text: Um leão fica à espreita da presa[a]; assim também os pecados ficam à espreita dos que praticam a injustiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Um leão embosca a presa; assim também os pecados emboscam os que cometem atos injustos.»'
    reason: Alternativa lexical que ressalta o sentido de emboscada em ἐνεδρεύει e a forma concreta do plural ἄδικα.
lexical_decisions:
- source_word: λέων
  choice: Um leão
  rationale: O singular sem artigo tem valor proverbial e geral; «um leão» comunica isso naturalmente em português.
- source_word: θήραν
  choice: presa
  rationale: O substantivo designa aquilo que é caçado; «presa» preserva com clareza a imagem predatória.
- source_word: ἐνεδρεύει
  choice: fica à espreita
  rationale: O verbo expressa a ação de aguardar ocultamente para atacar. A expressão é corrente e mantém a força da imagem.
- source_word: οὕτως
  choice: assim também
  rationale: Introduz a correspondência entre as duas partes da comparação; «também» torna explícito em português o paralelismo já presente no grego.
- source_word: ἁμαρτίαι
  choice: os pecados
  rationale: Mantém o plural concreto e a personificação do texto, no qual os pecados agem como predadores.
- source_word: ἐργαζομένους
  choice: os que praticam
  rationale: O particípio apresenta pessoas empenhadas em fazer tais atos; «praticam» expressa bem essa atividade continuada ou característica.
- source_word: ἄδικα
  choice: a injustiça
  rationale: O neutro plural pode significar «coisas injustas»; a formulação idiomática «praticam a injustiça» conserva o sentido ético sem tornar a frase pesada.
theological_decisions:
- issue: Personificação de ἁμαρτίαι
  choice: Os próprios pecados são retratados como predadores à espreita dos injustos.
  alternative: As consequências ou os castigos dos pecados ficam à espreita dos injustos.
  rationale: O grego diz literalmente «pecados», sem mencionar consequências ou castigos. A tradução conserva a personificação e não resolve a tensão por meio de uma explicação interpretativa.
- issue: Elipse verbal na segunda oração
  choice: Repetir «ficam à espreita» para completar naturalmente a comparação em português.
  alternative: 'Manter a construção elíptica: «assim os pecados, para os que praticam a injustiça».'
  rationale: O verbo da primeira oração é subentendido na segunda. Sua repetição em português esclarece a sintaxe sem acrescentar uma ideia ausente do original.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção proverbial e a imagem vívida do predador foram preservadas; evitou-se substituir «pecados» por uma interpretação como «consequências» ou «castigos».
