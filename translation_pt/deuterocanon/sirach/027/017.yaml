  text: Cherish a friend and be faithful to him; but if you reveal his secrets[a], you will certainly not pursue after him.
translation:
  language: pt
  text: Tenha carinho por um amigo e seja fiel a ele; mas, se você revelar os segredos dele, certamente não irá atrás dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de modo nenhum vá atrás dele”. O grego pode ser entendido tanto como uma declaração da consequência quanto, com menor probabilidade, como uma proibição.'
    reason: alternative_reading
lexical_decisions:
- source_word: στέργον
  choice: Tenha carinho por
  rationale: O imperativo exprime afeição dedicada e constante. “Tenha carinho por” comunica essa ligação calorosa em português corrente sem reduzir o sentido ao verbo mais amplo “amar”.
- source_word: φίλον
  choice: um amigo
  rationale: O acusativo funciona como objeto e tem forma indefinida; “um amigo” é natural no estilo proverbial.
- source_word: πιστώθητι μετʼ αὐτοῦ
  choice: seja fiel a ele
  rationale: O imperativo médio/passivo pede que a pessoa se mostre fiel ou digna de confiança na relação. Em português, “fiel a ele” é mais idiomático do que uma reprodução literal de μετά, “com ele”.
- source_word: ἀποκαλύψῃς
  choice: revelar
  rationale: O verbo indica descobrir ou divulgar aquilo que estava oculto; “revelar” é claro e adequado ao contexto de confidencialidade.
- source_word: τὰ μυστήρια αὐτοῦ
  choice: os segredos dele
  rationale: Neste contexto interpessoal, μυστήρια designa assuntos confidenciais, não necessariamente mistérios religiosos.
- source_word: οὐ μὴ
  choice: certamente não
  rationale: A combinação com o subjuntivo expressa negação enfática; “certamente não” preserva essa força.
- source_word: καταδιώξῃς ὀπίσω αὐτοῦ
  choice: irá atrás dele
  rationale: A expressão retrata perseguir ou ir atrás da pessoa. A formulação portuguesa mantém a imagem e permite entender a consequência da confiança rompida sem acrescentar explicitamente a ideia de êxito ou reconciliação.
theological_decisions:
- issue: Força interpretativa da oração final depois da quebra de confiança
  choice: 'A oração é apresentada no texto como consequência proverbial: “certamente não irá atrás dele”.'
  alternative: “certamente não vá atrás dele” (proibição).
  rationale: οὐ μή com o subjuntivo é lido mais naturalmente aqui como negação enfática de resultado futuro, embora a forma de segunda pessoa também possa ser entendida, com menor probabilidade, como proibição. A nota preserva essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Tenha carinho por” preserva o tom afetivo de στέργω; “seja fiel a ele” é relacional e idiomático. O pronome “você” torna explícito o sujeito singular apenas na oração condicional, mantendo a fluidez.
