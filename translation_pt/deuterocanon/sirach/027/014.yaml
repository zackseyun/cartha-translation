  text: The talk of one who swears much makes the hair stand up[a], and their quarrel stops the ears.
translation:
  language: pt
  text: A fala de quem pragueja muito faz os cabelos ficarem em pé[a], e a briga deles obriga a tapar os ouvidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego πολυκόρυφου é de sentido incerto. Pode referir-se a alguém dado a imprecações ou juramentos excessivos ou, de modo mais amplo, a uma pessoa de fala ruidosa, ultrajante ou presunçosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰ
  choice: fala
  rationale: Termo amplo para fala ou modo de falar; é natural em português e mantém o tom proverbial.
- source_word: πολυκόρυφου
  choice: de quem pragueja muito
  rationale: O adjetivo é lexicalmente difícil e provavelmente descreve alguém dado a muitas imprecações ou juramentos, embora também possa indicar fala ruidosa, ultrajante ou presunçosa. A escolha comunica o sentido contextual mais provável sem ocultar a incerteza, registrada em nota.
- source_word: ὀρθώσει τρίχας
  choice: faz os cabelos ficarem em pé
  rationale: Preserva a imagem vívida do grego numa expressão idiomática corrente em português, associada a horror ou forte alarme.
- source_word: μάχη
  choice: briga
  rationale: Neste contexto sapiencial e verbal, indica mais naturalmente uma altercação do que uma batalha literal.
- source_word: ἐμφραγμὸς ὤτιων
  choice: obriga a tapar os ouvidos
  rationale: Expressa de modo natural a imagem de uma contenda tão ofensiva que leva a pessoa a tapar os ouvidos; evita o pouco idiomático literalismo 'obstrução dos ouvidos'.
