  text: Whoever does evil[a], onto himself it will roll, and he will certainly not know from where it came upon him.
translation:
  language: pt
  text: Quem pratica o mal, o mal rolará sobre ele[a], e ele de modo nenhum saberá de onde lhe veio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “voltará rolando sobre ele”. O grego emprega a imagem de algo que rola em direção à pessoa que pratica o mal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν
  choice: Quem pratica
  rationale: O particípio presente substantivado tem sentido genérico. “Quem pratica” preserva o caráter proverbial e soa natural em português.
- source_word: πονηρὰ
  choice: o mal
  rationale: O adjetivo neutro plural é usado substantivamente. O singular coletivo “o mal” comunica sua força moral e também permite retomar naturalmente a ideia como sujeito da oração seguinte.
- source_word: εἰς αὐτὸν κυλισθήσεται
  choice: o mal rolará sobre ele
  rationale: A formulação conserva tanto o movimento dirigido contra o agente quanto a imagem concreta de algo que rola. A repetição de “o mal” explicita em português o sujeito retomado pelo verbo grego.
- source_word: καὶ οὐ μὴ ἐπιγνῷ
  choice: e ele de modo nenhum saberá
  rationale: A combinação οὐ μή com o subjuntivo aoristo expressa negação enfática. “De modo nenhum saberá” mantém essa força sem linguagem arcaica.
- source_word: πόθεν ἧκε αὐτῷ
  choice: de onde lhe veio
  rationale: A expressão portuguesa preserva a ideia da origem desconhecida e do mal que chega ou sobrevém à pessoa, com concisão natural.
theological_decisions:
- issue: A imagem retributiva do mal voltando contra quem o pratica
  choice: Conservar no texto a metáfora de o mal rolar sobre seu autor.
  alternative: Quem pratica o mal sofrerá suas consequências.
  rationale: A alternativa abstrata comunicaria a ideia geral, mas apagaria a imagem marcante do grego. A tradução mantém a tensão proverbial sem definir o mecanismo ou o momento dessa retribuição.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A metáfora concreta do original foi preservada, enquanto a ordem da frase foi ajustada à sintaxe portuguesa.
