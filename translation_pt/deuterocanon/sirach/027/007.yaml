  text: Do not praise a man before he speaks his mind[b][a], for this is the test of men.
translation:
  language: pt
  text: Não elogie uma pessoa antes de ela revelar o que pensa[a], pois essa é a prova das pessoas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou «antes da reflexão» ou «antes de se conhecer o raciocínio de uma pessoa». O grego diz literalmente: «Antes do pensamento/raciocínio, não elogie uma pessoa».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ λογισμοῦ
  choice: antes de ela revelar o que pensa
  rationale: λογισμός denota pensamento, raciocínio ou reflexão. No contexto do provérbio, o pensamento precisa tornar-se conhecido para servir de critério de avaliação; a formulação explicita essa força prática sem ocultar o sentido literal, registrado na nota.
- source_word: μὴ ἐπαινέσῃς
  choice: Não elogie
  rationale: O subjuntivo aoristo com μή expressa proibição. A forma de tratamento com «você» implícito é natural, atual e amplamente compreensível.
- source_word: ἄνδρα
  choice: uma pessoa
  rationale: Embora o grego use o masculino singular, o emprego é proverbial e geral. «Uma pessoa» comunica essa referência humana universal de modo natural em português.
- source_word: οὗτος
  choice: essa
  rationale: O demonstrativo retoma a circunstância mencionada anteriormente, isto é, conhecer o pensamento da pessoa antes de avaliá-la.
- source_word: πειρασμὸς
  choice: prova
  rationale: Neste contexto sapiencial, o termo significa teste ou meio de comprovar, não tentação.
- source_word: ἀνθρώπων
  choice: das pessoas
  rationale: O genitivo plural é mantido de forma concisa e inclusiva, em correspondência com o sentido humano geral do provérbio.
