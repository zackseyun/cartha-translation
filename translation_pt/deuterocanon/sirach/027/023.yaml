  text: Before your eyes his mouth speaks sweetly[a], and he will marvel at your words; but afterward he will twist his mouth and, in regard to your words, he will cause offense.
translation:
  language: pt
  text: Diante dos seus olhos, a boca dele falará com doçura, e ele mostrará grande admiração por suas palavras; mas depois torcerá a boca e, usando suas palavras, criará um tropeço para você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «em relação às suas palavras, causará ofensa». O grego também pode indicar que ele fará das suas palavras uma armadilha ou uma ocasião de queda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέναντι τῶν ὀφθαλμῶν σου
  choice: Diante dos seus olhos
  rationale: Preserva a imagem vívida do grego e comunica que isso ocorre diretamente na presença da pessoa.
- source_word: γλυκανεῖ στόμα σου
  choice: a boca dele falará com doçura
  rationale: O texto transmitido traz literalmente algo como «adoçará a sua boca», mas o contexto e o paralelismo apontam para a fala doce do indivíduo descrito; a formulação mantém a imagem corporal em português natural.
- source_word: ἐκθαυμάσει
  choice: mostrará grande admiração
  rationale: O verbo intensivo pode indicar admiração extraordinária; «mostrará» deixa perceptível, sem impor como certeza, o caráter ostensivo dessa reação no contexto da lisonja.
- source_word: ὕστερον δὲ
  choice: mas depois
  rationale: Marca com naturalidade o contraste temporal entre a lisonja presencial e a conduta posterior.
- source_word: διαστρέψει τὸ στόμα αὐτοῦ
  choice: torcerá a boca
  rationale: Conserva a metáfora corporal e a ideia de uma fala que se torna tortuosa ou hostil.
- source_word: ἐν τοῖς λόγοις σου
  choice: usando suas palavras
  rationale: Interpreta ἐν em sentido instrumental, adequado ao contexto, embora a construção também possa indicar esfera ou referência.
- source_word: δώσει σκάνδαλον
  choice: criará um tropeço para você
  rationale: Mantém a força causativa de δίδωμι e a imagem de σκάνδαλον como armadilha, obstáculo ou causa de queda, evitando reduzi-la à mera reação subjetiva de sentir-se ofendido.
