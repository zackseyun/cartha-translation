  text: A potter’s vessels are tested by the kiln[a], and likewise a man by his reasoning.
translation:
  language: pt
  text: Os vasos do oleiro são provados pelo forno; do mesmo modo, o homem é provado por seu raciocínio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por seus pensamentos” ou “em sua deliberação”; o paralelo grego traz “em sua deliberação”.
    reason: Alternativas lexicais para חֶשְׁבּוֹנוֹ, cujo sentido inclui pensamento, cálculo e deliberação.
lexical_decisions:
- source_word: כְּלֵי יוֹצֵר
  choice: os vasos do oleiro
  rationale: O plural construto designa os recipientes produzidos por um oleiro. “Vasos do oleiro” preserva a imagem concreta e soa natural em português.
- source_word: לְבָעֵר כִּבְשָׁן
  choice: são provados no forno
  rationale: A formulação hebraica é condensada. O paralelo grego afirma que o forno prova os vasos; a construção passiva comunica naturalmente que a queima revela a qualidade da cerâmica.
- source_word: וְכָמֹהוּ
  choice: do mesmo modo
  rationale: A expressão introduz a correspondência entre a prova dos vasos e a prova do homem.
- source_word: אִישׁ
  choice: o homem
  rationale: Mantém o singular masculino representativo do hebraico, em concordância com o caráter genérico do paralelo grego.
- source_word: עַל חֶשְׁבּוֹנוֹ
  choice: por seu raciocínio
  rationale: חֶשְׁבּוֹן pode indicar cálculo, reflexão ou raciocínio. O grego ἐν διαλογισμῷ αὐτοῦ confirma a ideia de pensamento ou deliberação; “raciocínio” conserva essa amplitude sem introduzir a noção distinta de prestação de contas.
theological_decisions:
- issue: Linguagem antropológica e gênero gramatical
  choice: o homem
  alternative: a pessoa
  rationale: O hebraico emprega אִישׁ no masculino singular. A tradução preserva essa forma representativa, sem limitar o princípio sapiencial apenas aos homens.
- issue: Como o caráter humano é revelado
  choice: é provado por seu raciocínio
  alternative: é provado em sua deliberação
  rationale: A formulação mantém a analogia da prova pelo forno e deixa em aberto se o foco recai nos pensamentos, no processo deliberativo ou no raciocínio expresso, sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com construção paralela adequada ao caráter proverbial. “Forno” é preferível a “fornalha” no contexto específico da cerâmica. A repetição de “é provado” explicita em português o paralelismo elíptico do hebraico.
