  text: For just as a man has destroyed his enemy[a], so you have destroyed the friendship of your neighbor;
translation:
  language: pt
  text: Pois, assim como um homem destruiu o seu inimigo, assim você destruiu a amizade do seu próximo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a amizade com o seu próximo”. O genitivo grego τοῦ πλησίον pode indicar tanto a amizade pertencente ao próximo como a amizade mantida com ele.'
    reason: Preservar a ambiguidade sintática e relacional do genitivo grego.
lexical_decisions:
- source_word: καθὼς γὰρ
  choice: Pois, assim como
  rationale: Preserva tanto a função explicativa de γάρ como a estrutura comparativa introduzida por καθώς, em português natural.
- source_word: ἀπώλεσεν / ἀπώλεσας
  choice: destruiu / destruiu
  rationale: Mantém a repetição enfática do mesmo verbo grego e sua forte ideia de causar perda ou ruína, sem suavizá-la para “prejudicou” ou “rompeu”.
- source_word: ἄνθρωπος
  choice: um homem
  rationale: Conserva o singular masculino genérico da formulação proverbial grega; a masculinidade não é apresentada como o ponto da comparação.
- source_word: τὸν ἐχθρὸν αὐτοῦ
  choice: o seu inimigo
  rationale: Equivalência direta e idiomática que preserva o contraste retórico entre inimigo e amizade.
- source_word: οὕτως
  choice: assim
  rationale: Retoma explicitamente a comparação e reproduz o paralelismo καθώς... οὕτως.
- source_word: τὴν φιλίαν
  choice: a amizade
  rationale: Expressa o vínculo concreto mencionado com artigo definido, preservando a força relacional do substantivo.
- source_word: τοῦ πλησίον
  choice: do seu próximo
  rationale: “Próximo” é a equivalência corrente no contexto ético judaico-grego. O possessivo torna clara em português a relação com a pessoa interpelada, enquanto a nota registra a ambiguidade do genitivo.
theological_decisions:
- issue: Masculino genérico na máxima proverbial
  choice: um homem
  alternative: alguém; uma pessoa
  rationale: A tradução conserva a forma representativa masculina de ἄνθρωπος sem afirmar que o ensino se limite aos homens.
- issue: Intensidade da perda relacional
  choice: destruiu a amizade
  alternative: arruinou a amizade; rompeu a amizade
  rationale: A repetição de ἀπόλλυμι estabelece deliberadamente uma comparação forte entre destruir um inimigo e destruir uma amizade; um verbo mais brando reduziria essa tensão.
- issue: Ambiguidade do genitivo τοῦ πλησίον
  choice: a amizade do seu próximo
  alternative: a amizade com o seu próximo
  rationale: A leitura principal mantém formalmente o genitivo como relação possessiva, enquanto a nota preserva a possibilidade de se tratar da amizade mantida com o próximo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição de “assim” e “destruiu” foi mantida para reproduzir o paralelismo e a força retórica do grego.
