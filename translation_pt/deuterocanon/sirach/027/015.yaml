  text: The quarrel of the proud is bloodshed[a], and their reviling is grievous to hear.
translation:
  language: pt
  text: A luta dos orgulhosos é derramamento de sangue[a], e seus insultos são penosos de ouvir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O combate dos orgulhosos é derramamento de sangue, e sua troca de insultos é uma notícia má.” Os termos gregos também admitem essa tradução mais formal.'
    reason: alternativa lexical
lexical_decisions:
- source_word: ἔκχυσις αἵματος
  choice: derramamento de sangue
  rationale: A expressão grega significa literalmente o derramar de sangue; a formulação portuguesa é natural e mantém a força violenta da imagem.
- source_word: μάχη
  choice: luta
  rationale: Pode indicar batalha, combate ou contenda. “Luta” preserva a possibilidade de confronto físico sem restringir o texto a uma guerra formal.
- source_word: ὑπερηφάνων
  choice: dos orgulhosos
  rationale: Designa pessoas caracterizadas por orgulho ou arrogância. “Orgulhosos” é claro, conciso e mantém a avaliação moral do grego.
- source_word: διαλοιδόρησις
  choice: insultos
  rationale: O substantivo denota fala injuriosa ou ultrajante. “Insultos” comunica isso de maneira direta e corrente.
- source_word: ἀκοὴ μοχθηρά
  choice: penosos de ouvir
  rationale: Embora ἀκοή também possa significar “notícia” ou “relato”, no contexto a expressão pode descrever algo ruim ou aflitivo para a audição. A tradução mantém essa leitura idiomática sem ocultar a alternativa.
theological_decisions:
- issue: Caracterização moral da violência e da fala dos orgulhosos
  choice: 'Apresentar o versículo como uma observação sapiencial: a luta dos orgulhosos resulta em sangue, e seus insultos afligem quem os ouve.'
  alternative: 'Traduzir mais formalmente: “O combate dos orgulhosos é derramamento de sangue, e sua troca de insultos é uma notícia má.”'
  rationale: O grego sustenta tanto uma formulação mais literal quanto a leitura proverbial adotada. O texto principal expressa com naturalidade o paralelismo entre violência física e agressão verbal, sem introduzir uma interpretação confessional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Acaba em” torna explícita a relação proverbial provável entre a luta e o derramamento de sangue; a nota conserva a construção nominal mais formal e a possível acepção de ἀκοή como “notícia” ou “relato”.
