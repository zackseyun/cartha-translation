translation:
  language: pt
  text: Quem cava uma cova cairá nela, e quem arma uma cilada será apanhado nela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὀρύσσων
  choice: quem cava
  rationale: O particípio presente com artigo tem sentido substantivado e genérico. “Quem cava” soa natural em português e preserva a força proverbial.
- source_word: βόθρον
  choice: uma cova
  rationale: “Cova” representa bem uma cavidade escavada que pode servir de armadilha e mantém a imagem concreta do provérbio.
- source_word: εἰς αὐτὸν
  choice: nela
  rationale: O pronome retoma βόθρον pelo sentido. Em português, “nela” expressa de modo conciso e idiomático o movimento para dentro da cova.
- source_word: ἐμπεσεῖται
  choice: cairá
  rationale: O futuro de ἐμπίπτω indica que a pessoa cairá para dentro; a direção já está expressa por “nela”.
- source_word: ὁ ἱστῶν
  choice: quem arma
  rationale: No contexto de παγίδα, ἵστημι significa preparar ou instalar uma armadilha. “Armar uma cilada” é uma combinação corrente e clara em português.
- source_word: παγίδα
  choice: uma cilada
  rationale: “Cilada” conserva o caráter intencional e proverbial da imagem, sem reduzir o termo a uma armadilha meramente mecânica.
- source_word: ἐν αὐτῇ
  choice: por ela
  rationale: O feminino retoma “cilada”. Embora o grego use ἐν, em português “apanhado por ela” comunica naturalmente o meio pelo qual a pessoa é presa; “nela” também seria possível, mas menos fluente com “cilada”.
- source_word: ἁλώσεται
  choice: será apanhado
  rationale: O futuro passivo de ἁλίσκομαι, em contexto de armadilha, significa ser capturado. “Será apanhado” é claro, atual e mantém a voz passiva.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com estrutura paralela e concisão proverbial. A repetição de “quem” preserva o caráter genérico das duas orações.
