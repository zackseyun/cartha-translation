  text: The fruit shows the cultivation of a tree[a]; so a man's reasoning shows the inclination of his heart.
translation:
  language: pt
  text: O fruto revela o cultivo de uma árvore; assim, o raciocínio revela a inclinação de uma pessoa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, o hebraico diz: “raciocínio [sobre/a respeito da] inclinação de alguém”. O paralelo grego traz: “a palavra do pensamento do coração de uma pessoa”.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֲבֹדַת עֵץ
  choice: como a árvore foi cultivada
  rationale: A expressão hebraica combina “trabalho/serviço” e “árvore”. No provérbio, indica o cultivo ou cuidado dispensado à árvore, sentido também apoiado pelo grego γεώργιον ξύλου. A formulação verbal é mais natural em português.
- source_word: פֶרִי
  choice: fruto
  rationale: É o termo agrícola comum e preserva tanto a imagem concreta quanto a força proverbial.
- source_word: חֶשְׁבּוֹן
  choice: raciocínio
  rationale: O termo pode indicar cálculo, consideração ou pensamento. “Raciocínio” conserva o aspecto mental, sem reduzi-lo simplesmente a fala, enquanto o paralelo grego sugere sua expressão perceptível.
- source_word: יֵצֶר
  choice: inclinação
  rationale: Designa a disposição ou impulso formado no íntimo da pessoa. “Inclinação” preserva essa nuance antropológica sem acrescentar conotação doutrinária posterior.
- source_word: אֶחָד
  choice: de uma pessoa
  rationale: O hebraico diz literalmente “de um/de alguém”. A expressão genérica “de uma pessoa” é clara e concorda com o grego ἀνθρώπου, sem restringir o sentido ao sexo masculino.
theological_decisions:
- issue: Linguagem antropológica e gênero
  choice: uma pessoa ... seu coração
  alternative: um homem ... seu coração
  rationale: O hebraico אֶחָד refere-se a alguém ou a um indivíduo, e o grego ἀνθρώπου pode ter sentido humano genérico. “Uma pessoa” comunica esse alcance sem tornar o provérbio masculino-exclusivo.
- issue: Menção explícita do coração
  choice: inclinação do seu coração
  alternative: inclinação de uma pessoa
  rationale: “Coração” não aparece explicitamente no texto hebraico preservado, mas consta no paralelo grego e torna clara, sem eliminar a tensão textual, a referência à disposição interior. A nota registra a diferença entre os testemunhos.
translation_notes:
  register: Português moderno, claro e digno, com fluência natural para leitores brasileiros e ampla inteligibilidade internacional. A estrutura paralela do provérbio foi preservada; “mostra” e “revela” evitam repetição mecânica sem alterar a relação entre sinal exterior e condição interior.
