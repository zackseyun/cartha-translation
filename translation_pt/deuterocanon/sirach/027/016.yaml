  text: Whoever reveals secrets destroys trust[b][a], and will never find a friend for his soul.
translation:
  language: pt
  text: Quem revela segredos[a] destrói a confiança e jamais encontrará um amigo para a sua alma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «mistérios» ou «confidências».
    reason: lexical_alternative
  - marker: b
    text: Em grego, «para a sua alma»; expressão que pode indicar um amigo verdadeiramente íntimo ou profundamente adequado à própria pessoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀποκαλύπτων
  choice: Quem revela
  rationale: O particípio presente substantivado expressa uma máxima geral sobre quem se caracteriza por essa prática; «Quem revela» é natural e preserva a força proverbial.
- source_word: μυστήρια
  choice: segredos
  rationale: Neste contexto sapiencial, refere-se a assuntos privados confiados a alguém, não necessariamente a mistérios religiosos. «Segredos» é claro e direto.
- source_word: ἀπώλεσεν
  choice: destrói
  rationale: Embora o grego use o aoristo, em uma máxima proverbial o presente português comunica naturalmente a consequência apresentada como certa e decisiva.
- source_word: πίστιν
  choice: a confiança
  rationale: 'O contexto é relacional: divulgar segredos rompe a confiança entre pessoas. Esta tradução evita um sentido teológico de «fé» que o contexto não exige.'
- source_word: οὐ μὴ εὕρῃ
  choice: jamais encontrará
  rationale: A construção οὐ μή com o subjuntivo exprime negação futura enfática; «jamais encontrará» preserva essa força em português corrente e digno.
- source_word: φίλον
  choice: um amigo
  rationale: O singular indefinido se ajusta naturalmente ao caráter geral do provérbio.
- source_word: πρὸς τὴν ψυχὴν αὐτοῦ
  choice: para a sua alma
  rationale: Mantém a imagem concreta e a ambiguidade do grego, que pode indicar um amigo íntimo, profundamente ligado à pessoa ou adequado ao seu próprio ser; a nota esclarece o idioma sem resolvê-lo no texto.
theological_decisions:
- issue: Sentido de πίστιν em contexto sapiencial não teológico
  choice: a confiança
  alternative: a fé; a fidelidade
  rationale: O tema é a revelação de segredos e a consequente perda de amizade. O sentido relacional de confiança é o mais adequado e não introduz conotações doutrinárias estranhas ao contexto.
- issue: Imagem antropológica em πρὸς τὴν ψυχὴν αὐτοῦ
  choice: para a sua alma
  alternative: íntimo; adequado a si; para si mesmo
  rationale: A tradução conserva «alma» e a tensão semântica da expressão grega, em vez de reduzir a frase a uma única interpretação. A nota oferece as possibilidades idiomáticas.
- issue: Forma masculina do sujeito proverbial
  choice: sua alma
  alternative: a alma dele; para si
  rationale: O português permite que «quem» e o possessivo «sua» expressem a máxima de modo geral, sem acrescentar marcação de gênero nem apagar a referência singular.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O presente proverbial em «destrói» soa natural, enquanto «jamais encontrará» preserva a negação enfática. A expressão menos comum «para a sua alma» foi mantida deliberadamente para conservar a imagem e a ambiguidade do original, com esclarecimento em nota.
