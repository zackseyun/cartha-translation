  source_fidelity: 'A tradução preserva a estrutura e o sentido central do grego: os que se alegram com a queda dos εὐσεβεῖς serão apanhados numa armadilha, e a ὀδύνη os consumirá antes de morrerem. Contudo, “dos que temem a Deus” explicita εὐσεβῶν de modo mais interpretativo do que o necessário; o termo designa os piedosos/devotos, sem empregar diretamente a expressão grega usual para “temer a Deus”.'
  naturalness: A redação é clara, fluente e apropriada ao português moderno. “Serão apanhados numa armadilha” e “a dor os consumirá” preservam bem as imagens do original. “Antes da morte deles” torna explícita a referência plural sem perder a construção distributiva.
