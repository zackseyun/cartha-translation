  text: Those who rejoice at the fall of the godly will be caught in a trap[a], and pain will consume them before their death.
translation:
  language: pt
  text: Os que se alegram com a queda dos piedosos[a] serão apanhados numa armadilha, e a dor os consumirá antes da morte deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “dos devotos” ou “dos que temem a Deus”. Grego: εὐσεβῶν.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παγίδι
  choice: numa armadilha
  rationale: O dativo singular indica aquilo em que são apanhados. “Armadilha” é corrente em português e preserva a imagem concreta.
- source_word: ἁλώσονται
  choice: serão apanhados
  rationale: O futuro passivo exprime ser capturado; “apanhados” combina naturalmente com a imagem da armadilha.
- source_word: οἱ εὐφραινόμενοι
  choice: os que se alegram
  rationale: O particípio substantivado descreve os que sentem alegria ou prazer diante da queda alheia.
- source_word: πτώσει
  choice: com a queda
  rationale: A construção traduz de modo natural o motivo da alegria, sem ampliar “queda” para uma ruína necessariamente definitiva.
- source_word: εὐσεβῶν
  choice: dos que temem a Deus
  rationale: Expressa em linguagem bíblica acessível a devoção e reverência religiosa de εὐσεβής; a nota registra alternativas mais compactas.
- source_word: ὀδύνη
  choice: a dor
  rationale: “Dor” mantém aberta a possibilidade de sofrimento físico ou emocional presente no termo grego.
- source_word: καταναλώσει
  choice: consumirá
  rationale: Preserva a metáfora forte de consumir ou gastar por completo.
- source_word: πρὸ τοῦ θανάτου αὐτῶν
  choice: antes de sua morte
  rationale: Reproduz diretamente a relação temporal do grego; o singular distributivo é natural em português.
theological_decisions:
- issue: Tradução de εὐσεβῶν na literatura sapiencial
  choice: dos que temem a Deus
  alternative: dos piedosos; dos devotos
  rationale: A opção comunica claramente a orientação religiosa do termo sem usar “piedoso”, que pode soar afetado ou ambíguo no português atual, nem introduzir uma categoria confessional específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase e as imagens de armadilha e consumo foram preservadas; evitou-se especificar se a dor é física ou emocional.
