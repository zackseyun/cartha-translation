translation:
  language: pt
  text: Entre as juntas das pedras será fincada uma estaca[a]; e entre a venda e a compra o pecado será esmagado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será fixada uma estaca”. O objeto também pode ser entendido como um pino ou uma cavilha.'
    reason: lexical_alternative
  - marker: b
    text: 'O grego diz literalmente “será esmagado”. A imagem é difícil: assim como uma estaca é firmada entre as juntas das pedras, o pecado aparece sob a pressão existente entre vender e comprar.'
    reason: textual_explanation
lexical_decisions:
- source_word: ἀνὰ μέσον
  choice: entre
  rationale: A expressão, repetida nos dois membros, indica posição entre elementos e sustenta o paralelismo do provérbio.
- source_word: ἁρμῶν λίθων
  choice: juntas das pedras
  rationale: Ἁρμός designa o ponto de união ou encaixe; “juntas” preserva a imagem concreta da alvenaria.
- source_word: παγήσεται
  choice: será fincada
  rationale: O futuro passivo de πήγνυμι indica que a estaca é firmemente fixada. “Fincada” conserva a força da ação sem especificar um método não declarado.
- source_word: πάσσαλος
  choice: estaca
  rationale: O termo pode designar estaca, pino ou cavilha. “Estaca” é claro em português e mantém a concretude do objeto, embora seu tamanho exato permaneça indefinido.
- source_word: πράσεως καὶ ἀγορασμοῦ
  choice: da venda e da compra
  rationale: Os substantivos nomeiam os dois lados de uma transação. “Venda” e “compra” formam o par comercial mais direto e natural.
- source_word: συντριβήσεται
  choice: será esmagado
  rationale: O futuro passivo de συντρίβω exprime quebrar, triturar ou esmagar. A tradução mantém o verbo efetivamente atestado, em vez de substituí-lo pela ideia interpretativa de ficar encravado.
- source_word: ἁμαρτία
  choice: pecado
  rationale: “Pecado” conserva a força moral e teológica do termo sem restringi-lo previamente a fraude comercial.
theological_decisions:
- issue: Força moral de ἁμαρτία no contexto comercial
  choice: pecado
  alternative: fraude ou injustiça nos negócios
  rationale: O texto fala de falha moral em termos amplos. A tradução não limita o pecado a uma modalidade comercial específica que o grego não explicita.
- issue: Sentido da imagem no segundo membro
  choice: o pecado será esmagado
  alternative: o pecado ficará encravado
  rationale: O paralelo com a estaca pode sugerir pressão ou inserção, mas συντριβήσεται significa literalmente “será esmagado/quebrado”. Preserva-se a tensão da formulação grega, sem harmonizar silenciosamente os dois membros.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Conservou-se a estrutura paralela e proverbial do grego. A ordem do segundo membro foi levemente ajustada para soar natural em português, sem eliminar a ambiguidade da imagem.
