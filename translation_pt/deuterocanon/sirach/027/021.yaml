  text: For a wound may be bound up, and after insults there may be reconciliation; but one who has revealed secrets has lost hope.
translation:
  language: pt
  text: Pois uma ferida pode ser enfaixada, e depois de insultos pode haver reconciliação; mas quem revelou segredos perdeu a esperança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficou sem esperança” ou “desesperou”. O grego não diz que esperança foi perdida; no contexto, provavelmente se trata da esperança de recuperar a confiança depois de revelar algo confidencial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τραῦμά
  choice: uma ferida
  rationale: Preserva a imagem concreta de uma lesão física que pode ser tratada e sustenta o contraste com o dano relacional.
- source_word: καταδῆσαι
  choice: pode ser enfaixada
  rationale: Expressa naturalmente o ato de atar ou pôr faixa numa ferida, reproduzindo a construção grega de possibilidade sem paráfrase excessiva.
- source_word: λοιδορίας
  choice: insultos
  rationale: Termo atual e claro para agressões verbais, sem a formalidade de alternativas como “injúrias” ou “impropérios”.
- source_word: διαλλαγή
  choice: reconciliação
  rationale: Designa o restabelecimento das relações depois de um conflito e conserva o sentido relacional do substantivo grego.
- source_word: ἀποκαλύψας
  choice: quem revelou
  rationale: O particípio aoristo apresenta a revelação como ato consumado que conduz ao estado descrito no fim do provérbio.
- source_word: μυστήρια
  choice: segredos
  rationale: Neste contexto sapiencial, refere-se a assuntos confidenciais, não a mistérios revelatórios ou apocalípticos.
- source_word: ἀφήλπισεν
  choice: perdeu a esperança
  rationale: Mantém sem objeto explícito a formulação sucinta do grego, que pode indicar ter perdido a esperança, desesperado ou ficado sem esperança.
theological_decisions:
- issue: Sentido da oração final ὁ δὲ ἀποκαλύψας μυστήρια ἀφήλπισεν
  choice: A pessoa que revelou segredos perdeu a esperança, sem explicitar no texto principal o objeto dessa esperança.
  alternative: A pessoa caiu pessoalmente em desespero; ou ficou irremediavelmente sem esperança em sentido moral absoluto.
  rationale: O contexto sugere sobretudo a perda da esperança de restaurar a confiança ou a relação após trair uma confidência, mas o grego não declara o objeto. A tradução e a nota preservam essa abertura sem absolutizar o juízo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Enfaixada” preserva a imagem médica; “depois de insultos” segue de perto a relação sintática do grego; a oração final mantém deliberadamente sua ambiguidade.
