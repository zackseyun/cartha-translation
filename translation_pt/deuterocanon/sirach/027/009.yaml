  text: Birds settle with their own kind[b][a], and truth returns to those who practice it.
translation:
  language: pt
  text: As aves pousarão com as que lhes são semelhantes,[a] e a verdade voltará para os que a praticam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “As aves se alojarão com as que são semelhantes a elas.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a verdade voltará aos que a põem em prática”. O grego personifica a verdade e diz que ela retorna aos que a praticam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πετεινὰ
  choice: as aves
  rationale: O neutro plural designa aves em geral; “as aves” é natural em português e preserva a imagem proverbial.
- source_word: πρὸς τὰ ὅμοια αὐτοῖς
  choice: junto às que lhes são semelhantes
  rationale: Mantém de modo claro a ideia de afinidade e semelhança expressa pelo grego, sem restringi-la indevidamente a espécie biológica.
- source_word: καταλύσει
  choice: pousam
  rationale: O verbo pode significar alojar-se, deter-se ou repousar. No contexto de aves, “pousam” comunica naturalmente a chegada a um lugar de descanso; o presente proverbial é idiomático em português.
- source_word: ἀλήθεια
  choice: a verdade
  rationale: Preserva a amplitude do substantivo grego e sua personificação no provérbio.
- source_word: πρὸς τοὺς ἐργαζομένους αὐτὴν
  choice: para os que a praticam
  rationale: Com “verdade” como objeto, “praticam” exprime a verdade posta em ação de forma clara e corrente.
- source_word: ἐπανήξει
  choice: volta
  rationale: Conserva o sentido específico de retornar ou vir de novo, bem como a reciprocidade moral da afirmação.
theological_decisions:
- issue: Personificação da verdade e reciprocidade ética
  choice: A verdade “volta” para os que a praticam.
  alternative: A verdade vem aos que a praticam; a verdade se associa aos que a praticam.
  rationale: O verbo grego indica retorno, não apenas chegada ou associação. A formulação conserva a personificação e a tensão própria da lógica moral sapiencial sem explicar além do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo proverbial foi preservado. “Junto às que lhes são semelhantes” evita a possível especificidade excessiva de “da mesma espécie”, enquanto “pousam” torna natural a imagem das aves.
