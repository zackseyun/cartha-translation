  text: When a sieve is shaken[a], the refuse remains; so a person's filth is revealed in his thoughts.
translation:
  language: pt
  text: Quando se sacode uma peneira, o esterco fica; assim, os detritos de uma pessoa ficam no seu raciocínio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o lixo de uma pessoa permanece em seu pensamento”. Os termos gregos podem designar esterco, lixo, rejeitos ou excrementos; a comparação retrata o material desprezível que fica retido quando se peneira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν σείσματι κοσκίνου
  choice: Quando se sacode uma peneira
  rationale: A construção preposicional é expressa de modo temporal e proverbial, natural em português, sem perder a imagem concreta do peneiramento.
- source_word: διαμενεῖ
  choice: fica
  rationale: O verbo indica permanecer ou ficar para trás; a forma concisa mantém o paralelismo entre as duas partes.
- source_word: κοπρία
  choice: o esterco
  rationale: O substantivo designa propriamente esterco ou excremento. A tradução conserva a linguagem áspera da imagem grega, em vez de suavizá-la como mero resíduo.
- source_word: οὕτως
  choice: assim
  rationale: Marca de modo direto a comparação entre a peneira e o raciocínio humano.
- source_word: σκύβαλα
  choice: os detritos
  rationale: O termo pode designar lixo, rejeitos ou excrementos. “Detritos” preserva a noção de material desprezível retido, sem impor exclusivamente um sentido moral ou fecal.
- source_word: ἀνθρώπου
  choice: de uma pessoa
  rationale: Embora o substantivo grego esteja no singular, pode ter referência humana genérica; “uma pessoa” comunica essa abrangência com naturalidade no português atual.
- source_word: ἐν λογισμῷ αὐτοῦ
  choice: no seu raciocínio
  rationale: λογισμός pode indicar pensamento, reflexão ou raciocínio. “Raciocínio” mantém a ideia de atividade mental e a ambiguidade sobre se os detritos permanecem ou se tornam perceptíveis nela.
theological_decisions:
- issue: Natureza da correspondência entre os detritos e o raciocínio humano
  choice: ficam no seu raciocínio
  alternative: são revelados em seus pensamentos
  rationale: O grego não contém um verbo explícito equivalente a “revelar” na segunda oração; o verbo διαμενεῖ da primeira é naturalmente suprido. A tradução conserva essa elipse e evita transformar a imagem em uma afirmação interpretativa sobre revelação do caráter.
- issue: Referência genérica de ἀνθρώπου
  choice: de uma pessoa
  alternative: de um homem
  rationale: No provérbio, ἄνθρωπος é genérico e se aplica ao ser humano; a formulação inclusiva preserva o alcance sem introduzir uma restrição masculina.
translation_notes:
  register: Português contemporâneo, digno e acessível, com estrutura proverbial concisa. Conservou-se a aspereza da primeira imagem e a elipse verbal do grego; a nota registra alternativas lexicais sem resolver indevidamente a ambiguidade.
