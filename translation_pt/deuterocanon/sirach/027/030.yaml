  text: Resentment and anger—these also are abominations[b][a], and a sinful man will cling to them.
translation:
  language: pt
  text: Rancor e ira também são abominações, e o homem pecador se apegará a elas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “será ἐγκρατής delas”. A expressão grega é difícil: pode sugerir que o pecador as retém ou se apega a elas; tomada no sentido habitual do adjetivo, poderia significar “terá domínio sobre elas”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Μῆνις
  choice: rancor
  rationale: Expressa uma ira profunda, persistente e potencialmente vingativa, distinguindo-se de ὀργή; em português moderno, “rancor” comunica bem essa disposição duradoura.
- source_word: ὀργή
  choice: ira
  rationale: Termo geral para cólera ou indignação intensa. “Ira” preserva o peso moral do contexto e forma uma combinação natural com “rancor”.
- source_word: βδελύγματα
  choice: abominações
  rationale: Mantém a forte reprovação moral e religiosa do substantivo grego, sem atenuá-lo para simples coisas desagradáveis.
- source_word: ἀνὴρ ἁμαρτωλὸς
  choice: o homem pecador
  rationale: Conserva o masculino singular explícito e a construção adjetival do grego, em linguagem bíblica clara e corrente.
- source_word: ἐγκρατὴς ἔσται αὐτῶν
  choice: se apegará a elas
  rationale: A expressão grega é difícil. No contexto negativo, entende-se que o pecador retém essas paixões ou se mantém preso a elas; “se apegará” comunica essa ideia naturalmente sem ocultar a incerteza, registrada em nota.
theological_decisions:
- issue: Valor antropológico e de gênero de ἀνήρ
  choice: o homem pecador
  alternative: a pessoa pecadora
  rationale: O grego emprega um substantivo masculino singular. A tradução preserva essa forma sem afirmar que a advertência moral se limite aos homens.
- issue: Sentido de ἐγκρατής com genitivo em contexto moral negativo
  choice: se apegará a elas
  alternative: terá domínio sobre elas
  rationale: O sentido usual de autocontrole produziria aqui uma tensão difícil, pois rancor e ira acabam de ser condenados. A leitura adotada entende a expressão como retenção firme dessas paixões, mas a nota preserva a dificuldade lexical e a alternativa mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Rancor e ira” distingue as duas palavras gregas; os travessões preservam a ênfase parentética. A ambiguidade da expressão final é explicitada em nota.
