  text: The talk of fools is offensive[b][a], and their laughter is in the indulgence of sin.
translation:
  language: pt
  text: A fala dos tolos é irritante[a], e seu riso está na indulgência pecaminosa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A fala dos tolos é um incômodo”, entendendo προσόχθισμα no sentido de aborrecimento ou contrariedade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e seu riso está na dissipação do pecado”. σπατάλη pode indicar luxo, satisfação desenfreada dos desejos ou vida dissipada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διήγησις
  choice: conversa
  rationale: O substantivo pode designar relato, exposição ou discurso. Neste contexto sapiencial, “conversa” expressa com naturalidade aquilo que os tolos dizem, sem restringir o sentido a uma narração formal.
- source_word: μωρῶν
  choice: dos tolos
  rationale: “Tolos” conserva a categoria moral e intelectual característica da literatura sapiencial, em vez de reduzi-la a mera falta de inteligência.
- source_word: προσόχθισμα
  choice: motivo de irritação
  rationale: O termo designa algo que causa desagrado, incômodo ou repulsa. A expressão portuguesa mantém a forma nominal do grego e comunica seu efeito desagradável.
- source_word: γέλως
  choice: riem
  rationale: O substantivo grego significa literalmente “riso”. A construção verbal “eles riem” torna a segunda oração natural em português, sem acrescentar a ideia específica de zombaria.
- source_word: ἐν
  choice: em meio aos
  rationale: A preposição indica a esfera ou o ambiente em que ocorre o riso. “Em meio aos” preserva essa relação de contexto de modo idiomático.
- source_word: σπατάλῃ
  choice: excessos
  rationale: O termo pode indicar luxo, dissipação, vida desenfreada ou satisfação indulgente dos desejos. “Excessos” transmite sua carga de desregramento e evita a possível leitura positiva de “indulgência” em português.
- source_word: ἁμαρτίας
  choice: do pecado
  rationale: A tradução direta mantém a categoria moral e teológica explícita do grego e permite que o genitivo qualifique os excessos.
theological_decisions:
- issue: Força moral da terminologia sapiencial
  choice: “tolos” e “pecado”
  alternative: “insensatos” e “maldade”
  rationale: O texto apresenta categorias moralmente fortes. “Tolos” pertence ao vocabulário tradicional da sabedoria bíblica, e “pecado” traduz diretamente ἁμαρτία sem atenuar seu peso.
- issue: Relação entre o riso e a conduta pecaminosa
  choice: “riem em meio aos excessos do pecado”
  alternative: “seu riso consiste nos excessos do pecado”
  rationale: A preposição ἐν permite entender os excessos pecaminosos como a esfera ou o ambiente do riso. A tradução escolhida preserva essa relação sem afirmar, além do texto, que o riso e os excessos sejam rigorosamente idênticos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A segunda oração foi levemente reestruturada para evitar a construção pouco natural “o riso deles está em”, preservando-se, porém, a noção grega de esfera ou ambiente. Os marcadores [a] e [b] aparecem no texto principal.
