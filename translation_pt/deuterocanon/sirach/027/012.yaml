  text: Among the senseless[a], watch for the right time; but among the thoughtful, be constant.
translation:
  language: pt
  text: No meio dos insensatos[a], aguarde o momento oportuno; mas, no meio de quem reflete, permaneça continuamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Entre os que não têm entendimento, fique atento ao momento oportuno; mas, junto de quem tem discernimento, permaneça continuamente.”'
    reason: Alternativas lexicais possíveis para ἀσυνέτων, συντήρησον καιρόν, διανοουμένου e ἐνδελέχιζε.
lexical_decisions:
- source_word: ἀσυνέτων
  choice: insensatos
  rationale: O adjetivo substantivado no genitivo plural designa pessoas sem entendimento ou bom senso. “Insensatos” conserva a dimensão intelectual e moral do termo e forma um contraste natural com quem reflete.
- source_word: συντήρησον καιρόν
  choice: aguarde o momento oportuno
  rationale: συντηρέω exprime guardar, observar atentamente ou esperar, enquanto καιρός indica o momento adequado, não o tempo cronológico. A formulação comunica cautela e atenção à ocasião apropriada sem explicitar além do grego o comportamento esperado.
- source_word: διανοουμένου
  choice: quem reflete
  rationale: O particípio singular de διανοέομαι retrata uma pessoa que pensa, pondera ou entende. “Quem reflete” preserva o caráter ativo da forma verbal e evita restringi-la apenas à inteligência inata.
- source_word: ἐνδελέχιζε
  choice: permaneça assiduamente
  rationale: O imperativo transmite continuidade, persistência ou dedicação constante. “Permaneça assiduamente” mantém essa força durativa sem determinar de modo indevido qual atividade deve ser contínua.
- source_word: εἰς μέσον ... εἰς μέσον δέ
  choice: no meio de ... mas, no meio de
  rationale: A repetição significa literalmente estar ou entrar no meio de determinado grupo. “No meio de” conserva a imagem grega e o contraste marcado por δέ, sendo natural em português.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção paralela do grego foi mantida; o singular de διανοουμένου foi reproduzido por “quem reflete”, e a ação implícita em ἐνδελέχιζε não foi especificada.
