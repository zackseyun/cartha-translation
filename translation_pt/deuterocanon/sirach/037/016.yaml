  text: A vain laborer for his work[a], a vain guard for one who brings forth evil.
translation:
  language: pt
  text: Um trabalhador vão em seu trabalho,[a] um guarda vão para quem produz o mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz, em vez disso: “E, acima de tudo isso, ore ao Altíssimo, para que ele dirija o seu caminho na verdade.” O hebraico e o grego diferem substancialmente neste ponto.'
    reason: textual_variant
lexical_decisions:
- source_word: פועל
  choice: trabalhador
  rationale: O substantivo designa aquele que trabalha ou realiza uma obra; “trabalhador” preserva o sentido concreto e o paralelismo com “guarda”.
- source_word: שוא
  choice: inútil
  rationale: O termo pode expressar vazio, falsidade, inutilidade ou coisa sem valor. “Inútil” comunica aqui a ideia de ineficácia e pode qualificar naturalmente os dois agentes.
- source_word: מלאכתו
  choice: seu trabalho
  rationale: A palavra se refere ao trabalho, ofício ou tarefa de alguém. “Seu trabalho” é natural, direto e formalmente próximo do hebraico.
- source_word: שומר
  choice: guarda
  rationale: A forma designa quem vigia ou guarda; “guarda” é conciso e mantém o paralelismo nominal com “trabalhador”.
- source_word: מוציא רע
  choice: quem produz o mal
  rationale: Literalmente, a expressão é “quem faz sair o mal”. Como a nuance exata da difícil linha hebraica é incerta, “produz o mal” permanece relativamente próxima sem reduzi-la simplesmente a “malfeitor”.
theological_decisions:
- issue: Divergência substancial entre o testemunho hebraico e o paralelo grego
  choice: Traduzir no texto principal o hebraico preservado e registrar o grego como leitura alternativa em nota.
  alternative: “E, acima de tudo isso, ore ao Altíssimo, para que ele dirija o seu caminho na verdade.”
  rationale: O hebraico existente é adotado como testemunho principal, mas a linha grega é inteiramente diferente, não uma simples variante menor. A nota conserva de modo transparente essa instabilidade textual sem harmonizar os testemunhos.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura proverbial breve. A repetição de “inútil” preserva o paralelismo do hebraico; a nota documenta a divergência textual decisiva.
