  source_fidelity: 'O texto principal reflete o hebraico preservado: פועל e שומר são mantidos como agentes paralelos, שוא é reproduzido nos dois membros, e מוציא רע permanece expresso de modo não interpretativo como alguém que produz o mal. A nota registra adequadamente que o grego oferece uma linha inteiramente distinta.'
