  source_fidelity: A formulação principal “qual é o interesse dele” privilegia uma interpretação contextual possível de צרכו, mas deixa de refletir diretamente o sentido básico de “necessidade/requisito”. Como o hebraico permite a nuance de interesse ou motivação, ela deve permanecer como alternativa em nota, não como a redação principal. “Proteja-se” e “de antemão” representam bem שמור נפשך e לפנים.
