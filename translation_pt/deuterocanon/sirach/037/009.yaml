  text: Guard yourself from a counselor[a], and know beforehand what his need is.
translation:
  language: pt
  text: Proteja-se de um conselheiro[a] e saiba de antemão qual é a necessidade dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “qual é o interesse dele”. O hebraico pode indicar não apenas uma necessidade em sentido estrito, mas também aquilo que interessa ou motiva o conselheiro. O paralelo grego desenvolve a ideia de outra maneira: “e ele ficará em frente para ver o que lhe acontecerá”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מיועץ
  choice: de quem lhe dá conselhos
  rationale: A preposição מן indica de quem é preciso guardar-se. A formulação verbal é natural em português moderno e conserva a função de יועץ sem sugerir necessariamente um cargo formal.
- source_word: שמור נפשך
  choice: Proteja-se
  rationale: A expressão significa literalmente guardar a própria pessoa/vida. “Proteja-se” transmite de modo idiomático a advertência reflexiva, sem restringi-la apenas à sobrevivência física.
- source_word: ודע לפנים
  choice: e procure saber de antemão
  rationale: לפנים tem aqui valor temporal, “antes/de antemão”. “Procure saber” expressa adequadamente a diligência prudente implicada no imperativo “saiba” em português natural.
- source_word: מה צרכו
  choice: qual é o interesse dele
  rationale: צרך pode designar necessidade, interesse ou aquilo que motiva alguém. No contexto de avaliar quem aconselha, “interesse” comunica com clareza a possível motivação pessoal, enquanto a nota preserva a tradução mais estrita “necessidade”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita o tom burocrático de “conselheiro” e mantém a cautela do hebraico. A divergência do paralelo grego é registrada em nota, sem substituir a leitura hebraica de alta confiança.
