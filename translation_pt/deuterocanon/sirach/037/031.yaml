  text: A wise man among his people will inherit honor, and his name will endure for everlasting life.
translation:
  language: pt
  text: Um sábio entre o povo herdará honra, e seu nome permanecerá na vida eterna.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu nome permanecerá para sempre”. O hebraico diz literalmente: “seu nome permanece na vida da eternidade”, expressão que pode indicar lembrança duradoura e também sugerir vida eterna.'
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego difere consideravelmente: “Por causa da ganância, muitos morreram, mas quem está atento prolongará a vida”. A tradução principal segue o testemunho hebraico preservado; o grego é mantido em vista como fonte paralela.'
    reason: alternative_reading
lexical_decisions:
- source_word: חכם
  choice: o sábio
  rationale: Traduz o substantivo/adjetivo masculino singular como uma pessoa sábia, com formulação natural e digna em português.
- source_word: עם
  choice: entre o seu povo
  rationale: Representa a relação social ou comunitária do sábio com o próprio povo; a preposição portuguesa «entre» comunica naturalmente essa inserção.
- source_word: ינחל
  choice: herdará
  rationale: Preserva a metáfora concreta de נחל, isto é, receber honra como herança ou posse duradoura.
- source_word: כבוד
  choice: honra
  rationale: Neste contexto sapiencial, indica estima e reconhecimento públicos com maior precisão que «glória».
- source_word: שמו
  choice: seu nome
  rationale: Mantém a imagem hebraica do nome, que pode abranger reputação e memória sem explicitar uma só interpretação.
- source_word: עומד
  choice: permanecerá
  rationale: Expressa idiomaticamente a continuidade do nome; corresponde ao sentido de «estar firme», «subsistir» ou «permanecer».
- source_word: בחיי עולם
  choice: para a vida eterna
  rationale: Conserva a linguagem de vida presente no hebraico e sua possível ressonância de eternidade, sem reduzir a expressão apenas a «para sempre».
theological_decisions:
- issue: Sentido de בחיי עולם
  choice: para a vida eterna
  alternative: para sempre; por todos os tempos; na vida eterna
  rationale: A expressão pode indicar memória ou renome permanente e também admitir ressonâncias de vida eterna. A tradução conserva a tensão do hebraico, enquanto a nota esclarece a ambiguidade sem impor uma doutrina escatológica plenamente definida.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é claro e digno. «O sábio» mantém o singular masculino do hebraico; «entre o seu povo» evita rigidez sintática; as notas preservam tanto a ambiguidade da frase final quanto a diferença substancial do paralelo grego.
