  text: A man's heart tells of his thoughts[b][a], more than seven watchmen on a lookout.
translation:
  language: pt
  text: O coração de uma pessoa revela suas inquietações[a] melhor do que sete sentinelas num posto de observação.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo hebraico traduzido por “inquietações” é incerto; também pode significar “preocupações”, “aflições” ou “pensamentos”.
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego difere substancialmente: “Há quem seja hábil nas palavras, mas odiado; esse ficará privado de todo alimento.”'
    reason: textual_variant
lexical_decisions:
- source_word: לב
  choice: coração
  rationale: Preserva a imagem antropológica hebraica, na qual o coração representa o íntimo da pessoa, incluindo pensamento, percepção e sentimento.
- source_word: אנוש
  choice: uma pessoa
  rationale: O substantivo singular designa genericamente um ser humano, por vezes salientando sua fragilidade; “uma pessoa” comunica aqui o alcance geral do provérbio em português natural.
- source_word: יגיד
  choice: revela
  rationale: O hifil de נגד significa contar, declarar ou dar a conhecer. “Revela” expressa de modo conciso que o coração torna perceptível o que se passa no íntimo.
- source_word: שעיותיו
  choice: suas inquietações
  rationale: A forma hebraica é incerta e pode indicar inquietações, preocupações, aflições ou pensamentos. “Inquietações” preserva a dimensão interior sem restringi-la apenas a ideias ou a sofrimentos externos.
- source_word: משבעה
  choice: mais do que sete
  rationale: A preposição מן tem aqui força comparativa, colocando a percepção do coração acima da vigilância de sete sentinelas.
- source_word: צופים
  choice: sentinelas
  rationale: O particípio de צפה designa pessoas que vigiam. “Sentinelas” é claro, corrente e adequado à imagem proverbial.
- source_word: על מצפה
  choice: num posto de observação
  rationale: מצפה designa um lugar elevado ou posto de onde se vigia. A tradução mantém a amplitude do termo sem pressupor especificamente uma torre.
