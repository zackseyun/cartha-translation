  text: Is there not grief that reaches to death[a], when a companion as your own soul turns into an enemy?
translation:
  language: pt
  text: Não há dor que chegue até a morte, quando um companheiro como a sua própria alma[a] se transforma em inimigo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo grego traz “um companheiro e amigo”, em lugar do hebraico “um companheiro como a sua própria alma”.
