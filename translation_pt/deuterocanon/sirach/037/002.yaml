lexical_decisions:
- source_word: הלא
  choice: Não há... ?
  rationale: Introduz uma pergunta retórica que espera concordância, em consonância com o grego οὐχί.
- source_word: דין
  choice: dor
  rationale: Neste contexto, o termo indica sofrimento emocional, sentido confirmado pelo grego λύπη; “dor” é natural em português e abrange pesar profundo.
- source_word: מגיע אל מות
  choice: chega até a morte
  rationale: Conserva a imagem hebraica de alcançar o limite da morte e corresponde ao grego ἕως θανάτου.
- source_word: רע
  choice: companheiro
  rationale: Expressa uma relação pessoal próxima sem antecipar toda a intensidade de כנפשך.
- source_word: כנפשך
  choice: que é como a sua própria alma
  rationale: Reproduz de modo claro a comparação hebraica e preserva a imagem de intimidade extrema, sem substituí-la pela variante grega “e amigo”.
- source_word: נהפך לצר
  choice: se transforma em inimigo
  rationale: Mantém tanto a reversão indicada pelo verbo quanto o caráter pessoal da hostilidade de צר.
