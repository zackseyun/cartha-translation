  text: Alas for an evil thought—why were you created, to fill the face of the world with deceit?
translation:
  language: pt
  text: Ai do pensamento mau! Por que foste criado para encher de engano a face do mundo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Ai do pensamento mau! De onde vieste rolando, para cobrir a terra seca com engano?” O grego apoia a interpretação do difícil termo hebraico como “pensamento” ou “plano” e traz “cobrir” onde o hebraico diz “encher”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוי
  choice: Ai de
  rationale: Interjeição de lamento e denúncia; «Ai de» conserva a força exclamativa em português atual e digno.
- source_word: רע יאמר
  choice: pensamento mau
  rationale: A forma hebraica transmitida é difícil se יאמר for derivado diretamente de «dizer». O paralelo grego ἐνθύμημα favorece «pensamento» ou «plano»; «pensamento mau» mantém a personificação e o sentido moral de רע.
- source_word: מדוע כן נוצרתי
  choice: Por que foste criado
  rationale: Reproduz a pergunta retórica dirigida ao pensamento personificado. O masculino concorda com «pensamento».
- source_word: למלא
  choice: encher
  rationale: Traduz diretamente o infinitivo hebraico. O grego traz «cobrir», variante preservada em nota.
- source_word: פני תבל
  choice: a face do mundo
  rationale: Preserva a imagem e o idiomatismo hebraico sem perder inteligibilidade em português.
- source_word: תרמית
  choice: engano
  rationale: Expressa fraude ou falsidade de modo conciso e natural, em consonância com o grego ἐν δολιότητι.
theological_decisions:
- issue: Uso do hebraico como testemunho principal, com o grego esclarecendo um termo difícil
  choice: Entender a expressão como referência a um «pensamento mau»
  alternative: «dito mau» ou «companheiro mau»
  rationale: O hebraico impresso é difícil em יאמר, enquanto o paralelo grego traz explicitamente «pensamento/plano mau». Essa leitura produz uma apóstrofe coerente sem eliminar a dificuldade textual, registrada na nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A exclamação inicial mantém o tom sapiencial de lamento e denúncia; a imagem hebraica «face do mundo» foi preservada.
