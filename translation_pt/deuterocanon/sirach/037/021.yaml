  text: And with all these things[a], pray earnestly to God, who will truly direct your steps.
translation:
  language: pt
  text: E, com tudo isso[a], suplique a Deus, que, em verdade, firmará seus passos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego diz: “Pois não lhe foi dada graça da parte do Senhor, porque foi privado de toda sabedoria.” O hebraico e o grego diferem substancialmente neste ponto; o texto principal segue o testemunho hebraico existente.'
    reason: textual_variant
lexical_decisions:
- source_word: ועם כל אלה
  choice: E, junto com tudo isso
  rationale: Preserva a força aditiva de ועם e liga naturalmente a exortação aos conselhos anteriores.
- source_word: עתר
  choice: suplique
  rationale: Expressa oração intensa e insistente, com mais força que o simples verbo “orar”, sem soar excessivamente arcaico.
- source_word: אל אל
  choice: a Deus
  rationale: Representa de modo idiomático a preposição seguida do título divino; não há aqui o nome pactual que justificaria “SENHOR”.
- source_word: אשר
  choice: que
  rationale: Pronome relativo natural em português para retomar Deus.
- source_word: יכין
  choice: firmará
  rationale: Mantém o sentido básico de estabelecer ou tornar firmes os passos, sem reduzir a expressão apenas à ideia interpretativa de orientação.
- source_word: באמת
  choice: na verdade
  rationale: Conserva a ambiguidade entre verdade, fidelidade e confiabilidade melhor que um advérbio português mais restritivo.
- source_word: צעדיך
  choice: os seus passos
  rationale: Preserva a metáfora hebraica, corrente em português para a conduta ou o curso da vida.
theological_decisions:
- issue: Relação entre os testemunhos hebraico e grego
  choice: Seguir no texto principal a exortação preservada no hebraico sobre súplica e ação divina nos passos humanos.
  alternative: 'O testemunho grego diz: “Pois não lhe foi dada graça da parte do Senhor, porque foi privado de toda sabedoria.”'
  rationale: O hebraico existente tem prioridade como fonte de Sirácida. Como o grego apresenta uma linha substancialmente diferente, a divergência é registrada em nota, sem harmonização nem substituição silenciosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Suplicar” comunica intensidade sem arcaísmo excessivo; “firmará na verdade os seus passos” preserva a metáfora e a tensão lexical do hebraico.
