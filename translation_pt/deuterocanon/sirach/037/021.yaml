  source_fidelity: 'O texto segue corretamente o hebraico: ועם כל אלה é adequadamente expresso por “com tudo isso”; עתר por “suplique”; e אל por “Deus”. “Firmará ... seus passos” preserva bem a imagem de יכין צעדיך. A locução באמת permanece aberta à ideia de verdade, certeza ou fidelidade; “em verdade” conserva essa amplitude sem forçar uma interpretação única.'
