  text: Every counselor says[b][a], “See!” but there is a counselor who trips him up.
translation:
  language: pt
  text: 'Todo conselheiro diz: “Veja!”[a], mas há conselheiro que pisa nele.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico “Veja!” é difícil e pode ser uma breve alegação de discernimento ou uma orientação enfática. O paralelo grego traz uma advertência mais extensa: proteja-se do conselheiro, pois ele também aconselha em benefício próprio.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “pisa sobre ele”. A expressão pode significar “aproveita-se dele” ou descrevê-lo como alguém que lhe causa dano. O referente de “nele” não é expresso no trecho hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: כל יועץ
  choice: Todo conselheiro
  rationale: O uso distributivo de כל combina com o caráter proverbial da frase, e “conselheiro” preserva a repetição do substantivo יועץ.
- source_word: אומר
  choice: diz
  rationale: O presente simples expressa naturalmente uma afirmação geral.
- source_word: חזה
  choice: Veja!
  rationale: A forma hebraica é breve e difícil. “Veja!” conserva seu caráter abrupto sem transformar a possível alegação de discernimento em uma interpretação mais definida.
- source_word: אך
  choice: mas
  rationale: Marca de modo direto a contraposição entre a afirmação geral e a advertência seguinte.
- source_word: דורך עליו
  choice: pisa nele
  rationale: Mantém a imagem concreta do hebraico, literalmente “pisa sobre ele”, embora a expressão possa indicar ação prejudicial ou aproveitamento egoísta.
theological_decisions:
- issue: Prioridade do texto hebraico diante do paralelo grego mais extenso
  choice: Seguir no texto principal a redação hebraica preservada, mantendo sua concisão e dificuldade.
  alternative: 'Traduzir segundo o grego: “Proteja-se de um conselheiro e saiba primeiro do que ele precisa, pois ele também aconselhará em benefício próprio, para que não lance a sorte contra você.”'
  rationale: O hebraico existente tem prioridade. O grego confirma o tema do conselho interesseiro, mas apresenta uma redação substancialmente mais extensa e não deve substituir silenciosamente o hebraico.
- issue: Sentido da imagem “pisa nele”
  choice: Conservar a imagem literal no texto e indicar em nota o possível sentido idiomático.
  alternative: “aproveita-se dele” ou “lhe causa tropeço”
  rationale: O hebraico permite uma leitura hostil ou exploradora, mas não define com precisão o tipo de dano; a tradução evita resolver essa ambiguidade.
translation_notes:
  register: Português atual, claro e digno, com forma proverbial concisa. “Conselheiro” mantém o tom da literatura sapiencial; a imagem incomum do hebraico é preservada e esclarecida em nota.
