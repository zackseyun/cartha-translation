  text: A wise man instructs his own people, and the fruits of his understanding are trustworthy.[a][b]
translation:
  language: pt
  text: O homem sábio instruirá o seu próprio povo, e os frutos do seu entendimento serão confiáveis.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico preservado neste ponto é difícil e difere muito do grego. O texto principal segue o testemunho grego, mais claro: “O homem sábio instruirá o seu próprio povo, e os frutos do seu entendimento serão confiáveis.”'
    reason: textual_variant
  - marker: b
    text: 'O testemunho hebraico preserva literalmente uma expressão obscura, aproximadamente: “a raiz/coroa dos planos do coração; quatro ombros(?) florescerão”. A redação é incerta e provavelmente está corrompida ou foi preservada de modo imperfeito.'
    reason: alternative_reading
lexical_decisions:
- source_word: עקרת תחבולות לבב
  choice: '[não adotado no texto principal]'
  rationale: O hebraico preservado é muito obscuro e não produz um sentido seguro e natural no contexto. Por isso, o texto principal segue o testemunho grego paralelo, que é claro, enquanto a leitura hebraica é registrada nas notas.
- source_word: ἀνὴρ σοφός
  choice: o homem sábio
  rationale: Mantém o substantivo masculino singular explícito no grego e soa natural como figura representativa na literatura sapiencial.
- source_word: τὸν ἑαυτοῦ λαόν
  choice: o seu próprio povo
  rationale: “Povo” traduz naturalmente λαός, e “próprio” preserva a ênfase de ἑαυτοῦ sem restringir o sentido a uma nação política.
- source_word: παιδεύσει
  choice: instruirá
  rationale: O futuro do grego é preservado. Neste contexto, παιδεύω diz respeito sobretudo a ensinar ou formar, e “instruirá” evita a conotação excessivamente punitiva de “disciplinará”.
- source_word: οἱ καρποὶ
  choice: os frutos
  rationale: Preserva tanto o plural explícito quanto a metáfora sapiencial do grego.
- source_word: τῆς συνέσεως αὐτοῦ
  choice: do seu entendimento
  rationale: “Entendimento” expressa de modo claro e amplo o sentido de σύνεσις, que também pode ser traduzido por “compreensão” ou “discernimento”.
- source_word: πιστοί
  choice: confiáveis
  rationale: No contexto, o adjetivo qualifica os frutos como seguros e dignos de confiança; “confiáveis” comunica isso em português corrente melhor do que “fiéis”.
theological_decisions:
- issue: Escolha entre o hebraico preservado e o paralelo grego
  choice: Seguir o sentido claro do grego no texto principal e documentar o hebraico nas notas
  alternative: Traduzir conjecturalmente o hebraico obscuro como “A raiz/coroa dos planos do coração; quatro ombros/ramos florescerão”
  rationale: O hebraico existente difere fortemente do grego e parece incerto ou corrompido. Uma tradução firme dele resolveria indevidamente dificuldades textuais e semânticas. O grego oferece uma leitura coerente, mas as notas preservam a tensão entre os testemunhos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O futuro verbal acompanha o grego; “o seu próprio povo” mantém a ênfase reflexiva, e “frutos” conserva a metáfora sapiencial.
