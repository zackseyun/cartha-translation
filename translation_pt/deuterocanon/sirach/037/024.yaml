  text: Good and evil[a], life and death—over them all the tongue rules.
translation:
  language: pt
  text: O bem e o mal[a], a vida e a morte — sobre todos eles a língua domina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: «O homem sábio ficará cheio de bênçãos, e todos os que o virem o chamarão feliz.» Aqui, o grego difere substancialmente do hebraico preservado.'
    reason: alternative_reading
lexical_decisions:
- source_word: טוב
  choice: o bem
  rationale: No par antitético טוב ורעה, a expressão abrangente «o bem» preserva melhor a polaridade moral e existencial do hebraico do que opções mais restritas, como «prosperidade».
- source_word: רעה
  choice: o mal
  rationale: No contraste fixo com טוב e em paralelo com «vida e morte», «o mal» mantém a amplitude e a força da oposição hebraica; «desgraça» ou «dano» a restringiriam.
- source_word: חיים
  choice: a vida
  rationale: Equivalente direto e natural, integrante do par convencional «vida e morte».
- source_word: מות
  choice: a morte
  rationale: Equivalente direto e natural, preservando sem expansão o merismo hebraico.
- source_word: ומושלת
  choice: domina
  rationale: O verbo משל exprime exercício de domínio. «Domina» é corrente, vigoroso e adequado à formulação sentenciosa, sem o tom potencialmente institucional de «governa».
- source_word: בם כליל
  choice: sobre todos eles
  rationale: Expressa o alcance total indicado pelo hebraico e retoma de modo claro os quatro elementos mencionados.
- source_word: לשון
  choice: a língua
  rationale: Mantém a imagem concreta do hebraico, em que «língua» representa a fala e seu poder, familiar na literatura sapiencial bíblica.
theological_decisions:
- issue: Relação entre o texto hebraico e o paralelo grego substancialmente divergente
  choice: 'Adotar como texto principal o hebraico existente: «O bem e o mal, a vida e a morte — sobre todos eles a língua domina.»'
  alternative: 'O grego traz: «O homem sábio ficará cheio de bênçãos, e todos os que o virem o chamarão feliz.»'
  rationale: Como o hebraico de Ben Sira está preservado neste ponto e possui alta confiança textual, ele deve reger a tradução. O grego não constitui aqui uma equivalência verbal próxima, mas uma leitura substancialmente distinta; por transparência, ela é registrada em nota sem substituir o testemunho hebraico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A estrutura concisa e antitética do provérbio foi preservada; «a língua» mantém a metáfora sapiencial do original.
