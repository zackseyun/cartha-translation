base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/027.yaml
  text: And there is a wise man who is wise for himself[b][a]; the fruit of his understanding is upon his own body.
translation:
  language: pt
  text: E há um sábio que é sábio para si mesmo[a]; o fruto do seu conhecimento está sobre o seu próprio corpo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “para sua alma”; aqui, provavelmente no sentido de “para si mesmo” ou “para sua própria vida”.'
    reason: lexical_alternative
  - marker: b
    text: O termo hebraico também pode significar “cadáver” em outros contextos; aqui se refere ao corpo vivo, isto é, à própria pessoa que recebe o fruto de seu conhecimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ
  choice: E há
  rationale: Preserva a construção existencial simples e sua ligação com o contexto, sem explicitar além do hebraico.
- source_word: חָכָם
  choice: um sábio
  rationale: Mantém o substantivo masculino singular do hebraico e o tom proverbial.
- source_word: לְנַפְשׁוֹ
  choice: para si mesmo
  rationale: Expressa naturalmente o valor reflexivo da locução; a alternativa literal «para sua alma» poderia sugerir uma distinção antropológica que o contexto não exige.
- source_word: יֶחְכָּם
  choice: é sábio
  rationale: Conserva a repetição intencional da raiz חכם e a força gnômica, sem acrescentar a ideia de mera aparência ou conduta.
- source_word: פְּרִי
  choice: o fruto
  rationale: Mantém a imagem concreta e tradicional do resultado produzido pelo conhecimento.
- source_word: דַעְתּוֹ
  choice: seu conhecimento
  rationale: É a correspondência mais direta de דַעַת; no contexto sapiencial, inclui o saber aplicado, sem precisar substituir o termo por uma interpretação mais específica.
- source_word: עַל
  choice: sobre
  rationale: Preserva a preposição e a imagem espacial incomum do hebraico, em vez de explicá-la como «beneficia».
- source_word: גְוִיָּתוֹ
  choice: seu próprio corpo
  rationale: Neste contexto, גְוִיָּה designa a pessoa corporal viva que recebe o fruto do conhecimento, não um cadáver; «próprio» torna clara a referência reflexiva.
theological_decisions:
- issue: Sentido antropológico de נֶפֶשׁ
  choice: 'Sentido reflexivo: «para si mesmo»'
  alternative: «para sua alma» ou «para sua própria vida»
  rationale: A formulação comunica que a sabedoria reverte em favor do próprio sábio, sem impor ao texto uma antropologia dualista.
- issue: Referência de גְוִיָּה
  choice: Corpo vivo
  alternative: Cadáver
  rationale: O provérbio trata do resultado do conhecimento sobre a própria pessoa; «cadáver» produziria aqui um sentido contextualmente improvável.
- issue: Caráter do benefício expresso por עַל
  choice: Manter a imagem ambígua «está sobre»
  alternative: Explicitar «beneficia» ou «recai sobre»
  rationale: A construção hebraica não especifica com precisão como o fruto se relaciona com o corpo. A tradução conserva essa tensão em vez de decidir silenciosamente entre benefício, efeito ou incidência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição «sábio que é sábio» e a imagem «está sobre [...] corpo» foram mantidas por refletirem de perto a forma e a ambiguidade do hebraico.
