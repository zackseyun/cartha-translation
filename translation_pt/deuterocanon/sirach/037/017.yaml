  verdict: revise
  source_fidelity: 'O texto principal segue adequadamente o paralelo grego, que oferece uma máxima coerente: ἀρχή, ἔργον, λόγος, πράξις e βουλή estão bem representados. Contudo, a nota traduz o hebraico de modo impreciso ao inserir “há” e ao não explicitar corretamente a relação em “que sabes [que] guarda”.'
  naturalness: O português do texto principal é claro, conciso e de registro sapiencial natural. “Deliberação” é uma opção idiomática adequada para βουλή neste contexto.
  terminology: “Princípio”, “obra”, “palavra”, “ação” e “deliberação” mantêm distinções úteis e não introduzem interpretação doutrinária. “Uma palavra” reproduz melhor o valor indefinido de λόγος do que “a palavra”.
  issues:
  - severity: medium
    issue: A paráfrase hebraica na nota contém uma adição e uma construção ambígua.
    rationale: O hebraico começa com אך איש (“mas um homem”), não com uma construção existencial (“mas há um homem”). Além disso, אשר תדע שומר מצוה é melhor expresso em português como “que sabes que guarda o mandamento” ou “a quem conheces como guardador do mandamento”, e não “que sabes guardar o mandamento”, que pode sugerir que o leitor sabe guardar o mandamento.
  - severity: low
    issue: O artigo definido em “a palavra” pode sugerir especificidade ausente no grego.
    rationale: λόγος é anartro nesta sentença proverbial; “uma palavra” preserva melhor a formulação indefinida, em paralelo com o inglês auditado.
