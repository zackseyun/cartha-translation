  text: But a man is always fearful[a]; whom you know keeps the commandment.
translation:
  language: pt
  text: O princípio de toda obra é uma palavra, e antes de toda ação vem a deliberação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico preservado nos manuscritos da Geniza do Cairo apresenta aqui uma leitura muito diferente, aproximadamente: “Mas um homem sempre teme, a quem sabes que guarda o mandamento.” O testemunho hebraico deste versículo parece textualmente perturbado; a tradução principal segue o paralelo grego coerente.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀρχὴ παντὸς ἔργου
  choice: O princípio de toda obra
  rationale: Diante do desarranjo do testemunho hebraico, segue-se o paralelo grego coerente. ἀρχή indica começo ou princípio; ἔργον, obra ou empreendimento.
- source_word: λόγος
  choice: a palavra
  rationale: Mantém a concisão proverbial e a amplitude de λόγος, que aqui pode sugerir formulação verbal, discussão ou reflexão expressa.
- source_word: πρὸ πάσης πράξεως
  choice: antes de toda ação
  rationale: πρό expressa anterioridade temporal, e πρᾶξις designa ação ou ato.
- source_word: βουλή
  choice: deliberação
  rationale: No contexto sapiencial, βουλή indica reflexão ponderada, conselho ou plano. “Deliberação” exprime com naturalidade o processo que antecede a ação.
theological_decisions:
- issue: Conflito textual entre o hebraico preservado e o paralelo grego
  choice: Usar no texto principal a leitura grega coerente
  alternative: “Mas há um homem que sempre teme, que sabes guardar o mandamento.”
  rationale: O hebraico fornecido é gramaticalmente possível apenas de modo difícil, diverge inteiramente do grego e está classificado como grande incompatibilidade textual. O grego forma um provérbio coerente com o contexto; a variante hebraica é preservada em nota, sem ocultar a incerteza.
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial concisa. “Ação” é mais corrente que “feito”, e “deliberação” evita limitar βουλή a conselho recebido de outra pessoa.
