base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/029.yaml
  text: A man's life is a numbered span of days, but the life of the people of Israel is days without number.
translation:
  language: pt
  text: A vida de um homem tem um número limitado de dias, mas[a] a vida do povo de Israel tem dias sem número.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “e a vida do povo de Israel”. A conjunção hebraica pode significar simplesmente “e”, embora o paralelismo tenha sentido contrastivo.
    reason: alternativa lexical
lexical_decisions:
- source_word: חַיֵּי אִישׁ
  choice: A vida de um homem
  rationale: Preserva o singular genérico do hebraico e soa natural em português, sem transformar a referência individual em plural ou em formulação abstrata.
- source_word: מִסְפַּר יָמִים
  choice: dura um número limitado de dias
  rationale: O hebraico fala de um número de dias, em contraste com os dias sem número do segundo membro. “Limitado” explicita com naturalidade a finitude implícita nesse contraste.
- source_word: וְחַיֵּי עַם יִשְׂרָאֵל
  choice: mas a vida do povo de Israel
  rationale: Embora וְ possa significar simplesmente “e”, o paralelismo estabelece um contraste entre a duração do indivíduo e a continuidade do povo; “mas” expressa esse valor adversativo sem ampliar a afirmação.
- source_word: עַם יִשְׂרָאֵל
  choice: o povo de Israel
  rationale: Tradução direta que conserva o sentido coletivo da expressão hebraica.
- source_word: יְמֵי אֵין מִסְפָּר
  choice: dura dias sem número
  rationale: Mantém a imagem concreta e a correspondência verbal com “número” no primeiro membro, além de reproduzir de perto o idiomatismo hebraico.
theological_decisions:
- issue: A continuidade coletiva de Israel em contraste com a mortalidade individual
  choice: Conservar o contraste entre a vida finita de um indivíduo e a duração sem número do povo de Israel.
  alternative: Entender a frase apenas como uma referência à longa história de Israel, sem qualquer sugestão mais ampla de continuidade coletiva.
  rationale: O paralelismo hebraico contrapõe claramente um número limitado de dias a dias sem número. A tradução preserva essa tensão, sem convertê-la numa formulação doutrinária explícita sobre eternidade ou aliança.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A repetição de “dura” torna explícita em português a construção nominal elíptica do hebraico e mantém equilibrados os dois membros do verso.
