base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/011.yaml
  text: He will speak to you of the good of your way[a], and then stand opposite to watch your downfall.
translation:
  language: pt
  text: Ele lhe falará bem do seu caminho[a] e depois se porá diante de você para observar sua desgraça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico é conciso e um tanto incerto neste ponto. A frase final também pode ser traduzida como “para observar o seu infortúnio” ou “para observar a sua pobreza”. O paralelo grego deste versículo preserva, em vez disso, uma advertência mais extensa para não confiar no conselho de certos tipos de pessoas.
    reason: Leitura alternativa e divergência textual entre o hebraico e o paralelo grego.
lexical_decisions:
- source_word: ואמר לך
  choice: Ele lhe falará
  rationale: אמר é o verbo comum para dizer ou falar. A formulação mantém o endereço pessoal e soa natural em português.
- source_word: מטוב דרכך
  choice: da bondade do seu caminho
  rationale: A expressão hebraica é condensada e pode indicar fala favorável a respeito do rumo de alguém. A tradução preserva a imagem sapiencial de 'caminho' sem explicitar demais a possível ideia de bajulação.
- source_word: דרכך
  choice: seu caminho
  rationale: דרך pode designar caminho literal ou, metaforicamente, modo de agir e rumo escolhido. 'Caminho' conserva essa amplitude.
- source_word: וקם מנגד
  choice: mas depois ficará de frente
  rationale: מנגד indica posição diante de alguém, em frente ou em oposição. 'Ficará de frente' preserva a imagem espacial; 'mas depois' torna perceptível o contraste contextual, embora a conjunção hebraica seja simples.
- source_word: להביט
  choice: observando
  rationale: הביט denota olhar atentamente. 'Observando' comunica atenção deliberada e se integra com naturalidade à oração.
- source_word: רישך
  choice: sua desgraça
  rationale: A forma é difícil e provavelmente se relaciona com pobreza, necessidade ou calamidade. 'Desgraça' preserva o sentido amplo de infortúnio sem restringi-lo especificamente à ruína econômica.
theological_decisions:
- issue: Uso do testemunho hebraico da Genizá diante de um paralelo grego divergente e mais extenso
  choice: Traduzir primariamente o hebraico preservado e registrar a divergência em nota
  alternative: Substituir o texto pela lista grega mais extensa de pessoas das quais não se deve buscar conselho
  rationale: Como o hebraico está preservado e tem alta confiança, ele deve reger o texto principal. O grego serve de controle contextual, mas sua forma bastante diferente não deve ser incorporada silenciosamente.
- issue: Valor adversativo da sequência וקם
  choice: mas depois
  alternative: e depois
  rationale: A conjunção é formalmente simples, mas o contraste entre a fala favorável e a observação da desgraça é claro no contexto. A opção comunica essa tensão sem alterar os acontecimentos descritos.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Mantém-se a metáfora sapiencial do 'caminho' e evita-se linguagem denominacional ou interpretação excessivamente explícita.
