  text: Every friend says[a], “I love him,” but there is a friend who is a friend in name only.
translation:
  language: pt
  text: 'Todo amigo diz: “Eu o amo”; mas há amigo que é amigo só de nome.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico traz uma expressão condensada, algo como “há um amigo — amigo de nome”; o paralelo grego esclarece o sentido: “amigo só de nome”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כל אוהב
  choice: Todo amigo
  rationale: Embora אוהב possa designar “quem ama”, o paralelo grego Πᾶς φίλος e o contraste do provérbio favorecem o sentido social de “amigo”.
- source_word: אומר
  choice: diz
  rationale: Mantém a simplicidade e a concisão do verbo hebraico, sem acrescentar a ideia de alegação ou ostentação.
- source_word: אהבתי
  choice: Eu o amo
  rationale: A forma perfeita hebraica pode expressar, nesta declaração direta, uma afeição assumida e presente. Em português, “Eu o amo” comunica isso naturalmente; o pronome segue o sentido explicitado também pelo paralelo grego.
- source_word: אך
  choice: mas
  rationale: Expressa de modo direto a oposição entre a declaração de afeto e a amizade apenas nominal.
- source_word: יש
  choice: há
  rationale: Equivalente idiomático e conciso da partícula existencial hebraica.
- source_word: אהב שם אהב
  choice: amigo que é amigo só de nome
  rationale: O hebraico é comprimido e um pouco áspero; o paralelo grego, ὀνόματι μόνον φίλος, confirma o sentido de alguém que é amigo apenas nominalmente. A repetição de “amigo” preserva a força proverbial do original.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com concisão proverbial. A repetição intencional de “amigo” reflete o jogo verbal do hebraico, e a nota preserva a percepção de sua formulação condensada.
