  text: Do not forget a friend in your heart[b][a], and do not neglect him when you have wealth.
translation:
  language: pt
  text: Não se esqueça de um amigo no combate[a]; não o abandone em meio aos despojos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “em tua alma”, isto é, “em teu íntimo”, em vez de “no combate”.
    reason: textual_variant
  - marker: b
    text: O grego traz “em teus bens”. No hebraico, “despojos” é a leitura mais direta; a forma do pronome no verbo anterior é difícil no manuscrito.
    reason: textual_variant
lexical_decisions:
- source_word: אל תשכח
  choice: Não se esqueça
  rationale: A proibição hebraica é direta; esta é a formulação mais natural e digna em português atual.
- source_word: חבר
  choice: do amigo
  rationale: חבר designa amigo ou companheiro. O artigo definido soa natural na máxima e não altera seu alcance geral.
- source_word: בקרב
  choice: no combate
  rationale: Sem sufixo possessivo, a forma hebraica בקרב é mais naturalmente entendida como “no combate”. A leitura grega “em sua alma” pode refletir בקרבך, uma forma hebraica diferente, e por isso é registrada em nota.
- source_word: ואל תעזבהן
  choice: e não o abandone
  rationale: O verbo עזב significa deixar ou abandonar. Embora o sufixo transmitido seja morfologicamente difícil, o referente singular “amigo” e o paralelo grego sustentam o objeto masculino singular.
- source_word: בשללך
  choice: quando você tiver despojos
  rationale: שלל significa despojo ou saque. A formulação temporal comunica em português o sentido circunstancial de não abandonar o amigo em meio aos ganhos da vitória, sem reduzir o termo à ideia genérica de riqueza.
