  text: The beginning of every deed is a word[c][b][a], and the beginning of every work is a thought.
translation:
  language: pt
  text: O princípio de toda ação é uma palavra[a], e o princípio de toda obra é um pensamento[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um assunto” ou “uma coisa”; o hebraico dabar pode ter esses sentidos além de “palavra”.
    reason: lexical_alternative
  - marker: b
    text: Ou “um plano”; o hebraico machashevet pode indicar pensamento, intenção ou plano.
    reason: lexical_alternative
  - marker: c
    text: 'O testemunho grego traz aqui um dito diferente: “Há quem seja sábio para a sua própria alma, e os frutos de seu entendimento são dignos de confiança em sua boca.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ראש
  choice: o princípio de
  rationale: Neste provérbio, ראש indica aquilo que vem primeiro ou está no início. “O princípio de” é natural em português e preserva o paralelismo dos dois membros.
- source_word: כל
  choice: toda
  rationale: O valor distributivo expressa uma generalização proverbial; “toda” comunica isso com clareza nos dois membros.
- source_word: מעשה
  choice: ação
  rationale: “Ação” traduz naturalmente o ato realizado e permite distingui-lo de פועל, vertido como “obra”.
- source_word: דבר
  choice: palavra
  rationale: דבר pode significar “palavra”, “assunto” ou “coisa”. “Palavra” mantém o contraste sugestivo entre expressão exterior e pensamento interior sem eliminar a alternativa lexical, registrada em nota.
- source_word: פועל
  choice: obra
  rationale: “Obra” conserva o campo semântico da atividade ou do trabalho realizado e mantém uma leve distinção em relação a מעשה, “ação”.
- source_word: היא
  choice: é
  rationale: O pronome feminino concorda com מחשבת e, na frase nominal, pode ser expresso naturalmente em português pela cópula “é”.
- source_word: מחשבת
  choice: pensamento
  rationale: O termo pode designar pensamento, intenção ou plano. “Pensamento” preserva a amplitude do hebraico; “plano” permanece como alternativa possível em nota.
theological_decisions:
- issue: Divergência entre o texto hebraico preservado e o paralelo grego
  choice: Traduzir o hebraico no texto principal e registrar em nota a sentença substancialmente diferente do grego.
  alternative: 'Adotar o texto grego: “Há quem seja sábio para si mesmo, e os frutos de seu entendimento são dignos de confiança em sua boca.”'
  rationale: Como o hebraico está preservado com alta confiança, ele é a fonte primária. O grego não constitui aqui uma simples variação vocabular, mas apresenta outro dito; harmonizá-los apagaria uma divergência textual genuína.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso e proverbial. “Ação/obra” preserva a proximidade semântica dos termos hebraicos sem torná-los idênticos; as notas mantêm visíveis tanto a polissemia quanto a divergência textual.
