  text: A bad friend looks to the table[b][a], but in a time of distress he will stand aloof.
translation:
  language: pt
  text: Um mau amigo olha para a mesa[a], mas, no tempo da aflição, ficará do lado oposto[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais explicitamente, “fica de olho na mesa”, isto é, aproxima-se pelos benefícios da convivência ou da comida.
    reason: lexical_alternative
  - marker: b
    text: 'Hebraico: “ficará em posição oposta”; o grego também diz “estará do lado oposto”. A expressão pode indicar que ele se mantém distante ou até que toma uma posição contrária durante a aflição.'
    reason: alternative_reading
lexical_decisions:
- source_word: מרע אוהב
  choice: um mau amigo
  rationale: A expressão caracteriza negativamente alguém que ocupa o papel de amigo ou companheiro. “Mau amigo” é claro e natural, sem transformar a descrição em “inimigo”.
- source_word: מביט אל שלחן
  choice: olha para a mesa
  rationale: Mantém a imagem concreta e a formulação relativamente aberta do hebraico. O contexto sugere interesse pela comida, hospitalidade ou vantagens da convivência, explicados em nota sem serem inseridos no texto.
- source_word: בעת מצוקה
  choice: no tempo da aflição
  rationale: מצוקה indica aperto, angústia ou aflição. A formulação é corrente, digna e conserva o contraste com a mesa.
- source_word: מנגד יעמד
  choice: ficará do lado oposto
  rationale: Reproduz a ideia espacial de estar em frente ou em posição oposta, confirmada pelo grego ἀπέναντι, preservando a ambiguidade entre afastamento, falta de apoio e oposição ativa.
theological_decisions:
- issue: Natureza da conduta do mau amigo durante a aflição
  choice: ficará do lado oposto
  alternative: ficará distante; ficará contra você
  rationale: O hebraico e o paralelo grego permitem mais de uma nuance. A tradução não decide se o amigo apenas se afasta ou se assume uma posição hostil.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem dos marcadores foi ajustada para que [a] acompanhe “mesa” e [b] acompanhe “lado oposto”, de acordo com o conteúdo de cada nota.
