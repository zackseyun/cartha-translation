  text: Do not consult with your father-in-law[a], and conceal a secret from one who is jealous.
translation:
  language: pt
  text: Não peça conselho ao seu sogro[a] e oculte um segredo de quem é ciumento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego preservado difere substancialmente neste ponto: em vez disso, fala de manter convivência com um homem piedoso que você sabe que guarda os mandamentos. O testemunho hebraico traduzido aqui aconselha a não pedir conselho ao sogro e a não revelar um segredo a uma pessoa ciumenta.'
    reason: textual_variant
lexical_decisions:
- source_word: אל תועץ
  choice: Não peça conselho
  rationale: A proibição hebraica trata de buscar conselho; esta formulação é natural em português atual e preserva o contexto de aconselhamento.
- source_word: חמיך
  choice: ao seu sogro
  rationale: O termo hebraico designa especificamente o pai do cônjuge, no singular, e não parentes por afinidade em geral.
- source_word: וממקנא
  choice: de quem é ciumento
  rationale: A preposição מן indica de quem o segredo deve ser ocultado; מקנא pode denotar alguém ciumento ou invejoso. “Ciumento” mantém proximidade lexical sem restringir indevidamente o referente ao sexo masculino.
- source_word: העלים סוד
  choice: esconda um segredo
  rationale: A expressão significa ocultar ou não revelar um segredo. “Esconda um segredo de” comunica diretamente essa força imperativa em português comum.
theological_decisions:
- issue: Divergência substancial entre o hebraico preservado e o paralelo grego
  choice: Traduzir diretamente o texto hebraico existente e registrar a variante grega em nota.
  alternative: 'Seguir o grego: manter convivência com um homem piedoso que guarda os mandamentos.'
  rationale: O hebraico é o testemunho primário fornecido e está preservado neste trecho. A formulação grega é materialmente distinta e não deve substituir silenciosamente a leitura hebraica; a nota conserva a evidência textual e a tensão entre os testemunhos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Peça conselho” soa mais natural do que o possível, mas menos corrente, “aconselhe-se”. A coordenação breve preserva a estrutura proverbial do hebraico.
