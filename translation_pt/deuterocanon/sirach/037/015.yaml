translation:
  language: pt
  text: Acima de tudo isso, ore ao Altíssimo para que ele conduza seu caminho na verdade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico conservado nos manuscritos da Geniza do Cairo está desalinhado neste ponto e diz aproximadamente: «Com um homem mau, sobre a retribuição da bondade, e com um cruel, sobre o bem da carne». Além disso, o paralelo grego reproduzido com estes dados parece corresponder ao versículo anterior, pois fala da alma humana e de sete vigias. O texto principal segue a leitura grega tradicionalmente associada a Sirácida 37:15.'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ἐπὶ πᾶσι τούτοις
  choice: Acima de tudo isso
  rationale: Expressa de modo natural a transição cumulativa da tradição grega de Sirácida 37:15, sem tratar o conselho anterior como irrelevante.
- source_word: δεήθητι ὑψίστου
  choice: ore ao Altíssimo
  rationale: Mantém tanto a exortação à oração quanto o título divino tradicional, em português claro e reverente.
- source_word: κατευθύνω / εὐθύνω
  choice: conduza
  rationale: Comunica a ideia de dirigir ou tornar reto o curso de alguém; «conduza» soa natural em português e conserva a dimensão prática e moral.
- source_word: ὁδός
  choice: caminho
  rationale: Termo corrente da literatura sapiencial, capaz de indicar tanto o rumo da vida quanto a conduta moral.
- source_word: ἀλήθεια
  choice: verdade
  rationale: Preserva a formulação teologicamente aberta do grego, sem reduzi-la apenas a sinceridade, fidelidade ou retidão.
theological_decisions:
- issue: Conflito e desalinhamento entre as testemunhas fornecidas
  choice: O texto principal segue a leitura grega tradicional de Sirácida 37:15 refletida pela camada de consulta inglesa e por seus dados lexicais.
  alternative: 'Traduzir o hebraico preservado: «Com um homem mau, sobre a retribuição da bondade, e com um cruel, sobre o bem da carne»; ou traduzir o paralelo grego fornecido, que fala da alma de um homem e de sete vigias.'
  rationale: O hebraico fornecido está assinalado como grande desalinhamento e não produz sentido coerente neste contexto. Além disso, o paralelo grego reproduzido no pacote parece pertencer ao versículo adjacente, não à exortação de 37:15. A leitura adotada é atestada pela tradição grega do versículo e deve vir acompanhada de nota textual explícita, em vez de ocultar a incerteza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Ore» é direto e corrente; «Altíssimo», «caminho» e «verdade» preservam o registro sapiencial e bíblico sem arcaísmo excessivo.
