review_pass:
  verdict: revise
  source_fidelity: 'O texto principal deve seguir a leitura grega tradicional de Sirácida 37:15, conforme a trilha de auditoria inglesa, pois o hebraico da Geniza fornecido está explicitamente assinalado como gravemente desalinhado e não oferece uma leitura contextual defensável. Há, porém, uma discrepância adicional: o texto grego paralelo transcrito no pacote parece pertencer a outro versículo; a nota deve registrar isso sem fingir que esse fragmento seja a base direta da tradução.'
  naturalness: “Acima de tudo isso” pode sugerir prioridade (“sobretudo”), enquanto a transição grega é aditiva. “Além de tudo isso” é mais preciso. “Guie o seu caminho” é natural, claro e preserva a metáfora sapiencial.
  terminology: “Ore”, “Altíssimo”, “caminho” e “verdade” são escolhas adequadas, dignas e amplamente compreensíveis. “Altíssimo” preserva o título divino sem expansão interpretativa.
  issues:
  - severity: medium
    issue: A transição “Acima de tudo isso” é semanticamente menos exata.
    rationale: 'A expressão pode significar “sobretudo/principalmente”; a leitura grega pressuposta introduz um conselho adicional: “além de tudo isso”.'
  - severity: low
    issue: “Conduza seu caminho” é menos idiomático do que uma formulação com “guiar”.
    rationale: Em português moderno, “guie o seu caminho” exprime com maior naturalidade a orientação do curso de vida, sem perder a imagem do original.
  - severity: medium
    issue: A nota diz que o texto principal segue a “leitura grega tradicional”, mas precisa distinguir essa leitura do paralelo grego efetivamente transcrito, que parece deslocado.
    rationale: A transparência textual requer reconhecer que o fragmento grego apresentado fala da alma e de sete vigias e, portanto, não sustenta diretamente a redação principal.
  revised_text: Além de tudo isso, ore ao Altíssimo para que ele guie o seu caminho na verdade.[a]
  revised_footnotes:
  - marker: a
    text: 'O hebraico preservado nos manuscritos da Geniza do Cairo está gravemente desalinhado neste ponto e diz aproximadamente: «Com um homem mau, sobre a retribuição da bondade, e com um cruel, sobre o bem da carne». Essa redação não se ajusta ao contexto. O texto principal segue a leitura grega tradicionalmente associada a Sirácida 37:15: uma exortação a orar ao Altíssimo para que guie o caminho da pessoa na verdade. O fragmento grego paralelo reproduzido nos dados desta edição parece corresponder a outro versículo, pois fala da alma humana e de sete vigias.'
    reason: textual_variant
  revision_rationale: A revisão mantém a decisão editorial justificada de seguir a leitura grega tradicional diante do hebraico desalinhado, melhora a equivalência da transição aditiva e torna a frase portuguesa mais idiomática. A nota foi ajustada para expor, sem ocultação, tanto a dificuldade do hebraico quanto o aparente deslocamento do fragmento grego fornecido.
