translation:
  language: pt
  text: Há um sábio que é sábio para muitos, mas, para si mesmo, não tem valor.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico גוֹאָל é difícil. Pode ter o sentido de “contaminado”, “manchado” ou, neste contexto, de alguém que não tem valor para si mesmo.
    reason: lexical_alternative
  - marker: b
    text: 'A tradição grega traz aqui um dito diferente: “A vida de um homem conta-se pelo número de seus dias, mas os dias de Israel são incontáveis”. O hebraico e o grego não correspondem de perto neste ponto.'
    reason: textual_variant
lexical_decisions:
- source_word: יֵשׁ
  choice: Há
  rationale: A partícula existencial introduz uma observação geral; “Há” é a forma mais natural e concisa em português.
- source_word: חָכָם
  choice: um sábio
  rationale: O hebraico emprega um substantivo masculino singular para apresentar um tipo representativo. “Um sábio” preserva essa forma e o tom proverbial.
- source_word: לְרַבִּים
  choice: para muitos
  rationale: 'A preposição לְ tem aqui sentido de referência ou benefício: a sabedoria desse homem alcança muitas outras pessoas, sem especificar de que modo.'
- source_word: נֶחְכָּם
  choice: é sábio
  rationale: Embora a forma nifal possa sugerir que alguém se mostra ou é reconhecido como sábio, “é sábio” evita introduzir indevidamente um processo de tornar-se sábio e conserva a concisão do provérbio.
- source_word: וּלְנַפְשׁוֹ
  choice: mas, para si mesmo
  rationale: נֶפֶשׁ pode significar vida, pessoa ou o próprio eu. O contraste é prático e reflexivo, não uma afirmação metafísica sobre a alma.
- source_word: גוֹאָל
  choice: não tem valor
  rationale: A palavra hebraica é difícil e pode estar relacionada a ideias de contaminação ou degradação. No contraste do provérbio, “não tem valor” expressa com naturalidade sua avaliação negativa sem fingir maior precisão lexical.
