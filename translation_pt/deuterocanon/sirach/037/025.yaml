  register: Português moderno, claro e digno, com estrutura proverbial concisa. A repetição “um sábio que é sábio” acompanha deliberadamente a formulação hebraica; “para si mesmo” mantém o contraste reflexivo, e a dificuldade de גוֹאָל é explicitada em nota.
