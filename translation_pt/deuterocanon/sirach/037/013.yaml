  text: Consult with a woman about her rival, and with a coward about his warfare;[a]
translation:
  language: pt
  text: Consulte uma mulher sobre a rival dela e um covarde sobre a guerra dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A testemunha hebraica neste ponto é difícil e difere muito do grego, que diz aproximadamente: «aquele cuja alma está de acordo com a sua e que, se você tropeçar, sofrerá com você» — isto é, um amigo de espírito afim que compartilha sua dor. O termo hebraico traduzido por «covarde» é incerto; também já foi entendido como «rebelde» ou «desertor».'
    reason: textual_variant
lexical_decisions:
- source_word: עִם
  choice: consulte ... sobre
  rationale: A preposição introduz, nesta sequência contextual, a pessoa de quem se busca conselho; explicitar «consulte» torna natural em português a relação implícita.
- source_word: אִשָּׁה
  choice: uma mulher
  rationale: O substantivo pode significar «mulher» ou «esposa», mas não traz possessivo; «uma mulher» evita especificação indevida.
- source_word: צָרָהּ
  choice: sua rival
  rationale: O termo pode designar uma rival, inclusive uma coesposa, ou adversária. «Sua rival» conserva o sentido amplo sem impor a relação mais estreita.
- source_word: מָרֵד
  choice: um covarde
  rationale: A leitura hebraica é difícil. No paralelismo com guerra, «covarde» expressa alguém pouco confiável em combate, enquanto a incerteza textual é registrada em nota.
- source_word: מִלְחַמְתּוֹ
  choice: a guerra dele
  rationale: O substantivo significa guerra ou combate e contém sufixo possessivo masculino. «A guerra dele» preserva explicitamente essa referência e evita a possível ambiguidade de «sua guerra».
theological_decisions:
- issue: Divergência substancial entre as testemunhas hebraica e grega em Sirácida 37:13
  choice: Traduzir no texto principal o hebraico preservado e registrar em nota a leitura grega muito diferente.
  alternative: 'Seguir o grego: «aquele cuja alma está de acordo com a sua e que, se você tropeçar, sofrerá com você».'
  rationale: A testemunha hebraica sobrevivente tem prioridade como fonte do texto principal, mas a divergência não deve ser ocultada nem harmonizada, pois o grego parece representar uma linha inteiramente distinta.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o caráter proverbial da sequência e assinala honestamente a grave incerteza textual.
