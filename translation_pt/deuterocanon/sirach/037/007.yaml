  text: Every counselor waves his hand[b][a], but there is a counselor whose advice is for himself.
translation:
  language: pt
  text: Todo conselheiro acena com a mão,[a] mas há conselheiro que aconselha em benefício próprio.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais dinâmico: “Todo conselheiro oferece conselho”.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico fornecido é difícil no fim do versículo. O paralelo grego diz: “mas há quem aconselhe para si mesmo”, apoiando o sentido adotado aqui.'
    reason: textual_variant
lexical_decisions:
- source_word: כל יועץ
  choice: Todo conselheiro
  rationale: 'A construção tem sentido distributivo e proverbial: cada pessoa que exerce a função de aconselhar. “Conselheiro” preserva o registro da literatura sapiencial.'
- source_word: יניף יד
  choice: acena com a mão
  rationale: Mantém a imagem concreta do hebraico, que fala em erguer ou mover a mão, sem reduzir diretamente a expressão a “oferece conselho”. O sentido funcional provável é explicado na nota.
- source_word: אך
  choice: mas
  rationale: Expressa de modo direto o contraste entre a afirmação geral e a advertência sobre o interesse do conselheiro.
- source_word: יש יועץ
  choice: há conselheiro
  rationale: Reproduz com naturalidade a construção existencial hebraica e mantém a repetição de “conselheiro”.
- source_word: דרך אל לץ
  choice: que aconselha em benefício próprio
  rationale: O fim do texto hebraico fornecido é difícil e aparentemente apresenta uma leitura problemática. O paralelo grego, εἰς αὐτόν, indica conselho voltado para o próprio conselheiro; a tradução comunica essa finalidade ou vantagem pessoal sem fingir certeza quanto à forma hebraica.
