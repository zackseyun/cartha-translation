  text: A wise man for himself will be filled with delight[b][a], and all who see him will call him happy.
translation:
  language: pt
  text: O sábio se saciará de prazer, e todos os que o[a] virem o considerarão feliz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz “todos os que o veem”; a forma transmitida da última palavra apresenta uma irregularidade ortográfica, mas o sentido é claro pelo contexto.
    reason: textual_variant
  - marker: b
    text: 'O grego traz aqui uma linha substancialmente diferente: “Pois, com muitos alimentos haverá sofrimento, e a voracidade se aproximará da cólera ou de doença biliosa.” O texto principal segue o testemunho hebraico preservado na Genizá do Cairo, fonte primária onde está disponível.'
    reason: alternative_reading
lexical_decisions:
- source_word: חכם
  choice: o sábio
  rationale: O termo hebraico designa uma pessoa sábia. O masculino singular foi mantido, com valor proverbial e genérico próprio do contexto.
- source_word: לנפשו
  choice: se
  rationale: Literalmente, “para sua alma/seu próprio ser”. Aqui נפש se refere à própria pessoa; a construção reflexiva “se saciará” comunica isso de modo natural em português, sem restringir o sentido a uma alma imaterial.
- source_word: ישבע
  choice: se saciará
  rationale: O verbo שבע significa ficar saciado ou satisfeito. “Se saciará” preserva a ideia de plenitude e se combina naturalmente com “prazer”.
- source_word: תענוג
  choice: prazer
  rationale: O substantivo denota prazer, deleite ou satisfação agradável. “Prazer” é claro, corrente e fiel ao campo semântico.
- source_word: ויאשרוהו
  choice: o chamarão feliz
  rationale: A forma verbal indica declarar alguém feliz ou afortunado, não necessariamente conceder-lhe uma bênção. A expressão escolhida preserva esse reconhecimento público.
- source_word: כל רואינו
  choice: todos os que o virem
  rationale: Embora a forma transmitida apresente irregularidade ortográfica no elemento final, o sentido contextual é “todos os que o veem”. O futuro do subjuntivo é idiomático em português após “todos os que” numa declaração futura.
