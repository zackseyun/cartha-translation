translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação proverbial foi mantida de maneira concisa; evitou-se tanto o arcaísmo “alma” para נפש quanto uma explicitação teológica não exigida pelo hebraico.
