  text: But with one whose heart is like your heart[a], if you stumble[b], he will be affected also.
translation:
  language: pt
  text: Mas, quanto àquele cujo coração é como o seu[a], se você tropeçar, isso também o alcançará[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “o coração dele é como o seu”. A expressão pode indicar alguém de disposição ou pensamento semelhante ao seu.'
    reason: lexical_alternative
  - marker: b
    text: A oração final é concisa no hebraico; literalmente, “se você tropeçar, chegará até ele”. O sujeito do verbo não é expresso, e o sentido pode ser que o tropeço ou suas consequências também alcancem essa pessoa.
    reason: alternative_reading
lexical_decisions:
- source_word: אך
  choice: Mas
  rationale: Expressa de modo conciso o contraste ou a ressalva introduzida pelo hebraico, sem tornar a ligação com o contexto mais específica do que o texto permite.
- source_word: עם
  choice: com alguém
  rationale: A preposição significa literalmente “com”; “alguém” é explicitado em português para que a construção pessoal fique natural.
- source_word: לבבו כלבבך
  choice: cujo coração é como o seu
  rationale: Conserva a imagem hebraica do coração como centro da disposição interior e das intenções, sem reduzi-la apenas a pensamento ou emoção.
- source_word: אם תכשל
  choice: se você tropeçar
  rationale: Mantém a metáfora do verbo hebraico, que pode abranger falha, queda ou dificuldade, sem determinar qual delas está em vista.
- source_word: יגיע אליו
  choice: isso também o atingirá
  rationale: Comunica em português corrente que aquilo que resulta do tropeço alcança a outra pessoa. “Isso” representa o sujeito implícito; “também” torna clara a extensão do efeito a ela, sem definir a natureza exata desse efeito.
theological_decisions:
- issue: Sentido antropológico de לבב
  choice: coração
  alternative: mente; íntimo; alguém que pensa como você
  rationale: “Coração” preserva a amplitude da antropologia hebraica, que inclui pensamento, intenção e disposição, e evita impor uma distinção moderna entre razão e emoção.
- issue: Sujeito e efeito implícitos em יגיע אליו
  choice: isso também o atingirá
  alternative: isso chegará até ele; ele também será afetado; ele também tropeçará
  rationale: O hebraico não explicita o sujeito do verbo nem define precisamente o que alcança a pessoa. A tradução permanece compreensível sem afirmar que ela necessariamente tropeçará da mesma maneira.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “você”. A imagem de “coração” e a metáfora de “tropeçar” foram preservadas. A redação segue prioritariamente o hebraico fornecido; o paralelo grego diverge substancialmente neste versículo e, por isso, não foi usado para substituir o conteúdo hebraico.
