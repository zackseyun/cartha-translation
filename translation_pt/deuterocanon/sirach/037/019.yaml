translation:
  language: pt
  text: Há também quem entende o conselho do coração; quem confiará mais em ti do que ele?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico é conciso e de interpretação difícil. A expressão pode ser entendida como “quem entende o conselho do coração”, como aqui, ou como referência a um homem entendido e ao seu próprio discernimento; a relação exata entre as palavras permanece incerta.
    reason: textual_ambiguity
  - marker: b
    text: 'O paralelo grego traz um texto bastante diferente: “Há um homem hábil e instrutor de muitos, mas inútil para a própria alma.” É provável que represente outra forma hebraica do versículo ou uma tradição textual substancialmente divergente.'
    reason: alternative_reading
lexical_decisions:
- source_word: וגם
  choice: também
  rationale: Liga esta exortação à sequência anterior e conserva o valor aditivo da expressão hebraica.
- source_word: עצת לבב
  choice: o conselho do coração
  rationale: Mantém a imagem hebraica de deliberação interior. Em linguagem sapiencial, o “coração” é o centro do discernimento e da decisão.
- source_word: הבין
  choice: Compreende
  rationale: É lido como forma imperativa do hifil de בין, dirigida ao leitor. Essa análise preserva a exortação direta do hebraico, embora a forma sem vocalização permita dificuldade interpretativa.
- source_word: מי יאמן לך אמן ממנו
  choice: quem é mais digno da tua confiança do que ele?
  rationale: Expressa naturalmente em português a pergunta comparativa e o campo semântico de אמן, relativo a confiança e fidelidade. O pronome “ele” retoma “coração”, masculino em português, sem eliminar a concisão do hebraico.
theological_decisions:
- issue: Referente da fonte confiável
  choice: O “coração” ou seu conselho interior é apresentado como digno da confiança do destinatário
  alternative: Um homem sábio ou entendido confia no próprio discernimento
  rationale: A sintaxe mais direta permite ler הבין como imperativo e עצת לבב como seu objeto. Isso conserva a segunda pessoa e a pergunta retórica presentes no texto hebraico, sem introduzir explicitamente um “homem sábio” que não aparece como substantivo inequívoco.
- issue: Divergência entre o hebraico e o paralelo grego
  choice: Traduzir o hebraico no texto principal e registrar o grego em nota
  alternative: 'Seguir o grego: “Há um homem hábil, instrutor de muitos, mas inútil para a própria alma”'
  rationale: O testemunho hebraico preservado é a fonte primária solicitada. O grego representa aqui uma forma substancialmente diferente do versículo e não deve ser harmonizado silenciosamente com o hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com uso de “tua” para conservar a interpelação singular. A formulação mantém a imagem sapiencial “conselho do coração” e a estrutura retórica, explicando em notas tanto a ambiguidade do hebraico quanto a divergência grega.
