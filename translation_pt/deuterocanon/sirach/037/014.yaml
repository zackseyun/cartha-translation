  text: Do not bargain with a merchant[a], nor over buying and selling.
translation:
  language: pt
  text: Não barganhe com um comerciante[a], nem a respeito de compra e venda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Firma o conselho do teu coração, pois nada te é mais fiel do que ele.” O hebraico preservado aqui difere substancialmente da tradição grega.'
    reason: alternative_reading
lexical_decisions:
- source_word: עם סוחר
  choice: com um comerciante
  rationale: A preposição עם marca associação, e סוחר designa alguém que exerce o comércio; “comerciante” é corrente, claro e apropriado ao registro sapiencial.
- source_word: אל תתגר
  choice: não barganhe
  rationale: No contexto comercial criado por “comerciante” e pelos termos de compra e venda na segunda oração, o verbo é entendido como entrar em barganha ou negociação. “Não dispute” continua sendo uma possibilidade lexical, mas explicita menos a unidade comercial do verso.
- source_word: ממקנה
  choice: compra
  rationale: O termo deriva da ideia de adquirir e, em paralelo com ממכר, é expresso naturalmente pelo substantivo comercial “compra”.
- source_word: ממכר
  choice: venda
  rationale: O termo se refere ao que é vendido ou ao ato de vender; “venda” preserva de modo conciso o par compra–venda.
- source_word: ו־
  choice: nem
  rationale: A conjunção dá continuidade à força negativa da primeira oração; “nem” torna essa relação explícita e natural em português.
- source_word: καὶ βουλὴν καρδίας στήσον
  choice: registrado em nota como paralelo grego divergente
  rationale: O grego preserva uma leitura substancialmente diferente, sobre firmar o conselho do coração. Como o hebraico está preservado neste ponto, ele fundamenta o texto principal, enquanto o testemunho grego é apresentado com transparência em nota.
theological_decisions:
- issue: Divergência substancial entre o hebraico preservado e o paralelo grego
  choice: Seguir no texto principal a leitura hebraica referente ao comerciante e à compra e venda.
  alternative: 'Grego: “Firma o conselho do teu coração, pois nada te é mais fiel do que ele.”'
  rationale: A leitura grega não é uma pequena variante, mas representa uma forma textual distinta. Dar prioridade ao hebraico preservado sem ocultar o grego mantém a base documental e conserva honestamente a tensão entre as tradições.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Barganhe” mantém o cenário de negociação comercial; “a respeito de compra e venda” preserva a formulação compacta e um tanto elíptica do hebraico sem tentar harmonizá-la com a leitura grega.
