  text: A friend fights with a stranger over a good thing[b][a], and against cities he will take up a shield.
translation:
  language: pt
  text: Um amigo luta com um estranho por um bem[b], e contra cidades toma o escudo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Um companheiro sofre com o amigo por causa do próprio estômago e, diante da guerra, tomará o escudo.” O hebraico e o grego diferem de modo significativo na primeira oração e em “cidades”/“guerra”. O texto principal segue o testemunho hebraico preservado.'
    reason: alternative_reading
  - marker: b
    text: O hebraico “bem” também pode significar “benefício” ou “vantagem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוהב
  choice: um amigo
  rationale: Embora seja literalmente um particípio, “aquele que ama”, aqui funciona como substantivo para alguém ligado por amizade; o paralelo grego também situa a frase no âmbito do companheirismo.
- source_word: טוב
  choice: um bem
  rationale: Mantém a concisão e a amplitude do hebraico, podendo indicar algo bom, um benefício ou uma vantagem.
- source_word: נלחם עם זר
  choice: luta com um estranho
  rationale: עם admite aqui sentido adversativo; “luta com” expressa conflito sem acrescentar a ideia étnica que “estrangeiro” poderia sugerir.
- source_word: זר
  choice: estranho
  rationale: Designa alguém de fora do círculo da pessoa; “estranho” preserva essa amplitude melhor que uma designação de nacionalidade.
- source_word: נגד ערים
  choice: contra cidades
  rationale: Segue diretamente o hebraico extante, apesar da expressão difícil; a variante grega “diante da guerra” é registrada em nota.
- source_word: יחזיק צנה
  choice: toma o escudo
  rationale: Expressa de modo natural o ato de empunhar ou assumir o escudo, preservando a imagem marcial.
- source_word: צנה
  choice: escudo
  rationale: É o equivalente português claro e geral; o termo hebraico pode designar um escudo grande, mas essa especificação não é necessária no texto.
