  text: There is a wise man who is despised for his words[a], and he is deprived of every pleasant food.
translation:
  language: pt
  text: Há um sábio que é desprezado pelo que diz[a] e privado de todo alimento agradável.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “O sábio entre seu povo herdará confiança, e seu nome viverá para sempre.” O hebraico e o grego diferem substancialmente neste ponto.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֵשׁ
  choice: Há
  rationale: Expressa de modo natural em português a construção existencial hebraica, sem dar peso excessivo à conjunção inicial.
- source_word: חָכָם
  choice: um sábio
  rationale: Preserva o substantivo masculino singular e é mais natural e digno do que “um homem sábio” neste contexto sapiencial.
- source_word: בִּדְבָרוֹ
  choice: pelo que diz
  rationale: Comunica o provável valor causal da preposição בְּ e o sentido contextual de דָּבָר, abrangendo suas palavras ou sua maneira de falar sem restringir indevidamente a expressão.
- source_word: נִמְאָס
  choice: é desprezado
  rationale: Reflete o Nifal de מאס, que aqui indica ser rejeitado ou tratado com desprezo.
- source_word: וּמִכָּל מַאֲכָל תַּעֲנוּג
  choice: de todo alimento agradável
  rationale: Mantém a imagem concreta de comida que proporciona prazer, evitando transformar a expressão mais geral em “iguarias”.
- source_word: נִבְצָר
  choice: privado
  rationale: Com a construção introduzida por מִן, indica que esse alimento lhe é negado ou permanece fora de seu alcance.
- source_word: ὁ σοφὸς ἐν τῷ λαῷ αὐτοῦ κληρονομήσει πίστιν, καὶ τὸ ὄνομα αὐτοῦ ζήσεται εἰς τὸν αἰῶνα
  choice: registrado em nota, não adotado no texto principal
  rationale: A tradição grega contém uma sentença substancialmente diferente. Como o hebraico está preservado, ele rege o texto principal, enquanto a divergência é apresentada com transparência em nota.
theological_decisions:
- issue: Divergência substancial entre as tradições textuais hebraica e grega em Sirácida 37:26
  choice: Traduzir o hebraico preservado no texto principal
  alternative: 'Seguir o grego: “O sábio entre seu povo herdará confiança, e seu nome viverá para sempre.”'
  rationale: O testemunho hebraico existente é adotado como fonte principal para esta passagem. A leitura grega não é uma simples variante verbal, mas uma linha diferente, e por isso deve ser preservada em nota sem harmonização.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Um sábio” conserva o caráter sapiencial; “pelo que diz” soa natural e mantém a abrangência causal do hebraico. A coordenação foi enxugada para evitar a repetição desnecessária do pronome sujeito.
