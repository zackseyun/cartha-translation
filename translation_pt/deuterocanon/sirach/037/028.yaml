  text: For not everything is beneficial for everyone, and not every person delights in every kind of thing.[a]
translation:
  language: pt
  text: Pois nem tudo é benéfico para todos, e nem toda pessoa se agrada de tudo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico preservado nos manuscritos da Geniza do Cairo é difícil e não corresponde de perto ao grego. Literalmente: “E há um sábio que será sábio para o seu povo; o fruto do seu conhecimento está nos corpos deles.” Por causa dessa divergência, o texto principal segue aqui o testemunho grego, enquanto esta nota registra a leitura hebraica.'
    reason: textual_variant
lexical_decisions:
- source_word: οὐ γὰρ πάντα πᾶσιν συμφέρει
  choice: Pois nem tudo é benéfico para todos
  rationale: O paralelo grego preserva uma máxima coerente no contexto. συμφέρει expressa aquilo que convém, beneficia ou é vantajoso; “é benéfico” comunica o sentido ético geral sem restringi-lo ao lucro material.
- source_word: οὐ πᾶσα ψυχὴ
  choice: nem toda pessoa
  rationale: Aqui ψυχή designa idiomaticamente a pessoa, não apenas uma “alma” em sentido antropológico específico. A formulação mantém o valor distributivo da expressão.
- source_word: ἐν παντὶ εὐδοκεῖ
  choice: se agrada de tudo
  rationale: εὐδοκεῖ indica agrado ou prazer. “Se agrada de tudo” é natural em português e conserva a generalidade de ἐν παντί.
- source_word: וְיֵשׁ חָכָם לְעַמּוֹ יֶחְכָּם
  choice: E há um sábio que será sábio para o seu povo
  rationale: Esta leitura do hebraico preservado é registrada na nota, e não inserida no texto principal, porque o testemunho hebraico diverge substancialmente do grego e parece estar deslocado ou textualmente instável neste ponto.
- source_word: פְּרִי דַעְתּוֹ בִּגְוִיָתָם
  choice: o fruto do seu conhecimento está no corpo deles
  rationale: Tradução deliberadamente literal para documentar na nota a difícil leitura hebraica, sem resolver sua estranheza por conjectura.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pois” mantém a ligação explicativa de γάρ; “pessoa” evita atribuir a ψυχή um sentido técnico de “alma”. A divergência real entre os testemunhos foi preservada em nota, sem harmonização conjectural.
