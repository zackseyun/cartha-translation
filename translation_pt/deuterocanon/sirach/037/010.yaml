  text: 'For he too will think for himself: “Why should this fall to him?”[a][b]'
translation:
  language: pt
  text: 'Pois também ele pensará no próprio interesse: “Por que isso deveria caber a ele?”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é conciso e um tanto difícil aqui. O paralelo grego diz: “Não peças conselho a quem te olha de soslaio e esconde teu plano dos que têm inveja de ti”, apoiando a ideia de que a outra pessoa calcula segundo o próprio interesse ou por má vontade.'
    reason: alternative_reading
  - marker: b
    text: 'Ou, mais literalmente: “Pois também ele pensará em tua vida/alma: ‘Por que isso deveria acontecer com ele?’” A formulação hebraica permite alguma incerteza quanto ao sentido de “tua vida/alma” e quanto à pessoa a quem se refere o pronome final.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כי
  choice: Pois
  rationale: Introduz a razão da advertência no contexto e mantém o estilo conciso da literatura sapiencial.
- source_word: גם הוא
  choice: também ele
  rationale: Preserva a força aditiva do hebraico e destaca a outra pessoa como alguém que também faz seus próprios cálculos.
- source_word: לנפשך
  choice: no próprio interesse
  rationale: O texto hebraico transmitido é difícil e, literalmente, aponta para 'tua vida/alma'. À luz do contexto e do paralelo grego, a expressão parece indicar cálculo interesseiro; a tradução explicita essa leitura sem ocultar a dificuldade em nota.
- source_word: יחשב
  choice: pensará
  rationale: Expressa de modo natural o ato de considerar ou calcular mentalmente, com a conotação contextual de interesse próprio.
- source_word: למה זה
  choice: Por que isso deveria
  rationale: Reproduz naturalmente a pergunta retórica e sua nuance deliberativa em português.
- source_word: אליו יפול
  choice: caber a ele
  rationale: Conserva a ideia de algo que toca a alguém ou lhe cai por sorte, sem decidir se se trata de benefício ou acontecimento adverso.
