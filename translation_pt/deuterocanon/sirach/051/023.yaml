  source_fidelity: A tradução representa adequadamente o hebraico. “Dirijam-se a mim” transmite o imperativo פְּנוּ אֵלַי sem transformar desnecessariamente o convite em uma noção de conversão; a nota registra de modo apropriado a alternativa apoiada pelo grego. “Vocês que não têm instrução” é bem sustentado pelo contexto pedagógico e por ἀπαίδευτοι, preservando em nota os sentidos mais avaliativos de סְכָלִים. “Hospedem-se” conserva a imagem concreta de לין e de αὐλίσθητε. “Na casa do meu ensino” mantém tanto a imagem de בית quanto o possessivo de מִדְרָשִׁי, sem anacronismo institucional.
  naturalness: O português é moderno, claro e de registro adequado. “Casa do meu ensino” é uma formulação algo literária, mas é natural o bastante no contexto sapiencial e preserva uma imagem que alternativas como “escola” ou “casa de estudos” poderiam especificar ou alterar. “Hospedem-se” é compreensível e intencionalmente conserva a metáfora de alojar-se.
  terminology: As escolhas evitam impor uma leitura moral condenatória a סְכָלִים e não introduzem terminologia confessional ou institucional posterior. As notas distinguem corretamente a alternativa grega e a amplitude semântica hebraica.
