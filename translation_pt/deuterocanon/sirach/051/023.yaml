  text: Turn to me[a], you who are simple[b], and lodge in the house of my instruction.
translation:
  language: pt
  text: Dirijam-se a mim[a], vocês que não têm instrução[b], e hospedem-se na casa do meu ensino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “Aproximem-se de mim”. O paralelo grego diz: “Aproximem-se de mim, vocês que não têm instrução, e hospedem-se na casa da instrução”.'
    reason: lexical_alternative
  - marker: b
    text: O hebraico também pode ser traduzido por “vocês, insensatos” ou “vocês, simples”. O paralelo grego favorece aqui o sentido de pessoas sem instrução ou treinamento.
    reason: alternative_reading
lexical_decisions:
- source_word: פְּנוּ אֵלַי
  choice: Dirijam-se a mim
  rationale: O imperativo de פנה exprime voltar-se ou dirigir-se para alguém. “Dirijam-se a mim” conserva esse movimento sem sugerir necessariamente um retorno anterior; o paralelo grego confirma o caráter de convite.
- source_word: סְכָלִים
  choice: vocês que não têm instrução
  rationale: O termo pode designar pessoas insensatas, simples ou sem formação. Neste convite pedagógico, e à luz do grego ἀπαίδευτοι, a falta de instrução está em primeiro plano, sem eliminar em nota as alternativas mais contundentes.
- source_word: וְלִינוּ
  choice: e hospedem-se
  rationale: לין significa passar a noite ou alojar-se. “Hospedem-se” mantém a imagem concreta de entrar e permanecer num lugar de aprendizagem, também refletida pelo grego αὐλίσθητε.
- source_word: בְּבֵית מִדְרָשִׁי
  choice: na casa do meu ensino
  rationale: A expressão associa uma casa ao estudo ou à instrução do mestre. Esta formulação preserva a imagem e o possessivo hebraico sem impor o sentido institucional mais tardio de uma escola religiosa técnica.
theological_decisions:
- issue: Se סְכָלִים deve ser entendido sobretudo como censura moral ou como falta de formação
  choice: vocês que não têm instrução
  alternative: vocês, insensatos; vocês, simples
  rationale: O contexto é um convite à aprendizagem, e o paralelo grego favorece o sentido de pessoas não instruídas ou não treinadas. A tradução principal evita transformar o chamado pedagógico numa condenação moral inequívoca, enquanto a nota conserva a amplitude do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construções naturais para leitores brasileiros. A imagem da hospedagem e da casa de ensino foi preservada, assim como a ambiguidade pedagógica e moral de סְכָלִים.
