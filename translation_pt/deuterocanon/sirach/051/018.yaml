translation:
  language: pt
  text: Planejei melhorar o meu caminho[a] e não voltarei atrás, pois o encontrarei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: “Pois resolvi praticá-la, fui zeloso pelo que é bom e certamente não serei envergonhado.” Essa leitura reflete uma forma textual substancialmente diferente do hebraico preservado.'
    reason: textual_variant
lexical_decisions:
- source_word: חָשַׁבְתִּי
  choice: Planejei
  rationale: O verbo expressa reflexão deliberada e propósito; “planejei” comunica essa intenção de modo natural, sem intensificá-la indevidamente como um juramento ou decisão absoluta.
- source_word: לְהִיטֶיב
  choice: melhorar
  rationale: Com “meu caminho” como objeto, o infinitivo indica tornar melhor a própria maneira de viver; “melhorar” preserva essa ideia de correção moral.
- source_word: דַּרְכִּי
  choice: o meu caminho
  rationale: Mantém a metáfora hebraica de “caminho” como modo de vida, sem reduzi-la explicitamente a “conduta”.
- source_word: וְלֹא אַהֲפֹךְ
  choice: e não voltarei atrás
  rationale: Embora a forma seja textualmente difícil, no contexto expressa a recusa de inverter o rumo escolhido; a tradução conserva a imagem de movimento presente em “caminho”.
- source_word: כִּי אֶמְצָאֶנּוּ
  choice: pois o encontrarei
  rationale: מצא significa “encontrar” ou “alcançar”. O pronome hebraico tem referente implícito e gramaticalmente masculino; “o encontrarei” preserva essa indefinição melhor do que explicitar “a sabedoria” ou “o bem”.
theological_decisions:
- issue: Divergência substancial entre o texto hebraico e o grego
  choice: 'Seguir no texto principal o hebraico: “e não voltarei atrás, pois o encontrarei”.'
  alternative: 'O grego diz: “Pois resolvi praticá-la, fui zeloso pelo que é bom e certamente não serei envergonhado.”'
  rationale: O hebraico sobrevivente é a testemunha principal adotada para esta passagem de Sirácida. Como o grego representa uma forma textual bastante diferente e altera materialmente o sentido, sua leitura é registrada integralmente em nota, sem harmonização.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a metáfora do caminho e a referência não explicitada do pronome final. O futuro “não voltarei” representa naturalmente a forma hebraica no contexto.
