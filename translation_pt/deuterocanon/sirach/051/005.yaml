  text: from lips of wickedness and from those who smear lies[a], and from the arrows of a deceitful tongue.
translation:
  language: pt
  text: dos lábios da maldade e dos que inventam mentiras[a], e das flechas de uma língua enganosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego paralelo diz: “de uma língua impura e de uma palavra falsa”, em vez de “dos lábios da maldade e dos que inventam mentiras [...] e das flechas de uma língua enganosa”. Como o hebraico foi preservado neste versículo, o texto principal segue o testemunho hebraico; a leitura grega é registrada aqui porque a diferença é substancial.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִשִׂפְתֵי זִמָּה
  choice: dos lábios da maldade
  rationale: A preposição מִן indica aquilo de que o orante foi livrado; שפה mantém a imagem concreta dos “lábios”, e זִמָּה recebe aqui o sentido moral amplo de “maldade”, adequado ao contexto de mentira e engano.
- source_word: וְטֹפְלֵי שֶׁקֶר
  choice: e dos que espalham mentiras
  rationale: O particípio טֹפְלֵי pode evocar aplicar, imputar ou fabricar falsidade. “Os que espalham mentiras” comunica em português corrente pessoas que produzem ou fazem circular acusações falsas, sem a estranheza da metáfora literal de rebocar.
- source_word: וְחִצֵּי
  choice: e das flechas
  rationale: A preposição inicial é entendida como continuando na série. “Flechas” preserva a metáfora da fala que fere.
- source_word: לְשוֹן מִרְמָה
  choice: de uma língua enganosa
  rationale: “Língua” conserva o paralelismo corporal com “lábios”; מִרְמָה é expresso naturalmente como adjetivo, sem perder o sentido de engano ou falsidade.
- source_word: ἀπὸ γλώσσης ἀκαθάρτου καὶ λόγου ψευδοῦς
  choice: não adotado no texto principal
  rationale: O paralelo grego apresenta uma leitura substancialmente diferente. Como o hebraico está preservado neste trecho e constitui a fonte principal, ele rege o texto, enquanto a variante grega é registrada em nota.
