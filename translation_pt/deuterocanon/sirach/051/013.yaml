base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/013.yaml
  text: I was young[a], and I loved wisdom; I desired her and sought her out. In faithfulness my foot walked; from my youth, O Lord[b], I learned wisdom.
translation:
  language: pt
  text: Eu era jovem e amei a sabedoria[a]; eu a desejei e a busquei. Com fidelidade[b], meu pé andou; desde a minha juventude, ó Senhor, aprendi sabedoria.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras “e amei a sabedoria” aparecem entre colchetes na edição hebraica, indicando incerteza na preservação ou reconstrução do texto.
    reason: textual_uncertainty
  - marker: b
    text: 'Ou: “Na verdade”. O termo hebraico também pode expressar verdade ou confiabilidade.'
    reason: lexical_alternative
  - marker: c
    text: 'O paralelo grego difere consideravelmente: “Quando eu ainda era jovem, antes de me desviar, busquei abertamente a sabedoria em minha oração”. O texto principal segue o testemunho hebraico sobrevivente.'
    reason: alternative_reading
lexical_decisions:
- source_word: נַעַר
  choice: jovem
  rationale: Expressa a juventude do narrador sem especificar além do necessário sua idade ou condição.
- source_word: וָאוֹהַב חָכְמָה
  choice: amava a sabedoria
  rationale: Reproduz de modo direto a frase hebraica preservada entre colchetes na edição e mantém a sabedoria como realidade personificada no restante da oração.
- source_word: וְחָפַצְתִּי בָהּ
  choice: eu a desejava
  rationale: חפץ pode indicar desejo ou deleite; “desejava” conserva a força volitiva e permite que o pronome feminino retome naturalmente “sabedoria” em português.
- source_word: וּבִקַּשְׁתִיהָ
  choice: a buscava
  rationale: בקׁש denota busca intencional. A formulação é clara e natural sem acrescentar um resultado não expresso no hebraico.
- source_word: בַּאֲמִתָּהּ
  choice: Com fidelidade
  rationale: אמת pode significar fidelidade, verdade ou confiabilidade. No contexto do caminhar, “com fidelidade” comunica uma maneira constante e íntegra de viver, preservando a alternativa lexical em nota.
- source_word: דָּרְכָה רַגְלִי
  choice: meu pé caminhou
  rationale: Mantém a imagem concreta e enfática do pé presente no hebraico, em construção ainda compreensível em português.
- source_word: מִנְּעוּרַי
  choice: desde a minha juventude
  rationale: Indica com naturalidade o ponto inicial de um aprendizado que remonta aos primeiros anos.
- source_word: אֲדֹנָי
  choice: ó Senhor
  rationale: O contexto favorece a leitura como vocativo. A partícula “ó” torna a interpelação inequívoca e digna em português.
- source_word: לָמַדְתִּי
  choice: aprendi
  rationale: É o sentido direto da forma ativa hebraica, sem estreitá-la para estudo formal nem convertê-la em voz passiva.
theological_decisions:
- issue: Prioridade do testemunho hebraico diante da forma grega divergente
  choice: Seguir no texto principal o hebraico sobrevivente, incluindo o amor, o desejo e a busca da sabedoria desde a juventude.
  alternative: 'Seguir o grego: “Quando eu ainda era jovem, antes de me desviar, busquei abertamente a sabedoria em minha oração.”'
  rationale: Como há testemunho hebraico para o versículo, ele deve fundamentar a tradução. A versão grega difere de modo substancial e não deve ser harmonizada silenciosamente, mas sua leitura é relevante e fica registrada em nota.
- issue: Personificação da sabedoria
  choice: Retomar “sabedoria” pelos pronomes femininos “a”.
  alternative: Evitar a personificação mediante repetições nominais ou construções impessoais.
  rationale: Os sufixos femininos hebraicos retomam חָכְמָה; o português permite conservar essa personificação sem impor uma interpretação doutrinária adicional.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A repetição de “eu” na primeira frase preserva o paralelismo e a iniciativa pessoal do hebraico; a imagem “meu pé caminhou” foi mantida por seu valor poético concreto.
