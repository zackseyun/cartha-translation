base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/012.yaml
  text: For he redeemed me from every evil[a], and delivered me in the day of trouble.
translation:
  language: pt
  text: Pois ele me redimiu de todo mal[a] e me livrou no dia da angústia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Pois tu me salvaste da destruição e me livraste de um tempo mau.” O hebraico traz “de todo mal” e “no dia da angústia”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְדֵּנִי
  choice: me redimiu
  rationale: O verbo פדה expressa libertar ou resgatar, muitas vezes com a nuance mais forte de redenção. “Redimiu” preserva essa força e mantém distinção em relação ao verbo paralelo seguinte.
- source_word: מִכָּל רָע
  choice: de todo mal
  rationale: רָע pode indicar mal moral, dano ou calamidade. “Todo mal” conserva a amplitude do hebraico sem restringir o sentido a uma única espécie de adversidade.
- source_word: וַיְמַלְּטֵנִי
  choice: me livrou
  rationale: מלט aqui significa pôr a salvo ou fazer escapar. “Livrou” é natural em português e preserva o paralelismo sem repetir “redimiu”.
- source_word: בְּיוֹם צָרָה
  choice: no dia da angústia
  rationale: A expressão hebraica designa concretamente um período de aflição. “No dia da angústia” mantém a forma idiomática e poética do original.
theological_decisions:
- issue: Prioridade entre o texto hebraico e o paralelo grego
  choice: Traduzir o hebraico preservado como texto principal e registrar o grego em nota.
  alternative: 'Seguir o grego: “Pois tu me salvaste da destruição e me livraste de um tempo mau.”'
  rationale: O hebraico é coerente e está preservado neste ponto. O grego traz diferenças reais de pessoa verbal e vocabulário, por isso serve como testemunho paralelo significativo, sem substituir silenciosamente a leitura hebraica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve cadência poética. A redação conserva o paralelismo hebraico e evita limitar a ambiguidade semântica de רָע.
