  text: My soul came near to death[b][a], and my life to the depths of Sheol.
translation:
  language: pt
  text: Minha alma se aproximou da morte[a], e minha vida se aproximou das profundezas do Sheol[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha alma tocou a morte”. O verbo hebraico significa literalmente “tocar” ou “alcançar”, mas aqui provavelmente indica proximidade, como no paralelo grego.
    reason: lexical_alternative
  - marker: b
    text: “Sheol” é o termo hebraico para o domínio dos mortos; o paralelo grego traz “Hades abaixo”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּגַּע
  choice: chegou perto
  rationale: O verbo נגע significa literalmente “tocar” ou “alcançar”, mas, com לַמָּוֶת (“à morte”), expressa aqui proximidade. O paralelo grego ἤγγισεν (“aproximou-se”) confirma esse sentido.
- source_word: נַפְשִׁי
  choice: minha alma
  rationale: נפש pode significar “vida”, “pessoa” ou “alma”. “Minha alma” preserva a distinção poética em relação a חַיָּתִי (“minha vida”) no segundo membro.
- source_word: חַיָּתִי
  choice: minha vida
  rationale: O termo designa a vida ou força vital do falante; esta forma é clara, natural e corresponde ao grego ἡ ζωή μου.
- source_word: לִשְׁאוֹל
  choice: do Sheol
  rationale: Sheol é o termo hebraico para o domínio dos mortos. A transliteração preserva o conceito do texto-fonte sem reduzi-lo à sepultura nem substituí-lo pelo termo grego Hades.
- source_word: תַּחְתִּיּוֹת
  choice: às profundezas
  rationale: O plural indica as regiões mais baixas ou profundas. “Às profundezas do Sheol” comunica com concisão a força intensificadora do hebraico e concorda com o grego κάτω (“embaixo”).
theological_decisions:
- issue: Tradução de שְׁאוֹל diante do paralelo grego ᾅδης
  choice: Sheol
  alternative: Hades; sepultura; mundo dos mortos
  rationale: Como o testemunho hebraico está preservado e é a fonte primária, mantém-se seu termo específico por transliteração. O paralelo grego confirma o sentido geral de domínio dos mortos, mas não exige substituir o conceito hebraico nem formular uma afirmação mais definida sobre a vida após a morte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A elipse verbal do segundo membro foi preservada por meio da vírgula, mantendo o paralelismo conciso do hebraico.
