base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/008.yaml
  text: And I remembered the mercies of Yahweh[a], and his acts of covenant faithfulness from of old, who delivers those who take refuge in him[b], and redeems them from every evil.
translation:
  language: pt
  text: Lembrei-me das misericórdias do SENHOR e dos seus atos de fidelidade à aliança desde os tempos antigos.[a] Ele livra os que nele se refugiam[b] e os resgata de todo mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e do seu amor leal desde sempre”. A expressão hebraica pode enfatizar tanto a fidelidade divina manifestada desde a antiguidade quanto sua permanência por todo o tempo.'
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego paralelo traz: “os que esperam em ti” e, em seguida, “tu os salvas da mão das nações”. O testemunho hebraico aqui diz: “os que nele se refugiam” e “de todo mal”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶזְכְּרָה
  choice: Lembrei-me
  rationale: Traduz diretamente o verbo זכר e mantém o relato em primeira pessoa com naturalidade em português.
- source_word: רַחֲמֵי
  choice: misericórdias
  rationale: Preserva o plural hebraico e expressa as manifestações concretas da compaixão divina.
- source_word: יְהֹוָה
  choice: SENHOR
  rationale: Segue a convenção portuguesa amplamente reconhecida de representar o nome divino por SENHOR em versaletes.
- source_word: וַחֲסָדָיו
  choice: seus atos de fidelidade à aliança
  rationale: Torna perceptível tanto o plural quanto o sentido de lealdade constante de חסד, sem reduzi-lo a mera bondade genérica.
- source_word: אֲשֶׁר מֵעוֹלָם
  choice: desde os tempos antigos
  rationale: Expressa duração remota sem decidir entre antiguidade histórica e eternidade absoluta.
- source_word: הַמַּצִּיל
  choice: Ele livra
  rationale: O particípio caracteriza a ação habitual de Deus. Uma oração independente é natural em português e evita impor exclusivamente uma relação causal ou relativa.
- source_word: חוֹסֵי בוֹ
  choice: os que nele se refugiam
  rationale: Preserva a metáfora concreta de חסה ב, que indica buscar proteção, e não apenas crer de modo genérico.
- source_word: וַיִּגְאָלֵם
  choice: os resgata
  rationale: Comunica a ação forte de גאל como libertação ou redenção, em linguagem clara e digna.
- source_word: מִכָּל רָע
  choice: de todo mal
  rationale: Mantém a abrangência do hebraico, que pode incluir maldade, calamidade e dano.
theological_decisions:
- issue: Sentido de חסד na descrição da ação salvadora de Deus
  choice: atos de fidelidade à aliança
  alternative: amor leal; bondades
  rationale: A formulação conserva a dimensão de lealdade duradoura e o plural de ações, sem restringir חסד a mero afeto.
- issue: Força temporal de מֵעוֹלָם
  choice: desde os tempos antigos
  alternative: desde a eternidade; desde sempre
  rationale: A expressão hebraica admite tanto remota antiguidade quanto continuidade sem começo definido; a tradução principal evita transformar essa ambiguidade em afirmação metafísica explícita.
- issue: Relação sintática de הַמַּצִּיל com a frase anterior
  choice: 'nova oração: “Ele livra”'
  alternative: “que livra”; “pois ele livra”
  rationale: O particípio definido descreve o SENHOR como aquele que livra. A oração independente preserva essa caracterização sem decidir se a relação deve ser lida estritamente como relativa ou causal.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe acessível. “SENHOR” segue a convenção bíblica para o nome divino; “fidelidade à aliança” conserva o peso de חסד, enquanto as notas registram alternativas legítimas e a variante grega.
