  text: May my soul rejoice in my old age[a], and may you not be put to shame by my song.
translation:
  language: pt
  text: Que a minha alma se alegre na minha velhice[a], e que vocês não sejam envergonhados por causa do meu cântico.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Que a alma de vocês se alegre na misericórdia dele, e que vocês não sejam envergonhados no louvor dele.” O testemunho hebraico traz, em vez disso, “a minha alma”, “na minha velhice” e “meu cântico”.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׂמַח
  choice: Que ... se alegre
  rationale: Expressa naturalmente em português o valor volitivo/jussivo do hebraico e corresponde ao optativo do paralelo grego.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: Preserva o idioma hebraico e seu sentido pessoal e interior, sem reduzi-lo simplesmente a “eu”.
- source_word: בְּשֵׂיבָתִי
  choice: na minha velhice
  rationale: שֵׂיבָה pode indicar cabelos brancos ou velhice; “na minha velhice” comunica o sentido idiomático com naturalidade.
- source_word: וְלֹא תֵבוֹשוּ
  choice: e que vocês não sejam envergonhados
  rationale: Mantém o valor volitivo, a segunda pessoa do plural e a nuance passiva de vergonha ou desonra presente em בוש.
- source_word: בְּשִׁירָתִי
  choice: por causa do meu cântico
  rationale: O substantivo hebraico aponta para “meu cântico/minha canção”. No contexto de não ser envergonhado, “por causa de” expressa em português natural a relação possível indicada pela preposição בְּ, sem adotar a leitura grega “seu louvor”.
theological_decisions:
- issue: Divergência substancial entre o hebraico e o paralelo grego
  choice: 'Seguir no texto principal o hebraico: “a minha alma ... na minha velhice ... meu cântico”, preservando o tom de desejo e o destinatário plural.'
  alternative: 'Paralelo grego: “Que a alma de vocês se alegre na misericórdia dele, e que vocês não sejam envergonhados no louvor dele.”'
  rationale: O hebraico existente é a fonte primária e tem alta confiança. O grego confirma o caráter volitivo e a segunda pessoa plural na segunda oração, mas reflete conteúdo e pessoas gramaticais diferentes; por isso, sua leitura é registrada em nota, sem substituir o hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” explicita de modo natural o destinatário plural. “Cântico” preserva o tom poético e sapiencial.
