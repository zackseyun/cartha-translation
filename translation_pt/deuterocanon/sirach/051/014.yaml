  text: I prayed for her in my youth[a], and I found much knowledge.
translation:
  language: pt
  text: Em minha juventude, orei[a] e encontrei muito conhecimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego paralelo diz: «Diante do templo, pedi por ela, e até o fim a buscarei». O testemunho hebraico, porém, diz: «Em minha juventude, orei e encontrei muito conhecimento».'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל תְּפִלָּה
  choice: orei
  rationale: O hebraico emprega um acusativo cognato, literalmente «orei uma oração». Em português corrente, «orei» preserva naturalmente o sentido e evita uma construção redundante.
- source_word: בִּנְעֻרוֹתָי
  choice: em minha juventude
  rationale: A forma abstrata plural designa o período da juventude. Esta expressão é clara, digna e lexicalmente próxima do hebraico.
- source_word: וְהַרְבֵּה
  choice: muito
  rationale: O termo indica abundância e, ligado a «conhecimento», é expresso de modo idiomático por «muito».
- source_word: מָצָאתִי
  choice: encontrei
  rationale: Mantém o sentido básico de «achar/encontrar» e conserva a metáfora concreta de chegar ao conhecimento, sem substituí-la por «obtive».
- source_word: דֵעָה
  choice: conhecimento
  rationale: É a correspondência lexical mais direta. «Sabedoria» confundiria este substantivo com outro termo hebraico, embora a sabedoria seja o tema do contexto.
- source_word: περὶ αὐτῆς / αὐτήν
  choice: por ela (registrado apenas na leitura grega da nota)
  rationale: Os pronomes femininos gregos retomam a sabedoria, mas não têm correspondente explícito no texto hebraico preservado; por isso, não foram inseridos no texto principal.
theological_decisions:
- issue: Relação entre a redação hebraica e a leitura grega no contexto da busca pela sabedoria
  choice: Manter no texto principal a redação hebraica, sem acrescentar um objeto feminino ausente dela, e registrar integralmente a divergência grega em nota.
  alternative: «Em minha juventude, orei por ela e encontrei muito conhecimento»; ou, conforme o grego, «Diante do templo, pedi por ela, e até o fim a buscarei».
  rationale: O testemunho hebraico é a fonte primária e tem alta confiança. O grego não apenas explicita «por ela», mas apresenta uma linha substancialmente diferente. Fundir as duas redações no texto principal ocultaria essa tensão textual; a nota permite que ambas permaneçam visíveis sem resolver indevidamente a divergência.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada para soar natural em português. A concisão de «orei» reproduz idiomaticamente a expressão cognata hebraica, e a nota preserva a importante divergência entre os testemunhos hebraico e grego.
