  text: Many heard my instruction in my youth[b][a], and they acquired silver and gold by me.
translation:
  language: pt
  text: Muitos ouviram meu ensino durante a minha juventude[a], e adquiriram prata e ouro por meu intermédio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Recebei instrução por grande quantidade de prata e adquiri nela muito ouro.” O testemunho hebraico aqui é declarativo, não imperativo.'
    reason: alternative_reading
  - marker: b
    text: Ou “por mim” ou “em mim”. A expressão hebraica é compacta; “por meu intermédio” entende que o ensino do sábio foi o meio pelo qual outros adquiriram riqueza.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: Muitos
  rationale: Reproduz de modo direto e natural o valor quantitativo do hebraico.
- source_word: שָׁמְעוּ
  choice: ouviram
  rationale: Mantém o sentido básico de recepção auditiva sem explicitar indevidamente as ideias possíveis de atenção ou obediência.
- source_word: לִמּוּדִי
  choice: meu ensino
  rationale: Expressa o conteúdo didático do substantivo derivado de למד em linguagem clara e digna.
- source_word: בִּנְעֻרוֹתָי
  choice: durante a minha juventude
  rationale: Traduz naturalmente o período da juventude indicado pelo substantivo hebraico.
- source_word: וְכֶסֶף וְזָהָב
  choice: prata e ouro
  rationale: Conserva a imagem concreta dos dois metais preciosos presente tanto no hebraico quanto no paralelo grego.
- source_word: תִּקְנוּ
  choice: adquiriram
  rationale: קנה indica obter ou adquirir; a forma declarativa hebraica não deve ser substituída pelo imperativo do paralelo grego.
- source_word: בִּי
  choice: por meu intermédio
  rationale: Comunica de modo inteligível o provável valor instrumental ou mediador da preposição, sem ocultar em nota sua formulação compacta e ambígua.
theological_decisions:
- issue: Relação entre o texto hebraico declarativo e o paralelo grego imperativo
  choice: Seguir o hebraico extante como afirmação sobre muitos que ouviram e adquiriram riqueza.
  alternative: 'Seguir o grego: “Recebei instrução por grande quantidade de prata e adquiri nela muito ouro.”'
  rationale: O testemunho hebraico, classificado como de alta confiança, é a fonte primária neste ponto. O grego preserva uma leitura substancialmente diferente, que deve ser registrada sem deslocar silenciosamente o hebraico.
- issue: Sentido de בִּי na oração final
  choice: por meu intermédio
  alternative: em mim / por mim
  rationale: A expressão hebraica é compacta e admite mais de uma relação semântica. A tradução principal apresenta a leitura instrumental mais inteligível, enquanto a nota preserva as alternativas mais formais.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém o tom sapiencial digno, segue prioritariamente o hebraico e registra as diferenças relevantes do grego em nota.
