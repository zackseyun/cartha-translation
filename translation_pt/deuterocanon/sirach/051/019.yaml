lexical_decisions:
- source_word: חַשְׁקָה נַפְשִׁי בָּהּ
  choice: Minha alma se apegou a ela
  rationale: Expressa o forte vínculo ou desejo da alma pela sabedoria, mantendo a personificação feminina e acompanhando o sentido contextual adotado pela camada inglesa auditada.
- source_word: וּפָנַי לֹא אַהֲפֹך מִמֶּנָּה
  choice: e não desviei dela o rosto
  rationale: Preserva concretamente a imagem hebraica de virar ou desviar o rosto, com ordem natural em português.
theological_decisions:
- issue: Referente do pronome feminino בָּהּ / מִמֶּנָּה
  choice: ela
  alternative: a sabedoria
  rationale: O hebraico emprega pronomes femininos cujo referente é recuperado do contexto; manter “ela” conserva a coesão e não explicita no versículo o que o original deixa implícito.
translation_notes:
  register: Português atual, digno e acessível, com formulação concisa e imagem corporal preservada. A tradução prioriza o hebraico de alta confiança; a forma grega paralela é mais extensa e parece refletir uma tradição textual diferente, por isso seu conteúdo adicional não foi incorporado.
