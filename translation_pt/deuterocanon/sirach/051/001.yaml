base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/001.yaml
  text: I will praise you[a], God of my salvation; I will give thanks to you, God of my father. I will declare your name, the stronghold of my life[c][b], for you have redeemed my soul from death.
translation:
  language: pt
  text: Eu te louvarei, Deus da minha salvação; eu te darei graças, Deus de meu pai. Proclamarei o teu nome, fortaleza da minha vida,[a] pois resgataste da morte a minha alma.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão hebraica também pode ser entendida como: “Proclamarei o teu nome como a fortaleza da minha vida” ou “o teu nome é a fortaleza da minha vida”.'
    reason: lexical_alternative
  - marker: b
    text: “Minha alma” também pode ser traduzido por “minha vida” ou “a mim”; o hebraico néfesh pode assumir esses sentidos conforme o contexto.
    reason: lexical_alternative
  - marker: c
    text: 'O texto grego começa de modo um pouco diferente: “Eu te darei graças, Senhor Rei, e te louvarei, Deus, meu Salvador”.'
    reason: textual_variant
lexical_decisions:
- source_word: אֲהַלְלֶךָּ
  choice: Eu te louvarei
  rationale: O piel de הלל expressa louvor; esta formulação é natural, digna e preserva a distinção em relação a אוֹדְךָ.
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: Deus da minha salvação
  rationale: Mantém diretamente a construção hebraica e sua ressonância bíblica, sem convertê-la no título pessoal “meu Salvador”.
- source_word: אוֹדְךָ
  choice: eu te darei graças
  rationale: ידה no hifil pode significar agradecer, confessar ou louvar; “darei graças” distingue este verbo do anterior sem perder o paralelismo.
- source_word: אֱלֹהֵי אָבִי
  choice: Deus de meu pai
  rationale: Preserva o singular explícito אָבִי, sem generalizá-lo para “antepassados” ou “pais”.
- source_word: אֲסַפְּרָה
  choice: Proclamarei
  rationale: ספר aqui tem o sentido de contar, declarar ou proclamar; “proclamarei” combina com o contexto público de louvor.
- source_word: שִׁמְךָ
  choice: o teu nome
  rationale: Conserva a expressão hebraica e sua amplitude semântica, que pode envolver o caráter e a reputação revelados de Deus.
- source_word: מָעוֹז חַיַּי
  choice: fortaleza da minha vida
  rationale: מָעוֹז designa lugar de força, refúgio ou fortaleza. “Fortaleza” mantém concreta a metáfora e a aposição do hebraico.
- source_word: פָדִיתָ
  choice: resgataste
  rationale: פדה comunica resgate ou redenção. “Resgataste” é corrente em português, preserva a ideia de libertação custosa e evita impor uma formulação doutrinária posterior.
- source_word: נַפְשִׁי
  choice: a minha alma
  rationale: נפש pode significar alma, vida ou o próprio ser. “Minha alma” preserva a forma poética e a ambiguidade tradicional, com alternativas registradas em nota.
theological_decisions:
- issue: Sentido de פָדִיתָ no contexto de ação de graças
  choice: resgataste
  alternative: redimiste; livraste
  rationale: A escolha retém o campo semântico de resgate/redação sem reduzir o verbo a simples escape nem importar uma estrutura soteriológica posterior.
- issue: Relação sintática de שִׁמְךָ com מָעוֹז חַיַּי
  choice: o teu nome, fortaleza da minha vida
  alternative: o teu nome como a fortaleza da minha vida; o teu nome é a fortaleza da minha vida
  rationale: O hebraico permite que “fortaleza da minha vida” esteja em aposição a “teu nome”. A tradução preserva essa concisão e a tensão poética sem acrescentar um verbo copulativo.
- issue: Referente de נַפְשִׁי
  choice: a minha alma
  alternative: a minha vida; a mim
  rationale: A formulação mantém a polissemia antropológica de נפש e não força uma separação técnica entre alma e corpo; a nota explicita as leituras possíveis.
translation_notes:
  register: Português moderno, corrente e solene, com boa legibilidade brasileira e compreensão internacional. Emprega próclise natural (“te louvarei”) e vocabulário bíblico reconhecível sem arcaísmos excessivos. A ordem e as aposições poéticas do hebraico foram conservadas quando inteligíveis.
