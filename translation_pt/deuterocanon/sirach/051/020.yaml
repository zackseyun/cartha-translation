base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/020.yaml
  text: I gave my soul after her, and for everlasting ages I will not turn away from her. In purity I found her, and from the beginning I acquired a heart for her.
translation:
  language: pt
  text: Entreguei minha alma em busca dela e, por toda a eternidade, não me desviarei dela. Encontrei-a na pureza e, desde o princípio, adquiri um coração voltado para ela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשִׁי נָתַתִּי אַחֲרֶיהָ
  choice: Entreguei minha alma em busca dela
  rationale: Preserva o hebraísmo «dei minha alma» e expressa naturalmente o sentido direcional de אַחֲרֶיהָ, isto é, dedicar-se a buscar ou seguir a sabedoria.
- source_word: לְנֵצַח נְצָחִים
  choice: por toda a eternidade
  rationale: Reproduz de modo idiomático e enfático a expressão hebraica de duração ilimitada.
- source_word: לֹא אַטֶּה מִמֶּנָּה
  choice: não me desviarei dela
  rationale: Mantém a imagem verbal de inclinar-se ou afastar-se da sabedoria, sem reduzir a frase a simples abandono.
- source_word: וּבְטָהֳרָה מְצָאתִיהָ
  choice: Encontrei-a na pureza
  rationale: Conserva a concisão e a possível ambiguidade de בְּ, que pode indicar esfera, estado ou meio, sem especificar além do hebraico.
- source_word: וְלֵב קָנִיתִי לָהּ
  choice: adquiri um coração voltado para ela
  rationale: Traduz קנה por «adquiri» e torna compreensível a relação expressa por לָהּ, preservando a imagem do coração orientado para a sabedoria.
- source_word: מִתְּחִלָּתָהּ
  choice: desde o princípio
  rationale: Segue diretamente o hebraico; o sufixo pode relacionar o começo à busca ou à sabedoria, e a tradução evita resolver essa ligação de modo excessivo.
theological_decisions:
- issue: Referente feminino dos pronomes
  choice: Manter «dela» e «-a», remetendo à sabedoria personificada no contexto
  alternative: Substituir repetidamente por «sabedoria»
  rationale: O hebraico usa formas femininas sem repetir o substantivo; conservar os pronomes mantém a personificação e a coesão poética.
- issue: Pureza como condição ou meio
  choice: «na pureza»
  alternative: «por meio da purificação»
  rationale: O hebraico טָהֳרָה favorece «pureza», enquanto o grego traz καθαρσμός, «purificação». A tradução segue prioritariamente o texto hebraico e preserva sua abertura sem harmonização.
translation_notes:
  register: Português moderno, digno e acessível, com leve elevação poética. A construção hebraica «dei minha alma atrás dela» foi vertida de forma compreensível sem apagar a imagem de dedicação integral. Não foram acrescentadas notas, pois nenhuma divergência textual precisa ser exibida para a leitura deste versículo.
