  terminology: «Alma», «pureza», «coração» e a referência feminina à Sabedoria são escolhas adequadas e não introduzem interpretação doutrinária. A redação também é consistente com o trilho de auditoria inglês, sem ficar subordinada a ele onde o hebraico preserva uma ambiguidade relevante.
