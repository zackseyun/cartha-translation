base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/010.yaml
  text: 'And I will exalt you: O Yahweh[a], you are my Father, for you are the mighty one of my salvation. Do not let me grow weak in the day of distress[b], in the day of ruin and desolation.'
translation:
  language: pt
  text: 'Eu te exaltarei: Ó SENHOR[a], tu és meu Pai, pois és o Poderoso da minha salvação. Não me deixes enfraquecer no dia da aflição[b], no dia de ruína e desolação.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Invoquei o Senhor, pai do meu senhor”. O hebraico diz: “Ó SENHOR, tu és meu Pai”.'
    reason: alternative_reading
  - marker: b
    text: 'O grego traz: “não me abandones nos dias de aflição”; o hebraico diz mais literalmente: “não me deixes enfraquecer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרוֹמֵם
  choice: E eu te exaltarei
  rationale: O verbo רומם significa “exaltar, enaltecer”. A forma prefixada com waw admite aqui uma declaração de ação futura ou continuada. O objeto “te”, implícito no contexto da oração, é explicitado em português para dar clareza.
- source_word: יְהֹוָה
  choice: SENHOR
  rationale: Representa o nome divino no registro bíblico tradicional e amplamente reconhecido em português, sem introduzir uma vocalização específica no corpo do texto.
- source_word: אָבִי
  choice: meu Pai
  rationale: O hebraico preservado diz literalmente “meu Pai”. A leitura grega divergente é registrada em nota.
- source_word: גִּבּוֹר יִשְׁעִי
  choice: o Poderoso da minha salvação
  rationale: גִּבּוֹר funciona como substantivo, “Poderoso”, e יִשְׁעִי significa “minha salvação”. A formulação conserva a construção compacta e elevada do hebraico sem impor um sentido exclusivamente militar.
- source_word: אַל תַּרְפֵּנִי
  choice: Não me deixes enfraquecer
  rationale: A raiz רפה expressa afrouxar, perder forças ou enfraquecer. Esta tradução mantém a imagem hebraica de fraqueza e soa natural em português; não a harmoniza com o grego, que fala em abandono.
- source_word: בְּיוֹם צָרָה
  choice: no dia da aflição
  rationale: צָרָה denota aflição, angústia ou adversidade. “Aflição” preserva a gravidade e o registro poético da súplica.
- source_word: בּיוֹם שׁוֹאָה וּמְשׁוֹאָה
  choice: no dia de ruína e desolação
  rationale: Os dois substantivos próximos intensificam a linguagem de calamidade. “Ruína e desolação” conserva o paralelismo sem reduzir os dois termos a uma só ideia.
theological_decisions:
- issue: Divergência entre o hebraico e o grego na invocação de Deus
  choice: 'Seguir no texto principal o hebraico: “Ó SENHOR, tu és meu Pai”'
  alternative: 'Seguir o grego: “Invoquei o Senhor, pai do meu senhor”'
  rationale: O hebraico é o testemunho primário onde está preservado e apresenta uma leitura coerente. A variante grega é teologicamente e textualmente significativa, por isso é mantida em nota.
- issue: Sentido da súplica אַל תַּרְפֵּנִי
  choice: Traduzir a imagem hebraica de enfraquecimento
  alternative: “Não me abandones”, conforme o grego
  rationale: O texto principal deve refletir רפה, sem assimilá-lo ao grego ἐγκαταλιπεῖν. A leitura de abandono permanece visível em nota para preservar a diferença entre os testemunhos.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “tu” coerente com a oração bíblica. A sintaxe poética e o paralelismo do hebraico foram preservados, enquanto expressões potencialmente artificiais foram suavizadas apenas o necessário para a clareza.
