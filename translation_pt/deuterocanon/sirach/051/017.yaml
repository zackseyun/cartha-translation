  text: In her I made progress, and I will give glory to the one who gives me wisdom[b][a].
translation:
  language: pt
  text: Nela progredi, e darei glória àquele que me dá sabedoria[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho hebraico é difícil neste ponto e difere consideravelmente do grego. O hebraico dos manuscritos da Genizá do Cairo diz aproximadamente: “O jugo dela foi para mim motivo de honra, e ao meu mestre [ou: aos meus mestres] darei graças”; o grego diz: “Nela progredi; àquele que me dá sabedoria darei glória”.'
    reason: textual_variant
  - marker: b
    text: 'Ou, seguindo mais de perto a formulação hebraica: “darei graças”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻלָּהּ / προκοπὴ ἐγένετό μοι ἐν αὐτῇ
  choice: Nela progredi
  rationale: O hebraico transmitido é difícil e diverge consideravelmente do paralelo grego. O texto principal segue a leitura grega clara, que expressa progresso em relação à Sabedoria personificada, enquanto a nota registra a forma hebraica alternativa.
- source_word: לִמְלַמְּדַי / τῷ διδόντι μοι σοφίαν
  choice: àquele que me dá sabedoria
  rationale: A formulação segue o grego, que menciona no singular aquele que dá sabedoria. Não explicita que seja Deus, preservando a possível tensão com o hebraico, que pode se referir a mestre ou mestres.
- source_word: הוֹדָאָה / δόξαν
  choice: glória
  rationale: Segue o grego δόξαν, enquanto a alternativa hebraica, “agradecimento” ou “graças”, é preservada em nota.
theological_decisions:
- issue: Identidade daquele que dá sabedoria
  choice: 'Manter a referência indireta: “àquele que me dá sabedoria”'
  alternative: “ao meu mestre” ou “aos meus mestres”
  rationale: O grego sugere um único doador da sabedoria, provavelmente Deus no contexto, mas o hebraico pode apontar para um mestre ou mestres. A tradução não identifica expressamente o referente, evitando resolver a ambiguidade teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Nela” conserva a referência feminina à Sabedoria personificada; “progredi” expressa de modo conciso o sentido do grego.
