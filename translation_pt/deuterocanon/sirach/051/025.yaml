  text: 'I opened my mouth and spoke of her: acquire wisdom for yourselves without silver[a].'
translation:
  language: pt
  text: 'Abri minha boca e falei dela: adquiram sabedoria para vocês, sem prata[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico usa uma forma feminina em “falei dela”, provavelmente em referência à sabedoria personificada; também pode ser entendido de modo mais abstrato como “falei sobre isso”. O paralelo grego não explicita o objeto de “falei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי פָתַחְתִּי
  choice: Abri a boca
  rationale: Preserva o idiomatismo hebraico vívido para começar a falar e corresponde ao paralelo grego.
- source_word: וְדִבַּרְתִּי בָהּ
  choice: e falei dela
  rationale: Mantém o sufixo feminino singular, cuja referência mais natural é a sabedoria personificada, em formulação corrente em português.
- source_word: קְנוּ לָכֶם
  choice: adquiram para vocês
  rationale: קנה pode significar comprar ou adquirir; “adquiram” conserva o sentido amplo, enquanto “sem prata” mantém ativa a imagem comercial.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: É o sentido direto do substantivo e dá continuidade à personificação feminina da primeira oração.
- source_word: בְּלֹא כָסֶף
  choice: sem prata
  rationale: Traduz concretamente o hebraico e acompanha o grego, preservando a imagem econômica em vez de generalizá-la como “sem dinheiro”.
theological_decisions:
- issue: Referente do sufixo feminino em וְדִבַּרְתִּי בָהּ
  choice: 'O sufixo se refere à sabedoria, personificada no feminino: “falei dela”.'
  alternative: Entendê-lo de modo mais abstrato como “falei sobre isso”, referindo-se ao ensinamento ou ao assunto.
  rationale: A ordem imediatamente seguinte para adquirir sabedoria e sua personificação frequente em Sirácida favorecem a referência feminina, sem identificar a figura com uma formulação doutrinária posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “para vocês” evita regionalismos marcados; “prata” preserva a concretude do original.
