base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/030.yaml
  text: Do your work in righteousness[a], and he will give you your reward in its time. Blessed is Yahweh forever, and praised is his name from generation to generation.
translation:
  language: pt
  text: Façam o seu trabalho com justiça, e ele lhes dará a sua recompensa no tempo devido.[a] Bendito seja Yahweh para sempre, e louvado seja o seu nome de geração em geração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no tempo dela” ou “no tempo dele”. Tanto o hebraico בְּעִתּוֹ como o paralelo grego ἐν καιρῷ αὐτοῦ podem indicar o tempo próprio da recompensa; o pronome também pode ser entendido como uma referência a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂיכֶם עֲשׂוּ
  choice: Façam o seu trabalho
  rationale: A construção hebraica combina o substantivo “obra/trabalho” com o imperativo “fazer”. A formulação idiomática evita uma repetição artificial e preserva a exortação prática.
- source_word: בִצְדָקָה
  choice: com justiça
  rationale: A preposição בְּ indica aqui o modo de agir. “Com justiça” mantém visível o vocabulário ético-teológico de צְדָקָה e soa natural em português; “com retidão” também seria possível.
- source_word: וְהוּא
  choice: e ele
  rationale: Mantém o pronome do hebraico sem substituir explicitamente seu referente por “Deus” ou “Yahweh”, preservando a forma e a referência implícita do texto.
- source_word: נוֹתֵן לָכֶם שְׂכַרְכֶם
  choice: lhes dará a sua recompensa
  rationale: שְׂכַר pode significar salário, recompensa ou retribuição. “Recompensa” se ajusta ao contexto sapiencial sem reduzir a imagem a uma transação comercial; o futuro exprime o valor promissório do particípio no contexto.
- source_word: בְּעִתּוֹ
  choice: no tempo devido
  rationale: A expressão indica o tempo próprio ou apropriado. Como o sufixo pode ser associado à recompensa ou entendido em referência a Deus, a tradução corrente fica no texto e a ambiguidade é registrada em nota.
- source_word: בָּרוּךְ יְהֹוָה לְעוֹלָם
  choice: Bendito seja Yahweh para sempre
  rationale: “Bendito seja” reproduz naturalmente em português a fórmula doxológica hebraica. O nome divino יְהֹוָה é transliterado como “Yahweh”.
- source_word: וּמְשֻׁבָּח שְׁמוֹ לְדֹר וָדֹר
  choice: e louvado seja o seu nome de geração em geração
  rationale: Preserva o paralelismo e a cadência doxológica da frase anterior. “De geração em geração” é a expressão portuguesa consagrada para לְדֹר וָדֹר.
theological_decisions:
- issue: Tradução do nome divino יְהֹוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico emprega diretamente o Tetragrama. “Yahweh” preserva o nome próprio em vez de substituí-lo por um título.
- issue: Valor ético-teológico de צְדָקָה
  choice: justiça
  alternative: retidão; o que é certo
  rationale: “Justiça” conserva um termo central do campo semântico hebraico e descreve a maneira moralmente correta de realizar as obras, sem acrescentar uma interpretação denominacional.
- issue: Referente do pronome em בְּעִתּוֹ
  choice: tempo devido
  alternative: no tempo dela; no tempo dele
  rationale: A formulação principal comunica o tempo apropriado sem decidir se o sufixo remete à recompensa ou a Deus; a nota explicita essa ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural “vocês” é expresso pelas formas “façam” e “lhes”. A tradução conserva o tom sapiencial e a doxologia final, evitando tanto literalismo artificial quanto explicitação teológica indevida.
