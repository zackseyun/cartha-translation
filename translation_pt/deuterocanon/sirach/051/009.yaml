  text: And I raised my voice from the earth[b][a], and from the gates of Sheol I cried out.
translation:
  language: pt
  text: E elevei a minha voz da terra[a], e, das portas do Sheol[b], clamei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do país”. O hebraico diz “da terra/do país”; o texto grego paralelo traz “sobre a terra”, refletindo uma pequena divergência entre os testemunhos.
    reason: textual_variant
  - marker: b
    text: “Sheol” é o termo hebraico para o domínio dos mortos; também pode ser traduzido por “a sepultura” ou “o mundo dos mortos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָרִים
  choice: elevei
  rationale: O verbo רום, tendo קוֹלִי como objeto, exprime levantar ou elevar a voz. “Elevei” preserva a imagem concreta e o tom poético.
- source_word: מֵאֶרֶץ
  choice: da terra
  rationale: 'A preposição מן com אֶרֶץ indica mais naturalmente origem: “da terra” ou “do país”. “Da terra” mantém o sentido amplo e poético do hebraico.'
- source_word: קוֹלִי
  choice: a minha voz
  rationale: Tradução direta de קוֹלִי, sem antecipar no primeiro hemistíquio a ideia de súplica expressa pelo verbo final.
- source_word: וּמִּשַּׁעֲרֵי
  choice: e das portas do
  rationale: Mantém a imagem concreta do plural construto שַׁעֲרֵי, que descreve poeticamente o limiar do domínio dos mortos.
- source_word: שְׁאוֹל
  choice: Sheol
  rationale: A transliteração conserva o termo hebraico para o domínio dos mortos, sem reduzi-lo a “sepultura” nem substituí-lo por terminologia grega ou por uma interpretação posterior.
- source_word: שִׁוַּעְתִּי
  choice: clamei
  rationale: O verbo שוע descreve um clamor angustiado, normalmente dirigido em busca de auxílio. “Clamei” comunica essa força sem acrescentar um objeto explícito ausente do hebraico.
theological_decisions:
- issue: Tradução de שְׁאוֹל
  choice: Sheol
  alternative: a sepultura; o mundo dos mortos
  rationale: “Sheol” preserva a textura teológica e poética hebraica e evita definir com precisão indevida a condição ou o lugar dos mortos.
translation_notes:
  register: Português moderno, digno e poético, com sintaxe clara. A colocação “elevei da terra a minha voz” conserva a relação espacial e o paralelismo do hebraico; “Sheol” requer retenção como termo bíblico para não eliminar a ambiguidade conceitual do original.
