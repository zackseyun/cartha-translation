  text: Dou graças ao teu nome, porque foste para mim abrigo e auxílio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξομολογοῦμαι
  choice: Dou graças
  rationale: No contexto de oração dirigida a Deus, o verbo expressa reconhecimento agradecido ou louvor; “dou graças” comunica isso de modo natural e fiel.
- source_word: τῷ ὀνόματί σου
  choice: ao teu nome
  rationale: Mantém a formulação concreta do grego e sua ressonância bíblica, sem substituí-la simplesmente por “a ti”.
- source_word: σκεπαστής
  choice: abrigo
  rationale: O substantivo designa quem cobre, protege ou oferece refúgio; “abrigo” preserva a imagem e soa natural em português.
- source_word: βοηθός
  choice: auxílio
  rationale: Expressa ajuda ou socorro e forma um paralelo digno e conciso com “abrigo”.
- source_word: ἐγένου μοι
  choice: foste para mim
  rationale: Reproduz a relação pessoal indicada pelo dativo μοι sem forçar a ideia de uma mudança ontológica sugerida por uma tradução rígida como “tornaste-te”.
theological_decisions:
- issue: Divergência entre o texto hebraico fornecido e o paralelo grego identificado como Sirácida 51:2
  choice: Traduzir o texto grego que corresponde diretamente à referência e à camada inglesa auditada
  alternative: Traduzir como 51:2 o trecho hebraico mais extenso sobre livramento da cova, do Sheol e da calúnia
  rationale: O material hebraico fornecido apresenta uma incompatibilidade significativa de conteúdo e provável diferença de numeração ou alinhamento textual. O grego traz uma unidade breve e coerente que corresponde exatamente à referência indicada; por isso, serve aqui como testemunho antigo de controle, sem fundir tradições textuais distintas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A estrutura paralela “abrigo e auxílio” conserva a concisão poética do verso.
