    rationale: «לְהַבִּיט בָּהּ» significa olhar para/olhar para ela. «Ao olhar para ela» é mais próximo do verbo hebraico e continua natural.
  - severity: low
    issue: «Boa possessão» na nota é pouco natural.
    rationale: Para a leitura grega «ἀγαθὸν κτῆμα», «um bem valioso» é uma equivalência idiomática e conserva a ideia de uma aquisição boa.
