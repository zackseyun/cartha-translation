  verdict: revise
  source_fidelity: O texto segue corretamente o hebraico em sua imagem corporal, no símile do forno, no referente feminino e na decisão de não a abandonar. Contudo, o imperfeito «ardia» não corresponde bem ao yiqtol hebraico nem à forma futura explícita de «não a abandonarei»; a manutenção do futuro em ambos os membros preserva melhor a formulação do testemunho hebraico. A nota registra adequadamente a variante grega substancial.
  naturalness: «Meu íntimo» é natural e apropriado para uma tradução moderna de «minhas entranhas». «Ao contemplá-la» é possível, mas «contemplar» pode sugerir uma apreciação meditativa mais intensa do que o simples «olhar para» do hebraico. «Ao olhar para ela» é mais direto e mantém o registro poético.
  terminology: A personificação feminina é preservada. Na nota, «boa possessão» é pouco idiomático em português contemporâneo e pode ter associações indesejadas; «um bem valioso» transmite naturalmente o κτῆμα ἀγαθόν grego sem alterar a variante.
