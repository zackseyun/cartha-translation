  text: My inward parts burned like an oven as I looked toward her[a]; therefore I will not forsake her.
translation:
  language: pt
  text: Meu íntimo arderá como um forno ao olhar para ela[a]; por isso, não a abandonarei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “E meu ventre se agitou para procurá-la; por isso, adquiri um bem valioso.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעַי
  choice: meu íntimo
  rationale: O termo designa literalmente as entranhas ou órgãos internos e, por extensão, a sede de emoções profundas. “Meu íntimo” conserva a dimensão interior da imagem em português natural, sem restringi-la ao coração ou ao ventre.
- source_word: יֵחַמּוּ
  choice: ardia
  rationale: O verbo expressa aquecer-se ou ficar quente. Com a comparação a um forno, “ardia” comunica naturalmente a intensidade do desejo.
- source_word: כַּתַּנּוּר
  choice: como um forno
  rationale: תנור significa diretamente “forno”; não há necessidade de intensificar a imagem com “fornalha”.
- source_word: לְהַבִּיט בָּהּ
  choice: ao contemplá-la
  rationale: O infinitivo com ב indica olhar para ela. “Ao contemplá-la” mantém a ligação circunstancial com o ardor interior e combina clareza moderna com registro poético digno.
- source_word: בַּעֲבוּר כֵּן
  choice: por isso
  rationale: A expressão introduz a consequência do que precede; “por isso” é direta e idiomática.
- source_word: לֹא אֶעֶזְבֶנָּה
  choice: não a abandonarei
  rationale: עזב pode significar deixar ou abandonar. “Não a abandonarei” expressa com clareza a decisão de permanecer ligado à Sabedoria personificada.
theological_decisions:
- issue: Grande divergência entre os finais hebraico e grego
  choice: 'Seguir no texto principal o hebraico: “por isso, não a abandonarei”.'
  alternative: 'O grego traz: “por isso adquiri uma boa possessão”.'
  rationale: O testemunho hebraico está preservado e tem prioridade como fonte principal. Como o grego apresenta uma leitura substancialmente diferente, ela é registrada em nota sem harmonização.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Meu íntimo” evita o arcaísmo ou estranheza de “minhas entranhas”, enquanto preserva o sentido corporal e emocional. A personificação feminina da Sabedoria é mantida pelos pronomes femininos.
