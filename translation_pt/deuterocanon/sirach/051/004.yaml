  text: from a choking fire all around[a], and from the midst of a fire that I did not kindle.
translation:
  language: pt
  text: de um fogo sufocante por todos os lados[a] e do meio de um fogo que eu não acendi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico preservado deste versículo é difícil e difere muito do grego. Uma tradução mais próxima da forma hebraica da segunda metade seria algo como: “do ventre do abismo, para minha mãe”; porém, o sentido no contexto é obscuro.'
    reason: textual_variant
lexical_decisions:
- source_word: מְכַבּוֹת אֵשׁ
  choice: um fogo sufocante
  rationale: O hebraico transmitido é obscuro. O grego paralelo ἀπὸ πνιγμοῦ πυρᾶς oferece o sentido coerente de um fogo que sufoca, preservando também a imagem hebraica do fogo.
- source_word: לְאֵין פֶּחָה
  choice: ao redor
  rationale: A expressão hebraica é muito incerta neste contexto; o grego κυκλόθεν sustenta claramente “ao redor”.
- source_word: מֵרֶחֶם תְּהוֹם לְאִמִּי
  choice: do meio de um fogo que eu não acendi
  rationale: O hebraico conservado diverge fortemente do grego e produz um sentido obscuro no contexto. A tradução principal segue a leitura grega coerente, deixando a forma hebraica registrada em nota.
- source_word: οὗ οὐκ ἐξέκαυσα
  choice: que eu não acendi
  rationale: A forma ativa de ἐκκαίω significa naturalmente “acender” ou “incendiar”; por isso, a oração indica um fogo que o falante não provocou.
theological_decisions:
- issue: Uso do paralelo grego diante de um texto hebraico gravemente problemático
  choice: Seguir no texto principal o sentido coerente do grego, mantendo a imagem de fogo presente no hebraico.
  alternative: Traduzir mais literalmente o hebraico conservado, embora seu sentido seja obscuro.
  rationale: O hebraico sobrevivente normalmente tem prioridade em Sirácida, mas aqui há forte divergência textual e a segunda metade não oferece sentido contextual seguro. O grego funciona como testemunho textual efetivo, e a divergência é exposta em nota.
translation_notes:
  register: Português moderno, claro e digno, com construção concisa. “Fogo sufocante” reproduz a imagem forte do grego sem tornar a frase excessivamente técnica; a nota preserva com transparência a incerteza do hebraico.
