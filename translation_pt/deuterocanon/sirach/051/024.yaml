  naturalness: «Até quando vocês ficarão sem essas coisas ... e a alma de vocês terá muita sede?» é moderno, claro e adequado ao português internacional com boa legibilidade brasileira. «Muita sede» comunica naturalmente a intensificação de מְאֹד melhor que «tanta sede» neste contexto.
  terminology: «Alma» é uma opção legítima e de registro sapiencial para נֶפֶשׁ, sem impor uma antropologia doutrinária. «Essas coisas» mantém prudentemente a indeterminação da expressão hebraica incomum.
