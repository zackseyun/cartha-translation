translation:
  language: pt
  text: Até quando vocês ficarão sem essas coisas[a], e a alma de vocês terá muita sede?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Até quando vocês ficarão sem estas e estas, e a alma de vocês terá muita sede?” A expressão “estas e estas” é incomum; o paralelo grego a formula de modo mais idiomático: “Até quando vocês dizem que lhes faltam essas coisas, enquanto as suas almas têm muita sede?” O texto principal segue o hebraico, usando o grego apenas para esclarecer a referência geral da expressão.'
    reason: A expressão hebraica מִן אֵלּוּ וְאֵלּוּ é incomum, e o paralelo grego ajuda a esclarecer a referência geral sem especificá-la.
lexical_decisions:
- source_word: עַד מָתַי
  choice: Até quando
  rationale: Expressa naturalmente em português a pergunta temporal com força de repreensão ou exortação.
- source_word: תַחְסְרוּן
  choice: vocês continuarão sem
  rationale: O verbo חסר indica falta ou privação; a forma imperfeita, dentro da pergunta, permite destacar uma situação persistente. A segunda pessoa do plural é explicitada por “vocês”, de ampla compreensão no português moderno.
- source_word: מִן אֵלּוּ וְאֵלּוּ
  choice: essas coisas
  rationale: A expressão hebraica, literalmente “destas e destas” ou “destas e daquelas”, é incomum. O paralelo grego ἐν τούτοις confirma a referência geral às coisas anteriormente mencionadas, sem permitir maior especificação.
- source_word: וְנַפְשְׁכֶם
  choice: e a alma de vocês
  rationale: נפש pode designar alma, vida ou a própria pessoa. “Alma” conserva a imagem sapiencial de sede interior sem impor uma antropologia técnica; o singular hebraico tem sentido coletivo diante do pronome plural.
- source_word: צְמֵאָה מְאֹד תִּהְיֶה
  choice: terá tanta sede
  rationale: Mantém o valor prospectivo de תִּהְיֶה e transmite com naturalidade a intensidade de מְאֹד. A construção também preserva a imagem concreta de sede.
theological_decisions:
- issue: Sentido antropológico de נֶפֶשׁ na exortação sapiencial
  choice: a alma de vocês
  alternative: a vida de vocês; vocês mesmos
  rationale: “Alma” preserva a ressonância interior e espiritual da metáfora sem definir uma doutrina específica sobre a constituição humana.
- issue: Relação entre a falta exterior e a sede da alma
  choice: coordenação com “e”
  alternative: subordinação com “enquanto”
  rationale: O hebraico coordena as duas orações com וְ. Manter “e” conserva aberta a relação lógica entre a carência mencionada e a sede, em vez de interpretá-la explicitamente como simultaneidade ou contraste.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa plural. A formulação conserva a imagem sapiencial da alma sedenta, o futuro do hebraico e a coordenação entre as orações, enquanto a nota registra a construção hebraica incomum e a variante grega.
