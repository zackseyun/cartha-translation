base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/026.yaml
  text: Bring your neck under her yoke[a], and let your soul bear her burden. She is near to those who seek her, and the one who gives himself finds her.
translation:
  language: pt
  text: Ponham o pescoço sob o jugo dela[a], e que a alma de vocês carregue o fardo dela. Ela está perto dos que a buscam, e quem se entrega a ela a encontra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz: “e que a alma de vocês receba instrução”. O hebraico diz: “carregue o fardo dela”.'
    reason: Registra uma variante significativa entre o hebraico principal e a tradição grega.
lexical_decisions:
- source_word: וְצַוְּארֵיכֶם בְּעֻלָּהּ הָבִיאוּ
  choice: Ponham o pescoço sob o jugo dela
  rationale: Mantém a exortação ativa e a imagem corporal do hebraico, confirmada pelo paralelo grego. O singular coletivo “o pescoço” é idiomático em português numa ordem dirigida a várias pessoas.
- source_word: וּמַשָּׂאָהּ תִּשָּׂא נַפְשְׁכֶם
  choice: e que a alma de vocês carregue o fardo dela
  rationale: Segue o hebraico preservado, que fala de carregar o fardo, mantendo tanto a metáfora quanto o vocabulário antropológico de נֶפֶשׁ. A formulação com “que” expressa naturalmente a forma verbal hebraica.
- source_word: קְרוּבָה הִיא לִמְבַקְשֶׁיהָ
  choice: Ela está perto dos que a buscam
  rationale: Conserva a personificação feminina da Sabedoria e verte o particípio de modo natural e claro.
- source_word: וְנוֹתֵן נַפְשׁוֹ
  choice: e quem se entrega
  rationale: O hebraico diz literalmente “dá sua alma/vida”; no contexto, indica dedicação pessoal plena. “Se entrega” comunica essa força sem sugerir necessariamente a morte.
- source_word: מוֹצֵא אֹתָהּ
  choice: a encontra
  rationale: Tradução direta que mantém a Sabedoria como objeto feminino personificado.
theological_decisions:
- issue: Personificação da Sabedoria
  choice: 'Empregar referências femininas: “dela”, “ela” e “a”.'
  alternative: Tratar a sabedoria como abstração sem personificação explícita.
  rationale: A gramática hebraica e o contexto apresentam a Sabedoria como figura feminina; a tradução preserva essa imagem sem ampliá-la doutrinariamente.
- issue: Relação entre o texto hebraico e o paralelo grego no segundo membro
  choice: Manter no texto principal a leitura hebraica “carregue o fardo dela”.
  alternative: Adotar a leitura grega “receba instrução”.
  rationale: O hebraico está preservado e é coerente. A leitura grega representa uma tradição significativa, registrada em nota sem substituir o testemunho hebraico principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” torna explícito o destinatário plural; “fardo” e “jugo” preservam a metáfora sapiencial sem linguagem arcaizante.
