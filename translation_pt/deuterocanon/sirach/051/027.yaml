  text: See with your own eyes that I was young[b][a], and I stood by her and found her.
translation:
  language: pt
  text: Vejam com os próprios olhos que eu era pequeno; mantive-me firme junto dela e a encontrei.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os pronomes femininos (“dela” e “a”) provavelmente se referem à Sabedoria personificada.
    reason: referent_clarification
  - marker: b
    text: 'O grego traz uma forma textual bem diferente: “Vejam com os próprios olhos que trabalhei pouco e encontrei para mim muito descanso”.'
    reason: alternative_reading
lexical_decisions:
- source_word: רְאוּ בְעֵינֵיכֶם
  choice: Vejam com os próprios olhos
  rationale: O imperativo plural convida os ouvintes a uma constatação direta. A expressão portuguesa reproduz naturalmente a ênfase experiencial do hebraico.
- source_word: קָטֹן הָיִיתִי
  choice: eu era pequeno
  rationale: קָטֹן significa literalmente “pequeno” e pode, neste contexto, aludir à pouca idade ou a uma condição humilde. Em português, “era pequeno” preserva essa abertura melhor que “era jovem” ou “era insignificante”.
- source_word: וְעָמַדְתִּי בָהּ
  choice: mantive-me firme junto dela
  rationale: עמד pode expressar permanecer ou manter-se firme, e o sufixo feminino em בָהּ aponta provavelmente para a Sabedoria personificada. A formulação comunica perseverança sem reduzir o verbo a uma postura meramente física.
- source_word: וּמְצָאתִיהָ
  choice: e a encontrei
  rationale: O verbo מצא com objeto feminino significa “encontrei-a”. O pronome feminino mantém a personificação gramatical da Sabedoria presente no hebraico.
theological_decisions:
- issue: Referente dos sufixos femininos em בָהּ e מְצָאתִיהָ
  choice: Manter a referência feminina com “dela” e “a”, entendendo-a provavelmente como a Sabedoria personificada.
  alternative: Empregar formas impessoais, como “nisso” e “isso”, referindo-se à sabedoria ou instrução.
  rationale: O hebraico marca explicitamente o feminino, e Sirácida frequentemente personifica a Sabedoria. A tradução preserva essa característica sem inserir no texto o substantivo “Sabedoria”, que não aparece neste versículo.
- issue: Divergência entre o texto hebraico e o paralelo grego
  choice: Traduzir o hebraico preservado e registrar a forma grega em nota.
  alternative: 'Seguir o grego: “trabalhei pouco e encontrei para mim muito descanso”.'
  rationale: O testemunho hebraico é a fonte primária indicada e apresenta uma forma textual substancialmente diferente. Mesclar as leituras ocultaria a divergência textual.
translation_notes:
  register: Português moderno, claro e digno, com imperativo plural natural. “Era pequeno” conserva a concisão e a ambiguidade do hebraico entre pouca idade e pequenez; “mantive-me firme” explicita de modo moderado o valor perseverante de עמד.
