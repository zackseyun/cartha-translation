  text: I turned around[a], and there was no one to help me; I looked for support, and there was none.
translation:
  language: pt
  text: Voltei-me para todos os lados[a], e não havia ninguém para me ajudar; busquei quem me amparasse, e não havia ninguém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz: “Voltei-me para todos os lados”. O paralelo grego lê: “Cercaram-me por todos os lados”; em seguida, fala de procurar ajuda de pessoas, e não a encontrar.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶפְנֶה סָבִיב
  choice: Voltei-me para todos os lados
  rationale: פנה expressa voltar-se, e סָבִיב amplia o movimento para todas as direções. A formulação conserva a imagem corporal e comunica naturalmente a busca ao redor.
- source_word: עוֹזֵר
  choice: ninguém para me ajudar
  rationale: O particípio designa alguém que presta ajuda. Em português, a construção verbal é natural e mantém explícito o agente humano ausente.
- source_word: וַאֲצַפֶּה
  choice: busquei
  rationale: צפה pode envolver olhar atentamente, aguardar ou esperar. No paralelismo e à luz do grego ἐμβλέπων, indica aqui procurar ou voltar os olhos em busca de auxílio; “busquei” preserva o sentido sem tornar a ação meramente temporal.
- source_word: סוֹמֵךְ
  choice: quem me amparasse
  rationale: O particípio de סמך designa alguém que sustenta ou ampara. A tradução pessoal mantém o paralelismo com עוֹזֵר e soa mais natural do que uma formulação abstrata neste contexto.
- source_word: וְאָיִן
  choice: mas não havia ninguém
  rationale: A negação existencial encerra a frase de modo enfático. “Ninguém” concorda com a leitura pessoal de סוֹמֵךְ e ressalta a ausência total de auxílio.
