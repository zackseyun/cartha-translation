  text: Then Yahweh heard my voice[a], and listened to my supplications.
translation:
  language: pt
  text: Então Yahweh ouviu minha voz[a] e deu ouvidos às minhas súplicas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “minha voz”; a expressão também pode ser entendida idiomaticamente como “meu clamor”.'
    reason: Alternativa lexical legítima no contexto de oração.
lexical_decisions:
- source_word: אָז
  choice: Então
  rationale: Marca a transição temporal entre a oração anterior e a resposta divina, de modo conciso e natural.
- source_word: שָׁמַע
  choice: ouviu
  rationale: Preserva o sentido direto do verbo e o distingue do verbo seguinte, que expressa atenção deliberada.
- source_word: קוֹלִי
  choice: minha voz
  rationale: Reproduz literalmente o hebraico, sem excluir o sentido idiomático possível de “meu clamor”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso pelo Tetragrama, em vez de substituí-lo por um título.
- source_word: וַיַּאֲזִין
  choice: deu ouvidos a
  rationale: Expressa atenção cuidadosa e mantém a progressão poética em relação a “ouviu”.
- source_word: תַּחֲנוּנָי
  choice: minhas súplicas
  rationale: Comunica pedidos insistentes por favor ou misericórdia e preserva o registro de oração.
theological_decisions:
- issue: Tradução do nome divino יְהוָה
  choice: Yahweh
  alternative: SENHOR
  rationale: O texto hebraico traz diretamente o Tetragrama; a transliteração preserva o nome pessoal sem substituí-lo por um título.
translation_notes:
  register: Português moderno, digno e acessível. “Deu ouvidos” mantém o paralelismo e a intensificação do hebraico sem soar excessivamente arcaico.
