base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/022.yaml
  text: Yahweh has given me the reward of my lips[b][a]; therefore I acquired her as a good possession.
translation:
  language: pt
  text: O SENHOR me deu a recompensa dos meus lábios; por isso, adquiri a Sabedoria[a] como uma boa aquisição.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “adquiri-a”; o pronome feminino se refere à Sabedoria no contexto.'
    reason: Esclarecimento do referente pronominal e da explicitação feita no texto.
  - marker: b
    text: 'O grego traz: “O Senhor deu-me uma língua como recompensa, e com ela eu o louvarei.”'
    reason: Leitura alternativa substancial no testemunho grego.
lexical_decisions:
- source_word: יְהֹוָה
  choice: o SENHOR
  rationale: Representa o nome divino hebraico segundo a convenção portuguesa consagrada, distinguindo-o pelo uso de versaletes.
- source_word: שְׂכַר שִׂפְתוֹתָי
  choice: a recompensa dos meus lábios
  rationale: Mantém a imagem concreta e a ambiguidade do hebraico, sem reduzi-la interpretativamente a fala, louvor ou confissão.
- source_word: בַּעֲבוּר כֵּן
  choice: por isso
  rationale: Expressa de modo natural e conciso a relação causal ou resultativa da locução hebraica.
- source_word: קְנִיתִיהָ
  choice: adquiri a Sabedoria
  rationale: O verbo indica adquirir ou obter; a explicitação de Sabedoria identifica o referente feminino no contexto e evita em português um pronome feminino potencialmente obscuro.
- source_word: קִנְיָן טוֹב
  choice: uma boa possessão
  rationale: Preserva a ligação lexical com o verbo adquirir e o sentido positivo do substantivo, embora a formulação retenha deliberadamente algo do caráter proverbial do hebraico.
- source_word: αἰνέσω αὐτόν
  choice: não adotado no texto principal
  rationale: A leitura grega diverge substancialmente do hebraico preservado; é registrada em nota como testemunho textual alternativo.
theological_decisions:
- issue: Escolha do texto principal diante da divergência hebraico-grega
  choice: 'Seguir o hebraico preservado: o SENHOR dá ao autor a recompensa de seus lábios, e ele adquire a Sabedoria como boa possessão.'
  alternative: 'Seguir o grego: “O Senhor deu-me uma língua como recompensa, e com ela eu o louvarei.”'
  rationale: O testemunho hebraico é a fonte primária quando está preservado. A leitura grega, por ser genuinamente distinta, permanece visível em nota, sem harmonização.
- issue: Referente do sufixo feminino em קְנִיתִיהָ
  choice: Explicitar “a Sabedoria” no texto.
  alternative: Traduzir apenas “adquiri-a” e explicar o referente em nota.
  rationale: O referente feminino é a Sabedoria no contexto imediato; explicitá-lo produz português claro sem introduzir uma interpretação doutrinária alheia ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a imagem hebraica “recompensa dos meus lábios” e a repetição semântica entre “adquiri” e “possessão”. Todos os marcadores de nota aparecem no texto principal.
