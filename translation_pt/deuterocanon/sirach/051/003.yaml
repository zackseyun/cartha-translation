base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/003.yaml
  text: from the snare of those watching for my stumbling[a], and from the hand of those seeking my life. You saved me from many troubles[b], and from the distress of a flame all around.
translation:
  language: pt
  text: 'da armadilha dos que espreitam meu tropeço[a]

    e da mão dos que buscam minha vida.

    Tu me salvaste de muitas aflições[b]

    e da angústia de uma chama ao redor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que vigiam o meu mancar” ou “os que esperam a minha queda”. A expressão hebraica é idiomática, e seu sentido exato é um pouco incerto.'
    reason: lexical_alternative
  - marker: b
    text: 'O hebraico prossegue: “e da angústia de uma chama ao redor”. O paralelo grego difere consideravelmente neste ponto, ampliando a descrição do livramento em vez de conservar esta formulação exata.'
    reason: textual_variant
lexical_decisions:
- source_word: מִמּוֹקֵשׁ
  choice: da armadilha
  rationale: מוֹקֵשׁ designa uma armadilha ou laço. “Armadilha” comunica com naturalidade a imagem de captura e mantém o registro poético.
- source_word: צוֹפֵי צַלְעִי
  choice: dos que espreitavam o meu tropeço
  rationale: צוֹפֵי indica os que observam ou ficam à espreita; צַלְעִי pode aludir ao mancar, tropeçar ou cair. A formulação preserva a vigilância hostil e mantém a leve incerteza da expressão hebraica.
- source_word: וּמִּיַד
  choice: e da mão
  rationale: A “mão” representa poder ou domínio. A imagem concreta foi mantida por ser clara em português e sustentar o paralelismo hebraico.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: dos que queriam tirar-me a vida
  rationale: Neste contexto de perseguição, נֶפֶשׁ se refere à vida da pessoa. A formulação evita a leitura ontológica de “alma” e expressa naturalmente a ameaça mortal.
- source_word: מֵרַבּוֹת צָרוֹת
  choice: de muitas aflições
  rationale: A expressão admite nuance quantitativa (“muitas”) ou intensiva (“grandes”). “Muitas aflições” preserva a pluralidade e o sentido amplo de adversidade.
- source_word: הוֹשַׁעְתָּנִי
  choice: Tu me salvaste
  rationale: O verbo ישׁע significa salvar ou livrar. “Tu me salvaste” é direto e conserva a fala dirigida pessoalmente a Deus.
- source_word: וּמִמְּצוּקוֹת
  choice: e da angústia
  rationale: מְצוּקוֹת expressa aperto, opressão ou angústia. O singular coletivo em português produz uma frase natural sem eliminar a força da aflição descrita.
- source_word: שַׁלְהֶבֶת מִסָּבִיב
  choice: de uma chama ao meu redor
  rationale: שַׁלְהֶבֶת é chama ou labareda, e מִסָּבִיב indica cerco. A tradução conserva a imagem concreta e não decide se o fogo é literal ou metafórico.
theological_decisions:
- issue: Sentido de נַפְשִׁי no contexto da perseguição
  choice: tirar-me a vida
  alternative: buscar a minha alma
  rationale: A expressão hebraica descreve inimigos que procuram matar o orante; não pretende definir a natureza da alma.
- issue: Caráter literal ou metafórico da chama final
  choice: uma chama ao meu redor
  alternative: uma aflição ardente que me cercava
  rationale: O hebraico permite uma imagem de fogo literal ou figurado. A tradução mantém a chama concreta sem resolver uma ambiguidade que o texto não resolve.
- issue: Relação entre o hebraico e o paralelo grego divergente
  choice: seguir o testemunho hebraico no texto principal
  alternative: incorporar a descrição ampliada do grego
  rationale: O hebraico é a fonte primária fornecida para esta tradução. A divergência substancial do grego é registrada em nota, sem misturar os testemunhos no corpo do versículo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O paralelismo poético e as imagens hebraicas de armadilha, mão e chama foram preservados, enquanto construções excessivamente literais ou pouco naturais foram evitadas.
