  terminology: “Retidão” traduz de modo apropriado a ambiguidade ética e espacial de ἐν εὐθύτητι. As formas femininas continuam a representar com fidelidade a personificação da Sabedoria. “Rastros” mantém o campo figurativo de ἴχνευον sem transformar indevidamente a Sabedoria em suas próprias pegadas.
