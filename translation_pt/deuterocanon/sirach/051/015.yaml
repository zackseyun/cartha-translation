base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/015.yaml
  text: From her blossom, like a ripening cluster of grapes, my heart rejoiced in her; my foot walked in uprightness; from my youth I tracked her down.
translation:
  language: pt
  text: Por sua flor — como um cacho de uvas que amadurece[a] —, meu coração se alegrou nela; meu pé avançou em retidão[b]; desde a minha juventude, eu seguia seus rastros[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um cacho de uvas que ganha cor”; o grego pode destacar a mudança de cor das uvas ao amadurecerem.
    reason: lexical_alternative
  - marker: b
    text: Ou “meu pé pisou em linha reta” ou “seguiu por um caminho reto”; o grego pode evocar tanto um caminho direito quanto a retidão moral.
    reason: lexical_alternative
  - marker: c
    text: Ou “fui ao encalço dela” ou “procurei-a”; o verbo grego evoca literalmente o ato de rastrear por pegadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἄνθους
  choice: Desde a sua flor
  rationale: ἄνθος significa “flor” ou “floração”. O possessivo explicita em português a ligação contextual com a Sabedoria personificada, sem abandonar a imagem vegetal.
- source_word: ὡς περκάζουσης σταφυλῆς
  choice: como um cacho de uvas que amadurece
  rationale: σταφυλή designa um cacho de uvas, e περκάζουσης indica que as uvas estão adquirindo cor ou chegando à maturidade. A formulação preserva a imagem agrícola em português natural.
- source_word: εὐφράνθη ἡ καρδία μου ἐν αὐτῇ
  choice: meu coração se alegrou nela
  rationale: A construção expressa alegria interior, e ἐν αὐτῇ mantém a relação direta com a Sabedoria personificada. “Nela” conserva a preposição grega e evita reduzir a expressão a mera causalidade.
- source_word: ἐπέβη ὁ πούς μου
  choice: meu pé avançou
  rationale: ἐπέβη comunica a ideia de pôr o pé, pisar ou seguir adiante. “Avançou” soa natural, preserva a imagem do pé e se combina bem com o percurso figurado do versículo.
- source_word: ἐν εὐθύτητι
  choice: em retidão
  rationale: εὐθύτης pode indicar tanto caráter reto quanto direção retilínea. “Em retidão” preserva a dimensão moral e deixa perceptível a imagem de um caminho direito.
- source_word: ἐκ νεότητός μου
  choice: desde a minha juventude
  rationale: Tradução temporal direta e idiomática, que indica uma busca iniciada na juventude.
- source_word: ἴχνευον αὐτήν
  choice: segui suas pegadas
  rationale: ἴχνευον evoca literalmente rastrear por marcas ou pegadas. A escolha mantém a imagem vívida e liga-se ao “pé” e ao caminho mencionados na oração anterior.
theological_decisions:
- issue: Referente e gênero de αὐτῇ/αὐτήν
  choice: 'Os pronomes se referem à Sabedoria personificada, expressa em português por formas femininas: “nela” e “suas”.'
  alternative: Tratar a sabedoria apenas como conceito abstrato, sem realçar a personificação.
  rationale: O contexto de Sirácida personifica a Sabedoria no feminino, em correspondência com o gênero gramatical e com a apresentação literária do livro.
- issue: Sentido de ἐν εὐθύτητι
  choice: Preservar simultaneamente a conotação moral e a metáfora do caminho por meio de “em retidão”.
  alternative: 'Explicitar apenas o sentido espacial: “por um caminho reto”.'
  rationale: O grego comporta as duas nuances; a tradução escolhida evita resolver indevidamente essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantêm-se a personificação feminina da Sabedoria, a imagem agrícola e o campo figurativo de pés, pegadas e caminho.
