  text: He who offers a sacrifice from the goods of the poor is like one who slaughters a son before his father[a].
translation:
  language: pt
  text: Quem oferece um sacrifício com os bens dos pobres é como quem mata um filho diante do pai dele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Quem oferece um sacrifício com os bens dos pobres é quem mata um filho diante do pai dele”. O grego apresenta uma comparação proverbial condensada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θύων
  choice: é como quem mata
  rationale: O particípio pode significar sacrificar ou abater. A formulação explicita a comparação proverbial comprimida e “mata” conserva a violência chocante da imagem sem confundi-la com o sacrifício apresentado na segunda oração.
- source_word: υἱὸν
  choice: um filho
  rationale: O grego não traz possessivo; “um filho” preserva essa ausência e é mais preciso que “uma criança”.
- source_word: ἔναντι
  choice: diante de
  rationale: Expressa de modo natural a presença direta indicada pelo grego.
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: do pai dele
  rationale: O pronome refere-se mais naturalmente ao filho. “Dele” mantém clara essa referência em português e evita que “seu pai” seja associado ao agente da ação.
- source_word: ὁ προσάγων θυσίαν
  choice: Quem oferece um sacrifício
  rationale: Formulação corrente que preserva tanto o sujeito geral quanto o contexto cultual.
- source_word: ἐκ χρημάτων πενήτων
  choice: com os bens dos pobres
  rationale: χρήματα abrange dinheiro, propriedade e posses; “bens” mantém essa amplitude. A preposição “com” comunica naturalmente que o sacrifício é custeado ou constituído por esses bens.
theological_decisions:
- issue: Força da comparação entre sacrifício injusto e violência contra um filho
  choice: Tornar explícita a comparação com “é como”, apresentando o sacrifício feito com os bens dos pobres como equivalente moral a matar um filho diante do pai dele.
  alternative: 'Manter a construção comprimida: “Quem oferece um sacrifício com os bens dos pobres mata um filho diante do pai dele.”'
  rationale: A construção grega é proverbial e condensada. Explicitar a comparação torna a relação sintática inteligível em português sem amenizar a condenação da opressão nem acrescentar uma doutrina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pai dele” foi preferido a “seu pai” para eliminar ambiguidade referencial; “mata” preserva o impacto da imagem.
