base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/031.yaml
  text: At a banquet of wine do not rebuke your neighbor[a], and do not belittle him in his gladness; do not speak a word of reproach to him, and do not distress him by making demands.
translation:
  language: pt
  text: Num banquete com vinho, não repreenda o seu próximo e não o menospreze em sua alegria; não lhe diga uma palavra de censura nem o aflija com cobranças.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não o aflija pressionando-o a pagar”; o termo grego pode indicar uma exigência ou cobrança, muitas vezes daquilo que é devido.
    reason: lexical_alternative
lexical_decisions:
- source_word: συμποσίῳ οἴνου
  choice: banquete com vinho
  rationale: Expressa uma refeição social marcada pelo consumo de vinho, mantendo proximidade com o grego sem o tom coloquial ou pejorativo de “festa de bebedeira”.
- source_word: ἐλέγξῃς
  choice: repreenda
  rationale: No contexto de sabedoria interpessoal, indica censurar ou admoestar alguém; “repreenda” é claro, natural e compatível com o registro digno.
- source_word: πλησίον
  choice: próximo
  rationale: Preserva o termo ético tradicional e abrangente, embora no contexto imediato também possa designar um companheiro de mesa.
- source_word: ἐξουδενώσῃς
  choice: menospreze
  rationale: Comunica tratar alguém como sem importância ou valor, sem intensificar o verbo para uma humilhação pública necessariamente explícita.
- source_word: ἐν εὐφροσύνῃ αὐτοῦ
  choice: em sua alegria
  rationale: Mantém a referência ao estado de contentamento festivo da pessoa em formulação natural e concisa.
- source_word: λόγον ὀνειδισμοῦ
  choice: uma palavra de censura
  rationale: Reproduz a construção grega e seu tom sapiencial, incluindo a ideia de fala reprovadora ou recriminatória.
- source_word: θλίψῃς
  choice: aflija
  rationale: Abrange a ideia de causar sofrimento ou pressão, adequando-se tanto ao aspecto emocional quanto ao prático da exigência seguinte.
- source_word: ἐν ἀπαιτήσει
  choice: com cobranças
  rationale: O substantivo denota exigência, exação ou ato de cobrar, frequentemente com sentido financeiro. “Cobranças” conserva essa provável nuance sem acrescentar explicitamente uma dívida ou seu pagamento.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com construção proverbial direta. O singular genérico foi mantido em “seu próximo”, e a provável nuance financeira de ἀπαίτησις foi preservada sem tornar “dívida” explícita no texto principal.
