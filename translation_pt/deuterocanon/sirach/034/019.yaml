base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/019.yaml
  text: Until he repays a man for his deed[a], and a person's recompense according to his scheme; until he pleads the case of his people and gladdens them with his salvation.
translation:
  language: pt
  text: Até que retribua a cada pessoa por seus atos e lhe dê a recompensa conforme seus desígnios; até que defenda a causa do seu povo e os alegre com sua salvação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego preservado de Eclesiástico 34:19 diz, em vez disso: “Quem oferece sacrifício com bens obtidos pela injustiça apresenta uma oferta defeituosa, e as dádivas dos sem lei não são aceitáveis.” O testemunho hebraico preservado aqui difere substancialmente do grego.'
    reason: alternative_reading
lexical_decisions:
- source_word: עד
  choice: até que
  rationale: Nos dois membros, introduz o limite temporal de uma condição iniciada no contexto anterior.
- source_word: ישיב לאנוש פעלו
  choice: retribua a cada pessoa segundo o que ela fez
  rationale: Expressa com naturalidade o sentido judicial de devolver a alguém o resultado de seus atos, sem restringir אנוש ao sexo masculino.
- source_word: וגמול אדם כמזימתו
  choice: e lhe dê a recompensa conforme suas intenções
  rationale: גמול indica retribuição ou recompensa; מזמה pode designar plano, propósito ou intenção, inclusive com possível nuance negativa. “Intenções” preserva a avaliação do propósito interior sem impor que ele seja necessariamente perverso.
- source_word: יריב ריב עמו
  choice: defenda a causa do seu povo
  rationale: 'A construção cognata tem sentido forense: assumir ou sustentar a causa de alguém.'
- source_word: ושמחם
  choice: e o alegre
  rationale: Mantém o valor causativo do verbo. O sufixo plural hebraico refere-se aos integrantes do povo; em português, o coletivo singular permite “o alegre” de forma natural.
- source_word: בישועתו
  choice: com a sua salvação
  rationale: ישועה abrange livramento e salvação; “salvação” conserva a amplitude teológica e o sentido concreto de resgate.
theological_decisions:
- issue: Divergência substancial entre o hebraico preservado e o texto grego
  choice: Traduzir o testemunho hebraico como texto principal e registrar o grego em nota.
  alternative: 'Traduzir o grego: “Quem oferece sacrifício com bens obtidos pela injustiça apresenta uma oferta defeituosa, e as dádivas dos que violam a lei não são aceitas.”'
  rationale: O hebraico sobrevivente é a fonte primária indicada para esta passagem, mas a leitura grega é inteiramente diferente e precisa ser preservada para transparência textual.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe fluente. Emprega linguagem inclusiva onde o hebraico se refere genericamente ao ser humano, sem apagar o singular representativo. A nota torna explícita a grande divergência textual.
