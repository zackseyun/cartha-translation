review_pass:
  verdict: revise
  source_fidelity: A tradução segue corretamente o hebraico como testemunho primário e mantém a estrutura temporal dupla de עד. «Defenda a causa do seu povo» transmite bem יריב ריב עמו. Contudo, «o alegre» torna singular o referente que o hebraico expressa no plural («os faça alegrar-se» / «os alegre»), e «intenções» enfraquece a possível nuance de plano, desígnio ou trama em מזמה.
  naturalness: O texto é fluente e de registro apropriado. «E os alegre com sua salvação» é igualmente natural e torna explícita a referência plural aos membros do povo.
  terminology: «Retribua», «recompensa», «causa» e «salvação» são escolhas adequadas. «Desígnios» preserva melhor a amplitude semântica de מזמה do que «intenções», inclusive sua possível conotação negativa. A nota é necessária devido à divergência substancial entre os testemunhos; sua formulação pode representar o grego de modo mais direto.
  issues:
  - severity: medium
    issue: O pronome em «e o alegre» está no singular, embora ושמחם tenha sufixo plural.
    rationale: Embora «povo» seja coletivo em português, o hebraico se refere aos integrantes do povo. «E os alegre» preserva o plural e permanece natural.
  - severity: low
    issue: «Intenções» reduz o campo semântico de כמזימתו.
    rationale: מזמה pode ser intenção, plano, desígnio ou trama. «Conforme seus desígnios» mantém a ambiguidade e a possível coloração moral sem impor perversidade.
  - severity: low
    issue: A nota verte ἀνόμων como «os que violam a lei».
    rationale: O adjetivo grego designa pessoas sem lei/ímpias, não afirma necessariamente um ato específico de violação. «Os sem lei» conserva melhor a forma e a abertura do original.
  revised_text: Até que retribua a cada pessoa por seus atos e lhe dê a recompensa conforme seus desígnios; até que defenda a causa do seu povo e os alegre com sua salvação.[a]
