  text: From the unclean[a], what will be made clean? And from falsehood, what will become true?
translation:
  language: pt
  text: Do que é impuro, o que será purificado? E do que é falso, o que se mostrará verdadeiro?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «dirá a verdade?» ou «se tornará verdadeiro?». O verbo grego também pode significar falar a verdade ou mostrar-se verdadeiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ
  choice: do / da
  rationale: A preposição marca origem ou procedência nas duas orações; as contrações portuguesas com «de» expressam essa relação com naturalidade.
- source_word: ἀκαθάρτου
  choice: do que é impuro
  rationale: O adjetivo genitivo é substantivado e tem sentido genérico. A formulação evita especificar indevidamente uma pessoa, objeto ou impureza ritual.
- source_word: τί
  choice: o que
  rationale: O pronome interrogativo introduz perguntas retóricas impessoais sobre aquilo que poderia proceder de determinada fonte.
- source_word: καθαρισθήσεται
  choice: será purificado
  rationale: Preserva o futuro passivo de καθαρίζω. «Purificado» mantém a ideia de tornar limpo sem limitar necessariamente o enunciado à esfera ritual.
- source_word: ψευδοῦς
  choice: do que é falso
  rationale: O adjetivo substantivado pode designar falsidade ou aquilo que é falso. Esta opção conserva o paralelismo formal com «do que é impuro» e não reduz o sentido a uma única mentira falada.
- source_word: ἀληθεύσει
  choice: se mostrará verdadeiro
  rationale: No paralelismo proverbial, a expressão comunica que algo procedente do falso não pode resultar ou revelar-se verdadeiro. A formulação portuguesa é natural, embora a nota preserve os sentidos possíveis de falar a verdade ou provar ser verdadeiro.
theological_decisions:
- issue: Sentido de ἀληθεύσει no paralelismo proverbial
  choice: 'sentido resultativo/evidencial: «se mostrará verdadeiro»'
  alternative: 'sentido de ato de fala: «dirá a verdade»; ou sentido estritamente resultativo: «se tornará verdadeiro»'
  rationale: 'As duas perguntas contrastam a fonte com o possível resultado: o puro não procede do impuro, nem o verdadeiro do falso. A tradução principal deixa clara essa lógica sem excluir em nota a amplitude lexical do verbo grego.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção proverbial concisa. O paralelismo «do que é impuro / do que é falso» reproduz a estrutura grega sem impor um referente concreto. O marcador foi colocado após a expressão a que a nota se refere.
