  text: One builds and another tears down—what did they gain beyond toil?[a]
translation:
  language: pt
  text: Um constrói, e outro derruba — que proveito tiveram além de trabalho penoso?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que proveito tiveram, senão trabalho penoso?” A pergunta grega destaca que, quando um desfaz o que o outro constrói, o único resultado é o esforço cansativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομῶν
  choice: constrói
  rationale: O particípio presente tem valor genérico neste dito proverbial. “Constrói” preserva a imagem concreta e soa natural em português.
- source_word: καθαιρῶν
  choice: derruba
  rationale: Aqui καθαιρέω indica desfazer ou demolir o que foi construído. “Derruba” mantém de modo claro o contraste com “constrói”.
- source_word: τί ὠφέλησαν
  choice: que proveito tiveram
  rationale: O aoristo plural pergunta pelo benefício resultante para os dois agentes. A formulação preserva a pergunta retórica sem explicá-la em excesso.
- source_word: πλεῖον ἢ
  choice: além de
  rationale: A construção comparativa pergunta se houve algum resultado superior ao esforço despendido. “Além de” expressa essa relação com fluidez.
- source_word: κόπους
  choice: trabalho penoso
  rationale: κόπος denota trabalho cansativo, fadiga ou esforço árduo. “Trabalho penoso” comunica essa carga melhor do que o termo mais neutro “trabalho”.
theological_decisions:
- issue: Sujeitos singulares proverbiais
  choice: Um constrói, e outro derruba
  alternative: Uma pessoa constrói, e outra derruba
  rationale: O grego emprega dois particípios masculinos substantivados com εἷς, mas com força proverbial e genérica. “Um... outro...” preserva a estrutura concisa sem acrescentar uma identificação específica dos agentes.
- issue: Força da pergunta retórica
  choice: que proveito tiveram além de trabalho penoso?
  alternative: que proveito tiveram, senão trabalho penoso?
  rationale: 'A tradução conserva a ideia de futilidade produzida por ações opostas: ao fim, resta apenas o esforço. A alternativa explicita um pouco mais a exclusividade sugerida pelo comparativo.'
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação concisa preserva o caráter proverbial e a imagem concreta do grego.
