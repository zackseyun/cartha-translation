base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/010.yaml
  text: A man who has not been tested knows little, but one who has wandered[b] increases cunning[c][a].
translation:
  language: pt
  text: Quem não foi provado sabe pouco; mas quem andou errante[b] aumenta sua astúcia[c].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A linha hebraica preservada e fornecida para este trecho não corresponde ao texto grego deste versículo; por isso, a tradução segue aqui a testemunha grega.
    reason: textual_variant
  - marker: b
    text: Ou «quem se desviou» ou «quem foi desencaminhado»; o grego pode indicar tanto o ato literal de andar errante quanto um desvio figurado.
    reason: alternative_reading
  - marker: c
    text: Ou «sagacidade» ou «esperteza».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς οὐκ ἐπειράθη
  choice: quem não foi provado
  rationale: O hebraico fornecido não corresponde a este versículo; por isso, a tradução segue o paralelo grego. A forma verbal pode indicar ser provado ou adquirir experiência por meio de provações; «foi provado» conserva essa dimensão experiencial sem explicá-la em excesso.
- source_word: ὀλίγα οἶδεν
  choice: sabe pouco
  rationale: Expressão natural em português para conhecimento limitado.
- source_word: ὁ δὲ πεπλανημένος
  choice: mas quem andou errante
  rationale: O particípio de πλανάω pode descrever alguém que vagou, se desviou ou foi induzido ao erro. «Andou errante» preserva tanto a ideia de percurso quanto a possível conotação de desvio.
- source_word: πληθυνεῖ
  choice: aumenta
  rationale: Reproduz de modo direto a ideia de multiplicar ou fazer crescer.
- source_word: πανουργίαν
  choice: astúcia
  rationale: πανουργία costuma ter conotação negativa de esperteza ou ardil, embora neste contexto sapiencial possa também sugerir sagacidade adquirida pela experiência. «Astúcia» mantém essa tensão.
theological_decisions:
- issue: Divergência entre as testemunhas hebraica e grega
  choice: Traduzir o paralelo grego e registrar a divergência em nota
  alternative: Traduzir a linha hebraica existente como se pertencesse a Sirácida 34:10
  rationale: A linha hebraica fornecida («Dá-lhe conforme o presente dele para ti...») não corresponde ao conteúdo de Sirácida 34:10 na tradição grega. O paralelo grego corresponde ao versículo e, diante da incompatibilidade textual assinalada, constitui aqui a base defensável para a tradução.
translation_notes:
  register: Português atual, digno e de leitura ampla, com construção proverbial concisa. «Quem» exprime naturalmente o singular genérico. A ordem dos marcadores foi ajustada para que cada nota apareça junto ao termo pertinente, mantendo [a] como nota textual ao fim do versículo.
