  text: A man who has traveled[b] knows many things, and one with much experience will recount understanding.[a]
translation:
  language: pt
  text: Um homem instruído[b] conhece muitas coisas, e quem tem muita experiência exporá discernimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho hebraico fornecido diverge substancialmente e diz, aproximadamente: «Em todas as tuas obras, mostra um rosto alegre e, com alegria, entrega o dízimo do que é santo». Como essa linha não corresponde ao contexto de Sirácida 34:9, o texto principal segue aqui o testemunho grego.'
    reason: textual_variant
  - marker: b
    text: 'Ou: «Um homem que viajou». O termo grego significa primariamente «instruído», «educado» ou «treinado», mas o contexto de Sirácida 34 também pode favorecer a ideia de conhecimento adquirido em viagens e pela experiência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: um homem
  rationale: Preserva o masculino singular explícito do grego, empregado aqui de modo proverbial e representativo.
- source_word: πεπαιδευμένος
  choice: que viajou
  rationale: Embora o particípio normalmente signifique «instruído», «educado» ou «treinado», o contexto imediato associa o aprendizado a viagens e à experiência. A alternativa lexical é mantida em nota para não ocultar a ambiguidade.
- source_word: ἔγνω πολλά
  choice: conhece muitas coisas
  rationale: Expressa de modo natural em português a afirmação proverbial de que o homem chegou a adquirir amplo conhecimento.
- source_word: ὁ πολυπειρῶν
  choice: quem tem muita experiência
  rationale: Formulação idiomática que preserva a ênfase grega na experiência ampla e repetida.
- source_word: ἐκδιηγήσεται
  choice: comunicará
  rationale: O verbo indica expor ou relatar algo por palavras; «comunicará» produz uma frase natural com o conteúdo expresso por σύνεσιν.
- source_word: σύνεσιν
  choice: sua compreensão
  rationale: Mantém o sentido sapiencial de entendimento ou discernimento; o possessivo implícito torna clara em português a compreensão adquirida pela experiência.
theological_decisions:
- issue: Divergência material entre o testemunho hebraico fornecido e o paralelo grego
  choice: Usar o paralelo grego como texto operativo de Sirácida 34:9 e registrar a linha hebraica divergente em nota.
  alternative: 'Traduzir no texto principal a linha hebraica: «Em tudo o que fizer, mostre um rosto alegre e, com alegria, dê o dízimo do que é santo».'
  rationale: A linha hebraica fornecida não corresponde ao contexto nem ao conteúdo conhecido deste versículo, ao passo que o grego se encaixa na unidade literária. A nota conserva honestamente a evidência hebraica sem inseri-la silenciosamente em um contexto ao qual aparentemente não pertence.
- issue: Sentido de πεπαιδευμένος
  choice: Traduzir «que viajou» no texto, em razão do contexto de viagens e experiência.
  alternative: «instruído», «educado» ou «treinado»
  rationale: O sentido lexical mais comum aponta para instrução ou formação, mas a associação contextual com muita experiência favorece o aprendizado adquirido em viagens. A nota mantém aberta a leitura lexical direta.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A construção proverbial foi preservada sem acrescentar linguagem confessional; as notas tornam transparentes tanto a divergência textual quanto a ambiguidade lexical.
