  text: I have seen many things in my wandering, and my understanding is more than my words.[b][a]
translation:
  language: pt
  text: Vi muitas coisas em minhas andanças,[a] e meu entendimento vai além das minhas palavras.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em meu desvio”, “em minhas viagens” ou “em meu vaguear”.
    reason: lexical_alternative
  - marker: b
    text: A linha preservada nos manuscritos hebraicos da Guenizá do Cairo não corresponde ao sentido deste versículo e parece conter material deslocado; por isso, a tradução segue aqui o testemunho grego de Sirácida 34:11.
    reason: textual_variant
lexical_decisions:
- source_word: πολλὰ ἑόρακα
  choice: Vi muitas coisas
  rationale: Expressa de modo natural o testemunho pessoal do grego, mantendo explícito o objeto plural.
- source_word: ἐν τῇ ἀποπλανήσει μου
  choice: em minhas andanças
  rationale: Preserva a ideia experiencial de vaguear ou peregrinar sem impor necessariamente o sentido moral de erro; a ambiguidade é indicada em nota.
- source_word: πλείονα τῶν λόγων μου
  choice: vai além das minhas palavras
  rationale: Torna inteligível a comparação grega condensada e comunica que o entendimento do autor excede aquilo que ele consegue expressar.
- source_word: σύνεσίς μου
  choice: meu entendimento
  rationale: Equivalente claro e amplamente compreensível para σύνεσις no contexto da literatura sapiencial.
theological_decisions:
- issue: Divergência entre os testemunhos hebraico e grego
  choice: Seguir o testemunho grego correspondente a Sirácida 34:11 e registrar a divergência textual em nota.
  alternative: Traduzir a linha hebraica preservada, que fala de dar ao pobre e emprestar ao SENHOR.
  rationale: A linha hebraica fornecida não corresponde ao conteúdo deste versículo e parece ser material deslocado. O grego apresenta uma leitura coerente e pertinente a Sirácida 34:11; a nota preserva transparência quanto ao problema textual.
translation_notes:
  register: Português atual, digno e de leitura ampla. “Andanças” conserva o caráter autobiográfico e a abertura semântica do grego; “vai além das minhas palavras” evita uma construção portuguesa artificial sem eliminar a comparação.
