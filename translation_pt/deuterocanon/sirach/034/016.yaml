translation:
  language: pt
  text: Ele colocou sinais de favor[a], e um clamor fez a nuvem se apressar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego paralelo diz: “E quem é o seu apoio?” O testemunho grego difere profundamente do hebraico preservado neste ponto, o que sugere uma forma textual substancialmente diferente.'
    reason: textual_variant
lexical_decisions:
- source_word: תמרורי
  choice: sinais
  rationale: O substantivo indica sinais ou marcas visíveis; “sinais” é natural em português e evita a concretude excessiva de “marcos” e a interpretação adicional de “presságios”.
- source_word: רצון
  choice: favor
  rationale: רצון pode indicar favor, boa vontade ou aceitação; “favor” preserva aqui o sentido de benevolência de modo conciso.
- source_word: הניחה
  choice: colocou
  rationale: A forma de נוח/הניח comunica a ideia de pôr ou depositar; “colocou” conserva a força concreta e soa natural.
- source_word: וצעקה
  choice: e um clamor
  rationale: A forma é entendida como substantivo. “Clamor” mantém a concisão e o tom elevado do hebraico.
- source_word: ענן
  choice: a nuvem
  rationale: O substantivo singular é traduzido concretamente; o artigo definido se ajusta ao estilo poético comprimido do trecho.
- source_word: חשתה
  choice: fez ... se apressar
  rationale: A raiz חושׁ expressa pressa. Como a sintaxe é difícil, a formulação causativa segue a leitura provável de que o clamor impele a nuvem a mover-se depressa.
theological_decisions:
- issue: Instabilidade textual entre os testemunhos hebraico e grego
  choice: Traduzir no texto principal o hebraico preservado e registrar em nota a linha grega muito diferente.
  alternative: “E quem é o seu apoio?”
  rationale: Quando preservado, o hebraico de Sirácida serve como testemunho principal; contudo, a grande divergência do grego pode refletir outro texto-base ou outro estágio textual e, por isso, precisa ser apresentada sem harmonização.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A construção poética concisa e a dificuldade sintática do hebraico foram preservadas tanto quanto possível sem tornar a frase obscura.
