  text: Like one grasping at a shadow and chasing the wind[a], so is one who clings to dreams.
translation:
  language: pt
  text: Como quem tenta agarrar uma sombra e persegue o vento, assim é quem se apega aos sonhos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “confia nos sonhos” ou “dá atenção aos sonhos”. O verbo grego pode indicar apegar-se a algo, depender disso ou dar-lhe atenção.
    reason: lexical_alternative
lexical_decisions:
- source_word: δρασσόμενος
  choice: tenta agarrar
  rationale: O particípio descreve o ato de procurar tomar algo com a mão. A inclusão de “tenta” torna natural em português a imagem de uma ação impossível, sem alterar sua força.
- source_word: σκιᾶς
  choice: uma sombra
  rationale: “Sombra” preserva a imagem de algo sem substância que não pode ser agarrado; o artigo indefinido é idiomático em português.
- source_word: διώκων ἄνεμον
  choice: persegue o vento
  rationale: A expressão conserva diretamente a metáfora de um esforço inútil e mantém um registro digno e corrente.
- source_word: ὁ ἐπέχων
  choice: quem se apega
  rationale: A formulação expressa ligação persistente com os sonhos e se ajusta à avaliação negativa da comparação, enquanto a nota registra outros sentidos legítimos do verbo.
- source_word: ἐνυπνίοις
  choice: aos sonhos
  rationale: O plural refere-se a sonhos ou visões durante o sono; “sonhos” é a forma mais clara e natural no contexto.
theological_decisions:
- issue: Força interpretativa de ὁ ἐπέχων ἐνυπνίοις
  choice: quem se apega aos sonhos
  alternative: quem confia nos sonhos; quem dá atenção aos sonhos
  rationale: A comparação caracteriza como inútil a relação descrita. “Apega” comunica dependência ou ligação sem transformar a advertência em uma afirmação doutrinária mais específica; a polissemia do verbo grego é preservada na nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe proverbial natural. A repetição equilibrada de “uma sombra” e “o vento” preserva o paralelismo e a imagem de futilidade do grego.
