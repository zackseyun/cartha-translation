base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/017.yaml
  text: The cry of the poor passes through the cloud[a], and until it reaches him it does not rest. It does not cease until God attends[b], and the righteous Judge executes judgment.
translation:
  language: pt
  text: O clamor do pobre atravessa a nuvem e não descansa até que chegue a ele. Não cessa até que Deus lhe dê atenção e um juiz justo execute o julgamento[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faça justiça”. O idioma hebraico diz literalmente “faça julgamento”.'
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego paralelo preservado em Swete difere substancialmente neste ponto: “Os olhos do Senhor estão sobre os que o amam...”. O hebraico sobrevivente traz o texto traduzido acima; por isso, a forma original deste versículo permanece textualmente incerta.'
    reason: textual_variant
lexical_decisions:
- source_word: שועת
  choice: o clamor de
  rationale: שועה é um grito de socorro ou apelo nascido da aflição. “Clamor” comunica urgência e mantém um registro digno e natural.
- source_word: דל
  choice: o pobre
  rationale: דל pode designar quem é pobre, humilde ou socialmente vulnerável; “o pobre” expressa melhor o sentido socioético do contexto.
- source_word: ענן חלפה
  choice: atravessa a nuvem
  rationale: A expressão retrata o clamor transpondo a nuvem em direção a Deus. “Atravessa” preserva de modo vívido esse movimento.
- source_word: ועד תגיע לא תנוח
  choice: não descansa até chegar a ele
  rationale: Os verbos femininos retomam שועת, “clamor”. O referente de “ele”, implícito no hebraico e esclarecido pela oração seguinte, é Deus; “não descansa” conserva a metáfora da súplica persistente.
- source_word: לא תמוש
  choice: não cessa
  rationale: Embora מוש possa significar afastar-se ou mover-se, aqui descreve a continuidade do clamor; “não cessa” comunica essa persistência com clareza.
- source_word: יפקוד אל
  choice: até que Deus lhe dê atenção
  rationale: פקד pode significar visitar, notar, atender ou intervir. “Dê atenção” expressa a resposta divina sem especificar além do texto a forma dessa atuação.
- source_word: ושופט צדק
  choice: e o justo Juiz
  rationale: A expressão pode apresentar Deus como juiz caracterizado pela justiça. A formulação mantém o título judicial e a ligação com a oração anterior.
- source_word: יעשה משפט
  choice: execute o julgamento
  rationale: O idioma hebraico é literalmente “faça julgamento”. “Execute o julgamento” preserva a força forense e a correspondência com “Juiz”; “faça justiça” permanece como alternativa em nota.
theological_decisions:
- issue: Referente divino implícito em “até chegar”
  choice: Empregar “até chegar a ele”, entendendo que o clamor chega a Deus.
  alternative: 'Deixar o destino totalmente implícito: “até chegar”.'
  rationale: O hebraico não explicita o objeto, mas a oração seguinte nomeia Deus. O pronome torna a frase inteligível em português sem acrescentar uma afirmação teológica nova.
- issue: Sentido de משפט
  choice: “execute o julgamento” no texto principal
  alternative: “faça justiça” ou “profira o julgamento”
  rationale: A passagem apresenta Deus como juiz que responde ao pobre. A opção principal conserva a imagem jurídica e a possível dimensão de sentença e ação, enquanto a nota registra a leitura idiomática “faça justiça”.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Clamor” mantém a urgência da súplica; “nuvem” conserva a imagem concreta; a repetição “não descansa / não cessa” reproduz a insistência poética do hebraico. A capitalização de “Juiz” assinala seu uso como designação de Deus sem inserir terminologia confessional.
