  text: For dreams have misled many[b][a], and those who hoped in them have fallen.
translation:
  language: pt
  text: Pois os sonhos desencaminharam muitos, e caíram os que neles puseram a esperança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Caíram» também pode transmitir, neste contexto, a ideia de fracasso ou ruína.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς
  choice: muitos
  rationale: Objeto humano indefinido de ἐπλάνησεν; em português, «muitos» expressa naturalmente «muitas pessoas» sem explicitação desnecessária.
- source_word: ἐπλάνησεν
  choice: desencaminharam
  rationale: O verbo indica fazer alguém se desviar ou andar errante. «Desencaminharam» preserva a imagem e o caráter de advertência sem intensificá-lo para «enganaram».
- source_word: τὰ ἐνύπνια
  choice: os sonhos
  rationale: Equivalente corrente e claro para o substantivo grego, adequado ao contexto de experiências oníricas.
- source_word: ἐξέπεσαν
  choice: caíram
  rationale: Mantém a metáfora ampla do grego, que pode abranger fracasso, perda ou ruína, sem decidir qual resultado específico está em vista.
- source_word: ἐλπίζοντες
  choice: os que puseram a esperança
  rationale: Expressa naturalmente o particípio substantivado e destaca a confiança depositada nos sonhos.
- source_word: ἐπʼ αὐτοῖς
  choice: neles
  rationale: O pronome retoma «os sonhos»; «pôr a esperança neles» é idiomático em português.
theological_decisions:
- issue: Natureza da advertência acerca dos sonhos
  choice: O versículo adverte que os sonhos desencaminham e que confiar neles leva à queda.
  alternative: Entender o versículo como condenação absoluta de todo sonho, ou somente da falsa interpretação de sonhos.
  rationale: O grego atribui aos sonhos o desencaminhamento de muitos e associa a queda à esperança posta neles. A tradução preserva essa afirmação sem universalizá-la nem restringi-la além do que o texto diz.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe proverbial. O plural verbal «desencaminharam» segue o sujeito plural neutro τὰ ἐνύπνια. A colocação da nota após a segunda oração esclarece apenas a amplitude de «caíram».
