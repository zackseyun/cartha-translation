  verdict: revise
  source_fidelity: 'O texto segue o hebraico preservado: a ação divina não tarda, irrompe como a de um guerreiro, esmaga os lombos do cruel, retribui com vingança às nações e elimina os emblemas do domínio arrogante e ímpio. A nota identifica corretamente a grande divergência do testemunho grego.'
  naturalness: 'A redação atual contém escolhas pouco naturais ou semanticamente imprecisas em português moderno: “Até Deus” sugere limite ou gradação temporal; e “destituir o cetro” não é uma colocação idiomática, pois se destitui uma pessoa de uma função. A revisão conserva a força poética e a estrutura paralela com sintaxe mais clara.'
  terminology: “Mesmo Deus”, “guerreiro”, “lombos”, “cetro”, “vara” e “ímpio” mantêm registro bíblico digno e legível. “Privar a arrogância de seu cetro” torna inteligível a remoção do poder simbolizado pelo cetro, sem abandonar a imagem hebraica.
  issues:
  - severity: medium
    issue: “Até Deus não demorará”
    rationale: Em português, “até Deus” normalmente introduz uma escala, um limite ou uma concessão (“até Deus faria isso”), e não comunica bem a partícula enfática גם. “Mesmo Deus” preserva de modo natural a ênfase.
  - severity: medium
    issue: “destituir o cetro da arrogância”
    rationale: “Destituir” requer normalmente uma pessoa ou titular como objeto, não um cetro. A formulação também obscurece o sentido de יוריש, isto é, fazer perder a posse ou o domínio. “Privar a arrogância de seu cetro” expressa naturalmente a imagem.
  - severity: low
    issue: “retribuir vingança às nações”
    rationale: A construção pode ser entendida como vingança em favor das nações. “Retribuir às nações com vingança” deixa claro que elas recebem a retribuição vingativa, preservando a direção marcada pelo למד.
