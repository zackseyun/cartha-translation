base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/018.yaml
  text: Even God will not delay[a], and like a warrior he will go out and not hold back, until he crushes the loins of the cruel, and repays vengeance to the nations; until he dispossesses the scepter of arrogance, and the staff of the wicked he will cut down completely.
translation:
  language: pt
  text: Mesmo Deus não demorará[a]; como um guerreiro, sairá e não se conterá, até esmagar os lombos do cruel e retribuir às nações com vingança; até privar a arrogância de seu cetro e cortar por completo a vara do ímpio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego fornecido para este versículo traz, em vez disso: “elevando a alma e iluminando os olhos, dando cura, vida e bênção”. Isso reflete uma tradição textual substancialmente diferente do hebraico preservado.'
    reason: textual_variant
lexical_decisions:
- source_word: גם אל
  choice: Até Deus
  rationale: גם introduz uma ênfase cujo valor discursivo exato depende do contexto. “Até Deus” preserva essa ênfase sem acrescentar explicação ao texto.
- source_word: לא יתמהמה
  choice: não demorará
  rationale: O verbo expressa demora ou tardança; a formulação é clara e corrente em português.
- source_word: כגבור יצא
  choice: como um guerreiro, sairá
  rationale: גבור, neste contexto marcial de juízo, designa adequadamente um guerreiro; “sairá” conserva o movimento expresso pelo verbo hebraico.
- source_word: לא יתאפק
  choice: não se conterá
  rationale: A expressão indica não refrear ou não restringir a si mesmo, preservada naturalmente pelo verbo pronominal português.
- source_word: ימחץ
  choice: esmagar
  rationale: מחץ é um verbo forte, com sentido de esmagar ou despedaçar, e a escolha mantém a violência concreta da imagem.
- source_word: מתני אכזרי
  choice: os lombos do cruel
  rationale: מתנים significa literalmente lombos ou quadris e pode representar força. Mantém-se a imagem corporal concreta e o singular genérico de אכזרי.
- source_word: לגוים ישיב נקם
  choice: retribuir vingança às nações
  rationale: A construção expressa devolver ou retribuir vingança. “Às nações” representa a direção marcada por ל sem ocultar que elas são alvo do juízo.
- source_word: יוריש
  choice: destituir
  rationale: O hifil de ירש pode significar desapossar ou fazer perder a posse. Com “cetro” como objeto, “destituir” comunica a remoção do poder arrogante, embora conserve a construção incomum do hebraico.
- source_word: שבט זדון
  choice: o cetro da arrogância
  rationale: שבט pode ser vara, bastão ou cetro; no contexto de domínio opressor, “cetro” evidencia poder governante, e זדון é arrogância ou insolência.
- source_word: מטה רשע
  choice: a vara do ímpio
  rationale: מטה denota vara ou bastão. “Vara” preserva o paralelismo com “cetro” sem repetir o mesmo termo, e רשע é entendido substantivamente.
- source_word: גדוע יגדע
  choice: ele cortará por completo
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. “Por completo” transmite essa força enfática em português natural.
theological_decisions:
- issue: Divergência textual substancial entre o hebraico e o paralelo grego
  choice: Traduzir no texto principal o testemunho hebraico existente
  alternative: 'O grego diz: “elevando a alma e iluminando os olhos, dando cura, vida e bênção”'
  rationale: Como o hebraico sobrevive neste trecho, ele é a fonte primária. O grego representa uma tradição textual profundamente diferente e, por isso, é registrado em nota, sem harmonização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem marcada da cláusula final foi mantida para refletir a anteposição do objeto no hebraico. A imagética corporal e marcial foi preservada sem suavização.
