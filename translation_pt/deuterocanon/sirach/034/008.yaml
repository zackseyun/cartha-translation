lexical_decisions:
- source_word: ἄνευ ψεύδους
  choice: Sem falsidade
  rationale: Reproduz diretamente a construção privativa e mantém ψεῦδος como qualidade abstrata, sem restringi-lo a uma mentira específica.
- source_word: συντελεσθήσεται
  choice: será cumprida
  rationale: O futuro passivo de συντελέω expressa levar algo ao pleno cumprimento; com νόμος, «será cumprida» é natural e semanticamente próxima.
- source_word: νόμος
  choice: lei
  rationale: É o equivalente direto de νόμος e evita estreitar interpretativamente o termo para «instrução».
- source_word: σοφία
  choice: sabedoria
  rationale: Equivalente padrão e natural de σοφία.
- source_word: στόματι πιστῷ
  choice: em uma boca fiel
  rationale: Conserva a imagem concreta da boca e representa de modo transparente o dativo grego, sem definir em excesso sua relação sintática.
- source_word: τελείωσις
  choice: plenitude
  rationale: Comunica o estado ou resultado de levar algo à completude. Soa mais natural neste aforismo do que «completação», sem afirmar a ideia moral mais forte que «perfeição» pode sugerir em português.
theological_decisions:
- issue: Sentido de νόμος no contexto sapiencial
  choice: lei
  alternative: instrução
  rationale: Embora «instrução» seja possível em literatura sapiencial, o grego traz νόμος sem elemento contextual suficiente para exigir esse estreitamento.
- issue: Relação sintática de στόματι πιστῷ com τελείωσις
  choice: «a plenitude em uma boca fiel»
  alternative: «a plenitude para uma boca fiel»
  rationale: A cláusula grega é compacta e admite mais de uma análise. A tradução principal mantém o dativo como localização metafórica; a nota registra a alternativa sem eliminar a ambiguidade.
- issue: Força semântica de τελείωσις
  choice: plenitude
  alternative: perfeição; conclusão
  rationale: «Plenitude» preserva a noção de consumação ou estado completo sem importar necessariamente impecabilidade moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase e a metáfora da «boca fiel» foram preservadas para manter o caráter aforístico e a tensão do grego.
