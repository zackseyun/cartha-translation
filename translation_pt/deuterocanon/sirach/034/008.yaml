  text: Sem falsidade, a lei será cumprida; e a sabedoria é perfeição em boca fiel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a sabedoria é perfeição para uma boca fiel»; também se pode traduzir «é a conclusão em boca fiel». A sintaxe grega da cláusula final é compacta e permite pequenas diferenças de construção.'
    reason: alternative_reading
  - marker: b
