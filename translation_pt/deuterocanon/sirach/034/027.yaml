  source_fidelity: O texto traduz com fidelidade o grego. «É como a vida» comunica adequadamente ἴσον ζωῆς; «se você o beber na medida certa» preserva a condição gnômica e a ideia de μέτρον. A leitura principal «quem é privado de vinho» é uma compreensão legítima e tradicionalmente bem sustentada de ἐλασσουμένῳ οἴνῳ, sem eliminar a possibilidade alternativa indicada na nota. A cláusula final preserva o perfeito passivo («foi criado») e a finalidade expressa por εἰς εὐφροσύνην ἀνθρώποις.
