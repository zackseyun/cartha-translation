base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/027.yaml
  text: Wine is like life to a man[a], if you drink it in due measure. What is life to one diminished by wine? For it too was created for human gladness.
translation:
  language: pt
  text: O vinho é como a vida para o ser humano, se você o beber na medida certa. Que vida há para quem é privado de vinho?[a] Pois ele também foi criado para a alegria dos seres humanos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “Que vida há para quem é diminuído pelo vinho?” A construção grega é concisa e pode indicar tanto alguém privado de vinho como alguém prejudicado por ele.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσον ζωῆς
  choice: é como a vida
  rationale: A expressão indica equivalência ou comparação. “É como a vida” preserva a força comparativa em português natural, sem a rigidez de “é igual à vida”.
- source_word: ἀνθρώπῳ
  choice: para o ser humano
  rationale: O dativo singular tem sentido genérico; “o ser humano” comunica essa referência universal sem restringi-la ao sexo masculino.
- source_word: ἐὰν πίνῃς αὐτὸν
  choice: se você o beber
  rationale: Mantém a mudança do grego para a segunda pessoa do singular e o tom direto do dito sapiencial.
- source_word: μέτρῳ αὐτοῦ
  choice: na medida certa
  rationale: Conserva a imagem de medida ou porção e expressa com naturalidade a ideia contextual de consumo moderado, sem substituir a metáfora por uma formulação abstrata.
- source_word: τίς ζωὴ
  choice: Que vida há
  rationale: Reproduz a pergunta retórica breve e enfática de modo idiomático em português.
- source_word: ἐλασσουμένῳ οἴνῳ
  choice: para quem é privado de vinho
  rationale: A construção dativa é concisa e ambígua. A leitura de privação ajusta-se ao sentido lexical de ser reduzido ou ficar com menos e ao elogio do vinho bebido na medida certa; a leitura instrumental alternativa é preservada em nota.
- source_word: ἔκτισται
  choice: foi criado
  rationale: Expressa o estado resultante do perfeito passivo e mantém a afirmação de que o vinho possui uma finalidade dentro da criação.
- source_word: εἰς εὐφροσύνην ἀνθρώποις
  choice: para a alegria dos seres humanos
  rationale: “Alegria” traduz claramente εὐφροσύνη, enquanto “dos seres humanos” comunica a referência genérica plural de ἀνθρώποις.
theological_decisions:
- issue: Finalidade criacional do vinho
  choice: ele também foi criado para a alegria dos seres humanos
  alternative: foi criado para alegrar as pessoas
  rationale: A formulação mantém a avaliação positiva do vinho como criação destinada à alegria, ao mesmo tempo que a condição anterior limita esse bem ao uso na medida certa. Não se introduz uma doutrina de abstinência nem uma aprovação do excesso.
- issue: Sentido de ἐλασσουμένῳ οἴνῳ
  choice: quem é privado de vinho
  alternative: quem é diminuído ou prejudicado pelo vinho
  rationale: A leitura principal entende o particípio como redução ou privação quanto ao vinho, o que se harmoniza com a sequência argumentativa. Como a sintaxe grega permite entender o vinho como aquilo pelo qual alguém é diminuído, a tensão é explicitamente preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A segunda pessoa é expressa por “você” para conservar a interpelação direta do grego sem soar arcaica. A nota foi colocada junto à frase efetivamente ambígua.
