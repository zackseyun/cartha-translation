  text: One who fears the Lord will not be shaken, and will not be afraid, for he is his hope.
translation:
  language: pt
  text: Quem teme o Senhor não será abalado nem terá medo, pois o próprio Senhor é a sua esperança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A linha hebraica dos manuscritos da Guenizá do Cairo fornecida para este versículo diz: “Ele não desamparará o clamor do órfão, nem a viúva quando multiplicar a sua queixa”. Ela não corresponde ao texto grego aqui traduzido e provavelmente resulta de um desalinhamento de versículos no material-fonte.'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ φοβούμενος
  choice: Quem teme
  rationale: O particípio grego substantivado tem sentido genérico e singular; “Quem teme” é natural em português e preserva esse valor representativo.
- source_word: Κύριον
  choice: o Senhor
  rationale: Forma corrente e digna para o título divino κύριος.
- source_word: οὐ μὴ πτοηθῇ
  choice: não será abalado
  rationale: A construção enfática nega que a pessoa seja tomada de pavor ou profundamente perturbada; “abalado” preserva tanto a agitação emocional quanto a ideia de desestabilização.
- source_word: οὐ μὴ δειλιάσῃ
  choice: nem ficará com medo
  rationale: δειλιάω indica amedrontar-se ou perder a coragem. A formulação é clara e atual, sem introduzir a conotação moral mais forte de “ser covarde”.
- source_word: αὐτὸς ἐλπὶς αὐτοῦ
  choice: o próprio Senhor é a sua esperança
  rationale: O pronome enfático αὐτός retoma naturalmente o Senhor. Explicitar o referente em português elimina uma ambiguidade pronominal acidental sem alterar o sentido, e “esperança” traduz diretamente ἐλπίς.
theological_decisions:
- issue: Divergência entre a linha hebraica fornecida e o texto grego de Sirácida 34:14
  choice: Adotar no texto principal a leitura grega correspondente a Sirácida 34:14
  alternative: “Ele não desamparará o clamor do órfão, nem a viúva quando multiplicar a sua queixa.”
  rationale: A linha hebraica fornecida não corresponde semanticamente ao versículo grego identificado como Sirácida 34:14 e foi sinalizada como grande incompatibilidade, provavelmente por desalinhamento de linhas. A leitura grega é coerente e deve fundamentar o texto principal, enquanto a divergência hebraica é registrada em nota para transparência textual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição do Senhor na última oração torna explícito o referente do pronome grego sem acrescentar conteúdo doutrinário.
