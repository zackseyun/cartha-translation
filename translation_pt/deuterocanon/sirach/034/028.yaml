lexical_decisions:
- source_word: ἀγαλλίαμα
  choice: alegria
  rationale: Expressa deleite intenso ou exultação em linguagem natural e digna, preservando o paralelismo poético.
- source_word: καρδίας
  choice: do coração
  rationale: Mantém o genitivo e a imagem bíblica do coração como centro da experiência interior.
- source_word: εὐφροσύνη
  choice: júbilo
  rationale: Comunica alegria viva e festiva, distinguindo o termo de ἀγαλλίαμα sem romper o paralelismo.
- source_word: ψυχῆς
  choice: da alma
  rationale: Preserva a referência à vida interior da pessoa e corresponde poeticamente a “do coração”.
- source_word: οἶνος πινόμενος
  choice: o vinho bebido
  rationale: Reproduz de modo conciso o substantivo com o particípio passivo, adequado ao estilo proverbial.
- source_word: ἐν καιρῷ
  choice: no tempo certo
  rationale: καιρός indica uma ocasião apropriada, não apenas um ponto cronológico.
- source_word: αὐτάρκης
  choice: com moderação
  rationale: Embora o adjetivo denote literalmente aquilo que é suficiente ou bastante, no contexto do consumo de vinho aponta naturalmente para uma quantidade adequada, sem excesso.
theological_decisions:
- issue: Força ética de αὐτάρκης em relação ao vinho
  choice: O vinho traz alegria quando consumido na ocasião apropriada e em quantidade moderada.
  alternative: O vinho traz alegria quando consumido no tempo certo e em quantidade suficiente.
  rationale: A tradução “com moderação” comunica a adequação quantitativa sugerida pelo adjetivo no contexto, enquanto a nota preserva sua formulação mais literal e a ambiguidade lexical.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção mantém o paralelismo sapiencial entre “coração” e “alma” e conserva um tom conciso e digno.
