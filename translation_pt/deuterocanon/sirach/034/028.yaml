  text: Wine drunk at the proper time and in moderation is gladness of heart and joy of soul[a].
translation:
  language: pt
  text: Alegria do coração e júbilo da alma é o vinho bebido no tempo certo e com moderação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O vinho bebido no tempo certo, em quantidade suficiente.” O adjetivo grego pode significar mais literalmente “suficiente” ou “bastante”; neste contexto, provavelmente indica uma quantidade moderada, sem excesso.'
