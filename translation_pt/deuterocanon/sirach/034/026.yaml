  text: A furnace tests the tempering in dipping[b][a]; so wine tests hearts in the strife of the proud.
translation:
  language: pt
  text: A fornalha põe à prova o fio durante a têmpera[a]; assim o vinho põe à prova os corações na contenda dos orgulhosos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego da primeira linha é difícil. A expressão traduzida por “o fio durante a têmpera” também pode ser entendida como “o endurecimento na imersão” ou, de modo mais geral, “uma peça de metal ao ser mergulhada”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “na batalha dos orgulhosos”. A palavra grega pode indicar batalha, luta ou conflito.'
    reason: alternative_reading
lexical_decisions:
- source_word: κάμινος
  choice: fornalha
  rationale: Designa um forno de calor intenso; “fornalha” conserva naturalmente a imagem metalúrgica e a ideia de prova.
- source_word: δοκιμάζει
  choice: põe à prova
  rationale: Expressa o ato de verificar ou comprovar a qualidade de algo, em linguagem atual e clara.
- source_word: στόμωμα
  choice: fio
  rationale: No contexto metalúrgico, pode indicar o fio ou a parte endurecida de um instrumento. “Fio” produz uma imagem inteligível, enquanto a nota preserva a incerteza lexical.
- source_word: ἐν βαφῇ
  choice: durante a têmpera
  rationale: βαφή denota imersão e, neste contexto, provavelmente o mergulho do metal no processo de têmpera. A formulação portuguesa comunica a imagem técnica sem tornar o verso obscuro.
- source_word: οὕτως
  choice: assim
  rationale: Introduz de modo conciso e natural a comparação entre a prova do metal e a prova dos corações.
- source_word: οἶνος
  choice: vinho
  rationale: Equivalente direto, mantendo o agente da prova na segunda parte do provérbio.
- source_word: καρδίας
  choice: os corações
  rationale: Preserva o plural e a imagem bíblica do coração como centro do caráter e das disposições interiores.
- source_word: ἐν μάχῃ
  choice: na contenda
  rationale: μάχη pode indicar batalha, luta ou conflito. “Contenda” se ajusta à provocação e às desavenças associadas ao vinho sem impor uma cena militar.
- source_word: ὑπερηφάνων
  choice: dos orgulhosos
  rationale: Mantém o genitivo ligado à contenda e conserva a caracterização moral do texto grego.
theological_decisions:
- issue: Interpretação da expressão difícil στόμωμα ἐν βαφῇ
  choice: Imagem metalúrgica do fio submetido à têmpera
  alternative: O endurecimento provado pela imersão; ou uma peça de metal provada ao ser mergulhada
  rationale: A expressão grega é incomum e admite mais de uma análise. O texto principal oferece uma imagem coerente e natural, enquanto a nota registra as alternativas sem transformar uma incerteza lexical em afirmação doutrinária.
- issue: Sentido de μάχη na prova causada pelo vinho
  choice: contenda
  alternative: batalha ou conflito
  rationale: O termo possui força conflitiva, mas não exige combate militar. “Contenda” preserva a tensão moral e social do provérbio sem especificar além do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo sapiencial e a repetição de “põe à prova”. O termo técnico “têmpera” é esclarecido pelo contexto e pela nota.
