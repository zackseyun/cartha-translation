translation:
  language: pt
  text: 'A visão de sonhos é isto em relação àquilo: a imagem de um rosto diante de um rosto.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Uma visão de sonhos é isto em relação àquilo: a semelhança de um rosto diante de um rosto». O grego é conciso e elíptico; «em relação a» também pode sugerir comparação, correspondência ou reflexo.'
    reason: Alternativa lexical e preservação da ambiguidade da construção grega.
lexical_decisions:
- source_word: ὅρασις ἐνυπνίων
  choice: uma visão de sonhos
  rationale: Mantém a construção genitiva compacta e a ligação direta entre visão e sonhos, sem recorrer ao termo mais técnico «visão onírica» nem explicar além do grego.
- source_word: τοῦτο κατὰ τούτου
  choice: isto em confronto com aquilo
  rationale: A expressão grega é elíptica e proverbial. «Em confronto com» conserva a ideia de justaposição, correspondência ou oposição, enquanto «isto... aquilo» torna inteligível em português o contraste entre os demonstrativos.
- source_word: κατέναντι προσώπου
  choice: diante de outro rosto
  rationale: κατέναντι indica posição em frente ou diante de algo. «Outro» explicita apenas a relação exigida pela imagem em português, sem transformar a frase na expressão idiomática «face a face».
- source_word: ὁμοίωμα προσώπου
  choice: a imagem de um rosto
  rationale: ὁμοίωμα pode significar imagem, semelhança ou representação. «Imagem» é natural em português e preserva a noção de correspondência sem afirmar identidade.
theological_decisions:
- issue: Força interpretativa do provérbio sobre os sonhos
  choice: Conservar a comparação entre a visão de sonhos e uma imagem colocada diante de um rosto, sem declarar explicitamente que o sonho é falso ou irreal.
  alternative: Explicar que os sonhos são apenas reflexos da realidade e não a própria realidade.
  rationale: O contexto adverte contra a confiança nos sonhos, mas este versículo exprime isso por meio de uma metáfora concisa e ambígua. A tradução não deve converter a metáfora em uma afirmação teológica mais forte.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação mantém deliberadamente o caráter aforístico e incomum do grego; «em confronto com» evita tanto uma interpretação puramente hostil quanto uma paráfrase explicativa demais.
