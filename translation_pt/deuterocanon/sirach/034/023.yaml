  yaml_path: translation/deuterocanon/sirach/034/023.yaml
  text: Whoever takes away a neighbor’s livelihood is murdering him[b][a], and whoever withholds a hired worker’s wages is shedding blood.
translation:
  language: pt
  text: Quem tira do próximo os meios de subsistência o assassina[a][b], e quem retém o salário do trabalhador contratado derrama sangue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “quem tira os meios de subsistência”. O termo grego se refere àquilo de que uma pessoa depende para viver.
    reason: lexical_alternative
  - marker: b
    text: O texto estabelece diretamente essa equivalência moral; não diz apenas “é como se o assassinasse”.
    reason: alternative_reading
lexical_decisions:
- source_word: φονεύων
  choice: assassina
  rationale: O particípio presente tem força predicativa e proverbial. “Assassina” expressa a morte injusta e conserva a contundência moral de φονεύω melhor do que o mais amplo “mata”.
- source_word: τὸν πλησίον
  choice: o próximo
  rationale: “O próximo” é a expressão ética corrente em português e corresponde ao uso substantivado de πλησίον.
- source_word: ὁ ἀφαιρούμενος συμβίωσιν
  choice: quem tira do próximo os meios de subsistência
  rationale: ἀφαιρέω indica tirar ou privar, e συμβίωσις designa aquilo de que alguém vive. “Meios de subsistência” é claro, atual e mantém a ligação concreta com a preservação da vida.
- source_word: ἐκχέων αἷμα
  choice: derrama sangue
  rationale: Preserva o conhecido idiomatismo bíblico e seu sentido de culpa por violência ou morte, sem o reduzir a uma paráfrase explicativa.
- source_word: ὁ ἀποστερῶν
  choice: quem retém
  rationale: No contexto de salário, ἀποστερέω indica privar alguém de modo injusto, defraudar ou deixar de pagar. “Retém” comunica com naturalidade a ação deliberada de não entregar o que é devido.
- source_word: μισθὸν μισθωτοῦ
  choice: o salário do trabalhador contratado
  rationale: μισθός é o pagamento devido, e μισθωτός é quem trabalha mediante contratação e remuneração. A formulação é compreensível no português contemporâneo e preserva a situação socioeconômica do texto.
theological_decisions:
- issue: Força ética da identificação entre privação econômica e homicídio
  choice: o assassina / derrama sangue
  alternative: é como se o assassinasse / é como quem derrama sangue
  rationale: O grego apresenta predicações diretas e paralelas, sem qualquer marcador comparativo. A tradução mantém a identificação moral contundente em vez de suavizá-la como mera semelhança.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção proverbial com “quem” reproduz com naturalidade os particípios substantivados gregos; a formulação conserva o paralelismo e a severidade ética do original.
