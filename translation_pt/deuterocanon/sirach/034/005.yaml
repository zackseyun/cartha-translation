base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/005.yaml
  text: Divinations and omens[b] and dreams are empty, and the heart imagines them like a woman in labor.[a]
translation:
  language: pt
  text: Adivinhações, presságios[b] e sonhos são vazios, e o coração imagina como uma mulher em trabalho de parto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A linha hebraica preservada fornecida para este versículo diz: «Com generosidade, dê ao pobre e não fique ressentido ao lhe dar.» Ela parece refletir outro versículo ou uma testemunha textual identificada incorretamente. A tradução acima segue o texto grego.'
    reason: textual_variant
  - marker: b
    text: Ou «augúrios». O termo grego se refere à interpretação de sinais como indícios do que acontecerá.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαντεῖαι
  choice: Adivinhações
  rationale: O hebraico fornecido parece pertencer a outro contexto; por isso, o paralelo grego serve de base textual. O termo designa práticas de adivinhação, e «adivinhações» é direto e compreensível.
- source_word: οἰωνισμοί
  choice: presságios
  rationale: O termo se refere à interpretação de sinais como indícios do futuro. «Presságios» é natural em português; «augúrios» é uma alternativa mais técnica.
- source_word: ἐνύπνια
  choice: sonhos
  rationale: Tradução direta e natural, sem intensificar o sentido para «visões».
- source_word: μάταιά
  choice: vazios
  rationale: Expressa a falta de conteúdo confiável e a inutilidade dessas práticas, preservando a predicação do grego.
- source_word: φαντάζεται
  choice: cria imagens
  rationale: O verbo indica a formação de aparências ou imagens na mente. «Cria imagens» preserva essa nuance melhor que uma formulação que pressupusesse delírio.
- source_word: καρδία
  choice: o coração
  rationale: Mantém a metáfora bíblica para o centro interior do pensamento e do sentimento.
- source_word: ὡς ὠδινούσης
  choice: como uma mulher em trabalho de parto
  rationale: O particípio feminino evoca uma mulher sofrendo as dores do parto; a explicitação é necessária para uma comparação natural em português.
theological_decisions:
- issue: Divergência substancial entre o hebraico preservado fornecido e o paralelo grego
  choice: Traduzir o paralelo grego como texto operativo de Sirácida 34:5 e registrar a divergência em nota.
  alternative: 'Traduzir o hebraico fornecido: «Com bons olhos, dê ao pobre, e não fique ressentido ao lhe dar.»'
  rationale: A linha hebraica é semanticamente alheia ao contexto e está identificada como incompatibilidade grave, ao passo que o grego preserva a leitura coerente de Sirácida 34:5. A incerteza textual é declarada, não ocultada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Trabalho de parto» mantém a imagem concreta sem arcaísmo; «cria imagens» preserva a ambiguidade da atividade mental indicada pelo grego.
