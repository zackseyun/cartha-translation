  text: Unless it is sent from the Most High in visitation[b][a], do not give your heart to them.
translation:
  language: pt
  text: A menos que isso seja enviado da parte do Altíssimo em uma visitação[a], não entregue seu coração a essas coisas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Em uma visitação” também pode ser entendida como “no tempo da visitação”, “sob supervisão” ou “para inspeção”.
    reason: alternative_reading
  - marker: b
    text: Isto é, aos sonhos e a experiências semelhantes mencionados no contexto.
    reason: referent_clarification
lexical_decisions:
- source_word: ἐὰν μὴ
  choice: A menos que
  rationale: Expressa de modo natural a condição negativa e mantém a força da advertência.
- source_word: παρὰ Ὑψίστου
  choice: da parte do Altíssimo
  rationale: παρά com o genitivo indica origem ou procedência; a formulação também preserva Altíssimo como título divino.
- source_word: ἀποσταλῇ
  choice: seja enviado
  rationale: Mantém a voz passiva do aoristo subjuntivo, regido pela oração condicional, sem explicitar um sujeito que o grego deixa implícito.
- source_word: ἐν ἐπισκοπῇ
  choice: em uma visitação
  rationale: Preserva a amplitude semântica de ἐπισκοπή, que pode envolver visitação, inspeção ou supervisão divina, sem decidir entre essas nuances.
- source_word: μὴ δῷς
  choice: não entregue
  rationale: Reproduz a imagem de dar ou confiar o coração, usando em português um verbo natural para dedicação interior.
- source_word: εἰς αὐτὰ
  choice: a essas coisas
  rationale: O neutro plural retoma os sonhos e fenômenos semelhantes do contexto. A expressão portuguesa mantém o referente abrangente sem acrescentar uma identificação excessivamente específica.
- source_word: τὴν καρδίαν σου
  choice: o seu coração
  rationale: Conserva a metáfora bíblica do coração como centro da confiança, atenção e compromisso interior.
theological_decisions:
- issue: Sentido de ἐν ἐπισκοπῇ
  choice: em uma visitação
  alternative: sob supervisão; para inspeção; no tempo da visitação
  rationale: A expressão grega é teologicamente aberta e pode indicar uma visitação ou intervenção divina, uma inspeção ou uma supervisão. O texto principal retém essa abertura, e a nota registra as demais possibilidades.
- issue: Origem divina de sonhos ou experiências semelhantes
  choice: A condição admite apenas aquilo que seja enviado da parte do Altíssimo, sem definir como essa origem é reconhecida.
  alternative: Explicitar que se trata de um sonho revelador autenticado por Deus.
  rationale: O grego enuncia a condição, mas não fornece neste versículo um critério detalhado de discernimento; acrescentá-lo resolveria uma tensão que o texto preserva.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A construção “da parte do Altíssimo” indica procedência; “entregue o seu coração” conserva a metáfora original sem reduzi-la apenas a atenção intelectual. A formulação evita especificar o sujeito implícito de ἀποσταλῇ e mantém a ambiguidade de ἐπισκοπή.
