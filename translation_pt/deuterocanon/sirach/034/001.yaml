  text: Empty and false hopes are for a senseless man[b][a], and dreams give wings to fools.
translation:
  language: pt
  text: Esperanças vazias e falsas são próprias de um homem sem entendimento[a], e os sonhos dão asas aos insensatos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Esperanças vãs e enganosas pertencem ao homem sem entendimento”.'
    reason: Alternativa lexical e sintática para κεναὶ καὶ ψευδεῖς e para o dativo ἀσυνέτῳ ἀνδρί.
  - marker: b
    text: Literalmente, “dão asas aos insensatos”; a imagem sugere que os sonhos os fazem alçar voo ou se deixar levar.
    reason: A nota esclarece a metáfora grega sem a resolver em um único sentido.
lexical_decisions:
- source_word: κεναὶ
  choice: vazias
  rationale: Preserva a imagem de esperanças sem conteúdo ou fundamento, com linguagem clara e corrente.
- source_word: ψευδεῖς
  choice: falsas
  rationale: Expressa diretamente aquilo que não corresponde à verdade, sem pressupor necessariamente intenção ativa de enganar.
- source_word: ἐλπίδες
  choice: esperanças
  rationale: É o equivalente comum e direto do substantivo grego neste aforismo sapiencial.
- source_word: ἀσυνέτῳ ἀνδρί
  choice: de um homem sem entendimento
  rationale: A formulação conserva o singular masculino proverbial e distingue ἀσύνετος, falta de compreensão ou discernimento, do termo ἄφρων da oração seguinte. “São próprias de” comunica naturalmente o dativo grego.
- source_word: ἐνύπνια
  choice: sonhos
  rationale: É a tradução comum e suficiente; o contexto não exige a expansão “visões em sonhos”.
- source_word: ἀναπτεροῦσιν
  choice: dão asas a
  rationale: Mantém a metáfora vívida do verbo grego, em vez de a reduzir a uma explicação interpretativa.
- source_word: ἄφρονας
  choice: insensatos
  rationale: Termo sapiencial natural em português para pessoas desprovidas de bom senso; evita repetir “sem entendimento” e preserva a distinção lexical do grego.
theological_decisions:
- issue: Singular masculino ἀνδρί em uma máxima sapiencial
  choice: um homem
  alternative: uma pessoa
  rationale: O masculino singular do texto é preservado como forma proverbial representativa, sem acrescentar uma restrição doutrinária aos homens.
- issue: Sentido metafórico de ἀναπτεροῦσιν
  choice: dão asas aos insensatos
  alternative: arrebatam os insensatos
  rationale: A metáfora é mantida sem definir se os sonhos apenas entusiasmam, elevam ou levam os insensatos para longe da realidade.
translation_notes:
  register: Português moderno, claro e digno, com cadência proverbial. “Sem entendimento” e “insensatos” conservam a distinção entre os dois termos gregos para deficiência de discernimento. A ordem inicial dos adjetivos mantém a ênfase do original.
