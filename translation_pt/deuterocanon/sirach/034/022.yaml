base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/022.yaml
  text: Bread for the needy is the life of the poor[a]; the one who deprives them of it is a man of blood.
translation:
  language: pt
  text: O pão dos necessitados é a vida dos pobres; quem os priva dela é homem de sangue.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «assassino» ou «homem culpado de derramamento de sangue». O grego diz literalmente «homem de sangues», expressão idiomática que indica culpa de sangue.
    reason: Explica o idiomatismo grego e registra alternativas interpretativas sem enfraquecer sua força moral.
lexical_decisions:
- source_word: ἄρτος
  choice: pão
  rationale: Mantém a imagem concreta do grego e seu sentido natural de sustento básico.
- source_word: ἐπιδεομένων
  choice: dos necessitados
  rationale: O particípio designa os que carecem do necessário; a construção também preserva a ideia de que esse pão lhes pertence ou lhes é devido.
- source_word: ζωὴ πτωχῶν
  choice: a vida dos pobres
  rationale: Reproduz de modo claro e digno a afirmação de que o sustento básico mantém a vida dos pobres.
- source_word: ὁ ἀποστερῶν αὐτὴν
  choice: quem os priva dela
  rationale: ἀποστερέω expressa privar ou reter o que é devido. O feminino αὐτήν retoma gramaticalmente ζωή, «vida»; «os» explicita naturalmente em português as pessoas afetadas.
- source_word: ἄνθρωπος αἱμάτων
  choice: homem de sangue
  rationale: Conserva o forte idiomatismo semítico refletido no grego, sem reduzi-lo silenciosamente a uma única interpretação jurídica ou psicológica.
theological_decisions:
- issue: Força moral de equiparar a privação do sustento dos pobres à culpa de sangue
  choice: homem de sangue
  alternative: assassino; homem culpado de derramamento de sangue
  rationale: 'A formulação literal preserva a tensão ética do texto: tirar dos pobres aquilo de que sua vida depende acarreta culpa de sangue, sem definir de modo excessivamente estreito a natureza dessa culpa.'
translation_notes:
  register: Português moderno, claro e solene, com construção concisa. «Homem de sangue» é deliberadamente mais literal e menos comum; a nota esclarece o idioma. O pronome «dela» remete a «vida», conforme o gênero gramatical de αὐτήν no grego.
