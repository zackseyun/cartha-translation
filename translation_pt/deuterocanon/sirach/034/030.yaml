  yaml_path: translation/deuterocanon/sirach/034/030.yaml
  text: Drunkenness multiplies the anger of a foolish man into stumbling[a], diminishing strength and producing wounds.
translation:
  language: pt
  text: A embriaguez aumenta a ira do homem insensato, resultando em tropeço[a], diminuindo a força e produzindo feridas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até se tornar um obstáculo que faz cair”. O termo grego pode indicar tropeço, obstáculo ou ocasião de queda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πληθύνει
  choice: aumenta
  rationale: Expressa com naturalidade o sentido causativo de tornar maior ou mais intenso; “multiplica” seria possível, mas menos idiomático neste contexto em português.
- source_word: μέθη
  choice: embriaguez
  rationale: Designa o estado de intoxicação, não apenas o ato de beber, e preserva o tom sapiencial e moral do texto.
- source_word: θυμὸν
  choice: ira
  rationale: No contexto dos efeitos da embriaguez sobre o insensato, indica sobretudo cólera ou ânimo exaltado.
- source_word: ἄφρονος
  choice: do homem insensato
  rationale: Mantém o masculino singular representativo do grego e usa uma expressão corrente na literatura sapiencial em português.
- source_word: εἰς πρόσκομμα
  choice: levando-o ao tropeço
  rationale: Conserva a imagem concreta de tropeçar e comunica o valor resultativo de εἰς sem restringir o sentido a ruína total.
- source_word: ἐλαττῶν
  choice: diminuindo
  rationale: Preserva a forma participial e apresenta um efeito contínuo ou resultante.
- source_word: ἰσχὺν
  choice: a força
  rationale: É a correspondência portuguesa mais direta para vigor ou capacidade física e pessoal.
- source_word: προσποιοῦν
  choice: produzindo
  rationale: Mantém o sentido causativo de fazer surgir ou ocasionar, sem explicitação adicional.
- source_word: τραύματα
  choice: feridas
  rationale: Preserva a concretude das lesões físicas sugeridas pelo contexto de ira e embriaguez.
theological_decisions:
- issue: Masculino representativo na literatura sapiencial
  choice: homem insensato
  alternative: pessoa insensata; insensato
  rationale: O grego apresenta um genitivo masculino singular como tipo sapiencial representativo; a tradução conserva essa forma sem a neutralizar.
- issue: Relação entre a ira e o tropeço
  choice: A embriaguez aumenta a ira do homem insensato, levando-o ao tropeço
  alternative: A ira do insensato leva a um obstáculo ou queda
  rationale: A leitura principal acompanha a construção em que a embriaguez intensifica a ira com resultado de tropeço, enquanto a nota preserva a possível ligação alternativa e a amplitude semântica de πρόσκομμα.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A estrutura participial foi preservada, e a metáfora do tropeço foi mantida sem a reduzir a ofensa moral ou ruína definitiva.
