review_pass:
  verdict: revise
  source_fidelity: O texto principal segue de modo adequado o paralelo grego, conforme a decisão editorial documentada diante da divergência radical do hebraico. No entanto, «o que o seu próximo sente» e a repetição de «sente» interpretam τὰ τοῦ πλησίον de modo mais estreito do que o grego, que abrange aquilo que diz respeito ao próximo, sua situação ou seus interesses. A nota registra corretamente a divergência, mas «dos que a oprimem» não representa de modo seguro a ambiguidade de מרודיה, para o qual a trilha inglesa preserva «destruidores/rebeldes».
  naturalness: A redação é clara e natural em português moderno. «Compreenda a situação do seu próximo a partir da sua própria experiência» mantém a legibilidade brasileira, evita a dupla repetição de «sente» e comunica a analogia exigida pelo grego sem transformar a expressão em referência exclusiva a sentimentos.
  terminology: '«Próximo», «situação», «experiência», «reflita» e «toda questão» são adequados ao registro sapiencial. Na nota, «destruidores [ou: rebeldes]» preserva a incerteza lexical do hebraico sem impor uma interpretação como «opressores».'
  issues:
  - severity: medium
    issue: Restrição interpretativa de τὰ τοῦ πλησίον a sentimentos
    rationale: A expressão grega significa amplamente «as coisas/a situação do próximo». A formulação atual, «o que o seu próximo sente», é possível como aplicação ética, mas estreita indevidamente o alcance do original.
  - severity: medium
    issue: A nota resolve de forma excessiva o termo hebraico ambíguo מרודיה
    rationale: «Dos que a oprimem» não corresponde diretamente às alternativas preservadas no histórico editorial («destruidores/rebeldes»). A nota deve manter a ambiguidade textual em vez de especificar opressão.
  revised_text: Compreenda a situação do seu próximo a partir da sua própria experiência e reflita sobre toda questão.[a]
  revised_footnotes:
  - marker: a
    text: 'O testemunho hebraico preservado nos manuscritos da Geniza do Cairo difere consideravelmente: “Não corre uma lágrima pela face, e um suspiro por seus destruidores [ou: rebeldes]?” Como a tradição textual deste versículo é incerta, o texto principal segue o paralelo grego.'
    reason: Leitura alternativa decorrente de importante divergência entre os testemunhos hebraico e grego.
  revision_rationale: A revisão conserva a escolha editorial documentada de seguir o grego no texto principal, mas traduz τὰ τοῦ πλησίον com alcance mais amplo e menos interpretativo. A nota foi ajustada para refletir honestamente a leitura hebraica divergente e a incerteza de seu termo final.
