  text: Judge your neighbor's feelings by your own, and think carefully about every matter.[a]
translation:
  language: pt
  text: Compreenda a situação do seu próximo a partir da sua própria experiência e reflita sobre toda questão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho hebraico preservado nos manuscritos da Geniza do Cairo difere consideravelmente: “Não corre uma lágrima pela face, e um suspiro por seus destruidores [ou: rebeldes]?” Como a tradição textual deste versículo é incerta, o texto principal segue o paralelo grego.'
    reason: Leitura alternativa decorrente de importante divergência entre os testemunhos hebraico e grego.
lexical_decisions:
- source_word: νόει
  choice: Entenda
  rationale: O imperativo grego pede compreensão atenta e reflexiva; “entenda” é natural em português e evita o possível sentido judicial de “julgue”.
- source_word: τὰ τοῦ πλησίον
  choice: o que o seu próximo sente
  rationale: A expressão significa literalmente “as coisas do próximo”. No contexto da comparação consigo mesmo, a formulação explicita de modo natural a empatia envolvida, sem restringi-la a bens ou posses.
- source_word: ἐκ σεαυτοῦ
  choice: com base no que você mesmo sente
  rationale: Expressa a própria experiência como ponto de comparação para compreender o próximo. A repetição de “sente” torna clara essa relação em português corrente.
- source_word: ἐπὶ παντὶ πράγματι
  choice: sobre cada questão
  rationale: Preserva a abrangência da expressão grega, que se refere a todo assunto ou situação concreta.
- source_word: διανοοῦ
  choice: reflita
  rationale: O imperativo transmite ponderação deliberada; “reflita” conserva essa força de maneira concisa e digna.
theological_decisions:
- issue: Divergência substancial entre o testemunho hebraico preservado e o paralelo grego
  choice: Seguir o sentido grego no texto principal e registrar a leitura hebraica em nota
  alternative: 'Traduzir no texto principal: “Não corre uma lágrima pela face, e um suspiro por causa dos que a oprimem ou se rebelam contra ela?”'
  rationale: O hebraico preservado apresenta uma linha completamente diferente, enquanto o grego oferece uma exortação sapiencial coerente com o contexto. A nota mantém visível a divergência textual sem fundir artificialmente as duas tradições.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação mantém o paralelismo entre a experiência pessoal e a compreensão do próximo, usando “reflita” para conservar o tom sapiencial e exortativo.
