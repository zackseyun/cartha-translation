  text: One is praying and one is cursing—whose voice will the Master listen to?
translation:
  language: pt
  text: Um ora, e outro amaldiçoa; a voz de qual deles o Senhor ouvirá?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς εὐχόμενος
  choice: Um ora
  rationale: Expressa de modo natural o particípio presente εὐχόμενος, que neste contraste indica alguém que está orando.
- source_word: εἷς καταρώμενος
  choice: outro amaldiçoa
  rationale: O segundo εἷς introduz a outra pessoa do contraste; «outro» torna essa relação clara em português, e «amaldiçoa» traduz diretamente καταρώμενος.
- source_word: τίνος φωνῆς
  choice: a voz de qual deles
  rationale: Preserva o valor genitivo e pessoal de τίνος («de quem»), explicitando apenas que a pergunta se refere aos dois indivíduos já mencionados.
- source_word: εἰσακούσεται
  choice: ouvirá
  rationale: No contexto de oração, o verbo pode implicar atender ou dar ouvidos; «ouvirá» mantém a formulação concisa e a tensão do original sem acrescentar o resultado.
- source_word: ὁ δεσπότης
  choice: o Senhor
  rationale: «Senhor» é o equivalente português natural e reverente para δεσπότης neste contexto; evita a conotação moderna inadequada de «mestre» e conserva a ideia de autoridade soberana.
theological_decisions:
- issue: Se δεσπότης deve ser vertido como título divino ou como termo genérico de autoridade
  choice: o Senhor
  alternative: o Soberano / o Mestre
  rationale: O artigo e o contexto religioso apontam para Deus. «O Senhor» comunica isso naturalmente, sem introduzir um nome divino ausente do grego.
- issue: Se εἰσακούσεται deve explicitar resposta ou acolhimento favorável
  choice: ouvirá
  alternative: atenderá / dará ouvidos a
  rationale: A tradução mais simples preserva a pergunta retórica e não resolve além do texto se ouvir implica necessariamente conceder o pedido.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A estrutura paralela e a pergunta retórica do grego foram preservadas; o ponto e vírgula evita um travessão editorial não exigido pelo texto.
