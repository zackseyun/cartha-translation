  text: Wine drunk in excess is bitterness of soul[a], in provocation and downfall.
translation:
  language: pt
  text: O vinho bebido em excesso é amargura para a alma[a], com irritação e tropeço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é amargura da alma, em provocação e tropeço”. Os dois substantivos finais são concisos e podem também sugerir agitação conflituosa e queda ou ruína.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πικρία
  choice: amargura
  rationale: Preserva a imagem e a amplitude do substantivo grego sem restringi-lo a tristeza, ressentimento ou sofrimento moral.
- source_word: ψυχῆς
  choice: para a alma
  rationale: Em português, «amargura para a alma» expressa de modo natural o efeito sobre a vida interior da pessoa; a nota registra a possibilidade formal «da alma».
- source_word: οἶνος
  choice: O vinho
  rationale: Traduz literalmente a referência específica ao vinho, sem generalizá-la para toda bebida alcoólica.
- source_word: πινόμενος πολὺς
  choice: bebido em excesso
  rationale: Comunica naturalmente que a advertência se refere ao consumo em grande quantidade, e não ao vinho em si.
- source_word: ἐν ἐρεθισμῷ
  choice: com irritação
  rationale: O substantivo pode indicar irritação, exasperação ou provocação; «irritação» é claro e mantém aberta a ideia de agitação conflituosa.
- source_word: ἀντιπτώματι
  choice: queda
  rationale: Conserva a imagem de tropeço ou colapso e permite tanto uma queda concreta quanto uma consequência ruinosa.
