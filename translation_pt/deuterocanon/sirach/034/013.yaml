translation:
  language: pt
  text: Ele não favorece o pobre[a] e ouve a súplica do oprimido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego traz: “O espírito dos que temem o Senhor viverá, pois a esperança deles está naquele que os salva.” Aqui, o grego reflete uma forma textual substancialmente diferente do hebraico preservado.'
    reason: textual_variant
lexical_decisions:
- source_word: לא ישא פנים אל דל
  choice: não favorece o pobre
  rationale: A expressão idiomática נשא פנים significa mostrar favor ou parcialidade. A tradução mantém a direção indicada por אל sem acrescentar “contra”, que não está explícito no hebraico, e preserva a tensão entre não favorecer parcialmente o pobre e ouvir o oprimido.
- source_word: דל
  choice: o pobre
  rationale: דל pode designar o pobre, fraco ou socialmente vulnerável; “o pobre” é a opção mais direta neste contexto.
- source_word: ותחנוני
  choice: mas ... a súplica
  rationale: תחנונים denota pedidos insistentes de misericórdia ou socorro. “Súplica” conserva o tom urgente. A conjunção ו foi vertida como “mas” para expressar naturalmente o contraste entre os dois membros sem alterar seu conteúdo.
- source_word: מצוק
  choice: do oprimido
  rationale: מצוק descreve quem está sob pressão, aflição ou opressão. “Oprimido” se ajusta ao contexto social e permanece dentro do campo semântico.
- source_word: ישמע
  choice: ouve
  rationale: O yiqtol tem valor habitual ou geral nesta máxima sapiencial; o presente “ouve” comunica esse sentido com naturalidade.
- source_word: πνεῦμα φοβουμένων Κύριον ζήσεται
  choice: não adotado no texto principal
  rationale: O grego preserva uma forma textual substancialmente diferente. Como o hebraico está disponível neste ponto, ele fundamenta o texto principal, enquanto a leitura grega é registrada em nota.
theological_decisions:
- issue: Divergência entre os testemunhos hebraico e grego
  choice: Seguir o hebraico da Geniza do Cairo no texto principal e registrar o grego em nota de variante textual.
  alternative: “O espírito dos que temem o Senhor viverá, pois a esperança deles está naquele que os salva.”
  rationale: A leitura grega não é uma simples diferença de formulação, mas representa uma forma textual substancialmente distinta. A prioridade dada ao hebraico preservado exige que ele governe o texto principal, sem ocultar o importante testemunho grego.
- issue: Possível tensão entre não favorecer o pobre e ouvir o oprimido
  choice: 'Preservar a tensão do hebraico: Deus não age com parcialidade nem mesmo em favor do pobre, mas ouve o clamor do oprimido.'
  alternative: “Ele não mostra parcialidade contra o pobre”
  rationale: Acrescentar “contra” resolveria interpretativamente a tensão, porém essa direção adversa não está expressa de modo inequívoco no hebraico. “Não favorece o pobre” reproduz com maior transparência o idioma e sua construção com אל.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Favorece” comunica o idioma judicial de parcialidade sem recorrer a formulações arcaicas; “súplica” mantém o tom solene e acessível.
