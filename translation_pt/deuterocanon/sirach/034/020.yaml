base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/020.yaml
  text: The kindness of Yahweh is fitting in a time of distress[a], like a rain cloud in a time of drought.
translation:
  language: pt
  text: Bela é a bondade de Yahweh em tempo de angústia, como nuvem de chuva em tempo de seca.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “O Altíssimo não se agrada das ofertas dos ímpios, nem uma multidão de sacrifícios obtém expiação pelos pecados.” Os testemunhos hebraico e grego diferem substancialmente neste versículo.'
    reason: textual_variant
lexical_decisions:
- source_word: נאה
  choice: Bela é
  rationale: Preserva o sentido de algo belo, agradável ou apropriado sem reduzir a ambiguidade do adjetivo hebraico; a construção poética é natural e digna em português.
- source_word: חסד
  choice: bondade
  rationale: Expressa o favor benevolente que traz alívio na necessidade, sem impor aqui uma conotação exclusivamente pactual nem restringir o termo a compaixão.
- source_word: יהוה
  choice: Yahweh
  rationale: Translitera o nome divino presente no texto hebraico, em consonância com a camada inglesa fornecida e sem substituí-lo por um título.
- source_word: בזמן מצוקה
  choice: em tempo de angústia
  rationale: Comunica de modo corrente a pressão, aflição ou dificuldade indicada pela expressão hebraica.
- source_word: כעב חזיזים
  choice: como nuvem de chuva
  rationale: Torna explícita a função benéfica da nuvem no paralelo com a seca, preservando a imagem meteorológica sem acrescentar a ideia ameaçadora de tempestade.
- source_word: בעת בצרת
  choice: em tempo de seca
  rationale: Traduz de forma clara a condição de aridez evocada pelo hebraico e mantém o contraste agrícola com a nuvem de chuva.
theological_decisions:
- issue: Escolha do texto-base diante da grande divergência entre os testemunhos hebraico e grego
  choice: Traduzir no texto principal o hebraico preservado e registrar em nota a leitura grega substancialmente diferente.
  alternative: “O Altíssimo não se agrada das ofertas dos ímpios, nem é aplacado pelos pecados com uma multidão de sacrifícios.”
  rationale: O testemunho hebraico está preservado com alta confiança e, por isso, rege o texto principal; a divergência integral do grego é relevante para a história textual e não deve ser ocultada.
translation_notes:
  register: Português moderno, claro e levemente poético. A inversão “Bela é” conserva a força sapiencial do hebraico; “nuvem de chuva” evidencia o alívio oportuno em meio à seca.
