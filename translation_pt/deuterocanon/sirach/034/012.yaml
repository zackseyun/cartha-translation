  text: For he is a God of justice[a], and with him there is no partiality.
translation:
  language: pt
  text: Pois ele é Deus de justiça[a], e com ele não há parcialidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego fornecido por Swete traz neste versículo uma frase diferente: “Muitas vezes estive em perigo de morte e fui salvo por causa dessas coisas”. Isso indica uma divergência textual ou de numeração dos versículos neste ponto. A tradução segue aqui o testemunho hebraico preservado.'
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: Pois
  rationale: Introduz a razão da proibição precedente e conserva de modo natural o valor causal do hebraico.
- source_word: אלהי משפט
  choice: Deus de justiça
  rationale: Mantém a construção hebraica e apresenta a justiça como característica do agir judicial de Deus, sem reduzir משפט apenas ao ato de julgar.
- source_word: אין עמו
  choice: com ele não há
  rationale: Reproduz com clareza a expressão hebraica que indica aquilo que não se encontra junto de Deus nem caracteriza sua conduta.
- source_word: משוא פנים
  choice: parcialidade
  rationale: Equivalente corrente do idioma hebraico que designa favorecimento baseado na condição ou identidade da pessoa, especialmente em contexto judicial.
theological_decisions:
- issue: Sentido de משפט na descrição do caráter de Deus
  choice: justiça
  alternative: julgamento
  rationale: O contexto fundamenta a rejeição do suborno e de ofertas provenientes da opressão no caráter justo de Deus. “Justiça” preserva melhor essa dimensão moral e judicial.
- issue: Divergência entre o testemunho hebraico e o paralelo grego fornecido
  choice: seguir o testemunho hebraico sobrevivente e registrar a divergência em nota
  alternative: traduzir a frase grega ou harmonizar os dois textos
  rationale: O hebraico está disponível e é a fonte principal neste ponto; o grego fornecido contém uma frase inteiramente diferente, de modo que a incerteza textual deve ser exposta, não harmonizada silenciosamente.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a ligação causal e o paralelismo conciso do hebraico.
