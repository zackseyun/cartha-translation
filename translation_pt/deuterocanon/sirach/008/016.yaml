translation:
  language: pt
  text: Não empreste a um homem mais poderoso que você; e, se emprestar[a], considere o empréstimo perdido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego traz aqui uma advertência diferente: “Não entre em luta com um homem irascível, nem atravesse o deserto com ele [...] onde não houver socorro, ele derrubará você”. O hebraico preservado, porém, adverte contra emprestar a alguém mais poderoso que você.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תַּלְוֶה
  choice: Não empreste
  rationale: Expressa de modo direto e natural a proibição hebraica; o hifil de לוה indica emprestar ou conceder um empréstimo.
- source_word: אִישׁ חָזָק מִמְּךָ
  choice: a um homem mais poderoso que você
  rationale: Mantém o masculino singular de אִישׁ e a comparação marcada por מִמְּךָ. Neste contexto financeiro, “mais poderoso” comunica melhor que a dificuldade de cobrança pode decorrer da superioridade social ou material, sem limitar חָזָק à força física.
- source_word: וְאִם הִלְוִיתָ
  choice: e, se emprestar
  rationale: Reproduz a condição prática que sucede à proibição, em português corrente e conciso.
- source_word: כִּמְאַבֵּד
  choice: considere o empréstimo perdido
  rationale: A expressão hebraica é elíptica e introduz uma comparação; explicitar “o empréstimo” torna claro o objeto implícito sem alterar o sentido.
theological_decisions:
- issue: Formulação masculina de אִישׁ na instrução sapiencial
  choice: um homem mais poderoso que você
  alternative: alguém mais poderoso que você
  rationale: O hebraico emprega explicitamente o substantivo masculino singular אִישׁ; a tradução o preserva, sem transformar a máxima em uma afirmação doutrinária sobre gênero.
- issue: Divergência substancial entre o hebraico e o testemunho grego
  choice: Traduzir no texto principal a advertência hebraica sobre empréstimo
  alternative: Adotar a advertência grega contra brigar e viajar pelo deserto com um homem irascível
  rationale: O texto hebraico sobrevivente é a fonte primária fornecida e apresenta sentido coerente. Como o grego contém uma máxima diferente, as leituras não devem ser harmonizadas; a variante é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Mais poderoso” preserva a amplitude contextual de חָזָק, e “considere o empréstimo perdido” resolve naturalmente a elipse hebraica. O marcador [a] aparece no texto principal.
