translation:
  language: pt
  text: Não entre em disputa com um juiz[a], pois ele julgará segundo a própria vontade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz aqui um dito diferente: “Diante de um estranho, não faça nada em segredo, pois você não sabe o que isso produzirá.” O texto principal segue o testemunho hebraico da Genizá do Cairo, preservado neste versículo; a divergência, porém, é substancial.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תּשָּׁפֵט
  choice: Não entre em disputa
  rationale: A proibição hebraica é concisa. Embora שפט normalmente se relacione a julgar, com עִם שׁוֹפֵט indica aqui uma contenda de caráter judicial; a formulação evita a repetição pouco natural de 'julgar com um juiz'.
- source_word: עִם שׁוֹפֵט
  choice: com um juiz
  rationale: Preserva a preposição hebraica e, com 'entrar em disputa', comunica naturalmente o sentido adversarial.
- source_word: כִּי
  choice: pois
  rationale: Introduz de modo conciso a razão da advertência, em registro próprio da literatura sapiencial.
- source_word: כִּרְצוֹנוֹ
  choice: segundo a própria vontade
  rationale: רָצוֹן denota vontade, desejo ou beneplácito; esta opção preserva a advertência de que a decisão seguirá a vontade do próprio juiz, sem ampliar o sentido.
- source_word: יִשְׁפֹּט
  choice: ele julgará
  rationale: Mantém explícito o quadro judicial e traduz diretamente o verbo שפט.
