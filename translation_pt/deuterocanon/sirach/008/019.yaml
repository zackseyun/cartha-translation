  text: Do not go with a cruel man[a], lest you add weight to your own trouble.
translation:
  language: pt
  text: Não ande com um homem cruel[a], para não tornar mais pesada a sua própria desgraça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Não revele seu coração a qualquer pessoa, nem permita que ela lhe retribua com um favor.” Os testemunhos hebraico e grego diferem substancialmente neste ponto.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם אַכְזָרִי
  choice: com um homem cruel
  rationale: אַכְזָרִי designa uma pessoa cruel ou impiedosa. O masculino singular foi mantido como “homem”, e אִם é entendido aqui no sentido contextual de companhia, conforme o testemunho hebraico apresentado.
- source_word: אַל תֵּלֵךְ
  choice: Não ande
  rationale: הלך significa literalmente “andar/ir”. “Não ande com” é natural em português e também sugere acompanhar ou manter convivência, sem explicitar além do hebraico.
- source_word: פֶּן
  choice: para não
  rationale: פֶּן introduz a consequência indesejada que fundamenta a advertência. “Para não” transmite essa força de maneira clara e corrente.
- source_word: תַּכְבִּיד
  choice: tornar mais pesada
  rationale: O hifil de כבד expressa fazer ficar pesado ou agravar. A formulação conserva a imagem hebraica do peso e permanece compreensível em português.
- source_word: אֶת רָעָתֶךָ
  choice: a sua própria desgraça
  rationale: רָעָה pode indicar mal, dano, calamidade ou desgraça. Neste contexto de consequência prejudicial, “desgraça” preserva a amplitude negativa sem reduzi-la apenas a culpa moral; “própria” torna explícito o sufixo de segunda pessoa.
theological_decisions:
- issue: Divergência substancial entre o hebraico preservado e o paralelo grego de Sirácida 8:19
  choice: Seguir o testemunho hebraico no texto principal e registrar o grego em nota.
  alternative: 'Seguir o grego: “Não revele seu coração a qualquer pessoa, nem permita que ela lhe retribua com um favor.”'
  rationale: Como há texto hebraico preservado com alta confiança, ele serve de base ao texto principal. O grego apresenta uma leitura materialmente diferente, possivelmente decorrente de outro texto-base ou de desenvolvimento textual, por isso é preservado com transparência na nota, sem harmonização.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Não ande com” mantém a concretude do hebraico e seu sentido sapiencial de companhia; “tornar mais pesada” conserva deliberadamente a metáfora de peso.
