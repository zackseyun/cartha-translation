translation:
  language: pt
  text: Não prospere na herança de um perverso[a], para que não seja queimado pelas faíscas do fogo dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego (Swete/LXX) traz aqui um dito diferente: “Não litigue com um juiz, pois julgarão a favor dele segundo sua posição.” O texto hebraico da Genizá do Cairo adverte, em vez disso, contra prosperar na herança de um perverso.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּצְלַח
  choice: Não prospere
  rationale: Preserva a força incomum do hebraico צלח, que normalmente significa ter êxito ou prosperar, sem transformar a advertência em uma paráfrase mais específica.
- source_word: בְּנַחֲלַת
  choice: na herança de
  rationale: נחלה designa herança, patrimônio ou propriedade hereditária. A formulação direta mantém a imagem socioeconômica concreta e a preposição בְּ indica envolvimento nessa esfera.
- source_word: רָשָׁע
  choice: um perverso
  rationale: Representa o substantivo masculino singular como um indivíduo exemplarmente mau; “perverso” é corrente, digno e natural em literatura sapiencial.
- source_word: פֶּן תְּבֹעַר
  choice: para que você não seja queimado
  rationale: Expressa a consequência temida introduzida por פן e o sentido passivo de ser incendiado ou consumido, mantendo a imagem vívida.
- source_word: בִּשְׁבִיב
  choice: pelas faíscas de
  rationale: שביב pode indicar faísca, chama ou clarão; “faíscas” comunica que até as manifestações secundárias do perigo podem causar dano.
- source_word: אִשּׁוֹ
  choice: do fogo dele
  rationale: O sufixo masculino singular remete ao perverso. “Dele” evita a possível rigidez de “seu fogo” e deixa clara a referência em português moderno.
theological_decisions:
- issue: Divergência substancial entre os testemunhos hebraico e grego
  choice: Traduzir o dito preservado no hebraico da Genizá como texto principal.
  alternative: 'O grego traz: “Não litigue com um juiz, pois julgarão a favor dele segundo a posição dele.”'
  rationale: Como há testemunho hebraico de Sirácida neste ponto, ele recebe primazia. O grego preserva um dito diferente e não deve ser harmonizado silenciosamente com o hebraico; a divergência é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a estranheza significativa de “prosperar na herança” e a metáfora concreta do fogo, sem explicar além do que diz o hebraico.
