translation:
  language: pt
  text: Não entre em disputa com um homem poderoso, para não cair nas mãos dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente, o hebraico diz: “por que você seria posto na mão dele?”. O paralelo grego apoia o sentido mais fluente: “para que não caia nas mãos dele”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תָּרִיב
  choice: Não discuta
  rationale: O verbo ריב abrange contender, entrar em conflito ou litigar. “Não discuta” é corrente e natural em português, sem reduzir a advertência a uma simples divergência de opinião.
- source_word: עִם אִישׁ גָּדוֹל
  choice: com um homem poderoso
  rationale: Embora גָּדוֹל signifique literalmente “grande”, neste contexto sapiencial indica alguém de elevada posição ou poder, sentido confirmado pelo grego δυνάστου. “Homem poderoso” evita sugerir grandeza moral ou física.
- source_word: לָמָּה תִשּׁוֹם עַל יָדוֹ
  choice: para não cair nas mãos dele
  rationale: O hebraico transmitido é incomum e, mais literalmente, pergunta por que alguém seria posto na mão do poderoso. O paralelo grego apresenta claramente uma advertência de consequência. A expressão idiomática portuguesa comunica esse sentido sem ocultar a dificuldade textual, registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial natural. “Nas mãos dele” preserva o idioma de ficar sujeito ao poder de alguém; a nota mantém visível a forma singular e incomum do hebraico.
