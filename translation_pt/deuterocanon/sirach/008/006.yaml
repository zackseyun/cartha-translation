translation:
  language: pt
  text: Não se acostume à companhia de um homem insensato[a], para que ele não despreze os nobres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Não desonre um homem na sua velhice, pois também alguns de nós estão envelhecendo.” Neste versículo, o grego difere substancialmente do hebraico preservado.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל
  choice: Não
  rationale: Introduz de modo natural e direto a proibição hebraica.
- source_word: תְּרַגִּיל
  choice: se acostume à companhia de
  rationale: Expressa a ideia de tornar habitual ou manter convivência familiar; a explicitação de “à companhia de” produz português natural sem reduzir a advertência a um encontro ocasional.
- source_word: אִישׁ אֱוִיל
  choice: um homem insensato
  rationale: Mantém o singular masculino do hebraico e o sentido moral próprio da literatura sapiencial, sem recorrer ao tom mais insultuoso de “estúpido”.
- source_word: פֶּן
  choice: para que ... não
  rationale: Forma corrente e digna de introduzir a consequência negativa temida.
- source_word: יָבוּז
  choice: ele não despreze
  rationale: Traduz diretamente a ação de tratar com desprezo ou desdém.
- source_word: לִנְדִיבִים
  choice: os nobres
  rationale: נדיבים pode designar pessoas nobres ou de posição elevada, embora também possa ter a nuance de generosidade; “os nobres” preserva melhor a provável dimensão social do termo neste contexto.
theological_decisions:
- issue: Divergência substancial entre o hebraico preservado e o paralelo grego
  choice: Traduzir o hebraico como testemunho principal e registrar o grego em nota.
  alternative: “Não desonre um homem na sua velhice, pois também alguns de nós estão envelhecendo.”
  rationale: Como o texto hebraico sobrevive neste versículo, ele serve de base; a leitura grega, porém, apresenta conteúdo inteiramente diferente e deve permanecer visível para não ocultar a variação textual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Insensato” conserva o registro sapiencial; “se acostume à companhia de” comunica de modo idiomático a ideia de convivência tornada habitual.
