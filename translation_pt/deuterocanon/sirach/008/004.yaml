base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/004.yaml
  text: For many has gold ruined[b][a], and it leads astray the heart of nobles.
translation:
  language: pt
  text: Pois o ouro arruinou muitos[a] e desvia o coração dos nobres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego apresenta aqui uma leitura substancialmente diferente: “Não zombe de uma pessoa sem instrução, para que os seus antepassados não sejam desonrados.”'
    reason: alternative_reading
  - marker: b
    text: Ou “das pessoas generosas”; o termo hebraico pode designar nobres, príncipes ou pessoas generosas.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: muitos
  rationale: O termo substantivado designa claramente um grande número de pessoas; “muitos” é conciso e natural em português.
- source_word: הִפְחִיז
  choice: arruinou
  rationale: O verbo é raro e difícil, podendo indicar tornar imprudente, desestabilizar ou levar a um comportamento desastroso. No paralelismo com “desvia”, “arruinou” comunica com naturalidade o resultado moral destrutivo sem impor uma precisão inexistente.
- source_word: זָהָב
  choice: ouro
  rationale: Equivalente direto e natural do substantivo hebraico.
- source_word: יַשְׂגֶּה
  choice: desvia
  rationale: O verbo expressa fazer errar ou desencaminhar. “Desvia” preserva o sentido moral e a forma verbal no presente/futuro do hebraico.
- source_word: לֵב
  choice: coração
  rationale: Na antropologia hebraica, o coração é o centro do pensamento, da vontade e dos desejos. A tradução mantém a imagem da fonte.
- source_word: נְדִיבִים
  choice: nobres
  rationale: O termo pode designar nobres ou príncipes, mas também pessoas generosas. No contexto de ouro e condição social, “nobres” é a opção principal mais provável; a outra nuance é preservada em nota.
theological_decisions:
- issue: Uso do hebraico diante da leitura grega divergente
  choice: Adotar no texto principal o hebraico preservado, que adverte sobre o poder corruptor do ouro.
  alternative: 'O grego diz: “Não zombe de uma pessoa sem instrução, para que os seus antepassados não sejam desonrados.”'
  rationale: O hebraico existente tem prioridade como texto-fonte de Sirácida. Como o grego apresenta uma linha substancialmente diferente, e não uma simples variante de redação, sua leitura é registrada em nota para transparência.
translation_notes:
  register: Português moderno, claro e digno, com construção concisa própria da literatura sapiencial. Conserva-se “coração” como imagem hebraica, e a difícil força do primeiro verbo é expressa de modo idiomático por “arruinou”.
