base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/009.yaml
  text: Do not boast over one who is dying[b][a]; remember that all of us are being gathered.
translation:
  language: pt
  text: Não triunfe sobre quem está morrendo[a]; lembre-se de que todos nós estamos sendo recolhidos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tradição grega de Sirácida 8:9 diverge consideravelmente neste ponto e, em vez disso, fala de aprender com o discurso dos anciãos. Aqui se segue como texto principal o testemunho hebraico da Geniza do Cairo.
    reason: textual_variant
  - marker: b
    text: 'Hebraico: “estamos sendo recolhidos”, metáfora tradicional da morte; também se pode entender: “todos nós morreremos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתְהַלֵּל
  choice: Não triunfe
  rationale: O hitpael de הלל pode expressar vanglória ou exultação. Com עַל e uma pessoa que está morrendo, o sentido contextual é o de triunfar ou exultar sobre a desgraça alheia. “Não triunfe” é natural em português e conserva essa ideia sem sugerir simples alegria.
- source_word: עַל גֹּוֵעַ
  choice: sobre quem está morrendo
  rationale: עַל apresenta a pessoa como alvo da atitude condenada, e o particípio גֹּוֵעַ indica alguém no processo de morrer, não alguém já morto.
- source_word: זְכֹר
  choice: lembre-se
  rationale: Equivale diretamente ao imperativo hebraico e soa natural na exortação dirigida a uma pessoa.
- source_word: כֻּלָּנוּ
  choice: todos nós
  rationale: Preserva a inclusão pessoal e explícita do hebraico.
- source_word: נֶאֱסָפִים
  choice: estamos sendo recolhidos
  rationale: O particípio nifal de אסף mantém a metáfora tradicional da morte como recolhimento. A forma progressiva preserva, tanto quanto possível, o aspecto participial sem acrescentar um destino não expresso no texto.
theological_decisions:
- issue: Metáfora da morte em נֶאֱסָפִים
  choice: Manter a imagem com “estamos sendo recolhidos”.
  alternative: “todos nós morreremos” ou “todos nós seremos reunidos ao nosso povo”
  rationale: A primeira alternativa desfaz a metáfora; a segunda introduz um destino que o versículo não menciona. A redação escolhida conserva a imagem e sua abertura teológica.
- issue: Sentido de תִּתְהַלֵּל no contexto da morte alheia
  choice: Traduzir como “triunfe”, indicando exultação ou vanglória sobre outra pessoa.
  alternative: “se vanglorie” ou “exulte”
  rationale: “Triunfar sobre alguém” comunica com naturalidade a relação marcada por עַל e evita resolver o verbo apenas como alegria ou apenas como autoelogio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Triunfe sobre” evita a construção pouco natural “vanglorie-se sobre” e comunica a exultação hostil sugerida pelo contexto. “Recolhidos” preserva deliberadamente a metáfora hebraica, esclarecida em nota.
