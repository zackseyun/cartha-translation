  text: Do not move aside before a scoffer[a], lest he seat him as one lying in wait before you.
translation:
  language: pt
  text: Não recue diante de um zombador[a], para que ele não o coloque diante de você como quem fica à espreita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O segundo segmento do hebraico é difícil. Mais literalmente: “para que ele o faça sentar-se, como alguém que fica à espreita, diante de você”. A referência dos pronomes e a construção exata são incertas. O texto grego traz uma advertência mais ampla sobre um homem temerário e obstinado que pode agir contra você.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תָּזוּחַ
  choice: Não recue
  rationale: O verbo transmite a ideia de afastar-se ou ceder terreno. “Não recue” conserva a imagem espacial e expressa a advertência em português natural.
- source_word: מִפְּנֵי
  choice: diante de
  rationale: Mantém o sentido relacional e espacial de estar perante alguém, sem transformar a expressão em uma indicação meramente causal.
- source_word: לֵץ
  choice: zombador
  rationale: Na literatura sapiencial, designa alguém que trata os outros e a sabedoria com desprezo e escárnio; “zombador” é claro e preserva o tom moral.
- source_word: לְהוֹשִׁיבוֹ
  choice: para não colocá-lo
  rationale: O hifil de ישׁב com sufixo pronominal tem o sentido básico de fazer alguém sentar-se, estabelecer ou colocar. “Colocá-lo” preserva o pronome-objeto e produz uma frase compreensível sem resolver plenamente a dificuldade sintática.
- source_word: כְּאוֹרֵב
  choice: como quem está de emboscada
  rationale: אֹרֵב é aquele que fica à espreita para atacar. A expressão escolhida conserva a imagem de hostilidade oculta em português corrente.
- source_word: לְפָנֶיךָ
  choice: diante de você
  rationale: É a correspondência direta do hebraico e mantém a repetição espacial do versículo; a ideia hostil decorre da imagem da emboscada.
theological_decisions:
- issue: Uso do texto hebraico primário apesar da dificuldade do segundo segmento
  choice: Traduzir conservadoramente o hebraico, preservando o pronome-objeto e a imagem da emboscada.
  alternative: 'Seguir o grego: “Não ande pelo caminho com um homem temerário, para que ele não pese contra você”.'
  rationale: Como o hebraico está preservado, ele deve reger o texto principal. O grego confirma uma advertência contra uma pessoa perigosa e obstinada, mas representa uma formulação muito diferente e não deve substituir silenciosamente a leitura hebraica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Você” evita a ambiguidade regional de “tu” e mantém o singular do hebraico. A formulação principal conserva a imagem espacial e a dificuldade essencial do texto, enquanto a nota registra tanto a tradução mais literal quanto o paralelo grego.
