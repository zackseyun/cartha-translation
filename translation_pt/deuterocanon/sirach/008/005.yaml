base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/005.yaml
  text: Do not quarrel with a man of tongue[b][a], and do not put wood on the fire.
translation:
  language: pt
  text: Não entre em conflito com uma pessoa de língua afiada[b], nem ponha lenha na fogueira.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego traz uma forma diferente do versículo: “Não repreendas um homem que se afasta do pecado; lembra-te de que todos estamos sujeitos a castigo.” O hebraico preservado aqui adverte, em vez disso, contra discutir com alguém de fala perigosa e contra alimentar o conflito.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “um homem de língua”, expressão hebraica para alguém caracterizado por uma fala nociva ou provocadora.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּינָץ
  choice: Não entre em conflito
  rationale: A partícula אַל introduz uma proibição, e o verbo תִּינָץ indica envolver-se em contenda ou disputa. “Entrar em conflito” comunica o sentido com naturalidade e dignidade em português atual.
- source_word: אִישׁ לָשׁוֹן
  choice: uma pessoa de língua afiada
  rationale: Literalmente, “um homem de língua”, expressão hebraica que caracteriza alguém cuja fala é nociva ou provocadora. “Pessoa de língua afiada” conserva a imagem da língua e torna o sentido idiomático claro, sem restringi-lo desnecessariamente ao sexo masculino.
- source_word: וְאַל תִּתֵּן
  choice: nem ponha
  rationale: A conjunção liga uma segunda proibição à primeira. Neste contexto, o verbo comum “dar/pôr” significa colocar ou acrescentar; “nem ponha” é direto e natural.
- source_word: עַל אֵשׁ עֵץ
  choice: lenha na fogueira
  rationale: O hebraico diz concretamente “madeira sobre o fogo”. A expressão portuguesa “pôr lenha na fogueira” preserva a imagem proverbial e comunica com clareza a ideia de intensificar o conflito.
theological_decisions:
- issue: Divergência substancial entre os testemunhos hebraico e grego
  choice: Traduzir no texto principal o hebraico preservado, que adverte contra a contenda com uma pessoa de fala perigosa e contra o agravamento do conflito.
  alternative: 'O grego diz: “Não repreendas um homem que se afasta do pecado; lembra-te de que todos estamos sujeitos a repreensões.”'
  rationale: Onde o texto hebraico de Sirácida está preservado com segurança, ele recebe primazia. Aqui, seus dois membros formam um provérbio coerente, pois a imagem de acrescentar lenha ao fogo reforça a advertência contra alimentar uma disputa. Como o grego representa uma forma materialmente diferente do versículo, sua leitura é registrada em nota, sem ser harmonizada com o hebraico.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A expressão proverbial “pôr lenha na fogueira” mantém a imagem concreta do hebraico e soa natural. “Pessoa” verte אִישׁ de modo inclusivo neste enunciado sapiencial geral, enquanto a nota conserva a forma literal do idioma hebraico.
