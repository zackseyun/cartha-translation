  text: For from him you will gain understanding[a], at a time of need to answer a saying.
translation:
  language: pt
  text: Pois dele você obterá entendimento[a] em um momento de necessidade, para responder a um dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz uma leitura substancialmente diferente: “Não seja fiador além de suas posses; e, se for fiador, preocupe-se como quem terá de pagar.” A tradução principal segue o texto hebraico da Guenizá do Cairo, preservado neste versículo, mas a divergência é significativa.'
    reason: textual_variant
lexical_decisions:
- source_word: מִמֶּנּוּ
  choice: dele
  rationale: A preposição מִן com sufixo masculino singular indica naturalmente “dele”, remetendo à pessoa mencionada no contexto.
- source_word: תִּקַּח
  choice: você obterá
  rationale: Embora o sentido básico seja “tomar”, aqui o verbo descreve a aquisição de entendimento; “obterá” preserva esse sentido em português natural.
- source_word: שֶׂכֶל
  choice: entendimento
  rationale: O termo designa discernimento ou bom senso prático no contexto sapiencial. “Entendimento” é claro, digno e suficientemente amplo.
- source_word: בְּעֵת צֹרֶךְ
  choice: quando for necessário
  rationale: Expressa a ocasião de necessidade de modo natural, mantendo tanto a dimensão temporal quanto a ideia de necessidade.
- source_word: לְהַשִׁיב
  choice: responder
  rationale: Com פִּתְגָּם, o infinitivo indica dar uma resposta ou réplica.
- source_word: פִּתְגָּם
  choice: uma palavra
  rationale: O substantivo pode significar palavra, declaração, pronunciamento ou máxima. “Uma palavra” conserva sua amplitude sem especificá-lo indevidamente como provérbio.
