base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/011.yaml
  text: Do not despise even his ordinary conversation[a], for from him you will learn instruction for standing before rulers.
translation:
  language: pt
  text: Não despreze nem mesmo a conversa cotidiana dele[a], pois dele você aprenderá instrução para se apresentar diante de governantes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Não se levante da presença de um homem insolente, para que ele não fique à espreita contra a sua boca.” Aqui, a tradição grega difere substancialmente do hebraico preservado.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂיחוֹת חוֹל
  choice: conversa cotidiana
  rationale: A expressão designa fala comum, do dia a dia, em contraste com um discurso elevado ou formal; “cotidiana” evita sugerir linguagem profana ou moralmente imprópria.
- source_word: תִבְזֶה
  choice: não despreze
  rationale: O verbo expressa tratar com desprezo ou considerar sem valor; “não despreze” é direto, natural e preserva a força do hebraico.
- source_word: לְהִתְיַצֵּב לִפְנֵי שָׂרִים
  choice: como se portar diante de governantes
  rationale: 'A formulação comunica o resultado prático do aprendizado: saber apresentar-se e agir na presença de autoridades. “Governantes” representa שָׂרִים de modo amplo e atual.'
- source_word: לֶקַח
  choice: aprenderá
  rationale: לֶקַח denota ensinamento ou instrução recebida. Em português, integrá-lo ao verbo “aprenderá” produz uma frase natural sem perder a ideia didática.
- source_word: מִמֶּנּוּ
  choice: com ele
  rationale: O hebraico indica que essa pessoa é a fonte do aprendizado. “Com ele” é idiomático em português e mantém a referência masculina singular, embora “dele” fosse uma alternativa mais formal.
theological_decisions:
- issue: Uso do testemunho hebraico em contraste com o paralelo grego divergente
  choice: Seguir o hebraico preservado no texto principal e registrar o grego em nota.
  alternative: 'Seguir o grego: “Não se levante da presença de um homem insolente, para que ele não fique à espreita contra a sua boca.”'
  rationale: Como o texto hebraico está preservado e possui alta confiança, ele tem prioridade. A tradição grega difere substancialmente e não deve ser harmonizada silenciosamente, mas conservada como leitura alternativa em nota.
translation_notes:
  register: Português moderno, digno e acessível, com imperativo de tratamento por “você”. “Conversa cotidiana” é mais natural do que “conversas seculares”, e “como se portar” explicita com moderação o sentido prático da expressão hebraica referente a apresentar-se diante de autoridades.
