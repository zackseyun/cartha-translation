translation:
  language: pt
  text: Não despreze ouvir aqueles que voltam[b], os quais ouviram de seus pais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tradição grega diz: “Não empreste a um homem mais forte do que você; e, se emprestar, considere-o perdido.” Isso parece refletir uma tradição textual diferente para este versículo.'
    reason: textual_variant
  - marker: b
    text: Ou “os que se arrependem” ou “os que voltaram”; a palavra hebraica pode designar pessoas que voltam, mas sua nuance exata aqui é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּמְאַס
  choice: Não despreze
  rationale: Expressa de modo natural a proibição direta e preserva a ideia de tratar com desprezo ou desdém.
- source_word: בִּשְׁמִיעַת
  choice: ouvir
  rationale: Mantém o sentido básico de escutar ou dar ouvidos, em uma construção clara no português atual.
- source_word: שָׁבִים
  choice: os que retornam
  rationale: Preserva o sentido lexical amplo de pessoas que voltam, sem decidir se são retornados, repatriados ou arrependidos.
- source_word: אֲשֶׁר שָׁמְעוּ
  choice: os quais ouviram
  rationale: Reproduz a oração relativa hebraica sem convertê-la indevidamente em relação causal.
- source_word: מֵאֲבֹתָם
  choice: de seus pais
  rationale: Traduz literalmente a referência aos pais, que neste contexto pode apontar para a tradição recebida das gerações anteriores.
theological_decisions:
- issue: Divergência integral entre o texto hebraico preservado e a tradição grega de Sirácida 8:12
  choice: Traduzir o texto hebraico preservado no corpo principal.
  alternative: A tradição grega traz uma máxima sobre emprestar a alguém mais forte.
  rationale: Como há testemunho hebraico para o versículo, ele permanece primário. A leitura grega representa outra tradição textual e, por isso, é registrada em nota, sem harmonização.
- issue: Sentido contextual de שָׁבִים
  choice: os que retornam
  alternative: os que se arrependem; os retornados
  rationale: O termo admite mais de uma nuance. A tradução principal conserva sua amplitude sem impor uma interpretação religiosa ou histórica específica.
translation_notes:
  register: Português moderno, digno e direto, com forma de tratamento amplamente compreensível. A sintaxe mantém a oração relativa do hebraico, e as notas preservam tanto a ambiguidade lexical quanto a importante divergência textual grega.
