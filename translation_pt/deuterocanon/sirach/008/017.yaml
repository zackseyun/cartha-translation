base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/008/017.yaml
  text: Do not pledge yourself for one stronger than you; and if you have pledged yourself[a], act as one who must pay.
translation:
  language: pt
  text: Não seja fiador de alguém mais poderoso do que você[a]; e, se você se tornou fiador, aja como quem deve pagar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz de modo conciso “mais do que você” ou “além de você”. Pode referir-se a alguém de maior posição ou força, ou, no contexto da fiança, a algo que excede a sua capacidade. O paralelo grego traz uma leitura diferente: “Não se aconselhe com um insensato, pois ele não será capaz de sustentar uma palavra.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּעֲרֹב
  choice: Não seja fiador
  rationale: O verbo ערב, neste contexto, indica assumir fiança ou responsabilidade pela dívida de outra pessoa. “Ser fiador” é a expressão jurídica e financeira corrente em português.
- source_word: יָתֵר מִמְּךָ
  choice: de alguém cuja obrigação esteja além das suas possibilidades
  rationale: A expressão pode indicar alguém ou algo que excede a capacidade, a posição ou os recursos da pessoa. A formulação explicita o sentido prático da advertência sem limitar toda a amplitude do hebraico, registrada na nota.
- source_word: וְאִם עָרַבְתָּ
  choice: e, se você se tornou fiador
  rationale: Repete o mesmo verbo hebraico da primeira oração; a tradução mantém a mesma ideia de assumir fiança.
- source_word: כִּמְשַׁלֵּם
  choice: aja como quem terá de pagar
  rationale: 'O prefixo כִּי־? aqui, na forma כִּמְשַׁלֵּם, introduz comparação: quem presta fiança deve considerar-se efetivamente responsável pelo pagamento. A expressão portuguesa comunica essa obrigação implícita de modo natural.'
theological_decisions: []
translation_notes:
  register: Português atual, digno e de ampla compreensão, com terminologia financeira comum. A segunda pessoa é expressa por “você”, favorecendo a legibilidade brasileira sem recorrer a regionalismos. A ambiguidade da expressão hebraica יָתֵר מִמְּךָ é preservada em nota.
