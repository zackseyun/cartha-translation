  text: Do not shame an old man[a]; remember that you too will be numbered among the elders.
translation:
  language: pt
  text: Não envergonhe um homem idoso[a]; lembre-se de que você também será contado entre os anciãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tradição grega lê, em vez disso: “Não despreze o discurso dos sábios e ocupe-se com os provérbios deles, pois deles você aprenderá instrução e a servir aos grandes.” O testemunho hebraico preserva aqui uma advertência diferente sobre o respeito aos idosos.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּבַיֵּשׁ
  choice: Não envergonhe
  rationale: 'O piel de בוש tem sentido causativo: fazer alguém passar vergonha ou sofrer desonra. “Não envergonhe” é direto, natural e preserva a força ética da advertência.'
- source_word: אֱנוֹשׁ יָשִׁישׁ
  choice: um homem idoso
  rationale: אֱנוֹשׁ designa um ser humano ou homem, e יָשִׁישׁ especifica idade avançada. A expressão mantém o masculino singular concreto do hebraico e soa respeitosa e corrente em português.
- source_word: זְכֹר
  choice: lembre-se
  rationale: O imperativo de זכר significa regularmente “lembrar”. A forma pronominal é idiomática em português e mantém a ligação exortativa com o futuro do leitor.
- source_word: תִמָּנֶה
  choice: será contado
  rationale: A forma passiva de מנה expressa ser contado ou incluído num grupo. “Será contado” conserva tanto a voz passiva quanto a ideia de futura inclusão.
- source_word: מִזְּקֵנִים
  choice: entre os anciãos
  rationale: A preposição מן pode ter aqui valor partitivo ou associativo, “entre”. זְקֵנִים indica os mais velhos e pode também evocar sua posição social; “anciãos” preserva essa amplitude melhor que uma referência apenas biológica.
theological_decisions:
- issue: Objeto masculino singular e aplicação representativa
  choice: Manter “um homem idoso” e dirigir a exortação ao leitor com “você”.
  alternative: “Não envergonhe uma pessoa idosa; lembre-se de que você também envelhecerá.”
  rationale: O hebraico apresenta um objeto masculino singular concreto. A tradução preserva essa forma sem restringir a aplicabilidade moral da advertência.
- issue: Divergência entre o testemunho hebraico e a tradição grega
  choice: Seguir no texto principal o hebraico preservado, registrando em nota a leitura grega substancialmente diferente.
  alternative: Adotar no texto principal a exortação grega sobre os discursos e provérbios dos sábios.
  rationale: Como o hebraico está disponível e tem alta confiança, ele é a fonte primária. A tradição grega não é apenas uma variante menor, mas apresenta outra admoestação, que deve ser preservada sem harmonização silenciosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Homem idoso” evita o possível tom depreciativo de “homem velho”; “anciãos” mantém a dimensão etária e social do termo hebraico. O marcador [a] aparece no texto principal.
