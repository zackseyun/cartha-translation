  text: Do not quarrel with one harder than you, lest you fall into his hand.
translation:
  language: pt
  text: Não entre em conflito com alguém mais duro do que você, para não cair nas mãos dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תָּרִיב
  choice: Não entre em conflito
  rationale: Expressa naturalmente a proibição de contender ou disputar, sem restringi-la a uma discussão apenas verbal.
- source_word: קָשֶׁה מִמְּךָ
  choice: alguém mais duro do que você
  rationale: Preserva o sentido básico e a ambiguidade de קָשֶׁה, que pode indicar alguém duro, severo, obstinado ou difícil de enfrentar; evita substituí-lo sem necessidade por 'mais forte' ou harmonizá-lo com o grego 'rico'.
- source_word: תִפּוֹל בְּיָדוֹ
  choice: cair nas mãos dele
  rationale: Mantém a imagem idiomática hebraica de ficar sob o poder ou controle do adversário.
theological_decisions:
- issue: Diferença entre o texto hebraico e o paralelo grego
  choice: 'Seguir o hebraico atestado: ''alguém mais duro do que você'''
  alternative: 'Seguir o grego: ''um homem rico'', acompanhado das frases adicionais sobre riqueza e ouro'
  rationale: A fonte hebraica fornecida tem alta confiança e sustenta uma forma breve do versículo. O grego parece refletir uma tradição textual diferente e mais extensa, por isso não foi usado para substituir ou ampliar o texto principal.
translation_notes:
  register: Português moderno, digno e acessível. A formulação conserva deliberadamente a aspereza e a amplitude semântica de 'duro', bem como a metáfora 'cair nas mãos'.
