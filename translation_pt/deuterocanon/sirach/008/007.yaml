  text: Do not shame a man who turns back from transgression[a]; remember that we all are guilty.
translation:
  language: pt
  text: Não envergonhe um homem que abandona a transgressão[a]; lembre-se de que todos nós somos culpados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Não se alegre por causa de um morto; lembre-se de que todos chegamos ao fim.” O testemunho hebraico difere aqui nas duas metades do versículo; por isso, o texto principal segue o hebraico preservado e registra a leitura grega como alternativa.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּכְלִים
  choice: Não envergonhe
  rationale: O hifil de כלם expressa causar vergonha ou desonra. “Não envergonhe” é direto, natural e preserva a força interpessoal.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém o singular masculino explícito do hebraico sem convertê-lo em formulação neutra.
- source_word: שָׁב
  choice: que se afasta
  rationale: O particípio de שוב indica voltar-se ou retornar. Com מִן, aqui comunica afastamento da transgressão sem recorrer ao termo teológico mais técnico “arrepender-se”.
- source_word: מִפֶּשֶׁע
  choice: da transgressão
  rationale: פשע pode indicar transgressão ou rebelião; “transgressão” conserva sua nuance moral e jurídica e se ajusta ao registro sapiencial.
- source_word: זְכֹר
  choice: lembre-se
  rationale: Equivalente direto e idiomático do imperativo hebraico.
- source_word: כִּי כֻּלָּנוּ חַיָּבִים
  choice: de que todos nós somos culpados
  rationale: חַיָּבִים pode significar culpados, sujeitos a condenação ou obrigados. “Somos culpados” é natural em português e preserva o sentido forense, sem substituir o hebraico pela referência explícita à morte encontrada no grego.
theological_decisions:
- issue: Hebraico versus paralelo grego nas duas metades do versículo
  choice: 'Seguir no texto principal o hebraico: “Não envergonhe um homem que se afasta da transgressão; lembre-se de que todos nós somos culpados.”'
  alternative: “Não se alegre por causa de um morto; lembre-se de que todos chegamos ao fim.”
  rationale: O testemunho hebraico preservado é a fonte principal e difere substancialmente do grego. A leitura grega é relevante para a história textual, mas não deve substituir silenciosamente o hebraico; por isso aparece em nota.
- issue: Linguagem de arrependimento
  choice: que se afasta da transgressão
  alternative: que se arrepende do pecado
  rationale: A tradução conserva a imagem verbal de voltar-se para longe da transgressão e evita introduzir um termo teológico mais especializado do que o hebraico exige.
- issue: Sentido de חַיָּבִים
  choice: somos culpados
  alternative: estamos sujeitos à condenação / somos responsáveis
  rationale: A forma hebraica admite uma faixa semântica de culpa, obrigação e sujeição a uma consequência. “Culpados” oferece uma formulação portuguesa clara, mantendo o teor forense e sem harmonização com a mortalidade explícita no grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular masculino e a tensão entre culpa, responsabilidade e mortalidade foram preservados sem harmonização denominacional.
