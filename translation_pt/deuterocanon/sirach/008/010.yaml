translation_notes:
  register: 'Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. «Sábios» mantém a referência coletiva do masculino plural hebraico sem acrescentar uma especificação inexistente. A ordem das notas acompanha a leitura: primeiro a variante textual grega, depois a incerteza lexical no segundo membro.'
