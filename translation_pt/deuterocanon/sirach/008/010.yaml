  text: Do not abandon the discourse of the wise[b][a], and occupy yourself with their riddles.
translation:
  language: pt
  text: Não abandone o discurso dos sábios[a] e ocupe-se com os enigmas deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A versão grega deste versículo traz um texto substancialmente diferente: «Não acenda as brasas de um pecador, para que você não seja queimado pelo fogo da chama dele».'
    reason: textual_variant
  - marker: b
    text: 'Ou: «dedique-se aos enigmas deles». O verbo hebraico é pouco comum aqui, mas indica envolvimento ativo com os ditos difíceis dos sábios.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּטֹּשׁ
  choice: Não abandone
  rationale: O verbo נטש expressa deixar, desamparar ou abandonar; «não abandone» preserva a força da exortação e soa natural em português atual.
- source_word: שִׂיחַת חֲכָמִים
  choice: o discurso dos sábios
  rationale: שִׂיחָה pode indicar fala, conversa ou discurso reflexivo. Aqui, em paralelo com os enigmas que exigem atenção, «discurso» comunica uma instrução sapiencial desenvolvida sem restringir o termo a uma conversa casual.
- source_word: וּבְחִידֹתֵיהֶם
  choice: com os enigmas deles
  rationale: חִידָה designa enigma, adivinha ou dito obscuro. «Enigmas» conserva diretamente a ideia de formulações sapienciais difíceis que requerem reflexão.
- source_word: הִתְרַפֵּשׂ
  choice: ocupe-se
  rationale: A forma reflexiva, pouco comum neste contexto, pede envolvimento ativo. «Ocupe-se» é digna e inteligível, sem definir de modo excessivo a nuance incerta do verbo; a alternativa «dedique-se» é registrada em nota.
