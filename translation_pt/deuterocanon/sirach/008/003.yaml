  text: Do not quarrel with a man who has a sharp tongue, and do not pile wood on his fire.[a]
translation:
  language: pt
  text: Não trame contra um homem sem recursos, para que ele não ponha na balança o seu preço e você pereça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico preservado é difícil e diz aproximadamente: «Não trame contra um homem sem recursos, para que ele não ponha na balança o seu preço e você pereça». A tradição grega traz um provérbio diferente: «Não discuta com um homem de língua afiada nem amontoe lenha sobre o fogo dele».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּחֲרֹשׁ עַל
  choice: Não trame contra
  rationale: O verbo hebraico חרשׁ pode significar «calar-se» ou «tramar, maquinar». Com a preposição עַל, a leitura «tramar contra» traduz diretamente o hebraico preservado, embora a tradição grega leia «não entre em conflito».
- source_word: אִישׁ לֹא הוֹן
  choice: um homem sem recursos
  rationale: A expressão hebraica é incomum, mas לֹא הוֹן aponta literalmente para alguém sem riqueza ou bens. «Sem recursos» é natural em português e evita transformar pobreza em falta de valor moral.
- source_word: פֶּן יִשְׁקֹל מְחִירְךָ
  choice: para que ele não ponha na balança o seu preço
  rationale: A tradução conserva a imagem concreta de שקל, «pesar», e o substantivo מְחִיר, «preço». A formulação permanece deliberadamente enigmática, como o hebraico.
- source_word: וְאָבָדְתָּ
  choice: e você pereça
  rationale: «Pereça» reproduz a gravidade de אבד sem restringir indevidamente o sentido a morte física, ruína ou perda.
