translation_notes:
  register: Português moderno, digno e acessível, com preferência pelo hebraico de alta confiança como texto principal. A obscuridade da expressão «ponha na balança o seu preço» foi mantida, e a leitura grega coerente, porém textualmente diferente, foi registrada em nota.
