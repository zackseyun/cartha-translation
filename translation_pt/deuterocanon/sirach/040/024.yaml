  text: A brother and a companion are for a time of trouble[a], but righteousness delivers more than both.
translation:
  language: pt
  text: Um irmão e um companheiro ajudam no tempo da aflição, mas a justiça[a] livra mais do que ambos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego paralelo diz: “e a esmola” — ou “a misericórdia” — “livrará mais do que ambos”. O testemunho hebraico traz “justiça”.'
    reason: Leitura alternativa relevante no testemunho grego.
lexical_decisions:
- source_word: אח
  choice: irmão
  rationale: O hebraico designa diretamente um irmão; o termo concreto foi mantido, sem ampliá-lo para “parente” ou “amigo”.
- source_word: ושותף
  choice: e um companheiro
  rationale: שותף indica alguém que compartilha ou participa com outra pessoa. “Companheiro” comunica apoio e vínculo mútuo com mais naturalidade geral do que “sócio” ou “parceiro” neste contexto sapiencial.
- source_word: לעת צרה
  choice: no tempo da aflição
  rationale: A expressão se refere a uma ocasião de crise ou angústia. “No tempo da aflição” é claro, digno e preserva a amplitude do hebraico.
- source_word: ומשניהם
  choice: mas ... mais do que ambos
  rationale: A formulação conserva a comparação explícita com os dois apoios mencionados. “Mas” torna natural em português o contraste implícito no encadeamento hebraico.
- source_word: צדק
  choice: justiça
  rationale: O testemunho hebraico traz צדק, que pode significar justiça ou retidão. “Justiça” preserva o sentido ético amplo e também permite que a divergência do grego seja apresentada claramente em nota.
- source_word: מצלת
  choice: livra
  rationale: O verbo expressa resgatar ou tirar do perigo. “Livra” é natural no registro sapiencial e evita restringir o sentido a uma forma específica de salvamento.
theological_decisions:
- issue: Hebraico צדק em contraste com o grego ἐλεημοσύνη
  choice: Seguir no texto principal o hebraico com “justiça”.
  alternative: “A esmola” ou “a misericórdia livra mais do que ambos”.
  rationale: O testemunho hebraico sobrevivente tem prioridade, mas a leitura grega altera de modo relevante a ênfase ética e pode refletir uma variante hebraica ou uma interpretação antiga; por isso, ela é preservada em nota, sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O verbo “ajudam” explicita de maneira natural a função indicada pela construção nominal hebraica, sem mudar o sentido. A nota foi colocada junto de “justiça”, onde ocorre a principal divergência textual.
