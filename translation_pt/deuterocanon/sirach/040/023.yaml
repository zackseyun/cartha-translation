  text: A companion and a friend conduct themselves for a time, but better than both is an intelligent wife.
translation:
  language: pt
  text: Um companheiro e um amigo convivem por algum tempo,[a] mas uma esposa sensata vale mais do que ambos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na ocasião apropriada”. O hebraico e o grego permitem tanto a ideia de duração limitada quanto a de oportunidade.
    reason: alternative_reading
  - marker: b
    text: 'Hebraico: “mulher”; o paralelo grego aponta mais especificamente para o sentido conjugal, daí “esposa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עמית
  choice: companheiro
  rationale: Designa alguém próximo, associado ou parceiro; “companheiro” preserva o caráter relacional e se distingue naturalmente de “amigo”.
- source_word: רע
  choice: amigo
  rationale: No paralelismo com עמית, expressa amizade pessoal e mantém duas relações próximas, mas não idênticas.
- source_word: לעת
  choice: por algum tempo
  rationale: Conserva a referência temporal e a possível ideia de duração limitada, sem excluir por completo a nuance de ocasião própria.
- source_word: ינהגו
  choice: seguem juntos
  rationale: O verbo נהג pode envolver conduzir, avançar ou portar-se. No contexto relacional, “seguem juntos” é natural em português e evita a formulação rígida “comportam-se”.
- source_word: ומשניהם
  choice: mas melhor do que ambos
  rationale: A comparação de superioridade é indicada pela estrutura do dito e confirmada pelo grego ὑπὲρ ἀμφότερα.
- source_word: אשה
  choice: esposa
  rationale: O hebraico permite “mulher” ou “esposa”; o paralelo grego, γυνὴ μετὰ ἀνδρός, favorece aqui o sentido conjugal.
- source_word: משכלת
  choice: sensata
  rationale: Expressa discernimento e inteligência prática. “Sensata” é corrente, digna e adequada ao vocabulário sapiencial.
theological_decisions:
- issue: Se אשה deve ser traduzido genericamente como “mulher” ou especificamente como “esposa”
  choice: esposa
  alternative: mulher
  rationale: Embora o hebraico isolado admita os dois sentidos, o paralelo grego aponta para uma relação conjugal. A nota preserva a ambiguidade lexical do hebraico sem transformar a escolha em afirmação doutrinária.
- issue: Nuance temporal de לעת
  choice: por algum tempo
  alternative: no tempo oportuno
  rationale: O hebraico e o grego permitem uma referência a duração limitada ou a uma ocasião apropriada. O texto principal adota a primeira leitura, enquanto a nota registra a segunda.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Seguem juntos” comunica de modo natural a continuidade da relação sem impor ao verbo uma ideia de utilidade ausente da forma hebraica; “sensata” ressalta discernimento prático.
