  text: from one seated on a lofty throne[a], to one returning to dust and ashes.
translation:
  language: pt
  text: desde quem está sentado num trono elevado[a] até quem volta ao pó e às cinzas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: «desde quem está sentado num trono em glória até quem foi humilhado na terra e nas cinzas». O grego explicita as ideias de glória e humilhação que o hebraico expressa de forma mais concisa.'
    reason: alternative_reading
lexical_decisions:
- source_word: מיושב
  choice: desde quem está sentado
  rationale: O prefixo מ־ indica o ponto inicial da extensão («desde»), e יושב é um particípio que descreve a pessoa sentada. A formulação mantém a sintaxe hebraica e concorda com o paralelo grego ἀπὸ καθημένου.
- source_word: כסא
  choice: trono
  rationale: כסא designa com frequência um assento régio; o contexto de elevação e o grego θρόνος confirmam que se trata de um trono, não de um assento comum.
- source_word: לגבה
  choice: elevado
  rationale: A expressão comunica altura ou exaltação. «Elevado» preserva tanto a imagem espacial quanto a posição social, sem incorporar ao texto principal a explicitação grega «em glória».
- source_word: עד
  choice: até
  rationale: עד marca o outro extremo da extensão «desde... até...». Embora «até» possa ter sentido temporal, aqui a construção completa deixa claro que se trata de uma abrangência entre dois extremos.
- source_word: לשוב
  choice: quem volta
  rationale: O infinitivo com ל־ descreve o extremo final da condição humana. «Quem volta» conserva a ideia verbal e a conhecida imagem bíblica do retorno ao pó.
- source_word: עפר ואפר
  choice: pó e cinzas
  rationale: O par expressa mortalidade, fragilidade e humilhação. «Pó e cinzas» é uma formulação bíblica natural e reconhecível em português.
theological_decisions:
- issue: Primazia do testemunho hebraico diante das explicitações do paralelo grego
  choice: 'Traduzir diretamente o contraste hebraico: «desde quem está sentado num trono elevado até quem volta ao pó e às cinzas».'
  alternative: «desde quem está sentado num trono em glória até quem foi humilhado na terra e nas cinzas»
  rationale: 'O hebraico preservado é a testemunha principal e apresenta de modo conciso os extremos da condição humana: a posição mais elevada e o destino mortal. O grego confirma o contraste geral, mas explicita «glória» e «humilhação», elementos que não devem ser incorporados silenciosamente ao texto principal.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «desde... até...» preserva a abrangência do original, e «trono elevado» mantém de forma concisa a dupla conotação de altura e exaltação.
