  text: Every gift and injustice will be wiped away[b][a], but faith will stand forever.
translation:
  language: pt
  text: Todo presente[b] e toda injustiça serão apagados, mas a fé[a] permanecerá firme para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a fidelidade permanecerá firme para sempre”. A palavra grega pode significar tanto fé como fidelidade.'
    reason: alternative_reading
  - marker: b
    text: Um antigo testemunho hebraico de Massada parece refletir uma leitura relacionada a “empréstimo” onde o texto grego traz “presente”. O texto principal segue o grego δῶρον, mas o hebraico indica uma antiga variante textual.
    reason: textual_variant
lexical_decisions:
- source_word: πᾶν
  choice: todo / toda
  rationale: O sentido distributivo combina com os substantivos no singular e, em português, a repetição de “todo/toda” deixa claro que abrange cada presente e cada injustiça.
- source_word: δῶρον
  choice: presente
  rationale: É o sentido comum do grego e evita especificar “oferta” ou “suborno” sem indicação contextual suficiente. A variante antiga relacionada a “empréstimo” é registrada em nota.
- source_word: ἀδικία
  choice: injustiça
  rationale: Preserva a dimensão ética e social do termo sem introduzir conotações teológicas mais específicas.
- source_word: ἐξαλειφθήσεται
  choice: serão apagados
  rationale: Expressa a imagem de remoção ou apagamento. O plural é exigido pela coordenação natural dos dois sujeitos em português.
- source_word: πίστις
  choice: fé
  rationale: Mantém a tradução principal estabelecida para πίστις, enquanto “fidelidade”, também possível neste contexto, é preservada em nota.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: É a forma idiomática e clara de expressar duração permanente em português.
- source_word: στήσεται
  choice: permanecerá firme
  rationale: Conserva a metáfora de estabilidade e resistência contida em “ficará de pé”, com formulação natural e digna em português.
theological_decisions:
- issue: Tradução de πίστις
  choice: fé
  alternative: fidelidade
  rationale: O termo grego pode indicar tanto fé quanto fidelidade. A tradução principal mantém “fé” sem eliminar a leitura contextual possível de “fidelidade”, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A concordância foi ajustada naturalmente ao plural em português, e “permanecerá firme” preserva a imagem concreta de estabilidade sem soar artificial.
