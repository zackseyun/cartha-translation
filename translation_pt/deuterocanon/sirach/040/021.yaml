  text: Flute and harp make song sweet[a], but better than both is a pure tongue.
translation:
  language: pt
  text: A flauta e a harpa tornam doce a canção, mas melhor do que ambas é uma língua pura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “e, acima de ambas, uma língua doce”, ou “uma fala agradável”.'
    reason: Leitura alternativa do paralelo grego para a expressão hebraica “língua pura”; o grego também explicita a comparação com os dois instrumentos.
lexical_decisions:
- source_word: חליל
  choice: flauta
  rationale: Designa um instrumento de sopro, como flauta ou pífaro. “Flauta” é o equivalente moderno mais claro e corresponde ao grego αὐλός.
- source_word: נבל
  choice: harpa
  rationale: Designa um instrumento de cordas dedilhadas. “Harpa” é uma tradução bíblica corrente e forma um par natural com “flauta”; o grego ψαλτήριον confirma o tipo geral de instrumento.
- source_word: יעריבו
  choice: tornam doce
  rationale: O verbo deriva de ערב no sentido de tornar agradável ou doce. A formulação conserva a nuance causativa e a imagem sensorial do hebraico.
- source_word: שיר
  choice: canção
  rationale: O substantivo denota canto ou canção. “Canção” é direto e se ajusta ao contexto dos instrumentos musicais.
- source_word: ומשניהם
  choice: mas melhor do que ambas
  rationale: A expressão indica superioridade em relação aos dois instrumentos. A conjunção adversativa explicita em português o contraste comparativo implícito no hebraico, sem alterar seu sentido.
- source_word: לשון
  choice: língua
  rationale: Embora se refira metonimicamente à fala, a tradução literal “língua” preserva a imagem concreta do hebraico e corresponde ao grego γλῶσσα.
- source_word: ברה
  choice: pura
  rationale: O adjetivo hebraico significa mais naturalmente “pura” ou “limpa”. “Pura” preserva a possível dimensão ética da fala, em vez de reduzi-la ao que apenas soa agradável.
theological_decisions:
- issue: Nuance hebraico-grega na expressão final
  choice: a língua pura
  alternative: uma língua doce; uma fala agradável
  rationale: O texto hebraico preservado traz לשון ברה, mais naturalmente “língua pura”. O paralelo grego traz γλῶσσα ἡδεῖα, “língua doce/agradável”. Dá-se prioridade ao hebraico existente, enquanto a diferença significativa do grego é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e vocabulário de ampla compreensão. Conserva-se “língua pura” para manter a imagem e a tensão ética do hebraico; a variante grega é apresentada em nota.
