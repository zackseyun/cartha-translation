  text: Wine and strong drink sweeten life[a], but better than both is finding a treasure.
translation:
  language: pt
  text: O vinho e a bebida inebriante adoçam a vida[a], mas encontrar um tesouro é melhor do que ambos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “O vinho e a bebida inebriante adoçam a vida, e além de ambos, encontrar um tesouro”. O paralelo grego também favorece o sentido comparativo: “acima de ambos”.'
    reason: A expressão hebraica é compacta e pode ser reproduzida mais literalmente; a tradução explicita a comparação indicada pelo contexto e pelo paralelo grego.
lexical_decisions:
- source_word: חיי
  choice: a vida
  rationale: O substantivo é preservado, mas a construção hebraica é expressa de modo natural em português como objeto de “adoçam”.
- source_word: יין
  choice: o vinho
  rationale: Equivalente direto e comum para a bebida fermentada de uvas.
- source_word: ושכר
  choice: e a bebida inebriante
  rationale: שכר designa uma bebida alcoólica distinta do vinho, sem exigir que seja destilada; “bebida inebriante” evita restringir o termo a cerveja ou sugerir destilados modernos.
- source_word: ימתקו
  choice: adoçam
  rationale: Mantém a imagem de מתק, “ser ou tornar doce”, e comunica naturalmente que essas bebidas tornam a vida agradável.
- source_word: ומשניהם
  choice: mas ... é melhor do que ambos
  rationale: Explicita o sentido comparativo de “além/acima de ambos”, também apoiado pelo grego ὑπὲρ ἀμφότερα, sem alterar o contraste.
- source_word: מוצא
  choice: encontrar
  rationale: A forma participial ou nominal é vertida por um infinitivo substantivado, construção fluente em português; o paralelo grego também apresenta “aquele que encontra”.
- source_word: אוצר
  choice: um tesouro
  rationale: Neste contexto, significa algo valioso encontrado, e não um depósito físico; o grego θησαυρόν confirma esse sentido.
