  text: Wine and strong drink gladden the heart, but better than both is the love of lovers.
translation:
  language: pt
  text: 'O vinho e a bebida forte alegram o coração,

    mas, mais do que ambos, o amor dos amantes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יין ושכר
  choice: o vinho e a bebida forte
  rationale: Mantém a distinção hebraica entre vinho e bebida alcoólica forte; evita seguir o paralelo grego, que traz “música” no segundo termo.
- source_word: יעליצו לב
  choice: alegram o coração
  rationale: Expressa de modo natural e direto o sentido causativo de proporcionar alegria ao coração.
- source_word: ומשניהם
  choice: mas, mais do que ambos
  rationale: O hebraico indica superioridade em relação aos dois itens anteriores; “mas” torna explícito em português o contraste já implicado na comparação.
- source_word: אהבת דודים
  choice: o amor dos amantes
  rationale: Preserva a linguagem relacional e amorosa do hebraico דודים e a ambiguidade quanto à identidade ou ao gênero dos amantes, sem substituí-la pela variante grega “amor da sabedoria”.
theological_decisions:
- issue: Variante textual no membro final
  choice: o amor dos amantes
  alternative: o amor da sabedoria
  rationale: A fonte hebraica de alta confiança lê אהבת דודים, enquanto o grego apresenta ἀγάπησις σοφίας. Como a tradução parte prioritariamente do hebraico fornecido, conserva-se sua leitura sem harmonização com o grego.
- issue: Valor de שכר
  choice: bebida forte
  alternative: música
  rationale: A leitura “bebida forte” traduz o hebraico שכר. A alternativa “música” pertence ao testemunho grego e não deve substituir silenciosamente a leitura hebraica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com paralelismo poético conciso. A formulação “amor dos amantes” é deliberadamente literal o bastante para conservar a tensão e a ambiguidade do hebraico.
