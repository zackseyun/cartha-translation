base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/028.yaml
  text: My child[a], do not live the life of a beggar[b]; it is better to die than to beg.
translation:
  language: pt
  text: Meu filho[a], não leve uma vida de mendigo[b]; é melhor morrer[c] do que mendigar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O vocativo “Meu filho” aparece no texto grego; não consta na linha hebraica preservada.
    reason: textual_source
  - marker: b
    text: A expressão hebraica correspondente é difícil; o grego esclarece o sentido como viver de pedir esmolas.
    reason: lexical_alternative
  - marker: c
    text: 'Hebraico: literalmente, “ser recolhido”, expressão usada como eufemismo para morrer; o grego traz explicitamente “morrer”.'
    reason: idiom
lexical_decisions:
- source_word: חיי
  choice: uma vida
  rationale: A forma construta designa aqui um modo ou condição de viver; em português, “levar uma vida” expressa naturalmente essa ideia.
- source_word: מכי מתן
  choice: de mendigo
  rationale: A expressão hebraica é difícil, mas o contexto e o paralelo grego, com ἐπαιτήσεως, indicam uma vida sustentada pela mendicância.
- source_word: אל תחי
  choice: não leve
  rationale: O imperativo negativo significa literalmente “não viva”; com “uma vida”, a construção idiomática portuguesa é “não leve uma vida”.
- source_word: טוב
  choice: é melhor
  rationale: O termo tem valor comparativo nesta frase, confirmado pelo grego κρεῖσσον.
- source_word: נאסף
  choice: morrer
  rationale: Embora signifique literalmente “ser recolhido”, é um eufemismo hebraico para a morte; o grego ἀποθανεῖν explicita esse sentido.
- source_word: כמסתולל
  choice: do que mendigar
  rationale: A forma hebraica é obscura, mas o paralelo grego ἐπαιτεῖν sustenta claramente o sentido de pedir esmolas.
- source_word: τέκνον
  choice: Meu filho
  rationale: O vocativo consta no paralelo grego, embora não na linha hebraica preservada. “Meu filho” conserva o tom de instrução sapiencial e é natural em português.
theological_decisions:
- issue: A afirmação de que morrer é melhor do que mendigar
  choice: Preservar a comparação direta e contundente
  alternative: Suavizar como uma descrição do sofrimento ou da vergonha da pobreza
  rationale: O hebraico e o grego apresentam a comparação sem atenuação. A tradução não deve resolver nem suavizar a tensão ética do provérbio.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Levar uma vida de mendigo” preserva o paralelismo com “mendigar” sem recorrer ao termo mais técnico “mendicância”. O dito deliberadamente severo foi mantido sem suavização.
