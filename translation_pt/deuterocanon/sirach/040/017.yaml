  text: Kindness will never be shaken[b][a], and righteousness will stand forever.
translation:
  language: pt
  text: A bondade jamais será abalada[b][a], e a justiça permanecerá para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: «A graça é como um paraíso de bênçãos, e a esmola perdura para sempre». O testemunho hebraico traz, em vez disso, «bondade [...] e justiça [...]».'
    reason: alternative_reading
  - marker: b
    text: O manuscrito de Massada preserva neste ponto uma leitura hebraica diferente da dos manuscritos da Genizá do Cairo; porém, o trecho remanescente é fragmentário demais para determinar com segurança a tradução completa.
    reason: textual_variant
lexical_decisions:
- source_word: וחסד
  choice: A bondade
  rationale: חסד abrange bondade, misericórdia e amor leal. Sem um contexto explicitamente pactual, «bondade» comunica de modo claro a virtude ética, mantendo o hebraico como fonte principal.
- source_word: לעולם לא ימוט
  choice: jamais será abalada
  rationale: ימוט expressa vacilar, ser movido ou perder a estabilidade. «Jamais será abalada» preserva a imagem de firmeza duradoura em português natural.
- source_word: וצדקה
  choice: e a justiça
  rationale: צדקה pode significar justiça, retidão e, em uso posterior, beneficência. «Justiça» representa diretamente o testemunho hebraico, enquanto a leitura grega «esmola» é registrada em nota.
- source_word: לעד תכון
  choice: permanecerá para sempre
  rationale: תכון, da raiz כון, denota estar firme, estabelecido ou perdurar. «Permanecerá para sempre» é natural e conserva a ideia de duração permanente, em paralelo com o primeiro membro.
theological_decisions:
- issue: Testemunho hebraico do Cairo em contraste com o paralelo grego
  choice: 'Seguir no texto principal o hebraico: «a justiça permanecerá para sempre»'
  alternative: 'A tradição grega traz: «a esmola perdurará para sempre»'
  rationale: Como o hebraico está preservado e sua leitura tem alta confiança, ele rege o texto principal. A divergência grega, teologicamente e semanticamente relevante, é mantida em nota sem harmonização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo poético e a imagem de estabilidade do hebraico. Os marcadores seguem a ordem apresentada no texto inglês auditado ([b][a]), e ambos aparecem no texto principal.
