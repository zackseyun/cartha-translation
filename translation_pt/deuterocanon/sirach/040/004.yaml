translation:
  language: pt
  text: desde quem usa um turbante pequeno e uma coroa florida[a] até quem se cobre com uma veste de pele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “desde quem veste púrpura azulada e uma coroa até quem se veste de linho cru”. Os testemunhos hebraico e grego diferem nas peças de roupa mencionadas, mas expressam a mesma amplitude social.'
    reason: textual_variant
lexical_decisions:
- source_word: מעוטה צניף
  choice: um turbante pequeno
  rationale: Entende מעוטה como qualificativo de צניף, indicando uma cobertura de cabeça pequena ou modesta. “Turbante” traduz de modo natural uma peça enrolada na cabeça, sem inferir além do hebraico a posição social de quem a usa.
- source_word: וציץ
  choice: e uma coroa florida
  rationale: ציץ pode designar flor, ornamento frontal ou diadema. “Coroa florida” conserva a imagem floral hebraica e também corresponde ao testemunho grego de uma coroa ou grinalda.
- source_word: ועד
  choice: até
  rationale: Marca o outro extremo da faixa social ou material apresentada no contexto; “até” reproduz com clareza essa fórmula de abrangência.
- source_word: עוטה
  choice: se cobre
  rationale: O particípio descreve alguém coberto ou envolto por uma roupa. A forma reflexiva é idiomática em português e mantém a imagem sem especificar o modo de vestir.
- source_word: שמלת עור
  choice: uma veste de pele
  rationale: Tradução próxima do sentido literal, sem decidir se o material é couro curtido ou pele não processada. “Veste” mantém um registro digno e compreensível.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “desde... até...” preserva a abrangência do verso. A nota registra a variante grega sem substituir o hebraico, que é o texto principal.
