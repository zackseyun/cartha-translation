base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/005.yaml
  text: Yet envy[a], anxiety, and fear, and the dread of death, bring contention in abundance; and at the time of his rest upon his bed[b], the sleep of night changes his misery.
translation:
  language: pt
  text: Mas inveja, ansiedade, medo e pavor da morte provocam muita agitação[a]; e, quando ele repousa em seu leito, o sono da noite altera sua aflição[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico desta expressão é conciso e de interpretação incerta. O paralelo grego apresenta uma lista mais extensa de perturbações, incluindo indignação e contenda.
    reason: alternative_reading
  - marker: b
    text: Ou “muda sua angústia” ou “altera seu sofrimento”. Aqui, o hebraico provavelmente se refere à condição aflitiva da pessoa, não ao mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: אך
  choice: Mas
  rationale: A conjunção introduz um contraste com o contexto precedente; “mas” é natural em português e preserva essa transição.
- source_word: קנאה
  choice: inveja
  rationale: No conjunto de perturbações interiores, o sentido negativo de “inveja” é mais provável do que “zelo”; o grego ζῆλος é compatível com essa leitura.
- source_word: דאגה
  choice: ansiedade
  rationale: Expressa preocupação angustiante e corresponde ao peso emocional do contexto em português atual.
- source_word: פחד
  choice: medo
  rationale: Tradução direta, sem intensificar indevidamente o termo; a expressão seguinte traz o grau mais forte de temor.
- source_word: אימת מות
  choice: o pavor da morte
  rationale: Preserva a força de אימה e traduz naturalmente a construção hebraica.
- source_word: תחרה ורב
  choice: provocam muita agitação
  rationale: A formulação hebraica é comprimida e incerta. “Agitação” mantém o campo de perturbação e conflito sem importar integralmente a lista mais extensa do paralelo grego.
- source_word: ועת נוחו
  choice: e, quando ele repousa
  rationale: Comunica de forma natural tanto a circunstância temporal quanto a ideia de repouso.
- source_word: על משכבו
  choice: em sua cama
  rationale: Equivalente corrente e claro para o hebraico, preferível ao mais arcaico “sobre o seu leito”.
- source_word: שינת לילה
  choice: o sono da noite
  rationale: Conserva a construção poética e elevada do hebraico sem perder clareza.
- source_word: תשנה
  choice: transforma
  rationale: Reflete o sentido de mudar ou alterar, também confirmado pelo grego ἀλλοιοῖ.
- source_word: רעתו
  choice: sua aflição
  rationale: No contexto, רעה designa provavelmente a condição penosa da pessoa, não maldade moral. “Aflição” preserva essa leitura sem definir exatamente como o sono a altera.
theological_decisions:
- issue: Relação entre o hebraico extante e o paralelo grego na cláusula difícil
  choice: Manter o texto principal ancorado no hebraico e usar o grego apenas para confirmar a ideia geral de perturbação e conflito.
  alternative: Seguir de perto o grego e ampliar a enumeração com ira, tumulto, indignação e contenda.
  rationale: O hebraico é o testemunho principal aqui, embora תחרה ורב seja sintaticamente comprimido. A expansão grega esclarece o campo sem justificar a inclusão de todos os seus elementos no texto principal.
- issue: Sentido moral ou experiencial de רעתו
  choice: Traduzir como “sua aflição”, referindo-se à condição sofrida da pessoa.
  alternative: Traduzir literalmente como “seu mal”, o que poderia sugerir maldade moral.
  rationale: O contexto trata das inquietações que afligem a humanidade e do sono perturbado; por isso, a acepção experiencial é mais adequada, embora uma nota preserve alternativas lexicais.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética moderada. “Em sua cama” favorece a compreensão ampla; os travessões organizam a sequência de temores sem resolver em excesso a sintaxe comprimida do hebraico.
