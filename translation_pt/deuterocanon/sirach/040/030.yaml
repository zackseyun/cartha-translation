  text: For a shameless man, begging is sweet, but within him it burns like fire.
translation:
  language: pt
  text: Para o homem sem vergonha[a], pedir esmola é doce[b], mas dentro dele isso arde como fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, possivelmente «para um homem de alma forte»; o paralelo grego diz «na boca de uma pessoa sem vergonha», apoiando o sentido adotado no texto.
    reason: alternative_reading
  - marker: b
    text: Ou «pedir é doce». O paralelo grego sugere mais especificamente pedir esmola ou mendigar.
    reason: lexical_alternative
lexical_decisions:
- source_word: לאיש עוז נפש
  choice: para o homem sem vergonha
  rationale: A expressão hebraica é difícil e, literalmente, pode indicar um homem de alma forte; porém, o paralelo grego traz «uma pessoa sem vergonha», leitura que se ajusta ao tom negativo do provérbio. A ambiguidade do hebraico é preservada em nota.
- source_word: תמתיק שאלה
  choice: pedir esmola é doce
  rationale: שאלה pode significar pedido ou ato de pedir. O grego ἐπαίτησις aponta mais especificamente para mendicância. «Pedir esmola» explicita o sentido social, enquanto «é doce» preserva a metáfora.
- source_word: ובקרבו
  choice: mas dentro dele
  rationale: קרב designa o interior ou as partes internas. «Dentro dele» é natural em português e conserva o contraste entre a doçura aparente e o sofrimento íntimo.
- source_word: תבער כמו אש
  choice: isso arde como fogo
  rationale: A forma verbal feminina provavelmente retoma a ação ou condição de pedir esmola. «Isso arde como fogo» mantém a imagem vívida sem explicar além do que o texto afirma.
theological_decisions:
- issue: Sentido da expressão hebraica difícil לאיש עוז נפש
  choice: vergonha moral ou descaramento
  alternative: homem de alma forte, homem audaz
  rationale: Embora o hebraico admita uma leitura ligada à força de alma, o testemunho grego favorece claramente a falta de vergonha. A tradução principal segue essa indicação, e a leitura mais literal do hebraico é registrada em nota para não ocultar a tensão textual.
translation_notes:
  register: Português moderno, claro e digno, com construção acessível a leitores brasileiros e internacionais. «Homem sem vergonha» comunica a censura moral sem recorrer a vocabulário excessivamente técnico; «pedir esmola» é mais natural no contexto do que o substantivo abstrato «mendicância».
