  text: Gold and silver make the foot stand firm[a], but better than both is sound counsel.
translation:
  language: pt
  text: O ouro e a prata dão firmeza aos pés,[a] mas melhor do que ambos é um bom conselho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, o hebraico diz: “O ouro e a prata fazem o pé ficar firme; e, além de ambos, um bom conselho”. O paralelo grego também conserva a imagem de firmar o pé e coloca o conselho acima dos dois.'
    reason: Registra a imagem e a construção comparativa literais, ambas um pouco suavizadas no texto para produzir português natural.
lexical_decisions:
- source_word: זהב וכסף
  choice: o ouro e a prata
  rationale: Preserva literalmente o par hebraico que representa riqueza, também refletido no paralelo grego.
- source_word: יעמידו רגל
  choice: dão firmeza aos pés
  rationale: Expressa em português natural a imagem concreta de fazer o pé ficar firme. O singular coletivo hebraico pode ser vertido naturalmente pelo plural genérico em português.
- source_word: ומשניהם
  choice: mas melhor do que ambos
  rationale: Explicita a força comparativa da expressão hebraica comprimida, literalmente 'e além dos dois', confirmada pelo grego ὑπὲρ ἀμφότερα.
- source_word: עצה טובה
  choice: um bom conselho
  rationale: Mantém correspondência direta com 'conselho bom' e soa natural no registro proverbial, sem acrescentar à qualidade expressa por טובה.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com forma proverbial. Preferiu-se “dão firmeza aos pés” a uma reprodução rígida de “fazem o pé ficar firme”; “bom conselho” mantém maior proximidade lexical com o hebraico עצה טובה.
