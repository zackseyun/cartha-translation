  text: For the wicked[a], evil was created, and because of them destruction will cease only when it is complete.
translation:
  language: pt
  text: Para os perversos[a], o mal foi criado e, por causa deles, a destruição só cessará quando estiver completa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Tudo isso foi criado para os transgressores, e por causa deles veio o dilúvio.” Sua cláusula final difere substancialmente do hebraico preservado.'
    reason: alternative_reading
lexical_decisions:
- source_word: על רשע
  choice: Para o perverso
  rationale: A preposição על pode expressar relação, direção ou oposição (“para”, “sobre”, “contra”). “Para o perverso” mantém a relação ampla do hebraico sem restringi-la exclusivamente à punição; o singular conserva a forma genérica do texto.
- source_word: נבראה רעה
  choice: foi criado o mal
  rationale: רעה pode significar tanto mal quanto calamidade ou desgraça. “O mal” é a opção mais formalmente transparente e preserva a amplitude semântica e a tensão do contexto.
- source_word: וב‍עבור
  choice: e, por causa dele
  rationale: בעבור normalmente indica causa ou motivo. Embora o pronome não esteja expresso na forma hebraica citada, o referente é o perverso da primeira oração; o paralelo grego também explicita uma referência pronominal causal, embora no plural.
- source_word: תמוש כלה
  choice: a destruição só cessará quando estiver completa
  rationale: מוש pode significar afastar-se, retirar-se ou cessar, e כלה pode indicar consumação, fim ou destruição. A formulação conserva a concisão difícil do hebraico, entendendo כלה como consumação plena, sem importar para o texto principal a menção grega ao dilúvio.
theological_decisions:
- issue: Se רעה designa o mal em sentido amplo ou especificamente uma calamidade punitiva
  choice: o mal
  alternative: a calamidade; a desgraça
  rationale: O termo hebraico admite tanto uma leitura moral quanto uma leitura de infortúnio ou juízo. A tradução mais ampla evita resolver silenciosamente essa ambiguidade.
- issue: Como representar a divergência entre a cláusula hebraica final e o paralelo grego
  choice: Traduzir o hebraico no texto principal e registrar a leitura grega em nota
  alternative: e por causa deles veio o dilúvio
  rationale: Como há testemunho hebraico, ele governa o texto principal. O grego preserva uma tradição materialmente diferente e relevante, por isso aparece em nota, sem ser harmonizado com o hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Perverso” preserva o singular genérico; “mal” mantém a ambiguidade semântica do hebraico. A segunda oração permanece deliberadamente compacta por refletir uma construção hebraica difícil.
