  text: Pestilence and bloodshed, strife and the sword, devastation and ruin, calamity and death.
translation:
  language: pt
  text: Peste e sangue, conflito e espada, devastação e ruína, calamidade e morte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דבר
  choice: peste
  rationale: O substantivo hebraico designa peste ou epidemia mortal; “peste” é direto, corrente e adequado à enumeração.
- source_word: דם
  choice: sangue
  rationale: Mantém o substantivo concreto do hebraico e o paralelismo conciso; no contexto da lista, evoca derramamento de sangue sem acrescentar ao texto uma forma verbal.
- source_word: חרחר
  choice: conflito
  rationale: O termo hebraico é raro ou incerto, mas o paralelo grego ἔρις aponta para contenda ou conflito. “Conflito” preserva esse sentido sem especificar indevidamente sua forma.
- source_word: שד
  choice: devastação
  rationale: Expressa destruição violenta e combina naturalmente com “ruína” no par nominal.
- source_word: שבר
  choice: ruína
  rationale: Neste contexto de calamidades, indica colapso, destroço ou ruína; a escolha conserva a força e a concisão da sequência.
- source_word: רעה
  choice: calamidade
  rationale: Embora possa significar “mal”, aqui integra uma lista de desastres e sofrimentos; “calamidade” comunica o sentido contextual sem impor uma leitura moral.
theological_decisions:
- issue: Sentido de רעה na enumeração
  choice: calamidade
  alternative: mal
  rationale: A sequência descreve males sofridos e eventos destrutivos, não necessariamente maldade moral. “Calamidade” preserva essa orientação contextual, enquanto “mal” permanece uma possibilidade lexical mais ampla.
translation_notes:
  register: Enumeração nominal breve e solene, com pares coordenados e vocabulário atual. A tradução conserva a aspereza e o ritmo cumulativo do hebraico, sem explicitar relações que o original deixa implícitas.
