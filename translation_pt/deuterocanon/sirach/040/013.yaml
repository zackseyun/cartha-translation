  text: From force to force[a], like a perennial wadi, and from a mighty channel[c][b], with a crash of sounds.
translation:
  language: pt
  text: De força em força[a], como um uádi perene[c], e de um leito poderoso, com um estrondo de sons.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “A riqueza dos injustos secará como um rio e ressoará como um grande trovão durante a chuva.” Isso reflete uma forma textual muito diferente da do hebraico preservado.'
    reason: alternative_reading
  - marker: b
    text: O texto hebraico desta linha é difícil, e o fragmento de Massada referente a este versículo está incompleto demais para estabelecer com segurança a redação. A tradução segue o hebraico da Geniza do Cairo, levando também em conta o paralelo grego.
    reason: textual_variant
  - marker: c
    text: Ou “uma corrente de fluxo constante”. O hebraico נחל muitas vezes se refere a um uádi, vale ou leito de torrente, e איתן sugere fluxo duradouro ou perene.
    reason: lexical_alternative
lexical_decisions:
- source_word: מחיל אל חיל
  choice: de força em força
  rationale: חיל pode significar força, poder, riqueza ou exército. A expressão hebraica é elíptica e difícil; no contexto da imagem de águas impetuosas, “de força em força” preserva tanto a repetição quanto a ideia de ímpeto crescente, sem incorporar ao texto principal a forma grega bastante diferente.
- source_word: נחל איתן
  choice: um uádi perene
  rationale: נחל designa com frequência um uádi, isto é, um vale ou leito de torrente, enquanto איתן sugere permanência, constância ou fluxo duradouro. A formulação conserva a paisagem própria do hebraico e a aparente tensão entre torrente e perenidade.
- source_word: אפיק אדיר
  choice: um leito poderoso
  rationale: אפיק pode designar leito, canal ou curso de água, e אדיר significa poderoso ou imponente. “Leito poderoso” mantém a imagem topográfica concreta e evita sugerir necessariamente um canal artificial.
- source_word: בחזיז קולות
  choice: com um estrondo de sons
  rationale: A expressão é rara e incerta. קולות pode significar sons, vozes ou trovões; “estrondo de sons” comunica a violência auditiva sem definir o fenômeno como trovão de modo mais explícito do que permite o hebraico preservado.
