  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservou-se a estrutura poética e elíptica do hebraico. O termo “uádi” mantém a imagem geográfica específica e é esclarecido em nota; a formulação incomum “estrondo de sons” preserva a incerteza lexical sem harmonização indevida com o grego.
