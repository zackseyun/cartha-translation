base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/029.yaml
  text: A man who watches another’s table—his life is not to be counted as life[a]; he defiles his appetite with another man’s delicacies[b], but a man who knows inward restraint will beware.
translation:
  language: pt
  text: O homem que olha para a mesa alheia[a] — sua vida não pode ser contada como vida; ele degrada o próprio apetite com as iguarias de outro, mas o homem que conhece a disciplina interior[b] terá cautela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “mesa alheia” ou “mesa de outro”; o grego também diz “mesa pertencente a outro”. A ideia é depender das provisões de outra pessoa, não necessariamente de alguém de outra etnia.'
    reason: lexical_alternative
  - marker: b
    text: A última linha do hebraico é difícil; literalmente, contém algo semelhante a “um homem que conhece o segredo das entranhas”. O grego a interpreta como “um homem conhecedor e instruído se guardará”, apoiando o sentido de disciplina interior e cautela prudente.
    reason: alternative_reading
lexical_decisions:
- source_word: איש משגיח על שלחן זר
  choice: O homem que fica de olho na mesa alheia
  rationale: Mantém a figura concreta de alguém que olha atentamente para a mesa pertencente a outra pessoa. “Alheia” comunica posse e dependência sem sugerir necessariamente etnia estrangeira; o grego ἀλλοτρίαν τράπεζαν confirma esse sentido.
- source_word: אין חייו למנות חיים
  choice: sua vida não pode ser contada como vida
  rationale: Preserva a repetição enfática de “vida” e a ideia hebraica de contar ou considerar, sem diluir a formulação sapiencial.
- source_word: נפש
  choice: o próprio apetite
  rationale: No contexto de mesa e comida, נפש pode designar o desejo ou apetite da pessoa. A escolha evita impor aqui o sentido mais restrito de uma alma imaterial.
- source_word: מטעמו
  choice: com as iguarias de outro
  rationale: O hebraico é difícil, mas o paralelo grego fala de alimentos pertencentes a outros. “Iguarias” conserva a noção de pratos desejáveis e combina com o contexto da mesa.
- source_word: לאיש יודע סוד מעים
  choice: mas o homem que conhece a disciplina interior terá cautela
  rationale: A expressão hebraica, literalmente ligada ao “segredo das entranhas”, é obscura. “Disciplina interior” conserva a imagem de governo interno em linguagem compreensível, enquanto “terá cautela” acompanha o grego φυλάξεται, “se guardará”.
theological_decisions:
- issue: Sentido ético da dependência da mesa alheia
  choice: Preservar a censura sapiencial à dependência humilhante sem transformá-la em proibição étnica ou ritual
  alternative: Entender “mesa estrangeira” como referência a alimentos de povos estrangeiros ou a impureza ritual
  rationale: זר e o grego ἀλλότριος indicam aqui aquilo que pertence a outra pessoa. O contexto e a frase sobre uma vida que não merece ser contada como vida apontam para dependência e perda de dignidade, não para uma distinção étnica explícita.
- issue: Interpretação da obscura cláusula final
  choice: Expressar prudência ou disciplina interior, mantendo a dificuldade em nota
  alternative: Traduzir literalmente “conhece o segredo das entranhas” ou seguir apenas a paráfrase grega “instruído e conhecedor”
  rationale: A redação escolhida mantém algo da imagem corporal hebraica e também a orientação prudencial do grego, sem apresentar como certa uma reconstrução mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Fica de olho” torna natural a imagem hebraica sem apagar sua força; a construção mais solene “não pode ser contada como vida” preserva o paralelismo sapiencial. As notas registram a ambiguidade lexical e textual em vez de ocultá-la.
