  terminology: «Mesa alheia», «apetite», «iguarias» e «disciplina interior» são escolhas adequadas. «Disciplina interior» continua sendo uma interpretação prudente de uma expressão hebraica muito obscura; a nota a qualifica corretamente com a formulação literal e com o apoio do grego.
