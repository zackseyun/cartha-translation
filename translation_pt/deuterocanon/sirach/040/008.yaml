base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/008.yaml
  text: And with all flesh their anxiety is with them[a], and their wealth drives away their sleep.
translation:
  language: pt
  text: E, com toda carne, sua ansiedade os acompanha[a], e sua riqueza lhes tira o sono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “com toda carne, desde o ser humano até o animal, e sobre os pecadores sete vezes mais do que isso”. Essa formulação mais extensa não consta da linha hebraica preservada usada aqui.'
    reason: alternative_reading
lexical_decisions:
- source_word: ועם כל בשר
  choice: E, com toda carne
  rationale: Mantém a expressão coletiva e concreta do hebraico, abrangendo os seres vivos em sua existência corpórea; o paralelo grego confirma o alcance amplo.
- source_word: דאגתם עמם
  choice: sua ansiedade os acompanha
  rationale: Expressa naturalmente em português a ideia hebraica de que a ansiedade está com eles, sem enfraquecer o tom de aflição.
- source_word: ועשרם
  choice: e sua riqueza
  rationale: Traduz diretamente עֹשֶׁר como riqueza ou bens, preservando o paradoxo de que a prosperidade também causa inquietação.
- source_word: מניד שנתם
  choice: lhes tira o sono
  rationale: Equivalente idiomático e vívido para a ação de afastar ou perturbar o sono.
theological_decisions:
- issue: Primazia do hebraico de Sirácida diante do paralelo grego mais extenso
  choice: O texto principal segue a linha hebraica preservada; a ampliação grega aparece em nota.
  alternative: 'Incluir no texto principal: “desde o ser humano até o animal, e sobre os pecadores sete vezes mais do que isso”.'
  rationale: Como o hebraico está disponível e tem alta confiança, ele fundamenta o texto principal. A leitura grega mais extensa é significativa, mas não deve ser incorporada silenciosamente ao testemunho hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. “Toda carne” conserva a imagem bíblica do hebraico; “lhes tira o sono” oferece uma formulação idiomática sem perder a força poética.
