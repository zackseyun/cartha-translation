  text: Again he prepares for battle[a], and he wakes up, and there is no terror; then he finds rest.
translation:
  language: pt
  text: De novo, ele se prepara para a batalha e acorda; não há terror, e encontra descanso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוד
  choice: De novo
  rationale: Expressa a repetição de mais um episódio na sequência de experiências perturbadoras.
- source_word: עורך מלחמה
  choice: se prepara para a batalha
  rationale: O verbo ערך significa pôr em ordem ou dispor, inclusive tropas para a batalha. A formulação escolhida conserva o sentido militar em português natural, sem especificar táticas não mencionadas.
- source_word: והקיץ
  choice: então acorda
  rationale: O verbo קיץ indica despertar do sono. “Então” torna clara a progressão da cena sonhada para o despertar, implícita na sequência hebraica.
- source_word: ואימה אין
  choice: não há terror
  rationale: Reproduz a frase nominal, breve e enfática, sem transformar o terror em mera ansiedade ou explicar por que ele desapareceu.
- source_word: ומצא מנוח
  choice: e encontra descanso
  rationale: מנוח denota descanso ou repouso; a tradução mantém a imagem simples de alívio após o despertar.
