  text: from the day he comes out from his mother's womb until the day he returns to the mother of all the living[a].
translation:
  language: pt
  text: desde o dia em que sai do ventre de sua mãe até o dia em que retorna à mãe de todos os viventes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “à mãe de todos os viventes” — expressão poética que provavelmente se refere à terra, mãe comum à qual os seres humanos retornam ao morrer. O paralelo grego torna explícita a referência à morte: “o dia da morte”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מיום
  choice: desde o dia
  rationale: A preposição מן com יום estabelece o início de um intervalo; “desde o dia” expressa esse limite temporal com clareza em português.
- source_word: צאתו
  choice: em que sai
  rationale: A forma de יצא significa literalmente “sua saída”. A construção verbal mantém a imagem concreta do nascimento e forma paralelo natural com “em que retorna”.
- source_word: מרחם אמו
  choice: do ventre de sua mãe
  rationale: “Ventre” é natural e digno em português, preservando a referência corporal ao útero materno sem tornar a frase excessivamente técnica.
- source_word: עד יום
  choice: até o dia
  rationale: Marca o limite final do período iniciado por מיום e reproduz com naturalidade a estrutura temporal hebraica.
- source_word: שובו
  choice: em que retorna
  rationale: שוב significa “voltar, retornar”. Esta forma conserva o movimento figurado da vida para a morte e o paralelismo com “em que sai”.
- source_word: אל אם כל חי
  choice: à mãe de todos os viventes
  rationale: Preserva a metáfora hebraica sem substituí-la interpretativamente por “terra” ou “sepultura”. “Viventes” mantém o caráter poético e permite a possível ressonância bíblica da expressão כל חי.
theological_decisions:
- issue: Metáfora da morte em “mãe de todos os viventes”
  choice: Manter no texto principal a metáfora materna do hebraico.
  alternative: “à terra”, “à sepultura” ou “até o dia da morte”
  rationale: O testemunho hebraico primário emprega uma imagem poética, enquanto o paralelo grego explicita “o dia da morte”. A tradução preserva a imagem e deixa sua interpretação provável para a nota, sem eliminar possíveis ressonâncias de Gênesis 3:20.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A repetição “desde o dia... até o dia” e o paralelismo “sai... retorna” preservam a estrutura do hebraico; “viventes” conserva o tom poético da metáfora.
