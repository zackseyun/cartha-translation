  text: The fear of God is like a garden of blessing[b][a], and it shelters more than any glory.
translation:
  language: pt
  text: O temor de Deus é como um jardim de bênçãos[a] e oferece mais abrigo do que qualquer glória.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “como um Éden de bênção”; o paralelo grego diz “como um paraíso de bênção”. “Jardim” torna clara a imagem do Éden.'
    reason: lexical_alternative
  - marker: b
    text: 'A oração final é muito concisa no hebraico e admite alguma incerteza. Literalmente, refere-se a cobrir; o paralelo grego apoia a ideia de proteção: “e o cobriu mais do que toda glória”.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאַת אֱלֹהִים
  choice: o temor de Deus
  rationale: Mantém o título divino e o idioma bíblico do hebraico. “Temor” abrange medo reverente e profunda consideração, sem reduzir o sentido apenas a “reverência”.
- source_word: כְּעֵדֶן בְּרָכָה
  choice: como um jardim de bênçãos
  rationale: O hebraico evoca o Éden, e o paralelo grego confirma a imagem de jardim ou paraíso. A formulação comunica essa imagem com clareza em português corrente.
- source_word: וְעַל כָּל כָּבוֹד
  choice: mais ... do que qualquer glória
  rationale: Entende על em sentido comparativo, apoiado pelo grego ὑπὲρ πᾶσαν δόξαν, e preserva “glória” como equivalente direto de כבוד.
- source_word: חָפְתָה
  choice: oferece ... abrigo
  rationale: Expressa de maneira idiomática a imagem hebraica de cobrir e proteger. Evita acrescentar um objeto pessoal que não aparece explicitamente no texto hebraico conservado.
theological_decisions:
- issue: Título divino no texto principal
  choice: Deus
  alternative: Senhor
  rationale: O testemunho hebraico existente traz אֱלֹהִים, “Deus”. O grego paralelo traz “Senhor”, mas aqui o hebraico recebe prioridade.
- issue: Caráter do “temor”
  choice: temor
  alternative: reverência
  rationale: “Temor” preserva a tensão e o idioma bíblico do termo hebraico, sem excluir sua dimensão reverente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural idiomático “bênçãos” comunica abundância, enquanto as notas preservam a forma singular e a concisão do hebraico.
