  text: Children and the building of a city establish a name[b][a], but better than both is a blameless wife.
translation:
  language: pt
  text: Filhos e a construção de uma cidade fazem perdurar o nome[a][b], mas uma esposa irrepreensível é considerada superior a ambos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto hebraico da Guenizá do Cairo traz aproximadamente: “e de ambos procede a sabedoria”; o paralelo grego traz: “mas uma esposa irrepreensível é considerada superior a ambos”. Como o final hebraico parece textualmente incerto, o texto principal segue o sentido mais claro preservado em grego.'
    reason: alternative_reading
  - marker: b
    text: O manuscrito mais antigo de Massada está fragmentário neste ponto e não preserva o suficiente da linha para determinar com segurança sua redação final.
    reason: textual_variant
lexical_decisions:
- source_word: ילד / τέκνα
  choice: Filhos
  rationale: O hebraico ילד tem valor coletivo neste dito sapiencial, e o plural grego τέκνα confirma esse sentido. “Filhos” é natural e preserva a referência à descendência.
- source_word: ועיר יעמידו שם / οἰκοδομὴ πόλεως στηρίζουσιν ὄνομα
  choice: a construção de uma cidade fazem perdurar o nome
  rationale: O hebraico transmitido é difícil; o grego esclarece que se trata da construção de uma cidade. “Fazem perdurar o nome” comunica o idioma hebraico de estabelecer o nome, isto é, assegurar sua continuidade ou renome, sem substituí-lo diretamente por “reputação”.
- source_word: ומשניהם / ὑπὲρ ἀμφότερα
  choice: superior a ambos
  rationale: A construção grega expressa comparação e fornece um sentido coerente para o dito. “Superior a ambos” mantém a avaliação sem acrescentar uma razão não expressa.
- source_word: γυνὴ ἄμωμος
  choice: uma esposa irrepreensível
  rationale: Neste contexto comparativo, γυνή é entendida como esposa. “Irrepreensível” expressa ἄμωμος como caráter sem motivo legítimo de censura, sem sugerir impecabilidade absoluta.
theological_decisions:
- issue: Uso do paralelo grego diante do texto hebraico incerto
  choice: Adotar no texto principal a leitura grega “uma esposa irrepreensível é considerada superior a ambos”.
  alternative: Traduzir o hebraico preservado como “e de ambos procede a sabedoria” ou “e a descoberta da sabedoria vem de ambos”.
  rationale: Embora o hebraico sobrevivente tenha prioridade quando inteligível, מוצא חכמה diverge marcadamente do paralelo grego e parece textualmente instável neste contexto. O grego conserva uma comparação coerente e explícita; a leitura hebraica é mantida em nota para não ocultar a incerteza.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. “Fazem perdurar o nome” conserva de modo natural o valor idiomático de שם, enquanto “esposa irrepreensível” evita tanto linguagem arcaica quanto a ideia excessiva de perfeição sem pecado.
