base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/015.yaml
  text: The offspring of violence will not go unpunished[b][a], for the root of the godless is on a jagged crag.
translation:
  language: pt
  text: O fruto da violência não ficará impune, pois a raiz do ímpio está sobre um rochedo escarpado.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “A descendência dos ímpios não multiplicará ramos, e raízes impuras estão sobre uma rocha escarpada.” Ele sustenta a imagem de um crescimento corrompido, mas difere da redação hebraica preservada.'
    reason: alternative_reading
  - marker: b
    text: A frase hebraica final é difícil. Literalmente, evoca um “dente” de rocha, isto é, uma saliência rochosa aguda ou um rochedo escarpado.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוצר
  choice: fruto
  rationale: No contexto, designa aquilo que é produzido ou brota. “Fruto” preserva a imagem de crescimento e comporta tanto o resultado quanto a descendência, sem restringir indevidamente o sentido.
- source_word: מחמס
  choice: da violência
  rationale: חמס denota violência, injustiça ou opressão. A formulação mantém o valor mais forte e direto do hebraico.
- source_word: לא ינקה
  choice: não ficará impune
  rationale: A expressão negativa comunica não ser absolvido nem escapar da punição; esta é uma formulação judicial clara em português atual.
- source_word: שרש
  choice: raiz
  rationale: Mantém o singular do hebraico e a metáfora vegetal.
- source_word: חנף
  choice: do ímpio
  rationale: O termo pode indicar alguém ímpio, profano ou moralmente corrompido. “Ímpio” preserva sua força moral e religiosa sem reduzi-lo à hipocrisia social.
- source_word: על שן תלע
  choice: sobre um rochedo escarpado
  rationale: A expressão hebraica é difícil; שן, literalmente “dente”, pode descrever uma saliência rochosa aguda, e o paralelo grego confirma a imagem de uma rocha abruptamente cortada.
theological_decisions:
- issue: Prioridade do hebraico diante da divergência do paralelo grego
  choice: 'Traduzir o primeiro membro segundo o hebraico: “O fruto da violência não ficará impune”.'
  alternative: “A descendência dos ímpios não multiplicará seus ramos”.
  rationale: Como o hebraico está preservado, ele orienta o texto principal. O grego testemunha uma formulação diferente, mas relacionada, e por isso é registrado em nota, sem substituir o hebraico.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Fruto da violência” conserva a ambiguidade entre produto e descendência; “rochedo escarpado” torna natural a imagem obscura sem apagar sua dificuldade, esclarecida em nota.
