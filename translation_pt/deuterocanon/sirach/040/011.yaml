base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/011.yaml
  text: Everything from the earth returns to the earth[a], and what is from above to what is above.
translation:
  language: pt
  text: Tudo o que vem da terra volta à terra[a], e o que vem do alto volta ao alto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “e das águas volta ao mar”.'
    reason: alternative_reading
lexical_decisions:
- source_word: כל
  choice: Tudo
  rationale: O coletivo hebraico é abrangente, como confirma o grego πάντα ὅσα. “Tudo” é natural em português e não restringe a referência a pessoas.
- source_word: מארץ אל ארץ
  choice: o que vem da terra volta à terra
  rationale: A expressão indica origem e retorno. A inserção idiomática de “vem” explicita a relação de procedência já contida na construção hebraica.
- source_word: ישוב
  choice: volta
  rationale: שוב significa comumente “voltar, retornar”. “Volta” preserva com clareza e naturalidade a ideia de retorno.
- source_word: ואשר
  choice: e o que
  rationale: O relativo é entendido de modo não pessoal, em harmonia com o paralelismo amplo e cósmico.
- source_word: ממרום אל מרום
  choice: do alto volta ao alto
  rationale: מרום designa altura ou região elevada. A formulação conserva a repetição e a imagem vertical do hebraico sem especificar indevidamente “céu”. O verbo “volta”, elíptico no segundo membro, é retomado do primeiro para produzir português natural.
theological_decisions:
- issue: Divergência entre o segundo membro hebraico e o paralelo grego
  choice: 'O texto principal segue o hebraico: “e o que vem do alto volta ao alto”.'
  alternative: 'O grego traz: “e das águas volta ao mar”.'
  rationale: Como há texto hebraico extante e de alta confiança, ele permanece como testemunho principal. Sua formulação concisa e enigmática é preservada sem harmonização; a leitura grega materialmente distinta é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição “terra... terra” e “alto... alto” reproduz o paralelismo do hebraico; evita-se interpretar מרום especificamente como “céu”.
