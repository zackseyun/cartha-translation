base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/001.yaml
  text: Great toil is allotted[c][b][a], and a heavy burden upon the children of man—from the day they come forth from their mother’s womb until the day they return to the mother of all.
translation:
  language: pt
  text: Grande labuta foi destinada, e um fardo pesado[a] recai sobre os seres humanos — desde o dia em que saem do ventre de sua mãe até o dia em que são sepultados na mãe de todos.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: “um jugo pesado”. O hebraico é mais condensado.'
    reason: lexical_alternative
  - marker: b
    text: A continuação, desde “desde o dia”, encontra-se no paralelo grego; o testemunho hebraico aqui é mais curto.
    reason: alternative_reading
  - marker: c
    text: “A mãe de todos” é uma figura para a terra, destino comum dos que são sepultados. O grego também traz “filhos de Adão”; o hebraico בני אדם significa mais literalmente “filhos de homem”, isto é, seres humanos.
    reason: cultural_note
lexical_decisions:
- source_word: עסק גדול
  choice: Grande labuta
  rationale: A expressão hebraica denota ocupação penosa, trabalho fatigante ou aflição. “Labuta” transmite de modo natural o esforço árduo e contínuo, em consonância com o grego ἀσχολία μεγάλη.
- source_word: חלק אל
  choice: foi destinada
  rationale: O hebraico transmitido é conciso e difícil. A forma passiva preserva a ideia de porção ou destino atribuído sem identificar de maneira indevidamente explícita quem o atribui; o paralelo grego apresenta a condição como estabelecida para todo ser humano.
- source_word: ועל כבד
  choice: e um fardo pesado recai
  rationale: O hebraico é elíptico, enquanto o grego traz ζυγὸς βαρύς, literalmente “jugo pesado”. “Fardo pesado recai” comunica com clareza o peso imposto, sem exigir no texto principal a metáfora específica do jugo.
- source_word: על בני אדם
  choice: sobre os seres humanos
  rationale: בני אדם designa coletivamente os seres humanos e também pode evocar Adão. Esta formulação é clara e abrangente em português atual; a ressonância adâmica é registrada na nota.
- source_word: ἀφʼ ἡμέρας ἐξόδου ἐκ γαστρὸς μητρὸς αὐτῶν
  choice: desde o dia em que saem do ventre de sua mãe
  rationale: A continuação, preservada no paralelo grego, descreve concretamente o começo da vida. A tradução mantém a imagem do texto em linguagem portuguesa corrente.
- source_word: ἕως ἡμέρας ἐπὶ ταφῇ εἰς μητέρα πάντων
  choice: até o dia em que são sepultados na mãe de todos
  rationale: O grego menciona expressamente o dia do sepultamento. A tradução conserva tanto esse sentido quanto a figura da terra como “mãe de todos”, sem acrescentar ao texto a ideia verbal de “retorno”.
theological_decisions:
- issue: Uso do paralelo grego mais extenso ao lado do testemunho hebraico abreviado
  choice: Traduzir a afirmação hebraica e incluir a continuação grega que vai do nascimento ao sepultamento, assinalando sua origem em nota.
  alternative: Traduzir somente a cláusula hebraica mais curta.
  rationale: O hebraico sobrevivente é a testemunha principal, mas o paralelo grego preserva uma continuação coerente e antiga. A nota torna transparente a diferença textual, sem ocultá-la nem tratar a expansão como se constasse do hebraico fornecido.
- issue: Sentido antropológico de בני אדם / υἱοὺς Ἀδάμ
  choice: seres humanos
  alternative: filhos de Adão
  rationale: “Seres humanos” expressa naturalmente o referente coletivo do hebraico em português moderno. A tradução literal e sua possível ressonância adâmica permanecem visíveis na nota, evitando ao mesmo tempo a ambiguidade cristológica que “filhos do homem” poderia criar.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. “Labuta” conserva o peso existencial do original; “recai sobre” torna natural a construção elíptica. A diferença entre o hebraico curto e o grego mais completo é explicitada em nota.
