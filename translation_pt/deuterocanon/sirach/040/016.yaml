  text: Like brushwood on a streamside planting[b][a], before every rain they are dried up.
translation:
  language: pt
  text: Como vegetação rasteira em plantações à beira de um riacho[a][b], eles secam diante de toda chuva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico כקרדמות é incerto. O paralelo grego descreve vegetação junto à água e à margem de um rio que é arrancada rapidamente. “Vegetação rasteira” representa um crescimento baixo e frágil sem pretender identificar uma planta específica.
    reason: lexical_alternative
  - marker: b
    text: O antigo testemunho de Massada parece conservar neste ponto uma leitura consideravelmente diferente da dos manuscritos hebraicos da Guenizá do Cairo aqui seguidos. Como o trecho de Massada disponível é fragmentário, o texto principal acompanha a leitura do Cairo e registra a incerteza textual.
    reason: textual_variant
lexical_decisions:
- source_word: כקרדמות
  choice: como vegetação rasteira
  rationale: O termo hebraico é raro e incerto. A expressão evita identificar uma espécie específica e comunica vegetação baixa e frágil, em consonância com o paralelo grego.
- source_word: על מטעי נחל
  choice: junto às plantações de um riacho
  rationale: מטעי designa plantações ou plantas cultivadas, e נחל um curso de água, riacho ou leito de torrente. A formulação preserva tanto a imagem agrícola quanto a localização junto à água.
- source_word: מפני כל מטר
  choice: diante de toda chuva
  rationale: A tradução mantém a amplitude de מפני, que pode indicar estar diante de, em face de ou sob o efeito de algo, sem definir além do necessário a relação causal ou temporal.
- source_word: נדעכו
  choice: eles secam
  rationale: O verbo exprime apagar-se, extinguir-se ou definhar. No contexto vegetal, 'secam' é natural e preserva a ideia de perda de vigor e desaparecimento.
