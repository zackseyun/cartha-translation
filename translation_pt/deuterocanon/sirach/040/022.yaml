  text: Grace and beauty delight the eye[b][a], and better than both is the vegetation of the field.
translation:
  language: pt
  text: A beleza e a boa aparência[a] agradam aos olhos, mas melhor do que ambas é a vegetação do campo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «forma/aparência»; o paralelo grego traz «graça». Também se pode traduzir: «A beleza e a aparência agradam aos olhos».'
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz literalmente «brotos/crescimentos do campo»; o paralelo grego fala da «verdejante brotação da semente/lavoura», indicando vegetação nova, não produto já colhido.
    reason: alternative_reading
lexical_decisions:
- source_word: יפי
  choice: beleza
  rationale: O substantivo denota beleza ou atratividade; «beleza» é a equivalência portuguesa mais direta e natural.
- source_word: ותאר
  choice: boa aparência
  rationale: תאר designa forma ou aparência. «Boa aparência» mantém o sentido do hebraico, enquanto a nota registra a leitura paralela grega «graça».
- source_word: יחמידו עין
  choice: agradam aos olhos
  rationale: O verbo חמד pode expressar desejo ou prazer. A formulação idiomática portuguesa comunica o encanto visual sem a conotação excessivamente negativa de «cobiçar».
- source_word: ומשניהם
  choice: mas melhor do que ambas
  rationale: O hebraico é conciso, literalmente «e, dentre/além das duas»; o paralelo grego explicita a comparação com ὑπὲρ ἀμφότερα. «Mas melhor do que ambas» torna clara a relação comparativa.
- source_word: צמחי שדה
  choice: a vegetação do campo
  rationale: צמחי refere-se ao que brota ou cresce. «Vegetação do campo» é natural em português e preserva a imagem do crescimento vegetal, corroborada pelo grego χλόην σπόρου.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural idiomático «aos olhos» representa o singular hebraico «ao olho». A adversativa «mas» expressa com naturalidade o contraste comparativo da segunda oração.
