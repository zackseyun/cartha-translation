  source_fidelity: O primeiro segmento é textualmente muito incerto no hebraico, e o texto principal pode seguir legitimamente o grego, como faz a proposta. No segundo segmento, porém, o grego traz οὕτως (“assim/desse modo”), não uma adversativa. O hebraico também sustenta “de repente” e “para sempre”, embora esses elementos não apareçam no grego paralelo.
  naturalness: “Chegarão de repente ao fim, para sempre” é compreensível, mas pouco idiomático em português atual. “Desaparecerão de repente, para sempre” comunica com mais naturalidade a ideia de cessar/desaparecer, sem especificar o modo da destruição.
  terminology: “Transgressores” é apropriado, conciso e preserva o registro sapiencial. “Quando ele abre as mãos” é natural e corresponde à leitura grega adotada. As notas devem caracterizar Massada como testemunho fragmentário, não como “leitura fragmentária”.
  issues:
  - severity: medium
    issue: “mas” substitui a relação expressa por οὕτως no grego.
    rationale: οὕτως significa “assim”, “desse modo” ou, conforme a fluência, “do mesmo modo”; não fornece base para uma oposição explícita. “Assim” preserva a ligação sem impor contraste ou causalidade mais definida.
  - severity: low
    issue: “chegarão de repente ao fim, para sempre” soa truncado.
    rationale: A ordem proposta distancia “de repente” do verbo e faz “para sempre” qualificar de modo pouco natural “chegarão ao fim”. “Desaparecerão de repente, para sempre” conserva a finalidade duradoura e a súbita cessação.
  - severity: low
    issue: A nota b chama o testemunho de Massada de “leitura fragmentária”.
    rationale: É mais preciso dizer que Massada preserva apenas um fragmento, pois se trata do estado material/textual do testemunho.
