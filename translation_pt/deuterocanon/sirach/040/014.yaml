    reason: textual_variant
lexical_decisions:
- source_word: שאתו כפים / ἐν τῷ ἀνοῖξαι αὐτὸν χεῖρας
  choice: Quando ele abre as mãos
  rationale: O hebraico preservado é difícil e provavelmente instável neste ponto; o paralelo grego traz com clareza a ideia de abrir as mãos. A formulação portuguesa é natural e mantém a oração temporal.
- source_word: עם עם / εὐφρανθήσεται
  choice: eles se alegram
  rationale: A leitura hebraica é obscura e pode envolver povo e saque, enquanto o grego indica alegria. O texto principal segue aqui o testemunho grego mais inteligível, e a divergência hebraica é registrada em nota.
- source_word: פתאם
  choice: de repente
  rationale: Expressa diretamente a ideia hebraica de algo súbito ou inesperado.
- source_word: לנצח
  choice: para sempre
  rationale: Conserva o sentido normal de duração permanente e a força de finalidade presente no contexto.
- source_word: יתם / ἐκλείψουσιν
  choice: chegarão ao fim
  rationale: Tanto o hebraico quanto o grego apontam para cessar ou desaparecer. A expressão evita especificar indevidamente uma forma violenta de destruição.
- source_word: οἱ παραβαίνοντες
  choice: os transgressores
  rationale: O grego identifica explicitamente os que transgridem como sujeito. O termo português é conciso, digno e não acrescenta uma referência legal ausente da expressão.
theological_decisions:
- issue: Uso do paralelo grego onde o hebraico é textualmente difícil
  choice: O texto principal segue o sentido claro do grego no primeiro segmento, sem ocultar a divergência do hebraico.
  alternative: Uma tradução ou reconstrução mais estritamente baseada no hebraico mencionaria povo e saque.
  rationale: O hebraico sobrevivente tem prioridade quando seguro, mas o primeiro segmento deste versículo é obscuro e diverge substancialmente do grego. As notas preservam a incerteza em vez de apresentar a opção grega como indiscutível.
- issue: Relação entre os dois segmentos
  choice: mas
  alternative: assim / por isso
  rationale: Os textos não apresentam uma conjunção inequívoca que resolva a relação lógica. “Mas” expressa de modo prudente o contraste entre a alegria inicial e o fim dos transgressores, sem afirmar uma causalidade explícita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. As notas tornam explícita a instabilidade textual sem sobrecarregar o versículo.
