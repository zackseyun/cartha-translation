revisions:
- from: Quando ele abre as mãos, eles se alegram[a][b]; mas os transgressores chegarão de repente ao fim, para sempre.
  to: Quando ele abre as mãos, eles se alegram[a][b]; assim os transgressores desaparecerão de repente, para sempre.
  rationale: A revisão substitui a adversativa “mas” por “assim”, que corresponde ao grego οὕτως e evita acrescentar uma relação contrastiva não explicitada. Também torna a expressão do desaparecimento final mais idiomática em português, mantendo “de repente” e “para sempre”, atestados no hebraico. As notas continuam a documentar com transparência a forte divergência textual do primeiro segmento.
