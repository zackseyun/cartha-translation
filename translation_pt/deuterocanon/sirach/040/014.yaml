  text: At the opening of his hands they will rejoice[b][a], but the transgressors will suddenly come to an end forever.
translation:
  language: pt
  text: Quando ele abre as mãos, eles se alegram[a][b]; assim os transgressores desaparecerão de repente, para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O primeiro segmento do hebraico é difícil e talvez reflita outra leitura, envolvendo aproximadamente “povo” e “saquear”. O grego diz: “Quando ele abre as mãos, eles se alegram”.'
    reason: alternative_reading
  - marker: b
