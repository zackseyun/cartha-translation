base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/006.yaml
  text: For a little while[a], like a moment, he is quiet in vain; then, from the terrors of his heart[b], he is shaken—like one fleeing from before a pursuer.
translation:
  language: pt
  text: Por um breve tempo[a], como por um instante, ele repousa em vão; então, em meio aos terrores do seu coração[b], fica abalado — como alguém que foge de seu perseguidor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico é difícil na segunda metade do versículo. A leitura dos manuscritos da Guenizá do Cairo compara quem dorme a alguém que foge de um perseguidor; o texto grego traz, de modo semelhante, «como quem escapou da presença da guerra».
    reason: textual_variant
  - marker: b
    text: 'Em algumas disposições das linhas, o testemunho hebraico contém palavras adicionais a respeito de uma visão da alma; o texto grego amplia a ideia com «em sonhos, como num dia de vigília». A tradução principal segue o sentido comum mais claro: o repouso é breve, e o terror interior logo retorna.'
    reason: alternative_reading
lexical_decisions:
- source_word: מעט
  choice: por um breve tempo
  rationale: O termo hebraico tem aqui valor temporal e ressalta a curta duração do repouso; a formulação é natural em português e preserva essa brevidade.
- source_word: לריק
  choice: em vão
  rationale: A expressão indica que o breve repouso é inútil ou não traz verdadeiro alívio.
- source_word: כרגע
  choice: como por um instante
  rationale: Preserva a comparação introduzida por כ e comunica com naturalidade a duração momentânea.
- source_word: ישקוט
  choice: ele repousa
  rationale: O verbo denota quietude ou descanso. No contexto do sono e da agitação subsequente, «repousa» é claro e idiomático.
- source_word: ומבין
  choice: então, em meio aos
  rationale: A construção hebraica é difícil. Esta redação liga a agitação aos terrores interiores sem impor uma análise excessivamente precisa do elemento textual incerto.
- source_word: בהלות לבו
  choice: os terrores do seu coração
  rationale: בהלות pode indicar terrores, sobressaltos ou pânico; «do seu coração» mantém a origem interior da perturbação.
- source_word: נרעש
  choice: fica abalado
  rationale: O verbo expressa forte agitação, que pode ser emocional e corporal; «fica abalado» conserva essa amplitude.
- source_word: כשריד בורח מפני רודף
  choice: como alguém que foge de seu perseguidor
  rationale: Embora a frase tenha dificuldades textuais, a imagem central é a fuga apavorada diante de quem persegue. A tradução preserva essa imagem sem decidir de modo indevido o sentido mais incerto de כשריד.
