base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/026.yaml
  text: Wealth and strength lift up the heart[a], and the fear of God is beyond both. In the fear of God there is no lack[b], and there is no need to seek support along with it.
translation:
  language: pt
  text: A riqueza e a força elevam o coração, e o temor de Deus está acima de ambas.[a] No temor de Deus não há falta, e não há necessidade de buscar apoio junto com ele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é maior que ambas” ou “é melhor que ambas”. O hebraico diz literalmente “e, de ambas”, numa construção que, no contexto, indica que o temor de Deus supera a riqueza e a força.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e não é preciso buscar apoio junto com ele”. A frase indica que o temor de Deus é suficiente e não requer um apoio adicional.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חיל
  choice: riqueza
  rationale: No paralelismo com כח (“força”), indica mais naturalmente recursos ou bens materiais; o grego χρήματα confirma o sentido econômico.
- source_word: כח
  choice: força
  rationale: Equivalente direto e abrangente, em consonância com o grego ἰσχύς.
- source_word: יגדלו לב
  choice: elevam o coração
  rationale: Preserva a metáfora hebraica sem decidir se a elevação é confiança legítima ou orgulho.
- source_word: ומשניהם
  choice: está acima de ambas
  rationale: Expressa o valor comparativo indicado pelo contexto e confirmado pelo grego ὑπὲρ ἀμφότερα, mantendo a comparação com riqueza e força.
- source_word: יראת אלהים
  choice: o temor de Deus
  rationale: Mantém o termo explícito אלהים (“Deus”) e o peso do motivo sapiencial, sem reduzi-lo apenas a respeito ou reverência.
- source_word: מחסור
  choice: falta
  rationale: Reproduz de modo natural a ideia de carência ou deficiência.
- source_word: ואין לבקש עמה משען
  choice: e não é preciso buscar outro apoio além dele
  rationale: 'Comunica em português natural a suficiência do temor de Deus: não se necessita de um apoio adicional. A nota preserva a construção mais literal com עמה (“junto com ele”).'
theological_decisions:
- issue: Tradução de יראת אלהים
  choice: o temor de Deus
  alternative: a reverência a Deus
  rationale: “Temor de Deus” preserva a amplitude e a tensão do motivo bíblico, que envolve reverência, assombro, obediência e santo temor, sem abrandá-lo.
- issue: Suficiência do temor de Deus no segundo hemistíquio
  choice: não é preciso buscar outro apoio além dele
  alternative: não se deve buscar apoio junto com ele
  rationale: A formulação principal torna clara a suficiência expressa pelo hebraico, sem identificar dogmaticamente a natureza desse apoio; a alternativa mais literal é registrada em nota.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A metáfora “elevam o coração” foi mantida para não resolver como coragem ou orgulho aquilo que o hebraico deixa em aberto. Empregou-se “Deus”, conforme o texto hebraico, embora o paralelo grego tenha “Senhor”.
