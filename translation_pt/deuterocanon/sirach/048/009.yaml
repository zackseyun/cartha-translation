  text: who was taken up into the heavens in a storm[a], and in ranks of fire.
translation:
  language: pt
  text: que foi levado aos céus numa tempestade[a] e em fileiras de fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: «que foi levado numa tempestade de fogo, num carro puxado por cavalos de fogo». Essa formulação mais completa torna mais explícita a alusão a Elias em 2 Reis 2:11.'
    reason: Leitura alternativa do paralelo grego.
lexical_decisions:
- source_word: הנלקח
  choice: que foi levado
  rationale: O particípio passivo de לקח indica que Elias foi tomado e transportado; o contexto da subida e o paralelo grego sustentam esse sentido sem exigir acrescentar um verbo mais específico.
- source_word: בסערה
  choice: numa tempestade
  rationale: סערה designa tempestade ou vento tempestuoso. «Tempestade» preserva a amplitude do termo hebraico sem harmonizá-lo automaticamente com a formulação tradicional «redemoinho» de 2 Reis 2:11.
- source_word: מעלה ... שמים
  choice: aos céus
  rationale: מעלה exprime movimento para cima, enquanto שמים fornece a referência celeste. A formulação portuguesa reúne naturalmente esses elementos e mantém o plural do hebraico.
- source_word: ובגדודי אש
  choice: e em fileiras de fogo
  rationale: גדודים significa grupos organizados, tropas ou fileiras; o hebraico preservado não menciona explicitamente carros nem cavalos. «Fileiras» conserva a imagem incomum sem importar a leitura grega mais desenvolvida.
theological_decisions:
- issue: Se o texto hebraico deve ser harmonizado com 2 Reis 2:11 e com a forma grega mais explícita
  choice: 'Manter no texto principal a imagem do hebraico: «aos céus numa tempestade ... em fileiras de fogo».'
  alternative: «numa tempestade de fogo, num carro de cavalos de fogo»
  rationale: A testemunha hebraica existente tem prioridade e não contém termos explícitos para «carro» ou «cavalos». A leitura grega é relevante e esclarece a alusão a Elias, mas é apresentada em nota para não substituir silenciosamente a formulação hebraica.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. «Aos céus» é idiomático para o movimento ascendente; «fileiras de fogo» retém deliberadamente a imagem incomum da testemunha hebraica. O marcador [a] aparece no texto principal.
