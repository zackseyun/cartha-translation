  text: Then a prophet arose like fire[b][a], and his words were like a burning furnace.
translation:
  language: pt
  text: Então se levantou um profeta como fogo[a], e suas palavras eram como uma fornalha ardente.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: «Então se levantou o profeta Elias como fogo». O hebraico diz apenas «um profeta», embora o contexto se refira claramente a Elias.'
    reason: alternative_reading
  - marker: b
    text: 'O paralelo grego diz: «e sua palavra ardia como uma tocha». O hebraico traz: «e suas palavras eram como uma fornalha ardente».'
    reason: textual_variant
lexical_decisions:
- source_word: עד אשר
  choice: Então
  rationale: Embora a expressão possa significar literalmente «até que», aqui ela introduz, em sequência narrativa, o surgimento do profeta. «Então» comunica esse avanço com naturalidade sem criar, no versículo isolado, uma oração temporal incompleta.
- source_word: קם
  choice: se levantou
  rationale: Reproduz o sentido básico do verbo e, neste contexto, expressa de modo digno o surgimento público de uma figura profética.
- source_word: נביא
  choice: um profeta
  rationale: O hebraico não traz o nome próprio neste versículo. O artigo indefinido preserva sua formulação, embora o contexto identifique o profeta como Elias.
- source_word: כאש
  choice: como fogo
  rationale: Mantém diretamente a comparação vívida do hebraico, também atestada no paralelo grego.
- source_word: ודבריו
  choice: e suas palavras
  rationale: Conserva o plural explícito do texto hebraico, sem harmonizá-lo com o singular do grego.
- source_word: כתנור בוער
  choice: como uma fornalha ardente
  rationale: «Fornalha» transmite com força poética a imagem de תנור, e «ardente» representa בוער de forma natural e concisa em português.
theological_decisions:
- issue: Identificar explicitamente o profeta como Elias no texto principal
  choice: Manter «um profeta», conforme o hebraico, e registrar em nota que o grego o identifica como Elias.
  alternative: «Então se levantou o profeta Elias como fogo.»
  rationale: O testemunho hebraico primário não inclui o nome, embora o contexto e o paralelo grego deixem clara a referência. A tradução não deve inserir no texto principal uma identificação ausente de sua fonte primária.
- issue: Harmonizar a segunda parte com a imagem grega da tocha
  choice: Conservar o plural «palavras» e a imagem hebraica da «fornalha ardente».
  alternative: «e sua palavra ardia como uma tocha».
  rationale: Há diferença material de número, construção verbal e imagem entre os testemunhos. Como o hebraico está preservado e é a fonte principal, sua leitura permanece no texto, enquanto a variante grega é documentada em nota.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A formulação conserva o paralelismo poético e as imagens fortes do hebraico, sem explicitar no corpo do texto aquilo que aparece apenas no testemunho grego.
