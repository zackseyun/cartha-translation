  text: You made heard at Sinai rebukes[a], and at Horeb judgments of vengeance.
translation:
  language: pt
  text: No Sinai, fizeste ouvir repreensões[a] e, no Horebe, juízos de vingança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego apresenta aqui uma leitura substancialmente diferente, com o sentido: «ungindo reis para a retribuição e profetas como sucessores depois dele». O hebraico e o grego parecem refletir formas textuais distintas deste versículo.'
    reason: textual_variant
lexical_decisions:
- source_word: השמע
  choice: fizeste ouvir
  rationale: O hifil de שמע tem sentido causativo, «fazer ouvir». A formulação preserva esse valor do hebraico sem substituí-lo por uma interpretação como «proclamaste».
- source_word: בסיני
  choice: no Sinai
  rationale: A preposição ב com o nome de lugar indica aqui o local do acontecimento; «no Sinai» é a forma natural em português.
- source_word: תוכחות
  choice: repreensões
  rationale: תוכחות designa censuras ou admoestações corretivas. «Repreensões» conserva o tom forte e é claro em português atual.
- source_word: ובחורב
  choice: e, no Horebe
  rationale: Mantém a coordenação do hebraico e expressa naturalmente o local em português.
- source_word: משפטי
  choice: juízos de
  rationale: O plural em estado construto de משפט é representado diretamente por «juízos de», preservando sua ligação formal com o substantivo seguinte.
- source_word: נקם
  choice: vingança
  rationale: נקם significa vingança ou ato de vingar. «Vingança» é o equivalente lexical mais direto, sem atenuar o caráter punitivo da expressão.
theological_decisions:
- issue: Divergência textual entre o testemunho hebraico e o paralelo grego em Eclesiástico 48:8
  choice: 'O texto principal segue o hebraico conservado: «No Sinai, fizeste ouvir repreensões e, no Horebe, juízos de vingança.»'
  alternative: 'O grego traz, em sentido aproximado: «ungindo reis para a retribuição e profetas como sucessores depois dele».'
  rationale: Como o hebraico está preservado e possui alta confiança, ele serve de base para o texto principal. A leitura grega não é mera variação estilística, mas parece refletir outra forma textual; por isso, é registrada em nota sem harmonização.
translation_notes:
  register: Português moderno, digno e de leitura natural, com preferência por «fizeste» para preservar a referência direta na segunda pessoa. A ordem foi levemente ajustada, antepondo os locais, para dar fluidez e equilíbrio à frase sem alterar as relações do hebraico.
