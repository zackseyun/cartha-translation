  text: who raised up a corpse from death[a], and from Sheol, by the will of Yahweh.
translation:
  language: pt
  text: que levantou um morto da morte e do Sheol, pela vontade do SENHOR.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz: “pela palavra do Altíssimo”. O testemunho hebraico diz: “pela vontade do SENHOR”.'
    reason: textual_variant
lexical_decisions:
- source_word: המקים
  choice: que levantou
  rationale: O particípio hifil de קום descreve Elias fazendo o morto voltar à vida. “Levantou” conserva a imagem do hebraico sem impor terminologia teológica posterior.
- source_word: גוע ממות
  choice: da morte um morto
  rationale: גוע designa alguém que expirou, e מן é separativo. A formulação mantém a expressão poética compacta e a aparente redundância do hebraico.
- source_word: ומשאול
  choice: e o tirou do Sheol
  rationale: A repetição verbal implícita é explicitada em português para evitar que “levantou ... do Sheol” soe truncado. “Sheol” preserva o universo conceitual israelita, sem reduzi-lo apenas à sepultura nem identificá-lo com concepções posteriores de inferno.
- source_word: כרצון יהוה
  choice: pela vontade do SENHOR
  rationale: O testemunho hebraico traz literalmente “segundo/pela vontade de YHWH”. “SENHOR” segue a convenção reverente para o nome divino.
theological_decisions:
- issue: Fórmula de ação divina no fim do versículo
  choice: pela vontade do SENHOR
  alternative: pela palavra do Altíssimo
  rationale: O hebraico, adotado como fonte principal, lê כרצון יהוה; o paralelo grego lê ἐν λόγῳ Ὑψίστου. A variante grega é registrada em nota para preservar a diferença teológica e textual.
translation_notes:
  register: Português atual, digno e de ampla compreensão. A construção poética conserva o paralelismo hebraico; “o tirou” explicita apenas o verbo subentendido na segunda oração. O marcador [a] aparece após a primeira oração, sinalizando a variante que afeta a formulação da agência divina.
