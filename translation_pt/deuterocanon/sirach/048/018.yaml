base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/018.yaml
  text: In his days Sennacherib came up and sent Rabshakeh[a]; he stretched out his hand against Zion and blasphemed in his pride.
translation:
  language: pt
  text: Em seus dias, Senaqueribe subiu e enviou Rabsaqué. Ele estendeu a mão contra Sião e blasfemou em seu orgulho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz: “e se vangloriou em sua arrogância”. O testemunho hebraico fala de blasfêmia, leitura seguida no texto principal.'
    reason: alternative_reading
lexical_decisions:
- source_word: עלה
  choice: subiu
  rationale: Preserva o sentido básico do hebraico e sua nuance de avanço militar, também refletida no paralelo grego.
- source_word: וישלח
  choice: enviou
  rationale: Tradução direta e natural de שלח no contexto narrativo.
- source_word: רבשקה
  choice: Rabsaqué
  rationale: Emprega a forma tradicional em português para o título ou nome assírio, sem acrescentar artigo ausente neste testemunho hebraico.
- source_word: ויט ידו
  choice: estendeu a mão
  rationale: Conserva a imagem idiomática hebraica de um gesto ou ato hostil, sem explicá-la em excesso.
- source_word: על ציון
  choice: contra Sião
  rationale: No contexto de agressão, על tem sentido adversativo; “contra” comunica isso com clareza.
- source_word: ויגדף
  choice: blasfemou
  rationale: Preserva a força religiosa do verbo, que descreve fala injuriosa ou irreverente, mais forte que simples insulto.
- source_word: אל
  choice: objeto não explicitado em português
  rationale: A construção hebraica pode apontar para o objeto da blasfêmia, possivelmente Deus, ou ser elíptica. A tradução não acrescenta um objeto que o texto não identifica sem ambiguidade.
- source_word: בגאונו
  choice: em seu orgulho
  rationale: Expressa de modo conciso e natural a exaltação arrogante indicada por גאון.
theological_decisions:
- issue: Relação entre o final hebraico, que fala de blasfêmia, e o paralelo grego, que fala de vanglória arrogante
  choice: 'Seguir o testemunho hebraico no texto principal: “blasfemou em seu orgulho”.'
  alternative: “vangloriou-se em sua arrogância”
  rationale: O hebraico preservado tem prioridade e apresenta explicitamente a ideia de fala blasfema. A diferença real do grego é mantida em nota, sem apagar a tensão textual.
- issue: Objeto implícito da blasfêmia
  choice: Não explicitar “contra Deus” no texto principal.
  alternative: “blasfemou contra Deus em seu orgulho”
  rationale: Embora o contexto favoreça uma afronta a Deus, a sintaxe do testemunho hebraico não exige que o objeto seja suprido de forma inequívoca; a tradução preserva essa abertura.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas bíblicas tradicionais em português para os nomes próprios. A repetição de “Ele” inicia a segunda oração com clareza, enquanto a linguagem figurada de “estendeu a mão” é preservada.
