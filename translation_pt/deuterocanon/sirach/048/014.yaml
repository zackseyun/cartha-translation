translation:
  language: pt
  text: Em vida, ele fez maravilhas; e, em sua morte, seus feitos foram maravilhosos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, seguindo mais de perto o grego: “e, em seu fim, seus feitos foram maravilhosos”. O hebraico diz “em sua morte”; a forma da expressão final é um pouco difícil, mas o grego confirma o sentido de feitos extraordinários ligados à sua morte.'
    reason: alternative_reading
lexical_decisions:
- source_word: בחייו
  choice: Em vida
  rationale: A construção com ב é temporal e designa o período da vida de Eliseu. “Em vida” é conciso, natural em português e corresponde ao grego ἐν ζωῇ αὐτοῦ.
- source_word: עשה
  choice: fez
  rationale: Preserva a simplicidade do verbo hebraico comum עשה; o caráter extraordinário da ação já é expresso pelo objeto “maravilhas”.
- source_word: נפלאות
  choice: maravilhas
  rationale: Expressa atos extraordinários ou prodigiosos e mantém a linguagem bíblica corrente sem acrescentar uma interpretação específica.
- source_word: ובמותו
  choice: e, em sua morte
  rationale: Segue prioritariamente o hebraico, que diz literalmente “em sua morte”. O grego traz “em seu fim”, registrado como alternativa na nota.
- source_word: תמהי
  choice: foram maravilhosos
  rationale: Embora a forma hebraica seja um pouco difícil, o contexto e o grego θαυμάσια confirmam a ideia de algo extraordinário, capaz de causar admiração.
- source_word: מעשה
  choice: seus feitos
  rationale: A forma hebraica de aparência singular pode ter sentido coletivo, confirmado pelo plural grego τὰ ἔργα αὐτοῦ. “Seus feitos” é mais natural neste contexto do que “suas obras” e se refere aos atos ligados à morte de Eliseu.
theological_decisions:
- issue: Uso do testemunho hebraico primário diante da dificuldade formal na cláusula final
  choice: Manter “em sua morte” conforme o hebraico e usar o grego para confirmar o sentido de que seus feitos foram maravilhosos.
  alternative: 'Seguir mais diretamente o grego: “e, em seu fim, seus feitos foram maravilhosos”.'
  rationale: O hebraico sobrevivente deve permanecer prioritário. O paralelo grego não exige substituir sua leitura, mas ajuda a estabilizar o sentido da forma difícil תמהי e do coletivo מעשה, preservando a associação dos feitos extraordinários com a morte de Eliseu.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição entre “maravilhas” e “maravilhosos” preserva o paralelismo sem ocultar a correspondência semântica do hebraico e do grego.
