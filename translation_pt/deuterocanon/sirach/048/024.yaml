  text: By a spirit of might he saw the end[b][a], and he comforted the mourners of Zion.
translation:
  language: pt
  text: Por um espírito de poder, ele viu o fim[a] e consolou os enlutados de Sião.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: “com um grande espírito, ele viu as últimas coisas”. O hebraico diz: “por um espírito de poder, ele viu o fim”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “os que estavam de luto em Sião”, seguindo mais de perto o paralelo grego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ברוח
  choice: Por um espírito
  rationale: A preposição ב pode indicar meio ou esfera. “Por um espírito” preserva a provável nuance instrumental do hebraico e corresponde ao dativo grego πνεύματι.
- source_word: גבורה
  choice: de poder
  rationale: גבורה expressa força, poder ou valentia. “Poder” é claro e digno em português, sem substituir a leitura hebraica pelo grego “grande”.
- source_word: חזה
  choice: viu
  rationale: O verbo designa ver, muitas vezes em sentido visionário ou profético. “Viu” traduz diretamente o hebraico e permite que o contexto comunique essa nuance.
- source_word: אחרית
  choice: o fim
  rationale: אחרית pode indicar fim, desfecho ou futuro. “O fim” mantém a concisão e concorda com o paralelo grego τὰ ἔσχατα, sem eliminar a amplitude escatológica ou temporal.
- source_word: וינחם
  choice: e consolou
  rationale: Neste contexto, a forma de נחם significa dar consolo. “Consolou” é natural e corresponde bem ao grego παρεκάλεσεν.
- source_word: אבלי ציון
  choice: os enlutados de Sião
  rationale: 'A expressão preserva a construção compacta do hebraico e sua possível ambiguidade: pessoas enlutadas por Sião ou pertencentes a Sião. O grego favorece a localização “em Sião”, registrada em nota.'
theological_decisions:
- issue: Natureza da inspiração profética em ברוח גבורה
  choice: Por um espírito de poder
  alternative: Com um grande espírito
  rationale: O texto hebraico apresenta o espírito como caracterizado por poder, enquanto o grego diz literalmente “com/em um grande espírito”. A tradução principal segue o hebraico, e a nota preserva a leitura paralela sem definir além do texto a identidade ou a operação desse espírito.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e o paralelismo do hebraico foram mantidos, e as diferenças relevantes do grego aparecem nas notas.
