base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/022.yaml
  text: For Hezekiah did what was good[a], and was strong in the ways of David, as Isaiah the prophet commanded him[b], the one praised among the prophets.
translation:
  language: pt
  text: Pois Ezequias fez o que era bom[a] e foi firme nos caminhos de Davi, conforme lhe ordenou o profeta Isaías[b], aquele que é louvado entre os profetas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “fez o que era agradável ao Senhor”. O hebraico preservado diz apenas: “fez o que era bom”.'
    reason: alternative_reading
  - marker: b
    text: 'Em vez dessa descrição, o grego chama Isaías de “o grande profeta, fiel em sua visão”. O hebraico traz: “aquele que é louvado entre os profetas”.'
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: Pois
  rationale: Introduz uma explicação ligada ao elogio de Ezequias no contexto e preserva naturalmente o valor conectivo do hebraico.
- source_word: עשה ... את הטוב
  choice: fez o que era bom
  rationale: Expressa em português corrente a formulação hebraica literal «fez o bem», sem acrescentar «ao Senhor», presente apenas no paralelo grego.
- source_word: ויחזק
  choice: se fortaleceu
  rationale: Preserva o valor intransitivo ou reflexivo possível de חזק e evita introduzir um objeto inexistente no hebraico.
- source_word: בדרכי דוד
  choice: nos caminhos de Davi
  rationale: Mantém a conhecida imagem bíblica dos caminhos como padrão de conduta.
- source_word: כאשר צוהו
  choice: conforme lhe ordenou
  rationale: Conserva a força de צוה e entende corretamente o sufixo pronominal como referência a Ezequias.
- source_word: ישעיה הנביא
  choice: o profeta Isaías
  rationale: É a ordem mais natural em português, sem alterar o sentido do hebraico.
- source_word: המהלל בנביאים
  choice: aquele que é louvado entre os profetas
  rationale: Reproduz o sentido passivo e a forma apositiva da expressão hebraica, sem substituí-la pela leitura divergente do grego.
theological_decisions:
- issue: Inclusão de «ao Senhor» a partir do paralelo grego
  choice: Omitido do texto principal
  alternative: fez o que era agradável ao Senhor
  rationale: O hebraico preservado diz apenas que Ezequias fez o que era bom. A formulação grega é registrada em nota, mas não substitui a testemunha hebraica principal.
- issue: Descrição final de Isaías
  choice: aquele que é louvado entre os profetas
  alternative: o grande profeta, fiel em sua visão
  rationale: O hebraico e o grego divergem de modo relevante. O texto principal segue o hebraico existente, enquanto a leitura grega é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação mantém proximidade com o hebraico e registra em notas as divergências significativas do grego.
