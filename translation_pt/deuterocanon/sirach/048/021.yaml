  text: He struck the camp of Assyria[a], and threw it into confusion with a plague.
translation:
  language: pt
  text: Ele feriu o acampamento da Assíria[a] e causou-lhe confusão por meio de uma praga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “Ele feriu o acampamento dos assírios, e seu anjo os destruiu.”'
    reason: Leitura alternativa do paralelo grego, cuja segunda oração difere do hebraico.
lexical_decisions:
- source_word: ויך
  choice: Ele feriu
  rationale: O verbo hebraico נכה expressa a ação direta de ferir ou golpear. “Feriu” é claro, vigoroso e não arcaico.
- source_word: מחנה אשור
  choice: o acampamento da Assíria
  rationale: Reproduz de perto a construção hebraica, literalmente “acampamento da Assíria”, em português natural. O grego traz o sentido equivalente “acampamento dos assírios”.
- source_word: ויהמם
  choice: e o pôs em confusão
  rationale: O verbo המם pode indicar causar confusão, pânico ou desordem. A formulação preserva o sentido causativo e retoma no singular o “acampamento”.
- source_word: במגפה
  choice: por meio de uma praga
  rationale: מגפה designa uma praga ou calamidade mortífera; a expressão “por meio de” explicita com naturalidade o valor instrumental da preposição ב.
theological_decisions:
- issue: Divergência entre o hebraico e o paralelo grego na segunda oração
  choice: 'Seguir o hebraico: “e o pôs em confusão por meio de uma praga”'
  alternative: 'Seguir o grego: “e seu anjo os destruiu”'
  rationale: Como o hebraico preservado é de alta confiança, ele fundamenta o texto principal. A leitura grega atribui explicitamente a destruição ao anjo de Deus e representa uma tradição textual distinta, preservada em nota sem harmonização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a concisão e a força do hebraico sem recorrer a vocabulário arcaico.
