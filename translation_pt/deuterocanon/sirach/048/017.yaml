base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/017.yaml
  text: Hezekiah fortified his city[a], and brought water into its midst; he cut through rock like bronze[b], and dammed up a reservoir in the mountains.
translation:
  language: pt
  text: Ezequias fortaleceu sua cidade e levou água para dentro dela; talhou as rochas como se fossem bronze[a] e represou um reservatório nos montes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “como bronze”, expressão difícil neste contexto. O texto grego traz “com ferro”, leitura que se ajusta ao trabalho de talhar a rocha.
    reason: textual_variant
  - marker: b
    text: A frase hebraica final é compacta e também pode ser entendida como “fechou um reservatório nos montes”. O grego fala, de modo mais geral, em construir fontes ou reservatórios de água.
    reason: alternative_reading
lexical_decisions:
- source_word: יחזקיהו
  choice: Ezequias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: חזק עירו
  choice: fortaleceu sua cidade
  rationale: O verbo indica tornar forte; aplicado à cidade de Jerusalém, inclui naturalmente o sentido de reforçar suas defesas sem acrescentar detalhes ausentes do hebraico.
- source_word: בהטות אל תוכה מים
  choice: levou água para dentro dela
  rationale: Expressa de modo natural o ato de conduzir ou desviar água ao interior da cidade, preservando o sentido espacial do hebraico.
- source_word: ויחצב
  choice: talhou
  rationale: O verbo descreve cortar ou escavar material duro e se ajusta às obras de engenharia em rocha.
- source_word: כנחשת צורים
  choice: talhou as rochas como se fossem bronze
  rationale: Mantém a comparação difícil do texto hebraico, כנחשת, e a torna inteligível em português sem substituí-la silenciosamente pela leitura grega instrumental, 'com ferro'.
- source_word: ויחסום הרים מקוה
  choice: represou um reservatório nos montes
  rationale: Conserva o sentido de bloquear ou represar e a formulação comprimida que associa o reservatório aos montes.
