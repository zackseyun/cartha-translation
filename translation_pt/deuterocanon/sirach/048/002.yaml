  text: He broke their staff of bread[a], and in his zeal he diminished them.
translation:
  language: pt
  text: Ele lhes cortou a provisão de pão[a] e, em seu zelo, reduziu o número deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, no hebraico, “o bastão do pão”, uma expressão para a provisão de alimento; o paralelo grego diz: “trouxe fome sobre eles”.'
    reason: Explica a metáfora hebraica não reproduzida literalmente no texto e registra a leitura interpretativa do paralelo grego.
lexical_decisions:
- source_word: וישבר
  choice: quebrou
  rationale: O verbo שבר significa aqui “quebrar”. A forma concreta preserva a metáfora hebraica e mantém o sujeito singular, Elias.
- source_word: מטה לחם
  choice: o sustento do pão
  rationale: Literalmente, “bastão do pão”; é uma expressão idiomática para aquilo que sustenta a vida, isto é, a provisão de alimento. “Sustento do pão” conserva a imagem bíblica de apoio sem produzir em português a leitura enganosa de um bastão feito de pão.
- source_word: להם
  choice: para eles
  rationale: Mantém a preposição hebraica e indica que a privação do sustento recaiu sobre eles. A construção é um pouco marcada, mas inteligível e fiel ao texto.
- source_word: ובקנאתו
  choice: e, em seu zelo
  rationale: קנאה pode significar zelo ou ciúme. Neste contexto, “zelo” exprime melhor o ardor de Elias, sem acrescentar uma motivação doutrinária não explicitada.
- source_word: המעיטם
  choice: reduziu o número deles
  rationale: O hifil de מעט significa tornar poucos, diminuir ou reduzir. Esta formulação é natural em português e preserva a ideia resultativa sem definir por qual meio ocorreu a redução.
- source_word: λιμόν
  choice: fome
  rationale: O paralelo grego interpreta a expressão hebraica como a imposição de fome, confirmando que a metáfora se refere à privação de alimento.
theological_decisions:
- issue: Tradução literal ou interpretativa da expressão מטה לחם
  choice: Conservar no texto a imagem de sustento associado ao pão e explicar a expressão em nota.
  alternative: “Trouxe fome sobre eles” ou “cortou-lhes a provisão de alimento”.
  rationale: O hebraico é a testemunha principal e emprega uma metáfora concreta; o grego confirma seu sentido de fome. A solução mantém a imagem hebraica sem ocultar a interpretação antiga.
- issue: Sentido de קנאה
  choice: zelo
  alternative: ciúme
  rationale: No retrato das ações de Elias, “zelo” comunica ardor religioso de modo contextual e não exige atribuir ao termo a conotação relacional de “ciúme”.
- issue: Alcance de המעיטם
  choice: reduziu o número deles
  alternative: enfraqueceu-os ou diminuiu-os
  rationale: O verbo indica tornar poucos ou reduzir. A tradução preserva esse resultado, mas não especifica se ocorreu por morte, dispersão ou outro efeito da fome.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva algo da forma hebraica, enquanto “sustento do pão” evita a obscuridade excessiva de “bastão do pão”. O marcador [a] aparece imediatamente após a expressão anotada.
