revisions:
- from: Ele quebrou para eles o sustento do pão[a] e, em seu zelo, reduziu o número deles.
  to: Ele lhes cortou a provisão de pão[a] e, em seu zelo, reduziu o número deles.
  rationale: A revisão elimina a ambiguidade de «para eles» e substitui uma combinação pouco idiomática por uma expressão portuguesa clara para a interrupção da provisão alimentar. Mantém-se «zelo» e a formulação não específica «reduziu o número deles», enquanto a nota conserva tanto a imagem hebraica quanto a interpretação do grego.
