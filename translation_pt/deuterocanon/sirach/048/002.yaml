review_pass:
  verdict: revise
  source_fidelity: 'A primeira oração comunica corretamente a retirada da provisão de alimento, e a segunda preserva o sentido causativo de המעיטם: torná-los poucos/reduzir seu número. Contudo, «quebrou para eles» sugere em português uma ação em benefício deles e não exprime bem o dativo de prejuízo («lhes»). «Cortou-lhes a provisão de pão» transmite com clareza o efeito do hebraico; a nota preserva a metáfora literal e registra o paralelo grego.'
  naturalness: «Ele quebrou para eles o sustento do pão» é pouco idiomático e cria uma relação semântica inadequada com «para eles». «Ele lhes cortou a provisão de pão» é português moderno, claro e de registro bíblico-literário moderado. «Em seu zelo» e «reduziu o número deles» são naturais e adequados.
  terminology: «Zelo» é a escolha contextual apropriada para קנאה, sem impor leitura doutrinária. «Provisão de pão» expressa o referente idiomático de מטה לחם; a nota deve informar que o hebraico diz literalmente «bastão do pão». «Reduziu o número deles» conserva a indeterminação quanto ao meio da redução.
  issues:
  - severity: medium
    issue: «quebrou para eles»
    rationale: A construção é marcada e pode sugerir que ele quebrou algo para o benefício deles. O hebraico להם funciona aqui como dativo de quem sofre a privação; em português, «lhes» evita essa ambiguidade.
  - severity: low
    issue: «sustento do pão»
    rationale: A formulação é compreensível, mas menos natural do que «provisão de pão» e pode soar como o sustento que o pão oferece, em vez da provisão de alimento que foi retirada.
  revised_text: Ele lhes cortou a provisão de pão[a] e, em seu zelo, reduziu o número deles.
