base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/010.yaml
  text: who was appointed for the appointed time[a], to calm wrath before fury, to turn the heart of fathers to sons[c][b], and to restore the tribes of Israel.
translation:
  language: pt
  text: que foste designado para o tempo determinado[a], para deter a ira antes que se acenda o furor de Deus[b], fazer o coração dos pais voltar-se para os filhos[c] e restabelecer as tribos de Israel.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico de sentido difícil; literalmente, algo como “o que está escrito/registrado, preparado para o tempo”. O grego também fala de alguém registrado para tempos determinados, mas inclui uma expressão obscura que pode ser entendida como “em repreensões”.
    reason: textual_difficulty
  - marker: b
    text: 'O grego traz a forma mais breve: “acalmar a ira antes do furor”.'
    reason: alternative_reading
  - marker: c
    text: O hebraico tem “pais” e “filhos” no plural; o grego traz “pai” e “filho” no singular.
    reason: textual_variant
  - marker: d
    text: O grego diz “as tribos de Jacó”; o hebraico, “as tribos de Israel”. O verbo hebraico também pode ser traduzido por “preparar” ou “estabelecer”.
    reason: textual_variant
lexical_decisions:
- source_word: הכתוב נכון לעת / ὁ καταγραφεὶς ἐν ἐλεγμοῖς εἰς καιρούς
  choice: que foste designado para o tempo determinado
  rationale: 'O hebraico transmitido é difícil: הכתוב significa normalmente “escrito/registrado”, enquanto נכון לעת sugere alguém preparado ou destinado para um tempo determinado. “Designado para o tempo determinado” comunica essa destinação futura em português natural sem impor uma solução excessivamente literal à frase obscura.'
- source_word: להשבית אף
  choice: para deter a ira
  rationale: להשבית significa fazer cessar ou interromper. “Deter a ira” expressa de modo conciso a ação de contê-la, em consonância com o grego κοπάσαι ὀργήν.
- source_word: לפני חרון אל
  choice: antes que se acenda o furor de Deus
  rationale: O hebraico explicita Deus e usa חרון, termo ligado à ira ardente. A formulação verbal em português torna natural o valor temporal de לפני e preserva a imagem do furor que se acende.
- source_word: להשיב לב אבות על בנים
  choice: fazer o coração dos pais voltar-se para os filhos
  rationale: Mantém a metáfora profética de voltar o coração e segue os plurais hebraicos אבות e בנים, sem reduzir a expressão a uma interpretação como “reconciliar”.
- source_word: ולהכין שבטי ישראל
  choice: restabelecer as tribos de Israel
  rationale: להכין pode significar preparar, firmar ou estabelecer; o paralelo grego καταστῆσαι favorece a ideia de colocar novamente em ordem. “Restabelecer” se ajusta ao contexto de restauração, mantendo “Israel” conforme o hebraico.
theological_decisions:
- issue: Relação entre os testemunhos hebraico e grego na descrição da ira divina
  choice: Seguir no texto principal a forma hebraica mais completa, que menciona explicitamente o furor de Deus.
  alternative: “acalmar a ira antes do furor”, conforme a forma grega mais breve.
  rationale: Como o hebraico está preservado e tem alta confiança, sua formulação recebe prioridade; a leitura grega é registrada em nota para não ocultar a diferença textual.
- issue: Fórmula profética sobre o coração dos pais e os filhos
  choice: Preservar a expressão metafórica “fazer o coração ... voltar-se”.
  alternative: “reconciliar os pais com os filhos”.
  rationale: A paráfrase “reconciliar” explicaria uma possível consequência, mas eliminaria a metáfora e resolveria além do texto a natureza exata da restauração anunciada.
- issue: Identificação das tribos no testemunho textual
  choice: Adotar “tribos de Israel”, conforme o hebraico.
  alternative: “tribos de Jacó”, conforme o grego.
  rationale: O testemunho hebraico preservado sustenta “Israel”; a variante grega é relevante e fica explicitada em nota.
translation_notes:
  register: Português atual, digno e de leitura ampla, com construção paralela em infinitivos. A segunda pessoa do singular (“foste”) preserva a continuação do discurso dirigido a Elias no contexto. As notas tornam visíveis as dificuldades e variantes sem sobrecarregar o texto principal.
