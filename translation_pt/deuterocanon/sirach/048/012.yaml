base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/012.yaml
  text: Elijah was hidden in the storehouse[a], and Elisha was filled with his spirit. Twice as many signs, and many wonders[b], came from his mouth.
translation:
  language: pt
  text: Elias foi ocultado no depósito[a], e Eliseu foi cheio do espírito dele. Realizou muitos sinais em dobro e prodígios a cada palavra que saía de sua boca[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: “Elias, que foi envolto num turbilhão”. O testemunho hebraico traz: “Elias foi ocultado no depósito”.'
    reason: textual_variant
  - marker: b
    text: O hebraico é condensado e diz literalmente “duplo” ou “duas vezes” em relação aos muitos sinais; a expressão provavelmente evoca a porção dobrada de Eliseu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שבאוצר נסתר
  choice: foi ocultado no depósito
  rationale: Segue o testemunho hebraico, no qual אוצר designa um depósito ou tesouraria. A formulação enigmática é preservada no texto, enquanto a leitura grega é registrada em nota.
- source_word: ונמלא רוחו אלישע
  choice: Eliseu ficou cheio do espírito dele
  rationale: O sufixo hebraico aponta naturalmente para Elias como antecedente. A inicial minúscula evita transformar a expressão numa referência explicitamente pneumatológica que o texto não exige.
- source_word: פי שנים
  choice: sinais em dobro
  rationale: A expressão significa literalmente algo como “duas vezes” ou “porção dobrada”. A tradução mantém a ideia de medida dupla e sua provável alusão à porção dobrada de Eliseu, sem definir uma comparação ausente no hebraico.
- source_word: אותות הרבה
  choice: muitos sinais
  rationale: אותות é traduzido por “sinais”, preservando a conhecida associação bíblica entre sinais e prodígios e evitando reduzir o termo simplesmente a “milagres”.
- source_word: ומופתים
  choice: e muitos prodígios
  rationale: “Prodígios” expressa bem מופתים no registro bíblico e forma uma combinação natural com “sinais”.
- source_word: כל מוצא פיהו
  choice: saíam de sua boca
  rationale: A expressão hebraica comprimida significa literalmente “toda saída de sua boca” e associa os feitos à palavra proferida por Eliseu. A tradução conserva a imagem sem tornar a frase artificial.
theological_decisions:
- issue: Divergência entre o hebraico e o grego na oração inicial
  choice: 'Seguir no texto principal o hebraico: “Elias foi ocultado no depósito”'
  alternative: 'Seguir o grego: “Elias foi envolto num turbilhão”'
  rationale: O testemunho hebraico existente tem prioridade, mas a leitura grega antiga é coerente com a partida de Elias em 2 Reis 2 e constitui uma variante textual relevante, por isso é preservada em nota.
- issue: Referente de “seu espírito”
  choice: O espírito de Elias encheu Eliseu
  alternative: O Espírito em sentido divino explicitamente marcado
  rationale: Tanto o sufixo hebraico quanto o paralelo grego apontam mais naturalmente para Elias. A redação preserva essa referência sem excluir associações teológicas mais amplas nem impô-las por meio de maiúscula.
- issue: Sentido da medida dupla
  choice: “Sinais em dobro”
  alternative: “Duas vezes mais sinais” ou “uma porção dobrada de sinais”
  rationale: O hebraico é elíptico e não explicita o termo de comparação. “Em dobro” preserva a noção de duplicidade e a possível alusão à porção dobrada sem acrescentar uma comparação definida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Depósito” preserva o sentido locativo de אוצר e a estranheza genuína do hebraico; “prodígios” mantém o registro bíblico sem soar arcaico em excesso.
