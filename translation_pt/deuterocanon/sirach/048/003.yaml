  text: By his word he restrained the heavens[b][a], and brought down fire three times.
translation:
  language: pt
  text: Pela palavra de Deus[a], fechou os céus e fez descer fogo três vezes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz: “Pela palavra do Senhor, ele fechou o céu.”'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “três fogos”; isto é, fez o fogo descer em três ocasiões.
    reason: lexical_alternative
lexical_decisions:
- source_word: בדבר אל
  choice: Pela palavra de Deus
  rationale: 'A construção é entendida de modo instrumental: Elias agiu mediante a palavra de Deus. אל é tomado como o substantivo divino “Deus”, leitura coerente com o paralelo grego, que traz “Senhor”.'
- source_word: עצר שמים
  choice: fechou os céus
  rationale: עצר comunica a ideia de reter ou fechar. A formulação conserva a imagem do texto sem explicitar a chuva, que não é mencionada neste versículo.
- source_word: ויורד
  choice: fez descer
  rationale: 'A forma verbal tem sentido causativo: Elias fez com que o fogo descesse. “Fez descer” preserva essa força com clareza em português.'
- source_word: שלוש אשות
  choice: fogo três vezes
  rationale: Embora o hebraico diga literalmente “três fogos”, o paralelo grego usa uma expressão adverbial equivalente a “três vezes”. A tradução indica três ocasiões em que fogo desceu, evitando sugerir apenas três chamas simultâneas.
theological_decisions:
- issue: Identificação da palavra mediante a qual Elias fechou os céus
  choice: Pela palavra de Deus
  alternative: Por sua palavra; Pela palavra do Senhor
  rationale: No hebraico transmitido, אל pode ser lido como “Deus”; o grego confirma a referência divina, embora use “Senhor”. A tradução segue o testemunho hebraico no texto principal e registra a forma grega em nota, sem atribuir a palavra exclusivamente a Elias.
translation_notes:
  register: Português atual, claro e digno, com leve cadência bíblica. “Céus” preserva a imagem tradicional sem explicar além do texto; “fez descer” mantém o valor causativo do hebraico.
