translation:
  language: pt
  text: que fez descer reis à destruição[a][c] e homens ilustres[b] de seus leitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à cova” ou “à ruína”. O hebraico שחת pode indicar uma cova ou a ruína/destruição; o paralelo grego traz “à destruição”.
    reason: lexical_alternative
  - marker: b
    text: Ou “nobres” ou “os honrados”.
    reason: lexical_alternative
  - marker: c
    text: A frase provavelmente evoca os juízos anunciados por Elias contra reis e pessoas de alta posição, inclusive um rei confinado ao leito; compare 2 Reis 1.
    reason: cross_reference
lexical_decisions:
- source_word: המוריד
  choice: que fez descer
  rationale: O particípio causativo de ירד descreve alguém que faz outros descerem, tanto em sentido concreto como figurado. “Fez descer” conserva essa imagem e permite que o verbo governe os dois membros do verso.
- source_word: מלכים
  choice: reis
  rationale: O hebraico designa especificamente reis, sem necessidade de ampliar o sentido para governantes em geral.
- source_word: על שחת
  choice: à destruição
  rationale: שחת pode indicar cova, ruína ou destruição. Aqui, “à destruição” expressa o resultado da queda dos reis e concorda com o paralelo grego εἰς ἀπώλειαν, sem eliminar a alternativa concreta registrada em nota.
- source_word: ונכבדים
  choice: e homens ilustres
  rationale: נכבדים designa pessoas de peso, honra ou distinção. “Homens ilustres” preserva esse sentido amplo sem restringi-lo necessariamente à nobreza hereditária.
- source_word: ממטותם
  choice: de seus leitos
  rationale: מטות significa camas ou leitos. “Leitos” é claro, digno e mantém a imagem concreta, inclusive sua possível alusão narrativa.
theological_decisions:
- issue: Se o segundo membro deve ser explicitado como referência ao juízo contra um rei enfermo em seu leito
  choice: Manter a formulação concreta “homens ilustres de seus leitos”, sem acrescentar “doentes” nem identificar o episódio no texto principal.
  alternative: Traduzir interpretativamente como “homens ilustres de seus leitos de enfermidade”.
  rationale: O hebraico e o grego mencionam leitos, mas não dizem explicitamente “leitos de enfermidade”. A provável alusão a 2 Reis 1 é indicada em nota, preservando a tensão e evitando inserir interpretação no texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A construção paralela conserva o único verbo causativo do hebraico e sua aplicação aos dois membros, ainda que resulte em uma formulação levemente elevada.
