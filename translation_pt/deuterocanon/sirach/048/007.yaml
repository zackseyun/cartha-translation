  text: who anointed one for acts of retribution[b][a], and a prophet as your successor.
translation:
  language: pt
  text: que ungiu alguém para atos de retribuição[b][a] e um profeta para suceder a você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: «que ouviu no Sinai uma repreensão e, no Horebe, sentenças de vingança». O hebraico preservado aqui difere consideravelmente da tradição grega.'
    reason: alternative_reading
  - marker: b
    text: A expressão hebraica traduzida por «alguém para atos de retribuição» é um tanto difícil neste texto composto dos manuscritos da Genizá; a tradução segue o sentido aparente no contexto.
    reason: textual_variant
lexical_decisions:
- source_word: המושח
  choice: que ungiu
  rationale: Entendido como forma participial de משח que dá continuidade à descrição de Elias no versículo anterior; o português explicita naturalmente a relação com «que».
- source_word: מלא
  choice: alguém
  rationale: A forma é difícil neste texto hebraico composto. O contexto narrativo da comissão dada por Elias favorece a referência a uma pessoa, sem tentar identificá-la no próprio texto.
- source_word: תשלומות
  choice: atos de retribuição
  rationale: O termo deriva da ideia de pagar ou dar a devida recompensa e, neste contexto, tem sentido punitivo. «Retribuição» conserva o caráter judicial sem intensificá-lo desnecessariamente para «vingança».
- source_word: ונביא
  choice: e um profeta
  rationale: O hebraico não traz artigo; a formulação mantém a referência indefinida, embora o contexto remeta a Eliseu.
- source_word: תחליף תחתיך
  choice: para suceder a você
  rationale: A combinação expressa substituição ou sucessão na função. Esta formulação é natural em português e comunica que o profeta ocuparia o lugar de Elias.
theological_decisions:
- issue: Divergência entre o hebraico preservado e a tradição grega em Sirácida 48:7
  choice: O texto principal segue o testemunho hebraico, no qual Elias unge alguém para atos de retribuição e designa um profeta para sucedê-lo.
  alternative: 'O grego diz: «que ouviu no Sinai uma repreensão e, no Horebe, sentenças de vingança».'
  rationale: O hebraico preservado é a fonte principal, mas a divergência substancial do paralelo grego é relevante para a história textual e, por isso, é registrada em nota sem harmonização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi mantida como continuação da descrição de Elias no contexto imediato. Preservou-se a incerteza textual por meio das notas, sem identificar explicitamente as pessoas envolvidas nem harmonizar o hebraico com o grego.
