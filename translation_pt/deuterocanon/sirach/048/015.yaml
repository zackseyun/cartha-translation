  naturalness: O registro é claro e moderno. Contudo, “não voltou atrás” em português normalmente significa não revogar uma decisão ou não recuar numa posição, e pode obscurecer a metáfora moral de שוב. “Não voltou” conserva melhor a concisão e a ambiguidade controlada do hebraico, com a nota esclarecendo “não se arrependeu”. “Até que fosse arrancado” também dá uma construção mais fluente e explicitamente passiva.
  terminology: “Povo”, “pecados”, “arrancado” e “disperso” são apropriados. “Por toda a terra” preserva a possível amplitude de בכל הארץ; a alternativa “por todas as terras” é adequadamente indicada. A nota textual deve evitar atribuir ao grego um “restou” explicitamente aplicado ao governante, pois a construção grega é elíptica; “havia um governante” comunica a continuação sem sobredefini-la.
