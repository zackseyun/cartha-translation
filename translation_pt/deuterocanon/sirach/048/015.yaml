base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/015.yaml
  text: Yet for all this the people did not turn back[a], and they did not cease from their sins[c][b], until they were uprooted from their land and were scattered throughout the earth.
translation:
  language: pt
  text: Apesar de tudo isso, o povo não voltou[a] nem deixou seus pecados, até que fosse arrancado de sua terra e disperso por toda a terra[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não se arrependeu”. O hebraico diz literalmente “não voltou”, enquanto o paralelo grego emprega explicitamente o verbo “arrepender-se”.
    reason: lexical_alternative
  - marker: b
    text: Ou “por todas as terras”. A expressão hebraica também pode indicar uma ampla dispersão entre muitas terras.
    reason: alternative_reading
  - marker: c
    text: 'O paralelo grego continua além do hebraico preservado: “e o povo ficou reduzido a muito poucos, e havia um governante na casa de Davi”. O texto principal segue o hebraico preservado.'
    reason: textual_variant
lexical_decisions:
- source_word: בכל זאת
  choice: Apesar de tudo isso
  rationale: Expressa naturalmente o valor concessivo da frase no contexto, ligando a persistência do povo ao que foi narrado antes.
- source_word: לא שב
  choice: não voltou atrás
  rationale: Preserva a imagem concreta de voltar/retornar do hebraico שוב, ao mesmo tempo que comunica uma mudança moral não realizada; o grego explicita o sentido de arrependimento.
- source_word: העם
  choice: o povo
  rationale: Equivalente coletivo direto e natural, sem o matiz político mais forte de “nação”.
- source_word: ולא חדלו מחטאתם
  choice: nem deixou os seus pecados
  rationale: Reproduz com clareza a ideia de não cessar ou desistir dos pecados. A concordância coletiva no singular acompanha “o povo” e soa natural em português.
- source_word: עד אשר נסחו מארצם
  choice: até ser arrancado de sua terra
  rationale: O verbo indica remoção forçada. “Arrancado” conserva a força da imagem e se ajusta ao contexto de exílio.
- source_word: ויפוצו בכל הארץ
  choice: e disperso por toda a terra
  rationale: פוץ indica dispersar ou espalhar. “Por toda a terra” mantém a amplitude de ארץ, que pode aludir à dispersão por muitas terras.
theological_decisions:
- issue: Sentido de arrependimento em לא שב em comparação com o grego μετενόησεν
  choice: não voltou atrás
  alternative: não se arrependeu
  rationale: O hebraico preserva a metáfora de voltar, enquanto o paralelo grego confirma seu sentido moral e religioso. A tradução principal mantém ambos sem substituir a imagem hebraica por uma formulação mais interpretativa.
- issue: Alcance de ארץ em בכל הארץ
  choice: por toda a terra
  alternative: por todas as terras
  rationale: No contexto do exílio, a expressão sugere ampla dispersão para além do território de origem. A alternativa distributiva também é possível e fica registrada em nota.
- issue: Continuação mais longa no paralelo grego
  choice: encerrar o texto principal onde termina o hebraico preservado
  alternative: acrescentar “e o povo ficou reduzido a muito poucos, e restou um governante na casa de Davi”
  rationale: Como o hebraico está preservado até a dispersão e é a testemunha primária adotada, a continuação exclusiva do grego é informada em nota, não inserida no corpo do versículo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção concisa. “Voltou atrás” mantém a metáfora hebraica em linguagem corrente; “arrancado” comunica a violência do exílio sem arcaísmo.
