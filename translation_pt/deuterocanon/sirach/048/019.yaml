lexical_decisions:
- source_word: נמוגו
  choice: se desfizeram
  rationale: Preserva a imagem hebraica de perder a firmeza ou derreter-se de medo, em linguagem portuguesa natural e expressiva.
- source_word: בגאון לבם
  choice: na altivez do coração
  rationale: Mantém a formulação comprimida do hebraico e a amplitude de גאון, que pode indicar orgulho, exaltação ou elevação interior, sem resolver indevidamente a tensão do sentido.
- source_word: ויחילו
  choice: se contorceram
  rationale: Exprime a reação corporal de angústia, tremor ou dores de parto; a comparação seguinte explicita o contexto de parto e evita uma repetição pesada.
- source_word: כיולדה
  choice: como uma mulher dando à luz
  rationale: Traduz naturalmente o particípio feminino singular e conserva de modo explícito a comparação hebraica.
- source_word: τότε ἐσαλεύθησαν καρδία καὶ χεῖρες αὐτῶν
  choice: Então eles se desfizeram...
  rationale: O texto principal segue a testemunha hebraica. O paralelo grego, que menciona coração e mãos abalados, confirma o quadro geral de pânico, mas representa uma formulação variante ou ampliada.
