translation:
  language: pt
  text: Como você inspira temor[a], Elias! E quem, como você, pode se gloriar?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Como você foi glorificado, Elias, em suas maravilhas! E quem é semelhante a você para se gloriar?” O hebraico diz mais literalmente: “Como você é temível, Elias!”, leitura seguida nesta tradução.'
    reason: alternative_reading
lexical_decisions:
- source_word: מה נורא
  choice: Como você inspira temor
  rationale: A construção exclamativa hebraica exprime admiração reverente e espanto. “Inspira temor” conserva a dimensão de temor e assombro de נורא sem sugerir, no português corrente, que Elias seja moralmente terrível.
- source_word: אתה
  choice: você
  rationale: O pronome independente integra uma oração nominal, vertida naturalmente no presente em português.
- source_word: אליהו
  choice: Elias
  rationale: Forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: ואשר כמוך יתפאר
  choice: E quem, como você, pode se gloriar?
  rationale: Embora o hebraico transmitido tenha אשר onde seria esperado um interrogativo, o contexto e o paralelo grego sustentam uma pergunta retórica. “Gloriar-se” preserva o valor reflexivo de יתפאר e, neste contexto elogioso, evita a conotação exclusivamente negativa de “gabar-se”.
theological_decisions:
- issue: Primazia do testemunho hebraico diante da diferença menor no paralelo grego
  choice: Traduzir נורא segundo o hebraico como alguém que “inspira temor”, usando o grego para confirmar a estrutura retórica do segundo membro.
  alternative: “Como você foi glorificado, Elias, em suas maravilhas! E quem é semelhante a você para se gloriar?”
  rationale: O testemunho hebraico preserva uma nuance própria de temor reverente que não deve ser substituída pela formulação grega. O paralelo grego, porém, ajuda a esclarecer que o segundo membro é uma pergunta retórica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Você” acompanha a interpelação direta e evita solenidade artificial; “inspira temor” comunica reverência e assombro sem a ambiguidade negativa de “temível” ou o coloquialismo de “impressionante”.
