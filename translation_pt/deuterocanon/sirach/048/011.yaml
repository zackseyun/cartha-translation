base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/011.yaml
  text: Happy is the one who saw you and died[a], and happy are you, for you will surely live.
translation:
  language: pt
  text: Feliz aquele que viu você e morreu[a]; e feliz é você, pois certamente viverá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Felizes os que viram você e os que foram adornados com amor, pois nós também viveremos.” O testemunho hebraico traz, em vez disso: “e feliz é você, pois certamente viverá”.'
    reason: alternative_reading
lexical_decisions:
- source_word: אשרי
  choice: Feliz
  rationale: A fórmula hebraica de bem-aventurança expressa uma condição invejável de felicidade ou favor. “Feliz” é natural no português atual e preserva o tom exclamativo.
- source_word: ראך
  choice: viu você
  rationale: O qal perfeito de ראה com sufixo de segunda pessoa masculina singular é traduzido diretamente, mantendo a referência a Elias.
- source_word: ומת
  choice: e morreu
  rationale: Reproduz de modo simples a conjunção e o verbo perfeito, sem introduzir o sentido concessivo de “embora tenha morrido”, que não está explícito no hebraico.
- source_word: ואשריך
  choice: e feliz é você
  rationale: O sufixo indica uma declaração dirigida diretamente à segunda pessoa. A formulação preserva o paralelismo com a primeira bem-aventurança.
- source_word: כי
  choice: pois
  rationale: Introduz a razão da segunda declaração e mantém a relação explicativa sem determinar um sentido mais específico do que o hebraico exige.
- source_word: חיה תחיה
  choice: certamente viverá
  rationale: O infinitivo absoluto seguido do verbo finito intensifica a ação. “Certamente viverá” expressa com naturalidade a ênfase da construção hebraica.
theological_decisions:
- issue: Relação entre as formas hebraica e grega do versículo
  choice: Traduzir o testemunho hebraico preservado no texto principal e registrar em nota a forma grega significativamente diferente.
  alternative: 'Seguir o grego: “Felizes os que viram você e os que foram adornados com amor, pois nós também viveremos.”'
  rationale: Quando preservado, o hebraico tem primazia como fonte para Sirácida. Como o paralelo grego diverge substancialmente na segunda metade, a variante é apresentada para manter a transparência textual, sem harmonização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo poético do hebraico foram mantidos, e a ambiguidade de “e morreu” não foi resolvida por uma paráfrase concessiva.
