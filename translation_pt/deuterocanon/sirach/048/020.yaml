  text: Then they called to God Most High[a], and spread out their hands to him.
translation:
  language: pt
  text: Então clamaram ao Deus Altíssimo[a] e estenderam as mãos para ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego continua: “e o Santo, do céu, logo os ouviu e os libertou pela mão de Isaías”.'
    reason: Leitura alternativa mais extensa preservada no grego, mas ausente do texto hebraico fornecido.
lexical_decisions:
- source_word: ויקראו
  choice: clamaram
  rationale: O verbo קרא, neste contexto, expressa uma súplica dirigida a Deus. “Clamaram” comunica naturalmente em português a oração urgente, sem acrescentar conteúdo ausente do hebraico.
- source_word: אל אל עליון
  choice: ao Deus Altíssimo
  rationale: O primeiro אל é a preposição “a”, o segundo designa “Deus”, e עליון é o título divino “Altíssimo”. A contração “ao” e a expressão “Deus Altíssimo” preservam o sentido e a concisão do hebraico.
- source_word: ויפרשו
  choice: estenderam
  rationale: פרש descreve aqui o gesto de abrir ou estender as mãos em oração. “Estenderam” é corrente, claro e digno em português.
- source_word: כפים
  choice: as mãos
  rationale: Embora כפים possa indicar especificamente as palmas, “mãos” é a forma idiomática em português para esse gesto de oração.
- source_word: אליו
  choice: para ele
  rationale: A preposição indica a direção do gesto para Deus. “Para ele” é natural em português e mantém a referência pronominal do hebraico.
theological_decisions:
- issue: Uso do testemunho hebraico em relação ao paralelo grego mais extenso
  choice: Manter no texto principal apenas a frase preservada no hebraico.
  alternative: 'Acrescentar ao texto principal: “e o Santo, do céu, logo os ouviu e os libertou pela mão de Isaías”.'
  rationale: O testemunho hebraico fornecido é a fonte principal e termina após o gesto das mãos. A continuação grega é relevante como leitura paralela, mas não deve ser incorporada silenciosamente ao texto principal; por isso, aparece em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Clamaram” conserva a intensidade da súplica; “estenderam as mãos” expressa de modo natural o gesto hebraico de oração.
