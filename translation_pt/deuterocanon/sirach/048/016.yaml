base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/016.yaml
  text: A remnant was left to Judah[a], and to the house of David a ruler. Some of them did what was right, but some of them greatly increased apostasy.
translation:
  language: pt
  text: Um pequeno remanescente restou a Judá, e um governante à casa de Davi. Alguns deles fizeram o que era reto, mas outros levaram a infidelidade ao extremo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “multiplicaram pecados”. O hebraico é mais incisivo e pode ser entendido como “levaram a infidelidade ou traição ao extremo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וישאר ליהודה מזער
  choice: Um pequeno remanescente restou a Judá
  rationale: O nifal de שאר expressa aquilo que restou, enquanto מזער indica pequenez ou quantidade reduzida. “Pequeno remanescente” conserva o sentido contextual de uma parcela sobrevivente sem explicitar além do hebraico.
- source_word: ועוד לבית דוד קצין
  choice: e um governante à casa de Davi
  rationale: בית דוד é a expressão dinástica tradicional “casa de Davi”, e קצין designa genericamente alguém investido de autoridade; “governante” evita impor o título mais específico de príncipe ou rei.
- source_word: עשו יושר
  choice: fizeram o que era reto
  rationale: A expressão indica agir com retidão. Esta formulação é clara, digna e mantém a avaliação moral do hebraico.
- source_word: הפליאו מעל
  choice: levaram a infidelidade ao extremo
  rationale: O hifil de פלא intensifica a ação, e מעל designa quebra de fidelidade ou deslealdade, frequentemente em contexto de compromisso religioso. A formulação portuguesa comunica intensidade sem a construção pouco natural “multiplicaram grandemente a infidelidade”.
theological_decisions:
- issue: Força e âmbito de מעל no resumo da história dos governantes
  choice: infidelidade
  alternative: apostasia; traição; pecados
  rationale: “Infidelidade” preserva a ideia hebraica de violação da fidelidade sem restringir necessariamente o termo a abandono religioso formal. O grego traz o sentido mais geral de “pecados”, mantido em nota para não apagar a diferença entre as testemunhas.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A ordem da primeira frase conserva o paralelismo hebraico, e “casa de Davi” mantém o conhecido idioma dinástico bíblico.
