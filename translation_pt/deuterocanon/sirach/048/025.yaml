  text: He declared what would be forever[b][a], and hidden things before they came.
translation:
  language: pt
  text: Anunciou os acontecimentos futuros até o fim dos tempos[a] e coisas ocultas antes que viessem a acontecer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “para sempre” ou “até a eternidade”. O hebraico עד עולם e o grego ἕως τοῦ αἰῶνος exprimem um horizonte temporal sem limite definido.
    reason: lexical_alternative
  - marker: b
    text: “Coisas ocultas” também pode ser traduzido como “coisas secretas” ou “coisas escondidas”. A expressão final significa que elas foram anunciadas antes de ocorrerem.
    reason: lexical_alternative
lexical_decisions:
- source_word: עד עולם
  choice: até a eternidade
  rationale: Mantém a imagem temporal ampla e elevada do hebraico, confirmada pelo grego ἕως τοῦ αἰῶνος, sem reduzi-la silenciosamente a uma formulação interpretativa mais específica.
- source_word: הגיד
  choice: anunciou
  rationale: Expressa o ato de dar a conhecer ou proclamar e se ajusta ao contexto profético em linguagem portuguesa natural e solene.
- source_word: נהיות
  choice: o que haveria de acontecer
  rationale: Transmite com clareza os acontecimentos futuros indicados pelo hebraico; o paralelo grego τὰ ἐσόμενα confirma essa orientação para o futuro.
- source_word: ונסתרות
  choice: e as coisas ocultas
  rationale: Preserva o sentido de realidades escondidas ou encobertas, em concordância com o grego τὰ ἀπόκρυφα, sem introduzir um sentido técnico posterior.
- source_word: לפני בואן
  choice: antes que viessem
  rationale: Conserva a metáfora literal da vinda dos acontecimentos e das coisas ocultas, também refletida no paralelo grego, sem tornar a frase pouco natural em português.
theological_decisions:
- issue: Alcance temporal da revelação profética
  choice: o que haveria de acontecer até a eternidade
  alternative: o que haveria de acontecer para sempre; os acontecimentos até o fim dos tempos
  rationale: A formulação conserva a amplitude poética da afirmação sobre o conhecimento profético, sem transformá-la numa tese sistemática de conhecimento exaustivo nem restringir indevidamente seu horizonte.
translation_notes:
  register: Português moderno, claro e digno, com construção concisa. A expressão incomum “até a eternidade” foi mantida para preservar a amplitude e a tensão do original, enquanto a nota oferece equivalentes mais idiomáticos.
