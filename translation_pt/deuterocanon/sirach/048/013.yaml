base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/013.yaml
  text: In his days he did not tremble before anyone[a], and no flesh mastered his spirit. No word was too wondrous for him[b], and beneath him his flesh was created.
translation:
  language: pt
  text: Em seus dias, ele não tremeu diante de ninguém, e nenhum mortal dominou seu espírito. Nenhuma palavra era extraordinária demais para ele[a], e, em seu sono, seu corpo profetizou[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nenhum assunto era extraordinário demais para ele”. O termo hebraico pode significar “palavra”, “assunto” ou “coisa”.'
    reason: lexical_alternative
  - marker: b
    text: A cláusula final segue o paralelo grego. O hebraico preservado é difícil e diz literalmente algo como “e debaixo dele sua carne foi criada”, possivelmente por causa de um problema textual.
    reason: textual_variant
lexical_decisions:
- source_word: מימיו
  choice: Em seus dias
  rationale: Reproduz o idiomatismo temporal hebraico de modo claro e digno, referindo-se ao período de sua vida e atuação.
- source_word: לא זע מכל
  choice: ele não tremeu diante de ninguém
  rationale: O verbo expressa estremecer ou tremer; no contexto do destemor profético, a formulação pessoal é a leitura mais provável, sem excluir a ideia de não se deixar abalar.
- source_word: ולא משל ברוחו כל בשר
  choice: e nenhum mortal dominou seu espírito
  rationale: כל בשר, literalmente “toda carne”, funciona como expressão para os seres humanos; “nenhum mortal” conserva a ênfase na fragilidade humana, enquanto “dominou seu espírito” segue de perto a construção hebraica.
- source_word: כל דבר לא נפלא ממנו
  choice: Nenhuma palavra era extraordinária demais para ele
  rationale: דבר pode significar “palavra”, “assunto” ou “coisa”. “Palavra” preserva a correspondência com o hebraico e com λόγος no paralelo grego; “extraordinária demais” comunica o valor de נפלא sem convertê-lo indevidamente em “oculta” ou apenas “difícil”.
- source_word: ἐν κοιμήσει ἐπροφήτευσεν τὸ σῶμα αὐτοῦ
  choice: em seu sono, seu corpo profetizou
  rationale: A cláusula final segue o paralelo grego, cuja leitura é coerente e inteligível. “Sono” mantém a imagem de κοίμησις, que neste contexto pode evocar o repouso da morte, sem explicitar além do texto.
theological_decisions:
- issue: Base textual da cláusula final
  choice: 'Seguir o paralelo grego: “em seu sono, seu corpo profetizou”'
  alternative: 'Seguir literalmente o hebraico preservado: “debaixo/depois dele, sua carne foi criada”'
  rationale: A cláusula hebraica transmitida é difícil e provavelmente apresenta problema textual, enquanto o grego oferece uma leitura coerente com a tradição contextual sobre a atuação profética de Eliseu após a morte. A nota registra a divergência para não ocultar a incerteza textual.
- issue: Sentido de “sono” na cláusula grega
  choice: Conservar a imagem como “sono”
  alternative: Explicitar como “morte” ou “depois de morrer”
  rationale: κοίμησις pode designar sono e também funcionar como imagem da morte. A tradução preserva essa tensão sem impor uma interpretação teológica mais específica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe mantém o paralelismo do hebraico; “mortal” evita a estranheza excessiva de “carne” como designação de uma pessoa, e as notas preservam tanto a ambiguidade lexical quanto a incerteza textual.
