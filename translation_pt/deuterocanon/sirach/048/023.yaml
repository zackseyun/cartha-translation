  text: In his days the sun stood still[b][a], and life was added to the king.
translation:
  language: pt
  text: Em seus dias, o sol ficou parado[a], e foi acrescentada vida ao rei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz uma expressão difícil que pode significar “ele impediu o sol” ou “o sol foi impedido”; ela corresponde ao hebraico “o sol ficou parado”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, a vida do rei foi prolongada. Pelo contexto, o rei é Ezequias.
    reason: cross_reference
lexical_decisions:
- source_word: עמד
  choice: parou
  rationale: Com “o sol” como sujeito, o verbo hebraico “ficar de pé/estar parado” indica a interrupção do seu curso. “Parou” é natural em português e mantém o sentido contextual, enquanto o paralelo grego também sugere impedimento ou interrupção.
- source_word: השמש
  choice: o sol
  rationale: Tradução direta do substantivo hebraico definido.
- source_word: ונוסף
  choice: foram acrescentados
  rationale: Preserva a imagem hebraica de algo acrescentado, em vez de substituí-la inteiramente pelo sentido interpretativo “foi prolongada”.
- source_word: חיי
  choice: anos de vida
  rationale: O hebraico traz uma forma construta que literalmente se relaciona à “vida” do rei. Em português, “anos de vida foram acrescentados” expressa de maneira natural o prolongamento da vida sugerido pelo contexto, sem alterar a imagem verbal.
- source_word: המלך
  choice: ao rei
  rationale: Mantém o título definido do hebraico. O contexto identifica o rei como Ezequias, mas o nome não é inserido no texto do versículo.
theological_decisions:
- issue: Explicitar no texto principal que o rei é Ezequias
  choice: Manter “o rei” e identificar Ezequias em nota
  alternative: “o rei Ezequias” ou “Ezequias”
  rationale: O hebraico diz apenas “o rei”; a identificação decorre do contexto. Assim, a tradução evita acrescentar ao versículo uma informação explicativa.
- issue: Interpretar diretamente o acréscimo de vida como prolongamento
  choice: “mais anos de vida foram acrescentados”
  alternative: “a vida do rei foi prolongada”
  rationale: A formulação escolhida torna o sentido inteligível em português e, ao mesmo tempo, conserva a metáfora do hebraico, segundo a qual vida é acrescentada ao rei.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com boa legibilidade brasileira. A ordem das notas acompanha sua ocorrência no texto, e a formulação evita tanto um literalismo pouco natural quanto explicitação excessiva.
