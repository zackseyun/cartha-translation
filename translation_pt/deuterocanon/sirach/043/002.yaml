  text: The sun[a], appearing in its form and hot[c][b], how awe-inspiring are the works of the Lord.
translation:
  language: pt
  text: O sol[a], que se manifesta em sua forma e em seu calor[b][c] — como são assombrosas as obras do SENHOR!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “O sol, ao surgir, proclamando: instrumento maravilhoso, obra do Altíssimo”. O testemunho hebraico, porém, destaca a forma visível e o calor do sol.'
    reason: alternative_reading
  - marker: b
    text: A expressão hebraica traduzida por “que se manifesta em sua forma e em seu calor” é concisa e um pouco difícil. O sentido provável é que a aparência visível e o calor do sol tornam perceptíveis as obras assombrosas do SENHOR.
    reason: lexical_alternative
  - marker: c
    text: O manuscrito de Massada conserva aqui apenas fragmentos desta linha; a redação hebraica mais completa adotada no texto principal vem dos manuscritos da Guenizá do Cairo.
    reason: textual_variant
lexical_decisions:
- source_word: שמש
  choice: O sol
  rationale: Designa diretamente o astro; o artigo definido é natural em português.
- source_word: מביע
  choice: revelando-se
  rationale: O particípio hebraico é difícil e pode sugerir manifestação, expressão ou anúncio. “Revelando-se” preserva tanto o aspecto visível quanto a ideia de que o sol dá a conhecer algo por sua aparência, sem adotar integralmente a formulação divergente do grego.
- source_word: בצורתו
  choice: em sua forma
  rationale: Mantém de perto a referência à forma ou aparência visível do sol. “Forma” conserva a concisão e a ambiguidade do hebraico.
- source_word: וחמה
  choice: e em seu calor
  rationale: A redação hebraica é comprimida e um pouco difícil, mas parece destacar o calor do sol. A expansão idiomática “em seu calor” produz português compreensível sem alterar o sentido provável.
- source_word: מה נורא
  choice: como são assombrosas
  rationale: נורא descreve aquilo que inspira temor e reverência. “Assombrosas” comunica admiração reverente em português atual, evitando que “temíveis” sugira apenas perigo.
- source_word: מעשי ה׳
  choice: as obras do SENHOR
  rationale: O plural hebraico é preservado por “obras”. A abreviação reverencial do nome divino é representada por “SENHOR”.
theological_decisions:
- issue: Representação da abreviação do nome divino ה׳
  choice: SENHOR
  alternative: Senhor
  rationale: A abreviação hebraica representa reverencialmente o nome divino. “SENHOR” sinaliza essa referência em português sem substituir o texto hebraico pelo título divergente “Altíssimo” da tradição grega.
- issue: Relação entre o sol e as obras divinas
  choice: A aparência e o calor do sol suscitam a exclamação sobre as obras do SENHOR
  alternative: O próprio sol é singularmente “a obra do Altíssimo”, conforme o paralelo grego
  rationale: O texto hebraico usa o plural “obras” e não identifica gramaticalmente o sol como uma única obra. A tradução conserva essa formulação e registra a leitura grega em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção foi levemente ajustada para soar natural, mas a concisão e a dificuldade do hebraico foram preservadas e explicitadas em nota. O travessão marca a passagem da descrição do sol à exclamação de louvor.
