base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/007.yaml
  text: From them come the appointed time and the fixed seasons by statute[b][a], and the work he desired is in its cycle.
translation:
  language: pt
  text: Por meio deles vêm o tempo determinado e as épocas fixadas por decreto; e a obra que ele desejou está em seu ciclo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico do segundo membro é difícil. O texto da Genizá do Cairo diz aproximadamente: “e a coisa/obra desejada... em seu ciclo”. O paralelo grego diz: “Da lua vem o sinal de uma festa, um luminar que mingua até o fim”.'
    reason: alternative_reading
  - marker: b
    text: 'O rolo de Massada traz: “pois grande é o Senhor que a fez”, em lugar da formulação diferente e mais difícil preservada no texto da Genizá do Cairo.'
    reason: textual_variant
lexical_decisions:
- source_word: בם
  choice: Por eles vêm
  rationale: A preposição ב pode significar “em” ou “por”. Neste verso poético e condensado, a expressão indica que os corpos celestes mencionados no contexto servem de referência para o calendário. “Por eles vêm” mantém a relação instrumental sem restringi-la indevidamente à lua.
- source_word: מועד
  choice: o tempo determinado
  rationale: מועד pode designar um tempo marcado ou uma festa. Em paralelo com זמני e à luz da referência grega ao sinal de uma festa, a formulação mais ampla preserva tanto o sentido cronológico quanto a possível dimensão festiva.
- source_word: וזמני חוק
  choice: as épocas fixadas por decreto
  rationale: זמנים indica tempos ou épocas, enquanto חוק comunica algo estabelecido, prescrito ou decretado. A tradução expressa a regularidade normativa do calendário.
- source_word: וחפץ עשיו
  choice: e a obra que ele desejou
  rationale: A forma hebraica transmitida é difícil. “A obra que ele desejou” preserva a noção de vontade ou desejo em חפץ e a possível associação de עשיו com fazer, sem alegar certeza morfológica indevida.
- source_word: בתקופתו
  choice: está em seu ciclo
  rationale: תקופה designa volta, circuito ou ciclo sazonal. No contexto astronômico, “ciclo” comunica com naturalidade o movimento recorrente e sua função calendárica.
theological_decisions:
- issue: Sujeito e força teológica do segundo membro
  choice: Manter uma referência geral à obra desejada e à sua ordem cíclica
  alternative: Identificar explicitamente a lua como o luminar que marca as festas, conforme o grego, ou afirmar a grandeza do Senhor que a fez, conforme a leitura de Massada
  rationale: O texto hebraico da Genizá é obscuro, e as testemunhas paralelas divergem. A tradução não explicita um sujeito além do que o hebraico permite nem transforma uma variante manuscrita em texto principal; a incerteza é registrada nas notas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe poética concisa. “Épocas” evita a possível ambiguidade de “estações” no português brasileiro, e as notas preservam a dificuldade textual sem sobrecarregar o verso.
