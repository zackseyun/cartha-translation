  text: As you exalt the Lord[a], lift up your voice as much as you can, for there is still more.
translation:
  language: pt
  text: Ao exaltarem o Senhor[a], levantem a voz tanto quanto puderem, pois ainda há mais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “pois ele ainda é maior”, explicitando que o Senhor excede todo louvor. O hebraico é mais breve: “pois ainda há mais”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מגדלי
  choice: Ao exaltarem
  rationale: O particípio plural de גדל dirige-se aos que engrandecem ou exaltam o Senhor. A construção verbal é natural em português e mantém o sentido de louvor, também apoiado pelo paralelo grego.
- source_word: ה'
  choice: o Senhor
  rationale: A forma reverencial do nome divino é vertida segundo o uso português consagrado, sem transliterar o tetragrama.
- source_word: הרימו קול
  choice: levantem a voz
  rationale: Reproduz de modo idiomático e concreto a expressão hebraica para louvor vocal.
- source_word: בכל תוכלו
  choice: tanto quanto puderem
  rationale: Expressa a medida máxima da capacidade dos destinatários; o grego confirma o sentido de 'quanto puderem'.
- source_word: כי יש עוד
  choice: pois ainda há mais
  rationale: 'Mantém a brevidade e a elipse do hebraico: por mais que se louve, resta ainda mais, sem explicitar no corpo do texto aquilo que o grego desenvolve.'
theological_decisions:
- issue: Grau de explicitação da transcendência de Deus na oração final
  choice: pois ainda há mais
  alternative: pois ele ultrapassa até mesmo isso
  rationale: O hebraico preservado é breve e elíptico, ao passo que o grego torna explícito que o Senhor excede todo louvor. A tradução principal prioriza o hebraico e registra a leitura explicativa grega em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com imperativo plural de terceira pessoa e formulação concisa. A nota preserva a diferença entre o hebraico e o paralelo grego.
