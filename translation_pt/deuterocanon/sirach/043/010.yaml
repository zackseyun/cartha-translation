  text: At his word the decree stands[b][a], and they do not fail in their watches.
translation:
  language: pt
  text: Pela palavra de Deus, o decreto permanece firme[a], e eles não vacilam em suas vigílias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O manuscrito de Massada traz: “Pela palavra do Senhor, o decreto permanece firme”, usando “Senhor” onde o texto hebraico aqui seguido traz “Deus”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “não fraquejam em seus postos”. O verbo hebraico é incerto; o paralelo grego apoia o sentido de não fraquejar nem abandonar a função designada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בדבר אל
  choice: Pela palavra de Deus
  rationale: A preposição ב pode indicar meio ou causa, e אל explicita a referência divina no texto hebraico fornecido. A formulação é natural em português e mantém a concisão do original.
- source_word: יעמד
  choice: permanece firme
  rationale: עמד significa literalmente “estar de pé” e, neste contexto cósmico, comunica a permanência estável do decreto.
- source_word: חק
  choice: o decreto
  rationale: חק designa uma determinação ou ordem fixada. “Decreto” preserva a ideia de uma disposição autoritativa sem reduzir o termo a legislação humana.
- source_word: ולא ישח
  choice: e eles não vacilam
  rationale: A forma hebraica é incerta. “Não vacilam” expressa constância sem especificar em excesso se a imagem é de fraqueza, cansaço, queda ou afrouxamento; o grego apoia o sentido de não fraquejar.
- source_word: באשמרותם
  choice: em suas vigílias
  rationale: אשמרות pode indicar turnos de guarda, vigílias ou postos designados. “Em suas vigílias” conserva a imagem de serviço e ordem celestes.
theological_decisions:
- issue: Explicitar o referente divino
  choice: Traduzir אל como “Deus” no texto principal
  alternative: “Pela sua palavra” ou, conforme a variante de Massada, “Pela palavra do Senhor”
  rationale: O texto hebraico apresentado contém אל, que normalmente significa “Deus”. A variante de Massada emprega o título “Senhor”; essa diferença é preservada em nota, sem substituir a leitura-base.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem é ligeiramente ajustada à sintaxe natural do português, e a linguagem preserva a imagem cósmica de decreto, constância e vigílias.
