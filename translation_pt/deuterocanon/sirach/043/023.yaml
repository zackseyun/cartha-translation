  text: By his plan he stilled the deep[b][a], and planted islands in it.
translation:
  language: pt
  text: Por seu plano, aquietou o abismo[a] e nele plantou ilhas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto hebraico é difícil neste ponto. O paralelo grego diz literalmente: “Por seu raciocínio, aquietou o abismo e o plantou.” Ele apoia o sentido de “aquietou o abismo”, mas a expressão “plantou o abismo” é obscura; o hebraico menciona ilhas.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “terras costeiras”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מחשבתו
  choice: por seu desígnio
  rationale: O substantivo hebraico pode indicar pensamento, intenção ou plano. “Desígnio” comunica aqui uma intenção eficaz e deliberada, em consonância com o grego λογισμῷ αὐτοῦ.
- source_word: משיק
  choice: aquietou
  rationale: A forma hebraica é difícil, mas o contexto e o grego ἐκόπασεν sustentam o sentido de fazer cessar a agitação ou trazer repouso. “Aquietou” preserva a imagem sem exagerar sua precisão.
- source_word: רבה / בתהום
  choice: as profundezas / nelas
  rationale: A leitura hebraica é incerta, enquanto o paralelo grego traz ἄβυσσον, “abismo”. “As profundezas” mantém a linguagem cosmológica e permite uma retomada natural por “nelas”.
- source_word: ויט
  choice: plantou
  rationale: O verbo parece expressar a ideia de colocar ou estabelecer, e o grego ἐφύτευσεν significa literalmente “plantou”. A escolha conserva a metáfora vívida.
- source_word: איים
  choice: ilhas
  rationale: O termo pode designar ilhas ou terras costeiras. Neste contexto de estabelecimento de terras nas profundezas, “ilhas” oferece a imagem mais concreta, sem ocultar a alternativa em nota.
theological_decisions:
- issue: Tensão textual entre o hebraico difícil e o paralelo grego mais claro
  choice: Traduzir com base prioritária no hebraico sobrevivente, usando o grego para esclarecer o sentido de aquietar as profundezas e plantar ilhas nelas.
  alternative: “Por seu pensamento, acalmou o abismo e nele estabeleceu terras costeiras.”
  rationale: O hebraico permanece a testemunha principal, mas sua redação neste versículo é difícil. O grego serve como testemunha textual real para estabilizar o sentido, enquanto as incertezas relevantes são apresentadas em notas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Desígnio” preserva o tom sapiencial; “aquietou” e “plantou” mantêm as imagens cosmológicas do texto.
