  text: Let us still magnify him[a], for we cannot search him out; and he is greater than all his works.
translation:
  language: pt
  text: Proclamemos ainda sua grandeza[a], pois não podemos sondá-lo; ele é maior do que todas as suas obras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico, mais literalmente: “Engrandeçamos ainda”, ou “Falemos ainda de sua grandeza”; o objeto não está expresso. O contexto e o paralelo grego indicam, pelo sentido, que a referência é a Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נגדלה עוד
  choice: Continuemos a proclamar sua grandeza
  rationale: A forma cohortativa plural de גדל, combinada com עוד, exorta a prosseguir na declaração ou exaltação da grandeza de Deus. A formulação mantém a exortação e soa natural em português, sem exigir um objeto explícito que o hebraico não apresenta.
- source_word: כי לא נחקור
  choice: pois não podemos sondá-lo
  rationale: חקר expressa investigar ou perscrutar até o fundo. “Sondá-lo” conserva a metáfora da investigação e, com o pronome, torna explícito o referente indicado pelo contexto e confirmado pelo paralelo grego.
- source_word: והוא גדול
  choice: ele é maior
  rationale: A expressão seguinte, מכל מעשיו, dá valor comparativo ao adjetivo; o paralelo grego também sustenta “maior”, não apenas “grande”.
- source_word: מכל מעשיו
  choice: do que todas as suas obras
  rationale: מעשים pode designar feitos ou obras. No contexto do hino à criação, “obras” abrange adequadamente tudo quanto Deus fez e permanece próximo do hebraico.
theological_decisions:
- issue: Objeto implícito de “não podemos sondar”
  choice: Explicitar Deus como referente por meio de “sondá-lo”.
  alternative: Deixar a frase sem objeto — “pois não podemos sondar” — ou referi-la à sua grandeza.
  rationale: O hebraico omite o objeto, mas o contexto imediato e o paralelo grego apontam para Deus. O pronome assegura clareza em português sem acrescentar uma formulação doutrinária.
- issue: Sentido de נגדלה
  choice: Entender como exortação a continuar proclamando a grandeza de Deus.
  alternative: Traduzir mais literalmente como “engrandeçamo-lo ainda” ou como “louvemo-lo ainda mais”.
  rationale: O verbo admite linguagem de engrandecimento ou louvor, mas o objeto está implícito. “Proclamar sua grandeza” preserva a ideia sem sugerir que seres humanos tornam Deus maior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Continuemos a proclamar” comunica naturalmente o cohortativo hebraico; “sondá-lo” preserva a imagem de investigação sem transformar o verso numa explicação teológica.
