base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/016.yaml
  text: At the sound of his thunder the earth writhes[b][a]; the blasts of the north are storm and tempest.
translation:
  language: pt
  text: Ao som do seu trovão, a terra se contorce[a]; as rajadas do norte são vendaval e tempestade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico traduzido por “se contorce” também pode significar “treme” ou “estremece”, evocando um movimento convulsivo.
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego diz: “e, quando ele aparecer, os montes serão abalados; por sua vontade sopra o vento sul”. Essa leitura difere substancialmente do hebraico preservado, que fala das rajadas do norte como vendaval e tempestade.'
    reason: alternative_reading
lexical_decisions:
- source_word: קול רעמו
  choice: Ao som do seu trovão
  rationale: A construção indica o estrondo audível do trovão atribuído a Deus. “Som” é natural e “seu trovão” preserva o sufixo possessivo.
- source_word: יחיל
  choice: se contorce
  rationale: O verbo חול/חיל pode expressar tremor, convulsão ou dores de parto. “Se contorce” conserva a imagem corporal intensa sem eliminar a possibilidade de tremor, registrada em nota.
- source_word: ארצו
  choice: a terra
  rationale: Embora o hebraico tenha sufixo possessivo, “a sua terra” poderia sugerir território limitado. “A terra” comunica melhor o âmbito cósmico do hino e soa natural em português.
- source_word: זלעפות צפון
  choice: as rajadas do norte
  rationale: זלעפות denota rajadas violentas ou impetuosas; צפון significa literalmente “norte” e tem função meteorológica neste contexto.
- source_word: סופה
  choice: vendaval
  rationale: O termo designa tempestade violenta ou turbilhão. “Vendaval” ressalta a força do vento e permite distinguir os dois substantivos hebraicos próximos.
- source_word: וסערה
  choice: e tempestade
  rationale: סערה pertence ao campo semântico de tormenta, temporal e redemoinho. “Tempestade” mantém a intensificação poética sem criar precisão indevida.
theological_decisions:
- issue: Sufixos possessivos na imagem meteorológica
  choice: Manter “seu” em “seu trovão”, mas verter ארצו como “a terra”.
  alternative: “Ao som do seu trovão, sua terra se contorce.”
  rationale: A atribuição do trovão a Deus é explícita e relevante no contexto. Já a repetição do possessivo diante de “terra” seria menos natural e poderia ser entendida em sentido territorial restrito.
- issue: Divergência substancial entre o hebraico e o paralelo grego
  choice: Seguir no texto principal o hebraico preservado, que menciona as rajadas do norte, o vendaval e a tempestade.
  alternative: 'O grego diz: “e, quando ele aparecer, os montes serão abalados; por sua vontade sopra o vento sul”.'
  rationale: O hebraico extante é a fonte primária adotada para Ben Sira. A tradição grega diverge tanto nos dois membros do versículo que deve ser preservada integralmente em nota, sem ser harmonizada com o hebraico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe poética clara. “Vendaval e tempestade” preserva o paralelismo intensificador e distingue, na medida possível, os dois termos meteorológicos hebraicos. Os marcadores seguem a ordem de ocorrência no texto.
