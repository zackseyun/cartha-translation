  text: It scorches the produce of the mountains with drought[b][a], and the pasture of plants with flame.
translation:
  language: pt
  text: Abrasa, com a seca[a][b], a produção dos montes e, com a chama, a vegetação do prado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz de modo mais geral: “Consumirá os montes, incendiará o deserto e extinguirá a relva como fogo”. O texto hebraico traduzido aqui é mais compacto e apresenta imagens diferentes.'
    reason: alternative_reading
  - marker: b
    text: A expressão hebraica traduzida por “com a seca” emprega uma palavra que também pode ser vertida mais literalmente por “com a secura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יבול
  choice: fruto
  rationale: O substantivo indica aquilo que a terra produz. “Fruto” conserva a imagem poética e, neste contexto, abrange a produção vegetal dos montes sem sugerir apenas uma lavoura cultivada.
- source_word: הרים
  choice: montes
  rationale: É o sentido direto do plural hebraico e corresponde ao grego ὄρη. “Montes” soa natural no registro poético bíblico sem ser arcaico.
- source_word: בחרב
  choice: com a seca
  rationale: חֹרֶב designa secura ou seca. “Com a seca” expressa de modo idiomático o agente destrutivo; “com a secura” seria uma alternativa mais literal.
- source_word: ישיק
  choice: abrasa
  rationale: No paralelismo com “chama”, o verbo retrata uma ação destrutiva semelhante a queimar ou chamuscar. “Abrasa” preserva a força poética sem exigir combustão literal no primeiro membro.
- source_word: נוה
  choice: prado
  rationale: Embora possa significar morada, aqui a associação com plantas favorece o sentido de pastagem ou área de vegetação. “Prado” mantém a concisão e a imagem natural.
- source_word: צמחים
  choice: plantas
  rationale: Tradução direta do plural referente ao que brota ou cresce, clara para leitores atuais.
- source_word: בלהבה
  choice: com a chama
  rationale: A preposição é entendida em sentido instrumental. A formulação mantém a imagem compacta do hebraico e o paralelismo com “com a seca”.
