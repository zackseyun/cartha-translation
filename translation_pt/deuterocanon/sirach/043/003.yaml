  text: At its shining it makes the world boil[b][a], and before its sword who can endure?
translation:
  language: pt
  text: Quando resplandece, faz o mundo ferver[b]; diante de sua espada, quem pode suportar?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: «diante de sua espada»; o paralelo grego traz «diante de seu calor abrasador, quem ficará de pé?». O texto principal conserva a metáfora hebraica.'
    reason: alternative_reading
  - marker: b
    text: O manuscrito mais antigo de Massada está fragmentário neste ponto. A redação principal segue os manuscritos hebraicos da Guenizá do Cairo, com o grego usado para conferência.
    reason: textual_variant
lexical_decisions:
- source_word: בהצהירו
  choice: Quando resplandece
  rationale: Expressa de modo natural o brilho intenso indicado pela raiz hebraica צהר, sem adotar no texto principal a interpretação temporal do grego, «ao meio-dia».
- source_word: ירתיח
  choice: faz ... ferver
  rationale: Preserva a imagem concreta e vigorosa do hebraico רתח, mais forte que «aquece» e menos interpretativa que «resseca».
- source_word: תבל
  choice: o mundo
  rationale: תבל designa o mundo, especialmente a terra habitada; «o mundo» é claro, amplo e natural em português.
- source_word: חרבו
  choice: sua espada
  rationale: Mantém a metáfora marcante do texto hebraico para a força cortante e destrutiva do sol, em vez de nivelá-la à leitura interpretativa grega «calor abrasador».
- source_word: מי יתכלכל
  choice: quem pode resistir?
  rationale: Comunica idiomaticamente a ideia de manter-se firme ou suportar uma força opressiva; também corresponde ao sentido do paralelo grego «quem ficará de pé?».
