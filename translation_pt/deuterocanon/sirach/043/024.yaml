base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/024.yaml
  text: Those who go down to the sea recount its far reaches[a]; when our ears hear[b], we are astonished.
translation:
  language: pt
  text: Os que descem ao mar[a] contam sobre seus confins[b]; ao ouvir com nossos próprios ouvidos, ficamos assombrados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica diz literalmente “os que descem ao mar” e é uma maneira de se referir aos navegantes.
    reason: cultural_note
  - marker: b
    text: O grego traz “seu perigo” em vez do hebraico “seus confins” ou “seu extremo”. O texto principal segue o testemunho hebraico preservado; o grego pode refletir uma leitura variante ou interpretativa voltada para os perigos do mar.
    reason: alternative_reading
lexical_decisions:
- source_word: יורדי הים
  choice: os que descem ao mar
  rationale: Preserva a imagem do idioma hebraico para os navegantes, mantendo uma formulação clara em português; o paralelo grego confirma o sentido marítimo.
- source_word: יספרו
  choice: contam sobre
  rationale: Expressa o ato de narrar ou relatar aquilo que os viajantes conheceram, sem tornar a frase excessivamente formal.
- source_word: קצהו
  choice: seus confins
  rationale: Segue o hebraico, que aponta para o extremo, limite ou alcance remoto do mar. “Confins” preserva essa amplitude espacial e a linguagem elevada do contexto.
- source_word: לשמע אזנינו
  choice: ao ouvir com nossos próprios ouvidos
  rationale: Mantém a ênfase sensorial da expressão hebraica, literalmente relacionada ao ouvir dos nossos ouvidos, em português natural.
- source_word: נשתומם
  choice: ficamos assombrados
  rationale: Comunica a reação de espanto intenso sem determinar se ela consiste sobretudo em admiração ou temor, preservando a abertura semântica do hebraico.
