base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/008.yaml
  text: Month by month it renews itself—how awe-inspiring it is in its changing! A vessel of the host on high[c][b][a], from the expanse of the sky is its shining.
translation:
  language: pt
  text: Mês após mês, ela se renova — como é assombrosa em sua mudança![a] Instrumento do exército das alturas,[b][c] seu resplendor vem da extensão do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “A lua, conforme o seu nome, cresce maravilhosamente em sua mudança”. Isso reflete uma redação ou interpretação diferente do hebraico preservado: “Mês após mês, ela se renova”.'
    reason: alternative_reading
  - marker: b
    text: O hebraico da segunda metade é difícil e provavelmente apresenta incerteza textual. O manuscrito de Massada conserva uma formulação relacionada, mas diferente da dos manuscritos da Geniza do Cairo. O sentido geral parece ser que a lua pertence ao exército celeste e resplandece no céu.
    reason: textual_variant
  - marker: c
    text: 'Ou, possivelmente: “harpas das alturas”. A expressão hebraica é incomum e talvez seja metafórica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חדש בחדשו הוא מתחדש
  choice: Mês após mês, ela se renova
  rationale: A repetição da raiz חדש e o valor temporal de בחדשו favorecem “mês após mês”. O reflexivo “se renova” preserva מתחדש; o pronome feminino concorda naturalmente com “lua” em português, identificada pelo contexto.
- source_word: מה נורא
  choice: como é assombrosa
  rationale: נורא descreve aquilo que causa temor e admiração reverente. “Assombrosa” mantém essa combinação sem reduzir o sentido a mero medo.
- source_word: בהשתנותו
  choice: em suas mudanças
  rationale: A expressão refere-se às alterações visíveis da lua. O plural idiomático em português comunica naturalmente suas fases sem explicá-las no texto.
- source_word: כלי צבא
  choice: Instrumento do exército celeste
  rationale: כלי pode ser objeto, utensílio, instrumento ou arma, e צבא pode designar exército ou hoste. “Instrumento do exército celeste” preserva a imagem cósmica e evita especificar uma função militar.
- source_word: נבלי מרום
  choice: celeste
  rationale: A linha hebraica é provavelmente incerta ou corrompida. A tradução principal exprime o sentido geral de pertença ao exército das alturas, enquanto a leitura lexical possível “harpa das alturas” é preservada em nota.
- source_word: מרצף רקיע
  choice: da extensão do céu
  rationale: רקיע é a extensão ou firmamento; מרצף é difícil e pode evocar uma superfície estendida ou pavimentada. A formulação escolhida preserva a imagem cosmológica sem impor a metáfora incerta de um pavimento.
- source_word: מזהירתו
  choice: seu resplendor vem
  rationale: A forma deriva da raiz זהר, ligada a brilho e radiância. Como a oração hebraica é elíptica, “seu resplendor vem” fornece sintaxe natural em português com mínima explicitação.
theological_decisions:
- issue: Prioridade do hebraico diante do paralelo grego e de uma linha poeticamente difícil
  choice: Seguir o hebraico preservado como texto principal, registrando o grego e as incertezas da segunda metade em notas.
  alternative: Traduzir a primeira metade segundo o grego e parafrasear livremente a segunda como uma descrição geral da lua no céu.
  rationale: O hebraico é o testemunho primário disponível para esta passagem. O grego atesta uma redação ou interpretação diferente, mas não resolve as dificuldades textuais da segunda metade; por isso, as alternativas são apresentadas sem harmonização silenciosa.
translation_notes:
  register: Português moderno, digno e acessível, com cadência poética. “Assombrosa” conserva o temor reverente do hebraico; “exército celeste” é mais imediatamente compreensível que “hoste celeste”. As dificuldades textuais não são ocultadas, mas deslocadas para notas para manter a leitura fluente.
