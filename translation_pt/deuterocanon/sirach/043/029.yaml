  text: The Lord is exceedingly awesome[a], and his words are wondrous.
translation:
  language: pt
  text: O Senhor é temível ao extremo, e suas palavras são maravilhosas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego paralelo diz: “e seu domínio é maravilhoso” (ou “seu governo é admirável”), diferentemente do hebraico existente: “e suas palavras são maravilhosas”.'
    reason: Leitura alternativa do paralelo grego.
lexical_decisions:
- source_word: נורא
  choice: temível
  rationale: O adjetivo derivado de ירא descreve quem inspira temor e reverência. “Temível” preserva essa combinação melhor do que termos que sugeririam apenas ameaça ou apenas admiração.
- source_word: ה׳
  choice: O Senhor
  rationale: A abreviação hebraica representa o nome divino; “O Senhor” é a forma portuguesa natural e concorda com o paralelo grego Κύριος.
- source_word: מאד מאד
  choice: ao extremo
  rationale: A repetição intensifica fortemente o adjetivo. “Ao extremo” comunica essa ênfase em português natural, sem a rigidez de “muito, muito”.
- source_word: ונפלאות
  choice: e ... são maravilhosas
  rationale: A forma plural de פלא indica algo extraordinário, admirável ou maravilhoso. Como a oração hebraica não traz cópula expressa, acrescenta-se “são” em português.
- source_word: דבריו
  choice: suas palavras
  rationale: O sentido direto é “suas palavras” ou “seus pronunciamentos”. O hebraico existente rege o texto principal, enquanto a leitura diferente do grego é registrada em nota.
theological_decisions:
- issue: Representação do nome divino ה׳
  choice: O Senhor
  alternative: SENHOR
  rationale: A abreviação aponta para o nome divino, tradicionalmente representado por “Senhor”. A forma com maiúscula inicial funciona naturalmente como título neste contexto e corresponde ao grego Κύριος.
- issue: Diferença entre o hebraico e o grego no segundo membro
  choice: suas palavras são maravilhosas
  alternative: seu domínio é maravilhoso
  rationale: O testemunho hebraico existente traz דבריו, “suas palavras”, e por isso determina o texto principal. O grego apresenta uma leitura materialmente diferente, preservada em nota sem harmonização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Temível ao extremo” conserva tanto a ideia de temor reverente quanto a forte intensificação hebraica; a nota fica junto da oração a que a variante grega se refere.
