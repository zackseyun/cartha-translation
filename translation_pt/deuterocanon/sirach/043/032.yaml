  text: Many such wonders exist[b][a], but I have seen only a few of his works.
translation:
  language: pt
  text: Há muitas maravilhas como essas,[a] mas vi apenas poucas das suas obras.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz uma formulação mais ampla: “Há muitas coisas ocultas, maiores do que essas”. O hebraico preservado diz de forma mais breve: “Há muitas maravilhas como essas”.'
    reason: alternative_reading
  - marker: b
    text: 'O grego diz: “vimos apenas poucas das suas obras”; o hebraico preservado traz “vi”.'
    reason: textual_variant
lexical_decisions:
- source_word: רוב
  choice: muitas
  rationale: Neste contexto, indica grande quantidade; o paralelo grego πολλὰ confirma o sentido quantitativo, em vez de exigir a ideia estrita de “a maioria”.
- source_word: נפלאות
  choice: maravilhas
  rationale: O termo designa feitos extraordinários que despertam admiração e reverência; “maravilhas” é claro, digno e adequado ao contexto hínico.
- source_word: כאלה
  choice: como essas
  rationale: Retoma os fenômenos descritos anteriormente e preserva de modo natural a força comparativa do hebraico.
- source_word: מעט
  choice: apenas poucas
  rationale: Expressa o número limitado das obras contempladas; “apenas” torna explícita em português a força restritiva implícita no contexto.
- source_word: ראיתי
  choice: vi
  rationale: O perfeito hebraico apresenta a experiência do eu poético. O pretérito perfeito simples é a forma mais natural e direta em português.
- source_word: ממעשיו
  choice: das suas obras
  rationale: 'A preposição מן tem sentido partitivo: foram vistas poucas dentre a totalidade das obras de Deus.'
theological_decisions:
- issue: Se a formulação mais ampla do grego, com coisas ocultas e maiores, deve aparecer no texto principal
  choice: 'Priorizar no texto principal o hebraico preservado: “Há muitas maravilhas como essas”.'
  alternative: “Há muitas coisas ocultas, maiores do que essas.”
  rationale: O testemunho hebraico existente não contém equivalentes explícitos para “ocultas” nem “maiores”. A leitura grega é relevante, mas deve ser preservada em nota sem ampliar silenciosamente o texto hebraico.
- issue: Diferença de pessoa e número entre o hebraico e o grego
  choice: 'Manter a primeira pessoa do singular: “vi”.'
  alternative: “vimos”
  rationale: O hebraico preservado traz ראיתי, primeira pessoa do singular. O plural grego é uma variante textual significativa, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem das orações e o contraste com “mas” reproduzem o movimento do hebraico sem incorporar ao texto principal as expansões do paralelo grego.
