  text: Look at the rainbow and bless its Maker[b][a], for it is exceedingly majestic in splendor.
translation:
  language: pt
  text: Contemple o arco-íris[a] e bendiga aquele que o fez, pois o arco-íris é extremamente majestoso em esplendor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “arco”; aqui, o arco celeste, isto é, o arco-íris.'
    reason: lexical_alternative
  - marker: b
    text: O rolo de Massada apoia aqui o sentido de majestade e esplendor, com uma formulação cognata à do texto da Guenizá do Cairo.
    reason: textual_variant
lexical_decisions:
- source_word: ראה
  choice: Contemple
  rationale: O imperativo pede atenção visual direta. “Contemple” é natural, digno e adequado ao tom poético de louvor.
- source_word: קשת
  choice: arco-íris
  rationale: O substantivo significa literalmente “arco”, mas neste contexto cosmológico designa o arco celeste; “arco-íris” explicita o referente para o leitor moderno.
- source_word: וברך
  choice: e bendiga
  rationale: Preserva o sentido básico de ברך e o tom reverente, sem reduzir o verbo simplesmente a “louvar”.
- source_word: עושיה
  choice: aquele que o fez
  rationale: Reproduz a construção participial e o sufixo que retoma o arco-íris, sem explicitar “Deus” além do que o hebraico declara.
- source_word: כי
  choice: pois
  rationale: Introduz a razão para bendizer aquele que fez o arco-íris e mantém um registro poético natural.
- source_word: מאד
  choice: extremamente
  rationale: Expressa com clareza a forte intensificação do advérbio hebraico.
- source_word: נאדרה
  choice: é majestoso
  rationale: O verbo derivado de אדר comunica grandeza, magnificência ou majestade. A forma feminina no hebraico retoma קשת; por isso, o referente foi repetido em português para evitar que a qualidade pareça atribuída ao Criador.
- source_word: בהוד
  choice: em esplendor
  rationale: הוד abrange esplendor, majestade e glória. “Em esplendor” conserva a construção e não restringe o sentido apenas ao brilho visual.
theological_decisions:
- issue: Referente da bênção
  choice: Bendizer “aquele que o fez”, implicitamente Deus
  alternative: “bendiga Deus, que o fez” ou “bendiga seu Criador”
  rationale: O hebraico não nomeia Deus diretamente, mas diz “aquele que o fez”. A tradução preserva essa formulação e evita acrescentar uma explicitação doutrinária desnecessária.
- issue: Referente de נאדרה
  choice: A majestade é atribuída ao arco-íris
  alternative: Deixar o sujeito implícito, permitindo que em português pareça referir-se àquele que o fez
  rationale: A concordância feminina do hebraico liga inequivocamente o predicado a קשת. A repetição de “o arco-íris” em português conserva essa relação gramatical.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. O registro é poético e reverente sem arcaísmo excessivo. A repetição de “o arco-íris” evita uma ambiguidade criada pela gramática portuguesa e preserva o referente indicado pela concordância hebraica.
