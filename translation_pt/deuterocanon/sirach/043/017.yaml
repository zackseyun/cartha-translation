translation:
  language: pt
  text: Ao clarão, ele sacode a sua neve[a], e, como gafanhotos, ela se instala em sua morada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho hebraico é difícil e difere profundamente do paralelo grego. O grego fala, em vez disso, do som de seu trovão, de uma tempestade do vento norte e de um redemoinho. O manuscrito de Massada também preserva uma forma hebraica diferente desta linha, lendo em parte «o som do trovão» onde o texto da Geniza do Cairo traz «ao clarão».
    reason: textual_variant
lexical_decisions:
- source_word: ברשף
  choice: Ao clarão
  rationale: רשף pode indicar clarão, chama ou fulgor semelhante ao relâmpago. No contexto meteorológico, «Ao clarão» preserva de modo conciso a força temporal ou circunstancial do hebraico sem especificar além do texto.
- source_word: יניף
  choice: ele sacode
  rationale: O verbo נוף/הניף pode significar agitar, brandir ou fazer mover. Tendo «neve» por objeto, «sacode» comunica naturalmente a imagem de neve lançada ou espalhada, sem eliminar a metáfora concreta.
- source_word: שלגו
  choice: a sua neve
  rationale: A forma hebraica traz sufixo possessivo, literalmente «sua neve». Mantê-lo em português preserva a referência à neve pertencente ou submetida a Deus, presente de modo explícito no testemunho hebraico.
- source_word: וכארבה
  choice: e, como gafanhotos
  rationale: ארבה é o termo comum para gafanhoto ou gafanhotos. O plural idiomático em português conserva a comparação com uma massa que desce e se espalha.
- source_word: ישכון
  choice: ela se assenta
  rationale: שכן significa habitar, permanecer ou assentar-se. Referido à neve, «se assenta» expressa de forma natural que ela chega ao repouso depois de cair.
- source_word: דירתו
  choice: onde permanece
  rationale: דירה significa morada ou lugar de habitação. Como a construção hebraica é difícil, «onde permanece» conserva o sentido locativo e a ideia de permanência sem impor uma reconstrução excessivamente precisa.
theological_decisions:
- issue: Uso do hebraico diante do paralelo grego divergente
  choice: Traduzir no texto principal a linha hebraica preservada e registrar a divergência em nota.
  alternative: Adotar o texto grego, que fala da voz do trovão de Deus, de uma tempestade do vento norte e de um redemoinho.
  rationale: Como existe testemunho hebraico para este versículo, ele serve de base primária. A diferença acentuada em relação ao grego é textual, não algo que deva ser harmonizado ou ocultado.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação mantém a imagem incomum e a dificuldade do hebraico, enquanto a nota expõe a importante variante textual.
