  text: The splendor of the heights is the clear firmament, the appearance of heaven in a vision of glory.
translation:
  language: pt
  text: A força dos céus aumenta o esplendor dele, e tudo obedece a cada necessidade. Todos são diferentes uns dos outros, e ele não fez nenhum deles inútil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico deste versículo é difícil e difere consideravelmente do grego. O grego diz: “O orgulho das alturas é o firmamento límpido, a aparência do céu numa visão de glória.” A última expressão hebraica também pode ser entendida como “nenhum deles para falhar” ou “nenhum deles para cessar”.'
    reason: Registra uma importante variante textual antiga e a incerteza lexical de שיסוף sem resolvê-las silenciosamente.
lexical_decisions:
- source_word: עצם שמים
  choice: A força dos céus
  rationale: עצם pode indicar força, essência ou substância. “Força” produz uma frase natural sem eliminar por completo a amplitude do hebraico.
- source_word: מרבים הדרו
  choice: aumenta o esplendor dele
  rationale: Mantém o sentido causativo/plural de רבה e o sufixo de terceira pessoa em הדרו, sem identificar explicitamente o referente.
- source_word: לכל צרך
  choice: para cumprir cada propósito
  rationale: צרך pode ser necessidade, uso ou finalidade; no contexto da ordem criada, “cada propósito” expressa a função pretendida sem restringi-la à necessidade humana.
- source_word: הכל ישמע
  choice: tudo obedece
  rationale: שמע significa ouvir e, por extensão, atender ou obedecer. Aqui “obedece” comunica de modo idiomático a submissão de toda a criação.
- source_word: שיסוף
  choice: inútil
  rationale: A forma é difícil. Pelo contexto e pela comparação entre os seres criados, entende-se como aquilo que falha, cessa ou se mostra sem utilidade; a nota registra a incerteza.
theological_decisions:
- issue: Referente de “seu esplendor”
  choice: “o esplendor dele”
  alternative: “o esplendor de Deus”
  rationale: O hebraico usa apenas um sufixo pronominal. Preservar o pronome evita inserir no texto um referente teológico que, embora provável no contexto, não está nomeado neste versículo.
- issue: Divergência entre o hebraico e a tradição grega
  choice: Traduzir o texto hebraico fornecido e registrar a forma grega em nota
  alternative: Adotar no texto principal a leitura grega sobre o firmamento límpido
  rationale: A evidência hebraica indicada como fonte principal difere substancialmente da Septuaginta. A prioridade editorial é traduzir diretamente essa fonte, mantendo visível a variante antiga.
translation_notes:
  register: Português moderno, claro e digno, com construção acessível ao público brasileiro e inteligível internacionalmente. A tradução segue prioritariamente o hebraico composto de Kahana, apesar da forte divergência em relação ao grego e à camada inglesa de consulta.
