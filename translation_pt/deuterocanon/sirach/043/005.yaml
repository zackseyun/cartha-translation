  text: For great is the Lord who made it[b][a], and by his word he hastens its course.
translation:
  language: pt
  text: Pois grande é o Senhor que a fez[a], e, por sua palavra, ele acelera o curso dela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em Massada, conserva-se apenas a primeira oração: «Pois grande é o Senhor que a fez». O hebraico da Geniza do Cairo prossegue com uma leitura difícil, e o paralelo grego sustenta o sentido: «por sua palavra, ele acelera o curso dela».'
    reason: textual_variant
  - marker: b
    text: 'Ou: «ao seu comando, ele dirige o curso dela».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גדול
  choice: grande
  rationale: Adjetivo predicativo que descreve o Senhor; «grande» é a tradução mais direta, natural e apropriada ao contexto hínico.
- source_word: ה׳
  choice: o Senhor
  rationale: A abreviação reverencial do nome divino é vertida pela forma portuguesa tradicional e amplamente compreensível «o Senhor».
- source_word: עושהו
  choice: que a fez
  rationale: O sufixo remete mais naturalmente ao astro mencionado no contexto, a lua; por isso, emprega-se o pronome feminino «a» em português.
- source_word: בדבריו
  choice: por sua palavra
  rationale: O singular coletivo «palavra» expressa de modo idiomático o valor instrumental e a ideia da ordem divina, sem impor a paráfrase mais interpretativa «ao seu comando».
- source_word: ינצח
  choice: ele acelera
  rationale: A forma hebraica é difícil neste contexto; o paralelo grego κατέσπευσεν favorece o sentido de apressar ou impelir, adequado ao movimento do astro.
- source_word: אביריו
  choice: o curso dela
  rationale: A leitura hebraica é problemática, enquanto o grego πορείαν indica «curso» ou «trajeto». «Curso» descreve naturalmente o movimento celeste sem introduzir o termo técnico moderno «órbita».
theological_decisions:
- issue: Tradução do nome divino
  choice: o Senhor
  alternative: YHWH
  rationale: A fonte hebraica traz a abreviação reverencial ה׳; «o Senhor» preserva seu uso religioso tradicional sem recorrer à transliteração.
- issue: Uso do paralelo grego na segunda oração textualmente difícil
  choice: Traduzir a primeira oração com base no hebraico e entender a segunda à luz do paralelo grego
  alternative: Traduzir literalmente a leitura hebraica difícil como «por suas palavras, seu poderoso prevalece»
  rationale: O hebraico continua sendo a testemunha principal, mas a segunda oração contém um problema lexical e textual. O grego oferece um sentido coerente — Deus acelera o curso do astro — sem eliminar da nota a incerteza da tradição hebraica.
translation_notes:
  register: Português moderno, digno e acessível, com cadência hínica. O pronome feminino retoma naturalmente «a lua» no contexto. As notas preservam tanto a alternativa idiomática quanto a dificuldade real do hebraico, sem sobrecarregar o texto principal.
