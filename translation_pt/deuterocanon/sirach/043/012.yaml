base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/012.yaml
  text: He encircled the horizon in his glory[c][b][a], and the hand of God stretched out in his majesty.
translation:
  language: pt
  text: Ela circundou um limite fixado em sua glória,[a][c] e a mão de Deus se estendeu em sua altura.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz «um limite fixado» (ou «uma determinação estabelecida») e usa um verbo feminino, cujo sujeito provavelmente é o arco-íris mencionado no versículo anterior. O paralelo grego traz: «Ele circundou o céu com um círculo de glória».'
    reason: alternative_reading
  - marker: b
    text: 'O hebraico tem «a mão de Deus», no singular, e não expressa objeto para «se estendeu». O paralelo grego traz «as mãos do Altíssimo» e acrescenta um objeto: «o estenderam».'
    reason: textual_variant
  - marker: c
    text: O manuscrito de Massada preserva aqui apenas um fragmento («… em sua glória»); a redação mais completa do texto principal vem dos manuscritos hebraicos da Genizá do Cairo.
    reason: textual_variant
lexical_decisions:
- source_word: חוק
  choice: uma ordem
  rationale: Preserva o sentido básico de estatuto, determinação ou ordem estabelecida. No contexto cósmico, pode sugerir uma ordem fixada por Deus, sem substituir o hebraico pelo «céu» da tradição grega.
- source_word: הקיפה
  choice: a circundou
  rationale: O verbo expressa cercar ou dar a volta; o pronome feminino retoma naturalmente o arco-íris do contexto anterior e reflete o sufixo hebraico.
- source_word: בכבודה
  choice: em sua glória
  rationale: Mantém a preposição e o sufixo feminino do hebraico, provavelmente relacionado ao arco-íris, sem explicitar além do texto.
- source_word: ויד אל
  choice: e a mão de Deus
  rationale: Segue o substantivo singular do hebraico e entende אל em seu sentido divino, confirmado pelo contexto de louvor e pelo paralelo grego.
- source_word: נטתה
  choice: se estendeu
  rationale: A forma feminina singular concorda com «mão» e descreve o gesto de estender-se. A construção pronominal é natural em português e evita acrescentar um objeto ausente no hebraico.
- source_word: בגבה
  choice: em majestade
  rationale: No contexto poético, comunica a ideia de elevação, grandeza ou excelsitude de modo natural e digno.
theological_decisions:
- issue: Divergência entre o testemunho hebraico e o paralelo grego
  choice: 'O texto principal segue o hebraico: «uma ordem», «a mão de Deus» no singular e uma construção sem objeto expresso no segundo membro.'
  alternative: «Ele circundou o céu com um círculo de glória, e as mãos do Altíssimo o estenderam.»
  rationale: O hebraico preservado é a fonte primária e deve governar o texto principal. O grego testemunha uma tradição textual ou interpretação antiga relevante, mas não deve eliminar as diferenças reais; por isso, elas são registradas em notas.
- issue: Referente dos sufixos femininos
  choice: O pronome em «a circundou» e «sua glória» é deixado com referência contextual ao arco-íris mencionado no versículo anterior.
  alternative: Entender a glória como pertencente diretamente a Deus e traduzir «em sua glória» com referente masculino.
  rationale: As formas hebraicas favorecem um referente feminino, e «arco-íris» é feminino no hebraico do contexto. A tradução conserva essa ligação sem inserir o substantivo no versículo.
translation_notes:
  register: Português atual, digno e acessível. «Uma ordem» conserva a estranheza poética genuína do hebraico; «se estendeu» soa natural sem apagar a imagem antropomórfica. As notas registram as variantes sem harmonizá-las silenciosamente.
