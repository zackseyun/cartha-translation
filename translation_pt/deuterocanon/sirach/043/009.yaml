  text: The splendor of the heavens and the majesty of the stars—its light shines brightly in the heights of God[a][b].
translation:
  language: pt
  text: A beleza dos céus e a majestade das estrelas — sua luz resplandece nas alturas de Deus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em Massada, o início deste trecho apresenta uma forma diferente: “... a beleza/o esplendor do céu e a majestade de uma estrela”; o texto da Genizá do Cairo traz “A beleza dos céus e a majestade das estrelas”. O texto principal segue o hebraico mais bem atestado aqui, com o paralelo grego apoiando o sentido coletivo.'
    reason: textual_variant
  - marker: b
    text: 'O paralelo grego diz: “beleza do céu, glória das estrelas, ornamento que dá luz; nas alturas, o Senhor”. Ele confirma a imagem dos luminares celestes como adorno radiante, embora o texto principal siga a formulação hebraica preservada.'
    reason: alternative_reading
lexical_decisions:
- source_word: תואר
  choice: beleza
  rationale: No paralelismo com הדר, descreve a aparência magnífica dos céus; “beleza” é natural, poético e semanticamente direto em português.
- source_word: שמים
  choice: os céus
  rationale: O plural tradicional e poético preserva a forma hebraica e designa a abóbada celeste.
- source_word: הדר
  choice: majestade
  rationale: Expressa magnificência e dignidade imponente, mantendo distinção lexical em relação a תואר.
- source_word: כוכב
  choice: as estrelas
  rationale: Embora a forma hebraica citada seja singular, pode ter sentido coletivo; o paralelo grego usa o plural ἄστρων e favorece esta leitura contextual.
- source_word: ואורו
  choice: sua luz
  rationale: Preserva o sufixo singular do hebraico e sua referência deliberadamente aberta ao astro ou conjunto celeste, sem impor concordância plural.
- source_word: מזהיר
  choice: resplandece
  rationale: Verbo corrente e digno que comunica emissão intensa de luz sem precisar acrescentar um advérbio.
- source_word: במרומי אל
  choice: nas alturas de Deus
  rationale: Mantém a referência divina explícita de אל e traduz naturalmente os lugares elevados associados a Deus.
theological_decisions:
- issue: Tradução de אל em במרומי אל
  choice: de Deus
  alternative: do Poderoso; nas alturas
  rationale: O hebraico menciona explicitamente אל; “Deus” é a tradução mais transparente e evita tanto eliminar a referência divina quanto introduzir um título interpretativo.
translation_notes:
  register: Português moderno, claro e poético, com leitura natural no Brasil e compreensão internacional. “Resplandece” conserva a elevação sapiencial sem soar arcaico; o travessão reproduz a progressão poética. O singular “sua luz” mantém a ambiguidade gramatical genuína do testemunho hebraico.
