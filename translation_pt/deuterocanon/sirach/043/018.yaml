  text: The appearance of snow dazzles the eyes, and at its falling the heart is amazed.
translation:
  language: pt
  text: A aparência da neve[a] deslumbra os olhos e, quando ela cai[b], o coração fica maravilhado.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico também pode ser entendido como «brancura»; porém, o paralelo grego e o contexto meteorológico favorecem fortemente «neve».
    reason: lexical_alternative
  - marker: b
    text: A expressão hebraica referente à sua «chuva» ou «precipitação» é textualmente difícil neste contexto; o paralelo grego apoia entendê-la como a queda da neve.
    reason: textual_variant
  - marker: c
    text: O manuscrito de Massada conserva uma linha vizinha diferente nesta seção («e a visão maravilha o coração»), o que indica alguma instabilidade na disposição destes membros poéticos entre os testemunhos hebraicos.
    reason: textual_variant
lexical_decisions:
- source_word: תואר
  choice: aparência
  rationale: Representa o aspecto visível do fenômeno sem limitar o sentido à beleza abstrata; também permite que a nuance estética refletida no grego permaneça perceptível.
- source_word: לבנה
  choice: neve
  rationale: Embora a forma hebraica possa significar «brancura», o contexto meteorológico e o paralelo grego χιόνα («neve») apoiam fortemente esta identificação.
- source_word: יגהה עינים
  choice: deslumbra os olhos
  rationale: Expressa o efeito intenso do brilho sobre a visão e corresponde tanto à linguagem hebraica de luminosidade quanto ao espanto visual do paralelo grego.
- source_word: ממטרו
  choice: quando ela cai
  rationale: O hebraico transmitido emprega linguagem ligada a chuva ou precipitação, mas é difícil neste contexto. A formulação apresenta de modo natural a queda da neve, em consonância com o paralelo grego, sem transformá-la literalmente em chuva.
- source_word: יהמה לב
  choice: o coração fica maravilhado
  rationale: O verbo hebraico sugere forte agitação interior, enquanto o grego explicita assombro. A tradução comunica a reação de admiração sem introduzir o sentido literal e inadequado de um coração que «ruge».
theological_decisions: []
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A construção «quando ela cai» evita a rigidez de «na sua queda» e explicita naturalmente que o referente é a neve. As notas preservam a ambiguidade lexical e a instabilidade textual sem sobrecarregar o versículo.
