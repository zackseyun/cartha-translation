base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/033.yaml
  text: The Lord made everything[a], and to those who fear him he gave wisdom[b]; the praise of the fathers is everlasting.
translation:
  language: pt
  text: 'O Senhor fez todas as coisas e deu sabedoria aos que o temem[b].


    Louvor dos antepassados de outrora.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo grego termina com «deu sabedoria» e não traz esta frase. No hebraico, ela diz literalmente «louvor dos antepassados de outrora» e pode ser o título ou uma expressão transferida do início da seção seguinte.
    reason: textual_variant
  - marker: b
    text: 'Ou, conforme o grego: «aos piedosos». O hebraico diz mais literalmente: «aos que o temem».'
    reason: alternative_reading
lexical_decisions:
- source_word: את הכל
  choice: todas as coisas
  rationale: Expressa de modo natural e abrangente o hebraico כל como objeto de עשה, em concordância com o grego πάντα.
- source_word: עשה
  choice: fez
  rationale: No contexto desta síntese da obra divina, «fez» é a tradução mais direta e natural do verbo עשה.
- source_word: ה׳
  choice: O Senhor
  rationale: A abreviação reverencial representa o nome divino; «O Senhor» é uma forma digna e corrente, também apoiada pelo grego ὁ κύριος.
- source_word: ליראיו
  choice: aos que o temem
  rationale: Preserva a expressão teológica hebraica de temer ou reverenciar a Deus, sem substituí-la pela interpretação grega «aos piedosos».
- source_word: נתן חכמה
  choice: deu sabedoria
  rationale: Reproduz diretamente o verbo no passado e mantém «sabedoria» como termo central em Ben Sira.
- source_word: שבח אבות עולם
  choice: o louvor dos antepassados é eterno
  rationale: Inclui todas as palavras do testemunho hebraico e entende עולם em sentido temporal duradouro, suprindo a cópula exigida pelo português; a possível leitura como título ou expressão transferida da seção seguinte é registrada em nota.
theological_decisions:
- issue: Representação do nome divino ה׳
  choice: O Senhor
  alternative: O SENHOR
  rationale: A forma escolhida mantém a referência ao Deus de Israel e acompanha o título κύριος do paralelo grego, com leitura mais fluente neste contexto deuterocanônico.
- issue: Inclusão de שבח אבות עולם
  choice: Incluir no texto principal como «o louvor dos antepassados é eterno»
  alternative: Omitir como provável transferência do título da seção seguinte, ou traduzir «louvor dos antepassados de outrora»
  rationale: A frase consta do testemunho hebraico fornecido e, por isso, é representada no texto principal. Sua ausência no grego e sua possível relação com a seção seguinte são expostas em nota, sem ocultar a incerteza textual.
- issue: Sentido de ליראיו
  choice: aos que o temem
  alternative: aos piedosos
  rationale: A leitura hebraica conserva o importante motivo bíblico do temor do Senhor; o grego oferece uma interpretação legítima, mas menos literal, indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. A ordem da frase foi levemente ajustada para soar natural, mantendo o paralelismo e a tensão entre os testemunhos hebraico e grego.
