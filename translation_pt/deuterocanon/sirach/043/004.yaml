base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/004.yaml
  text: Like a blazing furnace in the works of heat[a], the sun scorches the mountains three times over; breathing out fiery vapors, and flashing rays[b], it dims the eyes.
translation:
  language: pt
  text: Como uma fornalha atiçada nas obras do calor[a], o sol abrasa triplamente os montes[b]; soprando vapores de fogo e emitindo raios, ofusca os olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico deste versículo é parcialmente difícil e não corresponde de modo exato ao grego em todos os pontos. A tradução toma o hebraico preservado como fonte principal e recorre ao paralelo grego para esclarecer algumas expressões condensadas ou incertas.
    reason: textual_variant
  - marker: b
    text: A expressão “triplamente” traduz o termo grego τριπλασίως, mas esse elemento não está claramente preservado na linha hebraica existente.
    reason: alternative_reading
lexical_decisions:
- source_word: כור נפוח / κάμινον φυσῶν
  choice: uma fornalha atiçada
  rationale: A imagem é a de uma fornalha cujo fogo é intensificado pelo sopro. “At صada” comunica isso em português natural sem precisar explicitar o fole.
- source_word: מחם מצוק / ἐν ἔργοις καύματος
  choice: nas obras do calor
  rationale: A expressão hebraica é difícil, e o paralelo grego sustenta uma formulação próxima de “nas obras/ações do calor”. A tradução conserva a linguagem incomum em vez de resolver silenciosamente a incerteza.
- source_word: ידליק הרים / ἐκκαίων ὄρη
  choice: abrasa os montes
  rationale: O verbo hebraico denota acender ou fazer arder, e o grego também descreve os montes sendo queimados. “Abrasa” preserva a força da imagem solar sem exigir combustão literal.
- source_word: τριπλασίως
  choice: três vezes
  rationale: O advérbio está explícito no testemunho grego, embora não esteja claramente preservado na linha hebraica existente. A nota registra essa diferença textual.
- source_word: ἀτμίδας πυρώδεις ἐμφυσῶν
  choice: soprando vapores de fogo
  rationale: A expressão grega retrata o sol soprando ou exalando vapores ardentes. A escolha mantém tanto o movimento do sopro quanto a imagem ígnea.
- source_word: καὶ ἐκλάμπων ἀκτῖνας
  choice: e emitindo raios
  rationale: O segundo hemistíquio hebraico é textualmente difícil; o paralelo grego oferece o sentido claro de lançar ou fazer brilhar raios.
- source_word: ומנורה תכוה עין / ἀμαυροῖ ὀφθαλμούς
  choice: ofusca os olhos
  rationale: O hebraico fala do olho queimado ou ferido pela luz, enquanto o grego diz que ela obscurece os olhos. “Ofusca” exprime naturalmente o efeito da luminosidade intensa sem exagerá-lo como cegueira total.
