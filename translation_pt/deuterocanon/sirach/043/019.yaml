translation:
  language: pt
  text: Ele espalha a geada como sal[a], e ela brota como rebentos de palmeira[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto hebraico de Kahana diz literalmente algo próximo de “névoa/geada... repousa como sal”; o paralelo grego diz: “ele derrama geada como sal sobre a terra”. A linha é textualmente incerta, e a tradução expressa o sentido comum das testemunhas em vez de reproduzir de modo rígido o hebraico problemático.'
    reason: textual_variant
  - marker: b
    text: A imagem final também pode ser traduzida por “floresce como as flores da palmeira”; à luz do paralelo grego, ela talvez descreva a geada endurecendo em formações pontiagudas de gelo.
    reason: lexical_alternative
  - marker: c
    text: O manuscrito de Massada preserva nesta parte do versículo uma leitura diferente da encontrada nos manuscritos da Genizá do Cairo representados na edição de Kahana, o que indica perturbação na tradição textual hebraica.
    reason: textual_variant
lexical_decisions:
- source_word: אד
  choice: Ele
  rationale: Embora o texto hebraico transmitido tenha אֵד, normalmente “névoa” ou “vapor”, a linha parece textualmente perturbada. O paralelo grego e o contexto do hino indicam Deus como sujeito implícito das ações meteorológicas.
- source_word: כפור
  choice: geada
  rationale: כפור designa geada ou geada branca; “geada” é a forma corrente e clara em português.
- source_word: כמלח
  choice: como sal
  rationale: Preserva diretamente a comparação visual entre a geada espalhada e o sal.
- source_word: ישכון
  choice: espalha
  rationale: O sentido básico do verbo é “habitar, pousar, permanecer”, mas, nesta linha textualmente instável, “espalha” comunica de modo natural a cobertura produzida pela geada e concorda com o sentido geral atestado pelo paralelo grego, sem acrescentar explicitamente “sobre a terra”.
- source_word: ויציץ
  choice: brota
  rationale: O verbo צוץ significa brotar ou florescer. “Brota” mantém a metáfora vegetal e permite visualizar as formações salientes da geada.
- source_word: כתמר
  choice: como ... de palmeira
  rationale: תמר é a palmeira, especialmente a tamareira; “palmeira” é natural e preserva a concisão poética.
- source_word: ציצים
  choice: rebentos
  rationale: ציצים pode indicar flores, brotos ou projeções semelhantes a brotos. “Rebentos” conserva a imagem vegetal sem definir se são flores ou pontas de gelo.
theological_decisions:
- issue: Sujeito implícito no início do versículo
  choice: 'Empregar o sujeito divino implícito: “Ele espalha...”'
  alternative: 'Traduzir literalmente o hebraico transmitido como “A névoa da geada repousa como sal” ou seguir mais de perto o grego: “Ele derrama geada como sal sobre a terra”.'
  rationale: O hebraico está instável neste ponto, enquanto o paralelo grego e o contexto do hino descrevem a ação de Deus sobre o clima. O pronome mantém a coerência contextual sem adotar integralmente a formulação mais explícita do grego.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Geada”, “rebentos” e “palmeira” preservam a imagem poética sem tecnicismo. As notas tornam explícita a incerteza textual e evitam apresentar como indiscutível a reconstrução do sujeito divino.
