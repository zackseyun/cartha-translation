  text: Who has seen him and can describe him? And who can magnify him as he is?[a]
translation:
  language: pt
  text: Quem o viu e pode descrevê-lo? E quem pode engrandecê-lo tal como ele é?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico preservado nos manuscritos da Guenizá do Cairo diverge aqui e parece estar deslocado. Literalmente: “As alturas renovam as suas forças e não se cansam, pois vocês não podem investigá-las.” O paralelo grego diz: “Quem o viu e pode descrevê-lo? E quem pode engrandecê-lo tal como ele é?” O texto principal segue o grego, que se encaixa coerentemente no contexto.'
    reason: textual_variant
lexical_decisions:
- source_word: τίς ἑόρακεν αὐτόν
  choice: Quem o viu
  rationale: O perfeito de ὁράω exprime ter visto; a formulação é natural e mantém a pergunta retórica.
- source_word: ἐκδιηγήσεται
  choice: pode descrevê-lo
  rationale: O verbo indica narrar ou expor plenamente; “descrever” comunica com clareza a incapacidade humana de expressar Deus adequadamente.
- source_word: μεγαλυνεῖ
  choice: pode engrandecê-lo
  rationale: Preserva o sentido de proclamar ou exaltar como grande, bem como o tom de louvor.
- source_word: καθὼς ἐστιν
  choice: tal como ele é
  rationale: Mantém de forma concisa a referência à realidade do próprio ser de Deus, sem acrescentar “verdadeiramente” ao texto.
- source_word: מרומים
  choice: não vertido no texto principal; “as alturas” na nota
  rationale: O hebraico preservado apresenta uma linha divergente e aparentemente deslocada; o texto principal segue o paralelo grego contextualmente coerente, enquanto a leitura hebraica é registrada com transparência na nota.
theological_decisions:
- issue: Divergência entre o hebraico preservado e o paralelo grego
  choice: Seguir no texto principal a pergunta retórica grega sobre a impossibilidade de descrever e engrandecer Deus adequadamente.
  alternative: 'Traduzir literalmente o hebraico preservado: “As alturas renovam as suas forças e não se cansam, pois vocês não podem investigá-las.”'
  rationale: A linha hebraica está assinalada como uma pequena incompatibilidade e parece não corresponder ao contexto, enquanto o grego oferece uma sequência coerente na exaltação da grandeza insondável de Deus. A nota conserva a evidência hebraica sem ocultar a incerteza textual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Engrandecer” preserva o tom de louvor sem recorrer a vocabulário excessivamente arcaico. O pronome “ele” permanece em minúscula segundo o uso editorial corrente.
