  text: For this reason he created the storehouse[b][a], and made the clouds fly like birds.
translation:
  language: pt
  text: Por isso, ele criou o depósito[a], e fez as nuvens voarem como pássaros.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico, lido estritamente, diz “criou o depósito”; o paralelo grego traz “os depósitos foram abertos”, leitura que pode preservar o sentido pretendido neste contexto.
    reason: textual_variant
  - marker: b
    text: Este versículo não está claramente preservado em Massada. Aqui, o texto hebraico da Guenizá do Cairo é a principal testemunha, consultado junto com o paralelo grego.
    reason: cross_reference
lexical_decisions:
- source_word: למען
  choice: Por isso
  rationale: Neste contexto poético, e em conformidade com o grego διὰ τοῦτο, a expressão estabelece uma relação causal ou consecutiva, não uma finalidade.
- source_word: ברא
  choice: criou
  rationale: Representa de modo direto a leitura consonantal hebraica ברא. O paralelo grego sugere que se pretendia o sentido de 'foram abertos'; a variante é preservada em nota, sem substituir silenciosamente o testemunho hebraico principal.
- source_word: אוצר
  choice: o depósito
  rationale: Mantém o singular do hebraico e comunica a imagem de uma reserva celeste ligada aos fenômenos meteorológicos. 'Depósito' é atual e compreensível, embora 'tesouro' ou 'armazém' também sejam possíveis.
- source_word: ויעף
  choice: fez ... voarem
  rationale: Expressa o valor causativo do verbo e conserva a imagem vívida do movimento das nuvens.
- source_word: עבים
  choice: as nuvens
  rationale: Tradução clara e idiomática; o termo pode indicar nuvens densas, mas essa especificação não precisa ser acrescentada.
- source_word: כצפרים
  choice: como pássaros
  rationale: Preserva de maneira natural a comparação poética do hebraico.
theological_decisions:
- issue: Relação entre a leitura hebraica ברא e o paralelo grego ἠνεῴχθησαν
  choice: 'Texto principal: ''ele criou o depósito'''
  alternative: “os depósitos foram abertos” ou “ele abriu os depósitos”
  rationale: O hebraico sobrevivente é a testemunha principal e, lido estritamente, traz 'criou' com objeto singular. O grego preserva uma leitura contextual forte, 'foram abertos', que combina melhor com a imagem das reservas celestes. A tensão textual é mantida por meio de nota, sem decidir ocultamente em favor de uma das tradições.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo poético e as notas tornam explícita a incerteza textual.
