base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/027.yaml
  text: 'We could say more than these[a], but there would be no end[b]; and the conclusion of the matter is: all is he.'
translation:
  language: pt
  text: 'Poderíamos acrescentar outras coisas como estas[a], mas não chegaríamos ao fim; e a conclusão do assunto é: ele é o todo[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Poderíamos dizer muitas outras coisas e ainda assim não chegar ao fim.” O paralelo grego explicita a ideia de falar extensamente sem esgotar o assunto.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “ele é tudo”. O hebraico é conciso, e o paralelo grego sustenta um sujeito pessoal: “ele mesmo é o todo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוד כאלה
  choice: outras coisas como estas
  rationale: A expressão hebraica aponta para itens adicionais da mesma espécie, isto é, outras obras ou maravilhas como as já enumeradas.
- source_word: לא נוסף
  choice: mas não chegaríamos ao fim
  rationale: O hebraico é conciso e de construção difícil; o paralelo grego explicita a ideia de falar sem conseguir alcançar o limite do assunto.
- source_word: וקץ דבר
  choice: e a conclusão de tudo é
  rationale: קץ indica fim ou conclusão, e דבר pode designar palavra, discurso ou assunto. Esta formulação introduz naturalmente o resumo final do hino.
- source_word: הוא הכל
  choice: ele é o todo
  rationale: Preserva a afirmação pessoal e compacta do hebraico, confirmada pelo grego αὐτός, sem diluí-la numa paráfrase teológica.
theological_decisions:
- issue: Força teológica da oração final
  choice: ele é o todo
  alternative: ele é tudo
  rationale: A formulação mantém a tensão da declaração doxológica e sua concisão, sem explicar metafisicamente a relação entre Deus e a totalidade mencionada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência sapiencial. A construção final deliberadamente compacta preserva a ambiguidade e a força teológica do original.
