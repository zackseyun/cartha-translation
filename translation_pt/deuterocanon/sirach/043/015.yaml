  text: By his power he gives strength to the clouds[b][a], to cast down hailstones.
translation:
  language: pt
  text: Por seu poder, ele dá força à nuvem[a][b], para lançar pedras de granizo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz “a nuvem” no singular; o paralelo grego traz “nuvens” no plural. A tradução segue aqui o hebraico como testemunho principal.
    reason: alternative_reading
  - marker: b
    text: O manuscrito de Massada preserva apenas o início do versículo (“E por seu poder a nuvem é forte”), enquanto o hebraico da Geniza do Cairo prossegue com a frase sobre as pedras de granizo. A tradução completa segue a linha hebraica preservada, e o paralelo grego confirma a imagem do granizo.
    reason: textual_variant
lexical_decisions:
- source_word: בכחו
  choice: Por seu poder
  rationale: A preposição ב־ indica naturalmente meio ou instrumento neste contexto; “por seu poder” é claro, idiomático e preserva o sentido causal.
- source_word: יתן
  choice: ele dá
  rationale: נתן tem como sentido básico “dar”; aqui descreve a concessão de força à nuvem, sem necessidade de uma formulação mais interpretativa.
- source_word: לענן
  choice: à nuvem
  rationale: O hebraico traz o substantivo no singular. A tradução conserva esse número, embora o grego paralelo tenha o plural.
- source_word: עז
  choice: força
  rationale: עז denota força ou poder. “Força” combina naturalmente com o verbo “dar” e mantém a expressão simples e concreta.
- source_word: להשליך
  choice: para lançar
  rationale: O infinitivo pode indicar propósito ou resultado. “Para lançar” preserva essa relação e a força do verbo השליך sem tornar o português excessivamente rebuscado.
- source_word: אבני אלגביש
  choice: pedras de granizo
  rationale: A expressão hebraica é literalmente “pedras de granizo/gelo”. “Pedras de granizo” conserva a imagem concreta do original; o paralelo grego também confirma a referência ao granizo.
