  text: For his sake the messenger succeeds[b][a], and by his word he accomplishes his will.
translation:
  language: pt
  text: Por sua causa, o mensageiro tem êxito[a]; e, por sua palavra, ele realiza a sua vontade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o anjo prospera”. O hebraico מַלְאָךְ pode significar “mensageiro” ou “anjo”.'
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego traz uma leitura mais ampla: “e, por sua palavra, todas as coisas estão ordenadas”, destacando a palavra divina como poder ordenador da criação.'
    reason: alternative_reading
lexical_decisions:
- source_word: למענו
  choice: Por causa dele
  rationale: Expressa de modo natural em português a referência causal ou motivadora do hebraico, sem perder a ligação com Deus no contexto.
- source_word: יצלח
  choice: é bem-sucedido
  rationale: Traduz o sentido de צלח, “ter êxito, prosperar”, com formulação corrente e adequada à atuação eficaz do mensageiro.
- source_word: מלאך
  choice: o mensageiro
  rationale: מלאך pode designar tanto um mensageiro humano quanto um anjo. “Mensageiro” conserva a ambiguidade lexical, enquanto a alternativa “anjo” é registrada em nota.
- source_word: ובדבריו
  choice: e, por sua palavra
  rationale: 'Entende ב como instrumental: a palavra divina é o meio pelo qual a ação se realiza.'
- source_word: יפעל
  choice: ele realiza
  rationale: פעל indica fazer, efetuar ou executar. “Realiza” transmite de modo natural a execução da vontade divina.
- source_word: רצון
  choice: a sua vontade
  rationale: רצון pode significar vontade, desejo ou agrado; “vontade” é direto e apropriado neste contexto.
theological_decisions:
- issue: Se מלאך deve ser especificado como “anjo”
  choice: o mensageiro
  alternative: o anjo
  rationale: O hebraico não determina se o agente é humano ou celestial. O texto principal preserva essa abertura, e a nota apresenta a leitura angelológica possível.
- issue: Diferença entre o hebraico e o paralelo grego na segunda oração
  choice: 'seguir o singular do hebraico: “ele realiza a sua vontade”'
  alternative: “por sua palavra, todas as coisas são ordenadas em conjunto”
  rationale: O hebraico é a fonte principal indicada e apresenta um agente singular que executa a vontade divina. A leitura grega, mais ampla e cósmica, é preservada em nota sem ser incorporada ao texto principal.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A ambiguidade de מלאך foi mantida no texto principal. Os marcadores aparecem em ordem de ocorrência no texto.
