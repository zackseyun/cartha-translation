  text: The moon also marks the returning seasons[c][b][a], a ruler of the end and a sign forever.
translation:
  language: pt
  text: Também a lua marca os tempos que retornam[c][b][a], regente do fim e sinal para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: «E a lua, em todas as coisas, para o seu tempo determinado, manifestação dos tempos e sinal para sempre». O hebraico, porém, traz «os tempos que retornam» e «regente do fim».'
    reason: alternative_reading
  - marker: b
    text: A expressão hebraica «regente do fim» é concisa e pode se referir ao governo da lua sobre a conclusão do mês ou sobre um limite fixado.
    reason: lexical_alternative
  - marker: c
    text: 'O manuscrito de Massada preserva para este versículo uma leitura diferente da dos manuscritos hebraicos da Genizá do Cairo aqui representados; o trecho conservado em Massada diz: «pois o grande Senhor a fez».'
    reason: textual_variant
lexical_decisions:
- source_word: וגם
  choice: Também
  rationale: Mantém a força aditiva, ligando a lua aos luminares já descritos, em português natural.
- source_word: ירח
  choice: a lua
  rationale: O substantivo designa claramente a lua; o artigo definido é natural para o corpo celeste.
- source_word: עתות שבות
  choice: os tempos que retornam
  rationale: עתות indica tempos ou épocas, e שבות comunica retorno ou recorrência. A formulação preserva a imagem cíclica e o sentido calendárico sem restringi-lo necessariamente às estações do ano.
- source_word: ממשלת
  choice: regente
  rationale: O termo expressa governo ou domínio. «Regente» conserva a personificação poética e concorda naturalmente com «lua», sem transformar a expressão em explicação.
- source_word: קץ
  choice: do fim
  rationale: קץ significa fim, limite ou termo. A tradução mantém a concisão e deixa aberta a possível referência ao término do mês ou a um limite fixado.
- source_word: ואות עולם
  choice: e sinal para sempre
  rationale: אות é «sinal», e עולם aqui exprime duração indefinida ou perpétua. A redação é direta e preserva a formulação hebraica.
theological_decisions:
- issue: Peso do hebraico e do paralelo grego diante de uma pequena divergência textual
  choice: Seguir no texto principal o hebraico preservado, usando o grego apenas como apoio para o sentido temporal e calendárico
  alternative: 'Traduzir segundo o grego: «E a lua, em todas as coisas, para o seu tempo determinado, manifestação dos tempos e sinal para sempre»'
  rationale: Como há texto hebraico, ele recebe prioridade. O grego confirma o contexto temporal, mas não contém o equivalente exato de «regente do fim»; por isso, a tensão entre as testemunhas é preservada em nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Tempos que retornam» evita limitar עתות a estações climáticas; «regente do fim» conserva a expressão poética, compacta e ambígua do hebraico. Os marcadores seguem os dados fornecidos e todos aparecem no texto principal.
