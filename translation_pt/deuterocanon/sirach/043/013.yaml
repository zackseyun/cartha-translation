  text: By his might he directs the lightning[b][a], and he makes the flashes prevail on high.
translation:
  language: pt
  text: Com seu poder, ele determina o curso do relâmpago[a] e faz os clarões prevalecerem no alto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo hebraico aqui é raro e incerto; também pode significar “traça”, “dirige” ou “designa”.
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego diz: “Por sua ordem, ele faz cessar a neve e apressa os relâmpagos do seu juízo.” O hebraico e o grego diferem consideravelmente nesta linha.'
    reason: alternative_reading
lexical_decisions:
- source_word: גבורתו
  choice: Com seu poder
  rationale: Expressa o valor instrumental de גבורתו e usa uma formulação natural em português para a força mediante a qual Deus age.
- source_word: תתוה
  choice: ele determina o curso
  rationale: O verbo é raro e incerto neste contexto, podendo sugerir traçar, demarcar, dirigir ou designar. “Determina o curso” conserva a ideia de ordenar o percurso do relâmpago sem impor uma imagem excessivamente literal e pouco natural.
- source_word: ברק
  choice: do relâmpago
  rationale: É o termo hebraico comum para o relâmpago ou seu clarão; o singular coletivo é natural em português.
- source_word: ותנצח
  choice: faz ... prevalecerem
  rationale: Preserva o sentido de superioridade ou triunfo associado a נצח e, conforme o paralelismo, apresenta Deus como aquele que faz os fenômenos celestes prevalecerem.
- source_word: זיקות
  choice: os clarões
  rationale: O substantivo pode indicar faíscas ou lampejos de fogo. “Clarões” mantém o paralelismo com o relâmpago e evita especificar em excesso.
- source_word: במרום
  choice: no alto
  rationale: Reproduz de modo idiomático o sentido locativo de “nas alturas/no alto”, mantendo o tom poético sem transformar a expressão em um termo cosmológico técnico.
theological_decisions:
- issue: Relação entre o texto hebraico preservado e o paralelo grego substancialmente diferente
  choice: Seguir o hebraico no texto principal e registrar o grego em nota
  alternative: “Por sua ordem, ele faz cessar a neve e apressa os relâmpagos do seu juízo.”
  rationale: Como o hebraico é a fonte primária extante para este versículo, sua imagem deve governar o texto. O paralelo grego é uma testemunha relevante, mas diverge de modo amplo e, por isso, é preservado sem harmonização em nota.
- issue: Incerteza lexical de תתוה
  choice: “determina o curso”
  alternative: “traça”, “dirige” ou “designa”
  rationale: A tradução conserva a ação soberana sobre o relâmpago e sinaliza em nota que o verbo hebraico admite mais de uma compreensão, sem converter a incerteza lexical em uma afirmação doutrinária específica.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação poética. “Determina o curso” oferece legibilidade ampla, enquanto a nota preserva a incerteza do verbo hebraico. “No alto” é idiomático e mantém a localização poética de במרום.
