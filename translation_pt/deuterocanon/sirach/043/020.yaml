base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/020.yaml
  text: The cold of the north wind returns[a]; like rot, it freezes its spring. Over every standing body of water it settles[b], and the reservoir puts on armor like a breastplate.
translation:
  language: pt
  text: O frio do vento norte retorna; como a podridão, congela sua nascente.[a] Sobre toda massa de água parada, o gelo se assenta[b], e o reservatório se reveste de uma couraça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz “como a podridão, congela sua nascente”, uma imagem difícil. O paralelo grego apresenta uma formulação mais direta: “o gelo se forma a partir da água”. A tradução mantém no texto a leitura hebraica, a fonte primária onde está preservada.'
    reason: alternative_reading
  - marker: b
    text: A redação hebraica da expressão traduzida como “o gelo se assenta” é incerta. O paralelo grego sustenta a ideia de que o gelo se estende ou repousa sobre toda massa de água reunida.
    reason: textual_variant
lexical_decisions:
- source_word: צִנַּת רוּחַ צָפוֹן
  choice: O frio do vento norte
  rationale: O substantivo צִנַּת indica frio ou ar gelado; רוּחַ, no contexto meteorológico, significa “vento”, sentido também confirmado pelo paralelo grego.
- source_word: יָשִׁיב
  choice: retorna
  rationale: A forma hebraica é concisa e não explicita objeto. “Retorna” conserva essa concisão sem acrescentar quem ou o que o frio faria voltar.
- source_word: וְכָרָקָב
  choice: como a podridão
  rationale: Mantém a leitura hebraica difícil, “como podridão/decomposição”, sem substituí-la silenciosamente pela imagem mais clara de gelo ou cristal presente no grego.
- source_word: יִקְפִּיא מְקוֹרוֹ
  choice: congela sua nascente
  rationale: יִקְפִּיא expressa congelar ou fazer congelar, e מְקוֹרוֹ pode designar sua fonte ou nascente. A formulação conserva a imagem aquática e o sufixo singular.
- source_word: מַעֲמַד מַיִם
  choice: massa de água parada
  rationale: A expressão aponta para água reunida e imóvel. A tradução é clara em português atual e corresponde ao grego συναγωγὴ ὕδατος, “reunião de água”.
- source_word: יְקָרִים
  choice: ele se assenta
  rationale: A forma hebraica é textualmente difícil. O sentido adotado se apoia no paralelo grego, que retrata o gelo pousando ou estendendo-se sobre toda água reunida.
- source_word: וּכְשִׁרְיוֹן יִלְבַּשׁ מִקְוֶה
  choice: e o reservatório se reveste de uma couraça
  rationale: שִׁרְיוֹן é armadura, especialmente couraça; מִקְוֶה é uma reunião ou reservatório de água. “Reveste-se” preserva a personificação expressa pelo verbo “vestir”.
