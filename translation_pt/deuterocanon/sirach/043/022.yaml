translation:
  language: pt
  text: 'Remédio para tudo: uma nuvem que destila orvalho[a][c], afastando o calor abrasador[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida por “uma nuvem que destila orvalho” é difícil. O paralelo grego traz “névoa, orvalho”, indicando umidade refrescante, não necessariamente uma nuvem de tempestade.
    reason: lexical_alternative
  - marker: b
    text: A expressão final também pode ser entendida de modo mais literal como “afastando o calor abrasador para tornar viçoso [ou enriquecer]”. A relação precisa entre essas palavras é incerta; a tradução principal expressa o efeito mais provável no contexto.
    reason: alternative_reading
  - marker: c
    text: O rolo de Massada está fragmentário nesta parte e não oferece uma leitura alternativa clara para o versículo. A tradução segue o hebraico dos manuscritos da Genizá do Cairo, usando o grego como controle.
    reason: textual_variant
lexical_decisions:
- source_word: מרפא כל
  choice: Remédio para todos
  rationale: מרפא designa cura ou remédio, e כל tem alcance amplo. A formulação predicativa é concisa, natural em português e concorda com o paralelo grego ἴασις πάντων.
- source_word: מערף ענן טל
  choice: uma nuvem que goteja orvalho
  rationale: Embora a expressão hebraica seja difícil, מערף pode comunicar o gotejar ou destilar da umidade. Esta tradução preserva a imagem explícita de ענן, “nuvem”, e de טל, “orvalho”, sem transformar a cena em chuva forte; o grego “névoa, orvalho” confirma a ideia geral de umidade refrescante.
- source_word: פורע
  choice: afastando
  rationale: Diante de שרב, o sentido contextual mais provável é remover ou fazer recuar o calor. A escolha também corresponde ao efeito de alívio indicado pelo paralelo grego.
- source_word: לדשן
  choice: para revigorar
  rationale: A raiz דשן está ligada a tornar rico, viçoso ou fértil. No contexto da umidade que vence o calor, “para revigorar” expressa de modo natural o resultado restaurador, sem restringi-lo apenas ao solo.
- source_word: שרב
  choice: o calor abrasador
  rationale: שרב denota calor ressecante ou ardente, por vezes associado a vento quente. “Calor abrasador” é claro, atual e coerente com o grego καύσων.
