translation:
  language: pt
  text: 'Ali há maravilhas, prodígios de sua obra: toda espécie de ser vivo e grandes criaturas marinhas[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico termina com uma frase difícil, que pode significar “grandes/muitos poderes” ou “seres poderosos”. O paralelo grego diz “criação de criaturas marinhas” e pode preservar o sentido pretendido.
    reason: Leitura alternativa e dificuldade textual na frase final do hebraico.
lexical_decisions:
- source_word: שם
  choice: Ali estão
  rationale: שם significa literalmente “ali”. A construção existencial “Ali estão” expressa com naturalidade a oração hebraica sem verbo e mantém seu sentido locativo, também apoiado pelo grego ἐκεῖ.
- source_word: פלאות תמהי מעשהו
  choice: as maravilhas de suas obras admiráveis
  rationale: פלאות designa maravilhas; תמהי comunica espanto ou admiração; e מעשהו se refere à obra ou ao feito de Deus. O plural “obras” produz uma expressão natural em português e corresponde ao conjunto de feitos maravilhosos contemplado no contexto.
- source_word: מין כל חי
  choice: toda espécie de ser vivo
  rationale: מין indica espécie ou tipo, e כל חי abrange todo ser vivo. A formulação preserva o sentido classificatório e concorda com o paralelo grego ποικιλία παντὸς ζῴου.
- source_word: וגבורות רבה
  choice: e as grandes criaturas marinhas
  rationale: A frase hebraica transmitida é difícil e, isoladamente, pode sugerir grandes ou numerosas forças, feitos poderosos ou seres poderosos. O paralelo grego κτίσις κητῶν aponta claramente para a criação de grandes criaturas do mar; o contexto marítimo favorece essa leitura, cuja incerteza é registrada em nota.
theological_decisions:
- issue: Uso do paralelo grego para esclarecer a frase hebraica final
  choice: Referência a grandes criaturas marinhas no texto principal
  alternative: “e grandes feitos poderosos”, “e muitos seres poderosos” ou “e abundantes poderes”
  rationale: O hebraico final é textual e semanticamente difícil, ao passo que o grego traz “criação de criaturas marinhas”. Como o contexto descreve o mar, a leitura grega provavelmente preserva o sentido pretendido. A nota mantém visível a ambiguidade do hebraico, sem transformá-la em certeza.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Criaturas marinhas” evita o tom mitológico mais específico de “monstros marinhos”, enquanto “Ali estão” conserva a referência ao lugar. A nota documenta a tensão entre o hebraico preservado e o paralelo grego.
