translation:
  language: pt
  text: Um amigo fiel é um feixe de vida[a], e quem teme o Senhor o encontrará.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, o hebraico diz «um feixe de vida, alguém que ama a fidelidade»; o paralelo grego diz: «um amigo fiel é remédio de vida». A tradução conserva a imagem hebraica do «feixe», usando o grego para esclarecer que se fala de um amigo fiel.'
    reason: alternative_reading
  - marker: b
    text: 'A última oração é textualmente difícil no hebraico: falta um objeto explícito para «teme», e a forma final pode ser entendida como «ele os alcançará». O paralelo grego diz: «os que temem o Senhor o encontrarão».'
    reason: textual_variant
lexical_decisions:
- source_word: צְרוֹר חַיִּים
  choice: um feixe de vida
  rationale: Preserva a imagem concreta e incomum do hebraico, em vez de substituí-la pela leitura grega «remédio de vida». «Feixe» também sugere algo reunido, guardado e precioso.
- source_word: אוֹהֵב אֱמוּנָה
  choice: um amigo fiel
  rationale: A expressão hebraica, literalmente próxima de «alguém que ama a fidelidade», é comprimida. O contexto e o paralelo grego φίλος πιστός confirmam que ela caracteriza um amigo leal e digno de confiança.
- source_word: יְרֵא
  choice: quem teme
  rationale: A forma participial expressa uma máxima geral; «quem teme» é natural em português e conserva essa generalização sapiencial.
- source_word: וְאַל
  choice: e
  rationale: A leitura hebraica é difícil se וְאַל for entendido como proibição. O paralelo grego sustenta uma ligação coordenativa, adotada no texto para evitar uma frase ininteligível.
- source_word: יַשִּׂיגֵם
  choice: o encontrará
  rationale: A forma hebraica pode sugerir «os alcançará», mas o número e o referente do objeto são problemáticos. O grego εὑρήσουσιν αὐτόν oferece «o encontrarão», com referente singular no amigo fiel.
- source_word: Κύριον
  choice: o Senhor
  rationale: O objeto de «temer», ausente no hebraico preservado, aparece explicitamente no paralelo grego e se ajusta ao contexto sapiencial.
theological_decisions:
- issue: Objeto implícito do verbo «temer»
  choice: quem teme o Senhor
  alternative: quem teme
  rationale: O hebraico preservado não explicita o objeto, mas o paralelo grego traz «o Senhor». A tradução o inclui como provável referente pretendido, sem transformar a decisão textual em afirmação doutrinária independente.
- issue: Referente e sentido do último verbo
  choice: o encontrará
  alternative: o alcançará / os alcançará
  rationale: A redação hebraica é textualmente difícil, sobretudo quanto ao número do objeto. A leitura singular do grego liga a promessa ao amigo fiel e produz sentido coerente, enquanto a nota preserva a incerteza.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção proverbial simples. «Feixe de vida» conserva deliberadamente a imagem estranha do hebraico; as notas esclarecem a contribuição do paralelo grego e a dificuldade textual.
