  text: There is a friend who turns into an enemy[a], and he will expose the quarrel that brings your disgrace.
translation:
  language: pt
  text: Há amigo que se torna inimigo e exporá a disputa que lhe causa vergonha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “e a disputa da sua vergonha ele exporá”. A construção hebraica é concisa e também pode ser entendida como “e exporá sua disputa vergonhosa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ אוֹהֵב
  choice: Há amigo
  rationale: אוֹהֵב significa literalmente “alguém que ama”, mas, neste contexto sapiencial e à luz do grego φίλος, refere-se a um amigo.
- source_word: נֶהְפָּךְ לְשׂוֹנֵא
  choice: que se torna inimigo
  rationale: 'A expressão descreve uma inversão de relacionamento: quem era amigo passa a ser inimigo. A formulação é natural em português e concorda com o paralelo grego.'
- source_word: רִיב
  choice: a briga
  rationale: רִיב pode indicar briga, disputa ou contenda judicial. Aqui, “briga” comunica com clareza um conflito interpessoal sem impor um contexto jurídico.
- source_word: חֶרְפָּתְךָ
  choice: que traz vergonha a você
  rationale: A construção hebraica “briga/disputa da sua vergonha” é condensada. A oração relativa expressa o sentido provável sem ocultar no aparato a ambiguidade da relação entre a briga e a vergonha.
- source_word: יַחְשֹׂף
  choice: exporá
  rationale: O verbo significa descobrir, revelar ou expor. “Exporá” preserva a ideia de tornar conhecida uma questão vergonhosa, também confirmada pelo grego ἀποκαλύψει.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Há amigo” conserva a forma proverbial; “a você” evita que o possessivo “sua” seja confundido com uma referência ao antigo amigo.
