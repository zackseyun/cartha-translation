  text: In your prosperity he is like you[a], but in your adversity he will separate himself from you.
translation:
  language: pt
  text: Na tua prosperidade, ele é como tu; mas, na tua adversidade, ele se afastará de ti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: «e falará com ousadia aos teus servos». O testemunho hebraico, seguido no texto principal, diz: «ele se afastará de ti».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטוֹבָתְךָ
  choice: na tua prosperidade
  rationale: טובה designa aqui circunstâncias favoráveis ou boa condição. “Prosperidade” forma um contraste claro com “adversidade” sem restringir necessariamente o sentido à riqueza material.
- source_word: הוּא כָמוֹךָ
  choice: ele é como tu
  rationale: A expressão hebraica é uma comparação direta. A tradução conserva sua concisão e sua possível implicação de que o falso amigo se identifica estreitamente com a pessoa enquanto tudo vai bem.
- source_word: וּבְרָעָתְךָ
  choice: mas, na tua adversidade
  rationale: רעה, em oposição a טובה, indica circunstâncias ruins, desgraça ou dificuldade. “Adversidade” mantém a amplitude do termo e o paralelismo antitético; “mas” explicita naturalmente o contraste.
- source_word: יִתְנַדֶּה מִמֶּךָּ
  choice: se afastará de ti
  rationale: A forma reflexiva expressa o ato de distanciar-se ou apartar-se de alguém. “Se afastará de ti” preserva essa nuance em português natural.
theological_decisions:
- issue: Divergência substancial entre o hebraico e o grego no segundo membro do versículo
  choice: 'Seguir no texto principal o hebraico existente: “se afastará de ti”'
  alternative: 'O grego traz: “e falará com liberdade diante dos teus servos”'
  rationale: O testemunho hebraico existente é adotado como fonte principal para este trecho de Sirácida. A leitura grega é registrada em nota por representar uma diferença textual importante, sem tentar harmonizar os testemunhos.
translation_notes:
  register: Português atual, digno e acessível, com uso coerente de “tu/teu/ti”. A formulação mantém o paralelismo conciso do hebraico e evita limitar “prosperidade” exclusivamente à riqueza.
