base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/008.yaml
  text: For there is a friend for the occasion[a], and he will not stand firm in the day of distress.
translation:
  language: pt
  text: Pois há amigo de ocasião[a], e ele não permanecerá firme no dia da aflição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «amigo por algum tempo» ou «amigo quando lhe convém». A expressão hebraica é idiomática e pode indicar uma amizade limitada às circunstâncias favoráveis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹהֵב
  choice: amigo
  rationale: O particípio hebraico significa literalmente «aquele que ama», mas aqui funciona como substantivo para um companheiro ou amigo; o paralelo grego φίλος confirma esse sentido relacional.
- source_word: כְּפִי עֵת
  choice: de ocasião
  rationale: A expressão significa literalmente algo como «conforme a medida do tempo» e descreve uma amizade condicionada pelas circunstâncias. «De ocasião» é natural em português e preserva a ideia de vínculo temporário ou oportunista.
- source_word: יַעֲמוֹד
  choice: permanecerá firme
  rationale: O verbo עמד significa «ficar de pé» ou «permanecer». Neste contexto, indica constância ou lealdade diante da adversidade; o grego παραμείνῃ reforça a noção de permanecer.
- source_word: בְּיוֹם צָרָה
  choice: no dia da aflição
  rationale: Preserva a expressão temporal hebraica e traduz צָרָה como sofrimento, aperto ou adversidade, sem reduzir seu alcance.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. «Amigo de ocasião» oferece uma formulação idiomática de ampla compreensão, enquanto a nota preserva as alternativas da expressão hebraica. A coordenação com «e» acompanha o texto hebraico sem explicitar além dele uma relação adversativa.
