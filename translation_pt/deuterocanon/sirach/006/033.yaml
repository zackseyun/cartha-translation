  text: If you are willing to listen[a], you will receive instruction; if you incline your ear[b], you will become wise.
translation:
  language: pt
  text: Se você estiver disposto a ouvir[a], receberá instrução[b]; se inclinar o ouvido, se tornará sábio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico preservado deste versículo é difícil e parece mais curto que o grego. O paralelo grego diz: “Se você amar ouvir, receberá instrução; e, se inclinar o ouvido, será sábio.” A tradução toma o hebraico como fonte principal e usa o grego para esclarecer o sentido e conservar o paralelismo mais completo.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “aprenderá a disciplina” ou “aceitará a correção”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תּוֹבֵא לִשְׁמֹעַ
  choice: Se você estiver disposto a ouvir
  rationale: A forma hebraica preservada é incomum. O paralelo grego, ἐὰν ἀγαπήσῃς ἀκούειν (“se você amar ouvir”), indica desejo ou disposição para escutar. A formulação escolhida é natural em português e mantém essa nuance volitiva.
- source_word: וְתֵט אָזְנְךָ
  choice: se inclinar o ouvido
  rationale: Conserva a metáfora hebraica tradicional de voltar atentamente o ouvido para o ensino, sem deixar de ser compreensível em português atual.
- source_word: תִּוָּסֵר
  choice: receberá instrução
  rationale: A forma de יסר indica ser instruído, corrigido ou disciplinado. “Receberá instrução” expressa o sentido de modo natural e evita restringi-lo à ideia de punição.
- source_word: σοφὸς ἔσῃ
  choice: se tornará sábio
  rationale: Esta oração explícita encontra-se no paralelo grego, embora não apareça no hebraico preservado. A tradução comunica naturalmente o resultado futuro expresso pelo grego.
theological_decisions:
- issue: Inclusão da segunda oração de resultado preservada no grego
  choice: Incluir “se tornará sábio” no texto principal
  alternative: 'Traduzir apenas o hebraico preservado: “Se você estiver disposto a ouvir e inclinar o ouvido, receberá instrução.”'
  rationale: O hebraico sobrevivente parece abreviado ou textualmente difícil, enquanto o grego antigo conserva um paralelismo completo. A inclusão mantém a evidência grega visível sem ocultar, na nota, a forma mais curta do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Inclinar o ouvido” preserva a imagem sapiencial sem recorrer a linguagem excessivamente arcaica.
