  text: For in the end you will find its rest[b][a], and it will turn for you into delight.
translation:
  language: pt
  text: Pois, no fim[a], encontrarás o descanso dela[b], e ela se transformará em prazer para ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: literalmente «depois/para trás»; o paralelo grego traz «ao final». O sentido é que, após perseverar com a sabedoria, a pessoa finalmente encontra descanso e prazer.'
    reason: lexical_alternative
  - marker: b
    text: Os termos femininos remetem à sabedoria personificada no contexto. «O descanso dela» também pode ser entendido como o descanso que ela proporciona.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָחוֹר
  choice: no fim
  rationale: O hebraico aponta literalmente para o que vem depois ou para trás; o paralelo grego, «nos últimos tempos/ao final», confirma o sentido temporal de um resultado alcançado após perseverança.
- source_word: תִּמְצָא
  choice: encontrarás
  rationale: Traduz diretamente o verbo מצא e conserva a promessa futura dirigida ao leitor.
- source_word: מְנוּחָתָהּ
  choice: o descanso dela
  rationale: Mantém o substantivo «descanso» e o sufixo feminino, que no contexto remete à sabedoria personificada, sem decidir se é o repouso pertencente a ela ou proporcionado por ela.
- source_word: וְתֵהָפֵךְ
  choice: ela se transformará
  rationale: Preserva a imagem de mudança expressa por הפך e concorda naturalmente em português com a sabedoria personificada.
- source_word: לְךָ
  choice: para ti
  rationale: Expressa o benefício ou resultado pessoal indicado pelo dativo hebraico.
- source_word: לְתַעֲנוּג
  choice: em prazer
  rationale: תענוג denota prazer ou deleite; com «se transformará», a preposição «em» comunica naturalmente o resultado da mudança.
theological_decisions:
- issue: Referente dos sufixos femininos em «o descanso dela» e «ela se transformará»
  choice: Os pronomes remetem à sabedoria personificada no contexto imediato.
  alternative: Podem ser entendidos de modo mais amplo como referência à busca ou à disciplina da sabedoria.
  rationale: O contexto de Sirácida 6 apresenta a sabedoria como figura feminina, e o paralelo grego também conserva a referência feminina. O português permite manter essa personificação de maneira natural.
translation_notes:
  register: Português moderno, claro e digno, com uso de «tu» coerente com a forma singular do hebraico. A personificação feminina foi preservada porque é explícita no contexto e natural em português.
