  text: It will be upon him like a heavy stone[a], and he will not delay to throw it off.
translation:
  language: pt
  text: Ela pesará sobre ele como uma pedra pesada[a], e ele não demorará a lançá-la fora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebraico, literalmente, “como uma pedra de carga”. O paralelo grego diz “como uma forte pedra de provação”, acrescentando à imagem do peso a ideia de prova.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּאֶבֶן מַשָּׂא
  choice: como uma pedra pesada
  rationale: A expressão hebraica significa literalmente “como uma pedra de carga”. Em português, “pedra pesada” comunica com naturalidade a imagem de um peso difícil de suportar, sem acrescentar ao texto hebraico a ideia de provação presente apenas no paralelo grego.
- source_word: תִּהְיֶה עָלָיו
  choice: Ela pesará sobre ele
  rationale: Embora a forma mais literal seja “ela estará sobre ele”, “pesará sobre ele” torna explícita a relação natural entre a pedra pesada e a pessoa, preservando a metáfora e produzindo português claro.
- source_word: וְלֹא יְאַחֵר
  choice: e ele não demorará
  rationale: O hifil de אחר expressa demora. A formulação direta conserva tanto o valor verbal quanto a sequência da frase hebraica.
- source_word: לְהַשְׁלִיכָה
  choice: a lançá-la fora
  rationale: O verbo significa lançar ou jogar. O sufixo feminino remete à sabedoria ou disciplina personificada no contexto; por isso, o pronome feminino foi preservado em português.
theological_decisions:
- issue: Relação entre a leitura hebraica “pedra de carga” e a leitura grega “forte pedra de provação”
  choice: Manter no texto principal a imagem hebraica de peso e registrar em nota a nuance grega de provação.
  alternative: Traduzir no texto principal “como uma pesada pedra de provação”.
  rationale: O hebraico existente é a testemunha primária e não contém um termo correspondente a “provação”. Incorporar essa ideia ao corpo do versículo fundiria duas leituras distintas e reduziria a transparência textual. A nota conserva a evidência grega sem apagar a diferença entre as testemunhas.
translation_notes:
  register: Português moderno, digno e acessível. “Pesará sobre ele” evita o pouco natural “estará sobre ele” e sustenta a metáfora do peso. “Lançá-la fora” preserva a referência feminina à sabedoria ou disciplina no contexto.
