  text: Do not fall into the power of your own desire[a], lest your strength be consumed against you.
translation:
  language: pt
  text: Não se entregue ao poder do seu próprio desejo,[a] para que a sua força não se volte contra você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “Não caia na mão de sua alma”. Aqui, “alma” pode indicar o desejo ou apetite interior. O paralelo grego diz: “Não se exalte no conselho de sua alma, para que sua alma não seja dilacerada como um touro”. A segunda oração hebraica é difícil; a tradução preserva o sentido geral de que ceder aos próprios desejos conduz à autodestruição.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּפּוֹל בְּיַד
  choice: Não se entregue ao poder de
  rationale: A expressão hebraica significa literalmente “não caia na mão de”. Em português, “entregar-se ao poder de” preserva a imagem de ficar sob domínio sem sugerir uma queda física.
- source_word: נַפְשְׁךָ
  choice: seu próprio desejo
  rationale: Neste contexto sapiencial, נֶפֶשׁ pode designar o eu interior, o apetite ou o desejo. A versão grega, “no conselho de sua alma”, confirma que se trata de ceder aos próprios impulsos.
- source_word: וּתְעַבֶּה
  choice: se volte
  rationale: A forma hebraica e o sentido da segunda oração são difíceis. “Voltar-se” evita atribuir ao verbo um significado lexical excessivamente seguro e produz uma advertência coerente com עָלֶיךָ, enquanto a nota registra a incerteza e o testemunho grego.
- source_word: חֵילֵךָ
  choice: a sua força
  rationale: חַיִל pode significar força, vigor, recursos ou riqueza. “Força” conserva a amplitude mais pertinente à advertência sobre autodestruição.
- source_word: עָלֶיךָ
  choice: contra você
  rationale: Embora עַל signifique com frequência “sobre”, o contexto admite sentido adversativo; em português, “contra você” expressa com clareza o resultado autodestrutivo.
theological_decisions:
- issue: Uso do paralelo grego diante da dificuldade textual do hebraico
  choice: Manter o hebraico como base da tradução e formular a segunda oração de modo cauteloso, entendendo-a como advertência de que o desejo descontrolado faz a própria força voltar-se contra a pessoa.
  alternative: 'Seguir mais diretamente o grego: “para que a sua alma não seja dilacerada como um touro”; ou verter de modo estritamente formal o hebraico difícil.'
  rationale: O hebraico preservado é incerto na segunda oração, e o grego atesta claramente uma consequência destrutiva. A tradução comunica o sentido compartilhado sem inserir no texto principal a comparação grega ausente do hebraico e sem resolver silenciosamente a dificuldade.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formulação amplamente compreensível no Brasil e em outros contextos lusófonos. A nota torna explícitas a expressão hebraica e a divergência do paralelo grego.
