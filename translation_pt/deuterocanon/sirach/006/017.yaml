  text: For as he is[a], so is his friend, and as his name, so are his deeds.
translation:
  language: pt
  text: Pois, como ele é[a], assim é o seu amigo; e, como é o seu nome, assim são os seus feitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Quem teme o Senhor orienta corretamente a sua amizade, pois, tal como ele é, assim também é o seu próximo.” O testemunho hebraico difere substancialmente no primeiro membro.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָמוֹהוּ
  choice: tal como ele é
  rationale: A expressão comparativa com כ־ e o pronome significa naturalmente “como/tal como ele é”. A formulação conserva a concisão proverbial e não explicita o referente ambíguo do pronome.
- source_word: רֵעֵהוּ
  choice: seu amigo
  rationale: רֵעַ pode significar amigo, companheiro ou próximo. O contexto imediato trata da amizade, e o paralelo grego também menciona φιλίαν; por isso, “amigo” é a opção contextual mais clara.
- source_word: כִּשְׁמוֹ
  choice: tal como é seu nome
  rationale: O hebraico diz literalmente “como o seu nome”. Embora “nome” possa sugerir reputação, manter o termo preserva a imagem e a concisão do provérbio sem desenvolver uma interpretação implícita.
- source_word: מַעֲשָׂיו
  choice: seus feitos
  rationale: מַעֲשִׂים designa atos ou feitos. “Feitos” soa natural na literatura sapiencial e mantém a possível conotação moral do termo.
theological_decisions:
- issue: Escolha entre o testemunho hebraico e a leitura grega substancialmente diferente
  choice: Traduzir no texto principal o hebraico existente e registrar a leitura grega em nota.
  alternative: “Quem teme o Senhor orienta corretamente a sua amizade, pois, tal como ele é, assim também é o seu próximo.”
  rationale: O hebraico sobrevivente tem prioridade como fonte principal, mas a diferença considerável do grego, sobretudo no primeiro membro, deve ser documentada para não ocultar a incerteza textual.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo proverbial. A repetição de “tal como... assim...” reproduz a estrutura hebraica; o pronome “ele” permanece sem referente explicitado, preservando a ambiguidade do texto.
