  text: For a fierce soul destroys its owner[a], and the rejoicing of an enemy overtakes him.
translation:
  language: pt
  text: Pois uma alma feroz destrói quem a possui e faz dessa pessoa motivo de alegria para os inimigos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz literalmente, com uma discordância difícil de número: “e a alegria de um inimigo os alcançará”. O grego traz: “e fará dele motivo de alegria para os inimigos”, sentido seguido no texto principal.'
    reason: textual_variant
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: alma
  rationale: Preserva a dimensão interior e pessoal do hebraico e corresponde ao grego ψυχή, sem reduzir o termo apenas a “caráter” ou “vida”.
- source_word: עַזָּה
  choice: feroz
  rationale: Expressa a força intensa e moralmente negativa do adjetivo neste contexto. Evita substituir diretamente o hebraico pelo mais interpretativo “má” do paralelo grego.
- source_word: תַּשְׁחִית
  choice: destrói
  rationale: O verbo שחת pode significar destruir, arruinar ou corromper; “destrói” comunica com clareza a gravidade da consequência autodestrutiva.
- source_word: בְּעָלֶיהָ
  choice: quem a possui
  rationale: Transmite naturalmente a ideia de possuidor, também apoiada pelo grego τὸν κτησάμενον αὐτήν, e evita a possível conotação conjugal de uma tradução excessivamente literal de בעל.
- source_word: וְשִׂמְחַת שׂוֹנֵא
  choice: motivo de alegria para os inimigos
  rationale: 'Explicita o sentido predicativo indicado pelo grego: a pessoa se torna objeto da alegria ou do triunfo de seus inimigos. O hebraico mais literal é preservado na nota.'
- source_word: תַּשִּׂיגֵם
  choice: faz dessa pessoa
  rationale: A forma hebraica normalmente significaria “alcançará” ou “apanhará” e traz um sufixo plural difícil. A tradução segue o sentido coerente preservado pelo grego ποιήσει αὐτόν, registrando a divergência em nota.
theological_decisions:
- issue: Relação entre o hebraico difícil e o paralelo grego na oração final
  choice: 'Seguir no texto principal o sentido coerente do grego: a alma feroz faz de seu possuidor motivo de alegria para os inimigos.'
  alternative: “e a alegria de um inimigo os alcançará” ou “e a alegria do inimigo o alcançará”
  rationale: O hebraico sobrevivente apresenta dificuldade de número e de sentido na forma final תַּשִּׂיגֵם. O grego oferece uma leitura antiga, gramaticalmente coerente e adequada ao paralelismo, sem eliminar a incerteza, que é explicitada na nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formulação natural no Brasil. “Alma feroz” mantém a imagem antropológica e a intensidade do hebraico; “quem a possui” evita a rigidez de “seu dono”. A nota torna transparente a dificuldade textual da oração final.
