translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O paralelismo conciso do original foi preservado por meio de “não há... nem...”; as notas registram a dificuldade do hebraico e a divergência do paralelo grego.
