  text: There is no price for a faithful friend[b][a], and there is no weighing his worth.
translation:
  language: pt
  text: Não há preço para um amigo fiel[a], nem medida para o seu valor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, o hebraico diz “quem ama a fidelidade”; o grego traz “um amigo fiel”.
    reason: alternative_reading
  - marker: b
    text: O grego diz “sua beleza”, termo que também pode exprimir “nobreza” ou “excelência”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאוֹהֵב אֱמוּנָה
  choice: para um amigo fiel
  rationale: O hebraico transmitido significa mais literalmente “para quem ama a fidelidade”, mas a expressão é difícil. O paralelo grego traz “amigo fiel”, sentido que se ajusta ao contexto imediato sobre a amizade leal em Sirácida 6:14–16.
- source_word: אֵין מְחִיר
  choice: não há preço
  rationale: מְחִיר designa preço ou valor. A formulação portuguesa comunica de modo natural que um amigo assim é inestimável, mantendo-se próxima do hebraico.
- source_word: מִשְׁקָל
  choice: medida
  rationale: O termo pertence ao campo de pesar, peso ou balança. “Medida” conserva a imagem de avaliação e produz uma construção clara em português; o grego σταθμός confirma esse campo semântico.
- source_word: לְטוֹבָתוֹ
  choice: o seu valor
  rationale: O hebraico pode indicar sua bondade, seu benefício ou sua excelência. No contexto, “valor” expressa de forma idiomática a qualidade inestimável do amigo sem adotar como texto principal a leitura grega “beleza” ou “nobreza”.
