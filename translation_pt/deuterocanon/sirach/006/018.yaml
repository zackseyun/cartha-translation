  text: My son[a], from your youth receive instruction, and until gray hair you will attain wisdom.
translation:
  language: pt
  text: Meu filho, desde a juventude recebe o ensino[a], e até os cabelos brancos alcançarás a sabedoria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “escolhe a instrução”, onde o hebraico diz literalmente “toma o ensino”. Aqui se segue o hebraico com “recebe”; ambas as formas apontam para acolher, desde a juventude, um ensino que forma a pessoa.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: Preserva a forma direta e masculina de tratamento própria da instrução paterna em Ben Sira, sem neutralizá-la.
- source_word: מִנְּעוּרֶיךָ
  choice: desde a juventude
  rationale: Expressa de modo natural o início na primeira fase da vida e corresponde de perto ao hebraico e ao paralelo grego.
- source_word: קַח
  choice: recebe
  rationale: Embora o verbo signifique literalmente “toma”, com לֶקַח indica aceitar ou acolher o ensino; “recebe” conserva o imperativo sem soar artificial em português.
- source_word: לֶקַח
  choice: o ensino
  rationale: O termo designa ensinamento ou instrução recebida. “Ensino” é claro, corrente e adequado ao contexto sapiencial.
- source_word: וְעַד שֵׂיבָה
  choice: e até os cabelos brancos
  rationale: Mantém a imagem concreta do hebraico para a velhice, também confirmada pelo grego, em formulação idiomática portuguesa.
- source_word: תַּשִּׂיג
  choice: alcançarás
  rationale: Representa diretamente a ideia de chegar a, obter ou atingir algo; aqui descreve a aquisição progressiva da sabedoria.
- source_word: חָכְמָה
  choice: a sabedoria
  rationale: É o equivalente consagrado e contextualmente preciso do termo central da literatura sapiencial.
