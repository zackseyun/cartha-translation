  text: You will wear her like garments of honor[a], and you will crown yourself with her like a crown of splendor.
translation:
  language: pt
  text: Você se revestirá dela como de vestes de honra e, com ela, se coroará como com uma coroa de esplendor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “uma coroa de júbilo” ou “de exultação”, em vez do hebraico “uma coroa de esplendor”. O texto principal segue o testemunho hebraico existente.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּגְדֵי כָבוֹד
  choice: vestes de honra
  rationale: A expressão designa literalmente roupas ou vestes associadas à honra ou glória. “Vestes de honra” conserva a imagem concreta e o tom digno, com apoio do paralelo grego στολὴν δόξης.
- source_word: תִלְבְּשֶׁנָּה
  choice: você se revestirá dela
  rationale: A forma de לבשׁ traz um sufixo feminino que retoma a sabedoria personificada. A construção portuguesa “revestir-se dela” preserva tanto a referência feminina quanto a metáfora de vestir, sem a estranheza de “vesti-la” neste contexto.
- source_word: וַעֲטֶרֶת תִּפְאֶרֶת
  choice: como com uma coroa de esplendor
  rationale: תִּפְאֶרֶת pode indicar beleza, glória ou esplendor. “Esplendor” mantém o caráter régio e solene da imagem e se harmoniza com “vestes de honra” no primeiro membro.
- source_word: תְּעַטְּרֶנָּה
  choice: com ela, se coroará
  rationale: O verbo עטר significa coroar, circundar ou adornar, e o sufixo feminino volta a apontar para a sabedoria. A formulação explicita naturalmente em português que a pessoa se coroa com ela, sentido reflexivo também ressaltado pelo grego περιθήσεις σεαυτῷ.
theological_decisions:
- issue: Referente dos sufixos femininos
  choice: Manter a sabedoria personificada por meio de “dela” e “com ela”.
  alternative: Eliminar os pronomes femininos e traduzir apenas “você vestirá vestes de honra” e “receberá uma coroa”.
  rationale: O contexto imediato personifica a sabedoria como mulher. Preservar os referentes femininos mantém a continuidade literária e a tensão teológica do texto, sem transformar a sabedoria em uma abstração impessoal.
- issue: Diferença entre o hebraico e o paralelo grego na descrição da coroa
  choice: Seguir no texto principal o hebraico “coroa de esplendor”.
  alternative: Adotar o grego “coroa de júbilo/exultação”.
  rationale: O testemunho hebraico disponível é explícito e tem alta confiança; a variante grega é significativa, mas deve ser preservada em nota, não fundida silenciosamente ao texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Revestir-se” sustenta a imagem poética sem soar excessivamente arcaico; a repetição de “como” conserva o paralelismo hebraico.
