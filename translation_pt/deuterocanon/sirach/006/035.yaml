  text: See who has understanding[a], and seek him out[b]; and let your foot wear out his threshold.
translation:
  language: pt
  text: Veja quem tem entendimento[a] e procure-o com empenho; desgaste o seu pé na soleira dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Deseje ouvir todo discurso divino, e não deixe escapar de você os provérbios de entendimento.” Os testemunhos hebraico e grego diferem substancialmente neste ponto, embora ambos incentivem a busca diligente da sabedoria.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, a imagem é “desgaste o seu pé na soleira dele”, sugerindo visitas frequentes à casa de uma pessoa sábia para aprender com ela.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Veja
  rationale: Preserva a força direta do imperativo hebraico e, no contexto, convida a identificar uma pessoa sábia.
- source_word: מִי יָבִין
  choice: quem tem entendimento
  rationale: Expressa uma pessoa caracterizada por discernimento sem reduzir a frase a um ato pontual de compreender.
- source_word: וְשַׁחֲרֵהוּ
  choice: procure-o com empenho
  rationale: שחר pode indicar busca diligente; a formulação comunica intencionalidade e perseverança sem impor literalmente a possível nuance de buscar cedo.
- source_word: וְתִשְׁחוֹק
  choice: desgaste
  rationale: No difícil quadro idiomático formado com 'pé' e 'soleira', representa as visitas repetidas à casa do sábio.
- source_word: בְּסִפּוֹ
  choice: na soleira da casa dele
  rationale: סף significa soleira ou limiar. A explicitação de 'casa' torna a imagem imediatamente compreensível em português sem alterar seu referente contextual.
- source_word: רַגְלְךָ
  choice: o pé
  rationale: Mantém o singular do hebraico e a imagem concreta da frequência persistente.
theological_decisions:
- issue: Uso do testemunho hebraico apesar da divergência substancial em relação ao paralelo grego
  choice: Traduzir o hebraico preservado como texto principal e registrar o grego em nota como leitura alternativa.
  alternative: “Deseje ouvir todo discurso divino, e não deixe escapar de você os provérbios de entendimento.”
  rationale: O hebraico é extante, inteligível e oferece uma exortação coerente à procura perseverante de uma pessoa sábia. O grego contém uma exortação relacionada à busca da sabedoria, mas difere substancialmente na formulação; por isso, não deve substituir silenciosamente o hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a imagem concreta do hebraico, esclarecendo apenas que a soleira pertence à casa da pessoa sábia. Os marcadores [a] e [b] aparecem no texto principal.
