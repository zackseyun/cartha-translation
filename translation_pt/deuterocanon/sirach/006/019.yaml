base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/019.yaml
  text: Draw near to her like one who plows and reaps[a], and wait for her abundant produce. For in her service you will labor only a little[b], and before long you will eat her fruit.
translation:
  language: pt
  text: Aproxime-se dela como quem ara e ceifa[a], e espere por sua farta produção. Pois, a serviço dela, você trabalhará pouco e, em breve[b], comerá do seu fruto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “como quem ara e semeia”, em vez de “ara e ceifa”.
    reason: textual_variant
  - marker: b
    text: O hebraico diz literalmente “amanhã”; aqui, o sentido provavelmente é “logo” ou “em breve”, como também sugere o grego, que diz “rapidamente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּחוֹרֵשׁ וּכְקוֹצֵר
  choice: como quem ara e ceifa
  rationale: Preserva a comparação agrícola e segue o hebraico, que apresenta os atos de arar e ceifar. A formulação verbal é natural em português e mantém o paralelismo.
- source_word: קְרַב אֵלֶיהָ
  choice: Aproxime-se dela
  rationale: Expressa diretamente o imperativo de aproximação e conserva a personificação feminina da sabedoria.
- source_word: וְקַוֵּה
  choice: espere por
  rationale: O verbo pode indicar esperar com expectativa ou ter esperança. No contexto do cultivo e da colheita, “espere por” comunica de modo natural a paciência confiante.
- source_word: לְרֹב תְּבוּאָתָהּ
  choice: sua farta produção
  rationale: רֹב indica abundância, e תְּבוּאָה designa produto, rendimento ou colheita. “Farta produção” mantém a imagem agrícola sem confundir esta expressão com o ato de ceifar já mencionado.
- source_word: בַעֲבֹדָתָהּ מְעַט תַּעֲבוֹד
  choice: a serviço dela, você trabalhará pouco
  rationale: A construção conserva o vínculo lexical entre עֲבֹדָה, “serviço/trabalho”, e עבד, “trabalhar/servir”, além da relação pessoal com a sabedoria personificada.
- source_word: וּלְמָחָר
  choice: em breve
  rationale: O hebraico diz literalmente “amanhã”, mas aqui a expressão provavelmente indica proximidade temporal. “Em breve” transmite esse sentido, corroborado pelo grego ταχύ, sem impor a ideia de exatamente o dia seguinte.
- source_word: פִּרְיָהּ
  choice: do seu fruto
  rationale: Mantém a metáfora agrícola e a referência feminina à sabedoria. A preposição “de” corresponde naturalmente à construção de “comer do fruto”.
theological_decisions:
- issue: Personificação feminina da sabedoria
  choice: Manter a referência feminina por meio de “dela” e “seu”
  alternative: Tratar a sabedoria como abstração impessoal
  rationale: O contexto hebraico personifica a sabedoria como mulher. A tradução preserva essa textura literária e teológica sem acrescentar uma identificação doutrinária.
- issue: Divergência entre o hebraico e o grego na imagem agrícola
  choice: Seguir no texto principal o hebraico “ara e ceifa”
  alternative: Adotar o grego “ara e semeia”
  rationale: Como o hebraico está preservado e tem alta confiança, ele orienta o texto principal. A variante grega é relevante e por isso aparece em nota, sem harmonização silenciosa.
- issue: Valor temporal de וּלְמָחָר
  choice: Traduzir idiomaticamente como “em breve”, registrando o sentido literal em nota
  alternative: Traduzir literalmente como “amanhã”
  rationale: O contexto proverbial e o paralelo grego favorecem a noção de brevidade. A nota conserva a forma literal e a ambiguidade para o leitor.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A colocação de “a serviço dela” preserva a personificação sem soar excessivamente arcaica; “farta produção” mantém a imagem agrícola e evita repetição pesada.
