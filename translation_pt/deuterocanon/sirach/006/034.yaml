  text: Be eager to hear every discourse[a], and do not let a proverb of understanding escape you.
translation:
  language: pt
  text: Esteja disposto a ouvir todo discurso[a] e não deixe escapar nenhum provérbio de entendimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Permaneça na companhia dos anciãos e, se houver alguém sábio, apegue-se a ele.” O testemunho hebraico preservado difere substancialmente neste ponto; o texto principal segue o hebraico, pois ele está preservado para este versículo.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל שִׂיחָה
  choice: todo discurso
  rationale: כָּל tem valor distributivo, e שִׂיחָה pode designar fala, conversa ou exposição. “Todo discurso” mantém a amplitude do hebraico e se ajusta ao contexto de instrução sapiencial sem reduzir o sentido a conversa informal.
- source_word: חֲפוֹץ לִשְׁמֹעַ
  choice: Tenha prazer em ouvir
  rationale: חפץ expressa desejo, agrado ou disposição voluntária. A formulação portuguesa comunica uma atitude receptiva e interessada, preservando a força exortativa do hebraico.
- source_word: וּמְשַׁל
  choice: e ... nenhum provérbio
  rationale: מָשָׁל, no contexto da literatura sapiencial, designa naturalmente um provérbio ou máxima. O indefinido negativo “nenhum” traduz de modo idiomático a proibição אַל com o substantivo singular.
- source_word: בִּינָה
  choice: de entendimento
  rationale: A construção genitiva do hebraico é preservada, sem decidir além do texto se o entendimento caracteriza a origem, o conteúdo ou a finalidade do provérbio.
- source_word: אַל יֵצְאֶךָּ
  choice: não deixe escapar
  rationale: A expressão hebraica descreve literalmente algo que sai ou passa para além da pessoa. “Não deixe escapar” transmite com naturalidade a advertência para não perder uma instrução sábia.
theological_decisions:
- issue: Divergência substancial entre o testemunho hebraico preservado e o paralelo grego
  choice: Seguir o texto hebraico no corpo do versículo e registrar o grego em nota.
  alternative: 'Traduzir segundo o grego: “Permaneça na companhia dos anciãos e, se houver alguém sábio, apegue-se a ele.”'
  rationale: O hebraico está preservado para este versículo e possui alta confiança, por isso rege o texto principal. O grego apresenta uma exortação sapiencial relacionada, mas com redação muito diferente, e não deve ser harmonizado silenciosamente com o hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a concisão exortativa do hebraico e sua construção “provérbio de entendimento”, sem incorporar a redação distinta do paralelo grego.
