lexical_decisions:
- source_word: πέδας
  choice: grilhões
  rationale: Expressa com clareza a imagem de restrição dos pés e preserva a força concreta da metáfora grega.
- source_word: κλοιόν
  choice: coleira
  rationale: O termo grego designa algo colocado ao redor do pescoço; “coleira” preserva essa imagem melhor que “jugo”, sem introduzir uma metáfora diferente.
- source_word: αὐτῆς
  choice: dela
  rationale: Mantém a personificação feminina da sabedoria no contexto.
theological_decisions:
- issue: Submissão à sabedoria retratada como sujeição física
  choice: Preservar literalmente as imagens de grilhões e coleira
  alternative: Suavizar como “aceita a disciplina dela”
  rationale: O texto apresenta deliberadamente a disciplina da sabedoria por meio de imagens fortes; explicá-las ou suavizá-las eliminaria a tensão retórica.
translation_notes:
  register: Português atual, direto e digno, com construção imperativa natural e preservação da personificação feminina da sabedoria.
