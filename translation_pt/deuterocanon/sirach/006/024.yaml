translation:
  language: pt
  text: Põe os pés nos grilhões dela e o pescoço na coleira dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A linha hebraica indicada na fonte não corresponde a este versículo. A tradução segue aqui o texto grego preservado.
