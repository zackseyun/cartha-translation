  text: He will give understanding to your heart[a], and what you have desired will make you wise.
translation:
  language: pt
  text: Ele dará entendimento ao seu coração[a], e aquilo que você desejou o tornará sábio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “ele mesmo fortalecerá o seu coração, e o seu desejo de sabedoria lhe será concedido”. O testemunho hebraico aqui diz: “Ele dará entendimento ao seu coração, e aquilo que você desejou o tornará sábio”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא
  choice: Ele
  rationale: O pronome hebraico é masculino singular. Embora o antecedente não esteja explícito nesta linha, o paralelo grego aponta para o Senhor como referente pessoal.
- source_word: יָבִין
  choice: dará entendimento
  rationale: A forma causativa de בין comunica a ideia de fazer compreender ou conceder discernimento; esta formulação é natural em português e mantém a força causativa.
- source_word: לִבֶּךָ
  choice: ao seu coração
  rationale: לֵב designa o centro interior do pensamento, da vontade e do discernimento. “Coração” preserva a antropologia hebraica, enquanto o verbo deixa claro o sentido cognitivo.
- source_word: וַאֲשֶׁר
  choice: e aquilo que
  rationale: A expressão introduz o objeto do desejo sem especificá-lo; “aquilo que” preserva essa referência aberta com clareza.
- source_word: אִוִּיתָה
  choice: você desejou
  rationale: O verbo expressa desejar ou ansiar. O pretérito perfeito traduz naturalmente a forma hebraica e sua relação com a ação futura seguinte.
- source_word: יְחַכְּמֶךָּ
  choice: o tornará sábio
  rationale: A forma verbal tem sentido causativo, “fazer sábio”. “O tornará sábio” reproduz esse valor mais diretamente do que a formulação abstrata “lhe dará sabedoria”.
theological_decisions:
- issue: Referente do pronome “Ele”
  choice: O pronome é entendido como referência ao Senhor, em consonância com o paralelo grego.
  alternative: Um referente menos definido, como a sabedoria ou a reflexão.
  rationale: Isoladamente, a linha hebraica não explicita o antecedente; porém, o paralelo grego menciona os mandamentos do Senhor e prossegue com “ele mesmo”, favorecendo fortemente a referência pessoal ao Senhor sem torná-la explícita no corpo do versículo além do pronome.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução mantém “coração” como imagem antropológica hebraica e preserva a construção incomum da segunda oração, sem harmonizá-la silenciosamente com o grego.
