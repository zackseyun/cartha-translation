lexical_decisions:
- source_word: ἐν πάσῃ ψυχῇ σου
  choice: com toda a sua alma
  rationale: Preserva a expressão grega e comunica entrega integral, sem reduzir ψυχή a mero sentimento.
- source_word: πρόσελθε αὐτῇ
  choice: Aproxime-se dela
  rationale: Verte diretamente o imperativo de movimento em direção à sabedoria, cujo referente feminino é mantido.
- source_word: ἐν ὅλῃ δυνάμει σου
  choice: com toda a sua força
  rationale: Equivalente natural e fiel para a totalidade da capacidade ou força do leitor.
- source_word: συντήρησον τὰς ὁδοὺς αὐτῆς
  choice: mantenha-se nos caminhos dela
  rationale: Expressa perseverança e observância continuada nos caminhos da sabedoria; evita a formulação menos natural 'guarde os caminhos dela' e acompanha o sentido contextual reconhecido pela camada inglesa auditada.
theological_decisions:
- issue: Personificação feminina da sabedoria
  choice: manter os pronomes femininos em “dela”
  alternative: explicitar repetidamente “da sabedoria”
  rationale: O contexto identifica o referente, e o feminino do grego deve permanecer sem acréscimo interpretativo desnecessário.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” implícito nas formas de terceira pessoa. A formulação mantém o paralelismo entre entrega interior total e perseverança prática.
