  text: A faithful friend is a strong refuge[a], and whoever finds one has found a treasure.
translation:
  language: pt
  text: Um amigo fiel é um abrigo forte[a], e quem encontra um amigo assim encontra um tesouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico preservado neste ponto é difícil e difere consideravelmente do testemunho grego. Mais literalmente, conforme o hebraico transmitido: “Quem ama a fidelidade [é/ama] força, e quem a encontra encontra riqueza”. O texto principal segue o sentido mais claro do paralelo grego: “Um amigo fiel é um abrigo forte”.'
    reason: textual_variant
lexical_decisions:
- source_word: אוֹהֵב אֱמוּנָה
  choice: um amigo fiel
  rationale: O hebraico transmitido é difícil, mas o paralelo grego φίλος πιστός apresenta a leitura coerente «amigo fiel», que também se ajusta naturalmente ao segundo membro do provérbio.
- source_word: תְּקוֹף
  choice: abrigo forte
  rationale: A forma hebraica isolada sugere força, enquanto o grego σκέπη κραταιά explicita a imagem de cobertura protetora e forte. «Abrigo forte» conserva essa metáfora em português natural.
- source_word: וּמוֹצְאוֹ
  choice: e quem encontra um amigo assim
  rationale: A explicitação retoma claramente «amigo» e evita a possível ambiguidade de «o encontra» ou «encontra um», sem alterar o sentido proverbial.
- source_word: הוֹן
  choice: um tesouro
  rationale: Embora הוֹן possa significar riqueza ou bens, o grego θησαυρόν apoia «tesouro», que preserva a imagem concreta e o valor excepcional da amizade fiel.
theological_decisions:
- issue: Uso do hebraico ou do grego diante da divergência textual
  choice: 'Seguir no texto principal o sentido coerente atestado pelo paralelo grego: «Um amigo fiel é um abrigo forte».'
  alternative: «Quem ama a fidelidade ama a força, e quem a encontra encontra riqueza.»
  rationale: O hebraico preservado é sintática e semanticamente difícil, ao passo que o grego oferece um provérbio coerente e se liga de modo natural ao segundo membro. A incerteza é preservada explicitamente em nota, sem ocultar a leitura hebraica transmitida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e compreensão internacional. «Abrigo forte» mantém a metáfora protetora sem soar excessivamente técnico; «um amigo assim» torna a referência anafórica natural.
