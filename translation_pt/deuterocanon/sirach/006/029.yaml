  text: Its net will become for you a strong refuge[b][a], and its cords garments of fine gold.
translation:
  language: pt
  text: Sua rede se tornará para você um refúgio seguro[b], e suas cordas, vestes de ouro fino.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “seus grilhões serão para você abrigo de força, e seus ramos, uma veste de glória”. Essa formulação difere consideravelmente do hebraico preservado, que traz “sua rede”, “suas cordas” e “vestes de ouro fino”.'
    reason: alternative_reading
  - marker: b
    text: A imagem hebraica apresenta aquilo que pode parecer restritivo como algo que, por fim, protege e honra.
    reason: cross_reference
lexical_decisions:
- source_word: רִשְׁתָּהּ
  choice: sua rede
  rationale: O substantivo רשת designa uma rede ou malha. “Rede” conserva a imagem concreta do hebraico e corresponde naturalmente às “cordas” do segundo membro.
- source_word: מְכוֹן עֹז
  choice: um refúgio fortificado
  rationale: מכון pode indicar lugar estabelecido, base ou morada firme, e עז acrescenta a ideia de força. “Refúgio fortificado” expressa de modo natural tanto a estabilidade quanto a proteção, sem reduzir a expressão a uma fundação abstrata.
- source_word: חַבְלֹתֶיהָ
  choice: suas cordas
  rationale: חבל significa corda, cabo ou laço. “Cordas” mantém a relação visual com a rede e evita interpretar a imagem como restrição de maneira mais explícita do que o hebraico.
- source_word: בִּגְדֵי כָתֶם
  choice: vestes de ouro fino
  rationale: בגדי significa roupas ou vestes, enquanto כתם designa ouro fino ou precioso. A formulação conserva a metáfora elevada e segue o hebraico preservado, em contraste com a leitura grega “veste de glória”.
- source_word: וְהָיְתָה לְךָ
  choice: se tornará para você
  rationale: A construção apresenta o resultado futuro da disciplina da sabedoria para o aprendiz. “Se tornará para você” reproduz esse valor resultativo em português corrente.
theological_decisions:
- issue: Prioridade entre o hebraico preservado e o paralelo grego com imagens divergentes
  choice: 'Traduzir no texto principal o hebraico preservado: “rede”, “cordas” e “vestes de ouro fino”.'
  alternative: 'Seguir o grego: “grilhões”, “ramos” e “veste de glória”.'
  rationale: Onde o texto hebraico de Sirácida está preservado com boa confiança, ele serve de base. O grego pode refletir outra Vorlage ou uma interpretação e, por sua diferença significativa, é registrado em nota sem substituir o hebraico.
- issue: Sentido da imagem de objetos aparentemente restritivos
  choice: Preservar a tensão figurativa entre “rede/cordas” e “refúgio/vestes”, explicando-a brevemente em nota.
  alternative: Explicitar no versículo que a disciplina restritiva se transforma em proteção e honra.
  rationale: O texto cria a tensão por meio das próprias imagens. Tornar a interpretação explícita no corpo do versículo eliminaria uma ambiguidade retórica genuína.
translation_notes:
  register: 'Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Vestes” preserva o tom poético; “refúgio fortificado” comunica a força de מכון עז sem linguagem excessivamente técnica. Os marcadores foram colocados junto às respectivas imagens: [b] após a transformação protetora e [a] após o conjunto da leitura hebraica contrastada com o grego.'
