  text: Search out and investigate; seek[a], and find. Hold fast to her, and do not let her go.
translation:
  language: pt
  text: Procure e investigue; busque[a] e encontre. Apegue-se a ela e não a deixe ir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “busque, e ela se tornará conhecida por você”. O testemunho hebraico traz mais diretamente: “busque e encontre”.'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּרֹש
  choice: Procure
  rationale: Expressa a busca ativa de דרש em português corrente, mantendo-se distinto do posterior בַּקֵּשׁ.
- source_word: וַחֲקֹר
  choice: e investigue
  rationale: Preserva a ideia de exame cuidadoso e aprofundado de חקר, bem como a acumulação retórica dos imperativos.
- source_word: בַּקֵּשׁ
  choice: busque
  rationale: Equivalente direto e natural de בקש, distinto de 'procure' para refletir a sequência verbal hebraica.
- source_word: וּמְצָא
  choice: e encontre
  rationale: Segue a sequência de imperativos do testemunho hebraico. A leitura divergente do paralelo grego é registrada em nota.
- source_word: וְהֶחֱזַקְתָּהּ
  choice: Apegue-se a ela
  rationale: Transmite em português natural a ideia de segurá-la com firmeza e de manter forte vínculo com a Sabedoria personificada.
- source_word: וְאַל תַּרְפֶּהָ
  choice: e não a deixe ir
  rationale: Conserva a imagem de não afrouxar a mão nem soltá-la, em linguagem clara e idiomática.
theological_decisions:
- issue: Referente dos sufixos femininos
  choice: Traduzir o objeto feminino como 'ela', remetendo à Sabedoria personificada.
  alternative: Empregar 'isso' ou outra forma abstrata, referindo-se à instrução ou ao entendimento.
  rationale: O contexto imediato de Sirácida 6 apresenta a Sabedoria como figura feminina, e os sufixos femininos hebraicos sustentam essa referência sem necessidade de explicitação adicional.
- issue: Divergência hebraico-grega na oração sobre descoberta
  choice: 'Seguir no texto principal a sequência imperativa hebraica: ''busque e encontre''.'
  alternative: 'Seguir o grego: ''busque, e ela se tornará conhecida por você''.'
  rationale: O testemunho hebraico existente é a fonte principal e tem alta confiança; a variante grega é significativa e, por isso, é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sequência 'procure... investigue... busque' procura preservar a acumulação de verbos do hebraico sem tornar a frase artificial; 'ela' mantém a personificação da Sabedoria.
