translation:
  language: pt
  text: Incline o ombro e carregue-a; não sinta repulsa por suas amarras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica é difícil neste ponto; o paralelo grego traz “suas amarras”, provavelmente preservando a imagem pretendida da disciplina restritiva da sabedoria.
    reason: textual_variant
lexical_decisions:
- source_word: הַט
  choice: Incline
  rationale: O imperativo de נטה descreve o gesto deliberado de baixar ou oferecer o ombro para receber um peso; “incline” preserva a imagem concreta com registro digno e natural.
- source_word: שִׁכְמְךָ
  choice: o ombro
  rationale: שכם designa literalmente o ombro, leitura confirmada pelo grego ὦμος, e sustenta a metáfora corporal de carregar o peso da sabedoria.
- source_word: וְשָׂאֶהָ
  choice: e carregue-a
  rationale: A forma de נשׂא com objeto feminino indica tomar e sustentar o peso dela, isto é, da sabedoria personificada; “carregue-a” exprime essa ação contínua.
- source_word: וְאַל תָּקוֹץ
  choice: não sinta repulsa
  rationale: קוץ comunica aversão ou repugnância. A formulação evita o coloquialismo forte de “ficar com nojo” e reproduz de modo natural a ideia de não recuar com aversão.
- source_word: בְּתַחְבּוּלוֹתֶיהָ
  choice: por suas amarras
  rationale: A expressão hebraica é textualmente difícil e, isoladamente, poderia sugerir artifícios ou expedientes; o paralelo grego traz δεσμοῖς, “amarras/laços”, coerente com a imagem da disciplina restritiva da sabedoria. “Amarras” mantém a metáfora sem convertê-la em explicação abstrata.
theological_decisions:
- issue: Personificação feminina da sabedoria
  choice: Manter o referente feminino em “carregue-a” e “suas amarras”
  alternative: Empregar formas neutras ou repetir “a sabedoria”
  rationale: Os sufixos hebraicos femininos e o pronome grego remetem à sabedoria personificada no contexto. Preservar essa apresentação conserva a forma literária e sua tensão teológica sem identificações doutrinárias adicionais.
- issue: Termo hebraico incerto תַחְבּוּלוֹתֶיהָ à luz do paralelo grego
  choice: Usar “amarras” no texto e registrar a dificuldade em nota
  alternative: “expedientes”, “restrições” ou “disciplinas”
  rationale: O testemunho hebraico é difícil neste ponto, enquanto o grego preserva claramente a imagem de vínculos. A tradução usa o paralelo como evidência textual real, mas explicita a incerteza em vez de apresentar a solução como indiscutível.
translation_notes:
  register: Português atual, internacional e de fácil leitura no Brasil, com tratamento imperativo por “você” subentendido. A dicção é digna e concreta; mantém a personificação feminina e a metáfora de peso e restrição.
