  text: It will consume your leaves and uproot your fruit[b][a], and leave you like a dry tree.
translation:
  language: pt
  text: Isso devorará as suas folhas[a] e arrancará pela raiz o seu fruto[b], deixando você como uma árvore seca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico é difícil em vários pontos deste versículo; o paralelo grego sustenta a leitura “suas folhas” e confirma um desfecho destrutivo para “seu fruto”.
    reason: textual_variant
  - marker: b
    text: Ou “destruirá o seu fruto”. O verbo hebraico é incerto neste ponto, e o grego traz “destruir/perder”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיךָ
  choice: as suas folhas
  rationale: Embora a forma hebraica, tal como preservada, possa ser lida literalmente como “sobre você”, o paralelismo com “seu fruto” e o grego τὰ φύλλα σου sustentam fortemente “suas folhas”, provavelmente refletindo uma forma hebraica corrompida ou ortograficamente incomum.
- source_word: תֹּאכַל
  choice: devorará
  rationale: O verbo significa “comer, consumir”. “Devorará” comunica com naturalidade a ação destrutiva da imagem e corresponde ao sentido intensivo do paralelo grego καταφάγεσαι.
- source_word: וּפֶרְיְךָ
  choice: o seu fruto
  rationale: “Fruto” conserva a metáfora arbórea formada por folhas, fruto e árvore seca. O singular segue o hebraico.
- source_word: תְּשָׁרֵשׁ
  choice: arrancará pela raiz
  rationale: A forma hebraica é difícil, mas parece permitir uma imagem ligada à raiz ou à extirpação. A expressão preserva essa força concreta, enquanto a nota registra a alternativa “destruirá”, apoiada pelo grego.
- source_word: וְהִנִיחַתְךָ
  choice: deixando você
  rationale: Neste contexto, o causativo expressa o resultado de deixar alguém em determinado estado, não fazê-lo descansar. O particípio português liga naturalmente essa consequência às ações anteriores.
- source_word: כְּעֵץ יָבֵשׁ
  choice: como uma árvore seca
  rationale: Tradução direta da comparação hebraica, mantendo a imagem austera. “Ressequida” seria possível, mas acrescentaria uma nuance mais interpretativa.
theological_decisions:
- issue: Uso do hebraico difícil à luz do paralelo grego
  choice: Traduzir prioritariamente o hebraico, recorrendo ao grego para confirmar “folhas” e o resultado destrutivo aplicado ao fruto.
  alternative: Traduzir o hebraico de modo estritamente literal como “sobre você comerá”, ou seguir o grego de maneira mais direta com “destruirá o seu fruto”.
  rationale: O hebraico é a testemunha principal, mas contém formas textualmente difíceis neste versículo. O grego confirma a coerência da metáfora — folhas, fruto e árvore seca — sem exigir que se abandone a provável imagem hebraica de arrancar pela raiz.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Isso” evita impor gênero ao referente implícito, e “você” oferece uma forma direta e corrente de segunda pessoa. A construção mantém a progressão figurativa das folhas e do fruto até a árvore completamente seca.
