  text: Let those at peace with you be many[a], but your confidant one out of a thousand.
translation:
  language: pt
  text: Sejam muitos os que vivem em paz com você, mas, entre mil, tenha apenas um confidente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “seus conselheiros” ou “seus assessores”; o hebraico diz, literalmente, “o possuidor do seu segredo/conselho”, ressaltando uma relação mais íntima de confiança.
    reason: alternative_reading
lexical_decisions:
- source_word: אַנְשֵׁי שְׁלוֹמְךָ
  choice: os que vivem em paz com você
  rationale: Preserva a imagem relacional de pessoas que mantêm paz e boas relações com alguém, em consonância com o hebraico e com o paralelo grego, sem reduzir o sentido simplesmente a “amigos”.
- source_word: יִהְיוּ רַבִּים
  choice: sejam muitos
  rationale: Expressa naturalmente em português o valor exortativo ou desiderativo da forma hebraica, e não uma simples previsão.
- source_word: וּבַעַל סוֹדְךָ
  choice: aquele a quem você confia seus segredos
  rationale: Traduz de modo claro a ideia literal de quem é admitido ao segredo ou conselho íntimo de alguém. A formulação conserva a intimidade e a confiança do hebraico, embora o grego destaque mais a função de conselheiro.
- source_word: אֶחַד מֵאָלֶף
  choice: um entre mil
  rationale: Expressão portuguesa natural que preserva a ideia hebraica de extrema raridade e seleção cuidadosa.
theological_decisions:
- issue: Uso do hebraico como testemunho principal diante da leitura paralela grega
  choice: Manter no texto principal a dimensão de segredo e confiança íntima do hebraico.
  alternative: 'Traduzir segundo a ênfase grega: “seus conselheiros sejam um entre mil”.'
  rationale: Os dois testemunhos contrastam muitos relacionamentos pacíficos com pouquíssimas pessoas profundamente dignas de confiança. Como o hebraico preservado contém explicitamente סוד, “segredo/conselho íntimo”, o texto principal mantém essa nuance, enquanto a nota registra a formulação grega.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A construção paralela conserva o caráter sapiencial e exortativo do original.
