  source_fidelity: 'O texto capta corretamente o paralelismo sapiencial: muitos devem estar em paz com o destinatário, mas uma pessoa de confiança íntima deve ser extremamente rara. A opção por «confidente» preserva bem o matiz do hebraico בַּעַל סוֹדְךָ («alguém admitido ao seu segredo/conselho»), sem ignorar que o grego tem «conselheiros».'
  naturalness: A primeira oração é natural e clara. Na segunda, «aquele a quem você confia seus segredos seja um entre mil» é compreensível, mas soa sintaticamente pesada e pode sugerir que essa pessoa é literalmente uma entre mil pessoas. «Entre mil, tenha apenas um confidente» exprime de modo idiomático a seleção e a raridade requeridas pelo original.
  terminology: «Os que vivem em paz com você» é uma boa reprodução do idiomatismo hebraico e do paralelo grego. «Confidente» é o termo moderno mais adequado para a dimensão de confiança íntima; a nota registra apropriadamente a alternativa grega ligada a conselho.
