  text: Its yoke is a golden ornament[b][a], and its bonds are a cord of blue thread.
translation:
  language: pt
  text: Seu jugo é um ornamento de ouro[a], e suas amarras são um cordão azul-púrpura[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico preserva aqui a imagem do “jugo”, enquanto o paralelo grego ressalta o adorno: “um ornamento de ouro sobre ela”. A tradução mantém os dois sentidos ao apresentar o jugo como ornamento de ouro.'
    reason: alternative_reading
  - marker: b
    text: Ou “um cordão violeta-azulado” ou “um cordão cor de jacinto”. O termo indica um valioso fio tingido de azul com tonalidade púrpura ou violeta.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻלֵּי / עֻלָּהּ
  choice: jugo / seu jugo
  rationale: O hebraico preserva a imagem do jugo e parece explorar sua relação com o adorno. A formulação mantém o peso disciplinador do vínculo com a Sabedoria e, ao mesmo tempo, seu caráter precioso e belo, confirmado pelo paralelo grego.
- source_word: זָהָב
  choice: de ouro
  rationale: Expressa naturalmente em português o material do ornamento e corresponde diretamente ao hebraico.
- source_word: מוֹסְרוֹתֶיהָ
  choice: suas amarras
  rationale: O termo designa aquilo que prende ou restringe. “Amarras” é claro e atual, preservando a metáfora sem a conotação penal mais estreita de “algemas”.
- source_word: פְּתִיל
  choice: cordão
  rationale: Indica um fio torcido ou cordão. “Cordão” mantém tanto a materialidade quanto a relativa força da imagem.
- source_word: תְּכֵלֶת
  choice: azul-púrpura
  rationale: O termo designa um valioso material tingido em tonalidade azul tendente ao violeta. “Azul-púrpura” comunica essa faixa cromática sem recorrer a um termo técnico pouco conhecido; o grego ὑάκινθινον apoia esse sentido.
theological_decisions:
- issue: A disciplina da Sabedoria retratada simultaneamente como restrição e beleza
  choice: Manter no mesmo verso as imagens de “jugo/amarras” e “ornamento/cordão” precioso
  alternative: Reduzir a imagem a mero adorno (“ornamento”, “colar”) ou somente a peso e restrição (“jugo”, “grilhões”)
  rationale: 'O hebraico, lido ao lado do paralelo grego, sustenta a tensão deliberada: aquilo que liga o discípulo à Sabedoria impõe disciplina, mas também é precioso e belo. A tradução não elimina nenhum dos dois aspectos.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Seu jugo” e “suas amarras” preservam a personificação feminina da Sabedoria no contexto, enquanto “ornamento de ouro” e “cordão azul-púrpura” conservam o contraste poético entre disciplina e beleza.
