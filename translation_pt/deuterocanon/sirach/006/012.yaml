lexical_decisions:
- source_word: אִם תַּשִּׂיגְךָ רָעָה
  choice: Se a desgraça alcançar você
  rationale: O hebraico descreve a adversidade chegando ou alcançando a pessoa. “Desgraça” expressa aqui calamidade ou infortúnio, não maldade moral, e “alcançar” preserva a imagem verbal.
- source_word: יֵהָפֵךְ בְּךָ
  choice: ele se voltará contra você
  rationale: A construção indica uma mudança de atitude em relação à pessoa, que, no contexto do falso amigo, se torna oposição.
- source_word: וּמִפָּנֶיךָ יִסָּתֵר
  choice: e se esconderá de você
  rationale: A expressão significa literalmente esconder-se da face ou presença de alguém; em português corrente, “esconder-se de você” comunica com naturalidade a evasão deliberada.
theological_decisions:
- issue: Divergência entre o hebraico preservado e o paralelo grego
  choice: 'Seguir no texto principal o hebraico: “Se a desgraça alcançar você”.'
  alternative: 'O grego traz: “Se você for humilhado” ou “Se você for rebaixado”.'
  rationale: O hebraico existente é a fonte primária adotada, mas a diferença relevante do testemunho grego é preservada em nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O pronome “você” mantém acessibilidade contemporânea; a repetição evita ambiguidade quanto ao referente.
