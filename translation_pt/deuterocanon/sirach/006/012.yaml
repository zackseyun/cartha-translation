  text: Se a desgraça alcançar você[a], ele se voltará contra você e se esconderá de você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “Se você for humilhado”, em vez do hebraico “Se a desgraça alcançar você”.'
