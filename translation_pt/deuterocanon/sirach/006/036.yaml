  text: Reflect on the fear of the Most High and on his commandments[a]; meditate continually.
translation:
  language: pt
  text: Reflita sobre o temor do Altíssimo e sobre os seus mandamentos[a]; medite continuamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego paralelo diz: “Se você vir um homem inteligente, vá cedo até ele, e que o seu pé desgaste os degraus das portas dele.” O testemunho hebraico preservado aqui difere substancialmente do grego.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְבּוֹנַנְתָּ
  choice: Reflita sobre
  rationale: A forma hitbonen de בין expressa consideração atenta e reflexiva. “Reflita sobre” é natural em português e preserva a força contemplativa.
- source_word: בְּיִרְאַת
  choice: o temor do
  rationale: Na literatura sapiencial, יראה abrange temor reverente e devoção. “Temor” preserva o idioma bíblico e sua densidade teológica sem reduzi-lo apenas a “reverência”.
- source_word: עֶלְיוֹן
  choice: Altíssimo
  rationale: עליון é um título divino tradicional e claramente expresso em português por “Altíssimo”.
- source_word: וּבְמִצוֹתָיו
  choice: e sobre os seus mandamentos
  rationale: A preposição liga este sintagma ao objeto anterior de “reflita”. “Mandamentos” conserva o registro bíblico e a coordenação explícita do hebraico.
- source_word: וֶהְגֵה
  choice: medite
  rationale: הגה, em contexto sapiencial e devocional, indica ponderação meditativa, por vezes acompanhada de recitação em voz baixa. “Medite” comunica bem o sentido principal.
- source_word: תָמִיד
  choice: continuamente
  rationale: תמיד expressa continuidade ou regularidade persistente. “Continuamente” preserva esse valor durativo.
theological_decisions:
- issue: Divergência entre os testemunhos hebraico e grego
  choice: Traduzir no texto principal o hebraico preservado e registrar o grego em nota.
  alternative: 'Grego: “Se você vir um homem inteligente, vá cedo até ele, e que o seu pé desgaste os degraus das portas dele.”'
  rationale: Como há texto hebraico disponível e a divergência é substancial, ele serve de base ao texto principal. A leitura grega é preservada em nota para tornar transparente a importante diferença textual.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém os dois objetos sob “reflita” e deixa “medite continuamente” como oração seguinte, conforme a sintaxe do hebraico.
