base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/022.yaml
  text: For discipline is true to its name[a], and it is not evident to many.
translation:
  language: pt
  text: Pois a disciplina faz jus ao seu nome[a] e não é evidente para muitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Pois a sabedoria corresponde ao seu nome e não é evidente para muitos”. A testemunha hebraica traz “disciplina” onde o grego traz “sabedoria”.'
    reason: Leitura alternativa decorrente de divergência entre as fontes hebraica e grega.
lexical_decisions:
- source_word: הַמּוּסָר
  choice: a disciplina
  rationale: O hebraico מוסר pode indicar disciplina, instrução ou correção. “Disciplina” reflete diretamente a testemunha hebraica, enquanto a divergência do grego é preservada em nota.
- source_word: בִּשְׁמָהּ
  choice: faz jus ao seu nome
  rationale: A expressão significa literalmente “segundo/em seu nome”. A formulação portuguesa comunica de modo idiomático que a disciplina corresponde ao que seu nome indica.
- source_word: נְכוֹחָה
  choice: evidente
  rationale: Neste contexto, o termo indica algo manifesto ou claro. O paralelo grego φανερά apoia “evidente”.
- source_word: לְרַבִּים
  choice: para muitos
  rationale: Tradução natural da construção hebraica, adequada ao predicativo “evidente”.
theological_decisions:
- issue: Divergência entre as testemunhas hebraica e grega quanto ao substantivo inicial
  choice: Seguir a testemunha hebraica principal com “disciplina” no texto
  alternative: Seguir o paralelo grego com “sabedoria”
  rationale: Como o texto de Sirácida sobrevive aqui em hebraico, a leitura hebraica recebe prioridade. A diferença material do grego é informada em nota, sem ser harmonizada silenciosamente.
translation_notes:
  register: Português atual, digno e de leitura ampla. “Faz jus ao seu nome” evita uma formulação excessivamente literal, preservando o sentido do hebraico. A estrutura coordenada mantém a concisão proverbial do versículo.
