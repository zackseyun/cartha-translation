  text: There is a friend who is a table-companion[b][a], but he will not be found in a day of trouble.
translation:
  language: pt
  text: Há amigo que é companheiro de mesa[a], mas não será encontrado no dia da adversidade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz literalmente uma expressão semelhante a “companheiro de mesa”; o paralelo grego diz “alguém que partilha mesas”, isto é, alguém que participa das refeições, mas se mostra pouco confiável na dificuldade.
    reason: lexical_alternative
  - marker: b
    text: O hebraico diz “não será encontrado”; o paralelo grego traz “não permanecerá”. As duas formas indicam que esse amigo desaparece quando chega a adversidade.
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹהֵב חָבֵר
  choice: amigo
  rationale: A combinação hebraica descreve alguém que se apresenta ou atua como amigo. “Amigo” é natural em português e concorda com o paralelo grego φίλος, sem eliminar a ironia do contexto.
- source_word: חָבֵר שֻׁלְחָן
  choice: companheiro de mesa
  rationale: A expressão hebraica é compacta, literalmente relacionada a “companheiro de mesa”; o grego κοινωνὸς τραπεζῶν confirma a imagem de alguém que partilha refeições. A tradução mantém essa imagem sem antecipar a conclusão com uma paráfrase como “amigo interesseiro”.
- source_word: וְלֹא יִמָּצֵא
  choice: mas não será encontrado
  rationale: O nifal de מצא significa naturalmente “ser encontrado”. A formulação preserva o testemunho hebraico e comunica que esse amigo estará ausente quando vier a dificuldade.
- source_word: בְּיוֹם רָעָה
  choice: no dia da adversidade
  rationale: Neste contexto sapiencial, רָעָה indica desgraça, dificuldade ou calamidade, não necessariamente mal moral. “Adversidade” é digna, clara e coerente com o grego θλίψεως, “aflição/angústia”.
