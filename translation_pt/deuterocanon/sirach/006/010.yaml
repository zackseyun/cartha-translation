translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A imagem concreta da mesa e a formulação passiva do hebraico foram preservadas; evitou-se a paráfrase interpretativa “amigo interesseiro” ou “amigo só nos bons momentos”.
