  text: Keep away from your enemies[a], and be on guard against your friends.
translation:
  language: pt
  text: Mantenha distância de quem odeia você e tenha cuidado com quem ama você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego paralelo traz: “seus amigos”.'
    reason: Registra a formulação mais específica da tradição grega em contraste com o hebraico “quem ama você”.
lexical_decisions:
- source_word: מִשֹּׂנְאֶיךָ
  choice: de quem odeia você
  rationale: O particípio substantivado de שׂנא significa literalmente “os que odeiam você”. A formulação escolhida é natural em português e preserva a expressão relacional do hebraico; o grego paralelo emprega “inimigos”.
- source_word: הִבָּדֵל
  choice: Mantenha distância
  rationale: O imperativo nifal de בדל exige separação ou distanciamento deliberado. “Mantenha distância” comunica esse sentido de modo claro e corrente.
- source_word: וּמֵאֹהֲבֶיָך
  choice: com quem ama você
  rationale: O hebraico diz literalmente “dos que amam você”. Depois de “tenha cuidado”, a preposição “com” é a construção idiomática em português, sem apagar a relação expressa no texto-fonte.
- source_word: הֵשָּׁמֵר
  choice: tenha cuidado
  rationale: O imperativo de שמר nesse uso reflexivo recomenda cautela e vigilância. “Tenha cuidado” é direto, natural e compatível com o grego πρόσεχε.
theological_decisions:
- issue: 'Termo relacional no segundo membro: hebraico “os que amam você” ou grego “amigos”'
  choice: Manter “quem ama você” no texto principal.
  alternative: seus amigos
  rationale: Como o hebraico está preservado e tem alta confiança, sua formulação mais ampla deve orientar o texto principal. O grego paralelo traz φίλων, “amigos”, leitura útil que é registrada em nota sem restringir silenciosamente o sentido hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo entre “quem odeia você” e “quem ama você” preserva a força e a tensão do hebraico sem impor uma interpretação denominacional.
