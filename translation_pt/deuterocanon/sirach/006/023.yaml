translation:
  language: pt
  text: Escute,[a] filho,[b] aceite o meu parecer[c] e não rejeite o meu conselho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A linha hebraica preservada e fornecida para este versículo não corresponde ao conteúdo de Sirácida 6:23 e parece pertencer a outro contexto. A tradução segue, portanto, o paralelo grego: «Escute, filho, aceite o meu parecer e não rejeite o meu conselho».'
    reason: textual_variant
  - marker: b
    text: O grego τέκνον pode significar «filho» ou, mais amplamente, «criança». Aqui é uma forma de tratamento de um mestre a seu discípulo.
    reason: lexical_alternative
  - marker: c
    text: Ou «acolha minha opinião» ou «aceite meu juízo». O grego γνώμη pode indicar opinião ponderada, juízo, resolução ou orientação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄκουσον
  choice: Escute
  rationale: O imperativo comunica atenção obediente em linguagem portuguesa atual e natural.
- source_word: τέκνον
  choice: meu filho
  rationale: Embora o termo grego possa significar genericamente «criança» ou «filho», o contexto é a forma pedagógica tradicional com que o sábio se dirige a um discípulo; «meu filho» preserva esse uso.
- source_word: δέξαι
  choice: aceite
  rationale: Expressa acolhimento voluntário da orientação, e não mera recepção passiva.
- source_word: γνώμην
  choice: parecer
  rationale: Mantém a ideia de uma opinião ponderada ou juízo refletido, sem restringir indevidamente a amplitude semântica do grego.
- source_word: ἀπαναίνου
  choice: rejeite
  rationale: Reproduz com clareza a força do imperativo negativo, cujo sentido é recusar ou declinar.
- source_word: συμβουλίαν
  choice: conselho
  rationale: É natural em português e conserva o registro sapiencial da orientação oferecida pelo mestre.
theological_decisions:
- issue: Seleção da fonte primária diante de uma linha hebraica incompatível com Sirácida 6:23
  choice: Traduzir o paralelo grego como testemunho operativo e registrar a discrepância textual em nota.
  alternative: Traduzir a linha hebraica fornecida como se pertencesse a este versículo.
  rationale: A linha hebraica fala de um utensílio de oleiro, de uma fornalha e da avaliação de uma pessoa, não correspondendo ao conteúdo nem ao contexto de Sirácida 6:23. O grego apresenta uma leitura coerente no contexto da exortação sapiencial. A incerteza do testemunho hebraico é preservada explicitamente, sem combinar os dois textos.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. «Escute» evita o tom arcaizante de «ouve»; «parecer» conserva a nuance deliberativa de γνώμη e distingue esse termo de «conselho», usado em seguida para συμβουλίαν.
