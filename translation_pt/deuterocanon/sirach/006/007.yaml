  text: If you acquire a friend, acquire him through testing, and do not quickly put your trust in him.
translation:
  language: pt
  text: Se você conquistar um amigo, conquiste-o por meio de uma prova[a], e não se apresse em confiar nele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em meio a uma provação”. O hebraico pode indicar tanto o meio de testar a amizade como as circunstâncias em que ela é provada.
    reason: ambiguity
lexical_decisions:
- source_word: קָנִיתָ / קְנֵהוּ
  choice: conquistar / conquiste-o
  rationale: קנה significa adquirir, obter ou ganhar. “Conquistar” preserva a metáfora de obter um amigo e a repetição enfática do hebraico, mas soa mais natural em português do que “adquirir um amigo”.
- source_word: אוֹהֵב
  choice: amigo
  rationale: Neste contexto, אוֹהֵב designa uma pessoa ligada por amizade; o paralelo grego φίλον confirma esse sentido.
- source_word: בְּנִסָּיוֹן
  choice: mediante prova
  rationale: נסיון indica prova, teste ou provação, e a preposição בְּ pode ser instrumental ou circunstancial. “Mediante prova” conserva essa amplitude sem especificar indevidamente se a prova é aplicada de propósito ou surge nas circunstâncias.
- source_word: וְאַל תְּמַהֵר
  choice: não se apresse
  rationale: A construção adverte contra agir precipitadamente. “Não se apresse” é natural e mantém o tom sapiencial.
- source_word: לִבְטוֹחַ עָלָיו
  choice: confiar nele
  rationale: בטח com על expressa confiança ou dependência em alguém. “Confiar nele” transmite o sentido de forma direta e idiomática.
- source_word: אוֹהֵב ... עָלָיו
  choice: amigo ... nele
  rationale: O hebraico e o grego empregam formas masculinas singulares; o português mantém essa concordância sem neutralizar o referente.
theological_decisions:
- issue: Referência masculina singular em instrução sapiencial genérica
  choice: Manter “amigo”, “-o” e “nele” no singular masculino
  alternative: Reformular no plural ou empregar formas neutras
  rationale: As formas masculinas singulares pertencem à expressão concreta do texto-fonte. Mantê-las preserva sua forma sem restringir a aplicação geral do provérbio.
- issue: Natureza da prova da amizade
  choice: Preservar “mediante prova” sem definir quem realiza a prova
  alternative: “Depois de pô-lo à prova” ou “durante uma provação”
  rationale: A preposição hebraica e o paralelo grego permitem tanto uma nuance instrumental quanto circunstancial. A tradução evita decidir se o leitor testa deliberadamente o amigo ou se a amizade se comprova na adversidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição “conquistar... conquiste-o” reproduz a figura verbal do hebraico. “Conquistar um amigo” mantém algo da metáfora de aquisição do original sem a estranheza excessivamente comercial de “adquirir um amigo”.
