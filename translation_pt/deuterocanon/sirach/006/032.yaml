base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/032.yaml
  text: If you desire it[a], my son, you will become wise; and if you set your heart on it[b], you will become shrewd.
translation:
  language: pt
  text: Se você desejar isso[a], meu filho, você se tornará sábio; e, se se dedicar de coração a isso[b], se tornará sagaz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Se você estiver disposto, filho, será instruído; e, se entregar a sua alma, será hábil/sagaz”. O hebraico e o grego concordam no sentido geral, mas o grego destaca a instrução onde o hebraico diz “se tornará sábio”.'
    reason: alternative_reading
  - marker: b
    text: A expressão hebraica literalmente diz “puser seu coração” e indica atenção deliberada e compromisso.
    reason: cultural_note
lexical_decisions:
- source_word: אִם תַּחְפּוֹץ
  choice: Se você desejar isso
  rationale: חפץ expressa desejo ou disposição voluntária. “Desejar” preserva essa força volitiva; “isso” explicita em português o objeto implícito, isto é, a sabedoria tratada no contexto.
- source_word: בְּנִי
  choice: meu filho
  rationale: O hebraico traz um vocativo masculino singular explícito. “Meu filho” o representa com precisão e naturalidade.
- source_word: תִּתְחַכָּם
  choice: se tornará sábio
  rationale: A forma verbal de חכם indica o desenvolvimento ou ingresso no estado de sabedoria, não apenas a aquisição de informação.
- source_word: וְאִם תָּשִׂים לִבְּךָ
  choice: e, se voltar o coração para isso
  rationale: A expressão hebraica descreve atenção intencional e compromisso interior. “Voltar o coração para isso” conserva a imagem hebraica sem deixar de ser compreensível em português.
- source_word: תַּעֲרֹם
  choice: se tornará sagaz
  rationale: Neste contexto sapiencial, ערם denota inteligência prática, prudência ou sagacidade, sem exigir a conotação negativa de astúcia enganosa. “Sagaz” preserva a força incisiva do termo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A formulação mantém o paralelismo do hebraico e preserva sua imagem do coração; “sagaz” comunica inteligência prática positiva sem suavizar excessivamente o termo.
