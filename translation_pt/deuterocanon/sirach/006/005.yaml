  text: A sweet palate multiplies friends[b][a], and gracious lips ask after peace.
translation:
  language: pt
  text: Uma fala agradável multiplica os amigos[a], e lábios graciosos perguntam pelo bem-estar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “multiplica quem ama”, expressão difícil. O paralelo grego traz “multiplica seus amigos”, sentido adotado aqui.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “os que perguntam pela paz”. A expressão pode referir-se a perguntar pelo bem-estar ou a fazer uma saudação de paz. O paralelo grego, com formulação diferente, fala em multiplicar expressões amigáveis.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵךְ עָרֵב
  choice: a fala agradável
  rationale: חֵךְ designa literalmente o palato ou a boca, aqui como metonímia da fala; עָרֵב significa “agradável” ou “doce”. A formulação comunica naturalmente em português o sentido da imagem, preservada em nota.
- source_word: יַרְבֶּה אוֹהֵב
  choice: multiplica os amigos
  rationale: O hebraico traz literalmente algo como “multiplica quem ama”, construção difícil. O paralelo grego lê “multiplicará seus amigos” e confirma o sentido social mais provável.
- source_word: שִׂפְתֵי חֵן
  choice: lábios cheios de graça
  rationale: A expressão literal é “lábios de graça/favor”. A escolha mantém a imagem corporal e expressa uma maneira amável e cativante de falar.
- source_word: שׁוֹאֲלֵי שָׁלוֹם
  choice: saudações amistosas
  rationale: A expressão hebraica refere-se literalmente aos que perguntam pelo bem-estar ou dirigem uma saudação de paz. “Saudações amistosas” transmite esse sentido social em português corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A primeira metonímia corporal foi explicitada como “fala” para evitar que “palato agradável” sugerisse preferência alimentar; a segunda imagem, “lábios”, foi mantida. O paralelismo social do verso foi expresso sem transformar o dito em uma máxima abstrata sobre pacificação.
