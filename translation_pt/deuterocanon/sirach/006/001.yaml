base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/001.yaml
  text: Do not become an enemy instead of a friend, for an evil name will inherit shame and disgrace[b][a]; so it is with a sinful man of double tongue.
translation:
  language: pt
  text: Não se torne inimigo em lugar de amigo, pois um mau nome herdará vergonha e desonra;[a] assim é o homem mau de língua dupla.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho hebraico sobrevivente é mais curto e diz aproximadamente: “Um mau nome herdará vergonha e desonra; assim é o homem mau, possuidor de duas [coisas].” O grego contém ainda uma cláusula inicial difícil, aproximadamente “Em coisas grandes e pequenas, não erres”, e acrescenta a advertência: “Não se torne inimigo em lugar de amigo”; também traz “o pecador” no lugar de “o homem mau”.'
    reason: textual_variant
  - marker: b
    text: Ou “que fala com duplicidade”. A expressão hebraica é obscura, literalmente algo como “possuidor de duas [coisas]”; o grego explicita o sentido como “de língua dupla”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם רַע / ὄνομα πονηρόν
  choice: um nome mau
  rationale: Preserva o idioma comum ao hebraico e ao grego sem o reduzir a uma paráfrase como “má reputação”.
- source_word: וְקָלוֹן / αἰσχύνη
  choice: vergonha
  rationale: Expressa a vergonha pública ou desonra indicada por ambos os testemunhos e mantém distinto o termo seguinte.
- source_word: חֶרְפָּה / ὄνειδος
  choice: desonra
  rationale: Comunica a ideia de opróbrio e perda pública de honra, formando um par natural com “vergonha”.
- source_word: תּוֹרִישׁ / κληρονομήσει
  choice: herdará
  rationale: Mantém a metáfora de herança, apoiada pelo paralelo grego, embora a construção hebraica seja incomum.
- source_word: אִישׁ רַע / ὁ ἁμαρτωλὸς
  choice: o homem mau
  rationale: Segue diretamente o hebraico; o grego traz “o pecador”, variante registrada na nota textual.
- source_word: בַּעַל שְׁתָּיִם / ὁ δίγλωσσος
  choice: de língua dupla
  rationale: O hebraico é obscuro, literalmente algo como “possuidor de duas [coisas]”; o grego o interpreta como alguém de fala dúplice.
- source_word: ἀντὶ φίλου μὴ γίνου ἐχθρός
  choice: Não se torne inimigo em vez de amigo
  rationale: Tradução natural da advertência clara preservada no texto grego, ausente do testemunho hebraico sobrevivente.
theological_decisions:
- issue: Divergência substancial entre os testemunhos hebraico e grego
  choice: Incluir no texto principal a advertência grega clara e manter o núcleo hebraico, documentando a divergência em nota.
  alternative: 'Traduzir somente o hebraico sobrevivente: “Um nome mau herdará vergonha e desonra; assim é o homem mau, possuidor de duas [coisas].”'
  rationale: O hebraico é o testemunho primário, mas sua forma é mais curta e seu final é obscuro. O grego preserva uma advertência coerente e esclarece o idioma final; a nota evita ocultar a diferença.
- issue: Identificação moral de אִישׁ רַע / ὁ ἁμαρτωλός
  choice: o homem mau
  alternative: o pecador
  rationale: A escolha segue o hebraico sem apagar a leitura grega, indicada na nota textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Nome mau” e “língua dupla” preservam as imagens antigas, enquanto as notas esclarecem a divergência textual e a expressão hebraica obscura.
