  text: It is difficult for a fool[b][a], and one lacking sense will not endure it.
translation:
  language: pt
  text: Ela é difícil[a] para o insensato, e quem não tem entendimento[b] não a suportará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “árdua” ou “difícil de enfrentar”. O paralelo grego diz: “muito áspera para os sem instrução”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “quem carece de coração”; no hebraico, é uma expressão para quem carece de entendimento ou bom senso.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲקֻבָּה
  choice: difícil
  rationale: O termo hebraico incomum pode indicar algo tortuoso, áspero ou difícil de enfrentar. O paralelo grego τραχεῖά, intensificado por σφόδρα, confirma a ideia de dificuldade, mas o hebraico não contém intensificador explícito; por isso, o texto principal traz simplesmente “difícil”.
- source_word: לָאֱוִיל
  choice: para o insensato
  rationale: אֱוִיל é um termo sapiencial para quem carece de juízo moral e entendimento. “Insensato” conserva esse valor melhor do que uma expressão ligada apenas à capacidade intelectual.
- source_word: וְלֹא יְכַלְכְּלֶנָּה
  choice: não a suportará
  rationale: כלכל pode significar sustentar, conter, aguentar ou suportar. O sufixo feminino retoma a sabedoria, e o paralelo grego expressa a ideia de não permanecer nela. “Não a suportará” preserva a imagem hebraica sem excluir a noção contextual de não perseverar.
- source_word: חֲסַר לֵב
  choice: quem não tem entendimento
  rationale: A expressão significa literalmente “carente de coração”, mas, na antropologia hebraica, o coração é também o centro da compreensão e do discernimento. A tradução explicita o sentido idiomático natural em português.
theological_decisions:
- issue: Referência feminina à sabedoria
  choice: Usar “ela” e “a”, retomando a sabedoria no feminino.
  alternative: Empregar uma formulação neutra, como “isso” ou “tal coisa”.
  rationale: O hebraico usa formas femininas tanto no predicativo quanto no sufixo verbal, em referência à sabedoria no contexto. O português permite conservar essa ligação gramatical e literária sem acrescentar personificação além do texto.
- issue: Caracterização de חֲסַר לֵב
  choice: Traduzir de modo inclusivo como “quem não tem entendimento”.
  alternative: “O homem sem entendimento” ou “o sem coração”.
  rationale: A forma masculina hebraica designa um tipo humano sapiencial, não apenas pessoas do sexo masculino. A formulação escolhida evita uma restrição inexistente e não confunde falta de entendimento com falta de coragem ou compaixão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção preserva o paralelismo conciso do hebraico e mantém a referência feminina à sabedoria.
