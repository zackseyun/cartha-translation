  text: Who will set a guard over my mouth, and a shrewd seal over my lips, so that I may not fall because of it, and my tongue destroy me?
translation:
  language: pt
  text: Quem porá uma guarda sobre a minha boca e um selo engenhoso sobre os meus lábios, para que eu não caia por causa disso e a minha língua não me destrua?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλακήν
  choice: uma guarda
  rationale: Mantém a imagem concreta de vigilância ou proteção colocada sobre a boca.
- source_word: σφραγῖδα πανοῦργον
  choice: um selo engenhoso
  rationale: Preserva a metáfora incomum do selo e o sentido de habilidade ou sagacidade de πανοῦργος, sem lhe impor aqui uma conotação necessariamente maliciosa.
- source_word: ἀπολέσῃ με
  choice: não me leve à perdição
  rationale: Expressa a força de ἀπόλλυμι de modo natural em português, indicando ruína ou destruição do falante.
theological_decisions:
- issue: Referente de ἀπʼ αὐτῆς
  choice: por causa disso
  alternative: por causa dela
  rationale: O pronome feminino grego tem referente incerto no contexto imediato; a formulação neutra em português conserva a ambiguidade sem o ligar artificialmente ao selo ou antecipá-lo de modo inequívoco à língua.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo preservado. A expressão deliberadamente incomum “selo engenhoso” reflete a tensão lexical do grego em vez de normalizá-la para uma formulação confessional ou excessivamente explicativa.
