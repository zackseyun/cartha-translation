base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/018.yaml
  text: Stakes set on a height opposite the wind will never hold out[a]; so a timid heart, set on a foolish thought[b], will never hold out against any fear.
translation:
  language: pt
  text: Estacas colocadas em lugar elevado, de frente para o vento[a], de modo algum resistirão; assim também, um coração medroso, apoiado num pensamento insensato, de modo algum resistirá diante de qualquer temor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «voltadas contra o vento». A imagem grega é de estacas diretamente expostas ao vento.
    reason: lexical_alternative
  - marker: b
    text: 'Nas duas partes do versículo, o grego emprega uma negação enfática: «certamente não resistirão» / «certamente não resistirá».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρακες
  choice: estacas
  rationale: O termo designa estacas ou postes pontiagudos. “Estacas” mantém a imagem concreta e é natural em português.
- source_word: ἐπὶ μετεώρου κείμενοι
  choice: colocadas num lugar alto
  rationale: A expressão indica uma posição elevada e exposta, não objetos literalmente suspensos no ar.
- source_word: κατέναντι ἀνέμου
  choice: de frente para o vento
  rationale: Preserva o sentido espacial de algo diretamente exposto ao vento e soa natural em português.
- source_word: οὐ μὴ ὑπομείνωσιν / οὐ μὴ ὑπομείνῃ
  choice: de modo algum resistirão / de modo algum resistirá
  rationale: A construção οὐ μή exprime forte negação futura. “De modo algum” conserva essa ênfase, e “resistir” funciona tanto para a imagem física quanto para sua aplicação moral.
- source_word: καρδία δειλή
  choice: um coração medroso
  rationale: δειλή descreve um coração dominado pelo medo ou sem firmeza. “Medroso” comunica isso sem acentuar indevidamente uma condenação moral como “covarde” poderia fazer.
- source_word: ἐπὶ διανοήματος μωροῦ
  choice: apoiado num pensamento insensato
  rationale: A formulação mantém a correspondência com as estacas e preserva a amplitude de διανόημα como pensamento, ideia ou propósito. “Insensato” é adequado ao registro sapiencial.
- source_word: παντὸς φόβου
  choice: qualquer temor
  rationale: 'A expressão tem força distributiva: o coração não resiste diante de temor algum. “Qualquer temor” transmite essa vulnerabilidade geral.'
