  text: A prudent daughter will obtain a husband[a], but one who brings shame is a grief to the one who fathered her.
translation:
  language: pt
  text: A filha prudente conseguirá marido[a], mas a que causa vergonha traz tristeza ao pai que a gerou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, «herdará marido»; aqui, a expressão tem o sentido de conseguir ou obter marido.
    reason: lexical_alternative
lexical_decisions:
- source_word: θυγάτηρ φρονίμη
  choice: A filha prudente
  rationale: Preserva o termo familiar direto e expressa φρονίμη como sabedoria prática, bom senso e conduta sensata.
- source_word: κληρονομήσει
  choice: conseguirá
  rationale: O sentido básico é «herdará», mas, tendo ἄνδρα por objeto neste contexto matrimonial, a expressão indica alcançar ou obter marido; «conseguirá» comunica o resultado em português natural.
- source_word: ἄνδρα αὐτῆς
  choice: marido
  rationale: Neste contexto, ἀνήρ tem o sentido relacional de «marido». O possessivo αὐτῆς é natural e suficientemente representado em português pela construção «conseguirá marido», sem um «seu» potencialmente ambíguo.
- source_word: ἡ καταισχύνουσα
  choice: a que causa vergonha
  rationale: 'Mantém a força ativa do particípio: a filha não é apenas envergonhada ou vergonhosa, mas causa vergonha.'
- source_word: εἰς λύπην
  choice: traz tristeza
  rationale: 'Expressa de modo idiomático o resultado indicado pela construção grega: ela se torna motivo de tristeza para quem a gerou.'
- source_word: γεννήσαντος
  choice: ao pai que a gerou
  rationale: O particípio masculino singular se refere ao homem que a gerou; «pai que a gerou» preserva tanto a referência masculina quanto a linguagem de geração em português claro.
theological_decisions:
- issue: Referência parental masculina em γεννήσαντος
  choice: ao pai que a gerou
  alternative: a quem a gerou; ao progenitor
  rationale: O grego emprega um particípio masculino singular. A tradução evita neutralizar essa referência e, ao mesmo tempo, usa uma formulação natural e digna em português.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A formulação conserva o paralelismo entre a filha prudente e a que causa vergonha, sem tornar rígido o idioma grego.
