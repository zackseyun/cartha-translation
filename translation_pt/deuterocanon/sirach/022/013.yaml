base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/013.yaml
  text: Do not multiply words with a fool[a], and do not go to an unintelligent man. Keep away from him, so that you may not have trouble and may not be defiled by his shaking-off. Turn aside from him, and you will find rest, and you will not grow weary because of his madness.
translation:
  language: pt
  text: Não multiplique palavras com um tolo, nem vá até quem não tem entendimento. Mantenha-se longe dele, para que você não tenha aborrecimento nem seja contaminado pela agitação dele.[a] Desvie-se dele, e encontrará descanso; você não se cansará com a loucura dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido como “agitação” é raro e de sentido incerto. Pode indicar sacudidas, arremessos ou, de modo mais amplo, os rompantes perturbadores e o efeito contaminante da conduta do tolo.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ἄφρονος
  choice: com um tolo
  rationale: “Tolo” conserva a categoria moral e sapiencial de ἄφρων e é claro no português corrente.
- source_word: μὴ πληθύνῃς λόγον
  choice: não multiplique palavras
  rationale: Mantém a imagem literal e o tom proverbial do grego, sem deixar de ser compreensível.
- source_word: πρὸς ἀσύνετον μὴ πορεύου
  choice: nem vá até quem não tem entendimento
  rationale: “Vá até” preserva a ideia de movimento de πορεύου, enquanto “quem não tem entendimento” expressa ἀσύνετος sem sugerir uma avaliação técnica de inteligência.
- source_word: φύλαξαι ἀπʼ αὐτοῦ
  choice: mantenha-se longe dele
  rationale: Expressa de modo natural a distância protetora exigida pelo imperativo.
- source_word: κόπον ἔχῃς
  choice: tenha aborrecimento
  rationale: κόπος pode indicar trabalho penoso, incômodo ou dificuldade; neste contexto relacional, “aborrecimento” comunica o desgaste causado pelo tolo.
- source_word: μολυνθῇς
  choice: seja contaminado
  rationale: Preserva a força da linguagem de contaminação de μολύνω, sem especificar indevidamente se ela é moral, social ou figurada.
- source_word: ἐν τῷ ἐντιναγμῷ αὐτοῦ
  choice: pela agitação dele
  rationale: O substantivo raro ἐντιναγμός sugere sacudir, lançar ou provocar uma perturbação. “Agitação” mantém a imagem ampla e evita fixar uma interpretação incerta; a nota registra outras possibilidades.
- source_word: ἔκκλινον ἀπʼ αὐτοῦ
  choice: desvie-se dele
  rationale: Conserva a imagem direcional de ἐκκλίνω e funciona naturalmente como exortação sapiencial.
- source_word: ἀνάπαυσιν
  choice: descanso
  rationale: Equivalente direto e natural de ἀνάπαυσις, podendo incluir a ideia de alívio.
- source_word: οὐ μὴ ἀκηδιάσῃς
  choice: você não se cansará
  rationale: A construção enfática nega o resultado, e ἀκηδιάω pode indicar cansaço, desânimo ou enfado. A tradução conserva o efeito desgastante sem estreitar excessivamente o sentido.
- source_word: ἐν τῇ ἀπονοίᾳ αὐτοῦ
  choice: com a loucura dele
  rationale: ἀπόνοια pode significar insensatez ou loucura. “Loucura” preserva sua força, e “com” mantém aberta a relação contextual sem impor uma análise causal excessivamente explícita.
