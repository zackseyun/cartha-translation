  source_fidelity: A tradução preserva a comparação arquitetônica, «coração» para καρδία e a ideia de firmeza de ἠδρασμένη. Contudo, «entendimento refletido» é pouco idiomático e pode sugerir um entendimento que foi refletido/espelhado, em vez de entendimento ponderado. «acabamento de areia» também não é formulação natural em português e torna pouco clara a relação entre os termos de superfície da parede, que no grego é condensada e lexicalmente incerta.
  naturalness: 'A redação proposta melhora a fluidez sem desfazer a concisão proverbial: «entendimento ponderado» é natural para a combinação διανοίας συνέσεως, e «parede rebocada, de acabamento arenoso» comunica a imagem construtiva de maneira clara, sem pretender identificar com certeza uma técnica antiga específica.'
  terminology: «Coração», «firmado», «entendimento» e «parede» são adequados. «Rebocada» e «acabamento arenoso» oferecem uma solução arquitetônica idiomática para os termos disputados κόσμος, ψαμμωτός e ξυστός; a nota mantém explicitamente a incerteza quanto ao detalhe técnico.
