  - severity: medium
    issue: «acabamento de areia» é uma colocação pouco natural e pouco definida.
    rationale: A expressão não comunica com clareza se se trata de material, textura ou tratamento de superfície. «acabamento arenoso» é idiomático e conserva a incerteza técnica que a nota deve assinalar.
