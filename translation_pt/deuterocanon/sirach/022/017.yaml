  text: A heart set firm on thoughtful understanding is like a plastered wall with a sanded finish[a].
translation:
  language: pt
  text: Um coração firmado em entendimento ponderado é como uma parede rebocada, de acabamento arenoso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A imagem grega é arquitetônica e bastante condensada. Literalmente, aproxima-se de: “um coração firmado em entendimento ponderado, como o acabamento arenoso de uma parede alisada”. O sentido exato dos termos relativos ao revestimento e à superfície da parede é incerto; a comparação evoca firmeza e solidez.'
    reason: cultural_note
lexical_decisions:
- source_word: καρδία
  choice: coração
  rationale: Preserva o sentido antropológico bíblico do centro interior do pensamento e da determinação, não apenas das emoções.
- source_word: ἠδρασμένη
  choice: firmado
  rationale: Expressa o estado resultante de algo tornado estável ou solidamente estabelecido, mantendo a forma passiva do particípio.
- source_word: ἐπὶ
  choice: em
  rationale: Mantém de modo natural em português a ligação entre a firmeza do coração e sua base ou esfera de entendimento, sem determinar excessivamente a relação sintática.
- source_word: διανοίας συνέσεως
  choice: entendimento refletido
  rationale: A expressão grega é condensada; “entendimento” representa σύνεσις, e “refletido” preserva a dimensão de pensamento ou reflexão de διανοία sem produzir uma cadeia nominal artificial.
- source_word: ὡς
  choice: é como
  rationale: Introduz claramente a comparação em português corrente.
- source_word: κόσμος
  choice: acabamento
  rationale: Embora possa significar adorno, no contexto dos termos arquitetônicos pode designar a aparência ordenada ou o revestimento final da parede; “acabamento” mantém esse sentido contextual sem impor mera decoração.
- source_word: ψαμμωτός
  choice: de areia
  rationale: O adjetivo raro deriva de “areia” e provavelmente descreve um revestimento ou tratamento feito com areia; a formulação preserva o material sem alegar uma técnica moderna específica.
- source_word: τοίχου
  choice: parede
  rationale: Equivalente português comum e preciso para τοῖχος.
- source_word: ξυστοῦ
  choice: alisada
  rationale: O termo sugere uma superfície raspada, polida ou tornada lisa; “alisada” comunica esse resultado sem confundi-lo necessariamente com reboco.
