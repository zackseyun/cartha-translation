translation:
  language: pt
  text: Quem atira uma pedra contra os pássaros os afugenta[a], e quem censura[b] um amigo desfará a amizade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os faz fugir». O verbo grego indica afugentar ou fazer fugir.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «insulta um amigo». O verbo grego pode indicar censura, insulto ou desprezo dirigido a alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλων
  choice: Quem atira
  rationale: O particípio presente tem valor genérico e proverbial; «Quem atira» expressa isso com naturalidade.
- source_word: λίθον
  choice: uma pedra
  rationale: Tradução direta do objeto singular.
- source_word: ἐπὶ πετεινὰ
  choice: contra os pássaros
  rationale: πετεινά designa aves ou criaturas aladas; no contexto, «pássaros» é natural, e «contra» comunica o alvo do arremesso.
- source_word: ἀποσοβεῖ
  choice: os afugenta
  rationale: O verbo indica fazer fugir ou enxotar; «afugenta» preserva esse sentido de modo conciso.
- source_word: ὀνειδίζων
  choice: quem censura
  rationale: O termo pode significar censurar, repreender com desonra ou insultar. «Censura» mantém a amplitude sem intensificar indevidamente a linguagem.
- source_word: φίλον
  choice: um amigo
  rationale: O singular sem artigo em uma máxima é adequadamente expresso de forma indefinida, sem acrescentar posse.
- source_word: διαλύσει
  choice: desfaz
  rationale: Embora a forma grega seja futura, o português proverbial usa naturalmente o presente para uma consequência geral; «desfaz» comunica a dissolução do vínculo.
- source_word: φιλίαν
  choice: a amizade
  rationale: Equivalente direto e idiomático do vínculo amistoso referido.
