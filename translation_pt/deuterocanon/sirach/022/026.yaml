  text: And if harm comes to me through him[a], everyone who hears will guard himself from him.
translation:
  language: pt
  text: E, se algum mal me acontecer por causa dele, todo aquele que ouvir falar disso tomará cuidado com ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κακά
  choice: algum mal
  rationale: O neutro plural designa acontecimentos adversos ou dano sofrido pelo falante. Em português, “algum mal” é natural e não restringe o sentido a dano físico nem o transforma necessariamente em mal moral.
- source_word: μοι συμβήσεται
  choice: me acontecer
  rationale: A construção expressa algo adverso que sobrevém à pessoa afetada. “Me acontecer” reproduz de modo corrente o valor de “acontecer a mim”.
- source_word: διʼ αὐτόν
  choice: por causa dele
  rationale: διά com acusativo indica aqui causa ou motivo. “Por causa dele” conserva a possível responsabilidade ou participação da pessoa sem especificar exatamente como ela ocasiona o mal.
- source_word: πᾶς ὁ ἀκούων
  choice: todo aquele que ouvir falar disso
  rationale: 'O particípio substantivado tem sentido abrangente. “Ouvir falar disso” explicita naturalmente em português o conteúdo implícito do ato de ouvir: o mal ocorrido por causa dessa pessoa.'
- source_word: φυλάξεται ἀπʼ αὐτοῦ
  choice: tomará cuidado com ele
  rationale: O futuro médio com ἀπό exprime precaução pessoal diante de alguém. A formulação escolhida é idiomática em português e comunica o sentido de ficar alerta ou prevenir-se contra essa pessoa.
theological_decisions:
- issue: Caráter genérico de πᾶς ὁ ἀκούων
  choice: todo aquele que ouvir falar disso
  alternative: todo homem que ouvir falar disso
  rationale: O masculino singular grego funciona genericamente e não restringe a declaração aos homens. A formulação portuguesa mantém o alcance universal sem introduzir uma limitação de gênero.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Evitou-se o pouco corrente “se guardará dele”, preferindo-se “tomará cuidado com ele”, sem perder a ideia de precaução pessoal.
