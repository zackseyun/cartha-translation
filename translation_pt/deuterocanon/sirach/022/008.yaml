base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/008.yaml
  text: Telling a story to one who is drowsy is like telling it to a fool[a], and at the end he will say, “What was it?”
translation:
  language: pt
  text: 'Contar algo a quem está sonolento é como contar a um insensato[a]; no fim, ele perguntará: “O que foi?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção grega é um tanto incomum e repete “quem conta” (διηγούμενος ... ὁ διηγούμενος). O sentido parece ser comparativo: contar algo a uma pessoa sonolenta é como contá-lo a um insensato.'
    reason: textual_variant
lexical_decisions:
- source_word: διηγούμενος (διηγέομαι)
  choice: contar algo
  rationale: O particípio designa o ato de relatar ou narrar. “Contar algo” é natural em português e evita acrescentar a ideia específica de uma história fictícia.
- source_word: νυστάζοντι
  choice: a quem está sonolento
  rationale: Expressa o estado de quem está com sono e, por isso, não presta a devida atenção.
- source_word: μωρῷ
  choice: a um insensato
  rationale: Na literatura sapiencial, μωρός caracteriza quem carece de sensatez prática e moral; “insensato” conserva essa dimensão melhor do que um termo limitado à capacidade intelectual.
- source_word: ἐπὶ συντελείᾳ
  choice: no fim
  rationale: Indica o término ou a conclusão do relato, em formulação portuguesa direta.
- source_word: Τί ἐστιν;
  choice: O que foi?
  rationale: Embora literalmente seja “O que é?”, no contexto a pergunta se refere ao que acabou de ser contado. “O que foi?” preserva a brevidade e soa natural em português.
