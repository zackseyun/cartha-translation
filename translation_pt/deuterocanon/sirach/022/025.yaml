  text: I will not be ashamed to shelter a friend[a], and from his presence I will certainly not hide myself,
translation:
  language: pt
  text: Não me envergonharei de proteger um amigo e, de modo algum, me esconderei da presença dele[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, a expressão traduzida por “da presença dele” é literalmente “de diante do rosto dele”. A cláusula final também pode ser entendida como “de modo algum ficarei escondido diante dele”.
    reason: Registra a literalidade da locução ligada a “rosto” e a possível leitura passiva de κρυβῶ, deixando claro o alcance de cada observação.
lexical_decisions:
- source_word: φίλον
  choice: um amigo
  rationale: O acusativo singular é empregado sem possessivo explícito. “Um amigo” preserva o caráter genérico da expressão sem introduzir “meu”.
- source_word: σκεπάσαι
  choice: proteger
  rationale: O infinitivo de σκεπάζω pode significar cobrir, abrigar ou proteger. Neste contexto ético, “proteger” comunica com clareza o amparo prestado ao amigo, preservando a amplitude da imagem.
- source_word: οὐκ αἰσχυνθήσομαι
  choice: não me envergonharei
  rationale: O futuro de αἰσχύνομαι exprime de modo direto a ideia de não sentir vergonha; a forma portuguesa mantém também o valor futuro do grego.
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: da presença dele
  rationale: Embora πρόσωπον signifique literalmente “rosto”, a construção ἀπὸ προσώπου é idiomática e pode indicar afastamento da presença de alguém. A tradução escolhida é natural e conserva o sentido relacional.
- source_word: οὐ μὴ κρυβῶ
  choice: de modo algum, me esconderei
  rationale: A construção οὐ μή com o subjuntivo aoristo constitui uma negação enfática. “De modo algum” preserva essa força, enquanto “me esconderei” expressa a leitura reflexiva mais provável sem ocultar em nota a possibilidade formal de leitura passiva.
