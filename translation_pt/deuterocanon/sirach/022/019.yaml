  text: One who pricks an eye brings forth tears[b][a], and one who pricks a heart reveals feeling.
translation:
  language: pt
  text: Quem fere um olho faz correr lágrimas[a]; e quem fere um coração revela sensibilidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «provoca lágrimas»; literalmente, o grego fala em fazer as lágrimas descerem.
    reason: lexical_alternative
  - marker: b
    text: Ou «revela a percepção» ou «torna manifesta a sensibilidade»; o substantivo grego pode indicar percepção, sensação ou sensibilidade interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νύσσων
  choice: quem fere
  rationale: O particípio descreve ferir ou picar com algo pontiagudo. «Fere» preserva a imagem concreta e funciona naturalmente com «olho» e «coração», sem exigir que o instrumento seja explicitado.
- source_word: ὀφθαλμόν
  choice: um olho
  rationale: O singular sem artigo expressa uma afirmação geral; em português, «um olho» comunica naturalmente esse valor genérico.
- source_word: κατάξει δάκρυα
  choice: faz as lágrimas descerem
  rationale: A formulação conserva a imagem do verbo grego, que sugere fazer descer ou cair as lágrimas, e permanece clara em português atual.
- source_word: καρδίαν
  choice: um coração
  rationale: O singular tem sentido genérico. No paralelismo, «coração» designa a interioridade e a sede da sensibilidade, sem excluir a força da imagem corporal.
- source_word: ἐκφαίνει
  choice: revela
  rationale: O verbo indica trazer à luz ou tornar manifesto; «revela» expressa isso de modo claro e digno.
- source_word: αἴσθησιν
  choice: o que ele sente
  rationale: A expressão portuguesa comunica a sensibilidade ou reação interior associada ao coração, evitando restringir o termo grego apenas à cognição; a nota preserva sua amplitude lexical.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e proverbial, com paralelismo entre olho e coração. «Quem fere» é suficientemente concreto e natural nos dois membros; «faz as lágrimas descerem» retém a imagem grega. Os marcadores foram posicionados junto às expressões a que se referem.
