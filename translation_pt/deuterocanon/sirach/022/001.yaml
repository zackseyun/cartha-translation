  text: A lazy man is compared to a filthy stone[b][a], and everyone will whistle at his disgrace.
translation:
  language: pt
  text: O preguiçoso foi comparado a uma pedra imunda[a], e todos assobiarão[b] por causa de sua desonra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «uma pedra suja» ou «uma pedra conspurcada». O particípio grego que descreve a pedra é raro, mas indica claramente que ela está suja ou maculada.'
    reason: lexical_alternative
  - marker: b
    text: O verbo grego também pode indicar «sibilarão» em sinal de desprezo, e não apenas «assobiarão».
    reason: lexical_alternative
lexical_decisions:
- source_word: Λίθῳ
  choice: pedra
  rationale: O dativo singular de λίθος designa uma pedra; «pedra» é a equivalência natural na comparação proverbial.
- source_word: ἠρδαλωμένῳ
  choice: imunda
  rationale: O particípio raro descreve a pedra como suja ou conspurcada. «Imunda» comunica de modo conciso sua condição fortemente negativa, enquanto a nota preserva a incerteza lexical.
- source_word: συνεβλήθη
  choice: foi comparado a
  rationale: Neste contexto, o aoristo passivo exprime uma comparação, não o ato literal de lançar ou juntar objetos.
- source_word: ὀκνηρός
  choice: o preguiçoso
  rationale: O adjetivo substantivado, masculino singular, designa um homem preguiçoso. A forma nominal «o preguiçoso» é natural e proverbial em português.
- source_word: πᾶς
  choice: todos
  rationale: O singular distributivo tem aqui sentido universal; «todos» expressa naturalmente a reação geral.
- source_word: ἐκσυριεῖ
  choice: assobiarão
  rationale: O verbo denota produzir um assobio ou silvo de escárnio. «Assobiarão» conserva a imagem concreta, e a possível leitura «sibilarão» é registrada em nota.
- source_word: ἀτιμίᾳ
  choice: desonra
  rationale: O substantivo indica desonra, ignomínia ou vergonha pública. «Desonra» mantém a relação direta com ἀτιμία sem acrescentar uma interpretação psicológica.
theological_decisions:
- issue: Masculino singular substantivado em ὀκνηρός
  choice: o preguiçoso
  alternative: a pessoa preguiçosa
  rationale: Embora o provérbio possa ter aplicação geral, a forma grega é masculina singular. «O preguiçoso» preserva essa forma e permanece idiomático em português.
translation_notes:
  register: Português moderno, claro e digno, com formulação proverbial. O pretérito «foi comparado» preserva o aoristo passivo; «por causa de» explicita de modo natural a relação de ἐπί com o motivo do escárnio, sem eliminar a ambiguidade lexical principal, registrada nas notas.
