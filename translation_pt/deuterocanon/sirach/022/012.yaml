base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/012.yaml
  text: Mourning for the dead is seven days[a], but for a fool and an ungodly man, all the days of his life.
translation:
  language: pt
  text: O luto por um morto dura sete dias; mas, por um insensato e ímpio, todos os dias da vida dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega aqui formas masculinas singulares de modo genérico neste provérbio sapiencial; o sentido também se aplica a uma pessoa insensata e ímpia.
    reason: Esclarecer o uso representativo do masculino singular sem alterá-lo no texto principal.
lexical_decisions:
- source_word: πένθος
  choice: luto
  rationale: Expressa de modo natural e digno o período ou estado de pesar pela morte, preservando o sentido funerário do substantivo grego.
- source_word: νεκροῦ
  choice: por um morto
  rationale: O genitivo singular tem valor genérico e indica a pessoa cuja morte motiva o luto. Esta formulação é clara e mantém o singular do grego.
- source_word: ἑπτὰ ἡμέραι
  choice: sete dias
  rationale: Reprodução direta da expressão temporal grega; o verbo “dura”, implícito no original, torna a frase natural em português.
- source_word: μωροῦ
  choice: um insensato
  rationale: No contexto sapiencial, μωρός caracteriza quem age sem juízo moral e prático, não apenas alguém com pouca inteligência. “Insensato” conserva essa dimensão e evita o tom meramente insultuoso de “idiota”.
- source_word: ἀσεβοῦς
  choice: ímpio
  rationale: Designa quem não demonstra a devida reverência a Deus. O adjetivo sem novo artigo ou substantivo mantém a leitura mais provável de que “insensato e ímpio” descreve a mesma pessoa.
- source_word: πᾶσαι αἱ ἡμέραι τῆς ζωῆς αὐτοῦ
  choice: todos os dias da vida dele
  rationale: Preserva a estrutura e a força abrangente do grego. “Dele” explicita naturalmente em português que a vida é a do insensato e ímpio, sem eliminar a tensão proverbial de lamentá-lo enquanto ainda vive.
theological_decisions:
- issue: Masculino singular representativo em um provérbio sapiencial
  choice: Manter o masculino singular em “um insensato e ímpio” e “da vida dele”
  alternative: “uma pessoa insensata e ímpia” e “durante toda a vida dela”
  rationale: O grego emprega formas masculinas singulares de modo representativo. A tradução conserva essa forma gramatical e informa em nota seu alcance genérico, sem restringir artificialmente a aplicação do provérbio.
- issue: Relação entre μωροῦ e ἀσεβοῦς
  choice: 'Entender os dois adjetivos como descrição de uma só pessoa: “um insensato e ímpio”'
  alternative: 'Entender como duas pessoas: “um insensato e um ímpio”'
  rationale: Os dois genitivos masculinos singulares coordenados, seguidos de αὐτοῦ também no singular, favorecem a referência a uma só pessoa caracterizada de duas maneiras.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O ponto e vírgula preserva o contraste conciso do provérbio. O verbo “dura” supre a cópula omitida no grego, e a elipse na segunda oração é mantida para conservar seu paralelismo e impacto.
