  yaml_path: translation/deuterocanon/sirach/022/005.yaml
  text: A shameless woman brings shame on father and husband[a], and she will be dishonored by both.
translation:
  language: pt
  text: A mulher descarada[a] envergonha o pai e o marido, e será desonrada por ambos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sem-vergonha» ou «insolente». O termo grego descreve uma mulher marcada por audácia sem pudor.
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα
  choice: o pai
  rationale: Objeto direto de καταισχύνει. O grego não traz possessivo; em português, a relação familiar é compreendida naturalmente sem acrescentar «seu».
- source_word: ἄνδρα
  choice: o marido
  rationale: Em coordenação com «pai» e no contexto de honra familiar, ἀνήρ significa mais naturalmente «marido», não «homem» em sentido genérico.
- source_word: καταισχύνει
  choice: envergonha
  rationale: O verbo expressa causar vergonha ou desonra. «Envergonha» é natural e preserva a força causativa.
- source_word: ἡ θρασεῖα
  choice: a mulher atrevida
  rationale: O adjetivo feminino substantivado caracteriza uma mulher audaciosa de modo negativo. «Atrevida» preserva a ideia de ousadia imprudente ou insolente sem reduzir o termo apenas à ausência de vergonha.
- source_word: ὑπὸ ἀμφοτέρων
  choice: por ambos
  rationale: A expressão retoma as duas pessoas mencionadas, o pai e o marido.
- source_word: ἀτιμασθήσεται
  choice: será desonrada
  rationale: O futuro passivo indica que ela receberá desonra da parte deles; «desonrada» mantém o campo semântico de honra e vergonha da primeira oração.
