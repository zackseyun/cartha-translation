  text: A father’s shame is the birth of an undisciplined son[b][a], and a daughter is born for loss.
translation:
  language: pt
  text: A vergonha de um pai é gerar um filho indisciplinado[a], e uma filha nasce para prejuízo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de um indisciplinado”. O adjetivo grego está no masculino, e “filho” fica subentendido.
    reason: lexical_alternative
  - marker: b
    text: Ou “para a diminuição”, “para a perda” ou “em prejuízo do pai”. A expressão grega indica redução ou prejuízo, mas não especifica exatamente em que sentido.
    reason: alternative_reading
lexical_decisions:
- source_word: αἰσχύνη
  choice: vergonha
  rationale: Expressa diretamente desonra ou vergonha e preserva a força concisa do provérbio.
- source_word: πατρὸς
  choice: de um pai
  rationale: Reproduz naturalmente o genitivo grego e mantém a formulação proverbial no singular.
- source_word: ἐν γεννήσει
  choice: está em gerar
  rationale: Conserva o sentido de geração ou procriação da expressão, em português corrente, sem reduzi-la apenas ao momento do parto.
- source_word: ἀπαιδεύτου
  choice: um filho indisciplinado
  rationale: O adjetivo masculino substantivado indica um descendente do sexo masculino; no contexto sapiencial, a falta de formação tem forte dimensão moral, bem expressa por “indisciplinado”.
- source_word: θυγάτηρ
  choice: uma filha
  rationale: Correspondência lexical direta, mantendo o contraste explicitamente marcado entre o descendente masculino e a filha.
- source_word: ἐπʼ ἐλαττώσει
  choice: para a perda
  rationale: A expressão denota diminuição, redução ou prejuízo. “Para a perda” mantém sua formulação comprimida e sua ambiguidade sem especificar indevidamente quem sofre a perda ou em que ela consiste.
- source_word: γίνεται
  choice: nasce
  rationale: Embora γίνομαι possa significar de modo mais amplo “vir a existir”, o contexto de geração e descendência torna “nasce” a expressão portuguesa mais natural.
theological_decisions:
- issue: Termos de descendência marcados por gênero
  choice: Manter “pai”, o “filho” implícito e “filha”.
  alternative: Empregar termos neutros como “progenitor” e “criança”.
  rationale: O grego menciona expressamente o pai e a filha, enquanto o masculino de ἀπαιδεύτου indica um filho. Neutralizar esses termos apagaria a estrutura de gênero do dito.
- issue: Avaliação social negativa associada à filha
  choice: Traduzir diretamente a afirmação antiga, preservando sua dureza e ambiguidade.
  alternative: Suavizar o segundo membro ou explicá-lo como uma dificuldade familiar específica.
  rationale: A tradução não deve corrigir nem ampliar a pressuposição social patriarcal refletida no texto; deve apresentá-la com fidelidade, deixando a nota esclarecer a amplitude lexical.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção proverbial permanece concisa; a nota preserva a ambiguidade da segunda oração sem amenizar a perspectiva social do texto antigo.
