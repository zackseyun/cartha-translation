  terminology: “Filho indisciplinado” é uma opção defensável para ἀπαίδευτος no contexto sapiencial. “Prejuízo” comunica ἐλάττωσις como perda/diminuição e a nota conserva as alternativas. A nota a deve refletir o caso genitivo do adjetivo grego.
