translation:
  language: pt
  text: Se você desembainhar uma espada contra um amigo[a], não perca a esperança, pois há retorno[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sacar uma espada contra um amigo”. O verbo grego significa literalmente “puxar” ou “sacar”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pois há volta” ou “pois é possível haver restauração”. O grego diz literalmente: “pois há retorno”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ φίλον
  choice: contra um amigo
  rationale: Com uma ação hostil, ἐπί com o acusativo tem sentido adversativo; “contra um amigo” expressa isso com clareza em português.
- source_word: ἐὰν σπάσῃς
  choice: se você desembainhar
  rationale: σπάω significa puxar ou sacar; tendo ῥομφαίαν por objeto, refere-se naturalmente a tirar a espada da bainha. “Desembainhar” preserva a imagem marcial sem sugerir que a espada foi quebrada.
- source_word: ῥομφαίαν
  choice: uma espada
  rationale: ῥομφαία designa uma espada, por vezes grande ou larga. “Espada” é a equivalência corrente e evita uma especificação desnecessária.
- source_word: μὴ ἀπελπίσῃς
  choice: não perca a esperança
  rationale: ἀπελπίζω significa desesperar ou perder a esperança. A formulação é natural, atual e mantém a força imperativa.
- source_word: ἔστιν γὰρ ἐπάνοδος
  choice: pois há caminho de volta
  rationale: ἐπάνοδος denota retorno ou volta. “Há caminho de volta” conserva a metáfora e sugere a possibilidade de restauração sem defini-la explicitamente como reconciliação plena.
theological_decisions:
- issue: Restauração da relação depois de uma ação violenta contra um amigo
  choice: O texto afirma que ainda existe um caminho de volta após a grave ruptura representada por desembainhar uma espada.
  alternative: A expressão pode significar simplesmente “há retorno”, sem especificar reconciliação; a imagem da espada também pode ser hiperbólica, representando uma ofensa grave.
  rationale: O grego combina uma imagem marcial concreta com a declaração abstrata ἔστιν γὰρ ἐπάνοδος. A tradução preserva a imagem e mantém em aberto a natureza e a extensão desse retorno.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Desembainhar” preserva a imagem concreta, enquanto “há caminho de volta” comunica naturalmente a metáfora relacional sem eliminar sua ambiguidade.
