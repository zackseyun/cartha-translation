  text: It is easier to carry sand and salt and a lump of iron than a senseless man[a].
translation:
  language: pt
  text: É mais fácil carregar areia, sal e um bloco de ferro do que carregar um homem sem entendimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um homem insensato”, “um homem tolo” ou “um homem sem compreensão”.'
    reason: Registra alternativas lexicais para ἀσύνετον, que designa alguém sem entendimento ou discernimento.
lexical_decisions:
- source_word: ἄμμον
  choice: areia
  rationale: Substantivo concreto usado como nome de massa; corresponde diretamente à imagem grega.
- source_word: ἅλα
  choice: sal
  rationale: Embora a forma grega seja plural, tem valor coletivo e é expressa naturalmente em português pelo nome de massa singular.
- source_word: βῶλον σιδήρου
  choice: um bloco de ferro
  rationale: βῶλος indica um torrão, pedaço ou massa; “bloco de ferro” transmite com naturalidade a ideia de um objeto compacto e pesado.
- source_word: εὔκοπον
  choice: mais fácil
  rationale: A construção com ἢ estabelece comparação explícita, tornando natural o comparativo em português.
- source_word: ὑπενεγκεῖν
  choice: carregar / suportar
  rationale: O verbo abrange carregar um peso e suportar algo penoso. A variação contextual conserva o jogo entre o peso físico dos materiais e o fardo figurado da pessoa.
- source_word: ἄνθρωπον ἀσύνετον
  choice: um homem sem entendimento
  rationale: Mantém o referente humano masculino singular e traduz ἀσύνετος como falta de entendimento, evitando a conotação moderna de medição intelectual presente em “pouco inteligente”.
theological_decisions:
- issue: Sentido de ἀσύνετον
  choice: sem entendimento
  alternative: insensato; tolo
  rationale: A expressão preserva o foco na ausência de compreensão sem decidir se a deficiência é apenas intelectual ou também moral, tensão própria da linguagem sapiencial.
- issue: Representação de ἄνθρωπον
  choice: um homem
  alternative: uma pessoa; um ser humano
  rationale: O grego apresenta um referente humano singular de forma masculina; “um homem” conserva essa forma sem universalizar nem neutralizar o provérbio.
- issue: Repetição de ὑπενεγκεῖν na comparação
  choice: carregar ... suportar
  alternative: carregar ... carregar
  rationale: A mudança lexical torna explícita em português a passagem do peso concreto ao fardo relacional, sem alterar o sentido básico compartilhado pelo único verbo grego.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A frase conserva a concisão proverbial e o contraste entre cargas materiais e o peso figurado de conviver com alguém sem entendimento.
