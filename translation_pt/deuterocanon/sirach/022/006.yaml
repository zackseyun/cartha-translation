  source_fidelity: A tradução acompanha fielmente o grego. “A música durante o luto” representa adequadamente μουσικὰ ἐν πένθει; “discurso fora de hora” preserva o valor de ἄκαιρος διήγησις; e “açoites e disciplina” mantém tanto o sentido corporal explícito de μάστιγες quanto a amplitude formativa/corretiva de παιδεία. “Em todo tempo” reproduz ἐν παντὶ καιρῷ. A formulação concisa “são sabedoria” conserva, sem resolver indevidamente, a construção proverbial elíptica de σοφίας.
