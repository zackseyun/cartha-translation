  yaml_path: translation/deuterocanon/sirach/022/006.yaml
  text: Music during mourning is an untimely discourse[b][a], but beatings and discipline are wisdom at all times.
translation:
  language: pt
  text: A música durante o luto é um discurso fora de hora; mas os açoites e a disciplina são sabedoria em todo tempo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz uma expressão proverbial condensada: “açoites e disciplina... sabedoria”. Também pode ser entendida como “pertencem à sabedoria” ou “são próprios da sabedoria”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μουσικὰ
  choice: a música
  rationale: O neutro plural abrange coisas musicais ou a prática musical em geral. “A música” é natural em português e não restringe o sentido apenas ao canto.
- source_word: ἐν πένθει
  choice: durante o luto
  rationale: A expressão indica a circunstância em que há luto ou pesar; “durante o luto” comunica com clareza esse valor temporal e contextual.
- source_word: ἄκαιρος
  choice: fora de hora
  rationale: O adjetivo descreve algo que ocorre no momento impróprio. “Fora de hora” é corrente e preserva o contraste temporal com “em todo tempo”.
- source_word: διήγησις
  choice: discurso
  rationale: O substantivo pode designar narrativa, exposição ou fala. “Discurso” mantém a formulação ampla e proverbial sem reduzi-la a simples conversa.
- source_word: μάστιγες
  choice: açoites
  rationale: O plural indica golpes dados com chicote ou instrumento semelhante. “Açoites” conserva de modo direto o sentido físico do termo grego.
- source_word: παιδεία
  choice: disciplina
  rationale: Na literatura sapiencial, o termo inclui formação, correção e treinamento. “Disciplina” preserva essa amplitude e sua associação aqui com a correção física.
- source_word: ἐν παντὶ καιρῷ
  choice: em todo tempo
  rationale: A tradução conserva a expressão temporal explícita e reforça o contraste com “fora de hora” na primeira parte.
- source_word: σοφίας
  choice: são sabedoria
  rationale: O genitivo forma uma expressão proverbial comprimida e elíptica. A formulação predicativa preserva sua concisão sem decidir se o sentido exato é identidade, pertencimento ou adequação à sabedoria.
theological_decisions:
- issue: Força ética da referência à correção corporal
  choice: Traduzir μάστιγες diretamente como “açoites”, mantendo a afirmação sapiencial sobre correção física e disciplina.
  alternative: Atenuar o termo como “repreensões” ou interpretá-lo metaforicamente.
  rationale: O grego emprega um termo físico explícito. A tradução não deve suavizar essa imagem por razões éticas modernas nem ampliar o provérbio além do que ele declara.
- issue: Relação sintática de σοφίας com “açoites e disciplina”
  choice: Manter a expressão concisa “são sabedoria”, com nota sobre a elipse.
  alternative: Explicitar como “pertencem à sabedoria” ou “são próprios da sabedoria”.
  rationale: A construção grega é comprimida e admite mais de uma explicitação. A redação escolhida conserva a tensão sem impor uma única análise.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Fora de hora” e “em todo tempo” preservam o contraste temporal do grego; “açoites” evita suavizar o sentido físico.
