  text: Before bloodshed come the furnace’s vapor and smoke[b][a]; so before bloodshed comes abuse.
translation:
  language: pt
  text: Antes do fogo vêm o vapor da fornalha e a fumaça; assim, antes do derramamento de sangue[b] vem a agressão verbal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “insulto”, “injúria” ou “linguagem ofensiva”.
    reason: lexical_alternative
  - marker: b
    text: O grego diz literalmente “sangues”, expressão idiomática que pode indicar derramamento de sangue ou atos violentos.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ
  choice: antes de
  rationale: Nas duas ocorrências, a preposição indica precedência temporal e estrutura a comparação proverbial.
- source_word: πυρὸς
  choice: fogo
  rationale: Equivalente direto no contexto; representa aquilo que é precedido pelo vapor e pela fumaça.
- source_word: ἀτμὶς
  choice: vapor
  rationale: O termo designa vapor ou exalação; “vapor” preserva a imagem e se associa naturalmente à fumaça.
- source_word: καμίνου
  choice: da fornalha
  rationale: O genitivo indica a origem do vapor. “Fornalha” comunica melhor que “forno” a intensidade de καμίνος.
- source_word: καπνός
  choice: fumaça
  rationale: Equivalente corrente e preciso para o sinal visível que antecede o fogo.
- source_word: οὕτως
  choice: assim
  rationale: Introduz de modo conciso a correspondência entre a imagem física e a advertência moral.
- source_word: αἱμάτων
  choice: derramamento de sangue
  rationale: O plural grego, literalmente “sangues”, funciona idiomaticamente para mortes violentas ou atos de violência sangrenta.
- source_word: λοιδορία
  choice: agressão verbal
  rationale: Designa fala insultuosa, injuriosa ou ultrajante. “Agressão verbal” é atual, clara e mantém o contraste entre palavras hostis e violência física.
theological_decisions:
- issue: Progressão moral da fala hostil para a violência
  choice: O provérbio afirma que a agressão verbal precede o derramamento de sangue.
  alternative: A injúria causa inevitavelmente homicídio, ou apenas acompanha a violência.
  rationale: 'A repetição de πρὸ favorece uma relação de precedência: assim como vapor e fumaça antecedem o fogo, a fala ofensiva antecede a violência sangrenta. A formulação preserva a força de advertência sem transformar o dito em uma afirmação determinista de causalidade.'
translation_notes:
  register: Português moderno, claro e digno, com sintaxe proverbial concisa. O paralelismo e a repetição de “antes” foram preservados; “vem/vêm” foi ajustado ao número dos sujeitos em português.
