  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A coordenação final usa «ou» para apresentar os itens como exceções distintas; «ainda há reconciliação» expressa a possibilidade de restauração sem prometer que ela necessariamente ocorrerá.
