base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/022.yaml
  text: If you open your mouth against a friend[a], do not be afraid, for there can be reconciliation—except in the case of insult and arrogance and the revealing of a secret and a treacherous blow; in these things every friend will flee.
translation:
  language: pt
  text: Se você abrir a boca contra um amigo, não tenha medo, pois ainda há reconciliação — exceto em caso de insulto, arrogância, revelação de um segredo e golpe traiçoeiro; em tais casos, todo amigo fugirá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ φίλον
  choice: contra um amigo
  rationale: Com a expressão ἀνοίξῃς στόμα, ἐπί + acusativo pode indicar fala dirigida contra alguém. A referência posterior à reconciliação após uma ofensa favorece esse sentido.
- source_word: ἀνοίξῃς στόμα
  choice: abrir a boca
  rationale: A expressão concreta é natural em português e conserva o caráter idiomático do grego, indicando que se falou ofensivamente contra o amigo.
- source_word: μὴ εὐλαβηθῇς
  choice: não tenha medo
  rationale: O verbo pode significar temer, recear ou agir com cautela. A cláusula seguinte encoraja a não considerar perdida a amizade, mas a tradução mantém o valor lexical direto sem eliminar a amplitude contextual.
- source_word: διαλλαγή
  choice: reconciliação
  rationale: O substantivo designa o restabelecimento das relações depois de um conflito ou afastamento.
- source_word: πλὴν
  choice: exceto em caso de
  rationale: Introduz as ofensas que constituem exceções à possibilidade de reconciliação mencionada antes.
- source_word: ὀνειδισμοῦ
  choice: insulto
  rationale: Expressa afronta verbal ou desonra e é claro no português contemporâneo.
- source_word: ὑπερηφανίας
  choice: arrogância
  rationale: Comunica orgulho altivo e ofensivo nas relações pessoais.
- source_word: μυστηρίου ἀποκαλύψεως
  choice: revelação de um segredo
  rationale: Neste contexto de amizade, μυστήριον é uma informação confidencial, não necessariamente um mistério religioso.
- source_word: πληγῆς δολίας
  choice: golpe traiçoeiro
  rationale: Preserva tanto a ideia de ferimento ou golpe quanto a de dolo e traição, sem decidir se a expressão é literal ou figurada.
- source_word: ἐν τούτοις
  choice: por causa dessas coisas
  rationale: No contexto, indica que essas ofensas levam o amigo a se afastar; a formulação portuguesa explicita naturalmente essa relação.
- source_word: ἀποφεύξεται πᾶς φίλος
  choice: todo amigo fugirá
  rationale: Mantém a força de afastamento completo do verbo e o sentido distributivo de πᾶς φίλος.
