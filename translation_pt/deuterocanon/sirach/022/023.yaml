base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/023.yaml
  text: Gain faith with your neighbor in poverty[a], so that in his good things you may be filled together. In a time of distress remain with him[b], so that you may inherit along with him in his inheritance.
translation:
  language: pt
  text: Na pobreza, conquista a confiança de teu próximo[a], para que, em seus bens[b], sejas saciado com ele. Em tempo de aflição, permanece com ele, para que herdes com ele sua herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «na sua pobreza». O grego não especifica de quem é a pobreza.
    reason: ambiguity
  - marker: b
    text: Ou «nas coisas boas dele» ou «na prosperidade dele».
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν κτῆσαι
  choice: Conquista a confiança
  rationale: Neste contexto interpessoal de amizade e lealdade, πίστις designa mais naturalmente confiança do que fé em sentido abstrato. “Conquista” expressa κτῆσαι de modo corrente, sem perder a ideia de adquirir ou obter.
- source_word: ἐν πτωχείᾳ
  choice: na pobreza
  rationale: Mantém o sentido direto de πτωχεία e conserva a ausência de pronome possessivo no grego, que não explicita de quem é a pobreza.
- source_word: μετὰ τοῦ πλησίον
  choice: junto ao teu próximo
  rationale: “Próximo” é o equivalente tradicional e claro de πλησίον; “junto a” comunica a esfera relacional indicada por μετά sem sugerir apenas que se deve conquistar a confiança que pertence ao próximo.
- source_word: ἐν τοῖς ἀγαθοῖς αὐτοῦ
  choice: nos bens dele
  rationale: ἀγαθά pode designar coisas boas, recursos ou prosperidade. “Bens” é conciso e adequado ao contraste com pobreza, embora a amplitude semântica seja registrada em nota.
- source_word: ὁμοῦ πλησθῇς
  choice: sejas saciado junto com ele
  rationale: Preserva tanto a imagem de plenitude de πληρόω quanto o sentido conjunto de ὁμοῦ, em português natural.
- source_word: ἐν καιρῷ θλίψεως
  choice: No tempo da aflição
  rationale: Tradução direta e digna de θλῖψις, que pode indicar aflição, angústia ou adversidade.
- source_word: διάμενε αὐτῷ
  choice: permanece ao lado dele
  rationale: Expressa a continuidade e a lealdade prática de διαμένω neste contexto; “ao lado dele” torna clara a presença solidária.
- source_word: συνκληρονομήσῃς
  choice: herdes com ele
  rationale: Reproduz a ideia do verbo composto, isto é, receber uma herança conjuntamente, sem recorrer ao termo potencialmente técnico “coerdeiro”.
- source_word: ἐν τῇ κληρονομίᾳ αὐτοῦ
  choice: a herança dele
  rationale: “Herança” é o equivalente direto e amplamente compreensível de κληρονομία; em português, o objeto direto resulta mais natural depois de “herdar”.
theological_decisions:
- issue: Sentido de πίστις em um contexto interpessoal de sabedoria
  choice: confiança
  alternative: fé; fidelidade
  rationale: A relação com o próximo, a pobreza e a permanência na aflição favorecem o sentido relacional de confiança ou fidelidade. “Confiança” é natural em português e evita impor ao texto o sentido teológico abstrato de “fé”, sem negar a possível nuance de lealdade.
- issue: Possível conotação técnica de συνκληρονομήσῃς
  choice: herdes com ele
  alternative: sejas coerdeiro com ele
  rationale: A formulação escolhida conserva a herança compartilhada indicada pelo grego, mas evita importar automaticamente conotações teológicas posteriores associadas a “coerdeiro”.
translation_notes:
  register: 'Português moderno, claro e digno, com formas de segunda pessoa singular coerentes com o tom sapiencial. A tradução busca equivalência ótima: mantém as imagens de pobreza, saciedade, aflição e herança, mas evita construções excessivamente literais ou artificiais.'
