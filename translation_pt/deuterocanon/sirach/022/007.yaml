  text: Teaching a fool is like gluing a potsherd[a], like waking one from a deep sleep.
translation:
  language: pt
  text: Ensinar um insensato é como colar um caco de cerâmica[a], como despertar alguém de um sono profundo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Quem ensina um insensato está colando um caco de cerâmica, despertando alguém de um sono profundo”. O grego emprega particípios em paralelo, sem dizer expressamente “é como”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκολλῶν
  choice: colar
  rationale: O particípio indica unir ou colar. “Colar” conserva a imagem concreta de uma tentativa de reparo aparentemente inútil.
- source_word: ὄστρακον
  choice: um caco de barro
  rationale: O substantivo singular pode designar um fragmento de cerâmica. “Caco de barro” é claro, natural e mantém o singular do grego.
- source_word: ὁ διδάσκων
  choice: ensinar
  rationale: O particípio substantivado significa literalmente “aquele que ensina”. O infinitivo comunica com naturalidade a força proverbial genérica.
- source_word: μωρόν
  choice: um insensato
  rationale: Na literatura sapiencial, μωρός caracteriza quem carece de juízo no sentido intelectual e moral. “Insensato” preserva essa amplitude sem reduzir a expressão a uma deficiência intelectual.
- source_word: ἐξεγείρων
  choice: despertar
  rationale: O verbo significa acordar ou fazer levantar do sono. “Despertar” oferece clareza e mantém o registro proverbial.
- source_word: καθεύδοντα
  choice: alguém
  rationale: O particípio significa literalmente “alguém que dorme”. Em português, a condição de quem dorme já fica clara pela construção “despertar alguém de um sono”.
- source_word: ἐκ βαθέος ὕπνου
  choice: de um sono profundo
  rationale: Tradução direta e idiomática da expressão que denota sono intenso.
