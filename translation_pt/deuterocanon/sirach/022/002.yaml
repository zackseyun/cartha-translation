  text: A lazy man is compared to a lump of dung[a]; everyone who picks it up will shake off his hand.
translation:
  language: pt
  text: O preguiçoso é comparado a um bolo de esterco[a]; quem o pegar sacudirá a mão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “foi juntado a um bolo de esterco”, se συνεβλήθη for entendido em sentido físico, e não comparativo; o sentido comparativo se ajusta melhor ao provérbio neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: βολβίτῳ κοπρίων
  choice: a um bolo de esterco
  rationale: A expressão designa uma massa arredondada de excremento. “Bolo de esterco” preserva a imagem concreta e aviltante do provérbio em português natural.
- source_word: συνεβλήθη
  choice: é comparado a
  rationale: Neste dito sapiencial, o passivo de συμβάλλω é mais bem entendido no sentido de comparar ou assemelhar; a nota registra a possível leitura física.
- source_word: ὀκνηρός
  choice: O preguiçoso
  rationale: Traduz de modo direto e corrente o adjetivo substantivado masculino singular, sem recorrer ao mais literário “indolente”.
- source_word: πᾶς ὁ ἀναιρούμενος αὐτόν
  choice: quem o pega
  rationale: ἀναιρέω tem aqui o sentido concreto de levantar ou pegar. O pronome retoma a imagem do bolo de esterco.
- source_word: ἐκτινάξει χεῖρα
  choice: sacode a mão
  rationale: Mantém a mão no singular e comunica o gesto instintivo de sacudi-la depois do contato com algo repulsivo.
