translation_notes:
  register: Português moderno, claro e digno, com imagem proverbial deliberadamente forte. “Preguiçoso” oferece ampla compreensão internacional e boa legibilidade brasileira; “esterco” conserva a contundência sem soar desnecessariamente vulgar.
