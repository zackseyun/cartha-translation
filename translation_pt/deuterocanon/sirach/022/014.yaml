translation:
  language: pt
  text: O que é mais pesado que o chumbo? E que nome tem alguém assim, senão “tolo”?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “O que se tornará mais pesado que o chumbo? E que nome há para ele/isso, senão ‘tolo’?” O grego apresenta um provérbio condensado; a tradução torna explícita a referência pessoal sugerida por “tolo”, enquanto a forma grega permanece concisa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ μόλυβον
  choice: mais pesado que o chumbo
  rationale: A construção comparativa é expressa naturalmente em português por “mais pesado que”; μόλυβος designa diretamente o metal chumbo.
- source_word: τί βαρυνθήσεται
  choice: O que é mais pesado
  rationale: Embora a forma grega seja futuro passivo/médio, aqui ela funciona proverbial e idiomaticamente como pergunta comparativa. O presente mantém a força geral da máxima.
- source_word: τί αὐτῷ ὄνομα
  choice: que nome se pode dar a alguém assim
  rationale: A formulação torna natural o dativo αὐτῷ e explicita com cautela a referência pessoal sugerida por μωρός, sem perder o caráter conciso da pergunta retórica.
- source_word: ἀλλʼ ἢ
  choice: senão
  rationale: Na pergunta retórica, a locução introduz a única resposta possível; “senão” reproduz essa função de modo idiomático.
- source_word: μωρός
  choice: tolo
  rationale: “Tolo” é a equivalência tradicional e adequada à literatura sapiencial, preservando a dimensão moral do termo sem recorrer a linguagem clínica ou excessivamente ofensiva.
