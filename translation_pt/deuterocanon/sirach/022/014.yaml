translation_notes:
  register: Português moderno, claro e digno, com cadência proverbial. A expressão “alguém assim” favorece a leitura pessoal indicada por “tolo”, enquanto a nota preserva a ambiguidade gramatical de αὐτῷ e a forma verbal grega.
