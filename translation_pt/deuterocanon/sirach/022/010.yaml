  yaml_path: translation/deuterocanon/sirach/022/010.yaml
  text: Weep more sweetly over the dead[a], because he has found rest,
translation:
  language: pt
  text: Chore mais suavemente por quem morreu[a], pois encontrou descanso,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Chore mais docemente por quem morreu”. O advérbio grego pode significar literalmente “mais agradavelmente” ou “mais docemente”; neste contexto, provavelmente indica um pranto mais brando ou moderado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδιον
  choice: com mais serenidade
  rationale: O comparativo de ἡδύς significa literalmente “mais agradavelmente” ou “mais suavemente”. No contexto do luto, “com mais serenidade” comunica um pranto mais brando ou moderado sem sugerir que a morte seja prazerosa.
- source_word: κλαῦσον
  choice: chore
  rationale: Imperativo aoristo de κλαίω; “chore” é a equivalência portuguesa direta e natural.
- source_word: ἐπὶ νεκρῷ
  choice: por quem morreu
  rationale: ἐπί com o dativo indica aqui a pessoa que é objeto do pranto. A formulação é natural, preserva o singular conceitual e evita restringir o referente a um homem.
- source_word: ὅτι
  choice: pois
  rationale: Introduz a razão do imperativo; “pois” conserva com naturalidade a relação causal.
- source_word: ἀνεπαύσατο
  choice: encontrou descanso
  rationale: O médio de ἀναπαύω expressa entrar em repouso ou descansar. A tradução mantém a imagem do descanso sem acrescentar a ideia específica de sepultamento.
theological_decisions:
- issue: A morte apresentada como descanso
  choice: encontrou descanso
  alternative: foi sepultada; adormeceu
  rationale: O texto emprega a linguagem sapiencial do descanso, mas não desenvolve uma doutrina precisa sobre o estado após a morte. A tradução conserva a imagem e sua tensão sem explicá-la além do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Quem morreu” evita o substantivo potencialmente impessoal “o morto”; “essa pessoa” torna explícito o sujeito singular implícito no verbo grego sem marcar gênero. A vírgula final foi mantida porque o trecho fornecido parece continuar no versículo seguinte.
