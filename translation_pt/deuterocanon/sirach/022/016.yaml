base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/016.yaml
  text: A wooden binding fastened into a building will not be loosened in an earthquake[c][b][a]; so a heart made firm by deliberate counsel will not lose courage in time of trouble.
translation:
  language: pt
  text: Uma amarração de madeira, fixada numa construção, não se soltará num terremoto[a]; assim também, o coração firmado em conselho ponderado[b] não perderá a coragem no momento crítico[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não se desfará” ou “não se desmanchará”. O verbo grego pode indicar que algo se solta, se separa ou se desfaz.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega é condensada e também pode ser entendida como “num propósito refletido”, “numa deliberação ponderada” ou “num plano bem pensado”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “no tempo” ou “no momento”; pelo contexto, trata-se provavelmente de um momento de prova ou crise.
    reason: source_ambiguity
lexical_decisions:
- source_word: ἱμάντωσις ξυλίνη
  choice: amarração de madeira
  rationale: Preserva a imagem de algo feito de madeira que serve de amarração ou elemento de ligação estrutural, sem especificar uma forma arquitetônica que o grego não explicita.
- source_word: ἐνδεδεμένη εἰς οἰκοδομήν
  choice: fixada numa construção
  rationale: O particípio perfeito indica algo já preso ou firmemente incorporado; a formulação portuguesa mantém tanto o estado resultante quanto a imagem construtiva.
- source_word: ἐν συσσεισμῷ
  choice: durante um terremoto
  rationale: O substantivo denota forte abalo; neste contexto estrutural, “terremoto” comunica com clareza a força sísmica da comparação.
- source_word: οὐ διαλυθήσεται
  choice: não se soltará
  rationale: No contexto de uma amarração, o verbo sugere desfazer-se, separar-se ou vir a soltar-se. A escolha conserva a coerência concreta da metáfora.
- source_word: καρδία
  choice: coração
  rationale: Mantém o termo antropológico bíblico, que abrange pensamento, vontade e disposição interior, sem reduzi-lo apenas à mente ou às emoções.
- source_word: ἐστηριγμένη
  choice: firmado
  rationale: Expressa uma condição estável resultante e retoma naturalmente a imagem de firmeza estrutural da primeira metade do versículo.
- source_word: ἐπὶ διανοήματος βουλῆς
  choice: numa decisão ponderada
  rationale: A expressão grega é condensada e reúne as ideias de reflexão, intenção, deliberação e conselho. “Decisão ponderada” produz português natural sem eliminar essa amplitude, registrada em nota.
- source_word: ἐν καιρῷ
  choice: no momento crítico
  rationale: καιρός indica um tempo ou momento determinado e significativo. O abalo figurado e a referência à coragem favorecem “momento crítico”, enquanto a nota preserva a formulação mais literal.
- source_word: οὐ δειλιάσει
  choice: não perderá a coragem
  rationale: O verbo descreve tornar-se tímido, medroso ou pusilânime. A expressão escolhida comunica de modo natural a ideia de não sucumbir ao medo.
theological_decisions:
- issue: Sentido antropológico de καρδία
  choice: coração
  alternative: mente; íntimo
  rationale: “Coração” preserva a linguagem bíblica e sua dimensão intelectual, volitiva e moral, apropriada à firmeza e à coragem descritas no versículo.
- issue: Natureza da estabilidade interior em ἐπὶ διανοήματος βουλῆς
  choice: numa decisão ponderada
  alternative: num propósito refletido; num conselho prudente
  rationale: A tradução não identifica o conselho com uma doutrina ou fonte específica; mantém a afirmação sapiencial geral de que a deliberação refletida dá firmeza interior.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A metáfora construtiva foi mantida, e as ambiguidades de διανοήματος βουλῆς e ἐν καιρῷ foram explicitadas em notas, sem impor uma leitura denominacional.
