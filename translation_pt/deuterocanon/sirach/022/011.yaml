  text: But for a fool[a], an evil life is worse than death.
translation:
  language: pt
  text: Mas, para o insensato, uma vida má é pior do que a morte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μωροῦ
  choice: o insensato
  rationale: μωρός designa uma pessoa tola, sem bom senso. “O insensato” é natural no registro da literatura sapiencial e evita que “tolo” soe apenas como insulto casual.
- source_word: ὑπὲρ θάνατον
  choice: é pior do que a morte
  rationale: Nesta construção comparativa e aforística, ὑπέρ comunica superioridade em grau; com ζωὴ πονηρά, o sentido natural é que tal vida é mais penosa ou ruim que a própria morte.
- source_word: ζωὴ πονηρά
  choice: uma vida má
  rationale: A expressão preserva a amplitude de πονηρά, que pode indicar tanto maldade moral quanto uma condição ruim ou penosa, sem restringir o texto a “vida miserável” nem tornar a formulação artificial.
- source_word: τοῦ δὲ
  choice: Mas, para
  rationale: δὲ introduz contraste leve com o contexto anterior, enquanto o genitivo τοῦ μωροῦ é expresso naturalmente em português por “para o insensato”.
theological_decisions:
- issue: Amplitude semântica de πονηρά no contexto sapiencial
  choice: “má”, mantendo abertas as dimensões moral e penosa
  alternative: “miserável” ou “perversa”
  rationale: “Miserável” reduziria o sentido ao sofrimento, e “perversa” o limitaria à culpa moral. “Má” conserva a tensão presente no grego.
translation_notes:
  register: Português moderno, claro e digno, com formulação proverbial concisa. “Insensato” mantém o tom sapiencial e “vida má” preserva deliberadamente a ambiguidade do original.
