base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/009.yaml
  text: Weep over the dead[a], for the light has failed; and weep over the fool[b], for understanding has failed.
translation:
  language: pt
  text: Chore pelo morto[a], pois a luz se apagou; chore pelo insensato[b], pois o entendimento se apagou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por quem morreu”. O grego apresenta uma pessoa morta como objeto do lamento e conserva a imagem da luz, em vez de dizer diretamente “vida”.'
    reason: lexical_alternative
  - marker: b
    text: 'O dito é proverbial: lamenta-se o insensato porque o entendimento se apagou; o texto não afirma explicitamente que ele esteja fisicamente morto.'
    reason: cultural_note
lexical_decisions:
- source_word: κλαῦσον
  choice: chore
  rationale: O imperativo de κλαίω expressa choro de lamento. “Chore” é direto, natural e preserva a força emotiva.
- source_word: νεκρῷ
  choice: quem morreu
  rationale: O dativo singular com ἐπί indica a pessoa morta como objeto do lamento. A formulação é clara e mantém o valor geral do dito.
- source_word: ἐξέλιπεν
  choice: se apagou / faltou
  rationale: ἐκλείπω pode significar cessar, faltar ou chegar ao fim. Em português, variar a formulação evita a expressão pouco natural “a luz faltou”, sem eliminar o paralelismo conceitual.
- source_word: φῶς
  choice: a luz
  rationale: Mantém a imagem explícita do grego, sem substituí-la interpretativamente por “vida”.
- source_word: μωρῷ
  choice: o insensato
  rationale: Em literatura sapiencial, μωρός caracteriza deficiência moral e de discernimento, não apenas pouca inteligência. “Insensato” conserva essa categoria com dignidade e clareza em português moderno.
- source_word: σύνεσιν
  choice: o entendimento
  rationale: σύνεσις designa entendimento, discernimento ou compreensão. “Entendimento” é a equivalência mais direta neste contexto sapiencial.
theological_decisions:
- issue: Força metafórica de φῶς em relação à morte
  choice: Conservar a metáfora “a luz se apagou”.
  alternative: “a vida se foi” ou “a luz faltou”
  rationale: O grego diz φῶς, não ζωή. A metáfora é preservada, enquanto “se apagou” comunica naturalmente em português a cessação da luz.
- issue: Categoria sapiencial de μωρός
  choice: Traduzir por “o insensato”.
  alternative: “o tolo” ou “a pessoa sem sabedoria”
  rationale: “Insensato” mantém a dimensão moral e intelectual própria da literatura sapiencial, sem suavizar a contundência do provérbio nem sugerir apenas deficiência cognitiva.
- issue: Relação entre o insensato e a cessação do entendimento
  choice: “pois lhe faltou o entendimento”
  alternative: “pois o entendimento cessou”
  rationale: O pronome explicita em português a relação contextual com o insensato, sem afirmar que ele morreu fisicamente. A frase continua proverbial e distingue a falta de entendimento da morte mencionada no primeiro membro.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução preserva o paralelismo e a imagem poética do grego, usando “insensato” como termo sapiencial corrente. A repetição de κλαῦσον foi mantida; a de ἐξέλιπεν foi expressa idiomaticamente por “se apagou” e “faltou”.
