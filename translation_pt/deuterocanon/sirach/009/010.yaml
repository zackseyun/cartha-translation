base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/010.yaml
  text: Do not abandon an old friend, for a new one is not equal to him; a new friend is like new wine—when it grows old, you will drink it with gladness.
translation:
  language: pt
  text: 'Não abandone um velho amigo, pois um novo não se iguala a ele. Amigo novo é como vinho novo: quando envelhecer, você o beberá com alegria.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A linha hebraica fornecida parece pertencer a outro dito e não corresponde a Sirácida 9:10. Por isso, a tradução segue o testemunho grego deste versículo.
    reason: textual_variant
lexical_decisions:
- source_word: Μὴ ἐγκαταλίπης
  choice: Não abandone
  rationale: Expressa com naturalidade a ideia de deixar ou desamparar uma relação já estabelecida.
- source_word: φίλον ἀρχαῖον
  choice: um velho amigo
  rationale: Aqui, ἀρχαῖον indica uma amizade de longa data, não a idade do amigo; a expressão portuguesa também preserva o contraste com “amigo novo”.
- source_word: πρόσφατος
  choice: novo
  rationale: O contraste com ἀρχαῖον e a comparação com vinho novo favorecem esta forma simples e idiomática.
- source_word: οὐκ ἔστιν ἔφισος αὐτῷ
  choice: não se iguala a ele
  rationale: Preserva explicitamente a comparação do grego em português natural.
- source_word: οἶνος νέος φίλος νέος
  choice: Amigo novo é como vinho novo
  rationale: Torna explícita a comparação implícita na formulação proverbial e concisa do grego.
- source_word: ἐὰν παλαιωθῇ
  choice: quando envelhecer
  rationale: Embora a construção seja condicional, no provérbio ela descreve o resultado esperado do amadurecimento do vinho e da amizade.
- source_word: μετ’ εὐφροσύνης πίεσαι αὐτόν
  choice: você o beberá com alegria
  rationale: Mantém o futuro e traduz diretamente a expressão nominal μετ’ εὐφροσύνης, com linguagem acessível.
theological_decisions:
- issue: Alinhamento da fonte primária deste versículo
  choice: Traduzir o paralelo grego correspondente a Sirácida 9:10
  alternative: Traduzir a linha hebraica fornecida como se fosse Sirácida 9:10
  rationale: A linha hebraica fornecida trata da beleza de uma mulher e não corresponde ao conteúdo transmitido como Sirácida 9:10. O testemunho grego contém o versículo pertinente; por isso, ele fundamenta a tradução, e a divergência é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Velho amigo” é empregado no sentido idiomático de amigo de longa data; a imagem proverbial do vinho foi preservada.
