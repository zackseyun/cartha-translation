base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/009.yaml
  text: Turn your eyes away from a graceful woman[a], and do not gaze at beauty that is not yours.
translation:
  language: pt
  text: Desvie os olhos de uma mulher encantadora[a] e não contemple a beleza que não lhe pertence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Não se sente de modo algum com a esposa de outro homem, nem beba vinho com ela, para que sua alma não se incline para ela e, em seu espírito, você escorregue para a perdição.” O testemunho hebraico aqui é mais breve e mais geral.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַעֲלִים עַיִן
  choice: Desvie os olhos
  rationale: O hebraico diz literalmente “oculte o olho”, mas funciona aqui como uma exortação idiomática a afastar o olhar. “Desvie os olhos” é natural em português e preserva a força do imperativo.
- source_word: אֵשֶׁת חֵן
  choice: uma mulher encantadora
  rationale: A expressão significa literalmente “mulher de graça/encanto”. “Encantadora” comunica atratividade e charme sem reduzir חֵן à beleza física, mencionada separadamente na oração seguinte.
- source_word: תַּבִּיט
  choice: contemple
  rationale: Neste contexto de advertência, o verbo indica olhar deliberado ou prolongado. “Contemple” expressa mais do que uma olhada casual, sem a conotação excessivamente agressiva de “encare”.
- source_word: יֹפִי
  choice: beleza
  rationale: É a equivalência direta e corrente do substantivo hebraico, mantendo a referência à atração visual.
- source_word: לֹא לָךְ
  choice: que não lhe pertence
  rationale: A construção hebraica é concisa, literalmente “não para/vossa”. A formulação escolhida preserva a relação possessiva e o limite moral implícito, sem restringi-lo explicitamente à esposa de outro homem, como faz o paralelo grego.
theological_decisions:
- issue: Relação entre o texto hebraico breve e o paralelo grego mais desenvolvido
  choice: Seguir o hebraico no texto principal e registrar o paralelo grego em nota
  alternative: Traduzir a expansão grega sobre sentar-se com a esposa de outro homem e beber vinho com ela
  rationale: O testemunho hebraico preservado é mais breve e geral, enquanto o grego apresenta uma advertência ampliada e específica. Como o hebraico está disponível e tem alta confiança, ele governa o texto principal; a nota conserva a importante diferença textual sem fundir as duas formas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Encantadora” distingue o charme de חֵן da “beleza” física mencionada em seguida. O marcador [a] aparece imediatamente após a expressão à qual se refere.
