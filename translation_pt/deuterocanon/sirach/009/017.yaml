  text: Keep far from a man who has power to kill[a], and do not fear the terrors of death.
translation:
  language: pt
  text: Mantenha-se longe de um homem que tem poder para matar[a] e não tema os terrores da morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego traz aqui uma máxima substancialmente diferente: “Que homens justos sejam seus companheiros de mesa, e que seu orgulho esteja no temor do Senhor.” O texto principal segue o hebraico preservado deste versículo.'
    reason: textual_variant
lexical_decisions:
- source_word: רְחַק
  choice: Mantenha-se longe
  rationale: O imperativo de רחק exige afastamento deliberado. A formulação é natural em português e preserva a força da ordem.
- source_word: מֵאִישׁ
  choice: de um homem
  rationale: O hebraico traz o substantivo masculino singular אִישׁ. A tradução mantém essa forma sem a neutralizar.
- source_word: שַׁלִּיט
  choice: que tem poder
  rationale: שַׁלִּיט designa quem possui poder ou autoridade. Ligado a 'matar', o foco recai na capacidade efetiva, não necessariamente em um cargo formal.
- source_word: לַהֲרוֹג
  choice: para matar
  rationale: O infinitivo denota diretamente matar. Esta opção evita acrescentar uma nuance judicial ausente no hebraico.
- source_word: וְאַל תִּפְחַד
  choice: e não tema
  rationale: Tradução direta e idiomática do imperativo negativo.
- source_word: פַּחֲדֵי מַוֶת
  choice: os terrores da morte
  rationale: O plural em construção expressa literalmente terrores ou pavores da morte. 'Os terrores da morte' conserva tanto a intensidade quanto o número do hebraico.
theological_decisions:
- issue: Grande divergência entre os testemunhos hebraico e grego
  choice: Seguir no texto principal o hebraico preservado e registrar em nota a leitura grega substancialmente diferente.
  alternative: 'Grego: “Que homens justos sejam seus companheiros de mesa, e que seu orgulho esteja no temor do Senhor.”'
  rationale: Como há testemunho hebraico existente para este versículo, ele serve de base ao texto principal. A divergência grega não é harmonizada nem omitida, mas apresentada com transparência em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção reflexiva “Mantenha-se longe” transmite uma advertência deliberada; “não tema” conserva o tom conciso da instrução sapiencial.
