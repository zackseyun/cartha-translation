base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/007.yaml
  text: Do not gaze at a virgin[b][a], lest you be ensnared by the penalties concerning her.
translation:
  language: pt
  text: Não fixe o olhar numa virgem, para que não fique enredado nas penalidades ligadas a ela.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que não incorra nas penalidades relacionadas a ela”. A expressão hebraica é condensada e pode referir-se às consequências associadas ao envolvimento com ela.'
    reason: lexical_alternative
  - marker: b
    text: 'O grego traz: “Não olhe ao redor pelas ruas de uma cidade e não vagueie por seus lugares desertos.” As testemunhas hebraica e grega diferem substancialmente neste ponto.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּבְתוּלָה
  choice: numa virgem
  rationale: בְּתוּלָה designa normalmente uma virgem ou jovem solteira. “Virgem” preserva a especificidade lexical, e a preposição בְּ é vertida naturalmente com a construção portuguesa “fixar o olhar em”.
- source_word: אַל תִּתְבּוֹנֵן
  choice: Não fixe o olhar
  rationale: A forma hitpael expressa observação atenta ou prolongada, não um olhar casual. “Fixe o olhar” comunica de modo natural a atenção insistente advertida pelo texto.
- source_word: פֶּן
  choice: para que ... não
  rationale: A partícula introduz uma consequência possível que fundamenta a advertência. A formulação preserva essa força preventiva em português corrente e digno.
- source_word: תִּוָּקֵש
  choice: seja apanhado
  rationale: O verbo passivo pode comunicar ser preso ou cair numa armadilha. “Seja apanhado” mantém a ideia de captura sem especificar além do que o contexto permite.
- source_word: בַּעֲנָשֶׁיהָ
  choice: nas penalidades ligadas a ela
  rationale: עֹנֶשׁ significa punição ou penalidade, com sufixo feminino singular. A relação exata é condensada no hebraico; “ligadas a ela” preserva a possibilidade de consequências decorrentes do envolvimento com ela, sem afirmar que somente ela é punida.
- source_word: μὴ περιβλέπου ἐν ῥύμαις πόλεως, καὶ ἐν ταῖς ἐρήμοις αὐτῆς μὴ πλανῶ
  choice: registrado em nota como leitura grega divergente
  rationale: O grego traz uma advertência sobre olhar pelas ruas da cidade e vaguear por seus lugares desertos. Como o hebraico sobrevivente é de alta confiança, ele rege o texto principal, enquanto a divergência substancial é preservada em nota.
theological_decisions:
- issue: Divergência entre as testemunhas hebraica e grega
  choice: Traduzir o hebraico no texto principal e registrar a leitura grega em nota.
  alternative: Traduzir a advertência grega sobre as ruas da cidade ou combinar ambas as leituras.
  rationale: O testemunho hebraico sobrevivente é de alta confiança e deve reger a tradução de Sirácida onde está disponível. As leituras são substancialmente diferentes e não devem ser harmonizadas silenciosamente.
- issue: Sentido das penalidades associadas à mulher
  choice: Manter a relação aberta com “penalidades ligadas a ela”.
  alternative: Explicitar que ela própria é punida ou que o homem sofre determinada punição por se envolver com ela.
  rationale: A expressão hebraica é comprimida e não define com precisão quem recebe as penalidades nem sua natureza. A tradução evita resolver essa ambiguidade.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O imperativo é direto e digno; “fixe o olhar” evita arcaísmo sem reduzir a ideia de observação prolongada. Os marcadores seguem a ordem de ocorrência no texto.
