  text: Keep far away from a man who has authority to kill, and you will not have to fear death.[a]
translation:
  language: pt
  text: Mantenha-se bem longe de um homem que tem autoridade para matar, e você não terá de temer a morte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A testemunha hebraica preservada para este versículo traz outro dito: “Não abandone um velho amigo, pois um novo não se comparará a ele.” A tradição grega, porém, traz a advertência traduzida no texto principal.'
    reason: alternative_reading
lexical_decisions:
- source_word: μακρὰν ἄπεχε
  choice: Mantenha-se bem longe
  rationale: O imperativo grego exige distanciamento deliberado; esta formulação é natural em português e conserva a força da ordem.
- source_word: ἀπὸ ἀνθρώπου
  choice: de um homem
  rationale: Traduz de modo direto o singular grego e retrata um indivíduo concreto.
- source_word: ὃς ἔχει ἐξουσίαν
  choice: que tem autoridade
  rationale: ἐξουσία indica poder ou autoridade para agir; “autoridade” comunica adequadamente uma capacidade reconhecida de tirar a vida.
- source_word: τοῦ φονεῦσαι
  choice: para matar
  rationale: Mantém o sentido amplo do infinitivo, sem especificar indevidamente assassinato ilícito ou execução formal.
- source_word: καὶ οὐ μὴ ὑποπτεύσῃς φόβον θανάτου
  choice: e você não terá de temer a morte
  rationale: Expressa em português natural a forte negação grega e a ideia contextual de não viver apreensivo diante da morte.
theological_decisions:
- issue: Texto-base diante da grande divergência entre a testemunha hebraica preservada e a tradição grega
  choice: Traduzir no texto principal o dito preservado em grego e registrar em nota o dito hebraico diferente.
  alternative: 'Traduzir no texto principal: “Não abandone um velho amigo, pois um novo não se comparará a ele.”'
  rationale: As duas tradições preservam ditos substancialmente diferentes. Seguir o grego no texto principal mantém a numeração e a tradição refletidas pelo paralelo fornecido, enquanto a nota expõe com transparência a leitura hebraica preservada, sem harmonizá-las artificialmente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Mantenha-se bem longe” conserva a ênfase do grego; “você” torna a advertência direta e natural sem perder solenidade.
