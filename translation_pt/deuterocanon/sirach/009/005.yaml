translation:
  language: pt
  text: Não se degrade pelo que seus olhos veem, nem fique arrasado por ir atrás da casa dela.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico «atrás da casa dela» é difícil. Pode indicar ir atrás da casa ou família dela, segui-la até sua casa ou acabar arruinado por se envolver com seu ambiente doméstico.
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego diz: «Não examine atentamente uma virgem, para que você não tropece nas censuras ou penalidades relacionadas a ela.» O hebraico e o grego diferem substancialmente neste versículo.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְהִתְנַבֵּל
  choice: se degrade
  rationale: 'O hitpael de נבל tem força reflexiva: tornar-se vil, desprezar-se ou degradar-se. “Se degrade” preserva tanto essa forma reflexiva quanto o teor moral da advertência.'
- source_word: בְּמַרְאֵה עֵינֵיךָ
  choice: com o que seus olhos veem
  rationale: A expressão significa literalmente algo como “com/pela visão de seus olhos”. A formulação escolhida é natural em português e mantém a ideia de sedução pelo olhar sem especificar além do hebraico.
- source_word: וּלְשׁוֹמֵם
  choice: fique arrasado
  rationale: שמם pode expressar devastação, ruína, desolação ou espanto. “Fique arrasado” conserva a intensidade e funciona de modo natural para uma pessoa, sem decidir se a consequência é sobretudo emocional, social ou material.
- source_word: אֲחַר בֵּיתָהּ
  choice: por ir atrás da casa dela
  rationale: O hebraico diz de forma lacônica “atrás da casa dela”. A tradução retém a imagem de seguir ou perseguir, mas a construção continua difícil e recebe nota explicativa.
theological_decisions:
- issue: Prioridade do hebraico diante do paralelo grego divergente
  choice: Traduzir o hebraico preservado no texto principal e registrar o grego em nota.
  alternative: 'Seguir o grego: “Não examine atentamente uma virgem, para que você não tropece nas censuras/penalidades relacionadas a ela.”'
  rationale: O testemunho hebraico extante é a fonte principal, mas o grego apresenta uma advertência substancialmente diferente. A nota expõe a divergência em vez de harmonizá-la ou ocultá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação mantém a concisão proverbial e sinaliza, sem resolver artificialmente, a dificuldade do segundo membro e a divergência textual grega.
