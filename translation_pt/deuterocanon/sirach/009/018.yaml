translation:
  language: pt
  text: Pela mão de artesãos, uma obra será elogiada; e o governante de um povo é sábio em seu falar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico existente nos manuscritos da Genizá do Cairo traz uma frase substancialmente diferente: “E, se você se aproximar, não incorrerá em culpa, para não perder a vida.” As testemunhas hebraica e grega divergem acentuadamente neste ponto.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν χειρὶ τεχνιτῶν
  choice: Pela mão de artesãos
  rationale: A locução expressa agência. Em português, “pela mão de” conserva a imagem grega de modo natural, enquanto “artesãos” comunica trabalhadores habilidosos sem restringir o tipo de ofício.
- source_word: ἔργον
  choice: uma obra
  rationale: No contexto, designa o produto do trabalho artesanal, e “obra” mantém esse sentido concreto sem especificar indevidamente o objeto.
- source_word: ἐπαινεθήσεται
  choice: será elogiada
  rationale: Reproduz o futuro passivo grego e preserva a formulação proverbial.
- source_word: ὁ ἡγούμενος λαοῦ
  choice: o governante de um povo
  rationale: “Governante” expressa liderança pública ou política; “de um povo” mantém o caráter geral do genitivo grego sem artigo.
- source_word: σοφὸς ἐν λόγῳ αὐτοῦ
  choice: é sábio em seu falar
  rationale: Mantém o predicativo “sábio” e verte λόγος como a maneira ou conteúdo de falar. “Em seu falar” é corrente, digno e menos ambíguo que “em sua palavra” neste contexto.
theological_decisions:
- issue: Divergência substancial entre as testemunhas hebraica e grega de Sirácida 9:18
  choice: Adotar a linha grega no texto principal e registrar a leitura hebraica existente em nota.
  alternative: “E, se você se aproximar, não incorra em culpa, para que ele não tire a sua vida.”
  rationale: As testemunhas não apresentam uma simples variante verbal, mas ditos inteiramente diferentes. Seguindo a decisão textual documentada para este versículo, a leitura grega constitui o texto principal, enquanto a leitura hebraica da Genizá do Cairo é preservada explicitamente para não ocultar a incerteza da transmissão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O paralelismo proverbial foi mantido com léxico digno e acessível; o ponto e vírgula evidencia as duas orações coordenadas.
