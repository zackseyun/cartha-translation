  text: Do not envy a wicked man[a], for you do not know what his day will be.
translation:
  language: pt
  text: Não tenha inveja de um homem perverso[a], pois você não sabe como será o dia dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego traz aqui uma máxima diferente: “Na medida das suas forças, considere os seus próximos e aconselhe-se com os sábios.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: Não tenha inveja
  rationale: A proibição com קנא expressa naturalmente inveja de outra pessoa; a formulação é clara, corrente e adequada ao tom sapiencial.
- source_word: בְּאִישׁ רָשָׁע
  choice: de um homem perverso
  rationale: איש é masculino singular, e רשע caracteriza alguém moralmente mau; “perverso” mantém o peso moral sem restringir o sentido à culpa jurídica.
- source_word: כִּי לֹא תֵּדֵע
  choice: pois você não sabe
  rationale: כִּי introduz a razão da advertência; “pois” conserva o tom proverbial e permanece natural em português moderno.
- source_word: מַה יּוֹמוֹ
  choice: como será o dia dele
  rationale: O hebraico diz literalmente “o que [será] o dia dele”. “Como será o dia dele” preserva a imagem e a indeterminação da frase sem acrescentar a ideia não explícita de que o dia “trará” algo.
theological_decisions:
- issue: Divergência entre os testemunhos hebraico e grego
  choice: Traduzir como texto principal o hebraico preservado e registrar em nota a leitura grega substancialmente diferente.
  alternative: “Na medida das suas forças, procure conhecer os seus próximos e aconselhe-se com os sábios.”
  rationale: Onde o hebraico de Sirácida sobrevive, ele serve como testemunho primário. O grego contém aqui outra máxima, e não uma simples variante verbal; a nota preserva essa diferença sem harmonizá-la.
- issue: Ambiguidade de מַה יּוֹמוֹ
  choice: “como será o dia dele”
  alternative: “o que o dia dele trará” ou “qual será o fim dele”
  rationale: A escolha mantém a formulação aberta do hebraico e evita definir “dia” como destino final, morte ou juízo, sentidos possíveis mas não expressos de modo inequívoco.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” por naturalidade internacional com forte legibilidade no Brasil; mantém o singular masculino explícito do hebraico e a concisão proverbial.
