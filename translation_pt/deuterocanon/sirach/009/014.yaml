translation:
  language: pt
  text: Vinho novo, amigo novo; quando envelhecer, talvez então você o beba.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico deste versículo tem forma proverbial, mas sua cláusula final é textualmente difícil. O texto grego paralelo apresenta uma leitura muito diferente: “Reconhece que passas em meio a armadilhas e que caminhas sobre as muralhas das cidades”. Aqui se segue o testemunho hebraico preservado.'
    reason: textual_variant
  - marker: b
    text: 'Mais literalmente: “Vinho novo, amigo novo; e, velho, depois talvez você o beba”. A comparação parece indicar que a amizade, assim como o vinho, deve amadurecer; contudo, a redação hebraica e a terminação do último verbo são incertas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַיִן חָדָשׁ
  choice: vinho novo
  rationale: Equivalência direta e natural de יַיִן, “vinho”, e חָדָשׁ, “novo”; mantém o paralelismo do provérbio.
- source_word: אוֹהֵב חָדָשׁ
  choice: amigo novo
  rationale: אוֹהֵב pode designar aquele que ama, isto é, um amigo. A formulação nominal preserva a concisão e o paralelismo do hebraico, embora o texto transmitido seja elíptico.
- source_word: וְיָשָׁן
  choice: quando envelhecer
  rationale: O adjetivo יָשָׁן significa “velho”. A construção verbal em português comunica de modo natural o amadurecimento com o passar do tempo, sem determinar explicitamente se o referente figurado é o vinho ou o amigo.
- source_word: אַחַר אוּלַי
  choice: talvez então
  rationale: אַחַר sugere posterioridade e אוּלַי, possibilidade ou incerteza. “Talvez então” conserva ambos os elementos sem impor certeza a uma expressão textualmente difícil.
- source_word: תִּשְׁתֶּינוּ
  choice: você o beba
  rationale: O verbo significa “beber”, mas a terminação pronominal transmitida é difícil. O pronome masculino singular retoma naturalmente “vinho” e mantém a metáfora proverbial, sem acrescentar ao texto a ideia explícita de prazer.
theological_decisions:
- issue: Escolha do texto-base diante da grande divergência entre o hebraico e o paralelo grego
  choice: Traduzir o provérbio preservado em hebraico sobre vinho novo e amigo novo.
  alternative: Traduzir o texto grego que adverte sobre armadilhas e muralhas de cidades.
  rationale: O testemunho hebraico está preservado e é a fonte primária indicada. O grego fornecido representa uma forma textual substancialmente diferente e, por isso, sua divergência é registrada em nota, não incorporada silenciosamente à tradução.
- issue: Referente da imagem do envelhecimento e da bebida
  choice: Preservar a formulação metafórica compacta e sua ambiguidade.
  alternative: Explicitar que a amizade, como o vinho, torna-se agradável depois de amadurecer.
  rationale: A explicação é provavelmente o sentido do provérbio, mas explicitá-la no corpo do versículo resolveria uma elipse e uma tensão que pertencem ao texto hebraico transmitido.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe proverbial concisa. Emprega-se “você” por sua ampla legibilidade no português brasileiro, sem coloquialismo excessivo. A tradução evita acrescentar “com prazer”, ideia plausível no contexto, mas não expressa com segurança no hebraico preservado.
