  text: Do not give yourself to a prostitute[b][a], lest you squander your inheritance.
translation:
  language: pt
  text: Não se entregue a uma prostituta, para não desviar a sua herança.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz uma forma substancialmente mais extensa e diferente: “Afaste os olhos de uma mulher bonita e não contemple a beleza de uma mulher alheia; pela beleza de uma mulher muitos se desviaram, e por causa dela a paixão se acende como fogo.”'
    reason: alternative_reading
  - marker: b
    text: O hebraico traduzido por “desviar a sua herança” pode indicar fazê-la mudar de destino, aliená-la, perdê-la ou dissipá-la. “Herança” também pode significar patrimônio ou porção hereditária.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן
  choice: Não se entregue
  rationale: A proibição com נתן e נַפְשְׁךָ expressa a ideia de entregar ou dar a própria pessoa. Em português, “não se entregue” é natural e mantém a força da advertência.
- source_word: לְזוֹנָה
  choice: a uma prostituta
  rationale: זוֹנָה designa especificamente uma prostituta ou mulher que pratica prostituição. “Prostituta” é a equivalência moderna mais direta, sem o arcaísmo de “meretriz”.
- source_word: נַפְשְׁךָ
  choice: se
  rationale: נפש pode indicar a própria pessoa, a vida ou o ser, e não apenas uma “alma” imaterial. A construção reflexiva “se entregue” comunica esse sentido de modo idiomático.
- source_word: פֶּן
  choice: para não
  rationale: פן introduz uma consequência indesejada. “Para não” transmite em português corrente a força preventiva da advertência.
- source_word: תָּסֵב
  choice: dissipar
  rationale: O verbo aponta para fazer a herança desviar-se, ser alienada ou perder-se. “Dissipar” torna clara a consequência econômica sem restringi-la a um mecanismo específico, enquanto a incerteza lexical é registrada em nota.
- source_word: נַחֲלָתֶךָ
  choice: a sua herança
  rationale: נחלה pode ser herança, patrimônio ou porção hereditária. “Herança” preserva tanto o sentido material quanto o familiar.
theological_decisions:
- issue: Primazia do hebraico preservado diante de uma forma grega substancialmente diferente e mais extensa
  choice: Traduzir no texto principal a advertência hebraica breve sobre entregar-se a uma prostituta e dissipar a herança.
  alternative: 'Adotar como texto principal a forma grega: “Afaste os olhos de uma mulher bonita e não contemple a beleza de uma mulher alheia...”'
  rationale: Como há texto hebraico preservado com alta confiança, ele serve de base para o texto principal. A forma grega parece representar uma redação diferente ou ampliada e, por sua importância textual, é integralmente registrada em nota, sem ser harmonizada com o hebraico.
- issue: Agente e nuance exata de תָּסֵב
  choice: 'Expressar a consequência de modo reflexivo e econômico: “para não dissipar a sua herança”.'
  alternative: “para que ela não desvie a sua herança” ou “para não afastar de si a sua herança”.
  rationale: A forma e o campo semântico permitem incerteza quanto ao modo exato pelo qual a herança é desviada ou perdida. A tradução principal comunica o resultado provável sem atribuir à mulher, de maneira excessivamente segura, uma ação que o texto pode apresentar como consequência da conduta do destinatário.
translation_notes:
  register: Português moderno, claro e digno, com construção reflexiva natural e vocabulário de ampla compreensão no Brasil e em outros contextos lusófonos. Evitou-se “alma” por ser estreito demais neste contexto e “meretriz” por soar arcaico.
