  text: Do not dine with her husband[a], and do not sit drinking with him while drunk.
translation:
  language: pt
  text: Não coma com o marido dela[a] e não se sente com ele em embriaguez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tradição grega traz uma leitura inteiramente diferente: «Não invejes a glória do pecador, pois não sabes qual será a sua ruína.» O hebraico preservado aqui diverge substancialmente da tradição grega.'
    reason: alternative_reading
lexical_decisions:
- source_word: עִם בַּעְלָהּ
  choice: com o marido dela
  rationale: בעל com o sufixo feminino singular refere-se, neste contexto, ao marido da mulher; עִם indica companhia ou associação.
- source_word: אַל תִּטְעָם
  choice: não comas
  rationale: Embora o verbo possa significar literalmente «provar», aqui descreve naturalmente compartilhar uma refeição; «comer» é claro e corrente em português.
- source_word: וְאַל תָּסֵב עִמּוֹ
  choice: e não te sentes com ele para beber
  rationale: O verbo indica sentar-se ou reclinar-se à mesa. A formulação explicita com naturalidade o contexto de bebida indicado pela palavra seguinte.
- source_word: שִׁכּוֹר
  choice: quando estiver embriagado
  rationale: O termo denota um estado de embriaguez. A construção preserva a possível referência ao marido, sem transformar o adjetivo em uma proibição geral da bebida.
theological_decisions:
- issue: Divergência substancial entre o hebraico preservado e a tradição grega
  choice: Seguir no texto principal o testemunho hebraico, que adverte contra comer e beber com o marido da mulher.
  alternative: 'A tradição grega diz: «Não invejes a glória do pecador, pois não sabes qual será a sua ruína.»'
  rationale: Como há aqui um testemunho hebraico de alta confiança, ele recebe primazia. A leitura grega, provavelmente decorrente de um Vorlage diferente ou de deslocamento na transmissão, é registrada em nota para preservar a transparência textual.
- issue: Referente e função de שִׁכּוֹר
  choice: «quando estiver embriagado», referindo-se mais naturalmente ao marido.
  alternative: «estando tu embriagado» ou «em meio à embriaguez».
  rationale: O hebraico é conciso e não marca explicitamente o referente. A proximidade de עִמּוֹ favorece o marido, mas a nota não deve fingir uma precisão inexistente no texto-fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega-se «comer» em vez de «cear» para evitar um tom excessivamente arcaico; «embriagado» mantém um registro sóbrio. A ambiguidade sintática final é reconhecida nas decisões, embora a tradução adote o referente contextual mais provável.
