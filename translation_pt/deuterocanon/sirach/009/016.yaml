translation:
  language: pt
  text: Que você reflita junto com pessoas sensatas, e que tudo o que disser esteja de acordo com a lei do Altíssimo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto hebraico preservado nos manuscritos da Genizá do Cairo traz, em vez disso: “Não tenha inveja do arrogante que prospera; lembre-se de que, até a morte, ele não ficará impune.” Esse testemunho hebraico parece preservar uma linha diferente ou deslocada; por isso, o texto principal segue o grego.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ μετὰ συνετῶν
  choice: junto com pessoas sensatas
  rationale: συνετῶν designa pessoas dotadas de entendimento e discernimento. “Pessoas sensatas” é inclusivo, natural em português atual e não acrescenta especificação de gênero.
- source_word: ἔστω ὁ διαλογισμός σου
  choice: que você reflita
  rationale: διαλογισμός pode indicar pensamento, reflexão ou ponderação. A formulação verbal comunica com naturalidade a exortação grega e, junto de μετὰ συνετῶν, sugere reflexão feita em boa companhia, sem restringir o sentido a uma conversa formal.
- source_word: πᾶσα διήγησίς σου
  choice: tudo o que disser
  rationale: διήγησις pode significar discurso, exposição, relato ou conversa. A expressão escolhida é ampla e idiomática, abrangendo a fala da pessoa em geral.
- source_word: ἐν νόμῳ Ὑψίστου
  choice: de acordo com a lei do Altíssimo
  rationale: O grego emprega literalmente “na lei do Altíssimo”. Em português, “de acordo com” expressa com clareza que toda fala deve ser orientada pela instrução divina; “Altíssimo” preserva o título divino.
theological_decisions:
- issue: Escolha do texto-base diante da divergência entre os testemunhos hebraico e grego
  choice: Seguir no texto principal a linha grega de Sirácida 9:16 e registrar em nota a linha hebraica divergente.
  alternative: 'Traduzir no texto principal o hebraico preservado: “Não tenha inveja do arrogante que prospera; lembre-se de que, até a morte, ele não ficará impune.”'
  rationale: O hebraico composto dos manuscritos da Genizá do Cairo apresenta aqui uma divergência material e foi identificado como possível linha diferente ou deslocada. O grego oferece a leitura coerente associada a esta referência. A nota conserva transparentemente a evidência hebraica sem fundir duas linhas incompatíveis.
translation_notes:
  register: Português moderno, claro e digno, com construção de ampla compreensão internacional e boa legibilidade brasileira. O tratamento por “você” evita uma formulação excessivamente solene; as expansões idiomáticas são moderadas e preservam o paralelismo da exortação.
