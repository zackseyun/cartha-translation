translation:
  language: pt
  text: Não tenha ciúmes[a] de sua esposa, que você traz junto ao peito[b], para que você não ensine contra si mesmo uma lição má.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Não inveje sua esposa». O verbo hebraico pode indicar tanto ciúme como inveja; o contexto conjugal favorece «tenha ciúmes».'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «a esposa de seu seio/colo», uma expressão para a esposa com quem se tem intimidade.
    reason: cultural_note
  - marker: c
    text: O hebraico diz simplesmente «má»; o paralelo grego traz «instrução má» ou «disciplina má». Por isso, a tradução explicita «uma lição má». A expressão «contra si mesmo» sugere que o resultado prejudicaria a própria pessoa.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: Não tenha ciúmes
  rationale: O verbo קנא pode expressar ciúme, inveja ou zelo. O contexto conjugal favorece «ter ciúmes», em concordância com o paralelo grego ζηλόω, sem acrescentar a ideia mais específica de suspeita.
- source_word: אֵשֶׁת חֵיקֶךָ
  choice: sua esposa, acolhida junto ao peito
  rationale: אֵשֶׁת indica a esposa, e חֵיקֶךָ significa literalmente «seu peito/colo». A formulação preserva a imagem hebraica de proximidade íntima sem soar excessivamente arcaica em português.
- source_word: פֶּן
  choice: para que ... não
  rationale: A partícula introduz um resultado indesejado contra o qual se adverte. «Para que não» comunica essa força de modo corrente e claro.
- source_word: תִּלְמַד עָלֶיךָ
  choice: você não ensine, contra si mesmo
  rationale: A vocalização hebraica e o grego μηδὲ δίδαξῃς apoiam o sentido de «ensinar», não simplesmente «aprender». «Contra si mesmo» retém a força difícil de עָלֶיךָ e evita resolver silenciosamente a construção.
- source_word: רָעָה
  choice: uma lição má
  rationale: O hebraico traz apenas «mal/má», mas a construção com «ensinar» pressupõe um objeto dessa natureza, explicitado no grego como παιδείαν πονηράν, «instrução/disciplina má». «Lição má» torna a frase inteligível sem esconder a diferença textual.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A imagem corporal do hebraico foi preservada de modo natural, e a construção deliberadamente difícil «ensine, contra si mesmo» mantém a tensão do texto em vez de explicar no corpo do versículo quem receberia a lição ou como ela se voltaria contra o marido.
