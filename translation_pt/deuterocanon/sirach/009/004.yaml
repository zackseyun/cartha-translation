  text: Do not keep company with a prostitute[a], lest you be caught by her enticements.
translation:
  language: pt
  text: Não conviva com uma prostituta, para não ser enredado por suas seduções[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão hebraica traduzida como «por suas seduções» é difícil. O paralelo grego diz «em suas artimanhas» ou «em suas tentativas», apoiando também sentidos como «por seus engodos» ou «por suas armadilhas».
    reason: lexical_alternative
lexical_decisions:
- source_word: עִם
  choice: com
  rationale: A preposição indica companhia ou associação e se combina naturalmente com o verbo «conviver».
- source_word: זוֹנָה
  choice: uma prostituta
  rationale: Equivalente moderno, claro e não arcaico para o substantivo hebraico.
- source_word: אַל תִּסְתַּיֵּד
  choice: não conviva
  rationale: O verbo hebraico é incomum; o contexto e o paralelo grego apontam para associação continuada. «Não conviva» expressa essa ideia em português corrente sem ampliar indevidamente o sentido.
- source_word: פֶּן
  choice: para não
  rationale: Introduz a consequência indesejada da advertência; esta construção é natural e clara em português moderno.
- source_word: תִּלָּכֵד
  choice: ser enredado
  rationale: O passivo hebraico evoca ser apanhado numa armadilha. «Ser enredado» conserva a imagem e funciona naturalmente no contexto.
- source_word: בְּלִקְחֹתֶיהָ
  choice: por suas seduções
  rationale: A expressão hebraica é difícil. O paralelo grego fala de expedientes, tentativas ou artimanhas; «seduções» se ajusta ao contexto, enquanto a nota preserva a incerteza lexical.
theological_decisions:
- issue: Uso do hebraico como testemunho principal e do grego para esclarecer a expressão final difícil
  choice: Traduzir a expressão final como «por suas seduções», informada pelo paralelo grego.
  alternative: «por seus ganhos», «em suas armadilhas» ou «por suas artimanhas»
  rationale: O texto hebraico preservado continua sendo a base, mas o substantivo final é semanticamente incerto. O grego apoia uma referência a expedientes ou artimanhas sedutoras, sem justificar uma precisão maior do que as testemunhas permitem.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. «Não conviva» evita tanto o arcaísmo quanto uma paráfrase excessiva; «ser enredado» preserva a imagem sapiencial de captura.
