  terminology: “Armadilhas” e “rede” mantêm a distinção lexical e imagética entre פַּחִים e רֶשֶׁת. A nota registra com precisão que a tradição grega é substancialmente diferente, sem tratar uma das tradições como harmonizável com a outra. “Homem de língua solta” e “precipitado no falar” são formulações compreensíveis para o paralelo grego.
