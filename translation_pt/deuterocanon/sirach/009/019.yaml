translation:
  language: pt
  text: Saiba que você avançará entre armadilhas e caminhará até uma rede.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico preservado diz: “Saiba que você avançará entre armadilhas e caminhará até uma rede”. A tradição grega difere substancialmente: “O homem de língua solta é temido em sua cidade, e aquele que é precipitado no falar será odiado”. A tradução segue aqui o hebraico existente como testemunho principal, registrando a variante grega.'
    reason: textual_variant
lexical_decisions:
- source_word: דַּע
  choice: Saiba
  rationale: Imperativo direto de ידע; preserva a concisão e a força exortativa do hebraico.
- source_word: בֵין פַּחִים
  choice: entre armadilhas
  rationale: פַּח designa armadilha ou laço; com בֵין, retrata alguém avançando em meio a perigos.
- source_word: תִּצְעָד
  choice: você avançará
  rationale: O verbo צעד descreve dar passos ou avançar. A escolha mantém a imagem do movimento cuidadoso sem recorrer a uma formulação pouco natural em português.
- source_word: וְעַד רֶשֶׁת
  choice: e ... até uma rede
  rationale: Preserva a expressão espacial concreta do hebraico, embora ela seja incomum e possa indicar aproximação à rede, não necessariamente captura.
- source_word: תִּתְהַלָּךְ
  choice: caminhará
  rationale: O hitpael de הלך pode expressar ação contínua ou reiterada; “caminhará” é natural e mantém a imagem de deslocamento.
- source_word: רֶשֶׁת
  choice: rede
  rationale: É o sentido concreto de רֶשֶׁת e mantém distinta esta imagem da de פַּחִים, “armadilhas”.
