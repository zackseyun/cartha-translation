  source_fidelity: 'O texto segue de perto o hebraico preservado: “Saiba” reproduz adequadamente o imperativo דַּע; “entre armadilhas” corresponde a בֵּין פַּחִים; e “até uma rede” conserva a formulação espacial incomum de וְעַד רֶשֶׁת sem resolver indevidamente sua nuance. “Avançará” é uma opção aceitável para תִּצְעָד, e “caminhará” transmite adequadamente o movimento continuado de תִּתְהַלָּךְ.'
