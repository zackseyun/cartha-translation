translation:
  language: pt
  text: Não se associe com mulheres cantoras[a], para que elas não o queimem por suas bocas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego: “Não entregue sua alma às prostitutas, para não perder sua herança.” O grego torna explícita a advertência sexual e moral onde o hebraico fala de “mulheres cantoras” e de ser queimado “por suas bocas”.'
    reason: alternative_reading
lexical_decisions:
- source_word: עִם מְנַגְּנוֹת
  choice: com mulheres cantoras
  rationale: Preserva a referência hebraica a mulheres que executam música, sem explicitar no texto principal a conotação sexual apresentada pelo paralelo grego.
- source_word: אַל תִּדְמוֹךְ
  choice: não se associe
  rationale: O verbo é raro ou incerto, mas neste contexto indica envolvimento ou convivência próxima. A formulação é natural em português e evita tornar necessariamente sexual uma expressão ambígua.
- source_word: פֶּן
  choice: para que... não
  rationale: Expressa de modo corrente a consequência negativa temida ou evitada.
- source_word: יִשְׂרְפֻךָ
  choice: elas não queimem você
  rationale: Mantém a metáfora concreta de queimar e representa diretamente o verbo ativo hebraico com sujeito feminino plural.
- source_word: בְּפִיפִיֹתָם
  choice: com a boca
  rationale: Conserva a imagem corporal e o valor instrumental do hebraico. O singular coletivo soa mais natural em português do que 'com suas bocas', sem resolver se a referência é à fala, ao canto ou à sedução.
theological_decisions:
- issue: Divergência entre os testemunhos hebraico e grego
  choice: Traduzir no texto principal o hebraico preservado e registrar o grego em nota.
  alternative: Não entregue sua alma às prostitutas, para não perder sua herança.
  rationale: O testemunho hebraico fala de mulheres cantoras e de ser queimado pela boca delas; o grego explicita uma advertência sexual e apresenta outra consequência. Como a divergência afeta materialmente o sentido, ela não deve ser harmonizada silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução mantém a imagem incomum do hebraico e evita importar para o texto principal a explicitação interpretativa do grego.
