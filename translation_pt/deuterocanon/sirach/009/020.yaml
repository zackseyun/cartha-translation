  naturalness: «Conforme as suas possibilidades» e «associe-se aos sábios» são naturais, claras e de registro proverbial apropriado. «Ganhe um amigo» é uma formulação idiomática e mais neutra que «conquiste um amigo».
  terminology: «Sábios» representa adequadamente חֲכָמִים como classe geral. A nota sobre o grego preserva corretamente a leitura mais específica de consulta/conselho, sem a impor ao hebraico incerto.
