base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/020.yaml
  text: By your strength acquire your friend[b][a], and associate yourself with the wise.
translation:
  language: pt
  text: Conforme as suas possibilidades, ganhe um amigo[a] e associe-se aos sábios.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Com a sua força, ganhe um amigo». O hebraico pode se referir à força no sentido de capacidade ou recursos.'
    reason: lexical_alternative
  - marker: b
    text: 'A forma do verbo hebraico é incomum. O texto grego traz, mais especificamente: «aconselhe-se com os sábios».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכֹחֲךָ
  choice: conforme as suas possibilidades
  rationale: A expressão significa literalmente «com/segundo a sua força», mas aqui força abrange capacidade e recursos. A formulação escolhida comunica em português natural a ideia de agir na medida do que se pode, em consonância com o paralelo grego κατὰ τὴν ἰσχύν σου.
- source_word: קְנֵה
  choice: conquiste
  rationale: O verbo costuma significar adquirir ou comprar. Como o objeto é um amigo, «conquiste» evita uma leitura comercial e expressa naturalmente o ato de ganhar uma amizade, sem transformar o conselho em mera escolha de companhia.
- source_word: רֵעֶךָ
  choice: um amigo
  rationale: O substantivo pode designar amigo, companheiro ou próximo. Neste conselho relacional, «amigo» é a opção mais clara; o indefinido soa mais natural em português do que o literal «seu amigo» depois de «conquiste».
- source_word: וְעִם חֲכָמִים
  choice: aos sábios
  rationale: A construção significa «com os sábios». A regência de «associar-se» pede «aos» em português. «Sábios» designa a classe de pessoas caracterizadas pela sabedoria, sem exigir referência exclusivamente masculina.
- source_word: תִּסְתַּיָּד
  choice: associe-se
  rationale: A forma hebraica é incomum e seu sentido exato é incerto. «Associe-se» preserva a ideia relacional sugerida pelo contexto sem restringi-la à consulta; o grego, mais específico, traz «aconselhe-se com os sábios».
theological_decisions:
- issue: Alcance do plural masculino חֲכָמִים
  choice: os sábios
  alternative: os homens sábios; as pessoas sábias
  rationale: O plural masculino funciona aqui como designação geral de uma classe, não como limitação explícita a homens. «Os sábios» mantém a forma concisa e tradicional em português sem introduzir uma exclusão exigida pelo texto.
- issue: Grau de especificidade de תִּסְתַּיָּד
  choice: associe-se
  alternative: aconselhe-se
  rationale: A leitura grega favorece o conselho mútuo, mas o hebraico preservado é incomum e não permite eliminar com segurança a noção mais ampla de associação. A tradução mantém essa tensão e registra a leitura grega em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Conforme as suas possibilidades» evita o literalismo pouco natural de «por sua força»; «conquiste um amigo» conserva o caráter proverbial sem sugerir compra de pessoas. As notas preservam tanto a imagem hebraica quanto a leitura mais específica do paralelo grego.
