translation:
  language: pt
  text: Não se aproxime de uma mulher estrangeira[a], para não cair nas armadilhas dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma mulher estranha”. Na literatura sapiencial, a expressão pode referir-se a uma mulher fora dos vínculos sexuais ou matrimoniais legítimos, e não apenas a uma mulher de outra origem étnica. O paralelo grego sugere uma associação sexual imprópria.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּקְרַב
  choice: Não se aproxime
  rationale: A proibição hebraica é direta. A formulação é natural em português moderno e conserva a ideia de não entrar em proximidade nem envolvimento; o paralelo grego também indica ir ao encontro ou associar-se.
- source_word: אִשָּׁה זָרָה
  choice: uma mulher alheia
  rationale: O hebraico diz literalmente uma mulher estranha, estrangeira ou alheia. No contexto sapiencial, a expressão frequentemente designa uma mulher fora dos limites conjugais ou morais apropriados, sem necessariamente se referir à etnia. “Alheia” preserva essa abertura sem sugerir apenas alguém desconhecida ou excêntrica.
- source_word: פֶּן
  choice: para não
  rationale: A partícula introduz uma consequência indesejada. “Para não” é claro e idiomático no português atual, sem o tom excessivamente elevado de “para que não venhas a”.
- source_word: תִּפּוֹל
  choice: cair
  rationale: Mantém literalmente a imagem do verbo hebraico, confirmada pelo grego ἐμπέσῃς, e combina naturalmente com a imagem das armadilhas.
- source_word: בִּמְצוּדֹתֶיהָ
  choice: nas armadilhas dela
  rationale: O substantivo designa redes, laços ou outros dispositivos de captura. “Armadilhas” comunica com clareza a metáfora de perigo e corresponde ao grego παγίδες.
theological_decisions:
- issue: Sentido de אִשָּׁה זָרָה no contexto sapiencial
  choice: mulher alheia
  alternative: mulher estrangeira; mulher imoral; prostituta
  rationale: A tradução conserva a ambiguidade entre alguém que está fora dos vínculos apropriados e a noção literal de estrangeira. O paralelo grego favorece a ideia de associação sexual imprópria, mas o hebraico não especifica “prostituta” nem autoriza reduzir o sentido à origem étnica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Mulher alheia” mantém o caráter sapiencial e a ambiguidade do hebraico; a nota evita que a expressão seja entendida exclusivamente em sentido étnico.
