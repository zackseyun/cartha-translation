  text: Do not give your soul to a woman[b][a], to let her tread on your heights.
translation:
  language: pt
  text: Não entregue a sua alma a uma mulher, para deixá-la pisar sobre as suas alturas[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “Não entregue a sua alma a uma mulher, para que ela pise sobre a sua força.” O grego esclarece a metáfora como uma advertência contra ceder a própria força ou posição.'
    reason: alternative_reading
  - marker: b
    text: A expressão hebraica “as suas alturas” pode ser uma figura para a posição, a dignidade ou a força de alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּקְנֶא
  choice: Não entregue
  rationale: A forma hebraica transmitida é difícil e pode sugerir outro sentido, mas o paralelo grego μὴ δῷς, “não dês”, sustenta fortemente a ideia de entregar ou ceder. “Não entregue” comunica essa advertência com naturalidade em português.
- source_word: נַפְשְׁךָ
  choice: a sua alma
  rationale: Mantém a imagem literal do hebraico e corresponde ao grego ψυχή, embora, no contexto, possa abranger o próprio ser ou a pessoa inteira.
- source_word: לְאִשָּׁה
  choice: a uma mulher
  rationale: O hebraico e o grego empregam o termo comum que pode significar “mulher” ou “esposa”, sem marca possessiva. “Uma mulher” evita restringir indevidamente o referente.
- source_word: לְהַדְרִיכָהּ
  choice: para deixá-la pisar
  rationale: Preserva a imagem concreta de fazer ou permitir que alguém pise, confirmada pelo grego ἐπιβῆναι, em vez de substituir a metáfora por “dominar” ou “controlar”.
- source_word: עַל בָּמוֹתֶיךָ
  choice: sobre as suas alturas
  rationale: Reproduz a expressão hebraica literal, que pode representar figuradamente posição, dignidade ou força. O paralelo grego explicita a interpretação “sobre a sua força”.
theological_decisions:
- issue: Preservar a metáfora ou convertê-la numa afirmação explícita sobre domínio
  choice: Preservar as imagens “entregar a alma” e “pisar sobre as suas alturas”
  alternative: Não se entregue a uma mulher, para que ela não domine você
  rationale: O texto é uma advertência sapiencial formulada metaforicamente. Explicitar “dominar” resolveria a imagem e intensificaria a afirmação além do que o hebraico diz diretamente.
- issue: Interpretar אִשָּׁה como mulher ou esposa
  choice: uma mulher
  alternative: uma esposa
  rationale: Nenhum possessivo nem outro elemento do versículo exige referência específica à esposa; a escolha mais ampla conserva a ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação conserva as metáforas sem soar arcaica. Os marcadores seguem junto às expressões correspondentes, mantendo a ordem editorial fornecida [b][a].
