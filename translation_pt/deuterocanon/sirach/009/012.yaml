translation:
  language: pt
  text: Não deixe que o seu coração se incline para ela e que você, em sangue, se incline para a cova.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz literalmente “em/com sangue”; a expressão também pode ser entendida como “por causa de derramamento de sangue”.
    reason: O valor de בְּדָמִים e sua relação com o verbo admitem mais de uma leitura contextual.
  - marker: b
    text: 'A antiga versão grega traz um texto bem diferente: “Não te deleites na prosperidade dos ímpios; lembra-te de que, até o Hades, eles não serão considerados justos.”'
    reason: Registra uma variante textual substancial entre a tradição hebraica preservada e a grega.
lexical_decisions:
- source_word: אֵלֶיהָ
  choice: para ela
  rationale: O pronome hebraico é feminino singular; a tradução mantém essa referência, sem substituí-la pelo plural da camada inglesa revisada.
- source_word: בְּדָמִים
  choice: em meio a sangue
  rationale: Preserva a formulação concreta e a relação sintática ambígua do hebraico, que pode sugerir sangue derramado ou culpa de sangue.
- source_word: שָׁחַת
  choice: Cova
  rationale: Expressa o poço ou lugar de ruína/morte indicado pelo termo hebraico, sem reduzi-lo simplesmente ao túmulo físico.
- source_word: תִּטֶּה
  choice: você se volte
  rationale: Mantém a forma ativa do hebraico e seu paralelismo com a inclinação do coração na primeira oração.
theological_decisions:
- issue: Referente de אֵלֶיהָ
  choice: ela
  alternative: eles
  rationale: A evidência hebraica fornecida traz inequivocamente um sufixo feminino singular; não há base nessa forma para o plural.
- issue: Sentido de שָׁחַת
  choice: Cova
  alternative: destruição
  rationale: A tradução conserva a imagem espacial ligada à morte e à ruína, sem definir de modo excessivo sua natureza escatológica.
translation_notes:
  register: Português atual, digno e acessível. A construção “Não aconteça que” reproduz a advertência introduzida por פֶּן; “Cova” recebe maiúscula para sinalizar seu uso figurado como domínio da morte.
