  text: A third tongue has shaken many and scattered them from nation to nation,[a]
translation:
  language: pt
  text: Uma terceira língua abalou muitos e os dispersou de nação em nação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma língua caluniadora”, “uma língua dupla” ou, em sentido mais geral, “um discurso divisivo”. O grego diz literalmente “uma terceira língua”, expressão mantida de forma transparente no texto principal.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα
  choice: língua
  rationale: O substantivo significa literalmente “língua” e, por extensão, fala ou discurso. A escolha preserva a imagem concreta e a expressão proverbial incomum.
- source_word: τρίτη
  choice: terceira
  rationale: O grego traz diretamente o ordinal “terceira”. Embora a expressão admita interpretações como fala caluniosa ou divisiva, a tradução principal não resolve a ambiguidade.
- source_word: ἐσάλευσεν
  choice: abalou
  rationale: O verbo pode significar sacudir, agitar ou desestabilizar. “Abalou” conserva a metáfora e se aplica naturalmente aos efeitos sociais descritos.
- source_word: διέστησεν
  choice: dispersou
  rationale: O verbo expressa separação ou afastamento. Com a sequência “de nação em nação”, “dispersou” comunica a fragmentação e o deslocamento resultantes.
- source_word: ἀπὸ ἔθνους εἰς ἔθνος
  choice: de nação em nação
  rationale: A formulação preserva a repetição de ἔθνος e exprime de modo conciso o movimento ou deslocamento entre nações.
theological_decisions:
- issue: Interpretação da expressão γλῶσσα τρίτη
  choice: Manter “uma terceira língua” no texto principal.
  alternative: “uma língua caluniadora”, “uma língua dupla” ou, em sentido mais geral, “um discurso divisivo”
  rationale: O testemunho grego fornecido diz literalmente “terceira língua”. Preservar essa imagem mantém a ambiguidade e evita impor uma interpretação específica; as principais possibilidades são registradas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção incomum “terceira língua” foi mantida intencionalmente por fidelidade à expressão grega; a nota esclarece as leituras possíveis sem eliminar a tensão lexical.
