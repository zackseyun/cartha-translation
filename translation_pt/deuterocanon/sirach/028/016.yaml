  text: Whoever pays attention to it will never find rest[a], nor will he settle down in peace.
translation:
  language: pt
  text: Quem lhe dá atenção jamais encontrará descanso, nem se estabelecerá em tranquilidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: «nem acampará/habitará com quietude».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ προσέχων αὐτῇ
  choice: Quem lhe dá atenção
  rationale: O particípio presente substantivado tem sentido genérico, e «quem» o expressa naturalmente. O pronome «lhe» retoma o referente feminino do contexto sem transformá-lo numa pessoa.
- source_word: οὐ μὴ εὑρῇ
  choice: jamais encontrará
  rationale: A construção οὐ μή com o subjuntivo transmite uma negação enfática; «jamais encontrará» preserva essa força em português corrente e digno.
- source_word: ἀνάπαυσιν
  choice: descanso
  rationale: Equivalente direto que pode abranger repouso interior e alívio nas relações, conforme o contexto sapiencial.
- source_word: οὐδὲ κατασκηνώσει
  choice: nem se estabelecerá
  rationale: O verbo evoca literalmente acampar ou habitar. «Se estabelecerá» mantém a ideia de permanência estável sem tornar a imagem excessivamente concreta.
- source_word: μεθʼ ἡσυχίας
  choice: em tranquilidade
  rationale: ἡσυχία denota quietude, calma ou tranquilidade. A formulação preserva essa nuance mais diretamente do que «em paz».
