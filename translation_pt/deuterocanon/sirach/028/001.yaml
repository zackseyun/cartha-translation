  text: The one who takes vengeance will find vengeance from the Lord, and he will surely keep his sins in mind.[a]
translation:
  language: pt
  text: Quem se vinga encontrará vingança da parte do Senhor; e certamente conservará os seus pecados.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A linha hebraica preservada e fornecida para este versículo diz: “Não temas a aflição de amanhã, pois não sabes o que um dia trará.” Ela não corresponde ao texto grego de Sirácida neste ponto e parece pertencer a outro versículo ou resultar de um desencontro na transmissão. Por isso, a tradução segue o testemunho grego de Sirácida 28:1.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “manterá os seus pecados guardados” ou “os conservará em reserva”. O grego repete o mesmo verbo para dar ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐκδικῶν
  choice: quem se vinga
  rationale: A construção participial tem sentido genérico e habitual. Esta formulação é natural em português e mantém a ideia de exercer vingança.
- source_word: παρὰ Κυρίου
  choice: da parte do Senhor
  rationale: A preposição παρά com o genitivo indica aqui a origem da vingança; “da parte do Senhor” expressa essa relação com clareza.
- source_word: εὑρήσει ἐκδίκησιν
  choice: encontrará vingança
  rationale: Preserva a correspondência lexical entre “vingar-se” e “vingança” e traduz diretamente o verbo “encontrará”, sem reduzir o sentido a uma punição genérica.
- source_word: τὰς ἁμαρτίας αὐτοῦ
  choice: os pecados dessa pessoa
  rationale: “Pecados” mantém a força moral usual de ἁμαρτίαι. “Dessa pessoa” identifica o vingativo como referente sem introduzir distinção de gênero no português.
- source_word: διατηρῶν διατηρήσει
  choice: certamente manterá registrados
  rationale: A repetição do mesmo verbo em grego intensifica a afirmação. “Certamente” transmite a ênfase, enquanto “manterá registrados” comunica que os pecados permanecem retidos contra a pessoa, e não apenas lembrados mentalmente.
theological_decisions:
- issue: Divergência entre os testemunhos hebraico e grego
  choice: Seguir o texto grego de Sirácida 28:1
  alternative: 'Traduzir a linha hebraica fornecida: “Não temas a aflição de amanhã, pois não sabes o que um dia dará à luz.”'
  rationale: A linha hebraica fornecida não corresponde ao conteúdo de Sirácida 28:1 e se aproxima de Provérbios 27:1, indicando desencontro de verso ou de transmissão. O testemunho grego conserva aqui o texto correspondente a Sirácida 28:1; a divergência é informada em nota, sem harmonização silenciosa.
- issue: Sujeito implícito de διατηρήσει
  choice: Entender o Senhor como aquele que mantém registrados os pecados do vingativo
  alternative: Entender o próprio vingativo como aquele que conserva seus pecados
  rationale: Na sequência da frase, “Senhor” é o referente mais próximo e o sentido contextual é que Deus retém os pecados do vingativo contra ele. A redação evita um pronome possessivo potencialmente confuso, embora o grego deixe o sujeito apenas implícito.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a repetição temática de vingança e explicita com naturalidade a retenção dos pecados, sem recorrer a linguagem confessional específica.
