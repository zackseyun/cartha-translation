  naturalness: «Quem se vinga encontrará vingança da parte do Senhor» é claro e de registro apropriado. «Certamente conservará os seus pecados» preserva o sujeito e a construção ativa do grego, embora a nota lexical seja importante para esclarecer o sentido de pecados retidos/em reserva.
  terminology: «Senhor», «vinga/vingança» e «pecados» são escolhas adequadas. A repetição entre vingar-se e vingança mantém de modo útil a repetição lexical grega.
