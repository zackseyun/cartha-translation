  text: Many have fallen by the mouth of the sword[a], but not as those who have fallen because of the tongue.
translation:
  language: pt
  text: Muitos caíram pela boca da espada[a], mas não tantos quanto os que caíram por causa da língua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «pela boca da espada». A expressão costuma ser traduzida por «ao fio da espada», mas a forma literal preserva o contraste entre «boca» e «língua».
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Muitos
  rationale: Reproduz de modo direto o adjetivo quantitativo e mantém o tom proverbial.
- source_word: ἔπεσαν
  choice: caíram
  rationale: Traduz literalmente o aoristo de πίπτω; o pretérito perfeito é natural em português para uma afirmação sapiencial baseada na experiência.
- source_word: ἐν στόματι μαχαίρας
  choice: pela boca da espada
  rationale: Preserva a imagem literal do grego e o contraste retórico entre a «boca» da espada e a «língua». Embora «ao fio da espada» seja mais idiomático, apagaria parte do jogo de imagens.
- source_word: καὶ οὐχ ὡς
  choice: mas não tantos como
  rationale: Expressa em português a comparação quantitativa elíptica sugerida pelo contexto, sem perder o contraste entre as duas formas de queda.
- source_word: οἱ πεπτωκότες
  choice: os que caíram
  rationale: Retoma o verbo da primeira oração e comunica naturalmente o particípio perfeito, sem introduzir uma causa de morte não explicitada.
- source_word: διὰ γλῶσσαν
  choice: por causa da língua
  rationale: διά com acusativo pode indicar causa; «língua» conserva a imagem concreta da fala destrutiva.
theological_decisions:
- issue: Contraste metafórico entre espada e língua
  choice: Manter as imagens corporais «boca» e «língua».
  alternative: Verter «ao fio da espada» e «por causa das palavras».
  rationale: A formulação concreta sustenta a força sapiencial e o paralelo retórico do grego, sem transformar a língua em uma abstração.
- issue: Sentido da comparação καὶ οὐχ ὡς
  choice: 'Entender a expressão como comparação quantitativa elíptica: «mas não tantos como».'
  alternative: Traduzir mais formalmente «e não como os que caíram», preservando uma comparação de modo ou condição.
  rationale: 'O paralelismo entre os dois grupos favorece a leitura quantitativa, comum no sentido proverbial: muitos caem pela espada, porém ainda mais pela língua. A alternativa formal é gramaticalmente possível, mas obscura em português.'
translation_notes:
  register: Português moderno, claro e digno, com sintaxe proverbial. Conserva-se deliberadamente a expressão incomum «boca da espada» por seu valor poético e retórico; a nota esclarece o idioma.
