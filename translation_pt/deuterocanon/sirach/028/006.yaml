  text: Remember the end[a], and stop being hostile; remember decay and death[b], and remain in the commandments.
translation:
  language: pt
  text: Lembre-se do fim[a] e deixe de agir com hostilidade; lembre-se da decomposição e da morte[b] e permaneça nos mandamentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “as últimas coisas”. A expressão pode indicar o fim da vida ou o desfecho final.
    reason: lexical_alternative
  - marker: b
    text: 'O testemunho hebraico fornecido neste ponto traz outro dito, aproximadamente: “...quem responde a uma questão antes de ouvi-la”. Isso parece indicar um desencontro na localização da fonte, e não uma simples variante deste versículo.'
    reason: textual_variant
lexical_decisions:
- source_word: μνήσθητι
  choice: Lembre-se
  rationale: Traduz diretamente o imperativo grego e mantém o tom exortativo da literatura sapiencial.
- source_word: τὰ ἔσχατα
  choice: do fim
  rationale: A expressão significa literalmente “as últimas coisas”, mas “o fim” comunica de modo natural o desfecho final da pessoa, preservando a amplitude em nota.
- source_word: παῦσαι ἐχθραίνων
  choice: deixe a hostilidade
  rationale: Expressa a cessação de uma atitude ou conduta hostil contínua, sem restringir o sentido apenas ao sentimento de ódio.
- source_word: καταφθοράν
  choice: corrupção
  rationale: Mantém a amplitude do termo grego, que pode indicar deterioração, ruína ou decomposição; no par com “morte”, aponta para a condição perecível humana.
- source_word: θάνατον
  choice: morte
  rationale: Equivalente direto e natural do substantivo grego.
- source_word: ἔμμενε
  choice: permaneça
  rationale: Comunica continuidade e perseverança, preservando a construção do texto grego.
- source_word: ἐντολαῖς
  choice: nos mandamentos
  rationale: Preserva o teor moral e religioso sem acrescentar um possuidor divino não explícito no grego.
theological_decisions:
- issue: Alinhamento da fonte primária neste versículo
  choice: Traduzir o paralelo grego como texto operativo de Sirácida 28:6 e registrar em nota a divergência do testemunho hebraico fornecido.
  alternative: 'Traduzir diretamente a linha hebraica fornecida: “E mais leviano que um viajante é quem responde a uma questão antes de ouvi-la.”'
  rationale: A linha hebraica fornecida não corresponde semanticamente ao versículo preservado no grego e parece resultar de desencontro de localização. O grego oferece a forma coerente de Sirácida 28:6, enquanto a nota mantém transparência sobre a evidência hebraica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o paralelismo exortativo do grego e evita explicitar elementos teológicos que o texto não declara.
