- source_word: μάχη
  choice: briga
  rationale: Termo natural para confronto físico ou luta, adequado ao resultado de derramamento de sangue.
- source_word: κατασπεύδουσα
  choice: precipitada
  rationale: Comunica ação impulsiva e apressada, variando naturalmente a formulação sem perder a repetição semântica do original.
- source_word: ἐκχέει αἷμα
  choice: derrama sangue
  rationale: Equivalência direta e idiomática da expressão grega.
