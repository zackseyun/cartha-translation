translation:
  language: pt
  text: Tenha cuidado para não escorregar nela[a], nem cair diante de quem está à espreita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio dela” ou “por causa dela”. O grego traz um pronome feminino, cujo referente vem do contexto.'
    reason: Preserva a possível força instrumental ou causal de ἐν sem apagar o pronome feminino do texto principal.
lexical_decisions:
- source_word: πρόσεχε
  choice: Tenha cuidado
  rationale: Expressa de modo natural e direto a exortação grega a estar atento ou precaver-se.
- source_word: ὀλισθήσῃς ἐν αὐτῇ
  choice: escorregar nela
  rationale: Mantém a imagem de perder o equilíbrio e preserva a construção grega com pronome feminino, sem convertê-la de forma inequívoca em causa ou instrumento.
- source_word: κατέναντι ἐνεδρεύοντος
  choice: diante de quem está à espreita
  rationale: Reproduz a ideia de cair perante uma pessoa que aguarda ocultamente uma oportunidade para atacar, em português corrente e digno.
theological_decisions:
- issue: Referente e valor de ἐν αὐτῇ
  choice: Manter o pronome feminino em “nela” e registrar a amplitude da preposição em nota
  alternative: “por causa dela” ou “por meio dela”
  rationale: O grego emprega um pronome feminino anafórico e a preposição ἐν, cujo valor pode ser locativo ou instrumental no contexto. A tradução evita resolver uma ambiguidade que o verso isolado não elimina.
translation_notes:
  register: Português moderno, claro e solene, com construção facilmente compreensível no Brasil e em outros contextos lusófonos. A repetição negativa grega foi vertida de modo fluente com “não... nem”.
