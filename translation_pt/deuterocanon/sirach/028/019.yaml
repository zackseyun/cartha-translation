revisions:
- from: Feliz aquele que foi protegido dela, que não passou pela sua fúria, que não arrastou o seu jugo e não foi preso em suas correntes.
  to: Bem-aventurado aquele que foi protegido dela[a], que não passou por sua fúria, que não puxou o seu jugo e não foi amarrado com suas correntes.
