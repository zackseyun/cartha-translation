base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/019.yaml
  text: Blessed is the one sheltered from it[a], who has not passed through its wrath, who has not drawn its yoke, and has not been bound in its chains.
translation:
  language: pt
  text: Bem-aventurado aquele que foi protegido dela[a], que não passou por sua fúria, que não puxou o seu jugo e não foi amarrado com suas correntes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os pronomes femininos se referem à língua destrutiva personificada no contexto anterior.
    reason: Esclarece o antecedente contextual dos pronomes femininos, preservado em português.
lexical_decisions:
- source_word: μακάριος
  choice: Feliz
  rationale: Forma natural e corrente da linguagem sapiencial de bem-aventurança, sem reduzir a frase a uma emoção passageira.
- source_word: σκεπασθεὶς ἀπʼ αὐτῆς
  choice: foi protegido dela
  rationale: O particípio passivo expressa ter sido coberto ou resguardado do perigo; “protegido” comunica claramente o sentido em português moderno.
- source_word: διῆλθεν ἐν τῷ θυμῷ αὐτῆς
  choice: passou pela sua fúria
  rationale: Preserva a imagem de atravessar ou passar por uma experiência e traduz θυμός como uma força intensa e destrutiva.
- source_word: εἵλκυσεν τὸν ζυγὸν αὐτῆς
  choice: arrastou o seu jugo
  rationale: Mantém tanto o sentido concreto de puxar ou arrastar quanto a metáfora do jugo opressor, sem substituí-la por uma explicação.
- source_word: ἐν τοῖς δεσμοῖς αὐτῆς οὐκ ἐδέθη
  choice: não foi preso em suas correntes
  rationale: Reproduz a voz passiva e a imagem vívida de sujeição por vínculos ou correntes em linguagem acessível.
theological_decisions:
- issue: Referência dos pronomes femininos
  choice: Manter os pronomes no feminino (“dela”, “sua”, “suas”), remetendo à língua destrutiva do contexto anterior.
  alternative: Explicitar novamente “a língua” no versículo.
  rationale: O grego mantém a referência feminina ao antecedente contextual. Em português, “língua” também é feminino, de modo que a personificação e a coesão podem ser preservadas naturalmente sem acrescentar palavras ao texto.
translation_notes:
  register: Português moderno, claro e digno, com imagens concretas preservadas. A formulação mantém o paralelismo do grego e evita explicar além do que o versículo afirma.
