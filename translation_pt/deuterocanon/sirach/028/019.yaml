review_pass:
  verdict: revise
  source_fidelity: A estrutura paralela e as imagens de proteção, fúria, jugo e vínculos são preservadas. Contudo, «Feliz» enfraquece o valor formular de μακάριος, «arrastou» sugere mais propriamente arrastar algo do que puxar/atrair o jugo, e «foi preso» pode ser entendido como detido por autoridades, não como amarrado.
  naturalness: «Bem-aventurado» é um registro sapiencial claro e estabelecido; «foi amarrado com suas correntes» comunica inequivocamente a metáfora de aprisionamento. «Puxou o jugo» preserva a imagem concreta, embora incomum de modo intencional.
  terminology: «Bem-aventurado» preserva adequadamente μακάριος. Mantêm-se «fúria», «jugo» e «correntes» para θυμός, ζυγός e δεσμοί, sem explicar ou atenuar as imagens. A nota explicita o antecedente feminino contextual dos pronomes.
  issues:
  - severity: medium
    issue: «Feliz» para μακάριος
    rationale: Embora possível em certos contextos, «Feliz» pode ser lido como estado emocional ou boa sorte. «Bem-aventurado» conserva melhor a fórmula de declaração sapiencial presente no grego.
  - severity: medium
    issue: «arrastou o seu jugo» para εἵλκυσεν τὸν ζυγὸν αὐτῆς
    rationale: «Arrastar» tende a evocar transportar algo pesadamente pelo chão. O verbo grego expressa puxar/atrair; «puxou» é mais próximo e mantém a imagem do jugo.
  - severity: medium
    issue: «não foi preso em suas correntes» para ἐν τοῖς δεσμοῖς αὐτῆς οὐκ ἐδέθη
    rationale: Em português moderno, «foi preso» pode significar detenção policial. «Foi amarrado com suas correntes» preserva a voz passiva e o sentido de ser atado por vínculos.
  revised_text: Bem-aventurado aquele que foi protegido dela[a], que não passou por sua fúria, que não puxou o seu jugo e não foi amarrado com suas correntes.
  revised_footnotes:
  - marker: a
