  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπόσχου
  choice: Afaste-se de
  rationale: O imperativo aoristo médio pede uma retirada deliberada. “Afaste-se de” é natural em português e comunica tanto evitar o envolvimento como abandonar a contenda.
- source_word: μάχης
  choice: brigas
  rationale: μάχη pode indicar luta, conflito ou disputa. No contexto sapiencial e interpessoal, “brigas” expressa com clareza a contenda que pode levar a outros pecados, sem restringir o sentido ao combate físico.
- source_word: ἐλαττώσεις
  choice: você reduzirá
  rationale: O futuro apresenta o resultado de evitar as brigas. “Reduzirá” preserva a relação entre a conduta ordenada e a diminuição dos pecados.
- source_word: ἁμαρτίας
  choice: os pecados
  rationale: O plural grego aponta para atos pecaminosos contáveis; por isso, mantém-se o plural “pecados”.
