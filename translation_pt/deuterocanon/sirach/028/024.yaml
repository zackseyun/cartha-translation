- source_word: καὶ τὸ χρυσίον
  choice: e o seu ouro
  rationale: Mantém o metal especificamente citado e o paralelismo com “prata”.
- source_word: κατάδησον
  choice: amarre bem
  rationale: O verbo expressa atar ou prender firmemente; “amarre bem” preserva a ação concreta e comunica a ideia de segurança em português corrente.
