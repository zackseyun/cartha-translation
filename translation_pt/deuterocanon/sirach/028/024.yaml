- source_word: περίφραξον
  choice: cerque
  rationale: O verbo indica rodear com uma cerca ou proteção; “cerque” mantém a imagem concreta e soa natural em português.
- source_word: τὸ κτῆμά σου
  choice: a sua propriedade
  rationale: κτῆμα designa aquilo que se possui, especialmente propriedade ou bens; “propriedade” conserva a amplitude do termo.
- source_word: ἀκάνθαις
