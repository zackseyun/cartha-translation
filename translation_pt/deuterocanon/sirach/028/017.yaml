  text: A blow from a whip makes welts[a], but a blow from the tongue shatters bones.
translation:
  language: pt
  text: O golpe de um chicote deixa vergões[a], mas o golpe da língua quebrará ossos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contusões”; o termo grego se refere às marcas deixadas por golpes.
    reason: lexical_alternative
lexical_decisions:
- source_word: πληγὴ
  choice: golpe
  rationale: Em ambas as orações, designa o impacto de uma pancada. Repetir “golpe” preserva o paralelismo entre a agressão física e a verbal.
- source_word: μάστιγος
  choice: de um chicote
  rationale: O genitivo identifica o instrumento do golpe; esta formulação mantém a imagem concreta e soa natural em português.
- source_word: ποιεῖ
  choice: deixa
  rationale: No contexto de marcas produzidas por um chicote, “deixa” expressa naturalmente o resultado do golpe e mantém o presente proverbial.
- source_word: μώλωπας
  choice: vergões
  rationale: O termo indica marcas ou contusões causadas por golpes. “Vergões” descreve com precisão as marcas lineares deixadas por um chicote.
- source_word: γλώσσης
  choice: da língua
  rationale: Mantém a metáfora concreta da língua como representação da fala nociva, sem explicá-la ou reduzi-la a “palavras”.
- source_word: συγκλάσει
  choice: quebrará
  rationale: O futuro grego é preservado, inclusive sua diferença em relação ao presente da primeira oração. “Quebrará” comunica com força a ruptura expressa pelo verbo composto.
- source_word: ὀστᾶ
  choice: ossos
  rationale: Reproduz diretamente o objeto plural e conserva a imagem hiperbólica do dano profundo causado pela língua.
