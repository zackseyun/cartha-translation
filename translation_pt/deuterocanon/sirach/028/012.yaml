translation:
  language: pt
  text: Havia uma brasa diante dele; ele soprou sobre ela[a], e a brasa se avivou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: “Se você soprar uma faísca, ela se inflamará; e, se cuspir sobre ela, ela se apagará; ambas as coisas saem da sua boca”. O testemunho hebraico é mais curto: “Havia uma brasa diante dele; ele soprou sobre ela, e a brasa se avivou”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָיְתָה
  choice: Havia
  rationale: Expressa naturalmente em português o valor existencial da abertura hebraica.
- source_word: לְפָנָיו
  choice: diante dele
  rationale: Preserva o sentido espacial e o sufixo masculino singular do testemunho hebraico.
- source_word: גַחֶלֶת
  choice: uma brasa
  rationale: “Brasa” é a equivalência portuguesa mais natural para גַחֶלֶת neste contexto; mantém a imagem de carvão incandescente sem seguir o grego “faísca”.
- source_word: נָפַח בָּה
  choice: ele soprou sobre ela
  rationale: Reproduz a ação concreta de soprar na brasa para avivar o fogo e mantém a referência pronominal explícita.
- source_word: וּבָעֲרָה
  choice: e ela se acendeu
  rationale: 'Comunica o resultado incoativo da ação: a brasa passou a arder com mais força. É natural em português e não exagera a intensidade do verbo.'
- source_word: ἐὰν φυσήσῃς σπινθῆρα ἐκκαήσεται
  choice: considerado, mas não seguido no texto principal
  rationale: O paralelo grego traz a formulação na segunda pessoa, usa “faísca” e amplia o provérbio. Como o hebraico está preservado e tem alta confiança, ele rege o texto principal; a forma grega é registrada em nota.
