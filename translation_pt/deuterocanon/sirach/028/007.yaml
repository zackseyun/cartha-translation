  source_fidelity: 'A estrutura principal e os termos centrais estão bem preservados: μνήσθητι é corretamente retomado antes de «a aliança do Altíssimo», διαθήκη é «aliança», e ἄγνοια permanece «ignorância». Contudo, «não guarde ira» introduz a nuance de reter ou alimentar ressentimento, que não é expressa pelo simples μηνίσῃς («não se zangue / não se ire»).'
  naturalness: «Lembre-se», «aliança do Altíssimo» e «releve a ignorância» são claros, dignos e adequados ao português moderno de ampla compreensão. «Não se zangue com o seu próximo» é mais direto e natural do que «não guarde ira contra o seu próximo», sem reduzir o sentido de μηνίσῃς.
  terminology: «Mandamentos», «próximo», «aliança» e «Altíssimo» mantêm a terminologia bíblica estabelecida sem introduzir qualificações ausentes do grego. A nota deve distinguir a alternativa lexical da explicação contextual, pois «falta cometida por ignorância» é uma possível implicação, não o equivalente literal do substantivo ἄγνοιαν.
