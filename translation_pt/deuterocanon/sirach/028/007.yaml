base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/007.yaml
  text: Remember the commandments[a], and do not be angry with your neighbor; remember the covenant of the Most High, and overlook ignorance.
translation:
  language: pt
  text: Lembre-se dos mandamentos e não se zangue com o seu próximo; lembre-se da aliança do Altíssimo e releve a ignorância.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «deixe passar a ignorância». Pode referir-se a não levar em conta uma falta decorrente de ignorância.'
    reason: Alternativa lexical para πάριδε ἄγνοιαν e esclarecimento contextual cauteloso da possível implicação ética.
lexical_decisions:
- source_word: μνήσθητι
  choice: Lembre-se
  rationale: O imperativo aoristo médio pede uma recordação ativa. A repetição do verbo na segunda oração explicita em português a elipse grega sem acrescentar conteúdo.
- source_word: ἐντολῶν
  choice: dos mandamentos
  rationale: Preserva o sentido moral e religioso do plural, sem acrescentar o qualificativo ausente «da Lei».
- source_word: μὴ μηνίσῃς
  choice: não guarde ira
  rationale: μηνίω expressa ira persistente ou ressentida. «Não guarde ira» é natural no contexto de perdão e conserva melhor essa nuance do que a formulação ampla «não fique irado».
- source_word: τῷ πλησίον
  choice: contra o seu próximo
  rationale: πλησίον tem aqui o sentido ético de «próximo»; «guardar ira contra» é construção idiomática em português.
- source_word: διαθήκην Ὑψίστου
  choice: a aliança do Altíssimo
  rationale: διαθήκη é o termo bíblico usual para «aliança», e o genitivo é mantido como «do Altíssimo», sem interpretá-lo como «com o Altíssimo».
- source_word: πάριδε
  choice: releve
  rationale: O imperativo transmite a ideia de deixar passar ou não levar em conta. «Releve» comunica indulgência diante de uma falta sem sugerir que ela seja negada.
- source_word: ἄγνοιαν
  choice: a ignorância
  rationale: Mantém o substantivo grego em sua forma direta e preserva a possível referência tanto à falta de conhecimento quanto a uma ofensa cometida por ignorância.
theological_decisions:
- issue: Elipse do verbo diante de «a aliança do Altíssimo»
  choice: Repetir «lembre-se» na segunda oração.
  alternative: 'Manter a frase nominal: «e a aliança do Altíssimo».'
  rationale: A repetição torna clara em português a relação sintática implícita no grego, sem resolver qualquer questão doutrinária nem acrescentar conteúdo.
- issue: Sentido ético de ἄγνοιαν
  choice: Conservar «ignorância» no texto e esclarecer em nota a possível ideia de uma falta involuntária.
  alternative: Traduzir diretamente como «uma ofensa cometida por ignorância».
  rationale: O grego traz o substantivo amplo «ignorância»; a tradução preserva essa amplitude, enquanto a nota apresenta a implicação contextual sem inseri-la no texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário bíblico reconhecível. «Seu próximo» favorece a legibilidade brasileira sem impedir a compreensão internacional; «releve» expressa de modo conciso a exortação à indulgência.
