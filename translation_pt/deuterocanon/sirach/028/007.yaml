  - severity: low
    issue: A nota apresenta «falta cometida por ignorância» como se fosse uma alternativa direta.
    rationale: O grego diz literalmente «ignorância». A referência a uma falta decorrente de ignorância é contextual e deve ser introduzida como explicação possível, não como tradução equivalente.
