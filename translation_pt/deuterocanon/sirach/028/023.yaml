base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/023.yaml
  text: Those who forsake the Lord will fall into it[a], and it will burn among them and will certainly not be quenched; it will be sent against them like a lion[c][b], and like a leopard it will ravage them.
translation:
  language: pt
  text: Os que abandonam o Senhor cairão nela[a]. Ela arderá entre eles[b] e de modo nenhum se apagará; será enviada contra eles como um leão e, como um leopardo[c], os devastará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nela” retoma a força destrutiva descrita no contexto anterior, especialmente a língua e sua fala nociva.
    reason: cross_reference
  - marker: b
    text: 'Ou: “Ela será acesa neles”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “pantera”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ καταλείποντες Κύριον
  choice: Os que abandonam o Senhor
  rationale: O particípio caracteriza os que deixam ou abandonam; “abandonam” expressa com naturalidade a ruptura em relação ao Senhor, sem acrescentar conteúdo ao grego.
- source_word: ἐμπεσοῦνται εἰς αὐτήν
  choice: cairão nela
  rationale: Reproduz diretamente o sentido de “cair em”. O pronome feminino é natural em português e remete à realidade feminina mencionada no contexto anterior, especialmente a língua destrutiva.
- source_word: ἐν αὐτοῖς ἐκκαήσεται
  choice: Ela arderá entre eles
  rationale: Mantém a imagem de fogo e permite entender ἐν αὐτοῖς como atuação no meio deles. A possível leitura mais interior, “neles”, é preservada em nota.
- source_word: οὐ μὴ σβεσθῇ
  choice: de modo nenhum se apagará
  rationale: A construção enfática οὐ μή exige mais do que uma simples negação; “de modo nenhum” preserva essa força em português corrente e digno.
- source_word: ἐξαποσταλήσεται ἐπʼ αὐτοῖς
  choice: será enviada contra eles
  rationale: O futuro passivo indica que ela será enviada, e ἐπί tem força hostil no contexto. “Contra eles” comunica isso sem intensificação interpretativa.
- source_word: ὡς λέων
  choice: como um leão
  rationale: Equivalência direta e natural da comparação grega.
- source_word: ὡς πάρδαλις
  choice: como um leopardo
  rationale: “Leopardo” é o equivalente moderno mais reconhecível para πάρδαλις, embora “pantera” também seja possível.
- source_word: λυμανεῖται αὐτούς
  choice: os devastará
  rationale: O verbo exprime dano violento ou ruína. “Devastará” preserva a amplitude do sentido e combina com a imagem dos animais predadores.
theological_decisions:
- issue: Referente de αὐτήν e do sujeito feminino implícito ao longo do versículo
  choice: Manter “nela/ela”, remetendo à força destrutiva da língua ou da fala nociva no contexto imediato.
  alternative: Explicitar “a língua” no texto principal ou evitar o feminino por meio de uma paráfrase.
  rationale: O grego não repete o antecedente neste versículo. Como o português permite conservar naturalmente o pronome feminino, a tradução mantém a referência contextual sem inserir uma identificação explícita que o versículo não formula.
- issue: Localização do fogo em ἐν αὐτοῖς
  choice: “entre eles” no texto principal.
  alternative: “neles”, com possível sentido mais interior.
  rationale: A preposição admite as duas nuances no contexto. “Entre eles” favorece a imagem da propagação destrutiva, enquanto a nota conserva a leitura alternativa sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A pontuação divide o período longo sem perder sua progressão. Os pronomes femininos preservam a coesão com o contexto grego, e a negação enfática é expressa de forma natural.
