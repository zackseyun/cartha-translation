  yaml_path: translation/deuterocanon/sirach/028/010.yaml
  text: As the fuel of a fire, so it will be kindled; according to a man's strength, so will his wrath be; and according to his wealth he will raise up his anger, and according to the firmness of the conflict it will be kindled.
translation:
  language: pt
  text: Conforme o combustível do fogo, assim ele se inflamará; conforme a força do homem, assim será o seu furor; conforme a sua riqueza, ele aumentará a sua ira; e conforme a intensidade do conflito, ele se inflamará.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A última frase também pode ser entendida: “e conforme a firmeza da contenda, ela se inflamará”. O grego conserva uma imagem compacta cuja referência exata é ambígua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕλην
  choice: combustível
  rationale: No contexto de πυρός, designa a matéria que alimenta o fogo; “combustível” é natural em português e não restringe o sentido a “lenha”.
- source_word: ἐκκαυθήσεται
  choice: se inflamará
  rationale: Preserva a metáfora de algo que pega fogo e permite repetir a mesma expressão na cláusula final, como no grego.
- source_word: ἰσχὺν
  choice: força
  rationale: Equivalente direto e corrente para a capacidade ou vigor do homem.
- source_word: ἀνθρώπου
  choice: do homem
  rationale: Mantém o singular genérico e a forma proverbial do grego, em linguagem portuguesa tradicionalmente compreensível.
- source_word: θυμός
  choice: furor
  rationale: Expressa a ira intensa e mantém alguma distinção em relação a ὀργή, traduzido por “ira”.
- source_word: πλοῦτον
  choice: riqueza
  rationale: Refere-se aos recursos ou meios materiais do homem e corresponde naturalmente ao termo grego.
- source_word: ἀνυψώσει
  choice: aumentará
  rationale: Transmite no contexto a elevação ou intensificação da ira; a tradução literal “erguerá” seria menos natural e potencialmente obscura em português.
- source_word: ὀργήν
  choice: ira
  rationale: Termo digno e corrente que preserva, sem exagerar, a distinção lexical em relação a θυμός.
- source_word: στερέωσιν
  choice: intensidade
  rationale: No vínculo com μάχη, comunica naturalmente a força ou o grau de consolidação do conflito, evitando o português pouco idiomático “firmeza do conflito”.
- source_word: μάχης
  choice: conflito
  rationale: Abrange luta, contenda ou confronto interpessoal sem impor uma cena estritamente militar.
theological_decisions:
- issue: Singular genérico de ἀνθρώπου
  choice: do homem
  alternative: da pessoa
  rationale: Preserva a forma singular proverbial do texto e a referência masculina gramatical, sem acrescentar uma distinção doutrinária.
- issue: Distinção entre θυμός e ὀργή
  choice: θυμός = “furor”; ὀργή = “ira”
  alternative: traduzir ambos por “ira”
  rationale: O grego emprega dois termos próximos, mas distintos; a tradução conserva uma diferença perceptível sem pressupor uma separação técnica entre eles.
- issue: Referentes alternados nas comparações
  choice: manter “ele/seu” com referência ao homem e repetir “ele se inflamará” para o fogo ou conflito
  alternative: explicitar todos os referentes interpretativamente
  rationale: A redação mantém a tensão e a concisão do grego em vez de identificar de modo definitivo todos os sujeitos elípticos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela foi preservada por meio da repetição de “conforme”, e a metáfora do fogo foi mantida sem resolver além do necessário os referentes elípticos do grego.
