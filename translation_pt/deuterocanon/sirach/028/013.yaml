  text: Curse the whisperer and the double-tongued[a], for they have destroyed many who were at peace.
translation:
  language: pt
  text: Amaldiçoem o que fala em segredo e o de língua dupla[a], pois eles destruíram muitos que viviam em paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico preservado aqui é difícil e parece dizer, mais literalmente: «Cuspa nela, e ela se apagará», seguido da continuação entre colchetes: «ambas vêm da sua boca». O paralelo grego diz: «Amaldiçoem o que fala em segredo e o de língua dupla»; essa leitura foi adotada no texto principal por ser mais clara no contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ψίθυρον
  choice: o que fala às escondidas
  rationale: Expressa a fala secreta e maliciosa indicada pelo grego, evitando «murmurador», que em português pode sugerir apenas alguém que reclama.
- source_word: δίγλωσσον
  choice: o que tem língua dupla
  rationale: Mantém a metáfora grega da fala dúplice sem substituí-la por uma interpretação como «falso» ou «duas caras».
- source_word: καταράσθε
  choice: Amaldiçoem
  rationale: Reproduz diretamente o imperativo plural grego e o tom vigoroso da advertência.
- source_word: εἰρηνεύοντας
  choice: que viviam em paz
  rationale: Conserva o sentido verbal do particípio, que descreve pessoas vivendo em condição de paz.
- source_word: רָקַק בָּהּ וְכָבְתָה
  choice: «Cuspa nela, e ela se apagará» (nota)
  rationale: O hebraico preservado diverge fortemente do grego e apresenta a imagem de algo que se apaga; essa leitura é documentada na nota em vez de ser ocultada.
- source_word: '[וּשְׁנֵיהֶם מִפִּיךָ הֵם]'
  choice: «ambas vêm da sua boca» (nota)
  rationale: A continuação hebraica está entre colchetes na edição e é textual e contextualmente incerta; por isso, é traduzida literalmente na nota.
theological_decisions:
- issue: Divergência entre o hebraico preservado e o paralelo grego
  choice: Seguir no texto principal a advertência grega contra a fala secreta e a língua dupla.
  alternative: 'Traduzir o hebraico: «Cuspa nela, e ela se apagará; ambas vêm da sua boca».'
  rationale: Embora o hebraico seja normalmente prioritário quando preservado, aqui sua formulação é difícil e a continuação é assinalada como incerta. O grego oferece uma unidade coerente com o contexto sobre os danos da fala. A nota preserva abertamente a leitura hebraica, sem eliminar a tensão textual.
translation_notes:
  register: Português moderno, digno e de leitura ampla. «Fala às escondidas» comunica linguagem secreta e danosa sem recorrer a termo arcaico; «língua dupla» conserva a metáfora antiga. O plural «eles» retoma naturalmente as duas figuras mencionadas.
