translation:
  language: pt
  text: Ele, sendo carne, guarda rancor; quem fará expiação pelos pecados dele?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico preservado desta linha é difícil e parece corrompido ou muito elíptico na tradição da Guenizá do Cairo. O grego diz: “Ele mesmo, sendo carne, guarda rancor; quem fará expiação por seus pecados?”. A tradução segue esse sentido recuperável.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “alimenta a ira”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “quem perdoará seus pecados?”. O verbo grego tem, mais especificamente, o sentido de fazer expiação ou expiar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַל מֵחָתָן, אֹרֵחַ מַכְנִיס אֹרֵחַ
  choice: sentido recuperado pelo paralelo grego
  rationale: O hebraico preservado parece corrompido ou extremamente elíptico e não produz, neste contexto, uma linha coerente com segurança. Por isso, o texto principal segue o sentido completo atestado no paralelo grego, enquanto a dificuldade hebraica é registrada em nota.
- source_word: σὰρξ ὢν
  choice: sendo carne
  rationale: Mantém a imagem antropológica concreta do grego e a ideia de fragilidade mortal, sem introduzir a interpretação técnica de 'natureza pecaminosa'.
- source_word: διατηρεῖ μῆνιν
  choice: guarda rancor
  rationale: Exprime a manutenção persistente da ira em português natural. 'Rancor' comunica melhor uma ira alimentada e conservada do que a formulação pouco idiomática 'guarda ira'.
- source_word: τίς ἐξιλάσεται τὰς ἁμαρτίας αὐτοῦ
  choice: quem fará expiação por seus pecados?
  rationale: Preserva o valor expiatório do verbo grego e emprega uma construção portuguesa clara, sem reduzi-lo simplesmente a 'perdoar'.
theological_decisions:
- issue: Sentido antropológico de σάρξ
  choice: sendo carne
  alternative: sendo mortal
  rationale: A expressão aponta para a fragilidade humana, mas a tradução concreta preserva a tensão e a linguagem bíblica sem impor uma doutrina específica da natureza pecaminosa.
- issue: Linguagem expiatória de ἐξιλάσεται
  choice: fará expiação
  alternative: perdoará
  rationale: O verbo grego tem sentido mais específico de expiar ou realizar expiação. A tradução mantém esse registro teológico sem determinar no texto quem seria o agente da expiação.
- issue: Base textual diante do hebraico difícil
  choice: seguir no texto principal o sentido recuperável do paralelo grego
  alternative: traduzir literalmente o fragmento hebraico como uma declaração sobre noivo e hóspede
  rationale: O hebraico transmitido é incoerente no contexto e provavelmente está corrompido; o grego conserva uma linha completa e contextual. A incerteza é explicitada em nota, em vez de ser ocultada.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem das notas segue sua ocorrência conceitual no versículo. A formulação conserva a imagem bíblica 'sendo carne' e a linguagem de expiação, esclarecendo em nota a condição textual excepcional.
