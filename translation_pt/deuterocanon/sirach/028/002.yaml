    reason: textual_variant
lexical_decisions:
- source_word: ἄφες
  choice: Perdoe
  rationale: O imperativo significa “perdoar” ou “deixar ir”. “Perdoe” é natural no contexto de uma ofensa entre pessoas.
- source_word: ἀδίκημα
  choice: a ofensa
  rationale: O termo designa um ato injusto ou dano cometido contra alguém; “ofensa” preserva esse sentido concreto e relacional.
- source_word: τῷ πλησίον σου
  choice: do seu próximo
  rationale: “Próximo” é a correspondência bíblica corrente e mantém o alcance ético do termo.
- source_word: δεηθέντος σου
  choice: quando você orar
  rationale: A construção indica a ocasião em que a pessoa faz uma súplica; “orar” comunica naturalmente a petição dirigida a Deus.
- source_word: αἱ ἁμαρτίαι σου λυθήσονται
  choice: seus pecados serão desatados
  rationale: O verbo significa literalmente “ser soltos/desatados”. “Desatados” conserva a metáfora original e evita substituí-la silenciosamente pela interpretação “perdoados”.
theological_decisions:
- issue: Seleção da fonte primária para este versículo
  choice: Traduzir o paralelo grego como o texto operativo de Sirácida 28:2 e registrar a divergência do hebraico fornecido.
  alternative: Traduzir o texto hebraico fornecido como Sirácida 28:2.
  rationale: O hebraico fornecido fala de alguém que talvez amanhã já não exista e sofre por um mundo que não lhe pertence, não correspondendo semanticamente a Sirácida 28:2. O grego apresenta a leitura coerente com a referência tradicional; por isso, ele fundamenta a tradução, sem ocultar o problema textual.
- issue: Metáfora de λύω aplicada aos pecados
  choice: Preservar a imagem com “serão desatados”.
  alternative: Traduzir interpretativamente como “serão perdoados”.
  rationale: A formulação mantém a metáfora genuína do grego e deixa explícita em nota a alternativa interpretativa, sem transformar a relação entre perdão ao próximo, oração e pecados em uma formulação doutrinária mais específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Seu próximo” mantém o registro bíblico sem arcaísmo excessivo; “desatados” conserva uma metáfora incomum, esclarecida em nota.
