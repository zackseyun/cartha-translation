  yaml_path: translation/deuterocanon/sirach/028/015.yaml
  text: A third tongue has driven out strong women[a], and has deprived them of the fruit of their labor;
translation:
  language: pt
  text: A terceira língua expulsou mulheres valentes[a] e as privou do fruto de seu trabalho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a língua divisora” ou “a língua caluniadora”. O grego diz literalmente “a terceira língua”, expressão que provavelmente descreve a fala que se intromete como terceira parte e separa pessoas.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα τρίτη
  choice: a terceira língua
  rationale: Mantém a expressão grega incomum e sua imagem concreta, sem resolver no texto principal se ela designa língua divisora, caluniadora ou maledicente.
- source_word: γυναῖκας ἀνδρείας
  choice: mulheres valentes
  rationale: ἀνδρείας indica coragem, força ou valor. “Valentes” é natural em português e preserva a referência explícita às mulheres.
- source_word: ἐξέβαλεν
  choice: expulsou
  rationale: Expressa diretamente a ideia de lançar para fora ou fazer sair, adequada ao dano social descrito.
- source_word: ἐστέρεσεν
  choice: privou
  rationale: Reproduz a ideia de causar falta ou retirar algo de alguém, sem especificar indevidamente o modo da perda.
- source_word: τῶν πόνων αὐτῶν
  choice: do fruto de seu trabalho
  rationale: Embora πόνων signifique literalmente “trabalhos” ou “fadigas”, a construção indica aquilo de que elas ficaram privadas; “fruto de seu trabalho” comunica naturalmente o resultado de seus esforços.
