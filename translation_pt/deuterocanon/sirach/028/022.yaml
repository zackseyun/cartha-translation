  yaml_path: translation/deuterocanon/sirach/028/022.yaml
  text: It will never overpower the godly[a], and they will not be burned in its flame.
translation:
  language: pt
  text: Ela jamais dominará os que reverenciam a Deus[a], e eles não serão queimados em sua chama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “jamais se apoderará dos devotos”. O verbo grego pode indicar apoderar-se de alguém, dominá-lo ou prevalecer contra ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  choice: jamais
  rationale: A construção οὐ μή com o subjuntivo aoristo expressa uma negação futura enfática. “Jamais” comunica essa força com naturalidade e concisão em português.
- source_word: κρατήσῃ
  choice: dominará
  rationale: κρατέω pode significar apoderar-se, segurar, dominar ou prevalecer contra alguém. No contexto da força destrutiva da língua comparada ao fogo, “dominará” exprime adequadamente a ideia de subjugar, sem reduzir o sentido a uma ação física.
- source_word: εὐσεβῶν
  choice: os que reverenciam a Deus
  rationale: O genitivo plural de εὐσεβής designa pessoas caracterizadas por reverência e devoção a Deus. A formulação escolhida é clara para leitores atuais e evita as possíveis conotações negativas ou excessivamente formais de “piedosos”.
- source_word: φλογί
  choice: chama
  rationale: φλόξ indica especificamente uma chama, e não apenas o fogo em sentido geral. “Chama” conserva a imagem vívida do texto grego.
- source_word: καήσονται
  choice: serão queimados
  rationale: O futuro passivo indica que essas pessoas sofreriam a ação de queimar. A tradução direta evita acrescentar a ideia mais forte de destruição completa implícita em “serão consumidos”.
theological_decisions:
- issue: Referente do pronome feminino αὐτῆς (“dela/sua”)
  choice: “sua”, em referência à língua e ao seu poder destrutivo figurado como fogo no contexto imediato
  alternative: “dela”, ressaltando de modo mais explícito a personificação da língua
  rationale: Em português, “sua chama” mantém a conexão contextual e a metáfora sem impor uma personificação mais forte do que o grego exige. A formulação também preserva alguma abertura referencial natural.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão ampla no mundo lusófono. “Os que reverenciam a Deus” comunica o valor religioso-moral de εὐσεβῶν sem recorrer a vocabulário arcaizante; “jamais dominará” preserva tanto a forte negação grega quanto a amplitude hostil de κρατέω.
