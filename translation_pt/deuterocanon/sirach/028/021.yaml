  text: Its death is an evil death[b][a], and its Hades is more advantageous.
translation:
  language: pt
  text: A morte dela é uma morte funesta[a], e o Hades dela é mais vantajoso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A morte dela é uma morte má” ou “uma morte terrível”. O pronome feminino retoma o antecedente feminino do contexto anterior, provavelmente a língua ou a fala caluniosa; no contexto, a expressão também pode referir-se à morte que ela causa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, em sentido comparativo: “o mundo dos mortos é preferível à morte dela”. “Hades” designa o mundo dos mortos.'
    reason: alternative_reading
lexical_decisions:
- source_word: θάνατος πονηρός ὁ θάνατος αὐτῆς
  choice: A morte que ela causa é uma morte terrível
  rationale: A repetição de θάνατος é preservada, enquanto a relação expressa por αὐτῆς é formulada de modo natural em português. “Terrível” comunica aqui o caráter funesto e devastador de πονηρός sem limitar o adjetivo à maldade moral.
- source_word: αὐτῆς
  choice: ela / a ela
  rationale: O pronome grego é feminino e retoma um antecedente feminino no contexto anterior, provavelmente a língua ou a fala caluniosa. O português permite conservar essa referência feminina.
- source_word: λυσιτελὴς μᾶλλον
  choice: é preferível
  rationale: Embora λυσιτελής possa significar “vantajoso” ou “proveitoso”, com μᾶλλον a construção estabelece uma comparação. “É preferível” expressa naturalmente em português que até o Hades constitui a opção menos ruinosa.
- source_word: ᾅδης
  choice: Hades
  rationale: Mantém o termo grego e sua referência ao mundo dos mortos, sem reduzi-lo à sepultura física nem identificá-lo com uma concepção doutrinária posterior de inferno.
theological_decisions:
- issue: Sentido de ᾅδης
  choice: Hades
  alternative: mundo dos mortos; morada dos mortos; sepultura
  rationale: “Hades” corresponde diretamente ao grego e preserva a amplitude do termo, evitando tanto uma leitura meramente física quanto a importação da ideia posterior de lugar de punição final.
- issue: Objeto implícito da comparação
  choice: é preferível a ela
  alternative: o Hades dela é mais vantajoso
  rationale: O grego é compacto e pode ser entendido literalmente como “o Hades dela é mais vantajoso”. A tradução principal explicita a comparação sugerida por μᾶλλον, mas a nota preserva a construção alternativa e sua ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário acessível. A formulação principal torna explícita a comparação implícita e mantém “Hades” como termo técnico transliterado; as notas registram a sintaxe mais literal e a referência feminina.
