  text: And make for your words a balance and a measure[a], and make for your mouth a door and a bolt.
translation:
  language: pt
  text: E ponha uma balança e um peso para suas palavras[a]; ponha uma porta e uma tranca em sua boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O termo grego traduzido como “balança” costuma significar “jugo”; aqui, porém, associado a “peso”, evoca uma balança: a imagem é a de pesar e controlar cuidadosamente as próprias palavras.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγοις
  choice: palavras
  rationale: Refere-se aqui ao que a pessoa diz; “palavras” é direto, natural e preserva o caráter concreto da exortação.
- source_word: ζυγόν
  choice: balança
  rationale: Embora ζυγός frequentemente signifique “jugo”, sua associação com σταθμός evoca aqui o instrumento de pesagem e, metaforicamente, a avaliação cuidadosa da fala.
- source_word: σταθμόν
  choice: peso
  rationale: O termo pode designar o peso-padrão usado numa balança. “Peso” mantém a imagem concreta da pesagem e a associação natural com “balança”.
- source_word: στόματί
  choice: boca
  rationale: A tradução literal preserva a imagem concreta de controlar a fala por meio de uma barreira colocada na boca.
- source_word: θύραν
  choice: porta
  rationale: Equivalente direto que mantém a metáfora de fechar o acesso e restringir o que sai da boca.
- source_word: μοχλόν
  choice: tranca
  rationale: μοχλός designa uma barra ou dispositivo que mantém uma porta fechada; “tranca” é corrente em português e comunica claramente a ideia de contenção firme.
- source_word: ποίησον
  choice: ponha
  rationale: Neste contexto metafórico, “ponha” soa mais natural do que “faça” em português, sem perder a força imperativa; sua repetição preserva o paralelismo grego.
