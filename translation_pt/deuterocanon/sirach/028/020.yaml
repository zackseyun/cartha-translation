  text: For her yoke is an iron yoke[a], and her bonds are bronze bonds.
translation:
  language: pt
  text: Pois o jugo dela é um jugo de ferro, e as cadeias dela são cadeias de bronze.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζυγός
  choice: jugo
  rationale: Preserva a imagem concreta de sujeição e opressão, em vez de generalizá-la como mero “peso” ou “fardo”.
- source_word: σιδηροῦς
  choice: de ferro
  rationale: Expressa diretamente que o jugo é feito de ferro e mantém a força proverbial da imagem grega.
- source_word: δεσμοί
  choice: amarras
  rationale: Indica vínculos que prendem ou restringem sem especificar, além do texto, que sejam correntes ou grilhões; a repetição conserva o paralelismo do grego.
- source_word: χαλκεῖοι
  choice: de bronze
  rationale: É a forma moderna e natural de designar o metal de que são feitas as amarras neste contexto bíblico.
- source_word: αὐτῆς
  choice: dela
  rationale: Mantém a referência feminina do grego. Em português, “dela” concorda naturalmente com o antecedente feminino e também permite perceber a personificação no contexto.
theological_decisions:
- issue: Manutenção da personificação feminina
  choice: Usar “dela” nas duas ocorrências
  alternative: Reformular de modo impessoal, como “seu jugo” e “suas amarras”
  rationale: O grego repete o pronome feminino αὐτῆς. “Dela” preserva essa repetição e a força literária sem impor uma interpretação doutrinária; em português, a forma também é exigida naturalmente pelo antecedente gramatical feminino.
translation_notes:
  register: Português atual, claro e digno. A repetição de “jugo” e “amarras” reproduz deliberadamente o paralelismo enfático do original. Não se acrescentou nota sobre “dela” versus uma referência impessoal porque, em português, o gênero feminino do pronome acompanha naturalmente o antecedente e não permite a mesma oposição formal existente em inglês.
