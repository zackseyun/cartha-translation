translation:
  language: pt
  text: Uma pessoa guarda ira contra outra e busca cura do Senhor?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A testemunha hebraica fornecida para esta referência diz: “Pesei tudo no prato da balança e não achei nada mais leve que o farelo [ou: a palha]”, texto que não corresponde ao contexto deste versículo. Por isso, a tradução segue a testemunha grega de Sirácida 28:3.'
    reason: textual_variant
lexical_decisions:
- source_word: ἄνθρωπος ἀνθρώπῳ
  choice: uma pessoa contra outra
  rationale: Os dois usos de ἄνθρωπος têm sentido humano genérico. A formulação é natural em português e evita sugerir que a advertência se limite aos homens.
- source_word: συντηρεῖ
  choice: guarda
  rationale: Expressa a conservação contínua da ira, e não apenas uma reação momentânea.
- source_word: ὀργήν
  choice: ira
  rationale: Mantém a força moral e retórica do termo grego sem chegar ao sentido mais extremo de 'fúria'.
- source_word: παρὰ Κυρίου
  choice: ao Senhor
  rationale: Com o verbo 'pedir', o português natural marca por 'ao Senhor' aquele de quem se busca receber a cura; κύριος é traduzido segundo o uso bíblico corrente.
- source_word: ζητεῖ ἴασιν
  choice: pede ... que a cure
  rationale: Reformula idiomaticamente 'busca cura' sem restringir a cura a uma enfermidade física; o pronome retoma a pessoa genérica.
theological_decisions:
- issue: Conflito entre a testemunha hebraica fornecida e o paralelo grego
  choice: Traduzir o texto grego correspondente a Sirácida 28:3 e registrar a divergência em nota.
  alternative: 'Traduzir literalmente o hebraico fornecido: “Pesei tudo no prato da balança e não achei nada mais leve que o farelo/a palha.”'
  rationale: A linha hebraica fornecida não corresponde ao contexto de Sirácida 28:3 e parece pertencer a outro dito. O grego preserva uma leitura coerente com a sequência sobre ira, perdão e misericórdia.
- issue: Alcance de ἴασις
  choice: cura em sentido deliberadamente amplo
  alternative: cura exclusivamente física ou restauração exclusivamente moral
  rationale: O termo pode evocar cura física, moral ou relacional. A tradução não resolve essa amplitude de modo indevido.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A pergunta retórica foi preservada. “Uma pessoa ... outra” comunica o caráter universal da advertência; “guarda ira” mantém a ideia de ressentimento continuado.
