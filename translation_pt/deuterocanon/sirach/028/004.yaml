  text: He has no mercy on a man like himself[b][a], yet he asks for his own sins to be forgiven?
translation:
  language: pt
  text: Ele não tem misericórdia de alguém como ele[a] e ainda pede que seus próprios pecados sejam perdoados?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A linha hebraica existente dos manuscritos da Guenizá do Cairo fornecida para este versículo parece não lhe corresponder; por isso, a tradução segue aqui o testemunho grego.
    reason: textual_variant
  - marker: b
    text: 'Mais literalmente: “e pede acerca dos seus pecados?” O grego deixa implícito o que ele pede; o texto principal explicita que busca perdão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπʼ ἄνθρωπον ὅμοιον αὐτῷ
  choice: de alguém como ele
  rationale: A expressão grega designa outro ser humano semelhante ao próprio sujeito. “Alguém como ele” comunica essa relação de modo natural e abrangente em português, sem perder o singular.
- source_word: οὐκ ἔχει ἔλεος
  choice: não tem misericórdia
  rationale: Preserva de perto a construção grega e emprega o termo ético e teológico corrente “misericórdia”, adequado ao contexto de perdão.
- source_word: καὶ περὶ τῶν ἁμαρτιῶν αὐτοῦ δεῖται
  choice: e ainda pede que seus próprios pecados sejam perdoados?
  rationale: δεῖται pode significar pedir, suplicar ou rogar. O objeto exato do pedido fica implícito no grego; o texto principal explicita o perdão sugerido pelo contexto, enquanto “e ainda” torna natural o contraste retórico em português.
theological_decisions:
- issue: Seleção da fonte primária diante de uma linha hebraica incompatível
  choice: Traduzir o testemunho grego correspondente a Sirácida 28:4 e registrar a incompatibilidade do hebraico
  alternative: Traduzir literalmente a linha hebraica fornecida, embora ela não corresponda ao versículo nem ao contexto
  rationale: A linha hebraica preservada e fornecida — sobre um noivo que mora na casa do sogro — não corresponde a Sirácida 28:4. O grego, por sua vez, se encaixa no contexto imediato sobre ira, misericórdia e perdão. A tradução segue, portanto, o testemunho grego, sem ocultar a situação textual.
- issue: Objeto implícito do pedido do pecador
  choice: Explicitar no texto principal que ele pede o perdão dos próprios pecados
  alternative: 'Manter a formulação mais literal e ambígua: “pede acerca dos seus pecados”'
  rationale: O grego não declara expressamente o resultado solicitado, mas o contexto indica uma súplica por perdão. A explicitação produz português claro sem transformar a inferência contextual em certeza silenciosa, pois a nota preserva a forma literal.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A pergunta retórica e sua tensão moral foram preservadas; “e ainda” expressa naturalmente o contraste contextual sem acrescentar uma conclusão doutrinária.
