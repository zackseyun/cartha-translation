  text: For an angry man kindles strife[a], and a sinful man stirs up friends[b], and among those making peace he casts slander.
translation:
  language: pt
  text: Pois o homem irascível atiça uma briga, e o homem pecador agita amigos; entre os que vivem em paz, ele lança calúnia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμώδης
  choice: irascível
  rationale: O adjetivo descreve alguém caracterizado pela ira ou por um temperamento pronto a se inflamar. “Irascível” é conciso, digno e preserva a descrição de caráter.
- source_word: ἐκκαύσει μάχην
  choice: atiça uma briga
  rationale: O verbo evoca acender ou fazer o fogo crescer; “atiça” conserva essa imagem. Neste contexto sapiencial, μάχη indica briga ou conflito, não necessariamente combate físico.
- source_word: ἁμαρτωλός
  choice: pecador
  rationale: “Homem pecador” mantém o paralelismo com “homem irascível” e representa diretamente a caracterização moral do grego.
- source_word: ταράξει φίλους
  choice: perturba amigos
  rationale: ταράσσω pode significar perturbar, agitar ou lançar em desordem. A formulação mantém em aberto se os amigos ficam apenas inquietos ou se sua amizade é abalada.
- source_word: εἰρηνευόντων
  choice: os que vivem em paz
  rationale: O particípio pode descrever pessoas que estão ou vivem em paz; conforme a extensão semântica do verbo, também pode sugerir pessoas empenhadas em promover a paz. A tradução principal evita tornar obrigatória esta última leitura.
- source_word: ἐκβάλλει διαβολήν
  choice: lança calúnia
  rationale: διαβολή designa acusação difamatória ou calúnia, enquanto ἐκβάλλει conserva a imagem vigorosa de lançar algo no meio de outras pessoas.
- source_word: ἄνθρωπος / ἀνήρ
  choice: homem
  rationale: Os dois substantivos masculinos singulares formam um paralelismo proverbial. “Homem” preserva a forma do texto, embora a observação sapiencial tenha aplicação representativa.
theological_decisions:
- issue: Linguagem masculina representativa no provérbio sapiencial
  choice: Manter “homem” nos dois membros paralelos
  alternative: Usar “pessoa”
  rationale: O grego emprega dois substantivos masculinos singulares em paralelismo. A tradução conserva essa forma sem restringir a validade da advertência apenas aos homens.
- issue: Sentido de εἰρηνευόντων
  choice: “os que vivem em paz”
  alternative: “os que promovem a paz”
  rationale: O particípio admite a ideia de estar ou viver em paz e pode, em certos contextos, ter força ativa de promover a paz. A leitura escolhida preserva melhor a amplitude semântica, e a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Irascível” mantém o tom sapiencial; “atiça uma briga” preserva de modo natural a metáfora de fogo. A alternância entre os futuros gregos e o presente final foi vertida como presente proverbial uniforme, uso idiomático em português.
