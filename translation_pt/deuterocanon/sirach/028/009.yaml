  - severity: low
    issue: “Perturba amigos” pode atenuar a agitação relacional de ταράσσει.
    rationale: Embora seja possível, “agita amigos” conserva melhor a ideia de lançar pessoas em perturbação, sem explicitar que a amizade foi desfeita.
