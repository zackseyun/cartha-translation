  source_fidelity: A tradução reproduz bem os três membros e a imagem de ἐκκαύσει (“atiça”). “Os que vivem em paz” é uma leitura natural de εἰρηνευόντων, verbo que pode denotar estar/viver em paz; a nota proposta, porém, apresenta “promovem a paz” como se fosse alternativa equivalente e mais provável do que os dados gregos justificam. O texto deve conservar a leitura não instrumental de pessoas em paz.
  naturalness: O português é claro, proverbial e de boa legibilidade. “Irascível” e “atiça uma briga” mantêm registro sapiencial natural. “Perturba amigos” é compreensível, mas “agita amigos” expressa mais diretamente o efeito social de ταράσσει sem especificar indevidamente que eles se tornam inimigos.
  terminology: “Homem”, “pecador” e “calúnia” são adequados e preservam o paralelismo e o sentido moral do grego. Não é necessária nota para εἰρηνευόντων quando a tradução principal já comunica seu sentido mais direto.
  issues:
