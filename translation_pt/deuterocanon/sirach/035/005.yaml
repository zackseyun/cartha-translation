translation:
  language: pt
  text: Renova um sinal e repete uma maravilha[a]; glorifica a mão e fortalece o braço e a mão direita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diverge substancialmente neste ponto: fala de um selo de pedra vermelha sobre um adorno de ouro e da harmonia de músicos num banquete com vinho. Como a testemunha hebraica está preservada e tem alta confiança, a tradução segue o hebraico; a redação grega é registrada como uma variante paralela importante.'
    reason: textual_variant
lexical_decisions:
- source_word: חדש
  choice: Renova
  rationale: O imperativo pede uma nova manifestação ou renovação, sem determinar se o ato é inteiramente novo.
- source_word: אות
  choice: um sinal
  rationale: “Sinal” é o equivalente bíblico mais direto e transparente para אות.
- source_word: ושנה
  choice: e repete
  rationale: שנה tem aqui o sentido de fazer novamente; “repete” preserva a força do imperativo.
- source_word: מופת
  choice: uma maravilha
  rationale: “Maravilha” expressa um ato extraordinário e combina naturalmente com “sinal” no registro bíblico.
- source_word: האדר
  choice: torna gloriosa
  rationale: A forma causativa pede que a majestade ou glória seja manifestada. A expressão mantém o objeto explícito sem substituir a imagem por uma abstração.
- source_word: יד
  choice: a mão
  rationale: A tradução literal conserva a imagem antropomórfica hebraica do poder em ação.
- source_word: ואמץ
  choice: e fortalece
  rationale: Verte diretamente a ideia de tornar forte ou firme.
- source_word: זרוע
  choice: o braço
  rationale: Mantém a metáfora corporal tradicional de força ativa.
- source_word: וימין
  choice: e a mão direita
  rationale: O hebraico designa especificamente a direita; a explicitação de “mão” produz português natural e preserva a imagem.
theological_decisions:
- issue: Linguagem antropomórfica para o poder divino
  choice: Manter literalmente “mão”, “braço” e “mão direita”
  alternative: Parafrasear como “poder” ou “força”
  rationale: As imagens corporais fazem parte da textura teológica do hebraico e não devem ser reduzidas a conceitos abstratos.
- issue: Relação entre a testemunha hebraica e o paralelo grego divergente
  choice: Seguir o hebraico de alta confiança
  alternative: Traduzir segundo as imagens gregas do selo, do adorno de ouro e da música em um banquete
  rationale: A testemunha hebraica está preservada e validada com alta confiança; o grego apresenta uma redação substancialmente diferente e deve ser registrado como variante, não usado como base.
- issue: Possessivos não expressos nas imagens corporais
  choice: Conservar os artigos definidos sem acrescentar “tua”
  alternative: Traduzir “tua mão”, “teu braço” e “tua mão direita”
  rationale: Embora o contexto permita entender que se trata da ação divina, o hebraico não traz possessivos. A formulação escolhida preserva a concisão e a leve ambiguidade do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe imperativa e as imagens corporais foram mantidas próximas do hebraico; evitou-se acrescentar possessivos ausentes no texto-fonte.
