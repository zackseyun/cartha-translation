translation:
  language: pt
  text: Reúne todas as tribos de Jacó[a], e que recebam a sua herança como nos dias de outrora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego deste versículo traz, em vez disso: “No meio dos nobres, não te faças igual a eles; e, quando outro estiver falando, não tagareles muito.” Isso parece refletir outra linha textual ou um desalinhamento dos versículos em relação ao hebraico preservado.'
    reason: textual_variant
lexical_decisions:
- source_word: אסוף
  choice: Reúne
  rationale: O imperativo de אסף convoca a juntar aquilo que está disperso. “Reúne” é direto, natural e preserva a força de súplica dirigida a Deus.
- source_word: כל שבטי יעקב
  choice: todas as tribos de Jacó
  rationale: Reprodução direta da construção hebraica, mantendo a referência ancestral e pactual a Jacó.
- source_word: ויתנחלו
  choice: faze que recebam sua herança
  rationale: O verbo נחל aqui expressa a obtenção ou posse de uma herança atribuída. A formulação explicita em português o complemento implícito sem identificar além do texto em que consiste a herança.
- source_word: כימי קדם
  choice: como nos dias de outrora
  rationale: A expressão aponta para um tempo anterior e antigo, com sentido de restauração. “Dias de outrora” preserva esse tom em linguagem digna e compreensível.
theological_decisions:
- issue: Divergência entre o hebraico preservado e o paralelo grego
  choice: Traduzir no texto principal o hebraico existente, que contém uma súplica pela restauração das tribos de Jacó.
  alternative: 'O paralelo grego diz: “No meio dos nobres, não te iguale a eles; e, quando outro estiver falando, não tagareles muito.”'
  rationale: Como há testemunho hebraico para esta passagem, ele serve de fonte primária. A diferença substancial do grego provavelmente decorre de outra linha textual ou de desalinhamento na numeração dos versículos; por isso, sua leitura é registrada em nota, sem substituir nem harmonizar o hebraico.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O imperativo “Reúne” e a construção “faze que” conservam o caráter de oração solene sem recorrer a linguagem excessivamente arcaica. A nota mantém transparente a divergência radical entre os testemunhos hebraico e grego.
