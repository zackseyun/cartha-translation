translation:
  language: pt
  text: Quem confia na Lei dá atenção aos mandamentos, e quem confia no Senhor não será diminuído.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A linha hebraica preservada no manuscrito fornecido da Geniza do Cairo parece estar deslocada ou corrompida neste versículo. Por isso, a tradução segue o paralelo grego, que apresenta uma leitura coerente.
    reason: textual_variant
  - marker: b
    text: “Não será diminuído” também pode ser traduzido como “não será rebaixado” ou, de maneira mais interpretativa, “não terá falta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων
  choice: quem confia
  rationale: Expressa naturalmente a ideia de depositar confiança ou apoiar-se em alguém ou algo, adequada às duas ocorrências do verbo πιστεύω.
- source_word: νόμῳ
  choice: na lei
  rationale: No contexto sapiencial judaico de Sirácida, νόμος designa a Lei/Torá; a forma em minúscula mantém uma redação corrente sem perder a referência pactual.
- source_word: προσέχει
  choice: atende
  rationale: Preserva a noção de dar atenção e levar em conta, sem ampliar o verbo para a ideia mais forte de cumprir integralmente.
- source_word: ἐντολαῖς
  choice: aos mandamentos
  rationale: Equivalente claro e tradicional, apropriado ao registro religioso e ético do texto.
- source_word: Κυρίῳ
  choice: no Senhor
  rationale: Tradução padrão de κύριος quando se refere a Deus, com linguagem digna e amplamente reconhecível.
- source_word: οὐκ ἐλαττωθήσεται
  choice: não será diminuído
  rationale: Reproduz de modo próximo o futuro passivo de ἐλαττόω e conserva sua amplitude sem decidir entre ser rebaixado, sofrer falta ou ficar em desvantagem.
theological_decisions:
- issue: O texto hebraico preservado fornecido não corresponde materialmente ao paralelo grego de Sirácida 35:24.
  choice: Traduzir o paralelo grego coerente e explicitar a divergência textual em nota.
  alternative: Traduzir literalmente a linha hebraica fornecida, embora ela pareça deslocada ou corrompida neste versículo.
  rationale: A própria fonte classifica o testemunho hebraico como divergente, enquanto o grego apresenta uma leitura coerente para a referência. A nota conserva honestamente a incerteza documental.
- issue: Amplitude semântica de οὐκ ἐλαττωθήσεται.
  choice: não será diminuído
  alternative: não será rebaixado; não terá falta
  rationale: A formulação escolhida mantém a tensão e a relativa indeterminação do passivo grego, sem converter a promessa em uma afirmação mais específica de prosperidade ou vindicação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. “Atende aos mandamentos” preserva a ideia de atenção responsável sem tornar προσέχει sinônimo pleno de “obedece” ou “cumpre”.
