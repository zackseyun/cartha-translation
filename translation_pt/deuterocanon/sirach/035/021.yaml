  text: A devious heart causes grief[b][a], and an experienced man will repay him in kind.
translation:
  language: pt
  text: Um coração tortuoso causa tristeza,[a][b] e um homem experiente lhe retribuirá na mesma medida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A oração final é difícil. O hebraico diz literalmente algo como: “e um homem experiente a devolverá nele/com ele”. As referências dos pronomes e o sentido da preposição são incertos. Também pode significar: “lhe responderá na mesma medida” ou “lhe retribuirá de modo correspondente”.'
    reason: alternative_reading
  - marker: b
    text: 'O paralelo grego traz um texto muito diferente: “Não confie em um caminho sem tropeços.” Isso pode refletir uma forma textual diferente da hebraica.'
    reason: textual_variant
lexical_decisions:
- source_word: לב
  choice: coração
  rationale: Na literatura sapiencial hebraica, designa a pessoa interior, inclusive seus pensamentos e intenções; “coração” preserva a imagem e o sentido moral.
- source_word: עקוב
  choice: tortuoso
  rationale: Exprime caráter interior moralmente torcido ou desviado; “tortuoso” é digno e mais amplo que simples desonestidade.
- source_word: יתן
  choice: causa
  rationale: 'Embora o sentido básico seja “dá”, aqui a construção tem força causativa: o coração produz tristeza.'
- source_word: עצבת
  choice: tristeza
  rationale: O substantivo denota pesar, aflição ou dor; “tristeza” é claro e natural em português.
- source_word: ואיש ותיק
  choice: mas um homem experiente
  rationale: איש é masculino singular, e ותיק descreve alguém provado ou experiente. A conjunção admite aqui valor adversativo no paralelismo.
- source_word: ישיבנה בו
  choice: lhe dará o troco
  rationale: A expressão hebraica é compacta e difícil, literalmente próxima de “a fará voltar nele/com ele”. A formulação portuguesa comunica de modo natural uma possível reciprocidade, sem ocultar em nota a incerteza textual.
theological_decisions:
- issue: Linguagem de gênero em איש
  choice: homem
  alternative: pessoa
  rationale: O hebraico emprega explicitamente o masculino singular; a tradução o preserva, embora o provérbio possa ter aplicação representativa.
- issue: Sentido da oração final com sintaxe pronominal incerta
  choice: lhe dará o troco
  alternative: lhe responderá na mesma medida
  rationale: O hebraico permite entender uma resposta ou retribuição correspondente. A opção principal é idiomática, enquanto a nota preserva a ambiguidade e registra a grande divergência do paralelo grego.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Coração tortuoso” conserva a imagem sapiencial hebraica; “lhe dará o troco” é corrente sem ser vulgar. As notas mantêm visíveis a ambiguidade da oração final e a divergência substancial do grego.
