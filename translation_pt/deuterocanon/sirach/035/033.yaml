base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/033.yaml
  text: Fodder and a stick and loads are for a donkey[c][b][a]; bread and discipline and work are for a slave.
translation:
  language: pt
  text: Forragem, vara[a] e cargas são para o jumento; pão, disciplina[b] e trabalho são para o escravo doméstico[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «bastão»; o termo grego também pode significar «cajado».
    reason: lexical_alternative
  - marker: b
    text: Ou «instrução», «treinamento» ou «correção».
    reason: lexical_alternative
  - marker: c
    text: O termo grego refere-se especificamente a um escravo ou servo pertencente ao âmbito doméstico.
    reason: lexical_alternative
lexical_decisions:
- source_word: χορτάσματα
  choice: forragem
  rationale: O plural grego designa alimento dado a animais; «forragem» expressa naturalmente esse sentido concreto em português.
- source_word: ῥάβδος
  choice: vara
  rationale: O termo pode designar vara, bastão ou cajado. Neste dito sobre a condução de um jumento, «vara» mantém a imagem concreta sem especificar além do grego.
- source_word: φορτία
  choice: cargas
  rationale: Refere-se às coisas transportadas por um animal de carga; «cargas» preserva o sentido concreto e o plural.
- source_word: ὄνῳ
  choice: para o jumento
  rationale: O dativo indica referência ou destinação. «Para o jumento» reproduz com naturalidade a relação expressa na frase nominal.
- source_word: ἄρτος
  choice: pão
  rationale: O grego nomeia especificamente o pão, embora este possa representar alimento em geral; não há necessidade de generalizar.
- source_word: παιδεία
  choice: disciplina
  rationale: No contexto de pão e trabalho atribuídos a um escravo doméstico, o termo abrange formação, correção e treinamento; «disciplina» preserva essa amplitude prática.
- source_word: ἔργον
  choice: trabalho
  rationale: Equivalente direto e corrente para a atividade laboral indicada pelo substantivo grego.
- source_word: οἰκέτῃ
  choice: escravo doméstico
  rationale: Οἰκέτης designa especificamente alguém escravizado no âmbito da casa. A expressão preserva tanto a condição servil quanto a precisão doméstica do termo.
theological_decisions:
- issue: Tradução de οἰκέτῃ em um dito sapiencial sobre trabalho doméstico
  choice: escravo doméstico
  alternative: servo doméstico
  rationale: «Escravo doméstico» torna explícita a condição social assimétrica presente no termo grego, sem suavizá-la como poderia ocorrer com «servo». A formulação não endossa a instituição; apenas representa com precisão o mundo social pressuposto pelo texto.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo proverbial conciso. Preferiu-se «jumento», amplamente compreensível no português brasileiro e internacional, e «escravo doméstico» para explicitar a precisão social de οἰκέτης.
