base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/035.yaml
  text: A yoke and a strap will bend the neck[a], and for a wicked slave there are racks and tortures.
translation:
  language: pt
  text: O jugo e a correia curvarão o pescoço; para o escravo perverso[a], cavaletes de tortura e tormentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo doméstico perverso”. O grego οἰκέτης pode designar um servo da casa, mas o contexto coercivo favorece “escravo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζυγός
  choice: jugo
  rationale: O contexto de curvar o pescoço exige o sentido concreto de jugo, não os sentidos alternativos de balança ou par.
- source_word: ἱμάς
  choice: correia
  rationale: Designa uma tira ou correia de couro; “correia” é claro e preserva a imagem de contenção física ao lado do jugo.
- source_word: κάμψουσιν
  choice: curvarão
  rationale: Preserva o futuro ativo plural e a imagem física de fazer o pescoço se dobrar, sem explicitar além do grego o grau de coerção.
- source_word: τράχηλον
  choice: o pescoço
  rationale: Referência anatômica direta, expressa de modo natural em português.
- source_word: οἰκέτῃ
  choice: escravo
  rationale: Embora possa designar um servo doméstico, o contexto de contenção e punição torna saliente a condição servil coerciva; “escravo” preserva essa força.
- source_word: κακούργῳ
  choice: perverso
  rationale: Qualifica moralmente o escravo como mau ou malfeitor sem restringir o sentido a uma condenação criminal formal.
- source_word: στρέβλαι
  choice: cavaletes de tortura
  rationale: O termo designa instrumentos de suplício, particularmente aparelhos que torcem ou estiram o corpo; a expressão mantém o plural concreto e evita a ambiguidade de “potros” no português atual.
- source_word: βάσανοι
  choice: tormentos
  rationale: No contexto, refere-se a sofrimentos infligidos como punição ou tortura; “tormentos” mantém a distinção em relação aos instrumentos mencionados antes.
theological_decisions:
- issue: Condição servil expressa por οἰκέτῃ
  choice: escravo
  alternative: servo doméstico
  rationale: O substantivo pode ter sentido doméstico mais amplo, mas a associação imediata com coerção física e instrumentos de tortura favorece tornar explícita a condição de escravo. A alternativa lexical genuína é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula reproduz a estrutura paralela do grego sem acrescentar verbo à segunda oração. “Cavaletes de tortura” explicita o referente concreto de στρέβλαι para evitar que “potros” seja entendido no sentido animal.
