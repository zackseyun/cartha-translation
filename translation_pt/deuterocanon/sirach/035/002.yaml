  text: Strike the foreign people[b][a], and let them see your mighty deeds.
translation:
  language: pt
  text: Investe contra um povo estrangeiro[a], e que eles vejam teus feitos poderosos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme outra compreensão do imperativo hebraico: “deixa em paz um povo estrangeiro” ou “cede diante de um povo estrangeiro”. A expressão é breve, e sua nuance exata é incerta.'
    reason: lexical_alternative
  - marker: b
    text: O paralelo grego preservado difere substancialmente do testemunho hebraico e parece representar outra forma do texto; a tradução aqui segue o hebraico conservado.
    reason: textual_variant
lexical_decisions:
- source_word: הרף
  choice: Investe
  rationale: O imperativo é breve e de nuance incerta. No contexto, com על indicando o alvo, “investe contra” comunica uma ação dirigida contra o povo sem especificar indevidamente se se trata de golpear, ameaçar ou lançar poder sobre ele.
- source_word: על
  choice: contra
  rationale: Com o imperativo e um grupo humano como complemento, “contra” expressa de modo natural em português a direção hostil sugerida pelo contexto.
- source_word: עם נכר
  choice: um povo estrangeiro
  rationale: Preserva o sentido coletivo de עם e a ideia de estrangeiridade expressa por נכר, sem transformar o grupo em indivíduos isolados.
- source_word: ויראו
  choice: e que eles vejam
  rationale: A forma prefixada após o imperativo pode ter força volitiva ou jussiva. Esta formulação conserva essa sequência sem a reduzir a uma simples previsão futura.
- source_word: גבורתיך
  choice: teus feitos poderosos
  rationale: O plural aponta para manifestações visíveis de poder; “feitos poderosos” combina naturalmente com o verbo “ver” e evita tratar a expressão apenas como força abstrata.
theological_decisions:
- issue: Divergência entre o testemunho hebraico e o paralelo grego
  choice: Seguir o hebraico conservado e registrar a divergência em nota.
  alternative: Traduzir o texto grego, que fala de cuidar dos outros, sentar-se, reclinar-se e receber uma coroa.
  rationale: O hebraico existente é a fonte primária fornecida para esta passagem. O grego representa uma forma textual substancialmente diferente e não deve ser harmonizado artificialmente com ele.
- issue: Nuance do imperativo הרף
  choice: Usar uma formulação de ação dirigida contra o povo, sem definir o modo exato da ação.
  alternative: “Desiste diante de”, “deixa em paz” ou, de modo mais específico, “golpeia”.
  rationale: A forma hebraica é concisa e lexicalmente discutível. “Investe contra” respeita o contexto adversativo e preserva alguma abertura quanto à natureza precisa do ato.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Investe contra” evita o coloquialismo de “parte para cima” e a precisão excessiva de “golpeia”; a construção “que eles vejam” conserva o tom volitivo da segunda oração.
