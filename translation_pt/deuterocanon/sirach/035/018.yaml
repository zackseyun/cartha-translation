translation:
  language: pt
  text: Todo alimento fica encerrado no ventre[b], mas um alimento é mais agradável do que outro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é ligeiramente condensado; literalmente, algo como “há alimento, dentre alimento, que é agradável”. O sentido é comparativo: um alimento é mais agradável do que outro.'
    reason: lexical_alternative
  - marker: b
    text: O texto grego paralelo neste ponto difere substancialmente do hebraico preservado e parece refletir outra linha textual. A tradução segue aqui a testemunha hebraica como fonte principal.
    reason: textual_variant
lexical_decisions:
- source_word: כל מאכל
  choice: Todo alimento
  rationale: כל com substantivo singular expressa aqui totalidade distributiva. “Todo alimento” é natural em português e preserva o caráter geral da afirmação.
- source_word: תסגר
  choice: fica encerrado
  rationale: A forma transmite a ideia concreta de o alimento acabar contido ou fechado. “Fica encerrado” preserva essa imagem sem tornar a frase excessivamente literal.
- source_word: בבטן
  choice: no ventre
  rationale: No contexto da alimentação, בטן designa a região digestiva. “Ventre” mantém a concretude do hebraico e um registro digno, sem o tom clínico de “estômago”.
- source_word: אך
  choice: mas
  rationale: Marca o contraste entre o destino comum de todo alimento e a diferença de agradabilidade entre um e outro.
- source_word: יש מאכל ממאכל
  choice: um alimento ... do que outro
  rationale: O hebraico formula a comparação de modo condensado. Esta construção portuguesa torna explícita apenas a relação comparativa já presente no original.
- source_word: תנעם
  choice: é mais agradável
  rationale: A raiz נעם indica prazer, deleite ou agradabilidade. “Mais agradável” preserva a amplitude do termo sem restringi-lo à doçura.
theological_decisions:
- issue: Diferença substancial entre as testemunhas hebraica e grega neste ponto
  choice: Seguir o texto hebraico fornecido como fonte principal e registrar a divergência em nota
  alternative: Traduzir o texto grego, que apresenta uma afirmação diferente acerca do homem de conselho, do arrogante e do temor
  rationale: A edição hebraica foi designada como fonte original de alta confiança, embora haja pequena incompatibilidade de validação. Como o grego parece refletir outra linha textual, não se deve harmonizar silenciosamente as duas testemunhas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Ventre” conserva a imagem concreta do hebraico, enquanto a segunda oração explicita com naturalidade a comparação condensada.
