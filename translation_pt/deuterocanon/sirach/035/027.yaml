translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora concreta do “ninho” foi mantida, e a estrutura foi levemente ajustada com dois-pontos para produzir uma frase proverbial natural sem apagar a concisão do hebraico.
