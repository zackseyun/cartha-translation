  text: So is the man who has no nest[b][a], resting wherever evening overtakes him.
translation:
  language: pt
  text: 'Assim é o homem que não tem ninho[a][b]: repousa quando anoitece.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico é conciso e apresenta alguma incerteza textual. Esta tradução segue o hebraico preservado.
    reason: textual_variant
  - marker: b
    text: 'Ou: “que não tem lar”. O hebraico diz literalmente “que não tem ninho”, preservando a imagem de alguém sem lugar fixo onde se abrigar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כן
  choice: Assim é
  rationale: Introduz a comparação de forma concisa e proverbial, preservando a ligação com a imagem anterior sem acrescentar um sentido não expresso.
- source_word: איש
  choice: o homem
  rationale: Mantém o substantivo hebraico singular masculino e o caráter representativo da figura proverbial.
- source_word: אשר לא קן
  choice: que não tem ninho
  rationale: Conserva a imagem concreta de קן, embora o termo possa representar metaforicamente casa ou moradia.
- source_word: המרגיע
  choice: repousa
  rationale: Expressa de modo natural o sentido participial ligado a aquietar-se ou descansar, sem decidir em excesso a análise morfológica de uma linha textualmente difícil.
- source_word: כאשר יערב
  choice: onde quer que a noite o alcance
  rationale: Torna explícita, a partir do contexto do homem sem lugar fixo, a ideia de que ele repousa no lugar em que a noite chega; a formulação preserva a força circunstancial da expressão hebraica.
