review_pass:
  verdict: revise
  source_fidelity: 'O texto principal segue corretamente o hebraico preservado: כל זכר / איש, תקבל, אשה, אך, יבחר e עלמה. A nota identifica adequadamente que o grego transmite um dito substancialmente distinto.'
  naturalness: «Qualquer macho» é uma equivalência lexical possível para זכר, mas em português moderno aplicado a seres humanos tende a soar zoológico, depreciativo ou deliberadamente chocante. Isso prejudica o registro proverbial sem comunicar de modo confiável a distinção lexical hebraica. «Qualquer homem» é a solução portuguesa mais natural; a diferença entre זכר e איש não pode ser reproduzida sem custo de registro desproporcional.
  terminology: «Mulher» e «jovem» são escolhas adequadas e não impõem os sentidos mais estreitos de «esposa» ou «virgem». A nota variante deve conservar o contraste entre as tradições, com «ao agir» refletindo melhor o grego ἐν τῷ ποιῆσαί σε do que «depois de agir».
  issues:
  - severity: medium
    issue: «Qualquer macho» para כל זכר
    rationale: Embora זכר denote literalmente «macho/male», «macho» para um humano em português contemporâneo normalmente é zoológico ou pejorativo. A tradução cria uma conotação que o hebraico não exige. A oposição lexical com איש pode ser mantida apenas de modo limitado em português, sem sacrificar o registro.
  - severity: low
    issue: «depois de agir» na nota grega
    rationale: A expressão grega significa «no/ao agir», não necessariamente em sequência temporal após a ação. «Ao agir» preserva melhor a formulação.
