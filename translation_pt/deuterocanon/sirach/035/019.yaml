  text: Any male will accept a woman[a], but a man will choose a young woman.
translation:
  language: pt
  text: Qualquer homem aceitará uma mulher[a], mas um homem escolherá uma jovem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: «Não faças nada sem conselho e, ao agir, não te arrependas». Nesse ponto, a tradição grega preserva um texto substancialmente diferente do hebraico existente.'
    reason: textual_variant
lexical_decisions:
- source_word: כָּל זָכָר
  choice: qualquer macho
  rationale: Preserva o termo hebraico explicitamente biológico e o contraste lexical com אִישׁ no segundo membro. Embora seja incisivo em português, essa estranheza corresponde à formulação do hebraico.
- source_word: תְּקַבֵּל
  choice: aceitará
  rationale: קבל significa receber ou aceitar; «aceitará» se ajusta ao contexto relacional sem especificar casamento nem relação sexual.
- source_word: אִשָּׁה
  choice: uma mulher
  rationale: O substantivo pode significar mulher ou esposa. «Mulher» preserva a generalidade do provérbio e evita restringi-lo explicitamente ao casamento.
- source_word: אַךְ
  choice: mas
  rationale: Marca de maneira clara e natural o contraste entre os dois membros.
- source_word: אִישׁ
  choice: um homem
  rationale: Mantém a distinção do hebraico entre זכר, «macho», no primeiro membro, e איש, «homem», no segundo.
- source_word: יִבְחַר
  choice: escolherá
  rationale: Expressa diretamente a escolha deliberada indicada por בחר e conserva a forma proverbial no futuro.
- source_word: עַלְמָה
  choice: uma jovem
  rationale: Designa uma mulher jovem, em idade de casar, sem afirmar necessariamente virgindade. «Jovem» é natural em português e evita tanto o arcaísmo «donzela» quanto a especificidade excessiva de «virgem».
theological_decisions:
- issue: Uso do hebraico diante do paralelo grego divergente
  choice: Traduzir no texto principal o provérbio preservado em hebraico.
  alternative: 'Seguir o grego: «Não faças nada sem conselho e, depois de agir, não te arrependas.»'
  rationale: Como o texto hebraico está preservado com alta confiança, ele serve de base. O grego transmite aqui um dito substancialmente diferente e, por transparência textual, é registrado em nota, não harmonizado com o hebraico.
translation_notes:
  register: Português moderno, amplo e digno, com legibilidade brasileira. «Qualquer macho» é deliberadamente mais marcado que a fala cotidiana para preservar o contraste incomum do hebraico entre זכר e איש; «uma jovem» evita atribuir a עַלְמָה o sentido mais específico de «virgem».
