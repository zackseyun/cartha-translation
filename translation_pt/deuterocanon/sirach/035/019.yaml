- from: Qualquer macho aceitará uma mulher[a], mas um homem escolherá uma jovem.
  to: Qualquer homem aceitará uma mulher[a], mas um homem escolherá uma jovem.
  rationale: A revisão substitui «macho», expressão inadequadamente zoológica ou pejorativa para uma pessoa em português moderno, por «homem». Embora isso não reproduza plenamente a distinção formal entre זכר e איש, preserva o referente humano e o registro do provérbio sem introduzir conotação indevida. A nota é ajustada para refletir com maior precisão o aspecto circunstancial do grego.
