  text: If they made you a leader, do not exalt yourself; be among them as one of them.[a]
translation:
  language: pt
  text: Se fizerem de você um líder, não se exalte; esteja entre eles como um deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho hebraico fornecido para esta referência diz: “Salva-nos, Deus de todos, e faz recair o teu temor sobre todas as nações.” Como esse texto não corresponde ao versículo grego associado a Sirácida 35:1, a tradução principal segue aqui o grego e registra abertamente a divergência.'
    reason: textual_variant
lexical_decisions:
- source_word: Ἡγούμενόν
  choice: líder
  rationale: Designa quem conduz ou está à frente de um grupo. “Líder” é atual, claro e não pressupõe um cargo político formal.
- source_word: κατέστησαν
  choice: fizeram de você
  rationale: O verbo expressa colocar ou constituir alguém numa função. A formulação preserva o sujeito plural indefinido e soa natural em português.
- source_word: μὴ ἐπαίρου
  choice: não se exalte
  rationale: Mantém a imagem reflexiva de elevar a si mesmo e sua força moral, sem reduzi-la apenas a um estado interior de orgulho.
- source_word: γίνου
  choice: seja
  rationale: Neste contexto exortativo, o imperativo “seja” comunica de modo direto a conduta requerida.
- source_word: ὡς εἷς ἐξ αὐτῶν
  choice: como um deles
  rationale: Preserva de modo conciso e natural a ideia de solidariedade e humildade no meio do grupo.
theological_decisions:
- issue: Seleção do texto-base diante de uma divergência completa entre o hebraico fornecido e o paralelo grego
  choice: Traduzir no texto principal o paralelo grego associado a Sirácida 35:1 e registrar em nota a leitura hebraica divergente.
  alternative: 'Traduzir no texto principal o hebraico fornecido: “Salva-nos, Deus de todos, e faz recair o teu temor sobre todas as nações.”'
  rationale: As duas testemunhas contêm frases inteiramente diferentes. O paralelo grego apresenta uma unidade coerente ligada a esta referência; a divergência do hebraico é exposta claramente, sem ser ocultada nem harmonizada.
- issue: Forma da primeira oração grega
  choice: 'Manter a pergunta: “Fizeram de você um líder?”'
  alternative: 'Entender como condição: “Se fizeram de você um líder”.'
  rationale: A pontuação da edição grega apresenta a oração como pergunta. A leitura condicional é possível pelo sentido e aparece na camada inglesa de consulta, mas a forma interrogativa segue mais diretamente a evidência grega fornecida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Você” evita construções pronominais excessivamente formais e torna explícito o destinatário singular; “entre eles” reforça a localização no grupo sem alterar a comparação.
