  text: Give the recompense of those who wait for you[b][a], and let your prophets be found faithful.
translation:
  language: pt
  text: Dá a recompensa aos que esperam por ti[a], e que os teus profetas se mostrem dignos de fé.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «aos que põem a esperança em ti». O verbo hebraico pode significar tanto esperar como ter esperança.'
    reason: lexical_alternative
  - marker: b
    text: 'Também pode ser traduzido: «sejam confirmados» ou «se comprovem verdadeiros».'
    reason: lexical_alternative
  - marker: c
    text: 'O texto grego traz uma leitura bem diferente: «Quem teme o Senhor receberá instrução, e os que madrugam encontrarão favor». Isso provavelmente reflete outra forma textual.'
    reason: alternative_reading
lexical_decisions:
- source_word: תן
  choice: Dá
  rationale: Imperativo direto de נתן dirigido a Deus; «Dá» é natural, claro e mantém a forma de petição.
- source_word: פעלת
  choice: a recompensa
  rationale: פעלה pode designar obra, resultado ou recompensa. Neste contexto, indica mais provavelmente o que Deus concede aos que nele esperam; «recompensa» comunica esse sentido sem tornar a frase excessivamente jurídica.
- source_word: קויך
  choice: aos que esperam por ti
  rationale: קוה reúne as ideias de esperar e ter esperança. «Esperam por ti» conserva a expectativa dirigida a Deus, enquanto a nota registra a nuance de esperança confiante.
- source_word: ונביאיך
  choice: e que os teus profetas
  rationale: Reproduz de modo direto a construção hebraica com o sufixo possessivo.
- source_word: יאמנו
  choice: se mostrem dignos de fé
  rationale: A forma de אמן pode expressar que os profetas sejam confirmados, reconhecidos como confiáveis ou comprovados verdadeiros. A formulação escolhida mantém a ideia de validação sem reduzi-la apenas à fidelidade moral.
theological_decisions:
- issue: Divergência substancial entre o hebraico preservado e o paralelo grego
  choice: O texto principal segue a petição hebraica sobre a recompensa dos que esperam em Deus e a confirmação de seus profetas.
  alternative: 'O grego traz: «Quem teme o Senhor receberá instrução, e os que madrugam encontrarão favor».'
  rationale: Como há texto hebraico preservado, ele recebe prioridade. A leitura grega parece refletir outra forma textual e é mantida em nota por sua divergência material.
- issue: Sentido da confirmação dos profetas
  choice: «se mostrem dignos de fé»
  alternative: «sejam confirmados» ou «se comprovem verdadeiros»
  rationale: A escolha preserva a tensão entre confiabilidade pessoal e vindicação das palavras proféticas, sem impor uma interpretação doutrinária mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A formulação conserva a estrutura de petição do hebraico e explicita em notas suas ambiguidades relevantes.
