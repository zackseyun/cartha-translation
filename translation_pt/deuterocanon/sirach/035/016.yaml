  text: And all the ends of the earth will know that you are the eternal God[a][b].
translation:
  language: pt
  text: E todos os confins da terra saberão que tu és o Deus eterno[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tradição grega traz: “Os que temem o Senhor encontrarão juízo e farão brilhar como luz os atos justos.” O testemunho hebraico preserva aqui uma linha substancialmente diferente.'
    reason: textual_variant
  - marker: b
    text: 'Mais literalmente: “o Deus da eternidade”; também pode ser entendido como “o Deus para sempre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וידעו
  choice: saberão
  rationale: 'O perfeito qal com waw, neste contexto poético e declarativo, expressa adequadamente um resultado futuro: “saberão”.'
- source_word: כל אפסי ארץ
  choice: todos os confins da terra
  rationale: A expressão hebraica designa as regiões mais distantes do mundo; “os confins da terra” é idiomático, reconhecível e próximo da forma hebraica.
- source_word: אלהי עולם
  choice: o Deus eterno
  rationale: Embora a construção possa ser vertida mais literalmente por “o Deus da eternidade”, “o Deus eterno” comunica com naturalidade o sentido de עולם neste contexto, sem perder a noção de duração ilimitada.
- source_word: אתה
  choice: tu és
  rationale: O pronome explícito dá ênfase ao sujeito. “Tu és” preserva essa ênfase sem acrescentar “somente”, que não consta lexicalmente no hebraico.
theological_decisions:
- issue: Relação entre o testemunho hebraico e a linha grega divergente
  choice: Traduzir o hebraico preservado como texto principal e registrar a tradição grega em nota.
  alternative: “Os que temem o Senhor encontrarão justiça e farão brilhar como luz as ações justas.”
  rationale: Como existe aqui um testemunho hebraico de alta confiança, ele tem prioridade. A linha grega não é uma equivalência próxima, mas uma tradição textual substancialmente diferente, que não deve ser harmonizada silenciosamente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Confins da terra” conserva a expressão bíblica tradicional sem soar arcaica; “Deus eterno” privilegia naturalidade e clareza.
