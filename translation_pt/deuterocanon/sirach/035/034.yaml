  naturalness: “Ponha um escravo para trabalhar” é português moderno e inteligível. “Deixe as mãos dele livres” mantém a imagem grega e é mais natural do que uma reprodução mecânica de “solte as mãos”. O tratamento por “você” é consistente e adequado ao registro adotado.
  terminology: “Escravo” é necessário para refletir o contexto histórico-social do dito, sem atenuá-lo para “criança” nem anacronizá-lo como relação laboral moderna. “Liberdade” traduz diretamente ἐλευθερία.
