  text: Put a child to work[a], and you will find rest; leave his hands idle, and he will seek freedom.
translation:
  language: pt
  text: Ponha um escravo para trabalhar[a], e você encontrará descanso; deixe as mãos dele livres, e ele buscará liberdade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “trabalhe com um menino/criado”. Embora παιδί possa significar “criança” ou “menino”, o contexto imediato refere-se a um escravo ou servo doméstico. “Deixe as mãos dele livres” traduz a imagem de afrouxar-lhe o controle.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔργασαι ἐν παιδί
  choice: Ponha uma criança para trabalhar
  rationale: A construção grega é compacta e pouco natural se vertida palavra por palavra. A formulação portuguesa conserva o imperativo e comunica, de modo corrente, a ideia contextual de ocupar a criança com trabalho.
- source_word: εὑρήσεις ἀνάπαυσιν
  choice: você encontrará descanso
  rationale: Mantém diretamente o sentido de ἀνάπαυσις como descanso ou alívio e preserva a forma proverbial da consequência.
- source_word: ἄνες χεῖρας αὐτῷ
  choice: deixe as mãos dela ociosas
  rationale: ἄνες significa literalmente soltar, afrouxar ou deixar livres. Com “mãos”, a expressão indica aqui permitir a inatividade; “ociosas” explicita esse sentido prático sem abandonar a imagem concreta das mãos.
- source_word: ζητήσει ἐλευθερίαν
  choice: ela buscará liberdade
  rationale: Traduz de maneira direta ἐλευθερία, preservando a tensão do provérbio e evitando substituí-la por termos interpretativos como “rebeldia” ou “licenciosidade”.
theological_decisions:
- issue: Força ético-social de παιδί e ἐλευθερία no provérbio doméstico
  choice: Apresentar o dito como instrução sapiencial sobre manter uma criança ocupada, conservando “liberdade” em seu sentido lexical.
  alternative: Traduzir παιδί por “jovem servo” ou “escravo”, ou interpretar ἐλευθερία como “licenciosidade” ou “independência”.
  rationale: παιδί pode designar criança ou jovem servo, mas “criança” é a leitura contextual mais provável e não introduz uma condição servil que o texto não torna explícita. “Liberdade” mantém a linguagem e a tensão do grego, embora neste contexto doméstico designe a tentativa de escapar à disciplina.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O uso de “você” torna explícito o sujeito implícito da segunda pessoa do singular e evita uma formulação excessivamente solene. A retomada por “ela” segue o gênero gramatical de “criança” em português.
