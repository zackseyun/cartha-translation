  text: On the day the days of your life are completed[a], and at the time of your death, distribute your inheritance.
translation:
  language: pt
  text: No dia em que se completarem os dias da sua vida[a] e no momento da sua morte, distribua a sua herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no fim da sua vida”; literalmente, o grego fala da conclusão dos dias da sua vida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἡμέρᾳ
  choice: No dia em que
  rationale: Expressa de modo natural em português a referência temporal específica introduzida por ἐν com o dativo.
- source_word: συντελείας
  choice: se completarem
  rationale: Conserva a ideia de conclusão ou chegada ao fim, transformando o substantivo grego em forma verbal para obter uma frase clara em português.
- source_word: ἡμερῶν ζωῆς σου
  choice: os dias da sua vida
  rationale: Reproduz explicitamente a construção genitiva e mantém a repetição de “dia/dias” presente no grego.
- source_word: καιρῷ τελευτῆς
  choice: no momento da sua morte
  rationale: Neste contexto de transmissão da herança, τελευτή se refere naturalmente à morte; “momento” comunica com clareza o valor temporal de καιρός.
- source_word: διάδος
  choice: distribua
  rationale: O imperativo pede a repartição deliberada dos bens, sentido mais específico do que o simples “dê”.
- source_word: κληρονομίαν
  choice: a sua herança
  rationale: “Herança” corresponde diretamente ao bem transmitido; o possessivo, implícito no contexto, torna a referência natural e inequívoca em português.
theological_decisions:
- issue: Se τελευτή deve ser suavizado como “fim” ou expresso como “morte”
  choice: morte
  alternative: fim
  rationale: Embora o termo possa indicar um fim em sentido geral, a instrução sobre distribuir a herança aponta concretamente para a morte. A tradução mantém a força prática do texto sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, digno e de compreensão ampla, com boa legibilidade brasileira. A repetição “dia/dias” foi preservada por refletir deliberadamente a forma do grego, enquanto a sintaxe foi ajustada para soar natural.
