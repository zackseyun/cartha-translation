  text: Have mercy on the people called by your name[a], on Israel, your firstborn[c][b], whom you acquired.
translation:
  language: pt
  text: Tem compaixão do povo chamado pelo teu nome[a], Israel, teu primogênito, que adquiriste[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que leva o teu nome”. O idioma hebraico identifica o povo como pertencente a Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que possuíste”, “que compraste” ou, possivelmente, “que criaste”. O verbo hebraico admite vários sentidos relacionados.'
    reason: alternative_reading
  - marker: c
    text: O texto grego preservado apresenta aqui uma frase substancialmente diferente, pertencente a outra tradição textual; esta tradução segue o testemunho hebraico existente.
    reason: textual_variant
lexical_decisions:
- source_word: רַחֵם
  choice: Tem compaixão
  rationale: O imperativo pede uma ação compassiva. A formulação é natural, digna e apropriada à linguagem de oração em português contemporâneo.
- source_word: עַל־עָם
  choice: do povo
  rationale: עם é coletivo singular. Com a locução portuguesa “ter compaixão de”, preserva-se a referência definida sem acrescentar o possessivo “teu”, ausente neste ponto do hebraico.
- source_word: נִקְרָא בִּשְׁמֶךָ
  choice: chamado pelo teu nome
  rationale: Mantém o conhecido idioma bíblico de identificação e pertencimento a Deus, sem reduzi-lo à paráfrase interpretativa “que te pertence”.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Transliteração consagrada do nome próprio.
- source_word: בְּכוֹר
  choice: teu primogênito
  rationale: “Primogênito” reproduz o substantivo hebraico e sua nuance filial. O possessivo é explicitado pela relação sintática e pelo sentido do aposto dirigido a Deus, sem acrescentar “filho”.
- source_word: קָנִיתָה
  choice: que adquiriste
  rationale: קנה pode significar adquirir, possuir, comprar ou criar. “Adquiriste” preserva melhor a amplitude do sentido de tomar para si, sem impor uma leitura comercial ou cosmológica.
theological_decisions:
- issue: Identidade pactual em נִקְרָא בִּשְׁמֶךָ
  choice: Preservar o idioma “chamado pelo teu nome” como expressão de identificação e pertencimento divino.
  alternative: 'Traduzir de modo explicativo: “que te pertence” ou “que leva o teu nome”.'
  rationale: A formulação hebraica possui ressonância bíblica própria; mantê-la conserva a textura teológica sem transformar a tradução em interpretação.
- issue: Sentido de קָנִיתָה aplicado a Israel
  choice: Traduzir por “que adquiriste”.
  alternative: “que possuíste”, “que compraste” ou “que criaste”.
  rationale: O verbo admite esses sentidos relacionados. “Adquiriste” comunica que Deus tomou Israel para si, mas não resolve indevidamente a ambiguidade em favor de compra, posse ou criação.
- issue: Relação de Israel como primogênito
  choice: “Israel, teu primogênito” em aposição.
  alternative: “Israel, que adquiriste como primogênito”.
  rationale: A ordem e a sintaxe hebraicas apresentam “primogênito” como designação de Israel, não necessariamente como resultado ou finalidade da aquisição.
translation_notes:
  register: Português moderno, reverente e amplamente inteligível, com legibilidade brasileira. Emprega “tu” por coerência com a oração dirigida diretamente a Deus. A ordem “Israel, teu primogênito, que adquiriste” acompanha de perto o hebraico e conserva a ambiguidade lexical de קנה em nota.
