lexical_decisions:
- source_word: מי
  choice: Quem
  rationale: Pronome interrogativo que introduz uma pergunta retórica; em português, o futuro do verbo expressa naturalmente a força proverbial.
- source_word: יאמין
  choice: confiará
  rationale: O hifil de אמן indica depositar confiança, não apenas aceitar uma afirmação como verdadeira.
- source_word: בגדוד צבא
  choice: numa tropa armada
  rationale: גדוד designa uma tropa ou bando, e צבא explicita seu caráter militar; a expressão mantém ambos os sentidos em português natural.
- source_word: המדלג
  choice: que salta
  rationale: דלג descreve literalmente o ato de saltar; a formulação preserva a imagem vívida de deslocamento inquieto.
- source_word: מעיר אל עיר
  choice: de cidade em cidade
  rationale: Reproduz de modo conciso e idiomático a ideia de movimento repetido entre cidades.
theological_decisions:
- issue: Divergência textual entre o testemunho hebraico e o paralelo grego fornecido
  choice: Seguir no texto principal o hebraico preservado e registrar em nota a leitura grega inteiramente diferente.
  alternative: «Entendam que não trabalhei somente para mim, mas para todos os que buscam instrução.»
  rationale: O texto hebraico existente contém um provérbio sobre confiar numa tropa itinerante, enquanto o paralelo grego apresenta conteúdo sem correspondência e não pode ser harmonizado com ele. A prioridade ao hebraico e a nota preservam com transparência a incerteza textual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Tropa armada» comunica naturalmente o caráter militar da expressão hebraica, e «que salta» conserva sua imagem incomum sem explicá-la além do texto.
