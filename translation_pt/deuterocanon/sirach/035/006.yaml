translation:
  language: pt
  text: Desperta a ira e derrama o furor[a]; humilha o adversário e repele o inimigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo grego difere profundamente neste ponto e traz uma linha sobre um selo de esmeralda em obra de ouro e música acompanhada de vinho agradável. Aqui se segue o testemunho hebraico, bem atestado na tradição dos manuscritos da Geniza do Cairo.
    reason: textual_variant
lexical_decisions:
- source_word: העיר
  choice: Desperta
  rationale: O imperativo causativo pede que a ira seja despertada ou posta em ação. “Desperta” conserva a imagem e a urgência sem explicitar um sujeito ausente no hebraico.
- source_word: אף
  choice: a tua ira
  rationale: Embora possa significar literalmente “nariz”, aqui designa ira. O possessivo torna natural em português a construção com “despertar”, sem alterar o destinatário implícito dos imperativos.
- source_word: ושפוך
  choice: e derrama
  rationale: Mantém a imagem concreta do verbo שפך, tradicionalmente usada para a manifestação do juízo.
- source_word: חמה
  choice: o teu furor
  rationale: חמה expressa calor, cólera ou furor intenso. “Furor” distingue o termo de אף e preserva o paralelismo poético.
- source_word: והכניע
  choice: humilha
  rationale: כנע pode significar humilhar, abater ou subjugar. “Humilha” conserva a ideia de rebaixamento e acompanha de perto o hebraico.
- source_word: צר
  choice: o adversário
  rationale: צר designa um adversário ou opressor hostil. “Adversário” evita repetir “inimigo” no membro seguinte.
- source_word: והדוף
  choice: e repele
  rationale: הדף significa empurrar para longe, rechaçar ou repelir. “Repele” é conciso e mantém a força militar da expressão.
- source_word: אויב
  choice: o inimigo
  rationale: אויב é o termo comum para inimigo; sua retenção sustenta o paralelismo culminante do verso.
theological_decisions:
- issue: Destinatário e sujeito implícito dos imperativos
  choice: Preservar os imperativos na segunda pessoa, sem acrescentar um vocativo divino.
  alternative: Acrescentar “Senhor” ou ler a frase como exortação geral.
  rationale: O contexto apresenta uma súplica dirigida a Deus, mas o verso hebraico não nomeia o destinatário. A tradução mantém a referência implícita e não acrescenta ao texto um título ausente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A tradução preserva os dois pares poéticos — ira/furor e adversário/inimigo — e mantém a linguagem direta de súplica.
