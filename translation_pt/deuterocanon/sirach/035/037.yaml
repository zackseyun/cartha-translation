  text: Pois a ociosidade ensinou muita maldade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois a preguiça ensinou muita maldade.” O grego ἀργία pode indicar ociosidade, preguiça ou inatividade; “ociosidade” foi escolhida por ser a opção mais ampla e natural neste contexto sapiencial.'
