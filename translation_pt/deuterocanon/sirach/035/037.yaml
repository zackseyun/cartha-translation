lexical_decisions:
- source_word: πολλὴν
  choice: muita
  rationale: Com o substantivo abstrato singular κακίαν, indica grande grau ou extensão; “muita” preserva essa força naturalmente em português.
- source_word: γὰρ
  choice: pois
  rationale: Marca explicação ou fundamento em relação ao contexto anterior; “pois” conserva de modo conciso essa função conectiva.
- source_word: κακίαν
  choice: maldade
  rationale: Exprime amplamente o que é moralmente mau, sem restringir o sentido a malícia interpessoal ou a um vício específico.
- source_word: ἐδίδαξεν
  choice: ensinou
  rationale: Mantém a metáfora explícita do verbo grego. O pretérito perfeito soa natural como máxima sapiencial e não exige explicitar no português uma leitura resultativa.
- source_word: ἡ ἀργία
  choice: a ociosidade
  rationale: Designa o estado de estar sem atividade ou trabalho. “Ociosidade” é amplo, digno e natural no contexto sapiencial, enquanto “preguiça” enfatizaria mais uma disposição pessoal.
