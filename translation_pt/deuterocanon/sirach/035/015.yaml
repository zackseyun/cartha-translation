  text: Hear the prayer of your servants[b][a], according to your favor toward your people.
translation:
  language: pt
  text: Ouve a oração dos teus servos[b], segundo o teu favor para com o teu povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “segundo a tua vontade”. O hebraico רצון pode significar vontade, favor ou beneplácito; “favor” foi adotado porque a expressão prossegue com “para com o teu povo”, sugerindo uma disposição benevolente.'
    reason: lexical_alternative
  - marker: b
    text: 'A tradição grega apresenta neste versículo um texto muito diferente: “Quem busca a Lei será preenchido por ela, mas o hipócrita tropeçará nela”. Isso indica uma divergência importante entre as formas hebraica e grega preservadas de Eclesiástico neste ponto.'
    reason: textual_variant
lexical_decisions:
- source_word: תשמע
  choice: Ouve
  rationale: O imperfeito hebraico tem aqui força de súplica; o imperativo português expressa com naturalidade o pedido direto.
- source_word: תפלת
  choice: a oração
  rationale: 'O substantivo está no singular e em construção com o termo seguinte: “a oração dos...”.'
- source_word: עבדיך
  choice: dos teus servos
  rationale: Embora עבד também possa significar “escravo”, na oração dirigida a Deus o contexto destaca serviço e devoção, tornando “servos” a opção mais natural.
- source_word: כרצונך
  choice: segundo o teu favor
  rationale: רצון pode indicar vontade, favor ou beneplácito. A continuação “para com o teu povo” favorece aqui a ideia de disposição benevolente.
- source_word: על
  choice: para com
  rationale: Com “favor” e um povo como objeto, “para com” expressa de modo idiomático a orientação favorável.
- source_word: עמך
  choice: o teu povo
  rationale: Tradução direta que preserva o sentido comunitário e pactual sem acrescentar especificações.
theological_decisions:
- issue: Sentido de עבדיך na oração dirigida a Deus
  choice: teus servos
  alternative: teus escravos
  rationale: O contexto enfatiza a relação de serviço devoto, não a condição social de escravidão.
- issue: Sentido de כרצונך
  choice: segundo o teu favor
  alternative: segundo a tua vontade
  rationale: “Favor” conserva a provável nuance benevolente da petição, enquanto “vontade” permanece uma possibilidade lexical legítima indicada em nota.
translation_notes:
  register: Português moderno, digno e claro, com leitura natural no Brasil e ampla compreensão internacional. “Ouve” preserva o tom direto de súplica; “para com” mantém clareza relacional sem excessiva rigidez.
