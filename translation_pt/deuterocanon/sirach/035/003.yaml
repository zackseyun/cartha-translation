base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/003.yaml
  text: Speak, elder, for it is fitting for you—yet with accurate knowledge, and do not hinder the music.[b][a]
translation:
  language: pt
  text: Fale, você que é mais velho, pois lhe cabe falar com conhecimento preciso; não atrapalhe a música.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho hebraico principal fornecido parece não corresponder a este versículo; por isso, o paralelo grego foi usado como base principal da tradução.
    reason: textual_variant
  - marker: b
    text: 'Ou: «não interrompa a apresentação musical». O termo grego pode se referir à execução ou apresentação musical como um todo, e não apenas à música em sentido abstrato.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λάλησον
  choice: Fale
  rationale: Traduz diretamente o imperativo, em linguagem atual e digna.
- source_word: πρεσβύτερε
  choice: você que é mais velho
  rationale: Expressa idade ou precedência social sem sugerir necessariamente um cargo religioso, possibilidade que «ancião» poderia introduzir no português corrente.
- source_word: πρέπει γάρ σοι
  choice: pois isso lhe convém
  rationale: Preserva a ideia de que tomar a palavra é adequado à posição da pessoa interpelada.
- source_word: ἐν ἀκριβεῖ ἐπιστήμῃ
  choice: com conhecimento preciso
  rationale: Mantém tanto a competência quanto a exatidão indicadas pela expressão grega.
- source_word: μὴ ἐμποδίσῃς
  choice: não atrapalhe
  rationale: Verbo natural em português que comunica não impedir, perturbar ou prejudicar o andamento de algo.
- source_word: μουσικά
  choice: a música
  rationale: Forma concisa e idiomática; o plural neutro grego também pode abranger a apresentação ou as atividades musicais.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e respeitoso, com boa legibilidade brasileira. A repetição de «fale» esclarece que a expressão «com conhecimento preciso» orienta o modo de falar. A tradução evita «ancião» para não impor a ideia de um ofício religioso.
