  text: Bear witness to your former deeds[a], and establish the vision swiftly in your name.
translation:
  language: pt
  text: Dá testemunho de teus feitos de outrora e estabelece sem demora[a] a visão em teu nome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico desta linha é difícil, sobretudo a expressão traduzida como “sem demora”. O texto grego traz uma redação bem diferente: “Além disso, bendize aquele que te criou e que te sacia com seus bens.”'
    reason: Leitura alternativa e incerteza textual.
lexical_decisions:
- source_word: תן עדות
  choice: Dá testemunho
  rationale: Reproduz o imperativo e conserva a força testemunhal, quase jurídica, da expressão hebraica, em português natural.
- source_word: למראש מעשיך
  choice: de teus feitos de outrora
  rationale: A forma למראש é difícil, mas parece remeter ao que é anterior. “De outrora” expressa essa referência temporal sem impor a ideia mais específica de “desde o princípio”; “feitos” traduz מעשים com dignidade e clareza.
- source_word: והקם
  choice: e estabelece
  rationale: O hifil imperativo de קום pode significar levantar, firmar ou estabelecer. Com “visão” como objeto, “estabelece” preserva o valor causativo sem antecipar a interpretação “cumpre”.
- source_word: חזון
  choice: a visão
  rationale: É a correspondência direta e usual de חזון, mantendo aberta sua possível dimensão profética sem substituí-la por “oráculo” ou “revelação”.
- source_word: דברק
  choice: sem demora
  rationale: A expressão hebraica está obscura ou corrompida. A tradução oferece cautelosamente uma possível ideia de rapidez, talvez associada a brilho ou relâmpago, e sinaliza a incerteza em nota.
- source_word: בשמך
  choice: em teu nome
  rationale: Mantém de perto a construção hebraica com ב e evita definir em excesso a relação sintática, que permanece pouco clara.
theological_decisions:
- issue: Prioridade do testemunho hebraico diante da leitura grega substancialmente diferente
  choice: Traduzir no texto principal o hebraico preservado, reconhecendo sua dificuldade textual.
  alternative: “Além disso, bendize aquele que te criou e que te sacia com seus bens.”
  rationale: Como existe testemunho hebraico para o versículo, ele recebe prioridade. Contudo, a divergência da tradição grega é relevante e deve ser apresentada ao leitor, sem harmonização silenciosa.
- issue: Sentido de והקם aplicado à visão
  choice: “estabelece”
  alternative: “cumpre”
  rationale: “Cumpre” poderia introduzir uma afirmação teológica mais definida sobre realização profética. “Estabelece” conserva melhor a amplitude semântica do hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa coerentes com uma oração dirigida a Deus. A formulação acompanha de perto o hebraico, mas evita rigidez artificial; a principal incerteza textual é explicitada em nota.
