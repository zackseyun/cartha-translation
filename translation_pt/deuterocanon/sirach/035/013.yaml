  source_fidelity: 'O texto segue de modo cauteloso o hebraico preservado: “Dá testemunho” corresponde bem a תן עדות; “feitos de outrora” conserva a referência ao que é anterior em למראש מעשיך sem resolver indevidamente a dificuldade; e “estabelece ... a visão em teu nome” reproduz adequadamente והקם חזון ... בשמך. “Sem demora” é uma solução plausível, explicitamente marcada, para a expressão obscura דברק.'
