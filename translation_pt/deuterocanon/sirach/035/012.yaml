  text: Fill Zion with your splendor[a], and your temple with your glory.
translation:
  language: pt
  text: Enche Sião do teu esplendor[a] e o teu templo da tua glória.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego deste versículo traz um texto muito diferente: «Ali, brinca e realiza os teus pensamentos, e não peques com uma palavra orgulhosa». Isso indica uma divergência textual substancial em relação à forma hebraica preservada.'
    reason: textual_variant
lexical_decisions:
- source_word: מלא
  choice: Enche
  rationale: O imperativo hebraico pede que Sião seja preenchida; «Enche» é direto, natural e preserva a forma de oração.
- source_word: ציון
  choice: Sião
  rationale: Mantém o topônimo específico do hebraico, sem substituí-lo pela referência mais ampla a Jerusalém.
- source_word: הודך
  choice: do teu esplendor
  rationale: הוד expressa esplendor, majestade ou brilho imponente. «Esplendor» preserva a distinção poética em relação a כבוד, traduzido como «glória».
- source_word: ומכבודך
  choice: e o teu templo, da tua glória
  rationale: O segundo membro é elíptico e retoma o verbo «enche». A preposição מ־ indica aqui aquilo de que o templo deve ser cheio; em português, «encher de» é a construção idiomática correspondente.
- source_word: היכלך
  choice: o teu templo
  rationale: Embora היכל também possa significar «palácio», a associação com Sião e a oração dirigida a Deus favorecem «templo».
- source_word: כבודך
  choice: da tua glória
  rationale: כבוד denota glória, honra ou majestade; «glória» é a escolha contextual mais clara para a manifestação divina no templo.
theological_decisions:
- issue: Distinção poética entre הוד e כבוד
  choice: Traduzir הוד por «esplendor» e כבוד por «glória».
  alternative: Traduzir ambos por «glória», ou הוד por «majestade».
  rationale: O hebraico emprega dois termos próximos, mas distintos. Preservar essa diferença conserva a textura poética sem acrescentar uma distinção doutrinária rígida.
- issue: Primazia do testemunho hebraico diante da divergência grega
  choice: Usar a forma de oração preservada no hebraico como texto principal.
  alternative: Seguir o texto grego, que traz uma exortação muito diferente.
  rationale: O hebraico disponível é o testemunho-fonte primário desta tradução e tem alta confiança. A divergência substancial do grego deve ser informada em nota, não harmonizada nem inserida no texto principal.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A vírgula marca a elipse do verbo no segundo membro e evita a repetição desnecessária de «enche».
