  text: For it is better that your children should beg from you than that you should look to the hands of your sons[a][b].
translation:
  language: pt
  text: Pois é melhor que seus filhos lhe peçam[a] do que você olhar para as mãos de seus filhos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lhe supliquem” ou “lhe peçam ajuda”; o verbo grego pode indicar um pedido insistente, especialmente em situação de necessidade.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “olhar para as mãos de seus filhos”, imagem de esperar deles provisão ou sustento.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  choice: melhor
  rationale: Equivalente comparativo natural em português, preservando o juízo de preferência expresso pelo grego.
- source_word: τέκνα
  choice: filhos
  rationale: Abrange os descendentes sem marcar exclusivamente o sexo masculino; em português, porém, a mesma palavra também pode traduzir υἱῶν, de modo que a distinção lexical grega não fica visível no corpo do texto.
- source_word: δεηθῆναί
  choice: peçam
  rationale: O verbo δέομαι pode indicar pedir com insistência ou em situação de necessidade. “Peçam” mantém essa amplitude sem impor o sentido mais forte de mendigar; a nota registra a alternativa contextual.
- source_word: ἐμβλέπειν εἰς χεῖρας
  choice: ficar olhando para as mãos
  rationale: Preserva a imagem concreta do grego e, com “ficar”, comunica a expectativa dependente sugerida pelo contexto.
- source_word: υἱῶν
  choice: filhos
  rationale: É a tradução portuguesa natural de υἱῶν neste contexto. Embora o grego seja especificamente masculino, “filhos” também é formalmente masculino em português; uma nota esclarece a imagem de dependência, sem substituir a formulação concreta.
theological_decisions:
- issue: Dependência econômica entre pai e filhos
  choice: Conservar a imagem “olhando para as mãos” e explicá-la em nota
  alternative: Traduzir diretamente como “depender do sustento de seus filhos”
  rationale: A formulação concreta preserva a metáfora e sua tensão, enquanto a nota torna explícita a implicação contextual sem incorporá-la como única leitura possível.
- issue: Distinção entre τέκνα e υἱῶν
  choice: Traduzir ambos por “filhos”, conforme o uso natural do português
  alternative: Usar “crianças/descendentes” no primeiro caso e “filhos homens” no segundo
  rationale: “Crianças” pode sugerir idade, “descendentes” é excessivamente formal e “filhos homens” soa artificial. A diferença lexical do grego não pode ser reproduzida aqui sem prejudicar a naturalidade; não há base suficiente para atribuir peso teológico à variação.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo comparativo do grego. Optou-se por “lhe peçam” em vez de “mendigarem de você”, que seria forte e menos idiomático; a metáfora das mãos foi mantida no texto.
