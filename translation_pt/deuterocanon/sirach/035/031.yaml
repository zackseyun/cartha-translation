  text: In all your works be preeminent[a]; do not give a blemish to your honor.
translation:
  language: pt
  text: Em tudo o que fizer, sobressaia; não manche a sua honra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não traga censura sobre a sua reputação”. O grego diz literalmente “glória”, aqui provavelmente no sentido de honra ou bom nome.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τοῖς ἔργοις σου
  choice: Em tudo o que fizer
  rationale: Expressa naturalmente a abrangência de «em todas as suas obras» em português atual, sem alterar o sentido.
- source_word: γίνου ὑπεράγων
  choice: sobressaia
  rationale: O imperativo com o particípio exorta a superar o comum ou distinguir-se. «Sobressaia» preserva essa força comparativa de modo conciso e digno.
- source_word: μὴ δῷς μῶμον
  choice: não manche
  rationale: A formulação idiomática em português conserva a imagem concreta de μῶμον como mancha, defeito ou motivo de censura.
- source_word: ἐν τῇ δόξῃ σου
  choice: a sua honra
  rationale: Neste contexto ético e social, δόξα indica honra ou bom nome, e não necessariamente glória em sentido teológico.
theological_decisions:
- issue: Sentido de δόξα no contexto sapiencial e ético
  choice: honra
  alternative: glória; reputação
  rationale: «Honra» mantém a dimensão pública e moral do termo sem introduzir uma conotação teológica que o contexto não exige; a nota registra as possibilidades lexicais.
translation_notes:
  register: Português moderno, claro e digno, com construção direta. «Sobressaia» retém a força de excelência de ὑπεράγων, enquanto «não manche a sua honra» torna idiomática a metáfora grega sem apagar sua imagem.
