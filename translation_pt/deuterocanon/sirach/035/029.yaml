  text: As long as you still live and have breath in you, do not give yourself over to any flesh.
translation:
  language: pt
  text: Enquanto você ainda viver e houver fôlego em você, não se entregue a nenhum mortal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “não mude a si mesmo para nenhuma carne”. A formulação grega é condensada; pode expressar a ideia de não se submeter a meros seres humanos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔτι ζῇς
  choice: Enquanto você ainda viver
  rationale: Expressa a duração contínua e a ênfase no tempo de vida que ainda resta, em português natural.
- source_word: πνοὴ ἐν σοί
  choice: houver fôlego em você
  rationale: Mantém a imagem concreta do fôlego vital e o paralelismo com estar vivo, sem introduzir a noção teológica mais específica de “espírito”.
- source_word: μὴ ἀλλάξῃς σεαυτὸν
  choice: não se entregue
  rationale: O verbo ἀλλάσσω significa normalmente “mudar” ou “trocar”, mas, nesta construção reflexiva e condensada, pode indicar ceder ou transferir a si mesmo. A formulação portuguesa comunica esse provável sentido ético sem apagar a dificuldade lexical, registrada na nota.
- source_word: πάσῃ σαρκί
  choice: a nenhum mortal
  rationale: A expressão literalmente ligada a “toda carne” designa aqui seres humanos em sua condição frágil e mortal. “Nenhum mortal” evita que “carne” seja entendida como desejo corporal ou natureza pecaminosa, ao mesmo tempo que conserva a força generalizante da proibição.
theological_decisions:
- issue: Sentido de σάρξ neste contexto sapiencial
  choice: ser humano mortal
  alternative: desejo corporal ou natureza pecaminosa
  rationale: Neste contexto, “carne” funciona como expressão para os seres humanos em sua fragilidade e mortalidade. Uma leitura ligada à natureza pecaminosa importaria um uso teológico posterior não exigido pelo texto.
- issue: Força de μὴ ἀλλάξῃς σεαυτὸν πάσῃ σαρκί
  choice: advertência para não se entregar ao domínio ou à pressão de nenhum mortal
  alternative: não mudar a si mesmo por causa de ninguém
  rationale: A construção grega é compacta e admite mais de uma compreensão. O texto principal apresenta o provável sentido de ceder a si mesmo, enquanto a nota conserva a tradução mais formal e a alternativa sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” torna a exortação singular explícita. A expressão literal com “carne”, pouco natural e potencialmente ambígua em português, foi preservada na nota.
