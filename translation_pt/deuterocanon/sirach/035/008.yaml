  text: Sum up your speech[a]; in few words say much[b]. Be like one who knows and yet keeps silent.
translation:
  language: pt
  text: Resuma o que tem a dizer[a]; em poucas palavras, diga muito[b]. Seja como quem sabe e, ao mesmo tempo, se cala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico preservado deste versículo é difícil e parece estar parcialmente corrompido. O paralelo grego foi usado para recuperar o sentido provável, sobretudo nas duas primeiras orações.
    reason: textual_variant
  - marker: b
    text: 'Literalmente, o grego diz: “em poucas coisas, muitas”, expressão que significa dizer muito com poucas palavras.'
    reason: lexical_alternative
lexical_decisions:
- source_word: השבת ראש פאתי
  choice: Resuma o que tem a dizer
  rationale: O hebraico preservado é difícil e provavelmente sofreu corrupção textual. A leitura é orientada pelo paralelo grego κεφαλαίωσον λόγον, que significa levar o discurso ao ponto principal, resumindo-o. A formulação escolhida é natural e conserva a exortação à concisão.
- source_word: מואב / ἐν ὀλίγοις πολλά
  choice: em poucas palavras, diga muito
  rationale: A forma hebraica transmitida não produz sentido coerente neste contexto. O grego preserva a expressão idiomática 'em poucas coisas, muitas', isto é, comunicar muito com poucas palavras.
- source_word: γίνου ὡς γινώσκων
  choice: Seja como quem sabe
  rationale: O paralelo grego fornece uma exortação clara onde o hebraico é instável. A tradução mantém a comparação e o valor participial de 'quem sabe'.
- source_word: ἅμα σιωπῶν
  choice: e, ao mesmo tempo, se cala
  rationale: A expressão reúne conhecimento e silêncio simultaneamente. 'Se cala' transmite de forma corrente a ideia de guardar silêncio sem explicar ou suavizar a tensão do conselho sapiencial.
