  text: Any wound a living creature may heal[b][a], but there is pain worse than pain.
translation:
  language: pt
  text: Um ser vivo pode curar qualquer ferida[a][b], mas há dor pior que dor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico deste versículo é difícil e provavelmente está danificado em alguns pontos. A primeira oração foi traduzida segundo o sentido provável. A frase final também é incerta; mais literalmente, lê-se algo como: “há um golpe maior ou pior que outro golpe...”.'
    reason: textual_variant
  - marker: b
    text: 'O texto grego preservado por Swete diz: “e guarda-te de teus filhos”, leitura muito diferente do hebraico existente e que talvez reflita outra forma do texto.'
    reason: alternative_reading
lexical_decisions:
- source_word: כל נכה
  choice: Toda ferida
  rationale: כל tem valor distributivo, e נכה designa aqui uma lesão ou ferida. A formulação conserva o caráter proverbial e soa natural em português.
- source_word: תאכל חיה
  choice: pode sarar
  rationale: A sequência hebraica preservada é obscura e possivelmente corrompida. A tradução expressa o sentido provável de uma ferida que pode ser curada, sem tentar reproduzir literalmente uma construção cujo significado não é seguro.
- source_word: אך
  choice: mas
  rationale: A conjunção introduz de modo simples e direto o contraste entre uma ferida curável e uma dor de gravidade excepcional.
- source_word: מכה ממכה תנעם
  choice: há dor pior que dor
  rationale: O texto final é difícil. A repetição de מכה é preservada, em termos idiomáticos, pela repetição de “dor”, enquanto “pior” comunica o provável valor comparativo de מן e o sentido de maior gravidade sugerido pelo paralelismo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura breve e proverbial. A repetição “dor pior que dor” mantém a força retórica do hebraico sem dar falsa precisão a um texto materialmente incerto.
