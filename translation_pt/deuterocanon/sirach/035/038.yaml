base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/038.yaml
  text: Assign him work as is fitting for him; and if he does not obey[a], make his fetters heavy. But do not be excessive with any flesh, and do nothing without judgment.
translation:
  language: pt
  text: Designe-o para trabalhos que lhe sejam adequados; e, se ele não obedecer, torne pesados os seus grilhões. Mas não se exceda com pessoa alguma[a] e não faça nada sem discernimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “com toda carne”; isto é, com qualquer pessoa.
    reason: A nota preserva a expressão concreta ἐν πάσῃ σαρκί e esclarece seu sentido idiomático no contexto.
lexical_decisions:
- source_word: εἰς ἔργα κατάστησον
  choice: Designe-o para trabalhos
  rationale: O verbo καθίστημι com εἰς e acusativo indica colocar ou designar alguém para uma função ou tarefa. A formulação mantém a força diretiva e soa natural em português.
- source_word: καθὼς πρέπει αὐτῷ
  choice: que lhe sejam adequados
  rationale: πρέπει expressa aquilo que convém ou é apropriado. A tradução conserva essa noção de adequação sem recorrer a linguagem arcaica.
- source_word: κἂν μὴ πειθαρχῇ
  choice: e, se ele não obedecer
  rationale: πειθαρχέω indica obediência a uma autoridade ou ordem. O grego não explicita um objeto como “disciplina”, portanto ele não foi acrescentado.
- source_word: βάρυνον τὰς πέδας αὐτοῦ
  choice: torne pesados os seus grilhões
  rationale: πέδαι são grilhões ou correntes que prendem os pés. A tradução preserva a imagem concreta e a construção do grego.
- source_word: μὴ περισσεύσῃς
  choice: não se exceda
  rationale: Neste contexto, περισσεύω adverte contra ultrapassar a medida apropriada, especialmente no rigor aplicado.
- source_word: ἐν πάσῃ σαρκί
  choice: com pessoa alguma
  rationale: Embora σάρξ signifique literalmente “carne”, aqui a expressão idiomática se refere a qualquer ser humano. A tradução comunica esse referente em português corrente, enquanto a nota preserva a forma concreta do grego.
- source_word: ἄνευ κρίσεως
  choice: sem discernimento
  rationale: κρίσις pode significar julgamento, decisão ou discernimento. “Discernimento” expressa aqui a avaliação prudente que deve preceder qualquer ação, sem excluir a ideia de juízo justo.
- source_word: μὴ ποιήσῃς μηδέν
  choice: não faça nada
  rationale: A construção negativa enfática do grego constitui uma proibição abrangente, transmitida de modo direto e natural.
theological_decisions:
- issue: Sentido de σάρξ numa advertência sapiencial
  choice: pessoa alguma
  alternative: carne alguma
  rationale: A expressão grega emprega o termo concreto “carne” para se referir idiomaticamente a qualquer pessoa. “Pessoa alguma” torna o sentido inteligível em português moderno sem atribuir ao termo uma conotação doutrinária específica; a literalidade relevante é registrada em nota.
- issue: Amplitude semântica de κρίσις
  choice: discernimento
  alternative: julgamento
  rationale: O contexto aconselha que nenhuma medida seja tomada sem avaliação ponderada. “Discernimento” preserva essa dimensão prática, enquanto “julgamento” continua sendo uma possibilidade lexical legítima.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira e alcance internacional. Mantém-se a dureza da imagem dos grilhões sem suavização, ao mesmo tempo que a advertência final contra o excesso permanece clara. O marcador da nota foi colocado junto à expressão correspondente a ἐν πάσῃ σαρκί.
