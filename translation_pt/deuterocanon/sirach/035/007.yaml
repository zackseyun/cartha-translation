base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/007.yaml
  text: Hasten the end and attend to the appointed time[b][a], for who will tell you what you should do?
translation:
  language: pt
  text: Apresse o fim e atente para o tempo determinado,[a] pois quem lhe dirá o que você deve fazer?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tradição grega paralela traz aqui uma leitura muito diferente: “Fale, jovem, se houver necessidade de você; mal duas vezes, se for interrogado”. Isso parece refletir outra forma textual, e não uma tradução próxima do hebraico preservado.'
    reason: textual_variant
  - marker: b
    text: O hebraico diz literalmente “o que você fará” e também pode ser entendido como “o que fazer”; “o que você deve fazer” explicita a força prática da pergunta retórica.
    reason: lexical_alternative
lexical_decisions:
- source_word: החיש
  choice: Apresse
  rationale: O imperativo de חושׁ expressa urgência. “Apresse” conserva a força direta da ordem sem explicitar além do hebraico quem ou o que produzirá o resultado.
- source_word: קץ
  choice: o fim
  rationale: קץ denota normalmente “fim” ou “término”. A expressão hebraica é concisa e elíptica; “o fim” preserva essa tensão sem substituí-la por uma interpretação como “desfecho”.
- source_word: ופקוד
  choice: e atente para
  rationale: פקד possui ampla extensão semântica, incluindo voltar a atenção para, cuidar, visitar, designar ou levar em conta. Com מועד, “atente para” comunica consideração ativa sem fixar indevidamente um sentido técnico.
- source_word: מועד
  choice: o tempo determinado
  rationale: מועד pode indicar um tempo fixado ou designado. “Tempo determinado” é natural em português e mantém a noção de uma ocasião estabelecida, sem especificar por quem.
- source_word: כי
  choice: pois
  rationale: Introduz a razão para as ordens anteriores; “pois” preserva de modo conciso essa relação argumentativa.
- source_word: מי יאמר לך
  choice: quem lhe dirá
  rationale: Mantém a forma interrogativa futura e a força retórica direta do hebraico.
- source_word: מה תעשה
  choice: o que você deve fazer
  rationale: A forma hebraica diz literalmente “o que você fará”, mas, nesta pergunta retórica, pode ter o sentido prático de orientação sobre como agir. A tradução explicita com moderação essa força, e a alternativa literal é registrada em nota.
theological_decisions:
- issue: Prioridade do testemunho hebraico diante do paralelo grego divergente
  choice: Traduzir o texto hebraico existente como testemunho principal e registrar a divergência grega em nota.
  alternative: 'Seguir o grego: “Fale, jovem, se houver necessidade de você; mal duas vezes, se for interrogado”.'
  rationale: O paralelo grego não constitui uma tradução próxima do hebraico preservado e parece representar outra forma textual ou outro alinhamento do versículo. Dar prioridade ao hebraico respeita a evidência primária fornecida, enquanto a nota torna transparente a instabilidade da tradição textual sem harmonizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se “você” para representar com naturalidade o singular masculino do hebraico. A concisão pouco comum de “Apresse o fim” foi mantida para não eliminar a ambiguidade do original.
