  text: Where[a] there is listening[b], do not pour out speech, and do not show off wisdom[c] at the wrong time.
translation:
  language: pt
  text: Onde[a] há quem escute[b], não derrame palavras nem se faça de sábio[c] na hora errada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho hebraico fornecido para este versículo parece estar deslocado e não corresponde a Sirácida 35:4. Por isso, a tradução segue o paralelo grego, que adverte contra falar demais e exibir sabedoria em momento impróprio.
    reason: textual_variant
  - marker: b
    text: 'Ou: “Onde há uma audiência”. O termo grego pode indicar a escuta ou a audição, bem como um grupo de ouvintes.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “não se mostre sábio”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: Onde
  rationale: Introduz de modo natural a circunstância em que se deve refrear a fala, preservando o valor locativo do grego.
- source_word: ἀκρόαμα
  choice: há quem escute
  rationale: Expressa em português corrente a presença de ouvintes sem restringir o termo a uma plateia formal; a ambiguidade entre escuta e audiência é registrada em nota.
- source_word: μὴ ἐκχέῃς
  choice: não derrame
  rationale: Conserva a metáfora vívida de verter ou despejar algo, aqui aplicada às palavras.
- source_word: λαλιάν
  choice: palavras
  rationale: Comunica com naturalidade o sentido de fala ou conversa e combina bem com a metáfora de derramar.
- source_word: ἀκαίρως
  choice: na hora errada
  rationale: Traduz claramente a ideia de agir em momento impróprio, em linguagem moderna e acessível.
- source_word: μὴ σοφίζου
  choice: nem queira mostrar-se sábio
  rationale: Preserva o valor reflexivo e a censura à exibição inoportuna de sabedoria, sem sugerir que a sabedoria em si seja condenada.
theological_decisions:
- issue: Seleção da fonte primária para este versículo
  choice: Traduzir o paralelo grego, pois o texto hebraico fornecido não corresponde a Sirácida 35:4.
  alternative: 'Traduzir o hebraico fornecido: “E saberão, como nós soubemos, que não há Deus além de ti.”'
  rationale: O hebraico apresentado contém uma confissão sobre não haver outro Deus e pertence evidentemente a outro contexto, enquanto o grego preserva a máxima esperada neste versículo. A opção pelo grego evita atribuir ao versículo um texto deslocado, e a incerteza documental é informada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora “derrame palavras” foi mantida por sua força poética, e “queira mostrar-se sábio” evita o coloquialismo excessivo de “banque o sábio”.
