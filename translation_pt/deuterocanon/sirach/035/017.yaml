  text: The throat eats every kind of food[b][a], but one kind of food is more pleasant than another.
translation:
  language: pt
  text: A garganta come todo tipo de alimento[b][a], mas há alimento mais agradável que outro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico é um provérbio conciso e sua forma preservada é um tanto difícil. O texto grego deste versículo difere bastante: “O pecador evitará a repreensão e, conforme a sua vontade, encontrará julgamento ou argumento”. Isso pode indicar que o grego traduziu um texto hebraico diferente ou que houve alteração na transmissão textual.'
    reason: textual_variant
  - marker: b
    text: Ou “o esôfago”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כל מאכל
  choice: todo tipo de alimento
  rationale: A expressão hebraica formula uma afirmação geral; esta tradução é natural em português e preserva seu alcance universal.
- source_word: אוכל
  choice: come
  rationale: É o verbo comum para comer; a forma simples conserva o caráter direto do provérbio.
- source_word: גרגרת
  choice: a garganta
  rationale: O termo designa a garganta ou o canal por onde passa o alimento. “Garganta” é claro e corrente, sem deslocar o sentido para o paladar.
- source_word: אך
  choice: mas
  rationale: A partícula introduz o contraste entre a capacidade de ingerir qualquer alimento e a preferência por alguns.
- source_word: יש אכל מאכל נעים
  choice: um alimento é mais agradável do que outro
  rationale: A formulação explicita em português a comparação implícita no contraste hebraico, sem definir em que consiste o agrado.
