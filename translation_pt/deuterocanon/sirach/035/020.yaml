  text: The palate tests the flavors of speech, and an understanding heart the flavors of falsehood.
translation:
  language: pt
  text: O paladar prova os sabores da fala, e o coração entende os sabores da falsidade.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O paladar prova o gosto da palavra, e o coração discernidor, o gosto da mentira.” O hebraico repete a metáfora do gosto nos dois membros do verso.'
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego paralelo difere substancialmente: “Não andes por um caminho de tropeço e não tropeces em lugares pedregosos.” Esta tradução segue o testemunho hebraico preservado como fonte principal deste verso.'
    reason: textual_variant
lexical_decisions:
- source_word: חך
  choice: o paladar
  rationale: O hebraico designa literalmente o palato, órgão do gosto. Em português, “paladar” transmite com naturalidade a função de provar, sem perder a metáfora sensorial.
- source_word: בוחן
  choice: prova
  rationale: O verbo expressa examinar ou pôr à prova. “Prova” se ajusta ao campo semântico do paladar e também permite a ideia de avaliação cuidadosa.
- source_word: מטעמי
  choice: os sabores de
  rationale: O termo deriva do campo de gosto e sabor. A repetição de “sabores” nos dois membros preserva a metáfora deliberadamente reiterada no hebraico.
- source_word: דבר
  choice: fala
  rationale: Aqui, o substantivo pode significar palavra, discurso ou assunto. “Fala” representa de modo natural o sentido coletivo de expressão verbal, embora “palavra” continue possível.
- source_word: לב מבין
  choice: o coração que entende
  rationale: A tradução conserva o coração como sede do entendimento na antropologia hebraica e reflete a construção verbal de modo claro em português.
- source_word: כזב
  choice: falsidade
  rationale: O termo abrange mentira, engano e aquilo que é falso. “Falsidade” mantém essa amplitude e forma um paralelo abstrato com “fala”.
