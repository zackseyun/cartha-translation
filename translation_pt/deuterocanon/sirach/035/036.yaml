lexical_decisions:
- source_word: ἔμβαλε
  choice: Ponha
  rationale: O imperativo aoristo de ἐμβάλλω, com εἰς ἐργασίαν, tem aqui o sentido idiomático de colocar ou destinar alguém ao trabalho. “Ponha” preserva a força imperativa em português natural.
- source_word: αὐτὸν
  choice: -o
  rationale: O pronome acusativo masculino singular retoma uma pessoa do sexo masculino no contexto; o pronome átono “-o” é a forma direta e fluente em português.
- source_word: εἰς ἐργασίαν
  choice: para trabalhar
  rationale: ἐργασία designa trabalho, labor ou ocupação. Com ἔμβαλε, “para trabalhar” exprime naturalmente a ideia de pôr alguém em atividade.
- source_word: ἵνα
  choice: para que
  rationale: Introduz uma oração de finalidade; “para que” mantém claramente esse valor em português atual.
- source_word: μὴ ἀργῇ
  choice: não fique ocioso
  rationale: ἀργέω significa estar inativo ou ocioso. “Não fique ocioso” preserva o sentido sem acrescentar o juízo de caráter mais forte implicado por “preguiçoso”.
