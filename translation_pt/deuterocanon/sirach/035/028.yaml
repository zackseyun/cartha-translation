  yaml_path: translation/deuterocanon/sirach/035/028.yaml
  text: Do not give authority over yourself in your lifetime to son or wife[a], brother or friend; and do not give your property to another, lest you regret it and have to ask for it back.
translation:
  language: pt
  text: Enquanto você viver, não dê a um filho nem à esposa, a um irmão nem a um amigo autoridade sobre você; e não entregue os seus bens a outra pessoa, para que não venha a se arrepender e tenha de pedi-los de volta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e fique necessitado deles» ou «e tenha de pedir por eles». A frase grega final é condensada, e δέῃ περὶ αὐτῶν admite mais de uma nuance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δῷς ἐξουσίαν ἐπὶ σὲ
  choice: não dê ... autoridade sobre você
  rationale: Preserva a construção concreta do grego e o sentido de conceder a alguém poder ou controle sobre a própria pessoa.
- source_word: ἐν ζωῇ σου
  choice: enquanto você viver
  rationale: 'Expressa de modo natural e direto o limite temporal indicado pelo grego: durante a vida do destinatário.'
- source_word: υἱῷ καὶ γυναικί, ἀδελφῷ καὶ φίλῳ
  choice: a um filho nem à esposa, a um irmão nem a um amigo
  rationale: Em uma proibição, «nem» apresenta naturalmente em português os relacionamentos próximos enumerados no grego. O artigo indefinido evita acrescentar possessivos que não estão expressos no texto-fonte.
- source_word: τὰ χρήματά σου
  choice: os seus bens
  rationale: χρήματα pode abranger dinheiro, posses e recursos materiais; «bens» conserva essa amplitude sem restringir o sentido a dinheiro.
- source_word: ἑτέρῳ
  choice: a outra pessoa
  rationale: Torna explícita a referência pessoal implícita no adjetivo substantivado grego e soa natural em português.
- source_word: ἵνα μὴ μεταμεληθεὶς
  choice: para que não venha a se arrepender
  rationale: Reproduz a consequência futura advertida pelo texto e o sentido de pesar posterior expresso por μεταμέλομαι.
- source_word: δέῃ περὶ αὐτῶν
  choice: tenha de pedi-los de volta
  rationale: 'No contexto de entregar os próprios bens, esta formulação comunica a consequência implícita mais provável: ficar obrigado a solicitá-los novamente. A nota preserva a formulação grega mais literal e sua incerteza.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção acessível tanto a leitores brasileiros quanto a outros leitores lusófonos. «Você» mantém legibilidade brasileira; «os seus bens» conserva a abrangência do termo grego. A repetição de «nem» deixa clara a força da proibição.
