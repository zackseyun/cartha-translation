  text: The prayer of the humble has passed through the clouds[a], and until it draws near, it will not be comforted[b];
translation:
  language: pt
  text: A oração do humilde atravessou as nuvens[a] e, até que se aproxime, não haverá consolo[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perfurou as nuvens”; a imagem grega apresenta a oração do humilde subindo sem impedimento até a presença de Deus.
    reason: lexical_alternative
  - marker: b
    text: 'O grego é um pouco ambíguo quanto ao sujeito: pode referir-se à oração que se aproxima, à pessoa humilde que se aproxima, ou à pessoa humilde que ainda não recebe consolo. A redação procura preservar essa ambiguidade.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσευχὴ
  choice: oração
  rationale: É o equivalente corrente e natural para uma súplica dirigida a Deus neste contexto.
- source_word: ταπεινοῦ
  choice: do humilde
  rationale: Preserva a dimensão moral e espiritual do termo sem restringi-lo à pobreza ou à aflição social.
- source_word: νεφέλας διῆλθεν
  choice: atravessou as nuvens
  rationale: Conserva de modo transparente a imagem vívida da oração que sobe sem impedimento.
- source_word: ἕως συνεγγίσῃ
  choice: enquanto não se aproximar
  rationale: Expressa naturalmente em português a ideia de que a oração prossegue até chegar perto, sem explicitar um destino que o grego deixa implícito.
- source_word: οὐ μὴ παρακληθῇ
  choice: não será consolada
  rationale: Mantém o sentido passivo usual de παρακαλέω e a possível personificação da oração, embora o referente permaneça ambíguo.
theological_decisions:
- issue: Ambiguidade do sujeito na segunda oração
  choice: A oração é tratada como o sujeito que se aproxima e não será consolado.
  alternative: A oração se aproxima, mas é a pessoa humilde que não será consolada; ou a própria pessoa humilde se aproxima e não será consolada.
  rationale: A oração é o antecedente gramatical mais próximo, mas as formas verbais gregas não marcam gênero e permitem uma mudança implícita para a pessoa que ora. A nota preserva essa tensão em vez de resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A personificação incomum de “oração” foi mantida no texto para refletir a formulação e a ambiguidade do grego, esclarecidas em nota.
