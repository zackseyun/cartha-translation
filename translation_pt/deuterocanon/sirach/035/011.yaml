translation:
  language: pt
  text: Tem misericórdia da cidade da tua santidade[a], Jerusalém[b], lugar estabelecido para a tua habitação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “a cidade da tua santidade”. A expressão também pode ser entendida como “tua cidade santa” ou, de modo mais interpretativo, “a cidade do teu santuário”.'
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo grego fornecido difere substancialmente neste ponto e traz, em vez disso, uma exortação semelhante a: “Levanta-te na hora certa e não te atrases; corre para casa e não sejas negligente”. Como o hebraico deste versículo foi preservado, ele é seguido no texto principal, e o grego é registrado como variante textual.'
    reason: textual_variant
lexical_decisions:
- source_word: רחם
  choice: Tem misericórdia
  rationale: O imperativo expressa uma súplica direta por compaixão; esta formulação preserva o tom de oração e é natural no registro bíblico moderno.
- source_word: קרית
  choice: cidade
  rationale: קרית designa uma cidade e se refere aqui a Jerusalém.
- source_word: קדשך
  choice: da tua santidade
  rationale: Preserva o genitivo hebraico e sua ambiguidade, sem determinar se a referência é à cidade santa ou ao santuário nela situado.
- source_word: ירושלים
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome próprio.
- source_word: מכון
  choice: lugar estabelecido
  rationale: מכון indica um lugar firme, fixado ou estabelecido; a tradução mantém esse elemento distinto da habitação mencionada em seguida.
- source_word: שבתך
  choice: da tua habitação
  rationale: Expressa o sentido de morada ou habitação divina e conserva a construção nominal compacta do hebraico.
theological_decisions:
- issue: Sentido da expressão קדשך
  choice: cidade da tua santidade
  alternative: tua cidade santa; cidade do teu santuário
  rationale: A construção genitiva formal preserva a linguagem elevada e a tensão entre a santidade atribuída à cidade e a possível alusão ao santuário, sem escolher silenciosamente uma interpretação.
- issue: Relação entre o texto hebraico e o paralelo grego
  choice: Seguir o hebraico sobrevivente e registrar a divergência grega em nota
  alternative: Traduzir o paralelo grego ou harmonizar as duas formas textuais
  rationale: O hebraico preservado é a evidência principal para este versículo; como o grego apresenta conteúdo substancialmente diferente, ele deve ser tratado com transparência como variante textual, não incorporado à linha hebraica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com leve elevação poética. A formulação formal “cidade da tua santidade” conserva deliberadamente a construção e a ambiguidade do hebraico; “lugar estabelecido da tua habitação” mantém distintos os dois componentes da expressão final.
