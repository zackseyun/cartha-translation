base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/023.yaml
  text: A woman’s beauty brightens the face[a], and it surpasses every delight of the eye.
translation:
  language: pt
  text: A beleza de uma mulher ilumina o rosto[a] e supera tudo o que encanta os olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz uma leitura substancialmente diferente: “Em toda obra, confia em tua alma, pois também isto é guardar os mandamentos.”'
    reason: alternative_reading
lexical_decisions:
- source_word: תאר
  choice: beleza
  rationale: O substantivo pode designar forma, aparência ou formosura. Neste contexto, ligado à mulher e ao efeito visual descrito no segundo membro, “beleza” comunica naturalmente a ideia de formosura exterior.
- source_word: יחליץ פנים
  choice: ilumina o rosto
  rationale: A expressão hebraica é difícil e parece indicar um efeito positivo e visível sobre o rosto. “Ilumina o rosto” preserva a imagem idiomática sem tentar definir além do que o hebraico permite.
- source_word: מחמד עין
  choice: tudo o que encanta os olhos
  rationale: A expressão denota aquilo que é desejável, precioso ou agradável aos olhos. Esta formulação mantém tanto o componente visual quanto o de atração.
- source_word: יגבר
  choice: supera
  rationale: O verbo significa ser forte, prevalecer ou exceder. Na comparação poética, “supera” expressa com clareza a superioridade indicada.
theological_decisions:
- issue: Divergência entre o hebraico preservado e o paralelo grego
  choice: Traduzir o hebraico preservado no texto principal e registrar a leitura grega em nota.
  alternative: 'Seguir o grego: “Em toda obra, confia em tua alma, pois também isto é guardar os mandamentos.”'
  rationale: Como o hebraico está preservado e tem alta confiança, ele rege o texto principal. O grego apresenta uma linha inteiramente diferente, e não apenas uma variante menor; por isso, sua leitura é preservada em nota, sem harmonização.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção poética mantém o paralelismo do hebraico. “Ilumina o rosto” conserva a dificuldade imagética da expressão sem recorrer a linguagem arcaica.
