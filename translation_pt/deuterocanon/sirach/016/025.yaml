  text: I will declare my spirit with measure[c][b][a], and with care I will make my knowledge known.
translation:
  language: pt
  text: Expressarei com ponderação[b] o meu espírito[a] e, com discrição[c], darei a conhecer o meu conhecimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico diz “o meu espírito”; o paralelo grego traz “instrução”. A tradução mantém a leitura hebraica, que também pode apontar para o pensamento ou ensino formado no íntimo.
    reason: alternative_reading
  - marker: b
    text: “Com ponderação” traduz literalmente uma expressão ligada a “peso” ou “medida”, imagem de palavras cuidadosamente pesadas.
    reason: lexical_alternative
  - marker: c
    text: A expressão hebraica pode significar “com discrição”, “com modéstia” ou “com cuidado”; o paralelo grego enfatiza a exatidão.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבִּיעָה
  choice: Expressarei
  rationale: O verbo נבע evoca fazer brotar ou proferir algo. “Expressarei” comunica naturalmente a exteriorização do que está no íntimo e é compatível com o paralelo grego ἐκφανῶ, “manifestarei”.
- source_word: בְמִשְׁקָל
  choice: com ponderação
  rationale: O hebraico significa literalmente “com peso/medida”. “Com ponderação” conserva a metáfora do discurso pesado com cuidado e soa natural em português.
- source_word: רוּחִי
  choice: o meu espírito
  rationale: Tradução direta do hebraico, sem substituir a leitura por “instrução”, que pertence ao testemunho grego. A formulação preserva a possível referência ao pensamento ou impulso interior do sábio.
- source_word: וּבְהַצְנֵעַ
  choice: com discrição
  rationale: O termo derivado de צנע pode indicar modéstia, reserva ou cuidado. “Com discrição” preserva esse campo sem apagar a ênfase grega na exatidão.
- source_word: אֲחַוֶּה
  choice: darei a conhecer
  rationale: O verbo significa mostrar, declarar ou comunicar. A locução combina naturalmente com “conhecimento” e corresponde bem ao grego ἀπαγγέλλω.
- source_word: דֵעִי
  choice: o meu conhecimento
  rationale: Equivalente direto de דֵעִי e próximo do grego ἐπιστήμην, mantendo a referência ao saber do falante.
