base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/004.yaml
  text: From one God-fearing childless man a city will be inhabited, but from a family of traitors it will be laid waste.
translation:
  language: pt
  text: De um só homem sem filhos que teme o SENHOR, uma cidade será povoada.[a] Mas, de uma família de traidores, ela será devastada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz: “De um só homem prudente, uma cidade será povoada.” O hebraico traz: “De um só homem sem filhos que teme o SENHOR”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֶחַד
  choice: De um só
  rationale: Preserva a ideia de fonte ou origem expressa por מִן e o contraste entre um único indivíduo e uma família inteira.
- source_word: עֲרִירִי
  choice: homem sem filhos
  rationale: O hebraico designa normalmente alguém sem filhos ou descendência. A formulação é clara e natural em português.
- source_word: יְרֵא יְהֹוָה
  choice: que teme o SENHOR
  rationale: Representa explicitamente tanto o temor reverente quanto o nome divino presente no hebraico, seguindo a convenção portuguesa de verter o tetragrama por SENHOR.
- source_word: תֵּשֵׁב עִיר
  choice: uma cidade será povoada
  rationale: Comunica o sentido passivo e resultativo de uma cidade vir a ser habitada, com expressão idiomática em português.
- source_word: מִמִּשְׁפַּחַת
  choice: por causa de uma família
  rationale: Neste segundo membro, a preposição pode indicar a origem causal da devastação. 'Por causa de' torna clara a relação sem sugerir que a cidade é feita a partir da família.
- source_word: בֹּגְדִים
  choice: traidores
  rationale: Conserva a força moral de pessoas que agem com perfídia e traem a confiança.
- source_word: תֶּחֱרָב
  choice: ela será devastada
  rationale: Preserva o sentido severo e passivo de ficar arruinada ou desolada; o pronome retoma naturalmente 'cidade'.
theological_decisions:
- issue: Seguir o hebraico עֲרִירִי ('sem filhos') ou o grego συνετοῦ ('prudente') no primeiro membro
  choice: 'O texto principal segue o hebraico: ''homem sem filhos''.'
  alternative: O grego traz 'homem prudente'.
  rationale: Como o testemunho hebraico sobrevivente tem alta confiança, ele rege o texto principal. A divergência grega é semanticamente importante e, por isso, é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem 'homem sem filhos que teme o SENHOR' evita ambiguidade adjetival e explicita o nome divino. O paralelismo entre um indivíduo e uma família foi mantido.
