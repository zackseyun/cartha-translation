  text: My eye has seen many such things[a], and my ear has heard things as mighty as these.
translation:
  language: pt
  text: Meu olho viu muitas coisas assim, e meu ouvido ouviu coisas poderosas como essas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego traz “mais poderosas do que essas”; o hebraico pode ser traduzido literalmente por “poderosas como essas”.
    reason: variante_textual
lexical_decisions:
- source_word: רַבּוֹת כָּאֵלֶּה
  choice: muitas coisas assim
  rationale: 'O adjetivo feminino plural רַבּוֹת funciona substantivamente, e כָּאֵלֶּה expressa comparação demonstrativa: “muitas coisas desse tipo”. A formulação escolhida é clara e natural em português.'
- source_word: רַאֲתָה עֵינִי
  choice: meu olho viu
  rationale: Mantém o singular concreto do hebraico e o paralelismo poético com “meu ouvido ouviu”, sem reduzir a expressão a um simples “eu vi”.
- source_word: וְעַצֻּמוֹת כָּאֵלֶּה
  choice: coisas poderosas como essas
  rationale: עַצֻּמוֹת denota força ou poder, enquanto כָּאֵלֶּה, no texto hebraico, significa literalmente “como essas” ou “desse tipo”. A tradução principal segue o hebraico sem introduzir por si só um comparativo.
- source_word: שָׂמְעָה אָזְנִי
  choice: meu ouvido ouviu
  rationale: Preserva o singular do hebraico e a estrutura paralela do verso. Embora a repetição soe marcada em português, ela continua compreensível e reproduz a força poética do original.
