  text: Those lacking sense will understand these things[a], and a foolish man will consider this.
translation:
  language: pt
  text: Os que não têm bom senso entenderão estas coisas[a], e o homem insensato refletirá sobre isto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No segundo membro, o hebraico traz “isto”, enquanto o paralelo grego traz “coisas tolas”. O texto principal segue o testemunho hebraico; o grego ajuda a indicar que “insensato” significa mais do que simplesmente ingênuo.
    reason: alternative_reading
lexical_decisions:
- source_word: חַסְרֵי לֵב
  choice: os que não têm bom senso
  rationale: A expressão significa literalmente “carentes de coração”, mas “coração” funciona aqui como sede do entendimento e do juízo. “Não têm bom senso” comunica o idioma hebraico em português natural, sem sugerir deficiência emocional.
- source_word: יָבִינוּ
  choice: entenderão
  rationale: O verbo denota entender ou discernir; o futuro simples reproduz diretamente a forma verbal hebraica.
- source_word: אֵלֶּה
  choice: estas coisas
  rationale: O demonstrativo hebraico é plural. A inclusão de “coisas” torna seu valor substantivo claro em português.
- source_word: גֶבֶר
  choice: homem
  rationale: O substantivo hebraico é masculino e apresenta aqui um indivíduo masculino típico da literatura sapiencial.
- source_word: פּוֹתֶה
  choice: insensato
  rationale: O termo pode designar alguém ingênuo, simplório ou facilmente desencaminhado. “Insensato” expressa a falta de juízo indicada no contexto; o paralelo grego reforça esse sentido ao falar de alguém tolo e extraviado.
- source_word: יַחְשֹׁב
  choice: refletirá sobre
  rationale: O verbo pode significar pensar, considerar ou ponderar. “Refletirá sobre” é natural em português e preserva o sentido deliberativo sem acrescentar uma conclusão ao pensamento.
- source_word: זֹאת
  choice: isto
  rationale: O demonstrativo hebraico é singular. “Isto” preserva a mudança do plural no primeiro membro para o singular no segundo, sem harmonizá-los.
