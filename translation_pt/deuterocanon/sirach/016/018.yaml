base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/018.yaml
  text: 'Look—the heavens and the highest heavens[a], the deep and the earth: when he descends upon them, they stand still[b]; at his visitation they quake.'
translation:
  language: pt
  text: 'Eis os céus e os mais altos céus[a], o abismo e a terra: quando ele desce sobre eles, permanecem imóveis[b]; quando ele os visita, estremecerão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os céus e os céus dos céus”, expressão superlativa aqui traduzida como “os céus e os mais altos céus”.'
    reason: lexical_alternative
  - marker: b
    text: 'A frase hebraica “quando ele desce sobre eles, permanecem imóveis” é difícil neste texto composto dos manuscritos hebraicos da Guenizá do Cairo. O paralelo grego não traz essa frase e diz, em síntese: “o abismo e a terra serão abalados por ocasião de sua visita”.'
    reason: textual_variant
lexical_decisions:
- source_word: הֵן
  choice: Eis
  rationale: Preserva a força enfática e demonstrativa da partícula hebraica em uma forma concisa, digna e reconhecível no português atual.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: os céus e os mais altos céus
  rationale: Expressa de modo idiomático o superlativo hebraico literal “os céus dos céus”, sem perder a ideia da esfera celeste mais elevada.
- source_word: תְהוֹם
  choice: o abismo
  rationale: Representa a profundeza primordial indicada pelo hebraico; o grego ἄβυσσος confirma esse campo semântico.
- source_word: בְּרִדְתּוֹ עֲלֵיהֶם עוֹמְדִים
  choice: quando ele desce sobre eles, permanecem imóveis
  rationale: Mantém no texto principal a difícil frase preservada pelo testemunho hebraico, sem apagar sua imagem antropomórfica nem tentar harmonizá-la silenciosamente com o grego.
- source_word: בְּפָקְדוֹ
  choice: quando ele os visita
  rationale: Traduz פקד como intervenção ou visita divina e preserva a relação temporal; o grego ἐν τῇ ἐπισκοπῇ αὐτοῦ apoia esse sentido.
- source_word: יִרְגְּשׁוּ
  choice: estremecem
  rationale: Comunica agitação ou tremor cósmico com naturalidade; o grego σαλευθήσονται também aponta para o sentido de ser abalado.
theological_decisions:
- issue: Linguagem antropomórfica sobre a ação divina
  choice: quando ele desce sobre eles
  alternative: por ocasião de sua visita
  rationale: Embora o paralelo grego fale somente da visitação divina, o hebraico preservado contém a imagem de descida. A tradução a mantém e sinaliza a dificuldade textual, em vez de eliminar a tensão.
- issue: Sentido da visita divina
  choice: quando ele os visita
  alternative: quando ele os inspeciona
  rationale: “Visita” conserva a amplitude de פקד e ἐπισκοπή — presença, inspeção ou intervenção — sem definir se a ação é apenas judicial ou punitiva.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é solene sem arcaísmo excessivo. “Eis” mantém a abertura enfática; “mais altos céus” torna idiomática a construção superlativa hebraica. A frase hebraica textualmente difícil foi preservada no corpo e esclarecida em nota.
