  yaml_path: translation/deuterocanon/sirach/016/027.yaml
  text: He ordered his works forever[a], and their beginnings for their generations; they neither hungered nor grew weary, and they did not cease from their works.
translation:
  language: pt
  text: Ele pôs em ordem, para sempre, as suas obras e os seus começos, para as suas gerações; elas não tiveram fome nem se cansaram e não deixaram de realizar as suas obras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκόσμησεν
  choice: pôs em ordem
  rationale: No contexto da criação, o verbo indica organizar ou dispor ordenadamente, não meramente adornar.
- source_word: εἰς αἰῶνα
  choice: para sempre
  rationale: Expressa a permanência duradoura da ordem estabelecida e é idiomático em português atual.
- source_word: τὰ ἔργα αὐτοῦ
  choice: as suas obras
  rationale: Mantém a amplitude do grego e, no contexto, designa as realidades criadas por Deus.
- source_word: τὰς ἀρχὰς αὐτῶν
  choice: os seus âmbitos de atuação
  rationale: O plural ἀρχαί pode designar começos, principados ou esferas de autoridade. No contexto da atividade regular da criação, a expressão comunica de modo natural as esferas ou funções atribuídas às obras, sem personificá-las como governantes.
- source_word: εἰς γενεὰς αὐτῶν
  choice: por todas as suas gerações
  rationale: Indica continuidade ao longo das gerações ou eras próprias das obras criadas.
- source_word: οὔτε ἐπείνασαν οὔτε ἐκοπίασαν
  choice: não sentiram fome nem se cansaram
  rationale: Reproduz o paralelismo negativo em linguagem portuguesa natural e conserva a personificação poética.
- source_word: οὐκ ἐξέλιπον ἀπὸ τῶν ἔργων αὐτῶν
  choice: não deixaram de cumprir as suas tarefas
  rationale: Comunica que as realidades criadas não falharam nem cessaram no desempenho da atividade que lhes foi atribuída; 'tarefas' evita a repetição ambígua de 'obras'.
theological_decisions:
- issue: Sentido de τὰς ἀρχὰς αὐτῶν na ordem criada
  choice: Âmbitos de atuação atribuídos às obras da criação
  alternative: Seus começos ou suas origens ao longo das gerações
  rationale: A sequência descreve as obras cumprindo continuamente sua atividade, sem fome, cansaço ou interrupção. O sentido funcional se ajusta melhor ao contexto, mas a nota conserva a alternativa lexical genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção fluida para leitores brasileiros. Conserva a personificação das obras criadas e sinaliza em nota a ambiguidade de ἀρχαί.
