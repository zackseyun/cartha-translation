base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/003.yaml
  text: Do not trust in their life[a], and do not rely on their future; for one who does what is pleasing is better than a thousand[c][b], and to die childless than to have many children in unrighteousness and a lawless end.
translation:
  language: pt
  text: Não confie na vida deles[a] nem no futuro deles, pois não terão um bom fim. Pois uma só pessoa que faz o que é aceitável[b] é melhor do que mil; e é melhor morrer sem filhos do que ter muitos filhos na injustiça e um fim presunçoso[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz, na segunda advertência, “não se fixe no lugar deles” ou “não confie na posição deles”, onde o hebraico traz “no futuro deles”; além disso, o grego não contém a frase seguinte sobre o bom fim.
    reason: textual_variant
  - marker: b
    text: 'Ou: “que faz a vontade”. O contexto provavelmente sugere aquilo que agrada a Deus, mas “a Deus” não está expresso no hebraico.'
    reason: lexical_alternative
  - marker: c
    text: O final hebraico é condensado e difícil. “Fim presunçoso” também pode ser entendido como fim marcado por maldade arrogante; a expressão pode estar em paralelo com os muitos filhos caracterizados pela injustiça.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּאֲמִין בְּחַיֵּיהֶם
  choice: Não confie na vida deles
  rationale: O hifil de אמן com preposição exprime depositar confiança. A formulação mantém o hebraico, embora a expressão possa apontar para a aparente vitalidade ou prosperidade desses descendentes.
- source_word: וְאַל תִּבְטַח בְּעִקְבוֹתָם
  choice: nem deposite esperança no futuro deles
  rationale: בטח indica confiança ou segurança, enquanto עקבותם, literalmente ligado ao que vem atrás, pode designar o que se segue, o futuro ou o desfecho. O contexto imediato favorece o sentido prospectivo.
- source_word: כִּי לֹא תִהְיֶה לָהֶם אַחֲרִית טוֹבָה
  choice: pois não terão um bom fim
  rationale: A oração está presente no testemunho hebraico fornecido e deve ser preservada. אחרית designa fim, futuro ou desfecho; 'bom fim' reproduz de modo natural o contraste.
- source_word: כִּי טוֹב אֶחָד עוֹשֶׂה רָצוֹן מֵאָלֶף
  choice: Porque uma só pessoa que faz o que é agradável é melhor do que mil
  rationale: A construção é elíptica, mas o grego confirma a comparação entre um e mil. רצון pode significar vontade, favor ou aquilo que agrada; não se acrescenta um objeto divino que o hebraico deixa implícito.
- source_word: וּמוֹת עֲרִירִי
  choice: e é melhor morrer sem filhos
  rationale: ערירי significa estar sem descendência. A repetição de 'é melhor' torna explícita em português a comparação elíptica do hebraico.
- source_word: בָּנִים רַבִּים בְּעַוְלָה
  choice: muitos filhos na injustiça
  rationale: עולה abrange injustiça, perversidade e conduta errada. 'Na injustiça' conserva a forma nominal e a caracterização moral.
- source_word: וּמֵאַחֲרִית זָדוֹן
  choice: e acabar na arrogância perversa
  rationale: A expressão final é comprimida e textualmente difícil. זדון reúne as ideias de arrogância, presunção e perversidade deliberada; a formulação portuguesa preserva essas nuances sem introduzir o conceito mais específico de transgressão da lei.
theological_decisions:
- issue: Objeto implícito de עוֹשֶׂה רָצוֹן
  choice: 'Manter o objeto implícito: ''faz o que é agradável''.'
  alternative: faz a vontade de Deus
  rationale: No contexto sapiencial, a referência a Deus é provável, mas não aparece expressamente na frase hebraica. A tradução evita tornar explícito o que o texto deixa implícito.
- issue: Comparação entre morrer sem filhos e ter muitos filhos injustos
  choice: Preservar integralmente a comparação incisiva.
  alternative: Suavizar a afirmação para dizer apenas que a justiça vale mais do que muitos descendentes.
  rationale: O texto prioriza de forma deliberadamente contundente a retidão sobre a numerosa descendência; essa tensão não deve ser amenizada.
- issue: Cláusula sobre o bom fim
  choice: Incluir 'pois não terão um bom fim'.
  alternative: Omitir a cláusula, como no paralelo grego e na camada inglesa apresentada.
  rationale: A cláusula consta claramente do testemunho hebraico primário fornecido. A tradução parte primeiro da evidência hebraica, enquanto a forma grega mais curta é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução segue prioritariamente o hebraico preservado, inclusive a cláusula ausente no grego, e usa notas para variantes relevantes e ambiguidades reais.
