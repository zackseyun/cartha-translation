revisions:
- from: Não confie na vida deles[a] nem deposite esperança no futuro deles; pois não terão um bom fim. Porque uma só pessoa que faz o que é agradável[b] é melhor do que mil; e é melhor morrer sem filhos do que ter muitos filhos na injustiça e acabar na arrogância perversa[c].
  to: Não confie na vida deles[a] nem no futuro deles, pois não terão um bom fim. Pois uma só pessoa que faz o que é aceitável[b] é melhor do que mil; e é melhor morrer sem filhos do que ter muitos filhos na injustiça e um fim presunçoso[c].
  rationale: A revisão corrige a descrição da variante grega, conserva a cláusula explicitamente atestada no hebraico e restaura, no encerramento, uma expressão nominal que retém a ambiguidade sintática e semântica do texto hebraico. As alterações de estilo mantêm um português moderno e amplamente compreensível.
