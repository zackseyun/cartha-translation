  verdict: revise
  source_fidelity: A tradução preserva a cláusula hebraica omitida no grego (“pois não terão um bom fim”), o que é correto. Contudo, a nota a descreve incorretamente a variante grega como se ela divergisse também em “vida”; o grego também traz “vida”, divergindo na segunda advertência. Além disso, “acabar na arrogância perversa” transforma a expressão nominal e elíptica final em uma ação verbal e estreita indevidamente sua sintaxe.
  naturalness: O registro é geralmente claro e adequado. “Não confie no futuro deles” é mais idiomático e direto que “não deposite esperança no futuro deles” neste paralelismo. A formulação final revista conserva melhor a concisão proverbial.
  terminology: “O que é agradável” pode ser entendido como mero gosto pessoal; “o que é aceitável” comunica melhor o valor ético implícito de עֹשֶׂה רָצוֹן sem explicitar “a Deus”. “Fim presunçoso” mantém a nominalidade e a ambiguidade de אַחֲרִית זָדוֹן, cujo segundo termo pode ter a nuance de presunção arrogante ou maldade deliberada.
