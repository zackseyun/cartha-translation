base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/015.yaml
  text: Yahweh hardened Pharaoh’s heart[a], though he did not know him, for his deeds are revealed under heaven.
translation:
  language: pt
  text: O SENHOR endureceu o coração do faraó[a], que não o conhecia, pois seus atos são revelados debaixo do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego traz: “Não diga: ‘Eu me esconderei do Senhor.’” O testemunho grego difere substancialmente da linha hebraica preservada, o que pode indicar uma forma textual divergente ou outro alinhamento dos versículos.'
    reason: textual_variant
lexical_decisions:
- source_word: יְהֹוָה
  choice: O SENHOR
  rationale: Representa o nome divino YHWH segundo a tradição bíblica portuguesa, com maiúsculas para distingui-lo do título comum, sem introduzir uma vocalização discutida.
- source_word: הִקְשָׁה
  choice: endureceu
  rationale: O hifil de קשה indica tornar duro ou obstinado. “Endureceu” preserva a ligação verbal e temática com o relato do faraó em Êxodo.
- source_word: לֵב פַּרְעֹה
  choice: o coração do faraó
  rationale: Mantém a imagem hebraica do coração como centro da vontade e do entendimento, bem como a ressonância com Êxodo.
- source_word: אֲשֶׁר לֹא יְדָעוֹ
  choice: embora ele não o conhecesse
  rationale: Entende o sujeito implícito como o faraó e o objeto pronominal como o SENHOR. “Embora” expressa de modo natural o provável valor concessivo, sem apagar por completo a concisão da construção hebraica.
- source_word: שֶׁמַעֲשָׂיו
  choice: pois os seus atos
  rationale: Toma שׁ como introdutor de uma explicação causal. “Seus” preserva em português a possível ambiguidade do referente do sufixo masculino hebraico.
- source_word: מְגֻלִּין
  choice: estão expostos
  rationale: O particípio passivo comunica que os atos estão descobertos, manifestos e não ocultos; “expostos” é claro e natural no contexto.
- source_word: תַּחַת הַשָּׁמַיִם
  choice: debaixo do céu
  rationale: Reproduz de forma corrente e digna o idioma bíblico que abrange o domínio terreno.
theological_decisions:
- issue: Relação entre o testemunho hebraico e o paralelo grego
  choice: Traduzir no texto principal a linha hebraica preservada e registrar em nota a leitura grega substancialmente diferente.
  alternative: 'Adotar no texto principal a leitura grega: “Não diga: ‘Eu me esconderei do Senhor.’”'
  rationale: O hebraico existente é a fonte primária para esta tradução de Sirácida. Como o grego não corresponde verbalmente à linha hebraica e pode refletir outra forma textual ou outro alinhamento dos versículos, sua leitura deve permanecer visível em nota, sem substituir silenciosamente o hebraico.
- issue: Referentes dos pronomes masculinos
  choice: Entender que o faraó não conhecia o SENHOR, mas conservar a ambiguidade de “seus atos”.
  alternative: Explicitar “os atos do faraó” ou “os atos do SENHOR”.
  rationale: Na primeira oração, a alusão a Êxodo favorece claramente o faraó como sujeito e o SENHOR como objeto. Já o sufixo de “atos” admite mais de um referente gramatical; a formulação portuguesa preserva essa tensão em vez de resolvê-la doutrinariamente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. Conservam-se o idioma bíblico “coração” e a expressão “debaixo do céu”; evita-se linguagem excessivamente arcaica.
