revisions:
- from: 'Não diga[a]: “Estou escondido de Deus; quem, lá do alto, se lembrará de mim? No meio de um povo numeroso, não serei reconhecido; e o que é a minha vida entre os confins dos ventos, entre todos os filhos de Adão?”'
  to: 'Não diga: “Estou escondido de Deus; quem, lá do alto, se lembrará de mim? Em meio a um povo numeroso, não serei conhecido; e o que é a minha vida entre todos os filhos dos homens, como os confins dos ventos?[a]”'
  rationale: A revisão corrige a leitura indevida de אָדָם como o nome próprio Adão, troca «reconhecido» pelo passivo mais literal «conhecido» e reposiciona a comparação hebraica no último membro. A formulação final preserva deliberadamente a concisão e a dificuldade da imagem hebraica; a nota registra a leitura mais fluida, mas textualmente distinta, do grego. O marcador foi movido para a expressão a que a nota se refere.
