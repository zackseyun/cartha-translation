base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/017.yaml
  text: Do not say[a], “I am hidden from God, and from on high who will remember me? In a great people I will not be known; and what is my life among the ends of the winds, all the sons of man?”
translation:
  language: pt
  text: 'Não diga: “Estou escondido de Deus; quem, lá do alto, se lembrará de mim? Em meio a um povo numeroso, não serei conhecido; e o que é a minha vida entre todos os filhos dos homens, como os confins dos ventos?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “na criação imensurável” em vez da difícil expressão hebraica “como os confins dos ventos”, talvez refletindo um texto hebraico diferente ou uma interpretação dela.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Não diga
  rationale: Reproduz de modo direto e natural a proibição hebraica.
- source_word: מֵאֵל נִסְתַּרְתִּי
  choice: Estou escondido de Deus
  rationale: Preserva a afirmação equivocada do falante e o sentido de estar oculto à vista de Deus.
- source_word: וּבַמָּרוֹם מִי יִזְכְּרֵנִי
  choice: quem, lá do alto, se lembrará de mim?
  rationale: Mantém a imagem espacial elevada de מָרוֹם e o sentido básico de recordar.
- source_word: בְּעַם כָּבֵד
  choice: No meio de um povo numeroso
  rationale: כָּבֵד sugere aqui grande peso numérico ou multidão; 'numeroso' é claro em português e concorda com o paralelo grego.
- source_word: לֹא אִוָּדֵעַ
  choice: não serei reconhecido
  rationale: Expressa o nifal de ידע sem transformar silenciosamente o sentido em simples invisibilidade.
- source_word: וּמַה נַפְשִׁי
  choice: e o que é a minha vida
  rationale: נֶפֶשׁ pode designar vida, pessoa ou alma; 'minha vida' comunica naturalmente a alegada insignificância do falante.
- source_word: כְּקַצּוֹת רוּחוֹת
  choice: entre os confins dos ventos
  rationale: Conserva a difícil e concreta imagem cósmica do hebraico, sem substituí-la pela leitura interpretativa grega.
- source_word: כּלָ בּנֵי אָדָם
  choice: entre todos os filhos de Adão
  rationale: Mantém o idioma coletivo hebraico e identifica אָדָם como Adão/humanidade; a repetição de 'entre' torna a relação sintática compreensível sem apagar sua dificuldade.
theological_decisions:
- issue: Imagem final do hebraico em contraste com a formulação grega
  choice: Manter “entre os confins dos ventos” no texto principal
  alternative: “na criação imensurável”
  rationale: Como o hebraico está preservado e constitui a testemunha primária, sua imagem difícil deve permanecer. A leitura grega é registrada em nota para preservar a variante sem resolver indevidamente a tensão textual.
- issue: Sentido de נַפְשִׁי
  choice: “minha vida”
  alternative: “minha alma”
  rationale: O contexto trata da suposta insignificância do indivíduo em meio à humanidade e ao cosmos; 'vida' é um sentido legítimo de נֶפֶשׁ e evita impor uma antropologia técnica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Conserva-se a imagem incomum do hebraico; pequenas explicitações sintáticas evitam que o último membro pareça desconexo.
