  yaml_path: translation/deuterocanon/sirach/016/019.yaml
  text: Even the peaks of the mountains and the foundations of the world—when he looks at them[a], they quake.
translation:
  language: pt
  text: Até os cumes dos montes e os alicerces do mundo[a], quando ele olha para eles, estremecem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebraico: “os alicerces do mundo”; o texto grego paralelo traz “os alicerces da terra”.'
    reason: alternative_reading
lexical_decisions:
- source_word: קִצְבֵי הָרִים
  choice: os cumes dos montes
  rationale: קִצְבֵי designa as extremidades ou pontos culminantes; em associação com os montes, «cumes» comunica com naturalidade a imagem espacial do hebraico.
- source_word: וִיסוֹדֵי תֵבֵל
  choice: e os alicerces do mundo
  rationale: יְסוֹדֵי indica fundamentos ou alicerces, e תֵבֵל designa o mundo ordenado ou habitado. «Alicerces do mundo» preserva a imagem cósmica e segue o testemunho hebraico.
- source_word: בְּהַבִּיטוֹ אֲלֵיהֶם
  choice: quando ele olha para eles
  rationale: A construção com infinitivo e sufixo é expressa naturalmente como oração temporal. O pronome mantém implícita a identificação do sujeito, como no hebraico.
- source_word: רַעַשׁ יִרְעָשׁוּ
  choice: estremecem
  rationale: A combinação cognata intensifica a ideia de abalo. Em português, «estremecem» comunica de modo conciso o forte movimento sísmico, sem uma repetição artificial.
theological_decisions:
- issue: Sujeito divino implícito em בְּהַבִּיטוֹ
  choice: quando ele olha para eles
  alternative: quando Deus olha para eles
  rationale: O contexto identifica o referente como Deus, mas o hebraico não repete o nome divino. O pronome em minúscula preserva tanto a referência contextual quanto a forma implícita do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A colocação da nota após «mundo» identifica diretamente o termo ao qual a variante textual se refere.
