  text: Even if they become many[a], do not delight in them, if the fear of Yahweh is not with them.
translation:
  language: pt
  text: Mesmo que se multipliquem, não se alegre por causa deles[a], se o temor do SENHOR não estiver com eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não encontre satisfação neles”. O hebraico é um pouco incerto neste ponto; o paralelo grego apoia o sentido de alegrar-se ou ter satisfação por causa deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אִם / ἐὰν
  choice: Mesmo que
  rationale: Expressa naturalmente em português a condição concessiva indicada pelo hebraico no contexto e confirmada pelo paralelo grego.
- source_word: פָּרוּ / πληθύνωσιν
  choice: se multipliquem
  rationale: Conserva a ideia de frutificar ou aumentar em número, adequada ao contexto de descendência, sem acrescentar uma interpretação além do texto.
- source_word: אַל תָּבֻעַ בָּם / μὴ εὐφραίνου ἐπʼ αὐτοῖς
  choice: não se alegre com eles
  rationale: O hebraico é pouco transparente, mas o paralelo grego apoia claramente o sentido de alegrar-se ou ter satisfação por causa deles.
- source_word: אִם אֵין אִתָּם / εἰ μὴ ἔστιν ... μετʼ αὐτῶν
  choice: se ... não estiver com eles
  rationale: Preserva a imagem de presença ou acompanhamento comum ao hebraico e ao grego, em vez de reduzi-la à simples posse.
- source_word: יִרְאַת יְהֹוָה / φόβος Κυρίου
  choice: o temor do SENHOR
  rationale: Mantém a fórmula característica da literatura sapiencial e sua densidade teológica, sem a suavizar para mera reverência.
- source_word: יְהֹוָה
  choice: SENHOR
  rationale: Emprega a convenção bíblica portuguesa de representar o nome divino YHWH por SENHOR em versaletes.
theological_decisions:
- issue: Tradução da fórmula sapiencial יִרְאַת יְהֹוָה
  choice: o temor do SENHOR
  alternative: a reverência pelo SENHOR
  rationale: A formulação tradicional conserva tanto o sentido de reverência quanto a dimensão mais forte de temor presente no idioma bíblico, preservando a tensão teológica do original.
translation_notes:
  register: Português atual, digno e de leitura ampla. “Se multipliquem” preserva a concisão do original e se ajusta ao contexto de numerosos filhos; “estiver com eles” mantém a nuance relacional da construção hebraica.
