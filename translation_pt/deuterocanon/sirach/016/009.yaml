  text: And he did not spare a people devoted to destruction[a], those trampled down in their iniquity.
translation:
  language: pt
  text: E não poupou um povo destinado à destruição[a], os que foram pisados em sua iniquidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego diz: «uma nação de destruição, os que foram removidos em seus pecados». O hebraico parece empregar a imagem de pessoas pisadas ou esmagadas; o grego expressa um sentido de juízo próximo, mas com palavras diferentes.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא חָמַל
  choice: E não poupou
  rationale: חמל pode expressar compaixão ou o ato de poupar. Neste contexto de juízo, «não poupou» é natural, conciso e preserva a força verbal.
- source_word: גוֹי
  choice: um povo
  rationale: גוי pode designar povo ou nação. «Povo» evita associações com o Estado-nação moderno e se ajusta naturalmente ao contexto.
- source_word: חֶרֶם
  choice: destinado à destruição
  rationale: חרם designa aquilo que foi separado ou entregue à destruição. A formulação mantém a força judicial e sacral do termo sem recorrer à expressão menos transparente «sob anátema».
- source_word: הַנּדוֹשִׁים
  choice: os que foram pisados
  rationale: A forma hebraica é difícil, mas parece derivar de uma raiz ligada a pisar ou debulhar. «Foram pisados» conserva a imagem concreta de juízo; a leitura divergente do grego é registrada em nota.
- source_word: בַּעֲוֹנָם
  choice: por sua iniquidade
  rationale: עון abrange iniquidade e culpa. Embora ב possa significar literalmente «em», aqui «por» exprime com naturalidade a ligação entre a iniquidade do povo e o juízo, sem eliminar a tensão textual.
theological_decisions:
- issue: Como traduzir חרם no contexto de juízo
  choice: destinado à destruição
  alternative: sob anátema; condenado à destruição
  rationale: A escolha comunica que o povo foi entregue ao juízo destrutivo, preservando a gravidade do termo sem introduzir terminologia confessional posterior.
- issue: Como tratar o difícil הַנּדוֹשִׁים diante do paralelo grego
  choice: os que foram pisados por sua iniquidade
  alternative: os que foram removidos em seus pecados
  rationale: O texto principal segue prioritariamente a imagem do hebraico. Como o grego apresenta uma formulação diferente, mas semanticamente relacionada ao juízo pelo pecado, a variante é preservada em nota em vez de ser harmonizada silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A construção preserva a severidade do juízo e sinaliza em nota a incerteza textual.
