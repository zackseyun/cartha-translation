review_pass:
  verdict: revise
  source_fidelity: A primeira oração reproduz bem וְלֹא חָמַל e גוֹי חֶרֶם. A imagem de הַנּדוֹשִׁים é corretamente mantida como pessoas pisadas. Contudo, «por sua iniquidade» resolve o בְּ hebraico como causa; tanto o hebraico quanto o paralelo grego preservam a formulação «em seus pecados/iniquidade».
  naturalness: O texto é claro, digno e natural em português moderno. «Os que foram pisados» funciona como aposição explicativa de «um povo».
  terminology: «Destinado à destruição» comunica adequadamente o sentido judicial de חֶרֶם, embora não expresse por si toda a nuance cultual de algo votado/consagrado ao extermínio. No contexto, é uma solução acessível e não exige alteração. «Iniquidade» é apropriado para עָוֹן.
  issues:
  - severity: low
    issue: A preposição «por» torna causal a relação com a iniquidade.
    rationale: בַּעֲוֹנָם significa mais diretamente «em sua iniquidade», e o grego ἐν ἁμαρτίαις αὐτῶν confirma essa formulação. «Por» é uma interpretação possível do contexto de juízo, mas reduz uma ambiguidade que a tradução deve preservar.
  revised_text: E não poupou um povo destinado à destruição[a], os que foram pisados em sua iniquidade.
