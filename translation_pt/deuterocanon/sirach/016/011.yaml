  source_fidelity: A construção hebraica/greco-paralela descreve uma pessoa como “de cerviz dura” (obstinada), não primariamente o ato de endurecer a própria cerviz. A revisão preserva essa metáfora e mantém o assombro diante de ela ficar sem punição. O contraste entre misericórdia, ira, perdão e a ira que repousa sobre os perversos é mantido sem harmonização doutrinária.
  naturalness: “Ser de cerviz dura” é uma expressão bíblica estabelecida e suficientemente inteligível no registro digno proposto. “É espantoso que fique impune” é mais direto e natural do que a sequência condicional “seria espantoso que ela ficasse impune”, além de refletir melhor a formulação exclamativa do original.
  terminology: “Misericórdia”, “ira”, “perdoa” e “perversos” são adequados. “Indignação” na última cláusula preserva a variação portuguesa sem apagar a relação semântica com a ira; a nota explica a imagem verbal hebraica.
