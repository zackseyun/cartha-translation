base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/011.yaml
  text: Even if one person is stiff-necked[a], it is astonishing if he will be cleared; for mercy and anger are with him, and he bears and forgives[b], but upon the wicked he lets his wrath rest.
translation:
  language: pt
  text: Mesmo que uma única pessoa seja de cerviz dura, é espantoso que fique impune.[a] Pois com ele estão a misericórdia e a ira; ele suporta e perdoa, mas faz sua indignação repousar sobre os perversos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seja absolvida” ou “escape da punição”. Tanto o hebraico יִנָּקֶה como o grego ἀθῳωθήσεται podem ter sentido forense: ser declarado livre de culpa ou de pena.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, o hebraico diz que ele “faz sua indignação repousar sobre os perversos”, retratando-a como algo que se assenta sobre eles, e não apenas como uma ira que irrompe.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְשֶׁה עֹרֶף / σκληροτράχηλος
  choice: que endureça a cerviz
  rationale: Preserva a metáfora hebraica e grega de resistência obstinada sem reduzi-la simplesmente a “teimosa”; “cerviz” mantém o tom bíblico e é inteligível em português.
- source_word: תֵּמַהּ זֶה / θαυμαστὸν τοῦτο
  choice: seria espantoso
  rationale: Conserva a força retórica de assombro diante da possibilidade mencionada, em linguagem portuguesa natural.
- source_word: יִנָּקֶה / ἀθῳωθήσεται
  choice: ficasse impune
  rationale: Expressa de modo claro o sentido forense de escapar da culpa ou da pena. A nota registra a alternativa mais estritamente jurídica, “fosse absolvida”.
- source_word: רַחֲמִים
  choice: misericórdia
  rationale: Comunica a misericórdia compassiva e forma o contraste explícito com a ira.
- source_word: אַף
  choice: ira
  rationale: Neste contexto, o termo é o substantivo que designa ira, e não a conjunção “também”; o paralelismo com רָגְזוֹ confirma a leitura.
- source_word: וְנוֹשֵׂא
  choice: ele suporta
  rationale: Mantém a expressão hebraica compacta de levar ou suportar e, no contexto moral, sugere suportar a ofensa sem definir excessivamente o objeto implícito.
- source_word: וְסוֹלֵחַ
  choice: perdoa
  rationale: É a forma direta e corrente de exprimir o perdão divino indicado pelo verbo.
- source_word: יַנִּיחַ רָגְזוֹ
  choice: faz sua indignação repousar
  rationale: Preserva a imagem hebraica da indignação que é feita repousar sobre os perversos, em vez de transformá-la apenas numa explosão momentânea.
theological_decisions:
- issue: O caráter divino expresso por misericórdia e ira
  choice: Manter lado a lado a misericórdia e a ira, seguidas tanto pelo perdão como pela indignação que repousa sobre os perversos.
  alternative: Suavizar a passagem para destacar apenas a misericórdia ou tratar a ira como mero desagrado passageiro.
  rationale: O hebraico contrapõe explicitamente misericórdia e ira e, em seguida, perdão e juízo. A tradução preserva essa tensão teológica sem resolvê-la.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Conserva-se “cerviz” para reter a metáfora bíblica do original; a construção circundante esclarece seu sentido. O pronome “ele” preserva a referência masculina do texto e a continuidade contextual, sem inserir um título divino ausente nesta linha.
