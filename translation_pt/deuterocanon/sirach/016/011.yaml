revisions:
- from: Mesmo que haja uma só pessoa que endureça a cerviz, seria espantoso que ela ficasse impune.[a] Pois com ele estão a misericórdia e a ira; ele suporta e perdoa, mas faz sua indignação repousar sobre os perversos.[b]
  to: Mesmo que uma única pessoa seja de cerviz dura, é espantoso que fique impune.[a] Pois com ele estão a misericórdia e a ira; ele suporta e perdoa, mas faz sua indignação repousar sobre os perversos.[b]
  rationale: A revisão corrige a representação de “cerviz dura” como qualidade da pessoa, em vez de ação, e restaura o caráter presente e enfático do assombro expresso pelo hebraico e pelo grego. As demais escolhas preservam com fidelidade o paralelismo e a tensão do texto.
