  text: And he did not spare Lot’s neighbors[b][a], who became arrogant in their pride.
translation:
  language: pt
  text: E não poupou os moradores do lugar onde Ló vivia,[a] que se tornaram insolentes em seu orgulho.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os vizinhos de Ló” ou “a comunidade entre a qual Ló residia”. A expressão hebraica é incomum; o grego traz “a comunidade da residência temporária de Ló”.'
    reason: lexical_alternative
  - marker: b
    text: 'A forma hebraica é difícil. Outra possibilidade é: “que agiam com arrogância em seu orgulho”. O grego traz: “aos quais detestou por causa do orgulho deles”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא חָמַל
  choice: E não poupou
  rationale: חמל pode indicar ter compaixão ou poupar. No contexto de juízo, “não poupou” é conciso e natural, além de concordar com o paralelo grego οὐκ ἐφείσατο.
- source_word: מְגוּרֵי לוֹט
  choice: os moradores do lugar onde Ló vivia
  rationale: A expressão incomum deriva de גור e associa uma comunidade ou lugar à residência temporária de Ló. A formulação evita o pouco natural “peregrinos de Ló” e não explicita “sodomitas”, identificação contextual que o hebraico não formula diretamente.
- source_word: הַמִּתְעַבְּרִים
  choice: que se tornaram insolentes
  rationale: A forma hebraica é difícil. No contexto de גאוה, a tradução expressa um movimento para uma atitude arrogante ou insolente, sem adotar no texto principal a leitura distinta do paralelo grego.
- source_word: בְּגַאֲוָתָם
  choice: em seu orgulho
  rationale: Mantém a construção hebraica com ב e o sentido de גאוה como orgulho ou arrogância. “Orgulho” também conserva a possível nuance circunstancial, enquanto a nota registra a leitura causal do grego.
theological_decisions:
- issue: Identidade dos associados à morada de Ló
  choice: Referência indireta aos moradores do lugar onde Ló vivia
  alternative: A casa de Ló; a região da permanência de Ló; os sodomitas
  rationale: O contexto aponta para a comunidade de Sodoma, mas o hebraico a designa por sua relação com a residência de Ló. A tradução conserva essa referência indireta e não introduz no corpo do texto um nome ausente da expressão hebraica.
- issue: Relação entre insolência, repulsa e orgulho
  choice: O hebraico é traduzido como pessoas que se tornaram insolentes em seu orgulho
  alternative: Pessoas que se tornaram detestáveis por causa de seu orgulho
  rationale: A forma hebraica admite dificuldade interpretativa, ao passo que o grego apresenta explicitamente a ideia de serem abominados por causa do orgulho. A opção principal segue o hebraico, e a variante grega fica registrada em nota para preservar a tensão textual.
translation_notes:
  register: Português atual, digno e acessível, com leitura natural no Brasil e compreensão internacional. A repetição semântica entre “insolentes” e “orgulho” foi mantida para refletir a formulação hebraica, enquanto as incertezas lexicais e o testemunho grego foram preservados em notas.
