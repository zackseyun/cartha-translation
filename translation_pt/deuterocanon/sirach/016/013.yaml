base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/013.yaml
  text: An unjust one will not escape with plunder[a], and the desire of the righteous will never fail.
translation:
  language: pt
  text: O injusto não escapará com o que roubou, e o desejo do justo jamais será frustrado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “e a perseverança do piedoso certamente não será retardada”. O hebraico diz: “o desejo do justo jamais será frustrado”.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִמָּלֵט
  choice: não escapará
  rationale: O nifal de מלט expressa escapar ou ser livrado; aqui, “não escapará” é natural e corresponde também ao grego ἐκφεύξεται.
- source_word: בְּגָזֵל
  choice: com o que roubou
  rationale: גזל denota roubo ou despojo, e a preposição ב pode indicar meio ou circunstância concomitante. A formulação portuguesa comunica com clareza que os bens roubados não garantirão a fuga.
- source_word: עַוָּל
  choice: o injusto
  rationale: O termo descreve quem age injusta ou perversamente. “O injusto” preserva a nuance hebraica e forma o contraste ético direto com “o justo” no segundo membro.
- source_word: וְלֹא יַשְׁבִּית
  choice: jamais será frustrado
  rationale: O hifil de שבת significa fazer cessar. Com “desejo” como objeto, a formulação passiva idiomática indica que esse desejo não será impedido nem ficará sem realização, sem confundi-la com a leitura grega.
- source_word: תַּאֲוַת צַדִּיק
  choice: o desejo do justo
  rationale: תאוה significa desejo ou anseio, e צדיק é singular. “O desejo do justo” mantém de perto tanto o léxico quanto o número genérico do hebraico.
- source_word: לְעוֹלָם
  choice: jamais
  rationale: Sob o alcance da negação, לְעוֹלָם tem sentido idiomático de “nunca/jamais”; “jamais” convém ao registro sapiencial digno.
theological_decisions:
- issue: Designação moral עַוָּל em comparação com o grego ἁμαρτωλός
  choice: o injusto
  alternative: o pecador
  rationale: A tradução principal segue a nuance mais específica do hebraico, enquanto o grego apresenta a categoria mais ampla de “pecador”. Isso preserva a primazia do testemunho hebraico sem negar a afinidade moral entre as leituras.
- issue: Sentido do segundo membro
  choice: o desejo do justo jamais será frustrado
  alternative: a perseverança do piedoso certamente não será retardada
  rationale: O hebraico fala do desejo do justo e de fazê-lo cessar; o grego diverge de modo significativo ao falar da perseverança do piedoso e de demora. A leitura hebraica fica no texto, e a grega é registrada em nota para preservar a variante.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A estrutura paralela e o contraste entre “o injusto” e “o justo” foram preservados.
