  text: Listen to me and receive understanding[b][a], and pay attention in your heart to my words.
translation:
  language: pt
  text: Ouçam-me e recebam entendimento[a]; ponham o coração nas minhas palavras.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Escuta-me, filho, e aprende o conhecimento”; o testemunho hebraico não contém “filho” e diz “recebam entendimento”.'
    reason: alternative_reading
  - marker: b
    text: 'Hebraico, literalmente: “ponham o coração nas minhas palavras”; isto é, dediquem-lhes plena atenção. Compare o grego: “presta atenção às minhas palavras com o teu coração”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Ouçam-me
  rationale: O imperativo plural de שמע pede escuta atenta, não mera percepção auditiva. “Ouçam-me” é direto, natural e conserva o número do hebraico.
- source_word: וּקְחוּ שִׂכְלִי
  choice: e recebam entendimento
  rationale: לקח significa literalmente “tomar”, mas, neste contexto de instrução, “receber” expressa melhor a acolhida do ensino. שׂכל designa entendimento ou discernimento; o paralelo grego, “aprende conhecimento”, confirma o sentido cognitivo.
- source_word: וְעַל דְבָרַי שִׂימוּ לֵב
  choice: ponham o coração nas minhas palavras
  rationale: A formulação conserva a imagem hebraica de “pôr o coração” e a referência explícita às palavras do mestre. Em português, comunica dedicação interior e atenção refletida sem eliminar a linguagem antropológica do original.
theological_decisions:
- issue: Identificação do destinatário
  choice: Não acrescentar “filho” ou “criança” ao texto principal
  alternative: “Escuta-me, filho, e aprende o conhecimento”
  rationale: O testemunho hebraico principal não contém uma forma de tratamento filial, embora o grego traga τέκνον. O texto principal segue o hebraico existente, e a variante grega é preservada em nota.
- issue: Linguagem antropológica do coração
  choice: Conservar explicitamente “coração”
  alternative: “prestem muita atenção às minhas palavras”
  rationale: Tanto o hebraico quanto o grego mencionam o coração. Mantê-lo preserva a concepção bíblica do coração como centro da atenção e da reflexão, sem reduzi-la a uma expressão puramente moderna.
translation_notes:
  register: Português moderno, claro e digno, com formas plurais de acordo com o hebraico. A construção “ponham o coração” preserva deliberadamente a imagem original, enquanto a nota esclarece seu sentido idiomático.
