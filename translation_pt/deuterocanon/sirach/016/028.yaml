  text: Each one did not oppress his neighbor[a], and they will never disobey his word.
translation:
  language: pt
  text: Nenhum deles oprimiu o seu próximo, e jamais desobedecerão à sua palavra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e jamais serão desobedientes à sua palavra”.'
    reason: Alternativa lexical que representa ἀπειθήσουσι por uma expressão mais estativa, em vez do verbo ativo “desobedecerão”.
lexical_decisions:
- source_word: ἕκαστος
  choice: Nenhum deles
  rationale: Em combinação com οὐκ ἔθλιψεν, expressa em português natural que isso não ocorreu com nenhum indivíduo do conjunto, preservando a força distributiva sem a ambiguidade pouco idiomática de “cada um não”.
- source_word: τὸν πλησίον αὐτοῦ
  choice: o seu próximo
  rationale: Mantém a referência àquele que está perto ou ao lado de cada um e preserva a formulação relacional do grego sem convertê-la explicitamente em reciprocidade.
- source_word: οὐκ ἔθλιψεν
  choice: oprimiu
  rationale: No vínculo entre um indivíduo e o seu próximo, θλίβω indica exercer pressão danosa, afligir ou oprimir; “oprimiu” comunica com clareza essa ação interpessoal.
- source_word: ἕως αἰῶνος
  choice: jamais
  rationale: Na construção negativa, o idiomatismo de duração permanente é expresso naturalmente por “jamais”, sem enfraquecer a ideia de permanência.
- source_word: οὐκ ἀπειθήσουσι
  choice: desobedecerão
  rationale: Preserva o futuro plural e o sentido direto de recusar obediência; a negação é expressa conjuntamente por “jamais”.
- source_word: τοῦ ῥήματος αὐτοῦ
  choice: à sua palavra
  rationale: “Palavra” conserva a amplitude semântica de ῥῆμα, que pode designar palavra, declaração ou ordem, sem estreitá-lo para “mandamento”.
theological_decisions:
- issue: Referente de αὐτοῦ em “sua palavra”
  choice: Manter o pronome “sua”, com Deus como referente implícito mais provável no contexto
  alternative: Explicitar “à palavra de Deus” ou entender o possessivo como referência a outro regente singular no contexto
  rationale: O contexto da criação ordenada favorece Deus como referente, mas o grego usa apenas o pronome; mantê-lo evita tornar explícito o que permanece implícito no texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Nenhum deles” traduz de modo idiomático a combinação distributiva ἕκαστος ... οὐκ, enquanto “seu próximo” e “sua palavra” preservam a formulação e a abertura referencial do grego.
