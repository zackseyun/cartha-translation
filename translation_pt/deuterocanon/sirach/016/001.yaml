  text: Do not desire the appearance of worthless youths[a], and do not rejoice in sons of unrighteousness.
translation:
  language: pt
  text: Não deseje a aparência dos jovens sem valor[a] e não se alegre com filhos da injustiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Não deseje uma multidão de filhos inúteis e não se alegre com filhos ímpios.” O testemunho hebraico fala, em vez disso, da aparência exterior de jovens sem valor.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּתְאַוֶּה
  choice: Não deseje
  rationale: O imperfeito hitpael com אַל expressa uma proibição; “não deseje” preserva o sentido volitivo sem intensificá-lo.
- source_word: תֹּאַר
  choice: a beleza
  rationale: תֹּאַר denota forma ou aparência exterior e pode referir-se à atratividade. “Beleza” é natural em português e mantém o foco no aspecto exterior.
- source_word: נַעֲרֵי שָׁוְא
  choice: jovens sem valor
  rationale: נַעֲרֵי significa jovens ou rapazes, e שָׁוְא comunica vacuidade, inutilidade ou falta de valor. A expressão evita sugerir que pessoas tenham valor intrínseco nulo, enquanto transmite a avaliação moral-prática do contexto.
- source_word: וְאַל תִּשְׂמַח
  choice: e não se alegre
  rationale: Reproduz de modo direto a segunda proibição e seu componente emocional.
- source_word: בִּבְנֵי עַוְלָה
  choice: com filhos da injustiça
  rationale: Mantém o hebraísmo “filhos de” e traduz עַוְלָה de perto como “injustiça”, sem substituir a expressão pela interpretação mais geral “filhos perversos”.
- source_word: Μὴ ἐπιθύμει τέκνων πλῆθος ἀχρήστων
  choice: não adotado no texto principal
  rationale: O paralelo grego fala de uma multidão de filhos inúteis, mas o hebraico preservado, adotado como testemunho principal, fala da beleza ou aparência de jovens sem valor. A variante grega é registrada em nota.
theological_decisions:
- issue: Escolha do texto-base quando o hebraico e o grego divergem
  choice: Seguir no texto principal o hebraico preservado e registrar a forma grega em nota
  alternative: 'Seguir o grego: “Não deseje uma multidão de filhos inúteis e não se alegre com filhos ímpios.”'
  rationale: Como o hebraico de Ben Sira está preservado neste ponto, ele rege a tradução. A divergência substancial do grego é mantida de forma transparente na nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A construção sapiencial paralela foi preservada; “beleza” comunica naturalmente o foco hebraico na aparência exterior.
