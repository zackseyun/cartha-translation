  text: In the assembly of the wicked[a], fire burns; and among a godless nation, wrath is kindled.
translation:
  language: pt
  text: Na comunidade dos perversos, arde o fogo; e, no meio de uma nação ímpia[a], inflamou-se a ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “numa nação desobediente, inflamou-se a ira”. O hebraico diz “nação ímpia”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲדַת
  choice: Na comunidade de
  rationale: עֵדָה designa uma comunidade reunida ou assembleia. A preposição ב é entendida em sentido locativo; “comunidade” soa natural em português e preserva a dimensão coletiva.
- source_word: רְשָׁעִים
  choice: os perversos
  rationale: רְשָׁעִים descreve pessoas moralmente más ou culpadas. “Perversos” expressa com clareza essa categoria moral, sem seguir o grego ἁμαρτωλῶν, “pecadores”, contra o testemunho hebraico primário.
- source_word: יוֹקֶדֶת אֵשׁ
  choice: arde o fogo
  rationale: A forma de יקד comunica fogo em atividade, queimando ou abrasando. “Arde o fogo” mantém a imagem de maneira concisa e digna.
- source_word: וּבְגוֹי
  choice: e, no meio de uma nação
  rationale: גּוֹי pode indicar povo ou nação, e ב tem aqui valor locativo. “No meio de uma nação” explicita de modo idiomático que a ira se manifesta entre esse povo.
- source_word: חָנֵף
  choice: ímpia
  rationale: חָנֵף pode denotar impiedade, profanação ou ausência de reverência a Deus. “Ímpia” é exato, corrente e adequado ao paralelismo moral do verso.
- source_word: נִצְּתָה חֵמָה
  choice: inflamou-se a ira
  rationale: נִצְּתָה apresenta a ira como acesa ou inflamada, enquanto חֵמָה designa ira intensa. O pretérito reflete a forma hebraica e também encontra apoio no grego ἐξεκαύθη.
theological_decisions:
- issue: Se חָנֵף deve ser traduzido segundo o hebraico como “ímpia” ou aproximado do grego ἀπειθεῖ, “desobediente”
  choice: ímpia
  alternative: desobediente
  rationale: Como o texto hebraico está preservado e tem alta confiança, ele governa o texto principal. A leitura grega é semanticamente relacionada, mas distinta, e por isso é registrada em nota sem substituir o hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação sapiencial. “Comunidade” evita uma conotação institucional excessiva; “inflamou-se” preserva a metáfora do fogo e o aspecto verbal do hebraico. A nota foi colocada junto de “ímpia”, exatamente onde ocorre a diferença entre os testemunhos hebraico e grego.
