  text: As great as his mercies are[a], so also is his reproof[c][b]; he will judge a man according to his deeds.
translation:
  language: pt
  text: Tão grandes quanto são as suas misericórdias, tão grande é a sua repreensão; ele julgará cada pessoa segundo os seus atos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּרָב
  choice: Tão grandes como são ... assim também é
  rationale: Reproduz em português natural a construção proporcional כְּ... כֵּן, “tão... como/assim também”, preservando a correspondência entre a grandeza das misericórdias e a repreensão.
- source_word: רַחֲמָיו
  choice: as suas misericórdias
  rationale: Mantém o plural do texto hebraico, que pode exprimir compaixão abundante ou manifestações de misericórdia; o grego paralelo traz o singular.
- source_word: תּוֹכַחְתּוֹ
  choice: a sua repreensão
  rationale: O substantivo designa censura ou correção moral. “Repreensão” preserva esse valor corretivo, também apoiado pelo grego ἔλεγχος, sem intensificá-lo para “punição”.
- source_word: אִישׁ
  choice: cada pessoa
  rationale: Embora o hebraico use o singular masculino אִישׁ, ele tem força representativa neste enunciado geral. “Cada pessoa” comunica essa abrangência com naturalidade no português contemporâneo.
- source_word: כְּמִפְעָלָיו
  choice: segundo os seus atos
  rationale: מִפְעָלָיו refere-se ao que alguém faz, seus feitos ou obras. “Atos” é claro, corrente e conserva o peso moral da expressão.
- source_word: יִשְׁפֹּט
  choice: ele julgará
  rationale: O futuro exprime adequadamente o imperfeito hebraico neste enunciado teológico e concorda com o futuro grego κρινεῖ.
theological_decisions:
- issue: Relação entre a misericórdia divina, a repreensão e o julgamento
  choice: O versículo põe a grandeza das misericórdias e a repreensão em relação proporcional, seguida pelo julgamento de cada pessoa segundo seus atos.
  alternative: Entender תּוֹכַחְתּוֹ em sentido mais punitivo, como “seu castigo”.
  rationale: 'O hebraico תּוֹכַחַת e o grego ἔλεγχος favorecem “repreensão/correção”, não mera punição. A tradução conserva a tensão do texto: a misericórdia abundante não elimina a correção nem a responsabilidade moral.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo proporcional do hebraico e evita vocabulário excessivamente arcaico. “Cada pessoa” explicita de modo natural a força representativa de אִישׁ, sem necessidade de nota.
