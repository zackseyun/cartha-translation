    reason: lexical_alternative
lexical_decisions:
- source_word: אִם חָטָאתִי
  choice: Se pequei
  rationale: A partícula condicional אִם e o perfeito חָטָאתִי formam uma hipótese sobre um ato cometido. A formulação concisa preserva tanto a condição quanto o aspecto do hebraico.
- source_word: לֹא תִרְאֵנִי עָיִן
  choice: nenhum olho me vê
  rationale: Mantém a imagem concreta de עָיִן, “olho”, sem a reduzir a “ninguém”. O presente expressa naturalmente a alegação geral do falante de que seu pecado permanece sem testemunha.
- source_word: אוֹ אִם אֲכַזֵב
  choice: ou, se minto
  rationale: כזב pode indicar mentir, enganar ou mostrar-se falso. “Minto” é claro e natural no contexto de uma transgressão encoberta.
- source_word: בְּכָל סֵתֶר
  choice: em cada lugar oculto
  rationale: סֵתֶר designa um lugar oculto ou secreto. “Lugar oculto” preserva o sentido espacial e soa natural em português; “lugar secreto” é registrado em nota como alternativa.
- source_word: מִי יוֹדֵעַ
  choice: quem fica sabendo
  rationale: A pergunta hebraica é literalmente “quem sabe?”. “Quem fica sabendo” comunica com naturalidade a ideia contextual de que ninguém descobriria o ato oculto.
- source_word: καὶ καταιγίς, ἣν οὐκ ὄψεται ἄνθρωπος, τὰ δὲ πλεῖονα τῶν ἔργων αὐτοῦ ἐν ἀποκρύφοις
  choice: usado como confirmação do tema do ocultamento, não como texto-base
  rationale: O paralelo grego diverge substancialmente, mas confirma o campo semântico do que permanece oculto. Como o hebraico está preservado com alta confiança, ele rege o texto principal.
theological_decisions:
- issue: Prioridade textual numa passagem de Sirácida em que o hebraico e o grego divergem
  choice: Traduzir o hebraico preservado como texto principal e usar o grego apenas como confirmação semântica do tema do ocultamento
  alternative: Adotar uma versão baseada no grego, segundo a qual muitas das obras dele estão ocultas, ou harmonizar os dois testemunhos
  rationale: O testemunho hebraico desta passagem está preservado e tem alta confiança. Fundir sua frase com a leitura grega apagaria uma divergência textual genuína e produziria um texto sem atestação direta.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. Conserva-se a imagem hebraica de “olho” e a formulação retórica do pensamento de quem supõe que sua falta permanece desconhecida.
