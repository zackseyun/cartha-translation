translation:
  language: pt
  text: Se pequei, nenhum olho me vê; ou, se eu mentir, quem saberá disso em qualquer lugar oculto?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo grego difere substancialmente neste ponto e diz, em parte, que muitas das obras dele estão em lugares ocultos. Segue-se no texto principal o testemunho hebraico, preservado para este versículo.
    reason: textual_variant
