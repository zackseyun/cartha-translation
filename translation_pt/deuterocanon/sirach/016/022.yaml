base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/022.yaml
  text: Who will declare a work of righteousness[c][b][a], and who will wait for it? For the covenant is far off.
translation:
  language: pt
  text: Quem anunciará uma obra de justiça?[a][b] E quem esperará por ela? Pois a aliança está longe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico apresenta aqui um texto difícil, aproximadamente: “Que é uma obra de justiça — quem a contará? E esperança de quê...?”. O grego traz com mais clareza: “Quem anunciará obras de justiça? E quem esperará ou perseverará? Pois a aliança está longe”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “obras de justiça”, “uma ação justa” ou “uma obra de retidão”.'
    reason: lexical_alternative
  - marker: c
    text: O grego traz “a aliança”; o hebraico parece trazer “estatuto” ou “decreto” na frase final.
    reason: alternative_reading
lexical_decisions:
- source_word: מָה מַעֲשֶׂה צֶדֶק / ἔργα δικαιοσύνης
  choice: uma obra de justiça
  rationale: Conserva a ideia comum ao hebraico difícil e ao grego mais claro. “Justiça” é natural em português e mantém tanto a dimensão moral quanto a possível nuance de ato justo.
- source_word: מִי יַגִּידֶנּוּ / τίς ἀναγγελεῖ
  choice: Quem anunciará
  rationale: O hebraico e o grego admitem anunciar, declarar ou relatar. “Anunciará” preserva o tom elevado da pergunta retórica sem soar arcaico.
- source_word: וְתִקְוַת מָּה כִי אָצוּק חוֹק / ἢ τίς ὑπομενεῖ
  choice: E quem esperará por ela?
  rationale: O texto hebraico é instável, mas contém o campo semântico de esperança; o grego traz esperar, suportar ou perseverar. A formulação escolhida mantém a provável sobreposição entre expectativa e espera paciente.
- source_word: חוֹק / ἡ διαθήκη
  choice: a aliança
  rationale: Embora o hebraico pareça trazer “estatuto” ou “decreto”, o grego lê “aliança” e oferece a sequência mais coerente. A divergência é explicitada em nota.
- source_word: מָּה / μακρὰν
  choice: está longe
  rationale: Segue o grego μακράν, que indica distância e explica a necessidade de esperar. Essa frase não é claramente recuperável do hebraico transmitido.
theological_decisions:
- issue: Prioridade entre o hebraico difícil e o paralelo grego mais coerente
  choice: Seguir no texto principal o sentido mais claro do grego nos pontos em que o hebraico parece corrompido, registrando as diferenças em notas.
  alternative: 'Traduzir estritamente o hebraico: “Que é uma obra de justiça — quem a contará? E esperança de quê...? Pois está estabelecido um decreto.”'
  rationale: O hebraico sobrevivente normalmente merece prioridade, mas neste versículo sua segunda metade é sintática e semanticamente instável. O grego preserva uma declaração coerente, enquanto as notas mantêm transparente a evidência hebraica e evitam apresentar como certa uma reconstrução discutível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas foi ajustada para que cada marcador apareça junto ao trecho que esclarece; todas as variantes relevantes foram preservadas sem sobrecarregar o versículo.
