  text: So also six hundred thousand foot soldiers[b][a], gathered together in the arrogance of their heart.
translation:
  language: pt
  text: Assim também, seiscentos mil soldados de infantaria[a], reunidos na arrogância do coração deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “seiscentos mil soldados de infantaria” provavelmente alude à geração de Israel no deserto; compare Êxodo 12:37 e Números 11:21.
    reason: cross_reference
  - marker: b
    text: Ou “na insolência do coração deles” ou “na presunção do coração deles”. O texto grego paralelo traz “na dureza de coração deles”.
    reason: lexical_alternative_and_textual_variant
lexical_decisions:
- source_word: כֵּן
  choice: Assim também
  rationale: Introduz mais um exemplo paralelo aos juízos mencionados no contexto, preservando a força conectiva do hebraico.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף
  choice: seiscentos mil
  rationale: Reproduz diretamente o número cardinal do hebraico, por extenso, em estilo literário corrente.
- source_word: רַגְלִי
  choice: soldados a pé
  rationale: O termo designa combatentes que seguem a pé; o grego πεζῶν confirma o sentido militar. A expressão é clara e natural em português.
- source_word: הַנֶּאֱסָפִים
  choice: reunidos
  rationale: O particípio passivo de אסף descreve o grupo como ajuntado ou congregado; a forma concisa conserva essa relação com o substantivo anterior.
- source_word: בִּזְדוֹן
  choice: na arrogância
  rationale: זדון expressa orgulho insolente ou presunçoso. “Arrogância” comunica com clareza essa qualidade moral, enquanto alternativas são registradas em nota.
- source_word: לִבָּם
  choice: de seu coração
  rationale: Mantém o singular coletivo do hebraico, no qual um só “coração” é atribuído ao grupo como expressão de sua disposição comum.
theological_decisions:
- issue: Identificação dos seiscentos mil
  choice: Manter o referente implícito no texto principal
  alternative: Identificá-los explicitamente como a geração de Israel no deserto
  rationale: O número provavelmente alude à geração do êxodo, mas o versículo não nomeia o grupo. A tradução evita transformar uma alusão contextual em identificação explícita.
- issue: Caracterização da disposição interior
  choice: Seguir o hebraico “na arrogância de seu coração”
  alternative: Seguir o paralelo grego “na dureza de seu coração”
  rationale: O texto hebraico fornecido é a fonte principal e apresenta זדון, “arrogância, insolência, presunção”. A variante conceitual do grego é preservada em nota, sem harmonização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva a forma elíptica do versículo e o singular coletivo “coração”, sem explicitar no texto principal aquilo que permanece apenas alusivo.
