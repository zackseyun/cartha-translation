    issue: “soldados a pé” é uma formulação menos idiomática para o sentido militar.
    rationale: Embora literal e inteligível, a expressão pode ser entendida circunstancialmente. O hebraico רַגְלִי e o grego πεζῶν designam tropas de infantaria; “soldados de infantaria” é mais claro em português.
  - severity: low
    issue: “de seu coração” pode ter referente ambíguo em português.
    rationale: O hebraico tem “coração” no singular com sufixo plural, isto é, um singular coletivo. “Do coração deles” conserva esse singular e explicita o referente plural.
