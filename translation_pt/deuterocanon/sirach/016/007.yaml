translation:
  language: pt
  text: Ele não poupou os príncipes de outrora[a][b], que se rebelaram em sua força.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego: “os gigantes antigos”, identificando os “príncipes de outrora” com os rebeldes dos tempos primordiais.'
    reason: alternative_reading
  - marker: b
    text: O texto hebraico é difícil neste ponto; o paralelo grego apoia o sentido ligado à força deles.
    reason: textual_variant
lexical_decisions:
- source_word: לֹא נָשָׁא
  choice: não poupou
  rationale: No contexto de juízo, a expressão indica não conceder perdão ou clemência. “Não poupou” é natural em português e é corroborado pelo paralelo grego.
- source_word: לֲנְסִיכֵי קֶדֶם
  choice: os príncipes de outrora
  rationale: Segue o hebraico preservado, que fala literalmente de príncipes ou governantes antigos. “De outrora” mantém o tom digno e a referência ao passado remoto.
- source_word: הַמּוֹרִים
  choice: que se rebelaram
  rationale: O particípio de מרה caracteriza essas figuras como rebeldes ou desobedientes. A forma verbal relativa é clara e idiomática em português.
- source_word: עוֹלָם
  choice: não representado separadamente
  rationale: A palavra é textualmente difícil neste ponto e não produz uma leitura coerente em seu sentido usual. A dificuldade é preservada em nota, enquanto o paralelo grego ajuda a estabelecer o sentido global da cláusula.
- source_word: בִּגְבוּרָתָם
  choice: confiando em sua força
  rationale: גבורה significa força ou poder. A formulação explicita de modo natural que a força foi a base de sua rebelião, sem transformar sua força em instrumento da ação divina.
theological_decisions:
- issue: Identificação do grupo julgado
  choice: O texto principal mantém “os príncipes de outrora”, conforme o hebraico.
  alternative: “os gigantes antigos”, conforme o paralelo grego.
  rationale: O hebraico existente deve governar o texto principal; o grego, porém, identifica essas figuras com os gigantes primordiais. A nota preserva essa tradição sem substituir a leitura hebraica.
- issue: Relação entre rebelião e força
  choice: “que se rebelaram confiando em sua força”
  alternative: “que se rebelaram em sua força”
  rationale: A opção escolhida comunica em português a associação indicada pelo hebraico e pelo grego entre a rebelião e a força deles, evitando uma construção pouco natural e preservando a censura implícita à autoconfiança dos rebeldes.
translation_notes:
  register: Português moderno, amplo e digno, com boa legibilidade brasileira. “De outrora” conserva o caráter remoto e solene sem soar excessivamente arcaico; “confiando em sua força” torna natural a cláusula final.
