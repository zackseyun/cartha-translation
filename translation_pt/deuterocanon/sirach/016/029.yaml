lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: depois disso
  rationale: Expressa de modo natural e fiel a sequência temporal indicada pela locução grega.
- source_word: Κύριος
  choice: o Senhor
  rationale: Mantém o título divino tradicional e adequado ao contexto, com o artigo exigido pelo uso natural em português.
- source_word: εἰς τὴν γῆν ἐπέβλεψεν
  choice: olhou para a terra
  rationale: Reproduz a ideia de dirigir o olhar para a terra em linguagem atual, sem acrescentar uma nuance interpretativa.
- source_word: ἐνέπλησεν
  choice: encheu
  rationale: É o equivalente direto do verbo grego no contexto, tendo a terra como objeto.
- source_word: τῶν ἀγαθῶν αὐτοῦ
  choice: com as suas coisas boas
  rationale: Preserva a amplitude de ἀγαθά — coisas boas, bens ou benefícios — sem restringi-lo interpretativamente a 'bênçãos' ou 'dádivas'.
theological_decisions:
- issue: Tradução do título divino Κύριος
  choice: o Senhor
  alternative: Senhor
  rationale: Κύριος funciona como título divino; em português, a construção definida 'o Senhor' é a forma natural nesta frase.
- issue: Amplitude de τὰ ἀγαθά
  choice: as suas coisas boas
  alternative: as suas bênçãos
  rationale: A formulação escolhida mantém a amplitude semântica do grego e evita identificar explicitamente esses bens com bênçãos, ideia possível, mas mais interpretativa.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com boa legibilidade brasileira. A expressão 'coisas boas' é deliberadamente simples e abrangente, acompanhando a indeterminação lexical do grego.
