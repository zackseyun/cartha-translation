translation:
  language: pt
  text: Quando Deus criou suas obras desde o princípio, atribuiu-lhes domínio sobre seus seres vivos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto hebraico da segunda oração é difícil. O paralelo grego diz: “e, desde sua criação, separou as porções delas”, o que dá apoio ao sentido de repartição de domínios ordenados.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּבְרֹא
  choice: Quando ... criou
  rationale: A preposição כְּ com o infinitivo construto de ברא tem aqui valor temporal; “quando criou” expressa isso com naturalidade.
- source_word: אֵל
  choice: Deus
  rationale: É o título divino direto e adequado ao contexto, sem necessidade de expansão interpretativa.
- source_word: מַעֲשָׂיו
  choice: suas obras
  rationale: No contexto da criação, designa aquilo que Deus fez; “obras” mantém a ligação formal com o ato criador.
- source_word: מֵרֹאשׁ
  choice: desde o princípio
  rationale: Indica o ponto inicial da criação e concorda com o paralelo grego ἀπ’ ἀρχῆς.
- source_word: עַל חַיֵּיהֶם
  choice: sobre seus seres vivos
  rationale: O hebraico transmitido é difícil. Esta formulação conserva a relação expressa por עַל e entende חַיֵּיהֶם no âmbito da vida pertencente às ordens criadas, sem tornar a frase excessivamente obscura.
- source_word: חָלָק
  choice: atribuiu-lhes
  rationale: O verbo comunica divisão ou repartição. “Atribuiu-lhes” exprime de modo natural a concessão de uma esfera ordenada de atuação.
- source_word: מִשְׁטָרָם
  choice: domínio
  rationale: O termo pode indicar governo, autoridade ou administração ordenada. “Domínio” preserva a ideia de governo sem sugerir uma instituição política.
theological_decisions:
- issue: Linguagem da ordem criada em uma segunda oração hebraica textualmente difícil
  choice: Apresentar Deus como aquele que, desde o princípio, atribuiu às suas obras domínio sobre os seres vivos pertencentes a elas.
  alternative: 'Seguir mais de perto o grego: “No juízo do Senhor estão suas obras desde o princípio, e, ao fazê-las, ele separou as porções delas.”'
  rationale: O hebraico sobrevivente permanece como base, enquanto o grego confirma a noção geral de repartição e ordenação. A tradução evita transformar essa ordem em uma afirmação doutrinária mais específica do que o texto permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção “atribuiu-lhes domínio” mantém o tom sapiencial e evita a rigidez de uma reprodução palavra por palavra da oração hebraica incerta.
