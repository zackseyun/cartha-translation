  yaml_path: translation/deuterocanon/sirach/016/030.yaml
  text: The surface of it covered the life of every living thing[b][a], and to it is their return.
translation:
  language: pt
  text: A superfície dela[a] cobriu a vida de todo ser vivo, e é para ela[b] que eles retornam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o rosto dela”. O grego provavelmente se refere à face ou superfície da terra.
    reason: lexical_alternative
  - marker: b
    text: Ou “para dentro dela”. A expressão aponta para o retorno dos seres vivos à terra.
    reason: alternative_reading
lexical_decisions:
- source_word: ψυχὴν
  choice: a vida
  rationale: Neste contexto, ligado a παντὸς ζῴου, ψυχή designa a vida animada, não necessariamente uma alma imaterial.
- source_word: παντὸς ζῴου
  choice: de todo ser vivo
  rationale: Mantém o alcance amplo de ζῷον sem restringi-lo apenas aos animais.
- source_word: ἐκάλυψεν
  choice: cobriu
  rationale: Reproduz diretamente o sentido comum do verbo grego, sem acrescentar uma interpretação.
- source_word: τὸ πρόσωπον αὐτῆς
  choice: a superfície dela
  rationale: πρόσωπον significa literalmente “rosto”, mas aqui funciona idiomaticamente como a face ou superfície da terra; “dela” preserva o pronome feminino e seu vínculo contextual.
- source_word: καὶ εἰς αὐτὴν
  choice: e é para ela
  rationale: Expressa o movimento de retorno à terra e preserva a referência feminina, sem especificar em excesso a ideia de entrar nela.
- source_word: ἡ ἀποστροφὴ αὐτῶν
  choice: que eles retornam
  rationale: Verbaliza de modo natural em português o substantivo grego que significa “retorno” ou “volta”, mantendo o sentido do movimento de volta.
theological_decisions:
- issue: Referente dos pronomes femininos αὐτῆς e αὐτὴν
  choice: Preservar a referência feminina contextual com “dela” e “para ela”.
  alternative: Explicitar “da terra” e “para a terra”, ou empregar uma referência mais neutra.
  rationale: O grego não repete nesta frase o substantivo antecedente, provavelmente a terra no contexto da criação. A tradução conserva essa anáfora e evita inserir no texto principal um substantivo ausente do versículo.
- issue: Sentido de ψυχή aplicado aos seres vivos
  choice: vida
  alternative: alma, sopro ou fôlego de vida
  rationale: A construção descreve a vida dos seres vivos em termos cosmológicos. “Vida” evita impor uma antropologia dualista que o contexto não exige.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A formulação conserva os pronomes femininos do grego e a referência contextual à terra, enquanto as notas registram tanto o sentido literal de “rosto” quanto a possível nuance de movimento “para dentro”.
