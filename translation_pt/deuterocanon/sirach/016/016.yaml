base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/016.yaml
  text: His mercies are seen by all his creatures[b][a], and he has apportioned his light and his praise to the sons of man.
translation:
  language: pt
  text: Suas misericórdias são visíveis a todas as suas criaturas[b], e ele repartiu sua luz e seu louvor aos filhos do homem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «aos seres humanos» / «à humanidade»; em hebraico, literalmente «aos filhos do homem», expressão idiomática que se refere à humanidade.
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego paralelo apresenta uma leitura muito diferente: «Quem se lembrará de mim lá do alto?». O texto principal segue o testemunho hebraico preservado.'
    reason: textual_variant
lexical_decisions:
- source_word: רַחֲמָיו
  choice: suas misericórdias
  rationale: Preserva o plural hebraico e pode abranger tanto a compaixão divina quanto suas manifestações concretas.
- source_word: יֵרָאוּ
  choice: são vistas
  rationale: Entende a forma como derivada de ראה, «ver», em sentido passivo. O paralelismo com «luz» favorece a ideia de manifestação visível, sem excluir plenamente a dificuldade consonantal.
- source_word: לְכָל בִּרְיוֹתָיו
  choice: por todas as suas criaturas
  rationale: A preposição לְ pode ser traduzida como «a» ou, com o passivo, naturalmente como o agente português «por»; בריותיו designa os seres por ele criados.
- source_word: וְאוֹרוֹ
  choice: sua luz
  rationale: Mantém a imagem básica de אור e não determina se se trata de revelação, esplendor ou iluminação.
- source_word: וְשִׁבְחוֹ
  choice: seu louvor
  rationale: שבח designa louvor ou aquilo que é digno de louvor. A formulação conserva a ambiguidade entre o louvor pertencente a Deus e o louvor que lhe é devido.
- source_word: חָלַק
  choice: repartiu
  rationale: Expressa de modo corrente e digno o sentido de dividir ou distribuir, sem acrescentar a maneira ou a finalidade dessa distribuição.
- source_word: לִבְנֵי אָדָם
  choice: entre os filhos dos homens
  rationale: Reproduz de perto a expressão hebraica idiomática para a humanidade. «Entre» soa mais natural em português com «repartiu» e mantém o sentido distributivo da preposição.
theological_decisions:
- issue: Alcance antropológico de בני אדם
  choice: os filhos dos homens
  alternative: os seres humanos / a humanidade
  rationale: A expressão masculina é mantida como idiomática e representativa de toda a humanidade; a nota explicita seu alcance sem apagar a forma do hebraico.
- issue: Relação da luz e do louvor divinos com a humanidade
  choice: repartiu sua luz e seu louvor entre os filhos dos homens
  alternative: distribuiu sua luz e sua glória aos seres humanos
  rationale: O hebraico afirma uma distribuição, mas não explica se ela consiste em revelação, honra ou capacidade de louvar. A tradução preserva essa abertura e evita substituir «louvor» por «glória».
- issue: Divergência entre o hebraico e o paralelo grego
  choice: seguir o testemunho hebraico preservado
  alternative: «Quem se lembrará de mim lá do alto?»
  rationale: O texto grego paralelo difere radicalmente. Como há aqui um testemunho hebraico de alta confiança, ele fundamenta o texto principal, enquanto a variante grega é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Misericórdias», «luz» e «louvor» preservam as imagens e ambiguidades do hebraico; «repartiu» evita o tom excessivamente técnico de «distribuiu em porções» ou «aquinhoou».
