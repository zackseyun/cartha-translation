translation:
  language: pt
  text: Todo aquele que pratica a justiça tem uma recompensa; cada um a encontrará de acordo com as suas obras[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz: “Todo aquele que pratica a justiça tem uma recompensa” — ou, mais literalmente: “Todo praticante de justiça — há para ele uma recompensa”. O paralelo grego é mais extenso e acrescenta: “cada um encontrará de acordo com as suas obras”.'
    reason: textual_variant
  - marker: b
    text: O grego ἐλεημοσύνη pode significar “esmola” ou, em sentido mais amplo, “ato misericordioso”; o testemunho hebraico traz “justiça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעֹשֶׁה
  choice: cada ato
  rationale: A expressão hebraica significa literalmente “todo aquele que faz”, mas é condensada. Em conjunto com o sentido distributivo do paralelo grego, “cada ato” comunica de modo natural a ação praticada, sem tratar כָּל como um coletivo.
- source_word: צְדָקָה
  choice: justiça
  rationale: O hebraico designa justiça ou retidão. “Justiça” é corrente e abrangente em português, mantendo a dimensão ética do termo sem substituí-la pela leitura grega mais específica de esmola ou ato misericordioso.
- source_word: יֵשׁ לוֹ שָׂכָר
  choice: há uma recompensa
  rationale: A construção existencial hebraica pode ser traduzida literalmente como “ele tem uma recompensa”. A formulação escolhida é natural em português e preserva a ideia de retribuição associada à ação.
- source_word: שָׂכָר
  choice: recompensa
  rationale: O termo pode indicar salário, pagamento ou recompensa. “Recompensa” se ajusta ao registro sapiencial e evita uma conotação exclusivamente comercial.
- source_word: πάσῃ ἐλεημοσύνῃ ποιήσει τόπον
  choice: Para cada ato de justiça há uma recompensa
  rationale: O grego diverge do hebraico e, literalmente, fala em “dar lugar” a toda esmola ou ato misericordioso. O texto principal prioriza o hebraico, enquanto o grego sustenta o sentido distributivo; sua diferença lexical é registrada em nota.
- source_word: ἕκαστος κατὰ τὰ ἔργα αὐτοῦ εὑρήσει
  choice: cada pessoa a encontrará de acordo com suas obras
  rationale: Esta oração consta do paralelo grego, mas não da linha hebraica preservada. “A encontrará” conserva o verbo grego “encontrar” e explicita como referente a recompensa mencionada na primeira oração.
theological_decisions:
- issue: Traduzir צְדָקָה segundo o hebraico ou adotar a nuance caritativa de ἐλεημοσύνη no grego
  choice: Usar “justiça” no texto principal e registrar em nota a alternativa grega “esmola” ou “ato misericordioso”.
  alternative: Usar “esmola”, “caridade” ou “ato misericordioso” no texto principal.
  rationale: O testemunho hebraico tem prioridade e apresenta o conceito ético mais amplo. A nota preserva a leitura grega sem fundir indevidamente os dois testemunhos.
- issue: Incluir a oração final preservada no grego, mas ausente da linha hebraica existente
  choice: Incluir “cada pessoa a encontrará de acordo com suas obras” no texto principal, assinalando em nota a divergência textual.
  alternative: 'Traduzir apenas o hebraico mais curto: “Todo aquele que pratica a justiça tem uma recompensa.”'
  rationale: A fonte hebraica está sinalizada com pequena divergência, e o grego pode conservar uma forma mais completa do versículo. A inclusão, acompanhada de nota, representa os dois testemunhos com transparência.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “De acordo com” foi preferido a “segundo” por naturalidade contemporânea; “obras” preserva o vocabulário tradicional e o sentido amplo de ações ou feitos. Os marcadores [a] e [b] aparecem no texto principal.
