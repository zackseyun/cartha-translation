  text: The root of wisdom—to whom has it been revealed? And who has known her subtleties?[a]
translation:
  language: pt
  text: A raiz da sabedoria — a quem foi revelada? E quem conheceu as suas sutilezas?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Paralelo grego: «A fonte da sabedoria é a palavra de Deus nas alturas, e os caminhos dela são mandamentos eternos.» O testemunho hebraico neste ponto difere substancialmente do grego.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁרֶשׁ
  choice: raiz
  rationale: Preserva a metáfora concreta do hebraico para a origem ou o fundamento da sabedoria, sem harmonizá-la com o grego πηγή, «fonte».
- source_word: הַחָכְמָה
  choice: sabedoria
  rationale: Equivalente corrente e natural de חכמה na literatura sapiencial.
- source_word: לְמִי נִגְלָה
  choice: a quem foi revelada
  rationale: Mantém a construção passiva de revelação e a pergunta retórica do hebraico. O feminino de «revelada» retoma naturalmente «raiz» em português.
- source_word: מַעֲרֻמֶּיהָ
  choice: as suas sutilezas
  rationale: Comunica os aspectos penetrantes e difíceis da sabedoria sem a conotação moral negativa que «artimanhas» poderia sugerir.
- source_word: מִי יָדַע
  choice: quem conheceu
  rationale: Representa diretamente o perfeito de ידע e preserva a formulação retórica, sem substituí-lo pelo mais interpretativo «compreendeu».
theological_decisions:
- issue: Grande divergência entre o hebraico preservado e o paralelo grego
  choice: Traduzir o hebraico existente no texto principal e registrar a forma grega em nota.
  alternative: «A fonte da sabedoria é a palavra de Deus nas alturas, e os caminhos dela são mandamentos eternos.»
  rationale: O testemunho hebraico existente rege o texto principal; contudo, a diferença grega é substancial e teologicamente relevante, portanto deve permanecer visível sem ser harmonizada.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A pontuação conserva o destaque retórico da primeira pergunta; «suas» evita personificação gramatical excessivamente marcada, sem eliminar a referência à sabedoria.
