base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/014.yaml
  text: The beginning of wisdom is the fear of Yahweh[b][a], and with the faithful she was formed in the womb.
translation:
  language: pt
  text: O princípio da sabedoria é o temor de Yahweh, e com os fiéis ela foi formada no ventre[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “foi guardada no ventre” ou “foi preservada no ventre”, se o verbo hebraico for entendido a partir da raiz que significa “guardar” ou “preservar”.
    reason: alternativa_lexical
  - marker: b
    text: 'O grego traz uma leitura bastante diferente: “Entre os seres humanos, ela fez seu ninho como fundamento eterno, e à descendência deles será confiada.” Os testemunhos hebraico e grego divergem substancialmente neste versículo.'
    reason: leitura_alternativa
lexical_decisions:
- source_word: רֵאשִׁית
  choice: o princípio de
  rationale: Na construção com “sabedoria”, expressa de modo natural a origem ou o ponto inicial, em consonância com a linguagem sapiencial hebraica.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Equivalente corrente e adequado no contexto da literatura sapiencial.
- source_word: יִרְאַת יְהֹוָה
  choice: o temor de Yahweh
  rationale: “Temor” conserva a força do hebraico sem reduzi-la apenas a “reverência”, e “Yahweh” representa diretamente o nome divino.
- source_word: וְעִם
  choice: e com
  rationale: Reproduz o sentido relacional mais direto da preposição hebraica, sem convertê-la interpretativamente em “entre”.
- source_word: נֶאֱמָנִים
  choice: os fiéis
  rationale: O adjetivo substantivado provavelmente designa pessoas caracterizadas pela fidelidade; “os fiéis” é natural e mantém sua dimensão moral e religiosa.
- source_word: נוֹצְרָה
  choice: foi formada
  rationale: A imagem do ventre favorece o sentido de formação ou geração, embora a forma também possa ser relacionada a uma raiz com o sentido de guardar ou preservar; a alternativa é registrada em nota.
- source_word: בַבָּטֶן
  choice: no ventre
  rationale: Expressa naturalmente a imagem pré-natal do hebraico sem acrescentar explicitamente “materno”, que não aparece no texto.
theological_decisions:
- issue: Representação do nome divino
  choice: Yahweh
  alternative: SENHOR
  rationale: O hebraico traz diretamente o Tetragrama; a forma “Yahweh” preserva o caráter de nome próprio.
- issue: Divergência substancial entre os testemunhos hebraico e grego
  choice: Traduzir o hebraico preservado no texto principal e registrar o grego em nota
  alternative: 'Adotar no texto principal a leitura grega: “Entre os seres humanos, ela fez seu ninho como fundamento eterno, e à descendência deles será confiada.”'
  rationale: Como o hebraico está preservado, ele serve de fonte principal; contudo, o grego não é uma simples variante de redação, mas apresenta uma formulação substancialmente diferente, que deve permanecer visível ao leitor.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. O pronome “ela” retoma “sabedoria”. Mantiveram-se a personificação feminina, a expressão tradicional “temor de Yahweh” e a tensão textual entre o hebraico e o grego.
