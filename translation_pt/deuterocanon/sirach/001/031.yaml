base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/031.yaml
  text: My son[a], do not be false in the fear of Yahweh[b], and do not draw near to him with a divided heart.
translation:
  language: pt
  text: Meu filho, não seja insincero em seu temor de Yahweh e não se aproxime dele com o coração dividido.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho hebraico traz a sentença traduzida no texto principal. O paralelo grego deste versículo apresenta, em vez dela: “Quem retribui favores lembra-se do que virá depois e, no tempo da queda, encontrará apoio.”'
    reason: textual_variant
  - marker: b
    text: Literalmente, “com coração e coração”, expressão hebraica que indica duplicidade interior ou um coração dividido.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Meu filho
  rationale: Vocativo masculino singular de בֵּן com sufixo de primeira pessoa; preserva a forma e o enquadramento pedagógico da literatura sapiencial.
- source_word: אַל תְּכַזֵּב
  choice: não seja falso
  rationale: 'כזב pode expressar falsidade ou engano. Neste contexto, a advertência abrange mais que uma mentira verbal: trata da falta de autenticidade no temor de Deus.'
- source_word: בְּיִרְאַת יְהֹוָה
  choice: no temor de Yahweh
  rationale: יראה é o termo sapiencial tradicional para o temor reverente de Deus; “temor” preserva a tensão e a linguagem bíblica, e o nome próprio יהוה é transliterado como “Yahweh”.
- source_word: וְאַל תִּקְרַב אֵלָיו
  choice: e não se aproxime dele
  rationale: קרב com אֶל indica aproximar-se ou chegar-se a alguém; a formulação portuguesa é natural e mantém a possível ressonância relacional ou cultual.
- source_word: בְּלֵב וָלֵב
  choice: com o coração dividido
  rationale: Literalmente, “com coração e coração”; o idiomatismo aponta para duplicidade interior. “Coração dividido” comunica esse sentido em português atual sem apagar a imagem, que é registrada em nota.
theological_decisions:
- issue: Tradução do nome divino יהוה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O texto hebraico traz diretamente o tetragrama. “Yahweh” preserva o nome pactual e evita substituí-lo por um título.
- issue: Grande divergência entre os testemunhos hebraico e grego
  choice: Traduzir no texto principal o hebraico preservado e registrar a leitura grega em nota
  alternative: Traduzir o grego no texto principal ou combinar os dois testemunhos
  rationale: Há aqui um texto hebraico existente e de alta confiança, mas o paralelo grego contém uma sentença inteiramente diferente. Mantê-los separados respeita a evidência textual e evita harmonização artificial.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conserva-se o idiomatismo bíblico “temor de Yahweh”; a expressão hebraica incomum sobre o coração é vertida de modo inteligível e explicada em nota.
