  text: She is a staff of strength and a support[a], praise and everlasting honor to everyone who walks after her.
translation:
  language: pt
  text: Ela é um cajado de força e um apoio, louvor e honra eterna para todo aquele que a segue[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego diz: “A raiz da sabedoria é temer o Senhor, e seus ramos são vida longa.” O testemunho hebraico neste ponto difere substancialmente da tradição grega.'
    reason: textual_variant
lexical_decisions:
- source_word: מַטּהֵ עֹז
  choice: bastão de força
  rationale: מַטֶּה designa um bastão ou cajado, e עֹז, força ou poder. “Bastão de força” preserva a imagem concreta e mantém o paralelismo com “apoio”.
- source_word: מַשְׁעֵנָה
  choice: apoio
  rationale: O substantivo indica aquilo em que alguém se apoia. “Apoio” evita repetir “bastão” e exprime naturalmente a função da imagem anterior.
- source_word: תְּהִלָּה
  choice: louvor
  rationale: É o sentido mais direto do termo hebraico e conserva a concisão da enumeração poética, sem decidir se se trata da qualidade de ser louvado ou do louvor recebido.
- source_word: כְבוֹד עוֹלָם
  choice: honra eterna
  rationale: כָּבוֹד pode significar glória ou honra; neste contexto, “honra” se aplica naturalmente ao beneficiário humano. עוֹלָם indica duração permanente ou indefinida, aqui vertida como “eterna”.
- source_word: לְכָל הַהוֹלֵךְ אַחֲרֶיהָ
  choice: para todo aquele que a segue
  rationale: הלך אחרי é uma expressão idiomática para seguir alguém. A tradução natural “a segue” preserva o pronome feminino e, portanto, a personificação da sabedoria.
theological_decisions:
- issue: Divergência substancial entre os testemunhos hebraico e grego
  choice: Traduzir no texto principal a linha hebraica preservada.
  alternative: 'Grego: “A raiz da sabedoria é temer o Senhor, e seus ramos são vida longa.”'
  rationale: Como há um testemunho hebraico para este versículo, ele serve de base ao texto principal. A tradição grega apresenta uma forma materialmente diferente e é registrada em nota, sem harmonização nem preferência doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem poética e a personificação feminina da sabedoria foram preservadas; preferiu-se “segue” à reprodução menos natural da metáfora hebraica “caminha atrás dela”.
