base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/003.yaml
  text: The height of heaven and the breadth of the earth[a], and the depth of the abyss—who can search them out?
translation:
  language: pt
  text: A altura dos céus, a largura da terra[a] e a profundidade do abismo — quem poderá investigá-las?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo grego acrescenta «e a sabedoria», resultando em: «A altura dos céus, a largura da terra, o abismo e a sabedoria — quem poderá investigá-los?»'
    reason: textual_variant
lexical_decisions:
- source_word: רוּם שָׁמַיִם
  choice: a altura dos céus
  rationale: רוּם indica dimensão vertical; “altura” forma uma tríade natural com “extensão” e “profundidade”. O plural “céus” corresponde bem ao hebraico שָׁמַיִם e é corrente em português bíblico moderno.
- source_word: רֹחַב אָרֶץ
  choice: a extensão da terra
  rationale: רֹחַב denota largura ou amplitude. “Extensão” preserva a ideia dimensional com maior naturalidade em português do que “largura da terra”, sem reduzir אָרֶץ a uma região específica.
- source_word: עֹמֶק תְּהוֹם
  choice: a profundidade do abismo
  rationale: עֹמֶק é “profundidade”, e תְּהוֹם designa o abismo ou oceano profundo primordial. “Abismo” mantém a força cósmica do termo e concorda com o paralelo grego ἄβυσσος.
- source_word: מִי יַחֲקֹר
  choice: quem as poderá investigar?
  rationale: O imperfeito יַחֲקֹר pergunta retoricamente quem é capaz de sondar ou investigar plenamente as grandezas enumeradas. “Poderá investigar” explicita de modo idiomático a capacidade implícita; “as” retoma as três dimensões.
theological_decisions:
- issue: A expressão “e a sabedoria” aparece no paralelo grego, mas não no texto hebraico preservado.
  choice: Não incluir “e a sabedoria” no texto principal.
  alternative: “A altura dos céus, a extensão da terra, o abismo e a sabedoria — quem os poderá sondar?”
  rationale: O hebraico, de alta confiança, é a fonte principal e contém somente as três grandezas cósmicas. A leitura grega amplia o alcance da pergunta ao acrescentar a sabedoria; por ser uma variante interpretativamente relevante, é registrada em nota, sem ser incorporada ao texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva a tríade espacial do hebraico e a força da pergunta retórica. O travessão marca a transição para a pergunta sem alterar a sintaxe do original.
