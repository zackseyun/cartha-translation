base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/016.yaml
  text: The beginning of wisdom is the fear of Yahweh[a], and it brings abundant peace and life and healing.
translation:
  language: pt
  text: O princípio da sabedoria é o temor de Yahweh[a], e ele traz abundância de paz, vida e cura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego traz uma linha substancialmente diferente: «Ela encheu toda a casa deles com suas coisas desejáveis e os depósitos com seus frutos.»'
    reason: textual_variant
lexical_decisions:
- source_word: רֵאשִׁית
  choice: princípio
  rationale: Preserva o sentido de começo ou fundamento sem decidir além do que a formulação hebraica permite; é também natural na linguagem sapiencial em português.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: Equivalente corrente e adequado ao contexto da literatura sapiencial.
- source_word: יִרְאַת
  choice: temor de
  rationale: Mantém a força do hebraico e a expressão bíblica tradicional; «reverência por» explicaria apenas parte do campo semântico.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Translitera o nome divino expresso diretamente no texto hebraico.
- source_word: וּמַרְבָּה
  choice: em abundância
  rationale: Comunica a ideia de grande quantidade ou aumento e produz uma construção idiomática com os três substantivos seguintes.
- source_word: שָׁלוֹם
  choice: paz
  rationale: É o equivalente principal, embora o termo também possa incluir bem-estar e integridade.
- source_word: חַיִּים
  choice: vida
  rationale: O plural morfológico hebraico funciona aqui naturalmente como o conceito singular de vida.
- source_word: וּמַרְפֵּא
  choice: cura
  rationale: Conserva o sentido restaurador do substantivo; «saúde» seria possível, mas menos dinâmico.
theological_decisions:
- issue: Forma do nome divino יְהֹוָה
  choice: Yahweh
  alternative: SENHOR; Jeová
  rationale: O hebraico apresenta o Tetragrama como nome próprio; a transliteração preserva essa característica no texto.
- issue: Divergência substancial entre os testemunhos hebraico e grego
  choice: Seguir no texto principal a linha hebraica existente e registrar a grega em nota
  alternative: 'Seguir o texto grego: «Ela encheu toda a casa deles com suas coisas desejáveis e os depósitos com seus frutos.»'
  rationale: O testemunho hebraico fornecido é de alta confiança e é a fonte primária indicada, mas a forma grega é tão diferente que deve ser preservada para o leitor como variante textual relevante.
- issue: Sujeito implícito da segunda oração
  choice: «ele» retoma «o temor de Yahweh»
  alternative: 'Manter uma sequência nominal: «e abundância de paz, vida e cura»'
  rationale: O hebraico é compacto e admite dificuldade sintática; explicitar o temor como sujeito produz português completo e segue a leitura contextual apresentada, sem acrescentar uma ideia teológica independente.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e inteligibilidade internacional. «Princípio» mantém a concisão proverbial; «em abundância» evita uma enumeração pesada. O marcador da variante aparece imediatamente após o nome divino, seguindo o material de consulta, embora a nota se refira à linha inteira.
