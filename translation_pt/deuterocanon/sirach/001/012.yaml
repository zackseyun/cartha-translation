base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/012.yaml
  text: The fear of Yahweh gladdens the heart[a], and gives joy and favor and length of days.
translation:
  language: pt
  text: O temor do SENHOR alegra o coração[a] e dá alegria, favor e vida longa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Quem teme o Senhor ficará bem no fim e, no dia de sua morte, será abençoado”. O paralelo grego preserva uma forma substancialmente diferente deste versículo.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאַת יְהֹוָה
  choice: o temor do SENHOR
  rationale: Mantém o sentido pleno de יִרְאָה como temor reverente, sem reduzi-lo apenas a “reverência”; o nome divino é representado por “SENHOR”.
- source_word: מְשַׂמַּחַת לֵב
  choice: alegra o coração
  rationale: Expressa naturalmente o valor causativo do particípio e preserva “coração” como designação transparente da vida interior.
- source_word: וְנוֹתֶנֶת
  choice: e dá
  rationale: Tradução direta e corrente, adequada à coordenação simples da frase hebraica.
- source_word: שִׂמְחָה
  choice: alegria
  rationale: Conserva a acumulação intencional de benefícios, apesar da proximidade semântica com o verbo anterior.
- source_word: חֵן
  choice: favor
  rationale: Neste contexto sapiencial, “favor” comunica melhor o benefício concedido sem impor conotações teológicas posteriores associadas a “graça”.
- source_word: אֹרֶךְ יָמִים
  choice: vida longa
  rationale: Equivalente português natural e claro do idioma hebraico literalmente expresso como “extensão de dias”.
theological_decisions:
- issue: Divergência substancial entre o testemunho hebraico e o paralelo grego
  choice: Traduzir no texto principal o hebraico existente e registrar o grego em nota.
  alternative: “Quem teme o Senhor ficará bem no fim e, no dia de sua morte, será abençoado.”
  rationale: O texto hebraico é coerente e deve permanecer primário onde está preservado. A forma grega, porém, contém uma declaração distinta e teologicamente significativa, que não deve ser harmonizada nem omitida.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Vida longa” foi preferido à formulação mais literal “extensão de dias” por naturalidade, sem perda do sentido.
