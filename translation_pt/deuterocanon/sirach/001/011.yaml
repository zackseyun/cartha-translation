translation:
  language: pt
  text: O temor de Yahweh é glória e honra[a], grandeza e uma coroa de esplendor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz uma leitura substancialmente diferente: “O temor do Senhor alegra o coração e dá contentamento, alegria e vida longa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאַת
  choice: o temor de
  rationale: Mantém o idioma hebraico característico da literatura sapiencial. “Reverência” expressaria apenas parte do campo semântico e reduziria a força do termo.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Representa diretamente o nome divino presente no texto hebraico, em forma amplamente reconhecível em português.
- source_word: כָּבוֹד
  choice: glória
  rationale: Comunica a dignidade elevada do termo neste conjunto nominal e permite distinguir וִיקָר como “honra”.
- source_word: וִיקָר
  choice: honra
  rationale: No paralelismo com כָּבוֹד, expressa naturalmente valor e distinção sem antecipar o “esplendor” do termo final.
- source_word: וּגְדֻלָּה
  choice: grandeza
  rationale: Equivalente direto que conserva a sequência de substantivos do hebraico.
- source_word: וְעֲטֶרֶת
  choice: e coroa de
  rationale: Reproduz a construção nominal hebraica. Em português, o artigo pode ser omitido naturalmente nesta enumeração predicativa.
- source_word: תִּפְאָרֶת
  choice: esplendor
  rationale: Preserva a imagem elevada de uma “coroa de esplendor” e evita repetir “glória”.
- source_word: φόβος κυρίου
  choice: o temor do Senhor
  rationale: Na nota sobre a leitura grega, reproduz a expressão sapiencial e a designação κυρίου sem substituir retroativamente o texto hebraico.
- source_word: τέρψει καρδίαν ... εὐφροσύνην ... χαρὰν ... μακροημέρευσιν
  choice: alegra o coração e dá contentamento, alegria e vida longa
  rationale: A leitura grega não foi adotada no texto principal porque diverge substancialmente do hebraico preservado; sua substância é apresentada com clareza na nota.
theological_decisions:
- issue: Divergência substancial entre o hebraico preservado e o texto grego de Sirácida 1:11
  choice: Seguir no texto principal a descrição nominal hebraica.
  alternative: 'Seguir o grego: “O temor do Senhor alegra o coração e dá contentamento, alegria e vida longa.”'
  rationale: O hebraico está preservado e possui alta confiança, por isso fundamenta o texto principal. A leitura grega é genuinamente distinta e relevante, sendo registrada em nota sem harmonização.
translation_notes:
  register: Português moderno, digno e claro, com estrutura concisa que conserva a sequência nominal e o paralelismo do hebraico. A forma “Yahweh” mantém explícito o nome divino da fonte.
