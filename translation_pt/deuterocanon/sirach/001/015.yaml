translation:
  language: pt
  text: A plenitude da sabedoria é temer o Senhor, e ela os embriaga com os seus frutos[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A linha hebraica preservada nos manuscritos da Geniza do Cairo neste ponto diverge acentuadamente: “Com pessoas de verdade ela foi estabelecida desde os tempos antigos, e com a descendência delas o seu amor leal é fiel”. O hebraico aparece entre colchetes na edição citada e está assinalado como uma divergência importante; por isso, a leitura grega rege o texto principal.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “ela os embriaga a partir dos seus frutos”. A sabedoria é gramaticalmente feminina em grego e é frequentemente personificada em Sirácida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλησμονὴ σοφίας
  choice: A plenitude da sabedoria
  rationale: Como o hebraico preservado neste ponto está entre colchetes e diverge substancialmente, o grego orienta o texto principal. “Plenitude” conserva a força nominal de πλησμονή e o genitivo “da sabedoria”.
- source_word: φοβεῖσθαι τὸν κύριον
  choice: é temer o Senhor
  rationale: O infinitivo explica em que consiste a plenitude da sabedoria. “Temer” mantém tanto o sentido lexical quanto a tensão bíblica, sem reduzi-lo a mero respeito.
- source_word: μεθύσκει
  choice: embriaga
  rationale: Preserva a imagem intensa e metafórica do verbo grego, em vez de atenuá-la como “satisfaz” ou “enche”.
- source_word: αὐτοὺς
  choice: os
  rationale: Mantém o pronome sem explicitar um antecedente que o versículo isolado não fornece; no contexto, provavelmente remete aos que temem o Senhor.
- source_word: ἀπὸ τῶν καρπῶν αὐτῆς
  choice: com os seus frutos
  rationale: Embora ἀπό tenha normalmente o sentido de “de/a partir de”, com μεθύσκω pode indicar aquilo com que alguém é embriagado. “Com os seus frutos” é português natural e preserva a imagem; “seus” retoma a sabedoria.
theological_decisions:
- issue: Divergência entre o testemunho hebraico entre colchetes e o paralelo grego
  choice: Seguir o sentido grego no texto principal e registrar o hebraico divergente em nota.
  alternative: “Com pessoas fiéis ela foi estabelecida desde os tempos antigos, e com a descendência delas o seu amor leal é fiel.”
  rationale: A linha hebraica disponível está entre colchetes na edição citada e foi identificada como uma divergência importante, sem correspondência com o versículo grego. Assim, o grego rege o texto principal, enquanto a leitura hebraica é preservada para transparência textual.
- issue: Personificação da sabedoria
  choice: Usar “ela” para retomar explicitamente “sabedoria”.
  alternative: “isso os embriaga”
  rationale: σοφία é feminino em grego, e a sabedoria é frequentemente personificada em Sirácida. O português também permite essa retomada feminina de modo natural, sem exigir que a personificação seja tomada como uma entidade distinta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Plenitude” mantém o tom sapiencial; “embriaga” conserva a metáfora vívida do grego. Os marcadores seguem a ordem natural [a][b] e ambos aparecem no texto principal.
