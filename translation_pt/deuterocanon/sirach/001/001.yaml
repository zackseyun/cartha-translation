  text: All wisdom is from the Lord[a], and it is with him forever.
translation:
  language: pt
  text: Toda sabedoria vem de Yahweh[a] e está com ele para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico traz o nome divino “Yahweh”; o paralelo grego diz “Senhor”.
    reason: Registra a diferença formal entre o testemunho hebraico e o paralelo grego.
lexical_decisions:
- source_word: כָּל חָכְמָה
  choice: Toda sabedoria
  rationale: O quantificador כָּל abrange a totalidade, e חָכְמָה tem aqui o sentido sapiencial amplo de “sabedoria”. A formulação é natural em português e corresponde também ao grego πᾶσα σοφία.
- source_word: מֵיהֹוָה
  choice: vem de Yahweh
  rationale: A preposição מִן marca origem ou procedência; por isso, “vem de” expressa claramente que toda sabedoria tem sua fonte em Deus. O hebraico traz o nome divino יהוה, aqui transliterado como “Yahweh”; o paralelo grego apresenta Κυρίου, “Senhor”.
- source_word: וִעמּוֹ הִיא
  choice: e está com ele
  rationale: עִם com sufixo significa “com ele”. A oração hebraica não traz cópula expressa, que é naturalmente acrescentada em português. O pronome feminino הִיא retoma חָכְמָה, mas não exige personificação; “ela” fica implícito no sujeito “sabedoria”.
- source_word: לְעוֹלָמִים
  choice: para sempre
  rationale: A expressão indica duração ilimitada ou perpétua. “Para sempre” é corrente, clara e digna em português; o grego εἰς τὸν αἰῶνα confirma esse sentido.
theological_decisions:
- issue: Representação do nome divino יהוה em um testemunho hebraico de Sirácida, em paralelo com o grego Κύριος
  choice: Yahweh
  alternative: Senhor
  rationale: O texto hebraico preservado traz diretamente o Tetragrama. “Yahweh” mantém no texto principal o caráter de nome próprio, enquanto a nota registra a forma “Senhor” do paralelo grego sem apagar a diferença textual.
- issue: Possível personificação da sabedoria
  choice: 'Construção não personificada: “e está com ele”'
  alternative: “e ela está com ele”
  rationale: Embora חָכְמָה e o pronome הִיא sejam femininos em hebraico, isso pode ser apenas concordância gramatical. A redação portuguesa preserva a referência à sabedoria sem impor uma personificação que este versículo, isoladamente, não exige.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe é direta e mantém o paralelismo conciso do hebraico. “Yahweh” representa o nome divino presente na fonte hebraica, e a nota preserva a leitura do paralelo grego.
