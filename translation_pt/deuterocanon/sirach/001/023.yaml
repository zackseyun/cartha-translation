base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/023.yaml
  text: Until the right time he will conceal his words, and the lips of many will recount his understanding.[a]
translation:
  language: pt
  text: Até o tempo oportuno, ele esconderá suas palavras, e os lábios de muitos exporão o seu entendimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto hebraico preservado nos manuscritos da Geniza do Cairo difere profundamente do grego e diz aproximadamente: “Tu colocarás sobre ele uma coroa eterna, e mérito eterno entre os santos.” Como essa testemunha hebraica está assinalada como uma grande divergência textual, o corpo do versículo segue o grego.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἕως καιροῦ
  choice: Até o tempo oportuno
  rationale: καιρός indica um momento apropriado ou determinado, não apenas tempo cronológico; “tempo oportuno” preserva essa nuance sem especificá-la além do texto.
- source_word: κρύψει
  choice: ele esconderá
  rationale: O futuro ativo de κρύπτω expressa ocultar ou manter escondido; “esconderá” é claro e natural em português.
- source_word: τοὺς λόγους αὐτοῦ
  choice: suas palavras
  rationale: Mantém de modo direto o sentido de λόγοι e o paralelismo poético do verso.
- source_word: χείλη πολλῶν
  choice: os lábios de muitos
  rationale: Preserva a imagem poética concreta do grego, em vez de substituí-la simplesmente por “muitas pessoas”.
- source_word: ἐκδιηγήσεται
  choice: exporão
  rationale: O verbo sugere narrar ou apresentar de maneira desenvolvida; “exporão” comunica a ideia de tornar conhecido e articulado.
- source_word: σύνεσιν αὐτοῦ
  choice: o seu entendimento
  rationale: σύνεσις designa entendimento, inteligência ou discernimento na literatura sapiencial; “entendimento” é amplo e mantém a formulação sem estreitá-la.
theological_decisions:
- issue: Escolha da testemunha textual diante da grande divergência entre o hebraico preservado e o grego
  choice: Seguir o texto grego no corpo do versículo e registrar a leitura hebraica em nota.
  alternative: 'Traduzir no corpo do texto o hebraico preservado: “Tu colocarás sobre ele uma coroa eterna, e mérito eterno entre os santos.”'
  rationale: O texto hebraico fornecido não corresponde semanticamente ao grego de Sirácida 1:23 e foi explicitamente classificado como grande divergência. O grego oferece aqui a leitura contextual identificada como pertencente ao versículo, enquanto a forma hebraica divergente deve ser preservada com transparência, sem harmonização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a imagem sapiencial “os lábios de muitos”; a nota explicita a divergência textual substancial sem tentar conciliá-la.
