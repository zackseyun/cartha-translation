  text: Who can count the sand of the seas[a], the drops of rain, and the days of eternity?
translation:
  language: pt
  text: Quem pode contar a areia dos mares, as gotas da chuva e os dias da eternidade[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os dias de uma era” ou “os dias antigos”. O hebraico עוֹלָם pode indicar eternidade, uma era ou um tempo remoto; o paralelo grego favorece aqui a ideia de uma duração incomensurável.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹל יַמִּים
  choice: a areia dos mares
  rationale: O hebraico emprega “areia” em sentido coletivo e mantém “mares” no plural; a formulação portuguesa preserva essa imagem de vastidão e concorda com o paralelo grego.
- source_word: נִטְפֵי מָטָר
  choice: as gotas da chuva
  rationale: Reproduz de modo claro e natural a construção hebraica concreta, também refletida no grego.
- source_word: וִימוֹת עוֹלָם
  choice: os dias da eternidade
  rationale: Mantém a imagem temporal e a amplitude semântica de עוֹלָם no contexto de coisas humanamente incontáveis, sem transformar a expressão em uma afirmação metafísica técnica.
- source_word: מִי יִמְנֶה
  choice: Quem pode contar
  rationale: A pergunta retórica com o imperfeito comunica impossibilidade ou incapacidade humana; “pode contar” expressa essa força com naturalidade em português.
theological_decisions:
- issue: Sentido temporal de עוֹלָם na hipérbole sapiencial
  choice: “eternidade”, indicando uma duração incomensurável
  alternative: “uma era” ou “os tempos antigos”
  rationale: O contexto enumera realidades que escapam à contagem humana, e o paralelo grego ἡμέρας αἰῶνος favorece a noção de duração imensa ou ilimitada. A nota preserva, porém, a amplitude lexical do hebraico.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe direta. A repetição dos artigos sustenta o ritmo da enumeração, enquanto “dias da eternidade” conserva a imagem incomum e a tensão semântica do original.
