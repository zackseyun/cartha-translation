  text: He poured her out upon all flesh according to his will[a], and he gave her to those who love him.
translation:
  language: pt
  text: Ele a derramou sobre toda carne, conforme a sua vontade,[a] e a deu aos que o amam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O hebraico transmitido diz “ele a deu” no primeiro membro; o paralelo grego apoia “ele a derramou”, leitura adotada aqui porque o testemunho hebraico deste versículo é textualmente incerto.
    reason: textual_variant
lexical_decisions:
- source_word: אֶל כָּל בָּשָׂר
  choice: sobre toda carne
  rationale: Preserva o hebraísmo abrangente “toda carne” e, com o verbo “derramar”, emprega a preposição natural “sobre”. A expressão pode abranger os seres vivos ou a humanidade sem eliminar essa amplitude.
- source_word: כִּרְצוֹנוֹ
  choice: conforme a sua vontade
  rationale: Expressa de modo natural o sentido de vontade, agrado ou desejo de רָצוֹן, mantendo a ação divina como intencional.
- source_word: נְתָנָהּ
  choice: Ele a derramou
  rationale: O texto hebraico transmitido apresenta o verbo נתן, “dar”, mas a tradição grega paralela traz ἐξέχεεν, “derramou”. Diante da incerteza textual assinalada, adota-se no texto a leitura grega, que também evita a repetição imediata de “deu”.
- source_word: וַיִּתְּנָהּ
  choice: e a deu
  rationale: Traduz diretamente o segundo verbo hebraico; o pronome feminino retoma a sabedoria.
- source_word: לְאֹהֲבָיו
  choice: aos que o amam
  rationale: Tradução corrente e fiel do particípio “os que o amam”, sem acrescentar uma qualificação afetiva ou doutrinária ausente do texto.
theological_decisions:
- issue: Divergência textual no primeiro verbo entre o hebraico transmitido e o paralelo grego
  choice: Usar “derramou” no primeiro membro, apoiado pelo grego, preservando a estrutura geral do hebraico.
  alternative: “Ele a deu a toda carne, conforme a sua vontade, e a deu aos que o amam.”
  rationale: O testemunho hebraico está marcado como textualmente incerto e repete o verbo “dar”, enquanto o paralelo grego sustenta “derramou”. A nota registra a alternativa hebraica em vez de ocultar a divergência.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conserva-se o hebraísmo “toda carne” para não restringir indevidamente o alcance do original; o pronome feminino “a” retoma “a sabedoria” no contexto.
