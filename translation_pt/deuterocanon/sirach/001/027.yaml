  text: Do not disobey the fear of the Lord, and do not come to him with a divided heart.
translation:
  language: pt
  text: Não desobedeça ao temor do Senhor, nem se aproxime dele com o coração dividido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπειθήσῃς
  choice: desobedeça
  rationale: Expressa diretamente a ideia de recusar obediência, preservando a construção incomum em que o temor do Senhor é aquilo a que se deve obedecer.
- source_word: φόβῳ Κυρίου
  choice: ao temor do Senhor
  rationale: Mantém a expressão sapiencial tradicional e sua abrangência, sem reduzi-la apenas a medo ou reverência.
- source_word: προσέλθῃς αὐτῷ
  choice: se aproxime dele
  rationale: Reproduz o movimento de chegar-se ao Senhor; o pronome retoma naturalmente “Senhor” em português.
- source_word: ἐν καρδίᾳ δισσῇ
  choice: com o coração dividido
  rationale: Formulação natural que preserva a imagem de duplicidade, hesitação ou lealdade repartida.
theological_decisions:
- issue: A expressão “temor do Senhor” como objeto de obediência
  choice: Não desobedeça ao temor do Senhor
  alternative: Não resista ao temor do Senhor
  rationale: A escolha conserva a força ética de ἀπειθέω e a formulação teologicamente tensa do grego, sem explicar o “temor” como mera emoção.
- issue: Sentido de “coração dividido”
  choice: coração dividido
  alternative: coração dúplice
  rationale: “Dividido” é claro e corrente, mas não limita a expressão a uma única interpretação, como hipocrisia, dúvida ou lealdade dupla.
translation_notes:
  register: Português moderno, claro e digno, com imperativos na forma de tratamento por “você” implícito. Diante da incompatibilidade declarada do texto hebraico fornecido com a referência, a redação segue o paralelo grego de Sirácida 1:27, em consonância com a camada inglesa auditada.
