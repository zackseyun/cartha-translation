translation:
  language: pt
  text: Ame o temor do SENHOR, faça o seu coração feliz nele e não tenha medo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego preservado para este versículo é inteiramente diferente: “O coração do sábio refletirá sobre um provérbio, e o ouvido atento é o desejo do sábio.” A tradução acima segue o texto hebraico.'
    reason: A tradição grega apresenta uma grande divergência textual, que deve ser informada sem substituir o testemunho hebraico adotado.
lexical_decisions:
- source_word: אֱהַב
  choice: Ame
  rationale: Imperativo singular de אהב, traduzido diretamente em linguagem corrente e digna.
- source_word: יִרְאַת יְהֹוָה
  choice: o temor do SENHOR
  rationale: Mantém a expressão hebraica tradicional para reverência e temor diante de Deus; SENHOR representa o nome divino יהוה.
- source_word: וְאַשֵּׁר בָּהּ לִבְּךָ
  choice: e, nele, faça feliz o seu coração
  rationale: אַשֵּׁר é entendido como forma intensiva causativa de אשר, ‘tornar feliz’. O pronome feminino בָּהּ retoma יִרְאָה, ‘temor’, que em português é masculino; por isso, ‘nele’.
- source_word: וְאַל תִּירָא
  choice: e não tenha medo
  rationale: Preserva o imperativo negativo e o jogo verbal do hebraico entre ‘temor’ (יִרְאָה) e ‘ter medo’ (תִּירָא).
theological_decisions:
- issue: Relação entre temer o SENHOR e não ter medo
  choice: Preservar as duas afirmações lado a lado
  alternative: Explicar ‘temor’ apenas como reverência e eliminar a tensão verbal
  rationale: 'O hebraico emprega termos da mesma raiz e apresenta deliberadamente a tensão: amar o temor do SENHOR e, ao mesmo tempo, não ter medo.'
- issue: Sentido de וְאַשֵּׁר
  choice: ‘faça feliz’
  alternative: ‘abençoe’
  rationale: O valor lexical mais provável neste contexto é tornar feliz ou venturoso. ‘Abençoe’ poderia sugerir que a pessoa confere bênção ao próprio coração, ideia menos diretamente sustentada pela forma hebraica.
translation_notes:
  register: Português moderno de ampla compreensão, com legibilidade brasileira. A formulação conserva o paralelismo e o jogo entre ‘temor’ e ‘medo’, evitando linguagem denominacional. A colocação ‘nele’ esclarece que a felicidade do coração se encontra no temor do SENHOR.
