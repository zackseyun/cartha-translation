translation:
  language: pt
  text: A água apaga o fogo ardente, e a esmola expia pecados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto hebraico indicado para esta referência diz: «Aproxima-te e não demores, e encontrarás vida para ti. E, quando estiveres perto, sê como um guerreiro e como um homem valente». Ele não corresponde a este versículo na tradição grega; por isso, a tradução segue aqui o texto grego preservado.'
    reason: A fonte hebraica fornecida apresenta uma discrepância substancial de conteúdo e referência em relação ao paralelo grego e à identificação editorial do versículo.
lexical_decisions:
- source_word: πῦρ φλογιζόμενον
  choice: fogo ardente
  rationale: Expressa de modo natural a imagem de um fogo que está em chamas, sem acrescentar intensidade ausente do grego.
- source_word: ἀποσβέσει
  choice: apaga
  rationale: O futuro grego tem valor proverbial; o presente português comunica com naturalidade uma verdade geral.
- source_word: ἐλεημοσύνη
  choice: esmola
  rationale: No contexto sapiencial, refere-se concretamente à ajuda material dada aos necessitados; «esmola» é conciso e tradicional, embora hoje possa ter conotação pejorativa em certos contextos.
- source_word: ἐξιλάσεται
  choice: expia
  rationale: Preserva a linguagem cultual e teológica do verbo grego, sem reduzir o sentido a mero perdão ou ocultação.
- source_word: ἁμαρτίας
  choice: pecados
  rationale: Mantém o plural sem artigo do texto grego, sem especificar de quem são os pecados.
theological_decisions:
- issue: Relação entre esmola e pecados
  choice: «a esmola expia pecados»
  alternative: «a esmola obtém o perdão dos pecados»
  rationale: A formulação escolhida conserva a força e a tensão teológica de ἐξιλάσεται, sem explicar o mecanismo nem harmonizá-lo com uma tradição doutrinária específica.
- issue: Tempo verbal dos dois verbos gregos
  choice: presente proverbial em português
  alternative: «apagará» e «expiará»
  rationale: Os futuros gregos podem formular uma máxima geral. O presente é a forma proverbial mais corrente em português e mantém o paralelismo.
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial concisa. «Esmola» foi mantida por sua precisão lexical e pelo amplo reconhecimento bíblico; «expia» preserva deliberadamente a tensão teológica do original.
