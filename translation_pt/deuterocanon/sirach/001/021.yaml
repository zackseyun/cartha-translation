base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/021.yaml
  text: Happy is the man who meditates on her[b][a], and she is better for him than every treasure.
translation:
  language: pt
  text: Feliz o homem que medita nela[a], e ela é melhor para ele do que qualquer tesouro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Bem-aventurado o homem que nela reflete”.'
    reason: Alternativa lexical para אַשְׁרֵי e יֶהְגֶּה.
  - marker: b
    text: 'O testemunho grego traz aqui uma leitura muito diferente: “Pois o impulso de sua ira é sua queda”. Isso provavelmente reflete outra forma textual ou outro alinhamento dos versículos em relação ao hebraico preservado.'
    reason: Variante textual significativa.
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Feliz
  rationale: A fórmula hebraica de bem-aventurança descreve uma condição invejável de felicidade e bem-estar. “Feliz” é claro e natural no português atual, enquanto “Bem-aventurado” permanece como alternativa tradicional.
- source_word: אֱנוֹשׁ
  choice: o homem
  rationale: O substantivo designa um ser humano, por vezes com a conotação de mortalidade. “O homem” conserva o singular masculino representativo da formulação sapiencial hebraica.
- source_word: יֶהְגֶּה
  choice: medita
  rationale: No contexto sapiencial, o verbo הגה expressa reflexão contínua, contemplação ou ponderação. “Medita” comunica essa atenção reflexiva de modo conciso e digno.
- source_word: בָּהּ
  choice: nela
  rationale: O sufixo pronominal é feminino e remete mais naturalmente à sabedoria personificada no contexto. “Nela” preserva essa referência feminina sem introduzir um antecedente ausente no versículo.
- source_word: וְטוֹבָה
  choice: e ela é melhor
  rationale: A conjunção וְ liga explicitamente as orações, e a construção comparativa com מִכָּל favorece “melhor” em vez do simples “boa”. O pronome “ela” mantém a personificação feminina.
- source_word: מִכָּל אוֹצָר
  choice: do que qualquer tesouro
  rationale: אוֹצָר pode indicar tesouro, riqueza acumulada ou depósito. Aqui, “qualquer tesouro” expressa naturalmente o valor comparativo e a força abrangente de מִכָּל.
theological_decisions:
- issue: Singular masculino representativo na bem-aventurança sapiencial
  choice: o homem
  alternative: a pessoa; quem
  rationale: O hebraico emprega אֱנוֹשׁ no singular masculino em uma máxima representativa. A tradução conserva essa forma sem restringir a aplicação do provérbio apenas aos homens.
- issue: Personificação feminina da sabedoria
  choice: nela / ela é melhor
  alternative: nisso / isso é melhor
  rationale: O sufixo feminino hebraico e o contexto da sabedoria personificada sustentam a referência feminina. A tradução evita neutralizá-la, mas não acrescenta explicitamente “sabedoria” ao texto.
- issue: Testemunho grego radicalmente divergente
  choice: seguir o texto hebraico no corpo do versículo
  alternative: “Pois o impulso de sua ira é sua queda”
  rationale: O testemunho grego corresponde a uma forma textual ou alinhamento de versículos muito diferente. Como o texto hebraico disponível tem alta confiança neste projeto, ele fundamenta a tradução principal, e a divergência grega é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A construção concisa “Feliz o homem” mantém o caráter proverbial; “nela” e “ela” preservam a personificação feminina da sabedoria.
