  text: Before all these, wisdom was created[b][a], and true understanding is from eternity.
translation:
  language: pt
  text: Antes de todas as coisas, a sabedoria foi criada[a], e o entendimento prudente existe desde a eternidade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico preservado diz mais literalmente: “Maior do que todas essas coisas é a sabedoria”; o paralelo grego diz: “Antes de todas as coisas, a sabedoria foi criada”. O texto principal segue aqui o sentido grego, pois o testemunho hebraico diverge.'
    reason: alternative_reading
  - marker: b
    text: 'No segundo membro, o hebraico preservado diz: “e a verdade tem prevalecido desde a eternidade”; o grego traz: “e o entendimento prudente existe desde a eternidade”.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִכָּל אֵלֶּה / προτέρα πάντων
  choice: Antes de todas essas coisas
  rationale: Embora o hebraico preservado possa ser entendido comparativamente como “mais do que todas essas coisas”, o paralelo grego traz claramente a ideia de anterioridade. A tradução principal segue essa estrutura temporal, registrando a divergência em nota.
- source_word: רַבָּה / ἔκτισται
  choice: foi criada
  rationale: O hebraico preservado significa normalmente “é grande” ou “tornou-se grande”, enquanto o grego diz “foi criada”. Como os testemunhos divergem e o texto hebraico da edição está entre colchetes, a tradução principal adota a leitura grega e conserva a hebraica em nota.
- source_word: הַחָכְמָה
  choice: a sabedoria
  rationale: Equivalente corrente e natural de חכמה; o contexto permite personificação, mas não exige inicial maiúscula.
- source_word: הָאֱמֶת / σύνεσις φρονήσεως
  choice: o verdadeiro entendimento
  rationale: A formulação combina de modo idiomático o conteúdo grego, “entendimento prudente”, com uma ressonância do hebraico אמת, “verdade”, sem ocultar em nota a diferença substancial entre os testemunhos.
- source_word: מֵעוֹלָם / ἐξ αἰῶνος
  choice: desde a eternidade
  rationale: Expressa naturalmente a antiguidade primordial ou duração eterna indicada tanto pelo hebraico quanto pelo grego.
theological_decisions:
- issue: Divergência entre os testemunhos hebraico e grego nos dois membros do versículo
  choice: O texto principal segue a estrutura e o sentido central do grego, com alguma ressonância lexical do hebraico, e apresenta a leitura hebraica em notas.
  alternative: “Maior do que todas essas coisas é a sabedoria, e a verdade prevalece desde a eternidade.”
  rationale: O hebraico composto está assinalado como textual ou editorialmente incerto e diverge fortemente do grego nos predicados e no conteúdo do segundo membro. As notas preservam a evidência hebraica sem fundir silenciosamente leituras distintas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação mantém o tom sapiencial e assinala explicitamente as variantes textuais relevantes.
