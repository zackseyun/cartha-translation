  text: In the treasures of wisdom are insightful sayings[b], but godliness[c] is an abomination to a sinner.[a]
translation:
  language: pt
  text: Nos tesouros da sabedoria há provérbios de entendimento[b], mas a reverência a Deus[c] é uma abominação para o pecador.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A linha hebraica preservada nos manuscritos da Genizá do Cairo editados por Kahana diz aproximadamente: “Ele se alegrará nela, e ela se alegrará nele; e não o abandone para todo o sempre”. Como ela não corresponde ao texto grego deste versículo, a tradução principal segue aqui o testemunho grego.'
    reason: textual_variant
  - marker: b
    text: Ou “ditos de conhecimento” ou “parábolas de entendimento”.
    reason: lexical_alternative
  - marker: c
    text: Ou “piedade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν θησαυροῖς σοφίας
  choice: Nos tesouros da sabedoria
  rationale: Como a linha hebraica preservada não corresponde a este versículo, a tradução principal segue o testemunho grego. A expressão mantém de modo natural a metáfora dos tesouros pertencentes à sabedoria ou contidos nela.
- source_word: παραβολαὶ ἐπιστήμης
  choice: provérbios de entendimento
  rationale: No contexto sapiencial, παραβολαί pode designar provérbios ou ditos figurados; ἐπιστήμης qualifica seu conteúdo como entendimento ou conhecimento. A formulação conserva a estrutura e a ambiguidade lexical melhor que uma paráfrase adjetival.
- source_word: βδέλυγμα
  choice: uma abominação
  rationale: Preserva a forte carga moral e religiosa do termo grego, que indica algo detestável ou repugnante.
- source_word: ἁμαρτωλῷ
  choice: para o pecador
  rationale: 'O dativo indica o ponto de vista ou referência: a reverência a Deus é abominável aos olhos do pecador.'
- source_word: θεοσέβεια
  choice: a reverência a Deus
  rationale: Expressa diretamente a devoção ou piedade dirigida a Deus, em linguagem atual e sem depender do sentido potencialmente ambíguo de 'piedade' em português.
theological_decisions:
- issue: Divergência textual substancial entre os testemunhos hebraico e grego
  choice: Seguir o texto grego no corpo do versículo e registrar a linha hebraica divergente em nota
  alternative: 'Traduzir no corpo do versículo a linha hebraica preservada: “Ele se alegrará nela, e ela se alegrará nele; e não o abandone para todo o sempre”'
  rationale: A linha hebraica composta dos manuscritos da Genizá do Cairo está assinalada como uma incompatibilidade importante e não corresponde ao conteúdo de Sirácida 1:24 no testemunho grego. O grego fornece, portanto, a base utilizável para este versículo, enquanto a nota preserva com transparência a evidência hebraica divergente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Provérbios de entendimento” mantém o caráter sapiencial e a relação genitiva do grego; “reverência a Deus” torna explícito o referente de θεοσέβεια sem acrescentar conteúdo doutrinário.
