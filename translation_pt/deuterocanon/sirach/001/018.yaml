  text: The fear of Yahweh is the beginning of wisdom[a], and she satisfies with the abundance of her produce.
translation:
  language: pt
  text: O temor do SENHOR é o princípio da sabedoria[a], e ela sacia a pessoa com a abundância de sua produção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Ele derramou conhecimento e discernimento e exaltou a glória dos que a possuem.” O texto grego difere profundamente do hebraico preservado neste ponto e talvez reflita outra forma textual.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית
  choice: princípio
  rationale: Expressa naturalmente o começo ou ponto inicial e preserva a conhecida fórmula sapiencial sem acrescentar o sentido interpretativo de “princípio supremo”.
- source_word: חָכְמָה
  choice: sabedoria
  rationale: É o equivalente corrente e adequado no contexto da literatura sapiencial.
- source_word: יִרְאַת יְהֹוָה
  choice: o temor do SENHOR
  rationale: Mantém a tensão entre medo, reverência e assombro, sem reduzi-la apenas a “reverência”; o nome divino é representado por SENHOR.
- source_word: וּתְרַוֵּה
  choice: e ela sacia
  rationale: O verbo sugere saturar, fartar ou suprir abundantemente. “Sacia” é conciso e natural em português, preservando a ideia de plena satisfação e a personificação feminina.
- source_word: בְּרֹב
  choice: com a abundância de
  rationale: Representa a abundância como o conteúdo ou meio pelo qual ocorre a saciedade e conserva a força quantitativa da expressão hebraica.
- source_word: תְּבוּאָתָהּ
  choice: sua produção
  rationale: Preserva de modo amplo a metáfora agrícola de produto ou rendimento, sem restringi-la necessariamente a uma colheita específica. O possessivo retoma a sabedoria personificada.
theological_decisions:
- issue: Escolha da fonte principal diante da grande divergência entre o hebraico e o grego
  choice: Traduzir o hebraico preservado no texto principal e registrar o grego em nota.
  alternative: 'Seguir o grego: “Ele derramou conhecimento e ciência do entendimento e exaltou a glória dos que a possuem.”'
  rationale: Como há testemunho hebraico para este versículo, ele tem prioridade. A leitura grega é substancialmente diferente e pode refletir outra forma textual; por isso, não deve substituir silenciosamente o hebraico nem ser omitida.
- issue: Personificação feminina da sabedoria
  choice: Retê-la por meio de “ela” e do possessivo “sua”.
  alternative: Empregar construção inteiramente impessoal.
  rationale: A forma verbal e o sufixo feminino relacionam a imagem à sabedoria personificada, característica da tradição sapiencial hebraica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “SENHOR” mantém a convenção bíblica para o nome divino; “sacia” comunica de forma natural a ideia hebraica de suprimento abundante.
