translation:
  language: pt
  text: entre toda carne, segundo a sua dádiva[a], e ele a concedeu aos que o amam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com toda carne” ou “a toda carne”; a expressão grega pode descrever a distribuição da sabedoria entre todos os seres vivos.
    reason: A construção μετὰ πάσης σαρκός admite mais de uma relação idiomática em português, e o contexto distributivo pode favorecer “entre” ou “a”.
lexical_decisions:
- source_word: μετὰ πάσης σαρκός
  choice: entre toda carne
  rationale: Preserva o idioma concreto e coletivo do grego, no qual “carne” abrange seres vivos ou mortais, sem restringir indevidamente o sentido apenas à humanidade. μετά com genitivo admite aqui o sentido de “entre” ou “com”.
- source_word: κατὰ τὴν δόσιν αὐτοῦ
  choice: segundo a sua dádiva
  rationale: δόσις pode designar tanto o ato de dar quanto aquilo que é dado. “Segundo a sua dádiva” mantém a formulação concisa e deixa a medida ou distribuição dependente do que Deus concede.
- source_word: ἐχορήγησεν
  choice: concedeu
  rationale: χορηγέω expressa fornecer, prover ou outorgar. “Concedeu” é natural em português, comunica a dádiva divina e se ajusta ao objeto feminino que retoma a sabedoria.
- source_word: αὐτήν
  choice: a
  rationale: O pronome feminino retoma naturalmente a sabedoria personificada no contexto. Em português, o pronome oblíquo feminino preserva essa referência sem repetição artificial.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: aos que o amam
  rationale: Traduz diretamente o particípio substantivado e conserva o pronome masculino, cujo referente contextual é Deus.
theological_decisions:
- issue: Referência dos pronomes no versículo
  choice: O pronome feminino retoma a sabedoria, e o masculino retoma Deus.
  alternative: Traduzir a referência feminina de modo impessoal, ou deixar menos definido o referente do pronome masculino.
  rationale: O contexto de Sirácida 1 personifica a sabedoria no feminino e apresenta Deus como aquele que a concede. A tradução mantém essa textura literária e teológica sem acrescentar uma identificação doutrinária não expressa pelo texto.
- issue: Alcance de πάσης σαρκός
  choice: Manter “toda carne”, permitindo referência ampla aos seres vivos ou mortais.
  alternative: Usar “toda a humanidade”, restringindo a expressão aos seres humanos.
  rationale: A expressão grega é coletiva e mais ampla do que uma referência inequivocamente antropológica; convém preservar essa abertura sem associar “carne” à ideia teológica de natureza pecaminosa.
translation_notes:
  register: Português atual, digno e de leitura ampla, com a expressão bíblica “toda carne” preservada por sua concretude e abrangência. A colocação pronominal “ele a concedeu” evita ambiguidade e soa natural no português brasileiro sem deixar de ser internacionalmente compreensível.
