translation:
  language: pt
  text: Pois a sabedoria e a instrução são o temor do Senhor, e o que lhe agrada é a fé e a mansidão.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho hebraico existente fornecido aqui foi identificado como uma incompatibilidade importante e não corresponde às palavras deste versículo; por isso, a tradução segue o texto grego de Sirácida 1:26.
    reason: textual_variant
  - marker: b
    text: 'Ou: “seu favor é a fidelidade e a gentileza”. O grego também permite traduzir “fé” por “fidelidade” ou “confiança”, e “mansidão” por “gentileza”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: sabedoria
  rationale: Termo sapiencial amplo, que abrange discernimento moral e prático.
- source_word: παιδεία
  choice: instrução
  rationale: Expressa formação e ensino sem restringir o sentido à disciplina punitiva.
- source_word: φόβος κυρίου
  choice: temor do Senhor
  rationale: Preserva a expressão sapiencial tradicional e seu peso teológico, incluindo reverência e assombro.
- source_word: ἡ εὐδοκία αὐτοῦ
  choice: o que lhe agrada
  rationale: Formulação natural em português para aquilo que é do agrado do Senhor, sem impor o sentido alternativo de favor concedido.
- source_word: πίστις
  choice: fé
  rationale: Mantém o sentido tradicional, embora fidelidade e confiança sejam possíveis neste contexto.
- source_word: πρᾳότης
  choice: mansidão
  rationale: Preserva a qualidade ética de brandura humilde; gentileza também é possível.
theological_decisions:
- issue: Seleção da fonte primária diante de testemunho hebraico incompatível
  choice: Traduzir o texto grego correspondente a Sirácida 1:26 e registrar a incompatibilidade do hebraico fornecido.
  alternative: Traduzir a linha hebraica fornecida, embora ela não corresponda a este versículo.
  rationale: O testemunho hebraico foi identificado como uma incompatibilidade importante e contém outra sentença; portanto, o paralelo grego é a evidência textual operativa para este versículo.
- issue: Sentido de πίστις
  choice: fé
  alternative: fidelidade ou confiança
  rationale: O termo admite esses sentidos, e o contexto sapiencial não elimina a possibilidade de fidelidade; a alternativa é preservada em nota.
- issue: Sentido de εὐδοκία
  choice: o que lhe agrada
  alternative: seu favor
  rationale: A construção pode indicar aquilo que agrada ao Senhor ou, alternativamente, seu favor; o texto principal mantém a primeira leitura sem eliminar a segunda.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A expressão tradicional “temor do Senhor” foi preservada; “o que lhe agrada” evita a rigidez pouco natural de “seu bom prazer”.
