  text: Until the appointed time, the patient one[b] will endure, and afterward joy will be repaid to him.[a]
translation:
  language: pt
  text: Quem é paciente suportará até o tempo determinado e, depois, receberá alegria como recompensa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A linha hebraica fornecida para este versículo parece pertencer a outro contexto. A tradução segue o texto grego: “Quem é paciente suportará até o tempo determinado e, depois, receberá alegria como recompensa.”'
    reason: textual_variant
  - marker: b
    text: Ou “quem é longânimo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως καιροῦ
  choice: Até o tempo determinado
  rationale: καιρός indica aqui um tempo oportuno ou determinado, e não apenas tempo em sentido genérico. A formulação mantém essa nuance sem especificar quem o determinou.
- source_word: ἀνέξεται
  choice: suportará
  rationale: O futuro médio de ἀνέχω expressa perseverar ou aguentar em meio à dificuldade. “Suportará” é natural e conserva a ideia de resistência paciente.
- source_word: μακρόθυμος
  choice: quem é paciente
  rationale: O adjetivo é usado como substantivo e designa genericamente uma pessoa paciente ou longânima. Esta opção preserva o singular sem introduzir gênero masculino.
- source_word: ὕστερον
  choice: depois
  rationale: Equivalente temporal claro e corrente, que mantém a sequência entre a perseverança e a recompensa.
- source_word: ἀναδώσει
  choice: lhe será retribuída
  rationale: O verbo comunica a ideia de dar de volta ou retribuir. A construção passiva em português preserva a recompensa recebida sem acrescentar um agente explícito que não aparece claramente no texto grego.
- source_word: εὐφροσύνη
  choice: alegria
  rationale: O substantivo denota alegria ou contentamento; “alegria” é a opção mais natural e abrangente em português atual.
theological_decisions:
- issue: Divergência importante entre a linha hebraica fornecida e o texto grego deste versículo
  choice: Traduzir o paralelo grego como testemunho textual operativo e registrar a divergência em nota
  alternative: 'Traduzir a linha hebraica fornecida: “Feliz quem se aproxima dela e se deleita em seus preceitos”'
  rationale: A própria documentação classifica o hebraico fornecido como uma incompatibilidade grave, e seu conteúdo não corresponde semanticamente a Sirácida 1:22 na tradição grega. O grego é, portanto, o testemunho disponível mais defensável para este versículo; a nota mantém transparente a incerteza textual.
- issue: Agente da retribuição da alegria
  choice: Usar uma construção passiva sem explicitar o agente
  alternative: Explicitar Deus, a sabedoria ou outro agente como sujeito da retribuição
  rationale: O texto não identifica inequivocamente o agente. A formulação evita importar uma resolução teológica e preserva a abertura do original.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. “Quem é paciente” evita marcação desnecessária de gênero; “tempo determinado” conserva a nuance de καιρός; a voz passiva mantém implícito o agente da recompensa.
