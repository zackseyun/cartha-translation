  text: One alone is fearsome[b][a], God ruling over all her storehouses.
translation:
  language: pt
  text: A quem foi revelada a raiz da sabedoria, e quem conheceu suas sutilezas?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto hebraico preservado nos manuscritos da Genizá do Cairo e atribuído aqui a este versículo diverge substancialmente: “Um só é temível, somente ele: Deus, que governa todos os depósitos dela” (ou semelhante). Como esse testemunho não corresponde a Sirácida 1:6 na tradição grega, o texto principal segue o grego.'
    reason: textual_variant
  - marker: b
    text: Ou “seus recursos engenhosos”, “seus procedimentos” ou “suas estratégias”. O termo grego pode indicar operações hábeis ou complexas, sem sentido necessariamente negativo neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα σοφίας
  choice: raiz da sabedoria
  rationale: O hebraico preservado atribuído a este versículo diverge substancialmente da tradição grega; por isso, o grego funciona aqui como texto-base. “Raiz” conserva o sentido direto de ῥίζα e sua metáfora.
- source_word: τίνι ἀπεκαλύφθη
  choice: a quem foi revelada
  rationale: Mantém a voz passiva de ἀποκαλύπτω e produz uma pergunta natural e digna em português.
- source_word: πανουργεύματα αὐτῆς
  choice: suas sutilezas
  rationale: O termo pode designar recursos engenhosos, procedimentos ou estratégias. “Sutilezas” comunica a complexidade das operações da sabedoria sem lhes atribuir necessariamente um caráter moralmente negativo.
- source_word: τίς ἔγνω
  choice: quem conheceu
  rationale: Traduz de modo direto o aoristo ἔγνω e preserva a força retórica e abrangente da pergunta.
theological_decisions:
- issue: Seleção do texto-base diante de um testemunho hebraico divergente
  choice: Traduzir no texto principal a leitura da tradição grega
  alternative: 'Traduzir como texto principal o hebraico preservado: “Um só é temível, somente ele: Deus, que governa todos os depósitos dela” (ou semelhante)'
  rationale: O próprio registro da fonte classifica o hebraico como uma divergência grave e ele não corresponde a Sirácida 1:6 na tradição grega. Segue-se, portanto, o grego para este versículo, sem ocultar a leitura hebraica divergente.
translation_notes:
  register: Português moderno, claro e solene, com formulação interrogativa natural. O pronome possessivo “suas” retoma “sabedoria”, preservando a personificação presente no grego. A incerteza textual é explicitada em nota, sem misturar as duas tradições no corpo do versículo.
