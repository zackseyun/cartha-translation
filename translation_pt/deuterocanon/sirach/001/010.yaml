  text: The fear of the Lord is glory and exultation[a], and gladness and a crown of rejoicing.
translation:
  language: pt
  text: O temor do Senhor é glória e motivo de gloriar-se, e alegria e coroa de júbilo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «exultação». O grego reúne, em sequência, palavras de sentido próximo relacionadas à honra e à alegria.
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος
  choice: temor
  rationale: 'Preserva a fórmula sapiencial tradicional «temor do Senhor» e sua amplitude de sentido: medo reverente, submissão e respeito obediente.'
- source_word: κυρίου
  choice: do Senhor
  rationale: Tradução bíblica corrente e natural do genitivo, mantendo «Senhor» como título divino.
- source_word: δόξα
  choice: glória
  rationale: Conserva o peso e a ressonância bíblica do termo, que aqui comunica honra e exaltação.
- source_word: καύχημα
  choice: motivo de gloriar-se
  rationale: Expressa tanto a exultação quanto aquilo que dá legítimo motivo para alguém se gloriar, sem atribuir ao termo um sentido necessariamente pecaminoso.
- source_word: εὐφροσύνη
  choice: alegria
  rationale: É uma tradução clara e corrente para a satisfação jubilosa indicada pelo substantivo.
- source_word: στέφανος
  choice: coroa
  rationale: Preserva a imagem da coroa ou grinalda concedida como sinal de honra e vitória.
- source_word: ἀγαλλιάματος
  choice: de júbilo
  rationale: Qualifica a coroa por uma alegria intensa e mantém a acumulação poética de termos ligados à honra e à alegria.
theological_decisions:
- issue: Tradução da fórmula sapiencial φόβος κυρίου
  choice: O temor do Senhor
  alternative: A reverência ao Senhor
  rationale: A tradução tradicional é compreensível e preserva a tensão do idioma bíblico, que inclui reverência, humilde submissão e consciência da majestade divina.
- issue: Sentido positivo de καύχημα
  choice: motivo de gloriar-se
  alternative: exultação
  rationale: O contexto apresenta o termo positivamente. A formulação escolhida preserva a ideia lexical de gloriar-se sem introduzir a conotação exclusivamente negativa que «orgulho» poderia ter.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a fórmula bíblica tradicional «temor do Senhor» e a estrutura poética cumulativa do grego.
