  text: Desire wisdom, keep the commandments, and the Lord will supply her[b][a] to you.
translation:
  language: pt
  text: Deseje a sabedoria, guarde os mandamentos, e o Senhor a concederá a você.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A linha hebraica preservada e fornecida para este versículo não corresponde a Sirácida 1:25; por isso, a tradução segue aqui o testemunho grego.
    reason: textual_variant
  - marker: b
    text: 'Ou: “Se você deseja a sabedoria, guarde os mandamentos, e o Senhor a concederá a você.” O particípio inicial também pode ser entendido em sentido condicional.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιθυμήσας
  choice: Deseje
  rationale: Como o hebraico fornecido não corresponde a Sirácida 1:25, o grego é aqui a base efetiva. O particípio aoristo pode ter valor condicional, mas, nesta sequência exortativa, o imperativo comunica o sentido com naturalidade.
- source_word: σοφίαν
  choice: a sabedoria
  rationale: Equivalente consagrado e natural; a retomada por pronome feminino preserva a personificação presente no contexto sapiencial.
- source_word: διατήρησον
  choice: guarde
  rationale: Em relação aos mandamentos, 'guardar' expressa observância fiel e mantém a dicção bíblica sem ser obscuro.
- source_word: ἐντολάς
  choice: os mandamentos
  rationale: Expressão religiosa corrente e específica, mais adequada que o termo genérico 'ordens'.
- source_word: Κύριος
  choice: o Senhor
  rationale: Forma portuguesa tradicional e natural para κύριος neste contexto.
- source_word: χορηγήσει
  choice: concederá
  rationale: Transmite a provisão generosa indicada pelo verbo e soa mais natural em português do que uma reprodução rígida como 'suprirá'.
- source_word: σοι
  choice: a você
  rationale: Torna explícito o destinatário do verbo, com clareza e ampla legibilidade internacional e brasileira.
- source_word: αὐτήν
  choice: a
  rationale: O pronome feminino retoma 'sabedoria', preservando seu gênero e sua personificação sem produzir uma formulação artificial em português.
theological_decisions:
- issue: Seleção da fonte primária para este versículo
  choice: Traduzir o paralelo grego, pois o hebraico fornecido não corresponde a Sirácida 1:25.
  alternative: Traduzir como pertencente a este versículo a linha hebraica sobre os anjos de Deus.
  rationale: A linha hebraica apresentada contém outro conteúdo, enquanto o testemunho grego corresponde ao versículo identificado. A incerteza textual é informada em nota, sem disfarçar a mudança de testemunho-base.
- issue: Referência feminina à sabedoria
  choice: Retomar 'sabedoria' pelo pronome feminino 'a'.
  alternative: Empregar uma retomada neutra ou repetir o substantivo.
  rationale: A escolha preserva a personificação feminina do texto sapiencial e é gramaticalmente natural em português.
- issue: Valor do particípio inicial
  choice: 'Vertê-lo como exortação: ''Deseje''.'
  alternative: 'Vertê-lo condicionalmente: ''Se você deseja''.'
  rationale: Ambas as leituras são possíveis; o imperativo se integra melhor à sequência de exortações, e a alternativa legítima é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. 'Guarde os mandamentos' conserva a linguagem bíblica corrente; 'concederá' evita o pouco natural 'suprirá' e mantém a ideia de provisão generosa. Os marcadores seguem a ordem normal de leitura.
