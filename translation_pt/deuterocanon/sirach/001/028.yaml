  text: Do not be hypocritical in the mouths of men[a], and watch your lips.
translation:
  language: pt
  text: Não seja hipócrita diante das pessoas[a] e tenha cuidado com seus lábios.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, o grego diz «nas bocas das pessoas»; também pode ser entendido como «entre as pessoas».
    reason: lexical_alternative
  - marker: b
    text: 'A linha hebraica preservada no testemunho fornecido diz: «Ouça todas as minhas palavras e ponha-as em prática, e você será inscrito no livro da vida». Como ela parece não corresponder a este versículo, a tradução segue aqui o texto grego.'
    reason: textual_variant
lexical_decisions:
- source_word: μὴ ὑποκριθῇς
  choice: Não seja hipócrita
  rationale: A forma de ὑποκρίνομαι adverte contra a hipocrisia ou a dissimulação. A formulação é direta, atual e conserva a força ética do imperativo negativo.
- source_word: ἐν στόμασιν ἀνθρώπων
  choice: diante das pessoas
  rationale: Embora a expressão grega diga literalmente «nas bocas das pessoas», o sentido contextual provável é a conduta perante outras pessoas. A tradução idiomática evita em português uma imagem obscura, enquanto a nota preserva a forma literal e a ambiguidade.
- source_word: καὶ
  choice: e
  rationale: A conjunção coordena de modo simples as duas advertências paralelas.
- source_word: ἐν τοῖς χείλεσί σου πρόσεχε
  choice: vigie os seus lábios
  rationale: A expressão recomenda cuidado com a própria fala. «Vigie» comunica bem πρόσεχε, e «os seus lábios» preserva a imagem corporal do grego.
theological_decisions:
- issue: Seleção do texto-base diante da grande divergência entre o testemunho hebraico e o grego
  choice: Traduzir o texto grego neste versículo e registrar em nota a linha hebraica divergente.
  alternative: 'Traduzir a linha hebraica preservada: «Ouça todas as minhas palavras e ponha-as em prática, e você será inscrito no livro da vida.»'
  rationale: A linha hebraica fornecida não corresponde ao conteúdo de Sirácida 1:28 atestado no grego e está identificada como uma divergência grave, provavelmente pertencente a outro contexto. O grego constitui, portanto, a base textual mais defensável para este versículo, sem ocultar a evidência hebraica.
translation_notes:
  register: Português atual, digno e de leitura ampla, com tratamento por «você» implícito nas formas verbais e no possessivo. A primeira expressão foi vertida idiomaticamente, e sua forma grega incomum foi preservada em nota; a segunda mantém a imagem dos lábios.
