translation:
  language: pt
  text: Ele a examinou, a viu e a enumerou[a], e a deu aos que o amam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego paralelo traz uma redação bem diferente: “Há um só que é sábio, muito temível, sentado em seu trono.” O hebraico preservado aqui difere substancialmente da tradição grega.'
    reason: textual_variant
lexical_decisions:
- source_word: בְחָנָהּ
  choice: a examinou
  rationale: בחן expressa provar ou examinar. “Examinou” comunica com clareza a avaliação da sabedoria sem acrescentar uma interpretação não exigida pelo hebraico.
- source_word: וְרָאָהּ
  choice: a viu
  rationale: ראה significa diretamente “ver”. A formulação simples preserva o estilo compacto e a sequência verbal do hebraico.
- source_word: וְסְפָרָהּ
  choice: a contou
  rationale: ספר, nesta forma, significa contar ou enumerar. “Contou” conserva a imagem de uma sabedoria plenamente quantificada, embora ela seja incomum em português.
- source_word: וּנְתָנָהּ
  choice: a deu
  rationale: נתן é o verbo comum para “dar”. A opção mantém a expressão direta do original.
- source_word: לְאֹהֲבָיו
  choice: aos que o amam
  rationale: 'O sufixo é masculino singular e aponta mais naturalmente para Deus, sujeito implícito: aqueles que o amam.'
- source_word: sufixos femininos הּ
  choice: a
  rationale: Os pronomes femininos retomam a sabedoria, substantivo feminino personificado no contexto. Em português, o clítico “a” preserva o gênero gramatical sem forçar uma personificação além do texto.
theological_decisions:
- issue: Relação entre a linha hebraica e o testemunho grego, que apresenta um texto substancialmente diferente sobre o único sábio sentado em seu trono
  choice: Traduzir no texto principal o hebraico preservado e registrar em nota a divergência substancial do grego
  alternative: 'Adotar no texto principal a leitura grega: “Há um só que é sábio, grandemente temível, sentado em seu trono.”'
  rationale: O hebraico preservado é coerente e traduzível, devendo servir como texto principal. Como o grego testemunha outra redação, a diferença é explicitada para não ocultar a incerteza textual.
- issue: Referente do pronome em “aos que o amam”
  choice: Entender o sufixo masculino singular como referência a Deus, sujeito implícito
  alternative: 'Entender por sentido que se refere à sabedoria: “aos que a amam”'
  rationale: A forma hebraica é masculina singular, e não feminina. “O amam” preserva esse dado gramatical e evita harmonizá-lo silenciosamente com “sabedoria”.
translation_notes:
  register: Português moderno, digno e direto, com boa legibilidade brasileira e compreensão internacional. A repetição dos pronomes e dos verbos conserva o ritmo compacto do hebraico; “a contou” é deliberadamente literal para preservar a imagem do original.
