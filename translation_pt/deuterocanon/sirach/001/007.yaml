  source_fidelity: 'O texto principal segue corretamente o hebraico preservado: o sujeito implícito examina, vê, enumera e dá a figura feminina, isto é, a sabedoria. «Aos que o amam» preserva apropriadamente o sufixo masculino singular, sem o harmonizar com a sabedoria. A nota assinala de modo adequado a divergência material do testemunho grego.'
