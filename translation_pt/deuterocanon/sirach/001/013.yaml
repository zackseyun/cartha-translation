  text: One who fears Yahweh—his end will be good[a]; and at the end of his days he will be blessed.
translation:
  language: pt
  text: Quem teme o SENHOR — seu fim será bom[a]; e, no fim de seus dias, será abençoado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego deste versículo difere substancialmente: “O princípio da sabedoria é temer o Senhor, e, com os fiéis, ela foi criada com eles no ventre.” O texto principal segue o testemunho hebraico preservado; a leitura grega é registrada por causa dessa divergência textual.'
    reason: textual_variant
lexical_decisions:
- source_word: יְרֵא יְהֹוָה
  choice: Quem teme o SENHOR
  rationale: O particípio hebraico funciona como substantivo e descreve genericamente a pessoa caracterizada pelo temor reverente a Deus. “Quem teme” é natural e inclusivo em português. O nome divino é vertido como “SENHOR”, em continuidade com a tradição judaica de reverência e com o padrão da Septuaginta.
- source_word: תִּיטַב אַחֲרִיתוֹ
  choice: terá um bom fim
  rationale: A expressão associa o verbo טוב a אַחֲרִית, indicando que o desfecho da pessoa será bom. A formulação conserva o foco hebraico no resultado final sem restringi-lo à prosperidade material.
- source_word: וּבְאַחֲרִית יָמָיו
  choice: e no fim de seus dias
  rationale: A tradução mantém a concretude temporal da expressão e a repetição de “fim”, que liga as duas partes do paralelismo hebraico.
- source_word: יִתְבָּרָךְ
  choice: será abençoado
  rationale: A forma verbal pode ter valor passivo ou reflexivo; neste contexto, o sentido passivo se ajusta melhor ao paralelismo com o bom desfecho, sem explicitar quem concede ou pronuncia a bênção.
theological_decisions:
- issue: Relação entre o texto hebraico preservado e o paralelo grego substancialmente diferente
  choice: Traduzir o testemunho hebraico no texto principal e registrar a divergência grega em nota.
  alternative: Adotar o texto grego como principal ou combinar os dois testemunhos.
  rationale: O hebraico está preservado com alta confiança e deve orientar a tradução de Sirácida onde existe. Como o grego apresenta conteúdo diferente, a nota conserva a evidência textual sem harmonização nem ocultação da tensão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A construção genérica “Quem teme” evita marcação masculina desnecessária. A repetição de “fim” foi mantida para refletir o paralelismo lexical do hebraico.
