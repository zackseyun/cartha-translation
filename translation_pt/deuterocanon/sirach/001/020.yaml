translation:
  language: pt
  text: Suas raízes permanecem para sempre, e seus ramos são longevidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz: “Um homem irado não poderá ser justificado.” As testemunhas hebraica e grega divergem substancialmente neste versículo.'
    reason: textual_variant
lexical_decisions:
- source_word: שָׁרְשֶׁיהָ
  choice: suas raízes
  rationale: O substantivo שֹׁרֶשׁ, com sufixo de terceira pessoa feminina singular, retoma um antecedente feminino no contexto. Em português, “suas” preserva naturalmente a referência e a imagem vegetal.
- source_word: לְעוֹלָם
  choice: permanecem para sempre
  rationale: לְעוֹלָם expressa duração permanente. O acréscimo contextual de “permanecem” torna a oração natural em português sem alterar seu sentido.
- source_word: וַעֲנָפֶיהָ
  choice: e seus ramos
  rationale: עָנָף designa ramo ou galho. “Ramos” é claro, digno e mantém o paralelismo botânico com “raízes”.
- source_word: אֹרֶךְ יָמִים
  choice: longevidade
  rationale: A expressão literalmente significa “extensão de dias” e funciona como expressão idiomática para vida longa. “Longevidade” conserva o sentido com naturalidade e concisão poética.
theological_decisions:
- issue: Divergência substancial entre o hebraico preservado e o paralelo grego em Sirácida 1:20
  choice: Traduzir no texto principal o dístico poético hebraico preservado.
  alternative: 'Seguir o grego: “Um homem irado não poderá ser justificado.”'
  rationale: A evidência hebraica existente recebe prioridade, mas a leitura grega constitui uma frase inteiramente diferente, não uma simples variação verbal. A nota registra a instabilidade da tradição textual sem harmonizar artificialmente as testemunhas.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A formulação mantém o paralelismo poético e a metáfora vegetal do hebraico; “longevidade” comunica de modo natural a expressão idiomática אֹרֶךְ יָמִים.
