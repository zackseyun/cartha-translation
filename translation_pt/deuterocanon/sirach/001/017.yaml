  text: All her storehouses she fills with delight[b][a], and her granaries with her produce.
translation:
  language: pt
  text: Ela enche todos os seus depósitos de coisas preciosas[a][b] e os seus celeiros com a sua produção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O hebraico diz: “Ela enche todos os seus depósitos de coisas preciosas e os seus celeiros com a sua produção.” O testemunho grego traz, em vez disso: “A coroa da sabedoria é temer o Senhor, fazendo florescer paz e saúde restauradora.”'
    reason: textual_variant
  - marker: b
    text: Ou “de coisas desejáveis”, “de coisas agradáveis” ou “de deleite”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אוֹצָרֶיהָ
  choice: todos os seus depósitos
  rationale: אוֹצָר pode indicar tesouro, depósito ou armazém. O paralelismo com אֲסָמֶיהָ favorece o sentido concreto de locais de armazenamento; o plural e כָּל são reproduzidos diretamente.
- source_word: תְּמַלֵּא
  choice: ela enche
  rationale: O imperfeito hebraico é entendido como presente habitual ou proverbial, adequado ao discurso sapiencial. O pronome explicita a Sabedoria personificada sem mudar o referente feminino.
- source_word: חֶמְדָּה
  choice: coisas preciosas
  rationale: חֶמְדָּה abrange aquilo que é desejável, agradável ou precioso. No contexto de depósitos cheios, a formulação concreta e plural soa natural em português, sem excluir a ideia de deleite ou desejabilidade.
- source_word: וַאֲסָמֶיהָ
  choice: e os seus celeiros
  rationale: אָסָם designa celeiro ou armazém de cereais. “Celeiros” conserva a imagem agrícola e distingue o termo dos depósitos da primeira oração.
- source_word: בִּתְבוּאָתָהּ
  choice: com a sua produção
  rationale: תְּבוּאָה pode significar produção, colheita ou rendimento da terra. “Produção” mantém o sentido amplo, e o possessivo feminino acompanha a personificação da Sabedoria.
- source_word: στέφανος σοφίας
  choice: não adotado no texto principal
  rationale: O grego apresenta uma linha substancialmente diferente, começando com “A coroa da sabedoria”. Como o hebraico está preservado e tem prioridade neste trecho de Sirácida, ele rege o texto principal; a leitura grega é registrada em nota.
theological_decisions:
- issue: Divergência substancial entre os testemunhos hebraico e grego de Sirácida 1:17
  choice: Traduzir o hebraico preservado no texto principal
  alternative: 'Seguir o grego: “A coroa da sabedoria é temer o Senhor, fazendo florescer paz e saúde restauradora.”'
  rationale: A prioridade dada ao hebraico preservado em Sirácida recomenda usá-lo como texto principal. Como o grego não é uma simples variação de palavras, mas uma tradição textual diferente, a divergência é mantida visível em nota, sem harmonização.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A ordem “Ela enche todos os seus depósitos” evita a rigidez da sintaxe hebraica, preservando sujeito, totalidade e imagem concreta. As notas mantêm tanto a amplitude lexical de חֶמְדָּה quanto a forte divergência do testemunho grego.
