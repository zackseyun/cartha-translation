  text: It makes instruction shine forth like light[b][a], like the Gihon in the days of the grape harvest.
translation:
  language: pt
  text: Ela[a] faz a instrução resplandecer como a luz, como o Giom nos dias da colheita das uvas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “Aquele que faz a instrução resplandecer como a luz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐκφαίνων
  choice: Ela faz ... resplandecer
  rationale: O particípio articular retoma, no contexto, a Lei mencionada no versículo 23. Como “lei” é feminino em português, o pronome “ela” mantém esse referente e evita sugerir, sem base suficiente, um novo sujeito pessoal.
- source_word: ὡς φῶς
  choice: como a luz
  rationale: Preserva de modo natural a comparação explícita introduzida por ὡς no texto grego.
- source_word: παιδείαν
  choice: a instrução
  rationale: No contexto sapiencial, παιδεία designa formação ou ensino que molda a pessoa; “instrução” é claro e não restringe o sentido à punição.
- source_word: ὡς Γηὼν
  choice: como o Giom
  rationale: Emprega a forma portuguesa tradicional do nome do rio e o artigo definido natural em português.
- source_word: ἐν ἡμέραις τρυγητοῦ
  choice: nos dias da colheita das uvas
  rationale: τρυγητός se refere especificamente à vindima; a formulação escolhida é transparente para leitores atuais e conserva a imagem agrícola.
theological_decisions:
- issue: Referente de ὁ ἐκφαίνων
  choice: “Ela”, retomando a Lei do contexto anterior
  alternative: “Aquele que”, mantendo a forma substantivada do particípio sem explicitar o antecedente
  rationale: A sequência contextual descreve a Lei ordenada por Moisés. A tradução pronominal oferece leitura natural em português sem transformar o sujeito em Deus ou em outra figura pessoal; a nota preserva a forma mais estrita e a possível ambiguidade percebida quando o versículo é lido isoladamente.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Resplandecer” conserva a força imagética do verbo sem soar excessivamente técnico; “colheita das uvas” é preferível ao menos corrente “vindima” no texto principal.
