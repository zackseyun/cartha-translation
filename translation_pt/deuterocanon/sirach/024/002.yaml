lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: assembleia
  rationale: Designa a comunidade reunida; “assembleia” é natural, neutro e evita a leitura anacrônica de “igreja”.
- source_word: Ὑψίστου
  choice: Altíssimo
  rationale: É a forma consagrada e natural em português para o título divino Ὕψιστος.
- source_word: στόμα αὐτῆς ἀνοίξει
  choice: ela abrirá a boca
  rationale: Mantém tanto o futuro quanto a imagem concreta do idioma grego para começar a falar, além de preservar a personificação feminina.
- source_word: ἔναντι
  choice: diante de
  rationale: Expressa de modo conciso a ideia de estar na presença de alguém ou de algo.
- source_word: δυνάμεως αὐτοῦ
  choice: do poder dele
  rationale: “Poder” traduz diretamente o sentido comum de δύναμις sem impor a interpretação coletiva de “hoste”; uma nota preserva as alternativas “força” e “hoste”.
- source_word: καυχήσεται
  choice: se gloriará
  rationale: Reproduz o sentido de gloriar-se ou exultar com registro digno; evita a conotação predominantemente negativa que “se gabará” costuma ter em português moderno.
theological_decisions:
- issue: Referente do pronome feminino
  choice: Manter “ela” no texto principal
  alternative: Explicitar “a Sabedoria”
  rationale: O contexto identifica a personagem como a Sabedoria personificada, mas este versículo não repete o substantivo; o pronome preserva a forma e a continuidade do grego sem acrescentar uma identificação ao texto principal.
- issue: Sentido de δύναμις
  choice: poder
  alternative: força; hoste
  rationale: O termo pode indicar poder ou força e, em certos contextos da Septuaginta, uma força organizada ou hoste. O texto principal conserva o sentido lexical mais direto, enquanto as notas mantêm aberta a leitura coletiva ligada à corte celestial.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. “Assembleia” evita anacronismo; “se gloriará” conserva o peso retórico de καυχήσεται sem soar coloquial ou necessariamente censurável.
