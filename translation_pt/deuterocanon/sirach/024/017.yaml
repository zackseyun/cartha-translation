  text: I[a], like a vine, put forth grace[c][b], and my blossoms are the fruit of glory and wealth.
translation:
  language: pt
  text: Eu, como a videira, fiz brotar graça[a], e as minhas flores são fruto de glória e riqueza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “beleza”, “favor” ou “encanto”. O termo grego reúne sentidos estéticos e benéficos neste contexto poético.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser entendida de modo mais idiomático como “minhas flores dão fruto glorioso e rico” ou “fruto marcado por glória e riqueza”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ
  choice: Eu
  rationale: Mantém o pronome explícito e enfático da autodescrição da Sabedoria personificada.
- source_word: ὡς ἄμπελος
  choice: como a videira
  rationale: Preserva de modo natural a comparação e a imagem botânica.
- source_word: βλαστήσασα
  choice: fiz brotar
  rationale: Expressa a ação de produzir brotos ou fazer surgir algo, mantendo o valor botânico do particípio e sua relação transitiva com χάριν.
- source_word: χάριν
  choice: graça
  rationale: Conserva a amplitude poética de χάρις, que pode envolver beleza, encanto e favor benéfico.
- source_word: τὰ ἄνθη μου
  choice: as minhas flores
  rationale: Tradução direta e corrente; integra-se claramente à metáfora da videira.
- source_word: καρπὸς
  choice: fruto
  rationale: Preserva o singular predicativo grego sem a formulação pouco natural 'um fruto'.
- source_word: δόξης
  choice: glória
  rationale: Mantém o registro elevado e a amplitude entre glória, esplendor e honra.
- source_word: πλούτου
  choice: riqueza
  rationale: Equivalente direto de πλοῦτος, adequado ao paralelismo com 'glória'.
theological_decisions:
- issue: Sentido de χάριν na autodescrição poética da Sabedoria
  choice: graça
  alternative: beleza, favor ou encanto
  rationale: '''Graça'' preserva tanto a qualidade atraente quanto a dimensão benéfica do termo, sem limitar a imagem à beleza física nem impor uma acepção teológica posterior.'
- issue: Relação entre flores, fruto, glória e riqueza
  choice: as minhas flores são fruto de glória e riqueza
  alternative: as minhas flores dão fruto glorioso e rico
  rationale: A formulação escolhida acompanha de perto a construção nominal grega e preserva sua tensão poética; a alternativa é mais idiomática, mas interpreta os genitivos como qualificativos.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação poética. A metáfora botânica e a construção predicativa incomum do grego foram preservadas sem tornar a frase obscura.
