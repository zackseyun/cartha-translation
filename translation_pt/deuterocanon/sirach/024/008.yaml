base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/008.yaml
  text: Then the Creator of all commanded me[a], and the one who created me pitched my tent and said, “Dwell in Jacob[c][b], and receive your inheritance in Israel.”
translation:
  language: pt
  text: 'Então o Criador de todas as coisas me ordenou, e aquele que me criou armou a minha tenda[a] e disse: “Habite em Jacó e receba a sua herança em Israel[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estabeleceu a minha morada”. O grego emprega a imagem concreta de fixar ou armar uma tenda.
    reason: lexical_alternative
  - marker: b
    text: Ou “seja estabelecida por herança em Israel” ou “herde em Israel”. O verbo grego reúne ideias de herança, posse e atribuição de uma porção.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Reproduz de modo natural o valor temporal e sequencial do advérbio grego.
- source_word: ἐνετείλατό μοι
  choice: me ordenou
  rationale: Expressa diretamente a ordem divina indicada por ἐντέλλομαι, em linguagem atual e digna.
- source_word: ὁ κτίστης ἁπάντων
  choice: o Criador de todas as coisas
  rationale: Preserva o alcance universal de ἁπάντων e soa mais explícito e natural em português do que a formulação elíptica “Criador de tudo” neste registro.
- source_word: ὁ κτίσας με
  choice: aquele que me criou
  rationale: Mantém o paralelismo com “o Criador” e a referência pessoal da Sabedoria ao seu criador.
- source_word: κατέπηξεν τὴν σκηνήν μου
  choice: armou a minha tenda
  rationale: Conserva a imagem concreta de fixar ou montar uma tenda, sem substituí-la por linguagem cultual mais interpretativa.
- source_word: Ἐν Ἰακὼβ κατασκήνωσον
  choice: Habite em Jacó
  rationale: κατασκηνόω pode significar acampar, estabelecer-se ou habitar. “Habite” é natural em português e mantém a ideia de residência, enquanto “Jacó” preserva a metonímia bíblica para o povo.
- source_word: κατακληρονομήθητι
  choice: receba a sua herança
  rationale: Comunica a imagem de herança e a noção de algo atribuído ou recebido, sem forçar uma interpretação única do passivo grego.
- source_word: ἐν Ἰσραήλ
  choice: em Israel
  rationale: Mantém a preposição e o paralelismo poético entre Jacó e Israel.
theological_decisions:
- issue: A relação da Sabedoria personificada com Deus
  choice: Manter a Sabedoria como voz pessoal criada por Deus e sujeita à sua ordem.
  alternative: Tornar a Sabedoria uma abstração impessoal ou identificar explicitamente a figura com uma categoria doutrinária posterior.
  rationale: O grego combina personificação vívida com uma distinção explícita entre o Criador e a Sabedoria criada. A tradução conserva essa tensão sem acrescentar uma identificação teológica não expressa no versículo.
- issue: Imagem da tenda e possível ressonância cultual
  choice: Traduzir concretamente por “armou a minha tenda”.
  alternative: Empregar “estabeleceu o meu tabernáculo”.
  rationale: “Tenda” representa diretamente σκηνή e permite que a ressonância de habitação permaneça disponível sem impor terminologia cultual ou eclesiástica.
- issue: Sentido passivo e distributivo de κατακληρονομήθητι
  choice: Traduzir por “receba a sua herança”, com nota sobre a imagem de atribuição.
  alternative: “Seja dada como herança em Israel” ou “herde em Israel”.
  rationale: A forma grega admite nuances de herança, posse e atribuição. A redação escolhida é compreensível e preserva o campo semântico, enquanto a nota registra a ambiguidade relevante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação pronominal e o uso de “sua” evitam arcaísmo excessivo; as imagens concretas e o paralelismo do grego foram preservados.
