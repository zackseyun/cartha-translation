  text: See that I have not labored for myself alone[a], but for all who seek her.
translation:
  language: pt
  text: Vejam que não trabalhei apenas para mim, mas para todos os que a buscam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδετε
  choice: Vejam que
  rationale: O imperativo plural apela aos ouvintes para que reconheçam a afirmação seguinte; “Vejam que” preserva essa força exortativa em português natural.
- source_word: οὐκ ἐμοὶ μόνῳ
  choice: não ... apenas para mim
  rationale: 'O dativo indica benefício ou interesse: o trabalho não foi realizado exclusivamente em proveito do próprio autor.'
- source_word: ἐκοπίασα
  choice: trabalhei
  rationale: O aoristo apresenta a ação como realizada. “Trabalhei” é natural em português e comunica o esforço sem tornar a expressão excessivamente enfática.
- source_word: ἀλλὰ πᾶσι
  choice: mas para todos
  rationale: Mantém o contraste direto entre o benefício pessoal e o benefício oferecido ao grupo inteiro definido em seguida.
- source_word: τοῖς ἐκζητοῦσιν
  choice: os que ... buscam
  rationale: “Buscam” expressa adequadamente a procura intencional própria do discurso sapiencial, sem explicitar uma intensidade que o contexto não exige.
- source_word: αὐτήν
  choice: a
  rationale: O pronome feminino retoma a Sabedoria personificada no capítulo; o clítico português preserva o referente feminino de modo natural.
theological_decisions:
- issue: Referente e gênero de αὐτήν no discurso sobre a sabedoria
  choice: Traduzir pelo pronome feminino “a”, em referência à Sabedoria personificada
  alternative: Usar uma formulação neutra ou repetir “a sabedoria”
  rationale: Sirácida 24 apresenta a Sabedoria como figura feminina que fala. O pronome feminino conserva essa personificação literária e teológica sem acrescentar uma identificação não declarada pelo texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O plural “Vejam” mantém o destinatário coletivo; “apenas para mim” soa mais corrente do que construções mais literais, sem perder a ideia de benefício.
