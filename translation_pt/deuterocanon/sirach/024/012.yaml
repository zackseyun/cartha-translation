  text: And I took root among a glorified people[a], in the portion of the Lord[b], his inheritance.
translation:
  language: pt
  text: E criei raízes no meio de um povo glorificado[a], na porção do Senhor, sua herança[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no meio de um povo glorioso”. O particípio grego também pode ser entendido de modo mais adjetival, embora o texto preserve sua força verbal e resultativa.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “na porção do Senhor, sua herança” também pode ser traduzida como “na porção da herança do Senhor” ou “na herança atribuída ao Senhor”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρρίζωσα
  choice: criei raízes
  rationale: O aoristo ativo na primeira pessoa indica que a Sabedoria se estabeleceu como quem lança raízes. A expressão é idiomática em português e preserva a imagem e o sentido ativo do grego.
- source_word: λαῷ
  choice: povo
  rationale: λαός designa uma coletividade e frequentemente traz uma nuance comunitária ou pactual. “Povo” corresponde melhor ao singular coletivo do que “nação”.
- source_word: δεδοξασμένῳ
  choice: glorificado
  rationale: 'O particípio perfeito passivo de δοξάζω expressa um estado resultante: o povo foi revestido de glória ou honra. “Glorificado” conserva essa força verbal, sem reduzi-la a uma qualidade inerente.'
- source_word: μερίδι
  choice: porção
  rationale: μερίς denota uma parte ou quota atribuída. “Porção” mantém a ideia de repartição e sua relação semântica com a herança.
- source_word: Κυρίου
  choice: Senhor
  rationale: Tradução tradicional e clara de Κύριος neste contexto, usada como designação divina.
- source_word: κληρονομίας
  choice: herança
  rationale: κληρονομία indica herança, patrimônio ou posse recebida por atribuição. “Herança” preserva tanto o sentido familiar quanto o de território ou bem destinado a alguém.
theological_decisions:
- issue: Se δεδοξασμένῳ deve ser traduzido como simples adjetivo ou com sua força verbal e resultativa.
  choice: povo glorificado
  alternative: povo glorioso; povo honrado
  rationale: A forma grega é um particípio perfeito passivo. “Glorificado” conserva a ideia de que a glória foi conferida ao povo e evita apresentá-la necessariamente como qualidade inerente.
- issue: Como entender a construção compacta ἐν μερίδι Κυρίου κληρονομίας αὐτοῦ.
  choice: na porção do Senhor, sua herança
  alternative: na porção da herança do Senhor; na herança atribuída ao Senhor
  rationale: A formulação principal preserva a possível relação de aposição entre “porção” e “herança”, sem resolver além do necessário a sintaxe condensada do grego. A nota registra construções possessivas igualmente possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Criei raízes” comunica a metáfora grega com fluidez; a segunda metade mantém deliberadamente a concisão e a tensão sintática do original.
