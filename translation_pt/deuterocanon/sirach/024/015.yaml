base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/015.yaml
  text: Like cinnamon and aspalathus[a], I gave forth a scent of spices, and like choice myrrh I spread fragrance, like galbanum and onycha and stacte[e][d][c][b], and like the smoke of frankincense in the tabernacle.
translation:
  language: pt
  text: Como canela e aspálato[a], exalei aroma de especiarias; como mirra escolhida, espalhei fragrância; como gálbano, ônica e estacte[b]; e como fumaça de olíbano na tenda[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O aspálato era uma planta aromática, mas sua identificação exata é incerta.
    reason: cultural_note
  - marker: b
    text: Gálbano, ônica e estacte eram substâncias aromáticas usadas na preparação de incenso; a identificação exata da ônica e da estacte é discutida.
    reason: cultural_note
  - marker: c
    text: Ou “no Tabernáculo”. O grego diz literalmente “na tenda”; neste contexto de incenso, provavelmente se refere à tenda do santuário.
    reason: lexical_alternative
lexical_decisions:
- source_word: κιννάμωμον
  choice: canela
  rationale: É o equivalente comum e reconhecível do nome grego da especiaria; evita a alternativa menos provável “cássia”.
- source_word: ἀσπάλαθος
  choice: aspálato
  rationale: A identificação botânica é incerta. A transliteração portuguesa preserva a referência específica sem impor precisão indevida.
- source_word: ἀρωμάτων
  choice: de especiarias
  rationale: 'O genitivo qualifica naturalmente ὀσμήν: trata-se de um aroma de substâncias aromáticas ou especiarias.'
- source_word: δέδωκα ὀσμήν
  choice: exalei aroma
  rationale: Expressa de modo natural e poeticamente digno a ideia de produzir ou emitir cheiro.
- source_word: σμύρνα ἐκλεκτή
  choice: mirra escolhida
  rationale: Preserva o sentido de algo selecionado ou de qualidade especial sem intensificá-lo para “a melhor mirra”.
- source_word: διέδωκα εὐωδίαν
  choice: espalhei fragrância
  rationale: Mantém o verbo distributivo e comunica o odor agradável de εὐωδία sem acrescentar desnecessariamente “doce”.
- source_word: χαλβάνη
  choice: gálbano
  rationale: É o nome português tradicional da resina aromática e corresponde ao vocabulário bíblico do incenso.
- source_word: ὄνυξ
  choice: ônica
  rationale: Neste catálogo de incenso, designa o ingrediente aromático tradicionalmente chamado ônica, não a pedra ônix.
- source_word: στακτή
  choice: estacte
  rationale: Conserva o nome específico da substância aromática em vez de substituí-lo por uma identificação incerta como “mirra líquida”.
- source_word: λίβανου ἀτμίς
  choice: fumaça de incenso
  rationale: No contexto do incenso queimado, “fumaça” é natural para ἀτμίς; “incenso” é o termo português corrente para λίβανος neste uso cultual.
- source_word: ἐν σκηνῇ
  choice: na Tenda
  rationale: Preserva o sentido lexical de σκηνή e, com inicial maiúscula no contexto cultual, permite reconhecer a Tenda sagrada sem converter silenciosamente o termo em “Tabernáculo”.
theological_decisions:
- issue: Referência cultual de σκηνή
  choice: na Tenda
  alternative: no Tabernáculo
  rationale: A enumeração das substâncias do incenso aponta para o santuário, mas σκηνή significa literalmente “tenda”. A tradução mantém a tensão lexical e uma nota esclarece a referência provável.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético. Mantêm-se nomes aromáticos específicos e pouco familiares, explicados em notas. “Tenda” preserva a formulação grega e a provável alusão cultual é sinalizada pela inicial maiúscula e pela nota.
