base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/006.yaml
  text: In the waves of the sea and in all the earth[a], and among every people and nation[b], I gained possession.
translation:
  language: pt
  text: Nas ondas do mar e em toda a terra, e entre todos os povos e nações, tomei posse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «adquiri» ou «obtive para mim». O verbo grego não declara o objeto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν κύμασιν θαλάσσης
  choice: Nas ondas do mar
  rationale: Preserva a imagem concreta e o valor locativo da expressão grega em linguagem portuguesa natural.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: em toda a terra
  rationale: Neste encadeamento de alcance universal, γῆ é melhor entendido como «terra», e não apenas como uma região ou território.
- source_word: ἐν παντὶ λαῷ καὶ ἔθνει
  choice: entre todos os povos e nações
  rationale: «Entre» expressa naturalmente a atuação no meio das coletividades humanas; a formulação plural comunica em português o alcance distributivo de παντί.
- source_word: ἐκτησάμην
  choice: tomei posse
  rationale: A expressão idiomática traduz o sentido de adquirir ou alcançar posse sem inventar um objeto específico, que permanece implícito no grego.
theological_decisions:
- issue: Objeto implícito de ἐκτησάμην
  choice: Manter o objeto não expresso em «tomei posse»
  alternative: «adquiri uma possessão» ou «eu os adquiri»
  rationale: O grego não declara o que a Sabedoria adquiriu. A tradução mantém essa abertura e evita identificar indevidamente a terra, os povos ou algum domínio como objeto explícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Ondas» é corrente e concreto; «tomei posse» conserva a força do verbo sem resolver sua ambiguidade sintática.
