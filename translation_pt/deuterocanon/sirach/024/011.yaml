  text: In the beloved city likewise he gave me rest[b][a], and in Jerusalem was my authority.
translation:
  language: pt
  text: Na cidade amada, do mesmo modo, ele me deu repouso[a], e em Jerusalém estava a minha autoridade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sujeito de “ele me deu repouso” está implícito no grego. O contexto aponta para Deus, mas este versículo não o nomeia expressamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: πόλει ἠγαπημένῃ
  choice: cidade amada
  rationale: O particípio perfeito passivo ἠγαπημένῃ funciona como adjetivo e significa “amada”. A expressão preserva o tom elevado e aponta naturalmente para Jerusalém, nomeada na oração seguinte.
- source_word: ὁμοίως
  choice: do mesmo modo
  rationale: Mantém a ideia de correspondência ou continuidade com o que precede, em português natural e digno.
- source_word: κατέπαυσεν
  choice: me deu repouso
  rationale: O verbo καταπαύω pode indicar fazer repousar, dar descanso ou estabelecer. “Deu repouso” conserva a imagem do descanso sem reduzir o sentido apenas a habitação ou instalação.
- source_word: ἐξουσία
  choice: autoridade
  rationale: ἐξουσία designa autoridade, direito ou poder legítimo. “Autoridade” preserva o caráter abstrato do substantivo sem transformá-lo necessariamente em território ou domínio.
theological_decisions:
- issue: Sujeito implícito de κατέπαυσεν
  choice: Mantido como “ele”, sem identificar expressamente o sujeito.
  alternative: “Deus me deu repouso” ou “o Senhor me estabeleceu”
  rationale: A forma verbal grega pressupõe um sujeito masculino singular, e o contexto aponta para Deus, mas este versículo não o nomeia. A tradução preserva essa implicitude.
- issue: Tempo da cópula elíptica na segunda oração
  choice: “estava a minha autoridade”
  alternative: “está a minha autoridade” ou “a minha autoridade”
  rationale: O grego omite a cópula. O imperfeito português acompanha naturalmente a perspectiva narrativa do aoristo κατέπαυσεν, sem negar que a frase nominal grega, isoladamente, não explicita o tempo.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Do mesmo modo” preserva a ligação com o contexto anterior; “repouso” mantém o registro sapiencial e a amplitude semântica do verbo grego.
