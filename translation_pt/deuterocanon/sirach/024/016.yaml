  text: Like a terebinth I spread out my branches[d][c][b][a], and my branches are branches of glory and grace.
translation:
  language: pt
  text: Como o terebinto, estendi os meus ramos, e os meus ramos são ramos de glória e graça.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como o terebinto, abri os meus ramos”.'
    reason: lexical_alternative
  - marker: b
    text: O terebinto é uma árvore de grande porte usada em imagens bíblicas. Algumas traduções empregam o termo mais geral “carvalho”, mas o grego designa especificamente o terebinto.
    reason: cultural_note
lexical_decisions:
- source_word: τερέβινθος
  choice: terebinto
  rationale: Preserva o nome específico da árvore presente no grego e a imagem botânica bíblica, sem generalizá-la como “carvalho”.
- source_word: ἐξέτεινα
  choice: estendi
  rationale: Expressa de modo direto e natural a ação de alongar ou projetar os ramos para fora.
- source_word: κλάδους / κλάδοι
  choice: ramos
  rationale: É o equivalente corrente e adequado ao contexto arbóreo; a repetição foi mantida para preservar a ênfase poética do grego.
- source_word: δόξης
  choice: glória
  rationale: Mantém o registro elevado e o sentido bíblico amplo de δόξα, sem restringi-lo a esplendor visual ou honra social.
- source_word: χάριτος
  choice: graça
  rationale: Preserva a amplitude de χάρις, que pode envolver graça, favor e encanto, bem como a ressonância da expressão “glória e graça”.
theological_decisions:
- issue: Autodescrição poética da Sabedoria por meio da imagem da árvore
  choice: Manter literalmente a metáfora e a repetição “meus ramos são ramos de glória e graça”.
  alternative: Parafrasear como “meus ramos são gloriosos e graciosos”.
  rationale: A construção genitiva e a repetição de κλάδοι dão força poética ao texto e deixam aberta a riqueza semântica de “glória” e “graça”, sem impor uma interpretação adjetival.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A comparação foi colocada no início para acompanhar a ordem e o ritmo poético do grego. Evitou-se “qual terebinto” por soar mais literário e menos corrente.
