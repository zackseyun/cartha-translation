  text: Wisdom will praise herself[c][b][a], and in the midst of her people she will boast.
translation:
  language: pt
  text: A Sabedoria louvará a si mesma[a][c] e, no meio do seu povo, se gloriará[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “louvará a sua alma”; neste contexto, a expressão grega pode ter sentido reflexivo: “louvará a si mesma”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “se vangloriará” ou “exultará”. O verbo grego pode indicar exaltação pública ou autoelogio, conforme o contexto.
    reason: lexical_alternative
  - marker: c
    text: 'Outra tradução possível: “A Sabedoria louvará a sua própria alma e, no meio do seu povo, se gloriará”.'
    reason: previous_rendering
lexical_decisions:
- source_word: Ἡ σοφία
  choice: A Sabedoria
  rationale: O substantivo recebe inicial maiúscula porque, ao longo do capítulo, a sabedoria é personificada como figura feminina que fala.
- source_word: αἰνέσει
  choice: louvará
  rationale: O futuro de αἰνέω significa diretamente “louvar” ou “elogiar”; “louvará” preserva o tom elevado e é natural em português.
- source_word: ψυχὴν αὐτῆς
  choice: a si mesma
  rationale: Embora literalmente signifique “a sua alma”, a expressão pode funcionar como construção reflexiva de fundo semítico. “A si mesma” comunica esse sentido com clareza sem criar uma separação artificial entre a Sabedoria e sua alma.
- source_word: ἐν μέσῳ
  choice: no meio de
  rationale: Preserva a imagem espacial e a força pública da expressão grega, mantendo linguagem corrente e digna.
- source_word: λαοῦ αὐτῆς
  choice: seu povo
  rationale: Mantém tanto o sentido normal de λαός, “povo”, como o possessivo explícito do grego.
- source_word: καυχήσεται
  choice: se gloriará
  rationale: καυχάομαι pode indicar gloriar-se, exultar ou vangloriar-se. “Se gloriará” conserva a ambiguidade entre exultação pública e autoelogio, sem impor de imediato uma conotação moral negativa.
theological_decisions:
- issue: Personificação da Sabedoria
  choice: Manter “Sabedoria” com inicial maiúscula e referências femininas
  alternative: Tratar “sabedoria” apenas como qualidade abstrata, com inicial minúscula
  rationale: A gramática grega é feminina, e o contexto apresenta a Sabedoria como personagem que fala e age. A tradução conserva essa apresentação literária e teológica sem identificar a figura com uma doutrina posterior específica.
- issue: Valor de καυχήσεται
  choice: Traduzir por “se gloriará”
  alternative: Traduzir por “se vangloriará”
  rationale: O verbo admite exultação ou autoexaltação pública. “Se gloriará” mantém melhor essa tensão, enquanto “se vangloriará” tenderia a introduzir uma avaliação negativa mais definida.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. A formulação é digna e direta; “no meio do seu povo” preserva a estrutura retórica do grego, e “a si mesma” evita o caráter artificial de uma tradução excessivamente literal.
