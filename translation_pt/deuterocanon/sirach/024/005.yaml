  text: I alone encircled the vault of heaven[c][b][a], and walked in the depths of the abysses.
translation:
  language: pt
  text: Eu, sozinha, circundei a abóbada do céu[a] e caminhei nas profundezas dos abismos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o círculo do céu». O termo grego pode indicar uma extensão circular ou uma abóbada curva.
    reason: lexical_alternative
  - marker: b
    text: Ou «na profundeza dos abismos». O grego traz «profundeza» no singular e «abismos» no plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῦρον
  choice: abóbada
  rationale: O substantivo designa algo circular ou curvo. No contexto de «do céu», «abóbada» preserva a imagem cosmológica e soa natural em português.
- source_word: ἐκύκλωσα
  choice: circundei
  rationale: O verbo κυκλόω expressa movimento ao redor ou em círculo; «circundei» mantém essa imagem sem acrescentar uma ideia de domínio.
- source_word: μόνη
  choice: Eu, sozinha
  rationale: A forma feminina singular concorda com a Sabedoria personificada e enfatiza que ela realizou a ação sem companhia. A formulação torna explícitos tanto o gênero quanto a ênfase.
- source_word: βάθει
  choice: profundezas
  rationale: Embora βάθει esteja no singular, a locução com o genitivo plural ἀβύσσων é expressa de modo mais natural em português por «nas profundezas dos abismos».
- source_word: ἀβύσσων
  choice: abismos
  rationale: O plural preserva a forma grega e o registro cósmico elevado, indicando profundidades insondáveis.
- source_word: περιεπάτησα
  choice: caminhei
  rationale: A tradução concreta preserva o sentido básico de περιπατέω e a figura poética da Sabedoria movendo-se pelas regiões cósmicas.
theological_decisions:
- issue: Identidade da voz personificada
  choice: Manter a primeira pessoa feminina em «Eu, sozinha», como fala da Sabedoria personificada.
  alternative: Interpretar a fala como declaração direta de uma hipóstase divina específica.
  rationale: O contexto literário apresenta a Sabedoria como voz feminina personificada. A tradução preserva essa caracterização sem decidir questões teológicas posteriores que o versículo, por si só, não resolve.
translation_notes:
  register: Português atual, digno e de leitura ampla, com leve elevação poética adequada ao discurso da Sabedoria. A pontuação destaca «sozinha» sem tornar a ordem artificial.
