base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/014.yaml
  text: Like a palm tree I was raised high on the shores[a], and like rose plants in Jericho; like a splendid olive tree in the plain[b], and I was raised high like a plane tree.
translation:
  language: pt
  text: Como palmeira, fui elevada nas praias e como roseiras em Jericó; como oliveira majestosa na planície, fui elevada como plátano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοῖνιξ
  choice: palmeira
  rationale: No contexto botânico, designa naturalmente uma palmeira; a forma portuguesa é clara sem especificar desnecessariamente a espécie.
- source_word: ἀνυψώθην
  choice: fui elevada
  rationale: Preserva tanto a imagem do crescimento em altura quanto a possível nuance de exaltação, sem reduzir o verbo a simples crescimento.
- source_word: αἰγιαλοῖς
  choice: nas praias
  rationale: O termo grego indica praias ou faixas litorâneas; esta tradução segue o testemunho grego preservado e soa natural em português.
- source_word: φυτὰ ῥόδου
  choice: roseiras
  rationale: Expressa com naturalidade plantas de rosas no plural; embora φυτά seja mais genérico, 'roseiras' comunica com clareza a imagem botânica.
- source_word: Ἰερειχώ
  choice: Jericó
  rationale: Forma tradicional e corrente do topônimo em português.
- source_word: ἐλαία εὐπρεπής
  choice: oliveira majestosa
  rationale: εὐπρεπής sugere beleza distinta, nobreza ou imponência; 'majestosa' preserva o tom elevado da comparação.
- source_word: πεδίῳ
  choice: na planície
  rationale: πεδίον designa terreno plano ou campo aberto; 'planície' é preciso e natural neste cenário paisagístico.
- source_word: πλάτανος
  choice: plátano
  rationale: É a identificação botânica direta do termo grego; evita confundi-lo com o sicômoro bíblico, que é outra árvore.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético preservado. O feminino de «elevada» acompanha a Sabedoria personificada no contexto. A pontuação em membros sucessivos mantém o ritmo das comparações gregas.
