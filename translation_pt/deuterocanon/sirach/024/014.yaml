review_pass:
  verdict: revise
  source_fidelity: A tradução preserva as quatro imagens botânicas, os dois usos de ἀνυψώθην («fui elevada»), os topônimos e o feminino apropriado à Sabedoria personificada. «Palmeira», «roseiras», «oliveira», «planície» e «plátano» são escolhas fiéis e naturais. «Nas praias» é uma interpretação possível e idiomática de ἐν αἰγιαλοῖς, embora o grego não tenha artigo definido e possa abranger faixas litorâneas em sentido mais amplo.
  naturalness: O paralelismo é bom, mas o ponto e vírgula imediatamente após «nas praias» separa de modo excessivo «e como roseiras em Jericó», deixando o segundo membro mais abrupto do que o necessário. A coordenação pode ser conservada com leitura mais fluente.
  terminology: A terminologia botânica e geográfica está adequada. «Oliveira majestosa» comunica bem o valor de εὐπρεπής, sem impor interpretação teológica. A nota deve evitar chamar «nas praias» de formulação literalmente exata, pois ela inclui artigo definido ausente no grego.
  issues:
  - severity: low
    issue: Pontuação do primeiro par de comparações
    rationale: O καὶ grego coordena «como palmeira ... e como roseiras em Jericó». Manter essa coordenação sem ponto e vírgula melhora a legibilidade portuguesa e preserva o paralelismo.
  - severity: low
    issue: Precisão da formulação da nota
    rationale: ἐν αἰγιαλοῖς significa literalmente «em praias» ou «em zonas/faixas litorâneas»; «nas praias» é uma boa forma idiomática da tradução, mas não reproduz literalmente a ausência de artigo.
  revised_text: Como palmeira, fui elevada nas praias e como roseiras em Jericó; como oliveira majestosa na planície, fui elevada como plátano.
  revised_footnotes:
  - marker: a
    text: O grego diz literalmente «em praias» ou «em faixas litorâneas». Alguns intérpretes propõem outro local subjacente, pois a palmeira costuma ser associada a oásis ou margens de rios; contudo, o testemunho grego preservado apoia esta referência ao litoral.
    reason: lexical_alternative
