  text: In the holy tent I ministered before him[b][a], and so I was established in Zion.
translation:
  language: pt
  text: Na tenda santa, prestei serviço sagrado diante dele, e assim fui estabelecida em Sião.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκηνῇ ἁγίᾳ
  choice: na tenda santa
  rationale: Preserva a imagem concreta de uma tenda consagrada. “Tabernáculo santo” é possível, mas é mais tradicional e menos imediatamente acessível.
- source_word: ἐνώπιον αὐτοῦ
  choice: diante dele
  rationale: Reproduz de modo natural o sentido espacial e relacional da expressão grega, sem explicitar além do contexto quem é o referente.
- source_word: ἐλειτούργησα
  choice: exerci o ministério
  rationale: Conserva a nuance de serviço sagrado ou cultual do verbo no contexto do santuário, sem atribuir explicitamente à Sabedoria um cargo sacerdotal.
- source_word: οὕτως
  choice: e assim
  rationale: Mantém a ligação entre o serviço anteriormente descrito e o estabelecimento em Sião, com fluidez em português.
- source_word: ἐστηρίχθην
  choice: fui estabelecida
  rationale: Expressa o passivo de ser firmada ou estabelecida. O feminino concorda com a Sabedoria personificada, que fala no contexto.
- source_word: Σειὼν
  choice: Sião
  rationale: É a forma portuguesa convencional e amplamente reconhecida do nome.
theological_decisions:
- issue: Nuance cultual do serviço prestado pela Sabedoria
  choice: exerci o ministério
  alternative: prestei serviço sagrado; servi
  rationale: A formulação preserva a força cultual de λειτουργέω no ambiente da tenda santa, mas não transforma a Sabedoria explicitamente em sacerdotisa nem define um ofício que o grego não nomeia.
- issue: Gênero da voz que fala
  choice: fui estabelecida
  alternative: fui estabelecido
  rationale: Embora a forma verbal grega não marque gênero, a locutora no contexto é a Sabedoria personificada; em português, o particípio exige concordância, e o feminino torna essa referência explícita sem alterar a identidade contextual da voz.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção mantém a imagem cultual da tenda e a linguagem elevada da Sabedoria personificada, evitando tanto arcaísmo excessivo quanto terminologia confessional específica.
