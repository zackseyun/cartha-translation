base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/018.yaml
  text: I am the mother of beautiful love[a], and of fear, and of knowledge, and of holy hope[b];
translation:
  language: pt
  text: Eu sou a mãe do belo amor[a], do temor[b], do conhecimento e da santa esperança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bom amor” ou “amor nobre”; o grego καλῆς pode ter força moral, além de estética.
    reason: lexical_alternative
  - marker: b
    text: Ou “reverência”; na literatura sapiencial, o grego φόβου muitas vezes indica temor reverente, especialmente diante de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ
  choice: mãe
  rationale: Mantém a metáfora familiar literal e vívida da Sabedoria personificada, sem abstraí-la como “fonte” ou “origem”.
- source_word: καλῆς
  choice: belo
  rationale: καλός pode expressar beleza, bondade e nobreza. “Belo” conserva a força poética e deixa que a nota registre as nuances morais possíveis.
- source_word: ἀγάπης
  choice: amor
  rationale: É o equivalente direto e natural de ἀγάπη neste contexto.
- source_word: φόβου
  choice: temor
  rationale: “Temor” preserva a referência ao medo e, ao mesmo tempo, admite a conotação reverente comum na literatura sapiencial, sem reduzi-la simplesmente a “reverência”.
- source_word: γνώσεως
  choice: conhecimento
  rationale: É o sentido mais direto de γνῶσις; “entendimento” seria possível, mas menos exato.
- source_word: ἁγίας
  choice: santa
  rationale: Mantém a dicção bíblica usual e a ressonância teológica de ἅγιος.
- source_word: ἐλπίδος
  choice: esperança
  rationale: É o equivalente direto, idiomático e contextualmente apropriado de ἐλπίς.
theological_decisions:
- issue: Sentido de φόβου no contexto sapiencial
  choice: temor
  alternative: reverência
  rationale: Na literatura sapiencial, φόβος frequentemente inclui reverência, sobretudo diante de Deus. Contudo, o grego não explicita essa restrição; “temor” preserva melhor a amplitude e a tensão do termo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A coordenação grega repetida foi vertida como uma enumeração natural em português. O marcador [b] foi colocado junto de “temor”, termo ao qual a nota efetivamente se refere.
