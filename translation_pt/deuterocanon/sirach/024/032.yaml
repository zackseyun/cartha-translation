  text: I will again make instruction shine like the dawn[c][b][a], and I will bring these things to light far into the distance.
translation:
  language: pt
  text: Além disso, farei a instrução brilhar como a aurora[a] e trarei estas coisas à luz até bem longe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ainda farei a instrução resplandecer como o amanhecer e as manifestarei ao longe”. O grego passa do singular “instrução” ao plural “estas coisas”, provavelmente em referência aos conteúdos do ensino da Sabedoria.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  choice: Além disso
  rationale: Aqui o advérbio tem força aditiva e continuativa. “Além disso” comunica essa progressão sem sugerir necessariamente repetição temporal ou contraste.
- source_word: παιδείαν
  choice: instrução
  rationale: No contexto sapiencial, o termo designa ensino formativo, não apenas disciplina corretiva; “instrução” é claro, digno e adequado ao contexto.
- source_word: ὡς ὄρθρον
  choice: como a aurora
  rationale: Preserva a imagem do romper da manhã e da luz que se expande.
- source_word: φωτιῶ
  choice: farei ... brilhar
  rationale: Como παιδείαν é objeto do verbo, esta formulação natural em português mantém a metáfora luminosa sem recorrer ao pouco idiomático “iluminarei a instrução”.
- source_word: ἐκφανῶ
  choice: trarei ... à luz
  rationale: Mantém o sentido de manifestar ou revelar e prolonga deliberadamente a imagem de luz da primeira oração.
- source_word: αὐτά
  choice: estas coisas
  rationale: Preserva o neutro plural grego, provavelmente alusivo aos conteúdos ou expressões da instrução, sem reduzi-lo ao singular.
- source_word: ἕως εἰς μακράν
  choice: até bem longe
  rationale: Expressa de modo natural o alcance amplo e espacial sugerido pela locução grega.
theological_decisions:
- issue: Referente de αὐτά no discurso da Sabedoria
  choice: “estas coisas”, preservando o plural e remetendo provavelmente aos conteúdos da instrução
  alternative: “ela” ou “a tornarei conhecida”, tratando a instrução singular como referente
  rationale: O texto passa do singular παιδείαν ao plural neutro αὐτά. A tradução mantém essa mudança gramatical e a possível amplitude dos ensinamentos, sem impor uma identificação doutrinária mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva o paralelismo poético e a metáfora contínua da luz, bem como a mudança grega do singular para o plural.
