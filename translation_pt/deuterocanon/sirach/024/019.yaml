  naturalness: «Venham a mim, vocês que me desejam» é moderno, claro e de registro adequado. «Sejam cheios dos meus frutos» é menos idiomático; por isso, «encham-se dos meus frutos» oferece uma formulação natural e conserva a imagem de plenitude. Embora o reflexivo português não replique formalmente a voz passiva grega, é idiomático e fiel ao sentido no contexto.
  terminology: «Sabedoria» permanece adequadamente implícita, como no grego, sem expansão alegórica. «Frutos» é a melhor escolha contextual para γενημάτων. A alternativa «minha produção» é possível, mas soa comercial em português; «meu produto» e «minha colheita» são alternativas lexicais mais naturais, ainda que «frutos» seja preferível no texto.
