  text: Come to me[a], you who desire me[b], and be filled with my fruits.
translation:
  language: pt
  text: Venham a mim, vocês que me desejam[a], e encham-se dos meus frutos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que anseiam por mim”. O particípio grego expressa desejo intenso.
    reason: lexical_alternative
  - marker: b
    text: Ou “meu produto” ou “minha colheita”. O termo grego se refere ao que é produzido; “frutos” preserva a imagem poética da Sabedoria como planta fecunda no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέλθετέ πρὸς μέ
  choice: Venham a mim
  rationale: O imperativo plural convida os ouvintes a se aproximarem da Sabedoria. “Venham a mim” é natural em português e preserva tanto o chamado quanto a direção do movimento.
- source_word: οἱ ἐπιθυμοῦντές μου
  choice: vocês que me desejam
  rationale: O particípio expressa desejo intenso. “Desejam” é o equivalente direto e mantém em aberto a força poética da relação com a Sabedoria personificada.
- source_word: ἐμπλήσθητε
  choice: fiquem saciados
  rationale: O imperativo passivo pode significar ser cheio ou ficar plenamente satisfeito. Com frutos como complemento, “fiquem saciados” comunica com naturalidade a imagem de receber alimento em abundância, sem explicá-la teologicamente.
- source_word: ἀπὸ τῶν γενημάτων μου
  choice: com os meus frutos
  rationale: γένημα designa aquilo que é produzido, inclusive fruto ou colheita. “Frutos” preserva a imagem vegetal e fecunda do contexto; a preposição ἀπό indica a fonte da saciedade e é expressa idiomaticamente por “com” em português.
theological_decisions:
- issue: Convite da Sabedoria personificada
  choice: Manter a fala em primeira pessoa e a metáfora dos frutos, sem explicitar o que eles representam.
  alternative: Interpretar “frutos” no texto principal como ensinamentos, bênçãos ou benefícios da Sabedoria.
  rationale: O grego apresenta a Sabedoria personificada convidando os que a desejam. A tradução preserva essa imagem e sua abertura teológica, sem acrescentar uma identificação doutrinária ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento “vocês” torna explícito o plural do grego sem recorrer a formas regionais ou arcaizantes. A formulação conserva a personificação e a imagem agrícola do original.
