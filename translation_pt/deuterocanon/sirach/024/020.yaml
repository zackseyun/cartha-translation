  text: For the memory of me is sweeter than honey[c][b][a], and my inheritance is sweeter than the honeycomb.
translation:
  language: pt
  text: Pois a lembrança de mim[a] é mais doce que o mel, e a minha herança, mais doce que o favo de mel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a recordação de mim” ou “o memorial de mim”.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega designa o favo de mel; também se pode traduzir “o mel do favo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημόσυνόν μου
  choice: a lembrança de mim
  rationale: μνημόσυνον pode indicar lembrança, recordação ou memorial. “A lembrança de mim” é natural em português, mantém explícita a referência pessoal à Sabedoria e não transforma o termo em um objeto memorial específico.
- source_word: ὑπὲρ μέλι γλυκύ
  choice: mais doce que o mel
  rationale: Embora γλυκύ esteja formalmente no grau positivo, ὑπέρ dá à expressão sentido comparativo; “mais doce que” comunica isso com clareza.
- source_word: κληρονομία μου
  choice: a minha herança
  rationale: κληρονομία significa herança ou legado. “Herança” é o equivalente direto e preserva sem resolver a possível tensão entre aquilo que pertence à Sabedoria e aquilo que ela transmite aos seus.
- source_word: μέλιτος κηροῦ
  choice: favo de mel
  rationale: A expressão grega, literalmente relacionada ao mel e à cera, é uma forma idiomática de designar o favo de mel. Esta escolha mantém a imagem e soa natural em português.
theological_decisions:
- issue: Referência da primeira pessoa
  choice: 'Manter a Sabedoria personificada falando de si mesma: “de mim” e “minha herança”.'
  alternative: Despersonalizar a frase e falar abstratamente da recordação ou do legado da sabedoria.
  rationale: No contexto de Sirácida 24, a Sabedoria apresenta-se na primeira pessoa. A tradução conserva essa voz sem identificar a figura com uma formulação doutrinária posterior.
- issue: Sentido de “minha herança”
  choice: Conservar a expressão ambígua “a minha herança”.
  alternative: Explicitar como “a herança que eu dou” ou “a herança que possuo”.
  rationale: O grego não determina aqui se a herança é aquilo que a Sabedoria possui, deixa ou concede. A tradução não resolve silenciosamente essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A elipse do verbo no segundo membro preserva o paralelismo poético sem prejudicar a clareza.
