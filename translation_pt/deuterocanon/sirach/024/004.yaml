  text: I made my dwelling in the heights[a], and my throne was in a pillar of cloud;
translation:
  language: pt
  text: Eu estabeleci minha morada nas alturas, e meu trono estava numa coluna de nuvem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «na coluna de nuvem». O grego diz literalmente «numa coluna de nuvem», mas a expressão provavelmente evoca a conhecida coluna de nuvem associada à presença e à orientação de Deus.'
    reason: alternativa lexical e alusão intertextual
lexical_decisions:
- source_word: κατεσκήνωσα
  choice: estabeleci minha morada
  rationale: Expressa o ato de se instalar e permanecer, preservando a força verbal da primeira pessoa e a possível evocação de uma tenda, sem recorrer a uma formulação pouco natural em português.
- source_word: ἐν ὑψηλοῖς
  choice: nas alturas
  rationale: Conserva o sentido local e plural da expressão grega, com sua referência provável às alturas celestes.
- source_word: θρόνος
  choice: trono
  rationale: Mantém de modo direto a imagem explícita de realeza e exaltação.
- source_word: ἐν στύλῳ νεφέλης
  choice: numa coluna de nuvem
  rationale: Reproduz a construção grega sem artigo definido e preserva naturalmente a evocação da presença e orientação divina no deserto.
theological_decisions:
- issue: Alusão à manifestação divina na coluna de nuvem durante a caminhada de Israel pelo deserto
  choice: Manter no texto principal «numa coluna de nuvem» sem explicar a alusão
  alternative: «na coluna de nuvem»
  rationale: A expressão provavelmente evoca a tradição do êxodo, mas o grego não traz artigo e não torna explícita a identificação. A tradução preserva tanto a forma indefinida quanto a ressonância intertextual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. «Estabeleci minha morada» conserva a ideia de instalação duradoura; «coluna de nuvem» mantém a formulação bíblica reconhecível. O marcador foi colocado junto à expressão a que a nota se refere.
