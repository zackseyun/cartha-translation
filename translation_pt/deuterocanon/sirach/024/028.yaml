  text: The first did not finish knowing her[c][b][a], and likewise the last did not trace her out.
translation:
  language: pt
  text: O primeiro não chegou a conhecê-la por completo, e, do mesmo modo, o último não a sondou até o fim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O primeiro não terminou de conhecê-la, e, igualmente, o último não seguiu seus rastros até o fim.”'
    reason: Alternativa mais formal, que torna explícitas as imagens de completar o conhecimento e de seguir rastros presentes nos verbos gregos.
lexical_decisions:
- source_word: οὐ συνετέλεσεν … γνῶναι
  choice: não chegou a conhecê-la por completo
  rationale: Expressa de modo natural em português a ideia de não levar o conhecimento dela à sua plenitude, sem trocar γνῶναι por “descobrir”.
- source_word: ὁ πρῶτος
  choice: o primeiro
  rationale: Mantém o substantivo aberto e o contraste temporal ou geracional com “o último”, sem especificar indevidamente quem é o referente.
- source_word: αὐτήν
  choice: -la
  rationale: Retoma a Sabedoria personificada no feminino ao longo do contexto de Sirácida 24.
- source_word: καὶ οὕτως
  choice: e, do mesmo modo
  rationale: Apresenta a segunda oração como realidade paralela à primeira, não como consequência dela.
- source_word: ὁ ἔσχατος
  choice: o último
  rationale: Preserva o paralelismo com “o primeiro” e a amplitude do contraste presente no grego.
- source_word: οὐκ ἐξιχνίασεν αὐτήν
  choice: não a sondou até o fim
  rationale: “Sondar” conserva a ideia de investigar profundamente, enquanto “até o fim” comunica o sentido de seguir os vestígios até alcançar plena compreensão.
theological_decisions:
- issue: Referente e gênero da Sabedoria personificada
  choice: Manter a referência feminina em “conhecê-la” e “sondou”.
  alternative: Tratar a sabedoria como conceito impessoal e evitar o pronome feminino.
  rationale: Em Sirácida 24, a Sabedoria fala como figura feminina; a tradução preserva essa personificação literária sem acrescentar identificação doutrinária posterior.
- issue: Alcance de “o primeiro” e “o último”
  choice: Conservar as expressões sem identificar personagens específicos.
  alternative: Explicitar “o primeiro ser humano” e “o último ser humano”.
  rationale: O grego deixa os referentes abertos e enfatiza sobretudo a totalidade do contraste; especificá-los resolveria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação evita o pouco idiomático “terminou de conhecer” no texto principal, mas conserva essa possibilidade formal na nota.
