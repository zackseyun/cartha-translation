  yaml_path: translation/deuterocanon/sirach/024/022.yaml
  text: Whoever obeys me will not be put to shame, and those who work with me will not sin.
translation:
  language: pt
  text: Quem me obedece não ficará envergonhado, e os que trabalham em mim[a] não pecarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega é literalmente “trabalham em mim”. Também pode ser entendida, conforme o contexto, como agir sob a esfera ou a influência da Sabedoria.
    reason: Preserva a construção ἐν ἐμοί e sua ambiguidade, sem substituir no texto uma preposição por uma interpretação mais específica.
lexical_decisions:
- source_word: ὁ ὑπακούων μου
  choice: Quem me obedece
  rationale: ὑπακούω expressa escutar de modo responsivo, isto é, atender ou obedecer; a formulação portuguesa é direta e natural.
- source_word: οὐκ αἰσχυνθήσεται
  choice: não ficará envergonhado
  rationale: Preserva o sentido futuro de sofrer ou experimentar vergonha sem definir rigidamente se a causa é interna ou externa.
- source_word: οἱ ἐργαζόμενοι ἐν ἐμοὶ
  choice: os que trabalham unidos a mim
  rationale: A expressão grega usa ἐν, literalmente “em”, e não σύν ou μετά, “com”. “Unidos a mim” comunica em português a esfera ou associação indicada por ἐν sem recorrer ao pouco natural “trabalham em mim” nem reduzir o texto simplesmente a “comigo”.
- source_word: οὐχ ἁμαρτήσουσιν
  choice: não pecarão
  rationale: ἁμαρτάνω aqui admite o sentido moral comum de pecar; o futuro e a negação foram preservados sem acrescentar qualificações.
theological_decisions:
- issue: Relação dos agentes com a Sabedoria em ἐν ἐμοί
  choice: unidos a mim
  alternative: comigo; em mim
  rationale: A escolha evita substituir silenciosamente a preposição grega ἐν por uma simples ideia de cooperação, mas também evita transformar a construção incomum em uma afirmação metafísica mais específica do que o contexto exige.
- issue: Afirmação de que os que atuam ligados à Sabedoria não pecarão
  choice: não pecarão
  alternative: não errarão
  rationale: O verbo pode abranger errar ou falhar, porém o uso corrente e o paralelismo sapiencial sustentam “pecar”. A formulação mantém a força absoluta e a tensão teológica do original, sem inserir “habitualmente” ou outra limitação ausente do grego.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe breve. A personificação da Sabedoria e a força das duas promessas foram mantidas sem explicação denominacional.
