  text: Não percam as forças[a]; apeguem-se a ele, para que sejam fortalecidos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não desfaleçam em sua força”. O verbo pode significar falhar, cessar ou desfalecer.'
