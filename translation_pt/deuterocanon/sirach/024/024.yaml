    reason: textual_variant
lexical_decisions:
- source_word: ἐκλίπητε ἐν ἰσχύϊ
  choice: percam as forças
  rationale: A expressão grega exorta a não falhar, cessar ou desfalecer quanto à força. “Não percam as forças” é natural em português e preserva a ideia central, enquanto a nota registra a alternativa mais próxima do valor de desfalecer.
- source_word: κολλᾶσθε
  choice: apeguem-se
  rationale: O verbo indica unir-se ou prender-se estreitamente a alguém. “Apeguem-se” comunica adesão deliberada e contínua em linguagem atual e digna.
- source_word: αὐτῷ
  choice: a ele
  rationale: O pronome dativo grego pode ser masculino ou neutro. “A ele” preserva a leitura pessoal mais natural desta exortação, sem explicitar no texto um referente que o grego não nomeia.
- source_word: κραταιωθῆτε
  choice: sejam fortalecidos
  rationale: O subjuntivo passivo expressa o resultado pretendido da adesão; “sejam fortalecidos” conserva claramente essa força passiva e resultativa.
theological_decisions:
- issue: Referente de αὐτῷ na exortação acrescentada
  choice: a ele
  alternative: a isso
  rationale: A forma grega admite referente masculino ou neutro. A tradução pessoal é mais natural no teor exortativo, mas não identifica expressamente o referente como o Senhor, preservando a ambiguidade contextual.
- issue: Situação textual de Sirácida 24:24
  choice: manter a linha no texto corrido e indicar sua situação em nota
  alternative: omitir a linha do texto corrido
  rationale: A linha faz parte da sequência adotada para este capítulo em certas tradições textuais de Sirácida; mantê-la com nota informa o leitor sem ocultar a variação textual.
translation_notes:
  register: Português moderno, claro e digno, com formas no plural. “Percam as forças” favorece a naturalidade sem apagar a amplitude lexical, registrada em nota; “apeguem-se” mantém o caráter forte e relacional do verbo grego.
