  text: All these things are the book of the covenant of God Most High[b][a], the law that Moses commanded as an inheritance for the assemblies of Jacob.
translation:
  language: pt
  text: Todas essas coisas são o livro da aliança do Deus Altíssimo, a lei que Moisés ordenou como herança para as assembleias de Jacó[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para as congregações de Jacó”. O termo grego se refere provavelmente às comunidades reunidas de Israel, não necessariamente às instituições que mais tarde seriam chamadas sinagogas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα πάντα
  choice: Todas essas coisas
  rationale: Preserva o plural neutro e retoma, como um conjunto, tudo o que foi dito antes.
- source_word: βίβλος διαθήκης
  choice: livro da aliança
  rationale: βίβλος designa um texto escrito, e διαθήκη tem aqui o sentido bíblico de aliança; a expressão mantém a ressonância escritural sem especificar o suporte material como rolo.
- source_word: θεοῦ Ὑψίστου
  choice: do Deus Altíssimo
  rationale: É uma formulação natural em português e mantém ambos os elementos do título divino no genitivo grego.
- source_word: νόμον
  choice: a lei
  rationale: Refere-se à lei mosaica identificada com o livro da aliança, não a uma norma indeterminada.
- source_word: ὃν ἐνετείλατο Μωυσῆς
  choice: que Moisés ordenou
  rationale: Mantém Moisés como sujeito gramatical e traduz diretamente o sentido de dar uma ordem ou mandamento.
- source_word: κληρονομίαν
  choice: como herança
  rationale: 'Explicita de modo idiomático a relação apositiva ou resultativa: a lei é apresentada como herança recebida pelo povo.'
- source_word: συναγωγαῖς Ἰακώβ
  choice: para as assembleias de Jacó
  rationale: συναγωγαί indica aqui as comunidades reunidas de Israel; “assembleias” evita a possível leitura anacrônica de instituições sinagogais posteriores, enquanto “Jacó” preserva o nome do texto.
theological_decisions:
- issue: Sentido de διαθήκη no contexto mosaico
  choice: aliança
  alternative: testamento
  rationale: A ligação entre Deus, Moisés, a lei e Jacó favorece claramente o sentido bíblico de compromisso pactual, não o sentido jurídico posterior de testamento.
- issue: Identidade de θεοῦ Ὑψίστου
  choice: Deus Altíssimo
  alternative: Deus, o Altíssimo
  rationale: A opção escolhida é natural e tradicional em português, sem alterar a relação entre θεοῦ e Ὑψίστου.
- issue: Referente de συναγωγαῖς
  choice: assembleias de Jacó
  alternative: congregações de Jacó
  rationale: “Assembleias” comunica as comunidades reunidas de Israel sem impor a noção institucional posterior de sinagoga.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe acompanha de perto o grego, mas permanece natural. O marcador de nota foi colocado imediatamente após a expressão a que se refere.
