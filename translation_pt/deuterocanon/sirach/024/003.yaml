  text: I came forth from the mouth of the Most High, and like a mist I covered the earth;
translation:
  language: pt
  text: Eu saí da boca do Altíssimo e, como neblina, cobri a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθον
  choice: saí
  rationale: O aoristo de ἐξέρχομαι indica sair ou vir para fora. “Saí” é direto e natural em português, mantendo a imagem de origem sem acrescentar uma interpretação sobre o modo dessa procedência.
- source_word: ἀπὸ στόματος
  choice: da boca
  rationale: Preserva de modo conciso e idiomático a metáfora grega de procedência a partir da boca, ligada à expressão ou palavra do Altíssimo.
- source_word: Ὑψίστου
  choice: do Altíssimo
  rationale: “Altíssimo” é a forma bíblica tradicional e ainda clara do título divino Ὕψιστος.
- source_word: ὡς ὁμίχλη
  choice: como neblina
  rationale: ὁμίχλη designa neblina ou névoa. “Neblina” comunica com clareza a imagem de algo que se estende e cobre, preservando o tom poético.
- source_word: κατεκάλυψα
  choice: cobri
  rationale: O verbo composto expressa cobrir por cima ou inteiramente. “Cobri” reproduz o sentido básico sem explicitar além do grego a maneira pela qual isso ocorre.
- source_word: γῆν
  choice: a terra
  rationale: No contexto cósmico e poético da autodescrição da Sabedoria, γῆν se refere à terra em sentido amplo, não a uma região específica.
theological_decisions:
- issue: A origem da Sabedoria personificada em Deus
  choice: “Eu saí da boca do Altíssimo”
  alternative: “Fui proferida pelo Altíssimo” ou “procedi da ordem do Altíssimo”
  rationale: O grego põe a Sabedoria personificada falando na primeira pessoa e descreve sua saída da boca de Deus. A formulação mantém essa tensão poético-teológica sem reduzi-la apenas à fala, à criação ou a uma categoria doutrinária posterior.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação poética. A ordem e as imagens do grego foram preservadas sem rigidez desnecessária.
