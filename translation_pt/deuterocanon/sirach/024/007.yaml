  text: Among all these I sought a resting place[b][a], and in whose inheritance shall I lodge?
translation:
  language: pt
  text: Entre todos estes, procurei um lugar de descanso[a], e na herança de quem me alojarei[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descanso”. O substantivo grego pode indicar descanso ou repouso; aqui, a pergunta paralela sobre onde se alojar sugere também a ideia de um lugar de descanso.
    reason: lexical_alternative
  - marker: b
    text: Ou “acamparei”. O verbo grego pode se referir a alojar-se ou a acampar, especialmente para passar a noite.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τούτων πάντων
  choice: Entre todos estes
  rationale: Com o genitivo, μετά pode indicar associação ou posição dentro de um conjunto. Aqui, a Sabedoria considera possíveis lugares onde repousar; por isso, “entre” exprime melhor a busca dentro desse conjunto do que o sentido temporal de “depois”.
- source_word: ἀνάπαυσιν
  choice: um lugar de descanso
  rationale: O substantivo significa “descanso” ou “repouso”, mas a pergunta paralela sobre onde se alojar lhe confere uma nuance locativa. A formulação concreta é natural em português sem eliminar a alternativa mais abstrata, registrada em nota.
- source_word: ἐζήτησα
  choice: procurei
  rationale: Tradução direta e corrente de ζητέω no aoristo, adequada à ideia de buscar um lugar.
- source_word: κληρονομίᾳ
  choice: herança
  rationale: Preserva tanto o sentido comum de bem herdado quanto a ressonância bíblica de posse ou porção concedida, sem antecipar a identificação dessa herança no contexto seguinte.
- source_word: τίνος
  choice: de quem
  rationale: Representa de modo idiomático o genitivo interrogativo que pergunta pelo possuidor da herança.
- source_word: αὐλισθήσομαι
  choice: me alojarei
  rationale: O verbo pode descrever o ato de passar a noite, alojar-se ou acampar. “Me alojarei” mantém a imagem concreta e corresponde naturalmente à busca de um lugar de descanso, sem sugerir necessariamente um acampamento militar.
theological_decisions:
- issue: A busca da Sabedoria personificada por um lugar onde repousar
  choice: Apresentar diretamente a Sabedoria procurando um lugar de descanso e perguntando na herança de quem se alojará.
  alternative: Identificar explicitamente a herança como Israel ou interpretar a frase apenas como busca de acolhimento entre os povos.
  rationale: O grego deixa a identidade da herança para ser esclarecida pelo contexto subsequente. A tradução preserva a personificação e a tensão teológica, sem antecipar uma identificação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a coordenação do grego foram preservadas, enquanto “um lugar de descanso” e “me alojarei” comunicam naturalmente a imagem espacial do verso. Os marcadores aparecem junto às expressões correspondentes.
