  text: For her understanding is more abundant than the sea[d][c][b][a], and her counsel than the great deep.
translation:
  language: pt
  text: Pois o entendimento dela[a] é mais abundante que o mar[c], e o seu conselho, mais abundante que o grande abismo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pensamento”. O termo grego pode indicar tanto o ato ou resultado de pensar quanto a capacidade de compreender.
    reason: lexical_alternative
  - marker: b
    text: Ou “a grande profundeza”. A expressão evoca as profundezas primordiais ou cósmicas.
    reason: lexical_alternative
  - marker: c
    text: Mais literalmente, a construção grega pode ser representada por “foi multiplicado a partir do mar”; aqui ela é entendida como uma comparação de matriz semítica.
    reason: source_ambiguity
lexical_decisions:
- source_word: διανόημα
  choice: entendimento
  rationale: O substantivo pode designar o pensamento ou aquilo que resulta do pensar. “Entendimento” se ajusta ao contexto da Sabedoria personificada sem reduzir o termo a uma ideia isolada.
- source_word: ἐπληθύνθη
  choice: é mais abundante
  rationale: Embora a forma verbal signifique literalmente “foi multiplicado”, a construção com ἀπό provavelmente expressa uma comparação de matriz semítica. A tradução comunica que o entendimento da Sabedoria excede o mar em abundância.
- source_word: βουλή
  choice: conselho
  rationale: “Conselho” preserva o vocabulário sapiencial e pode abranger deliberação, orientação e propósito sem escolher apenas um desses sentidos.
- source_word: ἀβύσσου μεγάλης
  choice: o grande abismo
  rationale: A expressão evoca as grandes profundezas aquáticas ou cósmicas. “Grande abismo” preserva essa imagem e é mais concreto que uma formulação abstrata.
- source_word: ἀπὸ γὰρ θαλάσσης
  choice: que o mar
  rationale: ἀπό é entendido como parte de uma comparação de matriz semítica, e não como indicação de que o entendimento procede do mar.
- source_word: αὐτῆς
  choice: dela / seu
  rationale: Os pronomes femininos preservam a personificação literária da Sabedoria presente no contexto e na gramática grega.
theological_decisions:
- issue: Personificação da Sabedoria
  choice: Manter a referência feminina por meio de “dela” e “seu”.
  alternative: Tratar a sabedoria como abstração impessoal.
  rationale: O contexto apresenta a Sabedoria como figura feminina personificada; preservar essa característica evita achatar a imagem literária e sua tensão teológica.
- issue: Sentido comparativo de ἀπό
  choice: 'Entender a construção como comparação: “mais abundante que”.'
  alternative: 'Traduzir literalmente como origem: “foi multiplicado a partir do mar”.'
  rationale: A leitura comparativa explica de modo coerente as duas construções paralelas com ἀπό e a provável influência de um idioma semítico, embora a nota preserve a forma mais literal do grego.
translation_notes:
  register: Português moderno, digno e acessível, com construção comparativa clara. A repetição de “mais abundante” na segunda oração explicita em português o predicado subentendido no paralelismo grego, enquanto as notas preservam as principais alternativas lexicais e a forma mais literal da construção.
