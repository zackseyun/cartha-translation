base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/013.yaml
  text: Like a cedar I was raised high in Lebanon[a], and like a cypress in the mountains of Hermon.
translation:
  language: pt
  text: Como um cedro, fui erguida bem alto no Líbano, e como um cipreste, nos montes do Hermom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego Ἀερμών corresponde ao topônimo geralmente vertido como “Hermom”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: como
  rationale: Introduz as duas comparações e soa natural em português contemporâneo.
- source_word: κέδρος
  choice: cedro
  rationale: É o equivalente usual do nome grego da árvore e preserva a associação tradicional com o Líbano, a altura e a majestade.
- source_word: ἀνυψώθην
  choice: fui erguida bem alto
  rationale: Preserva a voz passiva e destaca a imagem concreta de altura. O feminino concorda com a Sabedoria personificada que fala no contexto, sem transformar o verbo em uma afirmação explicitamente honorífica.
- source_word: ἐν τῷ Λιβάνῳ
  choice: no Líbano
  rationale: Tradução locativa direta e idiomática em português.
- source_word: κυπάρισσος
  choice: cipreste
  rationale: É a identificação lexical mais comum da árvore designada pelo grego, preferível aqui a alternativas tradicionais como pinheiro ou abeto.
- source_word: ἐν ὄρεσιν Ἀερμών
  choice: nos montes do Hermom
  rationale: Mantém o plural de ὄρεσιν e emprega a forma portuguesa consagrada do topônimo refletido pelo grego Ἀερμών.
theological_decisions:
- issue: Se ἀνυψώθην deve receber sentido explicitamente honorífico
  choice: fui erguida bem alto
  alternative: fui exaltada
  rationale: A fala poética da Sabedoria personificada emprega imagens de árvores altas. A formulação escolhida conserva tanto a voz passiva quanto a imagem espacial, sem resolver o verbo como uma declaração teológica de exaltação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os artigos indefinidos tornam as comparações naturais em português. A elipse de “fui erguida bem alto” na segunda oração preserva a concisão e o paralelismo poético. O marcador foi colocado junto a “Hermom”, termo ao qual a nota efetivamente se refere.
