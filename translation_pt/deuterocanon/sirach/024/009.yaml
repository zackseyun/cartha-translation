  text: Before the age[a], from the beginning, he created me[c][b], and for all ages I will never cease.
translation:
  language: pt
  text: Antes do tempo[a], desde o princípio, ele me criou[b], e por toda a eternidade jamais deixarei de existir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Antes da era» ou «Antes da eternidade». O grego αἰών pode designar uma era ou uma duração ilimitada, conforme o contexto.'
    reason: lexical_alternative
  - marker: b
    text: A Sabedoria personificada é quem fala neste trecho.
    reason: referent_clarification
  - marker: c
    text: 'Ou: «jamais cessarei» ou «jamais chegarei ao fim». A negação grega é enfática.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ αἰῶνος
  choice: Antes do tempo
  rationale: No contexto da origem primordial da Sabedoria, a expressão situa sua criação antes da ordem temporal; esta formulação comunica isso com naturalidade, enquanto a nota preserva a alternativa lexical mais literal.
- source_word: ἀπʼ ἀρχῆς
  choice: desde o princípio
  rationale: Preserva o ponto inicial expresso pelo grego e mantém uma dicção bíblica corrente e digna.
- source_word: ἔκτισέν με
  choice: ele me criou
  rationale: κτίζω tem aqui o sentido direto de criar. A tradução mantém a personificação da Sabedoria e não suaviza a formulação por razões doutrinárias posteriores.
- source_word: ἕως αἰῶνος
  choice: por toda a eternidade
  rationale: Neste segundo uso, αἰών aponta para duração sem fim. A expressão é natural em português e evita sugerir apenas uma era delimitada.
- source_word: οὐ μὴ ἐκλίπω
  choice: jamais deixarei de existir
  rationale: A dupla negação é enfática, e ἐκλείπω, neste contexto, indica cessar ou chegar ao fim. A formulação explicita a continuidade da existência sem introduzir a ideia de fracasso.
theological_decisions:
- issue: Se a linguagem sobre a origem da Sabedoria deve ser suavizada para evitar a implicação de que foi criada
  choice: Manter «ele me criou» no texto principal
  alternative: ele me estabeleceu / ele me formou
  rationale: O verbo grego κτίζω significa normalmente «criar» ou «fundar». Como a passagem apresenta a Sabedoria personificada, a tradução conserva a tensão própria do texto sem impor uma resolução doutrinária posterior.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Desde o princípio» preserva a ressonância bíblica sem arcaísmo; «por toda a eternidade» e «jamais deixarei de existir» comunicam com naturalidade a duração ilimitada e a negação enfática.
