  text: It fills with wisdom like the Pishon[d][c][b][a], and like the Tigris in the days of firstfruits.
translation:
  language: pt
  text: Aquele que enche de sabedoria como o Fison e como o Tigre nos dias da nova colheita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos dias dos primeiros frutos”; possivelmente, “nos dias do novo crescimento” ou, mais literalmente, “nos dias das coisas novas”. A expressão grega é difícil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιπλῶν
  choice: Ela derrama
  rationale: O particípio ativo apresenta a realidade mencionada no contexto anterior como agente que comunica sabedoria. “Derrama” preserva a voz ativa e torna natural, em português, a imagem abundante dos rios, sem a ambiguidade de “enche de sabedoria” quanto ao objeto implícito.
- source_word: ὡς Φισὼν
  choice: como o Fison
  rationale: Emprega a forma portuguesa tradicional do nome do rio e o artigo definido usual com nomes fluviais.
- source_word: σοφίαν
  choice: sabedoria
  rationale: Equivalente corrente de σοφία e termo central no contexto de Eclesiástico 24.
- source_word: ὡς Τίγρις
  choice: como o Tigre
  rationale: Usa a forma portuguesa consagrada para o nome do rio.
- source_word: ἐν ἡμέραις νέων
  choice: nos dias da nova colheita
  rationale: A expressão difícil aponta de modo geral para produtos novos ou para a estação da nova colheita; esta formulação mantém a imagem agrícola sem impor a noção cultual mais específica de primícias.
theological_decisions:
- issue: Imagem da sabedoria personificada e seu vínculo com a Lei no contexto
  choice: Usar “sabedoria” em minúscula e retomar o antecedente contextual por “Ela”
  alternative: Capitalizar “Sabedoria” ou explicitar “A Lei”
  rationale: O grego não distingue maiúsculas com valor interpretativo nesse ponto. O pronome evita inserir no versículo um substantivo ausente, ao mesmo tempo que conserva a ligação gramatical com o contexto anterior e não resolve indevidamente a tensão entre sabedoria personificada, livro e Lei.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A formulação mantém o paralelismo dos dois rios e assinala em nota a incerteza de ἐν ἡμέραις νέων.
