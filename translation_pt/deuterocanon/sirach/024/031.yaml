base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/031.yaml
  text: I said[a], ‘I will water my garden, and I will drench my garden bed.’ And behold, my channel became a river[c][b], and my river became a sea.
translation:
  language: pt
  text: 'Eu disse: “Regarei o meu jardim e encharcarei o meu canteiro[a]”. E eis que o meu canal se tornou um rio, e o meu rio se tornou um mar[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terreno cultivado”; o grego se refere a um canteiro ou pequena área de cultivo, não necessariamente a um canteiro de flores.
    reason: lexical_alternative
  - marker: b
    text: A imagem cresce de um canal de irrigação para um rio e, por fim, para um mar, destacando uma expansão extraordinária.
    reason: cultural_note
lexical_decisions:
- source_word: Ποτιῶ
  choice: Regarei
  rationale: O futuro do verbo, no contexto agrícola, indica dar água ao jardim. “Regarei” é natural em português e preserva a imagem sem recorrer ao termo mais técnico “irrigarei”.
- source_word: κῆπον
  choice: jardim
  rationale: κῆπος designa normalmente um jardim ou área cultivada; “jardim” é amplo e combina bem com πρασιά.
- source_word: μεθύσω
  choice: encharcarei
  rationale: O verbo expressa aqui saturação abundante com água, não embriaguez literal. “Encharcarei” conserva a intensidade da imagem.
- source_word: πρασιάν
  choice: canteiro
  rationale: πρασιά é um canteiro ou pequeno terreno cultivado. “Canteiro” é corrente e evita limitar o referente a flores.
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Mantém a vivacidade retórica e o tom elevado do grego, assinalando a transformação inesperada.
- source_word: διῶρυξ
  choice: canal
  rationale: O termo designa um curso de água escavado, especialmente para irrigação. “Canal” preserva a progressão de um conduto menor para um rio.
- source_word: ποταμόν
  choice: rio
  rationale: É o sentido comum de ποταμός e representa o estágio intermediário da expansão da água.
- source_word: θάλασσαν
  choice: mar
  rationale: É a equivalência direta e preserva a culminação hiperbólica da imagem sem identificar um mar específico.
theological_decisions:
- issue: Expansão metafórica do ensino da Sabedoria, de um canal de irrigação até um mar
  choice: Preservar no texto a imagem agrícola e aquática sem explicá-la alegoricamente.
  alternative: Explicitar que a água representa a difusão universal da sabedoria ou da instrução escrita.
  rationale: O versículo apresenta a imagem, mas não oferece aqui uma interpretação explícita. A tradução mantém sua abertura e sua tensão poética.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “E eis que” conserva o relevo retórico do original; “regarei”, “encharcarei” e “canteiro” mantêm a concretude agrícola. Os possessivos reproduzem tanto o dativo de posse em ἐγένετό μοι quanto o explícito ποταμός μου.
