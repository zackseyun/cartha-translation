  text: And I, like a canal from a river, and like a water channel, went out into a garden.
translation:
  language: pt
  text: E eu, como um canal vindo de um rio e como um conduto de água, saí para um jardim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “paraíso”. A palavra grega pode designar um jardim, um parque ou o paraíso; aqui, a imagem imediata é a de água de irrigação entrando num jardim cultivado.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγώ
  choice: E eu
  rationale: Marca de modo direto a passagem para o papel do próprio falante, sem tornar explícito um valor aditivo que o contexto não exige.
- source_word: διῶρυξ
  choice: canal
  rationale: Designa um curso artificial de água e mantém a distinção em relação ao rio que lhe serve de origem.
- source_word: ἀπὸ ποταμοῦ
  choice: vindo de um rio
  rationale: Expressa a procedência indicada por ἀπό e conserva a indefinição da expressão grega sem artigo.
- source_word: ὑδραγωγός
  choice: conduto de água
  rationale: Comunica um meio construído para conduzir água; evita tanto o sentido natural de 'curso de água' quanto a imagem arquitetônica mais específica de 'aqueduto'.
- source_word: ἐξῆλθον
  choice: desemboquei
  rationale: No quadro metafórico de canais de irrigação, exprime com naturalidade o movimento de saída e chegada ao jardim, embora o verbo grego seja mais geral.
- source_word: παράδεισον
  choice: jardim
  rationale: No contexto imediato de irrigação, refere-se naturalmente a um espaço cultivado; 'paraíso' permanece uma alternativa lexical legítima.
theological_decisions:
- issue: Tradução de παράδεισον no contexto da metáfora da sabedoria
  choice: jardim
  alternative: paraíso
  rationale: A imagem imediata é agrícola e não afirma explicitamente um cenário escatológico. 'Jardim' preserva essa imagem concreta, enquanto a nota mantém a amplitude lexical do grego.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação mantém o paralelismo dos dois canais artificiais e evita associações teológicas não exigidas pelo contexto.
