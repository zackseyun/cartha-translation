  text: It fills up understanding like the Euphrates[a], and like the Jordan in the days of harvest[d][c][b];
translation:
  language: pt
  text: que enche o entendimento como o Eufrates e como o Jordão nos dias da colheita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “aquele que enche o entendimento como o Eufrates e como o Jordão no tempo da colheita”. O grego começa com um particípio que retoma o referente do contexto anterior. A comparação evoca os rios em plena cheia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀναπληρῶν
  choice: que enche
  rationale: O particípio presente ativo com artigo retoma o referente do contexto anterior. «Que enche» conserva tanto a construção relativa quanto o sentido transitivo de completar ou tornar cheio, sem transformar o verbo em uma ideia meramente intransitiva de transbordar.
- source_word: σύνεσιν
  choice: o entendimento
  rationale: «Entendimento» é uma tradução ampla e natural de σύνεσις na literatura sapiencial e permanece objeto direto do verbo, como no grego.
- source_word: ὡς Εὐφράτης
  choice: como o Eufrates
  rationale: ὡς introduz uma comparação; a formulação preserva de modo idiomático a imagem fluvial.
- source_word: Ἰορδάνης
  choice: o Jordão
  rationale: O artigo corresponde ao uso português normal com o nome do rio.
- source_word: ἐν ἡμέραις θερισμοῦ
  choice: nos dias da colheita
  rationale: Mantém a expressão temporal concreta do grego e a alusão à cheia sazonal do Jordão.
theological_decisions:
- issue: Referente do particípio masculino ὁ ἀναπληρῶν
  choice: Construção relativa «que enche», dependente do contexto anterior
  alternative: «Ele enche» ou «Ela enche»
  rationale: O grego pressupõe um antecedente no contexto. Evitar um pronome explícito não impõe em português um gênero ou referente além do que o próprio versículo declara.
- issue: Relação entre o verbo e σύνεσιν
  choice: «enche o entendimento»
  alternative: «enche de entendimento» ou «transborda de entendimento»
  rationale: A escolha conserva σύνεσιν como objeto direto e mantém a imagem de abundância sem alterar a estrutura para indicar que o sujeito está cheio de entendimento.
translation_notes:
  register: Português atual, digno e de leitura ampla. A oração começa em minúscula e mantém sua dependência sintática do contexto anterior, como no grego. A pontuação foi simplificada para leitura natural, e a nota preserva a possibilidade de explicitar o particípio como «aquele que».
