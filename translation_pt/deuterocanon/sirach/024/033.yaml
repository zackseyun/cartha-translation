  text: Still I will pour out instruction like prophecy[c][b][a], and I will leave it for everlasting generations.
translation:
  language: pt
  text: Mais uma vez, derramarei ensino como profecia[a] e o deixarei por gerações sem fim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como uma profecia”. O grego pode ser entendido comparativamente ou com sentido identificacional.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι
  choice: Além disso
  rationale: No contexto, introduz uma ação adicional ou continuada. “Além disso” evita a possível ideia de repetição estrita sugerida por “novamente” e soa natural em português.
- source_word: διδασκαλίαν
  choice: ensino
  rationale: Expressa de modo claro e corrente a ideia de instrução transmitida, sem a conotação técnica ou institucional de “doutrina”.
- source_word: ὡς προφητείαν
  choice: como profecia
  rationale: Mantém a formulação deliberadamente aberta do grego ὡς, que pode indicar comparação ou função/identificação.
- source_word: ἐκχέω
  choice: derramarei
  rationale: Preserva a metáfora vívida de difusão abundante e, em coordenação com καταλείψω, recebe naturalmente valor futuro.
- source_word: καταλείψω αὐτήν
  choice: o deixarei
  rationale: O pronome retoma “ensino”; o masculino em português decorre do gênero do substantivo traduzido. “Deixarei” preserva a ideia de algo legado às gerações seguintes sem explicitação excessiva.
- source_word: εἰς γενεὰς αἰώνων
  choice: para gerações eternas
  rationale: Reproduz de forma concisa e relativamente formal o sentido de duração indefinida da expressão grega.
theological_decisions:
- issue: Força de ὡς em ὡς προφητείαν
  choice: “como profecia”, preservando a abertura entre comparação e função
  alternative: “à maneira de uma profecia” ou “como uma profecia”
  rationale: O grego admite leitura comparativa e identificacional. A redação principal não deve decidir silenciosamente se o ensino apenas se assemelha à profecia ou é apresentado com caráter profético.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe simples. “Além disso” articula o versículo ao discurso anterior; “derramarei” conserva a imagem poética. O marcador [a] aparece imediatamente após a expressão ambígua.
