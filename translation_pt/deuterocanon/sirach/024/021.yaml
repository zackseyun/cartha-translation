  text: Those who eat me will still hunger[a], and those who drink me will still thirst.
translation:
  language: pt
  text: Os que me comem ainda terão fome[a], e os que me bebem ainda terão sede.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “terão ainda mais fome... terão ainda mais sede”. O grego diz literalmente “ainda terão fome” e “ainda terão sede”, expressando o desejo contínuo pela Sabedoria depois de participar dela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐσθίοντές με
  choice: os que me comem
  rationale: O particípio presente substantivado descreve, de modo geral e contínuo, os que comem; o pronome na primeira pessoa preserva a personificação e a metáfora da Sabedoria.
- source_word: ἔτι
  choice: ainda
  rationale: Expressa a continuidade da fome e da sede mesmo depois de participar da Sabedoria, sem acrescentar ao texto a ideia explícita de «mais».
- source_word: πεινάσουσιν
  choice: terão fome
  rationale: Reproduz naturalmente em português o futuro do verbo grego e conserva a imagem direta da fome.
- source_word: οἱ πίνοντές με
  choice: os que me bebem
  rationale: Mantém o paralelismo com «os que me comem» e conserva sem explicação indevida a metáfora da Sabedoria bebida.
- source_word: διψήσουσιν
  choice: terão sede
  rationale: É a formulação portuguesa natural para o futuro do verbo e preserva o paralelismo entre fome e sede.
theological_decisions:
- issue: O paradoxo de continuar com fome e sede depois de comer e beber da Sabedoria
  choice: Conservar literalmente a fome e a sede contínuas no texto principal.
  alternative: «terão mais fome» / «terão sede de mais» ou «desejarão mais»
  rationale: O grego declara diretamente que ainda terão fome e sede. Embora o contexto possa indicar desejo contínuo ou crescente pela Sabedoria, explicitar «mais» resolveria uma tensão que o original deixa implícita.
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela. «Comem» e «bebem» mantêm a personificação vívida da Sabedoria; «terão fome/sede» soa mais natural e amplamente compreensível do que «sentirão fome/sede» ou os verbos menos usuais «faminto»/«sedento» em construção verbal.
