  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/003.yaml
  text: But now in Babylon you will see gods of silver and gold and wood[a], being carried on shoulders, showing fear to the nations.
translation:
  language: pt
  text: Mas agora, na Babilônia, vocês verão deuses de prata, de ouro e de madeira, carregados sobre os ombros e mostrando temor às nações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “causando temor entre as nações” ou “inspirando temor nas nações”. O grego diz literalmente “mostrando temor às nações”, expressão que pode descrever tanto o que essas imagens exibem quanto o efeito que produzem nos observadores.
    reason: Alternativa lexical necessária para preservar a ambiguidade de δεικνύντας φόβον τοῖς ἔθνεσιν.
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Mas agora
  rationale: Preserva tanto a transição adversativa de δέ quanto a ênfase temporal de νυνί.
- source_word: ὄψεσθε
  choice: vocês verão
  rationale: Traduz diretamente o futuro de ὁράω em português moderno e amplamente compreensível.
- source_word: ἐν Βαβυλῶνι
  choice: na Babilônia
  rationale: Expressa de modo natural o sentido locativo.
- source_word: θεοὺς
  choice: deuses
  rationale: Mantém o substantivo grego sem substituí-lo interpretativamente por “ídolos”, preservando a ironia do contexto.
- source_word: ἀργυροῦς καὶ χρυσοῦς καὶ ξυλίνους
  choice: de prata, de ouro e de madeira
  rationale: Explicita os três materiais em uma construção portuguesa natural e fiel.
- source_word: ἐπʼ ὤμων αἰρομένους
  choice: carregados sobre os ombros
  rationale: Conserva a imagem de objetos transportados nos ombros de outras pessoas.
- source_word: δεικνύντας φόβον
  choice: mostrando temor
  rationale: Reproduz de perto a expressão grega deliberadamente condensada, sem decidir no texto principal se se trata de exibição ou de efeito sobre os observadores.
- source_word: τοῖς ἔθνεσιν
  choice: às nações
  rationale: Mantém o dativo e traduz ἔθνη por “nações”, termo adequado ao contexto judaico e menos interpretativo que “gentios”.
theological_decisions:
- issue: Traduzir θεοὺς como “deuses” ou interpretativamente como “ídolos”
  choice: deuses
  alternative: ídolos
  rationale: O original chama as imagens de “deuses”; conservar essa designação deixa que a crítica e a ironia surjam do próprio contexto.
- issue: Sentido de δεικνύντας φόβον τοῖς ἔθνεσιν
  choice: mostrando temor às nações
  alternative: causando temor entre as nações / inspirando temor nas nações
  rationale: A formulação principal preserva a construção literal e sua tensão semântica; a nota registra a leitura causativa, plausível no contexto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para a segunda pessoa do plural. A coordenação foi levemente ajustada com “e” antes do último particípio para fluidez, sem alterar a relação sintática. A formulação incomum “mostrando temor às nações” é intencional e vem esclarecida em nota.
