  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/072.yaml
  text: So a righteous man who has no idols is better[b][a], for he will be far from reproach.
translation:
  language: pt
  text: Portanto, é melhor o homem justo que não tem ídolos[a], pois estará longe da desonra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a pessoa justa”. O grego emprega o singular masculino “homem” em sentido representativo.
    reason: lexical_alternative
  - marker: b
    text: “Desonra” também pode ser traduzido por “censura”, “vergonha” ou “opróbrio”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρείσσον
  choice: é melhor
  rationale: O comparativo predicativo exprime superioridade; “é melhor” é natural em português e preserva a avaliação do grego.
- source_word: οὖν
  choice: Portanto
  rationale: Marca a conclusão decorrente da argumentação anterior; “portanto” mantém claramente essa relação lógica.
- source_word: ἄνθρωπος δίκαιος
  choice: o homem justo
  rationale: O grego traz um substantivo masculino singular com sentido representativo. “Homem justo” preserva a forma do texto-fonte e o registro bíblico sem restringir o princípio apenas a um indivíduo específico.
- source_word: οὐκ ἔχων εἴδωλα
  choice: que não tem ídolos
  rationale: A oração relativa traduz de modo idiomático o particípio que modifica “homem” e conserva a negação de posse ou vínculo com ídolos.
- source_word: ἔσται
  choice: estará
  rationale: Traduz diretamente o futuro de εἰμί e soa natural no contexto da expressão portuguesa “estar longe de”.
- source_word: μακρὰν ἀπὸ ὀνειδισμοῦ
  choice: longe da desonra
  rationale: ὀνειδισμός pode indicar censura, vergonha ou desonra. Neste contraste com a idolatria, “desonra” comunica bem a perda pública de honra sem limitar o sentido à ofensa verbal.
theological_decisions:
- issue: Masculino singular representativo em ἄνθρωπος δίκαιος
  choice: o homem justo
  alternative: a pessoa justa
  rationale: Mantém-se o masculino singular do grego, empregado aqui de forma representativa. A nota esclarece a alternativa inclusiva sem neutralizar silenciosamente a forma do texto-fonte.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e leve tonalidade bíblica. “Portanto” explicita a conclusão; “homem justo” preserva o gênero gramatical do original, e “desonra” evita o caráter mais arcaico de “opróbrio” no texto principal.
