  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/027.yaml
  text: And their priests[a], taking back their sacrifices, make use of them; likewise their women, preserving some from them[b], give none to the poor or the helpless.
translation:
  language: pt
  text: E os sacerdotes deles, tomando de volta os sacrifícios[a], servem-se deles; do mesmo modo, as mulheres deles, conservando parte deles[b], não repartem nada nem com o pobre nem com o desamparado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “recebendo de volta os sacrifícios”. O particípio grego pode indicar que os sacerdotes retomavam ou recebiam as ofertas para uso próprio.'
    reason: lexical_alternative
  - marker: b
    text: O verbo traduzido por “conservando” provavelmente se refere à conservação de alimentos por salga ou cura.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποδιδόμενοι
  choice: tomando de volta
  rationale: O particípio médio pode indicar que os sacerdotes retomam ou recebem de volta os sacrifícios; a formulação preserva a ideia de apropriação sem definir além do grego o mecanismo exato.
- source_word: καταχρῶνται
  choice: servem-se deles
  rationale: Expressa o uso dos sacrifícios pelos sacerdotes e deixa que o contexto transmita a censura, sem impor o sentido mais carregado de 'abusam' ou 'fazem mau uso'.
- source_word: ταριχεύουσαι
  choice: conservando
  rationale: O verbo se refere à conservação de alimentos, provavelmente por salga ou cura. 'Conservando' é natural e evita especificar no texto principal um método que o grego não torna inequívoco.
- source_word: ἀπ' αὐτῶν
  choice: parte desses alimentos
  rationale: A expressão indica que as mulheres conservam algo proveniente dos sacrifícios. A explicitação de 'parte' torna a relação natural em português, e 'alimentos' esclarece o objeto implícito à luz de ταριχεύουσαι.
- source_word: μεταδῶσιν
  choice: repartem
  rationale: O verbo denota dar a alguém uma parte daquilo que se possui; 'repartem' comunica melhor que o simples 'dão' a ideia de compartilhar uma porção.
- source_word: πτωχῷ
  choice: o pobre
  rationale: O singular grego tem valor representativo e é preservado naturalmente em português.
- source_word: ἀδυνάτῳ
  choice: o desamparado
  rationale: Neste contexto social, o termo descreve quem carece de força, capacidade ou recursos para se defender ou prover; 'desamparado' transmite essa vulnerabilidade melhor do que o amplo 'fraco'.
theological_decisions:
- issue: Força moral da apropriação das ofertas pelos sacerdotes e pelas mulheres
  choice: Descrever as ações sem acrescentar uma condenação explícita.
  alternative: Traduzir καταχρῶνται por 'fazem mau uso' ou 'abusam deles'.
  rationale: Embora o contexto seja claramente crítico à idolatria e à exploração, o verbo pode significar simplesmente fazer uso pleno de algo. A tradução permite que a censura surja da descrição e do argumento do trecho, sem intensificação interpretativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção paralela conserva o tom acusatório indireto do grego. Os marcadores [a] e [b] aparecem no texto principal.
