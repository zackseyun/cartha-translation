  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/057.yaml
  text: From them the strong will strip away the gold and the silver[a], and they will go off with the clothing that is wrapped around them[b]; yet they certainly will not help themselves.
translation:
  language: pt
  text: Os fortes[a] lhes arrancarão o ouro e a prata e irão embora levando as vestes que os envolvem; eles de modo nenhum socorrerão a si mesmos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os poderosos”.
    reason: lexical_alternative
  - marker: b
    text: 'A negação é enfática no grego: “de modo nenhum socorrerão a si mesmos”.'
    reason: source_emphasis
lexical_decisions:
- source_word: οἱ ἰσχύοντες
  choice: os fortes
  rationale: O particípio substantivado designa pessoas dotadas de força ou poder. “Os fortes” é conciso e mantém aberta a nuance entre força física e poder.
- source_word: περιελοῦνται
  choice: lhes arrancarão
  rationale: O verbo indica retirar algo que está sobre ou ao redor de alguém ou de alguma coisa. No contexto do saque dos ídolos, “arrancarão” comunica com clareza uma remoção vigorosa.
- source_word: τὸ χρυσίον καὶ τὸ ἀργύριον
  choice: o ouro e a prata
  rationale: Mantém os dois objetos definidos do grego sem acrescentar um possessivo ausente no texto-fonte; o pronome “lhes” explicita apenas de quem são retirados.
- source_word: τὸν ἱματισμὸν τὸν περικείμενον αὐτοῖς
  choice: as vestes que os envolvem
  rationale: “Vestes” traduz ἱματισμός em registro digno, enquanto “que os envolvem” conserva a imagem espacial de περικείμενον sem especificar além do grego como foram colocadas.
- source_word: ἀπελεύσονται ἔχοντες
  choice: irão embora levando
  rationale: Expressa naturalmente a ação principal de partir e a circunstância simultânea de levar consigo o que foi saqueado.
- source_word: οὔτε ἑαυτοῖς οὐ μὴ βοηθήσωσιν
  choice: eles de modo nenhum socorrerão a si mesmos
  rationale: “De modo nenhum” preserva a negação enfática οὐ μή; “socorrerão a si mesmos” mantém tanto o valor verbal futuro quanto o reflexivo explícito.
theological_decisions:
- issue: Referente da oração final
  choice: O pronome “eles” remete aos ídolos, que não socorrerão a si mesmos.
  alternative: Entender a oração apenas como uma declaração geral de que os ídolos são impotentes.
  rationale: O reflexivo ἑαυτοῖς aponta naturalmente para os objetos saqueados, e o contexto imediato retrata sua incapacidade de reagir. A tradução conserva a formulação concreta do grego sem convertê-la numa afirmação doutrinária mais ampla.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vestes” preserva o tom literário sem soar arcaico; “irão embora levando” é corrente e claro. Os pronomes mantêm o foco nos ídolos sem acrescentar qualificações ausentes do grego.
