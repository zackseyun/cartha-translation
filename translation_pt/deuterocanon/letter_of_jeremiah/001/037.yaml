lexical_decisions:
- source_word: χήραν
  choice: uma viúva
  rationale: O acusativo singular de χήρα designa uma viúva. O artigo indefinido comunica naturalmente em português o sentido representativo do singular grego.
- source_word: οὐ μὴ ἐλεήσωσιν
  choice: jamais terão misericórdia
  rationale: A construção οὐ μή com o aoristo do subjuntivo exprime negação enfática. “Jamais” conserva essa força, e “ter misericórdia” mantém o sentido ético e religioso de ἐλεέω.
- source_word: οὔτε
  choice: nem
  rationale: οὔτε coordena a segunda oração negativa com a primeira; “nem” é a ligação portuguesa mais direta e natural.
- source_word: ὀρφανῷ
  choice: a um órfão
  rationale: O dativo singular de ὀρφανός se refere a um órfão ou a uma pessoa sem pai. “Órfão” é atual, claro e conserva o singular representativo.
- source_word: εὖ ποιήσουσιν
  choice: farão bem
  rationale: εὖ ποιέω significa fazer o bem, agir bondosamente ou beneficiar. “Farão bem” preserva a estrutura verbal e o sentido moral do grego.
theological_decisions:
- issue: Tradução do par social χήρα / ὀρφανός
  choice: viúva / órfão
  alternative: viúva / pessoa sem pai
  rationale: O par representa pessoas vulneráveis que os ídolos são incapazes de socorrer. “Viúva” e “órfão” preservam essa associação bíblica tradicional em linguagem moderna, sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo conciso do grego e a intensidade da primeira negação.
