  text: They certainly cannot set a blind man upright for seeing[a], nor can they rescue a man when he is in distress.
translation:
  language: pt
  text: Eles de modo nenhum podem pôr de pé um homem cego para que veja[a], nem podem livrar um homem que esteja em aflição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fazer um homem cego enxergar”. A expressão grega é compacta e pode ter um sentido mais amplo do que a formulação mais literal “pôr de pé [...] para que veja”.'
    reason: alternativa lexical
lexical_decisions:
- source_word: ἄνθρωπον
  choice: um homem
  rationale: O substantivo aparece duas vezes no acusativo singular e designa um indivíduo humano de modo representativo. “Um homem” conserva a forma masculina singular do grego sem limitar o sentido exclusivamente aos homens.
- source_word: τυφλὸν
  choice: cego
  rationale: Equivalente português direto e corrente para a condição física indicada pelo adjetivo grego.
- source_word: εἰς ὅρασιν
  choice: para que veja
  rationale: Expressa de modo natural em português a finalidade ou o resultado ligado à visão, sem eliminar a concisão e a possível amplitude da expressão grega.
- source_word: οὐ μὴ
  choice: de modo nenhum podem
  rationale: A dupla negação grega é enfática e nega categoricamente a capacidade dos ídolos; esta formulação comunica essa força em português atual.
- source_word: περιστήσωσιν
  choice: pôr de pé
  rationale: Conserva a imagem concreta de colocar ou estabelecer alguém numa posição, evitando transformar silenciosamente o verbo numa afirmação explícita de cura; a nota registra a interpretação mais ampla sugerida pelo contexto da visão.
- source_word: ἐν ἀνάγκῃ ὄντα
  choice: que esteja em aflição
  rationale: ἀνάγκη indica aqui uma situação de necessidade urgente, adversidade ou angústia; a oração relativa reproduz naturalmente a função do particípio ὄντα.
- source_word: ἐξέλωνται
  choice: livrar
  rationale: A forma média de ἐξαιρέω tem o sentido de tirar alguém de perigo ou dificuldade. “Livrar” é claro, digno e adequado ao paralelismo.
theological_decisions:
- issue: Gênero antropológico no singular genérico ἄνθρωπον
  choice: um homem
  alternative: uma pessoa; alguém
  rationale: A tradução preserva a forma masculina singular do texto, entendida de modo representativo, sem acrescentar uma restrição exclusivamente masculina.
- issue: Intensidade da incapacidade dos ídolos
  choice: de modo nenhum podem
  alternative: jamais poderão; certamente não podem
  rationale: A formulação mantém a negação enfática οὐ μή e apresenta a declaração como incapacidade total, sem linguagem arcaica.
- issue: Relação entre περιστήσωσιν e εἰς ὅρασιν
  choice: pôr de pé ... para que veja
  alternative: fazer ... enxergar
  rationale: O texto principal conserva a imagem verbal mais concreta e deixa em aberto se a expressão inteira deve ser entendida de forma mais ampla como dar visão; essa possibilidade é explicitada na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “podem” torna explícito em ambos os membros o paralelismo enfático do grego; a construção menos comum “pôr de pé [...] para que veja” foi mantida para preservar a ambiguidade do original e é esclarecida em nota.
