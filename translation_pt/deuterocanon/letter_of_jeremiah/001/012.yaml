  text: They wipe off their faces because of the dust from the house[a], which is thick upon them.
translation:
  language: pt
  text: Limpam-lhes o rosto por causa da poeira da casa, que está em maior quantidade sobre eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “que é mais sobre eles”, isto é, que está em maior quantidade sobre eles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκμάσσονται
  choice: Limpam
  rationale: A forma média/passiva pode ter sentido reflexivo ou ser entendida no contexto como o cuidado dispensado às imagens. A formulação portuguesa mantém a ação concreta sem introduzir explicitamente um agente ausente do grego.
- source_word: τὸ πρόσωπον αὐτῶν
  choice: o rosto deles
  rationale: Preserva o singular coletivo do grego e o pronome plural, com referência às imagens mencionadas no contexto.
- source_word: διὰ τὸν ... κονιορτόν
  choice: por causa da poeira
  rationale: διά com acusativo tem valor causal; κονιορτός designa especificamente poeira.
- source_word: ἐκ τῆς οἰκίας
  choice: da casa
  rationale: Traduz οἰκία diretamente, sem especificar 'templo' ou 'santuário', sentidos contextualmente possíveis mas não expressos no substantivo grego.
- source_word: ὃς ἐστιν πλείω ἐπʼ αὐτοῖς
  choice: que se acumula em maior quantidade sobre eles
  rationale: πλείω exprime quantidade maior ou excessiva. 'Se acumula em maior quantidade' torna natural a construção elíptica grega e conserva a noção comparativa, sem a reduzir simplesmente a 'espessa'.
theological_decisions:
- issue: Agente de ἐκμάσσονται e referente dos pronomes
  choice: Manter o sujeito gramatical implícito em 'Limpam', com os pronomes referindo-se às imagens
  alternative: 'Explicitar: ''Seus cuidadores limpam o rosto delas'' ou traduzir reflexivamente: ''Elas limpam o próprio rosto'''
  rationale: O contexto satírico apresenta as imagens como objetos dependentes de cuidado humano, mas o verso não nomeia os cuidadores. A tradução evita atribuir autonomia inequívoca aos ídolos e também evita inserir um agente não expresso.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário concreto. 'Casa' preserva a generalidade do original; a nota conserva a construção comparativa incomum de πλείω.
