  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/061.yaml
  text: But when the clouds are commanded by God to move over the whole inhabited world[a], they accomplish what was appointed.
translation:
  language: pt
  text: Mas, quando as nuvens recebem de Deus a ordem de percorrer todo o mundo habitado, elas cumprem o que lhes foi determinado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “elas executam o que lhes foi ordenado”. O grego τὸ ταχθέν pode enfatizar aquilo que foi ordenado ou determinado para elas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεφέλαις
  choice: as nuvens
  rationale: O dativo plural integra a construção condicional-temporal e fornece o sujeito lógico; em português, “as nuvens” explicita esse sujeito de modo natural.
- source_word: ἐπιταγῇ ὑπὸ τοῦ θεοῦ
  choice: recebem de Deus a ordem
  rationale: A formulação portuguesa exprime com naturalidade o aoristo passivo de ἐπιτάσσω e preserva Deus como agente da ordem.
- source_word: ἐπιπορεύεσθαι
  choice: de percorrer
  rationale: No contexto do deslocamento das nuvens sobre toda a οἰκουμένη, “percorrer” comunica movimento através de uma vasta extensão sem rigidez excessiva.
- source_word: ἐφʼ ὅλην τὴν οἰκουμένην
  choice: todo o mundo habitado
  rationale: Preserva o sentido próprio de οἰκουμένη como o mundo em que vivem seres humanos e mantém o alcance universal da expressão.
- source_word: συντελοῦσι
  choice: elas cumprem
  rationale: O verbo indica levar algo à realização ou execução; “cumprem” é atual, claro e adequado a uma ordem ou incumbência.
- source_word: τὸ ταχθέν
  choice: o que lhes foi determinado
  rationale: Reproduz o particípio passivo substantivado de τάσσω e explicita apenas o referente contextual às nuvens, sem definir além do texto a natureza da determinação.
theological_decisions:
- issue: Relação de τὸ ταχθέν com a soberania divina
  choice: o que lhes foi determinado
  alternative: o que lhes foi ordenado
  rationale: “Determinado” conserva a ideia de uma tarefa estabelecida por Deus sem transformar a frase em uma afirmação mais ampla sobre determinismo; a nota registra a nuance igualmente possível de ordem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção evita literalismo rígido, preservando a agência divina, o alcance de οἰκουμένη e a nuance passiva de τὸ ταχθέν.
