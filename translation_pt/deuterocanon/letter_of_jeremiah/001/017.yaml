  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/017.yaml
  text: And just as the courts are secured around one who has wronged a king[a], as one being led away to death, so the priests fortify their houses with doors and locks and bars[b], so that they may not be plundered by robbers.
translation:
  language: pt
  text: E, assim como os pátios são cercados em torno de alguém que ofendeu um rei[a], como alguém levado à morte, os sacerdotes fortificam as casas deles[b] com portas, fechaduras e barras, para que não sejam saqueadas por ladrões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os pátios são fechados ao redor de alguém que ofendeu o rei”. A construção inicial é sintaticamente difícil, mas a imagem parece ser a de forte vigilância em torno de um condenado.'
    reason: lexical_alternative
  - marker: b
    text: “As casas deles” refere-se às casas ou aos edifícios cultuais dos ídolos, guardados pelos sacerdotes.
    reason: cultural_note
lexical_decisions:
- source_word: περιτετράχηλαι εἰσὶν αἱ αὐλαί
  choice: os pátios são cercados em torno
  rationale: A expressão grega é difícil; αὐλαί designa pátios ou átrios, e a forma passiva perfeita comunica que estão cercados ou protegidos. A tradução conserva a imagem espacial sem especificar uma estrutura arquitetônica além do texto.
- source_word: τινὶ ἠδικηκότι βασιλέα
  choice: alguém que ofendeu um rei
  rationale: ἀδικέω indica cometer injustiça ou agir contra alguém. “Ofendeu” mantém aqui o sentido de transgressão contra a autoridade real sem pressupor o delito específico.
- source_word: ὡς ἐπὶ θάνατον ἀπηγμένῳ
  choice: como alguém levado à morte
  rationale: ἀπάγω sugere conduzir alguém sob custódia. A formulação preserva tanto o movimento quanto a gravidade, sem explicitar “execução”, que seria mais interpretativo.
- source_word: ὀχυροῦσιν
  choice: fortificam
  rationale: O verbo significa tornar forte ou fortificar. A escolha preserva a ironia de sacerdotes protegerem as casas dos ídolos como fortalezas vulneráveis.
- source_word: τοὺς οἴκους αὐτῶν
  choice: as casas deles
  rationale: οἴκους significa literalmente “casas”. O referente contextual são as casas ou edifícios cultuais dos ídolos; a tradução literal mantém a formulação grega, e a nota esclarece o referente.
- source_word: θυρώμασιν τε καὶ κλείθροις καὶ μοχλοῖς
  choice: com portas, fechaduras e trancas
  rationale: Os três substantivos enumeram dispositivos físicos de segurança. A sequência é clara em português atual e conserva o efeito cumulativo do grego.
- source_word: συληθῶσι
  choice: sejam saqueadas
  rationale: συλάω pode significar despojar ou saquear. “Saqueadas” convém ao roubo de bens guardados nesses edifícios.
- source_word: λῃστῶν
  choice: ladrões
  rationale: λῃσταί designa ladrões ou salteadores, por vezes violentos. “Ladrões” é a opção mais direta e amplamente compreensível neste contexto.
theological_decisions:
- issue: Referente de “as casas deles” no contexto da crítica à idolatria
  choice: Manter “as casas deles” no texto e explicar que se trata das casas ou edifícios cultuais dos ídolos.
  alternative: Traduzir diretamente como “seus templos” ou “seus santuários”.
  rationale: A opção conserva o sentido lexical de οἴκους e a força retórica do original sem inserir no texto principal um termo cultual mais específico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “alguém” conserva a comparação do grego, embora sua sintaxe seja incomum; a nota registra essa dificuldade sem resolvê-la de modo excessivamente interpretativo.
