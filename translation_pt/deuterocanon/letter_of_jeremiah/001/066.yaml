  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/066.yaml
  text: They will certainly not show signs in the heavens among the nations[a], nor will they shine like the sun, nor give light like the moon.
translation:
  language: pt
  text: Eles de modo algum mostrarão, entre as nações, sinais no céu[a], nem brilharão como o sol, nem darão luz como a lua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como “no firmamento”. A palavra grega οὐρανός pode referir-se ao céu em sentido amplo ou ao céu visível; o contexto trata de fenômenos celestes.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖά
  choice: sinais
  rationale: É o equivalente mais amplo e natural, adequado a fenômenos celestes sem especificá-los necessariamente como presságios ou prodígios.
- source_word: ἐν ἔθνεσιν
  choice: entre as nações
  rationale: Traduz ἔθνη como povos ou nações e evita introduzir o sentido neotestamentário mais específico de “gentios”.
- source_word: ἐν οὐρανῷ
  choice: no céu
  rationale: “Céu” conserva a amplitude de οὐρανός, que pode designar tanto o céu em sentido religioso quanto o espaço celeste visível; aqui o contexto é o dos fenômenos celestes.
- source_word: οὐ μὴ δείξωσιν
  choice: de modo algum mostrarão
  rationale: A construção οὐ μή com o subjuntivo expressa negação enfática; esta formulação mantém essa força em português corrente e digno.
- source_word: λάμψουσιν
  choice: brilharão
  rationale: Verbo direto e natural na comparação com o sol.
- source_word: φωτιοῦσιν
  choice: darão luz
  rationale: Expressa o fornecimento de luz e preserva a distinção em relação ao verbo anterior, “brilhar”.
- source_word: σελήνη
  choice: lua
  rationale: Equivalente comum e inequívoco para o corpo celeste mencionado.
theological_decisions:
- issue: Referente dos verbos no plural e sujeito implícito
  choice: Empregar “Eles”, retomando minimamente os ídolos do contexto anterior.
  alternative: Explicitar “os ídolos” ou “os falsos deuses”.
  rationale: O grego traz verbos no plural sem repetir o sujeito. O pronome mantém a continuidade do discurso sem acrescentar ao versículo uma identificação mais explícita do que a fonte oferece.
- issue: Relação dos complementos “entre as nações” e “no céu”
  choice: Dispor “entre as nações” como âmbito em que os sinais celestes não serão mostrados.
  alternative: Manter a ordem linear “sinais entre as nações no céu”, que em português produz ligação sintática pouco clara.
  rationale: A colocação escolhida comunica naturalmente os dois complementos gregos sem ampliar a alegação nem eliminar a referência a fenômenos celestes.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A negação enfática foi preservada sem rigidez, e os verbos “brilhar” e “dar luz” mantêm a distinção do grego.
