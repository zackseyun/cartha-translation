  text: Likewise[a], when lightning appears, it is clearly seen; and in the same way the wind blows in every land.
translation:
  language: pt
  text: Da mesma forma, quando o relâmpago aparece, é claramente visível; e, igualmente, o vento[a] sopra em cada região.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra grega πνεῦμα também pode significar “espírito” ou “sopro”; aqui, porém, o contexto dos fenômenos naturais e o verbo “sopra” favorecem “vento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  choice: Da mesma forma
  rationale: Introduz uma comparação paralela às anteriores e conserva de modo natural a força comparativa do grego.
- source_word: ἀστραπή
  choice: relâmpago
  rationale: É o equivalente português corrente para o fenômeno luminoso designado pelo substantivo grego.
- source_word: ὅταν ἐπιφάνῃ
  choice: quando o relâmpago aparece
  rationale: Mantém o sentido de aparecer ou tornar-se visível; a repetição do sujeito em português evita ambiguidade.
- source_word: εὔοπτός ἐστιν
  choice: é claramente visível
  rationale: Expressa que algo é fácil de ver, evidente ou manifesto, com linguagem natural e digna.
- source_word: τὸ δʼ αὐτό
  choice: e, igualmente
  rationale: Comunica de maneira fluida a retomada da comparação, literalmente ligada à ideia de que o mesmo se dá também.
- source_word: πνεῦμα
  choice: vento
  rationale: O contexto de fenômenos naturais e o verbo πνεῖ, “sopra”, favorecem claramente o sentido meteorológico.
- source_word: ἐν πάσῃ χώρᾳ
  choice: em toda região
  rationale: χώρα pode indicar terra, região ou território; “toda região” preserva a abrangência sem restringir o sentido a países politicamente definidos.
- source_word: πνεῖ
  choice: sopra
  rationale: Preserva o presente gnômico, que enuncia uma verdade geral sobre o vento.
theological_decisions:
- issue: Sentido de πνεῦμα, termo com possível carga teológica
  choice: vento
  alternative: espírito ou sopro
  rationale: Embora πνεῦμα também possa significar “espírito” ou “sopro”, a enumeração de fenômenos naturais observáveis, sua associação com πνεῖ (“sopra”) e a referência a toda região favorecem o sentido meteorológico, sem introduzir uma leitura pneumatológica alheia ao contexto.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A formulação conserva o paralelismo e o presente de verdade geral, evitando tanto literalismo rígido quanto explicitação teológica indevida.
