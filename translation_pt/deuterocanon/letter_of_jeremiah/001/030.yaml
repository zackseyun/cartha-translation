  text: And in their houses the priests sit in state[a], having their tunics torn, and their heads and beards shaved, with their heads uncovered,
translation:
  language: pt
  text: E, nas casas deles, os sacerdotes sentam-se solenemente[a], com túnicas rasgadas, cabeças e barbas raspadas e as cabeças descobertas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sentam-se em assentos”. O verbo grego está ligado à ideia de assento, inclusive um assento cerimonial ou de carro; neste contexto dentro de casas, o sentido de andar de carro é menos provável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διφρεύουσιν
  choice: sentam-se solenemente
  rationale: O verbo deriva de uma palavra que designa assento ou banco, inclusive assento de carro, e pode sugerir uma postura sentada cerimonial. No contexto de casas, a referência a andar de carro é menos provável; a tradução comunica a postura sem impor uma entronização explícita.
- source_word: χιτῶνας
  choice: túnicas
  rationale: χιτών designa normalmente a peça básica de vestuário, mais precisamente uma túnica, e não uma veste exterior formal.
- source_word: διερρωγότας
  choice: rasgadas
  rationale: O particípio perfeito indica túnicas que foram rasgadas e permanecem nesse estado.
- source_word: ἐξυρημένους
  choice: raspadas
  rationale: O termo indica a remoção dos cabelos e pelos por meio de raspagem; em português, concorda naturalmente com “a cabeça e a barba”.
- source_word: ἀκάλυπτοί
  choice: descoberta
  rationale: O adjetivo significa sem cobertura; “cabeça descoberta” é a formulação direta e idiomática.
- source_word: οἴκοις
  choice: casas
  rationale: Preserva o sentido explícito do grego sem restringi-lo interpretativamente a templos ou santuários.
theological_decisions:
- issue: Descrição cultual dos sacerdotes pagãos
  choice: Apresentar somente os aspectos visíveis — postura sentada, túnicas rasgadas, cabeça e barba raspadas e cabeça descoberta.
  alternative: Identificar essas ações expressamente como ritos de luto, êxtase ritual ou entronização sacerdotal.
  rationale: O grego enumera práticas concretas, mas não explica sua finalidade. A tradução evita acrescentar uma interpretação ritual ou doutrinária que o texto não declara.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Os plurais gregos referentes a cabeças e barbas foram vertidos pelo singular distributivo, mais natural em português, sem mudança de sentido.
