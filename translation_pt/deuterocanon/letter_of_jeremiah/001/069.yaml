base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/069.yaml
  text: For just as in a cucumber patch there is nothing guarding it[a], so their gods are wooden and overlaid with gold and silver.
translation:
  language: pt
  text: Pois, assim como numa plantação de pepinos não há nada que a guarde[a], assim também os deuses deles são de madeira, revestidos de ouro e prata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega traduzida por “não há nada que a guarde” é textual e lexicalmente difícil; o sentido parece ser que a plantação de pepinos está sem proteção ou vigilância.
    reason: textual_variant
lexical_decisions:
- source_word: σικυηράτῳ
  choice: plantação de pepinos
  rationale: O substantivo designa um terreno plantado com pepinos ou outras cucurbitáceas. “Plantação de pepinos” mantém a imagem agrícola com clareza em português.
- source_word: προβάσκάινόν ... φυλάσσον
  choice: não há nada que a guarde
  rationale: A expressão grega transmitida é textual e lexicalmente difícil. Esta formulação comunica com naturalidade a ideia contextual de uma plantação sem proteção ou vigilância, sem impor uma reconstrução específica.
- source_word: θεοὶ
  choice: deuses
  rationale: Traduz diretamente o termo grego e preserva a força polêmica do texto, que em seguida expõe a natureza material desses supostos deuses.
- source_word: ξύλινοι
  choice: de madeira
  rationale: Expressão portuguesa natural e direta para a descrição do material.
- source_word: περίχρυσοι καὶ περιάργυροι
  choice: revestidos de ouro e prata
  rationale: Os adjetivos indicam objetos cobertos de ouro e prata, não feitos integralmente desses metais. A coordenação evita repetição desnecessária e preserva o paralelismo.
theological_decisions:
- issue: Traduzir θεοὶ literalmente ou substituí-lo pelo termo interpretativo “ídolos”
  choice: deuses
  alternative: ídolos
  rationale: O grego chama esses objetos de “deuses” no contexto da própria polêmica e logo os descreve como madeira revestida. Manter “deuses” preserva a retórica e evita antecipar a interpretação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Plantação de pepinos” soa mais natural do que uma construção excessivamente literal; “revestidos” expressa que os objetos apenas recebem uma cobertura metálica.
