  text: How then can the things made by them endure? For they have left behind lies and disgrace for those who come after[a][b].
translation:
  language: pt
  text: Como, então, poderão durar as coisas fabricadas por eles?[a] Pois deixaram para os que vierem depois mentiras e desonra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que futuro terão as coisas fabricadas por eles?” O grego formula uma pergunta retórica sobre a continuidade dessas obras humanas.'
    reason: alternative_reading
lexical_decisions:
- source_word: πῶς τε δὴ
  choice: Como, então
  rationale: A pergunta retórica e as partículas inferenciais e enfáticas são expressas de modo natural, sem uma reprodução mecânica de cada partícula.
- source_word: μέλλει
  choice: poderão durar
  rationale: Neste enunciado elíptico e prospectivo, o verbo questiona que futuro ou continuidade podem ter os objetos mencionados. “Poderão durar” comunica essa força retórica em português corrente.
- source_word: τὰ ὑπʼ αὐτῶν κατασκευασθέντα
  choice: as coisas fabricadas por eles
  rationale: Mantém o referente gramatical geral do grego e destaca que se trata de objetos produzidos por mãos humanas, sem inserir explicitamente “ídolos” no texto.
- source_word: κατέλιπον
  choice: deixaram
  rationale: Expressa o resultado legado às pessoas posteriores; o contexto torna desnecessário acrescentar “para trás”.
- source_word: ψεύδη
  choice: mentiras
  rationale: Tradução direta e clara do plural, adequada à denúncia da falsidade dos objetos cultuais.
- source_word: ὄνειδος
  choice: desonra
  rationale: Abrange a ideia de vergonha pública, opróbrio ou descrédito deixado como legado.
- source_word: τοῖς ἐπιγινομένοις
  choice: para os que vierem depois
  rationale: Preserva a referência aberta a pessoas ou gerações posteriores em linguagem natural.
theological_decisions:
- issue: Referente das coisas fabricadas
  choice: Conservar a expressão geral “as coisas fabricadas por eles” no texto principal.
  alternative: Explicitar “os ídolos fabricados por eles”.
  rationale: O contexto aponta para ídolos ou objetos de culto, mas o grego deste versículo emprega uma designação geral; a tradução não acrescenta o referente contextual ao texto.
- issue: Sentido prospectivo de μέλλει
  choice: Traduzir a pergunta como dúvida sobre a duração dos objetos.
  alternative: “Que futuro terão as coisas fabricadas por eles?”
  rationale: A construção grega é concisa e elíptica. “Poderão durar” preserva a pergunta retórica sobre a continuidade ou viabilidade dessas obras sem transformá-la numa afirmação doutrinária mais específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Fabricadas” é concreto e natural para objetos feitos por seres humanos; “os que vierem depois” evita o tom excessivamente erudito de “posteridade”. O advérbio “apenas” explicita a força predicativa do legado de mentiras e desonra, sem alterar seu conteúdo.
