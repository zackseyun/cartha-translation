  text: But they howl, shouting before their gods, like some at a funeral meal for the dead.
translation:
  language: pt
  text: Mas eles uivam e gritam diante de seus deuses, como alguns em um banquete fúnebre por um morto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «numa refeição por um morto» ou «num banquete funerário». O grego se refere a uma refeição de luto ou funerária ligada a uma pessoa falecida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠρύονται
  choice: uivam
  rationale: Preserva a imagem vívida e depreciativa de um clamor alto, semelhante ao de um animal ou a uma lamentação.
- source_word: βοῶντες
  choice: gritando
  rationale: Expressa a vocalização forte do particípio e forma uma combinação natural com «uivam».
- source_word: ἐναντίον
  choice: diante de
  rationale: Mantém o sentido espacial primário de estar na frente ou na presença dos deuses.
- source_word: θεῶν
  choice: deuses
  rationale: Traduz diretamente o grego, sem substituir interpretativamente os referentes por «ídolos».
- source_word: ὥσπερ τινὲς
  choice: como alguns
  rationale: Conserva de modo conciso o marcador comparativo e o pronome indefinido plural.
- source_word: ἐν περιδείπνῳ νεκροῦ
  choice: num banquete fúnebre por um morto
  rationale: Comunica uma refeição ligada ao luto ou aos ritos funerários de uma pessoa falecida, preservando a concisão e a ambiguidade cultural da expressão grega.
theological_decisions:
- issue: Tradução de θεῶν em contexto anti-idolatria
  choice: deuses
  alternative: ídolos
  rationale: Embora o contexto identifique esses deuses como ídolos, o texto grego diz literalmente «deuses». Manter essa forma preserva a formulação e a força polêmica da fonte.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Uivam» retém a força satírica do grego; «banquete fúnebre» evita formulações excessivamente técnicas, e a nota registra alternativas legítimas.
