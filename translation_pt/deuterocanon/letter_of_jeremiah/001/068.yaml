lexical_decisions:
- source_word: κατʼ οὐδένα ... τρόπον
  choice: de modo algum
  rationale: Expressa a negação enfática e total do idioma grego em português atual e natural.
- source_word: φανερὸν
  choice: evidente
  rationale: Preserva o sentido epistemológico de algo manifesto ou claramente reconhecível, sem transformar a afirmação em uma negação mais absoluta do que o grego formula.
- source_word: θεοί
  choice: deuses
  rationale: Traduz diretamente o plural grego e mantém a força da polêmica contra os ídolos considerados deuses.
- source_word: μὴ φοβῆσθε
  choice: não tenham medo
  rationale: Verte de maneira clara e corrente a proibição dirigida a uma pluralidade de ouvintes.
- source_word: διό
  choice: por isso
  rationale: Mantém a inferência entre a falta de evidência da divindade dos ídolos e a ordem de não temê-los.
theological_decisions:
- issue: Referente de αὐτούς na cláusula final
  choice: eles, isto é, os ídolos falsamente considerados deuses
  alternative: explicitar como “esses ídolos”
  rationale: O pronome preserva a forma do grego e remete naturalmente aos objetos discutidos no contexto, sem acrescentar uma explicação interpretativa ao texto principal.
- issue: Força da declaração sobre a divindade dos ídolos
  choice: “não é evidente ... que eles sejam deuses”
  alternative: “eles não são deuses”
  rationale: A formulação escolhida conserva a estrutura epistemológica e a tensão retórica do original, sem convertê-la silenciosamente numa negação ontológica direta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Não tenham medo” soa mais natural no uso corrente do que “não os temam”, sem perder a força imperativa.
