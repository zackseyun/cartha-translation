  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/029.yaml
  text: For how could they be called gods[b][a], since women set out offerings before silver and gold and wooden gods?
translation:
  language: pt
  text: Pois, como poderiam ser chamados deuses,[a] visto que mulheres colocam oferendas[b] diante de deuses de prata, ouro e madeira?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “De onde poderiam ser chamados deuses?”'
    reason: lexical_alternative
  - marker: b
    text: O grego também pode ser traduzido como “colocam diante de” ou “apresentam [algo] a”. O objeto “oferendas” não está expresso, mas é implícito no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν
  choice: como
  rationale: Na pergunta retórica Πόθεν ... κληθείησαν, exprime a impossibilidade ou falta de fundamento para chamá-los deuses; “como” é natural em português moderno.
- source_word: κληθείησαν
  choice: poderiam ser chamados
  rationale: O optativo aoristo passivo comunica possibilidade em uma pergunta retórica, aqui com força de contestação.
- source_word: θεοί / θεοῖς
  choice: deuses
  rationale: Mantém a designação explícita e a ironia polêmica do grego, sem substituí-la interpretativamente por “ídolos”.
- source_word: ὅτι
  choice: se
  rationale: Neste contexto, introduz a circunstância que fundamenta a pergunta retórica; “se” produz em português a ligação causal-argumentativa com naturalidade.
- source_word: γυναῖκες
  choice: mulheres
  rationale: Correspondência direta que preserva a referência específica do texto.
- source_word: παρατιθέασιν
  choice: põem oferendas diante de
  rationale: O verbo significa colocar ou apresentar diante de alguém; “oferendas” explicita com moderação o objeto cultual implícito no contexto.
- source_word: ἀργυροῖς καὶ χρυσοῖς καὶ ξυλίνοις
  choice: de prata, de ouro e de madeira
  rationale: Expressa claramente os materiais dos pretensos deuses e conserva a enumeração grega.
theological_decisions:
- issue: Traduzir θεοί como “deuses” ou “ídolos”
  choice: deuses
  alternative: ídolos
  rationale: O texto chama esses objetos de “deuses” de modo irônico e em seguida põe em dúvida essa designação; “deuses” preserva a estrutura do argumento.
- issue: Grau de explicitação da ação cultual em παρατιθέασιν
  choice: põem oferendas diante de
  alternative: põem diante de / apresentam a
  rationale: O objeto do verbo não aparece expresso no grego, mas o contexto cultual indica aquilo que é apresentado. A inclusão de “oferendas” torna a frase compreensível sem definir indevidamente a natureza exata dos itens.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção retórica e a repetição de “deuses” foram preservadas; a ordem dos marcadores foi normalizada para corresponder às respectivas notas.
