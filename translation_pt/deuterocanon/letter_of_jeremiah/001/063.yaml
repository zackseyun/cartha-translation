  text: Therefore they are to be regarded neither as gods nor to be called gods, since they are unable either to judge a case or to do good to people.
translation:
  language: pt
  text: Portanto, eles não devem ser considerados deuses nem chamados de deuses, pois não são capazes nem de julgar uma causa nem de fazer o bem às pessoas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅθεν
  choice: Portanto
  rationale: Introduz a conclusão decorrente do argumento anterior e preserva com naturalidade a força inferencial.
- source_word: νομιεῖσθαι
  choice: ser considerados
  rationale: Expressa serem tidos ou reconhecidos como algo segundo uma avaliação, em linguagem portuguesa atual.
- source_word: κλητέον ὑπάρχειν αὐτοὺς θεούς
  choice: chamados de deuses
  rationale: A construção indica a designação que não lhes deve ser atribuída; a formulação mantém o paralelismo com “ser considerados deuses” sem reproduzir de modo rígido a sintaxe grega.
- source_word: οὐ δυνατῶν ὄντων αὐτῶν
  choice: pois não são capazes
  rationale: O genitivo absoluto apresenta a razão da conclusão; “pois” explicita sua força causal.
- source_word: κρίσιν κρῖναι
  choice: julgar uma causa
  rationale: O uso cognato tem sentido judicial; “julgar uma causa” conserva esse âmbito e é claro em português.
- source_word: εὖ ποιεῖν
  choice: fazer o bem
  rationale: Reproduz de maneira idiomática a ideia de agir beneficamente.
- source_word: ἀνθρώποις
  choice: às pessoas
  rationale: Refere-se genericamente aos seres humanos e evita uma forma marcada por gênero.
theological_decisions:
- issue: Negação da divindade dos ídolos
  choice: não devem ser considerados deuses nem chamados de deuses
  alternative: não devem ser tidos por deuses nem receber o nome de deuses
  rationale: Mantém a dupla negação do texto, que rejeita tanto o reconhecimento quanto a designação dos ídolos como deuses, sem acrescentar uma explicação metafísica.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão e com boa legibilidade brasileira. A coordenação correlativa “nem... nem...” preserva a estrutura enfática do grego.
