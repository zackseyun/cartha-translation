base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/014.yaml
  text: In his right hand he holds a dagger and an axe[a], but he cannot rescue himself from war and robbers. Therefore it is evident that they are not gods[b]; so do not fear them.
translation:
  language: pt
  text: Ele tem na mão direita um punhal[a] e um machado, mas não consegue livrar a si mesmo da guerra e dos ladrões[b]. Por isso, é evidente que eles não são deuses; portanto, não tenham medo deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espada curta”. O termo grego designa uma arma empunhada.
    reason: lexical_alternative
  - marker: b
    text: Ou “salteadores”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγχειρίδιον
  choice: punhal
  rationale: Designa uma arma empunhada, geralmente um punhal ou uma espada curta. “Punhal” é natural em português e se harmoniza com a imagem paralela do machado.
- source_word: δεξιᾷ
  choice: na mão direita
  rationale: O dativo tem sentido locativo ou instrumental junto de ἔχει; “na mão direita” expressa a imagem com clareza e naturalidade.
- source_word: πέλεκυν
  choice: machado
  rationale: É o equivalente comum e suficientemente amplo; “machadinha” seria mais específico do que o grego permite afirmar.
- source_word: ἐξελεῖται
  choice: livrar a si mesmo
  rationale: A forma média, reforçada por ἑαυτόν, comunica que o ídolo é incapaz de obter o próprio livramento.
- source_word: λῃστῶν
  choice: ladrões
  rationale: O termo pode indicar ladrões ou salteadores. “Ladrões” é amplamente compreensível, enquanto a nota preserva a nuance de violência organizada possível no contexto.
- source_word: ὅθεν
  choice: por isso
  rationale: Introduz a conclusão extraída da incapacidade do ídolo de proteger a si mesmo.
- source_word: γνῶριμοί εἰσιν
  choice: é evidente
  rationale: A expressão indica que a verdadeira condição dos ídolos pode ser claramente reconhecida; esta formulação transmite seu valor idiomático sem acrescentar uma explicação teológica.
- source_word: οὐκ ὄντες θεοί
  choice: eles não são deuses
  rationale: Converte a construção participial em uma oração finita natural, preservando a afirmação direta de que tais imagens não possuem divindade.
- source_word: μὴ οὖν φοβηθῆτε αὐτούς
  choice: portanto, não tenham medo deles
  rationale: Mantém tanto a força conclusiva de οὖν quanto o caráter exortativo da proibição.
theological_decisions:
- issue: Mudança de número entre a descrição singular do ídolo e a conclusão plural
  choice: Manter o singular na descrição (“Ele tem... não consegue livrar a si mesmo”) e o plural na conclusão (“eles não são deuses... não tenham medo deles”).
  alternative: Uniformizar todo o versículo no plural.
  rationale: O grego passa deliberadamente de um ídolo representativo no singular para toda a classe de ídolos no plural. Preservar essa mudança conserva a forma e a força retórica da fonte.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão internacional. Emprega “Ele” para o ídolo singular representativo e conserva a passagem ao plural presente no grego.
