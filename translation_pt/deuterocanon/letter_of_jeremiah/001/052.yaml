  text: For they will certainly not raise up a king for a land, nor will they certainly give rain to men,
translation:
  language: pt
  text: Pois eles de modo algum estabelecerão um rei para uma terra[a], nem de modo algum darão chuva aos seres humanos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para um país” ou “para uma região”. O grego χώρα pode significar terra, país ou região.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλέα
  choice: um rei
  rationale: Acusativo singular, objeto de ἀναστήσωσιν; o artigo indefinido expressa naturalmente em português o substantivo grego sem artigo.
- source_word: χώρας
  choice: para uma terra
  rationale: χώρα pode designar terra, país ou região. “Terra” mantém a amplitude territorial do termo sem sugerir necessariamente o Estado-nação moderno.
- source_word: οὐ μὴ ἀναστήσωσιν
  choice: de modo algum estabelecerão
  rationale: οὐ μή com o subjuntivo aoristo forma uma negação futura enfática. “Estabelecerão” comunica aqui a ideia de instituir ou fazer surgir um governante.
- source_word: ὑετόν
  choice: chuva
  rationale: Equivalente corrente e direto do termo grego para chuva.
- source_word: ἀνθρώποις
  choice: aos seres humanos
  rationale: O plural de ἄνθρωπος tem referência genérica neste contexto; “seres humanos” preserva explicitamente essa abrangência em português.
- source_word: οὐ μὴ δῶσιν
  choice: nem de modo algum darão
  rationale: Reproduz a segunda negação futura enfática e sua coordenação com a primeira oração.
- source_word: γάρ
  choice: pois
  rationale: Mantém a função explicativa e argumentativa da partícula.
theological_decisions:
- issue: Referência genérica de ἀνθρώποις
  choice: aos seres humanos
  alternative: aos homens; às pessoas
  rationale: A afirmação trata da incapacidade dos ídolos de beneficiar a humanidade em geral. “Seres humanos” torna inequívoca a referência genérica sem introduzir uma restrição masculina.
- issue: Força da dupla construção οὐ μή
  choice: de modo algum... nem de modo algum
  alternative: certamente não... nem certamente; jamais... nem jamais
  rationale: A repetição preserva a forte negação futura em ambas as orações sem transformar a afirmação em impossibilidade metafísica mais específica.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego. A repetição de “de modo algum” conserva a ênfase das duas construções οὐ μή. A vírgula final foi mantida porque o versículo fornecido integra uma sequência sintática maior.
