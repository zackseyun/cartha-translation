  text: In the same way[a], their wooden gods overlaid with gold and silver are made like a scarecrow in a garden, on which every bird sits, and also like a dead body thrown out in the dark.
translation:
  language: pt
  text: Do mesmo modo, seus deuses, feitos de madeira e revestidos de ouro e prata, são semelhantes a um espantalho[a] em um jardim, sobre o qual toda ave pousa, bem como a um cadáver atirado na escuridão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um poste” ou “uma figura de guarda num jardim”. O termo grego é raro; a imagem é de um objeto colocado em um jardim, sobre o qual as aves pousam livremente.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν αὐτὸν τρόπον
  choice: Do mesmo modo
  rationale: Expressa de maneira natural a introdução comparativa do grego.
- source_word: τῇ ἐν κήπῳ βάμψῳ
  choice: a um espantalho num jardim
  rationale: O termo βάμψη é raro, mas o contexto descreve um objeto ou figura colocado num jardim e usado pelas aves como poleiro. “Espantalho” comunica a imagem com clareza, enquanto a nota preserva a incerteza lexical.
- source_word: ἐφ’ ἧς πᾶν τὸ ὄρνεον ἐπικάθηται
  choice: sobre o qual toda ave pousa
  rationale: Mantém a oração relativa e o contraste irônico entre a suposta função do objeto e as aves que pousam nele livremente.
- source_word: τῷ νεκρῷ ἐρριμμένῳ ἐν σκότει
  choice: a um cadáver atirado na escuridão
  rationale: Traduz νεκρός concretamente como “cadáver”, conserva a ideia de ter sido lançado ou descartado em ἐρριμμένῳ e não dá a “escuridão” um sentido metafísico ausente do texto.
- source_word: ἀφωμοίωνται
  choice: são semelhantes
  rationale: Reproduz de forma idiomática o sentido de assimilação ou comparação do perfeito passivo, evitando a construção portuguesa pouco natural “foram feitos semelhantes”.
- source_word: οἱ θεοὶ αὐτῶν ξύλινοι καὶ περίχρυσοι καὶ περιάργυροι
  choice: os deuses deles, feitos de madeira e revestidos de ouro e prata
  rationale: Deixa claro que a matéria é madeira e que ouro e prata formam o revestimento exterior.
theological_decisions:
- issue: Natureza da comparação no contexto da crítica à idolatria
  choice: 'Conservar as duas imagens de objetos inertes e impotentes: o espantalho do jardim e o cadáver descartado.'
  alternative: Traduzir βάμψη de modo mais literal e incerto como “poste” ou “figura de vigia”.
  rationale: A comparação sustenta a crítica aos ídolos sem acrescentar uma explicação doutrinária. A nota registra a ambiguidade lexical da primeira imagem.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para evitar uma frase artificial, mantendo as duas comparações e os qualificadores dos ídolos.
