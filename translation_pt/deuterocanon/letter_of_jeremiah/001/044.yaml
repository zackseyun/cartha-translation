  text: Everything that happens to them is false[a]; how then should one suppose or call them gods?
translation:
  language: pt
  text: Tudo o que lhes acontece é falso; como, então, se deve pensar ou dizer que eles existem como deuses?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como, então, se deve considerá-los ou chamá-los de deuses?” O grego inclui explicitamente no fim o verbo ὑπάρχειν, “existir” ou “ser”.'
    reason: Alternativa sintática e lexical que registra a construção mais compacta e a presença explícita do verbo de existência no grego.
lexical_decisions:
- source_word: πάντα τὰ γενόμενα αὐτοῖς
  choice: Tudo o que acontece com eles
  rationale: Mantém a abrangência de πάντα e o sentido amplo de γενόμενα como aquilo que acontece ou vem a ocorrer em relação aos ídolos, sem especificar uma causa não expressa no grego.
- source_word: ψευδῆ
  choice: é falso
  rationale: O adjetivo predicativo caracteriza coletivamente tudo o que acontece com os ídolos como falso, ilusório ou enganoso; “é falso” é conciso e natural em português.
- source_word: πῶς οὖν
  choice: como, então
  rationale: Conserva a pergunta retórica e a conclusão inferencial introduzida por οὖν.
- source_word: νομιστέον
  choice: se deve considerá-los
  rationale: 'O adjetivo verbal tem sentido impessoal e deliberativo: aquilo que se deve pensar ou considerar. A forma escolhida é clara e corrente em português.'
- source_word: ἢ κλητέον
  choice: ou chamá-los
  rationale: Preserva o paralelismo com νομιστέον e o sentido básico de καλέω, “chamar” ou “dar o nome de”.
- source_word: ὡς θεοὺς
  choice: de deuses
  rationale: θεούς significa diretamente “deuses”; com “chamar”, a construção portuguesa idiomática é “chamá-los de deuses”.
- source_word: αὐτοὺς ὑπάρχειν
  choice: como se de fato existissem
  rationale: Torna perceptível o verbo explícito de existência ὑπάρχειν e comunica a força retórica da frase sem transformar a afirmação em uma tese metafísica mais ampla.
theological_decisions:
- issue: Alcance da negação retórica a respeito dos ídolos
  choice: A frase nega que os ídolos tenham existência real como deuses, expressando a nuance existencial com “como se de fato existissem”.
  alternative: Entender αὐτοὺς ὑπάρχειν apenas como parte da construção “considerá-los ou chamá-los de deuses” e omitir uma expressão existencial separada.
  rationale: O grego contém explicitamente ὑπάρχειν. A tradução principal conserva essa informação, enquanto a nota reconhece que sua relação sintática com ὡς θεούς pode ser vertida de modo mais compacto.
translation_notes:
  register: Português moderno, claro e digno, com construção retórica natural. “De fato” explicita a força existencial sem recorrer a vocabulário filosófico técnico. A nota registra a ambiguidade sintática da cláusula final.
