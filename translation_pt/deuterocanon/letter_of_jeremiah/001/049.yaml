  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/049.yaml
  text: How then can one fail to perceive that they are not gods[b][a], since they neither save themselves from war nor from calamities?
translation:
  language: pt
  text: Como, então, alguém pode deixar de perceber[a] que eles não são deuses, visto que não salvam a si mesmos nem da guerra nem das calamidades[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Como, então, não é possível perceber...?” A negação na pergunta retórica grega enfatiza que a conclusão é evidente.'
    reason: lexical_alternative
  - marker: b
    text: Ou “dos males”, “das desgraças” ou “das adversidades”. Aqui, o grego κακῶν se refere a acontecimentos nocivos ou desastres.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν
  choice: Como, então
  rationale: Mantém a forma interrogativa e a força inferencial de οὖν em português natural.
- source_word: οὐκ ἔστιν αἰσθέσθαι
  choice: não perceber
  rationale: Na pergunta retórica, a formulação concisa preserva a negação grega e ressalta que a conclusão é evidente; αἰσθέσθαι indica perceber ou dar-se conta.
- source_word: ὅτι οὐκ εἰσὶν θεοί
  choice: que eles não são deuses
  rationale: Traduz diretamente a negação da condição divina sem substituir θεοί por uma interpretação como “ídolos”.
- source_word: οἳ
  choice: visto que
  rationale: Explicita de modo idiomático o valor explicativo ou causal da oração relativa neste contexto.
- source_word: οὔτε σώζουσιν ἑαυτοὺς
  choice: não salvam a si mesmos nem
  rationale: Preserva o sentido comum de σώζω e a ironia de que os supostos deuses não conseguem livrar nem a si próprios; a correlação com o segundo οὔτε é expressa por “nem... nem”.
- source_word: ἐκ πολέμου
  choice: da guerra
  rationale: πόλεμος designa amplamente guerra, e a preposição indica livramento ou escape dela.
- source_word: ἐκ κακῶν
  choice: das calamidades
  rationale: Neste contexto, κακά aponta naturalmente para males sofridos, desastres ou acontecimentos nocivos, não necessariamente para o mal moral.
theological_decisions:
- issue: Referente de θεοί na polêmica contra a idolatria
  choice: deuses
  alternative: ídolos; seres divinos
  rationale: O grego afirma que eles “não são deuses”. Manter “deuses” conserva a formulação e a tensão polêmica do texto, enquanto o contexto identifica os referentes como falsos deuses.
translation_notes:
  register: Português contemporâneo, claro e digno, de leitura natural no Brasil e compreensível internacionalmente. A pergunta retórica e a ironia do original foram preservadas sem linguagem denominacional.
