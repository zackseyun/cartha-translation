    rationale: A justificativa do rascunho trata a alternância de gênero entre αὐτοὶ e αὐτά como decisiva e fixa referentes que o grego deste versículo deixa pronominais; isso conflita também com a trilha inglesa, que entende αὐτοὶ como os próprios ídolos.
  - severity: medium
    issue: Acréscimo de “isso”
    rationale: νοήσαντες não traz objeto expresso. “Isso” especifica sintaticamente o que o original deixa implícito.
  - severity: medium
    issue: “Discernimento” é mais interpretativo que αἴσθησις
    rationale: “Discernimento” pode sugerir capacidade de julgamento; αἴσθησις designa primariamente percepção ou consciência sensorial.
  - severity: low
