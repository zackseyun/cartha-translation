  source_fidelity: A tradução identifica sem base suficiente αὐτοὶ como os adoradores e αὐτά como os ídolos. O masculino de αὐτοὶ não resolve por si só o referente no contexto, e o inglês de controle o toma como enfático para os próprios ídolos. Além disso, “isso” introduz um objeto explícito ausente do grego, e “discernimento” amplia αἴσθησις (“percepção”, “sensação”, “consciência perceptiva”) para juízo avaliativo. A revisão preserva os referentes e o objeto de modo não especificado.
  naturalness: “E eles próprios não conseguem, embora compreendam, abandonar tais coisas, pois não têm percepção” é português moderno e claro. “Tais coisas” permite verter o plural neutro sem lhe impor o gênero e a identificação de “ídolos”; “percepção” é um pouco formal, mas é apropriado ao registro e à repetição irônica do enunciado.
  terminology: “Eles próprios” conserva a ênfase de αὐτοὶ. “Embora compreendam” reproduz com naturalidade a força concessiva provável de νοήσαντες, enquanto a nota mantém a alternativa participial mais literal. “Percepção” corresponde diretamente a αἴσθησις e evita a carga interpretativa de “discernimento”.
  issues:
