  text: And they themselves cannot[a], even though they perceive it, leave them behind, for they have no perception.
translation:
  language: pt
  text: E eles próprios não conseguem, embora compreendam,[a] abandonar tais coisas, pois não têm percepção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo compreendido, não conseguem abandonar tais coisas”; o particípio grego νοήσαντες também pode ser entendido de modo mais literal, e não como concessivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δύνανται
  choice: não conseguem
  rationale: Expressa incapacidade de modo direto e natural em português atual.
- source_word: αὐτοὶ
  choice: eles próprios
  rationale: Preserva a ênfase do pronome grego. A forma masculina contrasta com αὐτά, neutro, o que favorece entender como sujeitos os próprios adoradores, e não os ídolos.
- source_word: νοήσαντες
  choice: mesmo percebendo isso
  rationale: O particípio aoristo de νοέω é entendido concessivamente no fluxo da frase. “Isso” explicita apenas o objeto implícito da percepção, sem definir além do contexto aquilo que é percebido.
- source_word: καταλιπεῖν
  choice: abandoná-los
  rationale: Transmite o sentido de deixar para trás ou abandonar; aqui o pronome retoma naturalmente os ídolos.
- source_word: αὐτά
  choice: os
  rationale: O pronome grego neutro plural é vertido segundo o gênero português de “ídolos”, preservando a referência pronominal concisa.
- source_word: αἴσθησιν
  choice: discernimento
  rationale: No contexto da incapacidade de reconhecer e abandonar a idolatria, “discernimento” comunica percepção e juízo sem soar técnico ou fisiológico.
- source_word: οὐκ ἔχουσιν
  choice: não têm
  rationale: Equivalência direta e idiomática da negação de posse.
theological_decisions:
- issue: Identidade do sujeito e do objeto na crítica à idolatria
  choice: “Eles próprios” refere-se aos adoradores, enquanto “os” refere-se aos ídolos.
  alternative: Entender “eles próprios” como os ídolos, incapazes de deixar outras coisas para trás.
  rationale: A distinção gramatical entre αὐτοὶ, masculino plural, e αὐτά, neutro plural, favorece referentes distintos; além disso, o paradoxo de perceber algo e ainda carecer de discernimento descreve a cegueira dos adoradores no argumento contra a idolatria. A tradução mantém os pronomes sem acrescentar uma identificação nominal ao texto principal.
- issue: Valor circunstancial de νοήσαντες
  choice: 'Leitura concessiva: “mesmo percebendo isso”.'
  alternative: 'Leitura mais estritamente anterior ou literal: “tendo compreendido, não conseguem abandoná-los”.'
  rationale: A leitura concessiva produz português natural e conserva a tensão retórica da frase, sem ocultar em nota a possibilidade de entender o particípio como ação anterior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Eles próprios” conserva a ênfase sem rigidez; “discernimento” evita tanto o tecnicismo de “percepção” quanto uma interpretação doutrinária excessiva.
