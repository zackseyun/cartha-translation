base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/001.yaml
  text: Because of your sins[a], which you committed against God, you will be carried away captive to Babylon by Nebuchadnezzar king of the Babylonians.
translation:
  language: pt
  text: Por causa dos pecados de vocês[a], que cometeram contra Deus, vocês serão levados cativos para a Babilônia por Nabucodonosor, rei dos babilônios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa dos pecados que vocês cometeram contra Deus”. O grego repete mais literalmente a mesma ideia: “pecados que vocês pecaram”.'
    reason: Registra a construção cognata enfática do grego e uma forma alternativa de agrupar a oração relativa.
lexical_decisions:
- source_word: Διὰ τὰς ἁμαρτίας
  choice: Por causa dos pecados
  rationale: διά com acusativo expressa causa; “por causa de” comunica isso com clareza, e “pecados” é o equivalente corrente de ἁμαρτίας.
- source_word: ἃς ἡμαρτήκατε
  choice: que cometeram
  rationale: A construção cognata grega repete literalmente “pecados que pecaram”. Em português, “pecados que cometeram” preserva o sentido e soa natural; a repetição do original é registrada em nota.
- source_word: ἐναντίον τοῦ θεοῦ
  choice: contra Deus
  rationale: No contexto moral, ἐναντίον indica oposição ou ofensa dirigida a Deus, e não apenas ação diante de sua presença.
- source_word: ἀχθήσεσθε
  choice: serão levados
  rationale: O futuro passivo de ἄγω descreve a deportação forçada, expressa naturalmente em português por “serão levados”.
- source_word: εἰς Βαβυλῶνα
  choice: para a Babilônia
  rationale: εἰς marca destino; “para a Babilônia” é a formulação idiomática em português.
- source_word: αἰχμάλωτοι
  choice: cativos
  rationale: O adjetivo plural indica a condição em que os destinatários serão levados e mantém o sentido de cativeiro decorrente da deportação.
- source_word: ὑπὸ Ναβουχοδονοσὸρ
  choice: por Nabucodonosor
  rationale: ὑπό com verbo passivo introduz o agente; “Nabucodonosor” é a forma portuguesa tradicional do nome.
- source_word: βασιλέως τῶν Βαβυλωνίων
  choice: rei dos babilônios
  rationale: Preserva a formulação étnica explícita do grego, em vez de substituí-la por “rei da Babilônia”.
theological_decisions:
- issue: Construção cognata ἁμαρτίας ... ἡμαρτήκατε
  choice: Traduzir no texto como “pecados ... que cometeram” e registrar em nota a repetição literal.
  alternative: “pecados ... que vocês pecaram”
  rationale: A alternativa reproduz mais diretamente a ênfase formal do grego, mas é pouco idiomática em português. A redação escolhida mantém a culpabilidade pessoal sem produzir estranheza desnecessária, e a nota preserva a informação retórica.
- issue: Sentido de ἐναντίον τοῦ θεοῦ
  choice: “contra Deus”
  alternative: “diante de Deus”
  rationale: O contexto associa o pecado ao juízo e ao exílio; “contra Deus” conserva a força ética e relacional da expressão sem reduzir o sentido à presença divina.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural de segunda pessoa e vocabulário amplamente compreensível no Brasil e em outros contextos lusófonos. A ordem da frase segue de perto o grego sem sacrificar a naturalidade.
