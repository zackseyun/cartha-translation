  text: They are indeed like a beam from a house[a], but they say that their hearts are licked away; while the creeping things from the ground devour them and their clothing, they do not perceive it.
translation:
  language: pt
  text: De fato, eles são como uma viga de uma casa[a]; dizem, porém, que seus corações são lambidos até desaparecerem. Enquanto os seres rastejantes que vêm do chão devoram tanto a eles como suas vestes, eles nada percebem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como uma viga tirada de uma casa”. A expressão grega pode indicar uma peça de madeira pertencente à casa ou procedente dela. “Corações” também pode referir-se aqui ao interior dos ídolos, mas o grego preserva a imagem antropomórfica.'
    reason: ambiguidade lexical e imagética
lexical_decisions:
- source_word: δοκός
  choice: viga
  rationale: Designa uma peça estrutural de madeira; “viga” comunica naturalmente a comparação com madeira retirada de uma casa.
- source_word: καρδίας
  choice: coração
  rationale: Mantém a imagem antropomórfica e irônica do grego, embora no contexto possa apontar para a parte interior dos ídolos de madeira.
- source_word: ἐκλείχεσθαι
  choice: é lambido até desaparecer
  rationale: Preserva o verbo concreto “lamber” e expressa o resultado indicado pelo prefixo ἐκ-, sem substituir a imagem por “roer”.
- source_word: ἑρπετῶν
  choice: seres rastejantes
  rationale: Abrange criaturas que rastejam sem restringir o sentido à categoria moderna dos répteis.
- source_word: κατεσθιόντων
  choice: devoram
  rationale: Reproduz com força a ideia de consumo ativo e progressivo.
- source_word: ἱματισμόν
  choice: vestes
  rationale: Termo atual e digno para a cobertura ou roupa colocada nos ídolos.
- source_word: οὐκ αἰσθάνονται
  choice: eles nada percebem
  rationale: Realça a total falta de sensação ou consciência dos ídolos, em português natural.
theological_decisions:
- issue: Referente do verbo final e dos pronomes
  choice: Os próprios ídolos são devorados, junto com suas vestes, e nada percebem.
  alternative: Entender que os adoradores estejam implicitamente envolvidos em parte da frase, sobretudo em “dizem”.
  rationale: O contexto imediato ridiculariza os ídolos como objetos insensíveis; αὐτούς, αὐτῶν e o sujeito de οὐκ αἰσθάνονται remetem mais naturalmente a eles.
- issue: Sentido concreto de “coração”
  choice: Conservar “coração” no texto principal.
  alternative: Traduzir interpretativamente por “interior” ou “parte de dentro”.
  rationale: A formulação grega atribui ironicamente anatomia aos ídolos de madeira. Manter a metáfora preserva a tensão entre o termo corporal e seu provável referente material.
- issue: Número de καρδίας em português
  choice: Usar o singular distributivo “o coração deles”.
  alternative: Usar “os corações deles”.
  rationale: καρδίας é acusativo plural no grego, mas o português emprega com naturalidade o singular distributivo quando cada integrante possui um; a referência coletiva permanece clara.
translation_notes:
  register: Português moderno, amplamente compreensível e com legibilidade brasileira. O tom é digno e incisivo; “seres rastejantes” evita a restrição taxonômica de “répteis”, e “vestes” conserva o registro literário sem soar arcaico.
