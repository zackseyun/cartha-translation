lexical_decisions:
- source_word: Τίνι
  choice: Para quem
  rationale: O dativo do pronome interrogativo integra a construção impessoal e corresponde literalmente a “para quem”; a formulação preserva a pergunta do grego sem convertê-la em uma afirmação universal.
- source_word: οὖν
  choice: então
  rationale: Mantém a força conectiva ou inferencial da partícula sem tornar a conclusão mais enfática do que no original.
- source_word: γνωστὸν ἐστὶν
  choice: é sabido
  rationale: Reproduz de modo compreensível em português a expressão impessoal grega, com o sentido de algo conhecido.
- source_word: ὅτι
  choice: que
  rationale: Introduz diretamente a oração que expressa o conteúdo conhecido.
- source_word: οὐκ εἰσὶν
  choice: não são
  rationale: Traduz de forma direta a cópula negada, sem acrescentar a ideia mais forte de inexistência absoluta.
- source_word: θεοί
  choice: deuses
  rationale: É o equivalente comum e transparente do plural θεοί no contexto da polêmica contra os ídolos.
theological_decisions:
- issue: Formulação da polêmica contra os ídolos
  choice: eles não são deuses
  alternative: eles não são deuses de verdade
  rationale: O grego afirma literalmente que eles “não são deuses”. Evita-se acrescentar “de verdade”, que explicitaria uma qualificação não expressa no texto e poderia atenuar ou reformular a força da negação.
- issue: Forma da pergunta retórica
  choice: Para quem, então, é sabido... ?
  alternative: Quem, então, sabe... ?
  rationale: A redação principal preserva a construção impessoal e o dativo interrogativo do grego; a alternativa idiomática é registrada em nota, sem resolver a possível nuance retórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com estrutura deliberadamente próxima do grego. “É sabido” soa mais natural em português do que o decalque “é conhecido”, enquanto a nota oferece a formulação corrente.
