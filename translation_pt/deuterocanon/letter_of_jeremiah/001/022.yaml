  text: Therefore you will know that they are not gods[a]; therefore do not fear them.
translation:
  language: pt
  text: Por isso, vocês saberão que eles não são deuses[a]; portanto, não tenham medo deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, “não são deuses”; o sujeito da primeira oração está implícito. O pronome final é neutro e se refere às imagens idolátricas em discussão e, por extensão, aos supostos deuses que elas representam.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Por isso
  rationale: Introduz a conclusão decorrente da exposição anterior da impotência dos ídolos; a expressão preserva a relação lógica em português natural.
- source_word: γινώσεσθε
  choice: vocês saberão
  rationale: Traduz diretamente o futuro de γινώσκω e expressa a conclusão a que os destinatários chegarão.
- source_word: θεοί
  choice: deuses
  rationale: É o equivalente simples e corrente para os supostos deuses pagãos, preservando a força polêmica da negação.
- source_word: μὴ οὖν φοβεῖσθε
  choice: portanto, não tenham medo
  rationale: Mantém tanto a proibição quanto o valor conclusivo de οὖν, usando uma formulação atual e digna.
- source_word: αὐτά
  choice: deles
  rationale: O pronome grego neutro retoma as imagens idolátricas mencionadas no contexto. Em português, “deles” é natural depois de “deuses” e evita acrescentar um substantivo ausente do texto, embora a nota esclareça a referência.
theological_decisions:
- issue: Referência dos pronomes na negação da divindade e na ordem de não temer
  choice: Conservar os pronomes, entendidos imediatamente como referentes às imagens idolátricas apresentadas como deuses.
  alternative: Entender a referência de modo mais amplo como os supostos deuses representados pelas imagens.
  rationale: O contexto imediato censura as imagens cultuais fabricadas e nega que sejam deuses verdadeiros. A tradução mantém a formulação pronominal do grego sem resolver além do necessário a extensão da referência.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural de segunda pessoa e conectivos distintos (“Por isso” e “portanto”) que preservam os dois movimentos inferenciais do grego.
