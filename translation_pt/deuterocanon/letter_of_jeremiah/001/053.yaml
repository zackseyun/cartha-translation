  text: They cannot judge their own case[a], nor can they rescue one who is wronged, because they are powerless;
translation:
  language: pt
  text: Eles não podem julgar sua própria causa[a], nem livrar quem é injustiçado, pois são impotentes;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles não podem decidir o julgamento por si mesmos, nem livrar da injustiça.” O grego é compacto, e ἀδίκημα pode significar “injustiça” ou “agravo” ou, pelo sentido do contexto, referir-se à pessoa atingida pela injustiça.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσίν
  choice: causa
  rationale: No contexto jurídico criado por διακρίνωσιν, κρίσις pode designar julgamento ou causa em disputa. “Causa” é clara em português atual e mantém a dimensão judicial.
- source_word: διακρίνωσιν
  choice: julgar
  rationale: Em combinação com κρίσιν, o verbo tem o sentido de decidir ou dirimir uma questão. “Julgar” expressa essa função de modo natural e conciso.
- source_word: ἑαυτῶν
  choice: sua própria
  rationale: O pronome reflexivo indica que a causa diz respeito aos próprios ídolos. “Sua própria causa” comunica isso idiomaticamente.
- source_word: ῥύσωνται
  choice: livrar
  rationale: ῥύομαι significa resgatar ou livrar de perigo e opressão. “Livrar” preserva essa força sem acrescentar uma conotação teológica que o contexto não exige.
- source_word: ἀδίκημα
  choice: quem é injustiçado
  rationale: Embora o substantivo denote propriamente injustiça, agravo ou ato injusto, após “livrar” o sentido contextual pode ser expresso concretamente pela pessoa atingida pela injustiça. A nota registra a construção mais literal e sua ambiguidade.
- source_word: ἀδύνατοι ὄντες
  choice: pois são impotentes
  rationale: A expressão participial apresenta a incapacidade como razão das duas negações anteriores. “Pois são impotentes” é natural e conserva a ênfase polêmica do texto.
theological_decisions:
- issue: Natureza da incapacidade dos ídolos
  choice: 'A incapacidade é apresentada em termos práticos e judiciais: eles não conseguem julgar nem livrar.'
  alternative: Entender a afirmação como uma declaração metafísica mais ampla sobre a natureza dos ídolos.
  rationale: O grego destaca sua incapacidade de agir nas situações mencionadas. A tradução não amplia a declaração para além dessas ações nem introduz uma formulação doutrinária externa.
- issue: Referente de ἀδίκημα
  choice: Expressar contextualmente a pessoa injustiçada como objeto do livramento.
  alternative: Traduzir de forma abstrata como “livrar da injustiça” ou “livrar o agravo”.
  rationale: O substantivo grego é compacto e admite leitura abstrata, mas a formulação concreta torna a oração inteligível em português. A nota preserva a alternativa sem resolver indevidamente a tensão lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção paralela “não podem... nem...” preserva a ênfase na incapacidade dos ídolos. O ponto e vírgula final acompanha a continuidade sintática do trecho fornecido.
