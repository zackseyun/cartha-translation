lexical_decisions:
- source_word: ἔστι δὲ καὶ ὅτε
  choice: Há também ocasiões em que
  rationale: A expressão introduz uma situação recorrente; esta formulação conserva esse sentido geral e o valor aditivo de καὶ em português natural.
- source_word: ὑφαιρούμενοι
  choice: retiram
  rationale: O particípio indica tirar ou subtrair, possivelmente às escondidas. “Retiram” mantém a formulação principal sóbria, enquanto a nota registra as nuances mais fortes.
- source_word: οἱ ἱερεῖς
  choice: os sacerdotes
  rationale: Correspondência direta e natural para o substantivo grego com artigo.
- source_word: ἀπὸ τῶν θεῶν αὐτῶν
  choice: de seus deuses
  rationale: Indica a origem dos metais retirados e conserva a ironia de que os sacerdotes despojam os próprios deuses que servem.
- source_word: χρυσὸν καὶ ἀργύριον
  choice: ouro e prata
  rationale: O grego nomeia os materiais preciosos sem especificar objetos ou adornos.
- source_word: εἰς ἑαυτοὺς
  choice: em benefício próprio
  rationale: No contexto de καταναλοῦσιν, expressa de modo idiomático que os recursos são consumidos para proveito dos próprios sacerdotes.
- source_word: καταναλοῦσιν
  choice: os gastam
  rationale: O verbo pode significar consumir ou despender. Com ouro e prata, “gastar” comunica com clareza o uso econômico, e o pronome retoma ambos os substantivos.
theological_decisions:
- issue: Descrição da má conduta dos sacerdotes para com os ídolos
  choice: O texto mostra que os sacerdotes retiram bens valiosos dos ídolos e os gastam em benefício próprio, sem atenuar a sátira.
  alternative: Traduzir ὑφαιρούμενοι explicitamente por “roubam” ou “subtraem às escondidas”.
  rationale: A força da passagem está em expor tanto a impotência dos ídolos quanto a corrupção de seus sacerdotes. A tradução principal preserva isso sem fixar uma nuance criminal ou secreta que, embora lexicalmente possível, não é inequívoca.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para soar natural, mantendo o contraste irônico e a ambiguidade lexical relevante em nota.
