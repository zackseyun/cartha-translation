  text: Wild animals are better than they are[a], because they can escape into shelter and help themselves.
translation:
  language: pt
  text: Os animais selvagens são superiores a eles[a], pois podem fugir para um abrigo e ajudar a si mesmos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “são melhores do que eles”.'
    reason: Alternativa lexical para κρείττω; o comparativo indica superioridade, aqui em sentido prático, não necessariamente qualidade moral.
lexical_decisions:
- source_word: τὰ θηρία
  choice: os animais selvagens
  rationale: θηρία designa animais, especialmente feras ou animais selvagens. A expressão é clara e preserva o contraste com os ídolos inertes do contexto.
- source_word: κρείττω
  choice: são melhores do que
  rationale: O comparativo exprime superioridade prática, não necessariamente excelência moral. “São melhores do que” é natural em português e mantém a amplitude do grego.
- source_word: αὐτῶν
  choice: eles
  rationale: O pronome retoma os ídolos mencionados no contexto. A tradução pronominal preserva a coesão sem inserir no versículo um substantivo ausente do grego.
- source_word: ἃ δύνανται
  choice: pois podem
  rationale: A oração relativa explica por que os animais são melhores. “Pois podem” comunica naturalmente essa relação explicativa.
- source_word: ἐκφυγόντα εἰς σκέπην
  choice: fugir para um abrigo
  rationale: ἐκφεύγω indica fugir ou escapar, e εἰς com σκέπη expressa movimento em direção a um lugar de proteção.
- source_word: αὐτὰ ὠφελῆσαι
  choice: ajudar a si mesmos
  rationale: 'A construção tem sentido reflexivo: ao contrário dos ídolos, os animais conseguem agir em benefício próprio. A formulação conserva o valor de ὠφελέω sem intensificá-lo para “salvar”.'
theological_decisions:
- issue: Referente de αὐτῶν na comparação
  choice: Manter o pronome “eles”, entendido contextualmente como referência aos ídolos.
  alternative: Explicitar “esses ídolos”.
  rationale: O contexto torna o referente identificável, mas o substantivo “ídolos” não aparece neste versículo. A opção escolhida evita acrescentar explicitação interpretativa desnecessária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A sintaxe conserva a brevidade e o tom satírico do original.
