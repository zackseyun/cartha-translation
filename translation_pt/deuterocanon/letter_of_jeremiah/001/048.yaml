  text: For when war and calamities come upon them[a], the priests consult among themselves where they may hide with them.
translation:
  language: pt
  text: Pois, quando a guerra e as calamidades vierem sobre eles[a], os sacerdotes consultam entre si onde poderão se esconder junto com eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os ídolos ou as imagens mencionados ao longo do contexto próximo.
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν
  choice: quando
  rationale: Introduz uma contingência futura de caráter geral; «quando» é natural em português e preserva o sentido de uma situação recorrente ou esperada.
- source_word: ἐπέλθῃ
  choice: vierem sobre
  rationale: Preserva a ideia direcional do composto com ἐπί, isto é, a chegada de acontecimentos hostis sobre os referentes pronominais.
- source_word: πόλεμος
  choice: guerra
  rationale: É o equivalente corrente e adequado ao contexto amplo de invasão e crise.
- source_word: κακά
  choice: calamidades
  rationale: No contexto, designa acontecimentos danosos, não o mal moral; «calamidades» mantém um registro digno e abrangente.
- source_word: βουλεύονται
  choice: consultam
  rationale: O verbo médio, junto de πρὸς ἑαυτούς, descreve deliberação recíproca entre os sacerdotes.
- source_word: πρὸς ἑαυτούς
  choice: entre si
  rationale: Expressa de modo natural a consulta mútua do grupo, e não mero pensamento interior individual.
- source_word: ποῦ
  choice: onde
  rationale: Interrogativo simples de lugar que introduz o conteúdo da deliberação.
- source_word: συγκαρυβῶσι
  choice: se esconder
  rationale: O verbo raro indica ocultar-se; a forma pronominal portuguesa preserva o valor reflexivo, enquanto o elemento associativo é expresso por «junto com».
- source_word: μετʼ αὐτῶν
  choice: junto com eles
  rationale: 'Mantém o pronome e torna clara a associação irônica: os sacerdotes procuram esconder-se juntamente com os ídolos que servem.'
theological_decisions:
- issue: Referente de αὐτά / αὐτῶν
  choice: Manter «eles» no texto e identificar os ídolos ou imagens em nota.
  alternative: Inserir diretamente «os ídolos» no corpo do versículo.
  rationale: O grego emprega pronomes, embora o contexto identifique claramente os referentes como ídolos ou imagens. A tradução preserva a forma pronominal e a ambiguidade textual local, esclarecendo o antecedente em nota sem acrescentá-lo ao versículo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Calamidades» preserva o tom formal sem soar arcaico; «consultam entre si» e «se esconder junto com eles» oferecem fluência natural e conservam a deliberação mútua, a reflexividade e a ironia do grego.
