base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/040.yaml
  text: 'Moreover[a], even the Chaldeans themselves dishonor them: whenever they see a mute person unable to speak, they bring him before Bel and ask that he make him speak[c][b], as though he were able to perceive.'
translation:
  language: pt
  text: 'Além disso, até os próprios caldeus os desonram: quando veem uma pessoa muda, incapaz de falar, trazem Bel até essa pessoa[a] e lhe pedem que a faça falar, como se ele fosse capaz de perceber[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente que eles “trazem Bel”. Algumas traduções entendem a cena como a pessoa muda sendo levada diante de Bel.
    reason: syntactical_ambiguity
  - marker: b
    text: 'Ou: “entender” ou “tomar conhecimento”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ καὶ
  choice: Além disso, até
  rationale: Expressa de modo natural tanto a progressão do argumento quanto a ênfase inclusiva de καί.
- source_word: αὐτῶν τῶν Χαλδαίων
  choice: os próprios caldeus
  rationale: O pronome intensivo αὐτῶν reforça que os mesmos caldeus ligados ao culto acabam desonrando os ídolos.
- source_word: ἀτιμαζόντων αὐτά
  choice: os desonram
  rationale: Mantém o sentido direto de tratar sem honra, com o pronome retomando os ídolos do contexto.
- source_word: ἐνεὸν οὐ δυνάμενον λαλῆσαι
  choice: uma pessoa muda, incapaz de falar
  rationale: Tradução atual, clara e respeitosa, preservando a explicação enfática do grego.
- source_word: προσενεγκάμενοι τὸν Βῆλον
  choice: trazem Bel até ela
  rationale: Preserva Bel como objeto gramatical explícito de προσενεγκάμενοι e torna explícito apenas o destino naturalmente inferido pelo contexto.
- source_word: ἐξιοῦσιν φωνῆσαι
  choice: lhe pedem que a faça falar
  rationale: 'Verte o pedido dirigido a Bel e comunica em português a finalidade contextual: que a pessoa muda passe a falar. A construção grega é compacta e admite outra análise, registrada na nota.'
- source_word: ὡς δυνατοῦ ὄντος αὐτοῦ αἰσθέσθαι
  choice: como se ele fosse capaz de perceber alguma coisa
  rationale: Preserva a ironia e o sentido amplo de percepção ou consciência expresso por αἰσθάνομαι.
theological_decisions:
- issue: Natureza da desonra praticada pelos caldeus
  choice: A ação dos próprios caldeus é apresentada como desonra aos ídolos, pois seu pedido expõe implicitamente a incapacidade de Bel.
  alternative: Entender a frase apenas como tratamento desrespeitoso dado às imagens, sem formular um juízo teológico mais amplo.
  rationale: A tradução mantém a acusação do texto sem explicar além do que o exemplo imediato permite.
- issue: Quem é levado e quem deve falar
  choice: Bel é levado até a pessoa muda, e os caldeus lhe pedem que a faça falar.
  alternative: A pessoa muda é levada diante de Bel; ou Bel é instado a falar pessoalmente.
  rationale: O acusativo τὸν Βῆλον faz de Bel o objeto expresso de προσενεγκάμενοι. A relação exata de φωνῆσαι é compacta e ambígua, por isso a principal alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com construção fluente para leitores brasileiros e compreensão internacional. Emprega “pessoa muda” em vez de termos arcaicos ou pejorativos. O nome Bel é transliterado; tratava-se de um nome ou título divino babilônico associado a Marduque.
