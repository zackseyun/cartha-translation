  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/054.yaml
  text: For just as a crow is between heaven and earth[a], so also when fire falls into a house of wooden or gold-covered or silver-covered gods, their priests will flee and be saved[b], but they themselves will be burned up like beams in the middle.
translation:
  language: pt
  text: Pois, assim como um corvo está entre o céu e a terra[a], também, quando fogo cair em uma casa[b] de deuses de madeira, revestidos de ouro ou de prata, os sacerdotes deles fugirão e serão salvos; mas eles mesmos serão consumidos pelo fogo como vigas no interior.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção grega é elíptica; o verbo «está» é suprido para completar a frase em português.
    reason: Esclarecimento da construção elíptica, sem definir o ponto da comparação.
  - marker: b
    text: 'Ou: «templo».'
    reason: Alternativa contextual para οἰκία, literalmente «casa».
lexical_decisions:
- source_word: ὥσπερ
  choice: assim como ... também
  rationale: Mantém a estrutura comparativa do grego e suaviza apenas o necessário a construção elíptica.
- source_word: κορώνη
  choice: corvo
  rationale: É o sentido comum e concreto do substantivo grego; não há razão para generalizá-lo como mera ave.
- source_word: ἀνὰ μέσον τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: entre o céu e a terra
  rationale: Expressão portuguesa natural que preserva a imagem espacial do original.
- source_word: ἐμπέσῃ ... πῦρ
  choice: cair fogo numa
  rationale: Conserva a ideia de uma súbita irrupção do fogo sem interpretar o verbo como simples início de incêndio.
- source_word: οἰκίαν θεῶν
  choice: casa de deuses
  rationale: Traduz οἰκία pelo sentido direto de 'casa'; o valor contextual de 'templo' é registrado em nota.
- source_word: ξύλινων ἢ περιχρύσων ἢ περιηργύρων
  choice: de madeira, revestidos de ouro ou revestidos de prata
  rationale: Preserva os três tipos de imagens e explicita com clareza que o ouro e a prata constituem revestimentos.
- source_word: φεύξονται καὶ διασωθήσονται
  choice: fugirão e serão salvos
  rationale: 'Mantém distintos os dois verbos: a fuga dos sacerdotes e sua preservação resultante.'
- source_word: κατακαυθήσονται
  choice: serão consumidos pelo fogo
  rationale: Expressa a força intensiva do composto, isto é, serem inteiramente queimados.
- source_word: ὥσπερ δοκοὶ μέσοι
  choice: como vigas no interior
  rationale: Reproduz a comparação arquitetônica e entende μέσοι como as vigas situadas no interior da construção.
theological_decisions:
- issue: Comparação elíptica no início do versículo
  choice: 'Preservar a formulação abrupta: ''assim como um corvo entre o céu e a terra, também...'''
  alternative: Expandir a frase para explicar que o corvo está exposto e indefeso.
  rationale: O grego não declara explicitamente o ponto da comparação. Mantê-la concisa conserva a ambiguidade e evita inserir uma interpretação no texto principal.
- issue: Sentido de οἰκίαν θεῶν
  choice: Usar 'casa de deuses' no texto principal.
  alternative: Usar 'templo de deuses'.
  rationale: A escolha principal segue o valor lexical direto de οἰκία, enquanto a nota oferece a leitura contextual mais idiomática.
- issue: Referente de αὐτοὶ
  choice: Traduzir por 'eles mesmos', referindo-se aos deuses-imagens.
  alternative: Explicitar 'os próprios ídolos'.
  rationale: O pronome mantém a coesão e a ironia do original sem substituir 'deuses' por um termo interpretativo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe conserva deliberadamente a concisão incomum da comparação inicial, enquanto 'no interior' torna natural a imagem final das vigas sem desenvolver além do que o grego permite.
