  text: Without feet they are carried on shoulders, showing their own disgrace to men; and even those who serve them are put to shame,
translation:
  language: pt
  text: Sem pés, são carregados sobre os ombros, mostrando às pessoas a própria desonra; até mesmo os que os servem ficam envergonhados,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνευ ποδῶν
  choice: Sem pés
  rationale: Reproduz de modo direto a expressão grega e ressalta a incapacidade dos ídolos.
- source_word: ἐπʼ ὤμοις φέρονται
  choice: são carregados sobre os ombros
  rationale: Preserva a voz passiva e a imagem concreta do transporte dos ídolos.
- source_word: ἐνδεικνύμενοι
  choice: mostrando
  rationale: Mantém o valor participial e a relação com o fato de serem carregados.
- source_word: τὴν ἑαυτῶν ἀτιμίαν
  choice: a própria desonra
  rationale: Traduz o reflexivo ἑαυτῶν e o sentido de desonra ou indignidade de ἀτιμία.
- source_word: τοῖς ἀνθρώποις
  choice: às pessoas
  rationale: Neste contexto genérico, ἄνθρωποι designa os seres humanos em geral; 'pessoas' é natural e inclusivo sem alterar o referente.
- source_word: οἱ θεραπεύοντες αὐτά
  choice: os que os servem
  rationale: θεραπεύω pode indicar serviço ou culto; 'servem' preserva aqui a amplitude sem impor terminologia confessional.
- source_word: αἰσχύνονται
  choice: ficam envergonhados
  rationale: Expressa naturalmente o estado de vergonha indicado pelo verbo, sem acrescentar causa não explicitada.
theological_decisions:
- issue: Natureza do serviço prestado aos ídolos
  choice: os que os servem
  alternative: os que os adoram
  rationale: O grego θεραπεύοντες admite a ideia de servir, atender ou prestar culto. 'Servem' conserva a ambiguidade lexical e evita restringir o termo a um ato específico de adoração.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura paralela e a ironia crítica do grego foram preservadas; a vírgula final acompanha a continuidade sintática do trecho fornecido.
