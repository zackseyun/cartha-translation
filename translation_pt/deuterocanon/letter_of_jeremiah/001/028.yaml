  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/028.yaml
  text: They touch their sacrifices while sitting apart and lying with women. Therefore[a], knowing from these things that they are not gods, do not fear them.
translation:
  language: pt
  text: A mulher menstruada e a mulher que deu à luz[a] tocam nos sacrifícios deles. Portanto, reconhecendo por essas coisas que eles não são deuses, não tenham medo deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego é condensado. As expressões provavelmente se referem a uma mulher menstruada e a uma mulher no período posterior ao parto, ambas consideradas ritualmente impuras no contexto antigo. Uma tradução mais literal da primeira expressão seria “a que está sentada à parte”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκαθημένη
  choice: a mulher menstruada
  rationale: O particípio feminino substantivado indica provavelmente uma mulher mantida à parte por causa da menstruação, isto é, em estado de impureza ritual. A tradução torna explícito o referente mais provável no contexto, sem acrescentar uma avaliação moderna sobre a mulher.
- source_word: λεχὼς
  choice: a mulher que deu à luz
  rationale: O substantivo grego designa normalmente uma mulher no parto ou no período posterior ao parto, não uma mulher que mantém relações sexuais. A formulação portuguesa é clara e preserva a provável referência à impureza ritual pós-parto.
- source_word: ἅπτονται
  choice: tocam
  rationale: O verbo significa aqui tocar ou manusear. “Tocam” preserva a imagem direta daquilo que, segundo a lógica ritual antiga, contaminaria as oferendas dos ídolos.
- source_word: θυσιῶν
  choice: sacrifícios
  rationale: O termo designa sacrifícios ou ofertas sacrificiais. “Sacrifícios” corresponde diretamente ao contexto cultual.
- source_word: γνόντες
  choice: reconhecendo
  rationale: O particípio introduz a conclusão que os leitores devem tirar das evidências apresentadas. “Reconhecendo” comunica inferência consciente com naturalidade em português.
- source_word: θεοί
  choice: deuses
  rationale: É o equivalente simples e direto no argumento contra os ídolos.
- source_word: μὴ φοβηθῆτε αὐτούς
  choice: não tenham medo deles
  rationale: Expressa com clareza a proibição de temer os ídolos, preservando a força do imperativo grego.
theological_decisions:
- issue: Referência à impureza ritual de mulheres
  choice: Entender as duas expressões como referências a uma mulher menstruada e a uma mulher no período posterior ao parto.
  alternative: Entender de modo mais genérico como uma mulher sentada à parte e uma mulher deitada.
  rationale: A forma ἀποκαθημένη sugere afastamento associado à menstruação, e λεχώ designa de modo característico uma parturiente ou puérpera. No contexto antigo, ambas eram consideradas ritualmente impuras; o argumento é que deuses verdadeiros não poderiam ser contaminados dessa maneira. A tradução identifica as condições sem endossar como princípio atual a concepção ritual pressuposta.
- issue: Natureza dos ídolos
  choice: Manter a afirmação direta de que “não são deuses”.
  alternative: Parafrasear como “não possuem poder divino”.
  rationale: A formulação direta preserva a força e a tensão do argumento grego sem introduzir uma explicação teológica adicional.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A construção inicial repete “a mulher” para desfazer a compressão sintática do grego sem obscurecer os dois sujeitos femininos.
