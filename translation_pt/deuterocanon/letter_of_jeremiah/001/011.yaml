  text: But these are not preserved from rust and moths[a], though they are clothed in purple garments.
translation:
  language: pt
  text: Mas estes não são preservados da ferrugem nem das traças[a], embora estejam vestidos com uma veste de púrpura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da corrosão nem de coisas que os consomem”. O termo grego traduzido como “traças” é mais amplo, mas as traças se ajustam bem à menção das vestes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: estes
  rationale: O demonstrativo retoma os ídolos já mencionados sem acrescentar ao texto grego um substantivo interpretativo.
- source_word: οὐ διασώζονται
  choice: não são preservados
  rationale: A forma passiva indica que não são mantidos a salvo ou intactos; no contexto, trata-se de conservação física, não de salvação espiritual.
- source_word: ἀπὸ ἰοῦ
  choice: da ferrugem
  rationale: Neste contexto de deterioração material, ἰός designa naturalmente ferrugem ou corrosão, e não veneno.
- source_word: βρωμάτων
  choice: das traças
  rationale: O termo é mais amplo, literalmente ligado a coisas que comem ou consomem, mas 'traças' comunica naturalmente a imagem diante da menção imediata às vestes.
- source_word: περιβεβλημένων αὐτῶν
  choice: embora estejam vestidos
  rationale: 'O genitivo absoluto admite valor concessivo e ressalta a ironia: apesar do traje luxuoso, os ídolos continuam sujeitos à deterioração.'
- source_word: ἱματισμὸν πορφυροῦν
  choice: vestidos de púrpura
  rationale: A expressão designa vestimenta tingida de púrpura. Esta formulação é natural em português, preserva o sentido coletivo de ἱματισμός e a associação da púrpura com luxo.
theological_decisions:
- issue: Sentido de διασώζονται no contexto de crítica à idolatria
  choice: preservação física contra a deterioração
  alternative: livramento ou salvação em sentido mais amplo
  rationale: O contexto imediato destaca a impotência material dos ídolos e sua vulnerabilidade à corrosão e a agentes que consomem; uma formulação ligada à salvação introduziria uma conotação teológica indevida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção concessiva preserva a ironia do grego, e a nota mantém visível a amplitude lexical de βρωμάτων.
