base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/050.yaml
  text: For since they are wooden, overlaid with gold and overlaid with silver, it will afterward be known that they are false; to all the nations and to the kings it will be evident that they are not gods but works of human hands, and there is no work of God in them.
translation:
  language: pt
  text: Pois, por serem de madeira e revestidos de ouro e de prata, mais tarde se saberá que são falsos; será evidente para todas as nações e para os reis que eles não são deuses, mas obras de mãos humanas, e que não há neles obra alguma de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπάρχοντα ... ξύλινα
  choice: sendo de madeira
  rationale: Expressa de modo natural a condição material dos ídolos, preservando a força do particípio grego.
- source_word: περίχρυσα καὶ περιάργυρα
  choice: revestidos de ouro e revestidos de prata
  rationale: Mantém a distinção e o paralelismo dos dois adjetivos gregos, deixando claro que os metais são revestimento.
- source_word: ψευδῆ
  choice: falsos
  rationale: Preserva a afirmação direta de falsidade, sem restringi-la a uma interpretação como 'enganosos' ou 'fraudulentos'.
- source_word: ἔργα χειρῶν ἀνθρώπων
  choice: obras de mãos humanas
  rationale: Reproduz a imagem antropomórfica e idiomática do original em português corrente e solene.
- source_word: οὐθὲν θεοῦ ἔργον ἐν αὐτοῖς ἐστίν
  choice: não há neles obra alguma de Deus
  rationale: Conserva a formulação ampla do grego e evita explicar além do texto em que sentido nenhuma obra de Deus estaria neles.
theological_decisions:
- issue: Negação da divindade dos ídolos
  choice: eles não são deuses
  alternative: eles não são Deus
  rationale: O plural θεοί corresponde a 'deuses' e mantém o contraste entre os objetos idolátricos e sua alegada condição divina.
- issue: Sentido de 'obra de Deus' nos ídolos
  choice: não há neles obra alguma de Deus
  alternative: não há neles poder divino algum
  rationale: A tradução formal preserva a tensão e a amplitude sem converter 'obra' em 'poder', interpretação que o grego não explicita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição de 'revestidos' é intencional para refletir o paralelismo do grego; a pontuação divide o longo período sem alterar sua progressão argumentativa.
