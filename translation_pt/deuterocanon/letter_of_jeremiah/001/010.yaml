  text: They even give some of their things to the prostitutes on the roof[b][a]. And they adorn them with clothing like human beings—silver gods and gold gods and wooden ones.
translation:
  language: pt
  text: 'Darão até mesmo parte do que é deles[a] às prostitutas no terraço[b]. E os adornam com vestes, como a seres humanos: deuses de prata, deuses de ouro e de madeira.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “deles” ou “a partir deles”; o pronome provavelmente se refere a objetos associados aos ídolos no contexto.
    reason: lexical_alternative
  - marker: b
    text: Alguns intérpretes entendem que as “prostitutas no terraço” estavam associadas a práticas cultuais, mas o grego não diz explicitamente “prostitutas do templo”.
    reason: alternative_reading
lexical_decisions:
- source_word: δώσουσιν
  choice: chegam a dar
  rationale: Embora a forma grega seja futura, ela integra uma descrição proverbial do comportamento habitual. A construção portuguesa expressa com naturalidade a ênfase de καί (‘até’) sem tornar a frase artificial.
- source_word: ἀπʼ αὐτῶν
  choice: algumas das coisas deles
  rationale: A expressão significa literalmente ‘deles’ ou ‘a partir deles’ e provavelmente aponta para objetos ligados aos ídolos no contexto. A formulação mantém o referente discretamente aberto, esclarecido em nota.
- source_word: ταῖς ἐπὶ τοῦ στέγους πόρναις
  choice: às prostitutas que ficam no terraço
  rationale: πόρναι significa ‘prostitutas’; ἐπὶ τοῦ στέγους as situa sobre a cobertura da casa. ‘Terraço’ comunica naturalmente um espaço no alto do edifício, sem acrescentar uma função cúltica que o grego não declara.
- source_word: κοσμοῦσί
  choice: enfeitam
  rationale: κοσμέω indica ornamentar ou adornar. ‘Enfeitam’ é atual, claro e apropriado à colocação de roupas nos ídolos.
- source_word: ὡς ἀνθρώπους
  choice: como se fossem seres humanos
  rationale: ἀνθρώπους designa seres humanos de modo genérico. A construção explicita em português a comparação, sem sugerir que os ídolos sejam realmente humanos.
- source_word: τοῖς ἐνδύμασιν
  choice: com roupas
  rationale: O dativo instrumental indica o meio usado para enfeitá-los. ‘Roupas’ é corrente e preciso.
- source_word: θεοὺς ἀργυροῦς καὶ θεοὺς χρυσοῦς καὶ ξυλίνους
  choice: deuses de prata, deuses de ouro e de madeira
  rationale: A tradução conserva a repetição de ‘deuses’ nos dois primeiros membros e a elipse no terceiro, reproduzindo o tom enumerativo do grego com fluidez em português.
theological_decisions:
- issue: Possível sentido cúltico de πόρναι
  choice: prostitutas
  alternative: prostitutas cultuais; prostitutas do templo
  rationale: O grego as chama apenas de πόρναι e informa que estão no alto da edificação; não as identifica explicitamente como agentes de um culto. A tradução evita importar essa especificação religiosa.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A repetição deliberada de “deuses” preserva o efeito retórico do original; as notas conservam as ambiguidades lexical e histórica sem sobrecarregar o texto principal.
