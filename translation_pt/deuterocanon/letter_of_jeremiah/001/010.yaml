  source_fidelity: A revisão é necessária. «Chegam a dar» elimina o futuro de δώσουσιν, e «como se fossem seres humanos» introduz uma nuance contrafactual que não está expressa em ὡς ἀνθρώπους. «Que ficam no terraço» também transforma a simples localização grega em caracterização habitual.
  naturalness: «Darão até mesmo parte do que é deles» é claro e natural, mantendo sem especificar excessivamente o referente de ἀπ᾽ αὐτῶν. «Às prostitutas no terraço» traduz diretamente a localização. «Como a seres humanos» é uma construção idiomática para tratar/adornar algo à maneira de pessoas.
  terminology: «Prostitutas» preserva πόρναι sem impor uma identificação cultual. «Adornam», «vestes» e a enumeração repetida de «deuses» mantêm o registro formal e o efeito retórico do grego.
