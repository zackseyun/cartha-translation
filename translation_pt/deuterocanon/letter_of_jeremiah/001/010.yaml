revisions:
- from: Eles chegam a dar algumas das coisas deles[a] às prostitutas que ficam no terraço[b]. E os enfeitam com roupas, como se fossem seres humanos — deuses de prata, deuses de ouro e de madeira.
  to: 'Darão até mesmo parte do que é deles[a] às prostitutas no terraço[b]. E os adornam com vestes, como a seres humanos: deuses de prata, deuses de ouro e de madeira.'
