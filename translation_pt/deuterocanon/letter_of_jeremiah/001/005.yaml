  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/005.yaml
  text: When you see a crowd in front of them and behind them bowing down to them[a], say in your mind, ‘It is you whom one must worship, Master.’
translation:
  language: pt
  text: 'Quando virem uma multidão diante deles e atrás deles, prostrando-se diante deles[a], digam em sua mente: “É a ti que se deve adorar, Soberano.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “adorando-os”. O verbo grego pode indicar tanto o ato corporal de se prostrar como o ato religioso de adorar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντας
  choice: Quando virem
  rationale: O particípio acusativo tem valor circunstancial e se liga ao destinatário plural implícito, explicitado pelo imperativo εἴπατε; a oração temporal é natural em português.
- source_word: ὄχλον
  choice: uma multidão
  rationale: Expressa de modo claro e digno um grande agrupamento de pessoas, sem elevar excessivamente o registro.
- source_word: ἔμπροσθεν καὶ ὄπισθεν αὐτῶν
  choice: diante deles e atrás deles
  rationale: Mantém a disposição espacial concreta indicada pelo grego e conserva a referência masculina aos ídolos no contexto.
- source_word: προσκυνοῦντας αὐτά
  choice: prostrando-se diante deles
  rationale: Torna visível o gesto corporal de reverência sem apagar sua conotação cultual; a nota registra a alternativa 'adorando-os'.
- source_word: εἴπατε δὲ τῇ διανοίᾳ
  choice: digam em sua mente
  rationale: Comunica uma fala interior, não pronunciada, e traduz διάνοια sem substituir o termo por 'coração'.
- source_word: Σοί
  choice: É a ti que
  rationale: A construção clivada preserva a ênfase do pronome dativo anteposto.
- source_word: δεῖ
  choice: se deve
  rationale: Preserva a necessidade impessoal expressa pelo verbo grego sem acrescentar um sujeito específico.
- source_word: προσκυνεῖν
  choice: adorar
  rationale: Na fala dirigida a Deus, o sentido religioso pleno do verbo é predominante.
- source_word: Δέσποτα
  choice: Soberano
  rationale: Preserva a distinção em relação a κύριος e exprime, em português reverente e natural, a autoridade absoluta implicada em δεσπότης; 'Dono' ou 'Senhor de escravos' seriam literais demais para o registro.
theological_decisions:
- issue: Forma do tratamento divino Δέσποτα
  choice: Soberano
  alternative: Senhor; Mestre
  rationale: O texto usa δεσπότης, não κύριος. 'Soberano' mantém a ideia de autoridade absoluta e evita normalizar automaticamente o título como 'Senhor'; 'Mestre' em português pode sugerir sobretudo professor ou instrutor.
- issue: Amplitude semântica de προσκυνέω
  choice: prostrando-se diante deles / adorar
  alternative: adorando-os / prostrar-se diante de ti
  rationale: A tradução distingue o gesto visível da multidão e seu sentido religioso na confissão dirigida a Deus, enquanto a nota preserva a sobreposição semântica do mesmo verbo grego.
translation_notes:
  register: Português moderno, claro e digno, com concordância no plural conforme o imperativo grego. A repetição de “deles” preserva a referência do original, embora o referente específico dependa do contexto anterior.
