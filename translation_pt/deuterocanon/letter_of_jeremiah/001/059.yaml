  text: For the sun and the moon and the stars, being bright and sent out for needs, are obedient.
translation:
  language: pt
  text: Pois o sol, a lua e as estrelas, sendo luminosos e enviados para atender às necessidades[a], são obedientes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o serviço” ou “para usos necessários”; a expressão grega pode indicar utilidade para atender a necessidades ou desempenhar funções.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥλιος
  choice: sol
  rationale: Equivalente usual para o corpo celeste, adequado à enumeração com a lua e as estrelas.
- source_word: σελήνη
  choice: lua
  rationale: Equivalente direto e natural em português.
- source_word: ἄστρα
  choice: estrelas
  rationale: Traduz diretamente o plural que designa os astros visíveis no céu.
- source_word: ὄντα λαμπρά
  choice: sendo luminosos
  rationale: Preserva a construção participial e descreve o estado brilhante dos três elementos sem transformar a expressão em uma ação principal.
- source_word: ἀποστελλόμενα
  choice: enviados
  rationale: Mantém a voz passiva e a ideia de que os corpos celestes são enviados para determinada finalidade, sem explicitar quem os envia.
- source_word: ἐπὶ χρείας
  choice: para atender às necessidades
  rationale: Expressa de modo natural em português a finalidade ligada a necessidade, utilidade ou serviço, sem restringir o alcance da frase grega.
- source_word: εὐήκοά
  choice: obedientes
  rationale: Conserva o sentido de docilidade ou prontidão para obedecer e o contraste contextual com ídolos incapazes de agir.
theological_decisions:
- issue: Agência e finalidade dos corpos celestes
  choice: A tradução apresenta o sol, a lua e as estrelas como enviados e obedientes, cumprindo uma finalidade.
  alternative: Entender a linguagem de forma mais impessoal, como simples regularidade do funcionamento da natureza.
  rationale: O particípio passivo ἀποστελλόμενα e o adjetivo εὐήκοα sugerem submissão a uma ordem, mas o texto não identifica expressamente quem os envia; por isso, a tradução preserva a implicação sem acrescentar “Deus”.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura próxima do grego. “Luminosos” concorda com a enumeração tomada em conjunto; “para atender às necessidades” evita a formulação pouco natural “para necessidades” e conserva a amplitude semântica de χρεία.
