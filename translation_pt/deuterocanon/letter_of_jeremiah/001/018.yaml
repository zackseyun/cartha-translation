  text: They light lamps for them, more than for themselves, though they cannot see a single one of them.
translation:
  language: pt
  text: Acendem para eles mais lâmpadas do que para si mesmos, embora eles não consigam ver nenhuma delas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνους
  choice: lâmpadas
  rationale: O substantivo designa concretamente lâmpadas, em especial lamparinas a óleo, e mantém a imagem da iluminação oferecida aos ídolos.
- source_word: καίουσιν
  choice: Acendem
  rationale: Com “lâmpadas” como objeto, “acendem” expressa de modo natural o ato de fazê-las arder.
- source_word: πλείους ἢ ἑαυτοῖς
  choice: mais lâmpadas do que para si mesmos
  rationale: Preserva a comparação entre a quantidade destinada aos ídolos e a destinada aos próprios adoradores, explicitando apenas o substantivo subentendido na construção grega.
- source_word: ὧν οὐδένα
  choice: nenhuma delas
  rationale: O pronome relativo retoma as lâmpadas, e a formulação comunica de maneira idiomática a incapacidade de ver sequer uma.
- source_word: δύνανται ἰδεῖν
  choice: não consigam ver
  rationale: Expressa diretamente a incapacidade visual atribuída aos ídolos.
theological_decisions:
- issue: Referente do sujeito implícito em δύνανται ἰδεῖν
  choice: os ídolos não conseguem ver as lâmpadas acesas para eles
  alternative: os adoradores não conseguem ver benefício algum proveniente dos ídolos
  rationale: O contexto imediato ridiculariza os ídolos como objetos sem percepção, e “para eles” fornece o antecedente contextual mais coerente. O pronome “eles” preserva no texto a forma referencial do grego sem inserir o substantivo “ídolos” neste versículo.
translation_notes:
  register: Português moderno, digno e acessível, com construção compreensível tanto no Brasil como em outros contextos lusófonos. A repetição de “eles” mantém a referência aos ídolos, embora dependa do contexto anterior, como no grego.
