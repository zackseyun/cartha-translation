  text: From the purple and the marble rotting upon them it will be known that they are not gods; and in the end they themselves will be eaten[a], and they will become a disgrace in the land.
translation:
  language: pt
  text: Pela púrpura e pelo mármore que apodrece sobre eles, ficará evidente que não são deuses. Por fim, eles próprios serão comidos[a] e se tornarão uma vergonha na terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mais tarde, eles próprios serão consumidos/devorados”. O grego diz literalmente “serão comidos”, possivelmente por decomposição ou por criaturas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορφύρας
  choice: púrpura
  rationale: Mantém a expressão concisa do grego e, no contexto, designa o tecido ou adorno púrpura de alto valor colocado sobre os ídolos.
- source_word: μαρμάρου
  choice: mármore
  rationale: É o equivalente direto de μάρμαρον e indica o material ornamental associado aos ídolos.
- source_word: τῆς ἐπ’ αὐτοὺς σηπομένης
  choice: que apodrecem sobre eles
  rationale: Preserva a imagem concreta de deterioração dos adornos sobre os ídolos. O plural em português vincula naturalmente a oração à púrpura e ao mármore, conforme o sentido contextual.
- source_word: γνωσθήσεται
  choice: ficará evidente
  rationale: Expressa o reconhecimento público ou a comprovação resultante da deterioração, em linguagem portuguesa natural.
- source_word: θεοί
  choice: deuses
  rationale: Equivalente lexical direto, adequado à negação da divindade dos ídolos.
- source_word: ἐξ ὑστέρου
  choice: por fim
  rationale: Comunica que isso ocorrerá posteriormente ou ao cabo do processo, sem especificar um momento exato.
- source_word: βρωθήσονται
  choice: serão comidos
  rationale: Conserva a imagem literal e concreta do verbo, sem determinar se o agente são criaturas, a decomposição ou outra forma de consumo.
- source_word: ὄνειδος
  choice: uma vergonha
  rationale: Forma idiomática que comunica desonra e opróbrio públicos.
- source_word: ἐν τῇ χώρᾳ
  choice: naquela terra
  rationale: χώρα pode significar terra, país ou região; 'naquela terra' mantém a referência ampla e evita restringi-la indevidamente.
theological_decisions:
- issue: Referente dos materiais em decomposição e das orações finais
  choice: Os adornos deteriorados evidenciam que os ídolos não são deuses; os próprios ídolos são então apresentados como comidos e transformados em vergonha.
  alternative: As orações finais podem ser entendidas como referentes sobretudo aos próprios materiais mencionados antes.
  rationale: O pronome plural αὐτά e a polêmica contínua da carta favorecem os ídolos como referente das orações finais. A expressão 'eles próprios' explicita essa leitura contextual, enquanto a nota preserva a indeterminação do modo pelo qual serão consumidos.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a força satírica contra os ídolos e preserva a imagem concreta e deliberadamente incomum de serem 'comidos'.
