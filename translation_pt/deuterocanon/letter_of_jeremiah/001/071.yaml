  source_fidelity: A tradução acompanha bem a sintaxe e o sentido geral. Contudo, «naquela terra» acrescenta uma dêixis que o artigo grego em ἐν τῇ χώρᾳ não expressa; «na terra» é mais fiel. A oração relativa grega está formalmente no singular e se liga mais diretamente a «mármore»; em português, o singular evita estender gramaticalmente «apodrecem» aos dois materiais.
  naturalness: O registro é claro, atual e adequado. «Ficará evidente», «por fim» e «serão comidos» são escolhas naturais que preservam a força da passagem. A construção singular «o mármore que apodrece» é deliberadamente incomum, mas reproduz a imagem material e depreciativa do grego.
  terminology: «Púrpura», «mármore», «deuses», «vergonha» e «terra» são equivalentes adequados. A nota conserva corretamente o valor literal de βρωθήσονται sem definir indevidamente o agente ou mecanismo do consumo.
  issues:
