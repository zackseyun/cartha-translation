  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/026.yaml
  text: Therefore[a], if one of them falls to the ground, they cannot raise themselves up; and if someone sets it upright, it will not move by itself; and if it is tilted, it will certainly not be made straight. Rather[b], gifts are set before them as before the dead.
translation:
  language: pt
  text: Por isso[a], se um deles cair no chão, não conseguirá se levantar sozinho; mesmo que alguém o ponha de pé, ele não se moverá por si mesmo; e, se ficar inclinado, de modo algum será endireitado. Pelo contrário, presentes[b] são colocados diante deles, como diante dos mortos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “para que não caia no chão, levantarem-se por si mesmos”. A construção grega é condensada; no contexto, o sentido é que, se um ídolo cair, não consegue se levantar sozinho.'
    reason: lexical_alternative
  - marker: b
    text: “Presentes” também pode ser traduzido por “ofertas” neste contexto de culto.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τό
  choice: Por isso
  rationale: Introduz a conclusão decorrente da descrição anterior e mantém a ligação lógica em português corrente.
- source_word: μή ποτε ἐπὶ τὴν γῆν πέσῃ
  choice: se um deles cair no chão
  rationale: Explicita de modo natural a condição implícita na construção grega comprimida, identificando o referente como um dos ídolos.
- source_word: δι' αὐτῶν ἀνίστασθαι
  choice: não conseguirá se levantar sozinho
  rationale: Expressa a incapacidade do ídolo de erguer a si mesmo; a nota preserva a forma mais literal e a dificuldade do plural grego.
- source_word: μήτε ἐὰν τις αὐτὸ ὀρθὸν στήσῃ
  choice: mesmo que alguém o ponha de pé
  rationale: Retrata com clareza uma pessoa colocando externamente o ídolo na posição vertical.
- source_word: δι' ἑαυτοῦ κινηθήσεται
  choice: ele não se moverá por si mesmo
  rationale: Preserva a negação da capacidade de movimento autônomo.
- source_word: μήτε ἐὰν κλιθῇ, οὐ μὴ ὀρθωθῇ
  choice: e, se ficar inclinado, de modo algum se endireitará
  rationale: “Ficar inclinado” traduz κλιθῇ, enquanto “de modo algum” comunica a negação enfática οὐ μή.
- source_word: ἀλλ' ὥσπερ νεκροῖς
  choice: Pelo contrário, ... como diante dos mortos
  rationale: Mantém o contraste e a comparação direta com aquilo que é colocado diante de mortos.
- source_word: τὰ δῶρα αὐτοῖς παρατίθεται
  choice: põem diante deles presentes
  rationale: “Presentes” conserva o sentido amplo de δῶρα, sem excluir a nuance cultual de ofertas; a construção ativa impessoal é natural em português.
theological_decisions:
- issue: Referente e número dos pronomes relativos aos ídolos
  choice: Usar o singular para um ídolo representativo nas orações condicionais e o plural para os ídolos como classe na conclusão
  alternative: Usar o plural em toda a frase, ou manter um singular representativo até o fim
  rationale: O grego alterna formas de modo pouco regular. A solução escolhida torna a descrição compreensível sem apagar que a conclusão se refere coletivamente aos ídolos.
- issue: Força da negação em οὐ μὴ ὀρθωθῇ
  choice: de modo algum se endireitará
  alternative: não se endireitará
  rationale: A locução “de modo algum” preserva a negação enfática do texto grego sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Evita linguagem arcaica; preserva a imagem física da impotência dos ídolos, a negação enfática e a possível nuance cultual de δῶρα por meio de nota.
