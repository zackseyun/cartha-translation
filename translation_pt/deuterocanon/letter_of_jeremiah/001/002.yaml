  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/002.yaml
  text: So when you enter Babylon[a], you will be there for many years and a long time, until seven generations; but after this I will bring you out from there in peace.
translation:
  language: pt
  text: Assim, quando entrarem na Babilônia, vocês ficarão ali por muitos anos e por um longo tempo, até sete gerações[a]; mas, depois disso, eu os tirarei dali em paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por sete gerações”. A expressão grega diz literalmente “até sete gerações” e pode indicar a duração do exílio de maneira arredondada ou estilizada.'
    reason: Registra uma alternativa legítima para a relação temporal sem substituir a formulação mais formal do texto principal.
lexical_decisions:
- source_word: εἰσελθόντες οὖν
  choice: Assim, quando entrarem
  rationale: O particípio aoristo, ligado ao verbo principal no futuro, tem valor temporal; “quando entrarem” expressa isso naturalmente. “Assim” conserva a função de continuidade ou inferência de οὖν.
- source_word: εἰς Βαβυλῶνα
  choice: na Babilônia
  rationale: Com o verbo “entrar”, o português corrente emprega naturalmente “em”; o artigo diante do topônimo segue o uso português consagrado.
- source_word: ἔσεσθε ἐκεῖ
  choice: vocês ficarão ali
  rationale: “Ficarão ali” comunica de modo natural a permanência futura indicada pelo contexto, sem ampliar seu conteúdo.
- source_word: ἔτη πλείω καὶ χρόνον μακρόν
  choice: por muitos anos e por um longo tempo
  rationale: πλείω é entendido como quantidade extensa, não como comparação explícita. A repetição das duas expressões temporais preserva a ênfase retórica do grego.
- source_word: ἕως γενεῶν ἑπτά
  choice: até sete gerações
  rationale: Mantém o sentido básico de ἕως (“até”) e o plural com numeral, sem convertê-lo interpretativamente em “até a sétima geração”.
- source_word: μετὰ τοῦτο δὲ
  choice: mas, depois disso
  rationale: Expressa a transição levemente contrastiva de δέ entre o exílio prolongado e a promessa subsequente.
- source_word: ἐξάξω ὑμᾶς ἐκεῖθεν
  choice: eu os tirarei dali
  rationale: Reproduz o movimento para fora expresso por ἐξάξω e a origem indicada por ἐκεῖθεν, sem acrescentar “de volta” ou “resgatarei”.
- source_word: μετʼ εἰρήνης
  choice: em paz
  rationale: Equivalente idiomático que preserva o estado ou modo pacífico da saída.
theological_decisions:
- issue: Intensidade teológica da promessa final
  choice: eu os tirarei dali em paz
  alternative: eu os resgatarei dali em paz / eu os levarei de volta dali em paz
  rationale: O grego promete a retirada da Babilônia, mas não explicita “resgate” nem o destino de um retorno. A redação evita acrescentar uma nuance salvífica ou geográfica além do texto.
- issue: Duração indicada por ἕως γενεῶν ἑπτά
  choice: até sete gerações
  alternative: por sete gerações / até a sétima geração
  rationale: A formulação conserva a construção incomum e sua possível dimensão estilizada, em vez de resolver silenciosamente a duração exata.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural de segunda pessoa. A repetição “por muitos anos e por um longo tempo” foi mantida para conservar a ênfase do original, apesar da leve redundância em português.
