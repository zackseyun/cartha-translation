  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/033.yaml
  text: Whether they suffer some harm from anyone or receive some good[a], they will not be able to repay it[b]; they cannot set up a king or remove one.
translation:
  language: pt
  text: Quer alguém lhes faça algum mal ou algum bem, não poderão retribuir[a]; não são capazes de instituir um rei nem de removê-lo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego significa dar algo em retorno e pode referir-se tanto a responder ao mal quanto a recompensar o bem.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nomear um rei nem destituí-lo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε ἐὰν ... οὔτε ἐὰν
  choice: Quer ... ou ...
  rationale: A construção correlativa apresenta duas condições alternativas. Em português, “quer ... ou ...” conserva o paralelismo com naturalidade.
- source_word: κακόν τι
  choice: algum mal
  rationale: No contexto, refere-se a dano ou tratamento adverso sofrido pelos ídolos, sem exigir que “mal” seja entendido como mal moral abstrato.
- source_word: πάθωσιν ὑπό τινος
  choice: alguém lhes faça
  rationale: A formulação ativa é idiomática em português e conserva tanto a experiência passiva dos ídolos quanto o agente indefinido expresso por ὑπό τινος.
- source_word: ἀγαθόν
  choice: algum bem
  rationale: Mantém a oposição direta com κακόν e não especifica indevidamente a natureza do benefício.
- source_word: δυνήσονται ἀνταποδοῦναι
  choice: não poderão retribuir
  rationale: ἀνταποδίδωμι indica dar em retorno e pode abranger tanto a resposta ao mal quanto a recompensa pelo bem; “retribuir” preserva essa amplitude.
- source_word: καταστῆσαι βασιλέα
  choice: estabelecer um rei
  rationale: καθίστημι pode significar constituir, nomear ou instalar alguém em uma posição. “Estabelecer um rei” conserva a amplitude do grego sem restringi-lo ao rito de entronização.
- source_word: ἀφελέσθαι
  choice: removê-lo
  rationale: O verbo significa tirar ou remover; o pronome recupera naturalmente “rei”, subentendido no grego, sem tornar explícito um modo específico de deposição.
theological_decisions:
- issue: Alcance da impotência dos ídolos
  choice: Os ídolos não conseguem retribuir nem o mal nem o bem que lhes façam, e tampouco estabelecer ou remover reis.
  alternative: Restringir “retribuir” à punição pelo mal ou ver a cláusula política apenas como referência formal à nomeação e deposição de reis.
  rationale: A estrutura grega reúne mal e bem sob o verbo ἀνταποδοῦναι e apresenta, em seguida, uma incapacidade política abrangente. A tradução mantém essa amplitude sem acrescentar uma tese doutrinária além da afirmação do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural para leitores brasileiros. A transformação da construção passiva em “alguém lhes faça” evita uma elipse pouco natural em português, sem alterar os participantes nem a oposição entre mal e bem. “Estabelecer” e “remover” preservam a generalidade dos verbos políticos gregos.
