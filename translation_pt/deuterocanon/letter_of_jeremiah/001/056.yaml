  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/056.yaml
  text: How then can it be accepted or supposed that they are gods? Wooden gods overlaid with silver and overlaid with gold will certainly not save themselves from thieves or robbers[a][b].
translation:
  language: pt
  text: Como, então, se pode aceitar ou considerar que são deuses? Esses deuses de madeira, revestidos de prata e de ouro, certamente não se salvarão nem de ladrões nem de assaltantes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “certamente não escaparão nem de ladrões nem de assaltantes”. A forma grega também pode ser entendida em sentido passivo: “certamente não serão salvos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν
  choice: Como, então
  rationale: Introduz com naturalidade a pergunta retórica de caráter conclusivo e preserva a força inferencial de οὖν.
- source_word: ἐκδεκτέον ἢ νομιστέον
  choice: se pode aceitar ou pensar
  rationale: Expressa os dois adjetivos verbais gregos como uma possibilidade retoricamente contestada, mantendo a distinção entre admitir uma alegação e concebê-la como verdadeira.
- source_word: ὅτι εἰσὶν θεοί
  choice: que eles são deuses
  rationale: Mantém o predicado explícito θεοί e a ironia da polêmica, sem substituir interpretativamente 'deuses' por 'ídolos'.
- source_word: Οὔτε ἀπὸ κλεπτῶν οὔτε ἀπὸ ληστῶν
  choice: De ladrões ou assaltantes
  rationale: 'Preserva de forma idiomática a dupla categoria do grego: quem furta e quem rouba mediante assalto.'
- source_word: οὐ μὴ διασώσωνται
  choice: certamente não se salvarão
  rationale: A negação enfática οὐ μή é representada por 'certamente não'; a forma verbal é vertida reflexivamente, destacando a incapacidade dos supostos deuses de preservar a si mesmos.
- source_word: θεοὶ ξύλινοι
  choice: esses deuses de madeira
  rationale: Conserva θεοί, em vez de explicá-lo como 'ídolos', e torna explícita em português a retomada do sujeito posposto.
- source_word: περιάργυροι καὶ περίχρυσοι
  choice: revestidos de prata e de ouro
  rationale: Comunica que os objetos de madeira têm cobertura externa de metais preciosos, preservando o contraste irônico entre aparência e substância.
theological_decisions:
- issue: Tradução de θεοί no contexto da polêmica contra a idolatria
  choice: deuses
  alternative: ídolos; supostos deuses
  rationale: O grego chama explicitamente os objetos de θεοί para atacar retoricamente essa pretensão. Manter 'deuses' conserva a formulação e a tensão do texto sem inserir a conclusão interpretativa no termo.
- issue: Sentido de διασώσωνται
  choice: não se salvarão
  alternative: não escaparão; não serão salvos
  rationale: 'A leitura reflexiva ressalta a ironia contextual: seres tidos por deuses não conseguem preservar nem a si mesmos. A forma grega admite matiz médio/passivo, por isso a alternativa é registrada em nota.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe foi levemente reorganizada para acomodar o sujeito posposto do grego e preservar a progressão da pergunta retórica para a afirmação irônica.
