lexical_decisions:
- source_word: ἀπὸ τοῦ ἱματισμοῦ αὐτῶν ἀφελόμενοι
  choice: Depois de tirarem deles as vestes
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal. A construção mantém o pronome grego e expressa de modo natural a retirada das vestes que estavam sobre os ídolos.
- source_word: τοῦ ἱματισμοῦ
  choice: as vestes
  rationale: Ἱματισμός designa vestuário coletivamente; «as vestes» é concreto, corrente e adequado ao ato descrito.
- source_word: οἱ ἱερεῖς
  choice: os sacerdotes
  rationale: Tradução direta do substantivo articulado, sem acrescentar um possessivo ausente no grego.
- source_word: ἐνδύουσιν
  choice: vestem
  rationale: Neste contexto, ἐνδύω significa pôr roupa em alguém; «vestem» preserva de modo conciso a estrutura transitiva.
- source_word: τὰς γυναῖκας αὐτῶν
  choice: suas mulheres
  rationale: Γυναῖκες pode significar «mulheres» ou «esposas». «Suas mulheres» preserva essa amplitude lexical e, no contexto familiar ao lado dos filhos, comunica naturalmente a provável referência às esposas.
- source_word: τὰ παιδία
  choice: seus filhos
  rationale: Παιδία designa crianças ou filhos. O possessivo é partilhado sintaticamente com o membro anterior na construção grega e fica claro em português.
theological_decisions:
- issue: Referente de αὐτῶν em «deles»
  choice: Manter o pronome no texto principal, com nota identificando os ídolos como referente contextual.
  alternative: Explicitar «dos ídolos» no texto principal.
  rationale: O contexto aponta claramente para as imagens idólatras, mas o grego emprega um pronome. A tradução preserva a forma e a coesão contextual do original sem esconder do leitor a identificação do referente.
- issue: Sentido de γυναῖκας
  choice: «suas mulheres», preservando a possibilidade lexical de mulheres/esposas.
  alternative: «suas esposas», explicitando a leitura familiar mais provável.
  rationale: A coordenação com «filhos» favorece «esposas», mas o substantivo grego não codifica de maneira exclusiva o estado conjugal. A formulação escolhida preserva a leve ambiguidade sem soar artificial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para evitar a leitura equivocada de que se retiram «vestes deles» pertencentes aos sacerdotes, preservando ao mesmo tempo o pronome do grego.
