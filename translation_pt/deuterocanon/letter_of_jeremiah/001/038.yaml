base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/038.yaml
  text: The wooden things and the gold-covered and silver-covered things are like stones from the mountain[a], and those who serve them will be put to shame.
translation:
  language: pt
  text: Os objetos de madeira, os revestidos de ouro e os revestidos de prata são semelhantes às pedras vindas do monte, e os que os servem[a] serão envergonhados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os adoram”. O verbo grego pode indicar serviço ou culto religioso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς ἀπὸ τοῦ ὄρους λίθοις
  choice: às pedras vindas do monte
  rationale: A expressão indica aquilo a que os objetos são comparados. “Pedras vindas do monte” preserva a origem expressa por ἀπό e a imagem de pedras comuns e inertes, sem acrescentar a ideia não explícita de extração em pedreira.
- source_word: ὡμοιωμένοι εἰσὶν
  choice: são semelhantes
  rationale: O particípio perfeito passivo com εἰμί tem aqui valor comparativo e resultativo. “São semelhantes” comunica esse estado de modo natural e digno em português.
- source_word: τὰ ξύλινα
  choice: os objetos de madeira
  rationale: O adjetivo substantivado significa literalmente coisas ou objetos de madeira. “Objetos” é mais natural que “coisas” neste contexto e evita inserir “ídolos”, embora o referente esteja claro no contexto amplo.
- source_word: τὰ περίχρυσα
  choice: os revestidos de ouro
  rationale: O termo descreve objetos cobertos ou revestidos de ouro. A formulação mantém a imagem material e o paralelismo da frase.
- source_word: τὰ περιάργυρα
  choice: os revestidos de prata
  rationale: Em paralelo com περίχρυσα, designa objetos cobertos ou revestidos de prata. A tradução preserva a simetria do grego.
- source_word: οἱ δὲ θεραπεύοντες αὐτά
  choice: os que os servem
  rationale: θεραπεύω pode indicar servir, cuidar ou, em contexto religioso, prestar culto. “Servem” conserva essa amplitude lexical e se ajusta ao contexto de serviço aos ídolos.
- source_word: κατασχυνθήσονται
  choice: serão envergonhados
  rationale: A forma futura passiva indica que essas pessoas sofrerão vergonha ou desonra. A tradução conserva tanto o valor passivo quanto a força futura da afirmação.
theological_decisions:
- issue: Sentido de θεραπεύοντες no contexto da idolatria
  choice: os que os servem
  alternative: os que os adoram
  rationale: O contexto permite entender o verbo como culto religioso, mas “servem” preserva melhor a extensão semântica do grego e a tensão entre serviço, cuidado ritual e adoração, sem estreitar desnecessariamente o sentido.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O marcador foi colocado junto a “servem”, expressão à qual a nota lexical se refere.
