  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/023.yaml
  text: For the gold with which they are adorned for beauty—unless someone wipes off the rust—it will certainly not shine; for not even when they were being cast did they perceive it.
translation:
  language: pt
  text: Pois, se ninguém remover a corrosão[a] do ouro com que se enfeitam como adorno, eles de modo nenhum brilharão; pois nem sequer perceberam quando estavam sendo fundidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ferrugem», «oxidação» ou «mancha corrosiva». O termo grego pode designar uma camada de corrosão ou mancha; «ferrugem» é tradicional, mas em sentido estrito se aplica ao ferro.'
    reason: Esclarece a amplitude de ἰός e evita sugerir que o ouro literalmente enferruja.
lexical_decisions:
- source_word: περιτίθενται
  choice: põem sobre si
  rationale: Preserva o valor médio do verbo e deixa claro que os ídolos recebem ou ostentam o revestimento de ouro.
- source_word: εἰς κάλλος
  choice: como enfeite
  rationale: Expressa de modo natural a finalidade estética do ouro, sem elevar o sentido a uma ideia abstrata de beleza.
- source_word: ἰόν
  choice: ferrugem
  rationale: É o equivalente tradicional e concreto para corrosão ou oxidação, embora o termo grego possa abranger uma camada de corrosão ou mancha em sentido mais amplo.
- source_word: οὐ μὴ στίλψωσιν
  choice: de modo nenhum brilharão
  rationale: Reproduz a negação enfática οὐ μή e mantém o verbo no plural, como no grego, referindo-o naturalmente aos ídolos.
- source_word: ἐχωνεύοντο
  choice: estavam sendo fundidos
  rationale: Mantém o aspecto passivo e durativo do imperfeito, aludindo ao processo de fabricação das imagens.
- source_word: ᾐσθάνοντο
  choice: perceberam
  rationale: 'Conserva a ironia do texto: as imagens nada sentiram nem perceberam durante sua própria fabricação.'
theological_decisions:
- issue: Referente do plural em “brilharão” e “estavam sendo fundidos”
  choice: Manter o plural, com referência implícita aos ídolos
  alternative: 'Regularizar para o singular, fazendo do ouro o sujeito: “ele não brilhará”'
  rationale: O texto grego apresenta formas verbais plurais, apesar de começar com “o ouro” no singular. A tradução preserva essa mudança sintática e a ênfase nos ídolos, em vez de harmonizá-la silenciosamente.
translation_notes:
  register: Português atual, claro e digno, com estrutura próxima do grego. A expressão enfática “de modo nenhum” preserva a força da negação original, e o plural verbal conserva a tensão sintática do texto-fonte.
