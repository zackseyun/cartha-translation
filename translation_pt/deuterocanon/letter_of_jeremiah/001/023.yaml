  naturalness: «O ouro que põem sobre si» é pouco natural e ambíguo em português, podendo sugerir pessoas que se vestem. Além disso, «o ouro ... brilharão» produz uma discordância gramatical sem esclarecer a retomada plural. Uma reformulação que explicite os ídolos como sujeito torna o período claro, sem perder a ironia do original.
  terminology: «Corrosão» é preferível como tradução principal de ἰός neste contexto, pois «ferrugem» em sentido estrito se associa ao ferro, enquanto o texto fala de ouro. A nota pode registrar «ferrugem» e «oxidação» como alternativas contextuais. «Adorno» é um equivalente atual e digno de εἰς κάλλος.
