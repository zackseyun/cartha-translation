  text: They are bought at every price[a], but there is no breath in them.
translation:
  language: pt
  text: São comprados a qualquer preço, mas neles não há sopro[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «espírito». A palavra grega πνεῦμα pode significar «sopro», «espírito» ou «vento»; aqui, o sentido é que os ídolos não têm vida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ πάσης τιμῆς
  choice: por todo preço
  rationale: Mantém de perto a expressão grega, indicando que os ídolos são adquiridos mediante pagamento, qualquer que seja o preço, sem especificar indevidamente seu valor.
- source_word: ἠγορασμένα
  choice: são comprados
  rationale: Reproduz o sentido passivo e comercial do particípio perfeito de ἀγοράζω; em português corrente, o presente passivo comunica naturalmente a condição desses objetos como mercadorias adquiridas.
- source_word: πνεῦμα
  choice: sopro
  rationale: No contexto de polêmica contra os ídolos, destaca concretamente que eles não têm vida. A possibilidade legítima de entender a palavra como «espírito» é preservada em nota.
- source_word: ἐν οἷς
  choice: neles
  rationale: Retoma de modo natural os objetos comprados e preserva o sentido locativo da construção grega.
theological_decisions:
- issue: Sentido de πνεῦμα no contexto da crítica aos ídolos
  choice: sopro
  alternative: espírito
  rationale: «Sopro» expressa a ausência de vida nos ídolos e conserva a associação bíblica concreta entre respiração e vida, sem impor uma afirmação metafísica mais forte. «Espírito» continua lexicalmente possível e consta na nota.
translation_notes:
  register: Português moderno, claro e digno, com construção concisa e contraste direto por meio de «mas». O marcador [a] aparece no texto principal.
