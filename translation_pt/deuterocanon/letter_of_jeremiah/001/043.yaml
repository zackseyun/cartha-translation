  text: But whenever one of them is dragged away by one of the passersby and lies with him[a], she reproaches the one next to her because she was not deemed worthy as she was[c][b], nor was her cord broken.
translation:
  language: pt
  text: Mas, quando uma delas é arrastada[a] por um dos que passam e se deita com ele[b], censura a que está ao lado, porque esta não foi considerada digna como ela, nem seu cordão foi rompido[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “é puxada” ou “é levada”; o verbo grego pode indicar que alguém é levado para longe, embora o contexto favoreça uma ação física.
    reason: lexical_alternative
  - marker: b
    text: “Deita-se com ele” traduz um eufemismo grego para relações sexuais.
    reason: cultural_note
  - marker: c
    text: O “cordão” provavelmente era uma amarra presa à imagem do ídolo. A sátira retrata essas figuras como mulheres que disputam atenção sexual.
    reason: cultural_note
lexical_decisions:
- source_word: ἐφελκυσθεῖσα
  choice: é arrastada
  rationale: O particípio passivo de ἐφέλκω indica ser puxada ou levada por outra pessoa. “É arrastada” preserva a força física da imagem satírica sem excluir por completo a noção mais ampla de ser levada.
- source_word: ὑπό τινος τῶν παραπορευομένων
  choice: por um dos que passam
  rationale: Reproduz de modo natural a referência indefinida a uma pessoa entre as que passam pelo local.
- source_word: κοιμηθῇ
  choice: se deita com ele
  rationale: O verbo funciona aqui como eufemismo para relações sexuais. A formulação é clara, sóbria e adequada ao registro bíblico.
- source_word: τὴν πλησίον
  choice: a que está ao lado
  rationale: Expressa a proximidade espacial da figura feminina adjacente e evita que “próxima” ou “vizinha” sugira uma relação social não indicada pelo texto.
- source_word: ὀνειδίζει
  choice: censura
  rationale: Comunica a ideia de repreender ou lançar uma afronta, mantendo um tom digno e compreensível.
- source_word: οὐκ ἠξίωται
  choice: não foi considerada digna
  rationale: Preserva o valor passivo e avaliativo do perfeito grego sem tornar a expressão excessivamente formal.
- source_word: ὥσπερ καὶ αὐτή
  choice: como ela
  rationale: 'Mantém a comparação concisa: a figura ao lado não recebeu o mesmo tratamento que aquela que a censura.'
- source_word: τὸ σχοινίον αὐτῆς διεράγη
  choice: teve seu cordão rompido
  rationale: Conserva a imagem concreta de σχοινίον e o sentido passivo de romper ou rasgar, sem determinar além do texto a função exata do cordão.
theological_decisions:
- issue: Referente de “uma delas” e das formas femininas
  choice: O texto principal apresenta figuras de ídolos femininas personificadas como mulheres.
  alternative: As formas femininas poderiam ser entendidas como mulheres ligadas aos santuários idólatras, e não como as próprias imagens.
  rationale: O contexto imediato ridiculariza os ídolos ao descrevê-los como mulheres que disputam atenção sexual; as formas femininas e a menção ao cordão favorecem a personificação das imagens. A nota sobre o cordão mantém prudência quanto aos detalhes da cena.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e direto; mantém-se a sátira áspera do original, bem como a imagem concreta e parcialmente incerta do cordão.
