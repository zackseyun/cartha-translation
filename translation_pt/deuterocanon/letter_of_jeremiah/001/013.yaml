  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/013.yaml
  text: And he holds a scepter like a man[a], a judge of a country[b], who will not destroy the one who sins against him.
translation:
  language: pt
  text: E ele tem um cetro como um homem, como um juiz de uma região[a], que não destruirá[b] aquele que peca contra ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de um país” ou “de uma terra”. O grego χώρα pode indicar terra, país ou região.
    reason: lexical_alternative
  - marker: b
    text: Ou “não matará” ou “não eliminará”. O verbo grego pode abranger desde matar até remover ou fazer desaparecer; aqui, ressalta a incapacidade do ídolo de punir.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκήπτρον
  choice: cetro
  rationale: Preserva de modo natural em português o símbolo régio e judicial de autoridade.
- source_word: κριτὴς
  choice: juiz
  rationale: É o equivalente direto do termo grego e mantém a imagem judicial, sem ampliá-la para a ideia mais genérica de governante.
- source_word: χώρας
  choice: de uma região
  rationale: χώρα pode designar terra, país ou região. O artigo indefinido preserva o caráter não especificado da expressão grega, e “região” evita impor uma unidade política precisa.
- source_word: ἀνελεῖ
  choice: não destruirá
  rationale: O verbo ἀναιρέω pode significar matar, eliminar ou fazer desaparecer. “Destruirá” conserva uma amplitude adequada ao contexto, no qual se ressalta a incapacidade do ídolo de punir.
- source_word: τὸν εἰς αὐτὸν ἁμαρτάνοντα
  choice: aquele que peca contra ele
  rationale: Reproduz naturalmente o particípio substantivado e mantém tanto a noção de pecado ou ofensa quanto a direção expressa por εἰς αὐτόν.
- source_word: ὡς ἄνθρωπος
  choice: como um homem
  rationale: Mantém de perto a comparação grega e a aparência humana atribuída ao ídolo.
- source_word: ἔχει
  choice: segura
  rationale: Embora o verbo básico signifique “ter”, “segura” exprime com naturalidade a posse visível do cetro nessa descrição da imagem.
theological_decisions:
- issue: O ídolo é descrito por meio de imagens de autoridade judicial humana
  choice: Manter a comparação direta com um homem que é juiz e, em seguida, afirmar sua incapacidade de destruir quem peca contra ele.
  alternative: Traduzir κριτὴς χώρας de modo mais amplo como “governante de um país”.
  rationale: A passagem ridiculariza o contraste entre o símbolo externo de autoridade e a impotência real do ídolo. “Juiz” conserva a dimensão judicial explícita de κριτής.
- issue: Referência do pronome relativo ὃς
  choice: Preservar a construção relativa sem explicitar adicionalmente que se trata do ídolo.
  alternative: Acrescentar uma formulação explicativa como “mas esse ídolo não poderá destruir”.
  rationale: O grego liga a oração relativa à figura masculina descrita como homem e juiz; explicitar “ídolo” resolveria uma relação sintática que o texto deixa formalmente vinculada à comparação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A aposição “juiz de uma região” conserva a estrutura comparativa e a imagem judicial do grego sem introduzir uma interpretação denominacional.
