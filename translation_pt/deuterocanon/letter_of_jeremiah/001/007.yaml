base_translation:
  language: en
  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/007.yaml
  text: For their tongue has been scraped by a craftsman[a], and they are overlaid with gold and silver[b], but they are false and cannot speak.
translation:
  language: pt
  text: Pois a língua delas foi raspada por um artesão[a], e elas são revestidas de ouro e de prata; mas são falsas[b] e não podem falar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «foi entalhada/alisada por um artesão». O verbo grego destaca o trabalho de raspar ou alisar feito pelo artesão no ídolo.
    reason: lexical_alternative
  - marker: b
    text: Ou «são mentiras». O grego pode caracterizar os ídolos como coisas falsas ou como expressões da própria falsidade.
    reason: alternative_reading
lexical_decisions:
- source_word: Γλῶσσα
  choice: língua
  rationale: Mantém o sentido físico primário e reforça o contraste com a incapacidade dos ídolos de falar.
- source_word: κατεξυσμένη
  choice: foi raspada
  rationale: Preserva a imagem concreta do trabalho de raspar ou alisar realizado na fabricação do ídolo, sem acrescentar ao texto que o resultado ficou liso.
- source_word: ὑπὸ τέκτονος
  choice: por um artesão
  rationale: τέκτων pode designar um trabalhador manual, especialmente em madeira, mas o contexto não exige a especificação «carpinteiro».
- source_word: περίχρυσα καὶ περιάργυρα
  choice: revestidas de ouro e de prata
  rationale: Expressa de modo natural a cobertura externa por ambos os metais e mantém o paralelismo dos dois adjetivos gregos.
- source_word: ψευδῆ
  choice: falsas
  rationale: Conserva a amplitude do predicativo neutro plural, que pode caracterizar os ídolos como coisas falsas ou como falsidades, sem especificar engano ativo.
- source_word: οὐ δύνανται λαλεῖν
  choice: não podem falar
  rationale: Tradução direta e idiomática da incapacidade de produzir fala.
theological_decisions:
- issue: Natureza do predicativo ψευδῆ aplicado aos ídolos
  choice: são falsas
  alternative: são mentiras
  rationale: «Falsas» preserva a denúncia dos ídolos sem decidir se o grego os chama de objetos falsos ou de personificações da falsidade.
translation_notes:
  register: Português moderno, digno e acessível, com construção direta. «Artesão» evita restringir τέκτων a carpinteiro; «raspada» mantém a imagem material incomum do grego. O marcador [b] foi colocado após «falsas», termo ao qual a nota se refere.
