lexical_decisions:
- source_word: αὐτοί τε
  choice: E os próprios
  rationale: O pronome enfático αὐτοί destaca os próprios fabricantes, enquanto τε liga a afirmação ao argumento anterior; a formulação preserva ambos os valores com naturalidade.
- source_word: οἱ κατασκευάσαντες
  choice: que os fizeram
  rationale: O particípio aoristo designa os artesãos que produziram os ídolos. “Fizeram” é claro, corrente e suficientemente amplo para imagens confeccionadas.
- source_word: αὐτά
  choice: os
  rationale: O pronome retoma os ídolos mencionados no contexto; o masculino plural corresponde ao antecedente natural em português.
- source_word: οὐ μὴ γένωνται
  choice: de modo algum viverão
  rationale: A combinação οὐ μή com o subjuntivo expressa negação enfática de uma possibilidade futura. Em conjunto com πολυχρόνιοι, a construção idiomática em português é “de modo algum viverão”.
- source_word: πολυχρόνιοι
  choice: por muito tempo
  rationale: O adjetivo predicativo significa “longevos” ou “de longa duração”; aplicado a pessoas, “viver por muito tempo” comunica o sentido de maneira natural.
