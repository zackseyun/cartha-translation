  text: Therefore[a], knowing that they are not gods, do not fear them.
translation:
  language: pt
  text: Portanto, sabendo que eles não são deuses, não tenham medo deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνόντες
  choice: sabendo
  rationale: O particípio aoristo de γινώσκω tem aqui valor circunstancial, provavelmente causal. “Sabendo” é natural em português e mantém a realidade reconhecida como fundamento da ordem.
- source_word: οὖν
  choice: portanto
  rationale: Marca a conclusão extraída da argumentação anterior; “portanto” preserva com clareza essa força inferencial.
- source_word: οὐκ εἰσὶν θεοί
  choice: eles não são deuses
  rationale: Reproduz diretamente a predicação negativa grega, sem acrescentar uma categoria interpretativa como “seres divinos”.
- source_word: μὴ φοβῆσθε
  choice: não tenham medo
  rationale: Expressa de modo corrente e digno a proibição do imperativo grego. No português moderno, “ter medo de” soa mais natural e amplamente compreensível do que “temer” neste contexto.
- source_word: αὐτούς
  choice: deles
  rationale: Retoma os ídolos mencionados no contexto sem inserir no texto principal um substantivo explicativo ausente do grego.
theological_decisions:
- issue: Tradução de θεοί no contexto da polêmica contra a idolatria
  choice: deuses
  alternative: seres divinos
  rationale: O texto nega que os ídolos sejam deuses. “Deuses” mantém a correspondência lexical e a força retórica, sem resolver a afirmação por meio de uma formulação teológica mais interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A construção mantém a inferência, a circunstância causal e a referência pronominal do grego.
