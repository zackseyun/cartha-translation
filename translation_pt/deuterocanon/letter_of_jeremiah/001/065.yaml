  text: For they can neither curse kings nor bless them[a].
translation:
  language: pt
  text: Pois eles não podem nem amaldiçoar reis nem abençoá-los.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego: “certamente não amaldiçoarão reis, nem [os] abençoarão”, com negação enfática; no contexto, o sentido é que eles não têm poder para fazer nenhuma dessas coisas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔτε γὰρ
  choice: Pois ... nem ... nem
  rationale: γάρ introduz a explicação, bem representada por “Pois”; οὔτε... οὔτε forma a correlação negativa “nem... nem” em português.
- source_word: βασιλεῦσιν
  choice: reis
  rationale: Embora esteja no dativo plural, funciona como complemento de “amaldiçoar” e, por paralelismo, de “abençoar”; o português pede objeto direto.
- source_word: οὐ μὴ καταράσωνται
  choice: não podem ... amaldiçoar
  rationale: A negação enfática οὐ μή com o subjuntivo aoristo expressa forte negação ou impossibilidade. Neste contexto de denúncia da impotência dos ídolos, “não podem” comunica naturalmente a incapacidade.
- source_word: οὔτε μὴ εὐλογήσωσι
  choice: nem abençoá-los
  rationale: Mantém o paralelismo com a primeira oração e explicita pelo pronome o objeto subentendido, os reis.
theological_decisions:
- issue: Valor da negação enfática na polêmica contra os ídolos
  choice: 'Expressar incapacidade: “não podem nem... nem...”'
  alternative: 'Expressar negação enfática futura: “certamente não amaldiçoarão reis nem os abençoarão”'
  rationale: O grego admite uma negação enfática de caráter prospectivo, mas o contexto ressalta a impotência dos ídolos. A formulação escolhida comunica esse sentido sem introduzir uma capacidade ou ação ausente do texto.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Amaldiçoar” e “abençoar” preservam o contraste verbal do grego; o pronome em “abençoá-los” retoma explicitamente “reis”.
