  text: They will certainly not rescue a man from death[a], nor will they deliver the weaker from the strong.
translation:
  language: pt
  text: De modo algum poderão livrar alguém da morte, nem livrar o mais fraco do forte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem resgatar o mais fraco do forte”. O grego emprega um adjetivo comparativo (“o mais fraco”) em contraste com “o forte”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ θανάτου
  choice: da morte
  rationale: Expressa de modo natural em português o livramento para fora do domínio ou da ameaça da morte, sem definir se se trata de morte iminente ou já consumada.
- source_word: ἄνθρωπον
  choice: alguém
  rationale: O substantivo singular é genérico neste contexto; “alguém” conserva a referência a uma pessoa concreta sem sugerir que a afirmação se limite ao sexo masculino.
- source_word: οὐ μὴ ῥύσωνται
  choice: De modo algum poderão livrar
  rationale: A construção οὐ μή com o futuro comunica negação enfática. “De modo algum” preserva essa força, e “livrar” transmite adequadamente o sentido de resgate diante do perigo.
- source_word: ἥττονα
  choice: o mais fraco
  rationale: Mantém o comparativo grego e a oposição concisa com “o forte”.
- source_word: ἀπὸ ἰσχυροῦ
  choice: das mãos do forte
  rationale: A expressão portuguesa explicita idiomaticamente que o forte é aquele sob cujo poder se encontra o mais fraco, sem alterar a relação indicada por ἀπό.
- source_word: μὴ ἐξέλωνται
  choice: nem resgatar
  rationale: O verbo no médio pode indicar retirar alguém de uma situação de perigo; “resgatar” forma um paralelo natural com “livrar” sem repetição mecânica.
