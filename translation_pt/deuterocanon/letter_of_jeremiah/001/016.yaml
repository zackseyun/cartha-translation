  text: Such are their gods[a], set up in houses. Their eyes are full of dust from the feet of those who enter.
translation:
  language: pt
  text: Tais são os deuses deles[a], instalados em casas. Seus olhos estão cheios de poeira, trazida pelos pés dos que entram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os ídolos deles”. O texto grego diz “os deuses deles”, preservando a forma polêmica como o autor se refere às imagens cultuadas pelas nações.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιοῦτοι ὑπάρχουσιν
  choice: Assim são
  rationale: Reproduz de modo natural e conciso o juízo demonstrativo do grego, mantendo sua força retórica.
- source_word: οἱ θεοὶ αὐτῶν
  choice: os deuses deles
  rationale: Mantém a designação explícita do texto grego e sua ironia polêmica, sem substituí-la interpretativamente por “ídolos” no texto principal.
- source_word: καθιδρυμένων αὐτῶν ἐν τοῖς οἴκοις
  choice: instalados nas casas
  rationale: Expressa a colocação das imagens em posição fixa; “casas” preserva οἴκοις sem restringir indevidamente o sentido a templos.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: Seus olhos
  rationale: Conserva a imagem corporal literal, essencial à sátira contra a impotência das imagens.
- source_word: πλήρεις εἰσὶν κονιορτοῦ
  choice: estão cheios da poeira
  rationale: Mantém concretamente a imagem de poeira acumulada nos olhos.
- source_word: ἀπὸ τῶν ποδῶν τῶν εἰσπορευομένων
  choice: dos pés dos que entram
  rationale: Preserva a origem da poeira indicada por ἀπό e o sentido geral e contínuo do particípio substantivado.
theological_decisions:
- issue: Referente de “os deuses deles”
  choice: Conservar “os deuses deles” como designação polêmica das imagens cultuadas.
  alternative: “os ídolos deles”
  rationale: Embora o contexto trate de ídolos inanimados, o grego diz explicitamente “deuses”; manter essa forma preserva a retórica e a tensão do texto em vez de explicá-las no corpo da tradução.
translation_notes:
  register: Português moderno, claro e digno, com formulação acessível no Brasil e compreensível internacionalmente. A sintaxe concisa preserva o tom satírico do original.
