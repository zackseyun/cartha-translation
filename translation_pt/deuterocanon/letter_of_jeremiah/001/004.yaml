  text: Therefore be on your guard[a], lest you too, having become like the foreigners, become like them, and fear seize you because of them,
translation:
  language: pt
  text: Portanto, fiquem atentos, para que vocês também, tornando-se semelhantes aos estrangeiros, não se tornem semelhantes a eles[a], nem o medo se apodere de vocês por causa deles,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sendo assimilados aos estrangeiros, não sejam assimilados a eles”. O grego repete o mesmo verbo duas vezes, para dar ênfase.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλαβήθητε
  choice: fiquem atentos
  rationale: O imperativo, neste contexto de advertência, pede cautela vigilante. A expressão é atual e clara, sem sugerir o sentido devocional de “sejam reverentes”.
- source_word: οὖν
  choice: portanto
  rationale: Preserva a relação de conclusão com a advertência anterior.
- source_word: μὴ καὶ ὑμεῖς
  choice: para que vocês também ... não
  rationale: Reproduz de modo idiomático a construção grega de advertência e mantém a inclusão enfática dos destinatários.
- source_word: ἀφομοιωθέντες ... ἀφομοιωθῆτε
  choice: tornando-se semelhantes ... não se tornem semelhantes
  rationale: Mantém a repetição enfática do mesmo verbo grego, usando uma formulação compreensível em português, embora a sequência permaneça deliberadamente incomum como no texto-fonte.
- source_word: τοῖς ἀλλοφύλοις
  choice: aos estrangeiros
  rationale: Expressa diretamente a ideia de pessoas de outro povo, sem introduzir as associações técnicas posteriores de “gentios”.
- source_word: φόβος ὑμᾶς λάβῃ
  choice: o medo se apodere de vocês
  rationale: Conserva a imagem vívida do medo como algo que toma ou domina uma pessoa.
- source_word: ἐπʼ αὐτοῖς
  choice: por causa deles
  rationale: É uma tradução portuguesa natural da relação expressa pela preposição e preserva a referência pronominal sem especificar além do grego.
theological_decisions:
- issue: Alcance da advertência expressa pela repetição de ἀφομοιόω
  choice: Manter a advertência ampla contra tornar-se semelhante aos estrangeiros, sem explicitar no corpo do texto um tipo específico de assimilação.
  alternative: Explicitar que se trata exclusivamente de imitar as práticas idólatras dos povos estrangeiros.
  rationale: O contexto aponta para a imitação ligada à idolatria, mas o versículo usa linguagem mais ampla. A tradução conserva essa amplitude e evita transformar uma inferência contextual em conteúdo explícito.
- issue: Escopo da negação μή sobre a oração relativa ao medo
  choice: Traduzir a segunda oração com “nem”, incluindo-a na advertência negativa.
  alternative: Traduzir simplesmente “e o medo se apodere de vocês”, deixando menos explícito o escopo da negação.
  rationale: A coordenação grega permite entender que μή rege os dois verbos no subjuntivo. “Nem” torna essa estrutura clara em português sem alterar o conteúdo da advertência.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais (“vocês”, “fiquem”). A repetição incomum foi preservada por corresponder a uma característica real do grego. A vírgula final foi mantida porque o versículo continua sintaticamente na unidade seguinte.
