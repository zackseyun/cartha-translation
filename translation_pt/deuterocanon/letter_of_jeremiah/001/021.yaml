  verdict: revise
  source_fidelity: 'A tradução transmite corretamente a imagem e preserva a repetição espacial de ἐπί. Contudo, a nota de rodapé não oferece uma alternativa adequada: «voam para cima de» significa voar em direção ao alto, não voar/pousar sobre algo. A construção final mantém, como no grego, os gatos associados à ação expressa pelo verbo.'
  naturalness: «Sobre o corpo e sobre a cabeça deles pousam...» é aceitável, mas «Sobre os corpos e as cabeças deles pousam...» é mais natural em português neste contexto coletivo e evita que o singular possa sugerir apenas uma imagem. A coordenação final fica mais fluente com vírgulas, sem o ponto e vírgula desnecessariamente separador.
  terminology: «Morcegos», «andorinhas», «aves» e «gatos» são equivalentes corretos. «Pousam» é uma boa solução para ἐφίπτανται; a nota deve explicar a alternativa sem introduzir um sentido direcional incorreto.
  issues:
