  text: Upon their bodies and upon their heads bats[a], swallows, and the birds alight, and likewise also the cats.
translation:
  language: pt
  text: Sobre os corpos e as cabeças deles pousam[a] morcegos, andorinhas e aves, e também os gatos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «voam sobre» ou «descem sobre».'
    reason: Alternativas lexicais para ἐφίπτανται, que pode salientar o voo ou a descida sobre uma superfície.
lexical_decisions:
- source_word: ἐπὶ τὸ σῶμα αὐτῶν καὶ ἐπὶ τὴν κεφαλήν
  choice: Sobre o corpo e sobre a cabeça deles
  rationale: Mantém a repetição de ἐπί e o singular distributivo de σῶμα e κεφαλή, referindo-se às imagens mencionadas no contexto.
- source_word: ἐφίπτανται
  choice: pousam
  rationale: Expressa o movimento de voar até uma superfície e permanecer nela. Embora o mesmo verbo também alcance os gatos no grego, a leve estranheza resultante preserva a construção e a força irônica do original.
- source_word: νυκτερίδες
  choice: morcegos
  rationale: Equivalente zoológico comum e direto.
- source_word: χελιδόνες
  choice: andorinhas
  rationale: Equivalente específico e corrente, sem generalizar a espécie.
- source_word: τὰ ὄρνεα
  choice: aves
  rationale: Preserva o termo coletivo e a sequência do grego sem acrescentar 'outras', que não está explicitado no texto.
- source_word: ὡσαύτως δὲ καὶ οἱ αἴλουροι
  choice: e também os gatos
  rationale: Reproduz de modo natural a força aditiva da expressão e mantém o sentido usual de αἴλουροι.
theological_decisions:
- issue: Natureza da crítica contra os ídolos
  choice: Traduzir literalmente a presença dos animais sobre as imagens, evidenciando sua impotência.
  alternative: Interpretar os animais como símbolos ou explicitar que profanam os ídolos.
  rationale: O texto fundamenta sua crítica na cena concreta de animais pousando ou ficando sobre as imagens; não há base no versículo para impor simbolismo adicional.
translation_notes:
  register: Português moderno, claro e digno, com estrutura levemente elevada. A repetição de “sobre” acompanha o grego; o ponto e vírgula torna clara a inclusão enfática dos gatos sem alterar a relação sintática.
