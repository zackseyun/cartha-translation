    issue: 'A nota lexical «Ou: voam para cima de» é semanticamente incorreta.'
    rationale: ἐφίπτανται descreve voo ou descida sobre uma superfície, não movimento ascendente («para cima»). A nota precisa ser substituída por uma alternativa que preserve a relação espacial.
  - severity: low
    issue: O singular «o corpo e ... a cabeça deles» é menos natural no português para o conjunto de imagens referido pelo pronome plural.
    rationale: Embora o grego apresente os substantivos no singular, o plural português comunica com mais clareza a referência distributiva/coletiva, sem alterar o sentido.
