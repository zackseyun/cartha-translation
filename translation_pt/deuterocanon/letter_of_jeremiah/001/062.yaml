  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/062.yaml
  text: And the fire sent from above[a], to consume mountains and forests, does what it was appointed to do[b]; but these are not comparable to it either in appearance or in power.
translation:
  language: pt
  text: E o fogo enviado do alto para consumir montanhas e florestas cumpre o que lhe foi determinado[a]; esses, porém, não se comparam a ele nem na aparência nem no poder.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «cumpre o que lhe foi ordenado». A expressão grega pode indicar aquilo que foi disposto, determinado ou ordenado.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: «não foram feitos semelhantes a ele» ou «não foram equiparados a ele», nem na aparência nem no poder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῦρ
  choice: fogo
  rationale: Sentido direto e natural; o fogo, com seu poder destrutivo real, é contrastado com os ídolos impotentes.
- source_word: ἐξαποσταλὲν ἄνωθεν
  choice: enviado do alto
  rationale: Preserva tanto a ideia de envio quanto a origem superior implícita, sem explicitar «do céu» ou «por Deus», elementos que o grego não nomeia.
- source_word: ἐξαναλῶσαι
  choice: consumir
  rationale: Expressa de modo idiomático a ação destrutiva e completa do fogo sobre montanhas e florestas.
- source_word: ὄρη καὶ δρυμούς
  choice: montanhas e florestas
  rationale: Equivalência clara e corrente para os acidentes elevados e as extensões arborizadas mencionados no texto.
- source_word: ποιεῖ τὸ συνταχθέν
  choice: cumpre o que lhe foi determinado
  rationale: Comunica que o fogo realiza aquilo que foi disposto, ordenado ou designado para ele, mantendo a amplitude semântica de συντάσσω.
- source_word: ταῦτα
  choice: esses
  rationale: Pronome substantivado que remete aos ídolos do contexto sem repetir explicitamente o substantivo ausente desta oração no grego.
- source_word: οὔτε ταῖς ἰδέαις οὔτε ταῖς δυνάμεσιν
  choice: nem na aparência nem no poder
  rationale: 'Mantém os dois aspectos da comparação: forma visível e capacidade efetiva.'
- source_word: ἀφωμοιωμένα
  choice: não se comparam a ele
  rationale: Formulação portuguesa natural para a ideia de não serem tornados semelhantes, equiparados ou comparáveis ao fogo.
theological_decisions:
- issue: Origem implícita do fogo «do alto»
  choice: Manter «do alto» sem identificar expressamente a origem como o céu ou Deus.
  alternative: «do céu» ou «enviado por Deus»
  rationale: ἄνωθεν sugere uma origem superior, possivelmente celeste ou divina no contexto, mas a oração não nomeia o céu nem Deus; a tradução preserva essa implicação sem a tornar explícita.
- issue: Referente de ταῦτα
  choice: Usar «esses», deixando o referente depender do contexto anterior.
  alternative: «esses ídolos»
  rationale: O referente contextual são os ídolos, mas o grego emprega apenas o pronome; a redação escolhida evita inserir na oração um substantivo não expresso.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente ajustada para fluidez, sem apagar a oposição entre a eficácia do fogo e a impotência dos ídolos. Os marcadores foram posicionados junto às expressões às quais as notas efetivamente se referem, corrigindo o aparente desencontro existente na camada inglesa de consulta.
