translation:
  language: pt
  text: Pois o meu anjo está com vocês, e ele próprio zela pela vida de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “busca as almas de vocês”. A palavra grega também pode significar “vidas” ou “pessoas”.
    reason: Registra tanto a imagem verbal mais literal de ἐκζητῶν quanto a amplitude lexical de ψυχαί.
lexical_decisions:
- source_word: ἄγγελός
  choice: anjo
  rationale: Embora ἄγγελος também possa significar “mensageiro”, a fala divina em primeira pessoa e o contexto de proteção favorecem aqui o sentido de um ser celestial.
- source_word: μεθʼ ὑμῶν
  choice: com vocês
  rationale: μετά com o genitivo expressa companhia; “com vocês” é a correspondência direta e natural em português.
- source_word: αὐτὸς
  choice: ele próprio
  rationale: Preserva a ênfase do pronome grego, indicando que o próprio anjo exerce pessoalmente essa ação.
- source_word: ἐκζητῶν
  choice: zela por
  rationale: O particípio significa literalmente “buscando” ou “procurando com empenho”. Com “vida” como objeto, uma tradução verbal literal poderia sugerir em português que o anjo pretende tirá-la; “zela por” comunica naturalmente o sentido contextual de atenção protetora, enquanto a nota registra a forma literal.
- source_word: τὰς ψυχὰς ὑμῶν
  choice: pela vida de vocês
  rationale: ψυχή pode designar alma, vida ou a própria pessoa. O singular distributivo “a vida de vocês” é natural em português e, neste contexto, exprime a preservação concreta das pessoas sem impor uma dicotomia entre alma e corpo.
theological_decisions:
- issue: Sentido de ψυχή no contexto da proteção divina
  choice: a vida de vocês
  alternative: as almas de vocês
  rationale: “Vida” se ajusta ao cuidado protetor exercido pelo anjo e evita introduzir uma concepção específica da relação entre corpo e alma. Como “almas” continua sendo uma possibilidade lexical legítima e tradicional, ela é preservada em nota.
- issue: Sentido contextual de ἐκζητῶν
  choice: zela por
  alternative: busca/procura
  rationale: O grego conserva a imagem de buscar com empenho, mas “buscar a vida de alguém” pode ter em português o sentido oposto, o de querer matá-lo. “Zela por” expressa a atenção protetora indicada pelo contexto sem definir além disso a natureza ou a atuação do anjo.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para legibilidade ampla no Brasil. “Ele próprio” mantém a ênfase do original, e “zela pela vida” evita a conotação ameaçadora que “busca a vida” teria em português.
