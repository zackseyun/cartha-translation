translation:
  language: pt
  text: com os rostos enegrecidos pela fumaça vinda da casa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do santuário” ou “do templo”; em grego, “da casa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμελανωμένον
  choice: enegrecido
  rationale: O particípio perfeito passivo indica o estado resultante de ter ficado negro; “enegrecido” preserva a imagem concreta e soa natural em português.
- source_word: τὸ πρόσωπον αὐτῶν
  choice: com o rosto
  rationale: Embora o possuidor seja plural, o grego emprega πρόσωπον no singular distributivo. O português também admite naturalmente “com o rosto” para cada um deles, preservando a forma da fonte.
- source_word: ἀπὸ τοῦ καπνοῦ
  choice: pela fumaça
  rationale: ἀπό exprime aqui causa ou origem; “pela fumaça” comunica de modo natural aquilo que produziu o enegrecimento.
- source_word: τοῦ ἐκ τῆς οἰκίας
  choice: que vem da casa
  rationale: A expressão especifica a origem da fumaça. “Casa” conserva o sentido comum de οἰκία sem introduzir no texto uma identificação cultual mais específica.
theological_decisions:
- issue: Se οἰκία deve ser interpretada como “santuário” ou “templo” no contexto dos ídolos
  choice: casa
  alternative: santuário; templo
  rationale: O grego usa o termo comum οἰκία, e não um vocábulo cultual específico. A tradução mantém o sentido lexical direto, enquanto a nota registra as interpretações contextualmente possíveis.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção funciona como continuação sintática do contexto anterior, tal como o fragmento grego. “Fumaça” é preferido a “fumo” por sua abrangência internacional e naturalidade no Brasil.
