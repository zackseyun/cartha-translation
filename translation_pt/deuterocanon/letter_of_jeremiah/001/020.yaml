  verdict: revise
  source_fidelity: A tradução reproduz corretamente o enegrecimento causado pela fumaça e conserva «casa» para οἰκία. Contudo, «com o rosto» deixa sem expressão o possessivo plural αὐτῶν; em português, «os rostos» é a forma distributiva natural e torna explícito que se trata dos rostos deles. «Que vem da casa» também sugere uma ação presente, enquanto o grego apenas identifica a origem da fumaça.
  naturalness: «Com os rostos enegrecidos pela fumaça vinda da casa» é claro, moderno e mantém adequadamente o caráter de fragmento sintático do original.
  terminology: «Enegrecidos» transmite bem o particípio perfeito passivo μεμελανωμένον como estado resultante. «Casa» preserva o sentido não interpretativo de οἰκία; a nota registra de modo apropriado as alternativas contextuais «santuário» e «templo».
  issues:
  - severity: medium
    issue: O possessivo plural αὐτῶν não está explicitamente refletido em «com o rosto».
    rationale: Embora o singular distributivo seja possível em português em alguns contextos, o texto grego identifica expressamente os rostos como pertencentes a «eles». «Com os rostos» preserva isso de forma idiomática e sem ambiguidade.
  - severity: low
    issue: «Que vem da casa» introduz um matiz de presente em curso.
    rationale: O particípio/expressão preposicional grega qualifica a origem da fumaça, não afirma que ela esteja vindo no momento. «Vinda da casa» mantém a relação de origem com maior precisão.
