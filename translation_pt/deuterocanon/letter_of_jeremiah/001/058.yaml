  yaml_path: translation/deuterocanon/letter_of_jeremiah/001/058.yaml
  text: So a king who displays his own courage is better than the false gods[a], or a useful vessel in a house, which its owner will use, or a door in a house that keeps safe the things in it, or the false gods, and a wooden pillar in palaces is better than the false gods.
translation:
  language: pt
  text: Assim, um rei que demonstra a própria coragem é melhor do que os falsos deuses[a]; também um utensílio útil numa casa, que seu dono usará, é melhor do que os falsos deuses; até mesmo uma porta numa casa, que mantém a salvo o que há nela, é melhor do que os falsos deuses; e uma coluna de madeira em palácios é melhor do que os falsos deuses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego repete três vezes a expressão “os falsos deuses”, reforçando retoricamente as comparações.
    reason: Explica a repetição enfática do texto grego e a explicitação da série comparativa em português.
lexical_decisions:
- source_word: ὥστε
  choice: Assim
  rationale: Introduz a conclusão decorrente do argumento anterior, em linguagem natural e digna.
- source_word: κρεῖσσον
  choice: é melhor
  rationale: Expressa diretamente a comparação de superioridade e permite conservar a cadência repetida do texto grego.
- source_word: βασιλέα ἐπιδεικνύμενον τὴν ἑαυτοῦ ἀνδρείαν
  choice: um rei que demonstra a própria coragem
  rationale: O substantivo sem artigo tem sentido genérico; a formulação preserva tanto a ação pública de demonstrar quanto a ênfase reflexiva de ἑαυτοῦ.
- source_word: σκεῖος ἐν οἰκίᾳ χρήσιμον
  choice: um utensílio útil numa casa
  rationale: σκεῖος designa de modo amplo um objeto empregado para alguma finalidade; “utensílio” comunica melhor sua utilidade doméstica sem restringi-lo a um recipiente.
- source_word: ἐφʼ ᾧ χρήσεται ὁ κεκτημένος
  choice: que seu dono usará
  rationale: Formulação corrente que transmite a utilidade prática do objeto e o sentido daquele que o possui.
- source_word: οἱ ψευδεῖς θεοί
  choice: os falsos deuses
  rationale: No contexto polêmico, ψευδεῖς caracteriza essas divindades como falsas, em contraste com o Deus verdadeiro.
- source_word: θύρα ἐν οἰκίᾳ διασώζουσα τὰ ἐν αὐτῇ ὄντα
  choice: uma porta numa casa, que mantém a salvo o que há nela
  rationale: “Mantém a salvo” comunica a função protetora de διασώζουσα. O pronome “nela” conserva a possível referência formal à porta ou à casa, ambas femininas no grego e no português.
- source_word: ξύλινος στύλος ἐν βασιλείοις
  choice: uma coluna de madeira em palácios
  rationale: Mantém a imagem arquitetônica concreta e verte naturalmente o plural βασιλείοις.
theological_decisions:
- issue: Estrutura retórica das comparações com ἢ οἱ ψευδεῖς θεοί
  choice: Repetir explicitamente “é melhor do que os falsos deuses” em cada grupo comparativo.
  alternative: Reunir rei, utensílio, porta e coluna numa única lista seguida de uma só comparação.
  rationale: A repetição preserva a força polêmica e a cadência do grego, sem reduzir a crítica reiterada à impotência dos falsos deuses.
- issue: Referente de αὐτῇ em τὰ ἐν αὐτῇ ὄντα
  choice: Usar “nela”, mantendo aberta a referência à porta ou à casa.
  alternative: Explicitar “dentro da casa” ou “atrás da porta”.
  rationale: Como θύρα e οἰκία são femininos, a forma grega admite ambiguidade gramatical; a tradução não a resolve sem necessidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. “Utensílio” evita o sentido excessivamente específico de “vaso”, e os pontos e vírgulas tornam legível a estrutura comparativa reiterada.
