  text: Likewise[a], they are certainly not able to give either wealth or bronze; if someone makes a vow to them and does not pay it back[b], they will certainly not seek it.
translation:
  language: pt
  text: Do mesmo modo, eles de modo algum podem dar riqueza nem bronze[a]; se alguém lhes fizer um voto e não o cumprir, de modo algum o exigirão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cobre”; talvez com referência a dinheiro ou a objetos valiosos feitos desse metal.
    reason: lexical_alternative
  - marker: b
    text: Ou “o procurarão” ou “o buscarão”. O grego diz literalmente “o buscarão/procurarão”; neste contexto, o sentido pode ser “o exigirão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως
  choice: Do mesmo modo
  rationale: Introduz naturalmente mais um exemplo paralelo no argumento contra os ídolos.
- source_word: πλοῦτον
  choice: riqueza
  rationale: Expressa de forma ampla bens materiais ou riquezas, sem restringir o sentido a dinheiro.
- source_word: χαλκὸν
  choice: bronze
  rationale: Mantém no texto principal a referência literal ao metal, deixando em nota a alternativa 'cobre' e a possível alusão a dinheiro ou objetos valiosos.
- source_word: οὐ μὴ δύνωνται δοῦναι
  choice: de modo algum podem dar
  rationale: A locução 'de modo algum' comunica a forte negação de οὐ μή em português natural e digno.
- source_word: ἐάν τις αὐτοῖς εὐχὴν εὐξάμενος
  choice: se alguém lhes fizer um voto
  rationale: Traduz idiomaticamente a construção cognata grega, cujo sentido no contexto é fazer um voto.
- source_word: μὴ ἀποδῷ
  choice: não o pagar
  rationale: '''Pagar um voto'' é uma expressão portuguesa natural que preserva a imagem concreta de entregar o que foi prometido; ''cumprir'' seria uma alternativa possível.'
- source_word: οὐ μὴ ἐπιζητήσωσιν
  choice: de modo algum o reclamarão
  rationale: No contexto de um voto não pago, 'reclamar' comunica o ato de exigir o que é devido, mantendo em nota o sentido mais literal de 'procurar' ou 'buscar'.
theological_decisions:
- issue: A impotência dos ídolos em relação a bens materiais e votos
  choice: Os ídolos não podem conceder riqueza ou metal valioso, nem reclamar o cumprimento de um voto.
  alternative: Entender 'bronze' especificamente como dinheiro e traduzir o verbo final literalmente como 'buscar' ou mais diretamente como 'exigir'.
  rationale: A formulação conserva a sátira do contexto contra a impotência dos ídolos sem especificar além do grego a forma da riqueza ou a natureza exata da cobrança.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A dupla ocorrência de 'de modo algum' reproduz a forte negação grega sem recorrer a uma construção arcaica. Os marcadores foram posicionados junto aos termos a que as notas se referem.
