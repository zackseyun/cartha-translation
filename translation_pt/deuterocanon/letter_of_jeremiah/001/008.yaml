  text: And as for a woman who loves adornment[a], taking gold they make crowns for the heads of their gods;
translation:
  language: pt
  text: E, como para uma jovem que gosta de adornos[a], eles pegam ouro e fazem coroas para as cabeças de seus deuses;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “uma virgem” ou “uma donzela”; a comparação evoca uma jovem que aprecia adornos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ
  choice: como
  rationale: Introduz a comparação de modo natural em português, sem enfraquecer seu valor comparativo.
- source_word: παρθένῳ
  choice: para uma jovem
  rationale: O dativo indica a figura para quem se faria o adorno. “Jovem” preserva a referência feminina e a naturalidade, enquanto o sentido mais específico de “virgem” é registrado em nota.
- source_word: φιλοκόσμῳ
  choice: que gosta de se enfeitar
  rationale: Expressa em linguagem corrente a ideia de alguém que aprecia adornos ou ornamentos.
- source_word: λαμβάνοντες
  choice: eles pegam
  rationale: Reproduz o particípio como ação coordenada em português claro, mantendo o mesmo sujeito de “fazem”.
- source_word: χρυσίον
  choice: ouro
  rationale: Equivalente direto, sem acrescentar a ideia de objetos ou joias não explicitada no grego.
- source_word: κατασκευάζουσιν
  choice: fazem
  rationale: Neste contexto, o verbo descreve de modo simples e preciso a confecção das coroas.
- source_word: στεφάνους
  choice: coroas
  rationale: O contexto de adornos de ouro colocados na cabeça favorece “coroas”, embora o termo também possa designar grinaldas.
- source_word: ἐπὶ τὰς κεφαλάς
  choice: para a cabeça
  rationale: Com o verbo “fazem”, a construção indica a destinação das coroas. O singular distributivo é idiomático em português e não altera a referência plural aos deuses.
- source_word: τῶν θεῶν αὐτῶν
  choice: de seus deuses
  rationale: Mantém a formulação explícita do grego, sem substituí-la interpretativamente por “ídolos”.
theological_decisions:
- issue: Traduzir θεῶν como “deuses” ou interpretá-lo como “ídolos”
  choice: de seus deuses
  alternative: de seus ídolos
  rationale: Embora o contexto seja uma crítica às imagens cultuais, o grego diz literalmente “seus deuses”. A tradução conserva essa formulação e deixa a identificação polêmica surgir do contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A expressão “como para uma jovem” conserva a comparação e o dativo do grego sem desenvolver explicitamente uma ação que o texto apenas pressupõe.
