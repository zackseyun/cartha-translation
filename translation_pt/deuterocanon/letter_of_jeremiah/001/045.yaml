  text: They are made by carpenters and goldsmiths; they can become nothing other than what the craftsmen want them to become.
translation:
  language: pt
  text: Eles são feitos por carpinteiros e ourives; não podem tornar-se nada além do que os artesãos querem que se tornem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπὸ τεκτόνων καὶ χρυσοχόων
  choice: por carpinteiros e ourives
  rationale: Ὑπό com o genitivo indica os agentes da fabricação; os termos concretos distinguem os trabalhadores da madeira dos que trabalham o ouro.
- source_word: κατεσκευασμένα εἰσίν
  choice: são feitos
  rationale: Reproduz de modo natural a construção passiva e o estado resultante expresso pelo particípio perfeito, destacando que os ídolos são produtos humanos.
- source_word: οὐθὲν ἄλλο μὴ γένηται
  choice: não podem tornar-se nada além
  rationale: 'Expressa em português corrente a limitação enfática do texto: eles não adquirem forma ou condição independente da vontade de seus fabricantes.'
- source_word: βούλονται
  choice: querem
  rationale: Preserva diretamente a ideia de vontade, sem restringi-la ao sentido mais deliberativo de 'pretendem'.
- source_word: οἱ τεχνῖται
  choice: os artesãos
  rationale: Termo geral e atual para trabalhadores habilidosos, adequado após as designações específicas 'carpinteiros e ourives'.
- source_word: αὐτὰ γενέσθαι
  choice: que sejam
  rationale: Em português, esta formulação completa naturalmente a construção volitiva. Embora não repita lexicalmente 'tornar-se', mantém o sentido da forma ou identidade que os artesãos lhes dão.
theological_decisions:
- issue: Natureza da afirmação sobre os ídolos
  choice: A tradução apresenta os ídolos como produtos inteiramente dependentes da fabricação e da vontade humanas.
  alternative: 'Uma versão mais literal poderia dizer: ''não se tornam nada diferente do que os artesãos querem que se tornem''.'
  rationale: As duas orações unem fabricação humana e ausência de identidade ou condição independente. A formulação conserva a força da crítica à idolatria sem acrescentar afirmações teológicas que não estejam no texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Ourives' e 'artesãos' são precisos e correntes; a sintaxe evita literalismo pesado sem perder a ênfase do grego.
