  text: And the women[a], with cords wrapped around themselves, sit in the streets[b], burning bran.
translation:
  language: pt
  text: E as mulheres, tendo colocado cordas ao redor de si[a], estão sentadas nas ruas, queimando farelo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “envoltas em cordas”. O grego diz que as próprias mulheres colocaram cordas ao redor de si, mas não explica aqui seu significado simbólico.'
    reason: lexical_alternative
  - marker: b
    text: Trata-se de farelo queimado para produzir fumaça, talvez como oferta semelhante ao incenso; o grego não emprega aqui o termo habitual para “incenso”. O particípio grego correspondente a “queimando” está no singular feminino, embora “mulheres” esteja no plural.
    reason: cultural_note_and_source_grammar
lexical_decisions:
- source_word: περιθέμεναι
  choice: tendo colocado ... ao redor de si
  rationale: O particípio médio indica que as mulheres puseram algo em torno de si mesmas. A formulação conserva o sentido reflexivo sem atribuir às cordas um significado ritual que o texto não explica.
- source_word: σχοινία
  choice: cordas
  rationale: O termo designa cordas ou cordões. “Cordas” é direto e não define de modo indevido sua espessura ou função simbólica.
- source_word: ἐν ταῖς ὁδοῖς
  choice: nas ruas
  rationale: No cenário público descrito, “ruas” é o equivalente moderno e idiomático de ὁδοί.
- source_word: ἐγκάθηνται
  choice: ficam sentadas
  rationale: O verbo descreve a posição de estar ou permanecer sentado; esta formulação se ajusta ao quadro descritivo.
- source_word: θυμιῶσα
  choice: queimando
  rationale: O verbo pode denotar produzir fumaça ou queimar como oferta aromática. “Queimando” preserva a ação sem transformar o farelo em incenso comum.
- source_word: τὰ πίτυρα
  choice: farelo
  rationale: πίτυρα designa normalmente farelo, e não palha ou casca de cereal.
theological_decisions:
- issue: Sentido ritual das cordas e da queima de farelo
  choice: Descrever apenas as ações visíveis das mulheres, sem explicar seu simbolismo
  alternative: Identificar as cordas e o farelo como elementos de um rito específico de fertilidade ou de culto
  rationale: O grego relata as ações, mas não declara seu significado. Uma identificação ritual mais precisa importaria uma interpretação não expressa no versículo.
translation_notes:
  register: Português moderno, claro e digno, com construção descritiva natural. A tradução mantém a indefinição do rito e registra em nota a discordância de número presente no texto grego.
