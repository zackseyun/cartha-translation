  text: I have sinned, Lord, I have sinned, and I myself know my lawless deeds;
translation:
  language: pt
  text: Pequei, Senhor, pequei, e eu mesmo reconheço as minhas transgressões[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as minhas iniquidades”. O termo grego indica atos de desrespeito ou violação da lei de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμάρτηκα
  choice: Pequei
  rationale: O perfeito ativo grego apresenta o pecado como cometido e ainda relevante no momento da confissão. Em português, o pretérito perfeito simples é a forma natural para essa confissão e, no contexto, mantém sua relevância presente.
- source_word: κύριε
  choice: Senhor
  rationale: Vocativo de κύριος. “Senhor” é a correspondência direta e natural em oração; não se acrescenta a interjeição “ó”, que não é exigida pelo grego.
- source_word: τὰς ἀνομίας μου
  choice: as minhas transgressões
  rationale: ἀνομία designa desrespeito ou violação da lei. “Transgressões” comunica de modo natural e solene atos que ultrapassam os limites da lei divina, sem o tom jurídico moderno de “atos ilegais”.
- source_word: γινώσκω
  choice: reconheço
  rationale: Embora γινώσκω tenha o sentido básico de “conhecer”, no contexto penitencial indica consciência e admissão das próprias transgressões. “Reconheço” preserva tanto o aspecto cognitivo quanto a força confessional, sem tornar a frase artificial em português.
- source_word: ἐγώ
  choice: eu mesmo
  rationale: O pronome explícito é enfático, pois a forma verbal já identifica a primeira pessoa. “Eu mesmo” reproduz essa ênfase de modo claro em português.
theological_decisions:
- issue: Tradução do termo moral ἀνομία numa oração penitencial
  choice: transgressões
  alternative: iniquidades; atos contrários à lei
  rationale: “Transgressões” conserva a ideia de violação da lei e é mais transparente para leitores atuais do que “iniquidades”. A nota registra a alternativa tradicional e explicita o alcance do termo grego.
- issue: Valor de γινώσκω no contexto da confissão
  choice: reconheço
  alternative: conheço; sei
  rationale: O verbo não precisa ser reduzido a uma fórmula teológica de confissão, mas o contexto torna “reconheço” uma expressão natural da consciência e admissão do pecado. A tradução mantém a tensão entre conhecimento e confissão.
- issue: Forma de tratamento κύριε
  choice: Senhor
  alternative: ó Senhor
  rationale: O vocativo simples segue diretamente o grego e mantém um registro contemporâneo e digno, sem intensificação litúrgica adicional.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição enfática “Pequei, Senhor, pequei” e o pronome “eu mesmo” preservam a intensidade penitencial do grego.
