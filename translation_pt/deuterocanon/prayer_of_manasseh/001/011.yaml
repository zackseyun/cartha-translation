  text: And now I bend the knee of my heart[a], imploring the kindness from you[b];
translation:
  language: pt
  text: E agora dobro o joelho do meu coração[a], suplicando pela bondade que vem de ti[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «inclino o joelho do meu coração». O grego conserva a imagem vívida de ajoelhar-se interiormente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «suplicando por tua bondade». A expressão grega inclui literalmente a ideia de algo «da parte de ti», ressaltando que essa bondade procede de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: E agora
  rationale: Preserva tanto a ligação expressa por καί quanto a referência temporal imediata de νῦν.
- source_word: κλίνω
  choice: dobro
  rationale: Expressa concretamente o ato de dobrar ou inclinar e combina naturalmente com «joelho».
- source_word: γόνυ καρδίας
  choice: o joelho do meu coração
  rationale: Mantém o singular e a metáfora marcante de uma postura interior de humildade, sem a substituir por uma explicação.
- source_word: δεόμενος
  choice: suplicando
  rationale: Comunica um pedido intenso e humilde em registro atual e digno.
- source_word: τῆς παρὰ σοῦ χρηστότητος
  choice: pela bondade que vem de ti
  rationale: «Bondade» traduz χρηστότης de modo natural no contexto, enquanto «que vem de ti» conserva explicitamente a força de παρὰ σοῦ.
theological_decisions:
- issue: Metáfora γόνυ καρδίας
  choice: Conservar «o joelho do meu coração».
  alternative: «inclino humildemente o coração»
  rationale: A imagem corporal aplicada ao interior exprime o arrependimento e a humilhação do suplicante; explicá-la no texto eliminaria sua força poética.
- issue: Origem divina da χρηστότης
  choice: Conservar «que vem de ti».
  alternative: «tua bondade»
  rationale: A formulação preserva a possibilidade de que a expressão destaque não só a posse, mas a bondade que procede de Deus.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é solene sem arcaísmo; usa-se «ti» por coerência com a oração dirigida diretamente a Deus. A metáfora incomum do original foi preservada.
