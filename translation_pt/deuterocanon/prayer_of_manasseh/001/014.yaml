base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/014.yaml
  text: and in me you will show your kindness[a]; for you will save me, though I am unworthy, according to your abundant mercy[b],
translation:
  language: pt
  text: e em mim[a] mostrarás a tua bondade[b], pois me salvarás, embora eu seja indigno, segundo a tua grande misericórdia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a mim” ou “por meio de mim”; em grego, “em mim”.
    reason: lexical_alternative
  - marker: b
    text: Ou “benignidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δείξεις
  choice: mostrarás
  rationale: O futuro de δείκνυμι é vertido diretamente por “mostrarás”, forma natural que preserva o sentido e o tempo verbal.
- source_word: ἐν ἐμοί
  choice: em mim
  rationale: Mantém o valor mais direto de ἐν e a ideia de que a bondade de Deus se torna visível no próprio caso do orante, sem decidir entre os possíveis sentidos “a mim” e “por meio de mim”.
- source_word: χρηστότητά
  choice: bondade
  rationale: “Bondade” é corrente e digna, expressa bem χρηστότης e mantém a ligação lexical e temática com a ocorrência do mesmo substantivo no versículo 11.
- source_word: ἀνάξιον ὄντα
  choice: embora eu seja indigno
  rationale: A construção participial significa literalmente “sendo indigno”; a formulação concessiva explicita em português o contraste contextual com a ação salvadora de Deus sem acrescentar uma ideia estranha ao texto.
- source_word: σώσεις
  choice: me salvarás
  rationale: “Salvar” conserva a amplitude de σῴζω, que pode envolver livramento e salvação em sentido religioso.
- source_word: κατὰ τὸ πολὺ ἔλεός σου
  choice: segundo a tua grande misericórdia
  rationale: “Segundo” preserva o padrão ou medida expresso por κατά, enquanto “grande misericórdia” comunica de modo natural a intensidade de πολὺ ἔλεος.
theological_decisions:
- issue: Sentido de ἐν ἐμοί
  choice: em mim
  alternative: a mim; por meio de mim
  rationale: A formulação literal preserva a possibilidade de a bondade divina ser mostrada na pessoa, no caso ou por meio do testemunho do orante, evitando restringir indevidamente a frase a mero benefício recebido.
translation_notes:
  register: Português moderno, claro e reverente, com sintaxe natural e tratamento por “tu”, coerente com a oração dirigida diretamente a Deus. Preserva-se a vírgula final por se tratar de um segmento que continua no contexto.
