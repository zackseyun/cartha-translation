base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/009.yaml
  text: For I have sinned beyond the number of the sand of the sea. My lawless deeds have multiplied[a], Lord; my lawless deeds have multiplied, and I am not worthy to look up and see the height of heaven because of the multitude of my unrighteous acts.
translation:
  language: pt
  text: Pois pequei mais do que os grãos de areia do mar. Minhas violações da lei se multiplicaram, Senhor; minhas violações da lei se multiplicaram, e não sou digno de erguer o olhar[a] e ver a altura do céu, por causa da multidão dos meus atos de injustiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “olhar fixamente”. O verbo grego pode enfatizar um olhar firme ou atento, e não apenas a direção para o alto.
    reason: alternativa lexical
lexical_decisions:
- source_word: ἥμαρτον
  choice: pequei
  rationale: O aoristo apresenta o pecado confessado como fato; o pretérito perfeito é a forma natural em português e o contexto preserva sua consequência moral presente.
- source_word: ὑπὲρ ἀριθμὸν ψάμμου θαλάσσης
  choice: mais do que o número dos grãos de areia do mar
  rationale: Expressa excesso além de qualquer contagem e preserva a conhecida imagem bíblica da areia do mar; “grãos” torna a referência numérica idiomática em português.
- source_word: ἐπλήθυναν
  choice: se multiplicaram
  rationale: Preserva o sentido quantitativo de tornar-se numeroso e a repetição enfática do grego.
- source_word: ἀνομίαι
  choice: violações da lei
  rationale: Torna explícita para o leitor moderno a força de desrespeito à lei ou ordem divina, sem recorrer ao termo menos transparente “iniquidades”.
- source_word: κύριε
  choice: Senhor
  rationale: Mantém a forma direta e digna de tratamento a Deus, sem acrescentar uma interjeição ausente do texto.
- source_word: οὐκ εἰμὶ ἄξιος
  choice: não sou digno
  rationale: Equivalência direta que preserva o reconhecimento solene de indignidade.
- source_word: ἀτενίσαι
  choice: erguer o olhar
  rationale: No contexto de ver a altura do céu, comunica naturalmente o movimento implícito do olhar; uma nota preserva a possível ênfase lexical em olhar de modo fixo ou atento.
- source_word: ἰδεῖν
  choice: ver
  rationale: Verbo simples de percepção visual, traduzido em linguagem moderna sem arcaísmo.
- source_word: τὸ ὕψος τοῦ οὐρανοῦ
  choice: a altura do céu
  rationale: Preserva o singular e a imagem da elevação celeste.
- source_word: ἀπὸ τοῦ πλήθους
  choice: por causa da multidão
  rationale: A preposição tem valor causal no contexto; esta formulação é clara e natural em português.
- source_word: ἀδικιῶν
  choice: atos de injustiça
  rationale: Preserva a força moral de ἀδικία e a distingue de ἀνομίαι, evitando reduzir ambos os termos a “pecados”.
theological_decisions:
- issue: Distinção entre ἀνομίαι e ἀδικιῶν na mesma confissão
  choice: Traduzir ἀνομίαι por “violações da lei” e ἀδικιῶν por “atos de injustiça”
  alternative: Traduzir ambos por “pecados” ou “iniquidades”
  rationale: O grego emprega dois termos morais relacionados, mas distintos. Preservar essa diferença mantém a amplitude retórica da confissão sem impor uma distinção doutrinária mais rígida do que o texto permite.
- issue: Forma do vocativo κύριε
  choice: Senhor
  alternative: Ó Senhor
  rationale: A interpelação direta já comunica o vocativo em português moderno; “Ó” acrescentaria um tom litúrgico mais marcado que não é necessário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência confessional. A repetição de “minhas violações da lei se multiplicaram” foi mantida por ser enfática no grego. O marcador da nota foi colocado junto de “erguer o olhar”, expressão à qual a alternativa lexical se refere.
