  text: aquele que prendeu o mar pela palavra da tua ordem,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que conteve o mar pela palavra da tua ordem”. A imagem grega é, mais literalmente, a de prender ou acorrentar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πεδήσας
  choice: aquele que prendeu
  rationale: O particípio aoristo preserva a imagem concreta de prender ou pôr grilhões. “Prendeu” é natural em português e mantém a força da metáfora sem a explicar.
- source_word: τὴν θάλασσαν
  choice: o mar
  rationale: θάλασσα designa diretamente o mar; “as águas” ampliaria o sentido além da formulação grega.
- source_word: τῷ λόγῳ
  choice: pela palavra
  rationale: λόγος indica aqui palavra pronunciada ou expressão dotada de autoridade. “Pela palavra” comunica o meio pelo qual a ação é realizada e conserva a referência à fala divina.
- source_word: τοῦ προστάγματός σου
  choice: da tua ordem
  rationale: 'πρόσταγμα significa ordem ou mandamento. “Ordem” é clara, vigorosa e forma em português uma construção inteligível com “palavra”: “pela palavra da tua ordem”.'
theological_decisions:
- issue: A soberania divina sobre a criação expressa pela metáfora de prender o mar
  choice: Manter a imagem concreta “prendeu o mar”.
  alternative: “conteve o mar”, “confinou o mar” ou “impôs limites ao mar”
  rationale: O grego emprega uma imagem vívida de prender ou pôr grilhões. Preservá-la representa melhor a autoridade de Deus sobre o mar sem introduzir uma explicação ausente desta oração.
translation_notes:
  register: Português moderno, digno e de leitura natural, com uso de “tu” coerente com a oração dirigida a Deus. A formulação conserva a metáfora concreta do grego e a estrutura genitiva deliberadamente densa de “palavra da tua ordem”.
