base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/015.yaml
  text: And I will praise you continually all the days of my life[a], for all the host of the heavens sings praise to you, and yours is the glory forever[c][b]. Amen.
translation:
  language: pt
  text: E eu te louvarei continuamente durante os dias da minha vida, pois todo o exército dos céus[a] canta louvores a ti, e tua é a glória para sempre. Amém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo o poder dos céus” ou “cada poder celestial”. A expressão grega também pode designar a hoste ou os seres celestiais.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰνέσω
  choice: louvarei
  rationale: O futuro ativo de αἰνέω expressa o louvor que o orante continuará oferecendo; “louvarei” preserva com naturalidade o valor futuro.
- source_word: διὰ παντὸς
  choice: continuamente
  rationale: A locução adverbial indica continuidade ou constância. “Continuamente” evita acrescentar o adjetivo “todos” à expressão seguinte, que não o contém no grego.
- source_word: ἐν ταῖς ἡμέραις τῆς ζωῆς μου
  choice: durante os dias da minha vida
  rationale: Reproduz o período indicado por ἐν sem inserir πάσαις (“todos”), ausente do texto, e soa natural em português quando ligado a “continuamente”.
- source_word: ὅτι
  choice: pois
  rationale: Introduz a razão do louvor. “Pois” mantém o sentido causal e convém ao registro doxológico.
- source_word: ὑμνεῖ
  choice: canta louvores
  rationale: ὑμνέω pode indicar louvar por meio de canto; esta formulação conserva a nuance musical sem soar técnica.
- source_word: πᾶσα ἡ δύναμις τῶν οὐρανῶν
  choice: todo o exército dos céus
  rationale: No contexto celestial e litúrgico, δύναμις pode designar coletivamente as hostes ou os seres celestiais. “Exército dos céus” é compreensível e preserva a imagem coletiva, enquanto a nota registra a alternativa mais literal.
- source_word: σοῦ ἐστιν ἡ δόξα
  choice: tua é a glória
  rationale: A ordem conserva a ênfase no pronome possessivo e a força solene da doxologia.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente português corrente da fórmula doxológica que expressa duração sem fim.
- source_word: ἀμήν
  choice: Amém
  rationale: Forma litúrgica tradicional e amplamente compreendida em português.
theological_decisions:
- issue: Sentido de πᾶσα ἡ δύναμις τῶν οὐρανῶν
  choice: Referência coletiva ao exército ou à hoste celestial que louva a Deus
  alternative: A totalidade do poder dos céus, ou cada poder celestial
  rationale: O contexto doxológico e o uso judaico-grego de δύναμις em contextos celestiais favorecem uma referência a seres ou hostes celestiais. A tradução não especifica que sejam anjos, e a nota preserva a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e acessível, com cadência de oração. Evitou-se “todos os dias”, pois o grego traz “nos/durante os dias da minha vida” sem o adjetivo “todos”; a ideia de constância já é expressa por “continuamente”.
