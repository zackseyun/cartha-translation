  text: and the mercy of your promise is immeasurable and unsearchable;[a]
translation:
  language: pt
  text: e a misericórdia da tua promessa é imensurável e insondável;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a tua misericórdia prometida» ou «a misericórdia manifestada na tua promessa». O genitivo grego permite mais de uma interpretação estreitamente relacionada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμέτρητόν
  choice: imensurável
  rationale: Expressa aquilo que não pode ser medido e preserva de modo natural a força quantitativa do grego.
- source_word: ἀνεξιχνίαστον
  choice: insondável
  rationale: Comunica aquilo que não pode ser plenamente investigado ou perscrutado; é corrente, digno e forma um par natural com «imensurável».
- source_word: ἔλεος
  choice: misericórdia
  rationale: É a equivalência concisa e tradicional no contexto penitencial, sem acrescentar nuances ausentes do termo grego.
- source_word: ἐπαγγελίας
  choice: promessa
  rationale: Traduz diretamente o substantivo e mantém aberta a relação genitiva entre a promessa de Deus e a sua misericórdia.
- source_word: τε καὶ
  choice: e
  rationale: Coordena os dois adjetivos com naturalidade em português; a construção «tanto... como» seria possível, mas desnecessariamente marcada aqui.
theological_decisions:
- issue: Relação entre «misericórdia» e «promessa» em τὸ ἔλεος τῆς ἐπαγγελίας σου
  choice: «a misericórdia da tua promessa»
  alternative: «a tua misericórdia prometida» ou «a misericórdia manifestada na tua promessa»
  rationale: A formulação conserva a estrutura genitiva do grego e não determina se a misericórdia pertence à promessa, é prometida por ela ou nela se manifesta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal de leitura natural no Brasil. «Insondável» preserva a ideia de algo que não se pode investigar plenamente sem soar excessivamente técnico.
