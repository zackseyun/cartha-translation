base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/010.yaml
  text: I am bent down with many iron bonds[a], so that I cannot lift up my head, and there is no relief for me; because I provoked your wrath and did what is evil before you[b], setting up abominations and multiplying offenses.
translation:
  language: pt
  text: Estou curvado sob um pesado grilhão de ferro, sem poder erguer a cabeça[a], e não há alívio para mim; pois provoquei a tua ira e fiz o que é mau diante de ti, erguendo abominações[b] e multiplicando ofensas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem conseguir me recompor” ou “sem voltar a olhar para cima”; o infinitivo grego pode indicar recuperar-se ou levantar fisicamente a cabeça ou o corpo.
    reason: lexical_alternative
  - marker: b
    text: “Abominações” provavelmente se refere a atos ou objetos detestáveis, especialmente os ligados à idolatria.
    reason: cultural_note
lexical_decisions:
- source_word: κατακαμπτόμενος
  choice: Estou encurvado
  rationale: O particípio expressa a condição de alguém dobrado ou curvado sob um peso; “encurvado” mantém a imagem física e soa natural em português.
- source_word: πολλῷ δεσμῷ σιδηρῷ
  choice: sob pesadas correntes de ferro
  rationale: δεσμός pode designar laço, grilhão ou corrente, e o dativo indica aquilo que oprime o suplicante. A formulação plural e idiomática comunica a intensa sujeição sem perder a imagem do ferro.
- source_word: εἰς τὸ ἀνανεῦσαί με
  choice: a ponto de não poder erguer a cabeça
  rationale: No contexto de estar encurvado, ἀνανεύω sugere levantar-se ou olhar novamente para cima. A tradução mantém a imagem corporal; a nota registra outras possibilidades lexicais.
- source_word: ἄνεσις
  choice: alívio
  rationale: O substantivo denota afrouxamento, descanso, alívio ou soltura de uma pressão. “Alívio” abrange adequadamente a aflição e a sujeição descritas.
- source_word: παρώργισα τὸν θυμόν σου
  choice: provoquei a tua ira
  rationale: O verbo tem força causativa, “provocar à ira”, enquanto θυμός, neste contexto, expressa a grave indignação divina.
- source_word: τὸ πονηρὸν ἐνώπιόν σου ἐποίησα
  choice: fiz o que é mau diante de ti
  rationale: Preserva o conhecido idioma bíblico e sua orientação para Deus, em linguagem atual e clara.
- source_word: στήσας βδελύγματα
  choice: erguendo abominações
  rationale: στήσας indica pôr de pé ou erguer, e βδελύγματα designa coisas ou práticas detestáveis, provavelmente de caráter idolátrico, sem que isso precise ser explicitado no corpo do texto.
- source_word: πληθύνας προσοχθίσματα
  choice: multiplicando ofensas
  rationale: O substantivo raro se refere ao que provoca repulsa ou indignação. “Ofensas” conserva amplitude sem impor uma identificação mais específica.
theological_decisions:
- issue: Linguagem referente à ira divina
  choice: a tua ira
  alternative: a tua indignação / o teu furor
  rationale: O texto atribui diretamente θυμός a Deus. “Ira” conserva a gravidade do juízo divino sem acrescentar uma estrutura doutrinária posterior.
- issue: Sentido da imagem corporal em εἰς τὸ ἀνανεῦσαί με
  choice: a ponto de não poder erguer a cabeça
  alternative: a ponto de não conseguir me recompor / voltar a olhar para cima
  rationale: A imagem imediata é a de alguém encurvado sob correntes de ferro. Preservar o gesto físico mantém a força penitencial, enquanto a nota reconhece a amplitude semântica do verbo.
- issue: Identificação de βδελύγματα
  choice: abominações
  alternative: ídolos / práticas idolátricas
  rationale: Embora o termo provavelmente tenha referência cultual ou idolátrica, o grego não nomeia explicitamente os objetos como ídolos; a tradução preserva essa margem de sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construções naturais para leitores brasileiros. Mantém-se a segunda pessoa singular (“tua”, “ti”) para a oração dirigida a Deus, sem arcaísmos verbais. A tradução procura conservar a imagem corporal, a linguagem de ira divina e a possível referência idolátrica sem eliminar ambiguidades genuínas.
