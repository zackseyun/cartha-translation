base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/008.yaml
  text: So you[a], Lord, God of the righteous, did not appoint repentance for the righteous—for Abraham and Isaac and Jacob, who did not sin against you—but you appointed repentance for me, the sinner,
translation:
  language: pt
  text: Assim, tu, Senhor, Deus dos justos, não estabeleceste[a] o arrependimento para os justos — para Abraão, Isaque e Jacó, que não pecaram contra ti —, mas estabeleceste o arrependimento para mim, o pecador,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não puseste o arrependimento para os justos ... mas o puseste para mim”. O verbo grego pode significar “pôr” ou “estabelecer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ οὖν
  choice: Assim, tu
  rationale: οὖν introduz uma conclusão ou retomada. “Assim” conserva essa ligação de modo natural, enquanto “tu” mantém a ênfase explícita do pronome grego.
- source_word: κύριε
  choice: Senhor
  rationale: Forma consagrada e natural de tratamento direto em linguagem de oração.
- source_word: ὁ θεὸς τῶν δικαίων
  choice: Deus dos justos
  rationale: Preserva a construção genitiva e a repetição do campo semântico de δικαιοσύνη sem explicitação interpretativa.
- source_word: οὐκ ἔθου
  choice: não estabeleceste
  rationale: O aoristo médio de τίθημι tem aqui o sentido de pôr, determinar ou estabelecer. “Estabelecer” combina naturalmente com “arrependimento” e conserva a ação deliberada atribuída a Deus.
- source_word: μετάνοιαν
  choice: o arrependimento
  rationale: Equivalente teológico corrente de μετάνοια, que denota mudança de mente e arrependimento, sem ampliar o texto para “oportunidade de se arrepender”.
- source_word: δικαίοις
  choice: para os justos
  rationale: A preposição “para” expressa de modo natural o dativo associado a “estabelecer” e mantém o contraste com “o pecador”.
- source_word: τῷ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: para Abraão, Isaque e Jacó
  rationale: A expressão em aposição identifica os justos mencionados. As formas dos nomes seguem uso bíblico português amplamente reconhecível.
- source_word: τοῖς οὐχ ἡμαρτηκόσιν σοι
  choice: que não pecaram contra ti
  rationale: O particípio perfeito descreve os patriarcas como não tendo pecado contra Deus. A formulação direta conserva a afirmação do texto sem qualificá-la.
- source_word: ἀλλ᾽ ἔθου μετάνοιαν ἐμοὶ
  choice: mas estabeleceste o arrependimento para mim
  rationale: 'A repetição preserva o paralelismo enfático do grego: não para os justos, mas para o orante.'
- source_word: τῷ ἁμαρτωλῷ
  choice: o pecador
  rationale: O artigo e a aposição a ἐμοί favorecem “o pecador”, mantendo a autodepreciação e o contraste retórico com “os justos”.
theological_decisions:
- issue: A declaração de que Abraão, Isaque e Jacó “não pecaram contra ti” pode parecer tensionar outras descrições bíblicas dos patriarcas.
  choice: 'Manter a afirmação direta: “que não pecaram contra ti”.'
  alternative: “que não pecaram gravemente contra ti”, “que não foram considerados pecadores diante de ti” ou “que não pecaram nesse assunto”.
  rationale: O grego οὐχ ἡμαρτηκόσιν σοι não contém qualificação. A tradução preserva a retórica e a tensão teológica do texto, sem harmonização.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “tu” coerente com a oração e com as formas verbais correspondentes. A sintaxe paralela e a repetição de “estabeleceste o arrependimento” reproduzem a estrutura retórica do grego. O marcador [a] está colocado após a oração a que a alternativa se refere.
