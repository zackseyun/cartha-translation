base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/007.yaml
  text: For you are the Lord Most High[a], compassionate, patient, and abounding in mercy[b], and relenting concerning the evils of men.
translation:
  language: pt
  text: Pois tu és o Senhor Altíssimo, compassivo, paciente e rico em misericórdia, e voltas atrás[a] quanto aos males dos seres humanos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “te arrependes”. Aqui o verbo grego indica que Deus reconsidera ou desiste do juízo, não necessariamente arrependimento por culpa moral.
    reason: lexical_alternative
  - marker: b
    text: Ou “quanto às maldades humanas”. A expressão grega é condensada e pode referir-se aos males ou às maldades dos seres humanos.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος ὕψιστος
  choice: Senhor Altíssimo
  rationale: Preserva o título divino convencional e a força superlativa de ὕψιστος em português natural.
- source_word: εὔσπλαγχνος
  choice: compassivo
  rationale: Expressa profunda compaixão sem repetir o campo lexical de misericórdia presente em πολυέλεος.
- source_word: μακρόθυμος
  choice: paciente
  rationale: Comunica de modo atual e conciso a ideia de longanimidade e domínio prolongado da ira.
- source_word: πολυέλεος
  choice: rico em misericórdia
  rationale: Reproduz a intensidade do composto grego em linguagem digna e idiomática.
- source_word: μετανοῶν
  choice: voltas atrás
  rationale: No contexto de uma ação atribuída a Deus, indica que ele reconsidera ou desiste do juízo, sem sugerir arrependimento moral por uma falta.
- source_word: ἐπὶ κακίαις ἀνθρώπων
  choice: quanto aos males dos seres humanos
  rationale: 'Mantém a formulação grega condensada e sua possível amplitude: κακίαις pode apontar para males, maldades ou calamidades, e ἀνθρώπων refere-se genericamente à humanidade.'
theological_decisions:
- issue: Sentido de μετανοῶν quando predicado de Deus
  choice: voltas atrás
  alternative: te arrependes
  rationale: A escolha conserva a responsividade divina presente no texto, mas evita que o português atribua necessariamente culpa moral anterior a Deus; a alternativa literal é registrada em nota.
- issue: Amplitude de κακίαις na relação com ἀνθρώπων
  choice: males dos seres humanos
  alternative: maldades humanas
  rationale: A redação principal não decide silenciosamente se estão em vista as maldades praticadas pelas pessoas ou os males associados a elas; a nota explicita a leitura alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa do singular preserva o discurso direto a Deus; evitou-se linguagem arcaica, e as notas mantêm as ambiguidades lexicais relevantes.
