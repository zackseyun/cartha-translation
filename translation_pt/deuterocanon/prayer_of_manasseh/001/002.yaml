translation:
  language: pt
  text: aquele que fez o céu e a terra, com toda a sua ordem[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com todo o seu adorno” ou “com todo o seu arranjo”. Aqui, o grego κόσμος provavelmente se refere ao conjunto ordenado pertencente ao céu e à terra, não a uma segunda menção ao “mundo”.
    reason: Alternativa lexical para κόσμος e preservação de sua amplitude semântica.
lexical_decisions:
- source_word: ὁ ποιήσας
  choice: aquele que fez
  rationale: O particípio aoristo com artigo tem função substantiva e descreve Deus como aquele que realizou a ação. “Aquele que fez” preserva essa forma sem acrescentar a nuance específica de “criou”.
- source_word: τὸν οὐρανὸν
  choice: o céu
  rationale: Na expressão cosmológica formada com “a terra”, “o céu” é a correspondência bíblica natural; “firmamento” ou “céus” acrescentariam especificações não exigidas pelo singular grego.
- source_word: τὴν γῆν
  choice: a terra
  rationale: No par abrangente “o céu e a terra”, γῆ designa a terra como parte do conjunto da criação, e não uma região ou território particular.
- source_word: σὺν
  choice: com
  rationale: A preposição indica associação ou inclusão. “Com” é direto e natural em português, deixando claro que a expressão seguinte também pertence ao que foi feito.
- source_word: παντὶ τῷ κόσμῳ αὐτῶν
  choice: toda a ordem deles
  rationale: κόσμος pode significar ordem, arranjo ou adorno. Como o céu e a terra já foram mencionados, “mundo” seria redundante e potencialmente enganoso. “Deles” representa αὐτῶν e vincula essa ordem ao céu e à terra.
theological_decisions:
- issue: Sentido de κόσμος na fórmula cosmológica da criação
  choice: ordem
  alternative: adorno; arranjo; conjunto organizado; tudo o que há neles
  rationale: O termo grego conserva aqui uma amplitude entre ordem, arranjo e adorno. “Ordem” comunica o caráter organizado do conjunto pertencente ao céu e à terra sem introduzir uma segunda referência ao “mundo”; a nota registra as alternativas legítimas.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura “aquele que fez” mantém o caráter descritivo do particípio grego; a vírgula final foi preservada por se tratar de um segmento contínuo da oração.
