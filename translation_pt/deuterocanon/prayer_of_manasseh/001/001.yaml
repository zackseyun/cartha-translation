  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/001.yaml
  text: Lord Almighty[a], God of our fathers, of Abraham and Isaac and Jacob and of their righteous offspring,
translation:
  language: pt
  text: Senhor Todo-Poderoso, Deus de nossos pais, de Abraão, de Isaque e de Jacó, e da justa descendência[a] deles,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “semente”. O termo grego também pode ser traduzido mais literalmente por “semente”, especialmente em contextos de linhagem e aliança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Senhor
  rationale: Vocativo de κύριος como forma de dirigir-se a Deus; “Senhor” é a correspondência bíblica natural e preserva a solenidade da invocação.
- source_word: παντοκράτωρ
  choice: Todo-Poderoso
  rationale: Título divino consagrado em português para aquele que detém todo o poder e domínio; é claro, solene e idiomático.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Deus de nossos pais
  rationale: Mantém a fórmula bíblica de aliança e o substantivo masculino explícito no grego, sem neutralizá-lo como “antepassados”.
- source_word: τοῦ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: de Abraão, de Isaque e de Jacó
  rationale: A repetição de “de” explicita naturalmente em português a relação genitiva com Deus e conserva a cadência solene da enumeração.
- source_word: σπέρματος
  choice: descendência
  rationale: No contexto, o singular coletivo σπέρμα designa a linhagem dos patriarcas. “Descendência” é natural em português e preserva melhor esse valor coletivo do que “descendentes”; a tradução literal “semente” é registrada em nota por sua possível ressonância de aliança.
- source_word: αὐτῶν
  choice: deles
  rationale: O pronome plural retoma naturalmente Abraão, Isaque e Jacó.
- source_word: τοῦ δικαίου
  choice: justa
  rationale: O adjetivo concorda com o singular coletivo “descendência”. “Justa” é uma tradução corrente de δίκαιος e preserva sua dimensão moral e teológica.
theological_decisions:
- issue: Linguagem pactual marcada por gênero em τῶν πατέρων ἡμῶν
  choice: pais
  alternative: antepassados
  rationale: O grego diz literalmente “pais”, numa fórmula bíblica tradicional; a tradução conserva essa forma sem ampliar ou neutralizar o referente.
- issue: Sentido de σπέρμα no contexto de linhagem
  choice: descendência
  alternative: semente
  rationale: “Descendência” comunica com clareza o referente humano e mantém o caráter coletivo singular, enquanto a nota preserva a tradução mais literal e sua ressonância pactual.
- issue: Relação de τοῦ δικαίου com σπέρματος
  choice: justa descendência
  alternative: descendência dos justos
  rationale: A concordância singular no grego indica que “justa” qualifica a descendência coletiva; não se deve transformar a expressão numa referência autônoma a “os justos”.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A ordem próxima do grego e a enumeração dos patriarcas preservam a cadência de oração. O marcador foi colocado após “deles”, junto ao termo a que a nota realmente se refere.
