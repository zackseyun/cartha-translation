lexical_decisions:
- source_word: ὁ κλείσας
  choice: que fechaste
  rationale: O particípio aoristo integra uma sequência de descrições do destinatário. A forma verbal na segunda pessoa é natural em português dentro da oração dirigida a Deus e conserva a ação concreta de κλείω.
- source_word: τὴν ἄβυσσον
  choice: o abismo
  rationale: Em grego bíblico, ἄβυσσος pode designar a profundeza primordial ou insondável. “O abismo” preserva essa ressonância cósmica e teológica.
- source_word: σφραγισάμενος
  choice: o selaste
  rationale: O particípio médio expressa o ato de pôr um selo de modo eficaz. “Selaste” é conciso, digno e mantém a imagem concreta do original.
- source_word: αὐτὴν
  choice: o
  rationale: O pronome retoma “o abismo”. Em português, o pronome oblíquo evita repetição e concorda com o gênero do substantivo traduzido.
- source_word: τῷ ... ὀνόματί σου
  choice: com o teu ... nome
  rationale: O dativo tem valor instrumental, indicando o meio pelo qual o abismo foi selado. “Com” comunica isso naturalmente.
- source_word: φοβερῷ
  choice: temível
  rationale: φοβερός descreve aquilo que inspira temor ou reverência. “Temível” conserva o peso solene do termo sem sugerir que o próprio nome esteja amedrontado.
- source_word: ἐνδόξῳ
  choice: glorioso
  rationale: “Glorioso” traduz diretamente a ideia de honra, esplendor e glória, além de formar uma combinação litúrgica natural com “temível”.
theological_decisions:
- issue: Sentido de φοβερῷ aplicado ao nome de Deus
  choice: temível
  alternative: assombroso
  rationale: “Temível” preserva a noção de que o nome divino inspira temor reverente. “Assombroso” explicita melhor a dimensão de admiração reverencial, mas pode enfraquecer a referência ao temor; por isso aparece como alternativa em nota.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe adequada a uma oração dirigida diretamente a Deus. Emprega-se “teu” para manter fluidez e dignidade amplamente compreensíveis, sem arcaísmo excessivo.
