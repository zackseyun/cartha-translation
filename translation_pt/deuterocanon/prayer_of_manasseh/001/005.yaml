base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/005.yaml
  text: before whom all things shudder and tremble at the presence of your power[a], for the majesty of your glory is unendurable, and the wrath of your threat against sinners is unbearable[d][c][b],
translation:
  language: pt
  text: perante quem tudo estremece e treme por causa da presença do teu poder[a], pois é impossível suportar a majestade da tua glória[b], e é impossível resistir à ira da tua ameaça contra os pecadores[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “da face — ou presença — do teu poder”; também pode ser entendido como “diante da presença do teu poder”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não se pode resistir à majestade da tua glória”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “é impossível suportar a ira da tua ameaça contra os pecadores”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: perante quem
  rationale: O pronome relativo retoma Deus no versículo anterior. “Perante quem” expressa de modo natural a reação provocada por sua presença, sem acrescentar um novo referente.
- source_word: πάντα
  choice: tudo
  rationale: O neutro plural abrange a totalidade das coisas, conservando o alcance cósmico sem restringi-lo apenas a pessoas.
- source_word: φρίσσει καὶ τρέμει
  choice: estremece e treme
  rationale: Os dois verbos próximos são mantidos para preservar a intensificação poética do temor, embora em português também sejam quase sinônimos.
- source_word: ἀπὸ προσώπου τῆς δυνάμεώς σου
  choice: por causa da presença do teu poder
  rationale: A expressão significa literalmente “da face/presença do teu poder”. Aqui, ἀπό pode indicar a causa da reação; a formulação escolhida é clara e conserva a noção de presença.
- source_word: ἄστεκτος
  choice: é impossível suportar
  rationale: O adjetivo descreve aquilo que não pode ser sustentado, enfrentado ou suportado. A locução evita o sentido cotidiano e depreciativo que “insuportável” pode ter.
- source_word: μεγαλοπρεπία τῆς δόξης σου
  choice: a majestade da tua glória
  rationale: “Majestade” comunica a grandeza solene de μεγαλοπρεπία, enquanto “glória” preserva o peso religioso tradicional de δόξα.
- source_word: ἀνυπόστατος
  choice: é impossível resistir
  rationale: O termo indica algo que não se pode sustentar ou enfrentar. “Resistir” distingue levemente esta oração da anterior sem eliminar o paralelismo dos quase sinônimos.
- source_word: ἡ ὀργὴ τῆς ἐπὶ ἁμαρτωλοὺς ἀπειλῆς σου
  choice: a ira da tua ameaça contra os pecadores
  rationale: A construção conserva a relação gramatical entre “ira” e “ameaça” e mantém ἐπί como direção hostil contra os pecadores, sem suavizar a linguagem judicial.
theological_decisions:
- issue: Linguagem antropopática da ira e da ameaça divinas
  choice: Manter “a ira da tua ameaça contra os pecadores”.
  alternative: “a ira ameaçada contra os pecadores” ou “a indignação da tua advertência aos pecadores”
  rationale: O grego atribui explicitamente a Deus tanto ὀργή quanto ἀπειλή. A tradução conserva essa linguagem pessoal e judicial, sem convertê-la em consequência impessoal nem desenvolver uma doutrina de juízo além do que o texto afirma.
- issue: Alcance de πάντα
  choice: Traduzir por “tudo”.
  alternative: “todos”
  rationale: A forma neutra favorece a totalidade das coisas, e não apenas seres humanos. A tradução mantém esse alcance amplo sem especificar “toda a criação”, expressão plausível, mas não explícita.
translation_notes:
  register: Português moderno, solene e acessível, com construção adequada à oração litúrgica. O paralelismo “estremece e treme” e a repetição de “é impossível” preservam a cadência e a intensidade do grego. Empregou-se “teu/tua”, corrente tanto no português brasileiro bíblico quanto no português internacional de registro religioso.
