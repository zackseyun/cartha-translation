  source_fidelity: 'A tradução acompanha com precisão a estrutura e o sentido do grego: o relativo retoma Deus (“perante quem”); πάντα preserva o escopo cósmico em “tudo”; e os pares φρίσσει καὶ τρέμει e ἄστεκτος/ἀνυπόστατος mantêm a intensificação e o paralelismo. “Por causa da presença do teu poder” interpreta legitimamente ἀπὸ προσώπου em sentido causal, sem apagar a imagem de presença, que é esclarecida pela nota.'
  naturalness: O português é moderno, solene e fluente. “Estremece e treme” conserva adequadamente a repetição enfática do original. As duas construções com “é impossível” são naturais no registro orante e evitam sentidos coloquiais de “insuportável”.
  terminology: “Majestade”, “glória”, “ira”, “ameaça” e “pecadores” são escolhas fiéis, claras e apropriadas ao registro religioso, sem atenuar ou ampliar a linguagem judicial do texto. “Resistir à ira” é uma formulação idiomática aceitável para ἀνυπόστατος neste paralelismo.
