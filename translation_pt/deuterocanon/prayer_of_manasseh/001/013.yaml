base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_manasseh/001/013.yaml
  text: 'I beg you[a], pleading with you: forgive me, Lord, forgive me, and do not destroy me along with my lawless deeds, nor, being angry forever, keep my evils against me, nor condemn me in the lowest parts of the earth; for you, Lord[b], are the God of those who repent[c],'
translation:
  language: pt
  text: 'Eu te peço, suplicando-te: perdoa-me, Senhor, perdoa-me. Não me destruas juntamente com minhas transgressões, nem, irado para sempre, guardes contra mim as minhas maldades[a], nem me condenes nas regiões mais profundas da terra[b]; pois tu, Senhor, és o Deus dos que se arrependem[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não leves em conta contra mim as minhas maldades”. A expressão grega descreve a retenção das más ações do suplicante de modo desfavorável a ele.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “nas regiões mais baixas da terra”. A expressão se refere às regiões inferiores ou profundezas da terra.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “dos que mudam de atitude”. O verbo grego pode destacar uma mudança de mente e de direção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτοῦμαι δεόμενός σου
  choice: Eu te peço, suplicando-te
  rationale: Mantém tanto o pedido expresso por αἰτοῦμαι quanto a súplica insistente do particípio δεόμενός, em português atual e apropriado à oração.
- source_word: ἄνες
  choice: perdoa-me
  rationale: 'No contexto penitencial, o sentido de soltar ou liberar é naturalmente expresso como remissão da culpa: “perdoa-me”.'
- source_word: συναπολέσῃς με ταῖς ἀνομίαις μου
  choice: me destruas juntamente com minhas transgressões
  rationale: “Juntamente com” preserva a força do prefixo συν-, enquanto “transgressões” comunica a violação da norma presente em ἀνομίαις sem reduzir o termo a um genérico “pecados”.
- source_word: μηνίσας
  choice: irado
  rationale: Expressa de modo conciso a ira indicada pelo particípio, sem acrescentar uma causa não declarada.
- source_word: τηρήσῃς τὰ κακά μοι
  choice: guardes os meus males contra mim
  rationale: Conserva a imagem de manter ou reter os males do suplicante de modo desfavorável a ele; a nota oferece uma formulação mais idiomática.
- source_word: ἐν τοῖς κατωτάτοις τῆς γῆς
  choice: nas regiões mais profundas da terra
  rationale: Transmite o superlativo espacial κατωτάτοις em português natural, preservando a referência às regiões inferiores.
- source_word: τῶν μετανοούντων
  choice: dos que se arrependem
  rationale: Mantém a força verbal do particípio e expressa claramente as pessoas caracterizadas pelo arrependimento.
- source_word: κύριε
  choice: Senhor
  rationale: É o título divino corrente e adequado ao vocativo em uma oração.
theological_decisions:
- issue: Sentido de ἀνομία na confissão penitencial
  choice: transgressões
  alternative: iniquidades; atos de rebeldia contra a lei
  rationale: “Transgressões” preserva a ideia de violação da norma e é mais transparente ao leitor moderno que “iniquidades”, sem expandir o texto como faria a alternativa explicativa.
- issue: Relação entre a ira divina e a retenção dos males
  choice: nem, irado para sempre, guardes os meus males contra mim
  alternative: nem fiques irado para sempre, levando em conta os meus males
  rationale: A redação mantém a ligação sintática do particípio μηνίσας com τηρήσῃς e não resolve além do texto se a duração recai principalmente sobre a ira ou sobre a retenção.
- issue: Deus como Deus dos que se arrependem
  choice: o Deus dos que se arrependem
  alternative: o Deus dos que voltam atrás
  rationale: “Arrependem” preserva a formulação teológica tradicional sem especificar indevidamente se μετάνοια consiste sobretudo em mudança interior ou retorno prático.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição “perdoa-me, Senhor, perdoa-me” foi preservada por sua força suplicante. A pontuação divide o apelo inicial e a sequência de pedidos sem eliminar o encadeamento retórico do grego.
