lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Dos filhos de
  rationale: Preserva a preposição ἐκ e a estrutura genealógica da lista em português natural.
- source_word: Ἠλά
  choice: Elá
  rationale: Transliteração portuguesa do nome grego, com acento para indicar a tonicidade.
- source_word: Ματαν
  choice: Matã
  rationale: Forma portuguesa natural do nome semítico representado pelo grego Ματαν.
- source_word: Ζαχαρίας
  choice: Zacarias
  rationale: Forma bíblica tradicional e amplamente reconhecida em português.
- source_word: Ἰεζρίκιλος
  choice: Jezriquilo
  rationale: Transliteração próxima do grego, evitando harmonização conjectural com outro testemunho.
- source_word: Ὠαβδίος
  choice: Obadias
  rationale: Forma portuguesa reconhecível que representa naturalmente o nome transmitido, sem seguir a sugestão menos provável de Joabdius.
- source_word: Ἱερεμὼθ
  choice: Jeremote
  rationale: Transliteração adaptada à fonologia e à ortografia portuguesas.
- source_word: Ἀηδείας
  choice: Aedeias
  rationale: Transliteração próxima da forma grega, pois a correspondência hebraica exata é incerta.
