base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/034.yaml
  text: 'And from the sons of Baanei: Jeremias[a], Momdios, Maeros, Jouna, Mamdai, and Pedias, and Anos, Carabasion, and Enaseibos, and Mamntanaimos, Eliaseis, Bannous, Edialeis, Someis, Selemias, Nathanias; and from the sons of Exora: Seseis, Ezreil, Azaelos, Samatos, Zambrei[b], Phosepos.'
translation:
  language: pt
  text: 'E dos filhos de Baanei: Jeremias[a], Momdeios, Maeros, Juná, Mamdai, Pedias, Anos, Carabasion, Enaseibos, Mamntanaimos, Eliaseis, Bannus, Edialeis, Someis, Selemias e Natanias; e dos filhos de Exora: Seseis, Ezreil, Azaelos, Samatos, Zambrei[b] e Fosepos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vários nomes deste versículo foram mantidos como transliterações próximas do texto grego, em vez de serem harmonizados com formas hebraicas mais conhecidas da tradição paralela, pois o grego de 1 Esdras é a fonte principal desta tradução.
    reason: lexical_alternative
  - marker: b
    text: O paralelo do Texto Massorético nesta parte do contexto de Esdras 10 é apenas aproximado e não conserva esta mesma sequência completa de nomes nas mesmas formas; por isso, a lista segue o texto grego.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν
  choice: E dos filhos de
  rationale: Mantém a estrutura genealógica e enumerativa do grego; neste contexto, «filhos» também pode abranger descendentes ou membros de um clã.
- source_word: Βαανεί
  choice: Baanei
  rationale: Transliteração próxima do nome preservado no texto grego, sem harmonizá-lo com uma possível forma hebraica paralela.
- source_word: Ἰερεμίας
  choice: Jeremias
  rationale: Emprega a forma portuguesa tradicional, que corresponde diretamente à forma grega e permanece imediatamente reconhecível.
- source_word: Μομδείοσ
  choice: Momdeios
  rationale: Conserva de modo legível a grafia incomum do testemunho grego, sem conjecturar uma identificação hebraica.
- source_word: Ἰουνά
  choice: Juná
  rationale: Representa a forma grega em ortografia natural para leitores de português; o acento explicita a tonicidade final.
- source_word: Πεδίας
  choice: Pedias
  rationale: Preserva a forma grega em vez de substituí-la pela forma hebraica mais conhecida, Pedaías.
- source_word: Καραβασιὼν
  choice: Carabasion
  rationale: Transliteração próxima do grego, com C inicial segundo uma convenção legível em português.
- source_word: Βαννοῦς
  choice: Bannus
  rationale: O ditongo grego ου é representado por «u», adequando a transliteração à leitura portuguesa.
- source_word: Ναθανίας
  choice: Natanias
  rationale: Adapta a transliteração à ortografia portuguesa, representando θ por «t», sem alterar a forma básica do nome.
- source_word: Φόσηπος
  choice: Fosepos
  rationale: Representa φ por «f» e mantém o restante da forma grega, sem harmonização conjectural.
