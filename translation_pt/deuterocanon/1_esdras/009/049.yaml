base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/049.yaml
  text: 'And Attarates said to Ezra the chief priest and reader[a], and to the Levites who were teaching the multitude[b], to all of them:'
translation:
  language: pt
  text: 'E Atarates[a] disse a Esdras, o sumo sacerdote e leitor[b], e aos levitas que ensinavam a multidão, a todos eles:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atarates provavelmente corresponde à figura chamada, no paralelo hebraico, de «Neemias, o tirsata», isto é, o governador.
    reason: alternative_reading
  - marker: b
    text: O grego diz «sumo sacerdote e leitor»; o paralelo hebraico traz «o sacerdote, o escriba», de modo que as tradições diferem ligeiramente na designação de Esdras.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ εἶπεν
  choice: E ... disse
  rationale: Preserva a coordenação narrativa simples do grego sem tornar a sequência temporal mais explícita do que o texto permite.
- source_word: Ἀτταρατὴ
  choice: Atarates
  rationale: Translitera a forma grega como nome próprio, em vez de substituí-la pela identificação apresentada no paralelo hebraico.
- source_word: Ἔσρᾳ
  choice: Esdras
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: τῷ ἀρχιερεῖ
  choice: o sumo sacerdote
  rationale: É a equivalência portuguesa corrente e precisa de ἀρχιερεύς, sem seguir a designação mais simples, 'o sacerdote', encontrada no paralelo hebraico.
- source_word: καὶ ἀναγνώστῃ
  choice: e leitor
  rationale: Representa diretamente ἀναγνώστης e a função de ler, mantendo em nota a diferença em relação ao paralelo hebraico, que chama Esdras de escriba.
- source_word: τοῖς Λευείταις
  choice: aos levitas
  rationale: Tradução direta da designação do grupo.
- source_word: τοῖς διδάσκουσι τὸ πλῆθος
  choice: que ensinavam a multidão
  rationale: O imperfeito perifrástico natural em português comunica a atividade em andamento expressa pelo particípio presente; 'multidão' conserva o caráter coletivo de πλῆθος.
- source_word: ἐπὶ πάντας
  choice: a todos eles
  rationale: A expressão grega é sintaticamente difícil neste recorte. A tradução conserva seu alcance inclusivo e a construção adotada pelo texto-base auditado, sem substituir o grego pela formulação mais explícita do paralelo hebraico.
theological_decisions:
- issue: Identificação de Ἀτταρατὴ em relação ao paralelo hebraico
  choice: Manter 'Atarates' no texto principal e informar em nota a provável correspondência com Neemias, o governador.
  alternative: Traduzir diretamente como 'Neemias, o governador' ou 'o tirsata'.
  rationale: Como o grego é a testemunha primária de 1 Esdras e apresenta uma forma distinta, substituí-la pela redação hebraica eliminaria uma diferença textual genuína.
- issue: Designação de Esdras
  choice: Traduzir os títulos gregos como 'sumo sacerdote e leitor'.
  alternative: Adotar 'sacerdote e escriba', conforme o paralelo hebraico.
  rationale: A redação principal deve refletir os títulos efetivamente presentes no grego, enquanto a divergência do hebraico permanece disponível em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A ordem foi mantida próxima ao grego, inclusive na expressão final um pouco incomum, para não resolver silenciosamente uma dificuldade textual.
