base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/013.yaml
  text: the elders and the judges of each place[b][a], until the anger of the Lord over this matter is turned away from us.
translation:
  language: pt
  text: os anciãos e os juízes de cada lugar[b], até que a ira do Senhor por causa deste assunto seja afastada de nós.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até que a ira do Senhor a respeito deste assunto seja afastada de nós”.'
    reason: lexical_alternative
  - marker: b
    text: No grego, este trecho é um fragmento de frase que depende do versículo anterior.
    reason: cultural_note
lexical_decisions:
- source_word: ἑκάστου τόπου
  choice: de cada lugar
  rationale: Conserva o sentido distributivo do genitivo sem especificar indevidamente cidade, distrito ou povoado.
- source_word: πρεσβυτέρους
  choice: os anciãos
  rationale: No contexto administrativo e judicial, designa autoridades locais reconhecidas, não apenas homens idosos.
- source_word: κριτάς
  choice: os juízes
  rationale: É a correspondência direta e natural no contexto jurídico.
- source_word: ἕως τοῦ λῦσαι
  choice: até que ... seja afastada
  rationale: A construção indica o limite esperado; com 'ira', 'ser afastada' expressa de modo idiomático a ideia de remover ou desviar.
- source_word: ὀργὴν Κυρίου
  choice: a ira do Senhor
  rationale: '''Ira'' preserva a seriedade da desaprovação e do juízo divinos; ''Senhor'' é a forma reverente e usual para κύριος.'
- source_word: ἀφʼ ἡμῶν
  choice: de nós
  rationale: Mantém a ideia de separação da ira em relação à comunidade.
- source_word: τοῦ πράγματος τούτου
  choice: por causa deste assunto
  rationale: O genitivo comprimido provavelmente indica a causa ou ocasião da ira; a nota registra a alternativa menos causal.
theological_decisions:
- issue: Tradução de κύριος em contexto grego deuterocanônico
  choice: Senhor
  alternative: SENHOR; Soberano
  rationale: Nada no versículo exige afastar-se da forma portuguesa reverente e convencional 'Senhor'.
- issue: Intensidade de ὀργή aplicada ao desagrado divino
  choice: ira
  alternative: indignação; cólera
  rationale: '''Ira'' é corrente na linguagem bíblica portuguesa e conserva a gravidade teológica sem acrescentar uma interpretação denominacional.'
- issue: Relação de τοῦ πράγματος τούτου com a ira
  choice: por causa deste assunto
  alternative: a respeito deste assunto
  rationale: O contexto favorece uma relação causal, mas a sintaxe grega é compacta; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se o caráter fragmentário do grego em vez de suprir uma ação não expressa neste versículo; a nota [b] esclarece sua dependência sintática do contexto anterior.
