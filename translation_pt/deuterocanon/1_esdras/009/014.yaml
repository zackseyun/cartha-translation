base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/014.yaml
  text: Jonathan son of Azael and Hezekiah son of Thocanus accepted this[c][b][a], and Mosollamus and Levi and Sabbataeus joined in deciding with them.
translation:
  language: pt
  text: Jônatas, filho de Azael, e Ezequias, filho de Tocano[a], aceitaram isso, de acordo com essas instruções[c]; e Mosolamo, Levi e Sabateu participaram da decisão com eles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os nomes gregos deste versículo diferem dos encontrados no paralelo aproximado de Esdras 10 no texto hebraico; compare, por exemplo, Mesulão com Mosolamo e Sabetai com Sabateu.
    reason: alternative_reading
  - marker: b
    text: O verbo grego traduzido por “participaram da decisão com eles” é raro e também pode significar que esses homens atuaram como avaliadores ou deram parecer favorável junto com eles.
    reason: lexical_alternative
  - marker: c
    text: Neste ponto, o texto grego de 1 Esdras não corresponde de perto ao paralelo do texto hebraico massorético; por isso, os nomes e a formulação seguem principalmente a testemunha grega.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπεδέξαντο κατὰ ταῦτα
  choice: aceitaram essa proposta
  rationale: O médio de ἐπιδέχομαι indica aceitar ou assumir algo, enquanto κατὰ ταῦτα remete ao acordo exposto anteriormente. “Aceitaram essa proposta” expressa naturalmente ambos os elementos no contexto administrativo.
- source_word: συνεβράβευσαν αὐτοῖς
  choice: participaram da decisão com eles
  rationale: O verbo raro sugere atuação conjunta em julgamento, arbitragem ou deliberação. A formulação conserva o caráter decisório sem atribuir aos homens um cargo técnico que o texto não explicita.
- source_word: Ἰωνάθας Ἀζαήλου
  choice: Jônatas, filho de Azael
  rationale: O genitivo grego funciona como patronímico; “filho de” torna essa relação clara em português.
- source_word: Ἐξειας Θοκάνου
  choice: Ezequias, filho de Tocano
  rationale: Ἐξειας corresponde ao nome bíblico conhecido Ezequias. Tocano translitera a forma grega do nome paterno, sem substituí-la por uma identificação hebraica incerta.
- source_word: Μοσόλλαμος
  choice: Mosolamo
  rationale: A forma segue a testemunha grega primária, adaptada à fonologia e ortografia portuguesas; a forma aproximada do paralelo hebraico fica registrada em nota.
- source_word: Λευεὶς
  choice: Levi
  rationale: A forma é singular e, nesta lista, funciona como nome pessoal, não como designação plural dos levitas.
- source_word: Σαββαταῖος
  choice: Sabateu
  rationale: Transliteração portuguesa baseada na forma grega, mantendo a leitura da testemunha primária; a forma do paralelo hebraico é mencionada em nota.
