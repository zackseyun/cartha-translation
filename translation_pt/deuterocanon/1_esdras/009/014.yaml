  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Os nomes foram adaptados a formas portuguesas naturais, mantendo como base a testemunha grega. As notas preservam a incerteza lexical e a divergência textual sem substituir a leitura principal pelo paralelo hebraico.
