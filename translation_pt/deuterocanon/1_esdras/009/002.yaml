base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/002.yaml
  text: And lodging there[a], he tasted no bread and drank no water[b], mourning over the great lawless deeds of the multitude.
translation:
  language: pt
  text: E, passando ali a noite[a], não provou pão nem bebeu água, lamentando as graves transgressões do povo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficando hospedado ali” ou “acampando ali”. O particípio grego indica que ele permaneceu naquele lugar durante a noite.
    reason: lexical_alternative
  - marker: b
    text: O paralelo hebraico em Esdras 10 especifica a ofensa como o casamento com mulheres estrangeiras; aqui, o grego a resume de modo mais geral como “transgressões”.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐλισθεὶς
  choice: passando ali a noite
  rationale: O particípio de αὐλίζομαι indica permanecer ou pernoitar em determinado lugar. A expressão é natural em português e não especifica indevidamente se ele estava alojado ou acampado.
- source_word: ἄρτον οὐκ ἐγεύσατο
  choice: não provou pão
  rationale: Mantém tanto o substantivo concreto ἄρτος, “pão”, como o sentido básico de γεύομαι, “provar”; no contexto, a expressão comunica abstinência de alimento.
- source_word: οὐδὲ ὕδωρ ἔπιεν
  choice: nem bebeu água
  rationale: Tradução direta da segunda parte da fórmula de jejum, em paralelo com a abstinência de pão.
- source_word: πενθῶν
  choice: lamentando
  rationale: πενθέω expressa pesar profundo ou luto. “Lamentando” preserva o tom solene e penitencial e se liga naturalmente à causa do pesar.
- source_word: τῶν ἀνομιῶν τῶν μεγάλων
  choice: as graves transgressões
  rationale: ἀνομία designa atos contrários à lei, e μεγάλος intensifica aqui sua seriedade. “Graves transgressões” é corrente e dignificado, evitando o pouco natural “grandes ilegalidades”.
- source_word: τοῦ πλήθους
  choice: do povo
  rationale: πλῆθος designa a coletividade ou massa de pessoas. Neste contexto comunitário, “povo” é mais natural do que “multidão” sem perder o referente coletivo.
theological_decisions:
- issue: Força moral e teológica de ἀνομία
  choice: graves transgressões
  alternative: grandes violações da Lei; iniquidades
  rationale: A escolha conserva a ideia de conduta contrária à lei ou à ordem da aliança sem reduzir o termo a uma noção genérica de erro nem importar categorias doutrinárias posteriores.
- issue: Grau de especificidade da ofensa
  choice: manter a formulação geral do grego
  alternative: explicitar o casamento com mulheres estrangeiras, conforme o paralelo hebraico de Esdras 10
  rationale: O texto grego, que é a fonte primária desta tradução, resume a culpa como “transgressões”; especificar a ofensa no corpo do versículo substituiria essa formulação pela do texto paralelo.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A sintaxe acompanha de perto a progressão do grego, mas evita construções artificiais. “Passando ali a noite” preserva a ação circunstancial do particípio; “graves transgressões do povo” comunica com naturalidade a intensidade e a dimensão coletiva da culpa.
