base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/017.yaml
  text: And the matter concerning the men who had taken foreign women was brought to an end by the new moon of the first month[a][b].
translation:
  language: pt
  text: E a questão referente aos homens que haviam tomado mulheres estrangeiras foi concluída até a lua nova do primeiro mês[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego é difícil neste ponto: o particípio pode ser traduzido mais literalmente por “os homens que haviam sido reunidos”. O paralelo hebraico apoia o sentido contextual “os homens que haviam tomado mulheres estrangeiras”, adotado no texto principal.'
    reason: alternative_reading
  - marker: b
    text: A “lua nova do primeiro mês” corresponde ao primeiro dia do primeiro mês no calendário lunar.
    reason: cultural_note
lexical_decisions:
- source_word: ἦχθη ἐπὶ πέρας
  choice: foi concluída
  rationale: O idiomatismo passivo indica que algo foi levado ao fim. “Foi concluída” preserva a voz passiva e expressa naturalmente a conclusão do processo.
- source_word: τὰ κατὰ τοὺς ἄνδρας
  choice: a questão referente aos homens
  rationale: A construção idiomática designa os assuntos ou casos relativos aos homens; o singular coletivo “a questão” é claro no contexto da investigação.
- source_word: τοὺς ἐπισυναχθέντας
  choice: que haviam tomado
  rationale: O grego transmitido normalmente significaria “que haviam sido reunidos”, mas essa leitura produz uma construção difícil com “mulheres estrangeiras”. O paralelo hebraico e o contexto sustentam o sentido de homens que haviam tomado tais mulheres; a dificuldade textual é preservada em nota.
- source_word: γυναῖκας ἀλλογενεῖς
  choice: mulheres estrangeiras
  rationale: ἀλλογενής se refere a quem pertence a outro povo. “Mulheres estrangeiras” é uma formulação direta, atual e coerente com o paralelo hebraico נָשִׁים נָכְרִיּוֹת.
- source_word: ἕως τῆς νουμηνίας τοῦ πρώτου μηνός
  choice: até a lua nova do primeiro mês
  rationale: νουμηνία designa a lua nova, que marcava o primeiro dia do mês. “Até” conserva de modo transparente o valor temporal de ἕως.
