base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/016.yaml
  text: And Ezra the priest selected for himself men who were heads of their fathers’ houses, all of them designated by name, and they convened on the first day of the tenth month to examine the matter.
translation:
  language: pt
  text: E Esdras, o sacerdote, escolheu para si homens que eram chefes de suas famílias paternas, todos designados pelo nome; e eles se reuniram no primeiro dia[a] do décimo mês para examinar a questão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “na lua nova do décimo mês”, isto é, no primeiro dia do mês.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελέξατο
  choice: escolheu para si
  rationale: Preserva de modo natural a nuance da voz média, indicando a escolha feita por Esdras para esse propósito.
- source_word: ἄνδρας ἡγουμένους
  choice: homens que eram chefes
  rationale: Mantém o masculino explícito de ἄνδρας e expressa a função de liderança de ἡγουμένους no contexto administrativo e familiar.
- source_word: τῶν πατριῶν αὐτῶν
  choice: de suas famílias paternas
  rationale: πατριά designa divisões familiares de linhagem paterna; a expressão é clara em português e conserva essa estrutura de parentesco.
- source_word: πάντας κατ’ ὄνομα
  choice: todos designados pelo nome
  rationale: Comunica que os homens escolhidos foram identificados ou registrados nominalmente.
- source_word: συνεκλείσθησαν
  choice: se reuniram
  rationale: No contexto de um procedimento deliberativo, indica que vieram a reunir-se; evita a literalidade imprópria de 'foram encerrados juntos'.
- source_word: τῇ νουμηνίᾳ
  choice: no primeiro dia
  rationale: A palavra denota o dia da lua nova, isto é, o início do mês; a forma idiomática fica no texto e a expressão literal é registrada em nota.
- source_word: ἐτάσαι
  choice: examinar
  rationale: 'Expressa a finalidade da reunião: realizar uma averiguação formal.'
- source_word: τὸ πρᾶγμα
  choice: a questão
  rationale: Mantém a referência ampla ao assunto sob exame sem especificá-lo além do grego.
theological_decisions:
- issue: Linguagem masculina e estrutura familiar administrativa
  choice: homens que eram chefes de suas famílias paternas
  alternative: chefes de suas famílias
  rationale: O grego emprega ἄνδρας, explicitamente masculino, e πατριαί, referente a grupos de parentesco paterno; a tradução preserva ambos os elementos sem neutralização.
- issue: Termo calendárico νουμηνία
  choice: no primeiro dia do décimo mês
  alternative: na lua nova do décimo mês
  rationale: O termo refere-se ao dia que inicia o mês. A formulação principal é imediatamente compreensível, enquanto a imagem calendárica literal permanece na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém a sequência administrativa do grego e evita linguagem excessivamente técnica.
