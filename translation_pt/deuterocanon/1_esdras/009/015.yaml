  text: And those from the captivity did all these things[a].
translation:
  language: pt
  text: E os do cativeiro fizeram tudo isso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os exilados que voltaram fizeram todas essas coisas”. O grego diz literalmente “os do cativeiro”, referindo-se à comunidade que regressou do exílio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: fizeram
  rationale: Com κατὰ πάντα ταῦτα, o verbo ποιέω indica realizar as ações anteriormente descritas; “fizeram” é natural e preserva a formulação simples do grego.
- source_word: κατὰ πάντα ταῦτα
  choice: tudo isso
  rationale: A expressão retoma coletivamente os procedimentos já narrados. “Tudo isso” comunica tanto a totalidade de πάντα quanto a referência retrospectiva de ταῦτα, sem a rigidez de “segundo todas estas coisas”.
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  choice: os que tinham voltado do cativeiro
  rationale: O grego diz literalmente “os do/provenientes do cativeiro”. No contexto, trata-se da comunidade pós-exílica regressada; a formulação escolhida torna essa referência clara em português sem recorrer ao termo mais técnico “exilados”.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. A ordem iniciada por “E” acompanha a conexão narrativa do grego; “tinham voltado” explicita de modo natural a procedência expressa por ἐκ no contexto pós-exílico.
