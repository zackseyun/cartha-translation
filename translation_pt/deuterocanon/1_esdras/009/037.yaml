revisions:
- from: E os sacerdotes, os levitas e os que eram de Israel passaram a morar em Jerusalém e no restante da terra, por ocasião da lua nova do sétimo mês[b][a]; e os filhos de Israel estavam em seus povoados.
  to: E os sacerdotes, os levitas e os de Israel habitaram em Jerusalém e no território[a], na lua nova do sétimo mês[b]; e os filhos de Israel estavam em seus povoados.
  rationale: A revisão remove a nuance incoativa indevida, melhora a naturalidade de οἱ ἐκ τοῦ Ἰσραήλ e traduz χώρα de maneira menos interpretativa. Mantém-se a ligação sintática da expressão temporal com a primeira oração, conforme sua posição no grego, bem como a distinção entre «os de Israel» e «os filhos de Israel». Os marcadores foram reposicionados junto aos seus respectivos referentes.
