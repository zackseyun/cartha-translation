base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/037.yaml
  text: And the priests and the Levites and those from Israel lived in Jerusalem and in the country at the new moon of the seventh month[b][a], and the sons of Israel were in their settlements.
translation:
  language: pt
  text: E os sacerdotes, os levitas e os de Israel habitaram em Jerusalém e no território[a], na lua nova do sétimo mês[b]; e os filhos de Israel estavam em seus povoados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «moraram».'
    reason: lexical_alternative
  - marker: b
    text: O grego diz «na lua nova do sétimo mês». O paralelo hebraico em Neemias difere substancialmente neste ponto; por isso, a tradução segue 1 Esdras conforme preservado em grego.
    reason: alternative_reading
lexical_decisions:
- source_word: κατῴκησαν
  choice: passaram a morar
  rationale: O aoristo de κατοικέω indica que passaram a residir nesses lugares; a formulação é natural em português e mantém o sentido de habitação sem exigir que se entenda um assentamento definitivo.
- source_word: οἱ ἐκ τοῦ Ἰσραήλ
  choice: os que eram de Israel
  rationale: Preserva a construção grega e sua distinção em relação à expressão posterior «filhos de Israel», sem restringi-la indevidamente.
- source_word: ἐν Ἰερουσαλὴμ καὶ ἐν τῇ χώρᾳ
  choice: em Jerusalém e no restante da terra
  rationale: χώρα designa aqui o território fora de Jerusalém. «No restante da terra» torna claro o contraste entre a cidade e o território circundante sem limitar o sentido a uma zona rural.
- source_word: τῇ νουμηνίᾳ τοῦ ἑβδόμου μηνός
  choice: por ocasião da lua nova do sétimo mês
  rationale: νουμηνία refere-se à lua nova ou ao dia que assinalava o início do mês. A tradução conserva a especificidade do grego e mantém sua ligação sintática com a primeira oração.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: os filhos de Israel
  rationale: Mantém a expressão familiar tradicional que designa o povo da aliança e preserva a diferença formal em relação a «os que eram de Israel».
- source_word: κατοικίαις
  choice: povoados
  rationale: κατοικία pode indicar lugares habitados. No plural e neste contexto geográfico, «povoados» comunica melhor a ideia coletiva do que «casas» ou «moradias».
theological_decisions:
- issue: Relação entre a redação grega e o paralelo aproximado do Texto Massorético em Neemias 8:1
  choice: Traduzir a sequência do grego tal como preservada, incluindo a lua nova do sétimo mês.
  alternative: Harmonizar o versículo com Neemias 8:1, onde o povo se reúne como um só homem diante da Porta das Águas.
  rationale: O texto grego de 1 Esdras é a fonte primária desta tradução, enquanto o paralelo hebraico difere substancialmente neste ponto. Harmonizá-los apagaria uma diferença textual genuína.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem dos marcadores [b][a] acompanha os pontos a que cada nota se refere: [b] após a expressão calendárica e [a] após a oração verbal como um todo.'
