base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/031.yaml
  text: 'And from the sons of Addin: Lathos and Moosseias[a], Lakkounos and Naidos, and Beskaspasmos and Sesthel and Balnous and Manasseh.'
translation:
  language: pt
  text: 'E dos filhos de Adim: Latos e Moosseias[a], Lacunos e Naidos, Bescaspasmos, Sestel, Balnus e Manassés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego apresenta aqui uma lista de nomes pessoais; vários deles são textualmente incertos ou diferem do paralelo hebraico aproximado. Por isso, a tradução segue de perto as formas gregas, sem harmonizá-las com a tradição massorética.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν Ἀδδείν
  choice: E, dos filhos de Adim
  rationale: A preposição ἐκ indica integrantes procedentes de um grupo familiar. A fórmula «dos filhos de» mantém de modo natural a estrutura genealógica da lista; «Adim» segue a forma tradicional e legível do nome em português sem alterar sua identificação.
- source_word: υἱῶν
  choice: filhos
  rationale: Em listas genealógicas, υἱοί pode abranger membros masculinos ou descendentes de uma família. «Filhos» preserva a formulação concreta e tradicional do grego, sem explicitar além do necessário.
- source_word: Λάθος καὶ Μοοσσείας
  choice: Latos e Moosseias
  rationale: Os nomes são transliterados, não traduzidos. «Latos» representa Λάθος segundo convenções portuguesas, e «Moosseias» conserva de perto a forma grega transmitida, inclusive a sequência vocálica incomum.
- source_word: Λακκοῦνος καὶ Νάιδος
  choice: Lacunos e Naidos
  rationale: Transliteração legível em português, com «c» para o som consonantal de κ e «u» para ου, sem harmonizar os nomes com o paralelo hebraico aproximado.
- source_word: Βεσκασπασμὸς καὶ Σεσθὴλ καὶ Βαλνοῦς
  choice: Bescaspasmos, Sestel, Balnus
  rationale: 'As formas seguem de perto as letras gregas, adaptadas à ortografia portuguesa: κ é representado por «c», θ por «t» e ου por «u». A pontuação portuguesa evita uma sucessão pesada de conjunções sem apagar nenhum integrante da lista.'
- source_word: Μανασσῆς
  choice: Manassés
  rationale: «Manassés» é a forma portuguesa consagrada e reconhecível do nome, fiel à tradição nominal grega e hebraica.
