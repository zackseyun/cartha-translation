base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/051.yaml
  text: Go your way[a], then[b], eat rich foods and send portions to those who have nothing.
translation:
  language: pt
  text: Portanto, vão, comam alimentos ricos[a] e enviem porções aos que nada têm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, «coisas gordurosas». A expressão se refere a alimentos fartos ou especiais próprios de uma celebração.
    reason: lexical_alternative
  - marker: b
    text: O paralelo hebraico de Neemias 8:10 diz, mais especificamente, «a quem não tem nada preparado».
    reason: alternative_reading
lexical_decisions:
- source_word: βαδίσαντες
  choice: vão
  rationale: O particípio aoristo, literalmente «tendo ido», assume neste contexto valor exortativo e é expresso naturalmente pelo imperativo «vão».
- source_word: οὖν
  choice: portanto
  rationale: Marca a continuação inferencial da exortação anterior; «portanto» preserva explicitamente essa relação.
- source_word: φάγετε
  choice: comam
  rationale: Imperativo plural direto, vertido sem expansão.
- source_word: λιπάσματα
  choice: alimentos ricos
  rationale: O substantivo designa comidas gordurosas, fartas ou especiais, apropriadas para uma celebração; «alimentos ricos» comunica o sentido sem o estranhamento de uma tradução estritamente literal.
- source_word: ἀποστείλατε
  choice: enviem
  rationale: Imperativo plural simples e direto.
- source_word: ἀποστολάς
  choice: porções
  rationale: No contexto festivo, refere-se a porções de comida destinadas a outras pessoas; o paralelo hebraico מָנוֹת confirma esse sentido.
- source_word: τοῖς μὴ ἔχουσιν
  choice: aos que nada têm
  rationale: Reproduz a formulação concisa do grego, literalmente «aos que não têm», sem incorporar ao texto principal a explicitação do paralelo hebraico.
theological_decisions:
- issue: Uso do paralelo massorético para esclarecer o sentido social da exortação grega
  choice: Entender que se devem compartilhar porções da comida festiva com pessoas que nada têm.
  alternative: Entender de maneira mais indeterminada que se devem enviar itens não especificados aos que carecem de algo.
  rationale: O grego menciona «porções» e «os que não têm»; o paralelo de Neemias 8:10 esclarece que se trata daqueles para quem nada foi preparado. A tradução mantém a concisão do testemunho grego e registra em nota a formulação hebraica mais específica.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural amplamente compreensíveis. A formulação principal segue o grego de Swete; o paralelo hebraico é usado como confirmação contextual e sua maior especificidade fica preservada em nota.
