  text: And among the priests there were found some who had taken foreign women[a].
translation:
  language: pt
  text: E entre os sacerdotes foram encontrados alguns que haviam tomado mulheres estrangeiras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: “os que foram reunidos, tendo mulheres estrangeiras”. A redação do texto transmitido é um tanto difícil; o paralelo hebraico apoia o sentido “os que haviam tomado mulheres estrangeiras”.'
    reason: textual_variant
lexical_decisions:
- source_word: εὑρέθησαν
  choice: foram encontrados
  rationale: Preserva a voz passiva do aoristo de εὑρίσκω e sugere a identificação formal dessas pessoas no contexto da lista.
- source_word: τῶν ἱερέων
  choice: entre os sacerdotes
  rationale: 'Expressa naturalmente em português o genitivo partitivo: os identificados pertenciam ao grupo dos sacerdotes.'
- source_word: οἱ ἐπισυναχθέντες
  choice: alguns
  rationale: O particípio transmitido significa literalmente «os que foram reunidos», mas é sintaticamente difícil neste contexto. A tradução identifica com cautela um subgrupo, sem impor ao texto uma reunião cujo papel não está claro.
- source_word: ἀλλογενεῖς γυναῖκας
  choice: mulheres estrangeiras
  rationale: ἀλλογενής designa alguém de outro povo ou origem; «estrangeiras» é claro, atual e não tem o sentido equívoco de «estranhas».
- source_word: ἔχοντες
  choice: que haviam tomado
  rationale: Embora o grego diga literalmente «tendo», o paralelo hebraico נָשְׂאוּ e o contexto matrimonial sustentam o sentido idiomático de tomar mulheres por esposas. A formulação conserva esse valor sem explicitar além da fonte «casado».
theological_decisions:
- issue: Uso do paralelo hebraico para esclarecer a expressão matrimonial em um texto grego difícil
  choice: Traduzir o grupo como sacerdotes que haviam tomado mulheres estrangeiras
  alternative: Traduzir literalmente «sacerdotes que tinham mulheres estrangeiras» ou explicitar «os sacerdotes reunidos»
  rationale: O grego permanece como texto principal, mas o paralelo hebraico confirma o contexto matrimonial. A opção comunica esse sentido sem introduzir uma avaliação doutrinária nem eliminar a dificuldade textual, que é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Haviam tomado» mantém o idioma matrimonial antigo de modo mais próximo das fontes; a nota preserva a dificuldade genuína do grego.
