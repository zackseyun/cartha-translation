base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/029.yaml
  text: 'And from the sons of Bebai: Joannes and Ananias and Zabdos and Emathis[a].'
translation:
  language: pt
  text: 'E dos filhos de Bebai: Joanês, Ananias, Zabdos e Emátis.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns desses nomes podem corresponder a formas hebraicas diferentes no paralelo aproximado do Texto Massorético; aqui, porém, 1 Esdras é traduzido do testemunho grego, que preserva as formas Joanês, Ananias, Zabdos e Emátis.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν Βηβαί
  choice: E dos filhos de Bebai
  rationale: Mantém a estrutura da lista grega. Neste contexto genealógico, «filhos» pode abranger descendentes ou membros da família, mas a formulação literal é clara e natural em português.
- source_word: Ἰωάννης
  choice: Joanês
  rationale: Translitera a forma grega, em vez de substituí-la pela forma hebraica ou pelo nome português João; a acentuação torna natural a leitura em português.
- source_word: Ἁνανίας
  choice: Ananias
  rationale: Forma tradicional e direta em português para o nome grego, sem recorrer à forma hebraica Hananias.
- source_word: Ζάβδος
  choice: Zabdos
  rationale: Transliteração conservadora da forma atestada no texto grego, sem harmonização com possíveis equivalentes hebraicos.
- source_word: Ἐμαθίς
  choice: Emátis
  rationale: Transliteração da forma grega com acento gráfico para indicar corretamente a tonicidade em português.
