base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/023.yaml
  text: 'And from the Levites: Jozabad[a], Seneis, Konos (that is, Kalitais), and Pathaios[c][b], and Judas and Jonas.'
translation:
  language: pt
  text: 'E dentre os levitas: Jozabado, Seneis, Conos — isto é, Calitais[a] — e Pataios[b]; e Judas e Jonas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega provavelmente identifica Calitais como outro nome de Conos; também pode ser traduzida mais literalmente como “este é Calitais”.
    reason: alternative_reading
  - marker: b
    text: A grafia de alguns desses nomes raros é incerta, pois a transcrição da fonte apresenta uma pequena divergência. O texto principal segue o testemunho grego de 1 Esdras.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν Λευειτῶν
  choice: dentre os levitas
  rationale: Preserva o valor partitivo de ἐκ e introduz naturalmente esse grupo dentro da lista maior.
- source_word: Ἰωζάβαδος
  choice: Jozabado
  rationale: Transliteração aportuguesada da forma grega, mantendo o nome próprio sem substituí-lo por uma forma conjectural do paralelo semítico.
- source_word: Σενεεὶς
  choice: Seneis
  rationale: Transliteração direta e legível do nome grego raro.
- source_word: Κῶνος
  choice: Conos
  rationale: Forma aportuguesada da transliteração grega; em português, c diante de o representa naturalmente o som de kappa.
- source_word: οὗτος Καλιταίς
  choice: isto é, Calitais
  rationale: Entende οὗτος em função apositiva, como identificação ou nome alternativo de Conos, sem definir além do que o grego permite.
- source_word: Παθαῖος
  choice: Pataios
  rationale: Transliteração da forma grega, evitando substituir o nome por um possível equivalente hebraico.
- source_word: Ἰούδας
  choice: Judas
  rationale: Forma portuguesa tradicional e direta do nome pessoal grego.
- source_word: Ἰωνάς
  choice: Jonas
  rationale: Forma portuguesa correspondente ao grego Ἰωνάς; segue o testemunho grego primário.
