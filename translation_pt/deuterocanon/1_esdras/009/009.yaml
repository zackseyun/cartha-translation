base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/009.yaml
  text: and do his will[a], and separate yourselves from the nations of the land and from the foreigners.
translation:
  language: pt
  text: e façam a vontade dele[a], e separem-se das nações da terra e dos estrangeiros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo hebraico em Esdras 10 é mais específico e fala de mulheres ou esposas estrangeiras; aqui, 1 Esdras emprega a expressão mais ampla “os estrangeiros”.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσατε
  choice: façam
  rationale: O imperativo aoristo de ποιέω exprime uma ordem direta; “façam” é natural em português e combina idiomaticamente com “a vontade dele”.
- source_word: τὸ θέλημα αὐτοῦ
  choice: a vontade dele
  rationale: Preserva o sentido usual de θέλημα como aquilo que alguém quer, aqui em referência a Deus, sem explicitação adicional.
- source_word: χωρίσθητε
  choice: separem-se
  rationale: Representa naturalmente a forma médio-passiva como ordem reflexiva e comunica afastamento deliberado.
- source_word: ἀπὸ τῶν ἐθνῶν τῆς γῆς
  choice: das nações desta terra
  rationale: ἔθνη mantém o sentido amplo de grupos não israelitas, sem importar o uso posterior de “gentios”; γῆ designa a terra ou território local, e “desta terra” torna essa relação natural em português.
- source_word: ἀπὸ τῶν ἀλλογενῶν
  choice: dos estrangeiros
  rationale: ἀλλογενεῖς designa pessoas de origem ou povo estrangeiro. O plural grego é amplo e não especifica mulheres, por isso a tradução evita estreitá-lo.
theological_decisions:
- issue: Relação entre a formulação grega ampla e o paralelo hebraico de Esdras 10, voltado para mulheres ou esposas estrangeiras
  choice: Manter no texto principal a referência ampla às nações da terra e aos estrangeiros.
  alternative: “e separem-se dos povos desta terra e das mulheres estrangeiras”
  rationale: O grego de 1 Esdras é a testemunha primária e não especifica mulheres. A tradução preserva essa amplitude, enquanto a nota registra a formulação mais específica do paralelo hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos no plural. “Desta terra” evita a possível leitura global de “da terra”, e “estrangeiros” preserva a amplitude do grego.
