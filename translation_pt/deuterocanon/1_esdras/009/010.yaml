base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/010.yaml
  text: And the whole assembly cried out and said with a loud voice[a], “So, as you have said[b], we will do.”
translation:
  language: pt
  text: 'E toda a assembleia gritou e disse em alta voz: “Assim como você disse, faremos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφώνησαν
  choice: gritou
  rationale: O verbo indica que o grupo ergueu a voz publicamente; no singular, concorda de modo natural com o coletivo “toda a assembleia”.
- source_word: πᾶν τὸ πλῆθος
  choice: toda a assembleia
  rationale: Embora πλῆθος possa significar “multidão”, o contexto apresenta um grupo reunido para uma resposta comunitária formal; “assembleia” comunica isso sem excessiva interpretação.
- source_word: μεγάλῃ τῇ φωνῇ
  choice: em alta voz
  rationale: Expressão idiomática portuguesa que preserva a intensidade e o caráter público da fala.
- source_word: Οὕτως ὡς εἴρηκας
  choice: Assim como você disse
  rationale: Preserva diretamente a construção grega de assentimento. O perfeito εἴρηκας aponta para o que foi dito e permanece relevante, mas o pretérito perfeito simples é a forma natural em português.
- source_word: ποιήσομεν
  choice: faremos
  rationale: Futuro direto que expressa resolução coletiva sem acrescentar conteúdo.
theological_decisions:
- issue: Caracterização do grupo reunido em sua resposta pública
  choice: toda a assembleia
  alternative: toda a multidão
  rationale: “Assembleia” reflete melhor a dimensão formal e comunitária da cena, embora o substantivo grego também permita “multidão”; não há aqui uma distinção doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega “você” para o singular de segunda pessoa por ampla naturalidade no português brasileiro; a frase permanece concisa e próxima da sintaxe grega.
