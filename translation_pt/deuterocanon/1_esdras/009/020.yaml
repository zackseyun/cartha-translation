  source_fidelity: A primeira oração traduz adequadamente o idiomatismo grego ἐπέβαλον τὰς χεῖρας como compromisso assumido, e «mandar embora suas esposas» preserva o sentido conjugal de ἐκβαλεῖν. «Carneiros» e «ignorância» correspondem precisamente a κριούς e ἀγνοία. Contudo, o infinitivo inserido «oferecer» fica sintaticamente subordinado a «se comprometeram», sugerindo que o compromisso incluía tanto despedir as esposas quanto oferecer os carneiros. A segunda expressão grega é elíptica e é melhor resolvida em português como uma nova ação, com «ofereceram».
  naturalness: A redação é clara e de registro apropriado. A alteração para «ofereceram» torna explícita, de maneira natural, a elipse sacrificial sem criar uma coordenação enganosa de dois infinitivos dependentes de «se comprometeram».
  terminology: «Expiação» é uma equivalência adequada e não sectária para ἐξιλασμός; «carneiros» preserva a especificidade do animal. «Ignorância» mantém a formulação do grego, e a nota registra de modo equilibrado sua possível nuance cultual de erro ou pecado involuntário.
