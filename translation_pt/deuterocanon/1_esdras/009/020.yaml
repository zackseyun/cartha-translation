base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/020.yaml
  text: and they pledged themselves to send away their wives[a], and for atonement[b], rams for their ignorance.
translation:
  language: pt
  text: e eles se comprometeram a mandar embora suas esposas[a] e, para expiação, ofereceram carneiros por sua ignorância[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, «puseram as mãos para mandar embora suas esposas» — expressão idiomática que indica que assumiram o compromisso de fazer isso.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto sacrificial, «ignorância» também pode significar «erro» ou «pecado involuntário».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας
  choice: se comprometeram
  rationale: A expressão é literalmente «puseram as mãos», mas, seguida do infinitivo ἐκβαλεῖν, indica assumir um compromisso ou incumbência; a tradução literal poderia sugerir contato físico indevido.
- source_word: ἐκβαλεῖν
  choice: mandar embora
  rationale: Embora o verbo possa significar «expulsar», no contexto conjugal designa o afastamento das esposas sem intensificar desnecessariamente a expressão.
- source_word: τὰς γυναῖκας αὐτῶν
  choice: suas esposas
  rationale: O contexto mostra que γυναῖκες se refere às mulheres como cônjuges, e não a mulheres em geral.
- source_word: εἰς ἐξιλασμόν
  choice: para expiação
  rationale: Conserva o sentido sacrificial de remoção da culpa, com formulação corrente e teologicamente não sectária.
- source_word: κριούς
  choice: carneiros
  rationale: O substantivo identifica especificamente carneiros como animais sacrificiais e está no plural.
- source_word: ὑπὲρ τῆς ἀγνοίας αὐτῶν
  choice: por sua ignorância
  rationale: Mantém o sentido lexical direto de ἀγνοία, enquanto uma nota registra que, no contexto sacrificial, pode indicar erro ou pecado involuntário.
theological_decisions:
- issue: Sentido cultual de ἀγνοία
  choice: ignorância, deixando implícita no texto a nuance sacrificial
  alternative: erro; pecado involuntário
  rationale: O contexto aponta para culpa decorrente de uma falta cometida por ignorância, mas o grego emprega ἀγνοία; conservar «ignorância» evita resolver além do texto a extensão exata do termo.
- issue: Força idiomática de ἐπέβαλον τὰς χεῖρας
  choice: compromisso assumido, não imposição física das mãos
  alternative: puseram as mãos; tomaram a iniciativa
  rationale: Com o infinitivo que se segue, a expressão comunica que eles se obrigaram a executar a ação; uma versão estritamente literal seria obscura ou enganosa.
- issue: Elipse na expressão sacrificial
  choice: inserir «oferecer» para explicitar a relação sintática em português
  alternative: e, para expiação, carneiros por sua ignorância
  rationale: O grego apresenta uma frase elíptica, na qual a oferta dos carneiros está subentendida. «Oferecer» torna a frase natural em português sem alterar o conteúdo sacrificial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Mandar embora» evita tanto o arcaísmo de «repudiar» quanto a intensidade de «expulsar». A inserção de «oferecer» resolve naturalmente a elipse grega, e as notas preservam as alternativas lexicais relevantes.
