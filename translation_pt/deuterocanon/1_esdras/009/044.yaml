base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/044.yaml
  text: 'And from the left: Phaladaios[a], Meisael, Melcheias, Lothasoubos, Nabareias[b], Zechariah.'
translation:
  language: pt
  text: 'E, dos da esquerda[a]: Faladeu, Misael, Melquias, Lotásubo, Nabareias[b] e Zacarias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «do lado esquerdo». A expressão grega indica a posição ocupada no grupo ou na assembleia.'
    reason: lexical_alternative
  - marker: b
    text: Vários nomes desta lista seguem as formas gregas preservadas em 1 Esdras e podem corresponder a formas hebraicas mais conhecidas; o texto principal, porém, acompanha o testemunho grego.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξ εὐωνύμων
  choice: do lado esquerdo
  rationale: A expressão indica posição espacial dentro do grupo reunido. A formulação é natural em português e preserva o sentido do grego sem especificar além do texto.
- source_word: Φαλαδαῖος
  choice: Faladeu
  rationale: Transliteração aportuguesada da forma grega do nome, com a terminação -αῖος representada de modo legível em português.
- source_word: Μεισαήλ
  choice: Misael
  rationale: Forma tradicional e clara em português, próxima da forma grega e sem necessidade de harmonização com outro testemunho.
- source_word: Μελχείας
  choice: Melquias
  rationale: Forma aportuguesada que reproduz de maneira natural o nome grego, usando «qu» para conservar o som consonantal diante de «i».
- source_word: Λωθάσουβος
  choice: Lotásubo
  rationale: Transliteração direta e aportuguesada da forma peculiar preservada por 1 Esdras, sem substituí-la por uma identificação hebraica incerta.
- source_word: Ναβαρείας
  choice: Nabareias
  rationale: Mantém reconhecível a forma grega do nome; não se harmoniza com um possível nome diferente em tradições paralelas.
- source_word: Ζαχαρίας
  choice: Zacarias
  rationale: Emprega a forma bíblica tradicional e amplamente reconhecida em português para o nome grego.
