base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/046.yaml
  text: And when the law was read[a], they all stood upright; and Azarias blessed the Most High God, the Lord of hosts, the Almighty[c][b],
translation:
  language: pt
  text: Quando a Lei foi aberta[a], todos se puseram de pé; e Azarias[b] bendisse o Deus Altíssimo, o Deus dos Exércitos[c], o Todo-Poderoso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quando a Lei foi desenrolada” ou “quando a Lei foi lida”. O verbo grego significa literalmente “soltar” e, neste contexto, refere-se provavelmente à abertura de um rolo para a leitura pública.
    reason: lexical_alternative
  - marker: b
    text: 'Grego: Azarias; o paralelo hebraico traz Azariah (Azariá).'
    reason: alternative_reading
  - marker: c
    text: “Exércitos” traduz o grego sabaōth, título divino tradicional que também pode ser transliterado como “Sabaoth”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ λῦσαι τὸν νόμον
  choice: Quando a Lei foi aberta
  rationale: A construção com infinitivo tem valor temporal. λύω significa literalmente “soltar” e, no contexto de um rolo usado publicamente, pode indicar abri-lo ou desenrolá-lo. A tradução conserva essa imagem sem interpretar o verbo diretamente como “ler”.
- source_word: τὸν νόμον
  choice: a Lei
  rationale: νόμος refere-se aqui à Torá apresentada ao povo. “A Lei” é natural no contexto bíblico e não acrescenta “livro” ou “rolo” ao texto principal.
- source_word: πάντες ὀρθοὶ ἔστησαν
  choice: todos ficaram de pé, eretos
  rationale: Além de indicar que todos estavam de pé, ὀρθοί ressalta a postura ereta; a formulação portuguesa preserva ambas as ideias.
- source_word: εὐλόγησεν
  choice: bendisse
  rationale: Quando Deus é o objeto, εὐλογέω pode significar bendizer ou louvar. “Bendisse” mantém mais de perto o verbo grego e é uma expressão bíblica compreensível em português atual.
- source_word: Ἀζαρίας
  choice: Azarias
  rationale: O texto grego primário traz Ἀζαρίας. A forma portuguesa “Azarias” representa diretamente o nome grego, enquanto a forma do paralelo hebraico é registrada em nota.
- source_word: τῷ ὑψίστῳ θεῷ
  choice: o Deus Altíssimo
  rationale: A expressão é um título divino tradicional e permanece clara e natural em português.
- source_word: σαβαὼθ
  choice: o Deus dos Exércitos
  rationale: σαβαώθ é tratado semanticamente como título divino. A aposição “o Deus dos Exércitos” torna a sequência inteligível sem deixar o termo apenas transliterado.
- source_word: Παντοκράτορι
  choice: o Todo-Poderoso
  rationale: “Todo-Poderoso” é a tradução portuguesa bíblica convencional e acessível de παντοκράτωρ.
theological_decisions:
- issue: A sequência de títulos divinos τῷ ὑψίστῳ θεῷ σαβαὼθ Παντοκράτορι
  choice: o Deus Altíssimo, o Deus dos Exércitos, o Todo-Poderoso
  alternative: o Deus Altíssimo, Sabaoth, o Todo-Poderoso
  rationale: O grego acumula títulos em aposição. A tradução mantém essa acumulação, verte σαβαώθ pelo sentido e evita introduzir “Senhor”, pois κύριος não aparece explicitamente neste texto grego.
- issue: Sentido de εὐλόγησεν dirigido a Deus
  choice: bendisse
  alternative: louvou
  rationale: As duas leituras são possíveis no uso bíblico; “bendisse” preserva a forma lexical e a tensão entre pronunciar bênção e oferecer louvor, sem restringir o verbo a apenas uma dessas nuances.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a imagem concreta da abertura do rolo, a postura ereta do povo e a sequência solene de títulos divinos, sem acrescentar “Senhor”, ausente do grego.
