  yaml_path: translation/deuterocanon/1_esdras/009/038.yaml
  text: And all the multitude gathered together with one accord in the open square of the eastern gate of the temple,[a]
translation:
  language: pt
  text: E toda a multidão se reuniu de comum acordo na praça aberta do portão oriental do templo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no amplo espaço do portão oriental do templo”. A expressão grega ἐπὶ τὸ εὐρύχωρον pode ser traduzida mais literalmente por “para o lugar amplo” ou “no espaço aberto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθη
  choice: se reuniu
  rationale: O aoristo passivo de συνάγω descreve a reunião da multidão; em português, a forma pronominal é natural e mantém o sentido coletivo.
- source_word: πᾶν τὸ πλῆθος
  choice: toda a multidão
  rationale: Mantém tanto a totalidade expressa por πᾶν quanto o caráter numeroso e público de πλῆθος.
- source_word: ὁμοθυμαδόν
  choice: de comum acordo
  rationale: Expressa ação unida e convergência de propósito, e não apenas proximidade física.
- source_word: ἐπὶ τὸ εὐρύχωρον
  choice: na praça aberta
  rationale: Representa idiomaticamente um espaço amplo e aberto; a alternativa mais literal é preservada em nota.
- source_word: τοῦ πρὸς ἀνατολὰς
  choice: oriental
  rationale: A expressão significa literalmente 'voltado para o leste'; 'oriental' funciona naturalmente como identificação espacial em português.
- source_word: ἱεροῦ πυλῶνος
  choice: pórtico ... do templo
  rationale: πυλών pode designar um portão, portal ou estrutura de entrada. 'Pórtico' preserva aqui a ideia de uma entrada arquitetônica do recinto sagrado, sem reduzir necessariamente o termo à folha de um portão.
