base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/005.yaml
  text: And those from the tribe of Judah and Benjamin were gathered in Jerusalem within three days; it was the ninth month[a], on the twentieth day of the month.
translation:
  language: pt
  text: E os da tribo de Judá e Benjamim[a] reuniram-se em Jerusalém no prazo de três dias; era o nono mês, no vigésimo dia do mês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega o singular “tribo” com “Judá e Benjamim”; o sentido é o povo pertencente a Judá e Benjamim.
    reason: textual_clarification
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: reuniram-se
  rationale: Expressa de modo natural em português o ajuntamento indicado pelo aoristo passivo, sem especificar uma agência que o grego não declara.
- source_word: οἱ ἐκ τῆς φυλῆς Ἰούδα καὶ Βενιαμεὶν
  choice: os da tribo de Judá e Benjamim
  rationale: Preserva o singular φυλῆς e não acrescenta uma indicação masculina ausente da expressão grega; a nota esclarece a construção incomum com os dois nomes.
- source_word: ἐν τρισὶν ἡμέραις
  choice: no prazo de três dias
  rationale: Neste contexto de convocação e comparecimento, comunica com clareza que a reunião ocorreu dentro do período estabelecido, não necessariamente apenas no terceiro dia.
- source_word: εἰς Ἰερουσαλήμ
  choice: em Jerusalém
  rationale: Embora εἰς tenha força direcional, com o verbo reunir-se o português natural apresenta Jerusalém como o lugar de destino e reunião.
- source_word: οὗτος ὁ μὴν ἔνατος
  choice: era o nono mês
  rationale: Verte de maneira idiomática a identificação temporal do acontecimento.
- source_word: τῇ εἰκάδι τοῦ μηνός
  choice: no vigésimo dia do mês
  rationale: εἰκάς designa o vigésimo dia; a formulação plena é clara para leitores atuais.
