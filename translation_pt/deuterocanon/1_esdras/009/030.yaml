  text: 'And from the sons of Mani: Olamus[a], Mamuchus, Jedaeus, Jasubus, Asael[b], and Jeremoth.'
translation:
  language: pt
  text: 'E dos filhos de Mani: Olamo, Mamuco, Jedeu, Jasubo, Asael e Jeremote.[a]'
  philosophy: optimal-equivalence
  footnotes:
