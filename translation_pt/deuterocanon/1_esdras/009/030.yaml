lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Preserva o conectivo aditivo que introduz mais um grupo da lista.
- source_word: ἐκ τῶν υἱῶν
  choice: dos filhos de
  rationale: Expressa naturalmente em português a pertença ao grupo familiar indicada pela construção grega.
- source_word: Μανί
  choice: Mani
  rationale: Translitera diretamente o nome do texto grego primário, sem harmonizá-lo com Bani, provável correspondente na lista hebraica.
- source_word: Ὤλαμος
  choice: Olamo
  rationale: Adaptação portuguesa da forma grega, com retirada da terminação nominativa -ς.
- source_word: Μάμουχος
  choice: Mamuco
  rationale: Adaptação fonológica portuguesa da forma grega, sem substituí-la pelo provável equivalente hebraico Maluque.
- source_word: Ἰεδαῖος
  choice: Jedeu
  rationale: Forma portuguesa legível baseada no nome grego, sem harmonização conjectural com Adaías.
- source_word: Ἰάσουβος
  choice: Jasubo
  rationale: Transliteração adaptada da forma grega completa, em vez da forma hebraizada Jasube.
- source_word: Ἀσάηλος
  choice: Asael
  rationale: Forma já natural e reconhecível em português, baseada diretamente no grego.
- source_word: Ἰερεμώθ
  choice: Jeremote
  rationale: Transliteração portuguesa convencional da forma grega indeclinável.
