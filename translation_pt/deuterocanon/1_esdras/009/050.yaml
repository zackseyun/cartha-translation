base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/050.yaml
  text: This day is holy to the Lord[a], and all were weeping when they heard the law.
translation:
  language: pt
  text: Este dia é santo para o Senhor[a], e todos choravam ao ouvir a lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo hebraico em Neemias 8 traz «nosso Senhor» e prossegue com uma exortação a comer, beber, repartir porções e não se entristecer; aqui, 1 Esdras preserva uma formulação grega mais breve.
    reason: Referência cruzada que registra a diferença entre o texto grego primário e o paralelo hebraico sem harmonizá-los.
lexical_decisions:
- source_word: Ἡ ἡμέρα αὕτη
  choice: Este dia
  rationale: Preserva de modo direto e natural a força demonstrativa da expressão grega.
- source_word: ἁγία
  choice: santo
  rationale: É a correspondência religiosa tradicional e clara para ἁγία, indicando consagração sem paráfrase explicativa.
- source_word: τῷ κυρίῳ
  choice: para o Senhor
  rationale: O dativo pode indicar relação ou consagração; «para o Senhor» é natural em português e não acrescenta o possessivo «nosso», ausente no grego.
- source_word: πάντες
  choice: todos
  rationale: Mantém a concisão coletiva do grego sem acrescentar «o povo».
- source_word: ἔκλαιον
  choice: choravam
  rationale: O pretérito imperfeito reproduz o aspecto contínuo do imperfeito grego.
- source_word: ἐν τῷ ἀκοῦσαι
  choice: ao ouvir
  rationale: Expressa de forma idiomática a relação temporal do infinitivo articular grego, sem determinar além do necessário se o choro começou ou apenas ocorria nesse momento.
- source_word: τὸν νόμον
  choice: a lei
  rationale: Tradução direta de νόμος no contexto da leitura pública da Lei, mantendo minúscula para não impor uma convenção editorial interpretativa.
theological_decisions:
- issue: Importar ou não elementos do paralelo hebraico, especialmente «nosso Senhor» e a exortação a comer, beber, repartir porções e não se entristecer
  choice: Manter somente o conteúdo do texto grego mais breve.
  alternative: Harmonizar com Neemias 8, acrescentando «nosso» e/ou a exortação mais extensa.
  rationale: O grego de 1 Esdras é a fonte primária e não contém esses elementos. O paralelo hebraico esclarece o contexto, mas não deve substituir nem ampliar a forma textual aqui preservada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção é concisa como o grego; «choravam» conserva o aspecto contínuo, e «ao ouvir» oferece fluidez sem eliminar a relação temporal.
