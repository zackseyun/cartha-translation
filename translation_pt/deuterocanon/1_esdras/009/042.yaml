    reason: alternative_reading
  revision_rationale: Apenas se ajustou a ligação narrativa e a expressão verbal para refletir mais diretamente καί e ἔστη, sem alterar o sentido. A nota foi mantida, pois descreve com precisão a diferença relevante entre o grego de 1 Esdras e o paralelo hebraico.
