base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/042.yaml
  text: And Ezra the priest and reader of the law stood on the wooden platform that had been constructed;[a]
translation:
  language: pt
  text: E Esdras, o sacerdote e leitor da Lei, ficou de pé sobre a plataforma de madeira que havia sido construída.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo hebraico em Neemias 8:4 diz «Esdras, o escriba» e afirma que a estrutura de madeira foi feita «para esse fim» ou «para a ocasião». O grego de 1 Esdras, por sua vez, diz «o sacerdote e leitor da Lei» e apenas informa que a plataforma havia sido construída.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστη
  choice: pôs-se em pé
  rationale: Expressa naturalmente o aoristo narrativo de ἵστημι e pode indicar que Esdras tomou seu lugar diante do povo.
- source_word: Ἔσρας
  choice: Esdras
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: ὁ ἱερεύς
  choice: o sacerdote
  rationale: Conserva a identificação explícita do texto grego, sem harmonizá-la com o paralelo hebraico, que traz «escriba».
- source_word: ἀναγνώστης τοῦ νόμου
  choice: leitor da Lei
  rationale: ἀναγνώστης designa um leitor, inclusive leitor público; a tradução preserva o testemunho grego e evita substituí-lo pelo «escriba» do paralelo hebraico.
- source_word: ἐπὶ τοῦ ξυλίνου βήματος
  choice: sobre a plataforma de madeira
  rationale: βῆμα pode indicar uma estrutura elevada ou plataforma; esta formulação é clara no contexto de uma leitura pública.
- source_word: τοῦ κατασκευασθέντος
  choice: que havia sido construída
  rationale: O particípio aoristo passivo indica que a plataforma já fora preparada ou construída; o mais-que-perfeito composto explicita essa anterioridade com naturalidade.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Lei» recebe inicial maiúscula por designar aqui a Lei de Israel como corpo textual reconhecido; «plataforma de madeira» comunica de modo corrente a estrutura elevada do contexto.
