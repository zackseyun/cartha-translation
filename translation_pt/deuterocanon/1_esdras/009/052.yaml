base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/052.yaml
  text: For the day is holy to the Lord[a], and do not be grieved; for the Lord will glorify you.
translation:
  language: pt
  text: Pois o dia é santo para o Senhor[a]. Não fiquem tristes, pois o Senhor os glorificará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo hebraico em Neemias 8:10 apresenta aqui uma leitura diferente, aproximadamente: “pois a alegria do SENHOR é a força de vocês”. O grego de 1 Esdras, porém, diz: “pois o Senhor os glorificará”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγία
  choice: santo
  rationale: Expressa consagração ou separação para Deus; “santo” é a forma bíblica corrente e corresponde ao paralelo hebraico קָדֹשׁ.
- source_word: ἡ ἡμέρα
  choice: o dia
  rationale: Tradução direta e natural da expressão nominal grega.
- source_word: τῷ κυρίῳ
  choice: para o Senhor
  rationale: O dativo indica relação ou dedicação. “Para o Senhor” comunica naturalmente que o dia lhe é consagrado, sem eliminar a nuance relacional do grego.
- source_word: μὴ λυπεῖσθε
  choice: não fiquem tristes
  rationale: O verbo indica experimentar tristeza, pesar ou aflição. A formulação é atual, clara e preserva o peso emocional no contexto.
- source_word: δοξάσει
  choice: glorificará
  rationale: Reproduz o campo semântico explícito de glória e honra do verbo grego, sem harmonizá-lo com a leitura diferente do paralelo hebraico.
- source_word: ὑμᾶς
  choice: os
  rationale: Pronome objeto da segunda pessoa do plural. “Os glorificará” é claro e amplamente compreensível em português internacional, embora no uso brasileiro cotidiano também se diga “glorificará vocês”.
theological_decisions:
- issue: Tradução de κύριος no contexto grego deuterocanônico
  choice: Senhor
  alternative: Soberano; Mestre
  rationale: “Senhor” é a equivalência bíblica consagrada e o contexto não favorece outra opção.
- issue: Possível harmonização da oração final com o paralelo de Neemias 8:10 no Texto Massorético
  choice: 'Traduzir o grego como está: “o Senhor os glorificará”'
  alternative: “a alegria do SENHOR é a força de vocês”
  rationale: O texto grego de 1 Esdras é a fonte primária e traz δοξάσει ὑμᾶς. A divergência do paralelo hebraico deve ser registrada em nota, não inserida no texto principal.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A divisão em duas frases evita um período excessivamente encadeado. “Não fiquem tristes” é mais natural hoje do que “não vos entristeçais”; “os glorificará” mantém concisão e marca o plural.
