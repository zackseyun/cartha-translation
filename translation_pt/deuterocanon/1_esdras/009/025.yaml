  text: 'From the gatekeepers: Shallumus and Tobanes[a].'
translation:
  language: pt
  text: 'Dos porteiros: Sálumos e Tobanes[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego: «Dos porteiros: Sálumos e Tobanes». A tradição hebraica paralela desta seção não corresponde de perto ao texto neste ponto e não preserva esses nomes na mesma forma.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ
  choice: Dos
  rationale: No contexto de uma lista, introduz o grupo do qual procedem os homens nomeados; em português, «dos» é a forma mais natural e concisa.
- source_word: τῶν θυρωρῶν
  choice: porteiros
  rationale: Designa os encarregados de guardar portas ou portões, especialmente no contexto do templo. «Porteiros» é claro e corrente em português.
- source_word: Σάλλουμος
  choice: Sálumos
  rationale: Translitera a forma grega, inclusive sua terminação, sem harmonizá-la com uma possível forma hebraica. O acento gráfico preserva a tonicidade inicial indicada pelo grego.
- source_word: καὶ
  choice: e
  rationale: Conjunção simples que liga os dois nomes.
- source_word: Τοβάνης
  choice: Tobanes
  rationale: Translitera diretamente a forma grega e evita substituí-la por um nome hebraico mais conhecido que não é exigido pelo texto.
