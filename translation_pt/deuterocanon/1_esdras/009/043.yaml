base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/043.yaml
  text: And Mattathias[a], Sammou, Ananias, Azarias, Ourias, Ezekias, and Baalsamos stood at his right hand,
translation:
  language: pt
  text: E à direita dele estavam Matatias[a], Samu, Ananias, Azarias, Urias, Ezequias e Baalsamo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os nomes gregos deste versículo diferem dos do paralelo aproximado em Neemias 8:4, cuja lista dos homens à direita de Esdras não é idêntica. Como 1 Esdras é traduzido da testemunha grega, as formas gregas dos nomes são mantidas.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστησεν
  choice: ficaram de pé
  rationale: Embora a forma grega seja singular e formalmente transitiva («colocou» ou «fez ficar de pé»), a sequência de nomes e a expressão de posição favorecem a descrição idiomática dos homens que ocupavam seus lugares. A nota registra a dificuldade textual sem impor ao leitor uma construção obscura.
- source_word: αὐτῷ
  choice: dele
  rationale: O dativo, junto da expressão espacial, indica a posição em relação ao personagem em foco, isto é, à direita dele.
- source_word: ἐκ δεξιῶν
  choice: à direita
  rationale: Expressão espacial corrente, vertida de modo natural e concreto em português.
- source_word: Ματταθίας, Σαμμοῦ, Ἀνανίας, Ἀζαρίας, Οὐρείας, Ἐζεκίας, Βαάλσαμος
  choice: Matatias, Samu, Ananias, Azarias, Urias, Ezequias e Baalsamo
  rationale: Os nomes seguem as formas gregas, adaptadas à grafia portuguesa, sem substituir a lista pela do paralelo hebraico aproximado.
