base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/008.yaml
  text: And now give confession and glory to the Lord God of our fathers[b][a],
translation:
  language: pt
  text: E agora, façam confissão[a] e deem glória ao Senhor, Deus de nossos pais.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reconhecimento”. O grego ὁμολογία pode indicar confissão ou reconhecimento; aqui, “confissão” é preferível por causa do contexto penitencial.
    reason: lexical_alternative
  - marker: b
    text: O texto grego deste versículo é mais curto que o paralelo mais amplo no livro de Esdras. A tradução segue a redação grega, usando o hebraico apenas como apoio contextual.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ νῦν
  choice: E agora
  rationale: Preserva de modo direto o nexo discursivo e a referência temporal, sem interpretar excessivamente a transição.
- source_word: δότε
  choice: deem
  rationale: Imperativo plural de δίδωμι; “deem” reproduz diretamente a construção grega e é compreensível com os objetos “confissão e glória”.
- source_word: ὁμολογίαν
  choice: confissão
  rationale: O termo pode significar confissão ou reconhecimento. Neste contexto penitencial, “confissão” comunica melhor a admissão da infidelidade, sem eliminar a alternativa lexical registrada em nota.
- source_word: δόξαν
  choice: glória
  rationale: Mantém a expressão bíblica reconhecível “dar glória” e o registro religioso do grego; “honra” seria possível, mas menos formalmente correspondente.
- source_word: τῷ κυρίῳ
  choice: ao Senhor
  rationale: Neste contexto das Escrituras judaicas, κύριος designa o Deus de Israel; “Senhor” é a equivalência tradicional e adequada.
- source_word: θεῷ τῶν πατέρων ἡμῶν
  choice: Deus de nossos pais
  rationale: Preserva a fórmula pactual e o masculino explícito de πατέρων; “antepassados” seria mais abrangente, porém menos formalmente exato.
theological_decisions:
- issue: Sentido de ὁμολογίαν no contexto penitencial
  choice: confissão
  alternative: reconhecimento
  rationale: A exortação ocorre em um contexto de admissão de infidelidade à aliança. “Confissão” conserva essa força moral e religiosa, enquanto a nota mantém visível a ambiguidade lexical.
- issue: Tradução de πατέρων
  choice: pais
  alternative: antepassados
  rationale: O grego emprega um termo masculino numa fórmula bíblica estabelecida. “Pais” preserva essa forma e sua ressonância pactual sem neutralizá-la.
- issue: Extensão do texto grego em relação ao paralelo de Esdras
  choice: traduzir somente a redação grega fornecida
  alternative: completar o versículo com base no paralelo hebraico
  rationale: O grego é a fonte primária desta tradução e é substancialmente mais curto neste ponto; o paralelo hebraico serve apenas como verificação contextual, não como material a ser incorporado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “confissão e glória” e a fórmula “Deus de nossos pais” mantêm o tom bíblico do original. Os marcadores aparecem no texto em ordem de ocorrência.
