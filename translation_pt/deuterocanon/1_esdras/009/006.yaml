base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/006.yaml
  text: And the whole assembly sat together in the open court of the temple[b][a], trembling because of the present storm.
translation:
  language: pt
  text: E toda a assembleia tomou assento junta no pátio aberto do templo[a], tremendo por causa da tempestade que ocorria então.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no espaço amplo do templo” ou “na área espaçosa do santuário”. O grego εὐρυχώρῳ é incomum e pode indicar uma área aberta dentro do recinto do templo.
    reason: lexical_alternative
  - marker: b
    text: Ou “tremendo por causa do frio daquele inverno” ou “por causa do mau tempo que os atingia”. O grego χειμών pode significar “inverno”, “tempestade” ou “mau tempo”; o contexto favorece o sentido de tempo tempestuoso.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκάθισαν
  choice: se sentou reunida
  rationale: Preserva a imagem concreta de todos tomarem assento juntos, com concordância coletiva natural em português.
- source_word: πᾶν τὸ πλῆθος
  choice: toda a assembleia
  rationale: Expressa a totalidade do grupo reunido e se ajusta ao contexto comunitário formal sem soar arcaico.
- source_word: ἐν τῇ εὐρυχώρῳ
  choice: no pátio aberto
  rationale: O termo substantivado indica um espaço amplo ou aberto; no contexto do templo, provavelmente designa um pátio ou área aberta dentro do recinto.
- source_word: τοῦ ἱεροῦ
  choice: do templo
  rationale: ἱερόν costuma designar o templo ou seu recinto sagrado, não necessariamente o santuário interior; 'templo' é claro e natural.
- source_word: τρέμοντες
  choice: tremendo
  rationale: Mantém o particípio e sua força concreta, sem decidir além do texto se o tremor era apenas físico ou também envolvia temor.
- source_word: τὸν ἐνεστῶτα χειμῶνα
  choice: por causa da tempestade que caía naquele momento
  rationale: χειμών pode significar inverno, tempestade ou mau tempo; o contexto favorece o tempo tempestuoso então presente, enquanto a formulação traduz a ideia de algo que estava sobrevindo ou em curso.
