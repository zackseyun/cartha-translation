  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A tradução conserva as ambiguidades espaciais e meteorológicas do grego por meio de notas, sem recorrer ao paralelo massorético, que neste caso apresenta grande divergência textual.
