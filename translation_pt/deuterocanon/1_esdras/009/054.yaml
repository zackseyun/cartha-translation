base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/054.yaml
  text: And they all went away to eat and drink and rejoice[a], and to send portions to those who had nothing, and to rejoice greatly;
translation:
  language: pt
  text: E todos foram embora para comer, beber e se alegrar, enviar porções aos que nada tinham[a] e alegrar-se muito;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos que não tinham porções preparadas”. O paralelo hebraico fala explicitamente do envio de porções de comida aos que não as tinham.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾤχοντο
  choice: foram embora
  rationale: O verbo οἴχομαι expressa partir ou ir embora; a formulação indica que todos deixaram a assembleia para cumprir o que fora determinado.
- source_word: φαγεῖν καὶ πιεῖν
  choice: para comer, beber
  rationale: A sequência de infinitivos indica a finalidade da partida e se verte de modo direto e natural em português.
- source_word: εὐφραίνεσθαι
  choice: se alegrar
  rationale: O verbo denota alegria, inclusive em contexto festivo; a opção preserva seu sentido sem explicitação excessiva.
- source_word: δοῦναι ἀποστολὰς
  choice: enviar porções
  rationale: Embora a expressão grega possa referir-se mais amplamente a dar ou enviar provisões, o paralelo hebraico מָנוֹת confirma que se trata de porções, provavelmente de comida festiva.
- source_word: τοῖς μὴ ἔχουσιν
  choice: aos que nada tinham
  rationale: O grego deixa implícito aquilo que lhes faltava. Esta formulação mantém essa amplitude, enquanto a nota registra a compreensão contextual sugerida pelo paralelo hebraico.
- source_word: εὐφρανθῆναι μεγάλως
  choice: celebrar com grande alegria
  rationale: A expressão intensifica a alegria festiva. A formulação natural evita a repetição rígida de 'alegrar-se', mas conserva a retomada retórica do grego.
theological_decisions:
- issue: Objeto implícito em τοῖς μὴ ἔχουσιν
  choice: aos que nada tinham
  alternative: aos que não tinham porções preparadas
  rationale: O texto grego não declara o objeto de 'ter'. A tradução principal preserva essa indeterminação; a nota apresenta a leitura contextual apoiada pelo paralelo hebraico, sem torná-la obrigatória no corpo do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução preserva a sucessão de ações do grego e sua ênfase final na alegria, sem tornar explícito no texto principal o objeto omitido em τοῖς μὴ ἔχουσιν.
