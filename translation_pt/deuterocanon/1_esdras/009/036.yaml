base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/036.yaml
  text: All these had lived with foreign women[a], and they sent them away with the children.
translation:
  language: pt
  text: Todos estes tinham vivido com mulheres estrangeiras[a] e as mandaram embora com os filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais explícito segundo o paralelo hebraico: “tinham se casado com mulheres estrangeiras” ou “tinham tomado mulheres estrangeiras por esposas”.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες οὗτοι
  choice: Todos estes
  rationale: Reproduz diretamente a expressão demonstrativa sem acrescentar “homens”, que não está explícito no grego.
- source_word: συνῴκησαν
  choice: tinham vivido com
  rationale: Preserva o sentido básico de viver junto ou coabitar; o contexto é matrimonial, mas o grego não emprega aqui um verbo explícito para casar.
- source_word: γυναῖξιν ἀλλογενέσιν
  choice: mulheres estrangeiras
  rationale: Traduz literalmente o substantivo e o adjetivo; “esposas estrangeiras” explicitaria uma relação apenas implícita na redação grega.
- source_word: ἀπέλυσαν
  choice: mandaram embora
  rationale: Expressão portuguesa natural para dispensar ou afastar, sem impor terminologia técnica de divórcio.
- source_word: αὐτὰς
  choice: as
  rationale: O pronome retoma de maneira clara e concisa as mulheres estrangeiras.
- source_word: σὺν τέκνοις
  choice: com os filhos
  rationale: Mantém a ausência de possessivo explícito no grego; “filhos” é natural no contexto familiar, embora τέκνα também possa ser vertido por “crianças”.
theological_decisions:
- issue: Se a relação deve ser explicitada como casamento
  choice: tinham vivido com mulheres estrangeiras
  alternative: tinham se casado com mulheres estrangeiras; tinham tomado esposas estrangeiras
  rationale: O grego primário usa linguagem de convivência, enquanto o paralelo hebraico torna o casamento mais explícito. A tradução principal preserva a formulação grega e registra a nuance matrimonial em nota.
- issue: Se ἀπέλυσαν deve receber terminologia técnica de divórcio
  choice: mandaram embora
  alternative: repudiaram; divorciaram-se delas
  rationale: O verbo pode assumir sentido conjugal neste contexto, mas a expressão escolhida conserva sua amplitude lexical sem resolver além do texto a natureza jurídica da separação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção mantém a ambiguidade do grego quanto à designação formal da relação e evita acrescentar um possessivo em “os filhos”.
