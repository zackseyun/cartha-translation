base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/048.yaml
  text: Jeshua and Anniuth and Sherebiah[a], Jadinus, Jarsubus, Abteus, Autaias, Maiannas and Kelitas, Azariah, Katezabdus, Annas, Phalias—the Levites—
translation:
  language: pt
  text: Jesua, Aniute e Serebias[a], Jadino, Jarsuboo, Abteu, Autaias, Maiannas e Quelitas, Azarias, Catetzabdo, Anás e Falias — os levitas —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vários nomes deste versículo são textualmente incertos no testemunho grego, e alguns talvez correspondam à lista de levitas de Neemias 8:7, como Sabatai, Hodias, Maaseias e outros. O texto principal conserva, em geral, formas baseadas no grego, salvo quando a correspondência semítica é especialmente segura.
    reason: textual_variant
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Jesua
  rationale: Neste contexto de Esdras-Neemias, representa o nome semítico correspondente, distinguindo-o da forma portuguesa neotestamentária «Jesus».
- source_word: Ἀννιοὺθ
  choice: Aniute
  rationale: Transliteração portuguesa conservadora do nome grego incerto.
- source_word: Σαραβίας
  choice: Serebias
  rationale: Emprega a forma semítica reconhecível no contexto de Esdras-Neemias, em vez de uma transliteração puramente grega.
- source_word: Ἰάδεινος
  choice: Jadino
  rationale: Reproduz de perto a forma grega sem impor uma identificação hebraica incerta.
- source_word: Ἰαρσούβοος
  choice: Jarsuboo
  rationale: Transliteração conservadora de uma forma grega difícil, preservando a incerteza textual.
- source_word: Ἀβταῖος
  choice: Abteu
  rationale: Forma aportuguesada baseada no grego; evita harmonização conjectural com Sabatai.
- source_word: Αὐταίας
  choice: Autaias
  rationale: Transliteração próxima do testemunho grego, sem identificá-lo conjecturalmente com Hodias.
- source_word: Μαιάννας
  choice: Maiannas
  rationale: Mantém diretamente a forma grega devido à incerteza de sua correspondência semítica.
- source_word: Καλείτας
  choice: Quelitas
  rationale: Forma portuguesa reconhecível do nome, próxima tanto do grego quanto da tradição de Esdras-Neemias.
- source_word: Ἀζαρίας
  choice: Azarias
  rationale: Equivalente português tradicional e direto da forma grega.
- source_word: Κατέθζαβδος
  choice: Catetzabdo
  rationale: A forma transmitida é difícil, mas o texto principal a preserva em transliteração, em vez de substituí-la pela identificação conjectural «Jozabade».
- source_word: Ἄννας
  choice: Anás
  rationale: Transliteração portuguesa direta da forma grega, sem normalização para um nome hebraico diferente.
- source_word: Φαλίας
  choice: Falias
  rationale: Transliteração portuguesa próxima do grego, preservando a forma própria deste testemunho.
- source_word: οἱ Λευεῖται
  choice: os levitas
  rationale: Identifica naturalmente em português os nomes anteriores como pertencentes aos levitas.
