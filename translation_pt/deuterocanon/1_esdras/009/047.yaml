base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/047.yaml
  text: And all the assembly cried out, “Amen, amen,” and lifting up their hands, they fell to the ground and worshiped God.
translation:
  language: pt
  text: 'E toda a assembleia exclamou: “Amém, amém!” Levantando as mãos, todos se prostraram por terra e adoraram a Deus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφώνησεν
  choice: exclamou
  rationale: Expressa uma manifestação vocal pública e enfática, sem sugerir necessariamente um grito descontrolado.
- source_word: πᾶν τὸ πλῆθος
  choice: toda a assembleia
  rationale: Preserva a totalidade do grupo e, no contexto de culto, comunica melhor uma comunidade reunida do que “multidão”.
- source_word: Ἀμήν, ἀμήν
  choice: Amém! Amém!
  rationale: Mantém a resposta litúrgica tradicional e sua repetição enfática; a pontuação evidencia a aclamação coletiva.
- source_word: ἄραντες ἄνω τὰς χεῖρας
  choice: levantaram as mãos
  rationale: Formulação natural em português que comunica suficientemente o movimento para o alto já inerente a “levantar”.
- source_word: προσπεσόντες ἐπὶ τὴν γῆν
  choice: prostrando-se por terra
  rationale: Descreve com clareza a postura corporal reverente e evita que “caíram” pareça um acidente.
- source_word: προσεκύνησαν
  choice: adoraram
  rationale: Como o ato é dirigido a Deus, “adoraram” preserva a força religiosa do verbo, sem reduzi-lo a mero gesto corporal.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: O dativo indica o destinatário da adoração; em português, a construção idiomática é “adorar a Deus”.
theological_decisions:
- issue: Relação entre a prostração e o verbo προσκυνέω
  choice: Distinguir a postura corporal (“prostrando-se por terra”) do ato religioso (“adoraram a Deus”).
  alternative: “Inclinaram-se diante de Deus” ou “prestaram homenagem a Deus”.
  rationale: O grego apresenta tanto o gesto físico como a ação de culto. Mantê-los distintos conserva toda a força narrativa e teológica do texto.
- issue: Uso do testemunho grego diante do paralelo massorético aproximado
  choice: Seguir integralmente a cena litúrgica preservada no grego.
  alternative: Importar a formulação do paralelo hebraico fornecido.
  rationale: O paralelo hebraico apresentado não corresponde de perto ao conteúdo deste versículo; o texto grego completo e de alta confiança é, portanto, a âncora da tradução.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Assembleia” preserva o contexto comunitário de culto; “prostrando-se por terra” é claro e reverente. Não são necessárias notas de rodapé.
