  source_fidelity: A tradução acompanha o grego com precisão quanto à aclamação coletiva, à dupla resposta «Amém», ao levantar das mãos, à prostração e à adoração dirigida a Deus. A revisão apenas torna mais explícito em português que os atos subsequentes são realizados pelos membros da assembleia.
  naturalness: «Então levantaram» depois de «toda a assembleia exclamou» produz uma mudança algo brusca entre sujeito coletivo no singular e verbo no plural. A formulação revista preserva o plural do grego e soa mais fluente em português moderno. A vírgula entre os dois «Amém» reproduz melhor a repetição coordenada do original do que dois enunciados exclamativos separados.
  terminology: «Assembleia», «Amém», «prostraram-se por terra» e «adoraram a Deus» são escolhas adequadas, naturais e fiéis ao contexto litúrgico. «Adoraram» traduz apropriadamente προσκυνέω quando o destinatário é Deus.
