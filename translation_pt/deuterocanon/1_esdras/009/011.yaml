base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/011.yaml
  text: But the people are many[a], and it is the rainy season, and we are not able to stand outside[b]; and this is not a task of one day.
translation:
  language: pt
  text: Mas o povo é numeroso, e é tempo de inverno[b]; não conseguiremos ficar ao ar livre[a], e esta tarefa não é de um só dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego contém neste ponto a difícil cláusula «e não encontramos» (καὶ οὐχ εὕρομεν), cujo sentido no contexto é incerto. Ela não foi incluída no texto principal; o sentido geral do versículo é confirmado pelo paralelo em Esdras 10:13.
    reason: textual_variant
  - marker: b
    text: 'Ou: «é a estação chuvosa». O grego diz, mais literalmente, «é tempo de inverno».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πλῆθος πολὺ
  choice: o povo é numeroso
  rationale: Expressa naturalmente a ideia de uma grande coletividade reunida, sem recorrer ao mais formal «a multidão é grande».
- source_word: ὥρα χειμερινή
  choice: é tempo de inverno
  rationale: Preserva de modo claro o sentido literal de uma época invernal; o contexto indica condições climáticas adversas.
- source_word: οὐκ ἰσχύσομεν στῆναι αἴθριοι
  choice: não podemos ficar ao ar livre
  rationale: ἰσχύω indica capacidade ou resistência, e αἴθριοι descreve a permanência em local aberto e exposto ao tempo.
- source_word: τὸ ἔργον ἡμῖν οὐκ ἔστιν ἡμέρας μιᾶς
  choice: esta não é uma tarefa para um só dia
  rationale: Comunica naturalmente que o trabalho não pode ser realizado em apenas um dia, preservando o sentido temporal do genitivo grego.
- source_word: καὶ οὐχ εὕρομεν
  choice: não vertido no texto principal
  rationale: A cláusula transmitida, literalmente «e não encontramos», é sintaticamente obscura e parece deslocada ou corrompida no contexto; sua incerteza é documentada em nota, sem impor uma conjectura.
theological_decisions:
- issue: Uso do paralelo hebraico diante da cláusula grega problemática
  choice: Manter no texto principal apenas o sentido seguro do grego e registrar a cláusula obscura em nota.
  alternative: Traduzir literalmente «e não encontramos» ou reconstruir o texto conforme Esdras 10:13.
  rationale: Isso mantém a primazia do testemunho grego, preserva transparentemente a incerteza textual e evita importar para o texto uma reconstrução não atestada nesta forma grega.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Ao ar livre» é idiomático e preciso; «tempo de inverno» conserva o dado lexical grego, enquanto a nota oferece a força contextual de estação chuvosa.
