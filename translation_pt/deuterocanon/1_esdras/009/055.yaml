base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/055.yaml
  text: For they were also instructed in the words that they had been taught[b][a], and they were assembled.
translation:
  language: pt
  text: Pois também foram imbuídos das palavras que lhes haviam sido ensinadas[a][b] e foram reunidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego traduzido por “foram imbuídos” é incomum neste contexto e também pode ser entendido como “foram inspirados” ou, conforme o sentido sugerido pelo paralelo hebraico, “receberam entendimento”.
    reason: lexical_alternative
  - marker: b
    text: O paralelo em Neemias 8:13 diz mais diretamente que eles “se reuniram [...] para compreender as palavras da Lei”. Primeiro Esdras apresenta a cena numa forma grega condensada.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz uma explicação em continuidade com o contexto; “Pois” preserva essa função discursiva sem exigir uma relação causal mais rígida.
- source_word: καὶ
  choice: também
  rationale: Expressa a força aditiva da partícula de modo natural em português.
- source_word: ἐνεφυσιώθησαν
  choice: foram imbuídos
  rationale: O verbo é incomum neste contexto. “Foram imbuídos” conserva sua imagem e sua ambiguidade melhor do que a interpretação mais específica “foram instruídos”, evitando também repetir o sentido de ἐδιδάχθησαν.
- source_word: ἐν τοῖς ῥήμασιν
  choice: das palavras
  rationale: Embora ἐν seja literalmente “em”, a construção portuguesa “imbuídos das palavras” é idiomática e mantém as palavras como conteúdo que os permeou.
- source_word: οἷς ἐδιδάχθησαν
  choice: que lhes haviam sido ensinadas
  rationale: Preserva a referência relativa às palavras e o sentido passivo da instrução, com uma sequência temporal natural em português.
- source_word: ἐπισυνήχθησαν
  choice: foram reunidos
  rationale: Mantém a voz passiva do texto grego e soa natural em português.
