- from: Então Esdras, o sumo sacerdote, trouxe a Lei diante de toda a multidão[a], desde os homens até as mulheres, e de todos os sacerdotes, para que ouvissem a Lei, na lua nova do sétimo mês.
  to: Então Esdras, o sumo sacerdote, trouxe a Lei diante de toda a multidão[a], homens e mulheres, bem como a todos os sacerdotes, para que ouvissem a Lei, no dia da lua nova do sétimo mês.
  rationale: A revisão corrige a regência e a coordenação do segundo grupo mencionado no grego, preservando que tanto a multidão — homens e mulheres — quanto todos os sacerdotes são os destinatários. Também torna a indicação temporal idiomática em português. A nota permanece necessária e corretamente ancorada, pois o paralelo hebraico diverge materialmente quanto ao público.
