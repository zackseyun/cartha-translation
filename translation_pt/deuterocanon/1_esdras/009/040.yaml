base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/040.yaml
  text: And Ezra the chief priest brought the law before all the multitude[a], from man to woman, and all the priests, to hear the law, on the new moon of the seventh month.
translation:
  language: pt
  text: Então Esdras, o sumo sacerdote, trouxe a Lei diante de toda a multidão[a], homens e mulheres, bem como a todos os sacerdotes, para que ouvissem a Lei, no dia da lua nova do sétimo mês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo hebraico em Neemias 8:2–3 difere neste ponto: descreve o público como homens, mulheres e todos os que eram capazes de entender, em vez de mencionar “todos os sacerdotes”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκόμισεν
  choice: trouxe
  rationale: Expressa diretamente o sentido de levar ou trazer, sem acrescentar a ideia interpretativa de uma apresentação cerimonial.
- source_word: ὁ ἀρχιερεύς
  choice: o sumo sacerdote
  rationale: É o título consagrado e imediatamente compreensível em português para ἀρχιερεύς, preservando a função indicada pelo grego.
- source_word: τὸν νόμον
  choice: a Lei
  rationale: Segue o grego, que traz simplesmente νόμος, sem acrescentar “livro”; a inicial maiúscula sinaliza a referência à Lei/Torá neste contexto.
- source_word: παντὶ τῷ πλήθει
  choice: toda a multidão
  rationale: Preserva a ideia de um grande conjunto reunido e permanece mais próxima de πλῆθος do que uma formulação institucional como “assembleia”.
- source_word: ἀπὸ ἀνθρώπου ἕως γυναικός
  choice: desde os homens até as mulheres
  rationale: Reproduz de modo natural em português a extensão inclusiva da expressão distributiva grega, mantendo sua formulação marcada por gênero.
- source_word: πᾶσιν τοῖς ἱερεῦσιν
  choice: e de todos os sacerdotes
  rationale: Segue o texto grego de Swete. A preposição “de” coordena este grupo com “toda a multidão” como destinatários diante dos quais a Lei foi trazida.
- source_word: ἀκοῦσαι τὸν νόμον
  choice: para que ouvissem a Lei
  rationale: Torna explícito, em português natural, o valor final do infinitivo grego sem acrescentar “a leitura”, expressão apenas implícita no contexto.
- source_word: νουμηνίᾳ τοῦ ἑβδόμου μηνός
  choice: na lua nova do sétimo mês
  rationale: Traduz diretamente o dia da lua nova e mantém sua ligação genitiva com o sétimo mês.
theological_decisions:
- issue: Descrição marcada por gênero do público
  choice: desde os homens até as mulheres
  alternative: tanto homens como mulheres
  rationale: A escolha preserva a estrutura abrangente e a tensão formal do grego, sem neutralizar sua linguagem de gênero.
- issue: Composição do público no texto grego em contraste com o paralelo hebraico
  choice: e de todos os sacerdotes
  alternative: e de todos os que eram capazes de entender
  rationale: O texto principal segue o testemunho grego de 1 Esdras, que menciona os sacerdotes; a diferença relevante do paralelo hebraico é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Sumo sacerdote” e “a Lei” empregam formas bíblicas amplamente reconhecidas; a sintaxe foi ajustada para deixar claro que a multidão, homens, mulheres e sacerdotes constituem o público diante do qual a Lei foi trazida.
