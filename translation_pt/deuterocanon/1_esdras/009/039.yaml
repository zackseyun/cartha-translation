base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/039.yaml
  text: And he told Ezra the priest and reader to bring the law of Moses that had been given by the God of Israel[a][b].
translation:
  language: pt
  text: E ele disse a Esdras, o sacerdote e leitor[a], que trouxesse a Lei de Moisés, dada pelo Deus de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «leitor público». Alguns traduzem «escriba», mas o termo grego designa mais diretamente alguém que lê em voz alta.
    reason: lexical_alternative
  - marker: b
    text: Ou «transmitida pelo Deus de Israel» ou «entregue pelo Deus de Israel». O particípio grego pode enfatizar tanto a entrega quanto a transmissão.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν ... κομίσαι
  choice: disse ... que trouxesse
  rationale: A construção com εἶπεν e infinitivo comunica uma orientação ou solicitação. Em português, «disse ... que trouxesse» é natural e não intensifica o verbo como faria «ordenou».
- source_word: Ἔσρᾳ
  choice: Esdras
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: τῷ ἱερεῖ
  choice: o sacerdote
  rationale: Preserva o título que identifica Esdras por seu ofício.
- source_word: ἀναγνώστῃ
  choice: leitor
  rationale: O substantivo grego designa diretamente alguém que lê, provavelmente em voz alta. «Leitor» preserva essa função sem harmonizá-la com «escriba».
- source_word: τὸν νόμον Μωυσέως
  choice: a Lei de Moisés
  rationale: É a formulação portuguesa tradicional, clara e direta para a construção genitiva grega.
- source_word: τὸν παραδοθέντα
  choice: dada
  rationale: No contexto da transmissão divina da Lei, «dada» é idiomático e claro; a nota conserva a possível ênfase em algo entregue ou transmitido.
- source_word: ὑπὸ τοῦ θεοῦ Ἰσραήλ
  choice: pelo Deus de Israel
  rationale: ὑπό com o particípio passivo identifica Deus como agente, expresso naturalmente por «pelo».
theological_decisions:
- issue: Relação da Lei com Moisés e com Deus
  choice: a Lei de Moisés, dada pelo Deus de Israel
  alternative: a Lei de Moisés, transmitida pelo Deus de Israel; a Lei dada por Deus por meio de Moisés
  rationale: O grego relaciona a Lei a Moisés e apresenta o Deus de Israel como agente de sua entrega. A tradução mantém os dois elementos sem acrescentar «por meio de Moisés», ideia possível, mas não explicitada nesta frase.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi ajustada com uma vírgula antes de «dada» para deixar claro que a expressão descreve a Lei, sem acrescentar mediação não explícita no grego.
