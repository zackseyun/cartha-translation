base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/035.yaml
  text: 'From the sons of Ooma: Zeitias[a], Zabadias, Edos, Ouel[b], and Banaias.'
translation:
  language: pt
  text: 'Da família de Oomá[a]: Zeitiás, Zabadaías, Edós, Uel e Banaías.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega uma construção abreviada que, neste contexto, indica os membros da casa ou do grupo familiar de Oomá.
    reason: cultural_note
  - marker: b
    text: O texto grego registra estes nomes individualmente; o paralelo aproximado em Esdras 10 no Texto Massorético encerra esta parte com uma declaração resumida, sem conservar aqui a mesma lista.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκ τῶν Ὀομά
  choice: Dos descendentes de Oomá
  rationale: A construção grega é elíptica no contexto desta lista e indica membros da casa ou do grupo familiar de Oomá. “Descendentes” explicita esse sentido sem restringi-lo necessariamente a filhos imediatos.
- source_word: Ζειτιάς
  choice: Zeitiás
  rationale: Transliteração da forma grega, com acento gráfico para conservar a tonicidade final e facilitar a leitura em português.
- source_word: Ζαβαδαίας
  choice: Zabadaías
  rationale: Transliteração direta da forma grega, sem harmonização com uma possível forma hebraica mais conhecida.
- source_word: Ἠδός
  choice: Edós
  rationale: Transliteração legível da forma grega, preservando sua tonicidade final.
- source_word: Οὐὴλ
  choice: Uel
  rationale: A sequência grega inicial Οὐ- é representada naturalmente por “U” em português; evita-se a grafia menos idiomática “Ouel”.
- source_word: Βαναίας
  choice: Banaías
  rationale: Transliteração da forma grega, mantendo-a distinta de formas hebraicas eventualmente relacionadas.
