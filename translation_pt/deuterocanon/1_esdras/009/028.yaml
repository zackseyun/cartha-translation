base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/028.yaml
  text: 'And from the sons of Zamoth: Eliadas[a], Eleiasimus, Othonias, Jarimoth, Sabados[b], and Zeralias.'
translation:
  language: pt
  text: 'E dos filhos de Zamote: Eliádas[a], Eleiásimo, Otonías, Jarimote, Sábados[b] e Zeralías.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vários nomes deste versículo podem refletir formas gregas diferentes das encontradas na tradição hebraica paralela; esta tradução segue o texto grego de 1 Esdras, sem harmonizar a lista com Esdras ou Neemias.
    reason: alternative_reading
  - marker: b
    text: Como a transcrição da fonte está assinalada com uma pequena divergência, a grafia de alguns nomes próprios permanece ligeiramente incerta; adotou-se aqui uma transliteração conservadora do testemunho grego fornecido.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: dos filhos de
  rationale: A expressão introduz membros pertencentes a um grupo familiar. “Dos filhos de” preserva a fórmula genealógica concisa do grego e soa natural em português.
- source_word: Ζαμόθ
  choice: Zamote
  rationale: Transliteração conservadora da forma grega, com vogal final de apoio para leitura natural em português, sem harmonização com uma tradição hebraica paralela.
- source_word: Ἐλιάδας
  choice: Elíadas
  rationale: Transliteração direta da forma grega, com acento gráfico para indicar a pronúncia em português.
- source_word: Ἐλειάσειμος
  choice: Eleiásimo
  rationale: Forma portuguesa conservadora baseada na sequência de letras do grego, evitando reconstruir um equivalente hebraico incerto.
- source_word: Ὀθονίας
  choice: Otonias
  rationale: Transliteração legível em português; o theta grego é representado por “t”, conforme uso corrente em nomes bíblicos aportuguesados.
- source_word: Ἰαριμώθ
  choice: Jarimote
  rationale: O iota inicial de nomes bíblicos é representado por “J” para legibilidade, e a terminação recebe vogal de apoio em português.
- source_word: Σάβαδος
  choice: Sábados
  rationale: Transliteração da forma grega tal como preservada, sem substituí-la por um possível nome hebraico correlato, como Zabad.
- source_word: Ζεραλίας
  choice: Zerálias
  rationale: Transliteração direta do nome grego, preservando o testemunho de 1 Esdras em vez de o harmonizar com listas paralelas.
