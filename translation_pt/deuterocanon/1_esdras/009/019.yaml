base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/019.yaml
  text: 'From the sons of Jeshua son of Jozadak and his brothers: Maelas[a], Eleazar, Joribus, and Joadanus.'
translation:
  language: pt
  text: 'Dos filhos de Jesua, filho de Jozadaque, e dos irmãos dele: Maelas[a], Eleazar, Joribo e Joadano.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego traz aqui os nomes Maelas, Joribo e Joadano. No paralelo hebraico aproximado de Esdras 10:18,20–21, os nomes correspondentes são diferentes, refletindo a relação mais livre entre 1 Esdras e o Texto Massorético nessas listas.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Dos filhos de
  rationale: Mantém a força de ἐκ e introduz naturalmente, em português, um subgrupo dentro da lista.
- source_word: Ἰησοῦ
  choice: Jesua
  rationale: Neste contexto pós-exílico, o nome grego representa o nome sacerdotal Jesua, e não a forma neotestamentária Jesus.
- source_word: τοῦ Ἰωσεδὲκ
  choice: filho de Jozadaque
  rationale: O genitivo exprime o patronímico; Jozadaque é uma forma bíblica portuguesa reconhecível e relacionada à tradição hebraica.
- source_word: τῶν ἀδελφῶν αὐτοῦ
  choice: e dos irmãos dele
  rationale: O singular αὐτοῦ remete mais naturalmente a Jesua. A forma 'dele' evita a possível ambiguidade de 'seus' sem alterar a relação expressa no grego.
- source_word: Μαεήλας
  choice: Maelas
  rationale: Translitera a forma preservada no texto grego, sem harmonizá-la com a lista hebraica paralela.
- source_word: Ἐλεάζαρος
  choice: Eleazar
  rationale: Emprega a forma portuguesa bíblica tradicional e reconhecível deste nome.
- source_word: Ἰώριβος
  choice: Joribo
  rationale: Transliteração ajustada à morfologia portuguesa da forma grega, preservada em vez de ser substituída por um possível correspondente hebraico.
- source_word: Ἰωάδανος
  choice: Joadano
  rationale: Transliteração portuguesa direta da forma grega; a divergência da tradição hebraica não é harmonizada no texto principal.
