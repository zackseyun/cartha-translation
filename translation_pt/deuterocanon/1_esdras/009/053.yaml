base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/053.yaml
  text: And the Levites kept instructing all the people[a], saying, “This day is holy; do not grieve.”
translation:
  language: pt
  text: 'E os levitas instruíam todo o povo, dizendo: “Este dia é santo; não fiquem tristes[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se entristeçam” ou “não lamentem”.'
    reason: Alternativas lexicais possíveis para μὴ λυπεῖσθε.
lexical_decisions:
- source_word: οἱ Λευεῖται
  choice: os levitas
  rationale: Forma tradicional e natural em português para o grupo étnico e cultual mencionado no texto.
- source_word: ἐκέλευον
  choice: continuavam orientando
  rationale: O imperfeito indica uma ação contínua ou repetida. Neste contexto de exortação pública, “orientando” comunica uma instrução enfática sem impor ao verbo um tom excessivamente autoritário.
- source_word: τῷ δήμῳ πάντα
  choice: todo o povo
  rationale: δήμῳ designa o povo ou a assembleia; πάντα expressa aqui abrangência. “Todo o povo” é a formulação mais natural em português, embora a construção grega seja pouco usual.
- source_word: λέγοντες
  choice: dizendo
  rationale: Reproduz de modo direto o particípio que introduz a fala dos levitas.
- source_word: Ἡ ἡμέρα αὕτη ἁγία
  choice: Este dia é santo
  rationale: Preserva o demonstrativo αὕτη e traduz ἁγία pelo termo bíblico corrente “santo”.
- source_word: μὴ λυπεῖσθε
  choice: não fiquem tristes
  rationale: Expressa em português atual o estado de tristeza indicado por λυπέω; a nota registra alternativas igualmente possíveis, com matizes de entristecimento ou lamento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O aspecto contínuo do imperfeito foi explicitado por “continuavam”; a fala direta conserva a concisão do grego.
