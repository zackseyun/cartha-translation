base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/033.yaml
  text: 'And from the sons of Asom: Maltannaios[a], Mattathias, Sabannaious, Eleiphalat, Manasseh[b], and Shimei.'
translation:
  language: pt
  text: 'E dos filhos de Asom: Maltannaios[a], Matatias, Sabannaios, Eleifalat, Manassés[b] e Semeí.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, “Asom”. O paralelo hebraico provavelmente corresponde a “Hasum”.
    reason: alternative_reading
  - marker: b
    text: Vários nomes desta lista apresentam formas gregas que não correspondem exatamente às da tradição hebraica paralela; o texto principal segue o testemunho grego de 1 Esdras.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ ἐκ τῶν υἱῶν
  choice: E dos filhos de
  rationale: Reproduz de modo natural e relativamente formal a introdução grega de mais um grupo familiar na lista.
- source_word: Ἀσόμ
  choice: Asom
  rationale: Mantém no texto principal a forma do testemunho grego, que é a fonte primária; a provável correspondência hebraica é indicada em nota.
- source_word: Μαλτανναῖος
  choice: Maltanaios
  rationale: Translitera a forma grega do nome, sem harmonizá-la com uma possível forma hebraica.
- source_word: Ματταθίας
  choice: Matatias
  rationale: Emprega a forma portuguesa bíblica corrente correspondente ao nome grego.
- source_word: Σαβανναιούς
  choice: Sabanaios
  rationale: Preserva a forma grega incomum, em vez de substituí-la por uma identificação conjectural baseada na tradição hebraica paralela.
- source_word: Ἐλειφαλὰτ
  choice: Eleifalat
  rationale: Transliteração próxima do grego, mantendo inclusive o ditongo ει, sem normalização segundo o hebraico.
- source_word: Μανασση
  choice: Manassés
  rationale: Usa a forma bíblica portuguesa estabelecida e facilmente reconhecível.
- source_word: Σεμεεί
  choice: Semeí
  rationale: Translitera diretamente a forma grega Σεμεεί em português; evita harmonizá-la silenciosamente com o hebraico Simei.
