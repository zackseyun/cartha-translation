base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/007.yaml
  text: And Ezra rose and said to them[a], “You have acted lawlessly and have married foreign women, adding sin to Israel.”
translation:
  language: pt
  text: 'Então Esdras se levantou e lhes disse: “Vocês agiram contra a Lei e viveram com mulheres estrangeiras,[a] acrescentando pecado a Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “casaram-se com mulheres estrangeiras” ou “tomaram mulheres estrangeiras por esposas”. O verbo grego significa literalmente “viver com”, mas, neste contexto, refere-se a uniões conjugais com mulheres de outros povos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: se levantou
  rationale: O particípio aoristo de ἀνίστημι introduz a fala de Esdras e indica o movimento narrativo de levantar-se.
- source_word: ἠνομήσατε
  choice: agiram contra a Lei
  rationale: Preserva a força de ἀνομέω como conduta contrária à lei, evitando reduzi-la ao sentido mais genérico de simplesmente pecar.
- source_word: συνῳκίσατε
  choice: passaram a viver com
  rationale: Mantém o sentido básico de coabitar ou viver em união com alguém. No contexto, refere-se a uniões conjugais, mas a formulação preserva a expressão do grego sem tornar explícito mais do que ele diz.
- source_word: γυναιξὶν ἀλλογενέσιν
  choice: mulheres estrangeiras
  rationale: Expressa de modo natural que eram mulheres pertencentes a outros povos, sem linguagem arcaica.
- source_word: προσθεῖναι
  choice: acrescentando
  rationale: O infinitivo indica o resultado ou efeito da conduta anterior; o gerúndio é natural em português e conserva essa relação.
- source_word: ἁμαρτίαν
  choice: pecado
  rationale: Equivalente direto e corrente de ἁμαρτία neste contexto de repreensão religiosa.
- source_word: τῷ Ἰσραήλ
  choice: a Israel
  rationale: Preserva o dativo como alvo do acréscimo e mantém a dimensão coletiva da culpa de Israel.
theological_decisions:
- issue: Explicitar ou não o sentido matrimonial de συνῳκίσατε
  choice: passaram a viver com mulheres estrangeiras
  alternative: casaram-se com mulheres estrangeiras; tomaram mulheres estrangeiras por esposas
  rationale: O contexto trata de uniões conjugais, mas o verbo grego enfatiza viver junto ou coabitar. A tradução preserva essa formulação, enquanto a nota informa o sentido contextual.
- issue: Força coletiva da acusação contra Israel
  choice: acrescentando pecado a Israel
  alternative: aumentando o pecado de Israel; trazendo culpa sobre Israel
  rationale: A redação conserva a afirmação de que a conduta dos acusados aumenta o pecado no âmbito coletivo de Israel, sem explicar além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês” evita a forma regional ou arcaizante “vós”; “Lei” recebe inicial maiúscula porque, neste contexto, a acusação é de conduta contrária à Lei que regia Israel.
