base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/004.yaml
  text: And whoever does not appear within two or three days[a], according to the judgment of the presiding elders, their livestock will be devoted[b], and he himself will be excluded from the assembly of the captivity.
translation:
  language: pt
  text: E todos os que não comparecerem dentro de dois ou três dias, conforme a decisão dos anciãos que presidem, terão seus animais consagrados[a], e cada um deles será excluído da comunidade dos exilados.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, em sentido mais interpretativo, “serão confiscados”. O verbo grego significa literalmente que serão consagrados ou dedicados, mas aqui essa medida provavelmente implica a perda dos animais.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “da multidão do cativeiro”; isto é, da comunidade formada pelos exilados.
    reason: clarification
lexical_decisions:
- source_word: ἀπαντήσωσιν
  choice: comparecerem
  rationale: No contexto de uma convocação, o verbo indica apresentar-se em resposta ao chamado; “comparecer” transmite com naturalidade o sentido formal e jurídico.
- source_word: ἐν δυσὶν ἢ τρισὶν ἡμέραις
  choice: dentro de dois ou três dias
  rationale: Expressa de modo idiomático o prazo concedido, sem eliminar a pequena ambiguidade temporal do grego.
- source_word: κατὰ τὸ κρῖμα
  choice: conforme a decisão
  rationale: κρῖμα designa aqui uma determinação autorizada; “decisão” preserva o caráter jurídico e soa mais natural do que “juízo” neste contexto.
- source_word: τῶν προκαθημένων πρεσβυτέρων
  choice: dos anciãos que presidem
  rationale: Mantém explicitamente a ideia participial de que esses anciãos exercem liderança ou presidência.
- source_word: ἀνιερωθήσονται
  choice: serão consagrados
  rationale: Preserva o sentido formal de dedicar ou destinar ao sagrado, sem reduzir silenciosamente a expressão à sua provável consequência prática de confisco.
- source_word: τὰ κτήνη αὐτῶν
  choice: seus animais
  rationale: κτήνη se refere primariamente a animais possuídos, especialmente gado; “animais” evita restringir indevidamente as espécies abrangidas.
- source_word: ἀλλοτριωθήσεται
  choice: será excluído
  rationale: Em relação a um corpo comunitário, o passivo indica afastamento ou perda de pertencimento; “excluído” comunica claramente o resultado social e jurídico.
- source_word: ἀπὸ τοῦ πλήθους τῆς αἰχμαλωσίας
  choice: da comunidade dos exilados
  rationale: É uma formulação portuguesa clara para o grupo formado pelos que viveram o exílio, preservando o referente coletivo sem a rigidez de “multidão do cativeiro”.
theological_decisions:
- issue: Natureza da sanção imposta aos bens e à pessoa
  choice: Os animais são “consagrados”, e a pessoa é excluída da comunidade dos exilados.
  alternative: Os bens são simplesmente confiscados ou declarados perdidos, sem qualquer nuance sacral.
  rationale: O grego emprega ἀνιερωθήσονται, termo de dedicação ou consagração, embora neste contexto jurídico a consequência prática provavelmente seja a perda dos bens. O texto principal conserva a nuance lexical grega, e a nota registra a interpretação confiscatória.
translation_notes:
  register: Português moderno, digno e acessível, com redação amplamente compreensível no Brasil e em outros contextos lusófonos. “Cada um deles” reproduz naturalmente a passagem do sujeito plural grego para o pronome singular distributivo. As notas preservam tanto a formulação sacral da pena quanto sua provável força jurídica.
