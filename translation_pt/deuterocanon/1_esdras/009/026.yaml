base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/026.yaml
  text: 'From Israel[a], from the sons of Phoros: Jerma and Jezias and Melcheias and Mielos and Eleazar and Asebeias and Bannaias.'
translation:
  language: pt
  text: 'De Israel[a], dos filhos de Forós: Jermá, Jezeías, Melqueías, Míelos, Eleazar, Asebeías e Banaías.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vários nomes deste versículo provavelmente correspondem a formas hebraicas conhecidas da lista paralela de Esdras 10, como Parós para Forós e Benaías para Banaías. Como aqui 1 Esdras é traduzido do texto grego, as formas gregas dos nomes foram mantidas no texto principal.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ Ἰσραήλ
  choice: De Israel
  rationale: A preposição ἐκ indica procedência ou seleção de dentro de um grupo. “De Israel” preserva a fórmula concisa própria de uma lista.
- source_word: ἐκ τῶν υἱῶν Φορός
  choice: dos filhos de Forós
  rationale: Embora υἱοί possa designar descendentes ou membros de uma linhagem, “filhos de” conserva a forma genealógica do grego e é clara neste contexto.
- source_word: Φορός
  choice: Forós
  rationale: Transliteração portuguesa da forma grega, com o acento final indicado pelo grego, sem substituí-la pela forma hebraica Parós.
- source_word: Ἰερμὰ
  choice: Jermá
  rationale: Transliteração da forma grega, conservando a tonicidade final.
- source_word: Ἰεζείας
  choice: Jezeias
  rationale: Transliteração legível em português da forma nominal grega, sem normalização para uma possível forma hebraica.
- source_word: Μελχείας
  choice: Melqueias
  rationale: A sequência grega χ é representada por “qu” diante de “e” para produzir em português o som correspondente, mantendo a forma grega do nome.
- source_word: Μίηλος
  choice: Míelos
  rationale: Transliteração conservadora da forma grega, com acento gráfico para preservar a tonicidade indicada no original.
- source_word: Ἐλεάζαρος
  choice: Eleazar
  rationale: Emprega-se a forma tradicional e amplamente reconhecida em português, fiel à forma grega.
- source_word: Ἀσεβείας
  choice: Asebeias
  rationale: Transliteração direta da forma grega, sem substituição conjectural por um nome semítico correlato.
- source_word: Βανναίας
  choice: Banaias
  rationale: Transliteração adaptada à ortografia portuguesa; a consoante grega duplicada não exige duplicação gráfica em português.
