base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/022.yaml
  text: 'And from the sons of Phaisour: Elionais[a], Asseias, Ismaēlos, Nathanaēlos, Okaēlēdos[c][b], and Salthas.'
translation:
  language: pt
  text: 'E dos filhos de Faisur[a]: Elionais, Asseias, Ismaelos, Natanaelos, Ocailedos[b][c] e Saltas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz Faisur; o paralelo hebraico aproximado corresponde a Pasur.
    reason: alternative_reading
  - marker: b
    text: O nome Ocailedos segue o testemunho grego neste ponto; a tradição hebraica paralela aproximada pode refletir outro nome subjacente, por vezes identificado com Jozabade.
    reason: textual_variant
  - marker: c
    text: Vários nomes deste versículo aparecem em formas gregas que não coincidem exatamente com as do paralelo hebraico aproximado. Como 1 Esdras é traduzido aqui a partir da Septuaginta, o texto principal conserva as formas gregas adaptadas ao português.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: dos filhos de
  rationale: A fórmula grega indica pessoas provenientes de um grupo familiar; «dos filhos de» preserva de modo natural a estrutura genealógica da lista.
- source_word: Φαισούρ
  choice: Faisur
  rationale: Transliteração portuguesa da forma grega, sem substituí-la pela forma hebraica aproximada.
- source_word: Ἐλιωναίς
  choice: Elionais
  rationale: Reproduz de forma legível em português a forma do nome preservada no texto grego.
- source_word: Ἀσσείας
  choice: Asseias
  rationale: Mantém os dois sigmas do grego e adapta o nome à ortografia portuguesa.
- source_word: Ἰσμαήλος
  choice: Ismaelos
  rationale: Preserva a forma nominal grega, em vez de normalizá-la silenciosamente para o mais conhecido «Ismael».
- source_word: Ναθανάηλος
  choice: Natanaelos
  rationale: Adapta a forma grega ao português, inclusive o dígrafo inicial, sem harmonizá-la com uma possível forma hebraica.
- source_word: Ὠκαιληδός
  choice: Ocailedos
  rationale: Transliteração portuguesa direta do nome difícil atestado no texto grego de Swete; evita importar uma identificação conjectural da tradição paralela.
- source_word: Σάλθας
  choice: Saltas
  rationale: Adaptação ortográfica portuguesa da forma grega, sem substituição por um possível equivalente hebraico.
