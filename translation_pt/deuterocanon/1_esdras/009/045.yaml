base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/045.yaml
  text: And Ezra took up the book before the multitude[a], for he was seated prominently before them all[c][b],
translation:
  language: pt
  text: E Esdras tomou o livro diante da multidão[a], pois estava sentado em lugar de destaque diante de todos[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a assembleia” ou “a multidão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “estava sentado com distinção”; o grego indica uma posição pública de destaque e honra.
    reason: lexical_alternative
  - marker: c
    text: O grego diz “o livro”; historicamente, poderia tratar-se de um rolo.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναλαβών
  choice: tomou
  rationale: O particípio indica que Esdras tomou o objeto nas mãos. “Tomou” é natural e não acrescenta a ideia de recebê-lo de alguém nem de erguê-lo cerimonialmente.
- source_word: τὸ βιβλίον
  choice: o livro
  rationale: É o equivalente direto de βιβλίον; embora o objeto histórico pudesse ser um rolo, o grego não exige essa especificação.
- source_word: τοῦ πλήθους
  choice: da multidão
  rationale: πλῆθος designa o grande grupo reunido; “multidão” preserva esse sentido coletivo sem reduzi-lo simplesmente a “povo”.
- source_word: ἐνώπιον
  choice: diante de
  rationale: A expressão aparece duas vezes e comunica presença pública e visível; a repetição foi preservada.
- source_word: προεκάθητο
  choice: estava sentado
  rationale: O imperfeito descreve a posição ocupada por Esdras. A ideia de anterioridade ou posição frontal é comunicada pelo contexto e por ἐπιδόξως, sem sobrecarregar o verbo.
- source_word: ἐπιδόξως
  choice: em lugar de destaque
  rationale: A locução transmite uma posição publicamente distinta e visível, com mais naturalidade em português do que um advérbio como “honrosamente”.
- source_word: πάντων
  choice: todos
  rationale: Refere-se naturalmente a todos os presentes na reunião.
