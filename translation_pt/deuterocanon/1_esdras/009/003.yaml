revisions:
- from: E foi feita uma proclamação em toda a Judeia e Jerusalém, dirigida a todos os que vieram do cativeiro[a], para que se reunissem em Jerusalém.
  to: E foi feita uma proclamação em toda a Judeia e Jerusalém, a todos os oriundos do cativeiro[a], para se reunirem em Jerusalém.
  rationale: A revisão restringe-se à expressão que designa os destinatários e à nota correspondente. “Oriundos do cativeiro” conserva a relação de procedência expressa por ἐκ sem afirmar de modo tão explícito quanto “vieram” um retorno já realizado. A mudança para “para se reunirem” mantém o conteúdo da convocação e melhora a fluência.
  reviewer_model: gpt-5.6-terra
