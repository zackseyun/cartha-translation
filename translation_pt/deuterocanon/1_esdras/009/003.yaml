base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/003.yaml
  text: And a proclamation was made throughout all Judea and Jerusalem to all those from the captivity[a], to assemble in Jerusalem.
translation:
  language: pt
  text: E foi feita uma proclamação em toda a Judeia e Jerusalém, a todos os oriundos do cativeiro[a], para se reunirem em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais interpretativo, “a todos os exilados” ou “a todos os exilados que haviam retornado”. O grego diz literalmente: “a todos os procedentes do cativeiro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο κήρυγμα
  choice: foi feita uma proclamação
  rationale: Reproduz de modo natural o idiomatismo grego, literalmente 'houve/veio a existir uma proclamação', sem elevar κήρυγμα à categoria formal de decreto.
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: em toda a Judeia e Jerusalém
  rationale: Mantém o âmbito de circulação do anúncio e segue de perto a construção grega, com redação clara em português.
- source_word: πᾶσι τοῖς ἐκ τῆς αἰχμαλωσίας
  choice: a todos os que vieram do cativeiro
  rationale: Preserva a expressão de origem marcada por ἐκ e torna explícita em português a ideia de pessoas procedentes do cativeiro, sem substituir o texto pela interpretação mais específica 'exilados que retornaram'.
- source_word: συναχθῆναι
  choice: para que se reunissem
  rationale: Expressa com naturalidade o conteúdo e propósito da proclamação. O reflexivo português comunica a reunião do grupo sem impor uma passividade rígida ao infinitivo aoristo passivo grego.
- source_word: εἰς Ἰερουσαλήμ
  choice: em Jerusalém
  rationale: Embora εἰς indique direção ou destino, com 'reunir-se' o português idiomático apresenta Jerusalém como o lugar de reunião; o sentido de destino permanece no contexto.
