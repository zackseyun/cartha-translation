base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/041.yaml
  text: And he was reading in the broad space before the temple gate from dawn until midday in the presence of the men and the women[b][a]; and all of them gave their attention to the law.
translation:
  language: pt
  text: E ele lia no espaço amplo diante do portão do templo[a], desde o amanhecer até o meio-dia, na presença dos homens e das mulheres; e eles deram toda a atenção à lei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na área aberta diante do portão do templo”. O grego descreve um lugar amplo ou espaçoso, sem definir com precisão se era uma praça ou um pátio.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “deram toda a mente à lei”, isto é, concentraram nela plenamente a atenção.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεγίνωσκεν
  choice: lia
  rationale: O imperfeito grego apresenta a leitura como uma ação contínua durante o período indicado. O contexto público sugere leitura audível, mas não é necessário acrescentar “em voz alta” ao texto.
- source_word: ἐν τῷ ... εὐρυχώρῳ
  choice: no espaço amplo
  rationale: εὐρύχωρος descreve um lugar largo ou espaçoso. “Espaço amplo” preserva a generalidade do grego sem especificar indevidamente uma praça ou um pátio.
- source_word: πρὸ τοῦ ἱεροῦ πυλῶνος
  choice: diante do portão do templo
  rationale: πρό com genitivo indica localização diante de algo; no contexto, ἱερός relaciona o portão ao recinto do templo. A formulação é clara e natural em português.
- source_word: ἀπὸ ὄρθρου ἕως μεσημβρινοῦ
  choice: desde o amanhecer até o meio-dia
  rationale: A expressão delimita o período da aurora ao meio-dia e conserva o valor temporal dos dois termos gregos.
- source_word: ἐνώπιον τῶν ἀνδρῶν καὶ γυναικῶν
  choice: na presença dos homens e das mulheres
  rationale: Mantém o sentido locativo de ἐνώπιον e a menção explícita dos dois grupos feita pelo grego.
- source_word: ἐπέδωκαν πάντα τὸν νοῦν
  choice: dedicavam toda a atenção
  rationale: A expressão grega significa literalmente que deram a mente inteira, isto é, concentraram plenamente a atenção. O imperfeito em português harmoniza a resposta contínua do público com a leitura prolongada, embora o verbo grego aqui esteja no aoristo.
- source_word: εἰς τὸν νόμον
  choice: à lei
  rationale: A construção indica aquilo para o qual a atenção foi dirigida. “Lei” permanece em minúscula porque o grego não apresenta um título formal, embora o contexto aponte para a lei sagrada que estava sendo lida.
theological_decisions:
- issue: Uso de maiúscula em “lei” como possível designação da Torá mosaica
  choice: lei
  alternative: Lei
  rationale: O contexto identifica uma lei sagrada lida publicamente, mas o grego traz apenas τὸν νόμον. A minúscula evita transformar a expressão em título formal sem apoio explícito.
- issue: Identificação do público por gênero
  choice: os homens e as mulheres
  alternative: o povo
  rationale: O texto grego menciona expressamente homens e mulheres; conservar ambos evita generalizar ou apagar uma distinção presente na fonte.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe simples. A tradução mantém o caráter público e prolongado da leitura, evita especificar além do grego a natureza exata do espaço e conserva a menção explícita a homens e mulheres.
