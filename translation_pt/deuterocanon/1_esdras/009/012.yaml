base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/012.yaml
  text: not in two days, for we have sinned greatly in these matters. But let the leaders of the multitude stand, and let all those from our settlements who have foreign wives come at an appointed time,
translation:
  language: pt
  text: nem em dois dias,[a] pois pecamos gravemente nessas questões. Mas que os líderes da multidão fiquem de pé, e que todos os que são de nossas povoações[b] e têm esposas estrangeiras venham no tempo determinado,[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “nem dois”; pelo contexto, o sentido é “nem em dois dias”, isto é, o assunto não poderia ser resolvido tão depressa.
    reason: lexical_alternative
  - marker: b
    text: Ou “localidades”. O termo grego se refere às comunidades ou aos lugares onde o povo morava.
    reason: lexical_alternative
  - marker: c
    text: A expressão grega final é condensada, literalmente “tendo tomado tempo”; o sentido parece ser que cada caso deveria comparecer num tempo marcado.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ δύο
  choice: nem em dois dias
  rationale: A expressão grega é elíptica e retoma o contexto temporal da passagem. “Nem em dois dias” preserva a ligação com a oração anterior e explicita apenas o substantivo subentendido.
- source_word: ἐπὶ πλεῖον
  choice: gravemente
  rationale: Com ἡμάρτομεν, indica a grande extensão ou gravidade do pecado, não uma mera comparação quantitativa.
- source_word: ἡμάρτομεν
  choice: pecamos
  rationale: Mantém diretamente a força moral e religiosa do verbo grego, sem reduzi-lo a simples erro administrativo.
- source_word: ἐν τούτοις
  choice: nessas questões
  rationale: O demonstrativo remete aos casamentos discutidos no contexto; “questões” é natural sem inserir explicação interpretativa no texto.
- source_word: στήτωσαν
  choice: permaneçam de pé
  rationale: Conserva a imagem literal de “estar de pé”, deixando aberta a possível nuance de assumir posição ou função oficial.
- source_word: οἱ προηγούμενοι τοῦ πλήθους
  choice: os líderes da multidão
  rationale: προηγούμενοι designa os que vão à frente e, por extensão, lideram; πλήθος é o corpo reunido do povo.
- source_word: οἱ ἐκ τῶν κατοικιῶν ἡμῶν
  choice: os que, em nossas povoações
  rationale: κατοικίαι refere-se aos lugares habitados ou comunidades do povo, não apenas a residências individuais.
- source_word: γυναῖκας ἀλλογενεῖς
  choice: mulheres estrangeiras
  rationale: Traduz de modo direto ἀλλογενεῖς, pertencentes a outro povo. O contexto já deixa claro que se trata das mulheres com quem eles se casaram, sem ser necessário substituir “mulheres” por “esposas” no texto.
- source_word: παραγενηθήτωσαν
  choice: venham
  rationale: O verbo significa chegar ou apresentar-se; “venham” é claro e natural no contexto administrativo.
- source_word: λαβόντες χρόνου
  choice: no tempo determinado
  rationale: A frase é comprimida, literalmente relacionada a “tomar/receber tempo”. No contexto, indica comparecimento segundo um tempo atribuído ou marcado.
theological_decisions:
- issue: Caracterização moral da conduta
  choice: pecamos gravemente nessas questões
  alternative: cometemos muito erro nisso
  rationale: O grego emprega o verbo comum para pecar e caracteriza a conduta em termos morais e religiosos. A tradução preserva esse juízo sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução conserva a elipse inicial, a imagem de os líderes permanecerem de pé e a relativa compressão administrativa da frase final; as notas esclarecem sem eliminar a ambiguidade do grego.
