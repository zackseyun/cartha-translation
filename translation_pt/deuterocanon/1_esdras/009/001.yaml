base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/001.yaml
  text: Then Ezra rose up from the court of the temple and went into the chamber of Jona son of Naseib[b][a],
translation:
  language: pt
  text: Então Esdras se levantou do pátio do templo e entrou na câmara de Jonas, filho de Naseibo,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo em Esdras 10:6 traz “Joanã, filho de Eliasibe”; o texto grego aqui traz “Jonas, filho de Naseibo”.
    reason: textual_variant
lexical_decisions:
- source_word: ἀναστὰς
  choice: se levantou
  rationale: O particípio aoristo de ἀνίστημι introduz a ação seguinte; a forma finita produz uma sequência narrativa natural em português.
- source_word: αὐλῆς
  choice: pátio
  rationale: No contexto do complexo do templo, αὐλή designa naturalmente um pátio ou átrio; “pátio” é claro e corrente.
- source_word: τοῦ ἱεροῦ
  choice: do templo
  rationale: ἱερόν refere-se ao complexo do templo, não especificamente ao santuário interior.
- source_word: ἐπορεύθη
  choice: foi
  rationale: Equivalente direto e natural do verbo narrativo de deslocamento.
- source_word: παστοφόριον
  choice: câmara
  rationale: O termo indica um aposento no complexo do templo; “câmara” preserva o caráter arquitetônico e o registro digno.
- source_word: Ἰωνᾶ τοῦ Νασείβου
  choice: Jonas, filho de Naseibo
  rationale: A tradução segue diretamente os nomes preservados no texto grego primário, sem substituí-los silenciosamente pelos nomes diferentes do paralelo hebraico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A vírgula explicativa antes de “filho de Naseibo” favorece a leitura. O ponto foi acrescentado como pontuação editorial, pois o excerto grego termina em vírgula e a frase prossegue no versículo seguinte.
