base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/009/032.yaml
  text: 'And from the sons of Annan: Eliodas[a], Asaiah, Melchiah, Sabbaias, and Simon Chosamaus.'
translation:
  language: pt
  text: 'E, dos filhos de Annan: Eliodas[a], Asaías, Melqueias, Sabaias e Simão Cosamau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns nomes desta lista têm formas correspondentes nas tradições hebraicas de Esdras e Neemias (por exemplo, Annan/Hanã e Sabaias/Sabtai). O texto principal segue as formas gregas de 1 Esdras; os paralelos hebraicos servem apenas para conferência.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém o conectivo simples que dá continuidade à enumeração.
- source_word: ἐκ τῶν υἱῶν
  choice: dos filhos de
  rationale: Expressa de modo natural em português a pertença ao grupo familiar indicada por ἐκ, preservando a estrutura genealógica da lista.
- source_word: Ἀννὰν
  choice: Annan
  rationale: Transliteração direta da forma grega, testemunho primário de 1 Esdras; evita substituir silenciosamente pelo equivalente hebraico Hanã.
- source_word: Ἐλιωδὰς
  choice: Eliodas
  rationale: Reproduz de perto os sons e as vogais visíveis na forma grega.
- source_word: Ἀσαίας
  choice: Asaías
  rationale: Forma portuguesa natural que representa Ἀσαίας e conserva a terminação semítica reconhecível em -ías.
- source_word: Μελχείας
  choice: Melqueias
  rationale: Transliteração legível em português, com qu para representar o som de κ diante de e, sem recorrer à forma mais hebraizante Malquias.
- source_word: Σαββαίας
  choice: Sabaias
  rationale: Segue a forma grega, em vez de impor o equivalente hebraico Sabtai.
- source_word: Σίμων
  choice: Simão
  rationale: Forma bíblica portuguesa corrente do nome grego Σίμων.
- source_word: Χοσάμαος
  choice: Cosamau
  rationale: Adaptação portuguesa próxima da forma grega, com a terminação nominal naturalizada sem depender de um paralelo hebraico incerto.
