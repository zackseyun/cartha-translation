base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/031.yaml
  text: And issue an order that if anyone transgresses any part of what has been written and nullifies it[a], a beam shall be taken from his own property and he shall be hanged on it, and his possessions shall become royal property.
translation:
  language: pt
  text: E ordene-se que, se alguém transgredir qualquer parte do que foi escrito e a invalidar, seja retirada uma viga de sua própria propriedade, e ele seja pendurado nela[a]; e seus bens passem a ser propriedade do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seja empalado nela” ou “seja suspenso nela”. O grego diz literalmente “seja pendurado”, mas a antiga punição descrita pode ter envolvido empalamento ou exposição pública numa viga de madeira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προστάξαι
  choice: ordene-se
  rationale: O infinitivo prossegue a formulação administrativa do decreto; a construção impessoal preserva o tom oficial e injuntivo em português.
- source_word: παραβῶσίν τι τῶν γεγραμμένων
  choice: transgredir qualquer parte do que foi escrito
  rationale: Mantém a força jurídica de παραβαίνω e expressa naturalmente a construção partitiva τι τῶν γεγραμμένων.
- source_word: ἀκυρώσωσιν
  choice: a invalidar
  rationale: O verbo indica tornar sem validade ou efeito; “invalidar” preserva com precisão o sentido jurídico sem acrescentar uma interpretação específica.
- source_word: λημφθῆναι ξύλον
  choice: seja retirada uma viga
  rationale: ξύλον pode designar madeira, peça de madeira ou viga; no contexto da punição, “viga” comunica uma peça estrutural apropriada sem exceder o campo semântico.
- source_word: ἐκ τῶν ἰδίων αὐτοῦ
  choice: de sua própria propriedade
  rationale: A expressão grega é ampla, literalmente proveniente do que lhe pertence; “propriedade” evita restringi-la à casa, detalhe não explícito no texto grego.
- source_word: κρεμασθῆναι
  choice: seja pendurado nela
  rationale: Traduz diretamente o sentido de pendurar ou suspender, preservando em nota a possibilidade histórica de empalamento.
- source_word: τὰ ὑπάρχοντα αὐτοῦ εἶναι βασιλικά
  choice: seus bens passem a ser propriedade do rei
  rationale: Expressa claramente a confiscação dos bens para o domínio régio e soa mais natural em português atual do que uma reprodução adjetival rígida.
theological_decisions:
- issue: Natureza da punição expressa por κρεμασθῆναι no contexto jurídico aquemênida
  choice: seja pendurado nela
  alternative: seja empalado nela; seja suspenso nela
  rationale: O grego denota diretamente o ato de pendurar ou suspender, enquanto o contexto histórico pode apontar para empalamento ou exposição pública. A tradução principal não define além do léxico, e a nota conserva as possibilidades.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formulação jurídica clara. Optou-se por “propriedade do rei” em vez de “propriedade real” para evitar a possível leitura de “real” como “verdadeira”. O marcador [a] aparece no texto principal.
