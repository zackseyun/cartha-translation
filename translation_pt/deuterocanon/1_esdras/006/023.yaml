base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/023.yaml
  text: In the first year of the reign of Cyrus[a], King Cyrus gave orders that the house of the Lord in Jerusalem should be built, where they offer continual sacrifices by fire,
translation:
  language: pt
  text: No primeiro ano do reinado de Ciro, o rei Ciro ordenou que fosse construída a casa do Senhor em Jerusalém, onde se oferecem sacrifícios com fogo contínuo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “onde oferecem sacrifícios continuamente pelo fogo”. A expressão grega é compacta e também pode descrever o lugar como destinado a ofertas regulares feitas pelo fogo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτους πρώτου βασιλεύοντος Κύρου
  choice: No primeiro ano do reinado de Ciro
  rationale: Expressa de modo natural em português a fórmula grega de datação pelo ano régio.
- source_word: βασιλεὺς Κῦρος
  choice: o rei Ciro
  rationale: Conserva explicitamente o título real e segue a ordem idiomática do português.
- source_word: προσέταξεν
  choice: ordenou
  rationale: Transmite diretamente a ordem autoritativa sem especificar, além do grego, que se tratava de um decreto formal.
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: a casa do Senhor
  rationale: Preserva o sentido literal de οἶκος e sua referência contextual ao templo; 'Senhor' representa κύριος no texto grego.
- source_word: τὸν ἐν Ἰερουσαλήμ
  choice: em Jerusalém
  rationale: Localiza a casa de forma concisa e natural.
- source_word: οἰκοδομῆσαι
  choice: que fosse construída
  rationale: O infinitivo apresenta o conteúdo da ordem, tendo a casa como objeto da construção.
- source_word: ὅπου ἐπιθύουσιν διὰ πυρὸς ἐνδελεχοῦς
  choice: onde se oferecem sacrifícios com fogo contínuo
  rationale: Mantém a construção locativa e o sentido cultual de ἐπιθύουσιν, preservando a compactação e a possível ambiguidade da relação entre o fogo e a continuidade.
theological_decisions:
- issue: Tradução de κύριος no contexto do templo
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte primária grega traz κυρίου. 'Senhor' traduz diretamente o termo sem pressupor no texto deuterocanônico grego uma ocorrência imediata do tetragrama.
- issue: Natureza dos sacrifícios e do fogo
  choice: sacrifícios com fogo contínuo
  alternative: sacrifícios contínuos pelo fogo
  rationale: A frase grega é compacta e permite relacionar ἐνδελεχοῦς mais imediatamente a πυρός; a tradução principal conserva essa ligação sem converter a expressão numa categoria sacrificial mais específica.
translation_notes:
  register: Português moderno, digno e acessível, com formulação amplamente compreensível no Brasil e em outros contextos lusófonos. A repetição de “Ciro” foi mantida por estar presente no grego.
