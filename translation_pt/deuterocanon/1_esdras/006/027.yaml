base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/027.yaml
  text: And I also gave orders that it be fully rebuilt[a], and that attention be given so that they may work together with those from the captivity of Judea until the house of the Lord is finished[b];
translation:
  language: pt
  text: E eu também ordenei que se reconstruísse por completo e que se tomassem providências para que trabalhassem juntamente com os que vieram do exílio da Judeia[a], até que a casa do Senhor fosse concluída[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «com os exilados da Judeia». A expressão grega diz literalmente: «os que vieram do cativeiro/exílio da Judeia».'
    reason: lexical_alternative
  - marker: b
    text: O verbo traduzido por «se tomassem providências» significa literalmente «olhar atentamente»; neste contexto, provavelmente tem o sentido administrativo de «providenciar» ou «zelar por».
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δὲ
  choice: Eu também
  rationale: Mantém a continuidade do decreto em primeira pessoa e a força aditiva de κἀγώ, em português natural.
- source_word: ἐπέταξα
  choice: ordenei
  rationale: Expressa diretamente a autoridade do mandado real sem introduzir a noção mais específica de um decreto formal.
- source_word: ὁλοσχερῶς οἰκοδομῆσαι
  choice: que ela fosse inteiramente reconstruída
  rationale: O advérbio indica a conclusão integral da obra. O pronome retoma a construção em pauta no contexto, e o passivo é natural em português.
- source_word: ἀτενίσαι
  choice: que se cuidasse
  rationale: Embora o verbo signifique literalmente olhar atentamente, neste contexto administrativo indica supervisão ou providência cuidadosa.
- source_word: ἵνα συνποιῶσιν
  choice: para que colaborassem
  rationale: Preserva a ideia de agir ou trabalhar em conjunto, sem especificar além do grego a forma da ajuda.
- source_word: τοῖς ἐκ τῆς αἰχμαλωσίας τῆς Ἰουδαίας
  choice: com os que vieram do cativeiro da Judeia
  rationale: Segue de perto a descrição grega e deixa explícita, de modo natural, a procedência dos participantes.
- source_word: μέχρι τοῦ ἐπιτελεσθῆναι
  choice: até que ... fosse concluída
  rationale: Marca a duração da colaboração até o término da obra.
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: a casa do Senhor
  rationale: Conserva a imagem de οἶκος e traduz κύριος conforme o texto grego, sem substituir a expressão por 'templo'.
theological_decisions:
- issue: Tradução de κύριος na expressão referente ao santuário
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte primária grega traz κυρίου. Como não há aqui uma ocorrência direta do tetragrama hebraico no texto-base, 'Senhor' é a forma mais fiel e não impõe uma retroversão.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe administrativa clara. A construção impessoal “que se cuidasse” preserva a indeterminação do agente no encadeamento grego; “casa do Senhor” mantém a metáfora bíblica tradicional.
