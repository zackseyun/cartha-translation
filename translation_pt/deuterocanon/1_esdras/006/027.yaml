  - severity: low
    issue: A locução «que se cuidasse para que» é pouco idiomática no português internacional contemporâneo.
    rationale: «Que se tomassem providências para que» transmite naturalmente a ideia de atenção/supervisão administrativa de ἀτενίσαι e mantém o sentido cooperativo de ἵνα συνποιῶσιν.
