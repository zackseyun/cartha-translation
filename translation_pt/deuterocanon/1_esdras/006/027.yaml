revisions:
- from: Eu também ordenei que ela fosse inteiramente reconstruída e que se cuidasse para que colaborassem com os que vieram do cativeiro da Judeia[a], até que a casa do Senhor fosse concluída.
  to: E eu também ordenei que se reconstruísse por completo e que se tomassem providências para que trabalhassem juntamente com os que vieram do exílio da Judeia[a], até que a casa do Senhor fosse concluída[b].
  rationale: A revisão elimina o pronome sem antecedente, melhora a fluência da formulação administrativa e acrescenta uma nota para ἀτενίσαι, cuja imagem literal não se transfere naturalmente para a construção portuguesa. Mantêm-se a elipse quanto ao objeto da reconstrução, a colaboração com os retornados do exílio, a designação «casa do Senhor» e a oração temporal do grego.
  reviewer_model: gpt-5.6-terra
