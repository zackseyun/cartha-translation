  source_fidelity: 'A tradução mantém adequadamente «a casa», o aspecto imperfeito/passivo de οἰκοδομεῖτο e a conclusão passiva. Contudo, «muitos anos antes por» fica sintaticamente mal articulado em português e não expõe de modo seguro a construção grega difícil: ἔμπροσθεν ἐτῶν πλειόνων tem força temporal, enquanto διὰ βασιλέως pode ser instrumental, mas a relação precisa entre as expressões é comprimida e disputada.'
  naturalness: «Vinha sendo construída» é natural e expressa bem o processo em curso. A sequência «vinha sendo construída muitos anos antes por» soa truncada; a pontuação e a formulação «muitos anos antes, por meio de» tornam a frase compreensível sem resolver artificialmente a ambiguidade temporal.
  terminology: «Casa» com nota explicativa para o templo é apropriado. «Grande e poderoso rei de Israel» é fiel e idiomático. «Por meio de» representa o possível valor mediador/instrumental de διά sem atribuir ao rei, de forma excessivamente explícita, a autoria exclusiva da obra.
