base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/013.yaml
  text: And the house was being built over many years before the time of a great and mighty king of Israel[b][a], and it was completed.
translation:
  language: pt
  text: E a casa[b] vinha sendo construída muitos anos antes, por meio de um grande e poderoso rei de Israel[a], e foi concluída.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «antes do tempo de um grande e poderoso rei de Israel». O grego é condensado: «muitos anos antes» tem valor temporal, e «por meio de» também pode ser entendido em sentido instrumental.'
    reason: alternative_reading
  - marker: b
    text: Aqui, «a casa» se refere ao templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομεῖτο
  choice: vinha sendo construída
  rationale: O imperfeito passivo apresenta a construção como um processo em andamento; a locução portuguesa conserva esse aspecto e prepara naturalmente o contraste com «foi concluída».
- source_word: ὁ οἶκος
  choice: a casa
  rationale: Mantém o sentido literal e o modo bíblico de designar o santuário; uma nota esclarece que, no contexto, se trata do templo.
- source_word: ἔμπροσθεν ἐτῶν πλειόνων
  choice: muitos anos antes
  rationale: A expressão tem valor temporal e aponta para um passado remoto. Esta formulação é corrente em português e evita acrescentar elementos que não aparecem explicitamente no grego.
- source_word: διὰ βασιλέως τοῦ Ἰσραὴλ μεγάλου καὶ ἰσχυροῦ
  choice: por um grande e poderoso rei de Israel
  rationale: διά com genitivo admite naturalmente valor instrumental ou de agência. A tradução preserva essa leitura direta, provavelmente alusiva ao rei responsável pela primeira construção, sem identificar o rei pelo nome.
- source_word: ἐπετέλεσθη
  choice: foi concluída
  rationale: Expressa de modo claro e digno a ação passiva de levar a obra ao término.
theological_decisions:
- issue: Referente de «a casa»
  choice: Manter «a casa» no texto e esclarecer em nota que se refere ao templo.
  alternative: Traduzir diretamente como «o templo».
  rationale: A opção conserva o léxico e a imagem do texto grego sem deixar o leitor moderno sem esclarecimento.
- issue: Sentido da oração com o rei de Israel
  choice: 'Entender διά em sentido instrumental: «por um grande e poderoso rei de Israel».'
  alternative: 'Entender a oração em sentido temporal-histórico: «antes do tempo de um grande e poderoso rei de Israel».'
  rationale: O valor instrumental é o uso mais direto de διά com genitivo e produz uma referência histórica coerente à construção anterior do templo. Como a sintaxe transmitida é comprimida e admite a leitura temporal adotada por alguns, essa possibilidade é registrada em nota, sem identificar dogmaticamente o rei.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservou-se «casa» como expressão bíblica, e «vinha sendo construída» reproduz o aspecto progressivo sem tornar a frase excessivamente técnica.
