  - severity: medium
    issue: A nota apresenta a leitura temporal como simples alternativa, mas o texto principal e a nota não deixam clara a ambiguidade sintática global.
    rationale: O próprio testemunho grego permite tanto perceber διά como instrumental quanto procurar uma relação temporal mais ampla. Uma nota mais neutra registra isso sem privilegiar indevidamente uma reconstrução.
