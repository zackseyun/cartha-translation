- from: E a casa[b] vinha sendo construída muitos anos antes por um grande e poderoso rei de Israel[a], e foi concluída.
  to: E a casa[b] vinha sendo construída muitos anos antes, por meio de um grande e poderoso rei de Israel[a], e foi concluída.
