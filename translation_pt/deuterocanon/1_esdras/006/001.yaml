base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/001.yaml
  text: In the second year of the reign of Darius[a], Haggai and Zechariah son of Iddo, the prophets, prophesied to the Jews who were in Judea and Jerusalem in the name of the Lord God of Israel[c][b], to them.
translation:
  language: pt
  text: No segundo ano do reinado de Dario, os profetas[a] Ageu e Zacarias, filho de Ido, profetizaram aos judeus que estavam na Judeia[b] e em Jerusalém, em nome do Senhor Deus de Israel, sobre eles.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego repete o artigo antes de “profetas” (“os os profetas”), provavelmente por uma irregularidade de cópia ou transmissão. A tradução apresenta o sentido pretendido.
    reason: textual_variant
  - marker: b
    text: Ou “em Judá”, seguindo mais de perto o paralelo semítico; o texto grego diz “na Judeia”.
    reason: lexical_alternative
  - marker: c
    text: A expressão final “sobre eles” também pode ser entendida como “a respeito deles” ou, neste contexto, “a eles”. Tanto o grego como o paralelo semítico preservam essa formulação condensada.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν δὲ τῷ δευτέρῳ ἔτει τῆς Δαρείου βασιλείας
  choice: No segundo ano do reinado de Dario
  rationale: A expressão temporal é vertida diretamente; δέ tem aqui leve força conectiva e não exige uma conjunção explícita em português. βασιλεία designa o período do reinado.
- source_word: Ἀγγαῖος καὶ Ζαχαρίας ὁ τοῦ Ἐδδεὶν
  choice: Ageu e Zacarias, filho de Ido
  rationale: Empregam-se as formas bíblicas portuguesas usuais dos nomes. O patronímico singular modifica naturalmente Zacarias, em concordância com o paralelo semítico.
- source_word: οἱ οἱ προφῆται
  choice: os profetas
  rationale: O artigo duplicado no texto grego é tratado como irregularidade de transmissão; o substantivo plural funciona como identificação apositiva de Ageu e Zacarias.
- source_word: ἐπροφήτευσεν ἐπὶ τοὺς Ἰουδαίους
  choice: profetizaram aos judeus
  rationale: Embora o verbo grego esteja no singular, seu sujeito composto requer plural natural em português. Com verbo de fala profética, ἐπί indica aqui a comunidade à qual a mensagem foi dirigida, não necessariamente hostilidade.
- source_word: τοὺς ἐν τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: que estavam na Judeia e em Jerusalém
  rationale: Judeia segue diretamente o topônimo grego Ἰουδαία; a preposição é repetida em português para dar clareza à coordenação dos lugares.
- source_word: ἐπὶ τῷ ὀνόματι Κυρίου θεοῦ Ἰσραήλ
  choice: em nome do Senhor, Deus de Israel
  rationale: A expressão indica autoridade profética. A aposição sem artigo antes de θεοῦ é naturalmente expressa como “Senhor, Deus de Israel”.
- source_word: ἐπ’ αὐτούς
  choice: sobre eles
  rationale: A formulação conserva a expressão final comprimida do grego e sua correspondência com o paralelo semítico, sem decidir se denota autoridade sobre eles, referência a eles ou direção da mensagem a eles.
theological_decisions:
- issue: Tradução de Κυρίου no contexto das Escrituras judaicas em grego
  choice: Senhor
  alternative: SENHOR; Soberano
  rationale: O texto-base grego traz Κυρίου. “Senhor” é a equivalência direta e tradicional, sem converter retroativamente o termo grego na representação tipográfica reservada a uma tradução direta do tetragrama hebraico.
- issue: Relação profética expressa pelas duas ocorrências de ἐπί
  choice: profetizaram aos judeus ... sobre eles
  alternative: profetizaram contra os judeus; profetizaram a respeito deles; profetizaram para eles
  rationale: A primeira ocorrência é expressa de modo natural como indicação dos destinatários. A segunda permanece mais formal para preservar a repetição e a ambiguidade do original, sem transformar a profecia em denúncia hostil nem definir em excesso o alcance da comissão.
translation_notes:
  register: Português moderno, digno e acessível, com formas nominais bíblicas correntes no Brasil e amplamente reconhecíveis no mundo lusófono. A sintaxe foi tornada natural sem eliminar a ambiguidade da frase final.
