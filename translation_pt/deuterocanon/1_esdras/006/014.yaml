base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/014.yaml
  text: And because our fathers[a], having provoked him, sinned against the Lord of Israel, the heavenly One, he gave them into the hands of Nebuchadnezzar king of Babylon, king of the Chaldeans;
translation:
  language: pt
  text: E, visto que nossos antepassados, tendo-o provocado, pecaram contra o Senhor de Israel, o Celestial[a], ele os entregou nas mãos de Nabucodonosor, rei da Babilônia, rei dos caldeus;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Deus do céu”. O grego diz literalmente “o Celestial”, enquanto a tradição relacionada de Esdras muitas vezes usa o título mais completo “Deus do céu”.'
    reason: Registra uma alternativa apoiada pela tradição paralela sem apagar a formulação distintiva da fonte grega.
lexical_decisions:
- source_word: ἐπεὶ
  choice: visto que
  rationale: Expressa a relação causal do grego com naturalidade em português, sem transformar a oração em mera indicação temporal.
- source_word: οἱ πατέρες ἡμῶν
  choice: nossos antepassados
  rationale: Comunica o sentido histórico e comunitário da expressão em português atual; evita que “nossos pais” seja entendido apenas como a geração imediatamente anterior.
- source_word: παραπικράναντες
  choice: tendo-o provocado
  rationale: Preserva a construção participial e o sentido de provocar ou exasperar a Deus; o pronome retoma antecipadamente o Senhor mencionado em seguida.
- source_word: ἥμαρτον εἰς τὸν κύριον τοῦ Ἰσραὴλ
  choice: pecaram contra o Senhor de Israel
  rationale: “Pecaram contra” é a formulação idiomática adequada para ἁμαρτάνω com εἰς neste contexto; “Senhor de Israel” segue o texto grego sem acrescentar “Deus”.
- source_word: τὸν οὐράνιον
  choice: o Celestial
  rationale: O adjetivo substantivado está em aposição a “Senhor de Israel”. A tradução mantém a forma concisa e incomum do grego, em vez de importar para o texto principal o título mais desenvolvido “Deus do céu”.
- source_word: παρέδωκεν αὐτοὺς εἰς χεῖρας
  choice: ele os entregou nas mãos de
  rationale: Reproduz com clareza a imagem idiomática de serem postos sob o poder de um inimigo.
- source_word: Ναβουχοδονοσόρ
  choice: Nabucodonosor
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: βασιλέως Βαβυλῶνος, βασιλέως τῶν Χαλδαίων
  choice: rei da Babilônia, rei dos caldeus
  rationale: Mantém os dois títulos reais repetidos no grego e sua relação apositiva.
theological_decisions:
- issue: O título divino τὸν οὐράνιον em aposição a “Senhor de Israel”
  choice: o Celestial
  alternative: o Deus do céu
  rationale: A fonte grega primária traz o adjetivo substantivado “o Celestial”, não a expressão completa “o Deus do céu”. A alternativa, conhecida da tradição relacionada de Esdras, é registrada em nota sem substituir a leitura grega.
- issue: Tradução de κύριος
  choice: Senhor
  alternative: SENHOR
  rationale: “Senhor” traduz diretamente κύριος e não força a identificação gráfica com o Tetragrama, que não aparece na fonte grega apresentada.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência brasileira em “Babilônia”. “Antepassados” oferece clareza contemporânea; “o Celestial” conserva deliberadamente a formulação elevada e incomum do original. A pontuação final mantém o ponto e vírgula da unidade grega, que continua no contexto.
