base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/025.yaml
  text: And the holy vessels of the house of the Lord[a], both the gold and the silver ones, which Nebuchadnezzar carried out from the house in Jerusalem and took to Babylon, are to be restored to the house in Jerusalem where they were placed[b], so that they may be set there.
translation:
  language: pt
  text: E os utensílios sagrados da casa do Senhor[a], tanto os de ouro como os de prata, que Nabucodonosor retirou da casa em Jerusalém e levou para a Babilônia, devem ser restituídos à casa em Jerusalém[b], onde estavam colocados, para que sejam postos ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “objetos sagrados”. A expressão grega se refere aos utensílios do templo consagrados ao uso sagrado.
    reason: lexical_alternative
  - marker: b
    text: Isto é, na casa do Senhor, o templo.
    reason: referent_clarification
lexical_decisions:
- source_word: ἱερὰ σκεύη
  choice: utensílios sagrados
  rationale: A expressão designa objetos dedicados ao uso no templo. “Utensílios” abrange recipientes e outros implementos sem especificar indevidamente sua forma, e “sagrados” comunica sua consagração.
- source_word: οἴκου Κυρίου
  choice: casa do Senhor
  rationale: Preserva a imagem literal de οἶκος e sua ressonância cultual; no contexto, a expressão se refere ao templo.
- source_word: τά τε χρυσᾶ καὶ ἀργυρᾶ
  choice: tanto os de ouro como os de prata
  rationale: Os adjetivos substantivados retomam “utensílios”; a formulação portuguesa torna essa referência explícita de modo natural.
- source_word: ἐξήνεγκεν
  choice: retirou
  rationale: Comunica o movimento para fora da casa em Jerusalém sem produzir a possível ambiguidade idiomática de “levou para fora”.
- source_word: ἀπήνεγκεν εἰς Βαβυλῶνα
  choice: levou para a Babilônia
  rationale: Expressa com naturalidade a transferência concluída de Jerusalém para a Babilônia.
- source_word: ἀποκατασταθῆναι
  choice: devem ser restituídos
  rationale: No contexto do decreto, o infinitivo indica que os objetos devem retornar ao lugar que lhes é próprio; “restituídos” conserva esse sentido mais forte do que apenas “devolvidos”.
- source_word: οὗ ἦν κείμενα
  choice: onde estavam colocados
  rationale: Mantém o valor durativo do imperfeito ἦν e traduz κείμενα idiomaticamente como a localização dos utensílios, sem impor um mais-que-perfeito.
- source_word: ὅπως τεθῇ ἐκεῖ
  choice: para que sejam postos ali
  rationale: Preserva a finalidade da oração. Embora τεθῇ esteja no singular, o referente contextual é o conjunto dos utensílios, para o qual o plural é natural em português.
- source_word: Ναβουχοδονοσόρ
  choice: Nabucodonosor
  rationale: É a forma tradicional e amplamente reconhecida do nome em português bíblico.
theological_decisions:
- issue: Tradução de κύριος na expressão referente ao templo
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte grega traz Κυρίου. “Senhor” segue diretamente o texto grego e evita introduzir tipograficamente o tetragrama hebraico onde ele não aparece na fonte primária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura coordenada do grego foi preservada, mas ajustada à sintaxe natural do português; “casa do Senhor” mantém a linguagem bíblica sem obscurecer o referente.
