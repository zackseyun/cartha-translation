revisions:
- from: E ele recebeu a ordem de levar de volta todos esses utensílios[a], colocá-los no templo em Jerusalém e fazer com que o templo do Senhor fosse construído em seu próprio local.
  to: E ele recebeu ordem de levar de volta todos estes utensílios[a], de colocá-los no templo em Jerusalém e de que o templo do Senhor fosse construído em seu local.
  rationale: A revisão elimina a nuance causativa acrescentada por “fazer com que”, preservando a voz passiva do grego para a construção do templo. Também remove a ênfase não expressa em “próprio”, sem alterar o sentido locativo, e ajusta a coordenação sintática da ordem.
