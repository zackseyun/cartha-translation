base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/018.yaml
  text: And he was commanded to bring back all these vessels[a], to put them in the temple in Jerusalem, and that the temple of the Lord should be built on its site.
translation:
  language: pt
  text: E ele recebeu ordem de levar de volta todos estes utensílios[a], de colocá-los no templo em Jerusalém e de que o templo do Senhor fosse construído em seu local.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “transportar de volta todos estes utensílios [...] e reconstruir o templo do Senhor em seu lugar”. A redação grega permite pequenas diferenças na expressão da devolução dos utensílios e da localização da obra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετάγη αὐτῷ
  choice: ele recebeu a ordem
  rationale: Expressa com naturalidade o aoristo passivo e o destinatário indicado pelo dativo, sem identificar quem deu a ordem.
- source_word: ἀπήνεγκεν
  choice: levar de volta
  rationale: No contexto, os utensílios anteriormente retirados devem retornar a Jerusalém; a formulação preserva tanto o deslocamento quanto a ideia de restituição.
- source_word: σκεύη
  choice: utensílios
  rationale: Em português atual, designa com clareza os objetos usados no serviço do templo, evitando o sentido moderno mais restrito de 'vasos'.
- source_word: ἀποθεῖναι
  choice: colocá-los
  rationale: Verbo direto e natural para depositar os utensílios no templo; o pronome explicita o objeto já mencionado.
- source_word: ναός
  choice: templo
  rationale: É a designação portuguesa mais clara e estabelecida para o edifício sagrado de Jerusalém neste contexto.
- source_word: κυρίου
  choice: do Senhor
  rationale: Mantém a forma tradicional e contextual para κύριος quando se refere ao Deus de Israel.
- source_word: οἰκοδομηθῆναι
  choice: fosse construído
  rationale: Preserva a voz passiva e não acrescenta explicitamente o prefixo 're-', embora a reconstrução seja sugerida pelo contexto.
- source_word: ἐπὶ τοῦ τόπου
  choice: em seu próprio local
  rationale: Comunica que o templo deveria ser erguido no local que lhe pertencia, preservando o valor locativo sem uma expressão pouco natural.
theological_decisions:
- issue: Tradução de κύριος no contexto do templo
  choice: Senhor
  alternative: SENHOR
  rationale: O grego traz κύριος, não o nome divino em hebraico; 'Senhor' traduz diretamente o testemunho grego sem retroverter ou impor uma forma tipográfica não presente.
- issue: Construção ou reconstrução do templo
  choice: fosse construído
  alternative: fosse reconstruído
  rationale: A forma grega significa literalmente construir ou edificar. O contexto permite entender reconstrução, mas a tradução principal mantém a formulação menos interpretativa.
translation_notes:
  register: Português contemporâneo, digno e acessível, com sintaxe natural. A tradução conserva o caráter oficial da ordem, a passividade da construção do templo e a possível nuance de restituição indicada pelo contexto.
