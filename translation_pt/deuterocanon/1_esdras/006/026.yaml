base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/026.yaml
  text: He also ordered Sisinnes[a], governor of Syria and Phoenicia, and Sathrabuzanes and their associates and the appointed governors in Syria and Phoenicia, to keep away from the place, but to leave Zerubbabel, the servant of the Lord and governor of Judea, and the elders of the Jews alone.
translation:
  language: pt
  text: Também ordenou a Sisines, governador da Síria e da Fenícia, a Satrabuzanes, aos seus respectivos associados e aos governadores designados na Síria e na Fenícia que se mantivessem afastados daquele lugar e deixassem Zorobabel, servo do Senhor e governador da Judeia, e os anciãos dos judeus em paz[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «permitissem que Zorobabel, servo do Senhor e governador da Judeia, e os anciãos dos judeus prosseguissem». O verbo grego pode significar «deixar» ou «permitir» e, neste contexto, indica não interferência oficial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσετάξεν ... ἐπιμεληθῆναι
  choice: ordenou ... que
  rationale: A construção expressa uma determinação oficial; a formulação evita reproduzir de modo artificial os dois verbos gregos e mantém a força diretiva.
- source_word: ἐπάρχῳ
  choice: governador
  rationale: Designa um administrador provincial; «governador» é claro e natural no contexto.
- source_word: συνεταίροις
  choice: associados
  rationale: No contexto administrativo, refere-se aos que atuavam com os oficiais, não necessariamente a companheiros pessoais.
- source_word: ἀποτεταγμένοις ... ἡγεμόσιν
  choice: governadores designados
  rationale: Preserva tanto a ideia de nomeação ou designação quanto a função governamental.
- source_word: ἀπέχεσθαι τοῦ τόπου
  choice: se mantivessem afastados daquele lugar
  rationale: Conserva a imagem espacial do grego e, no contexto, comunica a exigência de não interferência.
- source_word: ἐᾶσαι
  choice: deixassem ... prosseguir
  rationale: O verbo pode significar deixar ou permitir. «Deixassem ... prosseguir» explicita de forma natural a não interferência sem definir além do contexto o objeto da atividade.
- source_word: παῖδα Κυρίου
  choice: servo do Senhor
  rationale: παῖς pode significar criança ou servo, mas aqui funciona como designação honorífica; «servo do Senhor» é a leitura contextual mais adequada.
- source_word: ὕπαρχον
  choice: governador
  rationale: Denota alguém investido de autoridade regional; o equivalente é inteligível e apropriado ao cenário administrativo.
- source_word: πρεσβυτέρους
  choice: anciãos
  rationale: Refere-se aos líderes reconhecidos da comunidade judaica, conforme o uso bíblico corrente.
theological_decisions:
- issue: Tradução de κύριος em παῖδα Κυρίου
  choice: Senhor
  alternative: senhor; soberano
  rationale: «Senhor» preserva o peso reverencial da expressão no contexto das Escrituras judaicas.
- issue: Sentido de παῖς aplicado a Zorobabel
  choice: servo
  alternative: filho; criança
  rationale: A expressão é honorífica e relacional, não uma indicação de idade ou filiação biológica.
- issue: Alcance de ἐᾶσαι
  choice: deixassem ... prosseguir
  alternative: deixassem ... em paz
  rationale: A formulação conserva o sentido de permissão e não interferência, sem resolver indevidamente o que exatamente os líderes deveriam continuar fazendo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Os nomes próprios seguem formas bíblicas portuguesas usuais; «Judeia» é grafado sem acento conforme a ortografia vigente.
