base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/022.yaml
  text: 'Then King Darius ordered a search to be made in the archives kept in Babylon[a], and in Ecbatana, the fortress in the land of Media[b], a scroll was found in which these things had been recorded:'
translation:
  language: pt
  text: 'Então o rei Dario ordenou que se procurasse nos arquivos guardados na Babilônia e, em Ecbátana, na fortaleza[a] situada na região da Média, encontrou-se um local em que estava registrado o seguinte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a cidadela”. O termo grego se refere ao centro fortificado e administrativo de Ecbátana.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέταξεν
  choice: ordenou
  rationale: Expressa de modo natural a ordem oficial e autoritativa emitida pelo rei.
- source_word: ἐπισκέψασθαι
  choice: que se fizesse uma busca
  rationale: No contexto dos arquivos reais, o infinitivo indica uma investigação ou busca oficial, não apenas uma inspeção visual.
- source_word: βιβλιοφυλακίοις
  choice: arquivos
  rationale: Refere-se ao depósito de documentos oficiais; “arquivos” é mais preciso no contexto do que “bibliotecas”.
- source_word: τοῖς κειμένοις
  choice: guardados
  rationale: Indica que os arquivos ou documentos estavam armazenados na Babilônia; “guardados” é corrente e natural.
- source_word: Ἐκβατάνοις
  choice: Ecbátana
  rationale: Forma portuguesa tradicional e reconhecível do topônimo.
- source_word: τῇ βάρει
  choice: a fortaleza
  rationale: Designa o centro fortificado de Ecbátana; “cidadela” também é possível.
- source_word: ἐν Μηδείᾳ χώρᾳ
  choice: situada na região da Média
  rationale: χώρα denota terra ou região; “região” evita especificar indevidamente uma divisão administrativa formal.
- source_word: τόπος
  choice: um registro
  rationale: Embora o sentido literal seja “um lugar”, no contexto da busca arquivística a expressão aponta para o registro localizado; a formulação literal é preservada em nota.
- source_word: ὑπομνημάτιστο τάδε
  choice: no qual constava o seguinte
  rationale: Introduz de maneira clara e documental o conteúdo do memorando ou registro que vem a seguir.
