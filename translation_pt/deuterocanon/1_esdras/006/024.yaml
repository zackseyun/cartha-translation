base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/024.yaml
  text: Let them offer sacrifices with continual fire, whose height is sixty cubits and width sixty cubits, with three courses of polished stone and one course of new local timber; and let the expense be given from the house of Cyrus the king.
translation:
  language: pt
  text: 'Que ofereçam sacrifícios com fogo contínuo. Sua altura: sessenta côvados; sua largura: sessenta côvados,[a] com três fiadas de pedras lavradas e uma fiada de madeira nova da região; e que a despesa seja paga pelo tesouro do rei Ciro.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego passa de modo abrupto dos sacrifícios às dimensões, sem identificar claramente aquilo cuja altura e largura são medidas.
    reason: Registra uma dificuldade textual e sintática genuína sem resolvê-la silenciosamente.
  - marker: b
    text: Literalmente, “da casa do rei Ciro”, expressão que aqui se refere ao tesouro ou aos recursos da casa real.
    reason: Explica a equivalência contextual usada no texto principal.
lexical_decisions:
- source_word: θύουσιν
  choice: Que ofereçam sacrifícios
  rationale: O verbo significa sacrificar/oferecer sacrifícios; o contexto de decreto favorece a forma jussiva em português.
- source_word: πυρὸς ἐνδελεχοῦς
  choice: fogo contínuo
  rationale: Preserva a ideia de um fogo mantido sem interrupção, sem acrescentar uma interpretação ritual específica.
- source_word: δόμων λιθίνων ξυστῶν τριῶν
  choice: três fiadas de pedras lavradas
  rationale: δόμος designa aqui uma camada ou fiada de construção, e ξυστός indica pedra trabalhada/lavrada.
- source_word: δόμου ξυλίνου ἐγχωρίου καινοῦ ἑνός
  choice: uma fiada de madeira nova da região
  rationale: 'Mantém os elementos do grego: uma camada construtiva, madeira nova e origem local.'
- source_word: ἐκ τοῦ οἴκου Κύρου τοῦ βασιλέως
  choice: pelo tesouro do rei Ciro
  rationale: Embora οἶκος seja literalmente 'casa', no contexto administrativo indica os recursos da casa real, expressos naturalmente como tesouro.
theological_decisions:
- issue: Relação sintática entre os sacrifícios e as dimensões
  choice: Separar as orações e manter o referente implícito em 'sua altura'
  alternative: Ligar diretamente as dimensões aos sacrifícios mediante 'cuja altura'
  rationale: O texto grego apresenta uma transição sintaticamente difícil e um relativo de concordância problemática. A tradução não atribui absurdamente altura e largura aos sacrifícios, mas também não introduz no corpo do texto um substantivo ausente.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário de construção compreensível. A pontuação suaviza a sintaxe grega fragmentária, enquanto a nota preserva sua ambiguidade.
