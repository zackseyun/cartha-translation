base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/019.yaml
  text: Then Sanabassar came and laid the foundations of the house of the Lord in Jerusalem[a], and from that time until now it has been under construction and has not reached completion.
translation:
  language: pt
  text: Então Sanabassar chegou e lançou os alicerces da casa do Senhor em Jerusalém[a]; desde aquele tempo até agora, ela vem sendo construída, mas ainda não foi concluída.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sanabassar é geralmente identificado com Sesbazar na tradição de Esdras.
    reason: Registra a identificação tradicional com a forma diferente do nome sem substituir a leitura grega no texto principal.
lexical_decisions:
- source_word: Σαναβάσσαρος
  choice: Sanabassar
  rationale: O nome pessoal é transliterado diretamente da forma grega, sem substituí-la pela forma associada à tradição de Esdras.
- source_word: παραγενόμενος
  choice: chegou
  rationale: Expressa de modo natural a chegada que antecede a ação principal.
- source_word: εἰσεβάλλετο τοὺς θεμελίους
  choice: lançou os alicerces
  rationale: Reproduz o sentido arquitetônico da expressão grega em português corrente e digno; o imperfeito pode apresentar a ação no curso da narrativa, sem exigir uma formulação artificial.
- source_word: τοῦ οἴκου Κυρίου
  choice: da casa do Senhor
  rationale: Preserva o idioma bíblico próximo ao grego, sem explicitar interpretativamente 'templo'.
- source_word: τοῦ ἐν Ἰερουσαλήμ
  choice: em Jerusalém
  rationale: A forma concisa comunica naturalmente a localização da casa.
- source_word: ἀπ᾽ ἐκείνου μέχρι τοῦ νῦν
  choice: desde aquele tempo até agora
  rationale: Mantém a extensão temporal contínua indicada pelo grego.
- source_word: οἰκοδομουμένου
  choice: ela vem sendo construída
  rationale: Expressa em português natural o processo contínuo de construção até o momento referido.
- source_word: οὐκ ἔλαβεν συντέλειαν
  choice: mas ainda não foi concluída
  rationale: Comunica claramente que a obra não alcançou sua conclusão; 'ainda' explicita o valor contextual da continuidade até o presente, e 'mas' torna natural a relação entre a construção em curso e a falta de conclusão.
theological_decisions:
- issue: Tradução de Κυρίου no contexto da casa divina
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte primária grega traz Κυρίου. Portanto, segue-se 'Senhor', sem retroverter o termo para o nome divino pressuposto em tradições semíticas relacionadas.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação preserva o idioma bíblico 'casa do Senhor', usa 'ela' para retomar a casa/obra sem ambiguidade prática e mantém o contraste entre construção contínua e ausência de conclusão.
