base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/005.yaml
  text: And the elders of the Jews found favor from the Lord[a], having come to oversee the captivity.
translation:
  language: pt
  text: E os anciãos dos judeus receberam favor da parte do Senhor, tendo passado a supervisionar os exilados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo passado a supervisionar o cativeiro”. A frase grega é condensada e também pode indicar que eles foram encarregados dos exilados.'
    reason: A sintaxe de ἐπισκοπῆς γενόμενοι ἐπὶ τὴν αἰχμαλωσίαν e o referente de αἰχμαλωσία admitem mais de uma interpretação.
lexical_decisions:
- source_word: ἔσχον χάριν
  choice: receberam favor
  rationale: A expressão indica alcançar ou receber favor. Em português narrativo, “receberam favor” comunica naturalmente que a benevolência procede do Senhor.
- source_word: ἐπισκοπῆς
  choice: a supervisão
  rationale: O substantivo pode designar supervisão, cuidado ou encargo de fiscalização. “Supervisão” preserva aqui o provável sentido administrativo.
- source_word: γενόμενοι ἐπὶ τὴν αἰχμαλωσίαν
  choice: tendo assumido ... dos exilados
  rationale: A construção comprimida pode indicar que os anciãos passaram a exercer uma função sobre a comunidade ligada ao exílio. A formulação evita sugerir necessariamente deslocamento físico.
- source_word: αἰχμαλωσίαν
  choice: exilados
  rationale: Embora o substantivo denote literalmente “cativeiro” ou “exílio”, neste contexto pode representar coletivamente as pessoas que estiveram no exílio; a nota preserva a leitura mais literal.
- source_word: παρὰ τοῦ κυρίου
  choice: da parte do Senhor
  rationale: παρά com o genitivo marca a origem do favor. “Da parte do Senhor” torna essa relação explícita sem alterar o título grego.
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: os anciãos dos judeus
  rationale: Tradução transparente da estrutura grega, adequada ao papel comunitário dos πρεσβύτεροι e sem reduzir Ἰουδαίων a uma referência apenas territorial.
theological_decisions:
- issue: Tradução de κύριος
  choice: Senhor
  alternative: SENHOR
  rationale: O texto grego traz κύριος; “Senhor” o representa diretamente, sem substituir a forma grega pela convenção tipográfica usada para o nome divino hebraico.
- issue: Referente de αἰχμαλωσία
  choice: exilados
  alternative: cativeiro
  rationale: A referência pessoal é contextualmente plausível e produz português natural, mas a nota registra o valor literal e a ambiguidade da frase grega.
- issue: Sentido de γενόμενοι ἐπὶ
  choice: tendo assumido
  alternative: tendo sido designados
  rationale: A construção pode indicar entrada numa função, mas não explicita com segurança quem efetuou uma nomeação; “assumido” evita acrescentar esse agente.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A formulação principal favorece clareza sem ocultar a ambiguidade do grego, preservada na nota.
