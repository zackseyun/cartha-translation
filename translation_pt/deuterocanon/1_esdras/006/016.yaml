base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/016.yaml
  text: In the first year of Cyrus reigning over the land of Babylonia, King Cyrus wrote that this house should be built,
translation:
  language: pt
  text: No primeiro ano em que Ciro reinava sobre a terra da Babilônia, o rei Ciro escreveu que esta casa fosse construída,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o rei Ciro emitiu uma ordem para que esta casa fosse construída”. O grego diz literalmente “escreveu ... construir esta casa”; no contexto, trata-se de uma ordem real por escrito.'
    reason: lexical_alternative
  - marker: b
    text: “Esta casa” refere-se ao templo em Jerusalém.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν δὲ τῷ πρώτῳ ἔτει βασιλεύοντος Κύρου
  choice: No primeiro ano do reinado de Ciro
  rationale: A construção temporal e o genitivo absoluto são expressos de modo natural em português, preservando a referência ao reinado sem uma formulação participial rígida.
- source_word: χώρας Βαβυλωνίας
  choice: sobre a terra da Babilônia
  rationale: χώρα indica terra ou território, e a preposição “sobre” explicita que o território está sob o governo de Ciro.
- source_word: ἔγραψεν βασιλεὺς Κῦρος
  choice: o rei Ciro escreveu
  rationale: Mantém o verbo simples “escreveu”, sem substituir o texto por um termo administrativo mais específico, e emprega a ordem usual de título e nome em português.
- source_word: οἰκοδομῆσαι τὸν οἶκον τοῦτον
  choice: que esta casa fosse construída
  rationale: A oração completiva comunica naturalmente o conteúdo da ordem escrita e preserva o sentido de que a construção da casa foi autorizada ou determinada.
theological_decisions:
- issue: Referente de “esta casa”
  choice: esta casa
  alternative: este templo
  rationale: O grego emprega οἶκος, “casa”. O contexto identifica a casa como o templo de Jerusalém, mas a formulação cultual do texto é preservada no corpo da tradução.
- issue: Força administrativa do escrito real
  choice: escreveu
  alternative: decretou
  rationale: Embora o contexto seja o de uma determinação real por escrito, ἔγραψεν significa diretamente “escreveu”; a nota registra a alternativa contextual sem reforçar indevidamente o texto principal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A vírgula final foi mantida porque o versículo continua a declaração no contexto imediato.
