base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/030.yaml
  text: so that libations may be offered to God Most High for the king and his sons[b][a], and that they may pray for them.
translation:
  language: pt
  text: para que sejam oferecidas libações[a] ao Deus Altíssimo em favor do rei e de seus filhos, e para que orem por eles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ofertas de bebida”.'
    reason: lexical_alternative
  - marker: b
    text: O grego traz aqui uma expressão elíptica, literalmente “acerca do que é deles”; o sentido provável é que orem em favor do rei e de seus filhos.
    reason: textual_or_grammatical_clarification
lexical_decisions:
- source_word: ὅπως
  choice: para que
  rationale: Introduz uma oração de finalidade e rege naturalmente os dois verbos no subjuntivo.
- source_word: προσφέρωνται
  choice: sejam oferecidas
  rationale: Preserva a forma passiva e o sentido cultual de apresentar uma oferta a Deus.
- source_word: σπονδαὶ
  choice: libações
  rationale: Termo preciso para ofertas líquidas derramadas em contexto cultual; a alternativa mais explicativa fica na nota.
- source_word: τῷ θεῷ τῷ ὑψίστῳ
  choice: ao Deus Altíssimo
  rationale: Mantém explicitamente tanto θεῷ como o título ὑψίστῳ em formulação portuguesa corrente e digna.
- source_word: ὑπὲρ τοῦ βασιλέως καὶ τῶν παίδων
  choice: em favor do rei e de seus filhos
  rationale: ὑπέρ tem aqui sentido benefactivo. No contexto da casa real, 'filhos' é a leitura mais provável de παῖδες, embora o termo possa ser mais amplo.
- source_word: προσεύχωνται
  choice: orem
  rationale: Tradução direta e natural do subjuntivo, coordenado com a primeira oração de finalidade.
- source_word: περὶ τῆς αὐτῶν
  choice: por eles
  rationale: A expressão grega transmitida é elíptica; 'por eles' conserva a referência ao rei e a seus filhos sem acrescentar explicitamente 'bem-estar' ou outro complemento não expresso.
theological_decisions:
- issue: Título divino ὁ ὕψιστος
  choice: Deus Altíssimo
  alternative: o Deus, o Altíssimo
  rationale: A opção mantém o título e sua força teológica sem introduzir uma interpretação doutrinária adicional.
- issue: Objeto da oração na expressão elíptica περὶ τῆς αὐτῶν
  choice: orem por eles
  alternative: orem pelo bem-estar deles
  rationale: A redação escolhida comunica o provável sentido benefactivo, mas evita definir o conteúdo da oração além do que consta no grego preservado; a elipse é informada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Libações” preserva a precisão cultual e recebe explicação em nota; “em favor de” torna explícita a função benefactiva de ὑπέρ sem ampliar o conteúdo. A ambiguidade da frase grega final é preservada por uma tradução contida e esclarecida em nota.
