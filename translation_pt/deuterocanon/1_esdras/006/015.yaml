base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/015.yaml
  text: They also tore down the house and burned it[a], and they took the people captive to Babylon.
translation:
  language: pt
  text: Também derrubaram a casa e a incendiaram[a], e levaram o povo cativo para a Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a casa de Deus, o templo.
    reason: Esclarece o referente contextual de «a casa», preservando no texto principal a expressão literal grega.
lexical_decisions:
- source_word: οἶκον
  choice: a casa
  rationale: Traduz literalmente o grego e preserva o uso bíblico de «casa» para a casa de Deus; uma nota esclarece que se trata do templo.
- source_word: καθελόντες
  choice: derrubaram
  rationale: Expressa de modo natural e direto o ato de demolir ou pôr abaixo.
- source_word: ἐνεπύρισαν
  choice: a incendiaram
  rationale: Representa com precisão o ato de atear fogo, e o pronome retoma claramente «a casa».
- source_word: λαὸν
  choice: o povo
  rationale: É a equivalência coletiva mais direta e corrente para a população mencionada.
- source_word: ᾐχμαλώτευσαν
  choice: levaram ... cativo
  rationale: Preserva tanto a ideia de captura quanto o deslocamento para a Babilônia, sem reduzi-la apenas ao conceito de exílio.
- source_word: εἰς Βαβυλῶνα
  choice: para a Babilônia
  rationale: É a expressão direcional idiomática em português para o destino da deportação.
theological_decisions:
- issue: Referente de «a casa»
  choice: Manter «a casa» no texto principal, entendendo-a como o templo
  alternative: Traduzir diretamente «o templo»
  rationale: O grego emprega οἶκος, «casa». A tradução mantém a formulação da fonte e sua ressonância bíblica, enquanto a nota identifica o referente histórico sem tornar o texto principal mais explícito que o original.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção coordenada acompanha a concisão narrativa do grego; «incendiaram» evita ambiguidade sobre o sentido de «queimar».
