base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/004.yaml
  text: By whose authorization are you building this house and completing this roof and all the rest? And who are the builders carrying out these things?[a][b]
translation:
  language: pt
  text: Com autorização de quem[a] vocês estão construindo esta casa[b], terminando este telhado e todo o restante? E quem são os construtores que estão realizando essas obras?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por ordem de quem...?” O particípio grego pode destacar a ordem ou instrução que deu início à obra.'
    reason: lexical_alternative
  - marker: b
    text: “Casa” refere-se aqui ao templo; a tradução conserva o termo grego comum em vez de substituí-lo pela explicação “templo”.
    reason: cultural_note
lexical_decisions:
- source_word: Τίνος … συντάξαντος
  choice: Com autorização de quem
  rationale: Expressa em português natural a pessoa responsável pela ordem ou autorização que deu origem à obra, preservando o caráter administrativo da pergunta.
- source_word: οἰκοδομεῖτε
  choice: vocês estão construindo
  rationale: O presente progressivo corresponde ao trabalho em andamento no contexto da inspeção, sem acrescentar a ideia não explícita de reconstrução.
- source_word: οἶκον
  choice: casa
  rationale: Mantém o termo grego comum, embora no contexto a referência seja ao templo.
- source_word: στέγην
  choice: telhado
  rationale: É o equivalente corrente e concreto para a cobertura superior de um edifício.
- source_word: τἄλλα πάντα
  choice: todo o restante
  rationale: Preserva de forma idiomática a abrangência da expressão grega, que inclui as demais partes da obra.
- source_word: ἐπιτελεῖτε
  choice: terminando
  rationale: Comunica a ideia de levar a obra à conclusão e evita uma formulação excessivamente literal.
- source_word: οἰκοδόμοι
  choice: construtores
  rationale: Mantém o sentido geral do termo sem especificar indevidamente uma profissão como pedreiros ou carpinteiros.
- source_word: τελοῦντες
  choice: estão realizando
  rationale: Indica a execução efetiva dos trabalhos e evita repetir o verbo usado anteriormente para conclusão.
- source_word: ταῦτα
  choice: essas obras
  rationale: Torna claro em português que o demonstrativo retoma os trabalhos de construção mencionados, sem alterar o referente.
