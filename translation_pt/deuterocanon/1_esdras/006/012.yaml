base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/012.yaml
  text: But they answered us[a], saying, “We are servants of the Lord, who created heaven and earth.”
translation:
  language: pt
  text: 'Mas eles nos responderam[a]: “Somos servos do Senhor, que criou o céu e a terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “filhos do Senhor, que criou o céu e a terra”. A palavra grega pode significar tanto “filhos” como “servos”; neste contexto, “servos” parece mais provável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν ἡμῖν λέγοντες
  choice: eles nos responderam
  rationale: Expressa de modo natural em português a resposta dirigida a “nós”; o sentido discursivo de λέγοντες é adequadamente incorporado pelos dois-pontos antes da fala direta.
- source_word: παῖδες
  choice: servos
  rationale: O termo pode designar filhos ou servos. Neste contexto administrativo, a identificação destaca o serviço e a pertença ao Senhor, sem exigir a nuance mais forte de escravidão.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: Tradução bíblica consagrada de κύριος quando se refere a Deus, preservando sua soberania e a gravidade do texto.
- source_word: τοῦ κτίσαντος
  choice: que criou
  rationale: Reproduz com clareza o particípio que identifica o Senhor por seu ato criador.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: o céu e a terra
  rationale: Mantém a fórmula bíblica que abrange a totalidade da criação e soa natural em português.
theological_decisions:
- issue: Sentido de παῖδες em relação a Deus
  choice: servos
  alternative: filhos
  rationale: A situação de defesa da obra diante de autoridades favorece a ideia de pessoas a serviço de Deus. Como o grego permanece semanticamente ambíguo, a alternativa filial é registrada em nota.
- issue: Tradução de κύριος aplicado a Deus
  choice: Senhor
  alternative: senhor ou soberano
  rationale: “Senhor” preserva o uso bíblico tradicional e expressa adequadamente a soberania divina, sem introduzir interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os dois-pontos substituem naturalmente o particípio λέγοντες antes da citação. A vírgula antes de “que criou” apresenta a oração como explicativa, identificando o Senhor como Criador.
