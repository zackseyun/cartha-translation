base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/010.yaml
  text: Then we questioned these elders[a], saying[b], ‘Who commanded you to build this house and—’
translation:
  language: pt
  text: 'Então interrogamos esses anciãos, dizendo: “Quem lhes deu ordem para construir esta casa[b] e—[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego deste versículo, conforme preservado na edição de Swete, termina abruptamente com “e”, indicando que a frase continua no versículo seguinte. A tradução mantém essa forma inacabada em vez de completá-la.
    reason: textual_variant
  - marker: b
    text: “Esta casa” refere-se ao templo de Jerusalém.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπυνθανόμεθα
  choice: interrogamos
  rationale: O verbo indica a busca de informação; no contexto de uma averiguação oficial, “interrogamos” comunica melhor o caráter formal do ato do que o simples “perguntamos”.
- source_word: τῶν πρεσβυτέρων τούτων
  choice: esses anciãos
  rationale: πρεσβύτεροι designa aqui líderes reconhecidos da comunidade, não apenas homens idosos. “Anciãos” preserva essa função social e institucional.
- source_word: Τίνος ὑμῖν προστάξαντος
  choice: Quem lhes deu ordem
  rationale: A construção pergunta de quem procedia a autorização ou ordem. Esta formulação é natural em português e mantém aberta a natureza exata da autoridade invocada.
- source_word: οἰκοδομεῖτε
  choice: para construir
  rationale: O grego diz literalmente “construir”; embora o contexto possa envolver reconstrução, não se acrescenta essa especificação ausente do texto.
- source_word: τὸν οἶκον τοῦτον
  choice: esta casa
  rationale: οἶκος significa “casa”. No contexto, refere-se ao templo, mas a tradução conserva a expressão grega e esclarece a referência em nota.
- source_word: καὶ
  choice: e—
  rationale: O texto grego fornecido termina abruptamente na conjunção “e”. O travessão sinaliza em português que a frase ficou incompleta sem inventar sua continuação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva-se “casa” como correspondência direta de οἶκος, enquanto a nota identifica o referente. O fim abrupto do testemunho grego é mantido deliberadamente.
