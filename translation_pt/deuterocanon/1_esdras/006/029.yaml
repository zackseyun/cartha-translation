base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/029.yaml
  text: Likewise also wheat and salt and wine and oil continually year by year[a], as the priests in Jerusalem may direct, are to be used up day by day without dispute,
translation:
  language: pt
  text: Da mesma forma, também trigo, sal, vinho e azeite, de modo contínuo, ano após ano, conforme determinarem os sacerdotes que estão em Jerusalém, deverão ser consumidos dia após dia, sem contestação[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem falta” ou “sem questionamento”. O advérbio grego pode ressaltar tanto a ausência de contestação quanto a certeza do cumprimento.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πυρὸν
  choice: trigo
  rationale: Embora a forma impressa possa parecer relacionada a “fogo”, neste contexto e nesta lista de provisões corresponde ao acusativo de πυρός, “trigo”; o sentido concreto é preferível ao mais amplo “cereal”.
- source_word: ἅλα
  choice: sal
  rationale: Equivalente direto e apropriado à lista de provisões para o culto.
- source_word: οἶνον
  choice: vinho
  rationale: Tradução corrente e precisa no contexto de provisões cultuais.
- source_word: ἔλαιον
  choice: azeite
  rationale: No contexto mediterrâneo e cultual, trata-se de azeite de oliva; “azeite” expressa naturalmente esse referente em português.
- source_word: ἐνδελεχῶς
  choice: de modo contínuo
  rationale: Comunica provisão regular e persistente sem exigir a ideia absoluta de ausência de qualquer intervalo.
- source_word: κατʼ ἐνιαυτόν
  choice: ano após ano
  rationale: Preserva o valor distributivo da expressão grega e soa natural em português.
- source_word: ὑπαγορεύσωσιν
  choice: determinarem
  rationale: Expressa que os sacerdotes especificam ou prescrevem o necessário, em registro administrativo digno e natural.
- source_word: ἀναλίσκεσθαι
  choice: deverão ser consumidos
  rationale: O verbo indica que as provisões serão gastas ou utilizadas; “consumidos” mantém o tom formal sem limitar o uso ao ato de comer.
- source_word: καθʼ ἡμέραν
  choice: dia após dia
  rationale: Reproduz o sentido distributivo e recorrente da expressão.
- source_word: ἀναμφισβητήτως
  choice: sem contestação
  rationale: Mantém o sentido lexical de algo não disputado ou não questionado, adequado a uma ordem administrativa, sem eliminar a possível nuance de cumprimento infalível.
