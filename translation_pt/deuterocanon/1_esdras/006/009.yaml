base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/009.yaml
  text: with costly hewn stones[a], with timber laid in the buildings, and those works being done with diligence, and the work prospering in their hands[b], being completed with all glory and care.
translation:
  language: pt
  text: com pedras lavradas de grande valor, com madeira assentada nas construções, e aquelas obras sendo realizadas com diligência[a]; o trabalho prosperava nas mãos deles, e as obras eram concluídas com todo o esplendor[b] e cuidado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com urgência”. A expressão grega também pode destacar rapidez ou empenho intenso.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “esplendor” se refere provavelmente à magnificência da obra, não apenas à honra em sentido abstrato.
    reason: cultural_note
lexical_decisions:
- source_word: λίθων ξυστῶν πολυτελῶν
  choice: pedras lavradas de grande valor
  rationale: ξυστός descreve pedras trabalhadas ou lavradas, e πολυτελής indica alto valor ou grande custo. A expressão é natural no contexto de construção e evita sugerir apenas polimento.
- source_word: ξύλων τιθεμένων ἐν τοῖς οἴκοις
  choice: madeira assentada nas construções
  rationale: ξύλα designa madeira de construção; τιθεμένων indica que era colocada ou assentada; οἴκοις refere-se aqui às estruturas construídas, não necessariamente a casas domésticas.
- source_word: τὰ ἔργα ἐκεῖνα ἐπὶ σπουδῆς γινόμενα
  choice: aquelas obras sendo realizadas com diligência
  rationale: σπουδή pode expressar diligência, empenho ou urgência. “Com diligência” conserva a ideia de execução zelosa sem excluir a possível nuance de rapidez, registrada em nota.
- source_word: εὐοδούμενον τὸ ἔργον ἐν ταῖς χερσὶν αὐτῶν
  choice: o trabalho prosperava nas mãos deles
  rationale: εὐοδόω significa prosperar ou ter bom êxito. A locução “nas mãos deles” preserva a imagem grega de agência e permanece clara em português.
- source_word: ἐν πάσῃ δόξῃ καὶ ἐπιμελείᾳ συντελούμενα
  choice: as obras eram concluídas com todo o esplendor e cuidado
  rationale: No contexto arquitetônico, δόξα aponta naturalmente para esplendor ou magnificência, enquanto ἐπιμέλεια denota cuidado e atenção. O plural “as obras” retoma τὰ ἔργα e corresponde ao particípio plural συντελούμενα.
