base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/003.yaml
  text: At that time Sisinnes[a], the governor of Syria and Phoenicia, was present with them, along with Sathrabuzanes and his associates; and he said to them,
translation:
  language: pt
  text: 'Naquele tempo, Sisines[a], governador da Síria e da Fenícia, estava presente entre eles, juntamente com Satrabuzanes e seus colaboradores; e ele lhes disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega um verbo no singular — “e ele lhes disse” —, referindo-se mais naturalmente a Sisines como o principal porta-voz, embora Satrabuzanes e outros colaboradores o acompanhem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῷ τῷ χρόνῳ
  choice: Naquele tempo
  rationale: Expressão temporal narrativa natural em português, sem intensificar desnecessariamente αὐτῷ.
- source_word: παρῆν πρὸς αὐτούς
  choice: estava presente entre eles
  rationale: Preserva o sentido primário de presença, não de chegada, e verte πρὸς αὐτούς de modo idiomático.
- source_word: Σισίννης
  choice: Sisines
  rationale: Transliteração portuguesa clara e próxima da forma grega.
- source_word: ὁ ἔπαρχος Συρίας καὶ Φοινίκης
  choice: governador da Síria e da Fenícia
  rationale: “Governador” é equivalente acessível para ἔπαρχος; os genitivos indicam os territórios sob sua administração.
- source_word: Σαθραβουζάνης
  choice: Satrabuzanes
  rationale: Transliteração portuguesa direta da forma grega.
- source_word: οἱ συνέταιροι
  choice: seus colaboradores
  rationale: No contexto administrativo, “colaboradores” comunica associados ou colegas sem sugerir necessariamente sócios comerciais; o possessivo permanece naturalmente ambíguo quanto ao grupo dos oficiais mencionados.
- source_word: καὶ εἶπεν αὐτοῖς
  choice: 'e ele lhes disse:'
  rationale: O verbo grego está no singular e aponta para um porta-voz individual; os dois-pontos introduzem a fala que continua no versículo seguinte.
