base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/002.yaml
  text: Then Zerubbabel son of Salathiel and Jeshua son of Josedek stood up and began to build the house of the Lord in Jerusalem[a], while the prophets of the Lord were with them[c][b], helping them.
translation:
  language: pt
  text: Então Zorobabel, filho de Salatiel, levantou-se[a], e Jesua[b], filho de Josedec, começaram a construir a casa do Senhor em Jerusalém, enquanto os profetas do Senhor estavam com eles[c], ajudando-os.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pôs-se de pé”. O particípio grego também pode indicar que tomou a iniciativa e passou à ação.
    reason: lexical_alternative
  - marker: b
    text: Em grego, “Jesua” é Ἰησοῦς, a mesma forma frequentemente traduzida como “Jesus” em outros contextos; aqui se refere ao sumo sacerdote pós-exílico, não a Jesus de Nazaré.
    reason: lexical_alternative
  - marker: c
    text: O contexto paralelo hebraico-aramaico identifica Ageu e Zacarias entre os profetas ligados à reconstrução, mas este versículo grego diz apenas “os profetas do Senhor”.
    reason: cross_reference
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Conector narrativo natural que marca a sequência dos acontecimentos.
- source_word: στάς
  choice: levantaram-se
  rationale: O particípio aoristo de ἵστημι pode descrever tanto o ato de se levantar quanto a iniciativa de agir; a tradução conserva a imagem concreta e a força narrativa.
- source_word: Ζοροβαβὲλ ὁ τοῦ Σαλαθιὴλ
  choice: Zorobabel, filho de Salatiel
  rationale: Emprega as formas tradicionalmente reconhecíveis em português e mantém Salatiel de acordo com a forma grega, sem harmonização com o hebraico.
- source_word: Ἰησοῦς ὁ τοῦ Ἰωσεδὲκ
  choice: Jesua, filho de Josedec
  rationale: Jesua identifica claramente o sumo sacerdote do período pós-exílico e evita confusão com Jesus de Nazaré; Josedec acompanha a forma grega.
- source_word: ἤρξαντο οἰκοδομεῖν
  choice: começaram a construir
  rationale: Reproduz com clareza a construção incoativa formada pelo verbo e o infinitivo.
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: a casa do Senhor
  rationale: Preserva a expressão cultual do texto grego sem substituí-la pela explicitação interpretativa 'templo'.
- source_word: τὸν ἐν Ἰερουσαλήμ
  choice: em Jerusalém
  rationale: Expressa de modo natural em português a localização que qualifica a casa.
- source_word: συνόντων τῶν προφητῶν τοῦ κυρίου
  choice: enquanto os profetas do Senhor estavam com eles
  rationale: Traduz o genitivo absoluto como circunstância concomitante, mantendo tanto a presença quanto o apoio dos profetas.
- source_word: βοηθούντων αὐτοῖς
  choice: ajudando-os
  rationale: O particípio presente indica auxílio contínuo durante a obra.
theological_decisions:
- issue: Tradução de κύριος no contexto da casa divina
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte grega traz κυρίου; 'Senhor' traduz diretamente o termo sem introduzir no texto principal uma representação tipográfica do nome divino baseada no paralelo semítico.
- issue: Relação entre a fonte grega e o paralelo massorético
  choice: Conservar a expressão geral 'os profetas do Senhor'
  alternative: Acrescentar os nomes Ageu e Zacarias
  rationale: O grego é a fonte primária deste versículo e não nomeia os profetas. O paralelo semítico confirma o contexto profético, mas não justifica inserir no texto nomes ausentes da testemunha traduzida.
- issue: Identidade de Ἰησοῦς neste contexto pós-exílico
  choice: Jesua
  alternative: Jesus
  rationale: A escolha distingue o sumo sacerdote pós-exílico de Jesus de Nazaré sem alterar a identidade histórica indicada pela forma grega.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém a expressão bíblica 'casa do Senhor' e usa nomes próprios reconhecíveis em português. Os marcadores foram colocados junto às expressões que elucidam.
