base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/007.yaml
  text: 'A copy of the letter that Sisinnes[a], the governor of Syria and Phoenicia, and Sathrabuzanes, and their associates, the rulers in Syria and Phoenicia, wrote and sent to King Darius: Greetings.'
translation:
  language: pt
  text: 'Cópia da carta que Sisines[a], governador da Síria e da Fenícia, Satrabuzanes e seus colegas, os governantes da Síria e da Fenícia, escreveram e enviaram ao rei Dario: “Saudações!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego passa do verbo no singular (“escrevia”) para o plural (“enviaram”). A tradução apresenta a ação de forma coletiva e fluente, atribuindo-a aos oficiais mencionados.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀντίγραφον ἐπιστολῆς
  choice: Cópia da carta
  rationale: 'Expressa de modo natural o caráter documental da frase grega: uma cópia ou transcrição da carta.'
- source_word: ἧς ἔγραφεν ... καὶ ἀπέστειλαν
  choice: que ... escreveram e enviaram
  rationale: A redação portuguesa atribui coletivamente a composição e o envio aos oficiais nomeados, ao mesmo tempo que a nota registra a mudança gramatical do singular para o plural no grego.
- source_word: Σισίννης
  choice: Sisines
  rationale: Transliteração clara e corrente da forma grega para o português.
- source_word: ὁ ἔπαρχος
  choice: governador
  rationale: Equivalente acessível para o oficial que exercia autoridade administrativa sobre uma região.
- source_word: Συρίας καὶ Φοινίκης
  choice: da Síria e da Fenícia
  rationale: Os genitivos indicam a jurisdição do governador e a região em que atuavam os demais oficiais.
- source_word: Σαθραβουζάνης
  choice: Satrabuzanes
  rationale: Transliteração portuguesa próxima da forma grega, sem conservar o dígrafo inglês th.
- source_word: οἱ συνέταιροι
  choice: seus colegas
  rationale: No contexto administrativo, designa outros oficiais associados, e não companheiros pessoais.
- source_word: ἡγεμόνες
  choice: os governantes
  rationale: Preserva o sentido amplo de autoridades dirigentes e evita repetir “governadores” após ἔπαρχος.
- source_word: Βασιλεῖ Δαρείῳ
  choice: ao rei Dario
  rationale: O dativo identifica o destinatário da carta.
- source_word: χαίρειν
  choice: Saudações!
  rationale: Equivalente idiomático da fórmula grega usada na abertura de cartas.
