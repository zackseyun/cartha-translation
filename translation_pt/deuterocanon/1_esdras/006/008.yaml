base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/008.yaml
  text: 'Let everything be known to our lord the king: when we came into the land of Judea and to Jerusalem[a], the city, we found the elders of the captivity of the Jews in Jerusalem, the city, building a great new house for the Lord[b],'
translation:
  language: pt
  text: 'Que tudo seja levado ao conhecimento de nosso senhor, o rei: quando chegamos à terra da Judeia e a Jerusalém, a cidade, encontramos os anciãos dos judeus do cativeiro em Jerusalém, a cidade, construindo uma grande e nova casa para o Senhor[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: A “casa para o Senhor” é o templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα γνωστὰ ἔστω
  choice: Que tudo seja levado ao conhecimento
  rationale: Reproduz a fórmula de relatório e a força de ἔστω em português corrente e digno.
- source_word: τῷ κυρίῳ ἡμῶν τῷ βασιλεῖ
  choice: de nosso senhor, o rei
  rationale: Mantém os dois títulos cortesãos; a minúscula distingue o soberano humano do Senhor divino mencionado depois.
- source_word: παραγενόμενοι εἰς τὴν χώραν τῆς Ἰουδαίας καὶ Ἰερουσαλὴμ τὴν πόλιν
  choice: quando chegamos à terra da Judeia e a Jerusalém, a cidade
  rationale: Entende o particípio como temporal e conserva a coordenação e a aposição enfática do grego sem transformar χώρα em uma divisão administrativa específica.
- source_word: κατελάβομεν
  choice: encontramos
  rationale: No contexto, o verbo indica deparar-se com pessoas ocupadas na construção, não capturá-las.
- source_word: τῆς αἰχμαλωσίας τοὺς πρεσβυτέρους τῶν Ἰουδαίων
  choice: os anciãos dos judeus que haviam estado no cativeiro
  rationale: Explicita com cautela a relação comprimida dos genitivos, preservando a referência aos líderes da comunidade judaica exilada ou retornada sem identificá-los simplesmente como ainda cativos.
- source_word: οἰκοδομοῦντας οἶκον τῷ κυρίῳ μέγαν καινόν
  choice: construindo uma grande e nova casa para o Senhor
  rationale: Conserva οἶκος como 'casa', os dois adjetivos e a referência divina, deixando a nota esclarecer que se trata do templo.
theological_decisions:
- issue: κύριος designa tanto o rei persa quanto o Deus de Israel no mesmo versículo
  choice: '''senhor'' em minúscula para o título do rei e ''Senhor'' para Deus'
  alternative: Usar 'soberano' ou 'mestre' para o rei e 'Senhor' para Deus
  rationale: A repetição lexical do grego é preservada, enquanto capitalização e contexto distinguem os referentes.
- issue: Identidade da 'casa para o Senhor'
  choice: Manter 'casa' no texto e esclarecer em nota que é o templo
  alternative: Traduzir diretamente como 'templo'
  rationale: Evita substituir o termo concreto οἶκος por uma interpretação, embora o referente cultual seja claro.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A sintaxe documental foi preservada de modo moderado, inclusive a aposição 'Jerusalém, a cidade'. Mantém-se a vírgula final porque o versículo continua a frase no contexto.
