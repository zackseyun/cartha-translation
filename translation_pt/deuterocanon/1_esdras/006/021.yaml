base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/021.yaml
  text: And if it is found that the building of the house of the Lord in Jerusalem was done with the approval of Cyrus the king[a], and if it seems good to our lord the king, let him send us word about these matters.
translation:
  language: pt
  text: E, se for constatado que a construção da casa do Senhor[a] em Jerusalém foi realizada com a aprovação do rei Ciro, e se isso parecer bem ao rei, nosso senhor, que ele nos informe a respeito dessas questões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: “a construção do Senhor em Jerusalém”; pelo contexto, trata-se da construção da casa, ou templo, do Senhor em Jerusalém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εὑρίσκηται
  choice: se for constatado
  rationale: Preserva a condição e o sentido passivo de uma verificação oficial em registros ou por investigação.
- source_word: μετὰ τῆς γνώμης
  choice: com a aprovação
  rationale: No contexto administrativo régio, γνώμη indica anuência ou autorização, não apenas opinião pessoal.
- source_word: γενομένην τὴν οἰκοδομήν
  choice: a construção ... foi realizada
  rationale: Expressa de modo natural que a obra de construção ocorreu, sem acrescentar a ideia não explícita de reconstrução.
- source_word: τοῦ κυρίου τοῦ ἐν Ἰερουσαλήμ
  choice: da casa do Senhor em Jerusalém
  rationale: O grego diz literalmente algo como 'do Senhor que está em Jerusalém', mas o contexto exige como elipse a casa ou o templo; 'casa do Senhor' conserva o idioma bíblico.
- source_word: κρίνηται τῷ κυρίῳ βασιλεῖ ἡμῶν
  choice: se isso parecer bem ao rei, nosso senhor
  rationale: Reproduz a fórmula deferente da correspondência régia e distingue o título honorífico humano do título divino.
- source_word: προσφωνησάτω ἡμῖν
  choice: que ele nos envie uma resposta
  rationale: No contexto epistolar oficial, o verbo denota comunicar uma decisão em resposta à consulta.
- source_word: περὶ τούτων
  choice: a respeito dessas questões
  rationale: O plural remete aos assuntos submetidos à investigação e combina com o registro administrativo.
theological_decisions:
- issue: Dois referentes distintos de κύριος no mesmo versículo
  choice: “Senhor” para Deus e “senhor” para o rei
  alternative: Usar “Senhor” em ambos os casos ou substituir o título do rei por “soberano”
  rationale: A capitalização distingue o título divino do tratamento régio sem apagar que o grego emprega o mesmo substantivo para ambos.
- issue: Elipse em τοῦ κυρίου τοῦ ἐν Ἰερουσαλήμ
  choice: Suprir “casa” no texto e registrar a forma literal em nota
  alternative: Traduzir “a construção do Senhor em Jerusalém” ou suprir “templo”
  rationale: “Casa do Senhor” torna inteligível a referência contextual ao santuário, preserva o uso bíblico e evita sugerir que o próprio Senhor esteja sendo construído.
translation_notes:
  register: Português moderno, digno e acessível, com leve formalidade adequada a uma carta administrativa dirigida à corte. A colocação “ao rei, nosso senhor” evita a possível leitura de que “Senhor” seja aqui um título divino.
