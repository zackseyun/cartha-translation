revisions:
- from: E os utensílios sagrados, os de ouro e os de prata, que Nabucodonosor havia retirado da casa em Jerusalém e depositado em seu próprio templo, o rei Ciro tornou a retirá-los do templo na Babilônia, e eles foram entregues a Zorobabel e a Sabanassar, o governador.[a]
  to: E os utensílios sagrados, os de ouro e os de prata, que Nabucodonosor havia retirado da casa em Jerusalém e depositado em seu próprio templo, Ciro, o rei, retirou-os novamente do templo na Babilônia, e eles foram entregues a Zorobabel e a Sabanassar[a], o governador.
  rationale: A revisão preserva integralmente o sentido do texto grego e as decisões terminológicas do rascunho. Apenas melhora a expressão da retirada efetuada por Ciro e desloca o marcador para o nome Sabanassar, ao qual a nota se refere diretamente.
