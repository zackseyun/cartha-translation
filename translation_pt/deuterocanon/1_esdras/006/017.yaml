    rationale: A nota trata especificamente de «Sabanassar», mas o marcador está colocado após «o governador». Deve seguir imediatamente o nome para uma ancoragem inequívoca.
  - severity: low
    issue: Formulação de πάλιν ἐξήνεγκεν
    rationale: «Retirou-os novamente» mantém o sentido de πάλιν e soa mais fluente e preciso no contexto do que «tornou a retirá-los».
