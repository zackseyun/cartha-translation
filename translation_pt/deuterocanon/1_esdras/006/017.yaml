base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/017.yaml
  text: And the holy vessels[a], the gold and the silver ones, which Nebuchadnezzar had carried out from the house in Jerusalem and deposited in his own temple—Cyrus the king again brought them out from the temple in Babylon, and they were handed over to Zerubbabel and to Sanabassar the governor.
translation:
  language: pt
  text: E os utensílios sagrados, os de ouro e os de prata, que Nabucodonosor havia retirado da casa em Jerusalém e depositado em seu próprio templo, Ciro, o rei, retirou-os novamente do templo na Babilônia, e eles foram entregues a Zorobabel e a Sabanassar[a], o governador.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz Σαβανασσάρ; provavelmente corresponde ao nome geralmente traduzido como “Sesbazar” em Esdras.
    reason: Registra a forma da fonte grega e a provável correspondência com a forma mais conhecida da tradição hebraico-aramaica.
lexical_decisions:
- source_word: ἱερὰ σκεύη
  choice: utensílios sagrados
  rationale: Preserva a natureza consagrada dos objetos e usa uma expressão natural e abrangente para artigos de uso cultual.
- source_word: τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ
  choice: os de ouro e os de prata
  rationale: Mantém as duas classes substantivadas e retoma com clareza os utensílios já mencionados.
- source_word: ἐξήνεγκεν
  choice: havia retirado / tornou a retirá-los
  rationale: O mais-que-perfeito organiza a ação anterior de Nabucodonosor; na ação de Ciro, 'tornou a retirá-los' expressa conjuntamente o verbo e πάλιν.
- source_word: οἴκου τοῦ ἐν Ἰερουσαλήμ
  choice: da casa em Jerusalém
  rationale: Conserva a distinção lexical do grego entre οἶκος, referente ao santuário de Jerusalém, e ναός, usado depois para o templo babilônico.
- source_word: ἀπηρείσατο
  choice: depositado
  rationale: Comunica uma colocação deliberada dos objetos no templo, possivelmente sob custódia, sem acrescentar a ideia específica de armazenamento.
- source_word: ἐν τῷ αὐτοῦ ναῷ
  choice: em seu próprio templo
  rationale: Expressa o contraste possessivo indicado por αὐτοῦ e traduz ναός de maneira natural.
- source_word: πάλιν
  choice: tornou a
  rationale: Marca a repetição e reversão da retirada anterior de modo idiomático em português.
- source_word: τοῦ ναοῦ τοῦ ἐν Βαβυλωνίᾳ
  choice: do templo na Babilônia
  rationale: Βαβυλωνία designa propriamente a Babilônia/Babilônia regional; a forma escolhida é natural e não restringe explicitamente a referência à cidade de Babilônia.
- source_word: παρεδόθη
  choice: eles foram entregues
  rationale: Mantém a voz passiva e o sentido de transferência formal de custódia; o plural em português concorda com os utensílios.
- source_word: Ζοροβαβὲλ
  choice: Zorobabel
  rationale: Forma bíblica tradicional e amplamente reconhecida em português, correspondente ao nome semítico e à forma grega.
- source_word: Σαβανασσάρῳ
  choice: Sabanassar
  rationale: Translitera de perto a forma grega Σαβανασσάρ sem harmonizá-la no texto principal com a forma de Esdras.
- source_word: τῷ ἐπάρχῳ
  choice: o governador
  rationale: Equivalente claro e corrente para o administrador oficial designado por ἔπαρχος.
theological_decisions:
- issue: Distinção entre οἶκος para o santuário de Jerusalém e ναός para o templo babilônico
  choice: Traduzir οἶκος por 'casa' e ναός por 'templo'
  alternative: Traduzir ambos por 'templo'
  rationale: A escolha preserva a variação deliberada do texto grego sem negar que 'casa' se refere ao santuário de Jerusalém.
- issue: Identidade e forma do nome Σαβανασσάρ
  choice: Usar 'Sabanassar' no texto e registrar 'Sesbazar' em nota
  alternative: Usar 'Sesbazar' diretamente no texto principal
  rationale: Como o grego é a testemunha primária de 1 Esdras, sua forma nominal é preservada; a nota permite reconhecer a provável correspondência com a personagem de Esdras sem impor a harmonização.
- issue: Alcance geográfico de Βαβυλωνία
  choice: Traduzir por 'Babilônia'
  alternative: Traduzir por 'Babilônia, a cidade' ou 'terra da Babilônia'
  rationale: A expressão portuguesa conserva a possível referência regional e evita resolver uma amplitude geográfica que o contexto não exige definir.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe acompanha a sequência grega, mas evita rigidez; 'utensílios' é mais corrente que 'vasos' para o conjunto de objetos cultuais. O marcador de nota foi colocado após a identificação de Sabanassar como governador.
