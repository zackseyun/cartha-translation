- from: E eles não foram impedidos de continuar a construção até que se enviasse a Dario um relatório a respeito deles e se recebesse uma resposta.[a]
  to: E eles não foram impedidos de construir até que se enviasse a Dario um relatório a respeito deles e se desse uma resposta.[a]
