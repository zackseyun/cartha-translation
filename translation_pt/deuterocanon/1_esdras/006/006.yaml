base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/006.yaml
  text: and they were not hindered from building until word about them should be sent to Darius and a reply should be returned[a].
translation:
  language: pt
  text: E eles não foram impedidos de construir até que se enviasse a Dario um relatório a respeito deles e se desse uma resposta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e se dirigisse uma comunicação”. O verbo grego pode indicar que alguém seja abordado ou que se lhe dirija uma comunicação; neste contexto, a sequência favorece uma resposta administrativa ao relatório enviado a Dario.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐκωλύθησαν
  choice: não foram impedidos
  rationale: Preserva a voz passiva e expressa com naturalidade que a obra não foi detida.
- source_word: τῆς οἰκοδομῆς
  choice: de continuar a construção
  rationale: O genitivo após κωλύω indica aquilo que não lhes foi impedido fazer; a formulação explicita de modo idiomático a continuidade da obra já em andamento.
- source_word: μέχρις οὗ
  choice: até que
  rationale: Equivalente temporal direto e natural em português.
- source_word: ὑποσημανθῆναι
  choice: se enviasse ... um relatório
  rationale: No contexto administrativo, o verbo indica comunicar ou apresentar oficialmente uma informação; “relatório” torna clara essa função sem introduzir conteúdo ausente.
- source_word: Δαρείῳ
  choice: a Dario
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: περὶ αὐτῶν
  choice: a respeito deles
  rationale: Mantém a referência pronominal potencialmente abrangente aos envolvidos ou à situação em questão.
- source_word: προσφωνηθῆναι
  choice: se recebesse uma resposta
  rationale: A sequência administrativa favorece a ideia de uma resposta oficial após o relatório, embora o verbo também possa significar que alguém fosse interpelado ou recebesse uma comunicação.
