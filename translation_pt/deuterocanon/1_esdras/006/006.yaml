  source_fidelity: 'A estrutura principal é bem representada: a passiva de οὐκ ἐκωλύθησαν, o valor temporal de μέχρις οὗ, a comunicação oficial a Dario e a resposta administrativa contextual. Contudo, «continuar» explicita uma continuidade que não é dita pelo grego, e a nota formula de maneira imprecisa a alternativa de προσφωνηθῆναι.'
  naturalness: A redação é clara e de registro apropriado. «Não foram impedidos de construir» é mais direto e não acrescenta aspecto verbal. A construção impessoal «se desse uma resposta» é natural no contexto administrativo.
  terminology: «Dario» e «relatório» são adequados. «Resposta» é a melhor opção contextual para προσφωνηθῆναι, desde que a nota preserve a alternativa mais literal sem sugerir indevidamente que alguém específico foi interpelado.
