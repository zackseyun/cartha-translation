base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/028.yaml
  text: and from the tribute of Coele-Syria and Phoenicia[a], support is to be given carefully to these men for sacrifice to the Lord, to Zerubbabel the governor, for bulls and rams and lambs[c][b],
translation:
  language: pt
  text: e que, das receitas tributárias da Celessíria e da Fenícia[a], seja cuidadosamente destinada a estes homens uma dotação[b] para o sacrifício ao Senhor, a Zorobabel, o governador,[c] para touros, carneiros e cordeiros,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Celessíria” é o nome grego convencional da região; literalmente, a expressão significa “Síria Oca”.
    reason: cultural_note
  - marker: b
    text: Ou “seja concedida uma provisão”. O grego se refere a uma dotação oficial proveniente das receitas provinciais.
    reason: lexical_alternative
  - marker: c
    text: A construção grega em torno de “a Zorobabel, o governador” é condensada. Zorobabel pode ser apresentado como destinatário ou administrador da dotação, ou a expressão pode funcionar como uma identificação em aposição no decreto.
    reason: alternative_reading
lexical_decisions:
- source_word: φορολογίας
  choice: arrecadação tributária
  rationale: A expressão indica a receita obtida por tributação provincial. “Arrecadação tributária” comunica com clareza a fonte oficial dos recursos, sem limitar o sentido a um tributo isolado.
- source_word: κοίλης Συρίας
  choice: Celessíria
  rationale: Trata-se do nome geográfico convencional da região no uso helenístico, não de uma descrição a ser vertida literalmente como “Síria Oca”.
- source_word: ἐπιμελῶς
  choice: cuidadosamente
  rationale: O advérbio ressalta o zelo na administração da verba e é reproduzido de maneira direta e natural.
- source_word: σύνταξιν δίδοσθαι
  choice: seja destinada ... uma verba
  rationale: σύνταξις designa aqui uma dotação ou provisão oficial. “Verba” explicita adequadamente o caráter financeiro no contexto das receitas provinciais, enquanto a construção passiva preserva a formulação do decreto.
- source_word: τούτοις τοῖς ἀνθρώποις
  choice: a estes homens
  rationale: Mantém o plural masculino do grego e sua referência provável aos responsáveis mencionados no contexto.
- source_word: εἰς θυσίαν τῷ κυρίῳ
  choice: para sacrifícios ao Senhor
  rationale: A preposição εἰς expressa finalidade, e o plural idiomático “sacrifícios” comunica o uso recorrente da verba na aquisição dos animais enumerados.
- source_word: Ζοροβάβελ ἐπάρχῳ
  choice: a Zorobabel, o governador
  rationale: Conserva a relação dativa e a aposição do título, sem resolver em excesso a sintaxe grega comprimida.
- source_word: ταύρους καὶ κριοὺς καὶ ἄρνας
  choice: touros, carneiros e cordeiros
  rationale: São os animais sacrificiais enumerados no texto. Os termos portugueses são correntes e semanticamente precisos.
theological_decisions:
- issue: Tradução de κυρίῳ no contexto dos sacrifícios de Israel
  choice: ao Senhor
  alternative: ao SENHOR
  rationale: O texto grego traz κυρίῳ. “Senhor” traduz diretamente a forma grega sem introduzir no corpo do texto a convenção tipográfica usada para representar o tetragrama hebraico.
- issue: Referente e função sintática de Ζοροβάβελ ἐπάρχῳ
  choice: a Zorobabel, o governador
  alternative: por intermédio de Zorobabel, o governador
  rationale: O dativo pode associar Zorobabel ao recebimento ou à administração da provisão, mas o grego não explicita “por intermédio de”. A tradução mantém a ambiguidade e a nota a registra.
- issue: Gênero de ἀνθρώποις
  choice: estes homens
  alternative: estas pessoas
  rationale: O grego usa o masculino plural e, no contexto, provavelmente aponta para homens ligados à liderança ou ao serviço do templo. A tradução preserva essa marca.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A oração mantém a forma continuativa do versículo e sua vírgula final, pois integra uma sentença mais longa. Preferiu-se “Celessíria”, forma portuguesa tradicional do topônimo, e “verba” para o caráter fiscal e administrativo da provisão.
