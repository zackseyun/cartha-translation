base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/020.yaml
  text: Now then[a], let it be determined, O king; let a search be made in the royal archives of my lord the king in Babylon,
translation:
  language: pt
  text: Agora, pois, decida-se, ó rei; faça-se uma busca nos arquivos reais de meu senhor, o rei, em Babilônia,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Agora, portanto, julgue-se, ó rei; faça-se uma inspeção nos depósitos reais de documentos de meu senhor, o rei, em Babilônia.»'
    reason: Registra as alternativas legítimas para κρίνεται, ἐπισκεπτήτω e βιβλιοφυλακίοις, preservando a possível tonalidade judicial e o sentido mais concreto dos locais onde se guardavam documentos.
lexical_decisions:
- source_word: νῦν οὖν
  choice: Agora, pois
  rationale: Conserva tanto o valor temporal de νῦν quanto a força inferencial e transitiva de οὖν, em formulação portuguesa natural.
- source_word: κρίνεται
  choice: decida-se
  rationale: A forma passiva e impessoal introduz uma decisão oficial. «Decida-se» preserva esse caráter administrativo sem restringir o sentido a um julgamento judicial.
- source_word: βασιλεῦ
  choice: ó rei
  rationale: O vocativo grego é mantido como tratamento direto e solene, apropriado ao tom de petição oficial.
- source_word: ἐπισκεπτήτω
  choice: faça-se uma busca
  rationale: No contexto de documentos arquivados, o verbo pede uma averiguação oficial. A construção impessoal corresponde bem ao tom administrativo do grego.
- source_word: βασιλικοῖς βιβλιοφυλακίοις
  choice: arquivos reais
  rationale: O termo designa depósitos de livros ou documentos; «arquivos reais» comunica sua função administrativa sem sugerir uma biblioteca literária moderna.
- source_word: τοῦ κυρίου βασιλέως
  choice: de meu senhor, o rei
  rationale: A expressão é uma fórmula secular de deferência à autoridade real. A explicitação de «meu», natural em português nesse tratamento, evita que «Senhor» seja entendido como título divino.
- source_word: τοῖς ἐν Βαβυλῶνι
  choice: em Babilônia
  rationale: Indica diretamente a localização dos arquivos; a formulação concisa reproduz o sentido locativo sem acrescentar ênfase ausente do contexto.
theological_decisions:
- issue: Sentido de κύριος na fórmula cortesã τοῦ κυρίου βασιλέως
  choice: meu senhor, o rei
  alternative: o senhor rei
  rationale: Aqui κύριος integra um tratamento honorífico dirigido a um soberano humano, não um título divino. A minúscula e a aposição deixam clara a referência secular.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência de petição administrativa. O vocativo «ó rei» preserva a solenidade, enquanto «arquivos reais» evita literalismo pouco natural.
