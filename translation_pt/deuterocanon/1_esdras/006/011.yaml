base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/011.yaml
  text: So we questioned them in order to make it known to you and to write to you the names of the men who were leading them[b][a], and we asked them for the list of names of those who were at their head.
translation:
  language: pt
  text: Por isso, nós os interrogamos, a fim de informar você e de lhe escrever os nomes dos homens que os lideravam[a]; também lhes pedimos a lista dos nomes daqueles que estavam à frente deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, “dos homens que apresentavam o relato”. O particípio grego é difícil e pode destacar tanto a liderança quanto os que faziam a exposição formal dos fatos.
    reason: lexical_alternative
  - marker: b
    text: A expressão indica um registro oficial dos nomes dos dirigentes responsáveis pela obra.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπερωτήσαμεν
  choice: nós os interrogamos
  rationale: O verbo indica perguntar ou interrogar; “interrogamos” preserva o caráter formal da investigação relatada às autoridades.
- source_word: ἕνεκεν τοῦ γνωρίσαι σοι
  choice: a fim de informar você
  rationale: A construção infinitiva exprime finalidade. Esta formulação é natural em português moderno e mantém o sentido de dar conhecimento ao destinatário.
- source_word: γράψαι σοι
  choice: de lhe escrever
  rationale: Reproduz de modo natural o ato epistolar indicado pelo infinitivo grego.
- source_word: τοὺς ἀνθρώπους
  choice: os nomes dos homens
  rationale: O grego diz literalmente “os homens”, mas o contexto imediato de registro e comunicação de nomes permite explicitar “os nomes”, como exige o sentido administrativo da frase.
- source_word: τοὺς ἀφηγουμένους
  choice: que os lideravam
  rationale: O particípio é lexicalmente difícil e pode indicar condução ou liderança, embora também possa guardar a ideia de expor um relato. No contexto, a liderança é o sentido mais provável; a alternativa é preservada em nota.
- source_word: ὀνοματογραφίαν
  choice: a lista dos nomes
  rationale: O termo raro designa um registro escrito de nomes; “lista dos nomes” é claro e idiomático.
- source_word: τῶν προκαθηγουμένων
  choice: daqueles que estavam à frente deles
  rationale: Mantém a imagem relacional do grego para os que presidiam ou exerciam liderança, sem reduzi-la a um título oficial específico.
