base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/032.yaml
  text: Therefore may the Lord[a], whose name has been invoked there, destroy every king and nation that stretches out its hand to hinder or to harm that house of the Lord there in Jerusalem.
translation:
  language: pt
  text: Por isso, que o Senhor[a], cujo nome é invocado ali, destrua todo rei e toda nação que estender a mão para impedir ou causar dano àquela casa do Senhor em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cujo nome é chamado ali”. A expressão grega também pode ser entendida dessa forma; “é invocado ali” destaca o sentido cultual no contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ ταῦτα
  choice: Por isso
  rationale: Expressa de modo natural e conciso a consequência introduzida pela locução grega.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Com o artigo, refere-se ao Deus de Israel; “Senhor” preserva o uso bíblico de κύριος.
- source_word: οὗ τὸ ὄνομα αὐτοῦ ἐπικέκληται ἐκεῖ
  choice: cujo nome é invocado ali
  rationale: Preserva tanto a forma passiva quanto o sentido cultual de invocar o nome de Deus no lugar, sem excluir a ideia de que o nome está ligado ao templo.
- source_word: ἀφανίσαι
  choice: destrua
  rationale: O infinitivo tem aqui força optativa ou imprecatória no decreto; o subjuntivo português com “que” comunica essa força.
- source_word: πάντα βασιλέα καὶ ἔθνος
  choice: todo rei e toda nação
  rationale: Mantém a formulação distributiva e torna explícita a concordância natural em português.
- source_word: ὃς ἐκτενεῖ χεῖρα αὐτοῦ
  choice: que estender a mão
  rationale: Conserva a expressão idiomática bíblica de agir contra algo e evita um pronome possessivo de referência ambígua em português.
- source_word: κωλῦσαι
  choice: impedir
  rationale: Verbo corrente e adequado para a ação de obstruir a casa ou sua obra no contexto administrativo.
- source_word: κακοποιῆσαι
  choice: causar dano
  rationale: Abrange atos hostis sem restringir o sentido a dano meramente físico.
- source_word: τὸν οἶκον Κυρίου ἐκεῖνον τὸν ἐν Ἰερουσαλήμ
  choice: àquela casa do Senhor em Jerusalém
  rationale: Preserva o demonstrativo enfático e a expressão bíblica “casa do Senhor”, deixando claro o local.
theological_decisions:
- issue: Fórmula do nome divino relacionada ao templo
  choice: cujo nome é invocado ali
  alternative: cujo nome é chamado ali
  rationale: A opção escolhida comunica o provável sentido cultual de ἐπικέκληται, enquanto a nota registra a tradução formalmente mais literal e preserva a ambiguidade.
- issue: Força do infinitivo ἀφανίσαι no decreto
  choice: que o Senhor ... destrua
  alternative: o Senhor destruirá
  rationale: O contexto favorece uma imprecação ou desejo solene, não uma simples afirmação no futuro.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A estrutura “que o Senhor ... destrua” transmite naturalmente a imprecação do decreto. “Casa do Senhor” conserva o idioma bíblico para o templo.
