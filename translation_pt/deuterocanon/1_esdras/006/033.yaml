base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/006/033.yaml
  text: I, King Darius, have decreed that this be done carefully according to these instructions.
translation:
  language: pt
  text: Eu, o rei Dario, decretei que isso seja feito cuidadosamente, de acordo com estas determinações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «de acordo com estas coisas». A expressão se refere às disposições anteriores do decreto de Dario.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: Eu
  rationale: Mantém o pronome explícito e enfático da fórmula régia.
- source_word: βασιλεὺς Δαρεῖος
  choice: o rei Dario
  rationale: Forma natural em português, preservando o título real ligado ao nome próprio.
- source_word: δεδογμάτικα
  choice: decretei
  rationale: Expressa uma decisão real formal e vigente; o pretérito perfeito é mais natural em português atual do que «tenho decretado» neste contexto.
- source_word: ἐπιμελῶς
  choice: cuidadosamente
  rationale: Preserva a ideia de execução atenta e cuidadosa, sem acrescentar a noção de zelo sugerida por alternativas como «diligentemente».
- source_word: κατὰ ταῦτα
  choice: de acordo com estas determinações
  rationale: A expressão significa literalmente «de acordo com estas coisas», mas aqui retoma as disposições anteriores do decreto; «determinações» explicita esse referente administrativo sem alterar seu sentido.
- source_word: γίνεσθαι
  choice: que isso seja feito
  rationale: No contexto administrativo, o infinitivo refere-se ao cumprimento do que foi ordenado; a construção passiva é clara e direta em português.
