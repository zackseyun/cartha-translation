base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/022.yaml
  text: And the things concerning him also have been recorded in former times[a], concerning those who sinned and acted wickedly against the Lord beyond every nation and kingdom, and grieved him greatly[b]; and the words of the Lord rose up against Israel.
translation:
  language: pt
  text: Também o que diz respeito a ele foi registrado em tempos anteriores, acerca dos que pecaram e agiram de modo ímpio contra o Senhor mais do que todas as nações e todos os reinos[a], e o entristeceram profundamente[b]; e as palavras do Senhor se levantaram contra Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mais do que qualquer nação e reino”, isto é, seus pecados excederam os de todas as nações e reinos.'
    reason: lexical_alternative
  - marker: b
    text: 'O texto grego neste ponto é difícil: depois de “o entristeceram”, o texto transmitido traz ἔστω (“seja”), forma pouco adequada ao contexto. A tradução entende que há aqui uma ênfase; também é possível que o texto tenha sofrido uma pequena alteração na transmissão.'
    reason: textual_variant
lexical_decisions:
- source_word: τὰ κατʼ αὐτόν
  choice: o que diz respeito a ele
  rationale: Mantém a amplitude da expressão grega, sem restringi-la apenas aos atos ou feitos da pessoa mencionada.
- source_word: ἀναγέγραπται
  choice: foi registrado
  rationale: Expressa o perfeito passivo e o sentido documental de algo posto por escrito e preservado.
- source_word: ἐν τοῖς ἔμπροσθεν χρόνοις
  choice: em tempos anteriores
  rationale: Traduz a referência temporal sem acrescentar livros ou registros não explicitados no grego.
- source_word: περὶ τῶν ἡμαρτηκότων καὶ ἠσεβηκότων
  choice: acerca dos que pecaram e agiram de modo ímpio
  rationale: 'Preserva os dois aspectos do grego: cometer pecado e agir com impiedade.'
- source_word: εἰς τὸν κύριον
  choice: contra o Senhor
  rationale: No contexto de transgressão, a preposição indica oposição ou ofensa dirigida contra o Senhor.
- source_word: παρὰ ἅπαν ἔθνος καὶ βασιλείαν
  choice: mais do que todas as nações e todos os reinos
  rationale: Torna natural em português a comparação de superioridade ou excesso expressa por παρά com acusativo.
- source_word: ἐλύπησαν αὐτόν
  choice: o entristeceram
  rationale: Conserva diretamente a linguagem pessoal do grego, que atribui tristeza ao Senhor.
- source_word: ἔστω
  choice: profundamente
  rationale: A forma transmitida é difícil no contexto; a tradução representa uma possível função enfática, deixando a incerteza registrada em nota.
- source_word: οἱ λόγοι τοῦ κυρίου ἀνέστησαν ἐπʼ Ἰσραήλ
  choice: as palavras do Senhor se levantaram contra Israel
  rationale: Preserva a personificação vívida das palavras divinas e o sentido adversativo de ἀνέστησαν ἐπί.
theological_decisions:
- issue: Tradução de κύριος no contexto histórico deuterocanônico
  choice: Senhor
  alternative: SENHOR
  rationale: “Senhor” é a correspondência natural de κύριος no texto grego, sem impor uma reconstrução explícita do nome divino.
- issue: Linguagem antropopática em ἐλύπησαν αὐτόν
  choice: o entristeceram
  alternative: o provocaram
  rationale: A tradução mantém a afirmação explícita de que o Senhor foi entristecido, em vez de suavizar sua tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe um pouco solene conserva o caráter historiográfico do grego, enquanto “o que diz respeito a ele” evita especificar além do texto.
