base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/017.yaml
  text: And the sons of Israel who were found at that time kept the Passover and the feast of unleavened bread for seven days[a][b].
translation:
  language: pt
  text: Os filhos de Israel que estavam presentes naquela ocasião celebraram a Páscoa e a Festa dos Pães sem Fermento durante sete dias.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O grego diz, mais literalmente, “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “que foram encontrados”; isto é, os que estavam presentes naquela ocasião.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγοσαν
  choice: celebraram
  rationale: Embora o verbo tenha o sentido básico de “levar” ou “conduzir”, com festas como objetos diretos expressa idiomaticamente sua realização ou celebração. “Celebraram” é natural em português e serve aos dois objetos coordenados.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar explícita do grego, sem reduzi-la silenciosamente ao gentílico “os israelitas”.
- source_word: οἱ εὑρεθέντες
  choice: que se encontravam
  rationale: Reproduz o campo lexical de εὑρίσκω de modo natural e indica, sem acrescentar um advérbio locativo ausente, aqueles que estavam presentes naquele tempo.
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: naquele tempo
  rationale: Expressa de modo direto o tempo ou a ocasião relevante no contexto narrativo.
- source_word: τὸ πάσχα
  choice: a Páscoa
  rationale: Designação portuguesa consagrada para a festa judaica, com o artigo do grego naturalmente preservado.
- source_word: τὴν ἑορτὴν τῶν ἀζύμων
  choice: a Festa dos Pães sem Fermento
  rationale: Nome claro e corrente da festividade; “pães sem fermento” comunica ao leitor comum o sentido de ἀζύμων com maior transparência que o termo técnico “ázimos”.
- source_word: ἡμέρας ἑπτά
  choice: durante sete dias
  rationale: Torna explícito em português o acusativo grego de duração.
