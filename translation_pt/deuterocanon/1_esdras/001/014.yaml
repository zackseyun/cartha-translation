translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pontuação distingue a disposição dos cantores da lista subsequente, sem eliminar a concisão sintática do grego; a ambiguidade da relação dos três nomes com o rei é preservada no texto e explicitada em nota.
