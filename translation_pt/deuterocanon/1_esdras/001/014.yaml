base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/014.yaml
  text: And the temple singers[a], the sons of Asaph, were at their stations according to what had been appointed by David, and Asaph and Zechariah and Eddinous[b], who were from the king.
translation:
  language: pt
  text: E os cantores do templo, filhos de Asafe, estavam em seus postos, conforme o que Davi havia determinado; e Asafe, Zacarias e Edeinús, ligados ao rei[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “designados pelo rei” ou “a serviço do rei”. A expressão grega é concisa e pode indicar nomeação ou vínculo com a corte real.'
    reason: alternative_reading
  - marker: b
    text: A redação aqui difere do paralelo hebraico aproximado em 2 Crônicas 35:12, que nesta parte trata da distribuição do holocausto. Primeiro Esdras preserva uma informação ampliada sobre os cantores e os homens citados pelo nome.
    reason: cross_reference
lexical_decisions:
- source_word: ἱεροψάλται
  choice: cantores do templo
  rationale: O composto designa cantores ligados ao culto sagrado. “Cantores do templo” é claro, natural e preserva o contexto cultual.
- source_word: υἱοὶ Ἀσάφ
  choice: filhos de Asafe
  rationale: Mantém a expressão genealógica e organizacional tradicional, que identifica o grupo reconhecido de cantores levíticos.
- source_word: ἐπὶ τῆς τάξεως αὐτῶν
  choice: em seus postos
  rationale: Neste contexto, τάξις indica a posição ou função ordenada no serviço do templo; “em seus postos” comunica isso de modo concreto.
- source_word: κατὰ τὰ ὑπὸ Δαυεὶδ τεταγμένα
  choice: conforme o que Davi havia determinado
  rationale: Representa o particípio passivo perfeito como uma disposição previamente estabelecida por Davi, em português corrente e digno.
- source_word: οἱ παρὰ τοῦ βασιλέως
  choice: ligados ao rei
  rationale: A expressão grega é comprimida e pode indicar procedência, vínculo, serviço ou nomeação real. “Ligados ao rei” preserva a relação sem definir indevidamente sua natureza.
- source_word: Ἐδδεινοὺς
  choice: Edeinús
  rationale: Transliteração portuguesa próxima da forma grega transmitida, com acento para orientar a pronúncia, sem harmonizá-la a outro nome de tradição textual distinta.
