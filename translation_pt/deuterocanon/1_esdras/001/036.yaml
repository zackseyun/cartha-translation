base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/036.yaml
  text: And he bound Jehoiakim’s nobles[a], and after seizing Zarius his brother[b], he brought him up from Egypt.
translation:
  language: pt
  text: E ele prendeu os nobres de Jeoaquim[a][b] e, depois de capturar Zário, irmão de Jeoaquim, trouxe-o do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase grega é compacta. Pelo contexto mais amplo e pelo paralelo hebraico, quem age é o rei do Egito, embora ele não seja nomeado novamente neste versículo.
    reason: alternative_reading
  - marker: b
    text: A sequência grega também pode ser entendida como «prendeu Jeoaquim e os nobres». Além disso, o termo traduzido por «nobres» pode ser vertido como «grandes do reino» ou «dignitários».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδησεν
  choice: prendeu
  rationale: O verbo δέω tem o sentido concreto de amarrar ou pôr em cadeias; no contexto de uma ação régia contra pessoas, «prendeu» comunica naturalmente a detenção sem especificar um método de contenção que o texto não declara.
- source_word: Ἰωακεὶμ
  choice: Jeoaquim
  rationale: Forma portuguesa bíblica corrente do nome representado no grego por Ἰωακείμ.
- source_word: τοὺς μεγιστᾶνας
  choice: os nobres
  rationale: μεγιστᾶνες designa homens de alta posição, grandes do reino ou membros da elite. «Os nobres» é claro, digno e adequado ao contexto cortesão.
- source_word: Ζάριον
  choice: Zário
  rationale: Transliteração portuguesa natural da forma acusativa grega Ζάριον, entendida a partir do nominativo Ζάριος.
- source_word: συλλαβών
  choice: depois de capturar
  rationale: O particípio indica que ele tomou ou apreendeu Zário antes de o trazer do Egito. «Capturar» preserva a força do verbo sem impor uma formalidade jurídica específica.
- source_word: ἀνήγαγεν
  choice: trouxe-o
  rationale: ἀνάγω pode indicar conduzir para cima ou fazer sair de um lugar. Em português, «trouxe-o do Egito» expressa com naturalidade o movimento de origem, enquanto o complemento conserva a direção relevante.
- source_word: ἐξ Αἰγύπτου
  choice: do Egito
  rationale: A expressão indica o lugar de onde Zário foi trazido; «do Egito» é a formulação portuguesa idiomática.
theological_decisions:
- issue: Identificação do sujeito numa notícia histórica sintaticamente comprimida
  choice: Manter «ele» no texto principal, entendendo pelo contexto que se refere ao rei do Egito, e explicar a identificação em nota.
  alternative: Explicitar «o rei do Egito» no texto principal ou entender Jeoaquim como sujeito da ação.
  rationale: O grego não repete aqui o sujeito nominal. O contexto narrativo e o paralelo hebraico apontam para o rei do Egito como agente, mas inserir esse título no corpo do versículo ampliaria a redação grega. O pronome preserva a concisão e a tensão da fonte.
- issue: Relação sintática entre Ἰωακεὶμ e τοὺς μεγιστᾶνας
  choice: 'Entender o nome indeclinável Ἰωακείμ com valor possessivo: «os nobres de Jeoaquim».'
  alternative: 'Ler os dois elementos como objetos coordenados sem conjunção: «Jeoaquim e os nobres».'
  rationale: A forma indeclinável do nome permite valor genitivo, e a leitura «os nobres de Jeoaquim» corresponde à construção adotada pela camada de consulta auditada. Como a sequência grega é compacta e admite outra análise, a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Preferiu-se «Jeoaquim», forma bíblica portuguesa corrente, e conservaram-se a concisão do grego e a referência pronominal sem explicitação interpretativa no corpo do texto.
