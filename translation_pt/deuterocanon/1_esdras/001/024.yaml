base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/024.yaml
  text: Josiah met him[a]. And the king of Egypt sent word to him, saying, “What is there between me and you[b], O king of Judea?”
translation:
  language: pt
  text: 'Josias foi ao encontro dele. E o rei do Egito mandou-lhe dizer: “Que há entre mim e você,[a] rei da Judeia?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “Que tenho eu a ver com você?”'
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “rei da Judeia”; no paralelo histórico de Crônicas, corresponderia a “rei de Judá”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπάντησιν αὐτῷ Ἰωσείας
  choice: Josias foi ao encontro dele
  rationale: A construção grega é breve e elíptica, com o substantivo ἀπάντησιν (‘encontro’). A locução verbal portuguesa exprime naturalmente o movimento para um encontro sem definir se ele foi amistoso ou hostil.
- source_word: διεπέμψατο
  choice: mandou-lhe dizer
  rationale: O verbo indica o envio de uma comunicação, provavelmente por intermediários, sem mencionar explicitamente mensageiros. A formulação portuguesa comunica isso sem acrescentá-los ao texto.
- source_word: Τί ἐμοὶ καὶ σοὶ ἐστίν
  choice: Que há entre mim e você
  rationale: Mantém de modo compreensível a estrutura da fórmula grega e não intensifica indevidamente seu tom. A forma mais idiomática aparece em nota.
- source_word: βασιλεῦ τῆς Ἰουδαίας
  choice: rei da Judeia
  rationale: Reproduz diretamente a designação territorial grega Ἰουδαία. ‘Judá’, conforme o paralelo histórico, é registrado em nota.
theological_decisions:
- issue: Sentido e intensidade da fórmula Τί ἐμοὶ καὶ σοὶ ἐστίν
  choice: Que há entre mim e você
  alternative: Que tenho eu a ver com você?
  rationale: A tradução principal preserva a forma e a abertura pragmática do grego, enquanto a alternativa explicita mais fortemente a ideia de afastamento ou contestação.
- issue: Designação geográfica e política Ἰουδαίας
  choice: Judeia
  alternative: Judá
  rationale: A tradução segue prioritariamente o testemunho grego, sem substituir sua forma territorial pela designação encontrada no paralelo de Crônicas.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. Emprega-se “você” para naturalidade contemporânea e mantém-se o vocativo sem o arcaizante “ó”. Os marcadores foram posicionados junto às expressões a que suas respectivas notas se referem.
