base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/054.yaml
  text: And they were servants to him and to his sons until the Persians came to reign, to fulfill the word of the Lord by the mouth of Jeremiah.
translation:
  language: pt
  text: E foram servos dele e de seus filhos, até que os persas passaram a reinar, para que se cumprisse a palavra do Senhor proferida pela boca de Jeremias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παῖδες
  choice: servos
  rationale: No contexto de sujeição a um governante imperial, indica pessoas submetidas ao serviço dele, não meninos nem filhos. “Servos” preserva o sentido sem especificar além do texto a condição jurídica de escravidão.
- source_word: μέχρι οὗ βασιλεῦσαι Πέρσας
  choice: até que os persas passaram a reinar
  rationale: Expressa de modo natural o limite temporal e o início do domínio persa sugerido pelo infinitivo βασιλεῦσαι.
- source_word: εἰς ἀναπλήρωσιν
  choice: para que se cumprisse
  rationale: Comunica a relação de finalidade ou resultado entre a sujeição histórica e o cumprimento da palavra profética.
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: a palavra do Senhor
  rationale: ῥῆμα designa aqui a declaração profética divina; “palavra do Senhor” é uma formulação bíblica clara e consagrada.
- source_word: ἐν στόματι Ἰερεμίου
  choice: proferida pela boca de Jeremias
  rationale: Preserva a imagem do grego e explicita naturalmente em português que a palavra foi enunciada por intermédio de Jeremias.
theological_decisions:
- issue: Tradução de κύριος
  choice: Senhor
  alternative: SENHOR
  rationale: O texto-fonte grego traz κύριος. Embora o contexto profético possa corresponder ao nome divino hebraico, a tradução segue diretamente o testemunho grego de 1 Esdras.
- issue: Relação com o paralelo hebraico fornecido
  choice: Traduzir o enunciado grego sobre a servidão até o domínio persa e o cumprimento profético
  alternative: Ajustar o versículo ao paralelo aproximado sobre os utensílios do templo levados à Babilônia
  rationale: O paralelo massorético fornecido não corresponde de perto a este enunciado. Por isso, não deve substituir nem remodelar o texto grego, que é a fonte primária.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A formulação mantém o idiomatismo profético “pela boca de Jeremias” sem recorrer a arcaísmos desnecessários.
