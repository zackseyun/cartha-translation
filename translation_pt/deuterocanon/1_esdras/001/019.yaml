base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/019.yaml
  text: And all the kings of Israel had not kept such a Passover as Josias kept[c][b][a], and the priests and the Levites and the Judeans and all Israel who were found dwelling in Jerusalem.
translation:
  language: pt
  text: E nenhum dos reis de Israel celebrou uma Páscoa como a que celebraram Josias, os sacerdotes, os levitas, os judeus[a] e todo o Israel que se encontrava em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Neste contexto, «judeus» tem sobretudo sentido étnico-geográfico: o povo de Judá ou da Judeia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγον πάσχα
  choice: celebrou uma Páscoa
  rationale: Embora ἄγω signifique literalmente «conduzir» ou «levar», com πάσχα forma aqui uma expressão idiomática para observar ou celebrar a Páscoa. «Celebrou» é natural em português e preserva o sentido cultual.
- source_word: τοιοῦτον οἷον
  choice: uma Páscoa como a que
  rationale: A formulação conserva a força comparativa da construção correlativa grega em português corrente.
- source_word: Ἰωσείας
  choice: Josias
  rationale: «Josias» é a forma portuguesa tradicional e direta do nome grego Ἰωσείας, além de identificar claramente o mesmo rei conhecido no paralelo hebraico.
- source_word: Ἰουδαῖοι
  choice: judeus
  rationale: «Judeus» é a forma portuguesa corrente para Ἰουδαῖοι; neste contexto histórico, designa o povo ligado a Judá/Judeia. Uma nota registra a nuance étnico-geográfica.
- source_word: πᾶς Ἰσραὴλ
  choice: todo o Israel
  rationale: Mantém diretamente a expressão coletiva grega, sem restringir seu alcance.
- source_word: οἱ εὑρεθέντες
  choice: que foi encontrado
  rationale: Preserva o valor literal do particípio passivo, concordando em português com o coletivo singular «Israel», ainda que contextualmente possa significar os que estavam presentes.
- source_word: ἐν τῇ κατοικήσει αὐτῶν ἐν Ἰερουσαλήμ
  choice: residindo em Jerusalém
  rationale: Expressa com clareza o sentido locativo e residencial da frase grega, cuja construção literal seria pouco natural em português.
theological_decisions:
- issue: Alcance de «todos os reis de Israel»
  choice: Manter a afirmação histórica ampla como «todos os reis de Israel».
  alternative: Restringir a expressão aos reis de Judá ou aos reis anteriores.
  rationale: O grego diz explicitamente πάντες οἱ βασιλεῖς τοῦ Ἰσραήλ. A tradução não harmoniza nem reduz esse alcance.
- issue: Relação sintática entre Josias e os demais participantes
  choice: 'Preservar a coordenação simples: «Josias celebrou, e os sacerdotes...»'
  alternative: Explicitar «Josias celebrou junto com os sacerdotes...»
  rationale: O grego coordena Josias, sacerdotes, levitas, judeus e todo Israel com καί. A redação mantém essa estrutura sem acrescentar uma relação não expressa, embora em português a elipse do verbo permaneça compreensível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação algo solene reflete a estrutura do grego. Os marcadores [a] e [b] aparecem no texto principal em sua ordem de ocorrência.
