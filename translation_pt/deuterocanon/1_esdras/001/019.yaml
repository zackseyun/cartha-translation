revisions:
- from: E nenhum de todos os reis de Israel celebrou uma Páscoa como a que Josias[a] celebrou, e os sacerdotes, os levitas, os judeus[b] e todo o Israel que foi encontrado residindo em Jerusalém.
  to: E nenhum dos reis de Israel celebrou uma Páscoa como a que celebraram Josias, os sacerdotes, os levitas, os judeus[a] e todo o Israel que se encontrava em Jerusalém.
  rationale: A revisão preserva a negação abrangente («nenhum dos reis de Israel»), a comparação enfatizada pelo grego e a coordenação de Josias com os demais participantes. A forma verbal plural elimina a ambiguidade introduzida pela elipse, e «que se encontrava em Jerusalém» comunica naturalmente o sentido contextual de «os que foram encontrados» na cidade. O marcador referente ao nome foi removido por não haver diferença informativa relevante em português; a nota lexical sobre «judeus» foi mantida e reancorada como [a].
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:33:45Z'
review_pass:
  verdict: revise
  source_fidelity: A comparação e a enumeração são preservadas, mas a elipse verbal na redação atual torna ambígua a participação de Josias, sacerdotes, levitas, judeus e todo Israel. A revisão explicita, sem acrescentar conteúdo, que todos celebraram a Páscoa mencionada. Também substitui «foi encontrado residindo», construção pouco natural e de concordância semanticamente problemática, por uma formulação portuguesa clara para οἱ εὑρεθέντες ... ἐν Ἰερουσαλήμ.
  naturalness: «Nenhum de todos os reis» é aceitável, mas «Nenhum dos reis» é mais idiomático. «Como a que celebraram Josias, os sacerdotes...» resolve a coordenação grega de modo claro e fluente. «Que se encontrava em Jerusalém» transmite adequadamente a ideia contextual de israelitas presentes/residentes na cidade sem uma literalidade artificial.
  terminology: '«Páscoa», «Josias», «sacerdotes», «levitas», «judeus» e «todo o Israel» são apropriados ao registro e ao uso português. A nota sobre «judeus» mantém de maneira equilibrada a nuance étnico-geográfica de Ἰουδαῖοι. A nota do marcador [a] é dispensável: em português, tanto a forma grega Ἰωσείας quanto o nome do rei no paralelo hebraico correspondem normalmente a «Josias», de modo que a nota não informa uma diferença relevante.'
  issues:
  - severity: medium
    issue: A enumeração após «Josias celebrou» fica sintaticamente ambígua.
    rationale: Em «como a que Josias celebrou, e os sacerdotes, os levitas...», o verbo elíptico pode ser entendido de formas desencontradas. O grego coordena Josias e os demais como participantes da celebração comparada; a repetição do verbo no plural em português esclarece isso.
  - severity: medium
    issue: «Todo o Israel que foi encontrado residindo em Jerusalém» é pouco natural.
    rationale: O particípio plural οἱ εὑρεθέντες alude aos israelitas que se achavam em Jerusalém. A forma singular passiva «foi encontrado residindo» soa rígida e não expressa bem essa referência coletiva.
  - severity: low
    issue: A nota [a] não é necessária em português.
    rationale: Não há contraste prático entre «Josias» no texto português e a forma usual portuguesa do nome correspondente no paralelo hebraico; sua remoção evita uma nota sem função tradutória.
  revised_text: E nenhum dos reis de Israel celebrou uma Páscoa como a que celebraram Josias, os sacerdotes, os levitas, os judeus[a] e todo o Israel que se encontrava em Jerusalém.
  revised_footnotes:
  - marker: a
    text: 'Neste contexto, «judeus» tem sobretudo sentido étnico-geográfico: o povo de Judá ou da Judeia.'
    reason: lexical_alternative
  revision_rationale: A revisão preserva a negação abrangente («nenhum dos reis de Israel»), a comparação enfatizada pelo grego e a coordenação de Josias com os demais participantes. A forma verbal plural elimina a ambiguidade introduzida pela elipse, e «que se encontrava em Jerusalém» comunica naturalmente o sentido contextual de «os que foram encontrados» na cidade. O marcador referente ao nome foi removido por não haver diferença informativa relevante em português; a nota lexical sobre «judeus» foi mantida e reancorada como [a].
