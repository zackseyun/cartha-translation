base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/021.yaml
  text: And the deeds of Josiah were upright before his Lord[b][a], with a heart full of godliness.
translation:
  language: pt
  text: E os feitos de Josias foram retos[a] diante do seu Senhor, com o coração cheio de devoção[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foram endireitados” ou “foram estabelecidos como retos” diante do seu Senhor.
    reason: lexical_alternative
  - marker: b
    text: O termo grego também pode ser traduzido por “piedade” ou “reverência”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠρθώθη
  choice: foram retos
  rationale: Expressa de modo natural em português a avaliação moral dos feitos de Josias diante do Senhor. A nota preserva a possível força passiva de ὀρθόω.
- source_word: τὰ ἔργα
  choice: os feitos
  rationale: Refere-se às ações ou à conduta de Josias; “feitos” evita a possível abstração teológica de “obras”.
- source_word: Ἰωσείου
  choice: Josias
  rationale: Forma tradicional e amplamente reconhecida do nome em português, correspondente ao grego Ἰωσείου e ao hebraico יֹאשִׁיָּהוּ.
- source_word: ἐνώπιον
  choice: diante de
  rationale: Preserva o sentido de estar perante alguém e sob sua avaliação.
- source_word: τοῦ κυρίου αὐτοῦ
  choice: do seu Senhor
  rationale: Segue diretamente o grego, que diz “seu Senhor”, sem acrescentar “Deus” nem substituir a expressão por “SENHOR”.
- source_word: ἐν καρδίᾳ πλήρει
  choice: com o coração cheio de
  rationale: Formulação idiomática em português que mantém o coração como sede da disposição interior.
- source_word: εὐσεβείας
  choice: devoção
  rationale: Comunica a piedade ou reverência religiosa de maneira clara, atual e digna.
theological_decisions:
- issue: Se κύριος deve ser ampliado sob influência de uma tradição hebraica paralela
  choice: seu Senhor
  alternative: o SENHOR; o Senhor, seu Deus
  rationale: O texto grego é a fonte primária e traz τοῦ κυρίου αὐτοῦ, sem θεός. A tradução conserva essa formulação mais restrita.
- issue: Nuance de εὐσέβεια
  choice: devoção
  alternative: piedade; reverência
  rationale: “Devoção” preserva o caráter explicitamente religioso sem impor uma conotação confessional específica; as demais nuances permanecem na nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura permanece próxima do grego, mas evita construções artificiais; as ambiguidades lexicais relevantes são preservadas em notas.
