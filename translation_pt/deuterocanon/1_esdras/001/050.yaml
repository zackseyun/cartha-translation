base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/050.yaml
  text: These men killed their young men with the sword around the holy temple[a], and they showed no mercy to young man or virgin, old man or youth[b],
translation:
  language: pt
  text: Esses homens mataram à espada seus jovens ao redor do santo templo e não pouparam nem jovem, nem virgem, nem homem idoso, nem pessoa mais jovem[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem rapaz, nem virgem, nem homem idoso, nem jovem”. O último termo grego significa, mais literalmente, “pessoa mais jovem”.'
    reason: lexical_alternative
  - marker: b
    text: O paralelo hebraico fornecido para este ponto é apenas aproximado e apresenta uma redação diferente; o texto grego descreve especificamente uma matança ao redor do templo.
    reason: cross_reference
lexical_decisions:
- source_word: οὗτοι
  choice: Esses homens
  rationale: O demonstrativo retoma os invasores mencionados anteriormente; “esses homens” explicita o referente sem acrescentar conteúdo.
- source_word: ἀπέκτειναν
  choice: mataram
  rationale: Verbo direto e corrente, adequado ao tom narrativo e à violência explícita do texto.
- source_word: τοὺς νεανίσκους αὐτῶν
  choice: os jovens deles
  rationale: Mantém tanto o sentido de νεανίσκους como o possessivo αὐτῶν, sem substituir o referente por uma identificação não expressa no grego.
- source_word: ἐν ῥομφαίᾳ
  choice: à espada
  rationale: Expressão bíblica natural em português para indicar o instrumento da matança.
- source_word: περικύκλῳ τοῦ ἁγίου ἱεροῦ
  choice: ao redor do templo santo
  rationale: περικύκλῳ indica a área circundante, e ἱερόν designa o templo ou seu complexo, não especificamente o santuário interior.
- source_word: οὐκ ἐφείσαντο
  choice: não pouparam
  rationale: Tradução direta e idiomática do verbo no contexto de massacre, preservando a força de não deixar nenhuma categoria ilesa.
- source_word: νεανίσκου καὶ παρθένου καὶ πρεσβύτου καὶ νεωτέρου
  choice: nem jovem, nem virgem, nem idoso, nem pessoa mais nova
  rationale: Conserva a enumeração distributiva e distingue νεανίσκος de νεώτερος; “pessoa mais nova” preserva o caráter substantivado e comparativo do último termo.
theological_decisions:
- issue: Relação entre o texto grego e o paralelo hebraico fornecido
  choice: Traduzir diretamente a descrição grega da matança ao redor do templo
  alternative: Harmonizar o versículo com o paralelo hebraico sobre os chefes, o povo e a profanação da Casa do SENHOR
  rationale: O grego é a fonte primária indicada e contém inequivocamente a descrição da matança. O paralelo hebraico é apenas aproximado e pertence a uma formulação contextual diferente; harmonizá-los apagaria a leitura efetiva de 1 Esdras.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A formulação evita arcaísmos como “donzela” e preserva a repetição parcialmente sobreposta das categorias etárias no grego, sem harmonizá-la.
