base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/029.yaml
  text: And he got onto his second chariot[a]; and after being brought back to Jerusalem[b], he ended his life and was buried in his ancestral tomb.
translation:
  language: pt
  text: E ele subiu no seu segundo carro; depois de ser levado de volta a Jerusalém, morreu[a] e foi sepultado no túmulo de seus antepassados.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “trocou sua vida”; é uma expressão grega usada para indicar a morte.
    reason: lexical_alternative
  - marker: b
    text: O texto hebraico paralelo em 2 Crônicas 35:24 fala do “segundo carro” e acrescenta que todo Judá e Jerusalém prantearam Josias. Aqui, 1 Esdras é mais breve e emprega “túmulo” no singular.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνέβη ἐπὶ τὸ ἅρμα τὸ δεύτερον αὐτοῦ
  choice: subiu em seu segundo carro
  rationale: 'Preserva o movimento expresso por ἀνέβη e entende ἅρμα como carro de guerra ou transporte. δεύτερον é atributivo: trata-se do segundo carro dele, provavelmente um veículo de reserva.'
- source_word: ἀποκατασταθεὶς εἰς Ἰερουσαλήμ
  choice: depois de ser levado de volta a Jerusalém
  rationale: Mantém o valor passivo do particípio e, no contexto narrativo, indica que ele foi transportado de volta, não que simplesmente retornou por conta própria.
- source_word: μετήλλαξεν τὸν βίον αὐτοῦ
  choice: morreu
  rationale: A expressão grega significa literalmente que ele 'trocou/deixou esta vida', funcionando como eufemismo idiomático para morrer. A tradução direta comunica o sentido sem sugerir que ele deliberadamente pôs fim à própria vida.
- source_word: ἐτάφη ἐν τῷ πατρικῷ τάφῳ
  choice: foi sepultado no túmulo de seus antepassados
  rationale: ἐτάφη é o passivo comum de 'sepultar'. πατρικός indica vínculo com os pais ou antepassados, e o singular τάφος é preservado como 'túmulo'.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Carro' é preferido a 'carruagem' por ser mais amplo e tradicional no contexto bíblico; a nota esclarece apenas a expressão idiomática de morte e a diferença do paralelo hebraico.
