base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/048.yaml
  text: And the God of their fathers sent by his angel to visit their people and to call them back[b][a], because he had compassion on them and on his dwelling place.
translation:
  language: pt
  text: E o Rei dos pais deles, o Deus dos pais deles, enviou, por meio do seu anjo, para visitar o povo deles e chamá-los de volta[a], porque teve compaixão deles e da sua morada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu mensageiro”; a palavra grega pode significar tanto “anjo” como “mensageiro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς τῶν πατέρων αὐτῶν, ὁ θεὸς τῶν πατέρων αὐτῶν
  choice: o Rei dos pais deles, o Deus dos pais deles
  rationale: Preserva as duas designações divinas justapostas no grego transmitido, apesar de sua formulação incomum, sem emendar nem omitir uma delas.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Equivalente narrativo direto e natural do aoristo de ἀποστέλλω.
- source_word: ἐπισκέψασθαι τὸν λαὸν αὐτῶν
  choice: para visitar o povo deles
  rationale: Mantém o idioma bíblico de visita com cuidado ou intervenção e conserva o pronome plural incomum do texto grego.
- source_word: διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: o seu anjo
  rationale: No contexto de envio divino, 'anjo' é a leitura principal natural; a possibilidade lexical de 'mensageiro' fica registrada em nota.
- source_word: μετακαλέσαι αὐτούς
  choice: e chamá-los de volta
  rationale: Expressa a força de convocar ou chamar de volta sem tornar explícito além do grego o destino desse retorno.
- source_word: καθὸ ἐφείδετο αὐτῶν
  choice: porque teve compaixão deles
  rationale: Neste contexto, φείδομαι comunica piedade e cuidado; 'teve compaixão' é claro e digno em português atual.
- source_word: τοῦ σκηνώματος αὐτοῦ
  choice: da sua morada
  rationale: Preserva o sentido de lugar de habitação divina sem especificar indevidamente 'tabernáculo' ou 'templo'.
theological_decisions:
- issue: A designação dupla e incomum de Deus no início
  choice: Manter 'o Rei dos pais deles, o Deus dos pais deles' como títulos em aposição
  alternative: Omitir 'o Rei dos pais deles' como possível corrupção textual ou reformular 'o rei e o Deus dos pais deles'
  rationale: O grego primário contém as duas expressões. Mantê-las respeita a evidência transmitida e evita corrigir silenciosamente uma dificuldade textual genuína.
- issue: O sentido de ἄγγελος
  choice: anjo
  alternative: mensageiro
  rationale: O agente enviado por Deus é naturalmente entendido como anjo neste contexto bíblico, mas a palavra grega admite também 'mensageiro'; a nota conserva essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A sintaxe preserva a estranheza significativa da dupla designação divina e o pronome 'deles' do grego, sem suavização silenciosa.
