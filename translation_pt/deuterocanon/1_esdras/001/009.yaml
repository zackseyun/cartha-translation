base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/009.yaml
  text: And Iechonias and Samaias and Nathanael his brother, and Sabias and Ochielos and Joram, commanders of thousands, gave to the Levites for the Passover one thousand sheep and seven hundred calves.
translation:
  language: pt
  text: E Jeconias, Samaías, Natanael, seu irmão, Sabias, Oquiel e Jorão, chefes de mil, deram aos levitas, para a Páscoa, mil ovelhas e setecentos bezerros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico paralelo de 2 Crônicas 35:9 traz nomes diferentes e menciona 2.600 animais para a Páscoa e 300 bois. Como 1 Esdras é traduzido aqui de seu texto grego, os nomes e números do grego foram mantidos no texto principal.
    reason: textual_variant
lexical_decisions:
- source_word: χιλίαρχοι
  choice: chefes de mil
  rationale: Preserva o sentido formal do título grego, isto é, líderes responsáveis por mil, sem introduzir a conotação especificamente romana de “tribunos” nem pressupor uma função exclusivamente militar.
- source_word: εἰς πάσχα
  choice: para a Páscoa
  rationale: Expressa de modo natural a finalidade ou destinação dos animais, mantendo aberta a nuance exata entre celebração, refeição e sacrifício pascal.
- source_word: πρόβατα
  choice: ovelhas
  rationale: É a tradução direta e corrente do termo grego neste contexto, embora πρόβατα possa designar mais amplamente animais do rebanho miúdo.
- source_word: μόσχους
  choice: bezerros
  rationale: Traduz diretamente μόσχους sem especificar sexo ou idade além do que o substantivo normalmente sugere.
- source_word: ὁ ἀδελφὸς
  choice: seu irmão
  rationale: Em português, a identificação pede normalmente um possessivo; o antecedente mais natural é Jeconias, embora o grego diga literalmente “o irmão” e não torne a relação inteiramente explícita.
- source_word: ἔδωκαν τοῖς Λευείταις
  choice: deram aos levitas
  rationale: Mantém a construção simples de transferência, sem ampliar o sentido para uma provisão administrativa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes próprios em formas legíveis e usuais em português. A coordenação da lista foi simplificada segundo o uso natural do idioma, sem alterar seus integrantes. A nota textual registra a divergência substancial do paralelo hebraico.
