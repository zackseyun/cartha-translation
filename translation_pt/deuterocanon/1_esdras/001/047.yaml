base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/047.yaml
  text: And the leaders of the people and of the priests also committed much impiety and lawlessness[a], beyond all the uncleannesses of all the nations, and they defiled the sanctuary of the Lord[c][b], which had been sanctified in Jerusalem.
translation:
  language: pt
  text: Também os líderes do povo e dos sacerdotes cometeram muitos atos de impiedade e de transgressão, indo além de todas as impurezas de todas as nações[a], e profanaram o santuário[b] do Senhor, consagrado em Jerusalém[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mais do que todas as impurezas de todas as nações”. A expressão grega indica excesso ou superação; “impurezas” também pode ser traduzido por “contaminações” ou “profanidades”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o templo”. O termo grego pode designar o santuário ou, em sentido mais amplo, o recinto do templo.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “o santuário do Senhor, o que é santificado em Jerusalém”. O particípio pode caracterizá-lo como consagrado, sem indicar claramente o momento da consagração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἡγούμενοι
  choice: os líderes
  rationale: Expressa de modo natural aqueles que dirigiam ou governavam, sem pressupor um cargo formal específico.
- source_word: τοῦ λαοῦ καὶ τῶν ἱερέων
  choice: do povo e dos sacerdotes
  rationale: Mantém os dois grupos ligados aos líderes e implica tanto a liderança popular quanto a sacerdotal.
- source_word: πολλὰ ἠσέβησαν καὶ ἠνόμησαν
  choice: cometeram muitos atos de impiedade e de transgressão
  rationale: 'Conserva a intensidade de πολλά e os dois aspectos da acusação: irreverência religiosa e violação da lei.'
- source_word: ὑπὲρ πάσας τὰς ἀκαθαρσίας πάντων τῶν ἐθνῶν
  choice: indo além de todas as impurezas de todas as nações
  rationale: ὑπέρ indica excesso ou superação; “impurezas” preserva o registro moral e ritual, e “nações” é adequado ao contexto histórico.
- source_word: ἐμίαναν
  choice: profanaram
  rationale: No contexto cultual, “profanaram” comunica claramente a contaminação de um espaço sagrado.
- source_word: τὸ ἱερὸν τοῦ κυρίου
  choice: o santuário do Senhor
  rationale: ἱερόν pode designar o santuário ou, mais amplamente, o recinto do templo; “santuário” ressalta o caráter sagrado no contexto da profanação.
- source_word: τὸ ἁγιαζόμενον
  choice: consagrado
  rationale: O particípio passivo caracteriza o santuário como santificado ou consagrado; a forma concisa é natural em português e não força o aspecto temporal.
- source_word: ἐν Ἰερουσαλήμ
  choice: em Jerusalém
  rationale: Tradução locativa direta do topônimo.
theological_decisions:
- issue: Tradução de κύριος em referência ao Deus de Israel
  choice: Senhor
  alternative: SENHOR
  rationale: “Senhor” traduz diretamente o grego κύριος e conserva o uso tradicional sem inserir no texto grego o nome divino hebraico.
- issue: Registro cultual de ἀκαθαρσίαι e μιαίνω
  choice: impurezas; profanaram
  alternative: contaminações; contaminaram
  rationale: As escolhas preservam a dimensão moral e ritual da linguagem e sua relação com o espaço sagrado, sem limitar os termos a sujeira física.
- issue: Valor temporal de τὸ ἁγιαζόμενον
  choice: consagrado
  alternative: que havia sido consagrado
  rationale: O particípio presente passivo pode caracterizar o santuário sem definir explicitamente quando ocorreu sua consagração; a tradução evita resolver indevidamente essa nuance.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A formulação mantém a acumulação solene da acusação grega, mas evita construções excessivamente literais. “Transgressão” explicita a dimensão de violação da lei, e “profanaram” se ajusta ao contexto cultual.
