base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/008.yaml
  text: These things were given from the royal possessions[a], according to the promise, to the people and to the priests and Levites. And Helkias, Zechariah, and Esyelos, the overseers of the sanctuary, gave to the priests for the Passover two thousand six hundred sheep[c][b], and three hundred calves.
translation:
  language: pt
  text: Tudo isso foi dado dos bens do rei, conforme a promessa[a], ao povo, aos sacerdotes e aos levitas. Helquias, Zacarias e Esielos[b], os supervisores do santuário, deram aos sacerdotes, para a Páscoa, duas mil e seiscentas ovelhas[c] e trezentos bezerros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como havia sido prometido”. O grego diz literalmente “conforme a promessa” e não identifica aqui quem a fez.'
    reason: lexical_alternative
  - marker: b
    text: O paralelo hebraico de 2 Crônicas 35:8 traz os nomes em forma hebraica, comumente vertidos como “Hilquias ... Jeiel”. O texto grego de 1 Esdras traz “Helquias ... Esielos”.
    reason: alternative_reading
  - marker: c
    text: O paralelo hebraico menciona explicitamente cordeiros e cabritos; o grego aqui emprega πρόβατα, traduzido como “ovelhas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: Tudo isso
  rationale: Retoma coletivamente os bens ou animais mencionados antes, sem especificar além do que o demonstrativo grego permite.
- source_word: ἐκ τῶν βασιλικῶν
  choice: dos bens reais
  rationale: Expressa a procedência a partir das posses da coroa ou do rei e concorda com o sentido do paralelo hebraico.
- source_word: κατʼ ἐπαγγελίαν
  choice: conforme a promessa
  rationale: Preserva a forma nominal e a ambiguidade do grego quanto à pessoa que fez a promessa.
- source_word: οἱ ἐπιστάται τοῦ ἱεροῦ
  choice: os supervisores do santuário
  rationale: ἐπιστάται designa os responsáveis encarregados de algo; 'santuário' conserva a dimensão sagrada de ἱερόν.
- source_word: εἰς πάσχα
  choice: para a Páscoa
  rationale: Indica a finalidade dos animais no contexto da celebração pascal.
- source_word: πρόβατα
  choice: ovelhas
  rationale: É o equivalente direto e corrente; o paralelo hebraico é mais específico e por isso é registrado em nota, sem substituir o texto grego.
- source_word: μόσχους
  choice: bezerros
  rationale: Traduz diretamente o termo para bovinos jovens sem restringi-lo indevidamente a machos.
