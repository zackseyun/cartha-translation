base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/044.yaml
  text: And he appointed Zedekiah king of Judea and Jerusalem; Zedekiah was twenty-one years old[a], and he reigned eleven years.
translation:
  language: pt
  text: E ele nomeou Zedequias rei da Judeia e de Jerusalém[a]. Zedequias tinha vinte e um anos e reinou durante onze anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz «Judeia e Jerusalém». O texto principal segue a fonte grega de 1 Esdras e não a harmoniza com a forma «Judá» encontrada em tradições hebraicas paralelas.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέδειξεν
  choice: nomeou
  rationale: Expressa a designação formal para o cargo real de modo claro e natural em português.
- source_word: Σεδεκίαν
  choice: Zedequias
  rationale: Forma tradicional e amplamente reconhecida do nome bíblico em português.
- source_word: βασιλέα τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: rei da Judeia e de Jerusalém
  rationale: Reproduz diretamente a construção grega e conserva a designação geográfica «Judeia», sem harmonizá-la com a forma «Judá» de tradições hebraicas paralelas.
- source_word: ὄντα ἐτῶν εἴκοσι ἑνός
  choice: tinha vinte e um anos quando começou a reinar
  rationale: Verte a fórmula de idade em português bíblico atual e natural; o contexto régio deixa claro que se trata da idade ao assumir o trono.
- source_word: βασιλεύει δὲ ἔτη ἕνδεκα
  choice: e reinou durante onze anos
  rationale: Tradução idiomática e direta da duração do reinado.
