  yaml_path: translation/deuterocanon/1_esdras/001/002.yaml
  text: having stationed the priests in their divisions[c][b][a], arrayed in the temple of the Lord.
translation:
  language: pt
  text: tendo disposto os sacerdotes segundo seus turnos de serviço,[a] devidamente trajados,[b] no templo do Senhor.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo suas divisões” ou “conforme suas escalas”; a expressão se refere aos grupos sacerdotais organizados em turnos de serviço.
    reason: lexical_alternative
  - marker: b
    text: Ou “vestidos com seus trajes” ou “paramentados”; o grego indica que estavam trajados ou adornados, provavelmente com a indumentária sacerdotal.
    reason: lexical_alternative
  - marker: c
    text: O grego diz “no templo do Senhor”; o paralelo hebraico traz “para o serviço da casa do SENHOR”.
    reason: alternative_reading
lexical_decisions:
- source_word: στήσας
  choice: tendo disposto
  rationale: O particípio aoristo de ἵστημι indica que os sacerdotes foram colocados ou organizados em suas funções; “tendo disposto” conserva a ligação participial com a narrativa e soa natural em português.
- source_word: τοὺς ἱερεῖς
  choice: os sacerdotes
  rationale: Equivalente direto e corrente para o objeto acusativo grego.
- source_word: κατʼ ἐφημερίας
  choice: segundo seus turnos de serviço
  rationale: ἐφημερία designa uma divisão sacerdotal com período determinado de serviço. A expressão explicita de modo natural tanto a organização em grupos quanto a rotação funcional, em consonância com o paralelo hebraico מִשְׁמְרוֹתָם.
- source_word: ἐστολισμένους
  choice: devidamente trajados
  rationale: O particípio de στολίζω descreve os sacerdotes vestidos ou paramentados. “Devidamente trajados” sugere a indumentária condizente com o serviço sacerdotal sem afirmar explicitamente que o substantivo “vestes sacerdotais” ocorre no grego.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: ἱερόν designa aqui o templo ou recinto sagrado. “No templo” é a formulação portuguesa mais clara e segue diretamente o texto grego, mantendo em nota a formulação diferente do paralelo hebraico.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: Traduz diretamente o grego κυρίου, fonte primária do versículo, embora o paralelo hebraico contenha o nome divino YHWH.
theological_decisions:
- issue: Tradução de κύριος quando o paralelo hebraico traz YHWH
  choice: do Senhor
  alternative: do SENHOR
  rationale: A fonte primária é o grego, que lê κυρίου. “Senhor” preserva essa forma textual, enquanto a correspondência com YHWH no paralelo hebraico é registrada em nota.
- issue: Grau de explicitação da roupa sacerdotal
  choice: devidamente trajados
  alternative: vestidos com as vestes sacerdotais
  rationale: O grego indica que estavam vestidos ou adornados, mas não nomeia expressamente as vestes sacerdotais. A tradução evita transformar uma inferência contextual plausível em afirmação explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A construção participial foi mantida porque o versículo continua a frase do contexto anterior. Evitou-se tanto o arcaísmo “turmas sacerdotais” sem explicação quanto a especificação excessiva de “vestes sacerdotais” no texto principal.
