base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/025.yaml
  text: Was I not sent against you by the Lord God? For my war is on the Euphrates[a], and now the Lord is with me, and the Lord is with me, urging me on. Stand aside[b], and do not oppose the Lord.
translation:
  language: pt
  text: “Não foi contra você que fui enviado pelo Senhor Deus? Pois a minha guerra é junto ao Eufrates[a]. E agora o Senhor está comigo, e o Senhor está comigo, apressando-me[b]. Afaste-se e não se oponha ao Senhor.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no Eufrates” ou “às margens do Eufrates”. A expressão grega indica o local da campanha de Neco; o paralelo hebraico menciona Carquemis, junto ao Eufrates.
    reason: lexical_alternative
  - marker: b
    text: Ou “impelindo-me”, “apressando-me” ou “fazendo-me avançar depressa”. O particípio grego indica que o Senhor pressiona a campanha a avançar.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ πρὸς σὲ ἐξαπέσταλμαι
  choice: Não foi contra você que fui enviado
  rationale: A pergunta retórica espera resposta afirmativa. No contexto militar, πρὸς σὲ tem sentido adversativo; a construção portuguesa preserva a ênfase em que a missão não tinha Josias como alvo.
- source_word: ὑπὸ Κυρίου τοῦ θεοῦ
  choice: pelo Senhor Deus
  rationale: Reproduz naturalmente a designação divina do grego sem acrescentar o possessivo “meu”.
- source_word: ἐπὶ γὰρ τοῦ Εὐφράτου ὁ πόλεμός μού ἐστιν
  choice: Pois a minha guerra é junto ao Eufrates
  rationale: Mantém o possessivo enfático e entende ἐπί com genitivo como localização da campanha. “Junto ao” é natural e não especifica mais precisamente do que o grego se a ação ocorre no rio, às suas margens ou na região.
- source_word: μετʼ ἐμοῦ
  choice: está comigo
  rationale: Preserva a fórmula de apoio divino e sua repetição, sem explicitá-la como “está do meu lado”.
- source_word: ἐπισπεύδων
  choice: apressando-me
  rationale: O particípio indica que o Senhor acelera ou impele o avanço. A tradução conserva a forma participial e a leve ambiguidade entre acelerar a pessoa e fazê-la prosseguir com urgência.
- source_word: ἀπόστηθι
  choice: Afaste-se
  rationale: Imperativo que ordena a Josias retirar-se e deixar de interferir; é claro e corrente em português.
- source_word: μὴ ἐναντίου τῷ κυρίῳ
  choice: não se oponha ao Senhor
  rationale: Expressa diretamente a força adversativa da construção e preserva a alegação de que resistir à campanha seria resistir ao Senhor.
theological_decisions:
- issue: Referência de κύριος no discurso de Neco
  choice: Senhor
  alternative: senhor; uma divindade; o deus de Neco
  rationale: O grego emprega Κυρίου τοῦ θεοῦ e depois repete Κύριος. A tradução apresenta a reivindicação de autorização divina feita por Neco sem confirmar, atenuar ou reinterpretar essa reivindicação.
- issue: Repetição de “o Senhor está comigo”
  choice: Preservar integralmente a repetição
  alternative: Condensar para “o Senhor está comigo e me apressa”
  rationale: A repetição pertence ao texto grego e reforça retoricamente a alegação de apoio divino; não deve ser eliminada por razões de estilo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” no discurso direto para clareza contemporânea, conserva a repetição enfática do grego e evita resolver a tensão teológica da alegação de Neco.
