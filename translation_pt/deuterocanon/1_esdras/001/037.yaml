base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/037.yaml
  text: Jehoiakim was twenty-five years old when he became king of Judea and Jerusalem[a], and he did what was evil before the Lord.
translation:
  language: pt
  text: Jeoaquim tinha vinte e cinco anos quando se tornou rei da Judeia e de Jerusalém[a], e fez o que era mau diante do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Judá e Jerusalém”. O texto grego diz “Judeia e Jerusalém”, enquanto a tradição hebraica paralela costuma falar de “Judá e Jerusalém”.'
    reason: Leitura alternativa decorrente da diferença entre o texto grego primário e a tradição hebraica paralela.
lexical_decisions:
- source_word: Ἐτῶν δὲ ἦν εἴκοσι πέντε
  choice: tinha vinte e cinco anos
  rationale: É a fórmula grega habitual para indicar idade; a tradução é natural em português moderno e preserva com precisão o sentido.
- source_word: Ἰωακεὶμ
  choice: Joaquim
  rationale: Emprega a forma bíblica tradicional e amplamente reconhecida em português para o rei identificado no paralelo hebraico como Jeoaquim.
- source_word: ὅτε ἐβασίλευσεν
  choice: quando se tornou rei
  rationale: Nesse contexto de idade de ascensão, o aoristo indica naturalmente o início do reinado, não toda a sua duração.
- source_word: τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: da Judeia e de Jerusalém
  rationale: Segue diretamente o grego Ἰουδαίας, que designa a Judeia; a repetição de 'de' torna clara e natural em português a relação com os dois nomes.
- source_word: ἐποίησεν τὸ πονηρὸν
  choice: fez o que era mau
  rationale: Reproduz o conhecido idiomatismo bíblico de avaliação moral em linguagem clara e digna.
- source_word: ἐνώπιον Κυρίου
  choice: diante do Senhor
  rationale: Traduz de modo conciso a ideia de agir perante ou à vista do Senhor e mantém κύριος como 'Senhor', conforme o texto grego.
theological_decisions:
- issue: Tradução de Κυρίου
  choice: do Senhor
  alternative: de Yahweh; do SENHOR
  rationale: A fonte primária traz o grego κύριος. 'Senhor' traduz diretamente esse termo sem retroverter silenciosamente para o tetragrama hebraico.
- issue: Designação geográfica e política Ἰουδαίας
  choice: Judeia
  alternative: Judá
  rationale: A tradução principal segue o testemunho grego, que traz Ἰουδαίας. A forma 'Judá', associada à tradição hebraica paralela, é preservada em nota sem substituir a leitura da fonte primária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Mantém a cadência narrativa bíblica sem arcaísmos desnecessários.
