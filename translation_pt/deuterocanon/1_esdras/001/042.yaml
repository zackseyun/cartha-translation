base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/042.yaml
  text: He reigned three months and ten days in Jerusalem[a], and he did what was evil before the Lord.
translation:
  language: pt
  text: Reinou três meses e dez dias em Jerusalém e fez o que era mau diante do Senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «aos olhos do Senhor».'
    reason: Alternativa lexical para ἔναντι Κυρίου, destacando a ideia de avaliação divina.
lexical_decisions:
- source_word: βασιλεύει
  choice: Reinou
  rationale: O presente histórico grego descreve o reinado passado do monarca; o pretérito perfeito é a forma natural em português narrativo.
- source_word: μῆνας τρεῖς καὶ ἡμέρας δέκα
  choice: três meses e dez dias
  rationale: Reproduz diretamente a expressão grega de duração, sem necessidade de acrescentar a preposição «por».
- source_word: ἐν Ἰερουσαλήμ
  choice: em Jerusalém
  rationale: Mantém a indicação locativa da cidade onde exerceu o reinado.
- source_word: ἐποίησεν τὸ πονηρόν
  choice: fez o que era mau
  rationale: Preserva o substantivo adjetival grego e expressa de modo claro e corrente a avaliação moral da ação.
- source_word: ἔναντι Κυρίου
  choice: diante do Senhor
  rationale: Mantém a imagem relacional e judicial da expressão bíblica, que indica a avaliação divina, sem reduzir seu sentido apenas à percepção visual.
theological_decisions:
- issue: Tradução de Κυρίου
  choice: Senhor
  alternative: SENHOR
  rationale: O texto-fonte grego traz Κυρίου. Embora contextos hebraicos paralelos possam refletir o nome divino YHWH, a tradução segue primariamente a testemunha grega e não importa para o texto principal a convenção tipográfica «SENHOR».
- issue: Sentido de ἔναντι Κυρίου
  choice: diante do Senhor
  alternative: aos olhos do Senhor
  rationale: «Diante do Senhor» conserva a amplitude da expressão grega, que pode envolver presença e avaliação divina; a alternativa visual é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa concisa. O sujeito permanece implícito, como é natural em português e como permite o verbo grego. O marcador da nota foi colocado após a expressão a que efetivamente se refere.
