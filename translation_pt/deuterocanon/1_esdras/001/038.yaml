base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/038.yaml
  text: After him Nebuchadnezzar king of Babylon came up[a], and he bound him with bronze chains and carried him away to Babylon.
translation:
  language: pt
  text: Depois dele, subiu[a] Nabucodonosor, rei da Babilônia; amarrou-o com correntes de bronze e levou-o para a Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “avançou”. O verbo grego significa literalmente “subiu”, mas, neste contexto, pode descrever o avanço de um rei contra um território.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετʼ αὐτὸν
  choice: Depois dele
  rationale: Preserva a referência pessoal e a sucessão temporal expressa no grego.
- source_word: ἀνέβη
  choice: subiu
  rationale: Mantém a imagem direcional do verbo grego sem explicitar além do texto uma campanha militar.
- source_word: Ναβουχοδονόσορ
  choice: Nabucodonosor
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: βασιλεὺς Βαβυλῶνος
  choice: rei da Babilônia
  rationale: Traduz diretamente o título e o topônimo em formulação natural em português.
- source_word: ἔδησεν αὐτὸν ἐν χαλκεῖς δεσμοῖς
  choice: amarrou-o com correntes de bronze
  rationale: Expressa a sujeição física e conserva a indicação do material das restrições.
- source_word: ἀπήγαγεν εἰς Βαβυλῶνα
  choice: levou-o para a Babilônia
  rationale: Comunica a remoção forçada ao destino indicado, sem acrescentar detalhes não explícitos.
theological_decisions:
- issue: Uso da redação grega de 1 Esdras em contraste com o paralelo aproximado do Texto Massorético
  choice: 'Traduzir a sequência grega: a subida de Nabucodonosor, a prisão do rei e sua condução à Babilônia.'
  alternative: Harmonizar o versículo com a sequência e os nomes do paralelo hebraico.
  rationale: O grego é a testemunha primária indicada para 1 Esdras; o paralelo hebraico é apenas aproximado e não deve substituir nem harmonizar sua redação clara.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A ordem foi levemente ajustada para fluidez, sem alterar a sequência do grego.
