base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/003.yaml
  text: And he said to the Levites[a], the holy servants of Israel, “Sanctify yourselves to the Lord in the place of the holy ark of the Lord, in the house that Solomon son of David the king built.”
translation:
  language: pt
  text: 'E ele disse aos levitas, servidores sagrados de Israel: “Consagrem-nos[a] ao Senhor, no lugar da arca sagrada do Senhor, na casa que Salomão, filho de Davi, o rei, construiu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente “Consagrem-nos ao Senhor”, mas não está claro a quem se refere “-nos”. O paralelo hebraico traz uma redação diferente e mais clara: “Coloquem a arca sagrada na casa que Salomão, filho de Davi, rei de Israel, construiu”.'
    reason: Leitura alternativa e referente pronominal incerto.
lexical_decisions:
- source_word: Λευείταις
  choice: levitas
  rationale: Forma portuguesa consagrada para o grupo tribal e sacerdotal; corresponde também ao paralelo hebraico.
- source_word: ἱεροδούλοις
  choice: servidores sagrados
  rationale: Expressa pessoas dedicadas ao serviço sagrado sem restringir indevidamente o termo à categoria técnica de servos do templo.
- source_word: ἁγιάσατε αὐτούς
  choice: Consagrem-nos
  rationale: Mantém o imperativo cultual e traduz literalmente o pronome masculino plural do grego, cujo referente não está claro, em vez de o substituir por uma forma reflexiva.
- source_word: τῷ κυρίῳ
  choice: ao Senhor
  rationale: Com o verbo 'consagrar', a preposição portuguesa 'a' exprime naturalmente dedicação; 'Senhor' traduz κύριος a partir do texto grego.
- source_word: ἐν τῇ θέσει τῆς ἁγίας κιβωτοῦ
  choice: no lugar da arca sagrada
  rationale: Preserva a construção locativa do grego e o sentido cultual de κιβωτός como 'arca'.
- source_word: ἐν τῷ οἴκῳ
  choice: na casa
  rationale: Traduz literalmente οἶκος; 'templo' seria uma explicitação interpretativa, embora seja o edifício referido.
- source_word: Σαλωμὼν ὁ τοῦ Δαυεὶδ ὁ βασιλεύς
  choice: Salomão, filho de Davi, o rei
  rationale: Torna explícita a relação filial elíptica no grego e conserva a aposição ambígua 'o rei', sem acrescentar 'de Israel', ausente do texto grego desta passagem.
theological_decisions:
- issue: Tradução de κύριος em contexto da Septuaginta com paralelo hebraico que contém o nome divino
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte primária grega traz κύριος; por isso, a tradução segue o termo grego, sem importar para o texto principal a convenção tipográfica usada ao traduzir diretamente יהוה.
- issue: Referente de αὐτούς e possível harmonização com o paralelo hebraico
  choice: 'Preservar o pronome plural ambíguo: “Consagrem-nos”'
  alternative: “Consagrem-se” ou “Coloquem a arca sagrada na casa”
  rationale: O grego transmitido contém αὐτούς, pronome masculino plural, mas não oferece referente inequívoco. O paralelo hebraico apresenta uma leitura diferente e mais clara sobre colocar a arca na casa. A tradução principal permanece ancorada no grego, e a diferença é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais de terceira pessoa do plural. A tradução preserva a estranheza e a ambiguidade do grego onde elas são textualmente genuínas, esclarecendo-as em nota sem harmonizar o texto principal ao paralelo hebraico.
