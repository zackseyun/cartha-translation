base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/040.yaml
  text: The recorded accounts concerning him, and his uncleanness and impiety, are written in the book of the chronicles of the kings.
translation:
  language: pt
  text: Os fatos relatados a respeito dele[a], bem como sua impureza e impiedade, estão registrados no livro das crônicas dos reis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as coisas narradas a respeito dele”. O particípio grego pode indicar fatos contados ou postos por escrito.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... ἱστορηθέντα
  choice: os fatos relatados
  rationale: O particípio substantivado designa aquilo que foi narrado ou posto em registro. “Fatos relatados” conserva o sentido plural sem acrescentar a ideia mais específica de documentos independentes.
- source_word: ἀκαθαρσίας
  choice: impureza
  rationale: “Impureza” mantém a força moral e religiosa do termo sem restringi-lo exclusivamente à impureza ritual.
- source_word: δυσσεβείας
  choice: impiedade
  rationale: O termo indica falta de reverência ou devoção para com Deus; “impiedade” é preciso e mantém distinta a segunda acusação.
- source_word: ἀναγέγραπται
  choice: estão registrados
  rationale: 'Expressa o perfeito passivo: esses fatos foram inscritos e permanecem registrados.'
- source_word: βίβλῳ τῶν χρόνων τῶν βασιλέων
  choice: livro das crônicas dos reis
  rationale: Trata-se de uma fórmula de referência a anais régios; “crônicas” é a forma portuguesa natural neste contexto documental.
theological_decisions:
- issue: Caracterização moral e religiosa em ἀκαθαρσίας καὶ δυσσεβείας
  choice: impureza e impiedade
  alternative: contaminação e perversidade
  rationale: A tradução mantém separadas as duas acusações do grego e preserva sua força religiosa, sem reduzi-las a uma condenação moral genérica.
translation_notes:
  register: Português moderno, claro e digno, com construção documental natural. O δέ é representado pela organização da frase, sem acrescentar um marcador temporal inexistente no grego.
