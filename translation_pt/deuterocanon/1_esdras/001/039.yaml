base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/039.yaml
  text: And Nebuchadnezzar took some of the sacred vessels of the Lord and carried them away and deposited them in his temple in Babylon[a].
translation:
  language: pt
  text: E Nabucodonosor tomou alguns dos utensílios sagrados do Senhor, levou-os consigo e os depositou no templo dele, na Babilônia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tomou dos utensílios sagrados do Senhor”. O grego permite essa tradução mais literal, mas provavelmente tem sentido partitivo: Nabucodonosor tomou alguns dos utensílios, não necessariamente todos.'
    reason: Preserva a ambiguidade sintática de ἀπό com o genitivo e registra a alternativa formal.
lexical_decisions:
- source_word: ἀπὸ τῶν ἱερῶν σκευῶν
  choice: alguns dos utensílios sagrados
  rationale: Com o genitivo, ἀπό pode indicar seleção dentre um conjunto. “Alguns dos” expressa naturalmente essa provável força partitiva, enquanto “utensílios sagrados” comunica objetos consagrados ao serviço do templo.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: Traduz diretamente o grego κύριος e mantém o registro bíblico habitual sem introduzir a convenção tipográfica usada para o tetragrama hebraico.
- source_word: λαβὼν
  choice: tomou
  rationale: O particípio aoristo é vertido como verbo finito para produzir narrativa natural em português, preservando a primeira ação da sequência.
- source_word: ἀπενέγκας
  choice: levou-os consigo
  rationale: Expressa a remoção e o transporte dos utensílios após serem tomados, com referente pronominal claro.
- source_word: ἀπηνείσατο
  choice: os depositou
  rationale: Comunica a colocação formal dos objetos capturados no templo, sentido mais preciso neste contexto que o genérico “pôs”.
- source_word: ἐν τῷ ναῷ αὐτοῦ
  choice: no templo dele
  rationale: O pronome retoma Nabucodonosor. “Dele” reduz a possível ambiguidade que “seu templo” teria em português após a menção do Senhor.
- source_word: ἐν Βαβυλῶνι
  choice: na Babilônia
  rationale: Forma portuguesa corrente do nome geográfico, com artigo de uso natural.
theological_decisions:
- issue: Tradução de κύριος em uma narrativa histórica de fonte grega
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte primária traz κύριος; “Senhor” a representa diretamente. A forma “SENHOR” poderia sugerir que se está traduzindo explicitamente o tetragrama hebraico, o que não ocorre neste texto grego.
- issue: Referente de αὐτοῦ em “seu templo”
  choice: templo dele, isto é, de Nabucodonosor
  alternative: templo do Senhor
  rationale: O contexto e a localização na Babilônia indicam o templo associado a Nabucodonosor, não o templo do Senhor em Jerusalém. A formulação portuguesa evita atribuição equivocada sem especificar qual divindade babilônica era cultuada ali.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível. “Utensílios sagrados” é mais natural para leitores atuais que “vasos santos”; “templo dele” evita a ambiguidade referencial de “seu templo”.
