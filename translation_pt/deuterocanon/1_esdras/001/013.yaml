  terminology: «Sacerdotes», «levitas» e «filhos de Arão» são terminologia tradicional, precisa e compreensível. A nota conserva adequadamente a alternativa mais literal para τὰ στέατα e explica seu emprego cultual sem impor interpretação adicional.
