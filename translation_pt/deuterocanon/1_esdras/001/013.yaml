base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/013.yaml
  text: For the priests were offering up the fat until evening[a], and the Levites prepared for themselves and for the priests, their brothers, the sons of Aaron.
translation:
  language: pt
  text: Pois os sacerdotes ofereciam no altar as porções de gordura até o entardecer[a], e os levitas prepararam para si mesmos e para seus irmãos, os sacerdotes, filhos de Arão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a gordura». O grego se refere à gordura sacrificial oferecida no altar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέφερον
  choice: ofereciam no altar
  rationale: No contexto sacrificial, ἀναφέρω indica oferecer sobre o altar. A forma imperfeita é representada por «ofereciam», sugerindo ação em curso até a tarde; «no altar» explicita naturalmente o sentido cultual do verbo.
- source_word: τὰ στέατα
  choice: as porções de gordura
  rationale: στέαρ designa gordura, especialmente a gordura sacrificial. «Porções de gordura» evita a possível leitura de gordura em sentido genérico e comunica com clareza que se tratava das partes destinadas ao sacrifício.
- source_word: ἕως ὀψίας
  choice: até a tarde
  rationale: A expressão marca a extensão temporal até o período da tarde ou começo da noite. «Até a tarde» é direta e não acrescenta a ideia mais específica de anoitecer.
- source_word: ἡτοίμασαν
  choice: prepararam
  rationale: Mantém o objeto implícito, como no grego, sem especificar indevidamente comida ou porções, embora o contexto da refeição sacrificial permita entendê-lo.
- source_word: ἑαυτοῖς
  choice: para si mesmos
  rationale: Reproduz de modo claro o dativo reflexivo e indica que os levitas fizeram os preparativos também em benefício próprio.
- source_word: τοῖς ἱερεῦσιν ἀδελφοῖς αὐτῶν
  choice: para os sacerdotes, seus irmãos
  rationale: Preserva a relação apositiva e a linguagem explícita de parentesco ou fraternidade corporativa do texto grego.
- source_word: υἱοῖς Ἀαρών
  choice: os filhos de Arão
  rationale: Conserva a designação sacerdotal tradicional e a estrutura do grego, identificando mais precisamente os sacerdotes.
theological_decisions:
- issue: Sentido de ἀδελφοῖς no contexto sacerdotal e tribal
  choice: seus irmãos
  alternative: seus parentes; seus companheiros sacerdotais
  rationale: O grego emprega explicitamente o termo masculino «irmãos». A tradução preserva a linguagem de parentesco e solidariedade entre os levitas e os sacerdotes, sem restringi-la a uma explicação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o encadeamento do grego e preserva o objeto implícito de «prepararam». «Ofereciam no altar» torna explícito o sentido sacrificial inerente ao verbo, enquanto a nota registra a alternativa lexical mais literal para τὰ στέατα.
