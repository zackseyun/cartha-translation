base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/028.yaml
  text: And the king said to his servants[a], “Take me away from the battle, for I am very weak.” And immediately his servants took him away from the battle line,
translation:
  language: pt
  text: 'E o rei disse aos seus servos[a]: “Tirem-me da batalha, pois estou muito fraco.” Imediatamente, seus servos o retiraram da linha de batalha,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “assistentes”. O grego παῖδες pode significar “servos”, “assistentes” ou “jovens”; o paralelo hebraico diz “seus servos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παῖς / παισίν / παῖδες
  choice: servos
  rationale: No contexto real e militar, refere-se aos servidores pessoais ou assistentes do rei, não a crianças. O paralelo hebraico עֲבָדָיו também favorece “seus servos”.
- source_word: Ἀποστήσατέ με
  choice: Tirem-me
  rationale: Expressa de modo natural a ordem para que o removessem fisicamente do combate; o paralelo hebraico também apresenta sentido causativo de fazer passar ou retirar.
- source_word: ἀπὸ τῆς μάχης
  choice: da batalha
  rationale: μάχη designa a batalha ou o combate em si; a formulação é clara e direta em português.
- source_word: ἠσθένησα
  choice: estou muito fraco
  rationale: O verbo indica estar ou tornar-se fraco, sem afirmar por si só que houve ferimento. O presente comunica naturalmente a condição imediata do rei.
- source_word: λίαν
  choice: muito
  rationale: Reproduz de modo corrente a intensificação do advérbio grego.
- source_word: εὐθέως
  choice: Imediatamente
  rationale: Marca a pronta execução da ordem em linguagem moderna e digna.
- source_word: παράταξις
  choice: linha de batalha
  rationale: Designa a formação ou disposição militar organizada, sendo mais preciso aqui do que simplesmente repetir “batalha”.
