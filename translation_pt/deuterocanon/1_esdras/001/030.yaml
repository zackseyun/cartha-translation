base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/030.yaml
  text: And throughout all Judea they mourned for Josiah[a]; and Jeremiah the prophet lamented over Josiah, and the leaders together with the women kept lamenting him to this day[b]; and this was ordained to be done forever.
translation:
  language: pt
  text: Em toda a Judeia, prantearam Josias; o profeta Jeremias entoou uma lamentação por Josias, e os líderes, junto com as mulheres, continuaram a lamentá-lo até o dia de hoje.[b] E foi determinado que isso fosse feito para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi decretado que isso fosse feito continuamente” ou “isso foi estabelecido como costume perpétuo”. O grego indica uma prática formalmente estabelecida e duradoura, mas a nuance administrativa exata do verbo não é totalmente explícita.'
    reason: lexical_alternative
  - marker: b
    text: O texto hebraico paralelo em 2 Crônicas 35:24–25 menciona todo o Judá e Jerusalém chorando por Josias e Jeremias entoando uma lamentação por ele; aqui, 1 Esdras amplia a descrição ao mencionar os líderes e as mulheres lamentando-o “até o dia de hoje”.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: Em toda a Judeia
  rationale: Expressa naturalmente o âmbito geográfico completo indicado por ἐν com o dativo e por ὅλῃ.
- source_word: ἐπένθησαν
  choice: prantearam
  rationale: O verbo πενθέω indica luto por uma morte; “prantearam” é corrente, digno e adequado ao contexto fúnebre.
- source_word: ἐθρήνησεν
  choice: entoou uma lamentação
  rationale: θρηνέω é mais específico que o luto geral e pode indicar a expressão ou recitação de um lamento fúnebre; a formulação preserva a distinção em relação a ἐπένθησαν.
- source_word: ὑπὲρ Ἰωσείου
  choice: por Josias
  rationale: No contexto de lamentação por um morto, ὑπέρ indica aquele por quem se lamenta; “por Josias” é natural em português.
- source_word: οἱ προκαθήμενοι
  choice: os líderes
  rationale: Designa pessoas colocadas à frente ou revestidas de autoridade, sem especificar um cargo; “líderes” evita acrescentar a noção não expressa de anciãos ou autoridades civis.
- source_word: σὺν γυναιξὶν
  choice: junto com as mulheres
  rationale: Preserva de maneira clara a ideia de acompanhamento ou participação conjunta expressa por σύν.
- source_word: ἐθρηνοῦσαν
  choice: continuaram a lamentá-lo
  rationale: O imperfeito apresenta a ação como duradoura ou reiterada; “continuaram a lamentá-lo” comunica esse aspecto sem transformar necessariamente a frase em um rito regular.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: até o dia de hoje
  rationale: Equivalente idiomático e solene da expressão temporal grega, mantendo a referência ao presente do narrador.
- source_word: ἐξεδόθη τοῦτο γενέσθαι ἀεί
  choice: foi determinado que isso fosse feito para sempre
  rationale: A construção aponta para uma determinação formal e duradoura, mas não identifica quem a promulgou nem sua natureza jurídica; a voz impessoal preserva essa abertura.
theological_decisions:
- issue: Força institucional ou cultual da prática comemorativa no fim do versículo
  choice: foi determinado que isso fosse feito para sempre
  alternative: isso foi estabelecido como costume perpétuo
  rationale: O grego sugere uma determinação formal e contínua, mas não informa quem a estabeleceu nem se se tratava de lei, rito religioso ou costume. A tradução mantém a solenidade e a duração sem importar uma categoria institucional específica.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Prantearam” e “entoou uma lamentação” preservam a distinção entre o luto geral e o lamento fúnebre mais específico. A ordem dos marcadores foi posicionada de acordo com o conteúdo efetivo das notas: [b] após “até o dia de hoje” e [a] após a determinação final.'
