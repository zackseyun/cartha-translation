base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/011.yaml
  text: And they roasted the Passover with fire[a], as was proper, and they boiled the sacrifices in the bronze pots and kettles with a pleasing aroma[b], and brought them to all the people.
translation:
  language: pt
  text: E assaram a Páscoa no fogo, como convinha, e cozeram os sacrifícios em panelas de bronze e caldeirões, com aroma agradável[a]; depois os levaram a todos os que eram do povo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega significa literalmente “com fragrância” ou “com cheiro agradável”; no contexto sacrificial, pode evocar o aroma de uma oferta.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a todos os que eram do povo”; a expressão talvez se refira mais especificamente ao povo comum, em contraste com os sacerdotes e os levitas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤπτησαν
  choice: assaram
  rationale: O verbo indica especificamente assar, e não apenas cozinhar; a expressão ἐν πυρί reforça o preparo ao fogo.
- source_word: τὸ πάσχα
  choice: a Páscoa
  rationale: A expressão pode designar a vítima ou a refeição pascal. A formulação metonímica do grego preserva essa amplitude sem explicitação indevida.
- source_word: ἐν πυρί
  choice: no fogo
  rationale: Expressa de modo natural em português o meio de preparo e conserva a referência explícita ao fogo.
- source_word: ὡς καθήκει
  choice: como convinha
  rationale: Mantém o sentido normativo de algo apropriado ou prescrito, sem decidir se a norma em vista é legal, ritual ou costumeira.
- source_word: τὰς θυσίας
  choice: os sacrifícios
  rationale: Reproduz o termo sacrificial amplo sem restringi-lo a ofertas ou porções específicas.
- source_word: ἥψησαν
  choice: cozeram
  rationale: O verbo se refere normalmente a cozer ou ferver em líquido. A escolha mantém a distinção em relação a 'assaram' e combina naturalmente com os recipientes mencionados.
- source_word: ἐν τοῖς χαλκίοις καὶ λέβησιν
  choice: em panelas de bronze e caldeirões
  rationale: A expressão distingue recipientes metálicos de cozinha e caldeirões; esta formulação é clara e preserva as duas categorias.
- source_word: μετʼ εὐωδίας
  choice: com aroma agradável
  rationale: Traduz o núcleo sensorial de fragrância ou cheiro agradável e permite que o contexto sacrificial sugira, sem impor, a ideia de aroma de uma oferta.
- source_word: ἀπήνεγκαν
  choice: os levaram
  rationale: O verbo significa levar ou transportar. O pronome retoma naturalmente os sacrifícios preparados, enquanto a distribuição permanece implícita no contexto.
- source_word: πᾶσι τοῖς ἐκ τοῦ λαοῦ
  choice: a todos os do povo
  rationale: Fica mais próximo do grego, literalmente 'a todos os que eram do povo', e preserva a possível distinção entre o povo comum e os oficiantes.
theological_decisions:
- issue: Distinção ritual entre o preparo da Páscoa e o dos demais sacrifícios
  choice: 'Empregar verbos distintos: ''assaram'' para a Páscoa e ''cozeram'' para os sacrifícios.'
  alternative: Traduzir ambos os verbos genericamente por 'cozinharam'.
  rationale: O grego emprega verbos diferentes, provavelmente refletindo modos rituais distintos de preparo. Preservar essa diferença evita apagar um detalhe cultual do texto.
- issue: Alcance da expressão referente ao povo
  choice: Traduzir πᾶσι τοῖς ἐκ τοῦ λαοῦ por 'a todos os do povo'.
  alternative: '''a todo o povo'' ou ''a todos os leigos''.'
  rationale: A formulação escolhida conserva a possibilidade de que se trate do povo comum em contraste com sacerdotes e levitas, sem introduzir no texto principal a categoria interpretativa 'leigos'.
- issue: Valor sacrificial de μετʼ εὐωδίας
  choice: Traduzir por 'com aroma agradável'.
  alternative: '''cuidadosamente'' ou ''como aroma de oferta agradável''.'
  rationale: A escolha mantém o sentido lexical concreto de fragrância e deixa que a ressonância sacrificial surja do contexto, sem convertê-la em uma interpretação explícita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. 'Cozeram' foi mantido por sua precisão ritual, apesar de ser menos frequente na fala cotidiana. A construção 'a todos os do povo' é deliberadamente mais próxima do grego e sua possível distinção social é esclarecida em nota.
