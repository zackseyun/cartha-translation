base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/041.yaml
  text: And Jehoiakim his son reigned in his place; for when he was appointed[a], he was eight years old.
translation:
  language: pt
  text: E, em seu lugar, reinou seu filho Jeoaquim; pois, quando foi nomeado[a], tinha oito anos de idade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego afirma que ele tinha oito anos quando foi nomeado. Outras tradições bíblicas diferem quanto à identidade do rei ou à idade dele ao subir ao trono; esta tradução preserva a redação grega de 1 Esdras.
    reason: textual_variant
lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: reinou
  rationale: O aoristo de βασιλεύω, em narrativa histórica, é expresso de modo direto e natural por “reinou”.
- source_word: ἀντ᾽ αὐτοῦ
  choice: em seu lugar
  rationale: A expressão indica sucessão ou substituição no trono; “em seu lugar” preserva esse sentido com naturalidade em português.
- source_word: Ἰωακεὶμ
  choice: Jeoaquim
  rationale: Forma portuguesa bíblica corrente do nome régio correspondente ao grego Ἰωακείμ.
- source_word: ὁ υἱὸς αὐτοῦ
  choice: seu filho
  rationale: Tradução direta da relação filial; a ordem foi ajustada para soar natural em português.
- source_word: ἀνεδείχθη
  choice: foi nomeado
  rationale: O passivo de ἀναδείκνυμι indica designação formal para uma função. “Foi nomeado” preserva a voz passiva sem acrescentar explicitamente “rei”, termo não presente nesta oração.
- source_word: ἐτῶν ὀκτώ
  choice: tinha oito anos de idade
  rationale: Forma idiomática e clara de expressar a fórmula grega de idade.
theological_decisions:
- issue: A idade declarada no texto grego apresenta dificuldade quando comparada a tradições bíblicas paralelas mais conhecidas sobre a identidade do rei ou sua idade ao subir ao trono.
  choice: 'Manter no texto principal a afirmação explícita do grego: “tinha oito anos de idade”.'
  alternative: Harmonizar o nome do rei ou sua idade com outra tradição textual.
  rationale: O texto grego de 1 Esdras é a fonte primária e sua formulação neste ponto é clara. A tradução deve preservar essa leitura, enquanto a nota informa com transparência a divergência entre tradições.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A construção “em seu lugar” comunica naturalmente a sucessão, e “foi nomeado” mantém a relativa abertura do verbo grego sem explicitar além da fonte o cargo para o qual ele foi designado.
