  naturalness: O português é claro, moderno e de registro bíblico apropriado. A coordenação na primeira frase fica mais fluida com «bem como», que expressa diretamente a adição dos elementos registrados, sem a leve comparação sugerida por «assim como».
  terminology: «Senhor» para Κυρίου, «Josias», «Judá», «Israel» e «Reis» estão adequados. «Narrativas» é uma opção natural para τῶν ἱστορουμένων; a nota alternativa sobre «registros» é útil.
