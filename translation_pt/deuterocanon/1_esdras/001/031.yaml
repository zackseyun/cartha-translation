base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/031.yaml
  text: for all the family of Israel[a]. Now these things have been recorded in the book of the histories concerning the kings of Judah, and each deed of Josiah, and his glory, and his understanding in the law of the Lord, and the things done by him, both the former things and those now recounted[b], are recorded in the book of the Kings of Israel and Judah.
translation:
  language: pt
  text: para toda a família de Israel. Essas coisas estão registradas no livro das narrativas sobre os reis de Judá[a], bem como cada um dos feitos de Josias, sua glória e sua compreensão da lei do Senhor. Tanto as coisas feitas por ele como as que agora são narradas[b] estão registradas no livro dos Reis de Israel e de Judá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “livro dos registros sobre os reis de Judá”. A expressão grega parece indicar uma obra histórica ou um registro régio.'
    reason: lexical_alternative
  - marker: b
    text: A construção grega no fim do versículo é pouco fluente. Ela parece afirmar que tanto os feitos de Josias como os acontecimentos agora narrados constam da obra mencionada.
    reason: textual_difficulty
lexical_decisions:
- source_word: γένος
  choice: família
  rationale: No contexto de Israel como grupo de parentesco e povo descendente de um ancestral, “família” preserva a nuance de linhagem sem empregar termos hoje potencialmente inadequados como “raça”.
- source_word: ἀναγέγραπται
  choice: estão registradas
  rationale: O perfeito passivo indica que as informações foram postas por escrito e permanecem no registro; a formulação portuguesa expressa naturalmente esse resultado presente.
- source_word: βίβλῳ τῶν ἱστορουμένων
  choice: livro das narrativas
  rationale: A expressão designa matérias relatadas historicamente, possivelmente um registro régio. “Narrativas” reflete o verbo ἱστορέω e é mais natural que “livro das histórias” neste contexto.
- source_word: τὸ καθʼ ἓν πραχθὲν τῆς πράξεως Ἰωσείου
  choice: cada um dos feitos de Josias
  rationale: καθʼ ἓν comunica a ideia de item por item; “cada um dos feitos” preserva o caráter detalhado da expressão sem reproduzir de modo artificial a repetição etimológica de πραχθέν e πράξεως.
- source_word: δόξης
  choice: glória
  rationale: Equivalente direto que mantém o registro bíblico e pode abranger honra, esplendor e renome.
- source_word: συνέσεως
  choice: compreensão
  rationale: No vínculo com a lei do Senhor, o termo indica entendimento ou percepção inteligente; “compreensão” é claro e corrente.
- source_word: νόμῳ Κυρίου
  choice: lei do Senhor
  rationale: Formulação bíblica portuguesa usual e tradução direta do grego, sem introduzir uma forma do nome divino ausente do texto-base grego.
- source_word: τά τε πραχθέντα ὑπʼ αὐτοῦ
  choice: as coisas feitas por ele
  rationale: Mantém a forma passiva e a retomada explícita dos atos de Josias presente no grego.
- source_word: τὰ νῦν ἱστόρηται
  choice: as que acabam de ser narradas
  rationale: Entende νῦν em relação à narração presente e conserva a referência às matérias recém-relatadas, sem eliminar a dificuldade sintática do texto transmitido.
- source_word: βυβλίῳ τῶν Βασιλέων Ἰσραὴλ καὶ Ἰούδα
  choice: livro dos Reis de Israel e de Judá
  rationale: Apresenta a expressão como título ou designação de uma obra-fonte e conserva os dois reinos nomeados pelo grego.
theological_decisions:
- issue: Tradução de κύριος em νόμῳ Κυρίου
  choice: Senhor
  alternative: SENHOR
  rationale: O texto-base é grego e traz Κυρίου. “Senhor” o representa diretamente, sem retroverter de modo explícito para o nome divino hebraico.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A tradução mantém o início fragmentário, pois o versículo continua a frase anterior. A sintaxe longa do grego foi dividida em duas frases para clareza, sem apagar a repetição documental nem a dificuldade da cláusula final.
