base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/045.yaml
  text: And he did what was evil before the Lord[a], and he was not ashamed at the words spoken by Jeremiah the prophet from the mouth of the Lord.
translation:
  language: pt
  text: E fez o que era mau diante do Senhor e não se envergonhou diante das palavras proferidas pelo profeta Jeremias, vindas da boca do Senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo hebraico em 2 Crônicas 36:12 diz que ele “não se humilhou diante do profeta Jeremias, que falava da parte do Senhor”. Aqui, o grego de 1 Esdras diz que ele não se envergonhou nem ficou constrangido diante das palavras.
    reason: Registra a diferença significativa entre o testemunho grego primário e o paralelo hebraico, sem substituir um pelo outro.
lexical_decisions:
- source_word: ἐποίησεν τὸ πονηρόν
  choice: fez o que era mau
  rationale: Reproduz naturalmente o idiomatismo bíblico que descreve conduta moralmente má, sem intensificar o grego.
- source_word: ἐνώπιον Κυρίου
  choice: diante do Senhor
  rationale: Preserva o sentido de agir perante Deus ou à sua vista, em formulação bíblica corrente e compreensível.
- source_word: οὐκ ἐνετράπη
  choice: não se envergonhou
  rationale: O verbo, nesta forma, pode indicar sentir vergonha ou ficar constrangido; a tradução mantém a nuance explícita do testemunho grego.
- source_word: ἀπὸ τῶν ῥηθέντων λόγων
  choice: diante das palavras proferidas
  rationale: No contexto de ἐντρέπω, ἀπό assinala aquilo perante o qual ele deveria ter sentido vergonha. 'Diante de' é natural em português e evita o causal excessivamente explícito 'por causa de'.
- source_word: ὑπὸ Ἰερεμίου τοῦ προφήτου
  choice: pelo profeta Jeremias
  rationale: Expressa diretamente o agente e conserva o título profético; a ordem é idiomática em português.
- source_word: ἐκ στόματος τοῦ κυρίου
  choice: vindas da boca do Senhor
  rationale: Mantém a imagem concreta e a fórmula profética do grego, ao mesmo tempo que esclarece que a expressão qualifica as palavras.
theological_decisions:
- issue: Tradução de κύριος no contexto grego deuterocanônico
  choice: Senhor
  alternative: SENHOR
  rationale: O texto primário traz κύριος. 'Senhor' representa diretamente o grego sem retroverter tipograficamente para o nome divino com base no paralelo hebraico.
- issue: Nuance de οὐκ ἐνετράπη em relação à advertência profética
  choice: não se envergonhou diante das palavras
  alternative: não se humilhou diante das palavras
  rationale: O grego de 1 Esdras exprime vergonha ou constrangimento, enquanto o paralelo de 2 Crônicas 36:12 fala em não se humilhar. A tradução segue o grego e registra a diferença em nota.
- issue: Relação entre a fala de Jeremias e a origem divina
  choice: palavras proferidas pelo profeta Jeremias, vindas da boca do Senhor
  alternative: palavras que o Senhor proferiu pela boca do profeta Jeremias
  rationale: 'A formulação escolhida conserva mais de perto a estrutura e a tensão do grego: Jeremias é o agente da proclamação, e as palavras procedem da boca do Senhor.'
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Conserva-se a fórmula bíblica 'diante do Senhor' e a imagem profética 'da boca do Senhor', evitando linguagem arcaica.
