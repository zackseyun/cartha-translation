base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/012.yaml
  text: After this they prepared for themselves and for the priests[a], their brothers[b], the sons of Aaron.
translation:
  language: pt
  text: Depois disso, prepararam para si mesmos e para os sacerdotes, seus irmãos, os filhos de Arão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ δὲ ταῦτα
  choice: Depois disso
  rationale: Expressa de modo natural a transição temporal do grego, sem tornar o plural idiomático de ταῦτα excessivamente literal.
- source_word: ἡτοίμασαν
  choice: prepararam
  rationale: Mantém o sentido transitivo de aprontar ou preparar algo, adequado ao contexto das porções da celebração.
- source_word: ἑαυτοῖς
  choice: para si mesmos
  rationale: Reproduz diretamente o dativo reflexivo e identifica o primeiro grupo beneficiário da preparação.
- source_word: τε καὶ
  choice: e
  rationale: Liga os dois grupos beneficiários; o português não exige a construção enfática «tanto... como».
- source_word: τοῖς ἱερεῦσιν
  choice: para os sacerdotes
  rationale: O dativo indica destinatários ou beneficiários daquilo que foi preparado.
- source_word: ἀδελφοῖς αὐτῶν
  choice: seus irmãos
  rationale: Preserva o termo familiar masculino explícito no grego e sua relação com o grupo que realizou a preparação.
- source_word: υἱοῖς Ἀαρών
  choice: os filhos de Arão
  rationale: Conserva a formulação genealógica e a aposição do original; «descendentes» seria uma explicitação interpretativa.
theological_decisions:
- issue: Relação entre «seus irmãos» e «os filhos de Arão»
  choice: 'Manter a sequência apositiva: «os sacerdotes, seus irmãos, os filhos de Arão»'
  alternative: 'Explicitar: «seus irmãos, os sacerdotes descendentes de Arão»'
  rationale: O grego apresenta as expressões em sequência, sem oração relativa. A tradução preserva essa estrutura e evita decidir além do texto como cada aposição deve ser hierarquizada.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego sem rigidez artificial. Não se acrescentaram notas, pois a estrutura apositiva e o sentido lexical podem ser preservados adequadamente no corpo do versículo.
