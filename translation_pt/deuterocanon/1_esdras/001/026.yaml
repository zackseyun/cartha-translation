base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/026.yaml
  text: And Josiah did not turn back to his chariot[a], but attempted to fight him, not paying attention to the words of Jeremiah the prophet from the mouth of the Lord.
translation:
  language: pt
  text: Josias, porém, não se voltou para o seu carro de guerra[a], mas tentou lutar contra ele, sem dar atenção às palavras do profeta Jeremias, que vinham da boca do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não se retirou para o seu carro de guerra». A formulação grega é concisa e pode indicar que Josias se recusou a recuar para o carro de guerra ou em direção a ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἀπέστρεψεν ἑαυτὸν
  choice: não voltou
  rationale: A construção reflexiva indica voltar-se para trás ou retirar-se. “Não voltou” é natural em português e mantém a formulação sem explicitar além do grego uma retirada militar.
- source_word: ἐπὶ τὸ ἅρμα αὐτοῦ
  choice: para o seu carro
  rationale: A preposição e o contexto indicam movimento de volta ou em direção ao carro de guerra. “Para o seu carro” preserva a expressão comprimida e deixa a alternativa mais explícita para a nota.
- source_word: πολεμεῖν αὐτὸν ἐπεχείρει
  choice: tentou lutar contra ele
  rationale: ἐπιχειρέω com infinitivo expressa tentar ou empreender; a formulação escolhida é clara, atual e conserva como referente o adversário mencionado no contexto.
- source_word: οὐ προσέχων
  choice: sem dar atenção
  rationale: O particípio expressa a circunstância concomitante de não prestar atenção ou não dar ouvidos. “Sem dar atenção” é corrente e não acrescenta uma avaliação além do texto.
- source_word: ῥήμασιν
  choice: às palavras
  rationale: Mantém o sentido direto de enunciados ou palavras faladas, sem condensá-los em “mensagem”.
- source_word: Ἰερεμίου προφήτου
  choice: do profeta Jeremias
  rationale: Esta ordem é idiomática em português e corresponde integralmente à identificação grega.
- source_word: ἐκ στόματος Κυρίου
  choice: vindas da boca do Senhor
  rationale: A inclusão de “vindas” liga com clareza as palavras à sua origem e conserva a metáfora explícita da boca divina.
- source_word: Κυρίου
  choice: Senhor
  rationale: É a tradução tradicional e adequada de κύριος neste contexto divino.
theological_decisions:
- issue: Autoridade profética na expressão ἐκ στόματος Κυρίου
  choice: Conservar “vindas da boca do Senhor”
  alternative: Simplificar para “vindas do Senhor”
  rationale: O grego apresenta explicitamente a boca do Senhor como origem das palavras proféticas. Preservar a imagem mantém a força da reivindicação de autoridade divina sem explicá-la ou atenuá-la.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Carro” é mantido no texto por proximidade lexical; o contexto militar deixa claro que se trata de um carro de guerra. A coordenação com “porém” torna natural o contraste expresso por ἀλλά.
