base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/052.yaml
  text: And they burned the house of the Lord[a], and tore down the walls of Jerusalem, and burned its towers with fire[b],
translation:
  language: pt
  text: E incendiaram a casa do Senhor[a][b], derrubaram as muralhas de Jerusalém e incendiaram as suas torres com fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “puseram fogo na casa do Senhor” e, depois, “puseram fogo nas suas torres”. O grego emprega o mesmo verbo nas duas ocorrências.'
    reason: lexical_alternative
  - marker: b
    text: A expressão “casa do Senhor” refere-se ao templo de Jerusalém.
    reason: cross_reference
lexical_decisions:
- source_word: ἐνεπύρισαν
  choice: incendiaram
  rationale: O verbo indica queimar ou atear fogo. “Incendiaram” é claro e permite empregar o mesmo verbo nas duas ocorrências, sem afirmar que a destruição pelo fogo foi necessariamente total.
- source_word: τὸν οἶκον τοῦ κυρίου
  choice: a casa do Senhor
  rationale: “Casa” preserva o sentido direto de οἶκος; no contexto, a expressão designa o templo de Jerusalém. “Senhor” traduz κύριος de acordo com o testemunho grego primário.
- source_word: κατέλυσαν
  choice: derrubaram
  rationale: Neste contexto arquitetônico, o verbo comunica desmantelar ou fazer cair; “derrubaram” é natural e preciso para muralhas.
- source_word: τὰ τείχη Ἰερουσαλήμ
  choice: as muralhas de Jerusalém
  rationale: “Muralhas” expressa melhor que “muros” as estruturas defensivas da cidade e traduz diretamente a expressão grega.
- source_word: τοὺς πύργους αὐτῆς
  choice: as suas torres
  rationale: πύργοι significa “torres”; o possessivo retoma Jerusalém sem transformar o termo em uma referência mais ampla a fortificações.
- source_word: ἐν πυρί
  choice: com fogo
  rationale: A expressão preserva o reforço instrumental explícito do grego, embora em português produza uma redundância deliberada após “incendiaram”.
theological_decisions:
- issue: Tradução de κύριος no contexto da destruição do templo
  choice: Senhor
  alternative: SENHOR
  rationale: O texto grego primário traz κυρίου. Embora uma tradição hebraica paralela possa levar ao nome divino, este versículo deve ser traduzido prioritariamente do grego, preservando-se “Senhor”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “incendiaram com fogo” foi mantida para representar o reforço expresso no grego; os dois marcadores aparecem junto à expressão a que suas notas dão esclarecimento.
