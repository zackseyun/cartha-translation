base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/043.yaml
  text: And after a year[a], Nebuchadnezzar sent and brought him away to Babylon, together with the holy vessels of the Lord,
translation:
  language: pt
  text: E, depois de um ano, Nabucodonosor mandou buscá-lo e o levou para a Babilônia, junto com os utensílios sagrados do Senhor,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετ᾽ ἐνιαυτόν
  choice: depois de um ano
  rationale: A preposição μετά com o acusativo tem sentido temporal e indica o decurso de um ano; a formulação é natural e próxima do grego.
- source_word: ἀποστείλας
  choice: mandou que
  rationale: O particípio aoristo significa literalmente “tendo enviado”. Em português narrativo, “mandou que” expressa naturalmente a ação realizada por agentes não especificados, sem inseri-los explicitamente no texto.
- source_word: μετήγαγεν
  choice: o levassem
  rationale: O verbo indica condução ou transferência de alguém de um lugar para outro. A construção com “mandou que” oferece português corrente e mantém explícito o objeto pessoal αὐτόν.
- source_word: αὐτόν
  choice: o
  rationale: O pronome retoma o homem mencionado no contexto anterior. Mantém-se o pronome, sem substituir por um nome ou título não presente neste versículo.
- source_word: ἅμα
  choice: junto com
  rationale: Neste contexto, ἅμα introduz acompanhamento; “junto com” comunica isso de modo claro e natural.
- source_word: τοῖς ἱεροῖς σκεύεσιν
  choice: os utensílios sagrados
  rationale: ἱερός qualifica como sagrados os σκεύη, termo amplo para objetos, utensílios ou instrumentos. “Utensílios sagrados” é compreensível e evita restringir o sentido a recipientes.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: O genitivo é possessivo, e κύριος é vertido como “Senhor” de acordo com o testemunho grego primário.
theological_decisions:
- issue: Tradução de κύριος em narrativa histórica deuterocanônica
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte primária grega traz κυρίου. Embora tradições hebraicas paralelas possam representar o nome divino, este versículo deve ser traduzido prioritariamente a partir do grego, que não exige a forma “SENHOR”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe “mandou que o levassem” torna natural a combinação grega de “enviar” e “transferir”, sem especificar agentes ausentes do original. A vírgula final foi preservada porque o texto fornecido termina como parte de uma frase que continua.
