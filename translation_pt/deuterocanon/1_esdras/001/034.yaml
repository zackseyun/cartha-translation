base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/034.yaml
  text: And he fined the nation one hundred talents of silver and one talent of gold[a].
translation:
  language: pt
  text: E impôs à nação uma multa de cem talentos de prata e um talento de ouro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aplicou ao povo uma penalidade em dinheiro”. O verbo grego pode indicar causar prejuízo ou exigir uma multa; neste contexto, trata-se de um pagamento punitivo em prata e ouro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζημίωσεν
  choice: impôs ... uma multa
  rationale: O verbo indica causar prejuízo ou exigir uma penalidade. Como é seguido de quantias em prata e ouro, a formulação explicita de modo natural o caráter financeiro e punitivo.
- source_word: τὸ ἔθνος
  choice: à nação
  rationale: Ἔθνος designa aqui coletivamente o povo submetido como corpo político; “nação” preserva esse sentido corporativo.
- source_word: ἀργυρίου τάλαντοις ἑκατόν
  choice: cem talentos de prata
  rationale: Mantém a unidade antiga de peso e valor e reproduz com clareza a quantidade indicada no grego.
- source_word: χρυσίου ταλάντῳ ἑνί
  choice: um talento de ouro
  rationale: Conserva o contraste numérico e material com os cem talentos de prata.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e preservação do termo histórico “talento”. O artigo indefinido em “uma multa” explicita idiomaticamente em português a construção grega sem alterar seu sentido.
