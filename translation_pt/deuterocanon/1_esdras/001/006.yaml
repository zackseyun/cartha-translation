base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/006.yaml
  text: In order[a], sacrifice the Passover, and prepare the sacrifices for your brothers[b], and keep the Passover according to the command of the Lord that was given to Moses.
translation:
  language: pt
  text: Em boa ordem,[a] sacrifiquem a Páscoa, preparem os sacrifícios para seus irmãos[b] e celebrem a Páscoa conforme a ordem do Senhor dada a Moisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de maneira ordenada” ou “segundo suas divisões”. A expressão indica uma disposição organizada; o paralelo hebraico destaca divisões ou grupos.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “irmãos” se refere aos demais membros do povo, não necessariamente apenas a irmãos biológicos do sexo masculino.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τάξει
  choice: Em boa ordem
  rationale: A expressão grega é elíptica e funciona adverbialmente, indicando disposição ordenada. “Em boa ordem” mantém a concisão e a ideia de organização, também apoiada pelo paralelo hebraico, que menciona divisões ou grupos.
- source_word: θύσατε τὸ πάσχα
  choice: sacrifiquem a Páscoa
  rationale: No contexto ritual, θύω significa sacrificar. Embora πάσχα possa designar a celebração ou a vítima pascal, a formulação preserva deliberadamente essa amplitude, sem acrescentar “cordeiro” ao texto.
- source_word: τὰς θυσίας ἑτοιμάσατε
  choice: preparem os sacrifícios
  rationale: Tradução direta e natural da expressão cultual, distinguindo os sacrifícios da celebração da Páscoa mencionada depois.
- source_word: τοῖς ἀδελφοῖς ὑμῶν
  choice: para seus irmãos
  rationale: Mantém a metáfora familiar masculina do grego. No contexto, refere-se aos demais membros do povo, sentido representativo esclarecido em nota.
- source_word: ποιήσατε τὸ πάσχα
  choice: celebrem a Páscoa
  rationale: ποιέω com πάσχα é expressão idiomática para observar ou celebrar a festa. “Celebrem” é claro e idiomático em português, sem sugerir mera execução mecânica.
- source_word: κατὰ τὸ πρόσταγμα τοῦ κυρίου
  choice: conforme a ordem do Senhor
  rationale: πρόσταγμα indica determinação autoritativa; “ordem” é natural em português. κύριος é traduzido como “Senhor”, de acordo com o texto grego, sem retroversão para o nome divino hebraico.
- source_word: τὸ δοθὲν τῷ Μωυσῇ
  choice: dada a Moisés
  rationale: O particípio concorda com πρόσταγμα e indica diretamente que a ordem foi dada a Moisés. A forma reduzida é clara e fiel.
theological_decisions:
- issue: Sentido comunitário de ἀδελφοῖς
  choice: irmãos
  alternative: compatriotas; irmãos e irmãs; demais israelitas
  rationale: O grego emprega um substantivo masculino de parentesco com alcance comunitário. A tradução mantém a forma da fonte e esclarece em nota que não se limita a irmãos biológicos do sexo masculino.
- issue: Representação de κύριος no texto grego deuterocanônico
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte imediata traz κυρίου. Traduzir por “Senhor” respeita o testemunho grego e evita inserir uma forma tipográfica associada ao tetragrama quando ele não aparece no texto-fonte.
- issue: Amplitude de τὸ πάσχα na primeira ocorrência
  choice: a Páscoa
  alternative: o cordeiro pascal; a vítima pascal
  rationale: πάσχα pode referir-se tanto à observância quanto à vítima. Embora θύσατε favoreça o referente sacrificial, a tradução não explicita “cordeiro”, preservando a amplitude lexical do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos na terceira pessoa do plural. “Em boa ordem” preserva a abertura abrupta e elíptica do grego; “celebrem a Páscoa” comunica naturalmente o idioma ritual ποιεῖν τὸ πάσχα.
