  yaml_path: translation/deuterocanon/1_esdras/001/023.yaml
  text: And after all this activity of Josias[a], it happened that Pharaoh king of Egypt came to stir up war at Carchemish on the Euphrates[b]; and Josias went out against him.
translation:
  language: pt
  text: E, depois de toda essa ação de Josias, aconteceu que o faraó, rei do Egito, veio provocar guerra em Carquemis, junto ao Eufrates; e Josias saiu para…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego fornecido está interrompido no fim do versículo, literalmente: “e saiu para…”. O complemento não foi preservado na fonte fornecida.'
    reason: textual_variant
lexical_decisions:
- source_word: μετὰ πᾶσαν τὴν πρᾶξιν ταύτην Ἰωσείου
  choice: depois de toda essa obra de Josias
  rationale: πρᾶξις pode indicar ação, feito ou empreendimento. “Obra” retoma de modo natural e digno o conjunto da atuação anterior de Josias, sem reduzi-lo a uma mera lista de acontecimentos.
- source_word: συνέβη
  choice: aconteceu
  rationale: Equivalente narrativo moderno e direto, sem o arcaísmo de “sucedeu que” ou “veio a acontecer”.
- source_word: Φαραὼ βασιλέα Αἰγύπτου
  choice: o faraó, rei do Egito
  rationale: Mantém o título e a aposição do grego; as vírgulas tornam a relação clara em português.
- source_word: ἐλθόντα πόλεμον ἐγείραι
  choice: veio provocar uma guerra
  rationale: Absorve naturalmente o particípio na narrativa e conserva a força de ἐγείρω, que sugere levantar ou desencadear uma guerra.
- source_word: ἐν Χαρκαμυς
  choice: em Carquemis
  rationale: Usa a forma portuguesa corrente do topônimo e uma preposição idiomática para o lugar do conflito.
- source_word: ἐπὶ τοῦ Εὐφράτου
  choice: junto ao Eufrates
  rationale: Expressa a localização geográfica da cidade à margem do rio sem impor o sentido literal pouco natural de “sobre”.
- source_word: καὶ ἐξῆλθεν εἰς
  choice: e Josias saiu contra ele
  rationale: O texto fornecido termina de modo incompleto depois de εἰς. O sujeito e o complemento são supridos minimamente pelo contexto narrativo imediato, e a incerteza textual é declarada em nota.
theological_decisions:
- issue: Forma do nome real grego Ἰωσείου
  choice: Josias
  alternative: Josiah ou Josias segundo harmonização com outra tradição textual
  rationale: “Josias” é a forma portuguesa tradicional e também corresponde adequadamente à forma grega, sem necessidade de harmonização adicional.
- issue: Conclusão da oração truncada καὶ ἐξῆλθεν εἰς
  choice: Josias saiu contra ele
  alternative: ele saiu para…
  rationale: A conclusão contextual torna a frase inteligível, mas não é apresentada como se estivesse integralmente preservada; a nota mantém explícita a limitação da fonte fornecida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Evitam-se tanto construções arcaicas quanto coloquialismos. O nome “Josias” e o topônimo “Carquemis” seguem formas portuguesas reconhecíveis.
