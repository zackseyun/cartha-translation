base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/015.yaml
  text: And the gatekeepers were at each gate; no one could leave his own appointed duty[a], for their brothers the Levites had prepared for them.
translation:
  language: pt
  text: Os porteiros estavam em cada portão; nenhum deles podia deixar o serviço que lhe fora designado, pois seus irmãos, os levitas, haviam preparado o necessário para eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego, literalmente: “os levitas haviam preparado para si mesmos”. Pelo contexto, é provável que tenham preparado o necessário para os porteiros, permitindo que estes permanecessem no serviço que lhes fora designado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θυρωροὶ
  choice: porteiros
  rationale: No contexto do templo, designa os responsáveis por guardar as entradas; «porteiros» é a forma bíblica corrente e natural em português.
- source_word: ἐφʼ ἑκάστου πυλῶνος
  choice: em cada portão
  rationale: Expressa de modo idiomático a localização distributiva dos porteiros junto às respectivas entradas.
- source_word: οὐκ ἔστιν παραβῆναι
  choice: nenhum deles podia deixar
  rationale: O infinitivo παραβῆναι tem aqui o sentido contextual de afastar-se ou abandonar o posto, não necessariamente de transgredir uma norma.
- source_word: ἕκαστον τὴν ἑαυτοῦ ἐφημερίαν
  choice: o serviço que lhe fora designado
  rationale: ἐφημερία indica um turno ou período oficial de serviço; esta formulação conserva o caráter designado da função sem recorrer ao coloquial «turno».
- source_word: οἱ γὰρ ἀδελφοὶ αὐτῶν οἱ Λευεῖται
  choice: pois seus irmãos, os levitas
  rationale: Mantém a relação fraterna e a aposição que identifica esses irmãos como levitas.
- source_word: ἡτοίμασαν ἑαυτοῖς
  choice: haviam preparado tudo para eles
  rationale: Embora o grego tenha literalmente o reflexivo «para si mesmos», o encadeamento contextual sugere que os levitas providenciaram o necessário para que os porteiros permanecessem em seus postos; «tudo» explicita apenas o objeto elíptico da preparação.
theological_decisions:
- issue: Referente e valor do reflexivo ἑαυτοῖς
  choice: Os levitas prepararam o necessário para os porteiros.
  alternative: Os levitas prepararam para si mesmos.
  rationale: A leitura contextual explica por que os porteiros não precisavam abandonar seu serviço. Como a forma grega é genuinamente reflexiva, a alternativa literal é preservada em nota, sem ocultar a tensão textual.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. «Porteiros» e «levitas» preservam a terminologia bíblica comum; a sintaxe evita rigidez excessivamente literal.
