base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/053.yaml
  text: And they brought all her splendor to ruin[b][a], and he carried the survivors away with the sword to Babylon.
translation:
  language: pt
  text: E eles reduziram a ruínas todo o esplendor dela; e ele levou os sobreviventes[a] com a espada[b] para a Babilônia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que restaram” ou “o remanescente”.'
    reason: Alternativa lexical para τοὺς ἐπιλοίπους.
  - marker: b
    text: 'A expressão “com a espada” também pode ser entendida em ligação estreita com a devastação anterior: os demais foram levados após uma conquista violenta. Compare o paralelo hebraico, que destaca a morte pela espada.'
    reason: A construção grega é comprimida, e o paralelo hebraico favorece uma associação com a violência precedente.
lexical_decisions:
- source_word: συνετέλεσαν ... ἀχρειῶσαι
  choice: reduziram a ruínas
  rationale: A construção expressa a consumação da devastação, literalmente levando algo a uma condição inútil ou sem valor. “Reduziram a ruínas” comunica esse resultado de modo natural e digno, sem acrescentar a ideia cultual específica de profanação.
- source_word: πάντα τὰ ἔνδοξα αὐτῆς
  choice: todo o esplendor dela
  rationale: O neutro plural pode designar todas as coisas gloriosas ou esplêndidas pertencentes a ela. O coletivo “todo o esplendor dela” é claro em português e conserva a referência feminina à cidade ou ao complexo urbano e sagrado no contexto.
- source_word: τοὺς ἐπιλοίπους
  choice: os sobreviventes
  rationale: Designa os que restaram depois da destruição. “Sobreviventes” comunica o sentido histórico sem a possível carga teológica de “remanescente”.
- source_word: ἀπήγαγεν
  choice: ele levou
  rationale: O singular grego contrasta com o verbo plural anterior e aponta naturalmente para o rei babilônico no contexto. “Levou” conserva a remoção forçada sem recorrer ao termo mais técnico “deportou”.
- source_word: μετὰ ῥομφαίας
  choice: com a espada
  rationale: A expressão comprimida significa literalmente “com a espada”. A tradução mantém sua relação sintática ambígua com a deportação, enquanto a nota registra a possível associação com a devastação violenta precedente.
- source_word: εἰς Βαβυλῶνα
  choice: para a Babilônia
  rationale: Tradução direcional corrente e natural em português.
theological_decisions:
- issue: Mudança do sujeito plural para o singular
  choice: Manter “eles” e depois “ele”
  alternative: Tratar o singular como referência coletiva à força invasora
  rationale: O grego muda explicitamente do plural συνετέλεσαν para o singular ἀπήγαγεν. O contexto favorece entender “ele” como o rei babilônico, sem apagar a mudança narrativa.
- issue: Possível sentido teológico de τοὺς ἐπιλοίπους
  choice: os sobreviventes
  alternative: o remanescente / os restantes
  rationale: Neste contexto, a expressão descreve os que ficaram vivos após a destruição, sem exigir o tema teológico de um remanescente escolhido.
- issue: Relação de “com a espada” com a devastação ou com a deportação
  choice: Preservar a expressão junto ao ato de levar, conforme a ordem grega
  alternative: Ligá-la explicitamente à matança ou à devastação anterior
  rationale: A sintaxe grega associa imediatamente a expressão ao ato de levar, mas seu sentido é comprimido; o paralelo hebraico ressalta a matança à espada. A tradução não resolve silenciosamente essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a mudança grega do plural para o singular e mantém a ambiguidade de “com a espada” por meio de nota. “Babilônia” leva artigo segundo o uso natural predominante no português brasileiro.
