base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/055.yaml
  text: until the land had enjoyed its Sabbaths; all the time of its desolation it kept Sabbath[a], to complete seventy years.
translation:
  language: pt
  text: até que a terra desfrutasse de seus sábados; durante todo o tempo de sua desolação, ela guardaria o sábado[a], para se completarem setenta anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ela teria seu descanso sabático”. O verbo grego pertence à mesma família da palavra “sábado” e apresenta a terra de forma personificada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕως τοῦ εὐδοκῆσαι
  choice: até que ... desfrutasse
  rationale: A construção com ἕως e infinitivo indica duração até determinado ponto. εὐδοκέω pode significar literalmente “agradar-se” ou “ter prazer”, mas “desfrutasse” comunica em português natural a personificação da terra recebendo seus repousos sabáticos.
- source_word: τὴν γῆν
  choice: a terra
  rationale: No contexto do exílio, γῆ designa a terra de Judá, e não o planeta inteiro; “a terra” também conserva a ligação com as prescrições de descanso sabático do solo.
- source_word: τὰ σάββατα αὐτῆς
  choice: seus sábados
  rationale: Mantém o substantivo no plural e a ligação lexical com o sábado, sem reduzir a expressão a um repouso genérico.
- source_word: πάντα τὸν χρόνον τῆς ἐρημώσεως αὐτῆς
  choice: durante todo o tempo de sua desolação
  rationale: Expressa a duração completa do estado desolado da terra e conserva o tom solene do texto.
- source_word: σαββατιεῖ
  choice: ela guardaria o sábado
  rationale: O verbo, cognato de “sábado”, indica repouso sabático, não mero descanso. O futuro do grego é representado por “guardaria”, adequado a uma situação futura vista a partir da devastação narrada; o pronome retoma claramente “a terra”.
- source_word: εἰς συμπλήρωσιν
  choice: até se completarem
  rationale: A expressão indica o resultado ou limite pelo qual o período previsto chega à sua plenitude; esta formulação é clara e idiomática em português.
- source_word: ἐτῶν ἑβδομήκοντα
  choice: setenta anos
  rationale: Tradução direta da expressão numeral, preservando sua relevância histórica e teológica.
theological_decisions:
- issue: Linguagem sabática aplicada à terra durante o exílio
  choice: Conservar explicitamente “seus sábados” e “guardaria o sábado”.
  alternative: “seus períodos de descanso” e “repousaria”.
  rationale: O grego repete termos da raiz de “sábado”, evocando a ideia de que, durante a desolação, a terra recebe o repouso sabático que lhe fora negado. A repetição mantém visível essa ligação intertextual e teológica.
- issue: Personificação da terra
  choice: Manter a terra como sujeito que “desfrutasse” e “guardaria o sábado”.
  alternative: Explicitar de modo não figurado que a terra permaneceria sem cultivo.
  rationale: O texto grego personifica deliberadamente a terra. Preservar essa figura evita resolver ou achatar a tensão poética do original.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente para leitores brasileiros e compreensão internacional. A terminologia sabática e a personificação do original foram preservadas; empregou-se “guardaria” para refletir o futuro grego σαββατιεῖ.
