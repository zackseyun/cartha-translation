  text: And no Passover like this had been held in Israel since the days of Samuel the prophet.
translation:
  language: pt
  text: E nunca se havia celebrado uma Páscoa como essa em Israel desde os dias do profeta Samuel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤχθη
  choice: se havia celebrado
  rationale: O passivo de ἄγω é idiomático neste contexto e se refere à realização da observância festiva. “Celebrar a Páscoa” é natural em português e preserva o sentido cultual.
- source_word: τὸ πάσχα
  choice: uma Páscoa
  rationale: “Páscoa” é a tradução tradicional e clara de πάσχα neste contexto. O artigo grego integra a construção comparativa com τοιοῦτο, que em português se expressa naturalmente com o indefinido.
- source_word: τοιοῦτο
  choice: como essa
  rationale: 'Expressa de modo natural a comparação indicada pelo demonstrativo qualitativo: nenhuma Páscoa comparável à que acaba de ser descrita.'
- source_word: ἐν τῷ Ἰσραήλ
  choice: em Israel
  rationale: Mantém de forma direta e idiomática a esfera comunitária e geográfica da afirmação.
- source_word: ἀπὸ τῶν χρόνων
  choice: desde os dias de
  rationale: Equivalente idiomático português da expressão temporal grega, adequado à narrativa histórica.
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: do profeta Samuel
  rationale: Segue diretamente o grego, que identifica Samuel como profeta, em uma ordem natural no português contemporâneo.
theological_decisions:
- issue: Fórmula de comparação histórica em relação ao paralelo hebraico
  choice: desde os dias do profeta Samuel
  alternative: desde o tempo do profeta Samuel
  rationale: O texto grego menciona explicitamente Samuel e situa a comparação a partir de seus dias. O paralelo massorético fornecido é apenas aproximado e não deve substituir a leitura da fonte grega primária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A formulação preserva a comparação histórica e o caráter passivo/resultativo da oração sem recorrer ao literalismo pouco natural “foi trazida”.
