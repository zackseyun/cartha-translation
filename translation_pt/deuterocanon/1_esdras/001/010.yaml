base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/010.yaml
  text: And when these things had taken place[a], the priests and the Levites stood in proper order, holding the unleavened bread, according to the tribes and according to the family divisions of the fathers, before the people, to offer to the Lord according to what is written in the book of Moses[b]; and so they did in the morning.
translation:
  language: pt
  text: E, depois que essas coisas aconteceram, os sacerdotes e os levitas se colocaram em boa ordem diante do povo, levando os pães sem fermento, segundo as tribos e segundo as divisões das famílias paternas[a], para oferecê-los ao Senhor conforme o que está escrito no livro de Moisés[b]. E assim fizeram pela manhã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «segundo as divisões das casas ancestrais» ou «segundo as casas de seus pais».
    reason: lexical_alternative
  - marker: b
    text: Aqui, o grego difere de modo significativo do paralelo aproximado em 2 Crônicas 35:10, que fala de líderes levíticos fornecendo animais para a Páscoa. Esta tradução segue o texto grego de 1 Esdras.
    reason: textual_variant
lexical_decisions:
- source_word: εὐπρεπῶς
  choice: em boa ordem
  rationale: No contexto cerimonial, o advérbio indica uma disposição apropriada, digna e ordenada; «em boa ordem» comunica isso sem introduzir uma ideia meramente estética.
- source_word: ἔστησαν
  choice: se colocaram
  rationale: Expressa o ato de tomar posição. Em conjunto com «em boa ordem», conserva o sentido físico e cerimonial do verbo.
- source_word: τὰ ἄζυμα
  choice: os pães sem fermento
  rationale: A expressão substantivada designa naturalmente os pães ázimos da celebração da Páscoa. A formulação escolhida é clara para leitores atuais.
- source_word: φυλάς
  choice: tribos
  rationale: É o termo usual para as divisões tribais de Israel e preserva a estrutura social pressuposta no texto.
- source_word: μεριδαρχίας τῶν πατέρων
  choice: divisões das famílias paternas
  rationale: μεριδαρχίας indica agrupamentos ou subdivisões, e o genitivo τῶν πατέρων aponta para a organização por linhagens ou casas ancestrais.
- source_word: προσενεγκεῖν
  choice: para oferecê-los
  rationale: Em contexto cultual, o verbo significa apresentar como oferta. O pronome explicita em português o objeto naturalmente entendido, os pães sem fermento.
- source_word: τῷ κυρίῳ
  choice: ao Senhor
  rationale: Traduz diretamente κύριος no texto grego e identifica, pelo contexto, o Deus de Israel, sem substituir a forma grega pelo tetragrama.
- source_word: κατὰ τὰ γεγραμμένα ἐν βιβλίῳ Μωυσῆ
  choice: conforme o que está escrito no livro de Moisés
  rationale: Mantém com clareza o apelo do texto à autoridade escrita mosaica.
- source_word: τὸ πρωϊνόν
  choice: pela manhã
  rationale: Preserva o sentido temporal da expressão grega concisa sem interpretá-la como designação técnica da oferta matinal.
theological_decisions:
- issue: Relação entre o texto grego e o paralelo aproximado de 2 Crônicas 35:10
  choice: Manter a cena grega dos sacerdotes e levitas em ordem com os pães sem fermento.
  alternative: Harmonizar o versículo com o texto hebraico de Crônicas, que menciona líderes levíticos fornecendo animais para a Páscoa.
  rationale: Para 1 Esdras, o grego é a fonte primária. Como o paralelo hebraico diverge substancialmente neste ponto, ele não deve substituir nem corrigir silenciosamente a leitura grega.
- issue: Expressão das divisões familiares patriarcais
  choice: divisões das famílias paternas
  alternative: divisões dos pais; divisões das casas ancestrais
  rationale: A escolha conserva a referência masculina e ancestral do grego, ao mesmo tempo que comunica em português atual que se trata de agrupamentos familiares, não de pais individuais.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem da frase foi levemente ajustada para deixar inequívoco que «diante do povo» descreve a posição dos sacerdotes e levitas. «Pães sem fermento» foi preferido a «pães ázimos» por ser mais transparente ao leitor comum.
