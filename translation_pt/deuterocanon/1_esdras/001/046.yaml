base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/046.yaml
  text: And though he had sworn by the name of the Lord to King Nebuchadnezzar[a], he broke his oath and rebelled; and, stiffening his neck and his heart[c][b], he transgressed the laws of the Lord God of Israel.
translation:
  language: pt
  text: Tendo sido posto sob juramento pelo rei Nabucodonosor, em nome do Senhor,[a] violou o juramento e se rebelou; e, endurecendo o pescoço e o coração, transgrediu os preceitos do Senhor, Deus de Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção grega também pode ser entendida como “tendo jurado lealdade ao rei Nabucodonosor pelo nome do Senhor”.
    reason: lexical_alternative
  - marker: b
    text: “Preceitos” também pode ser traduzido por “estatutos”, “ordenanças” ou “leis”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρκισθεὶς ἀπὸ τοῦ βασιλέως Ναβουχοδονόσορ
  choice: tivesse sido posto sob juramento pelo rei Nabucodonosor
  rationale: Preserva a forma passiva do particípio e o valor de origem ou agente de ἀπό, sem definir além do grego a quem exatamente foi prestado o juramento.
- source_word: τῷ ὀνόματι τοῦ κυρίου
  choice: em nome do Senhor
  rationale: Expressa a invocação solene do nome divino como fundamento do juramento; a colocação mantém aberta a relação sintática exata da frase.
- source_word: ἐφιορκήσας
  choice: violou o juramento
  rationale: Indica o descumprimento de um juramento já assumido, em linguagem clara e com força moral e jurídica.
- source_word: ἀπέστη
  choice: se rebelou
  rationale: No contexto régio e político, o verbo aponta naturalmente para rebelião ou ruptura de lealdade, embora seu objeto permaneça implícito.
- source_word: σκληρύνας αὐτοῦ τὸν τράχηλον καὶ τὴν καρδίαν αὐτοῦ
  choice: endureceu o pescoço e o coração
  rationale: Conserva a imagem bíblica concreta de obstinação e a coordenação incomum dos dois elementos no grego.
- source_word: παρέβη τὰ νόμιμα
  choice: transgrediu os preceitos
  rationale: Mantém o tom moral e jurídico de παρέβη, enquanto 'preceitos' representa normas estabelecidas sem restringi-las a uma categoria legislativa moderna.
- source_word: Κυρίου θεοῦ Ἰσραήλ
  choice: do Senhor, Deus de Israel
  rationale: A vírgula torna natural em português a aposição do título divino e preserva a identificação do Senhor como Deus de Israel.
theological_decisions:
- issue: Representação de κύριος na fórmula de juramento e no título divino
  choice: Senhor
  alternative: SENHOR
  rationale: Como o texto-fonte imediato é grego, 'Senhor' traduz κύριος sem inserir na forma gráfica uma decisão textual adicional sobre o tetragrama.
- issue: Objeto implícito de ἀπέστη
  choice: se rebelou
  alternative: rebelou-se contra Nabucodonosor
  rationale: O contexto favorece uma revolta contra o rei, mas o grego não repete explicitamente o objeto; a tradução preserva essa concisão e ambiguidade.
- issue: Relação do juramento com Nabucodonosor
  choice: posto sob juramento pelo rei Nabucodonosor
  alternative: jurado lealdade ao rei Nabucodonosor
  rationale: A alternativa explicita uma lealdade historicamente provável, mas a construção grega ὁρκισθεὶς ἀπό é passiva e literalmente aponta para a ação procedente do rei; a redação escolhida evita resolver silenciosamente a dificuldade.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com leitura natural no Brasil. A ordem foi levemente ajustada para evitar ambiguidade indevida sobre quem invoca o nome do Senhor, mas uma nota conserva a alternativa sintática. A metáfora de endurecer o pescoço e o coração foi mantida por seu caráter bíblico e expressivo.
