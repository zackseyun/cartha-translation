revisions:
- from: Embora tivesse sido posto sob juramento pelo rei Nabucodonosor, em nome do Senhor,[a] ele violou o juramento e se rebelou; endureceu o pescoço e o coração e transgrediu os preceitos do Senhor, Deus de Israel.[b]
  to: Tendo sido posto sob juramento pelo rei Nabucodonosor, em nome do Senhor,[a] violou o juramento e se rebelou; e, endurecendo o pescoço e o coração, transgrediu os preceitos do Senhor, Deus de Israel.[b]
  rationale: A revisão remove a concessão não marcada no texto grego e recupera, por meio de particípios em português, a estrutura circunstancial de ὁρκισθείς e σκληρύνας. Mantém-se a tradução cautelosa de ἀπό como agente/origem do juramento, com nota para a leitura contextual de juramento de lealdade, e não se explicita o objeto de “se rebelou”, que permanece implícito no grego.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:33:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente os elementos centrais: juramento, invocação do nome do Senhor, violação do juramento, rebelião, obstinação e transgressão das normas divinas. Contudo, “Embora” introduz uma relação concessiva que não está expressa no grego, que começa simplesmente com um particípio circunstancial (“tendo sido posto sob juramento”).'
  naturalness: O texto é claro e de registro bíblico moderno. A formulação participial “Tendo sido posto sob juramento” representa melhor a sintaxe grega e evita a concessão acrescentada. “Endurecendo o pescoço e o coração” mantém a relação circunstancial do particípio grego e soa compreensível sem substituir a imagem bíblica.
  terminology: “Senhor, Deus de Israel” é apropriado para Κυρίου θεοῦ Ἰσραήλ. “Preceitos” é defensável para τὰ νόμιμα; a nota registra alternativas relevantes. “Posto sob juramento” reproduz de modo prudente o passivo ὁρκισθείς e a dificuldade de ἀπό, sem transformar em texto principal a inferência de lealdade ao rei.
  issues:
  - severity: medium
    issue: “Embora” acrescenta uma relação concessiva.
    rationale: O grego καὶ ὁρκισθείς introduz a ação anterior/circunstancial sem partícula concessiva. Embora o inglês de auditoria use “though”, a tradução portuguesa deve seguir primariamente o grego e não tornar explícita uma concessão que o texto não marca.
  - severity: low
    issue: A coordenação de “endureceu ... e transgrediu” reduz o valor circunstancial de σκληρύνας.
    rationale: O aoristo participial descreve a disposição ou maneira associada à transgressão. “Endurecendo” preserva essa ligação de modo natural em português.
  revised_text: Tendo sido posto sob juramento pelo rei Nabucodonosor, em nome do Senhor,[a] violou o juramento e se rebelou; e, endurecendo o pescoço e o coração, transgrediu os preceitos do Senhor, Deus de Israel.[b]
  revised_footnotes:
