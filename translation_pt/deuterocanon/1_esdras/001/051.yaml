base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/051.yaml
  text: But he handed everything over into their hands. And after taking all the holy vessels of the Lord, the great and the small, and the chests of the Lord and the royal storehouses, they carried them away to Babylon.
translation:
  language: pt
  text: Mas ele entregou tudo nas mãos deles. E eles tomaram todos os utensílios sagrados do Senhor, os grandes e os pequenos, bem como as arcas do Senhor e os depósitos reais, e os levaram para a Babilônia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέδωκεν εἰς τὰς χεῖρας αὐτῶν
  choice: entregou tudo nas mãos deles
  rationale: Mantém a expressão idiomática grega e seu sentido de sujeição ao poder dos adversários.
- source_word: ἱερὰ σκεύη
  choice: utensílios sagrados
  rationale: Expressa de modo natural os objetos destinados ao serviço sagrado, sem restringi-los a vasos.
- source_word: κιβωτούς
  choice: arcas
  rationale: O plural designa caixas ou cofres; «arcas» preserva a concretude do termo sem identificá-las indevidamente com a Arca da Aliança.
- source_word: βασιλικὰς ἀποθήκας
  choice: depósitos reais
  rationale: Representa locais de armazenamento pertencentes à casa real, sem pressupor especificamente tesouros monetários.
- source_word: ἀπήνεγκαν εἰς Βαβυλῶνα
  choice: os levaram para a Babilônia
  rationale: Reproduz com clareza o transporte dos objetos para o destino indicado.
theological_decisions:
- issue: Referente do sujeito singular em παρέδωκεν
  choice: ele
  alternative: o Senhor / Deus
  rationale: O grego apresenta apenas o pronome implícito no verbo; manter «ele» preserva a dependência do contexto e evita explicitar uma identificação ausente neste versículo.
- issue: Sentido de κιβωτούς
  choice: arcas do Senhor
  alternative: tesouros do Senhor
  rationale: O substantivo significa primariamente caixas, cofres ou arcas. Traduzir por «tesouros» deslocaria o sentido para o conteúdo e poderia harmonizá-lo indevidamente com outra tradição textual.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação foi levemente reorganizada para fluidez, sem eliminar nenhum elemento do grego.
