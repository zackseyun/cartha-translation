base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/005.yaml
  text: according to the writing of David king of Israel[a], and according to the greatness of Solomon his son; and standing in the sanctuary according to your ancestral division, O Levites, before your brothers, the sons of Israel[c][b],
translation:
  language: pt
  text: conforme o escrito de Davi, rei de Israel, e conforme a magnificência de Salomão, seu filho; e tomem posição no santuário segundo a sua divisão ancestral,[a] vocês, levitas, diante de seus irmãos, os filhos de Israel,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A frase grega é condensada. O paralelo hebraico apresenta mais plenamente a ideia: “segundo as casas de seus pais, conforme suas divisões”. “Magnificência” também pode ser traduzido por “grandeza” ou “majestade”, e “no santuário” significa literalmente “no [lugar] santo”.'
    reason: Registra as principais ambiguidades lexicais e a forma mais desenvolvida do paralelo hebraico sem substituir o texto grego como base.
lexical_decisions:
- source_word: γραφήν
  choice: escrito
  rationale: Refere-se a uma determinação escrita associada a Davi, em consonância com o paralelo hebraico בכתב; evita o sentido técnico posterior de “Escritura”.
- source_word: μεγαλειότητα
  choice: magnificência
  rationale: Conserva a ideia de grandeza ou imponência do termo grego sem definir se a referência é à dignidade de Salomão ou à amplitude de sua organização.
- source_word: στᾶντες
  choice: tomando posição
  rationale: Expressa com naturalidade a força contextual quase imperativa do particípio, preservando sua ligação com o local e a organização mencionados em seguida.
- source_word: ἐν τῷ ἁγίῳ
  choice: no santuário
  rationale: Forma idiomática para “no [lugar] santo”, sem especificar uma zona arquitetônica mais estreita do templo.
- source_word: μεριδαρχίαν τὴν πατρικήν
  choice: segundo a divisão de seus antepassados
  rationale: Mantém a formulação grega comprimida e sua referência a uma organização ancestral; o paralelo hebraico confirma o contexto de casas paternas e divisões.
- source_word: τῶν ἔμπροσθεν τῶν ἀδελφῶν ὑμῶν
  choice: diante de seus irmãos
  rationale: Preserva o sentido espacial ou presencial de ἔμπροσθεν e a relação fraterna expressa no grego.
- source_word: υἱῶν Ἰσραήλ
  choice: os filhos de Israel
  rationale: Reproduz a expressão familiar e tribal explícita no grego, em vez de a nivelar para “israelitas” ou “povo de Israel”.
theological_decisions:
- issue: Expressão familiar masculina υἱῶν Ἰσραήλ
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A expressão de aliança e linhagem é explícita na fonte e pode ser preservada naturalmente em português.
- issue: Uso do paralelo hebraico para esclarecer a formulação grega comprimida
  choice: segundo a divisão de seus antepassados
  alternative: segundo suas casas paternas e suas divisões
  rationale: A tradução permanece ancorada no grego, enquanto a nota registra que o hebraico apresenta de modo mais desenvolvido a organização por casas paternas e divisões.
- issue: Referente de μεγαλειότητα
  choice: magnificência de Salomão
  alternative: grandeza de Salomão
  rationale: A formulação conserva a ambiguidade entre a dignidade régia de Salomão e a imponência ou autoridade de sua organização, sem impor uma interpretação teológica particular.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vocês, levitas” torna explícito o vocativo indicado pela segunda pessoa plural e evita o arcaísmo “ó levitas”. A pontuação conserva a continuidade sintática do versículo com o contexto anterior.
