base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/032.yaml
  text: And those from the nation took Jechoniah son of Josiah and made him king in place of Josiah his father, when he was twenty-three years old.
translation:
  language: pt
  text: E os da nação tomaram Jeconias[a], filho de Josias, e o constituíram rei em lugar de Josias, seu pai, quando ele tinha vinte e três anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego traz «Jeconias»; o relato paralelo em 2 Crônicas 36:1 dá o nome «Joacaz».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναλαβόντες
  choice: tomaram
  rationale: Conserva a ação concreta do particípio grego e se encaixa naturalmente na sequência «tomaram... e o constituíram rei», sem especificar indevidamente apreensão ou cerimônia.
- source_word: οἱ ἐκ τοῦ ἔθνους
  choice: os que eram da nação
  rationale: Segue de perto a expressão grega, sem importar a fórmula hebraica mais específica «o povo da terra», ausente do texto-fonte primário.
- source_word: ἀνέδειξαν βασιλέα
  choice: o constituíram rei
  rationale: Expressa a designação para o ofício real de modo digno e claro, sem pressupor uma cerimônia formal de proclamação ou entronização.
- source_word: ἀντὶ
  choice: no lugar de
  rationale: Preserva diretamente a ideia de substituição e sucessão.
- source_word: ὄντα ἐτῶν εἴκοσι τριῶν
  choice: quando ele tinha vinte e três anos
  rationale: Reformula naturalmente em português a construção participial grega, mantendo seu valor descritivo-temporal.
- source_word: Ἰεχονίαν
  choice: Jeconias
  rationale: Transliteração portuguesa tradicional e reconhecível do nome que consta explicitamente no texto grego; a divergência do relato paralelo é indicada em nota.
theological_decisions:
- issue: Divergência do nome próprio em relação ao relato histórico paralelo
  choice: Manter «Jeconias» no texto principal
  alternative: Joacaz
  rationale: O grego de 1 Esdras é a fonte primária desta tradução e lê inequivocamente Ἰεχονίαν. Harmonizar o nome com 2 Crônicas 36:1 apagaria uma divergência textual genuína; por isso, a alternativa fica registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com proximidade moderada à sintaxe grega. «Os que eram da nação» preserva a formulação incomum da fonte; «constituiu rei» comunica nomeação régia sem acrescentar detalhes cerimoniais.
