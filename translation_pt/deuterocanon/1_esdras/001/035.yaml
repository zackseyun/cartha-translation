base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/035.yaml
  text: And the king of Egypt made Joakim his brother king over Judea and Jerusalem[a].
translation:
  language: pt
  text: E o rei do Egito constituiu Joaquim[a], irmão dele, rei da Judeia e de Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No grego, o nome aparece como “Joaquim”; a tradição hebraica paralela geralmente o identifica como Jeoaquim.
    reason: Registra a forma do nome na fonte grega e sua identificação comum na tradição hebraica, sem harmonizar silenciosamente o texto principal.
lexical_decisions:
- source_word: ἀνέδειξεν
  choice: constituiu
  rationale: No contexto de uma ação régia, o verbo indica a designação ou instalação de alguém em um cargo. “Constituiu ... rei” preserva a força causativa e soa digna e natural em português.
- source_word: ὁ βασιλεὺς Αἰγύπτου
  choice: o rei do Egito
  rationale: Tradução direta e idiomática do título com genitivo.
- source_word: Ἰωακεὶμ
  choice: Joaquim
  rationale: “Joaquim” é a forma portuguesa natural que representa adequadamente o nome grego, sem substituir no texto principal a forma da fonte por uma harmonização explícita com a tradição hebraica.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: irmão dele
  rationale: Mantém a relação de parentesco e evita resolver silenciosamente o referente potencialmente ambíguo do pronome grego αὐτοῦ.
- source_word: βασιλέα
  choice: rei
  rationale: O substantivo designa explicitamente o ofício real; “governante” enfraqueceria a formulação.
- source_word: τῆς Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: da Judeia e de Jerusalém
  rationale: A construção portuguesa com “rei de” reproduz de modo natural os genitivos territoriais gregos.
