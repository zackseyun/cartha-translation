base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/033.yaml
  text: And he reigned over Israel and Jerusalem for three months[a]; and the king of Egypt deposed him from reigning in Jerusalem[b],
translation:
  language: pt
  text: E ele reinou sobre Israel e Jerusalém durante três meses[a]; e o rei do Egito o depôs do reinado em Jerusalém[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «em Israel e Jerusalém»; «sobre Israel e Jerusalém» expressa de modo mais natural, em português, o âmbito do governo real.
    reason: lexical_alternative
  - marker: b
    text: O verbo traduzido por «depôs» pode, em outros contextos, significar «restaurou» ou «estabeleceu»; aqui, porém, o contexto indica que o rei do Egito o removeu do reinado.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐβασίλευσεν
  choice: reinou
  rationale: O aoristo indica o exercício da realeza; «reinou» é natural, direto e mantém o registro narrativo.
- source_word: ἐν Ἰσραὴλ καὶ Ἰερουσαλήμ
  choice: sobre Israel e Jerusalém
  rationale: Embora ἐν tenha normalmente sentido locativo, com o verbo de reinar o português idiomático emprega «sobre» para indicar o domínio. Mantém-se «Israel e Jerusalém» conforme o grego.
- source_word: μῆνας τρεῖς
  choice: durante três meses
  rationale: «Durante» expressa com clareza a duração do reinado em português corrente.
- source_word: ἀπεκατέστησεν
  choice: o depôs, impedindo-o
  rationale: O contexto histórico-narrativo exige a cessação do reinado. «Depôs» comunica precisamente a remoção do trono, enquanto a oração seguinte preserva a relação com o infinitivo grego.
- source_word: βασιλεὺς Αἰγύπτου
  choice: o rei do Egito
  rationale: Forma portuguesa transparente e convencional para o título.
- source_word: βασιλεύειν ἐν Ἰερουσαλήμ
  choice: de reinar em Jerusalém
  rationale: Ligado a «impedindo-o», preserva explicitamente a ideia contextual de que ele deixou de exercer o reinado em Jerusalém.
theological_decisions:
- issue: Sentido narrativo de ἀπεκατέστησεν com o infinitivo βασιλεύειν
  choice: O rei do Egito o depôs e, assim, impediu que continuasse reinando em Jerusalém.
  alternative: O rei do Egito o restaurou ou designou para reinar em Jerusalém.
  rationale: Embora ἀποκαθίστημι possa significar «restaurar» ou «estabelecer» em outros contextos, a narrativa da destituição após três meses requer aqui sentido privativo. A nota conserva a alternativa lexical sem inseri-la no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação grega foi mantida, e a vírgula final reflete a continuidade sintática do versículo no contexto maior.
