base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/049.yaml
  text: But they mocked his messengers[a], and whenever the Lord spoke, they were making sport of his prophets, until, in his anger against his nation because of their ungodly deeds[b], he commanded the kings of the Chaldeans to come up against them.
translation:
  language: pt
  text: Eles, porém, zombaram dos mensageiros dele[a] e, no dia em que o Senhor falou, estavam ridicularizando os profetas dele, até que ele, irado contra sua nação por causa dos atos de impiedade deles, ordenou que os reis dos caldeus[b] avançassem contra eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos anjos dele”. Neste contexto, é mais provável que o termo se refira aos mensageiros humanos de Deus, especialmente por estar em paralelo com “os profetas dele”.
    reason: lexical_alternative
  - marker: b
    text: O texto grego diz “os reis dos caldeus”, no plural. O paralelo hebraico em 2 Crônicas 36 destaca o rei da Babilônia, Nabucodonosor. O texto principal segue o testemunho grego de 1 Esdras.
    reason: textual_variant
lexical_decisions:
- source_word: ἐμυκτήρισαν
  choice: zombaram
  rationale: Expressa escárnio e desprezo de maneira natural no português atual.
- source_word: ἐν τοῖς ἀγγέλοις αὐτοῦ
  choice: dos mensageiros dele
  rationale: Neste contexto histórico e profético, ἄγγελοι provavelmente designa emissários humanos de Deus, em paralelo com os profetas; a leitura 'anjos' permanece em nota.
- source_word: ᾗ ἡμέρᾳ ἐλάλησεν Κύριος
  choice: sempre que o Senhor falava
  rationale: A formulação temporal é vertida idiomaticamente como ação repetida, em harmonia com o imperfeito da oração seguinte, sem reduzir a referência a um único dia.
- source_word: ἐκπαίζοντες
  choice: ridicularizavam
  rationale: Preserva a ideia contínua de fazer dos profetas objeto de escárnio e evita repetir 'zombavam'.
- source_word: θυμῶντα αὐτὸν
  choice: irado
  rationale: Converte naturalmente a construção participial grega e mantém a ira divina como antecedente da ordem de julgamento.
- source_word: ἐπὶ τῷ ἔθνει αὐτοῦ
  choice: contra sua própria nação
  rationale: Mantém o equivalente direto de ἔθνος e explicita, por 'própria', a força do possessivo sem trocar 'nação' por 'povo'.
- source_word: διὰ τὰ δυσσεβήματα
  choice: por causa dos atos de impiedade que haviam cometido
  rationale: Conserva a dimensão religiosa de δυσσεβήματα e torna explícita em português a relação dos atos com a nação, já implícita no contexto grego.
- source_word: προστάξαι ἀναβιβάσαι ἐπ᾽ αὐτοὺς
  choice: ordenou que ... avançassem contra eles
  rationale: Comunica com clareza a ordem para uma investida militar contra a nação.
- source_word: τοὺς βασιλεῖς τῶν Χαλδαίων
  choice: os reis dos caldeus
  rationale: Preserva o plural do texto grego primário, sem harmonizá-lo com o rei singular da tradição hebraica paralela.
theological_decisions:
- issue: Referente de ἀγγέλοις no contexto do juízo
  choice: mensageiros humanos enviados por Deus
  alternative: anjos celestiais
  rationale: O paralelismo imediato com 'os profetas dele' favorece emissários humanos, mas a alternativa lexical genuína é preservada em nota.
- issue: Plural grego 'reis dos caldeus' em contraste com a tradição hebraica paralela
  choice: manter o plural do grego
  alternative: o rei dos caldeus, ou Nabucodonosor, rei da Babilônia
  rationale: O grego de 1 Esdras é a fonte primária e não deve ser silenciosamente harmonizado com 2 Crônicas 36.
- issue: Ira divina e responsabilidade pelos atos de impiedade
  choice: preservar a ira do Senhor como resposta aos atos da nação
  alternative: atenuar a construção para uma consequência impessoal
  rationale: A sequência causal do grego atribui diretamente a ordem judicial ao Senhor irado, tensão teológica que deve permanecer no texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Emprega 'dele' para evitar a ambiguidade possível de 'seus' e mantém 'caldeus' em minúscula segundo o uso corrente para nomes de povos.
