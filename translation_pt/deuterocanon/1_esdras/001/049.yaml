revisions:
- from: Eles, porém, zombaram dos mensageiros dele[a] e, sempre que o Senhor falava, ridicularizavam os profetas dele, até que, irado contra sua própria nação por causa dos atos de impiedade que haviam cometido, ele ordenou que os reis dos caldeus avançassem contra eles.[b]
  to: Eles, porém, zombaram dos mensageiros dele[a] e, no dia em que o Senhor falou, estavam ridicularizando os profetas dele, até que ele, irado contra sua nação por causa dos atos de impiedade deles, ordenou que os reis dos caldeus[b] avançassem contra eles.
  rationale: A revisão restaura o valor temporal singular de ᾗ ἡμέρᾳ («no dia em que») e conserva o aspecto durativo do imperfeito perifrástico grego em «estavam ridicularizando». Remove ainda pequenas explicitações interpretativas desnecessárias, sem alterar o sentido nem harmonizar o plural grego com a tradição paralela.
