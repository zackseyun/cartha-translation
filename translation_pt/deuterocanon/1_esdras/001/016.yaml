base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/016.yaml
  text: 'And the matters of the Lord’s sacrifice were completed on that day: the Passover was offered[a], and the sacrifices were brought up onto the altar of the Lord[b], according to the command of King Josias.'
translation:
  language: pt
  text: 'E naquele dia foi concluído tudo o que dizia respeito ao sacrifício do Senhor: a Páscoa foi oferecida[a], e os sacrifícios foram levados ao altar do Senhor, conforme a ordem do rei Josias.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «a Páscoa foi trazida»; o verbo grego, neste contexto sacrificial, também pode ser traduzido por «foi apresentada».
    reason: lexical_alternative
  - marker: b
    text: O grego traz a forma do nome correspondente a «Josias», forma também tradicional em português.
    reason: source_name_clarification
lexical_decisions:
- source_word: συνετελέσθη
  choice: foi concluído
  rationale: O aoristo passivo expressa a conclusão dos procedimentos sacrificiais; a formulação concorda naturalmente com «tudo o que dizia respeito».
- source_word: τὰ τῆς θυσίας τοῦ κυρίου
  choice: tudo o que dizia respeito ao sacrifício do Senhor
  rationale: A expressão grega é ampla e idiomática, abrangendo os assuntos ou procedimentos ligados ao sacrifício, sem restringi-los apenas a ritos.
- source_word: ἀχθῆναι τὸ πάσχα
  choice: a Páscoa foi oferecida
  rationale: Embora ἄγω signifique literalmente trazer ou levar, o contexto sacrificial favorece «oferecida» em português natural; a alternativa literal é preservada em nota.
- source_word: προσαχθῆναι τὰς θυσίας
  choice: os sacrifícios foram levados
  rationale: Preserva o movimento indicado por προσάγω em direção ao altar, evitando fundi-lo semanticamente com a oração anterior.
- source_word: ἐπὶ τὸ τοῦ κυρίου θυσιαστήριον
  choice: ao altar do Senhor
  rationale: ἐπί com acusativo indica movimento em direção ao altar ou até ele; «ao altar» é a expressão mais natural em português e mantém esse sentido direcional.
- source_word: κατὰ τὴν ἐπιταγὴν
  choice: conforme a ordem
  rationale: ἐπιταγή designa uma determinação dotada de autoridade; «ordem» é clara e apropriada ao contexto régio.
- source_word: τοῦ βασιλέως Ἰωσείου
  choice: do rei Josias
  rationale: «Josias» é a forma portuguesa tradicional correspondente ao grego Ἰωσίας/Ἰωσείου e também é a forma usual do nome bíblico em português.
theological_decisions:
- issue: Tradução de κύριος em contexto cultual veterotestamentário/deuterocanônico
  choice: Senhor
  alternative: SENHOR
  rationale: O texto-fonte grego traz κύριος; «Senhor» traduz diretamente o testemunho primário sem substituir graficamente a palavra pelo nome divino inferido da tradição hebraica.
- issue: Forma do nome Ἰωσείου
  choice: Josias
  alternative: Ioshiyahu / forma hebraica do nome
  rationale: «Josias» é tanto uma representação adequada da forma grega quanto a forma bíblica consagrada em português; não há aqui a oposição inglesa entre Josias e Josiah.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção inicial preserva a amplitude da expressão grega sem o artificialismo de «as coisas do sacrifício». A nota sobre o nome esclarece a relação com o grego sem criar uma variante inexistente na tradição portuguesa.
