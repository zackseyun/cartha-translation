base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/004.yaml
  text: You will not need to carry it on your shoulders[a]. Now serve the Lord your God, and minister to his people Israel, and prepare yourselves by your fathers' houses and your divisions[b],
translation:
  language: pt
  text: Não será necessário que vocês a carreguem sobre os ombros.[a] Agora sirvam ao Senhor, seu Deus, atendam ao povo dele, Israel, e preparem-se segundo suas casas paternas e suas tribos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome “a” provavelmente se refere à arca, mencionada no contexto, embora o substantivo não seja repetido neste versículo.
    reason: cross_reference
  - marker: b
    text: 'Grego: “tribos”. O paralelo hebraico em 2 Crônicas 35:4 traz “divisões”, provavelmente com referência aos grupos organizados para o serviço.'
    reason: textual_parallel
lexical_decisions:
- source_word: Οὐκ ἔσται ὑμῖν ἆραι ἐπʼ ὤμων αὐτήν
  choice: Não será necessário que vocês a carreguem sobre os ombros
  rationale: A construção futura com dativo expressa aqui ausência de necessidade ou obrigação. “Carreguem” preserva a ação física de levar algo sobre os ombros, e o pronome feminino “a” mantém a referência contextual sem inserir “arca” no corpo do texto.
- source_word: λατρεύετε
  choice: sirvam
  rationale: O verbo designa serviço prestado a Deus, frequentemente com dimensão cultual. “Sirvam” conserva essa amplitude sem reduzi-la apenas a adoração ou rito.
- source_word: τῷ κυρίῳ θεῷ ὑμῶν
  choice: ao Senhor, seu Deus
  rationale: Reproduz de modo natural em português a expressão pactual grega, mantendo “Senhor” para κύριος.
- source_word: θεραπεύετε
  choice: atendam
  rationale: O verbo significa servir, cuidar ou prestar assistência. “Atendam” distingue esse serviço dirigido a Israel do serviço cultual expresso por λατρεύετε.
- source_word: τὸ ἔθνος αὐτοῦ Ἰσραήλ
  choice: ao povo dele, Israel
  rationale: Embora ἔθνος possa significar “nação”, “povo” é natural no contexto relacional; a formulação retém o possessivo e identifica Israel como esse povo.
- source_word: ἑτοιμάσατε
  choice: preparem-se
  rationale: O imperativo pede prontidão ou organização para o serviço. A forma reflexiva explicita em português o sentido contextual sem acrescentar uma tarefa específica.
- source_word: κατὰ τὰς πατριὰς
  choice: segundo suas casas paternas
  rationale: πατριά indica agrupamentos de descendência ou casas ancestrais. “Casas paternas” conserva a categoria social antiga com clareza razoável.
- source_word: καὶ τὰς φυλὰς ὑμῶν
  choice: e suas tribos
  rationale: φυλή significa diretamente “tribo”. O paralelo hebraico apresenta “divisões”, variante contextual relevante registrada em nota, mas o grego continua sendo a fonte primária.
theological_decisions:
- issue: Distinção entre o serviço prestado a Deus e o atendimento ao povo
  choice: Usar “sirvam” para λατρεύετε e “atendam” para θεραπεύετε
  alternative: Usar “sirvam” para os dois verbos
  rationale: A diferenciação preserva os dois verbos gregos e a tensão entre o serviço cultual dirigido a Deus e o serviço prestado ao povo, sem impor uma estrutura eclesiástica posterior.
- issue: Identificação do objeto representado por αὐτήν
  choice: Manter o pronome “a” no texto e explicar em nota sua provável referência à arca
  alternative: Inserir “a arca” diretamente no texto
  rationale: O referente é fornecido pelo contexto, não repetido neste versículo. Manter o pronome respeita a forma grega e evita transformar uma inferência contextual em substantivo expresso.
- issue: Relação entre φυλάς no grego e o paralelo hebraico
  choice: Traduzir o grego por “tribos” e registrar “divisões” em nota
  alternative: Traduzir diretamente por “divisões”
  rationale: A leitura “divisões” se ajusta à organização levítica do paralelo hebraico, mas o substantivo efetivamente presente no texto grego é “tribos”. A nota preserva ambos os testemunhos sem substituir silenciosamente a fonte primária.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “vocês”. “Casas paternas” mantém a estrutura social antiga sem recorrer a uma paráfrase extensa. A pontuação apresenta o versículo como unidade completa, embora a frase prossiga no contexto imediato.
