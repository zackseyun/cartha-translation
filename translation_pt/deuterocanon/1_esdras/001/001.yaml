base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/001.yaml
  text: And Josiah kept the Passover in Jerusalem to the Lord his God[a], and they slaughtered the Passover on the fourteenth day of the first month,
translation:
  language: pt
  text: Josias celebrou a Páscoa em Jerusalém para o seu Senhor[a], e eles imolaram a vítima pascal no décimo quarto dia do primeiro mês,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, «para o seu Senhor»; o paralelo hebraico em 2 Crônicas 35:1 diz «para o SENHOR».
    reason: Registra a diferença textual relevante entre a fonte grega primária e o paralelo hebraico.
lexical_decisions:
- source_word: ἤγαγεν
  choice: celebrou
  rationale: Embora o verbo signifique literalmente «conduziu» ou «levou», com πάσχα designa aqui a observância da festa; «celebrou» comunica isso de modo natural em português.
- source_word: τὸ πάσχα (primeira ocorrência)
  choice: a Páscoa
  rationale: A primeira ocorrência refere-se à celebração pascal como um todo.
- source_word: τῷ κυρίῳ αὐτοῦ
  choice: para o seu Senhor
  rationale: Preserva o possessivo αὐτοῦ do texto grego, fonte primária, sem importar para o texto principal o nome divino presente no paralelo hebraico.
- source_word: ἔθυσαν
  choice: imolaram
  rationale: Expressa com precisão e dignidade o abate sacrificial indicado pelo verbo.
- source_word: τὸ πάσχα (segunda ocorrência)
  choice: a vítima pascal
  rationale: Com «imolaram», a expressão designa a vítima sacrificial. A explicitação evita o pouco natural «imolaram a Páscoa» sem restringir indevidamente o animal a um cordeiro, algo não expresso no grego.
- source_word: τῇ τεσσαρεσκαιδεκάτῃ ἡμέρᾳ
  choice: no décimo quarto dia
  rationale: Equivalente temporal idiomático e direto em português.
- source_word: τοῦ μηνὸς τοῦ πρώτου
  choice: do primeiro mês
  rationale: Reproduz de forma clara a indicação calendárica do grego.
theological_decisions:
- issue: Tradução de κύριος quando o paralelo hebraico traz YHWH
  choice: Senhor
  alternative: SENHOR
  rationale: O texto grego primário traz κυρίῳ e inclui o possessivo αὐτοῦ. Por isso, «seu Senhor» representa a forma grega, enquanto a nota registra o paralelo hebraico sem substituí-la.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Vítima pascal» mantém precisão cultual sem acrescentar «cordeiro», ausente do grego. A vírgula final foi preservada porque o versículo fornecido continua na sequência textual.
