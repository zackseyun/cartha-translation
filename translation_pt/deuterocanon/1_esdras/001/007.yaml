base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/007.yaml
  text: And Josiah gave to the people who were present thirty thousand lambs and young goats[b][a], and three thousand calves.
translation:
  language: pt
  text: E Josias deu ao povo que estava presente[a] trinta mil cordeiros e cabritos, e três mil bezerros.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «ao povo, aos que foram encontrados»; a expressão provavelmente se refere aos que estavam presentes ou reunidos ali.
    reason: lexical_alternative
  - marker: b
    text: O paralelo hebraico fornecido nos dados da fonte não corresponde de perto a este versículo grego; por isso, a tradução segue o texto grego como fonte principal.
    reason: textual_variant
lexical_decisions:
- source_word: ἐδωρήσατο
  choice: deu
  rationale: O verbo médio expressa dar como presente ou contribuição; «deu» é natural, claro e adequado ao fornecimento real de animais.
- source_word: τῷ λαῷ
  choice: ao povo
  rationale: O dativo indica naturalmente os destinatários da dádiva.
- source_word: τοῖς εὑρεθέντι
  choice: que estava presente
  rationale: Embora a expressão grega seja formalmente difícil e signifique literalmente algo como «os que foram encontrados», no contexto indica o povo presente ou reunido.
- source_word: ἀρνῶν καὶ ἐρίφων
  choice: cordeiros e cabritos
  rationale: ἀρνῶν designa cordeiros, e ἐρίφων, cabritos; os termos portugueses preservam de modo conciso as duas categorias de animais jovens.
- source_word: τριακοντα χιλιάδας
  choice: trinta mil
  rationale: Tradução numérica direta.
- source_word: μόσχους
  choice: bezerros
  rationale: μόσχος designa um bovino jovem; «bezerros» evita especificar indevidamente o sexo.
- source_word: τρισχιλίους
  choice: três mil
  rationale: Tradução numérica direta.
theological_decisions:
- issue: Uso do paralelo massorético apesar da grande divergência
  choice: Traduzir o grego como testemunho primário, mantendo no texto a dádiva de animais feita por Josias.
  alternative: Harmonizar o versículo com a sequência diferente do paralelo hebraico fornecido, referente a sacrificar e preparar a Páscoa.
  rationale: O paralelo hebraico fornecido não corresponde de perto a este versículo grego. Em 1 Esdras, o texto grego de Swete é a fonte principal; portanto, não se deve importar para o texto uma ação ausente no grego.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. «Cabritos» é mais conciso e idiomático do que «cabritos jovens». As notas preservam tanto a forma incomum do grego quanto a divergência textual sem harmonização.
