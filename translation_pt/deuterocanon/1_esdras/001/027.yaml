base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/001/027.yaml
  text: But he arrayed himself for war against him in the plain of Megiddo[a], and the commanders came down against King Josiah.
translation:
  language: pt
  text: Mas ele se preparou para a guerra contra ele, na planície de Megido[a], e os comandantes desceram ao encontro do rei Josias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo hebraico em 2 Crônicas 35:22 diz que Josias “se disfarçou para lutar contra ele”, em vez da formulação grega “se preparou para a guerra contra ele”.
    reason: alternative_reading
lexical_decisions:
- source_word: συνεστήσατο πρὸς αὐτὸν πόλεμον
  choice: se dispôs para a guerra contra ele
  rationale: Preserva a nuance reflexiva da voz média e a ideia de assumir posição ou preparar-se para o conflito, em português natural, sem adotar a leitura hebraica divergente de que Josias se disfarçou.
- source_word: ἐν τῷ πεδίῳ Μετααδδούς
  choice: na planície de Megido
  rationale: πεδίον designa uma planície ou campo aberto. O paralelo hebraico confirma que a forma grega Μετααδδούς corresponde ao topônimo conhecido como Megido.
- source_word: κατέβησαν
  choice: desceram
  rationale: Mantém o sentido direcional explícito do verbo grego, sem substituí-lo por um verbo militar mais interpretativo.
- source_word: οἱ ἄρχοντες
  choice: os comandantes
  rationale: Embora ἄρχοντες possa significar governantes ou líderes, o contexto bélico favorece o sentido de chefes militares.
- source_word: πρὸς βασιλέα Ἰωσίαν
  choice: ao encontro do rei Josias
  rationale: Expressa movimento em direção a Josias e deixa que o contexto indique a possível hostilidade, sem transformar necessariamente πρός em uma preposição adversativa.
theological_decisions:
- issue: Uso do paralelo hebraico quando diverge do texto grego
  choice: Seguir no texto principal a leitura grega, segundo a qual ele se dispôs para a guerra, e usar o hebraico apenas para normalizar o nome Megido.
  alternative: Ele se disfarçou para lutar contra ele, no vale de Megido.
  rationale: O grego de Swete é a testemunha primária indicada para esta passagem. O paralelo hebraico é útil para identificar o topônimo, mas sua leitura verbal materialmente diferente não deve substituir silenciosamente o grego.
- issue: Valor de πρός em κατέβησαν ... πρὸς βασιλέα Ἰωσίαν
  choice: ao encontro do rei Josias
  alternative: contra o rei Josias
  rationale: A construção indica diretamente movimento em direção ao rei; embora o cenário militar permita sentido hostil, a tradução escolhida preserva a amplitude do grego em vez de resolver a relação de modo categórico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Dispôs-se para a guerra” conserva a nuance reflexiva do grego sem soar excessivamente arcaico; “ao encontro de” mantém a direção e a possível tensão contextual de πρός.
