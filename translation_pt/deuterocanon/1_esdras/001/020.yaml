  yaml_path: translation/deuterocanon/1_esdras/001/020.yaml
  text: In the eighteenth year of Iosias's reign[b][a], this Passover was held.
translation:
  language: pt
  text: No décimo oitavo ano do reinado de Iosias[b], realizou-se esta Páscoa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego, literalmente: “esta Páscoa foi conduzida”; a expressão indica que a celebração da Páscoa foi realizada naquela ocasião.'
    reason: lexical_alternative
  - marker: b
    text: O texto hebraico paralelo de 2 Crônicas 35 descreve os israelitas celebrando a Páscoa naquela ocasião; aqui, o grego resume essa celebração.
    reason: cross_reference
lexical_decisions:
- source_word: ὀκτωκαιδεκάτῳ ἔτει
  choice: no décimo oitavo ano
  rationale: O dativo indica o momento em que ocorreu o acontecimento; esta é a formulação temporal natural em português.
- source_word: βασιλεύοντος Ἰωσείου
  choice: do reinado de Josias
  rationale: O genitivo absoluto significa literalmente “enquanto Josias reinava”. A formulação nominal é natural e preserva o sentido temporal. “Josias” é a forma portuguesa tradicional e amplamente reconhecida do nome grego Ἰωσίας.
- source_word: ἤχθη
  choice: realizou-se
  rationale: Embora o verbo signifique literalmente “foi conduzida/levada”, neste contexto indica que a observância da Páscoa foi efetuada. “Realizou-se” mantém o caráter eventivo sem acrescentar uma conotação festiva mais forte.
- source_word: τὸ πάσχα
  choice: esta Páscoa
  rationale: “Páscoa” é a designação portuguesa corrente da festa judaica, e o demonstrativo τοῦτο liga esta celebração à que acaba de ser descrita.
