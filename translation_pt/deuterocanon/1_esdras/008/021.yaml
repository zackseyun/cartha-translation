base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/021.yaml
  text: Let it be done according to the law of God for God Most High[b][a], so that wrath may not come upon the kingdom of the king and his sons.
translation:
  language: pt
  text: Que seja realizado de acordo com a lei de Deus para Deus, o Altíssimo, a fim de que não venha ira sobre o reino do rei e sobre seus filhos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Que isso seja levado a efeito de acordo com a lei de Deus para Deus, o Altíssimo”. O imperativo grego pode referir-se à execução ou ao cumprimento do que foi determinado.'
    reason: lexical_alternative
  - marker: b
    text: O texto massorético paralelo em Esdras 7:22–23 difere consideravelmente neste ponto e especifica quantidades destinadas ao serviço do templo. Aqui, 1 Esdras preserva uma formulação grega mais breve, seguida nesta tradução.
    reason: textual_variant
lexical_decisions:
- source_word: κατὰ τὸν τοῦ θεοῦ νόμον
  choice: de acordo com a lei de Deus
  rationale: Expressa naturalmente a conformidade com a norma divina, preservando νόμος como «lei» no contexto jurídico e cultual.
- source_word: ἐπιτελεσθήτω
  choice: Que tudo seja realizado
  rationale: O imperativo passivo exige a execução do que foi prescrito. «Seja realizado» conserva a ideia de levar a efeito sem acrescentar a noção excessiva de exatidão; «tudo» explicita em português o conteúdo implícito da ordem, sem especificá-lo.
- source_word: τῷ θεῷ τῷ ὑψίστῳ
  choice: para o Deus Altíssimo
  rationale: O dativo indica que a execução se destina ao serviço de Deus; «para» é idiomático nesse contexto, e «Deus Altíssimo» preserva o título.
- source_word: ἕνεκα τοῦ μὴ γενέσθαι
  choice: a fim de que não venha
  rationale: Reproduz a finalidade preventiva da construção grega.
- source_word: ὀργὴν
  choice: ira
  rationale: Mantém a gravidade da desaprovação e do juízo implícitos, sem desenvolver além do texto a identidade do agente.
- source_word: εἰς τὴν βασιλείαν τοῦ βασιλέως
  choice: sobre o reino do rei
  rationale: «Sobre» é natural com «vir ira», enquanto «reino do rei» conserva a formulação explícita do grego.
- source_word: καὶ τῶν υἱῶν
  choice: e sobre seus filhos
  rationale: Repete a relação exigida em português e mantém o sentido específico de filhos, em vez de ampliá-lo para descendentes.
theological_decisions:
- issue: Natureza da ira ameaçada
  choice: Manter «ira» sem inserir explicitamente «de Deus».
  alternative: Traduzir como «ira de Deus» ou como uma desgraça política genérica.
  rationale: O contexto aponta naturalmente para a ira divina, mas o grego traz apenas ὀργή. A tradução preserva essa inferência e evita transformar o implícito em explícito.
- issue: Relação da ação com o Deus Altíssimo
  choice: Traduzir o dativo como «para o Deus Altíssimo».
  alternative: «ao Deus Altíssimo» ou «para Deus, o Altíssimo».
  rationale: «Para» comunica de modo natural que a execução está voltada ao serviço de Deus, sem impor uma interpretação sacrificial ou denominacional.
- issue: Conteúdo da ordem
  choice: Não importar para o texto grego as quantidades e provisões do paralelo massorético.
  alternative: Completar a formulação com os itens especificados no paralelo de Esdras 7:22–23.
  rationale: O testemunho grego fornecido é a âncora primária e apresenta uma formulação mais breve; a diferença textual deve ser informada em nota, não harmonizada no corpo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe normativa e vocabulário bíblico acessível. A pontuação separa «para o Deus Altíssimo» para reduzir a possível leitura de que «lei de Deus» e «Deus Altíssimo» formam uma única expressão, embora a relação sintática do grego continue aberta à alternativa registrada em nota.
