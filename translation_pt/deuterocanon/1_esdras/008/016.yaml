base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/016.yaml
  text: And whatever you and your brothers wish to do with the silver and gold[a], carry it out according to the will of your God.
translation:
  language: pt
  text: E tudo o que você quiser fazer com seus irmãos, com a prata e o ouro[a], faça-o conforme a vontade do seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo hebraico em Esdras 7:18 é mais específico: fala do que parecer bom fazer com o restante da prata e do ouro. Aqui, 1 Esdras apresenta uma formulação grega mais ampla.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα ὅσα ἂν βούλῃ
  choice: tudo o que ... quiserem
  rationale: A construção expressa uma relativa aberta, “tudo o que” ou “qualquer coisa que”. O plural verbal acomoda naturalmente o destinatário junto com seus irmãos, explicitados como sujeitos coordenados em português.
- source_word: μετὰ τῶν ἀδελφῶν σου
  choice: você e seus irmãos
  rationale: Embora a forma mais literal seja “com seus irmãos”, a coordenação explicita com clareza que o destinatário age em conjunto com eles. “Irmãos” preserva o masculino plural e a amplitude possível do termo grego.
- source_word: ποιῆσαι
  choice: fazer
  rationale: O verbo é amplo e descreve de maneira geral o uso que pretendem dar aos recursos, sem especificar uma ação particular.
- source_word: χρυσίῳ καὶ ἀργυρίῳ
  choice: com a prata e o ouro
  rationale: 'Os dativos são entendidos em sentido instrumental ou associativo: aquilo que desejam fazer com esses recursos. Os artigos indicam os valores específicos do contexto.'
- source_word: ἐπιτέλει
  choice: façam
  rationale: O imperativo transmite a execução do que foi decidido. Em português, repetir “façam” é natural e evita uma formulação pesada como “levem isso a cabo”, embora esta expresse mais explicitamente a ideia de execução.
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ σου
  choice: conforme a vontade do seu Deus
  rationale: A expressão mantém a vontade de Deus como norma que limita e orienta o uso dos recursos, em formulação corrente e próxima do grego.
theological_decisions:
- issue: Relação entre a formulação grega ampla e o paralelo massorético de Esdras 7:18, que menciona mais especificamente o restante da prata e do ouro e aquilo que parecer bom fazer.
  choice: Traduzir diretamente o grego como uma autorização ampla para o destinatário e seus irmãos agirem com a prata e o ouro, limitada pela vontade de Deus.
  alternative: 'Harmonizar com o paralelo massorético: “quanto ao restante da prata e do ouro, façam o que parecer bom a você e a seus irmãos”.'
  rationale: O grego é a fonte primária de 1 Esdras e não contém expressão equivalente a “o restante” nem a “o que parecer bom”. A tradução preserva sua formulação mais ampla, enquanto a nota registra a diferença textual.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por “você” para clareza internacional com legibilidade brasileira. O imperativo plural “façam” concorda com o sujeito explicitado “você e seus irmãos”. A ordem “prata e ouro” segue o uso natural em português, embora o grego apresente “ouro e prata”.
