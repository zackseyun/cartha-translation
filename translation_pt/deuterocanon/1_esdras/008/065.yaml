lexical_decisions:
- source_word: τούτων τελεσθέντων
  choice: Depois que essas coisas foram concluídas
  rationale: O genitivo absoluto indica uma ação anterior já completada. A formulação preserva essa relação temporal e o sentido de τελέω, em português natural.
- source_word: προσηλθόσαν μοι
  choice: vieram até mim
  rationale: προσέρχομαι expressa aproximação ou chegada; “vieram até mim” comunica claramente o movimento dirigido à pessoa que narra.
- source_word: οἱ ἡγούμενοι
  choice: os líderes
  rationale: O particípio substantivado designa pessoas que exerciam liderança, sem necessariamente indicar um cargo formal específico.
- source_word: λέγοντες
  choice: dizendo
  rationale: Mantém a construção participial grega e introduz o discurso direto que continua no versículo seguinte.
