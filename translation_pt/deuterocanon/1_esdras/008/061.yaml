revisions:
- from: Depois de partirem do lugar chamado Terá[a], no décimo segundo dia do primeiro mês, chegaram a Jerusalém pela poderosa mão de nosso Senhor, que estava sobre nós; ele nos livrou de toda investida inimiga[b], e chegaram a Jerusalém.[c]
