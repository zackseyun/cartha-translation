base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/061.yaml
  text: And after setting out from the place Thera on the twelfth day of the first month[a], they came to Jerusalem by the mighty hand of our Lord that was upon us; and he rescued us from every enemy from the outset[c][b], and they came to Jerusalem.
translation:
  language: pt
  text: Depois de partirem do lugar chamado Terá[a], no décimo segundo dia do primeiro mês, chegaram a Jerusalém pela poderosa mão de nosso Senhor, que estava sobre nós; ele nos livrou da aproximação de todo inimigo[b], e chegaram a Jerusalém.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego chama o ponto de partida de “Terá”. O paralelo hebraico em Esdras 8:31 traz “o rio Aava”. Como aqui o texto-base é o grego de 1 Esdras, “Terá” foi mantido.
    reason: alternative_reading
  - marker: b
    text: A expressão grega é difícil e diz literalmente algo próximo de “da entrada/aproximação, de todo inimigo”. O paralelo hebraico traz “das mãos do inimigo e do que armava emboscadas no caminho”.
    reason: textual_variant
  - marker: c
    text: O grego alterna de modo irregular entre a terceira pessoa (“partirem”, “chegaram”) e a primeira pessoa (“nós”, “nos”), além de repetir a chegada a Jerusalém. O paralelo hebraico emprega a primeira pessoa do plural. A tradução conserva a alternância e a repetição do grego.
    reason: textual_variant
lexical_decisions:
- source_word: ἀναζεύξαντες
  choice: depois de partirem
  rationale: O particípio indica levantar acampamento e iniciar a viagem. “Depois de partirem” exprime com naturalidade tanto o movimento quanto a relação temporal.
- source_word: τοῦ τόπου Θερὰ
  choice: do lugar chamado Terá
  rationale: O grego identifica o ponto de partida como Θερὰ. A transliteração “Terá” acompanha a forma e a tonicidade gregas; “chamado” esclarece que se trata de um topônimo.
- source_word: τῇ δωδεκάτῃ τοῦ πρώτου μηνὸς
  choice: no décimo segundo dia do primeiro mês
  rationale: Explicitação idiomática da expressão calendárica grega, sem acrescentar informação.
- source_word: κατὰ τὴν κραταιὰν χεῖρα τοῦ κυρίου ἡμῶν τὴν ἐφʼ ἡμῖν
  choice: pela poderosa mão de nosso Senhor, que estava sobre nós
  rationale: Conserva a imagem bíblica da mão divina como poder atuante e mantém a expressão “sobre nós” do grego.
- source_word: ἐρύσατο
  choice: livrou
  rationale: O verbo denota resgatar ou livrar de perigo. “Livrou” é corrente, digno e adequado ao contexto narrativo.
- source_word: ἀπὸ τῆς εἰσόδου ἀπὸ παντὸς ἐχθροῦ
  choice: de toda investida inimiga
  rationale: A construção transmitida é irregular e literalmente envolve “entrada/aproximação” e “todo inimigo”. “Investida inimiga” preserva a noção de aproximação hostil sem impor a leitura do paralelo hebraico ao texto grego; a dificuldade é documentada em nota.
- source_word: καὶ ἤλθον εἰς Ἰερουσαλήμ
  choice: e chegaram a Jerusalém
  rationale: Mantém a terceira pessoa plural do texto grego e também sua repetição da chegada a Jerusalém, em vez de harmonizá-la silenciosamente com a primeira pessoa de “nós”.
theological_decisions:
- issue: Tradução de κύριος numa referência narrativa ao Deus de Israel
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” é a equivalência bíblica estabelecida e natural para κύριος neste contexto, sem introduzir especificidade denominacional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe incomum e a repetição final foram preservadas por refletirem o texto grego transmitido, enquanto as notas esclarecem as tensões textuais.
