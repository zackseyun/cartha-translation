base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/069.yaml
  text: And all who were ever stirred by the word of the Lord[a], the God of Israel, gathered to me while I was mourning over the lawlessness, and I sat grieved until the evening sacrifice.
translation:
  language: pt
  text: E todos os que eram movidos pela palavra do Senhor, o Deus de Israel[a], reuniram-se a mim enquanto eu lamentava a transgressão; e permaneci sentado, profundamente entristecido, até o sacrifício da tarde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego, literalmente: “pela palavra do Senhor de Israel”. A expressão provavelmente tem o sentido de “pela palavra do Senhor, o Deus de Israel”.'
    reason: Registra a formulação incomum do texto grego e preserva a alternativa literal.
lexical_decisions:
- source_word: ἐπισυνήχθησαν πρὸς μέ
  choice: reuniram-se ao meu redor
  rationale: Expressa de modo natural o movimento coletivo em direção ao narrador; “ao meu redor” comunica melhor em português que as pessoas se juntaram a ele.
- source_word: ὅσοι ποτὲ ἐπεκινοῦντο
  choice: todos os que eram movidos
  rationale: Preserva a ideia de impulso interior ou comoção, sem especificar além do que o grego afirma. O valor pouco definido de ποτέ não exige aqui um “alguma vez” pouco natural.
- source_word: τῷ ῥήματι Κυρίου τοῦ Ἰσραήλ
  choice: pela palavra do Senhor, o Deus de Israel
  rationale: A forma grega transmitida é comprimida e, literalmente, pode soar como “do Senhor de Israel”. A formulação adotada segue o provável título bíblico, esclarecido pelo contexto paralelo, sem ocultar a forma grega, registrada em nota.
- source_word: πενθοῦντος
  choice: enquanto eu lamentava
  rationale: Reproduz a simultaneidade indicada pela construção participial e mantém o sentido de luto ou profundo pesar.
- source_word: ἀνομίᾳ
  choice: transgressão
  rationale: Comunica uma violação grave da vontade ou lei divina em português corrente e bíblico, sem a opacidade relativa de “iniquidade” nem uma explicitação excessiva.
- source_word: ἐκαθήμην περίλυπος
  choice: permaneci sentado, profundamente entristecido
  rationale: Conserva tanto a postura sentada quanto a continuidade e a forte aflição expressas no grego.
- source_word: δειλινῆς θυσίας
  choice: sacrifício da tarde
  rationale: É uma formulação clara e tradicional para a oferta sacrificial realizada no fim do dia.
theological_decisions:
- issue: Tradução de Κύριος
  choice: Senhor
  alternative: SENHOR
  rationale: “Senhor” traduz diretamente o grego Κύριος e evita inserir no texto uma forma do nome divino que não aparece no testemunho grego.
- issue: Interpretação de Κυρίου τοῦ Ἰσραήλ
  choice: o Senhor, o Deus de Israel
  alternative: o Senhor de Israel
  rationale: A sintaxe grega é incomum e admite uma tradução mais literal. O título bíblico corrente e o contexto paralelo favorecem entender a expressão como referência ao Senhor, Deus de Israel; a ambiguidade textual é preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem das orações foi levemente ajustada para evitar ambiguidade sobre quem lamentava, preservando a sequência e o conteúdo do grego.
