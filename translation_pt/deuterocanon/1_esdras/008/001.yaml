base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/001.yaml
  text: And after these things[a], in the reign of Artaxerxes king of the Persians, Ezra son of Azariah, son of Zechariah, son of Chelkiah, son of Shallum[b], came up.
translation:
  language: pt
  text: Depois desses acontecimentos[a], durante o reinado de Artaxerxes, rei dos persas[b], Esdras, filho de Azarias, filho de Zacarias, filho de Quelquias[c], filho de Salum, subiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão grega é condensada e pode ser traduzida mais literalmente como «e, posterior a essas coisas, ele está». O paralelo hebraico de Esdras 7:1 diz: «Depois desses acontecimentos».'
    reason: translation_ambiguity
  - marker: b
    text: O grego diz «rei dos persas»; o paralelo hebraico de Esdras 7:1 traz «rei da Pérsia». O texto principal segue o grego de 1 Esdras.
    reason: alternative_reading
  - marker: c
    text: A forma grega «Quelquias» corresponde ao nome apresentado como «Hilquias» no paralelo hebraico.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταγενέστερος τούτων ἐστίν
  choice: Depois desses acontecimentos
  rationale: A expressão grega é condensada e indica uma transição cronológica. A formulação natural em português preserva essa função narrativa; o paralelo hebraico de Esdras 7:1 confirma o sentido geral.
- source_word: βασιλεύοντος Ἀρταξέρξου
  choice: durante o reinado de Artaxerxes
  rationale: O genitivo absoluto estabelece a circunstância temporal; esta formulação é clara e idiomática em português.
- source_word: τοῦ βασιλέως Περσῶν
  choice: rei dos persas
  rationale: Mantém o plural explícito do texto grego, sem harmonizá-lo com o singular «rei da Pérsia» do paralelo hebraico.
- source_word: προσέβη
  choice: subiu
  rationale: Preserva o sentido direcional tradicional da viagem rumo a Jerusalém sem acrescentar um destino que não aparece neste versículo.
- source_word: Ἔσρας
  choice: Esdras
  rationale: Forma consagrada do nome em português.
- source_word: Ἀζαραίου
  choice: Azarias
  rationale: Forma bíblica corrente em português, correspondente ao nome semítico refletido pelo grego.
- source_word: Ζεχρίου
  choice: Zacarias
  rationale: Forma bíblica corrente em português para o nome representado pelo grego.
- source_word: Χελκείου
  choice: Quelquias
  rationale: Representa de modo reconhecível a forma do nome no testemunho grego, distinguindo-a da forma hebraica mais conhecida, Hilquias.
- source_word: Σαλήμου
  choice: Salum
  rationale: Forma portuguesa reconhecível do nome semítico provavelmente refletido pelo grego, apoiada pela tradição genealógica paralela.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes bíblicos reconhecíveis. A sequência genealógica e o plural «dos persas» seguem o grego primário. «Subiu» conserva a direção implícita sem inserir «a Jerusalém», destino não declarado no versículo.
