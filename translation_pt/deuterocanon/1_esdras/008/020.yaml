base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/020.yaml
  text: Likewise[b][a], up to one hundred cors of wheat and one hundred measures of wine.
translation:
  language: pt
  text: Do mesmo modo[b], até cem coros[a] de trigo e cem medidas de vinho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O coro era uma grande unidade antiga de capacidade para produtos secos. O grego também emprega, para o vinho, um termo que designa uma medida para líquidos.
    reason: cultural_note
  - marker: b
    text: 'O paralelo em Esdras 7:22 apresenta essas quantidades como limites administrativos: até cem coros de trigo e cem batos de vinho.'
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καί
  choice: Do mesmo modo
  rationale: Expressa de forma natural o valor aditivo da sequência, introduzindo mais itens da autorização.
- source_word: ἕως
  choice: até
  rationale: Neste contexto de cotas administrativas, indica o limite máximo autorizado, não um ponto final no tempo.
- source_word: πυροῦ
  choice: trigo
  rationale: πυρός designa especificamente trigo, e não cereais em geral.
- source_word: κόρων ἑκατόν
  choice: cem coros
  rationale: κόρος é uma antiga unidade de capacidade para secos; a transliteração preserva a unidade específica do texto.
- source_word: οἴνου
  choice: vinho
  rationale: Equivalente corrente e preciso de οἶνος neste contexto.
- source_word: μετρητῶν ἑκατόν
  choice: cem medidas
  rationale: μετρητής designa uma medida para líquidos. A tradução evita identificá-la silenciosamente com o bato do paralelo aramaico, preservando a formulação própria do grego.
