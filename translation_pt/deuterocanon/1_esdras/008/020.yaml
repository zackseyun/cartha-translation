translation_notes:
  register: Português moderno, claro e digno, com estrutura concisa adequada a uma lista administrativa. Conserva-se “coros” como unidade antiga específica; “medidas” mantém a distinção lexical do grego sem importar para o texto principal a unidade mais específica encontrada no paralelo aramaico.
