base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/049.yaml
  text: 'And from the temple servants whom David and the leaders had assigned to the service of the Levites: temple servants[a], two hundred twenty[b]; all of them were listed by name.'
translation:
  language: pt
  text: E dentre os servidores do templo que Davi e os líderes haviam destinado ao serviço dos levitas, havia duzentos e vinte servidores do templo[a]; todos foram registrados nominalmente.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “netineus”, termo técnico derivado do hebraico para servidores do templo. O grego traz “servidores do templo” (ἱερόδουλοι), enquanto o paralelo hebraico usa נְתִינִים.
    reason: lexical_alternative
  - marker: b
    text: Isto é, todos foram formalmente registrados por nome.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἱεροδούλων / ἱερόδουλοι
  choice: servidores do templo
  rationale: Expressa com clareza a função cultual indicada pelo grego, sem fazer de uma possível condição servil o foco da frase. Também corresponde funcionalmente ao termo hebraico paralelo נְתִינִים.
- source_word: ἔδωκεν
  choice: haviam destinado
  rationale: Embora o sentido básico seja “deu”, neste contexto administrativo o verbo descreve pessoas destinadas ao trabalho dos levitas. O plural acomoda naturalmente Davi e os líderes como agentes conjuntos, conforme confirma o paralelo hebraico.
- source_word: οἱ ἡγούμενοι
  choice: os líderes
  rationale: Termo amplo e natural para as autoridades que aparecem ao lado de Davi, sem especificar indevidamente cargo ou título.
- source_word: εἰς τὴν ἐργασίαν τῶν Λευειτῶν
  choice: ao serviço dos levitas
  rationale: “Serviço” comunica de modo natural o trabalho institucional e cultual realizado em apoio aos levitas.
- source_word: διακόσιοι εἴκοσι
  choice: duzentos e vinte
  rationale: Forma numérica corrente em português.
- source_word: πάντων ἐσημάνθη ὀνοματογραφία
  choice: todos foram registrados nominalmente
  rationale: Reproduz o sentido de um registro formal feito por nome, em português claro e conciso.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção mantém o caráter administrativo da enumeração e evita tanto uma transliteração técnica no texto principal quanto a tradução “escravos do templo”, que destacaria uma condição social não enfatizada no contexto.
