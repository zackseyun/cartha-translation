base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/019.yaml
  text: And I[a], King Artaxerxes, have given orders to the treasurers of Syria and Phoenicia, that whatever Ezra the priest and reader of the law of God Most High may send for, they are to give him carefully, up to one hundred talents of silver[b],
translation:
  language: pt
  text: Eu, o rei Artaxerxes, ordenei aos tesoureiros da Síria e da Fenícia que forneçam, com o devido cuidado, tudo o que Esdras, o sacerdote e leitor[b] da Lei do Deus Altíssimo, solicitar[a], até o limite de cem talentos de prata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enviar”. O verbo grego significa literalmente “enviar”, mas, neste contexto de fornecimento de recursos, provavelmente se refere ao envio de um pedido ou de uma requisição.
    reason: lexical_alternative
  - marker: b
    text: 'Grego: “leitor da Lei”. Em tradições paralelas sobre Esdras, ele é frequentemente chamado de escriba; este texto grego, porém, diz explicitamente “leitor”.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσέταξα
  choice: ordenei
  rationale: O aoristo de προστάσσω expressa uma ordem oficial e autoritativa; “ordenei” é direto, natural e adequado a um decreto real.
- source_word: γαζοφύλαξι
  choice: tesoureiros
  rationale: O termo designa os oficiais responsáveis pelos recursos do tesouro; “tesoureiros” é conciso e corrente.
- source_word: ἐπιμελῶς
  choice: com o devido cuidado
  rationale: O advérbio indica execução cuidadosa e atenta, sem necessariamente especificar rapidez.
- source_word: ἀποστείλῃ
  choice: mandar pedir
  rationale: O sentido literal é “enviar”, mas, neste contexto de provisões, refere-se naturalmente a enviar uma requisição; “mandar pedir” conserva tanto a ideia de envio quanto a de solicitação.
- source_word: ἀναγνώστης
  choice: leitor
  rationale: O grego diz explicitamente “leitor”; não se substitui o termo por “escriba” com base apenas nas tradições paralelas.
- source_word: τοῦ νόμου τοῦ θεοῦ τοῦ ὑψίστου
  choice: da Lei do Deus Altíssimo
  rationale: A formulação é natural em português e preserva o título divino e sua força teológica.
- source_word: ἕως ἀργυρίου τάλαντων ἑκατόν
  choice: até o limite de cem talentos de prata
  rationale: ἕως estabelece o teto autorizado; “até o limite de” torna essa função inequívoca.
- source_word: ἰδοὺ
  choice: não representado diretamente
  rationale: Como partícula discursiva enfática, ἰδού soaria artificial como “eis” nesta formulação moderna; a identificação real em primeira pessoa mantém a ênfase do enunciado.
theological_decisions:
- issue: Título divino τοῦ θεοῦ τοῦ ὑψίστου
  choice: Deus Altíssimo
  alternative: o Altíssimo Deus
  rationale: “Deus Altíssimo” preserva o título aplicado ao Deus de Israel e é a ordem mais natural no português contemporâneo.
translation_notes:
  register: Português moderno, claro e digno, com formulação compatível com um decreto real. A tradução segue prioritariamente o grego de 1 Esdras; o paralelo aramaico não controla este versículo por corresponder apenas aproximadamente ao contexto. Os marcadores foram colocados junto aos termos a que suas notas realmente se referem.
