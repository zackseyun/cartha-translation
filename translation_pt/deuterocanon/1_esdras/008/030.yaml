base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/030.yaml
  text: 'Of the sons of Pharez: Zechariah[a], and with him, according to the record[b], one hundred fifty men.'
translation:
  language: pt
  text: 'Dos filhos de Farés: Zacarias[a] e, com ele, conforme o registro[b], cento e cinquenta homens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo hebraico traz “Parós”, e não “Farés”. O texto principal segue o testemunho grego de 1 Esdras.
    reason: alternative_reading
  - marker: b
    text: Ou “segundo o documento” ou “a partir da lista”; a expressão se refere ao arrolamento registrado.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φαρές
  choice: Farés
  rationale: Translitera diretamente a forma grega, que é a fonte principal de 1 Esdras; a divergência do paralelo hebraico é preservada em nota.
- source_word: Ζαχαρίας
  choice: Zacarias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome grego, também confirmada pelo paralelo hebraico.
- source_word: μετʼ αὐτοῦ
  choice: com ele
  rationale: Expressa naturalmente a ideia de acompanhamento.
- source_word: ἀπὸ γραφῆς
  choice: conforme o registro
  rationale: A expressão significa literalmente algo como 'a partir do escrito/registro'; no contexto, refere-se ao arrolamento documentado, sem especificar além do que o grego afirma.
- source_word: ἄνδρες
  choice: homens
  rationale: Mantém a referência masculina explícita do grego, corroborada pelo paralelo hebraico.
- source_word: ἑκατὸν πεντήκοντα
  choice: cento e cinquenta
  rationale: Tradução direta do numeral em português corrente.
