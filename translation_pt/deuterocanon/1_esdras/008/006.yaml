base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/006.yaml
  text: In the seventh year of the reign of Artaxerxes[a], in the fifth month—they arrived at Jerusalem; for they had set out from Babylon on the new moon of the first month[c][b], and they came to Jerusalem according to the prosperity of the journey given to them by the Lord upon him.
translation:
  language: pt
  text: No sétimo ano do reinado de Artaxerxes[a], no quinto mês, eles chegaram[b] a Jerusalém; pois, tendo ele partido da Babilônia na lua nova do primeiro mês, chegaram a Jerusalém conforme o bom êxito da viagem que lhes foi concedido pelo Senhor sobre ele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego acrescenta aqui uma oração difícil: “este ano era o segundo para o rei”. Ela não combina com a referência ao sétimo ano e não aparece no paralelo hebraico (Esdras 7:6–9); pode refletir corrupção ou deslocamento textual.'
    reason: textual_variant
  - marker: b
    text: 'O grego alterna entre o singular e o plural: o particípio “tendo ele partido” está no singular, mas “eles chegaram” e “lhes foi concedido” estão no plural. O paralelo hebraico concentra o relato em Esdras, no singular (Esdras 7:6–9).'
    reason: alternative_reading
  - marker: c
    text: Literalmente, “sobre ele”. A expressão provavelmente indica que o favor ou a mão do Senhor estava sobre Esdras, como declara explicitamente o paralelo hebraico; a construção grega, porém, é difícil e passa do plural para o singular.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτους ἑβδόμου βασιλεύοντος Ἀρταξέρξου
  choice: No sétimo ano do reinado de Artaxerxes
  rationale: Expressa naturalmente a construção temporal grega e preserva a datação pelo reinado.
- source_word: ἐν τῷ πέμπτῳ μηνί
  choice: no quinto mês
  rationale: Tradução direta da indicação temporal.
- source_word: ἐξελθόντος γὰρ ἐκ Βαβυλῶνος
  choice: pois haviam partido da Babilônia
  rationale: γάρ introduz a explicação, e o mais-que-perfeito deixa clara a anterioridade da partida em relação à chegada. O grego não explicita o número do particípio, mas o contexto imediato emprega formas plurais.
- source_word: τῇ νουμηνίᾳ τοῦ πρώτου μηνός
  choice: na lua nova do primeiro mês
  rationale: νουμηνία designa especificamente a lua nova, embora o paralelo hebraico diga 'no primeiro dia' do mês.
- source_word: παρεγένοντο εἰς Ἰερουσαλήμ
  choice: eles chegaram a Jerusalém
  rationale: Mantém o plural do texto grego e o sentido de chegada ao destino.
- source_word: κατὰ τὴν δοθεῖσαν αὐτοῖς εὐοδίαν
  choice: conforme o bom êxito na viagem que lhes foi concedido
  rationale: εὐοδία pode indicar sucesso ou uma viagem bem-sucedida; a formulação conserva tanto a ideia de viagem quanto a de resultado favorável.
- source_word: παρὰ τοῦ κυρίου
  choice: pelo Senhor
  rationale: παρά com o genitivo indica a fonte; com 'concedido', 'pelo Senhor' é natural em português.
- source_word: ἐπʼ αὐτῷ
  choice: sobre ele
  rationale: Preserva literalmente a difícil expressão singular, sem substituir no texto principal a provável referência ao favor ou à mão divina sobre Esdras.
- source_word: οὗτος ἐνιαυτὸς ὁ δεύτερος βασιλεῖ
  choice: não representado no texto principal
  rationale: A oração transmitida, literalmente próxima de 'este ano era o segundo para o rei', contradiz a datação pelo sétimo ano, é sintaticamente problemática e não aparece no paralelo hebraico; por isso é registrada em nota textual, sem receber uma harmonização conjectural.
theological_decisions:
- issue: Tradução de κύριος no relato grego, diante do paralelo hebraico com יהוה
  choice: Senhor
  alternative: SENHOR
  rationale: O texto-base grego traz κύριος. 'Senhor' traduz esse testemunho diretamente, enquanto a nota pode mencionar que o paralelo hebraico explicita o nome divino.
- issue: Identidade daquele sobre quem está o favor divino em ἐπʼ αὐτῷ
  choice: manter 'sobre ele' e explicar a provável referência a Esdras em nota
  alternative: explicitar 'porque a mão do Senhor estava sobre Esdras'
  rationale: O grego conserva uma mudança difícil do plural para o singular e não menciona 'mão' nesta oração. A explicitação seria interpretativa, embora seja apoiada pelo paralelo hebraico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição de “chegaram a Jerusalém” foi mantida porque ocorre no grego e estrutura a explicação da viagem. A expressão final permanece deliberadamente próxima do texto difícil, apoiada por nota, para não apagar a mudança entre plural e singular.
