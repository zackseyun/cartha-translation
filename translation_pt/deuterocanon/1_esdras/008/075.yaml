base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/075.yaml
  text: And now, for a little while, mercy has come to us from the Lord, the Lord, to leave us a root and a name in this holy place,
translation:
  language: pt
  text: E agora, por um breve momento, veio-nos misericórdia da parte do Senhor, o Senhor, para nos deixar uma raiz e um nome neste lugar santo,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ πόσον τι
  choice: por um breve momento
  rationale: Expressa de modo natural o curto intervalo indicado pela locução grega, em harmonia com o contexto da oração.
- source_word: ἐγενήθη ἔλεος ἡμῖν
  choice: veio-nos misericórdia
  rationale: Conserva a misericórdia como dádiva recebida, sem tornar explícito um agente além do que a frase seguinte declara.
- source_word: παρὰ τοῦ κυρίου Κυρίου
  choice: da parte do Senhor, o Senhor
  rationale: Preserva a repetição incomum do título divino no texto grego, dando-lhe uma forma inteligível em português.
- source_word: ῥίζαν καὶ ὄνομα
  choice: uma raiz e um nome
  rationale: Mantém as duas imagens concretas do grego; 'raiz' não é substituída interpretativamente por 'remanescente'.
- source_word: ἐν τῷ τόπῳ τούτῳ ἁγιάσματος
  choice: neste lugar santo
  rationale: Verte de maneira idiomática a expressão grega que caracteriza o lugar pela santidade ou pelo santuário.
theological_decisions:
- issue: Sentido de ῥίζα
  choice: raiz
  alternative: remanescente
  rationale: A tradução conserva a metáfora textual e evita resolver sua possível referência aos sobreviventes da comunidade.
- issue: Repetição de κύριος
  choice: Senhor, o Senhor
  alternative: Senhor Deus
  rationale: O grego repete κύριος e não contém θεός; a repetição foi mantida sem introduzir outro título divino.
translation_notes:
  register: Português atual, digno e acessível, com leve elevação própria de uma oração penitencial. A ordem foi ajustada apenas o necessário para fluência, preservando as imagens e a repetição marcante do original.
