base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/080.yaml
  text: saying that the land into which you are entering to inherit is a land defiled by the defilement of the foreigners of the land[b][a], and they have filled it with their uncleanness.
translation:
  language: pt
  text: 'dizendo: “A terra em que vocês estão entrando para receber como herança é uma terra contaminada pela contaminação dos estrangeiros da terra[a], e eles a encheram com a sua impureza[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme a expressão da tradição hebraica paralela: “dos povos da terra”. O grego diz mais especificamente “dos estrangeiros da terra”.'
    reason: alternative_reading
  - marker: b
    text: “Impureza” pode ter aqui sentido tanto ritual quanto moral; a expressão não exige que se escolha apenas um deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γῆ
  choice: a terra
  rationale: No contexto de entrada e herança, refere-se ao território específico, não ao mundo em geral.
- source_word: εἰς ἣν εἰσέρχεσθε
  choice: em que vocês estão entrando
  rationale: Expressa naturalmente em português a direção de εἰς e conserva o aspecto presente da entrada.
- source_word: κληρονομῆσαι
  choice: para receber como herança
  rationale: Preserva a linguagem de herança de κληρονομέω e soa mais natural do que simplesmente “herdar” neste contexto territorial.
- source_word: μεμολυσμένη μολυσμῷ
  choice: contaminada pela contaminação
  rationale: Mantém a repetição enfática de termos cognatos no grego e permite tanto conotações rituais quanto morais.
- source_word: τῶν ἀλλογενῶν τῆς γῆς
  choice: dos estrangeiros da terra
  rationale: Segue o grego primário, no qual ἀλλογενής destaca que pertencem a outro povo; a expressão paralela “povos da terra” é registrada em nota.
- source_word: τῆς ἀκαθαρσίας αὐτῶν
  choice: com a sua impureza
  rationale: “Impureza” conserva a possível força ritual e moral de ἀκαθαρσία sem restringi-la a apenas uma delas.
- source_word: ἐνέπλησαν αὐτήν
  choice: eles a encheram
  rationale: Traduz diretamente o verbo “encher” e apresenta a ação passada cujo resultado caracteriza a terra.
theological_decisions:
- issue: Preservar a amplitude ritual e moral dos termos de contaminação e impureza
  choice: contaminada; impureza
  alternative: moralmente corrompida; ritualmente impura
  rationale: μολυσμός e ἀκαθαρσία podem abranger dimensões cultuais e éticas; a tradução evita resolver a tensão em favor de apenas uma delas.
- issue: Identidade dos que contaminaram a terra
  choice: estrangeiros da terra
  alternative: povos da terra
  rationale: O grego ἀλλογενῶν explicita a condição de pertencerem a outro povo, enquanto a formulação alternativa reflete melhor o idioma da tradição hebraica paralela.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A repetição “contaminada pela contaminação” é deliberadamente preservada por refletir a ênfase do grego, embora seja menos idiomática.
