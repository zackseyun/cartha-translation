base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/012.yaml
  text: so that they may inspect Judea and Jerusalem[a], according to the law of the Lord that is in your hand[b],
translation:
  language: pt
  text: para que examinem a Judeia e Jerusalém[a], de acordo com a lei do Senhor que ele possui[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fiscalizem” ou “averiguem a situação em”. O verbo grego pode indicar inspeção, visitação ou exame oficial.
    reason: lexical_alternative
  - marker: b
    text: O grego é sintaticamente condensado e traz “ele possui”, sem deixar inteiramente explícito quem é o sujeito. O paralelo em Esdras 7 apresenta a lei de Deus como estando nas mãos de Esdras, isto é, em sua posse ou confiada a ele.
    reason: textual_ambiguity_cross_reference
lexical_decisions:
- source_word: ὅπως
  choice: para que
  rationale: Introduz uma oração de finalidade e pede naturalmente o subjuntivo em português.
- source_word: ἐπισκέψωνται
  choice: examinem
  rationale: No contexto de uma autorização régia, o verbo indica averiguação ou inspeção oficial, não uma simples visita.
- source_word: κατὰ τὴν Ἰουδαίαν καὶ κατὰ Ἰερουσαλήμ
  choice: a Judeia e Jerusalém
  rationale: O κατά repetido delimita o âmbito ou objeto da averiguação. A formulação é natural em português sem apagar os dois termos.
- source_word: ἀκολούθως
  choice: de acordo com
  rationale: Expressa conformidade com uma norma ou padrão.
- source_word: ᾧ ἔχει νόμῳ Κυρίου
  choice: a lei do Senhor que ele tem
  rationale: Mantém a construção comprimida do grego e a forma verbal de terceira pessoa ἔχει, sem substituí-la silenciosamente pela segunda pessoa sugerida pelo paralelo de Esdras 7.
- source_word: Κυρίου
  choice: Senhor
  rationale: É a tradução corrente de κύριος quando designa o Deus de Israel neste contexto escriturístico.
theological_decisions:
- issue: Tradução de Κυρίου no contexto judaico das Escrituras
  choice: Senhor
  alternative: SENHOR
  rationale: O texto grego traz Κυρίου; “Senhor” comunica seu valor sem introduzir uma convenção tipográfica baseada numa retroversão não exigida pelo texto-fonte.
- issue: Identidade do possuidor da lei
  choice: que ele tem
  alternative: que está em seu poder / que tens em tuas mãos
  rationale: O grego usa ἔχει, terceira pessoa do singular, e não identifica de modo totalmente explícito o sujeito. A tradução preserva essa tensão; a nota registra o paralelo sem fazê-lo substituir o texto grego.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com terminologia administrativa compreensível. A formulação deliberadamente conserva a ambiguidade do grego na oração final, em vez de importar para o texto principal a segunda pessoa do paralelo semítico.
