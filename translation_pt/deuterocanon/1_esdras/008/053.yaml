base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/053.yaml
  text: For we had told the king that the strength of our Lord would be with those who seek him for every restoration[a][b].
translation:
  language: pt
  text: Pois tínhamos dito ao rei que a força do nosso Senhor estaria com os que o buscam para toda restauração[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para qualquer restauração”. A expressão grega é incomum; também pode ser entendida de modo mais amplo como “para o êxito” ou “para um bom resultado”.
    reason: lexical_alternative
  - marker: b
    text: 'O paralelo hebraico neste ponto difere consideravelmente: fala de jejuar e buscar a Deus, em vez de repetir o que havia sido dito ao rei. Esta tradução segue o texto grego de 1 Esdras como testemunha principal.'
    reason: textual_variant
lexical_decisions:
- source_word: εἴπαμεν
  choice: tínhamos dito
  rationale: O mais-que-perfeito composto expressa naturalmente que essa declaração ao rei precedeu a ação narrada no contexto; “dito ao rei” traduz com clareza a fala dirigida a ele.
- source_word: Ἰσχὺς
  choice: a força
  rationale: Ἰσχύς designa força ou vigor. “Força” é corrente, clara e preserva o sentido de capacidade divina sem torná-lo mais abstrato.
- source_word: τοῦ κυρίου ἡμῶν
  choice: do nosso Senhor
  rationale: No contexto judaico grego, κύριος refere-se reverentemente a Deus; “nosso Senhor” mantém esse valor e a continuidade do uso bíblico.
- source_word: μετὰ τῶν ἐπιζητούντων αὐτόν
  choice: com os que o buscam
  rationale: A formulação é natural em português e conserva o sentido de procurar ou buscar a Deus; o possível valor intensivo de ἐπιζητέω não precisa ser explicitado no texto principal.
- source_word: εἰς πᾶσαν ἐπανόρθωσιν
  choice: para toda restauração
  rationale: ἐπανόρθωσις pode indicar restauração, correção ou restabelecimento. A escolha preserva o conteúdo lexical concreto e a construção incomum do grego sem harmonizá-la com o paralelo hebraico.
theological_decisions:
- issue: Tradução de κύριος com referência a Deus
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” é a forma bíblica corrente e reverente em português e preserva adequadamente o referente divino neste contexto.
- issue: Sentido específico de ἐπανόρθωσις na expressão difícil
  choice: restauração
  alternative: êxito
  rationale: Como o grego é a testemunha primária e emprega explicitamente ἐπανόρθωσις, o texto principal mantém “restauração”. A nota registra sentidos contextuais mais amplos sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a relação contínua da frase grega, sem vírgula antes de “para toda restauração”, e as notas preservam tanto a dificuldade lexical quanto a divergência textual.
