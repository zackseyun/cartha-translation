  source_fidelity: A tradução acompanha corretamente o grego quanto à dádiva feita pelo povo, ao templo do seu Senhor em Jerusalém, à coleta de ouro e prata e à enumeração dos animais. Contudo, «para a compra de» introduz uma ação não expressa por εἰς; a formulação simples «para touros...» preserva melhor a concisão e a abertura semântica do original.
