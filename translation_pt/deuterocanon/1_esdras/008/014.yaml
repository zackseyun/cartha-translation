base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/014.yaml
  text: together with what was freely given by the nation for the temple of their Lord in Jerusalem[a], and the gold and silver to be gathered for bulls and rams and lambs and what goes with them[b],
translation:
  language: pt
  text: junto com o que foi doado pelo povo para o templo do seu Senhor em Jerusalém[a], bem como o ouro e a prata a serem reunidos para touros, carneiros, cordeiros e o que os acompanha[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo hebraico em Esdras 7:16 difere consideravelmente: fala da prata e do ouro oferecidos voluntariamente pelo rei e seus conselheiros ao Deus de Israel, cuja morada está em Jerusalém. Aqui, traduz-se a redação própria do grego de 1 Esdras.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “as coisas que os acompanham”, provavelmente os demais itens necessários para os sacrifícios.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν τῷ δεδωρημένῳ ὑπὸ τοῦ ἔθνους
  choice: junto com o que foi doado pelo povo
  rationale: Mantém o valor aditivo de σύν e o caráter de dádiva do particípio perfeito. Neste contexto, “povo” expressa naturalmente o coletivo ἔθνος sem sugerir necessariamente um Estado nacional moderno.
- source_word: εἰς τὸ ἱερὸν τοῦ κυρίου αὐτῶν τὸ ἐν Ἰερουσαλήμ
  choice: para o templo do seu Senhor em Jerusalém
  rationale: “Templo” é claro e corrente para ἱερόν; a finalidade da doação é expressa por “para”. Conserva-se “seu Senhor”, sem acrescentar “Deus”, que não aparece no texto grego.
- source_word: συναχθῆναι τό τε χρυσίον καὶ ἀργύριον
  choice: e que o ouro e a prata sejam reunidos
  rationale: A construção com “que ... sejam reunidos” reproduz o infinitivo passivo dentro da frase mais ampla e evita decidir quem realiza a coleta.
- source_word: εἰς ταύρους καὶ κριοὺς καὶ ἄρνας
  choice: para a compra de touros, carneiros, cordeiros
  rationale: O grego diz literalmente “para touros...”; “para a compra de” explicita em português a função natural do ouro e da prata, sem alterar os animais sacrificiais enumerados.
- source_word: τὰ τούτοις ἀκόλουθα
  choice: do que os acompanha
  rationale: Preserva a generalidade da expressão grega e não identifica indevidamente os itens como ofertas específicas, embora o contexto provavelmente seja sacrificial.
theological_decisions:
- issue: Relação entre o texto grego de 1 Esdras e o paralelo massorético de Esdras 7:16
  choice: 'Traduzir o grego como está: a dádiva vem “do povo” e se destina ao templo “do seu Senhor”.'
  alternative: Harmonizar com o paralelo hebraico, mencionando a prata e o ouro oferecidos pelo rei e seus conselheiros ao Deus de Israel.
  rationale: O grego é a fonte primária para 1 Esdras e diverge substancialmente do paralelo hebraico. Harmonizá-los ocultaria uma variante textual genuína.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. O trecho permanece sintaticamente aberto por fazer parte de uma frase maior; a vírgula final conserva essa continuidade.
