base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/073.yaml
  text: From the times of our fathers[b][a], we have been in great sin until this day.
translation:
  language: pt
  text: Desde os tempos de nossos pais[a], temos estado em grande pecado[b] até o dia de hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «de nossos antepassados». O grego diz literalmente «de nossos pais», usando o idioma ancestral masculino.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «estamos em grande pecado». O verbo grego está no presente, mas a construção temporal descreve um estado que se prolonga do passado até o presente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῶν χρόνων
  choice: Desde os tempos
  rationale: A preposição ἀπό com o genitivo indica o ponto inicial no tempo; «desde» expressa naturalmente em português a continuidade que chega ao presente.
- source_word: τῶν πατέρων ἡμῶν
  choice: de nossos pais
  rationale: Mantém o substantivo masculino do grego e o idioma ancestral da fonte, sem excluir a possibilidade contextual de referência mais ampla aos antepassados.
- source_word: καὶ ἐσμεν
  choice: temos estado
  rationale: Embora ἐσμεν seja formalmente presente («estamos»), a construção temporal iniciada por ἀπό e concluída por ἕως descreve um estado contínuo desde o passado até o presente. O perfeito composto é natural em português nesse contexto; o καί paratático não precisa ser reproduzido por «e» após a oração temporal introdutória.
- source_word: ἐν μεγάλῃ ἁμαρτίᾳ
  choice: em grande pecado
  rationale: Conserva a categoria moral e religiosa de ἁμαρτία e a intensidade de μεγάλῃ, sem substituir «pecado» pela noção mais jurídica de «culpa».
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: até o dia de hoje
  rationale: Reproduz de perto a expressão temporal grega e indica continuidade até o presente do falante.
theological_decisions:
- issue: Linguagem ancestral marcada pelo gênero
  choice: de nossos pais
  alternative: de nossos antepassados
  rationale: πατέρων é masculino plural. A tradução principal preserva essa forma, enquanto a nota registra o sentido coletivo ancestral possível.
- issue: Pecado ou culpa
  choice: em grande pecado
  alternative: em grande culpa
  rationale: ἁμαρτία significa ordinariamente «pecado». Embora a culpa esteja implicada, traduzi-la diretamente acrescentaria uma nuance jurídica não exigida pelo texto.
- issue: Estado presente ou continuidade desde o passado
  choice: temos estado
  alternative: estamos
  rationale: A forma verbal grega é presente, mas a moldura temporal «desde... até o dia de hoje» apresenta a condição como iniciada no passado e ainda vigente. A alternativa literal é preservada em nota.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e compreensão internacional. A formulação permanece próxima da estrutura grega, mas usa o perfeito composto para comunicar naturalmente a continuidade temporal.
