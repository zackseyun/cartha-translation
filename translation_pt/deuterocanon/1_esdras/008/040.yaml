- source_word: μετʼ αὐτῶν
  choice: com eles
  rationale: A preposição μετά com o genitivo expressa companhia; “com eles” reproduz de modo natural e direto o sentido do grego.
- source_word: ἄνδρες
  choice: homens
  rationale: ἄνδρες designa aqui pessoas do sexo masculino, não pessoas em geral; “homens” mantém essa precisão.
- source_word: ἑβδομήκοντα
