  yaml_path: translation/deuterocanon/1_esdras/008/036.yaml
  text: 'From the sons of Bani: Salimoth son of Josaphias[a], and with him one hundred sixty men;'
translation:
  language: pt
  text: 'Dos filhos de Bani: Salimote, filho de Josafias[a], e com ele cento e sessenta homens;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo hebraico em Esdras 8:8 difere substancialmente neste ponto, pois apresenta outra linhagem familiar, outro líder e outro número. Como esta tradução de 1 Esdras se baseia no testemunho grego, o texto principal segue o grego: “Bani... Salimote, filho de Josafias... cento e sessenta homens”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Βανίας
  choice: dos filhos de Bani
  rationale: Mantém a fórmula genealógica concisa do grego; neste contexto, “filhos” também pode designar descendentes ou membros da linhagem familiar.
- source_word: Σαλειμὼθ
  choice: Salimote
  rationale: Translitera a forma do nome preservada no testemunho grego primário, com adaptação ortográfica natural ao português.
- source_word: Ἰωσαφίου
  choice: filho de Josafias
  rationale: O genitivo do nome é expresso naturalmente como filiação em uma lista genealógica; “Josafias” acompanha a forma grega.
- source_word: καὶ μετʼ αὐτοῦ
  choice: e com ele
  rationale: Reproduz diretamente a construção elíptica e concisa da lista grega.
- source_word: ἄνδρες
  choice: homens
  rationale: Preserva a referência específica a pessoas do sexo masculino no contexto da enumeração.
- source_word: ἑκατὸν ἑξήκοντα
  choice: cento e sessenta
  rationale: É a forma cardinal clara e corrente em português.
