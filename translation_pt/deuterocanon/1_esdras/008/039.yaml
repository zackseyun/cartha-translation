base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/039.yaml
  text: 'From the sons of Adoniakim[a], the last ones, and these are their names: Eliphala son of Geuel, and Shemaiah[b],'
translation:
  language: pt
  text: 'Dos filhos de Adoniakim, os últimos[a], e estes são os seus nomes: Elifala, filho de Geuel, e Samaías[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, “os últimos”. A expressão pode indicar o último subgrupo ou descendentes posteriores dentro da linhagem familiar; a formulação próxima ao original preserva essa incerteza.
    reason: lexical_alternative
  - marker: b
    text: A testemunha paralela do Texto Massorético para a lista correspondente de Esdras diverge neste ponto, mencionando outra família e outro número. Como 1 Esdras por vezes reorganiza ou reformula seus paralelos hebraicos, segue-se aqui o texto grego como fonte primária.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Dos filhos de
  rationale: A construção expressa procedência ou pertencimento a um grupo familiar; esta fórmula é natural em português e adequada ao contexto de uma lista genealógica.
- source_word: Ἀδωνιακαὶμ
  choice: Adoniakim
  rationale: Transliteração da forma grega, que é a testemunha primária neste versículo, sem substituí-la pela forma de outra tradição textual.
- source_word: οἱ ἔσχατοι
  choice: os últimos
  rationale: Preserva o sentido literal de ἔσχατοι e a incerteza sobre se a expressão indica o último subgrupo ou membros posteriores da linhagem.
- source_word: καὶ ταῦτα τὰ ὀνόματα αὐτῶν
  choice: e estes são os seus nomes
  rationale: Forma corrente e clara em português para introduzir os nomes enumerados no texto.
- source_word: Ἐλειφάλα
  choice: Elifala
  rationale: Transliteração portuguesa legível da forma grega do nome próprio.
- source_word: τοῦ Γεουὴλ
  choice: filho de Geuel
  rationale: Nesse tipo de lista, o genitivo de um nome pessoal normalmente indica filiação; explicitá-la produz português natural.
- source_word: Σαμαίας
  choice: Samaías
  rationale: Transliteração legível da forma grega, com acentuação adequada à pronúncia em português e sem substituir o nome pela forma de uma testemunha paralela.
