base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/005.yaml
  text: And some of the sons of Israel[a], and of the priests, Levites, temple singers, gatekeepers, and temple servants, went up to Jerusalem[b],
translation:
  language: pt
  text: E alguns dos filhos de Israel[a], dos sacerdotes, dos levitas, dos cantores do templo, dos guardas dos portões e dos servidores do templo[b] subiram juntos a Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alguns dos israelitas”. Literalmente: “dentre os filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “escravos do templo”. O termo grego pode designar pessoas vinculadas ao serviço sagrado em condição servil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνανέβησαν
  choice: subiram juntos
  rationale: Preserva tanto o movimento de subida para Jerusalém, próprio do idioma bíblico, quanto o valor associativo do prefixo συν-.
- source_word: ἐκ τῶν υἱῶν Ἰσραήλ
  choice: alguns dos filhos de Israel
  rationale: A construção indica pessoas provenientes desse grupo. A tradução mantém a expressão familiar do grego e emprega “alguns” para tornar explícito em português o sentido partitivo.
- source_word: ἱερέων
  choice: sacerdotes
  rationale: Equivalente corrente para a classe sacerdotal.
- source_word: Λευειτῶν
  choice: levitas
  rationale: Forma tradicional e clara para o grupo levítico.
- source_word: ἱεροψαλτῶν
  choice: cantores do templo
  rationale: O composto designa cantores ligados ao serviço sagrado; a formulação explicita de modo natural o contexto do templo.
- source_word: θυρωρῶν
  choice: guardas dos portões
  rationale: Expressa com clareza a função de vigiar ou cuidar dos portões do templo, evitando o sentido doméstico que “porteiros” pode sugerir no português atual.
- source_word: ἱεροδούλων
  choice: servidores do templo
  rationale: Comunica a função institucional desse grupo no serviço do templo sem determinar além do texto sua condição jurídica; a possível nuance de servidão é preservada em nota.
- source_word: εἰς Ἰερουσαλήμ
  choice: para Jerusalém
  rationale: Forma idiomática portuguesa para indicar o destino do deslocamento.
theological_decisions:
- issue: Tradução de υἱῶν Ἰσραήλ na lista dos que retornaram
  choice: filhos de Israel
  alternative: israelitas
  rationale: Mantém a forma familiar masculina do grego sem transformar uma expressão corporativa em formulação interpretativa; a alternativa mais fluida aparece em nota.
- issue: Tradução de ἱερόδουλοι
  choice: servidores do templo
  alternative: escravos do templo
  rationale: A expressão principal identifica com naturalidade uma categoria ligada ao serviço sagrado, enquanto a nota conserva a possibilidade de o segundo elemento do composto indicar condição servil.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e vocabulário amplamente compreensível. “Subiram juntos” retém uma nuance real do verbo grego; “guardas dos portões” evita a ambiguidade moderna de “porteiros”.
