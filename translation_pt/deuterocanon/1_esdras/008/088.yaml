base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/088.yaml
  text: Look, we are before you in our lawless deeds, for it is no longer possible to stand before you because of these things.
translation:
  language: pt
  text: Eis que estamos diante de ti em nossas transgressões[a], pois já não é possível ficar de pé diante de ti por causa delas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em nossas iniquidades”. O grego pode indicar tanto atos que violam a lei quanto a condição de culpa decorrente deles.'
    reason: lexical_alternative
  - marker: b
    text: O paralelo hebraico (Esdras 9:14) exprime a mesma crise em termos diferentes, destacando a ira de Deus e o possível fim de todo remanescente. Aqui, 1 Esdras a apresenta como a impossibilidade de ficar de pé diante de Deus por causa dessas transgressões.
    reason: cross_reference
lexical_decisions:
- source_word: ἰδοὺ
  choice: Eis que
  rationale: Mantém a força de apresentação enfática da confissão em registro digno e corrente, sem reduzir o termo a uma simples partícula omitida.
- source_word: ἐσμὲν ἐνώπιόν σου
  choice: estamos diante de ti
  rationale: Reproduz diretamente a presença perante Deus e preserva a possível dimensão relacional e judicial, sem antecipar o verbo στῆναι da oração seguinte.
- source_word: ἐν ταῖς ἀνομίαις ἡμῶν
  choice: em nossas transgressões
  rationale: “Transgressões” comunica violações da vontade ou lei divina em português moderno e conserva tanto o caráter concreto dos pecados quanto a condição de culpa confessada.
- source_word: οὐ γάρ ἐστιν στῆναι ἔτι
  choice: pois já não é possível ficar de pé
  rationale: A construção com infinitivo indica impossibilidade; “ficar de pé” preserva a imagem concreta e potencialmente judicial de στῆναι, enquanto “já não” traduz ἔτι no contexto negativo.
- source_word: ἔμπροσθέν σου
  choice: diante de ti
  rationale: Mantém a repetição intencional da orientação para Deus e o tom solene da confissão.
- source_word: ἐπὶ τούτοις
  choice: por causa delas
  rationale: Expressa o valor causal no contexto e retoma naturalmente, em português, as transgressões já mencionadas, sem a rigidez de “por causa destas coisas”.
theological_decisions:
- issue: Sentido de ἀνομίαι numa confissão penitencial
  choice: transgressões
  alternative: iniquidades; atos contrários à lei; culpa
  rationale: A opção mantém o peso moral e legal da violação dos mandamentos sem impor uma formulação doutrinária técnica. A nota registra que o grego também pode abranger a condição de culpa resultante.
- issue: Relação com o paralelo hebraico de Esdras 9:14
  choice: seguir a formulação grega sobre a impossibilidade de permanecer de pé diante de Deus
  alternative: ampliar o texto com a ira divina e o extermínio do remanescente, conforme o paralelo hebraico
  rationale: O texto grego é a fonte primária de 1 Esdras e apresenta aqui uma formulação substancialmente diferente. O paralelo hebraico esclarece o contexto, mas não deve substituir nem expandir o conteúdo grego.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. “Eis que” sustenta a solenidade sem arcaísmo excessivo; “ficar de pé” conserva a imagem grega, e a repetição de “diante de ti” foi mantida por ser retoricamente significativa.
