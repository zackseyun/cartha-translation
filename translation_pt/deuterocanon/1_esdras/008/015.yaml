base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/015.yaml
  text: so as to bring sacrifices upon the altar of their Lord[a], the one in Jerusalem.
translation:
  language: pt
  text: a fim de oferecer sacrifícios sobre o altar do Senhor deles[a], o que está em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A passagem paralela em aramaico traz, no contexto correspondente, “a casa do Deus deles, que está em Jerusalém”, confirmando que o referente é o Deus de Israel; aqui, porém, o grego diz especificamente “o altar do Senhor deles, o que está em Jerusalém”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: a fim de
  rationale: Expressa propósito de modo natural em português, sem transformar a construção em resultado necessário.
- source_word: προσενεγκεῖν
  choice: oferecer
  rationale: No contexto cultual, o infinitivo indica a apresentação sacrificial; “oferecer” é mais idiomático em português do que “trazer” e mantém claro o ato ritual.
- source_word: θυσίας
  choice: sacrifícios
  rationale: É a correspondência direta e corrente para o termo cultual no contexto de um altar.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: sobre o altar
  rationale: Preserva a ideia de colocação ou apresentação no altar expressa por ἐπί com acusativo.
- source_word: τοῦ κυρίου αὐτῶν
  choice: do Senhor deles
  rationale: Mantém tanto κύριος como o possessivo explícito do grego, sem importar “Deus” da testemunha aramaica paralela.
- source_word: τὸ ἐν Ἰερουσαλήμ
  choice: o que está em Jerusalém
  rationale: Identifica de maneira natural o altar específico ao qual a frase preposicional grega se refere.
theological_decisions:
- issue: Tradução de κύριος no contexto cultual da LXX
  choice: Senhor
  alternative: senhor ou mestre
  rationale: Neste contexto do altar em Jerusalém, o título se refere ao Deus de Israel; “Senhor” preserva o uso reverencial sem acrescentar θεός, ausente no grego.
- issue: Diferença entre o texto grego e a testemunha aramaica paralela
  choice: Manter “o altar do Senhor deles” no texto principal
  alternative: a casa do Deus deles
  rationale: O grego é a fonte primária e fala especificamente do altar e do Senhor deles. A leitura paralela confirma o referente, mas difere materialmente e, por isso, é registrada em nota em vez de ser incorporada ao texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A formulação conserva a distinção textual entre o grego e a passagem paralela aramaica.
