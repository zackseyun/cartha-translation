base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/023.yaml
  text: And you[a], Ezra, according to the wisdom of your God, appoint judges and magistrates, so that they may judge throughout all Syria and Phoenicia all those who know the law of your God; and you shall teach those who do not know it.
translation:
  language: pt
  text: E você, Esdras, de acordo com a sabedoria do seu Deus, designe juízes e magistrados para que julguem, em toda a Síria e a Fenícia[a], todos os que conhecem a lei do seu Deus; e você ensinará os que não a conhecem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego diz “Síria e Fenícia”, refletindo a forma grega de descrever a região em 1 Esdras; o paralelo hebraico de Esdras emprega outra terminologia provincial.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνάδειξον
  choice: designe
  rationale: O imperativo ordena que Esdras escolha e invista oficialmente autoridades; “designe” preserva esse caráter formal em português natural.
- source_word: κριτὰς καὶ δικαστάς
  choice: juízes e magistrados
  rationale: Mantém a distinção entre os dois termos gregos e seu caráter jurídico-administrativo, sem reduzir ambos a uma única categoria.
- source_word: ὅπως δικάζωσιν
  choice: para que julguem
  rationale: Expressa a finalidade e conserva a relação lexical com “juízes”.
- source_word: ἐν ὅλῃ Συρίᾳ καὶ Φοινίκῃ
  choice: em toda a Síria e a Fenícia
  rationale: Reproduz diretamente a abrangência territorial e os nomes geográficos presentes no texto grego.
- source_word: πάντας τοὺς ἐπισταμένους
  choice: todos os que conhecem
  rationale: ἐπίσταμαι indica conhecimento ou familiaridade; “conhecem” é claro e mantém o contraste com os que não conhecem.
- source_word: τὸν νόμον τοῦ θεοῦ σου
  choice: a lei do seu Deus
  rationale: Preserva o possessivo σου e a formulação genitiva do grego.
- source_word: διδάξεις
  choice: você ensinará
  rationale: O futuro do indicativo, no contexto do decreto, tem força diretiva; o futuro em português mantém o tom formal sem transformá-lo explicitamente em imperativo.
theological_decisions:
- issue: Designação territorial grega em contraste com o paralelo semítico de Esdras
  choice: Manter “Síria e Fenícia” no texto principal
  alternative: Harmonizar a expressão com a terminologia provincial do texto massorético paralelo
  rationale: O texto grego de 1 Esdras é a fonte primária e nomeia explicitamente a Síria e a Fenícia. O paralelo semítico funciona como testemunho comparativo, não como substituto do texto grego.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Você” traduz o pronome enfático σύ de modo natural; a repetição em “e você ensinará” conserva a mudança explícita de sujeito e o tom diretivo do decreto.
