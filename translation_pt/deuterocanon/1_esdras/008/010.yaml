base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/010.yaml
  text: And having judged what is humane[a], I ordered that those of the nation of the Jews who are willing, and of their own choice, and the priests and the Levites and these others in our kingdom[b], should go with you to Jerusalem.
translation:
  language: pt
  text: E, tendo considerado o que era benevolente[a], ordenei que aqueles da nação dos judeus que estivessem dispostos, por livre escolha, bem como os sacerdotes, os levitas e estes outros que estão em nosso reino[b], fossem com você a Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que era humano” ou “bondoso”. A expressão se refere a uma medida benevolente.'
    reason: lexical_alternative
  - marker: b
    text: O paralelo hebraico fornecido apresenta aqui uma redação substancialmente diferente; esta tradução segue o texto grego de 1 Esdras.
    reason: textual_variant
lexical_decisions:
- source_word: τὰ φιλάνθρωπα
  choice: o que seria benevolente
  rationale: O neutro plural substantivado aponta para uma medida humana ou benévola; esta formulação preserva a qualidade moral e soa natural no registro de um decreto.
- source_word: κρίνας
  choice: tendo considerado
  rationale: O particípio aoristo introduz a deliberação que precede a ordem; “considerado” comunica esse processo decisório sem a possível conotação judicial de “julgado”.
- source_word: προσέταξα
  choice: ordenei
  rationale: Expressa uma determinação dotada de autoridade e se ajusta ao discurso administrativo régio.
- source_word: τοὺς βουλομένους
  choice: aqueles ... que estivessem dispostos
  rationale: Preserva o caráter voluntário da participação e se encaixa naturalmente na construção dependente de “ordenei”.
- source_word: αἱρετίζοντας
  choice: por livre escolha
  rationale: A forma grega rara parece reforçar a ideia de escolha voluntária; a expressão adverbial evita uma repetição excessivamente literal.
- source_word: ἐκ τοῦ ἔθνους τῶν Ἰουδαίων
  choice: da nação dos judeus
  rationale: Mantém a estrutura formal do grego e identifica o grupo étnico no registro do decreto.
- source_word: τῶν ἱερέων
  choice: os sacerdotes
  rationale: Equivalente português padrão.
- source_word: τῶν Λευειτῶν
  choice: os levitas
  rationale: Forma portuguesa consagrada para o grupo tribal e cultual.
- source_word: τῶνδε
  choice: estes outros
  rationale: Conserva a referência demonstrativa abrupta e elíptica do grego sem especificar indevidamente quem são as pessoas.
- source_word: ἐν τῇ ἡμετέρᾳ βασιλείᾳ
  choice: que estão em nosso reino
  rationale: Explicita de modo mínimo a relação locativa exigida em português, sem acrescentar conteúdo substantivo.
- source_word: συμπορεύεσθαί σοι
  choice: fossem com você
  rationale: Comunica de maneira simples e atual o sentido de viajar ou seguir em companhia de Esdras.
theological_decisions:
- issue: Uso do paralelo massorético diante de grande divergência textual
  choice: Traduzir no texto principal o decreto régio preservado no grego de 1 Esdras.
  alternative: Substituir o conteúdo grego pela afirmação hebraica sobre Esdras preparar o coração para buscar, praticar e ensinar a Lei.
  rationale: O testemunho grego fornecido é a fonte primária desta passagem e contém inequivocamente uma autorização régia. O paralelo hebraico corresponde a conteúdo substancialmente diferente e não deve ser usado para harmonizar ou substituir o grego.
- issue: Relação sintática de αἱρετίζοντας com τοὺς βουλομένους
  choice: 'Entender a forma rara como reforço da participação voluntária: “que estivessem dispostos, por livre escolha”.'
  alternative: Entender a expressão como “os que desejassem escolher a si mesmos”.
  rationale: A leitura escolhida é contextualmente coerente com uma autorização para acompanhar Esdras, mas a raridade da forma recomenda preservar a alternativa em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O período conserva o tom formal de um decreto régio, mas evita sintaxe excessivamente arcaica. As notas [a] e [b] aparecem no texto principal.
