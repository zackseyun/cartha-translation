    reason: Registra alternativas lexicais mais técnicas para as tropas e uma formulação mais formal para a oposição.
  revision_rationale: 'A revisão é limitada à expressão final: elimina uma nuance aspectual não marcada no grego e aproxima a construção portuguesa da relação de segurança diante de pessoas hostis. O restante do texto é fiel, idiomático e preserva o contraste militar da fonte.'
