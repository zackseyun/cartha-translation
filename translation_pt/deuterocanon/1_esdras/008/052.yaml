base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/052.yaml
  text: For I was ashamed to ask for horsemen and foot soldiers as an escort for safety against those hostile to us[a].
translation:
  language: pt
  text: Pois tive vergonha de pedir cavaleiros e soldados a pé como escolta, para nossa segurança contra os que nos eram hostis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «cavalaria e infantaria como escolta, para nossa segurança contra os nossos adversários».'
    reason: Registra alternativas lexicais mais técnicas para as tropas e uma formulação mais formal para a oposição.
lexical_decisions:
- source_word: ἐνετράπην
  choice: tive vergonha
  rationale: Expressa de modo natural o aoristo passivo com sentido de sentir vergonha ou constrangimento, preservando a motivação declarada pelo narrador.
- source_word: αἰτῆσαι
  choice: pedir
  rationale: Verbo corrente e direto para a ação de fazer uma solicitação.
- source_word: ἵππεις
  choice: cavaleiros
  rationale: Mantém o sentido literal de tropas montadas e o contraste com os soldados a pé.
- source_word: πεζοὺς
  choice: soldados a pé
  rationale: Forma clara e acessível para tropas que combatiam a pé, sem exigir o termo técnico «infantaria».
- source_word: προπομπὴν
  choice: como escolta
  rationale: Comunica a função de acompanhamento protetor durante a viagem.
- source_word: ἕνεκεν ἀσφαλείας
  choice: para nos proteger
  rationale: A construção indica finalidade de segurança; a forma verbal é natural em português e explicita, sem acrescentar conteúdo indevido, quem receberia a proteção.
- source_word: τῆς πρὸς τοὺς ἐναντίους ἡμῖν
  choice: dos que se opunham a nós
  rationale: Preserva o caráter descritivo de ἐναντίους, sem tornar necessariamente os opositores uma categoria militar formal.
theological_decisions:
- issue: Relação com o paralelo massorético fornecido, cujo conteúdo não corresponde à declaração grega deste versículo
  choice: Traduzir diretamente a declaração grega sobre a escolta militar
  alternative: Harmonizar com o texto hebraico paralelo e introduzir a linguagem de jejum e oração
  rationale: A Septuaginta de Swete é a fonte primária indicada para 1 Esdras. O paralelo hebraico fornecido diverge substancialmente e não deve substituir nem corrigir silenciosamente o conteúdo grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Soldados a pé» evita tecnicismo desnecessário no texto principal; a nota preserva as opções militares formais «cavalaria e infantaria».
