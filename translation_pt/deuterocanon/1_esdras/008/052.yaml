    issue: Tempo/aspecto em «dos que se opunham a nós»
    rationale: ἐναντίους é adjetival e descreve pessoas hostis ou contrárias a «nós»; o imperfeito português pode introduzir uma nuance temporal não expressa no grego.
  - severity: low
    issue: Formulação da finalidade de segurança
    rationale: «Para nos proteger dos» é possível, mas «para nossa segurança contra» espelha mais transparentemente ἕνεκεν ἀσφαλείας ... πρὸς e preserva a formulação nominal da fonte.
  revised_text: Pois tive vergonha de pedir cavaleiros e soldados a pé como escolta, para nossa segurança contra os que nos eram hostis.[a]
