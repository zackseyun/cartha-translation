review_pass:
  verdict: revise
  source_fidelity: O texto principal reproduz corretamente a declaração grega e não importa material do paralelo massorético. Contudo, «dos que se opunham a nós» emprega um imperfeito que não é exigido pelo particípio/adjetivo grego ἐναντίους; «os que nos eram hostis» conserva melhor a caracterização sem sugerir uma ação passada em curso. «Para nossa segurança contra» reflete de modo mais direto ἕνεκεν ἀσφαλείας ... πρὸς.
  naturalness: «Cavaleiros e soldados a pé» e «como escolta» são naturais e claros em português moderno. A pequena revisão torna a relação entre a segurança e os adversários mais próxima da sintaxe e do sentido do grego, mantendo fluidez.
  terminology: «Cavaleiros»/«soldados a pé» preserva o contraste entre ἵππεις e πεζούς; a nota oferece, apropriadamente, «cavalaria e infantaria». «Hostis» é um equivalente preciso e não força a ideia de inimigos formalmente militares.
  issues:
