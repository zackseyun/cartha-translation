base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/002.yaml
  text: son of Saddoulouk[a], son of Acheitob, son of Amartheios, son of Ozeias, son of Bokka, son of Abeisai, son of Phinees, son of Eleazar[c][b], son of Aaron the chief priest.
translation:
  language: pt
  text: filho de Sadouluco[a], filho de Aquitob, filho de Amarteu, filho de Ozeias, filho de Bocá, filho de Abeisai, filho de Fineias[b], filho de Eleazar, filho de Arão, o primeiro sacerdote[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego apresenta aqui uma genealogia mais extensa. O paralelo hebraico mais breve diz: “filho de Salum, filho de Zadoque, filho de Aitube”.'
    reason: alternative_reading
  - marker: b
    text: 'Vários nomes refletem formas gregas de nomes hebraicos mais conhecidos: Aquitob = Aitube; Ozeias = Uzi; Bocá = Buqui; Abeisai = Abisua; Fineias corresponde ao hebraico Pinhas.'
    reason: lexical_alternative
  - marker: c
    text: Ou, possivelmente, “o sacerdote principal”. O grego diz literalmente “o primeiro sacerdote”; não emprega o termo específico para “sumo sacerdote”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: filho de
  rationale: Na sequência genealógica, os genitivos repetidos exprimem elipticamente descendência. “Filho de” explicita essa relação em português natural e concorda com o uso de בֶּן־ no paralelo hebraico.
- source_word: Σαδδουλούκου
  choice: Sadouluco
  rationale: Transliteração portuguesa da forma grega, mantida sem harmonização com o nome diferente do paralelo hebraico.
- source_word: Ἀχειτὼβ
  choice: Aquitob
  rationale: Forma aportuguesada próxima da grafia grega; a variante hebraica mais conhecida é registrada em nota.
- source_word: Ἀμαρθείου
  choice: Amarteu
  rationale: Transliteração portuguesa da forma grega, preservando o ancestral adicional presente na genealogia grega.
- source_word: Ὀζείου
  choice: Ozeias
  rationale: Representa a forma grega em português; “Uzi” é a forma relacionada ao hebraico.
- source_word: Βοκκὰ
  choice: Bocá
  rationale: Transliteração portuguesa da forma grega, com acento para indicar a tonicidade final.
- source_word: Ἀβεισαὶ
  choice: Abeisai
  rationale: Transliteração da forma grega, sem substituí-la pela forma hebraica tradicional.
- source_word: Φεινεὲς
  choice: Fineias
  rationale: Forma portuguesa legível baseada no nome grego; a forma hebraica relacionada é indicada em nota.
- source_word: Ἐλεαζὰρ
  choice: Eleazar
  rationale: Forma já estabelecida em português e diretamente correspondente ao grego.
- source_word: Ἀαρὼν
  choice: Arão
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: τοῦ πρώτου ἱερέως
  choice: o primeiro sacerdote
  rationale: Traduz diretamente πρῶτος como “primeiro” e ἱερεύς como “sacerdote”, sem introduzir “sumo sacerdote”, título que normalmente corresponderia a ἀρχιερεύς.
theological_decisions:
- issue: Harmonizar ou não a genealogia grega mais extensa com o paralelo hebraico mais breve
  choice: Preservar integralmente a genealogia grega no texto principal
  alternative: Substituí-la pela sequência hebraica “Salum, Zadoque, Aitube”
  rationale: O grego é a fonte primária de 1 Esdras e apresenta claramente uma sequência mais longa; harmonizá-la apagaria uma diferença textual real.
- issue: Sentido de πρῶτος na descrição de Arão
  choice: o primeiro sacerdote
  alternative: o sacerdote principal
  rationale: “Primeiro” preserva o sentido temporal ou ordinal mais direto, enquanto a nota reconhece que πρῶτος também pode indicar primazia. “Sumo sacerdote” não foi usado porque o grego traz ἱερεύς, não ἀρχιερεύς.
translation_notes:
  register: Português moderno, claro e digno, com formas de nomes ajustadas à ortografia e à leitura lusófona. A repetição de “filho de” conserva a estrutura genealógica e evita a ambiguidade de uma simples cadeia de genitivos.
