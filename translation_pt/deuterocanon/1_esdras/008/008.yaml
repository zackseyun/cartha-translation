base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/008.yaml
  text: A copy of the document presented by King Artaxerxes to Ezra the priest and reader of the law of the Lord is set out below:[a][b]
translation:
  language: pt
  text: Segue abaixo uma cópia do documento enviado pelo rei Artaxerxes a Esdras, sacerdote e leitor da Lei do Senhor:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz “leitor da Lei do Senhor”. O paralelo hebraico em Esdras 7:11 traz “escriba” em vez de “leitor”.
    reason: alternative_reading
  - marker: b
    text: A redação grega deste cabeçalho é um tanto difícil; o sentido é que uma cópia do documento de Artaxerxes dirigido a Esdras aparece em seguida.
    reason: textual_variant
lexical_decisions:
- source_word: Προσπεσόντος
  choice: enviado
  rationale: A construção grega transmitida é difícil e parece funcionar como cabeçalho documental. “Enviado” expressa de modo natural a procedência e a destinação do documento, sem especificar indevidamente a forma exata de entrega.
- source_word: παρὰ Ἀρταξέρξου βασιλέως
  choice: pelo rei Artaxerxes
  rationale: παρά com genitivo indica aqui a fonte ou procedência do documento; a voz passiva em português permite a formulação natural “enviado pelo rei”.
- source_word: πρὸς Ἔσραν
  choice: a Esdras
  rationale: 'πρός tem sentido direcional no contexto documental: o texto é dirigido a Esdras.'
- source_word: τὸν ἱερέα
  choice: sacerdote
  rationale: Reproduz diretamente o título de Esdras em português natural; o artigo não precisa ser repetido após o nome.
- source_word: ἀναγνώστην τοῦ νόμου Κυρίου
  choice: leitor da Lei do Senhor
  rationale: ἀναγνώστης significa literalmente leitor ou recitador. A tradução mantém a forma própria do testemunho grego, sem harmonizá-la com “escriba” no paralelo hebraico.
- source_word: Κυρίου
  choice: Senhor
  rationale: Designa o Deus de Israel na expressão titular; “Senhor” é a forma corrente e digna em português.
- source_word: ἀντίγραφον
  choice: cópia
  rationale: Termo documental claro e corrente para uma reprodução do escrito.
- source_word: τὸ ὑποκείμενον
  choice: Segue abaixo
  rationale: Literalmente, refere-se ao que está colocado abaixo. Em um cabeçalho que introduz um documento, “Segue abaixo” comunica naturalmente essa função.
theological_decisions:
- issue: Relação entre o título grego e o paralelo hebraico de Esdras 7:11
  choice: Manter “leitor da Lei do Senhor” no texto principal.
  alternative: “Escriba da Lei do Senhor” ou “escriba da Lei do Deus dos céus”.
  rationale: Como o grego é o testemunho-fonte direto de 1 Esdras, sua designação específica deve ser preservada. A leitura do paralelo hebraico é informada em nota, sem harmonizar silenciosamente os textos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para a forma natural de um cabeçalho documental em português, mantendo “leitor” por fidelidade ao grego e usando “Lei” com inicial maiúscula como designação reconhecível da Lei do Senhor.
