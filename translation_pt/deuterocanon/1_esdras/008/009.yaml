  text: King Artaxerxes to Ezra the priest and reader of the law of the Lord[a], greetings.
translation:
  language: pt
  text: 'O rei Artaxerxes, a Esdras, sacerdote e leitor da lei do Senhor[a]: Saudações.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz «leitor da lei do Senhor»; o paralelo hebraico em Esdras 7:12 traz «escriba da lei do Deus dos céus».
    reason: alternative_reading
lexical_decisions:
- source_word: Βασιλεὺς Ἀρταξέρξης
  choice: O rei Artaxerxes
  rationale: Reproduz o título real e o nome próprio em forma natural no cabeçalho epistolar português.
- source_word: Ἔσρᾳ
  choice: a Esdras
  rationale: O dativo indica o destinatário da carta; «Esdras» é a forma portuguesa tradicional do nome.
- source_word: τῷ ἱερεῖ
  choice: sacerdote
  rationale: Mantém o ofício de Esdras em aposição, com formulação natural em português.
- source_word: ἀναγνώστῃ
  choice: leitor
  rationale: Traduz diretamente o grego, que designa um leitor ou recitador, sem harmonizá-lo com «escriba» no paralelo hebraico.
- source_word: τοῦ νόμου Κυρίου
  choice: da lei do Senhor
  rationale: Preserva a relação genitiva e a referência à lei divina em linguagem corrente e digna.
- source_word: χαίρειν
  choice: Saudações
  rationale: Equivalente funcional da fórmula convencional usada na abertura de cartas.
theological_decisions:
- issue: ἀναγνώστῃ no grego em contraste com «escriba» na tradição hebraica paralela de Esdras 7:12
  choice: leitor
  alternative: escriba
  rationale: O texto grego de 1 Esdras é a fonte primária e diz explicitamente «leitor». A variante do paralelo hebraico é registrada em nota, sem substituir nem harmonizar a leitura grega.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe de cabeçalho epistolar. A pontuação explicita remetente, destinatário e saudação sem acrescentar conteúdo ao grego.
