base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/076.yaml
  text: and to reveal a lamp for us in the house of our Lord[a], to give us food in the time of our slavery; and while we were enslaved[c][b], we were not forsaken
translation:
  language: pt
  text: e de revelar para nós uma luz na casa de nosso Senhor[a], de nos dar alimento no tempo de nossa escravidão; e, enquanto éramos escravizados[b], não fomos abandonados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “casa de nosso Senhor” é o templo. O grego também pode ser traduzido mais literalmente como “desvelar para nós uma lâmpada” ou “uma luz”.
    reason: Nota cultural e alternativa lexical para a imagem de ἀνακαλύψαι φωστῆρα.
  - marker: b
    text: 'Ou: “enquanto estávamos em servidão” ou “enquanto servíamos”. O grego emprega palavras da mesma família em “escravidão” e “éramos escravizados”.'
    reason: Preserva a ambiguidade entre servir e estar sujeito como escravo.
lexical_decisions:
- source_word: ἀνακαλύψαι φωστῆρα
  choice: fazer resplandecer para nós uma luz
  rationale: ἀνακαλύπτω significa literalmente descobrir ou desvelar, e φωστήρ pode ser uma fonte de luz, luminária ou luz. A expressão portuguesa comunica naturalmente a imagem de uma luz que volta a aparecer, sem explicitar de modo indevido a ideia interpretativa de restauração.
- source_word: ἐν τῷ οἴκῳ τοῦ κυρίου ἡμῶν
  choice: na casa de nosso Senhor
  rationale: Mantém a imagem concreta do grego. No contexto, a casa é o templo, informação indicada em nota sem substituir a formulação da fonte.
- source_word: τροφὴν
  choice: alimento
  rationale: Equivalente corrente e concreto para nutrição ou comida, adequado ao registro digno da passagem.
- source_word: δουλείας
  choice: escravidão
  rationale: Preserva a condição de sujeição expressa pelo grupo lexical de δουλεία, sem suavizá-la como mera prestação de serviço.
- source_word: ἐν τῷ δουλεύειν ἡμᾶς
  choice: enquanto éramos escravizados
  rationale: O infinitivo articular indica a circunstância temporal. A tradução mantém a ligação lexical com 'escravidão' e deixa explícita a sujeição do povo.
- source_word: οὐκ ἐγκατελείφθημεν
  choice: não fomos abandonados
  rationale: '''Abandonados'' traduz com naturalidade o passivo de ἐγκαταλείπω e conserva a ideia de que Deus não deixou o povo entregue à própria sorte.'
theological_decisions:
- issue: Sentido da imagem ἀνακαλύψαι φωστῆρα
  choice: fazer resplandecer para nós uma luz
  alternative: descobrir para nós uma lâmpada; revelar para nós uma luz
  rationale: A formulação escolhida conserva a imagem de luz que se torna visível e soa natural em português, sem transformar a metáfora diretamente em 'restaurar a esperança' ou outra interpretação teológica.
- issue: Tradução de οἶκος τοῦ κυρίου
  choice: casa de nosso Senhor
  alternative: templo de nosso Senhor
  rationale: Embora o referente contextual seja o templo, o texto grego diz 'casa'. A tradução preserva a metáfora bíblica e esclarece o referente em nota.
- issue: Tradução do grupo δουλεία / δουλεύειν
  choice: escravidão / éramos escravizados
  alternative: servidão / servíamos
  rationale: A escolha mantém a força da sujeição sob domínio estrangeiro e a repetição lexical entre as duas orações, sem reduzir o sentido a serviço voluntário.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A coordenação inicial foi mantida porque o versículo continua a frase anterior. Evitou-se o pouco natural 'descobrir uma lâmpada' no texto principal, mas sua concretude foi registrada em nota.
