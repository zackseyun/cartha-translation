  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ κατὰ
  choice: E quanto a
  rationale: Neste fragmento de linguagem administrativa, κατά com o acusativo introduz o assunto em pauta; «quanto a» reproduz naturalmente essa função, e καί mantém a ligação com o contexto anterior.
- source_word: τὰ ἱερὰ σκεύη σου
  choice: aos seus utensílios sagrados
  rationale: σκεύη designa objetos ou utensílios, não necessariamente recipientes; ἱερά indica seu caráter consagrado. «Utensílios sagrados» é claro e evita especificar indevidamente sua forma.
- source_word: τὰ διδόμενα
  choice: que estão sendo entregues
  rationale: O particípio presente passivo indica objetos em processo de entrega. «Entregues» se ajusta ao contexto administrativo melhor que o genérico «dados».
- source_word: εἰς τὴν χρείαν
  choice: para uso
  rationale: χρεία aqui expressa finalidade ou utilização prática no culto; «para uso» é conciso e idiomático.
- source_word: τοῦ ἱεροῦ
  choice: no templo
  rationale: O grego ἱερόν designa diretamente o recinto do templo ou santuário. «Templo» segue o testemunho grego primário sem substituir sua formulação pela expressão semítica paralela «casa».
- source_word: τοῦ θεοῦ σου τοῦ ἐν Ἰερουσαλήμ
  choice: do seu Deus em Jerusalém
  rationale: A construção genitiva identifica o templo como pertencente ao Deus do destinatário e o situa em Jerusalém; a formulação portuguesa é natural e conserva essa relação.
