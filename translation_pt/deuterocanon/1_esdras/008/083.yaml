lexical_decisions:
- source_word: τοῖς υἱοῖς ὑμῶν
  choice: aos seus filhos
  rationale: O dativo plural é expresso naturalmente por «aos», e «filhos» preserva o sentido masculino específico de υἱοῖς. «Seus» mantém a referência plural de ὑμῶν sem tornar a frase artificial em português.
- source_word: ἕως αἰῶνος
  choice: para sempre
  rationale: A expressão idiomática indica duração permanente; «para sempre» é a formulação corrente, clara e digna em português moderno.
theological_decisions:
- issue: Fonte grega fragmentária e grande divergência em relação ao paralelo hebraico
  choice: 'Traduzir diretamente o fragmento grego preservado: «aos seus filhos para sempre».'
  alternative: Reconstruir uma frase mais extensa com base no paralelo do Texto Massorético.
  rationale: O texto grego fornecido contém apenas esta breve expressão, enquanto o paralelo hebraico pertence a um contexto diferente e mais extenso. A primazia da fonte grega e a transparência textual exigem conservar o caráter fragmentário, sem acrescentar palavras reconstruídas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação permanece deliberadamente fragmentária para refletir com fidelidade o testemunho grego disponível.
