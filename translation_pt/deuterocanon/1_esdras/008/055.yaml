    reason: cross_reference
lexical_decisions:
- source_word: ἐχώρισα
  choice: separei
  rationale: Expressa diretamente a ação de destacar pessoas de um grupo, preservando tanto a ideia de separação quanto a de designação para uma tarefa.
- source_word: τῶν φυλάρχων τῶν ἱερέων
  choice: dentre os chefes dos sacerdotes
  rationale: φυλάρχων designa chefes ou líderes de um grupo; neste contexto, o genitivo τῶν ἱερέων identifica-os como chefes pertencentes ao corpo sacerdotal. “Dentre” torna clara a procedência dos homens sem especificar indevidamente uma estrutura tribal ou familiar.
- source_word: ἄνδρας δέκα δύο
  choice: doze homens
  rationale: ἄνδρας refere-se especificamente a homens, e a formulação portuguesa é direta e natural.
- source_word: καὶ Ἐσερεβίαν καὶ Ἀσοαμίαν
  choice: e também Eserebias e Asoamias
  rationale: Os nomes seguem as formas gregas do testemunho primário. “E também” reproduz a coordenação e deixa claro que os dois nomes são acrescentados à menção dos doze, sem tentar harmonizar a construção com o paralelo hebraico mais longo.
- source_word: Ἐσερεβίαν
  choice: Eserebias
  rationale: Transliteração portuguesa da forma grega, tomada como texto-base; a provável correspondência com o nome hebraico Serebias é indicada em nota.
- source_word: Ἀσοαμίαν
  choice: Asoamias
  rationale: Transliteração portuguesa da forma grega, tomada como texto-base; a provável correspondência com o nome hebraico Hasabias é indicada em nota.
