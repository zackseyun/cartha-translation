base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/090.yaml
  text: And Jechonias son of Jeelus[a], of the sons of Israel, cried out and said to Ezra, “We have sinned against the Lord, and foreign women from the nations of the land have dwelt among us[b]; and now there is still hope for all Israel.”
translation:
  language: pt
  text: 'Então Jeconias, filho de Jeelo, um dos filhos de Israel, levantou a voz e disse a Esdras: “Pecamos contra o Senhor, e mulheres estrangeiras das nações da terra habitaram entre nós.[a] Mas agora ainda há esperança para todo o Israel.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz que as mulheres estrangeiras “habitaram” entre os israelitas. A tradição hebraica paralela de Esdras 10:2 declara de forma mais explícita: “casamos com mulheres estrangeiras dos povos da terra”.'
    reason: alternative_reading
  - marker: b
    text: A cláusula grega final é difícil e, em tradução estritamente literal, seria obscura. A versão no texto apresenta o sentido provável — “ainda há esperança para todo o Israel” — à luz do contexto e da tradição paralela de Esdras 10:2.
    reason: textual_variant
lexical_decisions:
- source_word: φωνήσας
  choice: levantou a voz
  rationale: Expressa de modo natural o ato público e enfático de falar em voz alta, sem sugerir necessariamente choro.
- source_word: Ἰεχονίας Ἰεήλου
  choice: Jeconias, filho de Jeelo
  rationale: Translitera os nomes gregos em forma adaptada ao português e explicita a filiação provável indicada pela construção e pela tradição paralela.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: um dos filhos de Israel
  rationale: Preserva a linguagem identitária e genealógica do grego, com sintaxe natural em português.
- source_word: ἡμάρτομεν εἰς τὸν κύριον
  choice: Pecamos contra o Senhor
  rationale: Verte diretamente o idioma grego de pecar contra alguém e mantém o tom de confissão.
- source_word: γυναῖκες ἀλλογενεῖς
  choice: mulheres estrangeiras
  rationale: ἀλλογενής designa pessoas de outro povo; a expressão é clara e não introduz conotações cristãs posteriores associadas a “gentias”.
- source_word: ἐκ τῶν ἐθνῶν τῆς γῆς
  choice: vindas das nações desta terra
  rationale: Mantém a referência aos povos da terra e torna explícita, de forma idiomática, a relação expressa por ἐκ.
- source_word: κατῴκησαν
  choice: passaram a morar entre nós
  rationale: Traduz o sentido de habitar ou estabelecer-se. “Entre nós” explicita o complemento social implícito, sem substituir o verbo grego pela ideia de casamento presente em outra tradição textual.
- source_word: καὶ νῦν ἔστιν ἐπάνω πᾶς Ἰσραήλ
  choice: Mas agora ainda há esperança para todo o Israel
  rationale: A frase grega transmitida é obscura e provavelmente corrompida ou comprimida. A tradução apresenta o sentido contextual provável, preservando πᾶς Ἰσραήλ como “todo o Israel”, e registra a dificuldade em nota.
theological_decisions:
- issue: Tradução do título divino κύριον
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte imediata é grega e traz κύριον; “Senhor” traduz o título sem impor a convenção tipográfica usada para representar explicitamente o tetragrama hebraico.
- issue: Sentido da cláusula final obscura
  choice: ainda há esperança para todo o Israel
  alternative: agora todo o Israel está acima
  rationale: Uma versão rigidamente literal de ἔστιν ἐπάνω seria obscura e inadequada ao contexto. O sentido de esperança é apoiado pelo contexto e pela conhecida tradição paralela de Esdras 10:2, mas a incerteza do texto grego é mantida em nota.
- issue: Relação das mulheres estrangeiras com Israel
  choice: passaram a morar entre nós
  alternative: casamos com mulheres estrangeiras
  rationale: A tradução conserva o testemunho grego, que emprega o verbo “habitar”, sem harmonizá-lo silenciosamente com a leitura hebraica paralela sobre casamento.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A formulação mantém “filhos de Israel” por seu valor identitário, evita arcaísmos e documenta, em vez de ocultar, as duas principais divergências entre o grego e a tradição paralela.
