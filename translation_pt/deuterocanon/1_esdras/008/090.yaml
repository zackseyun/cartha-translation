revisions:
- from: 'Então Jeconias, filho de Jeelo, um dos filhos de Israel, levantou a voz e disse a Esdras: “Pecamos contra o Senhor, e mulheres estrangeiras, vindas das nações desta terra, passaram a morar entre nós.[a] Mas agora ainda há esperança para todo o Israel.”[b]'
