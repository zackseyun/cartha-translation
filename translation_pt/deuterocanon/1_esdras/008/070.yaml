base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/070.yaml
  text: And rising from the fasting[a], with his garments and the holy robe torn, he bent his knees and stretched out his hands to the Lord, saying[b],
translation:
  language: pt
  text: E, levantando-me do jejum, com as vestes e a veste sagrada[a] rasgadas, dobrei os joelhos e estendi as mãos para o Senhor, dizendo:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a roupa sagrada”. O grego não diz explicitamente “veste sacerdotal”, embora o contexto possa sugerir uma veste oficial ligada ao culto.
    reason: lexical_alternative
  - marker: b
    text: A forma grega pode significar literalmente “eu dizia” ou “eles diziam”. Os particípios no singular e o contexto favorecem Esdras como aquele que começa a oração.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξεγερθεὶς ἐκ τῆς νηστείας
  choice: levantando-me do jejum
  rationale: O particípio aoristo introduz a passagem do jejum à oração. A forma reflexiva em primeira pessoa concorda naturalmente com ἔλεγον entendido como “eu dizia” e mantém a sequência narrativa.
- source_word: διερρηγμένα ἔχων τὰ ἱμάτια
  choice: com as vestes ... rasgadas
  rationale: A construção expressa o estado resultante das vestes depois de terem sido rasgadas. “Vestes” preserva o registro solene e distingue este termo da veste sagrada mencionada em seguida.
- source_word: τὴν ἱερὰν ἐσθῆτα
  choice: a veste sagrada
  rationale: Traduz explicitamente o caráter sagrado da peça sem acrescentar que ela era sacerdotal, especificação que o grego não faz.
- source_word: κάμψας τὰ γόνατα
  choice: dobrei os joelhos
  rationale: Reproduz de modo claro e corrente o gesto corporal de oração expresso no grego.
- source_word: ἐκτείνας τὰς χεῖρας
  choice: estendi as mãos
  rationale: Mantém literalmente a postura tradicional de súplica, com formulação natural em português.
- source_word: πρὸς τὸν κύριον
  choice: para o Senhor
  rationale: “Senhor” é o título divino reverencial adequado para κύριος neste contexto; “para” comunica a direção do gesto.
- source_word: ἔλεγον
  choice: disse
  rationale: A forma pode ser primeira pessoa do singular ou terceira do plural. Os particípios masculinos singulares e a introdução da oração de Esdras favorecem a primeira pessoa; o pretérito perfeito é a forma idiomática portuguesa para introduzir a fala subsequente.
theological_decisions:
- issue: Tradução de κύριος como título divino
  choice: Senhor
  alternative: Soberano
  rationale: No contexto de oração, κύριος funciona como título reverencial dirigido a Deus; “Senhor” preserva o uso bíblico corrente sem impor interpretação denominacional.
- issue: Identificação da veste sagrada
  choice: veste sagrada
  alternative: veste sacerdotal
  rationale: O grego afirma que a veste é sagrada, mas não a chama explicitamente de sacerdotal. A tradução evita acrescentar uma identificação institucional não expressa no texto.
- issue: Pessoa gramatical da introdução à oração
  choice: primeira pessoa do singular
  alternative: terceira pessoa do plural
  rationale: ἔλεγον é morfologicamente ambíguo entre “eu dizia” e “eles diziam”; contudo, a cadeia de particípios no singular e a oração pessoal que se segue favorecem Esdras como sujeito. A ambiguidade formal é registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com primeira pessoa coerente com a leitura contextual do grego. A coordenação verbal foi suavizada para leitura natural, sem eliminar a ambiguidade morfológica de ἔλεγον, que permanece documentada em nota.
