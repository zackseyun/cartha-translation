base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/043.yaml
  text: And from the priests and from the Levites I found no one there[a].
translation:
  language: pt
  text: E, entre os sacerdotes e os levitas, não encontrei ninguém ali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo hebraico do Texto Massorético fornecido para este ponto não corresponde de perto ao texto grego; por isso, segue-se aqui o grego como testemunho principal.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν ἱερέων
  choice: entre os sacerdotes
  rationale: Embora ἐκ signifique literalmente “de”, no contexto de procurar pessoas dentro de um grupo, “entre os sacerdotes” é natural em português e preserva o sentido.
- source_word: ἐκ τῶν Λευειτῶν
  choice: entre os levitas
  rationale: Mantém o paralelismo com a expressão anterior e usa a designação tradicional e clara “levitas”.
- source_word: οὐχ εὗρον
  choice: não encontrei ninguém
  rationale: A forma verbal está na primeira pessoa do singular. “Ninguém” explicita em português o objeto humano implícito na construção grega.
- source_word: ἐκεῖ
  choice: ali
  rationale: Traduz de modo simples e idiomático o advérbio locativo, referindo-se ao lugar em questão no contexto.
theological_decisions:
- issue: Divergência textual importante entre o testemunho grego e o paralelo aproximado do Texto Massorético
  choice: 'Seguir a oração grega: “E, entre os sacerdotes e os levitas, não encontrei ninguém ali.”'
  alternative: O material hebraico fornecido apresenta uma entrada diferente, acerca dos descendentes de Bigvai, e não sustenta a reconstrução desta oração.
  rationale: A Septuaginta grega é o texto-fonte primário indicado para 1 Esdras. Como o paralelo hebraico não corresponde verbalmente a esta passagem e parece representar outro item de uma lista, ele não deve substituir o testemunho grego; a divergência é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A colocação de “entre os sacerdotes e os levitas” evita uma repetição pesada de “entre” sem apagar o paralelismo semântico do grego.
