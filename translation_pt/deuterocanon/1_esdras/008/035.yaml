base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/035.yaml
  text: 'From the sons of Joab: Abadias son of Iezelus[a], and with him two hundred twelve men.'
translation:
  language: pt
  text: 'Dos filhos de Joabe: Abadias, filho de Iezelo[a], e com ele duzentos e doze homens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo hebraico em Esdras 8:12 apresenta aqui uma leitura diferente: menciona um descendente de Elão e conta setenta homens. Como 1 Esdras é traduzido a partir do testemunho grego, o texto segue o grego em vez de harmonizá-lo com o paralelo hebraico.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Ἰωάβ
  choice: Dos filhos de Joabe
  rationale: Mantém a formulação genealógica do grego e o estilo conciso da lista; nesse contexto, “filhos” também pode abranger descendentes ou membros da linhagem.
- source_word: Ἀβαδίας
  choice: Abadias
  rationale: Translitera a forma grega do nome de maneira natural em português, sem substituí-la por uma forma reconstruída a partir do hebraico.
- source_word: Ἰεζήλου
  choice: Iezelo
  rationale: Representa em português o nome próprio grego no genitivo, vertido após a relação implícita “filho de”; evita harmonização com o paralelo hebraico divergente.
- source_word: καὶ μετʼ αὐτοῦ
  choice: e com ele
  rationale: Tradução direta e idiomática da expressão, adequada ao contexto de uma lista de participantes.
- source_word: ἄνδρες
  choice: homens
  rationale: Corresponde ao sentido ordinário do grego ἄνδρες; “varões” seria menos corrente e “indivíduos do sexo masculino” seria excessivamente técnico.
- source_word: διακόσιοι δέκα δύο
  choice: duzentos e doze
  rationale: Expressa de forma natural em português o valor numérico exato do texto grego.
