base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/018.yaml
  text: And whatever else may come up as a need for the house of your God[a], you shall give from the royal treasury.
translation:
  language: pt
  text: E tudo mais que se fizer necessário para o templo do seu Deus[a], dará do tesouro real.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho aramaico paralelo tem formulação diferente: menciona utensílios entregues para o serviço da casa do seu Deus e ordena que sejam providenciados perante o Deus de Jerusalém.'
    reason: variante textual significativa entre a fonte grega primária e o testemunho semítico paralelo
lexical_decisions:
- source_word: τὰ λοιπὰ
  choice: tudo mais
  rationale: Expressa de modo natural os demais itens ou recursos além dos já mencionados.
- source_word: ὅσα ἂν ὑποπίπτῃ σοι εἰς τὴν χρείαν
  choice: que se mostrar necessário
  rationale: Reproduz o sentido contingente de algo que venha a surgir ou se apresentar como necessidade, sem traduzir literalmente o idioma grego.
- source_word: τοῦ ἱεροῦ τοῦ θεοῦ σου
  choice: para o templo do seu Deus
  rationale: ἱερόν designa diretamente o templo ou recinto sagrado; “templo” é preciso, corrente e mantém o grego como fonte primária.
- source_word: δώσεις
  choice: você dará
  rationale: O futuro do indicativo tem força diretiva no contexto do decreto, preservada em português pelo futuro simples.
- source_word: ἐκ τοῦ βασιλικοῦ γαζοφυλακίου
  choice: do tesouro real
  rationale: Tradução direta e idiomática da fonte dos recursos no contexto administrativo régio.
theological_decisions:
- issue: Relação entre o grego ἱερόν e o testemunho aramaico paralelo בית אלהך
  choice: templo do seu Deus
  alternative: casa do seu Deus
  rationale: Como o grego é a fonte primária e emprega ἱερόν, “templo” é a tradução mais precisa. A formulação distinta do testemunho aramaico paralelo é preservada em nota, sem harmonizar silenciosamente os textos.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção mantém o tom administrativo do decreto sem recorrer a linguagem jurídica arcaica.
