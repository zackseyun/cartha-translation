base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/024.yaml
  text: And all who transgress both the law of your God and the king’s law shall be diligently punished[a], whether by death or by punishment[c][b], by a fine of silver or by confiscation.
translation:
  language: pt
  text: E todos os que transgredirem tanto a lei do seu Deus como a lei do rei serão diligentemente punidos[a], seja por morte, por punição, por multa em dinheiro ou por confisco[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego aqui difere substancialmente do paralelo do Texto Massorético fornecido, que corresponde a outro contexto; por isso, a tradução segue o grego como testemunho principal.
    reason: textual_variant
  - marker: b
    text: Literalmente, “punição”; o grego não especifica qual seria essa modalidade de castigo.
    reason: lexical_alternative
  - marker: c
    text: Ou “banimento”. O termo grego pode indicar remoção; nesta lista jurídica, “confisco” provavelmente se refere à apreensão de bens.
    reason: alternative_reading
lexical_decisions:
- source_word: παραβαίνωσι
  choice: transgredirem
  rationale: Preserva a força jurídica de violar uma norma, em registro digno e compreensível.
- source_word: νόμον τοῦ θεοῦ σου καὶ τοῦ βασιλικοῦ
  choice: tanto a lei do seu Deus como a lei do rei
  rationale: Explicita a elipse do adjetivo substantivado βασιλικοῦ e conserva a dupla responsabilização expressa por καὶ...καὶ.
- source_word: ἐπιμελῶς κολασθήσονται
  choice: serão rigorosamente punidos
  rationale: No contexto de execução judicial, ἐπιμελῶς indica aplicação zelosa ou estrita da pena; a formulação portuguesa é mais natural do que 'cuidadosamente punidos'.
- source_word: θανάτῳ
  choice: com a morte
  rationale: Expressa de modo conciso a modalidade de punição indicada pelo dativo.
- source_word: τιμωρίᾳ
  choice: com outro castigo
  rationale: O termo é amplo; 'outro' evita a impressão redundante de 'punidos com punição' sem determinar uma modalidade que o grego não especifica.
- source_word: ἀργυρίῳ ζημίᾳ
  choice: com multa em dinheiro
  rationale: Comunica naturalmente a sanção pecuniária; ἀργύριον pode designar prata ou dinheiro.
- source_word: ἀπαγωγῇ
  choice: com confisco
  rationale: Na enumeração jurídica, pode indicar retirada ou apreensão, plausivelmente de bens, embora a palavra também admita remoção pessoal.
theological_decisions:
- issue: Relação entre a lei divina e a lei régia
  choice: tanto a lei do seu Deus como a lei do rei
  alternative: a lei do seu Deus ou a lei do rei
  rationale: A construção grega καὶ...καὶ favorece a coordenação cumulativa, sem opor as duas autoridades.
- issue: Divergência material do paralelo massorético fornecido
  choice: seguir o texto grego como testemunho primário
  alternative: harmonizar com o paralelo aramaico do Texto Massorético
  rationale: O paralelo fornecido corresponde a conteúdo diferente e não deve substituir o texto grego desta unidade.
- issue: Sentido jurídico de ἀπαγωγή
  choice: confisco
  alternative: banimento
  rationale: O contexto de uma lista de sanções favorece a apreensão ou retirada de bens, mas a ambiguidade lexical é preservada em nota.
translation_notes:
  register: Português moderno, formal e acessível, com vocabulário jurídico claro. A formulação evita a pouco natural expressão 'cuidadosamente punidos' e sinaliza em notas tanto a divergência textual quanto as ambiguidades reais de τιμωρία e ἀπαγωγή.
