base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/071.yaml
  text: Lord[a], I am ashamed and disgraced before your face.
translation:
  language: pt
  text: Senhor, estou envergonhado e humilhado diante de ti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “diante da tua face”. Ou “na tua presença”. O grego preserva uma expressão concreta, de sabor semítico, para estar diretamente na presença de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Senhor
  rationale: Vocativo de κύριος em uma oração dirigida a Deus. “Senhor” preserva a forma direta e solene sem acrescentar uma partícula vocativa inexistente no grego.
- source_word: ᾔσχυμμαι
  choice: estou envergonhado
  rationale: A forma verbal perfeita expressa um estado presente de vergonha. “Estou envergonhado” é natural em português e conserva o caráter pessoal da confissão.
- source_word: ἐντέτραμμαι
  choice: humilhado
  rationale: O perfeito médio-passivo intensifica a vergonha e pode comunicar abatimento, constrangimento ou desonra. “Humilhado” mantém essa força e forma um paralelismo claro com “envergonhado”.
- source_word: κατὰ πρόσωπόν σου
  choice: diante da tua face
  rationale: A tradução concreta preserva πρόσωπον, bem como o sabor semítico da expressão, ao mesmo tempo que comunica a presença direta de Deus.
theological_decisions:
- issue: Forma do tratamento divino Κύριε
  choice: Senhor
  alternative: Ó Senhor
  rationale: O texto contém o vocativo simples e não apresenta aqui um marcador grego mais específico do nome da aliança. “Senhor” conserva a invocação sem explicitação adicional.
- issue: Grau de literalidade em κατὰ πρόσωπόν σου
  choice: diante da tua face
  alternative: diante de ti / na tua presença
  rationale: A formulação escolhida preserva a imagem concreta do grego e a linguagem relacional de comparecer diretamente perante Deus. A nota oferece equivalentes idiomáticos sem apagar a imagem do texto principal.
- issue: Relação entre ᾔσχυμμαι e ἐντέτραμμαι
  choice: envergonhado e humilhado
  alternative: envergonhado e constrangido / envergonhado e desonrado
  rationale: Os dois verbos próximos são mantidos, em vez de fundidos, para conservar a intensificação retórica e a possível distinção entre vergonha sentida e condição de humilhação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão marcada “diante da tua face” foi preservada deliberadamente por sua concretude bíblica; a nota esclarece as formas mais idiomáticas.
