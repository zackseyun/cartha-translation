base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/029.yaml
  text: From the sons of Phoros[a], Tarosotomos; from the sons of Ietamar, Gamelos; from the sons of David[b],
translation:
  language: pt
  text: Dos filhos de Foros[a], Tarosótomo; dos filhos de Ietamar, Gamelo; dos filhos de Davi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Os nomes gregos deste trecho diferem consideravelmente do paralelo aproximado em Esdras 8:2, no texto hebraico: “dos filhos de Fineias, Gérson; dos filhos de Itamar, Daniel; dos filhos de Davi, Hatus”. Como 1 Esdras é traduzido do testemunho grego, o texto principal preserva as formas gregas em vez de harmonizá-las com o paralelo hebraico.'
    reason: alternative_reading
  - marker: b
    text: A expressão “dos filhos de Davi” fica sem complemento porque a lista grega prossegue no versículo seguinte.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: dos filhos de
  rationale: Fórmula genealógica natural em português, que preserva a estrutura repetida do grego e indica alguém procedente de determinada linhagem.
- source_word: Φορός
  choice: Foros
  rationale: Translitera a forma do testemunho grego, que é a fonte primária, sem harmonizá-la silenciosamente com o paralelo hebraico.
- source_word: Ταροσότομος
  choice: Tarosótomo
  rationale: Preserva por transliteração a forma grega divergente; o acento gráfico adapta a pronúncia ao português.
- source_word: Ἰεταμάρου
  choice: Itamar
  rationale: Usa a forma portuguesa reconhecível do nome bíblico correspondente, mantendo estreita relação com a forma grega.
- source_word: Γάμηλος
  choice: Gamelo
  rationale: Translitera o nome conforme o grego e evita substituí-lo por Daniel, forma encontrada apenas no paralelo hebraico aproximado.
- source_word: τῶν υἱῶν Δαυείδ
  choice: dos filhos de Davi,
  rationale: Repete em português a fórmula exigida pela estrutura da lista; a vírgula final conserva o caráter incompleto da frase, que prossegue no versículo seguinte.
