base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/044.yaml
  text: I sent for Eleazar[a], Iduel, Maasman, Enaathan, Shemaiah, Jorib, Nathan, Ennathan, Zechariah, and Mesholabon, the leaders and men of understanding,
translation:
  language: pt
  text: Mandei chamar Eleazar[a], Iduel, Maasman, Enaatã, Samaías, Joribe, Natã, Enatã, Zacarias e Mesolavom, líderes e homens de entendimento,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vários nomes pessoais deste versículo foram preservados em formas gregas difíceis de relacionar com exatidão aos nomes do texto hebraico paralelo de Esdras. Por isso, as formas aqui seguem o testemunho grego, sem tentar harmonizá-las por completo.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλα πρὸς
  choice: Mandei chamar
  rationale: Embora a construção diga literalmente «enviei a/para», o verbo seguido de πρὸς e dos nomes pessoais, neste contexto, indica o envio de alguém para convocá-los. «Mandei chamar» expressa esse sentido com naturalidade em português.
- source_word: Ἐλεάζαρον καὶ Ἰδούηλον καὶ Μαασμὰν καὶ Ἐναατὰν καὶ Σαμαίαν καὶ Ἰώριβον, Ναθάν, Ἐννατάν, Ζαχαρίαν καὶ Μεσολαβών
  choice: Eleazar, Iduel, Maasman, Enaatã, Samaías, Joribe, Natã, Enatã, Zacarias e Mesolavom
  rationale: Os nomes são transliterados a partir do testemunho grego, com formas aportuguesadas e acentuação legível, sem forçar sua harmonização com listas hebraicas paralelas.
- source_word: τοὺς ἡγουμένους
  choice: líderes
  rationale: O particípio substantivado designa pessoas que lideram ou ocupam posição de destaque; «líderes» é claro, atual e adequado ao contexto.
- source_word: ἐπιστήμονας
  choice: homens de entendimento
  rationale: O termo descreve pessoas conhecedoras, hábeis ou dotadas de discernimento. A expressão conserva o caráter pessoal e qualitativo do grego e, como todos os indivíduos nomeados são homens, mantém corretamente a referência masculina.
