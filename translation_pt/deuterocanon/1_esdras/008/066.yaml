base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/066.yaml
  text: The rulers and the priests and the Levites have not separated themselves from the foreign nations of the land, with their uncleannesses—from the Canaanites and Hittites and Perizzites and Jebusites and Moabites and Egyptians and Edomites.
translation:
  language: pt
  text: Os governantes, os sacerdotes e os levitas não se separaram das nações estrangeiras da terra, com as impurezas delas[a] — dos cananeus, dos hititas, dos ferezeus, dos jebuseus, dos moabitas, dos egípcios e dos edomitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se mantiveram separados dos povos estrangeiros da terra em suas impurezas”. A redação grega é comprimida; o paralelo hebraico de Esdras 9:1 favorece o sentido de que eles não se separaram desses povos e de suas práticas que causavam impureza.'
    reason: alternativa lexical e esclarecimento de ambiguidade sintática
lexical_decisions:
- source_word: Οὐκ ἐχώρισαν
  choice: não se separaram
  rationale: O aoristo apresenta como fato a falha em efetuar a separação. A forma reflexiva em português expressa naturalmente o sentido exigido pelo contexto.
- source_word: οἱ ἄρχοντες
  choice: os governantes
  rationale: Designa pessoas investidas de autoridade pública; “governantes” preserva essa função de modo claro e atual.
- source_word: οἱ ἱερεῖς καὶ οἱ Λευεῖται
  choice: os sacerdotes e os levitas
  rationale: São as designações portuguesas tradicionais, precisas e amplamente compreendidas para os respectivos grupos cultuais.
- source_word: ἀλλογενῆ ἔθνη
  choice: as nações estrangeiras
  rationale: A expressão identifica povos não israelitas. “Nações estrangeiras” conserva a dimensão étnico-nacional sem introduzir categorias raciais modernas.
- source_word: τῆς γῆς
  choice: da terra
  rationale: Neste contexto, γῆ se refere à terra ou território local, e não ao mundo inteiro.
- source_word: ἀκαθαρσίας αὐτῶν
  choice: com as impurezas delas
  rationale: A redação grega transmitida é comprimida e sintaticamente difícil. Esta formulação conserva a associação entre os povos e suas impurezas sem tornar explícita uma relação sintática que o texto não expressa com clareza; a nota registra a leitura contextual alternativa.
- source_word: Χαναναίων ... Ἰδουμαίων
  choice: dos cananeus ... dos edomitas
  rationale: Os genitivos especificam os povos anteriormente mencionados. “Edomitas” representa Ἰδουμαῖοι em português corrente.
theological_decisions:
- issue: Natureza da linguagem de impureza
  choice: impurezas
  alternative: abominações
  rationale: “Impurezas” mantém o campo ritual e moral de ἀκαθαρσία sem intensificá-lo para “abominações”, termo que não aparece neste texto grego.
- issue: Relação entre a separação, os povos e suas impurezas
  choice: 'Preservar no texto principal a formulação associativa e comprimida: “das nações estrangeiras da terra, com as impurezas delas”.'
  alternative: “não se mantiveram separados dos povos estrangeiros da terra em suas impurezas” ou “não se separaram ... das impurezas deles”
  rationale: O grego é irregular e não define de modo inequívoco a relação sintática. A tradução principal evita harmonizá-lo silenciosamente, enquanto a nota apresenta o sentido apoiado pelo paralelo de Esdras 9:1.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais. A repetição de “dos” na lista mantém clareza, e o travessão assinala que os nomes especificam as nações estrangeiras. A formulação incomum antes do travessão é deliberada e acompanhada de nota, para não eliminar a dificuldade real do grego.
