  naturalness: O português é moderno, claro e de registro bíblico sóbrio. A expressão “com as impurezas delas” é deliberadamente marcada, mas é compreensível e a nota explica a dificuldade textual; não exige alteração.
  terminology: “Governantes”, “sacerdotes”, “levitas”, “impurezas” e os gentílicos empregados são apropriados e consistentes com o registro e com o grego. “Impurezas” evita importar o termo mais forte “abominações”, ausente neste texto grego.
