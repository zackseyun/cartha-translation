base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/047.yaml
  text: a man of understanding[a], from the sons of Mooli, son of Levi, son of Israel—Asebebias, and his sons and brothers, ten[c][b];
translation:
  language: pt
  text: um homem entendido, dos filhos de Mooli[a], filho de Levi, filho de Israel — Asebebias[b], e seus filhos e irmãos, dez[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo hebraico traz “Mahli” em vez de “Mooli”.
    reason: alternative_reading
  - marker: b
    text: O paralelo hebraico traz o nome “Serebias”. O grego aqui traz “Asebebias”.
    reason: alternative_reading
  - marker: c
    text: O paralelo hebraico traz “dezoito” em vez de “dez”.
    reason: textual_variant
lexical_decisions:
- source_word: ἄνδρα ἐπιστήμονα
  choice: um homem entendido
  rationale: A expressão preserva o masculino singular de ἄνδρα e comunica de modo natural o conhecimento e discernimento indicados por ἐπιστήμονα, em consonância com o paralelo hebraico אִישׁ שֶׂכֶל.
- source_word: τῶν υἱῶν Μοολὶ
  choice: dos filhos de Mooli
  rationale: Mantém a fórmula genealógica grega e translitera o nome da testemunha primária; a forma do paralelo hebraico é registrada em nota.
- source_word: τοῦ Λευὶ τοῦ Ἰσραήλ
  choice: filho de Levi, filho de Israel
  rationale: Explicita em português a cadeia genealógica expressa pelos genitivos gregos e confirmada pela formulação do paralelo hebraico.
- source_word: Ἀσεβηβίαν
  choice: Asebebias
  rationale: Translitera o nome conforme o texto grego de Swete, sem substituí-lo silenciosamente pela forma divergente do paralelo hebraico.
- source_word: τοὺς υἱοὺς καὶ τοὺς ἀδελφοὺς
  choice: seus filhos e irmãos
  rationale: A relação possessiva com Asebebias é a leitura contextual mais natural; 'filhos' preserva o sentido masculino e genealógico de υἱούς.
- source_word: δέκα
  choice: dez
  rationale: Segue a leitura explícita da fonte grega primária; a variante 'dezoito' do paralelo hebraico é preservada em nota.
