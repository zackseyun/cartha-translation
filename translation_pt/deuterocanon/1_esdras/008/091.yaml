revisions:
- from: Neste assunto, façamos ao Senhor o juramento de mandar embora[a] todas as nossas esposas que são de povos estrangeiros, junto com os filhos delas, conforme foi decidido por você e por todos os que obedecerem à lei do Senhor.[b]
  to: Neste assunto, façamos um juramento ao Senhor de expulsar[a] todas as nossas esposas estrangeiras, junto com seus filhos, conforme foi decidido por você e por todos os que obedecerem à lei do Senhor.[b]
  rationale: A revisão torna o enunciado mais idiomático em português e restitui à tradução principal a força de ἐκβαλεῖν. Mantém-se a nota sobre a construção final, pois o texto grego transmitido é sintaticamente comprimido e não exige resolver a elipse além do necessário.
