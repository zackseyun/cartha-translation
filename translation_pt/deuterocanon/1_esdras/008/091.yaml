base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/091.yaml
  text: In this matter let there be for us an oath to the Lord[a], to send away all our wives from among the foreigners, together with their children, as it has been decided by you[b], and by all who obey the law of the Lord.
translation:
  language: pt
  text: Neste assunto, façamos um juramento ao Senhor de expulsar[a] todas as nossas esposas estrangeiras, junto com seus filhos, conforme foi decidido por você e por todos os que obedecerem à lei do Senhor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mandar embora” ou “pôr para fora”.
    reason: lexical_alternative
  - marker: b
    text: 'O grego é sintaticamente condensado: literalmente, “conforme foi decidido por você, e todos os que obedecerem à lei do Senhor”. A tradução liga o último grupo à decisão mencionada.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Neste assunto
  rationale: Expressa de modo natural a referência ao assunto específico em discussão, sem deixar o demonstrativo vago.
- source_word: γενέσθω ἡμῖν ὁρκωμοσία πρὸς τὸν κύριον
  choice: façamos ao Senhor o juramento
  rationale: Converte a construção grega com γίνομαι e dativo numa formulação portuguesa clara, preservando a ideia de um compromisso formal dirigido ao Senhor.
- source_word: ἐκβαλεῖν
  choice: mandar embora
  rationale: Comunica a retirada exigida pelo juramento sem acrescentar necessariamente a conotação física mais forte de “expulsar”; a alternativa é registrada em nota.
- source_word: πάσας τὰς γυναῖκας ἡμῶν
  choice: todas as nossas esposas
  rationale: O contexto matrimonial indica que γυναῖκες significa “esposas”, e não simplesmente “mulheres”.
- source_word: τὰς ἐκ τῶν ἀλλογενῶν
  choice: que são de povos estrangeiros
  rationale: Identifica a origem étnica ou nacional sem importar a distinção teológica posterior sugerida por “gentios”.
- source_word: σὺν τοῖς τέκνοις αὐτῶν
  choice: junto com os filhos delas
  rationale: Preserva a inclusão explícita dos filhos e torna inequívoca em português a referência do pronome às esposas.
- source_word: ὡς ἐκρίθη σοι
  choice: conforme foi decidido por você
  rationale: Mantém a forma passiva e o sentido judicial de κρίνω, com linguagem moderna e amplamente compreensível.
- source_word: καὶ ὅσοι πειθαρχήσουσιν τοῦ νόμου τοῦ κυρίου
  choice: e por todos os que obedecerem à lei do Senhor
  rationale: Supre em português o vínculo sintático implícito com “foi decidido”, preservando o valor prospectivo ou volitivo do futuro grego.
theological_decisions:
- issue: Tradução de κύριος no contexto da lei e do juramento
  choice: Senhor
  alternative: Soberano
  rationale: O termo designa o Deus de Israel neste contexto pactual; “Senhor” preserva o uso bíblico tradicional sem acrescentar interpretação denominacional.
- issue: Sentido de ἀλλογενῶν
  choice: povos estrangeiros
  alternative: gentios
  rationale: A expressão indica origem em outro povo; “gentios” poderia introduzir uma categoria teológica posterior que o termo não exige.
- issue: Responsabilidade atribuída pela oração final sintaticamente comprimida
  choice: a decisão é atribuída a você e a todos os que obedecerem à lei
  alternative: a decisão é atribuída apenas a você, ficando os obedientes como oração independente ou elíptica
  rationale: A coordenação com καί favorece a ligação de ambos ao verbo passivo anterior, mas a forma transmitida é comprimida e a incerteza é explicitada em nota.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil e em outros contextos lusófonos. Emprega “você” para evitar um tom excessivamente arcaico, mantendo clareza quanto ao destinatário singular.
