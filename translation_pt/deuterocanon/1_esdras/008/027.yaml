base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/027.yaml
  text: And I took courage according to the help of the Lord my God[a], and I gathered from Israel men to go up with me.
translation:
  language: pt
  text: E tomei coragem com o auxílio do Senhor, meu Deus,[a] e reuni homens dentre os israelitas para subirem comigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico paralelo de Esdras 7:28 diz “chefes” ou “líderes”, em vez de “homens”. Aqui, 1 Esdras segue a redação grega.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθαρσὴς ἐγενόμην
  choice: me enchi de coragem
  rationale: Expressa de modo natural o ato de ganhar ânimo ou confiança, em consonância com o matiz de fortalecimento presente também no paralelo hebraico.
- source_word: κατὰ τὴν ἀντίλημψιν
  choice: com o auxílio
  rationale: ἀντίλημψις denota ajuda, amparo ou assistência. A construção portuguesa comunica que a coragem veio mediante o auxílio divino sem reproduzir de forma artificial a preposição grega.
- source_word: Κυρίου θεοῦ μου
  choice: do Senhor, meu Deus
  rationale: Segue diretamente o grego Κυρίου e mantém a relação pessoal expressa por θεοῦ μου. A vírgula favorece a leitura natural em português.
- source_word: συνήγαγον
  choice: reuni
  rationale: Equivalente corrente e digno para o ato de ajuntar pessoas com uma finalidade comum.
- source_word: ἐκ τοῦ Ἰσραὴλ
  choice: dentre Israel
  rationale: Deixa claro que os homens foram escolhidos entre o povo de Israel, evitando a possível leitura meramente geográfica de 'de Israel'.
- source_word: ἄνδρας
  choice: homens
  rationale: O texto grego diz explicitamente 'homens'. Não se importa para o texto principal o hebraico paralelo רָאשִׁים, 'chefes' ou 'líderes'.
- source_word: ὥστε συναναβῆναί μοι
  choice: para subirem comigo
  rationale: A construção expressa finalidade e preserva o verbo tradicional de subida, apropriado à viagem rumo a Jerusalém.
theological_decisions:
- issue: 'Identidade ou posição dos que foram reunidos: grego ἄνδρας versus hebraico paralelo רָאשִׁים'
  choice: homens
  alternative: chefes ou líderes
  rationale: Como 1 Esdras é traduzido primariamente do grego, mantém-se ἄνδρας no texto principal. A divergência relevante do paralelo hebraico é registrada em nota, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. 'Me enchi de coragem' é idiomático sem perder o sentido de fortalecimento; 'dentre Israel' esclarece a origem no grupo; 'subirem' preserva a linguagem bíblica de ascensão a Jerusalém.
