base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/058.yaml
  text: And I said to them[a], “You also are holy to the Lord, and the vessels are holy, and the silver and the gold are a vow offering to the Lord[b], the Lord of our fathers.”
translation:
  language: pt
  text: 'E eu lhes disse: “Vocês também são santos para o Senhor, e os utensílios são santos; a prata e o ouro são uma oferta votiva[a] ao Senhor, o Senhor de nossos pais[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «oferta de voto». O grego usa um termo que pode designar um voto ou uma oferta relacionada a um voto; o paralelo hebraico tem «oferta voluntária».
    reason: lexical_alternative
  - marker: b
    text: O grego diz «o Senhor de nossos pais». O paralelo hebraico tem «o SENHOR, o Deus de seus pais».
    reason: textual_variant
lexical_decisions:
- source_word: ἅγιοί
  choice: santos
  rationale: Preserva diretamente o sentido cultual e teológico de algo ou alguém separado e consagrado a Deus, além de manter a repetição com ἅγια.
- source_word: τῷ κυρίῳ
  choice: para o Senhor
  rationale: Exprime a relação de pertença e dedicação indicada pelo dativo grego e corresponde naturalmente ao português atual.
- source_word: σκεύη
  choice: utensílios
  rationale: No contexto do templo, designa objetos empregados no serviço sagrado; “utensílios” é claro e natural sem ampliar indevidamente o referente.
- source_word: ἀργύριον καὶ τὸ χρυσίον
  choice: a prata e o ouro
  rationale: O emparelhamento favorece os materiais preciosos, e não os sentidos mais gerais de dinheiro ou riqueza.
- source_word: εὐχή
  choice: oferta de voto
  rationale: Mantém como âncora o sentido mais direto do grego εὐχή, “voto” ou oferta vinculada a um voto. O paralelo hebraico traz “oferta voluntária”, mas não deve substituir silenciosamente a leitura do texto grego primário.
- source_word: κυρίῳ τῶν πατέρων ἡμῶν
  choice: o Senhor de nossos pais
  rationale: Traduz formalmente a frase grega transmitida, inclusive o pronome “nossos”, sem inserir “Deus de”, que aparece apenas no paralelo hebraico.
theological_decisions:
- issue: Sentido cultual de εὐχή diante do paralelo hebraico נְדָבָה
  choice: oferta de voto
  alternative: oferta voluntária
  rationale: A tradução segue prioritariamente o grego, no qual εὐχή aponta para voto, mas reconhece que o paralelo hebraico descreve uma oferta voluntária. A divergência é lexical/textual, e nenhuma das leituras deve ser harmonizada sem indicação.
- issue: Forma do título divino no fim do versículo
  choice: o Senhor de nossos pais
  alternative: o Senhor, o Deus de seus pais
  rationale: A forma escolhida reproduz o grego κυρίῳ τῶν πατέρων ἡμῶν. O paralelo hebraico contém “o SENHOR, o Deus de seus pais”, com tanto a aposição “Deus” quanto a segunda pessoa; esses elementos não foram importados para o texto principal.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Vocês” evita a rigidez regional de “vós”; “santos” conserva a linguagem bíblica comum. A redação mantém a coordenação repetitiva do grego e sua tensão com o paralelo hebraico, sem harmonização conjectural.
