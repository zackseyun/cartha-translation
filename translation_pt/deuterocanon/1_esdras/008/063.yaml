base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/063.yaml
  text: 'And those who had come from the captivity offered sacrifices to the Lord[a], the God of Israel: ninety-six rams, seventy-six lambs, and twelve male goats for a peace offering; all of them as a sacrifice to the Lord.'
translation:
  language: pt
  text: 'Os que haviam chegado do cativeiro ofereceram sacrifícios ao Deus de Israel, o Senhor: noventa e seis — setenta e seis cordeiros e doze bodes em favor da salvação[a]; todos eles como sacrifício ao Senhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em favor do bem-estar” ou “em favor do livramento”. O grego diz literalmente “por/em favor de salvação”; a expressão ocorre aqui em contexto sacrificial.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ παραγενόμενοι ἐκ τῆς αἰχμαλωσίας
  choice: Os que haviam chegado do cativeiro
  rationale: Expressa naturalmente o particípio de chegada e mantém o sentido mais literal de αἰχμαλωσία, que enfatiza o cativeiro, embora “exílio” também seja possível.
- source_word: προσήνεγκαν θυσίας
  choice: ofereceram sacrifícios
  rationale: Em contexto cultual, προσφέρω significa naturalmente “oferecer”, e θυσίας é traduzido diretamente por “sacrifícios”.
- source_word: τῷ θεῷ τοῦ Ἰσραὴλ Κυρίῳ
  choice: ao Deus de Israel, o Senhor
  rationale: Mantém a ordem do grego e entende Κυρίῳ como aposição a “Deus de Israel”.
- source_word: ἄρνας
  choice: cordeiros
  rationale: ἄρνας designa cordeiros ou ovinos jovens; “cordeiros” é a equivalência direta e adequada ao inventário sacrificial.
- source_word: τράγους
  choice: bodes
  rationale: τράγος especifica o macho da cabra; “bodes” é claro e corrente em português.
- source_word: ὑπὲρ σωτηρίου
  choice: como oferta de paz
  rationale: O contexto sacrificial favorece uma designação cultual ligada à paz ou ao bem-estar. A nota preserva o sentido lexical mais amplo de σωτήριον.
- source_word: ἅπαντα θυσίαν τῷ κυρίῳ
  choice: todos eles como sacrifício ao Senhor
  rationale: A formulação resume coletivamente todos os animais enumerados e conserva o singular coletivo θυσίαν.
theological_decisions:
- issue: Sentido cultual de ὑπὲρ σωτηρίου
  choice: como oferta de paz
  alternative: para o bem-estar; pela salvação; pelo livramento
  rationale: A enumeração de animais e a conclusão que os chama de sacrifício favorecem o sentido cultual. A nota evita reduzir a amplitude semântica do grego a uma única interpretação.
- issue: Identificação de Deus em τῷ θεῷ τοῦ Ἰσραὴλ Κυρίῳ
  choice: ao Deus de Israel, o Senhor
  alternative: ao Senhor, o Deus de Israel
  rationale: A opção adotada segue a ordem e a relação apositiva mais imediata do texto grego sem introduzir distinção entre os títulos.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário sacrificial amplamente compreensível. Conserva-se “cativeiro” por proximidade ao grego. A elipse textual antes de “noventa e seis” é explicitada em nota, e a ambiguidade de σωτήριον é preservada.
