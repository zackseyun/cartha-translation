revisions:
- from: 'Os que haviam chegado do cativeiro ofereceram sacrifícios ao Deus de Israel, o Senhor: noventa e seis carneiros[a], setenta e seis cordeiros e doze bodes como oferta de paz[b]; todos eles como sacrifício ao Senhor.'
  to: 'Os que haviam chegado do cativeiro ofereceram sacrifícios ao Deus de Israel, o Senhor: noventa e seis — setenta e seis cordeiros e doze bodes em favor da salvação[a]; todos eles como sacrifício ao Senhor.'
  rationale: Remove-se «carneiros», pois o grego preservado omite o animal associado a «noventa e seis». O travessão conserva visivelmente essa elipse sem atribuir-lhe uma solução conjectural. Substitui-se «como oferta de paz» por «em favor da salvação», preservando o valor lexical de σωτηρίου; a nota registra alternativas compatíveis com o contexto cultual. A aposição «ao Deus de Israel, o Senhor» e o singular coletivo «como sacrifício» são mantidos.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:34:06Z'
review_pass:
  verdict: revise
  source_fidelity: É necessária revisão. O grego traz o número «noventa e seis» sem substantivo expresso; portanto, «carneiros» não pode constar no texto principal, nem ser apresentado como suprido por uma tradição paralela. Além disso, ὑπὲρ σωτηρίου conserva literalmente a noção de salvação/livramento, ainda que ocorra em contexto sacrificial; «oferta de paz» interpreta-o de modo excessivamente específico.
  naturalness: A redação revista mantém um português moderno e claro. A construção com travessão assinala de modo legível a elipse presente no grego, sem inventar o animal omitido.
  terminology: «Cativeiro», «sacrifícios», «cordeiros», «bodes» e «Senhor» são adequados. «Em favor da salvação» traduz ὑπὲρ σωτηρίου de forma não denominacional e a nota registra alternativas contextuais sem transformá-las em uma categoria sacrificial técnica.
  issues:
