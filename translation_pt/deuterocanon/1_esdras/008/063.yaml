    issue: «carneiros» foi inserido após «noventa e seis», embora o texto grego fornecido contenha apenas o número.
    rationale: A fonte primária diz ἐνενήκοντα ἕξ, sem nome de animal. A nota atual reconhece a elipse, mas a alegação de que «carneiros» foi suprido conforme uma tradição paralela não é sustentada pelo paralelo MT apresentado, que não contém o inventário sacrificial. A tradução deve preservar a lacuna.
  - severity: medium
    issue: «como oferta de paz» especifica indevidamente ὑπὲρ σωτηρίου.
    rationale: σωτήριον remete lexicalmente a salvação, livramento ou bem-estar. O contexto é sacrificial, mas o grego não emprega aqui um termo inequívoco que exija a categoria técnica «oferta de paz». Uma tradução mais aberta preserva a ambiguidade.
