base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/072.yaml
  text: For our sins have multiplied beyond our heads[a], and our offenses have risen up to heaven.
translation:
  language: pt
  text: Pois os nossos pecados se avolumaram acima de nossas cabeças, e as nossas faltas cometidas por ignorância[a] se elevaram até o céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “erros”, “pecados involuntários” ou “atos de ignorância”. O grego usa aqui um termo diferente de “pecados” na oração anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτίαι
  choice: pecados
  rationale: É o equivalente português direto e corrente para falhas morais, preservando o registro confessional do texto.
- source_word: ἐπλεόνασαν
  choice: se avolumaram
  rationale: Expressa aumento e acumulação, mantendo a imagem vívida de pecados que se erguem acima da cabeça.
- source_word: ὑπὲρ τὰς κεφαλὰς ἡμῶν
  choice: acima de nossas cabeças
  rationale: Conserva a imagem espacial e o plural do grego sem reduzir a expressão a uma explicação abstrata sobre culpa esmagadora.
- source_word: ἄγνοιαι
  choice: faltas cometidas por ignorância
  rationale: Comunica em português natural tanto a ideia de transgressão quanto a de desconhecimento ou falta de percepção, distinguindo o termo de ἁμαρτίαι.
- source_word: ὑπερήνεγκαν
  choice: se elevaram
  rationale: Preserva o movimento ascendente da metáfora e se combina naturalmente com a expressão 'até o céu'.
- source_word: ἕως τοῦ οὐρανοῦ
  choice: até o céu
  rationale: É uma tradução direta e idiomática, adequada ao registro bíblico e à imagem vertical do versículo.
theological_decisions:
- issue: Se ἁμαρτίαι e ἄγνοιαι devem ser reduzidos a uma única categoria de pecado
  choice: Manter a distinção entre 'pecados' e 'faltas cometidas por ignorância'.
  alternative: Traduzir ambos genericamente como 'pecados', 'culpas' ou 'transgressões'.
  rationale: O grego emprega dois substantivos diferentes. A tradução preserva a possível distinção entre pecados em geral e faltas ligadas à ignorância, sem afirmar que estas sejam necessariamente involuntárias.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. 'Se avolumaram' conserva a metáfora de acumulação sem recorrer à formulação pouco idiomática 'multiplicaram-se para além de nossas cabeças'. A nota preserva a amplitude semântica e a ambiguidade de ἄγνοιαι.
