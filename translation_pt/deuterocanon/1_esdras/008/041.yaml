base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/041.yaml
  text: 'From the sons of Banai: Outu son of Istakalkou, and with him seventy men.'
translation:
  language: pt
  text: 'Dos filhos de Banai: Outu, filho de Istakalkou; e com ele, setenta homens.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν Βαναί
  choice: Dos filhos de Banai
  rationale: Reproduz diretamente a fórmula genealógica grega e translitera o nome próprio sem harmonizá-lo com o paralelo massorético divergente.
- source_word: Οὐτοῦ Ἰστακάλκου
  choice: Outu, filho de Istakalkou
  rationale: Os nomes são transliterados conforme a forma grega. A relação filial é implícita no genitivo Ἰστακάλκου e foi explicitada em português para clareza natural.
- source_word: ἄνδρες ἑβδομήκοντα
  choice: setenta homens
  rationale: Tradução direta da expressão grega, preservando a contagem masculina apresentada no texto.
theological_decisions:
- issue: Divergência entre o texto grego e o paralelo massorético
  choice: Seguir Banai, Outu, Istakalkou e setenta conforme o grego
  alternative: Harmonizar com Adonicão, Elifelete, Jeiel, Semaías e sessenta no texto massorético de Esdras 8:13
  rationale: A edição grega indicada é a fonte primária para 1 Esdras; a diferença textual genuína não deve ser eliminada por harmonização silenciosa.
translation_notes:
  register: Português moderno, claro e digno. A pontuação separa a identificação do líder da informação sobre o grupo, sem alterar a estrutura enumerativa do original.
