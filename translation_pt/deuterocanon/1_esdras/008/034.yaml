  text: 'From the sons of Sophotius: Zaraias son of Michael[a], and with him seventy men.'
translation:
  language: pt
  text: 'Dos filhos de Sofótio: Zaraías, filho de Miguel,[a] e com ele setenta homens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Os nomes e o número no texto grego diferem do paralelo hebraico aproximado em Esdras 8:6, que diz: «dos filhos de Adin: Ebed, filho de Jônatas, e com ele cinquenta homens do sexo masculino». Como 1 Esdras é traduzido a partir da testemunha grega, o texto principal segue os nomes e o número gregos.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Dos filhos de
  rationale: A preposição ἐκ com o genitivo indica alguém selecionado de um grupo; a fórmula «Dos filhos de» é natural em uma lista genealógica.
- source_word: Σοφοτίου
  choice: Sofótio
  rationale: Transliteração portuguesa da forma grega, sem harmonizá-la com o paralelo hebraico aproximado.
- source_word: Ζαραίας
  choice: Zaraías
  rationale: Transliteração da forma nominal grega com acentuação natural em português, preservando a forma da testemunha primária.
- source_word: Μειχαήλου
  choice: filho de Miguel
  rationale: O genitivo sem substantivo explícito tem sentido filial nesta lista genealógica; «filho de» torna a relação clara em português.
- source_word: μετʼ αὐτοῦ
  choice: e com ele
  rationale: Expressão comum de acompanhamento, ligando o chefe nomeado ao grupo contado.
- source_word: ἄνδρες
  choice: homens
  rationale: Neste contexto de recenseamento, designa homens do sexo masculino e corresponde de modo natural ao grego.
- source_word: ἑβδομήκοντα
  choice: setenta
  rationale: Tradução direta do numeral cardinal grego.
