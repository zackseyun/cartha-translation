base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/022.yaml
  text: And it is also declared to you that no tax or other burden is to be imposed on any of the priests[a], Levites, temple singers, gatekeepers, temple servants, or workers of this temple[b], and that no one is to have authority to impose it on them.
translation:
  language: pt
  text: E também se declara a vocês que não se imponha nenhum imposto nem outro encargo a nenhum dos sacerdotes, levitas, cantores do templo, porteiros, servidores do templo ou encarregados dos assuntos deste templo[a], e que ninguém tenha autoridade para impor isso a eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Encarregados dos assuntos deste templo” traduz um termo que pode designar os que se ocupavam dos negócios ou das atividades do templo; “funcionários deste templo” também é possível.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγεται
  choice: se declara
  rationale: No contexto de um decreto administrativo, o passivo tem sentido de declaração oficial, mais forte que o simples “se diz”.
- source_word: πᾶσι τοῖς ἱερεῦσιν
  choice: a nenhum dos sacerdotes
  rationale: 'A construção negativa em português expressa naturalmente o alcance abrangente do grego: nenhum membro da classe está sujeito à imposição.'
- source_word: ἱεροψάλταις
  choice: cantores do templo
  rationale: Preserva de modo claro e atual a função cultual explicitada pelo composto grego.
- source_word: θυρωροῖς
  choice: porteiros
  rationale: Termo bíblico e administrativo corrente para os responsáveis pelas entradas, sem o sentido moderno potencialmente mais restrito de “guardas”.
- source_word: ἱεροδούλοις
  choice: servidores do templo
  rationale: Expressa o serviço institucional sem especificar indevidamente escravidão, nuance não necessariamente destacada nesta lista de pessoal.
- source_word: πραγματικοῖς τοῦ ἱεροῦ
  choice: encarregados dos assuntos deste templo
  rationale: O adjetivo pode designar pessoas ocupadas com negócios ou assuntos institucionais; a formulação evita restringi-las a trabalhadores braçais ou a oficiais formalmente titulados.
- source_word: μηδεμία φορολογία
  choice: nenhum imposto
  rationale: φορολογία indica tributação ou tributo; “imposto” é claro e natural no contexto fiscal.
- source_word: μηδὲ ἄλλη ἐπιβουλή
  choice: nem outro encargo
  rationale: Embora ἐπιβουλή possa ter sentidos hostis em outros contextos, junto de φορολογία e ἐπιβαλεῖν denota aqui uma imposição adicional; “encargo” preserva amplitude sem limitá-la a outro tributo.
- source_word: μηδένα ἔχειν ἐξουσίαν ἐπιβαλεῖν τούτοις
  choice: que ninguém tenha autoridade para impor isso a eles
  rationale: Mantém explicitamente o sentido jurídico de autoridade e a ideia de lançar uma obrigação sobre as pessoas enumeradas.
