base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/013.yaml
  text: and to bring to Jerusalem gifts for the Lord[a], which I and my friends have vowed, and all the gold and silver that may be found in the land of Babylonia for the Lord in Jerusalem[b],
translation:
  language: pt
  text: e levar a Jerusalém as dádivas ao Senhor[a] que eu e meus amigos prometemos por voto, bem como todo o ouro e a prata que forem encontrados na terra da Babilônia, destinados ao Senhor em Jerusalém[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofertas ao Senhor”; neste contexto, o termo grego pode ter sentido cultual.
    reason: lexical_alternative
  - marker: b
    text: A frase final é condensada no grego; literalmente, “ao Senhor para/em Jerusalém”. O sentido parece ser o de recursos destinados ao Senhor em Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπενεγκεῖν
  choice: levar
  rationale: O infinitivo expressa o transporte dos bens até seu destino; “levar a Jerusalém” é natural em português e preserva a direção do movimento.
- source_word: δῶρα
  choice: dádivas
  rationale: Mantém o sentido amplo de presentes destinados ao Senhor sem impor a ideia técnica de sacrifícios; a nota registra a possível nuance cultual de “ofertas”.
- source_word: ἃ ηὔξαμην
  choice: que ... prometemos por voto
  rationale: Neste contexto, εὔχομαι indica assumir um voto. A expressão explicita o sentido religioso sem sugerir meramente oração.
- source_word: οἱ φίλοι
  choice: meus amigos
  rationale: É a correspondência direta e não técnica do grego; “companheiros” ou “associados” especificariam uma relação que o texto não define.
- source_word: πᾶν χρυσίον καὶ ἀργύριον
  choice: todo o ouro e a prata
  rationale: Representa os metais preciosos coletivamente e conserva a abrangência de πᾶν.
- source_word: ὃ ἐὰν εὑρεθῇ
  choice: que forem encontrados
  rationale: Preserva a referência contingente e indefinida da construção com ἐὰν e subjuntivo, com concordância portuguesa natural para “ouro e prata”.
- source_word: ἐν τῇ χώρᾳ τῆς Βαβυλωνίας
  choice: na terra da Babilônia
  rationale: χώρα designa terra ou região; “Babilônia” é a forma geográfica mais corrente e legível em português.
- source_word: τῷ κυρίῳ εἰς Ἰερουσαλήμ
  choice: destinados ao Senhor em Jerusalém
  rationale: A frase grega final é condensada. “Destinados” torna clara a relação dos recursos com o Senhor, enquanto “em Jerusalém” conserva o local cultual sem repetir de modo artificial o movimento já expresso.
theological_decisions:
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Soberano
  rationale: No contexto escriturístico judaico, κύριος se refere ao Deus de Israel; “Senhor” é a forma tradicional, clara e não denominacional.
- issue: Nuance cultual de δῶρα e ηὔξαμην
  choice: dádivas ... prometemos por voto
  alternative: ofertas ... prometemos
  rationale: A formulação mantém tanto a natureza material das dádivas quanto seu compromisso religioso, sem determinar uma modalidade sacrificial não especificada.
- issue: Relação sintática da frase final comprimida
  choice: destinados ao Senhor em Jerusalém
  alternative: para o Senhor, a Jerusalém
  rationale: A escolha comunica que o ouro e a prata se destinam ao culto do Senhor em Jerusalém, mas a nota preserva a compressão e a possível leitura direcional do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Dádivas” conserva certa elevação apropriada ao contexto régio e religioso; “prometemos por voto” evita a ambiguidade moderna de simplesmente “prometemos”. Os dois marcadores de nota aparecem no texto principal.
