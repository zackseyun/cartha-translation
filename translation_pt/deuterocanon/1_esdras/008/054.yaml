base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/054.yaml
  text: And again we prayed to our Lord about all these things[b][a], and we found him favorable.
translation:
  language: pt
  text: E novamente oramos ao nosso Senhor por todas essas coisas,[a] e o encontramos favorável.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego diz: “E novamente oramos ao nosso Senhor por todas essas coisas, e o encontramos favorável”. O paralelo hebraico do Texto Massorético fornecido para este versículo não corresponde a essa redação e parece refletir outro contexto; por isso, a tradução segue o grego como testemunho principal.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “bondoso” ou “propício”. O adjetivo grego pode indicar uma disposição benigna ou favorável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: novamente
  rationale: Marca a repetição da ação; “novamente” é claro, natural e preserva o sentido do advérbio grego.
- source_word: ἐδεήθημεν
  choice: oramos
  rationale: O verbo δέομαι expressa um pedido insistente ou uma súplica. “Oramos” comunica naturalmente a ação no contexto, sem perder seu caráter de petição.
- source_word: τοῦ κυρίου ἡμῶν
  choice: ao nosso Senhor
  rationale: Com δέομαι, o genitivo indica a pessoa a quem se dirige a súplica. “Senhor” é a tradução apropriada de κύριος neste contexto de oração a Deus.
- source_word: πάντα ταῦτα
  choice: por todas essas coisas
  rationale: Mantém a abrangência de πάντα e a força plural do demonstrativo, referindo-se aos assuntos anteriormente mencionados.
- source_word: ἐτύχομεν
  choice: encontramos
  rationale: Aqui τυγχάνω comunica alcançar ou deparar com determinado resultado. Em português, “o encontramos favorável” reproduz de modo idiomático a construção com o adjetivo seguinte.
- source_word: εὐιλάτου
  choice: favorável
  rationale: O adjetivo descreve alguém bem-disposto, benigno ou propício. “Favorável” é atual e evita acrescentar a nuance específica de misericórdia.
theological_decisions:
- issue: Tradução de κύριος em contexto de oração
  choice: Senhor
  alternative: senhor ou mestre
  rationale: A oração é dirigida a Deus; “Senhor” preserva o uso religioso natural de κύριος sem introduzir uma leitura denominacional.
- issue: Divergência entre o texto grego e o paralelo massorético fornecido
  choice: Traduzir no texto principal a declaração de oração presente no grego
  alternative: Seguir o paralelo massorético sobre a separação de sacerdotes
  rationale: O testemunho massorético fornecido pertence claramente a um contexto diferente e não corresponde à redação grega deste versículo. Como o grego é a fonte primária indicada, sua redação governa a tradução, e a divergência é registrada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A formulação preserva a sequência e o conteúdo do grego, usando sintaxe natural em português e registrando em nota tanto a divergência textual quanto a alternativa lexical.
