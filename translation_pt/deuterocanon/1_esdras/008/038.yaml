base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/038.yaml
  text: 'the sons of Astad: Joanes son of Akatan[a], and with him one hundred ten men[b];'
translation:
  language: pt
  text: 'dos filhos de Astade: Joanês, filho de Acatã[a][b], e com ele cento e dez homens;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico paralelo em Esdras 8:10 apresenta aqui outra sequência de família e nome e registra cento e sessenta homens. Como 1 Esdras é traduzido a partir do testemunho grego, os nomes e o total do grego foram mantidos no texto principal.
    reason: textual_variant
  - marker: b
    text: Ou, possivelmente, «Joanês Acatã». No grego, os dois nomes aparecem lado a lado sem uma expressão explícita equivalente a «filho de», embora o contexto da lista genealógica favoreça a interpretação patronímica.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: dos filhos de
  rationale: Na estrutura desta lista, a expressão identifica pessoas pertencentes a uma família ou clã. A formulação portuguesa reproduz naturalmente esse valor partitivo.
- source_word: Ἀστάδ
  choice: Astade
  rationale: Transliteração adaptada à ortografia e à pronúncia do português, baseada no nome próprio do testemunho grego, que é a fonte principal.
- source_word: Ἰωάνης
  choice: Joanês
  rationale: Transliteração portuguesa direta do nome grego, sem substituí-lo pelo nome diferente encontrado no paralelo hebraico.
- source_word: Ἀκατάν
  choice: Acatã
  rationale: O termo é tratado como nome próprio e transliterado segundo convenções portuguesas. O contexto genealógico favorece entendê-lo como patronímico, embora o grego não contenha uma expressão explícita equivalente a «filho de».
- source_word: μετʼ αὐτοῦ
  choice: e com ele
  rationale: Mantém a conjunção e o pronome singular do grego, cujo referente natural é Joanês.
- source_word: ἄνδρες
  choice: homens
  rationale: É o equivalente corrente de ἄνδρες e segue o testemunho grego, em vez de importar a expressão mais biológica «machos» do paralelo hebraico.
- source_word: ἑκατὸν δέκα
  choice: cento e dez
  rationale: Tradução direta e idiomática do numeral grego.
