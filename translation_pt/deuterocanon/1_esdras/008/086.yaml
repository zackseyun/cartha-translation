base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/086.yaml
  text: Were you not angry with us[a], to destroy us, leaving no root or seed or name of ours?
translation:
  language: pt
  text: Não te iraste contra nós, a ponto de nos destruir, sem nos deixar raiz, semente nem nome?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «raiz, semente e nome». A tríade exprime a continuidade da linhagem e da identidade de um povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχὶ ὠργίσθης ἡμῖν
  choice: Não foi por teres ficado irado conosco
  rationale: Preserva a pergunta retórica introduzida por οὐχί e verte naturalmente o aoristo de ὀργίζω e o dativo ἡμῖν, sem intensificar indevidamente a ira divina.
- source_word: ἀπολέσαι ἡμᾶς
  choice: que nos destruíste
  rationale: Expressa o resultado ou propósito ligado à ira. A construção portuguesa integra naturalmente o infinitivo grego à pergunta retórica.
- source_word: ἕως τοῦ μὴ καταλιπεῖν
  choice: sem deixar
  rationale: Comunica o limite ou resultado extremo da destruição em português corrente, sem tornar excessivamente rígida a relação sintática possível no grego.
- source_word: ῥίζαν
  choice: raiz
  rationale: Mantém a imagem concreta do grego, que metaforicamente aponta para a continuidade de um povo ou linhagem.
- source_word: σπέρμα
  choice: descendência
  rationale: No contexto de sobrevivência coletiva e linhagem, 'descendência' comunica de modo claro o sentido figurado de 'semente' em português moderno.
- source_word: ὄνομα ἡμῶν
  choice: nome de nós / de nós ... nome
  rationale: No texto corrido, 'de nós' rege a tríade inteira; 'nome' preserva a ideia aberta de identidade, continuidade ou memória, sem reduzi-la a uma só interpretação.
theological_decisions:
- issue: Alcance da linguagem de destruição na oração penitencial
  choice: Manter a pergunta retórica sobre a ira de Deus levada ao ponto de não deixar raiz, descendência nem nome.
  alternative: Explicitar 'nenhum remanescente, descendente ou memória'.
  rationale: O grego apresenta a tríade concreta 'raiz, semente e nome'. Preservar essa linguagem deixa emergir a tensão da ameaça de destruição total sem inserir terminologia teológica interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem 'de nós raiz, descendência nem nome' é levemente solene e permite que o genitivo grego ἡμῶν se aplique à tríade inteira.
