revisions:
- from: Não foi por teres ficado irado conosco que nos destruíste, sem deixar de nós raiz, descendência nem nome?[a]
  to: Não te iraste contra nós, a ponto de nos destruir, sem nos deixar raiz, semente nem nome?[a]
