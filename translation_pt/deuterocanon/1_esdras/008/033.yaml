lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Dos filhos de
  rationale: Introduz um grupo familiar ou clã numa lista e preserva de modo natural a estrutura do grego.
- source_word: Λάμ
  choice: Lam
  rationale: Nome próprio transliterado do grego, sem harmonização com o paralelo hebraico aproximado.
- source_word: Ἐσίας
  choice: Esias
  rationale: Transliteração direta e legível do nome grego.
- source_word: Γοθολίου
  choice: filho de Gotolias
  rationale: O genitivo do nome é entendido como filiação segundo a fórmula genealógica da lista; explicitar “filho de” produz português claro.
- source_word: καὶ μετʼ αὐτοῦ
  choice: e com ele
  rationale: Tradução direta da expressão de acompanhamento.
- source_word: ἄνδρες ἑβδομήκοντα
  choice: setenta homens
  rationale: ἄνδρες designa homens neste contexto de recenseamento, e a ordem portuguesa soa natural.
