    text: 'O paralelo aproximado do texto massorético em Esdras 8:3 apresenta nomes e número diferentes: “dos filhos de Secanias, filho de Jaaziel [...] trezentos homens”. Como aqui 1 Esdras é traduzido do texto grego, o texto principal mantém os nomes gregos e o número setenta.'
