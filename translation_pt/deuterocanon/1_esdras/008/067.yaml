base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/067.yaml
  text: They took some of their daughters as wives for themselves and for their sons[a], and the holy seed was mixed with the foreign nations of the land[b]; and the leaders and the nobles shared in this lawlessness from the beginning of the matter.
translation:
  language: pt
  text: Tomaram algumas de suas filhas como esposas, para si e para seus filhos, e a semente santa[a] se misturou com as nações estrangeiras da terra; e os líderes e os nobres participaram dessa iniquidade[b] desde o início do assunto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a descendência santa” ou “a linhagem santa”. O grego diz literalmente “a semente santa”, uma metáfora pactual para o povo separado para Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “tomaram parte nessa transgressão”. O grego diz literalmente “dessa iniquidade” ou “dessa falta de lei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῴκισαν
  choice: tomaram ... como esposas
  rationale: O verbo pode indicar estabelecer vida em comum ou contrair casamento. Neste contexto, a formulação explicita naturalmente o sentido matrimonial sem reduzir o ato à mera coabitação.
- source_word: τινας τῶν θυγατέρων αὐτῶν
  choice: algumas das filhas deles
  rationale: Preserva a construção partitiva e deixa claro que o texto não se refere necessariamente a todas as filhas.
- source_word: καὶ αὐτοὶ καὶ οἱ υἱοὶ αὐτῶν
  choice: tanto para si mesmos como para seus filhos
  rationale: Explicita em português que os homens e seus filhos são os participantes dos casamentos, mantendo a coordenação enfática do grego.
- source_word: ἐπεμίγη
  choice: se misturou
  rationale: Mantém a metáfora de mistura empregada pelo texto, sem substituí-la por uma explicação interpretativa sobre casamento ou descendência.
- source_word: τὸ σπέρμα τὸ ἅγιον
  choice: a semente santa
  rationale: Tradução próxima do grego que preserva a metáfora pactual e sua tensão, em vez de defini-la como linhagem ou descendência.
- source_word: εἰς τὰ ἀλλογενῆ ἔθνη τῆς γῆς
  choice: com as nações estrangeiras da terra
  rationale: Com o verbo 'misturar-se', a preposição 'com' é idiomática em português. 'Estrangeiras' preserva a ideia de origem alheia, e 'da terra' mantém a referência local.
- source_word: μετεῖχον
  choice: participaram
  rationale: Expressa de modo natural e direto a ideia de tomar parte em algo.
- source_word: οἱ προηγούμενοι καὶ οἱ μεγιστᾶνες
  choice: os líderes e os nobres
  rationale: Distingue de maneira legível aqueles que exerciam liderança daqueles que possuíam elevada posição social.
- source_word: τῆς ἀνομίας ταύτης
  choice: dessa violação da Lei
  rationale: Comunica a força legal e pactual de ἀνομία com clareza maior, em português corrente, do que o abstrato 'ilegalidade'.
- source_word: ἀπὸ τῆς ἀρχῆς τοῦ πράγματος
  choice: desde o começo do caso
  rationale: Reproduz o sentido temporal e mantém πράγμα suficientemente amplo para designar a situação ou o assunto em questão.
theological_decisions:
- issue: Sentido de 'a semente santa' no contexto de casamentos com estrangeiras
  choice: Manter a expressão metafórica 'a semente santa'.
  alternative: a descendência santa; a linhagem santa
  rationale: O grego descreve a comunidade em termos pactuais, mas não explica a metáfora. Mantê-la evita impor uma definição étnica, genealógica ou sacramental além do texto.
- issue: Caracterização moral da conduta
  choice: Traduzir ἀνομία como 'violação da Lei'.
  alternative: iniquidade; transgressão; ilegalidade
  rationale: A expressão preserva a condenação explícita e a dimensão legal-pactual do termo, sem reduzir a ação a um erro moral vago.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível a leitores brasileiros e compreensível internacionalmente. Conserva-se a metáfora 'semente santa'; evita-se 'ilegalidade', que no uso atual pode soar meramente administrativa. Os marcadores foram colocados junto às expressões que as notas realmente explicam.
