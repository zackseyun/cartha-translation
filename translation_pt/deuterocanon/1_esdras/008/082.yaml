base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/082.yaml
  text: and do not take their daughters for your sons[a], and do not seek peace with them all your days, so that, having become strong, you may eat the good things of the land and inherit it
translation:
  language: pt
  text: e não tomem as filhas deles como esposas para os seus filhos, nem procurem viver em paz com eles em tempo algum[a], para que, tornando-se fortes, comam as coisas boas da terra e a recebam por herança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais ampla à luz do paralelo hebraico: “não procurem jamais a paz nem a prosperidade deles”.'
    reason: Leitura alternativa que preserva a possível nuance semítica de buscar o bem-estar ou a prosperidade deles.
lexical_decisions:
- source_word: λάβητε
  choice: tomem ... como esposas
  rationale: O verbo significa literalmente “tomar”, mas, neste contexto, refere-se claramente a tomar mulheres para os filhos em casamento. A explicitação produz português natural sem mudar o sentido.
- source_word: ζητήσετε
  choice: procurem
  rationale: Equivalente direto e corrente do verbo grego, preservando a ideia de empenhar-se em obter algo.
- source_word: εἰρηνεῦσαι τὰ πρὸς αὐτούς
  choice: viver em paz com eles
  rationale: Expressa em português natural a formulação grega comprimida sobre manter relações pacíficas com eles, sem incorporar no texto principal a nuance mais ampla do paralelo hebraico.
- source_word: τὸν ἅπαντα χρόνον
  choice: em tempo algum
  rationale: Reproduz a força abrangente da expressão, literalmente “durante todo o tempo”, como proibição contínua; evita sugerir uma afirmação metafísica sobre a eternidade.
- source_word: ἵνα ἰσχύσαντες
  choice: para que, tornando-se fortes
  rationale: Preserva tanto a finalidade introduzida por ἵνα quanto a sequência participial do grego.
- source_word: φάγητε τὰ ἀγαθὰ τῆς γῆς
  choice: comam as coisas boas da terra
  rationale: Mantém a imagem concreta de comer e a abrangência de ἀγαθά, que pode incluir produtos e prosperidade.
- source_word: κατακληρονομήσητε
  choice: a recebam por herança
  rationale: Conserva a linguagem de herança do verbo composto; o pronome feminino retoma naturalmente “a terra”, objeto implícito no grego.
theological_decisions:
- issue: Relação entre o texto grego de 1 Esdras e o paralelo hebraico de Esdras 9:12
  choice: Traduzir diretamente o grego no texto principal e registrar em nota a nuance mais ampla sugerida pelo paralelo hebraico.
  alternative: Traduzir no texto principal “não procurem a paz nem a prosperidade deles”.
  rationale: O grego é a fonte primária e fala de viver em paz com eles; o paralelo hebraico pode esclarecer o pano de fundo sem justificar uma expansão silenciosa do texto principal.
translation_notes:
  register: Português moderno, digno e acessível, com concordância no plural coerente com os destinatários. “Como esposas” esclarece o contexto matrimonial; “em tempo algum” comunica de modo natural a proibição abrangente.
