base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/003.yaml
  text: This Ezra went up from Babylon[a], being a skillful scribe in the law of Moses that had been given by the God of Israel,
translation:
  language: pt
  text: Este Esdras subiu da Babilônia, sendo um escriba hábil[a] na Lei de Moisés, que havia sido dada pelo Deus de Israel,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «apto» ou «competente»; o adjetivo grego pode indicar talento natural, inteligência ou competência adquirida.
    reason: Preserva a amplitude semântica de εὐφυής, que não especifica se a aptidão é inata ou desenvolvida.
lexical_decisions:
- source_word: ἀνέβη
  choice: subiu
  rationale: Conserva o idioma direcional convencional para a viagem da Babilônia a Jerusalém ou à terra de Israel e soa natural em português.
- source_word: γραμματεὺς
  choice: escriba
  rationale: É o termo consagrado e adequado para alguém versado nas Escrituras e na lei, sem reduzir a função à de secretário ou copista.
- source_word: εὐφυὴς
  choice: hábil
  rationale: Expressa aptidão e competência no exercício da função; a nota preserva outras nuances possíveis do adjetivo grego.
- source_word: νόμῳ
  choice: Lei
  rationale: Na expressão definida «Lei de Moisés», é a tradução mais direta e reconhecível; a inicial maiúscula sinaliza o corpo específico da instrução mosaica.
- source_word: ἐκδεδομένῳ
  choice: havia sido dada
  rationale: Reproduz naturalmente o particípio passivo e deixa explícito que a Lei procede de Deus, sem as conotações modernas de «publicada».
- source_word: θεοῦ τοῦ Ἰσραήλ
  choice: Deus de Israel
  rationale: Tradução direta e idiomática da identificação do Deus que deu a Lei.
theological_decisions:
- issue: Relação entre a qualificação de Esdras e a Lei de Moisés
  choice: «Era um escriba hábil na Lei de Moisés»
  alternative: «era um escriba bem instruído na Lei de Moisés»
  rationale: Mantém tanto a função de escriba quanto sua aptidão no âmbito da Lei, sem afirmar uma formação institucional que o grego não explicita.
- issue: Origem divina da Lei
  choice: «que havia sido dada pelo Deus de Israel»
  alternative: «que o Deus de Israel havia transmitido»
  rationale: Preserva a forma passiva e a afirmação explícita de que a Lei mosaica foi dada pelo Deus de Israel, sem acrescentar inferências doutrinárias.
- issue: Estrutura sintática do início do versículo
  choice: 'Dividir a oração em duas frases: «Este Esdras subiu da Babilônia. Era...»'
  alternative: «Este Esdras subiu da Babilônia, sendo...»
  rationale: A divisão torna o português mais natural e claro, sem alterar a relação circunstancial expressa pelo particípio grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Escriba» e «Lei de Moisés» preservam o vocabulário bíblico reconhecível. A vírgula final foi mantida porque o versículo continua sintaticamente no contexto imediato.
