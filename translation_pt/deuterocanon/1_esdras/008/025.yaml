base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/025.yaml
  text: Blessed be the Lord alone[a], who put these things into the heart of the king,
translation:
  language: pt
  text: Bendito seja somente o Senhor, que pôs estas coisas no coração do rei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego neste ponto é difícil e diz literalmente algo como “no coração de mim, do rei”. O sentido provável é que Deus pôs essa resolução no coração do rei.
    reason: textual_variant
lexical_decisions:
- source_word: εὐλογητὸς
  choice: Bendito seja
  rationale: O adjetivo predicativo tem valor de aclamação; em português, a fórmula de bênção pede naturalmente o verbo “seja”.
- source_word: μόνος
  choice: somente
  rationale: Preserva a ênfase exclusiva do grego sem decidir além do necessário se ela recai sobre quem é bendito ou sobre o Senhor como único agente.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Tradução corrente e digna do título divino κύριος nesta fórmula de louvor.
- source_word: ὁ δοὺς
  choice: que pôs
  rationale: Embora δίδωμι signifique literalmente “dar”, com εἰς τὴν καρδίαν exprime de modo idiomático a ação de colocar um propósito ou decisão no coração.
- source_word: ταῦτα
  choice: estas coisas
  rationale: Mantém o plural demonstrativo do texto grego e deixa aberto o alcance exato do referente.
- source_word: εἰς τὴν καρδίαν
  choice: no coração
  rationale: É a forma idiomática portuguesa de expressar a ideia de introduzir no íntimo uma disposição ou resolução.
- source_word: μου τοῦ βασιλέως
  choice: do rei
  rationale: A sequência grega transmitida é sintaticamente difícil. O contexto favorece que o coração seja o do rei; a tradução apresenta esse sentido provável e registra a dificuldade em nota.
theological_decisions:
- issue: Tradução de κύριος na fórmula de bênção
  choice: o Senhor
  alternative: Senhor
  rationale: Mantém o título divino tradicional sem acrescentar uma identificação teológica que o grego não explicita.
- issue: Tratamento da sequência difícil μου τοῦ βασιλέως
  choice: do rei
  alternative: de mim, do rei
  rationale: A tradução principal comunica o sentido contextual mais provável, enquanto a nota conserva a forma e a ambiguidade do texto grego transmitido.
translation_notes:
  register: Português moderno, claro e solene, com fórmula bíblica natural. A construção “Bendito seja somente o Senhor” conserva a ênfase de μόνος sem ampliar a interpretação; a dificuldade textual no fim do versículo é explicitada em nota.
