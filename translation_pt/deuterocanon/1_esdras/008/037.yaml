base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/037.yaml
  text: 'From the sons of Baer: Zechariah son of Bemaiah[a], and with him twenty-eight men.'
translation:
  language: pt
  text: 'Dos descendentes de Baer: Zacarias, filho de Bemai[a], e com ele vinte e oito homens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Os nomes gregos deste versículo diferem bastante dos encontrados no paralelo hebraico aproximado (Esdras 8:9), que diz: “dos descendentes de Joabe: Obadias, filho de Jeiel, e com ele duzentos e dezoito homens”. Como 1 Esdras é traduzido aqui a partir do testemunho grego, os nomes e o número do texto grego foram mantidos no texto principal.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν Βαήρ
  choice: Dos descendentes de Baer
  rationale: A expressão grega funciona, neste contexto de lista, como designação familiar ou de clã. “Descendentes” comunica esse sentido naturalmente sem depender do paralelo hebraico divergente.
- source_word: Ζαχαρίαι
  choice: Zacarias
  rationale: Forma portuguesa tradicional e reconhecível do nome grego.
- source_word: Βημαί
  choice: filho de Bemaías
  rationale: O nome isolado provavelmente desempenha função patronímica na lista. Explicita-se “filho de” para clareza, preservando o nome transmitido pelo texto grego; a nota registra a divergência do paralelo hebraico.
- source_word: καὶ μετʼ αὐτοῦ
  choice: e com ele
  rationale: Tradução direta e natural da expressão de acompanhamento.
- source_word: ἄνδρες εἴκοσι ὀκτώ
  choice: vinte e oito homens
  rationale: Neste registro, ἄνδρες designa pessoas do sexo masculino; “homens” preserva essa especificidade e soa natural em português.
