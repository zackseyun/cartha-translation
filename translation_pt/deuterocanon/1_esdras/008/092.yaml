base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/092.yaml
  text: Rise up and carry it through[a], for the matter is yours, and we are with you; be strong and act.
translation:
  language: pt
  text: Levante-se e leve isso até o fim, pois esse assunto é responsabilidade sua, e nós estamos com você; seja forte e aja[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega final é concisa e também pode ser entendida como “agir com firmeza” ou, à luz do paralelo hebraico de Esdras 10:4, “seja forte e faça isso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: Levante-se
  rationale: O particípio aoristo tem força imperativa e introduz uma exortação direta e vívida.
- source_word: ἐπίτελει
  choice: leve isso até o fim
  rationale: Expressa naturalmente a ordem de completar ou executar plenamente o que deve ser feito.
- source_word: πρὸς σὲ γὰρ τὸ πρᾶγμα
  choice: pois esse assunto é responsabilidade sua
  rationale: A construção idiomática indica que a questão compete ao destinatário; a formulação evita a possível leitura possessiva pouco clara de 'o assunto é seu'.
- source_word: ἡμεῖς μετὰ σοῦ
  choice: nós estamos com você
  rationale: Preserva de modo direto a afirmação de solidariedade e apoio.
- source_word: ἰσχὺν ποιεῖν
  choice: seja forte e aja
  rationale: A expressão grega é concisa e incomum; esta formulação oferece português natural e mantém tanto a ideia de força quanto a de ação, sem acrescentar objeto explícito.
