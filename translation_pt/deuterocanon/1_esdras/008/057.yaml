base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/057.yaml
  text: And he handed over to them[a], after weighing it out, six hundred fifty talents of silver, and silver vessels worth a hundred talents, and a hundred talents of gold, and twenty golden bowls[b], and ten vessels of fine gleaming bronze.
translation:
  language: pt
  text: E ele lhes entregou[a], depois de pesar, seiscentos e cinquenta talentos de prata, utensílios de prata no valor de cem talentos, cem talentos de ouro, vinte taças de ouro[b] e dez utensílios de bronze fino e reluzente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego aqui difere de modo significativo do paralelo hebraico de Esdras 8:27, que menciona dois utensílios de bronze fino e informa o valor das taças de ouro. Como 1 Esdras é traduzido aqui com base no testemunho grego, o texto principal segue o inventário grego.
    reason: textual_variant
  - marker: b
    text: Ou, possivelmente, “vinte objetos de ouro”. O termo grego é raro, mas o paralelo hebraico favorece entendê-lo como algum tipo de taça ou bacia.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέδωκεν
  choice: entregou
  rationale: Expressa de modo natural e direto a transferência dos bens aos encarregados, sem acrescentar a ideia mais específica de confiar.
- source_word: στήσας
  choice: depois de pesar
  rationale: No contexto de inventário e transferência de metais preciosos, o particípio indica mais provavelmente a pesagem prévia dos bens.
- source_word: τάλαντα ἀργυρίου ἑξακόσια πεντήκοντα
  choice: seiscentos e cinquenta talentos de prata
  rationale: Mantém a unidade antiga e a forma solene de inventário do texto grego.
- source_word: σκεύη ἀργυρᾶ ταλάντων ἑκατόν
  choice: utensílios de prata no valor de cem talentos
  rationale: Σκεύη é abrangente; 'utensílios' é natural em um inventário do templo. A construção indica plausivelmente o peso ou valor total de cem talentos.
- source_word: χρυσίου ταλάντων ἑκατόν
  choice: cem talentos de ouro
  rationale: Tradução direta que conserva a estrutura quantitativa do inventário.
- source_word: χρυσώματα
  choice: taças de ouro
  rationale: O termo grego é raro e pode designar objetos de ouro de maneira genérica, mas o paralelo hebraico favorece recipientes como taças ou bacias; a incerteza é registrada em nota.
- source_word: σκεύη χαλκᾶ ἀπὸ χαλκοῦ χρηστοῦ στίλβοντα
  choice: utensílios de bronze fino e reluzente
  rationale: Preserva o material, a qualidade e o brilho enfatizados pelo grego, evitando em português uma repetição pouco natural de 'bronze'.
- source_word: δέκα
  choice: dez
  rationale: Correspondência numérica direta.
