base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/064.yaml
  text: And they delivered the king’s decrees to the royal stewards and to the governors of Syria and Phoenicia[a], and they honored the nation and the sanctuary of the Lord.
translation:
  language: pt
  text: E entregaram os decretos do rei aos administradores reais e aos governadores da Síria e da Fenícia; e eles honraram[a] a nação e o santuário do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “glorificaram”. O verbo grego também pode ser traduzido mais literalmente dessa forma; aqui, provavelmente indica que concederam honra ou distinção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέδωκαν
  choice: entregaram
  rationale: No contexto administrativo, expressa a transmissão formal dos decretos às autoridades, em português natural.
- source_word: τὰ προστάγματα
  choice: os decretos
  rationale: O termo designa ordens oficiais; “decretos” preserva sua força governamental sem especificar excessivamente o gênero jurídico.
- source_word: τοῖς βασιλικοῖς οἰκονόμοις
  choice: aos administradores reais
  rationale: οἰκονόμοι pode designar gestores ou responsáveis administrativos. “Administradores reais” comunica claramente a função imperial, sem restringi-la a tesoureiros.
- source_word: τοῖς ἐπάρχοις
  choice: aos governadores
  rationale: Equivalente corrente e acessível para autoridades provinciais.
- source_word: ἐδόξασαν
  choice: honraram
  rationale: Com “a nação” e “o santuário” como objetos, o verbo indica concessão de honra ou distinção; “honraram” evita sugerir necessariamente culto, sem ocultar a alternativa mais literal na nota.
- source_word: τὸ ἔθνος
  choice: a nação
  rationale: Preserva o sentido coletivo e político do povo judeu como entidade nacional.
- source_word: τὸ ἱερὸν
  choice: o santuário
  rationale: Mantém a referência ao recinto sagrado sem limitar o termo ao edifício do templo.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: Traduz diretamente o grego κύριος na testemunha primária, sem retroverter para o nome divino hebraico.
theological_decisions:
- issue: Tradução de κύριος em um texto grego deuterocanônico
  choice: do Senhor
  alternative: do SENHOR
  rationale: A fonte primária grega traz κύριος; “Senhor” preserva essa forma sem presumir que represente explicitamente o tetragrama.
- issue: Sentido de ἐδόξασαν com objetos não divinos
  choice: eles honraram a nação e o santuário
  alternative: eles glorificaram a nação e o santuário
  rationale: “Honraram” comunica estima pública ou tratamento distinto e evita impor ao verbo uma conotação exclusivamente cultual; a nota conserva a possibilidade mais literal.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A formulação mantém o caráter administrativo da primeira oração e a possível tensão semântica de ἐδόξασαν por meio de nota.
