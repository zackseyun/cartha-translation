base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/081.yaml
  text: And now do not give your daughters in marriage to their sons,[a]
translation:
  language: pt
  text: E agora, não deem suas filhas em casamento aos filhos deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “não unam suas filhas aos filhos deles em casamento”.'
    reason: Registra de modo mais transparente o sentido causativo do verbo grego, cuja imagem básica é fazer duas pessoas viverem juntas como casal.
lexical_decisions:
- source_word: καὶ νῦν
  choice: E agora
  rationale: Preserva tanto a ligação com o discurso anterior quanto a transição temporal, sem tornar a relação explicitamente conclusiva.
- source_word: τὰς θυγατέρας ὑμῶν
  choice: suas filhas
  rationale: Equivalência direta e natural para o possessivo grego, mantendo a referência familiar e o gênero.
- source_word: μὴ συνοικίσητε
  choice: não deem ... em casamento
  rationale: O verbo συνοικίζω, neste contexto, significa fazer com que duas pessoas passem a viver juntas como marido e mulher, isto é, dar ou unir em casamento. A formulação escolhida é corrente e preserva a perspectiva dos pais ou da comunidade.
- source_word: τοῖς υἱοῖς αὐτῶν
  choice: aos filhos deles
  rationale: O dativo designa aqueles com quem as filhas seriam unidas; a construção portuguesa «dar em casamento a» reproduz naturalmente essa relação. «Deles» mantém a referência contextual aos outros povos.
theological_decisions:
- issue: Formulação da proibição de casamento
  choice: não deem suas filhas em casamento aos filhos deles
  alternative: não unam suas filhas em casamento aos filhos deles
  rationale: A escolha conserva a força social e jurídica da proibição no contexto da aliança, sem acrescentar uma explicação étnica ou doutrinária ausente deste segmento.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. «Deem» segue a ortografia vigente e dirige a ordem a um grupo, conforme o plural grego.
