base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/051.yaml
  text: to seek from him a prosperous journey for us and for our children and livestock[a].
translation:
  language: pt
  text: para pedir a ele uma viagem bem-sucedida para nós, nossos filhos e nossos animais de criação[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma boa viagem”, “bom êxito no caminho” ou “uma viagem segura”. O termo grego refere-se ao progresso favorável durante uma viagem; o contexto do paralelo hebraico também menciona auxílio contra inimigos no caminho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητῆσαι
  choice: pedir
  rationale: Neste contexto de súplica a Deus, o infinitivo pode significar buscar ou pedir; “pedir” expressa de modo natural a solicitação sem acrescentar a forma em que foi feita.
- source_word: παρʼ αὐτοῦ
  choice: a ele
  rationale: Com ζητῆσαι, παρά com o genitivo indica aquele a quem se dirige o pedido. “Pedir a ele” é claro e natural em português.
- source_word: εὐοδίαν
  choice: uma viagem bem-sucedida
  rationale: O substantivo denota êxito ou progresso favorável no caminho. A escolha conserva a dimensão de bom andamento da viagem sem reduzi-la apenas à segurança física.
- source_word: ἡμῖν τε καὶ τοῖς τέκνοις ἡμῶν καὶ κτήνεσιν
  choice: para nós, para os nossos filhos e para os nossos rebanhos
  rationale: τέκνα abrange filhos de ambos os sexos; κτήνη designa animais domésticos ou de criação. “Rebanhos” é corrente e adequado ao contexto de uma caravana.
theological_decisions:
- issue: Natureza do favor divino pedido para a viagem
  choice: uma viagem bem-sucedida
  alternative: uma viagem segura; bom êxito no caminho
  rationale: O grego enfatiza o progresso favorável da viagem, sem mencionar explicitamente proteção. O paralelo hebraico contextual fala de auxílio contra inimigos no caminho, mas essa ideia não deve ser inserida diretamente no texto grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “para” explicita naturalmente os três beneficiários e acompanha a estrutura coordenada do grego.
