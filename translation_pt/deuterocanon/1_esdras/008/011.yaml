  source_fidelity: 'O texto traduz adequadamente a estrutura e o sentido do grego: «todos os que têm isso em mente» preserva a ideia de intenção deliberada em ἐνθυμοῦνται; «partam juntos» reproduz corretamente o imperativo coletivo συνεξορμάσθωσαν; e «conforme foi decidido» expressa bem o perfeito impessoal administrativo δέδοκται. O pronome «isso» torna explícita em português a intenção contextual de participar da partida, sem alterar o sentido.'
