base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/011.yaml
  text: Therefore[a], let all who are so minded set out together, just as it has been decided by me and my seven friends who are counselors[b];
translation:
  language: pt
  text: Portanto[a], todos os que têm isso em mente partam juntos, conforme foi decidido por mim e pelos sete amigos que são conselheiros[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Assim, todos os que pretendem fazer isso partam juntos». O verbo grego pode significar «ter em mente» ou «pretender».'
    reason: lexical_alternative
  - marker: b
    text: A expressão «sete amigos que são conselheiros» pertence à linguagem da corte. «Amigos» pode designar uma categoria oficial na corte real, e não apenas companheiros pessoais.
    reason: cultural_note
lexical_decisions:
- source_word: ὅσοι οὖν
  choice: Portanto, todos os que
  rationale: Preserva o valor inclusivo plural de ὅσοι e a força inferencial ou continuativa de οὖν em português natural.
- source_word: ἐνθυμοῦνται
  choice: têm isso em mente
  rationale: Mantém a amplitude do verbo, que pode indicar ter em mente, cogitar ou pretender, sem reduzi-lo simplesmente a disposição ou vontade.
- source_word: συνεξορμάσθωσαν
  choice: partam juntos
  rationale: O imperativo comunica o início de uma viagem, enquanto «juntos» preserva a força associativa do prefixo συν-.
- source_word: καθάπερ δέδοκται
  choice: conforme foi decidido
  rationale: Expressa com clareza o sentido administrativo da construção impessoal, mantendo a conformidade indicada por καθάπερ.
- source_word: ἐμοί τε καὶ τοῖς ἑπτὰ φίλοις συμβουλευταῖς
  choice: por mim e pelos sete amigos que são conselheiros
  rationale: Reproduz os participantes da decisão sem inserir um possessivo ausente do grego; a formulação conserva tanto «amigos» quanto a função de conselheiros.
