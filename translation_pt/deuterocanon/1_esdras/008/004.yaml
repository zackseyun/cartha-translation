translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva o tom narrativo régio e explicita o referente de «dele» como «do rei». A principal ambiguidade de ἀξιώματα é preservada por nota, em vez de ser ocultada no texto.
