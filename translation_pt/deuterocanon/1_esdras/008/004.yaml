  yaml_path: translation/deuterocanon/1_esdras/008/004.yaml
  text: And the king gave him honor, because he had found favor before him in regard to all his offices.
translation:
  language: pt
  text: E o rei lhe concedeu honra[a], pois ele havia alcançado favor diante do rei em todos os seus pedidos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «glória» ou «distinção». Aqui o termo grego indica reconhecimento ou honra concedida por um rei.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega também pode ser entendida como «em relação a todas as suas dignidades» ou «a todos os seus cargos».
    reason: alternative_reading
lexical_decisions:
- source_word: ἔδωκεν αὐτῷ ... δόξαν
  choice: lhe concedeu honra
  rationale: A expressão significa literalmente que o rei «lhe deu honra/glória». Em contexto régio e humano, «concedeu honra» comunica de modo natural a distinção ou o reconhecimento público outorgado pelo rei.
- source_word: εὑρόντος χάριν
  choice: pois ele havia alcançado favor
  rationale: O genitivo absoluto apresenta a circunstância causal da ação do rei. «Alcançar favor» preserva o conhecido idioma bíblico sem confundir χάρις, neste contexto relacional, com uma formulação doutrinária sobre a graça.
- source_word: ἐναντίον αὐτοῦ
  choice: diante do rei
  rationale: O grego diz literalmente «diante dele». A repetição de «rei» elimina uma ambiguidade pronominal pouco natural em português e mantém o sentido de favor aos olhos do soberano.
- source_word: ἐπὶ πάντα τὰ ἀξιώματα αὐτοῦ
  choice: em todos os seus pedidos
  rationale: 'Ἀξίωμα pode designar pedido, pretensão, dignidade ou cargo. Com o favor concedido pelo rei, «pedidos» produz a relação contextual mais coerente: o rei lhe foi favorável em tudo o que solicitou. A ambiguidade lexical é registrada em nota.'
