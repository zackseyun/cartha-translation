base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/059.yaml
  text: Stay awake and guard them until you hand them over to the chiefs of the priests and the Levites and to the heads of the fathers’ houses of Israel in Jerusalem[b][a], in the chambers of the house of our Lord.
translation:
  language: pt
  text: Mantenham-se vigilantes[a] e guardem essas coisas até entregá-las aos chefes dos sacerdotes e dos levitas e aos líderes das casas paternas de Israel, em Jerusalém, nas câmaras[b] da casa do nosso Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Fiquem acordados”. Os dois verbos iniciais ressaltam a necessidade de custódia vigilante.'
    reason: lexical_alternative
  - marker: b
    text: “Câmaras” eram salas ou dependências do complexo do templo; o paralelo hebraico também traz “salas” ou “câmaras”.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: Mantenham-se vigilantes
  rationale: O verbo expressa vigília atenta, literalmente a ideia de não dormir. A formulação preserva o sentido concreto sem sugerir necessariamente uma única noite sem sono e combina naturalmente com a ordem seguinte.
- source_word: φυλάσσετε
  choice: guardem
  rationale: No contexto de bens sagrados confiados a alguém, indica custódia protetora, e não mera observação. O paralelo hebraico ושמרו confirma o sentido de guardar e proteger.
- source_word: ἕως τοῦ παραδοῦναι αὐτὰ ὑμᾶς
  choice: até entregá-las
  rationale: 'A construção indica o ponto final da custódia: a transferência dos objetos anteriormente mencionados. A forma pronominal é natural em português e não acrescenta uma identificação ausente do versículo.'
- source_word: φυλάρχοις
  choice: chefes
  rationale: O termo designa pessoas de autoridade. Aqui é qualificado por sacerdotes e levitas; por isso, “chefes” evita impor ao contexto o sentido mais específico de chefes tribais.
- source_word: ἡγουμένοις τῶν πατριῶν
  choice: líderes das casas paternas
  rationale: A expressão se refere aos responsáveis por unidades formais de parentesco ancestral. “Casas paternas” conserva essa estrutura social melhor do que o termo genérico “famílias”.
- source_word: παστοφορίοις
  choice: câmaras
  rationale: Designa dependências ou salas ligadas ao complexo do templo. O paralelo hebraico הלשכות também favorece “câmaras” ou “salas”, sem exigir a interpretação mais específica de depósitos ou tesouros.
- source_word: τοῦ οἴκου τοῦ κυρίου ἡμῶν
  choice: da casa do nosso Senhor
  rationale: Mantém o idioma cultual “casa” para o templo e preserva tanto o título κύριος quanto o possessivo explícito “nosso” do texto grego.
theological_decisions:
- issue: Terminologia do templo em τοῦ οἴκου τοῦ κυρίου ἡμῶν
  choice: da casa do nosso Senhor
  alternative: do templo do nosso Senhor; da casa do SENHOR
  rationale: O grego, fonte primária de 1 Esdras, diz literalmente “da casa do nosso Senhor”. O paralelo hebraico confirma a referência ao templo, mas não deve substituir o possessivo e o título presentes no grego.
- issue: Estrutura de parentesco em τῶν πατριῶν
  choice: casas paternas
  alternative: famílias; casas ancestrais
  rationale: A expressão denota uma estrutura ancestral formal, não apenas famílias em sentido amplo. A tradução conserva essa especificidade sem definir além do que o texto permite.
- issue: Relação sintática de φυλάρχοις com sacerdotes e levitas
  choice: chefes dos sacerdotes e dos levitas
  alternative: chefes dos sacerdotes, e aos levitas
  rationale: A coordenação dos dois genitivos sob o mesmo substantivo favorece entender que havia chefes tanto entre os sacerdotes quanto entre os levitas. A tradução segue essa leitura gramatical sem especificar funções ou cargos não declarados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais no plural. “Mantenham-se vigilantes” é corrente e conserva a força da ordem; “casas paternas” e “câmaras” mantêm termos históricos necessários, esclarecidos pelo contexto e pela nota.
