revisions:
- from: Quando chegou ali o terceiro dia, a prata e o ouro foram pesados e entregues, na casa do Senhor, a Marmoti, filho de Urias, o sacerdote. Com ele estava Eleazar, filho de Fineias; e com eles estavam os levitas Josabees, filho de Jesus, e Moet, filho de Sabano.[a] Tudo foi conferido por número e por peso, e o peso total foi registrado naquela mesma hora.
  to: Quando ali chegou o terceiro dia, a prata e o ouro foram pesados e entregues, na casa do Senhor, ao sacerdote Marmoti, filho de Urias. Com ele estava Eleazar, filho de Fineias; e com eles estavam os levitas Josabees, filho de Jesus, e Moet, filho de Sabano.[a] Tudo foi entregue segundo o número e o peso, e todo o peso foi registrado naquela mesma hora.
  rationale: 'A revisão elimina a nuance adicional de «conferido» e traduz πρὸς ἀριθμὸν καὶ ὁλκὴν πάντα como uma especificação da entrega: tudo foi entregue segundo número e peso. Pequenos ajustes de ordem e aposição melhoram a legibilidade sem alterar o sentido, os nomes gregos ou a ambiguidade textual relevante.'
