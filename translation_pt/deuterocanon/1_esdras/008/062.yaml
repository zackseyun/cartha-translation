base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/062.yaml
  text: And when the third day came there, the silver and the gold were weighed out and handed over in the house of the Lord to Marmothi son of Ourias the priest, and with him was Eleazar son of Phinehas; and with them were Josabees son of Jesous and Moeth son of Sabannus, the Levites, by number and by weight, all of it; and the whole weight was recorded at that very time.
translation:
  language: pt
  text: Quando ali chegou o terceiro dia, a prata e o ouro foram pesados e entregues, na casa do Senhor, ao sacerdote Marmoti, filho de Urias. Com ele estava Eleazar, filho de Fineias; e com eles estavam os levitas Josabees, filho de Jesus, e Moet, filho de Sabano.[a] Tudo foi entregue segundo o número e o peso, e todo o peso foi registrado naquela mesma hora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os nomes gregos neste versículo diferem dos encontrados na tradição paralela do Texto Massorético, que traz formas correspondentes a Meremote, filho de Urias; Eleazar, filho de Fineias; e os levitas Jônatas, filho de Jesua, e Noadias, filho de Binui. O texto principal segue o testemunho grego de 1 Esdras.
    reason: alternative_reading
lexical_decisions:
- source_word: γενομένης αὐτόθι ἡμέρας τρίτης
  choice: Quando chegou ali o terceiro dia
  rationale: Reproduz a circunstância temporal do genitivo absoluto e mantém αὐτόθι como indicação de lugar, em português narrativo natural.
- source_word: σταθὲν τὸ ἀργύριον καὶ τὸ χρυσίον παρεδόθη
  choice: a prata e o ouro foram pesados e entregues
  rationale: Mantém a sequência administrativa de pesagem e transferência formal sem acrescentar a nuance de distribuição.
- source_word: ἐν τῷ οἴκῳ Κυρίου
  choice: na casa do Senhor
  rationale: Conserva a expressão bíblica para o templo e verte κύριος pela forma tradicional e clara «Senhor».
- source_word: Μαρμωθὶ Οὐρείᾳ ἱερεῖ
  choice: a Marmoti, filho de Urias, o sacerdote
  rationale: Segue os nomes do testemunho grego e entende a sequência dativa como destinatário, patronímico e função, em concordância com o paralelo textual.
- source_word: πρὸς ἀριθμὸν καὶ ὁλκὴν πάντα
  choice: Tudo foi conferido por número e por peso
  rationale: Expressa a prestação de contas cuidadosa indicada pelo grego, preservando tanto a contagem quanto a pesagem.
- source_word: ἐγράφη πᾶσα ἡ ὁλκὴ αὐτῇ τῇ ὥρᾳ
  choice: o peso total foi registrado naquela mesma hora
  rationale: ἐγράφη indica registro escrito, πᾶσα ἡ ὁλκή o peso completo, e αὐτῇ τῇ ὥρᾳ enfatiza que o registro foi feito de imediato.
theological_decisions:
- issue: Tradução de κύριος na fórmula referente ao templo
  choice: Senhor
  alternative: SENHOR; Soberano
  rationale: «Casa do Senhor» é uma expressão bíblica reconhecível e não há motivo contextual para substituir o equivalente normal de κύριος.
- issue: Formas dos nomes próprios que divergem da tradição paralela do Texto Massorético
  choice: Transliterar no texto principal as formas gregas de 1 Esdras
  alternative: Normalizar para formas associadas ao paralelo massorético, como Meremote, Jônatas e Noadias
  rationale: O grego é a fonte primária deste livro; a nota registra a divergência sem apagar o testemunho traduzido.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A pontuação divide o longo período grego para facilitar a leitura sem alterar a sequência dos acontecimentos.
