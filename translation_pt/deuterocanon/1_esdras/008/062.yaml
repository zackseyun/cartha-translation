  source_fidelity: 'A tradução acompanha adequadamente o grego: mantém a referência ao terceiro dia naquele lugar, a pesagem e entrega da prata e do ouro, os destinatários e levitas nomeados, e o registro imediato do peso. Contudo, «Tudo foi conferido» introduz a ideia de verificação, que não é expressa por πρὸς ἀριθμὸν καὶ ὁλκὴν πάντα; o grego apresenta os bens como integralmente contabilizados por número e peso.'
