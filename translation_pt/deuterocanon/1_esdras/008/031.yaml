base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/031.yaml
  text: From the sons of Pahath-moab[a], Eliaonias son of Zareou, and with him two hundred men;
translation:
  language: pt
  text: Dos descendentes de Paat-Moabe, Elialonias, filho de Zareu,[a] e, com ele, duzentos homens;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “Elialonias, filho de Zareu”; o paralelo hebraico em Esdras 8:4 traz “Elioenai, filho de Zeraías”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τῶν Μααθμωάβ
  choice: Dos descendentes de Paat-Moabe
  rationale: Embora o grego apresente Μααθμωάβ como um nome de grupo, o paralelo hebraico identifica o clã como os filhos de Paate-Moabe. “Descendentes” comunica naturalmente a relação de linhagem, enquanto “Paat-Moabe” preserva de modo reconhecível o nome do clã.
- source_word: Ἐλιαλωνίας
  choice: Elialonias
  rationale: Transliteração baseada no testemunho grego primário, sem substituí-la silenciosamente pela forma diferente do paralelo hebraico.
- source_word: Ζαραιου
  choice: Zareu
  rationale: Forma portuguesa concisa baseada no nome grego em caso genitivo; a correspondência hebraica diferente é registrada em nota.
- source_word: καὶ μετʼ αὐτοῦ
  choice: e, com ele
  rationale: Reproduz diretamente a ideia de acompanhamento e mantém a estrutura enumerativa do versículo.
- source_word: ἄνδρες διακόσιοι
  choice: duzentos homens
  rationale: Tradução direta e natural do grego, apropriada ao contexto de uma lista de viajantes.
