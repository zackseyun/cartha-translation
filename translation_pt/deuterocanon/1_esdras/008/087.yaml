base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/087.yaml
  text: Lord of Israel, you are true; for we have been left as a root to this day.
translation:
  language: pt
  text: Senhor de Israel, tu és verdadeiro, pois fomos deixados como raiz até o dia de hoje.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε τοῦ Ἰσραήλ
  choice: Senhor de Israel
  rationale: Reproduz diretamente o vocativo grego e mantém a relação genitiva sem acrescentar um termo ausente.
- source_word: ἀληθινὸς
  choice: verdadeiro
  rationale: Preserva o sentido adjetival de autenticidade, fidelidade ou veracidade sem restringi-lo a apenas uma dessas nuances.
- source_word: κατελείφθημεν
  choice: fomos deixados
  rationale: Mantém a voz passiva e a ideia de sobrevivência ou preservação implícita no verbo.
- source_word: ῥίζα
  choice: raiz
  rationale: Traduz literalmente a metáfora grega, sem substituí-la interpretativamente por “remanescente”.
- source_word: ἐν τῇ σήμερον
  choice: até o dia de hoje
  rationale: Expressão portuguesa natural para o valor temporal do grego, indicando permanência até o presente.
theological_decisions:
- issue: Metáfora da sobrevivência do povo
  choice: raiz
  alternative: remanescente
  rationale: O texto grego diz explicitamente ῥίζα, “raiz”. A tradução mantém a imagem e não resolve sua possível relação com a teologia do remanescente.
- issue: Sentido de ἀληθινός aplicado ao Senhor
  choice: verdadeiro
  alternative: fiel
  rationale: “Verdadeiro” preserva a amplitude semântica do grego, enquanto “fiel” selecionaria apenas uma possível nuance contextual.
translation_notes:
  register: Português moderno, claro e digno, com tratamento direto por “tu” para conservar a forma singular do grego. A redação segue o testemunho grego fornecido; o paralelo massorético é aproximado e corresponde a material contextual diferente.
