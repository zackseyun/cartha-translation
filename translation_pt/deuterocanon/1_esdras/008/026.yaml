  source_fidelity: 'A tradução reproduz com precisão a estrutura e o sentido do grego: ἐτίμησεν por “honrou”, ἔναντι por “diante de”, o particípio plural τῶν βασιλευόντων por “dos que reinavam”, e as duas categorias finais, φίλων e μεγιστάνων, por “amigos” e “nobres”. Mantém-se apropriadamente o plural e não se importa o texto paralelo hebraico aproximado para alterar a leitura grega.'
  naturalness: “E ele me honrou diante dos que reinavam e de todos os seus amigos e nobres” é português moderno, claro e de registro bíblico sóbrio. A coordenação com “diante de ... e de ...” é natural e deixa claro que a honra ocorreu na presença de todos os grupos mencionados.
