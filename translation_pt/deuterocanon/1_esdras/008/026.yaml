base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/026.yaml
  text: and he honored me before the kings and all his friends and nobles[a][b].
translation:
  language: pt
  text: e ele me honrou diante dos que reinavam e de todos os seus amigos e nobres.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante dos reis”; o grego usa uma forma participial, literalmente “dos que reinavam”.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto régio, “amigos” pode designar associados ou cortesãos do rei, não necessariamente amigos pessoais íntimos.
    reason: cultural_note
lexical_decisions:
- source_word: ἐτίμησεν
  choice: honrou
  rationale: Traduz diretamente a ideia de conferir honra ou estima, sem introduzir recompensa material.
- source_word: ἔναντι
  choice: diante de
  rationale: Expressa de modo natural o cenário público ou a presença das autoridades perante as quais a honra foi demonstrada.
- source_word: τῶν βασιλευόντων
  choice: dos que reinavam
  rationale: Preserva a forma participial e o plural do grego, sem reduzi-los ao substantivo simples “reis”.
- source_word: φίλων
  choice: amigos
  rationale: Mantém o sentido básico do termo; no contexto régio, ele também pode designar associados da corte.
- source_word: μεγιστάνων
  choice: nobres
  rationale: Termo corrente que comunica a elevada posição social e política desses homens de destaque.
