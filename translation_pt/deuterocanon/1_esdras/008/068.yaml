base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/068.yaml
  text: And as soon as I heard these things[a], I tore my garments and the holy robe, and I pulled out hair from my head and beard[b], and I sat down stunned and deeply grieved.
translation:
  language: pt
  text: Assim que ouvi essas coisas, rasguei minhas roupas e a veste sagrada[a], arranquei cabelos da cabeça e da barba e me sentei, atônito[b] e profundamente entristecido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a roupa sagrada”; talvez uma veste oficial sacerdotal, embora o grego não o declare explicitamente.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “consternado” ou “perplexo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα τῷ ἀκοῦσαί με
  choice: Assim que ouvi
  rationale: A construção temporal indica que a reação ocorreu imediatamente; esta formulação é natural em português e preserva essa prontidão.
- source_word: ἔρρηξα τὰ ἱμάτια
  choice: rasguei minhas roupas
  rationale: O verbo descreve o ato de rasgar as vestes como expressão de luto; o possessivo, implícito no grego, é necessário para uma formulação natural em português.
- source_word: τὴν ἱερὰν ἐσθῆτα
  choice: a veste sagrada
  rationale: A expressão identifica a veste como sagrada, sem afirmar de modo mais específico que se tratava de uma veste sacerdotal.
- source_word: κατέτειλον τοῦ τριχώματος τῆς κεφαλῆς καὶ τοῦ πώγωνος
  choice: arranquei cabelos da cabeça e da barba
  rationale: 'Os genitivos admitem sentido partitivo: ele arrancou cabelos dessas regiões, não necessariamente todos. A formulação portuguesa mantém esse sentido e a força do gesto de aflição.'
- source_word: σύννους
  choice: atônito
  rationale: No contexto, o adjetivo comunica choque e consternação mental, não simples admiração; “atônito” preserva essa força sem excessiva explicação.
- source_word: περίλυπος
  choice: profundamente entristecido
  rationale: O termo expressa tristeza intensa; a escolha é clara, digna e corrente em português moderno.
theological_decisions:
- issue: Identificação de τὴν ἱερὰν ἐσθῆτα
  choice: a veste sagrada
  alternative: a veste sacerdotal
  rationale: O grego declara que a veste era sagrada, mas não explicita sua função ou um cargo sacerdotal. A tradução evita introduzir uma especificidade que o texto não exige.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. Os marcadores foram posicionados junto às expressões a que suas notas efetivamente se referem.
