base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/079.yaml
  text: And now what shall we say[a], Lord, having these things? They have transgressed your commandments[b], which you gave by the hand of your servants the prophets.
translation:
  language: pt
  text: E agora, que diremos, Senhor, tendo estas coisas[a]? Eles transgrediram os teus mandamentos, que deste pela mão de teus servos, os profetas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega é condensada e seu referente não é especificado; “estas coisas” provavelmente remete às dádivas ou circunstâncias mencionadas anteriormente na oração.
    reason: lexical_alternative
  - marker: b
    text: Ou, de modo mais idiomático, “por meio de teus servos, os profetas”. O grego diz literalmente “pela mão de”, expressão bíblica que indica transmissão por intermédio de alguém.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: E agora
  rationale: Preserva tanto a ligação expressa por καί quanto a transição do discurso, de maneira natural em português.
- source_word: τί ἐροῦμεν
  choice: que diremos
  rationale: O futuro mantém o tom retórico, solene e deliberativo da oração.
- source_word: Κύριε
  choice: Senhor
  rationale: Correspondência direta do vocativo κύριε, sem acrescentar uma interjeição ausente do grego.
- source_word: ἔχοντες αὐτά
  choice: tendo tudo isso
  rationale: Mantém a formulação condensada e o referente impreciso do pronome plural grego, ao mesmo tempo que produz uma frase compreensível em português.
- source_word: παρέβησαν
  choice: Eles transgrediram
  rationale: Preserva a terceira pessoa do plural e a força moral e jurídica do verbo, sem transformá-la numa confissão explícita em primeira pessoa.
- source_word: τὰ προστάγματά σου
  choice: os teus mandamentos
  rationale: Expressa com clareza as ordens ou determinações divinas neste contexto de aliança.
- source_word: ἃ ἔδωκας
  choice: que deste
  rationale: Tradução direta de δίδωμι; a expressão seguinte indica o meio pelo qual os mandamentos foram comunicados.
- source_word: ἐν χειρὶ
  choice: pela mão de
  rationale: Conserva a fórmula bíblica de mediação presente no grego, ainda inteligível no registro digno do português.
- source_word: τῶν παίδων σου τῶν προφητῶν
  choice: teus servos, os profetas
  rationale: Neste contexto de comissão profética, παῖδες significa 'servos'; a aposição identifica esses servos como os profetas.
theological_decisions:
- issue: Sujeito implícito de παρέβησαν
  choice: Eles transgrediram
  alternative: Nós transgredimos
  rationale: A forma verbal grega está na terceira pessoa do plural. Embora o orador se identifique com a comunidade no contexto da oração, o texto desta frase não usa a primeira pessoa.
- issue: Fórmula de mediação ἐν χειρὶ
  choice: pela mão de teus servos, os profetas
  alternative: por meio de teus servos, os profetas
  rationale: A opção escolhida preserva a imagem e o tom bíblico do original; a alternativa explicita idiomaticamente o mesmo sentido.
translation_notes:
  register: Português moderno, claro e digno, com leve textura bíblica. A construção deliberadamente mantém a imprecisão de “tudo isso” e conserva a terceira pessoa do plural no reconhecimento da transgressão.
