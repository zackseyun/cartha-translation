base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/056.yaml
  text: And with them[a], from among their brothers, ten men. And I weighed out to them the silver and the gold and the holy vessels of the house of our Lord[b], which the king and his counselors and the nobles and all Israel had given as a gift.
translation:
  language: pt
  text: E, com eles, dez homens dentre os seus irmãos.[a] Então pesei para eles[b] a prata, o ouro e os utensílios sagrados da casa de nosso Senhor, que o rei, os seus conselheiros, os nobres e todo o Israel haviam oferecido como dádiva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dez de seus irmãos”. O grego diz literalmente: “dentre os seus irmãos, dez homens”.'
    reason: lexical_alternative
  - marker: b
    text: 'O grego transmitido diz literalmente: “coloquei diante deles” ou “designei-lhes”; o paralelo hebraico traz “pesei para eles”, expressão que se ajusta ao contexto da entrega de prata, ouro e utensílios.'
    reason: textual_variant
lexical_decisions:
- source_word: μετʼ αὐτῶν ἐκ τῶν ἀδελφῶν αὐτῶν ἄνδρας δέκα
  choice: E, com eles, dez homens dentre os seus irmãos
  rationale: Preserva os elementos e a sequência essencial da construção grega, mas organiza a frase de modo natural em português. “Dentre os seus irmãos” mantém o sentido de seleção expresso por ἐκ sem especificar além do texto se eram parentes ou companheiros levitas.
- source_word: ἔστησα αὐτοῖς
  choice: pesei para eles
  rationale: Embora o grego transmitido signifique literalmente “coloquei diante deles” ou “designei-lhes”, o paralelo hebraico traz “pesei para eles”, ação coerente com a entrega formal de metais preciosos e utensílios. A tensão textual é registrada em nota.
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον
  choice: a prata, o ouro
  rationale: Os termos designam os metais preciosos em si, não genericamente dinheiro.
- source_word: τὰ ἱερὰ σκεύη
  choice: os utensílios sagrados
  rationale: “Utensílios” comunica de forma clara os objetos usados no serviço do templo, enquanto “sagrados” preserva a força cultual de ἱερά.
- source_word: τοῦ οἴκου τοῦ κυρίου ἡμῶν
  choice: da casa de nosso Senhor
  rationale: Mantém tanto a imagem tradicional do templo como “casa” quanto o pronome explícito “nosso” do grego.
- source_word: οὕτως ἐδωρήσατο
  choice: haviam oferecido como dádiva
  rationale: Expressa a doação anterior dos bens agora entregues e preserva o sentido de oferta voluntária do verbo δωρέομαι.
- source_word: οἱ σύμβουλοι αὐτοῦ καὶ οἱ μεγιστᾶνες
  choice: os seus conselheiros, os nobres
  rationale: “Conselheiros” designa os assessores reais; “nobres” transmite de modo corrente a elevada posição social de μεγιστᾶνες.
theological_decisions:
- issue: Tradução de κύριος na expressão referente ao templo
  choice: nosso Senhor
  alternative: o SENHOR; nosso Soberano
  rationale: O grego traz κυρίου ἡμῶν, literalmente “nosso Senhor”. Como o texto grego é a fonte primária e aqui não aparece diretamente o tetragrama hebraico, não se usa “SENHOR” em versaletes.
- issue: Divergência entre o grego ἔστησα e o paralelo hebraico “pesei”
  choice: pesei para eles
  alternative: coloquei diante deles; designei-lhes
  rationale: O paralelo hebraico e o contexto da entrega de prata, ouro e utensílios favorecem a ação de pesar formalmente os bens. A tradução adotada não oculta a leitura literal do grego, que é indicada em nota.
translation_notes:
  register: Português contemporâneo, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção abrupta inicial foi levemente reorganizada sem eliminar seu caráter enumerativo; evitou-se explicar “irmãos” como parentes ou levitas, preservando a ambiguidade do original.
