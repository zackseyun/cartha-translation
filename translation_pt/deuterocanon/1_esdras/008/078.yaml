base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/078.yaml
  text: but he has shown us favor before the kings of Persia[a], to give us sustenance and to glorify our sanctuary and to raise up desolate Zion, to give us a stronghold in Judea and Jerusalem.
translation:
  language: pt
  text: mas nos concedeu favor diante dos reis da Pérsia, dando-nos sustento, honrando o nosso santuário, reerguendo Sião desolada e dando-nos uma base segura[a] na Judeia e em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segurança”, “estabilidade” ou “fortaleza”.
    reason: O termo grego pode designar firmeza, apoio, segurança ou algo solidamente estabelecido.
lexical_decisions:
- source_word: ἐποίησεν ἡμᾶς ἐν χάριτι ἐνώπιον
  choice: nos concedeu favor diante de
  rationale: Expressa em português natural a ideia de fazer com que alguém desfrute de favor perante outros, sem atribuir o favor aos reis como fonte última.
- source_word: τῶν βασιλέων Περσῶν
  choice: dos reis da Pérsia
  rationale: Reprodução direta e historicamente clara da construção grega.
- source_word: δοῦναι ἡμῖν τροφήν
  choice: dando-nos sustento
  rationale: τροφή pode indicar alimento ou provisão; “sustento” preserva a concretude e também permite a noção mais ampla de provisão.
- source_word: δοξάσαι τὸ ἱερὸν ἡμῶν
  choice: honrando o nosso santuário
  rationale: Neste contexto, δοξάζω indica conferir honra ou esplendor, e ἱερόν designa o santuário; “honrando” evita a possível estranheza de “glorificando” um edifício.
- source_word: ἐγεῖραι τὴν ἔρημον Σειών
  choice: reerguendo Sião desolada
  rationale: “Reerguendo” conserva a imagem de ἐγείρω e comunica restauração sem restringi-la explicitamente à reconstrução física; “desolada” representa ἔρημος.
- source_word: στερέωμα
  choice: uma base segura
  rationale: O substantivo pode denotar firmeza, apoio, estabilidade ou algo solidamente estabelecido. “Base segura” preserva a imagem concreta sem impor o sentido militar de “fortaleza”.
- source_word: ἐν τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: na Judeia e em Jerusalém
  rationale: “Judeia” corresponde naturalmente à forma grega Ἰουδαία e ao contexto geográfico do período persa; a repetição da preposição torna a frase mais natural em português.
theological_decisions:
- issue: Sujeito implícito de ἐποίησεν
  choice: manter o sujeito implícito na forma verbal “concedeu”
  alternative: explicitar “ele nos concedeu” ou “Deus nos concedeu”
  rationale: O grego traz o sujeito apenas no contexto. O português permite preservá-lo implicitamente, evitando acrescentar ao versículo um nome que não aparece nesta oração.
- issue: Amplitude semântica de στερέωμα no contexto da restauração
  choice: uma base segura
  alternative: segurança; estabilidade; fortaleza
  rationale: A expressão comunica estabelecimento firme na Judeia e em Jerusalém, mas o termo não exige uma interpretação exclusivamente militar. A alternativa lexical é registrada em nota.
- issue: Forma do nome Σειών
  choice: Sião
  alternative: Sion
  rationale: “Sião” é a forma bíblica corrente e amplamente compreensível em português.
translation_notes:
  register: Português moderno, digno e de leitura corrente, com sintaxe participial que apresenta os infinitivos gregos como manifestações do favor concedido. O marcador [a] foi colocado junto à expressão que ele esclarece.
