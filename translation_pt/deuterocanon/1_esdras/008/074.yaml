base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/074.yaml
  text: And because of our sins and the sins of our fathers[a], we were handed over, together with our brothers, our kings, and our priests, to the kings of the earth, to the sword and captivity and plundering with shame[b], to this present day.
translation:
  language: pt
  text: E, por causa de nossos pecados e dos pecados de nossos pais, fomos entregues, juntamente com nossos irmãos, nossos reis e nossos sacerdotes, aos reis da terra[a], à espada, ao cativeiro e ao saque[b], com desonra, até o dia de hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos reis do país”. A palavra grega pode significar “terra” em sentido amplo ou “país/território”.
    reason: lexical_alternative
  - marker: b
    text: Ou “à pilhagem” ou “ao despojo”. O termo grego denota pilhagem ou despojo.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὰς ἁμαρτίας ἡμῶν καὶ τῶν πατέρων ἡμῶν
  choice: por causa de nossos pecados e dos pecados de nossos pais
  rationale: διά com o acusativo expressa causa. A formulação preserva explicitamente tanto a culpa da geração presente quanto a dos antepassados.
- source_word: παρεδόθημεν
  choice: fomos entregues
  rationale: O passivo de παραδίδωμι indica que o povo foi posto sob o poder de outros; “fomos entregues” conserva esse peso sem acrescentar um agente não expresso.
- source_word: σὺν τοῖς ἀδελφοῖς ἡμῶν
  choice: juntamente com nossos irmãos
  rationale: Mantém o sentido direto de ἀδελφοί e, no contexto do lamento nacional, permite também a referência aos compatriotas sem explicitar além do grego.
- source_word: σὺν τοῖς βασιλεῦσιν ἡμῶν καὶ σὺν τοῖς ἱερεῦσιν ἡμῶν
  choice: nossos reis e nossos sacerdotes
  rationale: Depois de “juntamente com”, a coordenação natural em português abrange os outros dois grupos sem precisar repetir a locução.
- source_word: τοῖς βασιλεῦσιν τῆς γῆς
  choice: aos reis da terra
  rationale: γῆ pode significar “terra” no sentido amplo ou “país/território”. O contexto de domínio estrangeiro favorece aqui a expressão bíblica mais abrangente, sem eliminar a alternativa lexical.
- source_word: εἰς ῥομφαίαν
  choice: à espada
  rationale: Preserva a imagem concreta e a fórmula de juízo que representa morte pela guerra ou execução.
- source_word: αἰχμαλωσίαν
  choice: ao cativeiro
  rationale: O termo designa a condição de quem é levado cativo; “cativeiro” é conciso e mantém o paralelismo da enumeração.
- source_word: προνομὴν
  choice: ao saque
  rationale: O substantivo denota pilhagem ou despojo. “Saque” é claro no português atual e funciona naturalmente na sequência de calamidades.
- source_word: μετὰ αἰσχύνης
  choice: com desonra
  rationale: αἰσχύνη comunica vergonha pública e humilhação. “Com desonra” preserva esse aspecto social e acompanha naturalmente “saque”.
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: até o dia de hoje
  rationale: Expressão portuguesa natural que mantém a continuidade da condição desde o juízo passado até o presente do orador.
theological_decisions:
- issue: Culpa coletiva entre gerações
  choice: Manter “nossos pecados e os pecados de nossos pais”.
  alternative: Generalizar como “os pecados do nosso povo” ou suavizar a referência aos antepassados.
  rationale: O grego atribui explicitamente a calamidade tanto aos pecados da comunidade presente quanto aos de seus pais. A tradução conserva essa solidariedade coletiva e a tensão teológica do texto.
translation_notes:
  register: Português moderno, claro e digno, com cadência bíblica moderada. A repetição de “nossos” preserva a ênfase comunitária do original. Os marcadores foram colocados junto aos termos efetivamente comentados pelas notas.
