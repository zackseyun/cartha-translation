base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/050.yaml
  text: And there I proclaimed a fast before our Lord for the young men[b][a],
translation:
  language: pt
  text: E ali fiz voto de um jejum diante de nosso Senhor pelos jovens.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: «E ali fiz voto de um jejum pelos jovens diante de nosso Senhor». O paralelo hebraico traz: «E ali proclamei um jejum [...] diante de nosso Deus».'
    reason: alternative_reading
  - marker: b
    text: 'O paralelo hebraico de Esdras 8:21 acrescenta detalhes ausentes desta linha grega: o jejum é proclamado junto ao rio Aava, para que se humilhassem diante de Deus e lhe pedissem um caminho reto para si, seus filhos e todos os seus bens.'
    reason: cross_reference
lexical_decisions:
- source_word: εὐξάμην
  choice: proclamei
  rationale: Embora εὔχομαι normalmente signifique «orar» ou «fazer um voto», o paralelo hebraico traz וָאֶקְרָא («proclamei/convoquei»), sentido que se ajusta melhor à expressão «proclamar um jejum». A divergência é preservada em nota.
- source_word: ἐκεῖ
  choice: ali
  rationale: Advérbio locativo simples e natural no fluxo narrativo.
- source_word: νηστείαν
  choice: um jejum
  rationale: Como objeto de «proclamei», esta é a formulação corrente e corresponde também ao hebraico צוֹם.
- source_word: τοῖς νεανίσκοις
  choice: pelos jovens
  rationale: Preserva o dativo grego e o elemento ausente no paralelo hebraico. «Jovens» é atual, claro e não acrescenta uma especificação masculina mais forte do que o contexto exige, embora νεανίσκοι possa significar «jovens homens».
- source_word: ἔναντι
  choice: diante de
  rationale: Equivalente idiomático de «perante/na presença de», com registro digno e corrente.
- source_word: κυρίου ἡμῶν
  choice: nosso Senhor
  rationale: Mantém o título divino do testemunho grego, apesar de o paralelo hebraico dizer «nosso Deus».
theological_decisions:
- issue: Divergência greco-hebraica no verbo principal
  choice: Traduzir εὐξάμην contextualmente por «proclamei»
  alternative: «orei» ou «fiz voto de»
  rationale: O grego isolado admite «orei» ou «fiz voto», mas a construção com «um jejum» é difícil; o paralelo hebraico explica coerentemente o sentido como proclamação de um jejum. A leitura mais literal do grego é indicada em nota.
- issue: Título divino
  choice: «nosso Senhor»
  alternative: «nosso Deus»
  rationale: κύριος ἡμῶν é a leitura da fonte grega primária; a variante do paralelo hebraico não deve substituí-la no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem «diante de nosso Senhor pelos jovens» acompanha de perto a sequência grega sem soar artificial. As notas registram a importante divergência entre o grego e o paralelo hebraico.
