base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/007.yaml
  text: For Apsaras had great learning[a], so as to leave out nothing from the law of the Lord and from the commandments[b], teaching all Israel the statutes and the judgments.
translation:
  language: pt
  text: Pois Apsaras[a] tinha vasto conhecimento, a ponto de não omitir nada da Lei do Senhor nem dos mandamentos, ensinando a todo o Israel os estatutos e os juízos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz o nome “Apsaras”. O contexto do paralelo hebraico corresponde a Esdras, mas aqui se mantém a forma do nome preservada no testemunho grego primário.
    reason: alternative_reading
  - marker: b
    text: 'A redação grega no final do versículo é comprimida e, em ordem aproximada, diz: “não omitir nada do que provém da Lei do Senhor e dos mandamentos, todo o Israel, estatutos e juízos”. A tradução explicita o sentido provável de que Apsaras ensinava essas disposições legais a todo o Israel.'
    reason: textual_variant
lexical_decisions:
- source_word: Ἀψάρας
  choice: Apsaras
  rationale: Translitera diretamente a forma do nome preservada no testemunho grego primário, sem harmonizá-la silenciosamente com Ezra no contexto hebraico paralelo.
- source_word: πολλὴν ἐπιστήμην περιεῖχεν
  choice: tinha vasto conhecimento
  rationale: Exprime de modo natural a ideia de possuir conhecimento ou saber em alto grau, mantendo o sentido de competência erudita.
- source_word: εἰς τὸ μηδὲν παραλείπειν
  choice: de modo a não omitir nada
  rationale: Conserva a força abrangente de μηδέν e deixa aberta a nuance de propósito ou resultado presente na construção grega.
- source_word: τῶν ἐκ τοῦ νόμου Κυρίου καὶ ἐκ τῶν ἐντολῶν
  choice: da Lei do Senhor nem dos mandamentos
  rationale: Mantém as duas fontes legais coordenadas; em português, 'nada... nem...' reproduz naturalmente a abrangência negativa, embora não repita a preposição grega de forma mecânica.
- source_word: πάντα τὸν Ἰσραήλ
  choice: a todo o Israel
  rationale: Preserva a expressão coletiva tradicional e funciona como complemento da ideia de ensino explicitada para tornar compreensível a sintaxe comprimida.
- source_word: δικαιώματα καὶ κρίματα
  choice: os estatutos e os juízos
  rationale: Emprega termos jurídicos bíblicos reconhecíveis, mantendo a distinção formal entre prescrições estabelecidas e decisões ou juízos legais.
theological_decisions:
- issue: Sintaxe grega comprimida no fim do versículo
  choice: Entender os termos legais finais como aquilo que Apsaras ensinava a todo o Israel, explicitando 'ensinando'.
  alternative: 'Traduzir de forma estritamente linear e obscura, sem verbo expresso: ''... dos mandamentos, todo o Israel, estatutos e juízos''.'
  rationale: O grego transmitido reúne acusativos e termos legais sem um nexo verbal plenamente expresso. A explicitação produz português coerente e segue o provável sentido instrutivo, enquanto a nota preserva a incerteza textual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário jurídico-bíblico reconhecível. Evitou-se harmonizar o nome com o paralelo hebraico e a ambiguidade da sintaxe final foi registrada em nota.
