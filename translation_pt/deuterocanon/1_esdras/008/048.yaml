  text: from the sons of Hanunai and their sons[a], twenty men;
translation:
  language: pt
  text: dos filhos de Hanunai e dos filhos deles[a], vinte homens;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego preservado diz: «dos filhos de Hanunai e dos filhos deles, vinte homens». O paralelo hebraico aproximado em Esdras 8:19 — a numeração de Esdras–Neemias varia conforme a tradição — menciona, em vez disso, Hasabias e Jesaías, dos filhos de Merari, com os irmãos dele e os filhos deles, num total de vinte.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἐκ τῶν υἱῶν Χανουναίου
  choice: dos filhos de Hanunai
  rationale: A construção οἱ ἐκ com genitivo identifica pessoas provenientes de um grupo familiar. A formulação concisa preserva o sentido genealógico, e o nome próprio é transliterado.
- source_word: οἱ υἱοὶ αὐτῶν
  choice: e dos filhos deles
  rationale: O pronome αὐτῶν está no plural; «deles» preserva diretamente essa referência sem harmonizar o grego com o paralelo hebraico aproximado.
- source_word: εἴκοσι ἄνδρες
  choice: vinte homens
  rationale: ἄνδρες designa homens em uma contagem de pessoas do sexo masculino e se ajusta ao caráter enumerativo da passagem.
theological_decisions:
- issue: Divergência entre o grego e o Texto Massorético na lista de pessoas
  choice: 'Seguir no texto principal a designação familiar grega: «dos filhos de Hanunai e dos filhos deles, vinte homens».'
  alternative: O paralelo hebraico aproximado menciona Hasabias e Jesaías, dos filhos de Merari, com irmãos e filhos, num total de vinte.
  rationale: O texto grego é a fonte primária de 1 Esdras e apresenta aqui uma identificação substancialmente diferente. A leitura hebraica não deve ser usada para harmonizar silenciosamente o texto, mas sua divergência relevante é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura breve própria de uma lista genealógica. «Filhos deles» mantém a referência plural do grego, apesar de soar ligeiramente marcada, pois a ambiguidade textual não deve ser eliminada.
