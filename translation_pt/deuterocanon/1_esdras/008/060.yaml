base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/060.yaml
  text: And the priests and the Levites who had received the silver and the gold and the vessels brought them to Jerusalem, into the temple of the Lord.
translation:
  language: pt
  text: E os sacerdotes e os levitas que receberam a prata, o ouro e os utensílios que estavam em Jerusalém os levaram para o templo do Senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo hebraico diz: “para levá-los a Jerusalém, à casa do nosso Deus”. O grego de 1 Esdras, porém, fala dos “utensílios que estavam em Jerusalém” e diz que eles foram levados “para o templo do Senhor”.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραλαβόντες
  choice: que receberam
  rationale: O particípio aoristo indica que os sacerdotes e os levitas primeiro receberam os bens confiados e depois os levaram; “que receberam” expressa essa sequência com naturalidade.
- source_word: οἱ ἱερεῖς καὶ οἱ Λευεῖται
  choice: os sacerdotes e os levitas
  rationale: Mantém os dois grupos reconhecidos de servidores do templo, conforme a coordenação e os artigos do grego.
- source_word: τὸ ἀργύριον καὶ τὸ χρυσίον
  choice: a prata, o ouro
  rationale: O grego designa diretamente os metais; esta escolha evita interpretar a prata especificamente como dinheiro.
- source_word: τὰ σκεύη τὰ ἐν Ἰερουσαλήμ
  choice: os utensílios que estavam em Jerusalém
  rationale: 'A repetição do artigo em τὰ σκεύη τὰ ἐν Ἰερουσαλήμ torna a expressão preposicional atributiva: ela qualifica os utensílios. Assim, o grego não diz aqui que eles foram levados “a Jerusalém”, mas que os utensílios situados em Jerusalém foram levados ao templo.'
- source_word: ἤνεγκαν
  choice: os levaram
  rationale: Traduz naturalmente o verbo de transporte e explicita por meio do pronome o objeto composto já mencionado, sem acrescentar conteúdo.
- source_word: εἰς τὸ ἱερὸν τοῦ κυρίου
  choice: para o templo do Senhor
  rationale: ἱερόν designa o templo ou seu recinto sagrado; “templo” é claro e corrente. A preposição εἰς marca o destino, e κυρίου é vertido pelo título tradicional “Senhor”.
theological_decisions:
- issue: Título divino κυρίου
  choice: Senhor
  alternative: nosso Deus
  rationale: O texto grego primário traz “templo do Senhor”; o paralelo hebraico traz “casa do nosso Deus”. A tradução principal segue o grego, e a diferença é preservada em nota.
- issue: Relação de Jerusalém com os utensílios
  choice: utensílios que estavam em Jerusalém
  alternative: levá-los a Jerusalém
  rationale: No grego, ἐν Ἰερουσαλήμ integra a construção atributiva τὰ σκεύη τὰ ἐν Ἰερουσαλήμ e qualifica “utensílios”. O paralelo hebraico apresenta outra construção, com Jerusalém como destino, que não deve substituir silenciosamente a sintaxe do testemunho grego.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Utensílios” comunica objetos de uso templário de modo mais corrente que “vasos”, sem restringi-los a recipientes. A ordem foi ajustada para soar natural em português, preservando a construção atributiva decisiva do grego.
