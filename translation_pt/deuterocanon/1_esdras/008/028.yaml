base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/028.yaml
  text: And these are the leaders according to their fathers’ houses and their divisions[b][a], who went up with me from Babylon in the reign of Artaxerxes the king.
translation:
  language: pt
  text: E estes são os líderes[a], segundo suas casas paternas e suas divisões[b], que subiram comigo da Babilônia durante o reinado do rei Artaxerxes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os chefes”. O grego pode indicar aqueles que estavam à frente, e o paralelo hebraico favorece o sentido de chefes de clãs ou de casas paternas.'
    reason: lexical_alternative
  - marker: b
    text: O grego traz “suas divisões”; o paralelo hebraico emprega uma expressão genealógica, que pode ser entendida como “seu registro genealógico” ou “sua linhagem”. A tradução segue o grego, testemunho primário de 1 Esdras.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ προηγούμενοι
  choice: os líderes
  rationale: No contexto de uma lista organizada por casas paternas, designa os que estavam à frente. A expressão é natural em português e não especifica um cargo além do que o grego permite.
- source_word: κατὰ τὰς πατριὰς αὐτῶν
  choice: segundo suas casas paternas
  rationale: πατριά indica o agrupamento de parentesco ou clã ligado à linhagem paterna; “casas paternas” preserva esse sentido técnico bíblico.
- source_word: καὶ τὰς μεριδαρχίας
  choice: e suas divisões
  rationale: A tradução conserva a ideia grega de subdivisões ou agrupamentos organizados, sem substituí-la pela leitura genealógica do paralelo hebraico.
- source_word: οἱ ἀναβάντες μετʼ ἐμοῦ ἐκ Βαβυλῶνος
  choice: que subiram comigo da Babilônia
  rationale: “Subiram” preserva o modo bíblico e geográfico de descrever a viagem da Babilônia para Jerusalém.
- source_word: ἐν τῇ βασιλείᾳ Ἀρταξέρξου τοῦ βασιλέως
  choice: durante o reinado do rei Artaxerxes
  rationale: Neste contexto temporal, βασιλεία significa naturalmente “reinado”; a formulação portuguesa mantém também o título explícito do soberano.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Mantêm-se os termos bíblicos “casas paternas” e “subiram” por sua precisão contextual, enquanto “durante o reinado” evita uma reprodução pouco natural do idioma grego.
