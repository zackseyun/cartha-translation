base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/045.yaml
  text: And I told them to go to Laddaeus[a], the leader at the place of the treasury[b],
translation:
  language: pt
  text: E eu lhes disse que fossem até Ladáio[a], o líder no local da tesouraria[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego menciona aqui somente Ladáio, enquanto o paralelo hebraico de Esdras 8:16 apresenta vários homens enviados. Neste ponto, 1 Esdras parece condensar ou reformular o relato paralelo.
    reason: alternative_reading
  - marker: b
    text: Ou «o líder no lugar da tesouraria» ou «o encarregado da tesouraria». A formulação grega é compacta e permite mais de uma interpretação da frase final.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπα ... ἐλθεῖν
  choice: disse que fossem
  rationale: O infinitivo ἐλθεῖν depende de εἶπα e expressa uma ordem. Em português, «disse que fossem» transmite naturalmente essa construção sem intensificá-la como «ordenei».
- source_word: ἐλθεῖν πρὸς
  choice: fossem até
  rationale: Embora ἔρχομαι possa significar «vir», o movimento dos destinatários em direção a outra pessoa é expresso naturalmente por «ir até» neste relato.
- source_word: Λαδδαῖον
  choice: Ladáio
  rationale: Transliteração portuguesa do nome grego Λαδδαῖος, com acento gráfico para indicar a pronúncia.
- source_word: τὸν ἡγούμενον
  choice: o líder
  rationale: O particípio substantivado designa quem lidera ou está encarregado. «Líder» preserva a amplitude do termo sem pressupor um cargo governamental específico.
- source_word: τὸν ἐν τῷ τόπῳ γαζοφυλακίου
  choice: no lugar do tesouro
  rationale: Mantém a formulação compacta e um tanto ambígua do grego, que pode indicar a localização do líder ou sua esfera de responsabilidade.
- source_word: γαζοφυλακίου
  choice: tesouro
  rationale: O termo pode designar um tesouro, uma tesouraria ou a câmara onde bens valiosos eram guardados. «Tesouro» é conciso e preserva a ambiguidade institucional e espacial.
