base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/084.yaml
  text: And everything that happens to us comes because of our evil deeds and our great sins[a].
translation:
  language: pt
  text: E tudo o que nos acontece se deve às nossas más ações e aos nossos grandes pecados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E tudo o que nos sobrevém se deve às nossas más ações e aos nossos grandes pecados.”'
    reason: Alternativa lexical mais formal para “tudo o que nos acontece”, preservando a noção de eventos que sobrevêm (συμβαίνοντα) e sua causa (γίνεται διὰ).
lexical_decisions:
- source_word: τὰ συμβαίνοντα πάντα ἡμῖν
  choice: tudo o que nos acontece
  rationale: Expressa de modo natural o conjunto abrangente dos acontecimentos que sobrevêm ao povo, preservando a força de πάντα e o valor do dativo ἡμῖν.
- source_word: γίνεται
  choice: vem
  rationale: Evita a repetição de “acontece” e conserva a ideia de que aquilo que ocorre tem origem na causa indicada em seguida.
- source_word: διὰ
  choice: por causa de
  rationale: Com o acusativo, διά indica causa; esta formulação mantém explícita a atribuição causal do grego.
- source_word: τὰ ἔργα ἡμῶν τὰ πονηρά
  choice: nossas más ações
  rationale: “Ações” comunica em português corrente o sentido ético de ἔργα, enquanto “más” preserva a qualificação moral de πονηρά sem arcaísmo desnecessário.
- source_word: τὰς μεγάλας ἁμαρτίας
  choice: nossos grandes pecados
  rationale: Mantém o sentido direto de μεγάλας, que ressalta a magnitude ou gravidade dos pecados. O possessivo, embora elíptico no segundo membro grego, é naturalmente compartilhado na coordenação e esclarece o referente em português.
theological_decisions:
- issue: Atribuição causal do sofrimento coletivo
  choice: O que acontece ao povo vem por causa de suas más ações e de seus grandes pecados.
  alternative: Atenuar a relação causal, apresentando os pecados apenas como circunstância associada.
  rationale: O uso de διά com acusativo estabelece causa de maneira explícita. A tradução preserva a confissão de culpa do texto sem transformá-la numa afirmação universal sobre todo sofrimento.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Más ações” é mais corrente que “obras perversas”, enquanto “grandes pecados” preserva deliberadamente a formulação forte e pouco interpretativa do grego.
