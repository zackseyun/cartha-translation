base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/085.yaml
  text: For you, Lord, who have lightened our sins, have given us such a root; yet we have turned back to transgress your law by mingling with the uncleanness of the nations of the land.
translation:
  language: pt
  text: Pois tu, Senhor, que aliviaste os nossos pecados, nos deste tal raiz; contudo, voltamos a transgredir a tua lei, misturando-nos com a impureza das nações da terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κουφίσας
  choice: aliviaste
  rationale: O particípio aoristo indica que o Senhor tornou mais leve o peso ou as consequências dos pecados; “aliviaste” preserva a imagem sem explicá-la em excesso.
- source_word: ῥίζαν
  choice: raiz
  rationale: Tradução direta de ῥίζα, mantendo a metáfora textual e sua possível referência à continuidade ou renovação do povo, sem substituí-la interpretativamente por “remanescente”.
- source_word: πάλιν ἀνεκάμψαμεν
  choice: contudo, voltamos
  rationale: Exprime a recaída indicada por πάλιν e pelo verbo ἀνακάμπτω; “contudo” torna natural em português o contraste com a ação graciosa anterior de Deus.
- source_word: ἐπιμιγῆναι
  choice: misturando-nos
  rationale: Comunica a ideia de entrar em mistura ou associação com outros povos; o contexto imediato define essa mistura como transgressão, sem exigir que a tradução especifique além do grego sua forma exata.
- source_word: τῇ ἀκαθαρσίᾳ τῶν ἐθνῶν τῆς γῆς
  choice: com a impureza das nações desta terra
  rationale: Preserva a construção grega que relaciona a mistura à impureza das nações, e usa “desta terra” para uma expressão portuguesa natural de τῆς γῆς no contexto.
theological_decisions:
- issue: Sentido metafórico de “raiz”
  choice: Manter “raiz” no texto
  alternative: “remanescente” ou “descendência”
  rationale: O grego diz explicitamente ῥίζαν. Traduzir por uma interpretação específica eliminaria a imagem e resolveria indevidamente sua amplitude teológica.
- issue: Natureza do alívio dos pecados
  choice: “aliviaste os nossos pecados”
  alternative: “perdoaste os nossos pecados” ou “reduziste o castigo por nossos pecados”
  rationale: κουφίζω significa tornar leve ou aliviar; o texto não especifica plenamente se o foco é culpa, carga ou consequência. A formulação escolhida conserva essa tensão.
- issue: Mistura com as nações
  choice: Reproduzir a avaliação cultual/moral do texto como “impureza das nações”
  alternative: Reformular como condenação étnica explícita ou limitar a casamentos mistos
  rationale: A tradução deve refletir a linguagem histórica do texto sem ampliar sua afirmação nem importar uma aplicação denominacional ou racial moderna.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem foi levemente ajustada para fluência, mas as metáforas centrais e a ambiguidade do grego foram preservadas.
