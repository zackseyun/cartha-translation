base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/032.yaml
  text: 'From the sons of Zathoes: Eiechonias son of Jethel[a], and with him two hundred men; from the sons of Adin: Obeth son of Jonathan[b], and with him two hundred fifty men.'
translation:
  language: pt
  text: 'Dos filhos de Zatoés: Eieconias, filho de Jetel[a], e com ele duzentos homens; dos filhos de Adin: Uben, filho de Jônatas[b], e com ele duzentos e cinquenta homens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome familiar Zatoés segue a forma grega do testemunho principal de 1 Esdras; o paralelo aproximado do Texto Massorético apresenta outra forma.
    reason: alternative_reading
  - marker: b
    text: A forma do nome Uben é incerta no grego (Οὐβὴν); também poderia ser transliterada como Oben.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τῶν υἱῶν
  choice: Dos filhos de
  rationale: Mantém a fórmula genealógica repetida da lista e indica pessoas procedentes de um grupo familiar.
- source_word: Ζαθόης
  choice: Zatoés
  rationale: Translitera a forma grega do testemunho primário, com acentuação natural em português, sem substituí-la pela forma diferente do paralelo massorético aproximado.
- source_word: Εἰεχονίας
  choice: Eieconias
  rationale: Reproduz de perto a grafia grega transmitida, adaptando-a de modo legível ao português.
- source_word: Ἰεθήλου
  choice: filho de Jetel
  rationale: O genitivo indica aqui uma relação patronímica; explicitar 'filho de' torna a estrutura da lista clara em português.
- source_word: μετʼ αὐτοῦ
  choice: e com ele
  rationale: Preserva diretamente a fórmula censitária e a coordenação do grego.
- source_word: ἄνδρες
  choice: homens
  rationale: Conserva a especificidade masculina do termo grego, em vez de generalizá-lo como 'pessoas'.
- source_word: διακόσιοι
  choice: duzentos
  rationale: Tradução direta do numeral cardinal.
- source_word: Ἀδείν
  choice: Adim
  rationale: Forma portuguesa legível baseada no nome grego, com consoante final adaptada ao uso bíblico lusófono.
- source_word: Οὐβὴν
  choice: Uben
  rationale: Transliteração cautelosa da forma grega incerta Οὐβὴν, sem introduzir a consoante final de 'Obeth', que não é transparente no texto grego.
- source_word: Ἰωνάθου
  choice: filho de Jônatas
  rationale: Explicita a relação patronímica indicada pelo genitivo e usa uma forma portuguesa reconhecível do nome.
- source_word: διακόσιοι πεντήκοντα
  choice: duzentos e cinquenta
  rationale: Tradução direta e idiomática do numeral em português.
