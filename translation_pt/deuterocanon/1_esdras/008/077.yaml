  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/077.yaml
  text: from our Lord,[a]
translation:
  language: pt
  text: da parte do nosso Senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A fonte grega fornecida para este versículo contém somente o fragmento «ὑπὸ τοῦ κυρίου ἡμῶν» (“da parte de nosso Senhor” ou “por nosso Senhor”). O texto hebraico paralelo apresentado não corresponde diretamente a essa expressão; por isso, não se reconstruiu aqui uma frase mais completa.
    reason: textual_variant
lexical_decisions:
- source_word: ὑπό
  choice: da parte de
  rationale: Com o genitivo, ὑπό normalmente indica agente, mas, neste fragmento isolado, “da parte de” expressa de modo natural uma relação de procedência ou agência sem impor uma construção passiva inexistente no trecho fornecido.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: κύριος é traduzido pelo equivalente corrente e digno “Senhor”; o artigo grego integra-se à contração portuguesa “do”.
- source_word: ἡμῶν
  choice: nosso
  rationale: Mantém explicitamente o possessivo da primeira pessoa do plural e concorda com “Senhor”.
theological_decisions:
- issue: Tradução de κύριος
  choice: Senhor
  alternative: senhor; mestre
  rationale: “Senhor” é o equivalente natural neste provável contexto religioso e não exige uma interpretação denominacional específica.
- issue: Incompatibilidade entre as testemunhas e caráter fragmentário da fonte
  choice: Traduzir somente a expressão grega preservada
  alternative: Reconstruir uma frase mais extensa com base no paralelo hebraico
  rationale: O grego fornecido contém apenas ὑπὸ τοῦ κυρίου ἡμῶν, enquanto o paralelo hebraico não corresponde diretamente à expressão. Acrescentar o conteúdo hebraico produziria uma reconstrução sem apoio no texto grego apresentado.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A locução “da parte de” é mais idiomática como fragmento independente do que o literal “por”, embora a agência permaneça uma possibilidade real e seja registrada na nota.
