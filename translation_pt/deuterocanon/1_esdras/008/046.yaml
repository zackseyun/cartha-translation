base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/046.yaml
  text: having commanded them to speak with Lodaios and his brothers and the treasurers in that place[a], to send us those who would serve as priests in the house of our Lord[d][c][b],
translation:
  language: pt
  text: tendo-lhes ordenado que falassem com Lodaios, com os irmãos dele e com os tesoureiros daquele lugar[a], para que nos enviassem os que serviriam como sacerdotes na casa de nosso Senhor[b][c][d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “Lodaios”; o paralelo hebraico em Esdras 8:17 traz “Ido”.
    reason: alternative_reading
  - marker: b
    text: O grego traz “nosso Senhor”; o paralelo hebraico diz “nosso Deus”.
    reason: alternative_reading
  - marker: c
    text: O grego diz “nos enviassem”; o paralelo hebraico traz “trouxessem para nós”.
    reason: alternative_reading
  - marker: d
    text: O grego especifica “os que serviriam como sacerdotes”; o paralelo hebraico traz, de modo mais amplo, “servidores” ou “ministros”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντειλάμενος
  choice: tendo-lhes ordenado
  rationale: Preserva a forma participial e a força diretiva do grego, além de manter a ligação sintática com o contexto anterior.
- source_word: διαλεχθῆναι
  choice: que falassem com
  rationale: Expressa de modo natural o ato de falar ou conversar com as pessoas indicadas.
- source_word: Λοδαίῳ
  choice: Lodaios
  rationale: Translitera o nome do texto grego primário, sem harmonizá-lo com Ido no paralelo hebraico.
- source_word: τοῖς ἀδελφοῖς αὐτοῦ
  choice: com os irmãos dele
  rationale: Mantém o sentido comum de ἀδελφοί e deixa claro que se trata dos irmãos de Lodaios.
- source_word: γαζοφύλαξιν
  choice: tesoureiros
  rationale: Termo conciso e corrente para os responsáveis pelo tesouro.
- source_word: ἀποστεῖλαι ἡμῖν
  choice: para que nos enviassem
  rationale: Segue o verbo grego 'enviar' e explicita naturalmente que os interlocutores são os agentes do envio.
- source_word: τοὺς ἱερατεύσαντας
  choice: os que serviriam como sacerdotes
  rationale: Reflete especificamente o exercício do serviço sacerdotal, sem generalizá-lo para simples servidores.
- source_word: ἐν τῷ οἴκῳ τοῦ κυρίου ἡμῶν
  choice: na casa de nosso Senhor
  rationale: Traduz diretamente o grego κύριος e conserva 'casa' como linguagem tradicional e inteligível para o templo.
theological_decisions:
- issue: κύριος no grego em contraste com אֱלֹהֵינוּ no paralelo hebraico
  choice: nosso Senhor
  alternative: nosso Deus
  rationale: O texto grego de 1 Esdras é a fonte primária; a variante do paralelo hebraico é preservada em nota, sem harmonização.
- issue: Especificidade sacerdotal de τοὺς ἱερατεύσαντας
  choice: os que serviriam como sacerdotes
  alternative: servidores ou ministros
  rationale: O grego especifica serviço sacerdotal, enquanto o paralelo hebraico emprega uma designação mais ampla.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção participial foi mantida porque o versículo fornecido parece continuar uma oração anterior; a vírgula final sinaliza essa continuidade. As notas seguem a ordem em que os pontos anotados aparecem no texto.
