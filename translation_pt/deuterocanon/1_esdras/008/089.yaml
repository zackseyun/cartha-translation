base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/089.yaml
  text: And while Ezra was praying and making confession[a], weeping as he lay prostrate before the temple[b], a very great crowd gathered to him from Jerusalem—men and women and young men—for there was great weeping among the multitude.
translation:
  language: pt
  text: Enquanto Esdras orava e fazia confissão[a], chorando e prostrado por terra diante do templo, uma multidão muito grande, vinda de Jerusalém, reuniu-se a ele — homens, mulheres e rapazes[b] —, pois havia grande pranto entre a multidão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dava graças”; o verbo grego pode ter os dois sentidos, mas o contexto penitencial favorece “fazia confissão”.
    reason: lexical_alternative
  - marker: b
    text: O termo grego é masculino e se refere especificamente a jovens do sexo masculino.
    reason: lexical_clarification
lexical_decisions:
- source_word: προσευχόμενος
  choice: orava
  rationale: O particípio presente indica uma ação em curso e simultânea às demais ações da cena; o imperfeito português expressa isso naturalmente.
- source_word: ἀνθωμολογεῖτο
  choice: fazia confissão
  rationale: Embora o verbo também possa significar dar graças ou louvar, a oração, o choro e a prostração neste contexto penitencial favorecem a ideia de confissão, sem explicitar no corpo do texto um objeto ausente no grego.
- source_word: κλαίων
  choice: chorando
  rationale: Mantém de forma natural e solene a ação contínua expressa pelo particípio grego.
- source_word: χαμαιπετής
  choice: prostrado por terra
  rationale: Reproduz tanto a postura de humilhação quanto a referência explícita à posição junto ao chão.
- source_word: ἔμπροσθεν τοῦ ἱεροῦ
  choice: diante do templo
  rationale: ἱερόν designa o templo ou seu conjunto, não especificamente o santuário interior; “templo” é claro e não restringe indevidamente o referente.
- source_word: ἐπισυνήχθησαν πρὸς αὐτόν
  choice: reuniu-se ao redor dele
  rationale: A construção portuguesa concorda com o coletivo “multidão” e comunica tanto o ajuntamento quanto sua orientação para Esdras.
- source_word: ἀπὸ Ἰερουσαλήμ
  choice: vinda de Jerusalém
  rationale: A locução ligada a “multidão” preserva claramente a procedência indicada por ἀπό e evita sugerir que a reunião ocorreu por toda Jerusalém.
- source_word: ὄχλος πολὺς σφόδρα
  choice: uma multidão muito numerosa
  rationale: Expressa o substantivo coletivo, o adjetivo de grandeza e o intensificador σφόδρα em português corrente.
- source_word: νεανίαι
  choice: rapazes
  rationale: O substantivo grego é masculino e designa jovens do sexo masculino; “rapazes” transmite isso de modo natural, sem neutralizar o gênero.
- source_word: κλαυθμὸς ... μέγας
  choice: grande pranto
  rationale: “Pranto” comunica choro intenso e audível, preservando o tom solene do substantivo grego e sua qualificação.
- source_word: ἐν τῷ πλήθει
  choice: entre a multidão
  rationale: Preserva o sentido coletivo e distributivo da expressão grega com registro digno e natural.
theological_decisions:
- issue: Sentido de ἀνθωμολογεῖτο no contexto penitencial
  choice: linguagem de confissão (“fazia confissão”)
  alternative: linguagem de ação de graças ou louvor (“dava graças”)
  rationale: O verbo admite mais de um sentido, mas a combinação de oração, lágrimas, prostração e grande pranto favorece a confissão. A alternativa genuína é preservada em nota.
- issue: Referência de gênero em νεανίαι
  choice: “rapazes”
  alternative: “jovens” ou “pessoas jovens”
  rationale: A forma grega é masculina e aparece numa enumeração de grupos demográficos; a tradução não deve tornar neutra uma referência masculina específica.
- issue: Terminologia do templo em ἱερόν
  choice: “templo”
  alternative: “santuário”
  rationale: O termo grego pode abranger o complexo do templo, ao passo que “santuário” poderia ser entendido como referência apenas à área interior.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente ajustada para evitar uma sequência pesada de particípios, preservando a simultaneidade das ações. Os travessões destacam naturalmente a enumeração explicativa.
