revisions:
- from: Enquanto Esdras orava e fazia confissão[a], chorando e prostrado por terra diante do templo, reuniu-se ao redor dele, vinda de Jerusalém, uma multidão muito numerosa — homens, mulheres e rapazes[b] —, pois havia grande pranto entre a multidão.
  to: Enquanto Esdras orava e fazia confissão[a], chorando e prostrado por terra diante do templo, uma multidão muito grande, vinda de Jerusalém, reuniu-se a ele — homens, mulheres e rapazes[b] —, pois havia grande pranto entre a multidão.
  rationale: A única alteração necessária substitui “ao redor dele” por “a ele”, a fim de não introduzir uma disposição espacial além do que o grego afirma. O restante do texto e das notas é mantido, pois transmite adequadamente o sentido e as ambiguidades relevantes do original.
