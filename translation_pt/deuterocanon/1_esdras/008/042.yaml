base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/008/042.yaml
  text: And after gathering them to the river called the River[a], we camped there for three days[b], and I examined them.
translation:
  language: pt
  text: Depois de reuni-los ao rio chamado Rio[a], acampamos ali durante três dias e eu os examinei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: «ao rio chamado Rio». A expressão provavelmente preserva uma designação de lugar, e não apenas uma descrição genérica.'
    reason: lexical_alternative
  - marker: b
    text: O grego passa de «acampamos» para «eu os examinei». Algumas traduções uniformizam a pessoa verbal, mas o texto distingue a ação do grupo da avaliação pessoal do narrador.
    reason: alternative_reading
lexical_decisions:
- source_word: συναγαγών
  choice: Depois de reuni-los
  rationale: O particípio aoristo indica uma ação anterior às ações principais; esta formulação expressa com naturalidade a sequência.
- source_word: ἐπὶ τὸν λεγόμενον Ποταμόν
  choice: junto ao rio chamado Rio
  rationale: λεγόμενον significa «chamado» ou «denominado», e Ποταμόν parece funcionar também como designação de lugar. A tradução conserva a formulação incomum do grego sem transformar com certeza o termo em nome próprio transliterado.
- source_word: παρενεβάλομεν
  choice: acampamos
  rationale: Equivalente corrente e direto do verbo grego que significa montar acampamento.
- source_word: αὐτόθι
  choice: ali
  rationale: Advérbio simples de lugar, vertido de modo natural em português.
- source_word: ἡμέρας τρεῖς
  choice: durante três dias
  rationale: O acusativo indica duração; «durante» explicita essa função de modo idiomático.
- source_word: κατέμαθον αὐτούς
  choice: eu os examinei
  rationale: No contexto, o verbo indica observar atentamente ou passar em revista o grupo. «Examinei» é natural, digno e menos administrativo que «inspecionei».
theological_decisions:
- issue: Mudança de pessoa narrativa no versículo
  choice: Conservar a passagem de «acampamos» para «eu os examinei».
  alternative: Regularizar como «nós os examinamos».
  rationale: O texto grego distingue a ação coletiva, na primeira pessoa do plural, da avaliação pessoal do narrador, na primeira pessoa do singular. A tradução não harmoniza essa tensão textual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A pontuação com ponto e vírgula e «então» torna perceptível, sem exagero, a passagem da ação coletiva para a pessoal. Todos os marcadores de nota aparecem no texto principal.
