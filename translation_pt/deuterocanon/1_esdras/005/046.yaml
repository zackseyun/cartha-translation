base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/046.yaml
  text: When the seventh month had come[a], and the sons of Israel were each in their own places[c][b], they gathered with one accord in the open area of the first gate on the east.
translation:
  language: pt
  text: Quando chegou o sétimo mês, e cada um dos filhos de Israel estava em seu próprio lugar[a], eles se reuniram unânimes no espaço amplo do primeiro portão, voltado para o leste.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo hebraico ressalta que Israel já estava estabelecido em suas cidades; o grego diz, de modo mais geral, que cada um estava em seu próprio lugar.
    reason: cross_reference
  - marker: b
    text: “Espaço amplo” também pode ser entendido como “área aberta” ou “praça”. O sentido arquitetônico exato de “primeiro portão” não é claro.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνστάντος δὲ τοῦ ἑβδόμου μηνός
  choice: Quando chegou o sétimo mês
  rationale: A construção temporal indica a chegada ou o início do sétimo mês. A formulação é natural em português e não acrescenta um marcador discursivo sem correspondente explícito.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: dos filhos de Israel
  rationale: Preserva a expressão familiar e pactual do grego, em vez de reduzi-la ao coletivo mais genérico “israelitas”.
- source_word: ἕκαστος ἐν τοῖς ἰδίοις
  choice: cada um ... em seu próprio lugar
  rationale: Reproduz o sentido distributivo e evita especificar “casa” ou “cidade”, detalhes não expressos diretamente no texto grego.
- source_word: συνήχθησαν ὁμοθυμαδόν
  choice: eles se reuniram de comum acordo
  rationale: Expressa tanto a reunião física quanto a unidade de propósito indicada por ὁμοθυμαδόν.
- source_word: εἰς τὸ εὐρύχωρον
  choice: no espaço amplo
  rationale: Mantém a ideia de uma área espaçosa ou aberta sem defini-la de modo excessivo como uma praça formal.
- source_word: τοῦ πρώτου πυλῶνος τοῦ πρὸς τῇ ἀνατολῇ
  choice: do primeiro portão, voltado para o leste
  rationale: Conserva a designação literal “primeiro” e a orientação oriental, sem tentar resolver a configuração arquitetônica incerta.
theological_decisions:
- issue: Expressão familiar masculina em τῶν υἱῶν Ἰσραήλ
  choice: filhos de Israel
  alternative: israelitas
  rationale: A opção mantém a imagem genealógica e pactual presente no grego. “Israelitas” seria mais conciso, mas apagaria essa forma de identificação coletiva.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. Mantém “filhos de Israel” por transparência ao grego e evita especificações arquitetônicas ou geográficas não asseguradas pelo texto.
