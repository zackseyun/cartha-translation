base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/045.yaml
  text: And the priests and the Levites and some of the people settled in Jerusalem and the region[a], and the temple singers and the gatekeepers, and all Israel in their villages.
translation:
  language: pt
  text: Os sacerdotes, os levitas e os que eram do seu povo[a] estabeleceram-se em Jerusalém e na região; os cantores do templo, os guardas dos portões e todo o Israel estabeleceram-se em suas aldeias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «os que são do povo dele». O referente de «dele» não está claro; a expressão provavelmente distingue da classe sacerdotal e levítica outros membros da comunidade.
    reason: Preserva o possessivo ambíguo e evita introduzir no texto principal uma quantidade que o grego não declara.
lexical_decisions:
- source_word: κατῳκίσθησαν
  choice: se estabeleceram
  rationale: Expressa de modo natural o ingresso em residência indicado pelo aoristo passivo, sem a rigidez de “foram estabelecidos”.
- source_word: οἱ ἱερεῖς
  choice: os sacerdotes
  rationale: Equivalente corrente e preciso no contexto cultual judaico.
- source_word: οἱ Λευεῖται
  choice: os levitas
  rationale: Designação tradicional e exata do grupo levítico.
- source_word: οἱ ἐκ τοῦ λαοῦ αὐτοῦ
  choice: alguns do povo
  rationale: Identifica um grupo procedente do povo, distinto dos sacerdotes e levitas, sem transformar a expressão em uma categoria técnica.
- source_word: ἐν Ἰερουσαλὴμ καὶ τῇ χώρᾳ
  choice: em Jerusalém e na região
  rationale: Mantém o sentido geográfico amplo de χώρα sem acrescentar que a região era necessariamente “circunvizinha”.
- source_word: οἵ τε ἱεροψάλται
  choice: também os cantores do templo
  rationale: Comunica a função cultual específica de ἱεροψάλται e representa a partícula coordenativa τε.
- source_word: οἱ θυρωροὶ
  choice: os porteiros
  rationale: Termo claro e tradicional para os responsáveis pelas portas ou portões no contexto do templo e da comunidade.
- source_word: πᾶς Ἰσραήλ
  choice: todo o Israel
  rationale: Preserva a fórmula coletiva convencional sem explicá-la como referência matemática a cada indivíduo.
- source_word: ἐν ταῖς κώμαις αὐτῶν
  choice: em suas aldeias
  rationale: κώμη designa normalmente uma aldeia ou povoação menor; “aldeias” conserva essa escala.
theological_decisions:
- issue: Alcance de πᾶς Ἰσραήλ
  choice: todo o Israel
  alternative: cada israelita, sem exceção
  rationale: A formulação grega apresenta Israel coletivamente como povo restaurado; a tradução conserva essa designação sem impor uma interpretação distributiva.
- issue: Referente de αὐτοῦ em οἱ ἐκ τοῦ λαοῦ αὐτοῦ
  choice: não explicitar o possessivo no texto principal
  alternative: os do seu povo
  rationale: O referente do pronome é incerto e a expressão literal seria ambígua ou pouco natural em português; a nota preserva a forma grega sem decidir silenciosamente a quem “seu” se refere.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula organiza a longa enumeração sem eliminar a coordenação cumulativa do grego.
