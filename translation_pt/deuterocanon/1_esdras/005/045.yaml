    issue: «alguns do povo» introduz uma nuance quantitativa.
    rationale: οἱ ἐκ τοῦ λαοῦ αὐτοῦ designa pessoas «do/provenientes de seu povo»; o artigo identifica um grupo, mas não diz explicitamente «alguns». A nota não elimina a adição no texto principal.
