    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: os filhos de
  rationale: Neste contexto de recenseamento, a expressão introduz uma família ou clã descendente da pessoa mencionada; a tradução mantém de forma transparente a formulação genealógica grega.
- source_word: Ἀννείς
  choice: Anneis
  rationale: O nome próprio é transliterado diretamente do grego, sem harmonização com o paralelo hebraico divergente.
- source_word: ἑκατὸν εἷς
  choice: cento e um
  rationale: Tradução direta e natural do numeral cardinal grego.
- source_word: Ἀρόμ
  choice: Arom
  rationale: Transliteração do nome grego, preservada apesar da divergência entre as tradições textuais.
- source_word: Βασσαί
  choice: Bassai
  rationale: Transliteração próxima da forma grega; não foi substituída por Bezai, forma sugerida pelo paralelo hebraico.
- source_word: τριακόσιοι εἴκοσι τρεῖς
  choice: trezentos e vinte e três
  rationale: Tradução direta do numeral, conforme o uso corrente em português.
- source_word: Ἀρσειφουρείθ
  choice: Arseifureite
  rationale: Transliteração adaptada à leitura em português da forma grega incerta; a possível correspondência hebraica é registrada em nota.
