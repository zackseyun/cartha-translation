translation:
  language: pt
  text: os filhos de Anneis[a], cento e um; os filhos de Arom, os filhos de Bassai, trezentos e vinte e três; os filhos de Arseifureite[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste ponto, a lista grega de nomes diverge do paralelo hebraico aproximado, que traz “os filhos de Bezai”.
