base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/005.yaml
  text: 'The priests[a], the sons of Phinehas, the sons of Aaron: Jeshua son of Jozadak son of Seraiah, and Joakim son of Zerubbabel son of Shealtiel, from the house of David, from the family line of Perez[b],'
translation:
  language: pt
  text: 'Os sacerdotes, os filhos[a] de Fineias, os filhos de Arão: Jesua[b], filho de Jozadaque, filho de Seraías; e Joaquim, filho de Zorobabel, filho de Salatiel, da casa de Davi, da linhagem de Perez,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em listas genealógicas, o grego “filhos” pode indicar descendentes, e não apenas filhos imediatos.
    reason: lexical_alternative
  - marker: b
    text: O nome grego Ἰησοῦς também pode ser representado como “Josué” ou, em outros contextos, “Jesus”; aqui, “Jesua” identifica com mais clareza o sacerdote do período pós-exílico.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἱερεῖς
  choice: Os sacerdotes
  rationale: O substantivo plural articulado introduz os personagens sacerdotais mencionados na lista.
- source_word: υἱοὶ Φινεὲς υἱοὶ Ἀαρών
  choice: os filhos de Fineias, os filhos de Arão
  rationale: Mantém a repetição e a forma genealógica do grego; em listas desse tipo, “filhos” pode designar descendentes, sem exigir filiação imediata.
- source_word: Ἰησοῦς
  choice: Jesua
  rationale: Forma portuguesa apropriada ao sacerdote do período pós-exílico, evitando a associação equivocada que “Jesus” produziria neste contexto; “Josué” também seria possível.
- source_word: ὁ τοῦ Ἰωσεδὲκ τοῦ Σαραιοῦ
  choice: filho de Jozadaque, filho de Seraías
  rationale: A construção com artigo e genitivos encadeados tem função genealógica; “filho de” torna explícita em português a relação subentendida no grego.
- source_word: Ἰωακεὶμ
  choice: Joaquim
  rationale: Forma bíblica portuguesa corrente e legível para o nome representado pelo grego Ἰωακείμ.
- source_word: ὁ τοῦ Ζοροβαβὲλ τοῦ Σαλαθιὴλ
  choice: filho de Zorobabel, filho de Salatiel
  rationale: Reproduz a cadeia genealógica do original com a elipse grega explicitada naturalmente em português.
- source_word: ἐκ τοῦ οἴκου τοῦ Δαυείδ
  choice: da casa de Davi
  rationale: “Casa de Davi” preserva a expressão dinástica tradicional e o sentido genealógico-político de οἶκος.
- source_word: ἐκ τῆς γενεᾶς Φάρες
  choice: da linhagem de Perez
  rationale: Neste contexto, γενεά indica descendência ou linhagem, não uma geração cronológica; “Perez” é a forma bíblica portuguesa habitual.
theological_decisions:
- issue: Linguagem genealógica e natureza da descendência
  choice: Preservar a repetição de “filhos” e de “filho de”, bem como “casa de Davi” e “linhagem de Perez”.
  alternative: Uniformizar todas as relações como “descendentes de”.
  rationale: A redação conserva a estrutura genealógica e a distinção formal do texto sem afirmar que cada relação corresponda necessariamente a uma geração imediata.
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas bíblicas reconhecíveis. A pontuação organiza a longa cadeia genealógica sem eliminar a estrutura de lista. A vírgula final foi mantida porque o texto fornecido termina como parte de uma sequência contínua.
