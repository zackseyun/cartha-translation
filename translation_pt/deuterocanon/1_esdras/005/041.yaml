base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/041.yaml
  text: 'All these were Israelites[a], from twelve years old and upward, apart from male and female servants: forty-two thousand three hundred sixty. Their male and female servants were seven thousand three hundred thirty-seven[b]; and the singers and songstresses were two hundred forty-five.'
translation:
  language: pt
  text: 'Todos eles eram israelitas de doze anos para cima, sem contar os servos e as servas[a]: quarenta e dois mil trezentos e sessenta. Seus servos e suas servas eram sete mil trezentos e trinta e sete; e os cantores e as cantoras[b] eram duzentos e quarenta e cinco.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os escravos e as escravas”. Os termos gregos podem designar dependentes domésticos em condição servil; aqui, o foco está no total do recenseamento, não na definição de sua condição jurídica.
    reason: lexical_alternative
  - marker: b
    text: O grego emprega termos distintos para cantores e cantoras, em vez de usar um único termo indiferenciado.
    reason: lexical_clarification
lexical_decisions:
- source_word: Οἱ δὲ πάντες ἦσαν Ἰσραήλ
  choice: Todos eles eram israelitas
  rationale: A expressão resume o grupo anteriormente enumerado. Embora o grego diga literalmente que eles “eram Israel”, “eram israelitas” comunica em português corrente a identidade coletiva e pactual sem alterar o sentido.
- source_word: ἀπὸ δωδεκαετοῦς
  choice: de doze anos para cima
  rationale: Expressa de modo natural o limite etário inclusivo da contagem.
- source_word: χωρὶς παίδων καὶ παιδισκῶν
  choice: sem contar os servos e as servas
  rationale: Neste contexto censitário, o par designa mais provavelmente dependentes domésticos de ambos os sexos, contados separadamente, e não simplesmente meninos e meninas. A nota preserva a possibilidade de condição escrava.
- source_word: μυριάδες τέσσαρες δισχίλιοι τριακόσιοι ἑξήκοντα
  choice: quarenta e dois mil trezentos e sessenta
  rationale: Representação direta e inequívoca do total 42.360.
- source_word: παῖδες τούτων καὶ παιδίσκαι
  choice: Seus servos e suas servas
  rationale: O possessivo traduz τούτων, e a repetição mantém a categoria doméstica contada à parte.
- source_word: ἑπτακισχίλιοι τριακόσιοι τριάκοντα ἑπτά
  choice: sete mil trezentos e trinta e sete
  rationale: Representação direta do total 7.337.
- source_word: ψάλται καὶ ψαλτῳδοί
  choice: os cantores e as cantoras
  rationale: Preserva em linguagem atual a distinção explícita entre os dois grupos, provavelmente masculina e feminina, sem recorrer a um termo artificial.
- source_word: διακόσιοι τεσσεράκοντα πέντε
  choice: duzentos e quarenta e cinco
  rationale: Representação direta do total 245.
theological_decisions:
- issue: Identidade coletiva em ἦσαν Ἰσραήλ
  choice: eram israelitas
  alternative: eram Israel
  rationale: A forma escolhida é idiomática em português e conserva a identificação do grupo com Israel; não pretende reduzir a expressão a mera nacionalidade moderna.
- issue: Condição social indicada por παῖδες / παιδίσκαι
  choice: servos e servas
  alternative: escravos e escravas; meninos e meninas
  rationale: A enumeração separada favorece o sentido de dependentes domésticos. Como os termos gregos podem abranger condição servil ou escrava sem defini-la precisamente aqui, o texto usa “servos e servas” e a nota registra a alternativa socialmente mais marcada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construções naturais tanto no Brasil quanto em outros contextos lusófonos. Os números foram escritos por extenso, e “para cima” conserva de forma clara o limite etário inclusivo.
