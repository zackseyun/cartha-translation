  text: those from Kartatheireios[a], twenty-five; those from Peiras and Berog, seven hundred.
translation:
  language: pt
  text: os de Cartateireios[a], vinte e cinco; os de Peiras e Berog, setecentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tradição hebraica paralela difere aqui e traz aproximadamente: “os homens de Netofá, cinquenta e seis”. Ao que parece, 1 Esdras preserva uma forma grega divergente da lista, em vez dessa redação hebraica.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἐκ
  choice: os de
  rationale: Fórmula elíptica de lista que indica pessoas procedentes de um lugar. “Os de” é natural e conciso em português e não acrescenta “homens”, termo não expresso nesta oração grega.
- source_word: Καρταθειαρειός
  choice: Cartateireios
  rationale: Transliteração conservadora do topônimo grego de forma difícil, sem identificá-lo especulativamente com Netofá. Usa-se C inicial, forma mais natural na tradição gráfica portuguesa para kappa em nomes antigos.
- source_word: εἴκοσι πέντε
  choice: vinte e cinco
  rationale: Correspondência direta do numeral cardinal grego.
- source_word: Πείρας
  choice: Peiras
  rationale: Transliteração direta do nome próprio grego, preservando a forma da testemunha primária em vez de harmonizá-la com listas paralelas.
- source_word: Βηρόγ
  choice: Berog
  rationale: Transliteração simples do nome próprio grego, representando o gama final por g.
- source_word: ἑπτακόσιοι
  choice: setecentos
  rationale: Correspondência direta do numeral cardinal grego.
theological_decisions:
- issue: Divergência acentuada entre a lista grega e a tradição hebraica paralela
  choice: Traduzir os topônimos e números do texto grego de Swete e registrar a variante hebraica em nota.
  alternative: 'A tradição hebraica paralela traz aproximadamente: “os homens de Netofá, cinquenta e seis”.'
  rationale: Em 1 Esdras, o grego é a testemunha primária. Como a fonte hebraica paralela diverge tanto no nome quanto no número, harmonizá-las apagaria uma diferença textual genuína; a nota mantém transparência sem substituir a leitura grega.
translation_notes:
  register: Português moderno, digno e conciso, adequado ao estilo de uma lista censitária. Os nomes próprios são transliterados conservadoramente a partir do grego; a divergência da tradição hebraica é preservada em nota.
