base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/050.yaml
  text: And they kept the Feast of Booths[a], as it is commanded in the law, and offered sacrifices day by day, as was fitting.
translation:
  language: pt
  text: E celebraram a Festa das Cabanas[a], conforme está ordenado na lei, e ofereceram sacrifícios dia após dia, como era apropriado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, na forma mais tradicional, “Festa dos Tabernáculos”.
    reason: Alternativa lexical tradicional para σκηνοπηγία.
lexical_decisions:
- source_word: ἠγάγοσαν
  choice: celebraram
  rationale: O verbo ἄγω, quando usado com uma festa, tem o sentido idiomático de celebrar ou observar; “celebraram” é natural e claro em português moderno.
- source_word: τὴν τῆς σκηνοπηγίας ἑορτήν
  choice: a Festa das Cabanas
  rationale: σκηνοπηγία designa a festa associada à construção e habitação em cabanas. A forma escolhida preserva a imagem concreta e é compreensível ao leitor moderno; a denominação tradicional aparece em nota.
- source_word: ὡς ἐπιτέτακται
  choice: conforme está ordenado
  rationale: O perfeito passivo expressa uma ordem estabelecida que permanece em vigor; “está ordenado” conserva esse valor resultativo.
- source_word: ἐν τῷ νόμῳ
  choice: na lei
  rationale: A expressão situa a ordem no corpo legal, sem exigir que “lei” seja tratada como título formal.
- source_word: θυσίας
  choice: sacrifícios
  rationale: θυσία é o termo comum para ofertas sacrificiais; “sacrifícios” é a correspondência direta no contexto cultual.
- source_word: καθ’ ἡμέραν
  choice: dia após dia
  rationale: A locução distributiva enfatiza a repetição em cada dia; “dia após dia” mantém esse caráter iterativo.
- source_word: ὡς προσῆκον ἦν
  choice: como era devido
  rationale: A expressão indica aquilo que convinha ou era apropriado. “Como era devido” preserva a noção de obrigação contextual sem repetir explicitamente a linguagem de mandamento.
theological_decisions:
- issue: Nome da festa σκηνοπηγία
  choice: Festa das Cabanas
  alternative: Festa dos Tabernáculos
  rationale: “Cabanas” comunica de modo transparente a imagem do termo grego e evita depender de vocabulário eclesiástico menos corrente. A forma tradicional é preservada em nota, sem atribuir diferença doutrinária às denominações.
- issue: Força de ὡς προσῆκον ἦν
  choice: como era devido
  alternative: como era apropriado
  rationale: A formulação mantém a tensão entre conveniência e dever sem transformar a frase em uma segunda referência explícita à prescrição legal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O nome da festa é capitalizado como denominação própria; a nota preserva a nomenclatura tradicional.
