  text: the sons of Bebai[a], six hundred thirty-three; the sons of Argai, one thousand three hundred twenty-two.
translation:
  language: pt
  text: os filhos de Bebai, seiscentos e trinta e três; os filhos de Argai[a], mil trezentos e vinte e dois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego traz “Argai”. O paralelo massorético aproximado traz “Azgad” e um total diferente (1.222), mostrando que 1 Esdras não coincide exatamente com a lista hebraica neste ponto.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: os filhos de
  rationale: Mantém a fórmula genealógica da lista, na qual o termo pode designar filhos ou, de modo mais amplo, descendentes pertencentes a uma família.
- source_word: Βηβαί
  choice: Bebai
  rationale: Transliteração direta e natural do nome grego Βηβαί.
- source_word: ἑξακόσιοι τριάκοντα τρεῖς
  choice: seiscentos e trinta e três
  rationale: Reproduz exatamente o total do texto grego em português corrente.
- source_word: Ἀργαί
  choice: Argai
  rationale: Segue diretamente a forma do testemunho grego primário, sem substituí-la pela forma diferente do paralelo massorético.
- source_word: χίλιοι τριακόσιοι εἴκοσι δύο
  choice: mil trezentos e vinte e dois
  rationale: Reproduz exatamente o total do texto grego, embora o paralelo massorético apresente outro número.
