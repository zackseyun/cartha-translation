base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/035.yaml
  text: 'All the temple servants and the sons of Solomon’s servants: three hundred seventy-two[a].'
translation:
  language: pt
  text: 'Todos os servos do templo e os filhos dos servos de Salomão: trezentos e setenta e dois.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escravos do templo” e “filhos dos escravos de Salomão”; os termos gregos indicam serviço em condição de dependência e podem ter sentido servil.
    reason: Alternativa lexical que preserva a possível força social de ἱερόδουλοι e παίδων.
lexical_decisions:
- source_word: πάντες
  choice: Todos
  rationale: O adjetivo abrange de modo totalizante os dois grupos mencionados e é traduzido naturalmente por “Todos” no início do enunciado.
- source_word: ἱερόδουλοι
  choice: servos do templo
  rationale: O composto designa pessoas ligadas ao serviço do templo. “Servos do templo” é claro e digno no contexto de uma lista administrativa, sem excluir a possível conotação de condição servil, registrada em nota.
- source_word: υἱοὶ τῶν παίδων Σαλωμών
  choice: os filhos dos servos de Salomão
  rationale: “Filhos” preserva a forma genealógica de υἱοί, que neste tipo de lista também pode abranger descendentes. παῖδες admite “servos” ou “escravos”; “servos” evita determinar além do que o contexto exige.
- source_word: τριακόσιοι ἑβδομήκοντα δύο
  choice: trezentos e setenta e dois
  rationale: Tradução direta do numeral cardinal, segundo o uso natural do português contemporâneo.
theological_decisions:
- issue: Tradução de termos de serviço socialmente dependente numa lista censitária
  choice: “servos do templo” e “servos de Salomão” no texto principal
  alternative: “escravos do templo” e “escravos de Salomão”
  rationale: O verso apresenta um total administrativo e não desenvolve uma afirmação teológica sobre escravidão. “Servos” representa a classe institucional sem apagar que os termos gregos podem ter força servil; essa possibilidade é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém a concisão de uma lista censitária e conserva “filhos” em vez de explicitar “descendentes”.
