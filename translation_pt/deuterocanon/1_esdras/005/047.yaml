base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/047.yaml
  text: Then Jeshua son of Jozadak arose[a], along with his brothers the priests, and Zerubbabel son of Shealtiel and his brothers, and they prepared the altar of the God of Israel[b],
translation:
  language: pt
  text: Então, Jesua[a], filho de Jozadaque, levantou-se[b] com seus irmãos, os sacerdotes, e com Zorobabel, filho de Sealtiel, e seus irmãos. Eles prepararam o altar do Deus de Israel,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz o nome Ἰησοῦς, que aqui se refere a Jesua, o sacerdote do período pós-exílico, e não a Jesus de Nazaré. A tradição hebraica paralela sustenta a identificação com Jesua/Josué.
    reason: cross_reference
  - marker: b
    text: Ou “pôs-se de pé”. O particípio grego introduz o começo de uma ação decisiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστὰς
  choice: levantou-se
  rationale: O particípio aoristo assinala que Jesua se pôs em ação. “Levantou-se” é natural em português, preserva a imagem do grego e não acrescenta a ideia mais específica de assumir um cargo ou posição.
- source_word: Ἰησοῦς
  choice: Jesua
  rationale: Neste contexto pós-exílico, o nome designa o sacerdote conhecido em português bíblico como Jesua, e não Jesus de Nazaré. A forma também o distingue de Josué, filho de Num.
- source_word: ὁ τοῦ Ἰωσεδὲκ
  choice: filho de Jozadaque
  rationale: O artigo seguido do genitivo funciona como patronímico. “Filho de” é a expressão idiomática em português, e “Jozadaque” é a forma bíblica portuguesa corrente do nome.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: seus irmãos
  rationale: Traduz literalmente a relação expressa por ἀδελφοί, sem ampliá-la desnecessariamente para “parentes” ou “companheiros”.
- source_word: οἱ ἱερεῖς
  choice: os sacerdotes
  rationale: Mantém explicitamente a aposição do grego, identificando os irmãos de Jesua como sacerdotes.
- source_word: Ζοροβαβὲλ
  choice: Zorobabel
  rationale: Forma tradicional e amplamente reconhecida em português bíblico.
- source_word: ὁ τοῦ Σαλαθιὴλ
  choice: filho de Sealtiel
  rationale: O genitivo patronímico é expresso naturalmente por “filho de”; “Sealtiel” é a forma bíblica portuguesa usual.
- source_word: ἡτοίμασαν
  choice: prepararam
  rationale: Reproduz diretamente o sentido de tornar pronto. Evita “ergueram” ou “construíram”, que especificariam um processo físico não expresso pelo verbo grego.
- source_word: τὸ θυσιαστήριον
  choice: o altar
  rationale: “Altar” é o equivalente cultual normal e suficiente; o caráter sacrificial já é inerente ao termo e ao contexto.
- source_word: τοῦ θεοῦ Ἰσραήλ
  choice: do Deus de Israel
  rationale: 'Preserva o genitivo de posse ou associação: trata-se do altar pertencente ou dedicado ao Deus de Israel.'
theological_decisions:
- issue: Identidade de Ἰησοῦς
  choice: Jesua
  alternative: Jesus; Josué
  rationale: A genealogia e o cenário pós-exílico identificam o sacerdote Jesua. Usar “Jesus” poderia sugerir indevidamente Jesus de Nazaré, enquanto “Josué” confundiria esta figura com outros personagens bíblicos de nome aparentado.
- issue: Relação expressa em “altar do Deus de Israel”
  choice: Manter o genitivo com “do”
  alternative: altar para o Deus de Israel
  rationale: “Do” conserva a amplitude do genitivo grego, que pode indicar pertença, associação ou dedicação, sem reduzir a expressão apenas à finalidade.
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas correntes em Bíblias de língua portuguesa. A repetição de “irmãos” e a identificação “os sacerdotes” foram preservadas para refletir a estrutura do grego. Repetiu-se “com” antes de Zorobabel para evitar a leitura equivocada de que ele faria parte do primeiro grupo de irmãos. O ponto e vírgula organiza a longa coordenação sem alterar as relações sintáticas. A vírgula final conserva o caráter continuativo do fragmento fornecido.
