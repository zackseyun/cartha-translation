base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/069.yaml
  text: But the nations of the land, joining themselves to those in Judea and besieging them, hindered the building of the house.
translation:
  language: pt
  text: Mas os povos da terra, pressionando os que estavam na Judeia[a] e sitiando-os, impediam a construção[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego é difícil; também pode sugerir “juntando-se aos”, “estabelecendo-se entre” ou “incidindo sobre” os que estavam na Judeia. O contexto indica uma atuação hostil.
    reason: lexical_alternative
  - marker: b
    text: O grego diz simplesmente “construir”, sem indicar aqui o objeto. Pelo contexto, trata-se da reconstrução do templo.
    reason: contextual_clarification
lexical_decisions:
- source_word: τὰ ... ἔθνη τῆς γῆς
  choice: os povos da terra
  rationale: ἔθνη pode indicar nações ou povos. Aqui se refere aos grupos circunvizinhos; “povos” é natural em português e evita a conotação neotestamentária que “gentios” poderia introduzir.
- source_word: ἐπικοιμώμενα
  choice: pressionando
  rationale: O particípio é raro e de sentido difícil, podendo sugerir juntar-se, estabelecer-se junto a ou lançar-se/pressionar contra. O contexto hostil e o particípio seguinte favorecem “pressionando”, sem ocultar a incerteza, registrada em nota.
- source_word: τοῖς ἐν τῇ Ἰουδαίᾳ
  choice: os que estavam na Judeia
  rationale: Reproduz a expressão substantivada sem identificar seus referentes de modo mais específico do que o grego.
- source_word: πολιορκοῦντες
  choice: sitiando-os
  rationale: Mantém o sentido militar direto de πολιορκέω e a intensidade da oposição.
- source_word: εἶργον
  choice: impediam
  rationale: O imperfeito indica ação continuada. Em português, “impediam” comunica obstrução persistente, sem necessariamente afirmar um resultado permanente.
- source_word: τοῦ οἰκοδομεῖν
  choice: a construção
  rationale: O grego diz literalmente “construir”, sem objeto expresso. “A construção” é idiomático e preserva essa ausência, deixando o contexto identificar a obra.
theological_decisions:
- issue: Objeto implícito de τοῦ οἰκοδομεῖν
  choice: a construção
  alternative: a construção do templo / da Casa
  rationale: Embora o contexto trate da reconstrução do templo, o objeto não aparece nesta oração grega. A tradução mantém a formulação aberta em vez de inserir uma explicitação contextual no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem participial foi preservada, e as ambiguidades relevantes foram mantidas no texto ou registradas em notas.
