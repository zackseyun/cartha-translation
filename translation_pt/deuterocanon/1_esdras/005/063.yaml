base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/063.yaml
  text: And when the enemies of the tribe of Judah and Benjamin heard[a], they came to find out what the sound of the trumpets was[b],
translation:
  language: pt
  text: Ao ouvirem, os inimigos da tribo de Judá e Benjamim[a] vieram descobrir qual era o som das trombetas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “tribo” no singular com “Judá e Benjamim”; também seria possível traduzir “das tribos de Judá e Benjamim”.
    reason: alternative_reading
  - marker: b
    text: Mais literalmente, “qual era a voz das trombetas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Ao ouvirem
  rationale: O particípio aoristo introduz a circunstância temporal da ação principal. A formulação é natural em português e não explicita um objeto que o grego deixa implícito.
- source_word: οἱ ἐχθροὶ
  choice: os inimigos
  rationale: Reproduz o substantivo articulado sem acrescentar um possessivo ausente no grego.
- source_word: τῆς φυλῆς Ἰούδα καὶ Βενιαμεὶν
  choice: da tribo de Judá e Benjamim
  rationale: Mantém o singular φυλῆς e os dois nomes coordenados, preservando a construção incomum do texto grego.
- source_word: ἦλθοσαν
  choice: vieram
  rationale: Equivalente narrativo direto do verbo de movimento, adequado à perspectiva da cena.
- source_word: ἐπιγνῶναι
  choice: descobrir
  rationale: O infinitivo expressa propósito e, no contexto, indica procurar saber a natureza ou causa do som.
- source_word: τίς ἡ φωνὴ τῶν σαλπίγγων
  choice: o que era o som das trombetas
  rationale: φωνή pode significar voz ou som; com trombetas, 'som' é a forma corrente em português. A construção 'o que era' preserva a pergunta indireta sem definir se buscavam identificar a natureza, a causa ou o significado do toque.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com estrutura narrativa fluente. Conserva-se o singular incomum “tribo” no texto principal, explicado em nota, e traduz-se φωνή de modo idiomático como “som”.
