base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/064.yaml
  text: And they recognized that those from the captivity were building the temple for the Lord God of Israel[a][b].
translation:
  language: pt
  text: E reconheceram que os do cativeiro estavam construindo o templo para o Senhor Deus de Israel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os exilados”, em vez de “os do cativeiro”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estavam construindo o templo ao Senhor Deus de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωσαν
  choice: reconheceram
  rationale: O aoristo de ἐπιγινώσκω indica que chegaram a reconhecer claramente a situação; “reconheceram” preserva esse valor sem o reduzir simplesmente a receber uma informação.
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  choice: os que tinham voltado do cativeiro
  rationale: A expressão significa literalmente “os do cativeiro” e identifica os deportados que retornaram. A explicitação de “voltado” torna a referência natural e clara em português, sem substituir a imagem do cativeiro por um termo interpretativo.
- source_word: οἰκοδομοῦσιν
  choice: estavam construindo
  rationale: O presente no discurso indireto descreve uma ação em andamento; o imperfeito progressivo harmoniza-se naturalmente com o verbo narrativo no passado.
- source_word: τὸν ναόν
  choice: o templo
  rationale: Neste contexto, ναός designa o edifício do templo que estava sendo reconstruído; “templo” é a correspondência corrente e inequívoca.
- source_word: τῷ κυρίῳ θεῷ Ἰσραήλ
  choice: para o Senhor, Deus de Israel
  rationale: O dativo junto ao verbo construir admite valor de destinatário ou finalidade. “Para” é idiomático em português e comunica que o templo era destinado ao Senhor. A vírgula apresenta “Deus de Israel” como título em aposição.
theological_decisions:
- issue: Tradução de κύριος em uma fórmula bíblica referente ao Deus de Israel
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” preserva a fórmula bíblica tradicional κύριος θεὸς Ἰσραήλ e sua continuidade no uso da Septuaginta, sem introduzir uma interpretação denominacional.
- issue: Valor do dativo em τῷ κυρίῳ θεῷ Ἰσραήλ
  choice: para o Senhor, Deus de Israel
  alternative: ao Senhor, Deus de Israel
  rationale: O grego permite entender o dativo como destinatário, dedicação ou benefício. O texto principal emprega “para”, mais natural com “construir” neste contexto, e a nota conserva a alternativa formal “ao”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação mantém a progressão narrativa e conserva em notas as alternativas genuínas da expressão sobre o cativeiro e do dativo grego.
