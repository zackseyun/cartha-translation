base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/065.yaml
  text: And coming to Zerubbabel and Jeshua and the heads of the fathers’ houses[a], they said to them, “We will build with you.”
translation:
  language: pt
  text: 'Então eles se aproximaram de Zorobabel, de Jesua e dos chefes das famílias e lhes disseram: “Construiremos com vocês[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nós nos uniremos a vocês na construção.” O verbo grego significa construir juntamente com alguém, e não apenas oferecer ajuda em sentido geral.'
    reason: Alternativa lexical que explicita a força associativa do verbo composto συνοικοδομέω.
lexical_decisions:
- source_word: προσελθόντες
  choice: se aproximaram de
  rationale: O particípio aoristo indica a aproximação anterior à fala. A forma verbal finita torna a sequência natural em português sem perder a relação temporal.
- source_word: τῷ Ζοροβαβὲλ καὶ Ἰησοῦ
  choice: de Zorobabel, de Jesua
  rationale: Empregam-se as formas tradicionalmente reconhecíveis em português para os nomes do período pós-exílico. “Jesua” evita a associação indevida com Jesus do Novo Testamento.
- source_word: τοῖς ἡγουμένοις τῶν πατριῶν
  choice: dos chefes das famílias
  rationale: ἡγούμενοι designa os que exercem liderança, enquanto πατριαί se refere a grupos familiares ou linhagens. “Chefes das famílias” comunica com clareza a estrutura social indicada.
- source_word: Συνοικοδομήσομεν ὑμῖν
  choice: Construiremos com vocês
  rationale: O futuro de συνοικοδομέω expressa construir juntamente com outras pessoas. “Construiremos com vocês” preserva a força do composto grego de modo direto e idiomático.
theological_decisions:
- issue: Forma portuguesa de Ἰησοῦ no contexto pós-exílico
  choice: Jesua
  alternative: Jesus ou Josué
  rationale: A personagem é o sumo sacerdote do período da restauração, não Jesus do Novo Testamento. “Jesua” mantém a identificação histórica e evita uma ressonância cristológica não pretendida pelo contexto.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. “Vocês” favorece ampla legibilidade brasileira; “famílias” comunica o sentido de linhagens ou casas paternas sem reproduzir um idiomatismo pouco natural.
