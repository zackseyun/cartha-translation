  - severity: low
    issue: Formulação da nota a
    rationale: «Inscrição sacerdotal» pode sugerir uma inscrição escrita. «Registro sacerdotal» ou «inscrição deles no sacerdócio» expressa melhor o provável sentido de cadastro, preservando a elipse do texto.
