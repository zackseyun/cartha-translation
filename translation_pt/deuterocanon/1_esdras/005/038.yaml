  source_fidelity: A tradução preserva corretamente a construção elíptica grega, a alegação de direito ao sacerdócio e a sequência das famílias. A oração relativa refere-se adequadamente a Iadus. Contudo, «Áugia» desloca o acento em relação ao grego Αὐγία; «Augia» é a transliteração portuguesa mais fiel e não marcada.
  naturalness: O português é claro e mantém apropriadamente o caráter fragmentário e enumerativo do versículo. «Dentre as filhas» é possível, mas «das filhas» é mais fluente neste contexto sem reduzir a informação da fonte.
  terminology: «Reivindicavam o sacerdócio» comunica bem uma alegação de direito sacerdotal. A nota deve falar em registro ou inscrição sacerdotal, não em «inscrição sacerdotal» como se fosse uma inscrição epigráfica.
