base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/038.yaml
  text: 'And from the priests[a], those who claimed the priesthood, but were not found: the sons of Obbeia, the sons of Akbos, the sons of Iaddous, who had taken Augia as a wife from the daughters of Phaexeldai[b],'
translation:
  language: pt
  text: 'E, dentre os sacerdotes, os que reivindicavam o sacerdócio, mas não foram encontrados[a]: os filhos de Obeia, os filhos de Acbos e os filhos de Iadus, que havia tomado Augia por esposa, das filhas de Faexeldai[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego é elíptico: “não foram encontrados” provavelmente significa que não se encontrou o registro genealógico ou o registro sacerdotal deles, como no relato paralelo de Esdras.'
    reason: lexical_alternative
  - marker: b
    text: Os nomes próprios neste trecho diferem dos encontrados no paralelo aproximado do Texto Massorético. A tradução segue o texto grego de 1 Esdras, sem harmonizá-lo com Esdras ou Neemias.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκ τῶν ἱερέων
  choice: dentre os sacerdotes
  rationale: Expressa naturalmente que o grupo mencionado pertencia à classe sacerdotal, preservando o valor partitivo de ἐκ com o genitivo.
- source_word: οἱ ἐμποιούμενοι ἱερωσύνης
  choice: os que reivindicavam o sacerdócio
  rationale: O particípio indica que essas pessoas alegavam direito ao sacerdócio, não simplesmente que exerciam funções sacerdotais.
- source_word: οὐχ εὑρέθησαν
  choice: não foram encontrados
  rationale: Mantém a elipse do grego, sem inserir no texto principal que não foram encontrados os registros genealógicos ou os nomes, embora esse seja o sentido provável no contexto paralelo.
- source_word: υἱοὶ Ὀββειά; υἱοὶ Ἀκβώς; υἱοὶ Ἰαδδοὺς
  choice: os filhos de Obeia, os filhos de Acbos e os filhos de Iadus
  rationale: Preserva a fórmula genealógica repetida e translitera as formas do testemunho grego, com grafia acessível em português.
- source_word: τοῦ λαβόντος Αὐγίαν γυναῖκα
  choice: que havia tomado Áugia por esposa
  rationale: Reproduz o idioma grego para contrair matrimônio e deixa claro que a oração se refere a Iadus.
- source_word: τῶν θυγατέρων Φαηξελδαίου
  choice: dentre as filhas de Faexeldai
  rationale: Identifica Áugia como pertencente ao grupo das filhas de Faexeldai e segue o nome preservado no texto grego.
theological_decisions:
- issue: A natureza da alegação sacerdotal e daquilo que não foi encontrado
  choice: Preservar no texto a alegação ao sacerdócio e a elipse de “não foram encontrados”
  alternative: Explicitar que os registros genealógicos deles não foram encontrados
  rationale: O contexto favorece uma questão de comprovação genealógica, mas o grego não nomeia expressamente o registro ausente; a explicação fica na nota, evitando resolver no corpo do texto o que a fonte deixa implícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura de lista e a repetição genealógica foram preservadas; os nomes foram transliterados a partir do grego com ortografia natural em português.
