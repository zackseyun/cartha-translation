lexical_decisions:
- source_word: υἱοὶ
  choice: os filhos de
  rationale: Preserva a fórmula genealógica e enumerativa do grego, sem explicitar de modo interpretativo «descendentes».
- source_word: ἱεροψάλται
  choice: cantores do templo
  rationale: Expressa em português corrente a função cultual indicada pelo composto grego, isto é, cantores ligados ao serviço sagrado do templo.
- source_word: υἱοὶ Ἀσάφ
  choice: os filhos de Asafe
  rationale: Mantém a repetição da fórmula grega e identifica o grupo de cantores por sua linhagem tradicional.
- source_word: ἑκατὸν εἴκοσι ὀκτώ
  choice: cento e vinte e oito
  rationale: Forma cardinal natural e padrão em português moderno.
