base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/001.yaml
  text: After these things[a], the heads of ancestral houses, according to their tribes, were chosen to go up, along with their wives and their sons and daughters, and their male servants and female servants, and their livestock.
translation:
  language: pt
  text: Depois desses acontecimentos, foram escolhidos para subir os chefes das casas paternas, segundo suas tribos, juntamente com suas esposas, seus filhos e suas filhas, seus servos e suas servas[a], e seus animais de criação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus escravos e suas escravas”. Os termos gregos podem designar escravos ou servos da casa; “servos e servas” preserva as formas masculina e feminina sem definir, com base apenas neste versículo, a condição jurídica dessas pessoas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Depois disso
  rationale: Expressa com naturalidade a transição temporal e mantém a ligação com os acontecimentos anteriores.
- source_word: ἐξελέγησαν
  choice: foram escolhidos
  rationale: Reproduz diretamente a forma passiva sem sugerir uma nomeação formal não explicitada pelo texto.
- source_word: ἀναβῆναι
  choice: para subir
  rationale: Preserva o sentido literal e o idioma bíblico da viagem de subida, sem acrescentar um destino que o versículo não menciona.
- source_word: ἀρχηγοὶ οἴκου πατριῶν
  choice: os chefes das casas paternas
  rationale: Comunica a liderança das unidades familiares ou clânicas ligadas à linhagem paterna, em formulação bíblica ainda compreensível.
- source_word: κατὰ φυλὰς αὐτῶν
  choice: segundo as suas tribos
  rationale: Mantém o sentido distributivo ou classificatório de κατά.
- source_word: αἱ γυναῖκες αὐτῶν
  choice: suas esposas
  rationale: No contexto da enumeração doméstica, γυναῖκες designa mais naturalmente as esposas.
- source_word: οἱ υἱοὶ καὶ αἱ θυγατέρες
  choice: seus filhos e suas filhas
  rationale: Conserva a distinção explícita entre filhos e filhas presente no grego.
- source_word: οἱ παῖδες αὐτῶν
  choice: seus servos
  rationale: Como filhos e filhas já foram mencionados, o termo provavelmente designa membros masculinos do serviço doméstico; 'servos' evita a modernização implícita em 'empregados'.
- source_word: αἱ παιδίσκαι
  choice: suas servas
  rationale: Mantém a forma feminina correspondente e a estrutura paralela da enumeração, sem decidir no texto principal o estatuto jurídico preciso.
- source_word: τὰ κτήνη αὐτῶν
  choice: seus animais
  rationale: Designa de modo amplo e natural os animais domésticos ou de criação levados pelo grupo, sem restringir o sentido a gado bovino.
