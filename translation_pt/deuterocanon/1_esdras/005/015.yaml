base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/015.yaml
  text: The sons of Azeir Ezekias[a], the sons of Keilan and Azetas, sixty-seven; the sons of Azaros, four hundred thirty-two.
translation:
  language: pt
  text: Os filhos de Azeir Ezequias[a], os filhos de Queilã e Azetas, sessenta e sete; os filhos de Azaro, quatrocentos e trinta e dois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Os nomes gregos deste versículo diferem bastante do paralelo massorético aproximado, que, no ponto correspondente da lista, traz: “os filhos de Adin, quatrocentos e cinquenta e quatro”. Como 1 Esdras às vezes reorganiza ou reformula essas listas de repatriados, segue-se aqui o testemunho grego, sem harmonizá-lo com o paralelo hebraico.'
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: os filhos de
  rationale: Na lista censitária, a expressão funciona como fórmula genealógica ou de clã. A tradução formal preserva a estrutura grega sem excluir o sentido mais amplo de descendentes.
- source_word: Ἀζὴρ Ἐζεκίου
  choice: Azer Ezequias
  rationale: Os nomes são transliterados a partir do grego, com formas naturais em português. A construção exata e os equivalentes semíticos são incertos, por isso não se harmoniza o texto com o paralelo massorético.
- source_word: Κειλὰν
  choice: Quilã
  rationale: Transliteração portuguesa do nome grego, usando Qu para representar o som inicial e ã para uma forma final natural, sem identificá-lo com outro nome conhecido.
- source_word: Ἀζητάς
  choice: Azetas
  rationale: Transliteração direta do nome preservado no testemunho grego, sem harmonização com a lista hebraica divergente.
- source_word: ἐξήκοντα ἑπτά
  choice: sessenta e sete
  rationale: Tradução direta do numeral, por extenso, conforme o registro de uma lista bíblica.
- source_word: Ἀζάρου
  choice: Azaro
  rationale: Transliteração da forma grega em genitivo, removendo a desinência casual sem substituir o nome por uma forma do paralelo hebraico.
- source_word: τετρακόσιοι τριάκοντα δύο
  choice: quatrocentos e trinta e dois
  rationale: Tradução exata e idiomática do numeral grego.
