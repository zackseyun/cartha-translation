base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/008.yaml
  text: And each returned to Jerusalem and the rest of Judea[a], each to his own city—the ones who had come with Zerubbabel and Jeshua, Nehemiah, Zareiah, Resaiah, Enenius, Mordecai, Beelsarus, Aspharasus, Boroelius, Roimus, and Baanah, their leaders.
translation:
  language: pt
  text: 'E cada um voltou para Jerusalém e para o restante da Judeia, cada qual para a sua própria cidade: os que tinham vindo com Zorobabel e Jesua, Neemias, Zareias, Resaias, Enênio, Mardoqueu, Beelsaro, Asfaraso, Boroleu, Roimo e Baaná, seus líderes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vários nomes desta lista têm formas diferentes nas passagens aproximadamente paralelas de Esdras e Neemias. A tradução segue o texto grego de 1 Esdras, sem uniformizar os nomes segundo as formas hebraicas.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: voltou
  rationale: O verbo indica retorno a um lugar anterior. Em português, “voltou” expressa isso de maneira direta e natural; o sujeito distributivo é explicitado por “cada um”.
- source_word: τὴν λοιπὴν Ἰουδαίαν
  choice: o restante da Judeia
  rationale: Preserva o sentido de λοιπή, distinguindo Jerusalém das demais partes da Judeia.
- source_word: ἕκαστος εἰς τὴν ἰδίαν πόλιν
  choice: cada qual para a sua própria cidade
  rationale: Mantém a construção distributiva e a referência singular do grego, com formulação portuguesa clara.
- source_word: οἱ ἐλθόντες
  choice: os que tinham vindo
  rationale: Traduz o particípio substantivado e usa o mais-que-perfeito composto para situar a vinda antes do retorno narrado.
- source_word: Ζοροβαβὲλ καὶ Ἰησοῦ
  choice: Zorobabel e Jesua
  rationale: “Zorobabel” é a forma portuguesa consagrada; “Jesua” identifica com clareza o líder pós-exílico e evita confusão desnecessária com Jesus de Nazaré.
- source_word: proper-name list
  choice: Neemias, Zareias, Resaias, Enênio, Mardoqueu, Beelsaro, Asfaraso, Boroleu, Roimo e Baaná
  rationale: As formas são adaptadas à ortografia e pronúncia portuguesas a partir da lista grega, sem uniformizá-las silenciosamente com listas hebraicas paralelas.
- source_word: τῶν προηγουμένων αὐτῶν
  choice: seus líderes
  rationale: No contexto, o particípio designa os que iam à frente do grupo, isto é, seus líderes; evita-se o sentido inadequado de “predecessores”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A ordem foi levemente ajustada para “cada um voltou”, tornando natural em português a concordância entre o verbo singular grego e a expressão distributiva. Os nomes próprios seguem prioritariamente a evidência grega, com adaptação ortográfica portuguesa.
