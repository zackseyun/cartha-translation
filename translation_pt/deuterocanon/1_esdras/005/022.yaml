base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/022.yaml
  text: the sons of Kalamokalos and Onous[a], seven hundred twenty-five; the sons of Jericho, two hundred forty-five;
translation:
  language: pt
  text: os filhos de Calamócalo e de Onus[a], setecentos e vinte e cinco; os filhos de Jericó, duzentos e quarenta e cinco;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo hebraico na tradição de Esdras-Neemias diverge consideravelmente neste ponto e diz, aproximadamente: “os homens de Betel e Ai, duzentos e vinte e três”. O testemunho grego de 1 Esdras preserva nomes e totais diferentes.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: os filhos de
  rationale: Preserva a fórmula genealógica do grego nesta lista censitária; no contexto, designa um grupo familiar ou clã, não apenas filhos imediatos.
- source_word: Καλαμωκάλου
  choice: Calamócalo
  rationale: Translitera e adapta à ortografia portuguesa o nome próprio preservado pelo testemunho grego, sem harmonizá-lo com o paralelo hebraico divergente.
- source_word: Ὠνούς
  choice: Onus
  rationale: Representa em português a forma grega do nome próprio, mantendo a leitura do testemunho primário.
- source_word: ἑπτακόσιοι εἴκοσι πέντε
  choice: setecentos e vinte e cinco
  rationale: Tradução direta e idiomática do numeral cardinal grego.
- source_word: Ἰερήχου
  choice: Jericó
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para o topônimo.
- source_word: διακόσιοι τεσσεράκοντα πέντε
  choice: duzentos e quarenta e cinco
  rationale: Tradução direta e natural do numeral cardinal grego.
theological_decisions:
- issue: Relação entre o testemunho grego e o paralelo aproximado do Texto Massorético nesta lista censitária
  choice: Traduzir os nomes e totais do grego tal como aparecem.
  alternative: Harmonizar o versículo com o paralelo hebraico, que traz aproximadamente “os homens de Betel e Ai, duzentos e vinte e três”.
  rationale: O grego de 1 Esdras é o testemunho-fonte primário indicado. A divergência substancial de nomes e números deve permanecer visível, em vez de ser silenciosamente resolvida por harmonização.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A estrutura enumerativa e a fórmula repetida “os filhos de” preservam o caráter censitário do grego; os nomes gregos foram adaptados à ortografia portuguesa sem harmonização com o hebraico.
