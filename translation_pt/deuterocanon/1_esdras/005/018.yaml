translation:
  language: pt
  text: os de Netebas[a], cinquenta e cinco; os de Enatos, cento e cinquenta e oito; os de Baitasmon Zammot[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os nomes gregos deste versículo diferem consideravelmente do paralelo hebraico aproximado de Neemias 7:25, que, na tradição massorética, traz «os filhos de Gibar, noventa e cinco». Como 1 Esdras preserva aqui outra forma da lista e outros nomes, a tradução acompanha de perto o texto grego, sem harmonizá-lo com o hebraico.
    reason: textual_variant
  - marker: b
    text: O último nome de lugar é textualmente difícil em grego e pode representar um topônimo composto ou corrompido; por isso, foi preservado por transliteração.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ
  choice: os de
  rationale: Na fórmula de lista censitária, identifica grupos por sua procedência. A expressão concisa e natural preserva o sentido locativo sem importar «filhos de» do paralelo hebraico aproximado.
- source_word: Νετέβας
  choice: Netebas
  rationale: Transliteração direta do nome próprio grego, sem harmonização conjectural com o texto massorético.
- source_word: πεντήκοντα πέντε
  choice: cinquenta e cinco
  rationale: Tradução direta do numeral cardinal.
- source_word: Ἐνάτου
  choice: Enatos
  rationale: Forma portuguesa legível, derivada do genitivo grego e tratada como topônimo.
- source_word: ἑκατὸν πεντήκοντα ὀκτώ
  choice: cento e cinquenta e oito
  rationale: Tradução direta e idiomática do numeral cardinal.
- source_word: Βαιτασμῶν Ζαμμώθ
  choice: Baitasmon Zamot
  rationale: Transliteração próxima da expressão grega difícil, sem normalização especulativa; «Zamot» adapta o θ final à forma portuguesa usual.
