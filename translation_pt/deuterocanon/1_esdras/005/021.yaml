  text: those from Makalon[a], one hundred twenty-two; those from Betolio, fifty-two; Neipheis, one hundred fifty-six.
translation:
  language: pt
  text: os de Macalon[a], cento e vinte e dois; os de Betolio, cinquenta e dois; Neiféis, cento e cinquenta e seis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo hebraico em Neemias 7:25 diz: “os filhos de Ramá e Geba, seiscentos e vinte e um”. Aqui, 1 Esdras preserva nomes e números substancialmente diferentes.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἐκ
  choice: os de
  rationale: A construção identifica grupos por sua procedência. “Os de” é natural e conciso em português e não importa do paralelo hebraico a expressão “filhos de”.
- source_word: Μακαλών
  choice: Macalon
  rationale: Transliteração direta da forma grega, sem harmonização especulativa com nomes distintos do paralelo hebraico.
- source_word: Βετολιώ
  choice: Betolio
  rationale: Transliteração da forma grega; a instabilidade dos topônimos entre as testemunhas recomenda preservar o nome da fonte primária.
- source_word: Νειφείς
  choice: Neiféis
  rationale: Transliteração adaptada à ortografia e à pronúncia portuguesa da forma grega, tratada como nome de procedência em continuidade com os grupos anteriores.
- source_word: ἑκατὸν εἴκοσι δύο
  choice: cento e vinte e dois
  rationale: Forma cardinal corrente e clara em português.
- source_word: πεντήκοντα δύο
  choice: cinquenta e dois
  rationale: Forma cardinal corrente e clara em português.
- source_word: ἑκατὸν πεντήκοντα ἕξ
  choice: cento e cinquenta e seis
  rationale: Forma cardinal corrente e clara em português.
theological_decisions:
- issue: Uso do paralelo massorético quando nomes e números divergem da lista grega
  choice: Traduzir no texto principal a lista grega tal como preservada e registrar em nota a divergência do paralelo hebraico.
  alternative: 'Harmonizar com Neemias 7:25: “os filhos de Ramá e Geba, seiscentos e vinte e um”.'
  rationale: A fonte primária de 1 Esdras é o texto grego. A divergência é substancial demais para harmonização silenciosa; a nota mantém transparência sobre a tradição paralela.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a estrutura concisa de uma lista e transliteram-se os nomes próprios a partir do grego.
