base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/054.yaml
  text: And in the second year[a], when they had come to the house of God in Jerusalem, in the second month, Zerubbabel son of Shealtiel and Jeshua son of Jozadak began, along with their brothers, the priests, the Levites, and all who had come from the captivity to Jerusalem[b],
translation:
  language: pt
  text: No segundo ano, depois de chegarem ao santuário de Deus[a], em Jerusalém, no segundo mês, Zorobabel, filho de Salatiel, e Jesua, filho de Jozadaque, começaram, juntamente com seus irmãos, os sacerdotes, os levitas e todos os que tinham vindo do cativeiro para Jerusalém[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “templo de Deus” ou “casa de Deus”. O termo grego pode referir-se ao conjunto sagrado de modo mais amplo.
    reason: lexical_alternative
  - marker: b
    text: Ou “todos os que tinham voltado do exílio”. O grego diz mais literalmente “do cativeiro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ δευτέρῳ ἔτει
  choice: No segundo ano
  rationale: Equivalente temporal direto e natural em português.
- source_word: παραγενόμενοι
  choice: depois de chegarem
  rationale: O particípio indica uma chegada anterior ao início da ação expressa por ἤρξαντο.
- source_word: τὸ ἱερὸν τοῦ θεοῦ
  choice: o santuário de Deus
  rationale: ἱερόν pode designar o templo ou o conjunto sagrado; “santuário” preserva essa amplitude sem impor uma referência exclusivamente arquitetônica.
- source_word: μηνὸς δευτέρου
  choice: no segundo mês
  rationale: Forma idiomática de expressar o genitivo temporal.
- source_word: ἤρξαντο
  choice: começaram
  rationale: Mantém o verbo narrativo sem completar seu objeto, que vem na continuação do texto.
- source_word: Ζοροβαβὲλ ὁ τοῦ Σαλαθιήλ
  choice: Zorobabel, filho de Salatiel
  rationale: Emprega as formas tradicionais e reconhecíveis dos nomes em português e explicita naturalmente o patronímico.
- source_word: Ἰησοῦς ὁ τοῦ Ἰωσεδέκ
  choice: Jesua, filho de Jozadaque
  rationale: Usa a forma pós-exílica corrente em português, evitando confusão desnecessária com Jesus do Novo Testamento.
- source_word: οἱ ἀδελφοὶ αὐτῶν
  choice: seus irmãos
  rationale: Preserva o termo familiar masculino empregado pelo grego, sem o ampliar interpretativamente para “compatriotas”.
- source_word: οἱ ἱερεῖς οἱ Λευεῖται
  choice: os sacerdotes, os levitas
  rationale: Conserva a apresentação formal dos grupos no grego e evita fundi-los no título interpretativo “sacerdotes levitas”.
- source_word: πάντες οἱ παραγενόμενοι ἐκ τῆς αἰχμαλωσίας
  choice: todos os que tinham vindo do cativeiro
  rationale: Mantém a imagem concreta de αἰχμαλωσία e exprime a anterioridade da chegada.
theological_decisions:
- issue: Sentido do local de culto τὸ ἱερὸν τοῦ θεοῦ no contexto da restauração
  choice: o santuário de Deus
  alternative: a casa de Deus; o templo de Deus
  rationale: “Santuário” preserva a possível referência ao espaço sagrado mais amplo. A nota registra as alternativas legítimas sem decidir uma questão arquitetônica que o termo grego não resolve sozinho.
- issue: Alcance de οἱ ἀδελφοὶ αὐτῶν
  choice: seus irmãos
  alternative: seus parentes; seus compatriotas
  rationale: A tradução conserva a linguagem familiar masculina do texto, sem substituir o termo por uma identificação étnica ou social mais específica.
- issue: Relação entre οἱ ἱερεῖς e οἱ Λευεῖται
  choice: os sacerdotes, os levitas
  alternative: os sacerdotes levitas
  rationale: A repetição dos artigos permite conservar a enumeração formal e evita transformar os termos em um único título composto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas onomásticas tradicionais. A vírgula final foi mantida porque o versículo termina com uma oração cuja ação continua no contexto seguinte.
