lexical_decisions:
- source_word: υἱοὶ
  choice: os filhos de
  rationale: Mantém a fórmula repetitiva da lista grega e sua identificação formal de famílias ou clãs, sem substituir a expressão pela interpretação mais ampla «descendentes de».
- source_word: Ἰαείρου
  choice: Iaeir
  rationale: Transliteração conservadora do nome tal como preservado no grego, sem harmonizá-lo com a lista hebraica divergente.
- source_word: Δαισάν
  choice: Daisã
  rationale: Forma aportuguesada próxima do grego, com terminação nasal natural em português.
- source_word: Νοεβά
  choice: Noebá
  rationale: Transliteração direta, com acento gráfico para preservar a tonicidade final indicada pelo grego.
- source_word: Χασεβά
  choice: Casebá
  rationale: Adaptação à ortografia portuguesa; C diante de A representa naturalmente o som consonantal inicial, evitando que «Ch» seja lido à maneira portuguesa.
- source_word: Καζηρά
  choice: Kazerá
  rationale: Transliteração conservadora que mantém o K distintivo do texto grego e assinala a tonicidade final.
- source_word: Ὀζείου
  choice: Ozeiu
  rationale: Representa de modo próximo a forma grega transmitida, sem normalizá-la para outro nome bíblico incerto.
- source_word: Φινόε
  choice: Finoé
  rationale: Phi é vertido por F em português, e o acento preserva a tonicidade do nome grego.
- source_word: Ἀσαρά
  choice: Asará
  rationale: Transliteração direta com tonicidade final marcada.
- source_word: Βασθαί
  choice: Bastai
  rationale: Conserva o grupo consonantal e o ditongo da forma grega sem conjecturar uma equivalência hebraica.
- source_word: Ἀσσανά
  choice: Assaná
  rationale: Mantém o sigma duplo na forma aportuguesada e a tonicidade final.
- source_word: Μανεί
  choice: Manei
  rationale: Transliteração próxima da grafia grega, sem normalização especulativa.
- source_word: Ναφεισεί
  choice: Nafeisei
  rationale: Transliteração direta adaptada ao sistema gráfico português.
- source_word: Ἀκούφ
  choice: Acuf
  rationale: Kappa é representado por C diante de U e phi por F, segundo leitura natural em português.
- source_word: Ἀχειβά
  choice: Aqueibá
  rationale: A sequência inicial é adaptada com «qu» para indicar o som oclusivo diante de E, e o acento preserva a tonicidade final.
- source_word: Ἀσούρ
  choice: Assur
  rationale: Mantém o sigma duplo e translitera a forma grega sem identificá-la à força com outro nome conhecido.
- source_word: Φαρακέμ
  choice: Faraquém
  rationale: Phi é vertido por F e kappa por «qu» diante de E; o acento gráfico assegura a pronúncia final indicada pelo grego.
