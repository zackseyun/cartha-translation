  text: os filhos de Iaeir[a], os filhos de Daisan, os filhos de Noebá, os filhos de Casebá, os filhos de Kazerá, os filhos de Ozeiou, os filhos de Finoé, os filhos de Asará, os filhos de Bastai, os filhos de Assaná, os filhos de Manei, os filhos de Nafeisei, os filhos de Acuf, os filhos de Aqueibá, os filhos de Assur, os filhos de Faraquém,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo hebraico de Neemias 7:46 traz nomes diferentes neste ponto: «os servidores do templo: os filhos de Zia, os filhos de Hasufa, os filhos de Tabaote». Aqui, 1 Esdras preserva uma lista grega consideravelmente diferente; por isso, a tradução segue o texto grego, sem harmonizá-lo com o paralelo hebraico.'
