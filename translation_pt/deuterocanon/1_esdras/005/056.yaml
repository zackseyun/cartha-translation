base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/056.yaml
  text: And they appointed the Levites[a], from twenty years old and upward, over the works of the Lord. Then Jeshua stood with his sons and brothers, and Kadmiel his brother, and the sons of Jeshua son of Henadad, and the sons of Judah son of Eliadun, together with their sons and brothers—all the Levites, united as supervisors of the work, carrying on the works in the house of the Lord[d][c][b]. And the builders built the temple of the Lord.
translation:
  language: pt
  text: Eles encarregaram os levitas de vinte anos para cima das obras do Senhor. Então Jesua tomou seu lugar com seus filhos e irmãos, bem como Cadmiel, seu irmão,[a] os filhos de Jesua, filho de Henadade,[b] e os filhos de Judá, filho de Eliadum, junto com seus filhos e irmãos — todos os levitas, unidos, como supervisores dos trabalhos, trabalhando nas obras na casa do Senhor.[c][d] E os construtores construíram o templo do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz Damadiel; a tradição paralela de Esdras identifica este levita como Cadmiel.
    reason: alternative_reading
  - marker: b
    text: O grego traz a sequência difícil «os filhos de Jesua Hemadabum», sem expressar de modo inequívoco a relação entre os nomes. Hemadabum provavelmente representa o nome Henadade da tradição hebraica paralela; por isso, o texto adota provisoriamente «filho de Henadade».
    reason: textual_difficulty
  - marker: c
    text: «Supervisores dos trabalhos» traduz um termo grego raro que designa os que conduzem, supervisionam ou impulsionam o trabalho.
    reason: lexical_alternative
  - marker: d
    text: O grego emprega «obras» no plural tanto no começo quanto nesta parte do versículo; algumas traduções preferem o singular coletivo «obra».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστησαν
  choice: encarregaram
  rationale: Com os levitas postos ἐπὶ τῶν ἔργων, o verbo indica designação para uma responsabilidade, não apenas posição física.
- source_word: ἀπὸ εἰκοσαετοῦς
  choice: de vinte anos para cima
  rationale: Expressa de modo natural o limite mínimo de idade implícito na construção grega.
- source_word: ἐπὶ τῶν ἔργων τοῦ κυρίου
  choice: das obras do Senhor
  rationale: O contexto indica responsabilidade e supervisão sobre as obras; mantém-se o plural do grego.
- source_word: ἔστη Ἰησοῦς
  choice: Jesua tomou seu lugar
  rationale: Preserva a imagem de apresentar-se ou posicionar-se para a tarefa sem sugerir simplesmente que ele se levantou.
- source_word: Δαμαδιὴλ
  choice: Cadmiel
  rationale: A forma grega parece uma distorção textual; a tradição paralela de Esdras identifica de modo plausível o levita como Cadmiel. A nota registra a forma do texto grego.
- source_word: Ἡμαδαβούν
  choice: Henadade
  rationale: A forma grega provavelmente representa o nome semítico conhecido Henadade; a incerteza textual é explicitada em nota.
- source_word: Ἰούδα τοῦ Εἰλιαδοὺν
  choice: Judá, filho de Eliadum
  rationale: O genitivo é entendido como filiação. Os nomes menos seguros permanecem próximos à forma do testemunho grego.
- source_word: ὁμοθυμαδόν
  choice: unidos
  rationale: Comunica propósito comum e ação coordenada em português atual.
- source_word: ἐργοδιῶκται
  choice: dirigiam os trabalhos
  rationale: O raro composto designa pessoas que conduzem, supervisionam ou impulsionam o trabalho; a formulação evita a conotação opressiva de 'feitores'.
- source_word: ποιοῦντες εἰς τὰ ἔργα
  choice: executavam as obras
  rationale: A expressão grega é incomum, mas indica participação ativa no avanço das obras; o plural é preservado.
- source_word: οἰκοδόμησαν οἱ οἰκοδόμοι
  choice: os construtores construíram
  rationale: Mantém deliberadamente a repetição cognata do verbo e do substantivo no grego.
- source_word: ναὸν τοῦ κυρίου
  choice: templo do Senhor
  rationale: ναός é distinguido de οἶκος, traduzido anteriormente como 'casa', preservando a diferença lexical.
theological_decisions:
- issue: Tradução de κύριος no contexto da construção do templo
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte direta é o grego κύριος. 'Senhor' conserva essa forma sem retroverter obrigatoriamente para o nome divino hebraico.
- issue: Normalização de nomes próprios possivelmente corrompidos no testemunho grego
  choice: Cadmiel e Henadade no texto, com as formas gregas em notas
  alternative: Damadiel e Hemadabum no texto principal
  rationale: As correspondências com a tradição paralela são fortes o bastante para oferecer nomes reconhecíveis, mas as notas preservam transparentemente a evidência grega e sua incerteza.
- issue: Relação sintática em οἱ υἱοὶ Ἰησοῦ Ἡμαδαβούν
  choice: os filhos de Jesua, filho de Henadade
  alternative: os filhos de Jesua Hemadabum
  rationale: A redação grega transmitida é difícil e provavelmente sofreu corrupção. A leitura adotada segue a identificação tradicional refletida na camada inglesa, enquanto a nota informa a forma literal e evita ocultar o problema textual.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas de nomes familiares ao uso bíblico em português. A sintaxe foi dividida em frases manejáveis, sem eliminar a repetição intencional de “construtores construíram” nem o plural “obras” do grego.
