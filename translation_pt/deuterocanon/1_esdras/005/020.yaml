base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/020.yaml
  text: the sons of Chadiasai and Ammidioi[a], four hundred twenty-two; the sons of Keiramas Kabbes, six hundred twenty-one[b];
translation:
  language: pt
  text: os de Cadiasai e Amídioi[a], quatrocentos e vinte e dois; os provenientes de Queiramas Cabes, seiscentos e vinte e um[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente algo como “os Cadiasai e Amídioi”. Em razão do estilo abreviado desta lista, a expressão pode indicar famílias, clãs ou grupos associados a esses nomes; por isso, não se acrescentou “filhos de” ao texto.
    reason: ambiguity
  - marker: b
    text: A sequência grega “Queiramas Cabes” é incomum e não contém a conjunção “e”. Além disso, o paralelo hebraico em Esdras-Neemias difere bastante nos nomes e nos números neste ponto. A tradução segue o texto grego como testemunho principal.
    reason: textual_variant
lexical_decisions:
- source_word: οἱ Χαδιάσαι καὶ Ἀμμίδιοι
  choice: os de Cadiasai e Amídioi
  rationale: O artigo plural substantivado designa dois grupos em uma lista censitária, mas o grego não traz explicitamente “filhos”. A formulação “os de” comunica a associação familiar ou local sem eliminar essa ambiguidade. Os nomes seguem o testemunho grego, com transliteração adaptada ao português.
- source_word: τετρακόσιοι εἴκοσι δύο
  choice: quatrocentos e vinte e dois
  rationale: Correspondência direta do numeral cardinal em forma natural no português atual.
- source_word: οἱ ἐκ Κειράμας Κάββης
  choice: os provenientes de Queiramas Cabes
  rationale: A preposição ἐκ expressa procedência ou associação de origem. “Provenientes de” preserva esse valor mais explicitamente do que a fórmula interpretativa “filhos de”. A sequência Queiramas Cabes não contém conjunção no grego e, por isso, é mantida sem inserir “e”.
- source_word: ἑξακόσιοι εἴκοσι εἷς
  choice: seiscentos e vinte e um
  rationale: Correspondência direta do numeral cardinal em português corrente.
