base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/067.yaml
  text: Then Zerubbabel and Jeshua and the heads of the fathers’ houses of Israel said to them[b][a], “It is not for you to build the house for the Lord our God.”
translation:
  language: pt
  text: 'Então Zorobabel, Jesua[a] e os chefes das famílias de Israel lhes disseram: “Não cabe a vocês construir a casa[b] para o Senhor, nosso Deus.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz Ἰησοῦς, nome do sumo sacerdote pós-exílico geralmente chamado Jesua; outra tradução possível é “Josué”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o templo”; literalmente, “a casa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζοροβαβὲλ
  choice: Zorobabel
  rationale: Forma tradicional em português para o conhecido líder do período pós-exílico.
- source_word: Ἰησοῦς
  choice: Jesua
  rationale: Neste contexto, designa o sumo sacerdote pós-exílico; a forma distingue a personagem de Jesus e corresponde ao nome usual em português neste relato.
- source_word: οἱ ἡγούμενοι τῶν πατριῶν
  choice: os chefes das famílias patriarcais
  rationale: Expressa a liderança dos grupos familiares ancestrais sem recorrer ao pouco natural literalismo 'casas dos pais'.
- source_word: Οὐχ ὑμῖν τοῦ οἰκοδομῆσαι
  choice: Não cabe a vocês construir
  rationale: Torna natural em português a construção grega elíptica, preservando a exclusão sem acrescentar a formulação mais extensa do paralelo de Esdras.
- source_word: τὸν οἶκον
  choice: a casa
  rationale: Preserva o sentido literal e a expressão bíblica para o santuário, enquanto uma nota esclarece que se trata do templo.
- source_word: Κυρίῳ θεῷ ἡμῶν
  choice: para o Senhor, nosso Deus
  rationale: O dativo com 'construir' é naturalmente expresso por 'para'; a vírgula apresenta 'nosso Deus' como aposto explicativo e preserva a relação entre os termos.
theological_decisions:
- issue: Tradução de κύριος no contexto da construção do templo, em passagem relacionada ao nome divino no paralelo hebraico
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte primária grega traz Κυρίῳ; por isso, traduz-se diretamente como 'Senhor', sem substituir a forma grega pela convenção tipográfica usada para o tetragrama hebraico.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. 'Não cabe a vocês' comunica a elipse grega sem importar detalhes do paralelo canônico; 'famílias patriarcais' mantém a estrutura ancestral do grupo em linguagem inteligível.
