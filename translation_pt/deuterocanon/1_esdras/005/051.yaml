base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/051.yaml
  text: And after these[a], the regular offerings[b], and the sacrifices for Sabbaths and new moons and all the consecrated feasts.
translation:
  language: pt
  text: E, depois de tudo isso, ofereceram as ofertas regulares[a] e os sacrifícios dos sábados, das luas novas e de todas as festas consagradas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofertas contínuas”. O termo grego pode indicar ofertas mantidas continuamente ou apresentadas em intervalos fixos e recorrentes.
    reason: lexical_alternative
  - marker: b
    text: O paralelo hebraico em Esdras destaca o holocausto oferecido “dia após dia, segundo o número determinado para cada dia”. Aqui, 1 Esdras apresenta um resumo mais amplo do calendário sagrado regular.
    reason: cross_reference
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: depois de tudo isso
  rationale: Expressa de modo natural a transição temporal e conserva a referência plural às ações mencionadas anteriormente.
- source_word: προσφορὰς
  choice: ofertas
  rationale: Termo amplo e corrente para aquilo que é apresentado no culto, sem a tonalidade arcaica de “oblações”.
- source_word: ἐνδελεχισμοῦ
  choice: regulares
  rationale: Indica continuidade ou repetição prescrita. “Regulares” comunica o caráter recorrente das ofertas sem restringi-las necessariamente a uma frequência diária.
- source_word: θυσίας
  choice: sacrifícios
  rationale: Mantém a distinção lexical em relação ao termo mais amplo προσφοράς, traduzido por “ofertas”.
- source_word: σαββάτων
  choice: sábados
  rationale: Conserva o plural grego e indica as observâncias recorrentes do sábado.
- source_word: νουμηνιῶν
  choice: luas novas
  rationale: Designa as celebrações mensais ligadas à lua nova; a formulação é concisa e tradicionalmente reconhecível.
- source_word: ἑορτῶν πασῶν ἡγιασμένων
  choice: todas as festas consagradas
  rationale: Preserva a totalidade da expressão e o sentido cultual de festas separadas para uso sagrado.
theological_decisions:
- issue: Terminologia do calendário cultual no texto grego de 1 Esdras e sua relação com o paralelo hebraico
  choice: 'Seguir a enumeração mais ampla do grego: ofertas regulares e sacrifícios dos sábados, das luas novas e das festas consagradas.'
  alternative: Harmonizar a redação com o paralelo hebraico de Esdras, destacando o holocausto diário e a quantidade prescrita para cada dia.
  rationale: O grego é a fonte primária para 1 Esdras neste projeto. O paralelo hebraico ajuda a esclarecer o caráter recorrente das ofertas, mas não deve substituir nem estreitar a formulação mais abrangente do texto grego.
- issue: Verbo subentendido na construção grega
  choice: Empregar “ofereceram” para completar naturalmente a oração em português.
  alternative: 'Manter a sequência nominal sem verbo: “E, depois de tudo isso, as ofertas regulares...”'
  rationale: Os acusativos προσφοράς e θυσίας continuam a ação cultual do contexto. A explicitação do verbo em português torna a frase completa sem alterar o conteúdo nem resolver indevidamente uma questão teológica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Depois de tudo isso” evita a rigidez de “depois destas coisas”; “ofereceram” explicita em português o verbo exigido pelo contexto. A terminologia cultual permanece reconhecível sem recorrer a arcaísmos.
