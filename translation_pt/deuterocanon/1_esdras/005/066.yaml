base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/066.yaml
  text: For we also[a], like you, listen to your Lord, and we will sacrifice to him from the days of Asbakaphath king of the Assyrians[c][b], who brought us here.
translation:
  language: pt
  text: Pois, assim como vocês, nós também damos ouvidos ao seu Senhor e lhe ofereceremos sacrifícios[b] desde os dias de Asbacafate[a], rei dos assírios, que nos trouxe para cá[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Asbacafate é a forma do nome no texto grego. O paralelo hebraico de Esdras 4:2 identifica esse rei como Esar-Hadom.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “lhe ofereceremos sacrifício”. O verbo grego se refere especificamente ao culto sacrificial.'
    reason: lexical_alternative
  - marker: c
    text: A expressão “nos trouxe para cá” pode aludir a uma transferência forçada ou ao reassentamento de populações sob o domínio assírio.
    reason: cultural_note
lexical_decisions:
- source_word: ὁμοίως
  choice: assim como vocês, nós também
  rationale: Explicita de modo natural em português a comparação reivindicada pelos falantes, sem acrescentar uma avaliação sobre a veracidade dela.
- source_word: ἀκούομεν
  choice: damos ouvidos a
  rationale: Preserva o campo semântico de ouvir/escutar com possível disposição responsiva, sem chegar à interpretação mais forte de “obedecemos”.
- source_word: τοῦ κυρίου ὑμῶν
  choice: ao seu Senhor
  rationale: Mantém tanto κύριος como o possessivo explícito ὑμῶν; não acrescenta “Deus”, ausente do texto grego.
- source_word: ἐπιθύσομεν
  choice: ofereceremos sacrifícios
  rationale: Reproduz o futuro indicativo e o sentido especificamente sacrificial do verbo. A construção temporal incomum com “desde os dias de” é preservada em vez de se converter o futuro em ação passada contínua.
- source_word: ἀπὸ ἡμερῶν
  choice: desde os dias de
  rationale: Expressa o ponto inicial temporal indicado pelo idioma grego e mantém a tensão sintática com o verbo no futuro.
- source_word: Ἀσβακαφὰθ
  choice: Asbacafate
  rationale: Translitera em forma legível em português o nome próprio atestado no texto grego, deixando sua identificação com Esar-Hadom para a nota.
- source_word: βασιλέως Ἀσσυρίων
  choice: rei dos assírios
  rationale: Segue de perto a expressão etnográfica grega, que diz literalmente “rei dos assírios”.
- source_word: μετήγαγεν
  choice: trouxe
  rationale: Comunica de modo natural o ato de transportar ou conduzir pessoas a outro lugar, sem inserir no texto principal a interpretação mais específica de reassentamento forçado.
- source_word: ἐνταῦθα
  choice: para cá
  rationale: Equivalente idiomático que combina naturalmente com o verbo de movimento “trouxe”.
theological_decisions:
- issue: Se os falantes afirmam adorar a mesma divindade que os repatriados judeus
  choice: 'Apresentar diretamente a alegação: “nós também damos ouvidos ao seu Senhor e lhe ofereceremos sacrifícios”.'
  alternative: Traduzir ἀκούομεν por “obedecemos” ou ampliar κύριος para “o Senhor, seu Deus”.
  rationale: O versículo registra a autodescrição dos falantes sem confirmar nem negar sua sinceridade. “Damos ouvidos” preserva a possível dimensão responsiva de ἀκούομεν, enquanto “seu Senhor” mantém os limites exatos da formulação grega.
- issue: A tensão entre o futuro ἐπιθύσομεν e a expressão temporal ἀπὸ ἡμερῶν
  choice: Manter “ofereceremos sacrifícios desde os dias de”.
  alternative: Regularizar como “temos oferecido sacrifícios desde os dias de”.
  rationale: Embora a alternativa seja temporalmente mais natural, ela altera o futuro indicativo inequívoco do texto grego. A tradução preserva a dificuldade textual em vez de resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por “vocês” para legibilidade brasileira e internacional. A formulação conserva a ambiguidade entre ouvir e atender, bem como a tensão temporal do grego, sem harmonização silenciosa com o paralelo de Esdras.
