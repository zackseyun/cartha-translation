translation:
  language: pt
  text: Os filhos de Ares[a], setecentos e cinquenta e seis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “Ares” e dá o total de 756. O paralelo aproximado do Texto Massorético neste ponto difere tanto na designação da família quanto no total.
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: os filhos de
  rationale: Em uma lista de recenseamento e genealogia, a expressão funciona como fórmula de identificação de um grupo familiar. “Os filhos de” preserva de modo natural a forma do grego sem ampliar o sentido para além do texto.
- source_word: Ἀρές
  choice: Ares
  rationale: O nome próprio é transliterado diretamente do testemunho grego primário. A divergência do paralelo massorético não justifica substituir o nome grego.
- source_word: ἑπτακόσιοι πεντήκοντα ἕξ
  choice: setecentos e cinquenta e seis
  rationale: Reproduz exatamente o total do grego em uma forma corrente e clara em português.
theological_decisions:
- issue: Uso do testemunho grego diante do paralelo massorético divergente nesta lista de recenseamento
  choice: 'Manter o nome do grupo e o total presentes no grego: “Ares ... setecentos e cinquenta e seis”.'
  alternative: Alinhar a tradução ao paralelo massorético, o que resultaria em outra designação familiar e outro total.
  rationale: Em 1 Esdras, o grego fornecido é o texto-fonte primário. Como o paralelo massorético é apenas aproximado e diverge substancialmente neste ponto, a diferença deve ser documentada, e não harmonizada.
translation_notes:
  register: Português moderno, claro e digno, com a fórmula concisa própria de uma lista censitária. O número foi escrito por extenso, segundo o uso natural em português.
