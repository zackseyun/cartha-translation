base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/043.yaml
  text: And some of the heads of families[a], when they arrived at the temple of God in Jerusalem, pledged to raise up the house on its site, according to their ability,
translation:
  language: pt
  text: E alguns dos chefes das famílias, quando chegaram ao templo de Deus em Jerusalém, comprometeram-se[a] a erguer a Casa no seu lugar, conforme suas possibilidades,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fizeram voto de reconstruir a Casa no seu lugar”. O verbo grego pode ter o sentido de fazer um voto, e “Casa” aqui se refere ao templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγουμένων κατὰ τὰς πατριὰς
  choice: chefes das famílias
  rationale: Expressa de modo natural os dirigentes dos grupos de parentesco ou casas ancestrais, preservando tanto a liderança quanto o contexto familiar.
- source_word: παραγίνεσθαι
  choice: chegaram
  rationale: No contexto, indica a chegada deles ao templo em Jerusalém; “chegaram” é claro e idiomático.
- source_word: ἱερὸν τοῦ θεοῦ
  choice: templo de Deus
  rationale: ἱερόν designa aqui o complexo do templo, e esta é a formulação portuguesa mais direta e reconhecível.
- source_word: εὔξαντο
  choice: comprometeram-se
  rationale: O verbo pode indicar um voto, mas, seguido do infinitivo, também comunica um compromisso solene. A escolha preserva a força da decisão sem impor a ideia técnica de um voto cultual.
- source_word: ἐγεῖραι
  choice: erguer
  rationale: Mantém a imagem literal de levantar ou edificar; no contexto da restauração do templo, a ideia de reconstrução fica implícita.
- source_word: οἶκον
  choice: a Casa
  rationale: Preserva o modo bíblico de se referir ao templo como a Casa de Deus. A inicial maiúscula ajuda o leitor a reconhecer o referente já identificado como o templo.
- source_word: ἐπὶ τοῦ τόπου αὐτοῦ
  choice: no seu lugar
  rationale: Indica a edificação no local próprio ou anterior do templo, em português corrente.
- source_word: κατὰ τὴν αὐτῶν δύναμιν
  choice: conforme suas possibilidades
  rationale: Abrange recursos materiais e capacidade prática, sem restringir a expressão apenas ao aspecto financeiro.
theological_decisions:
- issue: Se εὔξαντο descreve um voto religioso formal ou um compromisso mais amplo
  choice: comprometeram-se
  alternative: fizeram voto
  rationale: O contexto de restauração do templo admite a noção de voto, mas a construção com infinitivo também pode expressar uma decisão ou obrigação assumida. A tradução principal conserva a solenidade sem resolver a ambiguidade em favor de um voto formal; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Casa” conserva a metáfora bíblica para o templo, enquanto “conforme suas possibilidades” comunica de modo natural a amplitude de capacidade e recursos.
