base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/040.yaml
  text: And Nehemiah and Atharias told them not to partake of the holy things until a priest should arise clothed with the Manifestation and the Truth[a][b].
translation:
  language: pt
  text: E Neemias e Atarias lhes disseram que não participassem das coisas sagradas até que se levantasse um sacerdote revestido da Manifestação e da Verdade[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “a Manifestação e a Verdade” designa os objetos sacerdotais conhecidos, no paralelo hebraico, como Urim e Tumim.
    reason: alternative_reading
  - marker: b
    text: Isto é, eles não deviam comer das porções sagradas destinadas aos sacerdotes até que um sacerdote habilitado pudesse dar uma decisão definitiva.
    reason: cultural_note
lexical_decisions:
- source_word: εἶπεν αὐτοῖς
  choice: lhes disseram
  rationale: Embora o verbo grego esteja no singular, há um sujeito composto, Neemias e Atarias; o plural é natural em português e comunica a ordem dirigida a eles.
- source_word: Ναιμίας
  choice: Neemias
  rationale: Emprega a forma portuguesa tradicional e reconhecível do nome correspondente ao grego Ναιμίας.
- source_word: Ἀθαρίας
  choice: Atarias
  rationale: Translitera de perto a forma grega, sem substituí-la pelo possível equivalente semítico Azarias.
- source_word: μὴ μετέχειν τῶν ἁγίων
  choice: que não participassem das coisas sagradas
  rationale: Preserva a amplitude cultual da expressão grega sem especificar no texto principal que se trata de alimentos sacerdotais.
- source_word: ἕως ἀναστῇ ἱερεὺς
  choice: até que se levantasse um sacerdote
  rationale: O imperfeito do subjuntivo após a ordem passada expressa em português a expectativa futura e contingente do aoristo subjuntivo grego.
- source_word: ἐνδεδυμένος
  choice: revestido
  rationale: Mantém a imagem literal e o registro cultual elevado do particípio grego.
- source_word: τὴν δήλωσιν καὶ τὴν ἀλήθειαν
  choice: da Manifestação e da Verdade
  rationale: Traduz semanticamente os termos do texto grego e preserva sua formulação própria, deixando a identificação tradicional com Urim e Tumim para a nota.
theological_decisions:
- issue: Se o par sacerdotal deve ser traduzido conforme os termos gregos ou harmonizado diretamente com Urim e Tumim
  choice: Manifestação e Verdade no texto principal
  alternative: Urim e Tumim
  rationale: Como o grego é a fonte primária de 1 Esdras e emprega equivalentes semânticos, o texto principal os traduz literalmente; a provável identificação com os termos hebraicos tradicionais é informada em nota, sem apagar a forma do testemunho grego.
- issue: Sentido de 'coisas sagradas' no contexto
  choice: Preservar a expressão abrangente no texto e explicar a referência provável em nota
  alternative: Traduzir diretamente como 'alimentos sagrados dos sacerdotes'
  rationale: O contexto provavelmente diz respeito às porções sacerdotais, mas o grego usa uma expressão mais ampla; a nota esclarece sem eliminar essa ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e acessível, com formas amplamente reconhecíveis no Brasil. A formulação mantém o tom cultual sem arcaísmo excessivo; as iniciais maiúsculas em “Manifestação” e “Verdade” sinalizam que o par funciona aqui como designação de objetos sacerdotais.
