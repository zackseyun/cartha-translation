base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/068.yaml
  text: For we alone will build for the Lord of Israel[a], in accordance with what Cyrus king of the Persians commanded us.
translation:
  language: pt
  text: Pois somente nós construiremos para o Senhor de Israel, de acordo com o que Ciro, rei dos persas,[a] nos ordenou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “rei da Pérsia”. O grego diz literalmente “rei dos persas”.'
    reason: Registra a alternativa idiomática com o nome do território, preservando ao mesmo tempo a forma gentílica do texto grego na tradução principal.
lexical_decisions:
- source_word: ἡμεῖς γὰρ μόνοι
  choice: Pois somente nós
  rationale: “Pois” preserva a função explicativa de γὰρ, e “somente nós” transmite a ênfase exclusiva expressa pelo pronome explícito ἡμεῖς e por μόνοι.
- source_word: οἰκοδομήσομεν
  choice: construiremos
  rationale: O futuro simples corresponde diretamente ao grego. Embora o contexto seja a restauração do templo, o verbo não explicita a ideia de reconstrução.
- source_word: τῷ κυρίῳ τοῦ Ἰσραήλ
  choice: para o Senhor de Israel
  rationale: “Para” expressa que a construção é destinada ao Senhor; “Senhor de Israel” preserva o título divino sem acrescentar “Deus”, ausente no grego.
- source_word: ἀκολούθως οἷς προσέταξεν ἡμῖν
  choice: de acordo com o que ... nos ordenou
  rationale: Formulação portuguesa natural que conserva a relação de conformidade com a ordem recebida.
- source_word: Κῦρος ὁ βασιλεὺς Περσῶν
  choice: Ciro, rei dos persas
  rationale: Mantém o plural gentílico Περσῶν e apresenta o título em aposição idiomática em português.
theological_decisions:
- issue: Tradução de κύριος como título divino
  choice: Senhor
  alternative: Soberano
  rationale: Na expressão “Senhor de Israel”, κύριος funciona como título divino; “Senhor” é a equivalência bíblica corrente e não introduz interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem da frase mantém a ênfase exclusiva em “somente nós” e evita explicitar “reconstruir”, nuance apenas contextual.
