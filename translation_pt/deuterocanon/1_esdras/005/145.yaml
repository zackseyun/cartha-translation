base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/145.yaml
  text: And Jeshua son of Josedec arose[a], with his brothers the priests, and Zerubbabel son of Salathiel, with his brothers, and they prepared the altar of the God of Israel[b],
translation:
  language: pt
  text: E Jesua[a], filho de Josedec, levantou-se; seus irmãos, os sacerdotes, Zorobabel, filho de Salatiel[b], e seus irmãos prepararam o altar do Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome traduzido como «Jesua» tem a mesma forma grega que, em outros contextos, também pode ser traduzida como «Josué» ou «Jesus».
    reason: lexical_alternative
  - marker: b
    text: Em grego, Σαλαθιήλ; a forma hebraica do nome é frequentemente transliterada como «Sealtiel».
    reason: lexical_alternative
lexical_decisions:
- source_word: καταστὰς
  choice: levantou-se
  rationale: O particípio aoristo introduz a ação decidida de Jesua. «Levantou-se» é natural em português e preserva o movimento narrativo sem tornar a expressão excessivamente literal.
- source_word: Ἰησοῦς
  choice: Jesua
  rationale: Neste contexto pós-exílico, o nome designa o sacerdote conhecido em português como Jesua. A escolha evita confusão anacrônica com Jesus e distingue essa personagem de Josué, filho de Num.
- source_word: ὁ τοῦ Ἰωσεδὲκ
  choice: filho de Josedec
  rationale: A construção grega de filiação, literalmente «o de Josedec», é expressa naturalmente em português como «filho de Josedec».
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: seus irmãos
  rationale: Traduz diretamente o termo familiar masculino ἀδελφοί. Embora o contexto possa abranger parentes ou companheiros do grupo sacerdotal, o texto emprega a designação familiar.
- source_word: οἱ ἱερεῖς
  choice: os sacerdotes
  rationale: Mantém a expressão em aposição, identificando os irmãos de Jesua como sacerdotes.
- source_word: Ζοροβαβὲλ
  choice: Zorobabel
  rationale: Forma tradicional e amplamente reconhecida em português para o líder pós-exílico.
- source_word: ὁ τοῦ Σαλαθιὴλ
  choice: filho de Salatiel
  rationale: Expressa a filiação de modo idiomático e conserva a forma do nome representada no texto grego.
- source_word: οἱ τούτου ἀδελφοὶ
  choice: os irmãos deste
  rationale: O demonstrativo τούτου remete especificamente a Zorobabel. «Deste» preserva essa referência e evita que os dois grupos de irmãos sejam confundidos.
- source_word: ἡτοίμασαν
  choice: prepararam
  rationale: Reproduz o sentido amplo do verbo, sem especificar além do texto se o altar foi construído, restaurado ou simplesmente posto em condições de uso.
- source_word: τὸ θυσιαστήριον
  choice: o altar
  rationale: Equivalente português corrente de θυσιαστήριον; o caráter sacrificial já é inerente ao termo e ao contexto.
- source_word: τοῦ θεοῦ Ἰσραήλ
  choice: do Deus de Israel
  rationale: Preserva a relação genitiva de posse ou dedicação expressa no grego.
theological_decisions:
- issue: Sentido da linguagem familiar ἀδελφοί em um contexto sacerdotal e comunitário
  choice: irmãos
  alternative: parentes; companheiros
  rationale: O grego usa explicitamente o termo familiar masculino. «Irmãos» preserva essa forma, sem ampliar silenciosamente o referente para toda a comunidade.
- issue: Forma do nome Ἰησοῦς no contexto pós-exílico
  choice: Jesua
  alternative: Josué; Jesus
  rationale: A mesma forma grega pode representar nomes vertidos de maneiras diferentes conforme o contexto. Aqui, «Jesua» corresponde ao uso tradicional para o sacerdote pós-exílico e reduz ambiguidades históricas.
- issue: Natureza da ação sobre o altar
  choice: prepararam
  alternative: ergueram; instalaram
  rationale: O verbo ἡτοίμασαν indica preparação, mas não define com precisão se houve construção, restauração ou instalação. A tradução mantém essa abertura sem impor uma ação material específica.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe narrativa clara. Os marcadores foram colocados junto aos nomes a que suas notas efetivamente se referem. A repetição de «com» e a expressão «os irmãos deste» tornam explícita a estrutura dos dois grupos sem alterar as relações do texto grego.
