  naturalness: O português é claro e de registro apropriado. «Os irmãos deste» é correto, mas «seus irmãos», após a identificação de Zorobabel, é mais fluente sem perder o referente.
  terminology: «Jesua», «Josedec», «Zorobabel», «Salatiel», «sacerdotes» e «altar do Deus de Israel» são escolhas adequadas e consistentes com o testemunho grego. As notas preservam corretamente as alternativas de forma dos nomes.
