base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/052.yaml
  text: And all who had vowed a vow to God began[a], from the new moon of the first month, to offer sacrifices to God[b], though the temple of God had not yet been built.
translation:
  language: pt
  text: E todos os que haviam feito um voto a Deus começaram, desde a lua nova do primeiro mês, a oferecer sacrifícios a Deus, embora o templo de Deus ainda não tivesse sido construído.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “e o templo de Deus ainda não havia sido construído”. O texto principal usa “embora” para expressar o provável valor concessivo da coordenação grega.'
    reason: lexical_alternative
  - marker: b
    text: 'O texto hebraico paralelo em Esdras difere aqui: ele fala da Festa das Cabanas e dos holocaustos diários prescritos. O texto principal segue a redação grega distinta de 1 Esdras.'
    reason: cross_reference
lexical_decisions:
- source_word: ὅσοι
  choice: todos os que
  rationale: Expressa naturalmente em português a abrangência inclusiva do pronome relativo indefinido grego.
- source_word: εὔξαντο εὐχήν
  choice: haviam feito um voto
  rationale: A construção cognata grega indica a formulação de um voto, não simplesmente uma oração. A forma portuguesa evita uma repetição artificial, preservando o sentido e a anterioridade contextual.
- source_word: ἀπὸ τῆς νουμηνίας τοῦ πρώτου μηνός
  choice: desde a lua nova do primeiro mês
  rationale: Νουμηνία designa especificamente a lua nova que marcava o início do mês; “desde” comunica o ponto inicial da atividade sacrificial.
- source_word: ἤρξαντο προσφέρειν θυσίας
  choice: começaram [...] a oferecer sacrifícios
  rationale: Reproduz o aspecto ingressivo da construção grega e mantém θυσίας como sacrifícios, em vez do termo mais amplo “ofertas”.
- source_word: ναὸς τοῦ θεοῦ
  choice: templo de Deus
  rationale: Tradução direta e clara; ναός se refere ao templo, especialmente ao edifício sagrado.
- source_word: οὔπω ᾠκοδόμητο
  choice: ainda não tivesse sido construído
  rationale: Mantém o sentido passivo e não acrescenta “reconstruído”, embora o contexto histórico envolva uma reconstrução.
theological_decisions:
- issue: Valor da coordenação final introduzida por καί
  choice: 'Traduzir com valor concessivo: “embora o templo de Deus ainda não tivesse sido construído”.'
  alternative: 'Manter coordenação simples: “e o templo de Deus ainda não havia sido construído”.'
  rationale: O grego emprega καί, permitindo uma tradução formalmente coordenada, mas a lógica narrativa ressalta que os sacrifícios começaram apesar de o templo ainda não estar construído. A nota preserva a forma literal como alternativa genuína.
- issue: Relação com o paralelo do Texto Massorético em Esdras
  choice: Seguir a redação grega própria de 1 Esdras sobre os votos, os sacrifícios e o templo ainda não construído.
  alternative: Harmonizar o texto com o paralelo hebraico que menciona a Festa das Cabanas e os holocaustos diários prescritos.
  rationale: O grego é a fonte primária para 1 Esdras, e o paralelo hebraico fornecido é apenas aproximado e difere materialmente neste ponto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Lua nova” preserva a referência calendárica e cultual; “haviam feito um voto” é idiomático sem perder o sentido específico da expressão grega.
