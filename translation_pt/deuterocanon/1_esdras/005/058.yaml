base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/058.yaml
  text: And they cried out with hymns[a], blessing the Lord, because his goodness and his glory are forever for all Israel.
translation:
  language: pt
  text: E levantaram a voz com hinos, bendizendo o Senhor, porque a sua bondade e a sua glória são eternas para todo o Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque a sua bondade e a sua glória permanecem para sempre para todo o Israel”. A oração grega é condensada, não traz verbo expresso e admite mais de uma expansão natural.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφώνησαν
  choice: levantaram a voz
  rationale: Expressa de modo natural em português o ato público e audível de erguer a voz, sem determinar além do grego se gritaram ou cantaram.
- source_word: δι’ ὕμνων
  choice: com hinos
  rationale: Reproduz idiomaticamente o valor instrumental de διά com genitivo no contexto litúrgico.
- source_word: εὐλογοῦντες
  choice: bendizendo
  rationale: Mantém o sentido direto do particípio e a linguagem bíblica, sem reduzi-lo ao sentido mais geral de louvar.
- source_word: τῷ κυρίῳ
  choice: o Senhor
  rationale: É a tradução portuguesa corrente e diretamente fundamentada para κύριος neste texto grego.
- source_word: χρηστότης
  choice: bondade
  rationale: Abrange o caráter benévolo do Senhor e forma uma expressão litúrgica natural com glória.
- source_word: δόξα
  choice: glória
  rationale: É o equivalente bíblico tradicional e semanticamente adequado neste contexto de louvor.
- source_word: εἰς τοὺς αἰῶνας
  choice: permanecem para sempre
  rationale: Torna explícito em português o sentido durativo da fórmula, embora o verbo esteja elíptico no grego.
- source_word: παντὶ Ἰσραήλ
  choice: sobre todo o Israel
  rationale: Preserva a construção comprimida e a ideia de que a bondade e a glória divinas repousam sobre o povo inteiro; 'para todo o Israel' continua possível.
theological_decisions:
- issue: Tradução de κύριος no contexto litúrgico grego
  choice: o Senhor
  alternative: o SENHOR
  rationale: O texto-fonte traz κύριος, não uma ocorrência direta do tetragrama hebraico; por isso, 'o Senhor' é a opção mais ancorada na fonte.
- issue: Expansão da oração nominal elíptica após ὅτι
  choice: porque a sua bondade e a sua glória permanecem para sempre sobre todo o Israel
  alternative: porque a sua bondade e a sua glória são para sempre para todo o Israel
  rationale: O verbo 'permanecem' produz português natural e comunica o valor durativo de εἰς τοὺς αἰῶνας, mas a nota registra que o grego não expressa o verbo e permite outra expansão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência litúrgica. 'Levantaram a voz' evita o possível excesso de 'gritaram'; 'bendizendo' conserva a formulação bíblica. A nota preserva a ambiguidade sintática da oração final.
