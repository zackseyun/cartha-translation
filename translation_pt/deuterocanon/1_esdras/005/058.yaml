revisions:
- from: E levantaram a voz com hinos, bendizendo o Senhor, porque a sua bondade e a sua glória permanecem para sempre sobre todo o Israel.[a]
  to: E levantaram a voz com hinos, bendizendo o Senhor, porque a sua bondade e a sua glória são eternas para todo o Israel.[a]
  rationale: A revisão substitui «sobre todo o Israel» por «para todo o Israel», evitando uma interpretação espacial não exigida pela sintaxe grega e preservando a ambiguidade da fórmula litúrgica. «São eternas» oferece português moderno e natural para o valor de «para os séculos», enquanto a nota registra a expansão durativa alternativa.
