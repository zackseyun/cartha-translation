lexical_decisions:
- source_word: υἱοὶ
  choice: os filhos de
  rationale: Na lista censitária, a expressão introduz famílias ou linhagens. A formulação tradicional e clara «os filhos de» preserva a imagem genealógica do grego.
- source_word: Ἰωλάμου
  choice: Iolamo
  rationale: Transliteração portuguesa da forma grega, com a terminação flexional grega adaptada à forma nominal esperada em português.
- source_word: δύο
  choice: dois
  rationale: Correspondência direta do numeral cardinal.
- source_word: Ζατοῦ
  choice: Zatu
  rationale: A forma do texto grego é mantida como base; ου é representado por «u» em transliteração portuguesa. A forma Zatu, conhecida da tradição hebraica paralela, é registrada em nota sem substituir o testemunho grego.
- source_word: ἐννακόσιοι ἑβδομήκοντα
  choice: novecentos e setenta
  rationale: Reprodução exata do total em sintaxe numérica portuguesa natural.
- source_word: Χορβέ
  choice: Corbé
  rationale: Transliteração direta do grego, com Χ representado por «C» antes de «o» e acento para conservar a tonicidade final. Não se harmoniza o nome com listas hebraicas divergentes.
- source_word: ἑπτακόσιοι πέντε
  choice: setecentos e cinco
  rationale: Reprodução exata do numeral em português corrente.
- source_word: Βανεί
  choice: Banei
  rationale: Mantém-se na linha principal a forma representada pelo grego. A forma Bani e a divergência numérica da lista hebraica são informadas em nota.
- source_word: ἑξακόσιοι τεσσεράκοντα ὀκτώ
  choice: seiscentos e quarenta e oito
  rationale: Reprodução exata do total grego em formulação portuguesa natural.
