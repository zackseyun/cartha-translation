base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/048.yaml
  text: to offer burnt offerings on it[a], according to what is prescribed in the book of Moses, the man of God.
translation:
  language: pt
  text: para oferecer sobre ele holocaustos[a], conforme o que foi prescrito no livro de Moisés, o homem de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo hebraico em Esdras 3:2 diz: “como está escrito na Lei de Moisés, o homem de Deus”. Aqui, 1 Esdras usa “livro de Moisés” e “o que foi prescrito”, expressando o mesmo sentido básico com palavras diferentes.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσενέγκαι
  choice: oferecer
  rationale: No contexto sacrificial, o infinitivo indica apresentar uma oferta a Deus; “oferecer” é natural e preciso em português.
- source_word: ἐπ’ αὐτοῦ
  choice: sobre ele
  rationale: Retoma o altar mencionado no contexto anterior e preserva a ideia local de nele serem oferecidos os sacrifícios.
- source_word: ὁλοκαυτώματα
  choice: holocaustos
  rationale: É o termo bíblico tradicional e ainda reconhecível para ofertas inteiramente consumidas pelo fogo; o paralelo hebraico עֹלוֹת confirma o sentido sacrificial.
- source_word: ἀκολούθως
  choice: conforme
  rationale: Expressa conformidade com uma norma e produz uma formulação direta e natural em português.
- source_word: τοῖς ... διηγορευμένοις
  choice: o que foi prescrito
  rationale: O particípio designa aquilo que foi estabelecido ou determinado com autoridade no contexto legal e cultual.
- source_word: ἐν τῇ Μωσέως βίβλῳ
  choice: no livro de Moisés
  rationale: Mantém βίβλος como “livro”, sem substituí-lo pela leitura “Lei” do paralelo hebraico.
- source_word: τοῦ ἀνθρώπου τοῦ θεοῦ
  choice: o homem de Deus
  rationale: Preserva o título bíblico aplicado a Moisés e corresponde também ao paralelo hebraico אִישׁ־הָאֱלֹהִים.
theological_decisions:
- issue: Relação entre a formulação grega e o paralelo hebraico de Esdras 3:2
  choice: Manter “livro de Moisés” e “o que foi prescrito”, conforme o grego.
  alternative: 'Traduzir segundo o paralelo hebraico: “como está escrito na Lei de Moisés, o homem de Deus”.'
  rationale: O texto grego é a fonte primária de 1 Esdras e emprega βίβλος e διηγορευμένοις. O paralelo hebraico confirma o sentido legal e sacrificial, mas não deve substituir a redação grega.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Holocaustos” conserva a terminologia bíblica sacrificial; “sobre ele” mantém explícita a referência ao altar no contexto anterior.
