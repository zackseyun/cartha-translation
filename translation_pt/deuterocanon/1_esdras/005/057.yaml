base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/057.yaml
  text: And the priests stood arrayed with musicians and trumpets, and the Levites, the sons of Asaph, had the cymbals, praising the Lord and blessing him according to David king of Israel;
translation:
  language: pt
  text: E os sacerdotes tomaram seus lugares, trajados, com músicos e trombetas[a]; e os levitas, filhos de Asafe, seguravam os címbalos, louvando o Senhor e bendizendo-o segundo Davi, rei de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «com instrumentos musicais e trombetas». O termo grego pode referir-se a músicos, a instrumentos ou, de modo mais geral, ao acompanhamento musical.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «conforme prescreveu Davi, rei de Israel» ou «à maneira de Davi, rei de Israel». O grego não define se a ênfase recai numa prescrição ou num modelo davídico.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστησαν
  choice: tomaram seus lugares
  rationale: Expressa a tomada de posição cerimonial indicada pelo aoristo de ἵστημι, de modo natural em português, sem sugerir que apenas permaneceram fisicamente de pé.
- source_word: ἐστολισμένοι
  choice: trajados
  rationale: Comunica que os sacerdotes estavam vestidos para a cerimônia, sem especificar paramentos sacerdotais além do que o grego declara.
- source_word: μετὰ μουσικῶν καὶ σαλπίγγων
  choice: com músicos e trombetas
  rationale: Mantém a leitura pessoal possível de μουσικῶν e distingue os músicos das trombetas; a alternativa instrumental é preservada em nota.
- source_word: Λευεῖται υἱοὶ Ἀσὰφ
  choice: os levitas, filhos de Asafe
  rationale: Conserva tanto a identificação levítica quanto a designação familiar ou corporativa ligada a Asafe.
- source_word: ἔχοντες τὰ κύμβαλα
  choice: seguravam os címbalos
  rationale: Verte diretamente o particípio, tornando clara a relação dos levitas com os instrumentos sem acrescentar que já os tocavam.
- source_word: ὑμνοῦντες
  choice: louvando
  rationale: Forma corrente e digna para o louvor, inclusive cantado, sem recorrer a um termo excessivamente técnico.
- source_word: τῷ κυρίῳ
  choice: o Senhor
  rationale: No contexto do culto de Israel, κύριος designa o Deus de Israel; «o Senhor» é a forma portuguesa consagrada e inteligível.
- source_word: εὐλογοῦντες
  choice: bendizendo-o
  rationale: Preserva o sentido de bendizer a Deus; o pronome explicita em português o objeto implícito, claramente retomado de «o Senhor».
- source_word: κατὰ Δαυεὶδ βασιλέα τοῦ Ἰσραήλ
  choice: segundo Davi, rei de Israel
  rationale: Mantém aberta a força de κατά entre norma, precedente e modo, evitando transformá-la explicitamente numa prescrição.
theological_decisions:
- issue: Sentido de κύριος no contexto litúrgico da Septuaginta
  choice: o Senhor
  alternative: Senhor
  rationale: O artigo grego e o contexto do culto apontam para o Deus de Israel; a tradução segue o uso bíblico português sem introduzir uma distinção doutrinária adicional.
- issue: Força de κατὰ Δαυεὶδ βασιλέα τοῦ Ἰσραήλ
  choice: segundo Davi, rei de Israel
  alternative: conforme prescreveu Davi, rei de Israel; à maneira de Davi, rei de Israel
  rationale: A formulação conserva a tensão entre prescrição davídica e modelo ou maneira davídica, pois o grego não obriga a escolher uma dessas nuances.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe cerimonial sem arcaísmos desnecessários. «Címbalos» conserva o nome tradicional e preciso do instrumento. As vírgulas em «filhos de Asafe» e «rei de Israel» assinalam aposições naturais em português.
