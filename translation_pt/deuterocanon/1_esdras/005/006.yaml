  text: and from the tribe of Judah[a], who spoke wise words to Darius king of the Persians in the second year of his reign, in the month Nisan, the first month.
translation:
  language: pt
  text: e da tribo de Judá, o qual falou palavras sábias diante de Dario[a], rei dos persas, no segundo ano de seu reinado, no mês de nisã, o primeiro mês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «na presença de Dario» ou «a Dario»; neste contexto de corte, a expressão grega ἐπὶ Δαρείου admite sentidos ligeiramente diferentes, mas próximos.
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλῆς δὲ Ἰούδα
  choice: e da tribo de Judá
  rationale: Mantém a ligação do fragmento com o contexto anterior e traduz φυλή pelo termo convencional e natural «tribo».
- source_word: ἐλάλησεν
  choice: pronunciou
  rationale: Expressa o ato de falar em contexto formal sem especificar além do que o grego afirma.
- source_word: ἐπὶ Δαρείου
  choice: diante de Dario
  rationale: Com ἐπί e genitivo, o contexto de corte favorece o sentido de falar perante ou na presença do rei, embora a construção permita uma formulação próxima de «a Dario».
- source_word: λόγους σοφούς
  choice: palavras sábias
  rationale: Preserva o plural λόγους e a qualificação σοφούς em linguagem clara e direta.
- source_word: δευτέρῳ ἔτει τῆς βασιλείας αὐτοῦ
  choice: no segundo ano do reinado dele
  rationale: É a formulação temporal usual; «dele» deixa claro que o reinado mencionado é o de Dario.
- source_word: μηνὶ Νισὰν τοῦ πρώτου μηνός
  choice: no mês de nisã, o primeiro mês
  rationale: Mantém tanto a menção explícita ao mês quanto a aposição que identifica nisã como o primeiro mês.
