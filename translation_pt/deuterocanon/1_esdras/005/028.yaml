  yaml_path: translation/deuterocanon/1_esdras/005/028.yaml
  text: the gatekeepers[a], four hundred; the sons of Ishmael, sons of Lakubath[b], one thousand.
translation:
  language: pt
  text: os porteiros, quatrocentos; os filhos de Ismael, filhos de Lacubate[b], mil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego traz «os filhos de Ismael, filhos de Lacubate, mil». Nesse ponto, a lista hebraica paralela de Neemias 7 não corresponde a essa redação; por isso, a tradução segue aqui o testemunho grego, sem harmonizá-lo com a lista massorética.
    reason: textual_variant
  - marker: b
    text: Lacubate talvez seja uma forma de nome relacionada a Acube/Lacube, mais conhecida nas listas paralelas dos que regressaram.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ θυρωροί
  choice: os porteiros
  rationale: θυρωρός designa quem guarda uma porta ou um portão. Neste contexto de lista comunitária e cultual, «porteiros» é a designação corrente e concisa para essa função.
- source_word: τετρακόσιοι
  choice: quatrocentos
  rationale: Numeral cardinal que indica a quantidade do grupo mencionado imediatamente antes.
- source_word: οἱ Ἰσμαήλου
  choice: os descendentes de Ismael
  rationale: A expressão grega é uma designação familiar no genitivo, literalmente «os de Ismael». «Os descendentes de Ismael» explicita naturalmente em português o sentido genealógico sem restringi-lo necessariamente a filhos imediatos.
- source_word: υἱοὶ Λακουβάτου
  choice: filhos de Lacubate
  rationale: υἱοί significa explicitamente «filhos». O nome Λακουβάτου é transliterado de acordo com a forma do testemunho grego, sem harmonização com nomes mais conhecidos de listas paralelas.
- source_word: χίλιοι
  choice: mil
  rationale: Numeral cardinal ligado ao grupo familiar que o precede imediatamente.
