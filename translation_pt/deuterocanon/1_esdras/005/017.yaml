  text: the sons of Baiterous[a], three thousand five; the sons of Ragethlomon, one hundred twenty-three;
translation:
  language: pt
  text: os filhos de Baiterús[a], três mil e cinco; os filhos de Raguetlomon, cento e vinte e três;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Os nomes gregos deste versículo diferem da tradição hebraica paralela aproximada, que neste ponto traz: “os filhos de Hasum, duzentos e vinte e três”. O texto principal segue o grego de 1 Esdras, sem harmonizá-lo com o Texto Massorético.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: os filhos de
  rationale: Em uma lista censitária ou genealógica, a expressão identifica os membros de uma família ou clã. “Os filhos de” preserva a fórmula do grego e é corrente no registro bíblico português.
- source_word: Βαιτηρούς
  choice: Baiterús
  rationale: Transliteração do nome grego, com acento gráfico para indicar em português a tonicidade final sugerida pela forma grega.
- source_word: τρισχίλιοι πέντε
  choice: três mil e cinco
  rationale: Reproduz por extenso o número cardinal e emprega a coordenação numérica natural em português.
- source_word: ἐκ Ῥαγεθλωμῶν
  choice: de Raguetlomon
  rationale: Embora ἐκ tenha sentido básico de origem ou procedência, nesta fórmula de lista “de” expressa naturalmente a pertença ou proveniência do grupo sem tornar a frase artificial. O nome segue a forma grega, sem harmonização com o paralelo hebraico.
- source_word: ἑκατὸν εἴκοσι τρεῖς
  choice: cento e vinte e três
  rationale: Tradução direta do cardinal, por extenso e conforme o uso idiomático do português.
theological_decisions:
- issue: Os nomes e números gregos divergem do paralelo aproximado do Texto Massorético
  choice: Manter “Baiterús”, “Raguetlomon”, “três mil e cinco” e “cento e vinte e três” no texto principal
  alternative: Harmonizar com o paralelo hebraico, que neste ponto traz “os filhos de Hasum, duzentos e vinte e três”
  rationale: O texto grego de 1 Esdras é a fonte primária desta tradução. O paralelo hebraico é útil como testemunho comparativo, mas não deve substituir nem corrigir silenciosamente a leitura grega.
translation_notes:
  register: Português moderno, claro e digno, com a fórmula tradicional de lista “os filhos de”. Os números são escritos por extenso, e os nomes são transliterados a partir do grego.
