base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/053.yaml
  text: And they gave silver to the stonecutters and carpenters[a], and drink and food and provisions to the Sidonians and Tyrians, to bring cedar logs from Lebanon, transporting them by rafts to the harbor of Joppa, according to the written decree given to them by Cyrus king of the Persians.
translation:
  language: pt
  text: E deram prata aos cortadores de pedra e aos carpinteiros, e bebida, comida e provisões[a] aos sidônios e tírios, para trazerem do Líbano madeira de cedro, transportando-a em jangadas até o porto de Jope, conforme o decreto escrito que Ciro, rei dos persas, lhes havia dado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra grega traduzida como “provisões” é difícil neste contexto; o texto paralelo de Esdras 3:7 especifica “azeite”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριον
  choice: prata
  rationale: Preserva o sentido literal do grego, embora no contexto possa designar dinheiro usado como pagamento.
- source_word: λατόμοις
  choice: cortadores de pedra
  rationale: Designa diretamente os trabalhadores que cortavam pedra, sem ampliar o sentido para construtores em geral.
- source_word: τέκτοσι
  choice: carpinteiros
  rationale: No contexto da construção do templo, refere-se naturalmente aos trabalhadores em madeira.
- source_word: ποτὰ καὶ βρωτὰ
  choice: bebida, comida
  rationale: Tradução clara e corrente dos suprimentos para beber e comer.
- source_word: χάρα
  choice: provisões
  rationale: A forma grega transmitida é difícil neste contexto. A escolha preserva prudentemente a ideia de suprimentos, sem substituir o termo por um produto específico ausente da forma grega.
- source_word: παράγειν αὐτοὺς ἐκ τοῦ Λιβάνου ξύλα κέδρινα
  choice: para trazerem do Líbano madeira de cedro
  rationale: Expressa naturalmente em português a finalidade indicada pelo infinitivo; o pronome grego retoma os sidônios e tírios.
- source_word: διαφέρειν σχεδίαις
  choice: transportando-a em jangadas
  rationale: Comunica tanto o deslocamento da madeira quanto o meio de transporte marítimo.
- source_word: Ἰόππης λιμένα
  choice: porto de Jope
  rationale: Formulação corrente e precisa para o porto da cidade.
- source_word: πρόσταγμα τὸ γραφὲν
  choice: decreto escrito
  rationale: Reflete uma ordem oficial régia formalizada por escrito.
- source_word: παρὰ Κύρου τοῦ Περσῶν βασιλέως
  choice: que Ciro, rei dos persas, lhes havia dado
  rationale: Explicita de modo natural a procedência do decreto sem alterar a relação sintática do grego.
theological_decisions:
- issue: Relação entre o texto grego e o paralelo de Esdras 3:7
  choice: Manter o grego como texto primário e traduzir χάρα de modo cauteloso como “provisões”.
  alternative: Especificar “azeite” com base no paralelo hebraico, ou reproduzir literalmente uma leitura obscura como “alegria”.
  rationale: O testemunho grego governa a tradução de 1 Esdras. O paralelo hebraico ajuda a reconhecer uma lista de suprimentos, mas não justifica inserir no texto principal um produto específico que a forma grega transmitida não expressa claramente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Jope” segue a forma bíblica tradicional em português. A construção mantém a sequência logística do grego sem tornar a frase excessivamente literal.
