translation:
  language: pt
  text: com pandeiros e flautas[a]. E todos os irmãos deles tocavam; e ele fez com que eles subissem junto com aqueles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «instrumentos de sopro». O termo grego pode referir-se mais amplamente a tubos com palheta ou a instrumentos semelhantes.
    reason: lexical_alternative
  - marker: b
    text: O texto grego é abrupto e depende do contexto neste ponto. «Aqueles» traduz o demonstrativo ἐκείνων, cujo referente precisa ser identificado pela narrativa ao redor.
    reason: alternative_reading
lexical_decisions:
- source_word: τυμπάνων
  choice: pandeiros
  rationale: τύμπανον designa um instrumento de percussão manual semelhante ao pandeiro; «pandeiros» é corrente e adequado ao contexto festivo.
- source_word: αὐλῶν
  choice: flautas
  rationale: αὐλός pode designar flautas ou, de modo mais amplo, instrumentos de sopro com palheta. «Flautas» é a forma mais clara no texto, mantendo-se a amplitude lexical em nota.
- source_word: ἀδελφοὶ
  choice: irmãos
  rationale: O substantivo grego está no masculino plural; «irmãos» preserva essa forma sem substituir por um termo neutro não exigido pelo contexto.
- source_word: παίζοντες
  choice: tocavam
  rationale: παίζω pode indicar brincar, dançar ou participar de uma celebração. A menção imediata de instrumentos favorece o sentido musical, sem especificar qual instrumento cada um tocava.
- source_word: ἐποίησεν ... συναναβῆναι
  choice: fez com que eles subissem junto
  rationale: A construção é causativa, e o composto συναναβαίνω reúne a ideia de subir com outras pessoas. A formulação é natural em português e conserva ambas as noções.
- source_word: μετʼ ἐκείνων
  choice: com aqueles
  rationale: O demonstrativo distal ἐκείνων é mais forte que um simples pronome. «Aqueles» preserva essa força sem acrescentar explicitamente um substantivo ausente do grego.
