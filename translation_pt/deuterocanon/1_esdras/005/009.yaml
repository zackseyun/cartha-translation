base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/009.yaml
  text: 'The number of those from the nation[a], and their leaders: the sons of Phoros[b], seventy-two thousand.'
translation:
  language: pt
  text: 'O número dos que eram do povo e de seus líderes: os filhos de Foros[a], setenta e dois mil[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “Foros”. A tradição hebraica paralela diverge tanto nos nomes como nos números neste ponto; o texto grego de 1 Esdras parece preservar uma forma divergente da lista.
    reason: alternative_reading
  - marker: b
    text: O grego traz “setenta e dois mil”. Esse número excepcionalmente alto difere muito da tradição hebraica paralela e pode refletir uma alteração textual ou outra forma da lista.
    reason: textual_variant
lexical_decisions:
- source_word: ἀριθμὸς
  choice: O número
  rationale: É o sentido direto do termo e funciona como fórmula introdutória de uma lista censitária ou genealógica.
- source_word: τῶν ἀπὸ τοῦ ἔθνους
  choice: dos que eram da nação
  rationale: Preserva a formulação comprimida e um tanto incomum do grego, sem restringir ἔθνος indevidamente a uma etnia específica.
- source_word: οἱ προηγούμενοι αὐτῶν
  choice: seus líderes
  rationale: O particípio significa literalmente os que vão à frente; neste contexto administrativo, designa os líderes ou chefes do grupo.
- source_word: υἱοὶ
  choice: os filhos de
  rationale: Mantém a fórmula bíblica tradicional de listas familiares, que pode incluir descendentes ou membros de um clã.
- source_word: Φορὸς
  choice: Foros
  rationale: Translitera diretamente o nome preservado pelo texto grego, que é a fonte principal, sem substituí-lo por um nome de listas paralelas.
- source_word: ἑβδομήκοντα δύο χιλιάδες
  choice: setenta e dois mil
  rationale: Traduz literalmente o número transmitido pelo grego, apesar de sua dimensão incomum e da divergência em relação à tradição hebraica paralela.
