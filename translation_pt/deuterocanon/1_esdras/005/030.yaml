base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/030.yaml
  text: the sons of Akoud[a], the sons of Outa, the sons of Ketab, the sons of Akkaba, the sons of Sybaei, the sons of Anan, the sons of Koua, the sons of Keddour,
translation:
  language: pt
  text: os filhos de Acude[a], os filhos de Utá, os filhos de Quetabe, os filhos de Acabá, os filhos de Sibei, os filhos de Anan, os filhos de Cuá, os filhos de Quedur,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo hebraico em Neemias 7:45 traz uma lista diferente de famílias de porteiros, incluindo Salum, Ater, Talmom, Acube, Hatita e Sobai. Aqui, 1 Esdras preserva uma lista grega divergente; por isso, a tradução segue o grego, sem harmonizá-lo com o hebraico.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: os filhos de
  rationale: Nesta lista genealógica, a expressão designa grupos familiares ou clãs. A tradução literal e natural preserva a repetição formal do grego sem substituir o termo pelo mais interpretativo «descendentes».
- source_word: Ἀκούδ
  choice: Acude
  rationale: Transliteração adaptada à ortografia e à pronúncia correntes do português, com c para o som de k e e de apoio ao final para evitar uma forma gráfica pouco natural.
- source_word: Οὐτά
  choice: Utá
  rationale: O ditongo grego ου representa o som /u/; a forma portuguesa «Utá» reproduz esse valor e marca a tonicidade final indicada pelo grego.
- source_word: Κητάβ
  choice: Quetabe
  rationale: Forma aportuguesada do nome grego, com «qu» antes de e para conservar o som /k/ e e final de apoio; não é harmonizada com a lista hebraica divergente.
- source_word: Ἀκκαβά
  choice: Acabá
  rationale: Transliteração portuguesa legível; a geminação de κ não precisa ser representada, pois não é distintiva no português moderno, e o acento conserva a tonicidade final.
- source_word: Συβαεί
  choice: Sibei
  rationale: Representa de modo simples e legível a forma grega transmitida, preservando-a como nome próprio distinto sem substituí-la por nomes do paralelo hebraico.
- source_word: Ἀνάν
  choice: Anã
  rationale: Forma portuguesa que aproxima a terminação grega e assinala a tonicidade final, evitando uma leitura paroxítona.
- source_word: Κουά
  choice: Cuá
  rationale: O ου grego tem valor /u/; «Cuá» oferece uma forma portuguesa natural e mantém a tonicidade final.
- source_word: Κεδδούρ
  choice: Quedur
  rationale: 'Transliteração adaptada ao português: «qu» conserva o som /k/ antes de e, «u» representa ου, e a consoante dupla grega é simplificada segundo o uso português.'
theological_decisions:
- issue: Relação entre a lista grega e o paralelo hebraico aproximado de Neemias 7:45
  choice: Traduzir os nomes da lista grega como estão, sem harmonizá-los com o hebraico.
  alternative: Substituir ou ajustar alguns nomes segundo a lista hebraica, como Salum, Ater, Talmom, Acube, Hatita e Sobai.
  rationale: Para 1 Esdras, o texto grego é a fonte primária. Como o paralelo hebraico diverge tanto nos nomes quanto na estrutura, ele serve apenas como testemunho comparativo e não como base para reconstruir ou corrigir esta lista.
translation_notes:
  register: Português moderno, claro e digno, com grafias de nomes adaptadas à leitura lusófona e boa legibilidade brasileira. A repetição de «os filhos de» conserva a estrutura formular do grego. A vírgula final foi mantida porque o versículo fornecido integra uma lista que prossegue.
