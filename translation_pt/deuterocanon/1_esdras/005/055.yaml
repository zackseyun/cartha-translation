base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/055.yaml
  text: And they laid the foundation of the temple of God on the new moon of the second month[a], in the second year after they had come into Judea and Jerusalem.
translation:
  language: pt
  text: E lançaram os alicerces do templo de Deus no dia da lua nova do segundo mês, no segundo ano depois de terem chegado à Judeia e a Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐθεμελίωσαν
  choice: lançaram os alicerces
  rationale: O verbo significa assentar ou lançar um fundamento; no contexto de uma construção, esta é uma formulação portuguesa natural e precisa.
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: do templo de Deus
  rationale: ναός designa diretamente o templo ou santuário. “Templo de Deus” preserva com precisão o referente cultual do grego, sem depender da formulação paralela “casa de Deus”.
- source_word: τῇ νουμηνίᾳ
  choice: no dia da lua nova
  rationale: νουμηνία indica a lua nova ou o começo do mês. A inclusão de “dia” torna a referência temporal natural em português sem reduzi-la simplesmente ao primeiro dia do mês.
- source_word: τοῦ δευτέρου μηνὸς
  choice: do segundo mês
  rationale: A expressão qualifica a lua nova, indicando a lua nova pertencente ao segundo mês.
- source_word: τοῦ δευτέρου ἔτους
  choice: no segundo ano
  rationale: Forma idiomática portuguesa para a datação cronológica expressa pelo genitivo grego.
- source_word: ἐν τῷ ἐλθεῖν
  choice: depois de terem chegado
  rationale: O infinitivo articular com ἐν tem valor temporal. O contexto favorece uma ação anterior à colocação dos alicerces, embora “quando chegaram” também seja gramaticalmente possível.
- source_word: εἰς τὴν Ἰουδαίαν καὶ Ἰερουσαλήμ
  choice: à Judeia e a Jerusalém
  rationale: εἰς expressa movimento em direção ao destino; “chegar a” é a regência corrente em português. A crase aparece diante de “Judeia”, mas não diante de “Jerusalém”.
theological_decisions:
- issue: Tradução de ναός no contexto da reconstrução
  choice: templo de Deus
  alternative: casa de Deus
  rationale: O grego emprega especificamente ναός, cujo sentido direto é “templo/santuário”. “Casa de Deus” é possível por influência da tradição paralela de Esdras, mas é menos lexicalmente direta neste versículo.
- issue: Relação temporal de ἐν τῷ ἐλθεῖν
  choice: depois de terem chegado
  alternative: quando chegaram
  rationale: A construção admite tradução temporal sem fixar necessariamente uma relação estritamente posterior; o contexto e a sequência narrativa apoiam “depois de”, mas a alternativa permanece linguisticamente possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém a referência antiga à lua nova e segue o grego como fonte primária; o paralelo massorético fornecido não corresponde de perto ao conteúdo deste versículo e, por isso, não controla a tradução.
