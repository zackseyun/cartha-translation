base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/060.yaml
  text: And from the priests[a], the Levites, and the heads of their ancestral houses came the elders who had seen the former house, and at the building of this one they cried out with a loud cry and great weeping[b],
translation:
  language: pt
  text: E vieram os anciãos dentre os sacerdotes, os levitas e os chefes de suas casas ancestrais, que tinham visto a casa anterior[a]. Por ocasião da construção desta, deram gritos e choraram muito[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz “a casa anterior” e “esta”, preservando o uso de “casa” como designação do templo.
    reason: cultural_note
  - marker: b
    text: 'Ou: “com gritos e grande choro”. O grego menciona explicitamente tanto o clamor quanto o choro; a cena pode retratar uma lamentação pública diante do contraste entre o novo templo e o anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προκαθημένων
  choice: chefes
  rationale: O particípio substantivado designa os que estão à frente ou presidem. “Chefes” combina naturalmente com a estrutura de linhagem expressa por “casas ancestrais”.
- source_word: κατὰ τὰς πατριὰς αὐτῶν
  choice: de suas casas ancestrais
  rationale: A expressão indica grupos familiares organizados pela linhagem paterna. “Casas ancestrais” preserva esse sentido social sem recorrer à forma mais arcaica “casas paternas”.
- source_word: οἱ πρεσβύτεροι
  choice: os anciãos
  rationale: O termo pode destacar tanto a idade avançada quanto a posição reconhecida na comunidade; “anciãos” mantém as duas possibilidades.
- source_word: ἑωρακότες
  choice: tinham visto
  rationale: 'O particípio perfeito aponta para uma experiência anterior ainda relevante: esses anciãos haviam sido testemunhas da casa precedente.'
- source_word: τὸν πρὸ τοῦ οἶκον
  choice: a casa anterior
  rationale: A referência é ao templo anterior. “Casa” preserva a maneira tradicional de designar o santuário, enquanto “anterior” explicita o contraste temporal.
- source_word: πρὸς τὴν τούτου οἰκοδομήν
  choice: ao presenciarem a construção desta
  rationale: A formulação grega é condensada e relaciona a reação dos anciãos à construção da casa presente. A versão portuguesa torna essa relação natural sem determinar além do contexto o momento exato da obra.
- source_word: μετὰ κραυγῆς καὶ κλαυθμοῦ μεγάλου
  choice: deram altos brados e choraram muito
  rationale: A tradução verbal conserva os dois elementos explícitos no grego — clamor e choro — e expressa sua grande intensidade em português corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase grega, bastante comprimida, foi dividida em duas orações para evitar ambiguidade sintática artificial. Mantiveram-se “anciãos” e “casa” por seu valor histórico e pela tensão entre idade, posição comunitária e memória do templo anterior.
