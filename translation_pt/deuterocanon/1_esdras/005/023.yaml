translation:
  language: pt
  text: os filhos de Samá[a], três mil trezentos e um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego traz «Samá» e o total de 3.301. O paralelo aproximado de Esdras 2:29 no Texto Massorético traz «os filhos de Nebo», num total de cinquenta e dois. Como 1 Esdras é traduzido aqui a partir do testemunho grego, o texto principal segue o grego apesar dessa grande divergência.
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: os filhos de
  rationale: Nesta lista censitária, υἱοὶ designa os descendentes ou integrantes de uma família ou clã. A formulação tradicional e natural em português é «os filhos de».
- source_word: Σαμά
  choice: Samá
  rationale: O nome próprio é transliterado diretamente do testemunho grego primário, com acento gráfico para indicar a tonicidade natural em português. O paralelo aproximado do Texto Massorético traz «Nebo», divergência registrada em nota.
- source_word: τρισχίλιοι τρακόσιοι εἷς
  choice: três mil trezentos e um
  rationale: A expressão numeral grega indica 3.301 e é vertida por extenso, preservando o estilo formal da lista.
