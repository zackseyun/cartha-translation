base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/059.yaml
  text: And all the people sounded trumpets and shouted with a loud voice, praising the Lord because of the raising up of the house of the Lord.
translation:
  language: pt
  text: E todo o povo tocou as trombetas e deu um grande grito, louvando o Senhor pela edificação[a] da casa do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pela reconstrução da casa do Senhor”. O termo grego significa literalmente “levantamento” e pode se referir à casa sendo erguida, edificada ou restaurada.
    reason: Preservar a amplitude de ἐγέρσις e registrar a leitura contextual “reconstrução” sem restringir o texto principal.
lexical_decisions:
- source_word: πᾶς ὁ λαός
  choice: todo o povo
  rationale: Preserva a totalidade da expressão coletiva grega e soa natural em português; por isso, os verbos concordam no singular.
- source_word: ἐσάλπισαν
  choice: tocou as trombetas
  rationale: Expressa de modo idiomático o ato indicado pelo verbo grego. O objeto “as trombetas” está implícito no sentido verbal e é naturalmente explicitado em português.
- source_word: ἐβόησαν φωνῇ μεγάλῃ
  choice: deu um grande grito
  rationale: Reproduz em português corrente tanto a ação de gritar quanto a intensidade de φωνῇ μεγάλῃ, sem a formulação menos idiomática “gritou com grande voz”.
- source_word: ὑμνοῦντες
  choice: louvando
  rationale: Mantém o sentido de louvor dirigido a Deus sem especificar indevidamente se era cantado.
- source_word: τῷ κυρίῳ
  choice: o Senhor
  rationale: Traduz diretamente o grego κύριος no contexto do culto ao Deus de Israel.
- source_word: ἐπὶ τῇ ἐγέρσει
  choice: pela edificação
  rationale: No contexto da casa do Senhor sendo levantada, “edificação” comunica de forma natural a construção ou ereção do edifício. A nota preserva a possibilidade contextual de reconstrução e a imagem literal do grego.
- source_word: τοῦ οἴκου Κυρίου
  choice: da casa do Senhor
  rationale: Conserva a expressão bíblica do texto grego e sua ressonância intertextual, em vez de substituí-la pela interpretação explícita “templo”.
theological_decisions:
- issue: Tradução de κύριος como referência ao Deus de Israel
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte primária grega traz κύριος, não o nome divino hebraico diretamente; “Senhor” traduz o texto disponível sem introduzir uma distinção tipográfica ausente nele.
- issue: Sentido de ἐγέρσει no contexto da casa do Senhor
  choice: edificação
  alternative: reconstrução
  rationale: “Edificação” mantém a noção ampla de levantar ou erigir a casa, enquanto “reconstrução” explicita o contexto histórico, mas é lexicalmente mais restrita. A alternativa é registrada em nota para não eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A concordância no singular acompanha o coletivo “todo o povo”; “deu um grande grito” evita uma construção artificial e preserva a intensidade do grego.
