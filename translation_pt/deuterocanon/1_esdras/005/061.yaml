  text: and many with trumpets[a], and great joy with the voice[b];
translation:
  language: pt
  text: e muitos com trombetas[a], e grande alegria com a voz[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego é elíptico e conserva um estilo fragmentário, semelhante a uma lista: literalmente, «e muitos com/por meio de trombetas».'
    reason: lexical_alternative
  - marker: b
    text: O paralelo hebraico (Esdras 3:10) descreve mais plenamente sacerdotes com trombetas e levitas com címbalos louvando o SENHOR. Aqui, 1 Esdras apresenta uma forma grega abreviada da cena; o grego diz literalmente «com a voz», sem qualificá-la como «alta».
    reason: cross_reference
lexical_decisions:
- source_word: πολλοὶ
  choice: muitos
  rationale: Preserva o adjetivo substantivado e o estilo elíptico do grego, sem acrescentar «homens», «pessoas» ou outro referente não expresso.
- source_word: διὰ σαλπίγγων
  choice: com trombetas
  rationale: διά com o genitivo tem aqui valor instrumental; «com trombetas» comunica isso naturalmente e concorda com o cenário mais desenvolvido do paralelo hebraico.
- source_word: χαρὰ μεγάλη
  choice: grande alegria
  rationale: Tradução direta que mantém o substantivo χαρά e a intensidade indicada por μεγάλη.
- source_word: τῇ φωνῇ
  choice: na voz
  rationale: Mantém o artigo, o singular e a ausência de um adjetivo como «alta». Embora a expressão seja incomum em português, ela preserva a forma comprimida e algo fragmentária do texto grego.
theological_decisions: []
translation_notes:
  register: Português moderno, sóbrio e inteligível, com leve estranheza deliberada em «na voz» para não completar nem reinterpretar a construção elíptica do grego. A pontuação final preserva o caráter de fragmento do versículo fornecido.
