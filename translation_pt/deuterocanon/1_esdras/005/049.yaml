base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/049.yaml
  text: And they gathered themselves to them from the other nations of the land[a], and they were strengthened at the altar in its place; for they were in hostility toward them. All the nations on the land prevailed against them, and they offered sacrifices at the appointed time, and whole burnt offerings to the Lord[c][b], morning and evening.
translation:
  language: pt
  text: E, dentre as outras nações da terra, juntaram-se a eles[a], e eles se firmaram junto ao altar, em seu lugar, pois estavam em hostilidade contra eles. Todas as nações da terra prevaleceram contra eles, e eles ofereceram sacrifícios no tempo determinado e ofertas totalmente queimadas ao Senhor[b], de manhã e à tarde.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram reunidos a eles”. O verbo grego também pode indicar que pessoas das outras nações aderiram à comunidade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “holocaustos”. O termo grego designa ofertas consumidas por inteiro pelo fogo.'
    reason: lexical_alternative
  - marker: c
    text: 'O texto grego é mais amplo que o paralelo hebraico aproximado de Esdras 3:2: acrescenta a hostilidade das nações da terra, o fato de elas prevalecerem contra eles e a apresentação regular de sacrifícios de manhã e à tarde.'
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισυνήχθησαν αὐτοῖς
  choice: juntaram-se a eles
  rationale: A forma passiva/média pode exprimir tanto reunião quanto adesão voluntária. A construção pronominal conserva essa nuance sem acrescentar um sujeito como “alguns”.
- source_word: ἐκ τῶν ἄλλων ἐθνῶν τῆς γῆς
  choice: dentre as outras nações da terra
  rationale: Mantém ἔθνη como “nações” e preserva a expressão geográfica do grego, sem transformá-la em “nações vizinhas”.
- source_word: κατωρθώθησαν
  choice: se firmaram
  rationale: O verbo é difícil neste contexto e pode sugerir fortalecimento, estabelecimento ou êxito. “Se firmaram” comunica estabilidade junto ao altar sem impor uma reconstrução técnica.
- source_word: ἐπὶ τὸ θυσιαστήριον ἐπὶ τοῦ τόπου αὐτῶν
  choice: junto ao altar, no lugar deste
  rationale: Expressa a localização do altar em seu devido lugar de modo natural em português, acompanhando o sentido contextual da repetição de ἐπί.
- source_word: ἐν ἔχθρᾳ ἦσαν αὐτοῖς
  choice: havia hostilidade contra eles
  rationale: Preserva a força nominal de ἔχθρᾳ e a tensão relacional sem identificar além do texto quem nutria essa hostilidade.
- source_word: κατίσχυσαν αὐτοὺς
  choice: prevaleceram contra eles
  rationale: Reproduz o sentido adversativo de ser forte contra alguém, sem intensificá-lo necessariamente para “destruíram” ou “subjugaram”.
- source_word: κατὰ τὸν καιρὸν
  choice: no tempo determinado
  rationale: Comunica que os sacrifícios eram apresentados na ocasião apropriada ou prescrita.
- source_word: ὁλοκαυτώματα
  choice: ofertas totalmente queimadas
  rationale: Explicita que essas ofertas eram consumidas por inteiro pelo fogo e evita depender do sentido técnico, hoje menos transparente, de “holocaustos”.
- source_word: Κυρίῳ
  choice: ao Senhor
  rationale: É a tradução portuguesa convencional e adequada de κύριος neste contexto cultual.
- source_word: τὸ πρωϊνὸν καὶ τὸ δειλινόν
  choice: de manhã e à tarde
  rationale: Forma natural em português para o par temporal que designa as ofertas diárias matutina e vespertina.
theological_decisions:
- issue: Relação entre o texto grego de 1 Esdras e o paralelo hebraico aproximado de Esdras 3:2
  choice: Traduzir integralmente o texto grego mais amplo, incluindo a hostilidade, a prevalência das nações e as ofertas regulares
  alternative: Harmonizar a passagem com o paralelo hebraico mais breve, omitindo ou suavizando essas orações
  rationale: O grego é a testemunha primária para 1 Esdras. Suas ampliações e tensões devem ser preservadas, não reduzidas ao conteúdo do paralelo massorético.
- issue: Identidade e avaliação teológica das nações da terra
  choice: Empregar apenas “outras nações da terra” e a linguagem explícita de hostilidade e prevalência
  alternative: Identificá-las como estrangeiros, pagãos ou inimigos do povo de Deus
  rationale: O grego descreve oposição, mas não autoriza a importação de categorias étnicas ou teológicas mais específicas.
- issue: Alternância pouco explícita dos referentes pronominais
  choice: Preservar os referentes como “eles”, sem identificar os grupos dentro do corpo do versículo
  alternative: Substituir os pronomes por “os repatriados”, “os judeus” ou “as nações”
  rationale: A sequência grega contém tensão e possível mudança de sujeito. Nomear os referentes resolveria uma ambiguidade que o texto não resolve expressamente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Evitou-se “holocaustos” no texto principal por sua possível opacidade ou associação moderna, mantendo-o em nota como termo bíblico tradicional. Os pronomes foram preservados para não eliminar a ambiguidade do grego.
