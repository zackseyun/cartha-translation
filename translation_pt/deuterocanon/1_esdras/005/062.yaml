base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/062.yaml
  text: so that the people could not hear the trumpets because of the weeping of the people[a]; for the crowd was sounding them loudly[b], so that it was heard from far away.
translation:
  language: pt
  text: de modo que o povo não conseguia ouvir as trombetas por causa do choro do povo[a]; pois a multidão as tocava com grande estrondo[b], de modo que se ouvia de longe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo hebraico em Esdras 3:11 descreve o povo dando um grande grito de louvor ao SENHOR; aqui, 1 Esdras destaca de forma mais desenvolvida o som das trombetas e o choro.
    reason: cross_reference
  - marker: b
    text: 'Ou: “produzia um forte toque de trombetas”. O grego emprega uma construção condensada cujo sentido exato pode ser o ato de tocar as trombetas ou o som produzido por elas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: de modo que
  rationale: Introduz uma oração de resultado e preserva naturalmente a força consecutiva do grego.
- source_word: τὸν λαὸν μὴ ἀκούειν
  choice: o povo não conseguia ouvir
  rationale: Expressa em português idiomático a incapacidade resultante, sem sugerir recusa voluntária em ouvir.
- source_word: τῶν σαλπίγγων
  choice: as trombetas
  rationale: Mantém a referência literal aos instrumentos; no contexto, ouvir as trombetas equivale a ouvir seu som.
- source_word: διὰ τὸν κλαυθμὸν τοῦ λαοῦ
  choice: por causa do choro do povo
  rationale: κλαυθμός indica choro audível; a repetição de 'povo' acompanha a repetição deliberada do grego.
- source_word: ὁ γὰρ ὄχλος
  choice: pois a multidão
  rationale: Distingue ὄχλος de λαός sem alterar o referente coletivo e conserva a relação explicativa de γάρ.
- source_word: ἦν ὁ σαλπίζων μεγάλως
  choice: as tocava com grande estrondo
  rationale: A construção grega é condensada; o pronome retoma as trombetas, e 'com grande estrondo' comunica o som intenso de μεγάλως de modo natural.
- source_word: μακρόθεν ἀκούεσθαι
  choice: se ouvia de longe
  rationale: Reproduz de maneira idiomática o passivo impessoal e o sentido espacial do advérbio.
