base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/014.yaml
  text: the sons of Adonikam[a], thirty-seven; the sons of Bosai, two thousand six hundred six; the sons of Adilion, four hundred fifty-four;
translation:
  language: pt
  text: os filhos de Adonicão, trinta e sete[a]; os filhos de Bosai, dois mil seiscentos e seis; os filhos de Adeílio, quatrocentos e cinquenta e quatro;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego traz “trinta e sete” para Adonicão; o paralelo da tradição massorética em Esdras/Neemias traz “seiscentos e sessenta e seis”.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: os filhos de
  rationale: Nesta lista censitária, a expressão funciona como fórmula genealógica para os membros ou descendentes de uma família. A tradução preserva a estrutura formal do grego sem acrescentar interpretação.
- source_word: Ἀδωνεικάμ
  choice: Adonicão
  rationale: Forma portuguesa tradicional e legível do nome semítico, coerente com o grego e com o paralelo hebraico, sem alterar sua identidade.
- source_word: τριάκοντα ἑπτά
  choice: trinta e sete
  rationale: Reproduz exatamente o número do texto grego, por extenso, sem harmonizá-lo com o testemunho massorético divergente.
- source_word: Βοσαί
  choice: Bosai
  rationale: Transliteração direta e natural da forma grega, mantida sem reconstrução a partir de um possível nome hebraico.
- source_word: δισχίλιοι ἑξακόσιοι ἕξ
  choice: dois mil seiscentos e seis
  rationale: Tradução exata do numeral grego em português corrente.
- source_word: Ἀδειλίου
  choice: Adílio
  rationale: Adaptação portuguesa da forma grega em genitivo, tratada como nome da família e sem importar uma identificação hebraica incerta.
- source_word: τετρακόσιοι πεντήκοντα τέσσαρες
  choice: quatrocentos e cinquenta e quatro
  rationale: Tradução exata do numeral grego, conforme a sintaxe numérica natural do português.
theological_decisions:
- issue: Divergência entre o número do texto grego de 1 Esdras e o paralelo da tradição massorética
  choice: Manter “trinta e sete”, conforme o grego de 1 Esdras
  alternative: Adotar ou harmonizar com “seiscentos e sessenta e seis”, conforme o paralelo massorético de Esdras/Neemias
  rationale: O grego é o texto-fonte primário para 1 Esdras. A divergência material deve ser preservada e documentada, não resolvida silenciosamente por harmonização.
translation_notes:
  register: Português moderno, claro e digno, com a fórmula repetitiva própria de uma lista genealógica. Os números são escritos por extenso e os nomes seguem formas portuguesas legíveis ou transliterações diretas quando não há forma tradicional segura.
