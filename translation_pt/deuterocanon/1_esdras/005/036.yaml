lexical_decisions:
- source_word: ἀναβάντες
  choice: subiram
  rationale: Reproduz o particípio de ἀναβαίνω e sua linguagem convencional de subida geográfica ou de retorno, sem explicitar um destino ausente no grego.
- source_word: ἡγούμενος αὐτῶν
