  text: the sons of Solomon’s servants[a], the sons of Assapheioth, the sons of Phaerida, the sons of Jeelei, the sons of Lozon, the sons of Isdael, the sons of Saphuei,
translation:
  language: pt
  text: os filhos dos servos de Salomão[a], os filhos de Assafeiote, os filhos de Fareidá, os filhos de Jeeli, os filhos de Lozom, os filhos de Isdael e os filhos de Safuei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego apresenta aqui vários nomes de famílias que diferem consideravelmente do paralelo aproximado do Texto Massorético, cuja lista é mais curta: «os filhos de Gidel, os filhos de Gahar e os filhos de Reaías».'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: os filhos de
  rationale: Fórmula genealógica repetida; mantém a linguagem de descendência e soa natural em português.
- source_word: παίδων Σαλωμών
  choice: dos servos de Salomão
  rationale: O genitivo identifica o grupo conhecido como os servos de Salomão; «servos» é adequado ao contexto administrativo e evita impor uma ênfase indevida em escravidão.
- source_word: Σαλωμών
  choice: Salomão
  rationale: Forma portuguesa consagrada do nome régio.
- source_word: Ἀσσαφειώθ
  choice: Assafeiote
  rationale: Transliteração portuguesa próxima do grego, sem harmonização com o paralelo hebraico.
- source_word: Φαρειδά
  choice: Fareidá
  rationale: Transliteração do grego com acento final indicado para leitura natural em português.
- source_word: Ἰεηλεί
  choice: Jeeli
  rationale: Transliteração legível em português da forma grega, usando J para a inicial conforme a tradição dos nomes bíblicos.
- source_word: Λοζών
  choice: Lozom
  rationale: Adaptação ortográfica portuguesa da terminação grega, preservando a forma do nome.
- source_word: Ἰσδαήλ
  choice: Isdael
  rationale: Transliteração próxima do grego, sem assimilação a uma forma hebraica mais conhecida.
- source_word: Σαφυεί
  choice: Safuei
  rationale: Transliteração transparente da forma grega rara.
theological_decisions:
- issue: Relação entre a lista grega e o paralelo aproximado do Texto Massorético
  choice: Traduzir integralmente os nomes presentes no texto grego e registrar a divergência em nota.
  alternative: 'Harmonizar a lista com o paralelo hebraico mais curto: Gidel, Gaar e Reaías.'
  rationale: Para 1 Esdras, o grego é a testemunha primária fornecida. A lista substancialmente diferente do paralelo hebraico deve ser preservada, sem harmonização silenciosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém a fórmula genealógica e translitera os nomes diretamente do grego; os dois-pontos introduzem naturalmente a enumeração das famílias pertencentes ao grupo.
