base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/011.yaml
  text: The sons of Phath-moab[a], of the sons of Jeshua and Joab[b], two thousand eight hundred and two.
translation:
  language: pt
  text: 'Os filhos de Ftalemoabe[a], dos filhos de Jesua e Roboabe[b]: dois mil oitocentos e dois.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz Ftalemoabe; a tradição hebraica paralela costuma trazer Paate-Moabe.
    reason: alternative_reading
  - marker: b
    text: O grego traz “Jesua e Roboabe”; as listas paralelas de Esdras e Neemias costumam apresentar “Jesua e Joabe”. Como 1 Esdras por vezes reorganiza ou reformula seu material-fonte, a forma grega foi mantida no texto.
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: Os filhos de
  rationale: Mantém a fórmula genealógica do grego; neste tipo de lista, pode designar filhos ou descendentes pertencentes a um clã.
- source_word: Φθαλεμωάβ
  choice: Ftalemoabe
  rationale: Translitera a forma do nome preservada no texto grego, que é a fonte primária, com adaptação natural à ortografia portuguesa.
- source_word: εἰς τοὺς υἱοὺς
  choice: dos filhos de
  rationale: Neste contexto de recenseamento, εἰς introduz uma subdivisão ou linhagem, não movimento; a fórmula portuguesa preserva a relação genealógica sem explicá-la em excesso.
- source_word: Ἰησοῦ
  choice: Jesua
  rationale: No contexto pós-exílico, a forma portuguesa Jesua distingue adequadamente este nome do uso neotestamentário de Jesus.
- source_word: Ῥοβοάβ
  choice: Roboabe
  rationale: Segue diretamente a leitura inequívoca do testemunho grego, em vez de substituí-la silenciosamente pelo Joabe das listas paralelas.
- source_word: δισχίλιοι ὀκτακόσιοι δύο
  choice: dois mil oitocentos e dois
  rationale: Reproduz literalmente o total cardinal e o apresenta por extenso, em harmonia com o registro literário da lista.
