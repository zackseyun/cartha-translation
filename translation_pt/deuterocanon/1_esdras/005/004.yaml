  yaml_path: translation/deuterocanon/1_esdras/005/004.yaml
  text: And these are the names of the men who were going up according to their ancestral houses[a], into their tribes[b], each to his own administrative division.
translation:
  language: pt
  text: E estes são os nomes dos homens que subiam, segundo as suas linhagens[a], para as suas tribos, cada um para a sua própria divisão administrativa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “segundo as suas casas paternas”. O termo grego refere-se a grupos de parentesco definidos pela linhagem ancestral.
    reason: lexical_alternative
  - marker: b
    text: O termo grego aqui traduzido por “divisão administrativa” é raro e também pode indicar um distrito, uma porção territorial ou outra divisão formal.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ταῦτα τὰ ὀνόματα
  choice: E estes são os nomes
  rationale: Mantém o conectivo narrativo e o demonstrativo que introduz a lista; o verbo “são”, implícito no grego, é necessário para uma formulação natural em português.
- source_word: τῶν ἀνδρῶν
  choice: dos homens
  rationale: ἀνήρ é especificamente masculino neste registro genealógico e provavelmente designa homens ou representantes masculinos.
- source_word: τῶν ἀναβαινόντων
  choice: que subiam
  rationale: Preserva o aspecto do particípio presente e a linguagem tradicional de subir rumo à terra ou a Jerusalém, sem especificar um destino ausente deste versículo.
- source_word: κατὰ πατριὰς αὐτῶν
  choice: segundo as suas linhagens
  rationale: πατριά designa um grupo de parentesco definido pela ascendência; “linhagens” é claro e evita o tom arcaico de “casas paternas” no texto principal.
- source_word: εἰς τὰς φυλὰς
  choice: para as suas tribos
  rationale: “Para” conserva a direção expressa por εἰς; o possessivo explicita em português a relação contextual das pessoas com as respectivas tribos.
- source_word: ἐπὶ τὴν μεριδαρχίαν αὐτῶν
  choice: cada um para a sua própria divisão administrativa
  rationale: μεριδαρχία é um termo raro ligado a uma divisão ou distrito formal. A formulação comunica a provável organização territorial ou administrativa e torna explícito o sentido distributivo do possessivo plural.
