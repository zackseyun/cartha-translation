base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/026.yaml
  text: 'The Levites: the sons of Jesueis[a], Koddelou, Bannou, and Soudiou, seventy-four.'
translation:
  language: pt
  text: 'Os levitas: os filhos de Jesuéis[a], Coddelo, Bano e Súdio, setenta e quatro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vários nomes deste versículo diferem dos encontrados nos paralelos mais conhecidos de Esdras-Neemias; esta tradução segue o texto grego de 1 Esdras, sem harmonizá-los com a tradição hebraica.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Λευεῖται
  choice: Os levitas
  rationale: A expressão funciona como cabeçalho nominativo nesta lista censitária; a tradução mantém sua forma simples, sem acrescentar uma conjunção ausente do grego.
- source_word: υἱοὶ
  choice: os filhos de
  rationale: Em listas genealógicas e censitárias, o termo indica filiação ou pertencimento a uma linhagem. “Os filhos de” preserva de perto a formulação do texto, sem ampliar explicitamente para “descendentes”.
- source_word: Ἰησουείς
  choice: Jesuéis
  rationale: Transliteração adaptada à ortografia portuguesa da forma própria preservada no texto grego, sem harmonização com nomes mais conhecidos dos paralelos de Esdras-Neemias.
- source_word: Κοδδηλοῦ
  choice: Coddelo
  rationale: O nome é vertido pela forma nominal portuguesa correspondente à forma grega no genitivo. Mantém-se a consoante dupla do testemunho grego e evita-se a harmonização conjectural com “Cadmiel”.
- source_word: Βάννου
  choice: Bano
  rationale: A forma grega no genitivo é normalizada como nome próprio em português, sem substituí-la por “Bani”, que dependeria da tradição paralela.
- source_word: Σουδίου
  choice: Súdio
  rationale: A forma grega no genitivo é apresentada como nome próprio natural em português. Não se adota “Hodavias”, que seria uma retroversão ou harmonização com outra tradição textual.
- source_word: ἑβδομήκοντα τέσσαρες
  choice: setenta e quatro
  rationale: É a tradução direta do numeral cardinal, em formulação corrente no português moderno.
