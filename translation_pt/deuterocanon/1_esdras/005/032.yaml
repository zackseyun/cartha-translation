base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/032.yaml
  text: the sons of Dedda[a], the sons of Bachous, the sons of Serar, the sons of Thomthei, the sons of Nasei[b], the sons of Hatepha.
translation:
  language: pt
  text: os filhos de Dedá[a], os filhos de Bacús, os filhos de Serar, os filhos de Tômtei, os filhos de Nasei[b] e os filhos de Hatefá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego apresenta aqui seis nomes de famílias — Dedá, Bacús, Serar, Tômtei, Nasei e Hatefá —, enquanto o paralelo hebraico aproximado apresenta três nomes diferentes: Lebaná, Hagabá e Acube. Como a tradução de 1 Esdras segue aqui o testemunho grego, os nomes gregos foram mantidos, sem harmonização com o paralelo hebraico.'
    reason: alternative_reading
  - marker: b
    text: Vários nomes deste versículo são raros e podem refletir instabilidade textual ou diferenças de transliteração na tradição grega. A tradução segue de maneira conservadora o texto grego fornecido.
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ
  choice: os filhos de
  rationale: Na fórmula repetida desta lista, designa descendentes ou membros de uma família, não necessariamente filhos imediatos. “Os filhos de” preserva de modo claro e tradicional a estrutura genealógica do grego.
- source_word: Δεδδά
  choice: Dedá
  rationale: Transliteração direta do nome grego, com acento gráfico conforme a tonicidade indicada pela fonte; não se harmoniza com o nome diferente do paralelo hebraico aproximado.
- source_word: Βαχούς
  choice: Bacús
  rationale: 'Transliteração portuguesa conservadora: χ é representado por c neste nome e ου por u; o acento mantém a tonicidade final do grego.'
- source_word: Σεράρ
  choice: Serar
  rationale: Transliteração direta do testemunho grego. O nome diferente no paralelo hebraico aproximado não substitui a leitura de 1 Esdras.
- source_word: Θόμθει
  choice: Tômtei
  rationale: Transliteração adaptada à ortografia portuguesa, preservando a tonicidade inicial e a forma rara do nome sem normalização especulativa.
- source_word: Νασεί
  choice: Nasei
  rationale: Transliteração conservadora da forma grega; não há base suficiente nas fontes fornecidas para emendá-la.
- source_word: Ἁτεφά
  choice: Atefá
  rationale: Transliteração portuguesa da forma grega, sem representar a aspiração antiga por h, que não é fonêmica no português moderno; o acento preserva a tonicidade final.
