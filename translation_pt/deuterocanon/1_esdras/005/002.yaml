  yaml_path: translation/deuterocanon/1_esdras/005/002.yaml
  text: And Darius sent with them a thousand horsemen[a], until they had brought them back to Jerusalem in peace and with music,
translation:
  language: pt
  text: E Dario enviou com eles mil cavaleiros, até que os reconduzissem em paz a Jerusalém, com músicos[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “com música”. O termo grego pode referir-se a músicos ou, de modo mais geral, à música e ao acompanhamento musical.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναπέστειλεν
  choice: enviou com eles
  rationale: O verbo composto expressa o envio de acompanhantes junto com o grupo; a formulação é direta e natural em português.
- source_word: ἱππεῖς χιλίους
  choice: mil cavaleiros
  rationale: ἱππεῖς designa tropas montadas; “cavaleiros” preserva o sentido militar sem recorrer a linguagem excessivamente técnica.
- source_word: ἕως τοῦ ἀποκαταστῆσαι αὐτούς
  choice: até que os reconduzissem
  rationale: A construção apresenta a escolta até a realização do retorno. “Reconduzissem” comunica que o grupo foi levado de volta a Jerusalém e mantém aberta a nuance entre limite temporal e finalidade prática.
- source_word: μετʼ εἰρήνης
  choice: em paz
  rationale: Mantém o idioma grego e pode abranger tanto uma viagem pacífica quanto uma chegada segura.
- source_word: μετὰ μουσικῶν
  choice: com músicos[a]
  rationale: O plural genitivo μουσικῶν, regido por μετά, favorece a referência a pessoas ligadas à música. A nota preserva a possibilidade mais geral de música ou acompanhamento musical.
