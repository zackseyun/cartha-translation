translation_notes:
  register: Registro atual e digno, próprio de uma lista genealógica. A repetição de “os filhos de” reproduz deliberadamente a estrutura formular do grego. Os nomes foram transliterados do texto grego com adaptações mínimas à ortografia e à pronúncia portuguesas; não foram harmonizados com o paralelo massorético aproximado.
