base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/034.yaml
  text: the sons of Hagia[a], the sons of Phacareth-sabeie, the sons of Sarothei, the sons of Meisaias, the sons of Gas, the sons of Addous, the sons of Soubas, the sons of Apherra, the sons of Barotheis, the sons of Saphag, the sons of Allon;
translation:
  language: pt
  text: Os filhos de Hagiá[a], os filhos de Facarete-Sabeié, os filhos de Saroteí, os filhos de Meisaías, os filhos de Gás, os filhos de Adús, os filhos de Subás, os filhos de Aferrá, os filhos de Baroteís, os filhos de Safág, os filhos de Alón;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo hebraico em Neemias 7:51 é muito mais curto neste ponto: “os filhos de Uzá, os filhos de Paseá, os filhos de Besai”. 1 Esdras preserva uma lista grega ampliada; por isso, a tradução segue os nomes gregos em vez de harmonizá-los com o hebraico.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: os filhos de
  rationale: Mantém a fórmula genealógica repetida do grego. Neste contexto, pode abranger membros ou descendentes de uma linhagem, mas a tradução formal preserva a expressão do texto sem explicá-la no corpo do versículo.
- source_word: Ἁγιά
  choice: Hagia
  rationale: Transliteração conservadora do nome grego, com H para representar o espírito áspero e sem harmonização com o paralelo hebraico aproximado.
- source_word: Φακαρὲθ Σαβειή
  choice: Facarete-Sabeié
  rationale: Transliteração adaptada à ortografia e à pronúncia portuguesas. O hífen conserva a estreita ligação entre os dois elementos do nome, cuja correspondência semítica é incerta.
- source_word: Σαρωθεί
  choice: Saroteí
  rationale: Transliteração do nome conforme a forma grega, sem harmonizá-lo com a lista hebraica mais curta.
- source_word: Μεισαίας
  choice: Meisaías
  rationale: Transliteração conservadora que preserva o ditongo inicial e assinala a tonicidade de modo natural em português.
- source_word: Γάς
  choice: Gás
  rationale: Representação direta da forma grega breve, com acento para indicar a pronúncia portuguesa.
- source_word: Ἀδδούς
  choice: Adús
  rationale: Transliteração adaptada ao português; a consoante dupla grega não precisa ser reproduzida graficamente, e o acento indica a tonicidade.
- source_word: Σουβάς
  choice: Subás
  rationale: Transliteração fonética adequada ao português, em que ου corresponde a u.
- source_word: Ἀφερρά
  choice: Aferrá
  rationale: Transliteração conservadora da forma grega, preservando a consoante dupla e indicando a sílaba tônica.
- source_word: Βαρωθείς
  choice: Baroteís
  rationale: Transliteração próxima da forma grega, adaptada à leitura portuguesa e sem substituição por nome do paralelo hebraico.
- source_word: Σαφάγ
  choice: Safág
  rationale: Transliteração direta do formato consonantal grego, com grafia portuguesa e tonicidade explícita.
- source_word: Ἀλλών
  choice: Alón
  rationale: Transliteração adaptada ao português, preservando a forma do testemunho grego apesar da divergência da lista hebraica.
