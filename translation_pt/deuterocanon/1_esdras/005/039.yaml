    issue: O texto identifica as pessoas, e não o registro, como aquilo que não foi encontrado.
    rationale: μὴ εὑρεθείσης está no feminino singular e concorda com γραφῆς («registro/escritura»). A cláusula deve indicar que o registro genealógico não foi encontrado.
  - severity: medium
    issue: A nota b afirma corretamente a ausência de comprovação, mas o texto principal não a expressa de modo gramaticalmente fiel.
    rationale: A nota não deve compensar uma inversão do antecedente no corpo da tradução.
  - severity: low
    issue: «Pelo nome dele» tem tom mais coloquial e pode soar como posse pessoal excessivamente explícita.
    rationale: «Pelo seu nome» é mais idiomático no registro bíblico moderno e mantém o referente comprimido.
