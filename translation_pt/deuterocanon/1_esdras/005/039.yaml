  source_fidelity: A primeira oração preserva adequadamente a formulação comprimida e o referente pronominal não explicitado. Na segunda, porém, o particípio genitivo feminino singular μὴ εὑρεθείσης retoma naturalmente γραφῆς («registro»), e não as pessoas. A tradução atual diz que «os que ... não foram encontrados», alterando essa relação gramatical e o sentido documental do texto.
  naturalness: «Pelo seu nome» é mais natural e menos coloquial que «pelo nome dele», sem eliminar a ambiguidade presente no grego. A revisão também torna explícito, de modo sóbrio, que o elemento não encontrado era o registro.
  terminology: «Registro genealógico», «alistamento» e «excluídos de exercer o sacerdócio» representam adequadamente a linguagem administrativa e sacerdotal do grego. «Alistamento» verte καταλοχισμός sem transformar o contexto necessariamente em um recenseamento populacional.
  issues:
