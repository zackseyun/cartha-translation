base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/039.yaml
  text: and he was called by his name[a]. And from these[b], those who were searched for in the genealogical record in the enrollment, and were not found, were excluded from serving as priests.
translation:
  language: pt
  text: E ele foi chamado pelo seu nome.[a] E, entre estes,[b] os que foram procurados no registro genealógico, no alistamento, e cujo registro não foi encontrado foram excluídos de exercer o sacerdócio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “recebeu o nome dele”. A frase grega inicial é condensada, e o referente imediato de “seu” não fica plenamente explícito neste versículo isolado.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, não foi possível confirmar sua ascendência no registro genealógico oficial; por isso, eles ficaram impedidos de exercer o serviço sacerdotal.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκλήθη ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: foi chamado pelo nome dele
  rationale: O passivo de καλέω, junto da referência ao nome, indica designação ou identificação pelo nome, não convocação. A formulação mantém a compressão e a ambiguidade do referente no grego.
- source_word: τούτων
  choice: dentre esses
  rationale: Expressa a relação partitiva no contexto sem identificar além do que o verso permite.
- source_word: ἐζητήθησαν
  choice: foram procurados
  rationale: Preserva a voz passiva do grego e o sentido de busca documental, evitando transformar as pessoas em agentes da investigação.
- source_word: τῆς γενικῆς γραφῆς
  choice: no registro genealógico
  rationale: No contexto da habilitação sacerdotal, a expressão se refere ao documento usado para comprovar a linhagem.
- source_word: ἐν τῷ καταλοχισμῷ
  choice: do recenseamento
  rationale: Comunica em português atual o contexto administrativo de listagem e inscrição, sem sugerir necessariamente uma convocação militar.
- source_word: μὴ εὑρεθείσης
  choice: não foram encontrados
  rationale: A construção grega é vertida de modo idiomático, entendendo que as pessoas ou seus registros não foram localizados na documentação; a nota esclarece a elipse.
- source_word: ἐχωρίσθησαν τοῦ ἱερατεύειν
  choice: foram excluídos do serviço sacerdotal
  rationale: Retrata a consequência administrativa da falta de comprovação genealógica e mantém o foco no exercício da função sacerdotal.
theological_decisions:
- issue: Natureza da exclusão da função sacerdotal
  choice: excluídos do serviço sacerdotal por falta de comprovação genealógica
  alternative: excluídos de modo absoluto do sacerdócio
  rationale: O texto descreve uma desqualificação administrativa ligada à ausência do registro, não formula uma doutrina geral sobre o sacerdócio nem explicita a duração da exclusão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conservou-se a voz passiva e a referência pronominal ambígua do grego, enquanto a formulação administrativa foi expressa de maneira natural.
