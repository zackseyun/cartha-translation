base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/007.yaml
  text: These are the ones from Judea who came up from the captivity of the exile[a], whom Nebuchadnezzar king of Babylon had carried away to Babylon[b],
translation:
  language: pt
  text: Estes são os da Judeia que subiram do cativeiro do exílio[a], os quais Nabucodonosor, rei da Babilônia, havia deportado para a Babilônia[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico paralelo de Esdras 2:1 diz “os filhos da província”, em vez de “os da Judeia”. Aqui se segue o texto grego de 1 Esdras como fonte principal.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “havia levado para reassentar na Babilônia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσὶν δὲ οὗτοι
  choice: Estes são
  rationale: δὲ tem aqui leve função conectiva; em português, o início direto é natural e não introduz contraste nem valor temporal ausentes do grego.
- source_word: οἱ ἐκ τῆς Ἰουδαίας
  choice: os que vieram da Judeia
  rationale: O grego menciona explicitamente a Judeia. A formulação portuguesa expressa com naturalidade a procedência indicada por ἐκ, sem substituí-la pela leitura hebraica paralela.
- source_word: οἱ ἀναβάντες
  choice: e subiram
  rationale: Preserva a conhecida imagem geográfica e teológica de subir para a terra, em vez de reduzi-la simplesmente a 'voltaram'.
- source_word: ἐκ τῆς αἰχμαλωσίας τῆς παροικίας
  choice: do cativeiro do exílio
  rationale: 'Mantém a construção formal de dois substantivos: αἰχμαλωσία como ''cativeiro'' e παροικία, neste contexto de deslocamento, como ''exílio''.'
- source_word: οὓς μετῴκισεν
  choice: os quais ... havia deportado
  rationale: μετοικίζω indica remoção e reassentamento compulsório. 'Deportado' é claro, atual e preciso; o mais-que-perfeito composto marca a anterioridade em relação à subida.
- source_word: Ναβουχοδονοσὸρ
  choice: Nabucodonosor
  rationale: Forma consagrada do nome do rei em português.
- source_word: βασιλεὺς Βαβυλῶνος
  choice: rei da Babilônia
  rationale: Expressão portuguesa padrão para o título, definido pelo contexto apesar da ausência de artigo no grego.
- source_word: εἰς Βαβυλῶνα
  choice: para a Babilônia
  rationale: Expressa naturalmente o destino do deslocamento; em português brasileiro, o topônimo costuma receber artigo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Conserva a expressão formal “cativeiro do exílio” e a imagem de “subir”, enquanto usa “deportado” para comunicar com precisão o deslocamento forçado. A vírgula final foi mantida porque o versículo introduz a continuação da lista na unidade textual seguinte.
