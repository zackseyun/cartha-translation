base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/024.yaml
  text: 'The priests: the sons of Jeddus[a], the son of Jeshua, of the sons of Sanabeis, eight hundred seventy-two; the sons of Emerus[c][b], two hundred fifty-two.'
translation:
  language: pt
  text: 'Os sacerdotes: os filhos de Jeddo, filho de Jesua, entre os filhos de Sanabeis[a], oitocentos e setenta e dois; os filhos de Érmero[b][c], duzentos e cinquenta e dois.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz uma construção com preposição equivalente a “para os filhos de Sanabeis”. A expressão é incomum nesta lista censitária e provavelmente indica vinculação familiar, não movimento nem finalidade.
    reason: lexical_alternative
  - marker: b
    text: O nome grego “Érmero” talvez corresponda à família sacerdotal conhecida em outras tradições hebraicas como “Imer”. O texto principal segue diretamente o testemunho grego.
    reason: alternative_reading
  - marker: c
    text: O paralelo do Texto Massorético fornecido para este ponto não corresponde de perto a esta linha grega, refletindo a conhecida reordenação e recomposição do material em 1 Esdras. Por isso, a tradução segue o grego como fonte primária.
    reason: textual_variant
lexical_decisions:
- source_word: οἱ ἱερεῖς
  choice: Os sacerdotes
  rationale: Traduz diretamente o substantivo que introduz o grupo sacerdotal e preserva a estrutura da lista censitária.
- source_word: οἱ υἱοὶ Ἰέδδου
  choice: os filhos de Jeddo
  rationale: Mantém o idioma genealógico formal de υἱοί; nesse contexto, “filhos” pode abranger descendentes ou membros de uma família.
- source_word: τοῦ υἱοῦ Ἰησοῦ
  choice: filho de Jesua
  rationale: O genitivo indica filiação. “Jesua” representa o nome histórico deste contexto pós-exílico e evita a associação anacrônica que “Jesus” poderia sugerir ao leitor moderno.
- source_word: εἰς τοὺς υἱοὺς Σαναβείς
  choice: dentre os filhos de Sanabeis
  rationale: A construção com εἰς é incomum nesta lista. “Dentre” exprime com cautela a provável vinculação familiar, sem lhe impor sentido de movimento ou finalidade.
- source_word: ὀκτακόσιοι ἑβδομήκοντα δύο
  choice: oitocentos e setenta e dois
  rationale: Reprodução direta do numeral por extenso em português corrente.
- source_word: υἱοὶ Ἐρμήρου
  choice: os filhos de Érmero
  rationale: Conserva o idioma genealógico e translitera a forma do testemunho grego primário, em vez de substituí-la por uma forma hebraizada conjectural.
- source_word: διακόσιοι πεντήκοντα δύο
  choice: duzentos e cinquenta e dois
  rationale: Reprodução direta e idiomática do numeral por extenso.
