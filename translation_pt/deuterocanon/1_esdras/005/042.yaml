base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/042.yaml
  text: camels four hundred thirty-five[a], and horses seven thousand thirty-six, mules two hundred forty-five[b], pack animals five thousand five hundred twenty-five.
translation:
  language: pt
  text: camelos, quatrocentos e trinta e cinco; cavalos, sete mil e trinta e seis; mulas, duzentas e quarenta e cinco; e animais de carga, cinco mil quinhentos e vinte e cinco.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto hebraico paralelo fornecido não corresponde ao conteúdo deste versículo; por isso, a lista foi traduzida com base no texto grego.
    reason: textual_variant
lexical_decisions:
- source_word: κάμηλοι
  choice: camelos
  rationale: É o equivalente comum e preciso; o contexto não exige a distinção mais específica de dromedários.
- source_word: ἵπποι
  choice: cavalos
  rationale: Tradução direta e natural do termo grego para esses animais.
- source_word: ἡμίονοι
  choice: mulas
  rationale: O termo grego designa mulas; uma reprodução etimológica literal não seria idiomática em português.
- source_word: ὑποζύγια
  choice: animais de carga
  rationale: Preserva o sentido genérico de animais usados para transportar cargas, sem especificar indevidamente uma espécie.
- source_word: τετρακόσιοι τριάκοντα πέντε
  choice: quatrocentos e trinta e cinco
  rationale: Reprodução direta do numeral grego, por extenso e em concordância com o substantivo.
- source_word: ἑπτακισχίλιοι τριάκοντα ἕξ
  choice: sete mil e trinta e seis
  rationale: Reprodução direta e idiomática do numeral grego.
- source_word: διακόσιοι τεσσεράκοντα πέντε
  choice: duzentas e quarenta e cinco
  rationale: Reprodução direta do numeral grego, com concordância feminina com “mulas”.
- source_word: πεντακισχίλια πεντακόσια εἴκοσι πέντε
  choice: cinco mil quinhentos e vinte e cinco
  rationale: Reprodução direta e idiomática do numeral grego.
