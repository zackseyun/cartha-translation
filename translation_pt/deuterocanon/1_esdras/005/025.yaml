  rationale: Translitera a forma grega Φασσόρου, mantendo o grego como fonte primária, em vez de substituir o nome por uma forma reconstruída a partir de outra tradição textual.
- source_word: χίλιοι διακόσιοι τεσσεράκοντα ἑπτά
  choice: '1.247'
  rationale: A sequência de numerais gregos totaliza 1.247; algarismos favorecem a leitura de um registro censitário, e o ponto segue o uso português como separador de milhares.
