base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/070.yaml
  text: And by plots and by stirring up the crowds and by forming factions[a], they hindered the building from being completed all the time of the life of King Cyrus; and the building was halted for two years[b], until the reign of Darius.
translation:
  language: pt
  text: E, por meio de intrigas, incitando o povo e formando facções, impediram que a construção fosse concluída durante toda a vida do rei Ciro.[a] E os construtores foram impedidos de continuar a obra por dois anos, até o reinado de Dario.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “durante todo o tempo da vida do rei Ciro”.
    reason: lexical_alternative
  - marker: b
    text: 'A oração final também pode ser entendida de modo mais impessoal: “a construção ficou paralisada por dois anos, até o reinado de Dario”.'
    reason: alternative_reading
lexical_decisions:
- source_word: βουλάς
  choice: intrigas
  rationale: No contexto hostil, o plural indica planos destinados a obstruir a obra; “intrigas” comunica essa intenção adversa sem sugerir simples deliberações neutras.
- source_word: δημαγωγοῦντες
  choice: incitando o povo
  rationale: O particípio descreve a ação de influenciar ou agitar a população. “Incitando o povo” é claro e preserva a conotação negativa.
- source_word: συστάσεις ποιούμενοι
  choice: formando facções
  rationale: A expressão sugere agrupamentos organizados em oposição à obra; “formando facções” conserva essa ideia de ação coordenada.
- source_word: ἀπεκώλυσαν
  choice: impediram
  rationale: O verbo expressa obstrução ativa, e a construção com infinitivo é vertida naturalmente como “impediram que ... fosse concluída”.
- source_word: τοῦ ἀποτελεσθῆναι
  choice: que ... fosse concluída
  rationale: 'Preserva o sentido passivo e resultativo do infinitivo: a construção não chegou à conclusão.'
- source_word: οἰκοδομήν
  choice: a construção
  rationale: Neste contexto, o substantivo designa a obra ou projeto de edificação, não apenas o edifício já pronto.
- source_word: πάντα τὸν χρόνον τῆς ζωῆς τοῦ βασιλέως Κύρου
  choice: durante toda a vida do rei Ciro
  rationale: Formulação natural em português que mantém a referência explícita do grego à vida de Ciro, sem substituí-la interpretativamente por “reinado”.
- source_word: εἰρχθησαν τῆς οἰκοδομῆς
  choice: eles foram impedidos de construir
  rationale: A forma passiva plural favorece um sujeito pessoal retomado do contexto; a relação genitiva com a construção é expressa de modo idiomático pelo infinitivo “construir”.
- source_word: ἔτη δύο
  choice: por dois anos
  rationale: A preposição “por” explicita naturalmente a duração em português.
- source_word: ἕως τῆς Δαρείου βασιλείας
  choice: até o reinado de Dario
  rationale: Equivalente temporal direto e corrente de βασιλεία neste contexto histórico.
theological_decisions:
- issue: Sujeito e agência na oração final
  choice: 'A oração passiva se refere pessoalmente aos construtores: “eles foram impedidos de construir”.'
  alternative: 'Entender a oração de modo impessoal, referindo-se à própria obra: “a construção ficou paralisada”.'
  rationale: O plural εἰρχθησαν favorece gramaticalmente um sujeito pessoal, mas a construção grega permite que o efeito sobre a obra seja destacado; a alternativa relevante é preservada em nota, sem transformar uma questão narrativa em afirmação doutrinária.
- issue: Duração da obstrução sob Ciro
  choice: Manter “durante toda a vida do rei Ciro”.
  alternative: Interpretar como “durante todo o reinado do rei Ciro”.
  rationale: O grego diz literalmente “todo o tempo da vida”, não “reinado”. A tradução conserva essa formulação, ainda que o contexto político possa levar alguns leitores a entendê-la em relação ao período de governo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A coordenação dos particípios gregos foi convertida em uma sequência idiomática, sem eliminar o caráter cumulativo das ações hostis. Os marcadores de nota foram posicionados junto às expressões que explicam.
