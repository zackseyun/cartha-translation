base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/029.yaml
  text: 'the sons of Tobeis[a], altogether one hundred thirty-nine; the temple slaves: the sons of Esau, the sons of Taseipha, the sons of Tabaoth, the sons of Keras, the sons of Soua, the sons of Phalaiou, the sons of Labana[c][b],'
translation:
  language: pt
  text: 'os filhos de Tobeis, ao todo cento e trinta e nove; os escravos do templo[a]: os filhos de Esaú, os filhos de Taseifá, os filhos de Tabaote, os filhos de Queras, os filhos de Suá, os filhos de Falaiou, os filhos de Labaná,[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego ἱερόδουλοι também pode ser traduzido como “servidores do templo”; “escravos do templo” preserva mais claramente o sentido de condição servil do termo.
    reason: lexical_alternative
  - marker: b
    text: No texto-fonte, este trecho da lista termina com uma vírgula; o versículo seguinte continua a relação dos escravos do templo.
    reason: cross_reference
  - marker: c
    text: O paralelo hebraico de Neemias 7 não corresponde verbalmente a este trecho; neste ponto, 1 Esdras apresenta outra parte da lista dos que retornaram.
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ
  choice: os filhos de
  rationale: Preserva a fórmula genealógica e clânica repetida no registro censitário, sem substituir por uma interpretação mais ampla como “descendentes”.
- source_word: Τωβείς
  choice: Tobeis
  rationale: Transliteração próxima da forma grega, sem identificá-la indevidamente com outro nome mais conhecido.
- source_word: πάντες
  choice: ao todo
  rationale: Expressa de modo natural em português a função totalizadora do termo no contexto de uma contagem.
- source_word: ἑκατὸν τριάκοντα ἐννέα
  choice: cento e trinta e nove
  rationale: Reproduz exatamente o total em forma corrente no português.
- source_word: οἱ ἱερόδουλοι
  choice: os escravos do templo
  rationale: Mantém tanto a vinculação ao serviço sagrado quanto o sentido de condição servil do termo grego, que “servidores do templo” poderia atenuar.
- source_word: Ἠσαύ
  choice: Esaú
  rationale: Forma consagrada e natural do nome em português.
- source_word: Τασειφά
  choice: Taseifá
  rationale: Transliteração portuguesa próxima da grafia e da acentuação gregas de um nome raro.
- source_word: Ταβαώθ
  choice: Tabaote
  rationale: Transliteração adaptada à leitura portuguesa, preservando de perto a forma grega.
- source_word: Κηράς
  choice: Queras
  rationale: Representa naturalmente em português o kappa grego diante de e, evitando a leitura fricativa que “Ceras” poderia induzir.
- source_word: Σουά
  choice: Suá
  rationale: Transliteração portuguesa direta, sem introduzir uma reconstrução semítica não exigida pelo texto grego.
- source_word: Φαλαίου
  choice: Falaiou
  rationale: Mantém de perto a forma grega rara e incerta, com adaptação apenas do phi ao “f” português.
- source_word: Λαβανά
  choice: Labaná
  rationale: Preserva a vogal final e a tonicidade da forma grega, sem reduzi-la ao nome mais familiar “Labão”.
theological_decisions:
- issue: Sentido social de ἱερόδουλοι na lista de pessoal do templo
  choice: escravos do templo
  alternative: servidores do templo
  rationale: A tradução escolhida não suaviza a condição servil expressa pelo composto grego, ao mesmo tempo que identifica claramente sua ligação com o templo.
- issue: Relação entre a lista grega e o paralelo aproximado do Texto Massorético
  choice: traduzir a lista censitária grega tal como está
  alternative: substituí-la pelo conteúdo hebraico sobre os levitas e os filhos de Jesua e Cadmiel
  rationale: O testemunho hebraico fornecido não é verbalmente paralelo neste ponto. Como 1 Esdras é traduzido prioritariamente do grego, o hebraico serve apenas como comparação e não deve substituir o conteúdo da fonte principal.
translation_notes:
  register: Português moderno, claro e digno, com estrutura repetitiva preservada para refletir o caráter oficial da lista. Os nomes raros seguem transliterações portuguesas próximas do grego, e o ponto e vírgula conserva a continuidade sintática do fragmento.
