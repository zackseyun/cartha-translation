base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/037.yaml
  text: 'And they were not able to declare their families and lineage[a], that they were from Israel: the sons of Asan son of Baenan, the sons of Nekodan[b], six hundred fifty-two.'
translation:
  language: pt
  text: 'Eles não puderam declarar suas famílias e linhagens, para declarar que eram de Israel: os filhos de Asã, filho do filho de Baenã[a]; os filhos de Necodã[b], seiscentos e cinquenta e dois.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz literalmente “Asã, filho do filho de Baenã”. A repetição de “filho” é incomum, mas foi mantida por refletir a redação grega transmitida; pode ser uma expressão genealógica condensada ou irregular.
    reason: lexical_alternative
  - marker: b
    text: O texto grego traz aqui os nomes “Asã”, “Baenã” e “Necodã”. O paralelo aproximado do Texto Massorético em Neemias 7 apresenta nomes diferentes neste ponto; como 1 Esdras é traduzido do testemunho grego, as formas gregas foram mantidas no texto.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἠδύναντο ἀπαγγεῖλαι
  choice: não puderam declarar
  rationale: Mantém tanto a ideia explícita de incapacidade quanto o caráter formal de apresentar informações genealógicas.
- source_word: τὰς πατριὰς αὐτῶν καὶ γενεάς
  choice: suas famílias e linhagens
  rationale: “Famílias” expressa os grupos paternos, enquanto “linhagens” distingue a noção de descendência ancestral sem recorrer ao pouco natural “casas de seus pais”.
- source_word: ὡς ἐκ τοῦ Ἰσραὴλ εἰσίν
  choice: de modo a comprovar que eram de Israel
  rationale: Explicita em português natural a relação probatória entre a informação genealógica e a origem israelita. O grego emprega ὡς e não uma partícula interrogativa; por isso, a tradução evita transformar a oração diretamente em “se eram de Israel”.
- source_word: υἱοὶ
  choice: os filhos de
  rationale: É a correspondência tradicional e transparente em uma lista genealógica, embora possa abranger descendentes em sentido mais amplo.
- source_word: Ἀσὰν
  choice: Asã
  rationale: Transliteração adaptada à ortografia e à pronúncia usuais do português a partir da forma grega.
- source_word: τοῦ υἱοῦ τοῦ Βαενάν
  choice: filho de Baenã
  rationale: Os genitivos articulados identificam Asã como filho de Baenã. Esta leitura preserva a relação filial expressa no grego sem produzir em português a impressão de uma geração adicional (“filho do filho”).
- source_word: Νεκωδάν
  choice: Necodã
  rationale: Transliteração portuguesa da forma grega, que deve permanecer no texto principal apesar da diferença do paralelo massorético aproximado.
- source_word: ἑξακόσιοι πεντήκοντα δύο
  choice: seiscentos e cinquenta e dois
  rationale: Forma numérica corrente em português, preservando exatamente o total do texto grego.
theological_decisions:
- issue: A condição da origem israelita na oração com ὡς
  choice: que eram de Israel
  alternative: se eram de Israel
  rationale: O contexto envolve incapacidade de comprovar a origem, mas a sintaxe grega apresenta a origem israelita como o conteúdo ou resultado que não se pôde estabelecer, sem formular uma pergunta indireta. A tradução conserva essa tensão sem declarar que eles não eram israelitas.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe de lista genealógica. Os nomes próprios foram aportuguesados com acentuação final para leitura natural. A expressão “de modo a comprovar” comunica a função evidencial da genealogia sem concluir indevidamente que as pessoas não pertenciam a Israel.
