base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/005/044.yaml
  text: and to give to the holy treasury for the works one thousand minas of gold[a], and five thousand minas of silver[b], and one hundred priestly garments.
translation:
  language: pt
  text: e dar ao tesouro sagrado destinado às obras[a] mil minas de ouro[b], cinco mil minas de prata e cem vestes sacerdotais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tesouro do templo destinado às obras”. A expressão grega combina a ideia de algo sagrado com a de um tesouro ou depósito.
    reason: lexical_alternative
  - marker: b
    text: A mina era uma antiga unidade de peso e, por extensão, de valor; o termo antigo foi preservado em vez de ser convertido em uma medida moderna.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦναι
  choice: dar
  rationale: Mantém diretamente o infinitivo grego e sua ligação sintática com o contexto anterior, sem acrescentar a ideia mais específica de uma doação formal.
- source_word: ἱερὸν γαζοφυλάκιον
  choice: tesouro sagrado
  rationale: γαζοφυλάκιον designa um tesouro ou depósito de bens valiosos, e ἱερόν o caracteriza como sagrado ou pertencente ao santuário. A formulação preserva ambos os elementos sem explicitar além do grego.
- source_word: τῶν ἔργων
  choice: destinado às obras
  rationale: Expressa em português natural a relação provável de finalidade entre o tesouro e as obras, mantendo no plural a abrangência do grego.
- source_word: χρυσίου μνᾶς χιλίας
  choice: mil minas de ouro
  rationale: Conserva a antiga unidade μνᾶ, sem impor uma conversão moderna incerta, e reproduz com clareza o material e a quantidade.
- source_word: ἀργυρίου μνᾶς πεντακισχιλίας
  choice: cinco mil minas de prata
  rationale: Mantém o paralelismo do inventário e traduz de modo idiomático o material e a quantidade.
- source_word: στολὰς ἱερατικὰς
  choice: vestes sacerdotais
  rationale: στολή pode designar veste ou manto; “vestes” é amplo, digno e acessível, enquanto “sacerdotais” comunica sua destinação aos sacerdotes sem recorrer a terminologia eclesiástica mais técnica.
- source_word: ἑκατόν
  choice: cem
  rationale: Tradução numérica direta, adequada ao estilo de inventário do versículo.
