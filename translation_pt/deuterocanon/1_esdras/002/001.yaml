base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/001.yaml
  text: In the first year of Cyrus king of Persia[a], for the fulfillment of the word of the Lord by the mouth of Jeremiah,
translation:
  language: pt
  text: No primeiro ano do reinado de Ciro, rei da Pérsia, para que se cumprisse a palavra do Senhor[a], proferida pela boca de Jeremias,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo hebraico traz o nome divino YHWH, tradicionalmente representado como «SENHOR».
    reason: Registra uma diferença relevante entre o texto grego principal e o testemunho hebraico paralelo.
lexical_decisions:
- source_word: Βασιλεύοντος Κύρου Περσῶν ἔτους πρώτου
  choice: No primeiro ano do reinado de Ciro, rei da Pérsia
  rationale: A construção grega é um genitivo absoluto que situa o acontecimento no primeiro ano em que Ciro reinava sobre os persas. A formulação portuguesa é natural, e o título «rei da Pérsia» é confirmado pelo paralelo hebraico.
- source_word: εἰς συντέλειαν
  choice: para que se cumprisse
  rationale: Expressa finalidade ou resultado e comunica com clareza a ideia de levar a palavra profética ao seu cumprimento.
- source_word: ῥήματος Κυρίου
  choice: a palavra do Senhor
  rationale: Mantém a fórmula bíblica e segue diretamente o grego Κυρίου, sem substituir no texto principal a forma grega pela representação tipográfica do nome divino presente no paralelo hebraico.
- source_word: ἐν στόματι Ἰερεμίου
  choice: proferida pela boca de Jeremias
  rationale: Preserva a imagem concreta do grego e esclarece em português que a palavra do Senhor foi pronunciada por meio de Jeremias.
theological_decisions:
- issue: Forma de traduzir Κυρίου diante do paralelo hebraico com YHWH
  choice: Senhor
  alternative: SENHOR
  rationale: O texto-base grego traz Κυρίου, que corresponde naturalmente a «Senhor». O paralelo hebraico contém o nome divino YHWH; essa diferença relevante é preservada em nota, sem substituir a leitura do texto grego no corpo principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase conserva a forma incompleta e a vírgula final do trecho-fonte, que prossegue no versículo.
