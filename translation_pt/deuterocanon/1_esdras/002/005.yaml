base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/005.yaml
  text: Therefore[a], if any of you is from his people, may his Lord be with him[c][b], and let him go up to Jerusalem in Judea and build the house of the Lord of Israel—he is the Lord who dwells in Jerusalem.
translation:
  language: pt
  text: Portanto, se algum dentre vocês pertence ao povo dele, que seu Senhor esteja com ele; que ele suba a Jerusalém, na Judeia, e que construam[a] a casa do Senhor de Israel. Este é o Senhor que estabeleceu sua morada em Jerusalém.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego passa do singular (“algum... ele suba”) para o plural (“que construam”). A tradução preserva essa mudança de número.
    reason: textual_variant
  - marker: b
    text: 'O paralelo hebraico em Esdras difere consideravelmente neste ponto: fala de ajuda com prata, ouro, bens e animais, além de uma oferta voluntária para a casa de Deus em Jerusalém. Aqui, 1 Esdras preserva outra forma da tradição em grego.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “que habitou em Jerusalém”. O verbo grego também pode transmitir a ideia de fixar ou estabelecer morada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις ἐστὶν οὖν ὑμῶν ἐκ τοῦ ἔθνους αὐτοῦ
  choice: Portanto, se algum dentre vocês pertence ao povo dele
  rationale: “Portanto” conserva o valor inferencial de οὖν. “Pertence ao povo dele” expressa com naturalidade ἐκ τοῦ ἔθνους αὐτοῦ, sem sugerir necessariamente um Estado-nação moderno.
- source_word: ἔστω ὁ κύριος αὐτοῦ μετʼ αὐτοῦ
  choice: que seu Senhor esteja com ele
  rationale: O subjuntivo exortativo traduz a força jussiva de ἔστω. Mantém-se κύριος como “Senhor” e não se acrescenta “Deus”, ausente no texto grego.
- source_word: ἀναβὰς εἰς τὴν Ἰερουσαλὴμ τὴν ἐν τῇ Ἰουδαίᾳ
  choice: que ele suba a Jerusalém, na Judeia
  rationale: “Suba” conserva a linguagem tradicional de ascensão geográfica e religiosa a Jerusalém. O particípio singular é vertido como exortação coordenada para clareza em português.
- source_word: οἰκοδομείτωσαν
  choice: e construam
  rationale: A forma grega é um imperativo na terceira pessoa do plural, embora a construção anterior esteja no singular. A tradução mantém essa mudança de número em vez de regularizá-la silenciosamente.
- source_word: τὸν οἶκον τοῦ κυρίου τοῦ Ἰσραήλ
  choice: a casa do Senhor de Israel
  rationale: A formulação incomum do grego é preservada. Não se acrescenta “Deus”, pois θεός não ocorre nesta expressão.
- source_word: οὗτος ὁ κύριος ὁ κατασκηνώσας ἐν Ἰερουσαλήμ
  choice: Este é o Senhor que estabeleceu sua morada em Jerusalém
  rationale: A expressão reproduz o valor identificador de οὗτος e o sentido de κατασκηνόω, ligado a fixar ou estabelecer morada. O aoristo participial é representado por uma ação estabelecida, sem harmonização com o paralelo hebraico.
theological_decisions:
- issue: Tradução de κύριος em contexto divino da Septuaginta
  choice: Senhor
  alternative: SENHOR; Soberano
  rationale: O texto-fonte primário é grego e emprega κύριος. “Senhor” é a equivalência adequada e evita apresentar a forma tipográfica reservada para uma representação explícita do tetragrama hebraico.
- issue: Possível harmonização da cláusula final com a tradição hebraica de Esdras
  choice: Este é o Senhor que estabeleceu sua morada em Jerusalém
  alternative: Ele é o Deus que está em Jerusalém
  rationale: A cláusula explícita do texto grego deve ser mantida. Harmonizá-la com outra forma textual apagaria uma diferença real entre as testemunhas.
- issue: Mudança de singular para plural
  choice: que ele suba ... e construam
  alternative: que ele suba ... e construa
  rationale: A mudança de número está no grego transmitido e pode refletir tensão textual ou discursiva genuína. Ela é preservada e explicada em nota, em vez de ser corrigida sem indicação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação separa as exortações e torna perceptível a mudança deliberada do singular para o plural. Evitaram-se tanto a harmonização com Esdras hebraico quanto o acréscimo de termos teológicos ausentes do grego.
