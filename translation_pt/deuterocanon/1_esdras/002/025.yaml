translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os nomes seguem as formas gregas do texto-base. Evitou-se identificar Rátimo e Samélio no corpo do versículo com nomes de um paralelo semítico aproximado, sobretudo porque o material paralelo fornecido não corresponde claramente a esta frase narrativa.
