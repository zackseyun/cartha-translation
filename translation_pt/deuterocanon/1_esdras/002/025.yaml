base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/025.yaml
  text: Then[a], when what had been written by King Artaxerxes was read, Rathymus and Samellius the scribe, and those aligned with them[b], hurried up to Jerusalem with horsemen and a battle formation of a crowd.
translation:
  language: pt
  text: Então, depois que foram lidos os escritos da parte do rei Artaxerxes, Rátimo e Samélio, este escriba, juntamente com os que se haviam aliado a eles, partiram às pressas para Jerusalém com cavaleiros e uma multidão em formação de batalha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego também pode ser entendido como “com cavalaria e uma multidão disposta em ordem de batalha”. A expressão é condensada e pode descrever uma escolta armada ou um destacamento mobilizado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνωσθέντων τῶν παρὰ τοῦ βασιλέως Ἀρταξέρξου γραφέντων
  choice: depois que foram lidos os escritos da parte do rei Artaxerxes
  rationale: O genitivo absoluto aoristo passivo é expresso por uma oração temporal, mantendo tanto a anterioridade quanto a voz passiva. “Os escritos da parte do rei” preserva a amplitude do grego, que não usa um termo técnico específico para “carta”.
- source_word: Ῥάθυμος
  choice: Rátimo
  rationale: Transliteração portuguesa da forma grega, sem substituí-la pela forma do paralelo semítico.
- source_word: Σαμέλλιος
  choice: Samélio
  rationale: Transliteração portuguesa da forma grega, mantendo o testemunho textual primário.
- source_word: ὁ γραμματεύς
  choice: o escriba
  rationale: “Escriba” preserva de modo transparente a função administrativa indicada por γραμματεύς, embora “secretário” também seja possível.
- source_word: οἱ τούτοις συντασσόμενοι
  choice: os que se haviam aliado a eles
  rationale: A expressão indica pessoas que se associaram ou tomaram partido com os oficiais; a forma verbal portuguesa comunica essa afiliação com naturalidade.
- source_word: ἀναζεύξαντες κατὰ σπουδήν
  choice: partiram às pressas
  rationale: Combina o ato de pôr-se em marcha com a urgência expressa por κατὰ σπουδήν, sem acrescentar uma precisão militar ausente do verbo isolado.
- source_word: μεθʼ ἵππου
  choice: com cavaleiros
  rationale: O singular ἵππου parece coletivo ou idiomático no contexto. “Cavaleiros” comunica acompanhamento montado sem impor necessariamente a organização técnica de uma cavalaria.
- source_word: ὄχλου παρατάξεως
  choice: uma multidão em formação de batalha
  rationale: 'Mantém os dois elementos da expressão grega comprimida: ὄχλος como multidão e παράταξις como disposição ou formação para combate.'
