base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/018.yaml
  text: Therefore, if this city is rebuilt and the walls are completed, they will certainly not endure to pay tribute, but will even oppose kings.
translation:
  language: pt
  text: Portanto, se esta cidade for reconstruída e suas muralhas forem concluídas, eles certamente não continuarão pagando tributo,[a] mas até se oporão aos reis.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “certamente não suportarão pagar tributo”. A expressão grega diz literalmente que eles “certamente não suportarão pagar” e pode enfatizar sua recusa em permanecer sujeitos ao tributo imperial.'
    reason: lexical_alternative
  - marker: b
    text: O texto grego é aqui a testemunha principal. Sua redação não corresponde de perto ao material paralelo do Texto Massorético fornecido; por isso, a tradução segue diretamente o grego.
    reason: textual_variant
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Portanto, se
  rationale: Preserva tanto a inferência marcada por οὖν como a condição introduzida por ἐάν, mantendo o fluxo argumentativo da acusação.
- source_word: ἡ πόλις αὕτη
  choice: esta cidade
  rationale: Equivalente natural do demonstrativo proximal αὕτη na perspectiva da carta.
- source_word: οἰκοδομηθῇ
  choice: for reconstruída
  rationale: O passivo aoristo subjuntivo cabe naturalmente na oração condicional; “reconstruída” explicita a restauração da cidade já existente, conforme o contexto.
- source_word: τὰ τείχη συντελεσθῇ
  choice: suas muralhas forem concluídas
  rationale: συντελέω indica levar algo à conclusão. O possessivo torna natural em português a relação das muralhas com a cidade, sem alterar o sentido.
- source_word: φορολογίαν
  choice: tributo
  rationale: Designa uma obrigação fiscal perante o poder imperial; “tributo” comunica melhor esse contexto político do que “imposto” ou “tributação”.
- source_word: οὐ μὴ ὑπομείνωσιν δοῦναι
  choice: certamente não continuarão pagando
  rationale: οὐ μή com o subjuntivo expressa negação enfática. No contexto fiscal e político, ὑπομένω sugere permanecer sob a obrigação ou suportá-la; a formulação escolhida é natural e conserva a ideia de recusa de pagamento continuado.
- source_word: ἀλλὰ καὶ
  choice: mas chegarão até a
  rationale: 'Expressa de modo idiomático a escalada da acusação: além de não pagar o tributo, eles se levantarão contra a autoridade régia.'
- source_word: βασιλεῦσιν ἀντιστήσονται
  choice: se opor aos reis
  rationale: ἀνθίστημι significa resistir, colocar-se contra ou opor-se. A tradução mantém a acusação política sem especificar uma forma de rebelião além do que o grego afirma.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Muralhas” e “tributo” preservam o cenário histórico-político; a negação enfática foi expressa por “certamente não”. Todos os marcadores de nota aparecem no texto principal.
