base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/014.yaml
  text: and it was brought up by Sheshbazzar together with those from the captivity[b][a], from Babylon to Jerusalem.
translation:
  language: pt
  text: E foi levado[b] por Sesbazar[a], junto com os que voltavam do cativeiro, da Babilônia para Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, «Samanassar». Aqui o nome é vertido como «Sesbazar» à luz do paralelo hebraico e do contexto correspondente de Esdras, que identificam o mesmo oficial.
    reason: alternative_reading
  - marker: b
    text: O sujeito implícito está no singular («foi levado») e provavelmente se refere a um utensílio ou objeto do templo mencionado no contexto anterior; o grego não repete aqui o substantivo.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνηνέχθη
  choice: foi levado
  rationale: O aoristo passivo de ἀναφέρω indica que algo foi transportado. A direção ascendente associada a Jerusalém está implícita no movimento até a cidade; evitar «levado para cima» produz português mais natural sem alterar o sentido contextual.
- source_word: ὑπὸ Σαμανασσάρου
  choice: por Sesbazar
  rationale: Embora o grego apresente a forma Σαμανασσάρος, o contexto paralelo de Esdras identifica o personagem como Sesbazar, forma tradicional e reconhecível em português. A forma grega é preservada em nota.
- source_word: ἅμα τοῖς ἐκ τῆς αἰχμαλωσίας
  choice: junto com os que saíam do cativeiro
  rationale: ἅμα com o dativo exprime companhia, e ἐκ indica procedência. A formulação conserva a imagem de pessoas que vêm da condição de cativeiro, sem reduzir o termo simplesmente a «exilados».
- source_word: ἐκ Βαβυλῶνος
  choice: da Babilônia
  rationale: Indica diretamente o ponto de partida.
- source_word: εἰς Ἱερουσαλήμ
  choice: para Jerusalém
  rationale: Expressa de modo natural em português o destino indicado por εἰς.
theological_decisions:
- issue: Identificação do nome Σαμανασσάρου
  choice: Sesbazar no texto principal
  alternative: Samanassar
  rationale: A decisão não impõe interpretação doutrinária; identifica o personagem pelo nome conhecido no contexto paralelo de Esdras, enquanto a forma exata do grego permanece acessível em nota.
- issue: Sujeito singular não expresso de ἀνηνέχθη
  choice: Manter o sujeito elíptico em «foi levado»
  alternative: Explicitar «ele» ou «o objeto»
  rationale: O grego emprega um verbo singular sem repetir o substantivo. O português admite a mesma elipse, preservando a dependência do contexto anterior e evitando identificar com certeza indevida o item transportado.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do grego sem rigidez artificial. Conserva-se a elipse do sujeito e esclarecem-se em notas tanto a forma grega do nome quanto a referência singular implícita.
