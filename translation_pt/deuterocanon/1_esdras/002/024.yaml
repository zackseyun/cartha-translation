base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/024.yaml
  text: So now I have ordered that those men be stopped from building the city[a], and that care be taken that nothing further be done beyond this[c][b], and that the evil matter may not advance any more to the harm of kings.
translation:
  language: pt
  text: Agora, portanto, ordenei que aqueles homens fossem impedidos de construir a cidade[a] e que se tomassem providências para que nada fosse feito além disso[b] e para que o mal não avançasse ainda mais, perturbando os reis[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “reconstruir a cidade”. O contexto trata da restauração da cidade, mas o grego diz simplesmente “construir”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para que nada fosse feito contra essa ordem”. A expressão grega pode indicar tanto ultrapassar o que foi ordenado quanto agir em desacordo com a ordem.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “causando dano aos reis”. O verbo grego pode se referir a perturbar os reis ou a prejudicar a autoridade real.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέταξα
  choice: ordenei
  rationale: O aoristo indica a ordem real já emitida; o pretérito perfeito é natural no estilo de uma carta oficial em português.
- source_word: ἀποκωλῦσαι
  choice: fossem impedidos de
  rationale: Expressa a determinação de deter os homens e não lhes permitir continuar a construção.
- source_word: τοὺς ἀνθρώπους ἐκείνους
  choice: aqueles homens
  rationale: Mantém a referência ao grupo específico mencionado no decreto e corresponde naturalmente ao grego.
- source_word: τοῦ οἰκοδομῆσαι τὴν πόλιν
  choice: de construir a cidade
  rationale: O grego diz literalmente construir, embora o contexto histórico permita entender reconstruir; essa nuance contextual é registrada em nota.
- source_word: προνοηθῆναι
  choice: que se tomassem providências
  rationale: Transmite a ideia de cuidado preventivo e supervisão administrativa em registro oficial.
- source_word: ὅπως μηθὲν παρὰ ταῦτα γένηται
  choice: para que nada fosse feito além disso
  rationale: παρὰ ταῦτα pode indicar ação além do que foi ordenado ou em desacordo com a ordem; a primeira leitura fica no texto e a segunda, na nota.
- source_word: τὰ τῆς κακίας
  choice: o mal
  rationale: Reproduz de modo claro a expressão idiomática grega referente à atividade nociva em questão, sem acrescentar um demonstrativo ausente do original.
- source_word: προβῇ ἐπὶ πλεῖον
  choice: não avançasse ainda mais
  rationale: Conserva a imagem de progressão ou agravamento da ação nociva.
- source_word: εἰς τὸ βασιλεῖς ἐνοχλῆσαι
  choice: a ponto de perturbar os reis
  rationale: Mantém o valor verbal de ἐνοχλέω, que pode significar perturbar, incomodar ou causar dano, e expressa naturalmente o resultado temido.
