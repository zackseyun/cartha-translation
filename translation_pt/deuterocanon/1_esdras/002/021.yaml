base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/021.yaml
  text: 'Then the king wrote back to Rathymus[a], the recorder of the complaints, and to Beeltethmus, and to Samellius the scribe, and to the rest of their associates who lived in Samaria and Syria and Phoenicia[b], as follows:'
translation:
  language: pt
  text: 'Então o rei respondeu por escrito a Rátimo, encarregado de registrar as questões apresentadas[a], a Beeltetmo, a Samélio, o escriba, e aos demais companheiros deles que moravam na Samaria, na Síria e na Fenícia[b], nos seguintes termos:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o chanceler”. A expressão grega é administrativa e pode ser entendida literalmente como alguém que registrava os assuntos levados à sua consideração.'
    reason: lexical_alternative
  - marker: b
    text: O texto grego apresenta esses destinatários como residentes na Samaria, na Síria e na Fenícia. O texto aramaico paralelo de Esdras difere nos nomes e na formulação; aqui se segue o testemunho grego de 1 Esdras.
    reason: textual_variant
lexical_decisions:
- source_word: ἀντέγραψεν
  choice: respondeu por escrito
  rationale: O verbo composto indica uma resposta escrita. A formulação é natural em português e conserva o caráter epistolar.
- source_word: Ῥαθύμῳ
  choice: Rátimo
  rationale: Translitera a forma do nome no testemunho grego, sem harmonizá-la com o paralelo aramaico de Esdras.
- source_word: τῷ γράφοντι τὰ προσπίπτοντα
  choice: encarregado de registrar as questões apresentadas
  rationale: 'A expressão designa uma função administrativa: alguém que registra assuntos levados à sua consideração. “Questões” preserva melhor a amplitude do grego do que “queixas” ou “acusações”.'
- source_word: Βεελτέθμῳ
  choice: Beeltetmo
  rationale: Translitera o nome próprio conforme o texto grego, sem substituí-lo pelo nome diferente encontrado no paralelo aramaico.
- source_word: Σαμελλίῳ γραμματεῖ
  choice: Samélio, o escriba
  rationale: “Escriba” traduz diretamente γραμματεύς e é adequado ao contexto administrativo, embora “secretário” também seja possível.
- source_word: τοῖς λοιποῖς τοῖς συντασσομένοις
  choice: aos demais companheiros deles
  rationale: O particípio indica pessoas ligadas ou reunidas aos oficiais nomeados. “Companheiros” evita especificar indevidamente cargo ou hierarquia.
- source_word: οἰκοῦσιν
  choice: que moravam
  rationale: Expressa em português corrente o sentido descritivo de residir ou habitar.
- source_word: ἐν Σαμαρείᾳ καὶ Συρίᾳ καὶ Φοινίκῃ
  choice: na Samaria, na Síria e na Fenícia
  rationale: Mantém integralmente as três regiões enumeradas no testemunho grego.
- source_word: τὰ ὑπογεγραμμένα
  choice: nos seguintes termos
  rationale: Fórmula epistolar idiomática que introduz o conteúdo escrito a seguir.
