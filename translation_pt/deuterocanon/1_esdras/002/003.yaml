base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/003.yaml
  text: 'Thus says Cyrus king of the Persians: The Lord of Israel[a], the Most High Lord, has appointed me king of the world,'
translation:
  language: pt
  text: 'Assim diz Ciro, rei dos persas: “O Senhor de Israel, o Senhor Altíssimo,[a] me constituiu rei do mundo,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo hebraico em Esdras 1:2 traz “o SENHOR, o Deus dos céus”, em vez de “o Senhor de Israel, o Senhor Altíssimo”. Aqui, 1 Esdras reflete a forma grega da proclamação.
    reason: alternative_reading
lexical_decisions:
- source_word: Τάδε λέγει
  choice: Assim diz
  rationale: Fórmula proclamativa tradicional, natural e digna em português, que preserva o tom oficial do grego.
- source_word: ὁ βασιλεὺς Περσῶν Κῦρος
  choice: Ciro, rei dos persas
  rationale: Mantém o plural étnico Περσῶν e apresenta a aposição em ordem natural no português.
- source_word: Ἐμὲ ἀνέδειξεν
  choice: me constituiu
  rationale: ἀναδείκνυμι indica aqui designação ou investidura em um cargo; “constituiu” comunica essa nomeação régia sem sugerir criação.
- source_word: βασιλέα τῆς οἰκουμένης
  choice: rei do mundo
  rationale: Expressa de modo conciso a reivindicação abrangente de οἰκουμένη, o mundo habitado ou âmbito imperial.
- source_word: ὁ κύριος τοῦ Ἰσραήλ
  choice: O Senhor de Israel
  rationale: Segue diretamente o testemunho grego primário, sem inserir “Deus”, ausente desta expressão.
- source_word: Κύριος ὁ ὕψιστος
  choice: o Senhor Altíssimo
  rationale: Preserva κύριος e ὕψιστος como segundo título divino em aposição, com formulação idiomática em português.
theological_decisions:
- issue: Diferença do título divino entre o grego de 1 Esdras e o paralelo hebraico de Esdras 1:2
  choice: O Senhor de Israel, o Senhor Altíssimo
  alternative: SENHOR, o Deus dos céus
  rationale: O texto principal segue o grego, que é a fonte primária desta tradução. A variante do paralelo hebraico é registrada em nota para preservar a transparência textual sem harmonizar os testemunhos.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A pontuação mantém o versículo como início de uma proclamação que continua no contexto.
