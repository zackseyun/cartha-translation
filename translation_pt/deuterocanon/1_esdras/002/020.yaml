translation_notes:
  register: Português moderno, formal e claro, adequado a uma carta dirigida ao rei. O tratamento “o senhor” oferece ampla legibilidade brasileira; “ó rei” marca naturalmente o vocativo. A tradução mantém a condição e a advertência política do grego sem explicitar além do texto a ideia de reconstrução.
