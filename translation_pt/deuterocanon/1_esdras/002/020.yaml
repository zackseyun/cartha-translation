base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/020.yaml
  text: Now therefore we make known to you[a], lord king, that if this city is built and its walls are raised up, there will no longer be for you passage into Coele-Syria and Phoenicia.
translation:
  language: pt
  text: Agora, portanto, fazemos saber ao senhor, ó rei, que, se esta cidade for construída e as suas muralhas forem levantadas, já não haverá para o senhor passagem[a] para a Celessíria e a Fenícia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “acesso” ou “via de passagem”. O grego diz literalmente: “já não haverá para o senhor uma saída para a Celessíria e a Fenícia”, referindo-se à perda de passagem ou de alcance imperial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδεικνύομέν
  choice: informamos
  rationale: No contexto de uma comunicação oficial ao rei, o verbo introduz uma notificação formal; “informamos” é natural e preserva o tom administrativo.
- source_word: κύριε βασιλεῦ
  choice: ao senhor, ó rei
  rationale: Preserva os dois elementos do vocativo grego sem acrescentar o possessivo “meu”; a formulação é digna e compreensível em português moderno.
- source_word: οἰκοδομηθῇ
  choice: for construída
  rationale: O grego diz simplesmente “for construída”; “reconstruída” seria contextualmente possível, mas acrescentaria uma ideia não expressa pelo verbo neste versículo.
- source_word: τὰ ταύτης τείχη
  choice: suas muralhas
  rationale: “Muralhas” comunica com precisão as fortificações urbanas, e “suas” retoma naturalmente “esta cidade”.
- source_word: ἀνασταθῇ
  choice: forem levantadas
  rationale: Mantém a imagem concreta de erguer as muralhas e evita interpretar o verbo como “reconstruir”.
- source_word: ἔξοδος
  choice: passagem
  rationale: No contexto, indica a possibilidade de atravessar, alcançar ou projetar domínio sobre as regiões mencionadas; “passagem” preserva essa amplitude melhor que o literal “saída”.
- source_word: κοίλην Συρίαν
  choice: Celessíria
  rationale: Forma portuguesa consagrada do nome geográfico helenístico Coele-Syria.
- source_word: Φοινίκην
  choice: Fenícia
  rationale: Forma portuguesa padrão do nome regional.
