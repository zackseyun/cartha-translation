base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/011.yaml
  text: And through him they were handed over to Sanamassar[c][b][a], governor of Judea.
translation:
  language: pt
  text: E, por meio dele[b], foram entregues a Sanamassar[a], governador da Judeia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sanamassar é a forma grega do nome do oficial chamado Sesbazar no paralelo hebraico (Esdras 1:8).
    reason: alternative_reading
  - marker: b
    text: 'Ou: “pela mão dele”, ressaltando sua atuação como intermediário na entrega.'
    reason: lexical_alternative
  - marker: c
    text: O grego diz “Judeia”; o paralelo hebraico traz “Judá”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ δὲ τούτου
  choice: E, por meio dele
  rationale: 'A expressão grega indica mediação ou agência: literalmente, “por meio deste/dele”. “Por meio dele” é natural em português e mantém essa ideia sem especificar além do texto; a conjunção δέ foi vertida por “E” para dar continuidade à narrativa.'
- source_word: παρεδόθησαν
  choice: foram entregues
  rationale: O passivo de παραδίδωμι descreve a transferência dos objetos mencionados no contexto. “Foram entregues” preserva tanto o sentido de transferência quanto a voz passiva.
- source_word: Σαναμασσάρῳ
  choice: Sanamassar
  rationale: A forma do nome no texto grego foi transliterada no corpo do versículo. A forma Sheshbazar, presente no paralelo hebraico, foi conservada em nota.
- source_word: προστάτῃ
  choice: governador
  rationale: Neste contexto administrativo, προστάτης designa alguém que exerce liderança ou autoridade oficial. “Governador” comunica com clareza essa função, embora o termo também possa ser entendido de modo mais amplo como “chefe” ou “dirigente”.
- source_word: τῆς Ἰουδαίας
  choice: da Judeia
  rationale: A tradução segue a forma geográfica do texto grego, Ἰουδαία. O paralelo hebraico traz “Judá”, registrado em nota para preservar a diferença entre as testemunhas.
