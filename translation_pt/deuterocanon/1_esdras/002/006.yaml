  naturalness: A formulação ativa proposta é clara, idiomática e apropriada ao português moderno, sem a ambiguidade introduzida pela passiva. “Animais de criação” comunica κτήνη de modo mais abrangente que “rebanhos”.
  terminology: “Dádivas”, “ofertas votivas”, “templo” e “Senhor” são adequados ao grego. A nota sobre a divergência do paralelo hebraico é relevante e é mantida, com descrição lexical mais exata de κτήνη.
