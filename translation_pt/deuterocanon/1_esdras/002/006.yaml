base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/006.yaml
  text: Therefore[a], as many as live in the various places, let the men in his place help him with gold and silver, with gifts, with horses and livestock[b], along with the other things added as vowed offerings for the temple of the Lord in Jerusalem.
translation:
  language: pt
  text: Portanto, todos os que moram nas diversas localidades, que os moradores de sua localidade os ajudem com ouro e prata, com dádivas, com cavalos e animais de criação[a], juntamente com as outras coisas acrescentadas como ofertas votivas para o templo[b] do Senhor em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz “cavalos e animais de criação”. O paralelo hebraico de Esdras 1:4,6 apresenta uma lista diferente, com bens e gado, sem mencionar cavalos. Aqui se segue o texto grego de 1 Esdras.
    reason: alternative_reading
  - marker: b
    text: Ou “santuário”. O termo grego ἱερόν pode designar o templo ou o santuário.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι οὖν κατὰ τοὺς τόπους οἰκοῦσιν
  choice: Portanto, todos os que moram nas diversas localidades
  rationale: ὅσοι designa o grupo indefinido em sua totalidade, οὖν mantém a ligação inferencial e κατὰ τοὺς τόπους tem sentido distributivo. A formulação é natural em português sem perder esses elementos.
- source_word: βοηθείτωσαν αὐτῷ οἱ ἐν τῷ τόπῳ αὐτοῦ
  choice: sejam ajudados pelos moradores do lugar onde vivem
  rationale: A passagem alterna entre um grupo plural e o indivíduo representativo singular. A construção passiva em português transmite que cada pessoa deve receber ajuda dos moradores da própria localidade e evita uma sequência pronominal obscura.
- source_word: ἐν χρυσίῳ καὶ ἐν ἀργυρίῳ, ἐν δόσεσιν
  choice: com ouro e prata, com dádivas
  rationale: O uso de ἐν indica os meios ou recursos da ajuda. δόσεις são coisas dadas; 'dádivas' mantém o sentido amplo sem antecipar as ofertas votivas mencionadas depois.
- source_word: μεθʼ ἵππων καὶ κτηνῶν
  choice: com cavalos e rebanhos
  rationale: ἵπποι são literalmente cavalos, enquanto κτήνη abrange animais domésticos ou gado. 'Rebanhos' oferece uma expressão corrente e coletiva para esses animais, sem apagar a leitura grega 'cavalos'.
- source_word: σὺν τοῖς ἄλλοις τοῖς κατʼ εὐχὰς προστεθειμένοις
  choice: juntamente com as outras coisas acrescentadas como ofertas votivas
  rationale: προστεθειμένοις indica itens adicionais, e κατʼ εὐχάς os caracteriza como ligados a votos. 'Ofertas votivas' preserva ambos os sentidos de modo conciso.
- source_word: εἰς τὸ ἱερὸν τοῦ κυρίου τὸ ἐν Ἱερουσαλήμ
  choice: para o templo do Senhor em Jerusalém
  rationale: ἱερόν designa o templo ou santuário, e εἰς expressa aqui a destinação das contribuições. 'Templo' é preciso no contexto de Jerusalém, enquanto 'Senhor' segue a forma grega κύριος.
theological_decisions:
- issue: Tradução de κύριος no contexto do templo do Deus de Israel
  choice: Senhor
  alternative: SENHOR
  rationale: A testemunha primária grega traz κυρίου, não o tetragrama hebraico; por isso, 'Senhor' representa diretamente a forma do texto-base sem deixar de reconhecer a alusão ao Deus de Israel.
- issue: Referente singular de αὐτῷ após o plural ὅσοι
  choice: cada integrante do grupo, expresso por construção distributiva
  alternative: ajudem-no
  rationale: O singular grego representa individualmente cada pessoa que parte. A tradução mantém essa distribuição sem definir além do texto a identidade ou condição religiosa do indivíduo.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário amplamente compreensível no Brasil e em outros contextos lusófonos. A construção distributiva esclarece a passagem do plural ao singular, e as notas preservam a diferença textual e a amplitude lexical relevantes.
