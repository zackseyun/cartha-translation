  - severity: low
    issue: “Rebanhos” restringe κτηνῶν.
    rationale: κτήνη designa animais domésticos/de criação ou gado em sentido amplo; “rebanhos” pode sugerir especificamente grupos de ovinos ou caprinos. “Animais de criação” preserva melhor a abrangência.
