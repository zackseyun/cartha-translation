base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/007.yaml
  text: Then the heads of the ancestral houses of the tribes of Judah and Benjamin[a], and the priests and the Levites, and everyone whose spirit the Lord had stirred up, arose to go up to build the house of the Lord that is in Jerusalem.
translation:
  language: pt
  text: Então se levantaram os chefes das casas ancestrais das tribos de Judá e Benjamim, os sacerdotes, os levitas e todos aqueles cujo espírito o Senhor havia despertado, para subirem e construírem a casa do Senhor que está em Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O paralelo hebraico em Esdras 1:5 diz: “todos aqueles cujo espírito Deus havia despertado”. Aqui, 1 Esdras diz: “o Senhor”.'
    reason: alternative_reading
lexical_decisions:
- source_word: καταστήσαντες / ויקומו
  choice: se levantaram
  rationale: A forma grega transmitida é difícil neste contexto; o paralelo hebraico traz claramente a ideia de levantar-se. A escolha se ajusta aos infinitivos seguintes, que expressam movimento e propósito, sem sugerir uma nomeação para um cargo.
- source_word: οἱ ἀρχίφυλοι τῶν πατριῶν
  choice: os chefes das casas ancestrais
  rationale: A expressão designa líderes de unidades familiares extensas. “Casas ancestrais” conserva a estrutura de parentesco e permanece clara em português atual.
- source_word: τῆς Ἰούδα καὶ Βενιαμεὶν φυλῆς
  choice: das tribos de Judá e Benjamim
  rationale: Embora o grego seja sintaticamente condensado e empregue “tribo” no singular, a referência natural é às tribos associadas respectivamente a Judá e Benjamim; o plural explicita o sentido sem alterar o referente.
- source_word: ἤγειρεν ... τὸ πνεῦμα
  choice: havia despertado ... o espírito
  rationale: Preserva a metáfora de uma disposição interior ativada por Deus e soa natural em português, sem explicar além do texto.
- source_word: Κύριος
  choice: o Senhor
  rationale: Segue o testemunho grego primário, que lê Κύριος, embora o paralelo hebraico tenha “Deus”; a variante é registrada em nota.
- source_word: ἀναβῆναι
  choice: subirem
  rationale: Conserva o modo bíblico e geográfico de falar da viagem a Jerusalém, com formulação idiomática em português.
- source_word: οἰκοδομῆσαι οἶκον
  choice: construírem a casa
  rationale: O grego diz literalmente construir, sem prefixo explícito de repetição. “A casa” mantém a designação cultual do templo.
- source_word: τῷ κυρίῳ τὸν ἐν Ἱερουσαλήμ
  choice: a casa do Senhor que está em Jerusalém
  rationale: Identifica a casa como pertencente ao Senhor e situada em Jerusalém, reproduzindo de forma clara a relação expressa pela sequência grega.
theological_decisions:
- issue: A designação divina nesta oração difere entre o texto grego primário e o paralelo hebraico
  choice: o Senhor havia despertado
  alternative: Deus havia despertado
  rationale: O texto principal segue o grego de 1 Esdras, que traz Κύριος. O paralelo hebraico de Esdras 1:5 traz “Deus”; essa diferença textual relevante é preservada em nota, sem harmonização.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, mantendo a enumeração e a cadeia de propósito do original. O marcador da nota foi colocado ao fim do versículo para não interromper a frase, embora a nota se refira especificamente a “o Senhor”.
