base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/002.yaml
  text: the Lord stirred up the spirit of Cyrus king of the Persians[a], and he made a proclamation throughout all his kingdom, and also in writing, saying,
translation:
  language: pt
  text: 'O Senhor despertou o espírito de Ciro, rei dos persas[a], e ele fez uma proclamação por todo o seu reino e também por escrito, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, “rei dos persas”; o paralelo hebraico em Esdras 1:1 traz “rei da Pérsia”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤγειρεν
  choice: despertou
  rationale: Com “o espírito” como objeto, exprime a ação divina de suscitar em Ciro uma disposição interior para agir, preservando a força ativa do verbo grego.
- source_word: Κύριος
  choice: O Senhor
  rationale: Tradução corrente e digna de Κύριος; no contexto, refere-se ao Deus de Israel, sem substituir a forma efetivamente presente no texto grego pelo tetragrama do paralelo hebraico.
- source_word: τὸ πνεῦμα
  choice: o espírito
  rationale: Mantém a formulação grega, que não traz pronome possessivo explícito; o contexto deixa claro que se trata do espírito de Ciro.
- source_word: Κύρου
  choice: Ciro
  rationale: Forma portuguesa consagrada do nome real, confirmada pelo paralelo hebraico.
- source_word: βασιλέως Περσῶν
  choice: rei dos persas
  rationale: Conserva o plural explícito do grego, sem harmonizá-lo com “rei da Pérsia” no paralelo hebraico de Esdras 1:1.
- source_word: ἐκήρυξεν
  choice: fez uma proclamação
  rationale: Expressa o anúncio público e oficial indicado pelo verbo, preparando a menção adicional à forma escrita.
- source_word: ὅλῃ τῇ βασιλείᾳ αὐτοῦ
  choice: por todo o seu reino
  rationale: Reproduz naturalmente em português o alcance distributivo da proclamação em todo o domínio de Ciro.
- source_word: ἅμα
  choice: também
  rationale: No contexto, acrescenta a transmissão escrita à proclamação pública; “também” comunica essa força aditiva com naturalidade.
- source_word: διὰ γραπτῶν
  choice: por escrito
  rationale: Forma idiomática e precisa para indicar o meio escrito sem especificar indevidamente cartas ou outro tipo de documento.
- source_word: λέγων
  choice: 'dizendo:'
  rationale: Introduz de modo transparente o conteúdo do decreto, que continua no versículo seguinte.
theological_decisions:
- issue: Ação divina no decreto de Ciro
  choice: O Senhor despertou ativamente o espírito de Ciro
  alternative: O Senhor apenas permitiu que Ciro agisse, ou Ciro agiu somente por motivação política
  rationale: O grego atribui diretamente ao Senhor a ação sobre o espírito de Ciro. A tradução preserva essa agência divina sem explicar ou reduzir as possíveis motivações humanas do rei.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém o encadeamento narrativo e termina com dois-pontos para introduzir o decreto no versículo seguinte.
