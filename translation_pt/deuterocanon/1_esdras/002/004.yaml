base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/004.yaml
  text: and he has appointed me to build a house for him in Jerusalem[b][a], which is in Judea.
translation:
  language: pt
  text: e me encarregou[a] de construir para ele uma casa[b] em Jerusalém, que fica na Judeia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “me ordenou” ou “me incumbiu”. O verbo grego pode indicar que algo foi dado a conhecer ou que alguém recebeu uma incumbência; o paralelo hebraico ressalta a autorização divina.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um templo”. O grego diz literalmente “uma casa”, expressão bíblica comum para se referir ao templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσήμανέν
  choice: encarregou
  rationale: No contexto, o verbo σημαίνω comunica uma incumbência ou autorização para realizar a obra. “Encarregou” expressa essa comissão sem tornar o sentido tão forte quanto “ordenou”.
- source_word: οἰκοδομῆσαι
  choice: construir
  rationale: O infinitivo significa diretamente “construir”. Embora o contexto seja de restauração, o grego não explicita “reconstruir”.
- source_word: αὐτῷ
  choice: para ele
  rationale: 'O dativo indica benefício ou dedicação: a casa seria construída para Deus.'
- source_word: οἶκον
  choice: uma casa
  rationale: A palavra grega é literalmente “casa”. No contexto, refere-se ao templo, mas manter “casa” preserva a formulação bíblica e evita substituir o termo por uma explicitação interpretativa.
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome do lugar.
- source_word: τῇ ἐν τῇ Ἰουδαίᾳ
  choice: que fica na Judeia
  rationale: A expressão identifica de modo explicativo a localização de Jerusalém; esta formulação é clara e natural em português atual.
theological_decisions:
- issue: Traduzir οἶκον literalmente como “casa” ou explicitamente como “templo”
  choice: casa
  alternative: templo
  rationale: O grego emprega οἶκον, “casa”, e o paralelo hebraico também usa a linguagem da “casa” de Deus. O referente cultual é perceptível pelo contexto, e a alternativa é registrada em nota.
- issue: Determinar a força da comissão expressa por ἐσήμανέν
  choice: encarregou
  alternative: ordenou
  rationale: “Encarregou” preserva a ideia de comissão divina sem afirmar que o verbo grego, por si só, exige o sentido mais forte de uma ordem direta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A colocação pronominal em “me encarregou” é natural no trecho contínuo iniciado por “e”; “que fica na Judeia” evita uma construção excessivamente literal e conserva a explicação geográfica do grego.
