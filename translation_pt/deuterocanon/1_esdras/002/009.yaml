base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/009.yaml
  text: And King Cyrus brought out the holy vessels of the Lord[a], which Nebuchadnezzar had carried away from Jerusalem and deposited in the house of his god.
translation:
  language: pt
  text: E o rei Ciro retirou os utensílios sagrados do Senhor, que Nabucodonosor havia levado de Jerusalém e depositado no santuário do seu ídolo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «em seu ídolo». O termo grego pode referir-se ao ídolo ou, no contexto, ao seu santuário; o paralelo hebraico diz «na casa de seu deus».
    reason: Preserva a formulação incomum e a amplitude lexical do grego, ao mesmo tempo que registra a leitura do testemunho hebraico paralelo.
lexical_decisions:
- source_word: ἐξήνεγκεν
  choice: mandou trazer
  rationale: O verbo indica fazer sair ou trazer para fora objetos guardados. No contexto régio, «mandou trazer» expressa com naturalidade que Ciro determinou que os utensílios fossem retirados.
- source_word: τὰ ἅγια σκεύη
  choice: os utensílios sagrados
  rationale: σκεύη designa objetos ou implementos; ἅγια assinala seu caráter consagrado. «Utensílios sagrados» é claro no contexto do templo sem especificar indevidamente sua forma.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: Reproduz o título κύριος de maneira tradicional e natural, mantendo a referência ao Deus de Israel sem substituir a forma do texto grego pelo nome presente no paralelo hebraico.
- source_word: μετήγαγεν
  choice: havia levado
  rationale: O verbo descreve a transferência dos objetos de um lugar para outro. «Havia levado» comunica a remoção anterior de Jerusalém e preserva a sequência temporal.
- source_word: ἀπηρείσατο
  choice: colocado
  rationale: No contexto, o verbo descreve a deposição ou instalação dos utensílios num recinto cultual. «Colocado» é natural e não acrescenta uma finalidade de armazenamento ausente do texto.
- source_word: ἐν τῷ εἰδώλιῳ αὐτοῦ
  choice: no templo de seu ídolo
  rationale: εἰδώλιον pode designar um santuário ou templo de ídolo. Esta tradução mantém no texto principal a nuance explicitamente idólatra do grego, enquanto a nota registra a formulação distinta do paralelo hebraico.
theological_decisions:
- issue: Tradução de κύριος no contexto dos utensílios do templo
  choice: Senhor
  alternative: SENHOR
  rationale: O texto-base grego traz κύριος, não o tetragrama. «Senhor» traduz diretamente o grego e evita importar para o texto principal uma convenção tipográfica própria de traduções do hebraico.
- issue: Relação entre εἰδώλιον no grego e «casa de seu deus» no paralelo hebraico
  choice: templo de seu ídolo
  alternative: casa de seu deus
  rationale: Como o grego é a fonte primária e apresenta uma caracterização mais incisiva, o texto principal conserva a referência ao ídolo. A variante conceitual do testemunho hebraico é registrada em nota, preservando a tensão entre as fontes sem harmonização silenciosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por «utensílios sagrados» em vez do mais técnico «vasos sagrados». A construção «mandou trazer» torna explícita de modo idiomático a ação régia implícita no contexto. O marcador [a] aparece no texto principal.
