  naturalness: O português é claro e de registro adequado. «Retirou» é mais direto e idiomático do que «mandou trazer» neste contexto. «Santuário do seu ídolo» oferece uma formulação natural sem apresentar «templo» como se estivesse explicitamente no grego.
  terminology: «Utensílios sagrados» e «Senhor» são adequados. A nota deve registrar mais precisamente a ambiguidade de εἰδώλιον, em vez de sugerir que «santuário» é apenas uma alternativa secundária quando o texto principal já especifica «templo».
