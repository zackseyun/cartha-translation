base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/022.yaml
  text: I read the letter that you sent to me. Therefore I gave orders to investigate[a], and it was found that that city has from ancient times set itself in opposition to kings,
translation:
  language: pt
  text: Li a carta que vocês me enviaram. Por isso, dei ordem para que se fizesse uma investigação, e constatou-se que, desde os tempos antigos, aquela cidade vem se opondo aos reis,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀνέγνων
  choice: Li
  rationale: O aoristo em primeira pessoa é vertido naturalmente pelo pretérito perfeito, adequado ao estilo de uma resposta oficial.
- source_word: ἐπιστολήν
  choice: carta
  rationale: É o sentido comum e direto do termo no contexto de correspondência administrativa.
- source_word: πέμψατε
  choice: vocês me enviaram
  rationale: Preserva a segunda pessoa do plural e explicita o destinatário já expresso no grego, com formulação corrente em português.
- source_word: ἐπέταξα
  choice: dei ordem
  rationale: Comunica o ato de emitir uma ordem e mantém o tom régio-administrativo.
- source_word: ἐπισκέψασθαι
  choice: para que se fizesse uma investigação
  rationale: No contexto administrativo, refere-se a uma averiguação oficial; a construção impessoal evita acrescentar um agente não indicado.
- source_word: εὑρέθη
  choice: constatou-se
  rationale: Reproduz de modo natural a fórmula passiva e impessoal de um relatório oficial.
- source_word: ἐξ αἰῶνος
  choice: desde os tempos antigos
  rationale: Indica um histórico remoto e duradouro, não eternidade em sentido metafísico.
- source_word: ἀντιπαρατάσσουσα
  choice: vem se opondo
  rationale: Expressa uma postura continuada de oposição sem intensificá-la indevidamente para rebelião aberta.
- source_word: βασιλεῦσιν
  choice: aos reis
  rationale: Tradução direta do dativo plural, com sentido histórico e genérico.
