base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/008.yaml
  text: And those around them helped in every way[a], with silver and gold, with horses, with livestock, and with very many freewill offerings[c][b], from all whose mind had been stirred.
translation:
  language: pt
  text: E os que estavam ao redor deles os ajudaram de todas as maneiras, com prata e ouro, cavalos[a], animais de criação e muitíssimas orações[b], da parte de muitos cuja mente havia sido despertada.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo hebraico de Esdras 1:6 traz aqui uma expressão que significa “bens” ou “propriedades”, em vez de “cavalos”. O texto de 1 Esdras segue a redação grega.
    reason: alternative_reading
  - marker: b
    text: O termo grego pode também significar “votos”. O paralelo hebraico traz “presentes preciosos” ou “dádivas escolhidas”.
    reason: textual_variant
  - marker: c
    text: Ou “cujo espírito havia sido despertado”, conforme a expressão do paralelo hebraico; o grego diz literalmente “cuja mente havia sido despertada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ περικύκλῳ αὐτῶν
  choice: os que viviam ao redor deles
  rationale: Expressa de modo natural as pessoas das redondezas, sem restringi-las formalmente a “vizinhos”.
- source_word: ἐβοήθησαν ἐν πᾶσιν
  choice: os ajudaram de todas as maneiras
  rationale: Torna explícito em português o objeto implícito pelo contexto e comunica a abrangência da ajuda.
- source_word: ἐν ἀργυρίῳ καὶ χρυσίῳ
  choice: com prata e ouro
  rationale: O valor instrumental da preposição é claro no contexto.
- source_word: ἵπποις
  choice: cavalos
  rationale: Segue diretamente o texto grego, embora o paralelo hebraico apresente bens ou propriedades.
- source_word: κτήνεσιν
  choice: animais de criação
  rationale: Mantém o sentido amplo de animais domésticos, sem limitar o termo a gado bovino.
- source_word: εὐχαῖς ὡς πλείσταις
  choice: muitíssimas ofertas voluntárias
  rationale: No contexto de uma lista de auxílio material, traduz εὐχαί segundo seu sentido votivo, isto é, dádivas ligadas a votos; a possibilidade lexical de “orações” é preservada em nota.
- source_word: πολλῶν ὧν ὁ νοῦς ἠγέρθη
  choice: dadas por muitos cuja mente havia sido despertada
  rationale: Explicita a relação dos muitos com as ofertas e conserva νοῦς como “mente” e a voz passiva de ἠγέρθη.
theological_decisions:
- issue: Divergência entre a lista grega e o paralelo hebraico de Esdras 1:6
  choice: Seguir o grego com “cavalos” e interpretar εὐχαῖς contextualmente como “ofertas voluntárias”, registrando as variantes em notas.
  alternative: Harmonizar com o hebraico e traduzir “bens/propriedades” e “presentes preciosos”.
  rationale: Para 1 Esdras, o grego é a testemunha primária. As diferenças do hebraico são relevantes, mas não devem substituir silenciosamente a redação grega.
- issue: νοῦς em contraste com o idioma hebraico paralelo
  choice: mente
  alternative: espírito
  rationale: “Mente” representa diretamente o substantivo grego, enquanto “espírito” aproxima a frase do paralelo hebraico e permanece em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluidez brasileira. A tradução mantém o grego como texto-base, explicita apenas relações exigidas pela naturalidade do português e conserva em notas as ambiguidades lexicais e as divergências do paralelo hebraico.
