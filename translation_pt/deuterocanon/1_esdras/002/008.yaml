revisions:
- from: E os que viviam ao redor deles os ajudaram de todas as maneiras, com prata e ouro, cavalos[a], animais de criação e muitíssimas ofertas voluntárias[b], dadas por muitos cuja mente havia sido despertada.[c]
  to: E os que estavam ao redor deles os ajudaram de todas as maneiras, com prata e ouro, cavalos[a], animais de criação e muitíssimas orações[b], da parte de muitos cuja mente havia sido despertada.[c]
