base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/026.yaml
  text: They began to hinder those who were building[a], and the building of the temple in Jerusalem was stopped until the second year of the reign of Darius, king of the Persians.
translation:
  language: pt
  text: Começaram a pôr obstáculos aos que construíam, e a construção do templo em Jerusalém ficou paralisada[a] até o segundo ano do reinado de Dario, rei dos persas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cessou” ou “ficou inativa”; o verbo grego indica que a obra de construção do templo foi interrompida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο κωλύειν
  choice: Começaram a impedir
  rationale: A construção com ἤρξαντο e infinitivo marca o início da ação; “impedir” expressa a interferência ativa sem antecipar, por si só, a paralisação declarada na oração seguinte.
- source_word: τοὺς οἰκοδομοῦντας
  choice: os que estavam construindo
  rationale: Preserva a força verbal do particípio presente e destaca as pessoas então envolvidas na obra.
- source_word: ἤργει
  choice: ficou paralisada
  rationale: No contexto, o verbo indica que a obra deixou de avançar e permaneceu inativa. A formulação é clara e natural em português.
- source_word: ἡ οἰκοδομὴ τοῦ ἱεροῦ
  choice: a construção do templo
  rationale: οἰκοδομή designa aqui a atividade ou obra de construção, e ἱερόν refere-se ao templo ou complexo do templo.
- source_word: τοῦ ἐν Ἰερουσαλήμ
  choice: em Jerusalém
  rationale: A expressão localiza o templo; a forma concisa é idiomática em português.
- source_word: μέχρι τοῦ δευτέρου ἔτους
  choice: até o segundo ano
  rationale: μέχρι com genitivo assinala o limite temporal da paralisação.
- source_word: τῆς βασιλείας Δαρείου
  choice: do reinado de Dario
  rationale: βασιλεία refere-se aqui ao período de governo real, não ao território do reino.
- source_word: τοῦ Περσῶν βασιλέως
  choice: rei dos persas
  rationale: Reproduz com naturalidade a relação genitiva do grego e mantém a designação étnica explícita.
