    issue: Incoerência pronominal no referente real
    rationale: «O rei, meu senhor» trata um monarca singular, mas «da parte de vocês» usa plural coloquial. O plural grego pode refletir protocolo ou o círculo régio, mas em português «de sua parte» transmite naturalmente a origem junto ao rei sem introduzir essa dissonância.
  - severity: low
    issue: Fórmula oficial pode ser mais idiomática
    rationale: «Que o rei, meu senhor, saiba» reproduz de modo mais natural a fórmula γνωστὸν ἔστω do que o imperativo inicial «saiba o rei», preservando o tom deferente.
