base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/017.yaml
  text: And now let it be known to my lord the king that the Judeans who came up from you to us have come to Jerusalem and are living in that rebellious and wicked city[a]; they are repairing its marketplaces and walls[c][b], and are laying the foundation of a temple.
translation:
  language: pt
  text: E agora, que o rei, meu senhor, saiba que os judeus[a] que subiram de sua parte até nós chegaram a Jerusalém e estão morando naquela cidade rebelde e perversa. Eles estão reparando suas praças públicas[b] e muralhas e estão lançando os alicerces de um templo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os judeanos”, isto é, os habitantes ou naturais da Judeia. O grego Ἰουδαῖοι também pode designar os judeus em sentido mais amplo.
    reason: lexical_alternative
  - marker: b
    text: Ou “mercados”. O grego ἀγοραί pode designar praças públicas, especialmente aquelas usadas como mercados; algumas tradições paralelas enfatizam outras áreas urbanas.
    reason: alternative_reading
  - marker: c
    text: Ou “estão iniciando a construção do templo”. A expressão grega é condensada e pode referir-se ao começo da obra, especialmente ao lançamento de sua base; pelo contexto, trata-se do templo de Jerusalém.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν ἔστω
  choice: saiba
  rationale: Reproduz de modo natural em português a fórmula oficial de notificação, sem perder o tom formal.
- source_word: τῷ κυρίῳ βασιλεῖ
  choice: o rei, meu senhor
  rationale: κύριος é aqui um tratamento cortesão dirigido ao monarca humano, não um título divino.
- source_word: Ἰουδαῖοι
  choice: judeus
  rationale: É a forma corrente e amplamente compreensível em português; a nota preserva a possível nuance etnogeográfica de habitantes ou naturais da Judeia.
- source_word: ἀναβάντες παρ' ὑμῶν πρὸς ἡμᾶς
  choice: que subiram da parte de vocês até nós
  rationale: Mantém tanto o movimento de subida expresso por ἀναβαίνω quanto a direção administrativa de 'junto de vocês' para 'nós'.
- source_word: τὴν πόλιν τὴν ἀποστάτιν καὶ πονηρὰν
  choice: naquela cidade rebelde e perversa
  rationale: ἀποστάτις indica rebelião política neste contexto imperial; πονηρά conserva o teor moralmente hostil da acusação.
- source_word: οἰκοῦσιν
  choice: estão morando
  rationale: Expressa com clareza a ação presente e contínua de residir ou estabelecer-se.
- source_word: ἀγοράς
  choice: praças públicas
  rationale: ἀγορά designa a praça ou área pública de mercado; 'praças públicas' evita restringir indevidamente o termo a estabelecimentos comerciais.
- source_word: θεραπεύουσιν
  choice: estão reparando
  rationale: No contexto de estruturas urbanas, o verbo denota cuidar, restaurar ou pôr em condições; 'reparando' não exagera a extensão da obra.
- source_word: ναὸν ὑποβάλλονται
  choice: estão lançando os alicerces de um templo
  rationale: A expressão comprimida sugere iniciar a construção ou implantar sua base. O indefinido acompanha o ναόν sem artigo, enquanto a nota registra a alternativa contextual.
theological_decisions:
- issue: Sentido de κύριος quando aplicado ao rei humano
  choice: o rei, meu senhor
  alternative: o senhor rei
  rationale: O contexto é de protocolo cortesão dirigido ao monarca, portanto não se deve sugerir um título divino.
- issue: Determinação de ναόν sem artigo
  choice: um templo
  alternative: o templo
  rationale: A tradução formal preserva a ausência do artigo grego, embora o contexto possa identificar a construção como o templo de Jerusalém; essa tensão é mantida em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário internacional. A sintaxe preserva o tom de uma denúncia administrativa, evitando arcaísmos. Os marcadores aparecem no texto na ordem [a], [b], [c].
