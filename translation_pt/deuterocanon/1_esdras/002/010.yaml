base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/010.yaml
  text: Then Cyrus king of the Persians brought them out and handed them over to Mithridates[b][a], his treasurer.
translation:
  language: pt
  text: Então Ciro, rei dos persas, tirou-os[a] e os entregou a Mitrídates, seu tesoureiro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os objetos do templo mencionados no versículo anterior.
    reason: cross_reference
  - marker: b
    text: 'Ou: “encarregado do seu tesouro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήνεγκεν
  choice: tirou
  rationale: O verbo indica fazer sair ou retirar algo. “Tirou” é natural no contexto da retirada dos objetos para sua transferência oficial e corresponde ao sentido do paralelo hebraico הוֹצִיא.
- source_word: Κῦρος ὁ βασιλεὺς Περσῶν
  choice: Ciro, rei dos persas
  rationale: Reproduz com clareza o título grego, mantendo o plural étnico Περσῶν, sem deixar de soar natural em português.
- source_word: παρέδωκεν
  choice: entregou
  rationale: Expressa a transferência formal dos objetos aos cuidados de um funcionário, sentido mais preciso aqui do que o simples “deu”.
- source_word: Μιθριδάτῃ
  choice: Mitrídates
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio grego.
- source_word: τῷ ἑαυτοῦ γαζοφύλακι
  choice: seu tesoureiro
  rationale: γαζοφύλαξ designa o funcionário encarregado do tesouro. “Tesoureiro” é conciso e corrente, enquanto “seu” preserva a ligação do funcionário com a administração de Ciro.
- source_word: αὐτά
  choice: os
  rationale: O pronome neutro plural retoma os objetos do templo mencionados no versículo anterior. O pronome português evita repetir interpretativamente o substantivo, e a nota esclarece o referente.
- source_word: δὲ
  choice: Então
  rationale: Neste contexto narrativo, δὲ marca a continuação da sequência. “Então” transmite essa progressão de modo natural, sem impor contraste.
