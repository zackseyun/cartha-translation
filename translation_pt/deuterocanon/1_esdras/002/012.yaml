base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/012.yaml
  text: 'And this was their number: a thousand gold libation bowls[a], a thousand silver libation bowls, twenty-nine silver censers, thirty gold bowls, two hundred and ten silver bowls[b], and a thousand other vessels.'
translation:
  language: pt
  text: 'E este era o número deles: mil recipientes de ouro para libações, mil recipientes de prata para libações, vinte e nove incensários de prata, trinta taças de ouro, duas mil quatrocentas e dez taças de prata[a] e mil outros utensílios.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A notação numérica grega é compacta: ,βυʹ indica 2.400 e é seguida de “dez”, dando um total de 2.410. Esse número também corresponde ao total geral apresentado no versículo seguinte.'
    reason: textual_clarification
  - marker: b
    text: O texto hebraico paralelo de Esdras 1:9 apresenta objetos e números diferentes neste ponto. Primeiro Esdras preserva aqui um inventário grego reordenado ou ampliado, e não um equivalente palavra por palavra do hebraico.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ τούτων ἀριθμὸς ἦν
  choice: E este era o número deles
  rationale: Reproduz de modo natural a fórmula grega que introduz a contagem dos objetos.
- source_word: σπονδεῖα
  choice: recipientes ... para libações
  rationale: Explicita a função cultual ligada a σπονδή sem restringir indevidamente a forma dos objetos.
- source_word: θυίσκαι ἀργυραῖ
  choice: incensários de prata
  rationale: Designa de maneira clara e corrente utensílios usados para queimar incenso em contexto cultual.
- source_word: φιάλαι
  choice: taças
  rationale: φιάλη indica uma vasilha larga e rasa; “taças” é atual, compreensível e apropriado ao inventário ritual.
- source_word: ἀργυραῖ ,βυʹ δέκα
  choice: duas mil quatrocentas e dez taças de prata
  rationale: A notação ,βυʹ representa 2.400, seguida de δέκα, “dez”, resultando em 2.410; esse valor também se harmoniza com o total de 5.469 objetos dado no versículo seguinte.
- source_word: ἄλλα σκεύη
  choice: outros utensílios
  rationale: No contexto de um inventário do templo, σκεύη abrange objetos e implementos diversos; “utensílios” comunica essa amplitude.
