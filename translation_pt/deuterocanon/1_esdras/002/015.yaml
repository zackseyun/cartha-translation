revisions:
- from: 'No tempo de Artaxerxes, rei dos persas, Belem, Mitrídates, Tabélio, Rátimo, Beeltetmo, Samélio, o escriba, e os demais que estavam associados a eles e moravam em Samaria e nos outros lugares escreveram contra os habitantes da Judeia e de Jerusalém[b] a seguinte carta[a]:'
