review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente o enquadramento temporal, o caráter adversativo de κατὰ, a lista de participantes, a designação de Samélio como escriba e a referência à carta que segue. Contudo, «Belem» reduz sem base clara a forma grega Βήλεμος; «Belemus» preserva melhor o nome. Além disso, «os demais que estavam associados a eles e moravam» pode fazer «moravam» qualificar apenas os demais, enquanto o particípio plural grego apresenta a residência como descrição do conjunto referido.
  naturalness: O português é claro e de registro apropriado. A reformulação para «todos eles, que moravam...» conserva uma leitura fluente e torna explícito o alcance coletivo do particípio, sem tornar a frase pesada.
  terminology: «Rei dos persas», «escriba», «Judeia», «Samaria» e «a seguinte carta» são escolhas adequadas. «Belemus» é preferível a «Belem» por fidelidade transliterativa ao grego; as demais formas portuguesas dos nomes podem permanecer.
  issues:
  - severity: medium
    issue: O nome Βήλεμος foi vertido como «Belem».
    rationale: A supressão da terminação -us não é justificada pelo texto-fonte e torna a forma menos identificável como transliteração do nome grego. «Belemus» é uma adaptação portuguesa legível e mais fiel.
  - severity: low
    issue: O segmento «os demais que estavam associados a eles e moravam em Samaria...» permite que a residência se aplique somente aos demais.
    rationale: O particípio οἰκοῦντες está no plural e, na construção grega, descreve o grupo mencionado. «Todos eles, que moravam...» evita essa restrição sintática indevida.
  revised_text: 'No tempo de Artaxerxes, rei dos persas, Belemus, Mitrídates, Tabélio, Rátimo, Beeltetmo, Samélio, o escriba, e os demais que estavam associados a eles, todos eles moradores de Samaria e dos outros lugares, escreveram contra os habitantes da Judeia e de Jerusalém[b] a seguinte carta[a]:'
  revised_footnotes:
  - marker: a
    text: Em grego, literalmente, “a carta escrita abaixo” ou “a carta posta a seguir”.
    reason: lexical_alternative
  - marker: b
    text: A construção grega em torno de “escreveram [...] contra os habitantes da Judeia e de Jerusalém” é um tanto condensada; a tradução explicita o sentido aparente de uma acusação ou denúncia por escrito.
    reason: alternative_reading
  revision_rationale: 'Foram feitas duas correções seguras: restaurou-se a terminação de «Belemus», correspondente a Βήλεμος, e reformulou-se a oração de residência para que ela alcance o grupo inteiro, como no particípio plural grego. Mantiveram-se a ordem argumentativa, a ambiguidade sintática residual em torno de αὐτῶν e as âncoras das notas.'
