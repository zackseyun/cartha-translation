base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/015.yaml
  text: 'In the time of Artaxerxes king of the Persians[a], Belemus and Mithradates and Tabelius and Rathymus and Beeltethmus and Samellius the scribe, and the rest who were associated with them, living in Samaria and the other places[b], wrote the following letter against the inhabitants of Judea and Jerusalem:'
translation:
  language: pt
  text: 'No tempo de Artaxerxes, rei dos persas, Belemus, Mitrídates, Tabélio, Rátimo, Beeltetmo, Samélio, o escriba, e os demais que estavam associados a eles, todos eles moradores de Samaria e dos outros lugares, escreveram contra os habitantes da Judeia e de Jerusalém[b] a seguinte carta[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “a carta escrita abaixo” ou “a carta posta a seguir”.
    reason: lexical_alternative
  - marker: b
    text: A construção grega em torno de “escreveram [...] contra os habitantes da Judeia e de Jerusalém” é um tanto condensada; a tradução explicita o sentido aparente de uma acusação ou denúncia por escrito.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν δὲ τοῖς ἐπʼ Ἀρταξέρξου τοῦ Περσῶν βασιλέως χρόνοις
  choice: No tempo de Artaxerxes, rei dos persas
  rationale: “No tempo de” traduz naturalmente χρόνοις sem especificar além do texto que se tratava do reinado; “rei dos persas” preserva a construção explícita do grego.
- source_word: κατέγραψεν
  choice: escreveram
  rationale: O verbo indica pôr por escrito ou registrar. O plural é exigido em português pela série de sujeitos, embora o texto grego apresente a forma singular. O objeto “a seguinte carta” torna “escreveram” claro e idiomático.
- source_word: αὐτῶν κατὰ τῶν κατοικούντων ἐν τῇ Ἰουδαίᾳ καὶ Ἱερουσαλήμ
  choice: contra os habitantes da Judeia e de Jerusalém
  rationale: κατά com genitivo tem aqui sentido adversativo, de acusação ou denúncia. O pronome αὐτῶν é sintaticamente difícil; a tradução conserva o sentido aparente sem tentar resolver a dificuldade de modo excessivamente literal.
- source_word: Βήλεμος καὶ Μιθραδάτης καὶ Ταβέλλιος καὶ Ῥάθυμος καὶ Βεέλτεθμος καὶ Σαμέλλιος
  choice: Belem, Mitrídates, Tabélio, Rátimo, Beeltetmo, Samélio
  rationale: Os nomes são transliterados em formas naturais para leitores de português, com acentuação gráfica onde necessária.
- source_word: ὁ γραμματεύς
  choice: o escriba
  rationale: “Escriba” preserva o título tradicional e o sentido de γραμματεύς, que também pode designar um secretário oficial.
- source_word: οἱ λοιποὶ οἱ τούτοις συντασσόμενοι
  choice: os demais que estavam associados a eles
  rationale: A expressão descreve os outros que se alinhavam ou se associavam a essas pessoas, sem necessariamente indicar organização militar.
- source_word: οἰκοῦντες δὲ ἐν Σαμαρείᾳ καὶ τοῖς ἄλλοις τόποις
  choice: moravam em Samaria e nos outros lugares
  rationale: Tradução direta e corrente de οἰκοῦντες e τοῖς ἄλλοις τόποις, mantendo a referência indefinida aos demais lugares.
- source_word: τὴν ὑπογεγραμμένην ἐπιστολήν
  choice: a seguinte carta
  rationale: Embora ὑπογεγραμμένην signifique literalmente “escrita abaixo” ou “posta a seguir”, “a seguinte carta” expressa com naturalidade sua função no discurso.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A longa enumeração do original foi preservada, mas as conjunções repetidas entre todos os nomes foram convertidas em pontuação portuguesa corrente. Os marcadores das notas foram colocados junto às expressões que efetivamente explicam.
