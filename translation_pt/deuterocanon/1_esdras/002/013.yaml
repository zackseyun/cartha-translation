base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/013.yaml
  text: And all the vessels were brought up[a], the gold and silver ones[b], five thousand four hundred and sixty-nine in all.
translation:
  language: pt
  text: 'Todos os utensílios foram transportados[a], tanto os de ouro como os de prata[b]: ao todo, cinco mil quatrocentos e sessenta e nove.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego também pode ser traduzido por “foram levados” ou “foram trazidos”. O contexto pode sugerir o transporte dos utensílios de volta a Jerusalém, mas o verbo, por si só, não diz explicitamente “de volta” nem “para cima”.
    reason: lexical_alternative
  - marker: b
    text: A relação paralela em Esdras 1:9–11 apresenta uma discriminação e números diferentes. Aqui, a tradução segue o texto grego de 1 Esdras.
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ ... πάντα σκεύη
  choice: Todos os utensílios
  rationale: Neste contexto do tesouro do templo, σκεύη designa objetos ou utensílios de uso sagrado. “Utensílios” é natural, claro e evita o possível sentido demasiado genérico de “objetos”.
- source_word: ἐκομίσθη
  choice: foram transportados
  rationale: O aoristo passivo indica que os utensílios foram levados de um lugar para outro. “Foram transportados” preserva esse sentido sem acrescentar ao grego a ideia explícita de subida ou de devolução.
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: tanto os de ouro como os de prata
  rationale: Os adjetivos retomam implicitamente σκεύη. A formulação portuguesa explicita essa relação com naturalidade e mantém as duas categorias de material.
- source_word: πεντακισχίλια τετρακόσια ἑξήκοντα ἐννέα
  choice: cinco mil quatrocentos e sessenta e nove
  rationale: O texto grego apresenta de modo inequívoco o total cardinal de 5.469, reproduzido por extenso no texto bíblico.
