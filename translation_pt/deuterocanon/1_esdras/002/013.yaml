translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da frase foi levemente ajustada para soar natural, sem eliminar a ênfase do grego na totalidade dos utensílios nem harmonizar sua contagem com a tradição hebraica paralela.
