base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/016.yaml
  text: 'To King Artaxerxes our lord: your servants[a], Rathymus, the one over records, and Samellius the scribe, and the rest of their council[c][b], and those in Coele-Syria and Phoenicia.'
translation:
  language: pt
  text: 'Ao rei Artaxerxes, nosso senhor: teus servos, Rátimo, o encarregado dos assuntos apresentados[b], Samélio[a], o escriba, os demais membros do conselho deles e os que estão na Cele-Síria[c] e na Fenícia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As formas gregas Rátimo e Samélio correspondem aproximadamente a Reum e Sinsai no texto massorético paralelo.
    reason: alternative_reading
  - marker: b
    text: O título grego é incerto; mais literalmente, significa “aquele [encarregado] das coisas apresentadas” ou “dos assuntos levados diante de alguém”.
    reason: lexical_alternative
  - marker: c
    text: Cele-Síria é o nome histórico da região mencionada no texto grego.
    reason: cultural_note
lexical_decisions:
- source_word: Βασιλεῖ Ἀρταξέρξῃ κυρίῳ
  choice: Ao rei Artaxerxes, nosso senhor
  rationale: O dativo introduz o destinatário da carta. “Senhor” funciona como título cortesão; “nosso” torna explícita em português a deferência sugerida pelo contexto epistolar.
- source_word: οἱ παῖδές σου
  choice: teus servos
  rationale: No contexto da correspondência real, παῖδες designa subordinados a serviço do rei, não crianças; “servos” conserva o registro de submissão oficial.
- source_word: Ῥάθυμος
  choice: Rátimo
  rationale: Adaptação portuguesa da forma grega, mantida por ser o grego a fonte primária; a forma aproximada do paralelo massorético é indicada em nota.
- source_word: ὁ τὰ προσπίπτοντα
  choice: o encarregado dos assuntos apresentados
  rationale: A expressão administrativa é elíptica e incerta, literalmente relacionada às coisas levadas ou apresentadas diante de alguém. A tradução evita atribuir ao oficial uma função técnica mais específica do que o grego permite.
- source_word: Σαμέλλιος
  choice: Samélio
  rationale: Adaptação portuguesa da forma grega; a forma aproximada do paralelo massorético fica preservada em nota.
- source_word: ὁ γραμματεὺς
  choice: o escriba
  rationale: “Escriba” preserva o sentido administrativo de γραμματεύς e é claro no registro bíblico português atual.
- source_word: οἱ ἐπίλοιποι τῆς βουλῆς αὐτῶν
  choice: os demais membros do conselho deles
  rationale: A explicitação de “membros” torna natural em português o sentido coletivo de βουλή sem alterar a relação expressa por αὐτῶν.
- source_word: οἱ ἐν κοίλῃ Συρίᾳ καὶ Φοινίκῃ
  choice: os que estão na Cele-Síria e na Fenícia
  rationale: Cele-Síria é a forma portuguesa do nome geográfico histórico κοίλη Συρία, preferível a reduzi-lo simplesmente a “Síria”.
theological_decisions: []
translation_notes:
  register: Português contemporâneo, digno e acessível, com tratamento em segunda pessoa singular (“teus”) adequado à fórmula direta da carta. Os nomes próprios seguem prioritariamente as formas gregas, adaptadas à ortografia e à pronúncia portuguesas. A ambiguidade do título administrativo de Rátimo foi preservada no texto e explicitada em nota.
