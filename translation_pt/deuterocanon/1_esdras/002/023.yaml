base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/023.yaml
  text: and its people were carrying out rebellions and wars within it[a], and strong and harsh kings were in Jerusalem, ruling and exacting tribute from Coele-Syria and Phoenicia.
translation:
  language: pt
  text: e os seus habitantes promoviam revoltas e guerras dentro dela[a]; e havia em Jerusalém reis poderosos e severos, que dominavam e cobravam tributos da Celessíria e da Fenícia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo aramaico em Esdras 4:20 descreve Jerusalém como uma cidade rebelde, prejudicial a reis e províncias, na qual havia revoltas desde tempos antigos. Aqui, 1 Esdras amplia a descrição, mencionando “revoltas e guerras” e a cobrança de tributos da Celessíria e da Fenícia.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ ἄνθρωποι
  choice: os seus habitantes
  rationale: No contexto, refere-se às pessoas da cidade; “habitantes” torna o referente natural em português sem acrescentar uma categoria social específica.
- source_word: ἀποστάσεις
  choice: revoltas
  rationale: O substantivo designa levantes ou insurreições políticas; “revoltas” preserva o plural e se ajusta ao contexto.
- source_word: πολέμους
  choice: guerras
  rationale: Equivalente direto do plural grego, sem restringir o sentido a batalhas isoladas.
- source_word: συντελοῦντες
  choice: promoviam
  rationale: Expressa participação ativa na realização ou produção das revoltas e guerras, em formulação natural e digna.
- source_word: ἰσχυροὶ καὶ σκληροὶ
  choice: poderosos e severos
  rationale: Mantém separadamente a força política dos reis e a dureza de seu governo; “severos” evita a possível estranheza de “duros” aplicada a reis.
- source_word: κυριεύοντες
  choice: dominavam
  rationale: Comunica o exercício de domínio político e combina naturalmente com o alcance regional indicado a seguir.
- source_word: φορολογοῦντες
  choice: cobravam tributos de
  rationale: Reflete a imposição de tributo por governantes, sentido mais específico do que a tributação administrativa neutra.
- source_word: κοίλην Συρίαν
  choice: Celessíria
  rationale: Forma portuguesa tradicional do nome geográfico helenístico Coele-Syria.
- source_word: Φοινίκην
  choice: Fenícia
  rationale: Forma portuguesa consagrada do nome da região.
- source_word: ἐν αὐτῇ
  choice: dentro dela
  rationale: Retoma a cidade mencionada no contexto e salienta que os conflitos ocorriam em seu interior.
theological_decisions:
- issue: Relação entre o texto grego de 1 Esdras e o paralelo aramaico de Esdras 4:20
  choice: Manter no texto principal a formulação grega mais ampla sobre revoltas, guerras e tributos cobrados da Celessíria e da Fenícia.
  alternative: Aproximar a redação do paralelo aramaico, descrevendo a cidade como rebelde e prejudicial a reis e províncias, com revoltas desde tempos antigos.
  rationale: O grego é a fonte primária para 1 Esdras e apresenta uma expansão e reformulação genuínas do paralelo; harmonizá-lo apagaria características próprias desta testemunha textual.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A construção conserva a sequência do grego, mas usa pontuação e vocabulário naturais. “Houve” traduz o imperfeito existencial sem sugerir necessariamente que os reis reinavam todos ao mesmo tempo.
