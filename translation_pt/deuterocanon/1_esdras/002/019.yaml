base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/002/019.yaml
  text: And you will find in the records what has been written about these things[a], and you will know that that city was rebellious, troubling kings and cities, and that the Jews in it were rebels and had established blockades from of old; for this reason that city was laid waste.
translation:
  language: pt
  text: E você encontrará nos registros o que foi escrito a esse respeito e saberá que aquela cidade era rebelde e perturbava reis e cidades, e que os judeus eram rebeldes e tinham organizado cercos[a] nela desde tempos antigos; por esse motivo, esta cidade foi devastada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “bloqueios”; o termo grego pode designar atividades de cerco de modo mais amplo.
    reason: alternativa lexical
lexical_decisions:
- source_word: ὑπομνηματισμοῖς
  choice: registros
  rationale: No contexto administrativo, refere-se a documentos oficiais preservados para consulta; “registros” é claro e natural em português.
- source_word: γεγραμμένα
  choice: o que foi escrito
  rationale: Preserva o valor do particípio perfeito, indicando matéria já registrada por escrito.
- source_word: ἀποστάτις
  choice: rebelde
  rationale: A acusação é de insubordinação política da cidade, não de apostasia religiosa.
- source_word: ὀχλοῦσα
  choice: causava perturbação
  rationale: Expressa a ação contínua de inquietar ou causar problemas, com tom adequado a uma acusação administrativa.
- source_word: ἀποστᾶται
  choice: rebeldes
  rationale: O contexto imperial e político favorece “rebeldes”, sem introduzir a conotação religiosa de “apóstatas”.
- source_word: πολιορκίας
  choice: cercos
  rationale: O termo denota operações de cerco; “cercos” mantém o sentido militar amplo e combina naturalmente com “organizavam”.
- source_word: συνεσταμένοι
  choice: organizavam
  rationale: O particípio sugere atividade constituída ou organizada; o imperfeito em português apresenta a prática prolongada descrita pela frase.
- source_word: ἔτι ἐξ αἰῶνος
  choice: desde tempos antigos
  rationale: Comunica duração remota e continuada em linguagem moderna, digna e acessível.
- source_word: ἠρημώθη
  choice: foi devastada
  rationale: Reproduz a voz passiva e a ideia de a cidade ter sido arrasada ou deixada desolada.
theological_decisions:
- issue: Natureza da acusação contra a cidade e os judeus
  choice: Rebelião política e atividade hostil
  alternative: Apostasia religiosa
  rationale: Embora ἀποστάτις e ἀποστᾶται possam assumir sentido religioso em outros contextos, aqui pertencem a uma acusação administrativa de sedição contra o poder imperial.
- issue: Alternância demonstrativa entre ἐκείνη e αὕτη
  choice: “aquela cidade” na descrição e “esta cidade” na conclusão
  alternative: Uniformizar ambas as ocorrências como “aquela cidade”
  rationale: A tradução conserva a mudança demonstrativa efetivamente presente no grego, sem nivelá-la silenciosamente.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período conserva o tom formal de uma acusação administrativa, sem arcaísmos desnecessários.
