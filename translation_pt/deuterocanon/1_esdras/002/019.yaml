revisions:
- from: E você encontrará nos registros o que foi escrito a esse respeito e saberá que aquela cidade era rebelde e causava perturbação a reis e cidades, e que os judeus eram rebeldes e organizavam cercos[a] nela desde tempos antigos; por esse motivo, esta cidade foi devastada.
  to: E você encontrará nos registros o que foi escrito a esse respeito e saberá que aquela cidade era rebelde e perturbava reis e cidades, e que os judeus eram rebeldes e tinham organizado cercos[a] nela desde tempos antigos; por esse motivo, esta cidade foi devastada.
  rationale: A revisão limita-se a explicitar em português o valor perfeito de συνεσταμένοι («tinham organizado») e a tornar mais natural a tradução de ὀχλοῦσα («perturbava»). Conservam-se a acusação de natureza política, a ambiguidade operacional de πολιορκίας e a alternância demonstrativa do grego.
