base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/006.yaml
  text: And the sons of Israel[a], and the priests, and the Levites, and the rest from the captivity who had been brought back[b], did according to what is in the book of Moses.
translation:
  language: pt
  text: E os filhos de Israel, os sacerdotes, os levitas e os demais que tinham sido trazidos de volta do cativeiro fizeram conforme o que está no livro de Moisés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: os filhos de Israel
  rationale: Mantém a expressão bíblica convencional e reproduz de perto o grego, sem reduzir a designação pactual e étnica simplesmente a “israelitas”.
- source_word: οἱ λοιποί
  choice: os demais
  rationale: É uma forma natural e concisa de distinguir o restante da comunidade dos sacerdotes e levitas já mencionados.
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  choice: do cativeiro
  rationale: Preserva a formulação grega e, no contexto da restauração, designa o exílio do qual a comunidade regressou.
- source_word: οἱ προσενεχθέντες
  choice: que tinham sido trazidos de volta
  rationale: Preserva a voz passiva e a ideia contextual de recondução à terra, sem transformar o particípio em um retorno inteiramente autônomo.
- source_word: ἀκολούθως
  choice: conforme
  rationale: Expressa de modo idiomático que a ação foi realizada em conformidade com uma norma escrita.
- source_word: τοῖς ἐν τῇ Μωσέως βίβλῳ
  choice: o que está no livro de Moisés
  rationale: Mantém “livro”, como no grego, sem explicitar “lei” ou “prescrições” além do que o texto diz.
theological_decisions:
- issue: Identidade e agência dos exilados em οἱ προσενεχθέντες
  choice: que tinham sido trazidos de volta
  alternative: que tinham voltado
  rationale: O particípio passivo sugere que foram trazidos ou reconduzidos. A tradução conserva essa agência indeterminada sem atribuí-la explicitamente a Deus ou a uma autoridade humana.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com coordenação ligeiramente simplificada para fluidez. A expressão tradicional “filhos de Israel” e a referência ao “livro de Moisés” preservam o tom bíblico e a proximidade formal com o grego.
