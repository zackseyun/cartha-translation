base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/001.yaml
  text: Then Sisinnes[a], governor of Coele-Syria and Phoenicia, and Sathrabuzanes and their associates, following what had been commanded by King Darius[b],
translation:
  language: pt
  text: Então Sisines, governador da Celessíria[a] e da Fenícia, Satrabuzanes e seus associados[b], seguindo as ordens do rei Dario,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Celessíria era o nome formal de uma região; não significa aqui simplesmente “Síria oca”.
    reason: cultural_note
  - marker: b
    text: Ou “companheiros” ou “parceiros”. O termo grego pode ter esses sentidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca de modo natural a transição temporal e narrativa.
- source_word: Σισίννης
  choice: Sisines
  rationale: Transliteração clara do nome grego, adaptada à ortografia portuguesa.
- source_word: ἔπαρχος
  choice: governador
  rationale: Equivalente corrente e compreensível para o título de autoridade administrativa, sem lhe impor uma especificidade romana posterior.
- source_word: κοίλης Συρίας
  choice: Celessíria
  rationale: Trata-se do nome formal de uma região; emprega-se a forma tradicional portuguesa, em vez de traduzir literalmente κοίλης como descrição.
- source_word: Φοινίκης
  choice: Fenícia
  rationale: Forma portuguesa consagrada do nome geográfico.
- source_word: Σαθραβούζανης
  choice: Satrabuzanes
  rationale: Transliteração do nome próprio grego em forma legível em português.
- source_word: οἱ συνέταιροι
  choice: seus associados
  rationale: συνέταιροι pode designar associados, parceiros ou companheiros; “associados” se ajusta ao contexto administrativo, e o possessivo explicita naturalmente a ligação com os oficiais mencionados.
- source_word: κατακολουθήσαντες
  choice: seguindo
  rationale: Preserva a construção participial e comunica a ideia de agir em conformidade com instruções.
- source_word: τοῖς ὑπὸ τοῦ βασιλέως Δαρείου προσταγεῖσιν
  choice: as ordens do rei Dario
  rationale: Formulação portuguesa natural que preserva o sentido das coisas ordenadas por Dario, sem a rigidez de uma reprodução literal da construção passiva grega.
