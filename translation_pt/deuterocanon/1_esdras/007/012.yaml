base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/012.yaml
  text: And they sacrificed the Passover for all the sons of the captivity[a], and for their brothers the priests[b], and for themselves.
translation:
  language: pt
  text: E sacrificaram a Páscoa[a] por todos os filhos do cativeiro[b], por seus irmãos, os sacerdotes, e por si mesmos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “a Páscoa” se refere ao sacrifício ou à celebração pascal; o grego não diz explicitamente “cordeiro”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por todos os exilados”. O grego diz literalmente “por todos os filhos do cativeiro”, expressão corporativa para a comunidade ligada ao exílio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθυσαν
  choice: sacrificaram
  rationale: O verbo θύω designa o ato de abater ou oferecer uma vítima em sacrifício; “sacrificaram” preserva com precisão a ação cultual.
- source_word: τὸ πάσχα
  choice: a Páscoa
  rationale: πάσχα pode designar tanto a celebração quanto o sacrifício pascal. Como objeto de “sacrificaram”, tem aqui sentido sacrificial, mas “a Páscoa” conserva a ligação entre sacrifício e celebração sem acrescentar “cordeiro”, termo ausente do grego.
- source_word: πᾶσιν τοῖς υἱοῖς τῆς αἰχμαλωσίας
  choice: por todos os filhos do cativeiro
  rationale: A tradução mantém a expressão corporativa do grego e sua referência à comunidade ligada ao exílio, sem substituí-la silenciosamente pela formulação interpretativa “exilados”.
- source_word: ἀδελφοῖς αὐτῶν τοῖς ἱερεῦσιν
  choice: por seus irmãos, os sacerdotes
  rationale: “Irmãos” preserva a linguagem familiar e comunitária de ἀδελφοῖς, enquanto a aposição “os sacerdotes” identifica o grupo em vista.
- source_word: ἑαυτοῖς
  choice: por si mesmos
  rationale: Reproduz diretamente o dativo reflexivo e completa a sequência das pessoas em favor das quais o sacrifício foi realizado.
theological_decisions:
- issue: Linguagem corporativa masculina em τοῖς υἱοῖς e ἀδελφοῖς
  choice: Manter “filhos” e “irmãos” no texto principal
  alternative: “exilados” e “companheiros”
  rationale: As formas masculinas provavelmente têm alcance corporativo no contexto comunitário pós-exílico, mas a redação escolhida preserva a forma e o tom familiar do texto grego sem restringir nem ampliar expressamente sua referência.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação mantém a concisão e a estrutura enumerativa do grego. O uso de “sacrificaram a Páscoa” é deliberadamente formal para conservar a ligação cultual expressa pelo original; as notas esclarecem os dois pontos em que uma tradução mais idiomática poderia apagar nuances.
