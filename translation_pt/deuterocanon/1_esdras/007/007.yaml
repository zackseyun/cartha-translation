lexical_decisions:
- source_word: προσήνεγκαν
  choice: ofereceram
  rationale: No contexto sacrificial, expressa naturalmente a apresentação de animais como ofertas.
- source_word: ἐγκαινισμός
  choice: dedicação
  rationale: Designa a cerimônia de inauguração e consagração do santuário.
- source_word: ἱερόν
  choice: casa
  rationale: Embora o termo grego costume significar «templo» ou «santuário», «casa do Senhor» preserva a formulação tradicional do contexto e a redação auditada, sem alterar o referente.
- source_word: ταύρους
  choice: touros
  rationale: Equivalente direto e corrente para os bovinos machos oferecidos.
- source_word: κριούς
  choice: carneiros
  rationale: Equivalente direto para machos adultos do rebanho ovino.
- source_word: ἄρνας
  choice: cordeiros
  rationale: Equivalente natural para animais ovinos jovens.
