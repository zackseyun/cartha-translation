base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/002.yaml
  text: They supervised the holy works more diligently[a], working together with the elders of the Jews and the temple overseers.
translation:
  language: pt
  text: Eles supervisionavam com mais cuidado as obras sagradas[a], trabalhando em conjunto com os anciãos dos judeus e com os responsáveis pelo templo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os trabalhos do santuário» ou «a obra do templo». O grego diz literalmente «as obras sagradas»; o paralelo hebraico fala da «obra da casa de Deus».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεστάτουν
  choice: supervisionavam
  rationale: O imperfeito indica supervisão contínua; «supervisionavam» expressa com clareza a responsabilidade de dirigir e acompanhar os trabalhos.
- source_word: τῶν ἱερῶν ἔργων
  choice: as obras sagradas
  rationale: Reproduz de perto a expressão grega e preserva sua amplitude, enquanto o contexto e o paralelo hebraico apontam para os trabalhos ligados ao templo.
- source_word: ἐπιμελέστερον
  choice: com mais cuidado
  rationale: Mantém a força comparativa do advérbio e soa natural em português contemporâneo; também pode ter o sentido de «com maior diligência».
- source_word: συνεργοῦντες
  choice: trabalhando em conjunto
  rationale: Expressa cooperação ativa com os dois grupos mencionados na sequência.
- source_word: τοῖς πρεσβυτέροις τῶν Ἰουδαίων
  choice: com os anciãos dos judeus
  rationale: Mantém a relação genitiva do grego e identifica os líderes reconhecidos da comunidade judaica sem reformulação excessiva.
- source_word: ἱεροστάταις
  choice: com os responsáveis pelo templo
  rationale: O termo designa pessoas encarregadas de assuntos sagrados ou do templo. A formulação é clara e evita identificá-las especificamente como sacerdotes, algo que o vocábulo não exige.
theological_decisions:
- issue: Relação entre o texto grego e o paralelo massorético de Esdras 6:22
  choice: Seguir a menção explícita do grego à cooperação com os anciãos dos judeus e os responsáveis pelo templo.
  alternative: 'Traduzir livremente segundo o paralelo hebraico: «fortaleceram as mãos deles na obra da casa de Deus».'
  rationale: Em 1 Esdras, o grego é a fonte primária. O paralelo hebraico confirma que as obras são relacionadas ao templo, mas não substitui os elementos próprios do texto grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o valor contínuo do imperfeito, a comparação em «com mais cuidado» e a ambiguidade contextual de «obras sagradas».
