base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/014.yaml
  text: And they kept the Feast of Unleavened Bread for seven days[a], rejoicing before the Lord,
translation:
  language: pt
  text: E celebraram a Festa dos Pães sem Fermento por sete dias, alegrando-se diante do Senhor,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O paralelo hebraico diz que celebraram «com alegria, pois o SENHOR os havia alegrado».
    reason: Registra a formulação distinta do testemunho hebraico sem incorporá-la ao texto grego principal.
lexical_decisions:
- source_word: ἤγαγον
  choice: celebraram
  rationale: No contexto de uma festa religiosa, ἄγω tem o sentido idiomático de realizar ou celebrar a festa; “celebraram” é natural em português e preserva esse valor.
- source_word: τὴν ἑορτὴν τῶν ἀζύμων
  choice: a Festa dos Pães sem Fermento
  rationale: Tradução clara e corrente do nome da celebração judaica; “pães sem fermento” explicita naturalmente o sentido de ἄζυμα para leitores modernos.
- source_word: ἑπτὰ ἡμέρας
  choice: durante sete dias
  rationale: Expressa em português a duração indicada pelo acusativo grego, sem acrescentar conteúdo.
- source_word: εὐφραινόμενοι
  choice: alegrando-se
  rationale: Mantém a forma verbal participial e apresenta a alegria como circunstância concomitante à celebração.
- source_word: ἔναντι Κυρίου
  choice: diante do Senhor
  rationale: Preserva a ideia de estar na presença de Deus e traduz Κυρίου conforme o texto grego, com linguagem bíblica natural em português.
theological_decisions:
- issue: Tradução de Κυρίου no contexto da Septuaginta, com paralelo hebraico que contém o nome divino
  choice: do Senhor
  alternative: de Yahweh; do SENHOR
  rationale: A fonte principal grega traz Κυρίου. “Senhor” traduz diretamente esse termo sem substituir o texto grego pela forma do paralelo hebraico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A coordenação inicial com “E” e a estrutura verbal preservam a continuidade narrativa do grego.
