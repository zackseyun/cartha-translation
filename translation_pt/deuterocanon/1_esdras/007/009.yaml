  terminology: «Sacerdotes», «levitas», «Senhor Deus de Israel», «livro de Moisés» e «guardas das portas» são adequados. «Divisões» é uma interpretação contextual aceitável, desde que a alternativa literal «tribos» permaneça anotada.
