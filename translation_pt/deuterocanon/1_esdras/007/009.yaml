revisions:
- from: E os sacerdotes e os levitas tomaram seus lugares, vestidos para o serviço e organizados por divisões,[a] a fim de realizar as obras do Senhor, Deus de Israel, conforme o livro de Moisés;[b] e os guardas das portas ficaram em cada portão.
  to: E os sacerdotes e os levitas tomaram seus lugares, vestidos e organizados por divisões,[a] para as obras do Senhor Deus de Israel, conforme o livro de Moisés; e os guardas das portas, cada um em seu portão.[b]
  rationale: A revisão substitui a finalidade excessivamente explícita por «para as obras», mais próxima de ἐπὶ τῶν ἔργων, e remove o verbo suplementar no membro final. «Cada um em seu portão» torna inteligível em português a distribuição indicada por ἐφʼ ἑκάστου πυλῶνος, sem alterar o sentido. A nota sobre «tribos» preserva a ambiguidade lexical de κατὰ φυλάς.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:33:46Z'
