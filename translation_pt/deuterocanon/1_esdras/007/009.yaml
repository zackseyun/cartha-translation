base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/009.yaml
  text: And the priests and the Levites stood arrayed by divisions for the works of the Lord God of Israel[a], in accordance with the book of Moses[b], and the gatekeepers at each gate.
translation:
  language: pt
  text: E os sacerdotes e os levitas tomaram seus lugares, vestidos e organizados por divisões,[a] para as obras do Senhor Deus de Israel, conforme o livro de Moisés; e os guardas das portas, cada um em seu portão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “segundo as tribos”. Neste contexto, a expressão provavelmente se refere às divisões organizadas do serviço sacerdotal e levítico.
    reason: lexical_alternative
  - marker: b
    text: O paralelo hebraico fornecido enfatiza que Deus fortaleceu as mãos do povo na obra da casa de Deus; o texto grego aqui descreve a disposição ordenada dos sacerdotes e levitas para as obras do Senhor, conforme o livro de Moisés.
    reason: cross_reference
lexical_decisions:
- source_word: ἔστησαν
  choice: tomaram seus lugares
  rationale: Expressa naturalmente o ato de se posicionarem para as funções designadas, sem sugerir uma voz passiva que o grego não exige.
- source_word: ἐστολισμένοι
  choice: vestidos para o serviço
  rationale: O particípio indica que estavam trajados ou preparados de modo apropriado; a formulação preserva o contexto cerimonial sem especificar vestes sacerdotais não mencionadas.
- source_word: κατὰ φυλάς
  choice: organizados por divisões
  rationale: φυλάς significa literalmente 'tribos', mas aqui provavelmente descreve agrupamentos ordenados de sacerdotes e levitas para o serviço; a leitura literal é mantida em nota.
- source_word: ἐπὶ τῶν ἔργων
  choice: a fim de realizar as obras
  rationale: Comunica a relação de responsabilidade ou atuação expressa por ἐπί com genitivo, mantendo 'obras' em vez de reduzir o sentido a deveres específicos.
- source_word: Κυρίου θεοῦ Ἰσραήλ
  choice: do Senhor, Deus de Israel
  rationale: Segue diretamente o título divino grego e usa a pontuação para indicar que 'Deus de Israel' identifica o Senhor.
- source_word: ἀκολούθως τῇ Μωσέως βίβλῳ
  choice: conforme o livro de Moisés
  rationale: Formulação corrente e digna que conserva a ideia de conformidade com a instrução escrita atribuída a Moisés.
- source_word: θυρωροί
  choice: guardas das portas
  rationale: Termo claro em português moderno para os encarregados de vigiar as entradas do templo.
- source_word: ἐφʼ ἑκάστου πυλῶνος
  choice: em cada portão
  rationale: Reproduz de modo simples o sentido locativo, distinguindo o local físico da função dos guardas.
theological_decisions:
- issue: Tradução de κύριος numa narrativa grega deuterocanônica relacionada a uma tradição hebraica
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte primária traz Κύριος; portanto, traduz-se o título grego como 'Senhor', sem importar para o texto principal a convenção tipográfica usada diretamente para o nome divino hebraico.
- issue: Relação entre a redação grega e o paralelo massorético fornecido
  choice: traduzir a redação grega tal como está
  alternative: harmonizar com a referência hebraica à obra da casa de Deus
  rationale: O testemunho hebraico paralelo diverge substancialmente e é apenas aproximado. A tradução deve preservar a afirmação grega sobre a disposição dos sacerdotes e levitas, registrando a divergência em nota, sem produzir um texto conflado.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi levemente explicitada para evitar que 'vestidos' pareça modificar apenas os levitas e para comunicar a organização cultual sem eliminar a ambiguidade lexical de φυλάς, preservada na nota.
