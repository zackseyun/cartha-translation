review_pass:
  verdict: revise
  source_fidelity: A tradução capta corretamente a celebração da Páscoa, a data, os grupos sacerdotais e a purificação conjunta. Contudo, «que vieram do cativeiro» explicita um movimento de retorno que o grego formula mais concisamente como pertencimento/procedência «do cativeiro»; «vindos do cativeiro» conserva melhor essa formulação. A nota b acrescenta que a purificação era «exigida», elemento que o versículo não declara.
  naturalness: «Vindos do cativeiro» é natural, claro e compatível com o português moderno de ampla compreensão. «Tinham se purificado juntos» é idiomático e expressa adequadamente a purificação já realizada no contexto da celebração.
  terminology: «Filhos de Israel», «Páscoa», «sacerdotes», «levitas» e «purificado» são escolhas adequadas. «Purificação ritual» na nota esclarece o sentido cultual sem introduzir interpretação doutrinária.
  issues:
  - severity: low
    issue: «Que vieram do cativeiro» torna explícito o retorno.
    rationale: τῶν ἐκ τῆς αἰχμαλωσίας identifica os israelitas como provenientes/associados ao cativeiro. «Vindos do cativeiro» preserva isso sem tornar o verbo de deslocamento parte da oração relativa.
  - severity: medium
    issue: A nota b afirma que a purificação ritual era «exigida».
    rationale: O grego afirma que sacerdotes e levitas se purificaram juntos, mas não qualifica explicitamente a purificação como exigida. A nota deve limitar-se ao dado contextual de preparação ritual.
  revised_text: Os filhos de Israel vindos do cativeiro[a] celebraram a Páscoa no décimo quarto dia do primeiro mês, quando os sacerdotes e os levitas tinham se purificado juntos.[b]
  revised_footnotes:
