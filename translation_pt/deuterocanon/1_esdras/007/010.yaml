base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/010.yaml
  text: And the sons of Israel from the captivity kept the Passover on the fourteenth day of the first month[b][a], when the priests and the Levites had purified themselves together.
translation:
  language: pt
  text: Os filhos de Israel vindos do cativeiro[a] celebraram a Páscoa no décimo quarto dia do primeiro mês, quando os sacerdotes e os levitas tinham se purificado juntos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «do exílio». O grego diz literalmente «do cativeiro» e se refere aos israelitas ligados ao retorno do exílio.
    reason: lexical_alternative
  - marker: b
    text: Isto é, os sacerdotes e os levitas haviam passado por purificação ritual em preparação para a Páscoa.
    reason: cultural_note
lexical_decisions:
- source_word: ἤγαγον
  choice: celebraram
  rationale: Embora o verbo signifique literalmente «conduzir» ou «levar», com τὸ πάσχα como objeto em contexto cultual, ele se refere idiomaticamente à celebração da Páscoa.
- source_word: οἱ υἱοὶ Ἰσραὴλ τῶν ἐκ τῆς αἰχμαλωσίας
  choice: os filhos de Israel que vieram do cativeiro
  rationale: Preserva a designação ancestral «filhos de Israel» e torna explícita, sem alterar o sentido, a relação genitiva com o grupo proveniente do cativeiro.
- source_word: τὸ πάσχα
  choice: a Páscoa
  rationale: É a designação portuguesa corrente da festa bíblica.
- source_word: ἐν τῇ τεσσαρεσκαιδεκάτῃ τοῦ πρώτου μηνός
  choice: no décimo quarto dia do primeiro mês
  rationale: Expressa a data de modo natural e fiel ao grego.
- source_word: ὅτε
  choice: quando
  rationale: Mantém a relação temporal do original sem impor um sentido causal ou estritamente sequencial.
- source_word: ἡγνίσθησαν
  choice: já tinham se purificado
  rationale: Comunica a purificação ritual completada em preparação para a celebração; a construção reflexiva corresponde ao valor contextual do aoristo passivo.
- source_word: ἅμα
  choice: juntos
  rationale: Preserva de forma concisa a ideia de ação conjunta ou simultânea.
theological_decisions:
- issue: Designação corporativa οἱ υἱοὶ Ἰσραήλ
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A formulação preserva a expressão ancestral e corporativa do grego, sem a reduzir a um simples gentílico.
- issue: Natureza da purificação
  choice: já tinham se purificado
  alternative: já tinham sido purificados
  rationale: O contexto indica preparação ritual para a Páscoa, não uma afirmação abstrata de purificação moral; a forma adotada mantém esse sentido cultual sem explicação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. «Celebraram» evita o literalismo obscuro de «levaram a Páscoa», enquanto «filhos de Israel» conserva a forma tradicional e ancestral do grego.
