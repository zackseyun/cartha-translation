base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/015.yaml
  text: because he had turned the counsel of the king of Assyria toward them[a], to strengthen their hands in the work of the Lord, the God of Israel.
translation:
  language: pt
  text: pois ele havia mudado o propósito do rei da Assíria[a] em relação a eles, para fortalecer as mãos deles nas obras do Senhor, o Deus de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tanto o grego quanto o paralelo hebraico dizem “rei da Assíria”, embora o contexto mais amplo de Esdras trate do governante persa. A tradução preserva a expressão das fontes em vez de harmonizá-la.
    reason: Leitura histórica potencialmente difícil; a nota explica por que a forma atestada foi mantida.
lexical_decisions:
- source_word: μετέστρεψεν
  choice: havia voltado
  rationale: O aoristo expressa a ação de voltar ou redirecionar; o mais-que-perfeito composto se encaixa naturalmente na oração causal e indica a ação anterior que possibilitou o trabalho.
- source_word: τὴν βουλὴν
  choice: o propósito
  rationale: βουλή pode significar conselho, plano, intenção ou propósito. Aqui, “propósito” comunica de modo natural a disposição ou decisão régia sem reduzir o termo a um simples sentimento.
- source_word: τοῦ βασιλέως Ἀσσυρίων
  choice: do rei da Assíria
  rationale: Preserva a designação do texto grego, confirmada pelo paralelo hebraico, sem harmonizá-la com o contexto persa mais amplo.
- source_word: ἐπʼ αὐτούς
  choice: para eles
  rationale: Expressa a orientação favorável em direção ao povo, mas evita explicitar além do grego com “em favor deles”.
- source_word: κατισχῦσαι τὰς χεῖρας αὐτῶν
  choice: a fim de fortalecer as mãos deles
  rationale: Mantém a imagem idiomática grega, apoiada pelo paralelo hebraico, e continua compreensível em português moderno como capacitação e encorajamento para agir.
- source_word: ἐπὶ τὰ ἔργα Κυρίου θεοῦ Ἰσραήλ
  choice: na obra do Senhor, o Deus de Israel
  rationale: Embora o grego apresente a forma plural τὰ ἔργα, neste contexto ela pode designar o trabalho ou empreendimento em conjunto; “na obra” soa natural em português e não importa do hebraico a menção ausente à casa de Deus. A aposição identifica o Senhor como o Deus de Israel.
theological_decisions:
- issue: Tradução de κύριος
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte primária grega traz Κυρίου; por isso, traduz-se “Senhor”, embora o paralelo hebraico tenha o nome divino YHWH.
- issue: Título histórico “rei da Assíria” em contexto persa
  choice: manter “rei da Assíria” no texto principal
  alternative: rei da Pérsia
  rationale: Tanto o grego quanto o paralelo hebraico apresentam “rei da Assíria”. A tradução conserva a forma atestada e registra a dificuldade histórica em nota, em vez de harmonizar silenciosamente.
- issue: Agente implícito de μετέστρεψεν
  choice: manter o pronome “ele” sem explicitar o referente
  alternative: explicitar “o Senhor”
  rationale: O versículo fornecido tem sujeito implícito no verbo. O contexto e o paralelo hebraico apontam para Deus, mas a tradução preserva a coesão pronominal do grego e não acrescenta um nome ao texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se o idioma bíblico “fortalecer as mãos”, cuja imagem permanece inteligível, e evita-se um arcaísmo mais rígido como “conselho do rei” para βουλή.
