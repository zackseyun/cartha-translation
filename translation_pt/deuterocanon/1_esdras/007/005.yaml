base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/005.yaml
  text: The house was completed by the twenty-third day of the month Adar[b][a], in the sixth year of King Darius.
translation:
  language: pt
  text: A casa[a] foi concluída até o vigésimo terceiro dia do mês de adar[b], no sexto ano do rei Dario.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o templo; o texto grego diz simplesmente «a casa».
    reason: cross_reference
  - marker: b
    text: Mais literalmente, «até o terceiro e vigésimo do mês de adar».
    reason: lexical_alternative
lexical_decisions:
- source_word: συνετελέσθη
  choice: foi concluída
  rationale: O aoristo passivo de συντελέω indica que a obra chegou à conclusão; a formulação preserva tanto o aspecto de conclusão quanto a voz passiva.
- source_word: ὁ οἶκος
  choice: a casa
  rationale: O grego diz literalmente «a casa». No contexto, a expressão se refere ao templo, mas manter «casa» preserva a forma do texto-fonte; uma nota esclarece o referente.
- source_word: ἕως τρίτης καὶ εἰκάδος
  choice: até o vigésimo terceiro dia
  rationale: ἕως marca o limite temporal, e a expressão ordinal significa literalmente «terceiro e vigésimo», isto é, «vigésimo terceiro». «Até» conserva a nuance de limite sem afirmar mais precisamente se a conclusão ocorreu nesse dia ou já havia ocorrido até então.
- source_word: μηνὸς Ἀδὰρ
  choice: do mês de adar
  rationale: Reproduz diretamente a fórmula de data no genitivo e translitera o nome do mês em forma corrente em português.
- source_word: τοῦ ἕκτου ἔτους
  choice: no sexto ano
  rationale: É a forma portuguesa natural de indicar um ano de reinado.
- source_word: βασιλέως Δαρείου
  choice: do rei Dario
  rationale: Identifica de maneira clara e idiomática o soberano cujo reinado serve de referência cronológica.
