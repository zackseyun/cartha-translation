base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/004.yaml
  text: And they completed these things by the decree of the Lord[a], the God of Israel, and with the approval of Cyrus and Darius and Artaxerxes[b], kings of the Persians.
translation:
  language: pt
  text: Eles concluíram essas coisas por decreto do Senhor, o Deus de Israel, e com a aprovação[a] de Ciro, Dario e Artaxerxes, rei dos persas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com o consentimento” ou “segundo a decisão”.
    reason: lexical_alternative
  - marker: b
    text: O grego traz “rei dos persas” no singular. Formalmente, o título segue “Artaxerxes”, embora o sentido possa abranger os três governantes mencionados como reis persas.
    reason: alternative_reading
lexical_decisions:
- source_word: συνετέλεσαν
  choice: concluíram
  rationale: Expressa a ação de levar algo ao fim, com naturalidade e sem especificar além do grego quais obras ou assuntos foram concluídos.
- source_word: ταῦτα
  choice: essas coisas
  rationale: Preserva o demonstrativo plural e sua referência ampla ao que foi mencionado anteriormente.
- source_word: διὰ προτάγματος
  choice: por decreto
  rationale: Mantém o valor instrumental de διά e o caráter oficial de πρόταγμα.
- source_word: τοῦ κυρίου θεοῦ Ἰσραήλ
  choice: do Senhor, o Deus de Israel
  rationale: Conserva κύριος como “Senhor” e apresenta “o Deus de Israel” como explicação em aposição.
- source_word: μετὰ τῆς γνώμης
  choice: com a aprovação
  rationale: No contexto administrativo, γνώμη indica de modo natural a anuência ou decisão favorável dos governantes, embora o termo admita outras nuances, registradas em nota.
- source_word: Κύρου καὶ Δαρείου καὶ Ἀρταξέρξου
  choice: Ciro, Dario e Artaxerxes
  rationale: Emprega as formas tradicionais e correntes dos nomes em português; a coordenação portuguesa dispensa repetir “e” entre todos os nomes.
- source_word: βασιλέως Περσῶν
  choice: rei dos persas
  rationale: Reproduz o substantivo singular βασιλέως e o genitivo plural Περσῶν. Pela forma sintática, o título segue Artaxerxes, embora possa ser entendido como aplicável aos três governantes.
theological_decisions:
- issue: Relação entre a determinação divina e a autorização imperial
  choice: A conclusão ocorre por decreto do Senhor e com a aprovação dos governantes persas.
  alternative: Entender a aprovação real apenas como o meio subordinado pelo qual se cumpriu o decreto divino.
  rationale: O grego coordena διὰ προτάγματος e μετὰ τῆς γνώμης. A tradução mantém lado a lado a determinação divina e a anuência imperial, sem reduzir uma à outra.
- issue: Alcance do título singular “rei dos persas”
  choice: Manter o singular, formalmente ligado a Artaxerxes.
  alternative: Usar o plural “reis dos persas”, entendendo o título distributivamente em relação a Ciro, Dario e Artaxerxes.
  rationale: βασιλέως está no singular. A nota conserva a possibilidade contextual de o título caracterizar os três nomes, sem corrigir silenciosamente a forma grega.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação preserva o paralelismo entre o decreto divino e a aprovação imperial, bem como o singular do título grego.
