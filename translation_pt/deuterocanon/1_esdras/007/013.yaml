base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/013.yaml
  text: And the sons of Israel who were from the captivity ate[a], all those who had separated themselves from the abominations of the nations of the land[b], seeking the Lord.
translation:
  language: pt
  text: E comeram os filhos de Israel procedentes do cativeiro,[a] todos os que se haviam separado das abominações dos povos da terra,[b] buscando o Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, comeram a refeição da Páscoa; o objeto está implícito no grego com base no contexto anterior.
    reason: cross_reference
  - marker: b
    text: Ou “das nações da terra”. A expressão se refere aos povos que habitavam a terra e cujas práticas eram consideradas contaminadoras.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάγοσαν
  choice: comeram
  rationale: O verbo significa simplesmente “comeram”. O objeto, a refeição da Páscoa, fica implícito no grego e é esclarecido em nota.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: os filhos de Israel
  rationale: Mantém a expressão semítica preservada pelo grego e sua nuance genealógica e pactual, em linguagem bíblica ainda clara em português.
- source_word: οἱ ἐκ τῆς αἰχμαλωσίας
  choice: que tinham vindo do cativeiro
  rationale: Expressa de modo natural a procedência indicada por ἐκ, sem empregar o rótulo interpretativo “os exilados que voltaram”.
- source_word: χωρισθέντες
  choice: se haviam separado
  rationale: O particípio passivo admite aqui sentido médio ou reflexivo e descreve uma separação deliberada anterior à participação na refeição.
- source_word: βδελυγμάτων
  choice: abominações
  rationale: Preserva a forte carga moral e cultual do termo grego, sem reduzi-lo apenas a impurezas genéricas.
- source_word: τῶν ἐθνῶν τῆς γῆς
  choice: dos povos da terra
  rationale: “Povos” é natural para ἔθνη neste contexto e evita a conotação técnica posterior de “gentios”; “nações da terra” permanece uma alternativa possível.
- source_word: ζητοῦντες τὸν κύριον
  choice: buscando o Senhor
  rationale: Conserva a forma participial e a ideia de orientação religiosa contínua; “Senhor” segue a forma tradicional para κύριον.
theological_decisions:
- issue: Explicitar ou não o objeto da ação de comer
  choice: 'Manter o objeto implícito: “comeram”'
  alternative: “comeram a Páscoa” ou “participaram da refeição pascal”
  rationale: O contexto anterior identifica a refeição, mas o objeto não aparece neste versículo grego. A nota fornece a informação sem inseri-la no texto.
- issue: Sentido da linguagem de separação
  choice: “se haviam separado das abominações dos povos da terra”
  alternative: “tinham sido separados das impurezas dos povos da terra”
  rationale: O contexto favorece força reflexiva e separação de práticas consideradas contaminadoras, sem afirmar uma separação meramente étnica ou social.
translation_notes:
  register: Português moderno, digno e acessível, com leve textura bíblica em “filhos de Israel”. A construção foi ajustada à fluência em português sem explicitar no corpo do texto o objeto omitido pelo grego.
