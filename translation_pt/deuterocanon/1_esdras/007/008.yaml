base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/008.yaml
  text: twelve goats for the sin of all Israel[a], according to the number of the twelve tribal leaders of Israel.
translation:
  language: pt
  text: doze bodes pelo pecado de todo o Israel[a], segundo o número dos doze chefes das tribos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, explicitando a linguagem sacrificial: “doze bodes como oferta pelo pecado em favor de todo o Israel”.'
    reason: Alternativa lexical que torna explícito o sentido ritual de ὑπὲρ ἁμαρτίας.
lexical_decisions:
- source_word: χιμάρους
  choice: bodes
  rationale: O termo χίμαρος designa bodes, isto é, caprinos machos; “bodes” é preciso, natural e adequado ao contexto sacrificial.
- source_word: ὑπὲρ ἁμαρτίας
  choice: pelo pecado
  rationale: A expressão significa literalmente “pelo pecado” e, em contexto sacrificial, pode funcionar como fórmula para uma oferta pelo pecado. A tradução principal preserva a forma concisa do grego, enquanto a nota explicita o sentido ritual.
- source_word: παντὸς τοῦ Ἰσραήλ
  choice: de todo o Israel
  rationale: Preserva a relação genitiva do grego e expressa que o sacrifício dizia respeito à totalidade de Israel.
- source_word: πρὸς ἀριθμόν
  choice: segundo o número
  rationale: Expressa de modo transparente a correspondência numérica indicada pela locução grega.
- source_word: φυλάρχων
  choice: chefes das tribos
  rationale: φυλάρχης é o chefe ou dirigente de uma tribo; a expressão escolhida é clara e corrente em português.
theological_decisions:
- issue: Explicitar ou não a fórmula sacrificial ὑπὲρ ἁμαρτίας como “oferta pelo pecado”
  choice: Manter no texto “pelo pecado”, próximo da formulação grega.
  alternative: “como oferta pelo pecado em favor de todo o Israel”
  rationale: O contexto permite entender a expressão como linguagem sacrificial, mas o grego é breve e não contém um substantivo correspondente a “oferta”. A nota preserva a leitura idiomática explícita sem apagar essa característica do texto-fonte.
translation_notes:
  register: Português moderno, claro e digno, com terminologia sacrificial bíblica acessível. O artigo em “todo o Israel” foi mantido por naturalidade no português brasileiro, e “chefes das tribos” evita uma formulação excessivamente técnica.
