base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/011.yaml
  text: and all the sons of the captivity[a], because they had purified themselves. For all the Levites together had purified themselves, all of them[b],
translation:
  language: pt
  text: e todos os filhos do exílio[a], porque haviam se purificado. Pois todos os levitas juntos haviam se purificado, todos eles[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «filhos do cativeiro»; de modo mais idiomático: «os exilados».'
    reason: lexical_alternative
  - marker: b
    text: O sentido do texto grego é fragmentário neste ponto e parece prosseguir na oração seguinte. «Haviam se purificado» também pode ser traduzido por «haviam sido purificados».
    reason: textual_variant
lexical_decisions:
- source_word: υἱοὶ τῆς αἰχμαλωσίας
  choice: filhos do exílio
  rationale: Preserva a expressão comunitária tradicional do grego e continua compreensível em português; a forma mais idiomática «os exilados» é indicada em nota.
- source_word: ἡγνίσθησαν
  choice: haviam se purificado
  rationale: No contexto cultual, o verbo indica purificação ritual. A forma médio-passiva admite leitura reflexiva ou passiva; a tradução reflexiva mantém a provável ideia de preparação deliberada para o culto sem eliminar a alternativa gramatical.
- source_word: λευεῖται
  choice: levitas
  rationale: É a forma tradicional e corrente em português para o nome desse grupo.
- source_word: ἅμα πάντες
  choice: todos ... juntos
  rationale: Conserva tanto a totalidade quanto o caráter coletivo da purificação, mantendo também a repetição enfática de πάντες no fim da oração.
theological_decisions:
- issue: Sentido da linguagem de purificação ritual
  choice: haviam se purificado
  alternative: haviam sido purificados
  rationale: O contexto trata da aptidão ritual para o culto, não simplesmente de renovação moral interior. A leitura reflexiva é provável, mas a ambiguidade da forma grega é preservada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A construção algo interrompida e a repetição final foram mantidas porque refletem o caráter fragmentário e enfático do grego.
