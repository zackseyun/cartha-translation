base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/007/003.yaml
  text: And the holy works prospered[a], while Haggai and Zechariah the prophets were prophesying.
translation:
  language: pt
  text: E as obras sagradas progrediam[a], enquanto os profetas Ageu e Zacarias profetizavam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “obras sacras”; no contexto, refere-se à obra do templo.'
    reason: Registra a alternativa lexical para τὰ ἱερὰ ἔργα e esclarece a referência contextual sem inserir «templo» no texto principal.
lexical_decisions:
- source_word: εὐόδα ἐγίνετο
  choice: progrediam
  rationale: A expressão indica que as obras avançavam de modo favorável. “Progrediam” é natural em português e preserva o sentido de progresso bem-sucedido sem acrescentar uma causa não expressa.
- source_word: τὰ ἱερὰ ἔργα
  choice: as obras sagradas
  rationale: Tradução transparente da expressão grega. O contexto aponta para as obras do templo, mas o grego deste versículo não menciona explicitamente o templo.
- source_word: προφητευόντων
  choice: enquanto ... profetizavam
  rationale: O genitivo absoluto exprime uma ação simultânea e em andamento; a construção com “enquanto” reproduz claramente essa relação temporal.
- source_word: Ἁγγαίου
  choice: Ageu
  rationale: Forma tradicional e amplamente reconhecida do nome do profeta em português.
- source_word: Ζαχαρίου
  choice: Zacarias
  rationale: Forma tradicional e amplamente reconhecida do nome do profeta em português.
- source_word: τῶν προφητῶν
  choice: os profetas
  rationale: Mantém a identificação apositiva explícita de Ageu e Zacarias como profetas.
theological_decisions:
- issue: Explicitar se “as obras sagradas” eram as obras de construção do templo
  choice: Manter “as obras sagradas” no texto principal
  alternative: as obras do templo; a obra da casa de Deus
  rationale: Embora o contexto se refira à obra do templo, o texto grego deste versículo usa uma expressão mais ampla. A tradução não deve eliminar essa amplitude nem tornar explícito o que aqui permanece implícito.
translation_notes:
  register: Português moderno, claro e digno, com formas bíblicas correntes dos nomes próprios. A ordem foi ajustada levemente para soar natural, preservando a simultaneidade das ações.
