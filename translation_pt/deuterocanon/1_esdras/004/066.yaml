  yaml_path: translation/deuterocanon/1_esdras/004/066.yaml
  text: and all the vessels taken from Jerusalem are to be sent back there—those that Cyrus set apart when he vowed to destroy Babylon[c][b][a], and vowed to send there.
translation:
  language: pt
  text: e que todos os utensílios levados de Jerusalém fossem enviados de volta para lá[a] — aqueles que Ciro separou quando fez o voto[b] de eliminar Babilônia[c] e fez o voto de enviá-los para lá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “fossem enviados para lá”; “de volta” é explicitado pelo contexto, pois os utensílios haviam sido levados de Jerusalém.
    reason: lexical_alternative
  - marker: b
    text: Ou “quando orou”. O verbo grego pode significar tanto fazer um voto como orar.
    reason: alternative_reading
  - marker: c
    text: Ou “destruir Babilônia”. O verbo grego significa literalmente “cortar fora” ou “abater”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεύη
  choice: utensílios
  rationale: No contexto do templo, designa objetos ou utensílios de uso sagrado. “Utensílios” é claro e não especifica indevidamente sua forma.
- source_word: τὰ λημφθέντα ἐξ Ἰερουσαλήμ
  choice: levados de Jerusalém
  rationale: O particípio indica objetos retirados de Jerusalém; “levados” expressa isso naturalmente sem acrescentar se foram apreendidos ou recebidos.
- source_word: ἐκπέμψαι
  choice: fossem enviados de volta
  rationale: O infinitivo significa literalmente “enviar”, mas o contexto é a devolução a Jerusalém de objetos antes retirados dali. “De volta” explicita essa direção contextual e é assinalado em nota.
- source_word: ἃ ἐχώρισεν
  choice: aqueles que Ciro havia separado
  rationale: χωρίζω comunica a ideia de separar ou reservar determinados objetos; “separado” preserva o sentido amplo do grego.
- source_word: ηὔξατο
  choice: fez o voto
  rationale: Com infinitivos complementares, o verbo provavelmente descreve um voto ou compromisso solene. A possível acepção “orou” é preservada em nota.
- source_word: ἐκκόψαι Βαβυλῶνα
  choice: eliminar Babilônia
  rationale: ἐκκόπτω significa literalmente “cortar para fora/abater” e, em sentido figurado, eliminar ou destruir. “Eliminar” mantém algo da imagem de supressão sem soar artificial em português; a literalidade é indicada em nota.
- source_word: ἐξαποστεῖλαι ἐκεῖ
  choice: enviá-los para lá
  rationale: A expressão indica despacho para aquele lugar. O objeto pronominal é exigido pelo português e retoma os utensílios.
theological_decisions:
- issue: Sentido de ηὔξατο na ação de Ciro
  choice: fez o voto
  alternative: orou
  rationale: A construção com infinitivo favorece a noção de voto ou compromisso solene, mas o verbo também pode significar “orar”; a alternativa permanece em nota para não resolver silenciosamente a ambiguidade.
- issue: Explicitação da devolução em ἐκπέμψαι
  choice: enviados de volta
  alternative: enviados
  rationale: O contexto indica o retorno a Jerusalém dos objetos retirados dali, embora o grego não contenha um advérbio explícito equivalente a “de volta”.
- issue: Força de ἐκκόψαι aplicado a Babilônia
  choice: eliminar
  alternative: cortar fora; destruir
  rationale: A expressão grega conserva uma imagem verbal de corte, empregada figuradamente para a eliminação ou destruição de Babilônia. A nota mantém a forma literal e a alternativa idiomática.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe de continuação adequada ao fragmento iniciado por καί. A repetição de “fez o voto” acompanha a repetição grega de ηὔξατο e evita ocultar a estrutura do original.
