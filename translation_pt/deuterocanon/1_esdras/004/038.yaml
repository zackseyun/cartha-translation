  text: And the truth remains and is strong forever, and lives and prevails forever and ever.
translation:
  language: pt
  text: E a verdade permanece e é forte para sempre; ela vive e prevalece para todo o sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἀλήθεια
  choice: a verdade
  rationale: O artigo definido preserva o destaque dado à verdade como sujeito personificado nesta declaração culminante.
- source_word: μένει
  choice: permanece
  rationale: Expressa continuidade e permanência em português atual, sem tom arcaico.
- source_word: ἰσχύει
  choice: é forte
  rationale: Reflete a força inerente indicada pelo verbo e mantém distinção em relação a κρατεῖ mais adiante.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: É a forma idiomática corrente de exprimir a duração ilimitada da locução grega.
- source_word: ζῇ
  choice: vive
  rationale: Conserva a personificação vívida da verdade presente no grego.
- source_word: κρατεῖ
  choice: prevalece
  rationale: Comunica domínio efetivo ou triunfo, sem confundi-lo com a ideia de força expressa por ἰσχύει.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: para todo o sempre
  rationale: Reproduz de modo natural em português a intensificação climática da expressão grega.
theological_decisions:
- issue: Personificação da verdade
  choice: Manter os predicados pessoais “vive” e “prevalece” aplicados à verdade
  alternative: 'Despersonificar como mera permanência abstrata, por exemplo: “a verdade perdura e tem poder”'
  rationale: O grego atribui explicitamente vida e domínio à verdade. Preservar essa personificação respeita a retórica do texto sem acrescentar uma identificação doutrinária não declarada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula organiza as duas afirmações paralelas sem alterar sua relação aditiva; “ela” retoma claramente “a verdade” e sustenta a personificação.
