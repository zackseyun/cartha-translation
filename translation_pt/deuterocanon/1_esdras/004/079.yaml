base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/079.yaml
  text: And he sent back all the vessels that Cyrus had set apart from Babylon; and everything that Cyrus had said should be done[a], he himself also ordered to be done and to be sent to Jerusalem.
translation:
  language: pt
  text: E ele enviou de volta todos os utensílios que Ciro havia separado da Babilônia[a]. E tudo quanto Ciro havia dito que se fizesse, ele próprio também ordenou que fosse feito e enviado a Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “havia retirado da Babilônia”. O verbo grego pode indicar separar, pôr à parte ou remover; aqui se refere aos utensílios do templo destinados a ser levados a Jerusalém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαπέστειλεν
  choice: enviou de volta
  rationale: Embora o verbo possa significar simplesmente “enviou” ou “despachou”, o contexto narrativo é o retorno a Jerusalém dos utensílios anteriormente levados; “de volta” expressa essa direção contextual sem alterar o agente.
- source_word: τὰ σκεύη
  choice: os utensílios
  rationale: Em contexto de templo, σκεύη designa os objetos ou utensílios empregados no serviço sagrado. “Utensílios” é claro em português moderno e evita sugerir apenas recipientes.
- source_word: ἃ ἐχώρισεν Κῦρος ἀπὸ Βαβυλῶνος
  choice: que Ciro havia separado da Babilônia
  rationale: A formulação conserva a amplitude de χωρίζω (“separar”, “pôr à parte”, “retirar”) e mantém a construção grega com ἀπό, sem decidir silenciosamente se a ênfase recai na seleção ou na remoção física.
- source_word: πάντα ὅσα εἶπεν Κῦρος ποιῆσαι
  choice: tudo quanto Ciro havia dito que se fizesse
  rationale: A construção com infinitivo após εἶπεν comunica instruções anteriores de Ciro. A forma “que se fizesse” é natural, digna e preserva a referência impessoal ao que deveria ser realizado.
- source_word: καὶ αὐτὸς
  choice: ele próprio também
  rationale: Preserva tanto a ênfase de αὐτός quanto a força aditiva de καί.
- source_word: ἐπέταξεν ποιῆσαι καὶ ἐξαποστεῖλαι εἰς Ἰερουσαλήμ
  choice: ordenou que fosse feito e enviado a Jerusalém
  rationale: “Ordenou” corresponde ao caráter administrativo de ἐπέταξεν. Os dois verbos coordenados são representados em paralelo, com a formulação passiva adequada ao contexto e fluente em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conservou-se o pronome “ele” sem explicitar seu referente, pois o versículo grego não nomeia novamente o sujeito. A repetição de “Ciro” e a ênfase de “ele próprio também” foram mantidas para refletir a estrutura do original.
