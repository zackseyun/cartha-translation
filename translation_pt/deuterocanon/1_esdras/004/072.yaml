  text: and that all the land they possess should be tax-free for them[b][a]; and that the Chaldeans should leave the villages of the Jews that they hold.
translation:
  language: pt
  text: e que toda a terra que eles possuírem lhes seja isenta de impostos; e que os caldeus deixem as aldeias dos judeus que os caldeus mantêm sob seu domínio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χώραν
  choice: terra
  rationale: Termo territorial amplo e natural, adequado ao contexto jurídico-administrativo sem definir uma unidade política específica.
- source_word: κρατήσουσιν
  choice: possuírem
  rationale: O futuro de κρατέω indica aqui posse ou controle efetivo do território; “possuírem” expressa isso de modo claro.
- source_word: ἀφορολόγητον
  choice: isenta de impostos
  rationale: Expressa diretamente a isenção fiscal ou tributária indicada pelo adjetivo grego.
- source_word: ὑπάρχειν
  choice: seja
  rationale: Na construção infinitiva dependente do decreto, indica o estado jurídico que deve vigorar; o subjuntivo português preserva a força prescritiva.
- source_word: Χαλδαῖοι
  choice: caldeus
  rationale: Mantém o etnônimo explícito do texto grego, sem substituí-lo pela identificação interpretativa “babilônios”.
- source_word: ἀφίουσι
  choice: deixem
  rationale: Neste contexto, ἀφίημι significa abandonar ou abrir mão da posse; “deixem” é natural e preserva a formulação do original.
- source_word: κώμας
  choice: aldeias
  rationale: Equivalente português comum e preciso para κώμη.
- source_word: διακρατοῦσιν
  choice: mantêm sob seu domínio
  rationale: O composto comunica retenção firme ou controle continuado; a expressão torna esse sentido explícito sem acrescentar uma ideia de propriedade legal.
theological_decisions:
- issue: Força jurídico-administrativa das orações infinitivas no contexto de um decreto real
  choice: 'Empregar orações com subjuntivo: “seja” e “deixem”'
  alternative: Infinitivos mais literais, como “ser isenta” e “deixar”
  rationale: O subjuntivo transmite em português atual a força prescritiva das disposições do decreto, sem resolver qualquer questão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação iniciada por “e que” preserva a continuidade sintática do decreto no contexto maior. Não foram necessárias notas de rodapé.
