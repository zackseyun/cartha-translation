lexical_decisions:
- source_word: ἀπενοήθησαν ταῖς ἰδίαις διανοίαις
  choice: perderam o juízo em seus próprios pensamentos
  rationale: A expressão indica perda ou desvio do entendimento sensato. A formulação preserva a referência explícita aos próprios pensamentos sem sugerir necessariamente insanidade em sentido clínico.
- source_word: διὰ τὰς γυναῖκας
  choice: por causa das mulheres
  rationale: διά com acusativo expressa causa; esta é a correspondência mais direta e natural em português.
- source_word: δοῦλοι ἐγένοντο
  choice: se tornaram escravos
  rationale: O predicativo δοῦλοι indica sujeição forte e concreta; «escravos» preserva essa força melhor que «servos», enquanto ἐγένοντο é expresso naturalmente por «se tornaram».
- source_word: διʼ αὐτάς
  choice: por causa delas
  rationale: O pronome retoma «as mulheres», e a repetição da construção causal conserva o paralelismo do grego.
