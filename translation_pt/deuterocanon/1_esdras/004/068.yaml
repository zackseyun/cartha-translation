base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/068.yaml
  text: 'And now this is what I ask, O lord king, and what I request from you, and this is the greatness that comes from you: therefore I beg that you do the vow which I vowed to the King of heaven that it should be done by your mouth.'
translation:
  language: pt
  text: 'E agora, ó rei, meu senhor, isto é o que peço e o que te solicito; e esta é a grandeza que vem de ti: rogo-te, portanto, que cumpras o voto[a] que fiz ao Rei do céu: realizá-lo por tua ordem[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «faças o voto»; isto é, que leves a efeito aquilo que foi prometido.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «de tua boca»; isto é, por tua palavra, ordem ou autorização expressa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιῶ
  choice: peço
  rationale: No contexto de uma petição à corte, expressa um pedido respeitoso, não uma exigência ou reivindicação.
- source_word: αἰτοῦμαί
  choice: solicito
  rationale: Distingue o segundo verbo de ἀξιῶ e preserva a duplicação retórica em linguagem formal e natural.
- source_word: ἡ μεγαλωσύνη ἡ παρὰ σοῦ
  choice: a grandeza que procede de ti
  rationale: Conserva a ideia de algo que vem da parte do rei, sem reduzir μεγαλωσύνη apenas a uma qualidade abstrata.
- source_word: δέομαι
  choice: rogo-te
  rationale: Marca a intensificação do apelo e mantém um registro digno, sem linguagem arcaica excessiva.
- source_word: ποιήσῃς τὴν εὐχήν
  choice: cumpras o voto
  rationale: A construção cognata com ηὐξάμην favorece o sentido de voto; 'cumprir o voto' verte naturalmente o idioma grego literal 'fazer o voto'.
- source_word: ηὐξάμην
  choice: fiz
  rationale: Com 'o voto' como antecedente, 'o voto que fiz' é a formulação portuguesa natural e mantém o sentido votivo.
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: ao Rei do céu
  rationale: Reproduz diretamente o título divino e o distingue do rei terreno a quem se dirige a fala.
- source_word: ἐκ στόματός σου
  choice: por uma ordem de tua boca
  rationale: Preserva a imagem concreta da boca e explicita, de modo moderado, seu valor contextual de comando ou autorização falada.
theological_decisions:
- issue: Referência de 'Rei do céu'
  choice: Título divino referente a Deus
  alternative: rei celestial
  rationale: No contexto judaico da corte, a expressão designa reverentemente Deus e o contrapõe ao rei terreno.
- issue: Sentido de εὐχή / ηὐξάμην
  choice: Linguagem de voto
  alternative: Linguagem geral de oração
  rationale: O par cognato e a expressão 'cumprir/fazer o voto' favorecem uma promessa solene feita a Deus, embora εὐχή isoladamente também possa significar oração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição 'peço... solicito' preserva a retórica do grego; 'senhor rei' mantém a forma de tratamento cortesã. As notas registram o idioma literal e a imagem concreta sem sobrecarregar o texto principal.
