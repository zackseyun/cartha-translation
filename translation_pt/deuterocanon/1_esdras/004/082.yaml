  yaml_path: translation/deuterocanon/1_esdras/004/082.yaml
  text: Blessed are you[a], who have given me wisdom; and to you I give thanks, Master of the fathers.
translation:
  language: pt
  text: Bendito és tu, que me deste sabedoria; e a ti dou graças[a], Soberano dos antepassados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a ti reconheço/confesso”. O verbo grego pode indicar reconhecimento público, confissão ou louvor; aqui, “dou graças” corresponde ao contexto de uma bênção dirigida a Deus após o recebimento da sabedoria.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογητὸς εἶ
  choice: Bendito és tu
  rationale: Preserva a fórmula doxológica e a cópula explícita, em linguagem bíblica digna e ainda compreensível.
- source_word: ὃς ἔδωκάς μοι σοφίαν
  choice: que me deste sabedoria
  rationale: Traduz diretamente o aoristo como uma ação concluída e mantém σοφίαν no sentido usual de “sabedoria”.
- source_word: σοὶ ὁμολογῶ
  choice: a ti dou graças
  rationale: No contexto de bênção dirigida a Deus, expressa naturalmente o reconhecimento público e agradecido que ὁμολογέω pode transmitir, sem sugerir necessariamente confissão de pecado.
- source_word: δέσποτα
  choice: Soberano
  rationale: Comunica autoridade absoluta e preserva a distinção em relação a κύριος; “Mestre” poderia ser entendido principalmente como professor, e “Dono” soaria pouco adequado neste registro.
- source_word: τῶν πατέρων
  choice: dos antepassados
  rationale: Torna o referente geracional claro ao leitor moderno sem acrescentar o possessivo “nossos”, ausente no grego.
theological_decisions:
- issue: Sentido de ὁμολογῶ na oração
  choice: dou graças
  alternative: confesso; reconheço; louvo
  rationale: A moldura doxológica favorece agradecimento ou reconhecimento reverente. A nota preserva a amplitude lexical do verbo grego.
- issue: Título divino δέσποτα
  choice: Soberano
  alternative: Senhor; Mestre; Dono
  rationale: “Soberano” retém a ideia de autoridade absoluta e evita confundir δέσποτα com o título κύριος, normalmente vertido por “Senhor”.
- issue: Identidade dos “pais”
  choice: antepassados
  alternative: pais; nossos antepassados
  rationale: “Antepassados” é claro em português atual; não se acrescentou “nossos”, pois o texto grego não contém pronome possessivo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leve cadência bíblica em “Bendito és tu”. A ordem “a ti dou graças” conserva a ênfase do grego sem soar artificial. “Antepassados” evita a possível leitura de “pais” como progenitores imediatos.
