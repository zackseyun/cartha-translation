base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/042.yaml
  text: Then the king said to him[a], “Ask for whatever more you want beyond what has been written, and we will give it to you, because you have been found wiser; and you shall sit beside me[c][b], and you shall be called my kinsman.”
translation:
  language: pt
  text: 'Então o rei lhe disse: “Peça o que quiser, além do que está escrito, e nós lhe daremos, pois você foi considerado mais sábio. Você se sentará ao meu lado[a] e será chamado meu parente[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você se sentará junto de mim”. A expressão grega indica proximidade e honra na corte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “meu familiar”. A expressão pode indicar favor régio e posição elevada, sem necessariamente afirmar parentesco de sangue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἴτησαι
  choice: Peça
  rationale: O imperativo aoristo médio introduz um convite ou uma ordem direta do rei; “Peça” é natural e mantém sua força.
- source_word: ὃ θέλεις πλείω τῶν γεγραμμένων
  choice: o que quiser, além do que está escrito
  rationale: Preserva a oração relativa aberta, o valor comparativo de πλείω e a referência indefinida ao que já foi registrado por escrito.
- source_word: δώσομέν σοι
  choice: nós lhe daremos
  rationale: Reproduz de modo direto o futuro e mantém o plural usado pelo rei no grego.
- source_word: ὃν τρόπον εὑρέθης σοφώτερος
  choice: pois você foi considerado mais sábio
  rationale: “Pois” comunica a função causal contextual de ὃν τρόπον; “foi considerado” conserva o sentido passivo de εὑρέθης, e “mais sábio” mantém o comparativo sem explicitar seu termo implícito.
- source_word: ἐχόμενός μου καθήσῃ
  choice: Você se sentará ao meu lado
  rationale: Com genitivo, ἐχόμενος expressa proximidade; em contexto de corte, “ao meu lado” comunica tanto a posição quanto a honra conferida.
- source_word: συγγενής μου κληθήσῃ
  choice: será chamado meu parente
  rationale: “Parente” preserva o sentido familiar de συγγενής em português atual sem afirmar necessariamente consanguinidade literal.
theological_decisions:
- issue: Linguagem de honra régia em συγγενής μου κληθήσῃ
  choice: será chamado meu parente
  alternative: será chamado meu familiar / será chamado meu aliado
  rationale: A expressão indica elevação à proximidade honorífica do rei. “Parente” retém a metáfora familiar do grego; “aliado” ou “amigo” introduziria uma categoria política não expressa.
- issue: Sentido passivo e comparativo de εὑρέθης σοφώτερος
  choice: foi considerado mais sábio
  alternative: mostrou ser mais sábio
  rationale: A opção escolhida preserva a avaliação passiva do texto e não transforma explicitamente o resultado em demonstração pessoal.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e internacionalmente. Mantém o tratamento por “você”, a fala régia no plural e a ambiguidade social da designação de parentesco.
