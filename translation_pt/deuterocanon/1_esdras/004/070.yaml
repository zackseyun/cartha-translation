base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/070.yaml
  text: And he wrote letters to all the local rulers in Coele-Syria and Phoenicia and to those in Lebanon[a], to bring cedar timber from Lebanon to Jerusalem, so that they might build the city with him.
translation:
  language: pt
  text: E escreveu cartas a todos os governantes locais da Cele-Síria e da Fenícia e aos que estavam no Líbano[a], para transportarem madeira de cedro do Líbano para Jerusalém, a fim de que construíssem a cidade com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “governadores de distrito”; em grego, “toparcas”, governantes de localidades ou distritos.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοπάρχαις
  choice: governantes locais
  rationale: O termo designa governantes de localidades ou distritos; esta expressão comunica o sentido administrativo em português atual sem recorrer à transliteração opaca “toparcas”.
- source_word: ἐν κοίλῃ Συρίᾳ
  choice: da Cele-Síria
  rationale: Trata-se da designação histórica de uma região no uso helenístico. “Cele-Síria” preserva o nome próprio em vez de reduzi-lo simplesmente a “Síria”.
- source_word: ἔγραψεν ἐπιστολάς
  choice: escreveu cartas
  rationale: A tradução mantém a ação explicitamente expressa no grego, embora o contexto também pressuponha o envio das cartas.
- source_word: μεταφέρειν
  choice: transportassem
  rationale: No contexto do deslocamento de material de construção entre o Líbano e Jerusalém, “transportar” exprime com clareza o sentido do infinitivo grego.
- source_word: ξύλα κέδρινα
  choice: madeira de cedro
  rationale: A expressão refere-se à madeira usada como material de construção; “madeira de cedro” é natural e precisa em português.
- source_word: ὅπως οἰκοδομήσωσιν
  choice: e construíssem
  rationale: A coordenação com “para que” abrange tanto o transporte quanto a construção e preserva o valor final da oração grega de modo natural em português.
- source_word: μετ’ αὐτοῦ
  choice: com ele
  rationale: μετά com genitivo indica normalmente companhia ou participação conjunta; “com ele” conserva essa relação sem introduzir o sentido não expresso de “para ele”.
- source_word: τὴν πόλιν
  choice: a cidade
  rationale: O substantivo refere-se explicitamente à cidade de Jerusalém; a tradução evita substituí-lo por “templo”.
theological_decisions:
- issue: Escopo da obra indicada por “a cidade”
  choice: a cidade
  alternative: o templo
  rationale: Embora a madeira de cedro do Líbano possa evocar a construção do templo em outros contextos bíblicos, o texto grego declara τὴν πόλιν, “a cidade”. A tradução preserva esse objeto explícito sem harmonização.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Mantém o nome histórico “Cele-Síria”, conserva a referência explícita à cidade e usa uma construção final natural com “para que”.
