base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/036.yaml
  text: All the earth calls truth blessed[a], and heaven blesses her; and all works shake and tremble[b], and with her there is nothing unjust.
translation:
  language: pt
  text: Toda a terra invoca a verdade, e o céu a bendiz; todas as obras[b] se abalam e tremem, e com ela[a] não há nada injusto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz aqui uma forma masculina ou neutra, literalmente “com ele” ou “com isso”, depois das referências femininas à verdade. Pelo contexto, o sentido mais natural é “com a verdade”.
    reason: textual_variant
  - marker: b
    text: Ou “todas as coisas criadas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ἡ γῆ
  choice: Toda a terra
  rationale: Em paralelo com “o céu”, γῆ tem alcance cósmico e universal; “terra” é mais adequado do que “país” ou “solo”.
- source_word: τὴν ἀλήθειαν καλεῖ
  choice: invoca a verdade
  rationale: καλέω com objeto acusativo pode expressar chamar ou invocar. “Invoca” conserva a ação dirigida à verdade sem acrescentar o predicativo “bendita”, que não está expresso no grego.
- source_word: ὁ οὐρανὸς αὐτὴν εὐλογεῖ
  choice: o céu a bendiz
  rationale: “Bendizer” preserva o sentido elevado de εὐλογέω, e o pronome “a” retoma naturalmente o substantivo feminino “verdade”.
- source_word: πάντα τὰ ἔργα
  choice: todas as obras
  rationale: ἔργα significa literalmente “obras”. O contexto cósmico permite entender as coisas criadas, mas a formulação mais aberta evita decidir isso no texto principal.
- source_word: σείεται καὶ τρέμει
  choice: se abalam e tremem
  rationale: Os dois verbos coordenados intensificam a reação. Em português, a concordância plural explicita o sujeito neutro plural grego sem alterar o sentido.
- source_word: μετʼ αὐτοῦ
  choice: com ela
  rationale: Embora o texto transmitido use a forma masculina/neutra αὐτοῦ, o referente contextual mais natural é “a verdade”. “Com ela” mantém a continuidade do discurso, enquanto a irregularidade formal é registrada em nota.
- source_word: ἄδικον οὐθέν
  choice: não há nada injusto
  rationale: A expressão reproduz o sentido literal de ausência de qualquer coisa injusta, sem ampliar para uma formulação doutrinária abstrata.
theological_decisions:
- issue: Personificação da verdade
  choice: Manter a referência feminina por meio de “a” e “ela”
  alternative: Despersonificar como “isso” ou traduzir formalmente αὐτοῦ como “ele/isso”
  rationale: O contexto retórico apresenta a verdade como destinatária da invocação e da bênção. A referência feminina em português é também gramatical, por isso não implica que a verdade seja uma pessoa ou hipóstase distinta.
- issue: Irregularidade de gênero em μετʼ αὐτοῦ
  choice: Relacionar a expressão à verdade no texto principal e registrar a forma grega em nota
  alternative: Traduzir “com ele” ou “com isso” sem identificar o referente
  rationale: A referência contextual à verdade é a leitura mais natural, mas a nota preserva a tensão do texto transmitido em vez de ocultá-la.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe poética moderada. “Invoca” evita introduzir a ideia não expressa de chamar a verdade de bendita; “obras” conserva a amplitude lexical do grego, esclarecida por nota.
