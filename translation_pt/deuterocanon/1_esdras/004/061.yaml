  text: And he took the letters and went out to Babylon[a], and reported to all his brothers.
translation:
  language: pt
  text: Ele pegou as cartas, partiu para a Babilônia e informou a todos os seus irmãos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “comunicou a todos os seus parentes”; o grego diz literalmente “a todos os seus irmãos”.'
    reason: Registra uma alternativa natural para ἀπήγγειλεν e o possível sentido familiar ou comunitário de ἀδελφοῖς, preservando no texto principal a formulação literal “irmãos”.
lexical_decisions:
- source_word: ἔλαβεν
  choice: pegou
  rationale: O aoristo de λαμβάνω descreve a ação de tomar ou receber as cartas; “pegou” preserva a sequência narrativa e a concretude do ato.
- source_word: τὰς ἐπιστολάς
  choice: as cartas
  rationale: ἐπιστολή designa normalmente uma carta ou comunicação escrita; o plural definido é reproduzido diretamente.
- source_word: ἐξῆλθεν εἰς Βαβυλῶνα
  choice: partiu para a Babilônia
  rationale: A expressão indica saída com destino à Babilônia. “Partiu para” conserva a ideia de afastamento de ἐξέρχομαι de modo natural em português.
- source_word: ἀπήγγειλεν
  choice: anunciou
  rationale: ἀπαγγέλλω pode significar anunciar, comunicar ou relatar. “Anunciou” mantém o objeto implícito, como no grego, sem acrescentar “isso”, “tudo” ou “a notícia” ao texto principal.
- source_word: τοῖς ἀδελφοῖς αὐτοῦ πᾶσιν
  choice: a todos os seus irmãos
  rationale: A tradução reproduz πᾶσιν e o masculino plural ἀδελφοῖς. Embora o contexto possa apontar para parentes ou membros do mesmo povo, “irmãos” preserva a formulação explícita do grego.
theological_decisions:
- issue: Sentido comunitário ou étnico de ἀδελφοῖς
  choice: irmãos
  alternative: parentes ou membros do seu povo
  rationale: O texto grego emprega literalmente o masculino plural “irmãos”. O texto principal mantém essa forma, enquanto a nota registra a possível extensão comunitária sem impô-la.
translation_notes:
  register: Português moderno, digno e fluente, com boa legibilidade brasileira. “Partiu para” evita o pouco natural “saiu para” sem perder a nuance de movimento, e “anunciou” conserva a ausência de objeto expresso no grego.
