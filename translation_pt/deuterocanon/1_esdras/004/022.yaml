  text: And when they rise from the wine[a], they do not remember what they did.
translation:
  language: pt
  text: E, quando despertam do vinho[a], não se lembram do que fizeram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «quando se levantam do vinho». A expressão pode referir-se a despertar ou a recuperar-se dos efeitos do vinho.'
    reason: Preserva a expressão elíptica do grego («do vinho») no texto principal e esclarece, sem impor, o sentido contextual e a alternativa para ἐγερθῶσιν.
lexical_decisions:
- source_word: ὅταν
  choice: quando
  rationale: Introduz uma oração temporal de sentido geral; «quando» é natural em português e não força a nuance mais explícita de «sempre que».
- source_word: ἀπὸ τοῦ οἴνου
  choice: dos efeitos do vinho
  rationale: A expressão grega é literalmente «do vinho», mas, ligada a ἐγερθῶσιν, indica despertar ou recuperar-se do estado provocado pelo vinho. A explicitação mínima evita em português a formulação pouco natural «despertam do vinho».
- source_word: ἐγερθῶσιν
  choice: despertam
  rationale: Neste contexto, o verbo se refere plausivelmente a acordar ou recobrar a consciência depois dos efeitos do vinho; «despertam» comunica isso com clareza sem especificar indevidamente embriaguez.
- source_word: οὐ μέμνηται
  choice: não se lembram
  rationale: Embora a forma verbal preservada por Swete esteja no singular, o sujeito contextual é plural; a tradução segue o sentido coletivo/distributivo e a concordância idiomática portuguesa.
- source_word: ἃ ἔπραξαν
  choice: do que fizeram
  rationale: Forma corrente e fiel de traduzir a oração relativa, mantendo a referência aos atos praticados anteriormente.
