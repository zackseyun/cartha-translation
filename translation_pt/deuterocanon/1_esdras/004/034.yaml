base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/034.yaml
  text: Men[a], are not women strong? Great is the earth, and high is heaven, and swift in its course is the sun[b], because it turns in the circle of heaven and again runs back to its own place in one day.
translation:
  language: pt
  text: Homens, não são fortes as mulheres? Grande é a terra, alto é o céu e veloz em seu percurso é o sol[a], pois ele gira no círculo do céu e torna a correr para o seu próprio lugar em um só dia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “veloz em sua corrida”; o grego retrata o sol avançando rapidamente por seu trajeto.'
    reason: lexical_alternative
  - marker: b
    text: O versículo emprega linguagem observacional comum para descrever o movimento diário do sol pelo céu.
    reason: cultural_note
lexical_decisions:
- source_word: Ἄνδρες
  choice: Homens
  rationale: Vocativo plural direto; preserva a forma masculina e o caráter retórico do apelo grego.
- source_word: ἰσχυραὶ
  choice: fortes
  rationale: Equivalente direto e natural para a ideia de força ou poder no argumento comparativo.
- source_word: γυναῖκες
  choice: mulheres
  rationale: Mantém o sentido comum e abrangente do substantivo, sem restringi-lo a 'esposas'.
- source_word: μεγάλη ἡ γῆ
  choice: Grande é a terra
  rationale: Conserva a construção predicativa enfática e o sentido cósmico de γῆ.
- source_word: ὑψηλὸς ὁ οὐρανός
  choice: alto é o céu
  rationale: Reproduz de modo claro e digno a altura atribuída ao céu, sem acrescentar sentido figurado.
- source_word: ταχὺς τῷ δρόμῳ ὁ ἥλιος
  choice: veloz em seu percurso é o sol
  rationale: Expressa a rapidez do movimento e mantém a imagem de um trajeto ou corrida.
- source_word: στρέφεται ἐν τῷ κύκλῳ τοῦ οὐρανοῦ
  choice: gira no círculo do céu
  rationale: Preserva a linguagem cosmológica visual do grego sem convertê-la em terminologia científica moderna.
- source_word: πάλιν ἀποτρέχει
  choice: torna a correr
  rationale: Mantém tanto a ideia de retorno indicada pelo composto quanto a vivacidade do verbo de correr.
- source_word: εἰς τὸν ἑαυτοῦ τόπον
  choice: para o seu próprio lugar
  rationale: Tradução ampla e direta, evitando especificações interpretativas como 'posição' ou 'estação'.
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: em um só dia
  rationale: O numeral pode ter força enfática; 'um só dia' comunica naturalmente que todo o percurso se completa nesse período.
theological_decisions:
- issue: Linguagem cosmológica sobre o movimento do sol
  choice: Manter a descrição observacional de que o sol gira e torna a correr
  alternative: Reformular como movimento aparente do sol segundo categorias astronômicas modernas
  rationale: O texto grego descreve o percurso diário do sol em linguagem comum e visual. A tradução conserva essa perspectiva sem endossá-la como formulação científica nem corrigi-la silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com ordem predicativa marcada para preservar o ritmo retórico do grego. A repetição de “céu” foi mantida por corresponder à formulação da fonte; “torna a correr” conserva a imagem vívida sem soar excessivamente arcaica.
