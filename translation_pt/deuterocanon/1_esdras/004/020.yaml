base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/020.yaml
  text: And it makes all hearts rich[a], and it remembers neither king nor satrap; and it makes everything speak in terms of talents.
translation:
  language: pt
  text: E torna ricos todos os corações, e não se lembra nem de rei nem de sátrapa; e faz todos falarem em talentos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, «talentos» são unidades de peso e de valor monetário, não aptidões naturais. A frase também pode ser entendida como «faz todos falarem de dinheiro» ou «faz todos falarem em grandes somas».
    reason: Esclarece o sentido monetário de τάλαντα e registra alternativas idiomáticas sem impor uma paráfrase ao texto principal.
lexical_decisions:
- source_word: πάσας καρδίας ποιεῖ πλουσίας
  choice: torna ricos todos os corações
  rationale: Preserva a imagem antropológica de καρδία e a construção causativa ποιεῖ + adjetivo, em português natural e solene.
- source_word: οὐ μέμνηται
  choice: não se lembra
  rationale: Mantém a imagem literal de lembrar ou ter em mente, sem reduzir antecipadamente o sentido contextual a «não respeita» ou «não dá atenção».
- source_word: βασιλέα οὐδὲ σατράπην
  choice: nem de rei nem de sátrapa
  rationale: Conserva o título persa específico σατράπης e o colorido histórico da passagem.
- source_word: πάντα
  choice: todos
  rationale: 'Embora a forma grega seja neutra plural e possa ser entendida formalmente como «todas as coisas», o infinitivo λαλεῖν favorece aqui um referente pessoal coletivo: «todos».'
- source_word: διὰ ταλάντων
  choice: em talentos
  rationale: A expressão indica que se fala em valores calculados em talentos, unidade de peso e de valor monetário; a nota impede a leitura moderna de «talentos» como aptidões.
- source_word: ποιεῖ λαλεῖν
  choice: faz ... falarem
  rationale: Reproduz a construção causativa e o paralelismo criado pela repetição de ποιεῖ.
theological_decisions:
- issue: Sujeito implícito dos verbos
  choice: Mantê-lo implícito, como no grego
  alternative: Acrescentar explicitamente «o vinho»
  rationale: O sujeito feminino é recuperado do contexto anterior. O português permite conservá-lo sem inserção explicativa, preservando a coesão e sem acrescentar ao versículo palavras ausentes.
- issue: Referente de πάντα
  choice: 'Entendê-lo como referente pessoal coletivo: «todos»'
  alternative: Traduzir formalmente «todas as coisas» ou «tudo»
  rationale: O ato de falar favorece pessoas como referente prático, mas a possibilidade formal do neutro grego é reconhecida na análise sem transformar a tradução numa formulação pouco natural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela e a imagem dos «corações» foram preservadas; «sátrapa» mantém o contexto histórico persa.
