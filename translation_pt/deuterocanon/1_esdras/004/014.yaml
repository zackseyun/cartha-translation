  text: And he sent out and summoned all the nobles of Persia and Media[a], and the satraps and generals and local rulers and governors[c][b],
translation:
  language: pt
  text: E, tendo enviado[a], convocou todos os nobres da Pérsia e da Média, bem como os sátrapas, os generais, os governantes locais[b] e os altos oficiais[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «tendo enviado», sem declarar quem ou o que foi enviado; pode referir-se ao envio de emissários para fazer a convocação.
    reason: lexical_alternative
  - marker: b
    text: Isto é, governantes de localidades, distritos ou regiões menores.
    reason: cultural_note
  - marker: c
    text: O termo grego também pode ser traduzido como «autoridades supremas» e, em contextos romanos, «cônsules». Aqui indica altos dignitários no contexto administrativo persa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαποστείλας
  choice: depois de enviar emissários
  rationale: O particípio aoristo significa literalmente «tendo enviado». O objeto não está expresso no grego; «emissários» explicita com naturalidade o meio presumido da convocação, enquanto a nota registra essa implicitação.
- source_word: ἐκάλεσεν
  choice: convocou
  rationale: Em contexto régio, «convocou» comunica melhor uma chamada oficial do que «chamou» ou «convidou».
- source_word: μεγιστᾶνας
  choice: nobres
  rationale: Designa personagens de posição elevada ou grandes dignitários. «Nobres» é claro, digno e não especifica indevidamente um título.
- source_word: Περσίδος
  choice: Pérsia
  rationale: Forma geográfica corrente em português.
- source_word: Μηδείας
  choice: Média
  rationale: Nome tradicional da região em português, no contexto do antigo Império Medo-Persa.
- source_word: σατράπας
  choice: sátrapas
  rationale: Preserva o título administrativo persa específico e seu contexto histórico.
- source_word: στρατηγοὺς
  choice: generais
  rationale: Equivalente direto e natural para os chefes militares mencionados na lista.
- source_word: τοπάρχας
  choice: governantes locais
  rationale: Comunica de modo acessível a função de governantes de localidades ou distritos, evitando o tecnicismo pouco conhecido «toparcas» no texto principal.
- source_word: ὑπάτους
  choice: altos oficiais
  rationale: O termo pode designar pessoas de posição suprema e, em ambiente romano, cônsules. «Altos oficiais» preserva a ideia de elevada autoridade sem introduzir anacronicamente um cargo romano específico nem confundi-lo com os governantes locais.
