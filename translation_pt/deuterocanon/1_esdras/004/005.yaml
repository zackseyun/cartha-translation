base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/005.yaml
  text: Let each of us speak one word that will prevail[a]; and whoever’s statement appears wiser than the other’s, Darius the king will give him great gifts and great honors of victory[b],
translation:
  language: pt
  text: Que cada um de nós diga uma palavra que prevalecerá[a]; e aquele cuja declaração parecer mais sábia que a do outro, o rei Dario lhe dará grandes presentes e grandes honras pela vitória[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma declaração” ou “um argumento”. O grego λόγον é conciso e pode se referir à proposição ou ao argumento apresentado na disputa.
    reason: lexical_alternative
  - marker: b
    text: “Honras pela vitória” traduz ἐπινίκια, isto é, honras ou recompensas concedidas a quem vence.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἴπωμεν ἕκαστος ἡμῶν
  choice: Que cada um de nós diga
  rationale: O subjuntivo exortativo na primeira pessoa do plural é expresso naturalmente em português por “Que cada um de nós diga”.
- source_word: ἕνα λόγον
  choice: uma palavra
  rationale: Preserva a forma concisa do grego, embora λόγος possa indicar uma declaração, proposição ou argumento no contexto da disputa; a nota registra essa amplitude.
- source_word: ὃς ὑπερισχύσει
  choice: que prevaleça
  rationale: ὑπερισχύω comunica a ideia de mostrar-se superior ou prevalecer; o subjuntivo português se ajusta à exortação que introduz a proposta.
- source_word: οὗ ἂν φανῇ τὸ ῥῆμα αὐτοῦ σοφώτερον τοῦ ἑτέρου
  choice: aquele cuja declaração parecer mais sábia que a do outro
  rationale: Mantém a avaliação contingente de φανῇ com ἄν e torna explícita, de modo natural, a comparação elíptica entre as declarações.
- source_word: δώσει αὐτῷ Δαρεῖος ὁ βασιλεὺς
  choice: receberá do rei Dario
  rationale: A mudança para a voz ativa centrada no premiado produz português mais fluente sem alterar o agente, o destinatário nem o sentido de concessão.
- source_word: δωρεὰς μεγάλας
  choice: grandes presentes
  rationale: Tradução direta de δωρεά, que designa presentes ou dádivas concedidos pelo rei.
- source_word: ἐπινίκια μεγάλα
  choice: grandes honras pela vitória
  rationale: ἐπινίκια designa honras ou recompensas ligadas à vitória; a expressão preserva essa associação sem limitar o referente a um prêmio material.
