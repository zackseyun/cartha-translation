  text: 'O outro escreveu[a]: “O rei é mais forte.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O rei prevalece”. O verbo grego pode indicar ser mais forte ou prevalecer.'
