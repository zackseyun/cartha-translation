lexical_decisions:
- source_word: ὁ ἕτερος
  choice: O outro
  rationale: O artigo com ἕτερος identifica o outro participante da sequência, isto é, o segundo em contraste com o anterior, sem precisar explicitar o ordinal.
- source_word: ἔγραψεν
  choice: escreveu
  rationale: O aoristo de γράφω descreve de modo direto a ação concluída na sequência narrativa; o pretérito perfeito simples é natural em português.
- source_word: Ὑπερισχύει
  choice: é mais forte
  rationale: ὑπερισχύω pode indicar ser mais forte, superar ou prevalecer. Neste contexto de comparação entre aquilo que detém maior poder, “é mais forte” expressa claramente a afirmação, enquanto a alternativa verbal é preservada em nota.
- source_word: ὁ βασιλεύς
  choice: O rei
  rationale: βασιλεύς designa especificamente o rei, e o artigo definido é preservado, correspondendo à figura apresentada na disputa.
