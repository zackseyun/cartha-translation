base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/009.yaml
  text: And they said[a], “When the king rises, they will give him the writing; and whoever the king and the three nobles of Persia judge that his argument is wiser, to him the victory will be given[b], as it is written.”
translation:
  language: pt
  text: 'E disseram: “Quando o rei se levantar, entregarão a ele o documento[a]; e àquele cujo argumento[b] o rei e os três nobres da Pérsia julgarem mais sábio será dada a vitória, conforme está escrito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o escrito” ou “o texto”, para τὸ γράμμα.
    reason: lexical_alternative
  - marker: b
    text: Ou “declaração”, “discurso” ou “exposição”, para λόγος.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθῇ
  choice: se levantar
  rationale: No contexto, o verbo indica que o rei se levanta, provavelmente do sono ou de seu lugar, sem que seja necessário especificar qual dos dois.
- source_word: τὸ γράμμα
  choice: o documento
  rationale: γράμμα designa aqui algo escrito entregue ao rei para avaliação. “Documento” é natural em português e não sugere uma carta particular.
- source_word: κρίνῃ
  choice: julgarem
  rationale: O verbo expressa uma avaliação que resulta numa decisão; “julgar” preserva a força formal da cena.
- source_word: μεγιστᾶνες
  choice: nobres
  rationale: O termo se refere a dignitários persas de alta posição; “nobres” é claro e corrente em português.
- source_word: ὁ λόγος αὐτοῦ σοφώτερος
  choice: cujo argumento ... mais sábio
  rationale: Neste concurso, λόγος se refere à exposição ou argumentação de cada participante. A formulação mantém o comparativo σοφώτερος sem reduzir λόγος a uma única palavra.
- source_word: τὸ νῖκος
  choice: a vitória
  rationale: νῖκος indica a vitória concedida ao vencedor do concurso.
- source_word: καθὼς γέγραπται
  choice: conforme está escrito
  rationale: A expressão indica aquilo que permanece registrado por escrito e é vertida por uma fórmula portuguesa natural.
