  yaml_path: translation/deuterocanon/1_esdras/004/077.yaml
  text: And he wrote that support should be given to the Levites until the day when the house is completed and Jerusalem is built[a][b].
translation:
  language: pt
  text: E ele escreveu que se desse sustento aos levitas até o dia em que a Casa fosse concluída e Jerusalém fosse edificada[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o templo”, em vez de “a Casa”; o grego diz literalmente “a casa”, forma comum de se referir ao templo neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “Jerusalém fosse reedificada”. O contexto é de restauração, embora o verbo grego diga simplesmente “fosse edificada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: escreveu que
  rationale: Preserva o sentido de uma determinação escrita e introduz naturalmente, em português, o conteúdo expresso pelo infinitivo.
- source_word: δοῦναι
  choice: se desse
  rationale: O infinitivo aoristo depende de ἔγραψεν e exprime o conteúdo da determinação; a construção impessoal com subjuntivo comunica esse valor diretivo sem acrescentar a ideia explícita de ordem.
- source_word: τὴν χορηγίαν
  choice: sustento
  rationale: χορηγία designa provisão ou manutenção destinada a suprir necessidades; “sustento” comunica apoio material contínuo sem especificar indevidamente sua forma.
- source_word: τοῖς Λευείταις
  choice: aos levitas
  rationale: O dativo identifica os beneficiários da provisão.
- source_word: ἕως τῆς ἡμέρας ἧς
  choice: até o dia em que
  rationale: Reproduz de maneira natural a delimitação temporal do grego.
- source_word: ἐπιτελεσθῇ
  choice: fosse concluída
  rationale: O passivo indica que a obra da Casa seria levada à conclusão; o subjuntivo português ajusta-se à referência temporal futura no discurso passado.
- source_word: ὁ οἶκος
  choice: a Casa
  rationale: Mantém o termo grego literal, “casa”, usado neste contexto para o templo; a inicial maiúscula ajuda a sinalizar a referência específica sem substituir o termo por uma interpretação.
- source_word: Ἰερουσαλὴμ οἰκοδομηθῆναι
  choice: Jerusalém fosse edificada
  rationale: Traduz o infinitivo passivo como construção da cidade. “Edificada” preserva o verbo simples do grego, enquanto a possibilidade contextual de “reedificada” é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e legibilidade brasileira. “Casa” preserva a formulação do grego, e “sustento” evita restringir χορηγία a uma modalidade específica de provisão.
