base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/060.yaml
  text: Blessed are you[a], who have given me wisdom; and to you I give thanks[b], Master of the fathers.
translation:
  language: pt
  text: Bendito és tu, que me deste sabedoria; e a ti rendo graças[a], ó Soberano[b] dos pais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «te reconheço», «te confesso» ou «te louvo»; o verbo grego pode indicar reconhecimento ou confissão pública e, nesta oração, provavelmente tem sentido de gratidão.
    reason: lexical_alternative
  - marker: b
    text: Ou «Senhor absoluto» ou «Mestre». O grego emprega δέσποτα, título que destaca autoridade e domínio e é distinto de κύριος («Senhor»).
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογητὸς
  choice: Bendito
  rationale: Mantém a forma tradicional e adequada de bênção doxológica dirigida a Deus, sem interpretá-la simplesmente como «louvado».
- source_word: ὃς ἔδωκάς μοι σοφίαν
  choice: que me deste sabedoria
  rationale: Conserva a oração relativa que qualifica o destinatário e expressa de modo natural em português a ação concluída do aoristo grego.
- source_word: σοφίαν
  choice: sabedoria
  rationale: É o equivalente corrente e semanticamente direto, sem restringir o sentido a mera compreensão.
- source_word: ὁμολογῶ
  choice: rendo graças
  rationale: No contexto de oração, com o pronome no dativo, comunica naturalmente o reconhecimento público e agradecido, enquanto a nota preserva a amplitude lexical do verbo.
- source_word: δέσποτα
  choice: Soberano
  rationale: Expressa autoridade e domínio e preserva a distinção lexical em relação a κύριος, normalmente traduzido por «Senhor».
- source_word: τῶν πατέρων
  choice: dos pais
  rationale: Preserva a forma masculina explícita e não acrescenta o possessivo «nossos», ausente do grego.
theological_decisions:
- issue: Título δέσποτα dirigido a Deus
  choice: Soberano
  alternative: Senhor; Dono; Mestre
  rationale: «Soberano» transmite a autoridade inerente ao termo e evita apagar sua distinção de κύριος. «Dono» seria excessivamente prosaico, e «Mestre» poderia sugerir sobretudo ensino.
- issue: Referência masculina em πατέρων
  choice: dos pais
  alternative: dos antepassados
  rationale: A tradução conserva a expressão masculina do texto e sua provável referência aos patriarcas, sem inserir «nossos».
- issue: Sentido devocional de ὁμολογῶ
  choice: rendo graças
  alternative: confesso; reconheço; louvo
  rationale: O contexto de oração favorece uma expressão de reconhecimento agradecido, mas a nota registra a ambiguidade real do verbo em vez de tratá-la como semanticamente exclusiva.
translation_notes:
  register: Português moderno, digno e acessível, com ordem sintática natural. A interjeição «ó» marca claramente o vocativo. Os títulos e a referência aos «pais» permanecem formais o bastante para o contexto de oração, sem acrescentar elementos ausentes do grego.
