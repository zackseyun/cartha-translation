  text: And to all who guarded the city[a], he wrote that allotments and wages should be given to them.
translation:
  language: pt
  text: E, a todos os que guardavam a cidade, ele escreveu para que lhes fossem dadas porções designadas[a] e soldos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lotes” ou “quinhões”. O termo grego pode indicar partes ou porções atribuídas por sorteio ou distribuição.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρουροῦσι
  choice: que guardavam
  rationale: O particípio de φρουρέω indica guardar, vigiar ou proteger; “que guardavam” conserva o sentido protetivo e soa natural no contexto.
- source_word: τὴν πόλιν
  choice: a cidade
  rationale: Mantém o artigo definido presente no grego.
- source_word: ἔγραψε
  choice: ele escreveu
  rationale: Traduz diretamente o aoristo de γράφω, sem ampliá-lo para “ordenou” ou “decretou”, embora o contexto seja administrativo.
- source_word: δοῦναι αὐτοῖς
  choice: para que lhes fossem dadas
  rationale: Expressa em português natural o conteúdo da instrução escrita e mantém os guardas como destinatários das provisões.
- source_word: κλήρους
  choice: porções designadas
  rationale: κλῆρος pode significar literalmente “lote” e, por extensão, uma parte ou porção atribuída. A escolha evita restringir indevidamente o termo a terrenos, preservando a ideia distributiva.
- source_word: ὀψώνια
  choice: soldos
  rationale: ὀψώνια designa com frequência pagamento militar ou oficial, embora também possa evocar rações ou provisões. “Soldos” comunica com precisão o provável contexto dos guardas da cidade.
