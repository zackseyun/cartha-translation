base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/025.yaml
  text: But the king prevails over them and rules over them[a], and is master over them, and whatever he says to them, they obey.
translation:
  language: pt
  text: Mas o rei é mais forte do que eles, governa sobre eles e é senhor deles; e obedecem a tudo o que lhes diz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «eles o escutam» ou «eles lhe dão ouvidos». O verbo grego está ligado à ideia de ouvir, mas, neste contexto, expressa a resposta obediente à palavra do rei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ βασιλεὺς
  choice: Mas o rei
  rationale: δέ tem aqui leve força adversativa no desenvolvimento do argumento; «Mas» torna essa relação clara e natural.
- source_word: ὑπερισχύει
  choice: é mais forte do que eles
  rationale: O verbo indica superioridade de força ou prevalência. A formulação conserva explicitamente o valor comparativo.
- source_word: κυριεύει αὐτῶν
  choice: governa sobre eles
  rationale: Expressa o exercício de senhorio ou autoridade; «governa sobre» é claro e mantém a regência figurada do grego.
- source_word: δεσπόζει αὐτῶν
  choice: exerce domínio sobre eles
  rationale: Preserva a intensificação em relação a κυριεύει, indicando autoridade de senhor ou domínio efetivo, sem recorrer a uma expressão portuguesa artificial.
- source_word: πᾶν ὃ ἐὰν εἴπῃ αὐτοῖς
  choice: tudo o que lhes ordena
  rationale: No contexto da autoridade real, εἴπῃ tem força pragmática de ordem. A construção portuguesa conserva a abrangência indefinida de πᾶν ὃ ἐάν.
- source_word: ἐνακούουσιν
  choice: eles atendem
  rationale: O verbo pertence ao campo semântico de ouvir, mas neste contexto implica acolher e cumprir a palavra do rei. «Atendem» preserva melhor que «obedecem» a ligação entre ouvir e responder.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A repetição «sobre eles» conserva a ênfase cumulativa do grego, enquanto a variação entre «governa» e «exerce domínio» mantém a distinção entre κυριεύει e δεσπόζει.
