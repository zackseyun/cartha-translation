translation:
  language: pt
  text: Escreveu também sobre o fornecimento e a veste sacerdotal, na qual eles servem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz uma construção pouco natural: «em que ... servem nela» (ἐν τίνι ... ἐν αὐτῇ). O pronome feminino provavelmente se refere à veste sacerdotal, mas a frase pode refletir uma forma textual abreviada ou instável.'
    reason: textual_variant
lexical_decisions:
- source_word: ἔγραψεν
  choice: Escreveu
  rationale: O aoristo de γράφω indica de modo direto o ato de escrever; o contexto pode envolver uma determinação escrita, mas o verbo por si só não exige explicitar «decretou».
- source_word: χορηγίαν
  choice: fornecimento
  rationale: Χορηγία designa aquilo que é fornecido para determinada finalidade. «Fornecimento» mantém o sentido amplo sem especificar indevidamente salário, ração ou subsídio.
- source_word: ἱερατικὴν στολήν
  choice: a veste sacerdotal
  rationale: Στολή é uma veste ou túnica distintiva; «veste sacerdotal» é natural, digna e preserva o singular grego.
- source_word: ἐν τίνι
  choice: na qual
  rationale: A expressão retoma mais naturalmente a veste sacerdotal e conserva a imagem de exercer o serviço vestido nela, sem impor uma reconstrução textual.
- source_word: λατρεύουσιν
  choice: prestam serviço
  rationale: No contexto do templo, λατρεύω indica serviço cultual. «Prestam serviço» comunica a função sacerdotal sem reduzir o termo apenas a adoração nem introduzir terminologia denominacional.
- source_word: ἐν αὐτῇ
  choice: representado na relação «na qual»
  rationale: O pronome feminino remete provavelmente a στολή. Como a sequência grega repete a construção preposicional de maneira pouco natural, a tradução expressa uma só vez a relação e registra a redundância em nota.
theological_decisions:
- issue: Terminologia cultual para λατρεύουσιν
  choice: prestam serviço
  alternative: adoram; exercem o ministério
  rationale: A menção à veste sacerdotal favorece o sentido de serviço cultual. A formulação escolhida evita tanto estreitar o verbo a um ato de adoração quanto importar um uso eclesiástico posterior de «ministério».
- issue: Referente dos pronomes femininos
  choice: A veste sacerdotal como referente provável
  alternative: Manter na tradução uma construção sem referente claro
  rationale: A concordância feminina favorece στολή, também feminina. Contudo, a redação grega é redundante e possivelmente comprimida ou instável; por isso, a incerteza é preservada na nota, sem transformar a probabilidade em certeza textual.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição preposicional do grego foi suavizada no corpo do texto, enquanto sua estranheza e a incerteza do referente foram preservadas explicitamente na nota.
