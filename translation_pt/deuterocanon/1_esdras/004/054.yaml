  naturalness: «Escreveu também sobre o fornecimento e sobre a veste sacerdotal, na qual eles prestam serviço» é português claro, atual e de registro apropriado. A repetição de «sobre» é aceitável, mas dispensável. «Prestam serviço» é compreensível, embora «servem» seja mais idiomático e, neste contexto, possa conservar o sentido de serviço cultual sem introduzir linguagem eclesiástica posterior.
  terminology: «Veste sacerdotal» preserva bem o singular de ἱερατικὴ στολή. «Fornecimento» é uma opção ampla e defensável para χορηγία. «Servem» para λατρεύουσιν mantém a amplitude do verbo, enquanto o contexto sacerdotal orienta sua leitura cultual.
