base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/040.yaml
  text: And in her judgment there is nothing unjust[a]. And hers is the strength and the kingdom and the authority and the majesty of all the ages. Blessed be the God of truth.
translation:
  language: pt
  text: E não há nada injusto no julgamento dela. Dela são a força, o reino, a autoridade e a majestade de todas as eras.[a] Bendito seja o Deus da verdade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de forma mais idiomática, «para todo o sempre»; literalmente, «de todas as eras».
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις
  choice: julgamento
  rationale: Preserva a nuance forense de κρίσις no contexto, com mais precisão que «decisão» e sem transformar a expressão no conceito mais amplo de «justiça».
- source_word: ἄδικον
  choice: injusto
  rationale: Corresponde diretamente ao que não é justo e harmoniza com o contexto judicial criado por «julgamento».
- source_word: ἰσχύς
  choice: força
  rationale: Expressa capacidade ou poder efetivo e mantém distinção lexical em relação a ἐξουσία, traduzido por «autoridade».
- source_word: βασίλειον
  choice: reino
  rationale: É uma forma concisa e natural de expressar o domínio ou poder régio indicado pelo termo nesta enumeração doxológica.
- source_word: ἐξουσία
  choice: autoridade
  rationale: Comunica poder legítimo ou jurisdição e evita confundi-lo com ἰσχύς, «força».
- source_word: μεγαλειότης
  choice: majestade
  rationale: É o equivalente mais natural em uma fórmula de louvor e transmite grandeza exaltada.
- source_word: τῶν πάντων αἰώνων
  choice: de todas as eras
  rationale: Mantém de modo transparente a formulação grega, literalmente «de todas as eras», sem resolver sua força temporal numa paráfrase.
- source_word: εὐλογητός
  choice: Bendito seja
  rationale: Reproduz naturalmente em português a exclamação doxológica de louvor.
- source_word: ὁ θεὸς τῆς ἀληθείας
  choice: o Deus da verdade
  rationale: Preserva a construção genitiva e apresenta Deus como caracterizado pela verdade, sem mudar a expressão para «o Deus verdadeiro».
theological_decisions:
- issue: Referente dos pronomes femininos αὐτῆς e αὕτη
  choice: A verdade, personificada no contexto imediato; por isso, emprega-se «dela».
  alternative: Repetir «verdade» e eliminar os pronomes, tornando a formulação mais abstrata.
  rationale: O grego dá continuidade ao elogio personificado da verdade. «Dela» preserva esse efeito literário e, por ser feminino em português, mantém naturalmente a referência.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção «Dela são» preserva a personificação e dá naturalidade à enumeração. O marcador da nota foi colocado após «de todas as eras», expressão à qual a nota efetivamente se refere.
