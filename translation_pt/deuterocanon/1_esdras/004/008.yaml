  text: And then[a], after each had written his own statement, they sealed them and placed them under the pillow of Darius the king,
translation:
  language: pt
  text: Então, depois que cada um escreveu sua própria declaração, eles as selaram e as colocaram debaixo do travesseiro[a] do rei Dario,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “debaixo do apoio para a cabeça do rei Dario”. O termo grego pode designar um travesseiro ou outro apoio para a cabeça.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca a etapa seguinte da narrativa de modo natural e preserva a sequência temporal.
- source_word: γράψαντες
  choice: depois que ... escreveu
  rationale: O particípio aoristo indica ação anterior aos verbos principais; a construção explicita essa sequência em português corrente.
- source_word: ἕκαστος
  choice: cada um
  rationale: Reproduz com clareza o sentido distributivo.
- source_word: τὸν ἑαυτοῦ λόγον
  choice: sua própria declaração
  rationale: No contexto, λόγος designa o enunciado escrito apresentado por cada participante; “declaração” preserva o caráter proposicional sem pressupor um discurso oral ou um argumento formal.
- source_word: ἐσφραγίσαντο
  choice: eles as selaram
  rationale: O pronome retoma as declarações escritas, objeto implícito no grego, e o verbo preserva a ação de fechar ou autenticar com selo.
- source_word: ἔθηκαν
  choice: as colocaram
  rationale: Verbo narrativo simples, vertido em registro digno e natural.
- source_word: ὑπὸ τὸ προσκεφάλαιον
  choice: debaixo do travesseiro
  rationale: προσκεφάλαιον designa algo destinado a apoiar a cabeça; “travesseiro” é a opção mais natural, enquanto a nota conserva a alternativa “apoio para a cabeça”.
- source_word: Δαρείου τοῦ βασιλέως
  choice: do rei Dario
  rationale: Expressa naturalmente em português a relação genitiva com “travesseiro” e mantém o título real.
