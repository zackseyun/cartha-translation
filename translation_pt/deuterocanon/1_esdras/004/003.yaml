base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/003.yaml
  text: And they ate and drank[a], and when they were filled they departed. But Darius the king went into his bedchamber and slept, and then awoke.
translation:
  language: pt
  text: Eles comeram e beberam e, saciados[a], retiraram-se. O rei Dario, porém, retirou-se para seu quarto, dormiu e depois acordou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «depois de se fartarem»; o termo grego indica que ficaram saciados após comer e beber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάγοσαν καὶ ἐπίοσαν
  choice: comeram e beberam
  rationale: Os aoristos indicam, de modo simples, as duas ações concluídas; a formulação é direta e natural em português.
- source_word: ἐμπλησθέντες
  choice: depois de ficarem satisfeitos
  rationale: O particípio expressa saciedade após a refeição. A escolha preserva a sequência temporal e soa mais natural do que a tradução literal «ficarem cheios».
- source_word: ἀνέλυσαν
  choice: retiraram-se
  rationale: No contexto do fim da refeição, o verbo significa partir ou dispersar-se; «retiraram-se» é conciso e apropriado ao registro narrativo.
- source_word: ἀνέλυσεν εἰς τὸν κοιτῶνα
  choice: retirou-se para seu aposento
  rationale: A repetição de «retirou-se» reflete o uso reiterado do mesmo verbo grego, enquanto «aposento» comunica o cômodo privado destinado ao repouso sem soar excessivamente arcaico.
- source_word: ἐκοιμήθη
  choice: dormiu
  rationale: O aoristo declara simplesmente que o rei dormiu; a tradução evita acrescentar a ideia mais específica de que ele apenas adormeceu.
- source_word: ἔξυπνος ἐγένετο
  choice: depois acordou
  rationale: A expressão significa literalmente «ficou desperto»; «acordou» é o equivalente idiomático em português, e «depois» explicita a progressão narrativa já implícita.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. Conservou-se a repetição de «retirou-se» para refletir a repetição lexical do grego, sem sacrificar a fluidez.
