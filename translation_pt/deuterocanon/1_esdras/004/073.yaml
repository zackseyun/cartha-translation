  yaml_path: translation/deuterocanon/1_esdras/004/073.yaml
  text: and for the building of the temple[a], that twenty talents be given each year until it is built[b];
translation:
  language: pt
  text: e que, para a construção do templo[a], sejam dados vinte talentos a cada ano, até que ele seja construído[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a edificação do santuário”. O grego usa ἱερόν, termo comum para o templo ou seu recinto sagrado.
    reason: lexical_alternative
  - marker: b
    text: O talento era uma grande unidade de peso e, neste contexto, uma medida de valor monetário.
    reason: cultural_note
lexical_decisions:
- source_word: οἰκοδομή
  choice: construção
  rationale: Na expressão εἰς τὴν οἰκοδομὴν, o substantivo indica a obra ou o processo de edificação; “construção” é natural e preciso em português.
- source_word: ἱερόν
  choice: templo
  rationale: ἱερόν pode designar o templo ou seu recinto sagrado; neste contexto de reconstrução, “templo” é a opção padrão mais clara.
- source_word: δοθῆναι
  choice: sejam dados
  rationale: O infinitivo aoristo passivo, ligado ao contexto administrativo do decreto, expressa a determinação de que os recursos sejam concedidos.
- source_word: κατ’ ἐνιαυτόν
  choice: a cada ano
  rationale: A locução tem sentido distributivo e recorrente; “a cada ano” é idiomático e preserva esse valor.
- source_word: τάλαντα εἴκοσι
  choice: vinte talentos
  rationale: Mantém a unidade antiga convencional, que podia funcionar como medida de peso e, neste contexto, de valor monetário.
- source_word: μέχρι τοῦ οἰκοδομηθῆναι
  choice: até que ele seja construído
  rationale: A construção com μέχρι e infinitivo articular marca duração até a conclusão da obra; o pronome retoma naturalmente “templo”.
