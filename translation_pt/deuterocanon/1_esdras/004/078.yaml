  text: And to all who guarded the city[b][a], he wrote to give them allotments and wages.
translation:
  language: pt
  text: E a todos os que guardavam a cidade, ele escreveu que lhes fossem dados lotes[a] e soldos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sortes” ou “porções”. O termo grego pode indicar partes atribuídas, possivelmente por sorteio.
    reason: lexical_alternative
  - marker: b
    text: Ou “pagamentos” ou “provisões”. O termo grego pode designar tanto a remuneração quanto as provisões dadas por um serviço.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρουροῦσι
  choice: guardavam
  rationale: O particípio de φρουρέω indica guardar ou manter vigilância; “guardavam” é natural no contexto da proteção da cidade e preserva o aspecto durativo possível.
- source_word: πόλιν
  choice: cidade
  rationale: πόλις significa normalmente “cidade”, sem indicação contextual que favoreça “povoado” ou “vila”.
- source_word: ἔγραψε
  choice: ele escreveu que
  rationale: Mantém o sentido básico de “escreveu” e introduz de modo idiomático em português o conteúdo da determinação escrita.
- source_word: δοῦναι
  choice: fossem dados
  rationale: O infinitivo depende de ἔγραψε e expressa o conteúdo da instrução. A oração passiva em português explicita naturalmente que os guardas são os beneficiários, sem acrescentar a identidade de quem faria a entrega.
- source_word: κλήρους
  choice: quinhões
  rationale: κλῆρος pode designar sortes, lotes ou porções atribuídas, inclusive por sorteio. “Quinhões” preserva a ideia ampla de partes destinadas aos guardas sem decidir se eram terras ou outra espécie de concessão.
- source_word: ὀψώνια
  choice: soldos
  rationale: ὀψώνια pode indicar provisões ou remuneração por serviço, especialmente militar. Como os destinatários guardavam a cidade, “soldos” comunica de modo conciso a compensação devida, mantendo em nota a alternativa “provisões”.
