base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/049.yaml
  text: And he wrote to all the Jews who were going up from the kingdom to Judea concerning freedom[a], that no official or satrap or toparch or steward should come to their doors[c][b],
translation:
  language: pt
  text: E escreveu a todos os judeus que subiam do reino para a Judeia, a respeito da liberdade, que nenhuma pessoa poderosa[a], sátrapa, toparca[b] nem administrador avançasse contra as portas deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nenhuma autoridade” ou “nenhum homem poderoso”. A expressão grega é difícil e pode referir-se, de modo geral, a qualquer pessoa investida de poder.
    reason: lexical_alternative
  - marker: b
    text: “Toparca” era o governante de uma localidade ou distrito; também se pode traduzir por “governante local”.
    reason: cultural_note
  - marker: c
    text: A expressão “avançar contra as portas deles” provavelmente significa que as autoridades não deveriam importuná-los, invadir seu espaço ou apresentar cobranças em suas casas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: escreveu
  rationale: Traduz diretamente o verbo grego, sem explicitar como decreto aquilo que o texto apenas apresenta como algo escrito.
- source_word: τοῖς ἀναβαίνουσιν
  choice: que subiam
  rationale: Preserva o sentido literal de subir e sua possível ressonância geográfica e cultual na ida para a Judeia.
- source_word: ἀπὸ τῆς βασιλείας
  choice: do reino
  rationale: Mantém o valor direto de βασιλεία; “império” seria uma contextualização mais específica.
- source_word: ὑπὲρ τῆς ἐλευθερίας
  choice: a respeito da liberdade
  rationale: Conserva a formulação ampla do grego, sem definir se a liberdade consiste em isenção, autonomia ou outra concessão.
- source_word: πάντα δυνατὸν
  choice: nenhuma pessoa poderosa
  rationale: Representa o sentido literal provável de alguém que detém poder e, com a negação do infinitivo, formula a proibição naturalmente em português. A dificuldade sintática e a possibilidade de referência genérica a uma autoridade são registradas em nota.
- source_word: σατράπην
  choice: sátrapa
  rationale: Mantém o título administrativo persa específico, já estabelecido em português.
- source_word: τοπάρχην
  choice: toparca
  rationale: Preserva o termo técnico para um governante local ou distrital; a nota esclarece seu sentido.
- source_word: οἰκονόμον
  choice: administrador
  rationale: No contexto de uma lista de autoridades, “administrador” comunica naturalmente a função gerencial de οἰκονόμος sem restringi-la à gestão doméstica.
- source_word: μὴ ἐπελεύσεσθαι ἐπὶ τὰς θύρας αὐτῶν
  choice: avançasse contra as portas deles
  rationale: Preserva tanto a imagem concreta das portas quanto a possível força hostil ou coercitiva de ἐπέρχομαι com ἐπί; a provável implicação idiomática é explicada em nota.
