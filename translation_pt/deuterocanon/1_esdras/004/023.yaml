lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: Ó homens
  rationale: Mantém o vocativo masculino plural e a força direta da interpelação, em registro digno e compreensível.
- source_word: οὐχ ὑπερισχύει
  choice: não é mais forte
  rationale: Expressa de modo natural o sentido de ter força superior ou prevalecer; a negação introduz uma pergunta retórica que espera resposta afirmativa.
- source_word: ὁ οἶνος
  choice: o vinho
  rationale: Equivalente lexical direto e sujeito explícito da pergunta.
- source_word: ὅτι οὕτως ἀναγκάζει ποιεῖν
  choice: já que obriga as pessoas a agir assim
  rationale: Preserva o valor causal de ὅτι, a ideia de coerção em ἀναγκάζει e a referência de οὕτως ao comportamento descrito anteriormente. “As pessoas” explicita em português o objeto humano genérico implícito.
- source_word: καὶ ἐσίγησεν
  choice: Depois ... ele se calou
  rationale: O aoristo assinala que o orador encerrou sua fala; “se calou” é natural em português, e o pronome explicita o sujeito retomado.
- source_word: οὕτως εἴπας
  choice: de dizer isso
  rationale: Traduz naturalmente a construção participial anterior à ação principal; neste contexto, οὕτως remete ao que acaba de ser dito.
