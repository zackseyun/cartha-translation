  text: Men[a], does not wine prevail, since it compels one to act thus? And he fell silent after speaking in this way.
translation:
  language: pt
  text: Ó homens, não prevalece o vinho[a], pois obriga as pessoas a agir assim? Depois de falar assim, ele se calou.
  philosophy: optimal-equivalence
