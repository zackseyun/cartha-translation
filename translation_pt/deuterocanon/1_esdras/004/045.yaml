  yaml_path: translation/deuterocanon/1_esdras/004/045.yaml
  text: and you vowed to rebuild the temple which the Judeans burned when Judea was laid waste by the Chaldeans[a].
translation:
  language: pt
  text: e tu prometeste reconstruir o templo que os judeus incendiaram, quando a Judeia foi devastada pelos caldeus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego: “que os judeus incendiaram”. Esta é uma leitura difícil e difere do relato mais conhecido, segundo o qual o templo foi incendiado pelos caldeus, isto é, pelos babilônios.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὔξω
  choice: prometeste
  rationale: Aqui, εὔχομαι rege um infinitivo de ação e indica um compromisso assumido; “prometeste” é natural e claro em português, sem exigir a formulação mais técnica “fizeste voto”.
- source_word: οἰκοδομῆσαι
  choice: reconstruir
  rationale: Embora o verbo possa significar simplesmente “construir”, o contexto de um templo incendiado implica sua restauração.
- source_word: ναόν
  choice: templo
  rationale: É a designação portuguesa corrente e adequada para o edifício sagrado de Jerusalém neste contexto.
- source_word: ἐνεπύρισαν
  choice: incendiaram
  rationale: Expressa diretamente o ato de atear fogo, sem acrescentar que o edifício tenha sido totalmente consumido.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: É a forma mais natural e amplamente compreensível em português para Ἰουδαῖοι; a difícil atribuição da ação é preservada, sem harmonização.
- source_word: ἐρημώθη
  choice: foi devastada
  rationale: Reproduz de modo corrente a ideia passiva de desolação e ruína expressa pelo aoristo.
- source_word: Χαλδαίων
  choice: caldeus
  rationale: Mantém a designação específica do texto grego, em vez de substituí-la por “babilônios”.
theological_decisions:
- issue: Atribuição histórica do incêndio do templo aos judeus
  choice: 'Mantida a leitura grega: “o templo que os judeus incendiaram”.'
  alternative: “o templo que foi incendiado pelos caldeus” ou “que os babilônios incendiaram”.
  rationale: O texto grego apresentado traz explicitamente οἱ Ἰουδαῖοι como sujeito de ἐνεπύρισαν. A tradução conserva essa leitura difícil, sem corrigi-la com base em relatos históricos paralelos, e informa o leitor em nota.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do grego. “Judeus” favorece a legibilidade ampla no contexto bíblico; “caldeus” preserva o termo da fonte. A nota torna transparente a anomalia histórica sem alterar o texto principal.
