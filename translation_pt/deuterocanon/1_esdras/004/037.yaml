base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/037.yaml
  text: Wine is unjust[a], the king is unjust, women are unjust, and all the sons of men and all their works are unjust—all such things. And there is no truth in them, and in their injustice they will perish.
translation:
  language: pt
  text: Injusto é o vinho, injusto é o rei, injustas são as mulheres, injustos são todos os filhos dos homens[a], e injustas são todas as obras deles — todas as coisas desse tipo. Não há verdade neles, e, em sua injustiça, perecerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os seres humanos”; literalmente, “todos os filhos dos homens”, expressão masculina usada para a humanidade.
    reason: alternativa lexical e esclarecimento de expressão idiomática
lexical_decisions:
- source_word: ἄδικος / ἄδικοι / ἄδικα
  choice: injusto / injustos / injustas
  rationale: Mantém a repetição retórica do grego e expressa a falta de justiça ou retidão sem acrescentar uma conotação doutrinária mais estreita.
- source_word: οἶνος
  choice: vinho
  rationale: Equivalente direto e natural.
- source_word: ὁ βασιλεύς
  choice: o rei
  rationale: Preserva o artigo definido grego e se ajusta ao caráter proverbial da declaração no contexto.
- source_word: αἱ γυναῖκες
  choice: as mulheres
  rationale: É o sentido comum do plural grego; o contexto não exige a tradução mais restrita “esposas”.
- source_word: πάντες οἱ υἱοὶ τῶν ἀνθρώπων
  choice: todos os filhos dos homens
  rationale: Conserva a formulação masculina e idiomática da fonte, enquanto a nota esclarece seu alcance genérico referente à humanidade.
- source_word: πάντα τὰ ἔργα αὐτῶν
  choice: todas as obras deles
  rationale: Tradução direta que abrange tudo o que fazem ou produzem e mantém a referência aos seres humanos mencionados.
- source_word: πάντα τὰ τοιαῦτα
  choice: todas as coisas desse tipo
  rationale: Preserva a força generalizante da expressão grega sem limitar indevidamente seu referente.
- source_word: ἀλήθεια
  choice: verdade
  rationale: Equivalente natural que mantém o contraste conceitual com a injustiça.
- source_word: ἀπολοῦνται
  choice: perecerão
  rationale: Representa adequadamente o futuro médio/passivo de ἀπόλλυμι sem impor a ideia explícita de um agente externo que os destrói.
theological_decisions:
- issue: Expressão antropológica genérica com forma masculina
  choice: todos os filhos dos homens
  alternative: todos os seres humanos
  rationale: A formulação conserva a expressão masculina representativa presente no grego; a nota registra claramente seu sentido idiomático e abrangente.
- issue: Sentido da repetição de ἄδικος
  choice: injusto
  alternative: ímpio
  rationale: “Injusto” comunica a falta de justiça ou retidão aplicável ao vinho, às pessoas e às obras, sem introduzir uma interpretação religiosa mais específica.
- issue: Referente de αὐτοῖς e αὐτῶν em “não há verdade neles” e “em sua injustiça”
  choice: neles / em sua injustiça
  alternative: nessas coisas / por causa da injustiça deles
  rationale: Os pronomes mantêm a amplitude e a possível fluidez do referente plural grego, sem resolver silenciosamente se a afirmação recai sobretudo nas pessoas ou em toda a série mencionada.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A inversão repetida (“Injusto é...”) reproduz a cadência enfática do grego. O travessão sinaliza que “todas as coisas desse tipo” resume ou amplia a lista anterior. O marcador da nota foi colocado junto à expressão a que de fato se refere.
