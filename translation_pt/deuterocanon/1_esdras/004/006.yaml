  yaml_path: translation/deuterocanon/1_esdras/004/006.yaml
  text: and to put on purple[a], and to drink from gold vessels, and to sleep on gold, and a chariot with gold bridles, and a turban of fine linen, and a necklace around the neck[c][b],
translation:
  language: pt
  text: e vestir-se de púrpura, beber em recipientes de ouro[a], dormir sobre ouro[b], ter um carro com arreios de ouro[c], um turbante de linho fino e um colar ao redor do pescoço,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «beber em taças de ouro»; o grego menciona objetos de ouro usados para beber, mas não identifica exatamente o tipo de recipiente.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «dormir sobre ouro». É possível que se trate de uma cama ou de um leito adornado com ouro, mas o grego não emprega a palavra «cama» ou «leito».
    reason: lexical_alternative
  - marker: c
    text: A expressão também pode ser entendida como «um carro com freios de ouro» ou, de modo mais amplo, «um carro com guarnições de ouro».
    reason: lexical_alternative
lexical_decisions:
- source_word: πορφύραν περιβαλέσθαι
  choice: vestir-se de púrpura
  rationale: O infinitivo médio indica colocar sobre si ou vestir, enquanto πορφύρα pode designar tecido ou roupa de púrpura. A formulação preserva a imagem de luxo sem acrescentar explicitamente a ideia de realeza.
- source_word: ἐν χρυσώμασιν πίνειν
  choice: beber em recipientes de ouro
  rationale: χρυσώματα designa objetos de ouro, aqui usados para beber, sem especificar com certeza se eram taças, copos ou outro tipo de recipiente. Em português, «beber em recipientes» expressa naturalmente o instrumento ou vasilha usada.
- source_word: ἐπὶ χρυσῷ καθεύδειν
  choice: dormir sobre ouro
  rationale: A expressão grega é deliberadamente compacta e não traz um substantivo explícito para cama ou leito. A tradução formal preserva essa compressão e evita introduzir um móvel que o texto não nomeia.
- source_word: ἅρμα χρυσοχάλινον
  choice: um carro com arreios de ouro
  rationale: O adjetivo composto liga o ouro ao freio, bridão ou equipamento de condução do carro. «Arreios» é claro e suficientemente amplo para não limitar a referência apenas às rédeas ou ao freio.
- source_word: κίδαριν βυσσίνην
  choice: um turbante de linho fino
  rationale: κίδαρις indica um turbante ou cobertura de cabeça, e βύσσινος, tecido fino de linho ou bisso. «Linho fino» é compreensível e evita o termo técnico pouco conhecido «bisso».
- source_word: μανιάκην περὶ τὸν τράχηλον
  choice: um colar ao redor do pescoço
  rationale: μανιάκη é um ornamento para o pescoço, possivelmente um colar rígido ou torque. «Colar» é o equivalente moderno mais acessível, e a expressão locativa foi mantida.
