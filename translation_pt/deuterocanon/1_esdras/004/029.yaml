base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/029.yaml
  text: They were watching him[a], and Apame, the daughter of the admirable Bartacus, the king’s concubine, sitting at the king’s right hand[b],
translation:
  language: pt
  text: Eles observavam-no e a Apame, filha do admirável[b] Bartaco[a], concubina do rei, sentada à direita do rei,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Bartaco também pode ser transliterado como Bartakes.
    reason: lexical_alternative
  - marker: b
    text: A expressão “o admirável” também pode ser traduzida como “o ilustre” ou “o famoso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθεώρουν
  choice: observavam
  rationale: O imperfeito indica uma ação em andamento; “observavam” preserva esse aspecto sem reduzir o verbo a um simples “viram”.
- source_word: αὐτόν
  choice: a ele
  rationale: Mantém explícito o primeiro objeto masculino do verbo e ajuda a mostrar que καί coordena esse objeto com Apame.
- source_word: Ἀπάμην
  choice: Apame
  rationale: Transliteração portuguesa do nome grego na forma lexical Ἀπάμη.
- source_word: θυγατέρα
  choice: filha
  rationale: Equivalente direto e natural do termo de parentesco.
- source_word: Βαρτάκου
  choice: Bártaco
  rationale: Transliteração adaptada à ortografia e à pronúncia portuguesas, com restituição da forma nominativa do nome.
- source_word: τοῦ θαυμαστοῦ
  choice: o admirável
  rationale: Conserva o epíteto descritivo ligado a Bártaco, sem transformá-lo em título oficial.
- source_word: παλλακήν
  choice: concubina
  rationale: Expressa de modo historicamente adequado a condição de consorte secundária; “amante” introduziria conotações modernas potencialmente enganosas.
- source_word: καθημένην
  choice: que estava sentada
  rationale: Reproduz o particípio presente feminino e deixa claro, em português corrente, que a descrição se refere a Apame.
- source_word: ἐν δεξιᾷ τοῦ βασιλέως
  choice: à direita do rei
  rationale: Forma idiomática e fiel para indicar a posição junto ao lado direito do rei.
theological_decisions:
- issue: Referente e função de τοῦ θαυμαστοῦ
  choice: 'Epíteto descritivo de Bártaco: “Bártaco, o admirável”'
  alternative: “Bártaco, o ilustre” ou “Bártaco, o famoso”
  rationale: O grego associa o adjetivo a Bártaco e não fornece base para tratá-lo como título oficial ou omiti-lo.
- issue: Sujeito não expresso de ἐθεώρουν
  choice: “Eles observavam”, sem identificar quem eram eles
  alternative: Explicitar pelo contexto um grupo, como “os jovens observavam”
  rationale: A forma verbal é terceira pessoa do plural, mas o sujeito não aparece nesta cláusula; especificá-lo importaria informação contextual.
- issue: Coordenação de αὐτόν e Ἀπάμην
  choice: 'Ambos são mantidos como objetos de “observavam”: “a ele e a Apame”'
  alternative: Pontuar “e Apame” como uma oração ou descrição independente
  rationale: Os dois acusativos são coordenados por καί. A tradução conserva essa estrutura, embora a frase continue além do limite do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A vírgula final foi mantida porque o texto grego é sintaticamente contínuo e o versículo termina no meio da frase. Os marcadores foram colocados junto aos termos que efetivamente explicam.
