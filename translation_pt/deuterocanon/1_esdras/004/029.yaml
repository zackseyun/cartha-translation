- from: Eles observavam a ele e a Apame, filha de Bártaco[a], o admirável[b], concubina do rei, que estava sentada à direita do rei,
  to: Eles observavam-no e a Apame, filha do admirável[b] Bartaco[a], concubina do rei, sentada à direita do rei,
  rationale: A revisão substitui a construção menos idiomática «observavam a ele» por «observavam-no», sem alterar a coordenação dos objetos. Ajusta «Bártaco» para «Bartaco», a fim de não impor uma tonicidade divergente da forma grega, e posiciona o epíteto antes do nome, em uma construção portuguesa natural e semanticamente inequívoca. A vírgula final é mantida porque o versículo termina no meio da construção sintática.
