  naturalness: O português é claro, moderno e apropriado ao registro decretal. “Tiverem” é mais direto e idiomático do que “vierem a possuir” neste contexto; a explicitação de “eles” melhora a clareza sintática.
  terminology: “Terra”, “isenta de impostos”, “caldeus” e “aldeias” são escolhas fiéis e naturais. A nota mantém alternativas lexicais legítimas para χώρα e ἀφορολόγητον.
