lexical_decisions:
- source_word: χώραν
  choice: terra
  rationale: No contexto administrativo e territorial, χώρα designa terra ou território; “terra” mantém o alcance amplo sem impor uma divisão política específica.
- source_word: κρατήσουσιν
  choice: vierem a possuir
  rationale: O futuro κρατήσουσιν indica a terra que eles terão em posse ou sob controle; a construção portuguesa preserva esse valor prospectivo.
- source_word: ἀφορολόγητον
  choice: isenta de impostos
  rationale: Expressa diretamente a isenção fiscal ou tributária em linguagem moderna e clara.
- source_word: ὑπάρχειν
  choice: seja
  rationale: No discurso dependente de uma ordem ou decreto, o infinitivo tem força prescritiva; o subjuntivo português comunica isso naturalmente.
- source_word: Χαλδαῖοι
  choice: caldeus
  rationale: Reproduz diretamente o gentílico grego, sem ampliá-lo interpretativamente para “babilônios”.
- source_word: ἀφίουσι
  choice: deixem
  rationale: Aqui ἀφίημι significa deixar, soltar ou abrir mão das aldeias; “deixem” conserva a formulação concisa do texto.
- source_word: κώμας
  choice: aldeias
  rationale: κώμη designa normalmente uma aldeia ou povoado rural; “aldeias” é a correspondência mais transparente.
- source_word: διακρατοῦσιν
  choice: mantêm sob seu domínio
  rationale: O composto indica posse ou controle continuado e enfático; esta expressão comunica isso sem necessariamente caracterizar a situação como ocupação militar.
