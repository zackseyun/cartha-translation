- from: e que toda a terra que eles vierem a possuir lhes seja isenta de impostos[a]; e que os caldeus deixem as aldeias dos judeus que mantêm sob seu domínio;
  to: e que toda a terra que eles tiverem lhes seja isenta de impostos[a]; e que os caldeus deixem as aldeias dos judeus que eles mantêm sob seu domínio;
  rationale: A revisão substitui uma formulação que pode implicar aquisição futura por “que eles tiverem”, expressão que conserva o valor futuro de κρατήσουσιν sem restringir o modo de posse. Também explicita “eles” na segunda oração relativa para deixar inequívoco que os caldeus são os que mantêm as aldeias sob domínio. Mantêm-se o paralelismo prescritivo, a terminologia histórica e a nota lexical.
