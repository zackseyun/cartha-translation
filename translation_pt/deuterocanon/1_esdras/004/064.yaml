  text: Then the king said to him, “Ask for whatever you want beyond what has been written, and we will give it to you, since you have been found wiser; and you shall sit next to me, and you shall be called my kinsman.”
translation:
  language: pt
  text: 'Então o rei lhe disse: “Peça o que quiser além do que está escrito, e nós lhe daremos, visto que você foi considerado mais sábio. Você se sentará ao meu lado e será chamado meu parente.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλείω τῶν γεγραμμένων
  choice: além do que está escrito
  rationale: Reproduz naturalmente a ideia de pedir mais do que aquilo que já havia sido registrado ou estipulado, sem especificar além do grego.
- source_word: ὃν τρόπον εὑρέθης σοφώτερος
  choice: visto que você demonstrou ser mais sábio
  rationale: A expressão passiva εὑρέθης indica que ele foi reconhecido ou comprovado como mais sábio; “demonstrou ser” comunica isso em português corrente.
- source_word: ἐχόμενός μου καθήσῃ
  choice: Você se sentará ao meu lado
  rationale: ἐχόμενος com genitivo exprime proximidade; no contexto de assento e honra, “ao meu lado” é a formulação natural.
- source_word: συγγενής μου
  choice: meu parente
  rationale: Preserva o sentido amplo de parentesco ou pertencimento à parentela real, sem impor um grau específico de relação.
