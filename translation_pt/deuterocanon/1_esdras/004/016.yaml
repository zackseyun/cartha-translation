  yaml_path: translation/deuterocanon/1_esdras/004/016.yaml
  text: 'And they said to them[a], “Report to us about what has been written.” And the first, the one who had spoken about the strength of wine, began and said thus:'
translation:
  language: pt
  text: 'E eles lhes disseram: “Relatem-nos a respeito do que foi escrito.” E o primeiro, aquele que havia falado sobre a força[a] do vinho, começou e disse assim:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o poder do vinho”. A palavra grega pode significar força, poder ou vigor.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπαγγείλατέ
  choice: Relatem-nos
  rationale: O imperativo plural de ἀπαγγέλλω indica comunicar ou apresentar formalmente algo; “relatem-nos” preserva o contexto público sem soar excessivamente técnico.
- source_word: περὶ τῶν γεγραμμένων
  choice: o que foi escrito
  rationale: A expressão se refere ao conteúdo que ficou registrado por escrito. Em português, o objeto de “relatar” dispensa a reprodução explícita de περί, sem perda do sentido de referência ao texto escrito.
- source_word: ὁ πρῶτος ὁ εἴπας
  choice: o primeiro, aquele que havia falado
  rationale: A repetição articulada do grego identifica de modo enfático o primeiro participante e remete à sua declaração anterior; “havia falado” deixa clara essa anterioridade.
- source_word: περὶ τῆς ἰσχύος τοῦ οἴνου
  choice: sobre a força do vinho
  rationale: ἰσχύς pode indicar força, poder ou capacidade. “Força” é direta e natural no contexto da comparação, enquanto a nota preserva a alternativa lexical relevante.
- source_word: καὶ ἔφη οὕτως
  choice: e disse assim
  rationale: Mantém a fórmula narrativa que introduz o discurso subsequente e representa explicitamente οὕτως.
