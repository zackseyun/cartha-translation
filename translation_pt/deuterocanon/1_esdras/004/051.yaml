  text: and for the building of the temple[b][a], that twenty talents be given each year until it is built.
translation:
  language: pt
  text: e que, para a construção do templo[b], fossem dados vinte talentos[a] por ano, até que ele fosse construído.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O talento era uma grande unidade antiga de peso, usada com frequência para metais preciosos e para calcular valores monetários.
    reason: cultural_note
  - marker: b
    text: 'Ou: “para a edificação do templo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομήν
  choice: construção
  rationale: O substantivo designa o ato ou projeto de construir; “construção” é natural em português e se ajusta ao contexto administrativo.
- source_word: ἱεροῦ
  choice: templo
  rationale: Neste contexto de restauração, ἱερόν se refere ao templo ou recinto sagrado; “templo” é a forma mais clara e corrente.
- source_word: δοθῆναι
  choice: fossem dados
  rationale: O infinitivo aoristo passivo indica a concessão dos recursos; o subjuntivo em português preserva a formulação administrativa dependente do contexto.
- source_word: κατʼ ἐνιαυτόν
  choice: por ano
  rationale: A expressão indica recorrência anual; “por ano” é clara, atual e concisa.
- source_word: τάλαντα εἴκοσι
  choice: vinte talentos
  rationale: τάλαντον era uma grande unidade antiga de peso e, por extensão, de avaliação monetária; conserva-se o termo tradicional com explicação em nota.
- source_word: μέχρι τοῦ οἰκοδομηθῆναι
  choice: até que ele fosse construído
  rationale: A construção marca a duração até a conclusão da obra; o pronome retoma naturalmente “templo”, sem acrescentar detalhes ausentes do grego.
