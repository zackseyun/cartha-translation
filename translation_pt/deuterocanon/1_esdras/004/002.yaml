lexical_decisions:
- source_word: σατράπαις
  choice: sátrapas
  rationale: Preserva o título administrativo persa específico e sua relação lexical com «satrapias» no fim do versículo.
- source_word: στρατηγοῖς
  choice: generais
  rationale: Expressa de modo natural o sentido básico de comandantes militares e os distingue das demais autoridades enumeradas.
- source_word: τοπάρχαις
  choice: governantes locais
  rationale: Comunica com clareza que eram autoridades de regiões ou distritos menores, sem recorrer ao tecnicismo pouco conhecido «toparcas».
- source_word: τοῖς ὑπʼ αὐτὸν
  choice: que estavam sob sua autoridade
  rationale: Torna explícita, em português natural, a subordinação política indicada pela expressão grega, sem especificar além do texto.
- source_word: ἀπὸ τῆς Ἰνδικῆς μέχρι Αἰθιοπίας
  choice: desde a Índia até a Etiópia
  rationale: Reproduz naturalmente a fórmula geográfica que indica a extensão do império.
- source_word: ἐν ταῖς ἑκατὸν εἴκοσι ἑπτὰ σατραπείαις
  choice: nas cento e vinte e sete satrapias
  rationale: Mantém o termo administrativo persa e o vínculo lexical com «sátrapas»; «nas» reflete de modo conciso o grego ἐν.
