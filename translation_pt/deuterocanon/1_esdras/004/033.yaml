  text: Then the king and the nobles looked at one another[a], and he began to speak about the truth.
translation:
  language: pt
  text: Então o rei e os dignitários[a] olharam uns para os outros, e ele começou a falar sobre a verdade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os nobres” ou “os grandes homens”. O termo grego se refere a figuras de alta posição na corte.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγιστᾶνες
  choice: dignitários
  rationale: Designa figuras de alta posição junto à corte. “Dignitários” é claro em português atual e preserva o status elevado sem pressupor necessariamente nobreza hereditária.
- source_word: ἔβλεπον
  choice: olharam
  rationale: O pretérito perfeito é natural na progressão narrativa em português; o valor durativo do imperfeito grego não precisa ser explicitado neste contexto.
- source_word: εἷς τὸν ἕτερον
  choice: uns para os outros
  rationale: Expressão recíproca idiomática em português, adequada ao sujeito plural composto.
- source_word: ἤρξατο λαλεῖν
  choice: começou a falar
  rationale: Reproduz de modo direto e natural a construção ingressiva grega.
- source_word: περὶ τῆς ἀληθείας
  choice: sobre a verdade
  rationale: O artigo grego favorece a referência definida a “a verdade”, tema que passa a ser tratado no discurso.
