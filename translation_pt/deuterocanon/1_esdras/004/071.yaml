base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/071.yaml
  text: And he wrote to all the Jews who were going up from the kingdom to Judea concerning their freedom[a], that no official, satrap, governor, or steward should come against their doors[b],
translation:
  language: pt
  text: E ele escreveu a todos os judeus que subiam do reino para a Judeia acerca da liberdade deles[a], determinando que nenhuma autoridade, sátrapa, governador de distrito ou administrador viesse contra as portas deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da isenção deles” ou “da sua condição de livres”. O grego emprega a palavra comum para “liberdade”, mas, neste contexto administrativo, ela pode indicar um privilégio legal ou uma imunidade.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “viesse contra as portas deles”. É provável que isso proibisse as autoridades de invadir suas casas ou de ir até elas para lhes impor cobranças ou outras exigências.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: escreveu
  rationale: Traduz diretamente o aoristo de γράφω; o caráter administrativo do escrito decorre do contexto, sem transformar o verbo em “decretou”.
- source_word: τοῖς ἀναβαίνουσιν
  choice: que subiam
  rationale: Preserva o sentido literal e o idioma geográfico de subir para a Judeia, sem reduzir a expressão a “voltavam”.
- source_word: τῆς βασιλείας
  choice: do reino
  rationale: βασιλεία designa o domínio do rei; “reino” é a equivalência direta, embora o contexto seja o império persa.
- source_word: ὑπὲρ τῆς ἐλευθερίας
  choice: acerca da liberdade deles
  rationale: Mantém o valor lexical de ἐλευθερία e toma ὑπέρ com o genitivo como indicação do assunto do escrito; a nota registra a possível nuance jurídica de isenção ou imunidade.
- source_word: πάντα δυνατὸν
  choice: nenhuma autoridade
  rationale: A expressão grega, literalmente ligada a toda pessoa poderosa, integra uma lista administrativa. “Autoridade” é clara em português e não acrescenta um cargo específico.
- source_word: σατράπην
  choice: sátrapa
  rationale: Conserva o título administrativo persa historicamente específico e reconhecível em português.
- source_word: τοπάρχην
  choice: governador de distrito
  rationale: Explicita de modo acessível o governante de uma localidade ou distrito, evitando o raro tecnicismo “toparca”.
- source_word: οἰκονόμον
  choice: administrador
  rationale: No contexto da lista de agentes públicos, “administrador” comunica melhor a função de gestão do que o possível, mas menos claro, “mordomo”.
- source_word: μὴ ἐπελεύσεσθαι ἐπὶ τὰς θύρας αὐτῶν
  choice: ordenando que ... fosse contra as portas deles
  rationale: O infinitivo expressa o conteúdo da determinação. A formulação conserva a imagem literal e a possível força hostil de ἐπέρχομαι, deixando a provável implicação administrativa para a nota.
theological_decisions:
- issue: Sentido administrativo de ἐλευθερία no decreto real
  choice: liberdade
  alternative: isenção ou imunidade
  rationale: A passagem trata de proteção ou privilégio civil concedido aos judeus que subiam à Judeia, não diretamente de liberdade espiritual. O texto mantém o termo amplo do grego, e a nota apresenta a possível acepção jurídica sem a impor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se o idioma bíblico-geográfico “subiam” e o título histórico “sátrapa”; “governador de distrito” e “administrador” tornam a lista administrativa clara sem apagar sua especificidade.
