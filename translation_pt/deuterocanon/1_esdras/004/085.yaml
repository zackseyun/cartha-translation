  text: to go up and rebuild Jerusalem and the temple on which his name had been called; and they celebrated with music and joy for seven days.
translation:
  language: pt
  text: subir e reconstruir Jerusalém e o templo sobre o qual o seu nome tinha sido invocado[a]; e celebraram com música e alegria durante sete dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «que levava o seu nome» ou «sobre o qual o seu nome havia sido chamado». O grego reflete uma fórmula semítica relativa ao templo, que expressa a reivindicação de Deus sobre ele e sua associação com ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβῆναι
  choice: subir
  rationale: Preserva o sentido básico do infinitivo grego e a maneira tradicional de falar da viagem a Jerusalém, sem explicitar além do texto a ideia de retorno do exílio.
- source_word: οἰκοδομῆσαι
  choice: reconstruir
  rationale: Embora o verbo possa significar simplesmente «construir», o contexto é o restabelecimento de Jerusalém e do templo depois da devastação.
- source_word: ἱερὸν
  choice: templo
  rationale: Neste contexto, refere-se ao complexo do templo de Jerusalém; «templo» é a forma corrente e clara em português.
- source_word: οὗ ὠνομάσθη τὸ ὄνομα αὐτοῦ ἐπ’ αὐτῷ
  choice: sobre o qual o seu nome tinha sido invocado
  rationale: Mantém a forma e a tensão da expressão semítica de pertença e associação divina, em português compreensível, sem reduzi-la a uma paráfrase interpretativa.
- source_word: ἐκωθωνίζοντο
  choice: celebraram
  rationale: O verbo raro indica celebração festiva; «celebraram» comunica o sentido com naturalidade e combina com a música e a alegria mencionadas.
- source_word: μουσικῶν
  choice: com música
  rationale: O plural genitivo pode indicar música, músicos ou acompanhamento musical. «Com música» preserva essa relativa abertura sem especificar os executantes.
- source_word: χαρᾶς
  choice: alegria
  rationale: Equivalente direto, natural e corrente no registro bíblico moderno.
- source_word: ἡμέρας ἑπτά
  choice: durante sete dias
  rationale: Expressa de modo idiomático em português a duração indicada pelo acusativo grego.
theological_decisions:
- issue: Fórmula do nome divino aplicada ao templo
  choice: sobre o qual o seu nome tinha sido invocado
  alternative: que levava o seu nome; sobre o qual o seu nome havia sido chamado
  rationale: A formulação conserva a linguagem bíblica que expressa a reivindicação, presença e associação de Deus com o templo, sem escolher uma única explicação teológica para a expressão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva-se «subir» como linguagem geográfica e bíblica ligada a Jerusalém. A formulação menos comum «o seu nome tinha sido invocado» foi mantida no texto para preservar o idioma teológico da fonte, com alternativas esclarecidas em nota.
