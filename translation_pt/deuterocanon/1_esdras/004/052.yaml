translation:
  language: pt
  text: e que, sobre o altar, oferecessem holocaustos todos os dias[a], conforme a ordem que têm de oferecer dezessete, e outros dez talentos por ano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego deste versículo é difícil e parece estar condensado em vários pontos, sobretudo no verbo traduzido por “oferecessem” e na frase sobre “outros dez talentos por ano”. A tradução procura transmitir o sentido principal do texto grego preservado, sem afirmar certeza sobre todos os detalhes.
    reason: textual_variant
lexical_decisions:
- source_word: θυσιαστήριον
  choice: altar
  rationale: É o termo cultual comum para o lugar onde se apresentam sacrifícios; “altar” é natural e preciso em português.
- source_word: ὁλοκαυτώματα
  choice: holocaustos
  rationale: Designa sacrifícios inteiramente consumidos pelo fogo. “Holocaustos” é o equivalente bíblico consagrado e mantém a concisão do grego.
- source_word: καρποῦσθαι
  choice: oferecessem
  rationale: O verbo transmitido é incomum neste contexto e pode significar literalmente obter fruto ou proveito; no contexto sacrificial, “oferecessem” comunica o sentido provável sem produzir uma formulação enganosa.
- source_word: καθʼ ἡμέραν
  choice: todos os dias
  rationale: Expressa com clareza e naturalidade o valor distributivo da locução grega.
- source_word: ἐντολήν
  choice: mandamento
  rationale: Preserva a força de uma determinação autorizada e se ajusta ao registro bíblico sem soar excessivamente técnico.
- source_word: ἑπτὰ καὶ δέκα
  choice: dezessete
  rationale: É a forma numérica idiomática no português brasileiro e corresponde diretamente a “sete e dez” no grego.
- source_word: προσφέρειν
  choice: oferecer
  rationale: É o verbo cultual natural para apresentar sacrifícios ou contribuições e conserva a ligação com a ação mencionada anteriormente.
- source_word: ἄλλα τάλαντα, δέκα κατʼ ἐνιαυτόν
  choice: e outros dez talentos por ano
  rationale: Reproduz o valor aditivo de ἄλλα e mantém “talentos” como unidade de peso ou valor, sem especificar indevidamente sua natureza; a construção grega permanece textualmente difícil.
