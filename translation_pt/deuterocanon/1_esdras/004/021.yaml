  text: and they do not remember[a], while they are drinking, to show affection to friends and brothers, and before long they draw swords.
translation:
  language: pt
  text: E, quando bebem, não se lembram de demonstrar afeto[a] aos amigos e irmãos e, pouco depois, desembainham espadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “agir amigavelmente com amigos e irmãos”. O verbo grego pode indicar comportamento afetuoso ou amigável em sentido amplo, não apenas um gesto literal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέμνηται
  choice: não se lembram
  rationale: Embora a forma grega esteja no singular, os verbos seguintes estão no plural e o contexto apresenta uma afirmação geral sobre os que bebem. O plural produz português natural sem impor um referente singular incerto.
- source_word: ὅταν πίνωσιν
  choice: quando bebem
  rationale: ὅταν com o subjuntivo expressa uma circunstância indefinida ou recorrente; “quando bebem” preserva esse valor de modo claro e natural.
- source_word: φιλιάζειν
  choice: demonstrar afeto
  rationale: O verbo descreve comportamento afetuoso ou amigável. A escolha mantém a amplitude do grego sem restringi-lo a um gesto literal, como beijar.
- source_word: φίλοις καὶ ἀδελφοῖς
  choice: aos amigos e irmãos
  rationale: Reproduz diretamente os dois grupos relacionais indicados pelos substantivos masculinos plurais gregos.
- source_word: μετʼ οὐ πολὺ
  choice: pouco depois
  rationale: Equivalente idiomático e conciso para o curto intervalo indicado pela expressão grega.
- source_word: σπῶνται μαχαίρας
  choice: desembainham espadas
  rationale: σπάω com μαχαίρας descreve sacar armas; “desembainham espadas” é preciso, corrente e mantém a imagem concreta.
