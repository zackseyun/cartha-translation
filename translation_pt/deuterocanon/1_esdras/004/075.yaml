base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/075.yaml
  text: And to all who go up from Babylonia to build the city[a], freedom is to belong to them and to their children[b], and to all the priests who go up.
translation:
  language: pt
  text: E que todos os que subirem da Babilônia[a] para construir a cidade tenham liberdade[b], tanto eles como seus filhos, bem como todos os sacerdotes que subirem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega o nome da região da Babilônia, não especificamente o nome da cidade.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “que a liberdade pertença a eles”. O alcance jurídico exato dessa liberdade não é especificado.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσιν τοῖς προσβαίνουσιν
  choice: todos os que subirem
  rationale: O particípio com πᾶσιν tem sentido distributivo. “Subirem” preserva a linguagem geográfica tradicional da subida a Jerusalém e se ajusta ao contexto do retorno do exílio.
- source_word: ἀπὸ τῆς Βαβυλωνίας
  choice: da Babilônia
  rationale: Βαβυλωνία é o nome da região. Em português, “Babilônia” pode designar naturalmente tanto a cidade como a região; a nota esclarece a precisão do grego.
- source_word: κτίσαι τὴν πόλιν
  choice: para construir a cidade
  rationale: κτίζω pode significar fundar, estabelecer ou construir. “Construir” segue a formulação do grego sem explicitar “reconstruir”, embora isso seja plausível no contexto.
- source_word: ὑπάρχειν τὴν ἐλευθερίαν
  choice: tenham liberdade
  rationale: A construção infinitiva apresenta o conteúdo do decreto. A formulação portuguesa é natural e comunica que a liberdade lhes deve ser concedida, sem definir sua natureza jurídica.
- source_word: ἐλευθερίαν
  choice: liberdade
  rationale: É o equivalente amplo e corrente de ἐλευθερία. Evita restringir o termo a isenção tributária ou imunidade cívica, sentidos possíveis, mas não especificados no versículo.
- source_word: αὐτοῖς τε καὶ τοῖς τέκνοις αὐτῶν
  choice: tanto eles como seus filhos
  rationale: A expressão identifica os beneficiários da liberdade. “Filhos” traduz τέκνα sem impor gênero ou uma definição mais específica de descendência.
- source_word: καὶ πᾶσι τοῖς ἱερεῦσι τοῖς προσβαίνουσιν
  choice: bem como todos os sacerdotes que subirem
  rationale: A formulação estende a mesma concessão aos sacerdotes. A repetição de “subirem” conserva o paralelismo do grego.
theological_decisions:
- issue: Natureza da ἐλευθερία concedida
  choice: Traduzir de modo amplo como “liberdade”, sem definir o privilégio legal exato.
  alternative: Traduzir como “isenção”, “imunidade” ou outra liberdade cívica específica.
  rationale: O versículo afirma a concessão de ἐλευθερία, mas não delimita seu alcance administrativo. A opção ampla preserva a ambiguidade da fonte e evita introduzir uma interpretação jurídica ou doutrinária não expressa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura foi ajustada à sintaxe natural do português, preservando a linguagem bíblico-geográfica de “subir” a Jerusalém e a indefinição do termo jurídico “liberdade”.
