base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/053.yaml
  text: And for all who go up from Babylonia to build the city[a], there shall be freedom for them and for their children, and for all the priests who go up.
translation:
  language: pt
  text: E que todos os que sobem da Babilônia para construir a cidade — eles e seus filhos —, bem como todos os sacerdotes que sobem, tenham liberdade[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “liberdade”; neste contexto de decreto real, o termo pode incluir privilégios legais ou isenção de certas obrigações, embora o grego não defina seu alcance exato.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσβαίνουσιν
  choice: sobem
  rationale: No contexto do retorno do exílio, o verbo conserva a ideia tradicional de subir para Jerusalém, com sua dimensão geográfica e religiosa.
- source_word: ἀπὸ τῆς Βαβυλωνίας
  choice: da Babilônia
  rationale: Βαβυλωνία designa a região da Babilônia; em português, “Babilônia” pode nomear naturalmente tanto a cidade quanto a região, sem tornar a frase pesada.
- source_word: κτίσαι τὴν πόλιν
  choice: para construir a cidade
  rationale: Embora o contexto seja de restauração, o grego diz literalmente “construir”, não explicita “reconstruir”; a tradução evita acrescentar essa especificação.
- source_word: ὑπάρχειν τὴν ἐλευθερίαν
  choice: tenham liberdade
  rationale: A construção infinitiva integra o conteúdo do decreto. “Que ... tenham liberdade” é natural em português e expressa a concessão oficial.
- source_word: ἐλευθερίαν
  choice: liberdade
  rationale: O substantivo tem sentido amplo de liberdade. Neste contexto administrativo, pode abranger privilégios legais ou isenções, mas o texto não define seu alcance.
- source_word: αὐτοῖς τε καὶ τοῖς τέκνοις αὐτῶν
  choice: tanto eles como seus filhos
  rationale: τέκνα significa diretamente “filhos”; “descendentes” ampliaria o alcance explícito do grego.
- source_word: πᾶσι τοῖς ἱερεῦσι τοῖς προσβαίνουσιν
  choice: bem como todos os sacerdotes que sobem
  rationale: A repetição de “sobem” acompanha a estrutura grega e inclui expressamente os sacerdotes na concessão.
