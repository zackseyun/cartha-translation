  text: and it turns every mind to feasting and gladness[b][a], and one remembers no sorrow and no debt.
translation:
  language: pt
  text: e faz toda mente[a] voltar-se para a festa e a alegria, e ninguém se lembra de tristeza alguma nem de dívida alguma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo pensamento”.
    reason: lexical_alternative
  - marker: b
    text: Ou “obrigação alguma”; o grego pode indicar, de modo mais amplo, aquilo que se deve.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαν διάνοιαν
  choice: toda mente
  rationale: διάνοια pode indicar mente, pensamento ou entendimento. “Toda mente” preserva o valor distributivo de πᾶσαν e mantém a formulação próxima do grego, sem especificar além do necessário.
- source_word: μεταστρέφει
  choice: volta
  rationale: O verbo expressa a ideia de virar, mudar ou redirecionar. “Volta ... para” reproduz de modo direto o movimento indicado por μεταστρέφει seguido de εἰς.
- source_word: εἰς εὐωχίαν καὶ εὐφροσύνην
  choice: para a festa e a alegria
  rationale: εὐωχία denota festa, banquete ou desfrute festivo, enquanto εὐφροσύνη denota alegria ou contentamento. A dupla “festa e alegria” é clara, natural e preserva os dois termos.
- source_word: οὐ μέμνηται
  choice: ninguém se lembra
  rationale: O grego emprega um verbo singular sem sujeito expresso, com sentido genérico para a pessoa sob esse efeito. “Ninguém se lembra” comunica naturalmente essa generalização em português.
- source_word: πᾶσαν λύπην
  choice: tristeza alguma
  rationale: Sob a negação, “tristeza alguma” representa de forma idiomática πᾶσαν λύπην. λύπη abrange tristeza, pesar ou aflição.
- source_word: πᾶν ὀφείλημα
  choice: dívida alguma
  rationale: ὀφείλημα designa literalmente uma dívida ou aquilo que se deve. “Dívida” é a opção mais concreta e imediata, enquanto a nota preserva o sentido mais amplo possível.
