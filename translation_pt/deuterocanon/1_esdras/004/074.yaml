base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/074.yaml
  text: and on the altar to offer burnt offerings daily[a], as they have been commanded, to offer seventeen, and another ten talents yearly[c][b];
translation:
  language: pt
  text: 'e, sobre o altar, oferecer diariamente holocaustos[a], conforme lhes foi ordenado: oferecer dezessete[b] e, a cada ano, outros dez talentos[c];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego traduzido por “oferecer” é incomum aqui e pode significar, mais literalmente, “fornecer” ou “suprir” os holocaustos.
    reason: lexical_alternative
  - marker: b
    text: O texto grego não repete explicitamente o que deveria ser oferecido em número de dezessete; provavelmente se refere a itens sacrificiais da exigência diária.
    reason: alternative_reading
  - marker: c
    text: O talento era uma grande unidade de peso, muitas vezes usada para metais preciosos; aqui o texto não especifica o metal.
    reason: cultural_note
lexical_decisions:
- source_word: θυσιαστήριον
  choice: altar
  rationale: Termo cultual comum para o altar de sacrifícios; não é necessário explicitar mais no texto.
- source_word: ὁλοκαυτώματα
  choice: holocaustos
  rationale: Em contexto bíblico, é o termo português tradicional e preciso para ofertas inteiramente consumidas pelo fogo.
- source_word: καρποῦσθαι
  choice: oferecer
  rationale: O verbo é incomum neste contexto e pode sugerir fornecer ou suprir; “oferecer” comunica com naturalidade sua função sacrificial, mantendo a alternativa em nota.
- source_word: καθ’ ἡμέραν
  choice: diariamente
  rationale: Expressa de modo conciso a regularidade diária.
- source_word: καθὰ ἔχουσιν ἐντολήν
  choice: conforme lhes foi ordenado
  rationale: Indica conformidade com uma ordem já estabelecida, em linguagem atual e digna.
- source_word: ἑπτὰ καὶ δέκα
  choice: dezessete
  rationale: Forma numérica idiomática em português; o objeto implícito é preservado como tal e explicado em nota.
- source_word: προσφέρειν
  choice: oferecer
  rationale: Verbo cultual adequado para apresentar ofertas; a repetição é aceitável e evita inserir um objeto não expresso.
- source_word: ἄλλα τάλαντα δέκα
  choice: outros dez talentos
  rationale: Preserva o caráter adicional da quantia sem especificar metal ou valor não declarados.
- source_word: κατ’ ἐνιαυτόν
  choice: a cada ano
  rationale: Equivalente português natural que preserva a periodicidade anual.
