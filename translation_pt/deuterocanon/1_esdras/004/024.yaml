  yaml_path: translation/deuterocanon/1_esdras/004/024.yaml
  text: 'And the second[a], who had spoken about the king’s strength, began to speak: “Men, do not men prevail, ruling over the land and the sea and everything in them?”'
translation:
  language: pt
  text: 'E o segundo, aquele que havia falado sobre a força do rei, começou a falar: “Homens, acaso não prevalecem os seres humanos, dominando a terra, o mar e tudo o que neles existe?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pergunta grega é retórica e espera uma resposta afirmativa: “Sim, prevalecem”.'
    reason: Esclarece a força interrogativa de οὐχ, que pode não ser igualmente evidente para todos os leitores em português.
lexical_decisions:
- source_word: ἤρξατο ... λαλεῖν
  choice: começou a dizer
  rationale: Reproduz de modo natural em português a construção de ἄρχομαι com infinitivo, introduzindo adequadamente o discurso direto.
- source_word: ὁ δεύτερος
  choice: o segundo
  rationale: O ordinal identifica o segundo participante ou orador na sequência, sem necessidade de explicitação adicional.
- source_word: ὁ εἴπας περὶ τῆς ἰσχύος τοῦ βασιλέως
  choice: aquele que havia falado sobre a força do rei
  rationale: O particípio aoristo identifica o orador por sua declaração anterior; o mais-que-perfeito composto deixa clara essa anterioridade, e “força” conserva o sentido concreto de ἰσχύς.
- source_word: Ὦ ἄνδρες
  choice: Homens
  rationale: Mantém o chamado direto e masculino do vocativo grego sem acrescentar a nuance social e cortês de “senhores”.
- source_word: οὐχ ὑπερισχύουσιν οἱ ἄνθρωποι
  choice: acaso não prevalecem os seres humanos
  rationale: “Acaso não” torna clara em português a natureza retórica da pergunta, enquanto “prevalecem” preserva a ideia de superioridade ou predominância sem fornecer um objeto comparativo ausente no grego. “Seres humanos” distingue a humanidade em geral dos homens diretamente interpelados.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν κατακρατοῦντες
  choice: dominando a terra, o mar
  rationale: O gerúndio acompanha a construção participial sem impor explicitamente uma relação causal; “dominando” expressa o exercício de controle indicado por κατακρατέω.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: tudo o que neles existe
  rationale: Expressa com clareza a totalidade do que se encontra na terra e no mar, preservando a referência plural de αὐτοῖς.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leve solenidade adequada ao debate. “Homens” preserva o vocativo masculino específico, enquanto “seres humanos” comunica a afirmação geral sobre a humanidade. O gerúndio mantém aberta a relação circunstancial do particípio grego, sem convertê-la necessariamente em causa.
