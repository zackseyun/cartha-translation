  text: And when the young man went out[a], lifting up his face toward heaven, in the direction of Jerusalem, he blessed the King of heaven[b],
translation:
  language: pt
  text: E, quando o jovem saiu, ergueu o rosto para o céu, voltado para Jerusalém[a], e abençoou o Rei do céu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na direção de Jerusalém”. A expressão grega indica que ele estava orientado para Jerusalém.
    reason: lexical_alternative
  - marker: b
    text: Ou “louvou o Rei do céu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐξῆλθεν
  choice: quando ... saiu
  rationale: Expressa de modo direto a oração temporal e o sentido comum de ἐξέρχομαι, preservando a sequência narrativa.
- source_word: ὁ νεανίσκος
  choice: o jovem
  rationale: Equivalente natural e atual de νεανίσκος, sem acrescentar a ideia não explícita de servo.
- source_word: ἄρας τὸ πρόσωπον
  choice: ergueu o rosto
  rationale: Conserva o gesto físico associado à oração ou ao louvor, em português corrente e digno.
- source_word: εἰς τὸν οὐρανόν
  choice: para o céu
  rationale: No contexto devocional, οὐρανός designa o céu como âmbito divino, e a preposição indica a direção do gesto.
- source_word: ἐναντίον Ἰερουσαλήμ
  choice: voltado para Jerusalém
  rationale: Comunica a orientação espacial para Jerusalém com clareza, sem transformar a expressão em uma fórmula litúrgica técnica.
- source_word: εὐλόγησεν
  choice: bendisse
  rationale: Preserva o idioma bíblico de bendizer a Deus e a amplitude de εὐλογέω; 'louvou' continua sendo uma alternativa contextual possível.
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: o Rei do céu
  rationale: Segue de perto o título grego aplicado a Deus; a inicial maiúscula assinala seu uso titular.
theological_decisions:
- issue: Linguagem devocional dirigida a Deus
  choice: bendisse o Rei do céu
  alternative: louvou o Rei do céu
  rationale: Quando Deus é o objeto, εὐλογέω pode ser entendido como bendizer ou louvar. 'Bendisse' conserva o idioma e a textura bíblicos, enquanto a nota registra a alternativa sem eliminar a tensão lexical.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A construção foi levemente reorganizada para soar natural, sem perder a sequência do grego. O título divino recebe inicial maiúscula. A vírgula final preserva o caráter continuativo do versículo na passagem.
