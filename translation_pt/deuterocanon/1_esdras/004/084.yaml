  text: and they blessed the God of their fathers[a], because he had given them relief and release.
translation:
  language: pt
  text: E bendisseram o Deus de seus pais, porque lhes havia dado alívio e libertação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “descanso e liberdade”. Os termos gregos podem indicar alívio da aflição e soltura ou libertação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλόγησαν
  choice: bendisseram
  rationale: Quando Deus é o objeto, o verbo tem naturalmente o sentido bíblico de bendizer; a escolha preserva o registro escriturístico sem deixar de ser compreensível.
- source_word: τὸν θεὸν τῶν πατέρων αὐτῶν
  choice: o Deus de seus pais
  rationale: Mantém a expressão bíblica tradicional e sua ligação com a fé das gerações anteriores, sem substituí-la por uma paráfrase interpretativa.
- source_word: ἔδωκεν
  choice: havia dado
  rationale: O mais-que-perfeito composto expressa naturalmente em português que a bênção responde a um benefício já concedido; o aoristo grego também permitiria o simples «deu».
- source_word: ἄνεσιν
  choice: alívio
  rationale: Comunica a diminuição de pressão ou aflição sugerida pelo termo, de modo mais claro no português atual do que «descanso» neste contexto.
- source_word: ἄφεσιν
  choice: libertação
  rationale: No par com ἄνεσις e no contexto de livramento histórico, indica soltura ou liberdade, sem impor o sentido teológico específico de perdão.
theological_decisions:
- issue: Sentido de ἄφεσιν em contexto histórico não cultual
  choice: libertação
  alternative: remissão ou perdão
  rationale: Embora o termo possa designar perdão ou remissão em outros contextos, aqui a associação com alívio favorece livramento/libertação. A tradução evita introduzir uma referência à remissão de pecados que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência bíblica natural. «Bendisseram» e «o Deus de seus pais» preservam o registro e as ressonâncias tradicionais; «alívio e libertação» torna claro o sentido provável sem eliminar as alternativas lexicais.
