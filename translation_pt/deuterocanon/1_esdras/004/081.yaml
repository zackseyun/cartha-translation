  yaml_path: translation/deuterocanon/1_esdras/004/081.yaml
  text: From you are victory and wisdom[a], and yours is the glory, and I am your servant.
translation:
  language: pt
  text: De ti vêm a vitória e a sabedoria, tua é a glória, e eu sou teu servo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo da tua casa”. O termo grego designa especificamente um servo pertencente à casa ou que nela serve.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρά σοῦ
  choice: De ti vêm
  rationale: A construção παρά com genitivo indica aqui fonte ou origem. “De ti vêm” expressa naturalmente em português que a vitória e a sabedoria procedem do destinatário.
- source_word: νίκη
  choice: vitória
  rationale: Equivalente direto e corrente do substantivo grego, adequado ao registro elevado da declaração.
- source_word: ἡ σοφία
  choice: sabedoria
  rationale: Tradução usual de σοφία; o contexto não exige um sentido mais restrito, como habilidade ou prudência.
- source_word: σὴ ἡ δόξα
  choice: tua é a glória
  rationale: A formulação preserva a ênfase possessiva do grego e soa natural e dignificada em português.
- source_word: οἰκέτης
  choice: servo
  rationale: Embora οἰκέτης designe especificamente alguém que serve numa casa, “servo” mantém com naturalidade o sentido de pertença e serviço; a especificidade lexical é registrada em nota.
theological_decisions:
- issue: Referente da segunda pessoa
  choice: Manter a declaração em discurso direto sem identificar explicitamente o destinatário.
  alternative: Explicitar que o destinatário é Deus ou o rei da cena narrativa.
  rationale: O grego emprega pronomes de segunda pessoa sem nomear o referente nesta oração. A tradução preserva essa abertura e não resolve além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e dignificado, com leitura natural no Brasil e ampla compreensão internacional. A repetição de “de ti” foi condensada numa coordenação verbal, sem perder a atribuição de ambas as realidades à mesma fonte.
