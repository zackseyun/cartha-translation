  text: and taking the crown from the king’s head and putting it on herself[a]; and she struck the king with her left hand.
translation:
  language: pt
  text: e tirava a coroa da cabeça do rei e a punha sobre si; e batia[a] no rei com a mão esquerda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esbofeteava o rei com a mão esquerda”. O verbo grego pode indicar uma bofetada ou, de modo mais geral, um golpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφαιροῦσαν
  choice: tirava
  rationale: O particípio descreve a ação da mulher no decorrer da cena. “Tirava” expressa com naturalidade a remoção da coroa da cabeça do rei e mantém a ligação sintática com o contexto.
- source_word: διάδημα
  choice: coroa
  rationale: “Coroa” é o equivalente moderno mais claro para o adorno régio; “diadema” seria mais formal, mas menos imediato para o leitor comum.
- source_word: ἐπιτιθοῦσαν αὐτῇ
  choice: a punha sobre si
  rationale: A expressão indica que ela colocava a coroa em si mesma. “Sobre si” preserva o sentido reflexivo sem acrescentar desnecessariamente uma referência explícita à cabeça.
- source_word: ἐράπιζεν
  choice: batia no rei
  rationale: O verbo designa golpear, frequentemente com a mão, e pode referir-se especificamente a uma bofetada. “Batia” preserva a extensão semântica mais ampla; a possibilidade mais específica é registrada em nota.
- source_word: τῇ ἀριστερᾷ
  choice: com a mão esquerda
  rationale: O dativo instrumental indica o membro usado para golpear. A palavra “mão”, implícita no adjetivo grego, é explicitada para produzir português natural e claro.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe contínua adequada ao caráter contextual do versículo. A nota foi colocada junto ao verbo a que se refere, corrigindo a posição incompatível observada na camada inglesa de consulta.
