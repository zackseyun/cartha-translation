  yaml_path: translation/deuterocanon/1_esdras/004/080.yaml
  text: And when the young man went out, lifting up his face toward heaven, facing Jerusalem, he blessed the King of heaven, saying,
translation:
  language: pt
  text: 'E, quando o jovem saiu, ergueu o rosto para o céu, voltado para Jerusalém, e abençoou o Rei do céu, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ νεανίσκος
  choice: o jovem
  rationale: Expressa de modo natural o substantivo grego para um homem jovem, sem acrescentar uma faixa etária precisa.
- source_word: ἄρας τὸ πρόσωπον
  choice: ergueu o rosto
  rationale: Mantém a imagem corporal do grego e acompanha naturalmente o verbo principal em português.
- source_word: ἔναντιον Ἰερουσαλήμ
  choice: voltado para Jerusalém
  rationale: No contexto espacial, comunica a orientação em direção a Jerusalém sem o sentido potencialmente adversativo de «contra».
- source_word: εὐλόγησεν
  choice: bendisse
  rationale: Preserva o sentido cultual de louvar ou pronunciar bênção a Deus, em registro bíblico claro.
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: o Rei do céu
  rationale: Reproduz diretamente o título divino grego, com maiúscula reverencial no título.
theological_decisions:
- issue: Sentido de εὐλογέω quando Deus é o objeto
  choice: bendisse
  alternative: louvou
  rationale: «Bendisse» conserva a formulação tradicional e a amplitude do verbo grego, sem reduzir o ato exclusivamente a louvor.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A expressão «voltado para Jerusalém» preserva a orientação espacial do original e evita uma leitura adversativa. O versículo termina com dois-pontos porque introduz a fala seguinte.
