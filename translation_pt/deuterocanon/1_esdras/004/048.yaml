base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/048.yaml
  text: And he wrote letters to all the governors in Coele-Syria and Phoenicia and to those in Lebanon[a], to bring cedar timber from Lebanon to Jerusalem[b], so that they might build the city with him.
translation:
  language: pt
  text: E escreveu cartas a todos os governadores[a] da Celessíria[b] e da Fenícia, e aos que estavam no Líbano, para transportarem madeira de cedro do Líbano para Jerusalém, a fim de que construíssem com ele a cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chefes de distrito” ou “governantes locais”; em grego, toparcas.
    reason: lexical_alternative
  - marker: b
    text: Celessíria é o nome histórico da região mencionado no texto grego.
    reason: cultural_note
lexical_decisions:
- source_word: τοπάρχαις
  choice: governadores
  rationale: O termo designa autoridades de distritos ou regiões. “Governadores” é claro em português atual, enquanto “toparcas” seria pouco conhecido; a nota conserva alternativas mais literais.
- source_word: ἐν κοίλῃ Συρίᾳ
  choice: da Celessíria
  rationale: A expressão é o nome histórico de uma região. “Celessíria” preserva o topônimo, e a preposição “da” se ajusta naturalmente em português à regência de “governadores”.
- source_word: Φοινίκῃ
  choice: da Fenícia
  rationale: Emprega-se a forma portuguesa consagrada do nome regional, em paralelo sintático com “da Celessíria”.
- source_word: τοῖς ἐν τῷ Λιβάνῳ
  choice: aos que estavam no Líbano
  rationale: O grego não repete um título oficial e deixa o referente genérico. A tradução mantém essa abertura sem identificá-los explicitamente como governadores.
- source_word: μεταφέρειν
  choice: para que transportassem
  rationale: No contexto das cartas, o infinitivo expressa a incumbência dada aos destinatários. A oração finita é natural em português e explicita apenas a relação sintática contextual, sem acrescentar o verbo “ordenar”.
- source_word: ξύλα κέδρινα
  choice: madeira de cedro
  rationale: Expressão portuguesa natural para madeira de construção proveniente de cedros, sem especificar indevidamente tábuas ou toras.
- source_word: ὅπως οἰκοδομήσωσιν
  choice: e construíssem
  rationale: O conjuntivo introduz a finalidade pretendida. Coordená-lo à primeira ação sob “para que” produz português fluente e mantém a força final.
- source_word: μετʼ αὐτοῦ
  choice: com ele
  rationale: Mantém a referência pronominal e a ideia de cooperação, sem identificar além do que o versículo explicita.
- source_word: τὴν πόλιν
  choice: a cidade
  rationale: Traduz diretamente o objeto expresso no grego e evita harmonizá-lo com referências ao templo em tradições paralelas.
theological_decisions:
- issue: Âmbito da obra de reconstrução
  choice: a cidade
  alternative: o templo / a casa de Deus
  rationale: O texto grego traz explicitamente τὴν πόλιν, “a cidade”. A tradução preserva essa leitura, em vez de harmonizá-la com passagens correlatas sobre a reconstrução do templo.
- issue: Referente de “com ele”
  choice: manter o pronome sem explicitação
  alternative: com o rei / com Zorobabel
  rationale: O grego usa apenas αὐτοῦ. Manter “ele” conserva a dependência do contexto e evita resolver silenciosamente o referente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário de alcance internacional. A estrutura foi levemente ajustada para a fluência do português, mas foram preservados o topônimo histórico, a generalidade de “aos que estavam no Líbano”, o pronome ambíguo “ele” e o objeto explícito “a cidade”.
