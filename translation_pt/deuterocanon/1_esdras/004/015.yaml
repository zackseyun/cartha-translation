  text: And he sat in the council chamber[a], and the letter was read before them. And he said, “Call the young men, and they will explain their words.” And they were called, and they entered.
translation:
  language: pt
  text: 'Ele se sentou na sala do conselho[a], e o escrito foi lido diante deles. Então disse: “Chamem os jovens, e eles explicarão suas palavras.” Eles foram chamados e entraram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sala de audiências” ou “tribunal”. O termo grego indica um local oficial de audiência ou deliberação, mas não permite determinar com precisão sua natureza institucional.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθισεν
  choice: se sentou
  rationale: Reproduz de modo direto o aoristo narrativo, sem acrescentar uma ideia cerimonial não expressa no grego.
- source_word: χρηματιστηρίῳ
  choice: sala do conselho
  rationale: Designa um local oficial de audiência ou deliberação. A escolha é natural em português e evita identificar o termo de modo excessivamente específico com um tribunal moderno.
- source_word: ἀνεγνώσθη
  choice: foi lido
  rationale: Mantém a forma passiva e não acrescenta “em voz alta”, embora isso seja provável no contexto.
- source_word: γράμμα
  choice: o escrito
  rationale: Neste contexto, refere-se ao texto escrito apresentado no concurso. “Escrito” preserva a amplitude do termo e evita sugerir necessariamente uma carta enviada a alguém.
- source_word: νεανίσκους
  choice: os jovens
  rationale: Identifica de maneira clara e corrente os jovens do sexo masculino envolvidos na narrativa, sem o tom arcaico de “mancebos”.
- source_word: δηλώσουσιν
  choice: explicarão
  rationale: Expressa o sentido de tornar claro, adequado ao pedido para que os jovens esclareçam o conteúdo de suas declarações.
- source_word: λόγους
  choice: palavras
  rationale: Mantém o sentido amplo do substantivo grego e deixa que o verbo “explicarão” comunique a função argumentativa no contexto.
- source_word: εἰσῆλθοσαν
  choice: entraram
  rationale: Equivalente conciso e natural do aoristo narrativo de εἰσέρχομαι.
