base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/069.yaml
  text: Then King Darius stood up and kissed him, and he wrote letters for him to all the stewards and local rulers and generals and satraps, that they should send him on his way, along with all those with him who were going up to rebuild Jerusalem.
translation:
  language: pt
  text: Então o rei Dario se levantou e o beijou. Depois, escreveu em favor dele cartas a todos os administradores, governantes locais, generais e sátrapas, para que o ajudassem a seguir viagem, tanto ele como todos os que o acompanhavam e subiam para reconstruir Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “construir Jerusalém”.'
    reason: O grego emprega o verbo comum para “construir”; “reconstruir” explicita o sentido contextual sem ocultar a formulação literal.
lexical_decisions:
- source_word: κατεφίλησεν
  choice: o beijou
  rationale: Expressa de modo natural e direto o gesto do rei; o verbo grego pode sugerir um beijo afetuoso, mas o contexto não exige explicitar essa nuance.
- source_word: οἰκονόμους
  choice: administradores
  rationale: Termo amplo e atual para oficiais encarregados da gestão, sem restringir indevidamente sua função a finanças ou propriedades.
- source_word: τοπάρχας
  choice: governantes locais
  rationale: Comunica com clareza o sentido de autoridades que governavam determinadas localidades ou distritos.
- source_word: σατράπας
  choice: sátrapas
  rationale: Mantém o título administrativo persa tradicional e reconhecível em português.
- source_word: προπέμψωσιν
  choice: ajudassem a seguir viagem
  rationale: O verbo indica fazer alguém prosseguir ou acompanhá-lo, muitas vezes fornecendo assistência para a jornada; a formulação evita pressupor apenas uma escolta militar.
- source_word: ἀναβαίνοντας
  choice: subiam
  rationale: Preserva a linguagem geográfica convencional de subir para Jerusalém.
- source_word: οἰκοδομῆσαι
  choice: reconstruir
  rationale: Embora o verbo isoladamente signifique construir, o contexto histórico é o restabelecimento de Jerusalém; a nota preserva a forma literal do grego.
