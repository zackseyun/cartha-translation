  yaml_path: translation/deuterocanon/1_esdras/004/001.yaml
  text: And King Darius made a great banquet for all who were under him[a], and for all his household, and for all the nobles of Media and Persia,
translation:
  language: pt
  text: E o rei Dario deu um grande banquete a todos os que estavam sob sua autoridade, a todos os de sua casa[a] e a todos os nobres da Média e da Pérsia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou seja, as pessoas de sua casa; a expressão pode incluir mais do que a família imediata.
    reason: lexical_scope
lexical_decisions:
- source_word: δοχὴν μεγάλην
  choice: um grande banquete
  rationale: δοχή designa uma recepção ou refeição oferecida a convidados; no contexto régio, “banquete” comunica com naturalidade o caráter formal do evento. μεγάλην indica sua grandeza ou imponência.
- source_word: ἐποίησεν
  choice: deu
  rationale: Embora o verbo signifique literalmente “fez”, em português a combinação idiomática é “dar um banquete”, sem alterar o sentido do grego.
- source_word: τοῖς ὑπʼ αὐτόν
  choice: a todos os que estavam sob sua autoridade
  rationale: A expressão significa literalmente “os que estavam sob ele”. A formulação conserva a relação hierárquica sem restringi-la indevidamente a súditos políticos.
- source_word: τοῖς οἰκογενέσιν αὐτοῦ
  choice: a todos os de sua casa
  rationale: οἰκογενής pode abranger as pessoas vinculadas à casa real, não somente a família imediata. A expressão portuguesa mantém essa amplitude.
- source_word: τοῖς μεγιστᾶσιν
  choice: a todos os nobres
  rationale: O termo se refere a pessoas eminentes ou de alta posição. “Nobres” é claro e adequado ao ambiente da corte, sem reduzi-los apenas a funcionários.
- source_word: τῆς Μηδείας καὶ τῆς Περσίδος
  choice: da Média e da Pérsia
  rationale: São designações geográfico-políticas dependentes de “nobres”; a tradução direta emprega as formas tradicionais em português.
