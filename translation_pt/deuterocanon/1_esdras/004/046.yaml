base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/046.yaml
  text: 'And now this is what I ask[a], lord king, and what I request from you, and this is the greatness that comes from you: therefore I beg that you fulfill the vow which I vowed to the King of heaven to accomplish by your mouth.'
translation:
  language: pt
  text: E agora, isto é o que peço, ó rei, meu senhor, e o que solicito de ti; esta é a grandeza que procede de ti. Suplico, portanto, que cumpras o voto que fizeste ao Rei do céu, de o levar a efeito por tua palavra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “fazer da tua boca”; isto é, levar o voto a efeito mediante a palavra ou ordem pronunciada pelo rei.
    reason: A expressão grega preserva a imagem da boca do rei, mas seu sentido idiomático envolve a eficácia de sua declaração ou decreto.
lexical_decisions:
- source_word: ἀξιῶ
  choice: peço
  rationale: No contexto de uma petição perante o rei, o verbo expressa um pedido, não necessariamente a reivindicação de um direito. “Peço” também mantém um tom natural e respeitoso.
- source_word: κύριε βασιλεῦ
  choice: ó rei, meu senhor
  rationale: A expressão é um vocativo respeitoso dirigido ao monarca humano. Esta formulação soa natural em português e distingue esse tratamento do título divino usado depois.
- source_word: αἰτοῦμαί
  choice: solicito
  rationale: A escolha distingue este verbo de ἀξιῶ e preserva a duplicação retórica dos termos de petição.
- source_word: μεγαλωσύνη ἡ παρὰ σοῦ
  choice: a grandeza que procede de ti
  rationale: Mantém o sentido literal de grandeza ou magnanimidade como favor proveniente do rei, sem limitar o termo a “generosidade”.
- source_word: δέομαι
  choice: suplico
  rationale: Reproduz a intensificação do pedido e o tom solene da linguagem cortesã.
- source_word: ποιήσῃς τὴν εὐχήν
  choice: cumpras o voto
  rationale: Embora εὐχή possa significar oração ou voto, a construção com o verbo cognato ηὔξω favorece aqui o sentido de um compromisso assumido.
- source_word: ἣν ηὔξω
  choice: que fizeste
  rationale: 'ηὔξω é segunda pessoa do singular: o voto foi feito pelo rei a quem se dirige o discurso, e não pelo suplicante. Isso corrige a leitura divergente da camada inglesa.'
- source_word: τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: ao Rei do céu
  rationale: Preserva o título divino e o contraste entre Deus e o rei humano interpelado no início do versículo.
- source_word: ποιῆσαι ἐκ στόματός σου
  choice: realizá-lo por tua própria palavra
  rationale: A expressão grega é literalmente ligada à boca do rei e aponta para a execução do compromisso mediante sua declaração ou ordem. A formulação portuguesa conserva a imagem da palavra régia sem produzir uma construção ininteligível.
theological_decisions:
- issue: Referente de “Rei do céu”
  choice: Título de Deus, distinto do rei humano interpelado
  alternative: Entender a expressão como outra designação do monarca terreno
  rationale: A estrutura do versículo contrapõe claramente o rei terreno, tratado como “meu senhor”, ao Rei do céu, diante de quem o voto foi feito.
- issue: Sujeito de ηὔξω
  choice: O rei humano fez o voto
  alternative: O suplicante fez o voto
  rationale: A forma verbal grega está na segunda pessoa do singular. A tradução mantém essa referência gramatical sem transferir o voto para quem fala.
translation_notes:
  register: Português moderno, solene e acessível, com tratamento cortesão em segunda pessoa do singular para refletir os verbos gregos. “Ó rei, meu senhor” evita a rigidez pouco natural de “senhor rei”. A tradução preserva a repetição dos verbos de petição, a ambiguidade semântica de μεγαλωσύνη e a metáfora da palavra que procede da boca do rei.
