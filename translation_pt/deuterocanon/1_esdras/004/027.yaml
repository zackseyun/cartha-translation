  yaml_path: translation/deuterocanon/1_esdras/004/027.yaml
  text: And many were destroyed and were led astray and sinned because of women[a].
translation:
  language: pt
  text: E muitos foram destruídos, foram desencaminhados e pecaram por causa das mulheres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «por causa das esposas». A palavra grega pode significar tanto «mulheres» como «esposas», conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: muitos
  rationale: Equivalente quantitativo direto e natural, sem intensificação indevida.
- source_word: ἀπώλοντο
  choice: foram destruídos
  rationale: Preserva a força de ἀπόλλυμι e não restringe necessariamente o sentido à morte física, como poderia ocorrer com «pereceram».
- source_word: ἐσφάλησαν
  choice: desviaram-se
  rationale: Expressa de modo corrente o sentido intransitivo de sair do caminho ou cair em erro, adequado ao contexto moral, sem pressupor explicitamente engano por terceiros.
- source_word: ἡμάρτοσαν
  choice: pecaram
  rationale: É o equivalente comum e preciso de ἁμαρτάνω em contexto moral e religioso.
- source_word: διὰ
  choice: por causa de
  rationale: Com acusativo, διά indica aqui causa ou motivo; «por causa de» é direto e idiomático em português.
- source_word: τὰς γυναῖκας
  choice: as mulheres
  rationale: γυναῖκες pode designar mulheres ou esposas. O contexto apresenta uma afirmação genérica, favorecendo o sentido mais amplo «mulheres», enquanto a alternativa é registrada em nota.
theological_decisions:
- issue: A formulação causal pode soar depreciativa em relação às mulheres
  choice: por causa das mulheres
  alternative: por causa das esposas
  rationale: O grego emprega explicitamente διά com acusativo para indicar causa e usa γυναῖκες. A tradução mantém a retórica e a tensão do texto sem suavizá-las nem ampliá-las; a ambiguidade lexical entre «mulheres» e «esposas» é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação concisa reproduz a sequência de três consequências no grego. «Desviaram-se» evita a construção menos natural «foram levados ao erro» e conserva a possibilidade de queda ou desvio moral.
