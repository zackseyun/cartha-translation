base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/018.yaml
  text: It makes the mind of the king and of the orphan one[a], and that of the slave and that of the free, and that of the poor and that of the rich.
translation:
  language: pt
  text: Faz com que seja um só o pensamento do rei e do órfão[a], o do escravo e o do livre, o do pobre e o do rico.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “faz o rei e o órfão pensarem da mesma maneira, assim como o escravo e o livre, o pobre e o rico”.'
    reason: Alternativa idiomática para a construção grega “faz o pensamento... um só”.
lexical_decisions:
- source_word: ποιεῖ
  choice: Faz com que seja
  rationale: Expressa naturalmente em português a ação causativa do presente grego, sem acrescentar um agente ou mecanismo.
- source_word: τὴν διάνοιαν μίαν
  choice: um só o pensamento
  rationale: διάνοια pode indicar mente, pensamento ou disposição; a formulação mantém a ideia predicativa de unidade expressa por μίαν e preserva o paralelismo.
- source_word: βασιλέως
  choice: rei
  rationale: É o sentido comum do termo e conserva o contraste social do texto.
- source_word: ὀρφανοῦ
  choice: órfão
  rationale: Equivalente direto e natural; evita restringir indevidamente o termo a alguém sem pai.
- source_word: οἰκέτου
  choice: escravo
  rationale: Embora possa designar um servo doméstico, o contraste explícito com ἐλευθέρου destaca a condição não livre.
- source_word: ἐλευθέρου
  choice: livre
  rationale: Preserva de modo conciso a oposição jurídica e social a 'escravo'.
- source_word: πένητος
  choice: pobre
  rationale: É o equivalente moderno mais natural para a pessoa de poucos recursos e forma o par esperado com 'rico'.
- source_word: πλουσίου
  choice: rico
  rationale: Reproduz de maneira direta e concisa a oposição a 'pobre'.
theological_decisions:
- issue: Os pares de condições sociais são nivelados pelo antecedente não expresso neste versículo, sem explicação do mecanismo.
  choice: Manter os contrastes sociais e a afirmação de que o pensamento se torna um só, sem explicação teológica adicional.
  alternative: Traduzir de modo mais idiomático como 'faz o rei e o órfão pensarem da mesma maneira'.
  rationale: O grego afirma que a διάνοια dos diferentes grupos se torna μίαν; a redação escolhida preserva essa imagem e não resolve além do texto a natureza dessa unidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo conciso. A formulação principal permanece próxima da estrutura grega; a nota oferece uma leitura mais idiomática.
