  text: and you vowed to rebuild the temple which the Judeans burned when Judea was laid waste by the Chaldeans[a].
translation:
  language: pt
  text: E você fará um voto de reconstruir o templo que os judeus incendiaram, quando a Judeia foi devastada pelos caldeus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego: “que os judeus incendiaram”. Alguns leitores talvez esperem “que os caldeus [ou babilônios] incendiaram”, com base em tradições históricas paralelas, mas o texto grego aqui diz explicitamente “os judeus”.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὔξω
  choice: você fez o voto
  rationale: O aoristo médio de εὔχομαι, neste contexto, indica assumir solenemente um compromisso ou fazer um voto; “fez o voto” é claro e preserva essa força.
- source_word: οἰκοδομῆσαι
  choice: reconstruir
  rationale: Embora o infinitivo signifique literalmente “construir”, o objeto é um templo anteriormente incendiado; “reconstruir” expressa naturalmente a restauração indicada pelo contexto.
- source_word: ναὸν
  choice: templo
  rationale: Aqui, ναός designa o edifício do templo de Jerusalém; “templo” é a forma corrente e inequívoca em português.
- source_word: ἐνεπύρισαν
  choice: incendiaram
  rationale: O verbo significa pôr fogo ou queimar. “Incendiaram” é conciso e não afirma destruição total, como poderia sugerir “queimaram por completo”.
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: Ἰουδαῖοι pode designar os judeus ou habitantes da Judeia. Em português atual, “os judeus” é a forma mais natural e reconhecível; a atribuição explícita do ato no grego é preservada.
- source_word: ἐρημώθη
  choice: foi devastada
  rationale: O passivo exprime que a Judeia foi assolada ou deixada em desolação; “foi devastada” comunica o sentido com naturalidade e dignidade.
- source_word: Χαλδαίων
  choice: caldeus
  rationale: O texto grego nomeia especificamente os caldeus. Mantém-se o termo histórico, em vez da interpretação mais ampla “babilônios”.
theological_decisions:
- issue: Atribuição histórica do incêndio do templo
  choice: Manter “que os judeus incendiaram”, conforme o texto grego.
  alternative: Traduzir de modo impessoal, “que foi incendiado”, ou atribuir o incêndio aos caldeus/babilônios com base em tradições históricas paralelas.
  rationale: O grego disponível traz explicitamente οἱ Ἰουδαῖοι como sujeito de ἐνεπύρισαν. A tradução não corrige silenciosamente essa leitura, mas conserva a tensão histórica e a esclarece em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega-se “você” para tornar explícito o singular de σὺ sem recorrer ao mais solene e regionalmente marcado “tu”. A redação preserva a atribuição difícil presente no grego e evita harmonização histórica silenciosa.
