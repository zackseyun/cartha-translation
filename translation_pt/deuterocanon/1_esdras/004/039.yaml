  yaml_path: translation/deuterocanon/1_esdras/004/039.yaml
  text: and with her there is no partiality or favoritism[a], but she does what is just rather than all that is unjust and wicked; and all approve of her works[b],
translation:
  language: pt
  text: e com ela não há acepção de pessoas nem distinções[a]; pelo contrário, ela faz o que é justo, afastando-se de tudo o que é injusto e perverso[b], e todos aprovam as obras dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega traduzida por “acepção de pessoas” significa literalmente “receber rostos”. “Distinções” também pode ser entendido como “diferenças” ou “preferências”.
    reason: Explica o idiomatismo grego e preserva a amplitude lexical de διάφορα.
  - marker: b
    text: 'Ou: “afastando-se de todos os injustos e perversos”. As formas gregas podem referir-se tanto a coisas e atos quanto a pessoas.'
    reason: Registra a ambiguidade de gênero dos adjetivos substantivados e a força separativa de ἀπό.
lexical_decisions:
- source_word: παρʼ αὐτὴν λαμβάνειν πρόσωπα
  choice: junto dela não há acepção de pessoas
  rationale: A expressão λαμβάνειν πρόσωπα é um idiomatismo relativo a favorecer alguém por sua condição ou identidade. “Acepção de pessoas” é inteligível em português bíblico corrente e preserva o matiz judicial; “junto dela” representa παρʼ αὐτήν e mantém a personificação da verdade.
- source_word: οὐδὲ διάφορα
  choice: nem distinções
  rationale: O neutro plural διάφορα pode indicar diferenças ou distinções. “Nem distinções” conserva essa amplitude e evita reduzir o termo, sem apoio suficiente, a mero favoritismo ou suborno.
- source_word: τὰ δίκαια ποιεῖ
  choice: ela faz o que é justo
  rationale: O neutro plural τὰ δίκαια designa as coisas justas ou corretas. A formulação portuguesa é natural e mantém o sentido ético e judicial.
- source_word: ἀπὸ πάντων τῶν ἀδίκων καὶ πονηρῶν
  choice: apartada de tudo o que é injusto e perverso
  rationale: ἀπό expressa separação ou afastamento. A tradução preserva essa força, enquanto “tudo o que” toma os adjetivos substantivados como coisas ou atos, deixando em nota a possível referência a pessoas.
- source_word: εὐδοκοῦσι τοῖς ἔργοις αὐτῆς
  choice: aprovam as obras dela
  rationale: εὐδοκέω pode expressar agrado ou aprovação. Neste contexto moral e retórico, “aprovam” é claro e natural; “as obras dela” preserva a referência feminina.
theological_decisions:
- issue: Personificação da verdade
  choice: Manter as referências femininas “dela” e “ela”
  alternative: Empregar o pronome impessoal “isso” ou reformular com “a verdade”
  rationale: O antecedente contextual é ἀλήθεια, substantivo feminino personificado. O português permite preservar naturalmente essa personificação sem acrescentar uma identificação doutrinária.
- issue: Alcance de τῶν ἀδίκων καὶ πονηρῶν
  choice: Traduzir no texto como “tudo o que é injusto e perverso” e registrar a alternativa em nota
  alternative: “todos os injustos e perversos”
  rationale: As formas gregas podem ser entendidas como masculinas ou neutras. O contraste imediato com τὰ δίκαια favorece a leitura neutra, mas a ambiguidade morfológica genuína deve ser reconhecida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve ressonância bíblica em “acepção de pessoas”. A ordem e a personificação do grego foram preservadas sem sacrificar a naturalidade. Todos os marcadores de nota aparecem no texto.
