lexical_decisions:
- source_word: εὐλόγησαν
  choice: bendisseram
  rationale: Reproduz de modo natural o sentido de louvar ou declarar bendito, mantendo Deus como objeto direto.
- source_word: τὸν θεὸν τῶν πατέρων αὐτῶν
  choice: o Deus de seus antepassados
  rationale: Mantém a relação expressa pelo genitivo e usa linguagem moderna e inclusiva quanto às gerações anteriores, sem alterar o referente.
- source_word: ἄνεσιν
  choice: alívio
  rationale: Expressa a ideia de desafogo, descanso ou diminuição da aflição no contexto.
- source_word: ἄφεσιν
  choice: libertação
  rationale: Preserva o sentido amplo de soltura, liberação ou dispensa, sem restringi-lo teologicamente a perdão de pecados.
theological_decisions:
- issue: Sentido de ἄφεσις
  choice: libertação
  alternative: perdão; remissão
  rationale: Neste contexto, o termo aparece ao lado de ἄνεσις e provavelmente designa liberação ou concessão de liberdade. A tradução evita introduzir uma referência específica ao perdão dos pecados que o grego não exige.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego sem rigidez. “Antepassados” foi preferido a “pais” para comunicar naturalmente a referência ancestral ao leitor contemporâneo.
