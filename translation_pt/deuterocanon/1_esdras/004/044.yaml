  text: and all the vessels taken from Jerusalem are to be sent back[a], which Cyrus set apart when he vowed to destroy Babylon[b], and vowed to send there.
translation:
  language: pt
  text: e que todos os utensílios levados de Jerusalém, que Ciro separou quando fez voto de destruir Babilônia e fez voto de enviá-los para lá[b], fossem enviados de volta[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «fossem enviados — aqueles que Ciro havia separado, quando decidiu destruir a Babilônia e enviá-los para lá». A construção grega é condensada e um tanto difícil, especialmente nas duas ocorrências de «fez voto».'
    reason: lexical_alternative
  - marker: b
    text: Isto é, os utensílios do templo levados de Jerusalém deveriam ser devolvidos. «Para lá» provavelmente se refere a Jerusalém, embora o grego não a nomeie aqui.
    reason: alternative_reading
lexical_decisions:
- source_word: σκεύη
  choice: utensílios
  rationale: No contexto do templo, designa objetos ou implementos de uso sagrado. «Utensílios» é claro em português moderno sem especificar além do grego.
- source_word: τὰ λημφθέντα
  choice: levados
  rationale: O particípio indica os objetos que haviam sido tirados de Jerusalém; «levados» expressa isso naturalmente sem acrescentar que foram saqueados.
- source_word: ἐκπέμψαι
  choice: fossem enviados de volta
  rationale: Embora o verbo signifique literalmente «enviar», o contexto é o retorno dos utensílios a Jerusalém; «de volta» explicita a direção implícita.
- source_word: ἐχώρισεν
  choice: separou
  rationale: Preserva o sentido básico de distinguir ou pôr à parte, sem transformar a ação em uma designação administrativa explícita.
- source_word: ηὔξατο
  choice: fez voto
  rationale: O verbo pode significar orar ou fazer voto. A construção repetida com infinitivos favorece aqui uma promessa ou compromisso solene, embora a formulação histórica permaneça incomum.
- source_word: ἐκκόψαι
  choice: destruir
  rationale: Literalmente, o verbo pode significar «cortar» ou «eliminar»; tendo Babilônia como objeto, «destruir» comunica de modo natural sua força idiomática.
- source_word: ἐξαποστεῖλαι ἐκεῖ
  choice: enviá-los para lá
  rationale: O objeto está implícito no grego e é retomado em português para clareza. «Para lá» conserva a referência espacial tersa e potencialmente ambígua.
theological_decisions:
- issue: A linguagem repetida de voto e a sintaxe comprimida do texto grego
  choice: Manter «fez voto» nas duas ocorrências e preservar a referência tersa «para lá».
  alternative: Traduzir ηὔξατο por «decidiu» ou «resolveu» e identificar expressamente Jerusalém como destino.
  rationale: A dificuldade é sobretudo textual e lexical, não doutrinária. A opção escolhida preserva a linguagem incomum do grego e não resolve silenciosamente a referência de ἐκεῖ.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção foi mantida próxima do grego, mas com objeto pronominal explícito em «enviá-los». Os dois marcadores de nota aparecem no texto principal.
