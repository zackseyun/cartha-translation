base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/031.yaml
  text: And besides this[a], the king stared at her with his mouth open; and if she laughs at him, he laughs; but if she is offended with him[b], he flatters her so that she may be reconciled to him.
translation:
  language: pt
  text: Além disso, o rei a contemplava de boca aberta[a]; se ela ri para ele[b], ele ri; mas, se ela fica irritada com ele, ele a lisonjeia para que se reconcilie com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «abrindo a boca, olhava para ela».
    reason: lexical_alternative
  - marker: b
    text: O dativo grego também pode ser entendido como «ri com ele» ou «ri dele».
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς τούτοις
  choice: Além disso
  rationale: Conector aditivo natural em português, que introduz mais um exemplo no argumento.
- source_word: χάσκων τὸ στόμα
  choice: de boca aberta
  rationale: Preserva de modo claro e natural a imagem vívida do rei olhando para ela boquiaberto.
- source_word: ἐθεώρει αὐτήν
  choice: a contemplava
  rationale: O imperfeito indica uma ação contínua; no contexto, «contemplava» comunica um olhar prolongado e absorto sem exagerar o sentido do verbo.
- source_word: ἐὰν γελάσῃ αὐτῷ, γελᾷ
  choice: se ela ri para ele, ele ri
  rationale: Mantém a repetição de γελάω e usa «para ele» como formulação contextualmente favorável, sem ocultar a amplitude possível do dativo grego, registrada em nota.
- source_word: πικρανθῇ ἐπʼ αὐτόν
  choice: fica irritada com ele
  rationale: Expressa em linguagem corrente a mudança para um estado de amargura, desagrado ou irritação dirigida contra o rei.
- source_word: κολακεύει αὐτὴν
  choice: ele a lisonjeia
  rationale: Equivalente direto de κολακεύω, preservando a ideia de bajulação usada para recuperar o favor dela.
- source_word: ὅπως διαλλαγῇ αὐτῷ
  choice: para que se reconcilie com ele
  rationale: Preserva tanto a finalidade introduzida por ὅπως quanto a restauração da relação expressa por διαλλάσσομαι.
