  text: And when the king awoke[a], they took the letter and gave it to him[b], and he read it.
translation:
  language: pt
  text: Quando o rei acordou,[a] eles tomaram o documento,[b] deram-no ao rei, e ele o leu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi despertado” ou “se levantou”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “escrito” ou “carta”.'
    reason: lexical_alternative
  - marker: c
    text: O verbo grego também pode significar “leu em voz alta” em certos contextos; aqui o texto não especifica.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐξηγέρθη
  choice: quando o rei acordou
  rationale: O aoristo passivo de ἐξεγείρω pode ter sentido intransitivo de despertar ou levantar-se. No contexto narrativo, “acordou” é natural e adequado, sem esconder a alternativa lexical.
- source_word: λαβόντες
  choice: eles pegaram
  rationale: O particípio aoristo indica uma ação anterior ou concomitante à entrega. A forma verbal finita produz uma sequência narrativa clara em português.
- source_word: τὸ γράμμα
  choice: o documento
  rationale: γράμμα designa aqui algo escrito apresentado ao rei. “Documento” comunica melhor o caráter do escrito neste contexto de corte, embora “carta” e “escrito” também sejam possíveis.
- source_word: ἔδωκαν αὐτῷ
  choice: entregaram-no a ele
  rationale: “Entregaram” expressa com naturalidade o ato concreto de dar o documento ao rei; o pronome retoma explicitamente o objeto.
- source_word: ἀνέγνω
  choice: ele o leu
  rationale: O verbo significa ler e, conforme o contexto, pode envolver leitura em voz alta. Como o grego não explicita isso aqui, a tradução mantém a formulação não marcada “leu”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sequência narrativa natural. Mantém-se o pronome “eles” para tornar explícito em português o sujeito plural implícito na forma verbal grega. As notas preservam as ambiguidades reais de ἐξηγέρθη, γράμμα e ἀνέγνω.
