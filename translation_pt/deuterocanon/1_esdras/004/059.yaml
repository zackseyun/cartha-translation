lexical_decisions:
- source_word: λέγων
  choice: dizendo
  rationale: O particípio presente introduz diretamente as palavras citadas e mantém a ligação sintática com o contexto anterior.
- source_word: Παρὰ σοῦ
  choice: De ti vêm
  rationale: παρά com genitivo indica aqui fonte ou origem. A inclusão de “vêm” produz português natural e aplica a expressão tanto à vitória quanto à sabedoria.
- source_word: νίκη
  choice: vitória
  rationale: Equivalente direto e corrente do substantivo grego.
- source_word: σοφία
  choice: sabedoria
  rationale: Preserva o sentido amplo e usual do termo, sem restringi-lo a habilidade ou conhecimento técnico.
- source_word: σὴ ἡ δόξα
  choice: tua é a glória
  rationale: Conserva a ênfase do possessivo grego e emprega uma formulação doxológica natural em português.
- source_word: οἰκέτης
  choice: servo
  rationale: Expressa a relação de submissão e serviço no registro solene do trecho, embora o termo grego possa designar mais especificamente um servo doméstico ou escravo.
theological_decisions:
- issue: Sentido de οἰκέτης na declaração de submissão
  choice: servo
  alternative: servo doméstico; escravo
  rationale: “Servo” mantém o tom solene e a autodeclaração de sujeição sem decidir além do contexto quanto à condição jurídica; a amplitude lexical mais forte é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção paralela foi levemente condensada em “De ti vêm a vitória e a sabedoria”, preservando a fonte comum expressa no grego; o ponto e vírgula distingue a afirmação de origem da atribuição de glória.
