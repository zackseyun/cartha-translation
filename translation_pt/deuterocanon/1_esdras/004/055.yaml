base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/055.yaml
  text: And he wrote that support should be given to the Levites until the day when the house would be completed and Jerusalem built[a][b][c][d].
translation:
  language: pt
  text: E também escreveu que se desse sustento aos levitas até o dia em que a casa fosse concluída e Jerusalém fosse edificada.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, provisão, manutenção ou auxílio material para os levitas.
    reason: lexical_alternative
  - marker: b
    text: “A casa” refere-se ao templo.
    reason: cross_reference
  - marker: c
    text: Ou “Jerusalém fosse reconstruída”. O grego diz literalmente “edificada”, embora o contexto seja de restauração. A construção grega depois de “até o dia” é um tanto irregular no texto transmitido, mas o sentido geral é que o sustento continuaria até a conclusão do templo e a edificação de Jerusalém.
    reason: textual_variant
lexical_decisions:
- source_word: ἔγραψεν
  choice: escreveu que
  rationale: O aoristo de γράφω introduz o conteúdo de uma determinação escrita; a formulação preserva isso sem especificar um destinatário ausente do grego.
- source_word: δοῦναι
  choice: se desse
  rationale: O infinitivo depende de ἔγραψεν e expressa a ação determinada. A construção impessoal em português comunica naturalmente que o sustento devia ser fornecido.
- source_word: τὴν χορηγίαν
  choice: sustento
  rationale: χορηγία indica provisão ou manutenção custeada. “Sustento” exprime de modo claro e corrente o apoio material contínuo destinado aos levitas.
- source_word: τοῖς Λευείταις
  choice: aos levitas
  rationale: Representa diretamente o objeto indireto no dativo e emprega a designação tradicional e corrente em português.
- source_word: ἕως τῆς ἡμέρας
  choice: até o dia em que
  rationale: Mantém a expressão temporal e introduz de maneira natural, em português, o ponto final previsto para o fornecimento.
- source_word: ᾖ ἐπιτελεσθῇ
  choice: fosse concluída
  rationale: Apesar da dificuldade sintática do texto transmitido, o sentido aponta para a conclusão futura da Casa; o subjuntivo português se ajusta à oração temporal prospectiva.
- source_word: ὁ οἶκος
  choice: a Casa
  rationale: Preserva o termo concreto do grego e a expressão bíblica para o templo. A inicial maiúscula ajuda o leitor moderno a reconhecer a referência específica sem substituir a palavra por uma interpretação.
- source_word: Ἰερουσαλὴμ οἰκοδομηθῆναι
  choice: Jerusalém fosse edificada
  rationale: Mantém o sentido literal de “ser construída/edificada”. “Reconstruída” é plausível pelo contexto de restauração, mas acrescentaria ao texto uma ideia não expressa no verbo simples.
theological_decisions:
- issue: Referência de ὁ οἶκος
  choice: “a Casa”, entendida como o templo de Jerusalém
  alternative: traduzir diretamente como “o templo” ou entender uma construção mais geral
  rationale: No contexto da restauração em Esdras, “a Casa” é uma designação contextual do templo. Preservar o idioma bíblico evita tornar explícito no texto principal aquilo que o grego deixa implícito.
- issue: Edificação ou reconstrução de Jerusalém
  choice: “Jerusalém fosse edificada”
  alternative: “Jerusalém fosse reconstruída”
  rationale: O contexto envolve restauração, mas οἰκοδομηθῆναι significa simplesmente “ser edificada”. A tradução conserva essa tensão entre a formulação literal e o cenário histórico.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A estrutura mantém a coordenação do grego, usa “sustento” em sentido material e conserva “a Casa” como expressão bíblica para o templo.
