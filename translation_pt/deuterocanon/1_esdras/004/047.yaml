base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/047.yaml
  text: Then King Darius stood up and kissed him[a], and wrote letters for him to all the stewards and regional governors and generals and satraps[b], that they should escort him and all those with him who were going up to build Jerusalem.
translation:
  language: pt
  text: Então o rei Dario se levantou e o beijou. Depois, escreveu em favor dele cartas a todos os administradores, governadores regionais, generais e sátrapas, para que o acompanhassem, juntamente com todos os que subiam com ele para construir Jerusalém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pelo contexto mais amplo, também se pode entender “reconstruir Jerusalém”; aqui, porém, o verbo grego significa literalmente “construir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Conector temporal e sequencial natural em português narrativo.
- source_word: ἀναστὰς
  choice: se levantou
  rationale: Preserva a ação concreta de Dario levantar-se, expressa pelo particípio aoristo.
- source_word: κατεφίλησεν
  choice: o beijou
  rationale: Expressa o ato sem acrescentar uma intensidade afetiva que, embora possível no composto grego, não precisa ser explicitada.
- source_word: ἔγραψεν αὐτῷ τὰς ἐπιστολάς
  choice: escreveu em favor dele cartas
  rationale: Interpreta o dativo αὐτῷ como dativo de benefício e conserva o sentido direto de γράφω.
- source_word: οἰκονόμους
  choice: administradores
  rationale: No contexto imperial, indica encarregados da gestão de bens ou recursos; “administradores” evita tanto a conotação doméstica de “mordomos” quanto a especificidade excessiva de “tesoureiros”.
- source_word: τοπάρχας
  choice: governadores regionais
  rationale: Traduz funcionalmente os governantes de distritos ou regiões, sem recorrer ao pouco conhecido “toparcas”.
- source_word: στρατηγοὺς
  choice: generais
  rationale: Equivalente claro e corrente para comandantes militares.
- source_word: σατράπας
  choice: sátrapas
  rationale: Conserva o título administrativo persa específico, reconhecível em português.
- source_word: ἵνα προπέμψωσιν
  choice: para que acompanhassem
  rationale: Comunica o apoio oficial prestado durante a viagem; o verbo também pode abranger o envio com assistência ou provisões.
- source_word: τοὺς μετʼ αὐτοῦ πάντας
  choice: a todos os que com ele
  rationale: Mantém a abrangência de πάντας e a relação do grupo com o personagem.
- source_word: ἀναβαίνοντας
  choice: subiam
  rationale: Preserva o idioma bíblico e geográfico de subir a Jerusalém.
- source_word: οἰκοδομῆσαι τὴν Ἰερουσαλήμ
  choice: para construir Jerusalém
  rationale: Traduz diretamente οἰκοδομέω sem introduzir o prefixo semântico de “reconstruir”, embora o contexto mais amplo envolva restauração.
theological_decisions:
- issue: Construir ou reconstruir Jerusalém
  choice: construir Jerusalém
  alternative: reconstruir Jerusalém
  rationale: O contexto histórico favorece a ideia de reconstrução, mas o verbo grego do versículo é simplesmente οἰκοδομῆσαι; a tradução mantém essa forma e registra a alternativa em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com fluidez brasileira. Os cargos são traduzidos funcionalmente, exceto “sátrapas”, preservado como título histórico persa. A pontuação divide a longa coordenação grega em duas frases para maior clareza sem alterar sua sequência.
