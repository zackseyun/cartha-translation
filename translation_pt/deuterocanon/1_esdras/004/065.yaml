  text: Then he said to the king[a], “Remember the vow that I made to rebuild Jerusalem on the day when you received your kingdom,”
translation:
  language: pt
  text: 'Então ele disse ao rei: “Lembre-se do voto[a] que fiz de reconstruir Jerusalém no dia em que recebeu o seu reino.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da oração que fiz para reconstruir Jerusalém”. As palavras gregas podem se referir tanto a um voto quanto a uma oração; neste contexto, a ideia de um compromisso assumido parece mais provável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνήσθητι
  choice: Lembre-se
  rationale: O imperativo aoristo constitui um apelo direto ao rei. “Lembre-se” é natural no português moderno e mantém o tom respeitoso do discurso.
- source_word: εὐχήν / ηὐξάμην
  choice: do voto que fiz
  rationale: O substantivo e o verbo cognatos podem pertencer tanto ao campo semântico do voto quanto ao da oração. Neste contexto, o infinitivo que especifica a ação concreta de reconstruir Jerusalém favorece a ideia de um compromisso assumido; a alternativa “oração” é preservada em nota.
- source_word: οἰκοδομῆσαι
  choice: de reconstruir
  rationale: Embora o verbo signifique literalmente “construir”, Jerusalém é apresentada no contexto narrativo como cidade a ser restaurada após a destruição; “reconstruir” comunica esse sentido de modo claro e natural.
- source_word: παρέλαβες
  choice: recebeu
  rationale: O verbo indica aqui receber ou assumir o domínio real. “Recebeu” conserva de perto a forma do grego sem sugerir tomada violenta do poder.
- source_word: τὸ βασίλειόν σου
  choice: o seu reino
  rationale: A expressão pode designar tanto o reino quanto o exercício da realeza. “O seu reino” é a tradução mais direta e preserva a amplitude da expressão grega.
theological_decisions:
- issue: Sentido de εὐχή / ηὐξάμην
  choice: Um voto ou compromisso solene feito pelo falante
  alternative: Uma oração feita pelo falante
  rationale: A combinação do substantivo com o verbo admite os dois sentidos. A ação concreta expressa por “reconstruir Jerusalém” favorece “voto” no texto principal, sem eliminar a leitura ligada à oração, registrada na nota.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão ampla no mundo lusófono. O tratamento respeitoso ao rei é expresso pela forma verbal “Lembre-se” e pelo possessivo “seu”.
