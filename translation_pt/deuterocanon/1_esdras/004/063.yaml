  text: to go up and rebuild Jerusalem and the temple on which his name was called[b][a]; and they celebrated with music and joy for seven days.
translation:
  language: pt
  text: subir e reconstruir Jerusalém e o templo sobre o qual foi invocado o nome dele[a]; e celebraram[b] com música e alegria durante sete dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de forma mais idiomática: “o templo que leva o nome dele”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo grego, raro, também pode ser entendido como “fizeram uma celebração festiva” ou “se alegraram em festa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβῆναι
  choice: subir
  rationale: Preserva o sentido literal e o idioma bíblico-geográfico de subir a Jerusalém, sem reduzi-lo a “voltar”.
- source_word: οἰκοδομῆσαι
  choice: reconstruir
  rationale: Embora o verbo possa significar simplesmente “construir”, o contexto é o da restauração da cidade e do templo após sua destruição.
- source_word: ἱερὸν
  choice: templo
  rationale: Neste contexto, o termo designa o complexo do templo; “templo” é a forma natural e corrente em português.
- source_word: οὗ ὠνομάσθη τὸ ὄνομα αὐτοῦ ἐπʼ αὐτῷ
  choice: sobre o qual foi invocado o nome dele
  rationale: Mantém a fórmula bíblica que associa o nome divino ao templo, sem transformar silenciosamente essa fórmula em uma explicação teológica. “Dele” evita que “seu” pareça referir-se a Jerusalém ou ao templo.
- source_word: ἐκωθωνίζοντο
  choice: celebraram
  rationale: O verbo raro indica celebração festiva. “Celebraram” comunica isso com dignidade e sem a conotação negativa que “farrearam” poderia sugerir.
- source_word: μετὰ μουσικῶν
  choice: com música
  rationale: A expressão pode aludir de modo amplo a músicos ou acompanhamento musical; “com música” conserva essa generalidade sem impor precisão indevida.
- source_word: χαρᾶς
  choice: alegria
  rationale: Equivalente direto, natural e adequado ao contexto festivo.
- source_word: ἡμέρας ἑπτά
  choice: durante sete dias
  rationale: Expressa de modo idiomático em português a duração indicada pelo acusativo grego.
theological_decisions:
- issue: Fórmula do nome divino aplicada ao templo
  choice: sobre o qual foi invocado o nome dele
  alternative: o templo que leva o nome dele; onde o nome dele foi invocado
  rationale: A tradução preserva a fórmula de associação, pertença e invocação do nome divino, sem decidir se o leitor deve entendê-la apenas como posse, culto ou presença. A alternativa mais idiomática consta em nota.
translation_notes:
  register: 'Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Conserva-se a construção infinitiva inicial por corresponder à continuação sintática do contexto. As notas estão ligadas às expressões pertinentes: [a] à fórmula do nome divino e [b] ao verbo raro de celebração.'
