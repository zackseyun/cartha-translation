  text: And he sent back all the vessels that Cyrus had set apart from Babylon; and everything that Cyrus had said to do[a], he himself also ordered to be done and sent to Jerusalem.
translation:
  language: pt
  text: E ele enviou todos os objetos que Ciro havia separado de Babilônia; e tudo o que Ciro havia dito que se fizesse, ele próprio também ordenou que fosse feito e enviado a Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαπέστειλεν
  choice: enviou
  rationale: Expressa o sentido básico de despachar ou enviar sem acrescentar explicitamente a ideia de retorno, que depende do contexto.
- source_word: πάντα τὰ σκεύη
  choice: todos os objetos
  rationale: σκεύη designa objetos, utensílios ou artigos; «objetos» é amplo, natural e não restringe indevidamente a forma ou a função deles.
- source_word: ἃ ἐχώρισεν Κῦρος ἀπὸ Βαβυλῶνος
  choice: que Ciro havia separado de Babilônia
  rationale: Preserva o sentido de separação ou destinação de χωρίζω e a origem expressa por ἀπό, sem transformar o verbo em «retirar» ou «devolver».
- source_word: πάντα ὅσα εἶπεν Κῦρος ποιῆσαι
  choice: tudo o que Ciro havia dito que se fizesse
  rationale: Reproduz a construção infinitiva grega em português corrente e mantém aberta a identificação exata das providências mencionadas.
- source_word: καὶ αὐτὸς
  choice: ele próprio também
  rationale: Conserva tanto a ênfase do pronome αὐτός quanto o valor aditivo de καί.
- source_word: ἐπέταξεν
  choice: ordenou
  rationale: Equivalente administrativo claro e direto para uma ordem dada com autoridade.
- source_word: ποιῆσαι καὶ ἐξαποστεῖλαι εἰς Ἰερουσαλήμ
  choice: que fosse feito e enviado a Jerusalém
  rationale: A construção passiva é natural em português após «ordenou» e conserva as duas ações coordenadas e o destino expresso no grego.
