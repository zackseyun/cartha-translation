  text: The third wrote[a], “Women are stronger, but above all things truth is victorious.”
translation:
  language: pt
  text: 'O terceiro escreveu: “As mulheres são mais fortes, mas, acima de tudo, a verdade vence.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τρίτος
  choice: O terceiro
  rationale: O artigo com o ordinal tem valor substantivado e se refere, de modo conciso, ao terceiro participante.
- source_word: ἔγραψεν
  choice: escreveu
  rationale: Tradução direta do aoristo, que introduz a tese escrita pelo terceiro participante.
- source_word: Ὑπερισχύουσιν
  choice: são mais fortes
  rationale: Expressa a superioridade de força indicada pelo verbo; “prevalecem” também seria possível, mas repetiria semanticamente o verbo da oração seguinte.
- source_word: αἱ γυναῖκες
  choice: As mulheres
  rationale: O contexto apresenta uma afirmação geral, não limitada especificamente às esposas.
- source_word: ὑπὲρ δὲ πάντα
  choice: mas, acima de tudo
  rationale: Preserva a comparação culminante — acima ou além de todas as coisas — em português natural.
- source_word: νικᾷ
  choice: vence
  rationale: Mantém a imagem concreta de vitória do presente gnômico e soa natural com o sujeito abstrato “a verdade”.
- source_word: ἡ ἀλήθεια
  choice: a verdade
  rationale: Conserva o substantivo abstrato definido e sua personificação como vencedora suprema.
theological_decisions:
- issue: Formulação da máxima culminante sobre ἡ ἀλήθεια
  choice: a verdade vence
  alternative: a verdade prevalece
  rationale: “Vence” preserva a metáfora de vitória de νικᾷ sem transformar a frase numa afirmação doutrinária mais específica; “prevalece” é uma alternativa lexical legítima.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem da oração conserva o destaque de “acima de tudo”, enquanto “vence” comunica de modo direto o valor de νικᾷ.
