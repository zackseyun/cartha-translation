  text: And he took the letters and went out to Babylon and reported to all his brothers[a].
translation:
  language: pt
  text: Ele pegou as cartas, partiu para a Babilônia e relatou a todos os seus irmãos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego não declara expressamente o que ele relatou; o conteúdo fica implícito pelo contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν
  choice: pegou
  rationale: O aoristo de λαμβάνω indica aqui a ação narrativa de tomar consigo as cartas. “Pegou” é corrente e não acrescenta a ideia de que ele as tenha recebido formalmente.
- source_word: τὰς ἐπιστολάς
  choice: as cartas
  rationale: ἐπιστολή designa normalmente uma carta ou mensagem escrita; o plural definido é reproduzido diretamente.
- source_word: ἐξῆλθεν εἰς Βαβυλῶνα
  choice: partiu para a Babilônia
  rationale: Embora ἐξέρχομαι signifique literalmente “sair”, com um destino expresso “partiu para” transmite com naturalidade em português tanto a saída quanto o deslocamento, sem sugerir que Babilônia fosse o ponto de origem.
- source_word: ἀπήγγειλεν
  choice: relatou
  rationale: ἀπαγγέλλω significa comunicar, anunciar ou relatar. “Relatou” permite deixar implícito, como no grego, o conteúdo comunicado.
- source_word: τοῖς ἀδελφοῖς αὐτοῦ πᾶσιν
  choice: aos seus irmãos, a todos eles
  rationale: Mantém o sentido literal de ἀδελφοί e torna inequívoco que πᾶσιν abrange todos os irmãos, preservando a posição enfática do quantificador no grego.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla. “Partiu para” evita o pouco natural “saiu para a Babilônia”; “relatou” preserva a ausência de objeto explícito. A retomada “a todos eles” reproduz a ênfase final de πᾶσιν sem transformar “irmãos” em uma categoria interpretativa mais ampla.
