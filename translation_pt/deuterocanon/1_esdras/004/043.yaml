  yaml_path: translation/deuterocanon/1_esdras/004/043.yaml
  text: Then he said to the king[a], “Remember the vow that you vowed to rebuild Jerusalem on the day when you received your kingdom,”
translation:
  language: pt
  text: 'Então ele disse ao rei: “Lembra-te do voto[a] que fizeste de reconstruir Jerusalém no dia em que recebeste o teu reino.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da oração que fizeste”; o substantivo grego pode significar “oração”, mas o verbo cognato e o contexto favorecem “voto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνήσθητι
  choice: Lembra-te
  rationale: O imperativo aoristo faz um apelo direto ao rei. “Lembra-te” preserva a força da ordem e mantém um registro digno e amplamente compreensível.
- source_word: εὐχὴν ἣν ηὔξω
  choice: do voto que fizeste
  rationale: A combinação do substantivo εὐχή com o verbo cognato εὔχομαι, neste contexto de compromisso régio, aponta para um voto ou promessa solene. Em português, “voto que fizeste” comunica essa relação de modo natural, sem a repetição pouco idiomática “voto que votaste”.
- source_word: οἰκοδομῆσαι
  choice: de reconstruir
  rationale: Embora o verbo possa significar simplesmente “construir”, o contexto histórico trata da restauração de Jerusalém depois de sua destruição; “reconstruir” explicita adequadamente esse sentido contextual.
- source_word: τὴν Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome da cidade.
- source_word: ἐν τῇ ἡμέρᾳ ᾗ
  choice: no dia em que
  rationale: Expressão temporal natural em português que conserva a referência explícita ao dia.
- source_word: τὸ βασίλειόν σου παρέλαβες
  choice: recebeste o teu reino
  rationale: παραλαμβάνω indica aqui receber ou assumir o domínio real. A formulação escolhida permanece próxima do grego e conserva a linguagem régia.
theological_decisions:
- issue: Sentido de εὐχή no contexto régio
  choice: voto
  alternative: oração
  rationale: O verbo cognato ηὔξω e o apelo a uma obrigação anteriormente assumida favorecem “voto”. Como εὐχή também pode significar “oração”, a alternativa genuína é preservada em nota.
translation_notes:
  register: Português moderno, digno e claro, com formas de segunda pessoa singular (“lembra-te”, “fizeste”, “recebeste”) usadas de maneira coerente no discurso dirigido ao rei. A nota foi posicionada junto a “voto”, termo ao qual se refere.
