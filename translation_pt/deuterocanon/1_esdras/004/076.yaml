  text: He also wrote out the provision and the priestly robe[a]—specifying in what they are to minister in it.
translation:
  language: pt
  text: Também registrou a provisão e a veste sacerdotal[a], especificando em que eles prestarão serviço nela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o suprimento e a veste sacerdotal, indicando em que eles prestarão serviço nela». A redação grega é condensada, especialmente na expressão «em que… nela».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: registrou
  rationale: O aoristo de γράφω indica que ele pôs essas determinações por escrito; «registrou» comunica bem o caráter administrativo sem acrescentar uma preposição ausente no grego.
- source_word: χορηγίαν
  choice: provisão
  rationale: χορηγία designa o suprimento ou os recursos fornecidos para uma finalidade; «provisão» mantém a amplitude do termo sem restringi-lo a dinheiro.
- source_word: ἱερατικὴν στολήν
  choice: veste sacerdotal
  rationale: στολή é uma veste ou manto, e «veste sacerdotal» é natural, digna e evita associações confessionais mais específicas.
- source_word: ἐν τίνι
  choice: com que
  rationale: A expressão grega é condensada. «Com que» preserva sua ligação provável com a veste e produz português compreensível, sem eliminar totalmente a dificuldade sintática.
- source_word: λατρεύσουσιν
  choice: prestarão serviço
  rationale: No contexto do templo, λατρεύω denota serviço cultual. «Prestarão serviço» mantém esse sentido sem impor terminologia eclesiástica posterior.
- source_word: ἐν αὐτῇ
  choice: nela
  rationale: O pronome feminino remete mais naturalmente a στολή, «veste», embora a construção resultante permaneça elíptica e algo redundante, como no grego.
