lexical_decisions:
- source_word: Ἄνδρες
  choice: Homens
  rationale: Vocativo plural masculino de ἀνήρ; mantém a interpelação direta e a força retórica do grego.
- source_word: πῶς ὑπερισχύει
  choice: como ... é poderoso
  rationale: Neste contexto exclamativo, πῶς indica intensidade, e ὑπερισχύει expressa força ou preponderância. A formulação escolhida é natural em português sem acrescentar um objeto ao verbo.
- source_word: ὁ οἶνος
  choice: o vinho
  rationale: Correspondência lexical direta.
- source_word: πάντας τοὺς ἀνθρώπους
  choice: todos os que
  rationale: ἄνθρωπος pode ter sentido genérico. A construção portuguesa evita repetição pesada e inclui naturalmente todas as pessoas que bebem vinho, sem apagar o vocativo masculino inicial.
- source_word: τοὺς πίοντας αὐτόν
  choice: os que o bebem
  rationale: Reproduz de modo natural o particípio presente substantivado e seu sentido geral ou habitual.
- source_word: πλανᾷ
  choice: desvia
  rationale: Conserva a ideia de fazer alguém se afastar do rumo certo, aqui aplicada à atividade mental, sem restringi-la apenas a engano proposicional.
- source_word: τὴν διάνοιαν
  choice: a mente
  rationale: Equivalente claro e corrente para a faculdade do pensamento ou entendimento.
