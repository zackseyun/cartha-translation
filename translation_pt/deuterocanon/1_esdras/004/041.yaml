  text: And he stopped speaking; and then all the people cried out[a], and then they said, “Great is the truth, and it prevails.”
translation:
  language: pt
  text: 'E ele parou de falar; então todo o povo gritou, e então todos disseram: “Grande é a verdade, e ela prevalece”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Grande é a verdade, e ela é a mais forte” ou “e ela vence”. O verbo grego pode significar “prevalecer”, “ser mais forte” ou “vencer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπησεν τοῦ λαλεῖν
  choice: parou de falar
  rationale: A construção indica cessação da fala; esta formulação é natural em português e expressa claramente a ação concluída.
- source_word: πᾶς ὁ λαός
  choice: todo o povo
  rationale: Preserva o sentido coletivo e abrangente da assembleia, em registro corrente e digno.
- source_word: ἐφώνησεν
  choice: ergueu a voz
  rationale: O verbo singular concorda com o sujeito coletivo e indica uma aclamação pública, sem especificar excessivamente o volume ou o tom.
- source_word: εἶπον
  choice: disse
  rationale: Embora a forma grega seja plural, o português pode manter a construção coletiva com “todo o povo ... disse”, evitando uma mudança desnecessária de sujeito.
- source_word: Μεγάλη ἡ ἀλήθεια
  choice: Grande é a verdade
  rationale: Mantém a ordem enfática e o tom elevado e proverbial da aclamação grega.
- source_word: ὑπερισχύει
  choice: prevalece
  rationale: Expressa de modo conciso a ideia de mostrar-se superior, ter mais força ou vencer, preservando a amplitude semântica principal.
theological_decisions:
- issue: Sentido de ἡ ἀλήθεια na aclamação sapiencial
  choice: a verdade
  alternative: verdade
  rationale: O artigo grego favorece “a verdade” como realidade ou princípio reconhecido, sem converter a frase em um slogan mais abstrato.
- issue: Força semântica de ὑπερισχύει
  choice: prevalece
  alternative: é a mais forte / vence
  rationale: “Prevalece” mantém a afirmação da supremacia da verdade sem decidir se o verbo descreve força inerente ou vitória ativa.
