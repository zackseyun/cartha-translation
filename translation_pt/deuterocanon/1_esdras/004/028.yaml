base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/004/028.yaml
  text: And now[a], do you not believe me? Is not the king great in his authority? Do not all the lands fear to touch him?
translation:
  language: pt
  text: E agora, vocês não acreditam em mim? Não é grande o rei em sua autoridade? Não têm todas as terras receio de tocar nele?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Terras” também pode ser traduzido por “países” ou “regiões”. O verbo traduzido por “têm receio” indica temor cauteloso ou reverente.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ
  choice: acreditam
  rationale: O verbo tem o orador como objeto e indica aceitar como verdadeira a sua afirmação; “acreditam em mim” é natural em português e preserva a pergunta retórica.
- source_word: μέγας
  choice: grande
  rationale: Mantém o sentido direto de grandeza e proeminência do rei, sem restringi-lo apenas à força militar.
- source_word: ἐξουσίᾳ
  choice: autoridade
  rationale: Expressa a autoridade e a prerrogativa de governo do rei, preservando a distinção possível entre autoridade e mera força.
- source_word: χῶραι
  choice: terras
  rationale: O termo designa terras, territórios ou regiões. “Terras” conserva a amplitude geográfica e a personificação retórica do grego, sem sugerir necessariamente Estados nacionais modernos.
- source_word: εὐλαβοῦνται
  choice: têm receio
  rationale: O verbo comunica temor acompanhado de cautela. “Têm receio” soa natural e retém essa nuance melhor que um simples “temem”.
- source_word: ἅψασθαι
  choice: tocar
  rationale: Preserva a imagem concreta do verbo grego, que pode significar tocar ou pôr a mão em alguém, e ressalta a condição aparentemente intocável do rei.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para refletir o plural de πιστεύετέ. A formulação “grande em autoridade” conserva de perto a construção grega, e “todas as terras” mantém sua personificação retórica.
