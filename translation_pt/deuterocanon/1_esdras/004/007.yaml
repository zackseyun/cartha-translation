  yaml_path: translation/deuterocanon/1_esdras/004/007.yaml
  text: And the second will sit beside Darius because of his wisdom[b][a], and he will be called a kinsman of Darius.
translation:
  language: pt
  text: E o segundo se sentará junto de Dario[a], por causa de sua sabedoria, e será chamado parente[b] de Dario.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tomará assento” ou “ficará sentado”. O verbo grego refere-se primariamente ao ato de sentar-se; a natureza exata da relação com Dario — por exemplo, proximidade física ou posição de honra na corte — é inferida do contexto régio.'
    reason: lexical_alternative
  - marker: b
    text: “Parente” pode indicar um familiar ou uma designação honorífica de estreita associação com Dario.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερος
  choice: em segundo lugar
  rationale: O ordinal funciona predicativamente e indica posição ou precedência na corte; a formulação portuguesa evita entendê-lo como referência à segunda pessoa de uma lista.
- source_word: καθιεῖται
  choice: se sentará
  rationale: Conserva a imagem concreta de tomar assento, sem transformar implicitamente o verbo em uma nomeação oficial.
- source_word: Δαρείου
  choice: junto a Dario
  rationale: No contexto régio, expressa a relação do assento com Dario sem afirmar com excessiva precisão se a construção indica proximidade física ou posição imediatamente inferior.
- source_word: διὰ τὴν σοφίαν αὐτοῦ
  choice: por causa da sua sabedoria
  rationale: διά com acusativo tem valor causal; esta é uma formulação clara e natural em português moderno.
- source_word: συγγενής
  choice: parente
  rationale: Equivalente corrente para alguém da mesma família, deixando em aberto se o título cortesão indica parentesco literal ou associação honorífica.
- source_word: κληθήσεται
  choice: será chamado
  rationale: Mantém o futuro passivo e não decide se a designação é formal, honorífica ou meramente reconhecida pelo uso.
