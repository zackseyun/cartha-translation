- source_word: ὁ εἴπας
  choice: aquele que havia falado
  rationale: O mais-que-perfeito composto deixa claro que essa fala ocorreu antes do momento narrado.
- source_word: περὶ
  choice: sobre
  rationale: Com o genitivo, indica o assunto da fala; “sobre” é claro e natural.
- source_word: ἰσχύος
  choice: força
  rationale: É o equivalente mais direto neste contexto, embora o termo grego também possa indicar poder ou vigor.
- source_word: τοῦ βασιλέως
  choice: do rei
  rationale: βασιλεύς designa diretamente o rei neste contexto de corte.
