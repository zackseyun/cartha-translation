translation:
  language: pt
  text: e vestir-se de púrpura, beber de recipientes de ouro[a], dormir sobre ouro[b], ter um carro com freios de ouro[c], um turbante de linho fino e um colar ao redor do pescoço,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «beber em taças de ouro»; o grego indica objetos de ouro usados para beber, mas não especifica exatamente o tipo de recipiente.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «dormir sobre ouro», provavelmente numa cama ou num divã adornado com ouro; a expressão grega é condensada.
    reason: lexical_alternative
  - marker: c
    text: Ou «um carro com arreios de ouro»; o adjetivo pode descrever o carro por seus freios ou por seus arreios de ouro.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορφύραν περιβαλέσθαι
  choice: vestir-se de púrpura
  rationale: O infinitivo médio indica envolver-se ou vestir-se, e o substantivo designa tecido ou veste de púrpura. A formulação concisa preserva a associação com luxo e posição social sem acrescentar explicitamente «vestes reais».
- source_word: ἐν χρυσώμασιν πίνειν
  choice: beber em recipientes de ouro
  rationale: A expressão indica beber por meio de objetos de ouro, provavelmente taças ou outros recipientes. «Recipientes» evita especificar uma forma que o grego não nomeia.
- source_word: ἐπὶ χρυσῷ καθεύδειν
  choice: dormir sobre ouro
  rationale: Mantém a formulação grega deliberadamente condensada, sem introduzir no texto uma cama ou um divã que não são mencionados expressamente.
- source_word: ἅρμα χρυσοχάλινον
  choice: um carro com arreios de ouro
  rationale: O adjetivo composto relaciona o ouro ao freio ou conjunto de arreios do carro. «Arreios» produz uma imagem clara em português sem sugerir que o próprio carro fosse feito de ouro.
- source_word: κίδαριν βυσσίνην
  choice: um turbante de linho fino
  rationale: κίδαρις designa um turbante ou cobertura da cabeça, e βύσσινος indica linho fino; a tradução é precisa e corrente.
- source_word: μανιάκην περὶ τὸν τράχηλον
  choice: um colar ao redor do pescoço
  rationale: μανιάκης é um ornamento cervical, como colar, gargantilha ou cadeia. «Colar» é natural e suficientemente amplo, enquanto a frase seguinte preserva a localização explícita.
