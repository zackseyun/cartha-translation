base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/042.yaml
  text: And leaving all these things behind[a], they gape at her; with mouths hanging open they stare at her, and all choose her rather than gold and silver and every beautiful thing.
translation:
  language: pt
  text: E, deixando de lado todas essas coisas, ficam boquiabertos diante dela e, de boca aberta, olham para ela; todos a preferem[a] ao ouro, à prata e a tudo o que é belo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos a escolhem em vez do ouro, da prata e de tudo o que é belo”.'
    reason: O verbo grego pode ser traduzido literalmente como “escolher”; nesta construção comparativa, ele também comunica preferência.
lexical_decisions:
- source_word: ἀφέντες
  choice: deixando de lado
  rationale: O particípio aoristo de ἀφίημι expressa aqui o abandono ou afastamento das coisas mencionadas; “deixando de lado” preserva a ligação participial com as ações seguintes em português natural.
- source_word: ταῦτα πάντα
  choice: todas essas coisas
  rationale: O neutro plural retoma de modo abrangente os bens e interesses mencionados anteriormente.
- source_word: εἰς αὐτὴν κέχηναν
  choice: ficam boquiabertos diante dela
  rationale: A expressão descreve homens pasmos, com a boca aberta e a atenção dirigida para a mulher; “diante dela” comunica naturalmente a direção indicada por εἰς.
- source_word: χάσκοντες τὸ στόμα
  choice: de boca aberta
  rationale: A locução mantém a imagem corporal enfática e a repetição do ato de ficar boquiaberto, sem tornar a frase excessivamente pesada.
- source_word: θεωροῦσιν αὐτήν
  choice: olham para ela
  rationale: θεωρέω indica observar ou contemplar. Neste contexto, a fixação já é transmitida pelas expressões de espanto que cercam o verbo, de modo que “olham para ela” permanece claro e fiel.
- source_word: αἱρετίζουσιν μᾶλλον ἢ
  choice: preferem ... a
  rationale: O verbo de escolha, combinado com μᾶλλον ἢ, forma uma comparação de preferência. A construção portuguesa “preferir X a Y” expressa diretamente essa relação.
- source_word: πᾶν πρᾶγμα ὡραῖον
  choice: tudo o que é belo
  rationale: A formulação conserva tanto a abrangência de πᾶν πρᾶγμα quanto o sentido estético e desejável de ὡραῖον, sem restringi-lo apenas a posses.
