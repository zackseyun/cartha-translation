  yaml_path: translation/deuterocanon/1_esdras/003/020.yaml
  text: and it makes every heart rich[a], and it remembers neither king nor satrap; and it makes everything speak in terms of talents.
translation:
  language: pt
  text: e torna rico cada coração, sem se lembrar de rei nem de sátrapa; e faz todos falarem em termos de talentos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais dinâmico, “faz todos falarem de dinheiro”. O grego diz literalmente “faz todos/tudo falar por meio de talentos”; “talentos” eram unidades de peso e de valor monetário.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσας καρδίας ποιεῖ πλουσίας
  choice: torna rico cada coração
  rationale: Preserva a metáfora antropológica de καρδία e a imagem econômica de πλουσίας, em uma construção portuguesa natural.
- source_word: οὐ μέμνηται
  choice: sem se lembrar de
  rationale: Mantém o sentido lexical de “lembrar/ter em mente”, deixando que o contexto comunique a ideia de não fazer distinção ou não levar em conta.
- source_word: βασιλέα οὐδὲ σατράπην
  choice: rei nem sátrapa
  rationale: Conserva o título administrativo persa específico e o colorido histórico do texto.
- source_word: πάντα
  choice: todos
  rationale: Embora a forma grega seja neutra plural e possa significar “todas as coisas”, o infinitivo λαλεῖν favorece a referência prática a pessoas; “todos” preserva essa leitura sem acrescentar “as pessoas” ao texto.
- source_word: διὰ ταλάντων
  choice: em talentos
  rationale: Conserva talentos como unidades monetárias e reproduz de modo conciso a formulação incomum do grego, sem resolver totalmente se a expressão indica assunto, meio ou medida da fala.
- source_word: λαλεῖν
  choice: falarem
  rationale: Equivalente direto e corrente para o infinitivo grego “falar”.
