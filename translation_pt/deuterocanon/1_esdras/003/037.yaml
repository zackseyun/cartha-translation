base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/037.yaml
  text: Men[a], is not the king great, and are not men many, and does not wine have strength? Who then is the one who rules over them[b], or who is the one who has mastery over them? Is it not women?
translation:
  language: pt
  text: Homens, não é grande o rei, não são numerosos os homens[a] e não tem força o vinho[b]? Quem, então, os domina, ou quem exerce autoridade sobre eles? Não são as mulheres?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego também pode significar “pessoas” ou “seres humanos”; “homens” se ajusta melhor ao contraste com “mulheres” no fim do versículo.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e não é forte o vinho?”. O verbo grego pode significar tanto “ser forte” como “ter força”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες
  choice: Homens
  rationale: Vocativo plural de ἀνήρ; dirige-se explicitamente a homens e preserva a forma direta do discurso.
- source_word: μέγας
  choice: grande
  rationale: Mantém a simplicidade retórica do grego e pode abranger grandeza, importância e poder régio sem restringir o sentido.
- source_word: πολλοὶ οἱ ἄνθρωποι
  choice: são numerosos os homens
  rationale: Expressa naturalmente a ideia quantitativa de πολλοί e, no contexto, conserva o contraste entre homens e mulheres.
- source_word: ὁ οἶνος ἰσχύει
  choice: tem força o vinho
  rationale: ἰσχύω indica ter força ou poder. A formulação preserva a personificação retórica sem reduzir o sentido apenas ao teor alcoólico.
- source_word: δεσπόζων
  choice: os domina
  rationale: Comunica o exercício de domínio ou controle indicado por δεσπόζω, em formulação concisa e atual.
- source_word: κυριεύων
  choice: exerce autoridade sobre eles
  rationale: Distingue levemente o segundo particípio do primeiro e preserva o paralelismo de dois termos próximos, sem lhes impor uma diferença técnica.
- source_word: γυναῖκες
  choice: mulheres
  rationale: É o sentido comum do plural e não há elemento no versículo que o restrinja a esposas.
theological_decisions:
- issue: Contraste de gênero no argumento retórico
  choice: Conservar “homens” e “mulheres”.
  alternative: Traduzir ἄνθρωποι por “pessoas” ou “seres humanos”.
  rationale: Embora ἄνθρωποι possa ser genérico, o contraste explícito com γυναῖκες favorece aqui a referência aos homens; neutralizá-la enfraqueceria a lógica do argumento.
- issue: Relação entre δεσπόζων e κυριεύων
  choice: 'Traduzir com expressões próximas, mas distintas: “domina” e “exerce autoridade”.'
  alternative: Usar o mesmo verbo, “governa”, para ambos.
  rationale: O grego emprega dois particípios quase sinônimos para reforço retórico. A pequena diferenciação lexical preserva o paralelismo sem criar uma distinção doutrinária.
- issue: Referente de αὐτῶν
  choice: Manter o pronome plural “eles”, sem explicitar seus referentes.
  alternative: Substituir o pronome por uma enumeração como “o rei, os homens e o vinho”.
  rationale: O pronome grego remete naturalmente aos elementos mencionados, mas a formulação não os repete; conservar o pronome evita eliminar essa concisão e possível amplitude retórica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com ordem levemente retórica para acompanhar a cadência do grego. A repetição de “não” torna explícita em português a força interrogativa negativa que se estende pela série coordenada.
