  yaml_path: translation/deuterocanon/1_esdras/003/030.yaml
  text: And he alone[a], if he says to kill, they kill; if he says to release, they release.
translation:
  language: pt
  text: E, se ele estiver sozinho e disser para matar, eles matam; se disser para soltar, eles soltam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «se disser para deixar ir, eles deixam ir». O verbo grego pode significar soltar, deixar ir ou perdoar, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς εἰ μόνος ἐστίν
  choice: E ele sozinho
  rationale: A formulação conserva a ênfase em αὐτός e a ideia de singularidade expressa por μόνος, em português natural, sem acrescentar uma explicação sobre por que ele está sozinho.
- source_word: ἐὰν εἴπῃ
  choice: se disser
  rationale: Preserva o valor condicional geral da construção grega e soa natural em português contemporâneo.
- source_word: ἀποκτεῖναι / ἀποκτέννουσιν
  choice: que matem / eles matam
  rationale: O verbo significa matar. A oração com «que» expressa de modo idiomático o conteúdo da ordem, enquanto a repetição mantém o estilo direto e enfático do grego.
- source_word: ἀφεῖναι / ἀφίουσιν
  choice: que soltem / eles soltam
  rationale: «Soltar» conserva o sentido amplo de deixar ir ou pôr em liberdade e permite repetir o mesmo verbo nas duas formas, como no grego, sem restringi-lo necessariamente a perdão judicial.
