  source_fidelity: A redação «E ele sozinho» transforma a oração explícita εἰ μόνος ἐστίν («se estiver sozinho») em mera ênfase exclusiva. Embora a trilha inglesa a entenda como «he alone», o grego de Swete contém a condição, que deve ser conservada sem resolver a construção potencialmente abrupta.
  naturalness: «Se ele estiver sozinho e disser para matar» é português moderno e claro, evitando a sequência menos fluente «se estiver sozinho, se disser». O paralelismo conciso das duas ordens é mantido.
  terminology: «Matar» reproduz ἀποκτεῖναι sem introduzir conotação judicial. «Soltar» mantém adequadamente a amplitude de ἀφεῖναι no contexto; a nota registra alternativas lexicais, inclusive «perdoar».
