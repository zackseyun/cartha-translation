  yaml_path: translation/deuterocanon/1_esdras/003/023.yaml
  text: Men[a], does not wine prevail, since it compels one to act this way? And he became silent after saying this.
translation:
  language: pt
  text: Homens[a], o vinho não prevalece, já que obriga a agir assim? E, depois de dizer isso, ele se calou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais formal: “Ó homens”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: Homens
  rationale: Mantém o vocativo masculino dirigido aos ouvintes sem acrescentar o grau de cortesia social sugerido por “senhores”. A partícula ὦ é natural em grego, mas sua reprodução como “ó” soaria marcadamente solene no português atual.
- source_word: οὐχ ὑπερισχύει
  choice: não prevalece
  rationale: Preserva a pergunta retórica que espera resposta afirmativa e o sentido de possuir força superior ou levar vantagem, sem inserir um complemento que o grego não explicita.
- source_word: ὁ οἶνος
  choice: o vinho
  rationale: Equivalente lexical direto e natural.
- source_word: ὅτι οὕτως ἀναγκάζει ποιεῖν
  choice: já que obriga a agir assim
  rationale: ἀναγκάζει expressa coerção, e o infinitivo ποιεῖν permanece geral. A formulação evita acrescentar um objeto indefinido ausente do grego e conserva a relação causal de ὅτι.
- source_word: καὶ ἐσίγησεν
  choice: E ... ele se calou
  rationale: O aoristo indica que o orador encerrou sua fala; “se calou” é uma forma narrativa natural e direta em português.
- source_word: οὕτως εἴπας
  choice: depois de dizer isso
  rationale: Explicita naturalmente que a ação do particípio aoristo antecede o verbo principal, preservando οὕτως como referência ao que acaba de ser dito.
