  yaml_path: translation/deuterocanon/1_esdras/003/007.yaml
  text: And he will be seated second to Darius because of his wisdom[b][a], and he will be called a kinsman of Darius.
translation:
  language: pt
  text: E, por causa de sua sabedoria, ele ocupará o segundo lugar depois de Dario[a] e será chamado parente de Dario[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “terá assento em segundo lugar depois de Dario”. O verbo grego pode indicar tanto receber um assento quanto ser instalado numa posição hierárquica.'
    reason: lexical_alternative
  - marker: b
    text: “Parente” pode indicar um familiar propriamente dito ou um título honorífico da corte que expressava proximidade e favor do rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερος
  choice: o segundo lugar
  rationale: O adjetivo indica ordem ou posição; no contexto da corte, refere-se naturalmente à posição imediatamente inferior à de Dario.
- source_word: καθιεῖται
  choice: ocupará
  rationale: A forma verbal pode retratar alguém sendo sentado ou instalado numa posição. “Ocupará o segundo lugar” comunica em português corrente tanto o assento quanto a dignidade devida ao cargo, sem especificar além do grego.
- source_word: διὰ τὴν σοφίαν αὐτοῦ
  choice: por causa de sua sabedoria
  rationale: διά com acusativo expressa aqui a causa ou razão da posição concedida.
- source_word: συγγενής
  choice: parente
  rationale: Preserva o sentido familiar básico do termo grego e deixa aberta a possibilidade de ser parentesco real ou um título honorífico da corte.
- source_word: κληθήσεται
  choice: será chamado
  rationale: Tradução direta e natural do futuro passivo de καλέω.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e legibilidade brasileira. A formulação conserva a linguagem de hierarquia da corte e não decide se “parente” designa laço familiar literal ou condição honorífica.
