  text: And he sent and summoned all the nobles of Persia and Media[a], and the satraps and generals and local rulers and governors[b],
translation:
  language: pt
  text: E, tendo enviado, convocou todos os nobres da Pérsia e da Média, os sátrapas, os comandantes, os governantes locais e os altos oficiais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A sequência reúne títulos da administração imperial persa. O grego diz literalmente «tendo enviado, convocou», sem especificar quem ou o que foi enviado. «Governantes locais» também pode ser traduzido por «toparcas», e «altos oficiais», por «dignitários superiores».
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: ἐξαποστείλας
  choice: enviou mensageiros
  rationale: O particípio aoristo indica um envio anterior ou concomitante à convocação. Como o objeto não aparece no grego, explicita-se de modo natural o meio mais provável, sem o apresentar como certeza absoluta; a nota registra a forma mais literal.
- source_word: ἐκάλεσεν
  choice: convocou
  rationale: Em contexto régio e administrativo, indica chamar oficialmente à presença, mais forte e preciso que simplesmente “chamou” ou “convidou”.
- source_word: μεγιστᾶνας
  choice: nobres
  rationale: Designa os grandes ou principais homens do reino; “nobres” é corrente, digno e adequado ao contexto social.
- source_word: Περσίδος
  choice: Pérsia
  rationale: Forma geográfica convencional em português.
- source_word: Μηδείας
  choice: Média
  rationale: Forma tradicional portuguesa do nome da antiga região, distinta do substantivo comum pelo contexto e pela inicial maiúscula.
- source_word: σατράπας
  choice: sátrapas
  rationale: Preserva o título específico da administração persa, conhecido em português e historicamente mais preciso que uma paráfrase genérica.
- source_word: στρατηγοὺς
  choice: comandantes militares
  rationale: Comunica com clareza a função militar do termo sem limitar indevidamente o título ao posto moderno de general.
- source_word: τοπάρχας
  choice: governantes locais
  rationale: Expressa de modo compreensível a função dos dirigentes de distritos, evitando o pouco familiar “toparcas” no texto principal.
- source_word: ὑπάτους
  choice: altos oficiais
  rationale: O termo pode indicar pessoas de posição suprema e, em outros contextos, cônsules. Aqui, numa lista persa, “altos oficiais” preserva o nível hierárquico sem importar uma instituição especificamente romana.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário histórico preservado quando amplamente reconhecível. A coordenação com “bem como” organiza naturalmente a longa lista de cargos. A explicitação “mensageiros” favorece a fluência, enquanto a nota conserva a indeterminação formal do grego.
