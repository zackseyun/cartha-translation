  text: And many perished and were led astray and sinned because of women[a].
translation:
  language: pt
  text: E muitos pereceram, foram levados ao erro e pecaram por causa das mulheres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa das esposas”. O grego γυναῖκες pode significar tanto “mulheres” como “esposas”, conforme o contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώλοντο
  choice: pereceram
  rationale: O aoristo de ἀπόλλυμι indica que chegaram à ruína ou destruição; “pereceram” é conciso e preserva a gravidade sem especificar um agente.
- source_word: ἐσφάλησαν
  choice: foram desviados
  rationale: O passivo de σφάλλω pode indicar ser levado a cair, tropeçar ou errar. Nesta sequência moral, “foram desviados” comunica desorientação ética e preserva a forma passiva.
- source_word: ἡμάρτοσαν
  choice: pecaram
  rationale: Em contexto moral e religioso, “pecaram” transmite diretamente a força habitual de ἁμαρτάνω.
- source_word: διὰ τὰς γυναῖκας
  choice: por causa das mulheres
  rationale: διά com acusativo expressa causa. γυναῖκας pode designar “mulheres” ou “esposas”; “mulheres” mantém no texto principal o sentido mais amplo e transparente.
theological_decisions:
- issue: Possível generalização pejorativa em γυναῖκας
  choice: mulheres
  alternative: esposas
  rationale: O substantivo grego é lexicalmente ambíguo entre “mulheres” e “esposas”. Como a frase isolada não limita a referência às cônjuges, conserva-se a leitura mais ampla no texto e registra-se a alternativa em nota, sem suavizar nem restringir a retórica da fonte.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação tripla do grego foi preservada, bem como a ambiguidade lexical de γυναῖκες por meio de nota.
