  yaml_path: translation/deuterocanon/1_esdras/003/033.yaml
  text: and all his people and his forces obey him[a]. Besides this, he himself reclines and eats and drinks and sleeps[b];
translation:
  language: pt
  text: e todo o seu povo e as suas forças[a] lhe obedecem. Além disso, ele mesmo se reclina, come, bebe e dorme;[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os seus exércitos” em vez de “as suas forças”; o grego δυνάμεις pode designar forças militares em contexto régio.
    reason: lexical_alternative
  - marker: b
    text: O verbo traduzido por “se reclina” também pode significar “repousa” ou “se deita”, mas os verbos seguintes, “come” e “bebe”, sugerem a postura habitual à mesa.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ λαὸς αὐτοῦ
  choice: todo o seu povo
  rationale: λαός designa naturalmente o povo ou a população; esta opção evita especificar em excesso a condição política como súditos.
- source_word: αἱ δυνάμεις αὐτοῦ
  choice: as suas forças
  rationale: No contexto régio, δυνάμεις se refere mais naturalmente às forças militares; “forças” preserva a amplitude do termo grego.
- source_word: ἐνακούουσιν
  choice: lhe obedecem
  rationale: Embora ligado à ideia de ouvir, o verbo aqui expressa dar ouvidos à autoridade, isto é, obedecer; o pronome “lhe” representa o objeto implícito no contexto.
- source_word: πρὸς δὲ τούτοις
  choice: Além disso
  rationale: Expressa de modo natural em português a força aditiva da locução grega.
- source_word: ἀνάκειται
  choice: se reclina
  rationale: O verbo pode indicar estar reclinado, especialmente à mesa; os verbos seguintes, “come” e “bebe”, favorecem essa nuance.
- source_word: ἐσθίει καὶ πίνει καὶ καθεύδει
  choice: come, bebe e dorme
  rationale: A coordenação simples e idiomática conserva a sequência dos presentes gregos sem repetir desnecessariamente a conjunção em português.
