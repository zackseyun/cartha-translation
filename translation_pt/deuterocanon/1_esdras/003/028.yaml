  yaml_path: translation/deuterocanon/1_esdras/003/028.yaml
  text: They kill and are killed[a], and they do not disobey the king’s word; and if they are victorious, they bring everything to the king[b], and whatever else they plunder.
translation:
  language: pt
  text: Eles matam e são mortos e não desobedecem à ordem do rei; se vencem, levam tudo ao rei, inclusive o que saqueiam e todo o restante.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φονεύουσιν καὶ φονεύονται
  choice: matam e são mortos
  rationale: Mantém o paralelismo entre a voz ativa e a passiva e se ajusta ao contexto militar sem acrescentar a ideia de reciprocidade.
- source_word: τὸν λόγον τοῦ βασιλέως
  choice: à ordem do rei
  rationale: Neste contexto, λόγος designa a ordem ou determinação do rei; «ordem» comunica naturalmente o sentido idiomático em português.
- source_word: οὐ παραβαίνουσιν
  choice: não desobedecem
  rationale: Expressa de modo claro e corrente a ideia de não transgredir nem contrariar a ordem real.
- source_word: νικήσωσιν
  choice: vencem
  rationale: Equivalente moderno e conciso para obter vitória no contexto de combate.
- source_word: κομίζουσιν
  choice: levam
  rationale: Indica que entregam ou conduzem ao rei aquilo que obtiveram, sem impor a noção mais específica de retorno.
- source_word: προνομεύσωσιν
  choice: saqueiam
  rationale: O verbo se refere à obtenção de despojos de guerra; «saquear» é o equivalente corrente no contexto militar.
- source_word: τὰ ἄλλα πάντα
  choice: todo o restante
  rationale: Preserva a força abrangente da expressão grega e distingue os demais bens daquilo que foi saqueado.
