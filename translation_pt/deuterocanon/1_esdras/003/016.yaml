  register: Português moderno, digno e acessível, com legibilidade brasileira. A ordem narrativa e a repetição de καλέω foram preservadas. A nota mantém aberta a amplitude semântica de λόγους sem impor que o conteúdo seja apenas discurso ou argumentação formal.
