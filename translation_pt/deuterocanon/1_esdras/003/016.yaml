  text: And he said[a], “Call the young men, and they will declare their words.” And they were called, and they entered.
translation:
  language: pt
  text: 'E ele disse: “Chamem os jovens, e eles apresentarão suas palavras[a].” E eles foram chamados e entraram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “darão a conhecer suas declarações” ou “apresentarão seus argumentos”. O termo grego λόγους é amplo e pode se referir a palavras, declarações ou argumentos.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλέσατε
  choice: Chamem
  rationale: Imperativo aoristo plural de καλέω. “Chamem” é direto e natural em português, sem elevar desnecessariamente o registro como faria “convoquem”.
- source_word: τοὺς νεανίσκους
  choice: os jovens
  rationale: νεανίσκος designa jovens do sexo masculino. No contexto, “os jovens” é claro, natural e compatível com os participantes masculinos da narrativa.
- source_word: δηλώσουσιν
  choice: apresentarão
  rationale: O futuro de δηλόω pode significar tornar conhecido, declarar ou expor. No cenário de corte e competição, “apresentarão” comunica naturalmente a exposição pública do que eles têm a dizer.
- source_word: τοὺς λόγους αὐτῶν
  choice: suas palavras
  rationale: λόγοι é amplo e pode indicar palavras, declarações, razões ou argumentos. “Suas palavras” preserva essa amplitude, enquanto a nota registra alternativas contextualmente plausíveis.
- source_word: ἐκλήθησαν
  choice: foram chamados
  rationale: Aoristo passivo de καλέω. A tradução conserva a repetição lexical entre “Chamem” e “foram chamados” presente no grego.
- source_word: εἰσήλθοσαν
  choice: entraram
  rationale: Forma aorista de εἰσέρχομαι. “Entraram” é conciso, natural e adequado ao registro narrativo.
