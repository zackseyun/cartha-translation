lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Conector temporal e sequencial natural em português, preservando o avanço da narrativa.
- source_word: οἱ τρεῖς νεανίσκοι
  choice: os três jovens
  rationale: νεανίσκοι designa jovens do sexo masculino; no contexto, “os três jovens” é claro, natural e suficiente.
- source_word: οἱ σωματοφύλακες
  choice: os guarda-costas
  rationale: O composto grego designa aqueles encarregados da proteção física de uma pessoa; “guarda-costas” é o equivalente corrente em português.
- source_word: οἱ φυλάσσοντες
  choice: que protegiam
  rationale: O particípio presente tem força descritiva e indica sua função contínua; “protegiam” soa mais natural neste contexto do que repetir “guardavam”.
- source_word: τὸ σῶμα τοῦ βασιλέως
  choice: a pessoa do rei
  rationale: Embora σῶμα signifique literalmente “corpo”, aqui a expressão se refere ao próprio rei como pessoa sob proteção, uso bem expresso por “a pessoa do rei”.
- source_word: εἶπαν ἕτερος πρὸς τὸν ἕτερον
  choice: disseram uns aos outros
  rationale: Expressão recíproca idiomática em português, que preserva a troca mútua indicada pelo grego.
