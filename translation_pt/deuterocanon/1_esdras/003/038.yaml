lexical_decisions:
- source_word: αἱ γυναῖκες
  choice: As mulheres
  rationale: Tradução direta e natural do sujeito plural definido.
- source_word: ἐγέννησαν
  choice: deram à luz
  rationale: No contexto, expressa com clareza que as mulheres geraram e deram à luz os governantes, preservando o argumento sobre sua força.
- source_word: τὸν βασιλέα καὶ πάντα τὸν λαόν
  choice: o rei e todo o povo
  rationale: Mantém o alcance inclusivo de πάντα e a coordenação do grego.
- source_word: ὃς κυριεύει
  choice: que domina
  rationale: Preserva o singular gramatical do relativo e do verbo, cujo antecedente imediato é o coletivo 'povo', sem forçar uma reformulação plural.
- source_word: τῆς θαλάσσης καὶ τῆς γῆς
  choice: sobre o mar e a terra
  rationale: O verbo κυριεύω rege genitivo e aqui indica domínio; 'sobre' torna essa relação idiomática em português.
