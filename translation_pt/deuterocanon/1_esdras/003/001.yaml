  text: And King Dareios made a great banquet for all who were under him[a], and for all his household, and for all the nobles of Media and Persia[b],
translation:
  language: pt
  text: E o rei Dario ofereceu um grande banquete[a] a todos os que estavam debaixo de sua autoridade[b], a todos os de sua casa e a todos os nobres da Média e da Pérsia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “festa”. O termo grego indica uma recepção formal acompanhada de refeição, isto é, um banquete.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os que estavam debaixo dele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοχήν
  choice: banquete
  rationale: O termo designa uma recepção festiva, normalmente com refeição. “Banquete” comunica com naturalidade o caráter formal e régio do evento.
- source_word: τοῖς ὑπʼ αὐτόν
  choice: os que estavam debaixo de sua autoridade
  rationale: Preserva a ideia hierárquica da expressão grega sem restringi-la necessariamente a súditos em sentido político.
- source_word: οἰκογενέσιν
  choice: os de sua casa
  rationale: Abrange os membros da casa real, incluindo família e servidores, sem a limitação que “família” poderia sugerir.
- source_word: μεγιστᾶσιν
  choice: nobres
  rationale: Expressa de modo claro e digno os homens de alta posição ou grandes do reino.
- source_word: Μηδείας καὶ τῆς Περσίδος
  choice: da Média e da Pérsia
  rationale: Mantém os nomes das regiões mencionadas no grego, em vez de convertê-las nos respectivos povos.
- source_word: βασιλεὺς Δαρεῖος
  choice: rei Dario
  rationale: “Dario” é a forma portuguesa estabelecida e amplamente inteligível do nome grego Δαρεῖος.
