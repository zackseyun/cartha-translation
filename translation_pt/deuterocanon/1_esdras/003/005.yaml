  text: Let each of us speak one word that will prevail[a]; and whoever's statement is shown to be wiser than the other's, Darius the king will give him great gifts and great victory honors[b],
translation:
  language: pt
  text: Que cada um de nós diga uma palavra que prevalecerá[a]; e aquele cuja declaração se mostrar mais sábia que a do outro receberá do rei Dario grandes presentes e grandes honrarias pela vitória[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma declaração” ou “um argumento”. A palavra grega λόγον pode ter esses sentidos, além de “palavra”; a tradução literal preserva a forma concisa do desafio.
    reason: lexical_alternative
  - marker: b
    text: “Honrarias pela vitória” traduz ἐπινίκια, isto é, honras ou prêmios concedidos pela vitória; o termo se distingue dos “presentes” mencionados antes.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἴπωμεν
  choice: Que ... diga
  rationale: O subjuntivo exortativo da primeira pessoa do plural é expresso naturalmente em português por “Que ... diga”, mantendo a proposta feita pelo grupo.
- source_word: ἕκαστος ἡμῶν
  choice: cada um de nós
  rationale: 'Preserva de modo natural o sentido distributivo: cada participante deve falar individualmente.'
- source_word: ἕνα λόγον
  choice: uma palavra
  rationale: Mantém a forma concisa do grego e a possível fórmula do desafio; λόγος também pode significar declaração, argumento ou discurso, como esclarece a nota.
- source_word: ὃς ὑπερισχύσει
  choice: que prevaleça
  rationale: ὑπερισχύω comunica a ideia de prevalecer ou mostrar-se mais forte. O subjuntivo português encaixa-se naturalmente na proposta e evita impor uma nuance puramente material de vitória.
- source_word: οὗ ἂν φανῇ τὸ ῥῆμα αὐτοῦ
  choice: aquele cuja declaração se mostrar
  rationale: A construção relativa indefinida é vertida com naturalidade por “aquele cuja”; “se mostrar” preserva φανῇ sem afirmar um processo formal específico de julgamento.
- source_word: σοφώτερον τοῦ ἑτέρου
  choice: mais sábia que a do outro
  rationale: Preserva o comparativo σοφώτερον e o genitivo de comparação, com elipse portuguesa clara de “declaração”.
- source_word: δώσει αὐτῷ Δαρεῖος ὁ βασιλεὺς
  choice: receberá do rei Dario
  rationale: A mudança idiomática da voz ativa para a formulação receptiva mantém exatamente os participantes e a promessa, produzindo uma frase portuguesa mais fluida após “aquele cuja declaração”.
- source_word: δωρεὰς μεγάλας
  choice: grandes presentes
  rationale: Tradução direta e corrente de δωρεά, sem confundi-la com a categoria seguinte de recompensas honoríficas.
- source_word: ἐπινίκια μεγάλα
  choice: grandes honrarias pela vitória
  rationale: ἐπινίκια designa recompensas ou honras ligadas à vitória. “Honrarias pela vitória” distingue-as dos presentes já mencionados.
