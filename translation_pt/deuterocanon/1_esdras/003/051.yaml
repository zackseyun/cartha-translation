  yaml_path: translation/deuterocanon/1_esdras/003/051.yaml
  text: And now you do not believe me[a]. Is not the king great in his authority? Do not all the lands fear to touch him?
translation:
  language: pt
  text: E agora vocês não acreditam em mim. Não é grande o rei em sua autoridade? Não temem todas as terras tocar nele?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “pôr a mão nele”. O grego diz literalmente “tocar nele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ
  choice: acreditam
  rationale: O verbo pode significar “acreditar” ou “confiar”. Neste contexto argumentativo, “não acreditam em mim” expressa naturalmente que os ouvintes não aceitam a afirmação do orador.
- source_word: μέγας
  choice: grande
  rationale: Preserva o sentido amplo de grandeza, posição e poder do rei sem restringi-lo apenas à força.
- source_word: ἐξουσίᾳ
  choice: autoridade
  rationale: Expressa o direito e o poder reconhecido de governar; “poder” também seria possível, mas é menos específico.
- source_word: χῶραι
  choice: terras
  rationale: Mantém a referência ampla a territórios e povos sem sugerir necessariamente Estados nacionais modernos.
- source_word: εὐλαβοῦνται
  choice: têm medo
  rationale: O verbo envolve temor, cautela ou receio. Aqui o medo explica por que as terras não ousam tocar no rei.
- source_word: ἅψασθαι
  choice: tocar nele
  rationale: Reproduz o sentido lexical direto do grego, preservando também a possível conotação de atentar contra o rei.
