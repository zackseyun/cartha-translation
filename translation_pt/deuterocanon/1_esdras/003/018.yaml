base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/018.yaml
  text: It makes the mind of the king and of the orphan one[a], and that of the slave and that of the free, and that of the poor and that of the rich;
translation:
  language: pt
  text: Faz com que o rei e o órfão pensem do mesmo modo, assim como o escravo[a] e a pessoa livre, o pobre e o rico;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo doméstico”; o contraste com “a pessoa livre” indica provavelmente uma pessoa em condição de escravidão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: Faz com que
  rationale: Expressa de modo natural em português a ação causativa do presente grego.
- source_word: διάνοιαν μίαν
  choice: pensem do mesmo modo
  rationale: Comunica a ideia de tornar uma só a disposição mental de pessoas socialmente distintas, sem sugerir que elas literalmente compartilhem uma única mente.
- source_word: βασιλέως
  choice: rei
  rationale: Equivalente direto e habitual do termo grego.
- source_word: ὀρφανοῦ
  choice: órfão
  rationale: Preserva a condição social vulnerável contrastada com a do rei.
- source_word: οἰκέτου
  choice: escravo
  rationale: Embora possa designar um servo doméstico, o contraste explícito com a pessoa livre favorece a ideia de condição servil não livre.
- source_word: ἐλευθέρου
  choice: pessoa livre
  rationale: Torna explícito em português o uso substantivado do adjetivo e mantém o contraste de condição social.
- source_word: πένητος
  choice: pobre
  rationale: Termo socioeconômico corrente que forma o contraste direto com rico.
- source_word: πλουσίου
  choice: rico
  rationale: Equivalente direto e natural, em oposição a pobre.
theological_decisions:
- issue: Sentido de οἰκέτου no contraste de condição social
  choice: escravo
  alternative: servo; servo doméstico
  rationale: A oposição a ἐλευθέρου, “pessoa livre”, torna a falta de liberdade central ao contraste; “escravo” preserva essa força sem suavizá-la.
translation_notes:
  register: Português moderno, claro e digno, com formulação idiomática. A construção grega literalmente fala em tornar uma só a mente dos grupos contrastados; “pensem do mesmo modo” preserva o efeito nivelador com maior naturalidade.
