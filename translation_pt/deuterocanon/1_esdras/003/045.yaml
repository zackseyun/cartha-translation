base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/045.yaml
  text: And from this you must know that women rule over you. Do you not labor and toil[a], and give and bring everything to women?
translation:
  language: pt
  text: E disso vocês devem saber que as mulheres dominam sobre vocês. Acaso vocês não trabalham arduamente e labutam, e dão e levam tudo às mulheres?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esposas”, em lugar de “mulheres”; porém, o plural grego γυναῖκες aqui é mais amplo, razão pela qual “mulheres” aparece no texto principal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντεῦθεν
  choice: disso
  rationale: Retoma os exemplos anteriores como base da conclusão e preserva a força demonstrativa do grego.
- source_word: δεῖ ὑμᾶς γνῶναι
  choice: vocês devem saber
  rationale: Expressa com clareza a necessidade indicada por δεῖ e mantém a construção dirigida aos ouvintes.
- source_word: γυναῖκες
  choice: mulheres
  rationale: O plural grego tem sentido geral neste enunciado; embora possa significar 'esposas' em certos contextos, 'mulheres' preserva melhor a amplitude lexical.
- source_word: κυριεύουσιν ὑμῶν
  choice: dominam sobre vocês
  rationale: Reproduz a ideia forte de exercer domínio, sem enfraquecê-la nem recorrer a linguagem arcaica.
- source_word: πονεῖτε καὶ μοχθεῖτε
  choice: trabalham arduamente e labutam
  rationale: Mantém os dois verbos gregos e sua acumulação retórica, distinguindo trabalho árduo de esforço penoso.
- source_word: πάντα
  choice: tudo
  rationale: Forma natural em português que preserva o alcance abrangente do termo grego.
- source_word: δίδοτε καὶ φέρετε
  choice: dão e levam
  rationale: Conserva os dois atos verbais do grego, sem fundi-los em uma única ação.
