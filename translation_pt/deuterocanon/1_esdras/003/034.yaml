  verdict: revise
  source_fidelity: 'A ideia central está corretamente representada: os homens guardam o rei, não podem afastar-se para realizar o próprio trabalho e não lhe desobedecem. Contudo, «cuidar dos próprios afazeres» amplia levemente ποιεῖν τὰ ἔργα αὐτοῦ («fazer o seu trabalho») e a coordenação final pode tornar menos nítido que o último verbo permanece no plural («eles»).'
  naturalness: «Montam guarda ao redor dele» é natural, claro e adequado ao registro. A revisão conserva essa formulação e emprega uma pontuação que separa com clareza as duas afirmações finais.
