  yaml_path: translation/deuterocanon/1_esdras/003/034.yaml
  text: But they stand guard around him, and each one cannot go away and do his work, nor do they disobey him.
translation:
  language: pt
  text: Mas eles montam guarda ao redor dele, e nenhum deles pode sair para fazer o seu trabalho; tampouco lhe desobedecem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηροῦσιν
  choice: montam guarda
  rationale: No contexto de pessoas postadas ao redor do rei, expressa naturalmente a ideia de vigiar ou guardar, sem enfraquecer a função ativa do verbo.
- source_word: κύκλῳ περὶ αὐτόν
  choice: ao redor dele
  rationale: Reproduz de modo claro e idiomático a disposição circular indicada pela combinação grega.
- source_word: ἕκαστος
  choice: nenhum
  rationale: Sob a negação οὐ δύνανται, a construção portuguesa com “nenhum” comunica naturalmente que cada indivíduo está impedido de sair.
- source_word: τὰ ἔργα αὐτοῦ
  choice: os próprios afazeres
  rationale: “Afazeres” preserva o sentido amplo de tarefas ou trabalhos pessoais sem sugerir necessariamente emprego profissional.
- source_word: παρακούουσιν
  choice: desobedecem
  rationale: Neste contexto de autoridade régia, o verbo tem o sentido de não atender a uma ordem, isto é, desobedecer.
