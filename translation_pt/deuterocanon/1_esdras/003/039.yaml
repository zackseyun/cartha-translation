  text: and from them they came to be[a], and these women nourished the very men who planted the vineyards from which wine comes[b],
translation:
  language: pt
  text: e delas vieram a existir[a], e essas mulheres[b] alimentaram os próprios homens que plantaram as vinhas das quais vem o vinho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nasceram delas”. O grego diz mais literalmente: “vieram a existir delas”.'
    reason: lexical_alternative
  - marker: b
    text: O demonstrativo grego está no feminino e se refere especificamente a essas mulheres, não meramente a “essas coisas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ αὐτῶν
  choice: deles
  rationale: Com ἐξ e genitivo, a expressão indica origem. No contexto, o referente são as mulheres; “deles” retoma o grupo de modo natural em português sem alterar a relação de procedência.
- source_word: ἐγένοντο
  choice: vieram a existir
  rationale: Preserva a formulação ampla de γίνομαι, que aqui pode aludir ao nascimento sem restringir explicitamente o sentido a “nasceram”.
- source_word: αὗται
  choice: essas mulheres
  rationale: O demonstrativo feminino retoma especificamente as mulheres mencionadas no argumento. A explicitação do substantivo torna o referente claro em português.
- source_word: ἐξέθρεψαν
  choice: alimentaram
  rationale: O verbo pode abranger alimentar, nutrir e criar. “Alimentaram” é claro e natural, mantendo em primeiro plano o sustento dado pelas mulheres.
- source_word: αὐτοὺς τοὺς φυτεύσαντας
  choice: os próprios homens que plantaram
  rationale: A construção com o pronome seguido do particípio tem força enfática; “os próprios homens” conserva essa ênfase retórica.
- source_word: τοὺς ἀμπελῶνας
  choice: as vinhas
  rationale: “Vinhas” é a equivalência portuguesa corrente para ἀμπελῶνας neste contexto.
- source_word: ἐξ ὧν ὁ οἶνος γίνεται
  choice: das quais vem o vinho
  rationale: Expressa a origem do vinho nas vinhas e preserva o sentido amplo de γίνεται sem introduzir uma formulação técnica de produção.
theological_decisions:
- issue: Referente e força retórica do demonstrativo feminino αὗται
  choice: Explicitar “essas mulheres” no texto.
  alternative: Traduzir apenas por “essas” ou “elas”.
  rationale: A forma grega é feminina e, no contexto do discurso sobre o poder e a prioridade das mulheres, a explicitação preserva a lógica do argumento sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. Conserva-se a ambiguidade de ἐγένοντο mediante “vieram a existir”, e explicita-se o referente feminino de αὗται. A pontuação encerra o fragmento como versículo independente.
