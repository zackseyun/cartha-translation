  text: And truth remains and is strong forever[b][a], and lives and prevails forever and ever.
translation:
  language: pt
  text: E a verdade permanece e é forte para sempre, e vive e prevalece para todo o sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἀλήθεια
  choice: a verdade
  rationale: O artigo definido é natural em português e preserva a verdade como sujeito personificado de toda a sequência verbal.
- source_word: μένει
  choice: permanece
  rationale: Expressa continuidade de modo claro e atual, sem o tom mais tradicional de «habita» ou a explicitação interpretativa de «perdura».
- source_word: ἰσχύει
  choice: é forte
  rationale: Mantém a ideia de força e distingue este verbo de κρατεῖ, traduzido mais adiante por «prevalece».
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: É o equivalente temporal idiomático e claro em português.
- source_word: ζῇ
  choice: vive
  rationale: Preserva diretamente a personificação vigorosa da verdade.
- source_word: κρατεῖ
  choice: prevalece
  rationale: Comunica poder efetivo ou domínio sem confundi-lo com o anterior ἰσχύει.
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: para todo o sempre
  rationale: Reproduz em português corrente a expressão grega intensificada de duração ilimitada.
theological_decisions:
- issue: Personificação da verdade
  choice: Manter a verdade como sujeito de «permanece», «é forte», «vive» e «prevalece».
  alternative: Reduzir a personificação com uma formulação abstrata, como «a verdade é duradoura e poderosa».
  rationale: A sucessão de verbos finitos no grego confere à afirmação força retórica e quase hínica; preservá-la evita diluir o texto ou acrescentar uma identificação teológica não expressa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «e» conserva o ritmo cumulativo do grego; «para sempre» e «para todo o sempre» distinguem naturalmente as duas fórmulas temporais.
