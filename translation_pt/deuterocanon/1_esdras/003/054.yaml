base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/054.yaml
  text: And besides this[a], the king stared at her with his mouth open; and if she laughs at him, he laughs; but if she becomes angry with him, he flatters her so that she may be reconciled to him.
translation:
  language: pt
  text: Além disso, o rei olhava fixamente para ela, de boca aberta. Se ela ri dele[a], ele ri; mas, se fica zangada com ele, ele a lisonjeia para que ela se reconcilie com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ri com ele”. O dativo grego depois de “ri” admite mais de um sentido relacional.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς τούτοις
  choice: Além disso
  rationale: Conector idiomático que introduz mais um ponto no argumento e preserva a força cumulativa da expressão grega.
- source_word: χάσκων τὸ στόμα ... ἐθεώρει αὐτήν
  choice: olhava fixamente para ela, de boca aberta
  rationale: Mantém a imagem física vívida da boca aberta e expressa a atenção prolongada indicada por ἐθεώρει em português natural.
- source_word: ἐὰν γελάσῃ αὐτῷ, γελᾷ
  choice: Se ela ri dele, ele ri
  rationale: Preserva a repetição retórica de γελάω e traduz o dativo αὐτῷ como relação dirigida a ele, sem ocultar em nota a possibilidade de sentido associativo.
- source_word: πικρανθῇ ἐπʼ αὐτόν
  choice: se fica zangada com ele
  rationale: Expressa em linguagem corrente o ato de se irritar ou amargurar contra alguém.
- source_word: κολακεύει αὐτήν
  choice: ele a lisonjeia
  rationale: Traduz diretamente a ideia de usar palavras ou atitudes aduladoras para recuperar o favor dela.
- source_word: ὅπως διαλλαγῇ αὐτῷ
  choice: para que ela se reconcilie com ele
  rationale: Conserva o sentido relacional de restauração da boa disposição ou reconciliação, sem especificar indevidamente o modo.
