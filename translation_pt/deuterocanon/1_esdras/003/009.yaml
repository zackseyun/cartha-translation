base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/009.yaml
  text: And they said[a], “When the king rises, they will give him the writing; and the one whom the king and the three nobles of Persia judge to be the one whose word is wiser, to him the victory will be given[b], as it is written.”
translation:
  language: pt
  text: 'E disseram: “Quando o rei se levantar, entregarão a ele o texto[a]; e aquele cujo argumento[b] o rei e os três nobres da Pérsia julgarem mais sábio receberá a vitória, conforme está escrito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a carta” ou “o documento”.
    reason: lexical_alternative
  - marker: b
    text: 'O grego diz mais literalmente: “cuja palavra [ou declaração] é mais sábia”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθῇ
  choice: se levantar
  rationale: Expressa naturalmente o ato de o rei se erguer, possivelmente ao despertar, sem especificar além do que o grego permite.
- source_word: τὸ γράμμα
  choice: o texto escrito
  rationale: Refere-se ao que foi posto por escrito no contexto da disputa. A formulação evita sugerir necessariamente correspondência privada e preserva o sentido amplo de γράμμα.
- source_word: κρίνῃ
  choice: julgarem
  rationale: Mantém o caráter avaliativo e decisório do verbo no contexto da competição.
- source_word: μεγιστᾶνες
  choice: nobres
  rationale: Designa altos dignitários ou grandes senhores persas; “nobres” é claro, corrente e adequado ao ambiente da corte.
- source_word: Περσίδος
  choice: da Pérsia
  rationale: É a forma portuguesa natural para a referência ao domínio persa neste contexto.
- source_word: ὁ λόγος αὐτοῦ σοφώτερος
  choice: ter o argumento mais sábio
  rationale: No contexto, λόγος é a proposição ou argumentação de cada concorrente. “Argumento” torna essa função clara, enquanto a nota preserva a amplitude lexical e a formulação mais literal.
- source_word: τὸ νῖκος
  choice: a vitória
  rationale: Reproduz diretamente o sentido de νῖκος, sem convertê-lo indevidamente no prêmio associado à vitória.
- source_word: καθὼς γέγραπται
  choice: conforme está escrito
  rationale: Preserva a fórmula do perfeito passivo, que remete ao regulamento previamente registrado por escrito.
