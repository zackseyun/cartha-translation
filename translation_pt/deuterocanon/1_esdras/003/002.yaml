  text: and to all the satraps and generals and governors under him[a], from India to Ethiopia, in the one hundred twenty-seven satrapies.
translation:
  language: pt
  text: e a todos os sátrapas, generais e governadores locais que estavam sob sua autoridade, desde a Índia até a Etiópia, nas cento e vinte e sete satrapias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por todas as cento e vinte e sete províncias». O grego emprega um termo administrativo persa, aqui traduzido por «satrapias» em correspondência com «sátrapas».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σατράπαις
  choice: sátrapas
  rationale: Preserva o título administrativo persa específico e mantém a relação lexical com «satrapias» no fim do versículo.
- source_word: στρατηγοῖς
  choice: generais
  rationale: O termo designa com frequência chefes militares; «generais» é uma equivalência moderna, clara e natural.
- source_word: τοπάρχαις
  choice: governadores locais
  rationale: Designa governantes de distritos ou territórios locais; a expressão comunica a função sem recorrer ao tecnicismo pouco conhecido «toparcas».
- source_word: τοῖς ὑπʼ αὐτόν
  choice: que estavam sob sua autoridade
  rationale: Expressa com clareza a subordinação desses oficiais ao rei, sem acrescentar uma relação mais específica do que a indicada pelo grego.
- source_word: ἀπὸ τῆς Ἰνδικῆς μέχρι Αἰθιοπίας
  choice: desde a Índia até a Etiópia
  rationale: Reproduz naturalmente a fórmula geográfica que indica a extensão do império.
- source_word: ἐν ταῖς ἑκατὸν εἴκοσι ἑπτὰ σατραπείαις
  choice: nas cento e vinte e sete satrapias
  rationale: Mantém o termo administrativo persa e sua correspondência com «sátrapas», preservando a coloração histórica do texto.
