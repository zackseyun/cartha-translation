lexical_decisions:
- source_word: ἐξηγέρθη
  choice: acordou
  rationale: O aoristo passivo de ἐξεγείρω tem aqui sentido intransitivo, referindo-se ao despertar do sono. “Acordou” é natural e adequado ao contexto narrativo.
- source_word: λαβόντες
  choice: eles pegaram
  rationale: O particípio aoristo é expresso como verbo finito para dar fluidez à sequência narrativa, sem perder a anterioridade lógica da ação.
- source_word: τὸ γράμμα
  choice: a carta
  rationale: γράμμα designa aqui o escrito preparado anteriormente para ser apresentado ao rei. “Carta” é uma opção corrente e específica no contexto.
- source_word: ἔδωκαν αὐτῷ
  choice: entregaram-na a ele
  rationale: “Entregaram” expressa naturalmente o ato de dar o escrito ao rei; o pronome retoma “a carta” de forma clara.
- source_word: ἀνέγνω
  choice: ele a leu
  rationale: O objeto está implícito no grego e é explicitado em português pelo pronome “a”, que retoma “a carta”.
