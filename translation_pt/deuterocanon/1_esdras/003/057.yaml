base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/057.yaml
  text: Men[a], are not women strong? Great is the earth, and high is heaven, and swift in its course is the sun, because it turns in the circuit of heaven.
translation:
  language: pt
  text: Homens, não são fortes as mulheres? Grande é a terra, alto é o céu, e veloz em seu curso é o sol, porque gira no circuito do céu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois gira no círculo do céu”.'
    reason: Alternativa lexical que preserva “pois” para ὅτι e “círculo” para κύκλος.
lexical_decisions:
- source_word: Ἄνδρες
  choice: Homens
  rationale: Vocativo plural dirigido ao público; preserva o tratamento masculino direto e a força retórica do grego.
- source_word: οὐκ ἰσχυραὶ αἱ γυναῖκες
  choice: não são fortes as mulheres?
  rationale: A cláusula é entendida, no contexto, como pergunta retórica. “Fortes” expressa o sentido básico de ἰσχυραί, e a ordem mantém certa ênfase retórica sem deixar de ser compreensível em português.
- source_word: μεγάλη ἡ γῆ
  choice: Grande é a terra
  rationale: A ordem predicativo-sujeito conserva a elevação e o paralelismo retórico do original.
- source_word: ὑψηλὸς ὁ οὐρανός
  choice: alto é o céu
  rationale: “Céu” corresponde naturalmente a οὐρανός neste contexto cosmológico; a ordem do grego é mantida para preservar o paralelismo.
- source_word: ταχὺς τῷ δρόμῳ ὁ ἥλιος
  choice: veloz em seu curso é o sol
  rationale: δρόμος indica aqui o curso ou trajeto do sol, não uma corrida literal. “Veloz em seu curso” preserva a imagem de movimento e a ordem enfática.
- source_word: ὅτι στρέφεται
  choice: porque gira
  rationale: ὅτι apresenta a razão, e “porque” explicita naturalmente a relação causal. “Gira” traduz στρέφεται sem impor uma descrição astronômica moderna.
- source_word: ἐν τῷ κύκλῳ τοῦ οὐρανοῦ
  choice: no circuito do céu
  rationale: κύκλος pode indicar círculo ou circuito; “circuito” comunica o percurso celeste sem especificar em excesso a cosmologia pressuposta.
