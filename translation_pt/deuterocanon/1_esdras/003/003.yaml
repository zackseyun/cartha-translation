base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/003.yaml
  text: And they ate and drank[a], and when they were filled, they departed. But Darius the king went into his bedchamber and slept[b], and then awoke.
translation:
  language: pt
  text: Eles comeram e beberam e, depois de se saciarem, foram embora.[a] O rei Dario, porém, retirou-se para o quarto, dormiu e depois despertou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O mesmo verbo grego é usado em seguida para dizer que Dario “se retirou” para o quarto.
    reason: lexical_connection
lexical_decisions:
- source_word: ἐφάγοσαν καὶ ἐπίοσαν
  choice: comeram e beberam
  rationale: Os aoristos apresentam ações narrativas simples e coordenadas; a formulação direta preserva o sentido sem acrescentar a ideia de banquete.
- source_word: ἐμπλησθέντες
  choice: depois de se saciarem
  rationale: O particípio indica que ficaram plenamente satisfeitos com a comida e a bebida. “Saciaram-se” conserva essa imagem concreta e soa natural em português.
- source_word: ἀνέλυσαν
  choice: foram embora
  rationale: No contexto do fim da refeição ou reunião, o verbo indica que o grupo se retirou. A expressão é clara e corrente.
- source_word: ἀνέλυσεν εἰς τὸν κοιτῶνα
  choice: retirou-se para o quarto
  rationale: Aqui o mesmo verbo descreve Dario recolhendo-se ao aposento destinado ao sono. “Retirou-se para o quarto” distingue naturalmente esta ação da partida dos demais.
- source_word: ἐκοιμήθη
  choice: dormiu
  rationale: O verbo, neste contexto, expressa de modo simples que Dario dormiu; não é necessário explicitar que se deitou ou adormeceu.
- source_word: ἔξυπνος ἐγένετο
  choice: depois despertou
  rationale: A expressão significa literalmente “tornou-se desperto”. A tradução idiomática mantém a progressão narrativa.
- source_word: ὁ δὲ Δαρεῖος ὁ βασιλεύς
  choice: O rei Dario, porém
  rationale: δέ assinala a mudança do grupo para Dario individualmente. “Porém” preserva essa transição leve sem sugerir forte oposição.
