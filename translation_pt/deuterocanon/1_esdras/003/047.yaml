  yaml_path: translation/deuterocanon/1_esdras/003/047.yaml
  text: and he watches for the lion[a], and walks in darkness; and whenever he steals and snatches and breaks in[c][b], he brings it to his beloved.
translation:
  language: pt
  text: e observa o leão[a] e anda na escuridão; e, sempre que furta, arrebata e arromba para roubar[b], leva o que roubou à mulher amada[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contempla o leão”. O verbo grego pode indicar olhar atentamente ou observar; o contexto também admite a ideia de ficar de olho nele.
    reason: lexical_alternative
  - marker: b
    text: O último verbo ligado ao roubo refere-se a furtar mediante entrada clandestina ou arrombamento, especialmente em uma casa.
    reason: lexical_alternative
  - marker: c
    text: Ou “à sua amada” ou “à sua amante”. O termo grego designa uma mulher amada em sentido romântico.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: observa
  rationale: O verbo indica olhar ou contemplar com atenção. “Observa” preserva esse sentido sem acrescentar necessariamente a ideia de esperar ou vigiar.
- source_word: τὸν λέοντα
  choice: o leão
  rationale: Mantém o artigo definido do grego e a vivacidade da imagem.
- source_word: ἐν σκότει βαδίζει
  choice: anda na escuridão
  rationale: Reproduz diretamente a imagem grega em linguagem natural e digna.
- source_word: κλέψῃ
  choice: furta
  rationale: Expressa a apropriação ilícita feita às escondidas e ajuda a distingui-la do ato mais violento indicado pelo verbo seguinte.
- source_word: ἁρπάσῃ
  choice: arrebata
  rationale: Conserva a ideia de tomar ou carregar algo com rapidez ou força, sem restringir o sentido a uma modalidade jurídica específica.
- source_word: κλωποδυτήσῃ
  choice: invade uma casa para roubar
  rationale: O verbo raro se refere ao furto clandestino, especialmente mediante entrada em uma casa. A formulação explicita essa nuance em português corrente.
- source_word: τῇ ἐρωμένῃ
  choice: à mulher amada
  rationale: O particípio feminino designa uma mulher amada em sentido romântico. Esta escolha torna explícito o gênero gramatical e evita dar ao termo uma conotação sexual maior do que a exigida pelo contexto.
- source_word: ἀποφέρει
  choice: leva o que conseguiu
  rationale: O verbo indica levar algo até alguém. Como o objeto não está expresso no grego, “o que conseguiu” recupera naturalmente os bens obtidos nos atos anteriores sem especificá-los além do contexto.
