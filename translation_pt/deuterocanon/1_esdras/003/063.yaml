  yaml_path: translation/deuterocanon/1_esdras/003/063.yaml
  text: and with her there is no partiality or distinction, but she does what is righteous apart from all that is unjust and evil; and all approve of her works,
translation:
  language: pt
  text: e com ela não há parcialidade[a] nem distinção, mas ela faz o que é justo, à parte de tudo o que é injusto e mau[b]; e todos aprovam as obras dela,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “receber rostos”, expressão que significa favorecer pessoas ou agir com parcialidade.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “longe de todos os injustos e maus”. A expressão grega pode indicar separação de tudo o que é injusto e mau ou, mais pessoalmente, de pessoas injustas e más.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρʼ αὐτῇ
  choice: junto dela
  rationale: Expressa o que se verifica em relação à figura feminina personificada, sem restringir a frase ao sentido espacial de “na presença dela”.
- source_word: λαμβάνειν πρόσωπα
  choice: parcialidade
  rationale: Traduz de modo natural o sentido ético do idiomatismo grego “receber rostos”, isto é, favorecer alguém em razão da pessoa.
- source_word: διαφορά
  choice: distinção
  rationale: Mantém o paralelismo com “parcialidade” e comunica a ideia de estabelecer diferenças entre pessoas, sem acrescentar conotações modernas específicas.
- source_word: τὰ δίκαια
  choice: o que é justo
  rationale: O neutro plural designa ações ou coisas justas; a formulação portuguesa é clara e preserva a qualidade moral.
- source_word: ποιεῖ
  choice: faz
  rationale: Equivalente direto e natural, adequado ao objeto “o que é justo”.
- source_word: ἀπὸ πάντων τῶν ἀδίκων καὶ πονηρῶν
  choice: à parte de tudo o que é injusto e mau
  rationale: Preserva o valor de separação de ἀπό e deixa no texto principal a leitura impessoal favorecida pelo contraste moral, sem ocultar a possível referência a pessoas.
- source_word: εὐδοκοῦσι
  choice: aprovam
  rationale: Neste contexto avaliativo, exprime naturalmente a satisfação ou aprovação diante das obras dela.
- source_word: τοῖς ἔργοις αὐτῆς
  choice: as obras dela
  rationale: Mantém a referência feminina e traduz ἔργα de forma formal, clara e corrente.
theological_decisions:
- issue: Personificação feminina do sujeito
  choice: Manter as formas femininas “dela” e “ela”
  alternative: Substituir os pronomes pelo substantivo antecedente ou empregar formas impessoais
  rationale: As formas gregas são femininas e o contexto personifica o sujeito; conservar o gênero preserva a textura literária e teológica sem identificar além do que o contexto permite.
- issue: Referente de τῶν ἀδίκων καὶ πονηρῶν
  choice: Empregar no texto principal a leitura impessoal, “tudo o que é injusto e mau”, com nota sobre a alternativa pessoal
  alternative: “todos os injustos e maus”
  rationale: Os adjetivos substantivados podem apontar para coisas ou pessoas. O contraste com “o que é justo” favorece a leitura impessoal, mas a nota conserva a ambiguidade genuína.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A estrutura coordenada e o ponto e vírgula preservam o andamento do grego; “à parte de” mantém o sentido de separação e a nota registra a ambiguidade do referente.
