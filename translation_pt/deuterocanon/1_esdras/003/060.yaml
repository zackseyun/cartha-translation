base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/060.yaml
  text: All the earth calls on truth[a], and heaven blesses her; and all works shake and tremble[b], and with her there is nothing unjust.
translation:
  language: pt
  text: Toda a terra invoca a verdade[a], e o céu a abençoa; todas as obras se agitam e tremem, e com ela[b] não há nada injusto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego pode ser entendido como “chama a verdade”, “clama pela verdade” ou “invoca a verdade”; o verbo pode expressar aclamação ou invocação da verdade personificada.
    reason: lexical_alternative
  - marker: b
    text: Nesta oração, o texto grego traz literalmente “com ele/isso” (μετʼ αὐτοῦ), embora as referências anteriores à verdade sejam femininas. A tradução segue o referente indicado pelo contexto.
    reason: grammatical_irregularity
lexical_decisions:
- source_word: πᾶσα ἡ γῆ
  choice: Toda a terra
  rationale: γῆ pode significar “terra” ou “região”; em paralelo com “o céu”, a expressão tem alcance cósmico, bem preservado por “toda a terra”.
- source_word: τὴν ἀλήθειαν
  choice: a verdade
  rationale: ἀλήθεια é personificada no contexto. “A verdade” mantém tanto o sentido abstrato quanto a personificação, sem acrescentar uma interpretação teológica específica.
- source_word: καλεῖ
  choice: invoca
  rationale: O verbo pode significar chamar, aclamar ou invocar. “Invoca” produz uma frase natural em português e expressa uma ação dirigida à verdade personificada; a ambiguidade lexical é registrada em nota.
- source_word: ὁ οὐρανὸς αὐτὴν εὐλογεῖ
  choice: o céu a abençoa
  rationale: A tradução conserva o singular de οὐρανός, o sentido bíblico corrente de εὐλογεῖ e a referência feminina de αὐτήν à verdade.
- source_word: πάντα τὰ ἔργα
  choice: todas as obras
  rationale: ἔργα significa literalmente “obras” e pode abranger tudo quanto foi feito ou criado. A opção mantém a amplitude sem explicitar “coisas criadas”, interpretação possível mas não obrigatória.
- source_word: σείεται καὶ τρέμει
  choice: se agitam e tremem
  rationale: Os dois verbos descrevem movimento e temor intensos. A concordância plural é necessária em português, embora o grego use verbos no singular com sujeito neutro plural.
- source_word: μετʼ αὐτοῦ
  choice: com ela
  rationale: O pronome grego transmitido é masculino ou neutro, mas o sentido contextual aponta para ἀλήθεια, substantivo feminino. O texto principal segue esse referente, e a irregularidade gramatical é indicada em nota.
- source_word: ἄδικον οὐδέν
  choice: não há nada injusto
  rationale: A formulação é natural em português e preserva o sentido direto de que nenhuma injustiça se encontra com a verdade.
theological_decisions:
- issue: Personificação da verdade
  choice: Manter a referência feminina à verdade (“a”, “ela”)
  alternative: Tratar a verdade de modo estritamente impessoal
  rationale: O versículo apresenta a verdade como destinatária da invocação e da bênção cósmicas. O feminino é também natural em português e conserva essa personificação sem transformá-la numa identificação doutrinária.
- issue: Discordância do pronome na oração final
  choice: Traduzir conforme o referente contextual, “com ela”, com nota
  alternative: Traduzir literalmente “com ele/isso”
  rationale: μετʼ αὐτοῦ não concorda formalmente com ἀλήθεια, mas a sequência do discurso favorece a verdade como referente. A nota preserva a forma efetivamente transmitida, evitando ocultar a tensão gramatical.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A pontuação conserva o encadeamento solene do grego; a personificação é mantida sem capitalização editorial de “verdade”.
