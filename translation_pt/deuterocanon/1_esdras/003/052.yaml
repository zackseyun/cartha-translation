lexical_decisions:
- source_word: ἐθεώρουν
  choice: Eu o observava
  rationale: O imperfeito pode ser primeira pessoa do singular ou terceira do plural. O contexto do discurso favorece a primeira pessoa; “observava” preserva o aspecto durativo melhor que um simples “vi”.
- source_word: αὐτὸν
  choice: o
  rationale: Mantém o pronome masculino acusativo do grego sem explicitar um referente que o versículo não nomeia.
- source_word: Ἀπάμην
  choice: Apame
  rationale: Forma portuguesa transliterada do nome grego Ἀπάμη; “Apama” também ocorre como forma tradicional.
- source_word: θυγατέρα
  choice: filha
  rationale: Equivalente direto e natural do termo de parentesco.
- source_word: Βαρτάκου
  choice: Bartaco
  rationale: Transliteração adaptada à morfologia e à ortografia portuguesas do nome próprio grego.
- source_word: τοῦ θαυμαστοῦ
  choice: o Admirável
  rationale: Conserva o epíteto substantivado aplicado a Bartaco, sem presumir que seja título oficial; a inicial maiúscula sinaliza seu uso epitético.
- source_word: παλλακὴν
  choice: concubina
  rationale: Expressa a condição específica indicada pelo grego, com mais precisão histórica que “amante”.
- source_word: καθημένην
  choice: sentada
  rationale: Reproduz o particípio feminino que descreve a postura de Apame.
- source_word: ἐν δεξιᾷ τοῦ βασιλέως
  choice: à direita do rei
  rationale: Expressão portuguesa natural que preserva tanto a localização quanto a possível conotação de posição privilegiada.
