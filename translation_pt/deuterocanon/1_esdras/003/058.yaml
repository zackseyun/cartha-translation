  text: e corre de volta para o seu próprio lugar em um só dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e volta ao seu próprio lugar em um único dia». O verbo grego ressalta o movimento rápido de retorno; por isso, «corre de volta» foi mantido no texto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: torna a
  rationale: O advérbio marca repetição ou retorno; com o verbo de movimento, «torna a correr» expressa naturalmente em português a ideia de correr de volta.
- source_word: ἀποτρέχει
  choice: correr para o seu próprio lugar
  rationale: O verbo composto descreve movimento rápido para longe ou de volta. «Correr» preserva a vivacidade e a rapidez do grego, enquanto o destino expresso a seguir deixa claro o sentido de retorno.
- source_word: εἰς τὸν ἑαυτοῦ τόπον
  choice: para o seu próprio lugar
  rationale: «Lugar» traduz τόπος, e «seu próprio» conserva a força reflexiva de ἑαυτοῦ sem perder naturalidade.
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: num só dia
  rationale: A expressão indica que o movimento se completa no espaço de um dia; «num só dia» é clara, corrente e mantém a ênfase da unidade temporal.
