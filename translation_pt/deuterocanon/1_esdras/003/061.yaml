  terminology: “Injusto/injustiça” conserva de modo apropriado a ligação lexical entre ἄδικος e ἀδικία. “Filhos dos homens”, “obras”, “verdade” e “perecerão” são escolhas adequadas e as notas estão corretamente ancoradas.
