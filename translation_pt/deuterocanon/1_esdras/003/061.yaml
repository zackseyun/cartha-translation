base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/061.yaml
  text: Wine is unjust[a], the king is unjust, women are unjust, all the sons of men are unjust, and all their works are unjust—all such things. And there is no truth in them[b], and in their injustice they will perish.
translation:
  language: pt
  text: O vinho é injusto, o rei é injusto, as mulheres são injustas, todos os filhos dos homens[a] são injustos, e todas as suas obras são injustas — todas as coisas desse tipo.[b] E não há verdade neles, e, em sua injustiça, eles perecerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega “filhos dos homens” é uma maneira idiomática de se referir à humanidade.
    reason: cultural_note
  - marker: b
    text: Ou “todas essas coisas” ou “tudo o que é desse tipo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄδικος / ἄδικοι / ἄδικα
  choice: injusto / injustos / injustas
  rationale: Mantém a repetição enfática do grego e a ligação lexical com ἀδικίᾳ (“injustiça”) no fim do versículo, sem intensificar o sentido para “perverso”.
- source_word: οἶνος
  choice: vinho
  rationale: Equivalente direto e natural para a bebida personificada no argumento.
- source_word: βασιλεύς
  choice: o rei
  rationale: Preserva o artigo definido grego e a figura singular representativa.
- source_word: γυναῖκες
  choice: as mulheres
  rationale: O contexto não restringe o substantivo a mulheres casadas; por isso, “mulheres” é preferível a “esposas”.
- source_word: υἱοὶ τῶν ἀνθρώπων
  choice: os filhos dos homens
  rationale: Reproduz a expressão grega explicitamente marcada por gênero e conserva sua forma idiomática, esclarecida em nota.
- source_word: ἔργα
  choice: obras
  rationale: Termo amplo e digno que abrange aquilo que as pessoas fazem ou produzem.
- source_word: τὰ τοιαῦτα
  choice: as coisas desse tipo
  rationale: Expressa a força qualitativa de τοιαῦτα como resumo dos elementos anteriores; “todas” traduz o πάντα precedente.
- source_word: ἀλήθεια
  choice: verdade
  rationale: Tradução direta que preserva o contraste entre verdade e injustiça.
- source_word: ἀδικίᾳ
  choice: injustiça
  rationale: Conserva a continuidade vocabular e conceitual com as formas de ἄδικος repetidas antes.
- source_word: ἀπολοῦνται
  choice: perecerão
  rationale: Traduz naturalmente o futuro médio/passivo sem especificar um agente externo de destruição.
theological_decisions:
- issue: Expressão antropológica marcada por gênero
  choice: os filhos dos homens
  alternative: os seres humanos
  rationale: A formulação conserva a imagem e o gênero gramatical explícitos no grego, enquanto a nota informa ao leitor que se trata de uma expressão referente à humanidade em geral.
- issue: Alcance do juízo sobre mulheres e humanidade
  choice: Preservar as afirmações abrangentes e paralelas do texto
  alternative: Atenuar com qualificadores como “algumas” ou interpretar “mulheres” como “esposas”
  rationale: O grego apresenta afirmações universais no contexto do discurso; inserir restrições resolveria ou suavizaria uma tensão que o texto mantém.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de “injusto” foi mantida por ser estrutural ao argumento. Os marcadores foram posicionados junto às expressões efetivamente explicadas pelas notas.
