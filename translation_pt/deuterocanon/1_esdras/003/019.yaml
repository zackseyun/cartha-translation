  yaml_path: translation/deuterocanon/1_esdras/003/019.yaml
  text: and it turns every mind to feasting and gladness[b][a], and one remembers no sorrow and no debt.
translation:
  language: pt
  text: e dirige a mente de todos[a] para o banquete e a alegria, e ninguém se lembra de tristeza alguma nem de dívida alguma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo pensamento”.
    reason: lexical_alternative
  - marker: b
    text: Ou “nada que seja devido”. A palavra grega traduzida por “dívida” também pode abranger obrigações em sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαν διάνοιαν
  choice: toda mente
  rationale: διάνοια pode designar mente, entendimento ou pensamento. “Toda mente” conserva a força distributiva de πᾶσαν e a generalidade da afirmação.
- source_word: μεταστρέφει
  choice: volta
  rationale: O verbo indica fazer voltar ou mudar de direção. “Volta ... para” preserva a imagem de reorientação sem intensificá-la como transformação completa.
- source_word: εἰς εὐωχίαν
  choice: para o banquete
  rationale: εὐωχία se refere à celebração festiva, especialmente ao comer e beber em um banquete. “Banquete” mantém esse aspecto concreto.
- source_word: καὶ εὐφροσύνην
  choice: e a alegria
  rationale: εὐφροσύνη expressa alegria, contentamento ou júbilo. “Alegria” é claro, atual e combina naturalmente com “banquete”.
- source_word: οὐ μέμνηται
  choice: ninguém se lembra
  rationale: Embora o grego use um verbo singular sem sujeito expresso, o sentido é uma generalização sobre a pessoa afetada. A formulação impessoal portuguesa evita introduzir gênero e não atribui ao vinho o ato semanticamente impróprio de lembrar.
- source_word: πᾶσαν λύπην
  choice: tristeza alguma
  rationale: λύπη abrange tristeza, pesar e aflição. Na construção negativa, “tristeza alguma” reproduz naturalmente em português a abrangência de πᾶσαν.
- source_word: πᾶν ὀφείλημα
  choice: dívida alguma
  rationale: ὀφείλημα significa literalmente dívida ou aquilo que é devido. “Dívida” mantém o sentido mais direto, enquanto a nota registra a possível extensão a obrigações em geral.
