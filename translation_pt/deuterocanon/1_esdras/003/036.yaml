  yaml_path: translation/deuterocanon/1_esdras/003/036.yaml
  text: But the third[a], the one who spoke about women and about the truth—this was Zorobabel—began to speak,
translation:
  language: pt
  text: 'Mas o terceiro, aquele que havia falado sobre as mulheres e sobre a verdade — este era Zorobabel — começou a falar:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ δὲ τρίτος
  choice: Mas o terceiro
  rationale: Preserva o contraste introduzido por δέ e o ordinal τρίτος, sem acrescentar «homem», que não está explícito no grego.
- source_word: ὁ εἴπας
  choice: aquele que havia falado
  rationale: O particípio aoristo substantivado identifica o terceiro por sua fala anterior; o mais-que-perfeito composto torna clara essa anterioridade em português narrativo.
- source_word: περὶ τῶν γυναικῶν καὶ τῆς ἀληθείας
  choice: sobre as mulheres e sobre a verdade
  rationale: Traduz diretamente περί com genitivo e repete «sobre» para manter distintos e equilibrados os dois temas.
- source_word: οὗτός ἐστιν Ζοροβαβέλ
  choice: este era Zorobabel
  rationale: Mantém a identificação parentética; embora o grego use o presente ἐστιν, o imperfeito é natural na sequência narrativa portuguesa e não altera a identificação.
- source_word: Ζοροβαβέλ
  choice: Zorobabel
  rationale: Forma portuguesa corrente que também representa de perto o nome grego Ζοροβαβέλ.
- source_word: ἤρξατο λαλεῖν
  choice: começou a falar
  rationale: Equivalente natural e próximo da construção ingressiva ἄρχομαι seguida de infinitivo.
