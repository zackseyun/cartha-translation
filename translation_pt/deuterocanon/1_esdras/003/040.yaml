  yaml_path: translation/deuterocanon/1_esdras/003/040.yaml
  text: And these make the garments of men[a], and these bring glory to men, and men cannot exist apart from women.
translation:
  language: pt
  text: E são elas que fazem as roupas dos homens, são elas que trazem glória aos homens, e os homens não podem existir sem as mulheres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não podem ser sem as mulheres”. O infinitivo grego é literalmente “ser”; “existir” explicita em português o alcance amplo da afirmação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὗται
  choice: elas
  rationale: O demonstrativo feminino retoma as mulheres mencionadas no contexto. A repetição de “são elas” preserva a ênfase retórica do grego e soa natural em português.
- source_word: ποιοῦσιν τὰς στολὰς
  choice: fazem as roupas
  rationale: O verbo indica produção ou confecção, e στολαί designa peças de vestuário sem exigir o sentido mais restrito de “vestes solenes” ou “mantos”.
- source_word: ποιοῦσιν δόξαν
  choice: trazem glória
  rationale: A expressão grega é literalmente próxima de “fazem glória”, mas essa construção não é idiomática em português. “Trazem glória” conserva o sentido de conferir honra, distinção ou esplendor e mantém a força elevada de δόξα.
- source_word: οἱ ἄνθρωποι
  choice: os homens
  rationale: Embora ἄνθρωποι possa designar seres humanos em geral, o contraste explícito com τῶν γυναικῶν favorece aqui a referência aos homens em relação às mulheres.
- source_word: οὐ δύνανται εἶναι
  choice: não podem existir
  rationale: “Não podem existir” expressa com clareza a afirmação ampla do texto. O infinitivo εἶναι é literalmente “ser/estar”, ambiguidade registrada em nota.
- source_word: χωρὶς τῶν γυναικῶν
  choice: sem as mulheres
  rationale: É a forma mais direta e idiomática de traduzir a ideia de ausência ou separação expressa por χωρίς.
theological_decisions:
- issue: Referência de gênero de οἱ ἄνθρωποι em contraste com τῶν γυναικῶν
  choice: os homens
  alternative: as pessoas / os seres humanos
  rationale: O contraste discursivo entre homens e mulheres está em primeiro plano; uma expressão genericamente inclusiva enfraqueceria esse contraste.
- issue: Alcance de εἶναι na afirmação final
  choice: existir
  alternative: ser / viver / ficar
  rationale: “Existir” comunica a dependência abrangente afirmada no argumento sem restringi-la apenas à convivência ou à sobrevivência. Como o grego emprega o verbo amplo “ser”, a alternativa é reconhecida em nota, sem resolver excessivamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “são elas” reproduz a ênfase e o paralelismo do original; “trazem glória” evita o literalismo pouco natural de “fazem glória”.
