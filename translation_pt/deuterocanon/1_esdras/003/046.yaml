  yaml_path: translation/deuterocanon/1_esdras/003/046.yaml
  text: And a man takes his sword and goes out to campaign and to plunder and to steal[a], and to sail on the sea and rivers,
translation:
  language: pt
  text: E um homem pega a sua espada e sai para fazer expedições[a], saquear e roubar, e para navegar pelo mar e pelos rios,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “marchar”, “empreender uma campanha” ou, em sentido mais amplo, “guerrear”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαμβάνει
  choice: pega
  rationale: Expressa de modo natural a ação concreta de tomar a espada; “recebe” não se ajusta ao contexto.
- source_word: ἄνθρωπος
  choice: um homem
  rationale: Preserva a forma singular e masculina do grego neste exemplo retórico.
- source_word: ῥομφαίαν
  choice: espada
  rationale: É o equivalente corrente e claro; o termo pode indicar uma espada grande, mas o contexto não exige especificar o tipo.
- source_word: ἐκπορεύεται
  choice: sai
  rationale: Mantém o sentido concreto de sair ou partir e introduz naturalmente os infinitivos seguintes.
- source_word: ἐξοδεύειν
  choice: fazer expedições
  rationale: Conserva a ideia de partir em expedição ou campanha sem intensificá-la necessariamente para “guerrear”.
- source_word: λῃστεύειν
  choice: saquear
  rationale: No contexto de expedições armadas, comunica a tomada violenta de bens e se distingue de κλέπτειν.
- source_word: κλέπτειν
  choice: roubar
  rationale: Equivalente português corrente para furtar ou tomar indevidamente; forma contraste natural com “saquear”.
- source_word: εἰς τὴν θάλασσαν πλεῖν
  choice: navegar pelo mar
  rationale: Tradução idiomática em português da construção grega, sem impor o sentido estritamente direcional de “para dentro do mar”.
- source_word: ποταμούς
  choice: pelos rios
  rationale: Completa de modo natural em português a coordenação com “pelo mar”.
