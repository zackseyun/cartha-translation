  text: and they do not remember[a], when they are drinking, to show affection to friends and brothers[b], and before long they draw swords.
translation:
  language: pt
  text: e não se lembram[a], quando estão bebendo, de demonstrar afeto[b] aos amigos e irmãos; e, pouco depois, desembainham espadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “não se lembra”. O verbo grego está no singular, mas, no contexto, a frase tem sentido genérico e foi vertida no plural.
    reason: lexical_alternative
  - marker: b
    text: O verbo também pode ser entendido de modo mais concreto como “tratar com afeto” ou, com menor probabilidade neste contexto, “beijar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μέμνηται
  choice: não se lembram
  rationale: Embora o verbo grego esteja no singular, a oração tem sentido genérico e se liga ao sujeito plural de πίνωσιν; o plural produz português natural sem alterar o referente coletivo.
- source_word: ὅταν πίνωσιν
  choice: quando estão bebendo
  rationale: ὅταν com o subjuntivo exprime uma circunstância temporal geral; a forma progressiva apresenta naturalmente a situação durante a bebida.
- source_word: φιλάζειν
  choice: demonstrar afeto
  rationale: A expressão conserva o sentido relacional de agir afetuosamente sem restringir o verbo ao ato concreto de beijar.
- source_word: φίλοις καὶ ἀδελφοῖς
  choice: aos amigos e irmãos
  rationale: Mantém os dois grupos explicitamente masculinos no grego e preserva o paralelismo retórico.
- source_word: μετʼ οὐ πολὺ
  choice: pouco depois
  rationale: Equivalente português claro e idiomático para algo que ocorre após breve intervalo.
- source_word: σπῶνται μαχαίρας
  choice: desembainham espadas
  rationale: Expressa de modo preciso e corrente o ato de sacar as armas para a violência.
