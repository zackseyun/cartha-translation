  text: But if they gather gold and silver and every beautiful thing[a], and see one woman beautiful in appearance and beauty,
translation:
  language: pt
  text: Mas, se ajuntarem ouro, prata e toda coisa bela, e virem uma só mulher, bela em aparência e beleza,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Mas, se
  rationale: Preserva tanto a condição expressa por ἐάν quanto o contraste introduzido por δέ, em português natural.
- source_word: συναγάγωσιν
  choice: ajuntarem
  rationale: Expressa a ação concreta de reunir ou acumular, sem introduzir a ideia específica de compra.
- source_word: χρυσίον καὶ ἀργύριον
  choice: ouro, prata
  rationale: São os equivalentes correntes dos termos gregos; a coordenação em português permanece clara na enumeração.
- source_word: πᾶν πρᾶγμα ὡραῖον
  choice: todo objeto belo
  rationale: πρᾶγμα é amplo, mas aqui, ao lado de ouro e prata, refere-se naturalmente a coisas ou objetos desejáveis; 'belo' conserva o valor de ὡραῖον sem convertê-lo em riqueza ou posse.
- source_word: ἴδωσιν
  choice: virem
  rationale: Equivalente direto e não interpretativo do aoristo do subjuntivo após ἐάν.
- source_word: γυναῖκα μίαν
  choice: uma só mulher
  rationale: Representa explicitamente μίαν e ressalta o contraste retórico entre os muitos bens reunidos e uma única mulher.
- source_word: καλὴν τῷ εἴδει καὶ τῷ κάλλει
  choice: bela de aparência e formosura
  rationale: Mantém a expressão dupla e enfática do grego, embora haja sobreposição semântica entre καλήν e κάλλει.
