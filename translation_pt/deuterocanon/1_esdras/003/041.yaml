- from: Mas, se ajuntarem ouro, prata e todo objeto belo, e virem uma só mulher bela de aparência e formosura,
  to: Mas, se ajuntarem ouro, prata e toda coisa bela, e virem uma só mulher, bela em aparência e beleza,
  rationale: A revisão amplia «objeto» para «coisa», em conformidade com a extensão semântica de πρᾶγμα, e substitui a expressão pouco natural «de aparência e formosura» por uma construção paralela que preserva a dupla descrição enfática do texto grego. A vírgula após «mulher» clarifica que «bela em aparência e beleza» a qualifica.
