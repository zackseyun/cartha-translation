review_pass:
  verdict: revise
  source_fidelity: A estrutura condicional e o contraste de ἐὰν δέ foram preservados, bem como a menção explícita a «uma só mulher» e a duplicação enfática ligada à beleza. Contudo, «objeto» restringe πρᾶγμα, termo mais amplo, e «formosura» introduz um registro mais literário/arcaizante do que o necessário.
  naturalness: «Bela de aparência e formosura» soa pouco idiomático e mistura construções não paralelas. «Bela em aparência e beleza» conserva deliberadamente a repetição do grego em português moderno e compreensível.
  terminology: «Coisa bela» mantém a amplitude de πᾶν πρᾶγμα ὡραῖον; «aparência» e «beleza» refletem diretamente εἶδος e κάλλος sem harmonizar a ênfase retórica.
  issues:
