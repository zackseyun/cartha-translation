    issue: «todo objeto belo» restringe o sentido de πᾶν πρᾶγμα ὡραῖον.
    rationale: πρᾶγμα pode designar qualquer coisa, bem ou item, não apenas um objeto material delimitado. «Toda coisa bela» preserva melhor sua abrangência.
  - severity: low
    issue: «bela de aparência e formosura» é estilisticamente desigual.
    rationale: Além de «formosura» ser menos corrente no registro-alvo, a formulação não reproduz de modo claro o paralelismo dos dois dativos gregos. Uma repetição mais transparente é preferível.
