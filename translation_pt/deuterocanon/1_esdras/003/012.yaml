  yaml_path: translation/deuterocanon/1_esdras/003/012.yaml
  text: The third wrote[a], “Women are stronger, but above all things truth is victorious.”
translation:
  language: pt
  text: 'O terceiro escreveu[a]: “As mulheres são mais fortes, mas, acima de tudo, a verdade triunfa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “As mulheres prevalecem, mas a verdade vence tudo.”'
    reason: Registra as alternativas lexicais de ὑπερισχύουσιν (“prevalecem”) e νικᾷ com ὑπὲρ πάντα (“vence tudo”).
lexical_decisions:
- source_word: ὁ τρίτος
  choice: O terceiro
  rationale: O artigo com o ordinal funciona substantivamente e se refere ao terceiro participante; a forma é concisa e natural em português.
- source_word: ἔγραψεν
  choice: escreveu
  rationale: O aoristo de γράφω indica diretamente que o participante registrou por escrito sua afirmação.
- source_word: Ὑπερισχύουσιν
  choice: são mais fortes
  rationale: O verbo pode indicar força superior ou prevalência. “São mais fortes” preserva o valor comparativo e mantém distinção em relação a νικᾷ.
- source_word: αἱ γυναῖκες
  choice: As mulheres
  rationale: Neste dito de alcance geral, γυναῖκες designa mulheres, não especificamente esposas.
- source_word: ὑπὲρ δὲ πάντα
  choice: mas, acima de tudo
  rationale: A expressão introduz o clímax e comunica que a verdade ocupa posição superior a todas as demais realidades, sem tornar explícito um objeto verbal que o grego deixa sintaticamente aberto.
- source_word: νικᾷ
  choice: triunfa
  rationale: νικάω significa vencer, conquistar ou sair vitorioso. “Triunfa” combina naturalmente com o sujeito abstrato “a verdade” e não repete a ideia de força da primeira oração.
- source_word: ἡ ἀλήθεια
  choice: a verdade
  rationale: Em português, o artigo definido é natural e idiomático com o substantivo abstrato neste enunciado proverbial, além de corresponder ao artigo grego.
theological_decisions:
- issue: Se ἡ ἀλήθεια deve ser vertido com ou sem artigo
  choice: a verdade
  alternative: verdade
  rationale: Ao contrário do inglês, o português normalmente emprega o artigo definido com esse substantivo abstrato quando ele funciona como sujeito. A escolha não identifica uma proposição doutrinária específica, mas preserva a máxima universal.
- issue: Relação de ὑπὲρ πάντα com νικᾷ
  choice: acima de tudo, a verdade triunfa
  alternative: a verdade vence tudo
  rationale: A formulação principal conserva a colocação enfática da expressão preposicional e o caráter proverbial do grego. A alternativa registra a leitura em que πάντα funciona mais diretamente como aquilo que a verdade vence.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação preserva o paralelismo, o contraste e a concisão proverbial do grego.
