  text: He said to strike, and they strike; he said to lay waste, and they lay waste; he said to build, and they build.
translation:
  language: pt
  text: Ele disse que golpeassem, e eles golpeiam; disse que devastassem, e eles devastam; disse que construíssem, e eles constroem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπε
  choice: diz que
  rationale: Embora seja aoristo, a sequência tem caráter vívido e sentencioso; o presente em português combina naturalmente com os presentes τύπτουσιν, ἐρημοῦσιν e οἰκοδομοῦσιν. A construção «diz que» seguida do subjuntivo comunica a diretiva sem ampliar explicitamente para «ordena».
- source_word: πατάξαι / τύπτουσιν
  choice: ataquem / atacam
  rationale: No contexto do poder régio, «atacar» expressa com clareza a ação violenta e permite conservar, com flexão verbal natural, o paralelismo entre a ordem e seu cumprimento.
- source_word: ἐρημῶσαι / ἐρημοῦσιν
  choice: devastem / devastam
  rationale: «Devastar» transmite o sentido de tornar desolado ou arruinado e preserva de modo conciso a repetição retórica do grego.
- source_word: οἰκοδομῆσαι / οἰκοδομοῦσιν
  choice: construam / constroem
  rationale: «Construir» mantém o sentido básico do verbo sem introduzir a ideia mais específica de reconstrução, que o texto não explicita.
theological_decisions:
- issue: Grau de autoridade régia expresso por εἶπε + infinitivo
  choice: «diz que... e eles...»
  alternative: «ordena que... e eles obedecem»
  rationale: A tradução preserva a eficácia da palavra do rei e a estrutura repetitiva, sem acrescentar explicitamente os conceitos de ordem e obediência além do que a formulação grega declara.
translation_notes:
  register: Português moderno, claro e digno, com cadência paralela. O subjuntivo após «diz que» torna idiomática a força diretiva dos infinitivos gregos, enquanto os presentes indicativos preservam a resposta imediata e habitual.
