base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/029.yaml
  text: And those who do not serve in the army or fight[a], but farm the land, again, when they sow, after reaping they bring tribute to the king; and by compelling one another[b], they bring the taxes to the king.
translation:
  language: pt
  text: E os que não servem no exército nem guerreiam, mas cultivam a terra, por sua vez, quando semeiam, depois de colher, levam tributo ao rei; e, obrigando-se mutuamente[a], levam os impostos ao rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cada um obrigando o outro”. A frase pode indicar pressão mútua para que os impostos do rei fossem pagos.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύονται
  choice: servem no exército
  rationale: Expressa naturalmente o serviço militar e o distingue do ato de guerrear indicado pelo verbo seguinte.
- source_word: πολεμοῦσιν
  choice: guerreiam
  rationale: Preserva o paralelismo com o serviço militar e o sentido de participar de guerra ou combate.
- source_word: γεωργοῦσιν τὴν γῆν
  choice: cultivam a terra
  rationale: Tradução clara, digna e próxima da expressão agrícola grega.
- source_word: ὅταν σπείρωσιν
  choice: quando semeiam
  rationale: A construção temporal com subjuntivo descreve uma situação habitual ou recorrente, bem expressa pelo presente em português.
- source_word: θερίσαντες
  choice: depois de colher
  rationale: Torna explícita a anterioridade do particípio aoristo em relação ao ato de levar o tributo.
- source_word: ἀναφέρουσιν
  choice: levam
  rationale: Mantém a imagem concreta de entregar algo a um superior; o contexto fiscal determina o sentido.
- source_word: ἕτερος τὸν ἕτερον
  choice: uns aos outros
  rationale: Equivalente recíproco idiomático em português, sem definir além do texto quem exerce a coerção.
- source_word: ἀναγκάζοντες
  choice: obrigando
  rationale: Preserva a força coercitiva do particípio sem especificar o mecanismo ou motivo da pressão.
- source_word: τοὺς φόρους
  choice: os impostos
  rationale: No contexto de pagamentos devidos ao rei, designa claramente tributos ou impostos exigidos.
theological_decisions:
- issue: Distinção entre o pagamento implícito na primeira ocorrência de ἀναφέρουσιν e φόρους na segunda
  choice: Usar “tributo” na primeira oração e “impostos” na segunda
  alternative: Usar “tributo” ou “impostos” nas duas ocorrências
  rationale: A primeira oração não traz um objeto fiscal expresso, embora o contexto exija um pagamento ao rei; a segunda nomeia explicitamente φόρους. A distinção conserva essa progressão sem impor uma diferença técnica rígida.
- issue: Sentido de ἕτερος τὸν ἕτερον ἀναγκάζοντες
  choice: Manter a formulação recíproca “obrigando uns aos outros”
  alternative: Explicar como pressão mútua para assegurar o pagamento
  rationale: A construção grega é incomum e não identifica o mecanismo da coerção. A tradução preserva essa ambiguidade em vez de resolvê-la no texto.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O tom permanece digno e direto. Evitou-se inserir no texto um objeto como “tributo” sem reconhecer que ele está implícito no grego; a tradução o fornece por necessidade de clareza em português. O advérbio πάλιν foi entendido com valor de continuidade da argumentação e não recebeu um “novamente” isolado, que soaria pouco natural neste contexto.
