  rationale: A revisão restaura πάλιν por meio de “por sua vez”, solução idiomática que conserva seu valor de continuidade no argumento. Também substitui a expressão recíproca pouco natural por “obrigando-se mutuamente” e ajusta a nota para manter visível a formulação literal e a incerteza interpretativa.
