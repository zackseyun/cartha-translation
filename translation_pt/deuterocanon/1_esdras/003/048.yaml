  text: And a man loves his own wife more than his father and mother.
translation:
  language: pt
  text: E um homem ama a sua própria esposa mais do que o pai e a mãe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλεῖον ... μᾶλλον ἢ
  choice: mais do que
  rationale: Embora πλεῖον e μᾶλλον reforcem a comparação no grego, o português idiomático expressa naturalmente o grau comparativo com «mais do que», sem uma duplicação artificial.
- source_word: ἀγαπᾷ
  choice: ama
  rationale: É o equivalente direto e natural de ἀγαπάω neste contexto.
- source_word: ἄνθρωπος
  choice: o homem
  rationale: Embora ἄνθρωπος possa ser genérico, aqui o referente é especificamente masculino, pois o texto fala de sua mulher em uma comparação familiar.
- source_word: τὴν ἰδίαν γυναῖκα
  choice: sua própria mulher
  rationale: γυνή designa aqui a esposa, e ἰδίαν acrescenta ênfase possessiva. «Sua própria mulher» preserva ambas as nuances e é amplamente compreensível em português.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: o pai e a mãe
  rationale: Mantém os dois substantivos explícitos do grego. A relação possessiva é suficientemente clara pelo contexto, sem necessidade de repetir «seu».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima ao grego. A formulação conserva a comparação de grau e a ênfase de ἰδίαν, sem reproduzir de modo redundante os dois comparativos gregos.
