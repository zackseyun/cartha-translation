base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/064.yaml
  text: and in her judgment there is nothing unjust[a]. And this is the strength and the kingdom and the authority and the majesty of all the ages[b]. Blessed is the God of truth.
translation:
  language: pt
  text: e em seu julgamento não há nada injusto.[a] Esta é a força, o reino, a autoridade e a majestade de todas as eras.[b] Bendito é o Deus da verdade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no julgamento dela”. O grego retoma “a verdade” com uma forma feminina, preservando sua personificação.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “de todas as eras”; de modo mais idiomático, “para todo o sempre”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις
  choice: julgamento
  rationale: Preserva o sentido jurídico de ato ou padrão de julgar, sem transformar o termo no conceito mais amplo de “justiça”.
- source_word: αὐτῆς
  choice: seu
  rationale: Retoma naturalmente “a verdade”, substantivo feminino também em português, mantendo a personificação sem produzir uma formulação artificial.
- source_word: ἄδικον
  choice: injusto
  rationale: Corresponde ao sentido forense de algo contrário à justiça e combina com “julgamento”.
- source_word: ἰσχύς
  choice: força
  rationale: Expressa vigor ou poder e conserva a distinção em relação a ἐξουσία, traduzido por “autoridade”.
- source_word: βασίλειον
  choice: reino
  rationale: Mantém a imagem de domínio régio presente na sequência doxológica; “realeza” ou “soberania” explicitariam mais o sentido abstrato.
- source_word: ἐξουσία
  choice: autoridade
  rationale: Comunica poder legítimo ou direito de exercer domínio, em contraste com mera força.
- source_word: μεγαλειότης
  choice: majestade
  rationale: Preserva o registro elevado e doxológico do termo grego.
- source_word: τῶν πάντων αἰώνων
  choice: de todas as eras
  rationale: Reproduz de modo transparente a expressão grega, deixando em nota a formulação temporal mais idiomática.
- source_word: εὐλογητός
  choice: Bendito é
  rationale: Conserva a fórmula predicativa de louvor do grego em linguagem bíblica clara e digna.
- source_word: ὁ θεὸς τῆς ἀληθείας
  choice: o Deus da verdade
  rationale: Mantém a construção genitiva e evita convertê-la em “o Deus verdadeiro”, que alteraria a sintaxe e estreitaria o sentido.
theological_decisions:
- issue: Personificação feminina da verdade
  choice: Manter a referência à verdade por meio de “seu julgamento” e do demonstrativo feminino “Esta”
  alternative: Despersonificar a expressão como “o julgamento dela” ou reformulá-la de modo impessoal
  rationale: O grego emprega formas femininas e o contexto personifica a verdade. Como “verdade” também é feminino em português, essa força literária pode ser preservada com naturalidade, sem acrescentar doutrina.
- issue: Valor de αὕτη na declaração sobre força, reino, autoridade e majestade
  choice: “Esta é a força...”
  alternative: “Ela é a força...” ou “Dela são a força...”
  rationale: “Esta” acompanha de perto o demonstrativo grego e mantém aberta a relação entre a verdade personificada e os predicados seguintes; “dela são” explicitaria uma relação possessiva não formalmente expressa.
- issue: Sentido temporal de αἰώνων na doxologia
  choice: “de todas as eras”
  alternative: “para todo o sempre”
  rationale: A tradução literal preserva a imagem plural das eras e evita substituir a expressão por uma fórmula litúrgica tradicional, embora semanticamente próxima.
translation_notes:
  register: Português atual, claro e digno, com cadência doxológica. A personificação da verdade é natural em português por causa do gênero feminino do substantivo. Mantiveram-se termos distintos para força e autoridade, bem como a construção “Deus da verdade”.
