  text: But the king prevails over them and rules over them, and he is master over them, and whatever he says to them, they will obey.
translation:
  language: pt
  text: Mas o rei prevalece sobre eles, governa-os e é senhor deles; e eles obedecerão a tudo o que lhes disser.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερισχύει
  choice: é mais poderoso do que eles
  rationale: Expressa de modo natural a ideia comparativa de prevalecer ou ser superior em força no contexto do argumento.
- source_word: κυριεύει αὐτῶν
  choice: governa sobre eles
  rationale: Preserva o exercício de domínio sem tornar a frase artificial em português.
- source_word: δεσπόζει αὐτῶν
  choice: é senhor deles
  rationale: Mantém a intensificação em relação ao verbo anterior e a noção de autoridade soberana.
- source_word: πᾶν ὃ ἐὰν εἴπῃ αὐτοῖς
  choice: tudo o que lhes ordenar
  rationale: No contexto da autoridade régia, εἴπῃ denota o que o rei manda ou ordena, não mera fala.
- source_word: ἐνακούσουσιν
  choice: obedecerão
  rationale: O verbo, neste contexto, significa dar ouvidos de maneira obediente.
