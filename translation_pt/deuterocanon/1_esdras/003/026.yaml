  source_fidelity: A tradução comunica corretamente a supremacia e a autoridade do rei. Contudo, «tudo o que lhes ordenar» restringe εἴπῃ («disser») a uma ordem explícita; o grego mantém a formulação mais ampla, seguida de «obedecerão/darão ouvidos».
  naturalness: O texto é claro e de registro apropriado. «Governa-os» é mais idiomático e conciso do que «governa sobre eles», e «obedecerão a tudo o que lhes disser» expressa naturalmente a construção final.
  terminology: «Senhor deles» representa adequadamente δεσπόζει αὐτῶν e preserva a intensificação após «governa». «Prevalece sobre eles» corresponde diretamente a ὑπερισχύει sem introduzir uma comparação explicativa desnecessária.
