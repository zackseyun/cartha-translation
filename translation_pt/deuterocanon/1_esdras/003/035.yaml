base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/035.yaml
  text: O men[a], how does the king not prevail, since he is so obeyed? And he was silent.
translation:
  language: pt
  text: Ó homens, como é que o rei não prevalece, já que é tão obedecido[a]? E calou-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «é tão ouvido» ou «é tão atendido». O adjetivo grego pode indicar tanto ser ouvido quanto ser obedecido; «obedecido» foi preferido porque o sujeito é o rei e o contexto trata de autoridade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ ἄνδρες
  choice: Ó homens
  rationale: Mantém o vocativo masculino plural explícito e a força retórica da interpelação.
- source_word: πῶς οὐχ ὑπερισχύει
  choice: como não há de prevalecer
  rationale: A construção expressa uma pergunta retórica; «não há de» comunica naturalmente em português a expectativa enfática de que o rei prevaleça, enquanto «prevalecer» preserva a ideia de superioridade sem restringi-la à força física.
- source_word: ὁ βασιλεύς
  choice: o rei
  rationale: Correspondência direta e natural para o substantivo grego.
- source_word: ὅτι
  choice: já que
  rationale: Introduz a razão que sustenta a pergunta retórica, preservando o valor causal.
- source_word: οὕτως ἐπάκουστός ἐστιν
  choice: é tão obedecido
  rationale: No contexto da autoridade real, «obedecido» exprime bem o sentido principal; «tão» comunica a intensificação de οὕτως, sem ocultar em nota a possibilidade lexical de ser ouvido ou atendido.
- source_word: καὶ ἐσίγησεν
  choice: E calou-se
  rationale: Reproduz de modo conciso e idiomático o aoristo de σιγάω, indicando que o orador cessou de falar.
