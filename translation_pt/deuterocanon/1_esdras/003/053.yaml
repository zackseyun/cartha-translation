translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O imperfeito mantém o caráter descritivo e reiterado das ações. A formulação evita o arcaísmo “destra/sinistra” e explicita os elementos corporais implícitos no grego.
