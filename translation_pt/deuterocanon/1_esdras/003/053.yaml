  text: and she would take the crown from the king’s head and put it on herself[b][a], and she would strike the king with her left hand.
translation:
  language: pt
  text: e tirava a coroa[a] da cabeça do rei e a colocava sobre a própria cabeça; e dava bofetadas no rei com a mão esquerda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “o diadema”.
    reason: lexical_alternative
  - marker: b
    text: O verbo grego pode indicar especificamente uma bofetada ou outro golpe dado com a mão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφαιροῦσαν
  choice: tirava ... da
  rationale: O particípio presente integra uma descrição de ação habitual ou repetida; o imperfeito em português expressa essa força de modo natural.
- source_word: τὸ διάδημα
  choice: a coroa
  rationale: διάδημα designa a insígnia real usada na cabeça. “Coroa” é a opção moderna mais clara; “diadema” permanece em nota como alternativa mais formal.
- source_word: ἐπιτιθοῦσαν αὐτῇ
  choice: a colocava sobre a própria cabeça
  rationale: O dativo αὐτῇ retoma a mulher. Explicitar “cabeça” comunica naturalmente em português o gesto implícito de pôr em si a coroa retirada da cabeça do rei.
- source_word: ἐράπιζεν
  choice: dava tapas
  rationale: ῥαπίζω indica especificamente golpear com a mão, com frequência dar uma bofetada ou tapa. “Dava tapas” preserva a ação reiterada e é corrente sem perder dignidade.
- source_word: τῇ ἀριστερᾷ
  choice: com a mão esquerda
  rationale: O adjetivo feminino substantivado deixa “mão” implícito; sua explicitação é necessária e natural em português.
- source_word: καὶ ... καὶ
  choice: e ...; e
  rationale: A coordenação repetida conserva a sequência simples do grego; o ponto e vírgula ajuda a separar o último gesto sem alterar a relação sintática.
