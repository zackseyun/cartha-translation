  text: He said[a], ‘Cut it down,’ and they cut it down; he said, ‘Plant it,’ and they plant it.
translation:
  language: pt
  text: 'Ele disse: “Cortem”[a], e eles cortam; disse: “Plantem”, e eles plantam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego não declara o objeto de “cortar” nem o de “plantar”; ambos ficam subentendidos pelo contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: disse
  rationale: O aoristo de λέγω introduz cada determinação. “Disse” preserva o sentido simples e o estilo breve e repetitivo, sem explicitar além do grego que se trata de uma ordem formal.
- source_word: ἐκκόψαι
  choice: Cortem
  rationale: O infinitivo aoristo de ἐκκόπτω, após εἶπεν, expressa o conteúdo da determinação. O imperativo “Cortem” é natural em português e comunica cortar ou derrubar aquilo que está em vista, sem acrescentar um objeto.
- source_word: ἐκκόπτουσιν
  choice: eles cortam
  rationale: O presente do indicativo plural descreve o cumprimento da determinação. Mantém-se o presente e a ausência de objeto do grego.
- source_word: φυτεῦσαι
  choice: Plantem
  rationale: O infinitivo aoristo de φυτεύω é paralelo a ἐκκόψαι. O imperativo “Plantem” reproduz de modo idiomático a força diretiva da construção.
- source_word: φυτεύουσιν
  choice: eles plantam
  rationale: O presente plural, paralelo a ἐκκόπτουσιν, mostra o cumprimento da determinação e preserva a estrutura repetitiva do original.
