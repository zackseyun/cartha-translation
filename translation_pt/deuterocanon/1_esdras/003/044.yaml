  yaml_path: translation/deuterocanon/1_esdras/003/044.yaml
  text: and with the woman he gives up his life[b][a], and remembers neither father nor mother nor homeland.
translation:
  language: pt
  text: e, com a mulher[a], abre mão da própria vida[b] e não se lembra nem do pai, nem da mãe, nem da terra natal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mulher” também pode ser traduzido por “esposa”, pois o termo grego pode ter ambos os sentidos.
    reason: lexical_alternative
  - marker: b
    text: Ou “abandona a própria alma” ou “abandona a si mesmo”. O termo grego traduzido por “vida” também pode significar “alma” ou a própria pessoa, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τῆς γυναικός
  choice: com a mulher
  rationale: μετά com o genitivo normalmente expressa companhia ou associação. “Com a mulher” conserva essa relação sem transformá-la em causa (“por causa da mulher”).
- source_word: γυνή
  choice: mulher
  rationale: γυνή pode significar “mulher” ou “esposa”. O contexto trata do poder exercido pelas mulheres em sentido amplo, por isso “mulher” preserva melhor a extensão possível do termo; a alternativa é registrada em nota.
- source_word: ἀφίησι τὴν ψυχήν
  choice: abre mão da própria vida
  rationale: ἀφίημι pode significar deixar, soltar ou abandonar, e ψυχή pode designar vida, pessoa ou alma. A expressão portuguesa transmite a ideia de renunciar à própria vida sem impor uma leitura antropológica mais restrita.
- source_word: μέμνηται
  choice: se lembra
  rationale: O verbo significa lembrar-se ou ter em mente. A forma pronominal é a expressão corrente e clara em português.
- source_word: χώραν
  choice: terra natal
  rationale: χώρα pode indicar terra, região ou país. Na sequência com pai e mãe, “terra natal” comunica naturalmente o vínculo pessoal com o lugar de origem.
theological_decisions:
- issue: Sentido de ψυχή
  choice: vida
  alternative: alma; a si mesmo
  rationale: Neste contexto, ψυχή tem alcance semântico amplo. “Vida” é natural e evita introduzir uma distinção rígida entre corpo e alma, enquanto a nota preserva as demais possibilidades.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Abre mão” comunica de modo idiomático a força de renúncia presente na expressão grega; a nota conserva sua ambiguidade lexical.
