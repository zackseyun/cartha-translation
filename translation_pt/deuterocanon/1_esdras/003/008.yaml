  text: And then[a], after each had written his own statement, they sealed them and placed them under the pillow of Darius the king,
translation:
  language: pt
  text: Então, depois que cada um escreveu a sua própria declaração, eles as selaram e as colocaram debaixo do travesseiro do rei Dario.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “debaixo do apoio para a cabeça do rei Dario”. O termo grego pode designar um travesseiro ou um apoio para a cabeça.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Então
  rationale: Marca de modo natural e conciso o passo seguinte da narrativa.
- source_word: γράψαντες
  choice: depois que ... escreveu
  rationale: O particípio aoristo indica ação anterior aos verbos principais; a oração temporal deixa clara essa sequência em português.
- source_word: ἕκαστος
  choice: cada um
  rationale: Preserva o sentido distributivo e soa natural em português moderno.
- source_word: τὸν ἑαυτοῦ λόγον
  choice: a sua própria declaração
  rationale: No contexto, λόγος designa a proposição escrita por cada participante; “declaração” é claro sem especificar excessivamente que se tratava de um argumento.
- source_word: ἐσφραγίσαντο
  choice: eles as selaram
  rationale: O objeto implícito são as declarações escritas; o pronome feminino plural torna essa referência clara.
- source_word: ἔθηκαν
  choice: as colocaram
  rationale: Equivalente narrativo corrente e digno para o ato de pôr os escritos no local indicado.
- source_word: ὑπὸ τὸ προσκεφάλαιον
  choice: debaixo do travesseiro
  rationale: προσκεφάλαιον pode designar um travesseiro ou apoio para a cabeça; “travesseiro” é a forma mais clara no texto principal.
- source_word: Δαρείου τοῦ βασιλέως
  choice: do rei Dario
  rationale: Construção idiomática em português que preserva tanto o nome quanto o título.
