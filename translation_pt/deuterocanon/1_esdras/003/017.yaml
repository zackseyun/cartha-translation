base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/017.yaml
  text: 'And they said to them[a], “Tell us about what has been written.” And the first, who had spoken about the strength of wine[b], began and said thus:'
translation:
  language: pt
  text: 'E eles lhes disseram: “Contem-nos a respeito do que foi escrito[a]”. Então o primeiro, aquele que havia falado sobre a força do vinho[b], começou e disse assim:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a respeito dos textos escritos”. A expressão grega pode referir-se coletivamente às composições escritas apresentadas para julgamento.
    reason: lexical_alternative
  - marker: b
    text: Ou “o poder do vinho”. O termo grego pode indicar força, vigor ou poder.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπαγγείλατε
  choice: Contem-nos
  rationale: O imperativo plural de ἀπαγγέλλω pede que os participantes relatem ou exponham suas declarações. “Contem-nos” é claro e natural em português atual, sem perder o caráter de solicitação formal do contexto.
- source_word: περὶ τῶν γεγραμμένων
  choice: a respeito do que foi escrito
  rationale: Mantém o sentido passivo e resultativo do particípio perfeito γεγραμμένων sem definir explicitamente quem escreveu os textos.
- source_word: ἤρξατο
  choice: começou
  rationale: Equivalente direto e corrente de ἤρξατο.
- source_word: ὁ πρῶτος
  choice: o primeiro
  rationale: Preserva o ordinal substantivado, que identifica o primeiro participante.
- source_word: ὁ εἴπας
  choice: aquele que havia falado
  rationale: A oração relativa expressa com naturalidade que sua fala sobre o vinho ocorreu antes deste novo discurso.
- source_word: περὶ τῆς ἰσχύος τοῦ οἴνου
  choice: sobre a força do vinho
  rationale: “Força” reproduz o sentido básico de ἰσχύς e funciona naturalmente como tema da argumentação, sem excluir a nuance de poder.
- source_word: ἔφη οὕτως
  choice: disse assim
  rationale: Fórmula portuguesa natural para introduzir o discurso que vem a seguir, correspondendo de perto a οὕτως.
