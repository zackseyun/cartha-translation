lexical_decisions:
- source_word: ὁ εἷς
  choice: Um deles
  rationale: A expressão significa literalmente “o um”, mas, no contexto dos participantes, “um deles” identifica naturalmente um dos concorrentes sem acrescentar uma especificação indevida.
- source_word: ἔγραψεν
  choice: escreveu
  rationale: O aoristo narra uma ação pontual; o pretérito perfeito simples reproduz com clareza a sequência narrativa.
- source_word: Ὑπερισχύει
  choice: é mais forte
  rationale: O verbo expressa força superior ou prevalência. A forma comparativa preserva melhor o valor do grego do que o superlativo “é o mais forte”, embora o contexto seja uma disputa.
- source_word: ὁ οἶνος
  choice: O vinho
  rationale: O artigo grego tem sentido genérico. Em português, “o vinho” é a forma natural de apresentar a categoria como tema da afirmação.
