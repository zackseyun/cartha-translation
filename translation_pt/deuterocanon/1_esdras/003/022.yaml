  yaml_path: translation/deuterocanon/1_esdras/003/022.yaml
  text: And when they rise from the wine[a], they do not remember what they did.
translation:
  language: pt
  text: E, quando se levantam do vinho[a], não se lembram do que fizeram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “quando se levantam do vinho”. A expressão se refere a levantar-se depois de estar sob os efeitos do vinho, sem necessariamente declarar que já recuperaram a sobriedade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: quando
  rationale: Introduz uma oração temporal de sentido geral. “Quando” é natural em português e preserva o valor do grego sem tornar obrigatória a explicitação “sempre que”.
- source_word: ἐγερθῶσιν
  choice: se levantam
  rationale: O verbo ἐγείρω indica aqui levantar-se ou erguer-se. A tradução mantém a imagem concreta e evita interpretar de modo excessivo como “ficam sóbrios”.
- source_word: ἀπὸ τοῦ οἴνου
  choice: do vinho
  rationale: Reproduz a expressão grega concreta, literalmente “do vinho”. No contexto, refere-se a levantar-se depois de estar sob os efeitos do vinho, mas sem afirmar formalmente que já recuperaram a sobriedade.
- source_word: οὐ μέμνηται
  choice: não se lembram
  rationale: Embora a forma verbal no texto de Swete seja singular, o sujeito contextual é plural e coletivo; o plural idiomático em português comunica claramente o sentido.
- source_word: ἃ ἔπραξαν
  choice: do que fizeram
  rationale: Tradução concisa e natural da oração relativa, preservando o valor passado do aoristo.
