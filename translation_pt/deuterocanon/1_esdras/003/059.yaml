  yaml_path: translation/deuterocanon/1_esdras/003/059.yaml
  text: Is not the one who does these things great? And truth is great, and stronger than everything[a][b].
translation:
  language: pt
  text: Não é grande aquele que faz essas coisas? E a verdade é grande e mais forte do que tudo.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego deixa o referente implícito; o contexto mais amplo pode sugerir Deus, mas esta oração não o nomeia.
    reason: Esclarece a ambiguidade do referente sem apresentar como alternativa uma redação idêntica à do texto principal.
  - marker: b
    text: 'Ou: “mais forte do que todas as coisas”.'
    reason: Registra uma forma mais explícita de representar o plural πάντα.
lexical_decisions:
- source_word: οὐχὶ
  choice: Não é
  rationale: Introduz uma pergunta retórica que espera resposta afirmativa, preservando sua força sem soar arcaica.
- source_word: μέγας
  choice: grande
  rationale: Mantém o sentido direto de grandeza ou importância e também a repetição de μέγας/μεγάλη nas duas orações.
- source_word: ὃς
  choice: aquele que
  rationale: O pronome relativo tem função substantiva; a formulação é natural em português e não explicita um referente que o grego deixa implícito.
- source_word: ταῦτα
  choice: essas coisas
  rationale: Preserva o plural demonstrativo e sua referência aos atos mencionados anteriormente.
- source_word: ποιεῖ
  choice: faz
  rationale: É o equivalente amplo e natural de ποιεῖ para a realização dos atos descritos.
- source_word: ἡ ἀλήθεια
  choice: a verdade
  rationale: Traduz o substantivo com seu artigo e conserva a declaração sapiencial sobre a verdade, sem reinterpretá-la como fidelidade.
- source_word: ἰσχυροτέρα
  choice: mais forte
  rationale: Preserva de forma direta o grau comparativo do adjetivo.
- source_word: παρὰ πάντα
  choice: do que tudo
  rationale: Expressa naturalmente em português a comparação universal; a alternativa 'do que todas as coisas' torna explícito o valor plural de πάντα.
theological_decisions:
- issue: Referente de «aquele que faz essas coisas»
  choice: Mantido implícito, sem inserir «Deus» no texto principal
  alternative: Entender o agente implicitamente como Deus
  rationale: Embora o contexto mais amplo possa sugerir Deus, a oração grega não o nomeia; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «grande» reproduz o efeito retórico do grego. A vírgula antes de «e mais forte» foi omitida por fluidez sintática.
