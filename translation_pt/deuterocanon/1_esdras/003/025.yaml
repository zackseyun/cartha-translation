  yaml_path: translation/deuterocanon/1_esdras/003/025.yaml
  text: O men[a], do not men prevail, since they rule over the earth and the sea and everything in them?
translation:
  language: pt
  text: Ó homens, não prevalecem os seres humanos, dominando a terra, o mar e tudo o que neles há?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Ó homens, não prevalecem os seres humanos, dominando a terra, o mar e tudo o que neles há?” A pergunta grega espera uma resposta afirmativa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ ἄνδρες
  choice: Ó homens
  rationale: Mantém o vocativo masculino plural e a força retórica da interpelação, em registro digno e compreensível.
- source_word: οὐχ ὑπερισχύουσιν οἱ ἄνθρωποι
  choice: não é verdade que os seres humanos são mais poderosos
  rationale: A construção com οὐχ introduz uma pergunta retórica que espera resposta afirmativa. «São mais poderosos» expressa o valor comparativo/intensivo de ὑπερισχύω sem especificar indevidamente contra quem prevalecem; «seres humanos» distingue o referente genérico de ἄνδρες, usado no vocativo.
- source_word: κατακρατοῦντες
  choice: pois dominam
  rationale: O particípio apresenta a base da afirmação anterior. «Pois dominam» torna explícita essa relação explicativa e preserva a ideia de exercer domínio.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: a terra, o mar
  rationale: O par abrange os grandes domínios do mundo; «terra» e «mar» são equivalentes naturais e tradicionais em português.
- source_word: πάντα τὰ ἐν αὐτοῖς
  choice: tudo o que neles há
  rationale: Reproduz de modo natural a abrangência total da expressão grega e conserva a referência conjunta à terra e ao mar.
theological_decisions: []
translation_notes:
  register: Português moderno, internacional e de fácil leitura no Brasil. A interpelação «Ó homens» preserva a solenidade retórica, enquanto «seres humanos» comunica o sentido genérico de ἄνθρωποι. A pergunta foi formulada com «não é verdade que» para deixar natural em português a expectativa de resposta afirmativa presente em οὐχ.
