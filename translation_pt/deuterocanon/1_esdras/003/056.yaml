lexical_decisions:
- source_word: μεγιστᾶνες
  choice: nobres
  rationale: Designa homens de alta posição, especialmente dignitários ou grandes da corte. “Nobres” é natural em português e se ajusta ao contexto régio sem a especificidade indevida de “príncipes”.
- source_word: ἔβλεπον εἰς τὸν ἕτερον
  choice: olharam uns para os outros
  rationale: Embora a construção seja literalmente próxima de “olhavam para o outro”, o sujeito plural favorece o sentido recíproco. A formulação escolhida comunica naturalmente a troca de olhares.
- source_word: ἤρξατο λαλεῖν
  choice: começou a falar
  rationale: Reproduz com clareza e naturalidade o valor ingressivo da construção grega, indicando o início da fala.
- source_word: τῆς ἀληθείας
  choice: sobre a verdade
  rationale: A preposição portuguesa “sobre” expressa o assunto da fala, e o artigo definido preserva o grego, que apresenta a verdade como o tema específico em questão.
