  text: And many lost their senses because of women[a], and became slaves because of them;
translation:
  language: pt
  text: E muitos perderam o juízo por causa das mulheres[a] e, por causa delas, tornaram-se escravos;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram desencaminhados em seus próprios pensamentos por causa das mulheres”. A expressão grega é idiomática e combina um verbo ligado à perda da razão com “seus próprios pensamentos” ou “sua própria mente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπενοήθησαν ταῖς ἰδίαις διανοίαις
  choice: perderam o juízo
  rationale: A combinação idiomática exprime perda da razão ou do bom senso. “Perderam o juízo” comunica essa força em português natural, sem afirmar mais do que o grego.
- source_word: διὰ τὰς γυναῖκας
  choice: por causa das mulheres
  rationale: διά com acusativo indica aqui causa ou motivo; a formulação é clara e preserva a referência explícita às mulheres.
- source_word: δοῦλοι
  choice: escravos
  rationale: O termo indica sujeição e condição servil; “escravos” preserva sua força, ao contrário do mais brando “servos”.
- source_word: ἐγένοντο
  choice: tornaram-se
  rationale: Expressa mudança de estado e corresponde naturalmente ao sentido do verbo no contexto.
- source_word: διʼ αὐτάς
  choice: por causa delas
  rationale: Retoma “as mulheres” e mantém a repetição causal presente no grego.
theological_decisions:
- issue: Sentido de δοῦλοι
  choice: escravos
  alternative: servos
  rationale: O contexto enfatiza sujeição efetiva. “Escravos” preserva a força social do termo grego sem suavizá-lo.
- issue: Expressão mental ἀπενοήθησαν ταῖς ἰδίαις διανοίαις
  choice: perderam o juízo
  alternative: foram desencaminhados em seus próprios pensamentos
  rationale: A expressão grega é idiomática e admite uma leitura mais literal ligada aos pensamentos. O texto principal usa português corrente, enquanto a nota conserva a alternativa e a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “por causa” foi mantida por refletir a estrutura retórica do grego; a vírgula antes de “e” foi evitada para dar fluidez natural ao período.
