  yaml_path: translation/deuterocanon/1_esdras/003/043.yaml
  text: A man leaves his own father[a], who raised him, and his own country, and clings to his own wife,
translation:
  language: pt
  text: O homem deixa seu próprio pai[a], que o criou, e sua própria terra, e se apega à sua própria esposa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abandona” ou “desampara”. O verbo grego pode ter um sentido mais forte, mas aqui provavelmente descreve o afastamento do pai e da terra para se unir à sua esposa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: O homem
  rationale: No contexto, o singular apresenta o homem como figura representativa em uma afirmação sobre o casamento; a menção à sua mulher confirma a referência masculina.
- source_word: τὸν ἑαυτοῦ πατέρα
  choice: seu próprio pai
  rationale: O reflexivo ἑαυτοῦ enfatiza a relação de posse; “seu próprio pai” preserva essa ênfase.
- source_word: ἐγκαταλείπει
  choice: deixa
  rationale: O verbo pode ter o sentido mais forte de “abandona”, mas aqui descreve naturalmente a partida do pai e da terra para a união com a mulher, sem necessariamente implicar censura moral.
- source_word: ὃς ἐξέθρεψεν αὐτόν
  choice: que o criou
  rationale: ἐκτρέφω indica nutrir e criar alguém até a maturidade; “criou” é natural e claro em português contemporâneo.
- source_word: τὴν ἰδίαν χώραν
  choice: sua própria terra
  rationale: χώρα pode significar terra, região ou país. “Terra” preserva a amplitude do grego e soa natural ao falar do lugar de origem.
- source_word: πρὸς τὴν ἰδίαν γυναῖκα
  choice: à sua própria mulher
  rationale: γυνή pode significar “mulher” ou “esposa”; o contexto é conjugal. “Sua própria mulher” preserva tanto o valor marital quanto a repetição enfática de ἰδίαν.
- source_word: κολλᾶται
  choice: se apega
  rationale: O verbo expressa adesão ou vínculo estreito. “Se apega” comunica essa ligação forte de modo corrente e digno.
theological_decisions:
- issue: Referência masculina genérica em uma máxima sobre o casamento
  choice: O homem
  alternative: A pessoa
  rationale: Embora ἄνθρωπος possa ter sentido genérico, a construção concreta fala do pai e da mulher do indivíduo, apresentando explicitamente um homem no cenário matrimonial. A tradução mantém essa forma sem neutralizá-la.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Preservou-se a repetição enfática de “próprio/própria” e a vírgula final, pois o versículo continua a frase no contexto imediato.
