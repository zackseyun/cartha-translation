lexical_decisions:
- source_word: ὁ ἕτερος
  choice: O outro
  rationale: A expressão com artigo identifica outro participante já conhecido e mantém, de modo natural e conciso, o contraste com o escritor anterior, sem especificá-lo indevidamente como “o segundo”.
- source_word: ἔγραψεν
  choice: escreveu
  rationale: O aoristo de γράφω tem aqui o sentido direto de “escreveu”; o contexto não exige um termo mais específico, como “inscreveu”.
- source_word: Ὑπερισχύει
  choice: é mais forte
  rationale: O verbo exprime superioridade de força ou poder. “É mais forte” conserva a força comparativa da afirmação no contexto da disputa, sem convertê-la explicitamente em superlativo.
- source_word: ὁ βασιλεύς
  choice: o rei
  rationale: βασιλεύς designa especificamente um rei; “governante” seria mais amplo e menos preciso.
