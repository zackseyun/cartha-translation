base_translation:
  language: en
  yaml_path: translation/deuterocanon/1_esdras/003/027.yaml
  text: If she tells them to make war[a], one against another, they do it; but if she sends them out against the enemies, they go and tear down the mountains and the walls and the towers.
translation:
  language: pt
  text: Se ela lhes disser que façam guerra uns contra os outros, eles o fazem; mas, se os enviar contra os inimigos, eles vão e arrasam[a] os montes, as muralhas e as torres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “destroem” ou “derrubam”; o verbo grego κατεργάζονται indica aqui uma ação vigorosa contra o terreno e as fortificações.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπῃ αὐτοῖς
  choice: Se ela lhes disser
  rationale: A construção condicional com o subjuntivo apresenta uma situação geral. “Disser” traduz εἴπῃ sem acrescentar a formalidade de “ordenar”; o pronome “ela” explicita o sujeito feminino indicado pelo contexto.
- source_word: ποιῆσαι πόλεμον
  choice: que façam guerra
  rationale: Mantém de perto a expressão grega e soa natural no registro narrativo em português.
- source_word: ἕτερος πρὸς τὸν ἕτερον
  choice: uns contra os outros
  rationale: Expressa com clareza o sentido recíproco da fórmula grega e concorda naturalmente com o sujeito plural.
- source_word: ποιοῦσιν
  choice: eles o fazem
  rationale: Conserva o caráter amplo e retomativo do verbo, remetendo à ação anteriormente mencionada.
- source_word: ἐξαποστείλῃ αὐτοὺς
  choice: se os enviar
  rationale: “Enviar” comunica naturalmente o ato de mandá-los para fora em missão; o contexto militar torna desnecessário explicitar “para fora”.
- source_word: πρὸς τοὺς πολεμίους
  choice: contra os inimigos
  rationale: No contexto militar, “contra” expressa de modo idiomático a direção hostil de πρός.
- source_word: βαδίζουσιν
  choice: eles vão
  rationale: Preserva o sentido comum de ir ou avançar sem acrescentar a especificidade militar de “marcham”.
- source_word: κατεργάζονται
  choice: arrasam
  rationale: O verbo indica aqui uma ação enérgica exercida sobre terreno e fortificações. “Arrasam” mantém a força destrutiva e pode reger em conjunto os três objetos, embora a extensão aos montes permaneça retoricamente marcante.
- source_word: τὰ ὄρη
  choice: os montes
  rationale: Traduz o sentido geográfico direto de ὄρη, sem reinterpretá-lo como “fortalezas”. “Montes” é corrente e apropriado à linguagem bíblica moderna.
- source_word: τὰ τείχη
  choice: as muralhas
  rationale: No cenário bélico, τείχη designa muros defensivos; “muralhas” torna esse sentido claro.
- source_word: τοὺς πύργους
  choice: as torres
  rationale: É o equivalente direto e natural para as estruturas defensivas designadas por πύργους.
theological_decisions:
- issue: Referente do sujeito feminino não expresso no versículo
  choice: Empregar “ela”, referindo-se à mulher mencionada no argumento do contexto imediato.
  alternative: Repetir “a mulher” ou deixar o sujeito apenas implícito.
  rationale: As formas verbais gregas não repetem um substantivo como sujeito, mas o contexto fornece uma mulher como referente. “Ela” mantém a coesão e evita impor uma identificação além do que o contexto sustenta.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem retórica e a imagem incomum de arrasar montes, muralhas e torres foram preservadas.
