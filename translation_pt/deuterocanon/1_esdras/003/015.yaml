lexical_decisions:
- source_word: ἐκάθισεν
  choice: se sentou
  rationale: O aoristo indica a ação narrativa simples de sentar-se; a forma é direta, natural e não acrescenta a possível nuance de assumir formalmente um lugar.
- source_word: χρηματιστηρίῳ
  choice: sala do conselho
  rationale: O termo designa um recinto oficial de deliberação, julgamento ou atividade administrativa. “Sala do conselho” comunica o cenário institucional sem restringi-lo indevidamente a um tribunal; outras possibilidades são preservadas em nota.
- source_word: ἀνεγνώσθη
  choice: foi lida
  rationale: Reproduz o aoristo passivo sem explicitar “em voz alta”, embora uma leitura pública seja provável pelo contexto.
- source_word: γράμμα
  choice: carta
  rationale: Neste contexto, refere-se naturalmente a uma comunicação escrita; “carta” é mais corrente do que “documento” ou “escrito”.
- source_word: ἐνώπιον αὐτῶν
  choice: diante deles
  rationale: Expressão portuguesa concisa e formal que preserva o sentido de a leitura ocorrer na presença deles.
