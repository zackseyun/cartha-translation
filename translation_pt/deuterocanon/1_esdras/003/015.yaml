translation:
  language: pt
  text: E ele se sentou na sala do conselho[a], e a carta foi lida diante deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tribunal”, “sala de julgamento” ou “câmara oficial”; o termo grego designa um recinto destinado a deliberações ou procedimentos oficiais.
