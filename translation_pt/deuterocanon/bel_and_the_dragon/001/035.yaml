  text: And Habakkuk said[a], “Lord, I have not seen Babylon, and I do not know the pit.”
translation:
  language: pt
  text: 'E Habacuque disse: “Senhor, nunca vi Babilônia e não conheço a cova[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o fosso” ou “a cisterna”; a palavra grega é um termo geral para uma cavidade ou lugar escavado e, aqui, refere-se ao local onde Daniel estava confinado.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμβακοὺμ
  choice: Habacuque
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome do profeta.
- source_word: Κύριε
  choice: Senhor
  rationale: Vocativo de κύριος em referência direta a Deus; “Senhor” é a forma natural e consagrada em português.
- source_word: Βαβυλῶνα
  choice: Babilônia
  rationale: Forma portuguesa corrente do topônimo.
- source_word: οὐχ ἑώρακα
  choice: nunca vi
  rationale: O perfeito de ὁράω indica ausência de experiência anterior; “nunca vi” comunica isso de modo natural em português.
- source_word: τὸν λάκκον
  choice: o fosso
  rationale: λάκκος é um termo geral para uma cavidade, poço, cisterna ou cova; “fosso” mantém o sentido genérico sem identificar de modo excessivamente específico o local de confinamento.
- source_word: οὐ γινώσκω
  choice: não conheço
  rationale: Preserva de maneira direta a ideia de falta de conhecimento ou familiaridade expressa pelo presente de γινώσκω.
theological_decisions:
- issue: Tradução de κύριος na invocação dirigida a Deus
  choice: Senhor
  alternative: Soberano
  rationale: O contexto apresenta uma invocação a Deus, e “Senhor” é a equivalência portuguesa mais natural e tradicional, sem acrescentar uma distinção teológica ausente do grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Nunca vi” reproduz naturalmente o valor experiencial do perfeito grego, enquanto “não conheço o fosso” conserva a concisão e a possível amplitude do original.
