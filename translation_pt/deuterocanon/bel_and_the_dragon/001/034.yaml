base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/034.yaml
  text: And an angel of the Lord said to Habakkuk[a], “Carry the meal that you have to Babylon[b], to Daniel in the lions’ pit.”
translation:
  language: pt
  text: 'E um anjo do Senhor disse a Habacuque: “Leve a refeição[a] que você tem para a Babilônia, a Daniel, no fosso dos leões[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o alimento”, “o almoço” ou “a refeição do meio-dia”. O termo grego se refere a uma refeição, mas não determina por si só a hora exata do dia.
    reason: lexical_alternative
  - marker: b
    text: Tradicionalmente, “na cova dos leões”. O grego diz mais literalmente “no fosso dos leões”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος Κυρίου
  choice: um anjo do Senhor
  rationale: A ausência de artigo antes de ἄγγελος favorece a forma indefinida “um anjo”; “Senhor” é o título adequado para κύριος neste contexto.
- source_word: Ἀμβακοὺμ
  choice: Habacuque
  rationale: Forma tradicional e amplamente reconhecida do nome do profeta em português.
- source_word: Ἀπένεγκε
  choice: Leve
  rationale: O imperativo expressa o transporte da refeição até Daniel; “leve” indica naturalmente o movimento em direção ao destino mencionado.
- source_word: τὸ ἄριστον
  choice: a refeição
  rationale: O termo designa uma refeição, frequentemente matinal ou ao meio-dia conforme o período, sem fixar por si só um horário exato.
- source_word: ὃ ἔχεις
  choice: que você tem
  rationale: Tradução direta e natural da oração relativa, sem acrescentar a ideia de que Habacuque a estivesse segurando naquele momento.
- source_word: εἰς Βαβυλῶνα
  choice: para a Babilônia
  rationale: εἰς com nome de lugar indica aqui direção ou destino.
- source_word: εἰς τὸν λάκκον τῶν λεόντων
  choice: no fosso dos leões
  rationale: “Fosso” preserva a imagem concreta de λάκκος. No contexto, a expressão identifica o lugar onde Daniel se encontra, razão pela qual se usa naturalmente “no” em português.
theological_decisions:
- issue: Tradução de κύριος em uma narrativa deuterocanônica grega
  choice: Senhor
  alternative: Soberano
  rationale: Na expressão “anjo do Senhor”, κύριος se refere ao Deus de Israel; “Senhor” preserva o título tradicional sem acrescentar uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A ordem da frase mantém os dois destinos do grego — Babilônia e Daniel no fosso — sem sugerir que Daniel esteja fora de Babilônia. Os marcadores de nota foram colocados junto aos termos que explicam.
