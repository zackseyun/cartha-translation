lexical_decisions:
- source_word: οἱ δὲ ἱερεῖς
  choice: Mas os sacerdotes
  rationale: δέ introduz a continuação narrativa com leve contraste; “mas” preserva essa força, e ἱερεῖς é traduzido de modo padrão por “sacerdotes”.
- source_word: ἦλθον
  choice: vieram
  rationale: O aoristo de ἔρχομαι descreve a chegada no fluxo narrativo; “vieram” é direto e natural.
- source_word: τὴν νύκτα
  choice: durante a noite
  rationale: O acusativo temporal indica quando ocorreu a ação; esta formulação é corrente e clara em português.
- source_word: κατὰ τὸ ἔθος αὐτῶν
  choice: conforme o costume deles
  rationale: ἔθος designa uma prática habitual; a tradução mantém a proximidade com o grego sem perder naturalidade.
- source_word: καὶ αἱ γυναῖκες
  choice: e as mulheres
  rationale: γυναῖκες pode significar “mulheres” ou “esposas”. Como a expressão isolada não explicita relação conjugal, “mulheres” preserva a ambiguidade sem interpretá-la.
