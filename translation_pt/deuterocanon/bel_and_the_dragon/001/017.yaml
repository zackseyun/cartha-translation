  text: And he said[a], “Are the seals intact, Daniel?” And he said, “They are intact, O king.”
translation:
  language: pt
  text: 'E ele perguntou[a]: “Os selos estão intactos, Daniel?” Ele respondeu: “Estão intactos, ó rei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “E ele disse”. O grego emprega o verbo comum «dizer» tanto na pergunta quanto na resposta.'
    reason: literal_rendering
lexical_decisions:
- source_word: Σῶοι
  choice: intactos
  rationale: O adjetivo significa literalmente «sãos, seguros»; aplicado aos selos, «intactos» expressa naturalmente que não foram rompidos nem violados.
- source_word: αἱ σφραγῖδες
  choice: os selos
  rationale: Refere-se aos selos ou impressões usados para assegurar a entrada; «os selos» é a formulação direta e natural em português.
- source_word: βασιλεῦ
  choice: ó rei
  rationale: O vocativo grego indica tratamento direto e solene; «ó rei» preserva essa força sem acrescentar uma ideia possessiva.
- source_word: καὶ εἶπεν ... ὁ δὲ εἶπεν
  choice: E ele perguntou ... Ele respondeu
  rationale: Embora o grego repita «disse», o conteúdo das falas estabelece claramente pergunta e resposta. A variação verbal oferece português natural sem alterar o sentido.
