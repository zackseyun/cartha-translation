base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/032.yaml
  text: There were seven lions in the pit[a], and each day they were given two bodies and two sheep; but then nothing was given to them, so that they might devour Daniel.
translation:
  language: pt
  text: Havia sete leões na cova, e todos os dias lhes davam dois corpos[a] e duas ovelhas. Mas, naquela ocasião, não lhes deram nada, para que devorassem Daniel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dois cadáveres»; o grego diz literalmente «dois corpos» (σώματα), e o contexto indica que serviam de alimento para os leões.
    reason: lexical_alternative
lexical_decisions:
- source_word: λάκκῳ
  choice: cova
  rationale: O termo grego designa uma cova ou fosso; «cova» conserva a imagem concreta sem substituir o termo por «jaula» ou explicá-lo como «covil».
- source_word: ἑπτὰ λέοντες
  choice: sete leões
  rationale: Tradução direta do numeral e do substantivo.
- source_word: ἐδίδοτο αὐτοῖς τὴν ἡμέραν
  choice: todos os dias lhes davam
  rationale: O imperfeito passivo expressa uma provisão habitual; a construção ativa impessoal com sujeito não expresso é natural em português e mantém indefinido quem fornecia o alimento.
- source_word: δύο σώματα
  choice: dois corpos
  rationale: σώματα significa literalmente «corpos». Embora o contexto sugira cadáveres usados como alimento, a tradução preserva a expressão mais ampla do grego e registra a interpretação contextual em nota.
- source_word: δύο πρόβατα
  choice: duas ovelhas
  rationale: Equivalente comum e natural de πρόβατα neste contexto.
- source_word: τότε δὲ οὐκ ἐδόθη αὐτοῖς
  choice: Mas, naquela ocasião, não lhes deram nada
  rationale: τότε contrasta a prática diária com essa ocasião específica; «nada» explicita de modo idiomático em português o objeto negado da construção passiva grega.
- source_word: ἵνα καταφάγωσιν
  choice: para que devorassem
  rationale: A oração final é preservada, e «devorar» comunica a força intensiva de καταφάγωσιν no contexto de leões.
- source_word: τὸν Δανιήλ
  choice: Daniel
  rationale: Forma portuguesa convencional do nome próprio.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A pontuação divide o longo período grego em duas frases para facilitar a leitura, sem alterar sua progressão lógica. A nota foi colocada junto de «corpos», expressão a que de fato se refere.
