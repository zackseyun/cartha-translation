base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/038.yaml
  text: Take the meal that God has sent you. And Daniel said[a], “For you have remembered me, O God, and have not forsaken those who love you.”
translation:
  language: pt
  text: '“Receba a refeição[a] que Deus lhe enviou.” E Daniel disse: “Pois te lembraste de mim, ó Deus, e não abandonaste os que te amam[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a melhor porção” ou “o alimento escolhido”; o termo grego pode designar uma refeição principal ou alimento de qualidade.
    reason: lexical_alternative
  - marker: b
    text: Em grego, literalmente, “os que amam”; o objeto é entendido pelo contexto.
    reason: source_ambiguity
lexical_decisions:
- source_word: λάβε
  choice: Receba
  rationale: O imperativo manda Daniel acolher o alimento que lhe foi trazido; “receba” é natural em português e evita que “tome” seja entendido apenas como “coma”.
- source_word: τὸ ἄριστον
  choice: a refeição
  rationale: Neste contexto, ἄριστον designa o alimento ou a refeição levada a Daniel. A nota preserva as possíveis nuances de qualidade ou porção principal.
- source_word: ἀπέστειλέν σοι
  choice: lhe enviou
  rationale: Reproduz de modo claro o aoristo e o destinatário expresso pelo pronome σοι.
- source_word: Ἐμνήσθης γάρ μου
  choice: Pois te lembraste de mim
  rationale: Mantém γάρ e a linguagem de oração, na qual “lembrar-se” expressa atenção e cuidado efetivos.
- source_word: οὐκ ἐγκατέλιπες
  choice: não abandonaste
  rationale: “Abandonar” comunica com força e naturalidade o sentido de deixar para trás ou desamparar.
- source_word: τοὺς ἀγαπῶντάς
  choice: os que te amam
  rationale: O objeto não está expresso no trecho grego fornecido, mas é naturalmente inferido da invocação direta a Deus. O pronome torna a frase idiomática em português, e a nota registra a forma literal.
theological_decisions:
- issue: Objeto implícito de τοὺς ἀγαπῶντάς
  choice: os que te amam
  alternative: os que amam
  rationale: Como Daniel fala diretamente com Deus, o referente mais natural do amor é o próprio Deus. A tradução explicita essa relação sem transformá-la em formulação doutrinária; a ausência formal do objeto no texto fornecido é preservada em nota.
translation_notes:
  register: Português atual, claro e digno, com formas verbais tradicionais na oração direta a Deus (“te lembraste”, “abandonaste”), amplamente compreensíveis no Brasil e no restante do mundo lusófono.
