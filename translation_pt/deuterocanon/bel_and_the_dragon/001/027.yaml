  text: And Daniel took pitch and fat and hair[a], and boiled them together and made cakes, and put them into the dragon’s mouth; and when the dragon had eaten them, it burst apart. And he said, “See your objects of worship.”
translation:
  language: pt
  text: 'Daniel pegou piche, gordura e pelos, ferveu tudo junto e fez bolos. Depois os colocou na boca do dragão; quando o dragão os comeu, rebentou. Então Daniel disse: “Vejam os seus objetos de culto[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as suas coisas sagradas” ou “aquilo que vocês veneram”; o grego se refere a objetos considerados dignos de reverência ou culto.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίσσαν
  choice: piche
  rationale: Designa uma substância resinosa semelhante a alcatrão. “Piche” é corrente, concreto e adequado ao contexto.
- source_word: στῖρ
  choice: gordura
  rationale: O termo indica gordura animal; “gordura” mantém o sentido amplo sem especificar indevidamente sebo ou banha.
- source_word: τρίχας
  choice: pelos
  rationale: O plural grego se refere a pelos ou cabelos. No contexto de ingredientes materiais, “pelos” é a formulação portuguesa mais natural e não restringe a origem.
- source_word: ἥψησεν ἐπὶ τὸ αὐτό
  choice: ferveu tudo junto
  rationale: Preserva tanto a ação de ferver/cozinhar quanto a combinação dos ingredientes numa só mistura.
- source_word: μάζας
  choice: bolos
  rationale: O substantivo designa porções ou massas moldadas; “bolos” preserva a imagem alimentar sem impor o formato de bolas ou pães.
- source_word: δράκοντος
  choice: dragão
  rationale: É a tradução tradicional e contextualmente apropriada de δράκων nesta narrativa.
- source_word: φαγὼν
  choice: quando o dragão os comeu
  rationale: A oração temporal expressa naturalmente a sequência indicada pelo particípio aoristo, com sujeito e objeto explicitados para clareza.
- source_word: διερράγη
  choice: rebentou
  rationale: Comunica a ruptura violenta expressa pelo verbo, em linguagem breve e compreensível em português.
- source_word: τὰ σεβάσματα ὑμῶν
  choice: os seus objetos de culto
  rationale: Mantém a referência ampla a objetos reverenciados ou adorados, sem introduzir diretamente o termo mais interpretativo “ídolos”.
theological_decisions:
- issue: Tradução de τὰ σεβάσματα ὑμῶν no contexto de polêmica contra a idolatria
  choice: os seus objetos de culto
  alternative: os seus ídolos; as suas coisas sagradas; aquilo que vocês veneram
  rationale: O grego designa aquilo que é tido em reverência ou recebe culto. A opção escolhida conserva a amplitude lexical e deixa que a ironia da narrativa transmita a crítica, sem intensificá-la além do texto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. “Rebentou” preserva a força dramática do grego; “objetos de culto” mantém a tensão entre descrição lexical e crítica implícita à idolatria.
