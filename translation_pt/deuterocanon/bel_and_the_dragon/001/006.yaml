lexical_decisions:
- source_word: γῆν
  choice: a terra
  rationale: Neste contexto, γῆ designa a terra criada por Deus, não um território específico.
- source_word: ἔχοντα
  choice: tem
  rationale: O particípio depende da construção iniciada no contexto anterior; em português, a forma verbal finita dá continuidade natural à oração sem acrescentar conteúdo ausente.
- source_word: πάσης σαρκὸς
  choice: toda carne
  rationale: Mantém a expressão bíblica e sua possível abrangência, sem restringi-la apenas à humanidade ou ampliá-la explicitamente a todos os seres vivos.
- source_word: κυρίαν
  choice: domínio
  rationale: Expressa autoridade soberana de modo claro e digno em português, de acordo com o valor do termo neste contexto.
- source_word: δοκεῖ
  choice: parece
  rationale: Preserva a formulação do rei em termos daquilo que lhe parece evidente, em vez de convertê-la em uma afirmação direta.
- source_word: ζῶν θεός
  choice: um deus vivo
  rationale: A construção indefinida é natural em português e evita transformar a fala sobre Bel no título confessional «o Deus vivo».
- source_word: ὁρᾷς
  choice: não vê
  rationale: Reproduz diretamente a pergunta retórica no presente.
- source_word: ὅσα ἐσθίει
  choice: quanto ele come
  rationale: Comunica a ideia de quantidade que serve de suposta prova de que Bel está vivo, em vez de sugerir uma lista de alimentos.
theological_decisions:
- issue: Alcance de πάσης σαρκὸς na descrição do domínio de Deus
  choice: toda carne
  alternative: toda a humanidade; todo ser vivo
  rationale: A expressão bíblica é mantida sem resolver de modo indevido se o referente é especificamente a humanidade ou os seres vivos em sentido mais amplo.
- issue: ζῶν θεός na fala do rei pagão a respeito de Bel
  choice: um deus vivo
  alternative: o Deus vivo
  rationale: O grego não apresenta artigo nessa expressão, e o contexto se refere a Bel; usar «o Deus vivo» importaria um título confessional inadequado à fala.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e compreensão internacional. Conservou-se a expressão bíblica «toda carne» e a interrupção final do extrato. A colocação «lhe disse» evita regionalizar excessivamente o tratamento dirigido a Daniel.
