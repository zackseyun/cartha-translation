base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/021.yaml
  text: Then the king became angry and arrested the priests and their wives and children[b][a], and they showed him the secret doors through which they used to go in and consume what was on the table.
translation:
  language: pt
  text: Então o rei ficou irado e prendeu os sacerdotes, suas esposas e seus filhos. Eles lhe mostraram as portas secretas[a] pelas quais costumavam entrar e consumir o que estava sobre a mesa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “portas escondidas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “pelas quais entravam e consumiam as coisas que estavam sobre a mesa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: ficou irado
  rationale: Expressa naturalmente a mudança de estado indicada pelo particípio aoristo, sem exagerar a intensidade.
- source_word: συνέλαβεν
  choice: prendeu
  rationale: No contexto punitivo e judicial, comunica uma detenção, e não apenas o ato físico de agarrar.
- source_word: ἱερεῖς
  choice: sacerdotes
  rationale: Equivalente corrente e direto de ἱερεῖς; o contexto identifica sua ligação com Bel.
- source_word: γυναῖκας
  choice: suas mulheres
  rationale: Na enumeração familiar junto a 'seus filhos', refere-se provavelmente às esposas; 'suas mulheres' preserva esse sentido relacional em linguagem bíblica ainda clara.
- source_word: τέκνα
  choice: seus filhos
  rationale: Designa os filhos de modo abrangente, sem restringir o termo aos descendentes do sexo masculino.
- source_word: κρυπτὰς θύρας
  choice: portas secretas
  rationale: Descreve de modo concreto os acessos ocultos usados no engano; a nota registra a alternativa 'portas escondidas'.
- source_word: διʼ ὧν εἰσεπορεύοντο
  choice: pelas quais costumavam entrar
  rationale: O imperfeito indica uma ação habitual no passado, adequadamente expressa por 'costumavam'.
- source_word: ἐδαπάνων
  choice: consumir
  rationale: Mantém o sentido amplo de gastar ou consumir, apropriado aos itens colocados sobre a mesa, sem explicitar 'comer' além do grego.
- source_word: τὰ ἐπὶ τῇ τραπέζῃ
  choice: o que estava sobre a mesa
  rationale: Tradução natural do sintagma nominal, sem acrescentar explicitamente 'comida', embora isso seja sugerido pelo contexto.
theological_decisions:
- issue: Sentido de γυναῖκας na enumeração doméstica
  choice: suas mulheres
  alternative: as mulheres
  rationale: O possessivo e a associação com os filhos favorecem o sentido de esposas, sem introduzir conteúdo teológico adicional.
- issue: Força narrativa de συνέλαβεν
  choice: prendeu
  alternative: agarrou
  rationale: A ação do rei após descobrir a fraude tem caráter punitivo e judicial; 'prendeu' transmite isso com clareza.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem narrativa e o aspecto habitual do imperfeito grego foram preservados. Os marcadores aparecem no texto em ordem de ocorrência.
