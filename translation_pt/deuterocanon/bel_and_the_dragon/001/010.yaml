  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/010.yaml
  text: Daniel said to the king[a], “Let it be according to your word.” And there were seventy priests of Bel, besides women and children[c][b]; and he came in.
translation:
  language: pt
  text: 'Daniel disse ao rei: “Que seja conforme a tua palavra.”[a] Havia setenta sacerdotes de Bel, sem contar as mulheres e as crianças;[b] e ele veio.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “conforme a tua palavra”; a expressão indica que Daniel aceitou a proposta do rei.
    reason: lexical_alternative
  - marker: b
    text: Ou “além das mulheres e das crianças”.
    reason: lexical_alternative
  - marker: c
    text: O versículo termina com “e ele veio”, sem indicar aqui o destino; este é esclarecido pelo contexto seguinte.
    reason: cross_reference
lexical_decisions:
- source_word: Γινέσθω
  choice: Que seja
  rationale: O imperativo na terceira pessoa expressa a concordância de Daniel com a proposta do rei, preservando a força volitiva do grego.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: conforme a tua palavra
  rationale: Mantém a referência à declaração do rei e o tom formal, sem ampliar o sentido para “ordem” ou “mandamento”.
- source_word: ἱερεῖς τοῦ Βὴλ
  choice: sacerdotes de Bel
  rationale: Tradução direta e idiomática para os oficiais do culto associados à divindade Bel.
- source_word: ἑβδομήκοντα
  choice: setenta
  rationale: Correspondência direta do numeral cardinal.
- source_word: ἐκτὸς γυναικῶν καὶ τέκνων
  choice: sem contar as mulheres e as crianças
  rationale: Explicita naturalmente em português que mulheres e crianças estavam excluídas do total de setenta.
- source_word: ἦλθεν
  choice: veio
  rationale: Preserva o valor básico do aoristo de ἔρχομαι e evita introduzir neste versículo um destino ou a ação mais específica de entrar, que o grego não declara expressamente.
