translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases reduz o encadeamento pesado de orações sem alterar a sequência narrativa. O pronome enfático αὐτός não foi vertido separadamente, pois neste contexto apenas retoma o sujeito de modo natural.
