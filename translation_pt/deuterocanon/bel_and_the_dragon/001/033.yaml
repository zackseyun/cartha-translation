  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/033.yaml
  text: And Habakkuk the prophet was in Judea[a], and he had cooked a stew and crumbled bread into a bowl[c][b], and was going to the field to bring it to the reapers.
translation:
  language: pt
  text: O profeta Habacuque estava na Judeia[a]. Ele havia preparado um cozido[b] e esmigalhado pães numa vasilha e estava indo ao campo para levar a comida aos ceifeiros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em Judá”. O grego Ἰουδαία pode designar a região da Judeia ou, em certos contextos, Judá.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “alimento cozido” ou “algo fervido”. “Cozido” comunica naturalmente o sentido de um prato preparado em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμβακοὺμ ὁ προφήτης
  choice: o profeta Habacuque
  rationale: Emprega a forma portuguesa tradicional do nome e mantém o artigo grego, que identifica Habacuque como o profeta conhecido.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: na Judeia
  rationale: É o sentido geográfico helenístico mais provável neste contexto, embora “em Judá” também seja lexicalmente possível.
- source_word: ἥψησεν ἕψεμα
  choice: havia preparado um cozido
  rationale: O verbo e o substantivo pertencem ao campo semântico de cozinhar ou ferver. “Preparado um cozido” é natural em português e conserva a ideia de um alimento cozido sem especificar ingredientes.
- source_word: ἐνέθρυψεν ἄρτους
  choice: partido pães em pedaços
  rationale: Expressa de modo claro o ato de quebrar os pães em partes pequenas, preservando o plural explícito de ἄρτους.
- source_word: εἰς σκάφην
  choice: dentro de uma vasilha
  rationale: σκάφη designa aqui um recipiente para o alimento; “vasilha” evita precisar excessivamente sua forma ou tamanho.
- source_word: εἰς τὸ πεδίον
  choice: ao campo
  rationale: No contexto dos ceifeiros, “campo” é o equivalente contextual mais direto de πεδίον.
- source_word: ἀπενέγκαι τοῖς θερισταῖς
  choice: levá-lo aos ceifeiros
  rationale: O infinitivo indica a finalidade do deslocamento, e o pronome retoma naturalmente o alimento preparado; “ceifeiros” preserva o sentido agrícola específico.
