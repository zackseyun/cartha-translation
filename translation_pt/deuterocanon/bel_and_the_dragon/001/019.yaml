  text: Not even one. And Daniel laughed[a], and held the king back from going inside, and said, “Now look at the floor, and take notice.”
translation:
  language: pt
  text: 'Nem um sequer. Daniel riu, impediu o rei de entrar lá dentro e disse: “Olhe agora para o chão e perceba[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grego literalmente, «conheça» ou «reconheça»; aqui, o sentido é observar atentamente e perceber o que o chão revela.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ εἷς
  choice: Nem um sequer
  rationale: Preserva a negação enfática e abrupta do grego sem explicitar um referente que permanece elíptico.
- source_word: ἐγέλασεν
  choice: riu
  rationale: É o sentido direto do verbo; evita tanto atenuá-lo como sorriso quanto interpretá-lo como zombaria.
- source_word: ἐκράτησεν τὸν βασιλέα τοῦ μὴ εἰσελθεῖν αὐτὸν ἔσω
  choice: impediu o rei de entrar
  rationale: Expressa de modo natural a construção de prevenção, sem acrescentar violência física não exigida pelo texto.
- source_word: Ἴδε δὴ
  choice: Agora olhe
  rationale: O imperativo chama a atenção, e δή comunica a urgência ou imediatismo do gesto.
- source_word: τὸ ἔδαφος
  choice: o chão
  rationale: No ambiente interior do templo, 'chão' é claro e contextual, sem a tecnicidade de 'pavimento'.
- source_word: γνῶθι
  choice: reconheça o que vê
  rationale: Comunica a percepção resultante de examinar o chão; a leve explicitação produz português natural e mantém o valor cognitivo do imperativo.
