  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/018.yaml
  text: And it happened, when the doors were opened, that the king looked at the table and cried out with a loud voice, “Great are you, Bel, and there is no deceit with you.”
translation:
  language: pt
  text: 'E aconteceu que, quando as portas foram abertas, o rei olhou para a mesa e gritou em alta voz: “Grande és tu, Bel, e não há engano em ti!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἐγένετο
  choice: E aconteceu que
  rationale: Preserva a fórmula de transição narrativa em português atual, sem recorrer ao mais arcaico «e sucedeu que».
- source_word: ἅμα τῷ ἀνοῖξαι
  choice: quando ... foram abertas
  rationale: Expressa diretamente a relação temporal da construção grega, sem intensificar necessariamente a ideia com «assim que».
- source_word: τὰς θύρας
  choice: as portas
  rationale: É o sentido comum de θύραι e se ajusta ao contexto imediato.
- source_word: ἐπιβλέψας
  choice: olhou para
  rationale: Reproduz o ato visual básico do particípio sem acrescentar a ideia de exame ou inspeção.
- source_word: τὴν τράπεζαν
  choice: a mesa
  rationale: Traduz o substantivo sem explicitar no texto que se trata da mesa das oferendas, informação fornecida pelo contexto.
- source_word: ἐβόησεν φωνῇ μεγάλῃ
  choice: gritou em alta voz
  rationale: Conserva tanto a força de ἐβόησεν quanto a expressão explícita φωνῇ μεγάλῃ em linguagem natural e digna.
- source_word: Μέγας εἶ
  choice: Grande és tu
  rationale: Mantém a ordem enfática e exclamativa do grego, ainda compreensível e solene em português moderno.
- source_word: Βήλ
  choice: Bel
  rationale: Translitera o nome próprio/divino segundo a forma tradicional em português.
- source_word: οὐκ ἔστιν παρὰ σοὶ δόλος
  choice: não há engano em ti
  rationale: δόλος indica engano, fraude ou dolo. «Em ti» comunica naturalmente em português a atribuição feita pelo rei, sem introduzir explicações adicionais.
theological_decisions:
- issue: A declaração do rei sobre Bel pode parecer uma confirmação teológica do narrador.
  choice: 'Manter a afirmação como discurso direto e enfático do rei: «Grande és tu, Bel, e não há engano em ti!»'
  alternative: Acrescentar uma qualificação que apresente a frase apenas como impressão equivocada do rei.
  rationale: O grego registra diretamente a exclamação do rei. A tradução preserva a ironia dramática e a tensão narrativa sem inserir uma correção editorial no texto.
translation_notes:
  register: Português moderno de ampla compreensão, com boa legibilidade brasileira. O registro narrativo é claro e digno; «Grande és tu» retém a ênfase elevada da fala sem tornar o restante do versículo arcaico.
