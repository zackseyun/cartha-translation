  text: But they were unconcerned[a], because they had made a hidden entrance under the table, and through it they would go in
translation:
  language: pt
  text: Mas eles não davam importância[a], porque tinham feito uma entrada escondida debaixo da mesa e entravam por ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «faziam pouco caso» ou «desprezavam». O verbo grego tem uma gama de sentidos que inclui desprezar, desdenhar e não dar importância.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεφρόνουν
  choice: não deram importância
  rationale: O verbo pode expressar desprezo, desdém ou a atitude de fazer pouco caso. No contexto, indica que eles não consideraram a medida de Daniel uma ameaça, sem exigir um objeto pessoal para o desprezo.
- source_word: πεποιήκεσαν
  choice: tinham feito
  rationale: O mais-que-perfeito grego indica uma ação anterior que explica a atitude deles.
- source_word: κεκρυμμένην εἴσοδον
  choice: uma entrada escondida
  rationale: Reproduz com clareza a ideia de uma entrada mantida oculta.
- source_word: ὑπὸ τὴν τράπεζαν
  choice: debaixo da mesa
  rationale: Expressão espacial natural e fiel; evita interpretar a mesa mais especificamente como altar.
- source_word: διʼ αὐτῆς
  choice: por ela
  rationale: O pronome feminino retoma naturalmente «entrada» e indica o meio ou passagem usada.
- source_word: εἰσεπορεύοντο
  choice: entravam
  rationale: O imperfeito comunica uma ação habitual ou repetida no passado, e não apenas uma entrada isolada.
