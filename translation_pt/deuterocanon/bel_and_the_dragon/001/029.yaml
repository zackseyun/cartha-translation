base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/029.yaml
  text: And they came to the king and said[a], “Hand Daniel over to us[b]; otherwise we will kill you and your household.”
translation:
  language: pt
  text: 'E eles foram até o rei e disseram: “Entregue-nos Daniel[a]; caso contrário, mataremos você e os da sua casa[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ponha Daniel em nossas mãos” ou “Entregue Daniel a nós”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a sua casa”. Aqui, a expressão se refere aos membros da casa, da família ou do círculo doméstico do rei, e não apenas ao edifício.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παράδος
  choice: Entregue-nos
  rationale: O imperativo aoristo de παραδίδωμι exige que Daniel seja entregue ao poder deles. “Entregue-nos” é direto e natural em português, sem acrescentar conotação jurídica.
- source_word: ἡμῖν
  choice: -nos
  rationale: O pronome dativo indica os destinatários da entrega e é expresso naturalmente pelo pronome enclítico em português.
- source_word: τὸν Δανιήλ
  choice: Daniel
  rationale: Forma tradicional e corrente do nome pessoal em português.
- source_word: εἰ δὲ μή
  choice: caso contrário
  rationale: Expressa de modo idiomático a condição negativa que introduz o ultimato.
- source_word: ἀποκτενοῦμέν
  choice: mataremos
  rationale: O futuro de ἀποκτείνω é traduzido de modo simples e direto, sem acrescentar caráter judicial ou avaliação moral.
- source_word: σε
  choice: você
  rationale: Objeto singular dirigido ao rei; “você” oferece leitura ampla e natural no português moderno.
- source_word: τὸν οἶκόν σου
  choice: os da sua casa
  rationale: No contexto da ameaça, οἶκος designa as pessoas pertencentes à casa ou família do rei, não simplesmente o edifício. A formulação preserva a imagem de “casa” e deixa amplo o vínculo doméstico ou familiar.
- source_word: ἐλθόντες πρὸς τὸν βασιλέα
  choice: foram até o rei
  rationale: O particípio é convertido naturalmente em verbo finito, mantendo a sequência narrativa de aproximação e fala.
theological_decisions:
- issue: Alcance de οἶκος na ameaça
  choice: os da sua casa
  alternative: sua casa; sua família; sua casa inteira
  rationale: A ameaça visa pessoas ligadas à casa do rei. “Os da sua casa” evita sugerir que pretendiam matar um edifício, mas não restringe o sentido apenas a parentes consanguíneos.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O discurso conserva o tom brusco do ultimato. “Os da sua casa” mantém a metáfora grega e esclarece implicitamente que a ameaça recai sobre pessoas.
