base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/040.yaml
  text: He set Habakkuk down at once in his own place[a]. Then the king came on the seventh day to mourn for Daniel, and he came to the pit and looked in, and behold[b], Daniel was sitting there.
translation:
  language: pt
  text: Ele pôs Habacuque imediatamente em seu lugar.[a] No sétimo dia, o rei foi lamentar Daniel. Chegou à cova, olhou para dentro e eis que Daniel estava sentado ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para o seu lugar”. A expressão grega usa uma preposição que indica movimento para um destino; depois de “pôs”, “em seu lugar” é mais natural em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέστησεν
  choice: pôs
  rationale: O verbo indica que Habacuque foi colocado de volta em determinado lugar. “Pôs” é concreto, natural e não acrescenta uma ideia de restauração que o verbo, isoladamente, não exige.
- source_word: παραχρῆμα
  choice: imediatamente
  rationale: Preserva de modo claro e corrente a ideia de ação sem demora.
- source_word: εἰς τὸν τόπον αὐτοῦ
  choice: em seu lugar
  rationale: Depois de “pôs”, a preposição “em” é idiomática em português e comunica o lugar próprio ou original de Habacuque; a nota registra a forma mais literal com “para”.
- source_word: πενθῆσαι
  choice: lamentar
  rationale: O infinitivo exprime a finalidade da ida do rei e sugere luto por alguém que ele julgava morto, sem explicitar além do texto.
- source_word: λάκκον
  choice: cova
  rationale: “Cova” mantém o sentido amplo de uma cavidade ou poço escavado e funciona naturalmente no contexto, sem substituir o termo grego por uma designação mais especializada de covil de leões.
- source_word: ἐνέβλεψεν
  choice: olhou para dentro
  rationale: Expressa naturalmente que o rei dirigiu o olhar ao interior da cova.
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Conserva a vivacidade narrativa e a surpresa da descoberta sem achatar a partícula.
- source_word: καθήμενος
  choice: estava sentado ali
  rationale: Reproduz a postura de Daniel e torna explícita, de modo natural em português, sua presença dentro da cova.
theological_decisions:
- issue: A ação de luto do rei em relação a Daniel
  choice: foi lamentar Daniel
  alternative: foi chorar por Daniel
  rationale: A formulação preserva a expectativa do rei de que Daniel estivesse morto e a força de luto do verbo, sem acrescentar interpretação teológica.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A repetição grega de “veio” foi levemente ajustada para “foi” e “chegou”, evitando rigidez sem perder a sequência narrativa. “E eis que” conserva deliberadamente o destaque literário de ἰδού.
