  text: and they consumed them completely. And it happened that[a], when those men had gone out, the king set the food before Bel, and Daniel commanded his young servants, and they brought ashes and scattered them over the whole temple in the presence of the king alone. Then, after going out, they shut the door and sealed it with the king’s signet ring, and went away.
translation:
  language: pt
  text: E as consumiam por completo. E aconteceu que, quando aqueles homens saíram, o rei pôs os alimentos diante de Bel. Daniel deu uma ordem aos seus jovens servos, e eles trouxeram cinzas e as espalharam por todo o templo, com apenas o rei presente.[a] Depois, saíram, fecharam a porta, selaram-na com o anel de sinete do rei e foram embora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na presença somente do rei”. A expressão grega ressalta que somente o rei presenciou o ato de espalhar as cinzas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διόλου καὶ ἀνήλουν αὐτά
  choice: e as consumiam por completo
  rationale: O imperfeito ἀνήλουν indica ação habitual ou contínua no contexto, enquanto διόλου intensifica a totalidade do consumo.
- source_word: παρέθηκεν τὰ βρώματα τῷ Βήλ
  choice: pôs os alimentos diante de Bel
  rationale: Preserva o sentido de apresentar ou colocar comida diante da divindade, em linguagem portuguesa natural e digna.
- source_word: ἐπέταξεν
  choice: deu uma ordem
  rationale: Expressa claramente o ato de ordenar, mantendo um registro formal sem recorrer a uma construção rígida.
- source_word: τοῖς παιδαρίοις αὐτοῦ
  choice: aos seus jovens servos
  rationale: παιδάριον pode designar meninos ou jovens auxiliares; o contexto destaca tanto a juventude quanto a função de serviço.
- source_word: τέφραν ... κατέσποραν
  choice: cinzas e as espalharam
  rationale: Traduz diretamente o material e a ação de distribuí-lo pela superfície do templo.
- source_word: ὅλον τὸν ναὸν
  choice: por todo o templo
  rationale: ναός designa aqui o santuário de Bel; 'templo' é o equivalente corrente e reconhecível.
- source_word: ἐσφραγίσαντο ἐν τῷ δακτυλίῳ τοῦ βασιλέως
  choice: selaram-na com o anel de sinete do rei
  rationale: Torna explícita a função oficial do anel usado para autenticar e proteger o fechamento da porta.
