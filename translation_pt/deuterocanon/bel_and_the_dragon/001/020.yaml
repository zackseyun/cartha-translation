lexical_decisions:
- source_word: τίνος
  choice: De quem
  rationale: Reproduz naturalmente em português o interrogativo genitivo que pergunta a quem pertencem as pegadas.
- source_word: ἴχνη
  choice: pegadas
  rationale: No contexto, refere-se especificamente às marcas deixadas pelos pés; “pegadas” é claro e idiomático.
- source_word: ταῦτα
  choice: estas
  rationale: Preserva o valor dêitico do demonstrativo, apontando para evidências visíveis e próximas.
- source_word: Ὁρῶ
  choice: Vejo
  rationale: Equivalente direto e natural do verbo de percepção no presente.
- source_word: ἀνδρῶν
  choice: homens
  rationale: Designa especificamente adultos do sexo masculino, em contraste com mulheres e crianças.
- source_word: γυναικῶν
  choice: mulheres
  rationale: O sentido genérico “mulheres” se ajusta à enumeração; “esposas” introduziria uma relação não expressa.
- source_word: παιδίων
  choice: crianças
  rationale: Expressa de modo corrente o grupo infantil sem determinar uma faixa etária mais estreita do que o grego.
