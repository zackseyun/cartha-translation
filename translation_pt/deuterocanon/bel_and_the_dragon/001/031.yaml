  text: But they threw him into the lions' pit[a], and he was there for six days.
translation:
  language: pt
  text: Mas eles o lançaram na cova dos leões[a], e ele ficou ali durante seis dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «fosso dos leões». O termo grego designa literalmente uma cova ou um fosso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mas eles
  rationale: δέ marca aqui continuação com leve contraste; «Mas eles» preserva essa nuance de modo natural.
- source_word: ἔβαλον
  choice: lançaram
  rationale: O aoristo de βάλλω expressa uma ação deliberada e enérgica; «lançaram» é digno e mais forte que «colocaram».
- source_word: λάκκον τῶν λεόντων
  choice: cova dos leões
  rationale: λάκκος designa uma cova ou fosso. «Cova dos leões» é expressão clara e corrente em português, sem perder a ideia concreta do grego.
- source_word: ἦν ἐκεῖ
  choice: ficou ali
  rationale: Embora o grego diga literalmente «estava ali», no contexto «ficou ali» comunica naturalmente a permanência resultante.
- source_word: ἡμέρας ἕξ
  choice: durante seis dias
  rationale: O acusativo indica extensão de tempo; «durante seis dias» torna explícita essa duração.
