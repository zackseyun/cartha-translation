lexical_decisions:
- source_word: ἀναβοήσας
  choice: clamando
  rationale: O particípio aoristo indica um brado forte. “Clamando” preserva a intensidade sem determinar uma emoção específica.
- source_word: φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: Expressão portuguesa natural que comunica diretamente a intensidade audível do idioma grego.
- source_word: Μέγας εἶ
  choice: Grande és tu
  rationale: A ordem mantém a ênfase inicial do predicativo Μέγας e o tom elevado da exclamação.
- source_word: Κύριε
  choice: Senhor
  rationale: Em uma invocação dirigida a Deus, “Senhor” é a tradução natural e tradicional de κύριος.
- source_word: ὁ θεὸς
  choice: o Deus
  rationale: Preserva o artigo grego e apresenta “o Deus” como aposição explicativa de “Senhor”.
- source_word: τοῦ
  choice: do
  rationale: O artigo genitivo grego exige uma continuação nominal. Como o texto fornecido termina nesse ponto, a contração portuguesa “do” preserva de modo transparente a frase incompleta.
theological_decisions:
- issue: Tradução de κύριος em invocação divina
  choice: Senhor
  alternative: Mestre
  rationale: A fala se dirige a Deus, e “Senhor” é o equivalente adequado ao título divino neste contexto.
- issue: Tratamento do texto-fonte incompleto, que termina em τοῦ
  choice: Manter a oração incompleta em português
  alternative: Suprir a continuação provável com base no contexto ou na tradição textual adjacente
  rationale: A primazia do texto grego fornecido exige que não se acrescentem palavras ausentes. A nota torna explícita a razão da interrupção.
translation_notes:
  register: Português moderno, claro e solene. “Clamando em alta voz” mantém a força da expressão grega sem soar excessivamente arcaico; “Grande és tu” conserva a ênfase e o caráter exclamativo. A citação permanece sem fechamento porque o próprio texto-fonte termina no meio da frase.
