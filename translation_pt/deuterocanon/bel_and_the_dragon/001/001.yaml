  text: And King Astyages was gathered to his fathers,[a]
translation:
  language: pt
  text: E o rei Astíages foi reunido aos seus antepassados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “foi acrescentado a seus antepassados”, uma expressão bíblica que significa que ele morreu.
