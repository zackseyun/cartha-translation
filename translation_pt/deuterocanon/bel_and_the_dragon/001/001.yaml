lexical_decisions:
- source_word: ΚΑΙ
  choice: E
  rationale: Preserva o conectivo narrativo simples e o fluxo paratático do grego, sem acrescentar uma nuance temporal.
- source_word: ὁ βασιλεὺς Ἀστυάγης
  choice: o rei Astíages
  rationale: Mantém o artigo definido do grego e emprega a forma portuguesa tradicional do nome próprio.
- source_word: προσετέθη
  choice: foi reunido
  rationale: Expressa de modo natural em português a locução bíblica referente à morte, preservando sua imagem e evitando reduzi-la simplesmente a “morreu”.
- source_word: πρὸς τοὺς πατέρας αὐτοῦ
  choice: aos seus pais
  rationale: Conserva a formulação e a ressonância intertextual da expressão bíblica, embora “antepassados” seja uma alternativa mais explícita em português corrente.
theological_decisions:
- issue: Tradução da expressão de morte προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: foi reunido aos seus pais
  alternative: foi acrescentado aos seus pais; morreu
  rationale: A opção mantém a expressão bíblica e sua possível associação com os mortos da linhagem, sem explicitar além do que o texto afirma nem achatar a imagem em uma simples declaração de morte.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa direta. “Aos seus pais” foi mantido por sua ressonância bíblica; a nota esclarece o sentido idiomático e a tradução mais literal.
