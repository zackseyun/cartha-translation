    issue: «aos seus pais» para πρὸς τοὺς πατέρας αὐτοῦ
    rationale: Em português moderno, «pais» remete primariamente a pai e mãe individuais, ao passo que o plural grego πατέρες nesta fórmula bíblica se refere aos antepassados. A redação atual pode sugerir uma reunião com os progenitores, em vez da fórmula de morte ligada à linhagem.
