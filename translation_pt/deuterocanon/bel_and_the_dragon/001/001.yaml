  source_fidelity: A oração é fiel ao conectivo, ao título e ao nome próprio. Contudo, «pais» em português moderno normalmente designa os progenitores imediatos e pode incluir a mãe; não comunica adequadamente o uso bíblico de πατέρες como os ancestrais da linhagem. «Antepassados» transmite com mais precisão o referente idiomático sem reduzir a expressão a «morreu».
  naturalness: «Foi reunido aos seus antepassados» é claro, natural e mantém o tom bíblico-narrativo. Evita a ambiguidade contemporânea de «aos seus pais».
  terminology: «Reunido» é uma boa representação idiomática de προσετέθη neste contexto. «Astíages» é uma forma portuguesa estabelecida e adequada. A nota deve igualmente usar «antepassados» na alternativa literal contextualizada.
  issues:
