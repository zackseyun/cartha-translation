  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/016.yaml
  text: And their children too[a], and they ate up everything and drank it all. Then the king rose early in the morning, and Daniel with him.
translation:
  language: pt
  text: e também as crianças deles. Eles comeram tudo e beberam tudo. Então o rei levantou-se cedo, pela manhã[a], e Daniel com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego repete a ideia de madrugar: literalmente, “levantou-se cedo, pela manhã”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ τέκνα αὐτῶν
  choice: também os filhos deles
  rationale: τέκνα é o termo abrangente para “filhos” ou “crianças”, sem especificar apenas os homens; “também” expressa o καί cumulativo na continuação da lista.
- source_word: κατέφαγον πάντα
  choice: comeram tudo
  rationale: O composto καταφαγεῖν indica consumo completo; em português, “comeram tudo” comunica naturalmente essa ideia junto de πάντα.
- source_word: ἐξέπιον
  choice: beberam tudo
  rationale: O verbo exprime beber por completo. A repetição de “tudo” preserva a totalidade enfática e evita introduzir um objeto não expresso.
- source_word: ὤρθρισεν
  choice: levantou-se bem cedo
  rationale: O verbo denota levantar-se cedo, frequentemente ao amanhecer; “bem cedo” conserva sua força temporal em português natural.
- source_word: πρωί
  choice: pela manhã
  rationale: O advérbio reforça a indicação de tempo já presente em ὤρθρισεν. A tradução mantém ambos os elementos, reorganizando-os de modo idiomático.
- source_word: Δανιὴλ μετʼ αὐτοῦ
  choice: e Daniel com ele
  rationale: A expressão grega é concisa e não repete o verbo. A formulação portuguesa preserva a elipse narrativa e indica que Daniel acompanhou o rei.
