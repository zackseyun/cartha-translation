  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/002.yaml
  text: And Cyrus the Persian received his kingdom[a], and Daniel was a companion of the king and honored above all his friends.
translation:
  language: pt
  text: E Ciro, o persa, recebeu seu reino. Daniel era companheiro do rei e mais honrado do que todos os amigos dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cortesãos” ou “companheiros”; em contextos régios, “amigos” pode designar os associados próximos do rei na corte.
    reason: alternativa lexical e nuance histórico-contextual
lexical_decisions:
- source_word: παρέλαβεν
  choice: recebeu
  rationale: Mantém a ideia de passar a possuir ou assumir o governo sem especificar se a sucessão ocorreu por herança, conquista ou outro meio.
- source_word: τὴν βασιλείαν αὐτοῦ
  choice: o reino dele
  rationale: βασιλεία pode indicar reino, reinado ou poder régio. A formulação preserva a referência pronominal potencialmente ambígua do grego, em vez de identificar silenciosamente seu referente.
- source_word: συνβιωτής
  choice: companheiro
  rationale: O termo raro sugere alguém que vive ou convive com outro e, neste contexto de corte, indica associação próxima com o rei; “companheiro” comunica essa proximidade sem impor a ideia literal de coabitação.
- source_word: ἔνδοξος
  choice: mais honrado
  rationale: No contexto, descreve Daniel como alguém estimado e distinguido. O comparativo é expresso naturalmente em português por causa da construção ὑπὲρ πάντας.
- source_word: ὑπὲρ πάντας τοὺς φίλους αὐτοῦ
  choice: do que todos os amigos dele
  rationale: Preserva o sentido lexical de φίλοι e a comparação, enquanto a nota registra seu possível uso cortesão ou quase técnico.
theological_decisions:
- issue: Nuance cortesã de φίλοι
  choice: amigos
  alternative: cortesãos; companheiros
  rationale: Embora φίλοι signifique literalmente “amigos”, em contextos régios helenísticos pode designar os associados próximos do rei ou membros da corte. O texto principal conserva a forma lexical e a nota apresenta a nuance contextual.
- issue: Referente de αὐτοῦ em τὴν βασιλείαν αὐτοῦ
  choice: dele
  alternative: seu reino; o reino
  rationale: O pronome grego não elimina por si só toda ambiguidade de referente. “O reino dele” mantém essa tensão melhor do que uma formulação que identifique explicitamente o possuidor.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “dele” evita a ambiguidade estrutural de “seu” e preserva sem resolução indevida os referentes pronominais do grego.
