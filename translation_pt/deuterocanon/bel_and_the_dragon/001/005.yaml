    reason: textual_variant
lexical_decisions:
- source_word: προσκυνεῖς
  choice: se prostra diante de
  rationale: Expressa o gesto de submissão e homenagem religiosa sem reduzir o verbo apenas à atitude interior implicada por “adorar”.
- source_word: σέβομαι
  choice: reverencio
  rationale: Comunica honra ou veneração religiosa e mantém uma distinção lexical em relação a προσκυνέω.
- source_word: εἴδωλα χειροποίητα
  choice: ídolos feitos por mãos humanas
  rationale: Preserva tanto a força religiosa negativa de εἴδωλα quanto o contraste entre objetos fabricados por seres humanos e o Deus Criador.
- source_word: τὸν ζῶντα θεόν
  choice: o Deus vivo
  rationale: Formulação portuguesa natural e tradicional que apresenta o Deus conhecido em contraste com ídolos inertes.
- source_word: τὸν κτίσαντα
  choice: que criou
  rationale: Reproduz o particípio identificador e seu sentido elevado de atividade criadora.
- source_word: τὸν οὐρανὸν
  choice: o céu
  rationale: Equivalente português natural do singular grego em uma fórmula de criação.
theological_decisions:
- issue: Frase incompleta no trecho grego fornecido
  choice: Conservar a oração inacabada, terminando em “e”
  alternative: Completar com um objeto como “a terra”, com base no contexto ou em outra forma textual
  rationale: O texto-fonte fornecido termina em καί (“e”). Preservar essa interrupção mantém a transparência textual e evita introduzir palavras ausentes do testemunho apresentado.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” torna a pergunta direta e natural; “se prostra diante de” preserva o componente físico e religioso do verbo grego. A formulação deliberadamente termina em “e”, conforme o trecho-fonte fornecido.
