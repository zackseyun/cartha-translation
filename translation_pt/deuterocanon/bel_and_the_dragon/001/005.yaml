  text: Why do you not bow down to Bel? But he said[a], “Because I do not revere idols made by hands, but the living God, who created heaven and”
translation:
  language: pt
  text: '“Por que você não se prostra diante de Bel?” Ele respondeu[a]: “Porque não reverencio ídolos feitos por mãos humanas, mas o Deus vivo, que criou o céu e”'
  philosophy: optimal-equivalence
  footnotes:
