lexical_decisions:
- source_word: δαπάνην ταύτην
  choice: por esta despesa
  rationale: O substantivo designa despesa ou custo. A preposição, exigida pelo português neste fragmento, explicita de modo natural que a sentença de morte se relaciona com a despesa mencionada.
- source_word: ἀποθανεῖσθε
  choice: vocês morrerão
  rationale: O futuro expressa uma ameaça ou sentença judicial; a forma escolhida é direta, atual e preserva sua força.
- source_word: δείξητε
  choice: se mostrarem
  rationale: Mantém o sentido básico de mostrar ou demonstrar e se ajusta naturalmente à construção condicional.
- source_word: κατεσθίει αὐτά
  choice: come essas coisas
  rationale: O verbo pode ter força intensiva, mas 'come' é idiomático no contexto; o pronome neutro plural retoma as provisões já mencionadas.
- source_word: ἐβλασφήμησεν εἰς τὸν Βήλ
  choice: blasfemou contra Bel
  rationale: '''Blasfemou'' preserva a natureza religiosa da acusação, e ''contra Bel'' representa a direção hostil expressa pela construção grega.'
- source_word: καὶ
  choice: E
  rationale: O versículo grego termina com a conjunção, que liga este fragmento ao versículo seguinte; ela foi preservada apesar da suspensão sintática.
theological_decisions:
- issue: Uso de βλασφημέω com referência a uma divindade pagã
  choice: blasfemou contra Bel
  alternative: falou de modo sacrílego contra Bel
  rationale: A fala é apresentada como uma ofensa religiosa pelos sacerdotes de Bel. 'Blasfemou' preserva a acusação deles sem afirmar que Bel seja realmente divino.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com uso de 'vocês' para o plural. A ordem e a tensão judicial do grego foram preservadas, bem como a conjunção final suspensa.
