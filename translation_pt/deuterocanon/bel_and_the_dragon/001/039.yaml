lexical_decisions:
- source_word: σε
  choice: você
  rationale: Pronome singular de segunda pessoa que conclui uma oração do contexto anterior. “Você” oferece leitura natural e amplamente compreensível em português, embora o fragmento isolado não revele a função sintática completa.
- source_word: ἀναστὰς
  choice: se levantou
  rationale: O particípio aoristo indica que Daniel se levantou antes de comer; a coordenação verbal é a forma mais natural de expressar essa sequência em português.
- source_word: ἔφαγεν
  choice: comeu
  rationale: Aoristo narrativo simples de ἐσθίω, vertido diretamente pelo pretérito perfeito.
- source_word: ἄγγελος τοῦ θεοῦ
  choice: anjo de Deus
  rationale: No contexto narrativo, ἄγγελος designa um ser celestial que age em nome de Deus; a construção genitiva é reproduzida de modo direto.
- source_word: ἀπε-
  choice: …
  rationale: O extrato grego termina apenas com o início truncado de uma palavra. Como esse segmento não permite identificar com segurança nem a forma verbal nem seu sentido, a tradução assinala a interrupção sem completar o texto por conjectura.
theological_decisions:
- issue: Sentido de ἄγγελος em uma narrativa de ação sobrenatural
  choice: anjo
  alternative: mensageiro
  rationale: O contexto apresenta um agente celestial de Deus; “anjo” conserva esse sentido explícito sem reduzir a referência a um mensageiro humano.
- issue: Possível ação final do anjo
  choice: não completar a ação verbal
  alternative: “partiu” ou “foi embora”
  rationale: O testemunho fornecido termina em ἀπε-, que isoladamente não sustenta uma identificação segura do verbo. Evita-se transformar uma conjectura lexical em afirmação narrativa ou teológica.
translation_notes:
  register: Português atual, digno e de leitura ampla. Conservou-se o início fragmentário “você”, que depende do versículo anterior, e marcou-se com reticências a interrupção real do extrato grego. O ponto e vírgula representa com naturalidade a mudança de sujeito após a primeira ação narrativa.
