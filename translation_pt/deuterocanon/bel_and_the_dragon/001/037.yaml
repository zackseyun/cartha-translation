  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/037.yaml
  text: And Habakkuk cried out[a], saying, “Daniel, Daniel, take the meal that God has sent you.”
translation:
  language: pt
  text: 'E Habacuque gritou[a]: “Daniel, Daniel, tome a refeição que Deus lhe enviou!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A linha grega fornecida está truncada depois de “Daniel, Daniel” e termina com uma letra isolada. O restante da tradução segue a continuação usual deste versículo na forma de Teodocião de Bel e o Dragão, na qual Habacuque anuncia a refeição que Deus enviou a Daniel.
    reason: textual_variant
lexical_decisions:
- source_word: ἐβόησεν
  choice: gritou
  rationale: O verbo indica uma emissão de voz forte. “Gritou” preserva essa intensidade e soa natural na cena narrativa.
- source_word: Ἀμβακοὺμ
  choice: Habacuque
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome do profeta em português.
- source_word: λέγων
  choice: (incorporado nos dois-pontos)
  rationale: O particípio introduz o discurso direto. Em português atual, os dois-pontos evitam a construção mais pesada “gritou, dizendo”, sem perda de sentido.
- source_word: Δανιὴλ Δανιήλ
  choice: Daniel, Daniel
  rationale: Mantém a repetição do vocativo, que comunica urgência e chamado direto.
- source_word: 'Β [texto truncado; continuação teodociônica: λαβὲ τὸ ἄριστον ὃ ἀπέστειλέ σοι ὁ θεός]'
  choice: receba a refeição que Deus enviou para você
  rationale: A linha grega fornecida termina de modo truncado depois do vocativo. A tradução incorpora a continuação conhecida da forma de Teodocião, entendendo ἄριστον como refeição e vertendo λαβέ de maneira idiomática como “receba”.
theological_decisions:
- issue: Tratamento do texto-fonte truncado
  choice: Apresentar a continuação narrativa conhecida, na qual Habacuque anuncia a refeição enviada por Deus, e registrar a lacuna em nota.
  alternative: 'Traduzir apenas a parte visível: “E Habacuque gritou: ‘Daniel, Daniel…’”'
  rationale: A linha fornecida está incompleta e termina com uma letra isolada, mas a identificação do fluxo textual como a forma completa de Teodocião permite recuperar a continuação do versículo. A nota torna explícita a incerteza documental, em vez de ocultá-la.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fala direta é introduzida por dois-pontos, solução natural em português. “Receba” evita a possível rigidez de “tome”, enquanto “para você” comunica com clareza o destinatário do envio.
