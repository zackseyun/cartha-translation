base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/024.yaml
  text: And the king said to Daniel[a], “You cannot say that this is not a living god; and bow down to him.”
translation:
  language: pt
  text: 'E o rei disse a Daniel: “Você não pode dizer que este não é um deus vivo; e curve-se diante dele[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “adore-o”. O verbo grego pode se referir a curvar-se em sinal de reverência ou a adorar, especialmente quando o gesto é dirigido a uma divindade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δύνασαι εἰπεῖν
  choice: Você não pode dizer
  rationale: Reproduz de modo direto a negação de δύναμαι com o infinitivo, preservando o desafio do rei sem definir se ele fala de incapacidade, proibição ou impossibilidade retórica.
- source_word: οὐκ ἔστιν οὗτος θεὸς ζῶν
  choice: este não é um deus vivo
  rationale: Mantém a formulação natural e a perspectiva do rei, que chama Bel de divindade; o artigo indefinido e as minúsculas evitam confundir a expressão com o título bíblico aplicado ao Deus de Israel.
- source_word: προσκύνησον αὐτῷ
  choice: curve-se diante dele
  rationale: Preserva o sentido concreto de prostração ou reverência de προσκυνέω sem eliminar sua possível força religiosa no contexto.
- source_word: βασιλεὺς
  choice: o rei
  rationale: Representa naturalmente o substantivo grego articulado e identifica o personagem já conhecido no relato.
- source_word: τῷ Δανιήλ
  choice: a Daniel
  rationale: Traduz o dativo como objeto indireto e conserva a forma tradicional portuguesa do nome.
theological_decisions:
- issue: Se θεὸς ζῶν deve ser apresentado como título do Deus verdadeiro
  choice: um deus vivo
  alternative: o Deus vivo
  rationale: O rei pagão se refere a Bel. A forma escolhida preserva a perspectiva do personagem e a ironia narrativa, sem transformar sua afirmação numa confissão sobre o Deus de Israel.
- issue: Se προσκύνησον deve receber tradução explicitamente religiosa
  choice: curve-se diante dele
  alternative: adore-o
  rationale: O verbo pode indicar tanto o gesto de prostrar-se em homenagem quanto adoração, sobretudo diante de uma divindade. O texto principal conserva essa amplitude, e a nota registra a alternativa contextual.
- issue: Relação expressa por καὶ antes do imperativo
  choice: e curve-se
  alternative: por isso, curve-se
  rationale: A conjunção simples coordena as falas sem explicitar uma relação causal que o grego não formula.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém de propósito a coordenação simples do grego e evita linguagem confessional para a alegação do rei acerca de Bel.
