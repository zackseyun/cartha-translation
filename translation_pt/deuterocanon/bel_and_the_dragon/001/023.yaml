  text: And there was a great dragon[a], and the Babylonians worshiped it.
translation:
  language: pt
  text: Havia um grande dragão, e os babilônios o adoravam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o veneravam” ou “o reverenciavam”; o verbo grego pode indicar reverência religiosa, provavelmente adoração cultual neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: δράκων
  choice: dragão
  rationale: É o equivalente direto e tradicional do grego δράκων neste relato; pode designar uma grande serpente, mas “dragão” preserva o título e a apresentação narrativa da criatura.
- source_word: μέγας
  choice: grande
  rationale: Traduz naturalmente μέγας e mantém aberta a ideia de grandeza, inclusive de tamanho, sem restringi-la a uma descrição puramente física.
- source_word: ἐσέβοντο
  choice: adoravam
  rationale: Neste contexto cultual, o verbo indica reverência religiosa dirigida à criatura; “adoravam” comunica essa força com clareza em português.
- source_word: οἱ Βαβυλώνιοι
  choice: os babilônios
  rationale: Designação étnica direta e natural em português para os habitantes ou o povo da Babilônia.
theological_decisions:
- issue: Natureza da relação dos babilônios com o dragão
  choice: O verbo é traduzido como adoração religiosa explícita.
  alternative: Os babilônios o veneravam ou reverenciavam.
  rationale: O contexto apresenta o dragão como objeto de devoção cultual. “Adoravam” expressa esse sentido provável sem acrescentar ao texto uma explicação teológica.
translation_notes:
  register: Português moderno, digno e direto, com ampla legibilidade brasileira. A ordem foi naturalizada em “Havia...”, e o pronome “o” retoma claramente “dragão”.
