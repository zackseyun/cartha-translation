  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/026.yaml
  text: But you[a], O king, give me authority, and I will kill the dragon without sword or staff. And the king said, “I give it to you.”
translation:
  language: pt
  text: 'Mas tu, ó rei, concede-me autoridade, e eu matarei o dragão sem espada nem bastão.[a] E o rei disse: “Eu te dou isso.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem espada nem vara” ou “sem espada nem cajado”; ῥάβδος pode designar vara, bastão ou cajado.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “Eu te dou”, referindo-se à autoridade que Daniel pediu.
    reason: elliptical_reference
lexical_decisions:
- source_word: σὺ δέ
  choice: Mas tu
  rationale: δέ marca transição ou contraste, e o pronome explícito σὺ dá ênfase ao interlocutor. “Mas tu” preserva ambos sem ampliar o texto.
- source_word: βασιλεῦ
  choice: ó rei
  rationale: Mantém o vocativo explícito em linguagem portuguesa digna e corrente, sem introduzir o tratamento cortesão interpretativo “Vossa Majestade”.
- source_word: δός μοι ἐξουσίαν
  choice: concede-me autoridade
  rationale: ἐξουσία designa aqui autoridade ou autorização delegada pelo rei. “Concede-me autoridade” expressa naturalmente esse sentido oficial.
- source_word: ἀποκτενῶ
  choice: eu matarei
  rationale: O futuro de ἀποκτείνω afirma de modo direto que Daniel matará a criatura; “matarei” é claro e atual.
- source_word: τὸν δράκοντα
  choice: o dragão
  rationale: “Dragão” é a correspondência usual de δράκων e se ajusta à criatura venerada no relato; “serpente” reduziria a força do termo.
- source_word: ἄνευ μαχαίρας καὶ ῥάβδου
  choice: sem espada nem bastão
  rationale: A construção exclui os dois instrumentos. “Nem” é a coordenação idiomática em português depois de “sem”; “bastão” conserva o possível uso de ῥάβδος como instrumento de golpe, enquanto a nota registra sua amplitude lexical.
- source_word: Δίδωμί σοι
  choice: Eu te concedo isso
  rationale: A resposta retoma elipticamente a autoridade solicitada. “Isso” explicita apenas o referente exigido pela fluência portuguesa, e “concedo” comunica a autorização régia sem sugerir capacidade inerente.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas de segunda pessoa coerentes (“tu”, “te”) e sintaxe natural. A formulação preserva a ênfase do pronome grego e esclarece apenas na nota a elipse da resposta régia.
