base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/007.yaml
  text: Does he drink every day? And Daniel said[a], laughing, “Do not be deceived, O king; for this one is clay inside and bronze outside, and never—”
translation:
  language: pt
  text: 'Ele bebe todos os dias? E Daniel, rindo, disse: “Não se deixe enganar, ó rei, pois este é de barro por dentro e de bronze por fora, e não—”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho grego fornecido para este versículo termina depois de “e não—” (καὶ οὐ); por isso, a frase está incompleta no excerto-fonte usado aqui.
    reason: textual_variant
lexical_decisions:
- source_word: πίνει καθʼ ἑκάστην ἡμέραν
  choice: Ele bebe todos os dias?
  rationale: A pergunta é expressa em português corrente; a locução distributiva significa “todos os dias”.
- source_word: γελάσας
  choice: rindo
  rationale: O particípio aoristo indica a ação ou maneira concomitante à fala de Daniel; “rindo” é natural e mais preciso que “sorrindo”.
- source_word: Μὴ πλανῶ
  choice: Não se deixe enganar
  rationale: Embora a forma grega seja difícil isoladamente, o contexto favorece uma advertência para que o rei não seja enganado pelo ídolo.
- source_word: βασιλεῦ
  choice: ó rei
  rationale: Preserva o vocativo solene sem soar excessivamente arcaico.
- source_word: οὗτος
  choice: este
  rationale: Mantém o demonstrativo sem acrescentar “deus” ou “ídolo”, termos não expressos neste ponto do grego.
- source_word: ἔσωθέν ἐστι πηλός
  choice: é de barro por dentro
  rationale: Comunica naturalmente a composição interna do objeto; “barro” é claro e idiomático em português.
- source_word: ἔξωθεν δὲ χαλκός
  choice: e de bronze por fora
  rationale: Preserva o contraste interior/exterior; χαλκός, neste contexto, é adequadamente vertido por “bronze”.
- source_word: καὶ οὐ
  choice: e não—
  rationale: Traduz somente as palavras preservadas e usa o travessão para assinalar que a frase ficou incompleta.
theological_decisions:
- issue: Final fragmentário do versículo no testemunho grego fornecido
  choice: Traduzir apenas o texto preservado e marcar a interrupção
  alternative: Completar a frase com base em outras edições ou no contexto
  rationale: O excerto termina em καὶ οὐ. Completar a oração importaria palavras não presentes na evidência-fonte fornecida; o travessão conserva com transparência a lacuna.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem “Daniel, rindo, disse” evita rigidez, preserva a nuance participial e mantém claro que Daniel é quem ri. O marcador [a] foi posto após a fala interrompida, exatamente no ponto explicado pela nota.
