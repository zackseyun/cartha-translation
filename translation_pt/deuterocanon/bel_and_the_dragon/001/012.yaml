base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/012.yaml
  text: And seal it with your ring. Then[a], when you come in the morning, if you do not find everything eaten by Bel, we will die—or else Daniel, who is lying against us.
translation:
  language: pt
  text: E sela com o teu anel. Depois, quando vieres pela manhã, se não encontrares tudo devorado por Bel, morreremos nós — ou Daniel, que mente contra nós.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que nos acusa falsamente”. A expressão grega pode indicar uma mentira dirigida contra alguém, inclusive uma acusação falsa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σφράγισον τῷ δακτυλίῳ σου
  choice: sele a porta com o seu anel
  rationale: O imperativo pede que se aplique um selo por meio do anel real; o objeto 'a porta' é recuperado do contexto imediato para produzir português natural, sem mudar a ação descrita.
- source_word: ἐλθὼν πρωὶ
  choice: Quando vier pela manhã
  rationale: O particípio aoristo com πρωί tem valor temporal e se dirige ao rei; esta formulação é clara e corrente.
- source_word: πάντα βεβρωμένα
  choice: tudo comido
  rationale: O particípio perfeito passivo indica que tudo terá sido consumido; 'tudo comido' mantém de modo direto o estado resultante.
- source_word: ὑπὸ τοῦ Βήλ
  choice: por Bel
  rationale: Mantém o nome próprio sem acrescentar uma identificação ausente nesta oração.
- source_word: ἀποθανούμεθα
  choice: nós morreremos
  rationale: Traduz diretamente o futuro, explicitando o sujeito enfático em contraste com Daniel.
- source_word: ἢ Δανιὴλ
  choice: caso contrário, morrerá Daniel
  rationale: A conjunção ἤ apresenta a consequência alternativa; o verbo 'morrerá' é elíptico no grego e foi repetido em português para clareza.
- source_word: ὁ ψευδόμενος καθʼ ἡμῶν
  choice: que está mentindo contra nós
  rationale: Preserva a construção adversativa do grego e sua possível nuance acusatória, sem transformá-la obrigatoriamente em acusação judicial formal.
theological_decisions:
- issue: Sentido da acusação dirigida a Daniel
  choice: que está mentindo contra nós
  alternative: que nos acusa falsamente
  rationale: A construção ψεύδομαι κατά pode expressar tanto mentir contra alguém quanto fazer uma acusação falsa. O texto principal conserva a formulação mais ampla, e a nota registra a nuance acusatória.
- issue: Sujeito da morte na segunda alternativa
  choice: morrerá Daniel
  alternative: ou Daniel [morrerá]
  rationale: O grego deixa o verbo elíptico depois de ἤ, mas o contraste exige que Daniel seja quem morrerá caso Bel tenha comido tudo. A repetição verbal torna a alternativa inequívoca em português sem acrescentar conteúdo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega 'sele' para a ação concreta de autenticar e fechar com o anel; conserva 'Bel' sem explicação adicional. A expansão contextual 'a porta' evita uma construção transitiva truncada em português.
