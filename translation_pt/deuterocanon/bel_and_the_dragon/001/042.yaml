  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/042.yaml
  text: Daniel[a], and there is no other besides you. And he pulled him up. But he threw those responsible for his destruction into the pit[b], and they were devoured at once before him.
translation:
  language: pt
  text: Daniel[a], e não há outro além de você. E ele o puxou para cima. Mas lançou na cova[b] os responsáveis por sua destruição, e eles foram devorados imediatamente diante dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego começa abruptamente com “Daniel, e não há outro além de você”, provavelmente dando continuidade à fala do versículo anterior. Algumas traduções tornam a frase mais fluida acrescentando palavras como “o rei disse”.
    reason: textual_variant
  - marker: b
    text: Ou “no poço”. A palavra grega significa literalmente “cova” ou “poço”; neste contexto, trata-se da cova dos leões.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν πλὴν σοῦ ἄλλος
  choice: não há outro além de você
  rationale: Preserva a exclusividade enfática da expressão grega e mantém Daniel como destinatário, sem acrescentar conteúdo.
- source_word: ἀνέσπασεν
  choice: puxou ... para cima
  rationale: Mantém o sentido vertical de retirar alguém de um lugar abaixo, de forma clara no contexto da cova.
- source_word: τοὺς ... αἰτίους
  choice: os responsáveis por
  rationale: Expressa tanto a agência quanto a culpabilidade, sem recorrer a formulação jurídica ou excessivamente técnica.
- source_word: τῆς ἀπωλείας αὐτοῦ
  choice: pela destruição dele
  rationale: ἀπώλεια designa destruição ou ruína; a escolha evita restringir o sentido a 'morte', embora esta fosse a intenção dos responsáveis.
- source_word: ἐνέβαλεν εἰς τὸν λάκκον
  choice: lançou na cova
  rationale: λάκκος significa literalmente cova ou poço; 'cova' é natural em português e não substitui o termo pela identificação contextual 'cova dos leões'.
- source_word: κατεβρώθησαν
  choice: foram devorados
  rationale: Reproduz com clareza a voz passiva e a ação dos leões implícita no contexto.
- source_word: παραχρῆμα
  choice: imediatamente
  rationale: Comunica de modo direto a ação instantânea indicada pelo advérbio grego.
- source_word: ἐνώπιον αὐτοῦ
  choice: diante dos seus olhos
  rationale: Torna idiomática a ideia de que o fato ocorreu na presença dele; o referente contextual é o rei.
theological_decisions:
- issue: Sintaxe abrupta no início do testemunho grego
  choice: Manter a fala dirigida a Daniel sem acrescentar no texto principal uma fórmula introdutória ou identificar explicitamente o falante.
  alternative: Suprir algo como “o rei disse” antes de “Daniel”.
  rationale: O grego começa abruptamente com “Daniel, e não há outro além de você”, provavelmente continuando a fala do versículo anterior. Acrescentar um sujeito e um verbo resolveria uma lacuna que o testemunho fornecido deixa aberta.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A abrupta abertura do grego foi preservada e explicada em nota. O fechamento de aspas após a primeira oração sinaliza a fala continuada do contexto anterior sem introduzir palavras ausentes do texto-fonte.
