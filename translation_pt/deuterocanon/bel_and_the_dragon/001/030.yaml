  text: And the king saw that they were pressing him very hard, and being compelled, he handed Daniel over to them.
translation:
  language: pt
  text: E o rei viu que o pressionavam fortemente e, forçado, entregou Daniel a eles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείγουσιν
  choice: o pressionavam
  rationale: O verbo expressa pressão insistente e intensa, não um simples pedido; o imperfeito em português comunica adequadamente a ação em curso percebida pelo rei.
- source_word: σφόδρα
  choice: muito
  rationale: O advérbio intensifica a pressão exercida sobre o rei. “Pressionavam muito” é claro e natural em português contemporâneo.
- source_word: ἀναγκασθείς
  choice: constrangido
  rationale: O particípio passivo indica que o rei agiu sob compulsão externa. “Constrangido” preserva essa nuance sem afirmar especificamente coação física.
- source_word: παρέδωκεν
  choice: entregou ... a eles
  rationale: O verbo denota entregar alguém ao poder ou à custódia de outros; esta formulação é natural e mantém o sentido de transferência de controle.
- source_word: Δανιήλ
  choice: Daniel
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Grau de coação exercida sobre o rei
  choice: O rei age sob forte pressão social ou política, e não por iniciativa voluntária.
  alternative: O rei foi apenas persuadido, ou foi fisicamente forçado.
  rationale: A combinação de ἐπείγουσιν, σφόδρα e ἀναγκασθείς apresenta pressão intensa que resulta numa ação constrangida, sem definir a coação como meramente persuasiva nem como força física.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A ordem narrativa do grego foi preservada sem rigidez, e não foram necessárias notas de rodapé.
