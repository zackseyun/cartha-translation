  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/003.yaml
  text: And there was an idol among the Babylonians whose name was Bel, and for it twelve artabas of fine flour were spent each day.
translation:
  language: pt
  text: Havia entre os babilônios um ídolo chamado Bel, e todos os dias eram gastas para ele doze artabas[a] de farinha fina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A artaba era uma antiga medida de capacidade, cujo volume exato variava conforme a época e a região.
    reason: A unidade antiga é desconhecida para muitos leitores e não admite conversão moderna única e segura.
lexical_decisions:
- source_word: εἴδωλον
  choice: ídolo
  rationale: Equivalente direto e natural, preservando a avaliação religiosa explícita do termo grego.
- source_word: ᾧ ὄνομα Βὴλ
  choice: chamado Bel
  rationale: Expressa em português corrente a construção grega literalmente equivalente a “cujo nome era Bel”, sem perda de conteúdo.
- source_word: ἐδαπανῶντο εἰς αὐτόν
  choice: eram gastas com ele
  rationale: Mantém a voz passiva e a referência ao ídolo, sem especificar quem realizava o gasto, algo que o grego também não informa.
- source_word: σεμιδάλεως
  choice: farinha fina
  rationale: Designa farinha de boa qualidade e moagem fina; a formulação é clara e corrente em português moderno.
- source_word: ἀρτάβαι δώδεκα
  choice: doze artabas
  rationale: Preserva a unidade antiga em vez de impor uma conversão moderna incerta; a nota explica seu caráter aproximado.
