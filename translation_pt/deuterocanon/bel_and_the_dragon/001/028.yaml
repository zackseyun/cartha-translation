base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/028.yaml
  text: And it happened that when the Babylonians heard[a], they became indignant and gathered together against the king and said, “The king has become a Jew; he has torn down Bel and killed the dragon and slaughtered the priests.”
translation:
  language: pt
  text: 'E aconteceu que, quando os babilônios ouviram isso, ficaram indignados, reuniram-se contra o rei e disseram: “O rei se tornou judeu[a]! Derrubou Bel, matou o dragão e massacrou os sacerdotes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “judeano”. A palavra grega pode indicar tanto uma identidade étnica e religiosa (“judeu”) como uma identidade geográfica e política ligada à Judeia (“judeano”).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς ἤκουσαν
  choice: E aconteceu que, quando ... ouviram isso
  rationale: Preserva a fórmula narrativa de transição e seu sabor semítico sem sugerir uma imediatidade maior do que o grego expressa. O objeto implícito de ἤκουσαν é retomado naturalmente em português por “isso”.
- source_word: οἱ Βαβυλώνιοι
  choice: os babilônios
  rationale: Equivalente natural para a designação étnica e cívica.
- source_word: ἠγανάκτησαν
  choice: ficaram indignados
  rationale: Comunica forte desagrado e indignação, mantendo a intensificação da hostilidade para a ação seguinte.
- source_word: συνεστράφησαν ἐπὶ τὸν βασιλέα
  choice: reuniram-se contra o rei
  rationale: Expressa o movimento e alinhamento coletivo contra o rei sem importar a noção mais específica de uma conspiração secreta.
- source_word: Ἰουδαῖος γέγονεν ὁ βασιλεύς
  choice: O rei se tornou judeu
  rationale: No contexto, a acusação aponta sobretudo para a identificação do rei com o povo e a religião de Daniel. A possível leitura geopolítica “judeu no sentido de natural da Judeia” é registrada em nota.
- source_word: τὸν Βὴλ κατέσπασεν
  choice: Derrubou Bel
  rationale: κατασπάω indica puxar para baixo ou demolir. “Derrubou” mantém Bel como objeto direto e comunica de modo natural a destruição de sua representação cultual.
- source_word: τὸν δράκοντα ἀπέκτεινεν
  choice: matou o dragão
  rationale: Tradução direta, clara e atual da acusação.
- source_word: τοὺς ἱερεῖς κατέσφαξεν
  choice: massacrou os sacerdotes
  rationale: Preserva a força de κατασφάζω, mais intenso que o verbo comum para matar, sem recorrer a linguagem coloquial.
theological_decisions:
- issue: Sentido de Ἰουδαῖος
  choice: judeu
  alternative: judeano, isto é, alguém ligado geográfica ou politicamente à Judeia
  rationale: A palavra grega comporta identidade étnico-religiosa e identidade geográfico-política. A acusação contextual favorece “judeu”, pois o rei teria se alinhado ao povo e à religião de Daniel, mas a ambiguidade lexical genuína é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fórmula inicial mantém o ritmo narrativo bíblico; as acusações usam verbos fortes e concisos em correspondência com o grego.
