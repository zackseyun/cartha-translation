  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/022.yaml
  text: And the king killed them[a], and he gave Bel over to Daniel[b], and he destroyed him and his temple.
translation:
  language: pt
  text: E o rei os matou, entregou Bel a Daniel[a] e o destruiu[b], bem como o seu templo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “deu Bel como entregue”; a expressão significa entregá-lo ao poder de Daniel.
    reason: lexical_alternative
  - marker: b
    text: O grego usa um pronome masculino que retoma Bel. O rei é o sujeito expresso da sequência de verbos.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέκτεινεν
  choice: matou
  rationale: O aoristo de ἀποκτείνω indica causar a morte. “Matou” é direto, atual e corresponde ao grego sem acrescentar uma nuance judicial.
- source_word: ἔδωκεν ... ἔκδοτον
  choice: entregou
  rationale: A construção significa pôr alguém ou algo sob o poder de outra pessoa, isto é, entregá-lo. “Entregou” exprime naturalmente o sentido em português.
- source_word: τὸν Βὴλ
  choice: Bel
  rationale: Mantém-se a transliteração tradicional do nome da divindade.
- source_word: κατέστρεψεν
  choice: destruiu
  rationale: O verbo abrange arruinar ou destruir e aplica-se de modo conciso tanto a Bel quanto ao templo.
- source_word: τὸ ἱερὸν
  choice: templo
  rationale: Neste contexto cultual, “templo” é a forma mais clara e natural de verter ἱερόν.
- source_word: αὐτὸν
  choice: -o
  rationale: O pronome grego é masculino e retoma Bel. O pronome oblíquo português preserva essa concordância sem explicitar se Bel é concebido como divindade ou como ídolo.
theological_decisions:
- issue: Como representar o pronome masculino que retoma Bel
  choice: Usar “destruiu-o” e “o seu templo”
  alternative: Reformular de modo impessoal como “destruiu a estátua e o templo dela”
  rationale: O grego emprega pronome masculino e não identifica explicitamente Bel como mera estátua nesta frase. A tradução preserva a forma pessoal do texto sem afirmar a realidade ontológica da divindade.
- issue: Quem destruiu Bel e o templo
  choice: 'Manter o sujeito não repetido: “e destruiu-o”'
  alternative: Explicitar “Daniel o destruiu” ou “o rei o destruiu”
  rationale: O grego não expressa um novo sujeito. Embora a continuidade sintática possa apontar para o rei e o contexto possa levar o leitor a entender Daniel, explicitar um deles eliminaria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com coordenação próxima da estrutura grega. O ponto e vírgula ajuda a conservar a sequência narrativa sem resolver a identidade do sujeito do último verbo.
