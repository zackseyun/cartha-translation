lexical_decisions:
- source_word: ἐπελάβετο
  choice: agarrou
  rationale: Expressa a ação súbita e firme de tomar alguém, sem enfraquecer a força do verbo grego.
- source_word: ἄγγελος Κυρίου
  choice: anjo do Senhor
  rationale: O contexto apresenta um ser sobrenatural; “Senhor” traduz Κυρίου sem importar para o grego uma forma específica do nome divino.
- source_word: τῆς κορυφῆς αὐτοῦ
  choice: pelo alto da cabeça
  rationale: κορυφή designa o topo ou ponto mais alto; esta formulação é clara e corporalmente específica em português.
- source_word: βαστάσας τῆς κόμης τῆς κεφαλῆς αὐτοῦ
  choice: carregando-o pelos cabelos
  rationale: Preserva tanto a ideia de transporte expressa pelo particípio quanto o meio indicado, os cabelos da cabeça, sem a redundância pouco natural de “cabelos da cabeça”.
- source_word: ἔθηκεν
  choice: colocou-o
  rationale: Indica de modo natural que o anjo o pôs em determinado lugar.
- source_word: ἐπάνω τοῦ λάκκου
  choice: acima da cova
  rationale: Mantém a relação espacial básica de ἐπάνω sem definir com precisão indevida se ele ficou na borda ou suspenso sobre ela.
- source_word: ἐν τῷ ῥοίζῳ τοῦ
  choice: ao som impetuoso do
  rationale: ῥοῖζος denota ruído veloz, sibilante ou impetuoso. A tradução conserva a construção incompleta do extrato grego, que termina no artigo τοῦ.
theological_decisions:
- issue: Tradução de κύριος em ἄγγελος Κυρίου
  choice: Senhor
  alternative: SENHOR
  rationale: O testemunho grego traz Κυρίου e não explicita aqui o nome divino hebraico; “Senhor” evita introduzir uma distinção tipográfica ausente da fonte.
- issue: Final incompleto do versículo no texto-fonte fornecido
  choice: Traduzir somente as palavras preservadas e assinalar a interrupção
  alternative: Completar a frase com base em outras edições ou no contexto
  rationale: A primazia da fonte e a transparência textual exigem não inserir no texto principal palavras ausentes do extrato grego fornecido.
