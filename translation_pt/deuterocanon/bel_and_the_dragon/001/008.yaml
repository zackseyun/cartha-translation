lexical_decisions:
- source_word: βέβρωκεν οὐδέποτε
  choice: nunca comeu
  rationale: O perfeito βέβρωκεν com οὐδέποτε nega que Bel alguma vez tenha comido; em português, “nunca comeu” é natural e preserva o valor resultante no contexto.
- source_word: θυμωθεὶς ὁ βασιλεὺς
  choice: Então o rei ficou irado
  rationale: O particípio aoristo indica a ira que antecede e motiva a ação seguinte. “Ficou irado” conserva o sentido ingressivo e o registro digno.
- source_word: ἐκάλεσεν τοὺς ἱερεῖς αὐτοῦ
  choice: chamou os sacerdotes de Bel
  rationale: O pronome αὐτοῦ pode referir-se ao antecedente cultual, Bel; explicitar “de Bel” evita a leitura enganosa de sacerdotes pessoais do rei e permanece fiel ao referente contextual.
- source_word: εἶπεν αὐτοῖς
  choice: lhes disse
  rationale: Forma portuguesa corrente e concisa para a fórmula grega de fala.
- source_word: Ἐὰν μὴ εἴπητέ μοι
  choice: Se vocês não me disserem
  rationale: Preserva de modo transparente a construção condicional com ἐὰν μή e subjuntivo, em linguagem moderna amplamente compreensível.
- source_word: τίς ὁ κατεσθίων
  choice: quem está comendo
  rationale: O particípio presente substantivado expressa ação em curso; “está comendo” é natural e deixa em aberto o objeto interrompido.
- source_word: τὴν
  choice: a
  rationale: O artigo acusativo feminino está sem seu substantivo no trecho fornecido. A tradução mantém deliberadamente o artigo e a frase incompleta, em vez de suprir o objeto a partir do versículo seguinte.
