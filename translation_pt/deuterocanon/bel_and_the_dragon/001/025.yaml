  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/025.yaml
  text: And Daniel said[a], “I will bow down to the Lord my God, because he is the living God.”
translation:
  language: pt
  text: 'E Daniel disse: “Eu me prostrarei diante do Senhor, meu Deus, porque ele é o Deus vivo.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eu adorarei o Senhor, meu Deus.” O verbo grego pode indicar tanto prostrar-se em reverência quanto adorar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνήσω
  choice: eu me prostrarei diante de
  rationale: O verbo expressa reverência mediante prostração e, neste contexto, implica adoração. A formulação preserva tanto o gesto concreto quanto seu sentido devocional, sem reduzi-lo a uma noção apenas abstrata.
- source_word: Κυρίῳ
  choice: o Senhor
  rationale: Traduz κύριος pela forma bíblica corrente “Senhor”; a construção com τῷ θεῷ μου resulta naturalmente em “o Senhor, meu Deus”.
- source_word: τῷ θεῷ μου
  choice: meu Deus
  rationale: O dativo identifica aquele diante de quem Daniel se prostrará. Em português, a regência é expressa por “diante de”, e o aposto “meu Deus” conserva a relação entre os títulos.
- source_word: θεὸς ζῶν
  choice: o Deus vivo
  rationale: A expressão predicativa anartrosa é vertida pela formulação bíblica idiomática “o Deus vivo”, que contrasta o Deus realmente vivente com o ídolo.
- source_word: ὅτι
  choice: porque
  rationale: A conjunção introduz a razão da declaração de Daniel; “porque” expressa de modo claro seu valor causal.
theological_decisions:
- issue: Tradução de κύριος na confissão dirigida ao Deus de Daniel
  choice: o Senhor
  alternative: Senhor
  rationale: “O Senhor” é fiel ao grego e forma, com “meu Deus”, uma confissão natural em português, sem acrescentar identificação denominacional.
- issue: Se προσκυνέω deve ser traduzido por linguagem explicitamente cultual
  choice: eu me prostrarei diante de
  alternative: eu adorarei
  rationale: A escolha mantém o gesto concreto expresso pelo verbo grego e deixa visível sua força cultual no contexto; a nota registra a tradução igualmente legítima “adorarei”.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem da frase segue de perto o grego, enquanto “prostrar-se diante de” oferece regência natural em português. O marcador da nota foi colocado ao fim da declaração a que se aplica.
