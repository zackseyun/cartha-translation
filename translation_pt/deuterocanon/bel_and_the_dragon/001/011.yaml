  terminology: «Casa de Bel» preserva adequadamente οἶκος τοῦ Βήλ, com nota explicativa para o sentido de templo/santuário. «Feche a porta» não acrescenta a ideia de trancar. Daniel e Bel são formas adequadas em português.
