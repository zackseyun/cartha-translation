base_translation:
  language: en
  yaml_path: translation/deuterocanon/bel_and_the_dragon/001/011.yaml
  text: The king went with Daniēl into the house of Bel. And the priests of Bel said, “Look, we are going outside. But you, O king, set out the food, and after mixing the wine, set it out, and shut the door.”
translation:
  language: pt
  text: 'O rei foi com Daniel à casa de Bel.[a] Então os sacerdotes de Bel disseram: “Veja, nós vamos sair. Mas tu, ó rei, ponha a comida e, depois de misturar o vinho, coloque-o e feche a porta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao templo de Bel”. O grego diz literalmente “à casa de Bel”, expressão usada aqui para o santuário ou templo dessa divindade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς μετὰ Δανιὴλ
  choice: O rei foi com Daniel
  rationale: O grego apresenta o rei acompanhado por Daniel. Em português, usa-se a forma tradicional e amplamente reconhecida do nome, Daniel.
- source_word: εἰς τὸν οἶκον τοῦ Βήλ
  choice: à casa de Bel
  rationale: Preserva o sentido literal de οἶκος, embora no contexto se trate do santuário ou templo de Bel.
- source_word: Ἰδοὺ
  choice: Veja
  rationale: Interjeição atual e natural que conserva a função de chamar a atenção.
- source_word: ἡμεῖς ἀποτρέχομεν ἔξω
  choice: nós vamos sair
  rationale: Expressa naturalmente a saída anunciada pelos sacerdotes, sem enfatizar indevidamente a ideia possível de correr.
- source_word: σύ δέ, βασιλεῦ
  choice: Mas o senhor, ó rei
  rationale: Mantém o contraste marcado por δέ, explicita o pronome enfático σύ e conserva o vocativo solene.
- source_word: παράθες τὰ βρώματα
  choice: ponha a comida diante de Bel
  rationale: παρατίθημι indica pôr diante de alguém. O complemento 'de Bel' fica implícito no contexto grego e é explicitado em português para tornar natural e claro o destino da oferenda.
- source_word: τὸν οἶνον κεράσας θές
  choice: misture o vinho e coloque-o ali
  rationale: 'Conserva a sequência prática do particípio aoristo seguido do imperativo: misturar o vinho e então colocá-lo no local preparado.'
- source_word: ἀπόκλεισον τὴν θύραν
  choice: feche a porta
  rationale: Traduz o ato de fechar sem acrescentar a noção não explícita de trancar.
theological_decisions:
- issue: Natureza cultual de οἶκος τοῦ Βήλ
  choice: casa de Bel
  alternative: templo de Bel
  rationale: O contexto indica um templo ou santuário, mas o texto grego diz literalmente 'casa'. A tradução principal preserva essa imagem e a nota esclarece seu sentido cultual.
- issue: Destinatário da comida
  choice: diante de Bel
  alternative: simplesmente 'ponha a comida'
  rationale: O grego não repete o nome de Bel nessa oração, mas o cenário e o uso de παράθες indicam que a comida é posta diante dele. A explicitação evita uma construção truncada em português sem introduzir uma distinção doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A forma de tratamento 'o senhor' torna natural o pronome enfático dirigido ao rei, enquanto 'ó rei' preserva o vocativo formal. A pontuação evita iniciar uma nova frase com uma conjunção desnecessária.
