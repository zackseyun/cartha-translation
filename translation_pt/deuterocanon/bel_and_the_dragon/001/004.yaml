  text: and forty sheep and six measures of wine. And the king revered him and went every day to bow down to him[a], but Daniel bowed down to his God. And the king said to him,
translation:
  language: pt
  text: 'e quarenta ovelhas e seis medidas de vinho. O rei o reverenciava e ia todos os dias prostrar-se diante dele[a], mas Daniel se prostrava diante do seu Deus. E o rei lhe disse:'
