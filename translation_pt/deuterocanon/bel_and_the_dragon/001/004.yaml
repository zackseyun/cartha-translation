    reason: lexical_alternative
lexical_decisions:
- source_word: πρόβατα τεσσεράκοντα
  choice: quarenta ovelhas
  rationale: πρόβατα designa comumente ovelhas ou gado miúdo; «ovelhas» é amplo, natural e não restringe indevidamente a idade dos animais.
- source_word: οἴνου μετρηταὶ ἕξ
  choice: seis medidas de vinho
  rationale: μετρητής é uma medida de líquidos. «Medidas» conserva a quantificação sem impor uma equivalência moderna incerta.
- source_word: ἐσέβετο αὐτόν
  choice: o reverenciava
  rationale: σέβομαι pode indicar reverência ou culto. «Reverenciava» mantém a distinção em relação ao verbo προσκυνέω usado logo depois, sem eliminar o caráter devocional do contexto.
- source_word: ἐπορεύετο καθʼ ἑκάστην ἡμέραν
  choice: ia todos os dias
  rationale: O imperfeito expressa uma prática habitual; esta formulação a comunica de modo idiomático em português.
- source_word: προσκυνεῖν αὐτῷ
  choice: prostrar-se diante dele
  rationale: προσκυνέω pode significar prostrar-se ou adorar. A escolha preserva o gesto cultual e permite repetir o mesmo verbo na ação contrastante de Daniel.
- source_word: προσεκύνει τῷ θεῷ αὐτοῦ
  choice: se prostrava diante do seu Deus
  rationale: A repetição de «prostrar-se» mantém o paralelismo lexical do grego entre a ação do rei diante de Bel e a de Daniel diante de seu Deus.
- source_word: ὁ βασιλεὺς
  choice: o rei
  rationale: Equivalente português padrão de βασιλεύς.
- source_word: Δανιήλ
  choice: Daniel
  rationale: Forma tradicional e corrente do nome em português.
- source_word: εἶπεν αὐτῷ ὁ βασιλεὺς
  choice: o rei lhe disse
  rationale: Ordem natural em português que preserva o referente pronominal e a introdução da fala que continua no versículo seguinte.
theological_decisions:
- issue: Se os verbos cultuais devem ser traduzidos explicitamente por «adorar» tanto para Bel quanto para o Deus de Daniel
  choice: Usar «reverenciava» para ἐσέβετο e «prostrar-se» para as duas ocorrências de προσκυνέω
  alternative: Usar «adorava» para a relação do rei com Bel e para a ação de Daniel diante de Deus
  rationale: O grego emprega dois verbos diferentes para a devoção do rei a Bel e repete προσκυνέω no contraste com Daniel. A tradução conserva essa estrutura e a ambiguidade entre gesto de prostração e adoração, sem diminuir o claro contexto cultual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Conservou-se a continuação sintática inicial («e quarenta ovelhas») e a fala inacabada no fim do versículo. O pronome «dele» retoma Bel no contexto imediato.
