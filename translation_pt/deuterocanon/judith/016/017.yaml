base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/017.yaml
  text: Woe to the nations rising up against my people[a]; the Lord Almighty will take vengeance on them in the day of judgment, to put fire and worms in their flesh[b], and they will weep in pain forever.
translation:
  language: pt
  text: Ai das nações que se levantam contra o meu povo[a]! O Senhor Todo-Poderoso se vingará delas no dia do julgamento, para pôr fogo e vermes na carne delas; e elas chorarão em dor[b] para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «contra a minha gente» ou «contra a minha nação». O grego génos refere-se ao grupo de origem ao qual Judite pertence.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «em sensação» ou «em percepção». No contexto de castigo corporal, a expressão pode ser entendida como «em dor».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ ἔθνεσιν
  choice: Ai das nações
  rationale: Preserva a força profética de denúncia e lamento de οὐαί, enquanto ἔθνεσιν designa os povos estrangeiros hostis sem recorrer à terminologia neotestamentária «gentios».
- source_word: ἐπανισταμένοις τῷ γένει μου
  choice: que se levantam contra o meu povo
  rationale: Mantém a imagem verbal da insurreição hostil; «meu povo» comunica naturalmente o grupo étnico de Judite, sem as conotações modernas problemáticas de «raça».
- source_word: Κύριος Παντοκράτωρ
  choice: O Senhor Todo-Poderoso
  rationale: Forma portuguesa consagrada, clara e digna para o título divino, preservando a ideia daquele que detém todo o poder e domínio.
- source_word: ἐκδικήσει αὐτοὺς
  choice: se vingará delas
  rationale: Conserva o tom retributivo do verbo, cujo sentido é executar vingança ou justiça contra os adversários.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: no dia do julgamento
  rationale: Expressão portuguesa idiomática que reproduz naturalmente a referência judicial do grego anartro.
- source_word: δοῦναι πῦρ καὶ σκώληκας εἰς σάρκας αὐτῶν
  choice: pondo fogo e vermes em sua carne
  rationale: O gerúndio exprime naturalmente em português o conteúdo ou resultado da vingança. «Carne» mantém a imagem corporal explícita de σάρκας.
- source_word: καὶ κλαύσονται ἐν αἰσθήσει
  choice: e elas chorarão com plena sensação disso
  rationale: κλαύσονται significa chorar ou lamentar. αἴσθησις denota sensação ou percepção; a formulação preserva essa amplitude lexical em vez de restringi-la silenciosamente a «dor».
- source_word: ἕως αἰῶνος
  choice: para sempre
  rationale: Equivalente português claro e idiomático para a duração continuada expressa pela locução.
theological_decisions:
- issue: Natureza da experiência punitiva expressa por ἐν αἰσθήσει
  choice: com plena sensação disso
  alternative: em meio à dor
  rationale: O contexto corporal permite entender dor, mas o substantivo grego significa mais diretamente sensação ou percepção. O texto principal preserva essa ambiguidade, e a nota apresenta a leitura contextual.
- issue: Duração da punição em ἕως αἰῶνος
  choice: para sempre
  alternative: até a era / por uma era
  rationale: «Para sempre» reproduz de modo natural a força duradoura da expressão neste contexto, sem acrescentar uma formulação doutrinária que ultrapasse o enunciado do verso.
- issue: Imagem de fogo e vermes
  choice: mantida literalmente
  alternative: paráfrase como tormento corporal
  rationale: A imagem severa faz parte do texto e não deve ser suavizada nem sistematizada numa doutrina mais específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantém o tom profético e judicial, a crueza das imagens e a ambiguidade real de αἴσθησις. Os pronomes femininos retomam naturalmente «nações» em português.
