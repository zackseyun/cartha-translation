- source_word: ἔφριξαν
  choice: estremeceram
  rationale: O verbo φρίσσω descreve uma reação física intensa de medo, como estremecer ou arrepiar-se; “estremeceram” conserva essa vivacidade.
- source_word: Πέρσαι
  choice: os persas
  rationale: Plural étnico substantivado, expresso naturalmente em português com artigo definido.
- source_word: τὴν τόλμαν αὐτῆς
  choice: diante da ousadia dela
  rationale: τόλμα pode significar ousadia, coragem ou audácia. “Ousadia” preserva a força do termo sem lhe impor avaliação exclusivamente positiva ou negativa; “diante de” exprime de modo natural a causa da reação.
- source_word: Μῆδοι
  choice: os medos
  rationale: Designação étnica dos medos, vertida segundo o uso histórico corrente em português.
- source_word: τὸ θράσος αὐτῆς
  choice: por sua audácia
  rationale: θράσος designa atrevimento ou arrojo e pode ter matiz de audácia. A escolha diferencia o termo de τόλμα, mantendo a sobreposição semântica e o paralelismo.
- source_word: ἐρράχθησαν
  choice: ficaram abalados
  rationale: O passivo aoristo indica que os medos foram violentamente perturbados ou sacudidos; “ficaram abalados” é claro, forte e natural em português.
