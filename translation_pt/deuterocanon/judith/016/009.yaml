base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/009.yaml
  text: Her sandal captured his eye[a], and her beauty took his soul captive; the sword passed through his neck.
translation:
  language: pt
  text: Sua sandália arrebatou-lhe o olhar, e sua beleza levou cativa a alma dele; o punhal[a] atravessou-lhe o pescoço.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espada curta”; o grego se refere a uma arma curta de tipo oriental, semelhante a um punhal.
    reason: lexical_alternative
lexical_decisions:
- source_word: σανδάλιον
  choice: sandália
  rationale: O termo grego designa especificamente uma sandália; a escolha preserva o detalhe concreto da aparência de Judite.
- source_word: ἥρπασε
  choice: arrebatou
  rationale: O verbo exprime tomar ou apoderar-se com força. “Arrebatou-lhe o olhar” é poético e inteligível, mantendo a imagem de conquista sem reduzi-la a mera atração.
- source_word: ὀφθαλμὸν
  choice: olhar
  rationale: Embora o grego diga literalmente “olho” no singular, em português “olhar” comunica naturalmente a atenção visual pretendida sem perder a imagem.
- source_word: κάλλος
  choice: beleza
  rationale: Equivalente direto e natural para a formosura física de Judite no contexto.
- source_word: ᾐχμαλώτισεν
  choice: levou cativa
  rationale: Preserva a metáfora militar de fazer alguém prisioneiro e mantém o paralelismo poético com o olhar arrebatado.
- source_word: ψυχὴν
  choice: alma
  rationale: Mantém o sentido elevado do ser interior de Holofernes; “coração” introduziria um conceito diferente, e “vida” seria menos adequado neste contexto.
- source_word: ἀκινάκης
  choice: punhal
  rationale: O termo designa uma arma oriental curta, semelhante a um punhal ou espada curta. “Punhal” oferece precisão e leitura imediata; a alternativa é registrada em nota.
- source_word: διῆλθεν
  choice: atravessou
  rationale: Expressa de modo direto o movimento de passar através, sem enfraquecer a violência concreta da imagem.
- source_word: τράχηλον
  choice: pescoço
  rationale: É o equivalente lexical comum e direto do substantivo grego.
theological_decisions:
- issue: Força metafórica das duas imagens de captura no cântico de vitória
  choice: Manter a linguagem de conquista em “arrebatou-lhe o olhar” e “levou cativa a alma dele”
  alternative: Suavizar para expressões como “atraiu seu olhar” e “conquistou seu coração”
  rationale: O texto contrapõe deliberadamente a sedução de Holofernes à sua derrota física. Preservar a linguagem de captura mantém a tensão poética e evita transformar a cena em linguagem meramente romântica.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética apropriada a um cântico de vitória. Os pronomes enclíticos preservam concisão e evitam repetição excessiva. O marcador da nota foi colocado junto de “punhal”, termo ao qual a alternativa lexical realmente se refere.
