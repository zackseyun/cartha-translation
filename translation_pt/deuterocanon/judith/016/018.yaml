base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/018.yaml
  text: And when they came to Jerusalem, they worshiped God; and when the people had been purified, they offered up their burnt offerings and their freewill offerings and their gifts.
translation:
  language: pt
  text: Quando chegaram a Jerusalém, adoraram a Deus; e, quando o povo foi purificado, ofereceram seus holocaustos, suas ofertas voluntárias e suas dádivas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ ἦλθον
  choice: Quando chegaram
  rationale: A construção introduz a etapa seguinte da narrativa. Em português, “Quando chegaram” expressa com naturalidade a relação temporal; a partícula δέ não exige aqui uma conjunção explícita.
- source_word: προσεκύνησαν
  choice: adoraram
  rationale: Com Deus como objeto e em contexto cultual, o verbo indica adoração, sem necessidade de explicitar o gesto físico de curvar-se ou prostrar-se.
- source_word: ἡνίκα
  choice: depois que
  rationale: Embora signifique literalmente “quando”, neste período marca que a purificação precedeu a apresentação das ofertas. “Depois que” torna clara essa sequência sem alterar o sentido.
- source_word: ἐκαθαρίσθη
  choice: foi purificado
  rationale: O passivo descreve a purificação recebida pelo povo; o contexto de culto e sacrifícios aponta para purificação ritual.
- source_word: ὁ λαός
  choice: o povo
  rationale: Equivalente corrente e apropriado para o povo reunido, sem introduzir a ideia moderna de Estado nacional.
- source_word: ἀνήνεγκαν
  choice: ofereceram
  rationale: No contexto sacrificial, ἀναφέρω tem o sentido técnico de apresentar uma oferta. “Ofereceram” é natural em português e evita o pouco idiomático “ofereceram para cima”.
- source_word: ὁλοκαυτώματα
  choice: holocaustos
  rationale: Termo bíblico consagrado em português para sacrifícios inteiramente queimados, adequado ao contexto cultual.
- source_word: ἑκούσια
  choice: ofertas voluntárias
  rationale: Expressa ofertas apresentadas espontaneamente e conserva sua distinção em relação aos holocaustos e às dádivas.
- source_word: δόματα
  choice: dádivas
  rationale: Mantém o sentido amplo de presentes ou dons e evita fundir este terceiro elemento com as “ofertas voluntárias” anteriores.
theological_decisions:
- issue: Natureza da purificação em ἐκαθαρίσθη ὁ λαός
  choice: purificação ritual do povo antes dos sacrifícios
  alternative: purificação moral geral do povo
  rationale: A adoração em Jerusalém e a apresentação imediata de holocaustos, ofertas voluntárias e dádivas favorecem o sentido cultual. A tradução não especifica o rito nem acrescenta uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a sequência narrativa e a terminologia sacrificial, sem tornar a frase excessivamente técnica.
