  text: The sons of maidens pierced them through[a], and wounded them like the children of deserters[b]; they perished before the battle line of my Lord.
translation:
  language: pt
  text: Os filhos de moças os traspassaram e os feriam como se ferem filhos de desertores[a]; eles pereceram diante da linha de batalha do meu Senhor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «como filhos de fugitivos» ou «como filhos de desertores». A expressão grega, que emprega um verbo que pode significar «desertar» ou «passar para o outro lado», é difícil e pode sugerir fuga, fraqueza ou desonra.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «pereceram por causa da linha de batalha do meu Senhor» ou «pereceram saindo da formação de batalha do meu Senhor». A expressão preposicional grega admite mais de uma compreensão.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ κορασίων
  choice: Os filhos de moças
  rationale: Mantém a relação materna e a imagem surpreendente do grego. «Moças» é mais corrente no português moderno do que «donzelas», sem eliminar a ideia de juventude de κοράσιον.
- source_word: κατεκέντησαν
  choice: os traspassaram
  rationale: Expressa a força do verbo composto, que indica perfurar ou atravessar com uma arma.
- source_word: ὡς παῖδας αὐτομολούντων
  choice: como a filhos de desertores
  rationale: Representa παῖδας como «filhos» e entende o particípio genitivo αὐτομολούντων de modo substantivado, «desertores». A construção grega é incomum, por isso a ambiguidade é registrada em nota.
- source_word: ἐτίτρωσκον
  choice: os feriam
  rationale: O imperfeito grego sugere ação continuada ou repetida; o imperfeito português preserva naturalmente esse aspecto.
- source_word: ἀπώλοντο
  choice: eles pereceram
  rationale: Preserva o sentido resultativo sem especificar indevidamente o agente ou a maneira da morte.
- source_word: ἐκ παρατάξεως
  choice: diante da linha de batalha
  rationale: Oferece uma leitura portuguesa natural para a relação com a formação militar, ao mesmo tempo que uma nota conserva as possibilidades mais formais «por causa da» e «a partir da» linha de batalha.
- source_word: κυρίου μου
  choice: do meu Senhor
  rationale: Conserva o possessivo explícito e o peso devocional de κύριος no contexto do hino, sem acrescentar «Deus», ausente desta expressão.
theological_decisions:
- issue: Tradução de κύριος
  choice: meu Senhor
  alternative: meu senhor / meu amo
  rationale: Neste hino, o referente é Deus. «Meu Senhor» mantém o título e o tom devocional, sem ampliar o texto para «Senhor meu Deus».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura brasileira natural. «Filhos de moças» preserva a estranheza deliberada da imagem sem recorrer ao mais arcaico «donzelas». A pontuação mantém as duas ações coordenadas e separa o resultado final.
