base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/003.yaml
  text: Assyria came from the mountains out of the north[a]; he came with myriads of his forces, whose multitude blocked up the wadis[b], and their horses covered the hills.
translation:
  language: pt
  text: A Assíria veio das montanhas do norte; veio com miríades de suas forças, cuja multidão obstruiu os leitos dos riachos sazonais[a], e seus cavalos[b] cobriram as colinas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “torrentes de inverno”, “leitos de torrentes” ou “uádis”; o grego se refere a cursos de água sazonais.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o cavalo deles cobriu as colinas”; o singular grego provavelmente tem sentido coletivo e pode ser entendido como “a cavalaria deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσσούρ
  choice: A Assíria
  rationale: O nome grego designa a Assíria ou o poder assírio, aqui personificado poeticamente. A forma nacional preserva essa imagem e os verbos no singular.
- source_word: ἐξ ὀρέων ἀπὸ βορρᾶ
  choice: das montanhas, do norte
  rationale: 'Mantém o valor de ambas as preposições: procedência das montanhas e direção ou região setentrional, sem fundi-las em uma única expressão.'
- source_word: ἐν μυριάσι δυνάμεων αὐτοῦ
  choice: com miríades de suas forças
  rationale: “Miríades” conserva a grandeza numérica e o tom elevado de μυριάσι; “forças” reproduz o plural amplo de δυνάμεων.
- source_word: ἐνέφραξεν χειμάρρους
  choice: obstruiu os leitos dos riachos sazonais
  rationale: χειμάρρους indica cursos de água temporários ou seus leitos, enquanto ἐνέφραξεν comunica a ideia de bloquear ou obstruir. A formulação evita o regionalismo menos transparente “uádis” no texto principal.
- source_word: ἡ ἵππος αὐτῶν
  choice: seus cavalos
  rationale: A forma grega é singular, provavelmente coletiva. O plural natural em português preserva a imagem concreta dos cavalos sem explicitar interpretativamente “cavalaria”.
- source_word: βουνούς
  choice: colinas
  rationale: Distingue βουνούς, elevações menores, de ὄρη, “montanhas”, empregado no início do versículo.
theological_decisions:
- issue: Personificação singular da Assíria combinada com referências plurais às suas tropas
  choice: Manter “A Assíria” como sujeito singular e depois referir-se no plural às forças e aos cavalos.
  alternative: Uniformizar toda a passagem no singular ou substituir o sujeito por “o assírio”.
  rationale: A alternância reflete a retórica poética do grego, que personifica o poder imperial e ao mesmo tempo descreve os elementos que compõem seu exército; uniformizá-la eliminaria uma tensão genuína do texto.
translation_notes:
  register: Português atual, digno e poético, com leitura amplamente acessível no Brasil e em outros contextos lusófonos. Conserva-se “miríades” para reproduzir o tom elevado, enquanto “leitos dos riachos sazonais” torna a geografia compreensível sem depender de um termo técnico.
