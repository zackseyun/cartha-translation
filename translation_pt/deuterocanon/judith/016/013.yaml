base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/013.yaml
  text: I will sing to my God a new hymn[a]. Lord, you are great and glorious, marvelous in strength[b], unsurpassable.
translation:
  language: pt
  text: Cantarei ao meu Deus um hino novo[a]. Senhor, tu és grande e glorioso, maravilhoso em poder, insuperável[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um cântico novo». O grego diz literalmente «um hino novo» (ὕμνον καινόν), isto é, mais especificamente, um cântico de louvor.
    reason: lexical_alternative
  - marker: b
    text: Ou «invencível» ou «incomparável». O termo grego ἀνυπέρβλητος descreve quem não pode ser ultrapassado nem vencido.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμνήσω
  choice: Cantarei
  rationale: O futuro de ὑμνέω expressa o ato de cantar em louvor; em português, «cantarei» é natural, e o objeto «um hino novo» preserva explicitamente a ideia de louvor.
- source_word: τῷ θεῷ μου
  choice: ao meu Deus
  rationale: O dativo indica aquele a quem o hino é dirigido ou em cuja honra é cantado; «ao meu Deus» reproduz essa relação com clareza.
- source_word: ὕμνον καινόν
  choice: um hino novo
  rationale: ὕμνος designa especificamente um cântico de louvor. «Hino» conserva essa precisão, enquanto «cântico» seria uma alternativa mais ampla.
- source_word: Κύριε
  choice: Senhor
  rationale: O vocativo κύριε dirige-se diretamente a Deus; «Senhor» é a forma portuguesa corrente e digna, sem necessidade da interjeição «ó».
- source_word: μέγας
  choice: grande
  rationale: Tradução direta do adjetivo, adequada ao contexto de exaltação divina.
- source_word: ἔνδοξος
  choice: glorioso
  rationale: No contexto doxológico, «glorioso» comunica esplendor, honra e majestade.
- source_word: θαυμαστὸς
  choice: maravilhoso
  rationale: O termo descreve aquilo que causa admiração ou assombro; «maravilhoso» mantém o tom de louvor.
- source_word: ἐν ἰσχύι
  choice: em poder
  rationale: Embora «em força» seja mais formalmente próximo, «em poder» é mais natural em português neste contexto e comunica a potência divina sem restringi-la à força física.
- source_word: ἀνυπέρβλητος
  choice: insuperável
  rationale: O adjetivo indica aquele que não pode ser ultrapassado ou vencido. «Insuperável» preserva essa amplitude, sem reduzir o sentido apenas à invencibilidade militar.
theological_decisions:
- issue: Tradução de κύριος na invocação dirigida a Deus
  choice: Senhor
  alternative: Ó Senhor
  rationale: O grego usa o vocativo Κύριε. «Senhor» mantém a invocação direta em português moderno; «ó» é possível, mas é um recurso estilístico não exigido pelo texto.
- issue: Amplitude de ἀνυπέρβλητος aplicado a Deus
  choice: insuperável
  alternative: invencível
  rationale: «Insuperável» conserva tanto a ideia de não ser ultrapassado quanto a de não ser vencido. «Invencível» destacaria sobretudo a dimensão de combate e estreitaria a ambiguidade lexical.
translation_notes:
  register: Português moderno, claro e reverente, com construção natural tanto no Brasil quanto em outros contextos lusófonos. A ordem e o paralelismo do louvor grego foram preservados; «em poder» evita a rigidez de «em força», e as notas registram alternativas lexicais genuínas.
