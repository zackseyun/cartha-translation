  yaml_path: translation/deuterocanon/judith/016/011.yaml
  text: Then my lowly ones shouted[a], and my weak ones were afraid and panicked; they raised their voice[b], and they were overthrown.
translation:
  language: pt
  text: Então os meus abatidos gritaram[a], e os meus fracos temeram e se apavoraram; ergueram a voz e foram derrubados.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deram um grito de guerra”; o verbo grego pode indicar um grito forte com sentido militar neste contexto.
    reason: lexical_alternative
  - marker: b
    text: 'A frase final, “foram derrubados”, é ambígua nesta redação grega: pode continuar se referindo aos “abatidos” e “fracos” de Judite ou indicar implicitamente que os adversários deles foram derrubados.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάλαξαν
  choice: gritaram
  rationale: O verbo indica um grito forte e pode, no contexto, sugerir um grito de guerra. “Gritaram” mantém a força sem impor a nuance militar.
- source_word: οἱ ταπεινοί μου
  choice: os meus humildes
  rationale: ταπεινοί pode designar pessoas humildes, de condição baixa ou socialmente abatidas. A expressão escolhida conserva o sentido amplo e o possessivo μου, sem acrescentar explicitamente a ideia de opressão.
- source_word: οἱ ἀσθενοῦντές μου
  choice: os meus fracos
  rationale: O particípio substantivado designa aqueles que são fracos ou sem força, sem exigir uma interpretação médica.
- source_word: ἐφοβήθησαν ... ἐπτοήθησαν
  choice: ficaram com medo e se apavoraram
  rationale: A formulação preserva a progressão entre sentir medo e ser tomado por um temor ou alarma mais intenso.
- source_word: ὕψωσαν τὴν φωνὴν αὐτῶν
  choice: levantaram a voz
  rationale: É uma expressão portuguesa natural que corresponde de perto ao idioma grego de erguer a voz.
- source_word: ἀνετράπησαν
  choice: foram derrubados
  rationale: A forma passiva pode significar ser derrubado, arruinado ou vencido. “Foram derrubados” preserva o resultado passivo sem especificar indevidamente uma derrota militar.
theological_decisions:
- issue: Referente do verbo passivo final ἀνετράπησαν
  choice: A tradução não introduz um novo sujeito e mantém a formulação comprimida do grego.
  alternative: Entender implicitamente que os inimigos dos humildes e fracos é que foram derrubados.
  rationale: A sequência grega permite ligar o verbo final aos sujeitos mencionados imediatamente antes, mas o contexto pode levar à compreensão de uma mudança implícita para os adversários. A tradução não acrescenta “seus inimigos” e a nota registra a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A repetição dos possessivos e a sequência emocional do grego foram preservadas; a ambiguidade do sujeito da oração final foi mantida e explicada em nota.
