lexical_decisions:
- source_word: εὐφραινόμενος
  choice: se alegrava
  rationale: Expressa a alegria comunitária contínua indicada pelo particípio, em linguagem natural e digna.
- source_word: κατὰ πρόσωπον τῶν ἁγίων
  choice: diante do santuário
  rationale: Preserva o valor espacial de κατὰ πρόσωπον e comunica o referente cultual mais provável de τῶν ἁγίων no contexto de Jerusalém, mantendo as alternativas genuínas em nota.
- source_word: ἐπὶ μῆνας τρεῖς
  choice: durante três meses
  rationale: Equivalente temporal idiomático que expressa a duração da celebração.
- source_word: κατέμεινεν
  choice: permaneceu
  rationale: Reproduz de modo direto a ideia de Judite ter continuado ali com o povo.
- source_word: λαός
  choice: o povo
  rationale: Tradução coletiva natural, sem acrescentar uma especificação étnica ou política ausente da expressão imediata.
theological_decisions:
- issue: Referente de τῶν ἁγίων no contexto cultual de Jerusalém
  choice: santuário
  alternative: coisas santas; santos
  rationale: A construção espacial, ligada à celebração em Jerusalém, favorece uma referência ao santuário ou recinto sagrado. Como a forma grega pode também designar coisas santas ou seres santos, a ambiguidade relevante é preservada em nota.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. O aspecto contínuo da celebração é expresso por “se alegrava”, e a ambiguidade cultual de τῶν ἁγίων é indicada em nota.
