base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/019.yaml
  text: And Judith dedicated to God all the equipment of Holofernes that the people had given her[b][a], and she gave to God as a dedicated offering the canopy that she had taken for herself from his bedchamber.
translation:
  language: pt
  text: Judite consagrou todos os objetos de Holofernes que o povo lhe havia dado; e deu a Deus, como oferta consagrada[a], o dossel[b] que havia tomado para si do aposento dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como oferta votiva” ou “como objeto dedicado”.
    reason: lexical_alternative
  - marker: b
    text: Ou “mosquiteiro” ou “cortinado da cama”; o termo grego κωνώπιον pode designar uma cobertura de cama destinada a proteger contra mosquitos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέθηκεν
  choice: consagrou
  rationale: O verbo indica a dedicação de um objeto à divindade. “Consagrou” preserva o sentido cultual sem sugerir que os objetos tenham sido sacrificados.
- source_word: σκεύη
  choice: objetos
  rationale: O plural abrange utensílios, equipamentos ou outros artigos pertencentes a Holofernes. “Objetos” mantém essa amplitude sem restringir o termo a armas, vasos ou bens domésticos.
- source_word: κωνώπιον
  choice: dossel
  rationale: O termo designa uma cobertura ou cortinado de cama, possivelmente usado como mosquiteiro. “Dossel” é natural no contexto narrativo, e as alternativas mais específicas são registradas em nota.
- source_word: κοιτῶνος
  choice: aposento
  rationale: O termo se refere ao cômodo de dormir. “Aposento” mantém um registro narrativo digno sem o ar excessivamente arcaico de “câmara”.
- source_word: εἰς ἀνάθημα
  choice: como oferta consagrada
  rationale: A expressão descreve algo dedicado a Deus, possivelmente uma oferta votiva. A formulação explicita a consagração sem impor uma categoria sacrificial.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: O dativo identifica Deus como o destinatário da entrega e da dedicação.
- source_word: ἔλαβεν ἑαυτῇ
  choice: havia tomado para si
  rationale: A formulação conserva o pronome reflexivo e não decide além do texto se Judite o tomou como despojo, recompensa ou posse permanente.
theological_decisions:
- issue: Linguagem cultual de dedicação
  choice: Descrever os objetos como consagrados e o dossel como uma oferta consagrada a Deus.
  alternative: Traduzir tecnicamente como “oferta votiva” ou, de modo mais geral, apenas como algo “dado a Deus”.
  rationale: O grego emprega tanto ἀνέθηκεν quanto ἀνάθημα, estabelecendo uma ligação explícita entre dedicação e entrega religiosa. A tradução conserva essa ligação sem importar ideias posteriores sobre sacrifício ou procedimentos do templo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Aposento” preserva o tom narrativo sem excesso de arcaísmo; a pontuação distingue as duas ações paralelas de Judite.
