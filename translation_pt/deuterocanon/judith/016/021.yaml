base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/021.yaml
  text: After these days[a], each one returned to his own inheritance, and Judith went away to Bethulia and remained on her own property[c][b], and in her time she became renowned throughout all the land.
translation:
  language: pt
  text: Depois desses dias, cada um voltou para a sua própria herança[a], e Judite foi para Betúlia e permaneceu em sua propriedade[b]. Em seu tempo, ela se tornou ilustre[c] em toda a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a sua própria porção de terra”; o termo grego pode indicar uma herança, posse ou território recebido por partilha.
    reason: lexical_alternative
  - marker: b
    text: Ou “em seus próprios bens” ou “em sua propriedade rural”; a expressão grega se refere ao que pertencia a Judite.
    reason: lexical_alternative
  - marker: c
    text: Ou “honrada” ou “renomada”; o termo grego ressalta a honra e a reputação pública de Judite.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: Depois desses dias
  rationale: Expressa diretamente a transição temporal indicada por ἡμέρας, em português natural, sem substituir “dias” por “acontecimentos”.
- source_word: ἀνέζευξεν
  choice: voltou
  rationale: O verbo pode descrever levantar acampamento e partir; com o destino expresso pela herança de cada um, “voltou” comunica adequadamente o retorno às respectivas terras.
- source_word: ἕκαστος
  choice: cada um
  rationale: Preserva o sentido distributivo do singular grego e combina naturalmente com o possessivo seguinte.
- source_word: εἰς τὴν κληρονομίαν αὐτοῦ
  choice: para a sua própria herança
  rationale: “Herança” conserva a ideia bíblica de porção familiar ou território recebido; “própria” torna explícita em português a relação individual marcada pelo possessivo.
- source_word: ἀπῆλθεν εἰς Βαιτυλουὰ
  choice: foi para Betúlia
  rationale: Tradução idiomática do movimento para a cidade; o contexto já indica a partida, de modo que “foi” evita uma formulação pesada.
- source_word: κατέμεινεν
  choice: permaneceu
  rationale: Indica residência continuada e mantém um registro narrativo digno.
- source_word: ἐπὶ τῆς ὑπάρξεως αὐτῆς
  choice: em sua propriedade
  rationale: Refere-se aos bens ou à propriedade pertencente a Judite. A formulação é clara e não impõe conotações aristocráticas.
- source_word: κατὰ τὸν καιρὸν αὐτῆς
  choice: Em seu tempo
  rationale: Mantém a expressão temporal ampla do grego, que pode abranger sua época ou o período de sua vida, sem restringi-la silenciosamente.
- source_word: ἔνδοξος
  choice: ilustre
  rationale: Comunica reputação pública acompanhada de honra, sem sugerir necessariamente “glória” em sentido teológico.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: em toda a terra
  rationale: Preserva a abrangência geográfica da expressão e o uso bíblico de “terra” para o país ou território.
theological_decisions:
- issue: Sentido de κληρονομία no retorno às terras familiares
  choice: herança
  alternative: porção de terra; propriedade
  rationale: “Herança” preserva a ressonância bíblica da terra familiar ou atribuída, sem reduzir o termo a um bem imobiliário comum.
- issue: Caracterização de Judite por ἔνδοξος
  choice: ilustre
  alternative: honrada; renomada; gloriosa
  rationale: O contexto destaca a elevada reputação de Judite em toda a terra. “Ilustre” mantém o componente de honra pública sem transformar a frase em uma afirmação teológica sobre glória intrínseca.
- issue: Amplitude temporal de κατὰ τὸν καιρὸν αὐτῆς
  choice: Em seu tempo
  alternative: durante a sua vida
  rationale: A expressão escolhida conserva a possível referência tanto ao período de vida de Judite quanto à sua época, em vez de resolver a ambiguidade em favor de apenas uma leitura.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe foi dividida em duas frases para evitar uma coordenação excessivamente longa, sem alterar a progressão narrativa. “Betúlia” segue a forma tradicional portuguesa do topônimo.
