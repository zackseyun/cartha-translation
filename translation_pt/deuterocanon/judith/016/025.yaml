  yaml_path: translation/deuterocanon/judith/016/025.yaml
  text: And there was no longer anyone to terrify the sons of Israel in the days of Judith, and for many days after she died. Amen.
translation:
  language: pt
  text: E já não havia ninguém que aterrorizasse os filhos de Israel nos dias de Judite e por muitos dias depois que ela morreu. Amém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἐκφοβῶν
  choice: ninguém que aterrorizasse
  rationale: O particípio substantivado indica uma pessoa que causava terror; a formulação portuguesa preserva essa ideia de modo natural.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: os filhos de Israel
  rationale: Mantém a expressão tradicional e a imagem coletiva do grego, sem substituí-la interpretativamente por 'israelitas'.
- source_word: ἡμέρας πολλάς
  choice: por muitos dias
  rationale: Reproduz de perto a expressão temporal grega e evita ampliar seu sentido para um período indefinido mais longo.
- source_word: ἀμήν
  choice: Amém
  rationale: Transliteração consagrada em português, adequada ao encerramento solene do livro.
theological_decisions:
- issue: Duração da paz após a morte de Judite
  choice: por muitos dias depois que ela morreu
  alternative: por muito tempo depois da morte dela
  rationale: A tradução mantém a unidade concreta 'dias' e a construção verbal do grego, sem interpretar a duração além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego e boa legibilidade brasileira. A repetição temporal foi preservada sem tornar a frase excessivamente literal.
