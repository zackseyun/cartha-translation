  text: He said he would set my mountains on fire[a], and kill my young men with the sword, and throw my nursing children to the ground, and give my infants as plunder, and despoil my virgins.
translation:
  language: pt
  text: Ele disse que incendiaria os meus montes, mataria os meus jovens à espada, poria no chão as crianças que ainda mamam, entregaria os meus pequeninos como despojo e espoliaria as minhas virgens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: “violaria as minhas virgens”. O verbo grego significa mais literalmente “espoliar”, “despojar” ou “saquear”, mas, neste contexto de violência de guerra, pode implicar violência sexual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν ... ἐμπρήσειν ... ἀνελεῖν ... σκυλεῦσαι
  choice: Ele disse que incendiaria ... mataria ... espoliaria
  rationale: A construção com «disse que» e o futuro do pretérito reproduz naturalmente em português a intenção declarada introduzida pelo aoristo seguido de infinitivos.
- source_word: τὰ ὅρη μου
  choice: os meus montes
  rationale: «Montes» mantém o sentido concreto e poético de ὄρη e soa mais natural neste registro do que «montanhas».
- source_word: τοὺς νεανίσκους μου ἀνελεῖν ῥομφαίᾳ
  choice: mataria os meus jovens à espada
  rationale: «Jovens» traduz νεανίσκους sem acrescentar que fossem guerreiros; «à espada» é uma formulação portuguesa corrente para o instrumento de morte.
- source_word: τὰ θηλάζοντά μου θήσει εἰς ἔδαφος
  choice: lançaria ao chão as crianças que ainda mamam
  rationale: A expressão identifica claramente crianças em fase de amamentação. No contexto violento, «lançaria ao chão» comunica o ato hostil sem intensificá-lo além do grego.
- source_word: τὰ νήπιά μου δώσει εἰς προνομὴν
  choice: entregaria os meus pequeninos como despojo
  rationale: νήπια indica crianças muito pequenas, e προνομή designa presa ou despojo de guerra. A formulação preserva a desumanização presente na ameaça.
- source_word: τὰς παρθένους σκυλεῦσαι
  choice: espoliaria as minhas virgens
  rationale: «Espoliar» preserva o sentido básico de σκυλεύω, despojar ou saquear, sem tornar explícita uma violência sexual que o verbo pode sugerir no contexto, mas não especifica lexicalmente.
theological_decisions:
- issue: Se a violência contra as virgens deve ser explicitada como sexual
  choice: espoliaria as minhas virgens
  alternative: violentaria as minhas virgens
  rationale: σκυλεῦσαι significa primariamente despojar ou espoliar. O texto principal mantém essa amplitude sem eliminar a possível conotação de violência sexual em contexto de guerra, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A cadência paralela da ameaça foi preservada; evitou-se tanto linguagem arcaica quanto explicitação interpretativa excessiva.
