base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/014.yaml
  text: Let all your creation serve you; for you spoke[a], and they came to be; you sent out your Spirit, and it formed them; and there is no one who will resist your voice.
translation:
  language: pt
  text: Que toda a tua criação te sirva, pois falaste, e as coisas vieram a existir; enviaste o teu Espírito[a], e ele as edificou; e ninguém resistirá à tua voz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o teu sopro” ou “o teu vento”. Em contextos de criação, a palavra grega também pode ter esses sentidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: δουλευσάτω
  choice: sirva
  rationale: O imperativo de δουλεύω expressa serviço ou sujeição. “Sirva” é natural em português e mantém a submissão de toda a criação a Deus sem impor a imagem mais estreita de escravidão.
- source_word: πᾶσα ἡ κτίσις σου
  choice: toda a tua criação
  rationale: O singular com πᾶσα tem sentido coletivo neste contexto; “toda a tua criação” comunica com clareza a abrangência universal.
- source_word: εἶπας
  choice: falaste
  rationale: Preserva a ação verbal divina e o tom poético elevado, além de preparar a referência final à voz de Deus.
- source_word: ἐγενήθησαν
  choice: as coisas vieram a existir
  rationale: O plural grego aponta para as realidades criadas. “Vieram a existir” conserva o sentido de surgimento sem tornar explícito um agente que a forma verbal não especifica nesse ponto.
- source_word: ἀπέστειλας
  choice: enviaste
  rationale: Expressa de modo direto e natural o ato de enviar; a ideia de movimento para fora já é suficientemente comunicada pelo verbo em português.
- source_word: τὸ πνεῦμά σου
  choice: o teu Espírito
  rationale: Em contexto de criação, πνεῦμα pode significar Espírito, sopro ou vento. “Espírito” é a leitura principal mais saliente, enquanto a nota preserva a amplitude lexical do grego.
- source_word: ᾠκοδόμησεν
  choice: ele as edificou
  rationale: Mantém a metáfora construtiva de οἰκοδομέω, aplicada poeticamente às coisas criadas. O pronome explicita em português que o sujeito é o Espírito, e “as” retoma “as coisas”.
- source_word: ἀντιστήσεται
  choice: resista
  rationale: “Resistir” traduz de forma concisa e idiomática a ideia de colocar-se contra ou fazer oposição.
- source_word: τῇ φωνῇ σου
  choice: à tua voz
  rationale: Conserva a imagem concreta da voz divina, central no paralelismo com “falaste”, sem reduzi-la interpretativamente a “ordem” ou “mandamento”.
theological_decisions:
- issue: Sentido de πνεῦμα no contexto da criação
  choice: o teu Espírito
  alternative: o teu sopro; o teu vento
  rationale: A linguagem de criação permite os sentidos sobrepostos de Espírito, sopro e vento. O texto principal adota “Espírito”, mas a nota mantém a ambiguidade genuína em vez de a eliminar.
- issue: Metáfora de οἰκοδομέω aplicada à criação
  choice: ele as edificou
  alternative: ele as formou; ele as estabeleceu
  rationale: “Edificou” conserva a imagem grega de construir, sem definir mais precisamente o modo da ação criadora. As alternativas seriam mais fluentes, porém reduziriam a força metafórica do verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal natural para leitores brasileiros. A estrutura poética e as orações coordenadas do grego foram preservadas. O marcador [a] foi colocado junto de “Espírito”, termo ao qual a nota efetivamente se refere.
