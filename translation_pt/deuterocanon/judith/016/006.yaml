base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/006.yaml
  text: For their mighty one did not fall by the hands of young men[a], nor did sons of Titans strike him, nor did tall giants set upon him; but Judith daughter of Merari disabled him with the beauty of her face.
translation:
  language: pt
  text: Pois o poderoso deles não caiu pelas mãos de jovens, nem filhos de Titãs o feriram, nem gigantes altos o atacaram; mas Judite, filha de Merari, o incapacitou[a] com a beleza do seu rosto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o paralisou”. O verbo grego pode indicar que alguém foi deixado sem forças ou incapacitado, em sentido literal ou figurado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δυνατὸς αὐτῶν
  choice: o poderoso deles
  rationale: δυνατός funciona como substantivo e designa o homem poderoso ou campeão do grupo. A formulação preserva o tom poético sem especificar um posto militar.
- source_word: νεανίσκων
  choice: jovens
  rationale: O termo designa homens jovens. “Jovens” é claro e natural, mantendo o contraste com adversários míticos ou sobre-humanos.
- source_word: υἱοὶ Τιτάνων
  choice: filhos de Titãs
  rationale: Tradução próxima do grego, que conserva a alusão mítica e a grandiosidade retórica.
- source_word: ἐπάταξαν
  choice: feriram
  rationale: O verbo significa golpear ou ferir. “Feriram” expressa o golpe sem acrescentar explicitamente uma ideia resultativa como “derrubaram”.
- source_word: ὑψηλοὶ γίγαντες
  choice: gigantes altos
  rationale: ὑψηλοί indica altura. A tradução mantém a imagem física concreta em vez de reduzi-la a “grandes” ou “poderosos”.
- source_word: ἐπέθεντο αὐτῷ
  choice: o atacaram
  rationale: A expressão idiomática significa lançar-se contra alguém ou atacá-lo. A opção é direta e atual.
- source_word: παρέλυσεν
  choice: o incapacitou
  rationale: O verbo pode indicar tornar alguém impotente, sem forças ou paralisado. No contexto, descreve como Judite deixou Holofernes vulnerável, sem exigir paralisia médica literal.
- source_word: ἐν κάλλει προσώπου αὐτῆς
  choice: com a beleza do seu rosto
  rationale: Mantém tanto o valor instrumental de ἐν quanto a imagem concreta de πρόσωπον, sem generalizar para mera aparência.
- source_word: θυγάτηρ Μεραρεί
  choice: filha de Merari
  rationale: Forma genealógica direta, transparente e natural em português bíblico atual.
theological_decisions:
- issue: Linguagem mítica em υἱοὶ Τιτάνων e γίγαντες
  choice: Manter os termos como “filhos de Titãs” e “gigantes altos”.
  alternative: Generalizar como “homens poderosos”, “heróis” ou “guerreiros”.
  rationale: O grego intensifica deliberadamente o contraste mediante figuras míticas ou sobre-humanas. Preservar essas imagens respeita a retórica do texto sem decidir a natureza histórica ou ontológica dessas figuras.
- issue: Sentido de παρέλυσεν
  choice: Traduzir como “o incapacitou”, com nota para “o paralisou”.
  alternative: Traduzir como “o paralisou”, “o destruiu” ou “o deixou sem forças”.
  rationale: “Incapacitou” conserva a possibilidade de enfraquecimento figurado e evita impor uma paralisia clínica literal ou antecipar o resultado final da morte de Holofernes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem das orações e as imagens poéticas foram mantidas, enquanto a sintaxe foi ajustada ao uso natural do português. O marcador da nota foi colocado junto a “incapacitou”, termo ao qual a alternativa lexical se refere.
