  yaml_path: translation/deuterocanon/judith/016/024.yaml
  text: And the house of Israel mourned for her seven days. And before she died, she divided her possessions among all who were nearest of kin to Manasseh her husband and to those nearest of kin of her family.
translation:
  language: pt
  text: E a casa de Israel guardou luto por ela durante sete dias. Antes de morrer, ela repartiu seus bens entre todos os parentes mais próximos de Manassés, seu marido, e os parentes mais próximos de sua própria família.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre todos os parentes mais próximos de seu marido Manassés e os parentes mais próximos de sua linhagem”. A construção grega é condensada, e o agrupamento exato dos parentes pode ser expresso de maneiras ligeiramente diferentes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπένθησεν
  choice: guardou luto
  rationale: Expressa de modo natural e preciso o luto pela morte, preservando o contexto funerário.
- source_word: οἶκος Ἰσραήλ
  choice: a casa de Israel
  rationale: Mantém o idioma coletivo e o tom bíblico do grego, referindo-se ao povo de Israel.
- source_word: ἡμέρας ἑπτά
  choice: durante sete dias
  rationale: Torna explícita, em português idiomático, a duração do luto indicada pelo acusativo temporal.
- source_word: διεῖλεν
  choice: repartiu
  rationale: No contexto de bens e herança, comunica naturalmente a ideia de dividir ou distribuir.
- source_word: τὰ ὑπάρχοντα αὐτῆς
  choice: seus bens
  rationale: Equivalente claro e abrangente para as posses ou propriedades dela.
- source_word: πρὸ τοῦ ἀποθανεῖν αὐτήν
  choice: Antes de morrer
  rationale: Reproduz de forma direta e idiomática a relação temporal expressa por πρό com o infinitivo articular.
- source_word: πᾶσι τοῖς ἔγγιστα
  choice: entre todos os parentes mais próximos
  rationale: O advérbio superlativo substantivado indica as pessoas de parentesco mais próximo; a formulação se ajusta ao contexto sucessório.
- source_word: Μανασσῆ τοῦ ἀνδρὸς αὐτῆς
  choice: de Manassés, seu marido
  rationale: Preserva a relação genitiva e identifica Manassés de maneira clara como marido de Judite.
- source_word: τοῦ γένους αὐτῆς
  choice: de sua própria família
  rationale: γένος pode indicar família, linhagem ou grupo de parentesco; 'família' é acessível, e 'própria' esclarece o contraste com os parentes do marido sem alterar o sentido.
