base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/016.yaml
  text: For every sacrifice for a pleasing aroma is a small thing[a], and all fat for your whole burnt offering is very little; but the one who fears the Lord is great forever.
translation:
  language: pt
  text: Pois todo sacrifício para aroma agradável é pouca coisa, e toda a gordura para um holocausto a ti é pouquíssima; mas quem teme o Senhor é grande para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “é sempre grande”; a expressão grega pode indicar tanto continuidade constante como permanência duradoura.
    reason: lexical_alternative
lexical_decisions:
- source_word: μικρὸν
  choice: é pouca coisa
  rationale: Mantém o adjetivo predicativo e a avaliação comparativa do sacrifício, sem sugerir desprezo absoluto.
- source_word: θυσία
  choice: sacrifício
  rationale: É o equivalente cultual direto e mais reconhecível em português.
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: oferecido como aroma agradável
  rationale: Preserva a imagem sacrificial e torna clara, em português natural, a relação entre o sacrifício e o aroma.
- source_word: ἐλάχιστον
  choice: é pouquíssima
  rationale: Reproduz a intensificação superlativa em contraste com 'pouca coisa'.
- source_word: στέαρ
  choice: gordura
  rationale: Designa literalmente a gordura sacrificial no contexto cultual.
- source_word: ὁλοκαύτωμά
  choice: holocausto
  rationale: No registro bíblico português, designa de modo conciso a oferta inteiramente consumida pelo fogo.
- source_word: σοι
  choice: que te é oferecido
  rationale: Explicita naturalmente o dativo dirigido a Deus, evitando a formulação potencialmente ambígua 'teu holocausto'.
- source_word: ὁ δὲ φοβούμενος τὸν κύριον
  choice: mas quem teme o Senhor
  rationale: Expressa de modo corrente a força geral do particípio substantivado e conserva o contraste introduzido por δέ.
- source_word: μέγας
  choice: é grande
  rationale: Preserva a antítese retórica direta entre a pequenez das ofertas e a grandeza de quem teme o Senhor.
- source_word: διὰ παντός
  choice: para sempre
  rationale: Comunica duração permanente, mantendo em nota a possibilidade lexical de continuidade constante.
theological_decisions:
- issue: Valor relativo do sacrifício em contraste com o temor do Senhor
  choice: As ofertas sacrificiais são apresentadas como pequenas em comparação com a grandeza de quem teme o Senhor.
  alternative: Os sacrifícios seriam insuficientes sem reverência, e não pequenos em si mesmos.
  rationale: O grego estabelece diretamente a antítese entre μικρόν/ἐλάχιστον e μέγας. A tradução mantém essa tensão sem introduzir uma rejeição geral do culto sacrificial.
- issue: Tradução de κύριον
  choice: Senhor
  alternative: Soberano
  rationale: É o título reverencial tradicional e semanticamente adequado para Deus neste contexto grego deuterocanônico.
- issue: Alcance temporal de διὰ παντός
  choice: para sempre
  alternative: sempre / continuamente
  rationale: A expressão admite tanto permanência duradoura quanto continuidade. O texto principal adota a leitura de permanência e registra a alternativa em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva o paralelismo e a antítese do grego. 'Holocausto' é empregado no sentido cultual bíblico de oferta totalmente queimada.
