revisions:
- from: Pois todo sacrifício oferecido como aroma agradável é pouca coisa, e toda a gordura para o holocausto que te é oferecido é pouquíssima; mas quem teme o Senhor é grande para sempre.[a]
  to: Pois todo sacrifício para aroma agradável é pouca coisa, e toda a gordura para um holocausto a ti é pouquíssima; mas quem teme o Senhor é grande para sempre.[a]
  rationale: A revisão corrige a relação de εἰς ὀσμὴν εὐωδίας, evitando apresentar o sacrifício como se fosse ele mesmo um aroma oferecido. Também restitui de maneira mais próxima e sem expansão interpretativa a relação de σοι com «holocausto». Mantêm-se a antítese μικρόν/ἐλάχιστον versus μέγας, a ambiguidade temporal de διὰ παντός na nota e o registro bíblico moderno.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T23:55:55Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a antítese central entre a pequenez das ofertas sacrificiais e a grandeza de quem teme o Senhor. Contudo, «oferecido como aroma agradável» torna o sacrifício propriamente o aroma oferecido, ao passo que εἰς ὀσμὴν εὐωδίας expressa a finalidade/resultado cultual («para aroma agradável»). A expressão relativa «holocausto que te é oferecido» é uma explicitação possível, mas desloca desnecessariamente a construção grega, em que σοι se liga diretamente a «holocausto».
  naturalness: O português é em geral claro, digno e natural. «Para um holocausto a ti» conserva melhor a relação sintática do grego, embora mantenha o tom bíblico-cultual. «Para aroma agradável» é compacto e fiel à formulação cultual, sem a imprecisão de «oferecido como aroma».
  terminology: «Sacrifício», «gordura», «holocausto», «Senhor» e «teme o Senhor» são escolhas adequadas e consistentes com o registro bíblico. «Holocausto» é aqui corretamente entendido no sentido técnico de oferta inteiramente queimada.
  issues:
  - severity: medium
    issue: «oferecido como aroma agradável»
    rationale: 'A formulação sugere que o sacrifício é oferecido na qualidade de aroma. O grego εἰς ὀσμὴν εὐωδίας indica antes a finalidade ou o resultado cultual: o sacrifício é para/como meio de produzir um aroma agradável.'
  - severity: low
    issue: «para o holocausto que te é oferecido»
    rationale: A relativa é interpretativa e faz «que te é oferecido» qualificar apenas «holocausto». No grego, σοι é um dativo diretamente associado a ὁλοκαύτωμα; «para um holocausto a ti» conserva essa estrutura com menor expansão.
  revised_text: Pois todo sacrifício para aroma agradável é pouca coisa, e toda a gordura para um holocausto a ti é pouquíssima; mas quem teme o Senhor é grande para sempre.[a]
  revised_footnotes:
  - marker: a
    text: Ou “é sempre grande”; a expressão grega pode indicar tanto continuidade constante como permanência duradoura.
    reason: lexical_alternative
  revision_rationale: A revisão corrige a relação de εἰς ὀσμὴν εὐωδίας, evitando apresentar o sacrifício como se fosse ele mesmo um aroma oferecido. Também restitui de maneira mais próxima e sem expansão interpretativa a relação de σοι com «holocausto». Mantêm-se a antítese μικρόν/ἐλάχιστον versus μέγας, a ambiguidade temporal de διὰ παντός na nota e o registro bíblico moderno.
