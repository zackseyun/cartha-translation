base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/015.yaml
  text: For mountains will be shaken from their foundations with the waters[a], and rocks will melt like wax before your face; yet to those who fear you, you are gracious.
translation:
  language: pt
  text: Pois os montes serão abalados desde os alicerces, junto com as águas, e as rochas se derreterão como cera diante da tua face[a]; contudo, tu és favorável aos que te temem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais idiomático, “na tua presença”. O grego diz literalmente “diante da tua face”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄρη
  choice: montes
  rationale: É o sentido concreto comum e preserva a imagem cósmica do texto; em português bíblico e poético, “montes” é natural e abrangente.
- source_word: ἐκ θεμελίων
  choice: desde os alicerces
  rationale: Expressa um abalo que parte da própria base. “Alicerces” comunica com clareza a imagem estrutural de θεμέλια.
- source_word: σὺν ὕδασιν
  choice: junto com as águas
  rationale: σύν indica acompanhamento. A formulação mantém as águas incluídas no abalo sem definir além do que o grego permite.
- source_word: σαλευθήσεται
  choice: serão abalados
  rationale: O futuro passivo de σαλεύω descreve algo sacudido ou posto em movimento. O plural é exigido pelo português, embora o grego use singular com o sujeito neutro plural.
- source_word: πέτραι
  choice: rochas
  rationale: No paralelismo com os montes, refere-se a massas rochosas, não a pequenas pedras.
- source_word: ἀπὸ προσώπου σου
  choice: diante da tua face
  rationale: Preserva a linguagem concreta e antropomórfica de πρόσωπον, ao mesmo tempo que soa compreensível em português. A alternativa idiomática é registrada em nota.
- source_word: ὡς κηρός
  choice: como cera
  rationale: Reproduz de modo direto e natural a comparação do original.
- source_word: τακήσονται
  choice: se derreterão
  rationale: O verbo indica derreter-se ou liquefazer-se; a forma pronominal é idiomática em português.
- source_word: ἔτι δὲ
  choice: contudo
  rationale: Marca a forte mudança de contraste entre a convulsão da criação e a disposição favorável de Deus para com os que o temem.
- source_word: τοῖς φοβουμένοις σε
  choice: aos que te temem
  rationale: Mantém o idioma bíblico do temor de Deus, que pode abranger assombro, reverência e temor, sem reduzi-lo apenas a respeito.
- source_word: εὐιλατεύεις
  choice: tu és favorável
  rationale: O verbo raro comunica uma disposição benévola, graciosa ou misericordiosa. “És favorável” é claro, digno e não restringe indevidamente o sentido a uma única nuance.
theological_decisions:
- issue: Sentido de τοῖς φοβουμένοις σε
  choice: aos que te temem
  alternative: aos que te reverenciam
  rationale: “Temem” preserva a amplitude e a tensão do idioma bíblico, em vez de resolvê-lo apenas como reverência respeitosa.
- issue: Linguagem antropomórfica de ἀπὸ προσώπου σου
  choice: diante da tua face
  alternative: na tua presença
  rationale: A tradução principal conserva a imagem concreta do original; a nota oferece a equivalência idiomática sem apagar essa imagem.
- issue: Nuance do raro εὐιλατεύεις
  choice: tu és favorável
  alternative: tu lhes mostras misericórdia
  rationale: O original indica disposição benevolente ou propícia. “És favorável” preserva essa amplitude, enquanto “mostras misericórdia” explicita uma possível nuance mais estreita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem foi levemente ajustada na oração final para evitar uma construção pesada, sem omitir τοῖς φοβουμένοις σε nem a referência pronominal inerente a αὐτοῖς. O marcador foi colocado após “face”, pois a nota se refere a ἀπὸ προσώπου σου; sua posição junto a “águas” na camada inglesa era incompatível com o conteúdo da nota.
