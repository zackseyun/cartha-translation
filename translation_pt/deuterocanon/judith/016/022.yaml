  source_fidelity: 'A tradução reproduz com precisão os elementos centrais do grego: πολλοί (“muitos”), ἐπεθύμησαν (“desejaram”), o eufemismo οὐκ ἔγνω ἀνήρ αὐτήν (“nenhum homem a conheceu”), a duração da viuvez e a fórmula funerária προσετέθη πρὸς τὸν λαὸν αὐτοῦ (“foi acrescentado ao seu povo”). Contudo, a ordem atual dos adjuntos temporais pode fazer “durante todos os dias de sua vida” parecer abranger também o período anterior à morte de Manassés. Reordená-los esclarece o escopo sem alterar o sentido nem resolver ambiguidades indevidas.'
  naturalness: O português é em geral natural, digno e acessível. A reordenação de “desde o dia em que” para antes da oração principal torna mais clara a relação temporal e evita uma leitura pouco plausível em que Judith nunca teria sido conhecida por homem algum, inclusive pelo próprio marido.
  terminology: “Manassés” é a forma portuguesa estabelecida. “Conheceu” preserva adequadamente o eufemismo sexual do grego, com explicação suficiente na nota. “Foi acrescentado ao seu povo” mantém, sem acréscimo doutrinário, a imagem funerária do original.
