base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/022.yaml
  text: And many desired her[a], but no man knew her all the days of her life[b], from the day when Manasseh her husband died and was added to his people.
translation:
  language: pt
  text: Muitos a desejaram, mas, desde o dia em que Manassés, seu marido, morreu e foi acrescentado ao seu povo[b], nenhum homem a conheceu[a] durante todos os dias de sua vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, nenhum homem teve relações sexuais com ela. O grego diz literalmente “nenhum homem a conheceu”, empregando um eufemismo sexual.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “foi reunido ao seu povo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεθύμησαν
  choice: desejaram
  rationale: O verbo expressa desejo forte; “desejaram” conserva a amplitude do grego sem especificar se o interesse era matrimonial ou estritamente sexual.
- source_word: οὐκ ἔγνω ἀνὴρ αὐτήν
  choice: nenhum homem a conheceu
  rationale: Mantém o eufemismo sexual convencional do grego e seu tom literário; a nota explicita o sentido para leitores modernos.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς αὐτῆς
  choice: durante todos os dias de sua vida
  rationale: Reproduz de modo claro a expressão temporal solene do original, sem restringi-la por paráfrase.
- source_word: ἀφʼ ἧς ἡμέρας
  choice: desde o dia em que
  rationale: Indica com naturalidade o ponto inicial do período mencionado.
- source_word: προσετέθη πρὸς τὸν λαὸν αὐτοῦ
  choice: foi acrescentado ao seu povo
  rationale: Segue de perto a metáfora funerária do grego e evita explicar além do que o texto afirma.
- source_word: Μανασσῆς
  choice: Manassés
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Eufemismo sexual em οὐκ ἔγνω ἀνὴρ αὐτήν
  choice: Conservar “nenhum homem a conheceu” no texto principal.
  alternative: “nenhum homem teve relações com ela”
  rationale: O original emprega deliberadamente um eufemismo. A tradução o preserva, enquanto a nota impede que o sentido seja perdido.
- issue: Expressão funerária προσετέθη πρὸς τὸν λαὸν αὐτοῦ
  choice: Traduzir como “foi acrescentado ao seu povo”.
  alternative: “foi reunido ao seu povo”
  rationale: A formulação escolhida conserva a metáfora específica de προσετέθη e sua ressonância bíblica, sem introduzir uma descrição mais definida do estado após a morte.
translation_notes:
  register: Português moderno, digno e acessível, com cadência bíblica moderada. O eufemismo sexual e a expressão funerária foram preservados no texto e esclarecidos em notas. Os marcadores foram posicionados junto às expressões a que cada nota corresponde.
