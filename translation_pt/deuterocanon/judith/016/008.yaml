translation:
  language: pt
  text: E prendeu os cabelos com uma faixa e pegou uma veste de linho para enganá-lo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para engano dele”. A expressão grega pode indicar finalidade ou resultado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδήσατο τὰς τρίχας αὐτῆς ἐν μίτρᾳ
  choice: prendeu os cabelos com uma faixa
  rationale: O verbo médio ἐδήσατο indica que ela amarrou ou ajeitou o próprio cabelo; μίτρα designa aqui uma faixa ou peça usada na cabeça. A formulação é natural em português e não sugere a mitra eclesiástica.
- source_word: ἔλαβεν
  choice: pegou
  rationale: Preserva o sentido básico de 'tomou' ou 'pegou' sem explicitar que ela vestiu a peça, ação que o verbo grego, isoladamente, não declara.
- source_word: στολὴν λινῆν
  choice: uma veste de linho
  rationale: στολή designa uma veste ou traje, e λινῆν especifica o material. 'Veste de linho' mantém a generalidade do grego em linguagem digna e compreensível.
- source_word: εἰς ἀπάτην αὐτοῦ
  choice: para enganá-lo
  rationale: εἰς pode indicar finalidade ou resultado, e ἀπάτη significa engano. No contexto, a expressão indica que a veste serviria para enganá-lo; a nota preserva a construção mais literal e sua leve ambiguidade.
theological_decisions:
- issue: Caracterização moral da ação de Judite
  choice: Descrever diretamente a finalidade como 'para enganá-lo', sem atenuar nem condenar a ação.
  alternative: para engano dele
  rationale: O texto grego emprega explicitamente a linguagem de ἀπάτη. A tradução preserva a descrição franca da estratégia de Judite sem acrescentar juízo moral ou justificativa teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A conjunção inicial foi preservada. 'Faixa' evita o sentido eclesiástico que 'mitra' teria hoje. O marcador da nota foi colocado após a expressão à qual de fato se refere, corrigindo a incompatibilidade presente na camada inglesa de consulta.
