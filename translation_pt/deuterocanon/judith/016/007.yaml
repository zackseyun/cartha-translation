lexical_decisions:
- source_word: ἐξεδύσατο
  choice: tirou
  rationale: O médio de ἐκδύω indica que ela retirou de si mesma a roupa; “tirou” é concreto, natural e não intensifica indevidamente a ação.
- source_word: στολὴν χηρεύσεως αὐτῆς
  choice: suas roupas de viuvez
  rationale: A expressão designa a indumentária própria de sua condição de viúva. O plural coletivo “roupas” soa natural em português, enquanto “de viuvez” mantém explícito o estado expresso pelo genitivo grego.
- source_word: εἰς ὕψος
  choice: para erguer
  rationale: A expressão comprimida aponta para elevação ou exaltação. “Para erguer” preserva a imagem vertical e comunica de modo idiomático a finalidade em relação aos aflitos.
- source_word: τῶν πονούντων
  choice: os que sofriam
  rationale: πονέω pode indicar labuta, dor ou aflição. No contexto da opressão de Israel, “sofriam” preserva a amplitude do termo sem o restringir a trabalho físico.
- source_word: ἐν Ἰσραήλ
  choice: em Israel
  rationale: Tradução direta da expressão locativa ou corporativa, natural em português.
