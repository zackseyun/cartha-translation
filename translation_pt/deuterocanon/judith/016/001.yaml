translation:
  language: pt
  text: Iniciem um cântico para o meu Deus com tamborins[a]; cantem ao Senhor com címbalos; preparem para ele um salmo e um louvor[b]; exaltem e invoquem o nome dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Comecem um cântico para o meu Deus com tamborins” ou “Puxem um cântico para o meu Deus com tamborins”. O imperativo grego é uma ordem musical para iniciar ou conduzir um canto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Entoem para ele, em harmonia, um salmo e um louvor”. O verbo grego pode indicar ajustar, arranjar ou executar em harmonia uma composição musical.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξάρχετε
  choice: Comecem o cântico
  rationale: O imperativo plural de ἐξάρχω, em contexto musical, manda iniciar ou conduzir um canto. O objeto implícito é explicitado para produzir português natural.
- source_word: τῷ θεῷ μου
  choice: ao meu Deus
  rationale: O dativo indica o destinatário da execução musical e preserva o possessivo pessoal.
- source_word: ἐν τυμπάνοις
  choice: com tamborins
  rationale: τύμπανον designa um tambor de mão ou instrumento semelhante ao pandeiro; “tamborins” é claro, atual e evita identificar o instrumento antigo de modo excessivamente específico.
- source_word: ᾄσατε τῷ κυρίῳ ἐν κυμβάλοις
  choice: cantem ao Senhor com címbalos
  rationale: Mantém o imperativo simples, o destinatário no dativo e o valor instrumental de ἐν.
- source_word: ἐναρμόσασθε
  choice: componham para ele
  rationale: O verbo expressa ajustar, ordenar ou pôr em forma harmoniosa. “Componham” comunica em português a preparação musical do salmo e do louvor, sem limitar o sentido apenas a cantar em harmonia.
- source_word: ψαλμὸν καὶ αἶνον
  choice: um salmo e um louvor
  rationale: Preserva os dois substantivos coordenados e a distinção entre ψαλμός e αἶνος.
- source_word: ὑψοῦτε
  choice: exaltem
  rationale: Em contexto de culto, o verbo significa elevar em honra ou grandeza.
- source_word: ἐπικαλεῖσθε τὸ ὄνομα αὐτοῦ
  choice: invoquem o nome dele
  rationale: “Invocar” conserva a nuance religiosa de apelar ou dirigir-se solenemente ao nome de Deus.
theological_decisions:
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” é a tradução bíblica corrente e adequada ao contexto de adoração, sem acrescentar uma interpretação denominacional.
- issue: Sentido de ἐναρμόσασθε
  choice: componham para ele
  alternative: cantem em harmonia para ele
  rationale: A escolha mantém a imagem de ajustar ou dispor musicalmente o salmo e o louvor, sem afirmar que a execução vocal em harmonia seja o único sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais no plural. “Címbalos” preserva o nome tradicional e preciso do instrumento; “nome dele” evita a possível ambiguidade de “seu nome” no português contemporâneo.
