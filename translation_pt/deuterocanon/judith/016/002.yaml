  yaml_path: translation/deuterocanon/judith/016/002.yaml
  text: For the Lord is a God who shatters wars; for in his camp, in the midst of the people, he rescued me from the hand of those pursuing me.
translation:
  language: pt
  text: Pois o Senhor é Deus que despedaça as guerras; pois, em seu acampamento, no meio do povo, ele me livrou da mão dos que me perseguiam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συντρίβων πολέμους
  choice: que despedaça as guerras
  rationale: Preserva a imagem forte e incomum do particípio συντρίβων, sem reduzi-la simplesmente a ‘põe fim às guerras’.
- source_word: παρεμβολὰς
  choice: acampamento
  rationale: No contexto militar, o plural grego pode ter sentido coletivo e idiomático de acampamento; o singular é natural em português.
- source_word: ἐξείλατό με
  choice: me livrou
  rationale: Expressa resgate ou libertação de perigo de modo claro e corrente, sem acrescentar uma conotação técnica de salvação.
- source_word: ἐκ χειρὸς καταδιωκόντων με
  choice: das mãos dos que me perseguiam
  rationale: Mantém o idiomatismo bíblico ‘das mãos’ e representa o particípio intensivo καταδιωκόντων como perseguição ativa.
theological_decisions:
- issue: Relação entre θεὸς e Κύριος na primeira oração
  choice: o Senhor é Deus que despedaça as guerras
  alternative: Deus, que despedaça as guerras, é o Senhor
  rationale: A ordem grega é marcada e admite mais de uma análise. A escolha segue a leitura predicativa refletida pela tradição textual consultada e produz português claro, sem inserir um nome divino não presente no grego.
- issue: Sentido de ‘despedaçar guerras’
  choice: preservar a metáfora literal
  alternative: pôr fim às guerras
  rationale: A formulação pode destacar tanto o poder divino sobre a guerra quanto a destruição dos conflitos; manter a metáfora conserva essa tensão.
translation_notes:
  register: Português moderno, solene e acessível, com cadência poética. Conserva a repetição causal de ὅτι por meio de ‘pois’ e mantém a imagem vigorosa do grego.
