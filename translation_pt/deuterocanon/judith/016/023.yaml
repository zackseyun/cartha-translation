base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/023.yaml
  text: And she continued to prosper greatly[a], and she grew old in her husband's house for one hundred five years, and she set her maidservant free. Then she died in Bethulia[b], and they buried her in the cave of her husband Manasseh.
translation:
  language: pt
  text: Ela continuou a crescer muito em importância[a] e envelheceu na casa de seu marido, chegando aos cento e cinco anos. Libertou sua serva[b]. Depois morreu em Betúlia, e a sepultaram na caverna de seu marido, Manassés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “continuou a prosperar muito” ou “foi se tornando extremamente grande”. O grego fala literalmente de avançar ou progredir em grandeza, com forte intensificação.'
    reason: lexical_alternative
  - marker: b
    text: O termo grego designa uma criada ou acompanhante. Como Judite lhe concedeu liberdade, o contexto indica que ela se encontrava em condição servil.
    reason: lexical_alternative
lexical_decisions:
- source_word: προβαίνουσα μεγάλη σφόδρα
  choice: foi se tornando muito ilustre
  rationale: προβαίνω expressa avanço ou progresso, enquanto μεγάλη σφόδρα indica grandeza intensificada. A formulação conserva a ideia dinâmica e evita restringi-la, sem apoio suficiente, à prosperidade material.
- source_word: ἐγήρασεν ... ἔτη ἑκατὸν πέντε
  choice: envelheceu ... chegando aos cento e cinco anos
  rationale: O grego afirma que ela envelheceu e associa a isso cento e cinco anos. A tradução comunica naturalmente a idade alcançada, em vez de sugerir que ela passou exatamente esse período na casa.
- source_word: ἐν τῷ οἴκῳ τοῦ ἀνδρὸς αὐτῆς
  choice: na casa de seu marido
  rationale: Reprodução clara e formal do sentido locativo; 'casa' também permite a nuance de ambiente doméstico ou familiar.
- source_word: ἀφῆκεν τὴν ἅβραν αὐτῆς ἐλευθέραν
  choice: Libertou sua serva
  rationale: ἀφῆκεν ... ἐλευθέραν descreve a concessão de liberdade. ἅβρα designa uma criada ou acompanhante, e o ato de libertá-la indica condição servil.
- source_word: ἀπέθανεν εἰς Βαιτυλουὰ
  choice: morreu em Betúlia
  rationale: Embora εἰς normalmente indique movimento para dentro, neste uso do grego posterior funciona idiomaticamente como indicação de lugar.
- source_word: ἐν τῷ σπηλαίῳ
  choice: na caverna
  rationale: σπήλαιον significa literalmente 'caverna'; o contexto de sepultamento deixa clara sua função funerária.
- source_word: Μανασσῆ
  choice: Manassés
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio.
theological_decisions:
- issue: Condição social da acompanhante de Judite
  choice: serva, com nota explicando a condição servil
  alternative: escrava; criada; acompanhante
  rationale: ἅβρα não é o termo grego comum para 'escrava', mas a declaração de que Judite a libertou pressupõe sujeição legal ou servil. O texto principal mantém o termo amplo, e a nota preserva essa implicação sem suavizá-la.
- issue: Natureza da grandeza ou progresso de Judite
  choice: foi se tornando muito ilustre
  alternative: prosperou muito; tornou-se extremamente grande; avançava muito
  rationale: O grego não especifica riqueza material nem uma categoria teológica. 'Ilustre' expressa crescente grandeza ou destaque, enquanto a nota registra a amplitude lexical e a ambiguidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com fluidez brasileira. A coordenação repetitiva do grego foi moderada sem eliminar a progressão narrativa. As notas preservam as principais alternativas lexicais e a ambiguidade do original.
