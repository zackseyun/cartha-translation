lexical_decisions:
- source_word: Κύριος
  choice: Senhor
  rationale: Forma consagrada e natural em português para o título divino κύριος.
- source_word: Παντοκράτωρ
  choice: Todo-Poderoso
  rationale: Equivalente convencional do título divino, comunicando poder universal e preservando sua força teológica.
- source_word: ἠθέτησεν
  choice: reduziu a nada
  rationale: No contexto de vitória, expressa que Deus anulou a força dos inimigos e os tornou impotentes; é mais natural em português corrente do que o tecnicismo «invalidou».
- source_word: αὐτούς
  choice: os
  rationale: Pronome objeto plural que retoma os inimigos mencionados no contexto.
- source_word: ἐν χειρὶ
  choice: pela mão de
  rationale: Preserva a expressão bíblica de agência ou instrumentalidade, ainda compreensível em português moderno.
- source_word: θηλείας
  choice: uma mulher
  rationale: Embora o termo grego designe literalmente alguém do sexo feminino, «mulher» é a forma idiomática adequada neste contexto narrativo.
theological_decisions:
- issue: Tradução dos títulos divinos Κύριος Παντοκράτωρ
  choice: O Senhor Todo-Poderoso
  alternative: O Senhor, soberano de tudo
  rationale: Mantém os dois elementos do grego em formulação portuguesa natural e ressalta o poder universal de Deus sem paráfrase excessiva.
- issue: Agência em ἐν χειρὶ θηλείας
  choice: pela mão de uma mulher
  alternative: por meio de uma mulher
  rationale: 'Conserva a imagem concreta e a tensão do texto: o Senhor Todo-Poderoso derrota os inimigos usando uma mulher como agente, sem explicar além do que o grego afirma.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A locução «reduziu a nada» comunica com naturalidade o efeito de ἀθετέω neste contexto de derrota, enquanto «pela mão de» preserva o caráter bíblico da expressão grega.
