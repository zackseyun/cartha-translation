translation:
  language: pt
  text: O Senhor Todo-Poderoso os reduziu a nada pela mão de uma mulher[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por meio de uma mulher». A expressão grega «pela mão de» indica agência ou instrumento.'
