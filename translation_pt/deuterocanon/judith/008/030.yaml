  text: But the people became very thirsty[a], and they compelled us to do as we had said to them, and to bring upon ourselves an oath that we will not break.
translation:
  language: pt
  text: Mas o povo ficou com muita sede e nos obrigou a fazer o que lhes havíamos dito e a fazer recair sobre nós um juramento que não quebraremos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a nos comprometer por juramento». O grego diz literalmente: «a fazer recair sobre nós um juramento».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίψησεν σφόδρα
  choice: ficou com muita sede
  rationale: Expressa de maneira natural e clara, em português atual, a sede intensa indicada pelo aoristo ἐδίψησεν e pelo advérbio σφόδρα.
- source_word: ἠνάγκασαν
  choice: nos obrigou
  rationale: Comunica a forte pressão ou coerção do verbo grego. O singular concorda naturalmente com o substantivo coletivo «o povo» em português.
- source_word: ποιῆσαι ἡμᾶς καθὰ ἐλάλησαν αὐτοῖς
  choice: a fazer o que lhes havíamos dito
  rationale: 'Segue a leitura contextual refletida pela fonte de consulta: os dirigentes foram obrigados a cumprir o que haviam dito ao povo. A formulação grega deste testemunho é sintaticamente difícil, mas a tradução mantém a referência ao compromisso anterior sem acrescentar conteúdo.'
- source_word: ἐπαγαγεῖν ἐφʼ ἡμᾶς ὅρκον
  choice: a impor sobre nós um juramento
  rationale: Preserva a imagem literal de fazer recair um juramento sobre si mesmos, sem tornar a frase obscura em português.
- source_word: ὃν οὐ παραβησόμεθα
  choice: que não quebraremos
  rationale: «Quebrar um juramento» é a expressão idiomática clara em português para παραβαίνω neste contexto, e o futuro do original é preservado.
