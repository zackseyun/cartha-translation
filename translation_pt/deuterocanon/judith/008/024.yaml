base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/024.yaml
  text: Now[a], brothers, let us show our brothers that their life hangs on us[b], and that the holy things and the house and the altar rest on us.
translation:
  language: pt
  text: Agora, irmãos[a], mostremos aos nossos irmãos que a vida[b] deles pende de nós e que as coisas sagradas, a Casa e o altar repousam sobre nós.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irmãos e irmãs”, caso a interpelação seja entendida de modo inclusivo, e não como dirigida estritamente a homens.
    reason: lexical_alternative
  - marker: b
    text: Ou “a alma”; aqui, o sentido mais provável é a vida ou sobrevivência deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Preserva o plural masculino do grego e a linguagem de parentesco da aliança; a possível abrangência inclusiva é registrada em nota.
- source_word: ἐπιδειξώμεθα
  choice: mostremos
  rationale: O subjuntivo exortativo pede uma demonstração concreta; “mostremos” é natural e mantém a força do apelo.
- source_word: ἐξ ἡμῶν κρέμαται
  choice: pende de nós
  rationale: Mantém a imagem vívida de algo que está suspenso e, ao mesmo tempo, comunica em português a ideia de dependência.
- source_word: ἡ ψυχὴ αὐτῶν
  choice: a vida deles
  rationale: Neste contexto, ψυχή se refere à vida ou sobrevivência da comunidade, sem afirmar uma concepção específica da alma.
- source_word: τὰ ἅγια
  choice: as coisas sagradas
  rationale: Preserva o neutro plural e evita reduzi-lo interpretativamente a “santuário”, especialmente porque a Casa e o altar são mencionados separadamente.
- source_word: ὁ οἶκος
  choice: a Casa
  rationale: Mantém o termo simples do grego; a inicial maiúscula sinaliza naturalmente, no contexto cultual, a Casa de Deus, isto é, o templo, sem acrescentar essas palavras ao texto.
- source_word: τὸ θυσιαστήριον
  choice: o altar
  rationale: Equivalente cultual direto, claro e consagrado em português.
- source_word: ἐπεστήρισται ἐφʼ ἡμῖν
  choice: repousam sobre nós
  rationale: Expressa o estado presente de apoio ou sustentação comunicado pelo perfeito e preserva a imagem, em paralelo com “pende de nós”.
theological_decisions:
- issue: Linguagem de parentesco marcada por gênero na interpelação direta
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: O texto grego emprega o masculino plural. A forma principal o preserva, enquanto a nota mantém aberta a possibilidade de uso inclusivo no contexto.
- issue: Sentido de ψυχή
  choice: a vida deles
  alternative: a alma deles
  rationale: A ameaça à sobrevivência comunitária favorece “vida”; “alma” poderia introduzir uma afirmação antropológica que o contexto não exige.
- issue: Identificação de τὰ ἅγια
  choice: as coisas sagradas
  alternative: o santuário
  rationale: O plural pode designar realidades sagradas sem especificá-las. Traduzir por “santuário” resolveria uma ambiguidade que o grego mantém.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se as imagens paralelas “pende de nós” e “repousam sobre nós”, bem como a enumeração cultual do original. “Casa” recebe inicial maiúscula para indicar o templo no contexto sem substituir o vocábulo grego por uma explicitação interpretativa.
