base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/026.yaml
  text: Remember what he did with Abraham[a], and how he tested Isaac, and what happened to Jacob in Mesopotamia of Syria while he was shepherding the sheep of Laban[b], his mother's brother.
translation:
  language: pt
  text: Lembrem-se de tudo o que ele fez com Abraão, de como pôs Isaque à prova[a] e de tudo o que aconteceu a Jacó na Mesopotâmia da Síria[b], enquanto ele pastoreava as ovelhas de Labão, irmão de sua mãe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “testou Isaque”. O verbo grego pode significar “provar”, “testar” ou, em certos contextos, “tentar”; aqui, refere-se a uma prova, não a uma indução ao mal.
    reason: lexical_alternative
  - marker: b
    text: “Mesopotâmia da Síria” reproduz a expressão geográfica grega; também pode ser traduzida por “Mesopotâmia síria”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητε
  choice: Lembrem-se
  rationale: O aoristo imperativo plural funciona como uma exortação direta à recordação. “Lembrem-se” é natural em português moderno e preserva o número plural.
- source_word: ὅσα ἐποίησεν μετʼ Ἀβραάμ
  choice: tudo o que ele fez com Abraão
  rationale: “Com Abraão” mantém a amplitude de μετά com o genitivo, sem definir as ações como exclusivamente favoráveis ou adversas. O pronome “ele” expressa o sujeito implícito exigido pela sintaxe natural do português, sem inserir explicitamente “Deus”.
- source_word: ἐπείρασεν
  choice: pôs Isaque à prova
  rationale: πειράζω pode significar provar, testar ou, em certos contextos, tentar. Aqui, “pôs à prova” comunica um teste de fidelidade sem sugerir indução ao mal.
- source_word: ὅσα ἐγένετο τῷ Ἰακώβ
  choice: tudo o que aconteceu a Jacó
  rationale: A expressão abrange os acontecimentos que sobrevieram a Jacó. Esta formulação é idiomática e conserva a amplitude do grego.
- source_word: ἐν Μεσοποταμίᾳ τῆς Συρίας
  choice: na Mesopotâmia da Síria
  rationale: Preserva de modo transparente a expressão geográfica grega e sua relação genitiva, ainda que “Mesopotâmia síria” também seja possível.
- source_word: ποιμαίνοντι τὰ πρόβατα
  choice: enquanto ele pastoreava as ovelhas
  rationale: O particípio presente indica uma atividade contínua e circunstancial. “Pastoreava as ovelhas” conserva a imagem concreta do texto.
- source_word: Λαβὰν τοῦ ἀδελφοῦ τῆς μητρὸς αὐτοῦ
  choice: de Labão, irmão de sua mãe
  rationale: A formulação identifica claramente Labão como tio materno de Jacó e permanece próxima da construção grega.
theological_decisions:
- issue: Sujeito implícito das ações relacionadas a Abraão e Isaque
  choice: Empregar o pronome “ele”, sem nomear explicitamente Deus
  alternative: Inserir “Deus” como sujeito explícito ou reformular para omitir todo sujeito
  rationale: O contexto identifica o agente como Deus, mas o grego não o nomeia neste versículo. O pronome permite uma frase natural em português e preserva a contenção do original.
- issue: Sentido de ἐπείρασεν aplicado à ação divina
  choice: pôs à prova
  alternative: tentou ou testou
  rationale: “Pôs à prova” expressa uma prova de fidelidade e evita que o leitor entenda uma incitação ao mal, sem eliminar a força examinadora do verbo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “tudo o que” acompanha a estrutura enfática do grego; “pastoreava” mantém a imagem pastoral, e “irmão de sua mãe” evita substituir a formulação original pelo termo interpretativo “tio materno”. Os marcadores foram posicionados junto às expressões efetivamente explicadas pelas notas.
