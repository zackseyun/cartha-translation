base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/009.yaml
  text: And she heard the evil words of the people against the ruler[a], because they had lost heart over the shortage of water; and she heard all the words that Ozias had spoken to them, that he had sworn to hand over the city to the Assyrians after five days.
translation:
  language: pt
  text: 'E ela ouviu as palavras perversas do povo contra o governante, pois eles haviam desanimado por causa da escassez de água; e Judite ouviu todas as palavras que Ozias lhes havia dito: que ele tinha jurado entregar a cidade[a] aos assírios depois de cinco dias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “render a cidade aos assírios”. O grego diz literalmente “entregar a cidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥήματα τοῦ λαοῦ τὰ πονηρά
  choice: as palavras perversas do povo
  rationale: Mantém a referência concreta ao que foi dito e preserva a avaliação moral negativa de πονηρά, sem reduzir a expressão a meras reclamações.
- source_word: ἐπὶ τὸν ἄρχοντα
  choice: contra o governante
  rationale: A preposição expressa oposição dirigida à autoridade; “governante” conserva a generalidade do título ἄρχων sem especificar um cargo não indicado.
- source_word: ὠλιγοψύχησαν
  choice: haviam desanimado
  rationale: Expressa de modo corrente o sentido de perder o ânimo ou ficar abatido, mantendo clara a relação temporal com o que ela ouviu.
- source_word: ἐπὶ τῇ σπάνει τῶν ὑδάτων
  choice: por causa da escassez de água
  rationale: “Escassez” comunica a falta grave indicada por σπάνις; o singular coletivo “água” é mais natural em português.
- source_word: πάντας τοὺς λόγους
  choice: todas as palavras
  rationale: Conserva a ênfase do grego na totalidade das palavras proferidas, em vez de generalizar para “tudo”.
- source_word: ὤμοσεν
  choice: tinha jurado
  rationale: Preserva explicitamente o caráter de juramento, importante para a gravidade do compromisso narrado.
- source_word: παραδώσειν
  choice: entregar
  rationale: Reproduz o sentido amplo de dar ou passar às mãos de outro, sem impor no texto principal o termo militar mais específico “render”.
- source_word: μετὰ ἡμέρας πέντε
  choice: depois de cinco dias
  rationale: Representa diretamente o valor temporal de μετά com acusativo, sem convertê-lo em “dentro de cinco dias”.
theological_decisions:
- issue: Identificação do sujeito na segunda oração com Ἰουδείθ
  choice: 'Repetir explicitamente “Judite”: “Judite também ouviu”'
  alternative: Continuar apenas com “ela ouviu”
  rationale: O grego apresenta explicitamente o nome indeclinável Ἰουδείθ como sujeito posposto de ἤκουσεν. Repetir o nome preserva essa ênfase e elimina possível ambiguidade.
- issue: Natureza da entrega da cidade
  choice: Usar “entregar” no texto e registrar “render” em nota
  alternative: Traduzir diretamente por “render a cidade”
  rationale: παραδίδωμι permite o sentido contextual de rendição, mas sua formulação lexical é mais ampla. A tradução mantém essa amplitude e a nota explicita a leitura militar possível.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A pontuação divide o longo período grego para facilitar a leitura, sem alterar as relações lógicas; “também” liga naturalmente a segunda ocorrência de ἤκουσεν. Evitou-se especificar o cargo do governante ou transformar a entrega da cidade em terminologia militar no texto principal.
