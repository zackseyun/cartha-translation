  text: And Ozias said to her[a], “Everything you have said, you have spoken with a good heart, and there is no one who will oppose your words.”
translation:
  language: pt
  text: 'E Ozias lhe disse: “Tudo o que você disse, você o disse com bom coração[a], e ninguém se oporá às suas palavras.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “com bom coração”, expressão que indica intenção reta ou sincera, e não apenas que ela falou bem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθῇ καρδίᾳ
  choice: com bom coração
  rationale: Mantém a imagem grega do coração e seu sentido moral e disposicional, indicando intenção boa e sincera, sem reduzi-la ao simples advérbio “bem”.
- source_word: ἐλάλησας
  choice: falou
  rationale: Distingue este verbo do εἶπας anterior mediante a alternância natural entre “disse” e “falou”; o aoristo é vertido naturalmente pelo pretérito perfeito em português.
- source_word: ἀντιστήσεται
  choice: se oponha
  rationale: No português atual, “opor-se” comunica de modo natural a ideia de resistir ou contestar as palavras de Judite; o presente do subjuntivo é exigido pela construção existencial negativa, embora o grego use o futuro.
- source_word: τοῖς λόγοις σου
  choice: às suas palavras
  rationale: Preserva o substantivo plural e a referência direta ao conselho verbal de Judite.
- source_word: Πάντα ὅσα εἶπας
  choice: Tudo o que você disse
  rationale: Expressa com clareza a abrangência total da locução grega e mantém o tratamento direto em português contemporâneo.
- source_word: Ὀζείας
  choice: Ozias
  rationale: Segue a forma do nome próprio transmitida pelo texto grego, em sua grafia portuguesa tradicional, sem substituí-la pela forma hebraica Uzias.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo entre “disse” e “falou” preserva a variação verbal do grego sem soar artificial. A construção “não há ninguém que se oponha” é idiomática e conserva a força da afirmação.
