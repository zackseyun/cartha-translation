base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/006.yaml
  text: And she fasted all the days of her widowhood[a], except the days before Sabbaths and Sabbaths and the days before new moons and festivals and celebrations of the house of Israel.
translation:
  language: pt
  text: Ela jejuava durante todos os dias de sua viuvez, exceto nos dias anteriores aos sábados, nos sábados, nos dias anteriores às luas novas[a], nas festas e nas celebrações da casa de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega palavras compostas que significam literalmente os dias anteriores aos sábados e os dias anteriores às luas novas.
    reason: Esclarecer a formação incomum dos termos gregos do calendário sem recorrer a designações litúrgicas posteriores.
lexical_decisions:
- source_word: ἐνήστευε
  choice: jejuava
  rationale: O imperfeito grego indica uma prática habitual e contínua no passado; o imperfeito português transmite naturalmente esse aspecto.
- source_word: πάσας τὰς ἡμέρας τῆς χηρεύσεως αὐτῆς
  choice: durante todos os dias de sua viuvez
  rationale: A expressão abrange todo o período em que Judite viveu como viúva, preservando tanto a extensão temporal quanto a estrutura do grego.
- source_word: χωρὶς
  choice: exceto
  rationale: 'Neste contexto, a preposição marca exclusão: os dias enumerados não faziam parte da prática de jejum.'
- source_word: προσαββάτων
  choice: dias anteriores aos sábados
  rationale: O composto grego designa os dias que precedem os sábados. A formulação descritiva evita introduzir o termo litúrgico posterior «dias de preparação».
- source_word: σαββάτων
  choice: sábados
  rationale: Mantém o plural grego, adequado à recorrência semanal desses dias.
- source_word: προνουμηνιῶν
  choice: dias anteriores às luas novas
  rationale: O composto é paralelo a προσαββάτων e indica os dias que antecedem as observâncias das luas novas.
- source_word: ἑορτῶν
  choice: festas
  rationale: Termo atual e natural para celebrações religiosas festivas.
- source_word: χαρμοσυνῶν
  choice: celebrações
  rationale: O substantivo denota ocasiões de alegria ou regozijo; «celebrações» se ajusta naturalmente à enumeração de ocasiões comunitárias.
- source_word: οἴκου Ἰσραήλ
  choice: da casa de Israel
  rationale: Preserva o conhecido idioma bíblico e não reduz a expressão simplesmente a «Israel».
theological_decisions:
- issue: Natureza das exceções ao jejum de Judite
  choice: Judite jejuava habitualmente durante a viuvez, mas não nos dias sagrados e festivos enumerados.
  alternative: Entender os dias enumerados como ocasiões especiais de jejum.
  rationale: χωρὶς tem aqui sentido naturalmente exclusivo, e o caráter santo ou alegre dos dias enumerados confirma que eles constituíam exceções ao jejum.
- issue: Forma dos termos do calendário israelita
  choice: Traduzir descritivamente como «dias anteriores aos sábados» e «dias anteriores às luas novas».
  alternative: Empregar termos litúrgicos técnicos, como «dias de preparação» ou «vésperas».
  rationale: A tradução descritiva acompanha a formação dos compostos gregos sem acrescentar uma tecnicidade posterior nem sugerir apenas o período noturno anterior.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O imperfeito «jejuava» expressa o hábito passado; a enumeração mantém o paralelismo do grego. «Casa de Israel» conserva o idioma bíblico tradicional sem arcaísmo excessivo.
