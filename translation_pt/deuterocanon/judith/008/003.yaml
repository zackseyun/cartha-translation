  text: For he happened to be binding the sheaf in the field[a], and the hot wind came upon his head, and he fell onto his bed and died in Bethulia, his city. And they buried him with his fathers in the field between Dothaim and Balamon.
translation:
  language: pt
  text: Pois ele se encontrava no campo, amarrando o feixe, quando o vento abrasador[a] lhe atingiu a cabeça; ele caiu sobre a cama e morreu em Betúlia, sua cidade. E o sepultaram com seus pais, no campo entre Dotaim e Balamom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o calor abrasador». O grego καύσων pode designar tanto um calor intenso como um vento quente e abrasador.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτύγγανε
  choice: estava ... quando
  rationale: Expressa naturalmente em português a circunstância incidental introduzida pelo verbo, sem reduzir a construção a mera existência nem recorrer ao pouco idiomático «aconteceu estar».
- source_word: δεσμεύοντος τὸ δράγμα
  choice: amarrando o feixe
  rationale: Mantém o singular definido de τὸ δράγμα e descreve com clareza o trabalho agrícola de atar o feixe colhido.
- source_word: ὁ καύσων
  choice: um vento abrasador
  rationale: Adota o sentido meteorológico concreto possível para καύσων, adequado à cena no campo, enquanto a nota preserva a alternativa «calor abrasador».
- source_word: ἦλθεν ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: atingiu sua cabeça
  rationale: Verte de modo natural o movimento hostil ou aflitivo da expressão grega, sem acrescentar uma causa médica específica.
- source_word: ἔπεσεν ἐπὶ τὴν κλίνην
  choice: caiu de cama
  rationale: Em português corrente, a expressão indica que ele ficou acamado, preservando a referência a κλίνη sem sugerir necessariamente uma queda física sobre a cama.
- source_word: ἐτελεύτησεν
  choice: morreu
  rationale: Tradução direta e clara, sem eufemismo.
- source_word: Βαιτυλουὰ
  choice: Betúlia
  rationale: Forma tradicional e amplamente reconhecível em português para o topônimo.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: junto de seus pais
  rationale: Conserva a expressão familiar e funerária do texto, com sua ressonância bíblica, sem explicitar interpretativamente «antepassados».
- source_word: ἐν τῷ ἀγρῷ τῷ ἀνὰ μέσον Δωθαεὶμ καὶ Βαλαμών
  choice: no campo entre Dotaim e Balamom
  rationale: Reproduz com clareza a localização indicada por ἀνὰ μέσον e usa formas portuguesas legíveis dos topônimos.
