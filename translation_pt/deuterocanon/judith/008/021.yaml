base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/021.yaml
  text: For if we are captured like this[a], all Judea will be brought low, and our holy things will be plundered[d][c][b], and he will require their profanation from our blood.
translation:
  language: pt
  text: Pois, se formos capturados assim[a], toda a Judeia ficará prostrada[b], e as nossas coisas sagradas serão saqueadas, e ele exigirá de nosso sangue a profanação delas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando formos tomados desse modo”. A abertura grega é sintaticamente difícil; o sentido é que sermos capturados nessa situação trará o desastre.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “se sentará”. Aqui a imagem provavelmente indica que toda a Judeia ficará abatida, prostrada ou sem condições de agir.
    reason: lexical_alternative
  - marker: c
    text: O grego não declara o sujeito de “exigirá”. Pelo contexto, pode tratar-se de Deus exigindo a profanação das coisas sagradas de nosso sangue. A expressão traduzida “de nosso sangue” é concisa, difícil e admite mais de uma compreensão, inclusive a ideia de que isso será exigido ao custo do sangue do povo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ' ἐν τῷ λημφθῆναι ἡμᾶς οὕτως
  choice: Pois, se formos capturados assim
  rationale: A abertura grega é sintaticamente difícil, mas λημφθῆναι ἡμᾶς indica claramente sermos tomados ou capturados. A formulação condicional corresponde ao encadeamento lógico do contexto e soa natural em cenário militar.
- source_word: καθήσεται
  choice: ficará prostrada
  rationale: O verbo significa literalmente 'sentará', mas aqui comunica abatimento, inação ou desamparo. 'Ficará prostrada' preserva a imagem corporal e expressa seu sentido contextual sem reduzir a frase a um simples colapso.
- source_word: πᾶσα ἡ Ἰουδαία
  choice: toda a Judeia
  rationale: Ἰουδαία designa a região, não o povo como etnônimo; a tradução mantém a referência geográfica.
- source_word: προνομευθήσεται
  choice: serão saqueadas
  rationale: O futuro passivo descreve a tomada de bens por inimigos. 'Saqueadas' é expressão militar corrente e adequada ao objeto plural.
- source_word: τὰ ἅγια ἡμῶν
  choice: as nossas coisas sagradas
  rationale: O neutro plural pode abranger objetos e lugares consagrados, não apenas um santuário singular. A formulação mantém essa amplitude.
- source_word: ζητήσει
  choice: ele exigirá ... uma prestação de contas
  rationale: O verbo pode significar procurar, requerer ou exigir. Neste contexto, a ideia provável é a cobrança judicial de responsabilidade; o pronome preserva o sujeito masculino singular implícito sem inserir explicitamente 'Deus'.
- source_word: τὴν βεβήλωσιν αὐτῶν
  choice: pela profanação delas
  rationale: βεβήλωσις é a violação da condição sagrada. 'Profanação' oferece correspondência precisa e registro digno.
- source_word: ἐκ τοῦ αἵματος ἡμῶν
  choice: de nosso sangue
  rationale: A expressão é compacta e difícil. Mantê-la ligada à cobrança de contas conserva a imagem de que a responsabilidade será exigida ao preço do sangue do povo, sem explicitar além do grego.
theological_decisions:
- issue: Sujeito implícito de ζητήσει
  choice: Manter o sujeito apenas como 'ele', sem nomeá-lo.
  alternative: Traduzir explicitamente 'Deus exigirá' ou usar uma construção impessoal.
  rationale: O verbo grego está na terceira pessoa do singular, mas não declara o sujeito. O contexto pode apontar para Deus como quem pede contas, porém nomeá-lo resolveria uma ambiguidade genuína do texto.
- issue: Sentido judicial de ζητήσει ... ἐκ τοῦ αἵματος ἡμῶν
  choice: Expressar a exigência como prestação de contas, conservando 'de nosso sangue'.
  alternative: Traduzir mais literalmente 'exigirá a profanação delas de nosso sangue' ou mais interpretativamente 'nos fará pagar com o nosso sangue'.
  rationale: A formulação escolhida torna inteligível a relação judicial provável sem converter a metáfora em uma interpretação totalmente explícita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A tradução evita o literalismo pouco inteligível em καθήσεται e na construção final, mas conserva em notas a imagem concreta e a ambiguidade do sujeito e da expressão ligada ao sangue.
