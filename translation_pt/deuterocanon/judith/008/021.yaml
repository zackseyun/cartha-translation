  to: Pois, se formos capturados assim[a], toda a Judeia ficará prostrada[b], e as nossas coisas sagradas serão saqueadas, e ele exigirá de nosso sangue a profanação delas[c].
  rationale: A revisão remove a expressão interpretativa “uma prestação de contas”, para que “exigirá” permaneça ligado diretamente a “a profanação delas”, como ζητήσει a τὴν βεβήλωσιν αὐτῶν no grego. Mantém-se “de nosso sangue”, embora seja uma formulação deliberadamente tensa em português, porque reproduz a concisão e a ambiguidade da expressão grega; a nota explica as leituras possíveis. Também se corrige a referência pronominal da nota a e se restaura a coordenação contínua da frase.
