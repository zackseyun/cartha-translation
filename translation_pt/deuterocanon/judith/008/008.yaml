lexical_decisions:
- source_word: ἐπήνεγκεν αὐτῇ ῥῆμα πονηρόν
  choice: levantasse contra ela uma palavra maldosa
  rationale: Preserva a ideia de dirigir ou apresentar contra Judite uma fala prejudicial, acusatória ou difamatória, sem reduzir a expressão apenas a uma acusação formal.
- source_word: ἐφοβεῖτο τὸν θεὸν σφόδρα
  choice: temia profundamente a Deus
  rationale: Mantém o sentido religioso de reverência e temor diante de Deus, enquanto σφόδρα é expresso com naturalidade por “profundamente”.
theological_decisions:
- issue: Sentido de temer a Deus
  choice: temia profundamente a Deus
  alternative: tinha profunda reverência por Deus
  rationale: “Temia” conserva a linguagem e a tensão do grego, que pode envolver reverência, devoção e temor, sem substituir o termo por uma interpretação mais estreita.
