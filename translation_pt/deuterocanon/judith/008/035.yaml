  text: Then Uzziah and the rulers said to her[a], “Go in peace, and may the Lord God go before you for vengeance on our enemies.”
translation:
  language: pt
  text: 'Então Ozias e os governantes lhe disseram: “Vá em paz, e que o Senhor Deus vá à sua frente para exercer vingança[a] contra os nossos inimigos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para fazer justiça contra os nossos inimigos” ou “para nos vindicar diante dos nossos inimigos”. O termo grego pode indicar vingança punitiva ou vindicação; neste contexto de guerra, “vingança” parece mais provável.'
    reason: alternativa lexical
lexical_decisions:
- source_word: εἶπεν
  choice: disseram
  rationale: Embora o verbo grego esteja no singular, o sujeito composto — Ozias e os chefes — pede naturalmente o plural em português.
- source_word: Ὀζίας
  choice: Ozias
  rationale: Forma tradicional e reconhecível do nome em português, correspondente ao grego Ὀζίας.
- source_word: οἱ ἄρχοντες
  choice: os chefes
  rationale: Designa os homens investidos de autoridade; “chefes” preserva o caráter dirigente sem especificar um cargo não indicado no grego.
- source_word: Πορεύου εἰς εἰρήνην
  choice: Vá em paz
  rationale: Reproduz de modo natural a ordem e a fórmula de despedida e bênção do grego.
- source_word: Κύριος ὁ θεὸς
  choice: o Senhor Deus
  rationale: Segue diretamente o título grego, sem acrescentar pronome possessivo nem explicitar o tetragrama.
- source_word: ἔμπροσθέν σου
  choice: vá à sua frente
  rationale: Expressa a posição diante de Judite e, no contexto de movimento, a ideia implícita de precedê-la.
- source_word: εἰς ἐκδίκησιν
  choice: para exercer vingança
  rationale: Mantém a força punitiva de ἐκδίκησις no contexto militar, usando uma construção idiomática e digna em português.
- source_word: τῶν ἐχθρῶν ἡμῶν
  choice: contra os nossos inimigos
  rationale: Interpreta o genitivo como o alvo da vingança, sentido favorecido pelo contexto, sem sugerir que os inimigos sejam os agentes dela.
theological_decisions:
- issue: Tradução de κύριος em um texto grego deuterocanônico
  choice: o Senhor
  alternative: o SENHOR
  rationale: O texto-fonte traz Κύριος, não o tetragrama hebraico; “o Senhor” traduz o grego sem introduzir uma forma que ele não explicita.
- issue: Amplitude semântica de ἐκδίκησις
  choice: vingança
  alternative: vindicação / ato de fazer justiça
  rationale: O cenário de guerra e libertação favorece a ideia de ação punitiva contra os inimigos, mas a nota preserva a possibilidade de vindicação ou execução de justiça.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Conserva a fórmula bíblica “Vá em paz” e evita linguagem excessivamente arcaica ou uma especificação denominacional.
