base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/012.yaml
  text: And now[a], who are you, that you have put God to the test this day[b], and have set yourselves above God among the sons of men?
translation:
  language: pt
  text: E agora, quem são vocês, que neste mesmo dia puseram Deus à prova e se colocaram no lugar de Deus[a] entre os filhos dos homens[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e agiram em favor de Deus”. A expressão grega é condensada, e a preposição também pode indicar uma ação em nome de Deus.'
    reason: alternative_reading
  - marker: b
    text: Expressão semítica que significa “entre os seres humanos”, destacando a condição mortal da humanidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειράσατε
  choice: puseram Deus à prova
  rationale: Neste contexto, πειράζω descreve a atitude presunçosa de submeter Deus a uma prova, não a tentativa de induzi-lo ao mal. A locução portuguesa comunica com clareza esse sentido.
- source_word: ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: neste mesmo dia
  rationale: A formulação temporal enfática do grego pede mais que o simples “hoje”; “neste mesmo dia” conserva a solenidade e a ênfase retórica.
- source_word: ὑπεῖρ τοῦ θεοῦ
  choice: se colocaram no lugar de Deus
  rationale: A expressão grega é comprimida. No contexto, censura-se a pretensão dos dirigentes de assumir uma prerrogativa divina ao impor condições a Deus. A tradução explicita essa relação sem afirmar inequivocamente que eles se exaltaram acima de Deus.
- source_word: ἐν μέσῳ υἱῶν ἀνθρώπων
  choice: entre os filhos dos homens
  rationale: Reproduz a expressão semítica literal e preserva o contraste retórico entre Deus e a humanidade mortal; a nota esclarece o sentido idiomático.
- source_word: τίνες ἐστὲ ὑμεῖς
  choice: quem são vocês
  rationale: Mantém a forma direta e incisiva da pergunta retórica, sem ampliá-la para “quem vocês pensam que são”.
theological_decisions:
- issue: A censura quanto às prerrogativas de Deus
  choice: Judite acusa seus ouvintes de se colocarem no lugar de Deus.
  alternative: A expressão também pode ser entendida como agir ou falar em favor de Deus; outra leitura possível é colocar-se acima de Deus.
  rationale: O contexto indica que os dirigentes estabeleceram condições para Deus e, assim, arrogaram-se uma função divina. Como a construção grega é condensada e permite mais de uma nuance, a tradução adota a leitura contextual mais provável e registra a alternativa em nota.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” de compreensão internacional e boa legibilidade brasileira. A pergunta conserva o tom incisivo da repreensão. A expressão semítica “filhos dos homens” foi mantida no texto e esclarecida em nota; a ambiguidade da cláusula relativa à posição diante de Deus também foi preservada por nota.
