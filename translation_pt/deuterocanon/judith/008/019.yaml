  yaml_path: translation/deuterocanon/judith/008/019.yaml
  text: For this reason our fathers were handed over to the sword and to plundering, and they fell in a great slaughter before our enemies.
translation:
  language: pt
  text: Por isso, nossos pais foram entregues à espada e ao saque, e caíram numa grande mortandade[a] diante dos nossos inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente algo como “caíram como um grande corpo de caídos”; a expressão indica um grande número de mortos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν χάριν
  choice: Por isso
  rationale: Expressão causal idiomática; comunica com clareza a ligação com o motivo exposto no contexto, sem explicitar além do grego.
- source_word: ἐδόθησαν
  choice: foram entregues
  rationale: Preserva a voz passiva e o sentido de serem deixados sob o poder hostil, em vez do sentido neutro de 'dados'.
- source_word: εἰς ῥομφαίαν
  choice: à espada
  rationale: Mantém a imagem bélica e a construção bíblica natural em português para morte violenta pela espada.
- source_word: εἰς διαρπαγήν
  choice: ao saque
  rationale: O substantivo indica pilhagem ou espoliação; 'ao saque' é conciso, corrente e mantém o paralelismo com 'à espada'.
- source_word: οἱ πατέρες ἡμῶν
  choice: nossos pais
  rationale: Reproduz o substantivo masculino plural e o modo histórico-ancestral do texto, sem neutralizá-lo como 'antepassados'.
- source_word: ἔπεσον
  choice: caíram
  rationale: Conserva o conhecido sentido bélico de cair morto, sem substituir a imagem por uma explicação.
- source_word: πτῶμα μέγα
  choice: numa grande mortandade
  rationale: A expressão grega é compacta e literalmente sugere um grande corpo ou conjunto de caídos. 'Grande mortandade' transmite de modo natural o elevado número de mortos, enquanto a nota registra a forma incomum.
- source_word: ἐνώπιον τῶν ἐχθρῶν ἡμῶν
  choice: diante dos nossos inimigos
  rationale: Equivalente formal e natural de ἐνώπιον, preservando a referência aos inimigos de Israel.
theological_decisions:
- issue: Termo ancestral masculino
  choice: nossos pais
  alternative: nossos antepassados
  rationale: O grego emprega explicitamente o masculino plural no idioma histórico de Israel; a tradução mantém essa forma sem impor neutralização.
- issue: Sentido da expressão πτῶμα μέγα
  choice: caíram numa grande mortandade
  alternative: caíram como um grande amontoado de cadáveres
  rationale: A formulação escolhida comunica a morte coletiva em batalha sem acrescentar uma imagem de 'amontoado' que não é lexicalmente explícita; a nota preserva a dificuldade e a concretude do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se o paralelismo 'à espada e ao saque', a voz passiva e a imagem de 'cair' em batalha; a formulação grega incomum em πτῶμα μέγα é esclarecida em nota.
