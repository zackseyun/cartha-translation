base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/023.yaml
  text: For our slavery will not be turned to favor[a], but the Lord our God will make it a dishonor.
translation:
  language: pt
  text: Pois a nossa escravidão não resultará em favor[a], mas o Senhor, nosso Deus, fará dela uma desonra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não será conduzida ao favor”.'
    reason: A forma verbal grega pode conservar mais literalmente a imagem de algo dirigido ou conduzido para determinado fim.
lexical_decisions:
- source_word: κατευθυνθήσεται
  choice: resultará
  rationale: O futuro passivo, seguido de εἰς, indica aqui orientação para um desfecho. “Resultará” comunica esse sentido com naturalidade em português, sem pressupor prosperidade ou sucesso.
- source_word: δουλεία
  choice: escravidão
  rationale: O termo designa uma condição de sujeição ou escravidão. “Escravidão” conserva sua força, sem suavizá-lo como simples serviço.
- source_word: εἰς χάριν
  choice: em favor
  rationale: Neste contexto político e social, χάρις se refere a favor ou boa vontade, em contraste com desonra, e não especificamente à graça em sentido soteriológico.
- source_word: ἀτιμίαν
  choice: desonra
  rationale: “Desonra” expressa a perda de honra ou posição indicada pelo substantivo e mantém o contraste com “favor”.
- source_word: θήσει αὐτήν
  choice: fará dela
  rationale: A construção com τίθημι indica tornar algo em determinado estado ou resultado. “Fará dela” reproduz com clareza o referente feminino, a escravidão.
- source_word: Κύριος ὁ θεὸς ἡμῶν
  choice: o Senhor, nosso Deus
  rationale: Forma corrente, digna e fiel para a expressão grega, com a aposição explicitada pela pontuação.
theological_decisions:
- issue: Sentido de δουλεία na sujeição de Israel
  choice: escravidão
  alternative: servidão
  rationale: A formulação mais forte preserva a condição humilhante de sujeição em vista, em vez de sugerir mero serviço.
- issue: Sentido de χάρις fora de um contexto soteriológico
  choice: favor
  alternative: graça
  rationale: O contraste com ἀτιμία diz respeito ao desfecho e à posição social; “favor” evita introduzir uma associação teológica posterior.
- issue: Deus como agente da desonra resultante
  choice: o Senhor, nosso Deus, fará dela uma desonra
  alternative: ela acabará em desonra diante do Senhor, nosso Deus
  rationale: A tradução mantém Deus como sujeito explícito de θήσει, preservando a tensão teológica do texto em vez de atenuar sua agência.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Resultará em favor” evita a rigidez de uma reprodução mecânica da construção grega, enquanto a nota registra sua imagem direcional. O ponto e vírgula destaca o contraste enfático introduzido por ἀλλά.
