base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/015.yaml
  text: For if he is not willing to help us within these five days[a], he himself has the authority, in whatever days he wishes, to shelter us[b], or even to destroy us before our enemies.
translation:
  language: pt
  text: Pois, se ele não quiser nos ajudar nestes cinco dias, ele mesmo tem autoridade para nos abrigar[a] nos dias que quiser, ou até para nos destruir diante dos nossos inimigos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos proteger”. O verbo grego significa literalmente “cobrir” e, aqui, comunica a ideia de dar abrigo protetor.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “diante da face dos nossos inimigos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν μὴ βούληται
  choice: se ele não quiser
  rationale: Preserva o sentido volitivo de βούλομαι em português natural, sem recorrer a uma formulação arcaica como “se não for da vontade dele”.
- source_word: ἐν ταῖς πέντε ἡμέραις
  choice: nestes cinco dias
  rationale: A expressão temporal retoma o prazo de cinco dias mencionado no contexto; “nestes” comunica essa referência de modo claro.
- source_word: βοηθῆσαι ἡμῖν
  choice: nos ajudar
  rationale: Mantém o sentido amplo de prestar ajuda ou socorro, sem restringi-lo à ideia mais forte de resgate.
- source_word: αὐτὸς ἔχει τὴν ἐξουσίαν
  choice: ele mesmo tem autoridade
  rationale: “Ele mesmo” reproduz a ênfase de αὐτός, e “autoridade” expressa a prerrogativa indicada por ἐξουσία sem reduzi-la a mera capacidade.
- source_word: ἐν αἷς θέλει ... ἡμέραις
  choice: nos dias que quiser
  rationale: Preserva a referência explícita a dias e a liberdade divina quanto ao momento da ação, em formulação portuguesa natural.
- source_word: σκεπάσαι
  choice: nos abrigar
  rationale: O verbo tem o sentido básico de cobrir e, neste contexto, de dar abrigo protetor. “Abrigar” conserva melhor a imagem do que o termo mais abstrato “proteger”.
- source_word: ὀλεθρεῦσαι
  choice: nos destruir
  rationale: Traduz diretamente a ideia grave de causar destruição ou ruína.
- source_word: πρὸ προσώπου τῶν ἐχθρῶν ἡμῶν
  choice: diante dos nossos inimigos
  rationale: Conserva o sentido espacial e público da expressão grega sem acrescentar que os inimigos seriam necessariamente os agentes da destruição.
theological_decisions:
- issue: Soberania divina sobre o momento e o resultado
  choice: Deus conserva a autoridade tanto para abrigar o povo quanto para destruí-lo, independentemente do prazo humano de cinco dias.
  alternative: Atribuir diretamente a Deus apenas a proteção e apresentar a destruição como algo meramente permitido ou executado pelos inimigos.
  rationale: No grego, os dois infinitivos, σκεπάσαι e ὀλεθρεῦσαι, dependem da mesma afirmação de autoridade divina. A tradução mantém essa tensão, sem suavizar a segunda possibilidade nem especificar uma agência que o texto não declara.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A ordem de “nos dias que quiser” foi mantida próxima da estrutura e da ênfase temporal do grego, sem sacrificar a naturalidade.
