- source_word: χηρεύουσα
  choice: vivendo como viúva
  rationale: Expressa o estado contínuo de viuvez indicado pelo particípio, sem sugerir apenas o momento em que ela ficou viúva.
- source_word: ἔτη τρία καὶ μῆνας τέσσορες
  choice: durante três anos e quatro meses
  rationale: «Durante» torna explícita, em português idiomático, a duração expressa pelo acusativo temporal grego.
