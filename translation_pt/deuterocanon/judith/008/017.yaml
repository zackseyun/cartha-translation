  yaml_path: translation/deuterocanon/judith/008/017.yaml
  text: Therefore[a], while we wait for the salvation that comes from him, let us call on him to help us, and he will hear our voice[b], if it is pleasing to him.
translation:
  language: pt
  text: Por isso, enquanto esperamos a salvação[a] que vem dele, invoquemo-lo para nos ajudar; e ele ouvirá a nossa voz[b], se assim lhe agradar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “libertação”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “ouvirá a nossa voz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διόπερ
  choice: Por isso
  rationale: Expressa de modo natural a conclusão inferencial ligada ao argumento anterior.
- source_word: ἀναμένοντες
  choice: enquanto esperamos
  rationale: Preserva o sentido contínuo e expectante do particípio e sua relação temporal com a exortação.
- source_word: σωτηρίαν
  choice: salvação
  rationale: Mantém o peso teológico da ação salvadora de Deus, sem excluir o sentido contextual de libertação diante do perigo.
- source_word: τὴν παρ’ αὐτοῦ
  choice: que vem dele
  rationale: Torna explícita, em português idiomático, a ideia de origem indicada por παρά com o genitivo.
- source_word: ἐπικαλεσώμεθα
  choice: invoquemo-lo
  rationale: Reproduz o subjuntivo exortativo na primeira pessoa do plural e conserva o sentido de recorrer a Deus em oração.
- source_word: εἰς βοήθειαν ἡμῶν
  choice: para nos ajudar
  rationale: Verbaliza a expressão de finalidade de modo claro e natural, sem alterar seu sentido.
- source_word: εἰσακούσεται
  choice: ouvirá
  rationale: Conserva a imagem bíblica de Deus ouvir a súplica, deixando implícita a nuance de acolhimento favorável própria do contexto de oração.
- source_word: τῆς φωνῆς ἡμῶν
  choice: a nossa voz
  rationale: Segue de perto a expressão grega sem intensificá-la para “clamor” nem interpretá-la como “oração”.
- source_word: ἐὰν ἦν αὐτῷ ἀρεστόν
  choice: se assim lhe agradar
  rationale: Preserva a condição e a submissão à vontade divina; o futuro do subjuntivo é a construção portuguesa natural para uma condição futura.
theological_decisions:
- issue: Sentido de σωτηρία no contexto narrativo de Judite
  choice: salvação
  alternative: libertação
  rationale: Embora a situação imediata envolva livramento coletivo e militar, “salvação” conserva a amplitude e o peso teológico do termo grego. A alternativa contextual é registrada em nota.
- issue: Condição da resposta divina em ἐὰν ἦν αὐτῷ ἀρεστόν
  choice: se assim lhe agradar
  alternative: se isso lhe for agradável
  rationale: 'A formulação mantém a tensão do texto: a exortação confiante à oração não elimina a sujeição da resposta ao que agrada a Deus.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Invoquemo-lo” mantém o tom de oração e a forma exortativa do grego; a sintaxe restante é corrente e direta.
