base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/029.yaml
  text: For your wisdom did not become evident only today; rather[a], from the beginning of your days all the people have known your understanding, because the disposition of your heart is good.
translation:
  language: pt
  text: Pois não é apenas hoje que a sua sabedoria se mostra evidente; pelo contrário, desde o princípio dos seus dias, todo o povo conhece o seu entendimento, porque é boa a disposição do seu coração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é boa a formação — ou inclinação — do seu coração”. A expressão grega é bastante concreta e se refere à conformação ou orientação interior do coração.'
    reason: Alternativa lexical para a expressão incomum τὸ πλάσμα τῆς καρδίας σου.
lexical_decisions:
- source_word: οὐκ ἐν τῇ σήμερον
  choice: não é apenas hoje
  rationale: Expressa de modo natural o contraste entre o presente e uma reputação já antiga, sem restringir a negação ao dia em si.
- source_word: ἡ σοφία σου πρόδηλός ἐστιν
  choice: a sua sabedoria se mostra evidente
  rationale: Mantém o sentido de πρόδηλος como algo manifesto ou evidente; a construção com «se mostra» comunica que essa sabedoria é reconhecível sem afirmar que só agora surgiu.
- source_word: ἀλλʼ ἀπʼ ἀρχῆς ἡμερῶν σου
  choice: pelo contrário, desde o princípio dos seus dias
  rationale: Preserva a imagem temporal do grego e torna explícito o contraste introduzido por ἀλλά.
- source_word: ἔγνω πᾶς ὁ λαὸς
  choice: todo o povo conhece
  rationale: O presente em português exprime naturalmente o conhecimento adquirido no passado e ainda vigente; «todo o povo» conserva o coletivo singular do grego.
- source_word: τὴν σύνεσίν σου
  choice: o seu entendimento
  rationale: Distingue σύνεσις de σοφία sem estreitar o sentido para uma faculdade específica como prudência ou perspicácia.
- source_word: καθότι
  choice: porque
  rationale: Introduz com clareza a razão do reconhecimento público do entendimento de Judite.
- source_word: τὸ πλάσμα τῆς καρδίας σου
  choice: a disposição do seu coração
  rationale: Comunica a formação ou inclinação interior sugerida por πλάσμα, preservando «coração» como centro bíblico do pensamento e da orientação moral.
- source_word: ἀγαθόν
  choice: boa
  rationale: Equivalente direto e não excessivamente interpretativo da avaliação moral ampla expressa por ἀγαθόν.
theological_decisions:
- issue: Expressão antropológica referente ao coração
  choice: a disposição do seu coração
  alternative: a disposição da sua mente; o seu caráter
  rationale: Conserva a linguagem bíblica do coração como centro da vida interior e moral, sem reduzi-la apenas ao intelecto nem substituí-la por uma abstração.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «a sua/seus» para evitar ambiguidade e mantém o paralelismo entre «sabedoria» e «entendimento». A nota preserva a imagem incomum de πλάσμα sem sobrecarregar o texto principal.
