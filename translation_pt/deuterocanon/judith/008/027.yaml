  yaml_path: translation/deuterocanon/judith/008/027.yaml
  text: For he did not test us by fire, as he did them, to examine their hearts; nor has he taken vengeance on us. Rather, the Lord scourges those who draw near to him for admonition.
translation:
  language: pt
  text: Pois ele não nos provou pelo fogo[a], como fez com eles, para examinar o coração deles; nem se vingou de nós. Pelo contrário, o Senhor açoita[b] os que se aproximam dele para adverti-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não nos submeteu ao fogo, como fez com eles, para pôr à prova o coração deles”. O grego conserva a imagem do fogo em sentido de provação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “disciplina” ou “castiga”. O verbo grego significa literalmente “açoita”, mantendo a severidade da imagem corretiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπύρωσεν
  choice: provou pelo fogo
  rationale: Preserva tanto a imagem concreta do fogo quanto o sentido contextual de uma provação destinada a pôr à prova.
- source_word: εἰς ἔτασμόν
  choice: para examinar
  rationale: Expressa com naturalidade a finalidade da provação e mantém o caráter avaliativo do termo grego.
- source_word: καρδίας
  choice: coração
  rationale: É a forma bíblica corrente para o centro da vida interior; o singular distributivo soa natural em português com o referente plural.
- source_word: ἐξεδίκησεν
  choice: se vingou de
  rationale: Mantém a força de retribuição ou vingança presente no verbo e o contraste com a correção da oração seguinte.
- source_word: νουθέτησιν
  choice: para corrigi-los
  rationale: Comunica em português atual a instrução corretiva ou admoestação pretendida, sem confundi-la com vingança.
- source_word: μαστιγοῖ
  choice: açoita
  rationale: Conserva a imagem severa e concreta do açoite, em vez de suavizá-la como disciplina genérica.
- source_word: Κύριος
  choice: o Senhor
  rationale: Forma portuguesa bíblica consagrada e natural neste enunciado teológico geral.
- source_word: τοὺς ἐγγίζοντας αὐτῷ
  choice: os que se aproximam dele
  rationale: Reproduz a ideia de aproximação a Deus sem acrescentar uma interpretação denominacional específica.
theological_decisions:
- issue: Manter ou suavizar a imagem da correção divina
  choice: o Senhor açoita os que se aproximam dele
  alternative: o Senhor disciplina os que se aproximam dele
  rationale: O verbo grego designa literalmente o ato de açoitar. A tradução conserva a tensão entre a severidade da ação e sua finalidade corretiva.
- issue: Relação entre vingança e correção
  choice: nem se vingou de nós. Pelo contrário... para corrigi-los
  alternative: nem nos puniu... antes, disciplina... para adverti-los
  rationale: A formulação preserva o contraste explícito entre retribuição vingativa e sofrimento com finalidade corretiva, sem formular uma doutrina além do texto.
- issue: Referente implícito da finalidade expressa por εἰς νουθέτησιν
  choice: para corrigi-los
  alternative: para correção
  rationale: O pronome retoma naturalmente “os que se aproximam dele”. Essa explicitação é idiomática em português, embora o grego apresente a finalidade por meio de um substantivo abstrato.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das orações segue de perto o grego, enquanto “para corrigi-los” torna idiomática a finalidade corretiva. As imagens fortes de fogo e açoite foram preservadas, com alternativas registradas em notas.
