base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/014.yaml
  text: For you will not find the depths of a man's heart[a], nor will you discern the words of his mind. So how will you search out God, who made all these things, and know his mind, and understand his thought? By no means, brothers[b], provoke the Lord our God.
translation:
  language: pt
  text: Pois vocês não encontrarão a profundidade do coração de um homem[a], nem discernirão as palavras de sua mente. Como, então, poderão sondar Deus, que fez todas estas coisas, conhecer a mente dele e compreender o seu pensamento? De modo nenhum, irmãos, não provoquem o Senhor, nosso Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a profundidade de um coração humano”. O grego usa o masculino singular, “de um homem”, de modo representativo para os seres humanos.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάθος καρδίας ἀνθρώπου
  choice: a profundidade do coração de um homem
  rationale: Mantém o singular e a forma masculina genérica do grego, além da imagem da interioridade humana como uma profundidade inacessível; a nota esclarece seu alcance representativo.
- source_word: οὐχ εὑρήσετε
  choice: vocês não encontrarão
  rationale: Reproduz diretamente o futuro indicativo e torna explícito o sujeito plural, de modo natural no português moderno.
- source_word: λόγους τῆς διανοίας αὐτοῦ
  choice: as palavras de sua mente
  rationale: Preserva a distinção entre λόγους, literalmente ‘palavras’, e διάνοια, ‘mente’ ou ‘entendimento’, sem reduzir ambos simplesmente a ‘pensamentos’.
- source_word: οὐ διαλήμψεσθε
  choice: nem discernirão
  rationale: Expressa a ideia de perceber ou distinguir com clareza e mantém o paralelismo com ‘não encontrarão’.
- source_word: ἐρευνήσετε
  choice: poderão sondar
  rationale: ‘Sondar’ comunica uma busca profunda e investigativa, apropriada à pergunta retórica sobre a impossibilidade humana de perscrutar Deus.
- source_word: ὃς ἐποίησεν τὰ πάντα ταῦτα
  choice: que fez todas estas coisas
  rationale: Segue de perto a oração relativa grega, conservando tanto πάντα quanto ταῦτα e evitando substituir ‘fez’ por um termo teologicamente mais específico.
- source_word: τὸν νοῦν αὐτοῦ ἐπιγνώσεσθε
  choice: conhecer a mente dele
  rationale: Mantém νοῦς como ‘mente’ e traduz ἐπιγινώσκω pelo conhecimento efetivo, sem especificá-lo como intenção ou vontade.
- source_word: τὸν λογισμὸν αὐτοῦ κατανοήσετε
  choice: compreender o seu pensamento
  rationale: ‘Pensamento’ preserva a amplitude de λογισμός, que também pode indicar raciocínio ou desígnio, sem resolver a expressão como ‘plano’.
- source_word: μηδαμῶς
  choice: De modo nenhum
  rationale: Conserva a resposta enfática que rejeita a possibilidade formulada nas perguntas anteriores.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Retém a forma masculina plural do vocativo grego; a nota registra que, no uso coletivo, ela pode incluir mulheres.
- source_word: μὴ παροργίζετε
  choice: Não provoquem
  rationale: Preserva a força causativa de παροργίζω, isto é, provocar à ira, e formula a proibição de maneira natural em português.
- source_word: κύριον θεὸν ἡμῶν
  choice: o Senhor, nosso Deus
  rationale: A aposição com vírgula é idiomática em português e mantém os dois títulos e a relação comunitária expressa por ‘nosso’.
theological_decisions:
- issue: Masculino genérico em ἀνθρώπου
  choice: Manter ‘de um homem’ no texto e explicar seu sentido representativo em nota.
  alternative: Traduzir diretamente por ‘do ser humano’ ou ‘de uma pessoa’.
  rationale: A forma grega é masculina singular, mas a afirmação trata da limitação humana em geral. O texto conserva a forma, e a nota evita que seja entendida como restrita aos homens.
- issue: Alcance do vocativo ἀδελφοί
  choice: Traduzir por ‘irmãos’, com nota sobre possível referência inclusiva ao grupo.
  alternative: Traduzir por ‘irmãos e irmãs’.
  rationale: A escolha preserva a forma lexical do grego sem negar que o vocativo masculino plural possa dirigir-se coletivamente a homens e mulheres.
- issue: Sentido de λογισμός aplicado a Deus
  choice: Traduzir por ‘pensamento’.
  alternative: Traduzir por ‘plano’, ‘propósito’ ou ‘raciocínio’.
  rationale: ‘Pensamento’ conserva a amplitude e a tensão do termo, sem impor uma interpretação específica sobre decreto, propósito ou processo racional divino.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com ‘vocês’ para o plural. A formulação conserva as três expressões distintas ligadas à interioridade — coração, mente e pensamento — e mantém a sequência retórica do grego. ‘Sondar’ dá naturalidade à ideia de investigação profunda, enquanto ‘De modo nenhum’ preserva a ênfase solene.
