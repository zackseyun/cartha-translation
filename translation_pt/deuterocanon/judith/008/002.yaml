  yaml_path: translation/deuterocanon/judith/008/002.yaml
  text: And her husband Manasseh was from her own tribe and her own family line[a]; and he died in the days of the barley harvest.
translation:
  language: pt
  text: E seu marido, Manassés, era da mesma tribo e da mesma linhagem familiar que ela[a]; e morreu no tempo da colheita da cevada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da mesma tribo e da mesma casa ancestral que ela”. O grego distingue φυλή (“tribo”) de πατριά, um grupo de parentesco mais restrito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνήρ
  choice: marido
  rationale: Com o possessivo αὐτῆς, o sentido relacional “marido” é o natural no contexto.
- source_word: Μανασσης
  choice: Manassés
  rationale: Emprega-se a forma tradicional e amplamente reconhecida do nome em português.
- source_word: φυλή
  choice: tribo
  rationale: No contexto genealógico judaico, designa uma divisão tribal de Israel.
- source_word: πατριά
  choice: linhagem familiar
  rationale: Expressa um grupo de parentesco baseado na ascendência, mais restrito que a tribo, em linguagem portuguesa clara e atual.
- source_word: ἐν ἡμέραις
  choice: no tempo de
  rationale: Transmite naturalmente o valor temporal da expressão grega, sem reproduzir de modo rígido o idiomatismo “nos dias de”.
- source_word: θερισμοῦ κριθῶν
  choice: colheita da cevada
  rationale: Reproduz de modo idiomático a construção genitiva que identifica o cereal colhido.
