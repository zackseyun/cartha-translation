base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/022.yaml
  text: and the slaughter of our brothers[a], and the captivity of the land, and the desolation of our inheritance, will return upon our own heads among the nations where we will serve as slaves there[b]; and we will become a stumbling block and a reproach before those who possess us.
translation:
  language: pt
  text: e o massacre de nossos irmãos, o cativeiro da terra e a desolação de nossa herança, ele os fará recair sobre a nossa cabeça[a], entre as nações onde servirmos como escravos[b]; e seremos motivo de tropeço e objeto de desprezo diante daqueles que nos possuem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “isso recairá sobre a nossa cabeça”. O verbo grego está no singular, mas o sujeito não é declarado expressamente nesta oração.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “onde servirmos”. O verbo grego pode significar simplesmente “servir”, mas, neste contexto de cativeiro, provavelmente indica serviço forçado ou escravidão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φόνον
  choice: massacre
  rationale: Expressa morte violenta em contexto de guerra sem impor a qualificação jurídica específica de “assassinato”.
- source_word: ἀδελφῶν
  choice: irmãos
  rationale: Preserva o masculino plural do grego e, no contexto, pode abranger os compatriotas israelitas.
- source_word: αἰχμαλωσίαν τῆς γῆς
  choice: cativeiro da terra
  rationale: Mantém a formulação incomum do grego e a ideia de a terra e sua população caírem sob domínio inimigo, sem reduzi-la apenas a exílio.
- source_word: ἐρήμωσιν τῆς κληρονομίας ἡμῶν
  choice: desolação de nossa herança
  rationale: Conserva tanto a devastação quanto a ressonância da terra recebida como herança.
- source_word: ἐπιστρέψει εἰς κεφαλὴν ἡμῶν
  choice: ele os fará recair sobre a nossa cabeça
  rationale: Reproduz o idioma de consequências que recaem sobre alguém; “ele” reflete o verbo singular com sujeito implícito, e a nota preserva a alternativa impessoal.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: entre as nações
  rationale: É natural no cenário de cativeiro e evita decidir entre os sentidos possíveis de “nações” e “gentios”.
- source_word: οὗ ἐὰν δουλεύσωμεν ἐκεῖ
  choice: onde servirmos como escravos
  rationale: O subjuntivo com ἐάν comunica eventualidade ou indefinição; o contexto de cativeiro torna explícito o caráter servil de δουλεύω. O advérbio ἐκεῖ é absorvido em “onde” para evitar redundância artificial em português.
- source_word: πρόσκομμα
  choice: motivo de tropeço
  rationale: Preserva a metáfora de algo que faz tropeçar em uma construção corrente e inteligível.
- source_word: ὄνειδος
  choice: objeto de vergonha
  rationale: Comunica que o povo se tornará alvo de desonra e desprezo, não apenas que sentirá vergonha.
- source_word: τῶν κτωμένων ἡμᾶς
  choice: daqueles que nos possuem
  rationale: Mantém de perto o sentido de adquirir ou possuir e a imagem de domínio associada ao cativeiro.
theological_decisions:
- issue: Sujeito implícito de ἐπιστρέψει
  choice: Empregar o pronome singular “ele” sem nomear seu referente.
  alternative: 'Traduzir impessoalmente: “isso recairá sobre a nossa cabeça”.'
  rationale: O verbo grego está no singular, mas o sujeito não é expresso. O pronome conserva a provável agência pessoal, possivelmente divina no contexto, sem inserir explicitamente “Deus”; a nota registra a leitura impessoal.
translation_notes:
  register: Português atual, solene e acessível, com boa legibilidade brasileira. A ordem inicial conserva a progressão enfática dos três desastres no grego. “Sobre a nossa cabeça” mantém o idioma bíblico no singular coletivo; “servirmos” preserva a eventualidade de οὗ ἐάν sem produzir uma construção artificial.
