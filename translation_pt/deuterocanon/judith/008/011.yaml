base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/011.yaml
  text: And they came to her[a], and she said to them, “Listen to me, rulers of those who dwell in Bethulia, for your word that you spoke against the people on this day is not right, and you have set up the oath that you spoke between God and yourselves, and said that you would hand over the city to our enemies if within these days the Lord does not turn back to help you.”
translation:
  language: pt
  text: 'E eles vieram até ela[a], e ela lhes disse: “Ouçam-me, governantes dos que habitam em Betúlia, pois não é correta a palavra que vocês disseram hoje contra o povo. Vocês estabeleceram o juramento que pronunciaram entre Deus e vocês e disseram que entregariam a cidade aos nossos inimigos se, dentro desses dias, o Senhor não voltar para ajudá-los.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “se não nelas”; o pronome provavelmente se refere aos dias previamente determinados no juramento.
    reason: A expressão grega contém um pronome feminino plural sem substantivo explícito; o contexto indica um prazo em dias.
lexical_decisions:
- source_word: ἄρχοντες
  choice: governantes
  rationale: Expressa aqueles que exercem autoridade sobre a população, sem a conotação aristocrática de “príncipes”.
- source_word: τῶν κατοικούντων ἐν Βαιτυλουά
  choice: dos que habitam em Betúlia
  rationale: Preserva a força verbal do particípio κατοικούντων e soa natural em português.
- source_word: οὐκ εὐθὺς ὁ λόγος ὑμῶν
  choice: não é correta a palavra que vocês disseram
  rationale: εὐθύς tem aqui sentido ético ou prático de “correto”; “a palavra de vocês” é integrada à oração relativa de modo idiomático, sem perder o possessivo.
- source_word: ἐναντίον τοῦ λαοῦ
  choice: contra o povo
  rationale: Mantém a leitura adversativa adequada à repreensão de Judite, embora a expressão também possa ter sentido espacial de “diante do povo”.
- source_word: ἐστήσατε τὸν ὅρκον
  choice: estabeleceram o juramento
  rationale: Preserva a ideia de instituir ou firmar formalmente o juramento sem recorrer ao pouco natural “levantaram”.
- source_word: ἀνὰ μέσον τοῦ θεοῦ καὶ ὑμῶν
  choice: entre Deus e vocês
  rationale: Reproduz a relação solene entre as partes do juramento; o português não exige uma forma reflexiva adicional.
- source_word: ἐκδώσειν τὴν πόλιν
  choice: entregariam a cidade
  rationale: Expressa claramente a rendição da cidade aos inimigos.
- source_word: ἐὰν μὴ ἐν αὐταῖς
  choice: se, dentro desses dias
  rationale: Explicita o referente temporal feminino plural implícito, recuperável do prazo mencionado no contexto anterior; a nota registra a forma literal.
- source_word: ἐπιστρέψῃ ὁ κύριος βοήθειαν ὑμῖν
  choice: o Senhor não voltasse para ajudá-los
  rationale: Conserva a noção de retorno de ἐπιστρέφω e verte a construção grega comprimida em português inteligível.
theological_decisions:
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Soberano
  rationale: Neste contexto escriturístico judaico, κύριος designa Deus; “Senhor” preserva seu peso religioso e é a forma portuguesa consagrada.
- issue: Sentido de ἐναντίον τοῦ λαοῦ
  choice: contra o povo
  alternative: diante do povo
  rationale: O contexto favorece uma decisão prejudicial dirigida contra o povo, mas a alternativa espacial permanece linguisticamente possível e não deve ser ocultada.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A fala direta conserva o tom solene de repreensão sem literalismos pouco naturais.
