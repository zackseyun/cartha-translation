translation:
  language: pt
  text: Naqueles dias, Judite, filha de Merari, filho de Ox, filho de José, filho de Oziel, filho de Elqueia, filho de Eliú, filho de Quelquias, filho de Eleabe, filho de Natanael, filho de Salamiel, filho de Sarasadai, filho de Israel, ouviu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vários nomes da genealogia de Judite aparecem aqui em formas gregas; possíveis equivalentes mais conhecidos da tradição hebraica incluem Oziel/Uziel e Sarasadai/Zurisadai. O texto principal segue a testemunha grega, sem reconstruir sistematicamente as formas hebraicas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: Naqueles dias
  rationale: Preserva a expressão temporal e a cadência narrativa do grego em português natural.
- source_word: ἤκουσεν
  choice: ouviu
  rationale: É a correspondência mais direta do verbo grego. Não se acrescenta um objeto nem a expressão “falar de”, pois eles não estão presentes neste versículo.
- source_word: θυγάτηρ
  choice: filha
  rationale: Mantém a designação genealógica explícita.
- source_word: υἱοῦ
  choice: filho de
  rationale: Reproduz a fórmula genealógica repetida no grego, sem substituí-la por “descendente de”.
- source_word: Ἰουδεὶθ
  choice: Judite
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: Μεραρὶ / Ὢξ / Ἰωσὴφ / Ὀζιὴλ / Ἐλκεία / Ἠλειοὺ / Χελκείου / Ἐλεὰβ / Ναθαναὴλ / Σαλαμιὴλ / Σαρασαδαὶ / Ἰσραήλ
  choice: Merari / Ox / José / Oziel / Elqueia / Eliú / Quelquias / Eleabe / Natanael / Salamiel / Sarasadai / Israel
  rationale: Os nomes seguem, em geral, as formas gregas da testemunha de origem, adaptadas à ortografia e às formas bíblicas correntes em português quando estas são bem estabelecidas. Não se reconstrói sistematicamente uma forma hebraica hipotética.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível. A genealogia foi colocada como aposto entre o sujeito e o verbo, tornando a longa frase mais legível sem suprir o conteúdo daquilo que Judite ouviu. A repetição de “filho de” conserva deliberadamente a estrutura formal da linhagem grega.
