  yaml_path: translation/deuterocanon/judith/008/033.yaml
  text: You stand at the gate tonight, and I will go out with my maidservant; and within the days after which you said you would hand over the city to our enemies, the Lord will visit Israel by my hand.
translation:
  language: pt
  text: Permaneçam junto ao portão esta noite, e eu sairei com a minha serva; e, dentro dos dias, depois dos quais vocês disseram que entregariam a cidade aos nossos inimigos, o Senhor visitará Israel por minha mão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στήσεσθε ἐπὶ τῆς πύλης
  choice: Fiquem junto ao portão
  rationale: O futuro grego tem força diretiva no contexto. «Junto ao portão» expressa naturalmente a posição indicada sem sugerir que estejam literalmente sobre ele.
- source_word: ἅβρας
  choice: serva
  rationale: Designa uma criada ou serva pessoal; «serva» é claro, digno e adequado ao contexto.
- source_word: ἐν ταῖς ἡμέραις μεθʼ ἃς
  choice: Dentro do prazo após o qual
  rationale: Preserva a referência ao período de dias e ao limite temporal fixado pelos líderes, em português compreensível.
- source_word: ἐπισκέψεται
  choice: visitará
  rationale: Mantém o verbo teologicamente carregado, que pode indicar a intervenção atenta de Deus sem explicitar antecipadamente seu modo ou resultado.
- source_word: ἐν χειρί μου
  choice: por minha mão
  rationale: Conserva o idioma instrumental da fonte e sua ênfase na atuação de Judite como instrumento.
theological_decisions:
- issue: Sentido da visita do Senhor a Israel
  choice: o Senhor visitará Israel
  alternative: o Senhor socorrerá Israel
  rationale: «Visitará» preserva a amplitude e a tensão de ἐπισκέπτομαι, evitando restringir o ato divino a uma única modalidade de intervenção.
- issue: Instrumentalidade de Judite
  choice: por minha mão
  alternative: por meu intermédio
  rationale: A formulação mantém de perto a imagem bíblica da «mão» e não enfraquece a afirmação de que a ação divina ocorrerá mediante Judite.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, com formas também amplamente inteligíveis no espaço lusófono. O plural «vocês» torna explícito o destinatário coletivo de ὑμεῖς. A construção temporal foi levemente regularizada para clareza, sem eliminar o limite de dias estabelecido pelos líderes.
