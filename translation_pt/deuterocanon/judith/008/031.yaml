base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/031.yaml
  text: And now pray for us[a], because you are a devout woman, and the Lord will send rain to fill our cisterns, and we will not perish any longer.
translation:
  language: pt
  text: E agora, ore por nós, pois você é uma mulher devota, e o Senhor enviará chuva para encher nossas cisternas, e não passaremos mais necessidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “não ficaremos mais em falta” ou “não se esgotarão mais os nossos recursos”. Literalmente, o grego diz: “não falharemos mais”.'
    reason: A forma de ἐκλείπω admite os sentidos de falhar, faltar ou esgotar-se; o contexto aponta para o fim da privação causada pela falta de água.
lexical_decisions:
- source_word: δεήθητι περὶ ἡμῶν
  choice: ore por nós
  rationale: O imperativo de δέομαι, seguido de περί, expressa aqui um pedido de intercessão. “Ore por nós” é natural em português e preserva claramente o sentido religioso.
- source_word: γυνὴ εὐσεβὴς
  choice: uma mulher devota
  rationale: εὐσεβής descreve reverência e dedicação a Deus. “Devota” é corrente, digna e evita tanto uma formulação arcaica quanto uma explicitação maior do que a do grego.
- source_word: ἀποστελεῖ Κύριος τὸν ὑετόν
  choice: o Senhor enviará chuva
  rationale: Mantém o futuro simples de ἀποστέλλω e traduz Κύριος pela forma bíblica usual “o Senhor”. Em português, “enviará chuva” soa mais natural do que conservar o artigo grego.
- source_word: εἰς πλήρωσιν τῶν λάκκων ἡμῶν
  choice: para encher nossas cisternas
  rationale: A expressão com εἰς indica finalidade ou resultado. No contexto de seca e armazenamento de água, λάκκοι são adequadamente entendidos como cisternas.
- source_word: οὐκ ἐκλείψομεν ἔτι
  choice: não passaremos mais necessidade
  rationale: ἐκλείπω pode indicar falhar, esgotar-se ou ficar em falta. No contexto da escassez de água, “não passaremos mais necessidade” comunica o sentido provável sem restringi-lo exclusivamente à água; a amplitude lexical é registrada em nota.
theological_decisions:
- issue: Tradução de Κύριος
  choice: o Senhor
  alternative: Senhor
  rationale: A forma com artigo corresponde ao grego e preserva o modo judaico-escriturístico de referência à soberania divina sem introduzir o tetragrama onde o texto grego traz Κύριος.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ambiguidade da oração final é preservada por meio da nota, sem tornar o texto principal excessivamente literal.
