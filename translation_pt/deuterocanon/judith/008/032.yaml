  text: And Judith said to them[a], “Listen to me[c][b], and I will do a deed that will reach to generation after generation among the sons of our people.”
translation:
  language: pt
  text: 'Judite lhes disse: “Escutem-me[a]. Realizarei um feito que alcançará, geração após geração[b], os filhos do nosso povo[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ouçam-me”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “às gerações de gerações”, expressão que indica sucessivas gerações.
    reason: lexical_alternative
  - marker: c
    text: '“Filhos” pode ter aqui sentido coletivo: “descendentes do nosso povo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσατέ μου
  choice: Escutem-me
  rationale: O imperativo de ἀκούω pede atenção ao que será dito. “Escutem-me” é natural em português atual e mantém esse sentido melhor que o mais formal “ouçam-me”.
- source_word: ποιήσω πρᾶγμα
  choice: Realizarei um feito
  rationale: A combinação de ποιέω com πρᾶγμα anuncia uma ação concreta. “Realizarei um feito” preserva a ideia de ação intencional sem a vagueza de “farei uma coisa”.
- source_word: ἀφίξεται
  choice: alcançará
  rationale: O futuro de ἀφικνέομαι significa chegar ou alcançar. Neste contexto, “alcançará” expressa com naturalidade que o feito terá repercussão nas gerações seguintes, sem definir em que consistirá essa repercussão.
- source_word: εἰς γενεὰς γενεῶν
  choice: geração após geração
  rationale: A expressão repetitiva indica sucessivas gerações. A formulação idiomática portuguesa conserva essa repetição e evita o pouco natural “às gerações das gerações”.
- source_word: υἱοῖς τοῦ γένους ἡμῶν
  choice: os filhos do nosso povo
  rationale: “Filhos” preserva o masculino plural explícito de υἱοῖς, enquanto “nosso povo” comunica o sentido coletivo de γένος sem as conotações modernas potencialmente enganosas de “raça”.
theological_decisions:
- issue: Sentido coletivo da expressão masculina υἱοῖς τοῦ γένους ἡμῶν
  choice: os filhos do nosso povo
  alternative: os descendentes do nosso povo
  rationale: O grego emprega literalmente “filhos”, embora a expressão possa abranger coletivamente os descendentes do povo. O texto principal mantém a forma masculina da fonte, e a nota registra o possível alcance coletivo.
translation_notes:
  register: Português moderno, claro e digno, com construção direta no discurso de Judite. “Realizarei um feito” mantém certa solenidade sem soar arcaico; “geração após geração” comunica naturalmente o idioma grego.
