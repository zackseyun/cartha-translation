base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/025.yaml
  text: Besides all this[a], let us give thanks to the Lord our God[b], who tests us just as he also tested our fathers.
translation:
  language: pt
  text: Além de tudo isso, demos graças ao Senhor, nosso Deus, que nos põe à prova, assim como também pôs à prova nossos pais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nossos antepassados”. Grego: “nossos pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὰ ταῦτα πάντα
  choice: Apesar de tudo isso
  rationale: No contexto, a expressão tem força concessiva e introduz a resposta de gratidão em meio às provações; esta formulação é natural em português e permanece próxima da construção grega.
- source_word: εὐχαριστήσωμεν
  choice: demos graças
  rationale: O subjuntivo exortativo na primeira pessoa do plural é bem expresso pela forma hortativa portuguesa “demos graças”.
- source_word: Κυρίῳ τῷ θεῷ ἡμῶν
  choice: ao Senhor, nosso Deus
  rationale: Preserva integralmente o título divino e a relação comunitária expressa pelo possessivo.
- source_word: πειράζει
  choice: nos põe à prova
  rationale: πειράζω pode significar provar, testar ou tentar. Com Deus como sujeito neste contexto, “pôr à prova” comunica a ideia de prova sem introduzir necessariamente a noção de indução ao mal; o presente é mantido.
- source_word: καθὰ καὶ
  choice: assim como também
  rationale: Conserva tanto a comparação quanto a força aditiva de καί.
- source_word: τοὺς πατέρας ἡμῶν
  choice: os nossos pais
  rationale: Reproduz de modo formal o termo masculino πατέρας; neste uso, ele se refere às gerações anteriores de Israel, esclarecidas em nota.
theological_decisions:
- issue: Sentido de πειράζει tendo Deus como sujeito
  choice: põe à prova
  alternative: tenta
  rationale: A exortação interpreta as dificuldades presentes à luz do trato de Deus com as gerações anteriores. “Põe à prova” preserva a tensão da prova divina sem atribuir explicitamente a Deus a indução moral ao mal.
- issue: Alcance de τοὺς πατέρας ἡμῶν
  choice: os nossos pais
  alternative: os nossos antepassados
  rationale: 'O texto grego emprega literalmente o termo masculino “pais”, embora o referente seja mais amplo: as gerações anteriores de Israel. A tradução formal fica no texto, e a alternativa idiomática aparece em nota.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a exortação coletiva e a ambiguidade contextual relevante de πειράζω.
