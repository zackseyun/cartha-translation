  yaml_path: translation/deuterocanon/judith/008/013.yaml
  text: And now you are testing the Lord Almighty[b][a], and you will never understand anything.
translation:
  language: pt
  text: E agora vocês sondam o Senhor Todo-Poderoso[a] e jamais compreenderão coisa alguma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estão pondo à prova” ou “estão examinando” o Senhor Todo-Poderoso.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “até a era”; no contexto, a expressão significa “jamais” ou “para sempre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξετάζετε
  choice: estão sondando
  rationale: O verbo indica examinar, investigar ou pôr à prova. “Sondando” preserva a ideia de tentar perscrutar Deus e se ajusta à repreensão, sem restringir o sentido à tentação ou provocação.
- source_word: κύριον Παντοκράτορα
  choice: o Senhor Todo-Poderoso
  rationale: “Senhor” traduz naturalmente κύριος como título divino, e “Todo-Poderoso” é a forma corrente e acessível para Παντοκράτωρ.
- source_word: οὐθὲν
  choice: coisa alguma
  rationale: Na construção negativa em português, “jamais ... coisa alguma” expressa de modo natural e enfático o grego οὐθὲν.
- source_word: ἐπιγνώσεσθε
  choice: chegarão a compreender
  rationale: O futuro de ἐπιγινώσκω pode indicar vir a conhecer, reconhecer ou compreender. Aqui, “chegarão a compreender” transmite tanto o aspecto resultativo quanto a incapacidade de alcançar entendimento.
- source_word: ἕως τοῦ αἰῶνος
  choice: jamais
  rationale: A expressão idiomática, literalmente “até a era”, comunica duração indefinida ou permanente neste contexto negativo; “jamais” é idiomático e preserva sua força.
theological_decisions:
- issue: Sentido da investigação humana de Deus em ἐξετάζετε
  choice: estão sondando o Senhor Todo-Poderoso
  alternative: estão pondo à prova o Senhor Todo-Poderoso; estão examinando o Senhor Todo-Poderoso
  rationale: “Sondando” mantém a tensão entre escrutínio intelectual e prova presunçosa, sem decidir que o texto se refere exclusivamente a tentar Deus.
- issue: Título divino κύριος
  choice: Senhor
  alternative: Soberano
  rationale: No sintagma κύριον Παντοκράτορα, κύριος funciona como título divino; “Senhor” é a equivalência tradicional, natural e não denominacional.
- issue: Alcance de ἕως τοῦ αἰῶνος
  choice: jamais
  alternative: para sempre; até a era
  rationale: Em uma oração negativa, a expressão afirma que eles nunca alcançarão tal compreensão. A tradução idiomática evita sugerir, sem base, uma era limitada, enquanto a nota registra a forma literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento plural por “vocês”. “Sondando” conserva a ambiguidade relevante do verbo grego, e “jamais chegarão a compreender coisa alguma” reproduz naturalmente a negação enfática e duradoura.
