  yaml_path: translation/deuterocanon/judith/008/034.yaml
  text: But you must not investigate my action, for I will not tell you until what I am doing has been completed.
translation:
  language: pt
  text: Mas vocês não devem investigar a minha ação, pois não lhes direi nada até que aquilo que estou fazendo esteja concluído.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξερευνήσετε
  choice: devem investigar
  rationale: O verbo indica uma busca ou averiguação cuidadosa. A construção com «não devem» expressa naturalmente, em português, a proibição dirigida ao grupo.
- source_word: τὴν πρᾶξίν μου
  choice: a minha ação
  rationale: Preserva o substantivo grego e distingue esta expressão da oração verbal posterior, sem transformar a ação de Judite explicitamente em «plano».
- source_word: οὐ γὰρ ἐρῶ ὑμῖν
  choice: pois não lhes direi nada
  rationale: «Direi» corresponde diretamente ao futuro grego; «nada» completa de modo idiomático a construção portuguesa sem especificar qual informação Judite está retendo.
- source_word: ἕως τοῦ τελεσθῆναι
  choice: até que ... esteja concluído
  rationale: Mantém o limite temporal e o sentido passivo de τελεσθῆναι, indicando que o silêncio continuará até a conclusão da ação.
- source_word: ἃ ἐγὼ ποιῶ
  choice: aquilo que estou fazendo
  rationale: A forma progressiva comunica o caráter presente e ainda em curso das ações de Judite; «aquilo» funciona naturalmente como sujeito singular coletivo de «esteja concluído».
