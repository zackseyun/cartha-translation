  text: And turning away from the tent[a], they went to their assigned posts.
translation:
  language: pt
  text: E, afastando-se da tenda, foram para seus postos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas posições” ou “seus lugares designados”. O termo grego também pode indicar, de modo mais amplo, uma disposição ordenada ou uma posição atribuída.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστρέψαντες
  choice: afastando-se
  rationale: O particípio aoristo indica uma ação anterior ou concomitante à ida. “Afastando-se” preserva o movimento para longe da tenda sem acrescentar a ideia mais forte de uma partida definitiva.
- source_word: σκηνῆς
  choice: tenda
  rationale: σκηνή significa normalmente “tenda”. Neste contexto narrativo, não se refere ao tabernáculo cultual.
- source_word: ἐπορεύθησαν
  choice: foram
  rationale: Forma narrativa comum de movimento; “foram” é natural, clara e adequada ao registro do texto.
- source_word: διατάξεις
  choice: postos que lhes haviam sido designados
  rationale: 'διάταξις pode indicar disposição ordenada, posição ou lugar atribuído. Com ἐπί e acusativo, o contexto favorece o destino para o qual eles voltaram: seus postos designados.'
- source_word: αὐτῶν
  choice: lhes
  rationale: O pronome possessivo refere-se aos próprios sujeitos; a construção “lhes haviam sido designados” expressa essa relação com clareza em português.
