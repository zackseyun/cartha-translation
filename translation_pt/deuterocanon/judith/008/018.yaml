base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/018.yaml
  text: For in our generations no tribe or clan or people or city has arisen from among us that worships gods made by hands[a], as happened in former days; nor is there any even to this day.
translation:
  language: pt
  text: Pois, em nossas gerações, não surgiu entre nós — nem há hoje — nenhuma tribo, clã, povo ou cidade que adore deuses feitos por mãos humanas[a], como aconteceu nos tempos passados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ídolos feitos por mãos humanas”. O grego diz literalmente “deuses feitos por mãos”, uma expressão polêmica para ídolos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστη
  choice: surgiu
  rationale: No contexto, o aoristo de ἀνίστημι indica o aparecimento ou surgimento de um grupo dentro de Israel, não ressurreição ou o ato físico de levantar-se.
- source_word: ἐν ταῖς γενεαῖς ἡμῶν
  choice: em nossas gerações
  rationale: Mantém a referência direta às gerações sucessivas do povo e o contraste com os tempos anteriores.
- source_word: φυλὴ οὔτε πατριὰ οὔτε δῆμος οὔτε πόλις
  choice: nenhuma tribo, clã, povo ou cidade
  rationale: Preserva a sequência de unidades sociais do grego. 'Clã' expressa a subdivisão de parentesco indicada por πατριά, e 'povo' evita especificar excessivamente o sentido de δῆμος.
- source_word: ἐξ ἡμῶν
  choice: entre nós
  rationale: Expressa com naturalidade a origem interna no próprio povo da oradora.
- source_word: οἱ προσκυνοῦσι
  choice: que adore
  rationale: Embora o particípio grego esteja no plural e apresente certa irregularidade de concordância com a lista, em português a oração relativa concorda naturalmente com a série introduzida por 'nenhuma'. O contexto religioso favorece 'adorar'.
- source_word: θεοῖς χειροποιήτοις
  choice: deuses feitos por mãos humanas
  rationale: Preserva a expressão polêmica e concreta do grego, tornando explícito em português que se trata de mãos humanas sem substituir no texto principal 'deuses' por 'ídolos'.
- source_word: καθάπερ ἐγένετο ἐν ταῖς πρότερον ἡμέραις
  choice: como aconteceu nos tempos passados
  rationale: Comunica claramente o contraste histórico com os períodos anteriores de idolatria.
- source_word: οὐδὲ ἔστιν ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: nem existe tal coisa até o dia de hoje
  rationale: Conserva o reforço presente da frase grega. 'Tal coisa' retoma sem ambiguidade a ocorrência de um grupo idólatra e evita repetir toda a enumeração.
theological_decisions:
- issue: Expressão anti-idolatria θεοῖς χειροποιήτοις
  choice: deuses feitos por mãos humanas
  alternative: ídolos feitos por mãos humanas
  rationale: A opção principal conserva a formulação literal e a ironia teológica do grego; a alternativa interpretativa é registrada em nota sem substituir o termo 'deuses' no texto.
- issue: Alcance da declaração sobre a fidelidade presente de Israel
  choice: nem existe tal coisa até o dia de hoje
  alternative: nem há nenhum até hoje
  rationale: A tradução preserva a afirmação enfática do texto sem ampliar seu alcance além dos grupos enumerados nem tentar harmonizá-la com outros relatos históricos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura mantém a enumeração retórica e o contraste entre as gerações presentes e os tempos passados.
