  verdict: revise
  source_fidelity: 'A enumeração e o contraste com os tempos anteriores são bem preservados. Contudo, «nem existe tal coisa» não representa com precisão o referente expresso pelo grego: οὐδὲ ἔστιν retoma a existência, no presente, de uma tribo, clã, povo ou cidade dentre eles que preste esse culto, não uma «coisa» abstrata.'
  naturalness: O texto é em geral claro e de registro apropriado, mas «nem existe tal coisa até o dia de hoje» soa pouco idiomático e impreciso em português. A repetição coordenada da enumeração, com «nem há hoje», é mais natural e mantém o reforço temporal grego.
  terminology: «Tribo, clã, povo ou cidade» e «adore» são escolhas adequadas. «Deuses feitos por mãos humanas» comunica bem a expressão polêmica χειροποίητοι; a nota preserva corretamente a formulação mais literal e a alternativa «ídolos».
  issues:
