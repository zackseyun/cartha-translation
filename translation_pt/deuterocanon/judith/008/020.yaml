  yaml_path: translation/deuterocanon/judith/008/020.yaml
  text: But we have acknowledged no other god except him[a]; therefore we hope that he will not disregard us[c][b], nor our people.
translation:
  language: pt
  text: Nós, porém, não reconhecemos nenhum outro deus além dele[a]. Por isso, esperamos que ele não nos despreze[b], nem ninguém da nossa linhagem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não conhecemos nenhum outro deus além dele” ou “não admitimos nenhum outro deus além dele”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não nos ignore” ou “não nos desconsidere”.'
    reason: lexical_alternative
  - marker: c
    text: O grego γένος pode indicar linhagem, descendência, estirpe ou povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωμεν
  choice: reconhecemos
  rationale: O aoristo de ἐπιγινώσκω pode indicar conhecer, reconhecer ou admitir. Neste contexto de fidelidade exclusiva a Deus, “reconhecemos” preserva tanto o sentido cognitivo quanto o confessional, sem substituir o verbo por “adoramos”.
- source_word: ἕτερον θεὸν ... πλὴν αὐτοῦ
  choice: nenhum outro deus além dele
  rationale: A formulação portuguesa expressa naturalmente a exclusão de qualquer outra divindade e mantém a força de exceção de πλήν.
- source_word: ὅθεν
  choice: Por isso
  rationale: Introduz a conclusão ou fundamento da esperança que decorre da afirmação anterior; “Por isso” é claro e corrente.
- source_word: ἐλπίζομεν
  choice: esperamos
  rationale: Preserva o sentido de esperança ou expectativa sem convertê-lo em certeza absoluta.
- source_word: οὐχ ὑπερόψεται
  choice: não ... despreze
  rationale: ὑπεροράω pode significar olhar de cima, desprezar, desconsiderar ou ignorar. “Desprezar” conserva a possível nuance de desdém, enquanto a nota registra uma alternativa menos intensa.
- source_word: ἀπὸ τοῦ γένους ἡμῶν
  choice: nem despreze a nossa linhagem
  rationale: γένος denota origem, descendência, estirpe ou grupo de parentesco. “Linhagem” preserva a dimensão ancestral melhor que “povo”; a repetição de “despreze” torna explícita em português a incidência do verbo sobre o segundo objeto.
theological_decisions:
- issue: Exclusividade do reconhecimento de Deus
  choice: “não reconhecemos nenhum outro deus além dele”
  alternative: “não adoramos nenhum outro deus senão ele”
  rationale: O grego emprega um verbo de conhecer ou reconhecer, não o verbo específico para adorar. A tradução mantém a confissão de exclusividade sem acrescentar uma ação não expressa lexicalmente.
- issue: Alcance de γένος
  choice: “nossa linhagem”
  alternative: “nosso povo”
  rationale: “Linhagem” mantém a referência à descendência ou origem comum. “Nosso povo” é mais fluente, mas reduz a nuance genealógica do termo.
- issue: Nuance de ὑπεροράω
  choice: “despreze”
  alternative: “ignore” ou “desconsidere”
  rationale: O verbo admite tanto a ideia de não dar atenção quanto a de olhar com desprezo. O texto principal retém a nuance mais forte, e a nota preserva a alternativa legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português. A repetição verbal no último membro evita a construção pouco idiomática “nem da nossa linhagem” e esclarece a coordenação elíptica do grego.
