base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/007.yaml
  text: And she was very beautiful in appearance and lovely to behold[a]; and Manasseh her husband had left her gold and silver and male servants and female servants and livestock and fields[b], and she remained over them.
translation:
  language: pt
  text: Ela era bela de aparência e muito bonita de se ver. Manassés, seu marido, lhe havia deixado ouro e prata, servos e servas[a], animais de criação e campos; e ela permanecia à frente deles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escravos e escravas”. Neste inventário de uma propriedade, os termos gregos podem designar servos domésticos em condição de escravidão.
    reason: lexical_alternative
  - marker: b
    text: Ou “continuava de posse deles”. A expressão grega pode indicar que ela administrava os bens, que os possuía, ou ambas as coisas.
    reason: alternative_reading
lexical_decisions:
- source_word: καλὴ τῷ εἴδει
  choice: bela de aparência
  rationale: A expressão descreve a beleza física e a aparência exterior. A formulação é clara e mantém a referência visual do grego.
- source_word: ὡραία τῇ ὄψει σφόδρα
  choice: muito agradável aos olhos
  rationale: Preserva o paralelismo e a forte ênfase visual sem repetir de modo pesado a palavra “bela”.
- source_word: ὑπελείπετο αὐτῇ
  choice: lhe havia deixado
  rationale: Indica que os bens ficaram para Judite após a morte do marido, sem pressupor um ato testamentário formal.
- source_word: παῖδας καὶ παιδίσκας
  choice: servos e servas
  rationale: No inventário de uma propriedade, os termos designam dependentes ou trabalhadores domésticos de ambos os sexos. A possibilidade de condição escrava é mantida em nota.
- source_word: κτήνη
  choice: rebanhos
  rationale: O termo abrange animais domésticos possuídos como parte da propriedade. “Rebanhos” é natural neste contexto patrimonial, embora “gado” ou “animais” também sejam possíveis.
- source_word: ἀγρούς
  choice: campos
  rationale: Equivalente direto e corrente para terras rurais ou cultivadas.
- source_word: ἔμενεν ἐπʼ αὐτῶν
  choice: continuava à frente de tudo isso
  rationale: Comunica permanência e autoridade sobre o conjunto dos bens, preservando em nota a ambiguidade entre posse, administração e supervisão.
theological_decisions:
- issue: Condição social dos dependentes domésticos
  choice: servos e servas
  alternative: escravos e escravas
  rationale: O contexto os inclui entre os bens da propriedade, o que torna possível ou provável uma condição servil. Contudo, παῖδας e παιδίσκας não especificam por si sós, com total precisão, o estatuto jurídico; por isso, o texto principal usa termos mais amplos e a nota registra a alternativa.
- issue: Relação de Judite com os bens herdados
  choice: continuava à frente de tudo isso
  alternative: continuava de posse de tudo isso; permanecia sobre eles
  rationale: A expressão grega pode enfatizar administração, autoridade, posse ou uma combinação desses sentidos. A tradução evita reduzir a frase a apenas um deles.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Manassés” segue a forma portuguesa tradicional do nome. A pontuação divide a descrição pessoal do inventário patrimonial, e “tudo isso” retoma naturalmente o conjunto de bens.
