  text: And she made for herself a tent on the roof of her house[a], and put sackcloth around her waist[b], and the garments of her widowhood were upon her.
translation:
  language: pt
  text: E ela fez para si uma tenda no terraço de sua casa[a], pôs pano de saco em volta da cintura[b] e trazia sobre si as roupas de sua viuvez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na cobertura plana de sua casa”; as casas da região costumavam ter uma cobertura plana e utilizável.
    reason: lexical_alternative
  - marker: b
    text: O pano de saco era um tecido grosseiro usado como sinal de luto, aflição ou humilhação.
    reason: cultural_note
lexical_decisions:
- source_word: σκηνήν
  choice: tenda
  rationale: É o equivalente direto e natural para uma estrutura ou abrigo temporário, sem determinar além do grego sua construção exata.
- source_word: ἐπὶ τοῦ δώματος
  choice: no terraço de sua casa
  rationale: No contexto arquitetônico, δῶμα designa a cobertura plana e utilizável da casa. “Terraço” comunica isso com clareza em português moderno.
- source_word: σάκκον
  choice: pano de saco
  rationale: Expressão bíblica corrente para o tecido grosseiro associado ao luto, à aflição e à humilhação; preserva a dimensão cultural do termo.
- source_word: ἐπὶ τὴν ὀσφὺν αὐτῆς
  choice: em volta da cintura
  rationale: Traduz de modo idiomático a referência à cintura ou aos lombos e combina naturalmente com o ato de vestir o pano de saco.
- source_word: τὰ ἱμάτια τῆς χηρεύσεως αὐτῆς
  choice: as roupas de sua viuvez
  rationale: Mantém a associação explícita das roupas com o estado de viuvez, sem restringi-las interpretativamente a simples “roupas de luto”.
- source_word: ἦν ἐπʼ αὐτῆς
  choice: trazia sobre si
  rationale: Reproduz o sentido estativo de as roupas estarem sobre ela, em português natural e digno, sem reduzir a expressão apenas a “vestia”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Terraço” evita a possível imagem de uma cobertura inclinada; a nota explicita a arquitetura. A formulação conserva a repetição possessiva e o caráter marcado das roupas de viuvez sem soar excessivamente arcaica.
