base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/016.yaml
  text: But do not hold the plans of the Lord our God as security[a], for God is not like a man, to be threatened, nor like a son of man[b], to be persuaded.
translation:
  language: pt
  text: Mas vocês não devem tomar como penhor os planos do Senhor, nosso Deus,[a] porque Deus não é como um homem, para ser ameaçado, nem como um filho de homem,[b] para ser persuadido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tomar como garantia os planos do Senhor, nosso Deus”. O grego emprega a imagem de um penhor dado como garantia.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “filho de homem” é uma maneira de dizer “ser humano”, de estilo semítico; não é um título messiânico.
    reason: cultural_note
lexical_decisions:
- source_word: ἐνεχυράζετε
  choice: tomar como penhor
  rationale: Preserva a imagem concreta de penhor ou garantia presente no verbo grego, sem substituí-la por uma paráfrase interpretativa como “pôr à prova” ou “impor condições”.
- source_word: βουλάς
  choice: planos
  rationale: Expressa de modo claro e atual a ideia de decisões, propósitos ou desígnios, sem tornar o texto excessivamente abstrato.
- source_word: κυρίου τοῦ θεοῦ ἡμῶν
  choice: do Senhor, nosso Deus
  rationale: Mantém κύριος como “Senhor” e verte a relação com “nosso Deus” de forma natural em português.
- source_word: ἀπειληθῆναι
  choice: ser ameaçado
  rationale: É a correspondência direta do infinitivo passivo e conserva a ideia de que Deus não pode ser pressionado por ameaças humanas.
- source_word: διαπεισθῆναι
  choice: ser persuadido
  rationale: Mantém o sentido passivo de ser convencido ou induzido e preserva o paralelismo com “ser ameaçado”.
- source_word: υἱὸς ἀνθρώπου
  choice: um filho de homem
  rationale: Conserva a expressão de estilo semítico e seu paralelismo com “um homem”, deixando a nota esclarecer que aqui ela significa simplesmente um ser humano.
theological_decisions:
- issue: Contraste antropomórfico entre Deus e o ser humano
  choice: Negar que Deus possa ser ameaçado ou persuadido como um ser humano
  alternative: Parafrasear que Deus não pode ser pressionado nem manipulado
  rationale: O grego apresenta explicitamente o contraste por meio de dois infinitivos passivos. A formulação escolhida mantém a tensão e o alcance imediato do versículo sem acrescentar uma afirmação doutrinária mais ampla.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento “vocês” torna explícito o plural de ὑμεῖς; a construção “tomar como penhor” preserva deliberadamente a imagem incomum do original, esclarecida em nota.
