  text: And she sent her maid[a], who was in charge of all that belonged to her, and summoned Chabris and Charmis, the elders of her city.
translation:
  language: pt
  text: Então ela enviou sua serva[a], que administrava tudo o que lhe pertencia, e mandou chamar Cabris e Carmis, os anciãos de sua cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “criada” ou “assistente”. O termo grego ἅβρα designa uma mulher que servia como atendente doméstica.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστείλασα
  choice: ela enviou
  rationale: O particípio aoristo indica uma ação anterior ou estreitamente ligada ao verbo principal; a coordenação em português comunica a sequência com naturalidade.
- source_word: ἅβραν
  choice: serva
  rationale: O substantivo designa uma criada ou assistente doméstica. “Serva” é claro e digno em português, sem a possível ambiguidade moderna de “empregada”.
- source_word: τὴν ἐφεστῶσαν πᾶσιν τοῖς ὑπάρχουσιν αὐτῆς
  choice: que administrava tudo o que lhe pertencia
  rationale: ἐφεστῶσαν expressa responsabilidade de supervisão, e τοῖς ὑπάρχουσιν abrange os bens ou pertences de Judite. “Administrava” preserva a função gerencial em linguagem natural.
- source_word: ἐκάλεσεν
  choice: mandou chamar
  rationale: No contexto, Judite envia a serva para trazer os anciãos até ela. “Mandou chamar” expressa esse sentido causativo e intencional melhor do que o genérico “chamou”.
- source_word: Χαβρεὶν καὶ Χαρμεῖν
  choice: Cabris e Carmis
  rationale: Os nomes próprios são transliterados segundo formas legíveis e correntes em português, representando Χ por C e preservando as terminações nominais reconhecíveis.
- source_word: τοὺς πρεσβυτέρους τῆς πόλεως αὐτῆς
  choice: os anciãos de sua cidade
  rationale: πρεσβυτέρους designa aqui autoridades cívicas, não apenas homens idosos; “anciãos” conserva esse papel social e institucional.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “mandou chamar” evita sugerir que Judite chamou os anciãos diretamente, enquanto “administrava” explicita sem exagero a responsabilidade confiada à serva.
