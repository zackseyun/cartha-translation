base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/012.yaml
  text: Yes[a], yes, O God of my father and God of Israel’s inheritance, Master of the heavens and of the earth, Creator of the waters[b], King of all your creation, you—hear my prayer.
translation:
  language: pt
  text: Sim, sim, ó Deus de meu pai e Deus da herança de Israel[a], Soberano dos céus e da terra, Criador das águas, Rei de toda a tua criação, tu — ouve a minha súplica.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como «Deus da herança de Israel» ou «Deus do patrimônio de Israel».
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὶ ναὶ
  choice: Sim, sim
  rationale: Preserva a repetição enfática e o tom de invocação, sem introduzir a fórmula «em verdade, em verdade», associada a outro contexto.
- source_word: ὁ θεὸς τοῦ πατρὸς μου
  choice: ó Deus de meu pai
  rationale: O contexto de oração dá valor vocativo à expressão; mantém-se o singular «meu pai» do grego.
- source_word: θεὸς κληρονομίας Ἰσραήλ
  choice: Deus da herança de Israel
  rationale: Traduz κληρονομία diretamente por «herança» e conserva a relação genitiva, cuja interpretação exata admite mais de uma nuance.
- source_word: δέσποτα
  choice: Soberano
  rationale: Em português contemporâneo, «Soberano» comunica autoridade absoluta em uma invocação divina e distingue δέσποτα de κύριος, evitando o sentido humano moderno que «Mestre» poderia sugerir.
- source_word: τῶν οὐρανῶν καὶ τῆς γῆς
  choice: dos céus e da terra
  rationale: Mantém o plural explícito «céus» e a cadência solene da oração.
- source_word: κτίστα
  choice: Criador
  rationale: Equivalente direto e natural para o agente que cria.
- source_word: τῶν ὑδάτων
  choice: das águas
  rationale: Preserva o plural explícito do texto grego.
- source_word: βασιλεῦ πάσης κτίσεώς σου
  choice: Rei de toda a tua criação
  rationale: No contexto cósmico, κτίσις tem sentido coletivo de «criação»; o possessivo σου é mantido.
- source_word: σὺ εἰσάκουσον
  choice: tu — ouve
  rationale: O pronome explícito σὺ é enfático; o travessão conserva essa ênfase, e «ouve» mantém a linguagem bíblica natural de uma oração que pede atenção e resposta.
- source_word: τῆς δεήσεώς μου
  choice: a minha súplica
  rationale: δέησις designa especificamente um pedido ou apelo; «súplica» conserva essa precisão e se ajusta ao registro solene sem ser obscura.
theological_decisions:
- issue: Sentido da expressão θεὸς κληρονομίας Ἰσραήλ
  choice: Deus da herança de Israel
  alternative: Deus que é a herança de Israel; Deus do patrimônio de Israel
  rationale: A construção genitiva é preservada no texto, sem decidir se Deus é a herança de Israel ou o Deus que governa/protege a herança pertencente a Israel. A nota registra a ambiguidade genuína.
- issue: Título divino δέσποτα
  choice: Soberano
  alternative: Senhor; Mestre
  rationale: «Soberano» preserva a ideia de autoridade absoluta e evita nivelar δέσποτα com κύριος («Senhor»). «Mestre» seria formalmente possível, mas no português atual pode sugerir sobretudo professor ou guia.
translation_notes:
  register: Português moderno, solene e acessível, com cadência própria de oração. Emprega «tu» de modo coerente com a invocação e conserva os plurais «céus» e «águas». O marcador [a] aparece imediatamente após a expressão ambígua.
