  text: For you made those things before them, and those things and the things afterward and the things now and the things to come you planned[a][b], and what you planned came to be.
translation:
  language: pt
  text: Pois tu fizeste as coisas anteriores àquelas; e aquelas, as posteriores, as presentes e as que estão por vir, tu as planejaste[a][b], e as coisas que planejaste aconteceram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «consideraste», «concebeste» ou «propuseste», para «planejaste» (διενοήθης).
    reason: lexical_alternative
  - marker: b
    text: O grego acumula expressões temporais — «as coisas anteriores», «aquelas», «as posteriores», «as presentes» e «as que estão por vir» — ressaltando o domínio de Deus sobre todos os tempos.
    reason: literary_note
lexical_decisions:
- source_word: σὺ γὰρ
  choice: Pois tu
  rationale: Preserva a força explicativa de γάρ e a ênfase do pronome σὺ, com formulação natural em português.
- source_word: ἐποίησας
  choice: fizeste
  rationale: Mantém o sentido amplo de produzir ou realizar, sem impor o termo mais específico «criaste».
- source_word: τὰ πρότερα ἐκείνων
  choice: as coisas anteriores àquelas
  rationale: Preserva a comparação temporal expressa pelo genitivo ἐκείνων e evita definir um referente que o grego deixa implícito.
- source_word: ἐκεῖνα καὶ τὰ μετέπειτα καὶ τὰ νῦν καὶ τὰ ἐπερχόμενα
  choice: aquelas, as posteriores, as presentes e as que estão por vir
  rationale: Reproduz todos os elementos do catálogo temporal grego em uma sequência compreensível e digna em português.
- source_word: διενοήθης
  choice: planejaste
  rationale: No contexto, comunica pensamento deliberado e propósito, sem acrescentar terminologia filosófica ou sistemática.
- source_word: ἐγενήθησαν ἃ ἐνενοήθης
  choice: veio a acontecer o que planejaste
  rationale: Expressa que o propósito divino se tornou realidade; a construção com «o que» é natural em português, embora o grego use uma forma verbal plural concordando com o relativo neutro plural.
theological_decisions:
- issue: Presciência e soberania divinas sobre o passado, o presente e o futuro
  choice: Traduzir os verbos como ação e planejamento de Deus ao longo de toda a sequência temporal.
  alternative: Traduzir διενοήθης de modo meramente cognitivo, como «consideraste», ou verter ἐποίησας como «criaste».
  rationale: O contexto associa o pensamento divino à sua realização, favorecendo uma ideia de propósito sem introduzir categorias teológicas posteriores. «Fizeste» conserva a amplitude de ποιέω, e a nota mantém aberta a extensão semântica de διανοέομαι.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é reverente e acessível. A formulação deliberadamente compacta de «as coisas anteriores àquelas» conserva a referência não explicitada de ἐκείνων, enquanto o ponto e vírgula torna legível a longa enumeração sem eliminar sua tensão sintática.
