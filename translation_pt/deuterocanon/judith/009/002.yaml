  source_fidelity: A tradução comunica corretamente o contexto de violência sexual e preserva os três elementos corporais do período. Contudo, εἰς μίασμα (“para contaminação/defilement”) foi absorvido em “violaram” e deixou de aparecer no texto. Como o grego o explicita e depois acrescenta, separadamente, profanação e desonra, convém restaurar esse elemento na tradução principal.
  naturalness: O registro é moderno, solene e legível em português internacional. A revisão mantém essa fluência e torna paralelas as três ações atribuídas aos estrangeiros.
  terminology: “Senhor”, “Simeão”, “estrangeiros”, “espada”, “vingança”, “virgem”, “coxa”, “ventre”, “profanaram” e “desonra” são escolhas adequadas. “Violaram” é uma explicitação justificável da imagem eufemística, desde que a nota preserve a formulação literal e o texto retenha também a ideia de contaminação.
  issues:
