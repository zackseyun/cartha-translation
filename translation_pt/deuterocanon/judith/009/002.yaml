    issue: Omissão explícita de εἰς μίασμα no texto principal.
    rationale: 'A formulação “violaram o ventre de uma virgem” transmite a violação, mas não verte expressamente “para contaminação”. A nota não substitui a preservação, no texto, da sequência retórica do grego: violação/contaminação, vergonha e profanação/desonra.'
  - severity: low
    issue: As duas últimas ações estão em gerúndio, enquanto a primeira está em verbo finito.
    rationale: A construção é gramatical, mas três verbos finitos deixam mais clara a série coordenada do original e evitam que as ações pareçam meramente circunstanciais.
