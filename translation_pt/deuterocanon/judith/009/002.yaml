base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/002.yaml
  text: And she said[a], “O Lord, God of my father Simeon, to whom you gave a sword in his hand for vengeance against foreigners, who loosed a virgin’s womb for defilement and bared the thigh for shame and profaned the womb for disgrace—though you said, ‘It shall not be so’[c][b]; but they did it.”
translation:
  language: pt
  text: 'E ela disse: “Senhor, Deus de meu pai Simeão, a quem deste uma espada na mão para executar vingança contra os estrangeiros, que violaram o ventre de uma virgem[a], para contaminá-lo, expuseram-lhe a coxa para vergonha[b] e profanaram-lhe o ventre para desonra — pois tu disseste: ‘Isso não acontecerá’; mas eles o fizeram.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “soltaram o ventre de uma virgem para contaminação”. A expressão grega é eufemística, mas se refere à violência sexual.
    reason: lexical_alternative
  - marker: b
    text: “Expor a coxa” é uma imagem de vergonha sexual, semelhante a outras expressões bíblicas sobre descobrir a nudez para humilhar e violar.
    reason: cultural_note
  - marker: c
    text: A oração alude ao episódio de Simeão e Diná em Gênesis 34 e apresenta a violência de Simeão como vingança pelo ultraje cometido contra ela.
    reason: cross_reference
lexical_decisions:
- source_word: Κύριε
  choice: Senhor
  rationale: Vocativo direto dirigido a Deus; é natural na linguagem de oração e não pressupõe aqui uma convenção específica para o tetragrama.
- source_word: ὁ θεὸς τοῦ πατρὸς μου Συμεών
  choice: Deus de meu pai Simeão
  rationale: Preserva tanto a relação ancestral quanto o nome de Simeão, em ordem natural em português.
- source_word: ᾧ ἔδωκας ἐν χειρὶ ῥομφαίαν
  choice: a quem deste uma espada na mão
  rationale: Mantém a imagem concreta da espada colocada na mão, sem reduzi-la a uma paráfrase como “armaste”.
- source_word: εἰς ἐκδίκησιν ἀλλογενῶν
  choice: para executar vingança contra os estrangeiros
  rationale: Expressa a finalidade de ἐκδίκησις e evita o sentido técnico posterior que “gentios” poderia sugerir para ἀλλογενῶν.
- source_word: οἳ ἔλυσαν μήτραν παρθένου
  choice: que violaram o ventre de uma virgem
  rationale: O grego usa uma expressão corporal e eufemística para violência sexual. Uma reprodução mecânica como “soltaram o ventre” seria obscura e enganosa em português; “violaram” comunica o sentido sem apagar a imagem do ventre.
- source_word: εἰς μίασμα
  choice: '[incorporado em] violaram'
  rationale: μίασμα explicita a contaminação ou profanação produzida pelo ato. Em português, “violaram ... para contaminação” seria pouco natural; a nota registra a formulação mais literal.
- source_word: ἐγύμνωσαν μηρὸν εἰς αἰσχύνην
  choice: expondo-lhe a coxa à vergonha
  rationale: Preserva a imagem idiomática da coxa descoberta e sua associação com humilhação sexual, usando construção portuguesa inteligível.
- source_word: ἐβεβήλωσαν μήτραν εἰς ὄνειδος
  choice: profanando-lhe o ventre para sua desonra
  rationale: “Profanar” conserva a força de tratar como impuro ou não sagrado; “desonra” comunica o opróbrio de ὄνειδος.
- source_word: εἶπας γὰρ Οὐχ οὕτως ἔσται· καὶ ἐποίησαν
  choice: 'pois tu disseste: ‘Isso não acontecerá’; mas eles o fizeram'
  rationale: Mantém a tensão entre a declaração divina e o ato dos agressores. “Mas” torna explícito em português o contraste contextual, sem explicar como a tensão deve ser teologicamente resolvida.
theological_decisions:
- issue: Grau de explicitação da violência sexual
  choice: Usar “violaram o ventre de uma virgem” no texto e preservar em nota a metáfora grega mais literal.
  alternative: “soltaram/abriram o ventre de uma virgem” ou simplesmente “estupraram uma virgem”.
  rationale: A primeira alternativa seria opaca no português atual; a segunda apagaria a tríplice retórica corporal do original. A redação escolhida comunica a violência sexual e conserva a imagem central.
- issue: Identidade dos ἀλλογενεῖς
  choice: estrangeiros
  alternative: gentios
  rationale: “Estrangeiros” mantém o sentido étnico-social amplo no contexto da tradição de Simeão e Diná, sem importar uma categoria cristã posterior.
- issue: Relação entre a palavra divina e a ação dos agressores
  choice: 'Preservar literalmente a tensão: “tu disseste: ‘Isso não acontecerá’; mas eles o fizeram”.'
  alternative: 'Reformular como proibição, por exemplo: “tu disseste que isso não deveria acontecer”.'
  rationale: Οὐχ οὕτως ἔσται pode soar como declaração, enquanto o contexto pode sugerir vontade ou proibição divina. A tradução não resolve silenciosamente essa ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário de alcance internacional. A sintaxe preserva o caráter solene da oração sem reproduzir construções gregas opacas. Os pronomes enclíticos em “expondo-lhe” e “profanando-lhe” esclarecem que o corpo é o da virgem sem acrescentar uma nova personagem.
