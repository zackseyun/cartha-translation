base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/001.yaml
  text: But Judith fell on her face[a], and put ashes on her head, and uncovered the sackcloth she had been wearing. And at that very time the evening incense was being offered in Jerusalem in the house of God, and Judith cried out with a loud voice to the Lord[b],
translation:
  language: pt
  text: 'Judite, porém, caiu com o rosto por terra, pôs cinzas sobre a cabeça e deixou à mostra o pano de saco que vestia.[a] Naquele exato momento, oferecia-se em Jerusalém, na casa de Deus, o incenso da tarde.[b] Então Judite clamou em alta voz ao Senhor:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego indica que Judite expôs o pano de saco que já vestia, não necessariamente que o tirou.
    reason: lexical_alternative
  - marker: b
    text: Isto é, a oferta de incenso realizada à tarde no santuário de Jerusalém.
    reason: cultural_note
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: caiu com o rosto por terra
  rationale: Preserva a imagem concreta da expressão grega e comunica naturalmente um gesto de humilhação, luto e súplica.
- source_word: ἐπέθετο σποδὸν ἐπὶ τὴν κεφαλὴν αὐτῆς
  choice: pôs cinzas sobre a cabeça
  rationale: Expressa em português corrente o gesto ritual de luto indicado pelo grego, usando o plural idiomático «cinzas».
- source_word: ἐγύμνωσεν ὃν ἐνεδεδύκει σάκκον
  choice: deixou à mostra o pano de saco que vestia
  rationale: ἐγύμνωσεν indica tornar descoberto ou exposto; a formulação evita sugerir que Judite tenha tirado o pano de saco.
- source_word: ἦν ἄρτι προσφερόμενον
  choice: Naquele exato momento, oferecia-se
  rationale: Reproduz a simultaneidade enfática de ἄρτι e o aspecto progressivo da construção perifrástica passiva.
- source_word: εἰς τὸν οἶκον τοῦ θεοῦ
  choice: na casa de Deus
  rationale: Mantém a dicção concreta «casa de Deus», entendida no contexto como o santuário de Jerusalém, sem substituir a expressão por uma interpretação.
- source_word: τὸ θυμίαμα τῆς ἑσπέρας
  choice: o incenso da tarde
  rationale: Traduz θυμίαμα especificamente como incenso e conserva de modo conciso a referência temporal da expressão grega.
- source_word: ἐβόησεν φωνῇ μεγάλῃ
  choice: clamou em alta voz
  rationale: Transmite a intensidade e a urgência da oração em português natural e digno.
- source_word: πρὸς Κύριον
  choice: ao Senhor
  rationale: A preposição indica a direção da súplica, e «Senhor» é a equivalência tradicional e contextual de Κύριος quando se refere a Deus.
theological_decisions:
- issue: Tradução de Κύριος
  choice: Senhor
  alternative: Soberano
  rationale: No contexto de oração, Κύριος designa Deus como aquele a quem Judite dirige sua súplica; «Senhor» preserva o uso religioso tradicional sem acrescentar uma interpretação denominacional.
- issue: Identificação de οἶκος τοῦ θεοῦ
  choice: casa de Deus
  alternative: templo de Deus
  rationale: Embora a expressão se refira ao santuário de Jerusalém, a tradução mantém a formulação literal do grego e deixa a nota esclarecer o cenário cultual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das frases foi ajustada levemente para fluidez, preservando a simultaneidade entre a oração de Judite e a oferta do incenso. O dois-pontos final introduz a oração que continua nos versículos seguintes.
