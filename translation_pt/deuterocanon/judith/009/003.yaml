review_pass:
  verdict: revise
  source_fidelity: A primeira oração preserva adequadamente a causalidade e o juízo divino. Contudo, a redação do leito substitui a imagem grega de ser «enganado até/em sangue» por «fizeste ensanguentar», apagando o particípio ἀπατηθεῖσαν. «Servos junto com os poderosos» também não representa bem o ἐπί grego, que conserva uma relação de confronto/posição expressa por «contra/sobre».
  naturalness: A revisão proposta permanece natural em português moderno, mas conserva deliberadamente a estranheza da personificação do leito, já presente no grego. O mais-que-perfeito («se envergonhara», «fora enganado») situa essas ações antes da entrega ao sangue.
  terminology: «Escravos» traduz δούλους com maior precisão histórica do que «servos», que em português moderno pode sugerir simples empregados. «Poderosos» é adequado para δυνάσταις; «governantes» para ἄρχοντας também é adequado.
  issues:
  - severity: high
    issue: A expressão «fizeste ensanguentar o leito» omite o sentido de ἀπατηθεῖσαν («tendo sido enganado»).
    rationale: O grego associa ao leito tanto a vergonha diante do engano deles quanto o fato de ele ter sido enganado «até/em sangue». Transformar isso apenas em ensanguentamento altera a imagem e perde uma ambiguidade importante.
  - severity: medium
    issue: «Servos junto com os poderosos» enfraquece a função de ἐπί na primeira ocorrência.
    rationale: 'A construção paralela ἐπὶ δυνάσταις / ἐπὶ θρόνους favorece a preservação de uma relação direcional ou de confronto: escravos contra poderosos, poderosos sobre os próprios tronos.'
  - severity: medium
    issue: «Servos» é demasiado amplo para δούλους neste quadro de violência e hierarquia.
    rationale: δούλους designa escravos; usar «escravos» mantém a referência social do texto sem eufemismo.
  revised_text: Por isso, entregaste os governantes deles à matança e entregaste ao sangue o leito deles, que se envergonhara do engano deles e fora enganado até o sangue.[a] Feriste escravos contra poderosos, e poderosos sobre seus tronos.[b]
  revised_footnotes:
  - marker: a
    text: 'O grego desta frase é incomum. Literalmente: “e o leito deles, que se envergonhou do engano deles, tendo sido enganado até o sangue”. A repetição de “sangue” na tradução procura conservar a imagem e a sintaxe difíceis do original.'
    reason: Explica a construção personificada e o particípio ἀπατηθεῖσαν sem resolver ou suavizar a ambiguidade do texto-fonte.
  - marker: b
    text: 'Ou, quanto à primeira expressão: “Feriste escravos sobre os poderosos”. A preposição grega ἐπί pode indicar confronto, direção ou posição; a segunda ocorrência é: “sobre seus tronos”.'
    reason: Registra a elasticidade de ἐπί com dativo e preserva a incerteza sintática sem alterar o sentido básico.
  revision_rationale: 'A revisão restaura os dois elementos centrais da construção difícil: o leito é tanto objeto da entrega ao sangue quanto objeto de engano, e os escravos são feridos em relação adversativa/direcional aos poderosos. Mantêm-se a agência direta de Deus, a personificação do leito e a linguagem social e violenta do original, sem identificação interpretativa adicional.'
