base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/003.yaml
  text: Therefore you gave their rulers over to slaughter, and their bed, which was ashamed of their deceit, was deceived into blood; and you struck slaves against princes, and princes upon their thrones.
translation:
  language: pt
  text: Por causa disso, entregaste os governantes deles à matança e fizeste ensanguentar o leito deles, que se horrorizou com o engano que sofreu.[a] Feriste os servos junto com os poderosos, e os poderosos em seus tronos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego desta frase é incomum e permite uma tradução mais literal: “e o leito deles, que se envergonhou do engano deles, enganado até o sangue”.'
    reason: Registra a dificuldade sintática e semântica de ᾐδέσατο ... ἀπατηθεῖσαν εἰς αἷμα e preserva para o leitor a ambiguidade do texto-fonte.
  - marker: b
    text: 'Ou: “Feriste escravos contra poderosos, e poderosos sobre seus tronos”.'
    reason: A preposição grega ἐπί com dativo é ambígua nesta construção, e a relação entre os dois grupos não é totalmente explícita.
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: Por causa disso
  rationale: A expressão introduz a ação como resposta aos atos mencionados anteriormente; esta formulação é natural em português e mantém o nexo causal ou retributivo.
- source_word: ἄρχοντας
  choice: governantes
  rationale: Termo geral para os dirigentes do grupo, sem impor uma categoria política mais específica.
- source_word: εἰς φόνον
  choice: à matança
  rationale: Preserva a ideia de morte violenta coletiva ou abate, mais forte que simplesmente “à morte”.
- source_word: στρωμνήν
  choice: leito
  rationale: Designa cama ou lugar de deitar-se; “leito” mantém o registro digno e a provável conotação sexual do contexto.
- source_word: ᾐδέσατο
  choice: se horrorizou com
  rationale: O verbo pode expressar vergonha, reverência ou repulsa. No contexto da violação e do engano, “se horrorizou com” comunica a reação moral sem atribuir culpa ao leito ou à vítima.
- source_word: ἀπατηθεῖσαν εἰς αἷμα
  choice: que sofreu [...] engano; fizeste ensanguentar
  rationale: A construção grega é compacta e difícil. A tradução preserva o engano sofrido e o desfecho em sangue em português inteligível.
- source_word: δούλους
  choice: servos
  rationale: Equivalente amplo que pode indicar escravos ou subordinados; evita estreitar indevidamente a referência.
- source_word: δυνάσταις
  choice: poderosos
  rationale: Refere-se a pessoas de poder ou autoridade; “poderosos” preserva a amplitude sem duplicar “governantes”.
- source_word: ἐπὶ
  choice: junto com / em
  rationale: Com o dativo, a preposição admite relações distintas. A primeira ocorrência é entendida como associação, e a segunda como localização.
theological_decisions:
- issue: Agência divina no juízo violento
  choice: “entregaste” e “feriste” mantêm Deus como agente explícito
  alternative: Atenuar para uma permissão divina indireta
  rationale: Os verbos gregos estão na segunda pessoa e atribuem diretamente a Deus tanto a entrega quanto o golpe; a tensão teológica deve permanecer.
- issue: Sentido da imagem do leito
  choice: Manter o leito personificado e relacioná-lo ao engano sofrido e ao sangue
  alternative: Identificar explicitamente o leito com Diná ou explicar a narrativa dentro do versículo
  rationale: O grego emprega uma imagem personificada e não nomeia aqui a pessoa envolvida; explicitar a identificação resolveria uma ambiguidade que o texto preserva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais de segunda pessoa singular coerentes com a oração dirigida a Deus. A redação principal privilegia clareza sem ocultar, nas notas, as duas construções gregas difíceis.
