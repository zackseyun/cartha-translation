review_pass:
  verdict: revise
  source_fidelity: 'A redação principal altera de modo indevido a imagem grega do leito: ἀπατηθεῖσαν (“tendo sido enganado/enganada”) não equivale a “fizeste ensanguentar”. Também “junto com” enfraquece a relação hostil ou direcional expressa por ἐπί no primeiro membro.'
  naturalness: A revisão conserva a construção deliberadamente estranha em torno do leito, mas a torna legível em português moderno. A nota explica a dificuldade sem substituir a imagem do texto.
  terminology: “Governantes”, “matança”, “leito”, “servos” e “poderosos” são escolhas adequadas. “Se envergonhou” reproduz mais diretamente ᾐδέσατο do que “se horrorizou”.
  issues:
  - severity: high
    issue: A cláusula sobre o leito transforma “enganado até/em sangue” em “fizeste ensanguentar”.
    rationale: O particípio passivo ἀπατηθεῖσαν expressa engano sofrido; o texto não contém um verbo que signifique ensanguentar. A alteração elimina a imagem e a ambiguidade sintática do grego.
  - severity: medium
    issue: “Junto com os poderosos” para ἐπὶ δυνάσταις reduz a força direcional/confrontativa da expressão.
    rationale: No paralelismo “servos contra poderosos, e poderosos sobre seus tronos”, “contra” preserva melhor a relação de ataque, sem resolver além do necessário a construção difícil.
  revised_text: Por causa disso, entregaste os governantes deles à matança, e o leito deles, que se envergonhou do engano deles, foi enganado até o sangue. Feriste servos contra os poderosos, e poderosos sobre os seus tronos.[a]
  revised_footnotes:
  - marker: a
    text: 'O grego é sintaticamente incomum: literalmente, “e o leito deles, que se envergonhou do engano deles, enganado até o sangue; e feriste servos contra poderosos, e poderosos sobre seus tronos”. A relação indicada por “contra” e “sobre” é difícil de determinar com precisão.'
    reason: Registra a elipse e a construção participial relativas ao leito, bem como a ambiguidade de ἐπί com dativo nos dois membros finais, sem alterar o sentido da tradução principal.
  revision_rationale: A revisão restaura o passivo “foi enganado” e a referência explícita ao sangue, preservando a personificação e a dificuldade do leito no grego. Também substitui a associação neutra “junto com” por “contra”, que corresponde melhor ao paralelismo violento da frase, e reúne as dificuldades textuais numa única nota ancorada no segmento relevante.
