base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/004.yaml
  text: And you gave their wives as plunder[a], and their daughters into captivity, and all their spoils for division among the sons beloved by you, who also were zealous with your zeal and abhorred the defilement of their blood and called on you for help. O God, my God, hear me[b], the widow.
translation:
  language: pt
  text: E entregaste as mulheres deles ao saque, suas filhas ao cativeiro e todos os despojos para serem repartidos entre os filhos amados por ti,[a] os quais também zelaram pelo teu zelo, abominaram a contaminação do sangue deles[b] e invocaram a ti em busca de ajuda. Ó Deus, meu Deus, ouve-me, a mim, que sou viúva.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “filhos amados por ti”; também pode ser expresso como “teus filhos amados”.
    reason: A nota preserva a construção passiva enfática do grego e registra a alternativa portuguesa mais idiomática.
  - marker: b
    text: A expressão também pode ser traduzida como “a impureza do sangue deles”. O grego pode indicar contaminação ritual ou moral ligada ao sangue, sem definir aqui com precisão a relação entre os termos.
    reason: A nota conserva a ambiguidade lexical e sintática de μίασμα αἵματος αὐτῶν.
lexical_decisions:
- source_word: προνομὴν
  choice: saque
  rationale: Designa o que é tomado como presa ou pilhagem de guerra; “saque” é corrente em português e mantém o paralelismo com σκῦλα.
- source_word: αἰχμαλωσίαν
  choice: cativeiro
  rationale: Na construção εἰς αἰχμαλωσίαν, expressa o estado resultante de ser levado cativo.
- source_word: σκῦλα
  choice: despojos
  rationale: Termo militar para bens tomados na guerra; combina naturalmente com a ideia subsequente de repartição.
- source_word: εἰς διαίρεσιν
  choice: para serem repartidos
  rationale: Expressa finalidade e distribuição de modo natural, conservando o sentido de aporcionamento do substantivo grego.
- source_word: υἱῶν ἠγαπημένων ὑπὸ σοῦ
  choice: os filhos amados por ti
  rationale: Mantém o substantivo masculino explícito e a construção passiva que destaca o amor ou favor de Deus.
- source_word: ἐζήλωσαν τὸν ζῆλόν σου
  choice: tiveram zelo com o teu zelo
  rationale: Preserva a repetição enfática da raiz grega e a noção de participação no zelo divino, sem reduzi-la a mera devoção.
- source_word: ἐβδελύξαντο
  choice: abominaram
  rationale: Transmite a forte repulsa moral e ritual do verbo.
- source_word: μίασμα αἵματος αὐτῶν
  choice: a contaminação do sangue deles
  rationale: Conserva o valor ritual e moral de μίασμα e a ambiguidade do genitivo e do referente de αὐτῶν.
- source_word: ἐπεκαλέσαντό σε εἰς βοήθειαν
  choice: invocaram a ti em busca de ajuda
  rationale: Mantém o sentido religioso de invocação e torna explícita, sem ampliar indevidamente, a finalidade de obter auxílio.
- source_word: εἰσάκουσον ἐμοῦ
  choice: ouve-me
  rationale: Forma concisa e tradicional da linguagem de oração, adequada ao imperativo grego.
- source_word: τῆς χήρας
  choice: a mim, que sou viúva
  rationale: Torna natural em português a aposição grega, preservando a autodesignação retórica de Judite.
theological_decisions:
- issue: Termo familiar masculino em υἱῶν ἠγαπημένων ὑπὸ σοῦ
  choice: os filhos amados por ti
  alternative: teus filhos amados; teus filhos queridos
  rationale: O grego diz explicitamente “filhos” e usa um particípio passivo; a versão mantém tanto o gênero quanto a ênfase no amor divino, sem generalizar para “povo” ou “filhos e filhas”.
- issue: Construção cognata ἐζήλωσαν τὸν ζῆλόν σου
  choice: tiveram zelo com o teu zelo
  alternative: arderam com o teu zelo; tiveram zelo por ti
  rationale: A redação conserva a repetição e a tensão de os agentes compartilharem ou manifestarem o próprio zelo de Deus, sem resolver a relação como simples zelo dirigido a Deus.
- issue: Ambiguidade de μίασμα αἵματος αὐτῶν
  choice: a contaminação do sangue deles
  alternative: a impureza causada pelo sangue deles; a profanação de sua linhagem
  rationale: A tradução não decide se o sangue é fonte de impureza, sangue derramado ou referência à linhagem; a nota registra essa abertura sem impor uma leitura doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se a linguagem de oração, o paralelismo da enumeração e as repetições teologicamente significativas do grego. Os marcadores [a] e [b] aparecem no texto principal junto às expressões correspondentes.
