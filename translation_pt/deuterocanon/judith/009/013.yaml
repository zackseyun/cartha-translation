base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/013.yaml
  text: And make my words and deceit become their wound and bruise[b][a], they who have devised harsh things against your covenant and your sanctified house and the summit of Zion and the house possessed by your sons.
translation:
  language: pt
  text: E faze com que minha palavra e meu engano lhes causem ferida e contusão[a], pois eles tramaram crueldades contra a tua aliança, contra a tua casa santificada, contra o cume de Sião e contra a casa que é possessão de teus filhos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dá a minha palavra e o meu engano como ferida e contusão para eles”. A construção grega é compacta e pode destacar tanto os meios usados por Judite quanto o dano causado aos inimigos.'
    reason: lexical_alternative
  - marker: b
    text: A expressão grega traduzida por “a casa que é possessão de teus filhos” é difícil. Pode significar “a morada” ou “a herança de teus filhos” e talvez se refira à terra ou ao santuário pertencente ao povo de Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: δὸς λόγον μου καὶ ἀπάτην εἰς τραῦμα καὶ μώλωπα αὐτῶν
  choice: faze com que minha palavra e meu engano lhes causem ferida e contusão
  rationale: A construção compacta com δὸς e εἰς pode indicar finalidade ou resultado. Esta formulação preserva tanto os meios empregados por Judite — sua palavra e seu engano — quanto o dano resultante, sem eliminar a tensão moral explícita do grego.
- source_word: λόγον μου
  choice: minha palavra
  rationale: O singular conserva a forma grega e mantém a amplitude de λόγος, que no contexto pode abranger palavra, fala ou discurso.
- source_word: ἀπάτην
  choice: meu engano
  rationale: ἀπάτη designa engano ou fraude. “Engano” é direto, corrente e não suaviza a estratégia enganosa de Judite.
- source_word: τραῦμα καὶ μώλωπα
  choice: ferida e contusão
  rationale: Mantém as duas imagens de dano físico. “Contusão” exprime com clareza moderna o ferimento causado por golpe indicado por μώλωψ.
- source_word: ἐβουλεύσαντο σκληρά
  choice: tramaram crueldades
  rationale: βουλεύομαι indica planejar ou tramar, enquanto o neutro plural σκληρά se refere a coisas duras ou cruéis. A expressão portuguesa é natural e comunica a intenção hostil.
- source_word: διαθήκης σου
  choice: tua aliança
  rationale: “Aliança” preserva o sentido bíblico e teológico de διαθήκη, em vez de reduzi-lo a um acordo genérico.
- source_word: οἴκου ἡγιασμένου σου
  choice: tua casa santificada
  rationale: O particípio perfeito passivo ressalta que a casa foi tornada santa ou consagrada; “santificada” conserva essa nuance verbal.
- source_word: κορυφῆς Σιὼν
  choice: cume de Sião
  rationale: κορυφή significa topo ou cume. A tradução mantém a imagem espacial do original.
- source_word: οἴκου κατασχέσεως υἱῶν σου
  choice: a casa que é possessão de teus filhos
  rationale: A expressão grega é incomum. Esta tradução conserva explicitamente as ideias de casa, posse e filhos, deixando em nota as possíveis relações entre elas.
theological_decisions:
- issue: O pedido de Judite para que Deus use seu engano
  choice: traduzir ἀπάτην diretamente como “meu engano”
  alternative: “minha astúcia” ou “meu ardil”
  rationale: O texto apresenta sem atenuação o pedido para que o engano de Judite se torne instrumento contra os inimigos. A tradução preserva essa tensão em vez de justificá-la ou suavizá-la.
- issue: Sentido bíblico de διαθήκη
  choice: aliança
  alternative: pacto
  rationale: “Aliança” comunica de modo natural a relação pactual com Deus e conserva a ressonância teológica do termo no contexto bíblico.
- issue: Identificação da “casa” possuída pelos filhos de Deus
  choice: manter a formulação aberta no texto e explicar as possibilidades em nota
  alternative: identificá-la diretamente como a terra, a herança ou o santuário
  rationale: O grego não determina com segurança qual referente está em vista. Não se deve resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “contra” esclarece a coordenação dos quatro alvos da trama inimiga. Mantiveram-se “casa santificada” e a formulação incomum sobre a possessão dos filhos para preservar nuances e ambiguidades reais do grego.
