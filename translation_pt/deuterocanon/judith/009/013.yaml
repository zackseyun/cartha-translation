  source_fidelity: A tradução acompanha de perto a sintaxe e o sentido do grego. “Faze com que ... lhes causem ferida e contusão” representa adequadamente o imperativo δὸς com a construção εἰς e preserva a relação instrumental/resultativa. O singular “minha palavra” corresponde a λόγον μου; “meu engano” traduz ἀπάτην sem atenuação. “Tramaram crueldades” comunica naturalmente ἐβουλεύσαντο σκληρά. Os quatro objetos de κατὰ são corretamente explicitados com a repetição de “contra”.
  naturalness: O português é moderno, claro e de registro condizente com uma oração solene. “Casa que é possessão de teus filhos” é deliberadamente incomum, mas é compreensível e reflete uma expressão grega difícil; a nota esclarece a dificuldade sem impor uma identificação única.
  terminology: '“Aliança”, “casa santificada”, “Sião”, “ferida” e “contusão” são escolhas consistentes e adequadas. “Engano” preserva a carga semântica direta de ἀπάτη. As notas estão bem ancoradas: [a] após “contusão” explica a construção inteira, e [b] após a expressão difícil explica sua ambiguidade.'
