base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/008.yaml
  text: Lord is your name[a]; you, shatter their strength in your power, and break their might in your wrath; for they planned to profane your holy things, to defile the tabernacle, the resting place of your glorious name[b], and to cast down with the sword the horn of your altar.
translation:
  language: pt
  text: Senhor é o teu nome. Tu, despedaça a força deles com o teu poder e quebra o poderio deles na tua ira, pois planejaram profanar as tuas coisas santas[a], contaminar o tabernáculo, lugar de repouso do teu nome glorioso, e derrubar à espada[b] o chifre do teu altar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode abranger os lugares santos ou o conjunto das coisas sagradas, e não apenas objetos consagrados.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «com ferro»; provavelmente uma referência metonímica a uma arma de ferro, como a espada.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριος ὄνομά σοι
  choice: Senhor é o teu nome
  rationale: Preserva a predicação concisa e solene do grego, sem transformar o título divino em nome próprio nem diluir a formulação em «renome».
- source_word: ῥάξον αὐτῶν τὴν ἰσχὺν
  choice: despedaça a força deles
  rationale: «Despedaça» comunica a violência do imperativo aoristo, enquanto «força» mantém o sentido amplo de ἰσχύς.
- source_word: ἐν δυνάμει σου
  choice: com o teu poder
  rationale: Em português, «com» exprime naturalmente o poder divino como meio pelo qual a ação é realizada, sem alterar o conteúdo do grego.
- source_word: κατάξον τὸ κράτος αὐτῶν
  choice: quebra o poderio deles
  rationale: Distingue κατάξον de ῥάξον e traduz κράτος como força efetiva ou poder dominante, sem restringi-lo a domínio político.
- source_word: ἐν τῷ θυμῷ σου
  choice: na tua ira
  rationale: Mantém a linguagem elevada da oração e a intensidade de θυμός, sem acrescentar uma interpretação específica sobre a natureza dessa ira.
- source_word: βεβηλῶσαι τὰ ἅγιά σου
  choice: profanar as tuas coisas santas
  rationale: Conserva o contraste cultual entre o santo e o profano e mantém o plural abrangente do grego.
- source_word: μιᾶναι τὸ σκήνωμα
  choice: contaminar o tabernáculo
  rationale: «Contaminar» expressa impureza cultual; «tabernáculo» preserva a imagem concreta de σκήνωμα.
- source_word: τῆς καταπαύσεως τοῦ ὀνόματος τῆς δόξης σου
  choice: lugar de repouso do teu nome glorioso
  rationale: Reproduz a ideia de repouso ou habitação do nome divino e verte o encadeamento genitivo de modo claro e natural.
- source_word: καταβαλεῖν σιδήρῳ κέρας θυσιαστηρίου σου
  choice: derrubar à espada o chifre do teu altar
  rationale: «Derrubar» acompanha καταβαλεῖν; «à espada» explicita a metonímia provável de «ferro», e «chifre do altar» preserva a imagem cultual concreta.
theological_decisions:
- issue: Amplitude de τὰ ἅγιά σου
  choice: as tuas coisas santas
  alternative: o teu santuário
  rationale: O plural neutro pode abranger objetos, áreas ou realidades sagradas. A tradução não restringe indevidamente a referência ao edifício do santuário.
- issue: Relação entre o tabernáculo, o repouso e o nome divino
  choice: o tabernáculo, lugar de repouso do teu nome glorioso
  alternative: o tabernáculo onde repousa o teu nome glorioso
  rationale: A formulação mantém a densa linguagem cultual do grego e não transforma a presença associada ao nome divino em uma explicação teológica mais definida.
- issue: Imagem do chifre do altar
  choice: o chifre do teu altar
  alternative: a extremidade do teu altar
  rationale: A imagem concreta é teologicamente e ritualmente significativa; substituí-la por uma descrição funcional apagaria essa associação cultual.
translation_notes:
  register: Português atual, solene e amplamente compreensível, com legibilidade brasileira. Mantêm-se os paralelismos poéticos, a terminologia cultual concreta e a ambiguidade de «coisas santas». Os pronomes de segunda pessoa no singular preservam a oração direta a Deus.
