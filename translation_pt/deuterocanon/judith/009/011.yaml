base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/011.yaml
  text: For your power is not in a multitude[a], nor is your dominion among the strong; rather, you are God of the lowly, helper of the lesser, supporter of the weak, shelter of the forsaken[b], savior of those without hope.
translation:
  language: pt
  text: Pois o teu poder não está na multidão, nem o teu domínio entre os fortes; pelo contrário, tu és Deus dos humildes, auxílio dos menores, amparo dos fracos, abrigo dos que foram dados por perdidos[a], salvador dos que perderam a esperança[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abrigo dos desesperados”; o grego pode indicar pessoas dadas por perdidas ou que estão em desespero.
    reason: lexical_alternative
  - marker: b
    text: Ou “libertador” em vez de “salvador”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθει
  choice: na multidão
  rationale: Preserva o sentido concreto de grande número ou multidão sem restringi-lo explicitamente a tropas.
- source_word: κράτος
  choice: poder
  rationale: Expressa força ou poder efetivo e forma um paralelo natural com o domínio da oração seguinte.
- source_word: δυναστεία
  choice: domínio
  rationale: Mantém a ideia de autoridade e poder de governo em linguagem elevada, mas corrente.
- source_word: ἐν ἰσχύουσιν
  choice: entre os fortes
  rationale: Traduz naturalmente o particípio substantivado, referindo-se aos fortes ou poderosos.
- source_word: ταπεινῶν
  choice: dos humildes
  rationale: Abrange os de condição baixa e abatida; em português, “humildes” conserva a dignidade e a amplitude do termo, sem limitar o sentido a uma virtude interior.
- source_word: ἐλαττόνων
  choice: dos menores
  rationale: Preserva o valor comparativo de ἐλάττων, sem convertê-lo no superlativo “os menores de todos” ou “os últimos”.
- source_word: βοηθός
  choice: auxílio
  rationale: Como predicativo nominal, descreve Deus como aquele que presta ajuda; “auxílio” mantém a cadeia compacta e litânica.
- source_word: ἀντιλήμπτωρ
  choice: amparo
  rationale: Comunica a ação de sustentar e acudir, distinguindo-a do abrigo expresso pelo termo seguinte.
- source_word: ἀσθενούντων
  choice: dos fracos
  rationale: Conserva o sentido amplo de fraqueza, debilidade ou incapacidade, sem restringi-lo à doença.
- source_word: ἀπεγνωσμένων
  choice: dos que foram dados por perdidos
  rationale: Expressa a nuance passiva de pessoas consideradas sem saída ou abandonadas como caso perdido, em vez de apenas seu estado emocional.
- source_word: σκεπαστής
  choice: abrigo
  rationale: Preserva a imagem de cobrir e acolher, sem fundi-la com auxílio ou amparo.
- source_word: ἀπηλπισμένων
  choice: dos que perderam a esperança
  rationale: Representa diretamente aqueles que já não têm esperança, distinguindo-os dos que foram dados por perdidos.
- source_word: σωτήρ
  choice: salvador
  rationale: É o equivalente português direto do título que designa quem salva ou liberta, preservando sua força teológica sem paráfrase.
theological_decisions:
- issue: Forma da sequência de predicados divinos
  choice: 'Preservar a cadeia nominal compacta: “Deus dos humildes, auxílio dos menores, amparo dos fracos...”'
  alternative: 'Parafrasear verbalmente: “tu ajudas os humildes, amparas os fracos...”'
  rationale: O grego acumula títulos e descrições em forma de litania. A estrutura nominal conserva a retórica e evita acrescentar explicações não expressas.
- issue: Relação entre poder divino e força humana
  choice: Manter a negação paralela e o contraste explícito com “pelo contrário”
  alternative: Suavizar como mera preferência de Deus pelos vulneráveis
  rationale: O texto afirma enfaticamente que o poder e o domínio de Deus não residem na multidão nem entre os fortes; a tradução não deve reduzir essa tensão teológica.
- issue: Sentido de σωτήρ
  choice: salvador
  alternative: libertador
  rationale: “Salvador” preserva o título amplo do grego; “libertador” é possível em certos contextos, mas pode estreitar o sentido para uma libertação circunstancial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo e a cadência litânica do grego. “Dos humildes” deve ser entendido no contexto amplo dos socialmente rebaixados ou abatidos, não apenas como descrição de modéstia interior.
