  source_fidelity: 'A tradução preserva com precisão o paralelismo negativo e o contraste do grego: o poder de Deus não está na multidão nem nos fortes. A cadeia de predicados é mantida sem expandir ou harmonizar os termos. “Dados por perdidos” representa adequadamente a nuance passiva de ἀπεγνωσμένων, distinta de “os que perderam a esperança” para ἀπηλπισμένων.'
