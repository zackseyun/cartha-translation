base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/010.yaml
  text: Strike slave against ruler with the deceit of my lips[a], and ruler against his attendant; shatter their arrogance by the hand of a woman.
translation:
  language: pt
  text: Fere o escravo contra o governante com o engano dos meus lábios, e o governante contra o seu assistente; despedaça a arrogância deles[a] pela mão de uma mulher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “despedaça o levante deles” ou “a insolência deles”; o substantivo grego é raro e pode indicar tanto a exaltação orgulhosa deles quanto o ato de se levantarem.
    reason: Alternativa lexical para o raro ἀνάστεμα, cuja amplitude semântica não deve ser ocultada.
lexical_decisions:
- source_word: πάταξον
  choice: Fere
  rationale: Imperativo direto que pede a Deus que desfira um golpe. “Fere” conserva a força do verbo sem especificar morte, ao contrário de “abate”.
- source_word: δοῦλον
  choice: o escravo
  rationale: O termo designa alguém em condição servil. “Escravo” preserva o contraste de posição social com o governante, contraste que “servo” poderia suavizar.
- source_word: ἐκ χειλέων ἀπάτης μου
  choice: com o engano dos meus lábios
  rationale: A expressão indica o meio pelo qual se pede que os adversários sejam lançados uns contra os outros. A formulação conserva tanto a imagem dos lábios quanto a admissão explícita do engano, sem acrescentar “palavras” ao grego.
- source_word: ἐπʼ ἄρχοντι
  choice: contra o governante
  rationale: No contexto de confronto e inversão de hierarquias, ἐπί é entendido em sentido adversativo. “Governante” mantém a amplitude de ἄρχων sem restringi-lo a príncipe ou monarca.
- source_word: ἄρχοντα
  choice: o governante
  rationale: Repete-se a mesma designação para a autoridade, preservando o paralelismo do grego.
- source_word: θεράποντι
  choice: seu assistente
  rationale: θεράπων pode indicar um servidor ou acompanhante pessoal. “Assistente” distingue este termo de δοῦλος e comunica a relação de subordinação pessoal em português atual.
- source_word: θραῦσον
  choice: despedaça
  rationale: Imperativo forte que expressa ruptura decisiva. “Despedaça” transmite intensidade maior que “quebra” sem impor necessariamente a ideia de matar.
- source_word: τὸ ἀνάστεμα
  choice: a arrogância deles
  rationale: O substantivo raro pode evocar exaltação orgulhosa ou levante. “Arrogância” comunica bem o sentido moral provável no contexto, enquanto a ambiguidade lexical é preservada em nota.
- source_word: ἐν χειρὶ θηλείας
  choice: pela mão de uma mulher
  rationale: Mantém o idioma bíblico de agência e a referência feminina explícita de θηλείας, essencial à inversão narrativa do poder.
theological_decisions:
- issue: Agência feminina na oração de Judite
  choice: pela mão de uma mulher
  alternative: pela mão de alguém do sexo feminino
  rationale: O grego marca explicitamente a agência feminina. A tradução preserva esse dado sem neutralizá-lo e usa a forma humana e natural “mulher”, em vez de uma expressão meramente biológica.
- issue: Natureza da derrota pedida
  choice: despedaça a arrogância deles
  alternative: despedaça o levante deles
  rationale: O substantivo raro admite tanto uma leitura moral, ligada à exaltação orgulhosa, quanto uma leitura mais concreta de insurreição ou levantamento. O texto principal adota a leitura contextual mais natural, sem eliminar a alternativa, registrada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção incomum “fere o escravo contra o governante” conserva deliberadamente a tensão e o paralelismo do grego, evitando explicitar além da fonte como se dará o confronto. O marcador de nota foi colocado junto de “arrogância”, termo ao qual a nota se refere.
