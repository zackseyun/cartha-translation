base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/007.yaml
  text: For behold[a], the Assyrians have multiplied in their strength; they have been exalted on horse and rider; they have boasted in the arm of foot soldiers; they have hoped in shield and spear and bow and sling, and they have not known that you are the Lord[b], the one who shatters wars.
translation:
  language: pt
  text: Pois eis que os assírios se multiplicaram em sua força; foram exaltados por causa de cavalos e cavaleiros; vangloriaram-se da força da infantaria; depositaram sua esperança[a] no escudo, na lança, no arco e na funda, e não reconheceram que tu és o Senhor, aquele que despedaça as guerras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “confiaram no escudo, na lança, no arco e na funda”. O verbo grego pode expressar tanto esperança como confiança.
    reason: lexical_alternative
  - marker: b
    text: Ou “que põe fim às guerras”. Literalmente, “aquele que despedaça as guerras”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Pois eis que
  rationale: Conserva tanto a ligação explicativa de γάρ como a força enfática e solene de ἰδού.
- source_word: ἐπληθύνθησαν ἐν δυνάμει αὐτῶν
  choice: se multiplicaram em sua força
  rationale: Mantém a imagem de aumento e a formulação preposicional do grego sem limitar o crescimento apenas ao número de soldados.
- source_word: ὑψώθησαν ἐφʼ ἵππῳ καὶ ἀναβάτῃ
  choice: elevaram-se com cavalos e cavaleiros
  rationale: Preserva a imagem de elevação, que no contexto também sugere orgulho, e expressa de modo compreensível que a cavalaria é a base dessa exaltação. O plural coletivo soa mais natural em português.
- source_word: ἐγαυρίασαν ἐν βραχίονι πεζῶν
  choice: vangloriaram-se do braço dos soldados de infantaria
  rationale: Vangloriar-se comunica a exultação arrogante do verbo, enquanto braço conserva a metáfora concreta de força militar.
- source_word: ἤλπισαν ἐν
  choice: depositaram sua esperança em
  rationale: Reproduz o sentido básico de esperar em de forma idiomática em português, sem eliminar a possibilidade contextual de confiar ou apoiar-se.
- source_word: ἀσπίδι καὶ γαίσῳ καὶ τόξῳ καὶ σφενδόνῃ
  choice: no escudo, na lança, no arco e na funda
  rationale: Emprega nomes atuais e abrangentes para as quatro armas, sem especificidade histórica indevida.
- source_word: οὐκ ἔγνωσαν
  choice: não reconheceram
  rationale: 'No contexto da oração, o verbo indica mais que falta de informação: os assírios deixaram de reconhecer quem Deus é. A escolha permanece dentro do campo semântico de conhecer.'
- source_word: συντρίβων πολέμους
  choice: aquele que despedaça as guerras
  rationale: Conserva a imagem concreta, vigorosa e incomum do particípio grego, em vez de reduzi-la à ideia abstrata de terminar guerras.
theological_decisions:
- issue: Tradução de κύριος na oração dirigida ao Deus de Israel
  choice: o Senhor
  alternative: Senhor
  rationale: Traduz diretamente o título grego com artigo, sem introduzir o tetragrama onde o texto-fonte traz κύριος.
- issue: Sentido de συντρίβων πολέμους
  choice: aquele que despedaça as guerras
  alternative: aquele que põe fim às guerras
  rationale: A tradução principal mantém a metáfora e a apresentação teológica de Deus como aquele que quebra o poder da guerra; a nota registra a leitura funcional possível sem substituir a imagem do original.
translation_notes:
  register: Português moderno, solene e acessível, com paralelismo retórico adequado a uma oração. Mantiveram-se as metáforas militares de “braço” e “despedaça”, enquanto “soldados de infantaria” esclarece πεζῶν. Os marcadores foram posicionados junto às expressões às quais suas notas efetivamente se referem.
