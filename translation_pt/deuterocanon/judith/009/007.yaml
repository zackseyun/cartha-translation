    text: Ou “confiaram no escudo, na lança, no arco e na funda”. O verbo grego pode expressar tanto esperança como confiança.
    reason: lexical_alternative
  - marker: b
    text: Ou “que põe fim às guerras”. Literalmente, “aquele que despedaça as guerras”.
    reason: lexical_alternative
  revision_rationale: A revisão corrige a âncora da nota a e melhora duas formulações para refletir a voz e as relações semânticas do grego com português moderno natural. A alternativa da nota b e sua âncora final são mantidas, pois documentam diretamente toda a expressão «aquele que despedaça as guerras».
