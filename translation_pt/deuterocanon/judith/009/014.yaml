  yaml_path: translation/deuterocanon/judith/009/014.yaml
  text: And bring about[a], upon all your nation and every tribe, recognition, so that they may know that you are the God of all power and might[b], and there is no other who defends the people of Israel except you.
translation:
  language: pt
  text: E faze que haja, em toda a tua nação e em cada tribo, reconhecimento[a], para que saibam que tu és o Deus de todo poder e força[b], e que não há outro que defenda o povo de Israel, a não ser tu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conhecimento” ou “pleno conhecimento”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o Deus de todo poder e força”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίησον
  choice: faze surgir
  rationale: O imperativo de ποιέω tem por objeto ἐπίγνωσιν e expressa aqui a ideia de produzir ou suscitar reconhecimento; “faze surgir” preserva essa força causativa em português natural.
- source_word: ἐπὶ πᾶν τὸ ἔθνος σου καὶ πάσης φυλῆς
  choice: em toda a tua nação e em cada tribo
  rationale: A formulação mantém o alcance coletivo de ἔθνος e o valor distributivo de πᾶς com φυλή, ao mesmo tempo que verte ἐπί de modo idiomático.
- source_word: ἐπίγνωσιν
  choice: o reconhecimento
  rationale: ἐπίγνωσις pode indicar conhecimento, reconhecimento ou plena percepção. “Reconhecimento” distingue o termo do verbo εἰδῆσαι que vem em seguida e comunica a ideia de chegar a reconhecer quem Deus é.
- source_word: τοῦ εἰδῆσαι
  choice: para que saibam
  rationale: O infinitivo articular com τοῦ exprime propósito ou resultado; esta construção comunica ambas as possibilidades de modo natural.
- source_word: ὁ θεὸς πάσης δυνάμεως καὶ κράτους
  choice: o Deus de todo poder e força
  rationale: “Poder e força” preserva os dois substantivos gregos, semanticamente próximos, e sua intensificação conjunta sem impor uma distinção técnica.
- source_word: ὑπερασπίζων
  choice: que defenda
  rationale: O particípio designa aquele que toma a defesa de alguém ou o protege; “defenda” conserva a nuance ativa e combina com o contexto de livramento.
- source_word: τοῦ γένους Ἰσραήλ
  choice: o povo de Israel
  rationale: γένος pode significar linhagem, raça, família ou povo. “Povo de Israel” expressa naturalmente o sentido étnico-coletivo sem a conotação moderna problemática de “raça”.
- source_word: εἰ μὴ σύ
  choice: a não ser tu
  rationale: A expressão é exclusiva e enfática; “a não ser tu” preserva diretamente a afirmação de que somente Deus defende Israel.
theological_decisions:
- issue: Exclusividade divina na defesa de Israel
  choice: não há outro que defenda o povo de Israel, a não ser tu
  alternative: não há outro defensor da linhagem de Israel além de ti
  rationale: O grego atribui exclusivamente a Deus a defesa de Israel. A tradução mantém essa exclusividade sem ampliá-la para uma afirmação doutrinária que vá além do versículo.
- issue: Relação entre reconhecimento e conhecimento
  choice: o reconhecimento, para que saibam
  alternative: o conhecimento, para que saibam
  rationale: A tradução conserva a distinção lexical possível entre ἐπίγνωσις e εἰδῆσαι, sem definir de maneira excessiva se o primeiro termo denota reconhecimento, conhecimento ou plena percepção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais tradicionais de oração (“faze”, “tu és”) preservadas por adequação ao discurso dirigido a Deus. A ordem foi levemente ajustada para fluência, sem eliminar a estrutura enfática nem a ambiguidade lexical de ἐπίγνωσις.
