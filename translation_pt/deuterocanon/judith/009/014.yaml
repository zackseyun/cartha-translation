  - severity: low
    issue: Alternativa «a admissão» na nota a
    rationale: «Admissão» tende a sugerir ingresso, aceitação ou confissão em registros específicos; não é uma alternativa clara para ἐπίγνωσις neste contexto. «Pleno conhecimento» é mais preciso.
