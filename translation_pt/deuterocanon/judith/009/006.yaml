  text: And what I planned stood ready[a], and they said, ‘Behold, we are here; for all your ways are prepared, and your judgment is in foreknowledge.’
translation:
  language: pt
  text: 'E as coisas que planejaste estavam prontas e disseram: “Aqui estamos”, pois todos os teus caminhos estão preparados, e o teu julgamento está na presciência.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o teu julgamento é segundo o conhecimento prévio”; ou: “o teu julgamento está no teu conhecimento prévio”. A expressão grega é compacta e pode indicar que a decisão judicial de Deus está em seu conhecimento prévio ou de acordo com ele.'
    reason: alternative_reading
lexical_decisions:
- source_word: παρέστησαν
  choice: se apresentaram
  rationale: O aoristo plural de παρίστημι descreve aquilo que Deus planejou como vindo à sua presença, pronto para cumprir sua vontade. “Se apresentaram” também prepara naturalmente a fala “Aqui estamos”.
- source_word: ἃ ἐβουλεύσω
  choice: as coisas que planejaste
  rationale: O pronome relativo neutro plural refere-se às coisas que Deus deliberou ou decidiu realizar. A forma verbal está na segunda pessoa do singular; por isso, o sentido é “planejaste”, não “planejei”.
- source_word: πάρεσμεν
  choice: Aqui estamos
  rationale: A expressão declara presença e prontidão. “Aqui estamos” é idiomático e mantém a vivacidade da personificação.
- source_word: ὁδοί
  choice: caminhos
  rationale: “Caminhos” preserva a imagem ampla das maneiras de agir e dos procedimentos de Deus.
- source_word: ἕτοιμοι
  choice: estão preparados
  rationale: O adjetivo indica que os caminhos de Deus já se encontram prontos ou dispostos para a execução de seu propósito.
- source_word: κρίσις
  choice: julgamento
  rationale: O termo pode indicar decisão ou ato judicial. “Julgamento” conserva essa dimensão sem reduzi-lo à ideia abstrata de justiça.
- source_word: πρόγνωσις
  choice: presciência
  rationale: O substantivo designa conhecimento prévio. “Presciência” é conciso e mantém a formulação teológica do grego; a nota esclarece opções mais transparentes.
theological_decisions:
- issue: Relação entre o julgamento divino e πρόγνωσις
  choice: o teu julgamento está na presciência
  alternative: o teu julgamento é segundo o conhecimento prévio; o teu julgamento está no teu conhecimento prévio
  rationale: A expressão grega ἐν προγνώσει é compacta e não determina inequivocamente se a relação é locativa, normativa ou circunstancial. A tradução principal conserva a preposição sem resolver a tensão, e a nota registra interpretações naturais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com a oração dirigida a Deus. A personificação plural de “as coisas que planejaste” foi preservada porque elas se apresentam e falam no texto grego.
