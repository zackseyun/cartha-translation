translation:
  language: pt
  text: Olha para a arrogância deles; envia a tua ira sobre as cabeças deles; dá poder ao que planejei por meio de minha mão — eu, uma viúva.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Dá poder à minha mão — a mim, que sou viúva — para realizar o que planejei”. A oração final em grego é sintaticamente compacta e admite mais de uma construção estreitamente relacionada.'
    reason: alternative_reading
lexical_decisions:
- source_word: βλέψον
  choice: Olha para
  rationale: Imperativo que apela a Deus para que atente à situação; a formulação é clara e mantém o tom de oração.
- source_word: ὑπερηφανίαν
  choice: arrogância
  rationale: Expressa o orgulho altivo e opressor indicado pelo substantivo grego, em linguagem moderna.
- source_word: ἀπόστειλον
  choice: envia
  rationale: Correspondência direta e natural ao imperativo aoristo.
- source_word: ὀργήν
  choice: ira
  rationale: No contexto de juízo divino, comunica melhor a indignação punitiva do que o termo mais geral 'raiva'.
- source_word: εἰς κεφαλὰς αὐτῶν
  choice: sobre a cabeça deles
  rationale: Preserva a imagem idiomática do juízo que recai sobre os próprios arrogantes; o singular distributivo é natural em português.
- source_word: δὸς
  choice: dá
  rationale: Mantém o imperativo simples do grego e se ajusta ao caráter direto da súplica.
- source_word: ἐν χειρί μου τῆς χήρας
  choice: por meio da minha mão, a mão de uma viúva
  rationale: Interpreta ἐν χειρί em sentido instrumental, conserva a imagem concreta da mão e explicita a aposição enfática da condição de viúva.
- source_word: ὃ διενοήθην
  choice: o que planejei
  rationale: Traduz a ideia de conceber ou formar um propósito sem acrescentar conotação de engano.
- source_word: κράτος
  choice: poder
  rationale: Denota força ou poder eficaz; aqui é aquilo que Deus é invocado a conceder para tornar efetivo o plano de Judite.
theological_decisions:
- issue: Construção da oração final com κράτος e ἐν χειρί μου τῆς χήρας
  choice: Pedido para que Deus dê eficácia ao plano de Judite por meio da mão dela, uma viúva
  alternative: Dá poder à minha mão — a mim, que sou viúva — para realizar o que planejei
  rationale: A ordem das palavras em grego é sintaticamente compacta. O texto principal preserva o pedido de capacitação divina, a imagem da mão como instrumento e a identificação enfática de Judite como viúva, enquanto a nota registra outra construção próxima sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém o paralelismo da oração e a imagem concreta da mão, evitando tanto arcaísmo excessivo quanto paráfrase doutrinária.
