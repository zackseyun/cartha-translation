review_pass:
  verdict: revise
  source_fidelity: A primeira e a segunda petições traduzem fielmente os imperativos gregos e o vocabulário de juízo. Contudo, κεφαλὰς está no plural, e o singular «a cabeça deles» não é necessário nem preferível aqui. A oração final é ambígua e comprimida; a revisão conserva a leitura principal adotada, sem apresentar como inequívoca a relação entre «poder», o plano e a mão de Judite.
  naturalness: «Olha para», «envia a tua ira» e «dá poder» são naturais e adequados ao registro de oração. «Por meio da minha mão, a mão de uma viúva» é redundante e pouco fluente em português. «Por meio de minha mão — eu, uma viúva» mantém a ênfase identificadora do grego com melhor legibilidade.
  terminology: «Arrogância», «ira» e «poder» são escolhas adequadas para ὑπερηφανία, ὀργή e κράτος. «Viúva» preserva o termo-chave e a autoidentificação enfática de Judite.
  issues:
  - severity: medium
    issue: «sobre a cabeça deles» verte κεφαλὰς no singular.
    rationale: O grego traz «sobre as cabeças deles». Embora um singular distributivo possa ocorrer em português, o plural é plenamente natural e preserva a forma e a imagem do texto-fonte.
  - severity: medium
    issue: «por meio da minha mão, a mão de uma viúva» é uma aposição redundante e estilisticamente pesada.
    rationale: A expressão busca representar μου τῆς χήρας, mas a repetição de «mão» obscurece a identificação de primeira pessoa. «por meio de minha mão — eu, uma viúva» conserva a mão como instrumento e explicita a aposição sem acrescentar sentido.
  revised_text: Olha para a arrogância deles; envia a tua ira sobre as cabeças deles; dá poder ao que planejei por meio de minha mão — eu, uma viúva.[a]
