base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/021.yaml
  text: And the cisterns were being emptied, and they did not have enough water to drink for even one day, because it was given to them to drink by measure.
translation:
  language: pt
  text: E as cisternas iam ficando vazias, e eles não tinham água suficiente para beber nem por um dia, porque a água lhes era dada por medida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em porções medidas” ou “de forma racionada”; o grego diz literalmente “por medida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λάκκοι
  choice: cisternas
  rationale: No contexto do cerco, refere-se a reservatórios escavados para armazenar água; “cisternas” é preciso e natural em português.
- source_word: ἐξεκενοῦντο
  choice: iam ficando vazias
  rationale: O imperfeito expressa um processo contínuo de esvaziamento; a formulação preserva esse aspecto sem sugerir que já estivessem completamente secas.
- source_word: οὐκ εἶχον πεῖν ... ὕδωρ
  choice: eles não tinham água suficiente para beber
  rationale: A construção indica falta de água em quantidade suficiente, não necessariamente ausência absoluta de água.
- source_word: εἰς πλησμονὴν
  choice: suficiente
  rationale: Literalmente, “até a plenitude”; neste contexto, comunica quantidade bastante para beber, com naturalidade em português.
- source_word: ἡμέραν μίαν
  choice: nem por um dia
  rationale: Expressa de modo idiomático a duração mínima enfatizada pela frase, sem tornar a formulação pesada.
- source_word: ἐν μέτρῳ
  choice: em quantidade medida
  rationale: Preserva a imagem concreta de distribuição por medida e indica que a água era racionada.
- source_word: ἐδίδοσαν αὐτοῖς πεῖν
  choice: a água lhes era dada
  rationale: Mantém o agente não especificado, como no grego, e explicita naturalmente em português que aquilo que lhes era dado para beber era água.
