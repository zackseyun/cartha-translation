  yaml_path: translation/deuterocanon/judith/007/011.yaml
  text: And now[a], master, do not fight against them as in a pitched battle, and not one man from your people will fall.
translation:
  language: pt
  text: E agora, senhor, não combata contra eles como numa batalha campal[a], e não cairá nem um só homem dentre o seu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como se trava uma batalha em linhas de combate”. A expressão grega se refere ao combate convencional com as tropas dispostas em formação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσποτα
  choice: senhor
  rationale: É uma forma direta de tratamento a um superior humano. Em português, “senhor” em minúscula é a opção mais natural e digna; “amo” soaria servil ou arcaico, e “soberano” sugeriria um título político mais específico do que o contexto exige.
- source_word: μὴ πολέμει πρὸς αὐτούς
  choice: não combata contra eles
  rationale: Preserva de modo claro a proibição expressa pelo imperativo presente com μή e o sentido militar de πολεμέω.
- source_word: καθὼς γίνεται πόλεμος παρατάξεως
  choice: como se trava uma batalha em formação
  rationale: παράταξις designa a disposição das tropas em linhas de combate. A formulação mantém a imagem militar e expressa em português natural o contraste com a estratégia alternativa proposta no contexto.
- source_word: οὐ πεσεῖται
  choice: não cairá
  rationale: Mantém a metáfora militar de πίπτω, que nesse contexto pode implicar cair morto, sem tornar a morte mais explícita do que o grego.
- source_word: ἀνὴρ εἷς
  choice: nem um só homem
  rationale: Conserva tanto o substantivo masculino explícito quanto a ênfase numérica do grego.
- source_word: λαοῦ σου
  choice: do seu povo
  rationale: Traduz λαός por seu sentido usual, sem restringi-lo a “exército” ou “tropas”, termos mais específicos que o original.
theological_decisions:
- issue: Tratamento δέσποτα dirigido a um superior humano
  choice: senhor
  alternative: amo; soberano
  rationale: O referente é humano. “Senhor”, em minúscula, comunica o tratamento respeitoso sem identificar o destinatário como divino; as alternativas seriam menos naturais ou acrescentariam uma conotação específica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com preferência por uma construção militar clara sem eliminar a imagem de tropas em formação. A colocação de “nem um só homem” preserva a ênfase do original.
