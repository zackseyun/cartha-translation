  text: And they encamped in the valley near Bethulia[a], by the spring, and they extended in breadth toward Dothaim as far as Belbaim, and in length from Bethulia as far as Cyamon, which is opposite Esdraelon.
translation:
  language: pt
  text: E acamparam no vale, perto de Betúlia[a], junto à fonte, e se estenderam, em largura, na direção de Dotaim até Belbaim e, em comprimento, desde Betúlia até Cíamon, que fica em frente de Esdrelom.
  philosophy: optimal-equivalence
  footnotes:
