    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλον
  choice: acamparam
  rationale: O verbo tem sentido militar de estabelecer acampamento; “acamparam” é direto e natural em português.
- source_word: ἐν τῷ αὐλῶνι
  choice: no vale
  rationale: Embora αὐλών também possa designar pátio em outros contextos, os acidentes geográficos e a fonte indicam aqui um vale ou depressão entre elevações.
- source_word: πλησίον Βαιτυλουὰ
  choice: perto de Betúlia
  rationale: Expressa de modo claro a proximidade espacial; o topônimo recebe a forma portuguesa tradicional.
- source_word: ἐπὶ τῆς πηγῆς
  choice: junto à fonte
  rationale: πηγή designa uma nascente ou fonte de água, e a preposição tem força locativa neste contexto.
- source_word: παρέτειναν
  choice: o acampamento se estendia
  rationale: O sujeito implícito é expresso naturalmente como o acampamento; a formulação descreve sua extensão sem sugerir uma nova ação militar distinta.
- source_word: εἰς εὖρος
  choice: em largura
  rationale: Mantém o contraste dimensional com εἰς μῆκος.
- source_word: ἐπὶ Δοθαειμ ἕως Βελβαΐμ
  choice: na direção de Dotaim até Belbaim
  rationale: ἐπί tem valor direcional, enquanto ἕως marca o limite da extensão.
- source_word: εἰς μῆκος
  choice: em comprimento
  rationale: Preserva a segunda dimensão do acampamento e equilibra “em largura”.
- source_word: ἕως Βαιτυλουὰ ἕως Κυαμῶνος
  choice: desde Betúlia até Cíamon
  rationale: A repetição de ἕως apresenta os limites do trecho; “desde... até...” torna a relação espacial inteligível em português sem alterar seu conteúdo.
- source_word: ἀπέναντι Ἐσδρηλών
  choice: diante de Esdrelom
  rationale: ἀπέναντι indica posição frontal ou oposta; “diante de” preserva essa relação sem pressupor separação específica por rio ou vale.
