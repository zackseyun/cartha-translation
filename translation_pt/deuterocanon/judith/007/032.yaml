  text: And he dispersed the people to their camp[a], and they went away to the walls and towers of their city, and he sent the women and children to their houses[b]; and they were in great humiliation in the city.
translation:
  language: pt
  text: E ele dispersou o povo para seu acampamento e foi[a] às muralhas e às torres da cidade deles; enviou as mulheres e as crianças para suas casas, e eles estavam em grande aflição na cidade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz o verbo no singular: “foi”. Pelo contexto, também é possível entender que o povo disperso se dirigiu às muralhas e às torres.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “grande humilhação” ou “profundo abatimento”. A expressão grega descreve a condição de quem foi reduzido a uma situação muito baixa, podendo indicar aflição, humilhação ou miséria.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκόρπισεν
  choice: dispersou
  rationale: Expressa a ação de separar e distribuir o povo, sem sugerir necessariamente fuga desordenada.
- source_word: λαόν
  choice: povo
  rationale: O termo abrange a população reunida, não apenas combatentes.
- source_word: παρεμβολήν
  choice: acampamento
  rationale: É o equivalente corrente e adequado ao contexto defensivo e militar.
- source_word: ἀπῆλθεν
  choice: foi
  rationale: Preserva o verbo singular do texto grego de Swete, sem resolver silenciosamente a possível dificuldade de concordância ou referência.
- source_word: τείχη
  choice: muralhas
  rationale: No contexto de uma cidade fortificada, 'muralhas' é mais específico e natural que o genérico 'muros'.
- source_word: πύργους
  choice: torres
  rationale: Traduz diretamente o termo arquitetônico sem acrescentar uma função não explicitada.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Comunica de modo claro e neutro que ele mandou mulheres e crianças para casa.
- source_word: ταπεινώσει πολλῇ
  choice: grande aflição
  rationale: No contexto de cerco e sofrimento coletivo, exprime naturalmente o estado de profunda desgraça e abatimento, preservando em nota a amplitude semântica da expressão.
