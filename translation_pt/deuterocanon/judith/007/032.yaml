revisions:
- from: Então ele dispersou o povo para o acampamento deles, e foi para as muralhas e as torres da cidade; enviou as mulheres e as crianças para suas casas, e havia grande aflição na cidade.[a]
  to: E ele dispersou o povo para seu acampamento e foi[a] às muralhas e às torres da cidade deles; enviou as mulheres e as crianças para suas casas, e eles estavam em grande aflição na cidade.[b]
  rationale: A revisão restaura os possessivos exigidos pelo grego sem fixar indevidamente a referência de ἑαυτοῦ, explicita αὐτῶν em «da cidade deles», retém o singular fonte em «foi» com nota de transparência e preserva o sujeito coletivo no desfecho.
