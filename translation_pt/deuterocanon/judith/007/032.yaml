translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. O singular de ἀπῆλθεν foi mantido para preservar a forma do texto-fonte e sua ambiguidade sintática; evitou-se importar a interpretação plural da camada inglesa. O possessivo em “deles” explicita o reflexivo ἑαυτοῦ segundo seu referente coletivo natural.
