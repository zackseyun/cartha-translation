  yaml_path: translation/deuterocanon/judith/007/022.yaml
  text: And their little children lost heart[a], and the women and the young men were failing from thirst, and they were falling in the squares of the city and in the passages of the gates[b], and there was no strength left in them.
translation:
  language: pt
  text: E as criancinhas perderam o ânimo[a]; as mulheres e os jovens desfaleciam de sede e caíam nas praças da cidade e nas passagens dos portões[b]. Já não lhes restava força alguma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficaram abatidos” ou “foram perdendo as forças”. O grego pode indicar desânimo ou enfraquecimento interior; o termo traduzido por “criancinhas” também pode incluir bebês.
    reason: lexical_alternative
  - marker: b
    text: Ou “nas ruas largas da cidade e nas passagens dos portões”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νήπια
  choice: as criancinhas
  rationale: O termo pode abranger crianças muito pequenas, inclusive bebês. “Criancinhas” preserva essa vulnerabilidade sem restringir a referência apenas a lactentes.
- source_word: ἠθύμησεν
  choice: perderam o ânimo
  rationale: Expressa abatimento ou perda de coragem. A formulação mantém o aspecto interior do colapso sem o reduzir a fraqueza física nem intensificá-lo como desespero absoluto.
- source_word: ἐξέλιπον
  choice: desfaleciam
  rationale: O imperfeito indica um processo em curso de perda de forças. “Desfaleciam” comunica o esgotamento físico causado pela sede sem necessariamente afirmar perda de consciência.
- source_word: ἀπὸ τῆς δίψης
  choice: de sede
  rationale: Expressão causal direta e natural em português.
- source_word: ἔπιπτον
  choice: caíam
  rationale: Preserva o aspecto imperfeito, sugerindo quedas repetidas ou contínuas durante a crise.
- source_word: πλατείαις
  choice: praças
  rationale: Designa espaços públicos amplos da cidade; “praças” é claro e natural, embora “ruas largas” também seja possível.
- source_word: διόδοις τῶν πυλῶν
  choice: passagens junto aos portões
  rationale: Comunica vias ou passagens associadas aos portões da cidade sem sugerir indevidamente apenas o vão interno de cada portão.
- source_word: κραταίωσις
  choice: força
  rationale: No contexto de sede e colapso físico, “força” traduz de modo claro a capacidade de resistir ou manter-se firme.
- source_word: οὐκ ἦν ... ἔτι ἐν αὐτοῖς
  choice: Já não lhes restava força alguma
  rationale: Formulação idiomática que preserva a negação, o valor temporal de ἔτι e a ideia de força interior remanescente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os imperfeitos “desfaleciam” e “caíam” preservam o caráter progressivo ou repetido das ações. A pontuação divide o longo período grego para facilitar a leitura sem alterar sua sequência.
