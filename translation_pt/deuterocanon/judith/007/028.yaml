base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/028.yaml
  text: We call heaven and earth and our God and Lord of our fathers to witness against you[a], who avenges us according to our sins and according to the sins of our fathers[b], that he may not act according to these words today.
translation:
  language: pt
  text: Invocamos contra vocês, como testemunhas, o céu, a terra e o nosso Deus e Senhor dos nossos pais[a], que nos pune segundo os nossos pecados e segundo os pecados dos nossos pais[b], para que hoje ele não proceda de acordo com estas palavras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “damos testemunho a vocês”. No contexto, o grego provavelmente indica a invocação formal do céu, da terra e de Deus como testemunhas contra os ouvintes.
    reason: lexical_alternative
  - marker: b
    text: 'O verbo grego tem aqui sentido punitivo: Deus executa justiça contra nós em correspondência com os pecados. Também pode ser traduzido: “que se vinga de nós segundo os nossos pecados e segundo os pecados dos nossos pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρόμεθα ὑμῖν
  choice: Invocamos contra vocês, como testemunhas
  rationale: 'A construção tem caráter formal e quase jurídico: céu, terra e Deus são chamados como testemunhas diante dos ouvintes. “Contra vocês” explicita a força contextual do dativo ὑμῖν, enquanto a nota preserva a formulação mais literal.'
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: o céu, a terra
  rationale: Mantém o merismo tradicional e natural em português, apresentando o céu e a terra como testemunhas cósmicas.
- source_word: τὸν θεὸν ἡμῶν καὶ κύριον τῶν πατέρων ἡμῶν
  choice: o nosso Deus e Senhor dos nossos pais
  rationale: Conserva os títulos coordenados e a referência única indicada pela oração relativa singular que segue. “Senhor” preserva o valor de κύριος como título divino.
- source_word: ἐκδικεῖ
  choice: retribui
  rationale: O verbo exprime a execução da justiça ou retribuição. Neste contexto, a relação com os pecados torna evidente o sentido punitivo, sem reduzir o campo lexical à simples ideia de vingança.
- source_word: κατὰ τὰς ἁμαρτίας ἡμῶν καὶ κατὰ τὰ ἁμαρτήματα τῶν πατέρων ἡμῶν
  choice: segundo os nossos pecados e segundo os pecados dos nossos pais
  rationale: “Segundo” preserva a ideia de correspondência ou medida expressa por κατά. Os dois substantivos gregos próximos em sentido são vertidos naturalmente por “pecados”.
- source_word: ἵνα μὴ ποιήσῃ
  choice: para que ... ele não proceda
  rationale: Mantém a forma de finalidade ou resultado negativo sem decidir além do grego a relação lógica exata com a invocação precedente.
- source_word: κατὰ τὰ ῥήματα ταῦτα
  choice: de acordo com estas palavras
  rationale: Preserva a referência às declarações imediatamente anteriores e a construção de conformidade com κατά.
- source_word: ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: hoje
  rationale: Forma idiomática e direta em português para a expressão temporal enfática grega.
theological_decisions:
- issue: Valor de κύριος como título divino
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” é o equivalente tradicional e semanticamente adequado neste contexto, ligado a Deus e aos antepassados, sem introduzir uma interpretação denominacional.
- issue: Sentido do juízo divino em ἐκδικεῖ ... κατὰ τὰς ἁμαρτίας
  choice: que nos retribui segundo os nossos pecados
  alternative: que nos pune por nossos pecados
  rationale: A escolha conserva a noção de justiça retributiva e a relação de medida expressa por κατά. A nota esclarece o sentido punitivo para evitar que “retribui” seja entendido como recompensa favorável.
- issue: Relação lógica de ἵνα μὴ ποιήσῃ com a invocação
  choice: para que hoje ele não proceda
  alternative: para que não faça hoje
  rationale: A tradução conserva a oração final negativa do grego e não resolve a tensão ou possível estranheza da sequência argumentativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação mantém o tom solene de uma declaração pública. “Vocês” oferece clareza internacional com boa legibilidade brasileira; “pais” conserva a referência tradicional aos antepassados.
