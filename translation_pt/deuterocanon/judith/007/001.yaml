base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/001.yaml
  text: On the next day Holofernes ordered all his army and all his people who had come for his alliance to break camp for Bethulia[a], to seize the passes of the hill country in advance[b], and to make war against the sons of Israel.
translation:
  language: pt
  text: No dia seguinte, Holofernes ordenou a todo o seu exército e a todo o seu povo, que havia vindo para se aliar a ele[a], que levantassem acampamento rumo a Betúlia, ocupassem de antemão os acessos à região montanhosa e fizessem guerra contra os filhos de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que havia vindo como aliado dele”. O grego diz literalmente “que havia vindo para a sua aliança”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os israelitas”. O grego traz “os filhos de Israel”, preservando a designação familiar tradicional.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: No dia seguinte
  rationale: Expressão temporal natural em português, que preserva a sequência narrativa.
- source_word: παρήγγειλεν
  choice: ordenou
  rationale: Verbo conciso e adequado ao contexto de uma ordem militar autoritativa.
- source_word: πάσῃ τῇ στρατείᾳ αὐτοῦ
  choice: a todo o seu exército
  rationale: στρατεία designa aqui o contingente militar, não uma campanha.
- source_word: παντὶ τῷ λαῷ αὐτοῦ
  choice: a todo o seu povo
  rationale: Mantém o sentido mais amplo de λαός, sem reduzi-lo necessariamente a soldados.
- source_word: οἳ παρεγένοντο ἐπὶ τὴν συμμαχίαν αὐτοῦ
  choice: que tinha vindo para a sua aliança
  rationale: Preserva de perto a formulação e a leve ambiguidade do grego, sem explicitar além do necessário se vieram integrar a aliança ou atuar como aliados.
- source_word: ἀναζευγνύειν
  choice: que levantassem acampamento
  rationale: No uso militar, indica desfazer o acampamento para partir.
- source_word: ἐπὶ Βαιτυλουὰ
  choice: rumo a Betúlia
  rationale: Com verbo de movimento, ἐπί indica direção; a hostilidade já fica clara no restante do versículo.
- source_word: τὰς ἀναβάσεις τῆς ὀρεινῆς
  choice: os acessos à região montanhosa
  rationale: Comunica em português corrente as rotas ascendentes ou entradas estratégicas da área elevada.
- source_word: προκαταλαμβάνεσθαι
  choice: ocupassem de antemão
  rationale: Preserva tanto a tomada militar quanto o sentido antecipatório do verbo composto.
- source_word: ποιεῖν πόλεμον πρὸς
  choice: fizessem guerra contra
  rationale: Reproduz de modo formal, claro e idiomático a construção grega.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: os filhos de Israel
  rationale: Conserva a designação familiar tradicional do texto grego, sem substituí-la silenciosamente pelo gentílico.
theological_decisions:
- issue: Designação étnico-pactual τοὺς υἱοὺς Ἰσραήλ
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A expressão familiar masculina é mantida como idioma bíblico tradicional; a alternativa mais fluida é registrada em nota, sem eliminar a forma do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém o tom narrativo-militar e preserva a formulação incomum relativa à aliança, explicando-a em nota. Os marcadores foram posicionados junto às expressões efetivamente comentadas.
