base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/024.yaml
  text: May God judge between you and us[a], because you have done us great injustice by not speaking peaceably with the sons of Asshur.
translation:
  language: pt
  text: Que Deus julgue entre vocês e nós, pois vocês cometeram uma grande injustiça contra nós por não terem falado pacificamente com os filhos de Assur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com os assírios”. O grego diz literalmente “com os filhos de Assur”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κρῖναι
  choice: Que ... julgue
  rationale: O optativo aoristo expressa um desejo ou apelo; “Que Deus julgue” comunica naturalmente essa força volitiva em português.
- source_word: ἀνὰ μέσον ὑμῶν καὶ ἡμῶν
  choice: entre vocês e nós
  rationale: É a expressão idiomática de adjudicação entre duas partes e preserva a ordem dos grupos no grego.
- source_word: ἐποιήσατε ἐν ἡμῖν ἀδικίαν μεγάλην
  choice: vocês cometeram uma grande injustiça contra nós
  rationale: Mantém a força moral e quase jurídica de ἀδικία e expressa de modo corrente a relação indicada por ἐν ἡμῖν.
- source_word: οὐ λαλήσαντες εἰρηνικὰ
  choice: ao não falarem de paz
  rationale: O particípio indica em que consistiu a injustiça; “falar de paz” conserva a ideia verbal e o conteúdo pacífico sem restringi-lo indevidamente a uma proposta formal.
- source_word: μετὰ υἱῶν Ἀσσούρ
  choice: com os filhos de Assur
  rationale: Reproduz a formulação literal do grego e translitera o nome próprio, deixando em nota o sentido étnico possível.
theological_decisions:
- issue: Fórmula de apelo ao juízo divino
  choice: Que Deus julgue entre vocês e nós
  alternative: Deus julgue entre vocês e nós
  rationale: A construção é um apelo a Deus como árbitro. A tradução preserva sua força de desejo ou invocação sem transformá-la em afirmação doutrinária nem em ordem direta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. “Assur” preserva o nome próprio da expressão grega, enquanto a nota oferece a identificação étnica natural.
