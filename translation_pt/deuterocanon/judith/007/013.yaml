lexical_decisions:
- source_word: διότι
  choice: pois
  rationale: Introduz a razão da estratégia apresentada anteriormente, preservando de modo natural a relação explicativa.
- source_word: ἐκεῖθεν ὑδρεύονται
  choice: é dali que ... tiram água
  rationale: Expressa com clareza tanto a origem da água quanto a ação concreta de obtê-la.
- source_word: πάντες οἱ κατοικοῦντες Βαιτυλουά
  choice: todos os habitantes de Baitulua
  rationale: Preserva o alcance universal e verte a expressão participial em português corrente.
- source_word: Βαιτυλουά
  choice: Baitulua
  rationale: Translitera diretamente a forma grega, com grafia legível em português, em vez de adotar automaticamente a forma tradicional Betúlia.
- source_word: ἀνελεῖ αὐτοὺς ἡ δίψα
  choice: A sede os matará
  rationale: Mantém a sede como agente personificado e comunica diretamente o sentido letal de ἀναιρέω no contexto.
- source_word: ἐκδώσουσι τὴν πόλιν αὐτῶν
  choice: eles entregarão a sua cidade
  rationale: Preserva o verbo concreto 'entregar' e evita tornar explícito um destinatário não expresso no grego; no contexto militar, a frase implica rendição.
- source_word: ἀναβησόμεθα
  choice: subiremos
  rationale: Conserva o movimento ascendente sem acrescentar a ideia específica de marcha militar.
- source_word: ἐπὶ τὰς πλησίον κορυφὰς τῶν ὀρέων
  choice: aos cumes próximos das montanhas
  rationale: Mantém os elementos topográficos do original e a relação de proximidade, sem converter πλησίον em superlativo.
