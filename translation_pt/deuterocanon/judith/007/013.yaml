translation:
  language: pt
  text: pois é dali que todos os habitantes de Baitulua tiram água[a]. A sede os matará, e eles entregarão a sua cidade; e nós e o nosso povo subiremos aos cumes próximos das montanhas,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Muitas traduções tradicionais trazem o nome do lugar como “Betúlia”; a forma grega aqui é Βαιτυλουά (Baitulua).
