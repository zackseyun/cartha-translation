base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/029.yaml
  text: And there was great weeping in the midst of the whole assembly[a], all together, and they cried out to the Lord God with a loud voice.
translation:
  language: pt
  text: Então houve grande choro no meio de toda a assembleia[a], e todos juntos clamaram ao Senhor Deus em alta voz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “congregação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: houve
  rationale: Expressa de modo idiomático em português a fórmula narrativa existencial grega, sem o peso artificial de uma tradução como “veio a acontecer”.
- source_word: κλαυθμὸς μέγας
  choice: grande choro
  rationale: Preserva tanto a ideia concreta de choro quanto a intensidade indicada por μέγας.
- source_word: ἐν μέσῳ τῆς ἐκκλησίας
  choice: no meio de toda a assembleia
  rationale: “Assembleia” designa naturalmente a comunidade reunida e evita a associação anacrônica de ἐκκλησία com uma instituição cristã posterior; “no meio de” mantém a dimensão coletiva e espacial da expressão.
- source_word: πάντων ὁμοθυμαδόν
  choice: todos juntos
  rationale: Comunica a participação de todos e a ação conjunta, sem impor a noção mais específica de unanimidade intelectual.
- source_word: ἐβόησαν
  choice: clamaram
  rationale: No contexto de súplica dirigida a Deus, “clamaram” transmite apelo urgente e voz elevada de modo natural e digno.
- source_word: πρὸς Κύριον τὸν θεὸν
  choice: ao Senhor Deus
  rationale: Reproduz de modo corrente a referência divina e mantém κύριος como “Senhor”.
- source_word: φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: É a formulação idiomática portuguesa para uma emissão vocal forte, preservando a intensidade de μεγάλῃ.
theological_decisions:
- issue: Tradução de κύριος
  choice: Senhor
  alternative: SENHOR
  rationale: “Senhor” traduz diretamente κύριος no contexto da oração, sem introduzir por tipografia uma identificação textual que o grego apresentado não explicita.
- issue: Tradução de ἐκκλησία
  choice: assembleia
  alternative: congregação
  rationale: Aqui o termo se refere ao povo reunido, não à igreja cristã como instituição posterior; “assembleia” conserva esse sentido comunitário sem anacronismo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A coordenação “e todos juntos clamaram” torna explícita, de forma natural, a ação coletiva expressa por πάντων ὁμοθυμαδόν, sem eliminar sua ênfase.
