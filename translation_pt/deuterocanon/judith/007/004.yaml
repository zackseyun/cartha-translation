base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/004.yaml
  text: But the sons of Israel[a], when they saw their great number, were greatly troubled, and each said to his neighbor, “Now these men will lick up the whole face of the land[b], and neither the high mountains nor the ravines nor the hills will bear their weight.”
translation:
  language: pt
  text: 'Mas os filhos de Israel, quando viram a multidão deles, ficaram muito perturbados, e cada um disse ao seu próximo: “Agora estes lamberão[a] toda a face da terra[b], e nem as altas montanhas, nem os desfiladeiros, nem as colinas suportarão o peso deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais interpretativo, “consumirão”. O verbo grego significa literalmente “lamber completamente” ou “lamber até acabar”, numa imagem de devastação total.
    reason: lexical_alternative
  - marker: b
    text: “Face da terra” significa a superfície ou extensão da terra. O termo grego também pode ser traduzido por “país” ou “território”, conforme o contexto.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ Ἰσραήλ
  choice: Mas os filhos de Israel
  rationale: Mantém de perto o idioma grego e o registro bíblico, sem substituir a expressão por «israelitas».
- source_word: ὡς ἴδον αὐτῶν τὸ πλῆθος
  choice: quando viram a multidão deles
  rationale: πλῆθος indica uma multidão ou grande contingente; «multidão» comunica a dimensão ameaçadora do exército.
- source_word: ἐταράχθησαν σφόδρα
  choice: ficaram muito perturbados
  rationale: Preserva a ideia de forte agitação e inquietação sem intensificá-la indevidamente para «ficaram apavorados».
- source_word: ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  choice: cada um disse ao seu próximo
  rationale: Reproduz a construção distributiva e o sentido de alguém que está perto, em registro bíblico ainda compreensível.
- source_word: Νῦν ἐκλείξουσιν οὗτοι
  choice: Agora estes lamberão
  rationale: Conserva a metáfora vívida de ἐκλείχω, literalmente «lamber completamente», em vez de reduzi-la interpretativamente a «consumirão».
- source_word: τὸ πρόσωπον τῆς γῆς πάσης
  choice: toda a face da terra
  rationale: Preserva a imagem semítica da superfície ou extensão da terra e mantém a possível amplitude de γῆ.
- source_word: οὔτε τὰ ὄρη τὰ ὑψηλὰ οὔτε αἱ φάραγγες οὔτε οἱ βουνοί
  choice: nem as altas montanhas, nem os desfiladeiros, nem as colinas
  rationale: Mantém distintos os três tipos de relevo; φάραγγες designa desfiladeiros ou ravinas, não vales amplos.
- source_word: ὑποστήσονται τὸ βάρος αὐτῶν
  choice: suportarão o peso deles
  rationale: Expressa a ideia de resistir ou sustentar sob pressão e preserva a imagem do peso de um exército imenso.
