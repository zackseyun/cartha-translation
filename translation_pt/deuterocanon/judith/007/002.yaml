base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/002.yaml
  text: And on that day every one of their mighty men broke camp[a]; and their fighting force of warrior men was one hundred seventy thousand foot soldiers and twelve thousand horsemen, besides the baggage train of the men who were on foot among them[b], a very great multitude.
translation:
  language: pt
  text: Naquele dia, cada um dos seus homens valentes levantou acampamento[a]. Sua força de homens de guerra era de cento e setenta mil soldados de infantaria e doze mil cavaleiros, além da bagagem dos homens que estavam a pé entre eles — homens que formavam uma multidão muito grande[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “partiu” ou “pôs-se em marcha”. O verbo grego pode indicar tanto levantar acampamento quanto partir dele.
    reason: lexical_alternative
  - marker: b
    text: A construção grega desta cláusula é sintaticamente difícil. Ela parece referir-se a muitos homens a pé associados à bagagem, além dos totais de combatentes já mencionados, mas a relação exata entre a bagagem e esses homens permanece incerta.
    reason: textual_difficulty
lexical_decisions:
- source_word: ἀνέζευξεν
  choice: levantou acampamento
  rationale: O verbo indica levantar ou desfazer o acampamento para partir. A expressão escolhida preserva o cenário militar e é natural em português.
- source_word: πᾶς ἀνὴρ δυνατὸς αὐτῶν
  choice: cada um dos seus homens valentes
  rationale: Mantém a referência individual e masculina de πᾶς ἀνήρ, enquanto “valentes” comunica capacidade e valor no contexto militar sem reduzir a expressão a uma categoria técnica.
- source_word: ἡ δύναμις αὐτῶν
  choice: sua força
  rationale: No contexto da contagem de tropas, δύναμις designa a força militar; “força” conserva a formulação do grego sem impor a noção mais institucional de “exército”.
- source_word: ἀνδρῶν πολεμιστῶν
  choice: de homens de guerra
  rationale: Reproduz os dois elementos da expressão grega e comunica claramente o caráter combatente desses homens em registro bíblico digno e compreensível.
- source_word: πεζῶν
  choice: soldados de infantaria
  rationale: No total militar e em contraste com os cavaleiros, o termo se refere aos combatentes a pé.
- source_word: ἵππων
  choice: cavaleiros
  rationale: Embora a forma grega signifique literalmente “cavalos”, a enumeração paralela à infantaria aponta para tropas montadas; “cavaleiros” expressa isso naturalmente.
- source_word: χωρὶς τῆς ἀποσκευῆς
  choice: além da bagagem
  rationale: ἀποσκευή refere-se à bagagem ou aos equipamentos que acompanhavam a força militar. A tradução evita especificar indevidamente a organização de um comboio.
- source_word: τῶν ἀνδρῶν οἳ ἦσαν πεζοὶ ἐν αὐτοῖς
  choice: dos homens que estavam a pé entre eles
  rationale: Segue de perto a difícil construção genitiva e preserva sua ambiguidade, sem identificar à força esses homens com a infantaria já contada ou com um corpo de apoio definido.
- source_word: πλῆθος πολὺ σφόδρα
  choice: uma multidão muito grande
  rationale: Preserva a forte intensificação quantitativa do grego em linguagem clara e digna.
