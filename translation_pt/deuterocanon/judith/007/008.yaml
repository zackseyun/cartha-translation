  text: And all the rulers of the sons of Esau[a], and all the leaders of the people of Moab, and the generals of the seacoast came to him and said[b],
translation:
  language: pt
  text: 'E todos os governantes dos filhos de Esaú[a], todos os líderes do povo de Moabe e os comandantes da região costeira[b] aproximaram-se dele e disseram:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “edomitas”. A expressão grega diz literalmente “filhos de Esaú”.'
