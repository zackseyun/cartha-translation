    text: 'Ou: “litoral”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: aproximaram-se dele
  rationale: O particípio aoristo de προσέρχομαι expressa movimento em direção à pessoa mencionada e, em português natural, pode ser coordenado com o verbo principal.
- source_word: ἄρχοντες
  choice: governantes
  rationale: Indica pessoas investidas de autoridade e mantém distinção em relação a ἡγούμενοι.
- source_word: υἱῶν Ἠσαῦ
  choice: filhos de Esaú
  rationale: Preserva a designação étnica literal do grego, sem substituí-la silenciosamente pelo equivalente interpretativo 'edomitas'.
- source_word: ἡγούμενοι
  choice: líderes
  rationale: Expressa quem exerce liderança e mantém uma distinção natural em relação a 'governantes'.
- source_word: λαοῦ Μωὰβ
  choice: povo de Moabe
  rationale: Reproduz de modo claro e direto a construção genitiva grega.
- source_word: στρατηγοὶ
  choice: comandantes
  rationale: Designa autoridades militares; 'comandantes' é claro, atual e não impõe uma patente moderna específica.
- source_word: παραλίας
  choice: região costeira
  rationale: O substantivo se refere à costa ou faixa litorânea; 'região costeira' preserva o sentido geográfico amplo.
- source_word: εἶπαν
  choice: disseram
  rationale: Equivalente narrativo direto e corrente para o verbo de fala.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação verbal evita uma construção participial rígida. 'Comandantes' foi preferido a 'generais' para não atribuir ao termo grego uma patente militar moderna excessivamente específica.
