lexical_decisions:
- source_word: ἐπικαλέσασθε
  choice: chamem-nos
  rationale: Reproduz de modo natural o imperativo aoristo médio no contexto, em que se manda chamar as pessoas anteriormente mencionadas.
- source_word: ἔκδοθε
  choice: entreguem
  rationale: Expressa diretamente a ordem de pôr a cidade nas mãos do inimigo.
- source_word: εἰς προνομήν
  choice: para ser saqueada
  rationale: 'Comunica a finalidade indicada pela expressão grega: entregar a cidade para pilhagem ou saque.'
- source_word: τῷ λαῷ Ὁλοφέρνου
  choice: pelo povo de Holofernes
  rationale: Mantém o substantivo λαός e a relação genitiva com Holofernes; a voz passiva em português exige 'pelo'.
- source_word: πάσῃ τῇ δυνάμει αὐτοῦ
  choice: por todo o seu exército
  rationale: Neste contexto militar, δύναμις designa a força armada de Holofernes; 'exército' é claro e idiomático.
