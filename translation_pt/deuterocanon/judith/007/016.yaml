  text: E as palavras deles agradaram a Holofernes e a todos os seus servidores, e ele ordenou que se fizesse conforme haviam dito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρεσαν
  choice: agradaram
  rationale: O aoristo de ἀρέσκω indica que as palavras receberam uma avaliação favorável; “agradaram” preserva de modo natural a construção pessoal do grego.
- source_word: οἱ λόγοι αὐτῶν
  choice: as palavras deles
  rationale: Mantém a formulação concreta do grego, embora no contexto se refira ao conteúdo do conselho apresentado.
- source_word: θεραπόντων
  choice: auxiliares
  rationale: No ambiente militar e de corte, θεράπων designa pessoas a serviço próximo de um superior. “Auxiliares” evita sugerir necessariamente servidão doméstica ou escravidão.
- source_word: συνέταξε
  choice: ordenou
  rationale: Neste contexto, συντάσσω expressa uma determinação autoritativa para que algo seja executado; “ordenou” é direto e idiomático.
- source_word: ποιεῖν καθὰ ἐλάλησαν
  choice: que se fizesse conforme haviam dito
  rationale: A construção impessoal natural em português conserva o conteúdo da ordem sem inserir um agente que o grego não explicita; “conforme haviam dito” representa καθὰ ἐλάλησαν.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente e proximidade ao grego. “Haviam dito” explicita naturalmente que a fala antecedeu a ordem, sem alterar a sequência narrativa.
