  yaml_path: translation/deuterocanon/judith/007/017.yaml
  text: And the camp of the sons of Ammon moved on[a], and with them five thousand sons of Asshur[c][b], and they encamped in the valley and seized the waters and the springs of water of the sons of Israel.
translation:
  language: pt
  text: Então o acampamento dos filhos de Amom partiu e, com eles, cinco mil filhos de Assur[a]; acamparam no vale[b] e tomaram previamente posse[c] das águas e das fontes de água dos filhos de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “assírios”. O grego diz literalmente “filhos de Assur”.
    reason: lexical_alternative
  - marker: b
    text: O termo grego também pode designar uma depressão, garganta ou planície cercada, conforme o terreno.
    reason: lexical_alternative
  - marker: c
    text: Ou “ocuparam antes” ou “garantiram de antemão”; o verbo sugere a tomada estratégica das fontes de água.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν
  choice: partiu
  rationale: No contexto de deslocamento militar, indica que o acampamento levantou-se e seguiu adiante; “partiu” é natural e não acrescenta uma ideia explícita de ataque.
- source_word: ἡ παρεμβολὴ
  choice: o acampamento
  rationale: O substantivo pode designar tanto o acampamento quanto a força acampada; “acampamento” preserva essa amplitude no contexto militar.
- source_word: υἱῶν Ἀμμών
  choice: dos filhos de Amom
  rationale: Mantém a construção etnônima literal do grego e cria correspondência com “filhos de Israel” no fim do versículo.
- source_word: χιλιάδες πέντε υἱῶν Ἀσσούρ
  choice: cinco mil filhos de Assur
  rationale: Preserva a forma do etnônimo no texto grego, sem identificar de modo excessivamente específico o grupo como os assírios históricos.
- source_word: παρενέβαλον
  choice: acamparam
  rationale: É o equivalente militar corrente e claro para estabelecer acampamento.
- source_word: ἐν τῷ αὐλῶνι
  choice: no vale
  rationale: Neste contexto geográfico, αὐλών designa uma depressão alongada, vale ou garganta; “vale” é a opção mais clara e abrangente.
- source_word: προκατελάβοντο
  choice: se apoderaram antecipadamente
  rationale: O composto verbal expressa tomar ou ocupar antes, com valor estratégico; a tradução conserva essa nuance, que “tomaram” ou “se apoderaram” isoladamente perderia.
- source_word: τὰ ὕδατα καὶ τὰς πηγὰς τῶν ὑδάτων
  choice: das águas e das fontes de água
  rationale: Conserva a expressão dupla do grego, distinguindo as águas de suas nascentes ou fontes.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: dos filhos de Israel
  rationale: Preserva a construção étnica e a relação genitiva do original, em paralelo com “filhos de Amom”.
