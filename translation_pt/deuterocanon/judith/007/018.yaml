base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/018.yaml
  text: And the sons of Esau and the sons of Ammon went up and camped in the hill country opposite Dothaim[a], and they sent some of their men toward the south and east, opposite Egrebel, which is near Chous, which is on the wadi Mochmour. And the rest of the Assyrian army camped on the plain and covered the whole face of the land, and their tents and their baggage were encamped in a very great multitude[b], and they were exceedingly numerous.
translation:
  language: pt
  text: E os filhos de Esaú e os filhos de Amom subiram e acamparam na região montanhosa diante de Dotaim. Enviaram alguns dos seus homens para o sul e para o leste, diante de Egrebel, que fica perto de Chous, junto ao uádi[a] de Mochmour. O restante do exército dos assírios acampou na planície e cobriu toda a face da terra. Suas tendas e bagagens estavam reunidas em grande multidão, e a força era extremamente numerosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Uádi” é o leito de um curso de água sazonal; também se pode traduzir por “torrente” ou “ribeiro”.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέβησαν
  choice: subiram
  rationale: Preserva o sentido espacial do verbo grego, adequado à menção imediata da região montanhosa, sem convertê-lo desnecessariamente em termo militar técnico.
- source_word: οἱ υἱοὶ Ἡσαῦ καὶ οἱ υἱοὶ Ἀμμών
  choice: os filhos de Esaú e os filhos de Amom
  rationale: Mantém a designação gentílica literal do grego e seu paralelismo, sem substituí-la silenciosamente por edomitas e amonitas.
- source_word: παρενέβαλον
  choice: acamparam
  rationale: Expressa de modo natural o estabelecimento de um acampamento militar.
- source_word: ἐν τῷ ὄρει
  choice: na região montanhosa
  rationale: O singular grego pode designar terreno elevado ou montanhoso, não necessariamente um único monte.
- source_word: ἀπέναντι Δωθαείμ
  choice: diante de Dotaim
  rationale: Comunica a posição em frente ou no lado oposto a Dotaim sem especificar uma distância não indicada.
- source_word: ἀπέστειλαν ἐξ αὐτῶν
  choice: Enviaram alguns dos seus homens
  rationale: Torna explícito em português o referente militar implícito na expressão literal 'enviaram dentre eles'.
- source_word: πρὸς νότον καὶ ἀπηλιώτην
  choice: para o sul e para o leste
  rationale: Usa os pontos cardeais correntes; ἀπηλιώτης designa o leste, direção do nascer do sol.
- source_word: χειμάρρου
  choice: uádi
  rationale: Designa com precisão um leito ou curso de água sazonal característico da geografia regional; a nota esclarece o termo.
- source_word: ἡ λοιπὴ στρατεία τῶν Ἀσσυρίων
  choice: O restante do exército dos assírios
  rationale: στρατεία refere-se aqui à força militar, e 'exército' é o equivalente moderno mais claro.
- source_word: ἐν τῷ πεδίῳ
  choice: na planície
  rationale: πεδίον indica terreno plano ou planície.
- source_word: κατεστρατοπέδευσαν ἐν ὄχλῳ πολλῷ
  choice: formavam um acampamento imenso
  rationale: Reproduz idiomaticamente a imagem de tendas e bagagens acampadas em enorme concentração, evitando a construção pouco natural de atribuir literalmente a elas o ato de acampar.
- source_word: ἦσαν εἰς πλῆθος πολὺ σφόδρα
  choice: eles eram muitíssimo numerosos
  rationale: Preserva a intensificação enfática do grego e entende o sujeito pelo contexto como as forças reunidas.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se os etnônimos na forma literal ''filhos de'' e transliterações próximas ao grego: Dotaim, Egrebel, Chous e Mochmour. A sintaxe foi moderadamente ajustada para evitar um período excessivamente longo, sem perder a progressão geográfica e militar do original.'
