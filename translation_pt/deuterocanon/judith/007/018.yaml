revisions:
- from: E os filhos de Esaú e os filhos de Amom subiram e acamparam na região montanhosa diante de Dotaim. Enviaram alguns dos seus homens para o sul e para o leste, diante de Egrebel, que fica perto de Chous, junto ao uádi[a] de Mochmour. O restante do exército dos assírios acampou na planície e cobriu toda a face da terra. Suas tendas e bagagens formavam um acampamento imenso, e eles eram muitíssimo numerosos.
  to: E os filhos de Esaú e os filhos de Amom subiram e acamparam na região montanhosa diante de Dotaim. Enviaram alguns dos seus homens para o sul e para o leste, diante de Egrebel, que fica perto de Chous, junto ao uádi[a] de Mochmour. O restante do exército dos assírios acampou na planície e cobriu toda a face da terra. Suas tendas e bagagens estavam reunidas em grande multidão, e a força era extremamente numerosa.
