base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/019.yaml
  text: And the sons of Israel cried out to the Lord their God[a], because their spirit had grown faint[b], because all their enemies had surrounded them and there was no escape from among them.
translation:
  language: pt
  text: E os filhos de Israel[a] clamaram ao Senhor, seu Deus, porque o espírito deles havia desfalecido[b], pois todos os seus inimigos os tinham cercado, e não havia como escapar do meio deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O grego diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “havia perdido o ânimo” ou “havia ficado desanimado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar masculina do grego e sua ressonância bíblica; a alternativa mais corrente, “os israelitas”, é registrada em nota.
- source_word: ἀνεβόησαν
  choice: clamaram
  rationale: No contexto de aflição e apelo dirigido a Deus, “clamaram” comunica tanto a intensidade da voz quanto o caráter de súplica.
- source_word: Κύριον θεὸν αὐτῶν
  choice: ao Senhor, seu Deus
  rationale: Mantém κύριος como título divino, “Senhor”, e reproduz naturalmente em português a relação possessiva da expressão grega.
- source_word: ὠλιγοψύχησεν τὸ πνεῦμα αὐτῶν
  choice: o espírito deles havia desfalecido
  rationale: Conserva a imagem do texto grego, que fala literalmente do espírito, e expressa a perda de ânimo sem reduzi-la apenas a uma formulação psicológica.
- source_word: ἐκύκλωσαν πάντες οἱ ἐχθροὶ αὐτῶν
  choice: todos os seus inimigos os tinham cercado
  rationale: “Cercado” exprime com naturalidade o cerco completo indicado pelo verbo; o mais-que-perfeito composto mostra que essa situação já existia quando clamaram.
- source_word: οὐκ ἦν διαφυγεῖν ἐκ μέσου αὐτῶν
  choice: não havia como escapar do meio deles
  rationale: Reproduz de modo idiomático a construção impessoal e o sentido de impossibilidade, mantendo a imagem de estarem presos no meio dos inimigos.
theological_decisions:
- issue: Tradução de κύριος como título divino
  choice: Senhor
  alternative: Soberano
  rationale: Neste apelo a Deus, κύριος funciona como título divino; “Senhor” é a tradução portuguesa tradicional e semanticamente adequada.
- issue: Expressão coletiva masculina οἱ υἱοὶ Ἰσραήλ
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A opção principal preserva a formulação familiar explícita do grego sem excluir da narrativa o conjunto do povo; a forma coletiva mais fluente é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A redação conserva a imagem grega do espírito que desfalece e a expressão bíblica “filhos de Israel”, esclarecendo em notas alternativas mais correntes.
