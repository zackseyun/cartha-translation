base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/010.yaml
  text: For this people[a], the sons of Israel, do not rely on their spears, but on the heights of their mountains, in which they themselves dwell[b]; for it is not easy to approach the summits of their mountains.
translation:
  language: pt
  text: Pois este povo, os filhos de Israel[a], não confia em suas lanças, mas nas elevações de suas montanhas, onde eles mesmos habitam; pois não é fácil chegar aos cumes de suas montanhas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O grego diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “aproximar-se dos cumes de suas montanhas” ou “subir até os cumes de suas montanhas”. O verbo grego pode indicar aproximar-se ou avançar para um lugar elevado.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαὸς
  choice: povo
  rationale: “Povo” é o equivalente coletivo mais natural no contexto e mantém a referência a um grupo nacional sem a nuance política mais marcada de “nação”.
- source_word: υἱῶν Ἰσραήλ
  choice: filhos de Israel
  rationale: Reproduz de perto a expressão grega e preserva a forma masculina plural da fonte; “israelitas” seria mais idiomático, porém menos formalmente correspondente.
- source_word: οὐ πέποιθαν ἐπὶ τοῖς δόρασιν αὐτῶν
  choice: não confia em suas lanças
  rationale: O perfeito πέποιθαν expressa confiança estabelecida; no português corrente, “não confia” comunica naturalmente esse estado. δόρασιν designa especificamente lanças.
- source_word: ἀλλʼ ἐπὶ τοῖς ὕψεσι τῶν ὀρέων αὐτῶν
  choice: mas nas elevações de suas montanhas
  rationale: “Elevações” preserva o sentido topográfico de ὕψεσι e evita possíveis conotações cultuais de “lugares altos”.
- source_word: ἐν οἷς αὐτοὶ ἐνοικοῦσιν ἐν αὐτοῖς
  choice: onde eles mesmos habitam
  rationale: Conserva a ênfase de αὐτοὶ por meio de “eles mesmos”, mas evita reproduzir de modo artificial a redundância preposicional grega.
- source_word: οὐ γὰρ ἔστιν εὐχερὲς
  choice: pois não é fácil
  rationale: Equivalente direto, claro e natural de εὐχερές no contexto de uma avaliação militar.
- source_word: προσβῆναι
  choice: subir até
  rationale: No contexto de montanhas, o verbo indica avançar em direção a terreno elevado. “Subir até” torna explícito esse componente espacial sem introduzir a ideia não expressa de ataque.
- source_word: ταῖς κορυφαῖς τῶν ὀρέων αὐτῶν
  choice: o topo de suas montanhas
  rationale: κορυφαῖς refere-se aos cumes ou pontos mais altos. O singular coletivo “o topo” é natural em português, embora o grego empregue o plural.
