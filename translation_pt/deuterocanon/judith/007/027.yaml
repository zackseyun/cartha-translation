base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/027.yaml
  text: For it is better for us to become plunder for them[a]; for we will become slaves, and our lives will be spared, and we will not see with our own eyes the death of our little children[d][c][b], and our wives and our children breathing out their lives.
translation:
  language: pt
  text: Pois é melhor sermos tomados por eles como despojo[a], pois seremos escravos, nossa vida será poupada[b], e não veremos com os nossos próprios olhos[c] a morte de nossas criancinhas, nem nossas mulheres e nossos filhos perdendo a vida[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «como presa» ou «como saque».
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «nossa vida viverá»; a expressão significa que nós permaneceríamos vivos.
    reason: lexical_alternative
  - marker: c
    text: Ou «diante dos nossos olhos».
    reason: lexical_alternative
  - marker: d
    text: Mais literalmente, «nossas mulheres e nossos filhos tendo suas vidas se extinguido»; isto é, morrendo diante de nós.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  choice: é melhor
  rationale: Expressa de modo direto e natural a comparação de vantagem feita pelos falantes em uma situação extrema.
- source_word: γενηθῆναι αὐτοῖς εἰς διαρπαγήν
  choice: sermos tomados por eles como despojo
  rationale: Comunica que eles se tornariam despojo dos conquistadores, preservando a dureza da imagem grega sem recorrer à formulação pouco natural «tornarmo-nos despojo para eles».
- source_word: διαρπαγήν
  choice: despojo
  rationale: Designa aquilo que é apreendido e levado pelo vencedor; «despojo» é corrente, digno e adequado ao contexto de conquista.
- source_word: δούλους
  choice: escravos
  rationale: O contexto é de submissão forçada após uma rendição, não de serviço voluntário; «escravos» explicita corretamente essa condição coercitiva.
- source_word: ζήσεται ἡ ψυχὴ ἡμῶν
  choice: continuaremos vivos
  rationale: A expressão, literalmente «nossa vida/alma viverá», é idiomática e indica preservação da vida. A escolha é natural em português e mantém o contraste com a morte.
- source_word: τῶν νηπίων ἡμῶν
  choice: de nossas criancinhas
  rationale: νήπια se refere a crianças muito pequenas, possivelmente bebês. «Criancinhas» preserva tanto a faixa etária ampla quanto a carga afetiva do contexto.
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: com os nossos próprios olhos
  rationale: Reproduz idiomaticamente a ênfase em testemunhar pessoalmente a cena.
- source_word: ἐκλειπούσας τὰς ψυχὰς αὐτῶν
  choice: perdendo a vida
  rationale: O particípio descreve a vida se extinguindo. «Perdendo a vida» é claro e natural, sem eliminar a imagem mais literal, registrada em nota.
theological_decisions:
- issue: Sentido de δούλους em contexto de conquista
  choice: escravos
  alternative: servos
  rationale: A rendição resultaria em sujeição involuntária. Traduzir por «servos» poderia atenuar indevidamente a coerção central ao contraste entre escravidão e morte.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção mantém os dois conectivos causais do grego («Pois... porque»), preserva o contraste entre escravidão e sobrevivência e apresenta a cena final com coordenação clara. As notas registram alternativas lexicais e o caráter idiomático das expressões sem impor interpretação denominacional.
