revisions:
- from: Pois é melhor sermos tomados por eles como despojo[a]; porque seremos escravos, mas continuaremos vivos[b], e não veremos com os nossos próprios olhos[c] a morte de nossas criancinhas, nem nossas mulheres e nossos filhos perdendo a vida[d].
  to: Pois é melhor sermos tomados por eles como despojo[a], pois seremos escravos, nossa vida será poupada[b], e não veremos com os nossos próprios olhos[c] a morte de nossas criancinhas, nem nossas mulheres e nossos filhos perdendo a vida[d].
  rationale: A revisão remove a conjunção adversativa não expressa no grego e adota «nossa vida será poupada», mais próxima da construção singular ζήσεται ἡ ψυχὴ ἡμῶν. Corrige também a nota d, que havia invertido o papel semântico do particípio, e esclarece o sujeito na nota b. Mantêm-se as escolhas adequadas de «despojo», «escravos», «criancinhas» e a coordenação negativa natural em português.
