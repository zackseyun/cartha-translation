  text: And we will encamp against them as a guard[a], so that not one man may go out from the city. And they, and their wives, and their children, will waste away in the famine, and before the sword comes upon them, they will be laid low in the streets of their dwellings.
translation:
  language: pt
  text: E acamparemos contra elas, como guarda, para que nem um só homem saia da cidade. Eles, suas mulheres e seus filhos definharão de fome; e, antes que a espada venha sobre eles, ficarão caídos nas ruas de suas moradias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ficarão estendidos nas praças de suas moradias». O grego pode indicar tanto ruas largas como praças, e o verbo pode significar ser derrubado ou ficar estendido no chão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβαλοῦμεν ἐπʼ αὐταῖς
  choice: acamparemos junto a elas
  rationale: O verbo descreve o estabelecimento de um acampamento militar. No contexto do cerco, ἐπί indica posicionamento junto aos acessos ou fontes mencionados no contexto, com intenção hostil; «junto a elas» preserva o referente feminino sem substituí-lo por uma explicação ausente deste versículo.
- source_word: εἰς προφυλακὴν
  choice: para vigiá-las
  rationale: 'A expressão indica a finalidade preventiva do acampamento: manter guarda ou vigilância. A forma verbal é natural em português e explicita sua ligação com o pronome feminino.'
- source_word: τοῦ μὴ ἐξελθεῖν ἐκ τῆς πόλεως ἄνδρα ἕνα
  choice: a fim de que nem um só homem saia da cidade
  rationale: Mantém a construção de finalidade/prevenção e reproduz a ênfase do grego ἄνδρα ἕνα, «um só homem».
- source_word: τακήσονται ἐν τῷ λιμῷ
  choice: definharão de fome
  rationale: O verbo é metafórico, no sentido de consumir-se ou definhar; «de fome» comunica naturalmente em português a causa no contexto do cerco.
- source_word: ῥομφαίαν
  choice: a espada
  rationale: Tradução convencional e adequada para a arma e, por extensão, a violência militar que se aproxima.
- source_word: καταστρωθήσονται
  choice: cairão
  rationale: O verbo pode retratar pessoas derrubadas, prostradas ou estendidas no chão. «Cairão» comunica o resultado fatal provável sem tornar explícita uma imagem de cadáveres que o texto não formula diretamente.
- source_word: ἐν ταῖς πλατείαις
  choice: pelas ruas
  rationale: πλατεῖαι pode designar ruas largas ou praças. «Ruas» oferece leitura natural, enquanto a nota preserva a alternativa lexical genuína.
- source_word: τῆς οἰκήσεως αὐτῶν
  choice: do lugar onde moram
  rationale: οἴκησις designa habitação, residência ou lugar habitado. A formulação evita o pouco natural «ruas de suas habitações» e mantém a referência ao espaço em que vivem.
