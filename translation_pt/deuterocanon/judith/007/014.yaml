  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. Preserva-se o pronome feminino plural de ἐπʼ αὐταῖς, cujo referente depende do contexto anterior, e a expressão enfática «nem um só homem». A nota registra a ambiguidade de πλατεῖαι e καταστρωθήσονται.
