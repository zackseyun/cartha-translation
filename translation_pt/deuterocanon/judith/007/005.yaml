  text: And each of them took up his weapons of war, and after kindling fires on their towers, they remained on guard through that whole night.
translation:
  language: pt
  text: E cada um tomou suas armas de guerra e, depois de acenderem fogueiras em suas torres, permaneceram de guarda durante toda aquela noite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλαβόντες
  choice: pegou
  rationale: O particípio indica tomar ou empunhar algo em preparação para agir; “pegou”, em combinação com “armas de guerra”, é natural e preserva a prontidão militar.
- source_word: ἕκαστος
  choice: cada um
  rationale: Mantém explicitamente o sentido distributivo sem acrescentar uma referência masculina ausente no grego.
- source_word: τὰ σκεύη τὰ πολεμικὰ αὐτῶν
  choice: suas armas de guerra
  rationale: Embora σκεύη possa abranger equipamento, o adjetivo πολεμικά delimita o sentido militar; “armas de guerra” expressa isso com clareza, e “suas” representa αὐτῶν.
- source_word: ἀνακαύσαντες πυράς
  choice: depois de acenderem fogueiras
  rationale: Preserva a anterioridade do particípio aoristo em relação ao verbo principal e traduz πυράς como fogueiras concretas.
- source_word: ἐπὶ τοὺς πύργους αὐτῶν
  choice: sobre suas torres
  rationale: Representa naturalmente a localização indicada por ἐπί com acusativo neste contexto e conserva o possessivo.
- source_word: ἔμενον φυλάσσοντες
  choice: permaneceram de guarda
  rationale: Expressa tanto a continuidade indicada por ἔμενον quanto a vigilância militar de φυλάσσοντες.
- source_word: ὅλην τὴν νύκτα ἐκείνην
  choice: durante toda aquela noite
  rationale: Mantém a duração integral e a força demonstrativa de ἐκείνην em português corrente.
