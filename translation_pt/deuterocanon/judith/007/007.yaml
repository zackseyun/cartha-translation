base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/007.yaml
  text: And he inspected the approaches to their city[a], and he took control of the springs of water and seized them, and he stationed camps of fighting men by them[c][b]; and he himself returned to his people.
translation:
  language: pt
  text: Ele inspecionou as subidas que davam acesso à cidade deles[a], percorreu as fontes de água e ocupou-as de antemão. Junto delas, instalou acampamentos de guerreiros; depois, ele próprio partiu para junto do seu povo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “as subidas da cidade deles”, isto é, os caminhos que subiam até a cidade.
    reason: lexical_alternative
  - marker: b
    text: O verbo grego pode indicar que ele levantou acampamento antes de partir para junto do seu povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεσκέψατο
  choice: inspecionou
  rationale: No contexto militar, indica examinar ou vistoriar as vias de acesso, não simplesmente visitar.
- source_word: ἀναβάσεις
  choice: subidas que davam acesso
  rationale: Preserva tanto o sentido topográfico literal de “subidas” quanto sua função como rotas de acesso à cidade.
- source_word: πηγὰς τῶν ὑδάτων
  choice: fontes de água
  rationale: Expressão concreta e natural para os mananciais que constituíam um objetivo estratégico.
- source_word: ἐφώδευεν
  choice: percorreu
  rationale: O verbo raro pode denotar fazer a ronda, patrulhar ou percorrer; “percorreu” conserva a ação sem introduzir a ideia não explícita de fortificação.
- source_word: προκατέλαβε
  choice: ocupou-as de antemão
  rationale: O composto expressa tomar ou ocupar antecipadamente um ponto estratégico.
- source_word: ἐπέστησεν
  choice: instalou
  rationale: Com “acampamentos”, comunica de modo idiomático que ele os estabeleceu junto às fontes.
- source_word: παρεμβολὰς ἀνδρῶν πολεμιστῶν
  choice: acampamentos de guerreiros
  rationale: Mantém o sentido concreto de acampamentos militares e representa de forma concisa os homens combatentes.
- source_word: ἀνέζευξεν
  choice: partiu para junto
  rationale: O verbo militar pode envolver levantar acampamento e pôr-se em marcha; a tradução principal conserva com segurança o movimento em direção ao seu povo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a topografia montanhosa, o caráter estratégico da ocupação das fontes e a possível nuance militar do movimento final, sem transformar o verbo raro ἐφώδευεν em “fortificou”.
