base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/023.yaml
  text: And all the people gathered against Oziah and the rulers of the city—the young men[a], the women, and the children—and they cried out with a loud voice and spoke against the elders,
translation:
  language: pt
  text: 'Todo o povo se reuniu contra Ozias e os chefes da cidade[a] — os rapazes, as mulheres e as crianças —, e eles gritaram em alta voz e falaram contra os anciãos:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «reuniu-se diante de Ozias e dos chefes da cidade»; nesse caso, o fim do versículo também pode ser traduzido por «falaram diante dos anciãos». O contexto imediato de protesto favorece o sentido adversativo, «contra».'
    reason: Preserva a ambiguidade de ἐπί e ἐναντίον, que podem indicar oposição ou posição/presença diante de alguém.
lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: se reuniu
  rationale: 'O aoristo tem sentido intransitivo: o povo juntou-se como um grupo. A concordância no singular acompanha naturalmente o coletivo «todo o povo».'
- source_word: πᾶς ὁ λαός
  choice: todo o povo
  rationale: Expressa a comunidade em seu conjunto de modo claro e corrente em português.
- source_word: ἐπὶ Ὀζείαν
  choice: contra Ozias
  rationale: Com acusativo, ἐπί pode ter sentido adversativo; o contexto imediato de protesto e pressão sobre os dirigentes favorece «contra», sem ocultar a alternativa menos adversativa na nota.
- source_word: τοὺς ἄρχοντας τῆς πόλεως
  choice: os chefes da cidade
  rationale: Ἄρχοντες designa as autoridades cívicas. «Chefes» comunica liderança oficial sem atribuir um cargo constitucional específico.
- source_word: οἱ νεανίσκοι
  choice: os rapazes
  rationale: O substantivo é masculino plural e se refere especificamente aos homens jovens; «rapazes» é natural, claro e fiel ao gênero gramatical e referencial.
- source_word: τὰ παιδία
  choice: as crianças
  rationale: É o equivalente português mais direto e abrangente para o termo grego neste contexto.
- source_word: ἀνεβόησαν φωνῇ μεγάλῃ
  choice: gritaram em alta voz
  rationale: Reproduz tanto a intensidade do verbo quanto a expressão instrumental, em linguagem atual e digna.
- source_word: εἶπαν ἐναντίον τῶν πρεσβυτέρων
  choice: falaram contra os anciãos
  rationale: O cenário é de protesto, de modo que o sentido adversativo de ἐναντίον é plausível. A leitura locativa «diante dos anciãos» permanece registrada na nota.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Mantém-se o tom narrativo solene sem arcaísmos. Os travessões apresentam os grupos como explicação de «todo o povo», e os dois-pontos finais sinalizam que a fala continua no versículo seguinte.
