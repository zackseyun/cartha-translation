lexical_decisions:
- source_word: ἐὰν δὲ διέλθωσιν αὗται
  choice: Mas, se esses dias passarem
  rationale: O demonstrativo feminino plural retoma os dias mencionados no contexto; em português, explicitar “dias” preserva a referência e torna a frase natural.
- source_word: μὴ ἔλθῃ ἐφʼ ἡμᾶς βοήθεια
  choice: não nos chegar auxílio
  rationale: Expressa com naturalidade a ideia de auxílio que vem até/sobre a comunidade, sem sugerir que o auxílio já esteja presente.
- source_word: ποιήσω κατὰ τὰ ῥήματα ὑμῶν
  choice: farei conforme as palavras de vocês
  rationale: Mantém a formulação concreta do grego e o plural de ὑμῶν em linguagem amplamente compreensível.
