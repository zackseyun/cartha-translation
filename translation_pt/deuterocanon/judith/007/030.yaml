base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/030.yaml
  text: And Uzziah said to them[a], “Take courage, brothers; let us hold out for five more days, within which the Lord our God will turn his mercy toward us, for he will not abandon us forever.”
translation:
  language: pt
  text: 'E Ozias lhes disse: “Tenham coragem, irmãos; perseveremos por mais cinco dias. Nesse prazo, o Senhor, nosso Deus, voltará a sua misericórdia para nós, pois não nos abandonará para sempre[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até o fim”; também pode ter o sentido de “não nos abandonará completamente”. A expressão grega admite uma ideia temporal ou intensiva.'
    reason: Preserva a amplitude semântica de εἰς τέλος sem tornar o texto principal artificial.
lexical_decisions:
- source_word: Θαρσεῖτε
  choice: Tenham coragem
  rationale: Reproduz a exortação imperativa no plural em português atual, claro e digno.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém a forma de tratamento masculina plural do grego sem ampliar explicitamente o gênero.
- source_word: διακαρτερήσωμεν
  choice: perseveremos
  rationale: O subjuntivo exortativo expressa resistência continuada sob pressão; “perseveremos” preserva essa força e se ajusta ao contexto do cerco.
- source_word: ἔτι πέντε ἡμέρας
  choice: por mais cinco dias
  rationale: Expressa naturalmente a continuação indicada por ἔτι.
- source_word: ἐν αἷς
  choice: Nesse prazo
  rationale: Retoma os cinco dias como o período dentro do qual se espera a ação divina, evitando uma construção relativa rígida em português.
- source_word: ἐπιστρέψει ... τὸ ἔλεος αὐτοῦ ἐφʼ ἡμᾶς
  choice: voltará para nós a sua misericórdia
  rationale: Mantém a misericórdia como objeto do verbo e preserva o movimento em direção ao povo, embora com ordem mais natural e solene em português.
- source_word: Κύριος ὁ θεὸς ἡμῶν
  choice: o Senhor, nosso Deus
  rationale: Traduz κύριος por “Senhor” e conserva a aposição natural do título divino.
- source_word: οὐ γὰρ ἐγκαταλείψει ἡμᾶς εἰς τέλος
  choice: pois não nos abandonará para sempre
  rationale: “Para sempre” comunica de modo idiomático uma leitura possível de εἰς τέλος; a nota preserva também os sentidos mais literais ou intensivos.
theological_decisions:
- issue: Tradução de κύριος como título do Deus de Israel em fonte grega deuterocanônica
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte apresenta κύριος, não o tetragrama hebraico; “Senhor” representa diretamente o título grego sem introduzir uma convenção própria de YHWH.
- issue: Gênero da forma de tratamento ἀδελφοί
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: A forma grega é masculina plural; a tradução mantém sua marca gramatical sem resolver além do texto quem integrava o grupo.
- issue: Amplitude semântica de εἰς τέλος
  choice: para sempre no texto, com nota
  alternative: até o fim; completamente
  rationale: A expressão pode indicar duração final ou abandono total. O texto principal usa uma formulação portuguesa idiomática, e a nota preserva a ambiguidade relevante.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O discurso mantém tom comunitário, urgente e digno; evita tanto arcaísmos quanto coloquialismos excessivos.
