  yaml_path: translation/deuterocanon/judith/007/015.yaml
  text: And you will repay them with an evil recompense[b][a], because they rebelled and did not meet you in peace.
translation:
  language: pt
  text: E tu lhes darás uma retribuição má[a], porque se rebelaram e não saíram ao teu encontro em paz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tu lhes retribuirás uma retribuição má”, construção com palavras da mesma raiz que intensifica a ideia de retribuição.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não te receberam em paz”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνταποδώσεις αὐτοῖς ἀνταπόδομα πονηρόν
  choice: tu lhes darás uma retribuição severa
  rationale: O futuro ἀνταποδώσεις expressa retribuição dirigida aos ofensores, enquanto o substantivo cognato ἀνταπόδομα reforça a ideia. Em português, repetir «retribuir... retribuição» seria pouco natural; «darás uma retribuição» mantém o sentido, e «severa» comunica aqui o caráter adverso de πονηρόν sem sugerir que a ação divina seja moralmente má.
- source_word: ἀνθʼ ὧν
  choice: porque
  rationale: A locução introduz o motivo da retribuição; «porque» expressa com clareza e naturalidade sua força causal neste contexto.
- source_word: ἐστασίασαν
  choice: se rebelaram
  rationale: O verbo descreve uma postura rebelde ou sediciosa. «Se rebelaram» é direto, atual e adequado ao contexto.
- source_word: οὐκ ἀπήντησαν
  choice: não saíram ao teu encontro
  rationale: ἀπαντάω pode indicar o ato de sair para encontrar alguém. A formulação explicita esse movimento sem acrescentar uma interpretação alheia ao texto.
- source_word: τῷ προσώπῳ σου
  choice: ao teu encontro
  rationale: Embora literalmente diga «à tua face», a expressão se refere à própria pessoa interpelada. A tradução idiomática evita rigidez sem perder o sentido.
- source_word: ἐν εἰρήνῃ
  choice: em paz
  rationale: Preserva a expressão grega e sua amplitude, que pode envolver tanto uma recepção pacífica quanto intenção diplomática pacífica.
theological_decisions:
- issue: Natureza da retribuição solicitada ao interlocutor divino
  choice: Apelo ou afirmação confiante de que Deus dará aos rebeldes uma retribuição severa
  alternative: Declaração geral de justiça divina, sem nuance de oração ou apelo
  rationale: O futuro dirigido a Deus admite, no contexto, tanto confiança quanto força apelativa. A tradução conserva a afirmação direta sem explicitar uma modalidade que o grego deixa dependente do contexto.
- issue: Sentido moral de πονηρόν aplicado à retribuição divina
  choice: severa
  alternative: má
  rationale: «Má retribuição» poderia ser entendida em português como moralmente injusta ou perversa. Neste contexto, πονηρόν caracteriza a retribuição como adversa, danosa ou funesta para quem a recebe; «severa» evita atribuir maldade moral a Deus sem suavizar o juízo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com uso de «tu» por coerência com a interpelação direta no singular. A construção cognata grega é explicada em nota, pois sua reprodução literal seria pesada em português. Os marcadores aparecem no texto na ordem [a], [b].
