  yaml_path: translation/deuterocanon/judith/007/012.yaml
  text: Remain by your camp, securing every man from your force, and let your servants gain control of the spring of water that comes out from the foot of the mountain,
translation:
  language: pt
  text: Permanece no teu acampamento, protegendo cada homem de tuas tropas, e que os teus servos[a] tomem o controle da fonte de água que brota do sopé do monte[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os teus homens”; o termo grego pode designar servos, assistentes ou subordinados neste contexto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “da raiz do monte”, expressão que indica sua base ou seu sopé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάμεινον
  choice: Permanece
  rationale: O imperativo ordena continuar ou ficar em determinado lugar; “permanece” conserva essa ideia sem reduzir a ordem a uma simples espera.
- source_word: ἐπὶ τῆς παρεμβολῆς σου
  choice: no teu acampamento
  rationale: Em contexto militar, παρεμβολή designa o acampamento; a preposição com genitivo situa a permanência nele ou junto dele. “No teu acampamento” é natural e adequado ao contexto.
- source_word: ἀσφαλίζων
  choice: mantendo em segurança
  rationale: O particípio expressa a ação simultânea de proteger ou tornar seguro, ligada à ordem principal.
- source_word: πάντα ἄνδρα ἐκ τῆς δυνάμεώς σου
  choice: cada homem das tuas tropas
  rationale: A expressão é distributiva e masculina. Em contexto militar, δύναμις se refere às forças ou tropas, não à força abstrata.
- source_word: ἐπικρατησάτωσαν
  choice: tomem o controle
  rationale: O verbo significa obter domínio ou controle sobre algo; a formulação comunica com clareza o objetivo tático.
- source_word: οἱ παῖδές σου
  choice: os teus servos
  rationale: παῖδες pode designar servos, assistentes ou subordinados. “Servos” preserva o sentido lexical direto, enquanto a nota registra a alternativa militar contextual.
- source_word: πηγῆς τοῦ ὕδατος
  choice: fonte de água
  rationale: Mantém a imagem concreta de uma nascente ou fonte, em formulação natural em português.
- source_word: ἐκπορεύεται
  choice: brota
  rationale: No contexto de uma fonte, o verbo de sair ou proceder é expresso naturalmente por “brota”, sem alterar o referente.
- source_word: ῥίζης τοῦ ὄρους
  choice: sopé do monte
  rationale: Embora ῥίζα signifique literalmente “raiz”, seu uso topográfico indica a parte inferior ou base do monte; “sopé” é o equivalente idiomático.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa coerentes (“teu”, “tuas”). A sintaxe conserva a ordem militar no singular, seguida da ação atribuída aos subordinados. A vírgula final foi mantida porque o texto-fonte fornecido continua sintaticamente no versículo seguinte.
