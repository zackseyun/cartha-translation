  text: Let our lord hear a word[b][a], so that there may not be a breach in your force.
translation:
  language: pt
  text: Que o nosso senhor[a] ouça uma palavra, para que não haja uma brecha[b] no teu exército.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «nosso mestre»; o grego δεσπότης é um título respeitoso para alguém que exerce autoridade.
    reason: lexical_alternative
  - marker: b
    text: Ou «uma ruptura» ou «um desastre»; o termo grego se refere a uma quebra ou dano, sem especificar exatamente a natureza do revés militar.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: Ἀκουσάτω δὴ
  choice: Que ... ouça
  rationale: O imperativo aoristo na terceira pessoa é expresso naturalmente em português como pedido deferente por meio de «que ... ouça». A força de δὴ, que acrescenta insistência ou cortesia, fica comunicada pela construção e não requer uma palavra separada.
- source_word: λόγον
  choice: uma palavra
  rationale: Mantém o idiomatismo grego para uma breve declaração ou algo que se deseja dizer, sem ampliar indevidamente para «mensagem» ou «assunto».
- source_word: ὁ δεσπότης ἡμῶν
  choice: o nosso senhor
  rationale: δεσπότης designa alguém investido de autoridade. «Nosso senhor» preserva a forma respeitosa de tratamento dirigida a um superior militar, sem introduzir necessariamente a ideia de posse associada a «dono».
- source_word: θραῦσμα
  choice: ruptura
  rationale: O termo denota literalmente uma quebra ou aquilo que foi quebrado. «Ruptura» conserva a imagem de dano ou desintegração dentro das tropas sem definir de modo excessivo se se trata de brecha, derrota ou desastre.
- source_word: ἐν τῇ δυνάμει σου
  choice: no teu exército
  rationale: Embora δύναμις possa significar poder ou força, o contexto favorece claramente o sentido militar. «Exército» é mais natural e inequívoco em português do que «força» no singular.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento deferente em terceira pessoa («Que o nosso senhor ouça») e segunda pessoa singular («teu»), apropriado ao discurso dirigido a um superior. A formulação permanece próxima da concisão e da ambiguidade do grego.
