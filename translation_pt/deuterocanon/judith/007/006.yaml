  yaml_path: translation/deuterocanon/judith/007/006.yaml
  text: And on the second day Holofernes brought out all his cavalry in front of the sons of Israel who were in Bethulia,[a]
translation:
  language: pt
  text: No segundo dia, Holofernes fez sair toda a sua cavalaria diante dos filhos de Israel que estavam em Betúlia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos israelitas”. O grego diz literalmente “dos filhos de Israel”, uma designação étnica tradicional.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ... ἡμέρᾳ τῇ δευτέρᾳ
  choice: No segundo dia
  rationale: O dativo articulado tem valor temporal. A formulação preserva diretamente a sequência indicada pelo grego e soa natural em português.
- source_word: ἐξήγαγεν
  choice: fez sair
  rationale: O verbo significa conduzir ou levar para fora. “Fez sair” exprime o deslocamento ordenado por Holofernes sem acrescentar a ideia específica de marcha.
- source_word: πᾶσαν τὴν ἵππον
  choice: toda a sua cavalaria
  rationale: Embora ἵππος signifique literalmente “cavalo”, no contexto militar o singular coletivo pode designar a cavalaria. A expressão portuguesa comunica esse sentido com clareza.
- source_word: αὐτοῦ
  choice: sua
  rationale: O possessivo refere-se naturalmente à cavalaria de Holofernes.
- source_word: κατὰ πρόσωπον
  choice: diante de
  rationale: A locução indica posição à frente ou em face de alguém. “Diante de” preserva essa relação espacial sem definir além do texto se as forças estavam apenas à frente ou frente a frente.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: dos filhos de Israel
  rationale: Mantém a expressão étnica tradicional e a forma concreta do grego; “israelitas” é uma alternativa idiomática registrada em nota.
- source_word: οἳ ἦσαν ἐν Βετυλουά
  choice: que estavam em Betúlia
  rationale: A oração relativa identifica o grupo por sua localização. “Betúlia” é a forma portuguesa convencional do topônimo.
