  text: And now there is no one to help us[a]; rather, God has delivered us into their hands[c][b], to be laid low before them in thirst and great destruction.
translation:
  language: pt
  text: E agora não há quem nos ajude; pelo contrário, Deus nos vendeu ao poder deles, para sermos abatidos diante deles, pela sede e por grande destruição.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βοηθός
  choice: quem nos ajude
  rationale: O substantivo singular com sentido possessivo significa literalmente “nosso ajudador”. A construção “não há quem nos ajude” transmite de modo natural em português a ausência de qualquer pessoa capaz de prestar auxílio.
- source_word: πέπρακεν
  choice: nos vendeu
  rationale: O perfeito de πιπράσκω/πράσκω tem o sentido próprio de “vender”. Preservar a metáfora forte evita suavizar a afirmação de que Deus os entregou ao poder inimigo.
- source_word: εἰς τὰς χεῖρας αὐτῶν
  choice: às mãos deles
  rationale: Mantém a expressão bíblica que representa submissão ao poder de alguém e soa natural em português.
- source_word: τοῦ καταστρωθῆναι
  choice: para sermos abatidos
  rationale: O infinitivo passivo exprime finalidade ou resultado e pode indicar ser derrubado, prostrado ou abatido. “Abatidos” preserva a ideia de derrota sem especificar indevidamente o modo.
- source_word: ἐναντίον αὐτῶν
  choice: diante deles
  rationale: Neste contexto, a expressão indica que a derrota ocorre perante os inimigos; “diante deles” preserva a dimensão espacial e humilhante.
- source_word: ἐν δίψει
  choice: pela sede
  rationale: ἐν pode marcar circunstância ou meio. Aqui, “pela sede” comunica naturalmente que a sede é o meio ou causa do abatimento, sem excluir a ideia de condição.
- source_word: ἀπωλείᾳ μεγάλῃ
  choice: por uma grande destruição
  rationale: ἀπώλεια denota destruição, ruína ou perdição. “Grande destruição” é direta e evita conotações teológicas posteriores que “perdição” poderia introduzir.
theological_decisions:
- issue: Ação divina na derrota do povo
  choice: Deus nos vendeu às mãos deles
  alternative: Deus nos entregou nas mãos deles
  rationale: O grego atribui explicitamente a Deus a ação e emprega a forte metáfora de vender. A tradução conserva essa tensão teológica em vez de atenuá-la.
- issue: Finalidade ou resultado do infinitivo articular
  choice: para sermos abatidos
  alternative: de modo que fôssemos abatidos
  rationale: A construção τοῦ com infinitivo pode expressar propósito ou resultado. “Para” mantém a formulação compacta e deixa a relação suficientemente aberta no contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preserva-se a metáfora vigorosa “vendeu” e o idiomatismo “às mãos deles”. Não foram acrescentadas notas porque as principais ambiguidades podem permanecer no próprio texto sem sobrecarregá-lo.
