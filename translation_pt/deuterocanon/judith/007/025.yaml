revisions:
- from: E agora não há quem nos ajude; pelo contrário, Deus nos vendeu às mãos deles, para sermos abatidos diante deles pela sede e por uma grande destruição.
  to: E agora não há quem nos ajude; pelo contrário, Deus nos vendeu ao poder deles, para sermos abatidos diante deles, pela sede e por grande destruição.
  rationale: A revisão substitui apenas a expressão não idiomática «às mãos deles» por «ao poder deles», preservando tanto a imagem de venda quanto o sentido de entrega ao domínio inimigo. Também ajusta a pontuação e elimina o artigo em «grande destruição» para uma formulação mais fluente, sem alterar o sentido nem resolver indevidamente a ambiguidade entre circunstância e meio em ἐν δίψει καὶ ἀπωλείᾳ μεγάλῃ.
