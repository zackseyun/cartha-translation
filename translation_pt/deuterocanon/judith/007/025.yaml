  timestamp: '2026-07-13T23:58:49Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva corretamente a atribuição explícita da ação a Deus, a metáfora forte de πέπρακεν («vendeu») e a derrota perante os inimigos. Contudo, «às mãos deles» não é a forma idiomática portuguesa adequada para εἰς τὰς χεῖρας αὐτῶν neste contexto; «ao poder deles» comunica com naturalidade a submissão ao domínio inimigo, sem atenuar «vendeu».
  naturalness: O registro é moderno e digno. «Deus nos vendeu ao poder deles» é mais natural e claro em português internacional do que «Deus nos vendeu às mãos deles». A coordenação final com vírgula torna mais legível a relação de circunstância ou meio, preservando a ambiguidade de ἐν.
  terminology: «Vendeu» mantém a metáfora comercial do grego; «poder deles» traduz idiomaticamente a expressão bíblica «nas mãos deles» como sujeição ao inimigo. «Abatidos», «sede» e «grande destruição» são escolhas adequadas e não introduzem conotações doutrinárias posteriores.
  issues:
  - severity: medium
    issue: «Às mãos deles»
    rationale: Em português, «às mãos de» normalmente significa sofrer ação ou tratamento de alguém («morreu às mãos de...»), não ser entregue ao seu domínio. A construção prejudica a naturalidade e pode obscurecer o sentido idiomático de εἰς τὰς χεῖρας αὐτῶν.
  revised_text: E agora não há quem nos ajude; pelo contrário, Deus nos vendeu ao poder deles, para sermos abatidos diante deles, pela sede e por grande destruição.
  revised_footnotes: []
  revision_rationale: A revisão substitui apenas a expressão não idiomática «às mãos deles» por «ao poder deles», preservando tanto a imagem de venda quanto o sentido de entrega ao domínio inimigo. Também ajusta a pontuação e elimina o artigo em «grande destruição» para uma formulação mais fluente, sem alterar o sentido nem resolver indevidamente a ambiguidade entre circunstância e meio em ἐν δίψει καὶ ἀπωλείᾳ μεγάλῃ.
