  text: And the whole camp of Assyria remained around them—the foot soldiers and chariots and their horsemen—for thirty-four days; and all the water containers of all the inhabitants of Bethulia ran out,
translation:
  language: pt
  text: E todo o acampamento da Assíria permaneceu ao redor deles — os soldados de infantaria, os carros de guerra e seus cavaleiros — durante trinta e quatro dias; e todos os recipientes de água de todos os habitantes de Betúlia ficaram vazios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεμβολὴ Ἀσσούρ
  choice: acampamento da Assíria
  rationale: Traduz naturalmente a expressão grega e preserva a referência coletiva à força militar assíria.
- source_word: οἱ πεζοὶ
  choice: os soldados de infantaria
  rationale: Explicita em português corrente que πεζοί designa combatentes a pé.
- source_word: ἅρματα
  choice: os carros de guerra
  rationale: No contexto militar, evita a ambiguidade moderna de «carros» e comunica o sentido de carros de combate antigos.
- source_word: οἱ ἱππεῖς αὐτῶν
  choice: os cavaleiros
  rationale: Expressa o contingente montado; o possessivo grego é dispensável em português porque a pertença ao acampamento já está clara.
- source_word: ἐξέλιπεν
  choice: se esgotou
  rationale: Transmite a ideia de que o suprimento de água chegou ao fim, concordando com o sujeito singular coletivo «toda a água».
- source_word: πάντα τὰ ἀγγεῖα αὐτῶν τῶν ὑδάτων
  choice: toda a água dos recipientes
  rationale: A construção grega é difícil e literalmente se refere aos recipientes de água; a formulação comunica naturalmente que seu conteúdo acabou, sem sugerir que os próprios recipientes desapareceram.
- source_word: Βαιτυλουά
  choice: Betúlia
  rationale: Forma portuguesa tradicional e reconhecível do topônimo.
