translation:
  language: pt
  text: 'Então Judite lhes disse: “Escutem-me, irmãos. Peguem esta cabeça e pendurem-na no parapeito da muralha de vocês.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσατε δή μου
  choice: Escutem-me
  rationale: O imperativo aoristo Ἀκούσατε pede atenção imediata, e a partícula δή reforça a urgência. “Escutem-me” transmite essa força de modo natural, sem acrescentar um “agora” ou “por favor” que poderia alterar o tom.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: O vocativo masculino plural dirige-se aos homens de Betúlia. “Irmãos” preserva tanto a forma quanto o sentido relacional do grego.
- source_word: λαβόντες
  choice: Peguem
  rationale: O particípio aoristo indica uma ação anterior à ordem principal. Em português corrente, a coordenação “Peguem... e pendurem-na” preserva com naturalidade a sequência das ações.
- source_word: τὴν κεφαλὴν ταύτην
  choice: esta cabeça
  rationale: Tradução direta, sem acrescentar “decepada”, informação evidente no contexto, mas não expressa neste sintagma.
- source_word: κρεμάσατε αὐτήν
  choice: pendurem-na
  rationale: Mantém a ação física concreta expressa pelo imperativo, sem substituí-la por uma formulação interpretativa como “exponham-na”.
- source_word: ἐπὶ τῆς ἐπάλξεως
  choice: no parapeito
  rationale: ἐπάλξ designa a parte superior defensiva de uma muralha, podendo referir-se ao parapeito ou às ameias. “Parapeito” é claro e natural em português.
- source_word: τοῦ τείχους ὑμῶν
  choice: da muralha de vocês
  rationale: τεῖχος é uma muralha defensiva, e “de vocês” reproduz o pronome plural com ampla legibilidade brasileira.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e direto, com boa legibilidade brasileira. A fala foi dividida em duas frases para preservar a urgência das ordens sem tornar o período pesado. Não foi necessária nota textual ou teológica; a possível alternativa lexical “ameias” não altera substancialmente o sentido.
