  text: And he cried out with a loud voice, with weeping and groaning and a mighty cry, and he tore his garments.
translation:
  language: pt
  text: E ele gritou em alta voz, com choro, gemidos e um clamor intenso, e rasgou suas vestes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβόησεν
  choice: gritou
  rationale: O verbo indica uma emissão forte da voz; “gritou” preserva a intensidade sem determinar se houve palavras articuladas.
- source_word: φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: Expressão portuguesa natural que reproduz de perto o modo enfático da vocalização.
- source_word: μετὰ κλαυθμοῦ
  choice: com choro
  rationale: κλαυθμός denota choro ou lamentação; “com choro” é claro e mantém a estrutura acumulativa do grego.
- source_word: στεναγμοῦ
  choice: gemidos
  rationale: στεναγμός pode designar gemido ou suspiro; o plural idiomático “gemidos” comunica melhor a intensidade desta cena de luto.
- source_word: βοῆς ἰσχυρᾶς
  choice: um clamor intenso
  rationale: “Clamor” distingue esta expressão do primeiro verbo, enquanto “intenso” transmite a força de ἰσχυρός sem soar artificial.
- source_word: διέρρηξεν
  choice: rasgou
  rationale: O verbo descreve o ato de rasgar as roupas, gesto cultural de luto; “rasgou” é moderno e preciso.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: suas vestes
  rationale: “Vestes” mantém o sentido amplo de peças de roupa e o registro digno ligado ao gesto público de luto.
