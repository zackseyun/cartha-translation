base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/012.yaml
  text: But when the sons of Asshur saw them, they sent word to their leaders; and they came to the generals and commanders of thousands and to every one of their rulers.
translation:
  language: pt
  text: Mas, quando os filhos de Assur os viram, mandaram avisar seus líderes; estes foram aos generais, aos comandantes de mil e a cada um dos seus governantes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ... υἱοὶ Ἀσσοὺρ
  choice: os filhos de Assur
  rationale: Preserva a expressão étnica formal do grego e a transliteração do nome, embora «os assírios» fosse uma alternativa mais idiomática.
- source_word: ὡς εἶδον αὐτούς
  choice: quando ... os viram
  rationale: Expressa a relação temporal sem acrescentar a ênfase de imediatismo que haveria em «assim que».
- source_word: διεπέμψαν
  choice: mandaram avisar
  rationale: Comunica naturalmente o envio de uma mensagem, mantendo implícito, como no grego, se mensageiros foram enviados.
- source_word: ἐπὶ τοὺς ἡγουμένους αὐτῶν
  choice: seus líderes
  rationale: Representa de modo claro e abrangente aqueles que exerciam liderança no contexto militar e administrativo.
- source_word: στρατηγοὺς
  choice: generais
  rationale: É o equivalente específico e natural para os comandantes militares designados pelo termo neste contexto.
- source_word: χιλιάρχους
  choice: comandantes de mil
  rationale: Conserva a força numérica do título sem importar a designação técnica romana «tribunos».
- source_word: ἐπὶ πάντα ἄρχοντα αὐτῶν
  choice: a cada um dos seus governantes
  rationale: Preserva a força distributiva do singular com πᾶς, em vez de nivelá-la para «a todos os seus governantes».
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa natural. «Estes» esclarece que o sujeito de «foram» são os líderes recém-mencionados, evitando a ambiguidade pronominal comum em português. A repetição de «aos» acompanha com clareza a enumeração hierárquica.
