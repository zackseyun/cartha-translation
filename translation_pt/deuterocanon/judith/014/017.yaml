lexical_decisions:
- source_word: εἰσῆλθεν
  choice: entrou
  rationale: Verbo narrativo direto que preserva o movimento para dentro da tenda e soa natural em português.
- source_word: σκηνήν
  choice: tenda
  rationale: No contexto de um acampamento militar, é a tradução simples e adequada.
- source_word: καταλύουσα
  choice: estava hospedada
  rationale: O particípio indica permanência ou alojamento temporário; esta formulação é natural e conserva essa ideia.
- source_word: οὐχ εὗρεν αὐτήν
  choice: não a encontrou
  rationale: Reproduz diretamente o sentido comum da expressão grega, sem intensificação indevida.
- source_word: ἐξεπήδησεν
  choice: saiu correndo
  rationale: Comunica o movimento súbito e urgente para fora expresso pelo verbo vívido, sem sugerir necessariamente um salto literal.
- source_word: εἰς τὸν λαόν
  choice: para junto do povo
  rationale: Mantém o referente amplo de λαός e expressa naturalmente o movimento em direção às pessoas reunidas.
- source_word: κράζων
  choice: gritando
  rationale: Conserva a força do clamor em voz alta e se integra naturalmente à narrativa.
