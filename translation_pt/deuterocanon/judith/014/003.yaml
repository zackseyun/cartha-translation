lexical_decisions:
- source_word: ἀναλαβόντες
  choice: depois de pegarem
  rationale: O particípio aoristo indica uma ação anterior aos verbos principais; a formulação explicita naturalmente essa sequência em português.
- source_word: οὗτοι
  choice: estes
  rationale: Mantém a força demonstrativa do grego sem acrescentar um substantivo desnecessário, pois o referente pessoal é recuperável pelo contexto.
- source_word: τὰς πανοπλίας αὐτῶν
  choice: suas armas
  rationale: πανοπλία designa o conjunto do armamento ou equipamento militar. Neste contexto, “armas” é uma expressão corrente e abrangente, sem a associação mais restrita de “armadura” apenas à proteção corporal.
- source_word: παρεμβολὴν
  choice: acampamento
  rationale: Em contexto militar, παρεμβολή designa o acampamento das tropas.
- source_word: ἐγεροῦσι
  choice: despertarão
  rationale: O futuro de ἐγείρω pode significar acordar ou pôr em atividade; “despertarão” preserva o sentido literal mais provável sem excluir a ideia de mobilização urgente.
- source_word: στρατηγοὺς
  choice: comandantes
  rationale: Evita impor uma patente militar moderna específica e expressa adequadamente a função de liderança.
- source_word: δυνάμεως
  choice: exército
  rationale: Embora o termo possa significar “força”, nesta construção militar refere-se ao corpo armado assírio.
- source_word: Ἀσσούρ
  choice: Assíria
  rationale: É a forma geográfica e nacional consagrada e natural em português neste contexto.
