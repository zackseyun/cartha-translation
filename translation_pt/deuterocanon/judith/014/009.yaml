  text: And when she stopped speaking[a], the people shouted with a loud voice and raised a joyful cry in their city.
translation:
  language: pt
  text: Quando ela parou de falar, o povo gritou[a] em alta voz e soltou um brado de alegria na cidade deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “soltou um grito”; o verbo grego pode indicar um grito forte e, por vezes, até um brado de guerra, mas aqui descreve a manifestação festiva do povo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Quando
  rationale: Introduz o acontecimento seguinte com valor temporal; a conjunção portuguesa mantém com naturalidade a sequência narrativa.
- source_word: ἐπαύσατο λαλούσα
  choice: parou de falar
  rationale: Expressa de modo claro e atual que ela cessou a ação de falar, sem sugerir além do texto que concluiu formalmente um discurso.
- source_word: ἠλάλαξεν
  choice: gritou
  rationale: O verbo indica um grito forte e pode, em outros contextos, designar um brado de guerra; aqui, a reação é de celebração, de modo que “gritou” preserva sua amplitude sem introduzir conotação militar.
- source_word: ὁ λαός
  choice: o povo
  rationale: Equivalente coletivo comum e digno, adequado à população reunida da cidade.
- source_word: φωνῇ μεγάλῃ
  choice: em alta voz
  rationale: Reproduz naturalmente em português a expressão de modo e conserva a imagem concreta da voz elevada.
- source_word: ἔδωκεν φωνὴν εὐφρόσυνον
  choice: soltou um brado de alegria
  rationale: Traduz idiomaticamente a expressão grega, cujo sentido literal é “deu uma voz alegre”, mantendo a manifestação pública e jubilosa.
- source_word: ἐν τῇ πόλει αὐτῶν
  choice: na cidade deles
  rationale: Preserva explicitamente o pronome plural αὐτῶν e evita a possível ambiguidade de “sua cidade”, que poderia ser entendida como a cidade da mulher.
