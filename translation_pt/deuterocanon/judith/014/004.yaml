base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/004.yaml
  text: Then you and all who live within the whole territory of Israel[a], following after them[b], strike them down on their roads.
translation:
  language: pt
  text: Então vocês e todos os que habitam em todo o território de Israel[b], depois de irem atrás deles[a], abatam-nos em seus caminhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perseguindo-os”; o particípio grego pode indicar que iam atrás deles em perseguição.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “todos os que habitam todo o território de Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπακολουθήσαντες
  choice: indo atrás deles
  rationale: O particípio aoristo expressa uma ação associada e anterior ao imperativo principal. “Indo atrás deles” conserva tanto a sequência quanto a possível ideia de perseguição, sem torná-la mais explícita do que o grego.
- source_word: οἱ κατοικοῦντες
  choice: os que habitam
  rationale: Expressa de modo natural e digno a residência permanente indicada pelo particípio presente.
- source_word: πᾶν ὅριον Ἰσραήλ
  choice: todo o território de Israel
  rationale: Neste contexto, ὅριον designa a extensão territorial habitada, e não apenas uma linha de fronteira.
- source_word: καταστρώσατε
  choice: abatam-nos
  rationale: O imperativo tem sentido militar de derrubar ou deixar prostrado. “Abatam-nos” comunica com clareza a força da ordem sem acrescentar detalhes ausentes do texto.
- source_word: ἐν ταῖς ὁδοῖς αὐτῶν
  choice: pelos caminhos por onde fogem
  rationale: A expressão significa literalmente “nos caminhos deles”. O contexto imediato é a fuga do exército inimigo; a formulação portuguesa torna clara a referência às rotas da retirada.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente compreensível e com leitura natural no Brasil. A ordem dos elementos foi ajustada à sintaxe portuguesa, mantendo o sujeito composto e a relação do particípio com o imperativo. Os marcadores foram colocados junto às expressões a que suas notas realmente correspondem.
