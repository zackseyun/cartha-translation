  yaml_path: translation/deuterocanon/judith/014/008.yaml
  text: And now tell me what you have done in these days[a]. And Judith reported to him, in the midst of the people, all that she had done[b], from the day when she went out until the time when she was speaking to them.
translation:
  language: pt
  text: E agora conte-me tudo o que você fez nestes dias. Então Judite lhe relatou, no meio do povo[a], tudo o que havia feito, desde o dia em que saiu até o momento em que falava com eles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante do povo”. A expressão grega pode indicar tanto a localização no meio deles quanto o caráter público do relato perante eles.
    reason: lexical_alternative
  - marker: b
    text: Ou “até quando falou com eles”. O grego emprega um verbo no imperfeito (“falava”), que pode destacar a ação em andamento ou funcionar simplesmente como forma narrativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγγειλόν μοι
  choice: conte-me
  rationale: O imperativo pede um relato direto dirigido ao interlocutor. “Conte-me” é natural em português atual e conserva tanto a ideia de narrar quanto o pronome μοι (“a mim”).
- source_word: ὅσα ἐποίησας
  choice: o que você fez
  rationale: A expressão abrange as ações realizadas por Judite. A formulação é clara e natural, sem acrescentar uma ênfase totalizante que aqui não é obrigatória.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: nestes dias
  rationale: Tradução próxima da expressão temporal grega, preservando a referência ao período recente sem defini-lo com maior precisão.
- source_word: ἀπήγγειλεν
  choice: relatou
  rationale: O verbo indica a apresentação de um relato e retoma semanticamente o imperativo anterior. “Relatou” mantém essa ligação em português.
- source_word: ἐν μέσῳ τοῦ λαοῦ
  choice: no meio do povo
  rationale: Preserva a imagem espacial do grego. A expressão também pode indicar que o relato ocorreu publicamente diante do povo, possibilidade registrada em nota.
- source_word: πάντα ὅσα ἦν πεποιηκυῖα
  choice: tudo o que havia feito
  rationale: O mais-que-perfeito composto português expressa ações já concluídas antes do relato e corresponde bem à construção perifrástica grega.
- source_word: ἀφʼ ἧς ἡμέρας ἐξῆλθεν
  choice: desde o dia em que saiu
  rationale: Mantém o sentido básico de ἐξέρχομαι e deixa que o contexto narrativo identifique de onde Judite saiu.
- source_word: ἕως οὗ ἐλάλει αὐτοῖς
  choice: até o momento em que falava com eles
  rationale: A formulação procura conservar o aspecto imperfeito de ἐλάλει, apresentando a fala como uma ação em curso naquele momento.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Você” torna explícito o sujeito singular da forma verbal grega; “lhe” preserva de modo conciso o destinatário masculino do relato. As notas mantêm as ambiguidades espacial/pública e aspectual presentes no texto grego.
