- from: Quando Aquior viu tudo o que o Deus de Israel tinha feito, creu profundamente em Deus[a], circuncidou a carne do seu prepúcio e foi acrescentado à casa de Israel até o dia de hoje[b].
  to: Quando Aquior viu tudo o que o Deus de Israel tinha feito, creu firmemente em Deus[a], circuncidou a carne do seu prepúcio e foi acrescentado à casa de Israel[b] até o dia de hoje.
  rationale: A revisão substitui um intensificador português que pode deslocar a nuance de grau de σφόδρα por «firmemente», preservando a linguagem de crer e a força da afirmação. Também reposiciona a âncora b e ajusta a nota para que ela explique precisamente a expressão alternativa, sem alterar o sentido do versículo.
