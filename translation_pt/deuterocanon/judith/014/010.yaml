base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/010.yaml
  text: And when Achior saw all that the God of Israel had done[a], he believed in God greatly, and he circumcised the flesh of his foreskin[b], and was joined to the house of Israel to this day.
translation:
  language: pt
  text: Quando Aquior viu tudo o que o Deus de Israel tinha feito, creu firmemente em Deus[a], circuncidou a carne do seu prepúcio e foi acrescentado à casa de Israel[b] até o dia de hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “confiou firmemente em Deus”. O verbo grego pode expressar crença, fé ou confiança, conforme o contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “foi unido à casa de Israel”. A expressão descreve a incorporação de Aquior ao povo de Israel.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: Quando ... viu
  rationale: O particípio aoristo apresenta a circunstância anterior às ações principais; a oração temporal é natural em português e preserva a sequência do grego.
- source_word: πάντα ὅσα ἐποίησεν
  choice: tudo o que ... tinha feito
  rationale: Expressa a totalidade dos atos de Deus recém-narrados; o mais-que-perfeito composto esclarece que esses atos precederam a reação de Aquior.
- source_word: ὁ θεὸς τοῦ Ἰσραήλ
  choice: o Deus de Israel
  rationale: Mantém diretamente o título genitivo tradicional.
- source_word: ἐπίστευσεν τῷ θεῷ σφόδρα
  choice: creu profundamente em Deus
  rationale: “Creu em Deus” preserva a linguagem de πιστεύω e comunica fé/confiança; “profundamente” traduz de modo idiomático a forte intensificação de σφόδρα.
- source_word: περιέτεμετο
  choice: circuncidou
  rationale: O médio tem sentido reflexivo no contexto; em português, o sujeito permanece agente gramatical sem especificar quem realizou materialmente o rito.
- source_word: τὴν σάρκα τῆς ἀκροβυστίας αὐτοῦ
  choice: a carne do seu prepúcio
  rationale: Conserva a formulação concreta e explícita do grego, sem eufemismo.
- source_word: προσετέθη
  choice: foi acrescentado
  rationale: Reproduz de perto o passivo de προστίθημι e indica incorporação ao povo, sem introduzir terminologia técnica posterior.
- source_word: πρὸς τὸν οἶκον Ἰσραήλ
  choice: à casa de Israel
  rationale: Preserva a expressão bíblica tradicional e a ideia corporativa de Israel.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: até o dia de hoje
  rationale: Equivalente português natural que mantém a perspectiva temporal do narrador e a forma de duração marcada por ἕως.
theological_decisions:
- issue: Sentido de πιστεύω em contexto de adesão ao Deus de Israel
  choice: creu profundamente em Deus
  alternative: confiou profundamente em Deus
  rationale: A tradução principal mantém a ligação lexical com fé/crer, enquanto a nota registra a nuance legítima de confiança sem reduzir o verbo a mera aceitação intelectual.
- issue: Incorporação de Aquior a Israel
  choice: foi acrescentado à casa de Israel
  alternative: foi unido à casa de Israel
  rationale: A forma passiva segue o texto grego e afirma sua incorporação comunitária sem acrescentar categorias confessionais ou técnicas não expressas no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se as expressões bíblicas “Deus de Israel” e “casa de Israel”, bem como a linguagem corporal explícita do original. A intensificação foi vertida de modo idiomático, e as ambiguidades relevantes aparecem em notas.
