  verdict: revise
  source_fidelity: 'O texto acompanha bem o grego: mantém a sequência temporal, «o Deus de Israel», a referência explícita à circuncisão, a incorporação «à casa de Israel» e a perspectiva narrativa de «até o dia de hoje». Contudo, «profundamente» tende a indicar profundidade qualitativa, enquanto σφόδρα intensifica o ato de crer; «firmemente» representa melhor essa força no português corrente.'
  naturalness: A redação é clara, moderna e de registro bíblico apropriado. «Creu firmemente em Deus» é mais idiomático e semanticamente mais preciso do que «creu profundamente em Deus». A âncora da nota b deve ficar junto da expressão a que a nota se refere, «foi acrescentado à casa de Israel», e não após a indicação temporal.
  terminology: «Aquior», «Deus de Israel», «carne do seu prepúcio» e «casa de Israel» são adequados. «Foi acrescentado» preserva de modo útil o passivo de προσετέθη sem introduzir terminologia posterior.
