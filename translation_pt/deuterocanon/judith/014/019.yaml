base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/019.yaml
  text: But when the commanders of the army of Assyria heard the words[a], they tore their tunics, and their souls were greatly troubled[b], and there arose a very great cry and outcry in the midst of the camp.
translation:
  language: pt
  text: Mas, quando os comandantes do exército da Assíria ouviram essas palavras, rasgaram suas túnicas[a]. A alma deles ficou profundamente perturbada[b], e houve entre eles uma gritaria e um clamor muito grande no meio do acampamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rasgar a própria túnica era uma expressão costumeira de tristeza, choque ou angústia.
    reason: cultural_note
  - marker: b
    text: Ou “o espírito deles ficou profundamente perturbado”. O grego diz literalmente “a alma deles ficou profundamente perturbada”, empregando uma expressão coletiva no singular.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν τὰ ῥήματα
  choice: Mas, quando ... ouviram essas palavras
  rationale: ὡς com o aoristo introduz uma oração temporal, e δέ marca a transição narrativa. “Essas palavras” remete naturalmente ao que acaba de ser anunciado, sem reduzir ῥήματα a uma simples “notícia”.
- source_word: οἱ ἄρχοντες τῆς δυνάμεως Ἀσσούρ
  choice: os comandantes do exército da Assíria
  rationale: No contexto militar, ἄρχοντες designa os líderes ou comandantes, e δύναμις se refere ao exército. Ἀσσούρ denota aqui a Assíria.
- source_word: τοὺς χιτῶνας αὐτῶν διέρρηξαν
  choice: rasgaram suas túnicas
  rationale: χιτών designa especificamente uma túnica, e não apenas uma peça de roupa genérica. A formulação conserva a imagem concreta do gesto de aflição.
- source_word: ἐταράχθη αὐτῶν ἡ ψυχὴ σφόδρα
  choice: A alma deles ficou profundamente perturbada
  rationale: A tradução conserva ψυχή no singular, como no grego, e mantém a construção coletiva deliberadamente incomum. “Profundamente” expressa a intensidade de σφόδρα de modo natural em português.
- source_word: ἐγένετο αὐτῶν κραυγὴ καὶ βοὴ μεγάλη σφόδρα
  choice: levantou-se entre eles uma gritaria e um clamor muito grandes
  rationale: “Levantou-se” traduz idiomaticamente ἐγένετο; “entre eles” representa o genitivo αὐτῶν no contexto. “Gritaria” e “clamor” preservam os dois substantivos enfáticos, κραυγή e βοή, enquanto “muito grandes” conserva a forte intensificação.
- source_word: ἐν μέσῳ τῆς παρεμβολῆς
  choice: no meio do acampamento
  rationale: παρεμβολή significa aqui acampamento, e a expressão mantém o sentido espacial direto de ἐν μέσῳ.
theological_decisions:
- issue: O singular coletivo de ψυχή aplicado a vários comandantes
  choice: A alma deles ficou profundamente perturbada
  alternative: Eles ficaram profundamente perturbados
  rationale: A opção escolhida preserva a forma antropológica e a tensão gramatical do grego, sem definir “alma” de acordo com um sistema teológico específico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação divide a longa sequência grega para maior clareza, sem omitir suas relações narrativas. Mantiveram-se a imagem concreta das túnicas, o singular coletivo “a alma deles” e a duplicação enfática “gritaria e clamor”.
