  text: And Bagoas went in and knocked on the curtain of the tent[b][a], for he assumed that he was sleeping with Judith.
translation:
  language: pt
  text: Bagoas entrou e bateu na cortina da tenda[a], pois supunha que Holofernes estivesse dormindo com Judite.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “golpeou a cortina da tenda”. O verbo grego pode significar tanto “bater” como “golpear”; aqui, o contexto sugere o gesto de chamar à entrada.'
    reason: lexical_alternative
  - marker: b
    text: A frase expressa apenas a suposição de Bagoas a respeito de Holofernes; o grego não afirma que Holofernes estivesse de fato dormindo com Judite.
    reason: cultural_note
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: entrou
  rationale: O aoristo de εἰσέρχομαι indica a entrada de Bagoas; “entrou” é direto e natural na narrativa.
- source_word: ἔκρουσε
  choice: bateu na
  rationale: O verbo pode significar “golpear” ou “bater”. Com a cortina da tenda como objeto, “bateu na” comunica de modo natural o gesto de anunciar sua presença, sem sugerir violência.
- source_word: αὐλαίαν
  choice: cortina
  rationale: No contexto de uma tenda, αὐλαία designa uma cortina ou peça de tecido suspensa; “cortina” é claro e evita a conotação cultual de “véu”.
- source_word: σκηνῆς
  choice: tenda
  rationale: Refere-se à tenda de Holofernes no acampamento; “tenda” é a correspondência contextual simples e adequada.
- source_word: ὑπενόειτο
  choice: supunha
  rationale: O imperfeito expressa uma suposição ou inferência em curso. “Supunha” preserva que Bagoas não sabia o que ocorria no interior.
- source_word: καθεύδειν
  choice: estivesse dormindo
  rationale: O infinitivo significa “dormir”; o subjuntivo em português se ajusta naturalmente à oração dependente de “supunha”.
- source_word: μετὰ Ἰουδείθ
  choice: com Judite
  rationale: μετά com genitivo significa “com”. A formulação conserva a possível implicação contextual sem explicitar relação sexual nem acrescentar informação ao grego.
- source_word: Βαγώας
  choice: Bagoas
  rationale: Transliteração tradicional e reconhecível do nome próprio grego.
- source_word: Ἰουδείθ
  choice: Judite
  rationale: Forma portuguesa consagrada do nome bíblico.
