  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sintaxe mantém a sequência narrativa do grego, enquanto “estivesse dormindo” expressa idiomaticamente o discurso indireto e preserva a inferência, não um fato confirmado.
