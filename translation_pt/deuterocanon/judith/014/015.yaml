  source_fidelity: A tradução comunica adequadamente a falta de resposta, a entrada no aposento, o cadáver e a decapitação. Contudo, «do corpo» explicita um elemento que o grego formula literalmente como «dele» (ἀπʼ αὐτοῦ); «lhe havia sido tirada» preserva melhor essa formulação sem sacrificar a naturalidade.
  naturalness: «Quarto», «afastou a cortina» e «caído, morto» são modernos e claros. A pontuação revista torna mais fluida a sequência narrativa. As chamadas de nota devem acompanhar os termos a que as notas se referem.
  terminology: «Dossel» é uma opção aceitável e a nota preserva a incerteza de χελωνίς. A formulação «a cabeça lhe havia sido tirada» mantém o caráter concreto e passivo do grego, sem antecipar a paráfrase interpretativa «decapitado» no texto principal.
