  text: But when no one answered[a], he drew aside the curtain and went into the bedroom, and found him lying dead on the canopy[b], and his head had been taken from him.
translation:
  language: pt
  text: Mas, como ninguém respondeu, ele afastou a cortina, entrou no quarto e o encontrou caído, morto, sobre o dossel[a]; a cabeça lhe havia sido tirada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre o dossel da cama”; possivelmente, “sobre a rede” ou “sobre a cortina” ligada à cama.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a cabeça lhe havia sido tirada”; isto é, ele havia sido decapitado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δʼ οὐθεὶς ἐπήκουσεν
  choice: Mas, como ninguém respondeu
  rationale: No contexto de alguém que chama e não recebe retorno, ἐπακούω indica atender ou responder, não apenas ouvir.
- source_word: διαστείλας
  choice: ele afastou a cortina
  rationale: O particípio significa separar ou abrir; o objeto está implícito. No cenário do quarto, “a cortina” torna a ação compreensível sem alterar seu sentido básico.
- source_word: κοιτῶνα
  choice: quarto
  rationale: κοιτών designa o aposento de dormir. “Quarto” é atual, claro e natural em português.
- source_word: ἐπὶ τῆς χελώνιδος
  choice: sobre o dossel
  rationale: Neste contexto, χελωνίς parece indicar uma estrutura, cobertura ou peça suspensa associada à cama. “Dossel” é uma tradução acessível, enquanto a incerteza quanto ao móvel exato é preservada em nota.
- source_word: ἐρριμμένον νεκρόν
  choice: caído morto
  rationale: O particípio perfeito de ῥίπτω retrata o corpo lançado ou prostrado e ainda nessa posição. “Caído morto” conserva a imagem com naturalidade, sem sugerir necessariamente que ele morreu ao cair.
- source_word: ἡ κεφαλὴ αὐτοῦ ἀφῄρητο ἀπʼ αὐτοῦ
  choice: a cabeça dele havia sido tirada do corpo
  rationale: A formulação preserva a imagem concreta de a cabeça ter sido removida, mas explicita em português o referente corporal do segundo pronome grego, evitando a expressão pouco natural “tirada dele”.
