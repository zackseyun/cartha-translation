    rationale: O grego diz literalmente que a cabeça «havia sido tirada dele». Embora «do corpo» descreva a implicação narrativa, é uma explicitação não presente na formulação fonte; «lhe havia sido tirada» preserva melhor o enunciado.
  - severity: low
