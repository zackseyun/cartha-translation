base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/006.yaml
  text: And they called Achior out of the house of Ozias. But when he came and saw the head of Holofernes in the hand of one man in the assembly of the people[a], he fell on his face, and his spirit failed.
translation:
  language: pt
  text: E chamaram Aquior para fora da casa de Ozias. Quando ele chegou e viu a cabeça de Holofernes na mão de um homem, no meio da assembleia do povo, caiu com o rosto em terra, e seu espírito desfaleceu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «seu fôlego o deixou»; isto é, ele perdeu os sentidos. O grego diz literalmente: «seu espírito desfaleceu», expressão que descreve um colapso físico ou desmaio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσαν
  choice: chamaram
  rationale: Verbo narrativo simples; «chamaram» comunica o sentido sem acrescentar a força de uma convocação formal.
- source_word: τὸν Ἀχιὼρ
  choice: Aquior
  rationale: Forma tradicional e reconhecível do nome em português.
- source_word: ἐκ τοῦ οἴκου Ὀζεία
  choice: para fora da casa de Ozias
  rationale: Preserva o sentido espacial de ἐκ e entende οἶκος, neste contexto, como a residência física.
- source_word: ὡς δὲ ἦλθεν
  choice: Quando ele chegou
  rationale: Expressa com naturalidade a transição temporal; δέ funciona aqui como leve progressão narrativa e não exige uma adversativa explícita.
- source_word: ἴδεν τὴν κεφαλὴν Ὀλοφέρνου
  choice: viu a cabeça de Holofernes
  rationale: Tradução direta, clara e próxima da estrutura grega.
- source_word: ἐν χειρὶ ἀνδρὸς ἑνὸς
  choice: na mão de um homem
  rationale: Mantém o referente masculino singular; em português, «um homem» expressa naturalmente a construção sem forçar uma ênfase numérica incerta.
- source_word: ἐν τῇ ἐκκλησίᾳ τοῦ λαοῦ
  choice: no meio da assembleia do povo
  rationale: ἐκκλησία designa aqui a reunião do povo, não «igreja» no sentido cristão posterior. «No meio de» reduz a possível leitura de que a assembleia fosse um edifício.
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: caiu com o rosto em terra
  rationale: Expressão portuguesa natural que conserva a reação corporal vívida da frase grega.
- source_word: ἐξελύθη τὸ πνεῦμα αὐτοῦ
  choice: seu espírito desfaleceu
  rationale: Preserva a imagem e a ambiguidade de πνεῦμα, sem transformar implicitamente a expressão em diagnóstico preciso de desmaio ou perda de consciência.
theological_decisions:
- issue: Sentido de πνεῦμα na descrição do colapso de Aquior
  choice: seu espírito desfaleceu
  alternative: ele perdeu os sentidos / seu fôlego o deixou
  rationale: A formulação mantém a tensão lexical entre espírito, fôlego e vigor vital, evitando decidir além do que o grego permite.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Conserva a cadência narrativa do grego, evita o uso anacrônico de «igreja» para ἐκκλησία e mantém a ambiguidade da frase final por meio de nota.
