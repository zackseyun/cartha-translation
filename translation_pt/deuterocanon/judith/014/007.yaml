base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/007.yaml
  text: And when they had taken him up[a], he fell at Judith’s feet and bowed before her, and he said, “Blessed are you in every dwelling of Judah and among every nation[b]; those who hear your name will be thrown into confusion.”
translation:
  language: pt
  text: 'Quando o levantaram, ele caiu aos pés de Judite, prostrou-se diante dela e disse: “Bendita és tu em cada morada[a] de Judá e em cada nação; os que ouvirem o teu nome ficarão perturbados[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tenda”. A palavra grega pode significar “tenda” ou, de modo mais geral, “morada” ou “habitação”.
    reason: lexical_alternative
  - marker: b
    text: Ou “ficarão confusos” ou “ficarão abalados”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέλαβον
  choice: o levantaram
  rationale: Neste contexto, o aoristo de ἀναλαμβάνω indica que o ajudaram a se levantar; a formulação conserva o movimento concreto sem introduzir a ideia técnica de acolhimento.
- source_word: προσέπεσεν τοῖς ποσὶν Ἰουδεὶθ
  choice: caiu aos pés de Judite
  rationale: Reproduz de modo natural a imagem física e o gesto de homenagem ou súplica.
- source_word: προσεκύνησεν τῷ προσώπῳ αὐτῆς
  choice: prostrou-se diante dela
  rationale: προσκυνέω pode designar adoração ou reverência. Diante de uma pessoa humana, “prostrou-se” preserva o gesto corporal de homenagem sem defini-lo como culto divino. O dativo τῷ προσώπῳ αὐτῆς é sintaticamente incomum, por isso não se acrescenta a interpretação incerta “com o rosto em terra”.
- source_word: Εὐλογημένη σὺ
  choice: Bendita és tu
  rationale: Mantém a fórmula solene de bênção e a ênfase direta do grego.
- source_word: ἐν παντὶ σκηνώματι Ἰούδα
  choice: em cada morada de Judá
  rationale: σκηνώμα pode significar “tenda” ou, em sentido mais amplo, “morada”. “Morada” é clara e digna, sem eliminar a alternativa lexical, registrada em nota.
- source_word: ἐν παντὶ ἔθνει
  choice: em cada nação
  rationale: Conserva a construção distributiva singular de πᾶς e estende a fama de Judite para além de Judá.
- source_word: ταραχθήσονται
  choice: ficarão perturbados
  rationale: O futuro passivo de ταράσσω expressa perturbação, agitação ou abalo. A escolha preserva essa amplitude sem restringir o sentido exclusivamente a medo ou confusão.
theological_decisions:
- issue: Sentido de προσκυνέω em um gesto dirigido a Judite
  choice: prostrou-se diante dela
  alternative: adorou-a / prestou-lhe homenagem
  rationale: Como o gesto é dirigido a Judite, uma pessoa humana, a tradução descreve a prostração reverente sem importar a conclusão de que se trata de adoração divina; ao mesmo tempo, não reduz o verbo a uma saudação comum.
translation_notes:
  register: Português moderno, claro e solene, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A colocação dos marcadores de nota acompanha exatamente os termos a que as alternativas lexicais se referem.
