  yaml_path: translation/deuterocanon/judith/014/013.yaml
  text: And they came to Holofernes’s tent[a], and said to the one over all his affairs, “Wake our lord at once, because the slaves have dared to come down against us for battle, so that they may be utterly destroyed.”
translation:
  language: pt
  text: 'E chegaram à tenda de Holofernes e disseram ao encarregado de tudo o que lhe pertencia[a]: “Desperte imediatamente o nosso senhor, pois os escravos tiveram a ousadia de descer contra nós para a batalha, para que sejam completamente exterminados.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao que estava encarregado de tudo o que era dele”, isto é, o principal administrador ou assistente de Holofernes.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγένοντο
  choice: chegaram
  rationale: O verbo indica a chegada a um lugar; “chegaram” é natural em português e mantém o movimento narrativo.
- source_word: σκηνή
  choice: tenda
  rationale: No contexto militar, refere-se à tenda de Holofernes, sem conotação cultual.
- source_word: τῷ οὔτι ἐπὶ πάντων τῶν αὐτοῦ
  choice: ao encarregado de todos os seus bens
  rationale: A expressão transmitida é um pouco difícil, mas designa o responsável por tudo o que pertencia a Holofernes. A formulação evita atribuir-lhe um título específico não expresso no grego.
- source_word: Ἔγειρον δὴ
  choice: Acorde agora mesmo
  rationale: O imperativo e a partícula comunicam uma ordem urgente; esta formulação é clara e idiomática.
- source_word: κύριον
  choice: senhor
  rationale: Refere-se aqui a um superior humano, Holofernes, por isso recebe inicial minúscula.
- source_word: δοῦλοι
  choice: escravos
  rationale: O termo é empregado de modo depreciativo para pessoas tidas como subalternas; “escravos” preserva melhor sua força do que “servos”.
- source_word: καταβαίνειν ἐφʼ ἡμᾶς
  choice: descer contra nós
  rationale: Preserva tanto a imagem espacial de descida quanto o sentido hostil da movimentação militar.
- source_word: εἰς πόλεμον
  choice: para a batalha
  rationale: Expressa a finalidade militar de maneira natural em português.
- source_word: ἵνα ἐξολοθρευθῶσιν εἰς τέλος
  choice: a fim de serem completamente exterminados
  rationale: A tradução conserva a finalidade expressa por ἵνα e a ênfase de εἰς τέλος na destruição total.
theological_decisions:
- issue: Tradução de δοῦλοι como designação depreciativa em contexto militar
  choice: escravos
  alternative: servos
  rationale: Embora “servos” seja possível em outros contextos, aqui os falantes menosprezam os inimigos como pessoas subalternas. “Escravos” mantém a contundência social e retórica do grego.
translation_notes:
  register: Português moderno, digno e narrativamente direto, com ampla legibilidade brasileira. A fala mantém a urgência militar e o tom depreciativo do original sem acrescentar um cargo técnico ausente do grego.
