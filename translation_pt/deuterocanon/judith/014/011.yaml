  text: When dawn came up, they hung the head of Holofernes from the wall, and every man of Israel took up his weapons and went out in companies to the mountain passes.
translation:
  language: pt
  text: Quando a aurora surgiu, penduraram a cabeça de Holofernes na muralha[a], e cada homem de Israel tomou suas armas; todos saíram em companhias para as subidas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “da muralha”; a expressão grega descreve o ponto do qual a cabeça ficou pendurada para ser exibida.
    reason: lexical_alternative
  - marker: b
    text: Isto é, os acessos que subiam; conforme o terreno, podem ter sido passagens nas montanhas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡνίκα
  choice: quando
  rationale: Introduz naturalmente a circunstância temporal, sem acrescentar um marcador discursivo ausente do grego.
- source_word: ὁ ὄρθρος ἀνέβη
  choice: a aurora surgiu
  rationale: Conserva a imagem da aurora que se levanta, em português atual e digno.
- source_word: ἐκρέμασαν
  choice: penduraram
  rationale: Expressa de modo direto o ato de suspender a cabeça para exibição.
- source_word: τὴν κεφαλὴν Ὀλοφέρνου
  choice: a cabeça de Holofernes
  rationale: Reproduz claramente o objeto direto e o genitivo de posse.
- source_word: ἐκ τοῦ τείχους
  choice: na muralha
  rationale: É a formulação portuguesa mais natural para o local de exibição; a construção grega com ἐκ, literalmente ligada à ideia de suspensão 'da muralha', é registrada em nota.
- source_word: πᾶς ἀνὴρ Ἰσραήλ
  choice: cada homem de Israel
  rationale: Preserva a forma masculina singular distributiva explícita no grego.
- source_word: ἀνέλαβεν
  choice: tomou
  rationale: No contexto militar, comunica naturalmente que cada homem pegou ou tomou suas armas.
- source_word: τὰ ὅπλα αὐτοῦ
  choice: suas armas
  rationale: ὅπλα designa aqui armas ou equipamento bélico, sem exigir o sentido mais restrito de armadura.
- source_word: ἐξήλθοσαν
  choice: saiu
  rationale: Concorda em português com o sujeito distributivo singular 'cada homem' e mantém o sentido básico do verbo.
- source_word: κατὰ σπείρας
  choice: em companhias
  rationale: Indica agrupamentos organizados, provavelmente militares, sem impor um tamanho técnico exato às unidades.
- source_word: ἐπὶ τὰς ἀναβάσεις
  choice: em direção às subidas
  rationale: Mantém a referência literal e geográfica às vias ascendentes sem especificá-las indevidamente como desfiladeiros ou passagens de montanha.
