base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/018.yaml
  text: The slaves have failed; one woman of the Hebrews has brought shame on the house of King Nebuchadnezzar. For look—Holofernes is lying on the ground[a], and his head is not on him.
translation:
  language: pt
  text: 'Os escravos falharam; uma só mulher dos hebreus trouxe vergonha sobre a casa do rei Nabucodonosor. Pois vejam: Holofernes está caído no chão, e sua cabeça não está sobre ele.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠθέτησαν
  choice: falharam
  rationale: No contexto, ἀθετέω acusa os subordinados de grave falha no dever. “Falharam” é natural e preserva a amplitude do verbo sem impor a ideia mais específica de quebra de aliança ou traição.
- source_word: οἱ δοῦλοι
  choice: os escravos
  rationale: δοῦλοι pode designar servos ou escravos. Neste ambiente doméstico-militar sob autoridade régia, “escravos” preserva de modo mais explícito a condição de sujeição indicada pelo termo.
- source_word: ἐποίησεν αἰσχύνην
  choice: trouxe vergonha
  rationale: A expressão grega, literalmente “fez vergonha”, indica que a mulher causou desonra pública; “trouxe vergonha” reproduz esse efeito em português natural.
- source_word: μία γυνὴ τῶν Ἑβραίων
  choice: uma só mulher dos hebreus
  rationale: “Uma só” conserva a ênfase de μία na singularidade da mulher, enquanto “dos hebreus” mantém a identificação coletiva do original.
- source_word: εἰς τὸν οἶκον
  choice: sobre a casa
  rationale: Com linguagem de vergonha, “sobre a casa” expressa a desonra que recai sobre a casa ou dinastia, evitando o literalismo pouco natural “para dentro da casa”.
- source_word: χαμαί
  choice: caído no chão
  rationale: χαμαί significa “no chão”. “Está caído no chão” torna clara e vívida a situação do corpo em português.
- source_word: ἡ κεφαλὴ οὐκ ἔστιν ἐπʼ αὐτῷ
  choice: sua cabeça não está sobre ele
  rationale: A formulação mantém a imagem concreta e chocante do grego, sem suavizá-la para “ele está sem cabeça”.
theological_decisions:
- issue: Sentido de δοῦλοι neste contexto narrativo
  choice: os escravos
  alternative: os servos
  rationale: O termo pode abranger ambas as ideias, mas “escravos” preserva a condição de sujeição que provavelmente caracteriza os atendentes da casa e do acampamento. A alternativa mais ampla, “servos”, não foi inserida como nota porque não altera o sentido central do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação conserva a progressão acusatória e o impacto visual da descoberta. “Pois vejam” representa ὅτι ἰδού como introdução enfática da prova apresentada.
