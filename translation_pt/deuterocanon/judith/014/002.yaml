review_pass:
  verdict: revise
  source_fidelity: A tradução transmite bem a sequência temporal, a mobilização militar, a descida apenas fingida e a proibição final. Contudo, «designarão um líder para eles» não representa com precisão εἰς αὐτούς, que neste contexto significa pôr um líder à frente deles/sobre eles, e não meramente para eles.
  naturalness: O português é claro e de registro apropriado. «Sairá para fora da cidade» é redundante; «sairá da cidade» é mais natural sem perda de sentido.
  terminology: «Aurora despontar», «armas de guerra», «homem forte», «guarda avançada» e «filhos de Assur» são escolhas defensáveis. A nota sobre προφυλακή preserva adequadamente a alternativa «posto avançado».
