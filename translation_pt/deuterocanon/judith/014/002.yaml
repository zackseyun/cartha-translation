base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/002.yaml
  text: And it shall be[a], when dawn breaks and the sun rises upon the earth, each of you shall take up your weapons of war, and every mighty man shall go out beyond the city. You shall appoint a leader over them, as though going down to the plain against the advance guard of the sons of Asshur[b]; but you shall not go down.
translation:
  language: pt
  text: E acontecerá que, quando a aurora despontar e o sol surgir sobre a terra, cada um de vocês pegará suas armas de guerra, e todo homem forte sairá da cidade. Vocês colocarão um líder à frente deles, como se estivessem descendo à planície contra a guarda avançada[a] dos filhos de Assur[b]; mas não descerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «contra o posto avançado dos assírios». O termo grego προφυλακή pode designar uma guarda avançada, um posto avançado ou uma sentinela à frente.
    reason: lexical_alternative
  - marker: b
    text: «Filhos de Assur» traduz literalmente a expressão grega e se refere aos assírios.
    reason: cultural_note
lexical_decisions:
- source_word: διαφαύσῃ ὁ ὄρθρος
  choice: a aurora despontar
  rationale: Expressão portuguesa natural para o aparecimento da primeira luz, preservando a imagem do amanhecer que se torna visível.
- source_word: ἐξέλθῃ ὁ ἥλιος ἐπὶ τὴν γῆν
  choice: o sol surgir sobre a terra
  rationale: Mantém o movimento explícito de ἐξέρχομαι e a imagem de o sol aparecer sobre a terra, sem recorrer à formulação pouco natural «sair sobre a terra».
- source_word: ἀναλήμψεσθε ... τὰ σκεύη τὰ πολεμικὰ
  choice: pegará suas armas de guerra
  rationale: No contexto da preparação militar, comunica com clareza que cada homem deve tomar em mãos seu equipamento bélico; «armas de guerra» é mais direto para leitores comuns.
- source_word: πᾶς ἀνὴρ ἰσχύων
  choice: todo homem forte
  rationale: Preserva tanto a referência masculina explícita de ἀνήρ quanto a ideia de força ou capacidade expressa por ἰσχύων.
- source_word: δώσετε ἀρχηγὸν εἰς αὐτούς
  choice: Vocês designarão um líder para eles
  rationale: Expressa naturalmente o ato de colocar alguém na liderança do grupo, sem tornar ἀρχηγός mais especificamente militar do que o grego exige.
- source_word: ὡς καταβαίνοντες ἐπὶ τὸ πεδίον
  choice: como se estivessem descendo à planície
  rationale: «Como se» preserva a aparência ou simulação indicada por ὡς, elemento essencial da estratégia descrita.
- source_word: εἰς τὴν προφυλακὴν υἱῶν Ἀσσούρ
  choice: contra a guarda avançada dos filhos de Assur
  rationale: «Guarda avançada» corresponde ao sentido militar provável de προφυλακή; «contra» se ajusta ao movimento hostil no contexto, enquanto a nota registra a amplitude lexical. A expressão étnica literal «filhos de Assur» foi preservada.
- source_word: οὐ καταβήσεσθε
  choice: mas não descerão
  rationale: Conserva a forma futura com força instrutiva/proibitiva e o contraste enfático com a descida apenas simulada.
theological_decisions:
- issue: Referência masculina em πᾶς ἀνὴρ ἰσχύων
  choice: todo homem forte
  alternative: toda pessoa apta / todo guerreiro
  rationale: O grego emprega explicitamente ἀνήρ, «homem», em um contexto de mobilização militar. A tradução mantém a referência masculina e não a neutraliza.
- issue: Identificação étnica em υἱῶν Ἀσσούρ
  choice: filhos de Assur
  alternative: assírios
  rationale: A formulação literal preserva a expressão do texto grego; uma nota esclarece sua referência aos assírios sem substituir silenciosamente a imagem de filiação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construções naturais para leitores brasileiros. Emprega «vocês» em vez de formas de segunda pessoa plural hoje pouco correntes, preserva o paralelismo das instruções e mantém a tensão entre a descida fingida e a ordem final de não descer.
