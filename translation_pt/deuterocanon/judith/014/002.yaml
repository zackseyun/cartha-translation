    issue: «Vocês designarão um líder para eles»
    rationale: δώσετε ἀρχηγὸν εἰς αὐτούς tem o sentido de estabelecer ou colocar um líder sobre/à frente do grupo. «Para eles» pode sugerir apenas que o líder lhes é destinado, sem expressar sua autoridade sobre eles.
  - severity: low
    issue: «sairá para fora da cidade»
    rationale: A locução é pleonástica em português moderno. «Sairá da cidade» comunica plenamente ἔξω τῆς πόλεως e melhora a fluência.
