base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/005.yaml
  text: But before you do these things[a], call Achior the Ammonite to me[c][b], so that he may see and recognize the one who has treated the house of Israel with contempt and has sent him to us as if to death.
translation:
  language: pt
  text: Mas, antes de vocês fazerem essas coisas, chamem Aquior, o amonita, para junto de mim, a fim de que ele veja e reconheça[a] aquele que tratou com desprezo a casa de Israel e que o[b] enviou até nós como que para a morte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que ele veja e conheça plenamente”. O grego emprega em sequência dois verbos, “ver” e “reconhecer/conhecer”, para dar ênfase.'
    reason: lexical_alternative
  - marker: b
    text: 'O pronome “o” provavelmente se refere a Aquior: aquele que desprezou a casa de Israel o havia enviado até eles como quem o entregava à morte.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “para a morte dele”. Mais literalmente, o grego diz “como que para a morte”, podendo sugerir que Aquior foi entregue como alguém dado por morto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ δὲ τοῦ ποιῆσαι ταῦτα
  choice: Mas, antes de vocês fazerem essas coisas
  rationale: A construção com πρό e infinitivo articular expressa anterioridade temporal; o plural de ποιῆσαι é explicitado naturalmente em português, e δέ funciona como transição leve.
- source_word: καλέσατέ μοι
  choice: chamem ... para junto de mim
  rationale: O imperativo plural é preservado. A expressão traduz de modo natural o sentido de convocar alguém à presença da falante e mantém o dativo μοι.
- source_word: Ἀχιὼρ τὸν Ἀμμανείτην
  choice: Aquior, o amonita
  rationale: Usa a forma tradicional e reconhecível do nome em português e traduz diretamente a designação étnica.
- source_word: ἵνα ἴδῃ ἐπιγνοῖ
  choice: a fim de que ele veja e reconheça
  rationale: Os dois subjuntivos de finalidade são mantidos, preservando a progressão enfática entre ver e reconhecer plenamente.
- source_word: τὸν ἐκφαυλίσαντα
  choice: aquele que tratou com desprezo
  rationale: A formulação comunica o sentido de menosprezar ou considerar sem valor, com linguagem natural e digna.
- source_word: τὸν οἶκον τοῦ Ἰσραήλ
  choice: a casa de Israel
  rationale: Preserva a expressão bíblica que designa Israel como povo.
- source_word: καὶ αὐτὸν ... ἀποστείλαντα εἰς ἡμᾶς
  choice: e que o enviou até nós
  rationale: Mantém o pronome masculino e a coordenação dos dois particípios referentes ao mesmo agente, sem substituir o pronome por uma identificação interpretativa.
- source_word: ὡς εἰς θάνατον
  choice: como que para a morte
  rationale: Preserva a qualificação introduzida por ὡς e a tensão da expressão grega, evitando tornar a morte efetiva ou intencionalmente certa demais.
theological_decisions:
- issue: Referente do pronome αὐτόν
  choice: Manter o pronome “o”, com nota indicando que provavelmente se refere a Aquior.
  alternative: Explicitar “Aquior” no texto principal.
  rationale: O contexto favorece Aquior como referente, mas a tradução não deve eliminar a forma pronominal nem apresentar a identificação como mais explícita do que no grego.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. O plural do imperativo é expresso por “vocês”, sem regionalismo excessivo. As notas foram colocadas junto às expressões a que efetivamente se referem.
