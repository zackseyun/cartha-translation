base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/021.yaml
  text: And Uzziah took him from the assembly into his house[a], and made a feast for the elders[b]; and they called on the God of Israel for help all that night.
translation:
  language: pt
  text: E Ozias o levou da assembleia para sua casa[a] e preparou um banquete para os anciãos[b]. E durante toda aquela noite eles invocaram o Deus de Israel, pedindo ajuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido por “assembleia” significa aqui a comunidade reunida, não “igreja” no sentido cristão posterior.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “preparou bebida” ou “fez um banquete com bebida”; a expressão se refere à realização de um banquete.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρέλαβεν
  choice: levou
  rationale: Neste contexto, o verbo indica que Ozias tomou o homem consigo e o conduziu de um lugar a outro; “levou” expressa naturalmente esse movimento em português.
- source_word: ἐκ τῆς ἐκκλησίας
  choice: da assembleia
  rationale: Aqui, ἐκκλησία designa a comunidade reunida, não uma igreja no sentido cristão posterior. “Assembleia” evita anacronismo e preserva o caráter público da reunião.
- source_word: εἰς οἶκον ἑαυτοῦ
  choice: para sua casa
  rationale: A expressão indica a residência do próprio Ozias; esta formulação é clara, natural e fiel.
- source_word: ἐποίησεν πότον
  choice: preparou um banquete
  rationale: Embora a expressão seja literalmente relacionada a bebida, funciona como idioma para oferecer uma refeição festiva ou banquete. “Preparou um banquete” comunica o evento social sem literalismo obscuro.
- source_word: τοῖς πρεσβυτέροις
  choice: para os anciãos
  rationale: No contexto, refere-se aos líderes reconhecidos da comunidade, não apenas a homens idosos. “Anciãos” conserva essa função social.
- source_word: ἐπεκαλέσαντο
  choice: invocaram
  rationale: A forma verbal descreve um apelo dirigido a Deus em oração. “Invocaram” mantém o sentido religioso com registro digno e corrente.
- source_word: τὸν θεὸν Ἰσραήλ
  choice: o Deus de Israel
  rationale: Tradução direta do título genitivo que identifica o Deus de Israel.
- source_word: εἰς βοήθειαν
  choice: pedindo ajuda
  rationale: A expressão indica que a invocação tinha por finalidade obter auxílio divino. A construção explicita de modo natural em português a relação entre invocar e pedir ajuda.
- source_word: ὅλην τὴν νύκτα ἐκείνην
  choice: durante toda aquela noite
  rationale: O acusativo indica extensão temporal; a formulação preserva claramente a duração por toda a noite.
