lexical_decisions:
- source_word: καὶ ὡς εἶδαν
  choice: Quando ... viram
  rationale: ὡς com o aoristo tem aqui valor temporal; em português, “quando” introduz naturalmente a reação provocada pelo avistamento.
- source_word: οἱ ἄνδρες τῆς πόλεως
  choice: os homens da cidade
  rationale: Mantém o substantivo masculino explícito ἄνδρες e reproduz a expressão grega com clareza.
- source_word: ἐπὶ τὴν κορυφὴν τοῦ ὄρους
  choice: no alto do monte / em direção ao alto do monte
  rationale: κορυφή indica o alto ou cume. Após “viram”, a expressão é locativa; com o verbo de movimento, a preposição acusativa recebe tradução direcional.
- source_word: ἀνέλαβον τὰ ὅπλα αὐτῶν
  choice: pegaram suas armas
  rationale: ἀναλαμβάνω com ὅπλα descreve tomar as armas para agir; “pegaram suas armas” é atual, claro e fiel.
- source_word: ἐπῆλθον ἔξω τῆς πόλεως
  choice: saíram da cidade
  rationale: No contexto, a locução descreve o movimento dos homens para fora da cidade, sem exigir que se explicite uma nuance ofensiva incerta.
- source_word: πᾶς ἀνὴρ σφενδονήτης
  choice: todos os homens que usavam fundas
  rationale: Expressa de modo natural o valor distributivo da frase, preserva a referência explícita a homens e torna compreensível o nome ocupacional σφενδονήτης.
- source_word: διεκράτησαν τὴν ἀνάβασιν αὐτῶν
  choice: barraram a subida deles
  rationale: διεκράτησαν comunica contenção ou impedimento, e ἀνάβασις designa a subida; “barraram” preserva o contexto defensivo e topográfico.
- source_word: ἔβαλλον ἐν λίθοις ἐπʼ αὐτούς
  choice: continuaram atirando pedras contra eles
  rationale: O imperfeito ἔβαλλον retrata ação contínua ou repetida; “continuaram atirando” explicita esse aspecto, enquanto “pedras” traduz o instrumento expresso por ἐν λίθοις.
