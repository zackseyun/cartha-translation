  text: And when the men of the city saw them on the top of the mountain, they took up their weapons and went out of the city to the top of the mountain; and every man who used a sling held back their ascent and kept throwing stones at them.
translation:
  language: pt
  text: Quando os homens da cidade os viram no alto do monte, pegaram suas armas e saíram da cidade para o alto do monte. Todos os homens que usavam fundas[a] barraram a subida deles e continuaram atirando pedras contra eles.
