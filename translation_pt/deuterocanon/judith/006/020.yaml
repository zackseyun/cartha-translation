  text: And they encouraged Achior[a], and praised him greatly.
translation:
  language: pt
  text: E eles encorajaram Aquior[a] e o elogiaram muito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «consolaram», «animaram», «exortaram» ou «instaram», conforme a amplitude de sentido atribuída a παρεκάλεσαν neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλεσαν
  choice: encorajaram
  rationale: O verbo παρακαλέω pode significar encorajar, consolar, exortar ou instar. Neste contexto narrativo, o apoio dado a Aquior favorece «encorajaram», sem eliminar as demais possibilidades, registradas em nota.
- source_word: Ἀχιὼρ
  choice: Aquior
  rationale: Adota-se a forma tradicional portuguesa do nome próprio, correspondente ao grego Ἀχιώρ.
- source_word: ἐπήνεσαν
  choice: elogiaram
  rationale: O verbo ἐπαινέω expressa elogio ou louvor dirigido a uma pessoa. «Elogiaram» é direto, natural e adequado ao contexto narrativo.
- source_word: σφόδρα
  choice: muito
  rationale: O advérbio intensifica o verbo anterior. «Muito» preserva a intensidade em português corrente e natural.
