  to: E quem é você, Aquior, e quem são os homens a soldo de Efraim[a] entre todos os filhos de Moabe, para que você tenha profetizado entre nós como fez hoje e dito que não se deve guerrear contra a linhagem de Israel[b], porque o Deus deles os defenderá? E quem é deus, senão Nabucodonosor?[c] Ele enviará o seu poderio e os exterminará da face da terra, e o Deus deles não os livrará.
