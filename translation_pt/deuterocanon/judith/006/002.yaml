base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/002.yaml
  text: And who are you[a], Achior, and the hirelings of Ephraim among all the sons of Moab, that you have prophesied among us as you did today, and said that one should not make war against the house of Israel because their God will defend them? And who is God except Nebuchadnezzar? He himself will send his force and destroy them from the face of the earth[c][b], and their God will not rescue them.
translation:
  language: pt
  text: E quem é você, Aquior, e quem são os homens a soldo de Efraim[a] entre todos os filhos de Moabe, para que você tenha profetizado entre nós como fez hoje e dito que não se deve guerrear contra a linhagem de Israel[b], porque o Deus deles os defenderá? E quem é deus, senão Nabucodonosor?[c] Ele enviará o seu poderio e os exterminará da face da terra, e o Deus deles não os livrará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mercenários de Efraim” ou “homens contratados de Efraim”. O termo grego designa pessoas que servem mediante pagamento e pode ter aqui um tom depreciativo.
    reason: lexical_alternative
  - marker: b
    text: Ou “o povo de Israel”. O grego diz literalmente “a linhagem de Israel”, ressaltando a origem comum e os vínculos de parentesco.
    reason: lexical_alternative
  - marker: c
    text: A pergunta que apresenta Nabucodonosor como deus é uma declaração arrogante do personagem, não uma afirmação do narrador.
    reason: cultural_note
lexical_decisions:
- source_word: μισθωτοὶ
  choice: mercenários
  rationale: O termo designa pessoas que servem mediante pagamento. No contexto militar e depreciativo da fala, “mercenários” é natural e preserva o tom de desprezo, embora “homens contratados” também seja possível.
- source_word: ἐπροφήτευσας
  choice: ter profetizado
  rationale: Mantém a linguagem profética explícita do grego e deixa que o contexto comunique o tom hostil ou sarcástico do orador.
- source_word: τὸ γένος Ἰσραήλ
  choice: a linhagem de Israel
  rationale: “Linhagem” conserva o componente de origem étnica e ancestral de γένος sem recorrer ao termo moderno e potencialmente equívoco “raça”.
- source_word: μὴ πολεμῆσαι
  choice: não se deve guerrear contra
  rationale: Expressa em português corrente o sentido proibitivo do infinitivo dependente de “dito”.
- source_word: ὑπερασπιεῖ
  choice: os defenderá
  rationale: Preserva de modo conciso o sentido de proteger ou tomar a defesa de alguém, adequado ao cenário militar.
- source_word: τὸ κράτος αὐτοῦ
  choice: o seu poderio
  rationale: κράτος pode indicar força, poder ou domínio. “Poderio” comunica a força efetiva de Nabucodonosor no contexto militar sem restringir o referente apenas ao exército.
- source_word: ἐξολεθρεύσει
  choice: os exterminará
  rationale: O verbo tem força intensiva e pode significar destruir por completo; “exterminará” preserva essa severidade.
- source_word: ἀπὸ προσώπου τῆς γῆς
  choice: da face da terra
  rationale: Mantém a expressão bíblica convencional e sua solenidade.
- source_word: ῥύσεται
  choice: livrará
  rationale: Traduz o resgate de um perigo concreto e imediato, com registro bíblico natural em português.
theological_decisions:
- issue: A afirmação de que Nabucodonosor é deus
  choice: E quem é deus, senão Nabucodonosor?
  alternative: E quem é Deus, senão Nabucodonosor?
  rationale: O grego não distingue maiúsculas e minúsculas. A inicial minúscula em “deus” destaca a predicação arrogante e blasfema do personagem sem apresentá-la como afirmação do narrador; a nota torna explícita essa função retórica.
- issue: Referências ao Deus de Israel
  choice: o Deus deles
  alternative: o deus deles
  rationale: A maiúscula identifica de modo natural em português o Deus adorado por Israel, ainda que a fala venha de um adversário; isso não altera o desprezo expresso pelo personagem.
translation_notes:
  register: 'Português moderno, digno e de leitura ampla, com formas brasileiras naturais como “você”. Conservam-se a retórica insultuosa, a linguagem profética e a tensão teológica da fala. Os nomes seguem as formas portuguesas consagradas: Aquior, Efraim, Moabe e Nabucodonosor.'
