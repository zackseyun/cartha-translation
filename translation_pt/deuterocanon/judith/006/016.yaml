  text: And he called together all the elders of the city, and all their young men and women ran together into the assembly, and they set Achior in the midst of all their people, and Uzziah asked him what had happened.
translation:
  language: pt
  text: Então ele convocou todos os anciãos da cidade, e todos os jovens e as mulheres correram para a assembleia. Puseram Aquior no meio de todo o povo, e Ozias lhe perguntou o que havia acontecido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεκάλεσεν
  choice: convocou
  rationale: Expressa de modo natural e conciso o ato de chamar pessoas para se reunirem, preservando o valor causativo do verbo composto.
- source_word: πρεσβυτέρους
  choice: anciãos
  rationale: No contexto cívico, indica líderes reconhecidos da comunidade, e não apenas homens idosos.
- source_word: συνέδραμον
  choice: correram
  rationale: Conserva a ideia de movimento apressado presente no verbo grego, em vez de reduzi-lo ao sentido mais neutro de simplesmente reunir-se.
- source_word: πᾶς νεανίσκος αὐτῶν καὶ αἱ γυναῖκες
  choice: todos os jovens e as mulheres
  rationale: O singular coletivo νεανίσκος é vertido naturalmente pelo plural português; o artigo antes de γυναῖκες favorece manter o segundo grupo explicitamente distinto.
- source_word: ἐκκλησίαν
  choice: assembleia
  rationale: Refere-se aqui à reunião pública da comunidade, sem a conotação anacrônica de uma instituição eclesiástica posterior.
- source_word: ἔστησαν
  choice: puseram
  rationale: Com objeto e indicação de lugar, o verbo significa fazer alguém ficar em determinada posição; 'puseram' é claro e idiomático.
- source_word: ἐν μέσῳ παντὸς τοῦ λαοῦ αὐτῶν
  choice: no meio de todo o povo
  rationale: Preserva a imagem espacial e a exposição de Aquior diante da comunidade inteira, sem tornar o possessivo grego pesado em português.
- source_word: ἐπηρώτησεν
  choice: perguntou
  rationale: Equivalente narrativo direto e natural para a indagação de Ozias.
- source_word: τὸ συμβεβηκός
  choice: o que havia acontecido
  rationale: Reproduz de modo idiomático o particípio perfeito substantivado e seu aspecto de fato já ocorrido.
