translation:
  language: pt
  text: e então o ferro do meu exército e o povo dos meus servos atravessarão os seus lados[a], e você cairá entre os feridos deles[b], quando eles voltarem;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“O ferro do meu exército” provavelmente emprega “ferro” como metonímia para armas ou força armada; também se poderia traduzir mais interpretativamente: “as espadas do meu exército”. “Os seus lados” também pode significar “os seus flancos” ou “as suas costelas”.'
    reason: lexical_alternative
  - marker: b
    text: O grego traz a expressão comprimida “entre os feridos deles”. O pronome pode ser entendido contextualmente como referência aos feridos causados por eles, mas essa relação não é explicitada no texto grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: διελεύσεται
  choice: atravessarão
  rationale: O futuro médio de διέρχομαι expressa passagem através de algo; no contexto bélico, “atravessarão” conserva tanto o movimento quanto a violência implícita. O plural em português acomoda os dois sujeitos coordenados.
- source_word: ὁ σίδηρος
  choice: o ferro
  rationale: Mantém literalmente a metonímia vívida do grego para armas ou força armada de ferro, sem especificar indevidamente “espadas”.
- source_word: τῆς στρατείας μου
  choice: do meu exército
  rationale: Neste contexto, στρατεία designa a força militar, e não primariamente a campanha abstrata.
- source_word: ὁ λαὸς τῶν θεραπόντων μου
  choice: o povo dos meus servos
  rationale: Preserva λαός como “povo” e verte θεράπων pelo termo amplo e natural “servo”, que aqui pode designar servidores ou homens a serviço militar.
- source_word: τὰς πλευράς σου
  choice: os seus lados
  rationale: πλευρά pode significar lados, flancos ou costelas. “Lados” conserva a amplitude e a possível personificação do destinatário.
- source_word: πεσῇ
  choice: você cairá
  rationale: “Cair” preserva a expressão concisa de derrota, ferimento ou morte sem decidir além do texto.
- source_word: ἐν τοῖς τραυματίαις αὐτῶν
  choice: entre os feridos por eles
  rationale: τραυματίαις designa pessoas feridas. A construção portuguesa explicita a relação mais provável do pronome αὐτῶν, sem eliminar em nota a compressão do grego.
- source_word: ὅταν ἐπιστρέψωσιν
  choice: quando eles voltarem
  rationale: ὅταν com subjuntivo introduz uma circunstância temporal futura e indefinida; “quando eles voltarem” é natural e preserva essa referência.
