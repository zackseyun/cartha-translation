  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Conserva-se a imagem incomum “o ferro do meu exército” e a personificação no singular (“você”, “seus lados”), enquanto a nota registra as ambiguidades lexicais reais. A pontuação final mantém o caráter continuativo do ponto e vírgula da fonte.
