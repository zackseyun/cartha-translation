  text: And after going down below the mountain[a], they bound Achior and left him lying at the foot of the mountain, and they went away to their lord.
translation:
  language: pt
  text: E, depois de descerem ao sopé do monte, amarraram Aquior e o deixaram caído ao pé do monte; então foram embora para junto do seu senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποδύσαντες
  choice: depois de descerem
  rationale: O particípio aoristo indica uma ação anterior à de amarrar Aquior; a formulação preserva essa sequência de modo natural em português.
- source_word: ὑποκάτω τοῦ ὄρους
  choice: para a parte de baixo do monte
  rationale: Expressa a posição inferior em relação ao monte sem sugerir que entraram debaixo dele.
- source_word: ἔδησαν
  choice: amarraram
  rationale: δέω significa prender ou atar; 'amarraram' é claro e corrente no contexto.
- source_word: ἀφῆκαν ἐρριμμένον
  choice: o deixaram ali, caído
  rationale: A construção descreve Aquior deixado no estado resultante de ter sido lançado ao chão. 'Caído' soa natural, enquanto 'ali' explicita apenas a permanência no local indicada pelo contexto.
- source_word: ὑπὸ τὴν ῥίζαν τοῦ ὄρους
  choice: junto à base do monte
  rationale: ῥίζα é literalmente 'raiz', mas aqui designa topograficamente a base do monte.
- source_word: ἀπῴχοντο
  choice: voltaram
  rationale: O verbo indica que se retiraram ou partiram; com o destino expresso, 'voltaram' comunica naturalmente que regressaram ao superior deles.
- source_word: πρὸς τὸν κύριον αὐτῶν
  choice: para o seu senhor
  rationale: κύριος refere-se aqui ao superior humano dos soldados. A minúscula e o possessivo deixam isso claro.
- source_word: τὸν Ἀχιὼρ
  choice: Aquior
  rationale: Forma tradicional e reconhecível do nome em português.
theological_decisions:
- issue: Sentido de κύριος aplicado a um superior humano
  choice: seu senhor
  alternative: seu chefe
  rationale: O contexto aponta inequivocamente para um superior humano, não para Deus. 'Senhor' mantém a correspondência lexical sem introduzir conotação divina, indicada em português por minúscula.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluente. Mantém a repetição de 'monte' presente no grego e evita o literalismo estranho de 'raiz do monte'.
