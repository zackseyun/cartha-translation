    issue: «voltaram» para ἀπῴχοντο
    rationale: «Voltaram» introduz a noção de regressar a um ponto anterior. O grego afirma que partiram em direção ao senhor deles, sem tornar esse retorno lexicalmente necessário. «Foram embora» preserva o sentido sem acréscimo.
  - severity: low
    issue: «para a parte de baixo do monte» para ὑποκάτω τοῦ ὄρους
    rationale: 'A expressão é compreensível, mas pouco natural e menos precisa: pode designar a parte baixa do próprio monte. «Ao sopé do monte» comunica a posição inferior/abaixo do monte de modo idiomático.'
  revised_text: E, depois de descerem ao sopé do monte, amarraram Aquior e o deixaram caído ao pé do monte; então foram embora para junto do seu senhor.
