- from: E, depois de descerem para a parte de baixo do monte, amarraram Aquior e o deixaram ali, caído junto à base do monte, e voltaram para o seu senhor.
  to: E, depois de descerem ao sopé do monte, amarraram Aquior e o deixaram caído ao pé do monte; então foram embora para junto do seu senhor.
  rationale: A revisão elimina a implicação não exigida de «voltaram» e substitui uma perífrase geográfica pouco natural por «ao sopé do monte». Mantém-se «caído» como português idiomático para o estado em que Aquior foi deixado, sem apagar o contexto de violência; a repetição de «monte» preserva a ênfase topográfica do grego.
