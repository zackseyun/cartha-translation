  text: And his slaves seized him and led him outside the camp into the plain, and they went up from the midst of the plain into the hill country, and they came to the springs that were below Bethulia.
translation:
  language: pt
  text: E os escravos dele o agarraram e o conduziram para fora do acampamento, até a planície. Então, subiram do meio da planície para a região montanhosa e chegaram às fontes que ficavam abaixo de Betúlia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλοι
  choice: escravos
  rationale: Preserva de modo transparente o sentido de pessoas sujeitas à autoridade de Holofernes, sem suavizar sua condição como faria «servos».
- source_word: συνέλαβον
  choice: agarraram
  rationale: Expressa o ato físico de segurar alguém com força, sem acrescentar a conotação jurídica de «prenderam».
- source_word: παρεμβολῆς
  choice: acampamento
  rationale: No contexto militar, designa o acampamento; a forma escolhida é corrente e precisa em português.
- source_word: πεδίον / πεδινῆς
  choice: planície
  rationale: Mantém a referência a uma área baixa e relativamente plana, em contraste explícito com a região montanhosa.
- source_word: ἀπῆραν
  choice: subiram
  rationale: O verbo é intransitivo no texto e, no contexto, descreve o deslocamento ascendente da planície para a região montanhosa.
- source_word: ἐκ μέσου τῆς πεδινῆς
  choice: do meio da planície
  rationale: Reproduz com clareza a indicação espacial de saída do interior da região plana.
- source_word: ὀρεινήν
  choice: região montanhosa
  rationale: Indica uma zona de montes ou montanhas e mantém o contraste topográfico com a planície.
- source_word: παρεγένοντο
  choice: chegaram
  rationale: Marca de maneira natural a chegada ao local mencionado.
- source_word: πηγάς
  choice: fontes
  rationale: Refere-se a nascentes ou fontes naturais de água; «fontes» é uma equivalência clara e tradicional neste contexto geográfico.
- source_word: ὑποκάτω
  choice: abaixo
  rationale: Conserva a relação geográfica de posição inferior em relação a Betúlia.
- source_word: Βετυλουά
  choice: Betúlia
  rationale: Emprega a forma portuguesa estabelecida do topônimo.
