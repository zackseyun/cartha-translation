  text: And if you hope in your heart that they will not be taken[a], do not let your face fall. I have spoken[b], and none of my words will fail.
translation:
  language: pt
  text: E se, em seu coração, você espera que eles não sejam capturados[a], não fique abatido[b]. Eu falei, e nenhuma das minhas palavras deixará de se cumprir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serão tomados”. O passivo grego pode ter aqui o sentido militar de serem capturados.'
