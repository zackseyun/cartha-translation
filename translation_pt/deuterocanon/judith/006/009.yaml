  - marker: b
    text: 'Literalmente: “não deixe seu rosto cair”, expressão que indica ficar desanimado ou abatido.'
    reason: idiom_explanation
lexical_decisions:
- source_word: εἶπερ
  choice: E, se
  rationale: Conserva a ligação com o discurso anterior e a força condicional levemente enfática, sem tornar a formulação pesada.
- source_word: ἐλπίζεις τῇ καρδίᾳ σου
  choice: você espera no seu coração
  rationale: Mantém tanto o sentido presente de esperança ou expectativa quanto a linguagem antropológica do grego, em português natural.
- source_word: οὐ λημφθήσονται
  choice: eles não serão capturados
  rationale: O futuro passivo de λαμβάνω admite aqui sentido militar; “serão capturados” explicita esse sentido contextual e preserva a voz passiva.
- source_word: μὴ συμπεσέτω σου τὸ πρόσωπον
  choice: não fique abatido
  rationale: Traduz de modo natural o idiomatismo grego de o rosto cair, que expressa desânimo visível; a imagem literal é preservada em nota.
- source_word: ἐλάλησα
  choice: Eu falei
  rationale: Representa diretamente o aoristo e mantém o tom solene e categórico da declaração.
- source_word: οὐδὲν διαπεσεῖται τῶν ῥημάτων μου
  choice: nenhuma das minhas palavras deixará de se cumprir
  rationale: Comunica que nenhuma declaração falhará ou ficará sem realização, com formulação clara e digna em português.
theological_decisions:
- issue: Expressão idiomática de desânimo
  choice: não fique abatido
  alternative: não deixe seu rosto cair
  rationale: A tradução corrente comunica com clareza o sentido emocional do idiomatismo sem eliminar a metáfora original, registrada na nota.
- issue: Cumprimento das palavras pronunciadas
  choice: nenhuma das minhas palavras deixará de se cumprir
  alternative: nenhuma das minhas palavras falhará
  rationale: A formulação expressa o sentido de διαπίπτω no contexto — não falhar nem deixar de acontecer — sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento por “você” evita arcaísmo; o idiomatismo é vertido naturalmente e documentado em nota.
