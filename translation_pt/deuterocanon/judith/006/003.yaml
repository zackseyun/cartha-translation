base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/003.yaml
  text: But we[a], his slaves, will strike them down as one man, and they will not withstand the might of our horses.
translation:
  language: pt
  text: Mas nós, escravos dele, os abateremos como a um só homem[a], e eles não resistirão ao poder dos nossos cavalos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como se fossem um só homem”. A expressão grega pode enfatizar a ação conjunta contra eles ou a facilidade com que serão vencidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: escravos
  rationale: Preserva a ideia de sujeição e pertencimento total expressa pelo termo grego no contexto de lealdade militar, sem suavizá-la para “servos”.
- source_word: πατάξομεν
  choice: abateremos
  rationale: Comunica de modo natural e vigoroso a ação violenta em contexto militar, indo além de um simples golpe sem recorrer a linguagem arcaica.
- source_word: ὡς ἄνθρωπον ἕνα
  choice: como a um só homem
  rationale: Mantém de perto a expressão grega e sua ambiguidade, que pode sugerir ação unificada ou a facilidade de vencer muitos como se fossem apenas um.
- source_word: ὑποστήσονται
  choice: resistirão
  rationale: Expressa naturalmente a ideia de manter-se firme diante de uma força adversária.
- source_word: κράτος
  choice: poder
  rationale: Representa a força manifesta e avassaladora dos cavalos no combate.
- source_word: ἵππων
  choice: cavalos
  rationale: Traduz o substantivo grego de modo direto, sem substituí-lo pela ideia militar implícita de cavalaria.
theological_decisions:
- issue: Tradução de δοῦλοι
  choice: escravos
  alternative: servos
  rationale: Neste discurso militar, o termo ressalta sujeição e pertencimento ao senhor; “escravos” preserva essa força, enquanto “servos” poderia atenuá-la.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Escravos dele” evita a possível ambiguidade referencial de “seus escravos”; a expressão idiomática grega é mantida no texto e esclarecida em nota.
