base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/001.yaml
  text: 'And when the uproar of the men around the council had ceased[a], Holofernes, commander-in-chief of the army of Asshur, said to Achior in the presence of all the assembly of foreigners:'
translation:
  language: pt
  text: 'Quando cessou o tumulto dos homens que estavam em torno do conselho, Holofernes, comandante-em-chefe do exército de Assur[a], disse a Aquior diante de toda a assembleia dos estrangeiros:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «da Assíria». O grego traz o nome próprio Assur, que pode ser entendido como o nome pessoal ou étnico «Assur», ou como o nome do reino, «Assíria».'
    reason: Registra a alternativa lexical e geográfica sem eliminar a ambiguidade do texto grego.
lexical_decisions:
- source_word: κατέπαυσεν
  choice: cessou
  rationale: Expressa de modo natural a interrupção completa do tumulto antes de Holofernes falar, preservando a sequência narrativa introduzida por ὡς.
- source_word: θροῦβος
  choice: tumulto
  rationale: Comunica tanto o ruído quanto a agitação coletiva, com mais força contextual que o termo mais neutro «barulho».
- source_word: συνεδρίας
  choice: conselho
  rationale: Preserva o sentido de uma reunião deliberativa e mantém a distinção em relação a δήμου, traduzido como «assembleia».
- source_word: ἀρχιστράτηγος
  choice: comandante-chefe
  rationale: Reflete o título militar elevado do composto grego com clareza em português atual.
- source_word: δυνάμεως
  choice: exército
  rationale: No contexto militar, δύναμις designa a força armada; «exército» é a formulação mais clara e idiomática.
- source_word: Ἀσσοὺρ
  choice: Assur
  rationale: Translitera em forma corrente em português o nome próprio grego, sem decidir silenciosamente pela interpretação geopolítica «Assíria».
- source_word: ἐναντίον
  choice: diante de
  rationale: Indica que a declaração foi feita publicamente perante toda a assembleia, sem tornar a expressão desnecessariamente longa.
- source_word: δήμου
  choice: assembleia
  rationale: No contexto de um pronunciamento público, representa adequadamente o grupo reunido como corpo coletivo.
- source_word: ἀλλοφύλων
  choice: estrangeiros
  rationale: O termo designa pessoas de outro povo ou nação; aqui não exige a identificação específica com os filisteus.
theological_decisions:
- issue: Interpretação do nome Ἀσσοὺρ
  choice: Assur
  alternative: Assíria
  rationale: A transliteração preserva o nome próprio e a ambiguidade entre uma referência pessoal/étnica e o nome do reino; a alternativa interpretativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas nominais correntes em português («Holofernes», «Aquior», «Assur»). A estrutura mantém a solenidade narrativa sem arcaísmos; «conselho» e «assembleia» distinguem os dois substantivos gregos.
