  yaml_path: translation/deuterocanon/judith/006/004.yaml
  text: For we will burn them up where they are[a], and their borders will be drenched with their blood, and their plains will be filled with their dead. The trace of their feet will not stand before us, but they will utterly perish, says King Nebuchadnezzar, lord of all the earth. For he said[b], ‘The words of his mouth will not prove empty.’
translation:
  language: pt
  text: 'Pois nós os queimaremos onde estão, e as fronteiras deles ficarão embriagadas com o sangue deles[a], e as planícies deles se encherão dos mortos deles. O rastro dos pés deles não resistirá diante de nós[b]; pelo contrário, perecerão por completo — diz o rei Nabucodonosor, senhor de toda a terra. Pois ele disse: “As palavras de suas declarações não se tornarão vãs”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, em linguagem mais natural, “ficarão encharcadas com o sangue deles”. O grego diz literalmente que as fronteiras ficarão “embriagadas” com o sangue.
    reason: lexical_alternative
  - marker: b
    text: A imagem pode indicar que nem sequer um vestígio deles permanecerá diante dos atacantes ou que nenhum deles conseguirá resistir.
    reason: ambiguity
lexical_decisions:
- source_word: κατακαύσομεν γὰρ αὐτοῖς ἐν αὐτοῖς
  choice: Pois nós os queimaremos onde estão
  rationale: A construção grega com a repetição de αὐτοῖς é incomum. A tradução conserva o sentido locativo e a força destrutiva de κατακαίω sem reproduzir uma sintaxe obscura em português.
- source_word: τὰ ὅρια αὐτῶν
  choice: as fronteiras deles
  rationale: ὅρια designa limites, fronteiras ou regiões fronteiriças; “fronteiras” mantém a imagem geográfica concreta da ameaça militar.
- source_word: μεθυσθήσεται ἐν τῷ αἵματι αὐτῶν
  choice: ficarão embriagadas com o seu sangue
  rationale: A tradução mantém a metáfora vívida de μεθύσκω, em vez de substituí-la silenciosamente por “encharcadas”. A concordância no plural segue o sujeito português “fronteiras”.
- source_word: τὰ πεδία αὐτῶν
  choice: suas planícies
  rationale: πεδία indica terreno plano ou campo aberto; “planícies” preserva o cenário geográfico-militar.
- source_word: πληρωθήσεται νεκρῶν αὐτῶν
  choice: se encherão de seus mortos
  rationale: “Seus mortos” é natural e digno em português e pode referir-se tanto aos mortos como aos cadáveres, conforme o alcance de νεκροί.
- source_word: οὐκ ἀντιστήσεται τὸ ἴχνος τῶν ποδῶν αὐτῶν κατὰ πρόσωπον ἡμῶν
  choice: O rastro dos pés deles não resistirá diante de nós
  rationale: Mantém a imagem incomum de ἴχνος e o verbo militar ἀνθίστημι, sem resolver por paráfrase se a ideia principal é não restar ninguém ou ninguém conseguir resistir.
- source_word: ἀλλʼ ἀπωλείᾳ ἀπολοῦνται
  choice: pelo contrário, perecerão por completo
  rationale: A combinação enfática de substantivo e verbo cognatos é expressa de modo idiomático por “por completo”.
- source_word: κύριος πάσης τῆς γῆς
  choice: senhor de toda a terra
  rationale: “Senhor” traduz κύριος, enquanto a inicial minúscula sinaliza que aqui se trata da pretensão imperial atribuída a um rei humano, não de um título divino.
- source_word: οὐ ματαιωθήσεται τὰ ῥήματα τῶν λόγων αὐτοῦ
  choice: As palavras de suas declarações não ficarão sem efeito
  rationale: A formulação preserva, de maneira inteligível, a expressão pleonástica ῥήματα τῶν λόγων e traduz ματαιόω como tornar vão ou ineficaz, sem limitar o sentido a simples falsidade.
theological_decisions:
- issue: O título κύριος aplicado a Nabucodonosor
  choice: senhor de toda a terra
  alternative: soberano de toda a terra
  rationale: A tradução direta preserva a reivindicação universal e arrogante do rei. A minúscula evita confundi-la com o título divino sem enfraquecer a linguagem do texto.
- issue: A imagem do rastro que não resistirá
  choice: manter a imagem ambígua no texto
  alternative: explicitar que nenhum deles restará diante de nós
  rationale: O grego combina uma imagem de vestígio com o verbo “resistir”. A redação escolhida conserva a tensão entre extermínio total e incapacidade de oposição, deixando a explicação para a nota.
translation_notes:
  register: Português moderno, solene e acessível, com leitura natural no Brasil e compreensão internacional. Conservam-se as imagens violentas e incomuns do grego quando são teologicamente ou literariamente relevantes; a pontuação destaca a proclamação régia sem transformar a pretensão de Nabucodonosor em afirmação do narrador.
