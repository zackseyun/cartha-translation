base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/005.yaml
  text: But you[a], Achior, hireling of Ammon, who spoke these words in the day of your injustice[b], shall no longer see my face from this day until I take vengeance
translation:
  language: pt
  text: Mas você, Aquior, homem a soldo de Amom[a], que pronunciou estas palavras no dia da sua injustiça[b], não verá mais o meu rosto, desde este dia até que eu me vingue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mercenário”, “assalariado” ou “homem contratado”.
    reason: lexical_alternative
  - marker: b
    text: A expressão “no dia da sua injustiça” também pode ser entendida como “no dia da sua má conduta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθωτὲ
  choice: assalariado
  rationale: Designa alguém que serve em troca de pagamento. “Assalariado” conserva o sentido concreto e o tom depreciativo da interpelação, sem impor o sentido especificamente militar de “mercenário”.
- source_word: τοῦ Ἀμμών
  choice: de Amom
  rationale: Mantém a forma genitiva de origem ou vínculo presente no grego, em vez de convertê-la no adjetivo “amonita”.
- source_word: ἐλάλησας τοὺς λόγους τούτους
  choice: pronunciou estas palavras
  rationale: Reproduz a referência explícita ao discurso anterior de Aquior e soa natural em uma acusação solene.
- source_word: ἐν ἡμέρᾳ ἀδικίας σου
  choice: no dia da sua injustiça
  rationale: Preserva a formulação incomum e a amplitude de ἀδικία, que pode indicar injustiça, culpa ou má conduta, sem decidir entre esses sentidos.
- source_word: οὐκ ὄψῃ ἔτι τὸ πρόσωπόν μου
  choice: não verá mais o meu rosto
  rationale: Conserva o idioma do texto-fonte, inteligível em português como exclusão da presença pessoal do falante.
- source_word: ἀπὸ τῆς ἡμέρας ταύτης
  choice: desde este dia
  rationale: Tradução direta da expressão temporal, mantendo seu tom formal.
- source_word: ἕως οὗ ἐκδικήσω
  choice: até que eu me vingue
  rationale: Expressa a ação punitiva indicada por ἐκδικέω sem acrescentar um objeto que não aparece no trecho grego preservado.
theological_decisions:
- issue: Sentido de ἀδικία em uma acusação hostil
  choice: injustiça
  alternative: má conduta; perversidade
  rationale: “Injustiça” permanece lexicalmente próxima e deixa em aberto se a acusação aponta para culpa moral, ofensa ou deslealdade.
- issue: Objeto não expresso de ἐκδικήσω
  choice: até que eu me vingue
  alternative: até que eu execute a vingança; até que eu castigue
  rationale: O grego termina com o verbo sem objeto expresso. A tradução mantém essa incompletude sem especificar antecipadamente contra quem ou pelo quê se dará a vingança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem da interpelação e as expressões “ver o meu rosto” e “no dia da sua injustiça” foram preservadas por refletirem de perto a forma e a ambiguidade do grego.
