  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσόντες
  choice: se prostrou
  rationale: O particípio aoristo de πίπτω descreve literalmente o ato de cair, mas, neste contexto de culto, indica que o povo se lançou por terra em reverência. “Se prostrou” comunica com naturalidade a ação física e sua função contextual.
- source_word: ὁ λαός
  choice: o povo
  rationale: Equivalente corrente de λαός. Embora o referente seja coletivo, o substantivo permanece singular em português, em concordância com o grego.
- source_word: προσεκύνησαν
  choice: adorou
  rationale: Com Deus como destinatário, προσκυνέω expressa culto religioso. “Adorou” é claro, natural e adequado ao contexto.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: A construção portuguesa idiomática dispensa artigo antes de “Deus” neste contexto e conserva o destinatário explícito da adoração.
- source_word: ἐβόησαν
  choice: clamaram
  rationale: O verbo indica um brado forte e urgente. “Clamaram” preserva tanto a intensidade quanto o registro solene da cena.
- source_word: λέγοντες
  choice: dizendo
  rationale: O particípio presente introduz o conteúdo do clamor, que continua no versículo seguinte. “Dizendo” mantém essa ligação aberta.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e acessível, com concordância pelo sentido após o sujeito coletivo: “o povo se prostrou e adorou”; em seguida, o plural “clamaram” torna explícita a participação dos integrantes do povo, refletindo a passagem do singular ὁ λαός aos verbos gregos no plural. O ponto e vírgula evita uma sequência excessiva de conjunções e preserva o fluxo para a fala do próximo versículo.'
