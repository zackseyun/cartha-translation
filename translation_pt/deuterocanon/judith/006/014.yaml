  text: Then the sons of Israel came down from their city and confronted him[a]; and after untying him, they brought him to Bethyloua and brought him before the rulers of their city[c][b],
translation:
  language: pt
  text: Então os filhos de Israel desceram da cidade, aproximaram-se dele[a] e, depois de desamarrá-lo, levaram-no para Betúlia e o apresentaram às autoridades da cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “puseram-se junto dele”. O verbo grego pode indicar que chegaram até ele ou se colocaram ao seu lado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβάντες
  choice: desceram
  rationale: Preserva de modo natural o movimento descendente expresso pelo particípio aoristo, coordenando-o com os demais acontecimentos em português.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: os filhos de Israel
  rationale: Mantém a designação bíblica tradicional e a forma familiar masculina explicitamente presente no grego, sem substituí-la silenciosamente por uma expressão mais geral.
- source_word: ἐπέστησαν αὐτῷ
  choice: aproximaram-se dele[a]
  rationale: No contexto, o verbo indica que chegaram até Aquior ou se puseram junto dele. Esta opção preserva o movimento sem introduzir a hostilidade sugerida por 'confrontaram'.
- source_word: λύσαντες αὐτόν
  choice: depois de desamarrá-lo
  rationale: Explicita naturalmente a ação concreta de soltar as amarras de Aquior.
- source_word: ἀπήγαγον εἰς τὴν Βετυλουά
  choice: levaram-no para Betulua
  rationale: Expressa o deslocamento até o destino indicado por εἰς; 'levaram-no' é idiomático em português nessa perspectiva narrativa.
- source_word: κατέστησαν αὐτὸν ἐπὶ τοὺς ἄρχοντας
  choice: o apresentaram às autoridades
  rationale: O contexto exige conduzi-lo à presença dos dirigentes, não nomeá-lo para um cargo ou colocá-lo sobre eles.
- source_word: ἄρχοντας
  choice: autoridades
  rationale: Designa de forma clara e não excessivamente específica os responsáveis pelo governo da cidade.
