  text: and he will not perish until you are destroyed with them[a].
translation:
  language: pt
  text: E ele não perecerá até que você seja exterminado com eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele não morrerá até que você seja completamente destruído com eles”.'
    reason: Alternativa lexical para ἀπολῇ (“morrerá”) e explicitação da força intensiva de ἐξολεθρευθῇς (“completamente destruído”).
lexical_decisions:
- source_word: καὶ
  choice: e
  rationale: Mantém a ligação coordenativa simples do grego, sem introduzir contraste.
- source_word: ἀπολῇ
  choice: morrerá
  rationale: O subjuntivo aoristo médio, com sentido intransitivo, indica perecer ou morrer; “morrerá” é natural em português e evita confusão com o verbo mais intenso da oração seguinte.
- source_word: ἕως οὗ
  choice: até que
  rationale: Reproduz de modo natural a conjunção temporal grega.
- source_word: ἐξολεθρευθῇς
  choice: seja exterminado
  rationale: O verbo intensivo ἐξολεθρεύω denota destruição completa ou extermínio; “seja exterminado” preserva essa força e a voz passiva.
- source_word: μετʼ αὐτῶν
  choice: com eles
  rationale: Tradução direta e natural da expressão de associação.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “você” traduz o singular de segunda pessoa de modo corrente; “ele” preserva o sujeito masculino singular implícito no verbo grego.
