review_pass:
  verdict: revise
  source_fidelity: A tradução segue de perto a oração grega, preservando os três imperativos, «arrogância», «humilhação», «nosso povo», a imagem de «rosto» e o particípio perfeito passivo referente aos que foram santificados para Deus. Contudo, «tem misericórdia da humilhação» não corresponde à regência portuguesa normal da expressão nem à relação direta de ἐλέησον com τὴν ταπείνωσιν.
  naturalness: O registro é moderno, solene e claro. A correção de regência torna a súplica idiomática sem perder a concisão nem o paralelismo.
  terminology: «Senhor», «Deus do céu», «arrogância», «humilhação», «povo» e «santificados» são escolhas adequadas. A nota preserva alternativas legítimas para τῶν ἡγιασμένων σοι sem resolver indevidamente a nuance.
  issues:
  - severity: medium
    issue: Regência em «tem misericórdia da humilhação do nosso povo».
    rationale: Em português, «ter misericórdia de» rege «da humilhação». A forma do rascunho soa não idiomática e contradiz a própria decisão lexical registrada («tem misericórdia de»).
  revised_text: Senhor, Deus do céu, olha para a arrogância deles, tem misericórdia da humilhação do nosso povo e volta o teu olhar para o rosto dos que foram santificados para ti[a] neste dia.
  revised_footnotes:
  - marker: a
    text: Ou “dos que foram consagrados a ti” ou “dos teus santos”. O grego diz literalmente “dos que foram santificados para ti”.
    reason: lexical_alternative
  revision_rationale: 'Corrigida exclusivamente a regência de «ter misericórdia de»: «da humilhação» resulta da contração de «de + a» e expressa adequadamente o objeto direto semântico de ἐλέησον. O restante foi mantido, inclusive a nota e sua âncora.'
