base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/019.yaml
  text: Lord[a], God of heaven, look upon their arrogance, and have mercy on the humiliation of our people, and look upon the face of those sanctified to you on this day.
translation:
  language: pt
  text: Senhor, Deus do céu, olha para a arrogância deles, tem misericórdia da humilhação do nosso povo e volta o teu olhar para o rosto dos que foram santificados para ti[a] neste dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos que foram consagrados a ti” ou “dos teus santos”. O grego diz literalmente “dos que foram santificados para ti”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Senhor
  rationale: Vocativo de κύριος dirigido a Deus; “Senhor” é a forma bíblica natural e consagrada em português.
- source_word: ὁ θεὸς τοῦ οὐρανοῦ
  choice: Deus do céu
  rationale: Preserva o título divino e a construção genitiva em português corrente.
- source_word: κάτιδε
  choice: olha para
  rationale: O imperativo, em contexto de oração, pede que Deus atente para a situação; a expressão mantém o tom de súplica sem arcaísmo.
- source_word: τὰς ὑπερηφανίας αὐτῶν
  choice: a arrogância deles
  rationale: O plural grego pode indicar manifestações de soberba; o singular coletivo “arrogância” é natural em português e conserva o sentido moral.
- source_word: ἐλέησον
  choice: tem misericórdia de
  rationale: Equivalente tradicional e claro de ἐλεέω em linguagem de oração.
- source_word: τὴν ταπείνωσιν
  choice: a humilhação
  rationale: Expressa o estado de rebaixamento e vergonha sofrido pelo povo, sem reduzir o termo apenas a aflição.
- source_word: τοῦ γένους ἡμῶν
  choice: do nosso povo
  rationale: Neste contexto, γένος designa a coletividade de Israel; “povo” evita as conotações modernas potencialmente enganosas de “raça”.
- source_word: ἐπίβλεψον
  choice: volta o teu olhar para
  rationale: Comunica o pedido para que Deus dirija sua atenção aos mencionados, preservando o paralelismo sem uma repetição pesada em português.
- source_word: τὸ πρόσωπον
  choice: o rosto
  rationale: Mantém a imagem concreta do grego, em vez de dissolvê-la em “presença” ou “condição”.
- source_word: τῶν ἡγιασμένων σοι
  choice: dos que foram santificados para ti
  rationale: Preserva o particípio perfeito passivo, a relação com santidade e o vínculo indicado pelo dativo σοι, sem restringir o sentido à consagração cultual.
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: neste dia
  rationale: Forma temporal natural e solene que conserva a força dêitica do original.
theological_decisions:
- issue: Sentido de τῶν ἡγιασμένων σοι
  choice: dos que foram santificados para ti
  alternative: dos que foram consagrados a ti; dos teus santos
  rationale: O particípio de ἁγιάζω pode indicar pessoas santificadas ou separadas para Deus. A formulação escolhida mantém a voz passiva e a tensão entre santificação e consagração, sem introduzir um sentido especificamente cultual nem transformar o grupo numa classe fixa chamada “os santos”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A cadência de oração foi preservada; “volta o teu olhar” evita repetição estilisticamente rígida, enquanto mantém o paralelismo dos dois imperativos gregos de percepção.
