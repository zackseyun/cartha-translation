  text: and my slaves will bring you back to the hill country and place you in one of the cities of the mountain passes,[a]
translation:
  language: pt
  text: e os meus escravos o levarão de volta à região montanhosa e o colocarão em uma das cidades das passagens da montanha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em uma das cidades das subidas”. O grego diz literalmente “subidas”, provavelmente referindo-se aos acessos de subida ou às passagens que levavam à região montanhosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνταποστήσουσίν σε
  choice: o levarão de volta
  rationale: Expressa o movimento físico de retorno de Aquior à região montanhosa e preserva a força direcional do verbo composto.
- source_word: οἱ δοῦλοί μου
  choice: os meus escravos
  rationale: Traduz diretamente δοῦλοι e mantém a condição de forte subordinação indicada pelo termo no contexto de comando militar.
- source_word: εἰς τὴν ὀρεινήν
  choice: à região montanhosa
  rationale: ὀρεινή designa uma região de montanhas ou colinas; esta formulação é clara e geograficamente precisa em português amplo.
- source_word: θήσουσίν σε
  choice: o deixarão
  rationale: Neste contexto, τίθημι indica pôr ou deixar alguém em determinado lugar. “Deixarão” soa natural para a ação de conduzir Aquior até lá e entregá-lo ao local.
- source_word: ἐν μιᾷ τῶν πόλεων
  choice: em uma das cidades
  rationale: Mantém o sentido normal de πόλις e a estrutura partitiva do grego.
- source_word: τῶν ἀναβάσεων
  choice: das passagens da montanha
  rationale: ἀνάβασις significa literalmente “subida”, mas em contexto topográfico pode designar acessos ascendentes ou passagens para a região montanhosa. A tradução comunica essa função sem apagar a leitura literal, registrada em nota.
theological_decisions: []
