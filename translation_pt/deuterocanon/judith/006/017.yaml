base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/017.yaml
  text: And in answer he reported to them the words of Holofernes’ council[a], and all the words that he had spoken in the midst of the rulers of the sons of Asshur[b], and whatever boastful things Holofernes had spoken against the house of Israel.
translation:
  language: pt
  text: E, em resposta, relatou-lhes as palavras da assembleia de Holofernes, todas as palavras que havia dito no meio dos chefes dos filhos de Assur[a] e tudo o que Holofernes havia dito com arrogância[b] contra a casa de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos assírios”. Em grego, literalmente, “dos filhos de Assur”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “havia se vangloriado”. O verbo grego denota fala orgulhosa ou jactanciosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: em resposta
  rationale: Preserva a força responsiva do particípio e funciona naturalmente como introdução ao relato.
- source_word: ἀπήγγειλεν
  choice: relatou-lhes
  rationale: Expressa a transmissão de um relato aos ouvintes, com o pronome correspondente a αὐτοῖς.
- source_word: τὰ ῥήματα τῆς συνεδρείας Ὀλοφέρνου
  choice: as palavras da assembleia de Holofernes
  rationale: Mantém a referência ao conteúdo falado e entende συνεδρεία como a reunião deliberativa presidida ou associada a Holofernes; “assembleia” evita que “conselho” seja entendido como recomendação.
- source_word: ἐν μέσῳ τῶν ἀρχόντων
  choice: no meio dos chefes
  rationale: Reproduz de modo claro a expressão espacial e social do grego, indicando que as palavras foram ditas entre os dirigentes.
- source_word: υἱῶν Ἀσσούρ
  choice: filhos de Assur
  rationale: Conserva o etnônimo estilizado e literalmente representado no grego, sem normalizá-lo silenciosamente como “assírios”.
- source_word: ἐμεγαλορρημόνησεν
  choice: havia dito com arrogância
  rationale: Comunica o sentido de fala orgulhosa e jactanciosa do verbo raro, em português natural, sem perder seu caráter verbal.
- source_word: εἰς τὸν οἶκον Ἰσραήλ
  choice: contra a casa de Israel
  rationale: O contexto hostil favorece o valor direcional de oposição de εἰς; “casa de Israel” preserva a expressão coletiva tradicional.
theological_decisions:
- issue: Designação étnica υἱῶν Ἀσσούρ
  choice: filhos de Assur
  alternative: assírios
  rationale: A forma literal preserva a textura etnogeográfica do grego e evita normalizar uma expressão que pode ser significativa no estilo narrativo.
- issue: Força de εἰς em relação à casa de Israel
  choice: contra a casa de Israel
  alternative: a respeito da casa de Israel
  rationale: A fala arrogante de Holofernes ocorre em contexto de ameaça e oposição; “contra” representa melhor essa direção hostil, embora a preposição isoladamente possa admitir formulação mais neutra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “palavras” foi parcialmente mantida para refletir a ênfase do original, enquanto a última ocorrência foi vertida de modo idiomático. Os marcadores foram posicionados junto às expressões que efetivamente explicam, corrigindo o desalinhamento presente na camada inglesa de consulta.
