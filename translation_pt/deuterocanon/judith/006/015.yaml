translation:
  language: pt
  text: 'que estavam naquele tempo: Ozias, filho de Miqueias[a], da tribo de Simeão; Cabris, filho de Gotoniel; e Carmis, filho de Melquiel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz uma expressão simples, “que estavam naquele tempo”, provavelmente referindo-se aos que exerciam um cargo ou estavam presentes naquela ocasião.
