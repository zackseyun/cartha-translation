lexical_decisions:
- source_word: οἳ ἦσαν ἐν ταῖς ἡμέραις ἐκείναις
  choice: que estavam naquele tempo
  rationale: Mantém o verbo simples ἦσαν e a referência temporal sem acrescentar explicitamente que exerciam um cargo ou apenas viviam ali, preservando a ambiguidade do grego.
- source_word: Ὀζείας
  choice: Ozias
  rationale: Forma portuguesa tradicional e reconhecível, próxima da forma grega do nome.
- source_word: ὁ τοῦ Μειχὰ
  choice: filho de Miqueias
  rationale: O artigo seguido de genitivo funciona aqui como fórmula de filiação; a explicitação é natural e clara em português.
- source_word: ἐκ τῆς φυλῆς Συμεὼν
  choice: da tribo de Simeão
  rationale: Expressa de modo idiomático a procedência indicada por ἐκ e usa a forma portuguesa consagrada de Simeão.
- source_word: Χαβρεὶς
  choice: Cabris
  rationale: Transliteração portuguesa legível do nome grego, com adaptação do χ inicial à forma tradicional com C.
- source_word: ὁ τοῦ Γοθονιὴλ
  choice: filho de Gotoniel
  rationale: Explicita a relação de filiação expressa pela construção grega.
- source_word: Χαρμεὶς
  choice: Carmis
  rationale: Transliteração portuguesa direta e natural do nome próprio grego.
- source_word: ὁ τοῦ Μελχειήλ
  choice: filho de Melquiel
  rationale: Traduz claramente a fórmula de filiação e adapta o nome à ortografia portuguesa.
