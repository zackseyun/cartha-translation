  yaml_path: translation/deuterocanon/judith/006/010.yaml
  text: And Holofernes ordered his slaves[a], who were standing by in his tent[b], to seize Achior and take him back to Bethyloua and hand him over into the hands of the sons of Israel.
translation:
  language: pt
  text: Então Holofernes ordenou aos seus escravos, que estavam junto dele em sua tenda, que agarrassem Aquior, o levassem de volta a Betulua[a] e o entregassem nas mãos dos filhos de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Betúlia”, forma tradicional do nome do lugar em português.
    reason: lexical_alternative
  - marker: b
    text: “Filhos de Israel” traduz literalmente a expressão grega; aqui ela se refere coletivamente ao povo de Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέταξεν
  choice: ordenou
  rationale: Expressa de modo natural e direto a ordem autoritativa indicada pelo aoristo de προστάσσω.
- source_word: τοῖς δούλοις αὐτοῦ
  choice: aos seus escravos
  rationale: Preserva o sentido social concreto de δοῦλος no contexto do pessoal subordinado pertencente à casa de Holofernes, sem suavizá-lo para 'servos'.
- source_word: οἳ ἦσαν παρεστηκότες
  choice: que estavam de pé junto dele
  rationale: Reproduz a ideia de presença próxima e pronta para servir expressa por παρίστημι; 'dele' explicita naturalmente a referência contextual a Holofernes.
- source_word: ἐν τῇ σκηνῇ αὐτοῦ
  choice: em sua tenda
  rationale: No acampamento militar de Judite, σκηνή designa uma tenda literal.
- source_word: συλλαβεῖν
  choice: que agarrassem
  rationale: Comunica a apreensão física e coercitiva sem introduzir a conotação jurídica específica de 'prender' ou 'deter'.
- source_word: ἀποκαταστῆσαι αὐτὸν
  choice: o levassem de volta
  rationale: No contexto, o verbo indica conduzir Aquior de volta ao lugar mencionado, em português corrente.
- source_word: Βετυλουὰ
  choice: Betulua
  rationale: Translitera a forma grega do topônimo, adaptando-a à ortografia e pronúncia naturais do português; a forma tradicional 'Betúlia' é indicada em nota.
- source_word: παραδοῦναι
  choice: o entregassem
  rationale: Preserva a transferência hostil de uma pessoa ao poder de outros.
- source_word: εἰς χεῖρας
  choice: nas mãos de
  rationale: Mantém a imagem e o idioma bíblico do grego para sujeição ao controle alheio.
- source_word: υἱῶν Ἰσραήλ
  choice: dos filhos de Israel
  rationale: Mantém a expressão filial masculina explícita do grego e sua ressonância bíblica, embora ela designe coletivamente o povo de Israel.
theological_decisions:
- issue: Sentido social de δοῦλοι
  choice: seus escravos
  alternative: seus servos
  rationale: O contexto narrativo apresenta pessoal doméstico subordinado de Holofernes; 'escravos' torna visível a condição social indicada pelo termo grego, enquanto 'servos' poderia suavizá-la.
- issue: Expressão de gênero em υἱῶν Ἰσραήλ
  choice: filhos de Israel
  alternative: israelitas
  rationale: A tradução conserva a formulação masculina e filial do original sem negar seu referente coletivo; uma nota esclarece que a expressão se refere ao povo de Israel.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A coordenação da longa ordem foi mantida, mas os infinitivos gregos foram vertidos por subjuntivos dependentes de “ordenou”, construção natural em português. Os marcadores [a] e [b] aparecem imediatamente após os elementos que esclarecem.
