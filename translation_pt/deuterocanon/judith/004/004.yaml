translation:
  language: pt
  text: E enviaram a todo o território de Samaria[a], a Coná, Bete-Horom, Belmaim, Jericó, Coba, Aisora e ao vale de Salém[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a toda a região de Samaria”; o termo grego pode designar limite, distrito ou território.
    reason: lexical_alternative
  - marker: b
    text: Ou “à planície de Salém”; o grego αὐλών pode designar um vale, uma garganta ou uma depressão semelhante a uma planície.
    reason: lexical_alternative
  - marker: c
    text: Vários topônimos deste versículo foram preservados por transliteração, pois sua identificação exata é incerta com base apenas na forma grega.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπέστειλαν
  choice: enviaram mensageiros
  rationale: O verbo significa literalmente “enviaram”, sem objeto expresso. Em português, “enviaram mensageiros” torna natural a ação implícita no contexto, sem especificar o conteúdo da mensagem.
- source_word: εἰς πᾶν ὅριον Σαμαρίας
  choice: a todo o território de Samaria
  rationale: ὅριον pode indicar limite, distrito ou território; com πᾶν e em uma lista de destinos, o sentido regional é o mais natural.
- source_word: Κωνὰ
  choice: Coná
  rationale: Transliteração portuguesa próxima da forma grega, com acento para indicar a tonicidade final.
- source_word: Βαιθωρὼν
  choice: Bete-Horom
  rationale: Forma portuguesa bíblica legível, próxima do nome composto representado pelo grego.
- source_word: Βαιλμὰιν
  choice: Belmaim
  rationale: Transliteração conservadora, pois a identificação exata do lugar é incerta.
- source_word: Ἰερειχὼ
  choice: Jericó
  rationale: Forma portuguesa tradicional e amplamente reconhecida do topônimo.
- source_word: Χωβὰ
  choice: Coba
  rationale: Transliteração natural em português do qui grego, sem identificação geográfica especulativa.
- source_word: Αἰσωρὰ
  choice: Aisora
  rationale: Transliteração próxima da forma grega, preservada porque a identificação do lugar é incerta.
- source_word: τὸν αὐλῶνα Σαλήμ
  choice: ao vale de Salém
  rationale: αὐλών pode designar vale, garganta ou depressão semelhante a uma planície; “vale” é claro e natural, mantendo-se a alternativa em nota.
