base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/015.yaml
  text: And Joakim the high priest[a], and all who stood before the Lord—the priests and those ministering to the Lord, with sackcloth girded around their waists—were offering the regular whole burnt offering, and the prayers, and the freewill gifts of the people[b],
translation:
  language: pt
  text: Joaquim, o sumo sacerdote, e todos os que estavam diante do Senhor — os sacerdotes e os que ministravam ao Senhor —, com panos de saco cingidos à cintura, ofereciam o holocausto contínuo[a], os votos[b] e as ofertas voluntárias do povo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o holocausto regular”. O termo grego indica algo realizado de modo contínuo ou habitual.
    reason: lexical_alternative
  - marker: b
    text: Ou “as orações”. O termo grego pode significar tanto orações quanto votos; neste contexto sacrificial, “votos” parece mais provável.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰωακεὶμ
  choice: Joaquim
  rationale: Usa a forma portuguesa tradicional e reconhecível do nome grego, sem alterar sua identidade.
- source_word: ὁ ἱερεὺς ὁ μέγας
  choice: o sumo sacerdote
  rationale: É a designação portuguesa corrente e precisa para esse ofício religioso.
- source_word: οἱ παρεστηκότες ἐνώπιον Κυρίου
  choice: os que estavam diante do Senhor
  rationale: Conserva tanto a presença quanto a ideia de comparecimento ou serviço cultual, em linguagem natural.
- source_word: οἱ λειτουργοῦντες Κυρίῳ
  choice: os que ministravam ao Senhor
  rationale: Mantém a nuance de serviço sagrado própria de λειτουργέω no contexto do templo.
- source_word: σάκκους περιεζωσμένοι τὰς ὀσφύας αὐτῶν
  choice: com panos de saco cingidos à cintura
  rationale: Preserva a imagem concreta da veste penitencial, com formulação digna e compreensível.
- source_word: προσέφερον
  choice: ofereciam
  rationale: O imperfeito grego apresenta a ação como em andamento ou reiterada.
- source_word: τὴν ὁλοκαύτωσιν τοῦ ἐνδελεχισμοῦ
  choice: o holocausto contínuo
  rationale: ὁλοκαύτωσις designa uma oferta inteiramente queimada, e ἐνδελεχισμός indica sua regularidade ou continuidade.
- source_word: τὰς εὐχὰς
  choice: os votos
  rationale: No encadeamento com sacrifício e dádivas, o sentido cultual de votos ou ofertas prometidas é provável; a possível leitura como orações é preservada em nota.
- source_word: τὰ ἑκούσια δόματα
  choice: as ofertas voluntárias
  rationale: Expressa claramente que eram dádivas apresentadas espontaneamente.
theological_decisions:
- issue: Tradução de Κυρίου em contexto cultual judaico de fonte grega
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte traz κύριος, não o Tetragrama; “Senhor” preserva o título divino sem introduzir uma forma hebraica ausente do texto grego.
- issue: Sentido de εὐχάς neste contexto sacrificial
  choice: votos
  alternative: orações
  rationale: A coordenação com o holocausto e as ofertas voluntárias favorece o sentido cultual de votos, mas o substantivo grego também pode significar orações; a nota mantém essa ambiguidade legítima.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A redação conserva o tom cultual e solene sem recorrer a construções excessivamente arcaicas. Os travessões esclarecem que sacerdotes e ministros compõem o grupo mencionado.
