base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/014.yaml
  text: And the Lord heard their voice and looked upon their affliction[b][a], and the people were fasting for many days throughout all Judea and Jerusalem before the holy things of the Lord Almighty.
translation:
  language: pt
  text: E o Senhor ouviu a voz deles[a] e atentou para a aflição deles. O povo permanecia em jejum durante muitos dias por toda a Judeia e em Jerusalém, diante das coisas santas[b] do Senhor Todo-Poderoso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o clamor deles». O grego diz literalmente «a voz deles», expressão que, neste contexto de oração e aflição, pode ter o sentido de um pedido de socorro.
    reason: lexical_alternative
  - marker: b
    text: Ou «do santuário» ou «dos lugares santos». O grego traz uma forma plural, literalmente «das coisas santas», que pode se referir aos objetos sagrados ou aos recintos santos ligados ao Senhor Todo-Poderoso.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσήκουσεν
  choice: ouviu
  rationale: Traduz diretamente o verbo grego e, no contexto de oração, permite a nuance de acolhimento favorável sem explicitar uma intervenção que o texto não declara.
- source_word: τῆς φωνῆς αὐτῶν
  choice: a voz deles
  rationale: Preserva o sentido literal de φωνή; no contexto, pode designar o clamor ou pedido do povo, alternativa indicada em nota.
- source_word: ἐπεῖδεν
  choice: atentou para
  rationale: Expressa percepção acompanhada de consideração, mais adequada ao composto grego do que o simples verbo «viu».
- source_word: τὴν θλίψιν αὐτῶν
  choice: a aflição deles
  rationale: Mantém o peso de θλῖψις como sofrimento, angústia ou opressão, em linguagem bíblica clara e atual.
- source_word: ἦν ὁ λαὸς νηστεύων
  choice: o povo permanecia em jejum
  rationale: A construção perifrástica grega indica ação contínua; esta formulação é natural em português e conserva o aspecto durativo.
- source_word: ἡμέρας πλείους
  choice: durante muitos dias
  rationale: Representa de modo idiomático um período prolongado, sem reduzir a expressão a apenas alguns dias.
- source_word: ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: por toda a Judeia e em Jerusalém
  rationale: Comunica a extensão geográfica do jejum e torna explícita, de modo natural, a relação distinta com a região e a cidade.
- source_word: κατὰ πρόσωπον
  choice: diante de
  rationale: Equivalente corrente do idioma grego com o sentido de «perante» ou «na presença de», apropriado ao contexto cultual.
- source_word: τῶν ἁγίων
  choice: das coisas santas
  rationale: Preserva o plural substantivado do grego e evita defini-lo silenciosamente como um único santuário ou lugar santo.
- source_word: Κυρίου Παντοκράτορος
  choice: do Senhor Todo-Poderoso
  rationale: Reproduz κύριος como título divino e παντοκράτωρ pelo título português consagrado, em formulação clara e digna.
theological_decisions:
- issue: Tradução de κύριος como título divino
  choice: Senhor
  alternative: Soberano
  rationale: «Senhor» é o equivalente tradicional e semanticamente adequado neste contexto de referência ao Deus de Israel; «Soberano» alteraria o título sem necessidade.
- issue: Referente cultual de τῶν ἁγίων
  choice: coisas santas
  alternative: santuário / lugares santos
  rationale: O grego emprega um plural substantivado cuja referência exata permanece aberta. A tradução conserva essa ambiguidade em vez de a resolver como um edifício ou recinto específico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Conserva-se a cadência narrativa, o aspecto contínuo do jejum e a ambiguidade cultual do plural grego.
