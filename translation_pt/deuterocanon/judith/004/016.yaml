lexical_decisions:
- source_word: σποδός
  choice: cinza
  rationale: O singular coletivo é natural em português e designa a cinza posta sobre a cabeça em sinal de luto e súplica.
- source_word: κιδάρεις
  choice: turbantes
  rationale: Equivalente direto e compreensível para as coberturas de cabeça mencionadas no texto.
- source_word: ἐβόων
  choice: clamavam
  rationale: Expressa um pedido intenso dirigido a Deus, preservando o valor religioso e emocional do verbo.
- source_word: ἐκ πάσης δυνάμεως
  choice: com todas as suas forças
  rationale: Reproduz de modo idiomático a intensidade da expressão grega.
- source_word: εἰς ἀγαθὸν ἐπισκέψασθαι
  choice: olhasse com bondade para
  rationale: Preserva o sentido de voltar a atenção de modo favorável e benéfico, sem restringi-lo a uma intervenção específica.
- source_word: πᾶν οἶκον Ἰσραήλ
  choice: toda a casa de Israel
  rationale: Mantém a expressão coletiva tradicional e a abrangência indicada por πᾶν.
theological_decisions:
