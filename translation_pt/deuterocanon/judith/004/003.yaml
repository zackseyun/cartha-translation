  text: for they had only recently come up from the captivity[a], and all the people of Judea had only recently been gathered together[c][b], and the vessels and the altar and the house had been consecrated from the defilement.
translation:
  language: pt
  text: pois haviam subido há pouco do cativeiro[a], e todo o povo da Judeia tinha sido reunido havia pouco; e os utensílios, o altar e a Casa[b] haviam sido consagrados depois de terem sido profanados.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do exílio”.
    reason: lexical_alternative
  - marker: b
    text: “A Casa” refere-se ao templo.
    reason: cultural_note
  - marker: c
    text: Ou, mais literalmente, “haviam sido consagrados da profanação”. O grego vincula a consagração à profanação anterior e à restauração à santidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσφάτως
  choice: havia pouco tempo
  rationale: Expressa com naturalidade a proximidade temporal enfatizada pelo advérbio grego.
- source_word: ἀναβεβηκότες
  choice: tinham subido
  rationale: Preserva a imagem espacial de subir para a Judeia, sem substituí-la pela interpretação mais ampla “tinham voltado”.
- source_word: αἰχμαλωσίας
  choice: cativeiro
  rationale: Mantém a ideia de uma condição histórica específica de sujeição e deslocamento; “exílio” continua sendo alternativa contextual válida.
- source_word: νεωστὶ
  choice: fazia pouco
  rationale: Reproduz a segunda ênfase grega na recência, evitando uma repetição pesada em português.
- source_word: συνελέλεκτο
  choice: tinha sido reunido
  rationale: Conserva o sentido passivo e o aspecto de recomposição do povo como comunidade.
- source_word: σκεύη
  choice: utensílios
  rationale: No contexto do templo, designa os objetos empregados no culto; “utensílios” é atual e conciso.
- source_word: θυσιαστήριον
  choice: altar
  rationale: Equivalente português normal para o altar sacrificial.
- source_word: ὁ οἶκος
  choice: a Casa
  rationale: Preserva a designação reverencial literal “a Casa”; a inicial maiúscula e a nota esclarecem que se trata do templo.
- source_word: βεβηλώσεως
  choice: profanação
  rationale: Expressa o ato ou estado pelo qual aquilo que era santo foi tornado profano, formando contraste claro com a consagração.
- source_word: ἡγιασμένα
  choice: haviam sido consagrados
  rationale: Comunica o estado resultante de uma ação concluída pela qual os objetos e o templo foram novamente destinados ao uso santo.
theological_decisions:
- issue: Relação entre a consagração e a profanação anterior
  choice: haviam sido consagrados após a profanação
  alternative: haviam sido santificados da profanação
  rationale: O grego usa ἐκ, literalmente “de/a partir de”, e apresenta a restauração à santidade em relação à profanação anterior. “Após a profanação” comunica em português natural a sequência sem especificar um rito não mencionado.
- issue: Sentido de ὁ οἶκος no contexto do culto
  choice: a Casa
  alternative: o templo
  rationale: A referência é ao templo, mas a formulação mantém o modo reverencial do texto grego sem impor linguagem doutrinária adicional.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A redação mantém a dupla ênfase temporal do grego, preserva a imagem de “subir” e conserva “a Casa” como designação reverencial do templo. A construção final prioriza naturalidade sem ocultar em nota a relação mais literal marcada por ἐκ.
