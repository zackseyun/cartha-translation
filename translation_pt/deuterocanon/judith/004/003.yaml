  naturalness: O registro é atual e claro. «Pois haviam subido há pouco do cativeiro» é mais direto e fluente do que «havia pouco tempo que tinham subido», especialmente porque o sujeito é retomado do contexto anterior. A manutenção em uma única frase também reflete melhor a estrutura coordenada do grego.
  terminology: «Cativeiro», «altar», «Casa» e «consagrados» são escolhas adequadas. «Utensílios» é possível para σκεύη no contexto cultual; a nota sobre «a Casa» esclarece devidamente a referência ao templo.
