  text: And they fortified the villages among them[a], and they stored up food supplies in preparation for war, because their fields had been newly harvested.
translation:
  language: pt
  text: E fortificaram as aldeias que havia entre eles[a] e armazenaram provisões em preparação para a guerra, porque seus campos haviam sido colhidos recentemente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as aldeias no meio deles”. A expressão grega é espacialmente ambígua e não esclarece com precisão a relação geográfica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτείχισαντο
  choice: fortificaram
  rationale: O verbo médio de τειχίζω indica tornar um lugar defensável ou cercá-lo com muralhas; “fortificaram” é claro e não especifica indevidamente o tipo de construção.
- source_word: τὰς ἐν αὐτοῖς κώμας
  choice: as aldeias que havia entre eles
  rationale: κώμας significa “aldeias”; a expressão espacial comprimida ἐν αὐτοῖς é mantida sem impor uma identificação geográfica mais precisa.
- source_word: παρέθεντο
  choice: armazenaram
  rationale: Em combinação com εἰς ἐπισιτισμόν, expressa a ação deliberada de separar e guardar recursos para uma necessidade futura.
- source_word: ἐπισιτισμὸν
  choice: provisões
  rationale: O substantivo se refere ao abastecimento, especialmente de alimentos; “provisões” comunica isso de modo natural e conciso.
- source_word: εἰς παρασκευὴν πολέμου
  choice: em preparação para a guerra
  rationale: παρασκευή tem aqui o sentido comum de preparação, e πολέμου define a finalidade militar.
- source_word: προσφάτως ἦν τὰ πεδία αὐτῶν τεθερισμένα
  choice: seus campos tinham sido colhidos havia pouco tempo
  rationale: A construção perifrástica com o particípio perfeito passivo indica uma colheita já concluída, enquanto προσφάτως salienta que ela ocorrera recentemente.
