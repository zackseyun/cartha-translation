base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/007.yaml
  text: And Joakim the high priest[a], who was in Jerusalem in those days, wrote to those living in Bethulia and Betomesthaim, which is opposite Esdraelon, facing the plain near Dothaim,
translation:
  language: pt
  text: E Joaquim, o sumo sacerdote[a], que estava em Jerusalém naqueles dias, escreveu aos habitantes de Betúlia e Betomestaim, que fica em frente de Esdrelom, voltada para a planície perto de Dotaim,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «o sacerdote, o grande»; isto é, «o sumo sacerdote».
    reason: Registra a forma literal do grego por trás do equivalente institucional idiomático usado no texto.
lexical_decisions:
- source_word: ἔγραψεν
  choice: escreveu
  rationale: Traduz diretamente o aoristo de γράφω sem acrescentar o objeto implícito «carta».
- source_word: Ἰωακεὶμ
  choice: Joaquim
  rationale: Emprega a forma portuguesa tradicional e reconhecível do nome próprio.
- source_word: ὁ ἱερεὺς ὁ μέγας
  choice: o sumo sacerdote
  rationale: É o equivalente institucional idiomático em português para a expressão grega literalmente formada por «o sacerdote, o grande»; uma nota preserva a forma literal.
- source_word: ὃς ἦν ἐν ταῖς ἡμέραις ἐν Ἰερουσαλήμ
  choice: que estava em Jerusalém naqueles dias
  rationale: Preserva tanto a localização quanto a referência temporal, sem reduzir a expressão a «então».
- source_word: τοῖς κατοικοῦσι
  choice: aos habitantes
  rationale: Expressa com naturalidade o particípio substantivado que designa os residentes.
- source_word: Βαιτουλουὰ
  choice: Betúlia
  rationale: Segue a forma portuguesa bíblica corrente do topônimo.
- source_word: Βαιτομεσθαίμ
  choice: Betomestaim
  rationale: Translitera o topônimo grego em ortografia portuguesa legível.
- source_word: ἀπέναντι
  choice: em frente de
  rationale: Comunica a posição geográfica de oposição ou defronte sem sugerir necessariamente grande distância.
- source_word: Ἐσρηλὼν
  choice: Esdrelom
  rationale: Emprega a forma tradicional portuguesa do topônimo.
- source_word: κατὰ πρόσωπον
  choice: voltada para
  rationale: Representa a orientação espacial da expressão no contexto topográfico.
- source_word: τοῦ πεδίου
  choice: a planície
  rationale: πεδίον designa aqui terreno plano ou uma planície.
- source_word: τοῦ πλησίον Δωθάειμ
  choice: perto de Dotaim
  rationale: Traduz de modo conciso a relação de proximidade expressa por πλησίον com o genitivo.
theological_decisions:
- issue: Sentido institucional de ὁ ἱερεὺς ὁ μέγας
  choice: o sumo sacerdote
  alternative: o grande sacerdote
  rationale: «Sumo sacerdote» é a designação portuguesa natural do ofício e comunica adequadamente o valor institucional da expressão; a alternativa literal é registrada em nota para manter transparente a forma incomum do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas toponímicas tradicionais. A sintaxe mantém a longa descrição geográfica e a vírgula final porque o versículo prossegue na unidade seguinte. O singular «que fica» toma Betomestaim como antecedente imediato, conforme o pronome relativo grego singular.
