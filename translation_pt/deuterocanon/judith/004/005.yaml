- source_word: κορυφὰς
  choice: cumes
  rationale: Designa os pontos mais altos das montanhas; «cumes» é preciso, corrente e adequado ao contexto geográfico-militar.
- source_word: ὀρέων
  choice: montanhas
  rationale: É o sentido comum do substantivo e não há razão contextual para enfraquecê-lo como «colinas».
- source_word: ὑψηλῶν
  choice: altas
  rationale: Traduz diretamente a característica atribuída às montanhas em linguagem natural e atual.
