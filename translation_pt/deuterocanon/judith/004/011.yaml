base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/011.yaml
  text: They themselves and their wives and their little children and their livestock—and every resident alien or hired worker or purchased slave among them—put sackcloth on their waists[a][b][c].
translation:
  language: pt
  text: Eles mesmos, suas esposas, suas crianças pequenas e seus animais de criação — bem como todo estrangeiro residente[a], trabalhador contratado ou escravo comprado[b] que havia entre eles — puseram pano de saco em volta da cintura[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “forasteiro”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “comprado com prata”; isto é, um escravo adquirido por compra.
    reason: lexical_alternative
  - marker: c
    text: Vestir pano de saco era sinal de luto, humilhação ou súplica.
    reason: cultural_note
lexical_decisions:
- source_word: νήπια
  choice: crianças pequenas
  rationale: Designa crianças muito novas, sem restringir necessariamente o sentido a bebês; a expressão é clara e natural em português atual.
- source_word: κτήνη
  choice: animais de criação
  rationale: O termo abrange animais domesticados mantidos como propriedade; evita tanto o sentido estreito de “gado” quanto a possível associação moderna de “animais domésticos” com animais de estimação.
- source_word: πάροικος
  choice: estrangeiro residente
  rationale: Expressa uma pessoa não nativa que vive entre a população local, preservando a dimensão social de residência sem cidadania plena.
- source_word: μισθωτός
  choice: trabalhador contratado
  rationale: Indica alguém que trabalha mediante pagamento e evita formas arcaicas ou depreciativas.
- source_word: ἀργυρώνητος
  choice: escravo comprado
  rationale: O adjetivo significa literalmente “comprado com prata” e, neste contexto doméstico, aponta para uma pessoa escravizada adquirida por compra; a tradução não encobre a condição servil.
- source_word: ἐπέθεντο σάκκους
  choice: puseram pano de saco
  rationale: Reproduz de modo direto o ato de colocar sobre si pano grosseiro usado em luto, humilhação ou súplica.
- source_word: ἐπὶ τὰς ὀσφύας αὐτῶν
  choice: em volta da cintura
  rationale: Comunica naturalmente em português moderno a região dos lombos ou da cintura indicada pelo grego.
theological_decisions:
- issue: Condição servil expressa por ἀργυρώνητος
  choice: escravo comprado
  alternative: servo comprado; pessoa comprada com prata
  rationale: O grego caracteriza a pessoa pela aquisição mediante pagamento. “Escravo” torna explícita a condição de propriedade humana e evita suavizar a realidade social do texto.
- issue: Coordenação das categorias sociais em πάροικος ἢ μισθωτὸς καὶ ἀργυρώνητος
  choice: estrangeiro residente, trabalhador contratado ou escravo comprado
  alternative: estrangeiro residente ou trabalhador contratado e escravo comprado
  rationale: A sequência grega alterna ἢ e καί, mas enumera de modo mais plausível categorias distintas de dependentes ou residentes. A formulação portuguesa apresenta as três categorias sem sugerir que uma mesma pessoa fosse simultaneamente contratada e comprada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção conserva a inclusão enfática de toda a comunidade — famílias, dependentes e até os animais — no gesto coletivo. O travessão organiza a longa enumeração sem alterar seu alcance.
