translation:
  language: pt
  text: Todos os homens de Israel clamaram a Deus com grande fervor[a] e humilhavam as suas almas[b] com grande fervor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com grande intensidade” ou “com grande empenho”. A mesma expressão grega é repetida no fim do versículo para dar ênfase.
    reason: lexical_alternative
  - marker: b
