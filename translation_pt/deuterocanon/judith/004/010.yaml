lexical_decisions:
- source_word: ἀνεβόησαν
  choice: clamaram
  rationale: O verbo expressa um clamor intenso dirigido a Deus; “clamaram” preserva tanto a força quanto o contexto de oração.
- source_word: πᾶς ἀνὴρ Ἰσραήλ
  choice: todos os homens de Israel
  rationale: A expressão grega é distributiva e explicitamente masculina. O plural natural em português também se harmoniza com os verbos no plural do texto grego.
- source_word: πρὸς τὸν θεόν
  choice: a Deus
  rationale: No contexto de oração, a preposição indica o destinatário do clamor, sendo naturalmente traduzida por “a Deus”.
- source_word: ἐν ἐκτενείᾳ μεγάλῃ
  choice: com grande fervor
  rationale: A expressão denota empenho intenso e persistente. “Com grande fervor” é natural em português e pode ser repetido nas duas orações para conservar a ênfase do original.
- source_word: ἐταπείνουσαν
  choice: humilharam
  rationale: O sentido mais direto é tornar humilde ou rebaixar. “Humilharam” evita explicitar práticas penitenciais que o verbo, isoladamente, não especifica.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: suas almas
  rationale: A tradução mantém o substantivo ψυχή e sua forma plural, preservando a linguagem antropológica do texto; uma nota esclarece seu possível valor idiomático.
theological_decisions:
- issue: Expressão masculina em πᾶς ἀνὴρ Ἰσραήλ
  choice: todos os homens de Israel
  alternative: todos os israelitas
  rationale: O grego emprega explicitamente ἀνήρ, “homem”, e não um termo genérico para o povo. A tradução conserva essa especificidade sem inferir quem mais poderia estar incluído no contexto.
- issue: Sentido de τὰς ψυχὰς αὐτῶν
  choice: suas almas
  alternative: a si mesmos
  rationale: A formulação literal conserva ψυχή e sua possível tensão antropológica, enquanto a nota registra que a expressão também pode funcionar idiomaticamente como referência às próprias pessoas.
- issue: Possível contexto penitencial de ἐταπείνουσαν
  choice: humilharam
  alternative: afligiram
  rationale: “Afligiram” poderia sugerir jejum ou mortificação de modo mais explícito; “humilharam” representa diretamente o verbo sem resolver além do texto a natureza do ato.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Conserva-se a repetição enfática do grego e a linguagem de “almas”, explicada em nota para evitar obscuridade.
