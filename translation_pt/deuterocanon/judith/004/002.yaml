- source_word: ἐταράχθησαν
  choice: se angustiaram
  rationale: Expressa forte perturbação e inquietação, distinguindo-a do medo já mencionado.
- source_word: περὶ Ἰερουσαλὴμ καὶ τοῦ ναοῦ
  choice: por Jerusalém e pelo templo
  rationale: περί com o verbo de perturbação indica preocupação a respeito do destino de Jerusalém e do templo.
- source_word: Κυρίου θεοῦ αὐτῶν
  choice: do Senhor, seu Deus
  rationale: Mantém os títulos e a relação pactual expressa no grego, com pontuação natural em português.
