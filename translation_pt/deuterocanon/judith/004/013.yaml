revisions:
- from: E cobriam o altar com pano de saco. Então clamaram juntos e com fervor ao Deus de Israel, para que ele não entregasse suas crianças ao saque, suas mulheres como despojo[a], as cidades de sua herança à destruição e as coisas santas à profanação e à desonra, tornando-as motivo de alegria maldosa para as nações[b].
  to: E cobriam o altar com pano de saco; clamaram em uníssono e com fervor ao Deus de Israel, para que ele não entregasse suas crianças à rapina, suas mulheres como despojo[a], as cidades de sua herança à destruição e as coisas santas à profanação e à desonra, como motivo de triunfo para as nações[b].
  rationale: A revisão conserva o conteúdo, a sequência e a ambiguidade sintática do grego, mas elimina a causalidade e a referência pronominal acrescentadas por “tornando-as”. Também ajusta duas formulações para maior precisão e naturalidade no português contemporâneo.
