base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/013.yaml
  text: And they covered the altar with sackcloth, and they cried out to the God of Israel together with fervor, that he might not give their little children over to plunder, and their women to spoil, and the cities of their inheritance to destruction, and the holy things to defilement and reproach, as something the nations would gloat over.
translation:
  language: pt
  text: E cobriam o altar com pano de saco; clamaram em uníssono e com fervor ao Deus de Israel, para que ele não entregasse suas crianças à rapina, suas mulheres como despojo[a], as cidades de sua herança à destruição e as coisas santas à profanação e à desonra, como motivo de triunfo para as nações[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “suas mulheres para serem tomadas como presa”. O grego emprega aqui linguagem de despojos de guerra.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “motivo de regozijo para as nações”. A expressão grega indica alegria hostil ou triunfo diante da desgraça alheia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ θυσιαστήριον
  choice: o altar
  rationale: Designa o altar de sacrifícios; a forma simples é natural e suficiente no contexto.
- source_word: σάκκῳ περιέβαλλον
  choice: cobriam ... com pano de saco
  rationale: Expressa de modo claro o ato de envolver ou revestir o altar com tecido de luto e penitência.
- source_word: ἐβόησαν ... ὁμοθυμαδὸν ἐκτενῶς
  choice: clamaram juntos e com fervor
  rationale: Preserva tanto a força do clamor quanto a ação unida e intensa indicada pelos advérbios.
- source_word: τοῦ μὴ δοῦναι
  choice: para que ele não entregasse
  rationale: Comunica o conteúdo e a finalidade da súplica, sendo 'entregar' idiomático diante dos destinos hostis enumerados.
- source_word: τὰ νήπια ... εἰς διαρπαγὴν
  choice: suas crianças ao saque
  rationale: νήπια abrange crianças pequenas, e διαρπαγή indica captura ou espoliação violenta; evita restringir o termo apenas a bebês.
- source_word: τὰς γυναῖκας εἰς προνομὴν
  choice: suas mulheres como despojo
  rationale: γυναῖκας é coletivo e não exige 'esposas'; προνομή pertence ao vocabulário de despojos de guerra.
- source_word: τὰς πόλεις τῆς κληρονομίας αὐτῶν
  choice: as cidades de sua herança
  rationale: Mantém a ressonância territorial e pactual de κληρονομία sem explicitação adicional.
- source_word: εἰς ἀφανισμὸν
  choice: à destruição
  rationale: Representa a ideia de ruína ou eliminação e conserva o paralelismo da enumeração.
- source_word: τὰ ἅγια
  choice: as coisas santas
  rationale: O plural neutro é deliberadamente amplo e não deve ser reduzido ao santuário ou a um único objeto.
- source_word: εἰς βεβήλωσιν καὶ ὀνειδισμὸν
  choice: à profanação e à desonra
  rationale: Distingue a violação do que é sagrado da dimensão pública de vergonha e afronta.
- source_word: ἐπίχαρμα τοῖς ἔθνεσιν
  choice: motivo de alegria maldosa para as nações
  rationale: ἐπίχαρμα denota satisfação hostil diante da desgraça alheia; 'alegria maldosa' torna essa nuance explícita sem convertê-la em mera zombaria.
theological_decisions:
- issue: Sentido de κληρονομία no contexto territorial de Israel
  choice: herança
  alternative: patrimônio; posse
  rationale: '''Herança'' conserva a possível ressonância pactual e nacional do termo sem acrescentar uma interpretação doutrinária.'
- issue: Referente de τὰ ἅγια
  choice: as coisas santas
  alternative: o santuário; as coisas sagradas
  rationale: A tradução mantém a amplitude do plural grego e evita identificar sem base o referente exclusivamente com o edifício do santuário.
- issue: Agência divina em τοῦ μὴ δοῦναι
  choice: para que ele não entregasse
  alternative: para não serem entregues
  rationale: O sujeito implícito remete ao Deus de Israel invocado; mantê-lo preserva a tensão do pedido sem explicar por que Deus permitiria ou impediria a calamidade.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com legibilidade brasileira. A coordenação acumulativa do grego foi preservada, mas dividida em duas frases para fluidez. Os marcadores [a] e [b] aparecem junto às expressões a que se referem.
