base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/001.yaml
  text: And the sons of Israel who lived in Judea heard all that Holofernes[a], the commander-in-chief of King Nebuchadnezzar of the Assyrians, had done to the nations[b], and how he had plundered all their sanctuaries and given them over to destruction.
translation:
  language: pt
  text: Os filhos de Israel[a] que moravam na Judeia souberam de tudo o que Holofernes, comandante-em-chefe de Nabucodonosor, rei dos assírios, havia feito às nações e de como tinha saqueado todos os seus santuários[b] e os entregado à destruição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O grego diz literalmente “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “seus templos” ou “suas coisas sagradas”; o termo grego pode abranger lugares sagrados ou objetos sagrados.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: os filhos de Israel
  rationale: Preserva de modo transparente o idioma grego e sua ressonância étnica e pactual; a nota oferece a formulação coletiva mais corrente.
- source_word: οἱ κατοικοῦντες ἐν τῇ Ἰουδαίᾳ
  choice: que moravam na Judeia
  rationale: Expressa em português natural a residência indicada pelo particípio κατοικοῦντες.
- source_word: πάντα ὅσα ἐποίησεν
  choice: tudo o que ... havia feito
  rationale: Mantém a abrangência de πάντα ὅσα e emprega o mais-que-perfeito composto para situar naturalmente a ação anterior ao conhecimento da notícia.
- source_word: ὁ ἀρχιστράτηγος
  choice: comandante-chefe
  rationale: Comunica a posição de principal comandante militar, com mais precisão que simplesmente “general”.
- source_word: τοῖς ἔθνεσιν
  choice: às nações
  rationale: No contexto narrativo, refere-se aos povos estrangeiros subjugados, sem exigir a acepção teológica posterior de “gentios”.
- source_word: ἐσκύλευσεν
  choice: tinha saqueado
  rationale: Verbo claro e vívido para a ação militar de despojar ou pilhar.
- source_word: τὰ ἱερὰ αὐτῶν
  choice: todos os seus santuários
  rationale: “Santuários” preserva a referência cultual provável sem restringir indevidamente o termo a templos ou a objetos sagrados; a amplitude semântica é registrada em nota.
- source_word: ἔδωκεν αὐτὰ εἰς ἀφανισμόν
  choice: os entregado à destruição
  rationale: Conserva tanto a imagem de entregar quanto a ideia de ruína ou eliminação expressa por ἀφανισμός, sem importar linguagem técnica de anátema.
theological_decisions:
- issue: Designação étnico-pactual οἱ υἱοὶ Ἰσραήλ
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A tradução principal retém o idioma masculino plural efetivamente usado no grego e sua ressonância tradicional, sem negar que a expressão possa designar coletivamente os israelitas.
- issue: Amplitude de τὰ ἱερὰ αὐτῶν
  choice: seus santuários
  alternative: suas coisas sagradas; seus templos
  rationale: “Santuários” comunica de modo natural o contexto religioso, mas a nota preserva a possibilidade de o plural neutro abranger lugares ou coisas sagradas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha o longo período narrativo grego sem se tornar artificial. “Nabucodonosor, rei dos assírios” mantém a caracterização interna do livro, sem harmonização histórica.
