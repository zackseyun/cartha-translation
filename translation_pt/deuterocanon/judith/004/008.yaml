  source_fidelity: 'A tradução acompanha bem a estrutura e o sentido do grego: ocupar as rotas de subida, que davam acesso à Judeia, e impedir os que avançavam. Contudo, «Seria fácil» introduz uma modalidade condicional que não está em ἦν («era/fazia-se fácil»). «Os inimigos» explicita um referente que o grego deixa pronominal; «impedi-los» preserva melhor essa formulação, sem prejuízo da clareza contextual. A cláusula final é reconhecidamente difícil; «só podiam avançar dois a dois» comunica de modo natural a leitura contextual adotada.'
  naturalness: «Era fácil impedi-los enquanto subiam» é idiomático e mantém o aspecto de movimento. A reformulação da oração final evita o gerúndio «permitindo», cuja ligação sintática é menos direta, e situa a nota imediatamente após a expressão interpretativa que ela esclarece.
  terminology: «Ocupassem», «subidas da região montanhosa», «Judeia» e «acesso» são adequados ao registro e à topografia do texto. Não há questão teológica terminológica neste versículo.
  issues:
  - severity: medium
    issue: «Seria fácil» traduz ἦν com valor condicional.
    rationale: O imperfeito indicativo ἦν apresenta a facilidade como circunstância factual no relato, não como resultado hipotético. «Era fácil» conserva o valor do original.
  - severity: low
    issue: «os inimigos» explicita o pronome αὐτούς.
    rationale: Embora o contexto identifique os oponentes, o grego usa apenas «eles/os». «Impedi-los» preserva a referência contextual sem inserir um substantivo não expresso.
  - severity: low
    issue: A nota b está ancorada depois do ponto final e a construção «permitindo» é menos direta.
    rationale: A nota diz respeito à leitura de «dois ... lado a lado». Colocá-la junto dessa expressão e formular a consequência explicitamente melhora a legibilidade.
