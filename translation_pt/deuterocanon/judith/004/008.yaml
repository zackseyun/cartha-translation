  yaml_path: translation/deuterocanon/judith/004/008.yaml
  text: telling them to seize the mountain passes[a], because through them was the entrance into Judea; and it was easy to hold them back as they came up[b], since the approach was narrow enough for all the men to go two abreast.
translation:
  language: pt
  text: dizendo-lhes que ocupassem as subidas da região montanhosa[a], pois por elas se entrava na Judeia. Era fácil impedi-los enquanto subiam, visto que o acesso era estreito, de modo que os homens só podiam avançar dois a dois.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “as subidas da região montanhosa”, isto é, as rotas ascendentes ou passagens pela região serrana.
    reason: lexical_alternative
  - marker: b
    text: A frase grega final é concisa e difícil. Esta tradução entende que o acesso era tão estreito que os homens só podiam avançar dois a dois.
    reason: alternative_reading
lexical_decisions:
- source_word: διακατασχεῖν
  choice: ocupassem
  rationale: O infinitivo indica tomar e manter o controle de posições estratégicas. “Ocupassem” comunica naturalmente a ação militar sem sugerir apenas um ataque momentâneo.
- source_word: τὰς ἀναβάσεις τῆς ὀρεινῆς
  choice: as subidas da região montanhosa
  rationale: Preserva mais diretamente a imagem topográfica do grego, isto é, as rotas ascendentes da região serrana, que no contexto funcionam como acessos estratégicos.
- source_word: ἡ εἴσοδος εἰς τὴν Ἰουδαίαν
  choice: por elas se entrava na Judeia
  rationale: Expressa em português corrente o sentido concreto de acesso à Judeia, mantendo a relação explícita com essas rotas.
- source_word: εὐχερῶς διακωλῦσαι
  choice: Seria fácil impedir
  rationale: Reproduz a ideia de que o terreno tornava relativamente fácil barrar o avanço inimigo.
- source_word: αὐτοὺς προσβαίνοντας
  choice: os inimigos enquanto subiam
  rationale: O pronome é explicitado pelo contexto, e “enquanto subiam” conserva tanto o movimento de aproximação quanto o relevo indicado pelas subidas.
- source_word: στενῆς τῆς προσβάσεως οὔσης
  choice: visto que o acesso era estreito
  rationale: A construção causal explica por que seria fácil barrá-los; “acesso” designa naturalmente a via de aproximação.
- source_word: ἐπʼ ἄνδρας τοὺς πάντας δύο
  choice: permitindo a passagem de apenas dois homens lado a lado
  rationale: A frase grega transmitida é comprimida e difícil. Pelo contexto, provavelmente descreve uma passagem tão estreita que só comportava dois homens de cada vez, lado a lado.
