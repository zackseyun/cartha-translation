  yaml_path: translation/deuterocanon/judith/004/012.yaml
  text: And every man of Israel[a], and the women and the children, those dwelling in Jerusalem, fell on their faces before the temple, and put ashes on their heads, and spread out their sackcloth before the Lord,
translation:
  language: pt
  text: Todos os homens de Israel, e as mulheres e as crianças — todos os que moravam em Jerusalém —, prostraram-se com o rosto em terra diante do templo, puseram cinzas sobre a cabeça e estenderam seus panos de saco[a] diante do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “esticaram seus panos de saco diante do Senhor”. A expressão grega é incomum, e o gesto exato pode ser entendido como estender os panos de saco ou como estender-se diante do Senhor vestido de pano de saco, em sinal de luto e súplica.'
    reason: Alternativa lexical e preservação da ambiguidade da expressão grega ἐξέτειναν τοὺς σάκκους αὐτῶν.
lexical_decisions:
- source_word: πᾶς ἀνὴρ Ἰσραὴλ καὶ γυνὴ καὶ παιδία
  choice: Todos os homens de Israel, bem como as mulheres e as crianças
  rationale: Preserva a enumeração explícita de homens, mulheres e crianças. O plural idiomático em português comunica naturalmente o valor distributivo de πᾶς e o sentido coletivo dos termos coordenados.
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: todos os que moravam em Jerusalém
  rationale: A retomada explicativa deixa claro que a expressão se refere ao conjunto anteriormente enumerado, e não apenas às crianças.
- source_word: ἔπεσον κατὰ πρόσωπον τοῦ ναοῦ
  choice: prostraram-se com o rosto em terra diante do templo
  rationale: Expressa com clareza a postura corporal de súplica e a orientação diante do templo, sem reproduzir de modo obscuro a construção grega comprimida.
- source_word: ἐσποδώσαντο τὰς κεφαλὰς αὐτῶν
  choice: cobriram a cabeça de cinzas
  rationale: Comunica de forma natural o gesto concreto de luto indicado pelo verbo relacionado a cinzas.
- source_word: ἐξέτειναν τοὺς σάκκους αὐτῶν
  choice: estenderam seus panos de saco
  rationale: Mantém a ação concreta de estender e conserva a formulação incomum do grego sem especificar indevidamente se eram vestes ou peças colocadas no chão.
- source_word: κατὰ πρόσωπον Κυρίου
  choice: diante do Senhor
  rationale: Equivalente português natural do idiomatismo bíblico que indica presença e orientação perante Deus.
- source_word: Κυρίου
  choice: Senhor
  rationale: Tradução tradicional e direta de κύριος neste contexto judaico, em referência ao Deus de Israel.
theological_decisions:
- issue: Enumeração de homens, mulheres e crianças
  choice: Manter separadamente os três grupos
  alternative: Resumir como “todos os israelitas”
  rationale: O texto grego dá destaque retórico à participação de homens, mulheres e crianças; uma expressão coletiva apagaria esse detalhe.
- issue: Referente de οἱ κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: Aplicar a expressão ao conjunto dos grupos enumerados
  alternative: Ligá-la somente às crianças
  rationale: O particípio masculino plural funciona como retomada coletiva da assembleia enumerada, embora a sequência grega seja sintaticamente compacta.
- issue: Identificação de κύριος
  choice: Senhor
  alternative: Deus
  rationale: Preserva o título empregado pelo texto grego sem substituir κύριος por uma identificação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Panos de saco” conserva a imagem bíblica de luto; os travessões esclarecem que os moradores de Jerusalém incluem todos os grupos enumerados. O marcador da nota foi colocado junto à expressão ambígua sobre os panos de saco, corrigindo sua posição inadequada na camada inglesa de consulta.
