base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/009.yaml
  text: And the sons of Israel did as Joakim the high priest and the council of the whole people of Israel[a], who sat in Jerusalem[c][b], instructed them.
translation:
  language: pt
  text: E os filhos de Israel[a] fizeram conforme lhes ordenaram[b] Joaquim, o sumo sacerdote, e o conselho de todo o povo de Israel, que estavam sentados em Jerusalém.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas” ou “os descendentes de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “determinaram” ou “instruíram”. O grego emprega aqui o singular, embora mencione Joaquim e o conselho; o plural em português expressa naturalmente os dois referentes.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “que estavam sentados em Jerusalém”. A oração pode abranger Joaquim e os membros do conselho ou referir-se aos integrantes do conselho.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: os filhos de Israel
  rationale: Preserva o idiomatismo corporativo e pactual do grego. “Os israelitas” seria mais corrente, mas menos transparente quanto à forma da expressão original.
- source_word: ἐποίησαν καθὰ
  choice: fizeram conforme
  rationale: Reproduz de modo natural a ideia de agir em conformidade com uma determinação.
- source_word: συνέταξεν
  choice: ordenaram
  rationale: O verbo indica aqui uma determinação autorizada. O plural é exigido em português pela coordenação explícita de Joaquim e do conselho, embora o grego empregue o singular antes do segundo sujeito.
- source_word: Ἰωακεὶμ
  choice: Joaquim
  rationale: É a forma tradicional e imediatamente reconhecível em português para o nome representado pelo grego Ἰωακεὶμ.
- source_word: ὁ ἱερεὺς ὁ μέγας
  choice: o sumo sacerdote
  rationale: É a designação portuguesa consagrada e idiomática para esse ofício judaico.
- source_word: ἡ γερουσία
  choice: o conselho
  rationale: Expressa com clareza um corpo de anciãos sem a coloração política moderna que “senado” poderia introduzir.
- source_word: παντὸς δήμου Ἰσραήλ
  choice: de todo o povo de Israel
  rationale: δῆμος designa aqui o povo ou a comunidade como um todo; esta formulação é clara e evita sugerir necessariamente uma assembleia reunida naquele momento.
- source_word: οἱ ἐκάθηντο ἐν Ἰερουσαλήμ
  choice: que estavam reunidos em Jerusalém
  rationale: Comunica em português natural a presença conjunta e assentada dos dirigentes em Jerusalém. Uma nota conserva tanto a imagem literal de estarem sentados quanto a incerteza sobre o antecedente da oração.
theological_decisions:
- issue: Designação corporativa de Israel
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A forma mais próxima do grego conserva a textura de identidade coletiva da expressão sem acrescentar uma interpretação doutrinária.
- issue: Antecedente da oração final
  choice: a redação permite que a oração descreva Joaquim e o conselho em conjunto
  alternative: a oração pode referir-se especificamente aos integrantes do conselho
  rationale: O masculino plural grego pode abranger os dirigentes mencionados conjuntamente ou representar os membros do substantivo coletivo γερουσία. A tradução não deve eliminar essa ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Conserva “filhos de Israel” por transparência ao original, mas emprega “estavam reunidos” no corpo do versículo para evitar uma formulação rígida; a imagem literal e a ambiguidade sintática ficam registradas em nota.
