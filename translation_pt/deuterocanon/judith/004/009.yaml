  naturalness: «Os filhos de Israel», «sumo sacerdote» e «conselho de todo o povo de Israel» são naturais em registro bíblico moderno. «Estavam sentados em Jerusalém» é também claro e mais transparente ao grego do que «estavam reunidos».
  terminology: «Joaquim» é uma forma portuguesa estabelecida para Ἰωακείμ; «sumo sacerdote» traduz idiomaticamente ὁ ἱερεὺς ὁ μέγας; e «conselho» é uma boa opção para γερουσία. «Filhos de Israel» preserva adequadamente a formulação corporativa do original.
