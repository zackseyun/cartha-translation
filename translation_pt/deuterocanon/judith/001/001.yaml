base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/001/001.yaml
  text: In the twelfth year of the reign of Nebuchadnezzar[a], who reigned over the Assyrians in Nineveh, the great city, in the days of Arphaxad, who reigned over the Medes in Ecbatana,
translation:
  language: pt
  text: No décimo segundo ano do reinado de Nabucodonosor, que reinava sobre os assírios em Nínive, a grande cidade, nos dias de Arfaxad, que reinava sobre os medos em Ecbátana,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego termina com “e”, pois a frase continua diretamente no versículo seguinte; aqui se usa uma vírgula para indicar essa continuação de maneira mais natural em português.
    reason: textual_variant
lexical_decisions:
- source_word: ἜΤΟΥΣ δωδεκάτου τῆς βασιλείας
  choice: No décimo segundo ano do reinado
  rationale: Reproduz de modo natural em português a fórmula cronológica grega e entende βασιλεία como o período de exercício do poder real.
- source_word: Ναβουχοδονοσόρ
  choice: Nabucodonosor
  rationale: Forma tradicional e amplamente reconhecida em português.
- source_word: ὃς ἐβασίλευσεν Ἀσσυρίων
  choice: que reinava sobre os assírios
  rationale: Mantém o sentido verbal de ἐβασίλευσεν e apresenta o genitivo Ἀσσυρίων como o povo governado.
- source_word: ἐν Νινευῇ τῇ πόλει τῇ μεγάλῃ
  choice: em Nínive, a grande cidade
  rationale: Preserva a localização e a expressão apositiva do grego em linguagem digna e natural.
- source_word: ἐν ταῖς ἡμέραις Ἀρφαξάδ
  choice: nos dias de Arfaxad
  rationale: Conserva a fórmula temporal literária do texto-fonte.
- source_word: ὃς ἐβασίλευσεν Μήδων
  choice: que reinava sobre os medos
  rationale: Apresenta Μήδων como o povo governado e mantém o paralelismo com a oração anterior.
- source_word: ἐν Ἐκβατάνοις
  choice: em Ecbátana
  rationale: Emprega a forma portuguesa convencional do topônimo e traduz diretamente o valor locativo.
- source_word: καὶ
  choice: ','
  rationale: O καὶ final liga a oração diretamente ao versículo seguinte; a vírgula indica em português que a frase permanece incompleta sem terminar o versículo com um 'e' isolado.
