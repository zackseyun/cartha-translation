  text: E ele construiu ao redor de Ecbátana[a] muralhas de pedras lavradas, com três côvados de largura e seis côvados de comprimento; fez a muralha ter setenta côvados de altura, e o...[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em Ecbátana”. A expressão grega é compacta; em conjunto com “ao redor”, o contexto descreve a fortificação que circundava a cidade.'
    reason: lexical_alternative
  - marker: b
    text: O texto grego fornecido para este versículo termina aqui, de modo incompleto, depois de “e o” (καὶ τὸ). Por isso, a tradução não reconstrói a continuação com base em outra edição.
    reason: textual_variant
lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: construiu
  rationale: Traduz de modo natural o aoristo de οἰκοδομέω no contexto de uma obra de fortificação.
- source_word: ἐπʼ Ἐκβατάνων καὶ κύκλῳ
  choice: ao redor de Ecbátana
  rationale: A combinação da expressão preposicional com κύκλῳ comunica que as muralhas circundavam a cidade, embora a preposição isoladamente também possa ser entendida como localização.
- source_word: τείχη
  choice: muralhas
  rationale: No contexto da fortificação de uma cidade, 'muralhas' é mais específico e idiomático do que o genérico 'muros'.
- source_word: λίθων λελαξευμένων
  choice: pedras lavradas
  rationale: O particípio descreve pedras trabalhadas por corte; 'lavradas' é corrente, digno e próprio da construção em pedra.
- source_word: εἰς πλάτος πηχῶν τριῶν καὶ εἰς μῆκος πηχῶν ἕξ
  choice: com três côvados de largura e seis côvados de comprimento
  rationale: Mantém as medidas antigas e reproduz com clareza o paralelismo das duas dimensões, sem explicitar além do grego o referente exato das medidas.
- source_word: ἐποίησεν τὸ ὕψος τοῦ τείχους πηχῶν ἑβδομήκοντα
  choice: fez a muralha ter setenta côvados de altura
  rationale: Expressa em português natural a construção grega de fazer a altura da muralha chegar à medida declarada.
- source_word: καὶ τὸ
  choice: e o...
  rationale: O texto grego fornecido termina abruptamente com artigo neutro. A tradução conserva a interrupção sem reconstruir palavras ausentes.
