  text: And he captured Arphaxad in the mountains of Ragau[a], and overpowered him with his javelins, and destroyed him to this day.
translation:
  language: pt
  text: E ele capturou Arfaxade nos montes de Ragau[a], dominou-o com seus dardos e o destruiu até aquele dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Rages”, forma mais tradicional do nome do lugar em algumas traduções; o testemunho grego aqui traz “Ragau”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβε
  choice: capturou
  rationale: No contexto militar, indica que o inimigo foi tomado em combate; “capturou” torna explícito esse sentido hostil.
- source_word: ἐν τοῖς ὄρεσι
  choice: nos montes
  rationale: Expressa naturalmente o local montanhoso do confronto e mantém o plural do grego.
- source_word: Ῥαγαῦ
  choice: Ragau
  rationale: Translitera diretamente a forma do topônimo presente no testemunho grego de Swete, sem substituí-la pela forma tradicional de outra tradição textual.
- source_word: κατηνάγκισεν
  choice: dominou-o
  rationale: No contexto de batalha, comunica subjugação pela força com linguagem portuguesa natural, sem reduzir o verbo à ideia abstrata de compelir.
- source_word: σιβύναις
  choice: dardos
  rationale: O termo designa uma arma leve semelhante a uma lança, própria para arremesso; “dardos” preserva a imagem concreta e marcial.
- source_word: ἐξωλέθρευσεν
  choice: destruiu
  rationale: Preserva a força de aniquilação completa do verbo, sem acrescentar um advérbio intensificador ausente.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: até aquele dia
  rationale: Mantém o valor demonstrativo de ἐκείνης e a perspectiva narrativa do grego, evitando convertê-la interpretativamente em “até hoje”.
