base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/001/012.yaml
  text: And Nebuchadnezzar became very angry with all this land[a], and he swore by his throne and his kingdom that he would surely avenge himself on all the territories of Cilicia and Damascus and Syria, and put them to the sword—along with all who lived in Moab and the Ammonites and all Idumea and all those in Egypt[b]—until one came to the borders of the two seas.
translation:
  language: pt
  text: E Nabucodonosor ficou extremamente irado com toda aquela terra e jurou por seu trono e por seu reino que certamente se vingaria de todos os territórios da Cilícia, de Damasco e da Síria, matando à espada seus habitantes, bem como todos os que moravam em Moabe, os amonitas, toda a Idumeia e todos os que moravam no Egito, até chegar aos limites dos dois mares.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “os dois mares” provavelmente indica toda a extensão da região em vista, definida pelos mares que formavam seus limites.
    reason: cultural_note
lexical_decisions:
- source_word: ἐθυμώθη ... σφόδρα
  choice: ficou extremamente irado
  rationale: Expressa tanto o surgimento da ira indicado pelo verbo quanto a forte intensificação de σφόδρα, em português natural e digno.
- source_word: ἐπὶ πᾶσαν τὴν γῆν ταύτην
  choice: com toda aquela terra
  rationale: No contexto, ἐπί indica o alvo da ira; 'terra' mantém a designação territorial ampla sem especificar além do grego.
- source_word: κατὰ τοῦ θρόνου καὶ τῆς βασιλείας αὐτοῦ
  choice: por seu trono e por seu reino
  rationale: Com o verbo de jurar, κατά introduz aquilo pelo qual se presta o juramento; a repetição de 'por' torna a coordenação clara em português.
- source_word: εἰ μὴ ἐκδικήσει
  choice: que certamente se vingaria de
  rationale: A fórmula de juramento com εἰ μή tem força asseverativa, não a de uma condição negativa comum; 'certamente' comunica a resolução enfática, e o reflexivo preserva o caráter pessoal da vingança.
- source_word: πάντα τὰ ὅρια
  choice: todos os territórios
  rationale: Embora ὅρια possa significar 'limites', aqui designa metonimicamente as regiões delimitadas.
- source_word: Δαμασκηνῆς
  choice: Damasco
  rationale: Mantém a sequência de topônimos, embora a forma grega também possa designar a região damascena.
- source_word: ἀνελεῖν τῇ ῥομφαίᾳ αὐτούς
  choice: matando à espada seus habitantes
  rationale: Comunica diretamente o extermínio militar expresso pelo infinitivo e pela espada; 'seus habitantes' explicita o referente humano implícito de αὐτούς no conjunto dos territórios, sem tratar os próprios territórios como objeto de morte.
- source_word: τοὺς υἱοὺς Ἀμμών
  choice: os amonitas
  rationale: É o equivalente étnico natural em português da expressão semítica literal 'filhos de Amom'.
- source_word: Ἰδουμαίαν
  choice: Idumeia
  rationale: Preserva a forma geográfica helenizada testemunhada pelo texto grego.
- source_word: ἕως τοῦ ἐλθεῖν ἐπὶ τὰ ὅρια τῶν δύο θαλασσῶν
  choice: até chegar aos limites dos dois mares
  rationale: O infinitivo português evita impor um pronome sujeito expresso e conserva a construção como limite da ação ou avanço.
theological_decisions:
- issue: Fórmula de juramento εἰ μὴ após ὤμοσεν
  choice: que certamente se vingaria
  alternative: a menos que se vingasse
  rationale: A construção grega funciona como juramento enfático. Uma condicional negativa literal em português seria obscura e poderia sugerir sentido incorreto.
- issue: Sujeito de ἐλθεῖν na cláusula final
  choice: até chegar
  alternative: até que ele chegasse / até onde se chegasse
  rationale: O grego não explicita o sujeito do infinitivo. A forma infinitiva portuguesa preserva essa relativa indeterminação sem tornar a frase artificial.
translation_notes:
  register: Português moderno, corrente e solene, com legibilidade brasileira e vocabulário internacional. A longa enumeração foi preservada, mas organizada por coordenação clara. Evitaram-se arcaísmos como 'passar ao fio da espada' e uma tradução condicional enganosa da fórmula de juramento.
