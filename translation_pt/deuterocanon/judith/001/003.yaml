lexical_decisions:
- source_word: πλάτος αὐτοῦ
  choice: sua largura
  rationale: πλάτος indica a extensão horizontal. “Largura” é a correspondência natural em português, e o possessivo conserva a referência anafórica do grego.
- source_word: πηχῶν πεντήκοντα
  choice: cinquenta côvados
  rationale: Mantém a antiga unidade de medida, sem uma conversão moderna necessariamente imprecisa.
- source_word: τοὺς πύργους αὐτοῦ
  choice: torres
  rationale: πύργος designa aqui torres defensivas; “torres” é claro, neutro e arquitetonicamente apropriado.
- source_word: ἔστησεν
  choice: ergueu
  rationale: Neste contexto de construção, “ergueu” expressa de modo natural o ato de levantar ou estabelecer as torres.
- source_word: ἐπὶ ταῖς πύλαις αὐτῆς
  choice: sobre as portas da cidade
  rationale: ἐπί com o dativo admite a ideia de posição sobre ou junto a. O contexto arquitetônico favorece “sobre”, enquanto “da cidade” torna inteligível o pronome feminino sem depender de um antecedente ausente neste recorte.
- source_word: πηχῶν ἑκατόν
  choice: de cem côvados de altura
  rationale: O grego apresenta apenas a medida depois de “torres”; “de altura” explicita a dimensão naturalmente subentendida.
- source_word: ἐθεμελίωσεν
  choice: estabeleceu ... nos alicerces
  rationale: O verbo significa fundar ou lançar alicerces. A formulação portuguesa mantém essa imagem e acomoda o objeto expresso, “largura”.
- source_word: εἰς πήχεις ἑξήκοντα
  choice: em sessenta côvados
  rationale: A expressão indica a dimensão alcançada na fundação. “Em sessenta côvados” preserva a medida sem impor uma interpretação arquitetônica mais específica.
