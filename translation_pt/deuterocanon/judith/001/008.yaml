lexical_decisions:
- source_word: τοὺς ἐν τοῖς ἔθνεσι
  choice: os que estavam entre os povos
  rationale: Preserva a referência pessoal de τοὺς e o sentido amplo de ἔθνεσι como povos, sem introduzir a conotação religiosa mais específica de “gentios”. O verbo “estavam” explicita de modo mínimo a construção elíptica.
- source_word: Καρμήλου
  choice: Carmelo
  rationale: Emprega a forma bíblica consagrada em português e não acrescenta “monte”, ausente do grego.
- source_word: Γαλαὰδ
  choice: Gileade
  rationale: Usa a forma bíblica tradicional e amplamente reconhecida em português.
- source_word: τὴν ἄνω Γαλιλαίαν
  choice: a Alta Galileia
  rationale: Traduz diretamente o sentido geográfico de ἄνω e trata a expressão como designação regional.
- source_word: τὸ μέγα πεδίον
  choice: a grande planície
  rationale: πεδίον designa normalmente uma extensão plana; “grande planície” reproduz de perto tanto o substantivo quanto μέγα.
- source_word: Ἐσδρήμ
  choice: Esdrelom
  rationale: Adota uma forma portuguesa reconhecível para o nome associado à planície de Esdraelom/Jezreel, enquanto a nota registra a identificação geográfica provável.
