  text: He laid its foundation to a depth of sixty cubits[a], and he made its gates, gates raised to a height of seventy cubits, and its width forty cubits, for the departures of the force of his mighty men and the formations of his foot soldiers.
translation:
  language: pt
  text: Ele lançou os alicerces dela a uma profundidade de sessenta côvados e fez seus portões — portões erguidos até a altura de setenta côvados e com quarenta côvados de largura — para as saídas da força de seus valentes e as formações de seus soldados de infantaria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para as sortidas do exército de seus valentes e as fileiras de sua infantaria”. A cláusula final em grego emprega linguagem militar e é um tanto condensada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθεμελίωσεν
  choice: lançou seus alicerces
  rationale: Expressa de modo natural em português o ato de estabelecer ou assentar uma fundação, preservando a imagem de construção.
- source_word: εἰς πήχεις ἑξήκοντα
  choice: a uma profundidade de sessenta côvados
  rationale: No contexto de alicerces, a medida indica mais naturalmente sua profundidade ou extensão vertical; a explicitação torna a frase compreensível em português.
- source_word: πύλας διεγειρμένας
  choice: portões elevados
  rationale: Preserva a ideia verbal do particípio, isto é, portões erguidos ou levantados, em vez de reduzi-la apenas a “altos”.
- source_word: εἰς ὕψος πηχῶν ἑβδομήκοντα
  choice: à altura de setenta côvados
  rationale: Reproduz diretamente a expressão dimensional do grego em português claro.
- source_word: τὸ πλάτος αὐτῆς πήχεις τεσσεράκοντα
  choice: com quarenta côvados de largura
  rationale: Formulação portuguesa natural para a medida, entendida no fluxo da descrição como referente aos portões.
- source_word: εἰς ἐξόδους
  choice: para as saídas
  rationale: Mantém o sentido básico de ir para fora ou sair, sem eliminar a possível nuance militar de sortidas.
- source_word: δυνάμεως
  choice: da força
  rationale: O substantivo pode designar força militar ou exército; “força” conserva sua amplitude lexical.
- source_word: δυνατῶν αὐτοῦ
  choice: de seus valentes
  rationale: No contexto militar, designa homens fortes, capazes ou valorosos; “valentes” preserva essa nuance sem fundi-los com δυνάμεως.
- source_word: διατάξεις
  choice: as formações
  rationale: No contexto militar, refere-se à disposição ordenada das tropas, isto é, suas formações ou fileiras.
- source_word: τῶν πεζῶν αὐτοῦ
  choice: de seus soldados de infantaria
  rationale: πεζοί são combatentes a pé; a expressão escolhida é clara e corrente em português moderno.
