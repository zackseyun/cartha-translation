  to: Ele lançou os alicerces dela a uma profundidade de sessenta côvados e fez seus portões — portões erguidos até a altura de setenta côvados e com quarenta côvados de largura — para as saídas da força de seus valentes e as formações de seus soldados de infantaria.[a]
