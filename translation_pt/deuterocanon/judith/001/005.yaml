  text: And in those days King Nebuchadnezzar made war against King Arphaxad in the great plain[a], that is, in the territory of Ragae.
translation:
  language: pt
  text: Naqueles dias, o rei Nabucodonosor fez guerra contra o rei Arfaxad na grande planície, isto é, no território de Ragau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos limites de Ragau”. O termo grego pode significar “limites”, “fronteiras” ou o território por eles delimitado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: Naqueles dias
  rationale: Reproduz de modo natural e direto a expressão temporal grega.
- source_word: ἐποίησεν πόλεμον
  choice: fez guerra
  rationale: Preserva de perto o idioma grego e continua claro em português; “travou guerra” seria uma alternativa mais idiomática, porém um pouco menos formalmente correspondente.
- source_word: βασιλεὺς Ναβουχοδονοσὸρ
  choice: o rei Nabucodonosor
  rationale: Traduz o título e emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: πρὸς βασιλέα Ἀρφαξὰδ
  choice: contra o rei Arfaxad
  rationale: Neste contexto bélico, πρός indica direção hostil; “contra” comunica esse sentido sem ambiguidade indevida.
- source_word: ἐν τῷ πεδίῳ τῷ μεγάλῳ
  choice: na grande planície
  rationale: πεδίον designa terreno plano ou região aberta; “planície” corresponde melhor ao cenário geográfico-militar do que “campo”.
- source_word: τοῦτʼ ἔστιν
  choice: isto é
  rationale: Mantém a fórmula explicativa simples do grego.
- source_word: τοῖς ὁρίοις Ῥαγαῦ
  choice: no território de Ragau
  rationale: ὅρια pode indicar limites, fronteiras ou o território delimitado. “Território” é natural no contexto, enquanto a nota preserva a alternativa mais literal. “Ragau” segue a forma tradicional portuguesa do topônimo.
