  text: And in the seventeenth year he drew up his forces for battle against King Arphaxad, and he prevailed in his war, and routed all the force of Arphaxad, all his cavalry, and all his chariots,
translation:
  language: pt
  text: E, no décimo sétimo ano, dispôs suas forças em ordem de batalha contra o rei Arfaxade. Prevaleceu na guerra e pôs em fuga todas as forças de Arfaxade, toda a sua cavalaria e todos os seus carros de guerra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρετάξατο ἐν τῇ δυνάμει αὐτοῦ
  choice: dispôs suas forças em ordem de batalha
  rationale: No contexto militar, o verbo médio indica organizar tropas em formação de combate, enquanto δύναμις se refere às forças militares. A formulação explicita esse sentido de modo natural e fiel.
- source_word: ἐκραταιώθη ἐν τῷ πολέμῳ αὐτοῦ
  choice: Prevaleceu em sua guerra
  rationale: Embora o verbo possa significar literalmente “fortaleceu-se” ou “tornou-se forte”, neste relato de guerra ele expressa que o rei ganhou a vantagem e saiu vitorioso, sem acrescentar detalhes ausentes do grego.
- source_word: ἀνέστρεψεν
  choice: pôs em fuga
  rationale: Em contexto bélico, o verbo descreve fazer o inimigo recuar ou debandar. “Pôs em fuga” comunica claramente a derrota das tropas e evita o sentido pouco natural de “fez voltar”.
- source_word: πᾶσαν τὴν δύναμιν Ἀρφαξὰδ
  choice: todas as forças de Arfaxad
  rationale: δύναμις designa aqui o contingente militar, não poder abstrato. O plural idiomático “forças” é corrente em português.
- source_word: πᾶσαν τὴν ἵππον αὐτοῦ
  choice: toda a sua cavalaria
  rationale: O singular coletivo ἵππος, literalmente “cavalo”, designa neste contexto as tropas montadas; “cavalaria” é o equivalente militar natural.
- source_word: πάντα τὰ ἅρματα αὐτοῦ
  choice: todos os seus carros de guerra
  rationale: ἅρματα indica carros usados em combate. “Carros de guerra” é mais imediatamente compreensível ao leitor moderno do que apenas “carros”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Conservou-se o encadeamento narrativo do grego, mas a longa coordenação foi dividida em duas frases para maior clareza. O pronome possessivo em “sua guerra” mantém a relação formal do original sem introduzir interpretação teológica.
