  text: E ele próprio e suas forças voltaram com eles durante cento e vinte dias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέστρεψεν
  choice: voltou
  rationale: No contexto narrativo, o aoristo de ἀναστρέφω indica retorno. “Voltou” é natural em português e preserva o sentido direcional sem acrescentar destino ou modo de viagem.
- source_word: μετʼ αὐτῶν
  choice: com eles
  rationale: μετά com o genitivo exprime companhia; “com eles” é a correspondência direta e idiomática.
- source_word: αὐτὸς
  choice: ele próprio
  rationale: O pronome expresso é enfático. “Ele próprio” conserva o destaque dado à participação pessoal do líder.
- source_word: ἡ δύναμις αὐτοῦ
  choice: suas forças
  rationale: Em contexto militar, δύναμις designa a força armada. O plural idiomático “suas forças” comunica esse sentido em português sem restringi-lo necessariamente a um exército formal.
- source_word: ἐφʼ ἡμέρας ἑκατὸν εἴκοσι
  choice: durante cento e vinte dias
  rationale: ἐπί com acusativo temporal indica duração. “Durante cento e vinte dias” mantém a relação sintática do grego e evita introduzir uma explicação ausente do texto.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com pontuação que torna clara a aposição enfática “ele próprio e suas forças”. Preservou-se a formulação temporal algo incomum do grego, sem especificar se os cento e vinte dias correspondem à viagem, à permanência ou ao conjunto do retorno.
