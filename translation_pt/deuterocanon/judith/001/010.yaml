  text: até chegar a Tânis e Mênfis, e todos os habitantes do Egito, até chegar às fronteiras da Etiópia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕως τοῦ ἐλθεῖν
  choice: até chegar
  rationale: A construção ἕως τοῦ com infinitivo assinala aqui o limite espacial alcançado. “Até chegar” preserva a imagem verbal e sua repetição no grego, sem deixar de ser natural em português.
- source_word: ἐπάνω
  choice: a
  rationale: Neste contexto de deslocamento em direção a topônimos, ἐπάνω tem valor idiomático de movimento até um lugar; a preposição “a” integra naturalmente a expressão “chegar a”.
- source_word: Τάνεως
  choice: Tânis
  rationale: Forma portuguesa corrente do topônimo egípcio antigo.
- source_word: Μέμφεως
  choice: Mênfis
  rationale: Forma portuguesa consagrada do topônimo.
- source_word: πάντας τοὺς κατοικοῦντας
  choice: todos os habitantes
  rationale: Expressa com clareza e concisão todos os que residem no território, conservando a abrangência de πάντας.
- source_word: τὴν Αἴγυπτον
  choice: do Egito
  rationale: Em português, “habitantes do Egito” é o equivalente natural para os que habitam o país.
- source_word: ἐπὶ τὰ ὅρια
  choice: às fronteiras
  rationale: ὅρια designa limites territoriais; “fronteiras” comunica naturalmente o sentido geográfico no plural.
- source_word: Αἰθιοπίας
  choice: Etiópia
  rationale: Reproduz o nome geográfico grego por sua forma portuguesa tradicional, sem substituí-lo interpretativamente por “Cuxe”.
