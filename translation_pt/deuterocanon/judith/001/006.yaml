revisions:
- from: E todos os que viviam na região montanhosa aliaram-se a ele[a], assim como todos os que viviam ao longo do Eufrates, do Tigre e do Hidaspes, e os que viviam na planície de Arioque[b], rei dos elimeus. E muitas nações se reuniram para a batalha[c] com os filhos de Queleul.
  to: E todos os que viviam na região montanhosa juntaram-se a ele[a], assim como todos os que viviam ao longo do Eufrates, do Tigre e do Hidaspes, e os que viviam na planície de Arioque, rei dos elimeus. E muitas nações, os filhos de Queleul, reuniram-se em formação de batalha[c].
  rationale: A revisão substitui uma inferência de aliança formal por uma formulação mais próxima do verbo grego e elimina a relação «com os filhos de Queleul», que não é explicitada no original. A construção final conserva a associação de «filhos de Queleul» com as muitas nações mediante aposição e verte παράταξις como «formação de batalha». A nota b foi omitida porque o nome Arioque não recebe marcador no texto revisto; ela não é necessária para a fidelidade nem deve ficar sem âncora.
