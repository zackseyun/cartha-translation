  text: And all who lived in the hill country joined him[a], and all who lived along the Euphrates and the Tigris and the Hydaspes, and in the plain of Ariok king of the Elymaeans[c][b]. And many nations assembled for battle with the sons of Cheleoul.
translation:
  language: pt
  text: E todos os que viviam na região montanhosa juntaram-se a ele[a], assim como todos os que viviam ao longo do Eufrates, do Tigre e do Hidaspes, e os que viviam na planície de Arioque, rei dos elimeus. E muitas nações, os filhos de Queleul, reuniram-se em formação de batalha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega também pode ser traduzida mais literalmente por “foram ao encontro dele”; neste contexto, provavelmente indica que se juntaram ao seu lado.
    reason: lexical_alternative
  - marker: c
    text: O termo grego designa uma formação ou linha de batalha.
    reason: cultural_note
lexical_decisions:
- source_word: συνήντησαν πρὸς αὐτόν
  choice: aliaram-se a ele
  rationale: O verbo significa literalmente encontrar-se ou ir ao encontro; no contexto político-militar, indica que esses povos se juntaram ao lado dele. A nota preserva o sentido mais literal.
- source_word: οἱ κατοικοῦντες τὴν ὀρεινήν
  choice: os que viviam na região montanhosa
  rationale: A expressão substantivada designa uma região de montanhas ou terras altas; esta formulação é natural e geograficamente clara em português.
- source_word: οἱ κατοικοῦντες τὸν Εὐφράτην καὶ τὸν Τίγριν καὶ τὸν Ὑδάσπην
  choice: os que viviam ao longo do Eufrates, do Tigre e do Hidaspes
  rationale: Com nomes de rios, 'ao longo de' expressa em português o valor geográfico da construção grega sem sugerir que habitavam dentro dos rios.
- source_word: πεδίῳ
  choice: na planície
  rationale: O dativo tem valor locativo. A repetição elíptica de 'os que viviam' torna explícita em português a ligação sintática provável com os habitantes anteriormente mencionados.
- source_word: Ἀριὼχ
  choice: Arioque
  rationale: Forma aportuguesada que representa adequadamente o nome grego e favorece a leitura corrente.
- source_word: Ἐλυμαίων
  choice: elimeus
  rationale: Reflete o gentílico grego relativo a Elimaida sem substituí-lo pelo termo mais amplo 'elamitas'.
- source_word: συνῆλθον
  choice: se reuniram
  rationale: Expressa diretamente a ideia de convergência coletiva, adequada ao contexto militar.
- source_word: εἰς παράταξιν
  choice: para a batalha
  rationale: A expressão aponta para disposição ou formação militar; em português corrente, 'para a batalha' comunica a finalidade sem impor tecnicismo, enquanto a nota registra o sentido mais específico.
- source_word: υἱῶν Χελεούλ
  choice: os filhos de Queleul
  rationale: Mantém a formulação genealógica ou coletiva do grego, sem decidir se se trata de descendentes, clã ou forças militares.
