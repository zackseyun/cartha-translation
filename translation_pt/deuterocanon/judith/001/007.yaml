  yaml_path: translation/deuterocanon/judith/001/007.yaml
  text: And Nebuchadnezzar king of the Assyrians sent to all who lived in Persia and to all who lived toward the west—to those living in Cilicia and Damascus[a], Lebanon and Anti-Lebanon, and to all who lived along the seacoast—
translation:
  language: pt
  text: 'E Nabucodonosor, rei dos assírios, enviou a todos os que habitavam a Pérsia e a todos os que habitavam em direção ao oeste[a]: aos que habitavam a Cilícia e Damasco, o Líbano e o Antilíbano, e a todos os que habitavam ao longo do litoral —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nas regiões ocidentais”. Literalmente, “em direção ao oeste”.'
    reason: A expressão πρὸς δυσμαῖς pode indicar orientação para o oeste ou, conforme o contexto, os territórios ocidentais.
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou mensageiros
  rationale: O verbo significa “enviou”, mas o objeto fica implícito no grego. Em português, explicitar “mensageiros” torna a frase natural sem definir o conteúdo da missão.
- source_word: ἐπὶ πάντας τοὺς κατοικοῦντας
  choice: a todos os que habitavam
  rationale: Com o verbo “enviar” e a sequência de destinatários geográficos, ἐπί indica direção aos destinatários, não hostilidade contra eles.
- source_word: τὴν Περσίδα
  choice: a Pérsia
  rationale: Forma geográfica corrente em português para a região mencionada.
- source_word: πρὸς δυσμαῖς
  choice: para os lados do oeste
  rationale: Preserva a orientação geográfica relativamente aberta da expressão grega, sem transformá-la à força em nome formal de uma região.
- source_word: κατοικοῦντας τὴν Κιλικίαν καὶ Δαμασκόν
  choice: aos que habitavam a Cilícia e Damasco
  rationale: Mantém a construção direta do grego com nomes de lugares, em linguagem portuguesa clara e digna.
- source_word: τὸν Λίβανον καὶ Ἀντιλίβανον
  choice: o Líbano e o Antilíbano
  rationale: Emprega os nomes geográficos convencionais em português para as duas cadeias montanhosas.
- source_word: κατὰ πρόσωπον παραλίας
  choice: ao longo do litoral
  rationale: Expressa naturalmente a ideia dos habitantes situados diante do mar ou na faixa costeira, evitando um decalque obscuro de πρόσωπον.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A repetição de “habitavam” acompanha a estrutura retórica do grego; os dois-pontos mostram que Cilícia, Damasco, Líbano e Antilíbano especificam os territórios mencionados a oeste. O travessão final preserva a continuidade sintática com o versículo seguinte.
