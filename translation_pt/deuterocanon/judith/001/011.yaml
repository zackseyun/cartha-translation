base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/001/011.yaml
  text: And all who inhabited the whole land treated the word of Nebuchodonosor king of the Assyrians with contempt, and they did not join him for the war, because they did not fear him, but he was before them like an ordinary man, and they sent his messengers back empty, in dishonor, from before him.
translation:
  language: pt
  text: E todos os habitantes de toda a terra trataram com desprezo a palavra[a] de Nabucodonosor, rei dos assírios, e não se juntaram a ele para a guerra, porque não o temiam; para eles, ele era como um homem igual. E fizeram os mensageiros dele voltar vazios, em desonra, de diante dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a mensagem” ou “a ordem de Nabucodonosor”. O termo grego pode ter qualquer um desses sentidos, e o verbo indica que a trataram como algo de pouca importância.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “fizeram os mensageiros dele voltar vazios, em desonra, de diante dele”. “Vazios” pode significar sem resultado ou de mãos vazias; “de diante dele” pode referir-se ao retorno à presença de Nabucodonosor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφαύλισαν
  choice: trataram com desprezo
  rationale: Expressa a ação de considerar algo sem valor ou importância, sem reduzir o verbo a um sentimento meramente interior.
- source_word: οἱ κατοικοῦντες πᾶσαν τὴν γῆν
  choice: todos os habitantes de toda a terra
  rationale: Preserva a dupla abrangência de πάντες e πᾶσαν, em formulação natural e solene em português.
- source_word: τὸ ῥῆμα
  choice: a palavra
  rationale: Mantém a amplitude semântica do grego, que pode indicar palavra, mensagem ou ordem; o contexto sugere uma exigência régia, mas não obriga a especificá-la como ordem.
- source_word: οὐ συνῆλθον αὐτῷ εἰς τὸν πόλεμον
  choice: não se juntaram a ele para a guerra
  rationale: Comunica que recusaram reunir-se ou aliar-se a Nabucodonosor para a ação militar.
- source_word: ἦν ἐναντίον αὐτῶν ὡς ἀνὴρ ἴσος
  choice: Aos olhos deles, ele era apenas um homem igual a eles
  rationale: 'Torna explícita, de modo natural, a perspectiva dos habitantes: consideravam o rei um simples homem do mesmo nível que eles, não alguém a ser temido.'
- source_word: ἀνέστρεψαν τοὺς ἀγγέλους αὐτοῦ κενούς
  choice: mandaram os mensageiros dele de volta, de mãos vazias
  rationale: ἀνέστρεψαν indica fazê-los voltar, e κενούς descreve o retorno sem resultado ou resposta favorável.
- source_word: ἐν ἀτιμίᾳ
  choice: desonrados
  rationale: Reproduz a ideia de desonra ou tratamento vergonhoso em português corrente.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: à presença dele
  rationale: No contexto do envio e retorno dos mensageiros, comunica que eles voltaram à presença de Nabucodonosor; a expressão grega mais literal é registrada em nota.
