  text: And he gained control of his cities[a], and he came as far as Ecbatana, and he seized its towers and plundered its streets[b], and he turned its splendor into disgrace.
translation:
  language: pt
  text: E ele tomou o controle das suas cidades e chegou até Ecbátana; apoderou-se das torres da cidade, saqueou suas ruas largas[a] e transformou seu esplendor em desonra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego pode indicar mais especificamente ruas largas ou praças públicas da cidade.
    reason: lexical_alternative
  - marker: b
    text: Aqui, o termo grego traduzido como «esplendor» significa ornamento ou magnificência, não «mundo».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκυρίευσεν τῶν πόλεων αὐτοῦ
  choice: tomou o controle das cidades dele
  rationale: κυριεύω indica obter ou exercer domínio. A formulação comunica conquista militar sem pressupor um governo prolongado; «dele» preserva a referência explícita de αὐτοῦ, embora seu referente dependa do contexto anterior.
- source_word: ἀφίκετο ἕως Ἐκβατάνων
  choice: chegou até Ecbátana
  rationale: ἀφικνέομαι exprime chegada, e ἕως assinala o limite alcançado. «Ecbátana» é a forma portuguesa corrente do topônimo.
- source_word: ἐκράτησεν τῶν πύργων
  choice: apoderou-se das torres da cidade
  rationale: κρατέω com genitivo pode indicar tomar posse ou controle. «Apoderou-se» mantém a força da ação militar; «da cidade» explicita naturalmente que as torres pertencem a Ecbátana.
- source_word: ἐπρονόμευσε τὰς πλατείας αὐτῆς
  choice: saqueou suas ruas largas
  rationale: προνομεύω denota tomar despojos, e πλατεῖαι são vias largas ou espaços públicos urbanos. «Ruas largas» preserva essa especificidade melhor que o genérico «ruas».
- source_word: τὸν κόσμον αὐτῆς
  choice: seu esplendor
  rationale: κόσμος, neste contexto, significa ornamento, beleza organizada ou magnificência da cidade, e não «mundo».
- source_word: ἔθηκεν εἰς ὄνειδος
  choice: transformou ... em vergonha
  rationale: A construção expressa tornar algo motivo ou estado de opróbrio. A tradução conserva o contraste retórico entre esplendor e vergonha.
