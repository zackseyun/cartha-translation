  text: and all those in Samaria and its cities[a], and beyond the Jordan as far as Jerusalem, and Batane and Chelous and Kadesh and the river of Egypt, and Taphnas and Rameses and all the land of Goshen[b],
translation:
  language: pt
  text: e todos os que estavam em Samaria e em suas cidades, e além do Jordão até Jerusalém, Batané, Quelus, Cades, o rio do Egito[a], Tafnes[b], Ramessés e toda a terra de Gósen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a torrente do Egito”. O grego traz literalmente “rio do Egito” (ποταμός), mas esse nome de fronteira é traduzido de maneiras diferentes na tradição bíblica.
    reason: lexical_alternative
  - marker: b
    text: Tafnes é a forma grega do lugar também conhecido como Táfnis ou Tahpanes.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντας τοὺς ἐν Σαμαρείᾳ
  choice: todos os que estavam em Samaria
  rationale: A expressão é elíptica no contexto da lista; “os que estavam” explicita naturalmente as pessoas subentendidas sem definir sexo ou condição e preserva a força distributiva de πάντας.
- source_word: ταῖς πόλεσιν αὐτῆς
  choice: em suas cidades
  rationale: O pronome retoma Samaria. A preposição “em”, recuperada do sintagma anterior, deixa claro que se trata das pessoas presentes também nas cidades de Samaria.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: além do Jordão
  rationale: Preserva o sentido geográfico de πέραν e emprega uma formulação bíblica clara em português atual.
- source_word: ἕως Ἰερουσαλήμ
  choice: até Jerusalém
  rationale: ἕως indica o limite ou a extensão geográfica; “até” o expressa de modo direto.
- source_word: Βαττανὴ
  choice: Batané
  rationale: Transliteração conservadora do topônimo grego, sem harmonizá-lo interpretativamente com Basã.
- source_word: Χελούς
  choice: Quelus
  rationale: Transliteração portuguesa do topônimo grego de identificação incerta, preferível a um equivalente conjectural.
- source_word: Κάδης
  choice: Cades
  rationale: Forma tradicional e reconhecível em português para o topônimo bíblico representado pelo grego Κάδης.
- source_word: τοῦ ποταμοῦ Αἰγύπτου
  choice: o rio do Egito
  rationale: O texto grego emprega explicitamente ποταμός, “rio”; a tradução principal conserva esse dado, enquanto a possível designação tradicional de fronteira é registrada em nota.
- source_word: Τάφνας
  choice: Táfnis
  rationale: Forma portuguesa transliterada do nome grego; a forma bíblica alternativa mais conhecida é preservada em nota.
- source_word: Ραμεσσὴ
  choice: Ramessés
  rationale: Forma portuguesa consagrada e reconhecível correspondente ao topônimo grego.
- source_word: πᾶσαν γῆν Γέσεμ
  choice: toda a terra de Gósen
  rationale: “Gósen” é a forma portuguesa bíblica reconhecível do lugar designado por Γέσεμ; “toda” preserva πᾶσαν.
