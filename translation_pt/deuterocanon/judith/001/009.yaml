translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura de enumeração do grego foi preservada, mas sem repetir a conjunção antes de cada topônimo, o que seria pesado em português. Os nomes próprios seguem formas portuguesas reconhecíveis ou transliterações conservadoras quando a identificação é incerta.
