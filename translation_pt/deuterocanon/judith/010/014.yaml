  text: And when the men heard her words and observed her face[b][a], she was exceedingly marvelous in beauty before them.
translation:
  language: pt
  text: Quando os homens ouviram as palavras dela e observaram atentamente o seu rosto, ela lhes pareceu extraordinariamente bela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «era diante deles extremamente maravilhosa em beleza»; isto é, aos olhos deles, ela tinha uma beleza extraordinária.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν
  choice: Quando ouviram
  rationale: A construção introduz uma oração temporal; «quando» expressa com naturalidade a sequência narrativa sem acrescentar uma ideia de imediatismo.
- source_word: οἱ ἄνδρες
  choice: os homens
  rationale: Mantém o sentido comum de ἄνδρες sem especificar «soldados», identificação que o contexto pode sugerir, mas que este versículo não explicita.
- source_word: τὰ ῥήματα αὐτῆς
  choice: as palavras dela
  rationale: Reproduz de modo claro e próximo o sentido de palavras ou declarações proferidas.
- source_word: κατενόησαν
  choice: observaram atentamente
  rationale: O verbo indica percepção cuidadosa ou atenção concentrada; «observaram atentamente» torna explícita essa força lexical em português corrente.
- source_word: τὸ πρόσωπον αὐτῆς
  choice: o seu rosto
  rationale: Preserva o referente concreto de πρόσωπον, em vez de ampliar o sentido para toda a aparência.
- source_word: ἦν ἐναντίον αὐτῶν
  choice: lhes pareceu
  rationale: Expressa em português natural a ideia idiomática de como ela se apresentava diante deles ou aos olhos deles.
- source_word: θαυμάσιον τῷ κάλλει σφόδρα
  choice: extraordinariamente bela
  rationale: Comunica a admiração intensa quanto à beleza e o forte valor intensificador de σφόδρα, evitando uma formulação portuguesa rígida como «maravilhosa em beleza».
