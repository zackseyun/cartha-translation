  text: But when they saw her[a], and her face had been changed and her clothing altered, they marveled very greatly at her beauty,
translation:
  language: pt
  text: Quando a viram, porém, com o rosto transformado e as vestes trocadas, maravilharam-se muitíssimo com a beleza dela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego acumula dois intensificadores, com o sentido de “muito intensamente” ou “em grau muito elevado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ εἶδον αὐτήν
  choice: Quando a viram, porém
  rationale: ὡς com o aoristo introduz uma oração temporal, enquanto δέ faz uma transição narrativa leve. A posição de “porém” mantém o fluxo natural em português sem dar ao conectivo peso excessivo.
- source_word: ἦν ἠλλοιωμένον τὸ πρόσωπον αὐτῆς
  choice: com o rosto transformado
  rationale: ἠλλοιωμένον indica que o rosto estava alterado ou mudado. “Transformado” conserva a ideia de mudança visível sem ampliar πρόσωπον para a aparência inteira.
- source_word: τὴν στολὴν μεταβεβληκυῖαν
  choice: as vestes trocadas
  rationale: στολή designa veste, traje ou roupa. O plural coletivo “vestes” é idiomático em português e adequado ao registro narrativo; “trocadas” expressa a mudança de roupa indicada por μεταβεβληκυῖαν.
- source_word: ἐθαύμασαν
  choice: maravilharam-se
  rationale: O verbo comunica espanto e admiração. “Maravilharam-se” preserva ambos os aspectos com linguagem clara e dignificada.
- source_word: ἐπὶ τῷ κάλλει αὐτῆς
  choice: com a beleza dela
  rationale: κάλλος significa beleza, e ἐπί com o dativo indica aquilo que provocou o assombro. A formulação evita possível ambiguidade do possessivo “sua”.
- source_word: ἐπὶ πολὺ σφόδρα
  choice: muitíssimo
  rationale: A expressão acumula intensificadores e transmite grau excepcional. “Muitíssimo” reproduz essa forte ênfase de modo natural em português, enquanto a nota registra a forma incomum do grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e dignificado, com legibilidade brasileira. A construção com “com o rosto... e as vestes...” torna natural a sintaxe grega comprimida sem alterar a relação temporal nem a causa da admiração.
