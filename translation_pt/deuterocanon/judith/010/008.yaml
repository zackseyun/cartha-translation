  yaml_path: translation/deuterocanon/judith/010/008.yaml
  text: And they said to her, “May the God of our fathers grant you favor, and bring your undertakings to completion for the boasting of the sons of Israel and the exaltation of Jerusalem.” And she bowed down to God.
translation:
  language: pt
  text: 'E disseram-lhe: “Que o Deus de nossos pais lhe conceda favor[a] e leve a bom termo os seus propósitos[b], para a glória dos filhos de Israel e a exaltação de Jerusalém.” E ela se prostrou diante de Deus.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lhe conceda graça” ou “faça com que seja recebida favoravelmente”. A expressão grega diz literalmente “dê você para favor” e é um idioma que expressa favor ou acolhimento favorável.
    reason: lexical_alternative
  - marker: b
    text: Ou “os seus planos”, “os seus empreendimentos” ou “as suas iniciativas”.
    reason: lexical_alternative
  - marker: c
    text: Ou “inclinou-se diante de Deus” ou “adorou a Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη ... εἰς χάριν
  choice: lhe conceda favor
  rationale: O optativo expressa desejo ou bênção, e a construção idiomática εἰς χάριν aponta para favor, acolhimento favorável ou êxito. A formulação é natural em português e conserva a força da oração.
- source_word: τελειῶσαι
  choice: leve a bom termo
  rationale: Expressa a conclusão bem-sucedida daquilo que Judite pretende realizar, preservando o sentido télico do verbo sem rigidez excessiva.
- source_word: τὰ ἐπιτηδεύματά σου
  choice: os seus propósitos
  rationale: O substantivo pode designar planos, ocupações, empreendimentos ou uma linha de ação. No contexto, refere-se ao que Judite se dispõe a executar; “propósitos” mantém amplitude e soa natural.
- source_word: εἰς καύχημα
  choice: para a glória
  rationale: καύχημα pode indicar motivo de orgulho, exultação ou glória. Nesta bênção pública, “glória” comunica de modo natural o resultado honroso para Israel, sem impor a conotação negativa que “vanglória” ou “jactância” costuma ter em português.
- source_word: υἱῶν Ἰσραήλ
  choice: dos filhos de Israel
  rationale: Preserva de forma transparente a expressão tradicional e o masculino plural do grego.
- source_word: ὕψωμα
  choice: a exaltação
  rationale: Mantém a imagem de elevação contida no substantivo e sua aplicação à honra pública de Jerusalém.
- source_word: προσεκύνησεν τῷ θεῷ
  choice: se prostrou diante de Deus
  rationale: O verbo descreve um gesto corporal de reverência que, dirigido a Deus, é também ato de adoração. “Prostrou-se diante” preserva o gesto sem reduzi-lo ao termo abstrato “adorou”.
theological_decisions:
- issue: Sentido das expressões finais da bênção
  choice: para a glória dos filhos de Israel e a exaltação de Jerusalém
  alternative: para o orgulho dos filhos de Israel e a honra de Jerusalém
  rationale: A construção εἰς + καύχημα/ὕψωμα apresenta o resultado honroso esperado da missão. “Glória” e “exaltação” conservam o paralelismo elevado e evitam atribuir ao texto uma avaliação moral negativa do orgulho.
- issue: Sentido de προσκυνέω
  choice: ela se prostrou diante de Deus
  alternative: ela adorou a Deus / inclinou-se diante de Deus
  rationale: A opção conserva a ação reverencial concreta e deixa intacta sua dimensão cultual, sem decidir além do necessário qual foi a postura exata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “lhe” e “seus” em referência respeitosa a Judite, mantém “filhos de Israel” por transparência formal e evita termos hoje marcadamente negativos, como “jactância”, no corpo do versículo.
