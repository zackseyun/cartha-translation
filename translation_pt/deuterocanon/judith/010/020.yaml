  yaml_path: translation/deuterocanon/judith/010/020.yaml
  text: And those attending Holofernes came out[a], and all his servants, and they brought her into the tent.
translation:
  language: pt
  text: Saíram os que permaneciam junto de Holofernes[a], bem como todos os seus servos, e a levaram para dentro da tenda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que dormiam ao lado de Holofernes” ou “os que se deitavam perto de Holofernes”. O particípio grego pode ser entendido mais literalmente dessa maneira, mas aqui provavelmente se refere aos que permaneciam perto dele para atendê-lo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: saíram
  rationale: Expressa diretamente o movimento para fora indicado pelo aoristo de ἐξέρχομαι, sem impor ao português uma perspectiva narrativa não explicitada.
- source_word: οἱ παρακαθεύδοντες Ὀλοφέρνῃ
  choice: os que permaneciam junto de Holofernes
  rationale: Mantém a ideia central de proximidade e presença contínua. O particípio pode significar literalmente os que dormiam ou se deitavam junto dele, mas, neste contexto militar, provavelmente designa pessoas que permaneciam perto dele para atendê-lo; a nota preserva a leitura literal.
- source_word: θεράποντες
  choice: servos
  rationale: θεράποντες designa servos ou assistentes. “Servos” é claro, corrente e adequado ao contexto doméstico-militar.
- source_word: εἰσήγαγον
  choice: levaram para dentro
  rationale: εἰσάγω significa levar ou conduzir para dentro. A formulação explicita naturalmente em português o movimento de entrada.
- source_word: σκηνήν
  choice: tenda
  rationale: É o equivalente direto de σκηνή e a designação mais transparente no contexto de um acampamento militar.
