  yaml_path: translation/deuterocanon/judith/010/010.yaml
  text: And they did so. Then Judith went out[a], she and her maid with her; and the men of the city kept watching her until she went down the mountain, until she passed through the valley, and they could no longer see her.
translation:
  language: pt
  text: E fizeram assim. Então Judite saiu com sua serva. Os homens da cidade ficaram observando-a até que ela desceu o monte, atravessou o vale[a] e eles já não podiam vê-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ravina” ou “desfiladeiro”.
    reason: O grego αὐλών pode designar um vale, uma ravina ou uma passagem estreita entre elevações.
lexical_decisions:
- source_word: ἐποίησαν οὕτως
  choice: fizeram assim
  rationale: Reproduz de modo natural a confirmação narrativa do grego, sem arcaísmo.
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: É o equivalente corrente e direto para o verbo de movimento no contexto narrativo.
- source_word: αὐτὴ καὶ ἡ παιδίσκη αὐτῆς μετʼ αὐτῆς
  choice: com sua serva
  rationale: Expressa naturalmente em português que Judite saiu acompanhada de sua atendente, evitando a repetição pronominal pouco idiomática do grego.
- source_word: ἀπεσκόπευον
  choice: ficaram observando-a
  rationale: O pretérito imperfeito grego indica uma ação continuada; esta formulação conserva essa duração.
- source_word: οἱ ἄνδρες τῆς πόλεως
  choice: os homens da cidade
  rationale: Tradução transparente e fiel, que mantém a referência masculina explícita.
- source_word: ἕως οὗ κατέβη τὸ ὄρος
  choice: até que ela desceu o monte
  rationale: Preserva o limite temporal e o movimento topográfico descritos no grego.
- source_word: αὐλών
  choice: vale
  rationale: É uma tradução ampla e clara para a depressão ou passagem do terreno; a possível configuração mais estreita é preservada em nota.
- source_word: οὐκ ἔτι ἐθεώρουν αὐτήν
  choice: eles já não podiam vê-la
  rationale: Comunica naturalmente o fim da percepção visual à medida que Judite saiu do campo de visão.
