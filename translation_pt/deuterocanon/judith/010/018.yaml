    rationale: Em português, notícias se espalham, mas dificilmente “em voz alta”. O grego indica que sua presença/chegada foi clamada, anunciada ou proclamada através das tendas.
  - severity: low
    issue: “Até que o avisaram a respeito dela” tem referente pronominal recuperável, mas menos explícito e menos próximo da construção grega.
    rationale: “Até que lhe deram notícia dela” mantém a relação ‘informar-lhe acerca dela’ e evita qualquer ambiguidade momentânea sobre “o”.
