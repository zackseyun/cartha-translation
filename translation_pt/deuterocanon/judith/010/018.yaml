  text: And there was a rush in the camp[a], for her arrival was reported through the tents; and they came and gathered around her as she stood outside the tent of Holofernes, until they announced her to him.
translation:
  language: pt
  text: Houve então uma aglomeração no acampamento, pois a chegada dela foi anunciada pelas tendas.[a] Eles vieram e se reuniram ao redor dela, enquanto ela permanecia do lado de fora da tenda de Holofernes, até que lhe deram notícia dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a presença dela foi anunciada em voz alta pelas tendas”. O verbo grego sugere a propagação vocal da notícia, e παρουσία pode significar tanto “presença” como, neste contexto, “chegada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο συνδρομή
  choice: houve então uma aglomeração
  rationale: συνδρομή descreve pessoas acorrendo e juntando-se. “Aglomeração” preserva o movimento coletivo repentino sem sugerir necessariamente pânico.
- source_word: παρεμβολή
  choice: acampamento
  rationale: No contexto militar, παρεμβολή designa naturalmente o acampamento.
- source_word: διεβοήθη
  choice: se espalhou em voz alta
  rationale: A formulação conserva tanto a disseminação da notícia quanto o componente vocal do verbo ligado a βοάω, sem recorrer a linguagem arcaica.
- source_word: τὰ σκηνώματα
  choice: as tendas
  rationale: O termo se refere às habitações de lona do acampamento; “tendas” é claro e direto.
- source_word: ἡ παρουσία αὐτῆς
  choice: a notícia da chegada dela
  rationale: παρουσία pode indicar presença ou chegada. Neste contexto, “chegada” expressa bem o aparecimento recente dela no acampamento, enquanto “a notícia” torna natural em português a construção passiva grega.
- source_word: ἐκύκλουν αὐτήν
  choice: se reuniram ao redor dela
  rationale: Preserva a imagem de cercá-la fisicamente, mas evita a conotação necessariamente hostil que “cercaram” poderia produzir.
- source_word: ὡς ἱστήκει
  choice: enquanto permanecia
  rationale: Expressa o estado continuado de Judith naquele lugar; em português, o sujeito feminino é recuperado naturalmente pelo contexto.
- source_word: ἔξω τῆς σκηνῆς Ὀλοφέρνου
  choice: do lado de fora da tenda de Holofernes
  rationale: Tradução direta, clara e idiomática da indicação de lugar.
- source_word: προσήγγειλαν αὐτῷ περὶ αὐτῆς
  choice: o avisaram a respeito dela
  rationale: A expressão indica que levaram a Holofernes a informação sobre Judith. “Avisaram” é natural e não implica uma apresentação pessoal já realizada.
