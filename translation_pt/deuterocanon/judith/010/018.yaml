  to: Houve então uma aglomeração no acampamento, pois a chegada dela foi anunciada pelas tendas.[a] Eles vieram e se reuniram ao redor dela, enquanto ela permanecia do lado de fora da tenda de Holofernes, até que lhe deram notícia dela.
