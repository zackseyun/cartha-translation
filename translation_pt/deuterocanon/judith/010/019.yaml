base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/019.yaml
  text: And they marveled at her beauty[a], and because of her they marveled at the sons of Israel; and each said to his neighbor, “Who would despise this people, who have such women among them? For it is not good to leave even one man from among them[b], because those who are left would be able to outwit the whole earth.”
translation:
  language: pt
  text: 'E eles admiravam a beleza dela e, por causa dela, admiravam os filhos de Israel[a]. Cada um dizia ao seu próximo: “Quem desprezará este povo, que tem em seu meio mulheres assim? Pois não convém deixar entre eles nem um único homem, porque os que forem deixados poderão sobrepujar em astúcia toda a terra[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os israelitas”. Em grego: “os filhos de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os que restassem com vida poderiam sobrepujar em astúcia o mundo inteiro”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: admiravam-se
  rationale: O imperfeito, repetido no grego, expressa reação contínua de assombro e admiração; a repetição foi preservada.
- source_word: κάλλει
  choice: beleza
  rationale: Equivalente direto, natural e inequívoco para a beleza física de Judite neste contexto.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: os filhos de Israel
  rationale: Preserva o idioma masculino formal do grego, que aqui designa coletivamente o povo israelita.
- source_word: ἀπʼ αὐτῆς
  choice: por causa dela
  rationale: 'Exprime com clareza a relação causal: Judite é o motivo pelo qual eles passam a admirar Israel.'
- source_word: καταφρονήσει
  choice: desprezará
  rationale: Mantém o futuro da pergunta retórica e a ideia de tratar o povo com desdém.
- source_word: γυναῖκας τοιαύτας
  choice: mulheres assim
  rationale: Formulação corrente que conserva o plural e a força avaliativa da expressão grega.
- source_word: οὐ καλόν ἐστιν
  choice: não convém
  rationale: Conserva a amplitude do juízo sem o apresentar necessariamente como avaliação moral; no contexto, trata-se sobretudo de conveniência estratégica.
- source_word: ὑπολειπέσθαι ἐξ αὐτῶν ἄνδρα ἕνα
  choice: deixar entre eles nem um único homem
  rationale: Torna explícita a ênfase de ἕνα e mantém o masculino específico do cenário militar.
- source_word: οἱ ἀφεθέντες
  choice: os que forem deixados
  rationale: Preserva a formulação passiva e a referência implícita aos sobreviventes, sem acrescentar no texto principal 'com vida'.
- source_word: δυνήσονται κατασοφίσασθαι
  choice: poderão superar em astúcia
  rationale: Comunica o emprego de inteligência ou astúcia superior contra outros sem reduzir o verbo à simples fraude.
- source_word: πᾶσαν τὴν γῆν
  choice: toda a terra
  rationale: Mantém o sentido concreto e abrangente de γῆ, deixando em nota a possibilidade idiomática de 'mundo inteiro'.
theological_decisions:
- issue: Linguagem coletiva masculina referente a Israel
  choice: os filhos de Israel
  alternative: os israelitas
  rationale: A expressão formalmente masculina do grego foi mantida, embora funcione como designação coletiva de Israel; a alternativa natural aparece em nota.
- issue: Masculino singular na declaração militar
  choice: nem um único homem
  alternative: nem uma única pessoa
  rationale: O grego emprega explicitamente ἄνδρα, e o contexto trata dos homens sobreviventes de uma ação militar; não se generalizou o referente.
- issue: Alcance de πᾶσαν τὴν γῆν
  choice: toda a terra
  alternative: o mundo inteiro
  rationale: A tradução principal conserva a imagem lexical do grego, enquanto a nota registra o sentido global possível sem decidir em excesso.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição retórica de “admiravam-se” foi preservada. “Ao seu próximo” conserva o tom bíblico sem arcaísmo excessivo; “em seu meio” evita uma reprodução pouco natural de ἐν ἑαυτῷ.
