  yaml_path: translation/deuterocanon/judith/010/006.yaml
  text: And they went out to the gate of the city of Bethulia[a], and found Uzziah standing there, and Chabris and Charmis, the elders of the city.
translation:
  language: pt
  text: E elas saíram em direção ao portão da cidade de Betúlia e encontraram ali Ozias de pé[a], bem como Cabris e Carmis, os anciãos da cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “de pé sobre/junto a ele”, em referência ao portão; “ali” expressa essa localização de modo natural em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: elas saíram
  rationale: 'O aoristo de ἐξέρχομαι indica movimento para fora. O pronome feminino explicita naturalmente, em português, o sujeito recuperado do contexto: Judite e sua serva.'
- source_word: ἐπὶ τὴν πύλην
  choice: em direção ao portão
  rationale: Com verbo de movimento, ἐπί seguido de acusativo expressa deslocamento em direção ao portão. Esta formulação evita sugerir que elas saíram da própria cidade, pois ainda se dirigiam ao portão.
- source_word: τῆς πόλεως Βαιτυλουά
  choice: da cidade de Betúlia
  rationale: πόλις significa “cidade”; Betúlia é a forma portuguesa tradicional e reconhecível do topônimo grego Βαιτυλουά.
- source_word: εὗρον
  choice: encontraram
  rationale: Preserva o sentido lexical comum de εὑρίσκω e é natural para o encontro das personagens junto ao portão.
- source_word: ἐφεστῶτα ἐπʼ αὐτῇ
  choice: ali Ozias de pé
  rationale: O particípio perfeito descreve Ozias presente, em pé, junto ao portão; “ali” retoma o local de modo idiomático, sem sugerir que estivesse literalmente sobre o portão.
- source_word: Ὀζίαν
  choice: Ozias
  rationale: Forma tradicional portuguesa do nome bíblico representado pelo grego Ὀζίας.
- source_word: τοὺς πρεσβυτέρους τῆς πόλεως
  choice: os anciãos da cidade
  rationale: πρεσβύτεροι designa aqui os líderes ou anciãos cívicos; a tradução mantém tanto a função social quanto a estrutura do grego.
- source_word: Χάβρειν καὶ Χάρμειν
  choice: Cabris e Carmis
  rationale: Formas portuguesas transliteradas dos nomes próprios gregos, retiradas das flexões acusativas do texto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Portão” comunica uma entrada urbana fortificada com mais naturalidade que “porta”. A coordenação foi vertida com “bem como” para deixar claro que Ozias, Cabris e Carmis foram todos encontrados ali, enquanto “os anciãos da cidade” fica em aposição a Cabris e Carmis, conforme a construção grega.
