  yaml_path: translation/deuterocanon/judith/010/002.yaml
  text: And she rose from her prostration and called her maid Abra[a], and went down into the house in which she stayed during the days of her Sabbaths and during her festivals[b],
translation:
  language: pt
  text: Então ela se levantou de sua prostração[a], chamou Abra e desceu à casa onde costumava ficar nos dias de seus sábados[b] e em suas festas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de sua queda”. O substantivo grego pode indicar uma queda, mas aqui provavelmente se refere à postura prostrada de Judite em oração ou luto.'
    reason: lexical_alternative
  - marker: b
    text: O grego diz literalmente “nos dias de seus sábados”, no plural, talvez refletindo a observância repetida do sábado, e não um único dia de sábado.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέστη
  choice: se levantou
  rationale: Expressa naturalmente a ação de Judith ao erguer-se depois de estar prostrada.
- source_word: ἀπὸ τῆς πτώσεως
  choice: de sua prostração
  rationale: Embora πτῶσις possa significar uma queda, o contexto imediato de oração favorece a postura corporal de prostração.
- source_word: ἐκάλεσεν τὴν Ἄβραν αὐτῆς
  choice: chamou Abra
  rationale: O grego apresenta Ἄβρα como nome próprio; evita-se acrescentar no texto principal uma designação funcional que não está expressa nesta frase.
- source_word: κατέβη εἰς τὸν οἶκον
  choice: desceu à casa
  rationale: Preserva o movimento descendente e, em português corrente, indica adequadamente a ida ao interior da casa.
- source_word: ἐν ᾧ διέτριβεν
  choice: onde costumava ficar
  rationale: O imperfeito sugere permanência habitual ou repetida, sem afirmar que aquela era sua residência permanente.
- source_word: ἐν ταῖς ἡμέραις τῶν σαββάτων
  choice: nos dias de seus sábados
  rationale: Mantém o plural incomum do grego e a referência às ocasiões de observância de Judith.
- source_word: ἐν ταῖς ἑορταῖς αὐτῆς
  choice: em suas festas
  rationale: Festas comunica de modo claro e digno as celebrações religiosas do calendário.
theological_decisions:
- issue: Sentido devocional de ἀπὸ τῆς πτώσεως
  choice: de sua prostração
  alternative: de sua queda
  rationale: O contexto de oração torna provável uma prostração deliberada, mas a alternativa lexical genuína é preservada em nota.
- issue: Plural em τῶν σαββάτων
  choice: seus sábados
  alternative: dias de sábado
  rationale: A tradução conserva o plural e a formulação marcada do texto grego, sem reduzi-la silenciosamente a uma única observância sabática.
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. A construção preserva o caráter narrativo e mantém as ambiguidades lexicais relevantes em notas.
