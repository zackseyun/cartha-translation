  yaml_path: translation/deuterocanon/judith/010/016.yaml
  text: But if you stand before him, do not be afraid in your heart; instead, report according to your words, and he will treat you well.
translation:
  language: pt
  text: Mas, se você estiver diante dele, não tenha medo em seu coração; antes, relate conforme as suas palavras, e ele a tratará bem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ στῇς ἐναντίον αὐτοῦ
  choice: Mas, quando estiver diante dele
  rationale: A construção introduz a situação futura esperada. Em português, “quando” soa mais natural nesse contexto, sem alterar de modo relevante a condição expressa por ἐάν com o subjuntivo.
- source_word: μὴ φοβηθῇς τῇ καρδίᾳ σου
  choice: não tenha medo no coração
  rationale: Preserva a referência explícita ao coração como sede interior do temor e mantém linguagem clara e dignificada.
- source_word: ἀνάγγειλον κατὰ τὰ ῥήματά σου
  choice: Diga-lhe, porém, o que você tem a dizer
  rationale: ἀναγγέλλω significa anunciar, comunicar ou relatar. A expressão κατὰ τὰ ῥήματά σου é incomum e pode indicar falar conforme as palavras ou o plano previamente formulado; esta versão preserva a abertura sem sugerir um relatório formal.
- source_word: εὖ σε ποιήσει
  choice: ele a tratará bem
  rationale: Expressa naturalmente o sentido idiomático de fazer bem a alguém. O pronome feminino explicita em português que a fala é dirigida a Judite.
