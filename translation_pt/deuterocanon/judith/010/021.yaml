  text: And Holofernes was reclining on his bed under the canopy[a], which was woven with purple, gold, emeralds, and costly stones.
translation:
  language: pt
  text: E Holofernes estava reclinado em sua cama, sob o dossel[a], que era tecido com púrpura, ouro, esmeraldas e pedras valiosas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «sob o mosquiteiro» ou «dentro do cortinado da cama»; o termo grego pode designar uma cobertura de rede ou de tecido colocada sobre uma cama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπαυόμενος
  choice: estava reclinado
  rationale: Expressa o repouso de Holofernes sobre a cama e preserva, em português natural, a postura sugerida pelo particípio.
- source_word: κλίνης
  choice: cama
  rationale: Embora κλίνη também possa designar um leito ou divã, o contexto de aposento privado e a cobertura associada favorecem «cama».
- source_word: κωνωπίῳ
  choice: dossel
  rationale: O termo pode indicar mosquiteiro, cortinado ou cobertura de cama. A descrição dos materiais luxuosos favorece «dossel» no texto principal, sem eliminar as alternativas, registradas em nota.
- source_word: πορφύρας
  choice: púrpura
  rationale: Designa material ou tecido púrpura ligado ao luxo; «púrpura» mantém a concisão da enumeração grega.
- source_word: χρυσίου
  choice: ouro
  rationale: É a correspondência direta; «fio de ouro» seria possível pelo contexto da tecelagem, mas acrescentaria uma especificação não expressa.
- source_word: σμαράγδου
  choice: esmeraldas
  rationale: «Esmeraldas» é a identificação tradicional e lexicalmente adequada do material precioso, com plural natural em português na enumeração.
- source_word: λίθων πολυτελῶν
  choice: pedras preciosas
  rationale: Comunica de modo corrente o alto valor e caráter luxuoso das pedras, sem exigir uma classificação gemológica específica.
- source_word: καθυφασμένων
  choice: entretecido de
  rationale: Indica que os materiais mencionados faziam parte do trabalho têxtil. «Entretecido de» preserva essa ideia sem definir a técnica como bordado.
