  verdict: revise
  source_fidelity: 'A tradução acompanha bem a estrutura e os elementos do grego: ἀναπαυόμενος («estava reclinado»), κλίνη («cama») e κωνώπιον («dossel») foram transmitidos de modo fiel. Contudo, «pedras preciosas» pode restringir λίθων πολυτελῶν a uma categoria gemológica, enquanto o grego salienta sobretudo o alto custo/luxo das pedras. «Pedras valiosas» preserva melhor essa amplitude. «Tecido com» também expressa de modo mais idiomático e direto o particípio καθυφασμένων.'
  naturalness: «Estava reclinado» e «sob o dossel» são naturais em registro bíblico moderno. A formulação «era entretecido de» é compreensível, mas menos fluida do que «era tecido com» neste contexto de materiais incorporados ao tecido.
  terminology: «Holofernes», «cama», «dossel», «púrpura», «ouro» e «esmeraldas» são adequados. A nota mantém corretamente a amplitude semântica de κωνώπιον, incluindo as possibilidades de mosquiteiro e cortinado de cama.
