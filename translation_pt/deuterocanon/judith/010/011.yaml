  text: And they were going straight through the courtyard[a], and an Assyrian advance guard met her.
translation:
  language: pt
  text: E elas seguiam pelo vale em linha reta, e uma guarda avançada dos assírios encontrou-a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz «a encontrou», no singular, embora a oração anterior diga «elas seguiam». O foco da narrativa passa especificamente para Judite.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: seguiam
  rationale: O imperfeito de πορεύομαι apresenta o deslocamento em curso; «seguiam» preserva esse aspecto e soa natural na narrativa.
- source_word: ἐν τῷ αὐλῶνι
  choice: pelo pátio
  rationale: αὐλών designa aqui uma área cercada ou pátio; com verbo de movimento, «pelo pátio» expressa percurso dentro desse espaço.
- source_word: εἰς εὐθεῖαν
  choice: em linha reta
  rationale: A expressão funciona adverbialmente e indica avanço direto, sem desvio.
- source_word: συνήντησεν
  choice: foi ao encontro
  rationale: O aoristo de συναντάω indica o encontro pontual; «foi ao encontro» comunica naturalmente que a guarda interceptou ou encontrou Judite, sem precisar definir hostilidade.
- source_word: αὐτῇ
  choice: dela
  rationale: O dativo singular refere-se especificamente a Judite, apesar do sujeito plural da oração anterior, preservando a mudança de foco do grego.
- source_word: προφυλακὴ
  choice: guarda avançada
  rationale: προφυλακή pode indicar uma força de vigilância posicionada à frente; «guarda avançada» mantém esse sentido militar sem tratá-la como estrutura fixa.
- source_word: τῶν Ἀσσυρίων
  choice: dos assírios
  rationale: O genitivo identifica a força à qual a guarda pertencia; a construção portuguesa é clara e fiel.
