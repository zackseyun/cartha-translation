    rationale: Embora αὐλών possa ter sentidos ligados a recinto, neste contexto de deslocamento após a descida da montanha o sentido topográfico de «vale»/«depressão» é o mais adequado.
  - severity: low
    issue: «quando» introduz relação temporal não expressa
    rationale: As duas orações são simplesmente coordenadas por καί; a coordenação portuguesa com «e» mantém melhor a progressão narrativa.
  - severity: low
    issue: «foi ao encontro dela» é menos direto que o grego
    rationale: συνήντησεν significa «encontrou» ou «deparou-se com»; «foi ao encontro» pode sugerir uma ação intencional adicional.
  revised_text: E elas seguiam pelo vale em linha reta, e uma guarda avançada dos assírios encontrou-a.[a]
