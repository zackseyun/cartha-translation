  verdict: revise
  source_fidelity: 'É necessária revisão. No contexto de Judite 10, αὐλών designa mais provavelmente um vale, desfiladeiro ou depressão entre montes, e não um pátio: Judite e sua serva acabaram de descer da região montanhosa da cidade. «Vale» preserva o sentido topográfico do grego e o contexto narrativo. A coordenação simples do grego também é melhor mantida sem introduzir «quando». «Encontrou-a» reproduz diretamente συνήντησεν αὐτῇ, sem sugerir uma iniciativa que «foi ao encontro dela» pode acrescentar.'
  naturalness: «E elas seguiam pelo vale em linha reta, e uma guarda avançada dos assírios encontrou-a» é português moderno, claro e narrativo. A repetição de «e» é aceitável e reflete a coordenação do original.
  terminology: «Guarda avançada» é uma boa equivalência para προφυλακή. «Dos assírios» conserva a relação genitiva. «Encontrou-a» deixa explícita e natural a referência singular a Judite, que a nota explica.
