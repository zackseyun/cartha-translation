base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/003.yaml
  text: And she took off the sackcloth that she had been wearing[a], and removed the garments of her widowhood. She washed her body with water and anointed herself with rich perfume, arranged the hair of her head, put a headband on it, and put on her festive garments, with which she used to adorn herself during the days of her husband Manasseh’s life[c][b];
translation:
  language: pt
  text: Ela tirou o pano de saco que vestia e despiu as roupas de sua viuvez. Lavou o corpo com água, ungiu-se com um unguento perfumado e espesso[a], arrumou os cabelos, colocou sobre a cabeça uma faixa[b] e vestiu suas roupas festivas, com as quais costumava se adornar enquanto seu marido Manassés vivia[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com um perfume espesso” ou “com um unguento perfumado rico”. O grego pode indicar um unguento aromático de consistência espessa ou de qualidade rica.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “uma cobertura ornamental para a cabeça” ou “um turbante”. O termo grego não determina com precisão o formato.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “nos dias da vida de seu marido Manassés”.'
    reason: literal_rendering
lexical_decisions:
- source_word: περιείλατο τὸν σάκκον ὃν ἐνεδύκει
  choice: tirou o pano de saco que vestia
  rationale: O verbo no médio indica retirar de si uma peça que estava usando. “Pano de saco” conserva a imagem bíblica e cultural do luto.
- source_word: ἐξεδύσατο τὰ ἱμάτια τῆς χηρεύσεως αὐτῆς
  choice: despiu as roupas de sua viuvez
  rationale: Mantém a formulação concreta do grego e destaca a passagem deliberada das vestes associadas à viuvez para as roupas festivas.
- source_word: περιεκλύσατο τὸ σῶμα ὕδατι
  choice: lavou o corpo com água
  rationale: Tradução direta e natural, sem especificar um modo de banho que o texto não declara.
- source_word: ἔχρισατο μύρῳ παχεῖ
  choice: ungiu-se com um unguento perfumado e espesso
  rationale: Preserva tanto a ação de ungir quanto o caráter aromático de μύρον e a ideia de consistência ou riqueza expressa por παχύς, sem reduzi-la necessariamente a alto custo.
- source_word: διέταξε τὰς τρίχας τῆς κεφαλῆς αὐτῆς
  choice: arrumou os cabelos
  rationale: Expressa de modo natural a ideia de pôr os cabelos em ordem, sem introduzir um método específico, como pentear.
- source_word: ἐπέθετο μίτραν ἐπʼ αὐτῆς
  choice: colocou sobre a cabeça uma faixa
  rationale: μίτρα pode designar uma faixa ou cobertura ornamental para a cabeça. “Faixa” é clara e evita definir em excesso seu formato.
- source_word: τὰ ἱμάτια τῆς εὐφροσύνης αὐτῆς
  choice: suas roupas festivas
  rationale: Comunica que eram roupas ligadas à alegria e à celebração, em contraste com as vestes de viuvez.
- source_word: ἐν αἷς ἐστολίζετο
  choice: com as quais costumava se adornar
  rationale: Conserva o sentido de adornar-se e o aspecto habitual do imperfeito grego.
- source_word: ἐν ταῖς ἡμέραις τῆς ζωῆς τοῦ ἀνδρὸς αὐτῆς Μανασσή
  choice: enquanto seu marido Manassés vivia
  rationale: Formulação portuguesa natural que comunica fielmente o sentido temporal da expressão grega literal.
theological_decisions:
- issue: Imagens de viuvez e luto
  choice: Manter separadamente “pano de saco” e “roupas de sua viuvez”
  alternative: Reduzir ambos a “roupas de luto”
  rationale: O texto enfatiza a mudança visível de Judith, do luto e da condição de viúva para o adorno festivo. A formulação escolhida preserva essa progressão narrativa e social sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha a sequência narrativa do grego, mas evita literalismos pouco naturais. “Viuvez” e “pano de saco” foram preservados por sua importância cultural e narrativa.
