lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: E aconteceu que
  rationale: Preserva a fórmula narrativa característica da Septuaginta em português atual, sem recorrer ao arcaísmo «e sucedeu que».
- source_word: ὡς
  choice: quando
  rationale: Introduz aqui a circunstância temporal e mantém aberta a relação exata entre o término da oração e a ação seguinte.
- source_word: ἐπαύσατο
  choice: parou de
  rationale: Expressa de modo natural e direto a ideia de cessar uma ação em curso.
- source_word: βοῶσα
  choice: clamar
  rationale: Comunica a intensidade de um apelo vocal dirigido a Deus e pertence ao registro bíblico corrente sem soar excessivamente arcaico.
- source_word: πρὸς τὸν θεὸν Ἰσραὴλ
  choice: ao Deus de Israel
  rationale: Reproduz diretamente o título grego e conserva sua ressonância bíblica e pactual.
- source_word: συνετέλεσεν
  choice: terminou
  rationale: Indica que ela levou sua fala ou oração até o fim, em formulação clara e idiomática.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: todas essas palavras
  rationale: Mantém a referência explícita às palavras da oração precedente e segue de perto o grego sem perder a inteligibilidade.
theological_decisions:
- issue: Tradução de θεὸν Ἰσραὴλ
  choice: o Deus de Israel
  alternative: o Deus de Israél / Deus de Israel
  rationale: O artigo pertence à construção grega e a expressão completa conserva o título bíblico tradicional sem introduzir interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «E aconteceu que» preserva deliberadamente o sabor narrativo da Septuaginta. O versículo termina com vírgula porque a oração sintática continua no versículo seguinte.
