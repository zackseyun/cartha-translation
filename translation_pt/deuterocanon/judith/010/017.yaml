  text: And they selected one hundred men from among them, and they escorted her and her maid, and brought them to the tent of Holofernes.
translation:
  language: pt
  text: E escolheram dentre eles cem homens, que escoltaram Judite e sua serva e as levaram à tenda de Holofernes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέλεξαν ἐξ αὐτῶν ἄνδρας ἑκατόν
  choice: escolheram dentre eles cem homens
  rationale: Preserva o sentido deliberado de selecionar cem homens de um grupo maior, em formulação natural e digna.
- source_word: παρέζευξαν
  choice: escoltaram
  rationale: No contexto militar, o verbo indica que os homens foram junto das duas mulheres como acompanhamento oficial; “escoltaram” expressa essa função com clareza.
- source_word: τῇ ἄβρᾳ αὐτῆς
  choice: sua serva
  rationale: ἄβρα designa a criada ou serva pessoal que acompanha Judite. “Serva” é clara em português internacional e conserva a relação de serviço sem soar excessivamente coloquial.
- source_word: ἤγαγον αὐτὰς
  choice: as levaram
  rationale: O verbo ἄγω significa conduzir ou levar; com destino expresso, “as levaram” é a formulação portuguesa mais natural e mantém o objeto feminino plural.
- source_word: ἐπὶ τὴν σκηνὴν Ὀλοφέρνου
  choice: até a tenda de Holofernes
  rationale: σκηνή tem o sentido comum de “tenda”, e a preposição com acusativo aponta para o destino do deslocamento.
theological_decisions: []
translation_notes:
  register: Português moderno, narrativo e digno, com ampla legibilidade brasileira. O nome “Judite” foi explicitado no segundo segmento para evitar a sequência ambígua de pronomes femininos; o grego tem αὐτῇ, cujo referente contextual é Judite. A conjunção inicial καί foi vertida por “Então”, adequada à progressão narrativa.
