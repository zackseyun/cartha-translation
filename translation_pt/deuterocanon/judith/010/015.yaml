base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/015.yaml
  text: And they said to her[a], “You have saved your life by hurrying down into the presence of our lord. And now come to his tent[b], and some from among us will escort you until they hand you over into his hands.”
translation:
  language: pt
  text: 'E disseram a ela: “Você salvou a sua vida[a] ao se apressar em descer à presença do nosso senhor. Agora, venha à tenda dele, e alguns de nós escoltarão você até entregarem você nas mãos dele[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “você salvou a sua alma”; neste contexto, “alma” significa a própria vida.
    reason: lexical_alternative
  - marker: b
    text: “Nas mãos dele” significa sob o poder ou a custódia dele.
    reason: idiom_explanation
lexical_decisions:
- source_word: Σέσωκας τὴν ψυχήν σου
  choice: Você salvou a sua vida
  rationale: O perfeito de σῴζω com ψυχή exprime aqui preservar ou salvar a própria vida. A formulação mantém de modo natural a força do idioma grego.
- source_word: σπεύσασα καταβῆναι
  choice: ao se apressar em descer
  rationale: O particípio indica a circunstância ou o meio pelo qual ela salvou a vida, enquanto καταβῆναι conserva a ideia direcional de descer.
- source_word: εἰς πρόσωπον τοῦ κυρίου ἡμῶν
  choice: à presença do nosso senhor
  rationale: A expressão significa chegar diante de alguém ou à sua presença. Aqui κύριος designa um superior humano, por isso se usa senhor em minúscula.
- source_word: πρόσελθε ἐπὶ τὴν σκηνὴν αὐτοῦ
  choice: venha à tenda dele
  rationale: No contexto militar, σκηνή é uma tenda. A construção portuguesa transmite de maneira direta e natural o imperativo de aproximação.
- source_word: ἀφʼ ἡμῶν προπέμψουσίν σε
  choice: alguns de nós a escoltarão
  rationale: προπέμπω pode significar acompanhar ou escoltar alguém em seu caminho. A expressão ἀφʼ ἡμῶν indica naturalmente pessoas pertencentes ao grupo dos falantes.
- source_word: ἕως παραδῶσίν σε εἰς χεῖρας αὐτοῦ
  choice: até entregarem você nas mãos dele
  rationale: A tradução preserva a imagem concreta do grego e seu sentido de colocar alguém sob o poder ou a custódia de outra pessoa.
theological_decisions:
- issue: Tradução de κύριος como título de um governante humano
  choice: nosso senhor
  alternative: nosso chefe; nosso mestre
  rationale: O referente é um superior humano, não Deus. “Senhor” em minúscula preserva o título social e evita atribuir-lhe sentido divino.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. Mantém o tratamento por “você”, a imagem idiomática das mãos e a distinção contextual entre um senhor humano e o título divino.
