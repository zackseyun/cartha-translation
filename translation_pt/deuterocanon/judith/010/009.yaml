  naturalness: O registro é geralmente claro e digno. «Cumprir o que vocês conversaram comigo» é uma formulação mais natural do que «levar ao cumprimento as palavras que vocês trataram comigo», sem transformar o referente em um plano específico. «Deram ordem aos jovens» é aceitável e preserva o caráter autoritativo.
  terminology: «Portão da cidade», «Ordenem», «jovens» e «para ela» são escolhas adequadas. A formulação final deve manter o plural e a referência deliberadamente não especificada de καθὼς ἐλάλησαν; a nota deve ficar no local a que se refere.
