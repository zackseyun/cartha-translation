base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/009.yaml
  text: And she said to them[a], “Order the gate of the city to be opened for me, and I will go out for the fulfillment of the words that you spoke with me.” So they instructed the young men to open it for her, just as she had said.
translation:
  language: pt
  text: 'E ela lhes disse: “Ordenem que abram para mim o portão da cidade, e eu sairei para cumprir o que vocês conversaram comigo”. Então eles deram ordem aos jovens para que o abrissem para ela, conforme haviam falado[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: “conforme falaram”. A expressão é pouco explícita e pode remeter tanto ao pedido que Judite acabara de fazer quanto ao que eles haviam conversado com ela.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπιτάξατε
  choice: Ordenem
  rationale: Preserva a força do imperativo aoristo dirigido aos líderes, em formulação natural e autoritativa.
- source_word: ἀνοῖξαί μοι τὴν πύλην τῆς πόλεως
  choice: que abram para mim o portão da cidade
  rationale: Reproduz naturalmente em português a construção infinitiva que completa a ordem e mantém explícitos o benefício para Judite e o portão da cidade.
- source_word: ἐξελεύσομαι
  choice: eu sairei
  rationale: Equivalente direto e idiomático do futuro de movimento para fora da cidade.
- source_word: εἰς τελείωσιν τῶν λόγων
  choice: para levar ao cumprimento as palavras
  rationale: Expressa a finalidade e conserva tanto a ideia de conclusão ou cumprimento de τελείωσις quanto a referência lexical a λόγοι, sem reduzir antecipadamente as “palavras” a um plano específico.
- source_word: ὧν ἐλαλήσατε μετʼ ἐμοῦ
  choice: que vocês trataram comigo
  rationale: “Trataram comigo” comunica a interação sugerida por μετʼ ἐμοῦ e, no contexto, o sentido de assuntos conversados, sem apresentar a fala como exclusivamente unilateral.
- source_word: συνέταξαν
  choice: deram ordem
  rationale: Representa a instrução autoritativa dada a subordinados e mantém clara a relação com o pedido anterior.
- source_word: τοῖς νεανίσκοις
  choice: aos jovens
  rationale: Tradução simples e inclusiva no uso corrente para os jovens do sexo masculino referidos no contexto, sem acrescentar que fossem guardas ou servos.
- source_word: ἀνοῖξαι αὐτῇ
  choice: para que o abrissem para ela
  rationale: O pronome retoma naturalmente o portão, enquanto “para ela” preserva o dativo αὐτῇ.
- source_word: καθὼς ἐλάλησαν
  choice: conforme haviam falado
  rationale: Mantém o plural do grego e sua referência menos explícita, evitando a resolução interpretativa para “conforme ela havia dito”.
