    rationale: A forma corrente e lexicalmente estabelecida para o mais alto comandante militar é «comandante-em-chefe».
  - severity: low
    issue: Formulação da nota alternativa
    rationale: «Espírito de vida» não é mais literal que «sopro de vida» para πνεῦμα ζωῆς neste contexto. A nota deve limitar-se à alternativa real para σὰρξ μία ou indicar a formulação integral literal sem trocar indevidamente «sopro» por «espírito».
