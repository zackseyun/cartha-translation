  to: E eu venho à presença de Holofernes, comandante-em-chefe das forças de vocês, para anunciar palavras de verdade. Mostrarei diante dele o caminho pelo qual seguirá e dominará toda a região montanhosa, e não faltará um só corpo dentre os seus homens, nem um sopro de vida.[a]
