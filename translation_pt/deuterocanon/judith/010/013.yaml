base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/013.yaml
  text: And I am coming into the presence of Holofernes[a], the commander-in-chief of your forces, to announce words of truth, and I will show before him the way by which he will go and gain mastery over all the hill country, and not one flesh of his men, nor a breath of life, will be lacking.
translation:
  language: pt
  text: E eu venho à presença de Holofernes, comandante-em-chefe das forças de vocês, para anunciar palavras de verdade. Mostrarei diante dele o caminho pelo qual seguirá e dominará toda a região montanhosa, e não faltará um só corpo dentre os seus homens, nem um sopro de vida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não faltará uma só carne dentre os seus homens, nem um sopro de vida”, preservando a vívida expressão corporal do grego.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ ἔρχομαι
  choice: E eu venho
  rationale: Mantém o presente vívido e a ligação enfática de κἀγώ, sem transformar a direção do movimento em 'vou'.
- source_word: εἰς τὸ πρόσωπον Ὀλοφέρνου
  choice: à presença de Holofernes
  rationale: Expressa naturalmente o idioma grego de comparecer perante alguém, preservando sua concretude.
- source_word: ἀρχιστρατήγου δυνάμεως ὑμῶν
  choice: comandante-chefe das forças de vocês
  rationale: Comunica a posição militar suprema de ἀρχιστράτηγος e o sentido militar de δύναμις em português atual e amplo.
- source_word: τοῦ ἀναγγεῖλαι ῥήματα ἀληθείας
  choice: para anunciar palavras de verdade
  rationale: Conserva a finalidade do infinitivo e o peso solene da construção genitiva.
- source_word: δείξω πρὸ προσώπου αὐτοῦ ὁδὸν
  choice: Mostrarei diante dele o caminho
  rationale: Preserva tanto a imagem concreta de mostrar um caminho quanto a expressão espacial πρὸ προσώπου αὐτοῦ.
- source_word: καθʼ ἣν πορεύσεται
  choice: pelo qual seguirá
  rationale: Verte com clareza a oração relativa que define a rota, sem acrescentar explicitamente a ideia de marcha militar.
- source_word: κυριεύσει πάσης τῆς ὀρινῆς
  choice: dominará toda a região montanhosa
  rationale: No contexto militar, 'dominará' exprime a obtenção de controle; 'região montanhosa' representa o substantivo geográfico ὀρινή.
- source_word: οὐ διαφωνήσει
  choice: não faltará
  rationale: Neste contexto, o verbo indica que nenhum elemento estará ausente ou se perderá, e 'não faltará' mantém esse sentido sem explicá-lo em excesso.
- source_word: σὰρξ μία
  choice: um só corpo
  rationale: A expressão conta pessoas por sua realidade corporal. 'Um só corpo' conserva a imagem somática de σάρξ e soa mais inteligível em português do que 'uma só carne' neste enunciado militar.
- source_word: πνεῦμα ζωῆς
  choice: um sopro de vida
  rationale: Preserva a imagem concreta e vívida do grego, bem como sua possível ressonância de vida ou ser vivente.
theological_decisions:
- issue: Sentido de σάρξ em contexto militar literal
  choice: corpo
  alternative: carne
  rationale: Aqui σάρξ não designa uma natureza moral ou uma categoria paulina, mas a existência corporal dos soldados. 'Corpo' comunica esse sentido literal sem importar uma doutrina alheia ao contexto.
- issue: Relação entre σὰρξ μία e πνεῦμα ζωῆς
  choice: manter as duas imagens coordenadas
  alternative: reduzir ambas a 'nenhum homem perderá a vida'
  rationale: A formulação grega justapõe corpo e sopro de vida de modo retoricamente vívido. A tradução evita eliminar essa tensão por meio de uma paráfrase simplificadora.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismos marcados. A longa frase grega foi dividida em dois períodos para clareza, preservando sua progressão retórica. O marcador da nota foi colocado após toda a expressão que ela esclarece.
