base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/012.yaml
  text: And they seized her and asked her[a], “Who are you, and where are you coming from, and where are you going?” And she said, “I am a daughter of the Hebrews, and I am fleeing from before them[c][b], because they are about to be given over to you for consumption.”
translation:
  language: pt
  text: 'Eles a agarraram e lhe perguntaram: “De que povo você é?[a] De onde vem e para onde vai?” Ela respondeu: “Sou filha dos hebreus[b] e estou fugindo da presença deles, porque estão prestes a ser entregues a vocês para serem devorados.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “De quem você é?”. A pergunta pode indicar pertença étnica ou política.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Sou uma mulher hebreia”. O grego diz literalmente: “Sou filha dos hebreus”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “para devoração”; também pode ser entendido como “para servirem de alimento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέλαβον
  choice: agarraram
  rationale: Expressa que os soldados lançaram mão de Judite fisicamente, preservando a brusquidão da ação sem necessariamente sugerir uma prisão formal.
- source_word: Τίνων εἶ
  choice: De que povo você é?
  rationale: O grego diz literalmente “De quem você é?” e, neste contexto, provavelmente pergunta pela pertença étnica ou política. A formulação escolhida comunica esse sentido com naturalidade, enquanto a nota preserva a forma ambígua do original.
- source_word: πόθεν ἔρχῃ ... ποῦ πορεύῃ
  choice: De onde vem e para onde vai?
  rationale: Reproduz de modo corrente e conciso as duas perguntas direcionais do grego.
- source_word: Θυγάτηρ εἰμὶ τῶν Ἑβραίων
  choice: Sou filha dos hebreus
  rationale: Mantém a imagem familiar e a identificação étnica expressas literalmente por θυγάτηρ, sem reduzi-las apenas a “sou hebreia”.
- source_word: ἀποδιδράσκω ἀπὸ προσώπου αὐτῶν
  choice: estou fugindo da presença deles
  rationale: Preserva tanto o aspecto presente da fuga quanto o idioma vívido “da face/presença deles”, de maneira compreensível em português.
- source_word: μέλλουσιν δόσθαι
  choice: estão prestes a ser entregues
  rationale: Conserva a iminência indicada por μέλλω e a voz passiva de δόσθαι.
- source_word: εἰς κατάβρωμα
  choice: para serem devorados
  rationale: Mantém a imagem forte de algo destinado a ser inteiramente consumido, com expressão natural em português.
theological_decisions:
- issue: Identificação étnica de Judite
  choice: Sou filha dos hebreus
  alternative: Sou uma mulher hebreia
  rationale: A tradução conserva a metáfora familiar e étnica explícita no grego, sem inserir uma interpretação denominacional.
- issue: Referente implícito de “estão prestes a ser entregues”
  choice: os hebreus, retomados por “deles” e pela identificação anterior
  alternative: explicitar “os hebreus estão prestes a ser entregues”
  rationale: O sujeito está implícito no grego e é recuperável pelo contexto; mantê-lo implícito preserva a forma e a tensão do discurso de Judite.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” no diálogo direto, evita construções excessivamente arcaicas e conserva por meio de notas os semitismos e a vivacidade lexical do grego.
