  text: And they reported her to him[a], and he came out into the forecourt[b], with silver lamps going before him.
translation:
  language: pt
  text: E falaram-lhe a respeito dela, e ele saiu para o átrio diante da tenda[a], enquanto lâmpadas de prata[b] iam à sua frente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego indica o espaço diante da tenda principal ou do local de audiência; também poderia ser traduzido por «vestíbulo» ou «parte da frente da tenda».
    reason: lexical_alternative
  - marker: b
    text: Ou «tochas». O termo grego pode ter os dois sentidos, embora a menção à prata favoreça aqui a ideia de luminárias cerimoniais.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνήγγειλαν
  choice: falaram-lhe a respeito
  rationale: Expressa com naturalidade o ato de comunicar ou relatar algo a alguém, sem acrescentar uma formalidade que o contexto não exige.
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Preserva diretamente o movimento do interior para o espaço diante da tenda.
- source_word: προσκήνιον
  choice: átrio diante da tenda
  rationale: No contexto do acampamento, designa o espaço situado diante da tenda principal; a formulação evita o sentido teatral moderno de «palco».
- source_word: λαμπάδες
  choice: lâmpadas
  rationale: O substantivo pode designar lâmpadas ou tochas. A descrição como objetos de prata favorece aqui luminárias cerimoniais, embora a alternativa permaneça possível.
- source_word: ἀργυραῖ
  choice: de prata
  rationale: Traduz de modo direto e idiomático o adjetivo que indica prata ou fabricação em prata.
- source_word: προάγον
  choice: iam à sua frente
  rationale: Reproduz o movimento processional dos objetos levados adiante dele sem explicitar portadores não mencionados no grego.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com coordenação narrativa próxima do grego. A expressão «átrio diante da tenda» esclarece o cenário militar sem recorrer a vocabulário teatral; «enquanto» torna natural a relação simultânea entre a saída e a procissão de luzes.
