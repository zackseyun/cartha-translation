base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/005.yaml
  text: And she gave her maid a skin of wine and a flask of oil[a], and she filled a bag with barley meal and cakes of pressed figs and clean loaves; then she wrapped up all her vessels and placed them on her.
translation:
  language: pt
  text: E deu à sua serva um odre de vinho e um frasco de azeite; encheu uma bolsa com farinha de cevada, uma massa de figos prensados e pães puros[a]. Depois, embrulhou todos os seus recipientes e os pôs sobre ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pães ritualmente puros” ou “pães limpos”. O grego pode indicar alimento preparado de acordo com exigências de pureza.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅβρᾳ
  choice: sua serva
  rationale: O dativo designa a assistente pessoal de Judite. “Serva” é natural no contexto narrativo e não especifica além do texto a condição jurídica da mulher.
- source_word: ἀσκοπυτίνην οἶνον
  choice: um odre de vinho
  rationale: O composto indica um recipiente de couro; “odre de vinho” expressa de modo conciso tanto o recipiente quanto seu conteúdo.
- source_word: καψάκην ἐλαίου
  choice: um frasco de azeite
  rationale: O substantivo denota um recipiente pequeno e portátil. “Frasco” evita precisar material ou formato, e “azeite” é o equivalente culinário natural de ἔλαιον.
- source_word: πῆραν
  choice: uma bolsa
  rationale: Trata-se de uma bolsa ou saco usado por viajantes para levar provisões. “Bolsa” é claro e corrente.
- source_word: ἀλφίτων
  choice: farinha de cevada
  rationale: O plural se refere a grãos moídos, geralmente cevada preparada ou tostada. “Farinha de cevada” comunica o alimento de maneira inteligível, embora o modo exato de preparo não seja explicitado.
- source_word: παλάθης
  choice: uma massa de figos prensados
  rationale: A palavra designa figos comprimidos em uma massa ou bloco. O singular grego favorece um coletivo singular, sem exigir vários bolos.
- source_word: ἄρτων καθαρῶν
  choice: pães puros
  rationale: καθαρός pode indicar pureza ou adequação alimentar, talvez ritual, mas o texto não torna técnico esse sentido. “Puros” conserva a amplitude sem sugerir apenas limpeza física.
- source_word: περιεδίπλωσε
  choice: embrulhou
  rationale: O verbo descreve envolver ou dobrar ao redor; “embrulhou” é idiomático no contexto de preparar os recipientes para transporte.
- source_word: τὰ ἄγγη αὐτῆς
  choice: todos os recipientes
  rationale: ἄγγη é um termo geral para vasos ou recipientes. “Recipientes” é amplo, atual e adequado aos objetos mencionados.
- source_word: ἐπέθηκε αὐτῇ
  choice: os pôs sobre ela
  rationale: O pronome feminino retoma naturalmente a serva. A formulação preserva a ausência, no grego, de indicação específica de costas ou ombros.
theological_decisions:
- issue: Possível sentido ritual de ἄρτων καθαρῶν
  choice: pães puros
  alternative: pães ritualmente puros; pães limpos
  rationale: No contexto das provisões de Judite, o adjetivo pode aludir à observância de normas de pureza alimentar, mas também mantém o sentido mais geral de pureza. A tradução principal preserva essa abertura, e a nota apresenta as possibilidades.
translation_notes:
  register: Português moderno, digno e narrativamente fluente, com ampla legibilidade brasileira. Evitaram-se termos excessivamente técnicos ou arcaicos; manteve-se, porém, a ambiguidade do texto quanto à pureza dos pães e ao lugar exato em que a carga foi posta sobre a serva.
