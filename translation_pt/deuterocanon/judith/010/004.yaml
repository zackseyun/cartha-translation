  yaml_path: translation/deuterocanon/judith/010/004.yaml
  text: And she put sandals on her feet[a], and put on her anklets and bracelets and rings and earrings and all her jewelry; and she made herself very beautiful[b], to deceive the eyes of any men who might see her.
translation:
  language: pt
  text: Ela calçou as sandálias, pôs as tornozeleiras, os braceletes, os anéis, os brincos e todos os seus adornos; e embelezou-se muito para enganar os olhos de todos os homens que a vissem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν σανδάλια εἰς τοὺς πόδας αὐτῆς
  choice: calçou as sandálias
  rationale: Embora ἔλαβεν signifique literalmente «tomou», a expressão descreve o ato de pôr calçados nos pés. «Calçou as sandálias» é natural e preciso em português.
- source_word: περιέθετο
  choice: pôs
  rationale: No contexto de acessórios, o verbo médio descreve Judite colocando os adornos em si mesma; «pôs» evita uma formulação artificial.
- source_word: χλιδῶνας
  choice: tornozeleiras
  rationale: Neste inventário concreto de joias, o termo provavelmente designa ornamentos usados nos tornozelos.
- source_word: ψέλια
  choice: braceletes
  rationale: O termo designa ornamentos dos pulsos ou braços; «braceletes» é corrente e preserva a referência concreta.
- source_word: δακτυλίους
  choice: anéis
  rationale: Equivalente português usual para anéis usados nos dedos.
- source_word: ἐνώτια
  choice: brincos
  rationale: Designa ornamentos das orelhas; «brincos» é a forma natural em português moderno.
- source_word: πάντα τὸν κόσμον αὐτῆς
  choice: todos os seus adornos
  rationale: κόσμος significa aqui ornamentação ou conjunto de enfeites, não «mundo». «Adornos» é mais abrangente que «joias» e preserva a extensão possível do termo.
- source_word: ἐκαλλωπίσατο σφόδρα
  choice: embelezou-se muito
  rationale: Preserva a ação reflexiva de se tornar ou apresentar bela e a intensidade expressa por σφόδρα.
- source_word: εἰς ἀπάτησιν
  choice: para enganar
  rationale: A construção expressa finalidade, e ἀπάτησις denota engano; a tradução mantém explicitamente a estratégia narrada.
- source_word: ὀφθαλμῶν ἀνδρῶν
  choice: os olhos ... dos homens
  rationale: Mantém a imagem explícita dos olhos presente no grego.
- source_word: ὅσοι ἂν ἴδωσιν αὐτήν
  choice: de todos os homens que a vissem
  rationale: A construção indefinida e geral abrange todos os homens que viessem a vê-la; o subjuntivo «vissem» conserva o caráter eventual.
theological_decisions:
- issue: Finalidade moral dos adornos de Judite
  choice: A tradução declara que ela se embelezou para enganar os olhos dos homens que a vissem.
  alternative: Suavizar a finalidade como «atrair» ou «cativar» os olhares.
  rationale: ἀπάτησις expressa engano. Manter «enganar» preserva a tensão moral e narrativa do texto sem a resolver ou atenuar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência de adornos foi mantida concreta, e a coordenação foi levemente enxugada para fluência sem perder nenhum item do grego.
