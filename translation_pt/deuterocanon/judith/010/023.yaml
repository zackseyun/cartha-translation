base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/023.yaml
  text: When Judith came before him and his attendants[a], they all marveled at the beauty of her face; and falling on her face, she bowed down to him, and they raised her up.
translation:
  language: pt
  text: Quando Judite chegou à presença dele e de seus assistentes, todos ficaram admirados com a beleza do rosto dela. Ela se prostrou com o rosto em terra e lhe prestou homenagem[a], e eles a levantaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego também pode significar “adorar”, mas aqui se refere à reverência demonstrada a um governante humano.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πρόσωπον αὐτοῦ ... καὶ τῶν θεραπόντων αὐτοῦ
  choice: à presença dele e de seus assistentes
  rationale: A expressão idiomática indica que Judite entrou na presença dele e dos que o serviam. “Assistentes” preserva o contexto de corte sem sugerir necessariamente escravidão.
- source_word: ἐθαύμασαν
  choice: ficaram admirados
  rationale: Expressa espanto acompanhado de admiração e soa natural no português moderno.
- source_word: κάλλει τοῦ προσώπου
  choice: beleza do rosto dela
  rationale: Mantém a referência explícita do grego ao rosto, em vez de ampliar para a aparência geral.
- source_word: πεσοῦσα ἐπὶ πρόσωπον
  choice: se prostrou com o rosto em terra
  rationale: Reproduz a postura física de cair com o rosto voltado ao chão em sinal de submissão ou reverência.
- source_word: προσεκύνησεν αὐτῷ
  choice: lhe prestou homenagem
  rationale: No contexto de deferência a um governante humano, o verbo designa homenagem ou reverência, embora também possa significar adoração em outros contextos.
- source_word: ἤγειραν αὐτήν
  choice: eles a levantaram
  rationale: Traduz diretamente o verbo e conserva o sujeito plural indefinido, provavelmente os presentes ou assistentes.
theological_decisions:
- issue: Sentido de προσκυνέω diante de um governante humano
  choice: lhe prestou homenagem
  alternative: o adorou; curvou-se diante dele
  rationale: O contexto favorece um gesto de reverência cortesã, não uma afirmação de culto religioso. A nota preserva a amplitude semântica do verbo grego.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “À presença” mantém o cenário cortesão; “rosto em terra” comunica de modo natural a prostração física. O marcador foi colocado junto à expressão que traduz προσκυνέω, à qual a nota se refere.
