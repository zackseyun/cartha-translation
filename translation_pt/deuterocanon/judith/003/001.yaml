  text: 'E enviaram a ele mensageiros com palavras de paz[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «com palavras pacíficas» ou «em termos de paz». A expressão grega λόγοις εἰρηνικοῖς pode indicar uma fala conciliatória ou os termos de uma proposta de paz.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλαν
  choice: enviaram
  rationale: O aoristo ativo de ἀποστέλλω indica simplesmente o ato de enviar; «enviaram» é natural e preserva o aspecto narrativo.
- source_word: πρὸς αὐτόν
  choice: a ele
  rationale: Com verbo de envio, πρὸς seguido de acusativo indica o destinatário; «a ele» expressa isso com clareza.
- source_word: ἀγγέλους
  choice: mensageiros
  rationale: Neste contexto narrativo, designa representantes humanos. «Mensageiros» mantém o sentido amplo sem especificá-los mais precisamente como emissários diplomáticos.
- source_word: λόγοις εἰρηνικοῖς
  choice: com palavras de paz
  rationale: A formulação preserva tanto λόγοις («palavras») como a ideia de paz em εἰρηνικοῖς, deixando em aberto se se trata de linguagem conciliatória ou de uma proposta formal de paz.
- source_word: λέγοντες
  choice: dizendo
  rationale: O particípio presente introduz diretamente o conteúdo da mensagem; «dizendo» reproduz de modo conciso essa função.
