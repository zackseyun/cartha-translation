  yaml_path: translation/deuterocanon/judith/003/009.yaml
  text: And he came to the front of Esdrelon[a], near Dothaia, which is opposite the great ridge of Judea[b],
translation:
  language: pt
  text: E ele chegou diante de Esdrelom[a], perto de Dotaia, que fica defronte da grande serra da Judeia[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à frente de Esdrelom” ou “em frente a Esdrelom”; a expressão grega pode indicar essas relações espaciais próximas.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o grande serrote da Judeia”. Aqui, “serrote” provavelmente é uma imagem para uma serra ou crista montanhosa de contorno dentado.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πρόσωπον
  choice: diante de
  rationale: Com o verbo de movimento ἦλθεν, a expressão indica chegada à frente ou diante de um lugar. “Diante de” preserva a relação espacial e a ambiguidade sem sugerir necessariamente confronto.
- source_word: Ἐσδρηλών
  choice: Esdrelom
  rationale: Translitera a forma grega do topônimo em grafia natural para leitores de língua portuguesa, sem harmonizá-la com Jezreel.
- source_word: πλησίον
  choice: perto de
  rationale: Equivalente corrente e claro para a ideia de proximidade.
- source_word: Δοταίας
  choice: Dotaia
  rationale: Mantém por transliteração a forma grega do topônimo, sem substituí-la pela identificação tradicional Dотã.
- source_word: ἀπέναντι
  choice: defronte de
  rationale: Expressa de modo natural a posição oposta ou voltada para outro ponto e evita repetir “diante de”.
- source_word: πρίονος
  choice: serra
  rationale: Embora o sentido literal seja “serrote”, o contexto topográfico sugere uma elevação serrilhada. “Serra” preserva em português tanto o valor geográfico quanto, de modo indireto, a imagem dentada.
- source_word: τῆς Ἰουδαίας
  choice: da Judeia
  rationale: Forma geográfica consagrada e amplamente compreensível em português.
