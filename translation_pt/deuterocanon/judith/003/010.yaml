base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/003/010.yaml
  text: And they encamped between Gaibai and the city of the Scythians[a], and he was there for a full month[c][b], to gather all the full complement of his forces.
translation:
  language: pt
  text: Eles acamparam entre Gaibai e a cidade dos citas[a], e ele permaneceu ali por um mês inteiro[b], a fim de reunir todo o contingente de suas forças[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Citópolis”; em grego, literalmente, “a cidade dos citas”.
    reason: alternative_reading
  - marker: b
    text: Em grego, “um mês de dias”, expressão idiomática que significa um mês inteiro.
    reason: lexical_alternative
  - marker: c
    text: Ou “todo o equipamento” ou “o efetivo completo”; o termo grego pode indicar aparelhamento militar, número completo ou plena prontidão das forças.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεστρατοπέδευσαν
  choice: acamparam
  rationale: O verbo descreve o estabelecimento de um acampamento militar; “acamparam” é claro, natural e conserva esse sentido no contexto.
- source_word: ἀνὰ μέσον
  choice: entre
  rationale: Diante de dois lugares, “entre” expressa de modo idiomático a relação espacial indicada pelo grego.
- source_word: Γαιβαὶ
  choice: Gaibai
  rationale: Mantém por transliteração a forma do topônimo presente na edição grega, sem identificá-lo com outro lugar de maneira conjectural.
- source_word: Σκυθῶν πόλεως
  choice: a cidade dos citas
  rationale: Traduz de maneira transparente a expressão grega, em vez de substituí-la diretamente pelo topônimo convencional “Citópolis”.
- source_word: ἦν ἐκεῖ
  choice: ele permaneceu ali
  rationale: O verbo está no singular e provavelmente retoma o comandante mencionado no contexto. “Permaneceu” comunica naturalmente a duração indicada pela expressão seguinte, sem mudar o referente para o exército plural.
- source_word: μῆνα ἡμερῶν
  choice: por um mês inteiro
  rationale: A expressão literalmente semelhante a “um mês de dias” é idiomática; “um mês inteiro” transmite em português corrente a duração de um mês completo.
- source_word: συλλέξαι
  choice: a fim de reunir
  rationale: O infinitivo indica finalidade; “reunir” se ajusta ao contexto de concentração de recursos ou efetivos militares.
- source_word: ἀπαρτίαν
  choice: todo o contingente
  rationale: No contexto militar, o termo pode indicar completude, aparelhamento ou efetivo completo. “Todo o contingente” preserva a ideia principal de levar as forças à sua composição plena, enquanto a nota registra a amplitude lexical.
- source_word: δυνάμεως αὐτοῦ
  choice: de suas forças
  rationale: Aqui δύναμις designa forças militares, não poder abstrato; o plural português é natural e mantém maior amplitude do que “exército”.
