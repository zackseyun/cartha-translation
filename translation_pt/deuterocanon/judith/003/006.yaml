  naturalness: «Ele desceu à costa com a sua força militar» é natural em português moderno e permite conservar o verbo singular grego. «Cidades situadas em lugares altos» é claro e idiomático sem transformar a altura em fortificação.
  terminology: «Força militar» e «guarneceu» são adequados ao contexto. «Para uma aliança» mantém o caráter de εἰς συμμαχίαν sem afirmar mais precisamente uma modalidade de recrutamento ou de tratado.
