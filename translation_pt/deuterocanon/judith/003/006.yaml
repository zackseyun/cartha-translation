  yaml_path: translation/deuterocanon/judith/003/006.yaml
  text: And he and his force went down to the coast[a], and he garrisoned the high cities, and they took chosen men from them into alliance.
translation:
  language: pt
  text: Ele desceu à costa com a sua força militar, guarneceu as cidades situadas em lugares altos e eles tomaram, dentre elas, homens escolhidos para uma aliança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «eles tomaram», no plural, embora os verbos anteriores estejam no singular («desceu», «guarneceu»). O plural pode se referir às tropas que agiam sob o comando dele; algumas traduções uniformizam a frase no singular.
    reason: alternative_reading
lexical_decisions:
- source_word: κατέβη
  choice: desceram
  rationale: O aoristo de καταβαίνω indica movimento descendente. O plural em português acomoda naturalmente o sujeito composto «ele e sua força militar», embora o grego tenha verbo singular.
- source_word: παραλίαν
  choice: região costeira
  rationale: παραλία pode designar não só a linha da costa, mas a faixa litorânea; «região costeira» é claro e geograficamente adequado.
- source_word: δύναμις
  choice: força militar
  rationale: No contexto, δύναμις designa uma força armada. O qualificativo «militar» evita que «força» seja entendido como mera capacidade ou poder.
- source_word: ἐφρούρησε
  choice: guarneceu
  rationale: Com cidades como objeto em contexto militar, o verbo expressa a ação de manter sob guarda mediante tropas; «guarneceu» preserva esse sentido.
- source_word: πόλεις τὰς ὑψηλάς
  choice: cidades situadas nas alturas
  rationale: A expressão mantém o sentido topográfico literal de ὑψηλάς sem introduzir a ideia não explícita de fortificação.
- source_word: ἔλαβον
  choice: eles recrutaram
  rationale: A forma grega é plural e deve permanecer visível. Neste contexto, λαμβάνω com homens escolhidos para uma aliança sugere incorporá-los ao contingente; «recrutaram» comunica isso naturalmente.
- source_word: ἐξ αὐτῶν
  choice: dentre elas
  rationale: 'O pronome retoma naturalmente as cidades: homens foram escolhidos dentre suas populações.'
- source_word: ἄνδρας ἐπιλέκτους
  choice: homens escolhidos
  rationale: Tradução direta que conserva tanto a referência masculina de ἄνδρας quanto a ideia de seleção expressa por ἐπιλέκτους.
- source_word: εἰς συμμαχίαν
  choice: como aliados
  rationale: A expressão indica incorporação para cooperação militar. «Como aliados» é idiomático e preserva a relação político-militar sem sugerir necessariamente um tratado formal.
