translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. «Força militar» esclarece o referente contextual; «cidades situadas nas alturas» evita o pouco natural «cidades altas». O marcador [a] foi colocado após a oração a que a nota efetivamente se refere.
