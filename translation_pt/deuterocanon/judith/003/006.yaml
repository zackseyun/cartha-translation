- from: Ele e sua força militar desceram para a região costeira; ele guarneceu as cidades situadas nas alturas, e eles recrutaram dentre elas homens escolhidos como aliados.[a]
  to: Ele desceu à costa com a sua força militar, guarneceu as cidades situadas em lugares altos e eles tomaram, dentre elas, homens escolhidos para uma aliança.[a]
  rationale: A revisão conserva o singular dos dois primeiros verbos gregos, mantendo «ele» como sujeito e apresentando a força como seu acompanhamento. Substitui-se «recrutaram» por «tomaram», equivalente menos interpretativo de ἔλαβον, e mantém-se explícito o plural final por meio da nota. A formulação topográfica continua a refletir ὑψηλάς sem importar a noção de cidades fortificadas.
