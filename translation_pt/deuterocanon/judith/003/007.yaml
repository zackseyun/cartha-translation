  text: And they themselves, and all their surrounding region, received him with garlands and dances and tambourines.
translation:
  language: pt
  text: E eles mesmos, bem como toda a região ao redor deles, o receberam[a] com grinaldas[b], danças e tamborins.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “acolheram”. O verbo grego pode significar tanto “receber” como, neste contexto, “acolher”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “guirlandas”. O termo grego se refere aqui a ornamentos festivos, não necessariamente a coroas reais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξαντο
  choice: receberam
  rationale: Preserva o sentido básico de δέχομαι e, no contexto da recepção cerimonial, comunica naturalmente a ideia de acolhimento sem eliminar a alternativa lexical.
- source_word: αὐτὸν
  choice: o
  rationale: Pronome objeto que retoma Holofernes no contexto.
- source_word: αὐτοὶ
  choice: eles mesmos
  rationale: Mantém a ênfase do pronome grego explícito.
- source_word: πᾶσα ἡ περίχωρος αὐτῶν
  choice: toda a região ao redor deles
  rationale: Expressa o conjunto da área circunvizinha e preserva a relação indicada por αὐτῶν em português natural.
- source_word: μετὰ στεφάνων
  choice: com grinaldas
  rationale: No cenário festivo, στέφανοι designa mais provavelmente ornamentos em forma de coroas ou guirlandas do que coroas reais.
- source_word: χορῶν
  choice: danças
  rationale: Comunica de modo claro a atividade festiva, sem especificar indevidamente coros ou grupos de dançarinos.
- source_word: τυμπάνων
  choice: tamborins
  rationale: τύμπανον refere-se a um instrumento de percussão manual semelhante a tamborim ou pandeiro; 'tamborins' mantém a imagem festiva e é amplamente compreensível.
