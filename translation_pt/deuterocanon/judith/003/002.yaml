  text: Look[a], we, the servants of Nebuchodonosor the great king, lie before you[b]; deal with us as is pleasing in your sight.
translation:
  language: pt
  text: 'Veja: nós, servos de Nabucodonosor, o grande rei, estamos diante de você; faça conosco o que for do seu agrado.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Vejam
  rationale: Partícula que chama a atenção dos destinatários. “Vejam” conserva essa função em português atual, sem o tom arcaico de “Eis”.
- source_word: παῖδες
  choice: servos
  rationale: Neste apelo formal, designa subordinados que se apresentam com deferência como servidores do rei; “servos” evita tanto a ideia de idade de “meninos” quanto uma especificação indevida de escravidão.
- source_word: Ναβουχοδονοσὸρ
  choice: Nabucodonosor
  rationale: Forma portuguesa tradicional que corresponde de perto ao nome grego Ναβουχοδονοσόρ e é amplamente reconhecível.
- source_word: βασιλέως μεγάλου
  choice: o grande rei
  rationale: Preserva o valor honorífico de μεγάλου como parte da designação régia.
- source_word: παρακείμεθα ἐνώπιόν σου
  choice: estamos prostrados diante de você
  rationale: A forma verbal indica estar posto ou jazer diante de alguém; no contexto de rendição, “estamos prostrados” comunica naturalmente a postura de submissão sem reduzir a expressão à mera presença.
- source_word: χρῆσαι ἡμῖν
  choice: faça conosco
  rationale: χράομαι com dativo pode exprimir o modo de lidar ou proceder com alguém. “Faça conosco” se integra naturalmente à oração seguinte e mantém aberta a amplitude da disposição solicitada.
- source_word: καθὼς ἀρεστόν ἐστιν τῷ προσώπῳ σου
  choice: o que for do seu agrado
  rationale: Expressa em português corrente o sentido do idiomatismo grego, literalmente aquilo que é agradável diante da face do destinatário.
