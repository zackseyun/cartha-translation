  text: Look[a], our homesteads and every field of wheat and the flocks and the herds and all the enclosures of our tents lie before you[b]; use them as pleases you.
translation:
  language: pt
  text: 'Eis[a]: nossas propriedades rurais, todos os campos de trigo, os rebanhos, as manadas e todos os cercados de nossas tendas estão diante de você[b]. Use-os como quiser.'
  philosophy: optimal-equivalence
  footnotes:
