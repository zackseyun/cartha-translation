lexical_decisions:
- source_word: ἰδοὺ
  choice: Eis
  rationale: Preserva a força dêitica e enfática do grego em forma breve, digna e ainda corrente no registro bíblico português.
- source_word: ἐπαύλεις
  choice: propriedades rurais
  rationale: Expressa residências ou estabelecimentos situados no campo, em harmonia com o contexto agrícola, sem limitar o referente apenas a casas.
- source_word: πᾶν πεδίον πυρῶν
  choice: todos os campos de trigo
  rationale: Traduz o sentido de terras cultivadas com trigo; o plural idiomático em português representa naturalmente a totalidade distributiva do grego.
- source_word: ποίμνια
  choice: rebanhos
  rationale: Termo coletivo natural para ovelhas e cabras, contrastando adequadamente com o gado bovino mencionado em seguida.
- source_word: βουκόλια
  choice: manadas
  rationale: Mantém o caráter coletivo dos grupos de bovinos e forma um par natural com 'rebanhos'.
- source_word: μάνδραι
  choice: cercados
  rationale: Conserva o sentido geral de espaços delimitados ou recintos, sem especificar indevidamente sua função.
- source_word: τῶν σκηνῶν ἡμῶν
  choice: de nossas tendas
  rationale: Mantém a imagem literal das tendas, embora a expressão completa possa aludir às áreas delimitadas vinculadas ao acampamento ou ao gado.
- source_word: παράκεινται πρὸ προσώπου σου
  choice: estão diante de você
  rationale: Preserva a metáfora espacial e comunica que os bens se encontram presentes e à disposição do destinatário.
- source_word: χρῆσαι
  choice: Use-os
  rationale: Verte a ordem ou permissão para fazer uso dos bens enumerados; o pronome explicita em português o objeto subentendido no grego.
- source_word: καθʼ ὃ ἂν ἀρέσκῃ σοι
  choice: como lhe agradar
  rationale: Comunica de modo natural a plena liberdade do destinatário segundo sua preferência, preservando o tom deferente.
