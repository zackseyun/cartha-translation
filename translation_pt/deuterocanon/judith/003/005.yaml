  text: And the men came to Holofernes and reported to him according to these words[a].
translation:
  language: pt
  text: E os homens foram até Holofernes e lhe relataram nesses termos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «segundo estas palavras». A expressão remete aos termos da mensagem imediatamente anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεγένοντο
  choice: foram até
  rationale: No contexto narrativo, expressa de modo natural que os homens se dirigiram a Holofernes; evita a possível impressão, causada por «vieram», de movimento em direção ao narrador.
- source_word: οἱ ἄνδρες
  choice: os homens
  rationale: Tradução direta do masculino plural, retomando os homens enviados anteriormente.
- source_word: ἀπήγγειλαν
  choice: relataram
  rationale: O verbo indica transmitir ou comunicar uma mensagem; «relataram» se ajusta ao contexto de mensageiros e mantém um registro digno e corrente.
- source_word: κατὰ τὰ ῥήματα ταῦτα
  choice: tudo com estas palavras
  rationale: Preserva a referência às palavras precedentes e comunica idiomaticamente que o relato correspondeu ao que acabara de ser dito. «Tudo» explicita o conteúdo comunicado sem alterar o referente da expressão grega.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A colocação pronominal em «lhe relataram» é corrente, e «foram até» torna explícita a direção do movimento no contexto.
