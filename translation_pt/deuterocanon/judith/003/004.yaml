base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/003/004.yaml
  text: Look[a], our cities also, and those who live in them, are your slaves; come and deal with them as is good in your eyes.
translation:
  language: pt
  text: Eis que tanto nossas cidades como os que nelas habitam são seus escravos.[a] Venha e faça com elas o que for bom aos seus olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “servos”. A palavra grega pode ser traduzida de ambas as formas, mas aqui provavelmente enfatiza a sujeição resultante da conquista.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Vejam
  rationale: Introduz enfaticamente aquilo que os interlocutores apresentam a Holofernes. O plural se ajusta ao grupo que fala no contexto e soa natural em português moderno.
- source_word: πόλεις
  choice: cidades
  rationale: É o sentido direto do substantivo para centros urbanos e preserva a referência coletiva.
- source_word: οἱ κατοικοῦντες ἐν αὐταῖς
  choice: os que nelas moram
  rationale: Reproduz de modo natural a ideia verbal do particípio e mantém claro que se trata dos habitantes das cidades.
- source_word: δοῦλοί
  choice: escravos
  rationale: No contexto de rendição a um conquistador, o termo expressa sujeição total; 'servos' poderia suavizar indevidamente essa força.
- source_word: ἐλθὼν ἀπάντησον αὐταῖς
  choice: Venha e faça com eles
  rationale: O particípio ligado ao imperativo é expresso naturalmente por dois verbos coordenados. Aqui ἀπαντάω tem força contextual de agir ou proceder para com as cidades e seus habitantes, sem especificar o modo.
- source_word: ὡς ἔστιν ἀγαθὸν ἐν ὀφθαλμοῖς σου
  choice: o que parecer bom aos seus olhos
  rationale: Preserva a imagem idiomática do grego e comunica que Holofernes pode agir segundo seu próprio juízo ou vontade.
theological_decisions:
- issue: Sentido de δοῦλοι em um contexto de submissão política
  choice: escravos
  alternative: servos
  rationale: A oferta é de rendição incondicional das cidades e de seus habitantes a uma potência conquistadora. 'Escravos' mantém saliente a sujeição coercitiva, enquanto a nota registra a alternativa lexical genuína.
- issue: Referente pronominal de αὐταῖς após cidades e habitantes
  choice: com eles
  alternative: com elas
  rationale: Embora a forma grega seja feminina plural e retome gramaticalmente 'cidades', o conteúdo inclui também seus habitantes. Em português, 'com eles' pode abranger o conjunto recém-mencionado sem restringir a ação apenas às cidades.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Conserva-se a expressão bíblica 'aos seus olhos', suficientemente transparente no contexto. O tratamento de Holofernes usa formas de terceira pessoa ('seus', 'Venha'), evitando regionalismo excessivo.
