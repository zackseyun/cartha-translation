base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/003/008.yaml
  text: And he tore down all their borders and cut down their sacred groves; and it had been granted to him to destroy all the gods of the land, so that all the nations might worship him alone—Nebuchadnezzar—and that all their tongues and all their tribes might call on him as god.
translation:
  language: pt
  text: E ele destruiu todas as suas fronteiras e cortou os seus bosques sagrados; e lhe havia sido concedido destruir todos os deuses da terra, para que todas as nações adorassem somente a ele — Nabucodonosor —, e para que todas as línguas e todas as tribos deles o invocassem como deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅρια
  choice: santuários
  rationale: No contexto imediato, em paralelo com os bosques sagrados e a destruição dos deuses, o termo provavelmente designa estruturas ou recintos de culto, não fronteiras políticas; 'santuários' comunica essa referência contextual em português corrente.
- source_word: ἄλση
  choice: bosques sagrados
  rationale: Ἄλσος pode indicar um bosque ligado ao culto; o qualificativo explicita a função religiosa exigida pelo contexto.
- source_word: τῆς γῆς
  choice: da terra
  rationale: Preserva a formulação abrangente do grego sem restringi-la indevidamente a uma região específica.
- source_word: λατρεύσωσι
  choice: adorassem
  rationale: O verbo indica serviço ou culto religioso; 'adorassem' expressa naturalmente a pretensão de culto exclusivo a Nabucodonosor.
- source_word: γλῶσσαι
  choice: línguas
  rationale: Mantém a imagem literal do grego, que pode representar grupos linguísticos ou povos de diferentes idiomas.
- source_word: ἐπικαλέσωνται αὐτὸν εἰς θεόν
  choice: o invocassem como deus
  rationale: Reproduz a ação cultual de invocar e a atribuição explícita de condição divina, sem suavizar a tensão teológica.
theological_decisions:
- issue: Atribuição de divindade a Nabucodonosor
  choice: o invocassem como deus
  alternative: o reconhecessem como deus
  rationale: A tradução preserva a pretensão idólatra apresentada pela narrativa e o sentido cultual de ἐπικαλέομαι, sem endossá-la nem reinterpretá-la.
- issue: Referente de αὐτῷ μόνῳ com aposição τῷ Ναβουχοδονοσόρ
  choice: somente a ele — Nabucodonosor —
  alternative: somente a Nabucodonosor
  rationale: Mantém a ênfase pronominal e torna explícita a aposição do nome, refletindo a ordem e o destaque do grego.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima da estrutura grega. Mantém a repetição enfática de 'todas' e o paralelismo entre nações, línguas e tribos. A pontuação com travessões destaca a aposição 'Nabucodonosor' sem eliminar a ênfase do pronome.
