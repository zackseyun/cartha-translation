  text: And Judith said[a], “I will drink now, my lord, because my life has been magnified within me today beyond all the days since my birth.”
translation:
  language: pt
  text: 'E Judite disse: “Beberei agora, meu senhor, porque hoje a minha vida foi engrandecida em mim[a], mais do que em qualquer outro dia desde o meu nascimento.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “hoje o meu viver se tornou grande em mim, mais do que em qualquer outro dia desde o meu nascimento”.'
    reason: Alternativa lexical que torna mais explícito o infinitivo articular τὸ ζῆν μου e oferece outra representação possível de ἐμεγαλύνθη.
lexical_decisions:
- source_word: Πίομαι
  choice: Beberei
  rationale: O futuro médio de πίνω expressa aqui a resposta voluntária de Judite ao convite para beber. “Beberei” conserva diretamente o valor futuro e volitivo.
- source_word: δή
  choice: agora
  rationale: A partícula acrescenta imediatismo ou leve ênfase; “agora” é natural no discurso direto.
- source_word: κύριε
  choice: meu senhor
  rationale: Forma vocativa de tratamento respeitoso dirigida a Holofernes. “Meu senhor” preserva a deferência sem sugerir necessariamente um título divino.
- source_word: ἐμεγαλύνθη
  choice: foi engrandecida
  rationale: O aoristo passivo de μεγαλύνω significa literalmente “foi feita grande” ou “foi engrandecida”. A escolha mantém a linguagem elevada e a metáfora, sem reduzi-la a felicidade ou prosperidade.
- source_word: τὸ ζῆν μου
  choice: a minha vida
  rationale: O infinitivo articular significa literalmente “o meu viver”; “a minha vida” comunica o sentido de modo idiomático em português.
- source_word: ἐν ἐμοὶ
  choice: dentro de mim
  rationale: A expressão preposicional é mantida para preservar a dimensão interior e pessoal da afirmação.
- source_word: σήμερον
  choice: hoje
  rationale: Equivalente temporal direto e corrente.
- source_word: παρὰ πάσας τὰς ἡμέρας
  choice: mais do que em todos os dias
  rationale: παρά com acusativo tem valor comparativo. A formulação preserva essa comparação em português natural.
- source_word: τῆς γενέσεώς μου
  choice: desde o meu nascimento
  rationale: γένεσις refere-se aqui ao nascimento ou origem; “desde o meu nascimento” explicita naturalmente o sentido temporal da expressão.
theological_decisions:
- issue: Sentido da afirmação de que a vida de Judite foi engrandecida
  choice: 'Manter a expressão elevada e relativamente literal: “a minha vida foi engrandecida dentro de mim”.'
  alternative: Parafrasear como “nunca me senti tão viva” ou “minha vida prosperou hoje mais do que nunca”.
  rationale: O grego emprega μεγαλύνω com τὸ ζῆν μου numa formulação retoricamente intensa. A tradução conserva a metáfora e sua ambiguidade, sem a reduzir a uma simples declaração de alegria, vitalidade ou prosperidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem de “hoje” foi ajustada para maior fluidez, enquanto “foi engrandecida dentro de mim” mantém deliberadamente o caráter elevado e incomum do original.
