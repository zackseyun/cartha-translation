revisions:
- from: 'E Judite disse: “Beberei agora, meu senhor, porque hoje a minha vida foi engrandecida dentro de mim[a], mais do que em todos os dias desde o meu nascimento.”'
  to: 'E Judite disse: “Beberei agora, meu senhor, porque hoje a minha vida foi engrandecida em mim[a], mais do que em qualquer outro dia desde o meu nascimento.”'
  rationale: A revisão troca «dentro de mim» por «em mim» para um português moderno mais natural, sem omitir a expressão ἐν ἐμοί. Também substitui a comparação calcada «em todos os dias» por «em qualquer outro dia», que comunica de modo idiomático que o dia presente supera cada dia desde o nascimento. A voz passiva elevada de «foi engrandecida» e a ambiguidade retórica do original são mantidas.
