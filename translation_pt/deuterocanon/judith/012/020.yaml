base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/020.yaml
  text: And Holofernes was delighted with her[a], and he drank a very great amount of wine—as much as he had never drunk in a single day since he was born.
translation:
  language: pt
  text: E Holofernes alegrou-se por causa dela[a] e bebeu uma quantidade enorme de vinho — tanto quanto jamais havia bebido em um só dia desde que nasceu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por ela”. A expressão grega pode apresentar Judite como a fonte, a causa ou a ocasião da alegria de Holofernes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠυφράνθη
  choice: ficou encantado
  rationale: A forma verbal indica que Holofernes se alegrou ou sentiu grande prazer; “ficou encantado” expressa naturalmente essa reação emocional sem acrescentar uma interpretação específica.
- source_word: ἀπʼ αὐτῆς
  choice: com ela
  rationale: 'A preposição ἀπό indica aqui origem ou causa: Judite foi a causa ou ocasião da satisfação dele. “Com ela” é natural em português, enquanto a nota preserva alternativas mais explícitas.'
- source_word: ἔπιεν οἶνον πολὺν σφόδρα
  choice: bebeu uma quantidade enorme de vinho
  rationale: πολὺν σφόδρα intensifica fortemente a quantidade; esta formulação comunica com clareza o excesso enfatizado pelo grego.
- source_word: ὅσον οὐκ ἔπιεν πώποτε
  choice: tanto quanto nunca havia bebido
  rationale: Mantém a comparação quantitativa introduzida por ὅσον e a afirmação negativa com πώποτε, sem convertê-la desnecessariamente em “mais do que”.
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: em um só dia
  rationale: Reproduz a delimitação temporal e a ênfase em um único dia de modo corrente e claro.
- source_word: ἀφʼ οὗ ἐγεννήθη
  choice: desde que nasceu
  rationale: Expressa naturalmente o período completo desde o nascimento de Holofernes até aquele momento.
