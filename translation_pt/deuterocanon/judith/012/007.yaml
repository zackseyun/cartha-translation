base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/007.yaml
  text: And Holofernes ordered the bodyguards not to hinder her[a]. So she remained in the camp for three days, and went out at night into the valley of Bethulia[b], and washed herself at the spring of water by the camp.
translation:
  language: pt
  text: Holofernes ordenou aos guarda-costas que não a impedissem. Ela permaneceu no acampamento por três dias; todas as noites, saía para o vale[a] de Betúlia e se banhava[b] na fonte de água junto ao acampamento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ravina” ou “desfiladeiro”.
    reason: lexical_alternative
  - marker: b
    text: O verbo grego pertence à mesma família da palavra mais tarde usada para “batizar”; aqui significa banhar-se ou lavar-se, não receber o batismo cristão.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέταξεν
  choice: ordenou
  rationale: Preserva de modo natural e direto a força de uma ordem dada por alguém em posição de autoridade.
- source_word: σωματοφύλαξι
  choice: guarda-costas
  rationale: O composto grego designa guardas pessoais; “guarda-costas” é o equivalente moderno mais preciso e corrente.
- source_word: μὴ διακωλύειν αὐτήν
  choice: que não a impedissem
  rationale: Expressa com clareza a proibição de interferir nos movimentos de Judite.
- source_word: παρέμεινεν ἐν τῇ παρεμβολῇ
  choice: permaneceu no acampamento
  rationale: “Acampamento” corresponde ao contexto militar de παρεμβολή, e “permaneceu” conserva o fluxo narrativo.
- source_word: ἡμέρας τρεῖς
  choice: por três dias
  rationale: A preposição “por” explicita naturalmente em português a duração indicada pelo acusativo grego.
- source_word: ἐξεπορεύετο κατὰ νύκτα
  choice: todas as noites, saía
  rationale: O imperfeito ἐξεπορεύετο, no período de três dias, favorece uma ação habitual ou repetida; “todas as noites” torna essa nuance clara sem alterar o sentido.
- source_word: φάραγγα
  choice: vale
  rationale: É uma tradução ampla e compreensível do acidente geográfico, enquanto a nota preserva as opções mais estreitas “ravina” e “desfiladeiro”.
- source_word: Βαιτυλοῦα
  choice: Betúlia
  rationale: Emprega a forma portuguesa tradicional e reconhecível do topônimo.
- source_word: ἐβαπτίζετο
  choice: se banhava
  rationale: No contexto de uma fonte de água, comunica naturalmente a ação física de lavar ou mergulhar o corpo, sem introduzir a associação técnica posterior com o batismo cristão.
- source_word: ἐπὶ τῆς πηγῆς τοῦ ὕδατος
  choice: na fonte de água
  rationale: Reproduz de maneira inteligível a referência à nascente ou fonte onde ocorria o banho.
theological_decisions:
- issue: Sentido de ἐβαπτίζετο fora de um contexto cristão
  choice: se banhava
  alternative: mergulhava-se; lavava-se
  rationale: O verbo pode indicar imersão ou lavagem. O contexto descreve o banho de Judite numa fonte, e não autoriza importar para a cena o sentido técnico de batismo cristão.
- issue: Possível caráter ritual da lavagem
  choice: não explicitar purificação ritual no texto principal
  alternative: purificava-se por meio de um banho
  rationale: Embora o contexto mais amplo possa sugerir preocupação com pureza, este versículo descreve a ação sem nomeá-la explicitamente como rito de purificação; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa fluida. O valor iterativo do imperfeito grego foi expresso por “todas as noites”. Os marcadores [a] e [b] foram posicionados junto aos termos a que suas notas efetivamente se referem.
