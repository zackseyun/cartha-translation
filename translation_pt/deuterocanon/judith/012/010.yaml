base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/010.yaml
  text: And on the fourth day[a], Holofernes gave a banquet for his slaves alone[b], and he did not invite any of those in attendance.
translation:
  language: pt
  text: No quarto dia, Holofernes ofereceu um banquete somente para os seus escravos[a] e não convidou para a ocasião nenhum dos encarregados dos serviços[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos”. O grego usa δοῦλος, termo que pode designar um escravo ou um servo, conforme o contexto; “escravos” preserva aqui a condição de sujeição sugerida pela palavra.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega é idiomática e provavelmente se refere aos que estavam ocupados com tarefas práticas ou deveres oficiais; também poderia ser traduzida por “nenhum dos assistentes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῇ ἡμέρᾳ τῇ τετάρτῃ
  choice: No quarto dia
  rationale: A expressão idiomática introduz um marco temporal na narrativa; esta forma é natural em português e conserva o sentido.
- source_word: ἐποίησεν ... πότον
  choice: ofereceu um banquete
  rationale: πότος designa uma festa marcada por bebida. “Ofereceu um banquete” comunica de modo natural que Holofernes promoveu e custeou a ocasião, sem reduzir o evento a uma simples bebedeira.
- source_word: τοῖς δούλοις αὐτοῦ
  choice: para os seus escravos
  rationale: δοῦλος pode, conforme o contexto, ser traduzido por “escravo” ou “servo”; “escravos” preserva aqui a condição subordinada e vinculada expressa pelo termo grego.
- source_word: μόνοις
  choice: somente
  rationale: O termo restringe a lista de participantes aos escravos de Holofernes.
- source_word: οὐκ ἐκάλεσεν
  choice: não convidou
  rationale: No contexto de um banquete, “convidou” expressa naturalmente o ato de chamar alguém para participar.
- source_word: εἰς τὴν χρῆσιν
  choice: para a ocasião
  rationale: χρῆσις pode indicar uso, função ou serviço; neste contexto, a expressão parece apontar para a participação no evento, mas “ocasião” evita definir com precisão indevida a relação sintática e social.
- source_word: οὐδένα τῶν πρὸς ταῖς χρείαις
  choice: nenhum dos encarregados dos serviços
  rationale: A expressão refere-se provavelmente a pessoas ocupadas com tarefas práticas ou deveres oficiais. A tradução mantém a ligação lexical com χρεία sem especificar cargos não indicados pelo texto.
