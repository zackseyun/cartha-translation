  yaml_path: translation/deuterocanon/judith/012/004.yaml
  text: And Judith said to him[a], “As your life lives, my lord[c][b], your slave will not use up what is with me until he has accomplished by my hand what he has planned.”
translation:
  language: pt
  text: 'Então Judite lhe disse: “Por sua vida, meu senhor,[a] sua escrava não consumirá o que tenho comigo[b] até que ele realize, por minha mão, o que planejou.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Vive a sua alma”. Trata-se de uma fórmula de juramento, equivalente a “Tão certo como você vive, meu senhor”.
    reason: lexical_alternative
  - marker: b
    text: “O que tenho comigo” provavelmente se refere às provisões ou aos alimentos que Judite havia levado.
    reason: lexical_alternative
  - marker: c
    text: O sujeito de “realize” e “planejou” não está expresso no grego; pelo contexto, a referência mais natural é a Deus, que agiria por meio de Judite.
    reason: alternative_reading
lexical_decisions:
- source_word: Ζῇ ἡ ψυχή σου
  choice: Por sua vida
  rationale: É uma fórmula de juramento que significa, em uso, “tão certo como você vive”. A forma escolhida é natural em português e mantém a referência enfática à vida do interlocutor; a construção grega literal é registrada em nota.
- source_word: κύριέ μου
  choice: meu senhor
  rationale: É um tratamento respeitoso dirigido a Holofernes, não um título divino. “Meu senhor” conserva o tom cortês e hierárquico do contexto.
- source_word: ἡ δούλη σου
  choice: sua escrava
  rationale: O substantivo δούλη é a forma feminina de um termo que designa escravidão ou sujeição. “Escrava” preserva sua força social, ainda que aqui Judite o use como autodesignação deferente.
- source_word: οὐ δαπανήσει
  choice: não consumirá
  rationale: O verbo pode significar gastar, despender ou esgotar. Como o objeto provavelmente são provisões, “consumirá” comunica adequadamente o uso dos mantimentos sem introduzir sentido financeiro.
- source_word: τὰ ὄντα μετʼ ἐμοῦ
  choice: o que tenho comigo
  rationale: A expressão significa literalmente “as coisas que estão comigo”. A formulação escolhida é natural e preserva a generalidade do grego, enquanto a nota esclarece a provável referência às provisões de Judite.
- source_word: ἕως ἄν ποιήσῃ
  choice: até que ele realize
  rationale: O verbo ποιέω é amplo, mas neste contexto “realize” expressa o cumprimento de um propósito. O sujeito masculino singular permanece sem identificação explícita, como no grego.
- source_word: ἐν χειρί μου
  choice: por minha mão
  rationale: Mantém a imagem idiomática da mão como meio ou agente, indicando que a ação será realizada por intermédio de Judite.
- source_word: ἃ ἐβουλεύσατο
  choice: o que planejou
  rationale: O verbo indica deliberar, resolver ou planejar. “Planejou” é claro, atual e preserva a ideia de intenção deliberada.
theological_decisions:
- issue: Sujeito implícito de ποιήσῃ e ἐβουλεύσατο
  choice: Mantido como “ele”, sem nomeá-lo no texto principal
  alternative: 'Explicitar “Deus” ou empregar uma construção impessoal: “até que se realize por minha mão o que foi planejado”'
  rationale: As formas verbais gregas têm sujeito implícito no masculino singular. O contexto aponta mais naturalmente para Deus, mas nomeá-lo no texto principal resolveria uma referência que o original deixa implícita. A tradução conserva essa tensão, e a nota oferece a leitura contextual mais provável.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento “meu senhor” preserva a deferência cortesã; “sua escrava” mantém a força social de δούλη. A ordem foi levemente ajustada para fluência, sem eliminar a imagem bíblica “por minha mão” nem explicitar no corpo do texto o sujeito teológico implícito.
