  yaml_path: translation/deuterocanon/judith/012/006.yaml
  text: And she arose toward the morning watch[a], and sent to Holofernes, saying, “Let my lord now give orders to allow your servant to go out for prayer.”
translation:
  language: pt
  text: 'Por volta da vigília da manhã, ela se levantou e mandou dizer a Holofernes: “Que o meu senhor dê ordem para que permitam à sua serva[a] sair para orar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a sua escrava”. A palavra grega está no feminino e pode significar “serva” ou “escrava”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστη
  choice: se levantou
  rationale: Expressa de modo natural o aoristo de ἀνίστημι, que indica que Judite se levantou naquele momento.
- source_word: πρὸς τὴν ἑωθινὴν φυλακήν
  choice: por volta da vigília da manhã
  rationale: Preserva o valor temporal aproximativo de πρὸς e apresenta φυλακή como um período de vigília noturna próximo da manhã.
- source_word: ἀπέστειλεν πρὸς Ὁλοφέρνην λέγουσα
  choice: mandou dizer a Holofernes
  rationale: Torna explícito, em português idiomático, que Judite enviou uma mensagem ou um mensageiro; o particípio λέγουσα introduz o conteúdo comunicado.
- source_word: Ἐπιταξάτω δὴ
  choice: Que ... dê ordem
  rationale: Mantém a força do imperativo na terceira pessoa como pedido deferente para que Holofernes emita uma ordem; o contexto comunica a nuance enfática de δή sem exigir uma partícula artificial.
- source_word: ὁ κύριός μου
  choice: o meu senhor
  rationale: É uma forma respeitosa de se dirigir a um superior humano, sem sugerir aqui um título divino.
- source_word: ἐᾶσαι
  choice: para deixarem
  rationale: Comunica de maneira corrente a permissão que Holofernes deveria ordenar que fosse concedida.
- source_word: τὴν δούλην σου
  choice: a sua serva
  rationale: No contexto, δούλη funciona como autodesignação deferente de Judite diante de uma autoridade; a alternativa literal ligada à escravidão é registrada em nota.
- source_word: ἐπὶ προσευχὴν ἐξελθεῖν
  choice: sair para orar
  rationale: Expressa com clareza o movimento de sair e a finalidade indicada por ἐπὶ προσευχὴν.
theological_decisions:
- issue: Sentido de κύριος aplicado a Holofernes
  choice: o meu senhor
  alternative: o meu amo
  rationale: O referente é um superior humano, e não Deus. A forma escolhida conserva a deferência social sem introduzir conotação divina.
- issue: Sentido de δούλη na autodesignação de Judite
  choice: a sua serva
  alternative: a sua escrava
  rationale: A palavra grega pode designar serva ou escrava. Aqui ela integra uma fórmula de humildade e deferência perante Holofernes; a ambiguidade lexical é preservada por meio da nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A fala de Judite mantém deferência formal sem arcaísmo excessivo.
