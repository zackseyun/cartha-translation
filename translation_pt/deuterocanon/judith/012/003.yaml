  text: And Holofernes said to her[a], “But if the things you have with you run out, from where shall we get for you provisions like them? For there is no one with us from your nation.”
translation:
  language: pt
  text: 'E Holofernes lhe disse: “Mas, se o que você tem consigo se esgotar, de onde traremos para você mantimentos semelhantes aos que você tem consigo?[a] Pois não há entre nós ninguém do seu povo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alimentos” ou “provisões”. Aqui, o grego usa δύναμιν em um sentido contextual incomum, aparentemente referindo-se ao sustento, e não a poder ou força.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκλίπῃ
  choice: acabar
  rationale: O verbo indica faltar, esgotar-se ou chegar ao fim; “acabar” é natural em português para mantimentos levados consigo.
- source_word: τὰ μετὰ σοῦ ὄντα
  choice: o que você trouxe consigo
  rationale: A expressão significa literalmente “as coisas que estão com você”. A tradução mantém certa amplitude, mas explicita de modo natural que se trata do que Judite levou, conforme o contexto.
- source_word: ἐξοίσομεν
  choice: conseguiremos
  rationale: Embora ἐκφέρω tenha o sentido básico de levar ou trazer, aqui a pergunta é de onde poderiam obter para ela recursos equivalentes; “conseguiremos” expressa naturalmente essa função contextual.
- source_word: δύναμιν
  choice: mantimentos
  rationale: δύναμις normalmente significa força ou poder, mas neste contexto incomum parece designar aquilo que a sustentaria, especialmente provisões alimentares. “Mantimentos” comunica o sentido sem limitá-lo a uma refeição pronta.
- source_word: ὁμοίαν αὐτοῖς
  choice: semelhantes
  rationale: Preserva a comparação com as coisas que Judite tinha consigo, com concordância natural em português com “mantimentos”.
- source_word: ἐκ τοῦ ἔθνους σου
  choice: do seu povo
  rationale: ἔθνος designa aqui o grupo étnico de Judite. “Seu povo” é mais natural no contexto e conserva esse sentido, sem sugerir necessariamente um Estado-nação moderno.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” na fala direta e evita rigidez excessiva. A formulação conserva a estranheza lexical de δύναμιν em nota, enquanto o texto principal apresenta o sentido contextual provável.
