base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/008.yaml
  text: And when she went up[a], she was praying to the Lord God of Israel to direct her way for the exaltation of the sons of his people.
translation:
  language: pt
  text: E, quando subiu, ela orava ao Senhor, Deus de Israel, para que dirigisse seu caminho para o reerguimento[a] dos filhos do seu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a exaltação dos filhos do seu povo” ou “para a restauração dos filhos do seu povo”. O substantivo grego é raro e pode indicar que alguém é levantado em posição ou condição, não apenas um movimento físico para cima.
    reason: Registra a amplitude lexical de ἀνάστημα sem fixar uma única interpretação contextual.
lexical_decisions:
- source_word: ἀνέβη
  choice: subiu
  rationale: O aoristo de ἀναβαίνω indica movimento para cima. “Subiu” é natural e preserva a referência espacial sem acrescentar de onde ela saiu.
- source_word: ἐδέετο
  choice: orava
  rationale: Diante de “Senhor, Deus de Israel”, δέομαι descreve oração ou súplica. O imperfeito é expresso naturalmente em português por “orava”, indicando ação em curso.
- source_word: κυρίου θεοῦ Ἰσραήλ
  choice: Senhor, Deus de Israel
  rationale: A aposição com vírgula produz uma fórmula reverente e natural em português, mantendo os dois títulos do grego.
- source_word: κατευθῦναι
  choice: dirigisse
  rationale: O verbo pode significar tornar reto, orientar ou dirigir. “Dirigisse” preserva tanto a imagem do caminho quanto a ideia de condução divina.
- source_word: τὴν ὁδὸν αὐτῆς
  choice: seu caminho
  rationale: ὁδός pode designar o trajeto concreto e, figuradamente, o curso da missão de Judite; “caminho” mantém ambas as possibilidades.
- source_word: εἰς ἀνάστημα
  choice: para o reerguimento
  rationale: O substantivo raro ἀνάστημα sugere elevação ou o ato de levantar alguém de uma condição abatida. “Reerguimento” conserva essa imagem e permite os sentidos contextuais de restauração e exaltação.
- source_word: τῶν υἱῶν τοῦ λαοῦ αὐτοῦ
  choice: dos filhos do seu povo
  rationale: A tradução mantém υἱῶν explicitamente, sem reduzir a expressão apenas a “povo”, e reproduz de modo natural a relação genitiva.
theological_decisions:
- issue: Sentido de ἀνάστημα no propósito da oração
  choice: reerguimento
  alternative: exaltação; restauração
  rationale: O contexto aponta para a recuperação da condição do povo de Israel, mas o substantivo raro não determina se a ênfase está em elevação, restauração ou libertação. A tradução conserva a metáfora e a nota registra a amplitude.
- issue: Tradução de κύριος em uma fórmula judaica de oração
  choice: Senhor
  alternative: SENHOR; Soberano
  rationale: “Senhor, Deus de Israel” é uma forma reverente e transparente de traduzir o título grego sem pressupor uma reconstrução hebraica específica.
- issue: Linguagem masculina em υἱῶν
  choice: filhos
  alternative: descendentes; membros
  rationale: O texto grego emprega explicitamente o plural masculino “filhos”. A tradução o conserva, sem decidir além do texto se a expressão designa homens especificamente ou os integrantes do povo como descendência.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem e as relações sintáticas do grego foram preservadas onde naturais. “Seu” retoma Deus (“seu povo”), como no original; “ela” foi incluído para clareza do sujeito. O marcador da nota foi colocado junto ao sintagma lexicalmente ambíguo.
