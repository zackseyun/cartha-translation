base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/009.yaml
  text: And when she went in[a], she remained in the tent purified until she brought in her food toward evening.
translation:
  language: pt
  text: E, quando entrava, ela permanecia pura[a] na tenda até trazer sua comida, perto do entardecer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “limpa” ou “ritualmente pura”. O adjetivo grego pode indicar pureza em sentido geral ou ritual.
    reason: Alternativa lexical e preservação da ambiguidade do original.
lexical_decisions:
- source_word: εἰσπορευομένη
  choice: quando entrava
  rationale: O particípio presente é expresso temporalmente; o imperfeito da oração principal favorece uma formulação que também permite entender a ação como habitual ou repetida.
- source_word: καθαρά
  choice: pura
  rationale: O adjetivo predicativo descreve o estado de Judite sem afirmar explicitamente que alguém a purificou. “Pura” preserva tanto o sentido geral quanto a possível conotação ritual.
- source_word: παρέμενεν
  choice: permanecia
  rationale: O imperfeito indica uma situação continuada ou repetida; “permanecia” conserva esse aspecto com linguagem natural e digna.
- source_word: τῇ σκηνῇ
  choice: na tenda
  rationale: σκηνή designa diretamente uma tenda no contexto do acampamento.
- source_word: μέχρι οὗ
  choice: até
  rationale: A expressão temporal é vertida de modo conciso e idiomático.
- source_word: προσηνέγκατο
  choice: trazer
  rationale: Neste contexto, προσφέρω indica levar ou trazer algo; “trazer” evita a conotação sacrificial que “oferecer” poderia introduzir.
- source_word: τὴν τροφὴν αὐτῆς
  choice: sua comida
  rationale: A formulação simples preserva o sentido amplo de alimento, sem restringi-lo a uma refeição específica.
- source_word: πρὸς ἑσπέραν
  choice: perto do entardecer
  rationale: A preposição com a expressão temporal indica aproximação do entardecer, nuance que “perto de” conserva.
theological_decisions:
- issue: Se καθαρά deve ser explicitado como pureza ritual no texto principal
  choice: Manter “pura” no texto e registrar a possível conotação ritual em nota
  alternative: “ritualmente pura” ou “limpa”
  rationale: O contexto favorece uma dimensão ritual, mas o adjetivo grego não exige que ela seja explicitada. A tradução preserva a ambiguidade legítima.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição sugerida pelo imperfeito é preservada por “quando entrava” e “permanecia”; evita-se “purificada”, que poderia sugerir mais diretamente uma ação sofrida em vez de um estado.
