base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/001.yaml
  text: And he ordered that she be brought in where his silverware was kept[b][a], and he directed that food be prepared for her from his own dishes and that she drink from his wine.
translation:
  language: pt
  text: Então, ele ordenou que a conduzissem ao lugar onde guardava seus objetos de prata[a] e determinou que lhe servissem alguns de seus pratos preparados[b] e que ela bebesse de seu vinho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seus vasos de prata”. O termo grego pode designar artigos de prata em geral, inclusive recipientes ou utensílios.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “que dispusessem diante dela alguns de seus pratos preparados”. O verbo descreve o ato de pôr ou servir a comida, e o substantivo se refere a pratos preparados ou iguarias.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: ordenou
  rationale: Preserva a força autoritativa de κέλευω e soa natural no português atual.
- source_word: εἰσαγαγεῖν αὐτήν
  choice: que a levassem para o lugar
  rationale: O infinitivo depende de ἐκέλευσεν; a construção deixa claro que servos ou assistentes deveriam conduzir Judite para dentro daquele espaço.
- source_word: οὗ ἔτιθετο
  choice: onde eram guardados
  rationale: O imperfeito exprime aqui a localização habitual dos objetos; 'eram guardados' comunica melhor esse valor contextual do que o literal 'eram colocados'.
- source_word: τὰ ἀργυρώματα αὐτοῦ
  choice: os seus objetos de prata
  rationale: ἀργυρώματα designa artigos feitos de prata sem especificar inequivocamente utensílios de mesa; a escolha preserva essa abrangência lexical.
- source_word: συνέταξεν
  choice: mandou
  rationale: Comunica uma determinação autoritativa e evita repetir imediatamente 'ordenou', usado para ἐκέλευσεν.
- source_word: καταστρῶσαι αὐτῇ
  choice: que lhe servissem
  rationale: No contexto de comida preparada, o verbo indica dispor ou pôr alimentos diante de alguém; 'servissem' é uma equivalência natural em português.
- source_word: ἀπὸ τῶν ὀψοποιημάτων αὐτοῦ
  choice: de suas próprias iguarias
  rationale: ὀψοποιήματα refere-se a alimentos ou pratos preparados. 'Iguarias' mantém a ideia de comida preparada e apropriada ao banquete, enquanto 'próprias' ressalta que provinham das provisões dele.
- source_word: τοῦ οἴνου αὐτοῦ πινεῖν
  choice: que ela bebesse do seu vinho
  rationale: Mantém a continuação da ordem e reproduz naturalmente o partitivo grego, isto é, beber da provisão de vinho pertencente a ele.
