  text: For look[a], it would be shameful for us if we let such a woman go without speaking with her; for if we do not draw her in, she will laugh at us.
translation:
  language: pt
  text: 'Pois vejam: seria uma vergonha para nós deixarmos uma mulher como esta ir embora sem falar com ela. Porque, se não a atrairmos[a], ela rirá de nós.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a seduzirmos” ou “a conquistarmos”. O verbo grego pode significar atrair alguém para si e, neste contexto, provavelmente sugere uma tentativa de atraí-la ou seduzi-la.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Pois vejam
  rationale: Preserva tanto a função explicativa de γάρ quanto a ênfase deíctica de ἰδού, em português natural e atual.
- source_word: αἰσχρὸν τῷ προσώπῳ ἡμῶν
  choice: seria uma vergonha para nós
  rationale: Transmite o sentido idiomático de desonra ou constrangimento que recairia sobre os falantes, evitando o literalismo pouco natural de 'ao nosso rosto'.
- source_word: παρήσομεν
  choice: deixarmos ... ir embora
  rationale: Expressa o sentido contextual de permitir que ela passe ou parta sem abordá-la.
- source_word: οὐχ ὁμιλήσαντες αὐτῇ
  choice: sem falar com ela
  rationale: Vertido de modo direto e natural, mantendo a circunstância de deixá-la partir sem antes entabular conversa.
- source_word: ἐπισπάσωμεθα
  choice: a atrairmos
  rationale: Mantém a ideia de puxá-la para si ou conquistá-la, sem decidir de forma excessivamente específica se se trata de atração, persuasão ou sedução.
- source_word: καταγελάσεται ἡμῶν
  choice: ela rirá de nós
  rationale: Tradução direta que conserva o tom de escárnio e a preocupação dos homens com a própria honra.
