base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/016.yaml
  text: And when she entered[a], Judith reclined, and the heart of Holofernes was beside itself over her; his soul was shaken. He was very eager to have relations with her[b], and he was watching for an opportunity to deceive her from the day he saw her.
translation:
  language: pt
  text: Quando entrou, Judite reclinou-se à mesa[a]. O coração de Holofernes ficou fora de si por causa dela, e sua alma se abalou. Ele desejava ardentemente ter relações com ela e, desde o dia em que a viu, esperava uma oportunidade para enganá-la[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nos banquetes antigos, os participantes costumavam comer reclinados à mesa.
    reason: cultural_note
  - marker: b
    text: Ou “iludi-la”; neste contexto, o engano pode incluir sedução ou manipulação sexual.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: quando entrou
  rationale: O particípio aoristo introduz naturalmente uma ação anterior ou simultânea à principal; a oração temporal preserva a sequência com fluidez em português.
- source_word: ἀνέπεσεν
  choice: reclinou-se à mesa
  rationale: No contexto de banquete, o verbo indica assumir a posição reclinada usada durante a refeição, não simplesmente deitar-se.
- source_word: ἐξέστη ἡ καρδία Ὀλοφέρνου ἐπʼ αὐτῇ
  choice: o coração de Holofernes ficou fora de si por causa dela
  rationale: A formulação conserva a imagem intensa do coração saindo de seu estado normal e identifica Judite como causa da perturbação.
- source_word: ἐσαλεύθη ἡ ψυχὴ αὐτοῦ
  choice: sua alma se abalou
  rationale: Mantém a linguagem antropológica de ψυχή e a força de σαλεύω sem reduzi-la a uma paráfrase meramente psicológica.
- source_word: κατενθύμως σφόδρα
  choice: desejava ardentemente
  rationale: Expressa a forte disposição interior e soa natural e digna em português contemporâneo.
- source_word: τοῦ συγγενέσθαι μετʼ αὐτῆς
  choice: ter relações com ela
  rationale: A expressão funciona aqui como eufemismo sexual; a tradução torna o sentido compreensível sem recorrer a linguagem crua.
- source_word: ἐτήρει καιρόν
  choice: esperava uma oportunidade
  rationale: O imperfeito indica uma busca ou espera continuada por uma ocasião favorável.
- source_word: τοῦ ἀπατῆσαι αὐτήν
  choice: para enganá-la
  rationale: ἀπατάω significa fundamentalmente enganar ou iludir. O contexto pode envolver sedução e manipulação sexual, mas a tradução principal preserva a amplitude lexical.
- source_word: ἀφʼ ἧς ἡμέρας εἶδεν αὐτήν
  choice: desde o dia em que a viu
  rationale: Reproduz de modo direto e idiomático o ponto inicial temporal indicado pelo grego.
theological_decisions:
- issue: Intenção sexual expressa eufemisticamente
  choice: ter relações com ela
  alternative: dormir com ela; unir-se a ela
  rationale: A tradução comunica a intenção sexual sem tornar a expressão mais crua nem mais vaga do que o contexto permite.
- issue: Linguagem antropológica de ψυχή
  choice: sua alma se abalou
  alternative: seu íntimo se agitou; ele ficou profundamente perturbado
  rationale: A manutenção de “alma” preserva a forma e a possível densidade antropológica do texto, sem impor uma definição doutrinária específica.
- issue: Natureza do intento expresso por ἀπατῆσαι
  choice: enganá-la
  alternative: seduzi-la; iludi-la
  rationale: O verbo grego é mais amplo que “seduzir”. A opção principal evita resolver indevidamente se o engano era exclusivamente sexual, enquanto a nota esclarece a implicação contextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Conservam-se as imagens de “coração” e “alma”, enquanto “reclinou-se à mesa” explicita apenas o necessário para tornar compreensível o costume do banquete.
