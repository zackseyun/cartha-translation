  language: pt
  text: 'E Holofernes lhe disse: “Beba, então, e alegre-se conosco.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίε δὴ
  choice: Beba, por favor
  rationale: O aoristo imperativo Πίε expressa o convite direto para beber, e δή lhe acrescenta insistência ou incentivo. “Por favor” comunica esse tom convidativo em português natural, sem introduzir uma afirmação de obrigação.
- source_word: γενήθητι
  choice: alegre-se
  rationale: Embora o verbo signifique literalmente “seja/torne-se”, no conjunto da expressão ele convida Judite a participar da alegria festiva. “Alegre-se” preserva o imperativo e produz uma formulação corrente.
- source_word: μεθʼ ἡμῶν
  choice: conosco
  rationale: μετά com genitivo indica companhia; “conosco” é seu equivalente direto e natural.
- source_word: εἰς εὐφροσύνην
  choice: alegre-se
  rationale: εὐφροσύνη denota alegria, regozijo ou animação festiva. Seu sentido foi integrado ao verbo “alegre-se”, evitando a construção pouco idiomática “seja conosco para alegria”.
- source_word: Ὀλοφέρνης
  choice: Holofernes
  rationale: Transliteração tradicional e amplamente reconhecível do nome próprio em português.
