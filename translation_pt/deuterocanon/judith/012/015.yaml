  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A sintaxe acompanha a sequência narrativa grega sem reproduzir de modo rígido sua longa coordenação. As notas preservam a incerteza de διαστασᾶσα, a condição indicada por δούλη e o contexto cultural da refeição reclinada.
