base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/015.yaml
  text: And after disrobing[a], she adorned herself with her garments and with all her feminine adornment; and her female slave came and spread out for her on the ground opposite Holofernes the fleeces that she had received from Bagoas for her daily use[c][b], so that she might recline on them while eating.
translation:
  language: pt
  text: Depois de se despir[a], ela se adornou com suas vestes e com todos os seus adornos femininos. Então sua escrava[b] veio e estendeu no chão, diante de Holofernes, as peles de carneiro com lã que ela havia recebido de Bagoas para seu uso diário, a fim de que se reclinasse sobre elas enquanto comia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois de trocar de roupa”; mais literalmente, “depois de se separar”. O particípio grego é incomum, e o contexto sugere que ela retirou a roupa anterior antes de se adornar.'
    reason: lexical_alternative
  - marker: b
    text: “Escrava” traduz a forma feminina do termo grego relacionado a δοῦλος. “Serva” ou “criada” seriam traduções mais brandas, mas não expressariam com a mesma clareza sua condição social.
    reason: lexical_alternative
  - marker: c
    text: Isto é, ela adotaria a postura habitual da época para comer, reclinando-se sobre as peles de carneiro com lã.
    reason: cultural_note
lexical_decisions:
- source_word: διαστασᾶσα
  choice: depois de se despir
  rationale: O particípio é incomum e, literalmente, pode sugerir separar-se ou afastar-se. No contexto imediato, porém, antecede o ato de se adornar com vestes e indica provavelmente que Judite retirou a roupa anterior. A nota preserva a incerteza lexical.
- source_word: ἐκοσμήθη
  choice: ela se adornou
  rationale: O verbo expressa arranjo e embelezamento deliberados, não apenas o ato de vestir-se.
- source_word: ἱματισμῷ
  choice: com suas vestes
  rationale: O substantivo tem sentido coletivo de roupa ou indumentária; “vestes” mantém um registro digno e natural.
- source_word: παντὶ τῷ κόσμῳ τῷ γυναικείῳ
  choice: com todos os seus adornos femininos
  rationale: κόσμος designa aqui o conjunto dos enfeites ou acessórios, sem se limitar necessariamente a joias; γυναικείῳ caracteriza esses adornos como femininos.
- source_word: δούλη
  choice: escrava
  rationale: A forma feminina de δοῦλος indica explicitamente uma mulher em condição servil; “escrava” preserva essa condição, ao contrário de termos mais brandos como “serva” ou “criada”.
- source_word: κατέναντι Ὀλοφέρνου
  choice: diante de Holofernes
  rationale: κατέναντι indica posição em frente ou defronte de alguém. “Diante de” é claro e idiomático no cenário.
- source_word: κώδια
  choice: peles com lã
  rationale: O termo designa peles ou tosões usados como forro ou superfície para deitar. “Peles com lã” comunica o objeto sem pressupor mais do que o grego.
- source_word: εἰς τὴν καθημερινὴν δίαιταν αὐτῆς
  choice: para seu uso diário
  rationale: δίαιτα pode significar modo de vida, regime ou manutenção. Neste contexto, a expressão se refere ao arranjo habitual providenciado para as refeições de Judite; “uso diário” preserva o sentido prático sem restringi-lo indevidamente à alimentação.
- source_word: κατακλινομένην
  choice: se reclinasse
  rationale: O particípio descreve a postura antiga de comer reclinado, e não simplesmente sentado ou deitado.
