base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/011.yaml
  text: And he said to Bagoas the eunuch[a], who was in charge of all that belonged to him[b], “Go now and persuade the Hebrew woman who is with you to come to us and eat and drink with us.”
translation:
  language: pt
  text: 'E ele disse a Bagoas, o eunuco[a], que estava encarregado de tudo o que lhe pertencia: “Vá agora e convença[b] a mulher hebreia que está com você a vir até nós, comer e beber conosco.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Eunuco” também pode designar, em certos contextos, um alto funcionário da corte; aqui, o termo grego foi traduzido literalmente.
    reason: lexical_alternative
  - marker: b
    text: Ou “persuada” ou “insista com”; o verbo grego indica levá-la a aceitar o convite.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βαγώᾳ
  choice: Bagoas
  rationale: O nome próprio é transliterado, em vez de traduzido.
- source_word: εὐνούχῳ
  choice: eunuco
  rationale: Mantém o sentido literal do termo grego, sem reduzi-lo apenas a um título de funcionário da corte.
- source_word: ἐφεστηκὼς ἐπὶ πάντων τῶν αὐτοῦ
  choice: que estava encarregado de tudo o que lhe pertencia
  rationale: Expressa de modo natural a autoridade administrativa de Bagoas sobre os bens ou assuntos de seu senhor, preservando a amplitude da formulação grega.
- source_word: Πεισὸν δὴ πορευθεὶς
  choice: Vá agora e convença
  rationale: Reproduz em português corrente a ordem para que Bagoas se dirija a Judite e a induza a aceitar o convite.
- source_word: τὴν γυναῖκα τὴν Ἑβραίαν
  choice: a mulher hebreia
  rationale: γυνή significa aqui 'mulher', não 'esposa', e Ἑβραίαν é preservado pela designação étnica 'hebreia'.
- source_word: ἣ ἔστιν παρὰ σοὶ
  choice: que está com você
  rationale: Mantém a referência direta à proximidade ou companhia de Bagoas sem especificar além do que o grego afirma.
- source_word: τοῦ ἐλθεῖν πρὸς ἡμᾶς
  choice: a vir até nós
  rationale: O infinitivo indica o conteúdo da persuasão; 'vir até nós' comunica claramente o movimento em direção aos que falam.
- source_word: φαγεῖν καὶ πιεῖν μεθʼ ἡμῶν
  choice: comer e beber conosco
  rationale: Tradução direta que conserva a linguagem do banquete sem acrescentar nuances ausentes do texto.
