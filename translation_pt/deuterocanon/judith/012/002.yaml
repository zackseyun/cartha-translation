base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/002.yaml
  text: And Judith said[a], “I will not eat from them, lest it become a stumbling block; instead, provision will be made for me from the things that have accompanied me.”
translation:
  language: pt
  text: 'E Judite disse: “Não comerei deles, para que isso não se torne causa de tropeço[a]; em vez disso, meu sustento será provido a partir do que veio comigo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ofensa” ou “escândalo”. O grego σκάνδαλον pode indicar algo que leva alguém a tropeçar, uma ofensa ou uma causa de queda.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ φάγομαι
  choice: Não comerei
  rationale: O futuro médio de ἐσθίω expressa aqui uma recusa direta; a forma portuguesa é clara e preserva a força futura.
- source_word: ἐξ αὐτῶν
  choice: deles
  rationale: Mantém o sentido partitivo e a referência contextual aos alimentos oferecidos, sem acrescentar um substantivo ausente do grego.
- source_word: ἵνα μὴ γένηται
  choice: para que isso não se torne
  rationale: Expressa a finalidade preventiva da oração e conserva o caráter prospectivo de γένηται.
- source_word: σκάνδαλον
  choice: causa de tropeço
  rationale: Preserva a metáfora grega de algo que faz tropeçar e sua possível dimensão moral ou religiosa, sem reduzi-la a mero constrangimento social.
- source_word: ἀλλʼ
  choice: em vez disso
  rationale: Marca naturalmente o contraste entre recusar os alimentos oferecidos e recorrer às provisões trazidas por Judite.
- source_word: ἐκ τῶν ἠκολουθηκότων μοι
  choice: com o que veio comigo
  rationale: O particípio perfeito substantivado significa literalmente aquilo que a acompanhou; a formulação portuguesa conserva a imagem sem a expressão pouco natural “seguiu-me”.
- source_word: χορηγηθήσεται
  choice: meu sustento será provido
  rationale: Reproduz o futuro passivo e explicita apenas o complemento implícito exigido em português pelo contexto de alimentação.
theological_decisions:
- issue: Sentido de σκάνδαλον na recusa de Judite
  choice: causa de tropeço
  alternative: ofensa; escândalo
  rationale: A opção mantém a metáfora e deixa aberta a natureza exata do perigo — impureza, transgressão ou outra forma de comprometimento — em vez de resolvê-la como simples escândalo público.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluidez brasileira. A construção final evita literalismo duro, mas conserva a voz passiva e a referência às provisões que acompanharam Judite.
