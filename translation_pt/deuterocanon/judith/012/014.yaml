base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/014.yaml
  text: And Judith said to him[a], “And who am I to speak back to my lord? Whatever is pleasing in his eyes, I will quickly do, and this will be my joy until the day of my death.”
translation:
  language: pt
  text: 'E Judite lhe disse: “E quem sou eu para contradizer o meu senhor?[a] Tudo o que for agradável aos olhos dele, eu me apressarei a fazer; e isso será para mim motivo de alegria até o dia da minha morte.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para me opor ao meu senhor” ou “para responder contra o meu senhor”.
    reason: Alternativas lexicais para ἀντειποῦσα, que pode indicar contradizer, opor-se ou responder contra alguém.
lexical_decisions:
- source_word: ἀντειποῦσα
  choice: contradizer
  rationale: O particípio exprime responder contra, contestar ou contradizer. “Contradizer” é natural em português e preserva tanto a deferência retórica de Judite quanto a possibilidade de oposição verbal.
- source_word: τῷ κυρίῳ μου
  choice: o meu senhor
  rationale: Aqui κύριος é um tratamento respeitoso dirigido a Holofernes, não um título divino. A inicial minúscula evita uma leitura teológica indevida.
- source_word: πᾶν ὃ ἔσται ἐν τοῖς ὀφθαλμοῖς αὐτοῦ ἀρεστόν
  choice: Tudo o que for agradável aos olhos dele
  rationale: Mantém a imagem semítica transmitida pelo grego e comunica aquilo que obtém a aprovação dele.
- source_word: σπεύσασα
  choice: eu me apressarei a fazer
  rationale: Reproduz a ideia de prontidão ou empenho do particípio, em construção portuguesa mais natural que um simples advérbio.
- source_word: ἀγαλλίαμα
  choice: motivo de alegria
  rationale: O substantivo indica alegria intensa ou exultação. “Motivo de alegria” se ajusta naturalmente à construção “será para mim” sem exagerar o registro.
- source_word: ἕως ἡμέρας θανάτου μου
  choice: até o dia da minha morte
  rationale: Tradução direta que preserva a solenidade da expressão temporal.
theological_decisions:
- issue: Uso de κύριος em referência a um superior humano
  choice: meu senhor
  alternative: meu amo
  rationale: O contexto exige um tratamento social respeitoso, não uma designação divina. “Meu senhor”, com minúscula, preserva o registro cortesão e evita sugerir divindade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a retórica deferente de Judite e a imagem “aos olhos dele”, sem explicar ou suavizar sua fala estrategicamente submissa.
