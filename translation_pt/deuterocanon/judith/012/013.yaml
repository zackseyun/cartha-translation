base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/013.yaml
  text: And Bagoas went out from the presence of Holofernes and went in to her and said[a], “Let this beautiful young woman not hesitate to come to my lord, to be honored before him, and to drink wine with us in gladness[b], and to become on this day like one of the daughters of the Assyrians who stand in the house of Nebuchadnezzar.”
translation:
  language: pt
  text: 'E Bagoas saiu da presença de Holofernes, foi até ela e disse: “Não hesite, bela jovem, em vir até meu senhor, para ser honrada diante dele, beber vinho alegremente conosco e tornar-se hoje como uma das filhas dos assírios que servem na casa de Nabucodonosor.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν ... ἀπὸ προσώπου
  choice: saiu da presença de
  rationale: Reproduz de modo natural o idioma cortesão de deixar a presença de alguém.
- source_word: εἰσῆλθεν πρὸς αὐτήν
  choice: foi até ela
  rationale: Expressa o movimento narrativo sem a possível conotação indevida de uma tradução excessivamente literal como “entrou até ela”.
- source_word: Μὴ ὀκνήσῃς
  choice: não hesite
  rationale: ὀκνέω indica hesitação ou relutância e se encaixa naturalmente no convite.
- source_word: ἡ παιδίσκη ἡ καλὴ αὕτη
  choice: esta bela jovem
  rationale: παιδίσκη pode designar uma jovem ou serva; no contexto, funciona como tratamento lisonjeiro, e “jovem” preserva dignidade e naturalidade.
- source_word: δόξασθῆναι κατὰ πρόσωπον αὐτοῦ
  choice: ser honrada diante dele
  rationale: Aqui δοξάζω se refere a receber honra perante Holofernes, não a glorificação em sentido teológico.
- source_word: πίεσαι μεθʼ ἡμῶν εἰς εὐφροσύνην οἴνου
  choice: beber vinho alegremente conosco
  rationale: Comunica de forma idiomática a alegria festiva associada ao vinho, mantendo explícito o vinho mencionado no grego.
- source_word: γενηθήναι ... ὡς θυγάτηρ μία τῶν υἱῶν Ἀσσούρ
  choice: tornar-se hoje como uma das filhas dos assírios
  rationale: O infinitivo sugere assumir uma condição; a expressão étnica semítica é vertida idiomaticamente em português.
- source_word: αἱ παρεστηκυῖαι ἐν οἴκῳ Ναβουχοδονόσορ
  choice: que servem na casa de Nabucodonosor
  rationale: O particípio denota mulheres que permanecem junto à corte como atendentes; “servem” comunica essa função melhor que o literal “estão de pé”.
theological_decisions:
- issue: Sentido de κύριος em contexto cortesão humano
  choice: meu senhor
  alternative: meu amo
  rationale: Bagoas se refere a Holofernes, não a Deus. “Meu senhor” preserva o título respeitoso e a hierarquia social sem sugerir uma referência divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe do convite foi simplificada sem eliminar sua sequência de propósitos; o tratamento lisonjeiro e o ambiente cortesão foram preservados.
