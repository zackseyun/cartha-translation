  naturalness: O português é moderno e fluente. A exortação direta, «Não hesite, bela jovem», é mais natural no diálogo e corresponde melhor à sintaxe e à força pragmática do grego.
  terminology: Bagoas, Holofernes e Nabucodonosor estão bem grafados. «Meu senhor» traduz adequadamente κύριός μου em contexto humano. «Servem na casa» é uma explicitação aceitável do sentido de atendentes cortesãs de αἱ παρεστηκυῖαι.
