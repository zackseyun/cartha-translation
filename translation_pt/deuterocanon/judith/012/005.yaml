translation_notes:
  register: Português moderno, digno e narrativamente fluente, com ampla legibilidade brasileira. A sequência coordenada e o ponto e vírgula preservam o fluxo das orações gregas. O marcador [a] foi ligado à expressão sobre o meio da noite, corrigindo a aparente associação indevida presente na camada inglesa fornecida.
