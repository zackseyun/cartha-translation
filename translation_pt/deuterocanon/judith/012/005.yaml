  yaml_path: translation/deuterocanon/judith/012/005.yaml
  text: And Holofernes’s attendants brought her into the tent[a], and she slept until the middle of the night; then she rose at the morning watch[b],
translation:
  language: pt
  text: E os assistentes de Holofernes a levaram para a tenda, e ela dormiu até o meio da noite[a]; então se levantou na vigília da manhã[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até a meia-noite”. O grego diz literalmente “até a noite estar em seu meio”.'
    reason: lexical_alternative
  - marker: b
    text: A “vigília da manhã” era uma das antigas divisões da noite e correspondia ao período próximo do amanhecer.
    reason: cultural_note
lexical_decisions:
- source_word: θεράποντες
  choice: assistentes
  rationale: O termo designa pessoas que servem ou atendem alguém. “Assistentes” se ajusta ao contexto militar e pessoal sem afirmar que eram escravizados.
- source_word: σκηνήν
  choice: tenda
  rationale: No acampamento militar da narrativa, “tenda” é o sentido natural e mais transparente de σκηνή.
- source_word: ὕπνωσεν
  choice: dormiu
  rationale: O aoristo relata diretamente que Judite dormiu; a forma simples preserva a concisão do grego.
- source_word: μέχρι μεσούσης τῆς νυκτός
  choice: até o meio da noite
  rationale: A expressão indica o momento em que a noite chegava ao seu meio. A tradução mantém a formulação grega sem a reduzir necessariamente ao termo moderno “meia-noite”.
- source_word: ἀνέστη
  choice: se levantou
  rationale: No contexto, o verbo significa levantar-se do sono; esta é uma formulação natural e clara em português.
- source_word: πρὸς τὴν ἑωθινὴν φυλακήν
  choice: na vigília da manhã
  rationale: φυλακή pode designar uma divisão noturna de guarda, e πρός tem aqui valor temporal aproximado. A tradução preserva o antigo modo de marcar as horas.
