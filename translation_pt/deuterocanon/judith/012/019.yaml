  text: And taking it[a], she ate and drank before him what her maidslave had prepared.
translation:
  language: pt
  text: E ela pegou o que sua escrava havia preparado e comeu e bebeu diante dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβοῦσα
  choice: ela pegou
  rationale: O particípio aoristo indica uma ação anterior e ligada às ações principais. A formulação explicita de modo natural em português que o objeto implícito é aquilo que havia sido preparado.
- source_word: ἔφαγεν καὶ ἔπιεν
  choice: comeu e bebeu
  rationale: Reproduz diretamente as duas formas verbais coordenadas e preserva a sequência da ação.
- source_word: κατέναντι αὐτοῦ
  choice: diante dele
  rationale: Expressa de maneira concisa e digna a posição ou presença de Judite perante Holofernes no contexto da refeição.
- source_word: ἃ ἡτοίμασεν
  choice: o que havia preparado
  rationale: O pronome relativo neutro plural é representado naturalmente pelo coletivo português “o que”; o mais-que-perfeito composto deixa clara a anterioridade do preparo.
- source_word: ἡ δούλη αὐτῆς
  choice: sua escrava
  rationale: δούλη é o feminino de δοῦλος e designa literalmente uma mulher em condição de escravidão; “escrava” preserva essa realidade social sem suavizá-la.
theological_decisions:
- issue: Representação de δούλη e da condição social da mulher que acompanhava Judite
  choice: escrava
  alternative: serva
  rationale: A tradução principal mantém o sentido social forte do termo grego. A alternativa tradicional “serva” é registrada em nota, sem apagar no texto a condição que δούλη pode denotar.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática ajustada para evitar um pronome sem antecedente explícito. “Diante dele” conserva o tom narrativo formal sem soar arcaico.
