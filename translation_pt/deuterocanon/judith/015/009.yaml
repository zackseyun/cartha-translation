base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/009.yaml
  text: And when they entered to her[a], they all with one accord blessed her and said to her, “You are the exaltation of Jerusalem, you are the great boast of Israel[b], you are the great glory of our people.”
translation:
  language: pt
  text: 'Quando entraram na presença dela, todos, de comum acordo, a abençoaram e lhe disseram: “Tu és a exaltação de Jerusalém[a], tu és o grande orgulho de Israel, tu és a grande glória do nosso povo[b]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a altura de Jerusalém”. O termo grego evoca aquilo que é elevado ou colocado no alto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o grande motivo de orgulho do nosso povo”. O substantivo grego também pode designar aquilo de que alguém se gloria.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθον πρὸς αὐτήν
  choice: entraram na presença dela
  rationale: Preserva o movimento de entrada expresso por εἰσῆλθον e traduz naturalmente a orientação para Judite indicada por πρὸς αὐτήν, sem a formulação pouco idiomática «entraram até ela».
- source_word: εὐλόγησαν
  choice: abençoaram
  rationale: Mantém o sentido usual de «abençoar» ou «falar bem de alguém» e combina com a aclamação solene que se segue.
- source_word: πάντες ὁμοθυμαδόν
  choice: todos, de comum acordo
  rationale: Expressa tanto a totalidade de πάντες quanto a unanimidade e unidade de propósito comunicadas por ὁμοθυμαδόν.
- source_word: ὕψωμα
  choice: exaltação
  rationale: Conserva a imagem de altura ou elevação do substantivo grego e apresenta Judite como aquela por meio de quem Jerusalém é elevada.
- source_word: γαυρίαμα μέγα
  choice: grande orgulho
  rationale: Comunica uma razão pública de orgulho ou exultação; em português atual, «orgulho» soa natural na aclamação sem adquirir necessariamente sentido negativo.
- source_word: καύχημα μέγα
  choice: grande glória
  rationale: Expressa a honra em que o povo pode gloriar-se e mantém alguma variação retórica em relação a γαυρίαμα, sem ocultar em nota o sentido possível de «motivo de orgulho».
- source_word: τοῦ γένους ἡμῶν
  choice: do nosso povo
  rationale: Traduz o grupo de origem ou comunidade étnica indicado por γένος de modo claro e atual, evitando as conotações modernas potencialmente enganosas de «raça».
theological_decisions:
- issue: Aclamação honorífica de Judite por meio de títulos cívicos e nacionais elevados
  choice: Manter os três predicados como louvor comunitário solene dirigido diretamente a Judite.
  alternative: Abrandar os títulos como simples elogios ou reformulá-los apenas como sentimentos internos de Jerusalém, Israel e do povo.
  rationale: O grego apresenta uma bênção pública estruturada em três declarações paralelas. A tradução conserva a força desse louvor sem acrescentar uma interpretação doutrinária sobre a natureza da honra prestada a Judite.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. O paralelismo de «tu és» foi preservado para reproduzir a cadência da aclamação. «De comum acordo» mantém a unidade coletiva sem recorrer a uma expressão excessivamente arcaica.
