base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/010.yaml
  text: You have done all these things by your hand[a]; you have done good things for Israel, and God has been pleased with them[b]. May you be blessed by the Almighty Lord forever.
translation:
  language: pt
  text: Você fez tudo isso com suas próprias mãos; fez coisas boas para Israel[a], e Deus se agradou delas[b]. Que você seja bendita pelo Senhor Todo-Poderoso para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fez coisas boas com Israel”. A preposição grega significa literalmente “com”, mas, neste contexto, pode indicar que essas coisas foram feitas em benefício de Israel.
    reason: lexical_alternative
  - marker: b
    text: Ou “Deus se agradou deles”, referindo-se ao povo de Israel. O pronome grego pode retomar as coisas boas realizadas ou as pessoas de Israel.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποίησας πάντα ταῦτα
  choice: Você fez todas essas coisas
  rationale: Mantém o aoristo como ação concluída e conserva a força plural e demonstrativa de πάντα ταῦτα em português natural.
- source_word: ἐν χειρί σου
  choice: por sua mão
  rationale: Preserva a imagem instrumental da mão sem transformar a expressão em uma paráfrase abstrata.
- source_word: ἐποίησας τὰ ἀγαθὰ μετὰ Ἰσραήλ
  choice: fez coisas boas para Israel
  rationale: Representa τὰ ἀγαθὰ no plural e entende μετά, neste contexto, em sentido benefactivo. A tradução mais literal com “com” é registrada em nota.
- source_word: εὐδόκησεν ἐπʼ αὐτοῖς ὁ θεός
  choice: Deus se agradou delas
  rationale: Expressa a satisfação ou aprovação divina e toma o pronome como referência às coisas boas mencionadas imediatamente antes, sem ocultar a possível referência alternativa.
- source_word: εὐλογημένη γίνου
  choice: Que você seja bendita
  rationale: Comunica de modo idiomático a força de fórmula de bênção do imperativo grego; o feminino corresponde a εὐλογημένη e à pessoa a quem se dirige.
- source_word: παρὰ τῷ παντοκράτορι κυρίῳ
  choice: pelo Senhor Todo-Poderoso
  rationale: Trata παρά com dativo como indicação da fonte ou agência da bênção e conserva κύριος e παντοκράτωρ como títulos divinos.
- source_word: εἰς τὸν αἰῶνα χρόνον
  choice: para sempre
  rationale: É a expressão portuguesa corrente e fiel para a duração contínua indicada pela locução grega.
theological_decisions:
- issue: Tradução de κύριος na fórmula divina de bênção
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” é o equivalente estabelecido e natural para κύριος como título divino; o contexto não exige outra leitura.
- issue: Força de εὐλογημένη γίνου
  choice: Que você seja bendita
  alternative: Seja bendita
  rationale: A construção escolhida preserva o caráter beneditório e desiderativo da fórmula, em vez de soar apenas como uma ordem.
- issue: Referente de ἐπʼ αὐτοῖς
  choice: as coisas boas
  alternative: o povo de Israel
  rationale: O antecedente expresso mais próximo é τὰ ἀγαθὰ, mas a forma pronominal também permite que se entenda uma referência às pessoas de Israel; a nota mantém essa ambiguidade disponível.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Você” torna a interpelação direta natural; “bendita” preserva explicitamente o gênero feminino do grego. As notas mantêm as ambiguidades reais de μετά e do referente pronominal.
