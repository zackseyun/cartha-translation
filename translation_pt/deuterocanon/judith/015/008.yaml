base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/008.yaml
  text: And Joakim the high priest and the council of the sons of Israel[a], who dwelt in Jerusalem, came to see the good things that the Lord had done for Israel[b], and to see Judith and speak peaceably with her.
translation:
  language: pt
  text: E Joaquim, o sumo sacerdote, e o conselho dos filhos de Israel[a], que moravam em Jerusalém, vieram ver as coisas boas que o Senhor havia feito por Israel e também ver Judite e falar-lhe palavras de paz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos israelitas”. O grego diz literalmente “dos filhos de Israel”, designação tradicional do povo da aliança.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “falar paz com ela”; isto é, falar com ela em paz ou dirigir-lhe uma saudação ou felicitação pacífica.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωακειὶμ
  choice: Joaquim
  rationale: Emprega a forma portuguesa tradicional e reconhecível do nome representado pelo grego Ἰωακειίμ.
- source_word: ὁ ἱερεὺς ὁ μέγας
  choice: o sumo sacerdote
  rationale: Expressão consagrada em português para o principal ofício sacerdotal e equivalente natural da locução grega.
- source_word: ἡ γερουσία
  choice: o conselho
  rationale: Designa o corpo governante de anciãos sem sugerir, como 'senado', uma instituição especificamente romana.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: dos filhos de Israel
  rationale: Preserva a formulação familiar e pactual explícita do grego, embora ela designe coletivamente os israelitas.
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλὴμ
  choice: que moravam em Jerusalém
  rationale: A oração relativa modifica naturalmente o grupo imediatamente anterior e usa linguagem corrente em português.
- source_word: τοῦ θεάσασθαι τὰ ἀγαθὰ
  choice: ver as coisas boas
  rationale: Mantém tanto a ideia de finalidade do infinitivo quanto a amplitude de τὰ ἀγαθά, sem restringi-la a 'bênçãos' ou 'feitos'.
- source_word: Κύριος
  choice: o Senhor
  rationale: Forma portuguesa bíblica estabelecida para a referência narrativa a Deus.
- source_word: τοῦ ἰδεῖν τὴν Ἰουδεὶθ
  choice: ver Judite
  rationale: Reproduz de modo direto o segundo infinitivo de finalidade, paralelo ao primeiro.
- source_word: λαλῆσαι μετʼ αὐτῆς εἰρήνην
  choice: falar-lhe palavras de paz
  rationale: Conserva o elemento explícito 'paz' e o sabor semítico da expressão, mas evita em português a formulação pouco natural 'falar paz com ela'.
theological_decisions:
- issue: Tradução de Κύριος
  choice: o Senhor
  alternative: Senhor
  rationale: A forma com artigo é idiomática no contexto narrativo português e identifica Deus como aquele que agiu em favor de Israel.
- issue: Designação étnico-pactual τῶν υἱῶν Ἰσραήλ
  choice: dos filhos de Israel
  alternative: dos israelitas
  rationale: A tradução mantém a imagem genealógica masculina expressa no original e sua função tradicional como nome coletivo do povo, deixando a alternativa idiomática em nota.
- issue: Sentido de λαλῆσαι μετʼ αὐτῆς εἰρήνην
  choice: falar-lhe palavras de paz
  alternative: falar com ela amistosamente
  rationale: A opção principal preserva a menção explícita à paz e não decide de modo excessivamente específico entre saudação pacífica, felicitação e conversa amistosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém 'filhos de Israel' e a linguagem de 'paz' para preservar traços significativos do grego, enquanto 'moravam' e 'falar-lhe palavras de paz' evitam construções arcaicas ou pouco naturais.
