base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/006.yaml
  text: But the rest[a], those living in Bethulia, fell upon the camp of Assyria[c][b], and they pursued them and plundered it greatly.
translation:
  language: pt
  text: Mas os demais, os que moravam em Betúlia, lançaram-se contra o acampamento da Assíria[a], perseguiram-nos[b] e recolheram despojos em grande quantidade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o acampamento assírio”. O grego diz literalmente “o acampamento da Assíria”.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega diz literalmente “foram atrás deles”; neste contexto de batalha, significa que os perseguiram.
    reason: lexical_alternative
  - marker: c
    text: Também pode ser traduzido por “saquearam em grande escala” ou “tomaram uma enorme quantidade de despojos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Mas os demais
  rationale: οἱ λοιποί designa os restantes, e δέ marca aqui uma transição levemente contrastiva em relação ao grupo mencionado antes.
- source_word: οἱ κατοικοῦντες Βαιτυλουὰ
  choice: os que moravam em Betúlia
  rationale: A expressão participial indica residência habitual; esta formulação é natural em português moderno e mantém a estrutura explicativa do grego.
- source_word: ἐπέπεσαν
  choice: lançaram-se contra
  rationale: O verbo retrata um ataque súbito e vigoroso; a escolha conserva sua vivacidade militar sem recorrer a uma expressão arcaica.
- source_word: τῇ παρεμβολῇ Ἀσσούρ
  choice: o acampamento da Assíria
  rationale: παρεμβολή, neste contexto militar, significa acampamento. A construção com 'da Assíria' acompanha de perto o genitivo grego Ἀσσούρ, enquanto a nota registra a alternativa idiomática.
- source_word: ἐπορεύοντο αὐτούς
  choice: perseguiram-nos
  rationale: Embora πορεύομαι normalmente expresse ir ou caminhar, seu uso com objeto pessoal neste contexto de batalha tem o sentido contextual de ir atrás dos inimigos em fuga.
- source_word: ἐλούτησαν σφόδρα
  choice: recolheram despojos em grande quantidade
  rationale: O verbo expressa saquear ou tomar despojos, e σφόδρα intensifica a ação. A formulação portuguesa comunica o resultado do saque de modo natural, sem impor um objeto que não está expresso no grego.
