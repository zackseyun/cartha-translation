base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/002.yaml
  text: And terror and fear fell upon them[a], and no man remained standing before his neighbor any longer; but, scattering in all directions[b], they fled along every road of the plain and of the hill country.
translation:
  language: pt
  text: O terror e o medo caíram sobre eles, e já nenhum homem permanecia diante do seu companheiro; mas, espalhando-se[a] todos de uma vez[b], fugiam por todas as estradas da planície e da região montanhosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “derramando-se” ou “dispersando-se”. O grego retrata as tropas se desfazendo em meio ao pânico.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de comum acordo”. Neste contexto, a expressão provavelmente indica que todos fugiram juntos ou ao mesmo tempo, e não uma unidade harmoniosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέπεσεν ἐπʼ αὐτοὺς
  choice: caíram sobre eles
  rationale: Mantém a imagem vívida de algo que sobrevém repentinamente. Embora o grego use o verbo no singular com o par de substantivos, o plural é a concordância natural em português.
- source_word: τρόμος καὶ φόβος
  choice: o terror e o medo
  rationale: Preserva os dois substantivos gregos sem reduzir a expressão a uma única ideia; no contexto militar, τρόμος comunica terror intenso, e φόβος, medo.
- source_word: οὐκ ἦν ἄνθρωπος μένων
  choice: já nenhum homem permanecia
  rationale: Reproduz a forma singular e masculina de ἄνθρωπος e expressa a continuidade indicada pelo particípio μένων e pelo imperfeito ἦν.
- source_word: κατὰ πρόσωπον τοῦ πλησίον
  choice: diante do seu companheiro
  rationale: Traduz de modo natural o sentido de permanecer na presença ou em frente daquele que estava próximo; 'companheiro' se ajusta ao contexto das tropas.
- source_word: ἔτι
  choice: já ... permanecia
  rationale: A construção com 'já' e a negação comunica que a situação anterior havia cessado, equivalente a 'não permanecia mais'.
- source_word: ἐκχυθέντες
  choice: espalhando-se
  rationale: O particípio evoca literalmente algo derramado ou vertido; no contexto de uma debandada, 'espalhando-se' preserva a imagem de tropas que se desfazem e se dispersam.
- source_word: ὁμοθυμαδόν
  choice: todos de uma vez
  rationale: Aqui o advérbio parece indicar uma fuga coletiva e simultânea, não uma unidade harmoniosa. A nota conserva a alternativa tradicional 'de comum acordo'.
- source_word: ἔφευγον
  choice: fugiam
  rationale: O imperfeito grego apresenta a fuga em andamento; o imperfeito português preserva naturalmente esse aspecto narrativo.
- source_word: ἐπὶ πᾶσαν ὁδὸν
  choice: por todas as estradas
  rationale: Comunica que os fugitivos tomaram todas as rotas disponíveis, com formulação idiomática em português.
- source_word: τοῦ πεδίου καὶ τῆς ὀρεινῆς
  choice: da planície e da região montanhosa
  rationale: Distingue o terreno plano da zona elevada sem transformar necessariamente ὀρεινή em montanhas isoladas.
