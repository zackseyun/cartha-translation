  yaml_path: translation/deuterocanon/judith/015/013.yaml
  text: And they gave Judith the tent of Holofernes[a], and all the silver vessels, and the couches, and the utensils, and all his furnishings. And she took them and placed them on her mule, and harnessed her wagons[b], and piled them on them.
translation:
  language: pt
  text: E deram a Judite a tenda de Holofernes, todos os objetos de prata, os leitos, os apetrechos[a] e todos os seus utensílios. Ela pegou essas coisas, colocou-as sobre a sua mula, atrelou suas carroças[b] e as amontoou nelas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido por «apetrechos» (ὅλκια) é raro e de sentido incerto; pode designar mais especificamente cortinas, coberturas ou outros acessórios da tenda.
    reason: lexical_alternative
  - marker: b
    text: Na oração final, os pronomes gregos estão condensados. O sentido provável é que Judite amontoou os bens nas carroças, embora a redação primeiro diga que ela os colocou sobre a mula.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνήν
  choice: tenda
  rationale: É o sentido comum do termo e descreve naturalmente o alojamento de campanha de Holofernes.
- source_word: ἀργυρώματα
  choice: objetos de prata
  rationale: O termo abrange artigos feitos de prata sem os restringir a talheres ou recipientes.
- source_word: κλίνας
  choice: leitos
  rationale: κλίνη pode designar cama ou divã; «leitos» mantém a referência a mobiliário sem especificar indevidamente seu uso.
- source_word: ὅλκια
  choice: apetrechos
  rationale: O vocábulo é raro e de sentido incerto. «Apetrechos» oferece uma designação ampla para acessórios móveis, sem impor a identificação mais estreita com cortinas ou coberturas.
- source_word: σκευάσματα
  choice: utensílios
  rationale: O termo designa de modo amplo objetos, implementos ou artigos de uso; «utensílios» o distingue dos apetrechos mencionados antes.
- source_word: ἡμίονον
  choice: mula
  rationale: O substantivo designa uma mula; a forma feminina é adequadamente preservada em português.
- source_word: ἔζευξεν
  choice: atrelou
  rationale: O verbo significa pôr sob jugo ou preparar para tração; «atrelou» é natural em relação a carroças.
- source_word: ἁμάξας
  choice: carroças
  rationale: Refere-se a veículos de rodas destinados ao transporte de uma carga considerável.
- source_word: ἐσώρευσεν
  choice: amontoou
  rationale: Preserva a imagem concreta de empilhar ou acumular os despojos sobre os veículos.
