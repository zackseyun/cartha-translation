translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução conserva o idioma bíblico “filhos de Israel”, mas esclarece a alternativa corrente em nota. O ponto e vírgula ajuda a distinguir as duas ações coordenadas e permite que aldeias e povoados funcionem naturalmente, por metonímia, como seus habitantes.
