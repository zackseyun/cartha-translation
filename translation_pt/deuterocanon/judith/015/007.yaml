base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/007.yaml
  text: But the sons of Israel[a], returning from the slaughter, took possession of the rest, and the villages and hamlets in the hill country and in the plain took much plunder[c][b], for there was a very great quantity.
translation:
  language: pt
  text: Mas os filhos de Israel[a], ao voltarem da matança, apoderaram-se dos restantes; e as aldeias e as propriedades rurais[b] da região montanhosa e da planície recolheram muitos despojos[c], pois havia uma quantidade muitíssimo grande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas”. O grego diz mais literalmente “os filhos de Israel”.
    reason: lexical_alternative
  - marker: b
    text: Ou “as aldeias e as habitações rurais”. O termo pode designar residências ou propriedades no campo.
    reason: lexical_alternative
  - marker: c
    text: Ou “muitos bens tomados do inimigo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... υἱοὶ Ἰσραήλ
  choice: os filhos de Israel
  rationale: Preserva de perto o idioma grego e o registro bíblico; em português atual, “os israelitas” também seria natural.
- source_word: ἀναστρέψαντες ἀπὸ τῆς κοπῆς
  choice: ao voltarem da matança
  rationale: Expressa de modo natural a ação circunstancial do particípio e mantém a força violenta de κοπή no contexto militar.
- source_word: ἐκυρίευσαν τῶν λοιπῶν
  choice: apoderaram-se do restante
  rationale: κυριεύω indica alcançar domínio ou posse; a formulação mantém relativamente aberta a referência de τῶν λοιπῶν, que pode apontar para aquilo ou aqueles que restavam.
- source_word: αἱ κῶμαι καὶ ἐπαύλεις
  choice: as aldeias e os povoados rurais
  rationale: κῶμαι designa aldeias, enquanto ἐπαύλεις se refere a habitações, propriedades ou pequenos núcleos do campo; “povoados rurais” comunica esse sentido sem sugerir propriedades luxuosas.
- source_word: ἐν τῇ ὀρεινῇ καὶ πεδινῇ
  choice: da região montanhosa e da planície
  rationale: São designações geográficas contrastantes; a construção com “da” liga naturalmente os assentamentos às duas regiões em português.
- source_word: ἐκράτησαν πολλῶν λαφύρων
  choice: recolheram muitos despojos
  rationale: No contexto, κρατέω expressa obter ou tomar, e λάφυρα são bens capturados na guerra. “Recolheram muitos despojos” é claro e evita a repetição de “apoderaram-se”.
- source_word: ἦν γὰρ πλῆθος πολὺ σφόδρα
  choice: pois eram muitíssimos
  rationale: Retoma naturalmente “despojos” e reproduz a forte ênfase quantitativa de πλῆθος πολὺ σφόδρα sem uma expressão pesada em português.
