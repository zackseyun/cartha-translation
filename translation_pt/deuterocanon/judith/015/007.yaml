revisions:
- from: Mas os filhos de Israel[a], ao voltarem da matança, apoderaram-se do restante; e as aldeias e os povoados rurais[b] da região montanhosa e da planície recolheram muitos despojos[c], pois eram muitíssimos.
  to: Mas os filhos de Israel[a], ao voltarem da matança, apoderaram-se dos restantes; e as aldeias e as propriedades rurais[b] da região montanhosa e da planície recolheram muitos despojos[c], pois havia uma quantidade muitíssimo grande.
  rationale: A revisão substitui uma designação excessivamente específica de ἐπαύλεις por «propriedades rurais» e restaura, na oração final, a declaração quantitativa impessoal do grego. «Dos restantes» conserva o plural pessoal/substantivado de τῶν λοιπῶν sem decidir além do necessário quem eram os que restavam.
