  text: And Judith kept bringing forth this confession in all Israel[a], and all the people echoed this praise; and Judith said[b],
translation:
  language: pt
  text: 'E Judite entoava esta ação de graças em todo o Israel[a], e todo o povo respondia[b] com este louvor; e Judite disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “este reconhecimento”, “esta confissão” ou “este louvor”. O termo grego pode indicar reconhecimento público, confissão, ação de graças ou louvor; aqui não se refere necessariamente à confissão de pecados.
    reason: lexical_alternative
  - marker: b
    text: 'O verbo grego sugere uma resposta sonora ou antifonal; também se pode traduzir: “ecoava este louvor” ou “respondia em coro com este louvor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆρχεν
  choice: entoava
  rationale: O imperfeito indica uma ação continuada ou reiterada. Neste contexto de execução pública e resposta coletiva, o verbo pode expressar que Judite iniciava ou conduzia o cântico; “entoava” comunica isso de modo natural em português sem impor uma ideia espacial.
- source_word: ἐξομολόγησιν
  choice: ação de graças
  rationale: No grego bíblico, o substantivo pode indicar reconhecimento público, confissão, agradecimento ou louvor. O contexto hínico favorece “ação de graças”, enquanto a nota registra a amplitude lexical.
- source_word: ἐν παντὶ Ἰσραήλ
  choice: em todo o Israel
  rationale: Mantém a formulação ampla do grego e deixa aberta a referência tanto ao território quanto à comunidade de Israel.
- source_word: ὑπεφώνει
  choice: respondia
  rationale: O verbo sugere uma resposta sonora, possivelmente responsorial ou antifonal. “Respondia” é claro e natural, e a nota explicita essa nuance.
- source_word: πᾶς ὁ λαὸς
  choice: todo o povo
  rationale: Equivalente direto e corrente, apropriado ao contexto coletivo.
- source_word: αἴνεσιν
  choice: louvor
  rationale: Preserva a distinção lexical em relação a ἐξομολόγησιν e expressa diretamente o conteúdo da resposta do povo.
- source_word: εἶπεν
  choice: disse
  rationale: É o introdutor narrativo normal para a fala que vem a seguir.
theological_decisions:
- issue: Relação entre ἐξομολόγησις e αἴνεσις
  choice: Manter uma distinção entre “ação de graças” e “louvor”.
  alternative: Traduzir ambos por termos equivalentes a “louvor”, ou usar “confissão” para ἐξομολόγησις.
  rationale: Os dois substantivos gregos são diferentes. “Ação de graças” se ajusta ao contexto hínico e evita que “confissão” seja entendida automaticamente como admissão de pecado, sem ocultar as demais possibilidades, registradas em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Entoava” preserva o ambiente hínico e o aspecto reiterado do imperfeito; “ação de graças” e “louvor” mantêm a distinção entre os dois substantivos gregos.
