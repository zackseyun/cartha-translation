base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/004.yaml
  text: And Uzziah sent men to Bethomesthaim and Choba and Chola, and to all the territory of Israel, to report what had happened, and that all should rush out against the enemies for their destruction.
translation:
  language: pt
  text: Ozias enviou mensageiros a Betomestaím, Coba e Cola, e a todo o território de Israel, para anunciar o que havia acontecido e para que todos se lançassem em massa[a] contra os inimigos, a fim de destruí-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “fossem derramados contra os inimigos”, imagem que descreve uma multidão saindo impetuosamente para atacar.
    reason: Alternativa lexical e esclarecimento da expressão idiomática grega.
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Verbo narrativo corrente e fiel para o ato de enviar pessoas com uma missão.
- source_word: Ὀζίας
  choice: Uzias
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome grego.
- source_word: Βαιτομασθαΐμ
  choice: Betomestaím
  rationale: Transliteração portuguesa próxima da forma grega, com acentuação gráfica que orienta a pronúncia.
- source_word: Χωβὰι
  choice: Coba
  rationale: Transliteração simples e legível da forma grega, em linha com a forma adotada na camada de consulta.
- source_word: Χωλὰ
  choice: Cola
  rationale: Transliteração direta da forma grega, adaptada à ortografia portuguesa.
- source_word: πᾶν ὅριον Ἰσραήλ
  choice: todo o território de Israel
  rationale: ὅριον designa aqui a extensão territorial, não apenas as linhas de fronteira.
- source_word: τοὺς ἀπαγγέλλοντας
  choice: mensageiros ... para anunciar
  rationale: O particípio substantivado identifica pessoas enviadas para comunicar a notícia; “mensageiros” torna essa função explícita de modo natural.
- source_word: ὑπὲρ τῶν συντετελεσμένων
  choice: o que havia acontecido
  rationale: Expressa naturalmente os acontecimentos já consumados indicados pelo particípio perfeito.
- source_word: ἵνα πάντες ἐκχυθῶσιν
  choice: para que todos se lançassem em massa
  rationale: Reproduz o movimento coletivo e impetuoso da imagem literal de serem “derramados”, sem resultar em português obscuro.
- source_word: τοῖς πολεμίοις
  choice: contra os inimigos
  rationale: A preposição “contra” comunica corretamente o movimento hostil expresso pelo dativo neste contexto militar.
- source_word: εἰς τὴν ἀναίρεσιν αὐτῶν
  choice: a fim de destruí-los
  rationale: Mantém de forma clara tanto a finalidade quanto a severidade de ἀναίρεσις no contexto militar.
theological_decisions:
- issue: Linguagem de violência em uma narrativa militar
  choice: a fim de destruí-los
  alternative: para a destruição deles
  rationale: O grego declara explicitamente a finalidade de eliminar os inimigos. A tradução não suaviza a violência nem a intensifica para “massacrá-los” ou expressão semelhante.
translation_notes:
  register: Português moderno, digno e narrativamente fluente, com legibilidade brasileira e vocabulário amplamente internacional. Os topônimos são transliterados da forma grega; a construção “se lançassem em massa” conserva a força coletiva da metáfora sem impor literalismo opaco.
