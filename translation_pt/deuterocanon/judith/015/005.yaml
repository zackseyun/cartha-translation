base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/005.yaml
  text: But when the sons of Israel heard[a], they all together fell upon them and kept striking them down as far as Choba. Likewise, those from Jerusalem and from all the hill country also arrived, for the things that had happened in the camp of their enemies had been reported to them; and those in Gilead and those in Galilee outflanked them with a great slaughter[c][b], until they had passed Damascus and its borders.
translation:
  language: pt
  text: Mas, quando os filhos de Israel ouviram isso[a], todos juntos caíram sobre eles e continuaram a abatê-los até Chobá. Do mesmo modo, também chegaram os de Jerusalém e os de toda a região montanhosa, pois lhes haviam contado o que acontecera no acampamento dos seus inimigos. E os de Gileade e os da Galileia os flanquearam[b], causando grande mortandade[c], até passarem para além de Damasco e dos seus limites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os israelitas ouviram isso». O grego diz literalmente «os filhos de Israel».
    reason: lexical_alternative
  - marker: b
    text: O verbo militar também pode significar que eles avançaram para além dos inimigos, os contornaram ou lhes cortaram a retirada durante a perseguição.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, «com um grande golpe». Neste contexto de batalha, a expressão provavelmente se refere a uma matança intensa ou a uma derrota devastadora.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: os filhos de Israel
  rationale: Preserva a expressão familiar masculina do grego e sua forma tradicional, enquanto a nota oferece a alternativa coletiva mais corrente.
- source_word: ὁμοθυμαδόν
  choice: todos juntos
  rationale: Expressa a ação unida e simultânea do grupo em português atual, sem recorrer a uma formulação arcaica.
- source_word: ἐπέπεσον ἐπʼ αὐτούς
  choice: caíram sobre eles
  rationale: Mantém a imagem vívida e a força marcial do idioma grego, em vez de reduzi-lo ao mais genérico «atacaram».
- source_word: ἔκοπτον αὐτούς
  choice: continuaram a abatê-los
  rationale: O imperfeito indica ação prolongada ou repetida; «abater» comunica o efeito letal provável sem especificar a arma empregada.
- source_word: ἕως Χωβά
  choice: até Chobá
  rationale: Apresenta Chobá como o limite espacial da perseguição e translitera o topônimo preservado no texto grego.
- source_word: οἱ ἐξ Ἰερουσαλήμ
  choice: os de Jerusalém
  rationale: Reproduz de modo natural a identificação pela procedência, sem acrescentar um substantivo ausente do grego.
- source_word: ἐκ πάσης τῆς ὀρεινῆς
  choice: de toda a região montanhosa
  rationale: Comunica com clareza a área geográfica elevada designada pelo substantivo grego.
- source_word: παρεγενήθησαν
  choice: chegaram
  rationale: No contexto narrativo, o verbo descreve a chegada dessas pessoas ao cenário da ação.
- source_word: τὰ γεγονότα
  choice: o que acontecera
  rationale: É uma forma idiomática e fiel de transmitir os acontecimentos já ocorridos.
- source_word: τῇ παρεμβολῇ
  choice: no acampamento
  rationale: Em contexto militar, παρεμβολή designa o acampamento ou arraial das forças inimigas.
- source_word: ὑπερεκέρασαν αὐτούς
  choice: os flanquearam
  rationale: O composto militar sugere avançar além do flanco do inimigo ou contorná-lo; «flanquearam» preserva esse sentido tático sem eliminar as alternativas possíveis.
- source_word: πληγῇ μεγάλῃ
  choice: causando grande mortandade
  rationale: No contexto de batalha e perseguição, a expressão indica um golpe devastador com muitas baixas; a nota conserva sua formulação mais literal.
- source_word: ἕως οὗ παρῆλθον Δαμασκὸν καὶ τὰ ὅρια αὐτῆς
  choice: até passarem para além de Damasco e dos seus limites
  rationale: Mantém o movimento para além da cidade e de seu território, sem inserir um sujeito nominal que o grego deixa implícito.
