base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/003.yaml
  text: And those encamped in the hill country around Bethulia turned to flight[a]; then the sons of Israel, every man a warrior[c][b], poured out against them.
translation:
  language: pt
  text: E os que estavam acampados na região montanhosa ao redor de Betúlia puseram-se em fuga; então os filhos de Israel, todos os homens de guerra, avançaram impetuosamente[a] contra eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “derramaram-se contra eles”.
    reason: A nota registra a metáfora vívida do verbo grego ἐκχέω, traduzida no texto por uma expressão portuguesa mais natural.
lexical_decisions:
- source_word: οἱ παρεμβεβληκότες
  choice: os que estavam acampados
  rationale: O particípio perfeito substantivado indica os que se encontravam instalados em acampamento; a forma portuguesa preserva o estado resultante e o contexto militar.
- source_word: ἐν τῇ ὀρεινῇ
  choice: na região montanhosa
  rationale: ὀρεινή designa uma região de relevo elevado, não necessariamente uma única montanha.
- source_word: κύκλῳ Βαιτυλουὰ
  choice: ao redor de Betúlia
  rationale: κύκλῳ com o topônimo exprime localização circundante; a construção é clara e natural em português.
- source_word: ἐτράπησαν εἰς φυγήν
  choice: puseram-se em fuga
  rationale: Reproduz naturalmente o idioma grego e conserva sua formulação militar, em vez de reduzi-lo simplesmente a 'fugiram'.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: os filhos de Israel
  rationale: Mantém a expressão étnica tradicional do grego, sem neutralizar sua forma.
- source_word: πᾶς ἀνὴρ πολεμιστής
  choice: todos os homens de guerra
  rationale: A formulação distributiva grega refere-se a cada homem combatente; o plural coletivo é idiomático em português e preserva a referência masculina e militar.
- source_word: ἐξέχυθησαν ἐπʼ αὐτούς
  choice: avançaram impetuosamente contra eles
  rationale: A imagem literal de serem 'derramados' descreve tropas que irrompem em massa; a tradução comunica esse movimento vigoroso sem produzir uma expressão opaca em português.
theological_decisions:
- issue: Linguagem étnica e militar marcada por gênero
  choice: os filhos de Israel, todos os homens de guerra
  alternative: os israelitas, todos os guerreiros
  rationale: O grego emprega υἱοί e ἀνήρ de modo explicitamente masculino. A tradução conserva essa forma, ao mesmo tempo que usa uma expressão portuguesa natural, sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação mantém a sequência narrativa do grego; o registro militar é preservado sem arcaísmo excessivo.
