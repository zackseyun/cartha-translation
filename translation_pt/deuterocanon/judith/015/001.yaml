lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Mantém a coordenação simples e o fluxo narrativo do grego, sem acrescentar uma nuance temporal.
- source_word: ὡς
  choice: quando
  rationale: Com o aoristo ἤκουσαν, introduz naturalmente uma oração temporal; “quando” evita intensificar a ideia como faria “assim que”.
- source_word: ἤκουσαν
  choice: ouviram
  rationale: Reproduz o sentido básico de receber auditivamente uma informação, sem o grau de interpretação presente em “souberam”.
- source_word: οἱ ἐν τοῖς σκηνώμασιν ὄντες
  choice: os que estavam nas tendas
  rationale: Preserva a construção participial e não especifica sexo ou função que o grego não explicita.
- source_word: σκηνώμασιν
  choice: tendas
  rationale: É a designação corrente e apropriada ao contexto militar; “tabernáculos” seria arcaizante e potencialmente enganoso.
- source_word: ἐξέστησαν
  choice: ficaram atônitos
  rationale: Expressa a forte reação de choque ou assombro indicada pelo verbo, em português atual e digno, sem decidir que se tratou especificamente de confusão.
- source_word: ἐπὶ τὸ γεγονός
  choice: diante do que havia acontecido
  rationale: Transmite de modo idiomático a reação causada pelo acontecimento já consumado e preserva a força resultativa de γεγονός.
