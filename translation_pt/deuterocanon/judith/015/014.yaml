  - marker: a
    text: Tirsos eram bastões ou varas usados em festas e procissões no mundo grego.
    reason: cultural_note
lexical_decisions:
- source_word: συνέδραμεν
  choice: acorreram
  rationale: Expressa a convergência rápida e coletiva das mulheres, preservando a vivacidade do verbo grego sem a rigidez de uma tradução como “correram juntas”.
- source_word: πᾶσα γυνὴ Ἰσραήλ
  choice: todas as mulheres de Israel
  rationale: O grego emprega um singular coletivo; o plural é a forma natural em português e comunica sem perda que as mulheres israelitas, coletivamente, foram ao encontro de Judite.
- source_word: τοῦ ἰδεῖν αὐτήν
  choice: para vê-la
  rationale: Reproduz de modo claro e conciso a ideia de finalidade expressa pelo infinitivo articulado.
- source_word: εὐλόγησαν αὐτήν
  choice: bendisseram-na
  rationale: “Bendizer” preserva tanto o sentido de declarar bem-aventurada quanto a ressonância religiosa de εὐλογέω; “elogiaram” reduziria essa amplitude.
- source_word: ἐποίησαν αὐτῇ χορὸν ἐξ αὐτῶν
  choice: organizaram entre si uma dança em sua homenagem
  rationale: χορὸς pode designar um grupo de dança ou uma dança coletiva. A formulação torna claro que as próprias mulheres participaram e que a celebração era em honra de Judite.
- source_word: θύρσους
  choice: tirsos
  rationale: O termo cultural específico não possui equivalente português exato. A transliteração consagrada preserva o objeto, explicado em nota.
- source_word: ταῖς γυναιξὶν ταῖς μετʼ αὐτῆς
  choice: às mulheres que estavam com ela
  rationale: Tradução direta e natural para as mulheres que acompanhavam Judite.
