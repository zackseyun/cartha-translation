  text: And every woman of Israel ran together to see her[a], and they blessed her, and they made a dance for her from among themselves; and she took thyrsi in her hands and gave them to the women with her[b],
translation:
  language: pt
  text: Todas as mulheres de Israel acorreram para vê-la, bendisseram-na e organizaram entre si uma dança em sua homenagem. Ela tomou tirsos[a] nas mãos e os entregou às mulheres que estavam com ela.
