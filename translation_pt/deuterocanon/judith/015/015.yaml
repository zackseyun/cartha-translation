base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/015.yaml
  text: And they crowned her with an olive wreath[a], she and the women with her. And she went before all the people in the dance, leading all the women, and every man of Israel followed, armed[b], with wreaths and with hymns in their mouths.
translation:
  language: pt
  text: Ela e as mulheres que a acompanhavam coroaram-se com grinaldas de oliveira[a]. Então ela avançou à frente de todo o povo, numa dança[b], liderando todas as mulheres; e todos os homens de Israel a seguiam armados, com grinaldas e hinos nos lábios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “coroaram-se com a oliveira”; o grego provavelmente se refere a grinaldas feitas de ramos de oliveira, usadas na celebração ou na vitória.
    reason: lexical_alternative
  - marker: b
    text: Ou “dançando” ou “numa procissão com dança”; o termo grego pode indicar tanto a atividade de dançar como uma dança coral organizada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστεφανώσαντο
  choice: coroaram-se
  rationale: O aoristo médio, com o sujeito plural expresso em αὐτὴ καὶ αἱ μετʼ αὐτῆς, indica que Judite e suas acompanhantes se adornaram com coroas ou grinaldas; a forma reflexiva preserva essa construção.
- source_word: τὴν ἐλαίαν
  choice: com grinaldas de oliveira
  rationale: A expressão é literalmente ‘a oliveira’, mas, após στεφανόω e no contexto de uma celebração de vitória, designa o adorno feito de oliveira. ‘Grinaldas’ evita a possível conotação monárquica de ‘coroas’.
- source_word: αὐτὴ καὶ αἱ μετʼ αὐτῆς
  choice: Ela e as mulheres que a acompanhavam
  rationale: O artigo feminino plural e o contexto posterior deixam claro que se trata das mulheres que estavam com Judite.
- source_word: προῆλθεν παντὸς τοῦ λαοῦ
  choice: avançou à frente de todo o povo
  rationale: Expressa o movimento de Judite na dianteira da procissão sem sugerir necessariamente que ela saiu de algum lugar.
- source_word: ἐν χορείᾳ
  choice: numa dança
  rationale: χορεία pode indicar dança ou uma formação coral dançante; ‘numa dança’ conserva a imagem festiva sem impor uma descrição coreográfica específica.
- source_word: ἡγουμένη
  choice: liderando
  rationale: O particípio explicita a função de Judite à frente de todas as mulheres.
- source_word: ἐνωπλισμένοι
  choice: armados
  rationale: O particípio significa estar armado ou equipado com armas e descreve diretamente os homens de Israel.
- source_word: μετὰ στεφάνων
  choice: com grinaldas
  rationale: No cenário festivo e triunfal, στέφανοι são grinaldas ou coroas de celebração, não coroas régias.
- source_word: ὕμνων ἐν τῷ στόματι αὐτῶν
  choice: hinos nos lábios
  rationale: A formulação portuguesa mantém a imagem concreta de cânticos na boca, com naturalidade e dignidade.
