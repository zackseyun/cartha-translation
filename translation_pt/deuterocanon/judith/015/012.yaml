  rationale: Neste contexto militar, o substantivo se refere ao acampamento inimigo; “acampamento” é claro e idiomático.
- source_word: ἐφʼ ἡμέρας τριάκοντα
  choice: durante trinta dias
  rationale: A expressão indica duração; esta formulação comunica naturalmente toda a extensão temporal.
