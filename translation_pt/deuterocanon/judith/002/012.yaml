  text: For as I live[a], and by the power of my kingdom, I have spoken[b], and I will do these things by my hand.
translation:
  language: pt
  text: Pois, pela minha vida e pelo poder do meu reino[a], eu falei e farei estas coisas por minha mão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego é elíptico: literalmente, “vivo eu e o poder do meu reino”. κράτος também pode significar “força” ou “poderio”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em minha mão”; a expressão indica ação pessoal e direta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a base solene da declaração anterior e combina com o caráter de juramento da frase.
- source_word: ζῶν ἐγώ
  choice: pela minha vida
  rationale: A expressão funciona como fórmula de juramento. Em português, “pela minha vida” transmite esse valor com naturalidade, em vez de reproduzir de modo rígido o particípio grego.
- source_word: τὸ κράτος τῆς βασιλείας μου
  choice: pelo poder do meu reino
  rationale: κράτος indica poder, força ou domínio efetivo; “poder” é claro e mantém a relação genitiva com “meu reino”.
- source_word: λελάληκα
  choice: eu falei
  rationale: O perfeito grego apresenta a declaração já proferida e ainda válida. “Eu falei” é idiomático no contexto solene, embora o valor resultante também possa ser expresso por “tenho falado” em outros contextos.
- source_word: ποιήσω ταῦτα
  choice: farei estas coisas
  rationale: Preserva o futuro de ποιήσω e o plural explícito do demonstrativo ταῦτα sem especificar além do texto.
- source_word: ἐν χειρί μου
  choice: com a minha própria mão
  rationale: Mantém a imagem da mão e comunica a agência pessoal e direta indicada pela expressão grega.
theological_decisions:
- issue: Forma da autodeclaração régia semelhante a um juramento
  choice: pela minha vida e pelo poder do meu reino
  alternative: vivo eu e o poder do meu reino
  rationale: A construção grega é elíptica e solene. A tradução escolhida torna explícito em português o valor de juramento sem afirmar que o poder do reino esteja literalmente “vivo”; a nota conserva a forma e a ambiguidade do original.
translation_notes:
  register: Português atual, solene e inteligível, com boa legibilidade brasileira. A ordem e a formulação comunicam o tom de juramento régio, enquanto as notas preservam a sintaxe incomum e a imagem do grego.
