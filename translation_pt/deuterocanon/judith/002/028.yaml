  yaml_path: translation/deuterocanon/judith/002/028.yaml
  text: And fear and dread of him fell upon those living along the coast—those in Sidon and Tyre[a], those living in Assur and Ocina, and all those living in Jamnia[b]; and those living in Azotus and Ascalon were very greatly afraid of him.
translation:
  language: pt
  text: 'E o medo e o pavor que ele inspirava caíram sobre os habitantes do litoral: os que estavam em Sidom e Tiro, os habitantes de Assur e Oquina e todos os habitantes de Jâmnia; e os habitantes de Azoto e Ascalom[a] ficaram com muito medo dele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Azoto é o nome grego de Asdode; Ascalom é o nome grego de Asquelom.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέπεσεν
  choice: caíram sobre
  rationale: Mantém a imagem vívida de ἐπιπίπτω e concorda com o sujeito composto «o medo e o pavor».
- source_word: φόβος καὶ τρόμος αὐτοῦ
  choice: o medo e o pavor que ele inspirava
  rationale: A dupla exprime alarme intenso. A oração relativa explicita em português natural o genitivo objetivo αὐτοῦ sem atribuir uma causa além do que o contexto permite.
- source_word: τοὺς κατοικοῦντας τὴν παραλίαν
  choice: os habitantes do litoral
  rationale: Traduz de modo corrente tanto κατοικοῦντας quanto a região costeira indicada por παραλία.
- source_word: Σιδῶνι καὶ Τύρῳ
  choice: Sidom e Tiro
  rationale: Emprega as formas portuguesas tradicionais e reconhecíveis desses topônimos.
- source_word: Ἀσσούρ
  choice: Assur
  rationale: Conserva o nome de lugar em vez de interpretá-lo como a região mais ampla da Assíria.
- source_word: Ὀκεινὰ
  choice: Oquina
  rationale: Transliteração adaptada à ortografia portuguesa de um topônimo cuja identificação é incerta.
- source_word: Ἰεμνάν
  choice: Jâmnia
  rationale: Usa a forma portuguesa reconhecível do topônimo geralmente identificado como Jâmnia.
- source_word: Ἀζώτῳ καὶ Ἀσκάλωνι
  choice: Azoto e Ascalom
  rationale: Segue as formas helenizadas presentes no texto grego, adaptadas ao português; as equivalências hebraicas mais conhecidas são registradas em nota.
- source_word: ἐφοβήθησαν αὐτὸν σφόδρα
  choice: ficaram com muito medo dele
  rationale: Expressa em português natural o verbo com objeto e preserva a forte intensificação de σφόδρα.
