  text: And they too decided to destroy all flesh who had not followed the word of his mouth[a][b].
translation:
  language: pt
  text: E eles também decidiram destruir toda carne que não seguiu a palavra da boca dele.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «todas as pessoas» ou «toda a humanidade». O grego diz literalmente «toda carne», uma expressão bíblica mantida aqui.
    reason: lexical_alternative
  - marker: b
    text: Ou «a ordem saída da boca dele» ou «a ordem dada por ele».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: E eles também
  rationale: Preserva tanto a ligação com o contexto quanto a força aditiva e enfática de αὐτοί.
- source_word: ἔκριναν
  choice: decidiram
  rationale: Neste contexto narrativo, o verbo indica que chegaram a uma decisão, sem exigir a ideia mais formal de um decreto judicial.
- source_word: ὀλεθρεῦσαι
  choice: destruir
  rationale: Expressa diretamente a intenção de causar destruição, sem intensificar o grego com formulações como «aniquilar» ou «exterminar».
- source_word: πᾶσαν σάρκα
  choice: toda carne
  rationale: Mantém a expressão bíblica do grego e sua amplitude, ainda que, no contexto, provavelmente se refira a todas as pessoas visadas.
- source_word: οἳ οὐκ ἠκολούθησαν
  choice: que não tivesse seguido
  rationale: «Seguido» conserva a imagem verbal de ἀκολουθέω, ao passo que o subjuntivo mais-que-perfeito acomoda em português a referência a uma classe ainda a ser identificada segundo a ordem dada.
- source_word: τῷ λόγῳ
  choice: a palavra
  rationale: Conserva a amplitude de λόγος e, com «da boca dele», permite que o contexto comunique o sentido de ordem ou mandado.
- source_word: τοῦ στόματος αὐτοῦ
  choice: da boca dele
  rationale: Reproduz de modo natural em português o genitivo grego e preserva a vívida expressão semítica de uma palavra proferida.
theological_decisions:
- issue: Sentido de σάρξ numa expressão bíblica não paulina
  choice: toda carne
  alternative: todas as pessoas; toda a humanidade
  rationale: Aqui σάρξ integra uma expressão idiomática abrangente, não designa uma «natureza pecaminosa». Manter «carne» preserva a textura bíblica e evita introduzir uma interpretação teológica alheia ao contexto.
- issue: Força de λόγος no contexto de obediência
  choice: a palavra
  alternative: a ordem; o mandado
  rationale: O contexto favorece uma ordem falada, mas o substantivo grego continua lexicalmente amplo. A tradução mantém essa abertura, explicando a alternativa em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva os hebraísmos aparentes «toda carne» e «a palavra da boca dele», enquanto as notas esclarecem seu sentido contextual.
