  text: And you also must not transgress a single one of your lord’s words, but you shall surely carry out exactly as I have commanded you, and you shall not delay to do them.
translation:
  language: pt
  text: E você também não violará sequer uma das palavras do seu senhor, mas cumprirá plenamente tudo, exatamente como lhe ordenei, e não demorará a fazê-lo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ παραβήσῃ
  choice: não violará
  rationale: O verbo παραβαίνω expressa transgredir, violar ou ultrapassar uma ordem. “Não violará” mantém o sentido normativo e soa natural no contexto de uma ordem militar.
- source_word: ἓν τι τῶν ῥημάτων
  choice: sequer uma das palavras
  rationale: 'A formulação preserva a ênfase distributiva: nenhuma palavra ou determinação, nem mesmo uma só, poderá ser violada.'
- source_word: τοῦ κυρίου σου
  choice: do seu senhor
  rationale: κύριος designa aqui um superior humano na cadeia de comando. A forma minúscula “senhor” preserva esse referente sem sugerir o título divino.
- source_word: ἐπιτελῶν ἐπιτελέσεις
  choice: cumprirá plenamente
  rationale: A repetição do particípio e do verbo finito intensifica a exigência de execução completa. “Cumprirá plenamente” comunica essa ênfase sem reproduzir uma repetição pouco natural em português.
- source_word: καθότι προστέταχά σοι
  choice: exatamente como lhe ordenei
  rationale: καθότι indica correspondência precisa, e προστάσσω é apropriado para uma ordem dada por um superior.
- source_word: οὐ μακρυνεῖς τοῦ ποιῆσαι αὐτά
  choice: não demorará a fazê-lo
  rationale: Neste contexto, μακρύνω significa prolongar ou adiar a ação. O pronome retoma de modo natural, em português, o cumprimento de tudo o que foi ordenado.
theological_decisions:
- issue: Sentido de κύριος como título humano ou divino
  choice: seu senhor
  alternative: seu mestre
  rationale: O contexto identifica um superior humano, não o Senhor Deus. “Senhor”, em minúscula, conserva o valor do termo grego e se ajusta à relação hierárquica, enquanto “mestre” seria menos adequado ao cenário militar.
translation_notes:
  register: Português moderno, claro e digno, com futuro de valor imperativo. “Você” oferece ampla legibilidade brasileira; “sequer” e “plenamente” preservam a força enfática do grego sem tornar a frase artificial.
