  text: And you shall go out to meet all the land toward the west[b][a], because they disobeyed the word of my mouth.
translation:
  language: pt
  text: E você sairá ao encontro de toda a terra em direção ao oeste[a], porque desobedeceram à palavra da minha boca[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no oeste” ou “para o oeste”. A expressão grega pode indicar tanto direção quanto região.
    reason: lexical_alternative
  - marker: b
    text: A expressão “a palavra da minha boca” refere-se a uma ordem ou decreto pronunciado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελεύσῃ
  choice: você sairá
  rationale: O futuro médio de ἐξέρχομαι tem aqui, no discurso direto, força de ordem ou determinação. “Sairá” preserva o movimento básico sem explicitar além do grego o contexto militar.
- source_word: εἰς συνάντησιν
  choice: ao encontro de
  rationale: A expressão significa normalmente “sair ao encontro de”. No contexto, o encontro é hostil, mas a formulação preserva a relativa abertura lexical do grego.
- source_word: πάσῃ τῇ γῇ
  choice: toda a terra
  rationale: O singular γῇ com πᾶς é entendido coletivamente, como a totalidade de um território, e não distributivamente como “cada terra”.
- source_word: ἐπὶ δυσμᾶς
  choice: em direção ao oeste
  rationale: A locução pode indicar direção para o poente ou a região ocidental. “Em direção ao oeste” expressa naturalmente o valor direcional sem eliminar a alternativa geográfica.
- source_word: ἠπείθησαν
  choice: desobedeceram
  rationale: O aoristo de ἀπειθέω indica que não obedeceram ou se recusaram a acatar a ordem.
- source_word: τῷ ῥήματι τοῦ στόματός μου
  choice: à palavra da minha boca
  rationale: A tradução conserva a imagem enfática da ordem proferida pela boca, em vez de reduzi-la simplesmente a “minha ordem”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção próxima do grego. O futuro “sairá” mantém a força de determinação no discurso, e “ao encontro de” deixa que o contexto militar comunique a hostilidade sem inserir explicitamente “contra”.
