  yaml_path: translation/deuterocanon/judith/002/019.yaml
  text: And he himself and all his force set out on the march to go before King Nebuchadnezzar and to cover the whole face of the land toward the west with his chariots and horsemen and his chosen foot soldiers[a].
translation:
  language: pt
  text: E ele próprio partiu, com toda a sua força, em marcha, a fim de ir à frente do rei Nabucodonosor e cobrir toda a face da terra[a] em direção ao oeste com carros, cavaleiros e seus soldados de infantaria escolhidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda a face do país”. A palavra grega γῆ pode significar “terra” ou “país”; neste contexto, pode referir-se aos territórios atravessados durante o avanço militar para o oeste.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ... εἰς πορείαν
  choice: partiu ... para a campanha
  rationale: A combinação indica a saída para uma expedição militar. A formulação é natural em português e preserva tanto o movimento quanto o contexto bélico.
- source_word: πᾶσα ἡ δύναμις αὐτοῦ
  choice: toda a sua força
  rationale: δύναμις aqui designa a força militar, como mostram os carros, cavaleiros e soldados mencionados em seguida; “força” mantém a amplitude do grego sem restringi-la a “exército”.
- source_word: τοῦ προελθεῖν
  choice: a fim de ir à frente
  rationale: O infinitivo articular exprime finalidade, e προέρχομαι conserva aqui a ideia de preceder ou avançar diante de alguém.
- source_word: καλύψαι πᾶν τὸ πρόσωπον τῆς γῆς
  choice: cobrir toda a face da terra
  rationale: A tradução preserva a imagem espacial vívida do original, sem substituí-la pelo mais interpretativo “dominar” ou “invadir”.
- source_word: πρὸς δυσμαῖς
  choice: em direção ao oeste
  rationale: Expressa de modo claro e natural a direção ocidental indicada pelo grego.
- source_word: ἅρμασι καὶ ἱππεῦσι καὶ πεζοῖς ἐπιλέκτοις
  choice: com seus carros, cavaleiros e soldados de infantaria escolhidos
  rationale: Mantém as três categorias militares e traduz ἐπιλέκτοις como tropas selecionadas, sem introduzir o registro moderno de “elite”.
