  text: 'And he counted chosen men for battle formation[a], just as his lord had commanded him: one hundred twenty thousand, and twelve thousand mounted archers,'
translation:
  language: pt
  text: 'E contou homens escolhidos para a formação de batalha, conforme seu senhor lhe havia ordenado: cento e vinte mil, e doze mil arqueiros a cavalo,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρίθμησεν
  choice: contou
  rationale: Preserva o sentido concreto de contar ou enumerar, sem acrescentar a ideia mais específica de convocação militar.
- source_word: ἐκλεκτοὺς ἄνδρας
  choice: homens escolhidos
  rationale: Expressa tanto a seleção indicada por ἐκλεκτούς quanto o masculino plural explícito de ἄνδρας.
- source_word: εἰς παράταξιν
  choice: para a formação de batalha
  rationale: Comunica de modo claro o sentido militar de disposição ou ordem de combate.
- source_word: καθότι
  choice: conforme
  rationale: Indica que a ação foi realizada em conformidade com a ordem recebida.
- source_word: ὁ κύριος αὐτοῦ
  choice: seu senhor
  rationale: O referente é um superior humano; a inicial minúscula evita sugerir uma referência divina.
- source_word: εἰς μυριάδας δέκα δύο
  choice: cento e vinte mil
  rationale: Doze miríades equivalem exatamente a cento e vinte mil; a forma totalizada é mais clara em português moderno.
- source_word: ἱππεῖς τοξότας
  choice: arqueiros montados
  rationale: Expressa de modo idiomático que eram cavaleiros que combatiam com arco.
- source_word: μυρίους δισχιλίους
  choice: doze mil
  rationale: A expressão numérica grega soma dez mil e dois mil; o total direto é natural e exato.
theological_decisions:
- issue: Sentido de κύριος numa hierarquia militar humana
  choice: seu senhor
  alternative: seu mestre
  rationale: O contexto aponta claramente para o superior humano de Holofernes, não para Deus. “Senhor” em minúscula preserva o título hierárquico sem introduzir referência divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura mantém a continuidade narrativa e a vírgula final do fragmento-fonte. “Além de” esclarece que os doze mil arqueiros montados constituem um contingente adicional, como indica καί.
