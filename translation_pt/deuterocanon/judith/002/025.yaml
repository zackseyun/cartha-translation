  text: And he seized the territory of Cilicia[a], and cut down all who resisted him, and came as far as the borders of Japheth, to the south, opposite Arabia.
translation:
  language: pt
  text: E apoderou-se do território da Cilícia, abateu todos os que lhe resistiam e chegou até as fronteiras de Jafé[a], ao sul, diante da Arábia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “Jafé”. A localização é incerta; alguns intérpretes relacionam o nome a um lugar mais conhecido, mas aqui se preserva o próprio texto transmitido, sem emenda.
    reason: alternative_reading
lexical_decisions:
- source_word: κατελάβετο
  choice: apoderou-se
  rationale: O médio de καταλαμβάνω indica aqui a tomada de controle de um território; “apoderou-se” preserva a ideia de conquista forçada sem especificar além do grego.
- source_word: τὰ ὅρια τῆς Κιλικίας
  choice: o território da Cilícia
  rationale: Embora ὅρια designe literalmente limites ou fronteiras, neste primeiro uso funciona por metonímia para a extensão territorial da Cilícia.
- source_word: κατέκοψε
  choice: abateu
  rationale: O verbo evoca derrubar ou matar violentamente; “abateu” conserva a força militar da expressão em português natural e digno.
- source_word: πάντας τοὺς ἀντιστάντας αὐτῷ
  choice: todos os que lhe resistiam
  rationale: O particípio indica oposição ativa; a formulação comunica isso de modo claro, sem acrescentar quem eram os opositores.
- source_word: ἦλθεν ἕως ὁρίων
  choice: chegou até as fronteiras
  rationale: Neste segundo uso, ὅρια marca o limite geográfico alcançado e, por isso, é traduzido literalmente como “fronteiras”.
- source_word: Ἰάφεθ
  choice: Jafé
  rationale: Translitera a forma preservada pelo texto grego, usando a grafia portuguesa tradicional do nome, sem emendá-la para outro topônimo.
- source_word: τὰ πρὸς νότον
  choice: ao sul
  rationale: Expressa de maneira concisa e natural a localização ou orientação meridional indicada pela frase grega.
- source_word: κατὰ πρόσωπον τῆς Ἀραβίας
  choice: diante da Arábia
  rationale: O idiomatismo geográfico significa estar defronte ou em face de; “diante da Arábia” preserva essa relação espacial sem impor precisão cartográfica indevida.
