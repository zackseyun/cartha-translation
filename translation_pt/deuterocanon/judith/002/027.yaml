base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/002/027.yaml
  text: And he went down into the plain of Damascus in the days of the wheat harvest[a], and he set all their fields on fire; their flocks and herds he gave over to destruction, and he plundered their cities and stripped bare their plains, and struck down all their young men with the edge of the sword.
translation:
  language: pt
  text: E ele desceu à planície de Damasco no tempo da colheita do trigo e incendiou todos os campos deles. Entregou à destruição os rebanhos de ovelhas e de gado, saqueou as cidades deles, devastou por completo as suas planícies e matou todos os seus jovens homens ao fio da espada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pela boca da espada”, expressão idiomática que significa matar com a espada.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: desceu
  rationale: Preserva de modo natural o sentido direcional do verbo grego.
- source_word: πεδίον Δαμασκοῦ
  choice: planície de Damasco
  rationale: πεδίον designa terreno plano ou aberto, e o genitivo funciona como identificação geográfica.
- source_word: ἐν ἡμέραις θερισμοῦ πυρῶν
  choice: no tempo da colheita do trigo
  rationale: Expressa em português corrente a estação indicada pelo idiomatismo grego e mantém a referência específica ao trigo.
- source_word: ἐνέπρησεν πάντας τοὺς ἀγροὺς αὐτῶν
  choice: incendiou todos os campos deles
  rationale: Transmite a ação de atear fogo e entende ἀγροί como terras cultivadas.
- source_word: τὰ ποίμνια καὶ τὰ βουκόλια
  choice: os rebanhos de ovelhas e de gado
  rationale: Torna explícita e natural em português a distinção entre pequenos rebanhos e manadas bovinas.
- source_word: ἔδωκεν εἰς ἀφανισμόν
  choice: entregou à destruição
  rationale: Conserva a construção enfática do grego sem recorrer a linguagem excessivamente erudita.
- source_word: ἐσκύλευσεν
  choice: saqueou
  rationale: Expressa diretamente a tomada de despojos nas cidades.
- source_word: τὰ πεδία αὐτῶν ἐξελίκμησεν
  choice: devastou por completo as suas planícies
  rationale: O verbo evoca uma remoção total, como algo joeirado ou limpo por completo; a tradução comunica a devastação completa sem obscurecer o sentido.
- source_word: ἐπάταξεν πάντας τοὺς νεανίσκους αὐτῶν
  choice: matou todos os seus jovens
  rationale: No contexto bélico e com a expressão instrumental seguinte, ἐπάταξεν indica golpe fatal; νεανίσκους refere-se a jovens do sexo masculino.
- source_word: ἐν στόματι ῥομφαίας
  choice: ao fio da espada
  rationale: Emprega o equivalente idiomático português para a expressão literalmente formada com 'boca da espada'.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação narrativa do grego foi mantida, mas dividida em duas frases para evitar um período excessivamente longo. A nota foi posicionada após “espada”, onde de fato se encontra a expressão explicada.
