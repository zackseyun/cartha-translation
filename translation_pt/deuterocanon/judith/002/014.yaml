  text: And Holofernes went out from the presence of his lord, and he called all the nobles and the generals and overseers of the Assyrian army,
translation:
  language: pt
  text: Então Holofernes saiu da presença de seu senhor e chamou todos os poderosos, os generais e os supervisores do exército da Assíria,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Traduz diretamente o aoristo narrativo de ἐξέρχομαι, preservando a ideia concreta de movimento.
- source_word: ἀπὸ προσώπου
  choice: da presença de
  rationale: Mantém a expressão grega de matiz semítico e seu tom formal de corte, sem reduzi-la simplesmente a «de junto de».
- source_word: τοῦ κυρίου αὐτοῦ
  choice: de seu senhor
  rationale: κύριος designa aqui o superior humano de Holofernes; «senhor» conserva o título hierárquico e o contexto evita referência divina.
- source_word: ἐκάλεσεν
  choice: chamou
  rationale: Equivalente direto que não especifica além do texto se se tratou de convocação formal.
- source_word: δυνάστας
  choice: poderosos
  rationale: O substantivo designa homens de grande poder ou posição. «Poderosos» preserva a amplitude do termo, sem pressupor especificamente nobreza hereditária ou cargo governamental.
- source_word: στρατηγοὺς
  choice: generais
  rationale: Equivalente moderno claro para líderes militares neste contexto de hierarquia do exército.
- source_word: ἐπιστάτας
  choice: supervisores
  rationale: Preserva a noção de pessoas colocadas sobre outras em função de supervisão, sem atribuir uma patente militar específica.
- source_word: τῆς δυνάμεως Ἀσσούρ
  choice: do exército da Assíria
  rationale: δύναμις tem sentido militar de força ou exército; o genitivo com Ἀσσούρ é expresso naturalmente em português como pertencimento à Assíria.
- source_word: Ἀσσούρ
  choice: Assíria
  rationale: Neste sintagma, o nome indica o território ou império ao qual o exército pertence; «Assíria» é a forma portuguesa corrente.
theological_decisions:
- issue: Tradução de κύριος para um superior humano
  choice: seu senhor
  alternative: seu mestre
  rationale: O referente é o soberano humano de Holofernes, não Deus. «Senhor» preserva o título cortesão e a relação hierárquica sem introduzir uma distinção ausente do termo grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A coordenação e a vírgula final foram preservadas porque o versículo continua sintaticamente no seguinte. «Poderosos» conserva melhor a abrangência de δυνάστας do que «nobres».
