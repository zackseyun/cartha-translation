  text: And he encircled all the sons of Midian[a], and burned their encampments[b], and plundered their sheepfolds.
translation:
  language: pt
  text: E cercou todos os filhos de Midiã[a], incendiou os acampamentos deles e saqueou os currais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os midianitas”. O grego diz mais literalmente “todos os filhos de Midiã”.
    reason: lexical_alternative
  - marker: b
    text: Ou “cercados para animais”. O termo grego não especifica que fossem apenas para ovelhas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκύκλωσεν
  choice: cercou
  rationale: Expressa naturalmente o sentido de rodear ou envolver, preservando o contexto militar sem tornar obrigatória a ideia de um movimento circular completo.
- source_word: πάντας τοὺς υἱοὺς Μαδιάμ
  choice: todos os filhos de Midiã
  rationale: Mantém a forma literal e tradicional da expressão etnogeográfica grega; a nota oferece o equivalente idiomático.
- source_word: ἐνέπρησεν
  choice: incendiou
  rationale: Traduz com precisão a ação de atear fogo, sem acrescentar que houve destruição total.
- source_word: τὰ σκηνώματα
  choice: os acampamentos
  rationale: Representa os conjuntos de tendas ou habitações de um povo nômade, com sentido coletivo adequado ao contexto.
- source_word: ἐπρονόμευσεν
  choice: saqueou
  rationale: É o equivalente militar corrente para tomar bens como despojo.
- source_word: τὰς μάνδρας
  choice: os currais
  rationale: Designa de modo natural em português recintos destinados a animais, sem limitar indevidamente a referência a ovelhas.
