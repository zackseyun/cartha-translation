  text: And he cut down Phud and Lud[a], and he plundered all the sons of Rasses and the sons of Ishmael who were opposite the wilderness[c][b], toward the south of the Chaldeans.
translation:
  language: pt
  text: E derrotou Fud e Lud[a], e saqueou todos os filhos de Rasseis e os filhos de Ismael[b] que estavam diante do deserto[c], ao sul dos caldeus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Pute e Lud”, conforme grafias bíblicas mais conhecidas desses nomes.
    reason: lexical_alternative
  - marker: b
    text: “Os filhos de Ismael” também pode ser traduzido por “os ismaelitas”. O texto principal preserva a formulação genealógica do grego.
    reason: lexical_alternative
  - marker: c
    text: A expressão geográfica é concisa e também pode ser entendida como “que estavam em frente ao deserto, ao sul dos caldeus”.
    reason: alternative_reading
lexical_decisions:
- source_word: διέκοψεν
  choice: derrotou
  rationale: O verbo tem a força concreta de cortar ou destroçar; neste contexto militar, indica derrota devastadora. “Derrotou” comunica isso naturalmente em português sem especificar um massacre que o grego não explicita.
- source_word: τὸ Φοὺδ καὶ Λούδ
  choice: Fud e Lud
  rationale: São nomes étnicos ou geográficos, transliterados conforme as formas gregas Φούδ e Λούδ. Uma grafia bíblica alternativa é indicada em nota.
- source_word: ἐπρονόμευσεν
  choice: saqueou
  rationale: O verbo designa tomar despojos em guerra; “saqueou” preserva de modo claro e atual esse sentido militar e econômico.
- source_word: υἱοὺς πάντας Ῥασσεῖς
  choice: todos os filhos de Rasseis
  rationale: Mantém a formulação genealógico-étnica do grego e translitera o nome de identificação incerta, sem substituí-lo por uma paráfrase interpretativa.
- source_word: υἱοὺς Ἰσμαήλ
  choice: os filhos de Ismael
  rationale: Reproduz literalmente a expressão genealógica do grego; “os ismaelitas” é uma alternativa natural, registrada em nota.
- source_word: τοὺς κατὰ πρόσωπον τῆς ἐρήμου
  choice: que estavam diante do deserto
  rationale: κατὰ πρόσωπον expressa posição diante de, em frente de ou defronte a. A tradução conserva a relação espacial sem impor uma geografia mais precisa.
- source_word: πρὸς νότον τῆς Χαλδαίων
  choice: ao sul dos caldeus
  rationale: A expressão indica orientação ou localização para o sul em relação aos caldeus. “Ao sul dos caldeus” é natural em português e preserva a concisão do grego.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A sintaxe conserva o encadeamento narrativo e a concisão geográfica do grego, enquanto “derrotou” evita em português a estranheza e a possível ambiguidade de uma tradução excessivamente literal de διέκοψεν.
