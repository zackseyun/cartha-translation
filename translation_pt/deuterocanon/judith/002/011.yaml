  text: But against those who disobey, your eye shall not spare; you shall give them over to slaughter and plunder throughout all your land.
translation:
  language: pt
  text: Mas, quanto aos que desobedecerem, que o teu olho não tenha piedade; entrega-os à matança e ao saque por toda a tua terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπειθοῦντας
  choice: os que desobedecerem
  rationale: Expressa a recusa em obedecer no contexto da ordem dirigida ao comandante, mantendo a referência aberta a todos os resistentes.
- source_word: οὐ φείσεται ὁ ὀφθαλμός σου
  choice: que o teu olho não tenha piedade
  rationale: Preserva a imagem semítica do olho que não poupa, em formulação portuguesa compreensível e solene.
- source_word: εἰς φόνον
  choice: à matança
  rationale: φόνος aqui designa morte violenta ou massacre; “matança” reproduz a dureza da ordem sem restringi-la a um homicídio individual.
- source_word: ἁρπαγὴν
  choice: ao saque
  rationale: No contexto militar, indica espoliação ou pilhagem; “saque” é natural e preciso.
- source_word: ἐν πάσῃ τῇ γῇ σου
  choice: por toda a tua terra
  rationale: O uso distributivo de ἐν πάσῃ sustenta a ideia de extensão por todo o território, e não apenas de localização genérica.
theological_decisions:
- issue: Forma verbal de οὐ φείσεται
  choice: que o teu olho não tenha piedade
  alternative: o teu olho não terá piedade
  rationale: Embora a forma grega seja futura, no discurso imperativo ela funciona como ordem; a construção volitiva em português comunica essa força sem suavizar a expressão.
- issue: Agente de δοῦναι
  choice: entrega-os
  alternative: para entregá-los
  rationale: O infinitivo depende semanticamente da ordem anterior e especifica a ação exigida do destinatário; vertê-lo como imperativo coordenado produz português claro sem alterar o agente.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira. Mantém-se a imagem concreta do “olho” e a violência explícita do texto, sem paráfrase atenuante.
