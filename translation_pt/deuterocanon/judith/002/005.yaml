base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/002/005.yaml
  text: 'Thus says the great king[a], the lord of all the earth: Behold, you shall go out from my presence, and you shall take with yourself men confident in their strength, one hundred twenty thousand foot soldiers, and a multitude of horses with riders, one hundred twenty thousand.'
translation:
  language: pt
  text: 'Assim diz o grande rei, o senhor de toda a terra: “Eis que sairás da minha presença e levarás contigo homens que confiam na própria força, cento e vinte mil soldados de infantaria, e uma multidão de cavalos com seus cavaleiros, cento e vinte mil[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, “doze miríades”, isto é, 120.000.
    reason: Registra a forma numérica específica do texto grego, substituída no corpo por seu equivalente moderno mais compreensível.
lexical_decisions:
- source_word: Τάδε λέγει
  choice: Assim diz
  rationale: Preserva a fórmula solene de proclamação em português natural e corrente.
- source_word: ὁ βασιλεὺς ὁ μέγας
  choice: o grande rei
  rationale: Reproduz diretamente o título régio e seu tom elevado.
- source_word: ὁ κύριος πάσης τῆς γῆς
  choice: o senhor de toda a terra
  rationale: Mantém κύριος como título de autoridade, com inicial minúscula por se referir a um rei humano; πάσης τῆς γῆς tem alcance universal neste contexto.
- source_word: Ἰδοὺ
  choice: Eis que
  rationale: Conserva a força de destaque da expressão grega e se ajusta ao registro solene da ordem régia.
- source_word: ἐξελεύσῃ ἐκ τοῦ προσώπου μου
  choice: sairás da minha presença
  rationale: Expressa com naturalidade o idioma grego ligado à presença ou face do rei, sem perder o caráter formal da comissão.
- source_word: λήμψῃ μετὰ σεαυτοῦ
  choice: levarás contigo
  rationale: É a forma idiomática portuguesa de indicar que os homens acompanharão o comandante.
- source_word: ἄνδρας πεποιθότας ἐν ἰσχύι αὐτῶν
  choice: homens que confiam em sua força
  rationale: Preserva a ideia verbal de confiança ou segurança na própria capacidade militar, em vez de reduzi-la a uma simples descrição de homens fortes.
- source_word: πεζῶν εἰς χιλιάδας ἑκατὸν εἴκοσι
  choice: cento e vinte mil soldados de infantaria
  rationale: Torna explícito o sentido militar de πεζῶν e apresenta o número em forma portuguesa natural.
- source_word: πλῆθος ἵππων σὺν ἀναβάταις
  choice: uma multidão de cavalos com seus cavaleiros
  rationale: Mantém a imagem concreta do grego, que menciona separadamente os cavalos e aqueles que os montam.
- source_word: μυριάδας δέκα δύο
  choice: cento e vinte mil
  rationale: Converte para a numeração moderna a expressão grega 'doze miríades', cujo valor exato é 120.000; a forma original é registrada em nota.
theological_decisions:
- issue: Tradução de κύριος em referência a um governante humano
  choice: senhor
  alternative: soberano
  rationale: A inicial minúscula deixa claro que se trata da reivindicação de autoridade de um rei terreno, sem transformar o título em identificação divina, ao mesmo tempo que preserva a força de κύριος.
translation_notes:
  register: Português moderno, solene e legível, com futuro simples para refletir o caráter formal da ordem régia. A pontuação organiza os efetivos militares sem alterar a relação sintática do texto grego.
