  text: And I will lead their captives to the ends of all the earth[a][b].
translation:
  language: pt
  text: E levarei os seus cativos até os confins de toda a terra[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o seu cativeiro», se αἰχμαλωσίαν for entendido em sentido abstrato, em vez de se referir aos próprios cativos.
    reason: lexical_alternative
  - marker: b
    text: O grego γῆ pode significar «terra» em sentido local ou «mundo»; aqui se escolheu «terra» porque a expressão «até os confins» sugere uma pretensão de alcance mundial.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄξω
  choice: levarei
  rationale: Futuro de ἄγω, com o sentido de conduzir ou levar. «Levarei» é natural em português e expressa o deslocamento forçado dos cativos sem especificar indevidamente o modo.
- source_word: αἰχμαλωσίαν
  choice: os seus cativos
  rationale: O substantivo pode indicar tanto o estado de cativeiro como o conjunto de pessoas capturadas. Com o verbo «levar» e o possessivo αὐτῶν, a referência aos cativos é a leitura mais natural no contexto.
- source_word: ἐπὶ τὰ ἄκρα
  choice: até os confins
  rationale: A expressão designa os extremos ou lugares mais distantes. «Até os confins» conserva a amplitude geográfica e mantém um registro digno e compreensível.
- source_word: πάσης τῆς γῆς
  choice: de toda a terra
  rationale: γῆ pode significar «terra» em sentido local ou mundial. A construção com «os confins» favorece aqui a retórica de alcance universal, sem eliminar a ambiguidade lexical, que é registrada em nota.
