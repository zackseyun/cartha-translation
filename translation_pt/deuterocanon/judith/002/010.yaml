  yaml_path: translation/deuterocanon/judith/002/010.yaml
  text: But you[a], after going out, shall seize all their territory in advance for me, and they will surrender themselves to you; and you shall keep them for me until the day of their punishment.
translation:
  language: pt
  text: Mas tu, depois que saíres, tomarás de antemão para mim todo o território deles. Eles se entregarão a ti, e tu os guardarás para mim até o dia do castigo deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até o dia da repreensão deles” ou “até o dia da correção deles”. O termo grego ἐλεγμός pode indicar repreensão, censura ou correção punitiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: depois que saíres
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal. A construção explicita essa sequência em português natural.
- source_word: προκαταλήμψῃ
  choice: tomarás de antemão
  rationale: Preserva tanto a ideia militar de tomar posse como o valor antecipatório do prefixo προ-.
- source_word: πᾶν ὅριον αὐτῶν
  choice: todo o território deles
  rationale: Neste contexto militar, ὅριον designa melhor a região sob domínio deles do que apenas uma linha de fronteira.
- source_word: ἐκδώσουσίν σοι ἑαυτούς
  choice: eles se entregarão a ti
  rationale: Expressa naturalmente o sentido reflexivo de se renderem ou se colocarem nas mãos do comandante.
- source_word: διατηρήσεις
  choice: os guardarás
  rationale: Mantém o sentido amplo de conservar ou manter sob custódia, sem acrescentar uma modalidade específica não explicitada no grego.
- source_word: εἰς ἡμέραν ἐλεγμοῦ αὐτῶν
  choice: até o dia do castigo deles
  rationale: No contexto de ameaça militar e submissão, 'castigo' comunica a força punitiva mais provável, enquanto a nota preserva outras possibilidades lexicais.
theological_decisions:
- issue: Sentido de ἐλεγμός no contexto militar e judicial
  choice: castigo
  alternative: repreensão ou correção disciplinar
  rationale: A cena de conquista favorece um resultado punitivo, mas o substantivo também pode indicar censura verbal ou correção; a nota mantém essa tensão sem introduzir linguagem especificamente escatológica.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível no Brasil e compreensível internacionalmente. A repetição de “para mim” foi mantida por corresponder à ênfase do texto grego.
