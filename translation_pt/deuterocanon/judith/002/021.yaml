  text: And they advanced from Nineveh a journey of three days to the front of the plain of Baikteileth[a], and they encamped from Baikteileth near the mountain that is at the left hand of upper Cilicia.
translation:
  language: pt
  text: E avançaram de Nínive numa jornada de três dias, até defronte da planície de Baicteleth; e acamparam a partir de Baicteleth, perto do monte que fica à esquerda da Cilícia Superior.[a]
