lexical_decisions:
- source_word: ἐπῆλθον
  choice: avançaram
  rationale: No contexto do deslocamento de um exército, o verbo indica progressão ou marcha; “avançaram” preserva esse sentido sem acrescentar uma nuance militar mais forte do que o grego exige.
- source_word: ὁδὸν τριῶν ἡμερῶν
  choice: percorrendo uma jornada de três dias
  rationale: A expressão mede a distância pelo tempo de viagem. Esta formulação é clara em português e mantém o valor idiomático.
- source_word: ἐπὶ πρόσωπον τοῦ πεδίου
  choice: até diante da planície
  rationale: A expressão espacial significa estar diante, em frente ou defronte da planície. “Até diante da” conserva a imagem geográfica com naturalidade suficiente.
- source_word: Βαικτειλαίθ / Βαικτειλαὶθ
  choice: Baicteleth
  rationale: O topônimo é transliterado de modo legível em português e uniformizado nas duas ocorrências, apesar da pequena variação gráfica grega.
- source_word: ἐπεστρατοπέδευσαν
  choice: acamparam
  rationale: O verbo denota estabelecer acampamento, especialmente em contexto militar; “acamparam” é atual, claro e preciso.
- source_word: ἀπὸ Βαικτειλαὶθ
  choice: a partir de Baicteleth
  rationale: Mantém o sentido normal de ἀπό, “desde/a partir de”, sem corrigir silenciosamente a geografia aparentemente difícil.
- source_word: πλησίον τοῦ ὄρους
  choice: perto da montanha
  rationale: Tradução direta e natural da relação espacial e do substantivo singular.
- source_word: τοῦ ἐπʼ ἀριστερὰς
  choice: que fica à esquerda
  rationale: A formulação conserva a expressão direcional literal e evita substituí-la por uma orientação interpretativa, como “a oeste”.
- source_word: τῆς ἄνω Κιλικίας
  choice: da Cilícia Superior
  rationale: Trata-se de uma designação regional; a capitalização torna claro que “Superior” integra o nome geográfico.
