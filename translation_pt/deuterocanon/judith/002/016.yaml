- source_word: αὐτούς
  choice: os
  rationale: Pronome objeto que retoma as forças mencionadas anteriormente.
- source_word: ὃν τρόπον
  choice: da maneira como
  rationale: A expressão introduz uma comparação de modo e é preservada com clareza em português.
- source_word: πολέμου
  choice: para a guerra
  rationale: Expressa naturalmente a finalidade militar da formação, mantendo o sentido amplo de πόλεμος.
- source_word: πλῆθος
  choice: uma multidão
  rationale: Preserva o sentido lexical de grande número de pessoas sem especificá-lo indevidamente como “exército”.
- source_word: συντάσσεται
  choice: é posta em formação
  rationale: Em contexto militar, o verbo descreve a disposição ordenada de tropas; a formulação também preserva a voz passiva do grego.
