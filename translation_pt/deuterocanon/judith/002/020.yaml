  yaml_path: translation/deuterocanon/judith/002/020.yaml
  text: And a great mixed multitude went out with them[a], like locusts and like the sand of the earth, for there was no number because of their multitude.
translation:
  language: pt
  text: E uma grande multidão de gente diversa saiu com eles, como gafanhotos e como a areia da terra, pois, de tão numerosos, não havia como contá-los.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pois não havia número por causa da multidão deles”. A expressão grega significa que eram incontáveis.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολὺς ὁ ἐπίμικτος
  choice: uma grande multidão de gente diversa
  rationale: O adjetivo substantivado ὁ ἐπίμικτος designa coletivamente um grupo composto de pessoas de diferentes tipos. A formulação preserva tanto a grande quantidade indicada por πολὺς quanto a composição mista do grupo, em português natural.
- source_word: συνεξῆλθον αὐτοῖς
  choice: saiu com eles
  rationale: O verbo composto expressa movimento para fora em companhia de outros. “Saiu com eles” mantém esse sentido sem acrescentar a ideia especificamente militar de marchar.
- source_word: ὡς ἀκρίς
  choice: como gafanhotos
  rationale: O singular grego tem valor coletivo ou genérico; o plural em português comunica naturalmente a imagem de uma quantidade avassaladora.
- source_word: ὡς ἡ ἄμμος τῆς γῆς
  choice: como a areia da terra
  rationale: A tradução conserva de perto a imagem e o conhecido modo bíblico de expressar uma quantidade incontável, sem restringir γῆ a “país” ou “solo”.
- source_word: οὐ γὰρ ἦν ἀριθμὸς ἀπὸ πλήθους αὐτῶν
  choice: pois, de tão numerosos, não havia como contá-los
  rationale: A expressão grega afirma literalmente que não havia número por causa da multidão deles. A formulação portuguesa transmite com clareza o sentido idiomático de que eram incontáveis, preservando a relação causal.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Gente diversa” evita o tom potencialmente pejorativo de “multidão heterogênea” ou “turba”, enquanto preserva a composição mista indicada pelo grego.
