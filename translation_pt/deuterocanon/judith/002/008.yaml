  text: And their wounded will fill their ravines and the wadis, and a river overflowing will be filled with their dead;
translation:
  language: pt
  text: E os feridos deles encherão suas ravinas e as torrentes[a], e um rio transbordante se encherá dos seus mortos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os leitos das torrentes” ou “os canais das torrentes”. O termo grego pode se referir a uma torrente sazonal e, por extensão, ao seu leito ou canal.
    reason: lexical_alternative
lexical_decisions:
- source_word: τραυματίαι
  choice: os feridos
  rationale: O substantivo designa as pessoas que foram feridas. “Os feridos” é conciso, natural e não amplia o sentido para todas as baixas.
- source_word: πληρώσουσιν
  choice: encherão
  rationale: Reproduz diretamente o futuro de πληρόω e conserva a imagem vívida do texto.
- source_word: φάραγγας
  choice: ravinas
  rationale: O termo indica ravinas ou desfiladeiros; “ravinas” é claro e mais específico que “vales”.
- source_word: χειμάρρους
  choice: leitos de torrentes
  rationale: χείμαρρος pode indicar uma torrente sazonal ou o canal por onde ela corre. “Leitos de torrentes” comunica esse cenário geográfico com mais clareza que o empréstimo “uádis” para leitores comuns.
- source_word: ποταμὸς ἐπικλύζων
  choice: um rio transbordante
  rationale: Mantém a imagem de um rio que inunda ou transborda, sem explicar além do grego.
- source_word: τοῖς νεκροῖς αὐτῶν
  choice: de seus mortos
  rationale: Expressa de modo idiomático que o rio ficará cheio dos mortos pertencentes ao grupo mencionado, preservando a força sombria de νεκροί.
