base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/002/001.yaml
  text: And in the eighteenth year[a], on the twenty-second day of the first month, a word came in the house of Nebuchodonosor king of the Assyrians, to take vengeance on all the land[c][b], just as he had spoken.
translation:
  language: pt
  text: E, no décimo oitavo ano, no vigésimo segundo dia do primeiro mês, houve uma palavra[c] na casa[a] de Nabucodonosor, rei dos assírios, para tomar vingança contra toda a terra[b], conforme ele havia dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no palácio” ou “na corte de Nabucodonosor”. O grego diz literalmente “casa”, termo que também pode designar a residência real ou a corte.
    reason: lexical_alternative
  - marker: b
    text: Ou “todo o território”. A palavra grega γῆ pode significar “terra”, “território” ou “mundo”; neste contexto, pode ter sentido territorial.
    reason: lexical_alternative
  - marker: c
    text: 'Também pode ser entendido como “foi emitido um decreto” ou “foi resolvida uma questão”. O grego diz mais literalmente: “houve uma palavra”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ ἔτει τῷ ὀκτωκαιδεκάτῳ
  choice: no décimo oitavo ano
  rationale: Reproduz de modo natural em português a indicação temporal formal do grego.
- source_word: δευτέρᾳ καὶ εἰκάδι τοῦ πρώτου μηνός
  choice: no vigésimo segundo dia do primeiro mês
  rationale: A expressão ordinal grega designa o vigésimo segundo dia; a formulação explicita o dia para o leitor moderno.
- source_word: ἐγένετο λόγος
  choice: houve uma decisão
  rationale: No contexto da corte, λόγος pode indicar uma deliberação ou decisão. A formulação é natural em português, enquanto a nota conserva tanto a literalidade de “houve uma palavra” quanto a possibilidade mais específica de um decreto.
- source_word: ἐν οἴκῳ Ναβουχοδονοσὸρ
  choice: na casa de Nabucodonosor
  rationale: Mantém o sentido básico de οἶκος sem decidir no texto principal entre residência real, palácio e corte.
- source_word: βασιλέως Ἀσσυρίων
  choice: rei dos assírios
  rationale: Segue diretamente o título real expresso pelo genitivo grego.
- source_word: ἐκδικῆσαι
  choice: de exercer vingança contra
  rationale: Expressa o valor vingativo do infinitivo sem acrescentar explicitamente o reflexivo “vingar-se”, ausente do grego.
- source_word: πᾶσαν τὴν γῆν
  choice: toda a terra
  rationale: Preserva a amplitude e a ambiguidade lexical de γῆ, que pode designar terra, território ou o mundo terrestre.
- source_word: καθὼς ἐλάλησεν
  choice: conforme ele havia dito
  rationale: Retoma de maneira clara e natural a declaração anterior de Nabucodonosor.
theological_decisions:
- issue: Se ἐγένετο λόγος deve ser especificado como a emissão formal de um decreto
  choice: houve uma decisão
  alternative: houve uma palavra; foi emitido um decreto
  rationale: O contexto favorece uma resolução régia, mas o grego não determina se se tratava de decisão interna, ordem falada ou edito formal; a nota mantém abertas essas possibilidades.
- issue: Se γῆ deve ser entendido como território limitado ou como toda a terra
  choice: toda a terra
  alternative: todo o território; o mundo inteiro
  rationale: A expressão portuguesa mantém a ambiguidade do grego; o contexto pode favorecer o sentido territorial, sem exigir que ele seja imposto no texto.
- issue: Se ἐκδικῆσαι deve receber sentido reflexivo explícito
  choice: exercer vingança contra
  alternative: vingar-se de
  rationale: A construção comunica a vingança pretendida sem inserir no texto um pronome reflexivo que o grego não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem da data foi preservada, e “Nabucodonosor” segue a forma portuguesa tradicional. As notas registram as ambiguidades reais de οἶκος, λόγος e γῆ sem sobrecarregar o texto principal.
