lexical_decisions:
- source_word: στερᾶς
  choice: fortalezas
  rationale: No contexto militar, a forma se refere a lugares fortificados ou pontos defensivos. “Fortalezas” é claro, concreto e adequado ao fragmento que parece concluir o versículo anterior.
- source_word: ἄνω Κιλικίας
  choice: Cilícia superior
  rationale: ἄνω tem sentido geográfico, indicando a parte alta da região. A forma descritiva “Cilícia superior” é natural em português.
- source_word: δύναμιν
  choice: forças
  rationale: Neste contexto, δύναμις designa o conjunto das forças militares, posteriormente especificadas como infantaria, cavaleiros e carros.
- source_word: πεζοὺς
  choice: soldados de infantaria
  rationale: O termo designa combatentes a pé. “Soldados de infantaria” é explícito e imediatamente compreensível.
- source_word: ἱππεῖς
  choice: cavaleiros
  rationale: O termo se refere a combatentes montados. “Cavaleiros” preserva a imagem concreta do grego sem impor uma organização militar posterior.
- source_word: ἅρματα
  choice: carros de guerra
  rationale: Em contexto militar, ἅρματα são carros empregados em combate. Em português moderno, “carros de guerra” evita que “carros” seja entendido como automóveis.
- source_word: ἔλαβεν
  choice: levou consigo
  rationale: Embora o verbo signifique literalmente “tomou”, aqui indica que ele fez suas forças acompanhá-lo. “Levou consigo” expressa naturalmente esse movimento em português.
- source_word: ἀπῆλθεν
  choice: partiu
  rationale: O verbo marca a saída do local anterior. “Partiu” é conciso, natural e preserva a ideia de afastamento.
- source_word: ὀρεινήν
  choice: região montanhosa
  rationale: O adjetivo substantivado designa uma área de montanhas ou terras altas. “Região montanhosa” preserva a referência geográfica sem especificar um território não nomeado.
