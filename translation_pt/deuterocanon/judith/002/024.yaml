base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/002/024.yaml
  text: And he crossed the Euphrates and passed through Mesopotamia[a], and he tore down all the high cities along the torrent Abrona[b], until he came to the sea.
translation:
  language: pt
  text: Ele atravessou o Eufrates, percorreu a Mesopotâmia e abriu brechas[a] em todas as cidades altas situadas ao longo da torrente de Abrona[b], até chegar ao mar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “demoliu”. O verbo grego significa literalmente “escavou através” e, neste contexto militar, pode descrever a abertura de brechas ou a destruição de cidades.
    reason: lexical_alternative
  - marker: b
    text: A “torrente de Abrona” reproduz um nome de lugar presente no grego; sua identificação geográfica exata é incerta.
    reason: cultural_note
lexical_decisions:
- source_word: παρῆλθεν
  choice: atravessou
  rationale: Com “o Eufrates” como objeto em uma narrativa de viagem, indica a travessia do rio, e não apenas passar ao lado dele.
- source_word: διῆλθεν
  choice: percorreu
  rationale: Expressa movimento através da região da Mesopotâmia; “percorreu” é natural em português e mantém a ideia de travessia.
- source_word: διέσκαψε
  choice: abriu brechas
  rationale: O verbo significa literalmente “escavar através” e, aplicado a cidades em campanha militar, sugere romper ou minar suas defesas. “Abriu brechas” conserva a imagem do grego sem definir de modo excessivo se houve destruição completa.
- source_word: πόλεις τὰς ὑψηλάς
  choice: cidades altas
  rationale: Mantém o sentido literal de ὑψηλάς e a possível referência a cidades situadas em lugares elevados, sem acrescentar explicitamente “fortificadas”.
- source_word: χειμάρρου
  choice: torrente
  rationale: Designa um curso de água sazonal ou impetuoso; “torrente” preserva o caráter geográfico sem recorrer ao termo técnico “uádi”.
- source_word: Ἀβρωνᾶ
  choice: Abrona
  rationale: Translitera o topônimo grego e deixa em aberto sua identificação geográfica exata.
- source_word: ἕως τοῦ ἐλθεῖν ἐπὶ θάλασσαν
  choice: até chegar ao mar
  rationale: Reproduz de modo claro o ponto final do percurso indicado pela construção grega.
