  text: And he took camels and donkeys and mules for their baggage[a], a very great multitude, and sheep and cattle and goats for their provisions, of which there was no number[c][b],
translation:
  language: pt
  text: E levou camelos, jumentos e mulas para a bagagem deles[a], uma multidão muito grande, e ovelhas, bois e cabras para o seu abastecimento[b], em número incontável[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o equipamento deles”. O termo grego pode indicar bagagem, aprestos ou equipamento.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para as suas provisões”. O termo grego pode significar preparação ou suprimentos e, neste contexto, provavelmente se refere ao fornecimento de alimento.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “dos quais não havia número”, expressão que significa que eram inúmeros.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν
  choice: levou
  rationale: No contexto narrativo e logístico, indica que ele levou consigo os animais; não há foco em apreensão violenta.
- source_word: καμήλους καὶ ὄνους καὶ ἡμιόνους
  choice: camelos, jumentos e mulas
  rationale: Equivalentes correntes e precisos para os três tipos de animais de carga.
- source_word: εἰς τὴν ἀπαρτίαν αὐτῶν
  choice: para transportar a bagagem deles
  rationale: ἀπαρτία aponta para aprestos, equipamento ou bagagem. Com animais de carga, esta formulação explicita naturalmente a função logística sem restringir em excesso o sentido.
- source_word: πλῆθος πολὺ σφόδρα
  choice: em quantidade extremamente grande
  rationale: Reproduz a forte intensificação quantitativa de πολὺ σφόδρα em português natural.
- source_word: πρόβατα καὶ βόας καὶ αἶγας
  choice: ovelhas, bois e cabras
  rationale: Termos usuais para o gado destinado ao abastecimento; 'bois' corresponde diretamente a βόας neste contexto pecuário.
- source_word: εἰς τὴν παρασκευὴν αὐτῶν
  choice: para o seu abastecimento
  rationale: παρασκευή pode designar preparação, provisões ou suprimentos; a lista de animais de criação indica abastecimento alimentar.
- source_word: ὧν οὐκ ἦν ἀριθμός
  choice: que eram incontáveis
  rationale: Transmite em português corrente o idiomatismo grego literal 'dos quais não havia número'.
