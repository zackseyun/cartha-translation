  text: and provisions for every man in abundance[a], and very much gold and silver from the king’s house.
translation:
  language: pt
  text: e provisões em abundância para cada homem, além de muitíssimo ouro e prata da casa do rei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do tesouro do rei” ou “da casa real”; literalmente, “da casa do rei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισιτισμὸν
  choice: provisões
  rationale: O substantivo designa abastecimento, especialmente de alimentos; “provisões” mantém essa amplitude e se ajusta ao contexto militar sem especificar “rações”.
- source_word: παντὶ ἀνδρὶ
  choice: para cada homem
  rationale: Reproduz a formulação distributiva masculina do grego. Embora o contexto provavelmente se refira aos combatentes, o texto não diz explicitamente “soldado”.
- source_word: εἰς πλῆθος
  choice: em abundância
  rationale: Expressa de modo natural a ideia idiomática de grande quantidade.
- source_word: χρυσίον καὶ ἀργύριον
  choice: ouro e prata
  rationale: Mantém os nomes dos metais preciosos sem acrescentar a noção não explícita de dinheiro.
- source_word: ἐξ οἴκου βασιλέως
  choice: da casa do rei
  rationale: Conserva a expressão concreta e potencialmente ambígua do grego, sem restringi-la a “tesouro” ou “palácio”.
- source_word: σφόδρα
  choice: muitíssimo
  rationale: Intensifica naturalmente, em português, a grande quantidade de ouro e prata.
