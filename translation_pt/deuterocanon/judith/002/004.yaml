  yaml_path: translation/deuterocanon/judith/002/004.yaml
  text: And it happened[a], when he had finished his plan, that Nebuchadnezzar king of the Assyrians called Holofernes, the commander-in-chief of his forces, who was second after him, and said to him[c][b],
translation:
  language: pt
  text: 'E aconteceu que, quando concluiu seu plano[a], Nabucodonosor, rei dos assírios, chamou Holofernes, comandante-em-chefe de suas forças[b], que ocupava o segundo lugar depois dele[c], e lhe disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «seu propósito» ou «sua deliberação» (τὴν βουλὴν αὐτοῦ).
    reason: lexical_alternative
  - marker: b
    text: Ou «general»; o termo grego (ἀρχιστράτηγον) sugere o mais alto posto de comando militar.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, «sendo o segundo depois dele», isto é, ocupando posição imediatamente inferior à do rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο
  choice: E aconteceu que
  rationale: Preserva a fórmula narrativa grega em português atual e digno, sem recorrer a uma expressão arcaica.
- source_word: ὡς συνετέλεσεν
  choice: quando concluiu
  rationale: Expressa tanto a relação temporal quanto a ideia de levar algo à conclusão.
- source_word: τὴν βουλὴν αὐτοῦ
  choice: seu plano
  rationale: No contexto político-militar, «plano» comunica com naturalidade a intenção deliberada de βουλή, sem eliminar suas possíveis nuances de propósito ou deliberação.
- source_word: ἐκάλεσεν
  choice: chamou
  rationale: Tradução direta e natural; o contexto régio já comunica que se trata de uma convocação com autoridade.
- source_word: Ναβουχοδονοσὸρ βασιλεὺς Ἀσσυρίων
  choice: Nabucodonosor, rei dos assírios
  rationale: Mantém a aposição e a designação étnica explícita do grego, usando a forma portuguesa tradicional do nome.
- source_word: τὸν Ὀλοφέρνην
  choice: Holofernes
  rationale: Emprega a forma consagrada e amplamente reconhecível do nome em português.
- source_word: ἀρχιστράτηγον
  choice: comandante-chefe
  rationale: Comunica o posto militar máximo indicado pelo composto grego de maneira clara para leitores modernos.
- source_word: τῆς δυνάμεως αὐτοῦ
  choice: de suas forças
  rationale: O contexto militar exige o sentido de efetivo ou poderio militar de δύναμις; «forças» preserva sua abrangência.
- source_word: δεύτερον ὄντα μετʼ αὐτόν
  choice: que ocupava o segundo lugar depois dele
  rationale: Torna explícita a posição hierárquica de Holofernes imediatamente abaixo do rei, permanecendo próxima da construção grega.
- source_word: καὶ εἶπεν πρὸς αὐτόν
  choice: 'e lhe disse:'
  rationale: É a formulação portuguesa natural para introduzir o discurso direto que segue; os dois-pontos sinalizam essa continuação.
