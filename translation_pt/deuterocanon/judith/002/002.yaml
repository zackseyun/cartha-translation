  text: And he summoned all his attendants and all his nobles[a], and he set before them the secret of his plan[b], and from his own mouth he declared all the evil of the land.
translation:
  language: pt
  text: E ele convocou todos os seus servidores e todos os seus nobres, expôs diante deles o segredo de seu plano[a] e, de sua própria boca, declarou todo o mal da terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “revelou-lhes o mistério de seu conselho”. Aqui, μυστήριον provavelmente significa uma questão secreta ou um plano confidencial, e não um “mistério” em sentido teológico técnico.'
    reason: lexical_alternative
  - marker: b
    text: A oração grega é difícil. O verbo pode, em outros contextos, significar “levar a termo”, mas a expressão “de sua própria boca” favorece o sentido de expor ou declarar plenamente. “O mal da terra” também pode referir-se ao mal contra a terra, e não necessariamente à maldade da própria terra.
    reason: alternative_reading
lexical_decisions:
- source_word: συνεκάλεσεν
  choice: convocou
  rationale: O verbo composto indica chamar pessoas para que se reúnam; “convocou” conserva tanto a ideia de reunião quanto a autoridade de quem chama.
- source_word: θεράποντας
  choice: servidores
  rationale: No contexto da corte, o termo designa pessoas a serviço do rei, sem exigir a condição mais forte de escravos. “Servidores” é claro e natural em português.
- source_word: μεγιστᾶνας
  choice: nobres
  rationale: Refere-se aos homens de posição elevada na corte ou no reino. “Nobres” é acessível e mantém o registro régio.
- source_word: ἔθετο μετʼ αὐτῶν τὸ μυστήριον τῆς βουλῆς αὐτοῦ
  choice: expôs diante deles o segredo de seu plano
  rationale: A expressão comunica que ele compartilhou ou apresentou uma questão confidencial aos cortesãos. “Segredo” evita atribuir a μυστήριον um sentido teológico técnico, e “plano” expressa naturalmente βουλή neste contexto deliberativo.
- source_word: συνετέλεσεν
  choice: declarou
  rationale: Embora o verbo normalmente tenha o sentido de completar ou levar a termo, a expressão “de sua própria boca” favorece aqui a ideia de apresentar verbalmente a matéria por inteiro. A nota registra a dificuldade.
- source_word: πᾶσαν τὴν κακίαν τῆς γῆς
  choice: todo o mal referente à terra
  rationale: A construção genitiva é ampla e pode indicar o mal da terra, o mal a respeito dela ou o mal planejado contra ela. “Referente à terra” mantém aberta essa relação sem caracterizar necessariamente a própria terra como má.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: de sua própria boca
  rationale: A expressão ressalta que a declaração procedeu diretamente do próprio rei; a formulação portuguesa preserva essa ênfase.
theological_decisions:
- issue: Sentido de μυστήριον no contexto régio
  choice: segredo
  alternative: mistério
  rationale: O contexto é o de uma deliberação confidencial da corte, não o de um mistério teológico técnico.
- issue: Relação entre o mal e a terra em κακίαν τῆς γῆς
  choice: mal referente à terra
  alternative: maldade da terra / mal contra a terra
  rationale: O genitivo grego não determina sem ambiguidade se o mal pertence à terra, diz respeito a ela ou será praticado contra ela; a tradução e a nota preservam essa tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A coordenação inicial com “E” preserva a ligação narrativa do grego. As notas mantêm as ambiguidades lexicais e sintáticas sem impor uma leitura doutrinária.
