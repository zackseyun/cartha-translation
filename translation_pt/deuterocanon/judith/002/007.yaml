  text: and to prepare earth and water[a], because I will go out against them in my wrath, and I will cover the whole face of the earth with the feet of my army, and I will give them over to plunder by them.
translation:
  language: pt
  text: e que preparem terra e água[a], porque sairei contra eles na minha ira, cobrirei toda a face da terra com os pés do meu exército e os entregarei como saque às minhas tropas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «terra e água» provavelmente se refere a sinais de submissão exigidos por um rei conquistador.
    reason: cultural_note
lexical_decisions:
- source_word: ἑτοιμάζειν
  choice: que preparem
  rationale: O infinitivo dá continuidade à sequência de ordens. A forma verbal com sujeito indeterminado pelo contexto soa natural em português e preserva o sentido amplo de preparar.
- source_word: γῆν καὶ ὕδωρ
  choice: terra e água
  rationale: Mantém os substantivos concretos do grego e deixa para a nota a provável conotação cultural de submissão.
- source_word: ἐξελεύσομαι
  choice: sairei
  rationale: Reproduz diretamente o verbo grego; o complemento «contra eles» torna claro o contexto militar sem acrescentar «marcharei».
- source_word: ἐν θυμῷ μου
  choice: na minha ira
  rationale: «Ira» comunica a intensidade de θυμός e se ajusta ao tom elevado de uma ameaça régia.
- source_word: καλύψω πᾶν τὸ πρόσωπον τῆς γῆς
  choice: cobrirei toda a face da terra
  rationale: Preserva a imagem e o conhecido idiomatismo bíblico «face da terra», bem como a amplitude retórica da expressão.
- source_word: τοῖς ποσὶν τῆς δυνάμεώς μου
  choice: com os pés do meu exército
  rationale: Neste contexto, δύναμις designa a força militar. «Exército» é claro e idiomático, enquanto «pés» conserva a imagem concreta do avanço que cobre a terra.
- source_word: δώσω αὐτοὺς εἰς διαρπαγὴν αὐτοῖς
  choice: os entregarei para serem saqueados por ele
  rationale: A formulação conserva o sentido de entregar os povos ao saque e representa os dois referentes pronominais. O singular «ele» retoma naturalmente «meu exército» em português, evitando a ambiguidade artificial de dois «eles» com referentes distintos.
theological_decisions:
- issue: Força idiomática de «terra e água»
  choice: Conservar a expressão literal no texto e explicar em nota sua provável conotação de submissão.
  alternative: Traduzir interpretativamente como «sinais de submissão».
  rationale: Embora a expressão provavelmente evoque uma exigência ritual ou política de submissão, o grego apresenta apenas os dois substantivos concretos. A nota comunica o pano de fundo sem transformar uma inferência histórica em conteúdo explícito do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se as imagens bíblicas «face da terra» e «pés do meu exército» sem tornar a sintaxe desnecessariamente rígida.
