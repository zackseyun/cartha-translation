  text: And now tell me why you fled from them and came to us[a]; for you have come for deliverance.
translation:
  language: pt
  text: E agora, diga-me por que você fugiu deles e veio até nós; pois veio para o livramento[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “para a salvação” ou “para ficar a salvo”; grego: “para livramento/salvação” (εἰς σωτηρίαν).'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: agora
  rationale: Adverte temporal que marca a passagem imediata para a pergunta.
- source_word: λέγε μοι
  choice: diga-me
  rationale: Forma idiomática e respeitosa em português para o imperativo grego com objeto indireto.
- source_word: τίνος ἕνεκεν
  choice: por que
  rationale: Expressa naturalmente a pergunta pela causa ou motivo.
- source_word: ἀπέδρας
  choice: você fugiu
  rationale: Preserva a ideia de fugir para longe, sem acrescentar que a fuga tenha sido bem-sucedida.
- source_word: ἀπʼ αὐτῶν
  choice: deles
  rationale: Indica de modo direto a separação em relação ao grupo de origem de Judite.
- source_word: ἦλθες πρὸς ἡμᾶς
  choice: veio até nós
  rationale: Reproduz o movimento em direção ao grupo do falante com naturalidade em português.
- source_word: ἥκεις
  choice: veio
  rationale: No contexto, comunica a chegada já realizada; o resultado presente fica implícito na fala.
- source_word: εἰς σωτηρίαν
  choice: para a salvação
  rationale: Mantém de perto a construção grega e a amplitude semântica de σωτηρία, que pode indicar salvação, livramento ou segurança.
theological_decisions:
- issue: Sentido de σωτηρία em contexto narrativo
  choice: para a salvação
  alternative: para o livramento; para ficar a salvo
  rationale: A formulação conserva a tensão entre o sentido amplo de salvação e o provável sentido contextual de preservação ou livramento, sem reduzir silenciosamente o alcance do termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento por “você” evita a artificialidade de “tu” em grande parte do Brasil, e “diga-me” mantém a fala direta em registro cuidado.
