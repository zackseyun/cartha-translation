base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/013.yaml
  text: And the firstfruits of the grain and the tithes of the wine and of the oil[a], which they had set aside, having consecrated them for the priests who stand in Jerusalem before the face of our God—they have decided to consume[b], though it is not permitted for any of the people even to touch them with their hands.
translation:
  language: pt
  text: E as primícias do cereal e os dízimos do vinho e do azeite, que haviam reservado e consagrado para os sacerdotes que estão em Jerusalém, diante da face do nosso Deus[a], decidiram consumi-los, embora não seja permitido a ninguém do povo sequer tocá-los com as mãos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na presença do nosso Deus”. O grego diz mais literalmente “diante da face do nosso Deus”, expressão vívida que indica estar na presença de Deus.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser traduzida por “não é lícito” ou “não é apropriado” que alguém do povo sequer lhes toque com as mãos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαρχὰς τοῦ σίτου
  choice: as primícias do cereal
  rationale: “Primícias” preserva o sentido cultual da primeira porção oferecida; “cereal” mantém o alcance genérico possível de σῖτος sem restringi-lo a trigo.
- source_word: τὰς δεκάτας τοῦ οἴνου καὶ τοῦ ἐλαίου
  choice: os dízimos do vinho e do azeite
  rationale: “Dízimos” é o termo cultual natural para δεκάτας, e “azeite” expressa idiomaticamente o óleo de oliva implícito no contexto.
- source_word: ἃ ἐφυλάξαν ἁγιάσαντες
  choice: que reservaram e consagraram
  rationale: No contexto, ἐφυλάξαν indica que as porções foram guardadas ou reservadas, enquanto ἁγιάσαντες indica sua dedicação ao uso sagrado. A coordenação é natural em português e conserva ambas as ações.
- source_word: τοῖς ἱερεῦσιν τοῖς παρεστηκόσιν
  choice: aos sacerdotes que permanecem
  rationale: O dativo indica destinação aos sacerdotes. “Permanecem” conserva a imagem de παρίστημι, de estar postado ou presente, sem transformar explicitamente a expressão em “servem”.
- source_word: ἀπέναντι τοῦ προσώπου τοῦ θεοῦ ἡμῶν
  choice: diante da face do nosso Deus
  rationale: Mantém a expressão grega vívida e de caráter semítico, compreensível em português, em vez de reduzi-la silenciosamente a “diante de Deus”.
- source_word: κεκρίκασιν ἐξαναλῶσαι
  choice: decidiram consumi-los
  rationale: κεκρίκασιν comunica uma decisão já tomada; ἐξαναλῶσαι indica consumir ou esgotar completamente os produtos, aqui provavelmente como provisões.
- source_word: οὐδὲ ταῖς χερσὶν καθῆκεν ἅψασθαι
  choice: não seja permitido ... sequer tocá-los com as mãos
  rationale: A formulação comunica a força normativa de καθῆκεν no contexto cultual, retendo a ênfase concreta do grego nas mãos.
- source_word: οὐδένα τῶν ἐκ τοῦ λαοῦ
  choice: a ninguém do povo
  rationale: Preserva o contraste entre os sacerdotes e qualquer pessoa pertencente ao povo, sem acrescentar uma distinção social como “povo comum”.
theological_decisions:
- issue: Status cultual dos produtos destinados aos sacerdotes
  choice: Os produtos são apresentados como já reservados e consagrados aos sacerdotes em Jerusalém, ficando vedados ao restante do povo.
  alternative: Entender que foram apenas armazenados para uso posterior, sem consagração formal.
  rationale: A combinação de ἐφυλάξαν, ἁγιάσαντες, a destinação sacerdotal e a proibição de tocá-los favorece claramente um estatuto sagrado formal.
- issue: Sentido de os sacerdotes estarem diante de Deus
  choice: Preservar a expressão concreta “diante da face do nosso Deus”.
  alternative: Verter funcionalmente como “que servem na presença do nosso Deus”.
  rationale: O grego permite perceber o serviço cultual, mas não o explicita com um verbo equivalente a “servir”; a tradução mantém a imagem e evita resolver sua nuance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva termos cultuais reconhecíveis (“primícias”, “dízimos”, “consagraram”) e a imagem solene “diante da face”, usando notas para registrar alternativas sem sobrecarregar o texto.
