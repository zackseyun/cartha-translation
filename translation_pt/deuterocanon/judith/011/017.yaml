base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/017.yaml
  text: for your servant is God-fearing[a], and serves the God of heaven night and day. And now I will remain with you, my lord, and your servant will go out by night into the valley, and I will pray to God[b], and he will tell me when they have committed their sin.
translation:
  language: pt
  text: pois a tua serva[a] teme a Deus e serve ao Deus do céu noite e dia. Agora permanecerei junto de ti, meu senhor, e a tua serva sairá de noite para o vale[b] e orará a Deus; ele me dirá quando eles tiverem cometido o seu pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «escrava». O grego δούλη pode designar uma serva ou mulher escravizada; aqui é também uma forma respeitosa de Judite referir-se a si mesma.
    reason: lexical_alternative
  - marker: b
    text: Ou «ravina» ou «desfiladeiro».
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλη
  choice: serva
  rationale: O feminino «serva» preserva a forma grega e, neste contexto, funciona como autorreferência respeitosa de Judite diante de Holofernes; a possibilidade de «escrava» é registrada em nota.
- source_word: θεοσεβής
  choice: teme a Deus
  rationale: Expressa diretamente reverência a Deus e conserva o elemento explícito θεο-, em linguagem bíblica natural e compreensível.
- source_word: θεραπεύουσα
  choice: serve
  rationale: O particípio pode indicar servir, prestar assistência ou culto. «Serve» mantém tanto a devoção religiosa quanto o serviço contínuo sem restringir o sentido ao culto litúrgico.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: noite e dia
  rationale: Preserva o merismo temporal em formulação portuguesa corrente.
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  choice: ao Deus do céu
  rationale: Mantém a construção genitiva e o título bíblico tradicional.
- source_word: μενῶ παρὰ σοί
  choice: permanecerei com o meu senhor
  rationale: O futuro de μένω com παρά e dativo indica permanecer na companhia ou presença de alguém. A integração com o vocativo seguinte resulta em português natural.
- source_word: κύριε μου
  choice: meu senhor
  rationale: É um título social respeitoso dirigido a Holofernes, não um título divino. «Meu senhor» preserva o registro elevado sem afirmar necessariamente posse.
- source_word: ἐξελεύσεται
  choice: sairá
  rationale: Traduz de modo direto o movimento para fora do acampamento.
- source_word: κατὰ νύκτα
  choice: de noite
  rationale: Formulação natural que preserva a referência temporal da expressão grega.
- source_word: φάραγγα
  choice: vale
  rationale: O termo pode designar vale, ravina ou desfiladeiro. «Vale» é claro e amplo; as opções topográficas mais estreitas são preservadas em nota.
- source_word: προσεύξομαι πρὸς τὸν θεόν
  choice: orará a Deus
  rationale: Expressa de forma idiomática a oração dirigida a Deus, mantendo a terceira pessoa exigida pela autorreferência «a sua serva».
- source_word: ἐρεῖ μοι
  choice: ele me dirá
  rationale: Tradução natural do futuro de λέγω, preservando a comunicação pessoal atribuída a Deus.
- source_word: πότε ἐποίησαν τὸ ἁμάρτημα αὐτῶν
  choice: quando eles tiverem cometido o seu pecado
  rationale: O futuro perfeito do português representa adequadamente a anterioridade da ação em relação à revelação futura, sem especificar além do grego a natureza do pecado.
theological_decisions:
- issue: Sentido de δούλη na autorreferência de Judite
  choice: serva
  alternative: escrava
  rationale: Embora δούλη possa designar uma mulher escravizada, aqui a expressão desempenha sobretudo a função de autorreferência deferente no discurso dirigido a Holofernes. «Serva» preserva essa função sem apagar a alternativa lexical, registrada em nota.
- issue: Força religiosa de θεραπεύουσα
  choice: serve
  alternative: presta culto a
  rationale: «Serve» conserva a amplitude do verbo grego, que neste contexto pode envolver devoção, assistência religiosa e culto contínuo; «presta culto» resolveria a nuance de maneira mais estreita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A autorreferência deferente foi mantida na terceira pessoa («a sua serva»), e «meu senhor» foi integrado à oração para evitar uma pausa artificial sem alterar o sentido. A ambiguidade topográfica de φάραγξ e a amplitude social de δούλη são preservadas em notas.
