base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/023.yaml
  text: And now you are beautiful in your appearance and good in your words. For if you do as you have spoken[a], your God will be my God, and you will dwell in the house of King Nabuchodonosor, and you will be renowned throughout all the earth.
translation:
  language: pt
  text: E agora, você é bela na aparência, e suas palavras são boas. Pois, se fizer como disse, o seu deus será o meu deus[a]; você residirá na casa do rei Nabucodonosor e será célebre em toda a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o seu Deus será o meu Deus”. O grego não distingue aqui entre maiúsculas e minúsculas; a forma em minúscula reflete a perspectiva pagã imediata de quem fala no contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστεία
  choice: bela
  rationale: Em ligação com ἐν τῷ εἴδει σου, o adjetivo elogia a aparência de Judite. “Bela” transmite de modo natural e digno a ideia de atratividade visível, sem introduzir o sentido intelectual de “esperta”.
- source_word: ἐν τῷ εἴδει σου
  choice: na aparência
  rationale: εἶδος designa aqui o aspecto ou forma visível. A formulação é clara em português e preserva o paralelo com “nas palavras”.
- source_word: ἀγαθὴ ἐν τοῖς λόγοις σου
  choice: boa nas palavras
  rationale: Mantém a estrutura elogiosa e paralela do grego. Embora “fala bem” fosse mais idiomático, poderia reduzir a amplitude de ἀγαθή, que qualifica positivamente o conteúdo ou a qualidade das palavras de Judite.
- source_word: ἐὰν ποιήσῃς καθὰ ἐλάλησας
  choice: se fizer como disse
  rationale: Expressa com naturalidade a condição que vincula as ações futuras de Judite ao que ela declarou anteriormente.
- source_word: ὁ θεός σου ἔσται μού θεός
  choice: o seu deus será o meu deus
  rationale: A minúscula reflete a perspectiva imediata do general pagão, sem transformar necessariamente sua afirmação retórica em confissão plena. O grego não distingue maiúsculas e minúsculas, por isso a alternativa é registrada em nota.
- source_word: καθιῇ
  choice: residirá
  rationale: O verbo significa literalmente “sentar-se” ou “estar sentado”, mas, com “na casa”, comunica permanência ou posição estável no ambiente real. “Residirá” é natural e conserva esse sentido contextual.
- source_word: ἐν οἴκῳ Ναβουχοδονόσορ βασιλέως
  choice: na casa do rei Nabucodonosor
  rationale: Preserva οἶκος como “casa”, sem excluir sua possível conotação de casa real, corte ou família régia. “Nabucodonosor” é a forma portuguesa corrente do nome.
- source_word: ὀνομαστὴ
  choice: célebre
  rationale: O adjetivo indica alguém de nome conhecido, notável ou famoso. “Célebre” combina clareza moderna com o tom elevado da declaração.
- source_word: παρὰ πᾶσαν τὴν γῆν
  choice: em toda a terra
  rationale: Reproduz a extensão abrangente da expressão grega e preserva sua retórica universalizante.
theological_decisions:
- issue: Uso de maiúscula ou minúscula em θεός na fala de Holofernes
  choice: o seu deus será o meu deus
  alternative: o seu Deus será o meu Deus
  rationale: A escrita grega da fonte não resolve a capitalização. A minúscula sinaliza o enquadramento pagão e retórico do falante, enquanto a nota preserva a leitura confessional possível sem decidir além da evidência textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservou-se o paralelismo do elogio inicial e evitou-se linguagem denominacional. O ponto e vírgula organiza com clareza as promessas coordenadas que seguem a condição.
