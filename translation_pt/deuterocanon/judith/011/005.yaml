base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/005.yaml
  text: And Judith said to him[a], “Receive the words of your slave, and let your maidservant speak before you[b], and I will not tell a lie to my lord this night.”
translation:
  language: pt
  text: 'E Judite lhe disse: “Acolhe as palavras da tua escrava[a] e deixa que a tua serva fale diante de ti. Nesta noite, não direi mentira alguma ao meu senhor[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serva”. O termo grego δοῦλη pode designar uma serva ou escrava; “escrava” preserva aqui a linguagem mais forte de humilhação usada por Judite.
    reason: lexical_alternative
  - marker: b
    text: Ou “meu amo”. Aqui, “senhor” refere-se a um superior humano, não a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δέξαι
  choice: Acolhe
  rationale: O imperativo de δέχομαι pede que Holofernes receba e aceite as palavras de Judite; “acolhe” conserva essa amplitude melhor que o simples “ouve”.
- source_word: τὰ ῥήματα
  choice: as palavras
  rationale: Tradução direta e natural de ῥήματα no contexto de uma fala formal.
- source_word: τῆς δούλης σου
  choice: da tua escrava
  rationale: δοῦλη é o feminino de δοῦλος e pode indicar escrava ou serva. “Escrava” preserva a força da autodepreciação de Judite, sem pressupor que ela seja literalmente propriedade de Holofernes.
- source_word: λαλησάτω
  choice: deixa que ... fale
  rationale: Reproduz de modo natural o imperativo de terceira pessoa e seu valor de pedido ou permissão.
- source_word: ἡ παιδίσκη σου
  choice: a tua serva
  rationale: παιδίσκη pode designar menina, criada ou jovem serva. “Serva” mantém o registro humilde e distingue o termo de δοῦλη sem introduzir uma idade que o contexto não exige.
- source_word: κατὰ πρόσωπόν σου
  choice: diante de ti
  rationale: Equivalente idiomático da expressão grega que significa falar na presença de alguém.
- source_word: οὐκ ἀναγγελῶ ψεῦδος
  choice: não direi mentira alguma
  rationale: ἀναγγέλλω significa anunciar, comunicar ou relatar; com ψεῦδος, a formulação portuguesa escolhida é clara e natural, sem perder o sentido de comunicar algo falso.
- source_word: τῷ κυρίῳ μου
  choice: ao meu senhor
  rationale: κύριος refere-se aqui a um superior humano. “Senhor”, em minúscula, conserva a deferência sem sugerir referência divina.
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: Nesta noite
  rationale: Preserva a referência temporal específica e o tom elevado do grego, com sintaxe natural em português.
theological_decisions:
- issue: Os dois termos femininos de autodesignação, δοῦλη e παιδίσκη
  choice: “tua escrava” e “tua serva”
  alternative: “tua serva” e “tua criada”
  rationale: O grego emprega termos diferentes numa fala marcada por humildade. A tradução preserva tanto a distinção quanto a força maior de δοῦλη, sem transformar a autodesignação retórica em uma afirmação inequívoca sobre a condição jurídica de Judite.
- issue: κύριος aplicado a Holofernes
  choice: “meu senhor”, com inicial minúscula
  alternative: “meu amo”
  rationale: O referente é um superior humano, não Deus. “Senhor” expressa adequadamente a deferência cortesã, enquanto “amo” enfatizaria uma relação de propriedade não explicitada pela frase.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de segunda pessoa (“tua”, “ti”) adequadas ao discurso direto solene. Mantém-se a repetição retórica das autodesignações humildes e evita-se linguagem excessivamente arcaica.
