base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/022.yaml
  text: Holofernes said to her[a], “God has done well to send you ahead of the people, so that power might be in our hands[b]; but destruction is for those who have treated my lord with contempt.”
translation:
  language: pt
  text: 'Holofernes lhe disse: “Deus fez bem ao enviar você à frente do povo, para que o poder estivesse em nossas mãos; mas, para os que trataram o meu senhor com desprezo, há destruição.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὖ ἐποίησεν
  choice: fez bem
  rationale: Expressão idiomática de aprovação que conserva de perto o valor avaliativo do grego.
- source_word: ἀποστεῖλας
  choice: ao enviar
  rationale: O particípio aoristo indica a ação pela qual Deus ‘fez bem’; a construção portuguesa é natural e mantém essa relação.
- source_word: ἔμπροσθεν τοῦ λαοῦ
  choice: à frente do povo
  rationale: Pode indicar posição ou precedência; no contexto, comunica que Judite foi enviada adiante de seu povo sem eliminar a amplitude da expressão.
- source_word: τοῦ γενήθηναι
  choice: para que ... esteja
  rationale: O infinitivo articular expressa propósito ou resultado. A formulação preserva essa abertura com linguagem portuguesa corrente.
- source_word: ἐν χερσὶν ἡμῶν
  choice: em nossas mãos
  rationale: Mantém a imagem idiomática grega de posse e controle.
- source_word: κράτος
  choice: o poder
  rationale: Termo amplo que aqui abrange força, domínio ou supremacia, adequado ao contexto militar e político.
- source_word: φαυλίσασι
  choice: trataram ... com desprezo
  rationale: Expressa o ato de menosprezar ou considerar sem valor, com mais precisão do que uma referência apenas a sentimento interior.
- source_word: τὸν κύριόν μου
  choice: o meu senhor
  rationale: Refere-se ao soberano humano de Holofernes; ‘senhor’ preserva o título sem lhe atribuir sentido divino.
- source_word: ἀπώλεια
  choice: destruição
  rationale: Equivalente claro e atual para ruína ou destruição, sem acrescentar conotações teológicas posteriores.
theological_decisions:
- issue: Sentido de κύριος como título de um governante humano
  choice: o meu senhor
  alternative: o meu soberano
  rationale: O contexto aponta para o governante a quem Holofernes serve, não para o Deus de Israel. ‘Meu senhor’ conserva a forma titular do grego e a distinção contextual.
- issue: Relação entre poder e destruição na declaração de Holofernes
  choice: preservar as duas afirmações contrastantes sem identificar explicitamente seus agentes ou alcance
  alternative: explicitar que Deus dará vitória aos assírios e destruirá os opositores
  rationale: O grego formula o resultado em termos de poder nas mãos de ‘nós’ e destruição para os que desprezaram o senhor de Holofernes; explicitar além disso resolveria indevidamente a tensão retórica e teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala mantém tom solene e militar sem arcaísmos. Não há marcadores de nota porque nenhuma nota foi julgada necessária para esta redação.
