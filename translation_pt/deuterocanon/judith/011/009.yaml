base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/009.yaml
  text: And now[a], concerning the matter that Achior spoke in your council, we have heard his words, because the men of Bethulia spared him[b], and he reported to them everything that he had spoken from you.
translation:
  language: pt
  text: E agora, quanto ao que Aquior disse em teu conselho, ouvimos suas palavras, pois os homens de Betúlia o mantiveram a salvo[a], e ele lhes relatou tudo o que havia dito em tua presença[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o pouparam” ou “o salvaram”; o verbo grego pode indicar preservar alguém ou mantê-lo em segurança.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “junto de ti” ou “de tua parte”; no contexto, a expressão provavelmente se refere ao que Aquior havia dito em tua presença ou diante de ti.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: assunto
  rationale: Neste contexto, designa o conteúdo ou tema da fala de Aquior, não uma palavra isolada.
- source_word: συνεδρείᾳ
  choice: conselho
  rationale: Refere-se à reunião deliberativa presidida pelo interlocutor; “conselho” é claro, formal e natural.
- source_word: ἠκούσαμεν
  choice: ouvimos
  rationale: Traduz diretamente o aoristo grego e expressa que a fala de Aquior chegou ao conhecimento delas.
- source_word: ῥήματα
  choice: palavras
  rationale: Mantém o caráter verbal e concreto daquilo que foi ouvido.
- source_word: περιεποίησαντο
  choice: mantiveram a salvo
  rationale: O verbo comunica preservação ou proteção. A formulação evita explicitar além do grego se eles apenas lhe pouparam a vida ou também o protegeram.
- source_word: οἱ ἄνδρες Βαιτυλουά
  choice: os homens de Betúlia
  rationale: Preserva a referência explícita aos homens da cidade e adota a forma portuguesa corrente do topônimo.
- source_word: ἀπήγγειλεν
  choice: contou
  rationale: Expressa de modo natural o ato de transmitir a eles tudo o que havia dito, sem perder o sentido de relatar.
- source_word: παρὰ σοί
  choice: em tua presença
  rationale: No contexto da fala, παρά com dativo indica proximidade ou presença; esta formulação portuguesa é mais clara que a tradução rígida “de ti”.
