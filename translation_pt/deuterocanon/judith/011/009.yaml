translation_notes:
  register: Português atual, digno e acessível, com formas de segunda pessoa (“teu”, “tua”, “ti”) para conservar a clareza do discurso dirigido diretamente a Holofernes. A sintaxe foi levemente reorganizada para soar natural em português sem eliminar a repetição semântica entre “assunto” e “palavras” presente no grego.
