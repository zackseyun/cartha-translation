  yaml_path: translation/deuterocanon/judith/011/001.yaml
  text: And Holofernes said to her[a], “Take courage, woman; do not be afraid in your heart[c][b], for I have harmed no man who has chosen to serve King Nebuchadnezzar of all the earth.”
translation:
  language: pt
  text: 'Então Holofernes lhe disse: “Tenha coragem, mulher; não tenha medo em seu coração, pois não fiz mal a ninguém que tenha escolhido servir ao rei Nabucodonosor de toda a terra.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “rei ... de toda a terra” reflete a reivindicação imperial de quem fala; em outros contextos, “terra” também pode ser entendida como “território”.
    reason: cultural_note
lexical_decisions:
- source_word: Θάρσησον
  choice: Coragem
  rationale: Expressa de modo natural e direto a força exhortativa do imperativo grego, sem arcaísmo.
- source_word: γύναι
  choice: mulher
  rationale: Preserva o vocativo simples e direto do grego, sem suavizá-lo para “senhora”.
- source_word: μὴ φοβηθῇς τῇ καρδίᾳ σου
  choice: Não tenha medo no coração
  rationale: Mantém a localização interior do medo explicitada pelo dativo τῇ καρδίᾳ σου e soa compreensível em português moderno.
- source_word: ἐκάκωσα
  choice: nunca fiz mal
  rationale: O aoristo em declaração de conduta passada é expresso naturalmente em português por “nunca fiz mal”; a formulação mantém o sentido amplo de causar dano ou maltratar.
- source_word: ἄνθρωπον
  choice: ninguém
  rationale: No contexto negativo, traduz naturalmente o referente humano genérico, sem restringi-lo ao sexo masculino.
- source_word: ὅστις ἡρέτικεν
  choice: que tenha escolhido
  rationale: Comunica a escolha já feita e preserva a relação caracterizadora introduzida por ὅστις.
- source_word: δουλεύειν
  choice: servir
  rationale: No contexto político, indica submissão e serviço ao rei; “ser escravo de” enfatizaria excessivamente a escravidão pessoal.
- source_word: βασιλεῖ Ναβουχοδονόσορ
  choice: ao rei Nabucodonosor
  rationale: Emprega a forma portuguesa tradicional do nome e a ordem natural de título e nome.
- source_word: πάσης τῆς γῆς
  choice: de toda a terra
  rationale: Preserva a amplitude universalizante da reivindicação imperial; γῆ também pode significar “terra” no sentido territorial.
theological_decisions:
- issue: Reivindicação imperial no título de Nabucodonosor
  choice: de toda a terra
  alternative: de toda a região / de todo o território
  rationale: A expressão é mantida como reivindicação universalizante feita pelo personagem, sem que a tradução a endosse como verdade teológica ou histórica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Coragem, mulher!” conserva a franqueza do vocativo; “Não tenha medo no coração” retém o idioma semítico refletido no grego. O marcador [a] aparece no texto e corresponde à única nota.
