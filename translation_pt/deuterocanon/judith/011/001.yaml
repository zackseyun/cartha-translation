  source_fidelity: A tradução transmite corretamente a exortação de Holofernes, o medo interior, sua alegação de não causar dano e a submissão política a Nabucodonosor. Contudo, “nunca fiz mal” introduz uma explicitação temporal (“nunca”) que não está expressa pelo aoristo grego; “não fiz mal” é mais fiel. A formulação do título também pode ligar mais claramente “de toda a terra” a “rei”.
  naturalness: O texto é claro e de registro apropriado. “Tenha coragem, mulher; não tenha medo em seu coração” preserva o vocativo direto e o idiomatismo interior de modo um pouco mais natural e preciso do que “Coragem, mulher! Não tenha medo no coração”.
  terminology: “Holofernes”, “Nabucodonosor”, “mulher”, “servir” e “toda a terra” são escolhas adequadas. A nota deve dizer que “terra” pode ter o sentido de “território” em outros contextos, não sugerir que tal leitura seja igualmente a pretendida neste título imperial universalizante.
  issues:
