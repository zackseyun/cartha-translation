    rationale: 'ἐκάκωσα é aoristo negativo: “não fiz mal” reproduz a alegação sem acrescentar “nunca”.'
  - severity: low
    issue: A nota afirma que “terra” também pode significar território “neste contexto”.
    rationale: Embora γῆ possa significar terra/território em outros usos, o contexto do título imperial favorece “toda a terra”; a nota deve preservar essa distinção.
  - severity: low
    issue: A ligação sintática entre “rei” e “de toda a terra” pode ser mais direta.
    rationale: “o rei Nabucodonosor de toda a terra” representa com maior clareza βασιλεῖ Ναβουχοδονόσορ πάσης τῆς γῆς.
