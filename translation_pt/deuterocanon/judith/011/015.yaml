base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/015.yaml
  text: And it will be that[a], when he reports it to them and they act, they will be given over to you for destruction on that day.
translation:
  language: pt
  text: E acontecerá que, quando ele lhes comunicar isso e eles agirem, serão entregues a você para a destruição naquele dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E acontecerá que, assim que ele lhes comunicar isso e eles o fizerem, serão entregues a você para a destruição naquele dia”. A expressão grega ὡς ἂν com verbos no subjuntivo pode indicar uma condição futura indefinida, e ποιήσωσιν pode ser traduzido mais literalmente por “o fizerem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται
  choice: E acontecerá que
  rationale: Expressa de modo natural em português o futuro idiomático de εἰμί que introduz a circunstância futura, sem acrescentar conteúdo.
- source_word: ὡς ἂν
  choice: quando
  rationale: Com os subjuntivos aoristos, indica uma contingência futura indefinida; “quando” conserva essa relação sem afirmar que o fato já ocorreu.
- source_word: ἀναγγείλῃ
  choice: ele lhes comunicar isso
  rationale: O verbo significa anunciar ou informar. “Comunicar” é corrente e mantém o conteúdo referido implícito no contexto, representado por “isso” em português.
- source_word: ποιήσωσιν
  choice: eles agirem
  rationale: ποιέω é amplo e aqui não traz objeto expresso. “Agirem” preserva essa abertura melhor do que especificar uma ação não declarada.
- source_word: δοθήσονταί σοι
  choice: serão entregues a você
  rationale: Mantém a voz passiva futura e traduz o dativo σοι diretamente, sem acrescentar a imagem de “mãos”.
- source_word: εἰς ὄλεθρον
  choice: para a destruição
  rationale: Indica o resultado ou propósito hostil da entrega; “destruição” corresponde diretamente a ὄλεθρος.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: naquele dia
  rationale: Forma temporal idiomática e clara em português moderno.
