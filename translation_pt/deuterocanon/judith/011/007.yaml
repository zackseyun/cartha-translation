base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/007.yaml
  text: For King Nebuchadnezzar[a], of all the earth, lives, and his dominion lives—he who sent you for the success of every living soul. For not only will men serve him because of you[c][b], but also the wild animals and the cattle and the birds of the sky will live under your strength for Nebuchadnezzar and all his house.
translation:
  language: pt
  text: Pois Nabucodonosor, rei de toda a terra, vive, e vive o seu domínio! Foi ele quem enviou você para o êxito de todo ser vivente.[a] Pois, por sua causa, não somente os seres humanos o servirão, mas também os animais selvagens, os animais domésticos e as aves do céu viverão para Nabucodonosor e toda a sua casa por meio da sua força.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega também pode ser entendida como “para a realização”, “para a prosperidade” ou “para o bom resultado de toda vida/pessoa”. Aqui, “ser vivente” não se refere necessariamente à alma imaterial.
    reason: lexical_alternative
  - marker: b
    text: 'A oração final é muito condensada no grego. Também pode ser entendida assim: “viverão sob a sua força, para Nabucodonosor e toda a sua casa”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ζῇ ... καὶ ζῇ
  choice: vive ... e vive
  rationale: Mantém a repetição enfática e a forma de aclamação ou juramento cortesão do grego, sem reduzi-la a uma simples afirmação de existência.
- source_word: κράτος
  choice: domínio
  rationale: No contexto régio, indica poder efetivo e soberania, não apenas força abstrata.
- source_word: εἰς κατόρθωσιν πάσης ψυχῆς
  choice: para o êxito de todo ser vivente
  rationale: “Êxito” expressa o resultado favorável sugerido por κατόρθωσις, enquanto “ser vivente” evita restringir ψυχή à ideia teológica posterior de uma alma imaterial.
- source_word: ἄνθρωποι
  choice: seres humanos
  rationale: Torna explícito o contraste entre a humanidade e os animais, sem introduzir uma limitação de gênero inexistente no contexto.
- source_word: διὰ σὲ
  choice: por sua causa
  rationale: 'διά com acusativo tem aqui valor causal: o serviço prestado ao rei ocorrerá por causa de Holofernes.'
- source_word: δουλεύσουσιν
  choice: servirão
  rationale: Expressa sujeição e serviço ao soberano sem impor, além do necessário, a imagem específica de escravidão como propriedade.
- source_word: θηρία τοῦ ἀγροῦ
  choice: animais selvagens
  rationale: Equivalente moderno e claro para os animais não domesticados, tradicionalmente chamados de “feras do campo”.
- source_word: κτήνη
  choice: rebanhos
  rationale: Abrange os animais domesticados de criação; é mais amplo que “gado” entendido apenas como bovinos.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: aves do céu
  rationale: Preserva a expressão bíblica e sua imagem espacial em português corrente.
- source_word: διὰ τῆς ἰσχύος σου
  choice: por meio da sua força
  rationale: Reproduz o valor instrumental de διά com genitivo e atribui à força de Holofernes o meio pelo qual os animais viverão.
- source_word: πάντα τὸν οἶκον αὐτοῦ
  choice: toda a sua casa
  rationale: Conserva a amplitude de οἶκος, que pode designar a família, a corte, o estabelecimento ou a dinastia do rei.
theological_decisions:
- issue: Aclamação régia que atribui alcance universal a Nabucodonosor
  choice: Preservar a fórmula exaltada “vive o rei Nabucodonosor de toda a terra, e vive o seu domínio”
  alternative: Suavizar como simples elogio cortesão ou explicitar “rei sobre toda a terra”
  rationale: A fala estratégica de Judite contém deliberadamente uma hipérbole imperial. A tradução deve conservar essa tensão narrativa e teológica sem apresentar a declaração como afirmação doutrinária do tradutor.
- issue: Sentido de ψυχή
  choice: ser vivente
  alternative: alma, pessoa ou vida
  rationale: Neste contexto, ψυχή provavelmente se refere ao ser vivo ou à vida, não especificamente a uma entidade imaterial. A nota preserva as possibilidades lexicais.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe exclamativa preserva a solenidade cortesã; “você/sua” oferece naturalidade contemporânea sem informalidade excessiva. As notas registram a ambiguidade lexical e a compressão sintática sem resolver indevidamente o texto.
