  text: And her words pleased Holofernes and all his attendants, and they marveled at her wisdom and said,
translation:
  language: pt
  text: 'As palavras dela agradaram a Holofernes e a todos os seus assistentes. Eles ficaram admirados com a sabedoria dela e disseram:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρεσαν
  choice: agradaram
  rationale: Expressa de modo natural que as palavras de Judite foram recebidas favoravelmente, preservando o sentido do aoristo de ἀρέσκω.
- source_word: οἱ λόγοι αὐτῆς
  choice: As palavras dela
  rationale: Mantém proximidade com o grego e é claro e idiomático em português moderno.
- source_word: ἐναντίον Ὀλοφέρνου καὶ ἐναντίον πάντων τῶν θεραπόντων αὐτοῦ
  choice: a Holofernes e a todos os seus assistentes
  rationale: Com o verbo 'agradar', a construção portuguesa pede objeto indireto; assim se comunica naturalmente que tanto Holofernes como os que o serviam receberam bem as palavras.
- source_word: θεραπόντων
  choice: assistentes
  rationale: No contexto militar e cortesão, designa pessoas a serviço de Holofernes sem introduzir necessariamente a ideia de escravidão.
- source_word: ἐθαύμασαν
  choice: ficaram admirados
  rationale: Transmite assombro e apreciação positiva em linguagem corrente e digna.
- source_word: ἐπὶ τῇ σοφίᾳ αὐτῆς
  choice: com a sabedoria dela
  rationale: Indica de maneira idiomática a causa ou base da admiração, sem especificar além do grego.
- source_word: καὶ εἶπαν
  choice: 'e disseram:'
  rationale: Mantém a continuação para o discurso direto do versículo seguinte; os dois-pontos são a pontuação natural em português.
