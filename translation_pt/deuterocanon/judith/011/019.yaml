base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/019.yaml
  text: And I will lead you through the midst of Judea until you come opposite Jerusalem[a], and I will set your chariot in her midst, and you will drive them like sheep that have no shepherd, and not even a dog will growl with its tongue against you; for these things were spoken to me according to my foreknowledge, and they were reported to me[c][b], and I was sent to tell you.
translation:
  language: pt
  text: E eu conduzirei você pelo meio da Judeia, até você chegar diante de Jerusalém[a]; colocarei o seu carro de guerra no centro dela, e você os conduzirá como ovelhas que não têm pastor. Nem sequer um cão rosnará com a língua contra você[b], pois essas coisas me foram ditas segundo o meu conhecimento prévio, foram-me comunicadas, e fui enviada para anunciá-las a você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em frente a Jerusalém” ou “defronte de Jerusalém”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão grega diz literalmente que nenhum cão “rosnará com a língua contra você”; é uma imagem de total ausência de resistência.
    reason: cultural_note
lexical_decisions:
- source_word: ἄξω
  choice: conduzirei
  rationale: O futuro de ἄγω indica que Judite promete guiar pessoalmente Holofernes; “conduzir” é natural e mantém o sentido diretivo.
- source_word: διὰ μέσου τῆς Ἰουδαίας
  choice: pelo meio da Judeia
  rationale: Preserva a expressão espacial enfática do grego sem soar excessivamente literal.
- source_word: ἕως τοῦ ἐλθεῖν ἀπέναντι Ἰερουσαλήμ
  choice: até chegar diante de Jerusalém
  rationale: ἀπέναντι expressa posição em frente ou face a face; “diante de” evita sugerir indevidamente a entrada na cidade.
- source_word: θήσω τὸν δίφρον σου
  choice: colocarei o seu carro
  rationale: δίφρος pode designar assento ou carro; no contexto militar, “carro” é claro e adequado, sem especificar além do texto.
- source_word: ἐν μέσῳ αὐτῆς
  choice: no centro dela
  rationale: O pronome retoma Jerusalém. A formulação portuguesa preserva a referência à cidade sem forçar personificação pouco natural.
- source_word: ἄξεις αὐτούς
  choice: você os conduzirá
  rationale: O verbo é novamente ἄγω. “Conduzirá” mantém a correspondência lexical e funciona naturalmente com a imagem do rebanho; “tocará” seria possível, mas mais interpretativo.
- source_word: ὡς πρόβατα οἷς οὐκ ἔστιν ποιμήν
  choice: como ovelhas que não têm pastor
  rationale: Reproduz de modo claro a imagem bíblica de um povo vulnerável e sem liderança.
- source_word: οὐ γρύξει κύων τῇ γλώσσῃ αὐτοῦ ἀπέναντι σου
  choice: Nem sequer um cão rosnará contra você com a língua
  rationale: γρύζω indica rosnar ou resmungar, e a menção explícita da língua é preservada apesar de incomum, por integrar a força idiomática da frase.
- source_word: κατὰ πρόγνωσίν μου
  choice: segundo o meu conhecimento prévio
  rationale: Traduz πρόγνωσις como conhecimento antecipado sem importar o sentido técnico que “presciência” pode ter em discussões teológicas posteriores.
- source_word: ἀπηγγέλη μοι
  choice: foram-me comunicadas
  rationale: Mantém a voz passiva e a ideia de que as informações chegaram a Judite por comunicação de fonte não especificada.
- source_word: ἀπεστάλην ἀναγγεῖλαί σοι
  choice: fui enviada para anunciá-las a você
  rationale: Preserva tanto a ideia de comissão em ἀπεστάλην quanto a de transmissão de uma mensagem em ἀναγγεῖλαι.
theological_decisions:
- issue: Sentido de πρόγνωσις na fala de Judite
  choice: conhecimento prévio
  alternative: presciência; revelação especial; premonição
  rationale: O contexto apresenta Judite alegando possuir informação antecipada. A tradução mantém essa afirmação sem transformar o termo numa declaração técnica sobre presciência divina nem definir a origem do conhecimento.
- issue: Fonte das coisas comunicadas a Judite
  choice: 'voz passiva sem agente expresso: “foram-me comunicadas”'
  alternative: “Deus me revelou essas coisas”
  rationale: O grego não nomeia explicitamente o agente nessa oração. Acrescentar Deus resolveria uma ambiguidade que o texto preserva.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” em coerência com o destinatário singular e evita construções excessivamente arcaicas. A ordem das duas orações finais segue o grego: primeiro a comunicação recebida, depois o envio para anunciá-la.'
