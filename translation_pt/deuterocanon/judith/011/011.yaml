base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/011.yaml
  text: And now[a], so that my lord may not become an outcast and ineffective, death will fall upon them, and sin has overtaken them[c][b], by which they provoke their God whenever they commit an offense.
translation:
  language: pt
  text: E agora, para que meu senhor não acabe expulso e sem êxito,[a] a morte cairá sobre eles,[b] e o pecado já os alcançou. Por meio desse pecado, eles provocam o seu Deus sempre que cometem um ato vergonhoso.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lançado fora e sem conseguir realizar nada”. Os termos gregos podem destacar tanto ser expulso como não alcançar resultado algum.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “a morte cairá sobre o rosto deles”. Aqui, a expressão é vertida de modo idiomático como “cairá sobre eles”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “cometem uma impropriedade”, “uma insensatez” ou “um ultraje”. O substantivo grego pode indicar uma conduta imprópria, absurda ou moralmente ofensiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκβολος
  choice: rejeitado
  rationale: O termo descreve alguém lançado fora, expulso ou excluído. “Rejeitado” é natural em português e conserva a ideia de ser posto de lado, sem especificar além do contexto se isso ocorre por expulsão política ou derrota militar.
- source_word: ἄπρακτος
  choice: sem êxito
  rationale: O adjetivo pode indicar quem nada consegue realizar ou fica sem resultado. “Sem êxito” comunica o fracasso prático da missão sem sugerir incapacidade absoluta.
- source_word: ἐπιπεσεῖται θάνατος ἐπὶ πρόσωπον αὐτῶν
  choice: a morte cairá sobre eles
  rationale: A formulação preserva a imagem vigorosa de a morte cair sobre alguém, mas evita a expressão pouco natural “sobre o rosto deles” no corpo do texto.
- source_word: κατέλαβε
  choice: já os alcançou
  rationale: O aoristo apresenta o pecado como algo que os atingiu. “Já os alcançou” mantém a anterioridade relevante no discurso e a imagem de algo que sobrevém às pessoas.
- source_word: ἁμάρτημα
  choice: pecado
  rationale: Como a conduta provoca o Deus deles, “pecado” preserva adequadamente o peso moral e religioso do substantivo.
- source_word: παροργιοῦσιν
  choice: provocam
  rationale: O verbo significa provocar, especialmente provocar à ira. “Provocam” é conciso e mantém implícita a ideia de ira sem acrescentá-la ao texto.
- source_word: ἀτοπίαν
  choice: um ato vergonhoso
  rationale: O substantivo pode designar impropriedade, absurdo ou conduta moralmente ultrajante. “Ato vergonhoso” expressa a gravidade moral sem adotar o mais intenso “ultraje”.
- source_word: ὁ κύριός μου
  choice: meu senhor
  rationale: Judite dirige-se respeitosamente a Holofernes. A inicial minúscula indica com clareza que se trata de um título social humano, não de um título divino.
theological_decisions:
- issue: Peso moral e religioso de ἁμάρτημα
  choice: pecado
  alternative: ofensa; transgressão
  rationale: A referência explícita a provocar “o seu Deus” favorece um termo que preserve a dimensão religiosa, sem ampliá-la interpretativamente.
- issue: Sentido humano de κύριος
  choice: meu senhor
  alternative: meu amo
  rationale: O contexto é uma fala deferente dirigida a Holofernes. “Meu senhor” conserva o registro cortês e evita confundi-lo com uma designação divina.
- issue: Relação do pronome relativo ἐν ᾧ com ἁμάρτημα
  choice: Por meio desse pecado
  alternative: no qual; com o qual
  rationale: A construção grega permite associar o pronome ao pecado mencionado. A formulação portuguesa explicita apenas o referente gramatical necessário, sem definir com maior precisão o mecanismo da provocação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem argumentativa e as imagens principais do grego foram preservadas, enquanto expressões pouco idiomáticas foram esclarecidas em notas. “Pois” torna natural a ligação discursiva entre a advertência inicial e a afirmação de que o pecado já os alcançou, sem eliminar a tensão temporal entre o futuro da morte e o aoristo do pecado.
