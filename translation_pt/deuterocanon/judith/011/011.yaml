  to: E agora, para que meu senhor não acabe expulso e sem êxito,[a] a morte cairá sobre eles,[b] e o pecado já os alcançou. Por meio desse pecado, eles provocam o seu Deus sempre que cometem um ato vergonhoso.[c]
