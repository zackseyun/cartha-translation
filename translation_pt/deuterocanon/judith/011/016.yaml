base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/016.yaml
  text: Therefore I[a], your servant, having learned all these things, fled from before them, and God sent me to do with you things at which the whole earth will be astonished[c][b], whenever they hear of them.
translation:
  language: pt
  text: Por isso, eu, sua serva, depois de tomar conhecimento de tudo isso, fugi da presença deles, e Deus me enviou para realizar com você coisas[a] que deixarão toda a terra[b] assombrada sempre que se ouvir falar delas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “realizar coisas junto com você”. A expressão grega é ampla e não especifica com maior precisão como Holofernes estará envolvido.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o mundo inteiro”; em sentido mais restrito, “toda a região”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Por isso
  rationale: Introduz a conclusão decorrente das afirmações anteriores e preserva naturalmente a força causal do grego.
- source_word: ἡ δούλη σου
  choice: sua serva
  rationale: Mantém a autodesignação deferente de Judite diante de Holofernes; «escrava» enfatizaria uma condição jurídica que não é o foco da fala.
- source_word: ἐπιγνοῦσα ταῦτα πάντα
  choice: depois de tomar conhecimento de tudo isso
  rationale: Expressa o conhecimento adquirido antes da fuga, preservando tanto a anterioridade do particípio quanto a abrangência de πάντα.
- source_word: ἀπέδρων ἀπὸ προσώπου αὐτῶν
  choice: fugi da presença deles
  rationale: Comunica de modo natural a fuga e verte a expressão semítica literalmente ligada ao «rosto» como presença.
- source_word: ἀπέστειλέν με ὁ θεός
  choice: Deus me enviou
  rationale: Reproduz diretamente a afirmação de comissão divina feita por Judite, sem endossá-la nem enfraquecê-la editorialmente.
- source_word: ποιῆσαι μετὰ σοῦ πράγματα
  choice: realizar com você coisas
  rationale: Preserva a amplitude de πράγματα e a relação igualmente ampla indicada por μετὰ σοῦ, sem definir Holofernes como parceiro, instrumento ou beneficiário.
- source_word: ἐκστήσεται
  choice: deixarão ... assombrada
  rationale: Transmite o espanto intenso expresso pelo verbo e produz uma construção idiomática em português.
- source_word: πᾶσα ἡ γῆ
  choice: toda a terra
  rationale: Conserva a formulação abrangente e a ambiguidade possível entre terra, mundo e território.
- source_word: ὅσο ἐὰν ἀκούσωσιν αὐτά
  choice: quando ouvirem falar delas
  rationale: Liga o espanto ao momento em que essas coisas forem conhecidas por relato; a terceira pessoa plural indefinida é natural em português e corresponde ao sujeito implícito.
theological_decisions:
- issue: A afirmação de que Deus enviou Judite
  choice: 'Traduzir diretamente: «Deus me enviou»'
  alternative: Introduzir distância editorial, como «ela dizia que Deus a havia enviado»
  rationale: O versículo apresenta a fala direta de Judite. A tradução não deve confirmar nem desacreditar sua afirmação além do que o próprio relato faz.
- issue: Natureza da atuação de Holofernes em ποιῆσαι μετὰ σοῦ πράγματα
  choice: Manter a formulação ampla «realizar com você coisas»
  alternative: Especificá-lo como parceiro, instrumento ou beneficiário
  rationale: O grego não define com precisão como Holofernes participa, e essa ambiguidade deve ser preservada.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira. Preferiu-se «sua serva» como tratamento deferente e «da presença deles» em vez do literalismo pouco natural «de diante do rosto deles». Os marcadores de nota foram colocados imediatamente após as expressões a que se referem.
