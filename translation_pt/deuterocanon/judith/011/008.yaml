base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/008.yaml
  text: For we have heard of your wisdom and the cunning of your soul[a], and it has been reported throughout all the earth that you alone are good in all the kingdom, mighty in knowledge[c][b], and marvelous in the armies of war.
translation:
  language: pt
  text: Pois ouvimos falar da sua sabedoria e das astúcias de sua mente[a], e foi divulgado por toda a terra[b] que somente você é bom em todo o reino[c], poderoso em conhecimento e admirável nos exércitos de guerra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das astúcias de sua alma”. O grego ψυχή pode significar “alma”, “vida” ou o eu interior; aqui provavelmente se refere à faculdade interior de pensamento e intenção.
    reason: lexical_alternative
  - marker: b
    text: Ou “por toda a região”. O grego γῆ pode significar “terra” em sentido amplo ou “terra, região, território”.
    reason: lexical_alternative
  - marker: c
    text: Ou “em cada reino”. O singular grego provavelmente se refere à totalidade do reino dele, não universalmente a todos os reinos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσαμεν
  choice: ouvimos falar
  rationale: Expressa naturalmente, no contexto do discurso, a notícia recebida e ainda relevante, sem forçar no português uma distinção aspectual ausente.
- source_word: σοφίαν
  choice: sabedoria
  rationale: É o equivalente corrente e preserva o elogio à prudência e inteligência de Holofernes.
- source_word: πανουργεύματα τῆς ψυχῆς σου
  choice: as astúcias do seu íntimo
  rationale: πανουργεύματα pode indicar habilidade sagaz com possível matiz de ardil; “astúcias” conserva essa ambivalência. “Seu íntimo” representa ψυχή como o eu interior de onde procedem planos e intenções, sem impor uma antropologia técnica.
- source_word: ἀνηγγέλη
  choice: foi anunciado
  rationale: Mantém a construção passiva e o sentido de algo divulgado amplamente.
- source_word: πάσῃ τῇ γῇ
  choice: por toda a terra
  rationale: Preserva a amplitude hiperbólica do elogio, enquanto a nota registra que γῆ também pode designar uma região ou território.
- source_word: σὺ μόνος ἀγαθὸς
  choice: somente você é bom
  rationale: Conserva a ênfase exclusiva de μόνος e o sentido amplo, não especificado, de ἀγαθός.
- source_word: ἐν πάσῃ βασιλείᾳ
  choice: em todo o reino
  rationale: O substantivo singular favorece a referência à totalidade do reino de Holofernes, e não a cada reino existente.
- source_word: δυνατὸς ἐν ἐπιστήμῃ
  choice: poderoso em conhecimento
  rationale: Preserva a combinação elevada e incomum entre linguagem de poder e capacidade intelectual.
- source_word: θαυμαστὸς ἐν στρατεύμασιν πολέμου
  choice: admirável nos exércitos de guerra
  rationale: Mantém o caráter encomiástico de θαυμαστός e a formulação militar pleonástica do grego, sem reduzi-la interpretativamente a “na guerra”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e inteligível, com leve elevação adequada a um elogio cortesão. O tratamento por “você” favorece ampla legibilidade brasileira sem introduzir títulos ausentes do grego. A tradução conserva a ambiguidade moral de πανουργεύματα e as formulações incomuns “poderoso em conhecimento” e “exércitos de guerra”.
