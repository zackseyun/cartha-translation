  naturalness: O registro é adequadamente elevado e compreensível. «Das astúcias de sua mente» é mais natural do que «do seu íntimo». «Foi divulgado» soa mais idiomático neste contexto de notícia amplamente propagada e preserva a voz passiva impessoal de ἀνηγγέλη.
