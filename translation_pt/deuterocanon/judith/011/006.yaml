base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/006.yaml
  text: And if you follow the words of your servant girl[a], God will fully accomplish the matter with you[b], and my lord will not depart from his purposes.
translation:
  language: pt
  text: E, se você seguir as palavras de sua serva[a], Deus levará plenamente a termo essa questão com você[b], e meu senhor não se afastará de seus propósitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “der ouvidos às palavras de sua serva”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “realizará completamente o empreendimento junto com você”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακολουθήσῃς
  choice: seguir
  rationale: O verbo pode significar seguir ou agir de acordo com alguém; “seguir as palavras” preserva de perto a expressão grega e continua compreensível em português.
- source_word: λόγοις
  choice: palavras
  rationale: Tradução direta que preserva a formulação do grego, embora no contexto as palavras tenham o sentido de conselho.
- source_word: παιδίσκης
  choice: serva
  rationale: Designa uma jovem criada ou serva. “Serva” exprime o gênero e a posição social sem afirmar de modo mais específico uma condição jurídica de escravidão.
- source_word: τελείως
  choice: plenamente
  rationale: Mantém a força adverbial de completude ligada à realização da questão.
- source_word: πρᾶγμα
  choice: essa questão
  rationale: O substantivo é amplo, podendo indicar coisa, assunto ou empreendimento. “Essa questão” soa natural e evita especificar indevidamente um plano.
- source_word: ποιήσει μετὰ σοῦ
  choice: levará plenamente a termo essa questão com você
  rationale: “Levar a termo” comunica a realização completa, enquanto “com você” preserva a relação expressa por μετά sem interpretá-la como “por meio de você” ou “para você”.
- source_word: ὁ θεός
  choice: Deus
  rationale: Equivalente português padrão de θεός.
- source_word: οὐκ ἀποστεῖται
  choice: não se afastará
  rationale: Reproduz a ideia de não se retirar, desviar ou desistir, preservando a construção com a preposição de afastamento.
- source_word: ὁ κύριός μου
  choice: meu senhor
  rationale: Título deferente dirigido a um superior humano; a inicial minúscula distingue o referente humano de Deus.
- source_word: ἐπιτηδευμάτων
  choice: propósitos
  rationale: O termo pode designar práticas, ocupações, empreendimentos ou desígnios. “Propósitos” mantém a amplitude intencional adequada ao contexto.
theological_decisions:
- issue: Referente humano de κύριος
  choice: meu senhor
  alternative: meu amo
  rationale: Judite usa um título de deferência para um superior humano. “Senhor”, em minúscula, preserva o título sem atribuir divindade ao referente.
- issue: Agência na expressão ποιήσει μετὰ σοῦ
  choice: Deus levará plenamente a termo essa questão com você
  alternative: Deus levará plenamente a termo essa questão por meio de você
  rationale: A tradução mantém o valor relacional de μετά e evita resolver a ambiguidade em favor de agência instrumental.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva deliberadamente a generalidade e algumas tensões do grego, especialmente em “com você” e “propósitos”.
