  yaml_path: translation/deuterocanon/judith/011/021.yaml
  text: There is no woman like this one from one end of the earth to the other, in beauty of face and wisdom of speech.
translation:
  language: pt
  text: Não há mulher como esta de uma extremidade à outra da terra[a], tanto pela beleza do rosto como pela inteligência nas palavras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de uma extremidade à outra do país”. A palavra grega pode significar “terra” ou “país”; aqui, o sentido mais amplo combina com o elogio hiperbólico.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “em um rosto belo e na compreensão das palavras”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ ἔστιν
  choice: Não há
  rationale: Forma existencial negativa natural em português, correspondente à expressão copulativa grega negada.
- source_word: τοιαύτη γυνὴ
  choice: mulher como esta
  rationale: Preserva tanto a ideia qualitativa de τοιαύτη quanto sua força demonstrativa, em linguagem portuguesa natural.
- source_word: ἀπʼ ἄκρου ἕως ἄκρου τῆς γῆς
  choice: de uma extremidade à outra da terra
  rationale: Reproduz o merismo que abrange toda a terra; 'terra' mantém também a possível amplitude lexical de γῆ.
- source_word: ἐν καλῷ προσώπῳ
  choice: pela beleza do rosto
  rationale: Exprime o aspecto em que ela é incomparável e comunica naturalmente a ideia de boa ou bela aparência facial.
- source_word: καὶ συνέσει λόγων
  choice: como pela compreensão de suas palavras
  rationale: σύνεσις indica compreensão, inteligência ou discernimento; λόγων pode referir-se às palavras ou ao discurso dela. A formulação mantém essa nuance sem acrescentar uma noção mais ampla de sabedoria ausente do termo.
