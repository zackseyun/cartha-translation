base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/004.yaml
  text: Take courage; you will live through this night and beyond. For there is no one who will wrong you; rather[a], he will treat you well, as is done for the servants of my lord King Nebuchadnezzar.
translation:
  language: pt
  text: Tenha coragem! Você sobreviverá a esta noite e continuará viva daqui em diante. Pois ninguém lhe fará mal; pelo contrário, você será bem tratada, como se costuma fazer aos servos[a] do meu senhor, o rei Nabucodonosor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escravos”. A palavra grega pode significar “servos” ou “escravos”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: θάρσει
  choice: Tenha coragem!
  rationale: O imperativo transmite encorajamento e tranquilização; esta formulação é natural, atual e mantém a força da expressão grega.
- source_word: ἐν τῇ νυκτὶ ταύτῃ ζήσῃ καὶ εἰς τὸ λοιπόν
  choice: Você sobreviverá a esta noite e continuará viva daqui em diante
  rationale: No contexto, ζάω indica que Judite passará a noite com vida, enquanto εἰς τὸ λοιπόν estende a garantia ao tempo futuro. O feminino explicita apenas o gênero da destinatária conhecido pelo contexto.
- source_word: ἀδικήσει
  choice: fará mal
  rationale: ἀδικέω pode significar cometer injustiça contra alguém, prejudicar ou maltratar. 'Fará mal' preserva a amplitude do termo em português corrente sem limitar o sentido a dano físico.
- source_word: ἀλλʼ εὖ σε ποιήσει
  choice: pelo contrário, tratará você bem
  rationale: A tradução conserva o verbo no singular, como no grego, e expressa idiomaticamente a ideia de agir de modo benéfico ou bondoso para com Judite.
- source_word: καθὰ γίνεται
  choice: como se costuma fazer
  rationale: A construção descreve uma prática habitual; 'se costuma fazer' comunica com naturalidade esse valor geral.
- source_word: τοῖς δούλοις
  choice: aos servos
  rationale: No contexto da corte real, o termo designa pessoas a serviço do rei sem destacar necessariamente sua condição jurídica; a alternativa 'escravos' permanece indicada em nota.
- source_word: τοῦ κυρίου μου βασιλέως Ναβουχοδονόσορ
  choice: do meu senhor, o rei Nabucodonosor
  rationale: κύριος é aqui um título social de deferência, e não um título divino. A aposição com vírgula soa natural em português e mantém explícito o título real.
theological_decisions:
- issue: Sentido de δοῦλοι no contexto da corte real
  choice: servos
  alternative: escravos
  rationale: O contexto enfatiza o serviço prestado ao rei e o tratamento dado aos integrantes de sua casa, não a condição de escravidão. Como δοῦλος pode ter ambos os sentidos, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” evita solenidade arcaica; “meu senhor” preserva a deferência própria da corte. O singular de “tratará” acompanha a formulação grega, embora o sujeito genérico fique implícito em português.
