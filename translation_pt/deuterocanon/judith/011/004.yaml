  to: Tenha coragem! Você sobreviverá a esta noite e continuará viva daqui em diante. Pois ninguém lhe fará mal; pelo contrário, você será bem tratada, como se costuma fazer aos servos[a] do meu senhor, o rei Nabucodonosor.
