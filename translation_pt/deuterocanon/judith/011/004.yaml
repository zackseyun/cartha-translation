review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente o encorajamento, a sobrevivência naquela noite e no futuro, a proteção contra dano e a comparação com o tratamento dispensado aos servos do rei. Contudo, em “pelo contrário, tratará você bem”, o sujeito fica sintaticamente indeterminado em português e pode parecer retomar “ninguém”, produzindo uma relação lógica inadequada. A voz passiva resolve isso sem restringir indevidamente o sujeito genérico do grego.
  naturalness: O registro é moderno, claro e apropriado. “Você sobreviverá” e “continuará viva” são naturais no contexto de Judite. A revisão torna mais fluida a segunda oração e evita a alternância um tanto brusca entre “lhe” e “você” como objeto direto.
  terminology: “Servos” é uma escolha defensável para δούλοι no contexto cortesão, e a nota preserva corretamente “escravos” como alternativa lexical. “Meu senhor, o rei Nabucodonosor” mantém a deferência social de κύριος e o título real.
  issues:
  - severity: medium
    issue: Sujeito elíptico ambíguo em “pelo contrário, tratará você bem”.
    rationale: Depois de “Ninguém lhe fará mal”, o verbo singular sem sujeito expresso pode ser entendido como tendo “ninguém” por antecedente, o que prejudica a lógica da garantia. O grego usa uma formulação genérica de contraste; em português, “você será bem tratada” comunica naturalmente o resultado sem introduzir um referente indevido.
  revised_text: Tenha coragem! Você sobreviverá a esta noite e continuará viva daqui em diante. Pois ninguém lhe fará mal; pelo contrário, você será bem tratada, como se costuma fazer aos servos[a] do meu senhor, o rei Nabucodonosor.
