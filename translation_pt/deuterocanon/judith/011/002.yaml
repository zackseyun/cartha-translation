base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/002.yaml
  text: And now[a], if your people who live in the hill country had not treated me with contempt, I would not have raised my spear against them; but they themselves have brought these things on themselves.
translation:
  language: pt
  text: E agora, se o seu povo, que vive na região montanhosa, não me tivesse tratado com desprezo[a], eu não teria levantado a minha lança contra eles; mas eles mesmos causaram isso a si próprios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não me tivesse menosprezado» ou «não me tivesse insultado». O verbo grego indica tratar alguém como se tivesse pouca importância.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαός σου
  choice: o seu povo
  rationale: λαός designa o povo como corpo coletivo; «o seu povo» é natural em discurso direto e preserva a relação expressa pelo pronome.
- source_word: ὁ κατοικῶν τὴν ὀρεινήν
  choice: que vive na região montanhosa
  rationale: O particípio modifica «povo», e ἡ ὀρεινή substantivado indica a região montanhosa ou serrana. A formulação escolhida é clara e geograficamente fiel.
- source_word: εἰ μὴ ἐφαύλισάν με
  choice: se ... não me tivesse tratado com desprezo
  rationale: ἐφαυλίζω significa considerar ou tratar alguém como sendo de pouca importância, com desdém ou desprezo. A construção expressa uma condição contrária ao fato.
- source_word: οὐκ ἂν ἦρα
  choice: eu não teria levantado
  rationale: αἴρω significa levantar ou erguer; com ἄν, a forma verbal constitui a consequência contrafactual da condição anterior.
- source_word: τὸ δόρυ μου
  choice: a minha lança
  rationale: δόρυ é uma arma de haste, normalmente «lança» neste contexto militar; o termo é corrente e acessível em português.
- source_word: ἐπʼ αὐτούς
  choice: contra eles
  rationale: Com uma arma e ação hostil, ἐπί com acusativo indica direção adversativa, expressa naturalmente por «contra».
- source_word: ἀλλὰ αὐτοὶ ἑαυτοῖς ἐποίησαν ταῦτα
  choice: mas eles mesmos fizeram essas coisas contra si próprios
  rationale: A tradução mantém de perto o verbo ἐποίησαν e o dativo reflexivo ἑαυτοῖς, preservando a concisão e a possível amplitude da afirmação grega sem explicitar além do texto a ideia de consequências sofridas.
theological_decisions:
- issue: Grau de explicitação da culpa na oração final
  choice: eles mesmos fizeram essas coisas contra si próprios
  alternative: eles mesmos trouxeram essas coisas sobre si
  rationale: A formulação preserva a atribuição de responsabilidade aos próprios envolvidos, mas não acrescenta uma explicação sobre juízo divino, destino ou o mecanismo pelo qual as consequências ocorreram.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Região montanhosa» evita regionalismos; «contra si próprios» conserva a força reflexiva do grego. O marcador [a] aparece imediatamente após a expressão explicada.
