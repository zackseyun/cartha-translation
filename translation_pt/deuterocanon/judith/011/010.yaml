base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/010.yaml
  text: Therefore[a], master lord, do not disregard his word, but lay it up in your heart, because it is true; for our people are not avenged, nor does the sword prevail against them[c][b], unless they sin against their God.
translation:
  language: pt
  text: Por isso, ó senhor soberano[a], não ignore a palavra dele; guarde-a no coração, pois ela é verdadeira. Pois o nosso povo não sofre punição[b], nem a espada prevalece contra eles, a menos que pequem contra o seu Deus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega dois títulos, δέσποτα e κύριε; também se pode traduzir por “mestre e senhor”.
    reason: lexical_alternative
  - marker: b
    text: O verbo grego pode envolver a execução de justiça, punição ou vingança. Aqui, o paralelo com a espada prevalecendo contra o povo favorece “sofre punição”.
    reason: source_ambiguity
  - marker: c
    text: Literalmente, “se não pecarem contra o Deus deles”. Sob as negações anteriores, o sentido é que punição ou derrota não lhes sobrevém, a menos que pequem contra Deus.
    reason: literal_rendering
lexical_decisions:
- source_word: διό
  choice: Por isso
  rationale: Introduz naturalmente em português a conclusão decorrente do que foi dito antes.
- source_word: δέσποτα κύριε
  choice: senhor e mestre
  rationale: Representa os dois títulos da forma de tratamento grega sem sugerir que Holofernes esteja recebendo um título exclusivamente divino.
- source_word: μὴ παρέλθῃς τὸν λόγον αὐτοῦ
  choice: não ignore a palavra dele
  rationale: παρέρχομαι com λόγος tem aqui o sentido idiomático de deixar de lado ou desconsiderar; “ignore” é claro e corrente.
- source_word: κατάθου αὐτὸν ἐν τῇ καρδίᾳ σου
  choice: guarde-a no coração
  rationale: Conserva a imagem do coração como lugar de acolhimento e retenção interior, em linguagem natural.
- source_word: ἀληθής
  choice: verdadeira
  rationale: Concorda com “palavra” e traduz diretamente a afirmação de que a mensagem é verdadeira.
- source_word: οὐ ... ἐκδικάται τὸ γένος ἡμῶν
  choice: o nosso povo não sofre punição
  rationale: No contexto, o verbo denota a execução de juízo ou punição contra o povo; esta formulação evita o sentido potencialmente inverso de “não é vingado” em português.
- source_word: οὐ κατισχύει ῥομφαία ἐπʼ αὐτούς
  choice: nem a espada prevalece contra ele
  rationale: Mantém a imagem militar concreta da espada e traduz κατισχύω por “prevalecer”; “ele” retoma coletivamente “o nosso povo”.
- source_word: ἐὰν μὴ ἁμάρτωσιν εἰς τὸν θεὸν αὐτῶν
  choice: a menos que peque contra o seu Deus
  rationale: Expressa em português claro a condição exclusiva indicada no contexto, preservando a ideia de pecado dirigido contra Deus.
theological_decisions:
- issue: Dupla forma de tratamento δέσποτα κύριε
  choice: senhor e mestre
  alternative: senhor soberano
  rationale: Mantém distintos os dois títulos dirigidos a Holofernes e evita transformar a expressão numa designação necessariamente divina.
- issue: Condição para a punição ou derrota do povo
  choice: a menos que peque contra o seu Deus
  alternative: se não pecar contra o seu Deus
  rationale: A construção está sob duas negações anteriores; “a menos que” comunica a relação lógica em português sem suavizar a afirmação teológica de que a derrota está ligada ao pecado contra Deus.
- issue: Sentido de ἐκδικάται
  choice: não sofre punição
  alternative: não é vingado
  rationale: O paralelo com a espada prevalecendo contra o povo favorece punição ou juízo sofrido por ele, mas a nota registra a amplitude lexical do verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A tradução preserva a imagem do coração e da espada, distingue os dois títulos da forma de tratamento e explicita em nota as ambiguidades relevantes sem impor leitura denominacional.
