base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/014.yaml
  text: And he sent word to Jerusalem that those living there also had done these things[a], granting to those who had settled among them the release from the council of elders.
translation:
  language: pt
  text: E ele mandou uma mensagem a Jerusalém, dizendo que também os que moravam ali haviam feito essas coisas, concedendo aos que se haviam estabelecido entre eles a liberação[a] da parte do conselho de anciãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perdão” ou “remissão”. O grego ἄφεσις pode ter sentido jurídico ou social, bem como moral ou religioso; aqui, a referência ao conselho de anciãos favorece o sentido administrativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστάλακεν
  choice: mandou uma mensagem
  rationale: Expressa de modo natural o envio implícito de uma comunicação a Jerusalém, em vez de sugerir que uma pessoa ou objeto não especificado foi enviado.
- source_word: εἰς Ἰερουσαλήμ
  choice: a Jerusalém
  rationale: Uso direcional normal de εἰς com nome de lugar; a construção é clara e corrente em português.
- source_word: κατοικοῦντες
  choice: os que moravam ali
  rationale: Reproduz o sentido de residentes em linguagem atual e acessível.
- source_word: ἐποίησαν ταῦτα
  choice: haviam feito essas coisas
  rationale: Mantém a referência deliberadamente não especificada de ταῦτα e situa a ação como anterior no fluxo narrativo.
- source_word: τοὺς μετοικίσαντας αὐτοῖς
  choice: aos que se haviam estabelecido entre eles
  rationale: Comunica mudança de residência ou assentamento junto ao grupo sem impor uma categoria jurídica técnica.
- source_word: τὴν ἄφεσιν
  choice: a liberação
  rationale: Preserva o sentido administrativo ou social provável de ἄφεσις neste contexto, sem eliminar seus possíveis sentidos de remissão ou perdão.
- source_word: παρὰ τῆς γερουσίας
  choice: da parte do conselho de anciãos
  rationale: Apresenta γερουσία como órgão colegiado de anciãos e deixa clara a origem da concessão.
theological_decisions:
- issue: Sentido de ἄφεσις em contexto cívico ou comunitário
  choice: liberação
  alternative: perdão ou remissão
  rationale: A menção ao conselho de anciãos favorece uma medida administrativa, mas a amplitude semântica do termo grego é preservada em nota, sem resolver indevidamente sua possível força moral ou religiosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva as relações do grego, mas evita construções excessivamente literais; a ambiguidade de ἄφεσις é mantida por meio da nota.
