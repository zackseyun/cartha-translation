  source_fidelity: A tradução acompanha adequadamente o grego e a trilha de auditoria inglesa. «Mandou uma mensagem a Jerusalém» transmite de modo idiomático o perfeito de ἀποστέλλω no sentido de comunicar; «os que moravam ali» preserva κατοικοῦντες; e «essas coisas» não especifica indevidamente ταῦτα. A construção final é sintaticamente densa já no grego, e a tradução conserva prudentemente a relação entre a concessão, os que se estabeleceram entre eles e o conselho de anciãos, sem tentar resolver além do que o texto permite.
