  yaml_path: translation/deuterocanon/judith/011/018.yaml
  text: And when I come[a], I will open the way before you, and you will go out with all your force, and there is none among them who will stand against you.
translation:
  language: pt
  text: E, depois que eu chegar[a], abrirei o caminho à sua frente; você sairá com toda a sua força, e não haverá, entre eles, quem resista a você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Tendo chegado, abrirei [algo] antecipadamente para você». O verbo grego pode significar «abrir de antemão»; o objeto não é expresso no grego. «O caminho» é inferido do contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: quando eu chegar
  rationale: O particípio aoristo feminino singular refere-se a Judite e indica uma ação anterior à abertura; a oração temporal é natural em português e preserva a sequência.
- source_word: προανοίσω
  choice: abrirei o caminho diante de você
  rationale: O futuro de προανοίγω expressa abrir antecipadamente ou à frente. O objeto não aparece no grego; «o caminho» é uma explicitação contextual necessária para uma formulação idiomática, sinalizada em nota.
- source_word: ἐξελεύσῃ
  choice: você sairá
  rationale: Mantém o sentido básico do futuro médio de ἐξέρχομαι sem tornar explícita demais a ideia militar de marchar.
- source_word: σὺν πάσῃ τῇ δυνάμει σου
  choice: com toda a sua força
  rationale: δύναμις pode designar poder, força ou contingente militar. «Força» preserva a amplitude sem restringir o sentido a «exército».
- source_word: οὐκ ἔστιν ὃς ἀντιστήσεταί σοι
  choice: não haverá ... quem resista a você
  rationale: Expressa naturalmente em português a construção existencial futura e o sentido de ἀνθίστημι, resistir ou fazer frente.
- source_word: ἐξ αὐτῶν
  choice: entre eles
  rationale: 'Traduz o valor partitivo: ninguém pertencente ao grupo mencionado resistirá.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com «você» para o singular. A redação mantém o contexto militar sem substituir a expressão ampla «força» por «exército». O ponto e vírgula e «então» tornam clara a progressão das ações.
