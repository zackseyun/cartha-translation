base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/012.yaml
  text: For when their food had run out and all water had become scarce[a], they decided to use their livestock, and they determined to consume everything that God had commanded them by his laws not to eat.
translation:
  language: pt
  text: Pois, como os alimentos estavam acabando e toda a água havia se tornado escassa, decidiram recorrer aos seus animais de criação[a] e resolveram consumir tudo o que Deus, por meio de suas leis, lhes havia ordenado que não comessem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “lançar-se sobre os seus animais”; a expressão grega indica que pretendiam recorrer a eles como alimento em seu desespero.
    reason: A nota preserva a força e a imagem do idioma grego, enquanto o texto principal comunica seu sentido de modo natural.
lexical_decisions:
- source_word: ἐξέλειπεν
  choice: estavam acabando
  rationale: O imperfeito descreve o esgotamento progressivo dos mantimentos; a formulação evita afirmar que já não restava absolutamente nada.
- source_word: τὰ βρώματα
  choice: os alimentos
  rationale: O plural designa de modo amplo as provisões comestíveis; “alimentos” é claro e natural em português.
- source_word: ἐσπανίσθη πᾶν ὕδωρ
  choice: toda a água havia se tornado escassa
  rationale: A expressão indica escassez generalizada, não necessariamente desaparecimento completo da água.
- source_word: ἐβουλεύσαντο
  choice: decidiram
  rationale: O verbo expressa deliberação que resulta numa decisão.
- source_word: ἐπιβαλεῖν τοῖς κτήνεσιν αὐτῶν
  choice: recorrer aos seus animais de criação
  rationale: No contexto, a expressão idiomática indica voltar-se para os animais domésticos como fonte de alimento em situação extrema, sem explicitar além do grego a maneira de fazê-lo.
- source_word: κτήνεσιν
  choice: animais de criação
  rationale: O termo se refere a animais domésticos mantidos como propriedade; esta expressão é mais abrangente que “gado” e mais clara que “bestas”.
- source_word: διεστείλατο
  choice: havia ordenado
  rationale: No contexto das leis divinas, o verbo comunica uma determinação dotada de autoridade.
- source_word: τοῖς νόμοις αὐτοῦ
  choice: por meio de suas leis
  rationale: A formulação conserva o valor instrumental do dativo e deixa explícito que as proibições foram comunicadas pelas leis de Deus.
- source_word: μὴ φαγεῖν
  choice: que não comessem
  rationale: Traduz diretamente a proibição alimentar em português corrente.
- source_word: διέγνωσαν δαπανῆσαι
  choice: resolveram consumir
  rationale: O primeiro verbo indica uma resolução definida, e δαπανῆσαι, neste contexto alimentar, significa gastar por completo ou consumir.
theological_decisions:
- issue: Referência às proibições alimentares divinas
  choice: tudo o que Deus, por meio de suas leis, lhes havia ordenado que não comessem
  alternative: tudo o que Deus lhes havia proibido comer em suas leis
  rationale: A tradução conserva tanto a autoridade da ordem divina quanto sua expressão pelas leis, sem identificar uma passagem específica da Torá nem introduzir interpretação confessional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Animais de criação” evita tanto o regionalismo potencial de “gado” quanto o tom arcaico de “bestas”. O marcador [a] foi colocado junto à expressão que a nota esclarece.
