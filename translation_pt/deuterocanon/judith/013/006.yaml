base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/006.yaml
  text: And Judith stood beside his bed and said in her heart[a], “Lord, God of all power, look upon the works of my hands at this hour[b], for the exaltation of Jerusalem.”
translation:
  language: pt
  text: 'Então Judite, de pé ao lado da cama dele, disse em seu coração[a]: “Senhor, Deus de todo poder, olha, nesta hora, para as obras das minhas mãos, para a exaltação de Jerusalém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “disse consigo mesma”. O grego diz literalmente “disse em seu coração”, expressão bíblica para fala ou oração interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: στᾶσα
  choice: de pé
  rationale: O particípio aoristo indica que Judite tomou posição junto à cama antes de orar; em português, “de pé” ligado ao verbo principal preserva a cena com naturalidade.
- source_word: παρὰ τὴν κλίνην αὐτοῦ
  choice: ao lado da cama dele
  rationale: παρά com acusativo indica posição junto a algo; “cama” é o equivalente contextual mais claro para κλίνη.
- source_word: εἶπεν ἐν τῇ καρδίᾳ ἑαυτῆς
  choice: disse em seu coração
  rationale: Mantém a imagem e o idioma bíblico de fala ou oração interior, sem reduzi-lo a mero pensamento.
- source_word: Κύριε
  choice: Senhor
  rationale: É a forma natural e tradicional de dirigir-se a Deus em oração, correspondente ao vocativo Κύριε.
- source_word: ὁ θεὸς πάσης δυνάμεως
  choice: Deus de todo poder
  rationale: Reproduz de perto o genitivo grego e expressa a abrangência de πάσης sem acrescentar um título técnico ausente do texto.
- source_word: ἐπίβλεψον
  choice: olha para
  rationale: O imperativo pede que Deus volte sua atenção para a ação de Judite; a formulação é clara, direta e adequada à oração.
- source_word: ἐν τῇ ὥρᾳ ταύτῃ
  choice: nesta hora
  rationale: Preserva a solenidade e a referência temporal precisa da expressão grega.
- source_word: ἐπὶ τὰ ἔργα τῶν χειρῶν μου
  choice: para as obras das minhas mãos
  rationale: Conserva o plural e o idioma bíblico concreto para as ações ou o empreendimento de Judite.
- source_word: εἰς ὕψωμα Ἰερουσαλήμ
  choice: para a exaltação de Jerusalém
  rationale: Mantém a ideia de elevação presente em ὕψωμα e evita substituir a metáfora por uma interpretação mais específica, como “libertação”.
theological_decisions:
- issue: Fórmula da oração interior de Judite
  choice: disse em seu coração
  alternative: disse consigo mesma
  rationale: A fala é dirigida ao Senhor e, portanto, constitui oração interior. A formulação escolhida preserva a linguagem antropológica bíblica sem impor elaboração doutrinária.
- issue: Sentido de εἰς ὕψωμα Ἰερουσαλήμ
  choice: para a exaltação de Jerusalém
  alternative: para a libertação de Jerusalém
  rationale: O grego enuncia elevação ou exaltação, não explicitamente libertação. A tradução conserva a metáfora e a tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se os idiomas bíblicos “em seu coração” e “obras das minhas mãos”, bem como a metáfora de exaltação de Jerusalém. A ordem foi ajustada apenas o necessário para a fluência em português.
