  yaml_path: translation/deuterocanon/judith/013/019.yaml
  text: And blessed is the Lord God[a], who created the heavens and the earth, who directed you to strike the head of the ruler of our enemies.
translation:
  language: pt
  text: E bendito seja o Senhor Deus, que criou os céus e a terra e guiou você para ferir a cabeça[a] do governante dos nossos inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “guiou você para um ferimento na cabeça do governante dos nossos inimigos”. A expressão grega é compacta e também pode ser entendida como “guiou você visando ao ferimento da cabeça”.'
    reason: A construção εἰς τραῦμα κεφαλῆς é nominal e admite uma tradução mais literal com “ferimento”, enquanto o texto principal a verbaliza idiomaticamente como “ferir a cabeça”.
lexical_decisions:
- source_word: εὐλογημένος
  choice: bendito seja
  rationale: Preserva a forma de bênção e louvor, em português natural e solene, sem reduzi-la à ideia mais interpretativa de “louvado”.
- source_word: Κύριος ὁ θεὸς
  choice: o Senhor Deus
  rationale: Mantém os dois títulos do grego numa formulação consagrada e clara em português.
- source_word: ἔκτισεν
  choice: criou
  rationale: No contexto dos céus e da terra, expressa diretamente o ato divino de criação.
- source_word: τοὺς οὐρανοὺς καὶ τὴν γῆν
  choice: os céus e a terra
  rationale: Conserva o plural grego de “céus” e soa natural em português.
- source_word: κατεύθυνέν σε
  choice: guiou você
  rationale: Comunica direção e orientação divina de modo corrente; “dirigiu você” seria menos idiomático, e “conduziu você” poderia sugerir deslocamento físico mais específico.
- source_word: εἰς τραῦμα κεφαλῆς
  choice: para ferir a cabeça
  rationale: Verbaliza de forma idiomática a expressão nominal grega, literalmente “para/em direção a um ferimento da cabeça”, preservando sua finalidade sem especificar além do texto o modo do golpe.
- source_word: ἄρχοντος
  choice: governante
  rationale: Representa o sentido amplo de alguém que exerce comando ou autoridade, sem importar um título técnico posterior.
- source_word: ἐχθρῶν ἡμῶν
  choice: dos nossos inimigos
  rationale: Equivalência direta e natural do genitivo grego.
theological_decisions:
- issue: A atuação divina no feito de Judite
  choice: guiou você para ferir a cabeça
  alternative: encaminhou você para o ferimento da cabeça
  rationale: O verbo atribui a Deus a orientação do ato de Judite. A redação preserva essa agência divina, mas não a amplia para uma causalidade mais forte do que o grego afirma.
- issue: A bênção dirigida a Deus
  choice: bendito seja o Senhor Deus
  alternative: bendito é o Senhor Deus
  rationale: O grego permite uma fórmula predicativa de bênção. O subjuntivo português expressa naturalmente a força doxológica, sem alterar seu referente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Você” evita o caráter regional ou arcaizante de “tu” e mantém explícito o singular do pronome grego.
