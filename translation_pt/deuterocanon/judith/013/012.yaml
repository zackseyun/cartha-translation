  text: And when the men of her city heard her voice, they hurried down to the gate of their city and called together the elders of the city.
translation:
  language: pt
  text: Quando os homens da cidade de Judite ouviram a voz dela, apressaram-se a descer ao portão de sua cidade e convocaram os anciãos da cidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: Quando
  rationale: O idiomatismo introduz o acontecimento seguinte com valor temporal. Em português, «Quando» transmite esse valor naturalmente, sem reproduzir de modo rígido a fórmula narrativa grega.
- source_word: οἱ ἄνδρες τῆς πόλεως αὐτῆς
  choice: os homens da cidade dela
  rationale: ἄνδρες designa especificamente homens, e αὐτῆς retoma Judite. «Da cidade dela» evita que «sua cidade» seja momentaneamente associado aos homens.
- source_word: τὴν φωνὴν αὐτῆς
  choice: sua voz
  rationale: φωνή tem aqui o sentido direto de voz; o contexto indica que ouviram Judite chamar ou falar.
- source_word: ἐσπούδασαν τοῦ καταβῆναι
  choice: apressaram-se a descer
  rationale: A construção expressa ação pronta e urgente. «Apressaram-se a descer» conserva tanto a pressa quanto o movimento descendente.
- source_word: ἐπὶ τὴν πύλην τῆς πόλεως αὐτῶν
  choice: até o portão da cidade
  rationale: πύλη é o portão urbano. O possessivo grego é contextualmente claro, mas sua repetição em português seria pesada; «da cidade» preserva o referente sem ambiguidade relevante.
- source_word: συνεκάλεσαν
  choice: convocaram
  rationale: O verbo significa chamar pessoas para que se reúnam. «Convocaram» é atual, claro e adequado à reunião dos líderes da cidade.
- source_word: τοὺς πρεσβυτέρους τῆς πόλεως
  choice: os anciãos da cidade
  rationale: πρεσβύτεροι designa aqui os anciãos que exerciam liderança cívica. A formulação mantém o termo bíblico reconhecível sem acrescentar uma função não explicitada.
theological_decisions:
- issue: Referência masculina de ἄνδρες
  choice: os homens da cidade dela
  alternative: os habitantes da cidade dela
  rationale: O grego emprega o substantivo especificamente masculino ἄνδρες. A tradução conserva essa marca, pois o versículo não exige ampliá-la para toda a população.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação segue de perto a sequência grega, mas evita construções narrativas artificiais e repetição possessiva excessiva.
