base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/003.yaml
  text: But Judith was left alone in the tent[a], and Holofernes had collapsed on his bed[b], for the wine had overwhelmed him.
translation:
  language: pt
  text: Judite, porém, ficou sozinha na tenda, e Holofernes estava caído sobre a sua cama[a], pois o vinho o havia dominado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tinha caído para a frente sobre a sua cama”. O particípio grego descreve uma queda e o estado resultante.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, a expressão grega diz algo como “o vinho tinha sido derramado ao redor dele”; no contexto, indica que ele estava vencido pelos efeitos do vinho.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπελείφθη
  choice: ficou
  rationale: O aoristo passivo indica que Judite foi a única que restou depois da saída dos demais. Em português, “ficou” expressa isso com naturalidade, sem sugerir necessariamente abandono.
- source_word: μόνη
  choice: sozinha
  rationale: Preserva a ênfase na presença solitária de Judite na tenda.
- source_word: σκηνῇ
  choice: tenda
  rationale: É a designação clara e natural para a instalação de um acampamento militar.
- source_word: προπεπτωκώς
  choice: estava caído
  rationale: O particípio perfeito descreve tanto a queda anterior quanto o estado resultante. “Estava caído” mantém essa força sem especificar com certeza uma postura que o contexto não exige.
- source_word: κλίνην
  choice: cama
  rationale: κλίνη pode designar cama ou leito; “cama” é corrente e adequado à cena.
- source_word: περικεχυμένος
  choice: havia dominado
  rationale: A expressão figurada apresenta Holofernes inteiramente vencido pelos efeitos do vinho. A tradução evita a obscuridade de uma reprodução estritamente literal, preservando o vinho como sujeito da oração.
- source_word: οἶνος
  choice: o vinho
  rationale: Mantém o substantivo articulado como sujeito da explicação causal, referindo-se ao vinho que ele bebera.
