translation:
  language: pt
  text: Todos se retiraram da presença dele[a], e ninguém ficou no quarto, do menor ao maior.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de diante”; o pronome “dele” é entendido pelo contexto.
