lexical_decisions:
- source_word: ἀπῆλθοσαν
  choice: se retiraram
  rationale: O aoristo de ἀπέρχομαι indica que todos partiram do local; “se retiraram” é natural no contexto de pessoas que deixam a presença de alguém.
- source_word: ἐκ προσώπου
  choice: da presença dele
  rationale: A expressão grega significa literalmente “de diante” e, neste contexto, indica afastar-se da presença dele. O pronome é suprido pelo contexto, pois o grego não o explicita.
- source_word: οὐδεὶς κατελείφθη
  choice: ninguém ficou
  rationale: Reproduz com clareza o sentido passivo de que nenhuma pessoa foi deixada ou permaneceu no aposento.
- source_word: ἐν τῷ κοιτῶνι
  choice: no quarto
  rationale: κοιτών designa um aposento para dormir ou quarto privado; “quarto” é atual, claro e adequado ao contexto.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: do menor ao maior
  rationale: Preserva o merismo grego, que abrange todos sem exceção e provavelmente se refere à posição ou importância, sem restringi-lo à idade.
