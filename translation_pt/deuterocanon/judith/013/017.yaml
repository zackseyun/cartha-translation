  yaml_path: translation/deuterocanon/judith/013/017.yaml
  text: And all the people were greatly astonished[a], and bowing down they worshiped God and said with one accord, “Blessed are you, our God, who today have brought the enemies of your people to nothing.”
translation:
  language: pt
  text: 'Todo o povo ficou profundamente admirado e, curvando-se, adorou a Deus e disse a uma só voz: “Bendito és tu, nosso Deus, que hoje reduziste a nada[a] os inimigos do teu povo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “trataste como nada”. O verbo grego pode indicar tanto considerar alguém sem importância como reduzi-lo à ruína.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστη ... σφόδρα
  choice: ficou profundamente admirado
  rationale: O verbo ἐξίστημι descreve uma reação intensa de assombro, reforçada por σφόδρα. A formulação conserva essa força em português natural.
- source_word: κύψαντες
  choice: curvando-se
  rationale: Expressa o ato físico de baixar o corpo, associado aqui à adoração, sem acrescentar a ideia mais específica de prostração completa.
- source_word: προσεκύνησαν
  choice: adorou
  rationale: Como Deus é o objeto da ação, “adorou” comunica claramente o sentido religioso de προσκυνέω neste contexto.
- source_word: ὁμοθυμαδόν
  choice: a uma só voz
  rationale: Transmite a unanimidade e a ação conjunta do povo de maneira corrente e expressiva.
- source_word: Εὐλογητὸς εἶ
  choice: Bendito és tu
  rationale: Mantém a aclamação direta dirigida a Deus, em tom doxológico e digno.
- source_word: ἐξουδενώσας
  choice: reduziste a nada
  rationale: No contexto de vitória, o particípio indica que Deus anulou ou arruinou o poder dos inimigos. A nota preserva a possibilidade lexical de tratá-los como insignificantes.
- source_word: ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: hoje
  rationale: É a forma natural de verter a expressão temporal enfática no português moderno.
- source_word: τοὺς ἐχθροὺς τοῦ λαοῦ σου
  choice: os inimigos do teu povo
  rationale: Preserva de modo direto a referência aos adversários do povo pertencente a Deus.
theological_decisions:
- issue: Forma da aclamação dirigida a Deus
  choice: “Bendito és tu, nosso Deus”
  alternative: “Bendito é o nosso Deus”
  rationale: O grego usa a segunda pessoa εἶ (“és”), indicando louvor dirigido diretamente a Deus, e não uma afirmação em terceira pessoa.
- issue: Sentido de ἐξουδενώσας na derrota dos inimigos
  choice: “reduziste a nada”
  alternative: “trataste como nada”
  rationale: O contexto favorece a anulação efetiva dos inimigos, mas o campo semântico também pode indicar considerá-los ou tratá-los como insignificantes; a nota conserva essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se a imagem corporal de curvar-se e a fórmula litúrgica “Bendito és tu”. O substantivo coletivo “todo o povo” rege os verbos no singular em português natural, enquanto “a uma só voz” preserva a unanimidade expressa no grego.
