lexical_decisions:
- source_word: συνέδραμον
  choice: correram para lá
  rationale: Expressa tanto a pressa quanto o movimento convergente do grupo, em português natural.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν
  choice: desde o menor até o maior entre eles
  rationale: Preserva o merismo que abrange toda a comunidade sem restringi-lo especificamente à idade ou à posição social.
- source_word: παράδοξον ἦν αὐτοῖς
  choice: ficaram admirados
  rationale: Comunica a forte surpresa diante de algo inesperado, sem a possível conotação negativa de “estranho”.
- source_word: τοῦ ἐλθεῖν αὐτήν
  choice: por ela ter chegado
  rationale: O infinitivo articular indica a causa da admiração; esta formulação é clara e idiomática, sem acrescentar explicitamente a ideia de retorno.
- source_word: ἀπεδέξαντο αὐτάς
  choice: receberam as duas
  rationale: O verbo indica recepção favorável, e “as duas” torna natural em português a referência do pronome feminino plural a Judite e sua acompanhante.
- source_word: ἅψαντες πῦρ
  choice: acenderam uma fogueira
  rationale: Representa a ação anterior de atear fogo de modo concreto e natural no contexto narrativo.
- source_word: εἰς φάσιν
  choice: para iluminar
  rationale: Expressa de modo conciso a finalidade do fogo, sem interpretá-lo como sinal ou farol.
- source_word: περιεκύκλωσαν αὐτάς
  choice: se reuniram ao redor delas
  rationale: Conserva a disposição espacial de cercá-las, mas evita sugerir hostilidade indevida no contexto de acolhimento.
