  text: And they all ran together[a], from the least to the greatest among them, because it seemed astonishing to them that she had come; and they opened the gate and welcomed them. After lighting a fire for light, they gathered around them.
translation:
  language: pt
  text: Todos correram juntos, desde o menor até o maior dentre eles, pois lhes pareceu extraordinário que ela tivesse vindo; abriram o portão e as[a] receberam. Depois de acenderem um fogo para iluminar, reuniram-se ao redor delas.
