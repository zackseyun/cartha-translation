    rationale: O grego συνέδραμον indica que כולם convergiram/correram juntos; não informa um destino equivalente a “para lá”.
  - severity: low
    issue: “as duas” no texto, com nota sobre pronome
    rationale: Embora o referente seja de fato Judite e sua acompanhante, αὐτάς é um pronome feminino plural. Manter “as” no texto preserva a forma menos explícita do original e torna a nota funcional.
