  source_fidelity: A tradução transmite adequadamente a recepção de Judite e sua acompanhante, mas “para lá” acrescenta uma direção não expressa no grego e deixa menos nítido o sentido convergente de συνέδραμον. Além disso, “as duas” explicita no texto o que a nota apresenta como esclarecimento do pronome grego.
