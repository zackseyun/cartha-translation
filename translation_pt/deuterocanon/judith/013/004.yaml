  yaml_path: translation/deuterocanon/judith/013/004.yaml
  text: And Judith told her female slave to stand outside her sleeping chamber and watch for her going out[a], as on previous days, for she said that she would go out for her prayer[b]; and she spoke to Bagoas according to these words.
translation:
  language: pt
  text: E Judite disse à sua escrava que ficasse postada do lado de fora de seu quarto de dormir e vigiasse a saída de Judite, como todos os dias, pois disse que sairia para sua oração; e falou com Bagoas nesses termos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δούλῃ
  choice: serva
  rationale: O dativo feminino singular designa uma mulher em condição servil. Em português, «serva» preserva gênero e condição sem a estranheza de «escrava feminina»; o contexto narrativo deixa clara sua posição subordinada.
- source_word: στῆναι
  choice: que ficasse
  rationale: Embora o sentido básico seja «estar de pé», aqui o infinitivo expressa a ordem de permanecer postada fora do aposento; «ficasse» é natural em português e conserva a função contextual.
- source_word: κοιτῶνος
  choice: aposento
  rationale: O substantivo indica um quarto ou aposento de dormir. «Aposento» é digno e compreensível, sem o tom arcaico de «câmara de dormir».
- source_word: ἐπιτηρεῖν
  choice: vigiasse
  rationale: O verbo indica observar atentamente ou manter vigilância. «Vigiasse» transmite melhor essa atenção deliberada do que o genérico «olhasse».
- source_word: τὴν ἔξοδον αὐτῆς
  choice: a saída dela
  rationale: A expressão refere-se ao ato de Judite sair. «Dela» preserva a referência do pronome grego sem resolver silenciosamente a possível ambiguidade pronominal que «sua saída» produziria em português.
- source_word: καθάπερ καθʼ ἡμέρας
  choice: como fazia dia após dia
  rationale: A locução descreve um padrão diário já estabelecido. Esta formulação conserva a ideia iterativa do grego e é mais natural do que «conforme os dias».
- source_word: ἐξελεύσεσθαι
  choice: sairia
  rationale: O infinitivo futuro, dependente de «havia dito», é vertido naturalmente pelo futuro do pretérito no discurso indireto.
- source_word: ἐπὶ τὴν προσευχὴν αὐτῆς
  choice: para fazer sua oração
  rationale: A preposição com acusativo expressa finalidade ou direção. «Para fazer sua oração» comunica idiomaticamente que ela sairia a fim de orar, sem acrescentar um lugar não mencionado.
- source_word: κατὰ τὰ ῥήματα ταῦτα
  choice: essas mesmas palavras
  rationale: A expressão indica que Judite comunicou a Bagoas o mesmo teor. «Falou ... essas mesmas palavras» permanece próxima da forma grega e soa natural em português.
