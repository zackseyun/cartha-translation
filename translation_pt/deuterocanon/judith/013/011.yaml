base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/011.yaml
  text: And Judith said from a distance to those guarding the gates[a], “Open up, open up the gate, for God, our God, is with us, still to show strength in Israel and power against our enemies, just as he has done today.”
translation:
  language: pt
  text: 'E Judite disse de longe aos que vigiavam junto aos portões: “Abram, abram já o portão! Deus, o nosso Deus[a], está conosco para ainda manifestar força em Israel e poder contra os nossos inimigos, assim como fez hoje.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego, literalmente: “Deus, Deus nosso”; a repetição é enfática.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακρόθεν
  choice: de longe
  rationale: Expressa de modo natural e direto a distância espacial indicada pelo advérbio grego.
- source_word: τοῖς φυλάσσουσιν ἐπὶ τῶν πυλῶν
  choice: aos que vigiavam junto aos portões
  rationale: Preserva a ideia de pessoas de guarda e o plural πυλῶν, sem impor o substantivo masculino “guardas” ao particípio grego.
- source_word: Ἀνοίξατε, ἀνοίξατε δὴ τὴν πύλην
  choice: Abram, abram já o portão!
  rationale: Mantém a repetição urgente do imperativo; “já” comunica a ênfase imediata de δὴ, e o objeto permanece no singular, como πύλην.
- source_word: μεθʼ ἡμῶν
  choice: está conosco
  rationale: Torna explícita, como exige o português, a cópula subentendida na oração nominal grega.
- source_word: ὁ θεὸς ὁ θεὸς ἡμῶν
  choice: Deus, o nosso Deus
  rationale: Conserva a repetição enfática de θεός e sua força confessional sem transformá-la em título distinto.
- source_word: ποιῆσαι ἔτι ἰσχὺν
  choice: para ainda manifestar força
  rationale: “Manifestar força” verte idiomaticamente ποιεῖν ἰσχύν, enquanto “ainda” preserva o valor continuativo ou prospectivo de ἔτι.
- source_word: ἰσχὺν
  choice: força
  rationale: Equivalente corrente que mantém alguma distinção em relação a κράτος.
- source_word: κράτος
  choice: poder
  rationale: No contexto de libertação militar, indica poder eficaz ou força prevalecente, sem exigir a noção política de domínio.
- source_word: κατὰ τῶν ἐχθρῶν ἡμῶν
  choice: contra os nossos inimigos
  rationale: Representa diretamente o sentido adversativo de κατά com o genitivo.
- source_word: καθὰ καὶ σήμερον ἐποίησεν
  choice: assim como fez hoje
  rationale: Preserva a comparação e apresenta como concluída a ação realizada naquele mesmo dia.
theological_decisions:
- issue: A expressão divina enfática ὁ θεὸς ὁ θεὸς ἡμῶν
  choice: Deus, o nosso Deus
  alternative: o nosso Deus
  rationale: A repetição de θεός é retórica e enfática. Mantê-la conserva a ênfase do texto sem acrescentar uma distinção teológica ausente do grego.
- issue: Relação do infinitivo ποιῆσαι com a afirmação de que Deus está com Israel
  choice: “está conosco para ainda manifestar”
  alternative: “está conosco, ainda manifestando”
  rationale: A formulação com “para” conserva o valor final ou prospectivo plausível do infinitivo, sem reduzir a frase apenas a uma ação simultânea.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição do imperativo e da designação divina foi preservada; “portão” foi usado para a entrada fortificada da cidade, mantendo-se o plural na localização dos vigias e o singular no objeto da ordem.
