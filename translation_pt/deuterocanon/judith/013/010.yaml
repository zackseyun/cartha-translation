base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/010.yaml
  text: And she struck his neck twice with all her strength[a], and removed his head, and rolled his body off the bed[b], and took the canopy down from the posts.
translation:
  language: pt
  text: Ela golpeou o pescoço dele duas vezes com toda a sua força e tirou-lhe a cabeça[a]; rolou o corpo dele para fora da cama e retirou o dossel[b] dos postes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais explícito, “decepou-lhe a cabeça”. O grego diz literalmente “tirou-lhe a cabeça”, e o contexto deixa claro que ela o decapitou.
    reason: lexical_alternative
  - marker: b
    text: O termo grego pode designar um mosquiteiro ou um dossel de cama.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάταξεν εἰς τὸν τράχηλον αὐτοῦ
  choice: golpeou o pescoço dele
  rationale: O aoristo de πατάσσω indica um golpe forte; esta formulação é clara, atual e reproduz naturalmente em português a construção grega com εἰς.
- source_word: δὶς ἐν τῇ ἰσχύϊ αὐτῆς
  choice: duas vezes com toda a sua força
  rationale: Traduz diretamente δὶς e expressa de modo idiomático a intensidade indicada por ἐν τῇ ἰσχύϊ αὐτῆς.
- source_word: ἀφεῖλεν τὴν κεφαλὴν αὐτοῦ
  choice: tirou-lhe a cabeça
  rationale: Mantém a amplitude lexical de ἀφαιρέω, 'tirar, remover', enquanto o contexto deixa inequívoco que houve decapitação.
- source_word: ἀπεκύλισεν τὸ σῶμα αὐτοῦ ἀπὸ τῆς στρωμνῆς
  choice: fez o corpo dele rolar para fora da cama
  rationale: A forma causativa explicita naturalmente o sentido de ἀποκυλίω, fazer rolar; 'cama' é uma tradução corrente de στρωμνή neste contexto.
- source_word: ἀφεῖλε τὸ κωνώπιον ἀπὸ τῶν στύλων
  choice: retirou o dossel dos pilares
  rationale: κωνώπιον pode designar um mosquiteiro ou dossel de cama. 'Dossel' preserva a referência geral à armação de tecido, e 'pilares' corresponde a στῦλοι sem restringi-los explicitamente a postes da cama.
theological_decisions:
- issue: Grau de explicitação da decapitação
  choice: tirou-lhe a cabeça
  alternative: decepou-lhe a cabeça
  rationale: O contexto descreve claramente uma decapitação, mas o grego emprega o verbo mais amplo ἀφαιρέω, não um termo técnico para decapitar. O texto principal conserva essa forma lexical sem obscurecer o resultado da ação.
translation_notes:
  register: Português moderno, digno e narrativamente direto, com boa legibilidade brasileira. Os pronomes foram usados com parcimônia; “dele” evita possível ambiguidade de “seu”. Os marcadores de nota foram posicionados junto às expressões a que efetivamente se referem.
