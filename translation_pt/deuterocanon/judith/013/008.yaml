lexical_decisions:
- source_word: προσελθοῦσα
  choice: aproximando-se
  rationale: O particípio aoristo indica uma ação circunstancial anterior à ação principal; o gerúndio em português preserva com naturalidade a sequência narrativa sem explicitação excessiva.
- source_word: κανόνι τῆς κλίνης
  choice: coluna da cama
  rationale: No contexto, κανών designa uma peça estrutural da cama situada junto à cabeça e capaz de sustentar a arma. “Coluna da cama” é concreto e inteligível, sem especificar além da evidência se era poste, haste ou suporte.
- source_word: πρὸς κεφαλῆς Ὀλοφέρνου
  choice: junto à cabeça de Holofernes
  rationale: Preserva a localização espacial da peça da cama em relação à cabeça de Holofernes, com formulação natural em português.
- source_word: καθεῖλε ... ἀπʼ αὐτοῦ
  choice: tirou dali
  rationale: καθαιρέω aqui descreve retirar ou baixar algo do lugar onde estava; “tirou dali” comunica a ação e retoma naturalmente a coluna sem impor que a arma estivesse pendurada.
- source_word: ἀκινάκην
  choice: espada
  rationale: ἀκινάκης é mais especificamente uma espada curta ou adaga de tipo oriental. “Espada” oferece clareza no texto principal, enquanto a precisão lexical é preservada em nota.
