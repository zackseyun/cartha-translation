  yaml_path: translation/deuterocanon/judith/013/015.yaml
  text: And coming forward, she showed them the head from the bag and said to them, “Look, the head of Holofernes, the commander-in-chief of the army of Asshur; and look, the canopy under which he was lying in his drunkenness. And the Lord struck him down by the hand of a woman.”
translation:
  language: pt
  text: 'Ela se adiantou e mostrou-lhes a cabeça que estava na bolsa, dizendo: “Eis a cabeça de Holofernes, comandante-em-chefe do exército da Assíria; e eis o cortinado em que ele estava deitado em sua embriaguez. O Senhor o abateu pela mão de uma mulher.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προελθοῦσα
  choice: se adiantou
  rationale: Expressa naturalmente o movimento de Judite para a frente, sem acrescentar uma ação não explicitada.
- source_word: πήρα
  choice: bolsa
  rationale: Termo corrente e amplo para a bolsa ou sacola em que a cabeça era transportada.
- source_word: ἀρχιστρατήγου δυνάμεως Ἀσσούρ
  choice: comandante-chefe do exército da Assíria
  rationale: Reproduz a alta patente militar e torna o referente geopolítico inteligível em português moderno.
- source_word: κωνώπιον
  choice: cortinado
  rationale: Designa o tecido protetor suspenso sobre ou ao redor do leito; evita a possível impressão de uma estrutura rígida sugerida por 'dossel'.
- source_word: ἐν ταῖς μέθαις αὐτοῦ
  choice: em sua embriaguez
  rationale: Preserva o estado de intoxicação indicado pelo plural grego idiomático.
- source_word: ἐπάταξεν
  choice: abateu
  rationale: Comunica um golpe que resulta em derrota ou morte, adequado ao contexto, sem repetir desnecessariamente o ato físico já narrado.
- source_word: ἐν χειρὶ θηλείας
  choice: pela mão de uma mulher
  rationale: Mantém a formulação instrumental e enfática do grego.
theological_decisions:
- issue: Agência divina e humana na morte de Holofernes
  choice: O Senhor o abateu pela mão de uma mulher
  alternative: Uma mulher o matou com a ajuda do Senhor
  rationale: Preserva a afirmação teológica do texto, que atribui a ação ao Senhor e apresenta a mulher como seu instrumento, sem dissolver essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O imperativo plural “Vejam!” conserva a força demonstrativa de ἰδού; “Senhor” segue a referência divina de κύριος.
