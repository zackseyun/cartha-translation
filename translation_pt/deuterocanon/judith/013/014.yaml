  text: And she said to them with a loud voice, “Praise God, praise him; praise God, who has not withdrawn his mercy from the house of Israel, but has shattered our enemies by my hand in this night.”
translation:
  language: pt
  text: 'Ela lhes disse em alta voz: “Louvem a Deus, louvem-no! Louvem a Deus, que não retirou sua misericórdia da casa de Israel, mas esmagou nossos inimigos pela minha mão nesta noite.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αἰνεῖτε τὸν θεόν, αἰνεῖτε· αἰνεῖτε τὸν θεόν
  choice: Louvem a Deus, louvem-no! Louvem a Deus
  rationale: Preserva a repetição enfática e o imperativo plural, usando pontuação natural em português para transmitir a força da proclamação.
- source_word: οὐκ ἀπέστησεν τὸ ἔλεος αὐτοῦ
  choice: não retirou sua misericórdia
  rationale: Representa diretamente a ideia de não afastar ou retirar o favor misericordioso, sem explicação teológica adicional.
- source_word: ἔθραυσε
  choice: esmagou
  rationale: Comunica a ação vigorosa de quebrar ou destroçar os inimigos no contexto de vitória.
- source_word: διὰ χειρός μου
  choice: pela minha mão
  rationale: Mantém a expressão instrumental concreta do grego e a atribuição explícita da ação divina por intermédio de Judite.
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: nesta noite
  rationale: Reproduz naturalmente o demonstrativo e a referência temporal específica do grego.
theological_decisions:
- issue: Relação entre a ação de Deus e a atuação de Judite
  choice: esmagou nossos inimigos pela minha mão
  alternative: esmagou nossos inimigos por meu intermédio
  rationale: A formulação conserva a tensão e a imagem bíblica segundo as quais Deus age por meio da mão humana, sem reduzir nem confundir os dois agentes.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição retórica e a imagem semítica “pela minha mão” foram preservadas.
