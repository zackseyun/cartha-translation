  text: And Uzziah said to her[a], “Blessed are you, daughter, by the Most High God above all the women on the earth,”
translation:
  language: pt
  text: 'E Ozias lhe disse: “Bendita é você, filha, pelo Deus Altíssimo, mais do que todas as mulheres que há sobre a terra[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Bendita é você diante do Deus Altíssimo, mais do que todas as mulheres que há sobre a terra”. O dativo grego depois de “bendita” admite mais de uma interpretação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀζίας
  choice: Ozias
  rationale: Forma tradicional e amplamente reconhecível em português para o nome grego Ὀζίας.
- source_word: Εὐλογητὴ σύ
  choice: Bendita é você
  rationale: Preserva a construção enfática e a força de declaração solene, em português atual e digno.
- source_word: θυγάτηρ
  choice: filha
  rationale: Mantém literalmente o vocativo respeitoso e familiar, sem acrescentar o possessivo ausente no grego.
- source_word: τῷ θεῷ τῷ ὑψίστῳ
  choice: pelo Deus Altíssimo
  rationale: Expressa de modo natural a possibilidade de que Deus seja o agente ou fundamento da bênção; a ambiguidade do dativo é registrada em nota.
- source_word: παρὰ πάσας τὰς γυναῖκας
  choice: mais do que todas as mulheres
  rationale: Conserva a força comparativa de παρά com acusativo sem reduzir a expressão ao sentido de 'entre'.
- source_word: τὰς ἐπὶ τῆς γῆς
  choice: que há sobre a terra
  rationale: Torna explícito em português natural que se trata das mulheres existentes sobre a terra, preservando o alcance amplo da expressão.
theological_decisions:
- issue: Valor do dativo τῷ θεῷ τῷ ὑψίστῳ na fórmula de bênção
  choice: Judite é declarada bendita pelo Deus Altíssimo
  alternative: Judite é declarada bendita diante do Deus Altíssimo
  rationale: A sintaxe permite entender o dativo como agente, referência ou esfera de avaliação. O texto principal adota a leitura idiomática 'pelo', mas a nota preserva a alternativa genuína sem sugerir que Judite esteja bendizendo a Deus.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A ordem marcada “Bendita é você” retém a ênfase da declaração grega; “você” evita arcaísmo, enquanto “filha” conserva o tom respeitoso.
