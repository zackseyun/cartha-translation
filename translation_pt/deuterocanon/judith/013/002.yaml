  text: For they were all exhausted[a], because the drinking had gone on too long.
translation:
  language: pt
  text: Pois todos estavam exaustos, porque a sessão de bebida tinha se prolongado demais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “porque a bebida tinha durado mais tempo” ou “porque o beber havia se tornado excessivo”. A expressão grega pode indicar excesso de duração ou de extensão no contexto da bebida.
    reason: lexical_alternative
lexical_decisions:
- source_word: κεκοπωμένοι
  choice: estavam exaustos
  rationale: O particípio perfeito descreve o estado resultante de cansaço intenso; “estavam exaustos” expressa isso com naturalidade em português.
- source_word: διὰ τὸ ... γεγονέναι
  choice: porque ... havia se prolongado
  rationale: A construção indica a causa do estado deles. O mais-que-perfeito composto comunica que a ação anterior produziu a exaustão.
- source_word: ἐπὶ πλεῖον
  choice: demais
  rationale: A expressão indica extensão ou duração excessiva; no contexto, “demais” preserva essa ideia sem determinar rigidamente se o excesso foi apenas de tempo ou também de intensidade.
- source_word: τὸν πότον
  choice: a bebedeira
  rationale: πότος designa o ato ou uma ocasião de beber, frequentemente em abundância. “Bebedeira” é corrente e reúne naturalmente as ideias de consumo de bebida e ocasião prolongada, sem introduzir comida como faria “banquete”.
- source_word: γὰρ
  choice: Pois
  rationale: A conjunção introduz uma explicação para a situação anterior; “Pois” conserva de modo claro essa ligação explicativa.
