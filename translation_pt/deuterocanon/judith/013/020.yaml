base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/020.yaml
  text: And may God make these things for you into everlasting exaltation[a], to visit you with good things, because you did not spare your life on account of the humiliation of our people, but went out against our fallen condition, having walked straight before our God. And all the people said, “Amen, amen.”
translation:
  language: pt
  text: 'E que Deus faça dessas coisas, para você, uma exaltação eterna, para visitá-la com coisas boas, pois você não poupou a própria vida por causa da humilhação do nosso povo, mas saiu por causa da nossa ruína, seguindo por um caminho reto diante do nosso Deus. E todo o povo disse: “Assim seja, assim seja”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Amém, amém”. Grego: “Γένοιτο, γένοιτο.”'
    reason: Registra a alternativa litúrgica tradicional para a aclamação grega, enquanto o texto principal conserva a equivalência lexical direta.
lexical_decisions:
- source_word: ποιήσαι σοι αὐτὰ ὁ θεὸς εἰς ὕψος αἰώνιον
  choice: que Deus faça dessas coisas uma exaltação eterna para você
  rationale: Mantém o desejo ou oração expresso pela forma grega, conserva o plural αὐτά e retém a imagem de ὕψος como exaltação, em português natural.
- source_word: τοῦ ἐπισκέψασθαί σε ἐν ἀγαθοῖς
  choice: e a visite com bens
  rationale: ἐπισκέπτομαι pode indicar visitar, cuidar ou olhar favoravelmente; a formulação preserva a imagem verbal e o sentido beneficente de ἐν ἀγαθοῖς, sem reduzi-lo simplesmente a 'abençoar'.
- source_word: οὐκ ἐφείσω τῆς ψυχῆς σου
  choice: você não poupou a própria vida
  rationale: Neste contexto de perigo mortal, ψυχή designa a vida ou a própria pessoa; a expressão escolhida é clara e idiomática.
- source_word: διὰ τὴν ταπείνωσιν τοῦ γένους ἡμῶν
  choice: por causa da humilhação do nosso povo
  rationale: ταπείνωσις comporta humilhação, abatimento ou aflição; 'humilhação' preserva a desonra pública, enquanto γένος é naturalmente coletivo aqui.
- source_word: ἀλλʼ ἐπεξῆλθες πτώματι ἡμῶν
  choice: mas se levantou contra a nossa queda
  rationale: A construção é difícil. ἐπεξέρχομαι pode expressar avançar ou agir contra algo, e πτῶμα indica queda, ruína ou estado caído. A tradução preserva tanto a ação resoluta de Judite quanto a ambiguidade entre reagir à queda e opor-se a ela.
- source_word: ἐπʼ εὐθεῖαν πορευθεῖσα
  choice: seguindo por um caminho reto
  rationale: Conserva a metáfora concreta do percurso reto e sua possível dimensão moral, sem substituí-la inteiramente por 'agindo com retidão'.
- source_word: Γένοιτο, γένοιτο
  choice: Assim seja, assim seja
  rationale: Expressa de perto o valor desiderativo de γένοιτο e funciona naturalmente como resposta comunitária em português; a alternativa litúrgica 'Amém' é registrada em nota.
theological_decisions:
- issue: A relação entre a exaltação concedida por Deus e sua visita benéfica
  choice: 'coordenação: ''e a visite com bens'''
  alternative: 'finalidade: ''para visitá-la com bens'''
  rationale: O infinitivo articular τοῦ ἐπισκέψασθαί pode ser entendido de modo final ou explicativo. A coordenação produz português mais natural sem definir rigidamente a relação lógica.
- issue: O sentido da ação de Judite diante de πτῶματι ἡμῶν
  choice: se levantou contra a nossa queda
  alternative: saiu por causa da nossa ruína / avançou diante da nossa queda
  rationale: O dativo e o verbo composto admitem mais de uma relação. A escolha comunica oposição ativa à ruína do povo, mas evita identificar a 'queda' com uma doutrina específica.
- issue: A aclamação comunitária Γένοιτο, γένοιτο
  choice: Assim seja, assim seja
  alternative: Amém, amém
  rationale: A tradução escolhida preserva o sentido lexical de desejo e assentimento. A alternativa tradicional litúrgica é indicada em nota para não perder sua força cultual.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Emprega 'você' por clareza contemporânea, evita linguagem acadêmica e conserva as imagens de exaltação, visita, queda e caminho reto.
