  source_fidelity: O texto preserva bem a fórmula solene, a proteção no caminho, a imagem concreta de «meu rosto» e a formulação reservada acerca do pecado. Contudo, «o que teria resultado» introduz uma construção contrafactual que não está expressa no grego; εἰς μίασμα καὶ αἰσχύνην liga contaminação e vergonha ao pecado que não ocorreu.
  naturalness: O português é, em geral, claro e solene. A reformulação para «causando contaminação e vergonha» elimina o condicional acrescentado e soa natural, deixando claro que são consequências do pecado mencionado.
  terminology: «Senhor», «pecado», «contaminação» e «vergonha» são escolhas adequadas. A nota deve evitar a expressão pouco idiomática «induziu Holofernes ao engano» e explicar diretamente que a aparência de Judite o enganou.
  issues:
