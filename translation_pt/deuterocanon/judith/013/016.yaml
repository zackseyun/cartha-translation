base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/016.yaml
  text: And as the Lord lives, who guarded me on the way by which I went, my face deceived him to his destruction, and he did not commit sin with me, resulting in defilement and shame.
translation:
  language: pt
  text: E, tão certo como vive o Senhor, que me guardou no caminho por onde fui, meu rosto[a] o enganou para a sua perdição, e ele não cometeu pecado comigo, causando contaminação e vergonha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «meu rosto o enganou»; a expressão se refere à aparência exterior de Judite, que enganou Holofernes.
    reason: Esclarece o sentido contextual da expressão concreta τὸ πρόσωπόν μου sem substituí-la no texto principal.
lexical_decisions:
- source_word: ζῇ Κύριος
  choice: tão certo como vive o Senhor
  rationale: Reproduz em português natural a fórmula solene de juramento, mantendo κύριος como «Senhor».
- source_word: διεφύλαξέν με
  choice: me guardou
  rationale: Expressa a proteção e preservação divinas com formulação corrente e próxima do grego.
- source_word: ἐν τῇ ὁδῷ μου ᾗ ἐπορεύθην
  choice: no caminho por onde fui
  rationale: Conserva a imagem concreta do caminho e a oração relativa sem substituir o percurso por uma interpretação como «missão».
- source_word: ἠπάτησεν αὐτὸν τὸ πρόσωπόν μου
  choice: meu rosto o enganou
  rationale: Mantém o sujeito concreto e enfático do grego, «meu rosto», cuja referência contextual é à aparência de Judite.
- source_word: εἰς ἀπώλειαν αὐτοῦ
  choice: para a sua perdição
  rationale: Preserva a força resultativa de εἰς e o sentido de ruína ou destruição em ἀπώλεια.
- source_word: οὐκ ἐποίησεν ἁμάρτημα μετʼ ἐμοῦ
  choice: ele não cometeu pecado comigo
  rationale: Mantém o substantivo explícito «pecado» e a formulação comedida do original, sem explicitar além do texto a natureza sexual do ato.
- source_word: εἰς μίασμα καὶ αἰσχύνην
  choice: o que teria resultado em contaminação e vergonha
  rationale: Comunica o resultado evitado no contexto e conserva os sentidos moral e possivelmente ritual de μίασμα, sem tornar a frase portuguesa obscura.
theological_decisions:
- issue: Tradução de κύριος na fórmula de juramento
  choice: Senhor
  alternative: Soberano
  rationale: Aqui κύριος é o título divino numa declaração solene; «Senhor» é a tradução portuguesa estabelecida e adequada.
- issue: Explicitar a natureza sexual de «não cometeu pecado comigo»
  choice: manter a formulação ampla do grego
  alternative: não me violou
  rationale: O contexto aponta para uma transgressão sexual, mas o grego não a nomeia diretamente; a tradução preserva essa reserva e a tensão do texto.
- issue: Relação de εἰς μίασμα καὶ αἰσχύνην com a oração negativa
  choice: apresentar contaminação e vergonha como resultado que teria ocorrido
  alternative: para contaminação e vergonha
  rationale: A formulação contrafactual torna inteligível em português que tais consequências foram evitadas, sem afirmar que efetivamente ocorreram.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva o tom solene da fala e a imagem concreta do caminho e do rosto, evitando arcaísmos desnecessários e explicitação sexual não presente no grego.
