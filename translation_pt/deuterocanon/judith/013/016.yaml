    issue: A expressão «o que teria resultado em contaminação e vergonha» acrescenta uma modalidade contrafactual.
    rationale: O grego diz que ele não cometeu pecado com Judite εἰς μίασμα καὶ αἰσχύνην, vinculando o pecado a contaminação e vergonha, mas não formula explicitamente a consequência em modo condicional.
  - severity: low
