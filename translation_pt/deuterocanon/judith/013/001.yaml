base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/001.yaml
  text: When evening came[a], his slaves hurried to depart; and Bagoas shut the tent from outside and excluded those in attendance from the presence of his lord, and they went away to their beds.
translation:
  language: pt
  text: Quando anoiteceu, os escravos dele[a] se apressaram a se retirar. Bagoas fechou a tenda pelo lado de fora, excluiu da presença de seu senhor os que estavam de serviço, e eles foram para seus leitos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos”. O grego diz “escravos” (δοῦλοι), referindo-se a membros do séquito doméstico submetidos à autoridade dele.
    reason: Registra a alternativa lexical corrente sem ocultar a condição social indicada pelo termo grego.
lexical_decisions:
- source_word: ὀψία ἐγένετο
  choice: Quando anoiteceu
  rationale: Expressa de modo natural em português a chegada da tarde ou do anoitecer, sem tornar o momento mais preciso do que o grego permite.
- source_word: ἐσπούδασαν
  choice: se apressaram
  rationale: Preserva a ideia de pressa ou diligência do verbo grego em linguagem corrente.
- source_word: οἱ δοῦλοι αὐτοῦ
  choice: os escravos dele
  rationale: Mantém a realidade social indicada por δοῦλοι, pessoas sujeitas à autoridade do senhor no séquito doméstico ou militar; 'dele' evita atribuir os escravos a Bagoas, mencionado apenas depois.
- source_word: ἀναλύειν
  choice: a se retirar
  rationale: No contexto, indica dispersar-se ou deixar o serviço daquela noite; 'retirar-se' comunica isso com clareza e dignidade.
- source_word: συνέκλεισεν τὴν σκηνὴν ἔξωθεν
  choice: fechou a tenda pelo lado de fora
  rationale: Reproduz tanto o fechamento da tenda quanto o fato de ele ter sido realizado externamente, sem acrescentar um mecanismo não mencionado.
- source_word: ἀπέκλεισεν τοὺς παρεστῶτας
  choice: excluiu ... os que estavam de serviço
  rationale: ἀπέκλεισεν indica impedir a permanência ou o acesso, enquanto o particípio designa os presentes que serviam ou assistiam o senhor.
- source_word: ἐκ προσώπου τοῦ κυρίου αὐτοῦ
  choice: da presença de seu senhor
  rationale: Verte a expressão idiomática grega e mantém κύριος como título social de superioridade, não como designação divina.
- source_word: ἀπῴχοντο εἰς τὰς κοίτας αὐτῶν
  choice: eles foram para seus leitos
  rationale: Preserva o movimento narrativo e o plural do original em registro digno e compreensível.
- source_word: Βαγώας
  choice: Bagoas
  rationale: Transliteração portuguesa convencional do nome próprio grego.
theological_decisions:
- issue: Tradução de δοῦλοι em contexto doméstico-militar
  choice: escravos
  alternative: servos
  rationale: O termo grego denota pessoas sob domínio de um senhor e pode implicar condição escravizada. A tradução principal preserva essa realidade social; a alternativa mais ampla é registrada em nota sem suavizar o texto.
- issue: Sentido de κύριος neste contexto
  choice: senhor
  alternative: amo
  rationale: Aqui κύριος se refere ao superior humano de Bagoas, Holofernes. 'Senhor' conserva o registro da narrativa sem sugerir que se trate de um título divino.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe foi dividida em duas frases para maior clareza narrativa. O marcador [a] foi colocado junto a “escravos”, termo ao qual a nota efetivamente se refere.
