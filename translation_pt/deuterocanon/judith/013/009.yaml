  text: And when she came near to the bed, she seized the hair of his head and said, “Strengthen me, O God of Israel, on this day.”
translation:
  language: pt
  text: 'E, aproximando-se da cama, agarrou os cabelos da cabeça dele e disse: “Fortalece-me, ó Deus de Israel, neste dia.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγγίσασα
  choice: aproximando-se
  rationale: O particípio aoristo de ἐγγίζω indica uma ação anterior ou concomitante; o gerúndio expressa com naturalidade o movimento em direção à cama.
- source_word: κλίνη
  choice: cama
  rationale: κλίνη pode indicar cama ou leito; “cama” é claro, corrente e adequado à cena narrativa.
- source_word: ἐδράξατο
  choice: agarrou
  rationale: O verbo δράσσομαι comunica tomar firmemente com a mão; “agarrou” preserva a ação decidida sem elevar desnecessariamente o registro.
- source_word: κόμη
  choice: os cabelos
  rationale: κόμη designa os cabelos da cabeça, com frequência cabelos longos. O plural idiomático “os cabelos” soa natural em português.
- source_word: τῆς κεφαλῆς αὐτοῦ
  choice: da cabeça dele
  rationale: Mantém a especificidade enfática da construção genitiva grega e deixa inequívoco que os cabelos são dele.
- source_word: Κραταίωσόν με
  choice: Fortalece-me
  rationale: O imperativo de κραταιόω pede que Deus conceda força ou vigor. “Fortalece-me” é direto, solene e fiel à forma verbal.
- source_word: ὁ θεὸς Ἰσραήλ
  choice: ó Deus de Israel
  rationale: Embora formalmente nominativa com artigo, a expressão tem força de vocativo. “Ó” marca de modo natural o apelo direto da oração.
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: neste dia
  rationale: É uma expressão temporal idiomática; “neste dia” preserva a referência imediata ao momento da ação.
theological_decisions:
- issue: Forma da oração e invocação divina
  choice: ó Deus de Israel
  alternative: Deus de Israel
  rationale: A construção grega funciona como invocação direta. A partícula portuguesa “ó” explicita a força vocativa sem acrescentar conteúdo teológico.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. Conserva-se a sequência compacta do grego e o tom solene da breve oração.
