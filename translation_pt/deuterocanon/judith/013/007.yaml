  text: And she went up to the bed, seized the hair of his head, and said, “Strengthen me, O God of Israel, on this day.”
translation:
  language: pt
  text: 'Ela se aproximou da cama, agarrou os cabelos da cabeça dele e disse: “Fortalece-me, ó Deus de Israel, neste dia.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγγίσασα
  choice: se aproximou
  rationale: O particípio de ἐγγίζω indica aproximar-se ou chegar perto. A formulação é natural em português e conserva o movimento em direção à cama.
- source_word: κλίνης
  choice: da cama
  rationale: κλίνη pode designar cama ou leito; “cama” é claro, atual e adequado ao contexto narrativo.
- source_word: ἐδράξατο
  choice: agarrou
  rationale: O verbo δράσσομαι expressa tomar ou segurar firmemente. “Agarrou” transmite a ação decidida sem introduzir informação ausente do grego.
- source_word: κόμης τῆς κεφαλῆς αὐτοῦ
  choice: os cabelos da cabeça dele
  rationale: A expressão preserva a referência explícita do grego aos cabelos da cabeça e identifica o possuidor com clareza natural em português.
- source_word: Κραταίωσόν με
  choice: Fortalece-me
  rationale: O imperativo aoristo pede que Deus lhe dê força naquele momento. “Fortalece-me” é conciso, solene e mantém a forma verbal da oração.
- source_word: ὁ θεὸς Ἰσραήλ
  choice: ó Deus de Israel
  rationale: Embora θεός esteja formalmente no nominativo, funciona como chamamento direto. O vocativo português com “ó” conserva o tom solene da invocação.
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: neste dia
  rationale: A expressão temporal é vertida de maneira direta e digna, mantendo a especificidade de “este dia”, em vez de reduzi-la simplesmente a “hoje”.
theological_decisions:
- issue: A invocação de Judite a Deus no contexto de uma libertação violenta
  choice: 'Reproduzir diretamente a oração: “Fortalece-me, ó Deus de Israel, neste dia.”'
  alternative: “Dá-me força, Deus de Israel, hoje.”
  rationale: O texto apresenta a súplica sem explicação ou avaliação teológica adicional. A tradução mantém sua urgência, a referência ao Deus de Israel e a tensão narrativa, sem suavizar nem ampliar o sentido.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Cama” e “agarrou” favorecem compreensão imediata; “Fortalece-me” e “ó Deus de Israel” preservam a solenidade breve da oração. Não são necessárias notas de rodapé, pois não há ambiguidade textual ou lexical relevante que exija explicação ao leitor.
