base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/007.yaml
  text: And formerly they lived as sojourners in Mesopotamia[a], because they were not willing to follow the gods of their fathers[b], who were in the land of the Chaldeans.
translation:
  language: pt
  text: Anteriormente, eles residiam como estrangeiros na Mesopotâmia[a], porque não quiseram seguir os deuses de seus pais, que estavam na terra dos caldeus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “residiram como estrangeiros na Mesopotâmia”. O verbo grego indica morar em um lugar como estrangeiro ou residente temporário.'
    reason: lexical_alternative
  - marker: b
    text: A oração relativa pode referir-se tanto a “pais” quanto a “deuses”. Literalmente, o verbo grego pode sugerir “que vieram a estar na terra dos caldeus”; também pode ser entendido, de modo mais fluente, como “que estavam” ou, se referido aos deuses, “que tiveram origem” naquela terra.
    reason: alternative_reading
lexical_decisions:
- source_word: παρῴκησαν
  choice: viveram como estrangeiros residentes
  rationale: Expressa tanto a residência no lugar quanto a condição de quem ali vive sem pertencer à população nativa; evita reduzir o verbo ao sentido genérico de apenas morar.
- source_word: τὸ πρότερον
  choice: anteriormente
  rationale: Marca de modo claro e natural um período anterior em relação ao relato.
- source_word: Μεσοποταμίᾳ
  choice: Mesopotâmia
  rationale: Forma geográfica consagrada em português.
- source_word: οὐκ ἐβουλήθησαν
  choice: não quiseram
  rationale: Preserva o elemento volitivo de βούλομαι sem intensificá-lo para uma recusa explicitamente desafiadora.
- source_word: ἀκολουθῆσαι
  choice: seguir
  rationale: Mantém a metáfora do original e sua aplicação à lealdade religiosa, sem introduzir o verbo específico 'adorar'.
- source_word: τοῖς θεοῖς τῶν πατέρων αὐτῶν
  choice: os deuses de seus pais
  rationale: Conserva a referência familiar masculina explícita do grego e a ideia de religião herdada.
- source_word: οἳ ἐγένοντο ἐν γῇ Χαλδαίων
  choice: que vieram a estar na terra dos caldeus
  rationale: Reproduz, tanto quanto o português permite, a formulação incomum com γίνομαι e mantém aberta a relação exata entre os deuses e a terra dos caldeus.
theological_decisions:
- issue: Descrição do afastamento da religião ancestral
  choice: não quiseram seguir os deuses de seus pais
  alternative: recusaram-se a adorar os deuses de seus antepassados
  rationale: O grego fala de não querer seguir, não emprega aqui um verbo específico para adorar. A opção evita intensificar a oposição religiosa além do que o texto afirma.
- issue: Referente e sentido da oração relativa final
  choice: que vieram a estar na terra dos caldeus
  alternative: que estavam na terra dos caldeus
  rationale: A redação conserva a construção difícil do grego e não decide silenciosamente se a expressão indica simples localização, estabelecimento ou origem dos deuses.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação 'estrangeiros residentes' é deliberadamente mais explícita que 'peregrinos', que no uso atual pode sugerir sobretudo viagem religiosa. A oração final permanece levemente incomum para preservar a ambiguidade real do grego.
