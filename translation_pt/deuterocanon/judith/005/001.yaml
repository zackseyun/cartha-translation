base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/001.yaml
  text: And it was reported to Holofernes[a], the commander-in-chief of the forces of Assyria, that the sons of Israel had prepared for war, and had blocked the roads of the hill country and fortified every summit of every high mountain[b], and had set up obstacles in the plains.
translation:
  language: pt
  text: E foi comunicado a Holofernes, comandante-em-chefe das forças da Assíria, que os filhos de Israel[a] haviam se preparado para a guerra, bloqueado as estradas da região montanhosa, fortificado cada cume de montanha elevada e colocado obstáculos[b] nas planícies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os israelitas” ou “os descendentes de Israel”. O grego diz literalmente “os filhos de Israel”, uma designação étnica tradicional para o povo de Israel.
    reason: lexical_alternative
  - marker: b
    text: Ou “armadilhas” ou “barricadas”. O termo grego pode designar algo que faz tropeçar, mas aqui se refere a impedimentos físicos em um contexto militar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνηγγέλη
  choice: foi comunicado
  rationale: O aoristo passivo de ἀναγγέλλω indica que a informação chegou a Holofernes sem identificar o mensageiro; a formulação impessoal preserva esse aspecto.
- source_word: ἀρχιστρατήγῳ
  choice: comandante-chefe
  rationale: O título composto designa o comandante militar de mais alta patente; esta expressão é precisa e natural em português atual.
- source_word: δυνάμεως Ἀσσούρ
  choice: das forças da Assíria
  rationale: No contexto militar, δύναμις denota força armada ou exército; o plural coletivo comunica bem esse sentido.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: os filhos de Israel
  rationale: Mantém visível a forma da designação étnica grega, que convencionalmente se refere ao povo israelita.
- source_word: παρεσκευάσθησαν εἰς πόλεμον
  choice: haviam se preparado para a guerra
  rationale: Expressa prontidão militar e, no discurso relatado, o mais-que-perfeito situa naturalmente a preparação antes da comunicação a Holofernes.
- source_word: τὰς ὁδοὺς τῆς ὀρεινῆς
  choice: as estradas da região montanhosa
  rationale: ἡ ὀρεινή designa uma região de relevo montanhoso; a expressão é clara e geograficamente neutra.
- source_word: συνέκλεισαν
  choice: bloqueado
  rationale: No contexto de defesa militar e de estradas, o verbo indica fechar ou impedir a passagem.
- source_word: ἐτείχισαν
  choice: fortificado
  rationale: τειχίζω significa cercar com muralhas ou tornar defensável; “fortificado” transmite a ação militar sem exigir uma técnica específica.
- source_word: πᾶσαν κορυφὴν ὄρους ὑψηλοῦ
  choice: cada cume de montanha elevada
  rationale: Preserva a distribuição expressa por πᾶσαν e os singulares do grego, sem acrescentar um segundo quantificador não explícito.
- source_word: σκάνδαλα
  choice: obstáculos
  rationale: No cenário de preparativos defensivos, refere-se a impedimentos físicos; o termo amplo evita decidir indevidamente entre armadilhas, barreiras ou outros obstáculos.
- source_word: ἐν τοῖς πεδίοις
  choice: nas planícies
  rationale: πέδιον denota terreno plano ou planície; a formulação conserva a referência geográfica.
theological_decisions:
- issue: Designação étnica οἱ υἱοὶ Ἰσραήλ
  choice: os filhos de Israel
  alternative: os israelitas; os descendentes de Israel
  rationale: A expressão é uma designação coletiva convencional. A tradução formal conserva a imagem genealógica do texto sem restringir a referência apenas aos homens.
- issue: Sentido militar de σκάνδαλα
  choice: obstáculos
  alternative: armadilhas; barricadas; coisas que fazem tropeçar
  rationale: O contexto descreve medidas militares concretas. “Obstáculos” mantém a amplitude lexical e evita importar o sentido teológico figurado que o termo pode ter em outros contextos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação verbal foi mantida de forma fluente, e os marcadores de nota foram colocados junto às expressões que explicam.
