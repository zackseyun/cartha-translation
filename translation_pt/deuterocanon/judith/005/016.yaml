base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/016.yaml
  text: And they drove out from before them the Canaanite[a], the Perizzite, the Jebusite, the Shechemite, and all the Girgashites, and they lived in it for many days.
translation:
  language: pt
  text: E expulsaram de diante de si os cananeus, os ferezeus, os jebuseus, os siquemitas[a] e todos os girgaseus; e habitaram nela por muitos dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “Siquém”; neste contexto, a forma pode se referir à cidade ou ao povo de Siquém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέβαλον
  choice: expulsaram
  rationale: Expressa a remoção forçada indicada pelo verbo grego e mantém, sem suavização, a força do relato.
- source_word: ἐκ προσώπου αὐτῶν
  choice: de diante de si
  rationale: Preserva de modo inteligível o idiomatismo semítico que indica afastamento da presença deles.
- source_word: τὸν Χαναναῖον καὶ τὸν Φερεζαῖον καὶ τὸν Ἰεβουσαῖον
  choice: os cananeus, os ferezeus, os jebuseus
  rationale: Os singulares gregos são coletivos; em português, o plural designa naturalmente esses povos.
- source_word: τὸν Συχέμ
  choice: os siquemitas[a]
  rationale: No contexto de uma enumeração de povos, a forma é entendida como referência ao povo de Siquém; a nota preserva a forma incomum e sua ambiguidade.
- source_word: πάντας τοὺς Γεργεσαίους
  choice: todos os girgaseus
  rationale: Reproduz diretamente o plural acompanhado de πάντας, com o etnônimo bíblico corrente em português.
- source_word: κατῴκησαν ἐν αὐτῇ
  choice: habitaram nela
  rationale: Mantém o sentido de residência continuada e o pronome feminino, cuja referência natural é a terra mencionada no contexto.
- source_word: ἡμέρας πολλάς
  choice: por muitos dias
  rationale: Traduz literalmente o acusativo de duração sem substituí-lo pela expressão mais interpretativa “por muito tempo”.
theological_decisions:
- issue: Relato da expulsão dos habitantes anteriores
  choice: expulsaram ... e habitaram nela
  alternative: desalojaram ... e se estabeleceram ali
  rationale: A redação conserva a força da afirmação histórica de conquista e ocupação, sem eufemismo nem enquadramento teológico adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas plurais naturais para nomes coletivos de povos. O idiomatismo “de diante de si” conserva a coloração do original sem comprometer a clareza.
