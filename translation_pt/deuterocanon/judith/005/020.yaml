base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/020.yaml
  text: And now[a], master lord, if indeed there is an offense in this people and they are sinning against their God, and if we ascertain that this stumbling block is among them, then we will go up and make war against them;
translation:
  language: pt
  text: E agora, senhor e mestre, se de fato há uma falta[a] neste povo e eles estão pecando contra o seu Deus, e se verificarmos que esse tropeço existe entre eles, então subiremos e guerrearemos contra eles;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «erro» ou «pecado cometido por ignorância». O termo grego pode indicar uma falta decorrente de desconhecimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσποτα κύριε
  choice: senhor e mestre
  rationale: Preserva os dois termos da forma enfática de tratamento dirigida a Holofernes, em ordem natural no português, sem sugerir o título divino «SENHOR».
- source_word: ἀγνόημα
  choice: falta
  rationale: Expressa erro ou transgressão culpável sem eliminar a possível nuance de ignorância, registrada em nota.
- source_word: ἁμαρτάνουσιν εἰς τὸν θεὸν αὐτῶν
  choice: eles estão pecando contra o seu Deus
  rationale: A forma progressiva comunica o aspecto presente da ação, e «contra» representa o sentido relacional de εἰς com ἁμαρτάνω.
- source_word: ἐπισκεψόμεθα
  choice: verificarmos
  rationale: No contexto condicional, indica investigar e constatar a existência da falta; o futuro grego é expresso naturalmente pela construção portuguesa «se verificarmos».
- source_word: σκάνδαλον
  choice: tropeço
  rationale: Conserva a metáfora de σκάνδαλον e sua ideia de algo que leva à queda, sem reduzi-la a uma infração genérica.
- source_word: ἀναβησόμεθα
  choice: subiremos
  rationale: Mantém o sentido literal e possivelmente topográfico, que no contexto também descreve um avanço militar.
- source_word: ἐκπολεμήσομεν
  choice: guerrearemos contra
  rationale: Comunica uma ação militar organizada e é mais forte que simplesmente «lutaremos».
theological_decisions:
- issue: Forma dupla de tratamento δέσποτα κύριε
  choice: senhor e mestre
  alternative: Senhor; soberano senhor; mestre
  rationale: A fala é dirigida a Holofernes, não a Deus. A tradução conserva os dois títulos gregos, mas evita grafia ou formulação que possa ser confundida com um título divino.
- issue: Relação entre o pecado do povo e sua vulnerabilidade militar
  choice: preservar a condição expressa no texto
  alternative: explicitar que o pecado causaria necessariamente a derrota
  rationale: O versículo apresenta a falta como condição a ser verificada antes do ataque; a tradução não acrescenta uma doutrina causal mais definida do que a formulação grega.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Senhor e mestre» soa natural como tratamento humano enfático; «subiremos» preserva a textura do original, e «guerrearemos» mantém a força militar do verbo.
