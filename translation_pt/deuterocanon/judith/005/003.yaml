translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sequência de perguntas foi preservada, assim como as distinções e sobreposições do vocabulário militar grego. Os pronomes alternam “sua” e “deles” para evitar repetição excessiva e manter claros os referentes.
