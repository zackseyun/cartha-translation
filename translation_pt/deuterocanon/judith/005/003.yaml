base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/003.yaml
  text: And he said to them, “Tell me, then, sons of Canaan, who is this people that dwells in the hill country, and which cities they inhabit, and the size of their military force, and in what their power and their strength consist, and who has risen over them as king, leading their army.”
translation:
  language: pt
  text: 'E ele lhes disse: “Digam-me, então, filhos de Canaã[a], quem é este povo que habita na região montanhosa[b], em que cidades eles moram, qual é o tamanho de sua força militar[c], em que consistem seu poder e sua força, e quem se levantou sobre eles como rei, comandando o exército deles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cananeus”. O grego diz literalmente “filhos de Canaã”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que vive na região montanhosa”. O grego diz literalmente “que está sentado na região montanhosa”, expressão idiomática que aqui significa morar ou habitar.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “qual é o número de seu exército” ou “qual é a extensão de sua força”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναγγείλατέ δή μοι
  choice: Digam-me, então
  rationale: O imperativo pede um relato direto; “digam-me” é natural e preserva a força da ordem. “Então” representa a partícula δή como elemento de ênfase e progressão discursiva.
- source_word: υἱοὶ Χαναάν
  choice: filhos de Canaã
  rationale: Mantém a expressão vocativa literal do grego e sua forma familiar, deixando em nota a alternativa étnica natural.
- source_word: ὁ λαὸς οὗτος ὁ καθήμενος ἐν τῇ ὀρεινῇ
  choice: este povo que habita na região montanhosa
  rationale: λαός é um coletivo singular; καθήμενος, literalmente “sentado”, tem aqui o sentido idiomático de residir, e ὀρεινή designa a região elevada ou montanhosa.
- source_word: τίνες αἱ κατοικοῦσιν πόλεις
  choice: em que cidades eles moram
  rationale: A formulação portuguesa explicita de modo natural a relação entre κατοικέω e as cidades interrogadas, sem alterar o conteúdo.
- source_word: τὸ πλῆθος τῆς δυνάμεως αὐτῶν
  choice: qual é o tamanho de sua força militar
  rationale: No contexto de reconhecimento militar, δύναμις indica a força armada, e πλῆθος, sua quantidade ou dimensão.
- source_word: ἐν τίνι τὸ κράτος αὐτῶν καὶ ἡ ἰσχὺς αὐτῶν
  choice: em que consistem seu poder e sua força
  rationale: A construção preserva a pergunta acerca da base ou fonte do poder, bem como a duplicação retórica dos dois termos gregos sobrepostos.
- source_word: τίς ἀνέστηκεν ἐπʼ αὐτῶν βασιλεὺς
  choice: quem se levantou sobre eles como rei
  rationale: Preserva a imagem do perfeito de ἀνίστημι e evita substituir a expressão por uma interpretação política mais específica, como “foi nomeado” ou simplesmente “governa”.
- source_word: ἡγούμενος στρατιᾶς αὐτῶν
  choice: comandando o exército deles
  rationale: No contexto militar, o particípio expressa liderança ou comando, e στρατιά significa exército ou hoste.
