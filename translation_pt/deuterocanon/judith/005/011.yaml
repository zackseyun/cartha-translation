base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/011.yaml
  text: And the king of Egypt rose up against them[a], and they dealt shrewdly with them in toil and brickmaking; they humbled them and made them slaves.
translation:
  language: pt
  text: E o rei do Egito se levantou contra eles, e os trataram astutamente, impondo-lhes trabalho árduo e a fabricação de tijolos; humilharam-nos e os fizeram escravos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «agiram astutamente contra eles» ou «os trataram com astúcia». O verbo grego enfatiza um tratamento ardiloso ou calculado.'
    reason: Alternativa lexical para κατεσοφίσαντο.
lexical_decisions:
- source_word: ἐπανέστη
  choice: se levantou contra
  rationale: Preserva o sentido de oposição hostil do verbo composto, em português natural e digno.
- source_word: κατεσοφίσαντο
  choice: agiu astutamente contra eles
  rationale: O verbo indica uma ação calculada ou ardilosa dirigida contra alguém; “astutamente” mantém esse componente sem explicitar demais o modo da opressão.
- source_word: ἐν πόνῳ καὶ πλίνθῳ
  choice: impondo-lhes trabalho árduo e a fabricação de tijolos
  rationale: πόνος designa labor penoso, e πλίνθος, literalmente “tijolo”, evoca aqui o trabalho com tijolos. A formulação explicita naturalmente em português a imposição desses trabalhos, sem perder a referência concreta.
- source_word: ἐταπείνωσαν
  choice: humilhou-os
  rationale: Conserva o sentido de rebaixar ou humilhar, enquanto a oração seguinte concretiza a sujeição.
- source_word: δούλους
  choice: escravos
  rationale: O contexto descreve sujeição forçada no Egito; “escravos” comunica com precisão a condição de cativeiro, melhor que “servos”.
theological_decisions:
- issue: Tradução do termo da família de δοῦλος no contexto da opressão de Israel no Egito
  choice: escravos
  alternative: servos
  rationale: A escravização nacional e o trabalho forçado são centrais no contexto, de modo que “escravos” preserva a gravidade e a natureza involuntária da condição.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. A coordenação grega alterna sujeito singular (“o rei”) e formas plurais possivelmente referentes aos egípcios ou seus agentes; para produzir uma frase natural, o texto mantém o rei como sujeito representativo das medidas impostas, sem introduzir agentes não nomeados. Registro narrativo digno e acessível.
