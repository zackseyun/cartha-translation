- source_word: υἱῶν Ἰσραήλ
  choice: filhos de Israel
  rationale: Mantém a designação tradicional e o sentido coletivo do grego.
- source_word: ἰδού
  choice: vejam
  rationale: Reproduz o chamado de atenção de modo atual e natural, dirigindo-se ao grupo presente no contexto.
- source_word: δύναμις οὐδὲ κράτος
  choice: força nem poder
  rationale: Conserva os dois substantivos coordenados e sua intensificação retórica, sem fundi-los em uma única ideia.
- source_word: παράταξιν ἰσχυράν
  choice: formar uma poderosa linha de batalha
  rationale: Παράταξις denota disposição ou linha militar para combate; a formulação evita o português rígido de 'formação de batalha forte'.
