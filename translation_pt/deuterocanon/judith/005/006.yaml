lexical_decisions:
- source_word: ὁ λαὸς οὗτός
  choice: Este povo
  rationale: λαός designa aqui um grupo coletivo, e οὗτός o identifica de modo demonstrativo. “Este povo” é natural, digno e preserva o valor coletivo do grego.
- source_word: εἰσιν ἀπόγονοι
  choice: descende
  rationale: A expressão grega afirma que os integrantes desse povo são descendentes. Em português, o singular coletivo “este povo descende” comunica isso com naturalidade e concisão, embora não reproduza formalmente o plural εἰσιν.
- source_word: Χαλδαίων
  choice: dos caldeus
  rationale: O genitivo plural indica o grupo ancestral. “Dos caldeus” é a forma portuguesa corrente para essa designação étnica.
