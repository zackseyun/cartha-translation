base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/022.yaml
  text: And it happened[a], when Achior had stopped speaking these words, that all the people around the tent and standing about began to grumble, and the nobles of Holofernes and all who lived by the seacoast and in Moab said to strike him down.
translation:
  language: pt
  text: E aconteceu que, quando Aquior terminou de dizer essas palavras, todo o povo que cercava a tenda e permanecia ao redor começou a murmurar; então os nobres de Holofernes e todos os habitantes do litoral e de Moabe disseram que o abatessem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que o golpeassem” ou “que o matassem”. O infinitivo grego συγκόψαι é violento, mas não especifica com total precisão como isso seria feito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: E aconteceu que, quando
  rationale: Conserva a transição narrativa característica do grego e introduz com naturalidade a oração temporal em português.
- source_word: ἐπαύσατο ... λαλῶν τοὺς λόγους τούτους
  choice: terminou de dizer essas palavras
  rationale: Expressa claramente a cessação da fala e preserva o demonstrativo τούτους, em linguagem portuguesa corrente.
- source_word: ἐγόγγυσεν
  choice: começou a murmurar
  rationale: Comunica a reação coletiva, baixa e hostil sugerida por γογγύζω; o singular concorda com o sujeito coletivo “todo o povo”.
- source_word: ὁ κυκλῶν τὴν σκηνὴν καὶ περιστὼς
  choice: que cercava a tenda e permanecia ao redor
  rationale: Mantém as duas descrições participiais da posição do povo sem fundi-las completamente.
- source_word: οἱ μεγιστᾶνες Ὀλοφέρνου
  choice: os nobres de Holofernes
  rationale: “Nobres” transmite a ideia de homens de alta posição ou dirigentes e mantém o registro elevado sem obscuridade.
- source_word: οἱ κατοικοῦντες τὴν παραλίαν καὶ τὴν Μωὰβ
  choice: todos os habitantes do litoral e de Moabe
  rationale: Reproduz a referência geográfica à região costeira e a Moabe de modo conciso e natural.
- source_word: συγκόψαι αὐτόν
  choice: que o abatessem
  rationale: O verbo é violentamente hostil e, neste contexto, indica derrubar ou matar Aquior; “abater” preserva essa força sem determinar com precisão o método.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção narrativa “E aconteceu que” preserva algo da textura formal da Septuaginta; “Moabe” segue a forma portuguesa tradicional do topônimo. O ponto e vírgula esclarece a progressão entre a murmuração da multidão e a proposta dos líderes e habitantes.
