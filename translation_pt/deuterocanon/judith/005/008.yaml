base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/008.yaml
  text: They departed from the way of their fathers and worshiped the God of heaven[a], the God whom they had come to know. And they were driven out from before their gods, and fled to Mesopotamia[b], and lived there as foreigners for many days.
translation:
  language: pt
  text: Eles se afastaram do caminho de seus antepassados e adoraram o Deus do céu, o Deus que vieram a conhecer.[a] E os expulsaram da presença de seus deuses,[b] e eles fugiram para a Mesopotâmia e ali viveram como estrangeiros durante muitos dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Deus que reconheceram”. O grego pode indicar tanto conhecimento quanto reconhecimento decisivo.
    reason: lexical_alternative
  - marker: b
    text: 'A frase grega é condensada: literalmente, “expulsaram-nos da presença de seus deuses”. O agente da expulsão não é identificado expressamente, e a referência de “seus” permanece ambígua.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξέβησαν ἐξ ὁδοῦ τῶν γονέων αὐτῶν
  choice: Eles se afastaram do caminho de seus antepassados
  rationale: Preserva a metáfora de sair do caminho ancestral, enquanto “se afastaram” comunica naturalmente o abandono de uma prática religiosa; “antepassados” corresponde ao sentido contextual de γονεῖς.
- source_word: προσεκύνησαν
  choice: adoraram
  rationale: No contexto religioso, o verbo indica culto reverente, não apenas o gesto físico de se prostrar.
- source_word: τῷ θεῷ τοῦ οὐρανοῦ
  choice: o Deus do céu
  rationale: Reproduz de modo direto e reconhecível o título bíblico.
- source_word: θεῷ ᾧ ἐπέγνωσαν
  choice: o Deus que vieram a conhecer
  rationale: ἐπιγινώσκω pode expressar conhecer ou reconhecer; a formulação escolhida sugere a chegada a esse conhecimento sem eliminar a alternativa lexical, registrada em nota.
- source_word: ἐξέβαλον αὐτοὺς ἀπὸ προσώπου τῶν θεῶν αὐτῶν
  choice: os expulsaram da presença de seus deuses
  rationale: O grego usa uma forma ativa na terceira pessoa do plural sem identificar claramente o agente no trecho imediato. O português mantém esse sujeito indeterminado e conserva a expressão “da presença de seus deuses”, deixando a compressão referencial explícita em nota.
- source_word: ἔφυγον εἰς Μεσοποταμίαν
  choice: eles fugiram para a Mesopotâmia
  rationale: “Fugiram” expressa a partida forçada indicada por ἔφυγον e mantém a sequência narrativa.
- source_word: παρῴκησαν ἐκεῖ ἡμέρας πολλάς
  choice: ali viveram como estrangeiros durante muitos dias
  rationale: Preserva tanto a condição de residentes estrangeiros contida em παροικέω quanto a expressão temporal concreta ἡμέρας πολλάς.
theological_decisions:
- issue: Mudança do culto ancestral para a adoração do Deus do céu
  choice: A tradução apresenta um afastamento real do caminho dos antepassados e a adoração do Deus do céu.
  alternative: “Abandonaram a religião de seus antepassados e se converteram ao Deus verdadeiro.”
  rationale: A opção escolhida conserva as categorias e metáforas do próprio texto, sem acrescentar terminologia confessional posterior nem identificar explicitamente um processo doutrinário de conversão.
- issue: Identidade de quem expulsou o grupo e relação com “seus deuses”
  choice: 'Mantém-se um agente plural não identificado: “os expulsaram”.'
  alternative: “Eles foram expulsos” ou “seus parentes os expulsaram”.
  rationale: A forma grega é ativa, mas o sujeito não é nomeado no trecho imediato. A construção portuguesa com terceira pessoa do plural preserva essa indeterminação sem inventar um agente nem transformar silenciosamente a voz verbal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Antepassados” evita restringir γονεῖς aos pais imediatos; “viveram como estrangeiros” comunica em linguagem corrente a nuance social de παροικέω. A terceira pessoa do plural em “os expulsaram” funciona naturalmente como sujeito indeterminado e preserva a forma ativa e a ambiguidade do grego.
