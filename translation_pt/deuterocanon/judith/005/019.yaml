base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/019.yaml
  text: And now[a], having turned back to their God, they came up from the dispersion where they had been scattered there, took possession of Jerusalem, where their sanctuary was, and settled in the hill country[b], because it had been deserted.
translation:
  language: pt
  text: E agora, tendo voltado para o seu Deus, subiram da dispersão, onde haviam sido espalhados[a]; tomaram posse de Jerusalém, onde ficava o seu santuário, e se estabeleceram na região montanhosa, porque estava deserta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente algo como “onde ali haviam sido espalhados”, com uma expressão de lugar enfática ou redundante.
    reason: lexical_alternative
  - marker: b
    text: Ou “porque estava desolada” ou “porque estava desabitada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρέψαντες ἐπὶ τὸν θεὸν αὐτῶν
  choice: tendo voltado para o seu Deus
  rationale: Preserva a metáfora de retorno e o sentido de renovação da fidelidade ao próprio Deus, sem impor a noção técnica posterior de conversão.
- source_word: ἀνέβησαν
  choice: subiram
  rationale: Mantém o movimento ascendente expresso pelo verbo grego, adequado à geografia bíblica.
- source_word: ἐκ τῆς διασπορᾶς
  choice: da dispersão
  rationale: Conserva o substantivo coletivo grego e evita reduzi-lo interpretativamente a 'exílio'.
- source_word: οὗ διεσπάρησαν ἐκεῖ
  choice: onde haviam sido espalhados
  rationale: Expressa com clareza o local da dispersão; a redundância locativa de οὗ...ἐκεῖ é registrada em nota.
- source_word: κατέσχον
  choice: tomaram posse de
  rationale: Comunica aquisição e manutenção de domínio, sem a carga militar mais forte de 'ocuparam'.
- source_word: τὸ ἁγίασμα
  choice: santuário
  rationale: É a designação portuguesa natural para o lugar consagrado, sem especificar além do grego que se trate de todo o templo.
- source_word: κατῳκίσθησαν
  choice: se estabeleceram
  rationale: Reproduz de modo idiomático o estabelecimento de residência indicado pela forma grega.
- source_word: ἐν τῇ ὀρεινῇ
  choice: na região montanhosa
  rationale: Traduz a expressão geográfica substantivada com clareza para leitores contemporâneos.
- source_word: ὅτι ἦν ἔρημος
  choice: porque estava deserta
  rationale: Mantém o valor contextual de uma região vazia ou abandonada, sem escolher de modo exclusivo entre 'desolada' e 'desabitada'.
theological_decisions:
- issue: Força pactual do retorno de Israel a Deus em ἐπιστρέψαντες ἐπὶ τὸν θεὸν αὐτῶν
  choice: tendo voltado para o seu Deus
  alternative: tendo retornado ao seu Deus
  rationale: A formulação indica renovação de orientação e fidelidade ao Deus que já era o seu, não adoção de uma nova divindade; também evita importar terminologia doutrinária posterior.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi suavizada apenas onde a redundância locativa grega soaria pouco natural; essa característica foi preservada em nota.
