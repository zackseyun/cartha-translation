base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/005.yaml
  text: And Achior[a], the leader of all the sons of Ammon, said to him, “Let my lord now hear a word from the mouth of your servant, and I will tell you the truth about the people who dwell in this hill country near you[b], and no falsehood will come from the mouth of your servant.”
translation:
  language: pt
  text: 'E Aquior[a], o líder de todos os filhos de Amom, disse-lhe: “Que meu senhor ouça agora uma palavra da boca de seu servo. Eu lhe anunciarei a verdade a respeito do povo que habita esta região montanhosa, perto de onde o senhor mora[b], e nenhuma mentira sairá da boca de seu servo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o líder de todos os amonitas”. O grego diz literalmente “de todos os filhos de Amom”.
    reason: lexical_alternative
  - marker: b
    text: Ou simplesmente “perto do senhor”. O grego traz literalmente “perto de ti, que moras [ali]”.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Ἀχιὼρ
  choice: Aquior
  rationale: Transliteração portuguesa tradicional e transparente do nome grego.
- source_word: ὁ ἡγούμενος
  choice: o líder
  rationale: Expressa a função de dirigir ou governar sem impor um cargo formal mais específico do que o grego.
- source_word: πάντων υἱῶν Ἀμμών
  choice: de todos os filhos de Amom
  rationale: Preserva a forma filial do etnônimo grego; a forma idiomática “amonitas” é indicada em nota.
- source_word: Ἀκουσάτω δὴ λόγον
  choice: Que meu senhor ouça agora uma palavra
  rationale: Mantém a terceira pessoa imperativa, o pedido respeitoso e a leve ênfase de δή.
- source_word: ὁ κύριός μου
  choice: meu senhor
  rationale: Título respeitoso dirigido a um superior humano no contexto cortesão.
- source_word: ἐκ στόματος τοῦ δούλου σου
  choice: da boca de seu servo
  rationale: Conserva a imagem da boca e traduz δοῦλος segundo sua função de autodepreciação respeitosa neste discurso.
- source_word: ἀναγγελῶ σοι τὴν ἀλήθειαν
  choice: Eu lhe anunciarei a verdade
  rationale: Reproduz o sentido de comunicar ou relatar formalmente, mantendo o tom solene.
- source_word: ὃς κατοικεῖ τὴν ὀρεινὴν ταύτην
  choice: que habita esta região montanhosa
  rationale: Traduz a designação geográfica de modo natural e específico em português.
- source_word: πλησίον σοῦ οἰκούντος
  choice: perto de onde você está
  rationale: Torna explícito que o particípio οἰκούντος se relaciona com o interlocutor, evitando a leitura simplificada e potencialmente ambígua de “perto de você”.
- source_word: οὐκ ἐξελεύσεται ψεῦδος
  choice: nenhuma mentira sairá
  rationale: Preserva a metáfora de algo falso sair da boca e usa vocabulário corrente e digno.
theological_decisions:
- issue: Sentido de κύριος em referência humana
  choice: meu senhor
  alternative: meu mestre
  rationale: O referente é um superior humano, não Deus; “meu senhor” mantém a deferência sem introduzir um sentido teológico.
- issue: Sentido de δοῦλος na fórmula cortesã
  choice: seu servo
  alternative: seu escravo
  rationale: Embora δοῦλος possa significar “escravo”, aqui integra uma fórmula respeitosa de autodepreciação; “servo” comunica melhor sua função discursiva sem negar a alternativa lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala conserva o tom formal e deferente do contexto militar e cortesão sem recorrer a construções excessivamente arcaicas.
