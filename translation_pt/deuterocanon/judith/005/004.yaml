base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/004.yaml
  text: And why did they refuse to come to meet me[a], unlike all who dwell in the west?
translation:
  language: pt
  text: E por que eles se recusaram a vir ao meu encontro[a], ao contrário de todos os que habitam no oeste?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “fizeram ouvidos moucos, para não virem ao meu encontro”.'
    reason: Alternativa lexical que conserva a imagem etimológica do verbo grego.
lexical_decisions:
- source_word: διὰ τί
  choice: por que
  rationale: Introduz diretamente uma pergunta sobre a razão da conduta descrita.
- source_word: κατενωτίσαντο
  choice: se recusaram
  rationale: Embora o verbo relacionado a 'ouvido' possa sugerir literalmente 'fizeram ouvidos moucos', junto do infinitivo negativo comunica de modo idiomático a recusa em vir.
- source_word: τοῦ μὴ ἐλθεῖν
  choice: a vir
  rationale: O infinitivo articular com μή expressa o conteúdo da recusa. Não se acrescenta 'sair', pois essa ideia não está explícita no grego.
- source_word: εἰς ἀπάντησίν μοι
  choice: ao meu encontro
  rationale: Expressão portuguesa natural para a ideia de ir encontrar-se com a pessoa que fala.
- source_word: παρὰ πάντας
  choice: ao contrário de todos
  rationale: Neste contexto comparativo, παρά com acusativo contrasta a conduta deles com a de todos os demais.
- source_word: τοὺς κατοικοῦντας ἐν δυσμαῖς
  choice: os que habitam no oeste
  rationale: Preserva tanto o particípio 'os que habitam' quanto a referência geográfica às regiões ocidentais, em registro digno e claro.
theological_decisions: []
