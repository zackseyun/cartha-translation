    reason: alternativa lexical
  revision_rationale: A revisão conserva a estrutura e o sentido do original, mas substitui uma expressão portuguesa menos natural por uma que reflete diretamente o sentido passivo de receber alimento. Também torna explícito que a incontabilidade se refere aos membros do grupo de descendência, não à abstração “linhagem”.
