review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente a sequência e os elementos centrais do grego: a descida ao Egito, a fome que cobriu a terra de Canaã, a residência como estrangeiros, o crescimento em grande multidão e a incontabilidade do γένος. Contudo, “até serem sustentados” é menos preciso e menos idiomático que uma formulação centrada em receber alimento, e “sua linhagem era incontável” pode dar a entender que uma abstração (“linhagem”), e não as pessoas pertencentes a ela, é o objeto da contagem.'
  naturalness: O texto é claro e de registro apropriado. “Uma fome cobriu” é aceitável em estilo bíblico, e “a face da terra” preserva bem a imagem. A revisão proposta torna mais natural o segmento sobre a alimentação e explicita, sem extrapolar o sentido, quem é incontável.
  terminology: “Estrangeiros” comunica adequadamente o aspecto de residência em terra alheia em παρῴκησαν. Para γένος, “linhagem” continua sendo uma escolha válida, mas “os de sua linhagem” reproduz de modo mais claro a referência coletiva do genitivo na afirmação de que não havia número. A nota mantém alternativas semanticamente legítimas e evita conotações raciais anacrônicas.
  issues:
  - severity: low
    issue: “Até serem sustentados” é uma formulação pouco idiomática e atenua a referência alimentar de διετράφησαν.
    rationale: O verbo passivo se refere a serem alimentados/nutridos ou providos de alimento. “Até que fossem alimentados” é natural em português e preserva a voz passiva.
  - severity: medium
    issue: “Sua linhagem era incontável” torna impreciso o referente de οὐκ ἦν ἀριθμὸς τοῦ γένους αὐτῶν.
    rationale: A construção grega afirma que não havia número para seu γένος, isto é, para as pessoas do grupo de descendência. “Os de sua linhagem eram incontáveis” exprime essa referência coletiva sem decidir indevidamente entre “linhagem”, “parentela” e “povo”.
  revised_text: E desceram ao Egito, pois uma fome cobriu a face da terra de Canaã. Viveram ali como estrangeiros até que fossem alimentados; ali se tornaram uma multidão muito grande, e os de sua linhagem eram incontáveis.[a]
  revised_footnotes:
