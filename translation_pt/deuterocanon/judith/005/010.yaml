  yaml_path: translation/deuterocanon/judith/005/010.yaml
  text: And they went down into Egypt[a], for a famine covered the face of the land of Canaan, and they lived there as sojourners until they were sustained; and there they became a very great multitude, and there was no number to their family line.
translation:
  language: pt
  text: E desceram ao Egito, pois uma fome cobriu a face da terra de Canaã. Viveram ali como estrangeiros até que fossem alimentados; ali se tornaram uma multidão muito grande, e os de sua linhagem eram incontáveis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu povo” ou “seu grupo de parentesco”; o grego γένος pode indicar linhagem, grupo de parentes ou um povo descendente de um antepassado comum.
    reason: alternativa lexical
lexical_decisions:
- source_word: κατέβησαν
  choice: desceram
  rationale: Preserva o sentido direcional tradicional de ir para o Egito, natural no uso bíblico e coerente com o verbo grego.
- source_word: ἐκάλυψεν
  choice: cobriu
  rationale: Mantém diretamente a imagem da fome cobrindo a terra, sem transformá-la numa explicação abstrata.
- source_word: τὸ πρόσωπον τῆς γῆς
  choice: a face da terra
  rationale: Conserva o semitismo refletido no grego e continua inteligível em português atual.
- source_word: λιμός
  choice: uma fome
  rationale: No contexto narrativo, designa uma fome generalizada; a formulação é corrente e digna em português.
- source_word: παρῴκησαν
  choice: viveram ali como estrangeiros
  rationale: Expressa residência em terra alheia sem sugerir necessariamente estabelecimento permanente.
- source_word: μέχρις οὗ διετράφησαν
  choice: até serem sustentados
  rationale: Preserva a voz passiva e o sentido amplo de receber alimento e manutenção.
- source_word: ἐγένοντο ... εἰς πλῆθος πολύ
  choice: se tornaram uma multidão muito grande
  rationale: Reproduz tanto o resultado expresso pelo verbo quanto a ênfase quantitativa da expressão grega.
- source_word: οὐκ ἦν ἀριθμὸς
  choice: era incontável
  rationale: Transmite em português natural o idioma grego de que não havia número, sem reduzir sua força.
- source_word: τοῦ γένους αὐτῶν
  choice: sua linhagem
  rationale: Representa a identidade baseada em descendência e parentesco, evitando conotações raciais modernas e sem restringir o termo apenas aos descendentes imediatos.
theological_decisions:
- issue: Terminologia étnica e genealógica em τοῦ γένους αὐτῶν
  choice: sua linhagem
  alternative: seu povo / seu grupo de parentesco
  rationale: O texto destaca a multiplicação de um grupo unido por descendência. “Linhagem” conserva essa dimensão genealógica sem importar um conceito biológico moderno de raça; a nota registra a amplitude semântica genuína de γένος.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A imagem “a face da terra” foi preservada por sua força bíblica e inteligibilidade; a sintaxe foi dividida em duas frases para favorecer a leitura sem alterar a progressão do original.
