revisions:
- from: E desceram ao Egito, pois uma fome cobriu a face da terra de Canaã. Viveram ali como estrangeiros até serem sustentados; ali se tornaram uma multidão muito grande, e sua linhagem era incontável.[a]
  to: E desceram ao Egito, pois uma fome cobriu a face da terra de Canaã. Viveram ali como estrangeiros até que fossem alimentados; ali se tornaram uma multidão muito grande, e os de sua linhagem eram incontáveis.[a]
  rationale: A revisão conserva a estrutura e o sentido do original, mas substitui uma expressão portuguesa menos natural por uma que reflete diretamente o sentido passivo de receber alimento. Também torna explícito que a incontabilidade se refere aos membros do grupo de descendência, não à abstração “linhagem”.
