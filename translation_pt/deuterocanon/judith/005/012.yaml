  text: And they cried out to their God[a], and he struck the land of Egypt with plagues for which there was no healing; and the Egyptians drove them out from before them.
translation:
  language: pt
  text: E clamaram ao seu Deus, e ele feriu a terra do Egito com pragas para as quais não havia cura; e os egípcios os expulsaram de diante deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de sua presença”. Literalmente, “de diante deles”; expressão idiomática semítica de expulsão. No contexto, “deles” provavelmente se refere aos egípcios.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεβόησαν
  choice: clamaram
  rationale: O verbo expressa um grito forte dirigido a Deus; “clamaram” comunica tanto a intensidade quanto o caráter de súplica, em linguagem bíblica atual e compreensível.
- source_word: ἐπάταξεν
  choice: feriu
  rationale: Preserva a força da ação divina expressa por πατάσσω sem recorrer a vocabulário arcaico.
- source_word: γῆν Αἴγυπτον
  choice: a terra do Egito
  rationale: γῆ designa aqui o território egípcio; a formulação mantém o sentido geográfico concreto.
- source_word: πληγαῖς
  choice: com pragas
  rationale: No contexto da alusão ao êxodo, πληγαί se refere naturalmente às pragas enviadas contra o Egito.
- source_word: ἐν αἷς οὐκ ἦν ἴασις
  choice: para as quais não havia cura
  rationale: Mantém a imagem de ἴασις, “cura”, e liga com clareza a oração relativa às pragas.
- source_word: ἐξέβαλον
  choice: expulsaram
  rationale: Expressa diretamente a ação de lançar para fora ou obrigar a sair, adequada ao contexto do êxodo.
- source_word: ἀπὸ προσώπου αὐτῶν
  choice: de sua presença
  rationale: Reproduz em português natural o idiomatismo semítico preservado no grego, literalmente “de diante deles”.
theological_decisions:
- issue: Referente de αὐτῶν em ἀπὸ προσώπου αὐτῶν
  choice: 'O pronome foi entendido como referente aos egípcios: eles expulsaram os israelitas de sua própria presença.'
  alternative: Em isolamento, a forma pronominal poderia ser relacionada aos israelitas, embora essa leitura seja menos provável no contexto.
  rationale: O sujeito expresso, “os egípcios”, é o antecedente contextual mais natural, e a construção idiomática descreve a expulsão de alguém da presença de quem o expulsa. A nota preserva a forma literal sem impor interpretação adicional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Clamaram” e “feriu” conservam o tom narrativo bíblico sem arcaísmo excessivo; “de sua presença” torna natural o idiomatismo grego-semítico, cuja forma literal é registrada em nota.
