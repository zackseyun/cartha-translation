  naturalness: “Clamaram”, “feriu”, “a terra do Egito”, “pragas” e “não havia cura” são claros, atuais e apropriados ao registro narrativo. “De diante deles” é menos usual em prosa corrente, mas é aceitável em registro bíblico e preserva a formulação idiomática do original; a nota fornece a alternativa portuguesa mais fluente.
  terminology: A terminologia está bem escolhida. “Pragas” corresponde ao contexto do êxodo, e “cura” traduz corretamente ἴασις. A nota deve apresentar “de sua presença” como alternativa interpretativa, não como significado único do texto.
