  text: And God dried up the Red Sea before them,[a]
translation:
  language: pt
  text: E Deus secou o mar Vermelho diante deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, conforme a tradição hebraica subjacente do êxodo em algumas traduções, “o mar de Juncos”. O texto grego aqui diz “o mar Vermelho”.
    reason: alternative_reading
lexical_decisions:
- source_word: κατεξήρανεν
  choice: secou
  rationale: O verbo composto indica que Deus fez o mar ficar completamente seco. “Secou” é natural em português e comunica com clareza que o caminho foi tornado transitável.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Tradução direta do sujeito nominativo; neste uso, o português dispensa o artigo antes de “Deus”.
- source_word: τὴν ἐρυθρὰν θάλασσαν
  choice: o mar Vermelho
  rationale: A expressão grega designa literalmente o mar Vermelho na tradição da Septuaginta. A alternativa baseada no hebraico é preservada em nota, sem substituir a leitura do testemunho grego.
- source_word: ἔμπροσθεν αὐτῶν
  choice: diante deles
  rationale: Forma natural e dignificada de expressar a posição do mar em relação ao povo durante a ação divina.
theological_decisions:
- issue: Tradução de ἐρυθρὰν θάλασσαν na alusão à travessia do êxodo
  choice: o mar Vermelho
  alternative: o mar de Juncos
  rationale: O texto-fonte grego diz explicitamente “mar Vermelho”. A alternativa “mar de Juncos”, associada à expressão hebraica ים סוף, é relevante para a transparência textual, mas não deve substituir no texto principal o testemunho grego traduzido.
translation_notes:
  register: Português moderno, claro e dignificado, com sintaxe próxima do grego sem soar artificial. A inicial “E” conserva a ligação narrativa marcada por καί.
