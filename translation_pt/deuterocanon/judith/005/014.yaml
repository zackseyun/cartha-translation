  yaml_path: translation/deuterocanon/judith/005/014.yaml
  text: And he led them onto the way of Sinai and Kadesh-barnea[a]; and they drove out all who were living in the wilderness[b],
translation:
  language: pt
  text: E ele os conduziu pelo caminho do Sinai e de Cades-Barneia[a]; e eles expulsaram todos os que viviam no deserto[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pela rota do Sinai e de Cades-Barneia”. A expressão grega “o caminho do Sinai e de Cades-Barneia” pode indicar a rota associada a esses lugares ou que levava até eles.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todos os habitantes do deserto”. O grego emprega uma expressão participial, literalmente “todos os que viviam no deserto”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν
  choice: conduziu
  rationale: O aoristo de ἄγω significa levar ou conduzir. “Conduziu” expressa com naturalidade a direção ativa do povo no contexto da viagem.
- source_word: εἰς ὁδὸν
  choice: pelo caminho
  rationale: A expressão indica que alguém foi posto numa rota. “Pelo caminho” é idiomático em português e preserva a imagem concreta do percurso sem definir de modo excessivo se ele conduzia a esses lugares ou estava associado a eles.
- source_word: τοῦ Σεινὰ
  choice: do Sinai
  rationale: O genitivo depende de ὁδόν, formando “caminho do Sinai”, isto é, a rota ligada ao Sinai ou que levava até lá.
- source_word: Καδής Βαρνή
  choice: Cades-Barneia
  rationale: Adota-se a forma portuguesa tradicional e amplamente reconhecível do topônimo composto.
- source_word: ἐξέβαλον
  choice: expulsaram
  rationale: ἐκβάλλω denota lançar para fora ou expulsar; no contexto territorial, “expulsaram” comunica claramente a remoção forçada dos moradores.
- source_word: πάντας
  choice: todos
  rationale: Preserva a abrangência total do termo grego.
- source_word: τοὺς κατοικοῦντας
  choice: os que viviam
  rationale: Mantém o valor verbal do particípio e soa natural no português atual; “os habitantes” também seria possível.
- source_word: ἐν τῇ ἐρήμῳ
  choice: no deserto
  rationale: ἔρημος pode designar deserto ou região erma. “Deserto” é claro, corrente e adequado à geografia da narrativa.
