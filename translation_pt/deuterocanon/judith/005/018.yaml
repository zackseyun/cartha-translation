base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/018.yaml
  text: But when they turned away from the path that he had appointed for them[a], they were utterly destroyed in many wars, to a very great extent[b], and they were taken captive into a land not their own, and the temple of their God was laid level with the ground, and their cities were seized by their adversaries.
translation:
  language: pt
  text: Mas, quando se desviaram do caminho que ele havia estabelecido para eles[a], foram completamente destruídos em muitas guerras, em grau extremo[b]; foram levados como prisioneiros para uma terra que não era deles; o templo de seu Deus foi arrasado até o chão, e suas cidades foram tomadas por seus adversários.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da conduta que ele havia prescrito para eles”. A palavra grega pode indicar uma estrada literal ou, como aqui, um modo de viver.'
    reason: lexical_alternative
  - marker: b
    text: A expressão grega é intensiva e pode enfatizar a grande extensão ou a extrema severidade da destruição.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστησαν ἀπὸ τῆς ὁδοῦ
  choice: se desviaram do caminho
  rationale: Expressa de modo natural o afastamento de uma conduta prescrita, preservando o sentido moral e religioso sem especificar formalmente apostasia ou rebelião.
- source_word: διέθετο
  choice: havia estabelecido
  rationale: Comunica que Deus determinara ou prescrevera esse caminho para eles, sem introduzir a linguagem mais marcada de ordenação.
- source_word: ἐξωλεθρεύθησαν
  choice: foram completamente destruídos
  rationale: Mantém a força intensiva do verbo composto sem recorrer a 'exterminados', termo que pode trazer conotações modernas excessivamente específicas.
- source_word: ἐν πολλοῖς πολέμοις
  choice: em muitas guerras
  rationale: Correspondência direta a πολέμοις, cujo alcance é mais amplo que 'batalhas'.
- source_word: ἐπὶ πολὺ σφόδρα
  choice: em grau extremo
  rationale: Preserva a expressão intensiva grega e sua provável ênfase na grande extensão ou severidade da destruição, evitando interpretá-la inequivocamente como duração.
- source_word: ᾐχμαλωτεύθησαν
  choice: foram levados como prisioneiros
  rationale: Torna explícita a captura coerciva e sugere o deslocamento para outra terra indicado pela construção seguinte.
- source_word: εἰς γῆν οὐκ ἰδίαν
  choice: para uma terra que não era deles
  rationale: Conserva o contraste possessivo explícito do grego, em vez de reduzi-lo simplesmente a 'terra estrangeira'.
- source_word: ναὸς
  choice: templo
  rationale: É a designação natural e específica no contexto judaico.
- source_word: ἐγενήθη εἰς ἔδαφος
  choice: foi arrasado até o chão
  rationale: Reproduz de forma idiomática a imagem de demolição até o nível do solo.
- source_word: ἐκρατήθησαν
  choice: foram tomadas
  rationale: Indica que as cidades caíram sob controle hostil, abrangendo captura e ocupação sem acrescentar detalhes não expressos.
- source_word: ὑπεναντίων
  choice: adversários
  rationale: Preserva o sentido daqueles que se opunham a eles e combina com o registro narrativo solene.
theological_decisions:
- issue: Agência no juízo divino
  choice: Relacionar as calamidades ao afastamento do caminho estabelecido por Deus, mantendo os verbos das calamidades na voz passiva e sem nomear Deus como agente direto.
  alternative: Tornar Deus explicitamente o agente da destruição, do cativeiro e da queda do templo e das cidades.
  rationale: O grego estabelece uma relação entre o desvio e as calamidades subsequentes, mas não identifica gramaticalmente o agente de cada passiva. A tradução preserva essa tensão e evita explicitação doutrinária.
translation_notes:
  register: Português contemporâneo, digno e amplamente inteligível, com boa legibilidade brasileira. A pontuação com ponto e vírgula organiza a longa sequência grega sem romper sua unidade. Os pronomes referentes a Deus permanecem em minúscula, conforme o uso moderno não confessional.
