  yaml_path: translation/deuterocanon/judith/005/002.yaml
  text: And he became very angry[a], and he summoned all the rulers of Moab, the generals of Ammon, and all the satraps of the coastland[b],
translation:
  language: pt
  text: E ele ficou muito irado[a] e convocou todos os governantes de Moabe, os generais de Amom e todos os sátrapas da região costeira[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “encheu-se de grande fúria”; a expressão grega foi vertida de modo idiomático no texto principal como “ficou muito irado”.
    reason: lexical_alternative
  - marker: b
    text: Ou “do litoral” ou “da zona costeira”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠργίσθη
  choice: ficou irado
  rationale: O aoristo de ὀργίζω expressa aqui a entrada em um estado de ira. “Ficou irado” é natural em português e preserva esse aspecto ingressivo.
- source_word: θυμῷ σφόδρα
  choice: muito
  rationale: A expressão intensifica a ira; incorporá-la de modo idiomático em “muito irado” comunica claramente a força enfática do grego.
- source_word: ἐκάλεσεν
  choice: convocou
  rationale: No contexto de uma autoridade que chama oficiais à sua presença, “convocou” transmite melhor o caráter oficial e autoritativo da ação.
- source_word: ἄρχοντας
  choice: governantes
  rationale: O termo designa autoridades civis ou políticas. “Governantes” é amplo, atual e adequado ao contexto.
- source_word: στρατηγοὺς
  choice: generais
  rationale: O sentido militar é evidente; “generais” oferece um equivalente moderno e direto para comandantes de alta patente.
- source_word: σατράπας
  choice: sátrapas
  rationale: A manutenção do termo histórico preserva a coloração político-administrativa do mundo antigo, sem reduzi-lo genericamente a “governadores”.
- source_word: τῆς παραλίας
  choice: da região costeira
  rationale: παραλία designa o litoral ou distrito costeiro. “Região costeira” é claro em português internacional e evita sugerir apenas a linha imediata da costa.
- source_word: Μωὰβ
  choice: Moabe
  rationale: Forma tradicional e amplamente reconhecida do nome em português bíblico.
- source_word: Ἀμμὼν
  choice: Amom
  rationale: Forma tradicional e amplamente reconhecida do nome em português bíblico.
