base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/015.yaml
  text: And they lived in the land of the Amorites[a], and by their strength they destroyed all the Heshbonites; and after crossing the Jordan[b], they took possession of all the hill country.
translation:
  language: pt
  text: E habitaram na terra dos amorreus e, com a sua força[a], destruíram todos os habitantes de Hesbom. Depois de atravessarem o Jordão, tomaram posse[b] de toda a região montanhosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em sua força” ou “por meio do seu poder”.
    reason: lexical_alternative
  - marker: b
    text: Ou “herdaram”. O verbo grego pode indicar receber como posse ou herança; aqui, refere-se à tomada de posse do território depois da travessia do Jordão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾤκησαν
  choice: habitaram
  rationale: O aoristo de οἰκέω indica que passaram a residir na terra; “habitaram” é claro, digno e preserva a sequência narrativa.
- source_word: γῇ Ἀμορραίων
  choice: terra dos amorreus
  rationale: Reproduz diretamente a construção territorial do grego e emprega a forma portuguesa consagrada para o povo.
- source_word: ἐξωλόθρευσαν
  choice: destruíram
  rationale: O verbo expressa destruição completa, reforçada por πάντας; “destruíram” mantém a força sem recorrer a terminologia moderna excessivamente técnica.
- source_word: πάντας τοὺς Ἐσεβωνείτας
  choice: todos os hesbonitas
  rationale: O gentílico grego designa o povo de Hesbom; “hesbonitas” preserva essa forma concisa em português.
- source_word: ἐν τῇ ἰσχύι αὐτῶν
  choice: com a sua força
  rationale: A preposição ἐν pode assinalar meio ou esfera; a expressão portuguesa é natural e mantém a ênfase na capacidade deles.
- source_word: διαβάντες τὸν Ἰορδάνην
  choice: Depois de atravessarem o Jordão
  rationale: O particípio aoristo indica ação anterior ao verbo principal; a formulação explicita com naturalidade a ordem dos acontecimentos.
- source_word: ἐκληρονόμησαν
  choice: tomaram posse
  rationale: κληρονομέω pode significar herdar ou receber como possessão; no contexto territorial, “tomaram posse” comunica o resultado sem eliminar a alternativa lexical.
- source_word: πᾶσαν τὴν ὀρεινήν
  choice: toda a região montanhosa
  rationale: O substantivo substantivado ὀρεινή designa uma região de montanhas ou colinas; esta tradução é clara e geograficamente abrangente.
