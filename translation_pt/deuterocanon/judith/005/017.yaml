  yaml_path: translation/deuterocanon/judith/005/017.yaml
  text: And as long as they did not sin before their God[a], good things were with them[b], because a God who hates injustice is with them.
translation:
  language: pt
  text: E enquanto não pecaram diante do seu Deus, as coisas boas estavam com eles[a], porque Deus, que odeia a injustiça, está com eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tinham prosperidade”. A expressão grega literalmente diz: “as coisas boas estavam com eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἕως
  choice: E enquanto
  rationale: No contexto, introduz uma condição duradoura; “enquanto” exprime isso naturalmente sem transformar a frase em um simples limite temporal.
- source_word: οὐχ ἥμαρτον
  choice: não pecaram
  rationale: Conserva de modo direto o aoristo negado e a ideia verbal de pecar.
- source_word: ἐνώπιον τοῦ θεοῦ αὐτῶν
  choice: diante do seu Deus
  rationale: “Diante de” preserva o sentido espacial e avaliativo de ἐνώπιον sem explicitar indevidamente “contra”.
- source_word: ἦν μετʼ αὐτῶν τὰ ἀγαθά
  choice: os bens estavam com eles
  rationale: Reproduz de perto a expressão grega e mantém τὰ ἀγαθά amplo, sem restringi-lo a prosperidade material ou a bênçãos espirituais.
- source_word: ὅτι
  choice: porque
  rationale: Introduz com clareza a razão da situação favorável descrita.
- source_word: θεὸς μισῶν ἀδικίαν
  choice: um Deus que odeia a injustiça
  rationale: A construção expressa qualitativamente que tipo de Deus ele é; “injustiça” mantém a dimensão moral e jurídica de ἀδικία.
- source_word: μετʼ αὐτῶν ἐστίν
  choice: está com eles
  rationale: Mantém o presente do grego, em contraste com o imperfeito anterior, preservando a afirmação caracterizadora sobre Deus.
theological_decisions:
- issue: Mudança de tempo verbal entre ἦν e ἐστίν
  choice: Manter “estavam” e depois “está”.
  alternative: 'Uniformizar no passado: “estava com eles”.'
  rationale: A mudança do passado narrativo para o presente pode realçar uma realidade permanente acerca do caráter e da presença de Deus; não deve ser apagada.
- issue: Amplitude semântica de τὰ ἀγαθά
  choice: “os bens”
  alternative: “a prosperidade” ou “as coisas boas”
  rationale: “Os bens” conserva a formulação substantivada e abrangente do grego, evitando limitar a referência exclusivamente à riqueza ou ao sucesso material.
- issue: Sentido de ἀδικία
  choice: “injustiça”
  alternative: “iniquidade”, “injustiça moral” ou “maldade”
  rationale: “Injustiça” é corrente, digna e retém a dimensão de conduta contrária ao que é justo, sem impor terminologia doutrinária posterior.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem e a mudança de tempos verbais do grego foram preservadas; a expressão incomum “os bens estavam com eles” foi mantida por sua amplitude e esclarecida em nota.
