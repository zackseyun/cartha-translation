revisions:
- from: E enquanto não pecaram diante do seu Deus, os bens estavam com eles[a], porque um Deus que odeia a injustiça está com eles.
  to: E enquanto não pecaram diante do seu Deus, as coisas boas estavam com eles[a], porque Deus, que odeia a injustiça, está com eles.
