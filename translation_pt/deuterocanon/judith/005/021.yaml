base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/021.yaml
  text: But if there is no lawlessness in their nation[a], let my lord pass by, lest perhaps their Lord and their God defend them, and we become a reproach before all the earth.
translation:
  language: pt
  text: Mas, se não há transgressão na nação deles, que meu senhor[a] passe adiante, para que o Senhor deles e o Deus deles não venham, porventura, a defendê-los, e nós nos tornemos objeto de desprezo diante de toda a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego, literalmente: “que o senhor passe adiante”. Pelo contexto, trata-se provavelmente de um tratamento respeitoso dirigido a Holofernes (“meu senhor”), e não de uma referência a Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνομία
  choice: transgressão
  rationale: Expressa a violação da lei e a culpa moral sem reduzir o termo a um único ato; é mais natural em português corrente e digno do que «ilegalidade» neste contexto.
- source_word: ἔθνος
  choice: nação
  rationale: Designa Israel como coletividade étnica e nacional, preservando o sentido político-coletivo do grego.
- source_word: παρελθέτω δὴ
  choice: que meu senhor passe adiante
  rationale: O imperativo pede que o comandante não prossiga contra Israel, mas passe adiante. «Meu senhor» torna natural em português o tratamento respeitoso dirigido a Holofernes, enquanto a nota preserva a forma literalmente ambígua do grego.
- source_word: μή ποτε
  choice: para que, porventura, ... não
  rationale: Preserva tanto a advertência negativa quanto a nuance de possibilidade cautelosa presente na combinação grega.
- source_word: ὑπερασπίσῃ
  choice: defenda
  rationale: Comunica de modo claro a ideia de proteger ou tomar o partido de alguém, adequada ao contexto militar.
- source_word: ὀνειδισμός
  choice: alvo de vergonha
  rationale: Indica desonra pública e o fato de se tornar objeto de desprezo, em formulação natural no português moderno.
- source_word: πάσης τῆς γῆς
  choice: toda a terra
  rationale: Mantém a amplitude retórica e a formulação concreta do grego, sem restringir γῆ a uma região específica.
- source_word: κύριος
  choice: meu senhor / Senhor deles
  rationale: A primeira ocorrência é entendida contextualmente como tratamento humano a Holofernes; a segunda, associada a «Deus deles», refere-se inequivocamente à divindade de Israel.
theological_decisions:
- issue: Referentes distintos das duas ocorrências de κύριος
  choice: Traduzir a primeira como «meu senhor» e a segunda como «o Senhor deles».
  alternative: Traduzir ambas simplesmente como «senhor», deixando a primeira formalmente ambígua.
  rationale: O discurso imediato é dirigido a Holofernes e lhe oferece conselho, favorecendo fortemente um tratamento respeitoso na primeira ocorrência. A segunda está coordenada com «o Deus deles» e, portanto, tem referente divino. A nota registra a literalidade do primeiro uso sem obscurecer o sentido narrativo mais provável.
- issue: Relação entre «Senhor» e «Deus» na segunda oração
  choice: «o Senhor deles e o Deus deles», entendidos como dois títulos do mesmo referente.
  alternative: Fundir os títulos como «o Senhor Deus deles».
  rationale: A repetição dos artigos e possessivos no grego é preservada, sem sugerir duas divindades nem apagar a estrutura enfática da frase.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é digno e narrativo; «porventura» conserva a cautela do grego sem tornar a frase excessivamente técnica. A repetição «o Senhor deles e o Deus deles» foi mantida por fidelidade à ênfase do original.
