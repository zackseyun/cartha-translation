base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/009.yaml
  text: And their God told them to go out from their sojourning and to go into the land of Canaan[a]; and they settled there[b], and became very wealthy in gold and silver and in very many livestock.
translation:
  language: pt
  text: E o Deus deles lhes disse que saíssem de sua residência como estrangeiros[a] e fossem para a terra de Canaã. Eles se estabeleceram ali e aumentaram muito suas posses em ouro, prata e em animais de criação numerosíssimos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do lugar de sua residência como estrangeiros”. O termo grego indica viver em determinado lugar na condição de estrangeiro ou residente de fora.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “multiplicaram-se muito em ouro, prata e em muitíssimos animais de criação”. A expressão destaca o grande aumento de suas posses; o termo grego abrange animais domésticos em geral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν ... ἐξελθεῖν ... πορευθῆναι
  choice: lhes disse que saíssem ... e fossem
  rationale: A construção com εἶπεν e infinitivos comunica uma instrução. Esta formulação é natural em português e preserva o caráter diretivo sem intensificá-lo para uma ordem explícita.
- source_word: παροικίας
  choice: terra onde viviam como estrangeiros
  rationale: παροικία designa residência ou permanência na condição de estrangeiro. A expressão explicita essa nuance em linguagem corrente, sem pressupor necessariamente uma estadia breve.
- source_word: γῆν Χανάαν
  choice: terra de Canaã
  rationale: Reproduz γῆν e corresponde ao uso geográfico bíblico natural em português.
- source_word: κατῴκησαν
  choice: se estabeleceram
  rationale: Expressa que passaram a residir ali, com a nuance de fixação no lugar.
- source_word: ἐπληθύνθησαν
  choice: aumentaram muito suas posses
  rationale: O verbo indica grande aumento; como os dativos seguintes enumeram ouro, prata e animais, o contexto aponta para aumento patrimonial. A nota preserva uma formulação mais próxima da estrutura grega.
- source_word: χρυσίῳ καὶ ἀργυρίῳ
  choice: em ouro, prata
  rationale: Indica os bens quanto aos quais ocorreu o aumento.
- source_word: κτήνεσιν πολλοῖς σφόδρα
  choice: rebanhos numerosíssimos
  rationale: κτήνη abrange animais domésticos ou gado em sentido amplo, enquanto πολλοῖς σφόδρα intensifica fortemente sua quantidade. 'Rebanhos' é coletivo natural e evita restringir a referência a bovinos.
theological_decisions:
- issue: Natureza da fala divina em εἶπεν seguido de infinitivos
  choice: Deus lhes disse que saíssem e fossem para Canaã
  alternative: Deus lhes ordenou que saíssem e fossem para Canaã
  rationale: O grego apresenta uma fala diretiva, mas não emprega um verbo que exija traduzir por 'ordenou'. A opção adotada preserva a força instrutiva sem ampliá-la.
- issue: Sentido de ἐπληθύνθησαν aplicado a bens
  choice: aumentaram muito suas posses
  alternative: tornaram-se muito ricos
  rationale: A alternativa é idiomática, porém interpreta o aumento como riqueza de modo mais abstrato. A redação escolhida mantém em foco o aumento concreto de ouro, prata e animais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi naturalizada sem apagar a condição de estrangeiros expressa por παροικία nem o caráter concreto do aumento patrimonial.
