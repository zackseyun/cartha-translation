base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/024.yaml
  text: Therefore we will indeed go up[a], and they will become food for all your army, master Holofernes.
translation:
  language: pt
  text: Por isso, certamente subiremos, e eles se tornarão alimento[a] para todo o teu exército, senhor Holofernes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “presa” ou “algo a ser devorado”; literalmente, o grego diz que eles se tornarão “para devoração” por todo o teu exército.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ δὴ
  choice: Por isso, certamente
  rationale: διό introduz a conclusão (“por isso”), enquanto δή reforça a convicção do que se afirma (“certamente”). A combinação preserva tanto a inferência quanto a ênfase.
- source_word: ἀναβησόμεθα
  choice: subiremos
  rationale: O futuro médio de ἀναβαίνω indica subir ou avançar para um lugar mais alto; “subiremos” conserva de modo natural o sentido espacial e militar.
- source_word: ἔσονται
  choice: se tornarão
  rationale: 'Com εἰς e acusativo, ἔσονται tem aqui valor resultativo: eles acabarão na condição de alimento, e não apenas “serão” alimento.'
- source_word: εἰς κατάβρωμα
  choice: alimento[a]
  rationale: κατάβρωμα designa aquilo que é comido ou devorado. “Alimento” mantém a imagem concreta e, com a nota, preserva a possibilidade contextual de “presa”.
- source_word: πάσης τῆς στρατειᾶς σου
  choice: para todo o teu exército
  rationale: πάσης abrange o exército inteiro, e στρατειά denota a força militar ou hoste. A formulação é clara e próxima da estrutura grega.
- source_word: δέσποτα
  choice: meu senhor
  rationale: No vocativo, δέσποτα é um tratamento dirigido a alguém investido de autoridade. Em português, “meu senhor” é natural nesse contexto hierárquico, sem exigir sentido divino.
- source_word: Ὀλοφέρνη
  choice: Holofernes
  rationale: Emprega-se a forma tradicional do nome em português.
theological_decisions:
- issue: Tradução de δέσποτα como forma direta de tratamento
  choice: meu senhor
  alternative: mestre; soberano
  rationale: O termo exprime autoridade e domínio, mas não é necessário atribuir-lhe conotação teológica. Em minúscula e no contexto de tratamento militar, “meu senhor” soa natural e preserva a hierarquia; “mestre” seria ambíguo ou pouco idiomático diante do nome, e “soberano” seria excessivamente régio.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. O pronome possessivo “teu” preserva o tratamento direto solene sem arcaísmo excessivo. A ordem da frase acompanha de perto o grego, mas permanece natural em português.
