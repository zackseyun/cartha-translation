    text: “Filhos de Israel” é uma expressão coletiva tradicional que se refere a Israel.
    reason: cultural_note
lexical_decisions:
- source_word: σπασάμενος
  choice: saquei
  rationale: O particípio aoristo de σπάω, neste contexto, descreve o ato de sacar uma arma. “Saquei” é claro, natural e apropriado para uma espada.
- source_word: τὴν παρ' αὐτοῦ μάχαιραν
  choice: a espada dele
  rationale: μάχαιρα designa uma espada ou lâmina, e παρ' αὐτοῦ indica que ela estava com ele ou foi tomada dele. “A espada dele” preserva a posse sem especificar além do que o grego exige onde exatamente a arma estava.
- source_word: ἀπεκεφάλισα
  choice: o decapitei
  rationale: O verbo significa cortar a cabeça ou decapitar. “O decapitei” reproduz o sentido de modo direto e digno; a alternativa mais concreta aparece em nota.
- source_word: ἦρα
  choice: tirei
  rationale: αἴρω, usado figuradamente com ὄνειδος, significa retirar ou remover. “Tirei” forma uma expressão portuguesa natural com “a desonra”.
- source_word: ὄνειδος
  choice: desonra
  rationale: ὄνειδος pode indicar opróbrio, vergonha ou desonra pública. “Desonra” comunica bem o contexto coletivo de humilhação de Israel.
- source_word: ἐξ υἱῶν Ἰσραήλ
  choice: de sobre os filhos de Israel
  rationale: A expressão mantém o substantivo masculino υἱῶν e entende ἐξ com ἦρα como retirada da desonra que pesava sobre Israel. “De sobre” torna essa relação idiomática em português sem neutralizar a expressão tradicional.
theological_decisions:
- issue: Expressão coletiva marcada pelo gênero
  choice: os filhos de Israel
  alternative: o povo de Israel
  rationale: O grego traz explicitamente o plural masculino υἱῶν. A tradução preserva essa forma tradicional, enquanto a nota esclarece seu emprego coletivo, sem restringi-la silenciosamente apenas aos homens.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Saquei” preserva o cenário militar; “decapitei” evita prolixidade; e “de sobre” expressa naturalmente a remoção da desonra. Os marcadores foram colocados junto às expressões que explicam.
