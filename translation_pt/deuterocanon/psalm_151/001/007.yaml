  text: But I drew his own sword and cut off his head[b][a], and I removed disgrace from the sons of Israel.
translation:
  language: pt
  text: Mas eu tirei dele a espada e o decapitei[a], removendo a desonra dos filhos de Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cortei a cabeça dele”.'
    reason: lexical_alternative
