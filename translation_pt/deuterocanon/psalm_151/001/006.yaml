translation:
  language: pt
  text: Saí ao encontro do estrangeiro[a], e ele me amaldiçoou pelos seus ídolos[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do filisteu”. O grego diz literalmente “do estrangeiro” ou “do homem de outro povo”, termo frequentemente usado para os filisteus na Septuaginta.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “em nome de seus ídolos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: Saí
  rationale: O aoristo de ἐξέρχομαι indica que o narrador saiu; a forma portuguesa é direta e não acrescenta uma direção não explicitada pelo grego.
- source_word: εἰς συνάντησιν
  choice: ao encontro de
  rationale: A expressão indica movimento com a finalidade de encontrar ou enfrentar alguém; «sair ao encontro de» é idiomático e fiel em português.
- source_word: τῷ ἀλλοφύλῳ
  choice: do estrangeiro
  rationale: ἀλλόφυλος designa literalmente alguém de outro povo. Embora seja frequentemente usado para um filisteu na Septuaginta, o texto grego mantém aqui o termo mais amplo.
- source_word: ἐπικατηράσατό
  choice: me amaldiçoou
  rationale: O verbo expressa a invocação de uma maldição contra alguém; «amaldiçoou» transmite o sentido com clareza e concisão.
- source_word: ἐν τοῖς εἰδώλοις αὐτοῦ
  choice: pelos seus ídolos
  rationale: A preposição ἐν pode indicar aqui o meio, a esfera ou a invocação associada à maldição. «Pelos seus ídolos» preserva essa concisão e permite a leitura de que ele os invocou.
theological_decisions:
- issue: Identidade de ἀλλόφυλος no contexto de Davi e Golias
  choice: o estrangeiro
  alternative: o filisteu
  rationale: O contexto aponta para o filisteu Golias, mas o testemunho grego emprega um termo mais geral, «homem de outro povo». O texto principal conserva essa formulação, e a identificação contextual fica na nota.
- issue: Sentido de ἐν τοῖς εἰδώλοις αὐτοῦ
  choice: pelos seus ídolos
  alternative: em nome de seus ídolos
  rationale: A frase vincula a maldição aos ídolos do adversário, provavelmente como poderes invocados. A tradução principal mantém a construção relativamente formal, enquanto a nota apresenta a explicitação provável sem torná-la obrigatória.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção narrativa natural. «Saí ao encontro» pode sugerir tanto encontrar quanto enfrentar, preservando adequadamente a tensão do contexto. Os marcadores [a] e [b] aparecem no texto principal.
