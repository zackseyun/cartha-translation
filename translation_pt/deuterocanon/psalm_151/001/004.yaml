base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalm_151/001/004.yaml
  text: He himself sent out his messenger[a], and took me from my father's sheep, and anointed me with the oil of his anointing.
translation:
  language: pt
  text: Ele mesmo enviou o seu mensageiro[a], tirou-me do meio das ovelhas de meu pai e ungiu-me com o óleo da sua unção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «anjo». A palavra grega pode designar tanto um mensageiro humano quanto um ser angelical.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: Ele mesmo
  rationale: Preserva a ênfase do pronome grego, que aparece de modo enfático.
- source_word: ἐξαπέστειλεν
  choice: enviou
  rationale: É a forma natural em português para o envio deliberado; o contexto já comunica plenamente a ação, sem exigir o menos idiomático «enviou para fora».
- source_word: τὸν ἄγγελον αὐτοῦ
  choice: o seu mensageiro
  rationale: Ἄγγελος pode designar tanto um mensageiro humano quanto um anjo. «Mensageiro» se ajusta ao contexto da unção de Davi sem inserir no texto grego uma identificação sobrenatural inequívoca; a alternativa é preservada em nota.
- source_word: ἦρέν με
  choice: tirou-me
  rationale: Expressa naturalmente a ideia contextual de tomar Davi dentre as ovelhas, preservando o movimento indicado pelo verbo.
- source_word: ἐκ τῶν προβάτων τοῦ πατρός μου
  choice: do meio das ovelhas de meu pai
  rationale: Torna explícito o sentido idiomático de retirada dentre as ovelhas e mantém o termo concreto «ovelhas».
- source_word: ἔχρισέν με
  choice: ungiu-me
  rationale: Equivalente tradicional e preciso de χρίω, mantendo o sentido de consagração.
- source_word: ἐν τῷ ἐλαίῳ τῆς χρίσεως αὐτοῦ
  choice: com o óleo da sua unção
  rationale: «Com» expressa idiomaticamente o valor instrumental de ἐν, enquanto «óleo da sua unção» preserva a estrutura e a repetição lexical do grego.
theological_decisions:
- issue: Sentido de ἄγγελος no relato da escolha e unção de Davi
  choice: mensageiro
  alternative: anjo
  rationale: O substantivo grego admite os dois sentidos. O contexto da unção favorece um enviado humano, mas o texto grego não identifica expressamente o ser; por isso, «anjo» permanece registrado como alternativa lexical.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A colocação pronominal em «tirou-me» e «ungiu-me» conserva um tom bíblico moderado sem soar arcaica; a repetição «ungiu/ unção» reflete deliberadamente a repetição do grego.
