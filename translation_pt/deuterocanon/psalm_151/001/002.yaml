lexical_decisions:
- source_word: αἱ χεῖρές μου
  choice: Minhas mãos
  rationale: Equivalência direta e natural, preservando a posse em primeira pessoa sem acrescentar ênfase ausente.
- source_word: ἐποίησαν
  choice: fizeram
  rationale: O verbo comum ποιέω indica aqui produzir ou confeccionar; “fizeram” mantém a simplicidade do grego e o paralelismo poético.
- source_word: ὄργανον
  choice: um instrumento
  rationale: No contexto, ὄργανον tem sentido musical, mas o termo mais amplo “instrumento” preserva a generalidade lexical do grego.
- source_word: οἱ δάκτυλοί μου
  choice: meus dedos
  rationale: Correspondência direta, clara e idiomática em português.
- source_word: ἥρμοσαν
  choice: ajustaram
  rationale: Ἁρμόζω pode significar unir, encaixar ou ajustar. “Ajustaram” é natural em português e conserva a possível referência à montagem ou disposição das partes, sem restringir o sentido a afinar.
- source_word: ψαλτήριον
  choice: uma lira
  rationale: Designa um antigo instrumento de cordas dedilhadas. “Lira” é compreensível ao leitor moderno e evita o termo tradicional, porém pouco transparente, “saltério”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo entre as duas orações. A tradução mantém a distinção entre o termo genérico ὄργανον e o instrumento de cordas ψαλτήριον.
