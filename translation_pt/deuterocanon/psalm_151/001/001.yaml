lexical_decisions:
- source_word: Μικρός
  choice: pequeno
  rationale: Preserva o sentido amplo do grego, que pode indicar pouca idade, baixa estatura ou pouca importância, sem restringi-lo a uma única interpretação.
- source_word: νεώτερος
  choice: mais jovem
  rationale: Traduz o comparativo grego de modo direto, sem transformá-lo no superlativo «o mais novo».
- source_word: ἔποιμαινον
  choice: pastoreava
  rationale: O imperfeito expressa atividade habitual ou contínua no passado; «pastoreava» é natural e mantém a imagem pastoril.
- source_word: πρόβατα
  choice: ovelhas
  rationale: Equivalente corrente e preciso no contexto de pastoreio.
