  text: My brothers were handsome and tall, but the Lord did not take pleasure in them[a].
translation:
  language: pt
  text: Meus irmãos eram de boa aparência e altos, mas o Senhor não se agradou deles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não teve prazer neles” ou “não se deleitou neles”.'
    reason: Alternativas lexicais para οὐκ εὐδόκησεν, que pode expressar agrado, prazer ou deleite.
lexical_decisions:
- source_word: ἀδελφοί
  choice: irmãos
  rationale: O substantivo grego está no masculino plural e, no contexto de Davi, refere-se aos seus irmãos homens.
- source_word: καλοί
  choice: de boa aparência
  rationale: Em paralelo com μεγάλοι, descreve naturalmente a aparência física, sem atribuir bondade moral.
- source_word: μεγάλοι
  choice: altos
  rationale: Embora possa significar literalmente “grandes”, neste contexto de características físicas indica estatura impressionante; “altos” expressa esse sentido com naturalidade.
- source_word: οὐκ εὐδόκησεν
  choice: não se agradou deles
  rationale: εὐδοκέω denota agrado, prazer ou satisfação. A formulação portuguesa é natural e preserva a avaliação divina sem transformá-la explicitamente em escolha ou rejeição.
- source_word: Κύριος
  choice: o Senhor
  rationale: Traduz diretamente Κύριος e identifica, no contexto, o Deus de Israel.
theological_decisions:
- issue: Natureza da avaliação do Senhor sobre os irmãos de Davi
  choice: O Senhor não se agradou deles, sem que se especifique o motivo.
  alternative: O Senhor não os escolheu.
  rationale: O verbo εὐδοκέω expressa agrado ou aprovação, não emprega explicitamente um verbo de escolha. A tradução evita importar para este verso a formulação mais específica de 1 Samuel 16.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O verbo “eram”, implícito na oração nominal grega, foi acrescentado por necessidade sintática em português. “De boa aparência” evita que “belos” seja entendido como uma avaliação moral.
