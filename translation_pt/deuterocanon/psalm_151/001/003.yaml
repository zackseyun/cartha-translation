  text: And who will report[a] to my Lord? The Lord himself[b], he himself hears.
translation:
  language: pt
  text: E quem relatará[a] ao meu Senhor? O próprio Senhor[b] — ele mesmo ouve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “anunciará” ou “comunicará”. O verbo pode significar relatar, anunciar ou tornar algo conhecido.
    reason: lexical_alternative
  - marker: b
    text: 'O grego repete o pronome com valor enfático: “O próprio Senhor — ele mesmo ouve”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: quem
  rationale: Pronome interrogativo que introduz uma pergunta retórica; “quem” é o equivalente português direto e natural.
- source_word: ἀναγγελεῖ
  choice: relatará
  rationale: O futuro de ἀναγγέλλω indica tornar algo conhecido, anunciar ou relatar. “Relatará” preserva a ideia de comunicar algo ao Senhor e a força futura da pergunta, sem especificar um conteúdo ausente no grego.
- source_word: τῷ κυρίῳ μου
  choice: ao meu Senhor
  rationale: Mantém o dativo de destinatário e traduz κύριος como título, em coerência com a segunda ocorrência no versículo.
- source_word: αὐτὸς Κύριος
  choice: O próprio Senhor
  rationale: “Próprio” comunica a ênfase do primeiro αὐτός e identifica o Senhor como aquele que não depende de um mensageiro humano.
- source_word: αὐτὸς εἰσακούει
  choice: ele mesmo ouve
  rationale: Conserva a repetição enfática de αὐτός. “Ouve” mantém o sentido amplo de εἰσακούω sem explicitar se ouvir implica atender ou responder.
theological_decisions:
- issue: Tradução das duas ocorrências de κύριος
  choice: Senhor
  alternative: senhor / mestre
  rationale: O contexto permite “senhor” ou “mestre” em sentido lexical, mas a repetição funciona como título. “Senhor” preserva essa possibilidade sem introduzir uma identificação doutrinária adicional.
- issue: Sentido de εἰσακούει
  choice: ouve
  alternative: atende / escuta favoravelmente
  rationale: O verbo pode sugerir ouvir com atenção ou favor, mas “ouve” preserva a amplitude sem resolver se a frase afirma apenas percepção ou também resposta favorável.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A elipse após “relatará” acompanha o grego, que não explicita o conteúdo relatado. O travessão torna legível a repetição enfática sem eliminar sua tensão sintática.
