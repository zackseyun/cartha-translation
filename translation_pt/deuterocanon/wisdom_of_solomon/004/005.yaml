  source_fidelity: A tradução preserva a imagem agrícola, o futuro passivo e a dupla avaliação negativa do fruto. Contudo, «ramos que não chegaram a amadurecer» atribui aos ramos um processo expresso mais naturalmente para frutos e torna menos preciso o sentido de ἀτέλεστοι, «não plenamente desenvolvido/completo». «Verde demais» também introduz uma intensificação não explícita no grego.
  naturalness: O texto é claro e de registro apropriado, mas «ramos ... amadurecer» é menos idiomático na imagem botânica. «Ainda não plenamente desenvolvidos» é natural, mantém a metáfora e evita confundir o desenvolvimento dos ramos com o amadurecimento do fruto.
  terminology: «Ramos», «fruto», «inútil» e «quebrados» são adequados. A formulação final «não servirá para nada» retém de modo natural a força enfática de εἰς οὐδὲν ἐπιτήδειος, mesmo após «inútil».
