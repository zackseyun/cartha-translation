base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/005.yaml
  text: Unfinished branches will be broken off[a], and their fruit is useless, unripe for eating and fit for nothing[b];
translation:
  language: pt
  text: Ramos ainda não plenamente desenvolvidos serão quebrados[a], e seu fruto será inútil, ainda verde para comer[b] e não servirá para nada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ramos imaturos». O adjetivo grego pode designar aquilo que não chegou à completude ou ao pleno desenvolvimento.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «prematuro para comer». No contexto de um fruto, «ainda verde» expressa naturalmente a imagem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περικλασθήσονται
  choice: serão quebrados
  rationale: O futuro passivo anuncia o resultado que sobrevirá aos ramos. Em português, «serão quebrados» preserva a voz passiva e soa natural no contexto.
- source_word: κλῶνες
  choice: ramos
  rationale: É o equivalente botânico corrente e mantém com clareza a imagem agrícola.
- source_word: ἀτέλεστοι
  choice: que não chegaram a amadurecer
  rationale: O adjetivo indica aquilo que não alcançou seu pleno desenvolvimento. A formulação explicita esse sentido de maneira natural, sem abandonar a imagem dos ramos.
- source_word: καρπός
  choice: fruto
  rationale: Mantém literalmente a imagem agrícola e corresponde ao uso normal em português.
- source_word: ἄχρηστος
  choice: inútil
  rationale: Expressa diretamente a falta de utilidade ou proveito do fruto.
- source_word: ἄωρος
  choice: verde demais
  rationale: No contexto de fruto destinado à alimentação, indica que ainda não está maduro. «Verde demais» é uma formulação portuguesa natural e imagética.
- source_word: εἰς βρῶσιν
  choice: para ser comido
  rationale: Expressa com clareza a relação do fruto com o consumo, em construção idiomática portuguesa.
- source_word: εἰς οὐδὲν ἐπιτήδειος
  choice: sem serventia alguma
  rationale: Reproduz a ideia de não ser adequado nem útil para finalidade alguma, evitando a repetição imediata de «inútil».
theological_decisions:
- issue: Força metafórica da imagem agrícola no contexto
  choice: Manter no texto os ramos e o fruto
  alternative: Explicitar o referente como descendentes ou filhos dos ímpios
  rationale: Embora o contexto aplique a imagem à descendência dos ímpios, o versículo apresenta a metáfora em termos agrícolas. Preservá-la evita inserir no texto uma interpretação que o contexto já permite reconhecer.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A metáfora agrícola foi preservada; «sem serventia alguma» mantém a força da cláusula final sem repetição pouco elegante.
