base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/003.yaml
  text: But the many offspring of the ungodly will be of no use[a], and from bastard shoots they will not give a root into depth[b], nor will they set a firm foundation.
translation:
  language: pt
  text: Mas os numerosos descendentes dos ímpios não terão utilidade; de brotos ilegítimos não lançarão raízes profundas nem estabelecerão uma base segura.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “brotos espúrios” ou “enxertos bastardos”. O grego emprega um termo severo dentro de uma metáfora hortícola.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não darão raiz em profundidade”; isto é, não criarão raízes profundas.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολύγονον ... πλῆθος
  choice: a numerosa descendência
  rationale: Expressa naturalmente em português a ideia coletiva de uma multidão prolífica ou de muitos descendentes.
- source_word: ἀσεβῶν
  choice: dos ímpios
  rationale: Preserva a dimensão religiosa e moral do termo grego, indicando falta de reverência a Deus.
- source_word: οὐ χρησιμεύσει
  choice: não terá utilidade
  rationale: Mantém o sentido futuro de não ser útil ou proveitoso em registro digno e corrente.
- source_word: ἐκ νόθων μοσχευμάτων
  choice: de brotos ilegítimos
  rationale: Conserva a severidade de νόθος e a metáfora vegetal de μοσχεύματα sem recorrer, no português atual, a uma expressão que poderia desviar a atenção para um insulto pessoal.
- source_word: οὐ δώσει ῥίζαν εἰς βάθος
  choice: não lançará raízes profundas
  rationale: Verte de modo idiomático a imagem literal de dar raiz em profundidade; o singular concorda com o sujeito coletivo 'descendência'.
- source_word: οὐδὲ ἀσφαλῆ βάσιν ἐδράσει
  choice: nem firmará um alicerce seguro
  rationale: Reproduz a noção de estabelecer uma base estável e mantém a imagem de firmeza.
theological_decisions:
- issue: Caracterização religioso-moral de ἀσεβῶν
  choice: ímpios
  alternative: perversos; irreligiosos
  rationale: '''Ímpios'' conserva a orientação do termo para a relação com Deus sem acrescentar uma definição doutrinária.'
- issue: Severidade e ambiguidade metafórica de νόθων
  choice: brotos ilegítimos
  alternative: brotos espúrios; enxertos bastardos
  rationale: A tradução mantém a avaliação negativa e a metáfora hortícola. A nota registra alternativas porque νόθος pode indicar ilegitimidade ou caráter espúrio, e μοσχεύματα pode designar brotos, mudas ou enxertos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção preserva a transição da descendência para as imagens vegetais e arquitetônicas do grego, sem explicitar além do texto a identidade ou o destino desses descendentes.
