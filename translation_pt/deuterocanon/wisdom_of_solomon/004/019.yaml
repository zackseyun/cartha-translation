base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/019.yaml
  text: And after this they will become a dishonored corpse and a reproach among the dead forever[a]. For he will dash them down headlong and speechless, and shake them from their foundations; they will be laid waste to the uttermost, and they will be in pain[b], and their memory will perish.
translation:
  language: pt
  text: Depois disso, eles se tornarão um cadáver desonrado e motivo de desprezo entre os mortos para sempre.[a] Pois ele[b] os lançará ao chão, de bruços e sem voz, e os abalará desde os alicerces; ficarão completamente desolados, sofrerão dores, e a memória deles desaparecerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um corpo caído e desonrado”; o grego πτῶμα pode indicar um corpo caído ou cadáver, ressaltando a vergonha do fim deles.
    reason: lexical_alternative
  - marker: b
    text: O sujeito de “lançará” e “abalará” está implícito no grego. No contexto, trata-se de Deus em seu juízo, embora o versículo não repita o nome divino.
    reason: alternative_reading
lexical_decisions:
- source_word: πτῶμα
  choice: cadáver
  rationale: Neste contexto de juízo, o termo designa concretamente um corpo caído ou morto, e não apenas uma queda. “Cadáver” comunica com clareza o fim vergonhoso descrito.
- source_word: ἄτιμον
  choice: desonrado
  rationale: Preserva a ideia de perda de honra e vergonha pública, além de formar em português uma expressão natural com “cadáver”.
- source_word: ὕβριν
  choice: motivo de desprezo
  rationale: Aqui o substantivo aponta para a condição vergonhosa e ultrajante em que eles ficarão. A expressão evita restringir o sentido a um ato específico de insulto.
- source_word: ἐν νεκροῖς
  choice: entre os mortos
  rationale: Com pessoas no plural, ἐν é naturalmente expresso por “entre”, indicando o lugar deles no conjunto dos mortos.
- source_word: διʼ αἰῶνος
  choice: para sempre
  rationale: No contexto de juízo duradouro e desaparecimento da memória, esta formulação transmite de modo claro a força temporal da expressão.
- source_word: ῥήξει ... πρηνεῖς
  choice: os lançará ao chão, de bruços
  rationale: A combinação comunica uma ação violenta que os deixa com o rosto voltado para baixo, preservando a imagem concreta do grego sem recorrer a uma expressão portuguesa artificial.
- source_word: ἀφώνους
  choice: sem voz
  rationale: Mantém a possibilidade de estarem mudos, silenciados ou incapazes de falar, sem determinar além do que o adjetivo grego exige.
- source_word: σαλεύσει ... ἐκ θεμελίων
  choice: os abalará desde os alicerces
  rationale: Conserva a metáfora de uma desestabilização total a partir da base e soa natural em português.
- source_word: ἕως ἐσχάτου χερσωθήσονται
  choice: ficarão completamente desolados
  rationale: “Completamente” expressa a extensão máxima de ἕως ἐσχάτου, enquanto “desolados” preserva a imagem de devastação de χερσόω.
- source_word: ἡ μνήμη αὐτῶν ἀπολεῖται
  choice: a memória deles desaparecerá
  rationale: Expressa de forma direta a perda da lembrança ou memória deles, sem acrescentar um agente que a apague.
theological_decisions:
- issue: Sujeito implícito dos verbos de juízo
  choice: Manter “ele” sem identificar expressamente o agente
  alternative: Explicitar “Deus” como sujeito ou empregar uma construção impessoal
  rationale: As formas ῥήξει e σαλεύσει têm sujeito masculino singular implícito. O contexto aponta para Deus, mas o versículo não repete o nome divino; “ele” preserva tanto a sintaxe quanto essa implicitude.
translation_notes:
  register: Português moderno, claro e digno, com construções amplamente compreensíveis no Brasil e em outras comunidades lusófonas. Conservou-se o singular coletivo e chocante de “um cadáver”, apesar do sujeito plural, bem como a alternância para passivos e estados subsequentes no restante do versículo.
