  text: He was taken away, lest evil change his understanding or deceit mislead his soul.
translation:
  language: pt
  text: Foi arrebatado, para que a maldade não mudasse seu entendimento, ou o engano iludisse sua alma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρπάγη
  choice: Foi arrebatado
  rationale: O aoristo passivo de ἁρπάζω indica que ele foi retirado de modo súbito; “arrebatado” preserva a força do verbo e deixa implícito o agente, como no grego.
- source_word: μή
  choice: para que... não
  rationale: 'Após ἡρπάγη, exprime prevenção ou finalidade negativa: ele foi retirado para evitar o efeito possível da maldade.'
- source_word: κακία
  choice: maldade
  rationale: Equivalente natural e abrangente para a qualidade ou influência moralmente má aqui personificada.
- source_word: ἀλλάξῃ
  choice: mudasse
  rationale: Preserva o sentido direto de alterar ou modificar, sem especificar um processo não expresso no texto.
- source_word: σύνεσιν
  choice: entendimento
  rationale: Designa discernimento ou capacidade de compreender; “entendimento” é claro, digno e adequado ao contexto sapiencial.
- source_word: δόλος
  choice: engano
  rationale: Comunica fraude, ardil ou dolo de modo corrente e mantém o paralelismo com “maldade”.
- source_word: ἀπατήσῃ
  choice: iludisse
  rationale: Evita a repetição pouco natural “o engano enganasse” e transmite a ação de desencaminhar por fraude.
- source_word: ψυχὴν
  choice: alma
  rationale: Mantém a linguagem antropológica do texto e sua distinção paralela em relação ao entendimento, sem definir tecnicamente sua natureza.
theological_decisions:
- issue: Agente e sentido do arrebatamento
  choice: Manter a voz passiva e não nomear o agente
  alternative: Explicitar que Deus o levou ou interpretar diretamente como morte
  rationale: O versículo diz apenas ἡρπάγη; o contexto pode sugerir ação divina e retirada pela morte, mas tais elementos não devem ser inseridos explicitamente aqui.
- issue: Relação expressa por μή
  choice: 'Traduzir como finalidade/prevenção: “para que... não”'
  alternative: 'Traduzir apenas como temor: “para que não acontecesse de” ou “com medo de que”'
  rationale: A construção admite nuance preventiva e final; a formulação escolhida é natural em português e não exige que a maldade inevitavelmente alteraria o justo.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A estrutura paralela do grego foi preservada; “nem” coordena as duas ameaças sem peso arcaizante excessivo.
