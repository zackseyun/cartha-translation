base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/016.yaml
  text: But the righteous one[a], though dead, will condemn the living ungodly[b]; and youth brought to completion quickly will condemn the many-year old age of the unrighteous.
translation:
  language: pt
  text: Mas o justo, mesmo tendo morrido[a], condenará os ímpios vivos; e a juventude que depressa alcançou a plenitude[b] condenará a velhice prolongada do injusto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «depois de morrer» ou «tendo morrido». O particípio grego pode ser traduzido de modo mais literal; no contexto, refere-se à morte do justo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «a juventude rapidamente consumada» ou «a juventude levada depressa à plenitude». A expressão indica uma vida completada em pouco tempo, sem necessariamente afirmar perfeição moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρινεῖ
  choice: condenará
  rationale: O futuro de κατακρίνω indica condenar ou pronunciar juízo contra alguém. “Condenará” é direto e natural, e o verbo subentendido na segunda oração foi repetido em português para dar clareza.
- source_word: δίκαιος
  choice: o justo
  rationale: O adjetivo singular é substantivado. “O justo” preserva a referência pessoal singular e o contraste com “o injusto” no fim do versículo.
- source_word: καμών
  choice: mesmo tendo morrido
  rationale: Neste contexto, κάμνω se refere à morte do justo mencionada na passagem. A construção concessiva explicita naturalmente o contraste entre o justo morto e os ímpios ainda vivos.
- source_word: τοὺς ζῶντας ἀσεβεῖς
  choice: os ímpios que continuam vivos
  rationale: A expressão identifica pessoas ímpias que permanecem vivas, em contraste com o justo que morreu. “Continuam vivos” torna esse contraste claro sem acrescentar uma conclusão teológica.
- source_word: νεότης
  choice: a juventude
  rationale: νεότης designa juventude ou pouca idade; “a juventude” mantém a concisão e a personificação retórica do grego.
- source_word: τελεσθεῖσα
  choice: que chegou à plenitude
  rationale: O particípio comunica a ideia de conclusão ou consumação. “Chegou à plenitude” preserva esse sentido teleológico sem sugerir necessariamente impecabilidade moral.
- source_word: ταχέως
  choice: rapidamente
  rationale: Equivalente adverbial claro e corrente para a ideia de rapidez.
- source_word: πολυετὲς γῆρας
  choice: a velhice de muitos anos
  rationale: A formulação conserva o contraste explícito entre uma juventude consumada depressa e uma velhice extensa.
- source_word: ἀδίκου
  choice: do injusto
  rationale: O genitivo indica a pessoa injusta a quem pertence essa velhice. “Injusto” mantém o contraste lexical com δίκαιος, “justo”.
theological_decisions:
- issue: Sentido contextual de καμών
  choice: mesmo tendo morrido
  alternative: depois de morrer; tendo morrido
  rationale: O contexto imediato trata da morte precoce do justo. A formulação escolhida preserva a referência à morte e exprime o contraste concessivo, sem definir de que modo o morto exercerá essa condenação.
- issue: Uso de linguagem de perfeição em τελεσθεῖσα
  choice: chegou à plenitude
  alternative: foi aperfeiçoada; foi levada à conclusão
  rationale: “Chegou à plenitude” comunica consumação sem impor a ideia mais específica de perfeição moral, mantendo aberta a tensão entre brevidade da vida e realização plena.
- issue: Verbo elíptico na segunda oração
  choice: repetir “condenará”
  alternative: deixar o verbo implícito
  rationale: O grego coordena a segunda oração com o verbo da primeira subentendido. Repeti-lo produz português claro e conserva a relação judicial entre os dois contrastes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela do grego foi preservada, e os termos “justo” e “injusto” mantêm o contraste lexical. Evitou-se linguagem excessivamente técnica ou confessional.
