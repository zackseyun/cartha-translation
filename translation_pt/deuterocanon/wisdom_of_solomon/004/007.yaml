  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/007.yaml
  text: But the righteous man[a], if he dies early, will be at rest.
translation:
  language: pt
  text: Mas o justo, se morrer cedo[a], estará em repouso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, «se chegar a morrer»; a expressão grega provavelmente significa morrer cedo ou antes do tempo esperado.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιος
  choice: o justo
  rationale: O adjetivo substantivado designa uma pessoa singular caracterizada pela justiça; em português, «o justo» é natural e preserva o valor representativo sem acrescentar «homem».
- source_word: ἐὰν
  choice: ainda que
  rationale: 'Embora introduza formalmente uma condição, no contexto a oração tem força concessiva: a morte prematura do justo não impede que ele esteja em repouso.'
- source_word: φθάσῃ τελευτῆσαι
  choice: morra antes do tempo
  rationale: A combinação de φθάνω com o infinitivo τελευτῆσαι exprime chegar à morte mais cedo do que se esperaria; a formulação portuguesa comunica o sentido idiomático sem tornar a morte literalmente predestinada a um momento específico.
- source_word: ἐν ἀναπαύσει
  choice: em repouso
  rationale: Preserva a imagem de descanso e o tom solene, sem definir além do grego a natureza desse estado.
- source_word: ἔσται
  choice: estará
  rationale: Equivalente direto e contemporâneo do futuro do verbo «ser/estar»; «estar» é natural para indicar o estado de repouso.
theological_decisions:
- issue: Se ἐν ἀναπαύσει deve receber uma formulação explicitamente ligada à vida após a morte
  choice: em repouso
  alternative: em paz
  rationale: O grego afirma um estado de repouso, mas não especifica seus mecanismos metafísicos. «Em repouso» conserva o consolo e a abertura teológica do texto.
- issue: Se a condição com ἐὰν deve ser traduzida literalmente ou segundo sua força contextual
  choice: ainda que morra antes do tempo
  alternative: se morrer antes do tempo
  rationale: 'A forma concessiva exprime naturalmente o contraste introduzido por δέ: mesmo a morte prematura não priva o justo do repouso. A nota registra a construção mais literal e sua ambiguidade idiomática.'
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. «O justo» evita marcar desnecessariamente o sexo do referente; «em repouso» mantém o tom sapiencial e não acrescenta uma doutrina específica sobre o além.
