  text: For grace and mercy are upon his chosen ones[a], and visitation upon his holy ones.
translation:
  language: pt
  text: Pois há graça e misericórdia entre os seus escolhidos, e visitação[a] entre os seus santos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “supervisão”, “cuidado” ou “atenção vigilante”; o termo grego pode indicar visitação ou inspeção divina. Aqui, o contexto sugere cuidado bondoso.
    reason: alternativa lexical
lexical_decisions:
- source_word: χάρις
  choice: graça
  rationale: “Graça” conserva tanto o sentido de favor divino quanto o peso teológico do termo e forma um par natural com “misericórdia”.
- source_word: ἔλεος
  choice: misericórdia
  rationale: É o equivalente direto e corrente no contexto da bondade e compaixão divinas.
- source_word: ἐκλεκτοῖς
  choice: escolhidos
  rationale: Expressa de modo claro o sentido de pessoas escolhidas, sem acrescentar formulações doutrinárias posteriores.
- source_word: ἐπισκοπή
  choice: visitação
  rationale: Mantém a amplitude do substantivo grego, que pode indicar visita, inspeção, supervisão ou cuidado atento; o paralelismo favorece aqui uma ação divina benéfica.
- source_word: ὁσίοις
  choice: santos
  rationale: Preserva o sentido de pessoas consagradas, piedosas ou fiéis e mantém o paralelismo substantivado com “escolhidos”.
- source_word: ἐν
  choice: sobre
  rationale: Neste paralelismo, “sobre” comunica que a graça, a misericórdia e a visitação se dirigem a essas pessoas, além de produzir uma construção portuguesa inteligível e solene.
theological_decisions:
- issue: Sentido da visitação divina (ἐπισκοπή)
  choice: visitação divina benéfica, sem eliminar a amplitude lexical
  alternative: supervisão, cuidado vigilante ou inspeção, possivelmente associada a juízo em outros contextos
  rationale: O paralelo imediato com “graça e misericórdia” aponta para cuidado favorável. “Visitação” conserva, porém, a tensão e a amplitude do termo em vez de reduzi-lo simplesmente a “cuidado”.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência bíblica moderada. O verbo “estar” foi explicitado para tornar natural a oração nominal grega; a elipse antes de “sobre os seus santos” preserva o paralelismo. O marcador foi colocado junto de “visitação”, termo ao qual a nota se refere.
