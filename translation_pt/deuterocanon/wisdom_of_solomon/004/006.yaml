base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/006.yaml
  text: For children born from lawless unions are witnesses of their parents’ wickedness at their examination[a][b][c].
translation:
  language: pt
  text: Pois os filhos nascidos de uniões contrárias à lei são testemunhas da maldade de seus pais quando são examinados.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de leitos contrários à lei”, eufemismo grego para relações sexuais ilícitas.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “são testemunhas contra seus pais quanto à maldade deles”.'
    reason: alternative_reading
  - marker: c
    text: A expressão “quando são examinados” também pode significar, de modo mais geral, “quando ficam sob escrutínio”; alguns entendem que o pronome se refere aos pais, e não aos filhos.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνόμων
  choice: contrárias à lei
  rationale: Expressa o sentido de ἄνομος, aquilo que se opõe à lei ou à ordem moral, em português natural, sem reduzir o termo à ideia mais genérica de maldade.
- source_word: ὕπνων
  choice: uniões
  rationale: O sentido literal é “leitos” ou “relações de leito”, eufemismo grego para relações sexuais. “Uniões” comunica o sentido idiomático com dignidade; a imagem literal é registrada em nota.
- source_word: τέκνα γεννώμενα
  choice: filhos nascidos
  rationale: Reproduz de modo claro o valor passivo e resultativo da expressão participial, que se refere à descendência gerada por essas relações.
- source_word: μάρτυρές εἰσιν
  choice: são testemunhas
  rationale: Mantém a construção nominal e o tom forense, que se ajusta à menção posterior de exame ou averiguação.
- source_word: πονηρίας
  choice: maldade
  rationale: Indica a qualidade moral má de que os filhos dão testemunho, em linguagem corrente e suficientemente forte.
- source_word: κατὰ γονέων
  choice: da maldade de seus pais
  rationale: κατά com genitivo tem força adversativa ou forense, isto é, testemunho que implica os pais. A formulação portuguesa é natural, enquanto a alternativa mais explícita “contra seus pais” é preservada em nota.
- source_word: ἐν ἐξετασμῷ αὐτῶν
  choice: quando são examinados
  rationale: ἐξετασμός designa exame, averiguação ou escrutínio. O pronome pode retomar os filhos, sujeito imediato, mas seu referente permanece ambíguo; a nota registra outras possibilidades.
theological_decisions:
- issue: Força moral do eufemismo ἀνόμων ὕπνων
  choice: uniões contrárias à lei
  alternative: leitos ilícitos; relações imorais
  rationale: A tradução conserva tanto a condenação moral quanto o caráter eufemístico do grego, sem empregar linguagem crua nem especificar uma categoria de relação que o texto não explicita.
- issue: Referente de αὐτῶν em ἐν ἐξετασμῷ αὐτῶν
  choice: os filhos são examinados
  alternative: os pais são examinados; todos ficam sob escrutínio de modo geral
  rationale: O antecedente sintático mais próximo e o sujeito da oração são os filhos. Contudo, como o pronome grego admite outra referência, a tradução não elimina essa tensão e apresenta as alternativas em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Pois” preserva a conexão explicativa de γάρ. A formulação conserva o tom forense e registra em notas a imagem eufemística e as ambiguidades sintáticas do grego.
