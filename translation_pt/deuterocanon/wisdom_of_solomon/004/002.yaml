  verdict: revise
  source_fidelity: A tradução preserva a personificação feminina, o contraste entre presença e partida, a procissão triunfal e a sequência de vitória já consumada. Contudo, «competição por prêmios imaculados» pode sugerir que a competição é realizada em favor dos prêmios ou que estes são sua finalidade, em vez de reproduzir com clareza a relação entre a competição vencida e os prêmios «imaculados».
  naturalness: O português é moderno, claro e apropriado ao registro sapiencial. «Sentem saudades dela» é idiomático e transmite adequadamente o desejo em sua ausência. «Através dos tempos» é uma solução natural para a duração expressa por ἐν τῷ αἰῶνι, com a alternativa mais forte devidamente mantida na nota.
  terminology: «Desfila em triunfo», «coroa da vitória», «imaculados», «prêmios» e «competição» conservam de modo compreensível a imagem de procissão e vitória atlética. A formulação final é ajustada para tornar explícito que ela venceu a competição pelos prêmios, sem eliminar a qualificação «imaculados».
