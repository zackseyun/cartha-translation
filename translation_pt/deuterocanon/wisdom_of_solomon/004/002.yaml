base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/002.yaml
  text: When she is present[a], they imitate her, and they long for her when she has gone; and through the age she marches in triumph, wearing a victor’s wreath, having won the contest of the undefiled prizes.
translation:
  language: pt
  text: Enquanto ela está presente, eles a imitam; quando parte, sentem saudades dela. E, através dos tempos[a], ela desfila em triunfo, levando a coroa da vitória, tendo vencido a competição pelos prêmios imaculados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para sempre”. A expressão grega diz literalmente “na era” e pode indicar renome duradouro ou perpétuo.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροῦσάν
  choice: enquanto ela está presente
  rationale: Expressa naturalmente a presença indicada pelo particípio e mantém o contraste temporal com ἀπελθοῦσαν.
- source_word: μιμοῦνται
  choice: eles a imitam
  rationale: Tradução direta e transparente do verbo, preservando a personificação feminina.
- source_word: ποθοῦσιν
  choice: sentem saudades dela
  rationale: Comunica em português corrente o desejo intenso provocado por sua ausência, sem conotação romântica indevida.
- source_word: ἀπελθοῦσαν
  choice: quando parte
  rationale: Mantém o contraste entre presença e partida; o aspecto de partida consumada é compreendido pelo contexto.
- source_word: ἐν τῷ αἰῶνι
  choice: através dos tempos
  rationale: Preserva a ideia de honra duradoura, sem definir a expressão como uma afirmação técnica sobre a eternidade.
- source_word: στεφανηφοροῦσα
  choice: levando a coroa da vitória
  rationale: Conserva tanto a imagem da coroa ou grinalda quanto sua ligação com a vitória atlética.
- source_word: πομπεύει
  choice: desfila em triunfo
  rationale: Representa uma participação pública e triunfal em procissão, em português natural.
- source_word: ἀμιάντων
  choice: imaculados
  rationale: Retém a noção de algo sem mancha ou contaminação, aplicada aos prêmios.
- source_word: ἄθλων
  choice: prêmios
  rationale: Designa os prêmios conquistados numa competição e sustenta a metáfora atlética.
- source_word: ἀγῶνα
  choice: competição
  rationale: Mantém o sentido atlético de disputa sem restringi-lo a uma corrida.
- source_word: νικήσασα
  choice: depois de vencer
  rationale: Expressa uma vitória concluída antes do desfile triunfal.
theological_decisions:
- issue: Referente dos pronomes femininos
  choice: Manter a virtude personificada por meio de “ela/dela”
  alternative: Explicitar uma abstração como “a excelência” ou “o caráter nobre”
  rationale: O contexto imediato personifica a virtude; manter o feminino conserva o recurso literário sem impor uma identificação mais específica.
- issue: Sentido de ἐν τῷ αἰῶνι
  choice: Uma vitória duradoura, que atravessa os tempos
  alternative: “para sempre” ou “na eternidade”
  rationale: A expressão pode indicar renome permanente, mas também admite formulação mais forte; o texto principal evita resolver essa ambiguidade, e a nota registra a alternativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação divide o período longo sem desfazer sua progressão. A linguagem preserva a personificação feminina, a procissão triunfal e o conjunto de imagens atléticas.
