  text: For old age is honorable not because it is long-lived, nor is it measured by the number of years;
translation:
  language: pt
  text: Pois a velhice é honrosa não por durar muito tempo, nem se mede pelo número de anos;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γῆρας
  choice: velhice
  rationale: O termo designa a velhice ou idade avançada em si, e “velhice” é o equivalente português mais direto e natural.
- source_word: τίμιον
  choice: honrosa
  rationale: Neste contexto sapiencial e ético, o adjetivo expressa honra e estima, não valor material.
- source_word: οὐ τὸ πολύχρονον
  choice: não por durar muito tempo
  rationale: A expressão nega que a longa duração seja o fundamento da honra atribuída à velhice. A formulação é idiomática em português e evita acrescentar a ideia específica de longevidade biológica além do que o grego afirma.
- source_word: οὐδὲ
  choice: nem
  rationale: Mantém a ligação estreita entre as duas negações do texto grego.
- source_word: ἀριθμῷ ἐτῶν
  choice: pelo número de anos
  rationale: Expressa com clareza o critério ou padrão de medição indicado pelo dativo grego.
- source_word: μεμέτρηται
  choice: se mede
  rationale: O presente de valor geral comunica naturalmente em português a força gnômica do perfeito passivo grego.
theological_decisions:
- issue: Em que consiste a honra da velhice
  choice: A velhice pode ser honrosa, mas sua honra não decorre simplesmente de sua duração nem da contagem cronológica dos anos.
  alternative: Entender toda velhice longa como necessariamente honrosa.
  rationale: O texto sapiencial distingue explicitamente a honra da velhice da mera longevidade, preservando essa tensão sem definir antecipadamente o critério positivo, apresentado no contexto seguinte.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A formulação conserva o paralelismo negativo e o ponto e vírgula que liga o versículo à continuação do pensamento.
