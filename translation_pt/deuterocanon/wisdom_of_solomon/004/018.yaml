lexical_decisions:
- source_word: ὄψονται
  choice: Verão
  rationale: O futuro de ὁράω tem aqui o sentido simples de «ver». A forma sem objeto expresso preserva a concisão e a referência implícita do grego.
- source_word: ἐξουδενήσουσιν
  choice: desprezarão
  rationale: ἐξουδενέω significa considerar sem valor, tratar como nada ou desprezar. «Desprezarão» é natural e conciso, sem explicitar no texto principal um objeto que o grego deixa implícito.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Neste contexto sapiencial, κύριος designa Deus. «O Senhor» preserva o uso teológico e a formulação tradicional sem acrescentar interpretação denominacional.
- source_word: ἐκγελάσεται
  choice: zombará deles
  rationale: ἐκγελάω denota riso dirigido contra alguém e tem força de escárnio. «Zombará deles» comunica essa dimensão derisiva com clareza em português atual.
theological_decisions:
- issue: Sentido de κύριος no contexto sapiencial deuterocanônico
  choice: o Senhor
  alternative: o senhor / o soberano
  rationale: O referente é Deus em contraste judicial com os que desprezam; «o Senhor» mantém o peso teológico do grego sem ampliar seu conteúdo.
- issue: Representação do riso divino em ἐκγελάσεται
  choice: zombará deles
  alternative: rirá deles
  rationale: A escolha preserva o caráter derisivo do verbo, sem interpretar além da imagem antropomórfica presente no texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A estrutura breve e contrastiva do grego foi mantida; não se acrescentou objeto aos dois primeiros verbos, preservando a referência implícita do original.
