base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/012.yaml
  text: For the bewitchment of wickedness darkens what is good[b][a], and the wandering of desire corrupts an innocent mind.
translation:
  language: pt
  text: Pois o fascínio da maldade obscurece o que é bom[a][b], e o vaguear do desejo corrompe uma mente inocente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o que é belo” ou “as coisas nobres”; a expressão grega pode abranger tanto a bondade moral quanto a beleza.
    reason: lexical_alternative
  - marker: b
    text: “Fascínio” também pode ser entendido como “inveja maligna”, “mau-olhado” ou “encantamento”; o termo grego designa uma influência nociva associada a essas ideias.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασκανία
  choice: fascínio
  rationale: O termo pode indicar inveja maligna, mau-olhado ou influência nociva. “Fascínio” conserva a ideia de uma força sedutora e prejudicial sem afirmar literalmente feitiçaria.
- source_word: φαυλότητος
  choice: maldade
  rationale: Expressa de modo natural e atual a baixeza moral que qualifica a influência mencionada.
- source_word: ἀμαυροῖ
  choice: obscurece
  rationale: Preserva a imagem de tornar turvo, apagar ou diminuir a percepção do bem.
- source_word: τὰ καλά
  choice: o que é bom
  rationale: Mantém o sentido moral amplo, embora o grego também possa abranger aquilo que é belo ou nobre.
- source_word: ῥεμβασμός
  choice: vaguear
  rationale: Reproduz a ideia de movimento errante, instável ou dispersivo, aqui atribuído ao desejo.
- source_word: ἐπιθυμίας
  choice: desejo
  rationale: Evita restringir indevidamente o termo à cobiça sexual; o contexto comunica seu caráter nocivo.
- source_word: μεταλλεύει
  choice: corrompe
  rationale: No contexto, indica uma transformação para pior, não uma simples mudança neutra.
- source_word: νοῦν
  choice: mente
  rationale: Equivalente amplo e natural para a faculdade de compreender e discernir moralmente.
- source_word: ἄκακον
  choice: inocente
  rationale: Comunica ausência de malícia ou dolo e se ajusta à imagem de uma mente ainda não corrompida.
theological_decisions:
- issue: Força moral e estética de τὰ καλά
  choice: o que é bom
  alternative: o que é belo; as coisas nobres
  rationale: O contexto enfatiza a corrupção moral, mas uma nota preserva a amplitude estética e ética do grego.
- issue: Força de βασκανία
  choice: fascínio
  alternative: inveja; mau-olhado; encantamento
  rationale: A escolha preserva uma influência sedutora e nociva sem decidir entre as associações antigas de inveja maligna, mau-olhado e encantamento.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe concisa. “Vaguear do desejo” mantém a personificação e a imagem de instabilidade do original; as notas preservam a ambiguidade lexical sem sobrecarregar o versículo.
