base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/004.yaml
  text: For even if it puts forth shoots for a time in its branches[a], standing insecurely it will be shaken by the wind[b], and by the force of the winds it will be uprooted.
translation:
  language: pt
  text: Pois, ainda que por algum tempo lance brotos nos ramos[a], por estar precariamente firmada, será sacudida pelo vento[b] e arrancada pela raiz pela força dos ventos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “volte a brotar” ou “germine por algum tempo”; o grego mantém a imagem de um crescimento vegetal temporário.
    reason: lexical_alternative
  - marker: b
    text: O sujeito singular permanece implícito e dá continuidade à metáfora vegetal do versículo anterior, sem identificar expressamente seu referente.
    reason: cross_reference
lexical_decisions:
- source_word: κἂν
  choice: ainda que
  rationale: A contração de καὶ ἐάν introduz uma condição concessiva; “ainda que” expressa essa força com naturalidade em português.
- source_word: ἐν κλάδοις
  choice: entre os ramos
  rationale: Mantém a imagem vegetal sem acrescentar o possessivo “seus”, ausente do grego.
- source_word: πρὸς καιρόν
  choice: por algum tempo
  rationale: Expressa a duração temporária indicada pela locução grega em linguagem clara e atual.
- source_word: ἀναθάλῃ
  choice: lance brotos
  rationale: Preserva de forma natural a imagem botânica de produzir novo crescimento.
- source_word: ἐπισφαλῶς βεβηκότα
  choice: por estar firmada de modo precário
  rationale: Reproduz tanto o estado de estar estabelecida quanto sua instabilidade; o feminino concorda com a imagem vegetal subentendida no contexto.
- source_word: σαλευθήσεται
  choice: será sacudida
  rationale: Tradução direta do futuro passivo, preservando a ação desestabilizadora do vento.
- source_word: ὑπὸ βίας ἀνέμων
  choice: pela força dos ventos
  rationale: Conserva o substantivo βία e a intensificação produzida pelos ventos.
- source_word: ἐκριζωθήσεται
  choice: será arrancada pela raiz
  rationale: Expressa com clareza o sentido literal de desenraizar e mantém a metáfora vegetal.
theological_decisions:
- issue: Referente do sujeito singular implícito que dá continuidade à metáfora vegetal do versículo anterior
  choice: Manter o sujeito implícito e usar formas verbais no feminino, retomando a imagem vegetal contextual sem nomeá-la.
  alternative: Explicitar “a planta”, “o filho” ou “a descendência”.
  rationale: O grego não fornece neste versículo um substantivo explícito para o referente. Não o identificar preserva a continuidade metafórica e evita resolver interpretativamente a ambiguidade.
translation_notes:
