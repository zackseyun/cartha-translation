  text: Having become pleasing to God[a], he was loved; and while living among sinners, he was taken away.
translation:
  language: pt
  text: Tendo-se tornado agradável a Deus, foi amado; e, enquanto vivia entre pecadores, foi retirado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi removido” ou “foi trasladado”. O grego não determina se a ênfase está na morte prematura, na retirada divina de um ambiente corrupto ou em uma tomada semelhante à de Enoque.
    reason: Leitura alternativa que preserva a amplitude semântica e a ambiguidade teológica de μετετέθη.
lexical_decisions:
- source_word: εὐάρεστος τῷ θεῷ γενόμενος
  choice: Tendo-se tornado agradável a Deus
  rationale: Preserva a sequência do particípio aoristo γενόμενος e o sentido relacional de εὐάρεστος, indicando que ele veio a ser alguém agradável a Deus.
- source_word: ἠγαπήθη
  choice: foi amado
  rationale: Reproduz diretamente o passivo grego sem acrescentar de modo explícito um agente que o texto deixa implícito.
- source_word: ζῶν
  choice: enquanto vivia
  rationale: Expressa com naturalidade a simultaneidade do particípio presente com o verbo principal.
- source_word: μεταξὺ ἁμαρτωλῶν
  choice: entre pecadores
  rationale: Tradução direta e corrente que mantém a categoria moral substantivada do grego.
- source_word: μετετέθη
  choice: foi retirado
  rationale: Comunica mudança ou remoção de uma esfera sem decidir se se trata apenas de morte prematura ou de uma ação divina extraordinária.
theological_decisions:
- issue: Natureza de μετετέθη em relação à morte ou a uma trasladação divina
  choice: foi retirado
  alternative: foi removido; foi trasladado
  rationale: O verbo grego pode indicar transferência ou remoção e pode evocar a tradição bíblica de Enoque. A formulação escolhida preserva a tensão entre morte prematura, retirada de um ambiente corrupto e uma tomada extraordinária por Deus.
