base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/014.yaml
  text: For his soul was pleasing to the Lord; therefore he hastened him out of the midst of wickedness. But the peoples, seeing and not understanding, nor taking such a thing to heart,
translation:
  language: pt
  text: Pois sua alma era agradável ao Senhor; por isso, ele se apressou em tirá-lo do meio da maldade.[a] Os povos, porém, viram sem compreender e não refletiram sobre isso,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ele o tirou depressa do meio do mal”. O verbo grego enfatiza a pressa, e πονηρία pode ser traduzida por “maldade” ou “mal” neste contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρεστὴ ... Κυρίῳ
  choice: agradável ao Senhor
  rationale: Expressa de modo natural a ideia de ser agradável ou aceitável diante do Senhor, preservando o sentido relacional do grego.
- source_word: ἡ ψυχὴ αὐτοῦ
  choice: sua alma
  rationale: Mantém o peso antropológico e teológico de ψυχή no contexto, sem reduzi-lo apenas a 'vida'.
- source_word: ἔσπευσεν
  choice: ele se apressou em tirá-lo
  rationale: Preserva a noção de pressa do verbo grego e torna explícito, de maneira natural em português, o Senhor como sujeito implícito.
- source_word: ἐκ μέσου πονηρίας
  choice: do meio da maldade
  rationale: Conserva a imagem espacial de retirada de dentro de uma esfera de corrupção moral; 'maldade' se ajusta bem ao contexto, embora 'mal' também seja possível.
- source_word: οἱ δὲ λαοί
  choice: Os povos, porém
  rationale: Preserva o plural λαοί e o contraste marcado por δέ.
- source_word: ἰδόντες καὶ μὴ νοήσαντες
  choice: viram sem compreender
  rationale: Reproduz com concisão o contraste entre ver e não entender, em linguagem portuguesa natural.
- source_word: μηδὲ θέντες ἐπὶ διανοίᾳ τὸ τοιοῦτο
  choice: e não levaram isso a sério
  rationale: Traduz idiomaticamente a imagem de pôr algo na mente, indicando consideração atenta, e retoma τὸ τοιοῦτο sem explicitar além do texto.
theological_decisions:
- issue: Sujeito implícito de ἔσπευσεν
  choice: O Senhor é retomado pelo pronome 'ele' como sujeito da ação.
  alternative: Formulação impessoal, como 'por isso, foi tirado depressa do meio da maldade'.
  rationale: O Senhor é o antecedente imediato e o contexto apresenta a retirada do justo como ação divina; o pronome explicita a conexão gramatical sem acrescentar uma tese teológica.
- issue: Sentido de πονηρία
  choice: maldade
  alternative: mal
  rationale: O termo pode designar tanto o mal em sentido amplo quanto a corrupção moral. 'Maldade' preserva essa dimensão moral, enquanto a nota registra a alternativa genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura permanece ligada ao versículo seguinte por meio da vírgula final, conforme o texto-fonte. O plural 'os povos' conserva a forma grega, ainda que 'o povo' pudesse soar mais idiomático em alguns contextos.
