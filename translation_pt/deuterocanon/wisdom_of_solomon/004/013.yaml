  text: having been perfected in a short time[a], he fulfilled long years;
translation:
  language: pt
  text: Tendo sido aperfeiçoado em pouco tempo[a], completou longos anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tendo alcançado a perfeição em pouco tempo, completou longos anos.”'
    reason: Alternativa lexical que expressa τελειωθεὶς de modo mais ativo e explícito, embora o grego empregue uma forma passiva.
lexical_decisions:
- source_word: τελειωθεὶς
  choice: tendo sido aperfeiçoado
  rationale: Preserva o particípio aoristo passivo e a ideia de ter sido levado à completude, sem definir essa perfeição como impecabilidade absoluta.
- source_word: ἐν ὀλίγῳ
  choice: em pouco tempo
  rationale: Expressa naturalmente um breve período e mantém o contraste deliberado com os “longos anos”.
- source_word: ἐπλήρωσεν
  choice: completou
  rationale: Comunica o sentido de levar ao pleno cumprimento aquilo que corresponderia a uma vida longa, sem acrescentar uma explicação ausente do grego.
- source_word: χρόνους μακρούς
  choice: longos anos
  rationale: 'Mantém a imagem temporal e o paradoxo do original: uma vida breve equivale, em completude, a longos anos.'
theological_decisions:
- issue: O sentido da linguagem de perfeição ou completude diante da morte precoce do justo
  choice: A formulação passiva “tendo sido aperfeiçoado” preserva a ideia de que ele foi levado à completude apesar do pouco tempo de vida.
  alternative: “Tendo alcançado a perfeição” pode sugerir mais diretamente uma perfeição moral absoluta; “tendo amadurecido” explicaria o sentido, mas reduziria a força e a amplitude do termo grego.
  rationale: O contexto contrapõe a brevidade da vida à sua plena realização. A tradução conserva a tensão teológica sem identificar explicitamente essa completude com impecabilidade nem reduzi-la apenas à maturidade humana.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção concisa e levemente paradoxal conserva o caráter sapiencial do original.
