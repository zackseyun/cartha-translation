  text: For gray hair is understanding for men, and an unblemished life is the age of old age.
translation:
  language: pt
  text: Pois, para os seres humanos, os cabelos brancos são prudência, e uma vida sem mancha é a idade da velhice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολιὰ
  choice: cabelos brancos
  rationale: O substantivo designa os cabelos embranquecidos como sinal de velhice e honra; a expressão é natural e clara em português.
- source_word: φρόνησις
  choice: prudência
  rationale: Preserva a ideia de discernimento prático e sensatez, sem reduzi-la apenas a conhecimento intelectual.
- source_word: ἀνθρώποις
  choice: para os seres humanos
  rationale: O grego se refere genericamente à humanidade, não especificamente ao sexo masculino.
- source_word: βίος ἀκηλίδωτος
  choice: uma vida sem mancha
  rationale: Reproduz a imagem moral de uma vida não maculada, em linguagem bíblica corrente e digna.
- source_word: ἡλικία γήρως
  choice: idade avançada
  rationale: Expressa de modo idiomático a idade própria da velhice; no paralelismo, uma vida íntegra ocupa o lugar da longevidade.
theological_decisions:
- issue: A relação metafórica entre prudência, cabelos brancos e velhice
  choice: Explicitar a comparação com “vale como” e “como”
  alternative: 'Traduzir literalmente: “a prudência é cabelos brancos... uma vida sem mancha é a idade da velhice”'
  rationale: O grego emprega predicados metafóricos sem partícula comparativa. A formulação escolhida preserva a afirmação de que caráter e discernimento constituem a verdadeira honra da velhice, evitando uma construção pouco natural em português.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo preservado. A tradução segue o sentido inclusivo de ἀνθρώποις e mantém a tensão poética entre idade cronológica e maturidade moral.
