base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/020.yaml
  text: They will come in fear[a], reasoning over their sins[b], and their lawless deeds will convict them to their face.
translation:
  language: pt
  text: Eles virão amedrontados[a], refletindo sobre os seus pecados, e os seus atos contrários à lei os convencerão de culpa face a face[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cheios de medo”, “medrosos” ou “como covardes”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “do lado oposto a eles”; isto é, os próprios atos deles os confrontarão abertamente, como que frente a frente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται
  choice: Eles virão
  rationale: O futuro de ἔρχομαι exprime a vinda ou comparecimento deles; “virão” mantém o verbo simples e natural.
- source_word: ἐν συλλογισμῷ ἁμαρτημάτων αὐτῶν
  choice: refletindo sobre os seus pecados
  rationale: συλλογισμός indica raciocínio, ponderação ou deliberação interior. “Refletindo” conserva o aspecto mental sem acrescentar explicitamente remorso ou arrependimento.
- source_word: δειλοί
  choice: amedrontados
  rationale: O adjetivo pode significar medrosos, tímidos ou covardes e funciona predicativamente, descrevendo como eles virão. “Amedrontados” é natural no contexto e evita reduzir o termo a uma acusação de caráter.
- source_word: ἐλέγξει
  choice: os convencerão de culpa
  rationale: ἐλέγχω pode significar expor, refutar ou demonstrar a culpa. No contexto moral e judicial, a formulação comunica que os próprios atos fornecem prova contra eles.
- source_word: ἐξ ἐναντίας
  choice: face a face
  rationale: A expressão retrata algo colocado diante deles, em oposição direta. “Face a face” preserva a vividez da confrontação aberta.
- source_word: τὰ ἀνομήματα αὐτῶν
  choice: os seus atos contrários à lei
  rationale: ἀνόμημα designa um ato que viola a lei ou a ordem. A tradução é transparente e mantém distinção em relação a ἁμαρτήματα, “pecados”.
theological_decisions:
- issue: Relação entre ἁμαρτήματα e ἀνομήματα
  choice: Manter a distinção como “pecados” e “atos contrários à lei”.
  alternative: Traduzir ambos por “pecados” ou usar “iniquidades” para ἀνομήματα.
  rationale: 'O grego emprega dois termos morais relacionados, mas distintos: primeiro, os pecados sobre os quais eles refletem; depois, os atos de violação da lei que os confrontam e provam sua culpa.'
- issue: Força judicial de ἐλέγξει
  choice: “convencerão de culpa”
  alternative: “acusarão”, “repreenderão” ou “condenarão”
  rationale: A escolha expressa exposição eficaz da culpa sem afirmar que os atos, por si mesmos, pronunciam a sentença final.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Atos contrários à lei” torna o sentido de ἀνομήματα acessível sem recorrer ao termo mais tradicional e menos transparente “iniquidades”. A concordância plural em “convencerão” segue o sujeito natural em português, embora o grego use verbo singular com sujeito neutro plural.
