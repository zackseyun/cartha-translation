base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/001.yaml
  text: Better is childlessness with virtue[a], for immortality is in her memory[b], because she is known both by God and by men.
translation:
  language: pt
  text: Melhor é não ter filhos e viver com virtude,[a] pois há imortalidade na memória dela, porque ela é reconhecida tanto por Deus como pelos seres humanos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome em “memória dela” refere-se mais naturalmente à virtude. Também pode ser entendido como referência à condição de não ter filhos, personificada, ou à pessoa sem filhos.
    reason: alternative_reading
lexical_decisions:
- source_word: κρείσσων
  choice: Melhor é
  rationale: Mantém o valor comparativo e a força proverbial do grego em português natural.
- source_word: ἀτεκνία
  choice: não ter filhos
  rationale: Expressa o estado de não possuir filhos sem restringi-lo à infertilidade biológica feminina.
- source_word: μετὰ ἀρετῆς
  choice: e viver com virtude
  rationale: Torna explícita de modo idiomático a associação entre a ausência de filhos e uma vida virtuosa, sem alterar o contraste ético.
- source_word: ἀθανασία
  choice: imortalidade
  rationale: É o equivalente direto e preserva um termo teologicamente importante no livro da Sabedoria.
- source_word: ἐν μνήμῃ αὐτῆς
  choice: na memória dela
  rationale: Preserva o pronome feminino e, portanto, a ambiguidade gramatical do referente, embora o contexto favoreça 'virtude'.
- source_word: γινώσκεται
  choice: é reconhecida
  rationale: Comunica conhecimento acompanhado de reconhecimento ou estima, adequado à construção com παρά e dativo.
- source_word: παρὰ θεῷ ... καὶ παρὰ ἀνθρώποις
  choice: tanto por Deus como pelos seres humanos
  rationale: Expressa as duas esferas de reconhecimento e representa corretamente o sentido genérico de ἀνθρώποις.
theological_decisions:
- issue: Referente do pronome feminino αὐτῆς e do sujeito implícito de γινώσκεται
  choice: O texto principal conserva o pronome feminino sem nomear novamente o referente; o contexto favorece 'virtude'.
  alternative: O pronome pode referir-se à condição de não ter filhos personificada ou, por implicação, à pessoa sem filhos.
  rationale: 'ἀρετή é o antecedente próximo e oferece a progressão mais coerente: a virtude possui memória imortal e é reconhecida por Deus e pelos seres humanos. A nota preserva, contudo, a ambiguidade genuína.'
- issue: Sentido de ἀνθρώποις
  choice: seres humanos
  alternative: homens; pessoas
  rationale: O substantivo grego tem aqui referência genérica à humanidade; 'seres humanos' evita uma leitura exclusivamente masculina sem alterar o alcance do original.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. A formulação evita 'esterilidade', que seria biologicamente mais estreita, e mantém a ambiguidade do pronome feminino em nota.
