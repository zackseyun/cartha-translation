  terminology: «Virtude» e «imortalidade» são escolhas diretas e consistentes para ἀρετή e ἀθανασία. «Reconhecida» é uma tradução defensável de γινώσκεται no contexto de estima/reconhecimento perante Deus e os seres humanos. O pronome feminino é mantido sem uma resolução indevida no texto principal.
