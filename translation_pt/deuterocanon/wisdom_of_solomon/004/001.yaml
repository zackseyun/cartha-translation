  source_fidelity: 'A tradução reproduz adequadamente a comparação proverbial: a condição de não ter filhos, associada à virtude, é apresentada como superior. «Imortalidade», a memória/recordação duradoura e o reconhecimento por Deus e pela humanidade correspondem ao grego. A explicitação idiomática em «e viver com virtude» não introduz uma mudança material de sentido.'
