base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/004/017.yaml
  text: For they will see the end of the wise man[a], and will not understand what the Lord planned concerning him[b], or for what purpose he made him secure.
translation:
  language: pt
  text: Pois eles verão o fim do sábio[a] e não entenderão o que o Senhor planejou a respeito dele, nem com que finalidade o colocou em segurança[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a morte do sábio”. O grego τελευτή pode significar “fim” ou “morte”; “fim” foi mantido no texto para preservar o sentido mais amplo no contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “o manteve a salvo” ou “o protegeu”. O grego não especifica a natureza dessa segurança.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: verão
  rationale: Futuro de ὁράω; a forma direta e natural preserva a percepção visual expressa pelo grego.
- source_word: τελευτὴν
  choice: o fim
  rationale: τελευτή pode significar tanto “fim” como “morte”. “Fim” conserva a amplitude lexical e a tensão entre o que os observadores veem e o propósito divino que não compreendem.
- source_word: σοφοῦ
  choice: do sábio
  rationale: O adjetivo substantivado está no masculino singular; “o sábio” corresponde à forma grega e soa natural em português.
- source_word: οὐ νοήσουσιν
  choice: não entenderão
  rationale: νοέω indica aqui a incapacidade de compreender o sentido do que é visto; “entender” é claro e corrente.
- source_word: ἐβουλεύσατο
  choice: planejou
  rationale: O verbo expressa a intenção ou o desígnio deliberado do Senhor a respeito do sábio, sem exigir uma formulação arcaica.
- source_word: περὶ αὐτοῦ
  choice: a respeito dele
  rationale: περί com genitivo significa normalmente “a respeito de” ou “acerca de”; a escolha preserva essa relação sem converter a expressão em “para ele”.
- source_word: εἰς τί
  choice: com que finalidade
  rationale: A expressão aponta para a finalidade ou o fim visado pela ação; a tradução torna essa força teleológica clara em português atual.
- source_word: ἠσφαλίσατο
  choice: o colocou em segurança
  rationale: ἀσφαλίζω comunica tornar alguém seguro ou mantê-lo protegido. A formulação conserva a nuance causativa sem especificar se a segurança é física, moral ou escatológica.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Tradução tradicional, clara e adequada de κύριος neste contexto, com o artigo preservado.
theological_decisions:
- issue: Alcance de τελευτή em relação à morte do sábio
  choice: “o fim”
  alternative: “a morte” ou “o desfecho”
  rationale: O contexto imediato contempla a morte aparente do justo, mas contrasta aquilo que os observadores veem com o propósito de Deus que desconhecem. “O fim” preserva tanto a referência possível à morte como a perspectiva mais ampla do desfecho querido por Deus.
- issue: Natureza da segurança expressa por ἠσφαλίσατο αὐτόν
  choice: “o colocou em segurança”
  alternative: “o manteve a salvo” ou “o protegeu”
  rationale: O grego não define o modo dessa segurança. A formulação ampla mantém a tensão entre a morte visível e a verdadeira segurança concedida pelo Senhor, sem reduzi-la necessariamente à proteção física.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação “e não entenderão” acompanha o καί grego, enquanto “nem” liga naturalmente a segunda coisa que os observadores deixam de compreender. Evitou-se explicar a segurança como exclusivamente física ou escatológica.
