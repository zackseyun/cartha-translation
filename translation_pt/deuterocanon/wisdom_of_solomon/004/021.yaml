  text: Then the righteous man will stand with great boldness before those who afflicted him[a].
translation:
  language: pt
  text: Então o justo ficará de pé, com grande ousadia, diante daqueles que o afligiram[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «diante do rosto daqueles que o afligiram», expressão que ressalta a presença direta e o confronto.
    reason: alternativa lexical e preservação da imagem idiomática do original
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca a sequência temporal em relação à cena anterior e soa natural em português.
- source_word: στήσεται
  choice: ficará de pé
  rationale: O futuro médio de ἵστημι tem aqui sentido intransitivo. A formulação preserva a imagem concreta de alguém que permanece de pé, sem sugerir indevidamente que outra pessoa o fez levantar-se.
- source_word: ἐν παρρησίᾳ πολλῇ
  choice: com grande ousadia
  rationale: παρρησία pode indicar ousadia, confiança ou franqueza pública. Neste contexto de vindicação e confronto, «grande ousadia» expressa uma postura destemida sem eliminar as demais nuances.
- source_word: ὁ δίκαιος
  choice: o justo
  rationale: O adjetivo substantivado está no masculino singular e designa a figura exemplar do justo. «O justo» é corrente, digno e mantém tanto a forma gramatical quanto seu possível valor representativo.
- source_word: κατὰ πρόσωπον
  choice: diante de
  rationale: A expressão, literalmente ligada ao «rosto» ou à «face», indica presença direta e confronto. «Diante de» transmite isso naturalmente em português; a imagem literal é registrada em nota.
- source_word: τῶν θλιψάντων αὐτὸν
  choice: daqueles que o afligiram
  rationale: O particípio aoristo de θλίβω abrange sofrimento causado por maus-tratos, pressão ou opressão. «Afligiram» conserva essa amplitude sem restringir o sentido a uma modalidade específica de opressão.
theological_decisions:
- issue: Masculino singular representativo em ὁ δίκαιος
  choice: o justo
  alternative: a pessoa justa
  rationale: O grego apresenta uma figura masculina singular, que pode ter força representativa. A tradução mantém essa forma sem limitar explicitamente sua aplicação nem neutralizá-la.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção conserva o tom solene de vindicação, evitando tanto literalismo pouco natural quanto explicitação doutrinária.
