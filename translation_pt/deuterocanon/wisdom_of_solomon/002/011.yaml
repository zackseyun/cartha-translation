base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/011.yaml
  text: But let our strength be the law of justice[a], for what is weak is shown to be useless.
translation:
  language: pt
  text: Mas que a nossa força seja a lei da justiça[a], pois o que é fraco se mostra inútil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «da retidão». O termo grego pode indicar tanto justiça como retidão.'
    reason: Alternativa lexical genuína para δικαιοσύνης.
lexical_decisions:
- source_word: ἔστω
  choice: que ... seja
  rationale: O imperativo de terceira pessoa de εἰμί é expresso naturalmente em português pela construção exortativa «que ... seja».
- source_word: ἰσχὺς
  choice: força
  rationale: Preserva o sentido amplo de vigor ou poder sem restringi-lo a força militar ou autoridade política.
- source_word: νόμος
  choice: lei
  rationale: Mantém a formulação incisiva pela qual os ímpios fazem da própria força o princípio normativo.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: Neste contexto social e normativo, «justiça» é a opção portuguesa mais natural; «retidão» continua sendo uma possibilidade lexical e é preservada em nota.
- source_word: τὸ ἀσθενὲς
  choice: o que é fraco
  rationale: O adjetivo neutro substantivado expressa uma máxima geral; esta formulação evita restringi-lo indevidamente a uma pessoa.
- source_word: ἄχρηστον
  choice: inútil
  rationale: Traduz de modo claro e atual aquilo que não tem utilidade ou préstimo dentro da lógica cínica dos falantes.
- source_word: ἐλέγχεται
  choice: se mostra
  rationale: Comunica que a fraqueza é apresentada ou evidenciada como inútil, em português natural, sem impor uma conotação judicial.
theological_decisions:
- issue: Sentido de δικαιοσύνη na afirmação dos ímpios
  choice: justiça
  alternative: retidão
  rationale: 'O contexto trata de uma norma de ordem e poder social, favorecendo «justiça». A nota conserva «retidão», pois δικαιοσύνη admite ambos os sentidos e a frase é deliberadamente perversa: os ímpios redefinem o justo pela força.'
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A construção proverbial e a tensão moral da fala dos ímpios foram preservadas.
