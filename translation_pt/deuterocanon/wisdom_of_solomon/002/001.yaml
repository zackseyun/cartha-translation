base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/001.yaml
  text: For they said among themselves[a], reasoning wrongly, “Our life is short and sorrowful, and there is no remedy at the end of a man's life[b], and no one has been known to return from Hades.”
translation:
  language: pt
  text: 'Pois eles disseram entre si, raciocinando de modo errado: “Nossa vida é breve e dolorosa; não há remédio quando chega o fim do ser humano, e não se conhece ninguém que tenha voltado do Hades[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que tenha saído do Hades”. A expressão grega admite uma tradução mais literal, sem explicitar plenamente a ideia de retorno.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισάμενοι οὐκ ὀρθῶς
  choice: raciocinando de modo errado
  rationale: O particípio caracteriza a maneira e a base do que disseram; a expressão conserva tanto o aspecto intelectual quanto a avaliação negativa do grego.
- source_word: ὀλίγος
  choice: breve
  rationale: Com βίος, indica a curta duração da vida; “breve” é natural e digno em português.
- source_word: λυπηρός
  choice: dolorosa
  rationale: Abrange uma vida marcada por sofrimento, aflição e tristeza, sem restringir o sentido à dor física.
- source_word: βίος
  choice: vida
  rationale: Neste contexto, refere-se à existência humana, não ao sustento nem ao modo de viver.
- source_word: ἴασις
  choice: remédio
  rationale: Transmite a imagem de cura ou restauração e soa natural no contexto da morte como fim aparentemente irremediável.
- source_word: ἐν τελευτῇ ἀνθρώπου
  choice: quando chega o fim do ser humano
  rationale: Expressa com clareza o fim ou morte de uma pessoa, preservando a referência genérica do singular grego sem sugerir exclusividade masculina.
- source_word: ἐγνώσθη
  choice: não se conhece
  rationale: A construção impessoal reproduz o passivo grego e comunica que a experiência humana não registra tal pessoa.
- source_word: ὁ ἀναλύσας
  choice: que tenha voltado
  rationale: No contexto de movimento para fora do Hades, “voltado” comunica de modo idiomático a ideia contextual, enquanto a nota registra a formulação mais literal e ambígua.
- source_word: ἐξ ᾅδου
  choice: do Hades
  rationale: Mantém o termo explícito do grego para o domínio dos mortos, sem reduzi-lo simplesmente à sepultura nem identificá-lo com outro conceito teológico.
theological_decisions:
- issue: Referência humana genérica em ἀνθρώπου
  choice: do ser humano
  alternative: de um homem
  rationale: O substantivo masculino singular tem alcance genérico no contexto; “ser humano” conserva esse alcance de forma inequívoca em português.
- issue: Sentido de ᾅδης
  choice: Hades
  alternative: mundo dos mortos
  rationale: A transliteração preserva o referente conceitual do texto grego e evita estreitá-lo a “sepultura” ou associá-lo automaticamente ao lugar de punição final.
- issue: Força contextual de ὁ ἀναλύσας ἐξ ᾅδου
  choice: que tenha voltado do Hades
  alternative: que tenha saído do Hades
  rationale: “Voltado” expressa a inferência contextual de retorno ao mundo dos vivos, mas a nota preserva a formulação menos interpretativa.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A pontuação destaca a progressão do raciocínio, e “Hades” preserva o vocabulário conceitual da fonte.
