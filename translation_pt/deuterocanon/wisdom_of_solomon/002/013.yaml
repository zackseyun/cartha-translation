  text: He claims to have knowledge of God[a], and calls himself a child of the Lord;
translation:
  language: pt
  text: Afirma ter conhecimento de Deus e chama a si mesmo filho do Senhor[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo do Senhor”. A palavra grega também pode significar “criança”, conforme o contexto.
    reason: Preservar a amplitude semântica de παῖς sem tornar a frase principal pouco natural em português.
lexical_decisions:
- source_word: ἐπαγγέλλεται
  choice: afirma
  rationale: No contexto, indica uma declaração feita pelo justo segundo a acusação dos ímpios. “Afirma” expressa a alegação sem decidir se ela é verdadeira ou falsa.
- source_word: γνῶσιν ἔχειν θεοῦ
  choice: ter conhecimento de Deus
  rationale: Preserva a construção nominal do grego, literalmente “ter conhecimento de Deus”, em português claro e natural.
- source_word: θεοῦ
  choice: Deus
  rationale: O genitivo sem artigo é traduzido naturalmente como “de Deus”, sem introduzir distinções ausentes do texto.
- source_word: παῖδα
  choice: filho
  rationale: Neste contexto, o sentido de relação filial com o Senhor é o mais natural. “Filho” também respeita o singular masculino do grego; a amplitude semântica de παῖς é registrada em nota.
- source_word: Κυρίου
  choice: Senhor
  rationale: Segue a tradução habitual de κύριος como “Senhor”; a construção portuguesa pede naturalmente “do Senhor”.
- source_word: ἑαυτὸν ὀνομάζει
  choice: chama a si mesmo
  rationale: Expressa de modo idiomático a autodesignação indicada pela construção reflexiva grega.
theological_decisions:
- issue: Tradução de παῖδα Κυρίου, que pode evocar relação filial ou serviço
  choice: filho do Senhor
  alternative: servo do Senhor; criança do Senhor
  rationale: O contexto imediato destaca a relação especial que o justo afirma ter com Deus, favorecendo o sentido filial. Como παῖς também pode significar “servo” ou “criança”, essa ambiguidade lexical é preservada em nota.
- issue: Tradução de κύριος
  choice: Senhor
  alternative: senhor
  rationale: “Senhor” preserva o título divino tradicional e distingue naturalmente Κυρίου do θεοῦ precedente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação é concisa e mantém o paralelismo das duas afirmações gregas.
