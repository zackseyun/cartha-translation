base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/024.yaml
  text: But through the devil’s envy death entered into the world[a], and those who belong to his portion test it.
translation:
  language: pt
  text: Mas, pela inveja do diabo, a morte entrou no mundo, e os que são da parte dele a experimentam[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “os que são da parte dele a põem à prova” ou “a provam”. A expressão grega é difícil; o pronome pode retomar “a morte”, e o sentido provável é que os que estão do lado do diabo experimentam o poder dela.'
    reason: Preserva a força lexical de πειράζουσιν e a dificuldade da construção grega, sem impor ao texto principal uma formulação enganosa ou pouco natural em português.
lexical_decisions:
- source_word: φθόνῳ
  choice: pela inveja
  rationale: O dativo expressa causa ou meio; “pela inveja” mantém essa relação de modo natural em português.
- source_word: διαβόλου
  choice: do diabo
  rationale: Neste contexto sapiencial judaico-grego, o termo designa a figura pessoal do mal, e não apenas um caluniador ou acusador genérico.
- source_word: θάνατος
  choice: a morte
  rationale: Correspondência lexical direta, sem restringir nem ampliar o sentido do substantivo grego.
- source_word: εἰσῆλθεν εἰς τὸν κόσμον
  choice: entrou no mundo
  rationale: Preserva a imagem de movimento do grego em português corrente e digno.
- source_word: πειράζουσιν
  choice: experimentam
  rationale: Embora o verbo normalmente possa significar “pôr à prova”, “provar” ou “tentar”, tendo a morte como objeto o sentido contextual provável é experimentar sua realidade ou poder. A nota conserva a formulação mais literal.
- source_word: αὐτὸν
  choice: a
  rationale: O pronome remete mais naturalmente a θάνατος, masculino em grego, mas feminino em português; por isso, a retomada portuguesa é “a”.
- source_word: οἱ τῆς ἐκείνου μερίδος ὄντες
  choice: os que pertencem ao quinhão dele
  rationale: “Quinhão” conserva a ideia de parte, porção ou lote expressa por μερίς e indica pertencimento ao domínio ou lado do diabo, sem transformar a expressão numa explicação doutrinária.
theological_decisions:
- issue: Identidade de διάβολος
  choice: figura pessoal do mal, traduzida por “o diabo”
  alternative: um caluniador ou acusador genérico
  rationale: A entrada da morte no mundo é atribuída à inveja de διάβολος; no contexto literário e teológico da Sabedoria, a leitura pessoal tem maior força contextual e lexical.
- issue: Sentido de πειράζουσιν αὐτόν
  choice: os que pertencem ao quinhão do diabo experimentam a morte
  alternative: eles a põem à prova; ou, tomando o referente como pessoal, põem-no à prova
  rationale: O verbo grego preserva a noção de provar ou testar, mas essa formulação é difícil quando a morte é o objeto. O texto principal comunica o sentido contextual provável, enquanto a nota registra a dificuldade e a alternativa literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Quinhão” é deliberadamente mais formal para conservar a imagem de μερίς; “experimentam” oferece clareza contextual, e a nota mantém a ambiguidade lexical do verbo grego.
