translation:
  language: pt
  text: Quando isso se apagar[a], o corpo se tornará em cinzas, e o espírito[b] se dissipará como ar rarefeito.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, quando se extinguir aquilo que, no contexto anterior, é comparado a uma centelha.
    reason: contextual_clarification
  - marker: b
    text: Ou “o sopro” ou “o alento vital”. O grego πνεῦμα admite esses sentidos aqui.
    reason: lexical_alternative
  - marker: c
    text: Também se pode traduzir “como ar leve” ou “como ar sem consistência”; a expressão indica algo insubstancial e que logo se dispersa.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ σβεσθέντος
  choice: Quando isso se apagar
  rationale: A construção absoluta indica que algo mencionado no contexto anterior se extingue. “Isso” conserva a referência pouco explícita do versículo sem impor aqui um antecedente específico, e “se apagar” mantém a imagem de fogo ou centelha.
- source_word: τέφρα ἀποβήσεται
  choice: se tornará cinza
  rationale: ἀποβαίνω tem aqui o sentido de resultar em ou tornar-se; τέφρα é “cinza”. A formulação é direta e natural em português.
- source_word: τὸ σῶμα
  choice: o corpo
  rationale: Reproduz o substantivo singular definido sem acrescentar “nosso” nem interpretar o termo como “cadáver”.
- source_word: τὸ πνεῦμα
  choice: o espírito
  rationale: πνεῦμα pode significar espírito, sopro ou alento vital. “Espírito” preserva o contraste explícito com o corpo, enquanto a nota registra a ambiguidade lexical.
- source_word: διαχυθήσεται
  choice: se dissipará
  rationale: O futuro passivo de διαχέω descreve algo que se espalha ou difunde; “se dissipará” corresponde naturalmente à imagem do ar.
- source_word: ὡς χαῦνος ἀήρ
  choice: como ar tênue
  rationale: χαῦνος sugere leveza, frouxidão ou falta de substância. “Ar tênue” comunica algo rarefeito e facilmente dispersável sem recorrer à expressão idiomática “virar fumaça”.
theological_decisions:
- issue: Sentido antropológico de πνεῦμα no discurso dos ímpios sobre a morte
  choice: o espírito
  alternative: o sopro; o alento vital
  rationale: A tradução mantém o contraste entre corpo e πνεῦμα sem transformar a fala dos personagens em uma afirmação doutrinária sobre a alma. A imagem da dissipação expressa a perspectiva cética dos próprios falantes.
- issue: Referente de οὗ σβεσθέντος
  choice: isso
  alternative: ele; a centelha
  rationale: O grego depende do contexto precedente, mas o referente não é nomeado neste versículo. O demonstrativo neutro em português evita resolver silenciosamente essa dependência contextual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe concisa acompanha o paralelismo grego. As notas preservam tanto a referência contextual implícita quanto a ambiguidade de πνεῦμα e χαῦνος.
