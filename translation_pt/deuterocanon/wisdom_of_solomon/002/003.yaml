  naturalness: «O corpo se tornará cinza» pode sugerir, em português atual, que o corpo ficará da cor cinza; além disso, o singular é menos idiomático nesta imagem funerária. «Se tornará em cinzas» comunica inequivocamente o resultado material e mantém o sentido de τέφρα ἀποβήσεται. «Ar rarefeito» é mais corrente e claro que «ar tênue» para a imagem de algo pouco consistente e dispersável.
