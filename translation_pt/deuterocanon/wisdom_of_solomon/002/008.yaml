translation:
  language: pt
  text: Coroemo-nos com botões de rosa antes que murchem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Enfeitemo-nos com flores de rosa antes que percam o viço». O grego combina «rosas» com um termo que pode designar botões ou cálices florais, evocando botões ou flores frescas de rosa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στεψώμεθα
  choice: Coroemo-nos
  rationale: O subjuntivo aoristo tem sentido exortativo. A escolha preserva a imagem de adornar-se festivamente com uma coroa ou grinalda e é natural em português.
- source_word: ῥόδων κάλυξιν
  choice: com botões de rosa
  rationale: A combinação do genitivo plural de ῥόδον, «rosa», com κάλυξιν, termo que pode indicar botão ou cálice floral, aponta para botões ou flores ainda frescas de rosa. «Botões de rosa» comunica a imagem sem recorrer ao tecnicismo «cálices».
- source_word: πρὶν ἢ
  choice: antes que
  rationale: Expressa com clareza a relação temporal e pede naturalmente o subjuntivo em português.
- source_word: μαρανθῆναι
  choice: murchem
  rationale: O verbo μαραίνω significa murchar ou perder o viço. «Murchem» preserva de modo concreto a imagem vegetal e concorda com «botões».
