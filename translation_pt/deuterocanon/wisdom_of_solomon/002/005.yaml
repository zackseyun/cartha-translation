base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/005.yaml
  text: For our life is the passing of a shadow, and there is no turning back from our end, because it has been sealed, and no one returns.
translation:
  language: pt
  text: Pois nossa vida é a passagem de uma sombra, e não há retorno da nossa morte[a], porque foi selado, e ninguém volta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «do nosso fim».'
    reason: τελευτή pode significar «fim» e, neste contexto, «morte».
lexical_decisions:
- source_word: σκιᾶς ... πάροδος
  choice: a passagem de uma sombra
  rationale: Preserva diretamente a metáfora grega da vida como a breve passagem de uma sombra, sem reduzi-la apenas a uma comparação genérica.
- source_word: ἀναποδισμός
  choice: retorno
  rationale: Expressa a ideia de volta ou reversão; a construção com «após o nosso fim» torna a frase natural em português.
- source_word: τελευτῆς
  choice: fim
  rationale: Mantém o sentido básico e a sobriedade do grego; no contexto, refere-se ao fim da vida e pode também ser entendido como morte.
- source_word: κατεσφραγίσθη
  choice: foi selado
  rationale: Conserva a metáfora do selo e sua ideia contextual de algo encerrado ou irrevogavelmente determinado.
- source_word: ἀναστρέφει
  choice: retorna
  rationale: Neste contexto, o verbo indica voltar da condição mencionada, isto é, retornar depois do fim.
theological_decisions:
- issue: Irreversibilidade do fim da vida
  choice: Manter a afirmação categórica e a metáfora de que o fim foi selado.
  alternative: Explicitar que se trata de uma afirmação doutrinária universal sobre o estado dos mortos.
  rationale: O versículo apresenta a fala e o raciocínio das personagens no contexto literário; a tradução não deve acrescentar uma sistematização teológica ausente do grego.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do grego. «Retorno após o nosso fim» evita a formulação pouco natural «retorno do nosso fim», sem eliminar a tensão entre fim e morte.
