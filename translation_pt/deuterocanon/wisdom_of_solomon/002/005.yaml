  naturalness: «A passagem de uma sombra» é compreensível e conserva a imagem; «não há retorno da nossa morte» transmite o sentido de modo mais idiomático e direto do que «não há retorno após o nosso fim». «Ninguém volta» é natural e reproduz a conclusão enfática.
