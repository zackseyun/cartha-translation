  text: Let us condemn him to a shameful death[a], for there will be an examination of him according to his words.
translation:
  language: pt
  text: Condenemo-lo a uma morte vergonhosa, pois haverá uma visitação a respeito dele, conforme as suas palavras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «haverá cuidado para com ele», «ele será vindicado» ou «o que acontecer com ele porá à prova as suas palavras». O termo grego pode indicar, de modo amplo, atenção, inspeção, visitação ou intervenção divina.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θανάτῳ ἀσχήμονι
  choice: a uma morte vergonhosa
  rationale: O dativo indica a pena à qual ele é condenado; «morte vergonhosa» comunica de modo natural a desonra expressa pelo adjetivo grego.
- source_word: καταδικάσωμεν
  choice: Condenemo-lo
  rationale: Preserva o subjuntivo exortativo na primeira pessoa do plural e o sentido judicial do verbo.
- source_word: ἐπισκοπή
  choice: intervenção
  rationale: O substantivo pode indicar inspeção, atenção, cuidado ou visitação interventora. «Intervenção» é corrente em português e mantém aberta a natureza da ação esperada.
- source_word: ἐκ λόγων αὐτοῦ
  choice: segundo as palavras dele
  rationale: Mantém a ligação explícita entre a expectativa de intervenção e aquilo que o justo declarou, sem decidir se as palavras são fundamento, critério ou previsão.
theological_decisions:
- issue: Sentido de ἐπισκοπή em relação às declarações do justo sobre Deus
  choice: intervenção em seu favor
  alternative: visitação, cuidado, vindicação ou exame
  rationale: O contexto sugere que os adversários põem à prova a alegação de que Deus atenderá o justo. A tradução não especifica se a intervenção será cuidado, resgate ou vindicação; a nota registra a amplitude do termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal formal em «Condenemo-lo». A ordem da segunda oração foi ajustada para evitar que «segundo as palavras dele» pareça modificar apenas a natureza da intervenção, embora a ambiguidade semântica seja preservada na nota.
