base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/006.yaml
  text: Come then[a], let us enjoy the good things that exist, and let us make use of creation eagerly, as in youth[c][b];
translation:
  language: pt
  text: Vamos, pois, desfrutar dos bens que existem[a] e fazer uso da criação[b] com avidez, como na juventude[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dos bens presentes» ou «dos bens ao nosso alcance». O grego diz literalmente «dos bens que existem».
    reason: lexical_alternative
  - marker: b
    text: Ou «o mundo criado».
    reason: lexical_alternative
  - marker: c
    text: A expressão «como na juventude» provavelmente indica o vigor ou o abandono associados à juventude.
    reason: cultural_note
lexical_decisions:
- source_word: δεῦτε οὖν
  choice: Vamos, pois
  rationale: Expressa de modo natural em português a convocação de δεῦτε e a força continuativa ou inferencial de οὖν, sem a formalidade excessiva de “portanto”.
- source_word: ἀπολαύσωμεν
  choice: desfrutar
  rationale: Comunica o sentido de usufruir ou ter prazer e conserva o impulso hedonista da exortação no contexto.
- source_word: τῶν ὄντων ἀγαθῶν
  choice: dos bens existentes
  rationale: Mantém de perto a formulação grega, literalmente “os bens que existem”, sem decidir se a expressão enfatiza existência ou disponibilidade presente.
- source_word: χρησώμεθα
  choice: usar
  rationale: Preserva a noção ampla de fazer uso e evita fundi-la com o sentido de prazer já expresso por ἀπολαύσωμεν.
- source_word: τῇ κτίσει
  choice: a criação
  rationale: κτίσις designa aqui, de modo abrangente, aquilo que foi criado ou a ordem criada; “criação” conserva essa amplitude.
- source_word: σπουδαίως
  choice: com avidez
  rationale: No contexto de busca urgente por prazer, transmite intensidade e empenho sem a possível conotação moralmente positiva de “zelosamente”.
- source_word: ὡς νεότητι
  choice: como na juventude
  rationale: Conserva a comparação condensada do grego e não acrescenta o possessivo “nossa”, ausente no texto.
theological_decisions:
- issue: Sentido de τῶν ὄντων ἀγαθῶν
  choice: dos bens existentes
  alternative: dos bens presentes; dos bens ao nosso alcance
  rationale: A expressão admite tanto uma leitura mais literal, relativa ao que existe, como uma referência contextual aos bens disponíveis nesta vida. A tradução preserva essa tensão.
- issue: Alcance de τῇ κτίσει
  choice: a criação
  alternative: o mundo criado; aquilo que foi criado
  rationale: A formulação ampla evita limitar o referente a recursos materiais específicos ou a uma única criatura.
- issue: Sentido da comparação ὡς νεότητι
  choice: como na juventude
  alternative: como jovens; com o vigor da juventude
  rationale: O grego é conciso e pode sugerir vigor, intensidade ou abandono juvenil. A tradução mantém a imagem sem explicitar apenas uma dessas nuances.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Vamos, pois” funciona como convocação inclusiva; “com avidez” reflete a intensidade da fala hedonista sem inserir uma avaliação teológica alheia ao verso.
