base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/018.yaml
  text: For if the righteous man is God's son, he will help him and rescue him from the hand of those who oppose him.
translation:
  language: pt
  text: Pois, se o justo é filho de Deus[a], Deus o ajudará e o livrará da mão dos que se opõem a ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um filho de Deus” ou “o Filho de Deus”. A construção grega permite mais de uma forma de determinação; o texto principal evita impor um título cristológico posterior, mas preserva a afirmação de filiação.'
    reason: Leitura alternativa decorrente da construção predicativa grega sem artigo.
lexical_decisions:
- source_word: ὁ δίκαιος
  choice: o justo
  rationale: O adjetivo com artigo é substantivado e designa, no contexto, um indivíduo masculino caracterizado por sua justiça; “o justo” é natural e tradicional em português.
- source_word: υἱὸς θεοῦ
  choice: filho de Deus
  rationale: A expressão predicativa sem artigo afirma a relação filial sem exigir que seja entendida como título. A ausência de maiúscula evita impor uma leitura cristológica posterior, enquanto a nota preserva as possibilidades gramaticais.
- source_word: ἀντιλήμψεται αὐτοῦ
  choice: Deus o ajudará
  rationale: O verbo exprime tomar alguém sob amparo, prestar auxílio. O sujeito implícito é explicitado como “Deus” para eliminar a ambiguidade pronominal natural em português.
- source_word: ῥύσεται αὐτόν
  choice: o livrará
  rationale: O verbo indica libertar ou resgatar de perigo. “Livrará” conserva o tom bíblico sem acrescentar necessariamente um sentido soteriológico mais amplo.
- source_word: ἐκ χειρὸς
  choice: da mão
  rationale: Mantém a imagem idiomática grega de estar sob o poder ou controle de alguém, ainda compreensível em português.
- source_word: ἀνθεστηκότων
  choice: dos que se opõem a ele
  rationale: O particípio designa aqueles que se colocaram contra o justo. A formulação comunica oposição ativa sem restringi-la a um âmbito militar ou judicial.
theological_decisions:
- issue: Se υἱὸς θεοῦ deve ser apresentado como título cristológico
  choice: “filho de Deus”, sem maiúscula titular
  alternative: “o Filho de Deus” ou “um filho de Deus”
  rationale: A construção grega admite mais de uma determinação em português e não exige, por si só, um título cristológico. A tradução principal preserva a afirmação filial no contexto imediato, e a nota registra a ambiguidade relevante.
- issue: Identidade do sujeito dos verbos ἀντιλήμψεται e ῥύσεται
  choice: Explicitar “Deus” como sujeito
  alternative: Manter apenas “ele”, formalmente possível, mas ambíguo em português
  rationale: Na lógica da frase, é Deus quem ajuda e livra aquele que é seu filho. Explicitar o referente torna a relação sintática clara sem acrescentar conteúdo ao texto.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira e alcance internacional. Conserva-se a imagem bíblica “da mão”, enquanto “Deus” é explicitado como sujeito para evitar ambiguidade pronominal.
