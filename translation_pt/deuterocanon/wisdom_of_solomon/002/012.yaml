base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/012.yaml
  text: But let us lie in wait for the righteous man, because he is troublesome to us and opposes our deeds, and reproaches us for sins against the law, and charges us with sins against our training.
translation:
  language: pt
  text: Mas armemos uma emboscada contra o justo[a], pois ele nos incomoda, opõe-se às nossas obras, repreende-nos pelos pecados contra a Lei e acusa-nos de pecados contra a nossa formação[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o homem justo”. O singular grego pode designar uma pessoa justa representativa.
    reason: lexical_alternative
  - marker: b
    text: Ou “pecados contra a nossa educação” ou “contra a nossa disciplina”. A palavra grega pode indicar formação, educação, instrução ou disciplina.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεδρεύσωμεν
  choice: armemos uma emboscada contra
  rationale: O subjuntivo exortativo pede uma exortação na primeira pessoa do plural. A expressão comunica com naturalidade a ideia de espreitar ou preparar uma cilada sem definir o tipo de ataque.
- source_word: τὸν δίκαιον
  choice: o justo
  rationale: Mantém o singular masculino substantivado do grego e permite tanto a referência a um indivíduo quanto o sentido representativo.
- source_word: δύσχρηστος
  choice: nos incomoda
  rationale: No contexto, descreve alguém incômodo ou difícil de suportar, não alguém simplesmente inútil. A formulação é clara e idiomática em português.
- source_word: ἐναντιοῦται
  choice: opõe-se
  rationale: Expressa de modo direto a resistência ativa do justo à conduta dos falantes.
- source_word: τοῖς ἔργοις ἡμῶν
  choice: às nossas obras
  rationale: Preserva a referência moralmente carregada aos atos praticados, em linguagem bíblica ainda corrente e compreensível.
- source_word: ὀνειδίζει
  choice: repreende-nos
  rationale: Transmite censura verbal sem introduzir necessariamente o tom de zombaria que outras opções poderiam sugerir.
- source_word: ἁμαρτήματα νόμου
  choice: pecados contra a Lei
  rationale: 'Interpreta o genitivo em sentido relacional ou objetivo: pecados cometidos contra a Lei. A inicial maiúscula sinaliza a Lei como norma reconhecida no contexto, sem especificar além do grego.'
- source_word: ἐπιφημίζει
  choice: acusa-nos de
  rationale: Reproduz o sentido de atribuir formalmente uma falta, preservando o tom acusatório do verbo.
- source_word: ἁμαρτήματα παιδείας ἡμῶν
  choice: pecados contra a formação que recebemos
  rationale: παιδεία abrange educação, formação, criação e disciplina. A expressão escolhida torna claro o aspecto formativo e moral sem reduzi-lo ao ensino escolar nem resolver excessivamente a amplitude do termo.
theological_decisions:
- issue: O alcance do singular representativo τὸν δίκαιον
  choice: o justo
  alternative: o homem justo
  rationale: A forma substantivada é natural em português, preserva o masculino singular e mantém aberta a possibilidade de uma figura representativa, sem impor uma identificação cristológica específica.
- issue: A natureza da παιδεία
  choice: a formação que recebemos
  alternative: nossa educação / nossa disciplina
  rationale: O contexto é de censura ética. A escolha abrange criação, instrução e disciplina moral, preservando a tensão lexical sem restringir o termo a escolaridade ou castigo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva o paralelismo das acusações e a ambiguidade relevante de παιδεία, esclarecida em nota.
