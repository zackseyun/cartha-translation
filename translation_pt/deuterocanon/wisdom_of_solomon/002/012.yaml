    rationale: 'A nota apresenta «contra nossa educação» e «contra nossa disciplina», mas o texto usa «a formação que recebemos». Ao remover o acréscimo, a nota pode expor alternativas diretamente paralelas: «nossa educação» e «nossa disciplina».'
