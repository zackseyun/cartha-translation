base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/009.yaml
  text: Let none of us be without a share in our revelry; everywhere let us leave tokens of our merriment[a], because this is our portion, and this our lot.
translation:
  language: pt
  text: Que nenhum de nós fique sem participar da nossa folia[a]; por toda parte, deixemos sinais da nossa alegria, pois esta é a nossa porção e este é o nosso quinhão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nosso orgulho” ou “nossa arrogância”. O termo grego pode indicar altivez, embora neste contexto pareça referir-se à exuberância festiva e desenfreada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμοιρος
  choice: sem participar
  rationale: Expressa com naturalidade a ideia de não ter parte ou participação, mantendo a relação com a linguagem de porção e quinhão no fim do versículo.
- source_word: ἀγερωχίας
  choice: folia
  rationale: No contexto do discurso hedonista, indica uma exuberância festiva e desenfreada. “Folia” é natural e conserva uma tonalidade moralmente ambígua; os sentidos de orgulho e arrogância são registrados em nota.
- source_word: πανταχῇ
  choice: por toda parte
  rationale: Equivalente corrente e abrangente do advérbio grego de lugar.
- source_word: καταλίπωμεν
  choice: deixemos
  rationale: Reproduz diretamente o subjuntivo exortativo e a ação deliberada de deixar vestígios.
- source_word: σύμβολα
  choice: sinais
  rationale: Designa marcas reconhecíveis ou vestígios da celebração; “sinais” é claro e natural em português.
- source_word: εὐφροσύνης
  choice: alegria
  rationale: Transmite a satisfação festiva do contexto sem recorrer a vocabulário excessivamente coloquial.
- source_word: μερὶς
  choice: porção
  rationale: Preserva a imagem de uma parte atribuída a alguém e o paralelismo com κλῆρος.
- source_word: κλῆρος
  choice: quinhão
  rationale: Comunica uma parte atribuída por sorte ou destino e mantém o paralelismo sem restringir o sentido a uma herança jurídica.
theological_decisions:
- issue: Sentido de ἀγερωχίας no discurso hedonista
  choice: nossa folia
  alternative: nosso orgulho; nossa arrogância; nossa exaltação
  rationale: O contexto imediato apresenta os ímpios incentivando o aproveitamento desenfreado dos prazeres antes da morte, o que favorece o sentido de exuberância festiva. Como o termo grego também pode indicar altivez ou arrogância, essa ambiguidade significativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Folia” evita a coloquialidade mais forte de “farra”, enquanto “porção” e “quinhão” preservam o paralelismo distributivo do grego.
