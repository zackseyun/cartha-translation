base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/010.yaml
  text: Let us oppress the righteous poor man[a]; let us not spare the widow[b], nor show regard for the gray hairs of an old man advanced in years.
translation:
  language: pt
  text: Oprimamos o pobre justo[a]; não poupemos a viúva, nem respeitemos as cãs de um homem de idade muito avançada.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como «o justo pobre»; no grego, «pobre» e «justo» qualificam estreitamente a mesma pessoa.
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: «nem respeitemos as cãs de muitos anos de um homem idoso».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταδυναστεύσωμεν
  choice: Oprimamos
  rationale: O verbo expressa o exercício cruel ou abusivo de poder sobre alguém; «oprimamos» conserva a força coercitiva e a forma exortativa do grego.
- source_word: πένητα δίκαιον
  choice: o pobre justo
  rationale: Os dois adjetivos descrevem um único indivíduo vulnerável e moralmente reto. A formulação é concisa e mantém ambos estreitamente ligados.
- source_word: μὴ φεισώμεθα χήρας
  choice: não poupemos a viúva
  rationale: «Poupar» reproduz de modo natural o sentido de abster-se de causar dano. O singular definido apresenta a viúva como representante de uma classe vulnerável.
- source_word: μηδὲ ... ἐντραπῶμεν
  choice: nem respeitemos
  rationale: Neste contexto, o verbo indica consideração, respeito ou deferência diante do sinal visível da velhice, e não simples vergonha interior.
- source_word: πρεσβύτου
  choice: um ancião
  rationale: O termo se refere aqui à idade, não a um cargo. «Ancião» preserva o tom digno do texto e é claro em português.
- source_word: πολιάς πολυχρονίους
  choice: os cabelos brancos ... de idade avançada
  rationale: A tradução preserva a imagem concreta dos cabelos brancos e a intensificação da idade expressa por πολυχρονίους, ainda que a repetição seja mais marcada que no português corrente.
theological_decisions:
- issue: Sentido de δίκαιον no contraste entre os ímpios e sua vítima em Sabedoria 2
  choice: justo
  alternative: reto
  rationale: «Justo» preserva a dimensão moral e religiosa do termo no contexto, sem restringi-lo ao âmbito jurídico. «Reto» também seria possível, mas enfraqueceria a ligação lexical com o campo de justiça.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A cadência exortativa dos três verbos no plural foi preservada. «Ancião» foi preferido a «velho» para evitar uma conotação depreciativa ausente do grego.
