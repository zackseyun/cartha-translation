  text: For God created man for incorruptibility[b][a], and made him in the image of his own nature.
translation:
  language: pt
  text: Pois Deus criou o ser humano para a incorruptibilidade[a] e fez dele uma imagem de sua própria natureza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a imortalidade” ou “para a imperecibilidade”. O termo grego inclui a ideia de não estar sujeito à deterioração, à corrupção ou à morte.
    reason: lexical_alternative
  - marker: b
    text: Ou “de seu próprio ser” ou “daquilo que lhe é próprio”. A expressão grega é incomum e admite mais de uma tradução próxima.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκτισε
  choice: criou
  rationale: Expressa naturalmente o ato de trazer à existência e mantém a linguagem da criação.
- source_word: τὸν ἄνθρωπον
  choice: o ser humano
  rationale: O singular grego tem sentido representativo e se refere à humanidade; esta formulação preserva o singular sem restringir a referência ao sexo masculino.
- source_word: ἐπʼ ἀφθαρσίᾳ
  choice: para a incorruptibilidade
  rationale: Mantém a amplitude de ἀφθαρσία, que indica não estar sujeito à corrupção, à deterioração ou à morte, sem reduzi-la apenas à existência interminável.
- source_word: εἰκόνα
  choice: como imagem
  rationale: Preserva a ressonância da linguagem da criação e representa a construção predicativa de modo idiomático em português.
- source_word: τῆς ἰδίας ἰδιότητος
  choice: de sua própria natureza
  rationale: A expressão grega incomum aponta para aquilo que é próprio ou característico de Deus; 'natureza' é clara e digna, enquanto a nota preserva alternativas plausíveis.
- source_word: ἐποίησεν αὐτόν
  choice: o fez
  rationale: Tradução direta e natural de ποιέω, mantendo o paralelismo com 'criou'.
theological_decisions:
- issue: Alcance antropológico de τὸν ἄνθρωπον
  choice: o ser humano, em singular representativo
  alternative: o homem; a humanidade
  rationale: O enunciado diz respeito à humanidade em termos de criação. 'O ser humano' conserva o singular genérico e comunica esse alcance com clareza atual.
- issue: Sentido de ἀφθαρσία
  choice: incorruptibilidade
  alternative: imortalidade; imperecibilidade
  rationale: A escolha preserva a noção mais ampla de liberdade da corrupção, deterioração e morte, sem impor uma formulação filosófica específica sobre a imortalidade da alma.
- issue: Sentido de τῆς ἰδίας ἰδιότητος
  choice: de sua própria natureza
  alternative: de seu próprio ser; daquilo que lhe é próprio
  rationale: A frase admite mais de uma tradução próxima. A opção principal é legível e comunica correspondência com algo próprio de Deus, enquanto a nota registra a dificuldade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a concisão do grego, preserva a alusão à criação e sinaliza em notas as duas ambiguidades lexicais relevantes.
