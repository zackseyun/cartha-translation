  text: Eles pensaram assim e se enganaram, pois a própria maldade os cegou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα ἐλογίσαντο
  choice: Eles pensaram assim
  rationale: Retoma de modo natural, em português, os raciocínios anteriores dos ímpios; “assim” expressa o vínculo discursivo do demonstrativo plural sem tornar a frase pesada.
- source_word: ἐπλανήθησαν
  choice: se desviaram
  rationale: O aoristo passivo pode ter sentido intransitivo ou médio-passivo, indicando que caíram no erro. “Se desviaram” preserva essa ambiguidade melhor do que explicitar um agente que os teria enganado.
- source_word: ἀπετύφλωσεν
  choice: cegou
  rationale: Expressa de forma direta a perda de percepção moral causada pela maldade.
- source_word: ἡ κακία αὐτῶν
  choice: a própria maldade
  rationale: “Maldade” comunica a corrupção moral de κακία; “própria” deixa claro, de modo idiomático, que a maldade era deles, sem atribuir a cegueira a uma causa externa.
theological_decisions:
- issue: Causa moral da cegueira
  choice: a própria maldade os cegou
  alternative: a maldade deles os cegou
  rationale: Mantém a afirmação explícita de que a corrupção moral deles produziu a cegueira, sem introduzir endurecimento divino nem um agente externo.
- issue: Nuance de ἐπλανήθησαν
  choice: se desviaram
  alternative: foram enganados
  rationale: A forma passiva admite a ideia de cair em erro, mas o texto não nomeia um enganador. A escolha evita resolver indevidamente essa abertura em favor de causação externa.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. A formulação é concisa e mantém o paralelismo causal do grego.
