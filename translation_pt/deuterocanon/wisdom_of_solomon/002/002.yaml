  text: because we came into being by mere chance, and after this we will be as though we had not existed; because the breath in our nostrils is smoke, and reason is a spark in the beating of our heart,
translation:
  language: pt
  text: porque viemos à existência por mero acaso e, depois disso, seremos como se nunca tivéssemos existido; pois o sopro em nossas narinas é fumaça, e a razão é uma centelha no pulsar do nosso coração,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοσχεδίως
  choice: por mero acaso
  rationale: O advérbio expressa, na fala dos ímpios, uma origem espontânea, improvisada ou casual; esta formulação comunica com clareza a ideia contextual sem endossá-la como afirmação do narrador.
- source_word: πνοή
  choice: sopro
  rationale: Preserva a imagem concreta da respiração nas narinas e sua associação com a fragilidade da vida.
- source_word: λόγος
  choice: razão
  rationale: No contexto antropológico, λόγος aponta mais naturalmente para a faculdade racional ou o pensamento do que para a fala isoladamente.
- source_word: ἐν κινήσει καρδίας
  choice: no pulsar do nosso coração
  rationale: Traduz o movimento físico do coração em português natural, mantendo a imagem corporal da centelha ligada ao batimento cardíaco.
theological_decisions:
- issue: A origem humana atribuída ao acaso
  choice: manter a afirmação em discurso direto, sem correção explicativa
  alternative: parafrasear de modo a negar explicitamente essa visão
  rationale: O versículo apresenta o raciocínio dos ímpios no contexto literário; a tradução deve preservar essa voz e sua tensão, não transformá-la em ensino do narrador.
- issue: Sentido de λόγος
  choice: razão
  alternative: fala
  rationale: Ambas são lexicalmente possíveis, mas o paralelismo entre respiração, centelha e movimento do coração favorece a faculdade racional como sinal físico e transitório da vida segundo os interlocutores.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. Mantém o encadeamento argumentativo, as imagens somáticas e a vírgula final por continuidade sintática com o versículo seguinte.
