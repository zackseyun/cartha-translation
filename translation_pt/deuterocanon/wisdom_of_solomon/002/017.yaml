  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/017.yaml
  text: Let us see whether his words are true[a], and let us test what will happen at his end.
translation:
  language: pt
  text: Vejamos se as palavras dele são verdadeiras e ponhamos à prova qual será o seu fim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “qual será o resultado para ele”. A expressão grega pode indicar tanto o desfecho quanto o fim que lhe sobrevirá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδωμεν
  choice: Vejamos
  rationale: O subjuntivo exortativo na primeira pessoa do plural mantém o tom de desafio deliberado dos falantes e soa natural em português.
- source_word: οἱ λόγοι αὐτοῦ
  choice: as palavras dele
  rationale: λόγοι pode designar palavras, declarações ou alegações. A formulação escolhida permanece próxima do grego sem restringir o sentido às meras palavras pronunciadas.
- source_word: ἀληθεῖς
  choice: verdadeiras
  rationale: O adjetivo qualifica o conteúdo das palavras como verdadeiro; “sinceras” deslocaria indevidamente o foco para o caráter de quem fala.
- source_word: πειράσωμεν
  choice: ponhamos à prova
  rationale: Expressa o sentido de testar ou experimentar e preserva a intenção hostil do contexto.
- source_word: τὰ ἐν ἐκβάσει αὐτοῦ
  choice: qual será o seu fim
  rationale: ἐκβάσις pode indicar desfecho, resultado ou fim. A tradução é idiomática em português e conserva a abertura entre o fim da vida e o resultado final que lhe sobrevirá.
theological_decisions:
- issue: Sentido de ἐκβάσις em relação às afirmações do justo
  choice: qual será o seu fim
  alternative: qual será o resultado para ele
  rationale: O contexto apresenta os ímpios tentando verificar se as afirmações do justo serão confirmadas por seu desfecho. A escolha mantém a possível dimensão final ou escatológica sem especificar uma doutrina que o grego não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção exortativa direta. “As palavras dele” favorece a legibilidade brasileira sem perder a formalidade; “seu fim” preserva deliberadamente a ambiguidade do grego.
