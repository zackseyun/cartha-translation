  naturalness: O português é moderno, claro e apropriado. A formulação explícita “Ele nos considera falsos” é igualmente natural e torna a relação sintática e semântica mais nítida.
  terminology: '“Caminhos”, “coisas impuras”, “justos” e “ter Deus por Pai” são escolhas adequadas. A nota c deve evitar chamar de literalmente grega uma paráfrase interpretativa: πατέρα θεόν é uma expressão comprimida, mais próxima de “Deus [como] pai”/“Pai Deus”, cujo sentido contextual é a reivindicação de Deus como Pai.'
