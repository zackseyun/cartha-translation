base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/016.yaml
  text: We were considered by him to be counterfeit[a], and he keeps away from our ways as from uncleannesses; he calls the end of the righteous blessed[c][b], and boasts that God is his father.
translation:
  language: pt
  text: Ele nos considera falsos[a] e se mantém afastado dos nossos caminhos como de coisas impuras. Considera feliz o fim dos justos[b] e se vangloria de ter Deus por Pai.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espúrios”, “adulterados” ou “sem valor”; o termo grego indica aquilo que não é genuíno, como metal ou moeda falsificados.
    reason: lexical_alternative
  - marker: b
    text: Ou “o estado final” ou “o desfecho dos justos”.
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente, uma expressão concisa: “Deus [como] pai” ou “Pai Deus”; isto é, afirma ter Deus por Pai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κίβδηλον
  choice: falsos
  rationale: O termo designa o que não é genuíno, inclusive metal ou moeda adulterados. “Falsos” é claro e natural em português; a nota preserva a imagem e as alternativas “espúrios” e “adulterados”.
- source_word: ἐλογίσθημεν
  choice: Para ele, somos
  rationale: O passivo expressa a avaliação feita pelo justo segundo a fala dos ímpios. A formulação portuguesa comunica idiomaticamente “somos considerados por ele”, sem tornar a frase pesada.
- source_word: ἀπέχεται
  choice: se mantém afastado
  rationale: Expressa separação deliberada e contínua, sem o possível sentido técnico de abstinência.
- source_word: ὁδῶν
  choice: caminhos
  rationale: Conserva a metáfora bíblica referente ao modo de viver e agir.
- source_word: ἀκαθαρσιῶν
  choice: coisas impuras
  rationale: Preserva o plural e a linguagem de impureza ou contaminação, com maior naturalidade do que o substantivo abstrato “impurezas” neste contexto comparativo.
- source_word: μακαρίζει
  choice: considera feliz
  rationale: O verbo significa declarar, chamar ou considerar alguém ou algo feliz ou bem-aventurado. A escolha é corrente e mantém a avaliação positiva.
- source_word: ἔσχατα δικαίων
  choice: o fim dos justos
  rationale: ἔσχατα pode indicar as últimas coisas, o destino final ou o desfecho. “O fim” conserva a concisão e a abertura sem fixar uma interpretação mais específica.
- source_word: ἀλαζονεύεται
  choice: se vangloria
  rationale: Mantém o tom negativo de ostentação ou pretensão arrogante presente na acusação dos ímpios.
- source_word: πατέρα θεόν
  choice: ter Deus por Pai
  rationale: Desdobra de modo natural a expressão grega comprimida, entendida como a alegação de uma relação filial com Deus.
theological_decisions:
- issue: Sentido de πατέρα θεόν com ἀλαζονεύεται
  choice: os ímpios acusam o justo de se vangloriar de ter Deus por Pai
  alternative: ele se vangloria de Deus como Pai
  rationale: A frase integra a fala hostil dos ímpios, não uma afirmação direta do narrador. A tradução explicita a relação reivindicada sem lhe impor uma especificidade cristológica posterior.
- issue: Sentido escatológico de ἔσχατα δικαίων
  choice: o fim dos justos
  alternative: o destino final dos justos
  rationale: A forma grega admite “fim”, “desfecho” ou “estado final”. A opção mais concisa preserva essa amplitude e evita definir além do texto a natureza desse fim.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Caminhos” conserva a metáfora bíblica; “coisas impuras” mantém a linguagem de pureza sem soar artificial; “ter Deus por Pai” é uma formulação corrente e não introduz terminologia confessional específica.
