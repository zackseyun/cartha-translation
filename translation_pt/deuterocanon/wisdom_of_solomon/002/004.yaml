  text: and our name will be forgotten in time[a], and no one will remember our works; and our life will pass by like the trace of a cloud, and will be scattered like mist[b], driven off by the sun’s rays and weighed down by its heat.
translation:
  language: pt
  text: e nosso nome será esquecido com o tempo, e ninguém se lembrará de nossas obras; nossa vida passará[a] como o rastro de uma nuvem[b] e se dissipará como a névoa, afugentada pelos raios do sol e oprimida por seu calor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desaparecerá”. O verbo grego também pode indicar passar ou ir embora.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os rastros de uma nuvem”; a imagem é a de uma marca fugaz que logo desaparece.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιλησθήσεται ἐν χρόνῳ
  choice: será esquecido com o tempo
  rationale: Mantém a voz passiva e expressa naturalmente o esquecimento que ocorre à medida que o tempo passa, sem determinar um intervalo específico.
- source_word: μνημονεύσει τῶν ἔργων ἡμῶν
  choice: se lembrará de nossas obras
  rationale: No paralelismo com o nome esquecido, μνημονεύω indica sobretudo recordar; “obras” preserva a amplitude de ἔργα.
- source_word: παρελεύσεται ὁ βίος ἡμῶν
  choice: nossa vida passará
  rationale: Expressa diretamente o movimento de passar presente no verbo e se integra à comparação seguinte, sem explicitar além do texto a ideia de morrer.
- source_word: ἴχνη νεφέλης
  choice: o rastro de uma nuvem
  rationale: “Rastro” comunica em português a marca fugaz deixada pela nuvem; o singular coletivo é mais natural, embora ἴχνη esteja formalmente no plural.
- source_word: ὁμίχλη διασκεδασθήσεται
  choice: se dissipará como a névoa
  rationale: “Névoa” corresponde ao vapor leve da imagem, e “se dissipará” traduz com naturalidade a dispersão passiva.
- source_word: διωχθεῖσα ὑπὸ ἀκτίνων ἡλίου
  choice: afugentada pelos raios do sol
  rationale: Preserva a personificação dinâmica de algo posto em fuga e identifica os raios solares como agente.
- source_word: ὑπὸ θερμότητος αὐτοῦ βαρυνθεῖσα
  choice: abatida por seu calor
  rationale: “Abatida” conserva a força de βαρύνω, literalmente tornar pesado ou oprimir, sem produzir a estranheza física de dizer que a névoa é “tornada pesada” pelo calor.
