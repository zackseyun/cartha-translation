  text: He became a reproof to our thoughts[a]; even being seen is burdensome to us[b],
translation:
  language: pt
  text: Ele se tornou uma censura aos nossos pensamentos[a]; até mesmo vê-lo nos é penoso[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele se tornou uma repreensão aos nossos raciocínios interiores”. O termo grego pode indicar uma censura que expõe a culpa, e “pensamentos” também pode significar raciocínios ou intenções interiores.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “e, sendo visto, é pesado para nós”; isto é, até a simples visão dele nos é difícil de suportar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: se tornou
  rationale: Reproduz o aoristo de γίνομαι com força narrativa e resultante, sem acrescentar aspecto perfeito não exigido pelo grego.
- source_word: εἰς ἔλεγχον
  choice: uma censura
  rationale: Ἔλεγχος pode indicar censura, repreensão ou exposição da culpa. “Censura” conserva a força moral da expressão sem convertê-la em condenação judicial.
- source_word: ἐννοιῶν
  choice: pensamentos
  rationale: Ἔννοιαι designa pensamentos, concepções ou raciocínios interiores. “Pensamentos” é natural e mantém aberta a nuance moral dada pelo contexto.
- source_word: βαρύς
  choice: insuportável
  rationale: 'O adjetivo é metafórico neste contexto: a visão ou presença dele pesa sobre os falantes. “Insuportável” comunica de modo corrente que lhes é difícil tolerá-lo.'
- source_word: βλεπόμενος
  choice: vê-lo
  rationale: O particípio passivo significa literalmente “sendo visto”. A construção portuguesa “até vê-lo” expressa naturalmente que a mera visão dele lhes é penosa, sem inserir um referente nominal ausente do verso.
theological_decisions:
- issue: Referente do sujeito implícito
  choice: Ele
  alternative: o justo / esse homem
  rationale: O verso continua a descrição do justo no contexto, mas o grego deixa o sujeito implícito. O pronome preserva essa continuidade sem acrescentar aqui um substantivo explicativo.
- issue: Força de ἔλεγχος
  choice: censura
  alternative: repreensão / prova da culpa / condenação
  rationale: A escolha mantém a ideia de que a própria pessoa expõe ou reprova os pensamentos dos falantes, sem impor uma leitura estritamente judicial.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leitura natural no Brasil. A primeira oração permanece próxima da estrutura grega; a segunda usa formulação idiomática para comunicar a metáfora de peso sem perder seu sentido.
