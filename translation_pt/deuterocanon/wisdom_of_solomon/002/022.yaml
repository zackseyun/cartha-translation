  naturalness: «Seus mistérios» é mais natural e digno em português atual do que «os mistérios dele», sem perder a referência pronominal. A formulação revista da última oração é clara e preserva a elipse grega mediante uma expansão idiomática mínima.
  terminology: «Mistérios», «recompensa», «santidade», «almas» e «irrepreensíveis» são escolhas adequadas. «Dignas de honra» comunica naturalmente γέρας e a função avaliativa de ἔκριναν, sem especificar se a honra é um destino ou uma recompensa reservada.
