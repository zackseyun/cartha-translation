  text: And they did not know his mysteries[a], nor did they hope for the reward of holiness[c][b], nor did they consider blameless souls worthy of honor.
translation:
  language: pt
  text: E não conheceram seus mistérios[a], nem esperaram a recompensa da santidade[b], nem consideraram dignas de honra as almas irrepreensíveis[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “suas coisas secretas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a recompensa da piedade”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “nem julgaram honra das almas irrepreensíveis”; a construção grega é condensada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνωσαν
  choice: conheceram
  rationale: Traduz diretamente o aoristo de γινώσκω e mantém aberta a nuance entre conhecer e compreender.
- source_word: μυστήρια
  choice: mistérios
  rationale: Preserva o sentido de realidades ocultas ou secretas e seu peso teológico, sem explicitar indevidamente seu conteúdo.
- source_word: αὐτοῦ
  choice: dele
  rationale: Mantém o pronome do grego; no contexto, o referente é Deus, mas a tradução não substitui o pronome pelo nome.
- source_word: μισθὸν
  choice: recompensa
  rationale: Expressa a retribuição esperada no contexto moral e religioso sem a conotação comercial de salário.
- source_word: ἤλπισαν
  choice: esperaram
  rationale: Comunica de modo natural tanto esperança quanto expectativa futura.
- source_word: ὁσιότητος
  choice: santidade
  rationale: Conserva o alcance moral e religioso de ὁσιότης; piedade é uma alternativa possível.
- source_word: ἔκριναν
  choice: reconheceram
  rationale: Neste enunciado elíptico, transmite a avaliação ou consideração expressa por κρίνω de maneira natural em português.
- source_word: γέρας
  choice: a honra reservada
  rationale: γέρας designa honra, distinção ou prêmio. A expressão acrescenta apenas o necessário para tornar inteligível a construção grega comprimida.
- source_word: ψυχῶν
  choice: almas
  rationale: Preserva o termo antropológico e sua ressonância escatológica no contexto, sem reduzi-lo a vidas ou pessoas.
- source_word: ἀμώμων
  choice: irrepreensíveis
  rationale: Expressa a qualidade moral de ser sem culpa ou censura em português atual e digno.
theological_decisions:
- issue: Referente de αὐτοῦ em “os mistérios dele”
  choice: Manter o pronome “dele”, entendido contextualmente como referência a Deus
  alternative: Explicitar “os mistérios de Deus”
  rationale: O contexto aponta para Deus, mas o grego emprega um pronome; mantê-lo evita explicitação desnecessária.
- issue: Sentido de ψυχῶν
  choice: almas
  alternative: vidas ou pessoas
  rationale: “Almas” conserva a linguagem do texto e sua possível ressonância quanto ao destino dos justos, sem acrescentar uma definição doutrinária da alma.
- issue: Construção elíptica γέρας ψυχῶν ἀμώμων
  choice: “a honra reservada às almas irrepreensíveis”
  alternative: “as almas irrepreensíveis dignas de honra”
  rationale: A formulação adotada preserva γέρας como substantivo e comunica a relação genitiva comprimida sem determinar se a honra é mérito intrínseco, prêmio ou destino final.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A coordenação repetida com “nem” preserva o paralelismo grego; as notas registram alternativas genuínas e a elipse da última oração.
