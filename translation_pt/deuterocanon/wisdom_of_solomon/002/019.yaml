base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/019.yaml
  text: Let us test him with insolence and torture[b][a], so that we may know his gentleness and test his forbearance.
translation:
  language: pt
  text: Vamos pô-lo à prova com insolência e tortura[a], para conhecermos sua brandura e avaliarmos sua paciência ao suportar injustiças[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com ultraje e tormento”. Os termos gregos podem indicar maus-tratos insolentes e sofrimento doloroso empregados como meio de prova.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “julguemos sua tolerância diante do mal”. O substantivo grego se refere especificamente a suportar ofensas ou injustiças sem retaliar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕβρει
  choice: com insolência
  rationale: ὕβρις designa insolência abusiva, ultraje ou maus-tratos arrogantes. “Com insolência” preserva o caráter hostil da conduta sem limitá-la apenas a insultos verbais.
- source_word: βασάνῳ
  choice: e tortura
  rationale: βάσανος pode indicar tormento ou tortura empregada como meio de prova. “Tortura” torna concreto o sofrimento imposto e evita repetir a ideia de provar já expressa pelo verbo.
- source_word: ἐτάσωμεν
  choice: Vamos pô-lo à prova
  rationale: O subjuntivo exortativo propõe uma ação conjunta. “Vamos pô-lo à prova” comunica naturalmente tanto exame quanto provação por sofrimento.
- source_word: ἐπιείκειαν
  choice: brandura
  rationale: ἐπιείκεια pode indicar uma disposição branda, moderada e não severa. “Brandura” é clara no contexto da reação do justo aos maus-tratos e não a confunde com a virtude seguinte.
- source_word: δικάσωμεν
  choice: avaliarmos
  rationale: δικάζω significa julgar e, neste contexto paralelo ao ato de provar, tem o sentido de formar uma avaliação mediante o que se observa durante a provação. “Avaliarmos” preserva esse sentido sem sugerir a emissão de uma sentença judicial.
- source_word: ἀνεξικακίαν
  choice: paciência ao suportar injustiças
  rationale: ἀνεξικακία se refere especificamente à disposição de suportar o mal ou a ofensa sem retaliar. A formulação explicita essa nuance, que o termo genérico “paciência” sozinho não comunicaria por completo.
theological_decisions:
- issue: Caracterização moral da reação do justo durante a perseguição
  choice: 'Manter ἐπιείκεια e ἀνεξικακία como virtudes distintas: “brandura” e “paciência ao suportar injustiças”.'
  alternative: “mansidão” e “tolerância”; ou “clemência” e “longanimidade”
  rationale: O texto apresenta duas qualidades relacionadas, mas não idênticas, que os ímpios pretendem verificar. A tradução mantém o paralelismo e a distinção ética sem impor terminologia confessional.
- issue: Sentido de δικάσωμεν no contexto da provação
  choice: “avaliarmos”
  alternative: “julgarmos” ou “pusermos à prova”
  rationale: O sentido literal de julgamento permanece possível, mas o contexto favorece a avaliação do comportamento observado sob tortura. “Avaliarmos” evita tanto uma sentença judicial não explicitada quanto a repetição exata de “pôr à prova”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vamos pô-lo à prova” reproduz naturalmente a exortação; “brandura” e a expressão explicativa “paciência ao suportar injustiças” mantêm distintas as duas qualidades morais.
