  yaml_path: translation/deuterocanon/wisdom_of_solomon/002/007.yaml
  text: Let us fill ourselves with costly wine and perfumes[a], and let no flower of spring pass us by.
translation:
  language: pt
  text: Saciamo-nos de vinho caro e de óleos perfumados[a], e não deixemos escapar nenhuma flor da primavera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «perfumes» ou «unguentos». O termo grego refere-se de modo amplo a óleos aromáticos e preparados perfumados usados como artigos de luxo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴνου πολυτελοῦς
  choice: vinho caro
  rationale: O genitivo indica aquilo de que os falantes desejam saciar-se; «caro» transmite de modo claro o alto valor e o caráter luxuoso do vinho.
- source_word: μύρων
  choice: óleos perfumados
  rationale: O termo grego designa óleos aromáticos ou unguentos usados como artigos de luxo; esta tradução é clara no português atual e evita o sentido medicinal que «unguentos» pode sugerir.
- source_word: πλησθῶμεν
  choice: saciamo-nos
  rationale: O subjuntivo exortativo na primeira pessoa do plural é preservado, enquanto «saciar-se» comunica naturalmente a ideia de entregar-se plenamente ao prazer.
- source_word: μὴ παροδευσάτω ἡμᾶς
  choice: não deixemos escapar
  rationale: A formulação idiomática expressa a proibição de permitir que uma ocasião de prazer passe sem ser aproveitada.
- source_word: ἄνθος ἔαρος
  choice: flor da primavera
  rationale: Mantém a imagem poética e a relação genitiva do grego em linguagem digna e compreensível.
