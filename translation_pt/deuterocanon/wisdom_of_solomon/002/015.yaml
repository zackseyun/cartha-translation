  text: for his life is unlike that of others[a], and his ways are different.
translation:
  language: pt
  text: pois a vida dele não é como a dos outros[a], e seus caminhos são diferentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois seu modo de viver não é como o dos outros, e seus caminhos são diferentes”.'
    reason: βίος pode significar aqui não apenas “vida”, mas especificamente “modo de viver”.
lexical_decisions:
- source_word: ἀνόμοιος
  choice: não é como
  rationale: Expressa de modo natural e claro a ideia comparativa de ser distinto ou dessemelhante, preservando a relação com τοῖς ἄλλοις.
- source_word: βίος
  choice: vida
  rationale: Mantém o termo concreto do grego, que aqui pode abranger tanto a vida quanto o modo de viver; o contexto e a menção dos caminhos indicam a dimensão de conduta.
- source_word: ἐξηλλαγμέναι
  choice: são diferentes
  rationale: O particípio perfeito descreve um estado de alteração ou diferenciação. Em português, esta formulação comunica naturalmente o contraste, sem sugerir necessariamente que os caminhos foram modificados em algum momento identificável.
- source_word: τρίβοι
  choice: caminhos
  rationale: Preserva a metáfora de trilhas ou caminhos aplicada à conduta, em linguagem bíblica corrente e compreensível.
theological_decisions:
- issue: Se o sentido moral de βίος e τρίβοι deve ser explicitado no texto principal
  choice: Conservar os termos concretos “vida” e “caminhos”, sem expansão interpretativa.
  alternative: pois seu modo de viver não é como o dos outros, e sua conduta é diferente
  rationale: O contexto se refere à conduta distintiva do justo, mas o grego o faz por meio de termos comuns e de uma metáfora. Preservá-los evita tornar explícita uma interpretação que o original deixa implícita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Não é como” é mais idiomático do que “é dessemelhante”, e “caminhos” preserva a imagem do original.
