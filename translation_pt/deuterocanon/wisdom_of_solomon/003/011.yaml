base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/011.yaml
  text: For miserable is the one who despises wisdom and instruction[a], and their hope is empty, their labors are unprofitable, and their works are useless.
translation:
  language: pt
  text: Pois infeliz é quem despreza a sabedoria e a instrução[a]; a esperança deles é vazia, seus esforços são insensatos, e suas obras, inúteis.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “disciplina”. O termo grego pode abranger tanto educação e formação quanto correção disciplinar.
    reason: lexical_alternative
  - marker: b
    text: O grego passa de “quem despreza”, no singular, para “deles”, no plural, tratando essa pessoa como representante de todos os que agem assim.
    reason: source_structure
lexical_decisions:
- source_word: σοφίαν
  choice: sabedoria
  rationale: É o sentido corrente na literatura sapiencial e expressa aqui um bem moral e intelectual, não apenas habilidade prática.
- source_word: παιδείαν
  choice: instrução
  rationale: Abrange formação e ensino, podendo também incluir disciplina corretiva; “instrução” mantém o sentido amplo no texto, com a nuance indicada em nota.
- source_word: ὁ ἐξουδενῶν
  choice: quem despreza
  rationale: Expressa tratar algo como sem valor ou digno de desprezo, em formulação portuguesa natural e genericamente aplicável.
- source_word: ταλαίπωρος
  choice: infeliz
  rationale: Comunica a condição miserável e digna de pena indicada pelo adjetivo, sem recorrer a linguagem arcaica ou excessivamente emocional.
- source_word: κενὴ ἡ ἐλπὶς αὐτῶν
  choice: a esperança deles é vazia
  rationale: Reproduz diretamente κενή e conserva a passagem do sujeito singular representativo para o pronome plural presente no grego.
- source_word: οἱ κόποι ἀνόητοι
  choice: seus esforços são insensatos
  rationale: κόποι designa esforços penosos ou trabalhos, enquanto ἀνόητοι significa desprovidos de entendimento; “insensatos” preserva esse juízo, em vez de reduzi-lo apenas à falta de proveito.
- source_word: ἄχρηστα τὰ ἔργα αὐτῶν
  choice: suas obras, inúteis
  rationale: “Obras” corresponde a ἔργα, e “inúteis” transmite que elas não têm uso nem proveito.
theological_decisions:
- issue: Mudança do sujeito singular (“quem despreza”) para possessivos plurais no grego (“deles”).
  choice: 'Conservar o singular representativo na primeira oração e o plural nas consequências: “quem despreza... a esperança deles”.'
  alternative: 'Uniformizar no plural: “os que desprezam... a esperança deles”; ou no singular: “quem despreza... sua esperança”.'
  rationale: A alternância está no texto grego e apresenta o indivíduo como representante de uma classe. Preservá-la evita eliminar silenciosamente uma característica real da fonte; a nota esclarece a construção.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem “infeliz é quem” preserva a ênfase predicativa sem soar arcaica. A elipse de “são” em “suas obras, inúteis” evita repetição pesada e mantém o paralelismo; a pontuação separa com clareza o juízo inicial e suas consequências.
