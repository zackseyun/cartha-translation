  text: Their women are foolish[a], and their children are evil[b]; their offspring is accursed.
translation:
  language: pt
  text: As mulheres deles são insensatas[a], seus filhos são maus, e sua descendência é amaldiçoada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “As esposas deles são insensatas”. O grego pode significar “mulheres” ou “esposas”, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “sua linhagem é amaldiçoada” ou “sua geração é amaldiçoada”. O termo grego pode referir-se à descendência, à linhagem ou à geração.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκες
  choice: mulheres
  rationale: γυνή pode significar tanto “mulher” como “esposa”. “Mulheres” mantém a correspondência formal, enquanto a nota preserva a leitura contextual “esposas”.
- source_word: ἄφρονες
  choice: insensatas
  rationale: ἄφρων indica falta de entendimento ou bom senso. “Insensatas” é natural, dignificado e conserva a dimensão intelectual e moral do termo.
- source_word: πονηρά
  choice: maus
  rationale: πονηρός tem aqui clara força moral. “Maus” aplica-se naturalmente a “filhos” e evita reduzir o sentido a mera baixa qualidade.
- source_word: τέκνα
  choice: filhos
  rationale: τέκνα designa naturalmente os filhos. A escolha também distingue este termo de γένεσις, traduzido depois por “descendência”.
- source_word: ἐπικατάρατος
  choice: amaldiçoada
  rationale: O adjetivo expressa a condição de estar sob maldição. “Amaldiçoada” preserva o tom solene e judicial e concorda com “descendência”.
- source_word: γένεσις
  choice: descendência
  rationale: Neste contexto familiar, γένεσις pode indicar aquilo que foi gerado ou a linhagem resultante. “Descendência” abrange os descendentes e a continuidade da família sem impor o sentido moderno de “geração”.
theological_decisions:
- issue: Referente e força da linguagem de juízo sobre a família
  choice: O versículo é traduzido como uma denúncia direta das mulheres, dos filhos e da descendência dos ímpios, sem atenuar seus predicados severos.
  alternative: Entender a linguagem apenas como descrição geral de infortúnio, e não como condenação moral.
  rationale: O grego emprega predicativos contundentes — “insensatas”, “maus” e “amaldiçoada” — e não oferece base textual para suavizá-los. A tradução conserva a tensão ética e teológica do texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A coordenação simples reproduz a contundência das três declarações gregas; as notas preservam ambiguidades lexicais reais sem sobrecarregar o texto principal.
