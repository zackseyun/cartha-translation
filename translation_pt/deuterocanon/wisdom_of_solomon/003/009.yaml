base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/009.yaml
  text: Those who have trusted in him will understand truth[a], and the faithful will remain with him in love[b], because grace and mercy are for his chosen ones.
translation:
  language: pt
  text: Os que confiaram nele compreenderão a verdade, e os fiéis permanecerão com ele[a] em amor, porque graça e misericórdia são para os seus escolhidos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “esperarão por ele”. O verbo grego pode indicar permanecer com alguém ou esperar por alguém com expectativa.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “seus eleitos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πεποιθότες ἐπʼ αὐτῷ
  choice: os que confiaram nele
  rationale: O particípio perfeito expressa uma confiança já depositada e ainda vigente. A forma portuguesa no pretérito mantém esse aspecto resultante com clareza e naturalidade.
- source_word: συνήσουσιν ἀλήθειαν
  choice: compreenderão a verdade
  rationale: Traduz diretamente o futuro de συνίημι e conserva ἀλήθεια sem ampliar seu sentido. Em português, o artigo definido torna a expressão natural.
- source_word: οἱ πιστοὶ
  choice: os fiéis
  rationale: O adjetivo substantivado indica pessoas caracterizadas pela fidelidade; a tradução evita reduzi-lo apenas à ideia de assentimento ou crença.
- source_word: ἐν ἀγάπῃ
  choice: em amor
  rationale: Preserva a formulação compacta e a ambiguidade do grego quanto a se tratar do amor deles, do amor de Deus ou da esfera em que permanecem.
- source_word: προσμενοῦσιν αὐτῷ
  choice: permanecerão com ele
  rationale: προσμένω pode indicar permanecer junto de alguém, continuar ou esperar. No contexto do destino dos justos, 'permanecerão com ele' comunica de modo natural a continuidade da comunhão, sem ocultar em nota a alternativa lexical.
- source_word: χάρις καὶ ἔλεος
  choice: graça e misericórdia
  rationale: São equivalentes tradicionais, claros e semanticamente distintos para os dois substantivos gregos.
- source_word: τοῖς ἐκλεκτοῖς αὐτοῦ
  choice: para os seus escolhidos
  rationale: '''Escolhidos'' expressa diretamente a ideia de seleção divina em linguagem moderna, sem acrescentar associações sistemáticas que ''eleitos'' pode evocar.'
theological_decisions:
- issue: Sentido de πιστοὶ em relação à confiança e à fidelidade
  choice: os fiéis
  alternative: os que creem
  rationale: Neste contexto sapiencial, a palavra caracteriza a constância e lealdade dos justos, em paralelo com os que confiaram em Deus, sem excluir a dimensão da fé.
- issue: Sentido de προσμενοῦσιν αὐτῷ
  choice: permanecerão com ele
  alternative: esperarão por ele
  rationale: A permanência junto de Deus se ajusta ao contexto imediato e é lexicalmente defensável; a possibilidade de espera expectante é preservada em nota.
- issue: Tradução de ἐκλεκτοῖς
  choice: escolhidos
  alternative: eleitos
  rationale: A escolha conserva a referência à ação divina sem impor terminologia doutrinária posterior ao texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A expressão deliberadamente compacta “em amor” preserva a ambiguidade do original.
