review_pass:
  verdict: revise
  source_fidelity: O segmento grego fornecido termina após «ἡ ἔξοδος αὐτῶν,» e, portanto, não contém o complemento de «foi considerada». Não é fiel completar a oração com «uma desgraça/calamidade» com base apenas na trilha inglesa, especialmente porque ela pressupõe uma forma que não consta no texto-fonte apresentado. A tradução deve assinalar a truncagem.
  naturalness: «Aos olhos dos insensatos» e «pareceram ter morrido» são naturais e adequados ao registro sapiencial. «Sua partida» é ligeiramente mais fluente que «a partida deles» e preserva a metáfora de ἔξοδος.
  terminology: «Insensatos» reproduz bem ἀφρόνων no registro do livro. «Partida» mantém a expressão figurada para a morte sem a reduzir interpretativamente a «morte» ou «fim».
  issues:
  - severity: high
    issue: A oração foi deixada com reticências sem nota textual ancorada.
    rationale: O texto grego fornecido está truncado depois de «a partida deles». As reticências por si só não esclarecem ao leitor que não se trata de hesitação estilística, mas de uma lacuna/incompletude no segmento-fonte.
  - severity: medium
    issue: A trilha inglesa propõe «calamidade» com base em material ausente do texto grego fornecido.
    rationale: A revisão deve priorizar a fonte apresentada. Não se deve inserir esse complemento na tradução portuguesa sem que ele conste do segmento grego validado ou seja explicitamente restituído por uma decisão editorial documentada.
  revised_text: Aos olhos dos insensatos, pareceram ter morrido, e sua partida foi considerada[a]…
  revised_footnotes:
  - marker: a
    text: O segmento grego fornecido termina aqui, deixando incompleta a oração após «foi considerada». Por isso, a tradução não acrescenta um complemento conjectural.
    reason: textual_truncation
  revision_rationale: A revisão conserva todas as palavras efetivamente presentes no grego e torna explícita, por meio de nota ancorada, a incompletude do segmento. Evita-se importar «calamidade/desgraça» da trilha inglesa, pois esse complemento não está no texto-fonte fornecido. A substituição de «a partida deles» por «sua partida» melhora a fluência sem alterar o sentido.
