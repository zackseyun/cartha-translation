  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/002.yaml
  text: In the eyes of fools they seemed to have died[a], and their departure was regarded as calamity,
translation:
  language: pt
  text: Aos olhos dos insensatos, eles pareceram ter morrido, e a partida deles foi considerada...
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδοξαν
  choice: pareceram
  rationale: Preserva a perspectiva equivocada dos observadores, sem afirmar objetivamente que a aparência correspondia à realidade.
- source_word: ἐν ὀφθαλμοῖς ἀφρόνων
  choice: aos olhos dos insensatos
  rationale: Reproduz de modo natural o idioma grego e mantém a força moral e espiritual de ἀφρόνων.
- source_word: τεθνάναι
  choice: ter morrido
  rationale: O infinitivo perfeito indica a morte como fato já ocorrido, com estado resultante; esta construção é natural em português depois de “pareceram”.
- source_word: ἐλογίσθη
  choice: foi considerada
  rationale: Expressa a avaliação feita pelos observadores e preserva a voz passiva do grego.
- source_word: ἡ ἔξοδος αὐτῶν
  choice: a partida deles
  rationale: Mantém a metáfora de ἔξοδος como partida ou saída, sem reduzi-la interpretativamente a “morte” ou “fim”.
theological_decisions:
- issue: Expressão metafórica ἔξοδος para a morte
  choice: a partida deles
  alternative: a morte deles
  rationale: “Partida” conserva a imagem e a tensão entre a percepção dos insensatos e a verdadeira condição dos justos no contexto.
- issue: Cláusula truncada no testemunho fornecido
  choice: encerrar com reticências
  alternative: acrescentar “uma desgraça” com base na continuação conhecida κακοῦ
  rationale: O texto grego fornecido termina em αὐτῶν seguido de vírgula. Não se acrescentou κακοῦ, ausente da evidência primária apresentada, embora a camada inglesa o pressuponha.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Insensatos” evita a possível coloquialidade de “tolos” e preserva o peso sapiencial. As reticências sinalizam que a oração permanece incompleta no trecho grego fornecido.
