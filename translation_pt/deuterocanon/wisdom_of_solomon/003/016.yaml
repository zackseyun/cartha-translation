  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/016.yaml
  text: But the children of adulterers will be imperfect[b][a], and the offspring of an unlawful union will perish.
translation:
  language: pt
  text: Mas os filhos de adúlteros serão incompletos[a], e a descendência de uma união contrária à lei[b] desaparecerá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não chegarão à plenitude”, “não chegarão ao pleno desenvolvimento” ou “não alcançarão sua realização”. O termo grego indica falta de conclusão ou plenitude, sem especificar em que consiste essa deficiência.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “de um leito contrário à lei”. Em grego, “leito” pode designar, por metonímia, uma relação sexual ou união conjugal.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: filhos
  rationale: Expressa naturalmente descendentes ou crianças em relação aos pais, sem restringir o termo ao sexo masculino.
- source_word: μοιχῶν
  choice: de adúlteros
  rationale: Reproduz de modo direto o genitivo plural que caracteriza os pais pela prática do adultério.
- source_word: ἀτέλεστα
  choice: não chegarão à plenitude
  rationale: Preserva a ideia de falta de conclusão, realização ou pleno desenvolvimento sem definir indevidamente a natureza dessa deficiência.
- source_word: ἔσται
  choice: não chegarão
  rationale: O futuro é mantido; a construção verbal em português torna natural o sentido predicativo de ἀτέλεστα.
- source_word: ἐκ παρανόμου κοίτης
  choice: de uma união contrária à lei
  rationale: Traduz a origem expressa por ἐκ e comunica com clareza o valor jurídico-moral de παράνομος; 'união' explicita a metonímia sexual de κοίτη.
- source_word: σπέρμα
  choice: descendência
  rationale: No contexto, o sentido figurado de 'semente' é a prole ou linhagem; 'descendência' preserva também a nuance coletiva.
- source_word: ἀφανισθήσεται
  choice: desaparecerá
  rationale: Conserva a força passiva/resultativa de ser eliminado ou deixar de existir, sem intensificá-la necessariamente para 'será destruída'.
theological_decisions:
- issue: Juízo severo sobre os filhos provenientes de relações adúlteras
  choice: Manter a declaração contundente como está formulada no texto sapiencial
  alternative: Reduzi-la a uma observação sobre estigma social ou explicá-la como doutrina específica de culpa hereditária
  rationale: O grego associa diretamente a descendência ao adultério e à união contrária à lei. A tradução preserva essa tensão e gravidade, mas não acrescenta uma explicação sobre o mecanismo ou a natureza do juízo.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação evita tanto um literalismo obscuro ('leito contrário à lei' no corpo do texto) quanto uma interpretação que determine de forma indevida o sentido exato de ἀτέλεστα.
