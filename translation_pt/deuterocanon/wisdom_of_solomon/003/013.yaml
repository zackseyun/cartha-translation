base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/013.yaml
  text: For blessed is the undefiled barren woman[a], who has not known a bed in transgression[b]; she will have fruit at the visitation of souls.
translation:
  language: pt
  text: Pois feliz é a mulher estéril e sem mancha, que não conheceu leito em transgressão[a]; ela terá fruto na visitação das almas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Leito» é usado aqui como eufemismo para a união sexual. Também se pode entender: «não teve relações sexuais em transgressão».'
    reason: lexical_alternative
  - marker: b
    text: A expressão «visitação das almas» pode referir-se à futura intervenção ou prestação de contas diante de Deus, envolvendo juízo ou vindicação.
    reason: alternative_reading
lexical_decisions:
- source_word: μακαρία
  choice: feliz
  rationale: Expressa a condição digna de felicitação indicada pelo grego e é mais natural no português atual do que «bem-aventurada», sem reduzir o sentido a uma emoção passageira.
- source_word: στεῖρα
  choice: mulher estéril
  rationale: Explicita o referente feminino do adjetivo substantivado e preserva o contraste intencional com o «fruto» que ela terá.
- source_word: ἀμίαντος
  choice: sem mancha
  rationale: Conserva a ideia de não contaminação moral ou ritual, sem impor uma explicação mais específica do que o texto grego.
- source_word: οὐκ ἔγνω κοίτην
  choice: não conheceu leito
  rationale: Mantém tanto o verbo «conhecer» quanto a metonímia do «leito», preservando o eufemismo bíblico para a união sexual.
- source_word: ἐν παραπτώματι
  choice: em transgressão
  rationale: Reproduz a categoria moral ampla do original sem especificar indevidamente a natureza da falta.
- source_word: ἕξει καρπὸν
  choice: terá fruto
  rationale: 'Segue de perto a formulação grega e conserva a inversão irônica e esperançosa: embora estéril, a mulher terá fruto.'
- source_word: ἐν ἐπισκοπῇ
  choice: na visitação
  rationale: Preserva a ambiguidade entre intervenção, exame, juízo e manifestação favorável de Deus; «julgamento» seria mais restritivo.
- source_word: ψυχῶν
  choice: das almas
  rationale: É a correspondência direta e mantém o registro antropológico e escatológico do contexto.
theological_decisions:
- issue: Sentido de «visitação das almas»
  choice: Manter a expressão aberta como uma futura visitação ou prestação de contas divina referente às almas humanas.
  alternative: Traduzir explicitamente por «no julgamento das almas» ou «quando Deus visitar as almas com favor».
  rationale: O contexto aponta para a futura vindicação dos justos e para o juízo, mas ἐπισκοπή não determina por si só se a ênfase recai sobre favor, exame ou condenação. A tradução conserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Leito» e «visitação» preservam o tom bíblico e as ambiguidades do grego; as notas esclarecem esses usos sem substituir a linguagem figurada do texto.
