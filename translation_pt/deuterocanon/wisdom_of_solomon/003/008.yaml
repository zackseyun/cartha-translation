base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/008.yaml
  text: They will judge nations and rule over peoples[c][b][a], and the Lord will reign over them forever.
translation:
  language: pt
  text: Julgarão nações e dominarão povos[a], e o Senhor reinará sobre eles[b] para sempre.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “exercerão poder sobre povos” ou “prevalecerão sobre povos”; o verbo grego pode indicar exercer domínio, ser forte ou prevalecer.
    reason: lexical_alternative
  - marker: b
    text: “Eles” provavelmente se refere aos justos mencionados no contexto, embora também possa ser entendido de modo mais amplo como referência às nações e aos povos que acabaram de ser citados.
    reason: alternative_reading
  - marker: c
    text: Literalmente, “pelos séculos” ou “pelas eras”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρινοῦσιν
  choice: julgarão
  rationale: Preserva o sentido judicial mais direto de κρίνω, sem excluir a conotação mais ampla de exercer governo no contexto sapiencial e escatológico.
- source_word: ἔθνη
  choice: nações
  rationale: É o equivalente corrente de ἔθνη e evita introduzir a distinção entre judeus e gentios, que não está explícita neste verso.
- source_word: κρατήσουσι
  choice: dominarão
  rationale: Com o genitivo λαῶν, o verbo indica exercício de poder ou domínio. “Dominarão” mantém esse sentido e forma um paralelo claro com “julgarão”.
- source_word: λαῶν
  choice: povos
  rationale: Mantém a distinção lexical em relação a ἔθνη, traduzido como “nações”, e conserva o paralelismo grego.
- source_word: βασιλεύσει
  choice: reinará
  rationale: Expressa de modo natural e direto o sentido régio de βασιλεύω.
- source_word: αὐτῶν
  choice: sobre eles
  rationale: O genitivo ligado a βασιλεύω é naturalmente expresso em português por “sobre eles”. O pronome permanece sem explicitação do referente, preservando a ambiguidade do grego.
- source_word: Κύριος
  choice: o Senhor
  rationale: Traduz Κύριος como título divino definido, em formulação corrente e dignificada em português.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: É a forma moderna e idiomática de comunicar a duração contínua da expressão grega; a imagem literal das eras é registrada em nota.
theological_decisions:
- issue: Referente de αὐτῶν em “o Senhor reinará sobre eles”
  choice: Manter o pronome “eles” sem identificar expressamente seu referente
  alternative: Explicitar “os justos” ou entender o pronome de modo mais amplo como referência às nações e aos povos mencionados no verso
  rationale: O contexto imediato favorece os justos como referente, mas a proximidade de “nações” e “povos” permite uma leitura mais ampla. A tradução conserva a tensão do original em vez de resolvê-la.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O paralelismo entre “nações” e “povos” foi preservado, assim como a ambiguidade do pronome “eles”.
