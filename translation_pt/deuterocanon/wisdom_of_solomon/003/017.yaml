base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/017.yaml
  text: For even if they become long-lived[a], they will be counted as nothing[b], and in the end their old age will be dishonored.
translation:
  language: pt
  text: Pois, ainda que tenham vida longa, serão tidos por nada[a] e, no fim[b], a velhice deles será sem honra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: serão considerados insignificantes.'
    reason: Alternativa idiomática para εἰς οὐθὲν λογισθήσονται, que indica serem avaliados como sem importância ou valor.
  - marker: b
    text: 'Ou: por fim.'
    reason: Alternativa idiomática para ἐπʼ ἐσχάτων, expressão que indica o desfecho ou a etapa final.
lexical_decisions:
- source_word: ἐὰν τε γὰρ
  choice: Pois, ainda que
  rationale: Expressa a ligação argumentativa de γάρ e o valor concessivo da condição com ἐάν, de modo natural em português.
- source_word: μακρόβιοι γένωνται
  choice: tenham vida longa
  rationale: Comunica a possibilidade de alcançarem longevidade sem a rigidez pouco natural de «se tornem longevos».
- source_word: εἰς οὐθὲν λογισθήσονται
  choice: serão considerados como nada
  rationale: Preserva a voz passiva de λογισθήσονται e a avaliação radical expressa por εἰς οὐθέν.
- source_word: ἐπʼ ἐσχάτων
  choice: no fim
  rationale: Mantém o sentido temporal de desfecho ou etapa final sem especificar além do que o grego permite.
- source_word: ἄτιμον ... τὸ γῆρας αὐτῶν
  choice: a velhice deles será sem honra
  rationale: Trata ἄτιμον como adjetivo predicativo e conserva o campo semântico de honra e desonra sem introduzir necessariamente um agente que os desonre.
theological_decisions:
- issue: Valor moral dos ímpios apesar da longevidade
  choice: A longevidade não lhes assegura valor nem uma velhice honrada.
  alternative: Ler a frase apenas como observação social sobre sua reputação na velhice.
  rationale: O contexto de Sabedoria 3 contrapõe justos e ímpios, mas o texto não explicita quem faz essa avaliação; por isso, a tradução não acrescenta «diante de Deus» nem identifica um agente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «A velhice deles» evita a possível ambiguidade de «sua velhice», e «será sem honra» preserva a construção adjetival do grego.
