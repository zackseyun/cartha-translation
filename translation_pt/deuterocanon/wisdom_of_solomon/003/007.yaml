  text: and at the time of their visitation they will shine forth[a], and they will run about like sparks through stubble[b];
translation:
  language: pt
  text: e, no tempo de sua visitação, resplandecerão[a] e correrão como centelhas por entre a palha seca[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando forem visitados” — isto é, quando Deus intervier para inspecionar, julgar ou vindicar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por entre o restolho” ou “por entre os juncos”; a imagem grega é a do fogo avançando rapidamente pela vegetação seca e combustível.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρῷ
  choice: tempo
  rationale: «Tempo» expressa com naturalidade um momento decisivo ou oportuno, sem acrescentar ao texto a ideia explícita de que tenha sido previamente marcado.
- source_word: ἐπισκοπῆς
  choice: visitação
  rationale: «Visitação» preserva a amplitude do termo grego, que pode indicar inspeção, juízo ou intervenção divina em favor de alguém, sem decidir no texto principal entre essas nuances.
- source_word: ἀναλάμψουσιν
  choice: resplandecerão
  rationale: O verbo descreve o irromper de um brilho intenso; «resplandecerão» comunica essa manifestação luminosa em português corrente e digno.
- source_word: σπινθῆρες
  choice: centelhas
  rationale: «Centelhas» reproduz com precisão e vivacidade a imagem de pequenas partículas de fogo.
- source_word: καλάμῃ
  choice: palha seca
  rationale: Neste símile, o termo indica vegetação seca e combustível, como talos, restolho ou palha. «Palha seca» torna a imagem imediatamente clara ao leitor moderno.
- source_word: διαδραμοῦνται
  choice: correrão ... por entre
  rationale: A expressão comunica o movimento rápido das centelhas que se propagam através da vegetação seca, mantendo tanto o dinamismo do verbo quanto sua relação com o complemento.
theological_decisions:
- issue: Sentido de «o tempo de sua visitação»
  choice: Um tempo de intervenção divina referente aos justos, mantido amplo no texto principal
  alternative: O momento em que Deus os visita especificamente para vindicá-los, ou o momento de inspeção e juízo
  rationale: O contexto aponta para a vindicação dos justos, mas ἐπισκοπή possui alcance semântico mais amplo. «Visitação» conserva a tensão entre inspeção, juízo e intervenção favorável, sem impor uma interpretação mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Visitação» é deliberadamente mais formal por preservar a ambiguidade teológica do grego; a nota esclarece seus possíveis sentidos. A pontuação e a conjunção inicial mantêm a continuidade com o versículo anterior.
