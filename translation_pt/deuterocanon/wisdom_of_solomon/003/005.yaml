base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/005.yaml
  text: And after being disciplined a little[a], they will receive great good[c][b], because God tested them and found them worthy of himself.
translation:
  language: pt
  text: E, depois de serem disciplinados um pouco[a], receberão grandes benefícios[b], porque Deus os pôs à prova e os achou dignos dele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por pouco tempo” ou “em pequena medida”. O grego pode indicar duração ou extensão limitada.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “serão grandemente beneficiados”.
    reason: lexical_alternative
  - marker: c
    text: Ou “dignos para ele”. A expressão destaca que eles foram considerados aptos em relação ao próprio Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγα
  choice: um pouco
  rationale: Mantém de forma concisa o contraste com μεγάλα (“grandes”) e preserva a possível referência tanto à duração quanto à medida limitada da disciplina.
- source_word: παιδευθέντες
  choice: depois de serem disciplinados
  rationale: O particípio passivo pode envolver formação, correção ou castigo educativo. “Disciplinados” conserva essa amplitude melhor que “instruídos” ou “punidos”.
- source_word: μεγάλα εὐεργετηθήσονται
  choice: receberão grandes benefícios
  rationale: 'Expressa em português natural o futuro passivo de εὐεργετέω, acompanhado do neutro plural μεγάλα: eles serão alvo de grande benefício.'
- source_word: ἐπείρασεν
  choice: pôs à prova
  rationale: Indica prova destinada a revelar ou comprovar o caráter, sem sugerir indução ao mal, como poderia ocorrer com “tentou”.
- source_word: εὗρεν
  choice: achou
  rationale: Reproduz diretamente o sentido de constatação do verbo grego, sem transformar explicitamente a frase em declaração de mérito concedido.
- source_word: ἀξίους ἑαυτοῦ
  choice: dignos de si mesmo
  rationale: 'Preserva a construção reflexiva e sua orientação centrada em Deus: a dignidade ou aptidão é definida em relação ao próprio Deus.'
theological_decisions:
- issue: A relação entre o sofrimento e a prova divina
  choice: Deus os pôs à prova
  alternative: Deus os provou
  rationale: A formulação mantém a afirmação de que Deus os submeteu a uma prova, sem explicar além do texto se isso ocorreu por ação direta ou permissão, nem apresentar a prova como tentação para o mal.
- issue: O sentido da dignidade diante de Deus
  choice: os achou dignos de si mesmo
  alternative: os achou dignos para si
  rationale: A opção mais formal preserva a tensão da expressão grega, que pode indicar dignidade em relação a Deus ou aptidão para pertencer e servir a ele, sem escolher silenciosamente uma dessas nuances.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Pôs à prova” evita a ambiguidade indesejada de “tentou”; “disciplinados” mantém a dimensão formativa e corretiva do grego. Os marcadores seguem a ordem de ocorrência no texto.
