lexical_decisions:
- source_word: πορεία
  choice: partida
  rationale: No contexto da morte dos justos, designa o ato de ir embora. “Partida” preserva a imagem de deslocamento sem explicitar “morte”, termo que não aparece nesta oração.
- source_word: ἀφʼ ἡμῶν
  choice: do nosso meio
  rationale: Expressa o afastamento em relação aos que ficaram. “Do nosso meio” soa natural em português e mantém o ponto de vista relacional da expressão grega.
- source_word: σύντριμμα
  choice: ruína
  rationale: O termo pode indicar esmagamento, destruição ou ruína. Aqui caracteriza a calamidade que os observadores atribuíram à partida dos justos, sem exigir a ideia de aniquilação.
- source_word: οἱ δὲ
  choice: mas eles
  rationale: O δέ introduz um contraste incisivo entre a avaliação humana e a condição real dos justos.
- source_word: ἐν εἰρήνῃ
  choice: em paz
  rationale: Mantém de perto a expressão grega e preserva sua amplitude, que pode abranger descanso, segurança e bem-estar.
theological_decisions:
- issue: Se a primeira oração deve ser apresentada como percepção humana ou como realidade objetiva
  choice: foi considerada uma ruína
  alternative: era uma ruína
  rationale: 'Embora o verbo não se repita nesta oração, ele é subentendido a partir do contexto anterior, que relata a avaliação dos insensatos. Tornar essa elipse explícita em português evita apresentar como fato aquilo que o texto contrasta com a realidade: eles estão em paz.'
translation_notes:
  register: Português atual, digno e acessível, com construção natural para leitores brasileiros e compreensão internacional. A elipse verbal grega foi explicitada com “foi considerada”, conforme o contexto imediato, sem eliminar o contraste entre percepção humana e realidade.
