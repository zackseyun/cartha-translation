  text: e a partida deles do nosso meio foi considerada uma ruína[a]; mas eles estão em paz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a partida deles do nosso meio pareceu uma calamidade”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão grega “em paz” pode indicar não apenas ausência de conflito, mas também descanso, segurança e bem-estar.
