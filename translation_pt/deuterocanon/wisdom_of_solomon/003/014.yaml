base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/014.yaml
  text: And the eunuch who has not worked lawlessness with his hand, nor conceived evil things against the Lord, will be given the chosen grace of faith and a more delightful inheritance in the temple of the Lord.
translation:
  language: pt
  text: E o eunuco que não praticou transgressão com sua mão, nem concebeu males contra o Senhor, receberá uma graça especial da fé[a] e uma herança mais agradável no templo do Senhor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um dom especial de fé”, “a graça especial da fidelidade” ou “uma graça excelente de confiança”. A expressão grega é compacta e permite mais de uma nuance tanto para “graça” como para “fé”.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma porção mais agradável” ou “um quinhão mais desejável” no templo do Senhor.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχος
  choice: eunuco
  rationale: O termo grego designa especificamente um eunuco; manter o termo concreto preserva a força social e teológica do contexto.
- source_word: ὁ μὴ ἐργασάμενος ἐν χειρὶ ἀνόμημα
  choice: que não praticou transgressão com sua mão
  rationale: “Praticou” expressa naturalmente ἐργάζομαι em contexto moral; “transgressão” conserva o sentido de ato contrário à lei, e “com sua mão” mantém a imagem corporal no singular.
- source_word: μηδὲ ἐνθυμηθεὶς κατὰ τοῦ κυρίου πονηρά
  choice: nem concebeu males contra o Senhor
  rationale: “Concebeu” comunica a formação interior de pensamentos ou propósitos, em contraste com o ato exterior da oração anterior; o plural “males” corresponde ao neutro plural πονηρά.
- source_word: δοθήσεται
  choice: receberá
  rationale: O futuro passivo grego significa literalmente “será dado a ele”; a formulação ativa com sujeito beneficiário é mais natural em português e preserva o sentido.
- source_word: τῆς πίστεως χάρις ἐκλεκτὴ
  choice: uma graça especial da fé
  rationale: A expressão grega é compacta e ambígua. “Graça” preserva χάρις, “fé” é a correspondência principal de πίστις, e “especial” comunica o valor qualitativo de ἐκλεκτή sem sugerir necessariamente eleição pessoal.
- source_word: κλῆρος
  choice: herança
  rationale: No contexto de recompensa, “herança” comunica de modo natural uma porção concedida, embora o termo também possa significar “porção” ou “quinhão”.
- source_word: ἐν ναῷ Κυρίου
  choice: no templo do Senhor
  rationale: Tradução direta e reconhecível de ναός e Κύριος.
- source_word: θυμηρέστερος
  choice: mais agradável
  rationale: Mantém o comparativo e expressa a ideia de algo mais aprazível ou desejável, concordando naturalmente com “herança”.
theological_decisions:
- issue: Sentido de πίστις em τῆς πίστεως χάρις ἐκλεκτή
  choice: fé
  alternative: fidelidade; confiança
  rationale: “Fé” preserva a correspondência lexical principal e não resolve indevidamente a expressão comprimida; as demais nuances são registradas em nota.
- issue: Relação sintática em τῆς πίστεως χάρις ἐκλεκτή
  choice: uma graça especial da fé
  alternative: um dom especial de fé; a graça especial da fidelidade
  rationale: O genitivo e o alcance de ἐκλεκτή admitem mais de uma análise. A tradução principal permanece próxima da forma grega, e a nota conserva as alternativas plausíveis.
- issue: Tradução de κύριος
  choice: Senhor
  alternative: SENHOR; soberano
  rationale: “Senhor” é a forma portuguesa tradicional e contextualmente apropriada, sem impor uma especificação não explícita na forma grega.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Praticou transgressão” evita o pouco natural “trabalhou a transgressão”, enquanto “com sua mão” conserva a imagem concreta do grego. Os marcadores [a] e [b] aparecem no texto principal.
