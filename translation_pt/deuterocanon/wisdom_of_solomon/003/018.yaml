  text: Even if they die quickly[a], they have no hope, nor comfort on the day of judgment.
translation:
  language: pt
  text: Mesmo que morram rapidamente, não têm esperança nem consolo no dia do julgamento[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dia da decisão” ou “dia do discernimento”. O termo grego pode indicar uma avaliação ou decisão determinante.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε
  choice: Mesmo que
  rationale: Expressa de modo natural a força concessiva da condição no contexto.
- source_word: ὀξέως
  choice: rapidamente
  rationale: Preserva o sentido básico de velocidade do advérbio, sem adotar a interpretação mais específica de morte prematura.
- source_word: τελευτήσωσιν
  choice: morram
  rationale: Neste contexto, o verbo se refere claramente ao fim da vida; “morram” é direto e idiomático.
- source_word: ἐλπίδα
  choice: esperança
  rationale: É o equivalente corrente e adequado à expectativa escatológica do contexto.
- source_word: ἡμέρᾳ διαγνώσεως
  choice: dia do julgamento
  rationale: Comunica com clareza a ideia de avaliação decisiva no contexto escatológico, enquanto a nota preserva outras possibilidades lexicais.
- source_word: παραμύθιον
  choice: consolo
  rationale: Reproduz de maneira concisa e natural a ideia de conforto ou consolação.
theological_decisions:
- issue: Força escatológica de ἡμέρᾳ διαγνώσεως
  choice: dia do julgamento
  alternative: dia da decisão; dia do discernimento
  rationale: O contexto contrasta o destino dos justos e dos ímpios após a morte. “Dia do julgamento” mantém essa força sem ampliar o texto, e a nota registra a amplitude semântica do grego.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A repetição de “não” do grego é condensada na coordenação portuguesa “nem”, sem perda de sentido.
