base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/001.yaml
  text: But the souls of the righteous are in the hand of God[a], and no torment will ever touch them.
translation:
  language: pt
  text: Mas as almas dos justos estão na mão de Deus, e tormento algum jamais as tocará.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aflição alguma jamais as tocará”. O termo grego βάσανος pode indicar sofrimento intenso ou tormento.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαίων
  choice: dos justos
  rationale: O adjetivo no genitivo plural é usado como substantivo. “Dos justos” é conciso, natural no registro bíblico português e preserva a categoria moral e teológica do grego.
- source_word: ψυχαὶ
  choice: almas
  rationale: Embora ψυχή também possa significar “vida” ou “pessoa”, o contexto imediato, que contrasta a morte aparente com a continuidade dos justos, favorece “almas” e preserva a força antropológica do texto sem a explicar além do que ele afirma.
- source_word: ἐν χειρὶ θεοῦ
  choice: na mão de Deus
  rationale: Mantém a metáfora bíblica inteligível de poder, posse, cuidado e proteção, sem reduzi-la a apenas uma dessas ideias.
- source_word: οὐ μὴ ἅψηται
  choice: jamais as tocará
  rationale: A construção οὐ μή com o subjuntivo aoristo expressa negação enfática. “Jamais” comunica essa força, enquanto “tocará” preserva a imagem do verbo grego.
- source_word: αὐτῶν
  choice: as
  rationale: O pronome retoma “almas”. Embora o grego empregue o genitivo regido por ἅπτομαι, o português idiomático pede objeto direto.
- source_word: βάσανος
  choice: tormento algum
  rationale: βάσανος pode indicar tormento, sofrimento severo ou aflição. “Tormento” preserva sua intensidade; “algum” em posição pós-nominal reforça naturalmente a negação em português.
theological_decisions:
- issue: Sentido de ψυχαί em relação à existência após a morte
  choice: Manter “almas” no texto principal
  alternative: “vidas” ou “pessoas”
  rationale: O contexto fala dos justos para além de sua morte visível. “Almas” conserva a força antropológica e escatológica da passagem sem impor uma doutrina mais detalhada do que o próprio texto oferece.
- issue: Amplitude da expressão ἐν χειρὶ θεοῦ
  choice: Traduzir literalmente como “na mão de Deus”
  alternative: “sob a proteção de Deus” ou “ao cuidado de Deus”
  rationale: A tradução literal conserva a amplitude da metáfora, que pode envolver proteção, cuidado, poder e posse, em vez de escolher apenas uma dessas dimensões.
- issue: Alcance semântico de βάσανος
  choice: Usar “tormento” e registrar “aflição” em nota
  alternative: Usar “aflição” no texto principal
  rationale: “Tormento” representa bem a intensidade possível do termo no contexto, enquanto a nota preserva sua genuína amplitude lexical.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem “tormento algum” soa natural, conserva o singular grego e reforça a negação enfática. O marcador foi colocado após a oração que contém βάσανος, termo ao qual a nota se refere.
