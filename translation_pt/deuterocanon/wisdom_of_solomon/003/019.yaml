  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/019.yaml
  text: For the ends of an unrighteous generation are grievous[a].
translation:
  language: pt
  text: Pois os fins de uma geração injusta são penosos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os fins da descendência dos injustos” ou “os fins de uma linhagem perversa”. O grego traduzido por “geração” também pode indicar descendência ou linhagem.'
    reason: 'Leitura alternativa: γενεά admite tanto um sentido coletivo de geração quanto um sentido genealógico de descendência ou linhagem.'
lexical_decisions:
- source_word: γενεᾶς
  choice: geração
  rationale: O termo pode indicar geração, descendência ou linhagem. “Geração” mantém o sentido coletivo e a concisão do grego sem impor uma interpretação estritamente biológica.
- source_word: ἀδίκου
  choice: injusta
  rationale: “Injusta” corresponde diretamente ao sentido moral de ἄδικος e, neste contexto sapiencial, não limita necessariamente o termo à injustiça jurídica.
- source_word: χαλεπὰ
  choice: penosos
  rationale: O adjetivo exprime algo difícil, doloroso ou severo. “Penosos” preserva o tom solene e a gravidade dos resultados sem acrescentar imagem ausente do grego.
- source_word: τὰ τέλη
  choice: os fins
  rationale: Mantém o plural do grego e sua possível referência aos desfechos ou destinos finais, embora “o fim” fosse mais idiomático em português.
theological_decisions:
- issue: Se γενεᾶς ἀδίκου deve ser entendido como categoria moral coletiva ou como descendência/linhagem dos injustos.
  choice: uma geração injusta
  alternative: a descendência dos injustos; uma linhagem perversa
  rationale: A formulação escolhida preserva a caracterização moral coletiva sem introduzir uma doutrina hereditária mais forte do que o texto exige. A nota mantém a leitura genealógica possível, especialmente relevante no contexto próximo sobre descendentes e falta de filhos.
translation_notes:
  register: Português atual, claro e solene, com boa legibilidade brasileira. Conserva-se o plural incomum “os fins” para refletir τὰ τέλη e preservar a ideia de desfechos ou destinos.
