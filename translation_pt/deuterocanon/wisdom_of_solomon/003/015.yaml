  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/015.yaml
  text: For the fruit of good labors is glorious[a], and the root of understanding does not fail.
translation:
  language: pt
  text: Pois o fruto dos bons esforços é honroso, e a raiz do discernimento[a] não falha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “prudência”.
    reason: φρόνησις pode designar discernimento, sensatez ou prudência prática.
lexical_decisions:
- source_word: ἀγαθῶν πόνων
  choice: bons esforços
  rationale: A expressão conserva a qualidade positiva de ἀγαθῶν e o sentido de empenho árduo de πόνων, evitando que “trabalhos” seja entendido apenas como ocupações ou empregos.
- source_word: καρπός
  choice: fruto
  rationale: Mantém a metáfora agrícola, que forma um paralelo intencional com “raiz” na segunda oração.
- source_word: εὐκλεής
  choice: honroso
  rationale: O termo indica boa fama, honra ou reputação distinta. “Honroso” comunica esse valor com naturalidade, sem intensificá-lo indevidamente como poderia ocorrer com “glorioso”.
- source_word: ἀδιάπτωτος
  choice: não falha
  rationale: Reproduz de modo claro a ideia de não cair, não ceder ou não fracassar, preservando a afirmação de estabilidade duradoura.
- source_word: ῥίζα
  choice: raiz
  rationale: Preserva a imagem agrícola e o paralelismo com “fruto”.
- source_word: φρονήσεως
  choice: discernimento
  rationale: φρόνησις denota compreensão prática, sensatez ou prudência. “Discernimento” é atual e abrangente, além de evitar confundi-lo com σοφία, normalmente traduzido por “sabedoria”.
theological_decisions:
- issue: Relação de φρόνησις com a terminologia de sabedoria
  choice: discernimento
  alternative: prudência; sabedoria; entendimento
  rationale: “Discernimento” preserva o caráter prático e intelectual do termo sem apagar a distinção lexical entre φρόνησις e σοφία. A alternativa tradicional “prudência” é registrada em nota.
- issue: Estrutura metafórica de fruto e raiz
  choice: preservar explicitamente as duas metáforas
  alternative: explicitar como resultados e fundamentos duradouros
  rationale: O grego apresenta um paralelismo proverbial baseado em imagens agrícolas; mantê-las evita uma paráfrase interpretativa e conserva a forma literária.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção proverbial concisa. A conjunção inicial “Pois” preserva o valor explicativo de γάρ.
