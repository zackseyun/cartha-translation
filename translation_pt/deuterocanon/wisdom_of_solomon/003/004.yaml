  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/004.yaml
  text: For even if they are punished in the sight of men[a], their hope is full of immortality.
translation:
  language: pt
  text: Pois, mesmo que sejam castigados aos olhos das pessoas[a], a esperança deles está cheia de imortalidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sejam disciplinados” ou “sejam corrigidos”. O verbo grego pode indicar sofrimento punitivo ou corretivo; aqui, “aos olhos das pessoas” destaca a aparência humana em contraste com a realidade final.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Pois
  rationale: Introduz a explicação enfática do contraste precedente; em português, “Pois” expressa naturalmente a relação causal sem tornar pesada a frase.
- source_word: ἐν ὄψει ἀνθρώπων
  choice: aos olhos das pessoas
  rationale: Preserva o ponto de vista humano e aparente indicado por ὄψις. “Pessoas” comunica o sentido genérico de ἀνθρώπων em português atual e evita que “homens” seja entendido apenas como masculino.
- source_word: ἐὰν κολασθῶσιν
  choice: ainda que sejam castigados
  rationale: A construção concessiva se ajusta ao contexto e mantém a força de κολάζω, que pode indicar punição ou correção, sem definir por si só a origem ou a finalidade do sofrimento.
- source_word: ἡ ἐλπὶς αὐτῶν
  choice: a esperança deles
  rationale: Tradução possessiva direta e natural, referindo-se à esperança dos justos.
- source_word: ἀθανασίας πλήρης
  choice: está cheia de imortalidade
  rationale: Mantém ἀθανασίας como genitivo de conteúdo ou qualidade e reproduz a predicação de πλήρης, com a cópula exigida em português.
theological_decisions:
- issue: Sentido do sofrimento atribuído aos justos
  choice: “sejam castigados”, enquadrado por “aos olhos das pessoas”
  alternative: “sejam disciplinados” ou “sejam corrigidos”
  rationale: A tradução conserva a força potencialmente punitiva de κολάζω, mas deixa o próprio contraste do verso indicar que essa é a aparência segundo a perspectiva humana, sem afirmar que Deus tenha condenado os justos.
- issue: Relação da esperança com a imortalidade
  choice: “a esperança deles está cheia de imortalidade”
  alternative: “a esperança deles é de imortalidade”
  rationale: A formulação escolhida preserva a imagem incomum e teologicamente expressiva do grego, em vez de reduzi-la apenas ao objeto esperado.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção conserva a tensão entre a aparência humana de castigo e a esperança dos justos, sem explicá-la além do texto.
