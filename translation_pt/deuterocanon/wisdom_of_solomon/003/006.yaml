base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/006.yaml
  text: Like gold in a furnace he tested them[b][a], and like a whole burnt offering he accepted them.
translation:
  language: pt
  text: Como ouro numa fornalha[a], ele os pôs à prova; e, como uma oferta inteiramente queimada[b], ele os aceitou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “num cadinho”; o termo grego pode indicar um recipiente ou lugar usado para fundir e refinar metais.
    reason: lexical_alternative
  - marker: b
    text: Ou “como um holocausto”; o termo grego designa uma oferta sacrificial consumida por inteiro.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς χρυσὸν
  choice: Como ouro
  rationale: Preserva de modo claro e natural a comparação introduzida por ὡς e a imagem do ouro refinado.
- source_word: ἐν χωνευτηρίῳ
  choice: numa fornalha
  rationale: χωνευτήριον designa recipiente ou lugar em que o metal é fundido e refinado. “Fornalha” comunica a imagem com clareza, enquanto “cadinho” permanece como alternativa mais técnica na nota.
- source_word: ἐδοκίμασεν
  choice: pôs à prova
  rationale: Expressa o sentido de testar para comprovar a qualidade ou autenticidade, em harmonia com a metáfora do refino, sem acrescentar explicitamente a ideia de purificação.
- source_word: αὐτούς
  choice: os
  rationale: Mantém o pronome como objeto direto, retomando os justos mencionados no contexto.
- source_word: ὁλοκάρπωμα θυσίας
  choice: uma oferta inteiramente queimada
  rationale: Comunica a especificidade cultual de uma oferta consumida por completo, sem a possível ambiguidade moderna de “holocausto”. O valor sacrificial já está contido em “oferta” e no contexto.
- source_word: προσεδέξατο
  choice: aceitou
  rationale: No contexto sacrificial, traduz naturalmente a ideia de receber favoravelmente.
theological_decisions:
- issue: Sentido cultual de ὁλοκάρπωμα θυσίας
  choice: uma oferta inteiramente queimada
  alternative: um holocausto; uma oferta queimada por inteiro
  rationale: A formulação preserva a imagem sacrificial e a noção de consumo total da oferta, sem transformar a metáfora em afirmação doutrinária adicional nem depender do sentido moderno extrabíblico de “holocausto”.
- issue: Nuance de δοκιμάζω na metáfora do ouro
  choice: pôs à prova
  alternative: provou; refinou
  rationale: “Pôs à prova” conserva a dimensão de teste e comprovação. “Refinou” tornaria explícito um resultado que o verbo grego, embora inserido na imagem metalúrgica, não declara por si só.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. “Fornalha” foi preferido no texto por ser mais amplamente compreensível que “cadinho”; “oferta inteiramente queimada” mantém a precisão cultual sem evocar prioritariamente o uso moderno de “holocausto”.
