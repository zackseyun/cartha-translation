base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/003/010.yaml
  text: But the ungodly will have punishment according to what they reasoned[b][a], having neglected the righteous man and having departed from the Lord.
translation:
  language: pt
  text: Mas os ímpios receberão punição conforme o que pensaram,[a] por terem negligenciado o justo[b] e se afastado do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conforme o que calcularam” ou “pelos planos que tramaram”. O grego ressalta que a punição corresponde aos próprios pensamentos e propósitos deles.
    reason: lexical_alternative
  - marker: b
    text: Ou “o homem justo”. O singular pode referir-se à figura justa representativa no argumento do livro.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσεβεῖς
  choice: ímpios
  rationale: Preserva a dimensão moral e religiosa de ἀσεβής e é corrente no registro bíblico português.
- source_word: καθʼ ἃ ἐλογίσαντο
  choice: conforme aquilo que conceberam
  rationale: Mantém a correspondência expressa por κατά e o sentido mental de λογίζομαι, sem restringi-lo indevidamente a uma trama maliciosa.
- source_word: ἕξουσιν ἐπιτιμίαν
  choice: receberão punição
  rationale: Exprime naturalmente em português a penalidade indicada por ἐπιτιμία; o futuro conserva a força de ἕξουσιν.
- source_word: ἀμελήσαντες τοῦ δικαίου
  choice: pois desprezaram o justo
  rationale: O particípio fornece a razão ou circunstância da punição. 'Desprezaram' comunica a falta deliberada de consideração de ἀμελέω, enquanto 'o justo' conserva o singular substantivado.
- source_word: τοῦ κυρίου ἀποστάντες
  choice: se afastaram do Senhor
  rationale: Reproduz de modo natural a ideia de separação ou abandono em ἀποστάντες sem recorrer ao termo técnico 'apostataram'.
theological_decisions:
- issue: Referente de τοῦ δικαίου
  choice: o justo, como figura pessoal singular e representativa
  alternative: os justos coletivamente; a justiça como princípio abstrato
  rationale: O artigo e o adjetivo substantivado estão no singular masculino, e o contexto de Sabedoria 2–5 favorece uma figura justa representativa. A tradução não a identifica mais estreitamente.
- issue: Sentido de καθʼ ἃ ἐλογίσαντο
  choice: a punição corresponde ao que os ímpios conceberam
  alternative: punição especificamente pelos planos que tramaram
  rationale: O verbo pode abranger pensar, calcular ou planejar. A formulação principal preserva essa amplitude, e a nota registra as opções contextuais.
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Soberano
  rationale: Neste contexto judaico-grego, κύριος se refere a Deus; 'Senhor' preserva o peso teológico e o uso bíblico consolidado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação de dois particípios gregos foi vertida por uma oração causal natural. As notas preservam a amplitude de λογίζομαι e a singularidade pessoal de τοῦ δικαίου.
