revisions:
- from: Mas os ímpios receberão punição conforme aquilo que conceberam,[a] pois desprezaram o justo[b] e se afastaram do Senhor.
  to: Mas os ímpios receberão punição conforme o que pensaram,[a] por terem negligenciado o justo[b] e se afastado do Senhor.
  rationale: A revisão emprega “pensaram” para manter o sentido amplo de λογίζομαι, substitui “desprezaram” por “negligenciado” para refletir ἀμελέω sem intensificação indevida e verte os particípios com “por terem” em vez de introduzir a causalidade explícita de “pois”. A nota sobre o justo permanece informativa, mas não resolve de forma dogmática o referente do singular.
