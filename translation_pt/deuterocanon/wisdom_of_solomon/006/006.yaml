translation:
  language: pt
  text: Pois o menor é digno de misericórdia[a], mas os poderosos serão examinados com todo o rigor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o menor é desculpável por misericórdia». A expressão grega também pode sugerir que ele é tratado com indulgência ou compreensão.'
    reason: lexical_alternative
  - marker: b
    text: 'O grego emprega um jogo de palavras: literalmente, «os poderosos serão poderosamente examinados». «Com todo o rigor» transmite o sentido, mas não reproduz a repetição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάχιστος
  choice: o menor
  rationale: O superlativo substantivado indica a pessoa de menor posição ou poder e mantém o contraste direto com «os poderosos».
- source_word: συγγνωστός ἐστιν ἐλέους
  choice: se concede perdão por misericórdia
  rationale: A formulação portuguesa expressa com naturalidade a ideia condensada de alguém ser desculpável ou tratado com indulgência, sem transformar a misericórdia em direito automático.
- source_word: δυνατοὶ
  choice: os poderosos
  rationale: No contexto dirigido a governantes, refere-se aos que detêm poder ou autoridade.
- source_word: δυνατῶς
  choice: com todo o rigor
  rationale: Comunica a intensidade e a severidade da prestação de contas em português natural; uma nota registra o jogo etimológico do grego.
- source_word: ἐτασθήσονται
  choice: serão examinados
  rationale: Preserva o futuro passivo e o sentido de investigação ou escrutínio judicial, sem especificar antecipadamente o resultado.
theological_decisions:
- issue: Contraste entre a misericórdia concedida ao menor e o exame dos poderosos
  choice: Manter o contraste entre tratamento misericordioso e escrutínio rigoroso, sem ampliá-lo numa doutrina sobre favoritismo ou condenação.
  alternative: Explicitar que os humildes serão perdoados e os poderosos severamente julgados.
  rationale: O grego afirma uma diferença de responsabilidade ligada ao poder, mas não apresenta neste versículo uma formulação doutrinária completa nem declara o resultado final do exame.
translation_notes:
  register: Português moderno, claro e digno, com leve tom judicial. A ordem das orações e o contraste retórico do grego foram preservados; a construção comprimida da primeira oração foi tornada idiomática, e o jogo de palavras da segunda foi explicado em nota.
