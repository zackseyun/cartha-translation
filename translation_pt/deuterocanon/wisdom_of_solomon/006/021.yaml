base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/021.yaml
  text: Therefore[a], if you delight in thrones and scepters, O rulers of peoples, honor wisdom, so that you may reign forever.
translation:
  language: pt
  text: Portanto, se vocês se deleitam com tronos e cetros, governantes dos povos[a], honrem a sabedoria, para que reinem para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tiranos dos povos”. O termo grego pode designar governantes em geral, mas, em certos contextos, tem sentido mais negativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδεσθε
  choice: se deleitam
  rationale: Expressa prazer ou satisfação e preserva o tom elevado da exortação sem deixar de ser compreensível em português atual.
- source_word: θρόνοις καὶ σκήπτροις
  choice: com tronos e cetros
  rationale: Mantém as duas imagens concretas e tradicionais da autoridade régia.
- source_word: τύραννοι λαῶν
  choice: governantes dos povos
  rationale: No grego helenístico, τύραννοι pode designar governantes sem necessariamente conter o sentido fortemente pejorativo de “tiranos” no português moderno; “dos povos” preserva o plural λαῶν.
- source_word: τιμήσατε
  choice: honrem
  rationale: Reproduz diretamente a força imperativa e o sentido de conferir honra ou estima.
- source_word: σοφίαν
  choice: a sabedoria
  rationale: É o equivalente natural e preserva tanto o sentido prático quanto a possível ressonância personificada da Sabedoria no livro.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: Traduz de modo idiomático a expressão de duração contínua.
- source_word: βασιλεύσητε
  choice: reinem
  rationale: Conserva a nuance especificamente régia do verbo e sua ligação com “tronos e cetros”.
theological_decisions:
- issue: Força de τύραννοι na interpelação aos líderes políticos
  choice: governantes dos povos
  alternative: tiranos dos povos
  rationale: O termo grego admite um uso relativamente neutro para soberanos ou governantes. Traduzir diretamente por “tiranos” poderia impor uma condenação moral mais forte do que o contexto exortativo exige; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com formas de terceira pessoa associadas a “vocês” para ampla legibilidade brasileira. As imagens régias e a estrutura condicional e final do grego foram preservadas.
