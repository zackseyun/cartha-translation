  text: But for the mighty, a stern inquiry is coming.
translation:
  language: pt
  text: Mas sobre os poderosos recai uma investigação severa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς δὲ κραταιοῖς
  choice: Mas sobre os poderosos
  rationale: κραταιός designa os fortes ou poderosos no contexto de governantes; a construção com δέ marca contraste, traduzido por “Mas”.
- source_word: ἰσχυρά
  choice: rigorosa
  rationale: O adjetivo intensifica a investigação como severa, exigente ou rigorosa; “rigorosa” é natural em português e preserva o tom judicial.
- source_word: ἐφίσταται
  choice: recai
  rationale: O presente médio exprime algo que sobrevém, se apresenta ou está prestes a atingir alguém. “Recai” comunica de modo idiomático que a investigação se dirige aos poderosos, sem explicitar indevidamente o tempo futuro.
- source_word: ἔραυνα
  choice: uma investigação
  rationale: ἔραυνα significa exame, averiguação ou investigação; neste contexto de prestação de contas, “investigação” mantém a força judicial.
theological_decisions:
- issue: Agente e natureza da investigação
  choice: Não explicitar quem investiga nem acrescentar “juízo”.
  alternative: “Deus os submeterá a um juízo rigoroso.”
  rationale: O grego não nomeia o agente nesta oração e emprega “investigação”, não o termo específico para “juízo”; a tradução preserva essa abertura.
- issue: Valor temporal de ἐφίσταται
  choice: Usar o presente idiomático “recai”.
  alternative: “está por vir” ou “virá”.
  rationale: A forma grega está no presente e pode sugerir iminência. O presente português conserva a vivacidade sem fixar exclusivamente uma leitura futura.
translation_notes:
  register: Português moderno, digno e claro, com leitura natural no Brasil e compreensão internacional. A frase breve conserva o contraste e a solenidade do grego.
