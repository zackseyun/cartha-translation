  text: Portanto, o desejo por sabedoria conduz à realeza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conduz a um reino” ou “ao domínio real”. A palavra grega pode indicar realeza, reinado, domínio real ou reino; neste contexto, “realeza” se ajusta melhor ao foco em alcançar a condição de governante.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμία
  choice: desejo
  rationale: Expressa uma aspiração forte sem as conotações negativas que outros termos poderiam sugerir.
- source_word: ἄρα
  choice: portanto
  rationale: Marca de modo claro e natural a conclusão inferida da argumentação anterior.
- source_word: σοφίας
  choice: sabedoria
  rationale: Correspondente usual que preserva a amplitude prática, filosófica e teológica do termo no livro.
- source_word: ἀνάγει
  choice: conduz
  rationale: Comunica naturalmente o movimento figurado em direção a um objetivo ou condição.
- source_word: ἐπὶ βασιλείαν
  choice: à realeza
  rationale: Neste contexto, indica movimento em direção à condição ou dignidade régia, sem restringir βασιλεία a um território.
theological_decisions:
- issue: Sentido de βασιλεία neste aforismo sapiencial
  choice: realeza
  alternative: reino; domínio real
  rationale: A sequência argumentativa trata de alcançar o governo por meio da sabedoria. “Realeza” preserva o sentido de condição ou dignidade régia, embora o grego também possa designar reino ou domínio real.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação concisa preserva o caráter conclusivo do aforismo e mantém em nota a amplitude semântica de βασιλεία.
