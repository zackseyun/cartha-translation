base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/019.yaml
  text: and incorruptibility makes one near to God[a].
translation:
  language: pt
  text: e a incorruptibilidade faz com que alguém esteja perto de Deus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e a imortalidade faz com que alguém esteja perto de Deus”. O termo grego pode indicar imperecibilidade ou ausência de corrupção; aqui, “incorruptibilidade” preserva o sentido mais amplo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφθαρσία
  choice: incorruptibilidade
  rationale: Preserva o sentido amplo de uma condição livre de corrupção ou deterioração, sem restringir o termo à ideia de vida sem fim.
- source_word: ἐγγὺς
  choice: perto
  rationale: Expressa de modo corrente e direto a proximidade relacional indicada pelo grego, sem sugerir união mística.
- source_word: εἶναι
  choice: estar
  rationale: Com ἐγγὺς, o infinitivo descreve o estado de estar perto; em português, «estar» é mais idiomático que «ser» nesse contexto.
- source_word: ποιεῖ
  choice: faz alguém estar
  rationale: Mantém o valor causativo do verbo e explicita com o pronome genérico «alguém» o objeto humano subentendido no contexto.
- source_word: θεοῦ
  choice: de Deus
  rationale: O genitivo ligado a ἐγγὺς indica proximidade a Deus; a construção portuguesa idiomática é «perto de Deus».
theological_decisions:
- issue: Objeto implícito da oração
  choice: faz alguém estar perto de Deus
  alternative: aproxima de Deus; faz [a sabedoria] estar perto de Deus
  rationale: O grego não expressa o objeto, mas o contexto aponta para a pessoa que busca ou possui a sabedoria. «Alguém» preserva a referência humana genérica sem identificar indevidamente a sabedoria como objeto.
- issue: Sentido de ἀφθαρσία
  choice: incorruptibilidade
  alternative: imortalidade; imperecibilidade
  rationale: «Incorruptibilidade» conserva tanto a dimensão ontológica quanto a possível ressonância moral do termo; «imortalidade» é possível, mas mais estreita e interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a cadeia argumentativa do contexto e a concisão do grego, explicitando apenas o objeto humano exigido pela naturalidade do português.
