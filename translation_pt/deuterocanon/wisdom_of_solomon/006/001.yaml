  text: Therefore listen[a], O kings, and understand; learn[b], O judges of the ends of the earth.
translation:
  language: pt
  text: Portanto, escutem[a], ó reis, e entendam; aprendam, juízes dos confins da terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ouçam”. O imperativo grego admite ambas as traduções; “escutem” destaca a ideia de prestar atenção.
    reason: lexical_alternative
  - marker: b
    text: A expressão “juízes dos confins da terra” dirige-se aos que exercem o julgamento até nas regiões mais distantes do mundo, ressaltando o alcance universal da advertência.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀκούσατε
  choice: escutem
  rationale: O imperativo plural de ἀκούω é aqui um chamado à atenção obediente; “escutem” comunica isso melhor que o mais neutro “ouçam”.
- source_word: οὖν
  choice: portanto
  rationale: Marca a conclusão ou transição inferencial ligada ao argumento anterior.
- source_word: βασιλεῖς
  choice: reis
  rationale: Mantém o sentido específico do substantivo e a forma de tratamento direto.
- source_word: σύνετε
  choice: entendam
  rationale: Expressa de modo direto o imperativo de συνίημι, sem acrescentar a interpretação mais ampla “sejam sábios”.
- source_word: μάθετε
  choice: aprendam
  rationale: É o equivalente corrente e direto do imperativo de μανθάνω.
- source_word: δικασταί
  choice: juízes
  rationale: Preserva a função judicial indicada pelo termo, sem ampliá-la para governantes em geral.
- source_word: περάτων γῆς
  choice: dos confins da terra
  rationale: Reproduz com naturalidade em português a imagem das extremidades ou regiões mais distantes da terra e mantém o alcance universal da convocação.
