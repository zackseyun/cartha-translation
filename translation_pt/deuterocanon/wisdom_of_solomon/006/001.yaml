translation_notes:
  register: Português moderno, digno e amplamente compreensível, com concordância verbal de terceira pessoa do plural (“escutem”, “entendam”, “aprendam”), natural no Brasil e inteligível internacionalmente. A formulação conserva o paralelismo dos três imperativos e a expressão bíblica “confins da terra”.
