  text: She hastens to make herself known to those who desire her[a].
translation:
  language: pt
  text: Ela se adianta, dando-se a conhecer aos que a desejam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: «Ela se antecipa aos que a desejam para ser conhecida de antemão». O grego é condensado; o texto principal expressa o sentido provável de que a Sabedoria toma a iniciativa de se dar a conhecer aos que a desejam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φθάνει
  choice: se antecipa
  rationale: O verbo exprime chegar antes, antecipar-se ou tomar a iniciativa. “Se antecipa” preserva essa prioridade de modo natural, sem reduzir o sentido apenas à rapidez.
- source_word: τοὺς ἐπιθυμοῦντας
  choice: aos que a desejam
  rationale: O particípio indica desejo intenso. O objeto feminino “a” é recuperado do contexto imediato, no qual a Sabedoria é personificada.
- source_word: προγνωσθῆναι
  choice: para se dar a conhecer
  rationale: Embora a forma seja passiva e possa significar literalmente “ser conhecida de antemão”, a construção grega é condensada. Esta formulação comunica que a Sabedoria toma a iniciativa de tornar-se conhecida, preservando a relação com a ideia de anterioridade expressa por φθάνει.
theological_decisions:
- issue: Personificação feminina da Sabedoria
  choice: Manter a referência pessoal feminina em “Ela”, “se” e “a”
  alternative: Tratar a sabedoria de modo impessoal
  rationale: O contexto grego apresenta a Sabedoria como figura feminina personificada; a tradução conserva esse traço literário e teológico sem lhe impor uma identificação doutrinária adicional.
- issue: Ambiguidade da iniciativa e do conhecimento prévio
  choice: Texto corrente idiomático, acompanhado de nota com a forma mais literal
  alternative: “Ela chega antes dos que desejam ser conhecidos de antemão”
  rationale: A formulação estritamente literal é obscura e pode sugerir que os desejosos, e não a Sabedoria, sejam o foco do conhecimento. A nota preserva a compressão e a ambiguidade formal do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Se antecipa” conserva a iniciativa anterior da Sabedoria; “se dar a conhecer” evita uma literalidade opaca. O marcador [a] aparece no texto principal.
