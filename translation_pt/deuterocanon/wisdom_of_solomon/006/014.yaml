  text: Whoever rises early for her will not grow weary[b][a], for he will find her sitting beside his gates.
translation:
  language: pt
  text: Quem cedo se levanta em busca dela[a] não se cansará, pois a encontrará sentada junto aos portões dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Quem se levanta cedo por ela”. O verbo grego se refere a levantar-se cedo e, por extensão, a buscá-la com prontidão e empenho.'
    reason: lexical_alternative
  - marker: b
    text: A imagem apresenta a Sabedoria personificada já presente, sentada e esperando à entrada de quem a busca.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ὀρθρίσας ἐπ' αὐτὴν
  choice: Quem cedo se levanta em busca dela
  rationale: ὀρθρίζω refere-se literalmente a levantar-se cedo e, neste contexto, sugere empenho diligente em direção à Sabedoria personificada. A formulação conserva a imagem de levantar cedo e torna explícito, sem perder a metáfora, o propósito indicado por ἐπ' αὐτήν.
- source_word: οὐ κοπιάσει
  choice: não se cansará
  rationale: κοπιάω pode indicar trabalhar arduamente ou ficar cansado. Aqui, a continuação explica que a busca não será extenuante, pois a Sabedoria já estará esperando.
- source_word: πάρεδρον
  choice: sentada junto
  rationale: πάρεδρος descreve alguém sentado ao lado ou presente junto de outra pessoa ou lugar. A tradução preserva a cena concreta da Sabedoria personificada.
- source_word: γὰρ
  choice: pois
  rationale: γάρ introduz a razão pela qual quem a busca cedo não se cansará.
- source_word: τῶν πυλῶν αὐτοῦ
  choice: aos portões dele
  rationale: πύλη significa normalmente 'portão', e o plural foi mantido. 'Dele' deixa claro que os portões pertencem ao buscador, evitando a ambiguidade que 'seus portões' teria em português.
theological_decisions:
- issue: Personificação feminina da Sabedoria e referência masculina genérica ao buscador
  choice: Manter a Sabedoria no feminino ('dela', 'a') e representar o buscador genérico por 'dele'.
  alternative: Empregar uma formulação sem pronome masculino, como 'junto aos portões de quem a busca'.
  rationale: O grego personifica claramente a Sabedoria no feminino e usa uma forma masculina singular para o buscador genérico. A tradução conserva ambos os traços sem transformar o masculino genérico em afirmação de exclusividade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem 'Quem cedo se levanta' preserva o tom proverbial; 'portões dele' evita confundir os portões do buscador com os da Sabedoria.
