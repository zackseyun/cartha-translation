base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/003.yaml
  text: For authority was given to you by the Lord[a], and sovereignty by the Most High, who will examine your works and investigate your plans[b];
translation:
  language: pt
  text: Porque a autoridade lhes foi dada pelo Senhor[a], e o poder soberano, pelo Altíssimo, que examinará as obras de vocês e investigará seus planos[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir “da parte do Senhor... da parte do Altíssimo”; a preposição grega indica procedência.
    reason: lexical_alternative
  - marker: b
    text: “Planos” também pode ser traduzido por “conselhos”, “deliberações” ou “intenções”, incluindo tanto as decisões interiores dos governantes quanto seus atos exteriores.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράτησις
  choice: autoridade
  rationale: No contexto de uma exortação a governantes, designa a posse ou o exercício do poder de governar. “Autoridade” comunica esse sentido político com clareza, sem sugerir meramente força física.
- source_word: δυναστεία
  choice: poder soberano
  rationale: Aqui o termo indica poder de domínio ou governo, não uma linhagem hereditária. “Poder soberano” preserva sua força e o distingue de κράτησις.
- source_word: παρὰ τοῦ κυρίου
  choice: pelo Senhor
  rationale: παρά com o genitivo indica procedência. Depois de “foi dada”, “pelo Senhor” é natural em português e identifica Deus como fonte da autoridade.
- source_word: παρὰ Ὑψίστου
  choice: pelo Altíssimo
  rationale: Mantém o paralelismo da frase anterior e traduz Ὕψιστος pelo título divino consagrado “Altíssimo”.
- source_word: ἐξετάσει
  choice: examinará
  rationale: O futuro expressa uma avaliação cuidadosa. “Examinará” é claro e apropriado ao contexto de prestação de contas e juízo.
- source_word: διεραυνήσει
  choice: investigará
  rationale: O verbo composto comunica uma busca minuciosa. “Investigará” preserva essa intensidade e complementa “examinará” sem produzir repetição.
- source_word: βουλάς
  choice: planos
  rationale: O termo pode abranger conselhos, deliberações e intenções. “Planos” é corrente e compreensível, mantendo a referência às decisões internas dos governantes.
theological_decisions:
- issue: Os títulos divinos κύριος e Ὕψιστος em paralelismo
  choice: “Senhor” e “Altíssimo”
  alternative: “SENHOR” e “Altíssimo”; “Soberano” e “Altíssimo”
  rationale: Os dois títulos atribuem a Deus a origem do poder político e afirmam que os governantes lhe prestarão contas. As formas escolhidas preservam o paralelismo e seguem o uso bíblico português corrente, sem acrescentar uma identificação textual que o grego não explicita.
- issue: Referente de ὃς
  choice: 'Manter a oração relativa: “que examinará...”'
  alternative: 'Explicitar: “Ele examinará...”'
  rationale: O pronome relativo masculino singular retoma naturalmente “o Altíssimo”, sem deixar de relacioná-lo ao “Senhor” do membro paralelo. A tradução conserva a estrutura e a tensão do original sem inserir uma explicação adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome átono “lhes” evita repetição, enquanto “de vocês” torna explícita a referência plural. A elipse de “foi dado” no segundo membro reproduz com naturalidade o paralelismo grego.
