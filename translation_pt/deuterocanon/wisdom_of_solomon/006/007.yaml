base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/007.yaml
  text: For the Master of all will not show partiality[a], nor will he be overawed by greatness; for he himself made both small and great[c][b], and he cares for all alike.
translation:
  language: pt
  text: Pois o Soberano de todos[a] não mostrará parcialidade[b], nem se deixará intimidar pela grandeza; porque ele mesmo fez o pequeno e o grande e cuida igualmente de todos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Senhor absoluto de todos” ou “Mestre de todos”. O título grego é δεσπότης (despótēs), não κύριος (kyrios).
    reason: lexical_alternative
  - marker: b
    text: A expressão grega emprega “rosto” (πρόσωπον) em sentido idiomático, isto é, tratar alguém com parcialidade ou favoritismo.
    reason: lexical_alternative
  - marker: c
    text: Ou “provê igualmente para todos” ou “exerce providência sobre todos por igual”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πάντων δεσπότης
  choice: o Soberano de todos
  rationale: δεσπότης expressa autoridade absoluta e é distinto de κύριος. “Soberano” comunica essa força com naturalidade e dignidade em português.
- source_word: ὑποστελεῖται πρόσωπον
  choice: não fará acepção de pessoas
  rationale: A expressão grega é idiomática e indica parcialidade ou favoritismo em razão da pessoa; a formulação escolhida preserva o sentido ético e judicial.
- source_word: ἐντραπήσεται μέγεθος
  choice: nem se deixará intimidar pela grandeza
  rationale: No contexto, a ideia é que grandeza, posição ou poder não constrangem nem influenciam o julgamento de Deus.
- source_word: μικρὸν καὶ μέγαν
  choice: tanto o pequeno como o grande
  rationale: Mantém o par abrangente do grego, que se refere a pessoas de condição humilde e elevada sem explicitar além do texto.
- source_word: ὁμοίως τε προνοεῖ περὶ πάντων
  choice: e cuida igualmente de todos
  rationale: προνοεῖ pode indicar cuidar, prover ou exercer providência; “cuida” é natural e mantém, com “igualmente”, a imparcialidade expressa por ὁμοίως.
theological_decisions:
- issue: Distinção entre δεσπότης e κύριος
  choice: Soberano
  alternative: Senhor; Mestre
  rationale: “Soberano” preserva a noção de autoridade absoluta de δεσπότης sem nivelá-lo automaticamente com o título κύριος.
- issue: Linguagem da imparcialidade divina
  choice: não fará acepção de pessoas
  alternative: não mostrará favoritismo; não levará em conta a posição da pessoa
  rationale: A escolha apresenta diretamente a imparcialidade diante da posição social, sem acrescentar uma formulação doutrinária posterior.
- issue: Alcance de προνοεῖ
  choice: cuida igualmente de todos
  alternative: provê igualmente para todos; exerce providência sobre todos por igual
  rationale: A formulação conserva o sentido amplo de cuidado providencial e não restringe o verbo apenas ao sustento material.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A construção conserva o paralelismo e a abrangência do grego, distinguindo δεσπότης de κύριος.
