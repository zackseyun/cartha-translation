  text: He will come upon you terribly and swiftly[a], because severe judgment comes upon those in high places.
translation:
  language: pt
  text: Ele virá sobre vocês de modo aterrador e rapidamente,[a] pois um julgamento severo sobrevém aos que ocupam posições elevadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele se apresentará diante de vocês de modo terrível e rapidamente, pois um julgamento abrupto recai sobre os que são elevados.”'
    reason: Alternativas lexicais para ἐπιστήσεται e ἀπότομος; «rapidamente» traduz ταχέως, enquanto «abrupto» conserva a possibilidade semântica de ἀπότομος.
lexical_decisions:
- source_word: φρικτῶς
  choice: de modo aterrador
  rationale: O advérbio exprime aquilo que causa medo ou terror; a formulação preserva sua força sem soar coloquial.
- source_word: ταχέως
  choice: rápido
  rationale: Indica a rapidez da intervenção anunciada e mantém um tom solene e natural.
- source_word: ἐπιστήσεται
  choice: virá sobre
  rationale: O futuro de ἐφίστημι pode significar aproximar-se, sobrevir ou pôr-se diante de alguém; esta escolha preserva a ideia de visitação iminente sem especificar indevidamente ataque.
- source_word: κρίσις
  choice: julgamento
  rationale: No contexto, designa ação judicial dirigida aos governantes, e não apenas justiça em sentido abstrato.
- source_word: ἀπότομος
  choice: severo
  rationale: O adjetivo pode significar abrupto, cortante ou severo. Como ταχέως já comunica rapidez, 'severo' preserva melhor a dimensão rigorosa sem redundância.
- source_word: ἐν τοῖς ὑπερέχουσιν
  choice: aos que ocupam posições elevadas
  rationale: A expressão se refere aos elevados em posição ou categoria; a tradução conserva a imagem de elevação e comunica claramente o status social ou político.
- source_word: γίνεται
  choice: sobrevém
  rationale: O verbo indica que o julgamento acontece ou se dá; 'sobrevém' expressa de modo natural que ele alcança os poderosos.
theological_decisions:
- issue: Natureza da ação ameaçada
  choice: O versículo adverte que o julgamento divino alcançará os governantes poderosos de modo rápido e aterrador.
  alternative: A frase pode ser entendida mais genericamente como o princípio de que um julgamento rigoroso ocorre entre os que estão em posição elevada.
  rationale: O contexto imediato se dirige diretamente aos governantes; contudo, a tradução não explicita o agente de ἐπιστήσεται, ausente nesta frase grega, nem restringe a expressão a uma classe política específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'vocês' para o plural ὑμῖν e preserva a imagem de posição elevada sem introduzir uma identificação denominacional ou doutrinária.
