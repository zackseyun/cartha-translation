  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/010.yaml
  text: For those who have kept holy things holily will be made holy[b][a], and those who have been taught them will find a defense.
translation:
  language: pt
  text: Pois os que guardaram com santidade as coisas santas serão santificados[a], e os que foram instruídos a respeito delas encontrarão uma defesa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “serão reconhecidos como santos”. O grego reúne de propósito três termos da mesma família: “com santidade”, “coisas santas” e “serão santificados”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “uma resposta” ou “justificação”. O termo grego pode indicar uma defesa apresentada em resposta a exame ou acusação.
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξαντες
  choice: guardaram
  rationale: O particípio exprime guardar ou observar com cuidado. “Guardaram” mantém a imagem verbal do grego sem restringi-la à proteção física.
- source_word: ὁσίως / τὰ ὅσια / ὁσιωθήσονται
  choice: com santidade / as coisas santas / serão santificados
  rationale: A sequência conserva, tanto quanto o português permite, o agrupamento intencional de termos cognatos ligados à santidade.
- source_word: διδαχθέντες αὐτά
  choice: foram instruídos a respeito delas
  rationale: Preserva a voz passiva de διδαχθέντες e retoma claramente “as coisas santas” mediante o pronome feminino plural.
- source_word: εὑρήσουσιν ἀπολογίαν
  choice: encontrarão uma defesa
  rationale: Mantém o verbo “encontrar” e o possível sentido forense de ἀπολογία, sem impor a noção teológica mais específica de “justificação”.
theological_decisions:
- issue: Jogo de palavras entre ὁσίως, τὰ ὅσια e ὁσιωθήσονται
  choice: 'Repetir a linguagem de santidade: “com santidade ... coisas santas ... santificados”.'
  alternative: “piedosamente ... coisas sagradas ... serão reconhecidos como santos”
  rationale: O encadeamento lexical sustenta a lógica moral e teológica do versículo; por isso, deve permanecer perceptível, sem resolver de modo indevido a nuance do passivo final.
- issue: Sentido de ἀπολογία
  choice: “uma defesa”
  alternative: “uma resposta” ou “justificação”
  rationale: “Defesa” preserva a possibilidade de uma resposta diante de exame ou acusação, sem importar uma categoria doutrinária posterior.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Coisas santas” é deliberadamente amplo, pois o neutro plural grego pode abranger realidades, deveres ou ordenanças sagradas.
