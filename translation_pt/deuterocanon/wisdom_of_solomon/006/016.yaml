base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/016.yaml
  text: For she goes about seeking those worthy of her[a], and graciously appears to them on the paths, and meets them in every purpose.
translation:
  language: pt
  text: Pois ela mesma anda por toda parte à procura dos que são dignos dela, mostra-se bondosamente a eles nos caminhos e vai ao encontro deles em cada pensamento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em cada plano”, “em cada intenção” ou “em cada propósito”. O termo grego pode referir-se tanto ao pensamento em geral quanto a uma intenção já formada.
    reason: alternativa lexical
lexical_decisions:
- source_word: τοὺς ἀξίους αὐτῆς
  choice: os que são dignos dela
  rationale: Preserva o sentido avaliativo de ἄξιος e o genitivo relacional, sem definir em que consiste essa dignidade.
- source_word: αὐτὴ περιέρχεται ζητοῦσα
  choice: ela mesma anda por toda parte à procura
  rationale: “Ela mesma” conserva a ênfase de αὐτή; a expressão verbal comunica tanto o movimento de περιέρχεται quanto a busca contínua indicada por ζητοῦσα.
- source_word: ἐν ταῖς τρίβοις
  choice: nos caminhos
  rationale: Mantém a imagem concreta de trilhas ou caminhos presente em τρίβος.
- source_word: φαντάζεται αὐτοῖς εὐμενῶς
  choice: mostra-se bondosamente a eles
  rationale: φαντάζεται indica tornar-se visível ou manifestar-se, enquanto εὐμενῶς acrescenta a ideia de disposição favorável e benévola.
- source_word: ἐν πάσῃ ἐπινοίᾳ
  choice: em cada pensamento
  rationale: ἐπίνοια pode designar pensamento, intenção, plano ou propósito. “Pensamento” preserva aqui a amplitude do termo, enquanto a nota registra sentidos mais deliberados.
- source_word: ὑπαντᾷ αὐτοῖς
  choice: vai ao encontro deles
  rationale: Expressa não apenas o encontro, mas também a iniciativa sugerida por ὑπαντάω.
theological_decisions:
- issue: Personificação da Sabedoria como figura feminina atuante
  choice: Manter a linguagem pessoal feminina em “ela mesma” e “dela”
  alternative: Tratar a sabedoria de modo impessoal
  rationale: As formas femininas e as ações pessoais do grego apresentam deliberadamente a Sabedoria como uma figura feminina ativa; a tradução conserva esse recurso literário-teológico sem identificá-la com uma doutrina posterior.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A repetição das iniciativas da Sabedoria e a imagem concreta dos caminhos foram preservadas.
