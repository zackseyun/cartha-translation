  text: and concern for instruction is love[a], and love is the keeping of her laws, and attention to her laws is the assurance of incorruptibility[b],
translation:
  language: pt
  text: e o cuidado com a instrução é amor[a]; o amor é a observância das leis dela, e a atenção às suas leis é a confirmação da incorruptibilidade[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “disciplina” ou “formação”, pois παιδεία designa instrução moral formativa.
    reason: lexical_alternative
  - marker: b
    text: Ou “imortalidade”. O grego fala mais literalmente da condição de não estar sujeito à corrupção ou à decadência.
    reason: lexical_alternative
lexical_decisions:
- source_word: φροντὶς
  choice: cuidado
  rationale: Expressa atenção solícita ou interesse diligente e preserva o substantivo abstrato na cadeia de afirmações.
- source_word: παιδείας
  choice: instrução
  rationale: Abrange ensino formativo e moral sem restringir o termo à punição ou à educação escolar.
- source_word: ἀγάπη
  choice: amor
  rationale: Tradução direta e natural; a repetição foi preservada por ser estrutural no argumento.
- source_word: τήρησις
  choice: observância
  rationale: No contexto de leis, comunica com precisão a ideia de guardá-las e cumpri-las.
- source_word: νόμων αὐτῆς
  choice: as leis dela / suas leis
  rationale: Preserva νόμων como 'leis' e a referência feminina à Sabedoria personificada; a variação pronominal evita ambiguidade inicial e mantém fluidez.
- source_word: προσοχὴ
  choice: atenção
  rationale: Equivale diretamente à atitude de estar atento e mantém o estilo de substantivos abstratos.
- source_word: βεβαίωσις
  choice: confirmação
  rationale: Preserva a ideia de tornar firme ou assegurar, sem a força excessiva de 'garantia'.
- source_word: ἀφθαρσίας
  choice: incorruptibilidade
  rationale: Reproduz mais diretamente a ideia de ausência de corrupção ou deterioração, sem reduzi-la interpretativamente a 'imortalidade'.
theological_decisions:
- issue: Referência do pronome feminino αὐτῆς
  choice: Preservar a referência feminina à Sabedoria personificada por meio de 'dela' e 'suas'.
  alternative: Empregar uma referência impessoal à instrução.
  rationale: O contexto personifica a Sabedoria, e o pronome feminino grego sustenta essa leitura literária e teológica.
- issue: Sentido de ἀφθαρσία
  choice: incorruptibilidade
  alternative: imortalidade
  rationale: A escolha principal mantém a noção lexical de liberdade da corrupção ou decadência e evita resolver silenciosamente sua possível implicação de imortalidade.
