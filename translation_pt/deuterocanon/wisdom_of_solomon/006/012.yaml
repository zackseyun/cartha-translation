  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/012.yaml
  text: Wisdom is radiant and unfading[a], and is readily seen by those who love her;
translation:
  language: pt
  text: A Sabedoria é radiante e nunca perde o viço; é facilmente contemplada[a] por aqueles que a amam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “facilmente percebida” ou “prontamente vista”. O verbo grego pode indicar tanto visão quanto percepção.'
    reason: alternativa lexical
lexical_decisions:
- source_word: Λαμπρὰ
  choice: radiante
  rationale: Preserva a imagem de brilho visível e combina naturalmente com a personificação da Sabedoria, sem acrescentar uma conotação teológica que o adjetivo não exige.
- source_word: ἀμάραντός
  choice: nunca perde o viço
  rationale: Expressa em português corrente a imagem de algo que não murcha nem perde o frescor. Evita o termo pouco comum “imarcescível” e mantém o sentido figurado em vez de reduzi-lo ao abstrato “imperecível”.
- source_word: σοφία
  choice: Sabedoria
  rationale: O uso de maiúscula ajuda a acompanhar a figura literária personificada no contexto. O substantivo português também conserva naturalmente o gênero feminino.
- source_word: εὐχερῶς
  choice: facilmente
  rationale: Comunica de modo direto a ideia de facilidade ou prontidão e soa natural junto à forma passiva “é contemplada”.
- source_word: θεωρεῖται
  choice: é contemplada
  rationale: Mantém a força visual de ver ou observar, adequada a “radiante”, sem excluir a ideia mais ampla de perceber ou reconhecer.
- source_word: ὑπὸ τῶν ἀγαπώντων αὐτήν
  choice: por aqueles que a amam
  rationale: Reproduz com clareza o particípio presente e conserva a referência feminina explícita à Sabedoria personificada.
theological_decisions:
- issue: Personificação de σοφία
  choice: Empregar “Sabedoria” com inicial maiúscula e retomá-la pelo pronome feminino “a”.
  alternative: Usar “sabedoria” apenas como qualidade abstrata, sem destacar a personificação.
  rationale: Embora o gênero feminino seja também gramatical em grego e português, o contexto apresenta a Sabedoria como figura feminina personificada. A tradução preserva essa apresentação literária sem identificá-la com uma figura doutrinária específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Nunca perde o viço” conserva a metáfora de não murchar em linguagem acessível; “é contemplada” mantém a tensão entre visão e percepção, explicitada na nota.
