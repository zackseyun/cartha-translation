    issue: «das massas de nações» é pouco natural e semanticamente opaco.
    rationale: A expressão pode sugerir «massas nacionais» em vez de multidões compostas por povos ou nações. «De multidões de povos» preserva a relação genitiva e a leitura portuguesa.
  - severity: low
    issue: O plural «multidões» para πλήθους não reflete a forma singular coletiva.
    rationale: Embora não altere substancialmente o sentido, «uma multidão» conserva a formulação grega e continua natural no contexto.
