review_pass:
  verdict: revise
  source_fidelity: A tradução acerta o imperativo exortativo, a referência a governantes e o tom altivo de γεγαυρωμένοι. Contudo, «massas de nações» é uma combinação pouco idiomática em português e torna menos clara a construção grega ὄχλοις ἐθνῶν, que se refere a grandes grupos de povos/nações.
  naturalness: «Escutem» e «vocês que governam» são naturais e adequados ao registro. «Governam multidões» é aceitável, mas o singular coletivo πλήθους é mais bem refletido por «uma multidão». «Multidões de povos» é mais fluente e inteligível do que «massas de nações».
  terminology: «Se vangloriam» transmite adequadamente a altivez censurada pelo particípio perfeito γεγαυρωμένοι. «Povos» é preferível a «nações» no complemento de «multidões», sem excluir que ἐθνῶν possa designar nações ou povos.
  issues:
