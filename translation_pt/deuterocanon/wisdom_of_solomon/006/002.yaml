translation:
  language: pt
  text: Escutem[a], vocês que governam uma multidão e se vangloriam de multidões de povos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deem ouvidos, vocês que têm poder sobre uma multidão e exultam por causa de multidões de povos.”'
    reason: Preserva alternativas legítimas para o imperativo ἐνωτίσασθε, para κρατοῦντες e para o possível valor causal de ἐπί.
lexical_decisions:
- source_word: ἐνωτίσασθε
  choice: Escutem
  rationale: O imperativo aoristo médio é uma convocação enfática a prestar atenção. “Escutem” é claro e corrente, sem perder a força do apelo.
- source_word: οἱ κρατοῦντες
  choice: vocês que governam
  rationale: No contexto de uma exortação a governantes, a expressão indica exercício de autoridade. “Governam” evita acrescentar a conotação necessariamente opressiva de “dominam”.
- source_word: πλήθους
  choice: multidões
  rationale: Embora o grego use o singular coletivo, o plural em português expressa naturalmente as grandes populações submetidas à autoridade desses governantes.
- source_word: γεγαυρωμένοι
  choice: se vangloriam
  rationale: O particípio perfeito comunica orgulho ou exultação altiva. “Se vangloriam” conserva o tom de censura do texto.
- source_word: ἐπὶ ὄχλοις ἐθνῶν
  choice: das massas de nações
  rationale: ὄχλοις designa massas ou multidões, e ἐθνῶν especifica sua composição. Com γεγαυρωμένοι, ἐπί pode indicar a base ou o objeto da vanglória; “das” oferece uma formulação portuguesa natural sem definir de modo excessivo essa relação.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O tratamento “vocês” torna explícito o destinatário plural já presente nas formas gregas, e “se vangloriam” mantém o tom repreensivo.
