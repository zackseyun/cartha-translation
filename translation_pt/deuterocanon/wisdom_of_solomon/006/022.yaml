base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/022.yaml
  text: But what wisdom is and how it came to be[a], I will declare, and I will not hide mysteries from you; rather, from the beginning of its origin I will trace it out, and I will set the knowledge of it in the open[b], and I will by no means pass by the truth.
translation:
  language: pt
  text: Mas anunciarei o que é a sabedoria e como ela veio a existir[a]. Não esconderei de vocês os mistérios; pelo contrário, vou rastreá-la desde o início de seu surgimento, exporei abertamente o conhecimento dela e de modo algum passarei ao largo da verdade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como ela surgiu”. A expressão grega fala de vir a ser ou surgir, sem especificar aqui que a sabedoria tenha sido criada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de modo algum deixarei de lado a verdade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί δέ ἐστιν σοφία καὶ πῶς ἐγένετο
  choice: o que é a sabedoria e como ela veio a existir
  rationale: Preserva as duas orações interrogativas indiretas e traduz γίνομαι sem impor a ideia mais específica de criação.
- source_word: ἀπαγγελῶ
  choice: anunciarei
  rationale: Expressa a ideia de comunicar ou declarar publicamente, em registro digno e corrente.
- source_word: οὐκ ἀποκρύψω ὑμῖν μυστήρια
  choice: Não esconderei de vocês os mistérios
  rationale: Mantém μυστήρια como “mistérios”, sem reduzi-lo a meros segredos, e usa uma forma natural e amplamente compreensível em português.
- source_word: ἀπ' ἀρχῆς γενέσεως ἐξιχνιάσω
  choice: vou rastreá-la desde o início de seu surgimento
  rationale: ἐξιχνιάζω evoca seguir rastros ou investigar minuciosamente; “surgimento” comunica a expressão compacta ligada a γένεσις sem afirmar especificamente criação.
- source_word: θήσω εἰς τὸ ἐμφανὲς τὴν γνῶσιν αὐτῆς
  choice: exporei abertamente o conhecimento dela
  rationale: Reproduz o movimento de colocar o conhecimento no âmbito do manifesto ou público, com formulação natural em português.
- source_word: οὐ μὴ παροδεύσω τὴν ἀλήθειαν
  choice: de modo algum passarei ao largo da verdade
  rationale: “De modo algum” conserva a negação enfática οὐ μή, enquanto “passarei ao largo” mantém a imagem espacial de παροδεύω.
theological_decisions:
- issue: Possível implicação metafísica de πῶς ἐγένετο e γενέσεως quanto à origem da sabedoria
  choice: veio a existir / surgimento
  alternative: foi criada / criação
  rationale: O grego fala do vir a ser ou surgir da sabedoria, mas o versículo isoladamente não deve ser usado para decidir se a Sabedoria personificada é criada ou eterna. A tradução conserva essa tensão sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário de alcance internacional. A imagem de seguir rastros foi mantida, e a linguagem de origem foi formulada de modo a preservar a ambiguidade do grego.
