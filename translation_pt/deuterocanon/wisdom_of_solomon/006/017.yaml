lexical_decisions:
- source_word: ἀρχὴ
  choice: princípio
  rationale: Preserva a ideia de começo, ponto inicial ou origem no enunciado aforístico.
- source_word: γὰρ
  choice: pois
  rationale: Introduz de modo conciso a explicação ou fundamento do que foi dito antes.
- source_word: αὐτῆς
  choice: dela
  rationale: Retoma a Sabedoria personificada e mantém a referência feminina do grego sem substituir o pronome por uma explicitação interpretativa.
- source_word: ἡ ἀληθεστάτη
  choice: o mais verdadeiro
  rationale: Conserva a força superlativa de ἀληθεστάτη e qualifica 'princípio' como o começo mais genuíno.
- source_word: παιδείας
  choice: instrução
  rationale: Expressa de forma ampla e natural o aprendizado formativo próprio da literatura sapiencial; o termo grego também pode abranger formação e disciplina.
- source_word: ἐπιθυμία
  choice: desejo
  rationale: É a correspondência direta e natural para a ideia de querer ou ansiar, sem intensificar indevidamente o termo.
theological_decisions:
- issue: Personificação feminina da Sabedoria
  choice: Manter a referência feminina por meio de 'dela'
