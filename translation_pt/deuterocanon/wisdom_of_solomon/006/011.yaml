  text: Therefore desire my words[a]; long for them[b], and you will be instructed.
translation:
  language: pt
  text: Portanto, desejem as minhas palavras; anseiem por elas[a], e vocês serão instruídos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego traduzido por “anseiem” é mais intenso e afetivo que o primeiro verbo, “desejem”.
    reason: lexical_alternative
  - marker: b
    text: Ou “serão educados”, “serão formados” ou “serão disciplinados”; o verbo grego pode abranger tanto instrução quanto formação por meio da disciplina.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμήσατε
  choice: desejem
  rationale: O imperativo expressa um desejo positivo e deliberado pelas palavras da Sabedoria. “Desejem” é direto, atual e evita a conotação geralmente negativa de “cobiçar”.
- source_word: οὖν
  choice: portanto
  rationale: Preserva a relação de conclusão ou consequência com o argumento anterior.
- source_word: τῶν λόγων μου
  choice: as minhas palavras
  rationale: Tradução direta que mantém a referência aos pronunciamentos da voz que fala, sem restringi-los interpretativamente a “ensinamentos”.
- source_word: ποθήσατε
  choice: anseiem por elas
  rationale: O verbo é mais afetivo e intenso que o primeiro; “anseiem” comunica esse desejo profundo sem soar excessivo.
- source_word: καὶ
  choice: e
  rationale: Mantém a coordenação simples do grego, permitindo que o futuro seguinte também seja entendido como resultado.
- source_word: παιδευθήσεσθε
  choice: vocês serão instruídos
  rationale: Preserva a voz passiva e destaca a instrução no contexto sapiencial, enquanto uma nota registra o sentido mais amplo de formação e disciplina.
theological_decisions:
- issue: Amplitude semântica de παιδεύω no contexto sapiencial
  choice: A instrução é destacada no texto principal.
  alternative: “serão educados”, “serão formados” ou “serão disciplinados”
  rationale: O contexto imediato trata da acolhida das palavras da Sabedoria, favorecendo “instruídos”. Contudo, o verbo também pode envolver educação formativa e disciplina, possibilidade preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com formas verbais naturais para leitores brasileiros e amplamente compreensíveis no português internacional. A repetição progressiva entre “desejem” e “anseiem” conserva a intensificação do grego.
