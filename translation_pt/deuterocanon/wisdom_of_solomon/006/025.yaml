lexical_decisions:
- source_word: ὥστε
  choice: Portanto
  rationale: Introduz a conclusão decorrente da exortação anterior e preserva com naturalidade a força inferencial do grego.
- source_word: παιδεύεσθε
  choice: deixem-se instruir
  rationale: Expressa a forma imperativa passiva ou média e o sentido de receber instrução formativa, sem limitar o verbo à ideia de punição.
- source_word: τοῖς ῥήμασίν μου
  choice: pelas minhas palavras
  rationale: Mantém o sentido direto de ῥήματα e representa o dativo instrumental com a preposição «pelas».
- source_word: καὶ
  choice: e
  rationale: Conserva a coordenação simples da oração resultante sem explicitar além do que está no grego.
- source_word: ὠφεληθήσεσθε
  choice: vocês serão beneficiados
  rationale: Preserva a forma futura passiva e comunica claramente o resultado positivo; evita a possível conotação comercial de «lucrarão».
