  text: Pois pensar nela é a perfeição do entendimento, e quem ficar acordado por causa dela logo estará livre de preocupações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνθυμηθῆναι περὶ αὐτῆς
  choice: pensar nela
  rationale: Expressa de modo natural e direto a ideia de voltar o pensamento para a Sabedoria, mantendo o referente feminino.
- source_word: φρονήσεως τελειότης
  choice: a perfeição do entendimento
  rationale: Preserva a força de τελειότης e traduz φρόνησις como discernimento compreensivo e prático, em linguagem acessível.
- source_word: ὁ ἀγρυπνήσας
  choice: quem se mantiver vigilante
  rationale: Conserva a imagem de permanecer desperto e atento, sem limitar a expressão à ausência literal de sono.
- source_word: δι' αὐτήν
  choice: por causa dela
  rationale: Mantém o valor causal mais provável da preposição e evita transformar a expressão em simples busca ou espera pela Sabedoria.
- source_word: ταχέως ἀμέριμνος ἔσται
  choice: logo ficará livre de preocupações
  rationale: Reproduz tanto a rapidez indicada por ταχέως quanto o estado de estar sem cuidados inquietantes expresso por ἀμέριμνος.
theological_decisions:
- issue: Referência feminina da Sabedoria
  choice: nela / dela
  alternative: na sabedoria / por causa da sabedoria
  rationale: Os pronomes femininos gregos retomam a Sabedoria personificada no contexto; mantê-los preserva a coesão e a personificação sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a relação causal e a imagem de vigilância do grego.
