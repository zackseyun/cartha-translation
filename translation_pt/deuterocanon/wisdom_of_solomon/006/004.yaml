  text: because[a], though you were ministers of his kingdom, you did not judge rightly, nor keep the law[c][b], nor walk according to the counsel of God.
translation:
  language: pt
  text: Pois vocês, ministros[a] do reino de Deus, não julgaram corretamente[b], nem observaram a lei, nem andaram segundo o desígnio de Deus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servos” ou “oficiais”. O termo grego indica subordinados que servem sob uma autoridade superior; aqui se refere aos governantes como servidores subordinados sob o reinado de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “não julgaram com justiça”.
    reason: lexical_alternative
  - marker: c
    text: Ou “segundo o propósito de Deus” ou “de acordo com a vontade de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπηρέται
  choice: ministros
  rationale: No contexto dirigido a governantes, designa subordinados que exercem função sob autoridade superior. “Ministros” conserva tanto a ideia de serviço quanto a de função pública; “servos” e “oficiais” permanecem alternativas possíveis.
- source_word: βασιλείας
  choice: reino
  rationale: “Reino” é natural em português e pode abranger tanto o domínio quanto a autoridade régia de Deus, sem reduzir o termo apenas ao ato abstrato de reinar.
- source_word: ἐκρίνατε ὀρθῶς
  choice: não julgaram corretamente
  rationale: Reproduz o sentido adverbial de ὀρθῶς e se ajusta ao contexto judicial. “Com justiça” é possível, mas explicita mais diretamente a dimensão ética.
- source_word: ἐφυλάξατε νόμον
  choice: observaram a lei
  rationale: Com νόμος, φυλάσσω denota guardar no sentido de cumprir ou observar. “Observar a lei” é claro e idiomático em português contemporâneo.
- source_word: κατὰ τὴν βουλὴν τοῦ θεοῦ
  choice: segundo o desígnio de Deus
  rationale: βουλή pode indicar conselho, propósito ou plano deliberado. “Desígnio” preserva a noção de intenção deliberada sem equipará-la de modo automático a θέλημα.
- source_word: ἐπορεύθητε
  choice: andaram
  rationale: Mantém a metáfora ética de πορεύομαι para a conduta, corrente na linguagem bíblica e ainda compreensível em português.
theological_decisions:
- issue: Papel dos governantes terrenos sob a soberania divina
  choice: O versículo apresenta os governantes como ministros subordinados ao reino de Deus.
  alternative: A expressão pode ser aplicada de maneira mais geral a todos os que exercem autoridade sob Deus.
  rationale: O contexto imediato se dirige a reis e juízes, e ὑπηρέται τῆς αὐτοῦ βασιλείας descreve a autoridade deles como derivada e subordinada, sem desenvolver uma doutrina específica sobre Igreja ou Estado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento plural por “vocês” adequado à legibilidade brasileira. A construção paralela com “nem” acompanha a sequência acusatória do grego. As notas preservam alternativas lexicais reais sem resolver indevidamente a amplitude de βουλή.
