base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/024.yaml
  text: A multitude of the wise is the salvation of the world[b][a], and a prudent king is the stability of a people.
translation:
  language: pt
  text: Uma multidão de sábios é a salvação do mundo[a], e um rei prudente é a estabilidade de um povo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “livramento” ou “preservação”.
    reason: lexical_alternative
  - marker: b
    text: Ou “do povo”. O grego δῆμος pode significar “povo”, “população” ou “corpo de cidadãos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλῆθος
  choice: uma multidão
  rationale: Preserva a força nominal e o caráter sentencioso do grego, indicando um grande número.
- source_word: σοφῶν
  choice: de sábios
  rationale: O genitivo plural designa pessoas sábias em geral; a forma concisa mantém o tom elevado do provérbio.
- source_word: σωτηρία
  choice: salvação
  rationale: Mantém o peso amplo de σωτηρία, que pode abranger salvação, livramento e preservação, sem reduzi-lo apenas ao bem-estar cívico.
- source_word: κόσμου
  choice: do mundo
  rationale: Traduz diretamente o genitivo e conserva o alcance amplo, humano ou cósmico, de κόσμος.
- source_word: βασιλεὺς
  choice: rei
  rationale: O termo grego designa especificamente um rei, não apenas um governante genérico.
- source_word: φρόνιμος
  choice: prudente
  rationale: Expressa sabedoria prática e bom discernimento, além de distinguir φρόνιμος de σοφός na primeira oração.
- source_word: εὐσταθία
  choice: estabilidade
  rationale: Comunica com clareza a firmeza e a ordem duradoura no contexto político.
- source_word: δήμου
  choice: de um povo
  rationale: Preserva o caráter geral da máxima; δῆμος pode designar povo, população ou corpo de cidadãos.
theological_decisions:
- issue: Alcance de σωτηρία no contexto sapiencial e político
  choice: salvação
  alternative: livramento; preservação; bem-estar
  rationale: Embora o contexto seja comunitário e político, σωτηρία possui força maior que mero bem-estar. “Salvação” conserva essa amplitude, enquanto o contexto orienta sua aplicação coletiva.
translation_notes:
  register: Português moderno, claro e digno, com estrutura proverbial concisa. “Multidão de sábios” preserva a formulação nominal do grego; “de um povo” mantém o sentido geral, sem impor um referente definido.
