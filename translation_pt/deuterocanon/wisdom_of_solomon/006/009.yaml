  yaml_path: translation/deuterocanon/wisdom_of_solomon/006/009.yaml
  text: Therefore my words are for you[a], O tyrants[b], so that you may learn wisdom and not fall away.
translation:
  language: pt
  text: Portanto, minhas palavras se dirigem a vocês, ó tiranos[a], para que aprendam a sabedoria e não venham a cair[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ó governantes» ou «ó soberanos». O grego τύραννοι pode designar governantes soberanos em geral, embora aqui tenha uma força crítica acentuada.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «não falhem» ou «não se desviem». O verbo grego pode referir-se, de modo amplo, a cair, fracassar ou seguir um caminho errado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὑμᾶς
  choice: se dirigem a vocês
  rationale: Com «minhas palavras» como sujeito e um verbo de elocução subentendido, a expressão identifica naturalmente os destinatários. A formulação explicita em português o verbo implícito sem alterar o sentido.
- source_word: οὖν
  choice: Portanto
  rationale: Mantém a relação de conclusão com a advertência anterior e o tom solene da exortação.
- source_word: ὦ τύραννοι
  choice: ó tiranos
  rationale: Preserva tanto o vocativo enfático quanto a força negativa de τύραννοι no contexto de advertência a governantes que exercem poder absoluto ou opressivo.
- source_word: οἱ λόγοι μου
  choice: minhas palavras
  rationale: Reproduz o substantivo plural de maneira direta, natural e digna.
- source_word: ἵνα μάθητε
  choice: para que aprendam
  rationale: Expressa claramente a finalidade indicada por ἵνα com o subjuntivo.
- source_word: σοφίαν
  choice: a sabedoria
  rationale: «Sabedoria» é o termo central e adequado no livro; o artigo torna a expressão mais natural em português sem mudar seu referente.
- source_word: μὴ παραπέσητε
  choice: e não venham a cair
  rationale: Mantém a imagem verbal ampla de παραπίπτω e evita restringi-la silenciosamente a apostasia, tropeço ou desvio moral; a locução também comunica a eventualidade advertida pelo subjuntivo.
theological_decisions:
- issue: Força de τύραννοι na interpelação às autoridades políticas
  choice: «tiranos»
  alternative: «governantes» ou «soberanos»
  rationale: No contexto admonitório, o termo grego tem uma força crítica que a opção neutra «governantes» enfraqueceria. «Tiranos» conserva essa censura sem acrescentar uma doutrina política alheia ao texto.
- issue: Amplitude moral de παραπέσητε
  choice: «não venham a cair»
  alternative: «não se desviem» ou «não apostatem»
  rationale: O verbo pode indicar cair, falhar ou desviar-se. A tradução principal conserva essa amplitude e não o limita à apostasia; a nota registra as possibilidades contextuais.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. O vocativo «ó tiranos» conserva a contundência retórica; o verbo implícito na construção grega foi explicitado como «se dirigem» para evitar uma frase nominal pouco natural em português.
