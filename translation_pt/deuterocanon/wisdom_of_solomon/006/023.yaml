  text: Nor indeed will I accompany wasting envy[a], because it will have no share in wisdom.
translation:
  language: pt
  text: Nem tampouco farei companhia à inveja que definha[a], pois ela não terá parte na sabedoria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à inveja consumida por dentro”. A frase final também pode referir-se à pessoa invejosa: “pois o invejoso não terá parte na sabedoria”.'
    reason: Alternativa lexical em τετηκότι e ambiguidade do referente de οὗτος.
lexical_decisions:
- source_word: οὔτε μὴν
  choice: Nem tampouco
  rationale: Preserva a continuação negativa e a leve ênfase da expressão grega, com formulação natural e digna em português.
- source_word: φθόνῳ
  choice: à inveja
  rationale: φθόνος designa inveja ou ressentimento diante do bem alheio; “inveja” é o termo moral mais direto neste contexto sapiencial.
- source_word: τετηκότι
  choice: que definha
  rationale: O particípio perfeito de τήκω evoca algo derretido, consumido ou debilitado. “Que definha” conserva a imagem de deterioração sem decidir se a inveja apenas se consome ou também corrói quem a nutre.
- source_word: συνοδεύσω
  choice: farei companhia
  rationale: O verbo significa acompanhar ou seguir caminho junto. A expressão mantém a metáfora de associação pessoal e soa mais natural do que uma tradução estritamente literal.
- source_word: οὗτος
  choice: ela
  rationale: O demonstrativo grego retoma mais naturalmente φθόνος, personificando a inveja. Em português, o pronome feminino concorda com “inveja”; a possível referência à pessoa invejosa é registrada em nota.
- source_word: οὐ κοινωνήσει
  choice: não terá parte
  rationale: Expressa com clareza a ideia de não participar nem compartilhar de algo.
- source_word: σοφίᾳ
  choice: na sabedoria
  rationale: É a equivalência usual e contextualmente adequada para σοφία na literatura sapiencial.
theological_decisions:
- issue: Referente de οὗτος
  choice: A inveja personificada
  alternative: A pessoa invejosa
  rationale: O demonstrativo masculino singular pode retomar o substantivo grego masculino φθόνος, tratando a inveja como agente personificado; também pode apontar para quem é caracterizado por ela. O texto principal conserva a ligação gramatical imediata e a nota mantém aberta a alternativa antropológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Farei companhia” preserva a metáfora relacional de συνοδεύσω; “que definha” mantém a imagem grega incomum sem a explicar excessivamente.
