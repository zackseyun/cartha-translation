  text: For it is an unfailing treasure for men; those who have made use of it gained friendship with God, having been commended through the gifts that come from instruction.
translation:
  language: pt
  text: Pois ela é um tesouro inesgotável para os seres humanos; os que dela se valeram conquistaram a amizade de Deus, tendo sido recomendados pelos dons provenientes da instrução.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεκλιπής
  choice: inesgotável
  rationale: Expressa aquilo que não falha nem se acaba, em linguagem portuguesa natural.
- source_word: οἱ χρησάμενοι
  choice: os que dela se valeram
  rationale: Reproduz o uso efetivo e proveitoso da sabedoria, com o pronome retomando o referente do contexto.
- source_word: ἐστείλαντο
  choice: conquistaram
  rationale: Comunica a ideia do médio grego de obter ou granjear para si, sem sugerir mera posse passiva.
- source_word: παιδείας
  choice: instrução
  rationale: Mantém o campo de formação, ensino e disciplina, sem restringi-lo à escolarização.
- source_word: συσταθέντες
  choice: tendo sido recomendados
  rationale: Preserva o sentido passivo de serem apresentados favoravelmente ou aprovados, sem definir além do grego o mecanismo dessa recomendação.
theological_decisions:
- issue: Relação entre o uso da sabedoria e a amizade de Deus
  choice: conquistaram a amizade de Deus
  alternative: obtiveram a amizade de Deus
  rationale: Mantém a relação afirmada pelo texto entre valer-se da sabedoria e granjear amizade com Deus, sem acrescentar uma explicação doutrinária sobre mérito, graça ou causalidade.
- issue: Função dos dons provenientes da instrução
  choice: tendo sido recomendados pelos dons
  alternative: sendo aprovados por causa dos dons
  rationale: Conserva a formulação participial e sua tensão, evitando transformar a recomendação em uma declaração teológica mais específica de aprovação ou justificação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a sequência argumentativa e os tempos passados dos aoristos gregos; “ela” retoma a sabedoria no contexto imediato.
