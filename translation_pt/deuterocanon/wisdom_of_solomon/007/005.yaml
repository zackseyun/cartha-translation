  text: For no king had a different beginning of birth[a].
translation:
  language: pt
  text: Pois nenhum rei teve uma origem diferente[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois nenhum rei teve um começo diferente de nascimento.” O termo grego γενέσεως pode ter o sentido mais amplo de “origem” ou “geração”, e não apenas de nascimento físico.'
    reason: alternativa lexical
lexical_decisions:
- source_word: οὐδεὶς
  choice: nenhum
  rationale: 'Com o genitivo plural βασιλέων, expressa negação universal: nenhum dentre os reis.'
- source_word: γὰρ
  choice: pois
  rationale: Preserva a ligação explicativa com a afirmação anterior sobre a condição humana comum.
- source_word: βασιλέων
  choice: rei
  rationale: Mantém a referência específica à realeza, em vez de ampliá-la para governantes em geral.
- source_word: ἑτέραν
  choice: diferente
  rationale: Indica que os reis não têm um começo de natureza distinta daquele dos demais seres humanos.
- source_word: ἔσχεν
  choice: teve
  rationale: É a forma portuguesa mais natural para o aoristo de ἔχω nesta descrição da origem de alguém.
- source_word: γενέσεως
  choice: ao nascer
  rationale: No contexto, refere-se ao nascimento ou à entrada na existência; a formulação evita o pouco natural “começo de nascimento”, sem excluir em nota o sentido mais amplo de origem.
- source_word: ἀρχήν
  choice: começo
  rationale: Conserva a ideia de ponto inicial expressa por ἀρχή e a associa naturalmente ao ato de nascer.
theological_decisions:
- issue: Igualdade antropológica entre reis e pessoas comuns
  choice: A tradução afirma que nenhum rei começa a vida de modo diferente dos demais seres humanos.
  alternative: Pois nenhum rei teve uma origem diferente.
  rationale: O contexto ressalta a condição humana compartilhada por Salomão e por todos os outros. A redação preserva essa afirmação niveladora sem transformá-la numa formulação doutrinária mais ampla.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ao nascer” oferece naturalidade sem apagar a possível amplitude semântica de γενέσεως, registrada na nota.
