  text: Mas há uma só entrada na vida para todos[a] e uma saída igual.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «todos têm a mesma entrada na vida e a mesma saída». O grego apresenta «entrada» e «saída» como imagens correspondentes do começo e do fim da vida humana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μία
  choice: uma só
  rationale: Expressa a singularidade e o caráter comum da entrada, sem decidir em favor da alternativa interpretativa «a mesma».
- source_word: πάντων
  choice: para todos
  rationale: Transmite de modo natural em português a universalidade indicada pelo genitivo grego.
- source_word: εἴσοδος
  choice: entrada
  rationale: Preserva a metáfora espacial e o paralelismo deliberado com «saída».
- source_word: εἰς τὸν βίον
  choice: na vida
  rationale: É a formulação portuguesa natural para a entrada na existência terrena, sem substituir «vida» por uma explicitação interpretativa como «mundo».
- source_word: ἔξοδος
  choice: saída
  rationale: Mantém a contraposição lexical direta com «entrada» e deixa implícita a referência à morte.
- source_word: ἴση
  choice: igual
  rationale: É o equivalente direto do adjetivo grego e conserva a ideia de uma saída igual ou comum a todos.
- source_word: δὲ
  choice: Mas
  rationale: 'Marca a leve contraposição com a descrição anterior: apesar da condição régia do falante, seu começo e fim são os mesmos de toda a humanidade.'
theological_decisions:
- issue: Explicitar ou não a referência implícita ao nascimento e à morte
  choice: Manter no texto principal as metáforas «entrada na vida» e «saída».
  alternative: Traduzir explicitamente como «nascimento» e «morte».
  rationale: O grego emprega as imagens correspondentes de entrada e saída, não os termos explícitos para nascimento e morte. Preservá-las mantém o estilo e a tensão do original sem interpretação excessiva.
- issue: Entender μία e ἴση como singularidade/igualdade ou como identidade compartilhada
  choice: Traduzir «uma só» e «igual», preservando a formulação lexical do grego.
  alternative: Traduzir «a mesma entrada» e «a mesma saída».
  rationale: A alternativa exprime corretamente o sentido contextual, mas o texto principal conserva a distinção formal entre μία e ἴση e registra a outra leitura em nota.
translation_notes:
  register: Português atual, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A frase conserva o paralelismo conciso do grego e evita explicitar nascimento e morte.
