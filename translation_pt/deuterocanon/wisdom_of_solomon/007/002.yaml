translation:
  language: pt
  text: durante dez meses[a], tendo sido formado[b] no sangue, a partir da semente de um homem e do prazer da união no leito[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz «dez meses», conforme uma antiga forma de contar a gestação, provavelmente por meses lunares.
    reason: cultural_note
  - marker: b
    text: 'Ou: «tendo-se coagulado». O particípio grego pode transmitir a ideia de coagulação ou de formação.'
    reason: lexical_alternative
  - marker: c
    text: A frase final é um eufemismo para a união sexual. Literalmente, traz «e do prazer, tendo-se unido no sono»; aqui «sono» provavelmente evoca o leito, e o particípio pode indicar o ato de unir-se sexualmente.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεκαμηνιαίῳ χρόνῳ
  choice: durante dez meses
  rationale: Expressa naturalmente em português a duração da gestação e conserva a contagem antiga de dez meses.
- source_word: παγεὶς
  choice: tendo sido formado
  rationale: O particípio de πήγνυμι pode indicar fixação, coagulação ou formação; «formado» comunica o sentido embrionário com clareza, enquanto a nota preserva a alternativa mais concreta.
- source_word: ἐν αἵματι
  choice: no sangue
  rationale: Mantém o valor direto de ἐν e a imagem corporal concreta do texto grego.
- source_word: ἐκ σπέρματος ἀνδρὸς
  choice: a partir da semente de um homem
  rationale: Preserva a imagem procriadora de σπέρμα sem recorrer ao termo clínico «sêmen».
- source_word: ἡδονῆς
  choice: do prazer
  rationale: Traduz diretamente ἡδονή; o contexto e a nota esclarecem seu caráter sexual sem tornar o texto principal mais explícito que o grego.
- source_word: ὕπνῳ συνελθούσης
  choice: que acompanha o sono
  rationale: Reproduz de maneira digna e compreensível o eufemismo sexual comprimido do grego, sem explicitar indevidamente a relação sexual.
theological_decisions:
- issue: Ênfase antropológica na geração humana comum
  choice: Descrever a gestação e a concepção humanas ordinárias em linguagem corporal e contida.
  alternative: Enfatizar a coagulação segundo a embriologia antiga ou nomear explicitamente a relação sexual.
  rationale: O contexto ressalta a plena humanidade e o nascimento comum de Salomão. A tradução mantém essa ênfase sem impor precisão biológica moderna nem eliminar o eufemismo do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das notas segue a ocorrência dos marcadores no texto. O eufemismo do original é preservado, e as ambiguidades lexical e cultural ficam registradas nas notas.
