  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/030.yaml
  text: For this is succeeded by night[b][a], but evil does not prevail against wisdom.
translation:
  language: pt
  text: Pois a noite vem depois disso[a], mas o mal não prevalece contra a sabedoria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, depois da luz mencionada no versículo anterior. O grego traz «isto», deixando o referente implícito.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «mas o mal não consegue resistir à sabedoria».'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο
  choice: disso
  rationale: Mantém o demonstrativo neutro do grego e sua referência implícita à luz mencionada no versículo anterior, sem substituir o pronome pelo antecedente.
- source_word: διαδέχεται
  choice: vem depois de
  rationale: Expressa com naturalidade a ideia de suceder ou seguir em sequência; na construção grega, «noite» é o sujeito e «isso» é o objeto.
- source_word: νύξ
  choice: a noite
  rationale: Equivalente direto, em contraste contextual com a luz do versículo anterior.
- source_word: σοφίας
  choice: contra a sabedoria
  rationale: O genitivo depende de ἀντισχύει e designa aquilo contra o qual o mal tenta resistir ou prevalecer.
- source_word: οὐκ ἀντισχύει
  choice: não prevalece contra
  rationale: Preserva a imagem de confronto e o sentido de não conseguir mostrar-se forte ou vitorioso contra alguém.
- source_word: κακία
  choice: o mal
  rationale: Representa de modo amplo e natural a maldade moral contrastada com a sabedoria, sem restringir o termo a malícia ou vício.
theological_decisions:
- issue: Referente implícito de τοῦτο
  choice: Conservar o demonstrativo como «disso».
  alternative: 'Explicitar: «Pois a noite vem depois da luz».'
  rationale: O texto grego não repete «luz», embora o contexto anterior deixe claro o referente. A tradução conserva essa coesão implícita e a esclarece em nota.
- issue: Força de ἀντισχύει
  choice: «o mal não prevalece contra a sabedoria»
  alternative: «o mal não consegue resistir à sabedoria»
  rationale: A opção principal mantém a linguagem de confronto e afirma o insucesso do mal sem decidir além do grego se a forma verbal deve ser entendida como incapacidade inerente ou como resultado.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem ativa da primeira oração acompanha a sintaxe grega e evita a construção pouco idiomática «isso é sucedido pela noite».
