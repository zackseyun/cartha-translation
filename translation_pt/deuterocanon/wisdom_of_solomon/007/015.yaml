base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/015.yaml
  text: But may God grant me to speak with sound judgment and to think in a manner worthy of the things given[c][b][a], because he himself is both the guide of wisdom and the one who sets the wise right.
translation:
  language: pt
  text: Mas que Deus me conceda falar com bom senso[a] e refletir de modo digno sobre as coisas dadas[b], pois ele mesmo é o guia da sabedoria e aquele que corrige os sábios[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “falar segundo o entendimento”. A expressão grega pode indicar uma fala em conformidade com o bom senso ou com a compreensão.
    reason: lexical_alternative
  - marker: b
    text: Ou “sobre o que foi dado” ou “sobre os dons dados”. O grego mantém amplo o objeto, sem especificá-lo nem identificar quem o recebeu.
    reason: lexical_alternative
  - marker: c
    text: Ou “põe os sábios no caminho certo” ou “dirige os sábios”. O termo designa quem endireita ou orienta corretamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: que ... conceda
  rationale: O optativo expressa desejo ou oração; esta construção preserva naturalmente em português a força de uma súplica.
- source_word: εἰπεῖν κατὰ γνώμην
  choice: falar com bom senso
  rationale: A expressão indica fala em conformidade com juízo sensato ou entendimento ponderado; “com bom senso” é claro e idiomático.
- source_word: ἐνθυμηθῆναι
  choice: refletir
  rationale: O verbo denota pensamento interior e ponderação; “refletir” comunica melhor essa nuance do que o mais amplo “pensar”.
- source_word: ἀξίως
  choice: de modo digno
  rationale: Preserva a ideia de dignidade ou adequação expressa pelo advérbio, em formulação natural.
- source_word: τῶν δεδομένων
  choice: sobre as coisas que me foram dadas
  rationale: O particípio substantivado deixa amplo o objeto; a formulação evita especificá-lo como dons ou ensinamentos. A preposição “sobre” explicita em português a relação natural com “refletir”.
- source_word: ὁδηγός
  choice: guia
  rationale: Expressa de modo conciso aquele que conduz pelo caminho.
- source_word: διορθωτής
  choice: aquele que corrige
  rationale: O substantivo designa quem endireita, corrige ou põe em ordem; a formulação mantém a nuance corretiva sem recorrer ao pouco natural “corretor”.
- source_word: τῶν σοφῶν
  choice: os sábios
  rationale: Reproduz de maneira concisa e idiomática o adjetivo substantivado plural.
theological_decisions:
- issue: Referente e alcance de τῶν δεδομένων
  choice: referência aberta às coisas dadas ao orador, sem limitar quais sejam
  alternative: os dons recebidos; os ensinamentos transmitidos
  rationale: O grego não identifica de forma mais estreita o objeto. A tradução conserva essa amplitude e não introduz um referente doutrinariamente específico.
- issue: Força de διορθωτής na relação entre Deus e os sábios
  choice: Deus é aquele que corrige os sábios
  alternative: Deus dirige os sábios; Deus põe os sábios no caminho certo
  rationale: O termo contém a ideia de endireitar ou corrigir. “Corrige” conserva a tensão de que até os sábios dependem de Deus, sem acrescentar a noção mais forte de disciplina punitiva.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A oração inicial conserva a força optativa; o paralelismo final e a dependência dos sábios em relação a Deus permanecem explícitos.
