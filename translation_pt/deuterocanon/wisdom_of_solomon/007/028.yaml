  text: For God loves nothing except the one who dwells with wisdom[a].
translation:
  language: pt
  text: Pois Deus nada ama, a não ser aquele que vive com a sabedoria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele que vive com a Sabedoria”. Neste capítulo, a sabedoria é fortemente personificada.'
    reason: Registra a leitura personificada possível sem impô-la no texto principal.
lexical_decisions:
- source_word: οὐθὲν
  choice: nada
  rationale: Preserva o objeto absoluto neutro do grego. Embora a exceção se refira a uma pessoa, traduzir por “ninguém” estreitaria a formulação mais ampla da fonte.
- source_word: ἀγαπᾷ
  choice: ama
  rationale: Equivalente direto e natural de ἀγαπάω, mantendo o peso da afirmação sobre o amor divino.
- source_word: εἰ μὴ
  choice: a não ser
  rationale: Neste contexto, a expressão introduz uma exceção, não uma condição; “a não ser” comunica isso com naturalidade.
- source_word: τὸν ... συνοικοῦντα
  choice: aquele que vive com
  rationale: O particípio substantivado designa uma pessoa caracterizada por convivência contínua. “Vive com” preserva a ideia relacional de συνοικέω sem recorrer ao mais técnico “coabita”.
- source_word: σοφίᾳ
  choice: a sabedoria
  rationale: O dativo indica associação. A forma minúscula conserva o sentido lexical e não torna explícita demais a personificação sugerida pelo contexto.
theological_decisions:
- issue: Capitalização de “sabedoria” como figura personificada
  choice: sabedoria
  alternative: Sabedoria
  rationale: O contexto personifica fortemente a sabedoria, mas o grego não possui aqui uma distinção gráfica equivalente. A minúscula preserva a tensão entre qualidade divina e figura personificada.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Pois” mantém a ligação explicativa de γάρ; “vive com” expressa convivência duradoura de modo natural.
