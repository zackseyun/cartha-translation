base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/022.yaml
  text: For wisdom[a], the craftswoman of all things, taught me. For in her is an intelligent, holy, unique, manifold, subtle, agile, clear, undefiled, distinct[b], unharmed, loving-the-good, keen, unhindered, beneficent spirit,
translation:
  language: pt
  text: Pois a sabedoria, artífice de todas as coisas, me ensinou. Pois nela há um espírito inteligente, santo, único[a], multiforme, sutil, ágil, claro, incontaminado, distinto, incólume[b], amante do bem, agudo, livre de impedimentos e benfazejo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “unigênito” ou “único em sua espécie”. Neste contexto, μονογενές favorece o sentido de singularidade, não necessariamente o de filiação.
    reason: lexical_alternative
  - marker: b
    text: Ou “inofensivo”. O termo grego pode indicar tanto aquele que permanece sem dano quanto aquele que não causa dano.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεχνῖτις
  choice: artífice
  rationale: O substantivo feminino designa alguém hábil em uma arte ou ofício. “A sabedoria, artífice” conserva a personificação feminina e o sentido de agente habilidosa, com naturalidade em português.
- source_word: ἐδίδαξέν
  choice: me ensinou
  rationale: Tradução direta do aoristo com o objeto με, em ordem natural no português.
- source_word: πνεῦμα
  choice: espírito
  rationale: Neste contexto sapiencial, refere-se à realidade intelectual e animadora presente na sabedoria, e não a vento ou respiração literal.
- source_word: νοερόν
  choice: inteligente
  rationale: Expressa capacidade de mente e entendimento em linguagem moderna e clara.
- source_word: μονογενές
  choice: único
  rationale: Como não há aqui relação filial explícita, o adjetivo tem naturalmente o sentido de singular, único em sua espécie. A alternativa tradicional é preservada em nota.
- source_word: πολυμερές
  choice: multiforme
  rationale: Comunica a ideia de possuir muitos aspectos ou formas sem sugerir necessariamente divisão material.
- source_word: λεπτόν
  choice: sutil
  rationale: Preserva a noção de finura e capacidade penetrante, em vez de fragilidade.
- source_word: εὐκίνητον
  choice: ágil
  rationale: Expressa facilidade de movimento de modo conciso e idiomático.
- source_word: τρανόν
  choice: claro
  rationale: O termo indica clareza ou evidência; “claro” é a equivalência mais natural.
- source_word: ἀμόλυντον
  choice: incontaminado
  rationale: Conserva a ideia de estar livre de mancha ou contaminação, inclusive com possíveis ressonâncias morais e cultuais.
- source_word: σαφές
  choice: distinto
  rationale: Distingue este adjetivo de τρανόν (“claro”) sem eliminar a proximidade semântica entre ambos.
- source_word: ἀπήμαντον
  choice: incólume
  rationale: Mantém a nuance passiva de não ter sofrido dano. A possibilidade ativa, “inofensivo”, é registrada em nota.
- source_word: φιλάγαθον
  choice: amante do bem
  rationale: Reproduz diretamente a composição do grego e sua força adjetival.
- source_word: ὀξύ
  choice: agudo
  rationale: Preserva a imagem de acuidade, prontidão e poder penetrante sem restringi-la apenas à inteligência.
- source_word: ἀκώλυτον
  choice: livre de impedimentos
  rationale: Expressa com clareza aquilo que não pode ser obstruído ou detido.
- source_word: εὐεργετικόν
  choice: benfazejo
  rationale: Termo digno e conciso para aquilo que faz o bem ou produz benefícios.
theological_decisions:
- issue: Sentido de μονογενές na descrição do espírito presente na sabedoria
  choice: único
  alternative: unigênito; único em sua espécie
  rationale: O adjetivo modifica πνεῦμα numa enumeração de qualidades e não descreve uma relação filial explícita. O texto principal mantém o sentido contextual de singularidade, enquanto a tradução tradicional teologicamente relevante permanece visível na nota.
- issue: Voz semântica de ἀπήμαντον
  choice: incólume
  alternative: inofensivo
  rationale: O grego admite tanto a ideia de estar livre de dano quanto a de não causar dano. “Incólume” conserva no texto principal a nuance passiva sem apagar a leitura ativa, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “a sabedoria, artífice” mantém a personificação feminina sem recorrer a um neologismo. A enumeração segue de perto a ordem grega; a vírgula final indica que a descrição continua no versículo seguinte.
