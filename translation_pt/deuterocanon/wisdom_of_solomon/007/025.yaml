base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/025.yaml
  text: For she is a breath of the power of God[a], and a pure emanation of the glory of the Almighty[b]; therefore nothing defiled enters into her.
translation:
  language: pt
  text: Pois ela é um sopro do poder de Deus[a] e uma emanação pura da glória do Todo-Poderoso[b]; por isso, nada contaminado entra nela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vapor” em vez de “sopro” (ἀτμίς). A imagem grega pode sugerir uma exalação ou um vapor que se eleva de uma fonte.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma emanação límpida, sem mistura” em vez de “uma emanação pura”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀτμίς
  choice: sopro
  rationale: O termo pode designar sopro, exalação ou vapor. “Sopro” preserva a imagem de algo que procede de uma fonte e soa natural em português, sem reduzir a metáfora a um fenômeno meteorológico.
- source_word: δυνάμεως
  choice: poder
  rationale: “Poder” traduz de modo direto e corrente o sentido do substantivo neste contexto.
- source_word: ἀπόρροια
  choice: emanação
  rationale: O termo indica aquilo que flui ou procede de uma fonte. “Emanação” conserva a densidade da imagem sem a transformar em paráfrase explicativa.
- source_word: εἰλικρινής
  choice: pura
  rationale: Aqui o adjetivo caracteriza a emanação como sem mistura ou contaminação, preparando a afirmação seguinte de que nada contaminado penetra na Sabedoria.
- source_word: παντοκράτορος
  choice: Todo-Poderoso
  rationale: É a forma titular consagrada e inteligível em português, adequada à ideia de soberania divina.
- source_word: μεμιαμμένον
  choice: contaminado
  rationale: O particípio perfeito expressa um estado resultante de impureza. “Contaminado” abrange a ideia moral e cultual sem restringi-la a uma única esfera.
- source_word: παρεμπίπτει
  choice: penetra nela
  rationale: Embora o verbo possa ser entendido mais literalmente como cair ou entrar, “penetra nela” comunica com naturalidade que nada impuro consegue ter acesso à Sabedoria.
theological_decisions:
- issue: Personificação feminina da Sabedoria
  choice: Mantida por meio dos pronomes “ela” e “nela”.
  alternative: Repetir “a Sabedoria” ou empregar uma formulação impessoal.
  rationale: A concordância feminina grega retoma a Sabedoria, personificada no contexto. A tradução conserva esse retrato literário e teológico sem acrescentar identificação doutrinária não expressa no versículo.
- issue: Relação metafísica entre a Sabedoria e Deus nas imagens de procedência
  choice: As imagens foram traduzidas diretamente como “um sopro do poder de Deus” e “uma emanação pura da glória do Todo-Poderoso”.
  alternative: Atenuar a noção de procedência por meio de paráfrase ou empregar terminologia filosófica mais técnica.
  rationale: O grego apresenta imagens fortes de procedência, mas não define aqui uma formulação metafísica posterior. A tradução preserva a força e a tensão do texto sem as resolver por sistema teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Emanação” foi mantido por sua precisão e pelo peso poético-filosófico do original; a estrutura paralela e a personificação feminina foram preservadas.
