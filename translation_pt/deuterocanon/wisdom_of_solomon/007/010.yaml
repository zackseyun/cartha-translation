base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/010.yaml
  text: I loved her more than health and beauty[a], and I chose to have her rather than light, because the radiance that comes from her never sleeps.
translation:
  language: pt
  text: Eu a amei mais do que a saúde e a beleza e preferi tê-la em lugar da luz, porque o esplendor que vem dela nunca dorme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque é insone o esplendor que vem dela”. O grego descreve como incessante a luz que emana da sabedoria.'
    reason: Alternativa lexical para ἀκοίμητον e esclarecimento da metáfora.
lexical_decisions:
- source_word: ὑπὲρ ὑγίειαν καὶ εὐμορφίαν
  choice: mais do que a saúde e a beleza
  rationale: ὑπέρ tem aqui valor comparativo e expressa que a sabedoria é estimada acima da saúde e da beleza. A formulação é direta e natural em português.
- source_word: ἠγάπησα αὐτήν
  choice: Eu a amei
  rationale: O aoristo de ἀγαπάω expressa amor ou elevada estima. O pronome feminino preserva a personificação da sabedoria presente no contexto grego.
- source_word: προειλόμην αὐτὴν ἀντὶ φωτὸς ἔχειν
  choice: preferi tê-la em lugar da luz
  rationale: προειλόμην indica escolha deliberada ou preferência, e ἀντί marca a opção por uma coisa em lugar de outra. “Preferi tê-la” comunica com naturalidade tanto a escolha quanto a comparação.
- source_word: τὸ ἐκ ταύτης φέγγος
  choice: o esplendor que vem dela
  rationale: φέγγος designa brilho, claridade ou esplendor. “Esplendor” mantém o tom poético, enquanto “que vem dela” traduz de modo claro ἐκ ταύτης.
- source_word: ἀκοίμητον
  choice: nunca dorme
  rationale: O adjetivo significa literalmente “insone” ou “que não dorme”. Aplicado ao esplendor, “nunca dorme” conserva a metáfora vívida e comunica sua continuidade sem reduzi-la a uma abstração.
theological_decisions:
- issue: Personificação feminina da sabedoria
  choice: Manter o pronome feminino em “Eu a amei” e “tê-la”
  alternative: Empregar formas impessoais ou repetir “a sabedoria”
  rationale: A sabedoria é substantivo feminino e aparece fortemente personificada no texto grego. Os pronomes femininos preservam essa imagem poética sem acrescentar uma identificação teológica que o versículo não explicita.
- issue: Caráter incessante do esplendor procedente da sabedoria
  choice: Preservar a metáfora “nunca dorme”
  alternative: Explicitar como “nunca se apaga” ou “é incessante”
  rationale: O grego emprega ἀκοίμητον, literalmente “insone”. A tradução mantém a tensão e a força poética do original, sem interpretar o sono como simples extinção da luz.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A estrutura poética e a personificação feminina foram preservadas; evitou-se linguagem confessional ou tecnicamente denominacional.
