lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Conector inferencial natural que mantém a relação lógica com o contexto anterior.
- source_word: ηὐξάμην
  choice: orei
  rationale: O aoristo médio de εὔχομαι expressa aqui o ato de orar; a forma escolhida é direta e corrente.
- source_word: φρόνησις
  choice: entendimento
  rationale: Preserva a ideia de discernimento ou compreensão prática e a distingue de σοφία, traduzida como “sabedoria”.
- source_word: ἐδόθη μοι
  choice: me foi dado
  rationale: Mantém a construção passiva e destaca que o entendimento foi recebido, não alcançado por esforço próprio.
- source_word: ἐπεκαλεσάμην
  choice: clamei
  rationale: Comunica o sentido de apelo ou invocação e permite conservar a ausência de objeto explícito no grego.
- source_word: ἦλθέν μοι
  choice: veio a mim
  rationale: Reproduz de modo claro o verbo de movimento com o dativo, sem acrescentar a ideia mais forte de vir sobre alguém.
- source_word: πνεῦμα σοφίας
  choice: um espírito de sabedoria
  rationale: Reflete a expressão grega sem artigo e evita transformá-la indevidamente em título formal ou reduzi-la a mera disposição psicológica.
theological_decisions:
- issue: Identidade e natureza de πνεῦμα σοφίας
  choice: um espírito de sabedoria
  alternative: o espírito de sabedoria
  rationale: A expressão sem artigo admite força espiritual, mas não exige a identificação explícita com um título definido. A tradução conserva essa abertura teológica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Clamei” mantém o tom de oração sem inserir no texto um objeto ausente no grego; “me foi dado” preserva a passiva em ordem natural no português contemporâneo.
