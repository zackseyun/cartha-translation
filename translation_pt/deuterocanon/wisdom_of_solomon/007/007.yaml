  text: Therefore I prayed[a], and understanding was given to me; I called upon God[b], and a spirit of wisdom came to me.
translation:
  language: pt
  text: Por isso, orei, e me foi dado entendimento; clamei[a], e veio a mim um espírito de sabedoria[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “invoquei [Deus]”. O grego não declara explicitamente o objeto.'
