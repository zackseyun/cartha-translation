  text: But all good things came to me together with her[a], and in her hands was wealth beyond counting[b];
translation:
  language: pt
  text: Mas todas as coisas boas vieram a mim juntamente com ela[a], e em suas mãos havia riqueza incontável[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, junto com a Sabedoria, personificada como mulher no contexto.
    reason: cross_reference
  - marker: b
    text: 'Ou: «riqueza sem conta» ou «riquezas imensuráveis».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: vieram
  rationale: O aoristo de ἔρχομαι descreve aqui os bens que chegaram ao orador. O plural em português faz concordância natural com «todos os bens», sujeito plural.
- source_word: τὰ ἀγαθὰ
  choice: todos os bens
  rationale: O neutro plural abrange coisas boas, benefícios ou bens sem restringir o sentido apenas a posses materiais.
- source_word: ὁμοῦ πάντα
  choice: todos ... junto com ela
  rationale: πάντα expressa totalidade, enquanto ὁμοῦ, em combinação com μετά, reforça que os bens vieram juntamente com a Sabedoria. A formulação evita sugerir necessariamente que tudo ocorreu «de uma só vez».
- source_word: μετ’ αὐτῆς
  choice: junto com ela
  rationale: O pronome feminino retoma a Sabedoria personificada no contexto, e a expressão conserva a associação estreita do grego.
- source_word: ἀναρίθμητος πλοῦτος
  choice: uma riqueza incontável
  rationale: ἀναρίθμητος significa aquilo que não se pode contar ou enumerar, e πλοῦτος designa riqueza. A tradução mantém a força hiperbólica e soa natural em português.
- source_word: ἐν ταῖς χερσὶν αὐτῆς
  choice: em suas mãos havia
  rationale: 'Mantém a imagem espacial e possessiva do grego: a riqueza está nas mãos da Sabedoria, isto é, acompanha o que ela traz.'
theological_decisions:
- issue: Referente do pronome feminino αὐτῆς
  choice: O pronome refere-se à Sabedoria personificada como mulher no contexto imediato.
  alternative: Um antecedente feminino genérico seria gramaticalmente concebível, mas é contextualmente improvável.
  rationale: O capítulo 7 personifica a Sabedoria no feminino. Preservar «ela» conserva essa figura literária e sua tensão teológica sem identificar a personagem com uma formulação doutrinária posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada para fluidez, preservando a personificação feminina, a abrangência de τὰ ἀγαθὰ e a imagem das mãos.
