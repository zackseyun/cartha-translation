  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/029.yaml
  text: For she is more beautiful than the sun, and above every arrangement of the stars. Compared with the light, she is found to be earlier.
translation:
  language: pt
  text: Pois ela é mais bela do que o sol e está acima de toda disposição dos astros. Comparada à luz, é anterior.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐπρεπεστέρα
  choice: mais bela
  rationale: O comparativo descreve beleza, formosura ou esplendor; “mais bela” é natural e mantém a personificação feminina da Sabedoria.
- source_word: ὑπὲρ πᾶσαν ἄστρων θέσιν
  choice: acima de todas as constelações
  rationale: θέσις, em relação aos astros, pode indicar sua disposição ou configuração. “Constelações” expressa essa ideia de modo claro e idiomático, sem reduzir a frase a estrelas isoladas.
- source_word: προτέρα
  choice: anterior
  rationale: O comparativo significa primariamente “anterior” ou “precedente”. A tradução conserva a dimensão temporal e a possível ideia de primazia, sem substituí-la por “superior”.
theological_decisions:
- issue: Sentido de προτέρα na comparação entre a Sabedoria e a luz
  choice: anterior
  alternative: superior
  rationale: Embora o contexto de elogio possa sugerir superioridade, o valor lexical mais direto é temporal ou ordinal. “Anterior” preserva a tensão do texto e evita resolver interpretativamente a relação entre a Sabedoria e a luz.
translation_notes:
  register: Português moderno, digno e acessível, com fluência brasileira. Mantém-se o pronome feminino “ela” porque o referente contextual é a Sabedoria. “Mostra ser” traduz naturalmente εὑρίσκεται sem exigir a formulação mais rígida “é encontrada como”.
