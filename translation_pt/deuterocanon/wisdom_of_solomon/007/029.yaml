revisions:
- from: Pois ela é mais bela do que o sol e está acima de todas as constelações. Comparada com a luz, mostra ser anterior.
  to: Pois ela é mais bela do que o sol e está acima de toda disposição dos astros. Comparada à luz, é anterior.
  rationale: A revisão substitui uma especificação astronômica interpretativa por «disposição dos astros», que corresponde mais estreitamente a θέσις, e simplifica a oração final para uma formulação portuguesa mais natural. «Anterior» é mantido para preservar a ambiguidade temporal/ordinal de προτέρα.
