lexical_decisions:
- source_word: φιλάνθρωπον
  choice: amiga da humanidade
  rationale: Expressa amor e benevolência para com os seres humanos, conservando a forma adjetiva da enumeração e evitando o sentido moderno mais restrito de “humanitária”.
- source_word: βέβαιον
  choice: firme
  rationale: Comunica estabilidade e constância de modo natural e conciso nesta sequência de qualidades.
- source_word: ἀσφαλές
  choice: segura
  rationale: Preserva a ideia de segurança e ausência de falha ou perigo, sem confundi-la com a estabilidade já expressa por βέβαιον.
- source_word: ἀμέριμνον
  choice: livre de inquietação
  rationale: Transmite ausência de ansiedade ou preocupação sem o tom possivelmente leviano de “despreocupada”.
- source_word: παντοδύναμον
  choice: toda-poderosa
  rationale: Reproduz transparentemente o composto grego e evita depender do termo teológico mais tradicional “onipotente”.
- source_word: πανεπίσκοπον
  choice: que tudo observa
  rationale: Mantém a noção de ver, inspecionar ou vigiar tudo em linguagem corrente, sem reduzir necessariamente o termo à mera percepção visual.
- source_word: διὰ πάντων χωροῦν
  choice: atravessa todos
  rationale: Conserva a imagem de movimento ou passagem através de todos, deixando em nota a possibilidade contextual de permeação.
- source_word: πνευμάτων
  choice: espíritos
  rationale: É o equivalente direto e contextualmente apropriado para πνευμάτων nesta descrição do alcance da Sabedoria.
- source_word: νοερῶν
  choice: inteligentes
  rationale: Expressa a relação com a mente e o entendimento em linguagem acessível.
- source_word: καθαρῶν
  choice: puros
  rationale: É o equivalente corrente e adequado na elevada sequência descritiva.
- source_word: λεπτοτάτων
  choice: extremamente sutis
  rationale: Preserva a força superlativa e a nuance de extrema finura ou sutileza com naturalidade em português.
theological_decisions:
- issue: Se παντοδύναμον deve receber o termo teológico tradicional “onipotente”
  choice: toda-poderosa
  alternative: onipotente
  rationale: A escolha comunica diretamente o sentido lexical de possuir todo poder, sem impor ressonâncias dogmáticas posteriores à enumeração.
- issue: Como entender διὰ πάντων χωροῦν πνευμάτων νοερῶν καθαρῶν λεπτοτάτων
  choice: atravessa todos os espíritos inteligentes, puros e extremamente sutis
  alternative: permeia todos os espíritos inteligentes, puros e extremamente sutis
  rationale: “Atravessa” mantém visível a imagem dinâmica do grego; a nota registra “permeia” como leitura legítima, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração conserva sua forma compacta; as alternativas relevantes são apresentadas em notas sem tornar o texto principal excessivamente técnico.
