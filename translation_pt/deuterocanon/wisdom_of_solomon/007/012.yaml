  text: And I rejoiced in them all, because wisdom leads them; but I did not know that she is their mother.
translation:
  language: pt
  text: E eu me alegrei com todas essas coisas, porque a Sabedoria as conduz; mas eu não sabia que ela era a origem delas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐφράνθην
  choice: eu me alegrei
  rationale: Expressa de modo natural o aoristo passivo de sentido médio, indicando a alegria experimentada pelo sujeito.
- source_word: ἐπὶ πάντων
  choice: com todas essas coisas
  rationale: No contexto, πάντων retoma os bens anteriormente mencionados; “essas coisas” explicita essa referência sem identificar novos elementos.
- source_word: ἡγεῖται
  choice: conduz
  rationale: Preserva o sentido de ir à frente, liderar ou guiar, bem como o presente verbal.
- source_word: γένεσιν
  choice: mãe
  rationale: Embora o termo possa significar origem, nascimento ou fonte, aqui funciona predicativamente e personifica a Sabedoria como aquela de quem esses bens procedem; “mãe” comunica essa imagem de maneira direta e concorda com a leitura contextual adotada.
- source_word: τούτων
  choice: delas
  rationale: Retoma de forma idiomática em português “todas essas coisas”, evitando repetição pesada.
theological_decisions:
- issue: Personificação da Sabedoria e sua relação com os bens
  choice: ela era a mãe delas
  alternative: ela era a origem dessas coisas
  rationale: Mantém a personificação feminina e a imagem geradora sugerida por γένεσις, sem acrescentar uma identificação dogmática da Sabedoria.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego sem rigidez. A inicial maiúscula em “Sabedoria” marca a personificação literária no contexto, sem impor uma interpretação confessional.
