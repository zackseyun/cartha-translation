base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/026.yaml
  text: For she is a radiance of eternal light[a], and a spotless mirror of the working of God, and an image of his goodness.
translation:
  language: pt
  text: Pois ela é o resplendor da luz eterna[a], um espelho imaculado da ação de Deus e uma imagem da sua bondade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o reflexo da luz eterna”. O termo grego pode indicar tanto o resplendor que emana de uma fonte como o brilho refletido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαύγασμα
  choice: resplendor
  rationale: Expressa com naturalidade o brilho que procede de uma fonte, sem perder por completo a possibilidade de brilho refletido, registrada em nota.
- source_word: φωτὸς ἀϊδίου
  choice: da luz eterna
  rationale: Preserva a relação genitiva do grego e traduz ἀΐδιος de modo claro, elevado e corrente.
- source_word: ἔσοπτρον ἀκηλίδωτον
  choice: espelho imaculado
  rationale: Mantém diretamente a imagem do espelho e o sentido de algo sem mancha ou mácula.
- source_word: τῆς τοῦ θεοῦ ἐνεργείας
  choice: da ação de Deus
  rationale: Comunica a atuação efetiva de Deus em português natural, evitando o sentido técnico moderno que “energia” poderia sugerir.
- source_word: εἰκὼν τῆς ἀγαθότητος αὐτοῦ
  choice: uma imagem da sua bondade
  rationale: “Imagem” e “bondade” são equivalentes diretos e preservam a amplitude teológica da expressão.
theological_decisions:
- issue: Personificação feminina da Sabedoria
  choice: Mantida por meio do pronome “ela”
  alternative: Repetir “a Sabedoria” ou empregar uma paráfrase sem gênero
  rationale: O contexto personifica a Sabedoria no feminino; “ela” preserva esse traço literário e gramatical sem definir além do texto a natureza dessa personificação.
- issue: Relação entre o resplendor e a luz eterna
  choice: “o resplendor da luz eterna”
  alternative: “o reflexo da luz eterna”
  rationale: A formulação mantém a relação genitiva e a tensão lexical de ἀπαύγασμα; a possibilidade de reflexão é explicitada em nota, sem ser eliminada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva as três imagens paralelas do grego — resplendor, espelho e imagem — sem introduzir terminologia teológica técnica.
