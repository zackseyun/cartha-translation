  text: For he himself gave me unerring knowledge of the things that exist[a], to know the structure of the world and the activity of the elements[c][b],
translation:
  language: pt
  text: Pois ele mesmo me deu um conhecimento isento de erro sobre as coisas que existem[a], para conhecer a estrutura do mundo[b] e a atividade dos elementos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conhecimento verdadeiro” ou “conhecimento sem falsidade”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a constituição do mundo” ou “a organização do universo”.
    reason: lexical_alternative
  - marker: c
    text: Isto é, os componentes fundamentais do mundo físico.
    reason: cultural_note
lexical_decisions:
- source_word: αὐτὸς
  choice: ele mesmo
  rationale: Preserva a ênfase do pronome intensivo sem substituir o pronome por “Deus”, embora o contexto identifique Deus como o referente.
- source_word: ἔδωκεν
  choice: deu
  rationale: Equivalente simples e direto do aoristo, sem elevar desnecessariamente o registro.
- source_word: τῶν ὄντων
  choice: sobre as coisas que existem
  rationale: Expressa de modo natural o sentido abrangente das realidades existentes e evita o tom excessivamente técnico de “os entes”.
- source_word: γνῶσιν ἀψευδῆ
  choice: um conhecimento isento de erro
  rationale: Comunica que o conhecimento não é falso nem enganoso, sem recorrer a “infalível”, termo que poderia sugerir uma formulação teológica mais forte.
- source_word: εἰδέναι
  choice: para conhecer
  rationale: Mantém o infinitivo como explicação do conteúdo ou alcance do conhecimento concedido.
- source_word: σύστασιν κόσμου
  choice: a estrutura do mundo
  rationale: “Estrutura” é corrente e abrange a constituição ou organização do cosmos; “mundo” preserva a linguagem da ordem criada sem modernizá-la obrigatoriamente para “universo”.
- source_word: ἐνέργειαν στοιχείων
  choice: a atividade dos elementos
  rationale: Mantém o sentido amplo de atuação ou funcionamento dos elementos, sem interpretar ἐνέργεια especificamente como “forças”.
- source_word: στοιχείων
  choice: elementos
  rationale: No contexto cosmológico, designa os componentes fundamentais do mundo físico; “elementos” é a equivalência tradicional e inteligível.
theological_decisions:
- issue: Referente do sujeito enfático αὐτὸς
  choice: Manter “ele mesmo”, com Deus como referente contextual implícito
  alternative: Explicitar “o próprio Deus”
  rationale: O contexto imediato identifica Deus como aquele que concede o conhecimento, mas o grego emprega um pronome. A tradução preserva essa forma e não torna explícito no versículo o que permanece contextual no original.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “ele mesmo me deu” preserva a ênfase grega em ordem natural no português do Brasil. As notas mantêm alternativas lexicais genuínas sem impor terminologia filosófica ou doutrinária.
