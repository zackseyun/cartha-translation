base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/001.yaml
  text: For I also am a mortal man[a], equal to all, and a descendant of the earth-born first-formed man[b]; and in my mother’s womb I was molded into flesh.
translation:
  language: pt
  text: Pois eu também sou mortal, igual a todos e descendente do primeiro homem[a], o formado da terra; e, no ventre de minha mãe, fui moldado em carne.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “primeiro homem” alude a Adão.
    reason: Esclarece a alusão de πρωτόπλαστος sem inserir o nome próprio no texto principal.
  - marker: b
    text: 'Ou: “fui formado como carne”.'
    reason: Alternativa lexical e sintática para ἐγλύφην σάρξ.
lexical_decisions:
- source_word: θνητός
  choice: mortal
  rationale: Expressa de modo conciso a condição humana sujeita à morte, compartilhada pelo falante com todos.
- source_word: ἴσος ἅπασιν
  choice: igual a todos
  rationale: Preserva a ideia de condição comum e igualdade com todos, e não apenas de semelhança.
- source_word: γηγενοῦς
  choice: formado da terra
  rationale: Mantém a imagem da origem a partir da terra em português natural e liga-se claramente ao primeiro homem.
- source_word: ἀπόγονος
  choice: descendente
  rationale: Comunica naturalmente a relação genealógica do falante com o primeiro ser humano.
- source_word: πρωτοπλάστου
  choice: primeiro homem
  rationale: No contexto, designa o primeiro ser humano moldado, aludindo a Adão sem inserir seu nome no texto principal; a noção de formação é preservada pela expressão adjacente 'formado da terra'.
- source_word: ἐγλύφην
  choice: fui moldado
  rationale: Conserva a imagem passiva de ser modelado ou formado no ventre, sem a conotação inadequada de entalhar.
- source_word: σάρξ
  choice: em carne
  rationale: Mantém o sentido literal de σάρξ e a construção predicativa potencialmente ambígua do grego.
theological_decisions:
- issue: Referência de πρωτοπλάστου
  choice: Alusão descritiva ao primeiro homem, sem nomeá-lo no texto principal
  alternative: Adão
  rationale: O grego emprega um título descritivo, não o nome próprio. A tradução conserva a alusão e evita tornar explícito o que o original deixa implícito.
- issue: Relação entre γηγενοῦς e πρωτοπλάστου
  choice: “primeiro homem, formado da terra”
  alternative: “primeiro formado, nascido da terra”
  rationale: A formulação escolhida preserva tanto a prioridade quanto a origem terrestre do ancestral, com clareza idiomática em português.
- issue: Valor predicativo de σάρξ
  choice: “fui moldado em carne”
  alternative: “fui formado como carne”
  rationale: A construção mantém a corporeidade literal e parte da tensão sintática do original, sem substituir 'carne' por 'corpo'.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para evitar uma sequência nominal artificial, preservando a alusão à formação do primeiro ser humano a partir da terra.
