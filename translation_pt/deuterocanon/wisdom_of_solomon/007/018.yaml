lexical_decisions:
- source_word: ἀρχὴν
  choice: princípio
  rationale: No encadeamento temporal com τέλος e μεσότητα, indica o começo; “princípio” mantém o tom digno e é natural em português.
- source_word: τέλος
  choice: fim
  rationale: Em paralelo com “princípio” e “meio”, designa diretamente o término.
- source_word: μεσότητα
  choice: meio
  rationale: Expressa a parte intermediária de uma sequência temporal de modo claro e corrente.
- source_word: χρόνων
  choice: tempos
  rationale: Preserva a referência ampla a períodos ou divisões do tempo sem especificação indevida.
- source_word: τροπῶν
  choice: solstícios
  rationale: Em contexto astronômico, o plural pode designar os pontos de retorno aparente do sol, isto é, os solstícios; a amplitude literal de “movimentos de retorno” é preservada em nota.
- source_word: ἀλλαγὰς
  choice: mudanças
  rationale: Equivalente direto e claro para alterações ou alternâncias.
- source_word: μεταβολὰς
  choice: variações
  rationale: Evita repetir “mudanças” e conserva a nuance de transições ou alterações sucessivas.
- source_word: καιρῶν
  choice: estações
  rationale: Neste catálogo de conhecimento da ordem cósmica e calendárica, refere-se naturalmente às estações ou períodos determinados.
