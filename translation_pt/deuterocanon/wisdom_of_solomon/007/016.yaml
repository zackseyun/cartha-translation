  text: For in his hand are both we and our words, and all understanding and knowledge of crafts.
translation:
  language: pt
  text: Pois em sua mão estamos nós e nossas palavras, bem como toda a prudência[a] e o conhecimento dos ofícios[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo o entendimento prático” ou “toda a sabedoria prática”; o termo grego pode indicar prudência, discernimento ou sabedoria aplicada à vida.
    reason: lexical_alternative
  - marker: b
    text: Ou “das artes”, “das habilidades” ou “dos trabalhos especializados”; o grego se refere ao conhecimento ligado ao trabalho habilidoso.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ... χειρὶ αὐτοῦ
  choice: em sua mão
  rationale: Preserva a imagem bíblica de poder, domínio e dependência sem substituir a metáfora por uma explicação.
- source_word: ἡμεῖς
  choice: nós
  rationale: Mantém o pronome explícito e o paralelo entre as pessoas e suas palavras.
- source_word: οἱ λόγοι ἡμῶν
  choice: nossas palavras
  rationale: Expressão direta e abrangente para o discurso ou a expressão humana.
- source_word: πᾶσά τε φρόνησις
  choice: toda a prudência
  rationale: “Prudência” comunica o caráter prático de φρόνησις e permanece natural no registro sapiencial; a nota registra outras nuances possíveis.
- source_word: ἐργατειῶν
  choice: dos ofícios
  rationale: Refere-se a atividades práticas e trabalhos que exigem habilidade; “ofícios” é conciso e compreensível em português.
- source_word: ἐπιστήμη
  choice: conhecimento
  rationale: Representa adequadamente saber ou conhecimento especializado sem impor o sentido moderno mais restrito de “ciência”.
theological_decisions:
- issue: Referente de αὐτοῦ
  choice: “sua” refere-se a Deus pelo contexto, sem inserir o nome “Deus” no texto
  alternative: “na mão de Deus”
  rationale: O contexto identifica o referente, enquanto o pronome preserva a forma e a sobriedade do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “em sua mão” conserva a imagem do original; “bem como” torna natural a coordenação da enumeração sem alterar seu sentido.
