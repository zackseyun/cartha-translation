base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/027.yaml
  text: Though she is one[a], she can do all things, and while remaining in herself she renews all things; and passing into holy souls from generation to generation, she makes them friends of God and prophets[b];
translation:
  language: pt
  text: Embora seja uma só, ela tudo pode e, permanecendo em si mesma, renova todas as coisas[a]; de geração em geração, entrando em almas santas[b], faz delas amigas de Deus e profetas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «torna novas todas as coisas». O verbo grego pode indicar tanto renovar como tornar novo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «passando para almas santas». O particípio grego descreve o movimento da Sabedoria para almas santas ao longo das gerações.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μία
  choice: uma só
  rationale: Preserva a afirmação concisa da unidade ou singularidade da Sabedoria, sem acrescentar a ideia de isolamento que «sozinha» poderia sugerir.
- source_word: πάντα δύναται
  choice: tudo pode
  rationale: Expressa de modo direto, natural e abrangente a capacidade indicada pelo grego.
- source_word: μένουσα ἐν αὐτῇ
  choice: permanecendo em si mesma
  rationale: Entende αὐτῇ reflexivamente e conserva a tensão entre a atuação universal da Sabedoria e sua permanência em si mesma.
- source_word: τὰ πάντα καινίζει
  choice: renova todas as coisas
  rationale: καινίζει pode indicar renovar ou tornar novo; «renova» é claro e mantém aberta essa amplitude lexical.
- source_word: κατὰ γενεὰς
  choice: de geração em geração
  rationale: Reproduz naturalmente a ação contínua ao longo de gerações sucessivas.
- source_word: εἰς ψυχὰς ὁσίας μεταβαίνουσα
  choice: passando para almas santas
  rationale: Mantém tanto o movimento expresso pelo particípio quanto o termo explícito ψυχάς, sem explicar o modo dessa passagem.
- source_word: φίλους θεοῦ
  choice: amigas de Deus
  rationale: Como o antecedente imediato é «almas», o feminino mantém a concordância em português e preserva a relação expressa pelo genitivo grego.
- source_word: προφήτας
  choice: profetas
  rationale: É o equivalente corrente e exato do termo grego.
- source_word: κατασκευάζει
  choice: faz delas
  rationale: 'Neste contexto, o verbo descreve o resultado da ação da Sabedoria sobre as almas: ela as constitui ou forma como amigas de Deus e profetas. A construção evita o sentido mecânico de «constrói».'
theological_decisions:
- issue: Personificação feminina da Sabedoria
  choice: Empregar «ela» e formas femininas ligadas às almas
  alternative: Repetir «a Sabedoria» ou usar uma formulação impessoal
  rationale: A gramática grega apresenta a Sabedoria como sujeito feminino singular. A tradução preserva essa personificação literária sem definir além do texto sua condição ontológica.
- issue: Sentido de «almas santas»
  choice: Manter «almas santas»
  alternative: Traduzir por «pessoas santas»
  rationale: ψυχὰς está explícito e faz parte do registro antropológico e sapiencial do texto; substituí-lo por «pessoas» eliminaria essa textura.
- issue: Relação entre as almas e «amigas de Deus e profetas»
  choice: Traduzir «faz delas amigas de Deus e profetas»
  alternative: «prepara amigos de Deus e profetas»
  rationale: 'A formulação torna clara a relação sintática: são as almas santas nas quais a Sabedoria passa que se tornam amigas de Deus e profetas, sem acrescentar um agente ou grupo diferente.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A estrutura contínua do período grego foi preservada, mas com pontuação que torna claras as relações entre as orações. Os marcadores de nota foram colocados junto às expressões efetivamente comentadas.
