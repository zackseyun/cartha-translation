lexical_decisions:
- source_word: ἐν σπαργάνοις
  choice: entre faixas de bebê
  rationale: A expressão designa as faixas ou panos com que se envolvia um recém-nascido. A formulação mantém a imagem concreta e é compreensível em português atual.
- source_word: ἀνετράφην
  choice: Fui criado
  rationale: O aoristo passivo indica que o falante foi nutrido e criado durante a infância. “Fui criado” é natural e preserva a voz passiva.
- source_word: ἐν φροντίσιν
  choice: e cuidados
  rationale: φροντίς pode indicar cuidado, atenção, preocupação ou ansiedade. “Cuidados” se ajusta ao contexto da primeira infância sem eliminar a amplitude do termo.
theological_decisions:
- issue: Sentido de φροντίσιν no contexto da infância
  choice: cuidados
  alternative: atenções; preocupações; cuidados ansiosos
  rationale: A forma concisa ressalta a condição humana comum do falante e deixa em aberto se a ênfase recai na assistência recebida ou nas preocupações ligadas à infância.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Faixas de bebê” evita o pouco corrente “cueiros” e conserva a imagem cultural do texto grego; a nota preserva a ambiguidade de φροντίσιν.
