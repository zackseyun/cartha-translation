lexical_decisions:
- source_word: προέκρινα
  choice: preferi
  rationale: O verbo expressa dar precedência ou maior valor a algo em relação a outras coisas; “preferi” é natural e conserva a força comparativa.
- source_word: αὐτὴν
  choice: a / ela
  rationale: Os pronomes femininos retomam a sabedoria e preservam sua apresentação personificada no contexto.
- source_word: σκήπτρων
  choice: cetros
  rationale: Mantém a imagem concreta dos cetros como símbolos de autoridade régia.
- source_word: θρόνων
  choice: tronos
  rationale: Conserva a imagem literal e seu paralelismo com “cetros”, sem reduzi-la ao conceito abstrato de poder.
- source_word: πλοῦτον
  choice: riqueza
  rationale: Designa bens ou riqueza material e oferece contraste claro com a sabedoria.
- source_word: οὐδὲν ἡγησάμην
  choice: não considerei ... coisa alguma
  rationale: Reproduz o juízo de que a riqueza não tem valor quando comparada à sabedoria, em formulação idiomática e digna.
- source_word: ἐν συγκρίσει αὐτῆς
  choice: em comparação com ela
  rationale: Preserva explicitamente o padrão de comparação indicado pelo grego.
theological_decisions:
- issue: Personificação da sabedoria
  choice: Manter pronomes femininos (“a”, “ela”) para a sabedoria.
  alternative: Tratá-la apenas de modo impessoal ou substituir os pronomes pela repetição de “sabedoria”.
  rationale: O grego emprega formas femininas e, no contexto, apresenta a sabedoria em termos pessoais. A tradução conserva esse recurso literário-teológico sem definir além do texto a natureza dessa personificação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção “preferi ... aos” mantém a relação comparativa, enquanto “cetros e tronos” preserva o paralelismo régio do original.
