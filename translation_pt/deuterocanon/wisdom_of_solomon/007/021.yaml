lexical_decisions:
- source_word: ὅσα
  choice: o que
  rationale: O pronome relativo neutro plural introduz aquilo que foi conhecido; em português, «o que» expressa isso com naturalidade, sem tornar a frase pesada.
- source_word: τε
  choice: tanto... como
  rationale: A construção correlativa explicita de modo idiomático a coordenação entre κρυπτὰ e ἐμφανῆ.
- source_word: κρυπτὰ
  choice: o que está oculto
  rationale: κρυπτός designa o que está escondido ou encoberto. «Oculto» mantém o sentido amplo sem sugerir necessariamente um segredo intencional.
- source_word: ἐμφανῆ
  choice: o que está manifesto
  rationale: ἐμφανής designa aquilo que é visível, evidente ou manifesto. «Manifesto» conserva a correspondência lexical e forma um contraste claro e digno com «oculto».
- source_word: ἔγνων
  choice: passei a conhecer
  rationale: O aoristo de γινώσκω pode apresentar a entrada no estado de conhecimento. «Passei a conhecer» preserva essa possível nuance ingressiva no contexto da instrução recebida da Sabedoria.
