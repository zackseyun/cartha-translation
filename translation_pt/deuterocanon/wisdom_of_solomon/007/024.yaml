base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/024.yaml
  text: For wisdom is more mobile than any movement[b][a], and because of her purity she passes through and penetrates all things.
translation:
  language: pt
  text: Pois a sabedoria[b] é mais móvel do que qualquer movimento[a] e, por causa de sua pureza, atravessa e penetra todas as coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é mais ativa do que todo movimento”. O comparativo grego ressalta a capacidade incomparável da sabedoria para mover-se.'
    reason: lexical_alternative
  - marker: b
    text: “Sabedoria” é um substantivo feminino em grego e aparece personificada neste contexto; essa linguagem, por si só, não define sua condição ontológica.
    reason: cultural_note
lexical_decisions:
- source_word: πάσης ... κινήσεως
  choice: qualquer movimento
  rationale: O substantivo κίνησις designa movimento ou moção; com o comparativo e πάσης, “qualquer movimento” expressa naturalmente a totalidade da comparação em português.
- source_word: κινητικώτερον
  choice: mais móvel
  rationale: O comparativo, formado da raiz de “movimento”, destaca a capacidade superior da sabedoria para mover-se. “Mais móvel” preserva essa imagem sem convertê-la indevidamente em atividade moral ou intelectual.
- source_word: σοφία
  choice: sabedoria
  rationale: Equivalente usual e central na literatura sapiencial; a inicial minúscula mantém a personificação sem impor a ideia de uma hipóstase divina distinta.
- source_word: διήκει
  choice: atravessa
  rationale: O verbo comunica a ideia de passar ou estender-se através de algo. “Atravessa” é claro e preserva sua distinção em relação ao verbo seguinte.
- source_word: χωρεῖ
  choice: penetra
  rationale: Neste paralelismo, o verbo indica avançar ou abrir caminho através de todas as coisas. “Penetra” mantém a sequência de dois verbos sem fundi-los numa única ação.
- source_word: διὰ πάντων
  choice: todas as coisas
  rationale: A expressão é abrangente; “todas as coisas” conserva sua amplitude e seu tom elevado.
- source_word: διὰ τὴν καθαρότητα
  choice: por causa de sua pureza
  rationale: διά com acusativo tem valor causal. A tradução torna explícita a causa indicada pelo grego.
theological_decisions:
- issue: Personificação da sabedoria
  choice: Manter “sabedoria” em minúscula e a referência feminina natural em português.
  alternative: Grafar “Sabedoria” com maiúscula ou empregar uma formulação impessoal.
  rationale: O contexto personifica a sabedoria, e σοφία é um substantivo feminino; contudo, o versículo não exige que ela seja identificada como uma hipóstase divina distinta. A formulação preserva essa tensão.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com leitura natural no Brasil. A estrutura coordenada e os dois verbos distintos preservam o paralelismo do grego.
