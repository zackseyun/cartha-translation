  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/009.yaml
  text: Nor did I compare to her any precious stone[a], because all gold in her sight is a little sand[b], and silver will be regarded as clay before her.
translation:
  language: pt
  text: Nem comparei a ela nenhuma pedra preciosa[a], porque, à sua vista, todo o ouro é apenas um pouco de areia[b], e a prata será considerada barro diante dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma pedra de valor incalculável”. A expressão grega indica uma pedra cujo valor não pode ser estimado.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “pouca areia”; a imagem indica que o ouro tem valor insignificante em comparação com a Sabedoria.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ ὡμοίωσα αὐτῇ
  choice: Nem comparei a ela
  rationale: Mantém a coordenação negativa e traduz naturalmente o sentido de igualar ou comparar, preservando o dativo referente à Sabedoria personificada.
- source_word: λίθον ἀτίμητον
  choice: nenhuma pedra preciosa
  rationale: No contexto, ἀτίμητος indica valor incalculável, não falta de valor. “Pedra preciosa” é clara e idiomática, enquanto a nota registra a nuance de algo sem preço.
- source_word: ὅτι
  choice: porque
  rationale: Introduz com clareza a razão da superioridade da Sabedoria.
- source_word: ὁ πᾶς χρυσός
  choice: todo o ouro
  rationale: Reproduz o valor coletivo e abrangente da expressão grega.
- source_word: ἐν ὄψει αὐτῆς
  choice: à sua vista
  rationale: Conserva a imagem espacial e a personificação, sem reduzir a expressão apenas a uma comparação abstrata.
- source_word: ψάμμος ὀλίγη
  choice: apenas um pouco de areia
  rationale: Preserva a imagem literal de uma pequena quantidade de areia e explicita de modo discreto sua insignificância no contraste.
- source_word: λογισθήσεται
  choice: será considerada
  rationale: Expressa de maneira moderna e natural o futuro passivo de avaliação ou atribuição de valor.
- source_word: πηλός
  choice: barro
  rationale: Equivalente corrente e concreto em português, apropriado ao contraste de valor com a prata.
- source_word: ἄργυρος
  choice: a prata
  rationale: Equivalente lexical direto.
- source_word: ἐναντίον αὐτῆς
  choice: diante dela
  rationale: Mantém a formulação espacial e a personificação feminina da Sabedoria.
theological_decisions:
- issue: Personificação feminina da Sabedoria
  choice: Empregar referências femininas em “a ela”, “sua” e “dela”
  alternative: Repetir “a Sabedoria” ou tratar o conceito de forma não personificada
  rationale: Os pronomes gregos femininos retomam a Sabedoria no contexto. A tradução conserva o recurso literário sem acrescentar uma identificação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela e a personificação do grego foram preservadas; as notas esclarecem nuances lexicais sem sobrecarregar o versículo.
