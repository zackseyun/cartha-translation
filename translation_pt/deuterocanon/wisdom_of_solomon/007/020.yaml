  text: the natures of animals and the tempers of wild beasts[a], the violence of winds and the reasonings of men, the varieties of plants and the powers of roots.
translation:
  language: pt
  text: as naturezas dos animais e os temperamentos das feras, a violência dos ventos[a] e os raciocínios dos seres humanos, as variedades das plantas e os poderes das raízes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as forças dos espíritos” ou “ventos violentos”; o termo grego traduzido por “ventos” também pode significar “espíritos”.
    reason: Preservar a ambiguidade lexical de πνευμάτων e a construção condensada πνευμάτων βίας.
lexical_decisions:
- source_word: φύσεις ζῴων
  choice: naturezas dos animais
  rationale: Preserva o plural e o sentido de constituição ou propriedades naturais dos seres vivos.
- source_word: θυμοὺς θηρίων
  choice: temperamentos das feras
  rationale: “Temperamentos” expressa as disposições características sugeridas por θυμός, enquanto “feras” distingue os animais selvagens do termo mais amplo anterior.
- source_word: πνευμάτων βίας
  choice: violência dos ventos
  rationale: No catálogo de conhecimentos sobre o mundo natural, “ventos” oferece a leitura contextual mais provável de πνεύματα, e “violência” mantém a força de βία; a ambiguidade lexical é registrada em nota.
- source_word: διαλογισμοὺς ἀνθρώπων
  choice: raciocínios dos seres humanos
  rationale: “Raciocínios” comunica processos de reflexão, e “seres humanos” traduz o plural genérico sem restringi-lo por gênero.
- source_word: διαφορὰς φυτῶν
  choice: variedades das plantas
  rationale: Expressa naturalmente as diferenças ou distinções entre espécies e tipos de plantas.
- source_word: δυνάμεις ῥιζῶν
  choice: poderes das raízes
  rationale: Mantém o sentido antigo de capacidades ou eficácias próprias das raízes, possivelmente medicinais, sem explicitar além do grego.
theological_decisions:
- issue: Ambiguidade de πνευμάτων βίας
  choice: violência dos ventos
  alternative: forças dos espíritos; violência dos espíritos; força dos ventos
  rationale: πνεῦμα pode significar “vento” ou “espírito”. O contexto de fenômenos naturais favorece “ventos”, mas a nota preserva a leitura alternativa sem transformar uma decisão lexical em afirmação doutrinária.
translation_notes:
  register: Português atual, digno e de leitura ampla. A estrutura nominal em série foi mantida porque o versículo integra um catálogo iniciado no contexto anterior.
