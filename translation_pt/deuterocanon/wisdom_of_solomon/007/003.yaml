base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/007/003.yaml
  text: And I too, when I was born, drew in the common air, and fell upon the earth that suffers alike with all; and my first voice was the same as everyone's, as I cried.
translation:
  language: pt
  text: Também eu, ao nascer, respirei o ar comum a todos[a] e caí sobre a terra sujeita às mesmas vicissitudes[b]; e, chorando igualmente, emiti a minha primeira voz, igual à de todos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o ar compartilhado por todos”. A expressão grega ressalta que o falante entrou na mesma vida humana que todas as outras pessoas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “sujeita às mesmas experiências”, “sujeita aos mesmos sofrimentos” ou “da mesma condição”. O adjetivo grego pode referir-se a uma condição ou experiência compartilhada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος
  choice: ao nascer
  rationale: No contexto do nascimento, o particípio indica a entrada na vida humana; a formulação é natural e mantém o valor temporal.
- source_word: ἔσπασα
  choice: respirei
  rationale: Com ἀέρα como objeto, o verbo descreve aspirar ou tomar o primeiro fôlego.
- source_word: τὸν κοινὸν ἀέρα
  choice: o ar comum a todos
  rationale: κοινός significa comum ou compartilhado; a explicitação 'a todos' comunica em português a solidariedade humana enfatizada pelo contexto.
- source_word: ἐπὶ τὴν ὁμοιοπαθῆ ... γῆν
  choice: sobre a terra sujeita às mesmas experiências
  rationale: ὁμοιοπαθής exprime participação em condição, experiências ou sofrimentos semelhantes. A escolha conserva a amplitude do termo sem atribuir literalmente à terra o ato de sofrer.
- source_word: κατέπεσον
  choice: caí sobre
  rationale: Mantém a imagem física e direta do verbo grego no contexto do nascimento.
- source_word: πρώτην φωνήν
  choice: a minha primeira voz
  rationale: φωνή designa voz ou som; 'voz' evita traduzir antecipadamente o particípio κλαίων como 'choro'.
- source_word: τὴν ὁμοίαν πᾶσιν ... ἶσα κλαίων
  choice: chorando como todos
  rationale: A construção ressalta que o primeiro som do falante não diferiu do de nenhum outro ser humano; a formulação portuguesa reúne naturalmente a comparação e o ato de chorar.
theological_decisions:
- issue: Ênfase antropológica do versículo
  choice: Preservar a plena solidariedade do falante com a condição humana comum no nascimento
  alternative: Elevar ou singularizar o nascimento do falante por causa de sua condição régia
  rationale: A repetição de κοινόν, ὁμοιοπαθῆ e ὁμοίαν πᾶσιν enfatiza aquilo que ele compartilha com todos, sem sustentar aqui uma doutrina posterior específica.
- issue: Amplitude de ὁμοιοπαθής
  choice: sujeita às mesmas experiências
  alternative: sujeita aos mesmos sofrimentos
  rationale: O termo pode incluir sofrimento, mas também condição e experiências semelhantes. O texto principal preserva essa amplitude, e a nota registra a alternativa mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem foi ajustada moderadamente para evitar uma construção truncada, sem apagar a repetida ênfase grega na condição humana compartilhada.
