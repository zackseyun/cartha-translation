  text: And I learned without deceit[a], and I share without envy; I do not hide her wealth.
translation:
  language: pt
  text: Aprendi sem engano e compartilho sem inveja[a]; não escondo a riqueza dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sem regatear”; o advérbio grego indica compartilhar sem inveja nem mesquinhez.
    reason: alternative lexical/contextual nuance
lexical_decisions:
- source_word: ἀδόλως
  choice: sem engano
  rationale: Expressa a ausência de dolo ou fraude no ato de aprender, preservando de modo claro a nuance moral do grego.
- source_word: ἔμαθον
  choice: Aprendi
  rationale: Traduz diretamente o aoristo de μανθάνω e mantém a voz autobiográfica em primeira pessoa.
- source_word: ἀφθόνως
  choice: sem inveja
  rationale: Mantém a imagem grega de transmitir sem invejar nem negar a outros o que se possui; o contexto comunica também generosidade.
- source_word: μεταδίδωμι
  choice: compartilho
  rationale: Verbo natural em português para dar a outros uma parte do que se recebeu, sem acrescentar tecnicidade.
- source_word: πλοῦτον
  choice: riqueza
  rationale: Preserva a metáfora singular da abundância valiosa da sabedoria.
- source_word: αὐτῆς
  choice: dela
  rationale: Retoma a sabedoria, substantivo feminino e personificado no contexto, sem explicitar além do que o grego afirma.
- source_word: ἀποκρύπτομαι
  choice: não escondo
  rationale: Reproduz o sentido ativo contextual da forma média, em linguagem corrente e direta.
theological_decisions:
- issue: Personificação da sabedoria no pronome αὐτῆς
  choice: 'manter a referência feminina: “a riqueza dela”'
  alternative: “sua riqueza”, com referente potencialmente menos explícito
  rationale: “Dela” preserva a referência à sabedoria personificada e evita apagar o traço literário e teológico do contexto, sem impor uma identificação doutrinária posterior.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura concisa próxima do paralelismo grego. A oposição entre aprender sem engano e compartilhar sem inveja foi mantida literalmente, sem transformar ἀφθόνως apenas em “generosamente”.
