base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/006.yaml
  text: So then we went astray from the way of truth[a], and the light of righteousness did not shine on us, and the sun did not rise for us.
translation:
  language: pt
  text: Assim, nós nos desviamos do caminho da verdade, e a luz da justiça[a] não brilhou sobre nós, e o sol não nasceu para nós.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”. O termo grego pode ter sentidos tanto morais quanto judiciais.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Assim
  rationale: Marca a conclusão retrospectiva dos ímpios de modo natural e preserva a força inferencial do grego.
- source_word: ἐπλανήθημεν
  choice: nós nos desviamos
  rationale: Expressa o aoristo passivo com valor intransitivo, sem introduzir um agente externo, e mantém a imagem moral de abandonar um caminho.
- source_word: ἀπὸ ὁδοῦ ἀληθείας
  choice: do caminho da verdade
  rationale: Preserva a metáfora concreta do caminho e a relação genitiva de maneira idiomática em português.
- source_word: τὸ τῆς δικαιοσύνης φῶς
  choice: a luz da justiça
  rationale: Mantém a construção nominal do grego. Em português, 'justiça' abrange naturalmente tanto a retidão moral quanto a dimensão judicial de δικαιοσύνη.
- source_word: οὐκ ἔλαμψεν ἡμῖν
  choice: não brilhou sobre nós
  rationale: Formulação natural em português para a luz que incide sobre alguém, preservando a relação expressa pelo dativo.
- source_word: ὁ ἥλιος οὐκ ἀνέτειλεν ἡμῖν
  choice: o sol não nasceu para nós
  rationale: Traduz diretamente a imagem do nascer do sol e conserva no dativo a ideia de privação experimentada pelos falantes.
theological_decisions:
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: O termo grego pode apontar tanto para a conduta moral correta quanto para a justiça em sentido judicial. 'Justiça' é a correspondência portuguesa mais ampla e natural, enquanto a nota preserva a nuance moral de 'retidão'.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo preservado. A repetição de “e” reproduz a sequência enfática do grego; o pronome “nós” dá peso à confissão retrospectiva.
