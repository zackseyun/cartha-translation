translation:
  language: pt
  text: Como ele foi contado entre os filhos de Deus, e sua parte[a] está entre os santos?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua sorte”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: Como
  rationale: Introduz a pergunta de espanto diante da reversão inesperada; preserva o sentido interrogativo sem transformá-lo numa pergunta sobre a causa moral.
- source_word: κατελογίσθη
  choice: foi contado
  rationale: Mantém a voz passiva e expressa a ideia de ser incluído ou reconhecido como membro de um grupo.
- source_word: ἐν υἱοῖς θεοῦ
  choice: entre os filhos de Deus
  rationale: A preposição indica pertencimento ao grupo, e “filhos de Deus” preserva o masculino plural e a linguagem de condição elevada do grego.
- source_word: ἅγιοις
  choice: os santos
  rationale: O adjetivo substantivado designa pessoas santas. “Os santos” é uma formulação clara, corrente e compatível com o registro solene do texto.
- source_word: κλῆρος
  choice: parte
  rationale: κλῆρος pode indicar a parte ou posição atribuída a alguém. “Parte” comunica naturalmente esse sentido em português, enquanto a nota preserva a metáfora mais literal de “sorte”.
- source_word: αὐτοῦ ἐστιν
  choice: sua parte está
  rationale: Preserva o presente grego e a afirmação de que a posição que lhe cabe se encontra entre os santos.
theological_decisions:
- issue: Sentido de υἱοῖς θεοῦ
  choice: filhos de Deus
  alternative: descendentes de Deus / crianças de Deus
  rationale: O grego traz explicitamente o plural masculino υἱοῖς, empregado aqui como linguagem de identidade e condição. A tradução direta evita neutralizar ou reinterpretar essa expressão.
- issue: Identidade dos ἅγιοι
  choice: os santos
  alternative: os que são santos
  rationale: O texto não especifica uma classe posterior ou uma definição denominacional de “santos”; mantém-se a referência ampla às pessoas santas.
translation_notes:
  register: Português atual, claro e solene, com sintaxe próxima do grego sem rigidez artificial. A coordenação entre o passado (“foi contado”) e o presente (“está”) foi mantida, preservando a tensão temporal do original.
