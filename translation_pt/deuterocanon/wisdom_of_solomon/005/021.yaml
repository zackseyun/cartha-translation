  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/021.yaml
  text: Well-aimed bolts of lightning will go forth[a], and like from a well-drawn bow of clouds they will leap to the target[b],
translation:
  language: pt
  text: Projéteis certeiros de relâmpagos avançarão e, como de um arco bem-curvado das nuvens[a], se lançarão em direção ao alvo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de um arco bem-arredondado das nuvens”. A imagem pode evocar o arco-íris ou um arco de tempestade, mas o grego diz literalmente “arco das nuvens”.
    reason: lexical_alternative
  - marker: b
    text: Ou “saltarão até o alvo”. O verbo grego retrata um movimento rápido e impetuoso em direção ao alvo.
    reason: alternative_reading
lexical_decisions:
- source_word: πορεύσονται
  choice: avançarão
  rationale: O futuro de πορεύομαι indica movimento adiante; “avançarão” preserva a ação poética e marcial sem a rigidez de “procederão”.
- source_word: εὔστοχοι βολίδες ἀστραπῶν
  choice: projéteis certeiros de relâmpagos
  rationale: εὔστοχοι descreve aquilo que acerta o alvo, βολίδες são objetos arremessados ou disparados, e ἀστραπῶν mantém os relâmpagos como armamento da cena. “Projéteis” evita restringir a imagem a flechas.
- source_word: ὡς ἀπὸ εὐκύκλου τόξου τῶν νεφῶν
  choice: como que disparados do arco bem-curvado das nuvens
  rationale: ὡς ἀπό introduz a comparação com a origem do disparo; εὔκυκλος significa bem arredondado ou bem curvado. “Disparados” explicita naturalmente em português a relação dos projéteis com o arco, sem identificar o arco de modo inequívoco com o arco-íris.
- source_word: ἐπὶ σκοπόν
  choice: sobre o alvo
  rationale: σκοπός é o alvo ou ponto visado; com o verbo de movimento, “sobre o alvo” comunica a investida dirigida contra ele.
- source_word: ἁλοῦνται
  choice: se lançarão
  rationale: Futuro de ἅλλομαι, verbo vívido de saltar ou lançar-se. “Se lançarão” soa natural para projéteis e conserva a força do movimento sem transformá-lo explicitamente em voz passiva.
theological_decisions:
- issue: Possível evocação do arco-íris ou arco da tempestade em τὸ τόξον τῶν νεφῶν
  choice: arco bem-curvado das nuvens
  alternative: arco-íris; arco entre as nuvens
  rationale: O grego fala literalmente de um “arco das nuvens”. A formulação conserva a imagem celeste e sua possível evocação do arco-íris, mas não torna explícita uma identificação que o texto mantém implícita.
translation_notes:
  register: Português moderno, claro e solene, com ritmo poético. “Projéteis” preserva a amplitude de βολίδες; “certeiros” é mais idiomático que “bem-mirados” para algo que atinge precisamente o alvo. A comparação foi formulada com “como que disparados” para evitar a construção pouco natural “como de um arco”.
