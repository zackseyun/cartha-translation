  source_fidelity: A tradução preserva adequadamente o futuro, o sentido coletivo de ἐν ἑαυτοῖς, o arrependimento, a angústia interior e o reconhecimento da pessoa antes ridicularizada. Contudo, “tivemos por motivo de zombaria” pode sugerir que a pessoa era a causa da zombaria, em vez de seu alvo, e enfraquece a construção avaliativa/tratamento expressa por ἔσχομεν ... εἰς γέλωτα.
