base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/003.yaml
  text: 'They will say among themselves[a], repenting, and will groan because of anguish of spirit: “This is the one whom we once held in derision.”'
translation:
  language: pt
  text: 'Dirão entre si, arrependidos, e gemerão por causa da angústia de espírito: “Este é aquele que outrora tínhamos como alvo de zombaria[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que outrora considerávamos objeto de riso” ou “de quem outrora fazíamos zombaria”.'
    reason: Alternativas para εἰς γέλωτα e para a construção ἔχω + εἰς, que descreve alguém considerado ou tratado como objeto de ridículo.
lexical_decisions:
- source_word: ἐροῦσιν
  choice: Dirão
  rationale: O futuro de λέγω introduz diretamente a fala futura; “dirão” é claro e natural.
- source_word: ἐν ἑαυτοῖς
  choice: entre si
  rationale: A expressão pode indicar reflexão interior ou conversa no próprio grupo. “Entre si” preserva o caráter coletivo da fala sem excluir o remorso interior.
- source_word: μετανοοῦντες
  choice: arrependidos
  rationale: O particípio presente descreve o estado dos falantes e conserva a força moral de mudança de entendimento, sem afirmar qual será o resultado desse arrependimento.
- source_word: διὰ στενοχωρίαν πνεύματος
  choice: por causa da angústia de espírito
  rationale: στενοχωρία exprime aflição ou angústia, e πνεύματος aponta aqui para o íntimo da pessoa. A formulação mantém a imagem e a dignidade do original.
- source_word: στενάξονται
  choice: gemerão
  rationale: O verbo indica manifestação audível de sofrimento; “gemerão” comunica intensidade melhor que “suspirarão” sem acrescentar a ideia específica de lamentação formal.
- source_word: Οὗτος ἦν
  choice: Este é aquele
  rationale: A construção portuguesa apresenta com naturalidade a pessoa agora reconhecida, enquanto a oração seguinte situa no passado a atitude dos falantes.
- source_word: ὃν ἔσχομέν ποτε εἰς γέλωτα
  choice: que outrora tivemos por motivo de zombaria
  rationale: ἔχω com εἰς e acusativo expressa considerar ou tratar alguém como algo; γέλως, neste contexto, é riso depreciativo. A tradução conserva tanto a avaliação passada quanto o desprezo.
theological_decisions:
- issue: Força de μετανοοῦντες na fala dos ímpios
  choice: arrependidos
  alternative: tomados de remorso
  rationale: “Arrependidos” reflete a linguagem de reversão moral do grego, mas o versículo não declara que esse arrependimento seja salvífico. A tradução mantém essa tensão sem resolver a questão doutrinariamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Outrora” preserva a solenidade sem tornar a frase arcaica; “entre si” mantém a ambiguidade entre fala coletiva e reflexão interior.
