base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/011.yaml
  text: 'or like a bird flying through the air: no evidence of its path is found[a], though the light air, whipped by the stroke of its pinions and split by force with the whirring of moving wings, was traversed[b], and after that no sign of its passage was found in it.'
translation:
  language: pt
  text: 'ou como uma ave que voa pelo ar: não se encontra nenhum indício de seu percurso[a]; o ar leve[b], açoitado pelos golpes das asas e rasgado violentamente pelo zunido das asas em movimento, foi atravessado, e depois disso não se encontrou nele sinal algum de sua passagem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vestígio de seu trajeto”. O grego τεκμήριον πορείας enfatiza que não permanece nenhuma marca verificável da rota da ave.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega πνεῦμα κοῦφον também pode ser entendida como “brisa leve” ou “vento leve”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρνέου διιπτάντος ἀέρα
  choice: uma ave que voa pelo ar
  rationale: Expressa de modo natural a imagem genérica de uma ave em voo através do ar, sem especificar espécie nem transformar ἀέρα em “céu”.
- source_word: τεκμήριον πορείας
  choice: indício de seu percurso
  rationale: “Indício” preserva o sentido de evidência ou marca demonstrável de τεκμήριον, enquanto “percurso” comunica a rota realizada.
- source_word: πληγῇ μαστιζόμενον ταρσῶν
  choice: açoitado pelo bater das penas de voo
  rationale: Mantém a metáfora vigorosa de μαστιζόμενον e apresenta πληγῇ como o impacto repetido do voo; “penas de voo” comunica a referência mais específica de ταρσῶν sem recorrer a vocabulário anatômico obscuro.
- source_word: πνεῦμα κοῦφον
  choice: o ar leve
  rationale: No contexto, πνεῦμα é o meio aéreo atravessado pela ave; “ar leve” conserva κοῦφον e evita sugerir necessariamente uma corrente de vento.
- source_word: σχιζόμενον βίᾳ ῥοιζῷ κινουμένων πτερύγων
  choice: rasgado com violência pelo zunido das asas em movimento
  rationale: Preserva a abertura violenta do ar, o componente sonoro de ῥοιζῷ e a relação com as asas em movimento.
- source_word: διωδεύθη
  choice: tenha sido atravessado
  rationale: Conserva a construção passiva grega, na qual o ar é o meio pelo qual se abriu passagem.
- source_word: σημεῖον ἐπιβάσεως
  choice: sinal algum de sua passagem
  rationale: Distingue σημεῖον do anterior τεκμήριον e verte ἐπίβασις pelo sentido contextual de trânsito ou passagem.
