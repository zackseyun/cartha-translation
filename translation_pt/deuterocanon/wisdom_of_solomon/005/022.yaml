  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/022.yaml
  text: And hailstones full of stony wrath will be hurled, and the water of the sea will rage against them; and rivers will suddenly overwhelm them.
translation:
  language: pt
  text: E granizos, cheios de ira que lança pedras, serão arremessados; a água do mar se enfurecerá contra eles, e os rios os submergirão repentinamente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πετροβόλου
  choice: como por uma catapulta
  rationale: O termo designa algo que lança pedras, provavelmente uma máquina de arremesso. A formulação explicita a imagem sem confundi-la com a ira, e a nota preserva a expressão grega mais literal.
- source_word: θυμοῦ πλήρεις
  choice: cheios de ira
  rationale: Reproduz diretamente a imagem personificadora do grego, em que os granizos estão repletos de ira.
- source_word: ἀγανακτήσει
  choice: se enfurecerá
  rationale: Transmite a reação intensa e personificada da água do mar contra os adversários.
- source_word: συγκλύσουσιν
  choice: submergirão
  rationale: Expressa o ato de cobrir ou arrastar completamente com uma inundação.
- source_word: ἀποτόμως
  choice: repentinamente
  rationale: Mantém o valor adverbial de brusquidão adotado pelo texto de consulta, embora o termo também possa sugerir violência ou inexorabilidade.
theological_decisions:
- issue: Personificação dos elementos da criação como agentes de juízo
  choice: Manter a ira dos granizos e o furor do mar
  alternative: Neutralizar como mera força destrutiva da natureza
  rationale: O grego atribui deliberadamente reações intensas aos elementos; preservar essa personificação mantém a força poética e teológica sem definir além do texto como se dá sua agência.
translation_notes:
  register: Português moderno, digno e de leitura ampla. Mantém o paralelismo poético e a personificação vigorosa dos elementos naturais, com pontuação clara e vocabulário corrente.
