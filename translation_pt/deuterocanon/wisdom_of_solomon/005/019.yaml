lexical_decisions:
- source_word: λήμψεται
  choice: tomará
  rationale: O futuro médio de λαμβάνω, no contexto de alguém que se arma, é expresso naturalmente por “tomará”; “empunhará” explicitaria mais do que o grego.
- source_word: ἀσπίδα
  choice: escudo
  rationale: Equivalente corrente e claro para o termo grego, sem o arcaísmo de alternativas mais específicas.
- source_word: ἀκαταμάχητον
  choice: invencível
  rationale: Comunica que o escudo não pode ser vencido ou superado e preserva de modo natural a imagem de combate.
- source_word: ὁσιότητα
  choice: santidade
  rationale: Conserva a amplitude moral e religiosa da virtude relacionada ao que é devoto e correto diante de Deus; “piedade” também é possível, mas pode soar mais estreita.
theological_decisions:
- issue: Se ὁσιότητα deve ser traduzido como qualidade moral ampla ou como termo mais especificamente devocional.
  choice: santidade
  alternative: piedade
  rationale: “Santidade” preserva a força moral e religiosa da virtude na metáfora da armadura divina sem a reduzir à religiosidade exterior; a alternativa legítima é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno. A ordem foi ajustada à sintaxe natural do português, mantendo a metáfora marcial e a personificação da virtude.
