lexical_decisions:
- source_word: ὑπερηφανία
  choice: arrogância
  rationale: Expressa com naturalidade a soberba e a altivez condenadas no contexto.
- source_word: πλοῦτος
  choice: riqueza
  rationale: Equivalente direto e corrente para o substantivo grego.
- source_word: μετὰ ἀλαζονίας
  choice: acompanhada de ostentação
  rationale: Preserva a ideia de riqueza associada à jactância ou exibição pretensiosa, sem reduzir ἀλαζονία a mero orgulho interior.
- source_word: συμβέβληται ἡμῖν
  choice: nos trouxe ... benefício
  rationale: No contexto da pergunta retórica, comunica de modo idiomático o que a riqueza aliada à ostentação acrescentou ou proporcionou aos falantes.
theological_decisions:
- issue: Relação entre riqueza e ostentação
  choice: riqueza acompanhada de ostentação
  alternative: riqueza obtida com ostentação
  rationale: A preposição μετά indica associação; a tradução evita afirmar que a ostentação foi o meio de adquirir a riqueza.
