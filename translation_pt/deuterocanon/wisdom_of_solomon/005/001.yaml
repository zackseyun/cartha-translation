base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/001.yaml
  text: Then the righteous man will stand with great boldness before those who afflicted him and those who disregarded his labors[a][b][c].
translation:
  language: pt
  text: Então o justo se levantará com grande ousadia diante daqueles que o afligiram e dos que desprezaram seus sofrimentos[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com grande confiança”. O termo grego também pode indicar franqueza e segurança manifestadas abertamente.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “diante da face de”, expressão que indica estar diretamente na presença de alguém.
    reason: lexical_alternative
  - marker: c
    text: Ou “seus trabalhos penosos” ou “suas dores”. A palavra grega pode se referir a esforço, fadiga, dificuldade ou sofrimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Então
  rationale: Marca naturalmente a sequência temporal da cena.
- source_word: στήσεται
  choice: se levantará
  rationale: Preserva a imagem de assumir posição e comparecer de pé, com a nuance contextual de vindicação, sem torná-la explícita demais.
- source_word: ἐν παρρησίᾳ πολλῇ
  choice: com grande ousadia
  rationale: παρρησία abrange franqueza pública, confiança e destemor; “ousadia” comunica bem a postura aberta e firme nesta cena.
- source_word: ὁ δίκαιος
  choice: o justo
  rationale: Mantém o substantivo adjetival masculino singular do grego e é expressão natural e digna em português.
- source_word: κατὰ πρόσωπον
  choice: diante
  rationale: Expressa presença direta e confronto face a face de modo natural, sem reproduzir servilmente o idiomatismo “diante da face”.
- source_word: τῶν θλιψάντων αὐτὸν
  choice: daqueles que o afligiram
  rationale: θλίβω indica pressionar, afligir ou oprimir; “afligiram” preserva a amplitude sem restringir a opressão a uma esfera específica.
- source_word: τῶν ἀθετούντων
  choice: dos que desprezaram
  rationale: No contexto, ἀθετέω descreve tratar os sofrimentos do justo como sem valor; “desprezaram” transmite essa rejeição prática.
- source_word: τοὺς πόνους αὐτοῦ
  choice: seus sofrimentos
  rationale: πόνος pode designar trabalho penoso, fadiga, dor ou sofrimento; aqui “sofrimentos” se ajusta à aflição imposta e mantém a amplitude contextual.
theological_decisions:
- issue: Forma singular masculina de ὁ δίκαιος
  choice: o justo
  alternative: a pessoa justa
  rationale: A tradução preserva o singular masculino gramatical e a figura representativa apresentada pelo texto, sem neutralizá-la.
- issue: Nuance de παρρησία na cena de julgamento e vindicação
  choice: com grande ousadia
  alternative: com grande confiança
  rationale: “Ousadia” preserva melhor a dimensão pública, franca e destemida do termo, enquanto “confiança” poderia soar apenas interior.
- issue: Sentido de πόνος
  choice: sofrimentos
  alternative: trabalhos penosos
  rationale: O contexto permite tanto esforço penoso quanto dor. A escolha realça as provações do justo sem excluir a noção de fadiga, registrada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe mantém a solenidade da cena sem calques desnecessários; as notas preservam as principais ambiguidades lexicais do grego.
