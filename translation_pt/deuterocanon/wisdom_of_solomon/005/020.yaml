base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/020.yaml
  text: He will sharpen severe wrath into a sword[a], and the world will join battle with him against the senseless.
translation:
  language: pt
  text: Ele afiará a ira severa, tornando-a uma espada, e o mundo combaterá ao lado dele[a] contra os insensatos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “com ele”. Pelo contexto, o referente mais provável é Deus, mas ele não é nomeado neste versículo.
    reason: ambiguity
  - marker: b
    text: Ou “os desatinados”. O termo grego descreve os que agem de modo irracional ou moralmente transtornado em sua oposição a Deus, sem indicar necessariamente doença mental em sentido clínico.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀξυνεῖ
  choice: afiará
  rationale: O futuro de ὀξύνω significa literalmente afiar ou aguçar; “afiará” preserva de modo claro a imagem bélica.
- source_word: ἀπότομον ὀργὴν
  choice: a ira implacável
  rationale: ἀπότομος comunica severidade dura e inexorável neste contexto. “Ira implacável” soa natural em português, mantém o registro judicial elevado e evita a expressão pouco idiomática “ira severa”.
- source_word: εἰς ῥομφαίαν
  choice: até torná-la uma espada
  rationale: εἰς exprime aqui resultado ou transformação. A formulação explicita naturalmente em português a imagem da ira afiada até se tornar espada.
- source_word: συνεκπολεμήσει
  choice: combaterá ao lado dele
  rationale: O verbo composto indica participar da guerra juntamente com alguém; a tradução conserva tanto a ação militar quanto a ideia de cooperação.
- source_word: ὁ κόσμος
  choice: o mundo
  rationale: κόσμος designa o mundo ordenado, possivelmente toda a criação. “O mundo” é direto e permite que o contexto preserve essa dimensão cósmica.
- source_word: ἐπὶ τοὺς παράφρονας
  choice: contra os insensatos
  rationale: παράφρων caracteriza pessoas irracionais ou moralmente desatinadas. “Insensatos” preserva a censura moral sem sugerir necessariamente uma condição clínica.
theological_decisions:
- issue: Referente de αὐτῷ (“ao lado dele”)
  choice: Manter o pronome sem identificar expressamente seu referente
  alternative: Explicitar “ao lado de Deus” ou entender uma relação indireta com o justo
  rationale: O contexto do juízo divino favorece Deus como referente, mas o grego deste versículo traz apenas o pronome. Mantê-lo preserva a tensão e evita especificação além do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com imagem marcial preservada. “Ira implacável” comunica a dureza de ἀπότομον de maneira idiomática; “até torná-la uma espada” mantém a transformação metafórica expressa por εἰς.
