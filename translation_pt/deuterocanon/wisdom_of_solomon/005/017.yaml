  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/017.yaml
  text: He will take his zeal as full armor[a], and he will arm creation for defense against enemies[b];
translation:
  language: pt
  text: Ele tomará o seu zelo como armadura completa[a] e armará a criação para a defesa contra inimigos[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o seu ciúme» em vez de «o seu zelo». O grego ζῆλος pode ter os dois sentidos, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «fará da criação uma arma» ou «equipará a criação como arma»; «armará a criação» expressa o sentido em português natural.
    reason: lexical_alternative
lexical_decisions:
- source_word: λήμψεται
  choice: tomará
  rationale: O futuro médio de λαμβάνω tem aqui o sentido de tomar para si; «tomará» combina naturalmente com a imagem militar.
- source_word: πανοπλίαν
  choice: armadura completa
  rationale: Designa o equipamento integral de um guerreiro. «Armadura completa» preserva a ideia de totalidade em português claro.
- source_word: τὸν ζῆλον αὐτοῦ
  choice: o seu zelo
  rationale: ζῆλος pode significar zelo ou ciúme. Neste contexto de ação divina guerreira, «zelo» mantém a intensidade sem restringir indevidamente o sentido.
- source_word: ὁπλοποιήσει
  choice: armará
  rationale: O verbo exprime fazer ou equipar com armas. «Armará» comunica de modo natural que a criação será convertida em instrumento de combate.
- source_word: τὴν κτίσιν
  choice: a criação
  rationale: κτίσις refere-se aqui ao mundo criado em sua amplitude; «a criação» preserva o alcance cósmico.
- source_word: εἰς ἄμυναν ἐχθρῶν
  choice: para a defesa contra inimigos
  rationale: ἄμυνα indica defesa ou ação de repelir. A formulação conserva o valor defensivo e não acrescenta um possessivo ausente no grego.
theological_decisions:
- issue: Referente do sujeito implícito
  choice: O pronome implícito refere-se a Deus, em continuidade com a figura do guerreiro divino no contexto.
  alternative: Uma personificação mais abstrata da justiça divina.
  rationale: O contexto imediato apresenta o Senhor agindo como guerreiro; a forma verbal no singular é preservada sem explicitação adicional no versículo.
- issue: Sentido de ζῆλος na metáfora guerreira
  choice: O zelo de Deus funciona metaforicamente como armadura.
  alternative: O ciúme de Deus funciona como armadura.
  rationale: «Zelo» preserva a metáfora e a amplitude lexical, enquanto a nota registra a alternativa genuína «ciúme».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das imagens e a ambiguidade de ζῆλος foram preservadas; o ponto e vírgula acompanha a continuidade do texto-fonte.
