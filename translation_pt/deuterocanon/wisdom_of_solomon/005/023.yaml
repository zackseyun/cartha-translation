base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/023.yaml
  text: A spirit of power will stand against them[a], and like a whirlwind it will winnow them away;
translation:
  language: pt
  text: Um espírito de poder se levantará contra eles[a] e, como um vendaval, os dispersará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um vento poderoso» ou «um sopro poderoso se levantará contra eles». A palavra grega πνεῦμα pode significar «espírito», «vento» ou «sopro».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιστήσεται
  choice: se levantará contra
  rationale: Expressa oposição ativa e conserva a imagem concreta de tomar posição contra alguém, em português natural.
- source_word: πνεῦμα
  choice: espírito
  rationale: O termo pode significar espírito, vento ou sopro. Aqui, sua função como sujeito de uma ação de oposição favorece «espírito», sem eliminar a ambiguidade, registrada em nota.
- source_word: δυνάμεως
  choice: de poder
  rationale: Mantém a construção genitiva e não restringe indevidamente a ideia a força física ou militar.
- source_word: λαῖλαψ
  choice: vendaval
  rationale: Designa uma tempestade de vento violenta; «vendaval» é claro, vívido e corrente em português amplo.
- source_word: ἐκλικμήσει
  choice: os dispersará como palha
  rationale: O verbo evoca o joeiramento, no qual o vento separa e leva a palha. A formulação explicita de modo natural a imagem agrícola implícita no grego.
- source_word: αὐτούς
  choice: eles / os
  rationale: Os pronomes retomam os adversários ímpios mencionados no contexto.
theological_decisions:
- issue: Se πνεῦμα deve ser entendido como agente personificado («espírito») ou fenômeno meteorológico («vento»/«sopro»).
  choice: espírito
  alternative: vento poderoso; sopro poderoso
  rationale: A ação de levantar-se contra alguém favorece uma leitura agentiva, enquanto a comparação seguinte com um vendaval mantém distinta a imagem da tempestade. A nota preserva a ambiguidade lexical genuína.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. «Vendaval» evita um termo excessivamente técnico, e «dispersará como palha» comunica a metáfora de joeirar sem perder sua força poética.
