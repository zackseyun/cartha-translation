  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/012.yaml
  text: 'or like an arrow shot at a target: the air[a], once cut through, immediately closed up on itself, so that its path could not be known.'
translation:
  language: pt
  text: 'ou como uma flecha disparada em direção ao alvo: o ar, cortado por ela, imediatamente voltou a se fechar, de modo que não se pôde saber por onde ela passou.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se pôde saber o seu trajeto” ou “a sua passagem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βέλους βληθέντος
  choice: uma flecha disparada
  rationale: βέλος designa aqui o projétil da imagem de arquearia, e o particípio de βάλλω é expresso naturalmente em português por “disparada”.
- source_word: ἐπὶ σκοπόν
  choice: contra o alvo
  rationale: σκοπός é o ponto visado; “alvo” preserva o sentido concreto da comparação.
- source_word: τμηθεὶς ὁ ἀήρ
  choice: o ar, cortado por ela
  rationale: A formulação conserva a imagem vívida do ar sendo dividido pela passagem da flecha e explicita o agente implícito sem alterar o sentido.
- source_word: εὐθέως εἰς ἑαυτὸν ἀνελύθη
  choice: imediatamente voltou a se fechar
  rationale: A expressão grega descreve o ar retornando à sua condição anterior após ser cortado; esta tradução comunica a recomposição de modo natural.
- source_word: ὡς ἀγνοῆσαι τὴν δίοδον αὐτοῦ
  choice: de modo que já não se pôde reconhecer por onde ela passou
  rationale: ὡς com infinitivo indica resultado, e δίοδος se refere à passagem ou ao trajeto da flecha através do ar. O feminino “ela” retoma naturalmente “flecha” em português.
