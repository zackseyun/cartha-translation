base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/007.yaml
  text: We were filled with paths of lawlessness and destruction[a], and we traveled through trackless deserts[b], but the way of the Lord we did not know.
translation:
  language: pt
  text: Ficamos repletos de veredas de transgressão e destruição[a] e atravessamos desertos sem caminhos[b], mas não conhecemos o caminho do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “veredas transgressoras e destrutivas”. O grego também permite entender os substantivos abstratos como qualificando “veredas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “regiões ermas inacessíveis” ou “desertos intransitáveis”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνομίας
  choice: transgressão
  rationale: O substantivo indica desrespeito à lei ou ordem moral. “Transgressão” conserva a força ética e funciona naturalmente como termo descritivo das veredas.
- source_word: ἐνεπλήσθημεν
  choice: ficamos repletos
  rationale: Preserva o sentido passivo de ser preenchido ou saturado, evitando a construção pouco idiomática “fomos enchidos”.
- source_word: τρίβοις
  choice: veredas
  rationale: Designa trilhas ou caminhos percorridos. “Veredas” mantém o tom bíblico digno e permite contraste claro com “o caminho do Senhor”.
- source_word: ἀπωλείας
  choice: destruição
  rationale: Expressa ruína ou perdição. “Destruição” é clara, grave e não restringe o termo a uma formulação doutrinária específica.
- source_word: διωδεύσαμεν
  choice: atravessamos
  rationale: O verbo significa percorrer ou passar através de um lugar; “atravessamos” comunica de modo conciso o movimento pelo terreno.
- source_word: ἐρήμους ἀβάτους
  choice: desertos intransitáveis
  rationale: ἐρήμους indica regiões desertas ou ermas, e ἀβάτους aquilo que não pode ser atravessado ou cujo acesso é difícil. A formulação mantém ambos os elementos sem transformar necessariamente a imagem em ausência literal de trilhas.
- source_word: ὁδὸν Κυρίου
  choice: o caminho do Senhor
  rationale: Preserva o conhecido idioma bíblico e a possível sobreposição entre caminho figurado, conduta moral e curso estabelecido pelo Senhor.
- source_word: οὐκ ἔγνωμεν
  choice: não conhecemos
  rationale: Tradução direta que mantém o tom de confissão e não decide se a falta foi de conhecimento, reconhecimento ou experiência.
theological_decisions:
- issue: Sentido de “o caminho do Senhor”
  choice: Mantida a expressão aberta “o caminho do Senhor”, que no contexto sugere sobretudo a conduta ou orientação de vida conforme o Senhor.
  alternative: Uma rota literal ou um curso específico determinado pelo Senhor.
  rationale: O paralelismo com as veredas de transgressão favorece a leitura moral e espiritual, mas a tradução não explicita essa interpretação e preserva a imagem de caminho.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Veredas” mantém a imagem poética sem arcaísmo excessivo; “ficamos repletos” preserva a metáfora incomum do grego de maneira mais natural do que um passivo verbal literal.
