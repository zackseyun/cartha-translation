base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/004.yaml
  text: and as a proverb of reproach among fools[a]. We considered his life madness, and his end dishonorable[b];
translation:
  language: pt
  text: e nós, os insensatos, fazíamos dele um provérbio de censura[a]. Considerávamos a vida dele uma loucura e seu fim, desonroso[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um alvo de escárnio” ou “um dito de reprovação”. O termo grego pode indicar um dito proverbial ou alguém feito publicamente objeto de desprezo, e não apenas uma “parábola” em sentido estrito.
    reason: lexical_alternative
  - marker: b
    text: Ou “sua morte, desonrosa”. A palavra grega traduzida como “fim” pode referir-se especificamente à morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραβολὴν ὀνειδισμοῦ
  choice: motivo de zombaria
  rationale: A expressão indica alguém transformado em objeto proverbial de censura ou escárnio. “Motivo de zombaria” comunica isso com naturalidade em português atual, enquanto a nota preserva as alternativas mais formais.
- source_word: οἱ ἄφρονες
  choice: entre os insensatos
  rationale: Identifica os próprios falantes como insensatos e mantém a perspectiva confessional sugerida pelo contexto e pela primeira pessoa do plural.
- source_word: ἐλογισάμεθα
  choice: considerávamos
  rationale: Expressa uma avaliação deliberada anterior. O imperfeito português se ajusta à recordação retrospectiva do juízo que mantinham.
- source_word: βίον
  choice: vida
  rationale: É a forma mais direta e natural, podendo abranger tanto a existência quanto o modo de viver do justo.
- source_word: μανίαν
  choice: loucura
  rationale: Preserva a força depreciativa do termo grego sem recorrer a vocabulário clínico moderno.
- source_word: τελευτήν
  choice: fim
  rationale: Mantém a amplitude do grego, que pode designar o término da vida e, no contexto, a morte.
- source_word: ἄτιμον
  choice: desonroso
  rationale: Comunica a ideia de falta de honra atribuída ao fim do justo, sem intensificá-la para “vergonhoso”.
theological_decisions:
- issue: Perspectiva dos falantes na confissão
  choice: Os insensatos falam em primeira pessoa e reconhecem seu antigo juízo sobre o justo.
  alternative: Entender “os insensatos” como comentário independente do narrador.
  rationale: A primeira pessoa plural de ἐλογισάμεθα e o contexto de Sabedoria 5 favorecem uma confissão retrospectiva dos ímpios; a tradução não muda para uma voz narrativa neutra.
- issue: Sentido de τελευτήν
  choice: fim
  alternative: morte
  rationale: “Fim” preserva a ambiguidade lexical do grego, embora nesse contexto possa referir-se especificamente à morte do justo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação acompanha a continuação sintática do versículo anterior; preserva a voz retrospectiva dos insensatos e evita linguagem clínica para μανία.
