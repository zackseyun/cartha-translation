  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/002.yaml
  text: When they see him[a], they will be shaken with dreadful fear, and they will be astonished at the unexpectedness of his salvation.
translation:
  language: pt
  text: Quando o virem[a], ficarão abalados por um medo terrível e se espantarão com o caráter inesperado da salvação dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: “Ao verem, ficarão abalados por um medo terrível e se espantarão com o inesperado da salvação”. “O” e “dele” foram acrescentados conforme o contexto, que fala do justo no versículo anterior.'
    reason: Explicar os referentes contextuais que não estão expressos no grego.
lexical_decisions:
- source_word: ἰδόντες
  choice: Quando o virem
  rationale: O particípio aoristo tem valor temporal. O objeto, não expresso no versículo grego, é naturalmente recuperado do justo mencionado no contexto anterior.
- source_word: ταραχθήσονται
  choice: ficarão abalados
  rationale: O futuro passivo de ταράσσω indica forte perturbação interior; esta formulação preserva sua intensidade em português corrente.
- source_word: φόβῳ δεινῷ
  choice: por um medo terrível
  rationale: O dativo pode indicar causa ou meio da perturbação. “Medo terrível” comunica claramente a força de δεινός.
- source_word: ἐκστήσονται
  choice: se espantarão
  rationale: O futuro de ἐξίστημι expressa assombro intenso no contexto, sem exigir a formulação mais extrema “ficarão fora de si”.
- source_word: ἐπὶ τῷ παραδόξῳ
  choice: com o caráter inesperado
  rationale: O adjetivo substantivado designa aquilo que é contrário à expectativa ou surpreendente. A expressão portuguesa preserva esse aspecto sem transformá-lo simplesmente em “maravilha”.
- source_word: τῆς σωτηρίας
  choice: da salvação dele
  rationale: σωτηρία admite “salvação” ou “livramento”. “Salvação” mantém o registro teológico do livro, e “dele” explicita a relação contextual com o justo.
theological_decisions:
- issue: Explicitação do referente implícito do particípio e da salvação
  choice: “o virem” e “da salvação dele”, referindo-se ao justo do versículo anterior
  alternative: “Quando virem... com o caráter inesperado da salvação”
  rationale: O grego deixa tanto o objeto de “ver” quanto o possuidor da salvação implícitos. O contexto imediato os associa ao justo; explicitá-los torna o português natural, enquanto a nota registra a forma literal e preserva a transparência textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução procura equilibrar naturalidade e proximidade formal, preservando a ideia de uma salvação inesperada sem eliminar a elipse do original de modo silencioso.
