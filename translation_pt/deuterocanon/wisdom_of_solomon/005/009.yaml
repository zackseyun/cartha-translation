  text: All those things passed away like a shadow[a], and like a report running past;
translation:
  language: pt
  text: Tudo aquilo passou como uma sombra e como uma notícia[a] que passa correndo;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensagem” ou “anúncio”. O termo grego pode ter esses sentidos, e a expressão seguinte destaca que isso passa rapidamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρῆλθεν
  choice: passou
  rationale: O aoristo de παρέρχομαι apresenta tudo aquilo como algo que passou e ficou para trás; “passou” preserva a imagem de transitoriedade sem acrescentar uma interpretação específica.
- source_word: ἐκεῖνα πάντα
  choice: tudo aquilo
  rationale: A expressão retoma, com certo distanciamento, as realidades mencionadas antes e as reúne em sua totalidade; “tudo aquilo” é natural em português e mantém ambas as ideias.
- source_word: ὡς σκιὰ
  choice: como uma sombra
  rationale: Mantém diretamente a comparação grega, que sugere brevidade e falta de substância.
- source_word: ἀγγελία
  choice: notícia
  rationale: ἀγγελία pode designar notícia, mensagem, informe ou anúncio. “Notícia” é corrente, concisa e se ajusta à imagem de algo que chega e logo passa, sem eliminar a amplitude lexical do termo.
- source_word: παρατρέχουσα
  choice: que passa correndo
  rationale: Conserva a imagem vívida do particípio presente de παρατρέχω, literalmente algo que corre ao passar, e também sua ênfase na rapidez.
