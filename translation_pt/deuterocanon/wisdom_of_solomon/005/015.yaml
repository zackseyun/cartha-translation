base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/015.yaml
  text: But the righteous live forever[a], and their reward is with the Lord[b], and their care is with the Most High.
translation:
  language: pt
  text: Mas os justos vivem para sempre, e sua recompensa está com o Senhor[a], e o cuidado deles está junto do Altíssimo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no Senhor”. A preposição grega também pode ser traduzida mais literalmente dessa maneira.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o bem-estar deles está junto do Altíssimo” ou “o Altíssimo cuida deles”. A expressão grega é compacta e permite esses sentidos estreitamente relacionados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοι
  choice: os justos
  rationale: O adjetivo substantivado designa pessoas caracterizadas pela justiça; “os justos” é corrente, digno e preserva o sentido moral e teológico.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: A expressão idiomática indica duração permanente; “para sempre” é a forma natural e direta em português.
- source_word: ζῶσιν
  choice: vivem
  rationale: Reproduz diretamente o presente grego e a ideia de vida contínua.
- source_word: ἐν Κυρίῳ
  choice: com o Senhor
  rationale: Embora ἐν possa ser traduzido literalmente por “no”, aqui “com o Senhor” comunica de modo natural que a recompensa se encontra em sua presença ou guarda, em paralelo com παρὰ Ὑψίστῳ.
- source_word: ὁ μισθὸς αὐτῶν
  choice: sua recompensa
  rationale: μισθός pode significar salário ou recompensa; neste contexto sapiencial, “recompensa” expressa melhor a retribuição destinada aos justos.
- source_word: ἡ φροντὶς αὐτῶν
  choice: o cuidado deles
  rationale: A formulação compacta conserva a amplitude de φροντίς, que pode apontar para o cuidado dedicado a eles ou para o bem-estar deles, sem explicitar indevidamente uma só leitura.
- source_word: παρὰ Ὑψίστῳ
  choice: junto do Altíssimo
  rationale: παρά com dativo indica proximidade ou presença; “junto do Altíssimo” preserva essa nuance e a estrutura paralela do versículo.
theological_decisions:
- issue: Sentido de ἡ φροντὶς αὐτῶν
  choice: o cuidado deles está junto do Altíssimo
  alternative: o Altíssimo cuida deles; o bem-estar deles está junto do Altíssimo
  rationale: A expressão grega é semanticamente compacta e admite tanto a ideia do cuidado divino por eles quanto a de seu bem-estar estar sob a guarda divina. O texto principal mantém essa tensão, e a nota registra as explicitações possíveis.
- issue: Tradução de ἐν Κυρίῳ
  choice: com o Senhor
  alternative: no Senhor
  rationale: A forma principal comunica presença ou guarda de maneira natural em português, sem excluir a tradução mais formal da preposição, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A coordenação simples acompanha o ritmo do grego; “o cuidado deles” conserva deliberadamente a concisão e a ambiguidade do original.
