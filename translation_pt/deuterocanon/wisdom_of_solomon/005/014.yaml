  - severity: low
    issue: A nota de rodapé formula a alternativa de maneira imprecisa.
    rationale: A alternativa lexical principal é para μνεία («lembrança» ou «menção»), enquanto καταλύτου designa o hóspede/alguém alojado temporariamente. A nota revisada separa claramente esses elementos.
