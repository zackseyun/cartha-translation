  to: Pois a esperança do ímpio é como a penugem levada pelo vento, como a fina geada varrida pela tempestade e como a fumaça dispersa pelo vento; passa como a lembrança de um hóspede que ficou apenas um dia.[a]
  rationale: A revisão substitui uma formulação meteorológica menos natural por «varrida pela tempestade» e torna a nota lexicalmente mais exata, sem alterar o sentido, a ambiguidade controlada ou o registro do versículo.
