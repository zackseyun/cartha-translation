base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/014.yaml
  text: For the hope of the ungodly is like down carried by the wind[a], and like thin frost driven away by a storm, and like smoke dispersed by the wind, and passes by like the remembrance of a one-day guest.
translation:
  language: pt
  text: Pois a esperança do ímpio é como a penugem levada pelo vento, como a fina geada varrida pela tempestade e como a fumaça dispersa pelo vento; passa como a lembrança de um hóspede que ficou apenas um dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “passa como a menção de um hóspede que ficou apenas um dia”. O grego μνεία pode significar “lembrança” ou “menção”; καταλύτης refere-se a alguém que se aloja temporariamente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπὶς
  choice: esperança
  rationale: Equivalente natural que preserva a expectativa positiva apresentada aqui como fugaz.
- source_word: ἀσεβοῦς
  choice: do ímpio
  rationale: Expressa a falta de reverência a Deus e é corrente no registro bíblico português, sem reduzir o termo à maldade genérica.
- source_word: χνοῦς
  choice: penugem
  rationale: Designa matéria muito leve, como penugem ou felpa, facilmente levada pelo vento; evita confundi-la com o termo grego habitual para palha.
- source_word: πάχνη ... λεπτὴ
  choice: fina geada
  rationale: Reproduz o fenômeno de geada e incorpora o adjetivo que ressalta sua delicadeza e transitoriedade.
- source_word: λαίλαπος
  choice: tempestade
  rationale: Comunica a força violenta do fenômeno atmosférico em português moderno e digno.
- source_word: διωχθεῖσα
  choice: impelida
  rationale: Preserva a ideia passiva de ser forçada ou enxotada pela tempestade sem personificar excessivamente a geada.
- source_word: καπνὸς ... διεχύθη
  choice: fumaça dispersa
  rationale: No contexto do vento, o verbo indica que a fumaça se espalha e desaparece.
- source_word: μνεία
  choice: lembrança
  rationale: Mantém o sentido provável de memória, deixando para a nota a possibilidade lexical de 'menção'.
- source_word: καταλύτου μονοημέρου
  choice: um hóspede que ficou apenas um dia
  rationale: Explicita com naturalidade a hospedagem temporária e conserva a duração literal de um só dia.
theological_decisions:
- issue: Sentido de ἀσεβοῦς
  choice: ímpio
  alternative: irreverente; perverso
  rationale: “Ímpio” preserva a orientação religiosa do termo, referente a quem não reverencia a Deus, sem acrescentar uma doutrina específica.
- issue: Sujeito da oração final παρῴδευσεν
  choice: sujeito elíptico retomando “a esperança do ímpio”
  alternative: fazer de “a lembrança” o sujeito explícito
  rationale: A sequência grega permite certa tensão sintática. Em português, “passa como a lembrança” retoma naturalmente a esperança sem inserir um pronome explicativo inexistente no texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A cadência paralela das três imagens foi preservada; o ponto e vírgula antes da oração final torna clara a retomada do sujeito sem eliminar a concisão do grego.
