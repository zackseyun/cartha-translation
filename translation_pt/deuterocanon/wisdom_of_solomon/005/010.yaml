  text: like a ship passing through surging water[a], after it has gone by no trace can be found, nor the track of its keel in the waves[b];
translation:
  language: pt
  text: 'como um navio que atravessa águas revoltas[a]: depois de passar, não se encontra vestígio algum, nem o rastro de sua quilha entre as ondas[b];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «águas agitadas pelas ondas». O grego enfatiza a água revolvida em ondas.
    reason: lexical_alternative
  - marker: b
    text: O termo grego traduzido por «quilha» é uma palavra náutica; traduções mais livres podem entender a expressão de modo geral como o curso ou caminho do navio.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναῦς
  choice: navio
  rationale: Termo geral para embarcação; «navio» é natural em português e combina com a imagem marítima e com a menção da quilha.
- source_word: διερχομένη
  choice: que atravessa
  rationale: Expressa o movimento da embarcação através da água com formulação corrente e clara.
- source_word: κυμαινόμενον ὕδωρ
  choice: águas revoltas
  rationale: O particípio ligado a κύμα descreve água agitada em ondas. «Águas revoltas» preserva essa força de modo natural e digno.
- source_word: ἧς διαβάσης
  choice: depois que passa
  rationale: A construção absoluta indica ação concluída antes da constatação de que nenhum vestígio permanece.
- source_word: ἴχνος
  choice: vestígio
  rationale: Indica uma marca ou evidência deixada para trás; «vestígio» transmite bem a ideia de algo que já não pode ser encontrado.
- source_word: ἀτραπός
  choice: rastro
  rationale: Embora denote caminho ou trilha, no contexto náutico «rastro» comunica de modo vívido a marca passageira aberta na água.
- source_word: τρόπιος αὐτῆς
  choice: de sua quilha
  rationale: O termo náutico refere-se à quilha da embarcação, preservando a concretude da imagem grega.
- source_word: ἐν κύμασιν
  choice: entre as ondas
  rationale: Localiza o rastro desaparecido no meio das ondas; «entre» soa natural em português sem alterar a imagem.
