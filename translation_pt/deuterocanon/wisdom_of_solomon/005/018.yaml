  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/018.yaml
  text: He will put on righteousness as a breastplate, and will place sincere judgment as a helmet;
translation:
  language: pt
  text: Ele vestirá a justiça como couraça[a] e porá como capacete um julgamento sem hipocrisia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a retidão como couraça”. O termo grego pode significar tanto “justiça” como “retidão”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, um julgamento genuíno e imparcial. Literalmente, “julgamento sem hipocrisia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσεται
  choice: vestirá
  rationale: O futuro médio de ἐνδύω descreve o ato deliberado de vestir uma peça de armadura; “vestirá” é natural e conciso em português.
- source_word: θώρακα
  choice: couraça
  rationale: Termo corrente para a armadura que protege o torso e equivalente tradicional e claro na imagem militar bíblica.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: δικαιοσύνη pode indicar tanto justiça quanto retidão. “Justiça” é natural neste contexto de ação judicial divina, enquanto a nota preserva a alternativa moral “retidão”.
- source_word: περιθήσεται
  choice: porá
  rationale: O futuro médio de περιτίθημι significa colocar em torno de si ou sobre si; com “capacete”, “porá” mantém a ação sem acrescentar elementos ausentes do grego.
- source_word: κόρυθα
  choice: capacete
  rationale: Equivalente direto e atual para a peça militar que protege a cabeça.
- source_word: κρίσιν
  choice: julgamento
  rationale: Preserva o sentido forense e ativo de κρίσις no retrato da intervenção divina.
- source_word: ἀνυπόκριτον
  choice: sem hipocrisia
  rationale: Tradução transparente e próxima do sentido literal, “não hipócrita” ou “não fingido”, sem reduzir antecipadamente a expressão apenas à imparcialidade.
theological_decisions:
- issue: Sentido de δικαιοσύνη na metáfora da armadura divina
  choice: justiça
  alternative: retidão
  rationale: O contexto apresenta a ação judicial de Deus, favorecendo “justiça”, mas o termo grego também abrange conformidade moral; a alternativa é mantida em nota para não eliminar essa amplitude.
- issue: Relação de ἀνυπόκριτον com o julgamento divino
  choice: julgamento sem hipocrisia
  alternative: julgamento imparcial; julgamento genuíno
  rationale: A formulação preserva a expressão incomum e teologicamente tensa do grego. “Imparcial” explicita uma consequência plausível, mas restringe o sentido; “genuíno” comunica autenticidade, porém perde a negação explícita da hipocrisia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem paralela e a metáfora militar foram preservadas; a formulação “sem hipocrisia” mantém de modo deliberado a força e a ambiguidade da expressão grega.
