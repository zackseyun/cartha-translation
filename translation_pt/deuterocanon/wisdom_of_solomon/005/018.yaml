  source_fidelity: 'O texto traduz com precisão a estrutura e as imagens do grego: ἐνδύσεται/θώρακα é adequadamente expresso por “vestirá ... como couraça”, e περιθήσεται/κόρυθα por “porá como capacete”. “Julgamento sem hipocrisia” preserva, sem o reduzir, o sentido literal e a qualidade incomum de κρίσις ἀνυπόκριτος. “Justiça” é uma possibilidade lexical legítima para δικαιοσύνη, e a nota conserva a alternativa “retidão”, em consonância com a amplitude do termo e com a trilha de auditoria inglesa.'
