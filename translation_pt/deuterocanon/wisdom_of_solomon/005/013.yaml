base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/013.yaml
  text: So also we[a], once we were born, came to an end; and we had no sign of virtue to show[b], but were consumed in our wickedness.
translation:
  language: pt
  text: Assim também nós, depois de nascermos, chegamos ao fim[a]; não tivemos nenhum sinal de virtude[b] para mostrar, mas fomos consumidos em nossa maldade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desaparecemos” ou “deixamos de existir”. O verbo grego pode indicar desaparecimento ou cessação.
    reason: lexical_alternative
  - marker: b
    text: Ou “excelência”. O termo grego pode designar excelência moral em sentido amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ἡμεῖς
  choice: Assim também nós
  rationale: Preserva a comparação com as imagens anteriores de transitoriedade e mantém a ênfase expressa no pronome grego.
- source_word: γενηθέντες
  choice: depois de nascermos
  rationale: O particípio aoristo de γίνομαι indica aqui a entrada na existência; no contexto humano, “nascermos” é natural e preciso.
- source_word: ἐξελίπομεν
  choice: chegamos ao fim
  rationale: Expressa cessação ou desaparecimento sem definir além do grego a maneira exata pela qual a vida terminou.
- source_word: ἀρετῆς
  choice: virtude
  rationale: No contexto sapiencial e moral, designa excelência de caráter; “virtude” conserva esse sentido ético de modo conciso.
- source_word: σημεῖον οὐδὲν ἔσχομεν δεῖξαι
  choice: não tivemos nenhum sinal de virtude para mostrar
  rationale: Mantém a imagem de algo demonstrável e reproduz de maneira clara a construção com o infinitivo δεῖξαι.
- source_word: κακίᾳ
  choice: maldade
  rationale: Comunica a corrupção moral indicada pelo termo no contexto, e não simples infortúnio ou deficiência.
- source_word: κατεδαπανήθημεν
  choice: fomos consumidos
  rationale: Preserva a voz passiva e a ideia de ser gasto ou exaurido por completo, sem introduzir uma causa não explicitada.
theological_decisions:
- issue: Sentido moral de ἀρετή na literatura sapiencial
  choice: virtude
  alternative: excelência
  rationale: A confissão dos ímpios contrasta a vida deles com o valor moral que não conseguiram demonstrar. “Virtude” mantém o teor ético sem transformar o termo em categoria teológica técnica.
- issue: Relação entre a maldade e o esgotamento em ἐν δὲ τῇ κακίᾳ ἡμῶν
  choice: em nossa maldade
  alternative: por causa de nossa maldade
  rationale: A preposição ἐν permite uma relação contextual ou circunstancial. A tradução evita tornar explicitamente causal aquilo que o grego deixa mais aberto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A ordem e o paralelismo do grego foram preservados sem sacrificar a naturalidade.
