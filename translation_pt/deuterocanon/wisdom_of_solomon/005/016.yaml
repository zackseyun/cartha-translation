base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/005/016.yaml
  text: Therefore they will receive the kingdom of splendor and the crown of beauty from the hand of the Lord[a], because with his right hand he will shelter them[b], and with his arm he will defend them.
translation:
  language: pt
  text: Por isso, eles receberão o reino de esplendor e a coroa[a] de beleza da mão do Senhor, pois com sua mão direita ele os abrigará e com seu braço os defenderá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “diadema”. O termo grego designa especificamente uma insígnia régia usada na cabeça.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “defenderá em favor deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural e conciso a conclusão inferida da vindicação dos justos apresentada no contexto anterior.
- source_word: λήμψονται
  choice: receberão
  rationale: O futuro médio de λαμβάνω, junto de “das mãos do Senhor”, apresenta a recompensa como algo concedido, não tomado à força.
- source_word: τὸ βασίλειον τῆς εὐπρεπείας
  choice: o reino de esplendor
  rationale: Mantém βασίλειον como “reino” e conserva a imagem régia concreta, enquanto “esplendor” comunica a magnificência de εὐπρέπεια sem reduzi-la apenas a honra.
- source_word: τὸ διάδημα τοῦ κάλλους
  choice: a coroa de beleza
  rationale: “Coroa” é imediatamente compreensível em português; a nota registra que διάδημα designa especificamente um diadema régio. “Beleza” traduz diretamente κάλλος.
- source_word: ἐκ χειρὸς Κυρίου
  choice: das mãos do Senhor
  rationale: Reproduz o conhecido idiomatismo bíblico português para a agência pessoal do Senhor ao conceder a recompensa; o singular grego é representado idiomaticamente pelo plural em português.
- source_word: τῇ δεξιᾷ σκεπάσει αὐτούς
  choice: com sua mão direita ele os abrigará
  rationale: O dativo é instrumental, e “abrigará” transmite tanto cobertura quanto proteção, preservando a imagem antropomórfica.
- source_word: τῷ βραχίονι ὑπερασπιεῖ αὐτῶν
  choice: com seu braço os defenderá
  rationale: Preserva a imagem bíblica do braço como força atuante de Deus e traduz de modo idiomático o verbo de defender em favor de alguém.
theological_decisions:
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” corresponde ao uso bíblico consagrado e apresenta Deus como aquele que concede a recompensa e protege os justos.
- issue: Natureza das imagens da recompensa dos justos
  choice: Manter literalmente as imagens régias de “reino” e “coroa”
  alternative: Parafrasear como “honra régia” ou “reinado glorioso”
  rationale: O grego emprega imagens concretas de realeza. Mantê-las evita decidir se a passagem descreve apenas vindicação metafórica ou participação efetiva no governo régio.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe corrente e imagens bíblicas preservadas. “Por isso” favorece fluidez; “abrigará” e “defenderá” mantêm distintos os dois movimentos paralelos de proteção divina.
