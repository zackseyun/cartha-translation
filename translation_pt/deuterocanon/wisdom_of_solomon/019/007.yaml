base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/007.yaml
  text: The cloud that overshadowed the camp was seen[a], and from the water that had stood before them dry land emerged; from the Red Sea came an unhindered road, and from the violent surge a grassy plain.
translation:
  language: pt
  text: A nuvem que fazia sombra sobre o acampamento foi vista, bem como o surgimento de terra seca da água que antes ali estava; do mar Vermelho[a], um caminho sem obstáculos; e, da onda violenta, uma planície relvada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mar dos Juncos”. O texto grego diz literalmente “mar Vermelho”, forma mantida no texto principal.
    reason: Registra a designação alternativa conhecida do pano de fundo hebraico, sem afastar-se da leitura explícita da fonte grega.
lexical_decisions:
- source_word: σκιάζουσα
  choice: cobria de sombra
  rationale: Expressa de modo claro e vívido a ação de lançar sombra ou cobrir, sem acrescentar explicitamente uma interpretação protetora.
- source_word: παρεμβολήν
  choice: acampamento
  rationale: No contexto do êxodo, designa o acampamento de Israel; é natural em português e conserva o sentido concreto.
- source_word: προϋφεστῶτος ὕδατος
  choice: da água que antes ali estava
  rationale: Preserva tanto a anterioridade indicada pelo particípio perfeito quanto a ideia de água já presente naquele lugar.
- source_word: ξηρᾶς ἀνάδυσις γῆς
  choice: o surgimento de terra seca
  rationale: Mantém a construção nominal e a imagem da terra seca vindo à vista a partir da água.
- source_word: ἐθεωρήθη
  choice: Viu-se
  rationale: Reproduz o passivo de percepção e permite que a forma singular introduza naturalmente a sequência de fenômenos observados.
- source_word: ἐρυθρᾶς θαλάσσης
  choice: mar Vermelho
  rationale: É a tradução direta do topônimo presente no texto grego e a designação estabelecida em português.
- source_word: ὁδὸς ἀνεμπόδιστος
  choice: um caminho sem obstáculos
  rationale: Conserva a imagem concreta de uma passagem completamente desimpedida em linguagem portuguesa natural.
- source_word: χλοηφόρον πεδίον
  choice: uma planície verdejante
  rationale: Comunica que a planície apresenta vegetação verde, preservando a imagem surpreendente do terreno surgido em meio às águas.
- source_word: κλύδωνος βιαίου
  choice: das ondas impetuosas
  rationale: Traduz o movimento turbulento e a força das águas em expressão idiomática; o plural coletivo soa natural no contexto.
theological_decisions:
- issue: Identificação de ἐρυθρᾶς θαλάσσης na imagem do êxodo
  choice: mar Vermelho
  alternative: mar dos Juncos
  rationale: O testemunho grego diz explicitamente “mar Vermelho”. A tradução segue a fonte grega, enquanto a designação ligada ao pano de fundo hebraico é registrada em nota sem substituir a leitura do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação apresenta como uma única visão a nuvem, o surgimento da terra, o caminho e a planície, preservando a estrutura acumulativa e poética do grego. O marcador foi colocado junto a “mar Vermelho”, termo ao qual a nota efetivamente se refere.
