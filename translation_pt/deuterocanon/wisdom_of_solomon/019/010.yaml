base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/010.yaml
  text: 'For they still remembered the things in their time as foreigners: how[a], instead of the breeding of animals, the land brought forth gnats, and instead of creatures of the water[b], the river spewed out a multitude of frogs.'
translation:
  language: pt
  text: 'Pois ainda se lembravam do que acontecera durante sua permanência como estrangeiros[a]: como, em vez da reprodução dos animais, a terra produziu mosquitos[b] e, em vez de criaturas aquáticas, o rio vomitou uma multidão de rãs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego se refere à permanência em um lugar na condição de estrangeiro; também pode ser traduzido por “residência em terra estrangeira”.
    reason: lexical_alternative
  - marker: b
    text: A identificação exata do inseto é incerta; o termo pode designar mosquitos, borrachudos ou outros pequenos insetos picadores.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμέμνηντο ... ἔτι
  choice: ainda se lembravam
  rationale: O imperfeito expressa uma lembrança continuada, enquanto ἔτι acrescenta a ideia de que ela persistia.
- source_word: τῶν ἐν τῇ παροικίᾳ αὐτῶν
  choice: do que acontecera durante sua permanência como estrangeiros
  rationale: παροικία designa a residência de quem vive fora de sua própria terra. A formulação explicita naturalmente em português o referente elíptico de τῶν sem transformar essa condição em exílio.
- source_word: γενέσεως ζῴων
  choice: reprodução dos animais
  rationale: γένεσις, neste contraste, indica o processo normal de geração ou reprodução animal; 'reprodução' é claro e atual sem restringir o sentido a um único nascimento.
- source_word: ἐξήγαγεν ἡ γῆ
  choice: a terra produziu
  rationale: O verbo descreve a terra fazendo surgir os insetos. 'Produziu' soa natural em português e mantém a imagem da terra como agente.
- source_word: σκνῖπα
  choice: mosquitos
  rationale: O termo designa pequenos insetos, provavelmente picadores, mas a identificação exata é incerta. 'Mosquitos' é compreensível e adequado ao contexto da praga, com a incerteza registrada em nota.
- source_word: ἐνύδρων
  choice: criaturas aquáticas
  rationale: O adjetivo substantivado se refere a seres que vivem na água. 'Criaturas aquáticas' é conciso e preserva a generalidade do grego.
- source_word: ἐξηρεύξατο
  choice: vomitou
  rationale: O verbo é forte e vívido, literalmente associado a expelir ou arrotar. 'Vomitou' preserva a personificação e a intensidade da imagem.
- source_word: πλῆθος βατράχων
  choice: uma multidão de rãs
  rationale: πλῆθος ressalta a grande quantidade; 'multidão' mantém a ênfase e o registro elevado.
theological_decisions:
- issue: Sentido de παροικία na recordação das pragas do Egito
  choice: permanência como estrangeiros
  alternative: exílio; peregrinação
  rationale: O contexto aponta para a residência de Israel no Egito em condição estrangeira. 'Exílio' acrescentaria uma categoria histórica e teológica mais forte do que o termo exige, enquanto 'peregrinação' poderia sugerir deslocamento contínuo.
- issue: Relação entre a produção de insetos e a geração animal normal
  choice: em vez da reprodução dos animais
  alternative: em vez do nascimento de animais; em vez da geração de seres vivos
  rationale: A formulação mantém o contraste retórico do texto sem explicar de modo excessivo como a praga substitui ou subverte os processos naturais.
- issue: Força da personificação do rio em ἐξηρεύξατο
  choice: o rio vomitou
  alternative: o rio fez jorrar; o rio lançou para fora
  rationale: A opção preserva a linguagem deliberadamente vigorosa do grego e não a suaviza por razões interpretativas.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A construção preserva o paralelismo entre a terra e o rio e mantém a imagem forte do rio que 'vomitou' rãs.
