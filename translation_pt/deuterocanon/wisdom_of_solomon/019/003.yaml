  source_fidelity: A tradução preserva adequadamente a sequência temporal, o lamento junto aos túmulos, o novo plano insensato e a reversão irônica entre expulsar e perseguir. Contudo, «manifestações de luto» introduz no texto principal uma explicitação interpretativa que o grego não afirma de modo direto; a imagem de «ter o luto nas mãos» pode ser mantida, com o esclarecimento na nota.
  naturalness: O período é fluente e de registro apropriado. «Expulsado entre súplicas» é compreensível, mas soa menos natural e torna imprecisa a relação entre o particípio «suplicando» e o verbo «expulsaram». «Expulsado com súplicas» expressa melhor a construção e preserva sua tensão irônica.
  terminology: «Luto», «lamentar», «túmulos», «plano insensato», «expulsar» e «fugitivos» são escolhas adequadas, modernas e fiéis ao registro do texto. A nota cultural pode explicar que «luto» provavelmente abrange ritos, sinais ou objetos de luto, sem transformar essa possibilidade em parte da tradução.
