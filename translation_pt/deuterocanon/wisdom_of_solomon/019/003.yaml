base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/003.yaml
  text: For while they still had their mourning in their hands and were still lamenting at the graves of the dead[a], they took up another plan of folly, and those whom they had driven out with pleading[c][b], these they pursued as fugitives.
translation:
  language: pt
  text: 'Pois, enquanto ainda tinham o luto nas mãos[a] e continuavam a lamentar junto aos túmulos dos mortos, adotaram outro plano insensato[b]: aqueles que haviam expulsado com súplicas[c], passaram a persegui-los como fugitivos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: “tinham o luto nas mãos”, imagem vívida que provavelmente se refere a ritos, objetos ou sinais de luto com os quais ainda estavam ocupados.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “outro pensamento de insensatez” ou “outro desígnio insensato”.'
    reason: lexical_alternative
  - marker: c
    text: Isto é, eles haviam suplicado a essas mesmas pessoas que saíssem, mas depois as perseguiram como se tivessem fugido.
    reason: contextual_clarification
lexical_decisions:
- source_word: ἔτι
  choice: ainda
  rationale: Marca a continuidade das ações e sua sobreposição temporal.
- source_word: ἐν χερσὶν ἔχοντες τὰ πένθη
  choice: tinham nas mãos as manifestações de luto
  rationale: Conserva a imagem concreta das mãos, mas explicita que πένθη pode se referir a atos, ritos ou sinais visíveis de luto.
- source_word: προσοδυρόμενοι τάφους νεκρῶν
  choice: continuavam a lamentar diante dos túmulos dos mortos
  rationale: Expressa a continuidade do lamento e sua relação com os túmulos, em português natural e solene.
- source_word: ἕτερον ἐπεσπάσαντο λογισμὸν ἀνοίας
  choice: adotaram outro plano insensato
  rationale: λογισμός pode designar pensamento, desígnio ou plano; o contexto favorece um propósito que conduz à ação. ἀνοίας qualifica esse plano como insensato.
- source_word: οὓς ἱκετεύοντες ἐξέβαλον
  choice: aqueles que haviam expulsado entre súplicas
  rationale: Mantém tanto a expulsão expressa por ἐξέβαλον quanto as súplicas dos próprios egípcios expressas pelo particípio ἱκετεύοντες, sem ampliar o texto com detalhes narrativos.
- source_word: τούτους ὡς φυγάδας ἐδίωκον
  choice: passaram a persegui-los como fugitivos
  rationale: Preserva a ironia de tratarem como fugitivos aqueles que eles mesmos haviam instado a sair; 'passaram a' torna clara a mudança de conduta.
theological_decisions:
- issue: Ironia histórico-teológica na mudança de atitude dos egípcios para com Israel
  choice: Expor diretamente o contraste entre expulsar entre súplicas e depois perseguir como fugitivos.
  alternative: Explicitar que os egípcios primeiro rogaram a Israel que partisse após as pragas e depois o perseguiram junto ao mar.
  rationale: O grego já contém a inversão irônica, mas não explicita todos os pormenores de Êxodo; a tradução evita inserir no versículo dados contextuais adicionais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A tradução conserva a imagem concreta das mãos, a força de 'expulsar' e a ironia da perseguição, enquanto as notas esclarecem o idioma cultural e as alternativas lexicais.
