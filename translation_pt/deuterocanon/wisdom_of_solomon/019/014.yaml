review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente o contraste implícito entre os dois grupos, a recusa de hospitalidade e a escravização de benfeitores estrangeiros. Contudo, «que chegavam» não traduz com precisão παρόντας, que significa «estando presentes»; a ideia de chegada é uma inferência não expressa no grego. Além disso, «que lhes haviam feito o bem» torna explícito um destinatário do benefício que o texto não especifica.
  naturalness: «Não acolhiam os desconhecidos que estavam presentes» é português claro, moderno e suficientemente literal. «Benfeitores estrangeiros» é natural em registro bíblico-literário e preserva de modo conciso a construção grega.
  terminology: «Acolhiam» representa bem ἐδέχοντο no contexto de hospitalidade; «desconhecidos» mantém a ambiguidade de τοὺς ἀγνοοῦντας; «escravizaram» comunica diretamente ἐδουλοῦντο. «Benfeitores estrangeiros» conserva ambos εὐεργέτας e ξένους sem acrescentar um referente ao pronome implícito.
  issues:
  - severity: medium
    issue: «que chegavam» para παρόντας
    rationale: παρόντας significa «presentes», «estando ali», e não afirma que estivessem chegando. A redação introduz uma nuance de movimento ausente do original.
  - severity: low
    issue: «que lhes haviam feito o bem» explicita o destinatário do benefício
    rationale: εὐεργέτας designa «benfeitores», mas o grego não contém pronome equivalente a «lhes». A formulação nominal preserva melhor a concisão e a não especificação do texto.
  revised_text: Pois aqueles não acolhiam os desconhecidos que estavam presentes, mas estes escravizaram benfeitores estrangeiros.[a]
  revised_footnotes:
  - marker: a
    text: 'Ou: “escravizaram estrangeiros que eram benfeitores”.'
    reason: lexical_alternative
  revision_rationale: A revisão substitui a inferência «que chegavam» pelo sentido expresso de παρόντας, «que estavam presentes», e troca a paráfrase com destinatário implícito por «benfeitores estrangeiros», correspondendo diretamente a εὐεργέτας ξένους. O contraste pronominal permanece sem identificação histórica acrescentada.
