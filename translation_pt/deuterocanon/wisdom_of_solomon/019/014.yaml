revisions:
- from: Pois aqueles não acolhiam os desconhecidos que chegavam, mas estes escravizaram estrangeiros que lhes haviam feito o bem.[a]
  to: Pois aqueles não acolhiam os desconhecidos que estavam presentes, mas estes escravizaram benfeitores estrangeiros.[a]
