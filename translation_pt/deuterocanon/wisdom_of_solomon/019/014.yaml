  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/014.yaml
  text: For they did not welcome those who were present as strangers[c][b][a], but these enslaved foreign benefactors.
translation:
  language: pt
  text: Pois aqueles não acolhiam os desconhecidos que estavam presentes, mas estes escravizaram benfeitores estrangeiros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “escravizaram estrangeiros que eram benfeitores”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν ... οὗτοι δὲ
  choice: aqueles ... mas estes
  rationale: Preserva o contraste entre os dois grupos sem identificá-los além do que o versículo grego explicita.
- source_word: τοὺς ἀγνοοῦντας
  choice: os desconhecidos
  rationale: Expressa o sentido literal de pessoas que eles não conheciam, com valor contextual de forasteiros.
- source_word: οὐκ ἐδέχοντο
  choice: não acolhiam
  rationale: No contexto de hospitalidade, acolher comunica melhor que uma simples recepção formal a ação recusada.
- source_word: παρόντας
  choice: que chegavam
  rationale: Traduz idiomaticamente a presença dessas pessoas junto ao primeiro grupo, sem acrescentar que estivessem necessitadas.
- source_word: εὐεργέτας
  choice: que lhes haviam feito o bem
  rationale: Comunica em linguagem corrente a ideia de benfeitores e torna perceptível a relação anterior de benefício.
- source_word: ξένους
  choice: estrangeiros
  rationale: Mantém a condição de forasteiros dos benfeitores e o paralelo com os desconhecidos da primeira oração.
- source_word: ἐδουλοῦντο
  choice: escravizaram
  rationale: Expressa diretamente a redução à escravidão indicada por δουλόω.
theological_decisions:
- issue: Identidade histórica dos grupos contrastados
  choice: Manter os grupos implícitos como “aqueles” e “estes”
  alternative: Identificá-los como sodomitas e egípcios
  rationale: O versículo grego emprega apenas pronomes contrastivos; nomear os grupos importaria para o texto uma identificação inferida do contexto.
- issue: Relação temporal dos benfeitores com o benefício prestado
  choice: “que lhes haviam feito o bem”
  alternative: “benfeitores”
  rationale: O substantivo εὐεργέτας indica pessoas que prestaram benefício. A formulação verbal é mais corrente em português, embora o objeto indireto “lhes” seja contextual; por isso, a alternativa mais formal é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com construção fluente para leitores brasileiros e compreensão internacional. O contraste pronominal e a ironia moral do grego foram preservados.
