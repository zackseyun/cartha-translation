  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/015.yaml
  text: And not only that[a], but there will be an inspection of them, because they received the foreigners with hostility.
translation:
  language: pt
  text: E não somente isso, mas haverá uma inspeção sobre eles[a], porque receberam os estrangeiros com hostilidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “haverá uma visitação sobre eles”; o grego pode indicar uma visitação divina para juízo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον
  choice: não somente isso
  rationale: Retoma de modo natural o argumento anterior e introduz um agravante, sem deixar a negação solta.
- source_word: ἐπισκοπή
  choice: inspeção
  rationale: Preserva a ideia básica de exame ou averiguação e não explicita como punição aquilo que o contexto apenas sugere; a nota registra o possível sentido de visitação divina para juízo.
- source_word: ἀπεχθῶς
  choice: com hostilidade
  rationale: Expressa de forma corrente e clara a atitude hostil indicada pelo advérbio.
- source_word: προσεδέχοντο
  choice: receberam
  rationale: Traduz o ato de acolher ou admitir, enquanto o advérbio impede qualquer conotação positiva de boas-vindas.
- source_word: τοὺς ἀλλοτρίους
  choice: os estrangeiros
  rationale: Designa claramente pessoas de outro povo e se ajusta ao contraste entre grupos neste contexto.
theological_decisions:
- issue: Sentido de ἐπισκοπή em contexto de juízo
  choice: haverá uma inspeção sobre eles
  alternative: haverá uma visitação contra eles; eles serão castigados
  rationale: O substantivo pode designar uma visitação divina, inclusive para juízo, mas a cláusula não declara diretamente o castigo. A tradução mantém o núcleo lexical e conserva a implicação judicial sem a transformar em afirmação explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Inspeção sobre eles” mantém deliberadamente a tensão entre exame e visitação judicial; “estrangeiros” é preferível a termos potencialmente ambíguos ou pejorativos.
