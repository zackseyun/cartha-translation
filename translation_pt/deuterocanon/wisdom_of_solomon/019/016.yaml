  text: But those who had welcomed with festivities those who had already shared in the same rights afflicted them with terrible sufferings[a][b].
translation:
  language: pt
  text: Mas aqueles que haviam acolhido com festas os que já haviam participado dos mesmos direitos depois os afligiram com sofrimentos[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que já haviam participado das mesmas coisas justas” ou “das mesmas provisões”. A expressão grega pode se referir à mesma condição, aos mesmos benefícios ou àquilo que lhes era devido.'
    reason: lexical_alternative
