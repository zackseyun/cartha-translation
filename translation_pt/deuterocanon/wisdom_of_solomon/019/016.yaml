    reason: textual_variant
lexical_decisions:
- source_word: μετὰ ἑορτασμάτων
  choice: com festas
  rationale: Expressa uma recepção festiva e celebrativa sem limitar a expressão especificamente a refeições.
- source_word: εἰσδεξάμενοι
  choice: haviam acolhido
  rationale: Comunica a recepção hospitaleira indicada pelo particípio, mantendo a anterioridade em relação aos maus-tratos.
- source_word: τοὺς ἤδη τῶν αὐτῶν μετεσχηκότας δικαίων
  choice: os que já participavam dos mesmos direitos
  rationale: μετέχω indica participação, e δικαίων pode designar aquilo que é justo ou devido; no contexto, “direitos” comunica uma condição ou benefício compartilhado, enquanto a nota preserva alternativas mais literais.
- source_word: δείπνοις
  choice: depois
  rationale: O texto transmitido normalmente significa “em refeições/banquetes”, mas sua função sintática é difícil. A tradução explicita o contraste temporal provável no contexto e registra a leitura lexical direta em nota.
- source_word: ἐκάκωσαν
  choice: maltrataram
  rationale: Verbo amplo para fazer mal, prejudicar ou tratar cruelmente; “maltrataram” é natural e não restringe indevidamente o tipo de dano.
- source_word: πόνοις
  choice: impondo-lhes sofrimentos
  rationale: O dativo indica os sofrimentos ou aflições mediante os quais foram maltratados; a formulação portuguesa torna clara essa relação sem acrescentar o qualificativo interpretativo “terríveis”.
theological_decisions:
- issue: Sentido de τοὺς ἤδη τῶν αὐτῶν μετεσχηκότας δικαίων
  choice: participação nos mesmos direitos ou benefícios justos
  alternative: participação nas mesmas coisas justas ou nas mesmas provisões
  rationale: O contexto de acolhimento seguido de opressão favorece uma referência à posição ou aos benefícios compartilhados, mas a ambiguidade lexical é mantida em nota.
- issue: Tratamento da leitura difícil δείπνοις
  choice: expressar no texto principal o contraste temporal provável (“depois”) e documentar a forma grega em nota
  alternative: “em banquetes”, “durante as refeições” ou “com refeições”
  rationale: A forma transmitida é lexicalmente clara, mas sintaticamente difícil neste período. A nota impede que a tradução conjectural pareça certa e preserva a auditabilidade do texto grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A redação evita literalismo obscuro, mas marca em notas as duas incertezas centrais. “Impondo-lhes sofrimentos” esclarece a relação entre ἐκάκωσαν e πόνοις sem intensificar o original com “terríveis”.
