base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/013.yaml
  text: And punishments came upon the sinners[a], not without the evidence of what had happened in the violence of the thunderbolts; for they justly suffered for their own wicked acts[b], because they practiced a more grievous hatred of strangers.
translation:
  language: pt
  text: E os castigos sobrevieram aos pecadores, não sem as provas do que havia acontecido, na violência dos raios[a]; pois sofriam justamente por suas próprias maldades, visto que cultivaram um ódio mais grave aos estrangeiros[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não sem provas vindas dos acontecimentos, pela força dos raios”. A sintaxe grega é condensada e permite relacionar a expressão de mais de uma maneira, sem alterar o sentido geral.'
    reason: lexical_alternative
  - marker: b
    text: “Ódio aos estrangeiros” também pode ser traduzido por “hostilidade contra hóspedes” ou “falta de hospitalidade”; o termo grego, porém, pode indicar hostilidade ativa, não apenas ausência de acolhimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμωρίαι
  choice: castigos
  rationale: Expressa de modo claro e digno as penalidades infligidas em resposta ao mal, sem acentuar indevidamente a ideia de vingança.
- source_word: ἁμαρτωλοῖς
  choice: aos pecadores
  rationale: Reproduz diretamente o adjetivo substantivado e conserva sua caracterização moral.
- source_word: οὐκ ἄνευ τῶν γεγονότων τεκμηρίων
  choice: não sem as provas do que havia acontecido
  rationale: Mantém τεκμήρια como provas ou indícios confirmatórios e γεγονότων como referência ao que já ocorrera, preservando a formulação grega comprimida.
- source_word: τῇ βίᾳ τῶν κεραυνῶν
  choice: na violência dos raios
  rationale: Conserva a força destrutiva de βία e traduz κεραυνοί pelo termo português natural 'raios'.
- source_word: δικαίως ἔπασχον
  choice: sofriam justamente
  rationale: Preserva tanto o sofrimento continuado indicado pelo imperfeito quanto o juízo moral expresso pelo advérbio.
- source_word: ταῖς ἰδίαις αὐτῶν πονηρίαις
  choice: por suas próprias maldades
  rationale: Mantém o plural e a relação causal ou retributiva sem restringir πονηρίαι apenas a atos isolados.
- source_word: χαλεπωτέραν μισοξενίαν
  choice: um ódio mais cruel aos estrangeiros
  rationale: Preserva o comparativo χαλεπωτέραν e a força ativa de μισοξενία, mais intensa que mera falta de hospitalidade.
- source_word: ἐπετήδευσαν
  choice: praticaram
  rationale: Comunica uma conduta deliberadamente cultivada ou habitual.
theological_decisions:
- issue: Força moral de μισοξενία
  choice: ódio aos estrangeiros
  alternative: falta de hospitalidade; hostilidade contra hóspedes
  rationale: O composto grego indica aversão ou hostilidade ativa a estrangeiros ou hóspedes. A tradução mais forte corresponde ao contexto de punição justa sem acrescentar uma doutrina externa.
- issue: Relação de ταῖς ἰδίαις αὐτῶν πονηρίαις com o sofrimento
  choice: por suas próprias maldades
  alternative: por causa de suas próprias ações perversas; mediante suas próprias maldades
  rationale: A construção admite nuance causal ou retributiva. 'Por' preserva essa abertura e mantém a afirmação de que o sofrimento correspondia justamente ao mal deles.
- issue: Referente comparativo de χαλεπωτέραν
  choice: mais cruel
  alternative: mais severo; ainda mais cruel
  rationale: O comparativo é mantido sem inserir 'ainda', intensificador que não está expresso no grego. O padrão de comparação permanece dependente do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem e as relações lógicas do grego foram preservadas na medida em que o português permite; as duas ambiguidades relevantes são explicitadas em notas.
