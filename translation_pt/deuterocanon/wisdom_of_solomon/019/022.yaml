base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/022.yaml
  text: For in every way[a], Lord, you magnified your people and glorified them, and you did not overlook them, standing by them at every time and place.
translation:
  language: pt
  text: Pois em tudo, Senhor, engrandeceste o teu povo e o glorificaste; não o negligenciaste[a], estando ao seu lado em todo tempo e lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “não o desconsideraste” ou “não o deixaste de notar”. O verbo grego significa literalmente ‘olhar por cima’, no sentido de deixar de dar atenção.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ πάντα
  choice: em tudo
  rationale: 'A expressão com κατά e o acusativo plural comunica abrangência: Deus agiu em todos os aspectos. “Em tudo” é conciso, natural e mantém a amplitude do grego.'
- source_word: ἐμεγάλυνας
  choice: engrandeceste
  rationale: O verbo significa tornar grande ou exaltar. “Engrandeceste” preserva o registro elevado e o sentido causativo sem soar artificial.
- source_word: τὸν λαόν σου
  choice: o teu povo
  rationale: λαός designa aqui o povo pertencente a Deus; “o teu povo” é a formulação bíblica natural em português.
- source_word: ἐδόξασας
  choice: o glorificaste
  rationale: A tradução conserva a ligação lexical com “glória” e o sentido de conferir honra e esplendor.
- source_word: οὐχ ὑπερεῖδες
  choice: não o negligenciaste
  rationale: ὑπεροράω pode significar não dar atenção, desconsiderar ou negligenciar. A escolha expressa a ausência de descuido divino e evita a possível ambiguidade de “não o ignoraste”.
- source_word: ἐν παντὶ καιρῷ καὶ τόπῳ
  choice: em todo tempo e lugar
  rationale: A expressão preserva as dimensões temporal e espacial da presença divina com formulação idiomática em português.
- source_word: παριστάμενος
  choice: estando ao seu lado
  rationale: O particípio denota estar presente ou junto de alguém, frequentemente com ideia de apoio. “Ao seu lado” conserva a imagem espacial sem explicitar mais auxílio do que o grego afirma.
theological_decisions:
- issue: Vocativo Κύριε
  choice: Senhor
  alternative: Ó Senhor
  rationale: Κύριε é uma invocação direta a Deus. “Senhor” mantém reverência e naturalidade moderna; o interjetivo “ó” não está expresso separadamente no grego.
- issue: Objeto implícito de παριστάμενος
  choice: estando ao seu lado
  alternative: estando presente
  rationale: O particípio não traz objeto explícito, mas o referente contextual é “o teu povo”. O possessivo singular “seu” retoma coletivamente “povo” e torna a relação clara sem acrescentar uma nova afirmação teológica.
- issue: Relação entre οὐχ ὑπερεῖδες e παριστάμενος
  choice: não o negligenciaste, estando ao seu lado
  alternative: não o negligenciaste, mas permaneceste ao seu lado
  rationale: A tradução mantém a construção participial do grego e evita introduzir com “mas” um contraste adversativo que não está formalmente marcado no texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A colocação pronominal segue uso corrente sem perder solenidade; “teu” mantém a forma tradicional de tratamento direto a Deus e concorda com “teu povo”.
