  text: For land animals were changed into creatures of the water[a], and swimming creatures moved onto the land.
translation:
  language: pt
  text: Pois os seres terrestres se transformavam[a] em seres aquáticos, e os que nadavam passavam para a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
