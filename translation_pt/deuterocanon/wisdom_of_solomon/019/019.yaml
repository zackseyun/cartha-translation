lexical_decisions:
- source_word: χερσαῖα
  choice: seres terrestres
  rationale: O adjetivo substantivado designa seres próprios da terra seca. “Seres terrestres” conserva a amplitude do grego sem limitar a referência a uma classe zoológica específica.
- source_word: ἔνυδρα
  choice: seres aquáticos
  rationale: O adjetivo substantivado designa seres associados à água. A formulação mantém o paralelismo com “seres terrestres” e a contraposição entre os dois ambientes.
- source_word: μετεβάλλετο
  choice: se transformavam
  rationale: O imperfeito expressa uma mudança em curso ou reiterada no quadro narrativo. A forma pronominal portuguesa comunica a transformação sem definir seu mecanismo.
- source_word: νηκτά
  choice: os que nadavam
  rationale: O adjetivo substantivado caracteriza os seres pela capacidade ou atividade de nadar. Esta formulação é natural em português e evita repetir “seres aquáticos”.
- source_word: μετέβαινεν
  choice: passavam para
  rationale: O verbo indica passagem de um domínio a outro. “Passavam para a terra” preserva esse movimento de transição e o aspecto imperfeito.
- source_word: γῆς
  choice: a terra
  rationale: No contraste explícito com a água, “a terra” designa o ambiente terrestre; o contexto já deixa clara a ideia de terra seca.
theological_decisions:
- issue: Natureza da mudança descrita na criação
  choice: Apresentar uma transformação dos seres terrestres em aquáticos e a passagem dos que nadavam para a terra, sem explicar o mecanismo.
  alternative: Interpretar a passagem como metamorfose literal de espécies ou apenas como descrição fenomenológica de comportamentos contrários à natureza.
  rationale: O grego afirma a mudança e a inversão dos ambientes, mas não esclarece como elas ocorreram. A tradução conserva essa tensão sem impor uma explicação naturalista, literalista ou alegórica.
- issue: Valor médio ou passivo de μετεβάλλετο
  choice: Usar “se transformavam” no texto e registrar a leitura passiva em nota.
  alternative: “eram transformados”
  rationale: A forma grega admite leitura média ou passiva. A redação principal é idiomática e não explicita um agente, enquanto a nota preserva a alternativa passiva.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo entre os ambientes terrestre e aquático. O imperfeito foi mantido nos dois verbos, e a redação evita restringir os substantivos adjetivais gregos a “animais” quando o original permite a expressão mais ampla “seres”.
