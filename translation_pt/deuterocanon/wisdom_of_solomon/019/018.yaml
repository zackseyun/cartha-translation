base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/018.yaml
  text: For the elements[a], changing among themselves, as in a harp the notes of the melody alter the name, while always remaining in the sound[b], as may be accurately inferred from the sight of what happened.
translation:
  language: pt
  text: Pois os elementos, reajustando-se entre si, são como, numa harpa, as notas do ritmo, que mudam de nome, embora permaneçam sempre no som[a]. Isso se pode deduzir com precisão pela observação do que aconteceu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «embora permaneçam sempre como som». A expressão grega é condensada e difícil; ela sugere continuidade sonora em meio à mudança de nome ou designação.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: «a partir da visão das coisas acontecidas», isto é, observando os acontecimentos narrados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στοιχεῖα
  choice: elementos
  rationale: No contexto das transformações da natureza durante o êxodo, designa os componentes da ordem criada sem implicar poderes cósmicos personificados.
- source_word: μεθαρμοζόμενα
  choice: reajustando-se entre si
  rationale: O verbo sugere rearranjo ou nova harmonização; a escolha também preserva a ligação com a comparação musical.
- source_word: ψαλτηρίῳ
  choice: harpa
  rationale: Equivalente concreto e compreensível para um antigo instrumento de cordas, sem recorrer ao pouco conhecido «saltério».
- source_word: φθόγγοι τοῦ ῥυθμοῦ
  choice: notas do ritmo
  rationale: «Notas» comunica claramente os sons musicais distintos, e «ritmo» traduz diretamente ῥυθμός, preservando a imagem do padrão musical ordenado.
- source_word: τὸ ὄνομα διαλλάσσουσιν
  choice: mudam de nome
  rationale: Mantém a formulação incomum e deliberadamente concreta do grego, sem substituí-la por uma interpretação como «mudam de caráter».
- source_word: πάντοτε μένοντα ἤχῳ
  choice: embora permaneçam sempre como som
  rationale: Preserva a tensão entre mudança de designação e continuidade sonora, sem especificar além do que a expressão grega difícil permite.
- source_word: ὅπερ ἐστὶν εἰκάσαι ... ἀκριβῶς
  choice: Isso se pode deduzir com precisão
  rationale: Expressa a possibilidade de reconhecer ou inferir cuidadosamente a analogia a partir dos acontecimentos observados.
- source_word: ἐκ τῆς τῶν γεγονότων ὄψεως
  choice: pela observação do que aconteceu
  rationale: Reproduz o fundamento visual e empírico da inferência em português natural.
theological_decisions:
- issue: Sentido dos «elementos» e da analogia musical
  choice: Apresentar os elementos da criação como mutuamente reajustados, sem personificá-los nem convertê-los em princípios metafísicos.
  alternative: Entender στοιχεῖα como poderes elementais ou princípios cósmicos de caráter filosófico.
  rationale: O contexto imediato descreve mudanças observáveis na natureza nos acontecimentos do êxodo; a tradução conserva essa perspectiva concreta e fenomenológica.
- issue: Continuidade em meio à transformação
  choice: Conservar a linguagem paradoxal de mudança de nome com permanência como som.
  alternative: Explicitar que a substância dos elementos permanece idêntica ou que apenas suas funções mudam.
  rationale: O grego não define metafisicamente o tipo de continuidade; explicá-lo resolveria uma ambiguidade que deve permanecer aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção grega muito condensada foi dividida em duas frases e a relação comparativa foi explicitada com «são como», sem eliminar a estranheza intencional de «mudam de nome» nem a ambiguidade de «permanecem como som».
