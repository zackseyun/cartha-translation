  naturalness: O registro é claro e moderno, mas «notas do ritmo numa harpa» e a construção com dois-pontos soam pouco naturais e tornam incerto quem muda de nome. A revisão torna a comparação inteligível sem eliminar a concisão e a estranheza deliberada da imagem.
  terminology: «Elementos», «reajustando-se entre si», «harpa», «nome» e «observação do que aconteceu» são escolhas defensáveis. «Notas» é adequado para φθόγγοι. Mantém-se «ritmo», conforme a decisão lexical, sem fazer da expressão uma afirmação metafísica.
