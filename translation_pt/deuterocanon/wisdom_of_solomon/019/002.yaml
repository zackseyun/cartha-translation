  text: because after they themselves[a] had turned back from letting them go, and had sent them on with urgency, they would pursue them[b], having changed their minds.
translation:
  language: pt
  text: pois eles próprios[a], depois de terem voltado atrás quanto a deixá-los partir e de mandá-los embora com urgência, iriam persegui-los, tendo mudado de ideia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois de terem retornado de deixá-los partir” ou “depois de terem revertido sua decisão de deixá-los partir”.'
    reason: lexical_alternative
  - marker: b
    text: “Tendo mudado de ideia” também pode ser traduzido por “tendo se arrependido” ou “tendo lamentado o que fizeram”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρέψαντες
  choice: terem voltado atrás
  rationale: Expressa uma reversão de atitude ou conduta e conserva a imagem de mudança de direção presente no verbo grego.
- source_word: τοῦ ἀπεῖναι
  choice: quanto a deixá-los partir
  rationale: No contexto do êxodo, o infinitivo articulado se refere à partida permitida aos israelitas; a formulação portuguesa explicita essa relação sem acrescentar novos referentes.
- source_word: μετὰ σπουδῆς
  choice: com urgência
  rationale: Abrange tanto a pressa quanto o empenho com que os fizeram partir.
- source_word: προπέμψαντες
  choice: os terem mandado embora
  rationale: Comunica naturalmente o ato de despachá-los para seguir viagem; o possível sentido de acompanhá-los não é imposto ao texto.
- source_word: διώξουσιν
  choice: iriam persegui-los
  rationale: O futuro grego descreve, nesta sequência narrativa, a perseguição posterior dos israelitas pelos egípcios.
- source_word: μεταμεληθέντες
  choice: tendo mudado de ideia
  rationale: Indica pesar que leva a uma reversão de decisão, sem introduzir as possíveis conotações teológicas de 'arrependimento'.
theological_decisions:
- issue: Sujeito narrativo e referentes implícitos
  choice: Mantêm-se os egípcios como sujeito implícito e os israelitas como objeto pronominal, sem nomear nenhum dos grupos no versículo.
  alternative: Nomear explicitamente 'os egípcios' e 'os israelitas' para eliminar toda ambiguidade referencial.
  rationale: Os pronomes e particípios gregos dependem do contexto. Os pronomes em português tornam a ação inteligível e preservam essa dependência contextual sem inserir nomes ausentes do versículo.
- issue: Sentido de μεταμεληθέντες
  choice: tendo mudado de ideia
  alternative: tendo se arrependido / tendo lamentado o que fizeram
  rationale: A expressão preserva a mudança de decisão motivada por pesar, evitando resolver o termo como arrependimento em sentido especificamente religioso.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com sintaxe narrativa natural e legibilidade brasileira. A sequência temporal dos particípios foi preservada por meio de “depois de... terem” e “tendo...”, sem eliminar a tensão do texto entre mandar partir com urgência e depois perseguir.
