revisions:
- from: Pois uma necessidade merecida os arrastou a esse fim[a] e lhes incutiu o esquecimento do que havia acontecido, para que completassem antecipadamente o castigo que ainda faltava aos seus tormentos[b].
  to: Pois uma necessidade merecida os arrastou a esse desfecho[a] e lançou sobre eles o esquecimento do que havia acontecido, para que, por meio de seus tormentos, completassem de antemão o castigo que ainda restava[b].
