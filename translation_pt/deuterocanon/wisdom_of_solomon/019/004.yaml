base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/004.yaml
  text: For a deserved necessity dragged them to this end[a], and cast forgetfulness of what had happened upon them[b], so that they might beforehand complete the punishment lacking in their torments.
translation:
  language: pt
  text: Pois uma necessidade merecida os arrastou a esse desfecho[a] e lançou sobre eles o esquecimento do que havia acontecido, para que, por meio de seus tormentos, completassem de antemão o castigo que ainda restava[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a necessidade que mereciam” ou “uma necessidade justa”. O grego reúne a ideia de merecimento ou adequação moral (ἀξία) e a de compulsão (ἀνάγκη).
    reason: lexical_alternative
  - marker: b
    text: Ou “o castigo que ainda faltava”. A expressão se refere à parcela da punição ainda não completada por meio de seus tormentos anteriores.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷλκεν
  choice: arrastou
  rationale: Expressa a força coercitiva do verbo no contexto, mais intensa que uma condução suave.
- source_word: ἡ ἀξία ... ἀνάγκη
  choice: uma necessidade merecida
  rationale: Preserva tanto a ideia de compulsão em ἀνάγκη quanto a dimensão moral de merecimento ou adequação em ἀξία.
- source_word: ἐπὶ τοῦτο πέρας
  choice: a esse fim
  rationale: Comunica o resultado ou termo final para o qual eles foram impelidos.
- source_word: τῶν συμβεβηκότων
  choice: do que havia acontecido
  rationale: Verte de modo claro e abrangente os acontecimentos anteriores já vividos.
- source_word: ἀμνηστίαν ἐνέβαλεν
  choice: lhes incutiu o esquecimento
  rationale: Mantém a ação forte de introduzir neles o esquecimento, com formulação natural em português.
- source_word: προαναπληρώσωσιν
  choice: completassem antecipadamente
  rationale: Retém tanto a noção de completar quanto o elemento prévio expresso pelo prefixo προ-.
- source_word: τὴν λείπουσαν ... κόλασιν
  choice: o castigo que ainda faltava
  rationale: Torna explícito que se trata da parcela restante ou ainda não completada do castigo.
- source_word: ταῖς βασάνοις
  choice: aos seus tormentos
  rationale: “Tormentos” preserva a intensidade punitiva de βάσανοι sem restringi-la à ideia técnica de tortura.
theological_decisions:
- issue: Agência por trás da compulsão e do esquecimento dos egípcios
  choice: A necessidade merecida é apresentada como aquilo que os arrasta e lhes incute o esquecimento, sem nomear Deus como sujeito.
  alternative: Explicitar que Deus os arrastou ou lhes causou o esquecimento.
  rationale: O grego personifica a necessidade e não identifica diretamente o agente divino; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e ampla inteligibilidade internacional. A formulação conserva a linguagem coercitiva e a agência não explicitamente divina do grego.
