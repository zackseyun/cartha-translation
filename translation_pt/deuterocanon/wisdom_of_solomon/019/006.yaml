base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/006.yaml
  text: For the whole creation[a], in its own kind, was formed anew from above, serving your own commands, so that your children might be kept unharmed.
translation:
  language: pt
  text: Pois toda a criação, segundo o seu próprio gênero, era novamente remodelada do alto[a], servindo às tuas próprias ordens, para que os teus filhos fossem preservados ilesos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “era novamente remodelada desde o princípio”. O grego ἄνωθεν pode significar “do alto” ou “desde o princípio”, e διετυποῦτο pode indicar que algo recebia nova forma ou era remodelado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλη ἡ κτίσις
  choice: toda a criação
  rationale: Expressa a totalidade da ordem criada por meio de uma formulação natural e abrangente em português.
- source_word: ἐν ἰδίῳ γένει
  choice: segundo o seu próprio gênero
  rationale: Preserva o sentido categorial de γένος, sem substituí-lo pela noção filosoficamente mais carregada de 'natureza'.
- source_word: πάλιν ἄνωθεν
  choice: novamente ... do alto
  rationale: Representa πάλιν como renovação e conserva no texto principal o possível sentido vertical ou divino de ἄνωθεν; a alternativa temporal é registrada em nota.
- source_word: διετυποῦτο
  choice: era ... remodelada
  rationale: O imperfeito passivo sugere um processo em curso, e o verbo pode indicar dar nova forma ou configuração.
- source_word: ὑπηρετοῦσα
  choice: servindo
  rationale: Traduz diretamente a atuação da criação a serviço das ordens divinas, sem acrescentar conotação litúrgica.
- source_word: ταῖς ἰδίαις ἐπιταγαῖς
  choice: às tuas próprias ordens
  rationale: No contexto, o possessivo refere-se naturalmente a Deus; 'próprias' representa ἰδίαις, e 'ordens' comunica a força autoritativa de ἐπιταγαῖς.
- source_word: οἱ σοὶ παῖδες
  choice: os teus filhos
  rationale: No contexto do cuidado de Deus por seu povo, 'filhos' preserva a relação filial sem restringir o referente ao sexo masculino.
- source_word: φυλαχθῶσιν ἀβλαβεῖς
  choice: fossem preservados ilesos
  rationale: Mantém a finalidade expressa por ἵνα com o subjuntivo passivo e comunica proteção completa contra dano.
theological_decisions:
- issue: Sentido de ἄνωθεν na renovação da criação
  choice: do alto
  alternative: desde o princípio
  rationale: A expressão pode indicar origem ou ação vinda do alto, coerente com a submissão da criação às ordens divinas, mas também admite sentido temporal. A nota conserva essa tensão lexical.
- issue: Referente de παῖδες
  choice: filhos
  alternative: servos
  rationale: Embora παῖδες possa designar filhos ou servos, aqui a proteção do povo pertencente a Deus favorece a leitura filial, sem excluir o aspecto de serviço presente no termo grego.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. 'Gênero' mantém a precisão de γένος; 'remodelada' torna explícita a reconfiguração da criação. A repetição possessiva em 'seu próprio' e 'tuas próprias' reflete a repetição grega sem comprometer a naturalidade.
