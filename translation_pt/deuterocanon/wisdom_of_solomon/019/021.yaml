base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/021.yaml
  text: Flames[a], on the contrary, did not wither the flesh of the perishable living creatures that walked among them, nor did they melt the meltable[b], crystal-like kind of ambrosial food.
translation:
  language: pt
  text: As chamas, ao contrário,[a] não ressecaram a carne dos seres vivos perecíveis que caminhavam entre elas, nem derreteram um tipo de alimento ambrosíaco, semelhante a cristal e facilmente derretível.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “inversamente” ou “em sentido contrário”. O advérbio grego indica que as chamas agiram de modo oposto ao que normalmente se esperaria.
    reason: lexical_alternative
  - marker: b
    text: “Semelhante a cristal” também pode ser entendido como “semelhante a gelo” ou “cristalino”, descrevendo a aparência ou a consistência do alimento milagroso.
    reason: lexical_alternative
lexical_decisions:
- source_word: φλόγες
  choice: as chamas
  rationale: O plural concreto conserva a imagem do fenômeno de fogo e soa natural em português.
- source_word: ἀνάπαλιν
  choice: ao contrário
  rationale: O advérbio assinala uma inversão do comportamento normalmente esperado das chamas.
- source_word: εὐφθάρτων ζῴων
  choice: dos seres vivos perecíveis
  rationale: Mantém o sentido amplo de ζῷα e a vulnerabilidade à corrupção ou destruição expressa por εὐφθάρτων, sem restringir a referência a uma espécie animal.
- source_word: οὐκ ἐμάραναν
  choice: não ressecaram
  rationale: Preserva a imagem incomum de μαραίνω, ‘fazer murchar ou ressecar’, em vez de normalizá-la como ‘queimar’ ou ‘consumir’.
- source_word: σάρκας
  choice: a carne
  rationale: O singular coletivo é idiomático em português e representa a carne corporal sem acrescentar um possessivo ausente do grego.
- source_word: ἐμπεριπατούντων
  choice: que caminhavam entre elas
  rationale: Transforma o particípio em oração relativa clara e mantém a imagem dos seres movendo-se no meio das chamas.
- source_word: εὔτηκτον
  choice: facilmente derretível
  rationale: Retém a ênfase paradoxal na propensão do alimento a derreter, em contraste com o fato de as chamas não o derreterem.
- source_word: κρυσταλλοειδὲς
  choice: semelhante a cristal
  rationale: Conserva a comparação visual ou material sem decidir se o referente é especificamente gelo.
- source_word: γένος
  choice: espécie
  rationale: Expressa o valor classificatório amplo do termo no sintagma que descreve o alimento.
- source_word: ἀμβροσίας τροφῆς
  choice: alimento ambrosíaco
  rationale: Preserva o registro elevado e a coloração literária helenística, sem reduzir a expressão a uma interpretação doutrinária específica.
theological_decisions:
- issue: Descrição do alimento milagroso sem impor uma interpretação doutrinária posterior
  choice: alimento ambrosíaco
  alternative: alimento celestial; alimento imortal
  rationale: A formulação conserva a imagem poética e helenística do grego, podendo evocar provisão sobrenatural sem identificar explicitamente o alimento com uma doutrina posterior.
- issue: Localização dos seres em relação às chamas
  choice: que caminhavam entre elas
  alternative: que caminhavam dentro delas; que se moviam no meio delas
  rationale: O particípio composto indica movimento em meio ao fogo; a tradução torna a cena explícita apenas na medida exigida pela sintaxe, sem expandir o milagre.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição ‘derreteram... derretível’ é intencional e reproduz a insistência lexical do grego; ‘ambrosíaco’ mantém o tom sapiencial elevado e é esclarecido pelo contexto.
