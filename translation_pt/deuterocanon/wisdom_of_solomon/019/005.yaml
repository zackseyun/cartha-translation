translation:
  language: pt
  text: E que o teu povo experimentasse uma jornada extraordinária[a], enquanto aqueles encontrassem uma morte estranha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «passasse por uma jornada surpreendente». O verbo pode indicar experimentar ou passar por algo, e não apenas tentar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «encontrassem uma morte insólita».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαός
  choice: povo
  rationale: Equivalente coletivo natural; com «teu», refere-se naturalmente ao povo de Deus.
- source_word: παράδοξον
  choice: extraordinária
  rationale: Expressa aquilo que foge ao esperado e causa admiração, conservando aqui o sentido positivo sem confundi-lo com ξένον.
- source_word: ὁδοιπορίαν
  choice: jornada
  rationale: Traduz de modo natural a ideia de viagem ou percurso e se ajusta ao contexto da travessia.
- source_word: πειράσῃ
  choice: viveu
  rationale: No contexto, o verbo indica experimentar ou passar por algo, não apenas tentar fazê-lo.
- source_word: ἐκεῖνοι
  choice: aqueles
  rationale: Preserva a força demonstrativa e o contraste enfático com «o teu povo», sem acrescentar «homens» nem explicitar os egípcios.
- source_word: ξένον
  choice: estranha
  rationale: Mantém o caráter insólito e ominoso da morte e preserva a distinção lexical em relação a παράδοξον.
- source_word: εὕρωσι
  choice: encontraram
  rationale: Conserva a imagem verbal grega e é idiomático em português no sentido de deparar com um destino.
- source_word: θάνατον
  choice: morte
  rationale: É o equivalente direto e não amplia indevidamente o sentido para «destruição».
theological_decisions:
- issue: Contraste entre o povo de Deus e os outros
  choice: 'Manter a antítese: o povo vive uma jornada extraordinária, enquanto aqueles encontram uma morte estranha.'
  alternative: Empregar o mesmo adjetivo para ambos, como «jornada estranha» e «morte estranha».
  rationale: O grego usa adjetivos diferentes, παράδοξον e ξένον; a tradução preserva tanto a distinção lexical quanto o contraste entre a experiência admirável do povo e o fim ominoso dos outros.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Jornada» mantém a imagem do percurso; «aqueles» preserva a oposição demonstrativa do grego sem inserir um referente não expresso no versículo.
