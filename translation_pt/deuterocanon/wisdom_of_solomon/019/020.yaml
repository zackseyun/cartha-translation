  text: O fogo conservava sua própria força mesmo na água[a], e a água se esquecia de seu poder de apagar o fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O fogo era forte na água além de sua própria capacidade.”'
