lexical_decisions:
- source_word: πῦρ
  choice: o fogo
  rationale: Tradução direta do substantivo, preservando o contraste entre os elementos.
- source_word: ἴσχυεν ἐν ὕδατι
  choice: mostrava-se mais forte na água
  rationale: O imperfeito indica uma ação ou condição continuada; a formulação conserva a ideia paradoxal de o fogo atuar com vigor dentro da água.
- source_word: τῆς ἰδίας δυνάμεως
  choice: do que sua própria força permitiria
  rationale: Entende o genitivo como expressão de comparação ou medida, isto é, uma força além da capacidade própria do fogo; a construção grega admite outra análise, registrada em nota.
- source_word: ὕδωρ
  choice: a água
  rationale: Equivalente direto, em paralelismo antitético com o fogo.
- source_word: ἐπελανθάνετο
  choice: se esquecia
  rationale: Mantém o sentido literal e a personificação vívida do imperfeito médio.
- source_word: τῆς σβεστικῆς δυνάμεως
  choice: de seu poder de apagar o fogo
  rationale: Expressa em linguagem natural a capacidade de extinguir própria da água, deixando explícito o objeto implícito do verbo para assegurar clareza.
theological_decisions:
- issue: Personificação dos elementos no contexto da ação milagrosa
  choice: Manter «a água se esquecia»
  alternative: «a água deixou de apagar o fogo»
  rationale: A personificação pertence à retórica do texto e retrata a alteração do comportamento da criação sem acrescentar uma explicação doutrinária.
- issue: Relação de τῆς ἰδίας δυνάμεως com ἴσχυεν
  choice: 'Entender como comparação ou medida: «mais forte... do que sua própria força permitiria»'
  alternative: 'Entender como a força própria que o fogo conservava: «mantinha na água sua força própria»'
  rationale: A construção grega é compacta e admite mais de uma análise. A leitura principal comunica a força extraordinária; a nota preserva a alternativa sem eliminar a ambiguidade.
