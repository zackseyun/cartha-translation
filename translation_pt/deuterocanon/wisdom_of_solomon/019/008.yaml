lexical_decisions:
- source_word: διʼ οὗ
  choice: por onde
  rationale: A expressão retoma o caminho ou espaço de passagem mencionado no contexto. “Por onde” preserva o valor locativo de διά com o genitivo e evita impor em português um gênero gramatical ao antecedente.
- source_word: πανεθνεὶ
  choice: como nação inteira
  rationale: O advérbio exprime que o povo passou coletivamente, em sua totalidade nacional, e não apenas como indivíduos isolados.
- source_word: διῆλθον
  choice: passaram
  rationale: O aoristo de διέρχομαι indica atravessar ou passar por um lugar; “passaram” é direto e não acrescenta detalhes do cenário além dos expressos no verso.
- source_word: οἱ τῇ σῇ σκεπαζόμενοι χειρί
  choice: os que eram abrigados pela tua mão
  rationale: “Abrigados” conserva a imagem concreta de serem cobertos ou acolhidos sob proteção, enquanto “pela tua mão” mantém a metáfora bíblica explícita da ação protetora de Deus.
- source_word: θεωρήσαντες
  choice: tendo contemplado
  rationale: A construção participial conserva a relação circunstancial com o verbo principal sem transformar de modo rígido a ação em uma oração temporal independente.
- source_word: θαυμάσια τέρατα
  choice: prodígios maravilhosos
  rationale: A expressão mantém a intensificação retórica dos dois termos gregos, que descrevem fenômenos extraordinários e miraculosos.
theological_decisions:
- issue: Imagem da proteção divina pela “mão”
  choice: Manter “pela tua mão” no texto principal
  alternative: “protegidos por ti”
  rationale: O grego emprega expressamente a mão como imagem da proteção ativa de Deus. Preservá-la evita reduzir a linguagem figurada a uma formulação abstrata.
- issue: Relação temporal do particípio θεωρήσαντες
  choice: “tendo contemplado”
  alternative: “depois de contemplarem” ou “enquanto contemplavam”
  rationale: A forma escolhida deixa a relação circunstancial suficientemente aberta e não força uma sequência temporal mais precisa do que a construção grega exige.
translation_notes:
  register: Português atual, claro e digno, com sintaxe de tom bíblico moderado. A segunda pessoa singular (“tua”) acompanha a invocação direta a Deus. A formulação preserva tanto a imagem concreta do abrigo sob a mão divina quanto a ênfase retórica da expressão final.
