base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/001.yaml
  text: But for the ungodly, merciless wrath came upon them to the very end; for he knew beforehand both them and what was going to happen,
translation:
  language: pt
  text: Mas sobre os ímpios[a] caiu uma ira sem misericórdia até o fim, pois ele sabia de antemão tanto a respeito deles como o que estava para acontecer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os irreverentes para com Deus”.
    reason: lexical_alternative
  - marker: b
    text: O sujeito de “sabia de antemão” não aparece expresso no grego; pelo contexto, trata-se mais naturalmente de Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσεβέσιν
  choice: os ímpios
  rationale: Preserva a dimensão religiosa e moral de ἀσεβής, isto é, pessoas caracterizadas pela irreverência diante de Deus; é mais específico que “maus” e natural em português bíblico atual.
- source_word: μέχρι τέλους
  choice: até o fim
  rationale: Mantém o sentido temporal e a força do juízo que prossegue até seu termo, sem transformar a expressão em um advérbio de totalidade.
- source_word: ἀνελεήμων
  choice: sem misericórdia
  rationale: Reproduz diretamente a negação de misericórdia expressa pelo adjetivo e soa mais natural aplicado a “ira” do que “impiedosa” em português corrente.
- source_word: θυμός
  choice: ira
  rationale: Comunica a intensidade da indignação punitiva no contexto de juízo, com registro digno e sem intensificação indevida para “fúria”.
- source_word: ἐπέστη
  choice: caiu
  rationale: Expressa de modo idiomático a ideia de algo hostil que sobrevém aos ímpios. O complemento “sobre os ímpios” conserva a relação indicada pelo dativo grego.
- source_word: προῄδει
  choice: conhecia de antemão
  rationale: Torna transparente a ideia de conhecimento prévio sem recorrer a “predestinava” nem carregar o verbo com implicações teológicas estranhas ao texto.
- source_word: αὐτῶν καὶ τὰ μέλλοντα
  choice: também o que ainda fariam
  rationale: Entende αὐτῶν em relação com τὰ μέλλοντα, referindo-se ao futuro comportamento dos ímpios. A formulação é natural e mantém a orientação futura do particípio, enquanto a nota registra a construção alternativa.
theological_decisions:
- issue: Sujeito implícito de προῄδει
  choice: “ele”, sem identificar expressamente o sujeito
  alternative: “Deus conhecia de antemão”
  rationale: O verbo grego traz sujeito implícito. O contexto aponta naturalmente para Deus, mas inserir seu nome resolveria de modo explícito algo que o versículo deixa gramaticalmente implícito.
- issue: Relação de αὐτῶν com τὰ μέλλοντα
  choice: 'O futuro agir dos ímpios: “o que ainda fariam”'
  alternative: 'Dois objetos do conhecimento: “tanto a eles como o que estava para acontecer”'
  rationale: A proximidade do genitivo αὐτῶν com τὰ μέλλοντα favorece entendê-lo como referência ao que ainda procederia deles. Como a sintaxe admite outra análise, ela é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem inicial conserva o contraste marcado por δέ. Evitou-se explicitar “Deus” no corpo do versículo e registrou-se em nota a ambiguidade sintática do trecho final.
