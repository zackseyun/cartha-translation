base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/017.yaml
  text: And they also were struck with blindness[a], like those at the doors of the righteous man, when, wrapped in deep darkness[b], each one kept seeking the way through his own door.
translation:
  language: pt
  text: Eles também foram atingidos pela cegueira[a], como aqueles que estavam às portas do justo, quando, envolvidos em profunda escuridão[b], cada um buscava a passagem por suas próprias portas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A alusão é a Gênesis 19:11, onde os homens à porta de Ló foram atingidos pela cegueira e se cansaram de procurar a entrada.
    reason: cross_reference
  - marker: b
    text: O grego traz literalmente uma construção incomum sobre «suas próprias portas» e «a passagem». Aqui ela é entendida como uma busca repetida de encontrar a passagem ou entrada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήγησαν ... ἀορασίᾳ
  choice: foram atingidos pela cegueira
  rationale: Preserva a força passiva de πλήσσω e traduz ἀορασία naturalmente como perda da visão, sem tom arcaico.
- source_word: ὥσπερ ἐκεῖνοι ἐπὶ ταῖς τοῦ δικαίου θύραις
  choice: como aqueles que estavam às portas do justo
  rationale: Mantém a comparação e o título genérico τοῦ δικαίου, sem inserir no texto principal o nome de Ló.
- source_word: ἀχανεῖ περιβληθέντες σκότει
  choice: envolvidos em profunda escuridão
  rationale: Expressa tanto a ideia de serem cercados pela escuridão quanto a intensidade e vastidão sugeridas por ἀχανής.
- source_word: ἕκαστος
  choice: cada um
  rationale: Conserva o sentido distributivo, apresentando cada pessoa separadamente.
- source_word: τῶν αὐτοῦ θυρῶν τὴν δίοδον ἐξῄει
  choice: cada um tentava achar a passagem por suas próprias portas
  rationale: A construção grega é incomum. A tradução preserva o plural θυρῶν e comunica a provável ideia contextual de tentativas repetidas de encontrar a passagem, sem afirmar que conseguiram sair.
theological_decisions:
- issue: Identificação do «justo» na alusão
  choice: Manter «o justo» no texto principal.
  alternative: Inserir «Ló» ou «o justo, Ló».
  rationale: O grego emprega τοῦ δικαίου, não o nome próprio; a nota esclarece a alusão sem explicitar no texto mais do que a fonte diz.
- issue: Sentido da ação final
  choice: «tentava achar a passagem»
  alternative: «saía pela passagem»
  rationale: Embora ἐξῄει possa normalmente indicar sair, o contexto alusivo de Gênesis 19:11 e a construção difícil favorecem a ideia de uma tentativa frustrada. A nota registra a dificuldade textual para não ocultar a ambiguidade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. «Atingidos pela cegueira» conserva a força da imagem; «profunda escuridão» é natural sem atenuar o original. O plural incomum «suas próprias portas» foi mantido por cautela diante da aspereza do texto grego.
