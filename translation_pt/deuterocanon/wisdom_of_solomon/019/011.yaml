  text: Later they also saw a new generation of birds[a], when, driven by craving, they asked for delicacies of luxury[b];
translation:
  language: pt
  text: Mais tarde, eles também viram um novo surgimento de aves[a], quando, impelidos pelo desejo, pediram alimentos requintados para seu deleite[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «uma nova espécie de aves». A expressão grega pode indicar um novo surgimento ou aparecimento de aves e, com menor probabilidade, um novo tipo de ave.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, buscavam alimentos especiais por prazer, e não apenas para se nutrirem; compare Êxodo 16 e Números 11, sobre o desejo de comida no deserto.
