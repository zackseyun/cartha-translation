lexical_decisions:
- source_word: ἐφʼ ὑστέρῳ
  choice: Mais tarde
  rationale: Marca de modo natural uma etapa posterior da narrativa.
- source_word: εἶδον
  choice: eles também viram
  rationale: Tradução direta do aoristo de ὁράω; o «também» representa καί.
- source_word: νέαν γένεσιν ὀρνέων
  choice: um novo surgimento de aves
  rationale: «Surgimento» preserva a ideia de vir à existência ou aparecer, sem decidir entre nova produção e nova espécie; «aves» mantém o substantivo amplo.
- source_word: ἐπιθυμίᾳ προαχθέντες
  choice: impelidos pelo desejo
  rationale: Expressa que o desejo os levou adiante, preservando a avaliação negativa do contexto sem intensificá-la indevidamente.
- source_word: ᾐτήσαντο
  choice: pediram
  rationale: Representa de maneira neutra o pedido expresso pelo verbo, sem transformá-lo em exigência.
- source_word: ἐδέσματα τρυφῆς
  choice: alimentos requintados para seu deleite
  rationale: Comunica alimentos especiais procurados por prazer e luxo, não apenas por necessidade, em português natural.
theological_decisions:
- issue: Caracterização moral do pedido de alimento no deserto
  choice: «impelidos pelo desejo» e «alimentos requintados para seu deleite»
  alternative: Uma formulação neutra, como «movidos pelo apetite, pediram comida», ou uma mais forte, como «dominados pela cobiça, exigiram iguarias luxuosas»
  rationale: O grego contém uma crítica ao desejo excessivo e à busca de prazer, mas não justifica transformar o pedido em exigência nem intensificar o desejo como cobiça.
- issue: Sentido de νέαν γένεσιν ὀρνέων
  choice: Preservar a ambiguidade como «um novo surgimento de aves»
  alternative: «uma nova espécie de aves»
  rationale: γένεσις pode destacar o aparecimento ou produção recente e, com menor probabilidade, um novo tipo; a tradução principal não resolve silenciosamente essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Alimentos requintados» é mais corrente que «iguarias» para o público geral, enquanto «para seu deleite» conserva a nuance de τρυφή sem explicação excessiva no corpo do versículo.
