base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/019/009.yaml
  text: For they grazed like horses[a], and skipped about like lambs, praising you, Lord[b], the one who delivered them.
translation:
  language: pt
  text: Pois eles pastaram como cavalos[a] e saltitaram como cordeiros[b], louvando-te, Senhor, a ti que os livraste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foram alimentados” ou “foram apascentados como cavalos”; o verbo grego evoca animais alimentando-se no pasto.
    reason: lexical_alternative
  - marker: b
    text: Ou “saltaram como cordeiros”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεμήθησαν
  choice: pastaram
  rationale: O verbo evoca animais alimentando-se no pasto. “Pastaram” conserva a imagem concreta e expressa naturalmente em português o valor médio-passivo do grego.
- source_word: διεσκίρτησαν
  choice: saltitaram
  rationale: O verbo indica saltos vivos e repetidos; “saltitaram” combina naturalmente com a imagem alegre dos cordeiros.
- source_word: ἀμνοί
  choice: cordeiros
  rationale: É o equivalente português comum e direto, preservando a imagem de animais jovens.
- source_word: αἰνοῦντές
  choice: louvando-te
  rationale: O particípio presente indica uma ação simultânea; a forma com pronome mantém a referência direta àquele que é louvado.
- source_word: Κύριε
  choice: Senhor
  rationale: Vocativo dirigido a Deus; “Senhor” é a tradução portuguesa tradicional, natural e semanticamente adequada.
- source_word: τὸν ῥυόμενον αὐτούς
  choice: a ti que os livraste
  rationale: A construção retoma enfaticamente o destinatário do louvor. “Livraste” expressa a ação salvadora no contexto do êxodo, enquanto “a ti” representa de modo idiomático o particípio substantivado com artigo.
theological_decisions:
- issue: Forma de tratamento divino κύριος
  choice: Senhor
  alternative: Soberano
  rationale: O texto dirige louvor diretamente a Deus. “Senhor” preserva o título sem introduzir uma interpretação denominacional.
- issue: Valor temporal de τὸν ῥυόμενον
  choice: a ti que os livraste
  alternative: a ti que os livras
  rationale: Embora o particípio grego não marque por si só o tempo como um verbo finito, o contexto recorda o livramento já realizado no êxodo; o pretérito é natural em português sem negar o caráter contínuo de Deus como libertador.
translation_notes:
  register: Português moderno, claro e digno, com construção fluente para leitores brasileiros e compreensão internacional. A repetição comparativa do grego foi preservada, bem como o tom jubiloso do versículo.
