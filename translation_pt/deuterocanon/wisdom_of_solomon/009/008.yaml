base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/008.yaml
  text: You said to build a temple on your holy mountain[a], and an altar in the city of your dwelling, an imitation of the holy tent that you prepared from the beginning.
translation:
  language: pt
  text: Disseste que se construíssem um templo no teu monte santo e um altar na cidade da tua habitação, uma imitação da tenda santa[a] que preparaste desde o princípio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do tabernáculo santo”. A palavra grega pode designar uma tenda ou, no uso bíblico, o tabernáculo sagrado.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπας
  choice: Disseste
  rationale: Traduz diretamente o aoristo de λέγω e mantém a oração em discurso dirigido a Deus, sem explicitar como ordem aquilo que o verbo apresenta literalmente como fala.
- source_word: οἰκοδομῆσαι
  choice: que se construísse
  rationale: O infinitivo dependente de εἶπας é expresso de modo natural em português; a construção impessoal abrange adequadamente tanto o templo quanto o altar.
- source_word: ναὸν
  choice: um templo
  rationale: ναός designa templo ou santuário. O artigo indefinido acompanha a forma sem artigo do grego sem negar a referência contextual ao templo de Jerusalém.
- source_word: ἐν ὄρει ἁγίῳ σου
  choice: no teu monte santo
  rationale: Em português, «no monte» é a expressão locativa natural e preserva ὄρος como «monte».
- source_word: πόλει κατασκηνώσεώς σου
  choice: cidade da tua habitação
  rationale: Conserva a construção nominal e a ideia de presença ou morada divina contida em κατασκήνωσις, sem a limitar a uma formulação interpretativa.
- source_word: θυσιαστήριον
  choice: um altar
  rationale: Equivalente comum e preciso para o altar sacrificial.
- source_word: μίμημα
  choice: uma imitação
  rationale: Preserva a noção de algo feito segundo um modelo, sem impor a linguagem mais específica de «cópia» nem um esquema teológico posterior.
- source_word: σκηνῆς ἁγίας
  choice: da tenda santa
  rationale: Traduz literalmente σκηνή em linguagem acessível; a alternativa tradicional «tabernáculo» é indicada em nota.
- source_word: ἣν προητοίμασας
  choice: que preparaste
  rationale: Expressa a preparação prévia; sua anterioridade já é reforçada pela locução seguinte.
- source_word: ἀπʼ ἀρχῆς
  choice: desde o princípio
  rationale: Equivalente idiomático que mantém a profundidade temporal sem acrescentar uma interpretação cosmológica específica.
theological_decisions:
- issue: Relação entre o santuário terreno e o modelo santo em μίμημα σκηνῆς ἁγίας
  choice: uma imitação da tenda santa
  alternative: uma cópia do tabernáculo santo
  rationale: «Imitação» conserva a correspondência com um modelo previamente preparado por Deus, mas não define a natureza ou localização desse modelo além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com a oração dirigida a Deus. A sintaxe conserva a sequência e a tensão conceitual do grego sem soar excessivamente técnica.
