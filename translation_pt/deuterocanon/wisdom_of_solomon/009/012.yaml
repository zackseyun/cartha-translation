- source_word: δικαίως
  choice: com justiça
  rationale: Formulação portuguesa corrente e digna para o advérbio, mantendo o sentido de julgamento justo.
- source_word: θρόνων
  choice: tronos
  rationale: Mantém deliberadamente o plural do texto grego, ainda que a expressão seja incomum.
