translation:
  language: pt
  text: Dá-me a sabedoria que está sentada ao lado dos teus tronos[a] e não me rejeites dentre os teus filhos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a sabedoria que está sentada ao lado do teu trono». O grego traz «teus tronos», no plural.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «não me rejeites dentre os teus servos», pois a palavra grega pode significar tanto «filhos» como «servos», conforme o contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: δός
  choice: Dá-me
  rationale: Imperativo direto de δίδωμι; «Dá-me» é claro, natural e preserva a forma de oração.
- source_word: πάρεδρον
  choice: que se assenta ao lado
  rationale: Preserva a imagem espacial de alguém sentado junto ao trono, sem acrescentar a ideia interpretativa de estar entronizada.
- source_word: σοφίαν
  choice: a sabedoria
  rationale: Equivalente direto; o contexto e a oração relativa mantêm a personificação sem exigir inicial maiúscula.
- source_word: τῶν σῶν θρόνων
  choice: dos teus tronos
  rationale: Mantém o plural explícito do grego, apesar de o singular ser mais esperado em português e possível como expressão do sentido contextual.
- source_word: ἀποδοκιμάσῃς
  choice: rejeites
  rationale: Expressa de modo corrente a ideia de reprovar ou rejeitar após avaliação, sem o tecnicismo de «desqualificar».
- source_word: ἐκ παίδων σου
  choice: dentre os teus filhos
  rationale: «Dentre» representa ἐκ com sentido de exclusão de um grupo; «filhos» é adequado ao contexto, embora παῖδες também possa significar «servos».
theological_decisions:
- issue: Sentido de παῖδες na relação com Deus
  choice: filhos
  alternative: servos
  rationale: O termo grego admite ambos os sentidos. «Filhos» se ajusta à linguagem filial do contexto, enquanto a alternativa legítima é preservada em nota.
- issue: Plural de θρόνων
  choice: tronos
  alternative: trono
  rationale: Conserva-se a forma plural atestada no texto grego, sem decidir se ela tem valor majestático ou evoca a corte celestial; a forma singular contextual é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural e leve elevação própria de uma oração. O plural incomum «tronos» foi mantido por fidelidade formal ao grego, e as ambiguidades relevantes foram documentadas em notas.
