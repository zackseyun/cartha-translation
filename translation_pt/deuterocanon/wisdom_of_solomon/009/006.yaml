base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/006.yaml
  text: For even if someone is perfect among the sons of men[a], apart from the wisdom that comes from you, he will be regarded as nothing.
translation:
  language: pt
  text: Pois, ainda que alguém seja perfeito entre os filhos dos homens[a], sem a sabedoria que vem de ti, será tido por nada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “entre os seres humanos”. O grego diz literalmente “entre os filhos dos homens”, expressão tradicional que se refere à humanidade.
    reason: Alternativa lexical e esclarecimento do alcance da expressão antropológica.
lexical_decisions:
- source_word: κἂν γάρ τις ᾖ
  choice: Pois, ainda que alguém seja
  rationale: κἄν (καί + ἐάν) introduz uma concessão, enquanto γάρ liga o versículo ao argumento anterior com valor explicativo. A formulação conserva ambos os elementos em português natural.
- source_word: τέλειος
  choice: perfeito
  rationale: τέλειος pode significar completo, maduro ou perfeito. Aqui, “perfeito” preserva o teor elevado e avaliativo do contexto sapiencial sem restringir indevidamente o sentido.
- source_word: ἐν υἱοῖς ἀνθρώπων
  choice: entre os filhos dos homens
  rationale: A expressão grega, de caráter semítico, designa os seres humanos em geral. A forma tradicional foi mantida no texto, e seu alcance coletivo é esclarecido em nota.
- source_word: τῆς ἀπὸ σοῦ σοφίας ἀπούσης
  choice: sem a sabedoria que vem de ti
  rationale: ἀπό indica origem, expressa por “que vem de ti”; o particípio ἀπούσης indica a ausência dessa sabedoria. “Sem” comunica a relação circunstancial com concisão e naturalidade, sem alterar o sentido.
- source_word: εἰς οὐδὲν λογισθήσεται
  choice: será considerado como nada
  rationale: O passivo de λογίζομαι significa ser contado, avaliado ou considerado. A tradução mantém tanto o caráter passivo quanto o juízo enfático expresso por εἰς οὐδέν.
theological_decisions:
- issue: Expressão antropológica de forma masculina
  choice: Manter “filhos dos homens” no texto principal
  alternative: entre os seres humanos
  rationale: O grego emprega literalmente uma expressão masculina tradicional cujo referente é a humanidade. A tradução preserva sua forma e seu registro, enquanto a nota esclarece seu alcance geral sem impor uma leitura denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe concessiva acompanha de perto o grego, enquanto “sem a sabedoria que vem de ti” evita uma construção participial rígida. O pronome “ti” preserva o tom direto da oração dirigida a Deus.
