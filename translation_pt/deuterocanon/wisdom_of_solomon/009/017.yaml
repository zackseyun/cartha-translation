base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/017.yaml
  text: And who has known your counsel[a], unless you have given wisdom and sent your holy Spirit from on high?
translation:
  language: pt
  text: E quem conheceu o teu desígnio, a não ser que tenhas dado sabedoria e enviado do alto o teu espírito santo[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o teu Espírito Santo». O grego diz literalmente «o teu espírito santo»; o uso de maiúsculas depende da interpretação, não de uma diferença no texto grego.'
    reason: alternative_reading
lexical_decisions:
- source_word: βουλήν
  choice: desígnio
  rationale: O termo pode indicar conselho, propósito ou plano. «Desígnio» comunica aqui o propósito deliberado de Deus sem reduzir o sentido a mero conselho dado a alguém.
- source_word: ἔγνω
  choice: conheceu
  rationale: O aoristo foi vertido pelo pretérito perfeito, que soa natural na pergunta retórica e preserva a formulação do grego.
- source_word: σοφίαν
  choice: sabedoria
  rationale: É o equivalente consagrado e mantém as dimensões intelectual, moral e teológica próprias da literatura sapiencial.
- source_word: τὸ ἅγιόν σου πνεῦμα
  choice: o teu espírito santo
  rationale: A expressão significa literalmente «o teu espírito santo». «Espírito» é preferível a «sopro» neste contexto; as minúsculas evitam decidir pela tipografia uma questão de interpretação teológica.
- source_word: ἀπὸ ὑψίστων
  choice: do alto
  rationale: A expressão grega, literalmente ligada às alturas celestes, é comunicada de modo idiomático e digno por «do alto».
theological_decisions:
- issue: Capitalização de «espírito santo» como título pessoal divino
  choice: o teu espírito santo
  alternative: o teu Espírito Santo
  rationale: O grego não dispõe de uma distinção de maiúsculas que resolva a questão. A redação principal conserva a expressão sem impor uma leitura dogmática posterior, e a alternativa tradicional é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém a pergunta retórica e a ambiguidade teológica do original; «do alto» evita o literalismo pouco natural de «das alturas».
