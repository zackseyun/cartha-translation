  source_fidelity: 'A redação preserva adequadamente os elementos do grego: βουλή como «desígnio», σοφία como «sabedoria», πνεῦμα como «espírito» e ἀπὸ ὑψίστων como «do alto». Contudo, depois de «se não», os pretéritos «deste» e «enviaste» podem ser lidos em português moderno como uma condição negativa comum («se não deste»), em vez da exceção pretendida («a não ser que tenhas dado»).'
  naturalness: «E quem conheceu o teu desígnio?» é natural e mantém o registro elevado. A formulação «a não ser que tenhas dado ... e enviado ...» torna explícita e idiomática a força exceptiva da pergunta retórica, com boa legibilidade internacional e brasileira.
  terminology: «Desígnio», «sabedoria» e «espírito santo» são escolhas apropriadas. As minúsculas na expressão principal não resolvem por antecipação a questão teológica, e a nota preserva de modo adequado a alternativa tradicional «Espírito Santo».
