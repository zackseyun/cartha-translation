base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/011.yaml
  text: For she knows all things and understands[a], and she will guide me prudently in my actions, and will guard me by her glory.
translation:
  language: pt
  text: Pois ela conhece todas as coisas e as compreende; ela me guiará com prudência em minhas ações e me guardará por sua glória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em sua glória” ou “por meio de sua glória”. A expressão grega pode indicar lugar ou meio.'
    reason: Preservar a ambiguidade sintática de ἐν τῇ δόξῃ αὐτῆς.
lexical_decisions:
- source_word: οἶδε
  choice: conhece
  rationale: Preserva o sentido comum de conhecimento e sua distinção em relação a συνίει.
- source_word: ἐκείνη
  choice: ela
  rationale: Retoma naturalmente a Sabedoria personificada no feminino.
- source_word: πάντα
  choice: todas as coisas
  rationale: Mantém a abrangência do acusativo plural grego e a ordem da oração.
- source_word: συνίει
  choice: as compreende
  rationale: Expressa compreensão distinta de mero conhecimento; o objeto pronominal retoma naturalmente 'todas as coisas' em português.
- source_word: ὁδηγήσει
  choice: guiará
  rationale: Conserva a imagem de condução e se ajusta ao contexto de orientação prática.
- source_word: ἐν ταῖς πράξεσί μου
  choice: em minhas ações
  rationale: Comunica atos e conduta prática em linguagem moderna e clara.
- source_word: σωφρόνως
  choice: com prudência
  rationale: Transmite sensatez, domínio de si e bom juízo na ação, sem reduzir o termo simplesmente a 'sabedoria'.
- source_word: φυλάξει
  choice: guardará
  rationale: Torna explícito o sentido de proteção e conservação.
- source_word: ἐν τῇ δόξῃ αὐτῆς
  choice: por sua glória
  rationale: Adota o valor instrumental possível de ἐν, entendendo a glória da Sabedoria como meio de proteção, e preserva a leitura locativa em nota.
theological_decisions:
- issue: Valor de ἐν em ἐν τῇ δόξῃ αὐτῆς
  choice: 'Instrumental: ''por sua glória'''
  alternative: 'Locativo: ''em sua glória''; também possível: ''por meio de sua glória'''
  rationale: O contexto apresenta a Sabedoria agindo para guiar e proteger, o que favorece o sentido instrumental, mas a construção grega permanece aberta ao sentido locativo; a nota conserva essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A coordenação foi levemente ajustada para soar natural, sem perder a sequência grega entre conhecer, compreender, guiar e guardar.
