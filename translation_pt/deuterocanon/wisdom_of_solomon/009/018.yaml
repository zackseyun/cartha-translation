translation:
  language: pt
  text: E assim foram endireitados os caminhos dos que estão na terra, e os seres humanos foram ensinados quanto às coisas que te agradam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διωρθώθησαν
  choice: foram endireitados
  rationale: Preserva o valor passivo de retificar ou tornar direito e mantém a imagem concreta dos caminhos.
- source_word: τρίβοι
  choice: caminhos
  rationale: Representa naturalmente as trilhas ou veredas do grego e conserva a conhecida metáfora sapiencial da conduta.
- source_word: τῶν ἐπὶ γῆς
  choice: dos que estão sobre a terra
  rationale: Reproduz a expressão substantivada de modo amplo, sem restringir antecipadamente seu referente.
- source_word: ἀρεστά
  choice: o que te agrada
  rationale: Expressa com naturalidade em português o adjetivo neutro substantivado; embora o grego tenha forma plural, o singular coletivo é idiomático e não altera o sentido.
- source_word: ἐδιδάχθησαν
  choice: aprenderam
  rationale: O aoristo passivo pode ser expresso idiomaticamente pelo resultado da instrução, evitando a construção pesada 'foram ensinados'.
- source_word: ἄνθρωποι
  choice: os seres humanos
  rationale: O termo designa aqui a humanidade em sentido genérico; esta opção é exata, inclusiva e digna em português atual.
theological_decisions:
- issue: Sentido genérico de ἄνθρωποι
  choice: os seres humanos
  alternative: os homens
  rationale: Neste contexto, o plural grego se refere genericamente à humanidade, não apenas a pessoas do sexo masculino. 'Os seres humanos' torna esse alcance explícito sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do grego. Mantém-se a metáfora dos caminhos endireitados; emprega-se 'aprenderam' para comunicar naturalmente o passivo grego como aquisição de instrução.
