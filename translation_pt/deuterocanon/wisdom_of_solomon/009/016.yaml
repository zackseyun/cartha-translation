base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/016.yaml
  text: And we can scarcely guess the things on earth[a], and we find the things at hand with labor[b]; but who has traced out the things in the heavens?
translation:
  language: pt
  text: Mal conseguimos conjecturar sobre as coisas da terra e, com esforço, descobrimos o que está ao nosso alcance[a]; mas quem rastreou as coisas que estão nos céus?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “as coisas nas mãos”; a expressão grega pode indicar aquilo que está próximo ou facilmente acessível.
    reason: lexical_alternative
  - marker: b
    text: Ou “investigou a fundo”. O verbo grego evoca seguir rastros até descobrir algo plenamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόλις
  choice: mal conseguimos
  rationale: Expressa dificuldade e quase incapacidade em português natural, preservando a humildade epistêmica do texto.
- source_word: εἰκάζομεν
  choice: conjecturar
  rationale: Indica formar uma ideia ou estimativa sem conhecimento seguro; é mais preciso que 'adivinhar' e menos confiante que 'inferir'.
- source_word: τὰ ἐπὶ γῆς
  choice: as coisas da terra
  rationale: Mantém de modo claro o contraste concreto entre a esfera terrestre e os céus.
- source_word: τὰ ἐν χερσὶν
  choice: o que está ao nosso alcance
  rationale: Reproduz idiomaticamente a ideia do que está próximo, acessível ou diante de nós, sem impor uma referência literal a objetos segurados nas mãos.
- source_word: εὑρίσκομεν
  choice: descobrimos
  rationale: Comunica chegar ao conhecimento mediante busca, adequando-se ao esforço indicado pela expressão seguinte.
- source_word: μετὰ πόνου
  choice: com esforço
  rationale: Preserva a noção de trabalho árduo e dificuldade em linguagem moderna e digna.
- source_word: τὰ δὲ ἐν οὐρανοῖς
  choice: as coisas que estão nos céus
  rationale: Conserva o plural grego e o contraste espacial com as coisas da terra.
- source_word: τίς ἐξιχνίασεν
  choice: quem rastreou
  rationale: Mantém a metáfora de seguir vestígios e investigar completamente, além da força da pergunta retórica.
theological_decisions:
- issue: Limitação humana diante das realidades celestes
  choice: Manter o contraste retórico entre a dificuldade de conhecer até as coisas terrestres e a incapacidade de perscrutar as celestes.
  alternative: Explicitar que se trata dos desígnios de Deus ou de mistérios divinos.
  rationale: O versículo não nomeia explicitamente os desígnios de Deus; a tradução preserva a tensão e evita antecipar a explicação do contexto seguinte.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura paralela e a pergunta retórica do grego foram preservadas; 'conjecturar' mantém o tom sapiencial sem tornar a frase excessivamente técnica.
