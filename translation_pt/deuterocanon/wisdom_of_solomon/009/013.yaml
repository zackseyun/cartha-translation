  text: For what man can know the counsel of God? Or who can discern what the Lord wills?[a]
translation:
  language: pt
  text: Pois qual ser humano poderá conhecer o desígnio de Deus? Ou quem poderá compreender o que o Senhor quer?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois qual pessoa conhecerá o propósito de Deus? Ou quem refletirá sobre o que o Senhor deseja?”'
    reason: Registra alternativas lexicais para ἄνθρωπος, βουλή, ἐνθυμηθήσεται e θέλει. “Conhecerá” e “refletirá” tornam mais visível o futuro grego, enquanto o texto principal expressa idiomaticamente a força retórica por “poderá”.
lexical_decisions:
- source_word: τίς γὰρ ἄνθρωπος
  choice: Pois que ser humano
  rationale: Mantém a pergunta retórica, o singular genérico de ἄνθρωπος e a conjunção explicativa γάρ, em português atual e inclusivo sem transformar o singular em plural.
- source_word: γνώσεται
  choice: poderá conhecer
  rationale: O futuro grego, numa pergunta retórica, expressa a limitada capacidade humana; “poderá conhecer” preserva tanto a orientação futura quanto essa implicação modal.
- source_word: βουλὴν θεοῦ
  choice: o desígnio de Deus
  rationale: βουλή pode indicar conselho, propósito, intenção ou plano. “Desígnio” conserva a ideia de intenção deliberada sem sugerir, como “conselho” poderia em português, uma recomendação dada por Deus.
- source_word: ἐνθυμηθήσεται
  choice: poderá compreender
  rationale: O verbo descreve considerar ou ponderar interiormente. No paralelismo, refere-se a chegar a apreender o querer do Senhor; “compreender” comunica esse resultado de modo natural, enquanto a nota registra a alternativa mais formal.
- source_word: τί θέλει
  choice: o que ... quer
  rationale: Traduz diretamente a oração interrogativa e o sentido volitivo de θέλω. “Quer” é claro e corrente, sem converter o verbo no substantivo teológico “vontade”.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: É o título divino natural neste contexto sapiencial e corresponde ao uso convencional de κύριος para Deus.
theological_decisions:
- issue: Linguagem humana genérica em ἄνθρωπος
  choice: ser humano
  alternative: homem; pessoa
  rationale: O grego se refere genericamente a qualquer membro da humanidade. “Ser humano” preserva o singular e explicita o alcance universal sem introduzir uma afirmação específica sobre o sexo masculino.
- issue: Relação entre βουλή e θέλει
  choice: desígnio ... quer
  alternative: propósito ... deseja; plano ... é da vontade
  rationale: A formulação conserva a distinção entre a intenção deliberada de Deus e aquilo que o Senhor quer, sem fundir os dois termos numa expressão teológica sistematizada.
- issue: Força epistêmica das perguntas retóricas
  choice: poderá conhecer ... poderá compreender
  alternative: conhecerá ... considerará
  rationale: As perguntas salientam os limites do conhecimento humano diante da intenção divina. O modal português torna essa força clara sem afirmar uma impossibilidade absoluta além do que o contexto retórico sugere.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. “Desígnio” mantém o peso sapiencial do verso; “quer” evita solenidade artificial. O marcador [a] aparece no texto principal e corresponde à única nota.
