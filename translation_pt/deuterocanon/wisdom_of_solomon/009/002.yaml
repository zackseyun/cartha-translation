  text: and by your wisdom you made man to rule over the creatures that came into being through you[b][a],
translation:
  language: pt
  text: e, por tua sabedoria, fizeste o ser humano[a] para governar[b] as criaturas que por ti vieram a existir,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o homem” ou “a humanidade”; o grego emprega o singular e provavelmente representa toda a humanidade na linguagem da criação.
    reason: lexical_alternative
  - marker: b
    text: Ou “para exercer domínio”, em alusão à linguagem do mandato da criação em Gênesis.
    reason: alternative_reading
lexical_decisions:
- source_word: σοφίᾳ
  choice: sabedoria
  rationale: 'O dativo indica meio ou instrumento: Deus fez o ser humano por sua sabedoria. “Sabedoria” preserva o peso literário e teológico do termo no livro.'
- source_word: κατεσκεύασας
  choice: fizeste
  rationale: O verbo pode significar fazer, preparar ou formar. “Fizeste” é claro e natural no contexto da criação, sem conferir ao ato uma nuance mecânica.
- source_word: ἄνθρωπον
  choice: o ser humano
  rationale: Mantém o singular representativo do grego e comunica que se trata da humanidade em linguagem de criação, sem restringir indevidamente a referência ao sexo masculino.
- source_word: ἵνα δεσπόζῃ
  choice: para governar
  rationale: A oração com ἵνα expressa finalidade, e δεσπόζῃ comunica exercício de autoridade. “Para governar” é atual e preserva essa força.
- source_word: τῶν ... κτισμάτων
  choice: as criaturas
  rationale: κτίσματα designa seres ou coisas criadas. “Criaturas” é uma formulação natural e apropriada ao tema do governo sobre a criação.
- source_word: ὑπὸ σοῦ γενομένων
  choice: que por ti vieram a existir
  rationale: A expressão preserva a nuance de γίνομαι, destacando que as criaturas receberam de Deus sua existência, e evita repetir o verbo “fazer”.
theological_decisions:
- issue: Sentido representativo de ἄνθρωπον na linguagem da criação
  choice: o ser humano
  alternative: o homem; a humanidade
  rationale: “O ser humano” conserva o singular representativo e inclui corretamente toda a humanidade. “O homem” reproduziria mais diretamente a forma tradicional, enquanto “a humanidade” transformaria o singular em substantivo coletivo.
- issue: Força de δεσπόζῃ em relação ao mandato da criação
  choice: para governar
  alternative: para exercer domínio; para dominar
  rationale: “Governar” mantém a noção de autoridade sem acrescentar conotações de exploração. A alternativa “exercer domínio” torna mais explícita a ressonância com a linguagem da criação em Gênesis.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A construção “que por ti vieram a existir” preserva o tom elevado e a nuance do grego sem repetição desnecessária.
