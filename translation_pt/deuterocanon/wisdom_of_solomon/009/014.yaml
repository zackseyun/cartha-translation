  text: For the reasonings of mortals are timid, and our thoughts are uncertain;
translation:
  language: pt
  text: Pois os raciocínios dos mortais são hesitantes, e incertas são as nossas ideias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογισμοὶ
  choice: raciocínios
  rationale: Expressa processos de reflexão e deliberação, preservando a distinção em relação a ἐπίνοιαι.
- source_word: θνητῶν
  choice: dos mortais
  rationale: Mantém a ênfase grega na condição humana sujeita à morte, sem introduzir referência ao sexo masculino.
- source_word: δειλοί
  choice: hesitantes
  rationale: No contexto, caracteriza os raciocínios humanos como faltos de firmeza ou confiança; evita a carga moral excessiva de «covardes».
- source_word: ἐπισφαλεῖς
  choice: incertas
  rationale: Comunica de modo natural a instabilidade e a pouca confiabilidade das concepções humanas.
- source_word: ἐπίνοιαι
  choice: ideias
  rationale: Designa concepções ou pensamentos formados pela mente; «ideias» é natural em português e não confunde o termo com λογισμοί.
- source_word: ἡμῶν
  choice: nossas
  rationale: Preserva diretamente a primeira pessoa do plural, pela qual o orador se inclui na humanidade.
theological_decisions:
- issue: Ênfase antropológica de θνητῶν
  choice: mortais
  alternative: seres humanos
  rationale: «Mortais» conserva a ênfase na limitação dos humanos como criaturas sujeitas à morte, em contraste implícito com a sabedoria divina.
- issue: Força de δειλοί aplicada aos raciocínios
  choice: hesitantes
  alternative: covardes
  rationale: «Hesitantes» preserva a ideia de fraqueza e falta de confiança sem transformar a limitação cognitiva humana em condenação moral explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A inversão em «incertas são as nossas ideias» reproduz com naturalidade moderada a ênfase predicativa do segundo membro e mantém o paralelismo.
