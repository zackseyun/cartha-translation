  text: You chose me beforehand as king of your people and as judge of your sons and daughters;[a]
translation:
  language: pt
  text: Tu me escolheste de antemão como rei do teu povo e como juiz dos teus filhos e filhas;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “me nomeaste” ou “me escolheste previamente”; o verbo grego inclui a ideia de escolha anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: σύ
  choice: Tu
  rationale: Mantém o pronome explícito e enfático no início da frase, em referência direta a Deus.
- source_word: προείλω
  choice: me escolheste de antemão
  rationale: Preserva tanto a ideia de escolha pessoal quanto o sentido de anterioridade expresso pelo prefixo προ-, sem impor uma formulação doutrinária mais forte.
- source_word: βασιλέα
  choice: rei
  rationale: Equivalente direto e adequado ao título político no contexto.
- source_word: λαοῦ σου
  choice: do teu povo
  rationale: Reproduz naturalmente o genitivo grego e a relação entre o rei e o povo de Deus.
- source_word: δικαστήν
  choice: juiz
  rationale: Conserva o sentido judicial específico de quem julga ou administra justiça.
- source_word: υἱῶν σου καὶ θυγατέρων
  choice: dos teus filhos e filhas
  rationale: Mantém a referência explícita do grego tanto a filhos quanto a filhas, em vez de reduzi-la ao termo genérico 'filhos' ou 'crianças'.
theological_decisions:
- issue: Natureza da escolha régia de Salomão
  choice: me escolheste de antemão
  alternative: me nomeaste; me escolheste previamente
  rationale: Expressa uma escolha divina anterior no contexto imediato, sem transformar a frase numa afirmação mais abrangente sobre predestinação.
- issue: Linguagem filial marcada por gênero
  choice: teus filhos e filhas
  alternative: teus filhos; teus descendentes
  rationale: Preserva a distinção expressa no texto grego entre pessoas do sexo masculino e feminino.
translation_notes:
  register: Português moderno, claro e solene, com tratamento por “tu” coerente com a oração dirigida diretamente a Deus. A formulação segue de perto o grego sem sacrificar a naturalidade.
