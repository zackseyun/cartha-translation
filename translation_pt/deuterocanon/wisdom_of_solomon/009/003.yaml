translation:
  language: pt
  text: e governe o mundo com santidade e justiça, e julgue com retidão de alma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέπῃ
  choice: governe
  rationale: Expressa naturalmente a ideia de dirigir ou administrar o mundo, preservando o valor do subjuntivo no contexto da oração.
- source_word: ὁσιότητι
  choice: santidade
  rationale: Mantém a dimensão de conduta piedosa e reverente do termo grego sem a reduzir a mera devoção.
- source_word: δικαιοσύνῃ
  choice: justiça
  rationale: Equivalente direto e corrente para a qualidade de agir justamente.
- source_word: εὐθύτητι ψυχῆς
  choice: retidão de alma
  rationale: Conserva a imagem antropológica e moral do grego, em formulação digna e compreensível.
- source_word: κρίσιν κρίνῃ
  choice: julgue
  rationale: A construção cognata grega intensifica o ato de exercer julgamento; em português, o verbo simples evita redundância artificial sem acrescentar interpretação.
theological_decisions:
- issue: Agente e força verbal no pedido dirigido a Deus
  choice: subjuntivos na terceira pessoa — “governe” e “julgue”
  alternative: infinitivos — “governar” e “julgar”
  rationale: O grego apresenta formas subjuntivas coordenadas, dentro de uma oração que pede capacidade para o destinatário humano; a formulação preserva esse caráter volitivo sem identificar o governante com Deus.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem e o paralelismo do grego foram preservados sem produzir uma repetição pouco natural em “κρίσιν κρίνῃ”.
