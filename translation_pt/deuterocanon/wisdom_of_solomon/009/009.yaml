base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/009.yaml
  text: And with you is wisdom[a], who knows your works, and was present when you made the world, and understands what is pleasing in your eyes and what is right according to your commandments.
translation:
  language: pt
  text: E contigo está a sabedoria, que conhece as tuas obras, que estava presente quando fazias o mundo[a] e que sabe o que é agradável aos teus olhos e o que é reto segundo os teus mandamentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «cosmo». O grego κόσμος pode enfatizar o mundo como uma ordem organizada.
    reason: Registra a amplitude lexical de κόσμος sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: μετὰ σοῦ
  choice: contigo
  rationale: Expressa de modo natural a associação próxima e a presença junto de Deus, sem acrescentar uma nuance espacial mais forte.
- source_word: ἡ σοφία
  choice: a sabedoria
  rationale: É a tradução corrente de σοφία e conserva a figura personificada, desenvolvida pelos particípios femininos que se seguem.
- source_word: ἡ εἰδυῖα τὰ ἔργα σου
  choice: que conhece as tuas obras
  rationale: A oração relativa reproduz a função atributiva do particípio e mantém a amplitude de ἔργα, que abrange os atos e feitos de Deus.
- source_word: παροῦσα
  choice: estava presente
  rationale: Indica a presença da sabedoria quando Deus fazia o mundo, sem introduzir imagens não expressas no grego.
- source_word: ὅτε ἐποίεις τὸν κόσμον
  choice: quando fazias o mundo
  rationale: O imperfeito ἐποίεις é preservado por «fazias», e «mundo» comunica de forma acessível o sentido de κόσμος sem impor uma formulação científica moderna.
- source_word: ἐπισταμένη
  choice: sabe
  rationale: Comunica conhecimento informado e discernimento; a variação em relação a «conhece» evita repetição pesada sem apagar a sobreposição semântica dos dois particípios.
- source_word: τί ἀρεστὸν ἐν ὀφθαλμοῖς σου
  choice: o que é agradável aos teus olhos
  rationale: Conserva a imagem avaliativa do original e permanece clara em português moderno.
- source_word: τί εὐθὲς ἐν ἐντολαῖς σου
  choice: o que é reto segundo os teus mandamentos
  rationale: «Reto» preserva a imagem ética de retidão em εὐθές, enquanto «segundo» apresenta os mandamentos como esfera normativa ou padrão.
theological_decisions:
- issue: Personificação da sabedoria
  choice: 'Manter «a sabedoria» em minúscula, com predicados pessoais: «que conhece», «estava presente» e «sabe».'
  alternative: Usar «Sabedoria» com inicial maiúscula ou despersonalizar a construção.
  rationale: O grego personifica claramente σοφία por meio de particípios femininos, mas não exige uma identificação doutrinária posterior. A redação preserva a personificação e a tensão do texto sem resolvê-las além da evidência.
- issue: Sentido de κόσμος
  choice: mundo
  alternative: cosmo ou universo
  rationale: «Mundo» é natural, abrangente e adequado ao contexto da criação; «cosmo» é mais técnico, e «universo» pode sugerir uma concepção científica moderna mais específica que o termo grego.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas de segunda pessoa do singular («tuas», «teus») coerentes com o discurso direto dirigido a Deus. A sintaxe conserva a personificação da sabedoria e o aspecto durativo do imperfeito grego.
