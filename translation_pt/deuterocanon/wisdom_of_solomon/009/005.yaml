  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/005.yaml
  text: for I am your slave and the son of your female slave[a], a weak man and short-lived, and lacking in understanding of judgment and laws[b];
translation:
  language: pt
  text: pois eu sou teu escravo e filho da tua escrava[a], homem fraco e de vida breve, e de pouca compreensão do juízo e das leis[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “teu servo e filho da tua serva”. O grego emprega termos que indicam condição de escravo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “menor em compreensão do juízo e das leis”; isto também pode indicar compreensão insuficiente para julgar e governar segundo as leis.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: escravo
  rationale: Preserva a linguagem explícita de condição servil e a auto-humilhação do orante diante de Deus; “servo” seria mais suave.
- source_word: υἱὸς τῆς παιδίσκης σου
  choice: filho da tua escrava
  rationale: Mantém o paralelismo social com δοῦλος e traduz diretamente παιδίσκη, sem ocultar a condição servil.
- source_word: ἄνθρωπος ἀσθενής
  choice: homem fraco
  rationale: O orante masculino fala de si mesmo; “homem fraco” expressa de modo direto sua fragilidade e incapacidade.
- source_word: ὀλιγόχρονιος
  choice: de vida breve
  rationale: Expressa naturalmente em português a ideia de alguém que dispõe de pouco tempo de vida.
- source_word: ἐλάσσων ἐν συνέσει
  choice: de pouca compreensão
  rationale: Comunica insuficiência ou capacidade menor de entendimento em português corrente, sem impor um grau de incapacidade absoluta.
- source_word: κρίσεως καὶ νόμων
  choice: do juízo e das leis
  rationale: Conserva os substantivos e o plural do grego, bem como o contexto judicial e régio.
theological_decisions:
- issue: Linguagem de condição servil na oração de humildade
  choice: “escravo” e “escrava” no texto principal
  alternative: “servo” e “serva”
  rationale: O grego emprega termos de condição social subordinada. A tradução direta preserva a força da autodepreciação diante de Deus, enquanto a nota registra a formulação tradicional mais branda.
- issue: Alcance de ἐλάσσων ἐν συνέσει κρίσεως καὶ νόμων
  choice: “de pouca compreensão do juízo e das leis”
  alternative: “menor em entendimento quanto ao juízo e às leis”
  rationale: A formulação principal é natural e mantém a ideia de insuficiência. Não resolve de modo rígido se os genitivos indicam o conteúdo compreendido ou a aptidão para julgar e governar segundo as leis.
translation_notes:
  register: Português moderno, digno e acessível, com formas pronominais coerentes com a oração dirigida a Deus. “De vida breve” evita uma construção artificial, e “de pouca compreensão” conserva a insuficiência comparativa do grego em linguagem natural.
