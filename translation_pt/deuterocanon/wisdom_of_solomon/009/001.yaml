  text: God of the fathers and Lord of your mercy[a], who made all things by your word,
translation:
  language: pt
  text: Ó Deus dos pais e Senhor da tua misericórdia, tu que fizeste todas as coisas pela tua palavra[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por meio da tua ordem». Grego: «pela tua palavra».'
    reason: Alternativa lexical contextual para λόγος, mantendo no texto principal a tradução mais direta e teologicamente aberta.
lexical_decisions:
- source_word: θεὲ
  choice: Ó Deus
  rationale: O vocativo grego dirige a oração diretamente a Deus; «Ó Deus» torna essa função clara em português e mantém o tom solene.
- source_word: πατέρων
  choice: dos pais
  rationale: Preserva o genitivo plural sem acrescentar o possessivo «nossos» e conserva o sentido tradicional de antepassados do povo.
- source_word: Κύριε
  choice: Senhor
  rationale: É o equivalente natural do título vocativo κύριε numa oração dirigida a Deus.
- source_word: τοῦ ἐλέους σου
  choice: da tua misericórdia
  rationale: Mantém tanto a construção genitiva quanto o pronome explícito σου («tua»), embora a expressão seja incomum em português.
- source_word: ὁ ποιήσας
  choice: tu que fizeste
  rationale: Explicita naturalmente em português que o particípio identifica o Deus a quem se dirige a oração, sem alterar o sentido do ato criador.
- source_word: τὰ πάντα
  choice: todas as coisas
  rationale: Reproduz a abrangência da expressão grega e preserva o registro elevado.
- source_word: ἐν λόγῳ σου
  choice: pela tua palavra
  rationale: Entende ἐν em sentido instrumental e conserva λόγος como «palavra», sem restringi-lo ao sentido de ordem ou mandamento.
theological_decisions:
- issue: Sentido de λόγος no contexto da criação
  choice: palavra
  alternative: ordem
  rationale: «Palavra» preserva a formulação e as possíveis ressonâncias do grego sem impor uma identificação doutrinária posterior; «ordem» é contextual­mente possível, mas mais restrita.
- issue: O pronome em τοῦ ἐλέους σου
  choice: da tua misericórdia
  alternative: da misericórdia
  rationale: A tradução retém o σου explícito e a tensão da formulação grega, em vez de suavizá-la por omissão.
translation_notes:
  register: Português atual, solene e acessível, com formas de segunda pessoa singular coerentes com a oração bíblica. A expressão «Senhor da tua misericórdia» foi mantida apesar de sua relativa estranheza para refletir de perto o grego.
