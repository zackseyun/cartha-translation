base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/009/010.yaml
  text: Send her out from the holy heavens[a], and send her from the throne of your glory, so that, being present with me, she may labor with me[c][b], and I may know what is pleasing to you.
translation:
  language: pt
  text: Envia-a dos santos céus e manda-a do trono da tua glória, para que, presente ao meu lado, trabalhe comigo, e eu saiba o que te agrada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαπόστειλον αὐτὴν ἐξ ἁγίων οὐρανῶν
  choice: Envia-a dos santos céus
  rationale: “Envia-a” conserva o objeto feminino, referente à Sabedoria personificada, e “dos santos céus” mantém o plural οὐρανῶν e a ideia de procedência, em português natural.
- source_word: ἀπὸ θρόνου δόξης σου πέμψον αὐτήν
  choice: manda-a do trono da tua glória
  rationale: A formulação preserva o paralelismo entre os dois imperativos e mantém a estrutura genitiva elevada de θρόνου δόξης σου, sem convertê-la interpretativamente em “teu trono glorioso”.
- source_word: συνπαροῦσά μοι
  choice: presente ao meu lado
  rationale: Expressa a presença conjunta indicada pelo composto συν- e pelo dativo μοι, evitando atribuir à Sabedoria uma função de guia que o particípio não explicita.
- source_word: κοπιάσῃ
  choice: trabalhe comigo
  rationale: O verbo denota trabalho árduo ou labor. “Trabalhe comigo” é corrente e preserva, no contexto, a participação da Sabedoria no esforço do orante; “labute comigo” seria mais enfático, porém menos amplo e natural.
- source_word: γνῶ
  choice: eu saiba
  rationale: Traduz diretamente o subjuntivo aoristo dentro da oração de finalidade introduzida por ἵνα.
- source_word: τί εὐάρεστόν ἐστιν παρὰ σοί
  choice: o que te agrada
  rationale: É a forma portuguesa mais natural de exprimir aquilo que é agradável ou aceitável para Deus, preservando o sentido relacional de παρὰ σοί sem reproduzir artificialmente seu idioma espacial.
theological_decisions:
- issue: Personificação feminina da Sabedoria enviada dos céus e do trono de Deus
  choice: Manter os pronomes e formas femininas em “Envia-a”, “manda-a” e no sujeito implícito de “trabalhe”
  alternative: Tratar a sabedoria como abstração neutra ou repetir explicitamente “a Sabedoria”
  rationale: O grego usa αὐτήν e συνπαροῦσά no feminino, apresentando a Sabedoria como figura personificada. A tradução conserva essa caracterização literário-teológica sem identificá-la com qualquer figura doutrinária posterior.
- issue: Participação da Sabedoria no labor do orante
  choice: “trabalhe comigo”
  alternative: “trabalhe por mim” ou “me ajude a trabalhar”
  rationale: A presença conjunta e o contexto favorecem trabalho compartilhado. A tradução não transforma essa cooperação poética em uma formulação doutrinária mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o paralelismo solene da oração, enquanto “presente ao meu lado” e “o que te agrada” evitam construções rígidas ou arcaizantes. Não há marcadores de nota porque nenhuma nota é necessária para preservar uma ambiguidade relevante nesta redação.
