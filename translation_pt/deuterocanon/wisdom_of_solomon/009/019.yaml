  text: e pela sabedoria foram salvos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «foram livrados» ou «foram preservados». O verbo grego pode indicar resgate, preservação ou salvação, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφίᾳ
  choice: sabedoria
  rationale: O dativo σοφίᾳ é naturalmente expresso por «pela sabedoria», indicando o meio. «Sabedoria» é o sentido habitual e o tema central do livro; «entendimento» seria mais estreito.
- source_word: ἐσώθησαν
  choice: foram salvos
  rationale: O aoristo passivo de σῴζω pode indicar salvar, livrar ou preservar. «Foram salvos» mantém em português a amplitude do verbo grego sem restringi-lo apenas a um livramento físico.
theological_decisions:
- issue: Alcance da linguagem de salvação em σῴζω
  choice: foram salvos
  alternative: foram livrados; foram preservados
  rationale: A formulação conserva a abrangência teológica e histórica do grego sem impor um sentido doutrinário posterior mais específico. As alternativas são registradas em nota para preservar a ambiguidade contextual.
translation_notes:
  register: Português moderno, digno e conciso, com construção natural e próxima da forma grega. A conjunção inicial «e» foi mantida por ligar esta frase ao contexto anterior.
