lexical_decisions:
- source_word: φθαρτὸν
  choice: perecível
  rationale: Expressa a sujeição do corpo à deterioração, sem limitar o sentido apenas à mortalidade.
- source_word: σῶμα
  choice: corpo
  rationale: Equivalente direto e natural para o corpo físico.
- source_word: βαρύνει
  choice: pesa sobre
  rationale: Preserva de modo idiomático a imagem de peso exercido sobre a alma.
- source_word: ψυχήν
  choice: alma
  rationale: Mantém o contraste antropológico do verso entre o corpo e a dimensão interior, sem confundi-la com νοῦς.
- source_word: βρίθει
  choice: sobrecarrega
  rationale: Comunica a pressão de um peso e sustenta o paralelismo com a primeira oração.
- source_word: γεῶδες
  choice: feita de terra
  rationale: Torna explícita e natural a ideia material do adjetivo, preservando a imagem da origem terrena.
- source_word: σκῆνος
  choice: tenda
  rationale: Conserva a metáfora de uma habitação corporal temporária, evitando o tom arcaico ou cultual de 'tabernáculo'.
- source_word: νοῦν
  choice: mente
  rationale: Equivalente moderno e abrangente para a faculdade intelectual ou racional.
- source_word: πολυφρόντιδα
  choice: cheia de preocupações
  rationale: Expressa uma mente ocupada por muitos cuidados, sem reduzir o termo a uma condição clínica de ansiedade.
theological_decisions:
- issue: Distinção antropológica entre ψυχή e νοῦς em paralelo com as imagens do corpo
  choice: Traduzir ψυχή por 'alma' e νοῦς por 'mente'.
  alternative: Traduzir ψυχή por 'vida' ou 'ser' e νοῦς por 'entendimento'.
  rationale: A distinção lexical mantém visíveis as diferentes dimensões interiores apresentadas poeticamente, sem impor uma sistematização doutrinária além do texto.
