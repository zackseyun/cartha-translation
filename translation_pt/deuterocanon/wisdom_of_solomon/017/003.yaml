base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/003.yaml
  text: For while they thought to remain hidden in their secret sins[a], they were scattered under the dark veil of forgetfulness, terribly aghast and shaken by apparitions.
translation:
  language: pt
  text: Pois, julgando que passariam despercebidos em seus pecados secretos, foram dispersos sob o véu escuro do esquecimento, tomados de terrível espanto e perturbados por aparições.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fantasmas” ou “espectros”. O termo grego pode designar uma imagem ou uma aparição de aspecto fantasmagórico.
    reason: Alternativa lexical que preserva a amplitude semântica de ἰνδάλμασιν.
lexical_decisions:
- source_word: λανθάνειν
  choice: permanecer ocultos
  rationale: 'O infinitivo com νομίζοντες expressa o que julgavam a respeito de si mesmos: que continuariam ocultos ou escapariam à percepção. A formulação é natural e preserva a ideia de encobrimento.'
- source_word: κρυφαίοις ἁμαρτήμασιν
  choice: em seus pecados secretos
  rationale: κρυφαίοις indica aquilo que é oculto ou secreto, e ἁμαρτήμασιν designa pecados ou atos pecaminosos. A expressão conserva tanto o caráter moral quanto a clandestinidade.
- source_word: ἀφεγγεῖ
  choice: escuro
  rationale: O adjetivo denota ausência de luz. “Escuro” é claro e idiomático em português, sem enfraquecer a imagem.
- source_word: λήθης
  choice: do esquecimento
  rationale: λήθη pode significar esquecimento ou olvido. “Esquecimento” mantém com clareza a relação genitiva com o véu e evita uma nuance metafísica desnecessária.
- source_word: παρακαλύμματι
  choice: sob o véu
  rationale: O substantivo indica uma cobertura ou véu. “Véu” preserva a imagem figurada de algo que encobre.
- source_word: ἐσκορπίσθησαν
  choice: foram dispersos
  rationale: O passivo de σκορπίζω significa normalmente dispersar ou espalhar. “Foram dispersos” conserva a imagem central, enquanto os particípios seguintes descrevem o terror e a perturbação.
- source_word: θαμβούμενοι δεινῶς
  choice: tomados de terrível espanto
  rationale: θαμβέω exprime assombro intenso, e δεινῶς reforça seu caráter terrível. A expressão comunica choque e pavor em português natural.
- source_word: ἰνδάλμασιν
  choice: aparições
  rationale: ἴνδαλμα pode designar imagem, fantasma ou aparição. No contexto, “aparições” comunica formas assustadoras sem determinar se eram visões subjetivas ou entidades objetivas.
- source_word: ἐκταρασσόμενοι
  choice: perturbados
  rationale: O particípio indica forte agitação ou desassossego. “Perturbados” é direto e permite que o contexto expresse a intensidade do medo.
theological_decisions:
- issue: Natureza dos fenômenos assustadores designados por ἰνδάλμασιν
  choice: aparições
  alternative: fantasmas, imagens ou espectros
  rationale: O texto apresenta o terror como parte do juízo, mas não define a natureza metafísica dessas formas. “Aparições” preserva a ambiguidade entre visões subjetivas e manifestações objetivas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada apenas o necessário para a fluidez, mantendo as imagens do véu, da dispersão e das aparições. O marcador foi colocado após “aparições”, termo ao qual a nota se refere.
