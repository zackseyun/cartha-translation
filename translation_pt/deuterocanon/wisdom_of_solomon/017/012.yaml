  text: For fear is nothing but the betrayal of the helps that come from reason[a].
translation:
  language: pt
  text: Pois o medo nada mais é do que a traição dos recursos que vêm da razão[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a traição dos auxílios derivados do raciocínio”.'
    reason: Alternativa lexical que conserva os sentidos possíveis de βοηθημάτων e λόγισμος.
lexical_decisions:
- source_word: φόβος
  choice: medo
  rationale: Expressa de modo amplo e natural o estado indicado pelo grego, sem a intensidade excessiva de “terror”.
- source_word: οὐθὲν ... εἰ μὴ
  choice: nada mais é do que
  rationale: 'Reproduz com naturalidade a definição por exclusão: o medo não é senão aquilo que a frase seguinte descreve.'
- source_word: προδοσία
  choice: traição
  rationale: Preserva a metáfora forte de abandono desleal dos próprios recursos interiores, sem explicá-la ou suavizá-la no texto principal.
- source_word: βοηθημάτων
  choice: recursos
  rationale: Comunica auxílios ou meios de apoio disponíveis; é corrente em português e mantém o plural concreto do grego.
- source_word: τῶν ἀπὸ λογισμοῦ
  choice: que vêm da razão
  rationale: Mantém a ideia de origem expressa por ἀπό e verte λόγισμος como a capacidade de reflexão racional, em linguagem clara e corrente.
theological_decisions:
- issue: Nuance antropológica e filosófica de λόγισμος
  choice: razão
  alternative: raciocínio; reflexão racional
  rationale: O versículo apresenta uma observação sobre o medo e os recursos da reflexão, não uma formulação doutrinária técnica. “Razão” é conciso, enquanto a nota conserva a alternativa processual “raciocínio”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a metáfora deliberadamente incisiva de προδοσία e a relação de origem entre os recursos e a razão.
