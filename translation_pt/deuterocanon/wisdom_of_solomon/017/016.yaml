base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/016.yaml
  text: Then[a], whoever it might have been there, when he fell down, was kept under guard, shut up in that ironless prison.
translation:
  language: pt
  text: Então, quem quer que estivesse ali, ao cair, era mantido sob guarda, encerrado naquela prisão sem ferro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a prisão sem ferro” — imagem de confinamento sem correntes ou grades físicas.
    reason: Esclarece a metáfora deliberadamente incomum de ἀσίδηρον sem substituí-la no texto principal.
lexical_decisions:
- source_word: εἶθʼ οὕτως
  choice: Então
  rationale: Marca a progressão narrativa de modo natural e conciso; o valor consecutivo de οὕτως é suficientemente transmitido pelo contexto, sem tornar a ligação pesada.
- source_word: ὃς δὴ ποτʼ οὖν ἦν ἐκεῖ
  choice: quem quer que estivesse ali
  rationale: 'Preserva a forte indefinição da expressão grega: a identidade não importa, pois qualquer um que estivesse ali sofria o mesmo destino.'
- source_word: καταπίπτων
  choice: ao cair
  rationale: Mantém a circunstância simultânea expressa pelo particípio e conserva a imagem concreta da queda, sem interpretá-la como mero abatimento emocional.
- source_word: ἐφρουρεῖτο
  choice: era mantido sob guarda
  rationale: Conserva a voz passiva e a ideia de vigilância ou custódia.
- source_word: εἰς τὴν ἀσίδηρον εἱρκτήν
  choice: naquela prisão sem ferro
  rationale: Reproduz a imagem incomum de ἀσίδηρον, literalmente 'sem ferro', sem explicitar no corpo do texto se se trata de correntes, grades ou outro meio físico de confinamento.
- source_word: κατακλεισθείς
  choice: encerrado
  rationale: Expressa de modo digno e natural a ideia de ter sido fechado ou confinado, reforçando a metáfora de prisão.
theological_decisions:
- issue: Gênero do sujeito indefinido
  choice: quem quer que estivesse ali
  alternative: qualquer pessoa que estivesse ali
  rationale: A expressão grega está no masculino singular, mas o português pode representar naturalmente esse singular indefinido com 'quem quer que', sem acrescentar um pronome masculino desnecessário nem converter o sujeito em plural. A formulação não faz afirmação doutrinária mais ampla sobre gênero.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sintaxe mantém a sequência do grego e sua metáfora de aprisionamento, evitando tanto uma formulação artificial como uma explicação excessiva no corpo do versículo.
