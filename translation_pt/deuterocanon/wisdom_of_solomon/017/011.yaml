base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/011.yaml
  text: For wickedness is especially cowardly[a], being condemned by itself; and, being pressed by conscience, it always assumes the worst.
translation:
  language: pt
  text: Pois a maldade, ao ser condenada, dá prova especial de covardia; e, oprimida pela consciência, sempre espera o pior.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Pois a maldade, ao ser condenada, dá testemunho de modo particularmente covarde; e, constrangida pela consciência, sempre espera coisas terríveis.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δειλὸν
  choice: covarde
  rationale: Conserva a ideia de covardia ou falta de coragem, mais forte e moralmente marcada do que “medrosa” ou “tímida”.
- source_word: ἰδίως
  choice: particularmente
  rationale: Expressa a intensificação do advérbio de maneira natural e digna em português.
- source_word: πονηρία
  choice: maldade
  rationale: Designa aqui o mal moral como qualidade abstrata; “maldade” é corrente e mais específica do que o substantivo amplo “mal”.
- source_word: μαρτυρεῖ
  choice: mostra-se
  rationale: Verte de modo idiomático a ideia de dar testemunho ou fornecer evidência, sem eliminar a ligação com a condição expressa por “ao ser condenada”. A tradução mais literal é registrada na nota.
- source_word: καταδικαζομένη
  choice: ao ser condenada
  rationale: Preserva a forma passiva e evita acrescentar explicitamente que a condenação vem de si mesma, algo sugerido pelo contexto, mas não expresso por pronome reflexivo no texto grego apresentado.
- source_word: προσειληφεν
  choice: espera
  rationale: No contexto de medo e consciência culpada, o perfeito indica acolher antecipadamente na mente ou prever resultados adversos; “espera” comunica isso com naturalidade.
- source_word: τὰ χαλεπὰ
  choice: o pior
  rationale: A expressão refere-se a coisas difíceis, penosas ou terríveis. “O pior” reproduz idiomaticamente a expectativa constante de desgraça.
- source_word: συνεχομένη τῇ συνειδήσει
  choice: oprimida pela consciência
  rationale: συνέχω pode indicar apertar, constranger ou oprimir; a formulação comunica com clareza a pressão interior exercida pela consciência.
theological_decisions:
- issue: A psicologia moral da culpa
  choice: A maldade, sob condenação e pressionada pela consciência, revela covardia e passa a esperar o pior.
  alternative: Entender a condenação como uma sentença apenas externa, ou explicitar que a maldade é condenada por seu próprio testemunho.
  rationale: A referência à consciência favorece uma dimensão interior, mas a voz passiva de καταδικαζομένη não identifica expressamente o agente. A redação preserva essa abertura sem apagar a dinâmica de culpa.
- issue: Relação sintática entre “covarde”, “testemunha” e “condenada”
  choice: Traduzir μαρτυρεῖ idiomaticamente por “mostra-se” no texto principal.
  alternative: “Pois a maldade, quando condenada, dá um testemunho particularmente covarde.”
  rationale: A construção grega é compacta e admite diferentes maneiras de relacionar os termos. O texto principal prioriza clareza sem suprimir o verbo, e a nota conserva uma representação mais formal da sintaxe.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O período mantém tom sapiencial digno, com vocabulário corrente e sem arcaísmos. A pontuação preserva o paralelismo das duas afirmações.
