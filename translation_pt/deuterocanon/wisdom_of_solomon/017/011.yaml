  naturalness: O português do rascunho é claro e de registro sapiencial apropriado. “Dar prova especial de covardia” é natural em português moderno e reproduz o valor evidencial de μαρτυρεῖ melhor que “mostra-se particularmente covarde”. “Oprimida pela consciência” e “espera o pior” são idiomáticos.
  terminology: “Maldade”, “covardia”, “condenada”, “consciência” e “o pior” são escolhas adequadas. Não é seguro explicitar “por si mesma” ou “por seu próprio testemunho” no texto principal, pois o particípio passivo καταδικαζομένη não nomeia o agente. A nota deve representar μαρτυρεῖ como verbo de testemunho, não como um substantivo artificialmente modificado por “covarde”.
