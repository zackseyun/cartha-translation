base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/002.yaml
  text: For when lawless men supposed that they were oppressing a holy nation[a], they lay imprisoned by darkness and bound fast by a long night, shut in under their roofs[c][b], fugitives from eternal providence.
translation:
  language: pt
  text: Pois homens sem lei[a], supondo que estavam oprimindo uma nação santa, jaziam prisioneiros das trevas e acorrentados por uma longa noite[b], encerrados sob seus tetos, fugitivos da providência eterna[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os sem lei”. O adjetivo grego está no masculino plural e é usado como substantivo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “cativos das trevas e presos aos grilhões de uma longa noite”.'
    reason: lexical_alternative
  - marker: c
    text: “Providência” traduz o grego πρόνοια, que aqui provavelmente se refere ao cuidado permanente com que Deus ordena e governa, e não apenas à previsão do futuro.
    reason: cultural_note
lexical_decisions:
- source_word: ὑπειληφότες
  choice: supondo
  rationale: O particípio expressa uma convicção presunçosa ou equivocada. “Supondo” preserva esse sentido sem acrescentar que se tratava apenas de imaginação.
- source_word: καταδυναστεύειν
  choice: estavam oprimindo
  rationale: O verbo indica domínio severo ou abuso de poder. “Oprimindo” mantém a força moral do termo e se ajusta ao contexto do Êxodo.
- source_word: ἔθνος ἅγιον
  choice: uma nação santa
  rationale: Tradução próxima do grego que preserva a ressonância da linguagem bíblica da aliança.
- source_word: ἄνομοι
  choice: homens sem lei
  rationale: O adjetivo masculino plural é usado como substantivo. A expressão conserva tanto a forma masculina quanto a caracterização moral, sem reduzi-la à ideia moderna de infração jurídica.
- source_word: δέσμιοι σκότους
  choice: prisioneiros das trevas
  rationale: Mantém a metáfora concreta de cativeiro e permite que as trevas sejam entendidas como o âmbito ou poder que os aprisiona.
- source_word: μακρᾶς πεδῆται νυκτός
  choice: acorrentados por uma longa noite
  rationale: πεδῆται evoca grilhões ou correntes. A formulação conserva a imagem de restrição em português atual.
- source_word: κατακλεισθέντες ὀρόφοις
  choice: encerrados sob seus tetos
  rationale: ὀρόφοις designa literalmente tetos ou espaços cobertos. A tradução preserva a imagem concreta, em vez de generalizá-la como “casas”.
- source_word: φυγάδες
  choice: fugitivos
  rationale: O termo designa pessoas em fuga e preserva a ironia de que, embora fisicamente encerrados, tentavam fugir da ordem providencial divina.
- source_word: τῆς αἰωνίου προνοίας
  choice: da providência eterna
  rationale: Em Sabedoria, πρόνοια aponta para o cuidado ordenador e permanente de Deus, não apenas para previsão ou planejamento.
- source_word: ἔκειντο
  choice: jaziam
  rationale: Reproduz o valor durativo e estático do verbo e apresenta vividamente a condição em que se encontravam.
theological_decisions:
- issue: Sentido de προνοία no contexto de Sabedoria
  choice: providência
  alternative: previsão
  rationale: “Providência” conserva o sentido teológico do cuidado e governo ordenador de Deus; “previsão” seria mais estreito e poderia sugerir apenas conhecimento antecipado.
- issue: Forma masculina substantivada de ἄνομοι
  choice: homens sem lei
  alternative: os que não obedeciam à lei
  rationale: A escolha preserva a forma masculina plural do grego e sua caracterização moral, sem neutralização silenciosa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se as imagens concretas de prisão, correntes, tetos e fuga, bem como a tensão irônica entre o confinamento físico e a tentativa de fugir da providência divina.
