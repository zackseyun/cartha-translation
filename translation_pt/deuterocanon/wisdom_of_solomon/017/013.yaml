  text: But expectation, being weaker from within, counts ignorance of the cause that brings the torment as a greater thing.
translation:
  language: pt
  text: Mas a expectativa, sendo mais fraca por dentro, considera maior o desconhecimento da causa que provoca o tormento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “julga pior não conhecer a causa do tormento”. Literalmente, o grego diz que a expectativa “considera maior o desconhecimento da causa que provoca o tormento”.'
