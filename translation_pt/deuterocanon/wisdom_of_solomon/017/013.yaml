lexical_decisions:
- source_word: ἔνδοθεν
  choice: por dentro
  rationale: Expressa a origem ou condição interior da fraqueza e preserva a imagem do grego em linguagem portuguesa natural.
- source_word: ἥττων
  choice: mais fraca
  rationale: Mantém o valor comparativo do adjetivo e se ajusta ao estado psicológico descrito no contexto.
- source_word: προσδοκία
  choice: expectativa
  rationale: Preserva a amplitude do termo grego, sem defini-lo especificamente como esperança, antecipação ou apreensão temerosa.
- source_word: πλείονα λογίζεται
  choice: considera maior
  rationale: Reproduz de perto a construção comparativa grega, segundo a qual a expectativa atribui maior peso ao desconhecimento.
- source_word: ἄγνοιαν
  choice: desconhecimento
  rationale: Comunica falta de conhecimento sem a possível conotação depreciativa de 'ignorância'; o complemento seguinte esclarece o que não é conhecido.
- source_word: τῆς παρεχούσης τὴν βάσανον αἰτίας
  choice: da causa que provoca o tormento
  rationale: Preserva a relação causal do particípio com αἰτίας e traduz βάσανον com a intensidade adequada, sem restringi-lo necessariamente a tortura física.
