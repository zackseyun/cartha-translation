base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/007.yaml
  text: And the tricks of magical art were laid low, and the boast of wisdom was disgracefully exposed.
translation:
  language: pt
  text: Os artifícios da arte mágica foram derrubados, e a ostentação de sabedoria foi humilhantemente refutada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμπαίγματα
  choice: artifícios
  rationale: No contexto de μαγικῆς... τέχνης, refere-se aos truques ou expedientes enganosos da prática mágica; “artifícios” preserva o tom depreciativo sem soar coloquial.
- source_word: κατέκειτο
  choice: foram derrubados
  rationale: O verbo descreve algo posto por terra ou prostrado; a formulação comunica a derrota pública dos recursos mágicos.
- source_word: φρόνησις
  choice: sabedoria
  rationale: Neste contexto, designa a alegada sabedoria ou inteligência prática da qual os magos se vangloriavam; “sabedoria” conserva a amplitude do termo grego.
- source_word: ἀλαζονία
  choice: pretensão
  rationale: Expressa arrogância, ostentação ou reivindicação presunçosa; “pretensão de sabedoria” é natural em português e mantém a censura do original.
- source_word: ἔλεγχος ἐφύβριστος
  choice: foi vergonhosamente desmascarada
  rationale: ἔλεγχος indica refutação ou exposição comprobatória, enquanto ἐφύβριστος intensifica o caráter humilhante e afrontoso; a combinação reproduz o resultado público e desonroso.
theological_decisions:
- issue: Valor de φρόνησις
  choice: sabedoria
  alternative: entendimento / prudência
  rationale: O verso não contrasta categorias técnicas de sabedoria, mas denuncia a vanglória na suposta capacidade dos magos. “Sabedoria” preserva a formulação ampla sem impor distinção teológica.
- issue: Agente da exposição
  choice: construção passiva sem agente expresso
  alternative: Deus desmascarou
  rationale: O grego não nomeia explicitamente o agente neste verso; a tradução conserva essa abertura em vez de inserir uma identificação teológica implícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo entre a queda dos artifícios mágicos e o desmascaramento da arrogância intelectual foi preservado.
