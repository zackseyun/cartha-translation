lexical_decisions:
- source_word: φθειρόμενον
  choice: destruído
  rationale: No contexto físico da ação do fogo, o particípio indica perecer ou ser arruinado materialmente; “destruído” preserva a amplitude do termo sem sugerir corrupção moral.
- source_word: ἁπλῶς
  choice: simplesmente
  rationale: O advérbio é mantido de forma natural junto a “se derretia”, sem tornar excessivamente explícita uma ligação sintática que o grego permite ler com alguma flexibilidade.
- source_word: βραχείας
  choice: breve
  rationale: Com “raio de sol”, comunica exposição curta ou mínima e conserva o contraste enfático com o fogo.
- source_word: ἀκτῖνος ἡλίου
  choice: raio de sol
  rationale: Expressão corrente em português que preserva com clareza a imagem do grego.
- source_word: θερμαινόμενον
  choice: ao ser aquecido
  rationale: Reproduz o particípio passivo e deixa claro que o calor do raio solar precede o derretimento.
- source_word: ἐτήκετο
  choice: se derretia
  rationale: O imperfeito descreve o processo físico em curso; a construção pronominal é idiomática em português.
- source_word: τὸ ... μὴ φθειρόμενον
  choice: aquilo que não era destruído
  rationale: A oração com “aquilo que” representa naturalmente o particípio substantivado neutro sem introduzir um referente nominal ausente do grego.
