  text: For what was not destroyed by fire simply melted when warmed by a brief ray of the sun,[a]
translation:
  language: pt
  text: Pois aquilo que não era destruído pelo fogo derretia-se quando era simplesmente aquecido por um breve raio de sol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “consumido” em vez de “destruído”; o grego pode indicar algo que perece sob a ação do fogo.
