- from: Pois, fosse alguém agricultor, pastor ou trabalhador em tarefas no deserto, uma vez apanhado, permanecia sob uma imposição da qual era difícil escapar.[a]
  to: Pois, se alguém era agricultor, pastor ou trabalhador em árduas tarefas no deserto, ao ser apanhado[a], permanecia sob a necessidade inescapável.
  rationale: A revisão regulariza a sintaxe condicional para o português atual, torna explícito o caráter laborioso de μόχθων e restitui, com formulação natural, a força de «necessidade inescapável». O marcador foi movido para junto de «apanhado», onde a nota começa, mantendo também a alternativa para ἀνάγκη.
