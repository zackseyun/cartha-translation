base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/017.yaml
  text: For if someone was a farmer, or a shepherd, or a worker at toils in the wilderness, once seized, he remained under the inescapable necessity.
translation:
  language: pt
  text: Pois, se alguém era agricultor, pastor ou trabalhador em árduas tarefas no deserto, ao ser apanhado[a], permanecia sob a necessidade inescapável.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao ser alcançado, permanecia sob uma necessidade inevitável”. O particípio grego pode evocar alguém apanhado ou alcançado de súbito; «necessidade» também pode ter o sentido de coerção inevitável.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τε γὰρ
  choice: Pois, fosse alguém
  rationale: O grego introduz mais um caso possível dentro da explicação. A formulação com subjuntivo preserva o valor condicional e, no contexto enumerativo, comunica naturalmente a ideia de “quer fosse” sem tornar a frase pesada.
- source_word: γεωργὸς
  choice: agricultor
  rationale: Equivalente moderno e claro para quem trabalha a terra, apropriado ao registro digno do texto.
- source_word: ποιμὴν
  choice: pastor
  rationale: É o equivalente comum de ποιμήν no contexto rural; a coordenação com “agricultor” impede confusão relevante com o uso religioso moderno.
- source_word: τῶν κατʼ ἐρημίαν ἐργάτης μόχθων
  choice: trabalhador em tarefas no deserto
  rationale: Preserva ἐργάτης como trabalhador, μόχθων como tarefas árduas implícitas no contexto laboral e κατʼ ἐρημίαν como localização em região deserta, sem inventar uma profissão específica.
- source_word: προλημφθεὶς
  choice: uma vez apanhado
  rationale: Expressa o particípio aoristo passivo como alguém alcançado e retido de súbito pela situação; “apanhado” mantém a imagem sem identificar explicitamente o agente.
- source_word: ἔμενεν
  choice: permanecia sob
  rationale: O imperfeito indica estado continuado. “Permanecia sob” liga de modo natural esse estado à imposição opressiva que se segue.
- source_word: τὴν δυσάλυκτον ... ἀνάγκην
  choice: uma imposição da qual era difícil escapar
  rationale: ἀνάγκη pode indicar necessidade, coerção ou imposição, e δυσάλυκτος significa literalmente algo difícil de desfazer ou evitar. A expressão preserva essa nuance sem transformar o adjetivo automaticamente em um absoluto como “inescapável”.
