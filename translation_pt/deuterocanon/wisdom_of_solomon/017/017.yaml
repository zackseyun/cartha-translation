    text: 'Ou: “ao ser alcançado, permanecia sob uma necessidade inevitável”. O particípio grego pode evocar alguém apanhado ou alcançado de súbito; «necessidade» também pode ter o sentido de coerção inevitável.'
    reason: lexical_alternative
  revision_rationale: A revisão regulariza a sintaxe condicional para o português atual, torna explícito o caráter laborioso de μόχθων e restitui, com formulação natural, a força de «necessidade inescapável». O marcador foi movido para junto de «apanhado», onde a nota começa, mantendo também a alternativa para ἀνάγκη.
