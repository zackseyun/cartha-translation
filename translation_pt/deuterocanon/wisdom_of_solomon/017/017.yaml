review_pass:
  verdict: revise
  source_fidelity: A enumeração de agricultor, pastor e trabalhador em região deserta está substancialmente correta. Contudo, «fosse alguém ... permanecia» é uma construção verbal pouco estável neste contexto, e «uma imposição da qual era difícil escapar» enfraquece a força de δυσάλυκτον ἀνάγκην e troca o artigo definido por um indefinido sem necessidade. A revisão conserva a ambiguidade de προλημφθείς, sem especificar quem ou o que apanha a pessoa.
  naturalness: «Pois, fosse alguém» não é natural no português contemporâneo. «Pois, se alguém era ... ao ser apanhado, permanecia...» é claro, fluente e preserva o valor condicional/genérico da frase. «Trabalhador em árduas tarefas no deserto» comunica o caráter penoso de μόχθων com menos estranheza que «trabalhador em tarefas».
  terminology: «Agricultor» e «pastor» são adequados. «Necessidade inescapável» preserva tanto ἀνάγκη (necessidade/coerção) quanto δυσάλυκτος (difícil de escapar), sem impor interpretação teológica. A nota é ajustada para indicar precisamente as duas ambiguidades lexicais relevantes.
  issues:
  - severity: medium
    issue: 'Construção condicional verbal pouco natural: «Pois, fosse alguém ... permanecia».'
    rationale: O subjuntivo isolado após «pois» soa elíptico e arcaizante; a combinação com o imperfeito do indicativo na oração principal prejudica a legibilidade moderna.
  - severity: medium
    issue: «Uma imposição da qual era difícil escapar» atenua e reformula excessivamente τὴν δυσάλυκτον ἀνάγκην.
    rationale: O grego traz uma necessidade/coerção definida e difícil de evitar. «Imposição» é possível em alguns contextos, mas é menos direto; «era difícil escapar» também atribui a dificuldade a uma formulação relativa mais frouxa do que o adjetivo grego.
  - severity: low
    issue: «Trabalhador em tarefas no deserto» não torna explícito o aspecto penoso de μόχθων.
    rationale: «Árduas tarefas» preserva naturalmente a noção de labores penosos sem sobredefinir a ocupação.
  revised_text: Pois, se alguém era agricultor, pastor ou trabalhador em árduas tarefas no deserto, ao ser apanhado[a], permanecia sob a necessidade inescapável.
  revised_footnotes:
