base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/021.yaml
  text: But upon those alone heavy night was imposed[a], an image of the darkness that was about to receive them[b]; yet they were heavier to themselves than darkness.
translation:
  language: pt
  text: Mas somente sobre eles se estendia uma noite pesada, imagem da escuridão que estava prestes a recebê-los[a]; eles próprios, porém, eram para si mesmos mais pesados do que o era a escuridão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A escuridão que estava prestes a recebê-los parece apontar para um juízo maior, além da praga imediata, mas o texto não especifica sua natureza.
    reason: theological_ambiguity
  - marker: b
    text: 'Ou: “eles eram, para si mesmos, mais opressivos do que a escuridão”. O grego repete aqui a imagem de peso usada em “noite pesada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνοις δὲ ἐκείνοις
  choice: Mas somente sobre eles
  rationale: Mantém a ênfase exclusiva de μόνοις e introduz o contraste expresso por δέ.
- source_word: ἐπέτατο
  choice: se estendia
  rationale: Reproduz a imagem de algo que se estende ou é colocado sobre eles, em formulação natural em português para a noite ou a escuridão.
- source_word: βαρεῖα νύξ
  choice: uma noite pesada
  rationale: Conserva literalmente a imagem do peso em βαρεῖα e prepara o eco deliberado com βαρύτεροι no fim do versículo.
- source_word: εἰκὼν
  choice: imagem
  rationale: Equivalente direto e natural que preserva a relação figurativa entre a noite presente e a escuridão futura.
- source_word: τοῦ μέλλοντος αὐτοὺς διαδέχεσθαι σκότους
  choice: da escuridão que estava prestes a recebê-los
  rationale: Preserva a iminência indicada por μέλλοντος e a personificação ambígua de διαδέχεσθαι, sem definir a natureza dessa escuridão.
- source_word: ἑαυτοῖς δὲ ἦσαν βαρύτεροι σκότους
  choice: eles próprios, porém, pesavam mais sobre si mesmos do que a escuridão
  rationale: Reformula naturalmente a construção dativa em português, mantendo tanto o sentido reflexivo quanto a metáfora de peso que retoma βαρεῖα.
theological_decisions:
- issue: Natureza da escuridão futura
  choice: Manter a alusão aberta a uma escuridão vindoura que recebe os ímpios
  alternative: Defini-la explicitamente como condenação após a morte ou apenas como terror psicológico
  rationale: O texto apresenta a noite presente como imagem de uma escuridão futura, mas não esclarece se o referente é histórico, escatológico ou pós-morte.
- issue: Sentido de serem mais pesados para si mesmos
  choice: Preservar a afirmação de que eles próprios pesavam sobre si mais do que a escuridão
  alternative: Explicitar culpa, medo ou tormento interior
  rationale: A formulação grega sugere opressão interior, mas não identifica sua causa; a tradução conserva essa tensão sem acrescentar uma explicação psicológica ou doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A repetição de “pesada/pesavam” conserva o jogo lexical do grego sem tornar a frase excessivamente literal.
