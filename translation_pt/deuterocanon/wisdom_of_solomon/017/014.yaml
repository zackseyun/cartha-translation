base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/014.yaml
  text: But they[a], while sleeping the same sleep, with the truly powerless night having come upon them from the depths of powerless Hades,
translation:
  language: pt
  text: Eles, porém, dormindo o mesmo sono, quando a noite verdadeiramente impotente, vinda das profundezas do Hades impotente, lhes sobreveio,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “a noite verdadeiramente irresistível [...] das profundezas do Hades irresistível”. O grego repete a mesma raiz nas duas expressões. O sentido exato é difícil: literalmente, ela pode indicar falta de poder; no contexto, pode sugerir algo a que ninguém tem poder para resistir.'
    reason: Registra uma ambiguidade lexical genuína e explica a repetição retórica do original.
lexical_decisions:
- source_word: ἀδύνατον … ἀδυνάτου
  choice: impotente … impotente
  rationale: Preserva a repetição intencional da mesma raiz grega. Embora “impotente” seja incomum nesse contexto, mantém o sentido básico de falta de poder sem decidir silenciosamente se a ideia contextual é a incapacidade da noite ou a incapacidade humana de resistir a ela.
- source_word: ὄντως
  choice: verdadeiramente
  rationale: Mantém a ênfase do advérbio grego em registro digno e corrente.
- source_word: νύκτα
  choice: noite
  rationale: Equivalente direto e natural; aqui funciona como expressão temporal ligada ao sono.
- source_word: ᾅδου
  choice: Hades
  rationale: Translitera o termo grego e preserva o universo conceitual do texto, sem introduzir as associações doutrinárias posteriores que “inferno” poderia sugerir.
- source_word: μυχῶν
  choice: profundezas
  rationale: Comunica os recessos interiores e ocultos indicados pelo substantivo grego, preservando a imagem ameaçadora.
- source_word: ἐπελθοῦσαν
  choice: que lhes sobreveio
  rationale: Expressa de modo natural a ideia de a noite vir sobre eles. O pronome explicita em português o referente humano implícito no contexto.
- source_word: τὸν αὐτὸν ὕπνον
  choice: o mesmo sono
  rationale: Reprodução direta da expressão grega, indicando o estado de sono compartilhado.
- source_word: κοιμώμενοι
  choice: enquanto dormiam
  rationale: Conserva o valor circunstancial do particípio presente e também a continuidade sintática com o versículo seguinte.
theological_decisions:
- issue: Tradução de ᾅδου no contexto grego deuterocanônico
  choice: Hades
  alternative: mundo dos mortos; inferno; Sheol
  rationale: “Hades” representa diretamente ᾅδης e evita identificar o termo, sem apoio explícito do texto, com uma formulação posterior sobre o destino final dos ímpios.
- issue: Sentido da repetição de ἀδύνατος
  choice: impotente
  alternative: irresistível; inescapável
  rationale: A escolha conserva o sentido lexical básico e a repetição retórica, enquanto a nota registra a possível força contextual de algo a que não se pode resistir.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção termina em vírgula porque o grego apresenta uma oração participial que prossegue no versículo seguinte; a tradução evita transformar artificialmente o versículo em uma frase independente.
