base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/018.yaml
  text: For all were bound with one chain of darkness—whether it was the whistling of wind[a], or the pleasant sound of birds among the leafy branches, or the rushing force of flowing water,
translation:
  language: pt
  text: Pois todos foram presos por uma só corrente de escuridão — fosse o assobio do vento[a], o som melodioso das aves entre os ramos frondosos, ou o ritmo impetuoso das águas que corriam,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um espírito sibilante”. A palavra grega pode significar “vento” ou “espírito”; neste contexto, “vento” combina melhor com a sequência de sons naturais.
    reason: lexical_alternative
lexical_decisions:
- source_word: μιᾷ ... ἁλύσει σκότους
  choice: por uma só corrente de escuridão
  rationale: O dativo tem valor instrumental com o passivo ἐδέθησαν. “Corrente de escuridão” conserva a metáfora concreta do aprisionamento.
- source_word: πάντες ἐδέθησαν
  choice: todos foram presos
  rationale: Mantém a voz passiva e a imagem de confinamento; em português corrente, “presos por uma corrente” soa mais natural do que “atados” neste contexto.
- source_word: εἴ τε ... ἢ ... ἢ
  choice: fosse ... ou ... ou
  rationale: Reproduz de modo natural a série de sons possíveis introduzida pela construção grega.
- source_word: πνεῦμα συρίζον
  choice: o assobio do vento
  rationale: No catálogo de sons naturais, πνεῦμα provavelmente significa “vento”; συρίζον destaca o som sibilante ou assobiado.
- source_word: περὶ ἀμφιλαφεῖς κλάδους
  choice: entre os ramos frondosos
  rationale: ἀμφιλαφεῖς sugere ramos densos, amplos ou abundantes em folhagem; “frondosos” comunica essa imagem com concisão.
- source_word: ὀρνέων ἦχος εὐμελής
  choice: o som melodioso das aves
  rationale: εὐμελής significa melodioso ou harmonioso. “Som” evita explicitar “canto” além do substantivo grego ἦχος.
- source_word: ῥυθμὸς ὕδατος πορευομένου βίᾳ
  choice: o ritmo impetuoso das águas que corriam
  rationale: Conserva ῥυθμός como “ritmo” e expressa por “impetuoso” a força indicada por βίᾳ; o plural coletivo “águas” é natural no registro bíblico português.
theological_decisions:
- issue: Sentido de πνεῦμα no catálogo de fenômenos noturnos
  choice: vento
  alternative: espírito
  rationale: Os elementos seguintes são sons de aves e de água; por isso, “vento” se ajusta melhor ao contexto imediato sem introduzir desnecessariamente um agente sobrenatural. A alternativa lexical é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. O travessão mantém a abertura da enumeração, e a vírgula final sinaliza que a frase prossegue no versículo seguinte.
