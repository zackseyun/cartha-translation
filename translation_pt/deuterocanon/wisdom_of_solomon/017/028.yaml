  text: so that it might be known that one must rise before the sun to give thanks to you[b][a], and at the dawning of the light make petition to you.
translation:
  language: pt
  text: para que se soubesse que é preciso levantar-se antes de o sol nascer para te dar graças[a] e, ao despontar da luz, apresentar-te súplicas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “preceder o sol em ação de graças a ti”. O grego diz literalmente: “preceder o sol para ação de graças a ti”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “orar a ti ao romper do dia”. A expressão grega diz literalmente: “ao surgir da luz, dirigir-se a ti com súplicas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως γνωστὸν ἦν
  choice: para que se soubesse
  rationale: A construção de finalidade pede uma formulação que expresse o reconhecimento pretendido; a forma impessoal é natural em português e não acrescenta um sujeito.
- source_word: δεῖ
  choice: é preciso
  rationale: Comunica necessidade ou obrigação sem transformar o enunciado em mandamento mais explícito do que o grego.
- source_word: φθάνειν τὸν ἥλιον
  choice: levantar-se antes do sol
  rationale: φθάνω com acusativo indica chegar antes ou preceder. No contexto matinal, esta formulação comunica com clareza o sentido temporal, embora a imagem literal seja preservada em nota.
- source_word: ἐπʼ εὐχαριστίαν σου
  choice: para te dar graças
  rationale: Explicita naturalmente em português a expressão elíptica que indica ação de graças dirigida a Deus.
- source_word: πρὸς ἀνατολὴν φωτός
  choice: ao despontar da luz
  rationale: Preserva a imagem do surgimento da luz e funciona como expressão temporal idiomática.
- source_word: ἐντυγχάνειν σοι
  choice: dirigir-te súplicas
  rationale: No contexto religioso, o verbo denota dirigir-se a alguém com um pedido. A escolha mantém a ideia de súplica sem reduzi-la ao sentido amplo de oração.
theological_decisions:
- issue: Força normativa da prática devocional matinal
  choice: A necessidade de agradecer a Deus antes do sol e suplicar ao despontar da luz é mantida em formulação geral.
  alternative: Entender a frase apenas como uma lição limitada aos acontecimentos narrados, ou como instituição explícita de horários universais de oração.
  rationale: O grego usa δεῖ, que expressa necessidade, mas não institui por si só uma doutrina formal de horas obrigatórias de oração. A tradução conserva a força devocional e a tensão contextual sem ampliá-la.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com colocação pronominal natural para leitura brasileira. A imagem poética do amanhecer foi preservada; notas registram as alternativas mais literais. Os marcadores seguem a ordem de ocorrência no texto.
