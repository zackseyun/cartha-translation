base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/006.yaml
  text: Only a self-kindled fire[a], full of fear, appeared to them; and, being terrified by that unseen appearance[b], they considered the things they saw to be worse.
translation:
  language: pt
  text: Somente um fogo aceso por si mesmo[a], cheio de temor, lhes aparecia; e, aterrorizados por aquela visão não vista[b], consideravam piores as coisas que viam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um fogo espontâneo» ou «um fogo que se acendeu sozinho».
    reason: lexical_alternative
  - marker: b
    text: O grego diz literalmente «aquela visão não vista», expressão deliberadamente paradoxal.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφαίνετο
  choice: aparecia diante deles
  rationale: O imperfeito indica algo que se tornava ou permanecia perceptível; a formulação é natural em português e conserva a manifestação inquietante.
- source_word: μόνον
  choice: somente
  rationale: 'Mantém a força restritiva e enfática: nada lhes aparecia senão aquele fogo.'
- source_word: αὐτομάτη πυρά
  choice: um fogo aceso por si mesmo
  rationale: αὐτομάτη descreve algo que acontece por si só. A tradução conserva tanto o sentido literal quanto o caráter insólito da cena.
- source_word: φόβου πλήρης
  choice: cheio de temor
  rationale: Reproduz de perto a expressão grega sem decidir se o fogo estava caracterizado pelo temor ou se o provocava.
- source_word: ἐκδειματούμενοι
  choice: aterrorizados
  rationale: O particípio expressa medo intenso; a escolha é forte, clara e idiomática.
- source_word: τῆς μὴ θεωρουμένης ἐκείνης ὄψεως
  choice: por aquela visão que não era vista
  rationale: Preserva deliberadamente o paradoxo do grego entre uma visão ou aparição e o fato de ela não ser vista.
- source_word: ἡγοῦντο
  choice: julgavam
  rationale: Expressa a ideia de avaliar ou considerar, adequada ao juízo comparativo que segue.
- source_word: χείρω τὰ βλεπόμενα
  choice: julgavam pior o que viam
  rationale: Conserva o comparativo χείρω e o contraste entre aquilo que era visto e a visão não vista.
theological_decisions:
- issue: Se o paradoxo de uma visão não vista deve ser explicado ou suavizado
  choice: Manter no texto principal “aquela visão que não era vista”
  alternative: “aquela aparição invisível” ou “aquilo que não conseguiam ver”
  rationale: A formulação paradoxal faz parte do retrato do terror psicológico e deve permanecer sem uma explicação importada.
- issue: Como traduzir αὐτομάτη no contexto extraordinário
  choice: “aceso por si mesmo”
  alternative: “espontâneo” ou “que se acendeu sozinho”
  rationale: A escolha comunica a origem autônoma e misteriosa do fogo sem afirmar além do que o grego diz.
- issue: Como entender “cheio de temor”
  choice: Preservar a formulação aberta
  alternative: “aterrador” ou “que inspirava terror”
  rationale: O grego permite a noção de algo caracterizado pelo medo ou produtor de medo; a tradução não resolve essa tensão indevidamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi levemente reorganizada em duas frases para clareza, sem eliminar os contrastes nem as ambiguidades do grego.
