base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/029.yaml
  text: For the hope of the ungrateful will melt like wintry frost[b][a], and will run off like useless water.
translation:
  language: pt
  text: Pois a esperança do ingrato[a] se derreterá como a geada de inverno e escorrerá como água sem serventia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da pessoa sem gratidão”. O termo grego destaca a falta de gratidão.
    reason: lexical_alternative
  - marker: b
    text: A imagem pode sugerir água que escorre, não permanece disponível e, por isso, não tem utilidade.
    reason: cultural_note
lexical_decisions:
- source_word: ἀχαρίστου
  choice: do ingrato
  rationale: O adjetivo substantivado no genitivo caracteriza a pessoa pela falta de gratidão. “Ingrato” é claro, atual e preserva o sentido moral direto do grego.
- source_word: ἐλπὶς
  choice: esperança
  rationale: É o equivalente normal neste contexto poético e moral, sem reduzir o termo a mera expectativa.
- source_word: χειμέριος πάχνη
  choice: geada de inverno
  rationale: Reproduz de modo natural a imagem concreta de πάχνη associada ao inverno, evitando uma formulação artificial.
- source_word: τακήσεται
  choice: se derreterá
  rationale: Expressa diretamente o desaparecimento da geada pelo derretimento e preserva a forma futura.
- source_word: ῥυήσεται
  choice: escorrerá
  rationale: Comunica o movimento da água que flui e se perde, com naturalidade em português.
- source_word: ὕδωρ ἄχρηστον
  choice: água sem serventia
  rationale: Preserva a ideia de água inútil ou imprestável em uma formulação idiomática e digna.
theological_decisions:
- issue: Caracterização moral de ἀχαρίστου
  choice: do ingrato
  alternative: do ímpio
  rationale: O grego designa diretamente a falta de gratidão, não a categoria mais ampla de impiedade. A tradução evita acrescentar uma qualificação teológica ausente do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção mantém o paralelismo poético, as duas formas futuras e a imagem concreta do derretimento e escoamento.
