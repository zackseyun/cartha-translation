  text: For the whole world was illuminated with bright light and was occupied with unhindered works;[a]
translation:
  language: pt
  text: Pois o mundo inteiro era iluminado por uma luz brilhante e se ocupava de atividades sem impedimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estava entregue a trabalhos sem obstáculos”. A expressão grega provavelmente indica que, fora da escuridão da praga, as atividades normais continuavam por toda parte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλος ... ὁ κόσμος
  choice: o mundo inteiro
  rationale: Expressa naturalmente a totalidade do mundo em contraste com a região atingida pela escuridão.
- source_word: λαμπρῷ ... φωτί
  choice: por uma luz brilhante
  rationale: O dativo tem valor instrumental; a formulação preserva a combinação de adjetivo e substantivo sem soar rebuscada.
- source_word: κατελάμπετο
  choice: era iluminado
  rationale: O imperfeito indica iluminação contínua, e a forma passiva preserva a relação do mundo com a luz.
- source_word: ἀνεμποδίστοις
  choice: sem impedimento
  rationale: Comunica de modo claro que as atividades prosseguiam sem obstrução.
- source_word: συνείχετο ἔργοις
  choice: se ocupava de atividades
  rationale: Neste contexto, συνείχετο descreve o mundo entregue ou ocupado em suas ações; 'atividades' transmite o sentido amplo de ἔργοις em português corrente.
theological_decisions:
- issue: Alcance de κόσμος no contraste com a praga de escuridão
  choice: o mundo inteiro
  alternative: todo o universo; toda a criação
  rationale: A expressão mantém o contraste literário entre a luz e a atividade geral fora da região afligida, sem impor uma afirmação cosmológica mais ampla.
- issue: Sentido de συνείχετο ἔργοις
  choice: se ocupava de atividades
  alternative: era mantido por obras; estava entregue a trabalhos
  rationale: A leitura contextual mais provável é que as atividades normais continuavam livremente, em contraste com a imobilidade causada pela escuridão; a nota preserva uma formulação alternativa mais formal.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A formulação evita literalismo obscuro em συνείχετο ἔργοις, mantendo a alternativa em nota.
