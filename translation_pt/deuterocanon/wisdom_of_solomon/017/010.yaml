base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/010.yaml
  text: They were being destroyed[a], trembling and refusing even to look at the air, though there was nowhere to flee from it.
translation:
  language: pt
  text: Iam perecendo[a], trêmulos, e se recusavam até mesmo a olhar para o ar, do qual não havia como fugir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: estavam sendo destruídos.'
    reason: Alternativa lexical decorrente do possível valor passivo de διώλλυντο.
lexical_decisions:
- source_word: διώλλυντο
  choice: iam perecendo
  rationale: O imperfeito médio/passivo expressa um processo contínuo de perecimento ou destruição. “Iam perecendo” comunica esse aspecto sem indicar um agente que o grego deixa implícito.
- source_word: ἔντρομοι
  choice: trêmulos
  rationale: Preserva a imagem corporal vívida de pessoas tomadas pelo terror, em vez de reduzi-la a uma descrição meramente psicológica.
- source_word: μηδαμόθεν φευκτόν
  choice: do qual não havia como fugir
  rationale: O adjetivo verbal, qualificado por μηδαμόθεν, apresenta o ar como algo de que não se podia escapar por parte alguma. A formulação portuguesa torna inteligível o idioma grego e mantém a ligação com “o ar”.
- source_word: ἀέρα
  choice: o ar
  rationale: É o sentido comum e concreto do substantivo neste contexto; “atmosfera” seria técnico demais e “brisa”, específico demais.
- source_word: προσιδεῖν
  choice: olhar para
  rationale: Expressa de maneira simples e atual o ato de dirigir o olhar para algo, sem a interpretação adicional sugerida por “enfrentar”.
- source_word: ἀρνούμενοι
  choice: se recusavam até mesmo
  rationale: 'O particípio indica recusa contínua, simultânea ao perecimento. “Até mesmo” explicita em português a intensidade da ideia: recusavam-se a olhar para algo tão inevitavelmente presente quanto o ar.'
theological_decisions:
- issue: Natureza do perecimento descrito
  choice: Um processo contínuo de perecimento sob juízo, sem identificar no texto o agente direto
  alternative: Estavam sendo destruídos por um agente implícito; ou sofriam apenas um colapso psicológico
  rationale: A forma grega admite valor médio ou passivo e não nomeia o agente nesta oração. “Iam perecendo” preserva a gravidade e a continuidade da situação sem explicitar uma agência que o versículo deixa em aberto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Trêmulos” conserva a imagem concreta do grego; a oração final mantém a formulação deliberadamente marcante de não ser possível fugir do próprio ar.
