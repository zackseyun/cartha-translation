base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/005.yaml
  text: And no force of fire prevailed to give light[a], nor did the brilliant flames of the stars endure to illumine that dreadful night.
translation:
  language: pt
  text: Nenhuma força do fogo conseguia produzir luz, nem as chamas resplandecentes das estrelas conseguiam iluminar aquela noite medonha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “noite sombria” ou “noite odiosa”. O adjetivo grego transmite uma forte ideia de algo horrível, repulsivo ou temível.
    reason: Alternativas lexicais para στυγνήν e esclarecimento de sua forte carga afetiva.
lexical_decisions:
- source_word: πυρὸς ... βία
  choice: força do fogo
  rationale: Preserva a relação genitiva e a ideia da potência ativa do fogo, sem introduzir o sentido moral de violência.
- source_word: κατίσχυεν φωτίζειν
  choice: conseguia produzir luz
  rationale: Expressa a tentativa contínua e malsucedida indicada pelo imperfeito, em português natural.
- source_word: ἄστρων
  choice: dos astros
  rationale: “Astros” abrange naturalmente os corpos celestes luminosos e se ajusta ao registro poético do versículo; no contexto, refere-se sobretudo às estrelas.
- source_word: ἔκλαμπροι φλόγες
  choice: chamas resplandecentes
  rationale: Mantém tanto a luminosidade intensa do adjetivo quanto a imagem poética das chamas.
- source_word: ὑπέμενον ... καταυγάζειν
  choice: conseguiam iluminar
  rationale: Comunica de modo natural a incapacidade das luzes celestes de resistir ou persistir em sua ação iluminadora; uma tradução estritamente literal com “suportavam” seria pouco idiomática em português.
- source_word: στυγνὴν
  choice: medonha
  rationale: Transmite a forte carga afetiva de algo horrível, repulsivo ou temível, sem reduzir o termo apenas à falta de luz.
- source_word: νύκτα
  choice: noite
  rationale: Correspondência direta e natural.
theological_decisions:
- issue: Descrição poético-cósmica da escuridão no contexto da praga
  choice: Manter a imagem extraordinária em que nem o fogo nem a luz dos astros conseguem iluminar a noite.
  alternative: Reduzir a passagem a uma descrição de escuridão comum ou interpretá-la exclusivamente como terror psicológico.
  rationale: O grego apresenta de modo concreto e poético a impotência tanto do fogo quanto das luzes celestes. A tradução preserva essa tensão sem impor uma explicação física ou doutrinária.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência poética moderada. “Produzir luz” evita repetição imediata de “iluminar”, enquanto “medonha” conserva a intensidade incomum do adjetivo grego.
