base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/015.yaml
  text: Some were driven by terrifying apparitions[a], and others were paralyzed by the betrayal of their soul[b]; for sudden and unexpected fear came upon them.
translation:
  language: pt
  text: Uns eram impelidos por aparições aterradoras[a], enquanto outros ficavam paralisados pela traição da própria alma[b], pois um medo repentino e inesperado caiu sobre eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espectros” ou “visões”. O grego se refere a manifestações assustadoras, talvez espectrais ou ilusórias.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “pela traição da alma”. A expressão pode indicar um colapso interior, como se o próprio íntimo da pessoa se voltasse contra ela.
    reason: alternative_reading
lexical_decisions:
- source_word: τέρασιν ... φαντασμάτων
  choice: aparições aterradoras
  rationale: A expressão descreve manifestações de aspecto prodigioso e amedrontador. “Aparições aterradoras” soa natural em português e preserva seu caráter inquietante sem afirmar que fossem necessariamente fantasmas reais.
- source_word: ἠλαύνοντο
  choice: eram perseguidos
  rationale: O passivo imperfeito pode indicar que eram impelidos, acossados ou perseguidos. No contexto das aparições ameaçadoras, “eram perseguidos” comunica claramente a pressão contínua exercida sobre eles.
- source_word: παρελύοντο
  choice: ficavam paralisados
  rationale: O verbo pode significar afrouxar, incapacitar ou paralisar. A formulação expressa tanto a perda interior de forças quanto sua consequência incapacitante.
- source_word: προδοσίᾳ τῆς ψυχῆς
  choice: pela traição da própria alma
  rationale: Mantém a metáfora incomum e comprimida do grego, na qual a vida interior parece voltar-se contra a pessoa, sem reduzi-la a uma explicação psicológica específica.
- source_word: αἰφνίδιος ... καὶ ἀπροσδόκητος φόβος
  choice: um medo repentino e inesperado
  rationale: Preserva os dois qualificativos coordenados, que enfatizam tanto a rapidez quanto o caráter imprevisto do medo.
- source_word: ἐπῆλθεν
  choice: caiu sobre eles
  rationale: Expressão portuguesa idiomática para algo que sobrevém e domina alguém, adequada à força súbita do medo no contexto.
theological_decisions:
- issue: Sentido da expressão difícil τὰ δὲ τῆς ψυχῆς παρελύοντο προδοσίᾳ
  choice: outros ficavam paralisados pela traição da própria alma
  alternative: outros ficavam paralisados por uma traição interior; outros ficavam paralisados porque a alma os abandonava
  rationale: O grego é metafórico e admite mais de uma compreensão da relação entre “traição” e “alma”. A tradução conserva essa tensão, sugerindo um colapso vindo do íntimo sem identificar a alma com consciência, coragem ou outra faculdade específica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção fluente no Brasil. “Própria alma” torna natural a relação reflexiva sugerida pelo contexto sem eliminar a ambiguidade da metáfora grega.
