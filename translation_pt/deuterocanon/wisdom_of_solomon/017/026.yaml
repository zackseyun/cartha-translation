base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/026.yaml
  text: so that your children[a], whom you loved, might learn, O Lord, that it is not the produce of crops that nourishes man[c][b], but your word preserves those who trust in you.
translation:
  language: pt
  text: para que os teus filhos[a], a quem amaste, aprendessem, ó Senhor, que não é o que os campos produzem[b] que alimenta o ser humano[c], mas a tua palavra preserva os que confiam em ti[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego usa o masculino plural «filhos»; no contexto, a expressão pode referir-se coletivamente ao povo de Deus.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «as produções dos frutos»; a expressão grega se refere ao produto ou rendimento agrícola.
    reason: lexical_alternative
  - marker: c
    text: 'O termo grego está no singular e tem sentido representativo: refere-se aos seres humanos em geral.'
    reason: lexical_alternative
  - marker: d
    text: Ou «os que creem em ti» ou «os que acreditam em ti».
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα μάθωσιν
  choice: para que ... aprendessem
  rationale: A construção com ἵνα e o subjuntivo expressa finalidade; o imperfeito do subjuntivo é natural em português após o passado «amaste».
- source_word: οἱ υἱοί σου
  choice: os teus filhos
  rationale: Mantém o substantivo masculino plural do grego e, no contexto, pode designar coletivamente os membros do povo de Deus.
- source_word: οὓς ἠγάπησας
  choice: a quem amaste
  rationale: Reproduz de modo direto o aoristo e conserva o sentido básico de ἀγαπάω.
- source_word: Κύριε
  choice: ó Senhor
  rationale: Marca explicitamente o vocativo em linguagem portuguesa digna e corrente.
- source_word: οὐχ αἱ γενέσεις τῶν καρπῶν
  choice: não é o que os campos produzem
  rationale: Neste contexto, γενέσεις indica produtos, produção ou rendimento, e καρποί se refere aos frutos agrícolas. A formulação evita o literalismo enganoso «gerações dos frutos».
- source_word: τρέφουσιν ἄνθρωπον
  choice: alimenta o ser humano
  rationale: τρέφω significa alimentar ou nutrir; ἄνθρωπος tem aqui força genérica, abrangendo a humanidade.
- source_word: ἀλλὰ τὸ ῥῆμά σου
  choice: mas a tua palavra
  rationale: ῥῆμα designa palavra ou declaração proferida; «palavra» preserva a alusão ao sustento concedido por Deus.
- source_word: τοὺς σοὶ πιστεύοντας
  choice: os que confiam em ti
  rationale: πιστεύω com o dativo pessoal σοὶ pode expressar confiança depositada em alguém; a tradução comunica essa dependência pessoal.
- source_word: διατηρεῖ
  choice: preserva
  rationale: διατηρέω significa conservar, guardar ou manter; «preserva» mantém o contraste entre o alimento material e a ação sustentadora da palavra divina.
theological_decisions:
- issue: Alcance representativo de ἄνθρωπον
  choice: o ser humano
  alternative: o homem
  rationale: O singular grego é genérico. «O ser humano» comunica esse alcance universal em português atual sem restringir indevidamente a referência ao sexo masculino.
- issue: Sentido relacional de πιστεύοντας
  choice: os que confiam em ti
  alternative: os que creem em ti / os que acreditam em ti
  rationale: O dativo pessoal e o contexto de preservação favorecem a ideia de confiança e dependência, sem excluir a dimensão de fé.
- issue: Agente da preservação
  choice: a tua palavra preserva
  alternative: a tua palavra mantém vivos
  rationale: A tradução conserva a afirmação de que a palavra de Deus, e não a produção agrícola em si, é o agente decisivo do sustento, sem ampliar διατηρεῖ para uma interpretação exclusivamente física.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega «teus» em concordância com o tratamento reverente tradicional dirigido a Deus; evita tanto arcaísmos desnecessários quanto formulações excessivamente coloquiais.
