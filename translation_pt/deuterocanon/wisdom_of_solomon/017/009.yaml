  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/009.yaml
  text: For even if nothing terrifying frightened them[a], they were panic-stricken by the passing by of wild animals and the hissing of snakes,
translation:
  language: pt
  text: Pois, mesmo que nada assustador os amedrontasse, eram tomados de pânico com a passagem de animais selvagens e com o sibilar de serpentes[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «répteis»; o termo grego pode ter sentido mais amplo, mas a referência ao sibilar torna «serpentes» mais provável aqui.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Pois, mesmo
  rationale: «Pois» expressa a função explicativa de γάρ, enquanto «mesmo» transmite a ênfase associada à construção concessiva iniciada por εἰ.
- source_word: εἰ μηδὲν αὐτοὺς ταραχῶδες ἐφόβει
  choice: quando nada assustador os amedrontava
  rationale: No contexto, εἰ tem valor concessivo próximo de «mesmo quando». «Nada assustador» preserva o adjetivo substantivado ταραχῶδες, e «amedrontava» mantém explícito o vocabulário do medo em ἐφόβει.
- source_word: κνωδάλων
  choice: animais selvagens
  rationale: κνώδαλον designa feras ou criaturas perigosas; «animais selvagens» é claro, atual e conserva o caráter ameaçador.
- source_word: παρόδοις
  choice: com a passagem de
  rationale: O dativo plural indica a ocasião ou causa do pânico. «Com a passagem de» reproduz o sentido sem sugerir necessariamente ataque ou aproximação.
- source_word: ἑρπετῶν
  choice: serpentes
  rationale: Embora ἑρπετόν possa designar mais amplamente répteis ou seres rastejantes, sua associação com συριγμοῖς favorece serpentes neste contexto.
- source_word: συριγμοῖς
  choice: com o sibilar de
  rationale: O substantivo denota um som sibilante ou assobio. «Sibilar» é natural em referência a serpentes e preserva a imagem sonora.
- source_word: ἐκσεσοβημένοι
  choice: eles entravam em pânico
  rationale: O particípio perfeito passivo descreve pessoas lançadas em forte agitação ou terror. «Entravam em pânico» comunica essa intensidade em português corrente.
