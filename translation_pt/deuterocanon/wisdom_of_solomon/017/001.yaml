lexical_decisions:
- source_word: Μεγάλαι
  choice: grandes
  rationale: Conserva a amplitude do adjetivo grego e descreve naturalmente a magnitude dos juízos de Deus.
- source_word: κρίσεις
  choice: juízos
  rationale: Mantém o sentido judicial e teológico de decisões ou atos de julgamento, sem o restringir indevidamente.
- source_word: δυσδιήγητοι
  choice: difíceis de descrever
  rationale: Expressa a dificuldade de narrar ou expor plenamente esses juízos, sem afirmar de modo absoluto que sejam indescritíveis.
- source_word: ἀπαίδευτοι
  choice: sem formação
  rationale: Abrange a falta de instrução, educação e disciplina sugerida pelo termo grego; a nota registra alternativas mais específicas.
- source_word: ψυχαὶ
  choice: almas
  rationale: Preserva a formulação antropológica explícita do grego e sua gravidade moral e espiritual.
- source_word: ἐπλανήθησαν
  choice: se desviaram
  rationale: É uma formulação portuguesa natural que comunica o resultado de cair no erro sem decidir se houve necessariamente um agente externo.
- source_word: διὰ τοῦτο
  choice: por isso
  rationale: Indica de modo claro e corrente a consequência extraída da afirmação anterior.
theological_decisions:
- issue: Se ψυχαὶ deve ser traduzido literalmente ou como uma referência idiomática a pessoas
  choice: almas
  alternative: pessoas
  rationale: O grego emprega explicitamente “almas”, expressão compreensível em português e relevante para a dimensão moral e espiritual da passagem.
- issue: Se o passivo ἐπλανήθησαν deve indicar um agente causador
  choice: se desviaram
  alternative: foram desencaminhadas
  rationale: A forma escolhida preserva o fato de terem caído no erro sem introduzir um agente não mencionado; a alternativa passiva permanece possível e é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Sem formação” evita limitar ἀπαίδευτοι à mera falta de informação e mantém sua dimensão educacional e moral; as notas preservam as alternativas lexicais e a ambiguidade da voz verbal.
