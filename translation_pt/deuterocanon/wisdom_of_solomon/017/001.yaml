  - marker: b
    text: Em grego, “almas”; em tradução mais idiomática, “pessoas”.
    reason: lexical_alternative
  - marker: c
    text: Ou “indisciplinadas”, “não instruídas” ou “sem educação”.
    reason: lexical_alternative
