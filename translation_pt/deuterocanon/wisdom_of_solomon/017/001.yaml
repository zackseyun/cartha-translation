  text: Pois grandes são os teus juízos e difíceis de descrever[a]; por isso, almas[b] sem formação[c] se desviaram[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “difíceis de explicar”, “difíceis de relatar” ou “além do que se pode narrar”.
