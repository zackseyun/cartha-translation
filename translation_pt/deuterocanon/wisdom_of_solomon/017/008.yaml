base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/008.yaml
  text: For those who promised to drive away fears and disturbances from a sick soul were themselves sick with a ridiculous fear[a].
translation:
  language: pt
  text: Pois os que prometiam afastar os temores e as perturbações de uma alma enferma estavam eles mesmos enfermos de um medo ridículo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma timidez risível”. O termo grego também pode significar “cautela” e, em outros contextos, até “reverência”; aqui, porém, o contexto favorece um sentido negativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπισχνούμενοι
  choice: prometiam
  rationale: O particípio indica prometer ou assumir o compromisso de fazer algo; “prometiam” é direto e preserva a ideia de alegada capacidade.
- source_word: δείματα
  choice: temores
  rationale: Expressa medos ou coisas que causam medo; “temores” mantém o sentido psicológico amplo e o registro digno.
- source_word: ταραχὰς
  choice: perturbações
  rationale: Designa agitações ou tumultos interiores; “perturbações” conserva essa amplitude sem restringir o termo a uma condição específica.
- source_word: ἀπελαύνειν
  choice: afastar
  rationale: O infinitivo significa expulsar ou fazer ir embora; “afastar” é natural em português e adequado aos objetos abstratos da frase.
- source_word: ψυχῆς νοσούσης
  choice: de uma alma enferma
  rationale: Preserva tanto ψυχή como “alma” quanto a metáfora de doença em νοσούσης, sem reduzir a referência apenas à mente.
- source_word: καταγέλαστον
  choice: ridículo
  rationale: O adjetivo caracteriza algo digno de riso ou escárnio; “ridículo” transmite com concisão sua força depreciativa.
- source_word: εὐλάβειαν
  choice: medo
  rationale: Embora possa significar cautela ou reverência em outros contextos, aqui a associação com temores, perturbações e doença, além de καταγέλαστον, favorece um sentido negativo ligado ao medo.
- source_word: ἐνόσουν
  choice: estavam eles mesmos enfermos de
  rationale: Mantém a repetição retórica da metáfora de enfermidade presente em νοσούσης e enfatiza ironicamente que os pretensos curadores sofriam do mesmo tipo de mal.
theological_decisions:
- issue: Sentido de εὐλάβεια neste contexto negativo
  choice: medo
  alternative: cautela; timidez; reverência
  rationale: “Reverência” introduziria um sentido religioso positivo que entra em tensão com “ridículo”. “Medo” preserva a ironia contextual, enquanto a nota registra a amplitude lexical genuína.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição “alma enferma... enfermos” foi mantida para reproduzir o paralelismo irônico do grego; “eles mesmos” explicita naturalmente a ênfase de οὗτοι.
