base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/017/004.yaml
  text: For not even the inner chamber that held them kept them free from fear[a], but sounds that troubled them rang around them[b], and gloomy apparitions with unsmiling faces appeared.
translation:
  language: pt
  text: Pois nem mesmo o recanto interior que os encerrava os manteve livres do medo; sons que os perturbavam ressoavam ao redor deles[b], e surgiam aparições[a] de rostos sombrios e sem sorriso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fantasmas” ou “espectros”. O termo grego designa manifestações visíveis estranhas ou fantasmagóricas.
    reason: lexical_alternative
  - marker: b
    text: O raro verbo grego sugere ruído repetido ao redor deles ou reverberação envolvente.
    reason: lexical_alternative
lexical_decisions:
- source_word: μυχὸς
  choice: recanto interior
  rationale: Expressa um espaço interno, oculto e fechado, sem sugerir necessariamente um cômodo arquitetônico específico.
- source_word: ὁ κατέχων αὐτούς
  choice: que os encerrava
  rationale: Transmite que o recanto os continha ou cercava, sem acrescentar a ideia mais forte de aprisionamento coercivo.
- source_word: ἀφόβως διεφύλασσεν
  choice: os manteve livres do medo
  rationale: A construção contextual indica que o esconderijo não conseguiu protegê-los do medo; esta formulação evita a leitura inadequada de que o próprio recanto guardava corajosamente.
- source_word: ἦχοι ἐκταράσσοντες αὐτούς
  choice: sons que os perturbavam
  rationale: Preserva tanto a natureza auditiva indeterminada dos ἦχοι quanto a agitação intensa indicada por ἐκταράσσοντες, sem identificar sua origem.
- source_word: ἐτρεκόμπουν
  choice: ressoavam ao redor deles
  rationale: O verbo raro parece indicar ruído repetido ou reverberante que os cercava; 'ressoavam ao redor' comunica essa dimensão sonora e envolvente em português natural.
- source_word: φάσματα
  choice: aparições
  rationale: Mantém o caráter visual, estranho e possivelmente sobrenatural do termo sem afirmar que se tratava especificamente de fantasmas ou seres demoníacos.
- source_word: ἀμειδήτοις κατηφῆ προσώποις
  choice: sombrias, de rostos sem sorriso
  rationale: 'Conserva as duas imagens gregas: a expressão abatida ou lúgubre e a ausência concreta de sorriso.'
- source_word: ἐνεφανίζετο
  choice: apareciam
  rationale: Verbo corrente e direto para aquilo que se torna visível; o plural em português concorda naturalmente com 'aparições'.
theological_decisions:
- issue: Natureza dos fenômenos descritos por φάσματα
  choice: aparições
  alternative: fantasmas; espectros; visões
  rationale: O texto descreve manifestações aterradoras, mas não define sua natureza metafísica. 'Aparições' preserva a ambiguidade entre fenômenos objetivos e experiências visionárias causadas pelo terror.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem da oração final foi levemente ajustada para evitar ambiguidade e preservar as imagens de rostos sombrios e sem sorriso. Os marcadores foram associados aos termos efetivamente explicados pelas notas.
