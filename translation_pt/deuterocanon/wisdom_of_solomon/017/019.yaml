translation:
  language: pt
  text: ou o estrondo brutal de pedras despencando[a], ou a corrida invisível de animais aos saltos[b], ou o som do rugido das feras mais ferozes, ou um eco que voltava das cavidades das montanhas[c] os paralisava de terror.
