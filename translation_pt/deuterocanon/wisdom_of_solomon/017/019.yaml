    reason: lexical_alternative
lexical_decisions:
- source_word: κτύπος ἀπηνὴς
  choice: estrondo brutal
  rationale: κτύπος indica um ruído forte produzido por impacto; ἀπηνής comunica sua qualidade dura e violenta. “Estrondo brutal” preserva a intensidade e é natural no contexto auditivo.
- source_word: καταρριπτομένων πετρῶν
  choice: pedras despencando
  rationale: O particípio expressa movimento descendente e pode ser entendido de modo passivo ou com maior força causativa. “Despencando” mantém a violência da cena sem decidir que algum agente arremessou as pedras.
- source_word: σκιρτώντων ζῴων δρόμος ἀθεώρητος
  choice: a corrida invisível de animais aos saltos
  rationale: δρόμος é “corrida” ou “curso”; ἀθεώρητος indica aquilo que não era visto; σκιρτάω descreve animais saltando ou dando pinotes. A formulação conserva os três elementos.
- source_word: ὠρυομένων ἀπηνεστάτων θηρίων φωνή
  choice: o som do rugido das feras mais ferozes
  rationale: φωνή é aqui a voz ou o som produzido pelos animais; ὠρύομαι designa seu grito forte, e o superlativo ἀπηνεστάτων é preservado por “mais ferozes”.
- source_word: ἀντανακλωμένη ἐκ κοιλότητος ὀρέων ἠχώ
  choice: um eco refletido da concavidade das montanhas
  rationale: ἀντανακλωμένη descreve o som que rebate ou se reflete, enquanto κοιλότης significa cavidade ou concavidade. A tradução mantém a imagem concreta do relevo montanhoso.
- source_word: παρέλυεν αὐτοὺς ἐκφοβοῦντα
  choice: qualquer desses sons os paralisava de terror
  rationale: παρέλυεν comunica incapacitação ou paralisia, e ἐκφοβοῦντα indica que isso se dava pelo medo intenso. “Qualquer desses sons” explicita em português a relação entre os itens alternativos da enumeração e o verbo singular.
