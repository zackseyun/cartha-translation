  text: and another[a], cast down elsewhere, half-dead[b], made known the cause for which he was dying.
translation:
  language: pt
  text: e outro, em outro lugar[a], lançado por terra[b], meio morto, revelava a causa pela qual estava morrendo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em outra parte”. O advérbio grego indica um lugar diferente do caso anterior no contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “atirado” ou “arremessado”. O particípio grego enfatiza que ele foi lançado com força.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλαχῇ
  choice: em outro lugar
  rationale: Expressa com clareza o contraste espacial com o caso anterior no contexto, sem acrescentar uma localização específica.
- source_word: ῥιφεὶς
  choice: lançado por terra
  rationale: Preserva a ideia física de ser lançado ou arremessado, sem identificar um agente nem interpretar o ato apenas como um golpe.
- source_word: ἡμίθνητος
  choice: meio morto
  rationale: Equivalente direto, vívido e natural do adjetivo grego, descrevendo alguém ainda vivo, mas próximo da morte.
- source_word: διʼ ἣν ... αἰτίαν
  choice: a causa pela qual
  rationale: Mantém a referência à causa específica da morte e o tom explicativo da construção grega.
- source_word: ἔθνησκεν
  choice: estava morrendo
  rationale: O imperfeito apresenta a morte como processo em curso, não como fato já consumado.
- source_word: ἐνεφάνιζεν
  choice: revelava
  rationale: Transmite a ação de tornar manifesto ou dar a conhecer; o imperfeito também conserva o caráter simultâneo e progressivo da cena.
theological_decisions:
- issue: Aspecto narrativo da revelação feita pela vítima moribunda
  choice: 'Traduzir ἔθνησκεν como processo em curso: “estava morrendo”.'
  alternative: “morreu”
  rationale: A forma no imperfeito retrata a vítima, ainda meio morta, revelando a causa enquanto morria. A escolha preserva a vivacidade e a simultaneidade da cena sem impor uma conclusão doutrinária.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. “Lançado por terra” conserva a força concreta do grego sem soar excessivamente coloquial; “revelava” e “estava morrendo” mantêm o aspecto narrativo dos imperfeitos.
