base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/001.yaml
  text: But for your holy ones there was very great light[a]; hearing their voice but not seeing their form, since they indeed had not suffered the same things[b], they counted them blessed.
translation:
  language: pt
  text: Mas, para os teus fiéis[a], havia uma luz intensíssima. Ao ouvirem a voz deles, mas sem verem a sua forma, pois também tinham sentido falta deles[b], consideravam-nos felizes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “teus santos” ou “teus devotos”.
    reason: lexical_alternative
  - marker: b
    text: 'O grego é difícil neste contexto. O verbo empregado normalmente significa “desejar”, “ansiar por” ou “sentir falta”. Algumas traduções adotam uma leitura contextual: “porque eles não tinham passado pelos mesmos sofrimentos”. O grego aqui fornecido, porém, não contém a palavra “não”.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ... ὁσίοις σου
  choice: para os teus fiéis
  rationale: ὅσιος descreve pessoas devotas e fiéis a Deus. “Fiéis” comunica esse sentido relacional em português corrente sem sugerir necessariamente a categoria eclesiástica posterior de santos canonizados.
- source_word: μέγιστον ... φῶς
  choice: uma luz intensíssima
  rationale: O superlativo μέγιστον reforça em grau máximo a grandeza da luz; “intensíssima” expressa naturalmente essa força no contexto de luz e escuridão.
- source_word: φωνὴν
  choice: voz
  rationale: φωνή pode significar som ou voz; a referência a pessoas e o contraste com a forma invisível favorecem “voz”.
- source_word: μορφὴν
  choice: forma
  rationale: μορφή designa a forma ou aparência visível. “Forma” conserva a formulação ampla do grego.
- source_word: ἐπεπώθεισαν
  choice: tinham sentido falta deles
  rationale: O verbo ποθέω significa normalmente desejar, ansiar por ou sentir falta. A tradução segue o valor lexical atestado, embora a frase seja difícil no contexto e várias versões adotem uma interpretação contextual diferente.
- source_word: ἐμακάριζον
  choice: consideravam-nos felizes
  rationale: μακαρίζω significa declarar, chamar ou considerar alguém feliz ou bem-aventurado. A formulação escolhida é clara e natural sem acrescentar uma conotação litúrgica.
theological_decisions:
- issue: Referente do sujeito implícito em “ouviam”, “viam” e “consideravam”
  choice: Os ouvintes são os egípcios ou “os outros”, em contraste com os fiéis de Deus.
  alternative: Os fiéis seriam os ouvintes, ou a sintaxe descreveria uma percepção mútua.
  rationale: O contraste do contexto entre o povo de Deus, que tinha luz, e os atingidos pelas trevas favorece os egípcios como os que ouviam sem ver. “Os outros” torna compreensível em português um sujeito deixado implícito pelo grego, sem identificá-lo denominacionalmente.
- issue: Sentido da oração com ἐπεπώθεισαν
  choice: 'Manter o sentido lexical de ποθέω: “tinham sentido falta deles”.'
  alternative: “Não tinham passado pelos mesmos sofrimentos” ou “não haviam sofrido as mesmas coisas”.
  rationale: O texto grego fornecido contém ἐπεπώθεισαν, de ποθέω, e não traz uma negação. A leitura ligada a sofrimento torna melhor a lógica contextual, mas exige entender o texto de modo não literal, pressupor outra forma verbal e ainda suprir uma negação. A tradução principal preserva a dificuldade real do texto e a nota registra a alternativa tradicional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais. “Os outros” explicita com discrição o sujeito implícito. A formulação principal prioriza o texto grego transmitido e deixa a dificuldade contextual visível na nota, em vez de resolvê-la silenciosamente.
