review_pass:
  verdict: revise
  source_fidelity: A tradução segue corretamente o texto grego fornecido ao não introduzir a negação nem o verbo “sofrer”, presentes apenas na interpretação contextual refletida pela trilha inglesa. Contudo, “sentido falta deles” fornece um objeto (“deles”) que o grego deixa elíptico; convém preservar essa elipse na tradução e explicá-la em nota.
  naturalness: A redação é clara, mas “Mas, para os teus fiéis, havia” soa mais marcada do que necessário, e a dupla vírgula inicial é pouco fluente. “Mas os teus fiéis tinham uma luz intensíssima” é natural e conserva o sentido.
  terminology: “Fiéis”, “luz intensíssima”, “voz”, “forma” e “consideravam-nos felizes” são escolhas adequadas. A nota sobre ἐπεπώθεισαν deve indicar que o objeto do desejo não é expresso no grego, em vez de apresentar “deles” como se fosse determinado pelo texto.
  issues:
  - severity: medium
    issue: Objeto acrescentado a ἐπεπώθεισαν
    rationale: O verbo grego significa “haviam ansiado/desejado” e não traz objeto expresso. “Tinham sentido falta deles” interpreta o objeto como os fiéis; isso pode ser plausível no contexto, mas reduz uma dificuldade sintática que o texto transmitido conserva.
  - severity: low
    issue: Pontuação e formulação inicial
    rationale: “Mas, para os teus fiéis, havia” é compreensível, porém a construção com duas vírgulas é menos natural em português moderno do que atribuir diretamente a luz aos fiéis.
  revised_text: Mas os teus fiéis tinham uma luz intensíssima[a]. Os outros ouviam a voz deles, mas não viam sua forma; e, pois também haviam ansiado [por algo][b], consideravam-nos felizes.
  revised_footnotes:
  - marker: a
    text: Ou “teus santos” ou “teus devotos”.
    reason: lexical_alternative
  - marker: b
    text: 'O grego é difícil neste contexto. O verbo empregado significa normalmente “desejar” ou “ansiar por”; seu objeto não é expresso. A tradução mantém essa elipse. Muitas versões, seguindo uma leitura contextual ou uma tradição textual diferente, trazem algo como: “porque eles não tinham passado pelos mesmos sofrimentos”; o grego aqui fornecido, porém, não contém nem a palavra “não” nem o verbo “sofrer”.'
    reason: alternative_reading
  revision_rationale: A revisão conserva a leitura do grego fornecido, inclusive sua dificuldade contextual, sem harmonizá-lo com a interpretação inglesa que fala de não terem sofrido as mesmas coisas. Remove-se o objeto não expresso de ἐπεπώθεισαν e empregam-se colchetes para mostrar a elipse sem converter uma inferência em texto traduzido. A abertura foi ajustada para português mais idiomático.
