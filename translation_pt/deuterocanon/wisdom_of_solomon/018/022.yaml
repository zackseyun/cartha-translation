base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/022.yaml
  text: He overcame the multitude not by strength of body, nor by the force of weapons, but by a word he subdued the punisher, reminding him of the oaths to the fathers and the covenants.
translation:
  language: pt
  text: Ele venceu a multidão, não pela força do corpo nem pelo poder das armas, mas, por uma palavra, subjugou aquele que castigava[a], recordando-lhe os juramentos feitos aos antepassados[b] e as alianças.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o castigador”. O grego não identifica expressamente se a referência é a Deus, a um agente angelical destruidor ou à força personificada do juízo.
    reason: alternative_reading
  - marker: b
    text: Ou “os juramentos dos antepassados”. O genitivo grego permite essa formulação, embora o contexto favoreça os juramentos ou promessas feitos aos patriarcas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνίκησεν
  choice: venceu
  rationale: O aoristo de νικάω expressa vitória ou prevalência; “venceu” é natural e não sugere necessariamente morticínio militar.
- source_word: τὸν ὄχλον
  choice: a multidão
  rationale: Mantém o sentido coletivo amplo de ὄχλος e o artigo definido, sem especificar além do grego.
- source_word: οὐκ ἰσχύι τοῦ σώματος
  choice: não pela força do corpo
  rationale: Preserva o dativo instrumental e o contraste formal entre força corporal, armas e palavra.
- source_word: οὐχ ὅπλων ἐνεργείᾳ
  choice: nem pelo poder das armas
  rationale: ἐνέργεια indica aqui poder atuante ou eficácia; “poder das armas” é claro e idiomático.
- source_word: ἀλλὰ λόγῳ
  choice: mas, por uma palavra
  rationale: Mantém a concisão de λόγος e o contraste instrumental, sem expandi-lo interpretativamente para “intercessão”.
- source_word: τὸν κολάζοντα
  choice: aquele que castigava
  rationale: Reproduz o particípio presente substantivado sem identificar o agente como Deus, anjo ou força personificada do juízo.
- source_word: ὑπέταξεν
  choice: subjugou
  rationale: Expressa o sentido de sujeitar ou pôr sob controle, preservando a força da imagem verbal.
- source_word: ὅρκους πατέρων
  choice: os juramentos feitos aos antepassados
  rationale: A formulação explicita de modo natural a leitura contextual de juramentos dirigidos aos patriarcas, ao mesmo tempo que uma nota registra a ambiguidade do genitivo.
- source_word: καὶ διαθήκας
  choice: e as alianças
  rationale: διαθήκη, no uso bíblico grego, designa normalmente uma aliança; o plural do original foi mantido.
- source_word: ὑπομνήσας
  choice: recordando-lhe
  rationale: O particípio aoristo indica meio ou circunstância concomitante. O pronome torna explícito em português o objeto implícito, sem lhe determinar a identidade.
theological_decisions:
- issue: Identidade de “aquele que castigava” e objeto implícito de “recordando”
  choice: Manter o agente indeterminado como “aquele que castigava” e usar “lhe” sem nomeá-lo.
  alternative: “o castigador”, “o anjo destruidor” ou Deus como agente direto do castigo
  rationale: O grego emprega um particípio substantivado e não identifica expressamente o referente. A tradução conserva essa indeterminação e a tensão teológica.
- issue: Sentido de λόγῳ
  choice: “por uma palavra”
  alternative: “por meio da fala”, “pela intercessão” ou “pela razão”
  rationale: O contraste imediato é com força física e armas. “Por uma palavra” preserva a formulação compacta e evita inserir uma interpretação mais desenvolvida.
- issue: Relação do genitivo em ὅρκους πατέρων
  choice: “juramentos feitos aos antepassados” no texto, com alternativa em nota
  alternative: “juramentos dos antepassados”
  rationale: A direção dos juramentos não é marcada explicitamente por uma preposição no grego. O contexto pactual favorece promessas juradas aos patriarcas, mas a alternativa formalmente possível deve permanecer visível.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A estrutura retórica do contraste foi preservada, e as ambiguidades relativas ao agente do castigo e ao genitivo “dos antepassados” foram mantidas por meio de notas.
