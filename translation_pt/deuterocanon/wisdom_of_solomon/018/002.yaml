base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/002.yaml
  text: because, though they had been attacked before, they gave thanks that they were not being harmed[b][a], and they begged pardon for their hostility.
translation:
  language: pt
  text: pois, embora tivessem sido atacados antes, deram graças por não estarem sofrendo nenhum mal[a] e pediam perdão por sua hostilidade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego deste trecho é sintaticamente difícil, sobretudo na expressão relacionada a “não causar dano”. A tradução apresenta o sentido contextual mais provável: a hostilidade anterior deu lugar à gratidão e a um pedido de perdão.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “pediam favor a respeito do afastamento ou conflito entre eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὐ βλάπτοντιν
  choice: por não estarem sofrendo nenhum mal
  rationale: A forma transmitida é sintaticamente difícil. βλάπτω normalmente significa causar dano ou ferir; no contexto, a leitura de sentido passivo expressa de modo natural o contraste entre a hostilidade anterior e a gratidão presente, sem ocultar a dificuldade textual, registrada em nota.
- source_word: προπολεμημένοι
  choice: embora tivessem sido atacados antes
  rationale: Preserva tanto a ideia de conflito quanto o valor temporal do prefixo προ-. A construção concessiva produz em português uma frase clara e coerente com a ação de graças subsequente.
- source_word: εὐχαριστοῦσιν
  choice: davam graças
  rationale: Equivalente corrente e digno para o verbo de agradecer, preservando sua força verbal.
- source_word: τὸ διενεχθῆναι
  choice: sua hostilidade
  rationale: O infinitivo pode indicar estar em desacordo, separado ou em conflito. “Hostilidade” comunica o conflito relacional no contexto, enquanto uma alternativa mais aberta é preservada em nota.
- source_word: χάριν ἐδέοντο
  choice: pediam perdão
  rationale: A expressão denota pedir favor ou graça. Ligada à hostilidade anterior, “pediam perdão” transmite o provável sentido interpessoal em português natural, sem transformar o pedido em uma fórmula doutrinária.
theological_decisions:
- issue: Tratamento de uma linha grega sintaticamente difícil, possivelmente corrompida na forma transmitida
  choice: 'Expressar o sentido contextual provável: gratidão por não sofrer dano após um conflito anterior e pedido de perdão pela hostilidade'
  alternative: 'Traduzir de maneira estritamente formal e obscura: “porque os anteriormente combatidos, não causando dano, dão graças e pediam favor quanto a estar em desacordo”'
  rationale: A tradução evita uma literalidade ininteligível, mas reconhece explicitamente em nota a incerteza da construção. Assim, não se transforma uma solução contextual provável em certeza textual nem se impõe uma interpretação teológica particular.
translation_notes:
  register: Português moderno, natural e digno, com ampla legibilidade brasileira. “Davam graças” mantém o registro bíblico sem arcaísmo; “sofrendo nenhum mal” é idiomático e não introduz um agente ausente no grego. As notas preservam a dificuldade textual e a amplitude semântica do pedido.
