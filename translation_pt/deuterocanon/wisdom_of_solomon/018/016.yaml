  text: bearing your sharp sword—your unfeigned command—and standing[a], he filled all things with death; and while he touched heaven[b], he had stepped upon the earth.
translation:
  language: pt
  text: trazendo a tua ordem sem dissimulação como espada afiada[a], e, ao tomar posição, encheu tudo de morte; enquanto tocava o céu, já tinha posto os pés sobre a terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a tua ordem genuína»; também pode indicar uma ordem sem fingimento ou pretense.'
    reason: lexical_alternative
  - marker: b
    text: 'A figura é descrita em dimensões cósmicas: toca o céu enquanto já se firmou sobre a terra, ressaltando o alcance universal do juízo.'
    reason: cultural_note
lexical_decisions:
- source_word: ξίφος ὀξὺ
  choice: como espada afiada
  rationale: Preserva a metáfora bélica e, com «como», torna natural em português a relação entre a espada e a ordem divina, sem transformar a espada em objeto pertencente a Deus além do que a sintaxe exige.
- source_word: τὴν ἀνυπόκριτον ἐπιταγήν σου
  choice: a tua ordem sem disfarce
  rationale: ἐπιταγή indica uma ordem autoritativa; ἀνυπόκριτον significa literalmente algo não fingido ou sem dissimulação. «Sem disfarce» mantém essa ideia incomum sem substituí-la silenciosamente por «inflexível» ou «irrevogável».
- source_word: φέρων
  choice: trazendo
  rationale: Expressa o particípio simultâneo de modo corrente e solene, adequado à figura que executa o juízo.
- source_word: στὰς
  choice: depois de tomar posição
  rationale: O particípio aoristo de ἵστημι indica que a figura se põe ou se firma em posição antes da ação principal; esta formulação preserva melhor esse aspecto do que o simples «estando».
- source_word: ἐπλήρωσεν τὰ πάντα θανάτου
  choice: encheu tudo de morte
  rationale: Reproduz diretamente a formulação abrangente e incisiva do grego, sem restringir τὰ πάντα a um domínio específico.
- source_word: οὐρανοῦ μὲν ἥπτετο
  choice: tocava o céu
  rationale: ἅπτομαι significa tocar ou alcançar. «Tocava» conserva a imagem cósmica sem explicá-la em excesso.
- source_word: βέβηκει δʼ ἐπὶ γῆς
  choice: mas tinha posto os pés sobre a terra
  rationale: A forma de βαίνω comunica um passo já dado e uma posição estabelecida. A expressão portuguesa preserva tanto o movimento anterior quanto o apoio firme sobre a terra.
theological_decisions:
- issue: Identidade da figura que executa o juízo
  choice: Manter a personificação guerreira da palavra ou ordem divina sem identificar explicitamente a figura como anjo ou ser divino distinto.
  alternative: Identificá-la como o anjo destruidor ou como uma pessoa divina específica.
  rationale: O contexto personifica a palavra de Deus como agente do juízo, mas este versículo não define de modo inequívoco sua ontologia. A tradução conserva a tensão sem importar uma identificação doutrinária posterior.
- issue: Relação entre a espada e a ordem divina
  choice: Apresentar a ordem como espada por meio de «como espada afiada».
  alternative: 'Entender que a figura carrega dois elementos separados: uma espada afiada e a ordem divina.'
  rationale: A justaposição dos dois acusativos favorece uma relação metafórica ou apositiva, embora a construção seja compacta. A formulação escolhida comunica essa relação sem desenvolver uma explicação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem sintática foi levemente ajustada para clareza, preservando a metáfora bélica, a personificação e a imagem cósmica. Os marcadores [a] e [b] aparecem junto às expressões que explicam.
