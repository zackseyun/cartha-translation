    issue: «Ordem sem disfarce»
    rationale: Embora literalizante, a expressão é pouco idiomática em português moderno. «Ordem sem dissimulação» mantém o valor de ἀνυπόκριτον (sem fingimento, genuína) com registro solene e compreensível.
