  text: But the discordant cry of enemies echoed back[a], and the pitiful lament for children being mourned was carried abroad.
translation:
  language: pt
  text: Mas o clamor dissonante dos inimigos ressoava, e os lamentos pungentes pelas crianças que eram lamentadas espalhavam-se.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e sons/lamentos pungentes pelas crianças que eram lamentadas se difundiam». O plural neutro grego οἰκτρά permite diferentes organizações da frase em português; θρηνουμένων indica que as crianças eram as lamentadas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντήχει
  choice: ecoava
  rationale: O imperfeito descreve um som que ressoava ou reverberava; “ecoava” preserva a vivacidade auditiva sem tornar explícita uma resposta que o contexto imediato não exige.
- source_word: ἀσύμφωνος
  choice: dissonante
  rationale: O adjetivo indica falta de harmonia ou concordância. “Dissonante” conserva tanto a dimensão sonora quanto a desordem emocional do clamor.
- source_word: ἐχθρῶν ἡ βοή
  choice: o clamor dos inimigos
  rationale: O genitivo identifica de quem procedia o clamor. “Clamor” expressa um grito coletivo de aflição e se ajusta melhor ao contexto de luto do que um brado de guerra.
- source_word: οἰκτρά
  choice: comovente
  rationale: O neutro plural caracteriza de modo substantival ou adverbial o som lamentoso. “Comovente” comunica seu caráter digno de compaixão em português natural.
- source_word: διεφέρετο
  choice: espalhava-se
  rationale: O imperfeito médio-passivo apresenta o som sendo levado e difundido de um lugar para outro. “Espalhava-se” reproduz esse movimento de maneira idiomática.
- source_word: θρηνουμένων παίδων
  choice: pelas crianças pranteadas
  rationale: 'A construção é entendida passivamente: as crianças são objeto do pranto. “Pranteadas” preserva essa relação sem sugerir que eram elas que lamentavam.'
theological_decisions:
- issue: Se παίδων deve ser especificado como “primogênitos” ou “filhos primogênitos” por causa do contexto narrativo
  choice: crianças
  alternative: primogênitos; filhos primogênitos
  rationale: Embora o contexto trate da morte dos primogênitos do Egito, o substantivo deste versículo tem sentido mais amplo. A tradução mantém a formulação própria do texto sem introduzir uma especificação contextual.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. “Clamor dissonante” conserva a imagem acústica marcante do grego; “crianças pranteadas” mantém a relação passiva de forma concisa e literária.
