- from: Mas ecoava o clamor dissonante dos inimigos, e espalhava-se o lamento comovente pelas crianças pranteadas.[a]
  to: Mas o clamor dissonante dos inimigos ressoava, e os lamentos pungentes pelas crianças que eram lamentadas espalhavam-se.[a]
