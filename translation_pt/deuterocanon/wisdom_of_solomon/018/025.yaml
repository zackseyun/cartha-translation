base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/025.yaml
  text: The destroyer gave way before this man[a], and feared these things[c][b]; for the mere testing of wrath was sufficient.
translation:
  language: pt
  text: O destruidor cedeu diante dele[a] e temeu essas coisas[b]; pois a simples experiência da ira foi suficiente.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o destruidor cedeu diante deste”. “O destruidor” significa literalmente “aquele que destrói”; o grego não diz expressamente “anjo destruidor”.'
    reason: alternative_reading
  - marker: b
    text: '“Essas coisas” provavelmente se refere às insígnias sacerdotais ou aos elementos memoriais descritos no versículo anterior, mas o grego deixa o referente implícito. A forma verbal do texto grego fornecido é plural, literalmente “temeram”, o que produz uma construção difícil; a tradução segue o sentido contextual: o destruidor temeu essas coisas.'
    reason: textual_difficulty
  - marker: c
    text: 'Ou: “pois a simples prova da ira bastou”. O termo grego pode indicar experiência, prova ou teste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: diante dele
  rationale: O demonstrativo acusativo retoma a figura sacerdotal do contexto imediato. A forma pronominal é natural em português e evita acrescentar “homem”, ausente do grego.
- source_word: εἶξεν
  choice: cedeu diante de
  rationale: O verbo indica ceder, dar passagem ou recuar perante alguém; “cedeu diante de” conserva a imagem sem explicar indevidamente como o destruidor foi detido.
- source_word: ὀλοθρεύων
  choice: o destruidor
  rationale: O particípio substantivado significa literalmente “aquele que destrói”. “O destruidor” é idiomático e não acrescenta “anjo”, identificação que o grego não explicita.
- source_word: ταῦτα
  choice: essas coisas
  rationale: O demonstrativo neutro plural aponta de modo condensado para elementos mencionados no versículo anterior, sem identificá-los novamente. “Essas coisas” mantém o referente implícito.
- source_word: ἐφοβήθησαν
  choice: temeu
  rationale: A forma transmitida no texto fornecido é plural (“temeram”), mas a construção e o sentido contextual pressupostos pela camada auditada associam o temor ao destruidor. A tradução segue esse sentido, registrando em nota a dificuldade gramatical do texto grego apresentado.
- source_word: πεῖρα
  choice: experiência
  rationale: O substantivo pode significar experiência, prova ou teste. “Experiência” comunica aqui uma manifestação já vivenciada da ira, sem eliminar a concisão da expressão grega.
- source_word: ὀργῆς
  choice: ira
  rationale: No contexto de juízo divino, “ira” preserva a gravidade judicial e teológica do termo.
- source_word: μόνη ... ἱκανή
  choice: a simples ... foi suficiente
  rationale: A construção indica que aquela experiência, por si só, bastou. “A simples experiência” expressa essa exclusividade com naturalidade em português.
theological_decisions:
- issue: Identidade de ὀλοθρεύων
  choice: o destruidor
  alternative: o anjo destruidor
  rationale: Embora o contexto possa evocar um agente angelical de juízo, o grego diz apenas “aquele que destrói”. O texto principal não especifica além da fonte.
- issue: Referente de ταῦτα
  choice: essas coisas
  alternative: as insígnias sacerdotais ou os memoriais mencionados no versículo anterior
  rationale: O referente é fornecido pelo contexto, mas não é expresso no próprio versículo. A tradução conserva essa abertura.
- issue: Sujeito do temor
  choice: o destruidor temeu essas coisas
  alternative: “essas coisas temeram”, conforme a concordância formal da forma verbal plural no texto fornecido
  rationale: A forma grega apresentada cria uma dificuldade de concordância e de sentido. O contexto e a camada inglesa auditada favorecem entender o destruidor como aquele que teme, mas a nota torna transparente o problema textual em vez de ocultá-lo.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe corrente no Brasil e inteligível internacionalmente. A formulação mantém a concisão do grego, evita identificar explicitamente o destruidor como anjo e preserva em nota tanto a ambiguidade do demonstrativo quanto a dificuldade da forma verbal transmitida.
