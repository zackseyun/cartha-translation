base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/011.yaml
  text: And slave and master alike were punished with the same judgment[a], and the commoner suffered the same things as the king.
translation:
  language: pt
  text: O escravo e o seu senhor foram punidos com a mesma pena[a], e o homem do povo sofreu as mesmas coisas que o rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma punição igual”. A palavra grega δίκη pode significar pena, punição, sentença ou justiça, conforme o contexto.'
    reason: Registra a amplitude lexical de δίκη e a possível tradução de ὁμοία como “igual”.
lexical_decisions:
- source_word: ὁμοία
  choice: a mesma
  rationale: No paralelismo com τὰ αὐτά e no contraste entre posições sociais, indica equivalência de tratamento, e não mera semelhança.
- source_word: δίκη
  choice: pena
  rationale: Neste contexto de juízo, designa a consequência penal concreta. “Pena” preserva melhor a possibilidade de punição ou sentença do que o abstrato “justiça”.
- source_word: δοῦλος
  choice: escravo
  rationale: O contraste explícito com δεσπότης torna central a condição social de escravidão; “servo” suavizaria indevidamente essa relação.
- source_word: δεσπότῃ
  choice: seu senhor
  rationale: No par social com “escravo”, “senhor” expressa a autoridade do δεσπότης de modo natural e digno; o possessivo torna clara a relação sem restringi-la necessariamente à ideia jurídica de propriedade.
- source_word: κολασθείς
  choice: foram punidos
  rationale: A forma passiva é mantida, e a coordenação portuguesa explicita naturalmente que escravo e senhor receberam a pena conjuntamente.
- source_word: δημότης
  choice: homem do povo
  rationale: Em oposição ao rei, designa uma pessoa de condição comum. “Homem do povo” conserva o contraste social sem introduzir a noção política mais específica de “cidadão”.
- source_word: βασιλεῖ
  choice: rei
  rationale: É o sentido comum e específico do termo, preservando o contraste entre a pessoa comum e a autoridade régia.
- source_word: τὰ αὐτὰ πάσχων
  choice: sofreu as mesmas coisas
  rationale: Tradução direta que preserva a ênfase na experiência idêntica entre pessoas de posições sociais diferentes, sem acrescentar a interpretação de “destino”.
theological_decisions:
- issue: Terminologia de posição social em contexto de juízo
  choice: Manter “escravo” e “senhor”
  alternative: “servo” e “senhor” ou “escravo” e “dono”
  rationale: A afirmação ressalta que o juízo atinge igualmente todos os níveis da hierarquia social. “Escravo” preserva a realidade de δοῦλος, enquanto “senhor” comunica a contraposição relacional de δεσπότης sem tornar o texto excessivamente jurídico.
- issue: Natureza de δίκη
  choice: Traduzir como “pena”
  alternative: “juízo”, “punição” ou “justiça”
  rationale: O contexto aponta para o resultado penal sofrido, mas a nota registra a amplitude semântica do termo para não eliminar sua possível nuance judicial.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. A construção paralela conserva o nivelamento entre escravo e senhor, homem do povo e rei. “Homem do povo” é preferido a “plebeu”, que soaria histórico ou depreciativo, e a “cidadão comum”, que acrescentaria uma categoria política não exigida pelo grego.
