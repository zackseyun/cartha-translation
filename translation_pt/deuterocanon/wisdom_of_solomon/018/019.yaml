base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/019.yaml
  text: For the dreams that troubled them foretold this[b][a], so that they might not perish without knowing why they were suffering.
translation:
  language: pt
  text: Pois os sonhos que os perturbaram anunciaram isso de antemão[a], para que não perecessem sem saber por que sofriam tão duramente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deram-lhes aviso antecipado disso”. O verbo grego pode significar anunciar ou sinalizar algo previamente como advertência.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “por causa daquilo por que sofrem mal”; isto é, sem saber a razão de sua aflição.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ γὰρ ὄνειροι
  choice: Pois os sonhos
  rationale: O artigo definido retoma os sonhos do contexto, e γάρ introduz a explicação com naturalidade por meio de «pois».
- source_word: θορυβήσαντες αὐτοὺς
  choice: que os perturbaram
  rationale: O particípio indica que os sonhos lhes causaram agitação ou alarme; «perturbaram» preserva essa força em português corrente.
- source_word: τοῦτο προεμήνυσαν
  choice: anunciaram isso de antemão
  rationale: προμηνύω expressa anunciar, indicar ou advertir previamente. A formulação mantém a amplitude entre predição e aviso antecipado.
- source_word: ἵνα μὴ ... ἀπόλωνται
  choice: para que não morressem
  rationale: A oração com ἵνα exprime naturalmente propósito. No contexto de morte, «morressem» é claro e digno, embora o verbo também possa significar «perecessem».
- source_word: ἀγνοοῦντες διʼ ὃ
  choice: sem saber por que
  rationale: A construção participial descreve morrer em ignorância quanto à causa; «sem saber por que» é idiomático e conserva a relação causal de διʼ ὃ.
- source_word: κακῶς πάσχουσιν
  choice: estavam sofrendo
  rationale: A expressão grega significa sofrer males ou ser afligido. Em português, «estavam sofrendo» comunica o sentido sem o pouco natural «sofrendo mal»; a nota registra a força explícita de κακῶς.
theological_decisions:
- issue: Finalidade dos sonhos perturbadores
  choice: Os sonhos são apresentados como aviso prévio, para que os atingidos não morressem ignorando a razão do sofrimento.
  alternative: 'A oração poderia ser entendida mais frouxamente como resultado: os sonhos tiveram o efeito de impedir que morressem sem saber a causa.'
  rationale: 'ἵνα μή exprime mais naturalmente propósito neste contexto. A tradução preserva a tensão do texto: há sofrimento e morte, mas também revelação antecipada de sua causa.'
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem das notas segue a ocorrência dos marcadores no texto.
