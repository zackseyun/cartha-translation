  naturalness: «Pois os sonhos que os perturbaram» e «sem saber por que» são naturais em português moderno. «Sofriam tão duramente» preserva o qualificativo grego com fluência e dignidade, sem o pouco idiomático «sofriam mal».
  terminology: «Perecessem» é apropriado ao registro literário de Sabedoria e conserva a gravidade de ἀπόλωνται sem impor interpretação teológica adicional. «Anunciaram isso de antemão» representa adequadamente προεμήνυσαν; a nota registra a alternativa de aviso prévio.
