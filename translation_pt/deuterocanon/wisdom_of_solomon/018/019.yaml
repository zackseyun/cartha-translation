    rationale: Embora a nota a mencione, «estavam sofrendo» não traduz o modificador «mal, duramente». «Sofriam tão duramente» preserva a intensidade adversa de modo idiomático.
  - severity: low
    issue: «Morressem» é menos específico que ἀπόλωνται.
    rationale: O verbo pode envolver morte, mas «perecessem» reproduz melhor a ideia de destruição/perdição e o tom elevado do original.
  - severity: low
