base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/003.yaml
  text: Instead of these things[a], you provided a pillar blazing with fire, both as a guide for an unknown journey and as a harmless sun for their honored exile.
translation:
  language: pt
  text: Em vez dessas coisas, providenciaste uma coluna de fogo ardente, para servir de guia numa jornada desconhecida e de sol inofensivo para sua nobre estadia em terra estrangeira.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para sua nobre estadia em terra estrangeira”. A expressão grega φιλοτίμου ξενιτείας é difícil e pode destacar a dignidade da vida de Israel fora de sua terra, em vez de descrever um exílio em sentido estritamente negativo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: Em vez dessas coisas
  rationale: Mantém o contraste com os acontecimentos anteriores sem especificar além do que o pronome grego permite.
- source_word: πυριφλεγῆ στῦλον
  choice: uma coluna que ardia em fogo
  rationale: Reproduz a imagem intensa do adjetivo composto e preserva a alusão concreta à coluna de fogo.
- source_word: ὁδηγὸν μὲν ἀγνώστου ὁδοιπορίας
  choice: para servir de guia numa jornada desconhecida
  rationale: Expressa com naturalidade a função da coluna e conserva a ideia de uma jornada por caminho não conhecido.
- source_word: ἥλιον δὲ ἀβλαβῆ
  choice: de sol que não causava dano
  rationale: Preserva a metáfora explícita do sol e traduz ἀβλαβής de modo mais natural em português do que o adjetivo isolado “inofensivo” neste contexto.
- source_word: φιλοτίμου ξενιτείας
  choice: durante sua honrosa permanência em terra estrangeira
  rationale: ξενιτεία indica vida ou permanência fora da própria terra; φιλοτίμου confere uma qualificação positiva ligada à honra. A formulação evita restringir o sentido a “exílio”, mantendo a dificuldade da expressão em nota.
- source_word: παρέσχες
  choice: providenciaste
  rationale: Conserva a segunda pessoa da invocação direta a Deus e o sentido de fornecer ou conceder algo necessário.
theological_decisions:
- issue: Alusão à coluna de fogo e imagem do sol
  choice: Manter as imagens concretas de “coluna” e “sol”.
  alternative: Generalizar como “uma luz que os guiava”.
  rationale: As imagens evocam deliberadamente a condução divina no êxodo; reduzi-las a “luz” apagaria parte da textura intertextual.
- issue: Sentido de ξενιτεία
  choice: permanência em terra estrangeira
  alternative: exílio; peregrinação no estrangeiro
  rationale: O termo pode indicar exílio, residência ou estadia fora da própria terra. A opção escolhida preserva essa amplitude e não impõe uma conotação estritamente negativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição funcional “para servir de guia... e de sol” torna explícito o paralelismo grego sem desfazer suas imagens.
