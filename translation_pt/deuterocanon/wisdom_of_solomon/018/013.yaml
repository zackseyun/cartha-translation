base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/013.yaml
  text: For though they had disbelieved everything because of their sorceries[b][a], at the destruction of the firstborn they acknowledged that this people was God's son.
translation:
  language: pt
  text: Pois, embora não acreditassem em nada por causa das feitiçarias[a], por ocasião da destruição dos primogênitos reconheceram que o povo era filho de Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “artes mágicas”. O termo grego se refere aqui às práticas ocultistas associadas ao Egito.
    reason: lexical_alternative
  - marker: b
    text: Israel é apresentado coletivamente como filho de Deus; aqui a expressão não é um título dado a um indivíduo.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπιστοῦντες
  choice: desacreditassem
  rationale: O particípio expressa descrença diante do que havia sido manifestado. “Desacreditassem de tudo” comunica essa rejeição ativa em português natural, sem reduzi-la a mera dúvida.
- source_word: φαρμακείας
  choice: feitiçarias
  rationale: Neste contexto, o termo designa práticas ocultistas ou artes mágicas associadas ao Egito, não o uso de medicamentos.
- source_word: ὀλέθρῳ
  choice: destruição
  rationale: Conserva a amplitude do substantivo grego e descreve a calamidade fatal sem acrescentar imagens não expressas no texto.
- source_word: πρωτοτόκων
  choice: dos primogênitos
  rationale: Mantém o artigo e a ausência de pronome possessivo no grego; o contexto identifica os primogênitos atingidos.
- source_word: ὡμολόγησαν
  choice: reconheceram
  rationale: Expressa uma admissão aberta, imposta pela evidência dos acontecimentos, sem a conotação religiosa mais específica que “confessaram” poderia adquirir.
- source_word: θεοῦ υἱὸν
  choice: filho de Deus
  rationale: Preserva o singular predicativo e a linguagem de filiação corporativa aplicada ao povo.
- source_word: λαὸν
  choice: o povo
  rationale: Traduz diretamente o substantivo singular e evita inserir um demonstrativo ausente no grego.
theological_decisions:
- issue: A filiação corporativa de Israel
  choice: o povo era filho de Deus
  alternative: o povo era um filho de Deus; o povo era composto de filhos de Deus
  rationale: O grego emprega λαόν e υἱόν no singular, apresentando o povo coletivamente como filho de Deus. A tradução conserva essa tensão e não pluraliza nem individualiza a expressão.
- issue: Relação lógica do particípio ἀπιστοῦντες
  choice: embora desacreditassem
  alternative: porque desacreditavam; enquanto desacreditavam
  rationale: A leitura concessiva se ajusta ao contraste narrativo entre a descrença anterior e o reconhecimento provocado pela morte dos primogênitos. “Pois” preserva a ligação explicativa de γάρ com o contexto precedente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Diante da destruição” expressa a ocasião que levou ao reconhecimento; “o povo” segue o grego sem acrescentar “este”.
