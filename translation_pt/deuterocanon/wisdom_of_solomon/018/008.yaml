base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/008.yaml
  text: For just as you punished the adversaries[a], so by this, having summoned us, you glorified us.
translation:
  language: pt
  text: Pois, assim como castigaste os adversários, por esse mesmo ato, tendo-nos chamado[a], tu nos glorificaste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tendo-nos convocado”; o verbo grego também pode sugerir “tendo-nos chamado para junto de ti”.
    reason: Registra a amplitude lexical e a possível nuance reflexiva do verbo médio προκαλεσάμενος.
lexical_decisions:
- source_word: ἐτιμώρησας
  choice: castigaste
  rationale: Expressa com clareza a ação punitiva de τιμωρέω sem especificar além do texto a ideia de vingança.
- source_word: τοὺς ὑπεναντίους
  choice: os adversários
  rationale: Preserva o sentido amplo de pessoas hostis ou contrárias, sem restringi-lo necessariamente a inimigos militares.
- source_word: τούτῳ
  choice: por esse mesmo ato
  rationale: Torna explícito o valor instrumental do dativo e sua referência à ação divina já mencionada; “mesmo” evidencia que o juízo dos adversários e a glorificação do povo são apresentados como aspectos do mesmo ato.
- source_word: προκαλεσάμενος
  choice: tendo-nos chamado
  rationale: Reproduz a forma participial e conserva a amplitude do verbo médio, que pode indicar chamar, convocar ou chamar para junto de si, sem impor no texto principal uma nuance relacional discutível.
- source_word: ἐδόξασας
  choice: tu nos glorificaste
  rationale: “Glorificaste” preserva o peso de δοξάζω e o contraste entre o castigo dos adversários e a honra concedida ao povo; o pronome “tu” dá clareza e ênfase natural à oração principal.
theological_decisions:
- issue: Relação entre o castigo dos adversários e a glorificação do povo
  choice: Apresentar ambos como efeitos ou aspectos do mesmo ato divino, sem explicar além disso como se relacionam.
  alternative: 'Entender τούτῳ apenas como uma referência mais vaga: “com isso” ou “nisso”.'
  rationale: A construção liga diretamente o juízo dos adversários à glorificação de “nós”, mas não desenvolve uma teoria sobre essa relação; “por esse mesmo ato” mantém a tensão e a conexão textual.
- issue: Nuance do particípio médio προκαλεσάμενος
  choice: Usar “tendo-nos chamado” no texto e registrar em nota as possibilidades “convocado” e “chamado para junto de ti”.
  alternative: Traduzir diretamente “tendo-nos chamado para junto de ti”.
  rationale: A forma média pode sugerir convocação para si, mas essa nuance não precisa ser explicitada como única leitura. A tradução principal conserva a ambiguidade legítima.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com formas verbais tradicionais na segunda pessoa do singular por se tratar de discurso direto a Deus. A sintaxe mantém a comparação e o particípio do grego, mas usa “por esse mesmo ato” para tornar natural e inteligível o valor instrumental de τούτῳ.
