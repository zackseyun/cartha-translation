translation:
  language: pt
  text: Então, imediatamente, imagens de sonhos os perturbaram terrivelmente[a], e medos inesperados vieram sobre eles,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aparições de sonhos” ou “fantasmas de sonhos”. O termo grego pode designar aparições ou imagens; “imagens de sonhos” preserva o contexto onírico sem afirmar mais do que o texto diz.
