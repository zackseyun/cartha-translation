lexical_decisions:
- source_word: τότε παραχρῆμα
  choice: Então, imediatamente
  rationale: Preserva tanto a sequência narrativa indicada por τότε quanto a súbita imediatez de παραχρῆμα, em português natural.
- source_word: φαντασίαι ὀνείρων
  choice: visões de sonhos
  rationale: Mantém a relação genitiva e o contexto onírico sem definir as imagens como fantasmas literais; φαντασίαι também pode indicar aparições ou imagens.
- source_word: δεινῶς ἐτάραξαν
  choice: perturbaram terrivelmente
  rationale: Conserva a função adverbial de δεινῶς e o sentido de agitação de ἐτάραξαν, sem fundir os dois termos em um único verbo mais interpretativo.
- source_word: φόβοι
  choice: medos
  rationale: Equivalente direto do plural grego, preservando sua forma abstrata e plural.
- source_word: ἐπέστησαν ἀδόκητοι
  choice: medos inesperados vieram sobre eles
  rationale: Expressa a chegada repentina sugerida por ἐπέστησαν e a ausência de expectativa indicada por ἀδόκητοι.
