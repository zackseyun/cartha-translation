  source_fidelity: A tradução preserva adequadamente a sequência temporal, os mortos caídos em massa, a ira e o contraste com os vivos. Contudo, “amontoados” ligado a “caído” soa sintaticamente menos natural, e “interrompeu” enfraquece a imagem concreta de διέσχισεν, que sugere cortar/separar o caminho.
