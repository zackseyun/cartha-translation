  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/023.yaml
  text: For when heaps of dead had already fallen one upon another[a], he stood in the midst and checked the wrath, and cut off the way to the living.
translation:
  language: pt
  text: Pois, quando os mortos já haviam caído em montões, uns sobre os outros, ele postou-se no meio, conteve a ira e cortou o caminho que levava aos vivos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωρηδόν
  choice: amontoados
  rationale: O advérbio indica que os mortos estavam em montes; integrado ao particípio, “caído amontoados” comunica a imagem com naturalidade em português.
- source_word: ἤδη πεπτωκότων
  choice: já haviam caído
  rationale: O particípio perfeito descreve uma ação anterior cujo resultado permanecia, enquanto ἤδη acrescenta a ideia de que isso já ocorrera.
- source_word: ἐπʼ ἀλλήλων
  choice: uns sobre os outros
  rationale: Preserva a imagem física dos corpos acumulados, em formulação corrente e clara.
- source_word: μεταξὺ στὰς
  choice: ele se colocou entre eles
  rationale: Expressa a tomada de posição intermediária sugerida pelo particípio; “entre eles” mantém aberta, no texto, a identificação precisa dos dois lados pelo contexto.
- source_word: ἀνέκοψεν
  choice: conteve
  rationale: O verbo indica deter ou refrear o avanço de algo; “conteve” combina naturalmente com “a ira”.
- source_word: τὴν ὀργήν
  choice: a ira
  rationale: “Ira” preserva a gravidade do juízo divino no contexto, sem explicitar no texto palavras ausentes do grego.
- source_word: διέσχισεν
  choice: interrompeu
  rationale: Embora o verbo tenha a imagem básica de cortar ou separar, no contexto descreve o bloqueio do avanço da calamidade; “interrompeu” conserva esse efeito em português claro.
- source_word: τὴν πρὸς τοὺς ζῶντας ὁδόν
  choice: o caminho até os vivos
  rationale: Mantém a metáfora espacial do percurso da ira em direção aos que ainda viviam e preserva o contraste com os mortos.
theological_decisions:
- issue: Referente do sujeito implícito
  choice: Manter “ele”, sem acrescentar o nome no versículo.
  alternative: Explicitar “Aarão”.
  rationale: O grego não repete o nome, que é recuperável pelo contexto imediato; o pronome respeita essa forma e evita inserir uma explicação no corpo do texto.
- issue: Sentido de ὀργή
  choice: Traduzir por “ira”.
  alternative: Traduzir por “indignação” ou “cólera”.
  rationale: No contexto narrativo, trata-se da manifestação punitiva do juízo divino; “ira” conserva esse peso teológico sem ampliar o original.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. A ordem foi ajustada à sintaxe natural do português sem apagar a imagem dos mortos amontoados, a postura mediadora e o caminho figurado da ira até os vivos.
