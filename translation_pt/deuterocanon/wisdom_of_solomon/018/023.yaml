  terminology: “Ira” é uma escolha fiel e adequada para ὀργή neste contexto. Mantém-se “ele”, sem introduzir o nome de Aarão. “Cortou o caminho que levava aos vivos” conserva a metáfora espacial e a força verbal sem excessiva literalidade.
