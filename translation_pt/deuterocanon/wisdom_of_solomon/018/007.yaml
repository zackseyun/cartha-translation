  text: So your people expected both the salvation of the righteous and the destruction of their enemies[b][a];
translation:
  language: pt
  text: Assim, o teu povo esperava tanto a salvação dos justos como a destruição dos inimigos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «aguardava», «acolhia» ou «recebia»; o verbo grego pode indicar expectativa ansiosa ou recepção.
    reason: lexical_alternative
  - marker: b
    text: Ou «a libertação dos justos».
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεδέχθη
  choice: aguardava
  rationale: O verbo προσδέχομαι pode indicar esperar, aguardar ou acolher. Aqui, o contexto da noite de libertação e juízo favorece a expectativa; a construção ativa com «o teu povo» é natural em português e comunica o sentido do passivo grego.
- source_word: λαοῦ σου
  choice: o teu povo
  rationale: Preserva a referência coletiva e a interpelação direta a Deus, com linguagem bíblica clara e corrente.
- source_word: σωτηρία
  choice: salvação
  rationale: O termo pode significar salvação, resgate ou libertação. «Salvação» conserva a amplitude teológica sem excluir a libertação histórica em vista.
- source_word: δικαίων
  choice: dos justos
  rationale: Reproduz o genitivo plural e mantém a categoria moral expressa pelo grego, em formulação portuguesa concisa.
- source_word: ἐχθρῶν
  choice: dos inimigos
  rationale: Traduz literalmente o genitivo plural sem acrescentar um possessivo ausente do grego; o contexto identifica a relação entre os grupos.
- source_word: ἀπωλία
  choice: destruição
  rationale: Expressa com clareza a ideia de ruína ou perdição e mantém o contraste forte com «salvação».
theological_decisions:
- issue: Preservação do duplo desfecho de libertação e juízo
  choice: «a salvação dos justos e a destruição dos inimigos»
  alternative: «a libertação dos justos e a ruína dos inimigos»
  rationale: A correlação μὲν...δὲ contrapõe deliberadamente os dois resultados. A tradução mantém lado a lado salvação e destruição, sem suavizar a tensão nem explicar além do texto.
- issue: Identidade dos inimigos
  choice: «dos inimigos»
  alternative: «dos seus inimigos»
  rationale: O grego não traz pronome possessivo. Embora o contexto permita entender que são os inimigos do povo de Deus, a redação evita tornar explícito o que permanece implícito.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. «Teu» conserva a interpelação direta no singular. A ordem dos marcadores foi normalizada para [a][b].
