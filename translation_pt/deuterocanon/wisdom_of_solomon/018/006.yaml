- from: Aquela noite foi dada a conhecer de antemão aos nossos pais[a], para que, sabendo com certeza em que juramentos haviam confiado[b], cobrassem ânimo[c].
  to: Aquela noite foi dada a conhecer de antemão aos nossos pais[a], para que, sabendo com certeza dos juramentos nos quais haviam confiado[b], cobrassem ânimo[c].
