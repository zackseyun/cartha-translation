base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/006.yaml
  text: That night was made known beforehand to our fathers[a], so that, knowing with certainty the oaths in which they had trusted[c][b], they might be encouraged.
translation:
  language: pt
  text: Aquela noite foi dada a conhecer de antemão aos nossos pais[a], para que, sabendo com certeza dos juramentos nos quais haviam confiado[b], cobrassem ânimo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Aquela noite foi conhecida de antemão por nossos pais”.
    reason: lexical_alternative
  - marker: b
    text: Ou “sabendo com certeza dos juramentos em que haviam crido”.
    reason: lexical_alternative
  - marker: c
    text: Ou “fossem encorajados” ou “tomassem coragem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνη ἡ νύξ
  choice: Aquela noite
  rationale: Preserva de modo natural a força demonstrativa da expressão grega.
- source_word: προεγνώσθη
  choice: foi dada a conhecer de antemão
  rationale: Embora o verbo também possa significar que algo foi conhecido previamente, o contexto favorece a ideia de revelação antecipada aos antepassados.
- source_word: πατράσιν ἡμῶν
  choice: aos nossos pais
  rationale: Reproduz diretamente a expressão masculina plural do grego, que designa os antepassados de Israel; a nota registra a alternativa sem neutralizar o texto principal.
- source_word: ἵνα
  choice: para que
  rationale: Expressa com clareza a finalidade introduzida pela conjunção grega.
- source_word: ἀσφαλῶς εἰδότες
  choice: sabendo com certeza
  rationale: Conserva tanto o sentido cognitivo de εἰδότες quanto a segurança ou certeza comunicada por ἀσφαλῶς.
- source_word: οἷς ἐπίστευσαν ὅρκοις
  choice: em que juramentos haviam confiado
  rationale: Mantém o substantivo concreto 'juramentos' e representa a confiança depositada neles, sem explicitar no corpo do versículo quem os pronunciou.
- source_word: ἐπευθυμήσωσιν
  choice: cobrassem ânimo
  rationale: Expressão portuguesa natural e digna para a ideia de tomar coragem ou ser encorajado.
theological_decisions:
- issue: Referente dos “juramentos”
  choice: Manter apenas “juramentos”, sem explicitar seu autor ou conteúdo
  alternative: “promessas juradas de Deus” ou referência geral às promessas ligadas à libertação pascal
  rationale: O contexto aponta para compromissos divinos conhecidos pelos antepassados, mas o versículo não os especifica. A tradução preserva essa concisão e evita resolver além do que está expresso.
- issue: Sentido de προεγνώσθη
  choice: A noite foi revelada de antemão aos pais
  alternative: A noite foi conhecida de antemão pelos pais
  rationale: A forma passiva admite formalmente a leitura de conhecimento prévio, mas, no contexto da revelação antecipada da noite de libertação, o valor de 'dar a conhecer previamente' é mais provável. A alternativa genuína é preservada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. O registro é digno e corrente; “cobrassem ânimo” evita tanto a rigidez excessiva quanto uma formulação coloquial. Todos os marcadores de nota aparecem no texto principal.
