review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a noite revelada de antemão, a certeza acerca dos juramentos em que os pais confiaram e a finalidade de lhes dar coragem. Contudo, a construção «em que juramentos haviam confiado» não representa de modo natural nem claro a relação exigida pelo grego; «nos juramentos em que haviam confiado» a exprime corretamente.
  naturalness: «Aquela noite foi dada a conhecer de antemão» e «cobrassem ânimo» são formulações naturais em registro bíblico-literário moderno. A revisão da ordem e da preposição em «nos juramentos em que haviam confiado» elimina uma aspereza sintática relevante.
  terminology: «Nossos pais» preserva o termo masculino plural πατράσιν, com a alternativa inclusiva explicada em nota. «Juramentos» conserva ὅρκοις sem especificar indevidamente o autor ou o conteúdo. A nota a deve registrar a alternativa real para προεγνώσθη, e não uma alternativa para «pais».
  issues:
  - severity: medium
    issue: Construção inadequada em «em que juramentos haviam confiado».
    rationale: Em português, a expressão idiomática é «confiar em [algo]»; com o relativo, requer-se «nos juramentos em que haviam confiado». A formulação original pode sugerir a pergunta «em que juramentos?» em vez de identificar os juramentos nos quais haviam depositado confiança.
  - severity: low
    issue: A nota a não corresponde ao termo a que está ancorada.
    rationale: O marcador a segue «nossos pais», mas a alternativa pertinente a προεγνώσθη é «foi conhecida de antemão por nossos pais». A alternativa «antepassados» pode ser mantida, mas deve estar ancorada em «pais» e não substituir a necessária nota sobre a ambiguidade do verbo.
  revised_text: Aquela noite foi dada a conhecer de antemão aos nossos pais[a], para que, sabendo com certeza dos juramentos nos quais haviam confiado[b], cobrassem ânimo[c].
