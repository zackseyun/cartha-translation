base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/024.yaml
  text: For on the full-length robe was the whole world[a], and the glory of the fathers was on the engraving of the four-rowed stones[b], and your majesty was on the diadem upon his head.
translation:
  language: pt
  text: Pois sobre a veste que chegava aos pés[a] estava o mundo inteiro; a glória dos pais, na gravação das pedras dispostas em quatro fileiras[b]; e a tua majestade, no diadema sobre a cabeça dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “veste longa”. O termo grego designa uma veste que se estende até os pés.'
    reason: lexical_alternative
  - marker: b
    text: A expressão grega é compacta e um tanto difícil. Provavelmente alude ao peitoral do sumo sacerdote, cujas pedras gravadas estavam dispostas em quatro fileiras.
    reason: cultural_note
lexical_decisions:
- source_word: ποδήρους ἐνδύματος
  choice: veste que chegava aos pés
  rationale: Expressa diretamente o sentido de uma veste que se estende até os pés, preservando a imagem da indumentária sacerdotal em português claro e digno.
- source_word: ὅλος ὁ κόσμος
  choice: o mundo inteiro
  rationale: Mantém o sentido amplo de κόσμος e sua dimensão cósmica sem explicá-lo interpretativamente como 'toda a criação'.
- source_word: πατέρων δόξα
  choice: a glória dos pais
  rationale: Conserva a formulação elevada e a abertura semântica de δόξα; 'patriarcas' acrescentaria uma identificação não explicitada no grego.
- source_word: ἐπὶ τετραστίχου λίθου γλυφῆς
  choice: na gravação das pedras dispostas em quatro fileiras
  rationale: Torna compreensível a expressão grega compacta, indicando o arranjo em quatro fileiras sem inserir 'peitoral' no texto principal.
- source_word: μεγαλοσύνη σου
  choice: a tua majestade
  rationale: Comunica a grandeza divina em registro elevado e natural, adequado ao contexto simbólico e cultual.
- source_word: διαδήματος
  choice: diadema
  rationale: Preserva o termo específico para a faixa ou ornamento régio, em vez do mais genérico 'coroa'.
theological_decisions:
- issue: Descrição simbólica das vestes do sumo sacerdote
  choice: Preservar no texto a associação entre o mundo, a glória ancestral e a majestade divina com os elementos da veste sacerdotal.
  alternative: Explicitar no corpo do versículo o peitoral e o turbante de Êxodo 28, ou traduzir κόσμος como 'universo'.
  rationale: O grego apresenta essas associações simbolicamente, mas não identifica de modo explícito todos os elementos nem desenvolve sua interpretação; a tradução conserva essa tensão e deixa a alusão bíblica em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A pontuação com ponto e vírgula evidencia as três correspondências simbólicas sem alterar a estrutura do versículo; o tratamento 'tua' preserva a solenidade da interpelação a Deus.
