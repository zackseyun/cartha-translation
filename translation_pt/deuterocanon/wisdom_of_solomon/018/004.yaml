review_pass:
  verdict: revise
  source_fidelity: 'A tradução reproduz adequadamente a estrutura e os principais elementos do grego: o merecimento do castigo, a privação da luz, o aprisionamento nas trevas, o confinamento dos filhos de Deus e a mediação deles na concessão da luz imperecível da lei. “Estava destinada a ser dada” é uma opção defensável para ἤμελλεν ... δίδοσθαι. Contudo, “à era” não é uma construção idiomática em português e torna obscura a função de τῷ αἰῶνι.'
  naturalness: O período é claro e tem registro apropriado, mas “ser dada à era” soa como decalque do grego e não como português moderno. “Ao mundo” é natural e corresponde a um dos sentidos plenamente possíveis de αἰών; a nota pode preservar a alternativa temporal.
  terminology: “Luz imperecível da lei”, “trevas”, “teus filhos” e “confinados” são escolhas adequadas. “Teus filhos” mantém a formulação filial masculina do texto sem necessidade de explicitação interpretativa adicional.
  issues:
  - severity: medium
    issue: “à era” é uma formulação não idiomática e semanticamente opaca para τῷ αἰῶνι.
    rationale: Embora tente conservar o singular e a amplitude de αἰών, em português “dar algo à era” não comunica de forma natural nem o sentido cósmico (“ao mundo”) nem o temporal (“para sempre”). “Ao mundo” é uma leitura lexical legítima; a nota mantém a alternativa temporal e sinaliza o singular grego.
  revised_text: Pois aqueles mereciam ser privados da luz e aprisionados nas trevas, eles que haviam mantido teus filhos confinados, por meio dos quais a luz imperecível da lei estava destinada a ser dada ao mundo.[a]
