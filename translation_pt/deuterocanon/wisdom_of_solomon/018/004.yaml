base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/004.yaml
  text: For those men were worthy to be deprived of light and imprisoned in darkness[a], they who had kept your sons shut in, through whom the imperishable light of the law was about to be given to the age.
translation:
  language: pt
  text: Pois aqueles mereciam ser privados da luz e aprisionados nas trevas, eles que haviam mantido teus filhos confinados, por meio dos quais a luz imperecível da lei estava destinada a ser dada ao mundo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para sempre”. O grego diz literalmente “à era”, no singular, expressão que pode ter sentido cósmico ou temporal.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄξιοι
  choice: mereciam
  rationale: No contexto de juízo, expressa merecimento moral e punitivo de modo natural em português.
- source_word: στερηθῆναι φωτὸς
  choice: ser privados da luz
  rationale: Preserva a forma passiva e a ideia de privação como castigo.
- source_word: φυλακισθῆναι σκότει
  choice: aprisionados nas trevas
  rationale: Mantém a força carcerária de φυλακίζω e a reversão retributiva em relação ao confinamento de Israel.
- source_word: οἱ κατακλείστους φυλάξαντες
  choice: eles que haviam mantido ... confinados
  rationale: Expressa tanto a ação de reter quanto o estado de clausura, sem tornar a frase pesada.
- source_word: τοὺς υἱούς σου
  choice: teus filhos
  rationale: Conserva o masculino plural explícito e a relação filial de Israel com Deus.
- source_word: διʼ ὧν
  choice: por meio dos quais
  rationale: Mantém como antecedente pessoal mais próximo os filhos de Deus e preserva a instrumentalidade.
- source_word: ἤμελλεν ... δίδοσθαι
  choice: estava destinada a ser dada
  rationale: Comunica a futuridade prevista ou determinada por μέλλω sem sugerir necessariamente iminência cronológica.
- source_word: τὸ ἄφθαρτον νόμου φῶς
  choice: a luz imperecível da lei
  rationale: Preserva a imagem luminosa, o genitivo ligado à lei e a durabilidade expressa por ἄφθαρτον.
- source_word: τῷ αἰῶνι
  choice: à era
  rationale: Mantém o singular e a abertura semântica de αἰών, embora a formulação exija esclarecimento em nota.
theological_decisions:
- issue: Referência de “teus filhos” e função de Israel na transmissão da luz da lei
  choice: “Por meio dos quais” retoma “teus filhos”, isto é, Israel.
  alternative: Entender a expressão de modo mais amplo, como referência aos acontecimentos por meio dos quais a lei seria dada.
  rationale: O antecedente gramatical pessoal mais próximo de διʼ ὧν é τοὺς υἱούς σου; a tradução mantém essa relação sem expandir sua interpretação teológica.
- issue: Sentido de αἰών
  choice: à era
  alternative: ao mundo; para sempre
  rationale: O substantivo singular pode ter força temporal ou cósmica. A tradução formal no texto e as alternativas na nota preservam essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por equivalência ótima. “Teus” mantém o discurso direto a Deus e evita a ambiguidade regional de “seus”. A formulação “à era” é deliberadamente formal para conservar a ambiguidade do grego, esclarecida em nota.
