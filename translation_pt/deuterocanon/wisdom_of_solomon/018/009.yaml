  terminology: “Lei divina”, “bens e perigos”, “pais” e “louvores” são escolhas adequadas. “Piedosos” para ὅσιοι evita uma repetição estilisticamente pesada de “santos” e não exige que ὅσιοι e ἅγιοι sejam vertidos pelo mesmo termo técnico em português.
