base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/009.yaml
  text: For the holy children of good men were secretly offering sacrifices[a], and in unity they established the divine law, that the holy ones would share alike in the same good things and dangers[c][b], while their fathers were already singing beforehand hymns of praise.
translation:
  language: pt
  text: Pois os filhos piedosos de homens bons ofereciam sacrifícios em segredo[a] e, em concórdia, estabeleceram a lei divina[b], para que os santos[c] participassem igualmente dos mesmos bens e perigos, enquanto seus pais já entoavam antecipadamente louvores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “secretamente”. O grego ressalta que a ação sacrificial era realizada de modo oculto.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a lei da divindade”. A expressão grega é incomum.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “os que são santos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: κρυφῇ
  choice: em segredo
  rationale: Expressa de modo natural o valor adverbial de maneira e preserva o caráter oculto da celebração.
- source_word: ἐθυσίαζον
  choice: ofereciam sacrifícios
  rationale: O imperfeito sugere ação em curso ou repetida, e a formulação explicita o sentido cultual do verbo.
- source_word: ὅσιοι παῖδες ἀγαθῶν
  choice: os santos filhos de homens bons
  rationale: Mantém a linguagem sacral de ὅσιοι e o provável sentido genealógico do genitivo ἀγαθῶν sem especificar além do grego.
- source_word: τὸν τῆς θειότητος νόμον
  choice: a lei divina
  rationale: É uma formulação portuguesa clara para a expressão grega incomum, sem transformar θειότης numa abstração filosófica.
- source_word: ἐν ὁμονοίᾳ διέθεντο
  choice: em concórdia, estabeleceram
  rationale: Concórdia comunica unanimidade comunitária; estabeleceram preserva a força solene e dispositiva do verbo médio.
- source_word: μεταλήμψεσθαι
  choice: participariam
  rationale: Comunica a participação comum indicada pelo infinitivo futuro, sem tornar explícita uma relação recíproca além do texto.
- source_word: τῶν αὐτῶν ὁμοίως καὶ ἀγαθῶν καὶ κινδύνων
  choice: igualmente dos mesmos bens e perigos
  rationale: Preserva tanto a igualdade da participação quanto o contraste entre circunstâncias favoráveis e perigosas.
- source_word: τοὺς ἁγίους
  choice: os santos
  rationale: É a correspondência portuguesa direta e natural para o substantivo adjetival, embora 'os que são santos' também seja possível.
- source_word: πατέρων
  choice: seus pais
  rationale: Explicita a relação contextualmente implícita, conservando a possível referência aos pais ou antepassados.
- source_word: προαναμελπόντων αἴνους
  choice: já entoavam antecipadamente louvores
  rationale: Entoavam preserva o elemento musical, antecipadamente reflete o prefixo προ-, e louvores traduz αἴνους sem expansão desnecessária.
theological_decisions:
- issue: Identidade histórica dos participantes
  choice: Manter a referência implícita aos israelitas fiéis no contexto da Páscoa
  alternative: Generalizar como uma descrição atemporal dos justos
  rationale: O contexto imediato é o êxodo, mas o versículo não nomeia Israel; a tradução não acrescenta essa identificação ao corpo do texto.
- issue: Sentido de τοὺς ἁγίους
  choice: os santos
  alternative: os que são santos
  rationale: A escolha é lexicalmente direta e corrente em português; a nota registra a alternativa transparente, evitando restringir o termo a uma categoria eclesiástica posterior.
- issue: Força de τὸν τῆς θειότητος νόμον
  choice: a lei divina
  alternative: a lei da divindade
  rationale: A formulação escolhida preserva a relação com o divino de maneira inteligível, sem impor uma definição doutrinária da expressão incomum.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A ordem foi levemente ajustada para clareza, sem eliminar as ambiguidades relativas a 'lei divina', 'santos' e 'pais'.
