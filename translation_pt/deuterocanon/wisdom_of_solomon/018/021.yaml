base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/021.yaml
  text: For a blameless man hurried forward and fought in the front line[a], bringing the weapon of his own service—prayer and atonement by incense; he stood against the wrath and put an end to the disaster[b], showing that he is your servant.
translation:
  language: pt
  text: 'Pois um homem irrepreensível apressou-se e combateu na linha de frente, levando a arma de seu próprio ministério: a oração e a expiação por meio do incenso[a]. Ele resistiu à ira e pôs fim à calamidade, mostrando que é teu servo[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a oração e o rito expiatório do incenso”. O termo grego pode designar expiação ou propiciação em contexto cultual.'
    reason: lexical_alternative
  - marker: b
    text: O termo grego traduzido por “servo” também pode designar um assistente dedicado, em serviço honroso.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπεύσας
  choice: apressou-se
  rationale: O particípio aoristo expressa uma intervenção pronta e urgente; a formulação é natural e preserva a rapidez da ação.
- source_word: ἀνὴρ ἄμεμπτος
  choice: um homem irrepreensível
  rationale: Mantém o substantivo masculino singular e o sentido de alguém contra quem não há acusação legítima.
- source_word: προεμάχησεν
  choice: combateu na linha de frente
  rationale: Preserva a metáfora militar de lutar à frente dos demais, em vez de reduzi-la a uma ideia genérica de defesa.
- source_word: τὸ τῆς ἰδίας λειτουργίας ὅπλον
  choice: a arma de seu próprio ministério
  rationale: “Arma” conserva a imagem bélica; “ministério” comunica o serviço cultual exercido pelo homem no contexto.
- source_word: προσευχὴν καὶ θυμιάματος ἐξιλασμόν
  choice: a oração e a expiação por meio do incenso
  rationale: Apresenta os elementos que constituem a arma mencionada. “Expiação” mantém o sentido cultual de ἐξιλασμός, e “por meio do incenso” expressa naturalmente a relação do genitivo.
- source_word: ἀντέστη τῷ θυμῷ
  choice: resistiu à ira
  rationale: Conserva a oposição vigorosa de ἀντέστη sem explicitar de quem é a ira, pois isso permanece implícito no grego.
- source_word: πέρας ἐπέθηκε τῇ συμφορᾷ
  choice: pôs fim à calamidade
  rationale: Formulação portuguesa idiomática que transmite a imposição de um limite definitivo à aflição.
- source_word: θεράπων
  choice: servo
  rationale: É natural e dignificado em português para alguém dedicado ao serviço de Deus; uma nota registra a nuance de assistente honrado.
theological_decisions:
- issue: Natureza de ἐξιλασμός no contexto cultual
  choice: expiação
  alternative: propiciação; rito expiatório
  rationale: “Expiação” é compreensível e preserva o peso cultual do termo sem definir de modo excessivamente técnico o mecanismo pelo qual o juízo é afastado.
- issue: Referência de θυμός
  choice: a ira
  alternative: a indignação; o furor
  rationale: O contexto aponta para o juízo divino, mas a tradução não acrescenta “de Deus”, visto que o texto grego deixa o referente implícito.
- issue: Nuance de θεράπων
  choice: servo
  alternative: assistente; servidor
  rationale: “Servo” é claro e solene, enquanto a nota preserva a possível nuance de serviço pessoal honroso sem confundi-la com uma distinção doutrinária rígida.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A metáfora militar foi mantida, assim como a linguagem cultual e a referência implícita da ira. A pontuação esclarece que a oração e a expiação por meio do incenso constituem a arma do ministério.
