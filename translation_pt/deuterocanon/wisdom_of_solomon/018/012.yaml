base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/012.yaml
  text: And all together[a], under one sentence of death, they had countless dead; for the living were not even sufficient to bury them, since in a single moment their most honored offspring was destroyed.
translation:
  language: pt
  text: E todos juntos, sob uma única sentença de morte[a], tinham mortos incontáveis; pois os vivos nem sequer bastavam para sepultá-los, já que, num só instante, a descendência mais honrada deles[b] foi destruída.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em um só nome de morte”; a expressão pode indicar uma mesma sentença ou uma única forma de morte para todos.
    reason: Preservar a formulação incomum e a ambiguidade de ἐν ἑνὶ ὀνόματι θανάτου.
  - marker: b
    text: Ou, conforme o contexto, “seus primogênitos”; o grego diz mais literalmente “sua descendência mais honrada”.
    reason: Registrar a alusão contextual sem tratar como explícito no versículo o que o grego exprime de modo descritivo.
lexical_decisions:
- source_word: ὁμοθυμαδόν
  choice: todos juntos
  rationale: Expressa a simultaneidade coletiva e a condição compartilhada sem sugerir que houve uma decisão consensual.
- source_word: ἐν ἑνὶ ὀνόματι θανάτου
  choice: sob uma única sentença de morte
  rationale: Traduz de modo inteligível a expressão incomum, literalmente ligada a um só “nome” de morte, entendida no contexto como uma condenação comum; a nota preserva a forma e a ambiguidade do grego.
- source_word: νεκροὺς εἶχον ἀναριθμήτους
  choice: tinham mortos incontáveis
  rationale: Mantém a construção possessiva e comunica a quantidade avassaladora de mortos em linguagem grave e compreensível.
- source_word: οἱ ζῶντες ... πρὸς τὸ θάψαι ... ἱκανοί
  choice: os vivos nem sequer bastavam para sepultá-los
  rationale: Preserva o contraste entre vivos e mortos e exprime naturalmente a incapacidade numérica para realizar os sepultamentos.
- source_word: πρὸς μίαν ῥοπὴν
  choice: num só instante
  rationale: Comunica a extrema rapidez do acontecimento em registro atual e digno.
- source_word: ἡ ἐντιμοτέρα γένεσις αὐτῶν
  choice: a descendência mais honrada deles
  rationale: Conserva o sentido de geração, linhagem ou descendência especialmente estimada sem substituir a expressão grega pelo termo explícito “primogênitos”, que não aparece no versículo.
- source_word: διεφθάρη
  choice: foi destruída
  rationale: Mantém a voz passiva e a força catastrófica de διαφθείρω no contexto de juízo.
theological_decisions:
- issue: Se a alusão à morte dos primogênitos do Egito deve ser explicitada no texto principal
  choice: a descendência mais honrada deles
  alternative: os primogênitos deles
  rationale: O contexto aponta claramente para a praga dos primogênitos, mas o grego emprega uma expressão descritiva, não πρωτότοκος. O texto principal preserva essa distinção, e a nota registra a identificação contextual.
- issue: Se ἐν ἑνὶ ὀνόματι θανάτου deve ser apresentado inequivocamente como fórmula jurídica
  choice: sob uma única sentença de morte
  alternative: por uma só forma de morte
  rationale: “Sentença de morte” comunica bem a condição comum imposta a todos, mas a expressão grega é incomum e literalmente menciona um único “nome” de morte. A nota evita ocultar essa tensão lexical.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe acompanha o encadeamento causal do grego, mas evita construções excessivamente arcaicas.
