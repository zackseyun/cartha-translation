base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/020.yaml
  text: But the trial of death also touched the righteous[a], and a destruction of the multitude occurred in the wilderness[b]; yet the wrath did not remain for long.
translation:
  language: pt
  text: Mas a provação da morte também atingiu os justos[a], e houve no deserto a destruição de uma multidão[b]; contudo, a ira não durou muito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a experiência da morte” ou “a provação pela morte”.
    reason: lexical_alternative
  - marker: b
    text: Ou “o esmagamento de uma multidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἥψατο
  choice: atingiu
  rationale: Expressa naturalmente que a provação alcançou e afetou os justos, preservando a ideia do verbo grego sem sugerir a destruição total deles.
- source_word: δικαίων
  choice: os justos
  rationale: O plural substantivado designa pessoas caracterizadas como justas; esta é uma formulação bíblica corrente e clara em português.
- source_word: πεῖρα θανάτου
  choice: a provação da morte
  rationale: Mantém a construção compacta e a amplitude de πεῖρα, que pode indicar prova, provação ou experiência, sem afirmar de modo inequívoco que os justos morreram.
- source_word: θραῦσις
  choice: destruição
  rationale: No contexto de uma calamidade mortal, comunica com clareza o resultado do quebrantamento ou esmagamento expresso pelo termo grego.
- source_word: πλήθους
  choice: de uma multidão
  rationale: Conserva o sentido coletivo de um grande número de pessoas sem identificar o grupo mais precisamente do que o grego.
- source_word: ἐν ἐρήμῳ
  choice: no deserto
  rationale: É a expressão natural em português para o cenário do êxodo e corresponde ao uso de ἔρημος neste contexto.
- source_word: ὀργή
  choice: a ira
  rationale: Preserva a força judicial e teológica do termo sem acrescentar um possuidor que não aparece explicitamente no grego.
- source_word: οὐκ ἐπὶ πολὺ ἔμεινεν
  choice: não durou muito
  rationale: Tradução idiomática da expressão temporal, indicando que a ira permaneceu por pouco tempo.
theological_decisions:
- issue: Se deve explicitar que a ira é de Deus
  choice: a ira
  alternative: a ira de Deus; sua ira
  rationale: Embora o contexto indique a ira divina, o texto grego não traz possessivo nem nomeia Deus nesta oração; a tradução preserva essa forma.
- issue: O alcance de πεῖρα θανάτου sobre os justos
  choice: a provação da morte também atingiu os justos
  alternative: os justos também experimentaram a morte; a prova imposta pela morte também alcançou os justos
  rationale: A formulação mantém a tensão de que os justos foram afetados pelo acontecimento mortal, sem concluir que foram destruídos do mesmo modo que a multidão.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A ordem foi levemente ajustada em “houve no deserto” para maior naturalidade, sem alterar as relações do grego.
