base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/018/005.yaml
  text: When they had resolved to kill the infants of the holy ones[a], and one child had been exposed and rescued[b], you took away their multitude of children as a rebuke and destroyed them all together in mighty water.
translation:
  language: pt
  text: Quando eles decidiram matar os bebês dos santos, e uma criança foi exposta e resgatada[a], tu lhes tiraste, como repreensão, uma multidão de filhos e os destruíste todos juntos em águas impetuosas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A “criança” provavelmente é uma alusão a Moisés, que foi deixado exposto e depois preservado com vida (Êx 2:3–10).
    reason: cross_reference
  - marker: b
    text: Ou “em águas violentas” ou “em águas avassaladoras”. O grego diz literalmente “em água impetuosa”, no singular coletivo, referindo-se ao mar como instrumento da destruição.
    reason: lexical_alternative
lexical_decisions:
- source_word: βουλευσαμένους
  choice: decidiram
  rationale: O particípio indica deliberação e propósito firme. “Decidiram” expressa com naturalidade a intenção deliberada, sem a rigidez de “tomaram conselho”.
- source_word: τὰ τῶν ὁσίων ... νήπια
  choice: os bebês dos santos
  rationale: νήπια designa crianças muito pequenas, e “bebês” comunica isso claramente. ὅσιοι se refere ao povo consagrado a Deus; “santos” é a forma portuguesa corrente e não exige aqui uma categoria eclesiástica posterior.
- source_word: ἑνὸς ... τέκνου
  choice: uma criança
  rationale: τέκνον é um termo amplo e não especifica o sexo. “Criança” conserva essa generalidade, embora a alusão provável seja a Moisés.
- source_word: ἐκτεθέντος
  choice: foi exposta
  rationale: O verbo descreve a prática de deixar uma criança exposta ou abandonada. “Exposta” mantém a precisão histórica e a ligação com o relato de Êxodo.
- source_word: σωθέντος
  choice: resgatada
  rationale: No contexto, trata-se de livramento de um perigo concreto. “Resgatada” evita impor ao verbo um sentido soteriológico mais técnico.
- source_word: εἰς ἔλεγχον
  choice: como repreensão
  rationale: A expressão tem força de censura, desmascaramento e correção judicial. “Como repreensão” preserva essa função sem explicitar além do texto.
- source_word: ἀφεῖλον
  choice: tiraste
  rationale: O aoristo significa retirar ou levar embora. “Tiraste” é direto e mantém a interpelação de Deus na segunda pessoa.
- source_word: πλῆθος τέκνων
  choice: uma multidão de filhos
  rationale: πλῆθος ressalta o grande número e cria contraste retórico com “uma criança”. “Filhos” é natural para os descendentes dos egípcios nesse contexto.
- source_word: ὁμοθυμαδόν
  choice: todos juntos
  rationale: Aqui o advérbio enfatiza a destruição coletiva. “Todos juntos” mantém a concisão e não decide com maior precisão se a ênfase é simultaneidade ou unidade do grupo.
- source_word: ἐν ὕδατι σφοδρῷ
  choice: em águas impetuosas
  rationale: σφοδρός comunica força e violência. O plural idiomático “águas” soa natural em português para o mar, enquanto a nota registra a forma singular coletiva do grego.
theological_decisions:
- issue: Referente da criança exposta e resgatada
  choice: Manter “uma criança” no texto e indicar em nota a provável alusão a Moisés
  alternative: Identificar diretamente a criança como Moisés no corpo do versículo
  rationale: A formulação evoca fortemente Êxodo 2:3–10, mas o grego não nomeia Moisés. A tradução preserva a generalidade formal e deixa a identificação provável para a nota.
- issue: Sentido de ὅσιοι
  choice: santos
  alternative: fiéis; piedosos; consagrados
  rationale: O termo designa o povo santo de Deus. “Santos” é conciso, reconhecível e próximo do grego, sem acrescentar uma definição denominacional.
- issue: Alcance de “os destruíste todos juntos”
  choice: Preservar a referência pronominal e coletiva do contexto
  alternative: Explicitar “destruíste os egípcios” ou “destruíste seus filhos”
  rationale: O grego não repete um objeto explícito nessa oração, e o contexto relaciona tanto o juízo sobre os filhos quanto a destruição no mar. Evita-se resolver silenciosamente essa tensão por meio de uma identificação acrescentada.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A segunda pessoa singular (“tu lhes tiraste”, “destruíste”) preserva a interpelação direta a Deus. O texto busca equivalência ótima: mantém o contraste entre uma única criança e muitos filhos, mas emprega construções naturais em português.'
