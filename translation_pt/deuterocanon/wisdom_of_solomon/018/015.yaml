  text: your all-powerful word leaped from heaven[a], from royal thrones, a relentless warrior, into the midst of the doomed land[b];
translation:
  language: pt
  text: A tua palavra todo-poderosa[a] saltou dos céus, dos tronos reais[b] — guerreiro implacável — para o meio da terra condenada à destruição;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a tua Palavra onipotente”. Alguns entendem aqui uma referência personificada, ou antecipatória, a um agente divino; o grego também pode referir-se, de modo mais geral, à palavra eficaz de Deus.
    reason: Preserva a ambiguidade interpretativa de λόγος sem resolvê-la no texto principal.
  - marker: b
    text: “Tronos” está no plural no texto grego.
    reason: Sinaliza o plural incomum da expressão original, preservado na tradução.
lexical_decisions:
- source_word: ὁ παντοδύναμός σου λόγος
  choice: a tua palavra todo-poderosa
  rationale: παντοδύναμος significa “todo-poderoso, onipotente”, e λόγος tem aqui o sentido direto de “palavra”. A formulação preserva a personificação sem impor uma identificação cristológica posterior.
- source_word: ἀπʼ οὐρανῶν
  choice: dos céus
  rationale: Conserva naturalmente em português o plural grego e a ideia de procedência celestial.
- source_word: ἐκ θρόνων βασιλείων
  choice: dos tronos reais
  rationale: Mantém o plural incomum do grego e o cenário régio, sem reduzi-lo a um único trono.
- source_word: ἀπότομος πολεμιστής
  choice: como guerreiro implacável
  rationale: ἀπότομος comunica severidade e força que não recua. “Implacável” preserva essa intensidade; “como” acomoda em português a diferença de gênero gramatical entre “palavra” e “guerreiro”, embora o grego apresente “guerreiro” em aposição direta.
- source_word: εἰς μέσον
  choice: para o meio de
  rationale: Expressa a entrada no interior da terra atingida pelo juízo, em linguagem clara e digna.
- source_word: τῆς ὀλεθρίας γῆς
  choice: da terra condenada à destruição
  rationale: ὀλέθριος pode indicar aquilo que causa destruição ou está destinado a ela. O contexto favorece a terra sob sentença de destruição, e a formulação explicita isso sem chamá-la simplesmente de “destrutiva”.
- source_word: ἥλατο
  choice: saltou
  rationale: Preserva a imagem vívida de um salto repentino e enérgico.
theological_decisions:
- issue: Se λόγος deve ser traduzido de modo a destacar uma interpretação cristológica posterior
  choice: palavra, em minúscula
  alternative: Palavra ou Verbo, com inicial maiúscula
  rationale: O contexto personifica a palavra eficaz de Deus, mas o grego não exige por si só uma identificação explícita com uma pessoa divina. A tradução mantém aberta a possibilidade interpretativa sem incorporá-la ao texto.
- issue: Como preservar a imagem militar e judicial
  choice: como guerreiro implacável
  alternative: como guerreiro severo
  rationale: A passagem descreve o juízo divino com imagem militar vigorosa. “Implacável” mantém a força de ἀπότομος sem acrescentar explicitamente a ideia mais extrema de ausência de misericórdia.
translation_notes:
  register: Português atual, amplamente internacional e de leitura natural no Brasil, com tom elevado. A construção “como guerreiro” evita uma discordância gramatical artificial entre o feminino português “palavra” e o masculino “guerreiro”, ao mesmo tempo que conserva a personificação e a imagem marcial do original.
