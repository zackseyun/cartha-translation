base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/002.yaml
  text: For even if we sin[a], we are yours, knowing your power; but we will not sin[c][b], knowing that we have been counted as yours.
translation:
  language: pt
  text: Pois, mesmo que pequemos, somos teus[a], conhecendo o teu poder[b]; mas não pecaremos, sabendo que fomos considerados teus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pertencemos a ti”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a tua força” ou “o teu domínio”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “que fomos contados como teus”. O verbo grego é um termo de contabilidade que também pode significar “considerar” ou “reconhecer”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Pois
  rationale: Introduz a explicação enfática em português natural; a ideia concessiva de καὶ é expressa por “mesmo” na oração seguinte.
- source_word: ἐὰν ἁμάρτωμεν
  choice: mesmo que pequemos
  rationale: O subjuntivo com ἐάν forma uma condição; “mesmo que” explicita a força concessiva presente no conjunto καὶ γὰρ ἐάν.
- source_word: σοὶ ἐσμεν
  choice: somos teus
  rationale: O dativo com o verbo “ser” indica relação ou pertencimento. A formulação é concisa e idiomática.
- source_word: εἰδότες
  choice: conhecendo / sabendo
  rationale: O particípio perfeito tem valor circunstancial, possivelmente causal. A variação evita rigidez em português sem alterar o sentido.
- source_word: σου τὸ κράτος
  choice: o teu poder
  rationale: κράτος pode indicar poder, força ou domínio. “Poder” preserva a amplitude do termo sem restringi-lo à autoridade governante.
- source_word: οὐχ ἁμαρτησόμεθα
  choice: não pecaremos
  rationale: Reproduz diretamente o futuro grego e mantém a tensão intencional com a possibilidade de pecado na primeira oração.
- source_word: ὅτι σοὶ λελογίσμεθα
  choice: que somos considerados teus
  rationale: O perfeito passivo de λογίζομαι comunica uma avaliação já estabelecida com resultado presente. “Somos considerados teus” é natural em português e preserva a ideia de reconhecimento como pertencentes a Deus; a metáfora de contagem é registrada em nota.
theological_decisions:
- issue: Tensão entre “mesmo que pequemos” e “não pecaremos”
  choice: Manter as duas afirmações sem harmonização.
  alternative: Interpretar a segunda como exortação (“não pequemos”) ou atenuá-la como propósito (“não queremos pecar”).
  rationale: O grego usa primeiro uma condição e depois uma declaração no futuro. A tradução conserva a tensão entre continuar pertencendo a Deus caso se peque e afirmar que não se pecará por saber desse pertencimento.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A estrutura paralela e a tensão verbal do grego foram preservadas; os pronomes de segunda pessoa mantêm o tom pessoal da oração.
