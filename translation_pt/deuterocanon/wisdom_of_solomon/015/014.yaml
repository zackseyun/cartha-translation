base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/014.yaml
  text: But all of them are most foolish and more miserable than an infant's soul—these enemies of your people who oppressed it.
translation:
  language: pt
  text: Todos eles, porém, são extremamente insensatos e mais dignos de pena que a alma de um bebê[a] — os inimigos do teu povo, que o oprimiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «mais miseráveis que a vida de um bebê» ou «mais dignos de pena que um bebê». O grego compara literalmente a condição deles com a «alma/vida de um bebê», expressão condensada que pode destacar extrema fragilidade ou uma condição digna de pena.
    reason: Alternativa lexical e preservação da ambiguidade de ψυχή.
lexical_decisions:
- source_word: πάντες
  choice: todos eles
  rationale: Preserva o alcance abrangente e prepara de modo natural a identificação posterior dos referentes como os inimigos do povo.
- source_word: ἀφρονέστατοι
  choice: extremamente insensatos
  rationale: Expressa claramente a força superlativa do adjetivo sem recorrer ao pouco natural «insensatíssimos».
- source_word: τάλανες ὑπὲρ
  choice: mais dignos de pena que
  rationale: Transmite a condição lamentável ou miserável indicada por τάλανες e reconhece o valor comparativo de ὑπέρ.
- source_word: ψυχὴν νηπίου
  choice: a alma de um bebê
  rationale: Mantém a imagem grega deliberadamente condensada, incluindo a amplitude semântica de ψυχή, enquanto «bebê» comunica de modo atual a pouca idade de νήπιος.
- source_word: οἱ ἐχθροὶ τοῦ λαοῦ σου
  choice: os inimigos do teu povo
  rationale: Reproduz a aposição que identifica quem são «todos eles», com tratamento singular natural e digno.
- source_word: οἱ καταδυναστεύσαντες αὐτόν
  choice: que o oprimiram
  rationale: «Oprimiram» comunica a dominação abusiva do verbo; «o» retoma corretamente o substantivo coletivo singular «povo», assim como o pronome grego retoma λαός.
theological_decisions:
- issue: Sentido da comparação ὑπὲρ ψυχὴν νηπίου
  choice: mais dignos de pena que a alma de um bebê
  alternative: mais miseráveis que a vida de um bebê; mais dignos de pena que um bebê
  rationale: A formulação conserva a comparação incomum e a ambiguidade de ψυχή entre «alma» e «vida», sem definir silenciosamente em que sentido a condição dos inimigos supera a fragilidade do bebê.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Emprega «teu» para conservar o discurso direto singular e «bebê» como termo corrente. A estranheza controlada de «alma de um bebê» preserva a imagem do grego, esclarecida em nota.
