base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/016.yaml
  text: For a man made them[a], and one who had borrowed the spirit formed them; for no man has the strength to fashion a god like himself.
translation:
  language: pt
  text: Pois foi um ser humano que os fez e, tendo tomado emprestado o espírito[a], os modelou; pois nenhum ser humano tem poder para modelar um deus semelhante a si mesmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o sopro de vida»; aqui, o termo grego para «espírito» também pode indicar o fôlego vital, ressaltando que a própria vida do fabricante lhe foi apenas emprestada.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: ser humano
  rationale: Mantém a força singular e genérica do grego, destacando a condição meramente humana do fabricante sem sugerir que o argumento se limite ao sexo masculino.
- source_word: ἐποίησεν
  choice: fez
  rationale: Verbo amplo e natural para a produção dos ídolos, sem especificar indevidamente o processo artesanal.
- source_word: τὸ πνεῦμα
  choice: o espírito
  rationale: Correspondência formal que preserva a amplitude de πνεῦμα, o qual neste contexto também pode designar o sopro vital.
- source_word: δεδανεισμένος
  choice: tomado emprestado
  rationale: Expressa que a vida do artesão é recebida e dependente, em contraste irônico com os deuses que ele fabrica.
- source_word: ἔπλασεν
  choice: modelou
  rationale: Conserva a imagem concreta de dar forma a uma matéria e diferencia adequadamente este verbo de ἐποίησεν.
- source_word: ἰσχύει
  choice: tem poder
  rationale: Comunica capacidade efetiva e preserva a ironia da pretensão humana de produzir uma divindade.
- source_word: πλάσαι
  choice: modelar
  rationale: Mantém a linguagem do trabalho artesanal e corresponde ao verbo cognato usado anteriormente.
- source_word: θεόν
  choice: um deus
  rationale: O contexto é uma crítica aos ídolos e às supostas divindades; por isso, emprega-se o substantivo comum em minúscula.
- source_word: αὐτῷ ὅμοιον
  choice: semelhante a si mesmo
  rationale: 'Preserva a referência reflexiva mais natural no contexto: o ser humano modela uma suposta divindade à sua própria semelhança.'
theological_decisions:
- issue: Sentido de «espírito tomado emprestado»
  choice: A vida ou o espírito do fabricante é algo recebido e dependente, não originado nele próprio.
  alternative: Entender πνεῦμα mais concretamente como «sopro» ou «sopro de vida», com maior ênfase na mortalidade física.
  rationale: A formulação principal mantém a amplitude do grego e o contraste teológico entre o artesão, que depende de vida recebida, e o ídolo sem vida que ele modela; a nota registra a nuance concreta possível.
- issue: Referente de «semelhante a si mesmo»
  choice: A expressão descreve o deus modelado à semelhança do próprio fabricante humano.
  alternative: Traduzir de modo menos reflexivo, como «semelhante a ele», preservando maior ambiguidade pronominal.
  rationale: A construção e o argumento imediato favorecem a referência ao ser humano que fabrica o ídolo, e a forma reflexiva em português comunica isso naturalmente sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, digno e de leitura ampla. «Ser humano» evita a possível leitura exclusivamente masculina de «homem», sem perder o singular retórico. A repetição de «modelou/modelar» conserva a ligação lexical do grego e reforça a ironia artesanal do versículo.
