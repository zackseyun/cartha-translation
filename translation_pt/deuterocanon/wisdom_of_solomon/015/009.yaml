base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/009.yaml
  text: Yet his concern is not that he is about to grow weary[a], nor that his life is short; rather, he competes with goldsmiths and silversmiths, imitates bronze-workers[b], and considers it a glory that he molds counterfeit things.
translation:
  language: pt
  text: No entanto, não se preocupa com estar prestes a se cansar, nem com ter uma vida breve; pelo contrário, rivaliza[a] com os artífices do ouro e da prata, imita os artesãos do bronze e considera uma glória moldar objetos falsos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “compete”.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “objetos adulterados”, “coisas fraudulentas” ou “imitações de qualidade inferior”.
    reason: lexical_alternative
lexical_decisions:
- source_word: φροντίς
  choice: preocupação
  rationale: Expressa aquilo que ocupa a mente do artesão sem acrescentar necessariamente a ideia de angústia emocional.
- source_word: μέλλει κάμνειν
  choice: esteja prestes a se cansar
  rationale: Preserva o valor prospectivo de μέλλει e o sentido comum de κάμνειν como cansar-se ou ficar exausto, mantendo a referência à fragilidade humana.
- source_word: βραχυτελῆ βίον
  choice: tenha uma vida breve
  rationale: Reproduz de modo natural a ideia de uma vida cuja duração chega rapidamente ao fim.
- source_word: ἀντερείδεται
  choice: rivaliza
  rationale: Comunica a atitude competitiva do artesão diante dos trabalhadores de metais preciosos; a nota registra a alternativa idiomática.
- source_word: χρυσουργοῖς καὶ ἀργυροχόοις
  choice: com os artífices do ouro e da prata
  rationale: Mantém o paralelismo entre as duas profissões sem depender de termos ocupacionais que podem variar regionalmente.
- source_word: χαλκοπλάστας
  choice: artesãos do bronze
  rationale: Identifica claramente os profissionais que dão forma ao bronze ou cobre no contexto da fabricação de imagens.
- source_word: μιμεῖται
  choice: imita
  rationale: Verte diretamente o verbo e ressalta o caráter derivativo de seu trabalho.
- source_word: δόξαν ἡγεῖται
  choice: considera uma glória
  rationale: Conserva a linguagem elevada e a ironia moral do grego, em vez de reduzi-la apenas à ideia de satisfação profissional.
- source_word: κίβδηλα
  choice: objetos falsos
  rationale: O adjetivo substantivado pode designar coisas falsas, adulteradas ou espúrias; 'objetos falsos' preserva a amplitude sem ocultar a censura do contexto.
- source_word: πλάσσει
  choice: moldar
  rationale: Adequa-se ao trabalho artesanal de dar forma a imagens e conserva a concretude do verbo.
theological_decisions:
- issue: Força moral da referência à fabricação de ídolos
  choice: A tradução preserva a condenação irônica do artesão, que ignora a brevidade da própria vida e se gloria em produzir objetos falsos.
  alternative: Ler κίβδηλα de modo mais neutro como simples imitações artesanais.
  rationale: O contexto imediato de Sabedoria 15 censura a fabricação de ídolos. 'Objetos falsos' mantém essa avaliação presente no texto sem acrescentar uma formulação doutrinária externa.
- issue: Sentido da fragilidade expressa por κάμνειν
  choice: Traduzir como o cansaço que está por vir.
  alternative: Entender o verbo como adoecer, sucumbir ou morrer.
  rationale: O sentido de cansar-se é lexicalmente direto e preserva a formulação da fonte consultada, enquanto o contexto de vida breve já explicita separadamente a mortalidade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência de ofícios foi formulada como “artífices do ouro e da prata” e “artesãos do bronze” para evitar regionalismos. Os marcadores foram posicionados junto às expressões às quais suas notas efetivamente se referem.
