base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/004.yaml
  text: For neither did the evil-crafted invention of men lead us astray[a], nor the fruitless labor of a painter of shadows—an image stained with varied colors[b];
translation:
  language: pt
  text: Pois não nos desviou a invenção humana, engenhosa para o mal,[a] nem o trabalho infrutífero dos pintores de sombras — uma imagem manchada de cores variadas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enganou”. O verbo grego pode indicar tanto enganar quanto fazer alguém se afastar do caminho certo.
    reason: lexical_alternative
  - marker: b
    text: “Pintores de sombras” refere-se a artistas que trabalhavam com contornos ou sombreamento; aqui, a expressão critica os fabricantes de imagens pintadas de ídolos.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπλάνησεν
  choice: nos desviou
  rationale: Preserva a ideia de afastar alguém do caminho certo e, em português natural, também permite o sentido de induzir ao erro.
- source_word: ἀνθρώπων κακότεχνος ἐπίνοια
  choice: a invenção humana, engenhosa para o mal
  rationale: Expressa tanto a inventividade ou elaboração artesanal quanto a avaliação moral negativa de κακότεχνος, sem recorrer a uma construção portuguesa artificial.
- source_word: σκιαγράφων
  choice: dos pintores de sombras
  rationale: Mantém a referência concreta a artistas que trabalham com contornos ou sombreamento; o plural acompanha a forma grega e evita reduzir o termo simplesmente a 'artistas'.
- source_word: πόνος ἄκαρπος
  choice: trabalho infrutífero
  rationale: Conserva a imagem de um esforço que não produz fruto nem verdadeiro benefício.
- source_word: εἶδος
  choice: imagem
  rationale: No contexto da fabricação de ídolos, designa naturalmente uma representação visível e produzida.
- source_word: σπιλωθὲν
  choice: manchada
  rationale: Preserva o sentido visual de uma superfície marcada ou coberta, mantendo também a conotação depreciativa do original.
- source_word: χρώμασιν διηλλαγμένοις
  choice: de cores variadas
  rationale: Traduz de modo conciso as cores ou pigmentos diferentes entre si.
theological_decisions:
- issue: Preservar a censura moral à arte idolátrica sem condenar indistintamente toda produção artística
  choice: A tradução liga 'engenhosa para o mal' à invenção humana em questão e mantém a descrição concreta da imagem pintada.
  alternative: Uma formulação mais neutra poderia falar apenas de 'invenção habilidosa' ou 'produção artística'.
  rationale: κακότεχνος contém uma avaliação moral negativa, enquanto o contexto e o vocabulário artístico mostram que a crítica recai sobre a fabricação enganadora de imagens idolátricas, não sobre toda arte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo negativo do grego e usa dois-pontos para esclarecer que “uma imagem” descreve o produto do trabalho artístico. Todos os marcadores de nota aparecem no texto.
