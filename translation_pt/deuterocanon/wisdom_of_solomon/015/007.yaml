base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/007.yaml
  text: For a potter[a], kneading soft earth with toil, molds each vessel for our service; yet from the same clay he formed both the vessels that are slaves to clean uses and those for the contrary, all alike. But which is the use of each of them, the potter is the judge.
translation:
  language: pt
  text: Pois o oleiro, trabalhando com esforço a terra macia, molda cada peça para o nosso serviço; mas, do mesmo barro, modelou tanto os utensílios escravizados a usos puros[a] como os utensílios para usos contrários, todos da mesma maneira. O oleiro é quem decide qual será o uso de cada um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de maneira mais fluente, “os utensílios destinados a usos puros”. O grego diz literalmente “os utensílios escravizados a obras/usos puros”, empregando “escravizados” como metáfora de uma função atribuída.
    reason: lexical_alternative
lexical_decisions:
- source_word: κεραμεύς
  choice: oleiro
  rationale: Termo português natural e preciso para quem trabalha e molda o barro.
- source_word: ἁπαλὴν γῆν
  choice: terra macia
  rationale: Preserva a formulação literal com γῆ, distinguindo-a de πηλός, traduzido depois por “barro”.
- source_word: θλίβων ἐπίμοχθον
  choice: trabalhando com esforço
  rationale: Reúne a ideia de comprimir ou trabalhar o material e a noção explícita de labor penoso, sem especificar excessivamente o gesto.
- source_word: πλάσσει ... ἕκαστον
  choice: molda cada peça
  rationale: “Molda” corresponde ao trabalho do oleiro; “peça” explicita de modo natural o objeto implícito sem antecipar σκεύη como “utensílios”.
- source_word: πρὸς ὑπηρεσίαν ἡμῶν
  choice: para o nosso serviço
  rationale: Mantém a nuance de serviço e utilidade prática do original.
- source_word: ἐκ τοῦ αὐτοῦ πηλοῦ
  choice: do mesmo barro
  rationale: “Barro” é o equivalente corrente no contexto da olaria e distingue πηλός da anterior “terra”.
- source_word: ἀνεπλάσατο
  choice: modela
  rationale: Mantém o campo semântico da formação e evita repetir imediatamente “molda”.
- source_word: τὰ τῶν καθαρῶν ἔργων δοῦλα σκεύη
  choice: os utensílios escravizados a usos puros
  rationale: Preserva a metáfora forte de δοῦλα como submissão funcional, enquanto “usos puros” comunica καθαρῶν ἔργων no contexto.
- source_word: τὰ ἐναντία
  choice: os destinados ao contrário
  rationale: Conserva a expressão elíptica do grego sem explicitar “impuros”, palavra que o texto não emprega.
- source_word: πάνθʼ ὁμοίως
  choice: todos da mesma maneira
  rationale: Expressa que ambos os tipos são produzidos de modo semelhante.
- source_word: κριτὴς ὁ πηλουργός
  choice: O oleiro é quem decide
  rationale: Traduz idiomaticamente a função de “juiz” quanto ao uso de cada utensílio, sem sugerir uma cena judicial.
theological_decisions:
- issue: Metáfora de δοῦλα aplicada aos utensílios
  choice: “utensílios escravizados a usos puros”
  alternative: “utensílios destinados a usos puros”
  rationale: A redação principal conserva a metáfora de servidão ou submissão funcional presente no grego. A nota oferece a formulação mais fluente, sem apagar silenciosamente a imagem.
- issue: Contraste expresso por τὰ ἐναντία
  choice: “os destinados ao contrário”
  alternative: “os destinados a usos impuros”
  rationale: O original deixa o segundo uso elíptico como “o contrário”; não se introduz na tradução principal uma qualificação teológica mais explícita do que a fonte.
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário amplamente compreensível no Brasil e internacionalmente. A ordem final foi ajustada para clareza natural, preservando que o oleiro determina o uso de cada peça.
