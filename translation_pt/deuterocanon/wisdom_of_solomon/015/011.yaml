lexical_decisions:
- source_word: ἠγνόησεν
  choice: não conheceu
  rationale: Expressa de modo direto a ideia de ignorar ou não reconhecer, sem definir se essa falta de conhecimento era meramente factual ou culpável.
- source_word: πλάσαντα
  choice: formou
  rationale: Preserva a imagem do Criador que dá forma ao ser humano, sem acrescentar um material ou método não mencionado no grego.
- source_word: ἐμπνεύσαντα αὐτῷ
  choice: lhe insuflou
  rationale: Comunica a ação concreta de introduzir o sopro em alguém e mantém a ressonância da linguagem de criação.
- source_word: ψυχὴν ἐνεργοῦσαν
  choice: uma alma atuante
  rationale: Mantém ψυχή como «alma» e traduz ἐνεργοῦσαν em seu sentido de ativa ou operante, evitando substituí-lo interpretativamente por «viva».
- source_word: ἐμφυσήσαντα
  choice: soprou nele
  rationale: Conserva a segunda imagem de comunicação do sopro e torna explícito em português o destinatário já indicado pelo paralelismo da frase.
- source_word: πνεῦμα ζωτικόν
  choice: um espírito vivificante
  rationale: Preserva πνεῦμα como «espírito» e o valor de ζωτικός como aquilo que comunica ou sustenta a vida, sem assimilar inteiramente a expressão a «sopro de vida».
theological_decisions:
- issue: Distinção antropológica entre ψυχή e πνεῦμα
  choice: Traduzir distintamente como «alma» e «espírito»
  alternative: Verter ambos de modo mais genérico como «vida» ou «sopro»
  rationale: O grego emprega dois substantivos diferentes em paralelismo. A tradução conserva essa distinção retórica sem impor uma antropologia sistemática posterior.
- issue: Identidade daquele que forma e sopra
  choice: Manter a coordenação «aquele que... nem aquele que...»
  alternative: Explicitar que todas as ações pertencem a um único Criador
  rationale: Embora o contexto indique o Criador, a tradução preserva a estrutura participial coordenada do grego sem acrescentar uma explicação teológica ao corpo do versículo.
translation_notes:
  register: Português moderno, digno e de leitura natural, com vocabulário acessível. «Insuflou» foi mantido por sua precisão na imagem de introduzir o sopro, enquanto «soprou nele» evita repetição mecânica e preserva o paralelismo. A construção «nem aquele» exprime naturalmente, após a negação inicial, o segundo καί coordenativo.
