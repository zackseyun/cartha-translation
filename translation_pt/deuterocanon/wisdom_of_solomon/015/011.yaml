translation:
  language: pt
  text: pois não conheceu[a] aquele que o formou, lhe insuflou uma alma ativa[b] e soprou nele um espírito vivificante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não reconheceu».'
    reason: lexical_alternative
