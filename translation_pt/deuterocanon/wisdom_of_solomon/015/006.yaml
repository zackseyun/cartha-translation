base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/006.yaml
  text: Lovers of evil are worthy of such hopes[b][a], both those who make them and those who desire them and those who worship them.
translation:
  language: pt
  text: 'Os que amam o mal são dignos de esperanças como essas[a]: tanto os que os fabricam[b] como os que os desejam e os que os adoram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dignos de tais esperanças”. A expressão remete às expectativas depositadas nos ídolos no contexto ao redor.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os que fazem” ou “os que agem”. No contexto, trata-se dos que fazem ou fabricam os ídolos.
    reason: lexical_alternative
lexical_decisions:
- source_word: κακῶν ἐρασταί
  choice: os que amam o mal
  rationale: Expressa de modo natural e direto o substantivo ἐρασταί regido pelo genitivo plural κακῶν, preservando a acusação moral sem sugerir apenas males isolados.
- source_word: ἄξιοί τε τοιούτων ἐλπίδων
  choice: são dignos de esperanças como essas
  rationale: Mantém a linguagem de merecimento de ἄξιοι e a força retrospectiva de τοιούτων, embora a formulação conserve a tensão irônica de serem 'dignos' de esperanças ligadas aos ídolos.
- source_word: οἱ δρῶντες
  choice: os que os fabricam
  rationale: δράω significa literalmente fazer ou realizar; no contexto imediato, o objeto implícito são os ídolos produzidos por mãos humanas. 'Fabricam' torna esse sentido contextual claro sem inserir uma identificação denominacional.
- source_word: οἱ ποθοῦντες
  choice: os que os desejam
  rationale: ποθέω indica desejo ou anseio intenso. 'Desejam' é atual, claro e digno, sem intensificar além do que o contexto exige.
- source_word: οἱ σεβόμενοι
  choice: os que os adoram
  rationale: No contexto religioso dos ídolos, σέβομαι denota reverência cultual; 'adoram' comunica esse sentido de modo inequívoco ao leitor moderno.
theological_decisions:
- issue: Objeto implícito dos três particípios
  choice: Empregar o pronome masculino plural 'os', remetendo aos ídolos do contexto, e traduzir οἱ δρῶντες como seus fabricantes.
  alternative: Deixar o objeto sem expressão — 'os que fazem, os que desejam e os que adoram' — ou entender δρῶντες genericamente como 'os que praticam essas coisas'.
  rationale: O grego omite o objeto por ser recuperável do contexto anterior sobre imagens idólatras. Em português, explicitar o pronome evita uma construção truncada; o sentido de fabricar ídolos para δρῶντες decorre do contexto, não de uma definição teológica acrescentada.
- issue: Força de ἄξιοι com 'esperanças como essas'
  choice: Preservar a expressão 'dignos de', inclusive sua possível carga irônica e condenatória.
  alternative: Verter de modo mais interpretativo como 'merecem o resultado de esperanças como essas'.
  rationale: A formulação grega associa essas pessoas às esperanças próprias dos ídolos sem explicitar diretamente o resultado. A tradução conserva essa tensão em vez de resolver o sentido como punição ou frustração.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A construção paralela 'tanto... como...' reproduz a enumeração grega com clareza, e os termos 'fabricam', 'desejam' e 'adoram' distinguem naturalmente a produção, a atração e o culto aos ídolos.
