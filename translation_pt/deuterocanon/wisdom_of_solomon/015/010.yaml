  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/010.yaml
  text: His heart is ashes[a], and his hope is more worthless than earth, and his life more dishonored than clay[b],
translation:
  language: pt
  text: Seu coração é cinza, sua esperança vale menos que a terra[a], e sua vida é mais desprezível que o barro[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o solo”; o comparativo grego ressalta o valor extremamente baixo dessa esperança.
    reason: lexical_alternative
  - marker: b
    text: Ou “menos digno de honra que o barro”; o termo grego enfatiza falta de honra ou estima.
    reason: lexical_alternative
lexical_decisions:
- source_word: σποδός
  choice: cinza
  rationale: Como predicativo metafórico, descreve de modo incisivo a condição interior reduzida a algo morto e sem valor; no português corrente, o singular coletivo é natural.
- source_word: καρδία
  choice: coração
  rationale: Conserva o termo antropológico bíblico e sua amplitude, sem restringi-lo a mente ou emoções.
- source_word: γῆς
  choice: terra
  rationale: O genitivo estabelece o padrão da comparação; “terra” preserva o sentido material amplo e a ligação imagética com o barro.
- source_word: εὐτελεστέρα
  choice: vale menos
  rationale: Expressa naturalmente em português a inferioridade de valor indicada pelo comparativo, evitando a formulação pouco idiomática “mais sem valor”.
- source_word: ἐλπίς
  choice: esperança
  rationale: É a equivalência direta e mantém a força da confiança mal colocada no contexto.
- source_word: πηλοῦ
  choice: barro
  rationale: Adequa-se ao contexto de objetos moldados e é a designação corrente e digna do material em português.
- source_word: ἀτιμότερος
  choice: mais desprezível
  rationale: Transmite a falta de honra ou estima e funciona como comparação direta com o barro; “mais desonrada” poderia sugerir principalmente uma desonra sofrida.
- source_word: βίος
  choice: vida
  rationale: Na tríade coração, esperança e vida, refere-se naturalmente à existência da pessoa como um todo.
theological_decisions:
- issue: Força metafórica dos três predicados que descrevem o idólatra
  choice: 'Manter afirmações diretas: o coração é cinza, a esperança vale menos que a terra e a vida é mais desprezível que o barro.'
  alternative: Explicitar comparações, como “o coração é como cinza”, ou parafrasear a condição psicológica.
  rationale: O grego emprega predicados nominais diretos e comparativos contundentes. A formulação conserva a retórica severa da polêmica contra a idolatria sem suavizá-la nem ampliá-la doutrinariamente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem paralela do grego foi preservada. “Vale menos” favorece naturalidade sem perder a comparação de valor; “mais desprezível” retém a dimensão de desonra e estima. A vírgula final acompanha a continuidade sintática indicada no texto fornecido.
