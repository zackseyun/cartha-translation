base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/005.yaml
  text: The sight of them comes to fools as a reproach[a], and they long for the form of a lifeless image.
translation:
  language: pt
  text: A aparência delas torna-se motivo de vergonha para os insensatos e deseja a forma de uma imagem morta, sem sopro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego «deseja» está no singular e, gramaticalmente, pode retomar «a aparência», produzindo uma construção comprimida e incomum. Pelo contexto, também se pode entender que os insensatos são os que desejam a forma da imagem morta, sem sopro.
    reason: Ambiguidade sintática e alternativa contextual de tradução.
lexical_decisions:
- source_word: ὄψις
  choice: aparência
  rationale: O termo pode indicar visão, aspecto ou aparência. “A aparência delas” se encaixa naturalmente como sujeito da oração e conserva a referência ao aspecto visível das imagens.
- source_word: ἄφροσιν
  choice: para os insensatos
  rationale: Ἄφρων designa quem carece de bom senso ou sabedoria. “Insensatos” mantém o contraste moral característico do livro sem soar coloquial demais.
- source_word: εἰς ὄνειδος
  choice: motivo de vergonha
  rationale: A expressão indica resultado ou caracterização. “Motivo de vergonha” comunica de modo idiomático o valor de ὄνειδος como vergonha, desonra ou censura.
- source_word: ἔρχεται
  choice: torna-se
  rationale: Embora o verbo signifique literalmente “vem”, com εἰς e um predicativo de resultado o português natural pede “torna-se”, sem alterar o sentido da construção.
- source_word: ποθεῖ
  choice: eles desejam
  rationale: O verbo grego está no singular, mas a sintaxe é comprimida e seu sujeito não é claro. No contexto, os insensatos são os que se sentem atraídos pela imagem; o plural explícito produz uma leitura clara, enquanto a nota registra a forma e a ambiguidade do grego.
- source_word: νεκρᾶς εἰκόνος
  choice: de uma imagem morta
  rationale: A tradução preserva a linguagem deliberadamente forte da polêmica contra os ídolos, em vez de reduzir νεκρά a uma simples ideia de objeto inanimado.
- source_word: εἶδος
  choice: a forma
  rationale: Εἶδος indica a forma ou configuração visível. “Forma” evita repetir “aparência” e conserva a referência ao aspecto exterior.
- source_word: ἄπνουν
  choice: sem sopro
  rationale: O adjetivo significa literalmente “sem respiração”. “Sem sopro” é conciso, digno e preserva a imagem bíblica do sopro vital, sem fundi-la inteiramente com “morta”.
theological_decisions:
- issue: A sintaxe do desejo na crítica aos ídolos
  choice: O sujeito de “desejam” é explicitado como “eles”, retomando os insensatos.
  alternative: 'Manter o verbo no singular e ligá-lo gramaticalmente a “aparência”: “e deseja a forma sem sopro de uma imagem morta”.'
  rationale: A forma singular ποθεῖ cria uma construção difícil e potencialmente personifica a aparência. O contexto favorece os insensatos como agentes do desejo, mas a nota conserva a ambiguidade real em vez de ocultá-la.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A expressão “sem sopro” preserva a imagem concreta do original; “imagem morta” mantém a força da crítica aos ídolos. A nota evita apresentar como inequívoca a identificação contextual do sujeito de ποθεῖ.
