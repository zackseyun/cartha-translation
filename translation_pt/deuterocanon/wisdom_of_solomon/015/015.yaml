base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/015.yaml
  text: For they even considered all the idols of the nations to be gods—things that have neither the use of eyes for seeing[a], nor noses for drawing in air, nor ears to hear, nor fingers of hands for feeling, and their feet are useless for walking.
translation:
  language: pt
  text: Pois chegaram a considerar deuses todos os ídolos das nações, os quais não têm olhos para ver, nem narinas para aspirar o ar, nem ouvidos para ouvir, nem dedos nas mãos para tatear; e seus pés são inúteis para andar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλογίσαντο
  choice: chegaram a considerar
  rationale: Expressa o ato de reputar ou ter algo por determinada coisa; a construção portuguesa é natural e preserva o caráter avaliativo do verbo.
- source_word: εἴδωλα
  choice: ídolos
  rationale: No contexto polêmico, designa imagens cultuais tratadas indevidamente como deuses; “ídolos” comunica tanto o objeto físico quanto a crítica religiosa.
- source_word: ἐθνῶν
  choice: das nações
  rationale: É uma tradução direta e adequada ao contexto sapiencial judaico, sem introduzir desnecessariamente a formulação neotestamentária “gentios”.
- source_word: ὀμμάτων χρῆσις εἰς ὅρασιν
  choice: olhos que possam ver
  rationale: Reproduz de modo idiomático a ideia concreta de não possuírem o uso ou a função dos olhos para enxergar.
- source_word: συνολκὴν ἀέρος
  choice: puxar o ar
  rationale: Preserva a imagem de trazer ou puxar o ar para dentro, em vez de reduzir a expressão simplesmente a “respirar”.
- source_word: δάκτυλοι χειρῶν εἰς ψηλάφησιν
  choice: dedos nas mãos para apalpar
  rationale: “Apalpar” exprime a percepção pelo toque indicada por ψηλάφησις; “dedos nas mãos” é corrente em português e mantém a referência explícita às mãos.
- source_word: ἀργοὶ πρὸς ἐπίβασιν
  choice: incapazes de caminhar
  rationale: Comunica claramente que os pés são inativos ou sem utilidade para dar passos e locomover-se, sem sugerir mera lentidão.
theological_decisions:
- issue: Força da polêmica contra os ídolos
  choice: Apresentar diretamente os ídolos como objetos sem percepção ou locomoção, embora considerados deuses.
  alternative: Suavizar a passagem como uma descrição genérica de imagens religiosas.
  rationale: A enumeração grega ridiculariza deliberadamente a impotência das imagens cultuais; a tradução conserva essa força sem acrescentar comentário doutrinário.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A enumeração anatômica foi ligeiramente naturalizada, mas a progressão do grego — visão, respiração, audição, tato e locomoção — foi preservada.
