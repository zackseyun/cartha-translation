  text: But he considered our life to be a game[a], and our way of life a profitable festival; for, he says, one must get resources from wherever one can[b], even from evil.
translation:
  language: pt
  text: Mas ele considerou a nossa vida uma brincadeira[a] e o nosso modo de viver uma festa lucrativa; pois, diz ele, é preciso obter recursos de qualquer fonte[b], até mesmo do mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um brinquedo”.'
    reason: παίγνιον pode designar tanto uma diversão quanto algo usado para brincar.
  - marker: b
    text: 'Ou: “é preciso obter ganho de qualquer fonte, até mesmo por meios maus”.'
    reason: A expressão pode enfatizar que o ganho é obtido por meios moralmente maus, sem excluir a ideia de procedência ampla.
lexical_decisions:
- source_word: ἐλογίσατο
  choice: considerou
  rationale: Expressa uma avaliação deliberada e corresponde naturalmente ao aoristo de λογίζομαι.
- source_word: παίγνιον
  choice: brincadeira
  rationale: Preserva a ideia de algo tratado como diversão ou jogo, sem impor o tom mais coloquial de “piada” nem a nuance objetiva de “brinquedo”.
- source_word: ζωὴν
  choice: vida
  rationale: É o equivalente usual e permite manter a variação retórica em relação a βίον.
- source_word: βίον
  choice: modo de viver
  rationale: Distingue βίος de ζωή e se ajusta ao contexto ético e econômico sem restringir o termo apenas a sustento material.
- source_word: πανηγυρισμὸν
  choice: festa
  rationale: Comunica de modo natural a imagem de uma celebração festiva; o adjetivo seguinte acrescenta a dimensão mercenária.
- source_word: ἐπικερδῆ
  choice: lucrativa
  rationale: Mantém claramente a ideia de ganho econômico que qualifica a festa.
- source_word: δεῖν
  choice: é preciso
  rationale: Forma idiomática e impessoal de expressar necessidade em português.
- source_word: ὅθεν δὴ κἂν
  choice: de onde quer que seja
  rationale: Reproduz a abrangência enfática e a indiferença quanto à origem do ganho.
- source_word: ἐκ κακοῦ
  choice: do mal
  rationale: Preserva a categoria moral ampla do grego sem explicitar além do texto se se trata de atos maus ou de circunstâncias ruins.
- source_word: πορίζειν
  choice: obter recursos
  rationale: Torna explícito o sentido aquisitivo e material do verbo, mantendo linguagem atual.
theological_decisions:
- issue: Força moral de ἐκ κακοῦ
  choice: “do mal”, indicando que o personagem aceita obter recursos por uma fonte moralmente má
  alternative: “de uma situação ruim” ou “por meio da maldade”
  rationale: O contexto de ganância e corrupção favorece a leitura moral, mas a formulação ampla e a nota preservam a possível nuance circunstancial ou instrumental.
