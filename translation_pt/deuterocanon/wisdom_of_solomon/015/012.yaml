  - severity: low
    issue: “De onde quer que seja” é menos direto em português para a origem de recursos.
    rationale: “De qualquer fonte” expressa com naturalidade a abrangência de ὅθεν e evita uma construção que pode soar elíptica ou referir-se a lugar de modo excessivamente literal.
