  source_fidelity: A tradução preserva bem a estrutura e o contraste de ζωή (“vida”) com βίος (“modo de viver”), bem como a avaliação deliberada de ἐλογίσατο. “Brincadeira”, “festa lucrativa”, “é preciso” e “do mal” são escolhas defensáveis. No entanto, a nota b atual desloca indevidamente a expressão de origem (“de onde quer que seja”) para maneira (“de qualquer maneira”) e especifica “praticando o mal”, mais do que o grego exige.
  naturalness: O texto é claro e de registro moderno. “De qualquer fonte” é mais idiomático e preciso que “de onde quer que seja” neste contexto de aquisição. A pontuação sem a vírgula após “viver” mantém melhor o fluxo.
  terminology: “Recursos” comunica de modo aceitável o sentido aquisitivo de πορίζειν. “Do mal” conserva a amplitude moral de ἐκ κακοῦ sem decidir entre uma fonte má, meios maus ou circunstâncias más. A alternativa deve refletir essa ambiguidade, sem a reduzir a “praticando o mal”.
