  text: Mas tu, nosso Deus, és bondoso e verdadeiro, paciente e governas todas as coisas com misericórdia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Mas tu
  rationale: Preserva o contraste marcado por δέ e a interpelação direta, em português claro e natural.
- source_word: χρηστός
  choice: bondoso
  rationale: Expressa a bondade benevolente do termo grego e funciona naturalmente como atributo pessoal de Deus.
- source_word: ἀληθής
  choice: verdadeiro
  rationale: Mantém a amplitude do grego, que pode descrever Deus como verdadeiro ou genuíno, sem restringir o sentido apenas à veracidade da fala.
- source_word: μακρόθυμος
  choice: paciente
  rationale: Comunica em linguagem atual a ideia de longanimidade, tolerância e lentidão para irar-se.
- source_word: ἐλέει
  choice: com misericórdia
  rationale: Conserva a forma substantiva do grego e expressa a misericórdia como modo pelo qual Deus governa.
- source_word: διοικῶν
  choice: governas
  rationale: O particípio presente integra a descrição predicativa de Deus. A forma verbal finita produz português mais natural, mantendo a ideia de governo contínuo.
- source_word: τὰ πάντα
  choice: todas as coisas
  rationale: Preserva a abrangência e a formulação solene da expressão grega sem ampliá-la para uma referência explícita ao universo.
theological_decisions:
- issue: O governo divino e a misericórdia na oração participial
  choice: Deus governa todas as coisas com misericórdia.
  alternative: Deus administra ou ordena todas as coisas misericordiosamente.
  rationale: A tradução mantém juntas a abrangência do governo divino e a misericórdia que caracteriza seu exercício, sem desenvolver além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação verbal «és ... e governas» evita a construção pouco natural «és ... governando», sem perder o valor descritivo e presente do particípio grego.
