base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/017.yaml
  text: Yet being mortal[a], he makes a dead thing with lawless hands; for he is better than the things he worships, since he himself once lived, but those never did.
translation:
  language: pt
  text: 'Mas, sendo mortal, ele fabrica uma coisa morta com mãos transgressoras; pois é superior às coisas que adora[a]: ele próprio teve vida, mas elas nunca tiveram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos seus ídolos”.'
    reason: Alternativa lexical contextual para τῶν σεβασμάτων αὐτοῦ.
lexical_decisions:
- source_word: θνητὸς
  choice: mortal
  rationale: Expressa de modo conciso aquele que está sujeito à morte e mantém o contraste com o objeto inteiramente sem vida.
- source_word: νεκρὸν
  choice: uma coisa morta
  rationale: O adjetivo substantivado designa algo morto; esta formulação evita a ideia indevida de um cadáver e preserva a contundência da crítica aos ídolos.
- source_word: ἐργάζεται
  choice: fabrica
  rationale: No contexto da produção de um ídolo, indica fazer ou produzir; “fabrica” é claro e natural em português.
- source_word: χερσὶν ἀνόμοις
  choice: com mãos transgressoras
  rationale: Preserva tanto o valor instrumental da expressão quanto a noção de mãos que agem contra a lei, sem recorrer à formulação pouco idiomática “mãos sem lei”.
- source_word: κρείττων
  choice: superior
  rationale: Indica a superioridade do artífice vivo sobre aquilo que ele próprio produz e venera.
- source_word: τῶν σεβασμάτων αὐτοῦ
  choice: às coisas que adora
  rationale: Comunica que são objetos de veneração ou culto sem substituir o termo grego diretamente pelo mais interpretativo “ídolos”.
- source_word: ἔζησεν
  choice: teve vida
  rationale: O aoristo afirma que o fabricante possuiu vida, em contraste com os objetos que jamais a possuíram; a formulação portuguesa mantém esse contraste sem acrescentar uma cronologia desnecessária.
- source_word: οὐδέποτε
  choice: nunca tiveram
  rationale: Nega que os objetos de culto tenham tido vida em qualquer momento e explicita naturalmente em português o verbo subentendido.
theological_decisions:
- issue: Sentido de σεβάσματα no contexto da crítica à idolatria
  choice: coisas que adora
  alternative: seus ídolos
  rationale: A opção escolhida conserva o sentido lexical de coisas veneradas ou adoradas e deixa que o contexto revele que se trata de ídolos, sem tornar o texto mais interpretativo do que o grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o contraste retórico entre o artesão mortal, que teve vida, e os objetos de culto, que nunca a tiveram.
