base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/008.yaml
  text: And with wicked toil he molds a futile god from the same clay—he who a little before had come from the earth[a], and after a short time goes back to the earth from which he was taken, when the debt of his soul is demanded.
translation:
  language: pt
  text: E o homem de labor penoso molda, do mesmo barro, um deus vão — ele que, pouco antes, veio da terra e, em pouco tempo, volta para a terra da qual foi tirado, quando lhe é cobrada a dívida de sua alma[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a dívida de sua vida”. A palavra grega ψυχή pode significar “alma” ou “vida”.'
    reason: Alternativa lexical genuína para ψυχή no contexto da morte.
lexical_decisions:
- source_word: κακόμοχθος
  choice: com trabalho perverso
  rationale: 'A expressão preserva os dois componentes do termo: o trabalho penoso e seu caráter mau ou moralmente corrompido. A construção adverbial é natural em português.'
- source_word: θεὸν μάταιον
  choice: um deus inútil
  rationale: μάταιος indica aquilo que é vão, vazio ou sem eficácia. “Inútil” comunica com clareza a ironia de uma divindade fabricada e impotente.
- source_word: πλάσσει
  choice: molda
  rationale: O verbo descreve adequadamente o ato de dar forma ao barro e mantém a imagem do oleiro.
- source_word: ἐκ τοῦ αὐτοῦ πηλοῦ
  choice: do mesmo barro
  rationale: Mantém explícita a identidade do material usado tanto para o ídolo quanto para os demais objetos de cerâmica.
- source_word: ὃς
  choice: ele, que
  rationale: Explicita que o pronome relativo retoma o artesão, e não o deus fabricado.
- source_word: πρὸ μικροῦ ἐκ γῆς γενηθεὶς
  choice: que pouco antes veio da terra
  rationale: Preserva a ideia ampla de ter vindo à existência a partir da terra, sem restringir γενηθεὶς a “nascer” ou “ser feito”.
- source_word: μετʼ ὀλίγον πορεύεται
  choice: em pouco tempo, volta
  rationale: O contexto da frase indica retorno à terra. O presente “volta” conserva o aspecto sentencioso e vívido do grego.
- source_word: ἐξ ἧς ἐλήμφθη
  choice: para a terra da qual foi tirado
  rationale: Repete “terra” para clareza e preserva a evocação da criação do ser humano a partir dela.
- source_word: τὸ τῆς ψυχῆς ἀπαιτηθεὶς χρέος
  choice: quando lhe é cobrada a dívida de sua alma
  rationale: Mantém a metáfora de χρέος, “dívida”, e a força de ἀπαιτέω, “cobrar” ou “exigir de volta”. “Alma” representa diretamente ψυχή, sem ocultar a alternativa contextual “vida”.
theological_decisions:
- issue: Sentido de ψυχή no contexto da mortalidade
  choice: alma
  alternative: vida
  rationale: ψυχή pode designar tanto a alma quanto a vida. “Alma” preserva a linguagem antropológica e o peso moral do texto; “vida” continua sendo uma leitura lexicalmente possível e é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe clara. O travessão destaca o contraste irônico entre o deus moldado e a mortalidade de quem o fabrica. A formulação preserva a metáfora da dívida e a ambiguidade de ψυχή.
