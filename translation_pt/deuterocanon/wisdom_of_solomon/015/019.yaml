  text: nor is it so beautiful in the sight of living creatures as to be desired[b][a]; but it has escaped both the praise of God and his blessing.
translation:
  language: pt
  text: nem é belo o bastante para ser desejado, como o são os seres vivos em sua aparência.[a] Mas ficou sem receber nem o louvor de Deus nem a sua bênção.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem é belo o bastante para ser desejado aos olhos dos seres vivos”. A expressão grega que contém “vista/aparência” admite mais de uma construção.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “escapou tanto do louvor de Deus como de sua bênção”; isto é, deixou de recebê-los.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδʼ ὅσον ἐπιποθῆσαι
  choice: nem é belo o bastante para ser desejado
  rationale: A construção negativa exprime insuficiência de beleza ou atratividade para provocar desejo. A formulação em português é natural e mantém o infinitivo em sentido passivo.
- source_word: ὡς ἐν ζῴων ὄψει καλὰ τυγχάνει
  choice: como são os seres vivos em sua aparência
  rationale: Entende ὄψις como “aparência” e ζῷα como “seres vivos”, preservando a comparação com a beleza visível deles sem restringir desnecessariamente o termo a animais.
- source_word: ἐκπέφευγεν
  choice: não alcançou
  rationale: 'O perfeito indica um estado resultante de privação: o objeto ficou sem receber aquilo de que se fala. “Não alcançou” comunica esse valor negativo com mais clareza que o literal “escapou”.'
- source_word: τὸν τοῦ θεοῦ ἔπαινον
  choice: o louvor de Deus
  rationale: Mantém a relação genitiva relativamente aberta, sem decidir de modo excessivo entre louvor vindo de Deus e louvor pertencente a Deus.
- source_word: τὴν εὐλογίαν αὐτοῦ
  choice: a sua bênção
  rationale: Tradução direta de εὐλογία; o possessivo retoma naturalmente Deus.
theological_decisions:
- issue: Referente do sujeito singular
  choice: O objeto ou ídolo produzido, considerado como classe, continua sendo o referente implícito.
  alternative: Os próprios seres vivos representados poderiam ser tomados como referente.
  rationale: O contexto imediato trata das imagens fabricadas, e a forma singular favorece o objeto produzido, sem inserir no versículo uma identificação explícita ausente do grego.
- issue: Sentido de ἐκπέφευγεν diante do louvor e da bênção divina
  choice: 'Privação: o objeto não recebeu nem alcançou o louvor e a bênção de Deus.'
  alternative: Tradução formal “escapou do louvor de Deus e de sua bênção”.
  rationale: Em português, “escapou” sugeriria facilmente uma evasão bem-sucedida ou intencional, contrária ao sentido condenatório do contexto; a nota registra a imagem literal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Evitou-se “escapou” no texto principal por sua conotação positiva ou intencional em português; a ambiguidade sintática da primeira oração foi preservada em nota.
