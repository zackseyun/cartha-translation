base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/018.yaml
  text: Even the most hateful animals they revere; for[a], compared in foolishness with the others, they are worse.
translation:
  language: pt
  text: Veneram[a] até os animais mais detestáveis; pois, comparados aos outros em insensatez, são piores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “adoram” ou “reverenciam”. O verbo grego pode designar reverência religiosa em sentido amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ζῷα
  choice: os animais
  rationale: ζῷον designa seres vivos ou animais; neste contexto de veneração de figuras animais, “animais” é claro e natural.
- source_word: τὰ ἔχθιστα
  choice: mais detestáveis
  rationale: O superlativo de ἐχθρός expressa forte repulsa. “Mais detestáveis” preserva o grau superlativo e o tom avaliativo.
- source_word: σέβονται
  choice: veneram
  rationale: σέβομαι pode indicar reverência ou culto religioso. “Veneram” conserva essa amplitude sem tornar o ato mais específico do que o grego.
- source_word: ἀνοίᾳ
  choice: quanto à falta de inteligência
  rationale: O dativo indica o aspecto em que se faz a comparação. A expressão comunica a privação de entendimento sugerida por ἄνοια sem atribuir inequivocamente a insensatez aos adoradores.
- source_word: συγκρινόμενα τῶν ἄλλων
  choice: quando comparados aos outros
  rationale: O particípio introduz a comparação, e o genitivo assinala o outro termo; a oração temporal é idiomática em português e mantém a lógica do original.
- source_word: χείρονα
  choice: piores
  rationale: χείρων é o comparativo “pior” ou “inferior”; “piores” reproduz diretamente o juízo avaliativo.
theological_decisions:
- issue: Força religiosa de σέβονται
  choice: veneram
  alternative: adoram; reverenciam
  rationale: O contexto é de honra idólatra prestada a animais, mas o verbo grego abrange reverência religiosa sem exigir um termo litúrgico mais estrito.
- issue: Referência de ἀνοίᾳ
  choice: quanto à falta de inteligência
  alternative: em sua insensatez
  rationale: A construção foi entendida como dativo de respeito ligado à comparação dos animais. A formulação evita resolver além do necessário se a falta é meramente intelectual ou também moral.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Detestáveis” mantém a forte avaliação do superlativo; “falta de inteligência” torna compreensível a construção comparativa sem suavizar o sentido.
