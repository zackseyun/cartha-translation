base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/013.yaml
  text: For this man knows better than all others that he is sinning[a], making fragile vessels and carved images out of earthy material.
translation:
  language: pt
  text: Pois este, mais do que todos os outros[a], sabe que está pecando ao fabricar, de matéria terrosa, vasos frágeis e imagens esculpidas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sabe, mais do que todos os outros, que está pecando”. A expressão comparativa grega admite uma disposição ligeiramente diferente na frase.'
    reason: alternativa sintática e lexical
lexical_decisions:
- source_word: οὗτος
  choice: este
  rationale: O demonstrativo singular aponta para o fabricante de ídolos mencionado no contexto, sem acrescentar uma identificação ausente do grego.
- source_word: παρὰ πάντας
  choice: mais do que todos os outros
  rationale: 'Com οἶδεν, a expressão estabelece uma comparação de grau: ele sabe mais claramente do que os demais. A formulação portuguesa é natural e mantém a referência comparativa.'
- source_word: οἶδεν
  choice: sabe
  rationale: Verte diretamente a ideia de conhecimento consciente, essencial para a força moral da afirmação.
- source_word: ὅτι ἁμαρτάνει
  choice: que está pecando
  rationale: O presente progressivo expressa a ação culpável em curso, sem reduzir ἁμαρτάνει ao sentido mais genérico de apenas fazer algo errado.
- source_word: ὕλης γεώδους
  choice: de matéria terrosa
  rationale: Preserva tanto o sentido de ὕλη como matéria ou substância quanto a qualidade ligada à terra expressa por γεώδους, sem especificar indevidamente que se trata de argila.
- source_word: εὔθραυστα σκεύη
  choice: vasos frágeis
  rationale: Mantém a fragilidade ou facilidade de quebra indicada por εὔθραυστα e emprega 'vasos' no sentido amplo e corrente de objetos ou recipientes fabricados.
- source_word: γλυπτὰ
  choice: imagens esculpidas
  rationale: Explicita em português que se trata de obras figurativas esculpidas, como requer o contexto, evitando tanto o arcaísmo 'imagens de escultura' quanto a interpretação direta 'ídolos'.
- source_word: δημιουργῶν
  choice: ao fabricar
  rationale: O gerúndio grego descreve a atividade na qual ocorre o pecado. A construção 'ao fabricar' comunica essa relação com clareza e naturalidade.
theological_decisions:
- issue: Conhecimento moral e culpabilidade do fabricante de ídolos
  choice: O artesão sabe que está pecando ao produzir vasos frágeis e imagens esculpidas.
  alternative: 'A comparação pode ser entendida com outra distribuição sintática: ele, mais do que todos os outros, sabe que peca.'
  rationale: A sintaxe atribui ao artesão consciência de seu pecado e liga essa culpa à sua atividade. A tradução conserva essa força sem desenvolver uma doutrina adicional sobre graus de culpa ou conhecimento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Matéria terrosa' conserva a amplitude do grego sem limitar o material à argila; 'imagens esculpidas' deixa o contexto transmitir a crítica à idolatria.
