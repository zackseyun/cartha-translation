  yaml_path: translation/deuterocanon/wisdom_of_solomon/015/003.yaml
  text: For to know you is complete righteousness[a], and to know your power is the root of immortality.
translation:
  language: pt
  text: Pois conhecer-te é retidão plena[a], e conhecer o teu poder é a raiz da imortalidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “justiça”: “Pois conhecer-te é justiça plena.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστασθαί
  choice: conhecer
  rationale: O infinitivo expressa conhecimento ou reconhecimento; “conhecer” é natural em português e mantém o paralelismo conciso com εἰδέναι.
- source_word: ὁλόκληρος
  choice: completa
  rationale: Usado predicativamente com δικαιοσύνη, indica totalidade ou inteireza; “completa” comunica essa plenitude em português corrente.
- source_word: δικαιοσύνη
  choice: justiça
  rationale: “Justiça” é o equivalente português mais direto e abrangente de δικαιοσύνη, podendo incluir tanto retidão quanto justiça sem limitar o sentido ao âmbito jurídico-social.
- source_word: εἰδέναι
  choice: conhecer
  rationale: O sentido básico é conhecer ou reconhecer; repetir “conhecer” preserva o paralelismo do grego sem impor uma distinção não explícita entre os dois verbos.
- source_word: κράτος
  choice: poder
  rationale: O substantivo designa força ou poder efetivo; “poder” é amplo, idiomático e não introduz necessariamente a ideia política de domínio.
- source_word: ῥίζα
  choice: raiz
  rationale: Mantém a metáfora explícita e inteligível do grego, em vez de reduzi-la a “fonte” ou “fundamento”.
- source_word: ἀθανασίας
  choice: imortalidade
  rationale: É o equivalente português padrão, claro e adequado ao registro sapiencial e teológico da passagem.
theological_decisions:
- issue: Sentido de δικαιοσύνη no contexto sapiencial e teológico
  choice: justiça
  alternative: retidão
  rationale: Em português, “justiça” é a tradução tradicional e lexicalmente abrangente de δικαιοσύνη; a nota preserva “retidão” como alternativa que ressalta a condição de estar em relação correta com Deus, sem resolver indevidamente a amplitude do termo.
translation_notes:
  register: Português moderno, claro e digno, com tratamento direto a Deus por “tu”. A construção mantém o paralelismo dos dois infinitivos e a metáfora da raiz presentes no grego.
