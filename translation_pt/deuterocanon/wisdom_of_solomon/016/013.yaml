base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/013.yaml
  text: For you have authority over life and death[b][a], and you bring down to the gates of Hades and bring up.
translation:
  language: pt
  text: Pois tu tens autoridade sobre a vida e a morte; fazes descer às portas do Hades[a] e fazes subir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mundo dos mortos”. O grego traz “Hades”, o domínio dos mortos.
    reason: lexical_alternative
  - marker: b
    text: Ou “conduzes para cima” ou “ergues”. O grego diz simplesmente “fazes subir”, em contraste com “fazes descer”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: Expressa o domínio soberano ou direito de governar, e não apenas capacidade ou força bruta.
- source_word: ζωῆς καὶ θανάτου
  choice: a vida e a morte
  rationale: Preserva diretamente o par contrastante regido por ἐξουσίαν ἔχεις.
- source_word: κατάγεις
  choice: fazes descer
  rationale: Mantém a imagem de movimento descendente e forma um paralelo claro com ἀνάγεις.
- source_word: πύλας ᾅδου
  choice: portas do Hades
  rationale: Conserva tanto a metáfora concreta das portas quanto o termo grego para o domínio dos mortos, sem reduzi-lo à sepultura individual.
- source_word: ἀνάγεις
  choice: fazes subir
  rationale: Reproduz a contraposição com “fazes descer” sem acrescentar “de novo” nem impor uma referência técnica à ressurreição.
theological_decisions:
- issue: Sentido de ᾅδου
  choice: Hades
  alternative: mundo dos mortos; sepultura
  rationale: O grego nomeia o Hades, entendido como o domínio dos mortos. A transliteração preserva o termo e evita restringi-lo a uma sepultura ou identificá-lo automaticamente com o inferno.
- issue: Alcance de ἀνάγεις
  choice: fazes subir
  alternative: ergues; ressuscitas
  rationale: A formulação mantém o sentido amplo do verbo e seu paralelismo com “fazes descer”, sem explicitar uma doutrina da ressurreição além do que o verbo, isoladamente, afirma.
translation_notes:
  register: Português moderno, claro e solene, com construção paralela que reproduz o contraste vertical do grego. O ponto e vírgula torna natural a coordenação sem alterar a relação lógica introduzida por γάρ.
