base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/022.yaml
  text: But snow and ice endured fire and did not melt[a], so that they might know that fire, blazing in the hail and flashing in the rainstorms, was destroying the fruits of the enemies;
translation:
  language: pt
  text: Mas a neve e o gelo resistiram ao fogo e não derreteram, para que soubessem que o fogo, ardendo no meio do granizo e relampejando nas chuvas, destruía os frutos dos inimigos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as colheitas dos inimigos” ou “a produção dos inimigos”. O grego diz literalmente “os frutos dos inimigos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: χιὼν
  choice: neve
  rationale: É o sentido comum do termo e preserva sua distinção de χαλάζῃ, “granizo”, empregado depois no versículo.
- source_word: κρύσταλλος
  choice: gelo
  rationale: No contexto meteorológico, em paralelo com a neve e em contraste com o derretimento, “gelo” comunica o sentido com clareza.
- source_word: ὑπέμεινε
  choice: resistiram
  rationale: O singular grego concorda com o conjunto coordenado, mas o português pede naturalmente o plural. “Resistiram” expressa que a neve e o gelo permaneceram intactos diante do fogo.
- source_word: ἐτήκετο
  choice: não derreteram
  rationale: É a formulação natural em português para neve e gelo; o número foi ajustado à concordância portuguesa.
- source_word: ἵνα γνῶσιν
  choice: para que soubessem
  rationale: Preserva a força final de ἵνα com o subjuntivo e mantém indeterminado o sujeito plural, como no grego.
- source_word: κατέφθειρε
  choice: destruía
  rationale: O imperfeito indica uma ação em curso no cenário da praga.
- source_word: φλεγόμενον
  choice: ardendo
  rationale: Traduz de modo direto o particípio que qualifica o fogo, sem intensificação indevida.
- source_word: ἐν τῇ χαλάζῃ
  choice: no meio do granizo
  rationale: Expressa de modo natural a presença paradoxal do fogo dentro ou em meio ao granizo.
- source_word: ἐν τοῖς ὑετοῖς
  choice: nas tempestades
  rationale: No contexto de granizo e fogo semelhante a relâmpagos, “tempestades” transmite naturalmente as chuvas tempestuosas designadas pelo plural.
- source_word: διαστράπτον
  choice: relampejando
  rationale: Reproduz a imagem de clarões semelhantes a relâmpagos e sua ação contínua.
- source_word: τοὺς τῶν ἐχθρῶν καρποὺς
  choice: os frutos dos inimigos
  rationale: Mantém a forma lexical de καρπούς e a ambiguidade entre frutos propriamente ditos, colheitas e produção agrícola.
theological_decisions:
- issue: Finalidade da manifestação e referente do sujeito de γνῶσιν
  choice: “para que soubessem”, sem identificar quem deveria saber
  alternative: Explicitar “os inimigos” ou, de modo geral, “as pessoas” como sujeito
  rationale: O verbo plural não traz sujeito expresso. A tradução conserva essa indeterminação e não restringe o alcance teológico da cláusula.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A estrutura paradoxal do fogo coexistindo com neve, gelo, granizo e tempestades foi preservada, assim como o aspecto contínuo de “destruía” e a indefinição do sujeito de “soubessem”.
