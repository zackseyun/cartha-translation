base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/004.yaml
  text: For it was necessary that unavoidable want should come upon those who tyrannized[b][a], but to these only that it should be shown how their enemies were being tormented.
translation:
  language: pt
  text: Pois era necessário que uma privação inevitável[a] sobreviesse aos que agiam como tiranos[b], mas que a estes apenas se mostrasse como os seus inimigos eram atormentados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma falta incontornável”.
    reason: lexical_alternative
  - marker: b
    text: Ou “aos tiranos”; o grego emprega uma forma verbal que destaca a ação opressora deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει
  choice: era necessário
  rationale: A forma impessoal expressa necessidade, sem reduzir a ideia a mera conveniência moral.
- source_word: ἀπαραίτητον ἔνδειαν
  choice: uma privação inevitável
  rationale: A expressão indica uma falta grave que não pode ser evitada. “Privação” conserva a amplitude do grego sem especificar indevidamente fome ou outro tipo de carência.
- source_word: ἐπελθεῖν
  choice: sobreviesse
  rationale: Expressa de modo natural e digno a ideia de uma aflição que vem sobre alguém.
- source_word: τυραννοῦσιν
  choice: aos que agiam como tiranos
  rationale: Preserva a força verbal do particípio grego, destacando a ação opressora, e não apenas uma identidade estática.
- source_word: τούτοις δὲ μόνον
  choice: mas que a estes apenas
  rationale: Mantém o contraste enfático entre os opressores, que sofrem diretamente, e o outro grupo, ao qual o sofrimento é somente mostrado.
- source_word: δειχθῆναι
  choice: fosse mostrado
  rationale: Conserva a voz passiva e a noção de que lhes foi feita uma demonstração do que ocorria.
- source_word: πῶς
  choice: como
  rationale: Preserva a possível referência tanto ao modo quanto ao fato observado, sem substituir o termo por uma formulação mais interpretativa.
- source_word: ἐβασανίζοντο
  choice: eram atormentados
  rationale: Mantém a intensidade de βασανίζω sem restringir o sentido à imagem moderna de tortura judicial.
theological_decisions:
- issue: Contraste no juízo divino entre os opressores e o povo de Deus
  choice: Os que agiam como tiranos sofrem diretamente a privação inevitável, enquanto ao outro grupo apenas é mostrado o tormento de seus inimigos.
  alternative: 'Verter a segunda oração de forma mais dinâmica: “estes apenas tiveram de ver como seus inimigos eram castigados”.'
  rationale: A construção grega contrasta os dois grupos e usa o infinitivo passivo δειχθῆναι. A tradução preserva essa assimetria e a voz passiva sem acrescentar explicação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. “Sobreviesse” mantém o tom literário apropriado sem tornar a frase arcaica.
