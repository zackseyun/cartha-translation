  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/001.yaml
  text: Therefore they were justly punished by similar things[b][a], and were tormented by a multitude of creatures.
translation:
  language: pt
  text: Por isso, eles foram justamente castigados por coisas semelhantes[a] e atormentados por uma multidão de criaturas rastejantes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meios semelhantes”. O grego ressalta a correspondência entre a falta e o castigo.'
    reason: lexical_alternative
  - marker: b
    text: O termo grego pode referir-se amplamente a criaturas que rastejam ou se arrastam; também pode ser traduzido por “animais” ou “feras”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Introduz uma conclusão causal a partir do contexto anterior, em português natural e conciso.
- source_word: διʼ ὁμοίων
  choice: por coisas semelhantes
  rationale: Preserva a ideia de correspondência entre a falta e o meio do castigo sem especificar além do grego.
- source_word: ἐκολάσθησαν
  choice: foram castigados
  rationale: Expressa adequadamente o sentido punitivo do verbo no contexto judicial.
- source_word: ἀξίως
  choice: justamente
  rationale: Comunica que o castigo foi apropriado ou merecido, preservando sua dimensão moral.
- source_word: πλήθους
  choice: uma multidão de
  rationale: Mantém a ênfase quantitativa do substantivo grego.
- source_word: κνωδάλων
  choice: animais
  rationale: O termo pode designar amplamente animais ou feras, inclusive criaturas nocivas; 'animais' evita restringi-lo indevidamente a répteis ou seres rastejantes.
- source_word: ἐβασανίσθησαν
  choice: atormentados
  rationale: Preserva a intensidade do sofrimento sem impor o sentido técnico mais estreito de 'torturados'.
theological_decisions:
- issue: Correspondência retributiva no juízo divino
  choice: O castigo é apresentado como justo e executado por coisas semelhantes.
  alternative: Explicitar que foram castigados pelas mesmas coisas com que pecaram.
  rationale: O grego afirma semelhança ou correspondência, mas não formula neste versículo a explicação mais ampla; a tradução preserva essa contenção e a tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção passiva acompanha o grego, e as notas preservam alternativas lexicais genuínas sem estreitar o referente.
