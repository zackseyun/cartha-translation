  verdict: revise
  source_fidelity: A tradução preserva bem a duração limitada, a perturbação, o sinal e a referência singular ao mandamento da lei. Contudo, «para sua correção» introduz um possessivo ausente e estreita νουθεσία para correção; «para que se lembrassem» transforma a construção nominal εἰς ἀνάμνησιν numa oração que atribui expressamente o ato de recordar a eles, em vez de apresentar o sinal como recordação.
  naturalness: O texto é claro e de registro apropriado. «Como advertência» e «como recordação» são igualmente naturais e refletem com maior proximidade as duas expressões finalizadas por εἰς.
  terminology: «Sinal de salvação» representa adequadamente σύμβολον σωτηρίας. «Mandamento da tua lei» conserva o singular e a relação genitiva sem especificar qual mandamento está em foco. A nota lexical é adequada.
  issues:
  - severity: medium
    issue: «para sua correção» para εἰς νουθεσίαν
    rationale: A expressão grega denota admoestação/advertência com finalidade formativa. O possessivo «sua» não está no texto e «correção» reduz a amplitude do termo. «Como advertência» preserva melhor o sentido e evita o acréscimo.
  - severity: low
    issue: «para que se lembrassem» para εἰς ἀνάμνησιν
    rationale: A oração final é inteligível, mas explicita os israelitas como sujeitos da lembrança. A construção grega apresenta o sinal como recordação do mandamento. «Como recordação» mantém essa relação de modo mais próximo e natural.
  revised_text: Mas, por pouco tempo, eles foram perturbados como advertência, tendo um sinal de salvação[a], como recordação do mandamento da tua lei.
