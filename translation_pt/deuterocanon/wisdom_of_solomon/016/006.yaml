base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/006.yaml
  text: But for a short time they were troubled as a warning, having a sign of salvation, for a reminder of the commandment of your law;
translation:
  language: pt
  text: Mas, por pouco tempo, eles foram perturbados como advertência, tendo um sinal de salvação[a], como recordação do mandamento da tua lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “símbolo de salvação” ou “sinal de livramento”.
    reason: Alternativas lexicais legítimas para σύμβολον σωτηρίας.
lexical_decisions:
- source_word: εἰς νουθεσίαν
  choice: para sua correção
  rationale: Expressa a finalidade corretiva de νουθεσία, que pode envolver advertência, instrução ou admoestação, sem reduzir o termo a mero aviso.
- source_word: πρὸς ὀλίγον
  choice: por pouco tempo
  rationale: Preserva de modo explícito e natural a duração limitada indicada pela expressão grega.
- source_word: ἐταράχθησαν
  choice: foram perturbados
  rationale: Mantém a forma passiva e a amplitude de ταράσσω, apropriada à aflição momentânea no contexto.
- source_word: σύμβολον
  choice: sinal
  rationale: Designa um objeto visível que aponta para a ação salvadora de Deus; é mais concreto e acessível que “símbolo”, embora essa possibilidade permaneça em nota.
- source_word: σωτηρίας
  choice: salvação
  rationale: Conserva tanto a ideia imediata de livramento da morte quanto a ressonância teológica mais ampla do termo.
- source_word: εἰς ἀνάμνησιν
  choice: para que se lembrassem
  rationale: Traduz naturalmente em português a finalidade de trazer algo à memória, explicitando apenas o valor funcional da construção.
- source_word: ἐντολῆς νόμου σου
  choice: do mandamento da tua lei
  rationale: Preserva o singular de ἐντολή e a relação genitiva compacta com νόμος sem decidir qual mandamento específico está em vista.
theological_decisions:
- issue: Sentido de σωτηρίας no contexto de livramento físico com ressonância teológica
  choice: salvação
  alternative: livramento; resgate
  rationale: “Salvação” abrange o socorro diante do juízo mortal e mantém o peso teológico do grego sem introduzir desenvolvimentos doutrinários posteriores.
- issue: Função de σύμβολον no episódio da serpente de bronze
  choice: sinal de salvação
  alternative: símbolo de salvação; sinal de livramento
  rationale: “Sinal” preserva a função indicativa e representativa do objeto sem impor uma leitura tipológica específica nem tratá-lo como mero objeto físico.
- issue: Finalidade disciplinadora da aflição
  choice: para sua correção
  alternative: como advertência; para sua instrução
  rationale: A formulação conserva a ideia de uma admoestação destinada a corrigir, sem sugerir que a perturbação fosse apenas informativa ou exclusivamente punitiva.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A colocação pronominal e o tratamento em segunda pessoa (“tua”) preservam o tom de oração dirigido a Deus. A frase mantém o encadeamento do grego, mas converte εἰς ἀνάμνησιν em oração final idiomática.
