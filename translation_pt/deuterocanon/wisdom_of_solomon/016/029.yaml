base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/029.yaml
  text: For the hope of the ungrateful will melt like wintry frost[c][b][a], and will run off like useless water.
translation:
  language: pt
  text: Pois a esperança do ingrato se derreterá como a geada do inverno e escorrerá como água sem utilidade[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como água inútil”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀχάριστου
  choice: do ingrato
  rationale: O adjetivo no genitivo singular é usado como substantivo. “Ingrato” é natural em português e preserva a caracterização ética de quem não demonstra gratidão.
- source_word: ἐλπὶς
  choice: esperança
  rationale: É o equivalente usual e adequado ao contraste sapiencial entre a confiança do ingrato e seu desaparecimento.
- source_word: χειμέριος πάχνη
  choice: a geada do inverno
  rationale: Expressa com clareza a imagem sazonal da πάχνη, isto é, geada ou camada de gelo que se derrete facilmente.
- source_word: τακήσεται
  choice: se derreterá
  rationale: Reproduz de modo idiomático o futuro médio/passivo e mantém a imagem concreta da geada que desaparece ao derreter.
- source_word: ῥυήσεται
  choice: escorrerá
  rationale: Transmite o movimento de água que flui e se perde, em continuidade natural com a imagem anterior.
- source_word: ὕδωρ ἄχρηστον
  choice: água sem utilidade
  rationale: Preserva o sentido de água inútil ou imprestável sem sugerir que a água, em si, seja sempre inútil; no contexto, trata-se de água que escoa sem servir a nenhum fim.
theological_decisions:
- issue: Caracterização moral de ἀχάριστου
  choice: do ingrato
  alternative: daquele que não é grato; do que não agradece
  rationale: “Ingrato” conserva de forma concisa a força moral do grego, sem acrescentar uma explicação doutrinária nem limitar o termo a uma falta de cortesia.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das duas comparações e o futuro verbal foram preservados. “Geada do inverno” soa mais natural do que “geada invernal” no texto principal, enquanto “água sem utilidade” mantém a estranheza significativa da expressão grega sem se tornar opaca.
