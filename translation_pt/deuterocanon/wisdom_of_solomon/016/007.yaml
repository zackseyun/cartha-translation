base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/007.yaml
  text: For the one who turned was saved not by what was seen[a], but by you[b], the Savior of all.
translation:
  language: pt
  text: Pois quem se voltou[a] era salvo não por aquilo que era contemplado[b], mas por ti, o Salvador de todos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quem se virou” ou “quem retornou”. No contexto, trata-se de voltar-se para o sinal indicado; o verbo, por si só, não precisa significar arrependimento.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “aquilo que era contemplado”. O objeto visível não salvava por poder próprio.
    reason: literal_rendering
  - marker: c
    text: “Todos” também pode ter o sentido abrangente de “todas as coisas”; o grego não restringe expressamente o alcance.
    reason: scope_ambiguity
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: quem se voltava
  rationale: O particípio aoristo de ἐπιστρέφω funciona aqui como substantivo e descreve quem se voltava para o sinal indicado. A formulação evita interpretar o verbo especificamente como arrependimento e não acrescenta ao texto o objeto desse voltar-se.
- source_word: τὸ θεωρούμενον
  choice: aquilo que contemplava
  rationale: O particípio presente passivo substantivado designa o objeto que estava sendo contemplado. A oração relativa ativa é mais natural em português e mantém o foco no objeto visível, sem lhe atribuir poder salvador próprio.
- source_word: ἐσώζετο
  choice: era salvo
  rationale: O imperfeito passivo de σῴζω indica o que acontecia com quem se voltava. “Era salvo” conserva a voz passiva e a ligação lexical com σωτῆρα.
- source_word: σωτῆρα
  choice: Salvador
  rationale: Equivalente direto do título aplicado a Deus e coerente com o verbo “salvar” na mesma frase.
- source_word: πάντων
  choice: de todos
  rationale: Mantém a amplitude do genitivo plural sem explicitar se o referente são todas as pessoas ou todas as coisas.
theological_decisions:
- issue: Contraste causal entre o objeto visível e Deus
  choice: O objeto contemplado não era a fonte ou o meio eficaz da salvação; Deus salvava.
  alternative: O objeto era um instrumento por meio do qual Deus salvava.
  rationale: A construção οὐ διὰ ... ἀλλὰ διὰ σέ estabelece um contraste explícito. A tradução preserva esse contraste sem negar a função narrativa do sinal.
- issue: Alcance de πάντων no título divino
  choice: o Salvador de todos
  alternative: o Salvador de tudo / de todas as coisas
  rationale: O grego deixa o alcance aberto. A tradução conserva a expressão abrangente sem transformá-la numa afirmação específica sobre salvação universal nem restringi-la apenas à humanidade.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe natural. “Contemplava” conserva o sentido de olhar atentamente sem recorrer à formulação mais pesada “estava sendo contemplado”. O contraste entre o sinal visível e Deus permanece explícito.
