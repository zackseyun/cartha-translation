base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/023.yaml
  text: But this again[a], so that the righteous might be fed, forgot even its own power.
translation:
  language: pt
  text: Mas isto, por sua vez, para que os justos fossem alimentados, esqueceu-se até do seu próprio poder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deixou de exercer seu próprio poder” ou “perdeu sua própria força”. O grego personifica o elemento ao dizer que ele “se esqueceu” do próprio poder.'
    reason: Registra alternativas lexicais sem eliminar a personificação deliberada do texto grego.
lexical_decisions:
- source_word: τοῦτο
  choice: isto
  rationale: Mantém a força demonstrativa do grego e remete ao elemento ou fenômeno mencionado no contexto anterior, sem substituir essa referência por uma identificação interpretativa.
- source_word: πάλιν δέ
  choice: mas ... por sua vez
  rationale: Expressa a transição contrastiva de δέ e o valor sequencial ou contrastivo de πάλιν de modo natural em português.
- source_word: ἵνα τραφῶσιν
  choice: para que ... fossem alimentados
  rationale: Preserva a construção final com ἵνα e o sentido passivo de τραφῶσιν.
- source_word: δίκαιοι
  choice: os justos
  rationale: Traduz o adjetivo substantivado como uma categoria moral e religiosa corrente e concisa.
- source_word: καὶ ... ἐπιλησθῇ
  choice: esqueceu-se até
  rationale: Conserva a imagem vívida de esquecimento; neste contexto, καί tem valor enfático bem representado por 'até'.
- source_word: τῆς ἰδίας ... δυνάμεως
  choice: do seu próprio poder
  rationale: Mantém a ideia reflexiva de ἰδίας e a amplitude de δύναμις como poder, força ou capacidade operante.
theological_decisions:
- issue: Personificação do elemento criado sob a providência divina
  choice: esqueceu-se até do seu próprio poder
  alternative: perdeu sua força natural; deixou de exercer seu poder habitual
  rationale: O grego atribui literalmente esquecimento ao referente de τοῦτο. A personificação foi preservada para manter a apresentação sapiencial da criação como responsiva ao propósito de alimentar os justos.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem foi levemente ajustada à sintaxe portuguesa, sem explicitar o referente ambíguo de “isto”.
