base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/017.yaml
  text: 'For what was most astonishing was this: in the water that extinguishes everything[a], the fire had even greater power, for the world fights on behalf of the righteous.'
translation:
  language: pt
  text: 'Pois o mais extraordinário era isto: na água que apaga tudo, o fogo agia com força ainda maior, porque o mundo combate em defesa dos justos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o universo é defensor dos justos” ou “a criação defende os justos”.'
    reason: Alternativas lexicais para κόσμος e ὑπέρμαχος, que podem ser expressos como “mundo”, “universo” ou “criação” e como ação de combater ou defender.
lexical_decisions:
- source_word: παραδοξότατον
  choice: o mais extraordinário
  rationale: O superlativo indica algo sumamente contrário ao esperado e admirável; “extraordinário” é natural em português e evita o sentido técnico moderno de “paradoxal”.
- source_word: σβεννύντι
  choice: que apaga
  rationale: O particípio descreve a ação habitual da água contra o fogo. “Apaga” é claro e idiomático em português contemporâneo.
- source_word: πλεῖον ἐνήργει
  choice: agia com força ainda maior
  rationale: Preserva a ideia de atividade ou eficácia intensificada expressa por ἐνήργει com πλεῖον, sem reduzir a frase a uma mera comparação de temperatura ou intensidade.
- source_word: ὑπέρμαχος
  choice: combate em defesa de
  rationale: A expressão mantém tanto a função defensora quanto a força marcial do termo, além de conservar a personificação do mundo criado.
- source_word: κόσμος
  choice: o mundo
  rationale: É a correspondência direta e natural para κόσμος neste contexto, entendido como o mundo criado e ordenado.
- source_word: δικαίων
  choice: os justos
  rationale: O plural substantivado designa pessoas justas como categoria moral; “os justos” é conciso e tradicional sem ser arcaico.
theological_decisions:
- issue: Sentido de κόσμος ὑπέρμαχος δικαίων
  choice: o mundo combate em defesa dos justos
  alternative: o universo é defensor dos justos; a criação defende os justos
  rationale: A tradução conserva a personificação da ordem criada como defensora ativa dos justos, sem transformá-la em uma formulação doutrinária mais abrangente do que o texto exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase e a personificação do mundo foram preservadas; “em meio à água” torna natural a construção sem eliminar o contraste surpreendente do grego.
