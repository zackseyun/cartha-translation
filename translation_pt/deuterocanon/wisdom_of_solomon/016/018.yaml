base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/018.yaml
  text: For at one time the flame was subdued[a], so that it might not burn up the creatures sent against the ungodly; but they themselves, seeing it[c][b], might know that they were being pursued by the judgment of God.
translation:
  language: pt
  text: Pois, em certo momento, a chama era abrandada[a], para que não consumisse pelo fogo os animais enviados contra os ímpios; mas para que eles mesmos, ao verem isso[b], soubessem que estavam sendo impelidos pelo juízo de Deus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «era amansada» ou «era suavizada».
    reason: lexical_alternative
  - marker: b
    text: O grego não expressa o objeto de «verem»; o sentido pode ser a chama abrandada ou os animais enviados contra eles.
    reason: source_ambiguity
  - marker: c
    text: Ou «estavam sendo perseguidos pelo juízo de Deus».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεροῦτο
  choice: se tornava branda
  rationale: O verbo ἡμερόω significa amansar, tornar brando ou suavizar. Aplicado à chama, «se tornava branda» preserva a imagem de uma força domada, sem sugerir que o fogo se apagou.
- source_word: φλόξ
  choice: a chama
  rationale: φλόξ designa especificamente a chama, e não o fogo em sentido geral.
- source_word: καταφλέξῃ
  choice: consumir pelo fogo
  rationale: O composto intensivo indica queimar de modo destrutivo ou consumir completamente.
- source_word: τὰ ἐπʼ ἀσεβεῖς ἀπεσταλμένα ζῷα
  choice: os animais enviados contra os ímpios
  rationale: ζῷα refere-se aqui aos animais ou seres vivos da narrativa das pragas; ἐπί com o acusativo comunica direção hostil, «contra».
- source_word: ἀσεβεῖς
  choice: os ímpios
  rationale: «Ímpios» conserva a dimensão religiosa e moral de ἀσεβεῖς, comum no livro da Sabedoria.
- source_word: βλέποντες
  choice: ao verem isso
  rationale: O particípio exprime a circunstância que conduz ao reconhecimento. O objeto não está expresso em grego; «isso» torna a frase natural sem identificar de maneira rígida o que eles viam.
- source_word: εἴδωσιν
  choice: saberiam
  rationale: Neste contexto, o verbo passa da percepção à compreensão ou reconhecimento; «saberiam» expressa esse resultado.
- source_word: θεοῦ κρίσει
  choice: pelo juízo de Deus
  rationale: O dativo apresenta o juízo divino como a força ou meio pelo qual os ímpios são impelidos, mantendo o peso judicial da expressão.
- source_word: ἐλαύνονται
  choice: estavam sendo impelidos
  rationale: ἐλαύνω pode significar conduzir, impelir, pressionar ou perseguir. «Sendo impelidos» mantém a voz passiva e evita especificar além do grego se o movimento é condução ou perseguição.
theological_decisions:
- issue: Natureza da ação divina nas imagens da praga
  choice: O juízo de Deus é apresentado como a força pela qual os ímpios são impelidos, enquanto a chama é tornada branda.
  alternative: Entender a expressão apenas como uma circunstância providencial geral, ou traduzir ἐλαύνονται especificamente como «eram perseguidos».
  rationale: θεοῦ κρίσει possui sentido judicial explícito e não deve ser enfraquecido; ao mesmo tempo, «impelidos» conserva a amplitude de ἐλαύνονται sem desenvolver uma doutrina de causalidade além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário bíblico reconhecível. A construção mantém o contraste entre a chama tornada branda e os ímpios submetidos ao juízo divino, sem eliminar a ambiguidade do objeto de βλέποντες nem restringir excessivamente o sentido de ἐλαύνονται.
