base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/014.yaml
  text: But a man kills by his own wickedness[a], and when a spirit has gone out, he does not bring it back, nor does he release a soul that has been taken.
translation:
  language: pt
  text: Mas o ser humano mata por sua própria maldade, mas não faz voltar o espírito que saiu nem liberta a alma que foi tomada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não faz voltar o sopro que saiu nem liberta a vida que foi tirada”. Os termos gregos πνεῦμα e ψυχή podem significar, conforme o contexto, “espírito” ou “sopro” e “alma” ou “vida”.'
    reason: Alternativa lexical que preserva a amplitude semântica de πνεῦμα e ψυχή no contexto da morte.
lexical_decisions:
- source_word: ἄνθρωπος
  choice: o ser humano
  rationale: O singular genérico designa a pessoa humana e mantém o contraste, presente no contexto, entre a ação humana e o poder de Deus. Em português atual, «o ser humano» é natural e não restringe indevidamente a referência ao sexo masculino.
- source_word: ἀποκτέννει
  choice: mata
  rationale: O verbo denota diretamente tirar a vida; «mata» é claro, corrente e adequado ao contraste com a impossibilidade humana de reverter a morte.
- source_word: τῇ κακίᾳ αὐτοῦ
  choice: por sua própria maldade
  rationale: κακία expressa maldade ou mal moral. «Própria» torna clara a força do possessivo αὐτοῦ sem mudar o sentido.
- source_word: ἐξελθὸν ... πνεῦμα
  choice: depois que o espírito sai
  rationale: πνεῦμα pode significar espírito ou sopro. «Espírito» preserva no texto principal a amplitude antropológica do termo grego, enquanto «sopro» é registrado em nota.
- source_word: οὐκ ἀναστρέφει
  choice: não o traz de volta
  rationale: A expressão comunica de modo natural o retorno do espírito que saiu e conserva a imagem concreta do grego.
- source_word: οὐδὲ ἀναλύει
  choice: nem liberta
  rationale: ἀναλύω tem aqui o sentido de soltar ou libertar. «Liberta» preserva essa imagem sem explicar além do texto.
- source_word: ψυχὴν παραλημφθεῖσαν
  choice: a alma que foi tomada
  rationale: ψυχή pode significar alma ou vida, e o particípio indica que ela foi tomada ou levada. A formulação principal mantém o termo antropológico distinto, com a alternativa contextual em nota.
theological_decisions:
- issue: Os termos antropológicos πνεῦμα e ψυχή no contexto da morte
  choice: Traduzir πνεῦμα por «espírito» e ψυχή por «alma» no texto principal.
  alternative: Traduzir πνεῦμα por «sopro» e ψυχή por «vida».
  rationale: O grego emprega dois termos distintos e semanticamente amplos. Mantê-los como «espírito» e «alma» conserva a textura conceitual e a possível tensão do texto, sem impor que sejam componentes metafísicos rigidamente separados; a nota oferece a leitura concreta igualmente possível no contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O singular genérico foi mantido por meio de «o ser humano». A coordenação adversativa procura refletir a estrutura μὲν...δέ sem tornar a frase pesada.
