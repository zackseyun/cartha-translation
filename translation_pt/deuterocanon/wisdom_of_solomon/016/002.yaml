base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/002.yaml
  text: Instead of this punishment[a], you did good to your people; for a strange craving of appetite[b], you prepared quail as food for them.
translation:
  language: pt
  text: Em vez daquele castigo[a], fizeste bem ao teu povo; para satisfazer o desejo por um sabor incomum[b], preparaste codornizes como alimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “No lugar daquele castigo”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, algo como “para o desejo do apetite, um sabor incomum”. O grego é condensado e enfatiza um desejo incomum por alimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθʼ ἧς κολάσεως
  choice: Em vez daquele castigo
  rationale: ἀντί com o genitivo estabelece contraste ou substituição em relação ao castigo mencionado no contexto anterior; “daquele” retoma naturalmente esse castigo.
- source_word: εὐεργετήσας τὸν λαόν σου
  choice: fizeste o bem ao teu povo
  rationale: Expressa diretamente a ação benéfica do particípio εὐεργετήσας sem acrescentar conotações litúrgicas ou pactuais.
- source_word: εἰς ἐπιθυμίαν ὀρέξεως
  choice: para atender ao desejo do apetite
  rationale: A combinação enfática de termos ligados a desejo e apetite é mantida, enquanto “atender” torna inteligível a relação de εἰς com a provisão do alimento sem afirmar que o desejo foi moralmente aprovado.
- source_word: ξένην γεῦσιν
  choice: dando-lhes um sabor incomum
  rationale: ξένην qualifica γεῦσιν como um sabor fora do habitual. A formulação explicita a relação sintática comprimida do grego e preserva a ideia de novidade ou estranheza.
- source_word: τροφὴν ἡτοίμασας ὀρτυγομήτραν
  choice: preparaste codornizes como alimento
  rationale: Reproduz naturalmente o ato de preparar a codorniz como comida; o plural “codornizes” é idiomático no relato da provisão no deserto, embora o grego use o singular.
theological_decisions:
- issue: Contraste entre o castigo de outros e o benefício concedido ao povo de Deus
  choice: Em vez daquele castigo, fizeste o bem ao teu povo
  alternative: Como resposta àquele castigo, fizeste o bem ao teu povo
  rationale: A construção ἀνθʼ ἧς aponta mais naturalmente para contraste ou substituição. A tradução conserva essa oposição sem explicar além do que o texto afirma.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas de segunda pessoa singular coerentes com a oração dirigida a Deus. A sintaxe foi levemente explicitada para clareza, e a compressão do original foi registrada em nota.
