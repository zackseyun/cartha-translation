base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/025.yaml
  text: Therefore also at that time[a], changing itself into all things, it served your all-nourishing gift according to the desire of those in need[b];
translation:
  language: pt
  text: Por isso, também naquele tempo, transformando-se em todas as coisas[a], ela se põe a serviço do teu dom, que a todos alimenta, conforme o desejo dos necessitados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “adaptando-se de todas as maneiras”. O grego descreve a extraordinária capacidade da criação de assumir formas ou qualidades diversas.
    reason: lexical_alternative
  - marker: b
    text: Ou “conforme a vontade dos que pediam”. O termo grego pode referir-se tanto aos que estavam necessitados como aos que faziam um pedido.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο καὶ τότε
  choice: Por isso, também naquele tempo
  rationale: Mantém a ligação conclusiva de διὰ τοῦτο, conserva o valor de καί e expressa com naturalidade a referência temporal de τότε.
- source_word: εἰς πάντα μεταλλευομένη
  choice: transformando-se em todas as coisas
  rationale: Preserva a imagem concreta de mudança ou adaptação em múltiplas formas, bem como a voz média do particípio, sem definir o mecanismo da transformação.
- source_word: τῇ παντοτρόφῳ σου δωρεᾷ
  choice: do teu dom, que a todos alimenta
  rationale: Explicita de modo natural em português a força de παντοτρόφος, literalmente aquilo que alimenta ou sustenta a todos, mantendo δωρεά como “dom”.
- source_word: ὑπηρετεῖ
  choice: ela se pôs a serviço
  rationale: Comunica a ideia de prestar serviço ou ficar à disposição. O pronome feminino retoma naturalmente “a criação” do versículo anterior, sujeito implícito nesta frase grega.
- source_word: πρὸς τὴν τῶν δεομένων θέλησιν
  choice: conforme o desejo dos necessitados
  rationale: πρός indica aqui adequação; δεομένων pode designar os que necessitam ou os que pedem, e “necessitados” preserva primariamente a ideia de carência.
theological_decisions:
- issue: Referente do sujeito feminino implícito
  choice: O pronome “ela” retoma “a criação” do versículo anterior, sem inserir “maná” no texto.
  alternative: Entender o sujeito de modo mais restrito como a provisão celestial ou o maná.
  rationale: O particípio feminino μεταλλευομένη retoma gramaticalmente ἡ κτίσις em 16:24. O contexto inclui o alimento celestial, mas especificar “maná” aqui estreitaria o referente além da formulação grega.
- issue: Relação entre a criação e o dom divino
  choice: “ela se pôs a serviço do teu dom”
  alternative: “ela serviu como teu dom” ou identificar a própria criação diretamente com o dom.
  rationale: O dativo τῇ ... δωρεᾷ é conservado como complemento de serviço, evitando fundir silenciosamente a criação com o dom de Deus.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com leitura natural no Brasil. A formulação preserva a imagem elevada da criação a serviço do dom divino e mantém abertas as ambiguidades lexicais relevantes por meio das notas.
