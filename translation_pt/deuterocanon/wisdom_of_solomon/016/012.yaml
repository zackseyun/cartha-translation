base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/012.yaml
  text: For neither herb nor poultice healed them[a], but your word, O Lord[b], heals all things.
translation:
  language: pt
  text: Pois nem erva[a] nem cataplasma[b] os curaram, mas a tua palavra, ó Senhor, que cura todas as coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “planta”. O termo grego pode designar vegetação de modo mais amplo, mas aqui provavelmente se refere a uma planta medicinal.
    reason: lexical_alternative
  - marker: b
    text: Ou “unguento” ou “aplicação medicinal”. O termo grego designa algo aplicado ao corpo com finalidade terapêutica.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βοτάνη
  choice: erva
  rationale: No contexto de cura, refere-se provavelmente a uma planta medicinal. “Erva” é natural e mantém o contraste com a palavra do Senhor sem ampliar o termo para medicamentos em geral.
- source_word: μάλαγμα
  choice: cataplasma
  rationale: Designa uma aplicação medicinal macia colocada sobre o corpo. “Cataplasma” preserva a imagem concreta de um tratamento externo.
- source_word: ἐθεράπευσεν
  choice: curaram
  rationale: O verbo indica cura efetiva, não apenas tratamento. O plural é natural em português com os dois sujeitos ligados por “nem... nem”.
- source_word: λόγος
  choice: palavra
  rationale: Preserva tanto o sentido comum de expressão divina quanto a ressonância da ação eficaz de Deus, sem impor uma interpretação teológica técnica posterior.
- source_word: ἰώμενος
  choice: que cura
  rationale: A oração relativa reproduz a força descritiva do particípio presente, caracterizando a palavra do Senhor como aquela que cura.
- source_word: πάντα
  choice: todas as coisas
  rationale: Mantém o alcance amplo do neutro plural grego e o registro elevado da frase.
- source_word: Κύριε
  choice: Senhor
  rationale: É a forma portuguesa convencional e digna para o vocativo κύριε neste discurso dirigido a Deus.
theological_decisions:
- issue: Contraste entre remédios humanos e a ação divina
  choice: O versículo afirma que, nesse caso, nem a erva nem o cataplasma os curaram; foi a palavra do Senhor que realizou a cura.
  alternative: Ler a frase como uma rejeição geral de toda medicina ou de todos os meios terapêuticos.
  rationale: O grego estabelece um contraste situado entre esses recursos e a palavra eficaz do Senhor, mas não formula uma condenação universal da medicina.
- issue: Sentido teológico de λόγος
  choice: Traduzir por “palavra”, preservando a possível referência à expressão ou ordem eficaz do Senhor.
  alternative: Traduzir explicitamente por “ordem” ou identificar o termo com uma doutrina cristológica posterior.
  rationale: “Palavra” conserva a amplitude e a ressonância do original sem resolver além do texto a identidade ou o modo de atuação dessa palavra.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Ó Senhor” conserva o tom de invocação; “cataplasma” mantém a precisão da imagem medicinal, com explicação em nota.
