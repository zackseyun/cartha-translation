base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/005.yaml
  text: For even when a terrible fury of wild beasts came upon them[a], and they were being destroyed by the bites of crooked serpents, your wrath did not remain to the end;
translation:
  language: pt
  text: Pois, mesmo quando a terrível fúria de animais selvagens caiu sobre eles, e eles estavam sendo destruídos pelas mordidas de serpentes sinuosas[a], a tua ira não permaneceu até o fim;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serpentes tortuosas” ou “serpentes retorcidas”. O adjetivo grego significa literalmente “torto” ou “curvado”; aqui, provavelmente descreve a forma ou o movimento das serpentes, não uma qualidade moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεινὸς
  choice: terrível
  rationale: Expressa a intensidade ameaçadora do ataque em português atual, sem ampliar indevidamente o sentido do adjetivo grego.
- source_word: θηρίων θυμός
  choice: fúria de animais selvagens
  rationale: θηρίων designa animais selvagens, e θυμός indica aqui ímpeto violento ou fúria; a expressão é clara, vívida e fiel ao grego.
- source_word: ἐπῆλθεν
  choice: caiu sobre
  rationale: Transmite de modo idiomático a ideia de um ataque ou calamidade que sobrevém a alguém.
- source_word: δήγμασίν
  choice: mordidas
  rationale: Equivalente direto e natural do substantivo grego no contexto de serpentes.
- source_word: σκολιῶν ὄφεων
  choice: serpentes sinuosas
  rationale: σκολιός significa literalmente torto ou curvado; aplicado às serpentes, “sinuosas” comunica sua forma ou movimento sem sugerir uma qualidade moral.
- source_word: διεφθείροντο
  choice: estavam sendo destruídos
  rationale: Preserva tanto a força destrutiva do verbo quanto o aspecto contínuo do imperfeito passivo.
- source_word: οὐ μέχρι τέλους ἔμεινεν
  choice: não permaneceu até o fim
  rationale: Mantém de perto a expressão temporal grega e deixa que o versículo seguinte explique o caráter limitado desse juízo.
- source_word: ἡ ὀργή σου
  choice: a tua ira
  rationale: “Ira” corresponde ao tom solene e à força judicial de ὀργή, mais intensa que simples irritação.
theological_decisions:
- issue: O juízo divino é descrito como temporário neste episódio
  choice: a tua ira não permaneceu até o fim
  alternative: a tua ira não durou para sempre
  rationale: 'A formulação conserva a afirmação direta e a tensão teológica do grego: a ira divina é real, mas não permanece “até o fim” neste episódio. Evita transformar a frase em uma conclusão interpretativa.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Animais selvagens” é mais corrente que “feras”, enquanto “serpentes” preserva o registro solene. O ponto e vírgula mantém a continuidade sintática com o versículo seguinte.
