base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/008.yaml
  text: And by this also you convinced our enemies that you are the one who rescues from every evil[a].
translation:
  language: pt
  text: E também por meio disso convenceste os nossos inimigos de que és tu quem livra de todo mal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de todo dano” ou “de toda aflição”. A palavra grega pode referir-se amplamente ao mal, ao dano ou à desgraça.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: por meio disso
  rationale: Expressa naturalmente o valor instrumental da construção grega e retoma o acontecimento anterior como o meio da demonstração.
- source_word: ἔπεισας
  choice: convenceste
  rationale: Preserva o sentido direto de persuadir ou levar alguém a reconhecer algo, sem tornar o verbo mais interpretativo como “provar”.
- source_word: τοὺς ἐχθροὺς ἡμῶν
  choice: os nossos inimigos
  rationale: Tradução direta e idiomática que mantém a perspectiva comunitária da primeira pessoa do plural.
- source_word: ὅτι σὺ εἶ
  choice: de que és tu
  rationale: A posição de “tu” conserva em português a ênfase do pronome grego explícito sem resultar em formulação artificial.
- source_word: ὁ ῥυόμενος
  choice: quem livra
  rationale: O particípio substantivado apresenta Deus como aquele cuja ação característica é livrar; “quem livra” é atual, claro e digno.
- source_word: ἐκ παντὸς κακοῦ
  choice: de todo mal
  rationale: Mantém a amplitude de κακόν, que pode abranger mal moral, dano e desgraça, sem restringir o sentido a perigo físico.
theological_decisions:
- issue: Amplitude de κακοῦ
  choice: de todo mal
  alternative: de todo dano; de toda aflição
  rationale: “Todo mal” preserva a declaração abrangente sobre o poder libertador de Deus e mantém aberta a referência tanto ao mal quanto às suas consequências, sem reduzi-la apenas a danos físicos ou dificuldades.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção “és tu quem livra” mantém a ênfase do grego, enquanto “por meio disso” explicita naturalmente o valor instrumental de ἐν τούτῳ.
