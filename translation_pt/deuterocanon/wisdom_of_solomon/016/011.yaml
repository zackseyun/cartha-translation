base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/011.yaml
  text: For they were being pricked as a reminder of your sayings, and were quickly rescued, so that, after falling into deep forgetfulness, they might not become cut off from your beneficence.
translation:
  language: pt
  text: Pois eram picados como lembrança das tuas palavras e eram rapidamente salvos, para que, caindo em profundo esquecimento, não ficassem privados da tua beneficência.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογίων
  choice: palavras
  rationale: No contexto, refere-se às declarações de Deus. “Palavras” é natural e acessível em português, sem restringir o termo a um tipo específico de oráculo.
- source_word: ἐνεκεντρίζοντο
  choice: eram picados
  rationale: Preserva a imagem concreta das picadas que serviam de advertência e o aspecto reiterado ou contínuo do imperfeito grego.
- source_word: ὀξέως διεσώζοντο
  choice: eram rapidamente salvos
  rationale: Expressa tanto a rapidez indicada por ὀξέως como o livramento completo sugerido por διασῴζω.
- source_word: ἀπερίσπαστοι
  choice: alheios
  rationale: Neste contexto, o adjetivo indica ficar desligado, desatento ou sem participação em relação à beneficência divina; “alheios” preserva essa amplitude sem impor uma explicação causal.
- source_word: εὐεργεσίας
  choice: beneficência
  rationale: Mantém o sentido de ação benéfica ou favor concedido, bem como o singular abstrato do grego.
theological_decisions:
- issue: Relação entre esquecimento e beneficência divina
  choice: “caindo em profundo esquecimento, não se tornassem alheios à tua beneficência”
  alternative: “não caíssem em profundo esquecimento nem fossem privados da tua beneficência”
  rationale: A formulação escolhida conserva a construção participial e evita interpretar ἀπερίσπαστοι como uma retirada objetiva do favor divino; o foco permanece na condição daqueles que se tornam alheios a ele.
translation_notes:
  register: 'Português moderno, digno e de leitura ampla. A sintaxe mantém a finalidade expressa por ἵνα e a tensão do original: as picadas funcionam como lembrança, enquanto o rápido salvamento impede que o esquecimento leve ao afastamento da beneficência divina.'
