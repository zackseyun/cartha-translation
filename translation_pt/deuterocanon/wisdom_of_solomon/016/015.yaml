  text: But it is impossible to escape your hand[a].
translation:
  language: pt
  text: Mas é impossível escapar da tua mão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fugir da tua mão”. O grego conserva a imagem concreta da mão de Deus como figura de seu poder e alcance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὴν ... σὴν χεῖρα
  choice: da tua mão
  rationale: χείρ significa literalmente “mão” e, neste contexto, também evoca poder, domínio e alcance. A imagem concreta é natural em português e deve ser preservada.
- source_word: φυγεῖν
  choice: escapar
  rationale: Embora o verbo possa significar “fugir”, com este objeto a ideia é escapar ou esquivar-se da mão de Deus. “Escapar” produz uma formulação idiomática e fiel em português.
- source_word: ἀδύνατόν ἐστιν
  choice: é impossível
  rationale: A expressão impessoal grega é reproduzida de modo direto, claro e natural.
- source_word: δὲ
  choice: Mas
  rationale: A conjunção marca contraste com a ideia anterior; “Mas” expressa adequadamente essa força adversativa.
theological_decisions:
- issue: Linguagem antropomórfica para a ação divina
  choice: Preservar “tua mão” no texto principal
  alternative: teu poder; teu domínio
  rationale: O grego emprega a imagem corporal da mão para comunicar o poder e o alcance de Deus. Mantê-la conserva tanto a metáfora quanto a afirmação de que ninguém pode escapar da ação divina, sem reduzir a tensão teológica a uma abstração.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O pronome “tua” acompanha o tratamento bíblico direto e preserva a concisão do grego.
