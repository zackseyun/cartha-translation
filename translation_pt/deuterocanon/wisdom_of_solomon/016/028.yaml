  text: so that it might be known that one must rise before the sun to give you thanks[b][a], and at the dawning of the light make petition to you.
translation:
  language: pt
  text: para que se soubesse que é preciso levantar-se antes do sol para te dar graças[a] e, ao despontar da luz, dirigir-te súplicas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “preceder o sol para te dar graças”.
    reason: lexical_alternative
  - marker: b
    text: Ou “orar a ti”; o verbo grego pode indicar aproximar-se de alguém com um pedido ou uma súplica.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως γνωστὸν ἦν
  choice: para que se soubesse
  rationale: A construção com ὅπως apresenta propósito ou resultado; a forma impessoal conserva a ideia de tornar conhecido sem acrescentar um agente.
- source_word: δεῖ
  choice: é preciso
  rationale: Reproduz a necessidade impessoal e geral do grego, sem restringi-la a um grupo específico.
- source_word: φθάνειν τὸν ἥλιον
  choice: levantar-se antes do sol
  rationale: φθάνειν indica antecipar-se ou chegar antes. No contexto da devoção matinal, a formulação comunica com naturalidade a prioridade temporal, enquanto a nota preserva a expressão mais literal.
- source_word: ἐπʼ εὐχαριστίαν σου
  choice: para te dar graças
  rationale: Expressa em português corrente o sentido elíptico da frase grega, entendendo σου como referência àquele a quem se dirige a ação de graças.
- source_word: πρὸς ἀνατολὴν φωτός
  choice: ao despontar da luz
  rationale: Preserva a imagem poética do surgimento da luz e sua referência ao amanhecer.
- source_word: ἐντυγχάνειν σοι
  choice: dirigir-te súplicas
  rationale: O verbo com dativo pode descrever a aproximação a alguém com um pedido; esta escolha mantém a nuance de petição sem reduzi-la à noção mais ampla de oração.
theological_decisions:
- issue: Se o versículo formula uma obrigação moral geral ou prescreve uma liturgia matinal específica
  choice: 'Uma necessidade geral expressa em linguagem devocional: agradecer a Deus antes do nascer do sol e suplicar-lhe ao amanhecer.'
  alternative: Uma prescrição formal de oração litúrgica matinal.
  rationale: O impessoal δεῖ comunica necessidade geral, mas o texto não identifica rito, ofício ou grupo religioso específico; por isso, a tradução preserva a força devocional sem impor uma prática litúrgica determinada.
translation_notes:
  register: Português moderno, digno e de leitura natural, com construção impessoal e imagem poética do amanhecer. Evitou-se tanto o literalismo obscuro quanto a especificação de uma liturgia não explicitada no grego.
