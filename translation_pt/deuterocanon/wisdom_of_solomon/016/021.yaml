base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/021.yaml
  text: For your substance displayed your sweetness toward your children[a]; and, serving the desire of the one who partook of it[b], it changed into whatever each one wished.
translation:
  language: pt
  text: Pois tua substância manifestava tua doçura para com teus filhos[a] e, atendendo ao desejo de quem a recebia[b], transformava-se naquilo que cada um queria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tua natureza manifestava tua doçura para com teus filhos”. A palavra grega pode significar “substância”, “natureza” ou “realidade subjacente”.'
    reason: lexical_alternative
  - marker: b
    text: A oração final indica que o alimento se adaptava à preferência de cada pessoa.
    reason: cultural_note
lexical_decisions:
- source_word: ὑπόστασίς σου
  choice: a substância que vinha de ti
  rationale: O contexto imediato aponta para a constituição material do maná dado por Deus. A formulação evita sugerir que a essência metafísica de Deus se transformava, sem eliminar a amplitude lexical de ὑπόστασις.
- source_word: γλυκύτητα
  choice: doçura
  rationale: Preserva simultaneamente o sabor agradável do alimento e a bondade de Deus demonstrada por meio dele.
- source_word: τέκνα
  choice: filhos
  rationale: Em português bíblico corrente, 'filhos' pode abranger coletivamente o povo de Deus e mantém o tom relacional do grego.
- source_word: τοῦ προσφερομένου
  choice: de quem a recebia
  rationale: O particípio designa a pessoa a quem o alimento era apresentado ou oferecido; no contexto, 'quem a recebia' comunica isso naturalmente.
- source_word: ἐπιθυμίᾳ ὑπηρετῶν
  choice: atendendo ao desejo
  rationale: Expressa a ideia de servir ou corresponder à preferência do destinatário sem personificação excessivamente rígida.
- source_word: μετεκιρνᾶτο
  choice: transformava-se
  rationale: O verbo indica mudança ou adaptação da composição; a forma pronominal preserva a apresentação do alimento como aquilo que se ajustava.
- source_word: πρὸς ὃ τις ἐβούλετο
  choice: naquilo que cada um queria
  rationale: Mantém tanto o caráter distributivo de τις quanto a adaptação à vontade individual.
theological_decisions:
- issue: Referente de ὑπόστασίς σου
  choice: A constituição do maná procedente de Deus
  alternative: A própria natureza ou realidade de Deus
  rationale: O alimento é o sujeito conceitual da adaptação descrita na segunda oração. 'Que vinha de ti' torna o referente claro sem apagar a possibilidade lexical de 'natureza', registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e legibilidade brasileira. A expressão 'substância que vinha de ti' conserva a tensão do original, mas reduz uma leitura metafísica involuntária. Os marcadores [a] e [b] aparecem no texto.
