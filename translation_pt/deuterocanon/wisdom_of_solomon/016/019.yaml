base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/019.yaml
  text: But at times[a], even in the midst of water, fire burns beyond its power[b], so that it may destroy the unrighteous produce of the earth.
translation:
  language: pt
  text: Às vezes, porém, mesmo em meio à água, o fogo arde além de sua força[a], para destruir o fruto injusto da terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o fogo agia acima de sua força normal, embora estivesse cercado de água.
    reason: Esclarece a expressão comparativa incomum ὑπὲρ τὴν πυρὸς δύναμιν sem diluí-la no texto principal.
  - marker: b
    text: Literalmente, “o fruto injusto da terra”. A expressão pode indicar aquilo que a terra produzia em ligação com os injustos.
    reason: Registra a construção grega incomum e sua provável referência, preservando sua ambiguidade.
lexical_decisions:
- source_word: ποτὲ δὲ
  choice: Às vezes, porém
  rationale: Expressa o valor temporal de ποτὲ e a transição contrastiva de δέ em português natural.
- source_word: μεταξὺ ὕδατος
  choice: mesmo em meio à água
  rationale: Preserva a imagem paradoxal do fogo ardendo cercado de água; “mesmo” explicita naturalmente a força concessiva do contexto.
- source_word: ὑπὲρ τὴν πυρὸς δύναμιν
  choice: além de sua força
  rationale: Mantém de modo conciso a ideia de exceder a capacidade ou intensidade própria do fogo, sem especificar além do grego.
- source_word: φλέγει
  choice: o fogo ardia
  rationale: O verbo significa arder ou flamejar; “o fogo” recupera o sujeito indicado pelo genitivo πυρός, e o imperfeito harmoniza a descrição narrativa em português.
- source_word: ἵνα
  choice: para
  rationale: Comunica com clareza a finalidade da ação sem eliminar a relação teleológica.
- source_word: ἄδικον
  choice: injusto
  rationale: Preserva a atribuição moral direta do adjetivo ao produto da terra, sem explicar no corpo do texto a natureza dessa relação.
- source_word: γῆς γέννημα
  choice: fruto da terra
  rationale: “Fruto” expressa aquilo que a terra produz e soa natural e digno em português, mantendo aberta a possibilidade semântica de produto ou descendência.
- source_word: διαφθείρῃ
  choice: destruir
  rationale: Representa adequadamente a ideia contextual de arruinar ou eliminar sob juízo.
theological_decisions:
- issue: Força moral de ἄδικον aplicado a γῆς γέννημα
  choice: fruto injusto da terra
  alternative: produção dos injustos
  rationale: O grego qualifica diretamente γέννημα como ἄδικον. A tradução conserva essa tensão e evita resolver silenciosamente se o fruto é assim chamado por sua associação com pessoas injustas.
- issue: Agente e finalidade da destruição
  choice: para destruir
  alternative: de modo que destruísse
  rationale: ἵνα introduz finalidade, possivelmente com nuance de resultado. A formulação escolhida preserva a finalidade sem identificar mais precisamente o agente do que o contexto permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as imagens do grego são preservadas sempre que naturais; as notas esclarecem, sem resolver, as expressões deliberadamente tensas.
