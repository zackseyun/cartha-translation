  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/027.yaml
  text: For what was not destroyed by fire simply melted when warmed by a brief ray of the sun,[a]
translation:
  language: pt
  text: Pois aquilo que não era destruído pelo fogo simplesmente se derretia ao ser aquecido por um leve raio de sol.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por um breve raio de sol”. O adjetivo grego pode indicar pouca intensidade ou curta duração.
    reason: Alternativa lexical para βραχείας.
lexical_decisions:
- source_word: τὸ ... μὴ φθειρόμενον
  choice: aquilo que não era destruído
  rationale: O particípio articular tem valor substantivo e retoma, no contexto, o alimento milagroso. “Destruído” expressa melhor o efeito físico contrastado com o derretimento.
- source_word: ὑπὸ πυρὸς
  choice: pelo fogo
  rationale: Ὑπό com genitivo indica aqui agente ou meio; “pelo fogo” é natural e preserva a construção passiva.
- source_word: ἁπλῶς
  choice: simplesmente
  rationale: 'Mantém a ênfase retórica do contraste: o que o fogo não destruía derretia apenas sob a ação moderada do sol.'
- source_word: ὑπὸ βραχείας ἀκτῖνος ἡλίου
  choice: por um leve raio de sol
  rationale: Βραχείας pode indicar pequenez, pouca intensidade ou brevidade. “Leve” comunica bem a pouca intensidade no contraste com o fogo, enquanto a nota preserva a alternativa temporal.
- source_word: θερμαινόμενον
  choice: ao ser aquecido
  rationale: O particípio é expresso naturalmente com valor temporal; “aquecido” conserva o sentido físico sem exagerar a intensidade.
- source_word: ἐτήκετο
  choice: se derretia
  rationale: O imperfeito descreve o processo ou comportamento observado; “se derretia” preserva esse aspecto e o sentido de τήκω.
theological_decisions:
- issue: Descrição milagrosa em contraste com um processo natural comum
  choice: Traduzir diretamente o comportamento paradoxal do alimento no contexto, sem explicá-lo.
  alternative: Transformar a frase em uma máxima geral sobre as coisas criadas.
  rationale: O grego apresenta uma comparação concreta ligada à narrativa do alimento milagroso; a tradução deve manter a tensão sem acrescentar interpretação.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Aquilo que” evita personificar o referente e mantém a ligação contextual; “raio de sol” é mais idiomático do que “raio do sol” neste enunciado.
