base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/016.yaml
  text: For because they refused to know you[a], the ungodly were scourged by the strength of your arm, pursued by strange rains and hail and relentless storms[b], and consumed by fire.
translation:
  language: pt
  text: Pois, por se recusarem a conhecer-te, os ímpios foram açoitados pela força do teu braço, perseguidos por chuvas estranhas[a], granizo e tempestades implacáveis[b], e consumidos pelo fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chuvas incomuns”. O grego fala literalmente de chuvas “estranhas” ou “estrangeiras”, destacando seu caráter extraordinário.
    reason: lexical_alternative
  - marker: b
    text: Ou “tempestades inevitáveis”. O adjetivo grego indica algo que não pode ser afastado, recusado ou evitado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνούμενοι ... εἰδέναι
  choice: por se recusarem a conhecer-te
  rationale: O particípio com o infinitivo expressa recusa deliberada. “Conhecer-te” conserva o sentido direto de εἰδέναι sem ampliá-lo para “reconhecer-te”.
- source_word: ἀσεβεῖς
  choice: os ímpios
  rationale: Designa pessoas irreverentes para com Deus; “ímpios” preserva essa dimensão religiosa específica.
- source_word: ἐν ἰσχύι βραχίονός σου
  choice: pela força do teu braço
  rationale: Mantém a construção instrumental e a imagem bíblica do braço como expressão do poder divino.
- source_word: ἐμαστιγώθησαν
  choice: foram açoitados
  rationale: Preserva a imagem vigorosa de castigo presente no verbo, sem reduzi-la ao termo genérico “punidos”.
- source_word: ξένοις ὑετοῖς
  choice: chuvas estranhas
  rationale: ξένος indica aqui algo estranho, incomum ou extraordinário; a formulação mantém a imagem sem explicar em excesso.
- source_word: χαλάζαις
  choice: granizo
  rationale: O substantivo coletivo é a forma natural em português para a ocorrência de pedras de gelo.
- source_word: ὄμβροις ἀπαραιτήτοις
  choice: tempestades implacáveis
  rationale: ὄμβρος denota chuva intensa ou temporal, e ἀπαραίτητος aquilo que não pode ser afastado, evitado ou recusado. A expressão comunica com naturalidade a força incontornável do fenômeno.
- source_word: διωκόμενοι
  choice: perseguidos
  rationale: Conserva a personificação dos fenômenos climáticos como forças que vão no encalço dos ímpios.
- source_word: πυρὶ καταναλισκόμενοι
  choice: consumidos pelo fogo
  rationale: Reproduz de modo claro e digno a imagem de destruição pelo fogo.
theological_decisions:
- issue: Natureza de “conhecer” Deus em εἰδέναι
  choice: conhecer-te
  alternative: reconhecer-te ou admitir tua existência
  rationale: O grego diz literalmente “conhecer-te”. A tradução preserva a formulação e sua possível profundidade relacional sem impor uma interpretação teológica mais específica.
- issue: Força metafórica da linguagem de açoite
  choice: foram açoitados
  alternative: foram punidos ou afligidos
  rationale: Embora o castigo seja executado por fenômenos naturais e fogo, o texto emprega deliberadamente uma imagem corporal severa, que não deve ser suavizada.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com formas pronominais coerentes no singular (“teu”, “conhecer-te”). A sintaxe mantém a relação causal, o paralelismo dos particípios e a intensidade poética do juízo.
