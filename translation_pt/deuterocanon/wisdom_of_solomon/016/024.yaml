base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/024.yaml
  text: For creation[a], serving you its maker, strains itself for the punishment of the unrighteous, and relaxes for the benefit of those who have put their trust in you.
translation:
  language: pt
  text: Pois a criação, servindo a ti, que a fizeste, retesa-se para punir os injustos e se afrouxa para beneficiar os que depositaram em ti a sua confiança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “intensifica-se para a punição [...] e se solta para fazer o bem”. O grego emprega imagens físicas contrastantes: a criação é “retesada” em direção ao castigo e “afrouxada” em direção à ação benéfica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κτίσις
  choice: a criação
  rationale: Abrange toda a ordem criada e conserva sua personificação como instrumento que serve a Deus, sem reduzi-la à ideia mais impessoal de “natureza”.
- source_word: τῷ ποιήσαντι
  choice: que a fizeste
  rationale: Expressa naturalmente em português a aposição dirigida a Deus — “a ti, que a fizeste” — e deixa clara a relação entre a criação e aquele que a fez.
- source_word: ὑπηρετοῦσα
  choice: servindo
  rationale: Apresenta a criação como subordinada a Deus e atuando a seu serviço, sem a conotação eclesiástica que “ministrando” poderia adquirir.
- source_word: ἐπιτείνει
  choice: retesa-se
  rationale: Preserva a imagem física de tensão ou estiramento e seu aumento de força, em contraste direto com ἀνίεται.
- source_word: εἰς κόλασιν κατὰ τῶν ἀδίκων
  choice: para punir os injustos
  rationale: Comunica com clareza a finalidade punitiva dirigida contra os que praticam a injustiça, em linguagem corrente e fiel ao sentido judicial do grego.
- source_word: ἀνίεται
  choice: se afrouxa
  rationale: Mantém a imagem de distensão ou soltura que contrasta com “retesa-se”, ainda que a expressão seja deliberadamente figurada quando aplicada à criação.
- source_word: εἰς εὐεργεσίαν
  choice: para beneficiar
  rationale: Transmite o sentido ativo de fazer o bem ou conceder benefício de modo mais natural que o substantivo erudito “beneficência”.
- source_word: ὑπὲρ τῶν εἰς σὲ πεποιθότων
  choice: os que depositaram em ti a sua confiança
  rationale: Reflete a confiança estabelecida e contínua sugerida pelo particípio perfeito πεποιθότων.
theological_decisions:
- issue: A atuação da criação sob a autoridade de Deus
  choice: A criação é apresentada como serva de Deus tanto no castigo como no benefício.
  alternative: Entender a criação ou a natureza como força autônoma e impessoal.
  rationale: ὑπηρετοῦσα e σοι τῷ ποιήσαντι subordinam explicitamente a ação da criação àquele que a fez.
- issue: Contraste entre juízo e benefício
  choice: Conservar em paralelo a ação punitiva contra os injustos e a ação benéfica em favor dos que confiam em Deus.
  alternative: Atenuar o primeiro membro como mera correção educativa ou tornar o segundo uma recompensa doutrinariamente definida.
  rationale: O versículo afirma o contraste, mas não especifica além de κόλασις e εὐεργεσία a natureza teológica exata dessas ações.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com colocação e vocabulário naturais para leitores brasileiros. A formulação conserva a personificação da criação e a imagem cinética incomum do grego; a nota esclarece alternativas sem eliminar a tensão poética.
