base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/010.yaml
  text: But the teeth of venomous serpents did not overcome your sons[a], for your mercy came to their aid and healed them.
translation:
  language: pt
  text: Mas nem os dentes de serpentes venenosas venceram os teus filhos[a], pois a tua misericórdia veio em seu auxílio e os curou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «teus descendentes». O grego diz literalmente «filhos» (masculino plural).
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱούς
  choice: filhos
  rationale: O grego emprega o plural masculino «filhos» para designar os israelitas como povo de Deus. A tradução mantém essa forma explícita, enquanto a nota registra a alternativa contextual «filhos e filhas»/«povo» sem inseri-la no texto.
- source_word: ἰοβόλων
  choice: venenosas
  rationale: O composto descreve criaturas que lançam ou inoculam veneno. «Venenosas» é claro e idiomático em português no contexto de serpentes que mordem.
- source_word: δρακόντων
  choice: serpentes
  rationale: Embora o termo possa ter outros sentidos, neste contexto das criaturas peçonhentas do deserto refere-se a serpentes; «dragões» produziria uma imagem enganosa para o leitor moderno.
- source_word: ἐνίκησαν
  choice: venceram
  rationale: 'Preserva diretamente a metáfora de vitória ou prevalência: as mordidas não tiveram a palavra final sobre eles.'
- source_word: ἀντιπαρῆλθεν
  choice: veio em seu auxílio
  rationale: O verbo composto é incomum e sugere que a misericórdia divina veio ao encontro deles, contrapondo-se ao perigo. Esta formulação comunica com naturalidade sua força interventora.
- source_word: ἰάσατο
  choice: curou
  rationale: Equivalente direto e natural do verbo grego de curar neste contexto.
theological_decisions:
- issue: Referência de «teus filhos»
  choice: Manter «teus filhos» como referência pactual a Israel em uma fala dirigida a Deus.
  alternative: «teus filhos e filhas», «teus descendentes» ou «teu povo»
  rationale: A expressão grega é masculina plural e, no contexto, identifica os israelitas no deserto. Mantê-la preserva a forma e a relação expressas no texto, sem acrescentar uma formulação doutrinária mais abrangente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, preservando a imagem dos dentes, a metáfora de vencer e a ação curadora da misericórdia divina.
