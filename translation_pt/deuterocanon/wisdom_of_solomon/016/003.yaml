base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/003.yaml
  text: so that those men[a], though desiring food, might, because of the appearance of the creatures that had been sent, turn away even from their necessary appetite, while these others, after becoming needy for a short time[b], might partake of a strange taste.
translation:
  language: pt
  text: para que aqueles, embora desejassem alimento, por causa da visão das criaturas enviadas contra eles[a], se afastassem até mesmo do apetite que a necessidade lhes impunha, enquanto estes, depois de passarem necessidade por pouco tempo, provassem um sabor incomum[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa da visão dos seres enviados contra eles”. A expressão grega, elíptica, enfatiza a visão dos seres enviados como causa da repulsa.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, um alimento de tipo não habitual, provavelmente antecipando a provisão extraordinária concedida a Israel.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμοῦντες τροφήν
  choice: embora desejassem alimento
  rationale: Expressa o desejo por comida e torna explícito, de modo natural em português, o valor concessivo do particípio no contexto.
- source_word: διὰ τὴν δειχθεῖσαν τῶν ἐπαπεσταλμένων
  choice: diante da aparência das criaturas enviadas contra eles
  rationale: A construção grega transmitida é elíptica, mas destaca aquilo que foi mostrado ou visto entre os seres enviados; a formulação portuguesa preserva a causa visual da repulsa e explicita prudentemente o referente contextual.
- source_word: ἀναγκαίαν ὄρεξιν ἀποστρέφωνται
  choice: perdessem até o apetite imposto pela necessidade
  rationale: Comunica que a repulsa os afastou até mesmo do apetite decorrente da necessidade física; é mais idiomático que uma reprodução rígida de 'afastar-se do apetite necessário'.
- source_word: ἐπʼ ὀλίγον ἐνδεεῖς γενόμενοι
  choice: depois de passarem necessidade por pouco tempo
  rationale: Preserva tanto a privação quanto sua curta duração, sem sugerir miséria permanente ou fome extrema.
- source_word: ξένης μετάσχωσι γεύσεως
  choice: experimentassem um sabor desconhecido
  rationale: Μετέχω com o genitivo indica participação ou experiência, e ξένης assinala um sabor alheio ao habitual; 'desconhecido' evita a possível conotação étnica de 'estrangeiro'.
theological_decisions:
- issue: Referência do contraste entre ἐκεῖνοι e αὐτοί
  choice: Manter os grupos como 'aqueles' e 'estes', deixando o contexto identificar os primeiros com os egípcios e os segundos com o povo de Deus.
  alternative: Nomear diretamente 'os egípcios' e 'os israelitas'.
  rationale: O contexto sustenta essa identificação histórica, mas o versículo emprega pronomes contrastivos; preservá-los evita inserir nomes ausentes do texto.
- issue: Natureza do 'sabor desconhecido'
  choice: Não identificar no corpo do versículo o alimento como maná.
  alternative: Traduzir ou explicar diretamente como referência ao maná.
  rationale: O contexto aponta para a provisão extraordinária dada a Israel, mas o grego deste versículo fala apenas de um sabor incomum ou desconhecido.
translation_notes:
  register: Português moderno, claro e digno, com contraste marcado por 'aqueles... estes'. 'Passarem necessidade' e 'experimentassem um sabor desconhecido' dão naturalidade sem apagar a tensão nem acrescentar uma identificação explícita ausente do grego.
