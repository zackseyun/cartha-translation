base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/009.yaml
  text: For those whom the bites of locusts and flies killed, no healing was found for their life, because they were worthy to be punished by such things;
translation:
  language: pt
  text: Pois, para aqueles a quem as picadas de gafanhotos e moscas mataram, não se encontrou remédio para a vida deles,[a] porque eram dignos de ser castigados por tais coisas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se encontrou remédio para a alma deles”. Neste contexto, “vida” é preferível, porque o assunto é a morte física causada pelas picadas.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por tais criaturas”. O grego diz, de modo mais amplo, “por tais coisas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δήγματα
  choice: picadas
  rationale: Abrange mordidas ou ferroadas de animais e é o termo português mais natural para lesões causadas por insetos sem especificar indevidamente o mecanismo.
- source_word: ἀκρίδων
  choice: gafanhotos
  rationale: ἀκρίς designa normalmente o gafanhoto, especialmente reconhecível no contexto das pragas.
- source_word: μυιῶν
  choice: moscas
  rationale: Corresponde ao sentido comum e não restringe desnecessariamente a espécie.
- source_word: ἀπέκτεινεν
  choice: foram mortos
  rationale: Expressa diretamente a morte causada pelas picadas e permite uma construção portuguesa natural, embora o grego empregue verbo ativo singular com δήγματα como sujeito.
- source_word: οὐχ εὑρέθη ἴαμα
  choice: não encontraram remédio
  rationale: ἴαμα é cura ou remédio; esta formulação comunica naturalmente a inexistência de um recurso curativo, ainda que reformule a passiva grega.
- source_word: τῇ ψυχῇ αὐτῶν
  choice: para sua vida
  rationale: No contexto de morte física, ψυχή refere-se mais naturalmente à vida; a nota preserva a tradução alternativa 'alma'.
- source_word: ἄξιοι ἦσαν
  choice: eram dignos
  rationale: Mantém de perto a formulação grega de mérito ou correspondência, sem enfraquecer a ideia de castigo merecido.
- source_word: ὑπὸ τοιούτων
  choice: por tais coisas
  rationale: Conserva a referência ampla e algo ambígua do grego, em vez de limitá-la explicitamente aos animais.
- source_word: κολασθῆναι
  choice: ser castigados
  rationale: Transmite com clareza o sentido de punição judicial de κολάζω em português corrente e digno.
theological_decisions:
- issue: Sentido de ψυχή em contexto de morte e cura
  choice: vida
  alternative: alma
  rationale: A morte causada pelas picadas e a falta de remédio favorecem o sentido concreto de 'vida', sem transformar o versículo numa afirmação sobre a condição metafísica da alma; a alternativa permanece em nota.
- issue: Força moral de ἄξιοι ἦσαν ... κολασθῆναι
  choice: eram dignos de ser castigados
  alternative: mereciam ser castigados
  rationale: Preserva a afirmação explícita de que o castigo era adequado ou merecido, mantendo ao mesmo tempo a forma do grego mais de perto.
- issue: Referente de ὑπὸ τοιούτων
  choice: por tais coisas
  alternative: por tais criaturas
  rationale: O grego é deliberadamente amplo; a tradução não resolve se a referência recai especificamente sobre os insetos ou, de modo mais geral, sobre esses meios de castigo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Picadas” é idiomático para ataques de insetos; “remédio para sua vida” retém a relação com ψυχή, embora seja menos coloquial, e a nota registra a ambiguidade lexical.
