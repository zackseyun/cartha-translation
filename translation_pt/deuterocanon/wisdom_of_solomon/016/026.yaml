base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/026.yaml
  text: so that your children[a], whom you loved, might learn, O Lord, that it is not the produce of crops that nourishes a man[b], but your word preserves those who trust in you.
translation:
  language: pt
  text: para que os teus filhos, a quem amaste, aprendessem, Senhor, que não são os produtos das colheitas que alimentam o ser humano, mas é a tua palavra que preserva os que confiam em ti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que creem em ti”. O particípio grego pode indicar tanto confiança quanto uma resposta de fé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μάθωσιν
  choice: para que ... aprendessem
  rationale: Preserva a finalidade expressa por ἵνα com o subjuntivo e se liga naturalmente, em português, à narrativa no passado do contexto.
- source_word: οἱ υἱοί σου
  choice: os teus filhos
  rationale: “Filhos” mantém a forma masculina plural do grego e, no contexto, pode designar coletivamente o povo amado por Deus.
- source_word: οὓς ἠγάπησας
  choice: a quem amaste
  rationale: Reproduz de modo direto o aoristo e concorda com o antecedente coletivo “filhos”.
- source_word: Κύριε
  choice: Senhor
  rationale: O vocativo é natural sem a interjeição “ó” e conserva o registro digno da oração.
- source_word: οὐχ αἱ γενέσεις τῶν καρπῶν
  choice: não são os produtos das colheitas
  rationale: γενέσεις indica aquilo que é produzido ou gerado, e καρποί, neste contexto agrícola, refere-se ao rendimento das colheitas, não apenas a frutas.
- source_word: τρέφουσιν ἄνθρωπον
  choice: alimentam o ser humano
  rationale: Expressa o singular genérico ἄνθρωπον de forma clara e abrangente em português contemporâneo.
- source_word: ἀλλὰ τὸ ῥῆμά σου
  choice: mas é a tua palavra
  rationale: “Palavra” traduz naturalmente ῥῆμα e preserva a provável ressonância de Deuteronômio 8:3; a construção clivada esclarece o contraste.
- source_word: τοὺς σοὶ πιστεύοντας
  choice: os que confiam em ti
  rationale: O particípio com dativo pode indicar fé, crédito ou confiança pessoal; “confiam em ti” se ajusta bem à ideia de dependência sustentadora.
- source_word: διατηρεῖ
  choice: preserva
  rationale: Mantém o sentido de conservar, guardar ou manter vivo sem restringi-lo indevidamente apenas à sobrevivência física.
theological_decisions:
- issue: Provável alusão a Deuteronômio 8:3
  choice: 'Manter a formulação própria de Sabedoria: “a tua palavra ... preserva”.'
  alternative: Expandir ou harmonizar com “não só de pão viverá o ser humano”.
  rationale: O texto grego evoca o tema de Deuteronômio, mas não reproduz sua formulação completa; a tradução conserva a alusão sem inserir palavras ausentes.
- issue: Amplitude de τοὺς σοὶ πιστεύοντας
  choice: “os que confiam em ti”
  alternative: “os que creem em ti” ou “os que acreditam em ti”
  rationale: A escolha comunica confiança e dependência pessoal, mas a nota preserva a possibilidade lexical de uma resposta de fé ou crença.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente ajustada para fluência, sem eliminar o contraste enfático entre o alimento agrícola e a palavra divina.
