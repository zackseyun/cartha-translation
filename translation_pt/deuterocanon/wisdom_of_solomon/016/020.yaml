base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/016/020.yaml
  text: Instead of these things[a], you fed your people with the food of angels, and without their labor you sent them ready bread from heaven, able to satisfy every delight and suited to every taste.
translation:
  language: pt
  text: Em vez dessas coisas, alimentaste o teu povo com alimento de anjos[a] e, sem que precisassem trabalhar, enviaste-lhes do céu pão já preparado, capaz de proporcionar todo deleite e adequado a todo paladar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alimento dos anjos” ou “pão próprio para anjos”. A expressão grega não exige uma explicação mais específica.'
    reason: Alternativa lexical e preservação da ambiguidade do genitivo grego.
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: Em vez dessas coisas
  rationale: No contexto, a expressão contrasta os castigos anteriores com o tratamento dado por Deus ao seu povo. A tradução conserva essa força contrastiva sem convertê-la em mera causalidade.
- source_word: ἀγγέλων τροφήν
  choice: alimento de anjos
  rationale: τροφὴ designa alimento ou sustento. A formulação mantém o genitivo grego e sua ambiguidade, sem antecipar ἄρτον, traduzido depois por “pão”.
- source_word: ἐψώμισας
  choice: alimentaste
  rationale: O verbo significa dar alimento ou alimentar. A escolha é direta, natural e mantém “o teu povo” como objeto.
- source_word: ἕτοιμον ἄρτον
  choice: pão já preparado
  rationale: ἕτοιμον indica algo pronto ou preparado. “Já preparado” comunica com naturalidade que o pão lhes foi fornecido pronto.
- source_word: ἀπʼ οὐρανοῦ
  choice: do céu
  rationale: Expressa de modo claro e idiomático a origem celestial do pão.
- source_word: ἀκοπιάτως
  choice: sem que eles trabalhassem
  rationale: O advérbio indica ausência de fadiga ou trabalho. No contexto da provisão do maná, a formulação explicita de maneira natural que o povo o recebeu sem produzi-lo por seu próprio trabalho.
- source_word: πᾶσαν ἡδονὴν ἰσχύοντα
  choice: capaz de satisfazer todo prazer
  rationale: ἰσχύοντα comunica capacidade ou eficácia, enquanto ἡδονή significa prazer ou deleite. A expressão portuguesa preserva essa capacidade atribuída ao pão sem tornar o sentido excessivamente literal.
- source_word: πρὸς πᾶσαν ἁρμόνιον γεῦσιν
  choice: adequado a todo paladar
  rationale: γεῦσις refere-se a gosto ou sabor, e ἁρμόνιον àquilo que é apropriado ou ajustado. “Todo paladar” transmite naturalmente a adequação a diferentes gostos.
theological_decisions:
- issue: Natureza do maná como “alimento de anjos”
  choice: Manter “alimento de anjos” sem definir a relação expressa pelo genitivo.
  alternative: alimento dos anjos; pão digno de anjos
  rationale: O genitivo grego não exige decidir se se trata de alimento pertencente aos anjos ou apropriado para eles. A tradução preserva a ênfase na provisão celestial sem impor uma explicação angelológica.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais na segunda pessoa do singular para refletir a invocação direta a Deus. “Pão já preparado” e “adequado a todo paladar” favorecem legibilidade ampla, inclusive brasileira, sem perder a estrutura e as tensões do grego.
