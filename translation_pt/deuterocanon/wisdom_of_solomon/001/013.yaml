  text: For God did not make death[a], nor does he delight in the destruction of the living;
translation:
  language: pt
  text: Pois Deus não fez a morte[a], nem se alegra com a destruição dos que vivem;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não criou a morte”. O verbo grego pode ser traduzido das duas maneiras; “fez” foi adotado aqui como equivalente mais direto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior, preservando a força causal do grego de modo natural em português.
- source_word: ὁ θεὸς
  choice: Deus
  rationale: Tradução direta do sujeito; o artigo grego não precisa ser reproduzido em português.
- source_word: θάνατον
  choice: a morte
  rationale: Mantém o substantivo abstrato como objeto direto, sem ampliação interpretativa.
- source_word: οὐκ ἐποίησεν
  choice: não fez
  rationale: Reproduz diretamente o sentido comum de ποιέω e evita especificar além do texto uma nuance cosmológica, embora “não criou” também seja possível.
- source_word: οὐδὲ
  choice: nem
  rationale: Liga naturalmente a segunda oração negativa à primeira.
- source_word: τέρπεται
  choice: se alegra
  rationale: Expressa prazer ou satisfação afetiva em linguagem corrente e digna.
- source_word: ἐπʼ ἀπωλείᾳ
  choice: com a destruição
  rationale: ἀπώλεια denota destruição, ruína ou perdição; esta opção conserva o sentido resultativo sem o restringir.
- source_word: ζώντων
  choice: dos que vivem
  rationale: Traduz o particípio presente substantivado de maneira inclusiva e natural, sem limitar explicitamente a referência a pessoas ou a todos os seres vivos.
theological_decisions:
- issue: Como traduzir ἐποίησεν na afirmação sobre a relação de Deus com a morte
  choice: não fez a morte
  alternative: não criou a morte
  rationale: “Fez” permanece mais próximo da amplitude semântica de ποιέω e evita transformar a frase numa formulação técnica sobre criação, preservando ao mesmo tempo a negação enfática do texto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe levemente elevada. “Dos que vivem” preserva a abrangência do grego sem introduzir uma delimitação ausente no original.
