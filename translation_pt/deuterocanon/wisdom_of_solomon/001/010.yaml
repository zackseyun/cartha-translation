translation:
  language: pt
  text: Pois o ouvido do ciúme[a] ouve tudo, e o som das murmurações[b] não fica oculto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o ouvido do zelo». O termo grego pode indicar tanto ciúme quanto zelo vigilante.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «o ruído dos resmungos», «o sussurro das queixas» ou «o relato de reclamações».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖς
  choice: o ouvido
  rationale: Mantém literalmente a imagem personificada da percepção divina e soa natural em português.
- source_word: ζηλώσεως
  choice: do ciúme
  rationale: Preserva a força aguda e moralmente carregada do grego, que pode indicar ciúme ou zelo vigilante, sem reduzi-lo a inveja mesquinha.
- source_word: ἀκροᾶται
  choice: escuta
  rationale: Expressa percepção atenta, adequada à imagem de um ouvido vigilante, sem acrescentar conteúdo ausente do grego.
- source_word: τὰ πάντα
  choice: tudo
  rationale: Equivalente português natural e abrangente para a expressão grega.
- source_word: θροῦς
  choice: o murmúrio
  rationale: Transmite um som baixo e indistinto; em combinação com γογγυσμῶν, conserva a imagem auditiva de reclamações proferidas em voz baixa.
- source_word: γογγυσμῶν
  choice: das queixas
  rationale: Comunica o sentido de reclamações ou resmungos, enquanto o substantivo anterior já representa seu caráter murmurante.
- source_word: οὐκ ἀποκρύπτεται
  choice: não fica oculto
  rationale: Reproduz de modo claro a construção passiva e a ideia de que nenhuma reclamação secreta escapa à percepção.
theological_decisions:
- issue: Sentido de ζηλώσεως em relação à percepção divina
  choice: ciúme
  alternative: zelo; vigilância zelosa
  rationale: “Ciúme” conserva a tensão da expressão grega e sua noção de vigilância moral intensa. A nota registra “zelo” como possibilidade legítima, evitando definir o termo como inveja pecaminosa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A estrutura conserva o paralelismo auditivo do grego e sua ambiguidade em ζηλώσεως.
