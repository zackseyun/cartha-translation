  source_fidelity: A tradução preserva adequadamente a personificação da Morte, a referência pronominal, o paralelismo entre mãos e palavras e a ideia de uma aliança com ela. Contudo, «consumiram-se por ele» introduz uma relação causal ou final («por ele») que não está expressa em ἐτάκησαν, que significa simplesmente que definharam/se consumiram.
  naturalness: O texto é claro e de registro apropriado. «Quinhão dele» comunica com mais naturalidade a metáfora de μερίς do que «porção dele», sem abandonar a imagem de uma parte ou destino atribuído.
  terminology: «Ímpios», «aliança» e «Morte» na nota são escolhas adequadas. «Quinhão» conserva o campo semântico de parte, lote ou destino; a nota registra «sorte» como alternativa idiomática.
