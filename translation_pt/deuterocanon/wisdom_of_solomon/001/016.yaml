base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/016.yaml
  text: But the ungodly[a], with their hands and their words, called for him; considering him a friend, they wasted away, and they made a covenant with him[c][b], because they are worthy to belong to his portion.
translation:
  language: pt
  text: Mas os ímpios, com as mãos e as palavras, chamaram-no para junto de si[a]; considerando-o amigo, consumiram-se e fizeram uma aliança com ele[b], pois são dignos de pertencer ao quinhão dele[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome se refere à Morte, personificada no contexto anterior.
    reason: cross_reference
  - marker: b
    text: 'Ou: “fizeram um pacto com ele”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “pertencer à sorte dele”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσεβεῖς
  choice: os ímpios
  rationale: Preserva a força religiosa e moral do termo grego, ao passo que “maus” ou “perversos” seriam mais gerais.
- source_word: ταῖς χερσὶ καὶ τοῖς λόγοις
  choice: com as mãos e as palavras
  rationale: Mantém a imagem concreta e o paralelismo entre ações e palavras.
- source_word: προσεκαλέσαντο αὐτόν
  choice: chamaram-no para junto de si
  rationale: 'Expressa a nuance da voz média: eles chamaram ou atraíram a si aquele que o contexto personifica.'
- source_word: φίλον ἡγησάμενοι αὐτόν
  choice: considerando-o amigo
  rationale: Reproduz diretamente a construção predicativa e conserva a personificação da Morte como aliada.
- source_word: ἐτάκησαν
  choice: consumiram-se por ele
  rationale: O verbo evoca derreter-se, definhar ou consumir-se; a formulação portuguesa conserva a imagem e a possível ideia de anseio, sem explicá-la em excesso.
- source_word: συνθήκην ἔθεντο πρὸς αὐτόν
  choice: fizeram uma aliança com ele
  rationale: “Aliança” preserva o caráter solene e vinculante de συνθήκη, bem como a ironia da união voluntária com a Morte.
- source_word: ἄξιοί εἰσιν
  choice: são dignos
  rationale: Mantém de perto a linguagem de merecimento ou correspondência presente em ἄξιος, sem eliminar sua força irônica.
- source_word: τῆς ἐκείνου μερίδος εἶναι
  choice: fazer parte da porção dele
  rationale: Conserva a imagem de uma parte ou domínio que cabe à Morte, em formulação compreensível no português atual.
theological_decisions:
- issue: Referente dos pronomes masculinos ao longo do versículo
  choice: Manter os pronomes e esclarecer em nota que se referem à Morte personificada no contexto anterior.
  alternative: Substituir os pronomes por “a Morte” no texto principal.
  rationale: O grego emprega pronomes retomando θάνατος, substantivo masculino e personagem do contexto. A tradução preserva essa coesão pronominal sem ocultar do leitor o referente.
- issue: Força de συνθήκη
  choice: “aliança”
  alternative: “pacto” ou “acordo”
  rationale: A palavra descreve aqui uma associação solene, não uma aliança divina. “Aliança” conserva a gravidade retórica sem acrescentar uma doutrina específica.
- issue: Sentido da porção atribuída à Morte
  choice: “fazer parte da porção dele”
  alternative: “partilhar da sorte dele”
  rationale: A formulação principal preserva a metáfora distributiva de μερίς e deixa em aberto se a ênfase recai no domínio, no quinhão ou no destino associado à Morte.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “ele” mantém a personificação e a coesão do grego; “para junto de si” explicita de modo natural a nuance da voz média.
