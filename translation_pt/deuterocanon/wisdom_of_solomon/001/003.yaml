  text: For crooked thoughts separate from God, and when his power is tested, it exposes the foolish.
translation:
  language: pt
  text: Pois pensamentos perversos afastam de Deus[a], e o poder, quando posto à prova, desmascara os insensatos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “raciocínios tortuosos separam de Deus”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e o poder, ao ser provado, repreende os insensatos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκολιοὶ
  choice: perversos
  rationale: Expressa a distorção moral indicada pelo adjetivo, com naturalidade em português; não se trata apenas de erro intelectual.
- source_word: λογισμοὶ
  choice: pensamentos
  rationale: Abrange a atividade interior de pensar, ponderar e formular intenções, sem restringir o termo a raciocínios formais.
- source_word: χωρίζουσιν ἀπὸ θεοῦ
  choice: afastam de Deus
  rationale: Comunica de modo natural a separação causada por tais pensamentos, sem acrescentar uma formulação teológica mais desenvolvida.
- source_word: δοκιμαζομένη
  choice: quando posto à prova
  rationale: Traduz o particípio em sentido temporal e preserva a ideia de poder submetido a teste ou desafio.
- source_word: ἡ δύναμις
  choice: o poder
  rationale: Mantém o artigo e a formulação do grego, preservando a referência contextual ao poder de Deus sem inserir um possessivo ausente do texto.
- source_word: ἐλέγχει
  choice: desmascara
  rationale: Transmite a ideia de expor e revelar a verdadeira condição dos insensatos, sem limitar o verbo a condenação judicial ou repreensão.
- source_word: τοὺς ἄφρονας
  choice: os insensatos
  rationale: Designa os que carecem de sensatez ou sabedoria e se ajusta ao registro da literatura sapiencial.
theological_decisions:
- issue: Referente de ἡ δύναμις
  choice: Mantido como “o poder”, com referência contextual ao poder de Deus.
  alternative: “seu poder” ou “o poder de Deus”
  rationale: A menção imediatamente anterior a Deus torna provável esse referente, mas a formulação sem possessivo preserva mais de perto a expressão grega e sua leve ambiguidade.
- issue: Sentido de ἐλέγχει diante da prova do poder
  choice: “desmascara os insensatos”
  alternative: “convence os insensatos de seu erro”, “repreende os insensatos” ou “condena os insensatos”
  rationale: A escolha preserva o sentido de exposição da insensatez sem especificar indevidamente se a ação é judicial, corretiva ou meramente reveladora.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a tensão do grego foram preservadas sem tornar explícito no texto principal o possessivo “seu” antes de “poder”.
