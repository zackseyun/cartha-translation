lexical_decisions:
- source_word: δικαιοσύνη
  choice: justiça
  rationale: O termo grego abrange tanto a justiça quanto a retidão moral. Em português, “justiça” preserva bem a amplitude ética e teológica do contexto, enquanto “retidão” é registrada como alternativa.
- source_word: γάρ
  choice: pois
  rationale: A conjunção fundamenta a afirmação anterior; “pois” mantém de forma natural e concisa essa relação explicativa.
- source_word: ἀθάνατος
  choice: imortal
  rationale: O adjetivo indica aquilo que não está sujeito à morte; “imortal” é a equivalência direta, clara e adequada ao caráter aforístico do versículo.
- source_word: ἐστιν
  choice: é
  rationale: Trata-se de uma cópula simples, sem necessidade de expansão.
theological_decisions:
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: “Justiça” conserva a dimensão moral e teológica do termo sem reduzi-lo ao âmbito jurídico. Como o grego também pode salientar a qualidade pessoal de retidão, essa possibilidade é preservada em nota.
translation_notes:
  register: Formulação breve, digna e proverbial, em português moderno de ampla compreensão. A ordem sintática acompanha naturalmente o grego sem soar artificial.
