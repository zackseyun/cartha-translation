base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/009.yaml
  text: For an inquiry will be made into the schemes of the ungodly[c][b][a], and a report of his words will come to the Lord for the exposing of his lawless deeds.
translation:
  language: pt
  text: Pois os planos do ímpio[a] serão investigados, e um relato[b] de suas palavras chegará ao Senhor para expor[c] os seus atos contrários à lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deliberações”, “propósitos” ou “projetos” do ímpio.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “uma audição” ou “aquilo que se ouve”; aqui, o sentido é que as palavras chegam ao conhecimento do Senhor.
    reason: lexical_alternative
  - marker: c
    text: Ou “para repreender”, “para comprovar” ou “para declarar a culpa por” seus atos contrários à lei.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαβουλίοις
  choice: planos
  rationale: O termo designa deliberações, propósitos ou planos. “Planos” é claro e natural, sem acrescentar por si só a ideia de conspiração.
- source_word: ἀσεβοῦς
  choice: do ímpio
  rationale: O singular é genérico e descreve quem não demonstra reverência a Deus. “Ímpio” preserva essa dimensão religiosa e moral.
- source_word: ἐξέτασις
  choice: serão investigados
  rationale: O substantivo indica exame minucioso ou investigação. A construção verbal produz português natural e mantém o sentido judicial de escrutínio.
- source_word: λόγων
  choice: palavras
  rationale: Tradução direta, que preserva a amplitude do termo grego e a ênfase contextual no que a pessoa diz.
- source_word: ἀκοὴ
  choice: um relato
  rationale: Embora o sentido literal seja “audição” ou “aquilo que se ouve”, no contexto refere-se às palavras que chegam ao conhecimento do Senhor.
- source_word: Κύριον
  choice: o Senhor
  rationale: Forma portuguesa tradicional e transparente para Κύριον neste contexto.
- source_word: ἔλεγχον
  choice: expor
  rationale: O termo pode indicar exposição, refutação, repreensão ou comprovação. “Expor” conserva a ideia de trazer os delitos à luz sem definir de modo excessivo o resultado judicial.
- source_word: ἀνομημάτων
  choice: atos contrários à lei
  rationale: O plural concreto designa atos que violam a lei. A formulação é transparente e evita reduzir o termo a uma abstração.
theological_decisions:
- issue: Referência genérica singular em ἀσεβοῦς e αὐτοῦ
  choice: 'Manter o singular masculino genérico: “do ímpio ... suas ... seus”.'
  alternative: Converter em plural genérico (“dos ímpios ... suas”) ou explicitar “da pessoa ímpia”.
  rationale: O grego emprega o singular, e mantê-lo preserva a forma individualizante do juízo sem excluir mulheres do alcance geral da afirmação.
- issue: Valor de ἔλεγχον
  choice: Traduzir pela ideia de exposição dos atos.
  alternative: “Para repreender”, “para convencer da culpa” ou “para comprovar”.
  rationale: O vocábulo admite tanto exposição e comprovação quanto repreensão ou condenação. A escolha mantém a imagem de os delitos serem trazidos à luz e a nota registra a ambiguidade.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A frase conserva o singular genérico do grego e o tom judicial, mas evita linguagem jurídica excessivamente técnica.
