base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/004.yaml
  text: For wisdom will not enter a soul that devises evil[b][a], nor dwell in a body enslaved to sin.
translation:
  language: pt
  text: Pois a sabedoria não entrará numa alma que trama o mal[a], nem habitará num corpo sujeito ao pecado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “astuta para o mal”, “perversa” ou, mais literalmente, “habilidosa no mal”.
    reason: lexical_alternative
  - marker: b
    text: Ou “escravizado pelo pecado”, “devedor do pecado” ou “sob o domínio do pecado”. O grego descreve um corpo submetido à reivindicação ou ao controle do pecado.
    reason: lexical_alternative
lexical_decisions:
- source_word: κακότεχνον
  choice: que trama o mal
  rationale: O adjetivo caracteriza quem emprega habilidade ou artifício para o mal. “Que trama o mal” conserva a ideia ativa de conceber ou arquitetar o mal, sem reduzi-la apenas a engano ou maldade genérica.
- source_word: ψυχὴν
  choice: alma
  rationale: Preserva o termo antropológico e o contraste explícito do verso entre ψυχή e σώμα, sem definir além do texto a relação metafísica entre ambos.
- source_word: εἰσελεύσεται
  choice: entrará
  rationale: Reproduz naturalmente o futuro e mantém a metáfora espacial da entrada da sabedoria.
- source_word: σοφία
  choice: sabedoria
  rationale: É o equivalente corrente e adequado ao vocabulário sapiencial.
- source_word: κατοικήσει
  choice: habitará
  rationale: Expressa residência estável e preserva o contraste entre entrar e permanecer habitando.
- source_word: σώματι
  choice: corpo
  rationale: Tradução direta que mantém o contraste literário com “alma”.
- source_word: κατάχρεῳ
  choice: sujeito ao
  rationale: Comunica que o corpo está sob a obrigação, reivindicação ou domínio do pecado, preservando melhor a amplitude da expressão grega do que uma formulação que explicite apenas escravidão ou dívida.
- source_word: ἁμαρτίας
  choice: pecado
  rationale: Equivalente direto do substantivo no genitivo; evita a abstração adicional de “pecaminosidade”.
theological_decisions:
- issue: Contraste antropológico entre alma e corpo
  choice: Manter “alma” e “corpo” como termos distintos.
  alternative: Traduzir ψυχή como “pessoa”, “vida” ou “ser interior”.
  rationale: O grego estabelece expressamente esse contraste. A tradução o conserva sem impor uma antropologia dualista completa.
- issue: Sentido de κατάχρεῳ ἁμαρτίας
  choice: “sujeito ao pecado”
  alternative: “escravizado pelo pecado”, “devedor do pecado” ou “entregue ao pecado”
  rationale: A expressão pode evocar dívida, sujeição ou domínio. “Sujeito ao pecado” mantém essa tensão sem enfraquecer a relação de dependência nem selecionar apenas uma das metáforas possíveis.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe simples. “Trama o mal” torna perceptível a nuance de artifício em κακότεχνον; “habitará” preserva o tom sapiencial elevado sem soar arcaico.
