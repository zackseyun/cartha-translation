  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/008.yaml
  text: Therefore no one who speaks unrighteous things will escape notice[b][a], nor will convicting justice pass him by.
translation:
  language: pt
  text: Por isso, ninguém que diga coisas injustas passará despercebido,[a] nem a justiça, ao expô-lo, passará ao lado dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ninguém que diga coisas injustas ficará oculto”.'
    reason: lexical_alternative
  - marker: b
    text: '“Justiça” pode estar personificada. Outra tradução possível: “nem o juízo, ao convencê-lo de culpa, passará ao lado dele”.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Conector inferencial natural que liga a advertência à afirmação anterior.
- source_word: φθεγγόμενος ἄδικα
  choice: que profira coisas injustas
  rationale: Expressa o ato de enunciar conteúdo moralmente injusto; “profira” mantém um registro digno sem soar arcaico.
- source_word: οὐδεὶς μὴ λάθῃ
  choice: ninguém ... passará despercebido
  rationale: A construção negativa enfática com subjuntivo aponta para negação futura categórica; λανθάνω indica não ser notado ou permanecer oculto.
- source_word: οὐδὲ μὴ παροδεύσῃ αὐτόν
  choice: nem ... passará por ele
  rationale: Conserva a imagem espacial de παροδεύω, sem reduzir o sentido a uma simples omissão mental.
- source_word: ἐλέγχουσα
  choice: que o desmascara
  rationale: Mantém a ideia de expor e demonstrar a culpa. O pronome explicita em português o objeto já presente em αὐτόν.
- source_word: ἡ δίκη
  choice: a justiça
  rationale: Preserva tanto o campo judicial quanto a possível personificação de δίκη, sem estreitá-lo a “castigo”.
theological_decisions:
- issue: Relação entre ἄδικα e δίκη no campo moral e judicial
  choice: “coisas injustas” e “a justiça”
  alternative: “coisas perversas” e “o julgamento”
  rationale: A opção mantém visível a oposição lexical entre injustiça e justiça e preserva a tensão entre ordem moral, juízo e possível personificação.
- issue: Força de ἐλέγχουσα aplicada à justiça
  choice: “que o desmascara”
  alternative: “que o condena”
  rationale: “Desmascara” comunica exposição comprobatória da culpa sem pressupor que o termo, por si só, já denote a sentença condenatória final.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a imagem de a justiça não passar pelo culpado e evita linguagem confessional específica.
