  text: because he is found by those who do not test him[b][a], and he reveals himself to those who do not distrust him.
translation:
  language: pt
  text: porque ele se deixa encontrar pelos que não o põem à prova[a] e se manifesta aos que não desconfiam dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não o testam». O verbo grego também pode ter o sentido de «tentar» em alguns contextos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «não creem nele» ou «não têm fé nele».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: porque
  rationale: Expressa com clareza a relação causal com a exortação do versículo anterior.
- source_word: εὑρίσκεται
  choice: se deixa encontrar
  rationale: Reproduz de modo natural em português a forma passiva ou média e a ideia de que Deus pode ser encontrado, sem definir além do texto como isso acontece.
- source_word: τοῖς μὴ πειράζουσιν αὐτόν
  choice: pelos que não o põem à prova
  rationale: πειράζω pode significar provar, testar ou tentar. Como Deus é o objeto e o contexto contrasta a busca sincera com uma atitude indevida, «pôr à prova» conserva a amplitude pertinente sem impor de imediato o sentido moral mais forte de «tentar».
- source_word: ἐμφανίζεται
  choice: se manifesta
  rationale: Mantém o sentido de tornar-se manifesto ou conhecido e preserva o paralelismo conciso do grego.
- source_word: τοῖς μὴ ἀπιστοῦσιν αὐτῷ
  choice: aos que não desconfiam dele
  rationale: ἀπιστέω pode indicar descrença, falta de fé ou falta de confiança. «Não desconfiam dele» comunica em português uma postura relacional diante de Deus, sem reduzir o termo a uma negação meramente intelectual.
theological_decisions:
- issue: Nuance relacional ou intelectual de ἀπιστοῦσιν αὐτῷ
  choice: não desconfiam dele
  alternative: não deixam de crer nele; não lhe são infiéis
  rationale: A formulação escolhida preserva a dimensão de confiança na aproximação a Deus, enquanto a nota registra a amplitude do termo grego e evita transformar a frase numa definição doutrinária mais estreita.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. «Põem à prova» e «se manifesta» mantêm o tom sapiencial sem arcaísmo; as notas preservam as alternativas lexicais reais do grego.
