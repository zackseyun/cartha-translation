base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/005.yaml
  text: For a holy spirit of discipline will flee deceit[a], and it will depart from senseless thoughts[c][b], and it will be rebuked when unrighteousness comes upon it.
translation:
  language: pt
  text: Pois um espírito santo de disciplina[a] fugirá do engano, afastar-se-á de pensamentos insensatos e será repreendido[b] quando sobrevier a injustiça[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Espírito Santo de instrução”. O grego não usa artigo; “disciplina” também pode ser traduzido por “instrução” ou “formação”.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “será exposto”, “será censurado” ou “será convencido”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “quando sobrevier a iniquidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅγιον ... πνεῦμα
  choice: um espírito santo
  rationale: A expressão grega não tem artigo. A forma indefinida e em minúsculas preserva seu caráter qualitativo sem excluir a possível referência ao Espírito Santo.
- source_word: παιδείας
  choice: de disciplina
  rationale: “Disciplina” abrange instrução, formação e correção moral, preservando a amplitude de παιδεία.
- source_word: φεύξεται δόλον
  choice: fugirá do engano
  rationale: Mantém a imagem vívida de fuga expressa por φεύγω e traduz δόλος por um termo moderno e abrangente.
- source_word: ἀπαναστήσεται ἀπὸ
  choice: afastar-se-á de
  rationale: Expressa separação e retirada de modo natural em português, sem perder a força do verbo composto.
- source_word: λογισμῶν ἀσυνέτων
  choice: pensamentos insensatos
  rationale: λογισμοί pode indicar pensamentos ou raciocínios; ἀσύνετοι caracteriza aquilo que carece de entendimento.
- source_word: ἐλεγχθήσεται
  choice: será repreendido
  rationale: O passivo de ἐλέγχω admite os sentidos de repreender, convencer e expor. “Será repreendido” conserva a forma passiva e a força corretiva, enquanto a nota registra alternativas relevantes.
- source_word: ἐπελθούσης ἀδικίας
  choice: quando sobrevier a injustiça
  rationale: A oração temporal reproduz o genitivo absoluto e “sobrevier” conserva a ideia de algo que chega ou avança. “Injustiça” mantém a possibilidade social e moral de ἀδικία.
theological_decisions:
- issue: Se ἅγιον ... πνεῦμα deve ser apresentado como o nome próprio “o Espírito Santo”
  choice: um espírito santo de disciplina
  alternative: o Espírito Santo de disciplina
  rationale: A ausência do artigo e o contexto sapiencial não exigem um título próprio. A tradução mantém a ambiguidade teológica em vez de impor uma identificação posterior.
- issue: Sentido de ἀδικία
  choice: injustiça
  alternative: iniquidade
  rationale: Ambos são possíveis. “Injustiça” é corrente e preserva o sentido de conduta contrária ao que é justo; a nota registra a alternativa moral-religiosa mais marcada.
- issue: Referência e efeito de ἐλεγχθήσεται
  choice: será repreendido
  alternative: será exposto
  rationale: A gramática faz do espírito o sujeito natural do passivo, embora a afirmação seja teologicamente tensa. A tradução não elimina essa tensão nem explicita um agente ausente do grego.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do grego. “Afastar-se-á” e “sobrevier” têm registro levemente elevado, apropriado ao gênero sapiencial, mas permanecem amplamente compreensíveis.
