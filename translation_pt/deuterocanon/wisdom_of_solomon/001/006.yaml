base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/006.yaml
  text: For wisdom is a spirit that loves humanity[a], and it will not acquit a blasphemer because of his lips; for God is witness of his inner motives[b], and a true observer of his heart and a hearer of his tongue.
translation:
  language: pt
  text: Pois a sabedoria é um espírito que ama a humanidade, e não absolverá o blasfemo por causa do que dizem seus lábios[a]; pois Deus é testemunha de suas intenções mais íntimas[b], verdadeiro observador de seu coração e ouvinte de sua língua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz, de forma mais comprimida, “por causa de seus lábios”; também pode ser traduzido: “pelas palavras de seus lábios”.'
    reason: alternative_reading
  - marker: b
    text: Literalmente, “de seus rins”, expressão antiga para o íntimo oculto da pessoa, incluindo seus impulsos e intenções.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλάνθρωπον
  choice: que ama a humanidade
  rationale: Expressa a benevolência ativa para com os seres humanos, sem recorrer a uma formulação arcaica ou marcada por gênero.
- source_word: πνεῦμα σοφία
  choice: a sabedoria é um espírito
  rationale: Conserva a construção predicativa e a personificação do grego, sem identificar explicitamente esse espírito com o Espírito Santo.
- source_word: οὐκ ἀθῳώσει
  choice: não absolverá
  rationale: Mantém o tom judicial do verbo, que significa declarar inocente ou isentar de culpa.
- source_word: βλάσφημον
  choice: o blasfemo
  rationale: Preserva o peso religioso e moral do termo grego para quem profere blasfêmias.
- source_word: ἀπὸ χειλέων αὐτοῦ
  choice: por causa do que dizem seus lábios
  rationale: Torna natural em português a expressão grega comprimida e conserva sua provável força causal, sem apagar a imagem dos lábios.
- source_word: τῶν νεφρῶν αὐτοῦ
  choice: de suas intenções mais íntimas
  rationale: Traduz funcionalmente o idioma antropológico em que os rins representam o interior oculto da pessoa, especialmente seus impulsos e intenções.
- source_word: μάρτυς
  choice: testemunha
  rationale: Preserva o vocabulário judicial e a afirmação de que Deus conhece o interior humano.
- source_word: ἐπίσκοπος ἀληθής
  choice: verdadeiro observador
  rationale: Comunica a vigilância e o exame confiável de Deus, evitando o sentido eclesiástico que 'bispo' teria em português.
- source_word: καρδίας
  choice: coração
  rationale: Mantém o termo antropológico bíblico usual para o centro interior da pessoa.
- source_word: ἀκουστής ... γλώσσης
  choice: ouvinte de sua língua
  rationale: Preserva o paralelismo concreto entre testemunhar, observar e ouvir, bem como a imagem corporal da língua.
theological_decisions:
- issue: Possível identificação de πνεῦμα σοφία com o Espírito Santo
  choice: sabedoria como 'um espírito', em minúscula
  alternative: identificar a sabedoria explicitamente com o Espírito Santo
  rationale: O grego personifica a sabedoria e a descreve como espírito, mas não exige por si só uma identificação doutrinária explícita com o Espírito Santo.
- issue: Sentido antropológico de τῶν νεφρῶν αὐτοῦ
  choice: intenções mais íntimas
  alternative: rins; íntimo; ser interior
  rationale: A formulação comunica a realidade interior oculta conhecida por Deus, enquanto a nota registra a imagem literal e evita que o idioma antigo fique invisível.
- issue: Força de ἀπὸ χειλέων αὐτοῦ
  choice: 'causal: ''por causa do que dizem seus lábios'''
  alternative: simplesmente 'de seus lábios' ou 'pelas palavras de seus lábios'
  rationale: A construção é comprimida, mas o contexto favorece entender que o blasfemo não será absolvido por causa do que profere; a nota preserva a possibilidade de uma formulação mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação conserva o paralelismo judicial e corporal do versículo, esclarecendo apenas os dois idiomas gregos que seriam opacos ou pouco naturais em tradução estritamente literal.
