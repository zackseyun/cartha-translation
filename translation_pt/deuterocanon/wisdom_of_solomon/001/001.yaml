base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/001.yaml
  text: Love righteousness[a], you who judge the earth; think about the Lord with goodness[c][b], and seek him with singleness of heart.
translation:
  language: pt
  text: Amem a justiça[a], vocês que julgam a terra[b]; pensem no Senhor com bondade e busquem-no com inteireza de coração[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”. A palavra grega pode indicar tanto a justiça quanto a conduta moralmente reta.
    reason: lexical_alternative
  - marker: b
    text: Ou “governantes da terra”. Literalmente, “vocês que julgam a terra”.
    reason: lexical_alternative
  - marker: c
    text: Ou “com sinceridade de coração”. A expressão grega sugere um coração franco e não dividido.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπήσατε
  choice: Amem
  rationale: O imperativo plural traduz diretamente a força de ἀγαπάω em português moderno e deixa claro que a exortação se dirige a várias pessoas.
- source_word: δικαιοσύνην
  choice: a justiça
  rationale: Em português, “justiça” abrange tanto a prática do que é justo quanto, em muitos contextos, a qualidade moral correspondente; além disso, harmoniza naturalmente com a menção aos que julgam. A alternativa “retidão” preserva a nuance ética mais ampla.
- source_word: οἱ κρίνοντες τὴν γῆν
  choice: vocês que julgam a terra
  rationale: Mantém o particípio de κρίνω e o sentido amplo de γῆ, sem substituir a expressão pelo título interpretativo “governantes”.
- source_word: φρονήσατε περὶ τοῦ κυρίου
  choice: pensem no Senhor
  rationale: Expressa de modo natural a disposição reflexiva indicada por φρονέω com περί e genitivo, sem acrescentar uma interpretação mais específica.
- source_word: ἐν ἀγαθότητι
  choice: com bondade
  rationale: Conserva o sentido básico de ἀγαθότης como bondade ou boa disposição e indica a maneira de pensar no Senhor.
- source_word: ἐν ἁπλότητι καρδίας
  choice: com inteireza de coração
  rationale: “Inteireza” comunica um coração não dividido, franco e sincero, evitando que “simplicidade” seja entendida modernamente como ingenuidade ou falta de inteligência.
- source_word: ζητήσατε αὐτόν
  choice: busquem-no
  rationale: É uma tradução direta e corrente do imperativo de ζητέω, preservando a ideia de procura intencional e diligente.
theological_decisions:
- issue: Amplitude semântica de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: O contexto de pessoas que julgam favorece “justiça”, mas o termo grego também possui alcance ético mais amplo. A nota preserva “retidão” sem reduzir a palavra a uma única dimensão.
- issue: Identidade de οἱ κρίνοντες τὴν γῆν
  choice: vocês que julgam a terra
  alternative: governantes da terra
  rationale: Embora a expressão provavelmente se dirija a governantes ou magistrados, o grego os caracteriza literalmente como os que julgam. A tradução não transforma essa função em um título político explícito.
- issue: Sentido de ἁπλότης καρδίας
  choice: inteireza de coração
  alternative: sinceridade de coração
  rationale: A formulação principal preserva a imagem de um coração indiviso, enquanto a alternativa explicita a nuance de franqueza e sinceridade.
- issue: Tradução de κύριος
  choice: Senhor
  alternative: senhor
  rationale: No contexto, κύριος designa Deus; “Senhor” é a forma portuguesa natural e tradicional, sem exigir uma especificação adicional ausente do texto.
translation_notes:
  register: Português moderno, digno e acessível, com formas verbais plurais de ampla legibilidade brasileira. “Vocês” torna explícito o destinatário plural sem recorrer ao registro arcaizante de “vós”. A construção conserva o paralelismo dos três imperativos gregos e mantém as ambiguidades relevantes em notas.
