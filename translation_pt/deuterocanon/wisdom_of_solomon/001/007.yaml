  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/007.yaml
  text: For the Spirit of the Lord has filled the inhabited world[b][a], and that which holds all things together has knowledge of every utterance.
translation:
  language: pt
  text: Pois o Espírito do Senhor encheu o mundo habitado, e aquilo que mantém unidas todas as coisas[a] tem conhecimento de toda voz[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «aquilo que contém todas as coisas» ou «aquele que mantém unidas todas as coisas». A expressão grega é um particípio neutro e pode destacar a ideia de conter, sustentar ou manter tudo unido.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «tem conhecimento de voz». No contexto, a expressão indica conhecimento de toda voz ou declaração.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα Κυρίου
  choice: o Espírito do Senhor
  rationale: A expressão indica a presença ativa e abrangente de Deus. A inicial maiúscula assinala o provável referente divino sem impor categorias doutrinárias posteriores ao texto.
- source_word: πεπλήρωκεν
  choice: encheu
  rationale: O perfeito grego apresenta uma ação realizada com efeito presente; em português, «encheu» comunica naturalmente que o Espírito passou a ocupar e continua abrangendo o mundo.
- source_word: τὴν οἰκουμένην
  choice: o mundo habitado
  rationale: Preserva o sentido específico de οἰκουμένη como a terra ou o mundo onde vivem os seres humanos.
- source_word: τὸ συνέχον τὰ πάντα
  choice: aquilo que mantém unidas todas as coisas
  rationale: O particípio substantivado é neutro e permite uma formulação não explicitamente pessoal. «Mantém unidas» exprime o valor cosmológico de συνέχω, sem excluir os sentidos de conter ou sustentar.
- source_word: γνῶσιν ἔχει φωνῆς
  choice: tem conhecimento de toda voz
  rationale: Mantém a estrutura «tem conhecimento» e conserva a amplitude de φωνή. «Toda» explicita de modo idiomático o alcance universal sugerido pelo contexto.
theological_decisions:
- issue: Se πνεῦμα Κυρίου deve ser apresentado como referência divina pessoal ou como «espírito» em sentido impessoal
  choice: Espírito do Senhor
  alternative: espírito do Senhor
  rationale: O ato de encher o mundo e conhecer a voz favorece um referente divino, mas a tradução não define além disso a relação com formulações trinitárias posteriores.
- issue: Se τὸ συνέχον τὰ πάντα identifica pessoalmente o Espírito ou designa de modo mais abstrato o que contém e sustenta o universo
  choice: aquilo que mantém unidas todas as coisas
  alternative: aquele que mantém unidas todas as coisas; o que contém todas as coisas
  rationale: O neutro grego é preservado por «aquilo», evitando transformar silenciosamente a expressão em uma identificação pessoal inequívoca.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a estrutura elevada e a ambiguidade do particípio neutro grego; evita tanto linguagem excessivamente técnica quanto explicitação doutrinária indevida.
