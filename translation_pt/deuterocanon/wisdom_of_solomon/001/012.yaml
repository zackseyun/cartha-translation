base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/012.yaml
  text: Do not court death by the error of your life[b][a], nor draw destruction upon yourselves by the works of your hands.
translation:
  language: pt
  text: Não busquem a morte pelo erro de sua vida[a], nem atraiam sobre si mesmos a destruição pelas obras de suas mãos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não desejem ardentemente a morte pelo erro de sua vida”. O verbo grego pode significar ter zelo por algo ou desejá-lo intensamente.'
    reason: lexical_alternative
  - marker: b
    text: “Obras de suas mãos” pode referir-se de modo amplo aos atos de uma pessoa; a expressão concreta também pode evocar coisas produzidas por mãos humanas.
    reason: cultural_note
lexical_decisions:
- source_word: ζηλοῦτε
  choice: busquem
  rationale: O verbo pode indicar zelo, desejo intenso ou empenho em alcançar algo. Com “morte” como objeto, “busquem” comunica de modo natural a procura ativa e autodestrutiva, sem reduzir o sentido a um desejo meramente interior.
- source_word: θάνατον
  choice: morte
  rationale: Equivalente direto e claro do substantivo grego.
- source_word: ἐν πλάνῃ
  choice: pelo erro
  rationale: πλάνη pode significar erro, engano ou desvio. A construção “pelo erro” expressa naturalmente o valor instrumental ou causal provável, preservando sem especificação indevida a natureza desse erro.
- source_word: ζωῆς ὑμῶν
  choice: de sua vida
  rationale: O genitivo liga-se naturalmente a “erro”. O singular coletivo do grego é mantido e funciona em português no discurso dirigido a várias pessoas.
- source_word: ἐπισπᾶσθε
  choice: atraiam sobre si mesmos
  rationale: A forma média apresenta os destinatários como envolvidos em trazer a ruína sobre si. A formulação conserva com clareza essa força reflexiva.
- source_word: ὄλεθρον
  choice: destruição
  rationale: Expressa ruína ou destruição grave sem introduzir um sentido teológico técnico que o contexto não exige.
- source_word: ἔργοις χειρῶν ὑμῶν
  choice: pelas obras de suas mãos
  rationale: Mantém a imagem concreta do grego e sua possível ressonância tanto com os atos humanos em geral quanto com coisas produzidas pelas mãos.
theological_decisions:
- issue: Como traduzir a busca zelosa expressa por ζηλοῦτε sem tornar a frase artificial
  choice: Não busquem a morte
  alternative: Não desejem ardentemente a morte
  rationale: “Busquem” transmite a orientação ativa para a morte própria do contexto admonitório. A nota conserva a possibilidade lexical de desejo intenso, sem transformar a tradução principal em expressão pouco natural.
- issue: Como representar a força reflexiva da voz média em ἐπισπᾶσθε
  choice: atraiam sobre si mesmos a destruição
  alternative: tragam destruição sobre si mesmos
  rationale: A escolha mostra explicitamente que as próprias pessoas, por seus atos, fazem a destruição vir sobre elas, preservando a responsabilidade afirmada pelo grego sem ampliar sua interpretação.
translation_notes:
  register: Português moderno, claro e digno, com imperativos na terceira pessoa do plural e formulação acessível no Brasil e em outros contextos lusófonos. Conserva-se a imagem concreta de “obras de suas mãos” e a tensão entre desejo intenso e procura ativa na primeira oração.
