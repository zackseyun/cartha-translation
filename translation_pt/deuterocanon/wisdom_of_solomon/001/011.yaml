base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/011.yaml
  text: Therefore guard yourselves against useless grumbling[a], and spare your tongue from slander; for no secret utterance goes out empty[b], and a lying mouth destroys a soul.
translation:
  language: pt
  text: Portanto, guardem-se da murmuração inútil e não usem a língua para caluniar, pois nenhuma palavra dita às escondidas fica sem efeito[a], e a boca mentirosa destrói uma alma[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “não segue vazia”. A expressão grega enfatiza que até a fala escondida tem efeito e consequências.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma vida” ou “uma pessoa”. A palavra grega pode significar “alma”, “vida” ou “pessoa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξασθε
  choice: guardem-se
  rationale: O imperativo médio pede vigilância e proteção de si mesmos; “guardem-se” conserva tanto a força imperativa quanto a nuance reflexiva.
- source_word: τοίνυν
  choice: portanto
  rationale: Assinala uma conclusão decorrente do argumento anterior.
- source_word: γογγυσμὸν ἀνωφελῆ
  choice: murmuração inútil
  rationale: γογγυσμός indica queixa murmurada ou resmungo, e ἀνωφελής, algo inútil ou sem proveito. “Murmuração inútil” mantém o tom sapiencial em português corrente e digno.
- source_word: ἀπὸ καταλαλιᾶς φείσασθε γλώσσης
  choice: poupem a língua da calúnia
  rationale: A formulação preserva a imagem corporal da língua e expressa a ordem de refreá-la quanto à fala difamatória.
- source_word: φθέγμα λαθραῖον
  choice: palavra dita às escondidas
  rationale: φθέγμα é uma emissão vocal ou palavra pronunciada, enquanto λαθραῖον indica o que é oculto ou clandestino. A expressão escolhida evita sugerir apenas informação confidencial e destaca a fala furtiva.
- source_word: κενὸν οὐ πορεύεται
  choice: fica sem efeito
  rationale: A expressão significa literalmente que a palavra “não segue vazia”; em contexto, afirma que mesmo a fala escondida produz consequência. A metáfora literal é registrada em nota.
- source_word: στόμα ... καταψευδόμενον
  choice: a boca mentirosa
  rationale: Conserva a concisão proverbial e a imagem concreta do grego.
- source_word: ἀναιρεῖ ψυχήν
  choice: destrói uma alma
  rationale: ἀναιρέω pode significar eliminar, matar ou destruir. “Destrói” mantém a gravidade sem restringir a frase necessariamente à morte física.
- source_word: ψυχήν
  choice: uma alma
  rationale: ψυχή pode designar alma, vida ou pessoa. “Alma” preserva a amplitude antropológica e moral do texto, enquanto as demais possibilidades são indicadas em nota.
theological_decisions:
- issue: Sentido de ψυχή na oração final
  choice: “alma” no texto principal
  alternative: “vida” ou “pessoa”
  rationale: O termo grego comporta os três sentidos. “Alma” conserva a tensão entre ruína moral, dano à pessoa e possível perda da vida, sem reduzir antecipadamente o alcance da advertência.
- issue: Efeito da fala oculta em κενὸν οὐ πορεύεται
  choice: “fica sem efeito”
  alternative: “não segue vazia”
  rationale: A tradução principal comunica o sentido da metáfora grega em português natural, sem especificar qual consequência ocorre; a forma mais literal permanece na nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e sapiencial, com imperativos claros e imagens concretas preservadas. “Murmuração” e “calúnia” mantêm precisão moral sem linguagem denominacional.
