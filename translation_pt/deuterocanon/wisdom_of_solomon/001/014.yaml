base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/001/014.yaml
  text: For he created all things so that they might exist[a], and the generations of the world are health-giving, and in them there is no poison of destruction, nor the dominion of Hades upon the earth[b];
translation:
  language: pt
  text: Pois ele criou todas as coisas para que existissem, e as criaturas do mundo[a] são salutares; nelas não há veneno de destruição, nem domínio do Hades sobre a terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as gerações do mundo”, “os produtos da criação” ou “as origens do mundo”. A expressão grega é ampla e pode se referir aos seres ou às coisas que vieram a existir dentro da criação.
    reason: lexical_alternative
  - marker: b
    text: Ou “reino do Hades”. O grego pode indicar tanto um domínio ou esfera quanto um poder governante.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκτισεν
  choice: criou
  rationale: Expressa de modo direto a ação de trazer à existência e preserva a origem divina da criação.
- source_word: εἰς τὸ εἶναι
  choice: para que existissem
  rationale: Traduz naturalmente a construção de finalidade ou resultado e ressalta que a criação foi destinada à existência, não à destruição.
- source_word: τὰ πάντα
  choice: todas as coisas
  rationale: Mantém o alcance abrangente da expressão grega em registro claro e digno.
- source_word: σωτήριοι
  choice: salutares
  rationale: Comunica aquilo que favorece a vida, a saúde ou o bem-estar, sem restringir o adjetivo a uma salvação teológica explícita.
- source_word: αἱ γενέσεις τοῦ κόσμου
  choice: as gerações do mundo
  rationale: Conserva a amplitude e a textura de γένεσις, que pode apontar para origens, seres gerados ou produtos da criação; a nota registra alternativas mais naturais.
- source_word: φάρμακον ὀλέθρου
  choice: veneno de destruição
  rationale: No contraste com o caráter salutar da criação, φάρμακον designa adequadamente uma substância nociva; a formulação mantém a relação genitiva do grego.
- source_word: ᾅδου βασίλειον
  choice: domínio do Hades
  rationale: Preserva ᾅδης como Hades e traduz βασίλειον como poder governante, sem reduzir a expressão apenas a um lugar.
- source_word: ἐπὶ γῆς
  choice: sobre a terra
  rationale: Mantém tanto a esfera terrestre quanto a possível nuance de domínio exercido sobre ela.
theological_decisions:
- issue: Sentido de σωτήριοι no contexto da criação
  choice: salutares, no sentido de promover a vida ou o bem
  alternative: salvadoras
  rationale: O contraste imediato é com destruição e morte. “Salutares” preserva essa orientação vital sem introduzir uma doutrina de salvação mais específica do que o versículo declara.
- issue: Sentido de ᾅδου
  choice: Hades
  alternative: sepultura, morte ou Sheol
  rationale: O texto grego nomeia explicitamente o Hades; mantê-lo evita substituir o conceito por uma interpretação mais estreita.
- issue: Força de βασίλειον
  choice: domínio
  alternative: reino
  rationale: A palavra pode indicar tanto um reino quanto autoridade régia. “Domínio” se ajusta ao contexto, mas a nota conserva a alternativa espacial ou institucional.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período conserva a cadência solene do grego. “Gerações do mundo” é deliberadamente formal e ambíguo, com esclarecimento em nota; “salutares” mantém o contraste entre vida e destruição.
