base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/009.yaml
  text: For if they had power to know so much that they could speculate about the age, how did they not more quickly find its Master?
translation:
  language: pt
  text: Pois, se foram capazes de conhecer tanto, a ponto de poderem investigar o mundo, como não encontraram mais depressa o Senhor de todas essas coisas?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοσοῦτον ἴσχυσαν εἰδέναι
  choice: foram capazes de conhecer tanto
  rationale: Reproduz a ideia de capacidade intelectual expressa por ἴσχυσαν e o grau indicado por τοσοῦτον, em português natural.
- source_word: στοχάσασθαι
  choice: investigar
  rationale: O verbo indica chegar a uma compreensão por busca, conjectura ou raciocínio; “investigar” preserva o caráter intelectual sem reduzir o sentido a mera especulação incerta.
- source_word: τὸν αἰῶνα
  choice: a era
  rationale: Mantém o valor lexical mais direto de αἰών e a ambiguidade do texto, sem substituí-lo interpretativamente por “mundo”.
- source_word: τὸν τούτων δεσπότην
  choice: o Senhor dessas coisas
  rationale: δεσπότης designa senhor, soberano ou dono; a formulação conserva o referente plural e demonstrativo de τούτων sem explicitação indevida.
- source_word: τάχιον
  choice: mais depressa
  rationale: Expressa naturalmente o comparativo adverbial “mais rapidamente” no contexto da pergunta retórica.
theological_decisions:
- issue: Sentido cosmológico ou temporal de αἰών
  choice: a era
  alternative: o mundo / o universo
  rationale: O grego αἰών admite dimensão temporal e, em certos contextos, cosmológica. A tradução conserva a forma temporal e evita resolver a tensão em favor de κόσμος, palavra que não aparece aqui.
- issue: Título δεσπότης aplicado ao Criador
  choice: Senhor
  alternative: Soberano / Dono
  rationale: “Senhor” é digno, corrente e preserva a autoridade implicada no termo sem introduzir uma formulação confessional mais específica.
translation_notes:
  register: Português moderno, claro e digno, com estrutura retórica próxima do grego. A expressão menos habitual “a era” é mantida deliberadamente por fidelidade lexical e para preservar a ambiguidade do original.
