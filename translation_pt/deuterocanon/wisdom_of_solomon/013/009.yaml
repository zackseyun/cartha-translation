  source_fidelity: 'A construção grega é bem refletida no geral: τοσοῦτον ἴσχυσαν εἰδέναι exprime capacidade de alcançar tamanho conhecimento, e a pergunta retórica final mantém força. Contudo, neste contexto de argumentação a partir da criação, τὸν αἰῶνα é mais naturalmente o mundo/universo como totalidade criada do que uma ''era'' temporal. A tradução ''a era'' introduz em português uma leitura temporal estreita e torna a frase pouco inteligível.'
