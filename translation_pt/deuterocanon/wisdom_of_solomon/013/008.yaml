lexical_decisions:
- source_word: πάλιν δʼ
  choice: Mesmo assim
  rationale: A combinação retoma o argumento com leve força adversativa. “Mesmo assim” soa natural em português e preserva a ideia de que, apesar da consideração anterior, a conclusão seguinte permanece válida.
- source_word: οὐδʼ
  choice: nem sequer
  rationale: 'Expressa de modo explícito a negação enfática do grego: “nem sequer eles”.'
- source_word: αὐτοὶ
  choice: eles
  rationale: O pronome retoma enfaticamente o grupo já mencionado. A ênfase é comunicada naturalmente pela construção “nem sequer eles”, sem necessidade de acrescentar “mesmos”.
- source_word: συγγνωστοί
  choice: desculpáveis
  rationale: O adjetivo indica pessoas a quem se poderia conceder desculpa, indulgência ou perdão. “Desculpáveis” preserva aqui o foco na responsabilidade moral, sem introduzir uma formulação doutrinária mais específica.
theological_decisions:
- issue: Grau de culpabilidade expresso por συγγνωστοί
  choice: O texto declara que essas pessoas não são desculpáveis.
  alternative: “Não são perdoáveis” ou “não merecem perdão”.
  rationale: No contexto, a afirmação avalia a responsabilidade humana por não reconhecer Deus a partir da criação. “Desculpáveis” mantém esse sentido forense e moral, enquanto a nota registra a amplitude lexical ligada ao perdão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O ponto e vírgula conserva a continuidade sintática e argumentativa com o versículo seguinte.
