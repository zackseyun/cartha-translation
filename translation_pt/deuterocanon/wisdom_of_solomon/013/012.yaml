  text: But after using up the scraps from his work to prepare food, he was filled.
translation:
  language: pt
  text: Mas, depois de gastar as sobras do seu trabalho no preparo da comida, ficou saciado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «foi preenchido»; isto é, satisfez a fome depois de gastar as sobras no preparo da comida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποβλήματα
  choice: sobras
  rationale: Designa aquilo que é lançado fora ou resta do trabalho artesanal; «sobras» comunica naturalmente os pedaços residuais sem os tratar necessariamente como lixo.
- source_word: ἐργασίας
  choice: trabalho
  rationale: Termo amplo para trabalho ou atividade; o contexto já deixa claro que se trata do trabalho do artesão.
- source_word: εἰς ἑτοιμασίαν τροφῆς
  choice: para preparar a comida
  rationale: A expressão indica finalidade e fica clara e natural em português.
- source_word: ἀναλώσας
  choice: depois de usar
  rationale: O particípio indica o emprego ou consumo das sobras; «depois de usar» preserva a relação temporal sem explicitar indevidamente que foram queimadas.
- source_word: ἐνεπλήσθη
  choice: ficou saciado
  rationale: Embora o verbo signifique literalmente «foi preenchido», neste contexto alimentar indica que ele satisfez a fome; «ficou saciado» preserva esse sentido de modo digno e idiomático.
- source_word: τὰ δὲ
  choice: Mas
  rationale: δέ marca aqui uma transição com valor contrastivo em relação ao uso dado às diferentes partes do material.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Evitou-se especificar que as sobras foram queimadas, pois isso é inferido pelo contexto, mas não declarado pelo grego.
