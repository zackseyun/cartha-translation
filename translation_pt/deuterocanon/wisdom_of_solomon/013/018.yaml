review_pass:
  verdict: revise
  source_fidelity: 'A tradução reconhece corretamente o paralelismo de περὶ + genitivo e a alternância satírica entre referências neutras e masculinas ao ídolo. Contudo, “considera digna uma coisa morta” é sintaticamente incompleta e não comunica com clareza o emprego contextual de ἀξιοῖ: o adorador apela ou dirige uma petição ao objeto morto em busca de vida.'
  naturalness: “Quanto à vida” e “quanto ao auxílio” são compreensíveis, mas “Para obter vida” e “para obter ajuda” tornam a relação de petição mais idiomática em português contemporâneo. “Servir-se do pé” não é expressão natural neste contexto; “usar os próprios pés” comunica a incapacidade de movimento, preservando em nota a alternativa relativa à base/pedestal.
  terminology: “coisa morta”, “ajuda”, “suplica” e “o mais inexperiente” conservam adequadamente o tom depreciativo e o superlativo do grego, sem transformar a referência em uma afirmação doutrinária adicional. A nota deve explicitar que a alternativa diz respeito a “base/pedestal”, sem apresentar isso como o único sentido.
  issues:
  - severity: medium
    issue: Construção de ἀξιοῖ em “considera digna uma coisa morta”
    rationale: Em português, a expressão soa elíptica ou exige complemento (“digna de ...”), obscurecendo que o idólatra recorre ao objeto morto em matéria de vida. “Apela a uma coisa morta” é natural e corresponde ao sentido contextual de petição.
  - severity: medium
    issue: “ser capaz de se servir do pé”
    rationale: A formulação é pouco idiomática e o singular “do pé” soa artificial. “Usar os próprios pés” transmite a imagem de incapacidade de locomoção; a nota mantém a possibilidade lexical de “base/pedestal”.
