  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/018.yaml
  text: But for life he considers the dead thing worthy; for help he begs the one most inexperienced; and for a journey[a], the one unable even to use its foot,
translation:
  language: pt
  text: Para obter vida, apela a uma coisa morta; para obter ajuda, suplica ao mais inexperiente; e, para uma viagem[a], àquilo que nem sequer é capaz de usar os próprios pés,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “àquilo que nem sequer é capaz de usar sua base ou pedestal”. O grego βάσις pode indicar pé, passo ou base; a frase ridiculariza a incapacidade do ídolo de mover-se por si mesmo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζωῆς
  choice: vida
  rationale: 'Com περὶ + genitivo, indica o assunto da petição: “quanto à vida” ou “pela vida”. “Vida” é direto e preserva o paralelismo.'
- source_word: τὸ νεκρόν
  choice: uma coisa morta
  rationale: O neutro singular aponta para um objeto inanimado, o ídolo. “Uma coisa morta” conserva a força polêmica sem tratá-lo como pessoa.
- source_word: ἀξιοῖ
  choice: considera digna
  rationale: Preserva o sentido avaliativo básico de ἀξιόω, “julgar digno”, mesmo que a construção seja deliberadamente incisiva no contexto da petição ao ídolo.
- source_word: ἐπικουρίας
  choice: auxílio
  rationale: Expressa ajuda ou assistência e mantém um registro digno, corrente e adequado ao paralelismo.
- source_word: τὸν ἀπειρότατον
  choice: o mais inexperiente
  rationale: Mantém o superlativo de ἄπειρος, “sem experiência”, e a personificação satírica do ídolo.
- source_word: ἱκετεύει
  choice: suplica
  rationale: O verbo indica uma petição insistente e reverente; “suplica” reproduz essa intensidade naturalmente em português.
- source_word: ὁδοιπορίας
  choice: uma viagem
  rationale: Traduz de modo direto a ideia de deslocamento ou jornada e contrasta ironicamente com a imobilidade do ídolo.
- source_word: τὸ μηδὲ βάσει χρῆσθαι δυνάμενον
  choice: àquilo que nem sequer é capaz de se servir do pé
  rationale: Conserva a incapacidade concreta de movimento e deixa visível, por meio de nota, a possível referência à base ou ao pedestal da imagem.
theological_decisions:
- issue: Referência das expressões neutras e masculinas ao ídolo
  choice: Empregar linguagem impessoal nas expressões neutras (“uma coisa morta”, “àquilo”) e masculina onde o grego usa forma masculina (“ao mais inexperiente”).
  alternative: Uniformizar todas as referências como “ele”, “isso” ou “o ídolo”.
  rationale: 'A alternância gramatical do grego contribui para a sátira: a imagem é ao mesmo tempo objeto inanimado e suposto destinatário de súplicas. Preservá-la evita eliminar a tensão retórica do texto.'
translation_notes:
  register: Português moderno, claro e digno, com paralelismo repetido em “quanto a”. A tradução conserva a aspereza intencional de “considera digna uma coisa morta” e a mudança de gênero gramatical presente no grego. A vírgula final reflete a continuidade sintática para o versículo seguinte.
