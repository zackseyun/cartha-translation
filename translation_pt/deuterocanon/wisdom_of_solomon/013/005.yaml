  text: For from the greatness and beauty of created things[a], their Creator is seen by analogy.
translation:
  language: pt
  text: Pois, a partir da grandeza e da beleza das coisas criadas, percebe-se, por analogia, o Criador delas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Criador delas é percebido de modo correspondente”. O advérbio grego indica uma inferência em correspondência: das qualidades das coisas criadas para aquele que as criou.'
