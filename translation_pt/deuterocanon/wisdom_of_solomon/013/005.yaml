lexical_decisions:
- source_word: ἐκ
  choice: a partir de
  rationale: 'Expressa a fonte ou base da percepção: parte-se da observação das coisas criadas para discernir quem as criou.'
- source_word: μεγέθους
  choice: grandeza
  rationale: Conserva o sentido amplo de magnitude e grandiosidade, sem limitar o termo ao tamanho físico.
- source_word: καλλονῆς
  choice: beleza
  rationale: É o equivalente direto e natural para a qualidade atraente ou esplêndida indicada pelo substantivo grego.
- source_word: κτισμάτων
  choice: coisas criadas
  rationale: Preserva o plural e abrange tudo o que foi criado, sem restringir o sentido aos seres vivos.
- source_word: ἀναλόγως
  choice: por analogia
  rationale: Retém a ideia de correspondência inferencial entre as qualidades das obras criadas e aquele que lhes deu origem.
- source_word: ὁ γενεσιουργὸς αὐτῶν
  choice: o Criador delas
  rationale: Comunica de modo claro e digno o raro termo grego para produtor ou originador e mantém explícita sua relação com as coisas criadas.
- source_word: θεωρεῖται
  choice: percebe-se
  rationale: O passivo indica que o Criador se torna discernível pela contemplação da criação; “percebe-se” preserva o caráter intelectual sem sugerir necessariamente visão física.
theological_decisions:
- issue: Linguagem de revelação natural
  choice: percebe-se, por analogia, o Criador delas
  alternative: contempla-se, em correspondência, aquele que lhes deu origem
  rationale: A formulação afirma que o Criador pode ser discernido com base nas coisas criadas, mas não amplia essa afirmação para definir a extensão ou o efeito salvífico desse conhecimento.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “A partir de” torna explícita a relação inferencial de ἐκ; “por analogia” preserva a precisão filosófica do grego sem resolver além do texto a tensão teológica sobre o alcance desse conhecimento.
