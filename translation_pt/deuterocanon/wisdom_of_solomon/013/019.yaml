  source_fidelity: A paráfrase da tríade inicial é aceitável, mas «que suas mãos fizeram» introduz uma afirmação que não está expressa neste versículo. O dativo ταῖς χερσὶν deve permanecer ligado ao pedido de eficácia/atividade para as mãos, e não ser convertido em oração relativa sobre a fabricação do ídolo.
