  text: But concerning provision and work and success of his hands[b][a], he asks strength from that thing most inactive with his hands.
translation:
  language: pt
  text: Mas, quanto ao sustento, ao trabalho e ao êxito de suas mãos[a], ele pede à coisa mais inerte capacidade de agir para suas mãos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “êxito das mãos”, isto é, êxito no que realiza ou produz.
    reason: lexical_alternative
  - marker: b
    text: Ou “o que é completamente incapaz de agir”. O superlativo grego ressalta a total inatividade do ídolo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορισμοῦ
  choice: obter sustento
  rationale: Expressa a obtenção de recursos ou meios de subsistência sem restringir o sentido a lucro.
- source_word: ἐργασίας
  choice: realizar seu trabalho
  rationale: Traduz o termo amplo para trabalho ou atividade em português natural.
- source_word: χειρῶν ἐπιτυχίας
  choice: ter sucesso no que faz
  rationale: Comunica idiomaticamente o sentido de “sucesso das mãos”, isto é, êxito nas próprias atividades, preservando a referência às obras humanas em nota.
- source_word: τὸ ἀδρανέστατον
  choice: aquilo ... que é totalmente inerte
  rationale: O neutro singular aponta para o ídolo como objeto, e o superlativo ressalta sua completa incapacidade de agir.
- source_word: ταῖς χερσὶν
  choice: que suas mãos fizeram
  rationale: Entende o dativo como referência instrumental às mãos do suplicante; a formulação explicita em português a ironia contextual de pedir ajuda ao objeto feito por ele mesmo.
- source_word: εὐδράνειαν
  choice: capacidade de agir
  rationale: Preserva o contraste lexical e retórico entre atividade eficaz e o objeto completamente inerte.
- source_word: αἰτεῖται
  choice: pede
  rationale: Equivalente direto e natural do verbo no sentido de pedir algo.
theological_decisions:
- issue: Referente da descrição neutra singular do objeto ao qual se dirige o pedido
  choice: O ídolo é apresentado como um objeto totalmente inerte, feito pelas mãos do próprio suplicante.
  alternative: Uma referência mais geral a uma imagem divina inativa, sem explicitar que foi feita pelas mãos do suplicante.
  rationale: O contexto imediato critica a fabricação e a veneração de ídolos. O neutro superlativo e o contraste entre εὐδράνειαν e ἀδρανέστατον sustentam a ironia, sem atribuir ao ídolo qualquer poder real.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. A construção foi reorganizada para clareza, mantendo a tríade sustento–trabalho–sucesso e o contraste irônico entre a capacidade de agir solicitada e a completa inércia do ídolo.
