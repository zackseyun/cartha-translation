base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/001.yaml
  text: For all men are by nature futile, in whom there was ignorance of God; and from the good things that are seen they were not able to know the One who is, nor by paying attention to his works did they recognize the craftsman.
translation:
  language: pt
  text: 'Pois todos os seres humanos em quem havia ignorância de Deus são fúteis por natureza: a partir das coisas boas que se veem, não foram capazes de conhecer Aquele que é, nem, prestando atenção às obras, reconheceram o Artífice.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μάταιοι
  choice: fúteis
  rationale: Preserva a ideia de inutilidade, vazio e incapacidade de chegar ao conhecimento devido, sem restringir o termo a mera falta de inteligência.
- source_word: πάντες ἄνθρωποι
  choice: todos os seres humanos
  rationale: Expressa de modo inclusivo e natural a referência genérica a toda a humanidade.
- source_word: φύσει
  choice: por natureza
  rationale: Mantém a formulação direta e a possível tensão sem explicar além do que o grego afirma.
- source_word: θεοῦ ἀγνωσία
  choice: ignorância de Deus
  rationale: 'Conserva a construção concisa do original e sua possível abrangência: ausência de conhecimento acerca de Deus ou falta de reconhecimento dele.'
- source_word: ἐκ τῶν ὁρωμένων ἀγαθῶν
  choice: a partir das coisas boas que se veem
  rationale: Mantém tanto o caráter visível quanto a avaliação positiva das coisas contempladas.
- source_word: τὸν ὄντα
  choice: Aquele que é
  rationale: Reproduz a expressão substantivada grega sem reduzi-la simplesmente a 'Deus' nem ampliar sua possível ressonância teológica.
- source_word: τεχνίτην
  choice: Artífice
  rationale: Comunica aquele que produz uma obra com habilidade e evita substituir o termo específico por 'Criador'.
theological_decisions:
- issue: Sentido de φύσει em relação à ignorância humana
  choice: por natureza
  alternative: naturalmente
  rationale: A tradução formal preserva a tensão da afirmação e não determina se o autor descreve uma condição inerente, uma disposição ou o estado ordinário dessas pessoas.
- issue: Identidade expressa por τὸν ὄντα
  choice: Aquele que é
  alternative: o Ser
  rationale: A forma escolhida preserva a expressão pessoal e sua possível ressonância divina sem impor uma leitura metafísica específica.
- issue: Relação entre as obras e seu autor
  choice: o Artífice
  alternative: o Criador
  rationale: Artífice traduz mais precisamente τεχνίτης; 'Criador' explicitaria uma conclusão teológica verdadeira no contexto, mas lexicalmente mais ampla que o termo grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura foi levemente ajustada com dois-pontos para tornar clara a relação entre a avaliação inicial e sua explicação, sem eliminar a densidade argumentativa do grego.
