base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/004.yaml
  text: But if they were astonished by their power and activity[a], let them understand from them how much more powerful is the one who made them;
translation:
  language: pt
  text: Mas, se ficaram admirados com o poder e a atividade delas[a], compreendam, a partir delas, quanto mais poderoso é aquele que as fez;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o poder e o funcionamento delas». O grego associa «poder» a «atividade» para descrever a força e a ação efetiva das coisas observadas.
    reason: Alternativa lexical para ἐνεργείᾳ e esclarecimento do par com δυνάμει.
lexical_decisions:
- source_word: δυνάμει
  choice: poder
  rationale: Preserva a capacidade impressionante das realidades criadas e mantém a ligação lexical com o comparativo «mais poderoso» no fim do versículo.
- source_word: ἐνεργείᾳ
  choice: atuação
  rationale: Expressa a ação efetiva ou o funcionamento ativo das coisas observadas, em paralelo natural com «poder», sem impor uma nuance filosófica técnica.
- source_word: ἐκπλαγέντες
  choice: ficaram assombrados
  rationale: Comunica forte admiração e impacto diante do poder e da atuação das coisas, conservando a intensidade do particípio grego.
- source_word: νοησάτωσαν
  choice: compreendam
  rationale: O imperativo pede uma inferência racional a partir daquilo que foi observado; «compreendam» é atual, claro e fiel.
- source_word: ἀπʼ αὐτῶν
  choice: a partir delas
  rationale: Indica que as próprias coisas observadas servem de base para inferir algo sobre quem as fez.
- source_word: πόσῳ
  choice: quanto mais
  rationale: Traduz de modo idiomático a comparação intensificada entre o poder das coisas criadas e o de quem as fez.
- source_word: ὁ κατασκευάσας αὐτὰ
  choice: aquele que as fez
  rationale: Mantém a descrição verbal do agente criador sem acrescentar o nome «Deus» ou o título «Criador», ausentes nesta oração.
- source_word: δυνατώτερός
  choice: mais poderoso
  rationale: Conserva a comparação explícita e retoma «poder», tornando claro o raciocínio do efeito para sua causa.
theological_decisions:
- issue: Identidade implícita daquele que fez as coisas
  choice: aquele que as fez
  alternative: o Criador; Deus, que as fez
  rationale: O grego descreve o agente por sua ação, sem nomeá-lo explicitamente como Deus. A formulação preserva a estratégia retórica e evita explicitar além do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Ficaram assombrados» retém a força emocional do grego; «atuação» evita o tom mecânico de «operação». A repetição «poder/mais poderoso» preserva a estrutura argumentativa do original.
