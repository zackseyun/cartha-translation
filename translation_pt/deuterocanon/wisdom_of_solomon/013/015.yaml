  text: And after making for it a dwelling fit for it[a], he set it in a wall, securing it with iron.
translation:
  language: pt
  text: E, depois de fazer para ele uma morada adequada[a], colocou-o numa parede, prendendo-o com ferro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também: «uma morada digna dele» ou «uma morada apropriada para ele».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσας
  choice: depois de fazer
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal; a formulação explicita essa relação de modo natural em português.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome retoma o objeto fabricado no contexto. Em português, «lhe» evita uma repetição pesada sem atribuir personalidade real ao ídolo.
- source_word: αὐτοῦ ἄξιον
  choice: adequada
  rationale: ἄξιος pode significar «digno» ou «adequado». «Adequada» comunica aqui a ideia de uma morada apropriada ao objeto, preservando na nota a alternativa mais literal e sua possível ironia.
- source_word: οἴκημα
  choice: morada
  rationale: O termo designa um lugar de habitação. «Morada» mantém a imagem irônica de se construir residência para um objeto fabricado, sem restringir o sentido a «santuário».
- source_word: ἐν τοίχῳ
  choice: numa parede
  rationale: A preposição ἐν com dativo indica localização; a expressão permite entender uma instalação na parede, possivelmente em um nicho, sem especificá-lo.
- source_word: ἔθηκεν
  choice: colocou
  rationale: Verbo simples de colocação, traduzido de modo corrente e preciso.
- source_word: ἀσφαλισάμενος
  choice: prendendo-o
  rationale: O particípio indica a ação concomitante pela qual o objeto é firmado e mantido seguro. «Prendendo-o» é natural no contexto de uma fixação à parede.
- source_word: σιδήρῳ
  choice: com ferro
  rationale: O dativo é instrumental. «Com ferro» preserva a concisão do grego sem especificar indevidamente pregos, grampos ou outro mecanismo.
theological_decisions:
- issue: Tratamento pronominal do objeto fabricado
  choice: Pronomes gramaticais «lhe» e «o», retomando o objeto sem o nomear como pessoa
  alternative: Repetir explicitamente «o ídolo» ou empregar uma forma feminina se o antecedente traduzido for «imagem»
  rationale: O grego retoma um objeto manufaturado. Como o português não dispõe de pronome neutro equivalente ao inglês «it», as formas escolhidas funcionam gramaticalmente e não concedem personalidade ao objeto; também evitam introduzir no versículo um substantivo ausente do texto grego imediato.
translation_notes:
  register: Português moderno, claro e digno, com construção fluente e leve ironia preservada pela palavra «morada». O marcador [a] aparece no texto principal.
