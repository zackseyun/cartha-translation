base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/016.yaml
  text: So then[a], lest it fall, he made provision for it, knowing that it is unable to help itself; for it is an image and has need of help.
translation:
  language: pt
  text: Assim, para que ela não caísse, ele tomou providências para ela, sabendo que é incapaz de ajudar a si mesma; pois é uma imagem[a] e necessita de ajuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ídolo”. A palavra grega significa literalmente “imagem” ou “semelhança”, embora o contexto se refira a um objeto de culto fabricado.
    reason: alternativa lexical
lexical_decisions:
- source_word: ἵνα μὲν οὖν μὴ καταπέσῃ
  choice: Assim, para que ela não caísse
  rationale: A construção ἵνα com μή e o subjuntivo expressa finalidade preventiva; a formulação portuguesa conserva tanto o nexo conclusivo de οὖν como a ideia de evitar a queda.
- source_word: προενόησεν αὐτοῦ
  choice: ele tomou providências quanto a ela
  rationale: προνοέω comunica cuidado ou providência antecipada. A tradução mantém a ideia de medidas preventivas sem especificar um método de sustentação que o grego não declara.
- source_word: ἀδυνατεῖ ἑαυτῷ βοηθῆσαι
  choice: é incapaz de ajudar a si mesma
  rationale: Preserva de modo direto a incapacidade expressa por ἀδυνατεῖ e a ação reflexiva de ἑαυτῷ βοηθῆσαι.
- source_word: εἰκὼν
  choice: imagem
  rationale: É o sentido lexical direto de εἰκών e conserva a ironia do contexto sem substituir o termo por uma interpretação contextual mais específica.
- source_word: χρείαν ἔχει βοηθείας
  choice: necessita de ajuda
  rationale: Equivale naturalmente em português ao idioma grego 'tem necessidade de ajuda' e mantém o contraste irônico com a incapacidade da imagem.
theological_decisions:
- issue: Referente e força retórica de εἰκών no contexto da crítica à idolatria
  choice: imagem
  alternative: ídolo
  rationale: Embora o contexto trate claramente de um objeto de culto fabricado, εἰκών significa literalmente 'imagem' ou 'semelhança'. 'Imagem' preserva a formulação e a ironia do original; 'ídolo' explicita uma interpretação contextual legítima, registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe ligeiramente formal para preservar a argumentação irônica do texto. O pronome feminino retoma a imagem mencionada no contexto, apesar de εἰκών ser masculino em grego.
