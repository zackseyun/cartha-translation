base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/002.yaml
  text: Instead[a], they considered either fire, or wind, or swift air, or the circle of the stars, or violent water, or the lights of heaven, to be gods[c][b], rulers of the world.
translation:
  language: pt
  text: Em vez disso, consideraram o fogo, ou o vento[a], ou o ar veloz, ou o círculo das estrelas[b], ou a água impetuosa, ou as luzes do céu como deuses, governantes do mundo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «espírito» ou «sopro»; neste contexto de elementos e fenômenos naturais, «vento» é o sentido mais provável.
    reason: lexical_alternative
  - marker: b
    text: Ou «o circuito das estrelas».
    reason: lexical_alternative
  - marker: c
    text: O termo grego designa os que presidem, regem ou governam; literalmente, «governantes do mundo».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ ἢ
  choice: Em vez disso, ... ou
  rationale: Marca o contraste com o versículo anterior e introduz de modo natural, em português, a série de realidades equivocadamente tomadas por deuses.
- source_word: πῦρ
  choice: o fogo
  rationale: Equivalente direto e corrente para o elemento natural.
- source_word: πνεῦμα
  choice: o vento
  rationale: No contexto de forças e fenômenos naturais, «vento» expressa melhor o sentido, sem sugerir indevidamente um ser espiritual.
- source_word: ταχινὸν ἀέρα
  choice: o ar veloz
  rationale: Mantém a distinção grega entre πνεῦμα e ἀήρ e preserva a ideia de rapidez do adjetivo.
- source_word: κύκλον ἄστρων
  choice: o círculo das estrelas
  rationale: Conserva a imagem do curso circular ou da esfera estrelada sem definir excessivamente a cosmologia pressuposta.
- source_word: βίαιον ὕδωρ
  choice: as águas impetuosas
  rationale: A expressão portuguesa idiomática comunica a força violenta da água; o plural coletivo é natural neste contexto.
- source_word: φωστῆρας οὐρανοῦ
  choice: os luzeiros do céu
  rationale: «Luzeiros» é uma designação digna e inteligível dos corpos celestes luminosos, preservando a referência ao céu.
- source_word: πρυτάνεις κόσμου
  choice: governantes do mundo
  rationale: Preserva a aposição que caracteriza os supostos deuses como aqueles que presidem ou governam o cosmos.
- source_word: θεοὺς ἐνόμισαν
  choice: consideraram deuses
  rationale: Reproduz de forma clara e natural o juízo expresso por ἐνόμισαν com seu complemento predicativo.
theological_decisions:
- issue: Sentido de πνεῦμα
  choice: vento
  alternative: espírito; sopro
  rationale: A enumeração trata de elementos, forças naturais e corpos celestes deificados; «vento» corresponde ao contexto sem importar uma referência pessoal ou teológica.
- issue: Relação de πρυτάνεις κόσμου com θεούς
  choice: deuses ... — governantes do mundo
  alternative: deuses que governavam o mundo; deuses, regentes do cosmos
  rationale: O travessão deixa clara a força apositiva do grego e preserva tanto a atribuição de divindade quanto a suposta função de governo cósmico, sem fundi-las numa única afirmação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração foi mantida compacta; «luzeiros» preserva o tom literário sem obscurecer o sentido, e o travessão explicita a aposição final do grego.
