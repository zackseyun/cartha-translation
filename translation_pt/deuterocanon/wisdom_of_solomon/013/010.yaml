base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/010.yaml
  text: But miserable are they[a], and their hopes are among the dead, who called gods the works of human hands—gold and silver, the product of skill, and images of animals, or a useless stone[b], the work of an ancient hand.
translation:
  language: pt
  text: 'Mas miseráveis são eles, e suas esperanças estão entre os mortos[a]: chamaram de deuses obras de mãos humanas — ouro e prata, produto da habilidade, imagens de animais ou uma pedra inútil[b], obra de uma mão antiga.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “suas esperanças estão em coisas mortas” ou “suas esperanças estão com os mortos”. A expressão grega é concisa e pode evocar tanto ídolos sem vida quanto a inutilidade associada à morte.'
    reason: alternative_reading
  - marker: b
    text: A expressão “obra de uma mão antiga” pode indicar um ídolo de pedra feito muito tempo atrás, ressaltando tanto sua antiguidade quanto sua origem meramente humana.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταλαιπώροι
  choice: miseráveis
  rationale: Expressa a condição deplorável e conserva a força de denúncia do grego em linguagem portuguesa atual.
- source_word: ἐν νεκροῖς αἱ ἐλπίδες αὐτῶν
  choice: suas esperanças estão entre os mortos
  rationale: Mantém a imagem concisa e a ambiguidade do plural νεκροῖς, sem decidir se a referência principal é aos ídolos sem vida, aos mortos ou ao domínio da morte.
- source_word: οἵτινες ἐκάλεσαν θεοὺς
  choice: chamaram de deuses
  rationale: Reproduz diretamente o ato de atribuir a condição de deuses às obras enumeradas, com construção idiomática em português.
- source_word: ἔργα χειρῶν ἀνθρώπων
  choice: obras de mãos humanas
  rationale: Preserva o conhecido contraste bíblico entre divindade e fabricação humana, traduzindo ἀνθρώπων de modo genericamente humano e exato.
- source_word: τέχνης ἐμμελέτημα
  choice: produto da habilidade
  rationale: Comunica que os objetos são resultados de perícia artesanal, sem lhes conferir indevidamente o sentido moderno de belas-artes.
- source_word: ἀπεικάσματα ζώων
  choice: imagens de animais
  rationale: É uma formulação clara e natural para representações visuais de seres vivos no contexto de idolatria.
- source_word: λίθον ἄχρηστον
  choice: uma pedra inútil
  rationale: Conserva o sentido concreto de algo sem uso e a força polêmica do texto contra o ídolo.
- source_word: χειρὸς ἔργον ἀρχαίας
  choice: obra de mão antiga
  rationale: Mantém a construção compacta do grego e associa a antiguidade à mão que produziu a pedra, embora a expressão admita explicitação temporal.
theological_decisions:
- issue: Referente de “entre os mortos”
  choice: Preservar a metáfora ampla sem identificar explicitamente “os mortos” com os ídolos ou com pessoas mortas.
  alternative: “suas esperanças estão em coisas mortas” ou “suas esperanças estão com os mortos”
  rationale: A formulação grega é deliberadamente breve e pode reunir a falta de vida dos ídolos e a inutilidade mortal da esperança depositada neles; especificar um único referente eliminaria essa tensão.
- issue: Caráter humano das obras idolátricas
  choice: “obras de mãos humanas”
  alternative: “obras das mãos dos homens”
  rationale: ἀνθρώπων designa seres humanos em geral; a tradução mantém o contraste teológico entre o que é divino e o que é fabricado por humanos sem introduzir especificidade masculina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e as imagens marcantes do grego foram preservadas, enquanto a pontuação esclarece que os materiais e objetos enumerados são as obras humanas chamadas deuses.
