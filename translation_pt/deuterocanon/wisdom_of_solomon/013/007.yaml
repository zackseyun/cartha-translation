base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/007.yaml
  text: For while moving among his works[a], they examine them closely, and they are persuaded by what they see, because the things being seen are beautiful.
translation:
  language: pt
  text: Pois, vivendo em meio às obras dele, eles as investigam atentamente e se deixam convencer pelo que veem, porque as coisas visíveis são belas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “boas”. A palavra grega pode significar tanto “belas” quanto “boas”; aqui, “belas” se ajusta à ênfase no que é percebido pela visão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστρεφόμενοι
  choice: vivendo em meio a
  rationale: O particípio pode indicar a maneira de viver, conduzir-se ou mover-se em determinado âmbito. A expressão preserva tanto a experiência contínua quanto a relação concreta com as obras observadas.
- source_word: διεραυνῶσιν
  choice: investigam atentamente
  rationale: O verbo intensivo denota exame cuidadoso ou investigação minuciosa; esta formulação é natural e mantém essa força.
- source_word: πείθονται
  choice: se deixam convencer
  rationale: Preserva o valor médio-passivo de serem persuadidos pela evidência visual, sem reduzir o verbo a uma simples afirmação de crença.
- source_word: τῇ ὄψει
  choice: pelo que veem
  rationale: Expressa de modo idiomático o dativo instrumental ligado à visão ou aparência e mantém a ênfase na experiência visual.
- source_word: καλά
  choice: belas
  rationale: Embora o termo também possa significar 'boas', o contexto destaca aquilo que é percebido pela visão, favorecendo aqui o sentido estético.
- source_word: τὰ βλεπόμενα
  choice: as coisas visíveis
  rationale: A expressão designa as realidades que podem ser vistas. A formulação é clara em português e conserva o caráter passivo do particípio grego.
theological_decisions:
- issue: Referente de αὐτοῦ
  choice: dele, referindo-se a Deus ou ao criador no argumento do contexto
  alternative: disso, caso o pronome seja entendido de maneira impessoal ou abstrata
  rationale: O contexto passa das obras criadas ao seu autor. 'Dele' conserva o referente pessoal sugerido pelo argumento sem acrescentar uma identificação doutrinária além do texto.
