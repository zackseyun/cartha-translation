base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/006.yaml
  text: Yet even for these there is only slight blame, for they too perhaps go astray while seeking God and wanting to find him;
translation:
  language: pt
  text: Contudo, mesmo para eles há pouca censura, pois talvez também se desviem enquanto buscam a Deus[a] e querem encontrá-lo;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um deus”. O grego não traz artigo, mas, neste contexto, o autor provavelmente se refere ao Deus verdadeiro que eles procuram encontrar, embora de modo equivocado.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  choice: Contudo
  rationale: Expressa de modo natural a força adversativa e concessiva da combinação grega.
- source_word: ἐπὶ τούτοις
  choice: mesmo para eles
  rationale: Retoma as pessoas descritas no contexto anterior, e não apenas assuntos abstratos.
- source_word: μέμψις ὀλίγη
  choice: pouca censura
  rationale: Mantém a ideia de reprovação ou censura, sem introduzir o peso jurídico de culpa, e preserva a atenuação de ὀλίγη.
- source_word: τάχα
  choice: talvez
  rationale: Conserva a modalização e a incerteza expressas pelo advérbio.
- source_word: πλανῶνται
  choice: se desviem
  rationale: Comunica erro e afastamento do caminho sem especificar indevidamente uma causa externa.
- source_word: θεὸν ζητοῦντες
  choice: enquanto buscam a Deus
  rationale: O particípio indica ação simultânea; no contexto, θεόν provavelmente designa o Deus verdadeiro, embora a ausência do artigo permita registrar a alternativa em nota.
- source_word: θέλοντες εὑρεῖν
  choice: querem encontrá-lo
  rationale: Preserva claramente a volição e retoma Deus como objeto de εὑρεῖν em português natural.
theological_decisions:
- issue: Se θεόν deve ser traduzido de modo definido (‘Deus’) ou indefinido (‘um deus’)
  choice: Deus
  alternative: um deus
  rationale: No argumento de Sabedoria 13, essas pessoas procuram chegar à divindade a partir da criação, mas não reconhecem o Criador. O contexto favorece referência ao Deus verdadeiro, enquanto a ambiguidade gramatical é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. ‘Pouca censura’ evita uma formulação excessivamente jurídica; ‘querem encontrá-lo’ mantém linguagem corrente sem perder a seriedade do texto.
