  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/003.yaml
  text: If, then, delighting in their beauty, they supposed them to be gods, let them know how much better than these is their Master; for the creator of beauty created them.
translation:
  language: pt
  text: Se, encantados com a beleza delas, as consideraram deuses, reconheçam quanto é superior a elas o seu Senhor, pois o criador da beleza as criou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ καλλονῇ
  choice: com a beleza
  rationale: Expressa de modo natural a beleza percebida nas coisas criadas, preservando o sentido do substantivo grego.
- source_word: τερπόμενοι
  choice: encantados
  rationale: Comunica o prazer e fascínio estético do particípio sem recorrer a uma formulação excessivamente literal.
- source_word: ὑπελάμβανον
  choice: consideraram
  rationale: Neste contexto, o verbo indica formar a opinião ou suposição de que as coisas observadas fossem deuses.
- source_word: ὁ δεσπότης
  choice: o Senhor delas
  rationale: Preserva a ideia de senhorio e domínio de δεσπότης; o complemento torna explícita a relação indicada pelo contexto sem identificar o termo com o nome divino.
- source_word: βελτίων
  choice: superior
  rationale: O comparativo descreve excelência maior; 'superior' soa natural em português e evita a possível leitura meramente moral de 'melhor'.
- source_word: ὁ ... γενεσιούργης
  choice: aquele que deu origem
  rationale: O termo raro designa quem origina ou produz; a expressão preserva essa força criadora em português claro.
- source_word: ἔκτισεν
  choice: criou
  rationale: Equivalente direto do verbo grego para criar, adequado à afirmação sobre a origem das realidades contempladas.
theological_decisions:
- issue: Relação entre o Criador, a beleza e as coisas criadas
  choice: “aquele que deu origem à beleza as criou”
  alternative: “o criador da beleza as criou”
  rationale: A formulação escolhida conserva a distinção entre a origem da beleza e a criação das coisas belas, sem explicar além do que o grego afirma.
- issue: Sentido de δεσπότης
  choice: “o Senhor delas”
  alternative: “o Dono delas”
  rationale: “Senhor” mantém o registro teológico e a noção de autoridade soberana, enquanto “Dono” seria mais estreito e menos digno no contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, mantendo a exortação, a comparação e a fundamentação causal do grego.
