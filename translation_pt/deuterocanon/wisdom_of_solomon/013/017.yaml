base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/017.yaml
  text: But concerning his possessions and his marriage and children[a], while praying he is not ashamed to address the lifeless thing; and concerning health, he calls on what is weak[c][b],
translation:
  language: pt
  text: Mas, ao orar por seus bens, casamentos[a] e filhos, ele não se envergonha de falar com aquilo que não tem vida[b]; e, quanto à saúde, invoca aquilo que é fraco[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “questões matrimoniais”. O grego traz o plural “casamentos”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o que não tem vida”; o autor evita nomear diretamente o ídolo e o descreve como destituído de vida.
    reason: lexical_alternative
  - marker: c
    text: Ou “o que é débil”. A expressão caracteriza com desprezo a impotência do ídolo.
    reason: lexical_alternative
lexical_decisions:
- source_word: κτημάτων
  choice: bens
  rationale: Expressa de modo natural e abrangente as posses ou propriedades de alguém, sem restringir o sentido a terras.
- source_word: γάμων
  choice: casamentos
  rationale: Mantém o plural grego e sua possível referência geral a questões matrimoniais, sem reduzi-lo silenciosamente ao singular.
- source_word: τέκνων
  choice: filhos
  rationale: É a forma direta e natural de traduzir o termo no contexto familiar.
- source_word: προσευχόμενος
  choice: ao orar
  rationale: Reproduz o valor adverbial do particípio e liga a oração ao ato de dirigir-se ao objeto sem vida.
- source_word: οὐκ αἰσχύνεται
  choice: não se envergonha
  rationale: Preserva de perto o tom moral e crítico da expressão grega.
- source_word: τῷ ἀψύχῳ
  choice: aquilo que não tem vida
  rationale: Comunica claramente a ausência de vida ou alento e conserva a formulação descritiva, sem inserir 'ídolo' no texto.
- source_word: προσλαλῶν
  choice: falar com
  rationale: Traduz com naturalidade o ato de dirigir a palavra a algo, sem acrescentar uma ideia além da oração já mencionada.
- source_word: ὑγείας
  choice: saúde
  rationale: É o equivalente direto e adequado ao contraste com a fraqueza daquilo que é invocado.
- source_word: τὸ ἀσθενές
  choice: aquilo que é fraco
  rationale: Mantém a expressão neutra e depreciativa que caracteriza o objeto como incapaz ou impotente.
- source_word: ἐπικαλεῖται
  choice: invoca
  rationale: É preciso no contexto religioso de chamar por auxílio e mantém o tom elevado sem perder clareza.
theological_decisions:
- issue: Polêmica contra os ídolos em ἀψύχῳ e τὸ ἀσθενές
  choice: Manter expressões descritivas — 'aquilo que não tem vida' e 'aquilo que é fraco' — sem acrescentar o substantivo 'ídolo'.
  alternative: o ídolo sem vida; o objeto impotente
  rationale: O grego evita nomear diretamente o ídolo e o caracteriza por sua falta de vida e poder. Preservar esse recurso mantém a força retórica sem explicitar mais do que o original.
- issue: Plural γάμων
  choice: casamentos
  alternative: casamento; questões matrimoniais
  rationale: O plural é formalmente claro no grego e pode abranger preocupações matrimoniais em geral; mantê-lo evita resolver uma possível amplitude de sentido no corpo do texto.
translation_notes:
  register: Português moderno, digno e acessível, com construção fluente para leitores brasileiros e compreensão internacional. O paralelismo grego foi preservado por meio de “por” e “quanto à”, e as descrições neutras e depreciativas do objeto cultual foram mantidas.
