base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/013.yaml
  text: But the refuse from these[a], useful for nothing, a crooked piece of wood and full of knots—taking it, he carved it with the diligence of his idleness, and with the skill of his leisure he shaped it, and made it like the image of a man[b],
translation:
  language: pt
  text: Mas ele pegou o refugo delas[a], que não servia para nada — um pedaço de madeira torto e cheio de nós —, e o entalhou com o esmero de sua ociosidade[b]; com a perícia de suas horas de folga, deu-lhe forma e o fez semelhante à imagem de um homem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pedaço descartado”, “rejeito” ou “resto”. O termo grego indica algo jogado fora por ser considerado sem valor.'
    reason: lexical_alternative
  - marker: b
    text: 'A expressão é deliberadamente irônica: ele emprega grande cuidado e habilidade durante seu ócio para fabricar um ídolo.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀπόβλημα
  choice: sobra
  rationale: Designa algo rejeitado ou descartado por não ter valor. “Sobra” comunica naturalmente o resto de madeira, enquanto a nota explicita a ideia de descarte.
- source_word: εἰς οὐδὲν εὔχρηστον
  choice: sem utilidade alguma
  rationale: Preserva a afirmação enfática de que o pedaço não servia para nada.
- source_word: ξύλον σκολιὸν καὶ ὅζοις συμπεφυκός
  choice: um pedaço de madeira torto e cheio de nós
  rationale: Descreve concretamente uma madeira defeituosa, marcada por nós formados pelo crescimento dos galhos.
- source_word: ἐγλύψεν
  choice: entalhou
  rationale: É o verbo português adequado para o trabalho de cortar e esculpir madeira.
- source_word: ἐν ἐπιμελείᾳ ἀργίας αὐτοῦ
  choice: com o esmero de sua ociosidade
  rationale: Mantém o paradoxo irônico entre cuidado laborioso e ociosidade, sem reduzir a frase a uma simples referência a tempo livre.
- source_word: ἐμπειρίᾳ ἀνέσεως
  choice: com a perícia de suas horas de folga
  rationale: Expressa a habilidade exercitada em tempo de descanso e conserva o paralelismo satírico da frase anterior.
- source_word: ἐτύπωσεν αὐτό
  choice: deu-lhe forma
  rationale: Reproduz o ato de modelar ou conformar o objeto em português corrente.
- source_word: ἀπεικάσεν αὐτὸ εἰκόνι ἀνθρώπου
  choice: a fez semelhante à imagem de um homem
  rationale: Preserva a relação explícita de semelhança e o substantivo εἰκών, bem como a referência singular masculina do texto.
theological_decisions:
- issue: Referência antropomórfica em εἰκόνι ἀνθρώπου
  choice: à imagem de um homem
  alternative: a uma figura humana
  rationale: A formulação conserva a referência masculina singular e a linguagem de “imagem”, sem generalizá-la nem acrescentar uma interpretação teológica.
- issue: Ironia sobre o trabalho realizado no ócio
  choice: com o esmero de sua ociosidade; com a perícia de suas horas de folga
  alternative: com muito cuidado em seu tempo livre
  rationale: A tradução mantém a tensão retórica intencional entre diligência, ociosidade e lazer, em vez de transformá-la numa descrição neutra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe natural para leitores brasileiros. A formulação conserva a ironia do grego e mantém a sequência concreta do trabalho artesanal.
