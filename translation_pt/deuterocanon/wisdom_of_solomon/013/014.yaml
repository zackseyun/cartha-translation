  text: or he made it like some lowly animal[a], smearing it with red ocher and with dye, reddening its surface, and smearing over every blemish on it[b],
translation:
  language: pt
  text: ou o fez semelhante a algum animal de pouco valor[a], cobrindo-o de ocre vermelho e de corante, avermelhando sua superfície e cobrindo todas as manchas que havia nele[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “algum animal comum” ou “algum animal barato”; o grego ressalta a condição baixa ou o pouco valor do animal que a imagem procura imitar.
    reason: lexical_alternative
  - marker: b
    text: 'O grego menciona materiais usados para colorir: “ocre vermelho” (μίλτος) e φῦκος, um corante ou pigmento cosmético avermelhado.'
    reason: cultural_note
lexical_decisions:
- source_word: ζώῳ τινὶ εὐτελεῖ
  choice: algum animal de pouco valor
  rationale: ζῷον designa um animal ou ser vivo, e εὐτελής comunica caráter barato, comum ou de baixa condição. “De pouco valor” preserva o tom depreciativo sem atribuir ao animal uma falha moral.
- source_word: ὡμοίωσεν αὐτό
  choice: o fez semelhante a
  rationale: Expressa de modo natural a ação de dar ao objeto a semelhança de um animal, sem acrescentar detalhes ausentes do grego.
- source_word: καταχρίσας
  choice: cobrindo-o / cobrindo
  rationale: O verbo descreve a aplicação de uma substância sobre uma superfície. “Cobrir” funciona tanto para a aplicação dos materiais colorantes quanto para a ocultação das manchas e evita associações religiosas de “ungir”.
- source_word: μίλτῳ
  choice: ocre vermelho
  rationale: μίλτος designa terra ou ocre vermelho empregado como pigmento; “ocre vermelho” é um equivalente moderno preciso.
- source_word: φύκει
  choice: corante
  rationale: φῦκος pode designar uma matéria vermelha usada como corante ou cosmético, historicamente associada a produtos marinhos. “Corante” mantém o sentido amplo sem especificar uma composição incerta.
- source_word: ἐρυθῆνας χρῶαν αὐτοῦ
  choice: avermelhando sua superfície
  rationale: χρόα pode referir-se à pele, aparência ou superfície. Como o referente é uma imagem fabricada, “superfície” é claro e adequado, enquanto “avermelhando” conserva a ação de dar-lhe cor vermelha.
- source_word: πᾶσαν κηλῖδα τὴν ἐν αὐτῷ
  choice: todas as manchas que havia nele
  rationale: κηλίς pode significar mancha, nódoa ou imperfeição. “Manchas” preserva a imagem concreta de defeitos visíveis que o artesão recobre.
