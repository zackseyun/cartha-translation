base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/013/011.yaml
  text: Or if some woodcutter[a], a carpenter, has sawed down a manageable tree and skillfully stripped off all its bark, and with proper craftsmanship made a useful vessel for the service of life[b],
translation:
  language: pt
  text: Ou ainda, se um lenhador, um carpinteiro, serrou uma árvore fácil de trabalhar[a], removeu habilmente toda a sua casca e, trabalhando-a com esmero, fez um utensílio útil para o uso na vida[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «fácil de manejar». O adjetivo grego pode indicar madeira que se move, se maneja ou se trabalha com facilidade.
    reason: lexical_alternative
  - marker: b
    text: Ou «para as necessidades da vida» ou «para uso na vida diária». A expressão grega se refere ao uso prático na vida humana comum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑλοτόμος
  choice: lenhador
  rationale: O composto designa quem corta madeira; “lenhador” é claro, corrente e adequado ao contexto.
- source_word: τέκτων
  choice: carpinteiro
  rationale: Embora possa designar um artesão em sentido amplo, o trabalho específico com madeira favorece “carpinteiro”.
- source_word: εὐκίνητον φυτὸν
  choice: uma árvore fácil de trabalhar
  rationale: φυτὸν é literalmente uma planta ou crescimento vegetal, mas o contexto indica uma árvore; εὐκίνητον sugere material fácil de manejar ou trabalhar, sem exigir uma característica física mais específica.
- source_word: ἐκπρίσας
  choice: depois de serrar
  rationale: O verbo indica cortar com serra. A construção temporal reproduz naturalmente em português a sequência expressa pelo particípio grego.
- source_word: περιέξυσεν εὐμαθῶς πάντα τὸν φλοιὸν αὐτοῦ
  choice: remover com perícia toda a sua casca
  rationale: περιέξυσεν descreve raspar ou retirar ao redor, e o objeto φλοιός especifica a casca. “Com perícia” comunica a habilidade prática indicada por εὐμαθῶς.
- source_word: τεχνησάμενος εὐπρεπῶς
  choice: trabalha a madeira com esmero
  rationale: A expressão destaca o exercício cuidadoso e apropriado do ofício. Explicitar “a madeira” torna a referência natural em português sem estreitar o sentido.
- source_word: κατεσκεύασεν χρήσιμον σκεῦος
  choice: faz um utensílio útil
  rationale: σκευ̂ος é um termo amplo para objeto, recipiente ou implemento. “Utensílio” preserva o caráter prático sem definir indevidamente o objeto.
- source_word: εἰς ὑπηρεσίαν ζωῆς
  choice: para as necessidades da vida
  rationale: A expressão refere-se ao serviço prático da vida humana cotidiana; esta formulação é natural e mantém sua amplitude.
theological_decisions:
- issue: Descrição do trabalho humano comum como preparação para o argumento posterior contra a fabricação de ídolos
  choice: Manter neste versículo uma descrição neutra do trabalho útil do carpinteiro.
  alternative: Introduzir linguagem negativa que antecipe explicitamente a crítica à idolatria.
  rationale: O versículo descreve a produção legítima de um objeto de uso cotidiano. A crítica teológica surge no desenvolvimento posterior e não deve ser importada para esta frase.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A estrutura mantém o caráter condicional e a sequência artesanal do grego, sem antecipar a polêmica do contexto seguinte.
