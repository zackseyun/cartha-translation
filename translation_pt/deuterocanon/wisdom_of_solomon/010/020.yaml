base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/020.yaml
  text: Therefore the righteous plundered the ungodly[a], and they sang praise to your holy name, O Lord[b]; and with one accord they praised your defending hand.
translation:
  language: pt
  text: Por isso, os justos despojaram os ímpios[a] e cantaram louvores ao teu santo nome, ó Senhor; e, unanimemente, louvaram a tua mão defensora[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por «saquearam» ou «tomaram despojos deles». O verbo grego se refere à tomada dos bens dos inimigos derrotados.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «tua mão que luta em favor de [teu povo]» ou «tua mão protetora».
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural e conciso a conclusão decorrente do livramento narrado anteriormente.
- source_word: δίκαιοι
  choice: os justos
  rationale: Mantém o adjetivo substantivado e sua caracterização moral e religiosa sem explicitar uma identidade étnica que o grego deixa ao contexto.
- source_word: ἐσκύλευσαν
  choice: despojaram
  rationale: Comunica a tomada dos bens ou despojos dos vencidos e preserva a imagem concreta de vitória.
- source_word: ἀσεβεῖς
  choice: os ímpios
  rationale: Preserva a ênfase na irreverência para com Deus, não apenas na maldade em sentido geral.
- source_word: ὕμνησαν
  choice: cantaram louvores
  rationale: Conserva a nuance musical do verbo, que pode indicar louvor entoado em hino.
- source_word: Κύριε
  choice: ó Senhor
  rationale: Marca com clareza o vocativo dirigido a Deus em linguagem bíblica digna e corrente.
- source_word: τὸ ὄνομα τὸ ἅγιόν σου
  choice: ao teu santo nome
  rationale: Reproduz a expressão bíblica referente à identidade e reputação reveladas de Deus.
- source_word: τήν τε ὑπέρμαχόν σου χεῖρα
  choice: a tua mão defensora
  rationale: Mantém a metáfora da mão divina e o sentido de uma força que combate em favor de alguém, sem reduzi-la à ideia genérica de poder.
- source_word: ᾔνεσαν
  choice: louvaram
  rationale: Verbo corrente de louvor, distinto de 'cantaram louvores', que traduz a nuance mais específica de ὕμνησαν.
- source_word: ὁμοθυμαδόν
  choice: unânimes
  rationale: Expressa unidade de disposição e propósito, e não apenas simultaneidade.
theological_decisions:
- issue: Referência histórica de 'os justos' e 'os ímpios'
  choice: Manter as categorias genéricas 'os justos' e 'os ímpios'.
  alternative: Explicitar 'os israelitas justos' e 'os egípcios ímpios'.
  rationale: Embora o contexto aponte para Israel e os egípcios, o texto grego emprega categorias morais e religiosas; a tradução preserva essa formulação e deixa a identificação histórica ao contexto.
- issue: Ação divina representada pela 'mão defensora'
  choice: Preservar a metáfora da mão e traduzir ὑπέρμαχος por 'defensora'.
  alternative: Traduzir como 'poder protetor', 'mão poderosa' ou 'mão que combateu por eles'.
  rationale: A formulação conserva tanto a imagem corporal bíblica quanto o aspecto ativo de Deus combatendo em favor dos seus, sem inserir no texto um objeto indireto que o grego não explicita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A colocação de “ó Senhor” identifica naturalmente o vocativo; “unânimes” evita o arcaísmo de “a uma só voz” e preserva a unidade de propósito expressa no grego.
