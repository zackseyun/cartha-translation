lexical_decisions:
- source_word: αὕτη
  choice: Ela
  rationale: Retoma a Sabedoria, personificada no contexto, preservando o pronome feminino do grego.
- source_word: πραθέντα
  choice: quando ele foi vendido
  rationale: Expressa naturalmente em português o particípio passivo de πιπράσκω, sem explicitar agentes não mencionados neste versículo.
- source_word: δίκαιον
  choice: o justo
  rationale: Mantém o substantivo adjetival e sua caracterização moral, sem acrescentar «homem», ausente no grego.
- source_word: οὐκ ἐγκατέλιπεν
  choice: não abandonou
  rationale: Equivalência direta e idiomática para a ideia de deixar alguém desamparado.
- source_word: ἐρρύσατο
  choice: resgatou
  rationale: Comunica livramento de um perigo ou poder adverso e conserva a força do aoristo médio de ῥύομαι.
- source_word: ἐξ ἁμαρτίας
  choice: do pecado
  rationale: Segue de perto a construção grega e evita especificar se se trata de pecado pessoal, poder do pecado ou situação pecaminosa.
theological_decisions:
- issue: Referência e alcance de «do pecado»
  choice: Manter «do pecado» sem explicação no texto
  alternative: Traduzir como «da transgressão» ou identificar de quem era o pecado
  rationale: O grego não fornece possessivo nem resolve explicitamente se ἁμαρτία designa culpa pessoal, tentação ou esfera de pecado; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e proximidade formal ao grego. O ponto e vírgula foi mantido porque o texto fornecido encerra apenas a primeira unidade da frase.
