  text: She rescued a holy people and a blameless offspring from a nation of oppressors[a].
translation:
  language: pt
  text: Ela resgatou um povo santo e uma descendência irrepreensível de uma nação de opressores.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «de uma nação opressora» ou «de uma nação que afligia». O particípio grego θλιβόντων pode ser entendido como substantivo, «opressores», ou como qualificando «nação».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: Ela
  rationale: O demonstrativo feminino retoma a Sabedoria personificada no contexto. «Ela» preserva a referência anafórica e a personificação sem explicitar o substantivo onde o grego usa pronome.
- source_word: λαὸν
  choice: povo
  rationale: É a forma coletiva mais natural para a provável referência a Israel e mantém a distinção lexical em relação a ἔθνος, traduzido por «nação».
- source_word: ὅσιον
  choice: santo
  rationale: Expressa a qualidade religiosa e pactual do povo em linguagem bíblica clara, sem reduzir o termo apenas a devoção subjetiva.
- source_word: σπέρμα
  choice: descendência
  rationale: Preserva o valor coletivo singular de «semente/linhagem» em português natural; «semente» seria excessivamente literal neste contexto.
- source_word: ἄμεμπτον
  choice: irrepreensível
  rationale: Comunica ausência de motivo legítimo de censura e combina naturalmente com «descendência».
- source_word: ἐρρύσατο
  choice: resgatou
  rationale: Transmite livramento de perigo e opressão de modo vivo e atual, sem impor sentidos soteriológicos mais amplos.
- source_word: ἐξ ἔθνους θλιβόντων
  choice: de uma nação que os oprimia
  rationale: Torna explícita em português a relação do particípio com a nação e seu objeto implícito, preservando o sentido de aflição/opressão. A discordância formal entre ἔθνους e θλιβόντων admite uma leitura substantivada, registrada em nota.
theological_decisions:
- issue: Referente do pronome feminino αὕτη
  choice: O pronome refere-se à Sabedoria personificada e é traduzido por «Ela».
  alternative: Explicitar «A Sabedoria» ou traduzir literalmente «Esta».
  rationale: O contexto apresenta a Sabedoria como agente feminino. O pronome mantém a personificação e a continuidade literária sem acrescentar um substantivo ausente do grego.
- issue: Descrição moral e pactual em ὅσιον ... ἄμεμπτον
  choice: «santo» e «irrepreensível»
  alternative: «piedoso» e «sem culpa»
  rationale: A tradução conserva sem atenuação a força religiosa e ética atribuída retoricamente ao povo e à descendência, sem importar categorias doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Descendência irrepreensível» conserva o paralelismo elevado; «que os oprimia» é mais natural no texto principal, enquanto a construção alternativa do grego é preservada em nota.
