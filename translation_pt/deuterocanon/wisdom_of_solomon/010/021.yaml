  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/021.yaml
  text: For wisdom opened the mouths of the mute[c][b][a], and made the tongues of infants eloquent.
translation:
  language: pt
  text: Pois a sabedoria[c] abriu a boca dos mudos[a] e tornou bem articuladas as línguas de crianças pequenas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos surdos”. A palavra grega pode designar quem não ouve ou quem não fala; neste contexto, “mudos” se ajusta melhor à referência à boca e às línguas.
    reason: lexical_alternative
  - marker: b
    text: Ou “tornou claras” ou “distintas as línguas de crianças pequenas”. O termo grego descreve uma fala clara e distinta.
    reason: lexical_alternative
  - marker: c
    text: A sabedoria é personificada ao longo desta seção; por isso, algumas traduções escrevem “Sabedoria” com inicial maiúscula.
    reason: alternative_reading
lexical_decisions:
- source_word: σοφία
  choice: sabedoria
  rationale: Mantém o sentido lexical e, com inicial minúscula, não força uma interpretação além da personificação já evidente pela ação atribuída à sabedoria.
- source_word: ἤνοιξεν
  choice: abriu
  rationale: Reproduz diretamente o aoristo de ἀνοίγω e preserva a imagem concreta de abrir a boca para possibilitar a fala.
- source_word: στόμα κωφῶν
  choice: a boca dos mudos
  rationale: Preserva o singular coletivo στόμα. Embora κωφός possa significar surdo ou mudo, o paralelismo com boca e línguas favorece aqui a incapacidade de falar.
- source_word: γλώσσας
  choice: as línguas
  rationale: Conserva a imagem corporal e o paralelismo com boca, em vez de substituir a palavra por uma abstração como fala.
- source_word: νηπίων
  choice: das crianças de colo
  rationale: Expressa νήπιοι como crianças muito pequenas, ainda na primeira infância, em linguagem portuguesa natural e compreensível.
- source_word: ἔθηκεν τρανάς
  choice: tornou eloquentes
  rationale: Traduz a construção como resultado e comunica fala clara, distinta e bem articulada, preservando também a força poética do original.
theological_decisions:
- issue: Personificação de σοφία
  choice: sabedoria com inicial minúscula
  alternative: Sabedoria com inicial maiúscula
  rationale: O grego apresenta a sabedoria como agente, mas a capitalização poderia transformar um recurso literário em identificação teológica mais determinada. A minúscula conserva tanto o sentido comum do substantivo quanto a personificação contextual.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A formulação preserva o paralelismo poético entre “boca” e “línguas”, bem como a personificação sem a tornar excessivamente explícita.
