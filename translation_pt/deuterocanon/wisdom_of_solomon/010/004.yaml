base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/004.yaml
  text: Because of him[a], when the earth was being flooded, wisdom again saved it, steering the righteous man by means of a humble piece of wood.
translation:
  language: pt
  text: Por causa dele, quando a terra estava sendo inundada, a sabedoria tornou a salvá-la, conduzindo o justo por meio de um simples pedaço de madeira.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio de um pedaço de madeira de pouco valor” ou “insignificante”. A expressão refere-se à arca e ressalta a simplicidade do meio pelo qual a sabedoria preservou o justo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι' ὃν
  choice: Por causa dele
  rationale: Expressa o valor causal da preposição com o pronome relativo e preserva a referência masculina ao injusto mencionado no contexto anterior.
- source_word: κατακλυζομένην γῆν
  choice: quando a terra estava sendo inundada
  rationale: Reproduz o sentido temporal e o aspecto passivo e progressivo do particípio no contexto do dilúvio.
- source_word: πάλιν διέσωσεν
  choice: tornou a salvá-la
  rationale: Conserva πάλιν e o sentido de fazer passar em segurança, tendo a terra como objeto gramatical.
- source_word: σοφία
  choice: a sabedoria
  rationale: Mantém a personificação ativa sem transformar o termo em nome próprio nem impor uma identificação teológica específica.
- source_word: δι' εὐτελοῦς ξύλου
  choice: por meio de um simples pedaço de madeira
  rationale: “Simples” comunica a modéstia ou pouca importância atribuída ao meio material, evitando que “barato” sugira má qualidade; “pedaço de madeira” preserva a formulação concreta do grego.
- source_word: τὸν δίκαιον
  choice: o justo
  rationale: É uma expressão natural em português para a forma masculina singular substantivada e preserva a alusão contextual a Noé sem inserir seu nome no texto.
- source_word: κυβερνήσασα
  choice: conduzindo
  rationale: Transmite a ação de guiar ou pilotar; no contexto da madeira e do dilúvio, a imagem náutica continua perceptível sem produzir a construção pouco natural “pilotando o justo”.
theological_decisions:
- issue: Personificação da sabedoria
  choice: “a sabedoria” como agente personificado, em minúscula
  alternative: “Sabedoria” como título ou nome quase próprio
  rationale: O grego atribui ação pessoal à sabedoria, mas não exige neste versículo uma identificação hipostática mais definida.
- issue: Referentes de “dele” e “o justo”
  choice: Manter os referentes implícitos no texto, entendendo contextualmente “dele” como o injusto anterior e “o justo” como Noé
  alternative: Inserir explicitamente os nomes de Caim e Noé
  rationale: A tradução preserva a coesão e a forma alusiva do original, sem converter identificações contextuais em conteúdo expresso.
- issue: Objeto de “salvar”
  choice: Retomar “a terra” com o pronome “-la”
  alternative: Entender que a sabedoria salvou somente “o justo”
  rationale: A construção grega apresenta γῆν como objeto de διέσωσεν e τὸν δίκαιον como objeto do particípio κυβερνήσασα; a tradução mantém essa relação sintática, apesar da tensão semântica.
translation_notes:
  register: Português moderno, claro e digno, de leitura natural no Brasil e amplamente compreensível em outras variedades. O texto conserva a personificação, a alusão narrativa e a tensão sintática do grego.
