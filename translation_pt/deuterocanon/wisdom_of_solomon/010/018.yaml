  text: He brought them across the Red Sea, and led them through abundant water;
translation:
  language: pt
  text: Ela os fez atravessar o mar Vermelho e os conduziu por muita água.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “através de águas abundantes”. A expressão grega diz literalmente “através de muita água”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεβίβασεν
  choice: fez atravessar
  rationale: 'O verbo tem sentido causativo: fazer alguém passar ou atravessar. A formulação é natural em português e mantém esse valor.'
- source_word: θάλασσαν ἐρυθράν
  choice: o mar Vermelho
  rationale: É a designação geográfica convencional ligada ao êxodo; a inicial maiúscula em “Vermelho” sinaliza o nome próprio.
- source_word: διήγαγεν
  choice: conduziu ... por
  rationale: O verbo indica levar ou guiar através de algo. “Conduziu” preserva a ideia de passagem guiada e evita repetir “atravessar”.
- source_word: διʼ ὕδατος πολλοῦ
  choice: por muita água
  rationale: Mantém o singular coletivo de ὕδατος e o sentido quantitativo de πολλοῦ, sem introduzir no texto principal o plural “águas”.
theological_decisions:
- issue: Sujeito implícito do verbo
  choice: Ela
  alternative: Ele
  rationale: O grego não repete o sujeito, mas a Sabedoria personificada continua sendo o agente no contexto imediato. O feminino torna essa continuidade explícita em português sem acrescentar uma nova personagem.
- issue: Alusão ao êxodo e nome do mar
  choice: o mar Vermelho
  alternative: o mar vermelho
  rationale: A expressão evoca diretamente a travessia do êxodo; a forma consagrada como nome geográfico comunica essa referência sem resolver questões sobre a identificação histórica do local.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo dos dois verbos gregos e conserva a referência feminina à Sabedoria personificada.
