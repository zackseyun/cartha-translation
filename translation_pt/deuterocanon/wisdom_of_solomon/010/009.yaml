  text: But wisdom rescued those who served her from hardships[a].
translation:
  language: pt
  text: Mas a sabedoria livrou das aflições[a] os que a serviram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dos trabalhos penosos», «dos sofrimentos» ou «das dores». O termo grego pode abranger esforço árduo, sofrimento e aflição em sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: sabedoria
  rationale: Traduzido como substantivo comum. O contexto personifica a sabedoria, mas o grego não exige tratá-la como nome próprio.
- source_word: θεραπεύσαντας
  choice: os que a serviram
  rationale: O particípio de θεραπεύω expressa serviço, dedicação ou cuidado devotado. Esta formulação é natural em português e preserva a ideia de lealdade à sabedoria personificada.
- source_word: αὐτήν
  choice: a
  rationale: O pronome retoma «sabedoria», substantivo feminino, e mantém naturalmente a personificação presente no grego.
- source_word: πόνων
  choice: aflições
  rationale: πόνος pode abranger trabalhos penosos, sofrimento, dor e angústia. «Aflições» comunica de modo amplo as adversidades das quais a sabedoria livra seus servidores.
- source_word: ἐρρύσατο
  choice: livrou
  rationale: O verbo indica retirar alguém de perigo, sofrimento ou dificuldade. «Livrou» é claro, digno e não acrescenta conotações teológicas além do contexto imediato.
theological_decisions:
- issue: Personificação da sabedoria
  choice: Manter «sabedoria» como substantivo comum feminino, retomado pelo pronome «a».
  alternative: Usar «Sabedoria» como nome próprio ou evitar a referência pessoal.
  rationale: O grego apresenta a sabedoria como agente personificado, mas não determina que seja um nome próprio. A redação preserva essa personificação sem identificar a figura de maneira mais específica do que o texto permite.
translation_notes:
  register: Português moderno, corrente e digno, com construção compreensível tanto no Brasil quanto em outros contextos lusófonos. A ordem «livrou das aflições os que a serviram» evita possível leitura momentânea de que as aflições seriam objeto direto e mantém fluidez.
