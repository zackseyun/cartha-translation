base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/014.yaml
  text: She went down with him into the pit[a], and in chains she did not abandon him, until she brought him the scepter of a kingdom and authority over those who had ruled him; she showed those who had slandered him to be false[b], and gave him everlasting glory.
translation:
  language: pt
  text: Ela desceu com ele à cova[a] e não o abandonou enquanto estava acorrentado, até lhe trazer cetros de realeza e autoridade sobre os que o haviam dominado. Mostrou que eram falsos os que o censuraram[b] e lhe deu glória eterna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao calabouço”; o grego diz literalmente “à cova”, termo que também pode designar uma cisterna usada como prisão.
    reason: lexical_alternative
  - marker: b
    text: Ou “provou falsos os que o censuraram”.
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκατέβη
  choice: desceu com ele
  rationale: O composto com σύν expressa descida em companhia; a formulação conserva a presença solidária da Sabedoria.
- source_word: εἰς λάκκον
  choice: à cova
  rationale: λάκκος designa literalmente uma cova ou poço e pode, no contexto, referir-se a uma prisão subterrânea; “cova” preserva a imagem concreta sem transformar a interpretação em texto.
- source_word: ἐν δεσμοῖς
  choice: enquanto estava acorrentado
  rationale: δεσμοί são correntes, grilhões ou laços. A formulação portuguesa comunica com naturalidade a condição de prisioneiro, sem sugerir que a Sabedoria estivesse presa.
- source_word: οὐκ ἀφῆκεν αὐτόν
  choice: não o abandonou
  rationale: Aqui ἀφίημι tem o sentido de deixar para trás ou desamparar; “abandonou” expressa claramente a continuidade da presença da Sabedoria.
- source_word: ἕως ἤνεγκεν αὐτῷ
  choice: até lhe trazer
  rationale: φέρω com dativo pode indicar trazer ou conferir. “Trazer” mantém a força verbal concreta e combina naturalmente com os objetos seguintes.
- source_word: σκῆπτρα βασιλείας
  choice: o cetro da realeza
  rationale: Embora σκῆπτρα esteja no plural, pode funcionar de modo coletivo para a insígnia régia. O singular idiomático em português mantém o símbolo, e “realeza” traduz βασιλεία sem limitar a referência a um reino territorial específico.
- source_word: ἐξουσίαν τυραννούντων αὐτοῦ
  choice: autoridade sobre os que o haviam dominado
  rationale: τυραννέω indica domínio tirânico ou opressivo. “Dominado” conserva a ideia de exercício de poder e a inversão de posição, sem a estranheza de “tiranizado” nem a redução a sofrimento genérico.
- source_word: ψευδεῖς ... ἔδειξεν
  choice: mostrou que eram falsos
  rationale: A construção declara falsas as pessoas em sua acusação ou alegação. A tradução conserva o predicativo pessoal do grego, em vez de substituí-lo silenciosamente por “acusações falsas”.
- source_word: τοὺς μωμησαμένους αὐτόν
  choice: os que o haviam acusado
  rationale: μωμάομαι pode significar censurar, culpar ou achar falta. “Acusado” se ajusta ao contexto de José sem especificar em excesso a modalidade verbal como calúnia.
- source_word: δόξαν αἰώνιον
  choice: glória eterna
  rationale: Equivalente corrente, digno e direto para δόξαν αἰώνιον, preservando a duração indefinida ou permanente indicada pelo adjetivo.
theological_decisions:
- issue: Identidade do sujeito feminino ao longo do versículo
  choice: Usar “Ela”, retomando a Sabedoria personificada no contexto imediato.
  alternative: Repetir explicitamente “A Sabedoria” no início do versículo.
  rationale: O contexto anterior identifica o sujeito. O pronome preserva o fluxo do grego e sua personificação feminina sem inserir uma explicação no corpo do texto.
- issue: Natureza da autoridade concedida a José
  choice: “autoridade sobre os que o haviam dominado”
  alternative: “poder sobre seus opressores”
  rationale: A escolha conserva tanto a autoridade quanto a inversão do domínio anterior, sem resolver a expressão exclusivamente em termos de opressão ou vingança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém a personificação feminina da Sabedoria e a imagem concreta da cova. A pontuação divide o período grego longo para favorecer clareza sem alterar sua progressão lógica.
