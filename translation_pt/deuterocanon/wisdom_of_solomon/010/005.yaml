base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/005.yaml
  text: She also[a], when the nations were thrown into confusion in their wicked conspiracy, found the righteous man and kept him blameless before God[c][b], and kept him strong against his compassion for his child.
translation:
  language: pt
  text: Ela também, quando as nações foram lançadas em confusão em seu perverso conluio[a], encontrou o justo[b], conservou-o irrepreensível diante de Deus e o manteve firme apesar de sua terna afeição pelo filho[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em sua perversa unanimidade” ou “em seu acordo para o mal”. A expressão descreve a união das nações em um propósito perverso.
    reason: lexical_alternative
  - marker: b
    text: Pelo contexto, “o justo” provavelmente se refere a Abraão, embora o grego não o nomeie aqui.
    reason: cross_reference
  - marker: c
    text: Ou “o manteve forte contra a compaixão pelo filho”. O grego fala das afeições íntimas ou da terna compaixão por um filho.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: Ela
  rationale: O demonstrativo feminino retoma a Sabedoria personificada no contexto; “Ela” mantém essa referência de modo natural.
- source_word: ἐν ὁμονοίᾳ πονηρίᾳ
  choice: por seu perverso conluio
  rationale: ὁμόνοια indica acordo ou união de propósito; com πονηρίᾳ, trata-se de uma união voltada ao mal. “Conluio” comunica uma ação conjunta moralmente perversa sem tornar o sentido excessivamente técnico.
- source_word: ἐθνῶν συγχυθέντων
  choice: quando as nações foram lançadas em confusão
  rationale: O genitivo absoluto expressa a circunstância, e συγχέω indica confundir ou lançar em desordem, preservando a provável alusão a Babel.
- source_word: εὗρεν τὸν δίκαιον
  choice: encontrou o justo
  rationale: Mantém o substantivo masculino singular sem inserir o nome de Abraão, que o contexto sugere, mas o grego não explicita.
- source_word: ἐτήρησεν αὐτὸν ἄμεμπτον θεῷ
  choice: conservou-o irrepreensível diante de Deus
  rationale: τηρέω tem o sentido de guardar ou conservar; ἄμεμπτος é “irrepreensível”. “Diante de Deus” expressa naturalmente o dativo relacional θεῷ.
- source_word: ἐπὶ τέκνου σπλάγχνοις
  choice: apesar de sua terna afeição pelo filho
  rationale: σπλάγχνα designa as afeições íntimas, a ternura ou compaixão. A formulação conserva a tensão entre o afeto paterno e a prova, sem acrescentar o sacrifício, que não é mencionado no versículo.
- source_word: ἰσχυρὸν ἐφύλαξεν
  choice: o manteve firme
  rationale: φυλάσσω significa guardar ou preservar, enquanto ἰσχυρός, em função predicativa, indica força ou firmeza. “Manteve firme” é idiomático e adequado ao contexto de provação.
theological_decisions:
- issue: Identificação de “o justo”
  choice: Manter “o justo” no texto principal.
  alternative: Nomeá-lo como Abraão.
  rationale: O contexto aponta para Abraão, especialmente pela referência ao filho, mas o grego usa um título descritivo e não o nome próprio.
- issue: Sentido da oração final sobre o filho
  choice: A Sabedoria o manteve firme apesar da terna afeição pelo filho.
  alternative: A Sabedoria o manteve forte contra sua compaixão pelo filho.
  rationale: A opção escolhida preserva o conflito interior sugerido por σπλάγχνα e evita dar a impressão de que a afeição paterna em si fosse condenada, sem eliminar a tensão da prova.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O texto preserva a personificação feminina da Sabedoria, a provável alusão à confusão das nações e a tensão emocional da prova do justo sem explicitar além do grego.
