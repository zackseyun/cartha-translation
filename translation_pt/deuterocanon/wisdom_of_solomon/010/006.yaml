base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/006.yaml
  text: She rescued a righteous man when the ungodly were perishing[b][a], as he fled the fire descending on the Five Cities.
translation:
  language: pt
  text: Ela resgatou um justo, ao fugir ele do fogo que descia[b] sobre as Cinco Cidades, enquanto os ímpios pereciam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a associação de cinco cidades ligada a Sodoma; o versículo alude à fuga de Ló.
    reason: cross_reference
  - marker: b
    text: 'Ou: “do fogo descendente”. O grego descreve o fogo descendo sobre as Cinco Cidades, sem dizer explicitamente que vinha “do céu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: Ela
  rationale: O demonstrativo feminino retoma a Sabedoria personificada no contexto imediato. “Ela” preserva a personificação sem repetir desnecessariamente “a Sabedoria”.
- source_word: δίκαιον
  choice: um justo
  rationale: O acusativo singular designa o homem resgatado, tradicionalmente identificado como Ló. A forma sem artigo é bem representada por “um justo”, mantendo implícita a identificação narrativa.
- source_word: ἐξαπολλυμένων
  choice: enquanto ... pereciam
  rationale: O particípio presente médio/passivo expressa a destruição em curso. “Enquanto ... pereciam” conserva o aspecto processual sem explicitar uma agência que a oração não declara.
- source_word: ἀσεβῶν
  choice: os ímpios
  rationale: ἀσεβής tem força religiosa e moral, indicando falta de reverência para com Deus. “Ímpios” é uma equivalência corrente e digna em português bíblico moderno.
- source_word: ἐρρύσατο
  choice: resgatou
  rationale: O verbo indica livramento de um perigo concreto. “Resgatou” comunica isso com clareza no cenário narrativo.
- source_word: φυγόντα
  choice: quando ele fugia
  rationale: A construção liga a fuga do justo ao seu resgate. “Quando ele fugia” produz português natural e conserva a relação circunstancial do particípio.
- source_word: πῦρ καταβάσιον
  choice: o fogo que descia
  rationale: καταβάσιος descreve algo que vai para baixo ou desce. A tradução mantém esse sentido sem acrescentar “do céu”, origem não explicitada na expressão grega.
- source_word: Πενταπόλεως
  choice: as Cinco Cidades
  rationale: O genitivo se refere à Pentápole, a associação de cinco cidades ligada a Sodoma. “Cinco Cidades” torna o referente mais transparente do que a transliteração “Pentápole”.
theological_decisions:
- issue: Referente do sujeito feminino αὕτη
  choice: O sujeito é a Sabedoria personificada, retomada por “Ela”.
  alternative: “Esta” ou repetição explícita de “a Sabedoria”.
  rationale: O discurso de Sabedoria 10 atribui sucessivos atos salvadores à Sabedoria personificada. O pronome preserva esse recurso literário e teológico sem introduzir identificações doutrinárias posteriores.
- issue: Identificação do justo e das Cinco Cidades
  choice: Manter no texto principal a alusão implícita a Ló e às cidades associadas a Sodoma.
  alternative: Nomear explicitamente Ló e Sodoma na tradução.
  rationale: O grego não menciona esses nomes neste versículo. A nota esclarece a alusão, enquanto o texto preserva a forma alusiva da fonte.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe conserva o andamento do grego sem soar artificial; “ímpios” mantém a força religioso-moral do original, e a personificação da Sabedoria permanece explícita pelo pronome feminino.
