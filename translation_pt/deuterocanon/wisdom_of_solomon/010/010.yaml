base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/010.yaml
  text: She guided the righteous man[a], a fugitive from his brother’s anger, in straight paths; she showed him the kingdom of God, and gave him knowledge of holy things; she prospered him in his labors[b], and increased the fruits of his toil.
translation:
  language: pt
  text: Ela guiou o justo, fugitivo da ira de seu irmão, por caminhos retos; mostrou-lhe o reino de Deus e lhe deu conhecimento das coisas sagradas[a]; fez com que prosperasse em seus trabalhos e multiplicou os frutos de seu esforço[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conhecimento de seres santos”. A expressão grega pode referir-se tanto a coisas sagradas quanto a pessoas ou seres santos.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “multiplicou seus trabalhos” ou “suas dores”. Aqui, o sentido provável é o aumento dos frutos ou ganhos produzidos por seu esforço, pois o contexto descreve os benefícios concedidos pela Sabedoria.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: Ela
  rationale: O demonstrativo feminino retoma a Sabedoria personificada no contexto. O pronome mantém a referência e a personificação sem repetir um substantivo ausente do versículo.
- source_word: φυγάδα ὀργῆς ἀδελφοῦ
  choice: fugitivo da ira de seu irmão
  rationale: φυγάδα designa alguém em fuga ou exílio, e o genitivo indica a causa ou origem da fuga. A formulação é natural em português e conserva a relação com o irmão.
- source_word: δίκαιον
  choice: o justo
  rationale: O adjetivo substantivado está no masculino singular e, no contexto, alude a Jacó. “O justo” é corrente, digno e fiel à forma grega.
- source_word: ὡδήγησεν ἐν τρίβοις εὐθείαις
  choice: guiou ... por caminhos retos
  rationale: Preserva tanto a ação de conduzir quanto a metáfora bíblica dos caminhos retos, em formulação idiomática portuguesa.
- source_word: βασιλείαν θεοῦ
  choice: o reino de Deus
  rationale: É a correspondência direta e tradicional da expressão grega, sem reduzir βασιλεία apenas a território ou apenas a exercício abstrato de soberania.
- source_word: γνῶσιν ἁγίων
  choice: conhecimento das coisas santas
  rationale: O genitivo plural pode referir-se a coisas santas ou a seres/pessoas santos. A leitura neutra se ajusta bem ao contexto de revelação, e a ambiguidade é registrada em nota.
- source_word: εὐπόρησεν αὐτὸν ἐν μόχθοις
  choice: fez com que prosperasse em seus trabalhos
  rationale: εὐπορέω comunica prosperidade, recursos ou êxito, enquanto μόχθοις indica trabalhos penosos. A construção evita o pouco natural “prosperou-o” e mantém o beneficiário pessoal.
- source_word: ἐπλήθυνεν τοὺς πόνους αὐτοῦ
  choice: multiplicou os frutos de seu esforço
  rationale: Embora a expressão possa ser vertida literalmente como “multiplicou seus trabalhos/dores”, o contexto descreve os benefícios concedidos pela Sabedoria. “Frutos de seu esforço” explicita o resultado produtivo do labor, e a leitura literal fica preservada em nota.
theological_decisions:
- issue: Referente do sujeito feminino personificado
  choice: Usar “Ela” para retomar a Sabedoria personificada.
  alternative: Repetir explicitamente “A Sabedoria”.
  rationale: O grego emprega um demonstrativo feminino que remete ao contexto anterior. O pronome conserva a coesão literária sem inserir no versículo um substantivo não expresso.
- issue: Sentido de γνῶσιν ἁγίων
  choice: “conhecimento das coisas santas”
  alternative: “conhecimento dos santos” ou “dos seres santos”
  rationale: A forma grega permite referente neutro ou pessoal. O texto principal adota a leitura de realidades sagradas, adequada à sequência de revelação divina, mas a alternativa genuína é mantida em nota.
- issue: Sentido de τοὺς πόνους αὐτοῦ em contexto benéfico
  choice: “os frutos de seu esforço”
  alternative: “seus trabalhos” ou “suas dores”
  rationale: A sequência apresenta a ação da Sabedoria como benéfica. A tradução principal comunica o aumento do resultado do labor sem ocultar, na nota, a formulação mais literal e sua tensão.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. Emprega “ira”, “reino de Deus” e “caminhos retos” por sua naturalidade e ressonância bíblica, evitando construções excessivamente literais ou arcaicas. As notas preservam as ambiguidades reais do grego.
