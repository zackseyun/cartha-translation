base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/017.yaml
  text: He gave the holy ones the reward of their labors[a], guided them in a marvelous way[c][b], and became for them a shelter by day and a flame of stars by night.
translation:
  language: pt
  text: Deu aos santos a recompensa por seus trabalhos[a], guiou-os por um caminho maravilhoso[b] e tornou-se para eles um abrigo durante o dia e chama de estrelas durante a noite[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a paga por suas fadigas”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por uma vereda extraordinária”.'
    reason: lexical_alternative
  - marker: c
    text: A imagem recorda a orientação e a proteção de Deus no êxodo, especialmente a nuvem durante o dia e o fogo durante a noite. A expressão “chama de estrelas” traduz literalmente a formulação condensada do grego; também pode ser entendida como “chama estrelada”.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: ἀπέδωκεν
  choice: deu
  rationale: O verbo pode significar dar, retribuir ou pagar o que é devido. “Deu”, em ligação com “recompensa”, soa natural e não acentua em excesso uma imagem comercial.
- source_word: ὁσίοις
  choice: aos santos
  rationale: Ὅσιος descreve pessoas devotadas a Deus, piedosas ou santas. “Aos santos” conserva a forma substantivada e o tom bíblico, sem identificar o grupo com uma categoria técnica posterior.
- source_word: μισθὸν κόπων αὐτῶν
  choice: a recompensa por seus trabalhos
  rationale: Μισθός pode ser salário ou recompensa, e κόπος indica trabalho árduo, esforço ou fadiga. A formulação comunica retribuição pelo labor com dignidade e clareza.
- source_word: ὡδήγησεν αὐτοὺς ἐν ὁδῷ θαυμαστῇ
  choice: guiou-os por um caminho maravilhoso
  rationale: “Guiou-os” exprime direção cuidadosa; “por um caminho maravilhoso” é português natural e preserva tanto a imagem concreta do caminho quanto seu caráter extraordinário.
- source_word: ἐγένετο αὐτοῖς εἰς σκέπην ἡμέρας
  choice: tornou-se para eles abrigo durante o dia
  rationale: Σκέπη denota cobertura, proteção ou abrigo. “Abrigo” transmite claramente a função protetora, e “durante o dia” representa o genitivo temporal.
- source_word: εἰς φλόγα ἄστρων τὴν νύκτα
  choice: chama de estrelas durante a noite
  rationale: A expressão grega é condensada e literalmente associa “chama” a “estrelas”. A tradução conserva essa imagem incomum sem substituí-la pela fórmula mais explícita da coluna de fogo.
theological_decisions:
- issue: Identidade do sujeito implícito
  choice: Manter o sujeito não expresso, como permite naturalmente o português
  alternative: Acrescentar “A Sabedoria” ou usar o pronome “Ela”
  rationale: Os verbos gregos não repetem o sujeito neste versículo; o contexto literário aponta para a Sabedoria personificada. O sujeito oculto em português preserva essa continuidade sem acrescentar uma explicação ao texto.
- issue: Alusão às tradições do êxodo
  choice: Traduzir diretamente “abrigo durante o dia” e “chama de estrelas durante a noite”
  alternative: Expandir para “coluna de nuvem durante o dia e coluna de fogo durante a noite”
  rationale: A alusão ao êxodo é forte, mas o grego não emprega aqui a fórmula tradicional completa. A tradução conserva a evocação sem inserir elementos ausentes.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com construção fluente para leitores brasileiros. O sujeito oculto é natural em português e mantém a referência contextual à Sabedoria. Preservou-se deliberadamente a imagem incomum “chama de estrelas”.
