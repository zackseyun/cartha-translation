  text: But an unrighteous man, having departed from her, perished in his brother-murdering rage.
translation:
  language: pt
  text: Mas um homem injusto, afastando-se dela, pereceu em sua fúria fratricida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄδικος
  choice: um homem injusto
  rationale: Expressa o adjetivo substantivado masculino de modo natural e mantém a caracterização moral sem identificar explicitamente Caim no texto.
- source_word: ἀποστὰς ἀπ' αὐτῆς
  choice: afastando-se dela
  rationale: Preserva o movimento de separação em relação à Sabedoria, antecedente feminino no contexto, sem explicar além do que o grego diz.
- source_word: ἀδελφοκτόνοις ... θυμοῖς
  choice: em sua fúria fratricida
  rationale: Reproduz de modo conciso a ideia de uma paixão violenta que leva à morte do irmão; 'fratricida' é corrente e dignificado.
- source_word: συναπώλετο
  choice: pereceu
  rationale: O verbo indica ruína ou perecimento; o valor de συν- não recebe aqui complemento inequívoco, por isso não se acrescenta com quem ele pereceu.
theological_decisions:
- issue: Identidade implícita do homem injusto
  choice: Não nomear Caim
  alternative: Caim, o injusto
  rationale: O contexto alude a Caim, mas o versículo grego emprega apenas o adjetivo substantivado ἄδικος; a tradução preserva a forma alusiva.
- issue: Referente feminino de 'dela'
  choice: Manter o pronome feminino sem explicitação
  alternative: afastando-se da Sabedoria
  rationale: O referente contextual é a Sabedoria, mas o original usa pronome; manter 'dela' conserva a coesão e não transforma a tradução em comentário.
- issue: Sentido de συναπώλετο
  choice: Traduzir simplesmente 'pereceu'
  alternative: pereceu juntamente com sua fúria
  rationale: A construção grega é compacta e admite tensão quanto à força do prefixo συν- e à relação com o dativo plural; evitar uma companhia explicitada preserva a ambiguidade.
translation_notes:
  register: Português moderno, claro e dignificado, com leitura natural no Brasil e compreensão internacional. A frase mantém a concisão e a alusão do grego.
