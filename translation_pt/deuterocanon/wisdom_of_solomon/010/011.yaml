  text: When others overpowered him in greed[a], she stood by him and made him rich.
translation:
  language: pt
  text: Quando outros, movidos pela ganância, o dominaram[a], ela se pôs ao lado dele e o enriqueceu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando os que agiam com ganância prevaleceram contra ele”. O particípio grego pode ser traduzido mais formalmente por “prevaleceram contra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πλεονεξίᾳ
  choice: movidos pela ganância
  rationale: πλεονεξία indica ganância ou cobiça. A expressão torna natural em português o valor circunstancial ou instrumental de ἐν, sem perder a avaliação moral do grego.
- source_word: κατισχυόντων
  choice: o dominaram
  rationale: O particípio de κατισχύω expressa prevalecer contra alguém ou sobrepujá-lo. “Dominaram” comunica de modo corrente a superioridade hostil, enquanto a nota preserva a alternativa mais formal.
- source_word: αὐτὸν
  choice: o
  rationale: O pronome masculino singular retoma a figura masculina do contexto, isto é, Jacó.
- source_word: παρέστη
  choice: se pôs ao lado dele
  rationale: παρίστημι descreve colocar-se ou permanecer ao lado de alguém, aqui com sentido de apoio. A formulação conserva a imagem espacial e sua implicação de auxílio.
- source_word: ἐπλούτισεν
  choice: o enriqueceu
  rationale: O verbo significa tornar rico ou enriquecer. “O enriqueceu” é direto, natural e mantém o sentido concreto de prosperidade concedida.
theological_decisions:
- issue: Sujeito implícito de παρέστη e ἐπλούτισεν
  choice: Explicitar “ela”, referindo-se à Sabedoria no contexto.
  alternative: Manter o sujeito implícito, como no grego.
  rationale: Embora esta oração não repita o sujeito, o discurso de Sabedoria 10 apresenta a Sabedoria personificada como agente feminino. O pronome explícito torna a frase clara em português sem introduzir uma identificação teológica além do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva a personificação feminina da Sabedoria e a imagem de ela se colocar ao lado do homem.
