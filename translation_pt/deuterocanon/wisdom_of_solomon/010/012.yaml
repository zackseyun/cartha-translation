base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/012.yaml
  text: She protected him from enemies[a], and from those lying in ambush she kept him safe; and she awarded him a strong contest[b], so that he might know that godliness is stronger than everything.
translation:
  language: pt
  text: Ela o protegeu dos inimigos e o pôs a salvo dos que lhe armavam emboscadas. Concedeu-lhe uma dura luta[a], para que ele soubesse que a devoção a Deus[b] é mais poderosa do que tudo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma luta intensa”; a expressão grega emprega linguagem de combate e também evoca a atribuição de um prêmio.
    reason: lexical_alternative
  - marker: b
    text: Ou “piedade”. O termo grego indica reverência e devoção a Deus demonstradas na maneira de viver.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεφύλαξεν
  choice: protegeu
  rationale: Expressa guardar ou preservar do perigo e se combina naturalmente com a construção introduzida por ἀπό.
- source_word: ἐχθρῶν
  choice: inimigos
  rationale: Equivalente corrente e direto para pessoas hostis.
- source_word: ἐνεδρευόντων
  choice: os que armavam emboscadas
  rationale: Preserva a imagem concreta de pessoas que preparavam uma emboscada, em vez de generalizá-la como mera conspiração.
- source_word: ἠσφαλίσατο
  choice: manteve seguro
  rationale: Comunica de modo idiomático a ideia de pôr ou conservar alguém em segurança.
- source_word: ἀγῶνα ἰσχυρὸν
  choice: um duro combate
  rationale: ἀγών abrange combate, disputa ou luta, e ἰσχυρός intensifica sua dureza; a formulação mantém a imagem sem restringi-la ao esporte.
- source_word: ἐβράβευσεν αὐτῷ
  choice: concedeu-lhe
  rationale: O verbo traz associações de arbitrar e atribuir um prêmio. Como o objeto expresso é o combate, 'concedeu-lhe' preserva a formulação tensa e incomum sem transformá-la simplesmente em vitória.
- source_word: ἵνα γνῷ
  choice: para que ele soubesse
  rationale: Reproduz com naturalidade a oração de finalidade.
- source_word: παντὸς δυνατωτέρα
  choice: mais poderosa do que tudo
  rationale: Mantém o comparativo de superioridade sobre toda e qualquer coisa.
- source_word: εὐσέβεια
  choice: devoção a Deus
  rationale: Torna acessível o sentido de reverência religiosa manifestada na vida, sem reduzir o termo a um sentimento interior.
theological_decisions:
- issue: Referente do sujeito feminino implícito
  choice: Usar 'Ela', retomando a Sabedoria personificada no contexto.
  alternative: Repetir explicitamente 'A Sabedoria'.
  rationale: O grego mantém o sujeito feminino implícito, recuperável do contexto; o pronome conserva essa continuidade literária sem acrescentar um nome ausente neste versículo.
- issue: Sentido de ἐβράβευσεν com ἀγῶνα ἰσχυρόν
  choice: Traduzir 'Concedeu-lhe um duro combate'.
  alternative: '''Deu-lhe o prêmio num duro combate'' ou ''concedeu-lhe vitória numa luta intensa''.'
  rationale: A expressão grega combina imagens de combate, arbitragem e prêmio de maneira incomum. A tradução não converte o objeto 'combate' em 'vitória', preservando a tensão de que a própria provação teve função pedagógica.
- issue: Amplitude religiosa de εὐσέβεια
  choice: Traduzir por 'devoção a Deus'.
  alternative: '''piedade'' ou ''reverência''.'
  rationale: '''Devoção a Deus'' comunica reverência religiosa vivida sem as ambiguidades modernas de ''piedade'' nem a estreiteza de ''reverência'' isoladamente.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação divide a longa coordenação grega em duas frases sem alterar sua progressão. Mantém-se a personificação feminina da Sabedoria e a metáfora deliberadamente incomum do combate concedido.
