base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/008.yaml
  text: For by passing wisdom by[a], they were harmed not only by not knowing what is good, but they also left behind for life a memorial of their folly, so that in the things in which they went astray they might not even be able to escape notice.
translation:
  language: pt
  text: Pois, ao passarem ao largo da sabedoria, não só sofreram dano por não conhecerem o que é bom, mas também deixaram à humanidade[a] um memorial de sua insensatez, para que, naquilo em que erraram, nem sequer pudessem passar despercebidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “à vida”; βίος pode referir-se amplamente à vida humana ou ao mundo dos vivos.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροδεύσαντες
  choice: ao passarem ao largo
  rationale: Preserva a imagem de passar adiante sem acolher a sabedoria e, no contexto, comunica negligência ou desprezo sem tornar explícita apenas uma dessas nuances.
- source_word: ἐβλάβησαν
  choice: sofreram dano
  rationale: Reproduz o sentido passivo de serem prejudicados e mantém aberta a natureza moral, espiritual ou prática desse dano.
- source_word: τοῦ μὴ γνῶναι τὰ καλά
  choice: por não conhecerem o que é bom
  rationale: Expressa com clareza a relação em que sofreram dano; τὰ καλά pode abranger o que é bom, nobre e correto.
- source_word: τῆς ἀφροσύνης
  choice: de sua insensatez
  rationale: Comunica falta de juízo e desatino moral em registro digno e corrente.
- source_word: ἀπέλιπον
  choice: deixaram
  rationale: Mantém o sentido básico de deixar para trás algo duradouro, sem acrescentar a formalidade jurídica de 'legaram'.
- source_word: τῷ βίῳ
  choice: à humanidade
  rationale: Neste contexto, o dativo indica aqueles entre os quais permanece o memorial; a formulação é natural em português, enquanto a nota conserva o sentido mais literal e a amplitude de βίος.
- source_word: μνημόσυνον
  choice: um memorial
  rationale: Designa algo duradouro que preserva publicamente a lembrança de sua insensatez.
- source_word: ἔσφαλησαν
  choice: erraram
  rationale: O verbo pode indicar tropeço, falha ou desvio; 'erraram' preserva a amplitude sem reduzir a ideia a um acidente físico.
- source_word: μηδὲ λαθεῖν δυνηθῶσιν
  choice: nem sequer pudessem passar despercebidos
  rationale: Traduz a impossibilidade de permanecer ocultos ou escapar à percepção em razão do memorial deixado.
theological_decisions:
- issue: Força moral de τὰ καλά
  choice: o que é bom
  alternative: o que é nobre
  rationale: A expressão tem provável peso ético; 'o que é bom' preserva essa dimensão sem impor uma leitura filosófica mais específica.
- issue: Relação entre o memorial e a exposição do erro
  choice: para que, naquilo em que erraram, nem sequer pudessem passar despercebidos
  alternative: para que nem os seus erros pudessem ficar ocultos
  rationale: A opção escolhida conserva a referência gramatical às próprias pessoas como aquelas que não conseguem passar despercebidas, sem transferi-la silenciosamente para os erros.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período conserva a estrutura argumentativa e a tensão do grego, com vocabulário digno e acessível.
