  text: She entered into the soul of a servant of the Lord[b][a], and stood against fearsome kings with wonders and signs.
translation:
  language: pt
  text: Ela entrou na alma de um servo do Senhor[a] e enfrentou reis temíveis com prodígios e sinais.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pelo contexto, entende-se que o “servo do Senhor” se refere a Moisés.
    reason: cross_reference
  - marker: b
    text: 'Ou: “por meio de prodígios e sinais”. A expressão grega pode indicar o meio empregado ou a circunstância acompanhante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: entrou
  rationale: O aoristo de εἰσέρχομαι indica entrada; “entrou” preserva de modo natural a imagem concreta da Sabedoria entrando em alguém.
- source_word: ψυχὴν
  choice: alma
  rationale: ψυχή pode significar vida ou ser interior; neste contexto de habitação da Sabedoria, “alma” conserva a força antropológica e teológica sem reduzir o termo à mente.
- source_word: θεράποντος Κυρίου
  choice: um servo do Senhor
  rationale: θεράπων designa servo ou assistente pessoal, com possível matiz de dignidade. A tradução mantém o substantivo comum do grego, sem substituir pelo nome de Moisés.
- source_word: ἀντέστη
  choice: enfrentou
  rationale: ἀνθίστημι significa pôr-se contra, resistir ou fazer frente. “Enfrentou” comunica com clareza e vigor a oposição ativa neste contexto.
- source_word: βασιλεῦσι φοβεροῖς
  choice: reis temíveis
  rationale: βασιλεῦσι refere-se especificamente a reis, e φοβεροῖς descreve aqueles que causam temor; “temíveis” evita sugerir que eles próprios estavam com medo.
- source_word: ἐν τέρασι καὶ σημείοις
  choice: com prodígios e sinais
  rationale: ἐν pode indicar meio ou circunstância acompanhante. “Prodígios e sinais” preserva a tradicional dupla linguagem bíblica e o caráter extraordinário de τέρατα.
theological_decisions:
- issue: Gênero e identidade do sujeito implícito
  choice: Usar “Ela”, em referência à Sabedoria personificada.
  alternative: Repetir explicitamente “a Sabedoria” ou usar uma forma neutra.
  rationale: O verbo grego não traz sujeito expresso neste versículo, mas o contexto mantém a Sabedoria como sujeito personificado e feminino. “Ela” preserva essa continuidade sem acrescentar um substantivo ausente.
- issue: Identidade do “servo do Senhor”
  choice: Manter a expressão comum “um servo do Senhor”.
  alternative: Traduzir diretamente como “Moisés”.
  rationale: O contexto identifica o servo como Moisés, mas o texto grego não o nomeia aqui. Mantê-lo na nota evita substituir a formulação original por uma identificação contextual.
- issue: Valor de ἐν em “ἐν τέρασι καὶ σημείοις”
  choice: Traduzir por “com”, permitindo leitura de meio ou circunstância acompanhante.
  alternative: Traduzir por “por meio de”.
  rationale: A preposição admite nuance instrumental ou associativa. A formulação principal conserva essa abertura, e a nota registra explicitamente a alternativa instrumental.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Enfrentou” é mais natural do que o decalque “pôs-se contra”, enquanto “prodígios e sinais” mantém o registro bíblico. Os marcadores seguem a ordem de ocorrência no texto.
