  text: and gave him strength to rule over all things[a].
translation:
  language: pt
  text: e lhe deu força para dominar todas as coisas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para exercer domínio sobre tudo”.'
    reason: Alternativa lexical que explicita o sentido de poder ou controle presente em κρατῆσαι.
lexical_decisions:
- source_word: ἔδωκέν τε
  choice: e lhe deu
  rationale: O verbo indica uma concessão, e τε liga a oração à anterior; a formulação é direta e natural em português.
- source_word: ἰσχὺν
  choice: força
  rationale: Preserva o sentido concreto de capacidade ou poder e combina naturalmente com o infinitivo seguinte.
- source_word: κρατῆσαι
  choice: para dominar
  rationale: O verbo exprime alcançar ou exercer controle e domínio. “Dominar” conserva essa amplitude sem acrescentar um objeto não expresso no grego.
- source_word: ἁπάντων
  choice: todas as coisas
  rationale: Mantém o alcance abrangente do genitivo plural, sem restringi-lo a criaturas ou à criação.
theological_decisions:
- issue: Alcance do domínio concedido ao primeiro homem
  choice: todas as coisas
  alternative: toda a criação
  rationale: O grego é abrangente, mas não explicita “criação”; a tradução preserva essa generalidade e a possível alusão ao domínio humano sem interpretá-la além do texto.
translation_notes:
  register: Português atual, conciso e digno, com construção facilmente compreensível no Brasil e em outras comunidades lusófonas. O pronome átono “lhe” retoma naturalmente o referente masculino do contexto.
