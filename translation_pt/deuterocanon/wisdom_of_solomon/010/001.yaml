base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/001.yaml
  text: She guarded the first-formed father of the world[a], when he alone had been created, and she delivered him from his own transgression[b],
translation:
  language: pt
  text: Ela guardou o pai do mundo, o primeiro a ser formado[a], quando ele havia sido criado sozinho, e o livrou de sua própria transgressão[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o primeiro ser humano, Adão.
    reason: cross_reference
  - marker: b
    text: Ou “de sua própria falta”; também seria possível “de sua própria queda”, embora “queda” seja mais interpretativo do que o termo grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὕτη
  choice: Ela
  rationale: O demonstrativo feminino retoma a Sabedoria personificada no contexto anterior. “Ela” preserva a referência anafórica sem inserir explicitamente o nome “Sabedoria” no versículo.
- source_word: πρωτόπλαστον
  choice: o primeiro a ser formado
  rationale: Preserva a ideia de formação contida no composto grego e sua referência ao primeiro ser humano, sem substituí-la pela noção mais genérica de criação.
- source_word: πατέρα κόσμου
  choice: pai do mundo
  rationale: Reproduz de modo direto e solene a expressão genitiva grega, que apresenta o primeiro homem como progenitor do mundo humano.
- source_word: μόνον
  choice: sozinho
  rationale: Indica a condição solitária daquele que havia sido criado, com formulação natural em português.
- source_word: κτισθέντα
  choice: quando ele foi criado
  rationale: Explicita naturalmente o valor circunstancial do particípio aoristo passivo, sem acrescentar uma relação causal ausente do grego.
- source_word: διεφύλαξεν
  choice: guardou
  rationale: Conserva o sentido de proteger e preservar cuidadosamente, além de combinar com a personificação da Sabedoria.
- source_word: ἐξείλατο
  choice: livrou
  rationale: Expressa o sentido de libertar ou resgatar em registro digno e corrente.
- source_word: παραπτώματος
  choice: transgressão
  rationale: Comunica a ideia de passo em falso ou infração moral sem impor o termo teológico posterior “queda”.
- source_word: ἰδίου
  choice: sua própria
  rationale: Mantém a ênfase do grego em que a transgressão pertencia ao próprio homem mencionado.
theological_decisions:
- issue: Identificação do “pai do mundo, o primeiro a ser formado”
  choice: Manter a identificação implícita no texto principal e esclarecer em nota que se trata de Adão.
  alternative: Inserir diretamente o nome “Adão” no texto principal.
  rationale: O grego descreve a personagem sem nomeá-la. A tradução preserva esse recurso literário e evita acrescentar ao texto um nome próprio que nele não aparece.
- issue: Sentido de παραπτώματος
  choice: transgressão
  alternative: queda
  rationale: Embora haja alusão ao pecado de Adão, “queda” seria um rótulo teológico mais interpretativo do que o substantivo grego exige. “Transgressão” preserva o caráter moral da expressão sem resolver além do texto.
