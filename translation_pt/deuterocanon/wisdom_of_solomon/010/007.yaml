base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/010/007.yaml
  text: whose wickedness still has as its witness a smoking wasteland[a], plants bearing fruit that never ripens[b], and a pillar of salt standing as a memorial of an unbelieving soul.
translation:
  language: pt
  text: Ainda dão testemunho da perversidade dela uma terra desolada que fumega, plantas que produzem frutos que nunca amadurecem e uma coluna de sal[a] que permanece erguida como memorial de uma alma incrédula.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A coluna de sal alude à mulher de Ló em Gênesis 19:26, embora este versículo não a nomeie explicitamente.
    reason: cross_reference
  - marker: b
    text: 'Ou: “de uma alma infiel”. O grego ἀπιστούσης pode indicar incredulidade ou infidelidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἧς … τῆς πονηρίας
  choice: da perversidade dela
  rationale: Preserva o vínculo genitivo do pronome relativo feminino com a realidade mencionada no contexto anterior e expressa claramente o caráter moral de πονηρία.
- source_word: ἔτι μαρτύριον … καθέστηκε
  choice: ainda dão testemunho
  rationale: Reproduz o estado duradouro expresso pelo perfeito καθέστηκε e o valor probatório de μαρτύριον; o plural em português acomoda naturalmente os três sinais coordenados.
- source_word: καπνιζομένη … χέρσος
  choice: uma terra desolada que fumega
  rationale: χέρσος designa terra estéril ou inculta, aqui devastada pelo juízo; καπνιζομένη é um particípio presente e mantém a imagem de emissão contínua de fumaça.
- source_word: ἀτελέστιοι ὥρας καρποφοροῦντα φυτά
  choice: plantas que produzem frutos que nunca amadurecem
  rationale: Comunica de modo natural a ideia de uma frutificação que não chega à maturidade ou conclusão, sem acrescentar a expressão temporal 'na estação certa', cuja presença não é segura no grego fornecido.
- source_word: ἑστηκυῖα στήλη ἁλός
  choice: uma coluna de sal que permanece erguida
  rationale: O particípio perfeito ἑστηκυῖα destaca um estado persistente; 'permanece erguida' preserva essa força e a imagem concreta.
- source_word: ἀπιστούσης ψυχῆς μνημεῖον
  choice: memorial de uma alma incrédula
  rationale: Mantém ψυχή como 'alma' e traduz ἀπιστούσης sem decidir entre incredulidade e infidelidade, alternativa registrada em nota.
theological_decisions:
- issue: Identidade da coluna de sal e da alma incrédula
  choice: Manter a descrição sem nomear a pessoa no texto principal.
  alternative: Identificá-la explicitamente como a mulher de Ló.
  rationale: A alusão a Gênesis 19:26 é clara, mas o texto grego não nomeia a figura; a tradução evita tornar explícito o que a fonte deixa implícito.
- issue: Sentido de ἀπιστούσης
  choice: incrédula
  alternative: infiel
  rationale: O termo pode indicar falta de fé, confiança ou fidelidade. 'Incrédula' é formalmente próximo, enquanto a nota preserva a alternativa legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a sequência vívida dos três sinais e evita explicitar no corpo do texto a identidade apenas aludida.
