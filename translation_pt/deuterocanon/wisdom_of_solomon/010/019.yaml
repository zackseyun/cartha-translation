  text: But he flooded their enemies[a], and from the depth of the abyss he cast them up.
translation:
  language: pt
  text: Mas inundou os inimigos deles e, do fundo do abismo, os fez subir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lançou-os para cima do fundo do abismo”. O verbo grego pode sugerir fazer algo subir, borbulhar ou ser expelido para cima; aqui, provavelmente retrata o mar fazendo os inimigos subirem das profundezas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέκλυσεν
  choice: inundou
  rationale: Expressa a ação de cobrir ou subjugar com água, preservando a imagem aquática sem explicitar que morreram.
- source_word: τοὺς ... ἐχθροὺς αὐτῶν
  choice: os inimigos deles
  rationale: Tradução direta e clara; o possessivo retoma o povo anteriormente referido.
- source_word: ἐκ βάθους ἀβύσσου
  choice: do fundo do abismo
  rationale: Reproduz naturalmente em português a ideia singular de profundidade e mantém a linguagem elevada do abismo aquático.
- source_word: ἀνέβρασεν
  choice: lançou-os para cima
  rationale: Conserva a força do verbo, que pode indicar fazer subir, borbulhar ou expelir das profundezas, sem acrescentar detalhes ausentes no grego.
theological_decisions:
- issue: Imagem do juízo no mar
  choice: Manter a sequência concreta de inundar os inimigos e lançá-los para cima desde o abismo.
  alternative: Explicitar que os inimigos foram afogados ou que seus cadáveres foram trazidos à superfície.
  rationale: O contexto evoca o juízo do êxodo, mas o grego não diz expressamente «afogou» nem «cadáveres»; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. «Inundou» preserva a imagem da água; «fundo do abismo» soa mais natural do que uma reprodução rígida de «profundidade do abismo»; a colocação pronominal em «lançou-os» mantém o registro literário.
