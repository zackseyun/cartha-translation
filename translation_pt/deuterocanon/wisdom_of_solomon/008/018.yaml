base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/018.yaml
  text: And in her friendship there is good delight[a], and in the labors of her hands, unfailing wealth, and in companionship with her, prudence, and honor in sharing her words[c][b]. I went about seeking how I might take her to myself.
translation:
  language: pt
  text: E na amizade dela há boa alegria; nos trabalhos de suas mãos, riqueza inesgotável; na prática da convivência com ela, prudência[a]; e na participação em suas palavras, boa reputação[b]. Andei por toda parte procurando um modo de tomá-la para mim[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão grega reúne as ideias de exercitar-se ou treinar junto e de conviver, associar-se ou conversar com ela; também poderia ser traduzida: “ao exercitar-se em sua companhia”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “honra” ou “renome”. O termo grego indica a estima favorável de que alguém desfruta publicamente.
    reason: lexical_alternative
  - marker: c
    text: Ou “adquiri-la para mim”. A expressão mantém a apropriação pessoal da Sabedoria personificada, sem tornar a imagem explicitamente matrimonial.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλίᾳ
  choice: amizade
  rationale: Preserva o sentido relacional específico do grego, sem tornar a imagem necessariamente romântica.
- source_word: τέρψις ἀγαθή
  choice: bom deleite
  rationale: Mantém tanto a ideia de prazer ou satisfação quanto sua qualificação positiva e moral, sem reduzi-la ao que é meramente agradável.
- source_word: πόνοις χειρῶν αὐτῆς
  choice: no trabalho de suas mãos
  rationale: Conserva a imagem concreta da atividade produtiva da Sabedoria; o singular coletivo soa natural em português.
- source_word: πλοῦτος ἀνεκλιπής
  choice: riqueza inesgotável
  rationale: Expressa com clareza uma riqueza que não se acaba nem falha.
- source_word: συγγυμνασίᾳ ὁμιλίας αὐτῆς
  choice: no exercício da convivência com ela
  rationale: Procura conservar conjuntamente as noções gregas de exercício ou disciplina compartilhada e de convivência ou associação, sem ocultar a formulação incomum.
- source_word: φρόνησις
  choice: prudência
  rationale: Comunica sabedoria prática e discernimento ético, evitando repetir o nome Sabedoria.
- source_word: εὔκλεια
  choice: boa reputação
  rationale: Representa mais diretamente a estima pública favorável indicada pelo termo grego; 'honra' continua possível.
- source_word: κοινωνίᾳ λόγων αὐτῆς
  choice: na participação em suas palavras
  rationale: Mantém a ideia de tomar parte ou ter comunhão e deixa λόγων como 'palavras', sem decidir se são conversa, ensinamentos ou discursos.
- source_word: περιῆλθον ζητῶν
  choice: andei por toda parte procurando
  rationale: Reproduz o movimento deliberado de busca expresso pelo verbo e pelo particípio.
- source_word: ὅπως λάβω αὐτὴν εἰς ἐμαυτόν
  choice: um modo de tomá-la para mim
  rationale: Preserva a apropriação pessoal da Sabedoria personificada, sem especificar que se trate de casamento, aquisição material ou interiorização.
theological_decisions:
- issue: A personificação feminina da Sabedoria
  choice: Manter a referência feminina por meio de 'dela', 'ela' e 'tomá-la'.
  alternative: Despersonalizar a Sabedoria e apresentar apenas qualidades abstratas.
  rationale: O grego sustenta de modo explícito a personificação feminina e descreve uma relação pessoal com a Sabedoria.
- issue: O sentido de 'tomá-la para mim'
  choice: Conservar a imagem pessoal sem defini-la como explicitamente matrimonial.
  alternative: Traduzir como 'desposá-la' ou, no outro extremo, apenas 'adquiri-la'.
  rationale: A linguagem pode ressoar com uma união íntima ou apropriação, mas este versículo não determina sozinho uma leitura exclusivamente matrimonial.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo marcado por ponto e vírgula. A formulação deliberadamente incomum “exercício da convivência” retém a densidade do grego e é esclarecida em nota; a personificação feminina permanece visível.
