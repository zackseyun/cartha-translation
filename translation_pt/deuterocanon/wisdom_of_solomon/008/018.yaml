  terminology: «Prudência», «riqueza inesgotável», «boa reputação» e «tomá-la para mim» são escolhas adequadas. «Boa reputação» representa bem εὔκλεια; a nota conserva alternativas legítimas. A nota sobre a expressão de convivência e exercício é útil e mantém a ambiguidade lexical do grego.
