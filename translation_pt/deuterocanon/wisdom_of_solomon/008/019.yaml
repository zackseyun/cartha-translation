base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/019.yaml
  text: I was a gifted child[a], and I received a good soul,
translation:
  language: pt
  text: Eu era uma criança de bons dotes naturais[a] e recebi uma alma boa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de boa constituição”; o adjetivo grego pode indicar qualidades naturais favoráveis de modo mais amplo, não apenas talento intelectual ou forma física.
    reason: lexical_alternative
lexical_decisions:
- source_word: παῖς
  choice: criança
  rationale: O contexto descreve a infância do falante; “criança” preserva o sentido etário sem especificar desnecessariamente gênero ou grau de maturidade.
- source_word: εὐφυής
  choice: bem-dotada por natureza
  rationale: A expressão comunica uma constituição natural favorável e qualidades inatas, sem limitar o adjetivo grego apenas à aparência física, à inteligência ou ao caráter moral.
- source_word: ψυχῆς
  choice: alma
  rationale: “Alma” preserva o peso antropológico de ψυχή e evita reduzi-lo a “vida”, “eu” ou “disposição”.
- source_word: ἔλαχον
  choice: recebi
  rationale: Embora o verbo possa evocar aquilo que cabe a alguém por sorte ou porção, “recebi” expressa de modo natural a ideia de uma qualidade concedida sem tornar a frase excessivamente literal.
- source_word: ἀγαθῆς
  choice: boa
  rationale: É a correspondência mais direta e mantém aberta a amplitude do elogio, sem restringi-lo a virtude moral, nobreza ou excelência.
theological_decisions:
- issue: Linguagem antropológica em ψυχῆς τε ἔλαχον ἀγαθῆς
  choice: manter “alma” no texto principal
  alternative: “recebi uma boa disposição” ou “coube-me uma boa vida”
  rationale: O grego emprega explicitamente ψυχή. Manter “alma” preserva a formulação e sua tensão antropológica, sem impor uma teoria específica sobre a relação entre corpo e alma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Bem-dotada por natureza” procura conservar a amplitude de εὐφυής; a nota registra uma alternativa possível. A conjunção δέ não foi vertida por um marcador discursivo artificial, e τε foi representado pela coordenação natural com “e”.
