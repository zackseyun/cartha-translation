translation:
  language: pt
  text: E, se a riqueza é uma posse desejável na vida, o que é mais rico do que a sabedoria, que realiza todas as coisas?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que produz todas as coisas» ou «que opera todas as coisas». A expressão grega é ampla e ressalta a atuação eficaz da sabedoria, sem especificar uma única modalidade de ação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῦτός
  choice: riqueza
  rationale: Preserva o sentido de abundância material e permite manter, na comparação seguinte, a ligação lexical com «mais rico».
- source_word: ἐπιθυμητὸν κτῆμα
  choice: uma posse desejável
  rationale: Traduz de modo direto tanto o valor atribuído ao bem quanto seu caráter de algo possuído ou adquirido.
- source_word: ἐν βίῳ
  choice: na vida
  rationale: Reproduz concisamente a referência à existência humana, sem acrescentar a especificação «nesta» ausente do grego.
- source_word: τί σοφίας πλουσιώτερον
  choice: o que é mais rico do que a sabedoria
  rationale: Mantém a pergunta retórica e o jogo lexical entre πλοῦτος, «riqueza», e πλουσιώτερον, «mais rico», evitando reduzi-lo apenas a «mais valioso».
- source_word: σοφίας
  choice: sabedoria
  rationale: É o equivalente usual e central no argumento do livro.
- source_word: τῆς τὰ πάντα ἐργαζομένης
  choice: que realiza todas as coisas
  rationale: O particípio feminino modifica «sabedoria». «Realiza» expressa sua atuação eficaz e soa natural em português, sem restringir o verbo à criação ou à produção.
theological_decisions:
- issue: Alcance da atividade da sabedoria em τὰ πάντα ἐργαζομένης
  choice: que realiza todas as coisas
  alternative: que produz todas as coisas; que opera todas as coisas
  rationale: A formulação conserva a abrangência da ação eficaz atribuída à sabedoria, mas não define se essa ação é criação, produção, ordenação ou cumprimento.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção conserva o paralelismo lexical entre «riqueza» e «mais rico» e mantém aberta a amplitude semântica do particípio grego.
