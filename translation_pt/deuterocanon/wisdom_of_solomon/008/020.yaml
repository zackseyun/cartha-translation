  text: Antes, sendo bom, vim[a] para um corpo imaculado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entrei em um corpo imaculado”. O verbo grego significa literalmente “vim”, mas, neste contexto, pode ser entendido como a entrada na existência corporal.'
