lexical_decisions:
- source_word: μᾶλλον δὲ
  choice: Antes
  rationale: Introduz uma correção ou reformulação mais forte em relação à afirmação anterior. “Antes” expressa essa força adversativo-progressiva de modo conciso e natural.
- source_word: ἀγαθὸς ὢν
  choice: sendo bom
  rationale: Mantém de forma direta a qualidade moral expressa por ἀγαθός, sem intensificá-la para “virtuoso” ou restringi-la a outro sentido.
- source_word: ἦλθον
  choice: vim
  rationale: Traduz literalmente o aoristo de ἔρχομαι. O contexto permite entender a vinda como entrada na existência corporal, mas o texto principal não explicita essa interpretação.
- source_word: εἰς σῶμα
  choice: para um corpo
  rationale: Preserva o movimento indicado por εἰς e a indefinição da expressão grega sem artigo. “O corpo” especificaria além do texto.
- source_word: ἀμίαντον
  choice: imaculado
  rationale: Comunica a ideia de algo não manchado ou não contaminado e conserva as conotações morais e de pureza do termo grego.
theological_decisions:
- issue: Possível implicação de preexistência ou transmigração em “vim para um corpo imaculado”
  choice: Traduzir a declaração diretamente, sem definir como o sujeito veio para o corpo.
  alternative: Interpretar explicitamente como uma alma preexistente entrando em um corpo, ou como descrição retórica de um nascimento com constituição pura.
  rationale: O grego afirma que o falante, sendo bom, veio para um corpo imaculado, mas não explica aqui a antropologia envolvida. A formulação mantém a tensão e evita impor uma leitura doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A construção deliberadamente preserva a estranheza e a ambiguidade antropológica do original.
