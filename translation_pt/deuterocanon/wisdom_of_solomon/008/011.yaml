  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/011.yaml
  text: I will be found keen in judgment[b][a], and in the sight of rulers I will be admired.
translation:
  language: pt
  text: Serei considerado perspicaz[a] no julgamento[b] e, diante dos governantes[c], serei admirado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «agudo». O adjetivo grego descreve literalmente algo afiado e, em sentido figurado, uma mente penetrante. A forma grega apresentada é plural, embora o verbo esteja no singular; a tradução segue o sentido exigido pela construção.
    reason: lexical_alternative_and_textual_anomaly
  - marker: b
    text: Ou «ao julgar» ou «num processo judicial».
    reason: lexical_alternative
  - marker: c
    text: Ou «à vista dos governantes» ou «na presença dos governantes».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀξεῖς
  choice: perspicaz
  rationale: O adjetivo exprime agudeza ou capacidade penetrante. «Perspicaz» comunica naturalmente essa qualidade intelectual no contexto de julgamento, sem recorrer ao literalismo pouco idiomático de «agudo».
- source_word: εὑρεθήσομαι
  choice: serei considerado
  rationale: O futuro passivo de εὑρίσκω pode indicar que alguém será reconhecido ou tido como possuidor de certa qualidade. «Serei considerado» preserva a voz passiva e soa natural em português.
- source_word: ἐν κρίσει
  choice: no julgamento
  rationale: κρίσις pode designar julgamento, decisão ou processo judicial. A formulação mantém a amplitude do termo sem restringi-lo a um tribunal.
- source_word: ἐν ὄψει
  choice: diante de
  rationale: A expressão significa literalmente «à vista de» e, neste contexto público, corresponde de modo natural a «diante de» ou «na presença de».
- source_word: δυναστῶν
  choice: governantes
  rationale: δυνάστης designa pessoas que detêm poder. «Governantes» é claro, atual e adequado ao contexto político.
- source_word: θαυμασθήσομαι
  choice: serei admirado
  rationale: O futuro passivo indica que o falante será objeto de admiração ou assombro. «Serei admirado» preserva a avaliação positiva e a construção passiva.
