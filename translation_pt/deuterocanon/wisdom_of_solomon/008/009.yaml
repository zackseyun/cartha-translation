base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/009.yaml
  text: So I decided to take her to live with me[a], knowing that she would be a counselor of good things for me[b], and a comfort in cares and grief.
translation:
  language: pt
  text: Por isso, decidi trazê-la para viver comigo[a], sabendo que ela seria para mim conselheira em tudo o que é bom e encorajamento[b] nas preocupações e na tristeza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tomá-la por esposa” ou “casar-me com ela”. Mais literalmente, o grego diz “trazê-la para a convivência”; a Sabedoria é personificada em linguagem relacional, mas este versículo não emprega um termo explícito para casamento.
    reason: alternative_reading
  - marker: b
    text: Ou “exortação”; no contexto, também pode ter o sentido de “consolo” ou “alento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα
  choice: decidi
  rationale: O aoristo expressa uma decisão definida; “decidi” é natural e preserva o sentido deliberativo.
- source_word: τοίνυν
  choice: Por isso
  rationale: A partícula introduz uma conclusão decorrente do contexto anterior.
- source_word: ταύτην
  choice: ela
  rationale: O pronome retoma a Sabedoria personificada no feminino.
- source_word: ἀγαγέσθαι πρὸς συμβίωσιν
  choice: trazê-la para viver comigo
  rationale: A expressão descreve a entrada numa vida compartilhada. A formulação preserva a imagem doméstica e relacional sem tornar explícito um casamento que este versículo não nomeia diretamente.
- source_word: εἰδὼς
  choice: sabendo
  rationale: Mantém de modo claro e natural o particípio causal do grego.
- source_word: ἔσται μοι σύμβουλος ἀγαθῶν
  choice: ela seria para mim conselheira quanto às coisas boas
  rationale: “Conselheira” traduz diretamente σύμβουλος, enquanto “quanto às coisas boas” conserva a amplitude do genitivo ἀγαθῶν sem restringi-lo apenas à moralidade ou à vantagem prática.
- source_word: παραίνεσις
  choice: encorajamento
  rationale: O termo pode indicar exortação, conselho ou encorajamento. Junto de preocupações e tristeza, “encorajamento” comunica naturalmente seu valor de apoio sem eliminar as alternativas lexicais.
- source_word: φροντίδων
  choice: preocupações
  rationale: O plural designa cuidados inquietantes ou ansiedades; “preocupações” é corrente e claro em português moderno.
- source_word: λύπης
  choice: tristeza
  rationale: O substantivo denota tristeza, pesar ou aflição; “tristeza” preserva o sentido afetivo amplo.
theological_decisions:
- issue: Se a linguagem de vida compartilhada deve ser traduzida como casamento explícito
  choice: trazê-la para viver comigo
  alternative: casar-me com ela / tomá-la por esposa
  rationale: O contexto mais amplo personifica a Sabedoria com imagens nupciais, mas este versículo fala literalmente em trazê-la para a convivência, sem empregar aqui um termo explícito para casamento. A tradução mantém a imagem relacional sem resolver além do que o grego afirma.
- issue: Sentido de παραίνεσις diante de preocupações e tristeza
  choice: encorajamento
  alternative: exortação / consolo
  rationale: O vocábulo admite uma nuance de exortação ou conselho, mas o contexto favorece uma função de apoio. A nota preserva a faixa semântica e evita transformar silenciosamente o termo em mero consolo emocional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem foi ajustada apenas o necessário para a fluência, mantendo a personificação feminina da Sabedoria, a imagem de vida compartilhada e a ambiguidade lexical de παραίνεσις.
