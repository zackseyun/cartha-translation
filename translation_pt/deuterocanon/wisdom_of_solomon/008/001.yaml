base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/001.yaml
  text: But she reaches mightily from one end to the other[a], and she governs all things well.
translation:
  language: pt
  text: Mas ela se estende vigorosamente de uma extremidade à outra[a] e governa bem todas as coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «alcança poderosamente de uma extremidade à outra».'
    reason: Alternativa lexical que reflete tanto o alcance expresso por διατείνει quanto a força indicada por εὐρώστως.
lexical_decisions:
- source_word: διατείνει
  choice: se estende
  rationale: Expressa o alcance contínuo da Sabedoria através de toda a extensão indicada, preservando a imagem espacial do grego sem acrescentar a ideia mais interpretativa de que ela 'permeia' tudo.
- source_word: ἀπὸ πέρατος εἰς πέρας
  choice: de uma extremidade à outra
  rationale: Reproduz com naturalidade o sentido de extensão total entre dois limites e mantém o tom elevado do texto sapiencial.
- source_word: εὐρώστως
  choice: vigorosamente
  rationale: Conserva a noção adverbial de força, robustez e eficácia. 'Poderosamente' também é possível, mas pode sugerir de modo mais direto poder soberano; 'vigorosamente' permanece próximo da imagem lexical.
- source_word: διοικεῖ
  choice: governa
  rationale: Abrange a ação de dirigir, administrar e ordenar o conjunto das coisas, sem o tom burocrático que 'administra' poderia assumir.
- source_word: τὰ πάντα
  choice: todas as coisas
  rationale: Preserva a abrangência cósmica da expressão grega e o registro bíblico-literário, sem reduzir seu alcance a um referente específico.
- source_word: χρηστῶς
  choice: bem
  rationale: Mantém aberta a amplitude do termo, que pode envolver excelência, adequação e bondade, sem restringi-lo apenas a benevolência ou amabilidade.
- source_word: δὲ
  choice: Mas
  rationale: Representa a transição com possível contraste leve marcada pela partícula, em continuidade com o versículo anterior.
- source_word: sujeito feminino implícito (a Sabedoria)
  choice: ela
  rationale: Retoma naturalmente a Sabedoria personificada no contexto e preserva o gênero feminino da apresentação grega sem repetir desnecessariamente o substantivo.
theological_decisions:
- issue: Personificação da Sabedoria
  choice: Manter o pronome pessoal feminino «ela».
  alternative: Repetir «a Sabedoria» para evitar uma personificação mais marcada.
  rationale: O contexto grego apresenta a Sabedoria como sujeito feminino que age sobre toda a criação. O pronome preserva essa figura literário-teológica sem decidir se ela deve ser entendida como hipóstase ou identificada segundo formulações doutrinárias posteriores.
- issue: Caráter do governo expresso por χρηστῶς
  choice: Traduzir de modo amplo por «bem».
  alternative: Explicitar «com bondade» ou «de modo benéfico».
  rationale: O advérbio pode incluir bondade e excelência, mas o contexto não exige que um único aspecto seja isolado. «Bem» conserva a tensão entre governo competente, adequado e benéfico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo das duas orações gregas e a personificação feminina da Sabedoria.
