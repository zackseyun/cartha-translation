  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/012.yaml
  text: When I am silent[a], they will wait for me, and when I speak, they will pay attention; and when I speak at greater length, they will lay a hand on their mouth.
translation:
  language: pt
  text: Quando eu estiver em silêncio, esperarão por mim; quando eu falar, prestarão atenção; e, quando eu falar mais longamente, porão a mão sobre a boca.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pôr a mão sobre a boca era um gesto de silêncio ou de respeito reverente diante de quem falava.
    reason: cultural_note
lexical_decisions:
- source_word: σιγῶντά με
  choice: quando eu estiver em silêncio
  rationale: O particípio presente de σιγάω, ligado a με, descreve a situação do falante enquanto os outros o aguardam. A construção temporal é natural em português e preserva o aspecto durativo.
- source_word: περιμενοῦσιν
  choice: esperarão por mim
  rationale: O verbo περιμένω indica esperar ou aguardar alguém. A forma escolhida é clara, corrente e mantém o futuro do grego.
- source_word: φθεγγομένῳ
  choice: quando eu falar
  rationale: O particípio de φθέγγομαι refere-se aqui ao ato de tomar a palavra. «Quando eu falar» evita uma formulação artificial e mantém o paralelismo do versículo.
- source_word: προσέξουσιν
  choice: prestarão atenção
  rationale: Neste contexto, προσέχω exprime atenção cuidadosa ao que é dito. A expressão portuguesa comunica esse sentido diretamente.
- source_word: λαλοῦντος ἐπὶ πλεῖον
  choice: quando eu me alongar no falar
  rationale: A expressão indica falar mais, por mais tempo ou com maior extensão. «Alongar-me no falar» preserva tanto a continuidade quanto a extensão sem introduzir a nuance condicional ausente do grego.
- source_word: χεῖρα ἐπιθήσουσιν ἐπὶ στόμα αὐτῶν
  choice: porão a mão sobre a boca
  rationale: A tradução conserva a imagem concreta do grego. O singular distributivo é natural em português e descreve cada ouvinte levando a mão à própria boca.
