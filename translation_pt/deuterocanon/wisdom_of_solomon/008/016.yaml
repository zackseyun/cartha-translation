  text: When I go into my house[a], I will find rest beside her; for her company has no bitterness, nor does living with her have pain, but gladness and joy.
translation:
  language: pt
  text: Quando eu entrar em minha casa, descansarei junto dela[a], pois a companhia dela não tem amargura, nem a vida com ela tem sofrimento, mas alegria e júbilo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “repousarei com ela”. O verbo grego sugere repouso em estreita associação com a Sabedoria.'
    reason: Alternativa lexical que preserva a amplitude de προσαναπαύσομαι e a relação expressa pelo dativo αὐτῇ.
lexical_decisions:
- source_word: εἰσελθὼν
  choice: Quando eu entrar
  rationale: O particípio aoristo estabelece a circunstância temporal da ação principal; esta formulação é natural em português e conserva o sentido de entrada anterior ao descanso.
- source_word: προσαναπαύσομαι
  choice: descansarei junto dela
  rationale: O futuro médio expressa repouso em associação com a Sabedoria. “Junto dela” preserva de modo natural a proximidade sugerida pelo verbo composto, sem excluir a alternativa “com ela”.
- source_word: συναναστροφή
  choice: a companhia dela
  rationale: O substantivo indica convivência, trato ou companhia. A escolha é clara e corrente, além de manter a distinção em relação a συμβίωσις.
- source_word: πικρίαν
  choice: amargura
  rationale: Conserva a imagem emocional de algo amargo ou desagradável e corresponde diretamente ao termo grego.
- source_word: συμβίωσις
  choice: a vida com ela
  rationale: O termo designa a vida compartilhada ou o viver em conjunto. A formulação evita o sentido moderno potencialmente restrito de “coabitação”.
- source_word: ὀδύνην
  choice: sofrimento
  rationale: Traduz o sentido amplo de dor, aflição ou sofrimento e soa natural no contraste da frase.
- source_word: εὐφροσύνην
  choice: contentamento
  rationale: Expressa alegria jubilosa ou satisfação e permanece distinto de χαρά, preservando a dupla expressão do grego.
- source_word: χαράν
  choice: alegria
  rationale: Equivalente corrente e direto, mantido ao lado de “contentamento” para conservar a plenitude retórica do original.
theological_decisions:
- issue: Personificação feminina da Sabedoria
  choice: Manter a referência feminina em “dela” e “ela”
  alternative: Repetir “a Sabedoria” ou empregar uma referência abstrata
  rationale: As formas gregas αὐτῇ e αὐτῆς são femininas e dão continuidade à personificação literária da Sabedoria. A tradução preserva essa apresentação sem identificar a figura com uma doutrina posterior específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela do grego foi preservada, repetindo “tem” para tornar explícita em português a elipse verbal da segunda oração.
