base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/002.yaml
  text: I loved her and sought her out from my youth[a], and I sought to take her as my bride, and I became a lover of her beauty.
translation:
  language: pt
  text: Eu a amei e a busquei com empenho desde a minha juventude; procurei tomá-la por esposa[a] e me tornei enamorado de sua beleza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “tomá-la como noiva para mim”.'
    reason: Registra a forma mais literal da expressão matrimonial grega e seu elemento reflexivo, enquanto o texto principal usa uma formulação portuguesa mais natural.
lexical_decisions:
- source_word: Ταύτην
  choice: a
  rationale: O pronome retoma a Sabedoria personificada como mulher. O pronome feminino preserva essa personificação com naturalidade em português.
- source_word: ἐφίλησα
  choice: amei
  rationale: No contexto, o verbo expressa amor e afeição pela Sabedoria personificada, não o ato literal de beijar.
- source_word: ἐξεζήτησα
  choice: busquei com empenho
  rationale: O verbo composto intensifica a ideia de buscar; a expressão comunica essa força sem tornar a frase artificial.
- source_word: ἐκ νεότητός μου
  choice: desde a minha juventude
  rationale: Expressa naturalmente uma busca iniciada na juventude e mantida a partir dela.
- source_word: ἐζήτησα
  choice: procurei
  rationale: Mantém perceptível a repetição da linguagem de busca presente no grego, com variação verbal natural em português.
- source_word: νύμφην ἀγαγέσθαι ἐμαυτῷ
  choice: tomá-la por esposa
  rationale: A expressão é um modo idiomático de falar em contrair matrimônio. Esta tradução preserva a imagem nupcial e comunica de modo claro o sentido reflexivo.
- source_word: ἐραστὴς
  choice: amante
  rationale: Preserva a intensidade afetiva e a imagem amorosa e nupcial do original, sem reduzi-la à mera admiração.
- source_word: τοῦ κάλλους αὐτῆς
  choice: de sua beleza
  rationale: κάλλος designa diretamente beleza, sentido adequado à personificação nupcial da Sabedoria.
theological_decisions:
- issue: Personificação da Sabedoria em linguagem matrimonial
  choice: Manter a referência feminina e as imagens de esposa e amante
  alternative: Suavizar a passagem como simples apreço abstrato pela excelência da sabedoria
  rationale: O grego apresenta explicitamente a Sabedoria como mulher e emprega linguagem de amor e matrimônio. Preservar essas imagens evita resolver ou enfraquecer a tensão poética e teológica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição semântica entre “busquei” e “procurei” reflete os dois verbos gregos relacionados, e a linguagem amorosa foi mantida sem abstração interpretativa.
