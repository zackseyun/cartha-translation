  text: For she is an initiate in the knowledge of God[a], and a chooser of his works.
translation:
  language: pt
  text: Pois ela é iniciada no conhecimento de Deus e escolhe as obras dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «aprova as obras dele». A expressão grega é incomum e pode destacar que a Sabedoria discerne e aprova aquilo que Deus faz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μύστις
  choice: iniciada
  rationale: O substantivo feminino designa alguém iniciado em mistérios ou em conhecimento reservado. «Iniciada» conserva essa ideia sem recorrer a «mística», que poderia sugerir conotações posteriores.
- source_word: ἐπιστήμης
  choice: conhecimento
  rationale: É a tradução direta e natural do termo neste contexto e preserva a construção «conhecimento de Deus».
- source_word: αἱρέτις
  choice: escolhe
  rationale: O raro substantivo feminino deriva do verbo «escolher». A formulação verbal é mais natural em português do que «escolhedora», embora a expressão grega também possa sugerir aprovação criteriosa.
- source_word: ἔργων
  choice: obras
  rationale: «Obras» mantém a amplitude do grego, podendo abranger tanto os atos quanto as realizações de Deus.
- source_word: γάρ
  choice: Pois
  rationale: Preserva a relação explicativa do versículo com a afirmação anterior.
theological_decisions:
- issue: Como traduzir μύστις num texto sapiencial com ressonâncias filosófico-religiosas
  choice: iniciada
  alternative: mística; iniciada nos mistérios do conhecimento de Deus
  rationale: A escolha expressa o acesso privilegiado da Sabedoria ao conhecimento divino, sem introduzir as associações modernas e potencialmente anacrônicas de «mística».
- issue: Como traduzir αἱρέτις τῶν ἔργων αὐτοῦ
  choice: escolhe as obras dele
  alternative: aprova as obras dele; é conhecedora das obras dele
  rationale: O grego é raro e condensado. O texto principal conserva o núcleo lexical de escolha em português natural; a nota registra a possível nuance de discernimento e aprovação, evitando resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Dele» evita a possível ambiguidade gráfica de «suas» e retoma Deus. A estrutura coordenada permanece próxima do grego, enquanto «escolhe» evita o substantivo pouco natural «escolhedora».
