  text: Her nobility is glorified by living together with God[a], and the Master of all loved her.
translation:
  language: pt
  text: Sua nobreza é glorificada pela convivência com Deus[a], e o Soberano de todos a amou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Sua nobreza é honrada pela vida compartilhada com Deus”. O termo grego συμβίωσις pode indicar convivência, companhia ou vida em comum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγένειαν
  choice: nobreza
  rationale: O termo pode indicar origem nobre, distinção ou excelência. “Nobreza” preserva essa amplitude sem limitar o sentido à linhagem aristocrática.
- source_word: δοξάζει
  choice: é glorificada
  rationale: Embora o grego empregue a voz ativa, a formulação passiva em português expressa naturalmente que a convivência com Deus confere glória à nobreza da Sabedoria.
- source_word: συμβίωσις θεοῦ ἔχουσα
  choice: pela convivência com Deus
  rationale: συμβίωσις designa vida compartilhada, convivência ou companhia. A expressão escolhida conserva a ideia concreta de comunhão de vida e oferece uma construção natural em português.
- source_word: ὁ πάντων δεσπότης
  choice: o Soberano de todos
  rationale: δεσπότης denota senhor, amo ou soberano. “Soberano” mantém a distinção em relação a κύριος e evita a conotação moderna potencialmente inadequada de “dono” ou “amo”.
- source_word: ἠγάπησεν αὐτήν
  choice: a amou
  rationale: O aoristo é vertido pelo pretérito perfeito, e o pronome feminino preserva a personificação da Sabedoria.
theological_decisions:
- issue: Personificação da Sabedoria
  choice: Manter a referência feminina em “a amou”.
  alternative: Empregar uma referência impessoal, como “isso”.
  rationale: As formas gregas femininas e o contexto apresentam a Sabedoria como figura feminina personificada, sem exigir uma identificação doutrinária posterior.
- issue: Título divino δεσπότης
  choice: Traduzir por “Soberano”.
  alternative: “Senhor” ou “Dono”.
  rationale: “Soberano” comunica autoridade absoluta, preserva a diferença lexical em relação a κύριος e soa digno e natural em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Convivência com Deus” evita a possível leitura conjugal de “viver juntos” e conserva o sentido relacional e concreto do grego.
