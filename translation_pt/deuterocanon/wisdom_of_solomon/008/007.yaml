base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/007.yaml
  text: And if anyone loves righteousness[a], her labors are virtues; for she teaches self-control and prudence, righteousness and courage[b], than which nothing is more useful for human beings in life.
translation:
  language: pt
  text: E, se alguém ama a justiça[a], os trabalhos dela são virtudes; pois ela ensina domínio próprio e prudência, justiça e coragem[b] — e nada é mais útil para os seres humanos na vida do que essas virtudes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”. A palavra grega pode indicar tanto retidão moral quanto justiça.
    reason: lexical_alternative
  - marker: b
    text: O grego diz literalmente “os trabalhos dela ... ela ensina”, preservando a personificação feminina da justiça neste versículo.
    reason: cultural_note
lexical_decisions:
- source_word: δικαιοσύνην
  choice: justiça
  rationale: Em português, “justiça” é o equivalente mais natural e abrangente neste contexto ético; pode incluir tanto retidão moral quanto justiça nas relações. A nota preserva a alternativa “retidão”.
- source_word: ἀγαπᾷ
  choice: ama
  rationale: Mantém diretamente a força pessoal e moral do verbo grego, sem reduzi-lo a mera estima ou preferência.
- source_word: οἱ πόνοι ταύτης
  choice: os trabalhos dela
  rationale: Traduz literalmente a ideia de labores e, com “dela”, preserva a referência feminina que prossegue em “ela ensina”.
- source_word: ἀρεταί
  choice: virtudes
  rationale: É a forma clara e corrente para as excelências éticas enumeradas logo em seguida.
- source_word: σωφροσύνην
  choice: domínio próprio
  rationale: Expressa em linguagem moderna a sensatez que se manifesta em moderação e controle de si.
- source_word: φρόνησιν
  choice: prudência
  rationale: Conserva o sentido de sabedoria prática e se ajusta naturalmente à lista de virtudes.
- source_word: ἀνδρείαν
  choice: coragem
  rationale: Comunica claramente a virtude da bravura ou fortaleza sem introduzir conotação masculina indevida.
- source_word: χρησιμώτερον
  choice: mais útil
  rationale: Equivalente direto e natural do comparativo grego.
- source_word: ἐν βίῳ
  choice: na vida
  rationale: Reproduz de modo conciso e idiomático a esfera indicada pela expressão grega.
- source_word: ἀνθρώποις
  choice: para os seres humanos
  rationale: Representa o sentido humano genérico do grego sem restringi-lo aos homens do sexo masculino.
theological_decisions:
- issue: Personificação feminina da justiça
  choice: Preservar “dela” e “ela ensina”
  alternative: Empregar construções impessoais, como “seus trabalhos” sem explicitar a personificação
  rationale: As formas gregas femininas mantêm a justiça personificada ao longo da frase. A tradução conserva esse traço literário sem acrescentar uma afirmação doutrinária.
- issue: Tradução de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: “Justiça” é natural em português e cobre o campo ético do termo neste catálogo de virtudes; “retidão” continua possível e é registrada em nota para preservar a amplitude lexical.
- issue: Referente do relativo ὧν na oração final
  choice: Entender que se refere às virtudes enumeradas e traduzir “do que elas”
  alternative: 'Formulação mais formal: “das quais nada é mais útil”'
  rationale: O genitivo plural relativo retoma os quatro itens da lista. A formulação escolhida preserva o sentido comparativo com maior naturalidade em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura conserva a personificação e a lista das quatro virtudes, enquanto o travessão torna natural a conclusão comparativa sem eliminar sua relação com os itens enumerados.
