base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/008.yaml
  text: And if anyone longs even for much experience[a], she knows the things of old and can infer the things to come; she understands turns of speech and solutions to riddles[b]; she knows beforehand signs and wonders and the outcomes of seasons and times.
translation:
  language: pt
  text: E, se alguém deseja até mesmo muita experiência[a], ela conhece as coisas antigas e sabe deduzir o que está por vir[b]; compreende as sutilezas da linguagem e as soluções dos enigmas; conhece de antemão sinais e prodígios e os desfechos de épocas e tempos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ampla experiência”, “vasto aprendizado” ou “grande perícia”.
    reason: lexical_alternative
  - marker: b
    text: Ou “conjecturar o que está por vir” ou “prever o futuro”. O verbo grego usado aqui é menos forte que o posterior “conhece de antemão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολυπειρίαν
  choice: ampla experiência
  rationale: O substantivo indica grande experiência ou conhecimento extenso adquirido pela experiência. “Ampla experiência” é natural em português e preserva a ideia de abrangência sem restringi-la ao aprendizado acadêmico.
- source_word: ποθεῖ
  choice: deseja
  rationale: Expressa um desejo intenso em linguagem atual e digna; evita tanto a frieza de “quer” quanto uma elevação excessiva.
- source_word: τὰ ἀρχαῖα
  choice: as coisas antigas
  rationale: Mantém a referência ampla a assuntos ou realidades de tempos passados, sem reduzi-la apenas às origens.
- source_word: τὰ μέλλοντα εἰκάζειν
  choice: sabe deduzir o que está por vir
  rationale: εἰκάζω sugere inferir ou conjecturar com base em indícios, sendo mais fraco que προγινώσκει, empregado depois. “Deduzir” preserva essa distinção.
- source_word: στροφὰς λόγων
  choice: as sutilezas da linguagem
  rationale: A expressão abrange voltas, complexidades ou recursos do discurso. A formulação escolhida comunica esse sentido de modo claro e idiomático em português.
- source_word: λύσεις αἰνιγμάτων
  choice: as soluções dos enigmas
  rationale: Reproduz com clareza a ideia de solucionar ou desvendar enigmas.
- source_word: σημεῖα καὶ τέρατα
  choice: sinais e prodígios
  rationale: É a combinação consagrada e reconhecível no português bíblico, preservando tanto o valor significativo quanto o caráter extraordinário.
- source_word: προγινώσκει
  choice: conhece de antemão
  rationale: Traduz transparentemente a ideia de saber antecipadamente e preserva sua força maior em contraste com εἰκάζειν, sem acrescentar carga doutrinária.
- source_word: ἐκβάσεις
  choice: desfechos
  rationale: Indica resultados ou desenlaces; “desfechos” se ajusta bem aos acontecimentos ligados a épocas e tempos.
- source_word: καιρῶν καὶ χρόνων
  choice: épocas e tempos
  rationale: 'Preserva dois termos temporais distintos: καιροί como ocasiões ou períodos significativos e χρόνοι como tempos em sentido mais geral.'
- source_word: οἶδεν / ἐπίσταται / προγινώσκει
  choice: conhece / compreende / conhece de antemão
  rationale: A variação conserva a progressão e a riqueza retórica dos três verbos gregos de cognição.
theological_decisions:
- issue: Personificação da Sabedoria
  choice: Manter o pronome pessoal feminino “ela”.
  alternative: Repetir “a Sabedoria” ou tratá-la como abstração sem pronome pessoal.
  rationale: O contexto imediato personifica a Sabedoria como figura feminina atuante. O pronome preserva a apresentação literária do grego sem definir sua ontologia nem impor identificações doutrinárias posteriores.
- issue: Força de εἰκάζειν
  choice: Traduzir por “sabe deduzir o que está por vir”.
  alternative: “Prevê o futuro” ou “sabe de antemão o que virá”.
  rationale: O verbo sugere inferência ou conjectura, enquanto προγινώσκει, mais adiante, expressa conhecimento antecipado mais direto. A tradução mantém essa tensão interna.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva a sequência retórica do grego; “ela” retoma a Sabedoria personificada no contexto. O marcador [b] foi colocado junto à expressão a que sua nota efetivamente se refere.
