  text: And as a young man I will have glory among crowds[a], and honor before elders,
translation:
  language: pt
  text: Embora jovem, terei glória entre as multidões[a] e honra diante dos anciãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ainda jovem, terei renome entre as multidões e estima da parte dos anciãos.” A expressão grega com ὁ νέος é condensada e pode ser entendida como “o jovem”, “como jovem” ou “embora jovem”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕξω
  choice: terei
  rationale: Futuro de ἔχω; expressa de modo direto e natural a obtenção ou posse futura.
- source_word: δόξαν
  choice: glória
  rationale: Preserva o registro elevado de δόξα e, neste contexto, seu sentido social de renome ou boa reputação.
- source_word: ἐν ὄχλοις
  choice: entre as multidões
  rationale: ὄχλοι designa multidões ou grupos numerosos; a formulação mantém o caráter público do reconhecimento.
- source_word: τιμήν
  choice: honra
  rationale: Equivalente corrente de τιμή, distinto, mas semanticamente próximo, de 'glória'.
- source_word: παρὰ πρεσβυτέροις
  choice: diante dos anciãos
  rationale: παρά com dativo pode indicar presença ou avaliação; 'diante dos anciãos' preserva essa amplitude sem definir os anciãos apenas como fonte da honra.
- source_word: ὁ νέος
  choice: embora jovem
  rationale: A expressão grega é comprimida. No contexto, identifica a condição etária do falante e sugere o contraste entre sua juventude e a honra recebida dos mais velhos.
