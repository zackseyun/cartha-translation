  text: And if understanding is effective[b][a], who among existing things is more skillful than she?
translation:
  language: pt
  text: E, se o entendimento produz resultados[a], quem, entre tudo o que existe, é artífice mais hábil do que ela?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «está em ação» ou «produz». O verbo grego pode destacar tanto a atuação eficaz como o trabalho produtivo.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: «quem, entre as coisas que existem, é mais artífice do que ela?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: φρόνησις
  choice: entendimento
  rationale: Distingue o termo de σοφία no contexto e comunica inteligência prática ou compreensão sensata em português corrente.
- source_word: ἐργάζεται
  choice: produz resultados
  rationale: Expressa a atuação eficaz e produtiva do verbo, evitando tanto o vago «trabalha» quanto uma abstração pouco natural.
- source_word: τῶν ὄντων
  choice: entre tudo o que existe
  rationale: Preserva a amplitude da expressão grega, literalmente «das coisas que são», em formulação portuguesa natural.
- source_word: μᾶλλον
  choice: mais
  rationale: Mantém o grau comparativo da pergunta retórica.
- source_word: τεχνῖτις
  choice: hábil artífice
  rationale: Comunica a ideia de alguém perito em produzir ou realizar algo. «Artífice» tem forma comum quanto ao gênero, enquanto «ela» preserva inequivocamente a personificação feminina do grego.
theological_decisions:
- issue: Personificação feminina de φρόνησις
  choice: Preservar a referência feminina com «ela».
  alternative: Empregar o neutro conceitual «isso» ou repetir «o entendimento».
  rationale: O grego usa αὐτῆς e τεχνῖτις no feminino, personificando o entendimento; neutralizar essa referência apagaria um traço explícito do texto.
- issue: Relação entre φρόνησις e σοφία no contexto
  choice: Traduzir φρόνησις por «entendimento», sem igualá-la lexicalmente a «sabedoria».
  alternative: Traduzir por «sabedoria» ou «prudência».
  rationale: A distinção vocabular do original deve permanecer, sem impor uma identificação teológica que o versículo não formula diretamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem dos marcadores segue sua ocorrência no texto. «Hábil artífice» conserva a imagem de perícia produtiva sem a construção portuguesa pouco natural «mais artífice»; a nota registra a forma literal.
