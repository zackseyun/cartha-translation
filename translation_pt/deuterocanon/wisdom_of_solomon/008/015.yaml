base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/015.yaml
  text: Fearsome tyrants will fear me when they hear[a]; among the multitude I will appear good[b], and in war courageous.
translation:
  language: pt
  text: Tiranos temíveis terão medo de mim quando ouvirem[a]; no meio da multidão, parecerei bom[b] e, na guerra, corajoso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando souberem de mim”. O grego diz literalmente apenas “quando ouvirem”, sem declarar o que será ouvido.'
    reason: ambiguity
  - marker: b
    text: 'Ou: “serei visto como nobre/benéfico”. Aqui, “bom” pode indicar bondade prática no exercício público, e não somente bondade moral em sentido abstrato.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθήσονταί με
  choice: terão medo de mim
  rationale: Expressa com naturalidade em português o futuro de φοβέω com objeto direto, preservando a ideia de que os tiranos passarão a temer o locutor.
- source_word: ἀκούσαντες
  choice: quando ouvirem
  rationale: O particípio aoristo tem valor temporal; a formulação mantém indefinido no texto principal o objeto do ouvir, como no grego.
- source_word: τύραννοι φρικτοί
  choice: tiranos temíveis
  rationale: “Tiranos” preserva a conotação autocrática de τύραννοι, e “temíveis” caracteriza os próprios tiranos como causadores de temor, conforme a concordância do adjetivo φρικτοί.
- source_word: ἐν πλήθει
  choice: no meio da multidão
  rationale: Conserva o sentido coletivo amplo de πλήθος sem restringi-lo a uma assembleia formal.
- source_word: φανούμαι ἀγαθός
  choice: parecerei bom
  rationale: Mantém a linguagem de aparência ou percepção de φαίνομαι e a amplitude semântica de ἀγαθός, sem decidir entre bondade moral, nobreza e beneficência pública.
- source_word: ἐν πολέμῳ ἀνδρεῖος
  choice: na guerra, corajoso
  rationale: “Na guerra” mantém o escopo amplo de πόλεμος, e “corajoso” comunica a valentia de ἀνδρεῖος sem a conotação de gênero que uma tradução etimológica poderia introduzir.
theological_decisions:
- issue: Virtudes públicas e militares atribuídas ao locutor
  choice: Apresentar o locutor como bom perante a multidão e corajoso na guerra, sem ampliação interpretativa.
  alternative: Explicitar aqui um retrato ideal de realeza sábia, beneficente e militarmente valente.
  rationale: O grego justapõe a percepção pública de bondade e a coragem bélica, mas não desenvolve neste versículo uma teologia política; a tradução preserva a tensão sem extrapolá-la.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição conceitual entre “temíveis” e “terão medo” reflete o jogo lexical do grego, embora suas raízes gregas não sejam idênticas. A ordem e o paralelismo das duas qualidades finais foram preservados.
