  text: Governarei povos, e nações se sujeitarão a mim;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διοικήσω
  choice: Governarei
  rationale: O futuro de διοικέω indica administrar ou governar. “Governarei” é natural no contexto de liderança política e evita tanto a dureza de “dominarei” quanto o tom burocrático de “administrarei”.
- source_word: λαούς
  choice: povos
  rationale: Preserva o plural coletivo de λαός e mantém a distinção lexical em relação a ἔθνη na oração seguinte.
- source_word: ἔθνη
  choice: nações
  rationale: No contexto político, “nações” traduz naturalmente ἔθνη sem introduzir a conotação étnico-religiosa de “gentios”.
- source_word: ὑποταγήσεταί
  choice: se sujeitarão
  rationale: Expressa a subordinação indicada pela forma futura passiva/média de ὑποτάσσω, preservando certa abertura entre submissão e sujeição sem enfatizar coerção externa.
- source_word: μοι
  choice: a mim
  rationale: Representa diretamente o dativo de relação ligado à sujeição e soa natural em português.
