  text: When I considered these things within myself and reflected in my heart that there is immortality in kinship with wisdom,[a]
translation:
  language: pt
  text: Depois de considerar essas coisas dentro de mim e de refletir em meu coração que há imortalidade na afinidade com a sabedoria,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “há imortalidade no parentesco com a sabedoria”. A expressão grega indica uma relação próxima e pode sugerir, sem afirmá-la explicitamente, uma relação causal.
    reason: alternativa lexical
lexical_decisions:
- source_word: ταῦτα λογισάμενος
  choice: Ao considerar essas coisas
  rationale: O particípio aoristo médio expressa deliberação interior. “Ao considerar” comunica esse raciocínio reflexivo em português atual e mantém a relação circunstancial aberta.
- source_word: ἐν ἐμαυτῷ
  choice: comigo mesmo
  rationale: A expressão indica reflexão interior; “comigo mesmo” é idiomático em português e evita uma formulação artificial.
- source_word: φροντίσας ἐν καρδίᾳ μου
  choice: e refletir em meu coração
  rationale: φροντίζω indica pensar atentamente. “Refletir” preserva o paralelismo introspectivo, enquanto “em meu coração” mantém a linguagem antropológica do grego.
- source_word: ὅτι ἐστιν ἀθανασία
  choice: que há imortalidade
  rationale: A construção existencial é vertida naturalmente por “há”, e ἀθανασία corresponde diretamente a “imortalidade”.
- source_word: ἐν συγγενείᾳ σοφίας
  choice: no parentesco com a sabedoria
  rationale: συγγένεια denota parentesco, afinidade ou relação próxima. “Parentesco” conserva a metáfora relacional e quase familiar do original, sem transformar a expressão em uma afirmação causal explícita.
theological_decisions:
- issue: Natureza da relação entre a imortalidade e a sabedoria em ἐν συγγενείᾳ σοφίας
  choice: há imortalidade no parentesco com a sabedoria
  alternative: a imortalidade vem por meio da afinidade com a sabedoria
  rationale: O grego emprega ἐν com um substantivo relacional, não uma fórmula causal inequívoca. A tradução principal mantém a ligação teológica entre sabedoria e imortalidade sem definir indevidamente seu mecanismo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a imagem relacional incomum do grego; a vírgula final reflete a continuidade sintática do período no contexto.
