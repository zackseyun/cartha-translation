base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/021.yaml
  text: 'But knowing that I would not otherwise be self-controlled unless God gave it—and that this also was insight[a], to know whose gift it was—I appealed to the Lord and implored him, and I said with my whole heart:'
translation:
  language: pt
  text: 'Mas, sabendo que eu não poderia ter domínio próprio se Deus não o concedesse — e que também era sinal de sabedoria reconhecer de quem vinha esse dom[a] —, recorri ao Senhor, supliquei-lhe e disse de todo o coração:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «reconhecer de quem vinha essa graça». A palavra grega pode significar «graça», «favor» ou «dom»; aqui se refere à origem divina do domínio próprio.
    reason: Alternativa lexical para χάρις e preservação de sua amplitude semântica.
lexical_decisions:
- source_word: γνοὺς
  choice: sabendo
  rationale: O particípio aoristo introduz o reconhecimento que leva à oração; «sabendo» é natural e conserva a força cognitiva.
- source_word: οὐκ ἄλλως ἔσομαι ἐγκρατής
  choice: eu não poderia ter domínio próprio
  rationale: A expressão ressalta que o autodomínio não seria possível de outra forma. «Ter domínio próprio» comunica de modo claro o controle sobre desejos e paixões.
- source_word: ἐὰν μὴ ὁ θεὸς δῷ
  choice: se Deus não o concedesse
  rationale: A condição apresenta Deus como a fonte necessária do domínio próprio; o pronome retoma essa qualidade, e «concedesse» expressa uma dádiva divina sem tornar a frase artificial.
- source_word: καὶ τοῦτο δὲ ἦν φρονήσεως
  choice: e que também era sinal de sabedoria
  rationale: A construção indica que o próprio reconhecimento demonstra discernimento. «Sinal de sabedoria» é corrente e preserva o sentido de φρόνησις como compreensão prática.
- source_word: τὸ εἰδέναι τίνος ἡ χάρις
  choice: reconhecer de quem vinha esse dom
  rationale: τίνος aponta para a fonte ou o possuidor, enquanto χάρις designa aqui o benefício concedido. A formulação esclarece a relação sem apagar a alternativa lexical «graça».
- source_word: ἐνέτυχον τῷ κυρίῳ
  choice: recorri ao Senhor
  rationale: Em contexto de oração, ἐντυγχάνω exprime dirigir-se a alguém com uma petição; «recorri» é natural em português e mantém esse sentido.
- source_word: ἐδεήθην αὐτοῦ
  choice: supliquei-lhe
  rationale: δέομαι denota pedido insistente; «supliquei-lhe» conserva a intensidade e a referência pronominal.
- source_word: ἐξ ὅλης τῆς καρδίας μου
  choice: de todo o coração
  rationale: Expressão portuguesa consagrada, natural e fiel à ideia de sinceridade e entrega total.
theological_decisions:
- issue: Sentido de χάρις no reconhecimento da origem do domínio próprio
  choice: dom
  alternative: graça; favor
  rationale: No contexto, χάρις é a dádiva proveniente de Deus, especificamente o domínio próprio. «Dom» torna concreta essa relação sem impor um sentido teológico técnico posterior; a alternativa «graça» é preservada em nota.
- issue: Tradução de κύριος na oração
  choice: Senhor
  alternative: Soberano
  rationale: «Senhor» é a equivalência bíblica usual e adequada ao tratamento divino neste contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A oração mantém o encadeamento reflexivo do grego e termina com dois-pontos, pois introduz a prece do capítulo seguinte.
