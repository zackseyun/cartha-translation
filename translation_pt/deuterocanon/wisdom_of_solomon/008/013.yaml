base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/008/013.yaml
  text: And through her I will have immortality[b][a], and I will leave behind an everlasting remembrance to those after me.
translation:
  language: pt
  text: Por meio dela[a], terei a imortalidade[b] e deixarei uma lembrança eterna aos que vierem depois de mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por ela” ou “com ela”; o pronome feminino se refere à Sabedoria personificada.
    reason: lexical_alternative
  - marker: b
    text: “Imortalidade” pode indicar tanto a ausência pessoal da morte como, em ligação com a frase seguinte, um legado que permanece; o grego deixa aberta essa relação.
    reason: alternative_reading
lexical_decisions:
- source_word: ἕξω
  choice: terei
  rationale: Futuro de ἔχω; expressa posse sem acrescentar a ideia explícita de aquisição.
- source_word: δὲ
  choice: e
  rationale: Aqui funciona como conectivo leve na sequência dos benefícios atribuídos à Sabedoria, não como contraste forte.
- source_word: αὐτὴν
  choice: por meio dela
  rationale: O pronome feminino retoma a Sabedoria personificada. A formulação comunica em português a relação instrumental ou associativa entendida no contexto, sem perder a personificação.
- source_word: ἀθανασίαν
  choice: a imortalidade
  rationale: Equivalente direto e corrente de ἀθανασία; mantém aberta a extensão literal ou figurada do termo.
- source_word: μνήμην αἰώνιον
  choice: uma lembrança eterna
  rationale: Preserva a ideia de memória duradoura sem restringi-la a um monumento ou apenas à reputação.
- source_word: τοῖς μετʼ ἐμὲ
  choice: aos que vierem depois de mim
  rationale: Expressa naturalmente o dativo e a referência às gerações posteriores.
- source_word: ἀπολείψω
  choice: deixarei
  rationale: O verbo indica deixar algo para os que vêm depois; o complemento torna desnecessário acrescentar 'para trás' em português.
theological_decisions:
- issue: Sentido de “imortalidade” em relação à Sabedoria personificada
  choice: Manter “imortalidade” sem defini-la como vida pessoal sem fim nem reduzi-la à fama póstuma.
  alternative: Entender o termo exclusivamente como imortalidade pessoal ou exclusivamente como sobrevivência na memória das gerações futuras.
  rationale: A justaposição entre imortalidade e lembrança eterna permite relação entre as ideias, mas não exige que sejam identificadas; a tradução preserva essa tensão.
- issue: Relação expressa por αὐτὴν
  choice: Traduzir contextualmente como “por meio dela”, mantendo a Sabedoria como agente ou meio associado ao benefício.
  alternative: “por ela”, “com ela” ou, de modo mais formal, “terei nela a imortalidade”.
  rationale: A construção grega é compacta e sua relação sintática não deve ser sobredefinida; a nota registra alternativas plausíveis.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem foi ajustada para soar idiomática, e as notas preservam as ambiguidades lexical e teológica do grego.
