  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os pais, assassinos de almas indefesas” ou “de vidas indefesas”. A palavra grega traduzida por “pessoas” também pode significar “almas” ou “vidas”; aqui, refere-se concretamente às vítimas vulneráveis.'
