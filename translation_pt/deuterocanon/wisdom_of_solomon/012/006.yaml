lexical_decisions:
- source_word: αὐθέντας
  choice: que assassinavam
  rationale: No contexto de sacrifício de crianças e derramamento de sangue, o termo caracteriza os pais como autores de homicídio; “assassinavam” transmite melhor essa força do que sentidos posteriores como “senhores” ou “autores”.
- source_word: γονεῖς
  choice: os pais
  rationale: O substantivo grego é inclusivo e designa pai e mãe. Em português, “os pais” é a forma corrente e inclusiva para ambos.
- source_word: ψυχῶν
  choice: pessoas
  rationale: Neste contexto, ψυχή designa concretamente seres humanos cuja vida foi tirada, e não necessariamente uma alma imaterial separada do corpo.
- source_word: ἀβοηθήτων
  choice: indefesas
  rationale: O adjetivo descreve quem não tem auxílio nem defensor; “indefesas” preserva de modo natural a vulnerabilidade das vítimas.
- source_word: ἐβουλήθης
  choice: quiseste
  rationale: A forma expressa vontade ou propósito deliberado. “Quiseste” é direta, digna e mantém o endereço a Deus na segunda pessoa.
- source_word: ἀπολέσαι
  choice: destruir
  rationale: O verbo indica levar à ruína ou à morte. “Destruir” preserva sua amplitude e se ajusta ao contexto judicial.
- source_word: διὰ χειρῶν πατέρων ἡμῶν
  choice: pelas mãos de nossos antepassados
  rationale: A expressão é instrumental. “Pelas mãos de” conserva a imagem grega, enquanto “antepassados” esclarece que πατέρων se refere aqui aos ancestrais de Israel e evita confusão com os “pais” mencionados antes.
theological_decisions:
- issue: Referente de ψυχῶν ἀβοηθήτων
  choice: pessoas indefesas
  alternative: almas indefesas; vidas indefesas
  rationale: O contexto condena sacrifícios de crianças e homicídios. “Pessoas” mantém a referência concreta às vítimas vulneráveis sem impor uma leitura posterior de dualismo entre alma e corpo; a nota registra a amplitude lexical.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A segunda pessoa singular (“quiseste”) preserva o endereço direto a Deus. “Antepassados” distingue os ancestrais de Israel dos pais homicidas mencionados na mesma frase.
