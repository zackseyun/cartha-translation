base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/017.yaml
  text: For you show your strength when your perfect power is disbelieved[b][a], and among those who know it you expose boldness.
translation:
  language: pt
  text: Pois mostras a tua força quando não se crê na plenitude do teu poder[a]; e, entre os que sabem, desmascaras a insolência[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando não confiam em ti quanto à plenitude do teu poder”. O grego é conciso e pode apontar tanto para a desconfiança dirigida a Deus como para a descrença na plenitude de seu poder.'
    reason: alternative_reading
  - marker: b
    text: “Insolência” também pode ser traduzida por “audácia” ou “ousadia arrogante”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰσχὺν
  choice: força
  rationale: Mantém o sentido de vigor ou poder efetivo e distingue ἰσχύς de δύναμις, que aparece depois no versículo.
- source_word: ἐνδείκνυσαι
  choice: mostras
  rationale: Expressa de modo claro e natural o sentido de mostrar ou demonstrar.
- source_word: ἀπιστούμενος ἐπὶ δυνάμεως τελειότητι
  choice: quando não se crê na plenitude do teu poder
  rationale: Conserva a formulação comprimida do grego e relaciona a incredulidade à plenitude do poder divino, sem especificar quem não crê.
- source_word: δυνάμεως τελειότητι
  choice: plenitude do teu poder
  rationale: Reproduz mais diretamente a ideia de perfeição, completude ou plenitude do poder do que o adjetivo simples 'perfeito'.
- source_word: ἐν τοῖς εἰδόσι
  choice: entre os que sabem
  rationale: Evita acrescentar um objeto ausente no grego e preserva a concisão e a possível ambiguidade da expressão.
- source_word: τὸ θράσος
  choice: a insolência
  rationale: No contexto de censura, θράσος tem sentido negativo de ousadia arrogante, audácia ou insolência.
- source_word: ἐξελέγχεις
  choice: desmascaras
  rationale: Comunica que Deus expõe e põe em evidência a insolência, preservando o campo semântico de revelar, convencer ou repreender.
theological_decisions:
- issue: Referente e força da oração sobre incredulidade e poder divino
  choice: A incredulidade recai sobre a plenitude do poder de Deus, ocasião em que ele mostra sua força.
  alternative: O próprio Deus não é considerado digno de confiança quanto à plenitude de seu poder.
  rationale: O particípio ἀπιστούμενος e a construção com ἐπί são compactos e admitem mais de uma articulação. O texto principal oferece uma leitura natural, enquanto a nota preserva a alternativa sem resolver indevidamente a tensão.
- issue: Objeto implícito de οἱ εἰδότες
  choice: 'Não explicitar o objeto: ''os que sabem''.'
  alternative: Entender 'os que conhecem o teu poder' ou 'os que te conhecem'.
  rationale: O grego não expressa o objeto de 'saber/conhecer'; deixá-lo implícito evita restringir a referência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção impessoal 'não se crê' evita introduzir sujeitos ausentes no original; o ponto e vírgula acompanha o paralelismo das duas ações divinas.
