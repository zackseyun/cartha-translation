base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/018.yaml
  text: But you[a], being master of strength, judge with gentleness, and with great forbearance you govern us[b]; for the power is yours whenever you will.
translation:
  language: pt
  text: Tu, porém, que tens domínio sobre a força, julgas com brandura[a] e nos governas com grande comedimento; pois o poder de agir está à tua disposição sempre que queres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com clemência”; o termo grego também pode indicar indulgência, moderação ou equidade benigna.
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “pois a capacidade de agir está presente para ti sempre que queres”; isto é, a capacidade de agir está sempre à tua disposição.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσπόζων ἰσχύος
  choice: que tens domínio sobre a força
  rationale: Preserva o valor ativo do particípio δεσπόζων e mantém ἰσχύς como “força”, sem confundi-la com a capacidade expressa por τὸ δύνασθαι no fim do versículo.
- source_word: ἐν ἐπιεικείᾳ
  choice: com brandura
  rationale: Exprime a moderação benigna e a clemência que ἐπιείκεια pode denotar, em linguagem atual e digna.
- source_word: κρίνεις
  choice: julgas
  rationale: Mantém diretamente o sentido judicial do verbo grego.
- source_word: μετὰ πολλῆς φειδοῦς
  choice: com grande comedimento
  rationale: φειδώ indica poupar, restringir-se ou agir com moderação. “Comedimento” ressalta o exercício contido da força sem ampliar o termo para “misericórdia”.
- source_word: διοικεῖς ἡμᾶς
  choice: nos governas
  rationale: Reproduz tanto a administração ou direção expressa por διοικεῖς quanto o objeto explícito “nos”.
- source_word: πάρεστιν γάρ σοι ὅταν θέλῃς τὸ δύνασθαι
  choice: pois o poder de agir está à tua disposição sempre que queres
  rationale: Torna natural em português a construção com o infinitivo substantivado τὸ δύνασθαι, preservando a ideia de uma capacidade prontamente disponível à vontade de Deus.
theological_decisions:
- issue: A força divina em contraste com a moderação no juízo
  choice: Manter lado a lado o domínio sobre a força, a brandura no julgamento e o comedimento no governo.
  alternative: Intensificar a soberania com termos mais duros ou traduzir φειδώ diretamente por “misericórdia”.
  rationale: O grego apresenta a capacidade soberana e seu exercício moderado em tensão deliberada; a tradução não transforma a brandura em fraqueza nem o comedimento em uma formulação doutrinária mais específica.
- issue: Objeto explícito ἡμᾶς
  choice: nos
  alternative: Generalizar como “todas as coisas” ou omitir o objeto.
  rationale: O texto inclui expressamente o orador e sua comunidade, e essa perspectiva deve ser preservada.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é digno sem arcaísmos; “tu” foi mantido por corresponder ao tratamento direto singular do grego. A distinção entre “força” e “poder de agir” conserva os dois campos lexicais do original.
