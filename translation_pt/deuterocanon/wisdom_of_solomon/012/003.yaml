lexical_decisions:
- source_word: καὶ γὰρ
  choice: Pois até
  rationale: “Pois” preserva a função explicativa de γάρ, enquanto “até” comunica a ênfase inclusiva de καί de modo natural em português.
- source_word: τοὺς παλαιοὺς
  choice: os antigos
  rationale: O adjetivo descreve habitantes de tempos remotos; “antigos” mantém o sentido histórico sem paráfrase excessiva.
- source_word: οἰκήτορας
  choice: habitantes
  rationale: O substantivo designa aqueles que vivem em determinado lugar. “Habitantes” é corrente, digno e não acrescenta a ideia específica de colonização.
- source_word: τῆς ἁγίας σου γῆς
  choice: da tua terra santa
  rationale: Neste contexto, γῆ indica um território específico, portanto “terra”, e não o planeta ou o mundo. A ordem “tua terra santa” soa natural e preserva tanto a santidade quanto a referência direta a Deus.
theological_decisions:
- issue: Se γῆ deve ser traduzido em sentido amplo como “mundo/terra” ou especificamente como território
  choice: terra
  alternative: mundo; solo
  rationale: A expressão se refere ao território específico de Deus na história de Israel. “Terra” preserva esse sentido geográfico sem acrescentar uma interpretação doutrinária.
