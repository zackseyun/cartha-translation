    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ πόσης ἀκριβείας
  choice: com quanto cuidado
  rationale: A expressão ressalta o caráter cuidadoso, preciso e rigoroso do julgamento divino. «Cuidado» soa natural em português e preserva a força exclamativa da construção, sem limitar ἀκρίβεια apenas a severidade.
- source_word: ἔκρινας
  choice: julgaste
  rationale: Mantém o sentido judicial e moral de κρίνω no contexto, sem reduzi-lo a simples governo ou administração.
- source_word: τοὺς υἱούς σου
  choice: os teus filhos
  rationale: Traduz diretamente a linguagem filial masculina do grego e preserva a imagem de Israel como os filhos de Deus.
- source_word: ὧν τοῖς πατράσιν
  choice: a cujos pais
  rationale: Reproduz a relação entre os filhos e seus antepassados e conserva o dativo, que indica os destinatários das garantias dadas.
- source_word: ὅρκους
  choice: juramentos
  rationale: É o equivalente direto de ὅρκους e mantém este elemento distinto das alianças mencionadas em seguida.
- source_word: συνθήκας
  choice: alianças
  rationale: No contexto bíblico, «alianças» comunica adequadamente compromissos solenes e relacionais, com maior peso do que «acordos».
- source_word: ἀγαθῶν ὑποσχέσεων
  choice: com boas promessas
  rationale: Expressa de modo natural em português que os juramentos e as alianças envolviam promessas benéficas, evitando a formulação pouco idiomática «de boas promessas».
theological_decisions:
- issue: Linguagem filial aplicada a Israel
  choice: os teus filhos
  alternative: os teus descendentes / as tuas crianças
  rationale: O substantivo grego é υἱούς, «filhos», e a formulação também preserva a relevante imagem pactual de filiação, sem impor neutralização ausente do texto.
- issue: Distinção entre os termos pactuais
  choice: juramentos e alianças
  alternative: promessas e acordos juramentados
  rationale: O grego emprega dois termos distintos. Mantê-los evita achatar a acumulação retórica que destaca a solenidade dos compromissos de Deus com os pais.
- issue: Relação de ἀγαθῶν ὑποσχέσεων com juramentos e alianças
  choice: com boas promessas
  alternative: que continham boas promessas
  rationale: «Com» preserva de maneira compacta a associação do genitivo com os dois substantivos anteriores, sem explicitar demais se as promessas constituem o conteúdo ou uma característica dos juramentos e alianças.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas de segunda pessoa singular adequadas à oração dirigida a Deus. A inicial minúscula e o ponto e vírgula refletem que o versículo continua a frase e a argumentação do contexto anterior e posterior.
