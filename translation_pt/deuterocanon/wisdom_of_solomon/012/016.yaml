base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/016.yaml
  text: For your strength is the beginning of righteousness[b][a], and your mastery over all makes you spare all.
translation:
  language: pt
  text: Pois a tua força é o princípio da justiça[a][b], e o teu domínio sobre todos faz com que poupes a todos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a fonte da justiça». O grego ἀρχή pode significar «princípio», «começo», «fonte» ou «fundamento».
    reason: lexical_alternative
  - marker: b
    text: Ou «da retidão». O grego δικαιοσύνη pode expressar tanto justiça quanto retidão.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰσχύς
  choice: força
  rationale: Expressa capacidade e poder efetivo, mantendo em português corrente a relação causal do versículo.
- source_word: ἀρχή
  choice: princípio
  rationale: É a correspondência mais direta e digna, capaz de sugerir tanto começo quanto fundamento; a alternativa «fonte» é preservada em nota.
- source_word: δικαιοσύνης
  choice: da justiça
  rationale: «Justiça» abrange aqui o caráter moralmente justo e seu exercício, e é natural no contexto do governo divino; «retidão» permanece como alternativa lexical.
- source_word: δεσπόζειν
  choice: o teu domínio sobre todos
  rationale: A construção nominal em português representa o infinitivo grego articulado e comunica soberania real sem a conotação negativa moderna de «dominar».
- source_word: φείδεσθαι
  choice: poupes
  rationale: Traduz de modo conciso o ato de preservar alguém da destruição ou do dano.
- source_word: ποιεῖ
  choice: faz com que
  rationale: Conserva a força causativa do verbo grego em uma construção portuguesa natural.
- source_word: πάντων ... πάντων
  choice: sobre todos ... a todos
  rationale: Mantém a repetição retórica e a abrangência do original sem especificar indevidamente uma classe particular de seres.
theological_decisions:
- issue: Sentido de δικαιοσύνη na declaração sobre o caráter e o governo de Deus
  choice: justiça
  alternative: retidão
  rationale: Neste contexto, o termo inclui tanto a qualidade moral de Deus quanto seu exercício justo do poder. «Justiça» é idiomático e preserva essa dimensão governamental, enquanto «retidão» é registrada como alternativa legítima.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição «todos ... todos» reproduz a ênfase do grego, e «faz com que» mantém a relação causal sem tornar a frase artificial.
