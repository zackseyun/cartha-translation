  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/023.yaml
  text: Therefore you also tormented[a], through their own abominations, those unrighteous men who had lived in the folly of life.
translation:
  language: pt
  text: Por isso, também atormentaste[a], por meio de suas próprias abominações, os injustos que tinham vivido na insensatez da vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio de suas próprias práticas detestáveis”. O termo grego pode designar, de modo amplo, coisas abomináveis, incluindo atos ou objetos idolátricos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Por isso
  rationale: Introduz uma conclusão baseada no argumento anterior e soa natural no português atual.
- source_word: καὶ
  choice: também
  rationale: Preserva o valor adverbial que relaciona esta ação divina ao contexto precedente.
- source_word: τοὺς ... ἀδίκους
  choice: os injustos
  rationale: O adjetivo substantivado designa pessoas caracterizadas pela injustiça; a forma portuguesa é direta e não acrescenta uma referência masculina ausente da expressão grega.
- source_word: ἐν ἀφροσύνῃ ζωῆς
  choice: na insensatez da vida
  rationale: Mantém a expressão compacta e algo marcada do grego, sem reduzir ζωῆς explicitamente a 'modo de viver'.
- source_word: βιώσαντας
  choice: que tinham vivido
  rationale: Expressa de modo idiomático o particípio aoristo e sua relação anterior com o verbo principal.
- source_word: διὰ τῶν ἰδίων ... βδελυγμάτων
  choice: por meio das próprias abominações deles
  rationale: διά com genitivo indica meio ou instrumento; 'abominações' preserva a amplitude de βδελύγματα e o efeito de retribuição correspondente.
- source_word: ἐβασάνισας
  choice: atormentaste
  rationale: Conserva a intensidade de βασανίζω no contexto de juízo e a segunda pessoa singular dirigida a Deus.
theological_decisions:
- issue: Natureza da retribuição divina em διὰ τῶν ἰδίων βδελυγμάτων
  choice: Deus os atormentou por meio de abominações que eram deles próprios.
  alternative: Deus os puniu por causa das abominações deles, ou mediante criaturas, objetos ou práticas especificamente ligados a elas.
  rationale: A construção grega favorece instrumentalidade, mas não identifica com precisão quais coisas ou práticas serviram de instrumento; a tradução preserva essa tensão sem especificar o mecanismo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe portuguesa, preservando a formulação compacta e a ambiguidade do original.
