base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/020.yaml
  text: For if you honored with such great care and forbearance the enemies of your children[a], even those deserving death, giving them time and opportunity by which they might be freed from wickedness,
translation:
  language: pt
  text: Pois, se honraste com tão grande cuidado e tolerância[a] os inimigos de teus filhos, mesmo os que mereciam a morte, dando-lhes tempo e oportunidade para que, por meio deles, fossem libertos da maldade,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com tão grande atenção e súplica”. Os termos gregos significam literalmente atenção ou cuidado e súplica ou rogo.'
    reason: Alternativa lexical para a expressão προσοχῆς καὶ δεήσεως, cuja formulação literal é incomum quando aplicada à ação de Deus.
lexical_decisions:
- source_word: ἐχθροὺς
  choice: inimigos
  rationale: Equivalente corrente para adversários hostis e adequado ao contraste do contexto.
- source_word: παίδων σου
  choice: de teus filhos
  rationale: παῖς pode significar filho, criança ou servo; “filhos” preserva aqui a relação familiar com Deus sem restringir o termo ao sexo masculino.
- source_word: ὀφειλομένους θανάτῳ
  choice: embora merecessem a morte
  rationale: Expressa de modo natural a responsabilidade ou sujeição judicial à morte indicada pelo particípio, deixando clara sua relação concessiva com o tratamento recebido.
- source_word: ἐτίμησας
  choice: honraste
  rationale: Preserva o sentido lexical forte de τιμάω, ainda que a ideia de honrar inimigos produza uma tensão deliberada, explicada pelo modo cuidadoso de Deus agir.
- source_word: μετὰ τοσαύτης προσοχῆς καὶ δεήσεως
  choice: com tão grande cuidado e tolerância
  rationale: “Cuidado” traduz προσοχή; “tolerância” comunica no contexto a contenção misericordiosa associada a δέησις, enquanto a tradução mais literal é registrada em nota.
- source_word: δοὺς χρόνους καὶ τόπον
  choice: dando-lhes tempo e oportunidade
  rationale: Traduz idiomaticamente o plural χρόνοι e o sentido figurado de τόπος como espaço ou ocasião para mudança.
- source_word: διʼ ὧν ἀπαλλαγῶσι
  choice: para se libertarem
  rationale: Formulação natural em português para o valor instrumental-final da expressão e para a libertação indicada pelo subjuntivo passivo.
- source_word: τῆς κακίας
  choice: da maldade
  rationale: κακία designa aqui o mal moral; “maldade” é claro e corrente em português.
theological_decisions:
- issue: Sentido de δέησις na descrição do modo como Deus tratou os ímpios
  choice: tolerância
  alternative: súplica ou rogo
  rationale: A tradução contextual ressalta a contenção misericordiosa e a demora do juízo, sem afirmar de modo inequívoco que Deus suplicava aos condenados. Como o termo grego normalmente denota súplica, essa possibilidade permanece explícita na nota.
- issue: Força de ἐτίμησας aplicada aos inimigos
  choice: honraste
  alternative: trataste com consideração
  rationale: Mantém o valor lexical de τιμάω e a tensão retórica do original, em vez de enfraquecê-lo silenciosamente para uma paráfrase mais previsível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com a oração dirigida a Deus. Conserva-se a oração incompleta e a vírgula final, pois o raciocínio prossegue no versículo seguinte.
