  verdict: revise
  source_fidelity: A tradução preserva bem a estrutura condicional em continuação, os inimigos dos filhos de Deus, a responsabilidade pela morte, e a concessão de tempo e oportunidade. Contudo, «se libertarem» torna ativo/reflexivo o subjuntivo passivo ἀπαλλαγῶσι; o grego diz que eles poderiam ser libertos da maldade. A relação instrumental de διʼ ὧν também deve permanecer explícita, na medida do possível.
  naturalness: O português é moderno, claro e de registro apropriado. «Mesmo os que mereciam a morte» reproduz mais diretamente a aposição grega do que a subordinada concessiva «embora merecessem a morte». A vírgula final deve ser mantida, pois a oração continua no versículo seguinte.
  terminology: «Inimigos», «filhos», «honraste», «cuidado», «tempo e oportunidade» e «maldade» são adequados. «Tolerância» é uma contextualização interpretativa de δεήσεως, cujo sentido literal é súplica/rogo; a nota mantém essa alternativa e, portanto, evita ocultá-la.
