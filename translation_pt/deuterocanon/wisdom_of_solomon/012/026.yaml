  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/026.yaml
  text: But those who were not instructed by childish punishments will experience a judgment worthy of God[a][b].
translation:
  language: pt
  text: Mas os que não foram admoestados por repreensões em tom de brincadeira experimentarão um julgamento digno de Deus[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «por castigos infantis» ou «por medidas de correção quase lúdicas». A expressão grega παιγνίοις ἐπιτιμήσεως é compacta e pode salientar o caráter comparativamente leve, quase lúdico ou infantilizado, das repreensões anteriores.
    reason: lexical_alternative
  - marker: b
    text: Ou «provarão um julgamento digno de Deus», isto é, virão a conhecê-lo ao passar por ele. A expressão também pode ser entendida como «o julgamento de Deus» ou «um julgamento vindo de Deus».
    reason: lexical_and_theological_alternative
lexical_decisions:
- source_word: παιγνίοις
  choice: próprios para crianças
  rationale: O termo pode sugerir algo infantil, lúdico ou relativamente leve. No contexto, caracteriza as correções anteriores como medidas menores, semelhantes às aplicadas a crianças, sem as tratar como simples brinquedos.
- source_word: ἐπιτιμήσεως
  choice: castigos
  rationale: Embora o substantivo possa significar repreensão ou censura, o contexto descreve medidas divinas de correção que culminam em julgamento; «castigos» comunica sua dimensão concreta e disciplinar.
- source_word: νουθετηθέντες
  choice: foram corrigidos
  rationale: O particípio passivo expressa admoestação ou instrução corretiva. «Foram corrigidos» preserva a finalidade pedagógica dos castigos e soa natural em português.
- source_word: ἀξίαν
  choice: digno de
  rationale: Mantém o sentido de algo condizente, apropriado ou à altura de alguém, sem reduzir a expressão à ideia de castigo meramente merecido.
- source_word: θεοῦ κρίσιν
  choice: um julgamento digno de Deus
  rationale: A construção, especialmente com ἀξίαν, sugere um julgamento condizente com Deus. O artigo indefinido preserva o caráter anartro de κρίσιν, sem excluir outras relações possíveis do genitivo.
- source_word: πειράσουσιν
  choice: experimentarão
  rationale: O verbo significa literalmente provar ou pôr à prova; aqui indica conhecer o julgamento ao passar por ele. «Experimentarão» conserva essa nuance sem sugerir que as pessoas estejam avaliando Deus.
theological_decisions:
- issue: Sentido de θεοῦ em ἀξίαν θεοῦ κρίσιν
  choice: «um julgamento digno de Deus», entendendo o genitivo principalmente como qualitativo
  alternative: «o julgamento de Deus» ou «um julgamento vindo de Deus»
  rationale: A posição de ἀξίαν favorece a ideia de um julgamento condizente com Deus, mas o grego é compacto e permite também perceber posse ou origem; a nota registra essa tensão sem a eliminar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Castigos próprios para crianças» evita a ambiguidade indesejada de «castigos infantis», que poderia sugerir castigos imaturos, e conserva a comparação implícita no grego. As notas preservam tanto a compressão lexical de παιγνίοις ἐπιτιμήσεως quanto a ambiguidade de θεοῦ e πειράσουσιν.
