base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/027.yaml
  text: For in the very things by which they themselves suffered and were indignant—those things they thought were gods—by these[a], while being punished, they saw and recognized as the true God the one whom they had formerly refused to know. Therefore also the final end of condemnation came upon them.
translation:
  language: pt
  text: Pois, pelas mesmas coisas pelas quais eles próprios sofriam e se indignavam — aquelas que julgavam ser deuses —, sendo castigados por elas, viram e reconheceram como o Deus verdadeiro aquele que antes se recusavam a conhecer.[a] Por isso, também lhes sobreveio o fim da condenação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vieram a conhecer verdadeiramente o Deus que antes negavam conhecer”. O grego permite entender ἀληθῆ como advérbio (“verdadeiramente”), em vez de adjetivo (“verdadeiro”).'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφʼ οἷς
  choice: pelas quais
  rationale: Mantém a relação entre as coisas que lhes causavam sofrimento e os mesmos elementos por meio dos quais eram castigados, sem restringir indevidamente o valor da preposição.
- source_word: πάσχοντες ἠγανάκτουν
  choice: sofriam e contra as quais se indignavam
  rationale: Expressa tanto a aflição quanto a forte reação de irritação ou revolta, em português natural e digno.
- source_word: οὓς ἐδόκουν θεούς
  choice: que julgavam ser deuses
  rationale: Preserva a avaliação subjetiva e equivocada dos idólatras, bem como a ironia do contexto.
- source_word: ἐν αὐτοῖς κολαζόμενοι
  choice: ao serem castigados por aquelas mesmas coisas
  rationale: 'Torna claro o provável sentido instrumental: o castigo lhes vinha mediante as próprias coisas que consideravam deuses.'
- source_word: ὧν πάλαι ἠρνοῦντο εἰδέναι θεὸν
  choice: aquele que antes se recusavam a conhecer
  rationale: Conserva o valor temporal de πάλαι e a recusa deliberada indicada por ἠρνοῦντο, evitando uma formulação portuguesa excessivamente literal.
- source_word: ἐπέγνωσαν ἀληθῆ
  choice: reconheceram como o Deus verdadeiro
  rationale: ἐπιγινώσκω indica reconhecimento pleno, e a leitura adjetiva de ἀληθῆ se ajusta ao contraste contextual entre os falsos deuses e Deus; a possível leitura adverbial é preservada em nota.
- source_word: τὸ τέρμα τῆς καταδίκης
  choice: o desfecho final da condenação
  rationale: Traduz τέρμα como ponto terminal ou resultado derradeiro e καταδίκη como condenação, preservando a força culminante da expressão em português compreensível.
- source_word: ἐπʼ αὐτοὺς ἐπῆλθεν
  choice: lhes sobreveio
  rationale: Equivalente idiomático e solene para a chegada do juízo sobre eles.
theological_decisions:
- issue: Relação de ἀληθῆ com θεὸν em ἰδόντες ... θεὸν ἐπέγνωσαν ἀληθῆ
  choice: reconheceram como o Deus verdadeiro aquele que antes se recusavam a conhecer
  alternative: vieram a conhecer verdadeiramente o Deus que antes negavam conhecer
  rationale: A posição de ἀληθῆ permite entendê-lo como adjetivo, em contraste com as coisas falsamente tidas por deuses, ou adverbialmente, qualificando o ato de conhecer. A tradução principal adota a leitura contextual mais forte, enquanto a nota conserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A ordem da primeira oração foi reorganizada para tornar perceptível a ligação retórica entre os objetos tidos por deuses, o sofrimento e o castigo, sem eliminar a repetição enfática de “aquelas mesmas coisas”.
