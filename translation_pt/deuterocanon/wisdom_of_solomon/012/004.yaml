translation:
  language: pt
  text: por os teres odiado por praticarem as obras mais detestáveis — feitiçarias[a] e ritos profanos[b] —,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “artes mágicas”. O termo grego também pode referir-se ao uso de poções ou venenos em certos contextos.
    reason: lexical_alternative
  - marker: b
    text: Ou “cerimônias ímpias” ou “ritos de iniciação”. O termo grego pode designar observâncias cultuais, inclusive iniciatórias.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισήσας
  choice: por os teres odiado
  rationale: O particípio aoristo retoma o sujeito divino e depende da oração anterior. A construção mantém essa ligação participial, sem acrescentar um segundo objeto como “coisas que odiavas”.
- source_word: ἐπὶ τῷ ... πράσσειν
  choice: devido às ... que praticavam
  rationale: A construção expressa a razão do ódio. A forma portuguesa explicita naturalmente a relação causal e atribui as práticas aos antigos habitantes mencionados no contexto.
- source_word: ἔχθιστα
  choice: extremamente detestáveis
  rationale: Preserva a força superlativa do termo grego em português atual e natural.
- source_word: ἔργα
  choice: obras
  rationale: Equivalente direto que conserva o peso moral e concreto do substantivo grego.
- source_word: φαρμακειῶν
  choice: feitiçarias
  rationale: No contexto de práticas religiosas condenadas, designa de modo amplo atividades mágicas, sem limitar o sentido ao uso de poções ou venenos.
- source_word: τελετὰς
  choice: ritos
  rationale: Termo abrangente para observâncias cultuais, que podem incluir cerimônias de iniciação sem necessariamente especificá-las.
- source_word: ἀνοσίους
  choice: profanos
  rationale: Expressa aquilo que viola a santidade ou a piedade e combina naturalmente com “ritos”.
theological_decisions:
- issue: Relação e referente de μισήσας
  choice: O particípio refere-se a Deus e expressa, em ligação com a oração anterior, que ele odiou os antigos habitantes por causa das práticas deles.
  alternative: 'Entender o particípio como se qualificasse diretamente as obras: “coisas que odiavas”.'
  rationale: A sintaxe grega liga μισήσας ao sujeito divino do contexto precedente, enquanto ἐπὶ τῷ ... πράσσειν apresenta a causa. A tradução evita acrescentar ao versículo a frase interpretativa “coisas que odiavas”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação preserva a dependência sintática do fragmento em relação ao versículo anterior; por isso começa com minúscula e termina com vírgula.
