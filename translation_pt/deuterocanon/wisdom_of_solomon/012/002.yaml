base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/002.yaml
  text: Therefore you rebuke those who fall away little by little[a], and by reminding them of the things in which they sin you warn them, so that, having been set free from wickedness, they may put faith in you, Lord.
translation:
  language: pt
  text: Por isso, repreendes pouco a pouco[a] os que se desviam e, lembrando-lhes aquilo em que pecam, os admoestas, para que, libertos da maldade, creiam em ti[b], Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “repreendes os que pouco a pouco se desviam”. A expressão grega pode indicar que a repreensão ocorre gradualmente ou que o desvio acontece pouco a pouco.'
    reason: ambiguidade sintática
  - marker: b
    text: 'Ou: “confiem em ti”. A expressão grega indica fé ou confiança dirigida a Deus.'
    reason: nuance lexical
lexical_decisions:
- source_word: διό
  choice: Por isso
  rationale: Expressa de modo natural a conclusão ou inferência que liga o versículo ao argumento anterior.
- source_word: τοὺς παραπίπτοντας
  choice: os que se desviam
  rationale: παραπίπτω indica afastamento ou desvio moral; esta formulação preserva esse sentido sem restringi-lo a um tropeço isolado.
- source_word: κατʼ ὀλίγον
  choice: pouco a pouco
  rationale: A locução pode indicar gradualidade ou medida. Pela posição e pelo contexto da correção paciente de Deus, foi ligada a ἐλέγχεις, mantendo-se em nota a outra vinculação sintática possível.
- source_word: ἐλέγχεις
  choice: repreendes
  rationale: O verbo comunica a exposição corretiva do erro. “Repreendes” mantém a força disciplinar e distingue este verbo de νουθετεῖς.
- source_word: ἐν οἷς ἁμαρτάνουσιν
  choice: aquilo em que pecam
  rationale: Conserva a referência aos pontos ou atos concretos nos quais as pessoas pecam.
- source_word: ὑπομιμνήσκων
  choice: lembrando-lhes
  rationale: Traduz o particípio como meio pelo qual se realiza a admoestação.
- source_word: νουθετεῖς
  choice: os admoestas
  rationale: νουθετέω designa advertência ou instrução moral voltada à correção; “admoestas” preserva essa combinação.
- source_word: ἵνα
  choice: para que
  rationale: Introduz claramente a finalidade da ação divina.
- source_word: ἀπαλλαγέντες
  choice: libertos
  rationale: Preserva de maneira concisa a força passiva do particípio e a ideia de livramento de uma condição moral.
- source_word: τῆς κακίας
  choice: da maldade
  rationale: κακία tem aqui sentido ético amplo; “maldade” é corrente e não a reduz a mera intenção maliciosa.
- source_word: πιστεύσωσιν ἐπὶ σέ
  choice: creiam em ti
  rationale: A construção com ἐπί e acusativo dirige a fé ou confiança para Deus. “Creiam em ti” é natural em português e conserva o vocabulário de fé, enquanto “confiem em ti” explicita uma nuance legítima.
- source_word: Κύριε
  choice: Senhor
  rationale: Mantém o vocativo dirigido a Deus sem acrescentar uma interjeição ausente do grego.
theological_decisions:
- issue: Sentido de πιστεύσωσιν ἐπὶ σέ
  choice: creiam em ti
  alternative: confiem em ti
  rationale: A expressão pode ser formulada em termos de fé ou confiança dirigida a Deus. O texto principal conserva a linguagem tradicional e natural de crer, e a nota preserva explicitamente a nuance de confiança.
- issue: Relação sintática de κατʼ ὀλίγον
  choice: 'ligado à repreensão: “repreendes pouco a pouco”'
  alternative: 'ligado aos que se desviam: “os que pouco a pouco se desviam”'
  rationale: A sintaxe admite as duas relações. O contexto favorece a correção divina gradual e medida, mas a alternativa não deve ser eliminada silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para fluência sem apagar a ambiguidade sintática do grego; “repreendes” e “admoestas” mantêm distintos os dois verbos corretivos.
