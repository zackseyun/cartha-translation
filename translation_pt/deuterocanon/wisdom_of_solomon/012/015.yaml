base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/015.yaml
  text: But being righteous[a], you govern all things righteously[b], considering it foreign to your power to condemn one who does not deserve to be punished.
translation:
  language: pt
  text: Mas, sendo justo, governas todas as coisas com justiça e consideras alheio ao teu poder[a] condenar aquele que não deve ser punido.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estranho ao teu poder” ou “incompatível com o teu poder”.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “aquele que não deve ser punido”; a expressão também pode significar “aquele que não está sujeito a punição”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιος … δικαίως
  choice: justo … com justiça
  rationale: Preserva em português a repetição cognata do grego e liga explicitamente o caráter justo de Deus à maneira como ele governa.
- source_word: τὰ πάντα διέπεις
  choice: governas todas as coisas
  rationale: Expressa a abrangência de τὰ πάντα e o sentido de direção e administração ordenada de διέπεις, sem restringi-lo a mero domínio.
- source_word: καταδικάσαι
  choice: condenar
  rationale: Mantém a força judicial do verbo grego, que indica proferir condenação.
- source_word: αὐτὸν τὸν μὴ ὀφείλοντα κολασθῆναι
  choice: aquele que não deve ser punido
  rationale: Reproduz de modo natural a ideia grega de não estar obrigado, sujeito ou passível de punição, sem definir além do texto a base dessa não sujeição.
- source_word: ἀλλότριον
  choice: alheio
  rationale: Preserva a metáfora de algo estranho, não pertencente ou impróprio ao poder de Deus; evita substituí-la no texto principal por uma interpretação mais explícita.
- source_word: τῆς σῆς δυνάμεως
  choice: ao teu poder
  rationale: δύναμις designa aqui o poder divino em sentido amplo; “poder” evita estreitar o termo a mera autoridade jurídica.
theological_decisions:
- issue: Relação entre o poder e a justiça de Deus
  choice: A condenação de quem não deve ser punido é apresentada como alheia ao poder de Deus.
  alternative: Entender a expressão apenas como algo indigno da posição divina ou traduzir δύναμις estritamente como “autoridade”.
  rationale: O grego une o caráter justo de Deus, seu governo justo e a rejeição da condenação indevida. A formulação conserva essa relação sem resolver a tensão mediante categorias doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo “justo … com justiça” conserva o efeito retórico do grego; “alheio ao teu poder” mantém sua imagem deliberadamente incomum.
