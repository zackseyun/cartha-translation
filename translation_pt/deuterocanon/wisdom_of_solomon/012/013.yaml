base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/013.yaml
  text: For there is no god besides you who cares for all[a], so that you should show that you did not judge unjustly[b];
translation:
  language: pt
  text: Pois não há deus além de ti, que cuida de todos[a], para que demonstres que não julgaste injustamente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de tudo”. O grego pode se referir a todos ou a todas as coisas.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não julgaste injustamente”; o sentido também pode ser expresso como “julgaste com justiça”.
    reason: alternative_reading
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: Pois não há
  rationale: γάρ introduz a explicação, bem expressa por “Pois”; οὔτε com a construção existencial negativa é vertido naturalmente como “não há”.
- source_word: θεός ... πλὴν σοῦ
  choice: deus além de ti
  rationale: A expressão exclui qualquer outra divindade. “Além de ti” traduz com naturalidade πλήν com o genitivo, e a minúscula preserva o sentido categorial de “nenhum deus”.
- source_word: ᾧ μέλει περὶ πάντων
  choice: que cuida de todos
  rationale: A construção impessoal grega é expressa de modo pessoal e natural em português. “Todos” mantém a abrangência de πάντων, embora o grego também permita a compreensão “todas as coisas”.
- source_word: ἵνα δείξῃς
  choice: para que demonstres
  rationale: Mantém a construção final com ἵνα e o subjuntivo, sem reduzir a frase a um simples infinitivo.
- source_word: οὐκ ἀδίκως ἔκρινας
  choice: não julgaste injustamente
  rationale: Conserva a formulação negativa e a linguagem judicial do grego, em vez de convertê-la na afirmação positiva “julgaste com justiça”.
theological_decisions:
- issue: Exclusividade divina em θεός ... πλὴν σοῦ
  choice: não há deus além de ti
  alternative: não há Deus além de ti
  rationale: A minúscula apresenta “deus” como a categoria negada a qualquer outro, enquanto “ti” identifica o único Deus verdadeiro; isso preserva a forma da afirmação exclusiva sem introduzir uma distinção ausente no grego.
- issue: Forma negativa de οὐκ ἀδίκως
  choice: não julgaste injustamente
  alternative: julgaste com justiça
  rationale: O original formula a afirmação por negação. Preservar essa forma mantém sua tensão retórica e evita explicitar mais do que o texto diz.
- issue: Abrangência de πάντων
  choice: todos
  alternative: todas as coisas
  rationale: O genitivo plural grego pode ter referência pessoal ou neutra. O texto principal usa a formulação portuguesa mais concisa, e a nota registra a amplitude possível.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe acompanha de perto o encadeamento grego, mas evita rigidez desnecessária.
