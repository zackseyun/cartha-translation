base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/022.yaml
  text: So, while disciplining us, you scourge our enemies by the ten thousands, so that when we judge we may reflect on your goodness, and when we are judged we may expect mercy.
translation:
  language: pt
  text: Assim, ao nos disciplinares, açoitas os nossos inimigos com incontáveis golpes[a], para que, ao julgarmos, tenhamos em mente a tua bondade e, ao sermos julgados, esperemos misericórdia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos milhares”. A expressão grega ressalta uma quantidade imensa ou a grande severidade dos golpes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύων
  choice: ao nos disciplinares
  rationale: Preserva o sentido de correção com finalidade educativa, e não de simples punição, além de manter a relação participial com a ação dirigida aos inimigos.
- source_word: ἐν μυριότητι μαστιγοῖς
  choice: açoitas ... com incontáveis golpes
  rationale: Expressa de modo natural em português a imensa quantidade ou intensidade dos açoites indicada pela construção grega, sem transformar a miríade em um número exato.
- source_word: μεριμνῶμεν
  choice: tenhamos em mente
  rationale: No contexto, o verbo indica consideração atenta pela bondade divina ao julgar; esta formulação evita a ideia inadequada de ansiedade.
- source_word: κρίνοντες
  choice: ao julgarmos
  rationale: Reproduz naturalmente o valor circunstancial, provavelmente temporal, do particípio ativo.
- source_word: κρινόμενοι
  choice: ao sermos julgados
  rationale: Mantém o paralelismo e o contraste entre julgar ativamente e ser julgado.
- source_word: προσδοκῶμεν ἔλεος
  choice: esperemos misericórdia
  rationale: Conserva a noção de expectativa ou espera, sem convertê-la em certeza absoluta.
- source_word: ἀγαθότητα
  choice: bondade
  rationale: Abrange tanto a qualidade moral quanto a benevolência divina e se ajusta ao registro do versículo.
theological_decisions:
- issue: Relação entre a disciplina aplicada a “nós” e os açoites aplicados aos inimigos
  choice: Deus disciplina o seu povo e açoita os inimigos com muito maior severidade.
  alternative: Entender os incontáveis açoites como dirigidos também a “nós”.
  rationale: A sintaxe grega toma naturalmente ἡμᾶς como objeto de παιδεύων e τοὺς ἐχθροὺς ἡμῶν como objeto de μαστιγοῖς, mantendo o contraste contextual entre disciplina corretiva e punição severa.
- issue: Sentido de μεριμνῶμεν em relação à bondade divina
  choice: A bondade de Deus deve ser levada em conta quando se julga.
  alternative: Expressar preocupação ou cuidado pela bondade de Deus.
  rationale: “Tenhamos em mente” comunica consideração moral atenta sem sugerir ansiedade nem resolver além do necessário a relação entre bondade divina e julgamento humano.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. A construção paralela “ao julgarmos / ao sermos julgados” preserva a forma e a tensão do grego; “disciplinares” mantém o caráter corretivo e educativo de παιδεύων.
