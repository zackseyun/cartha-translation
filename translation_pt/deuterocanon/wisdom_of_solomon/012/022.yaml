  source_fidelity: 'O texto traduz corretamente a estrutura central do grego: Deus disciplina «nós» e açoita «os nossos inimigos» com uma quantidade ou severidade imensa de golpes. «Ao nos disciplinares» preserva adequadamente o valor corretivo de παιδεύων; «ao julgarmos / ao sermos julgados» mantém o contraste participial; e «esperemos misericórdia» comunica apropriadamente προσδοκῶμεν ἔλεος sem introduzir certeza indevida.'
