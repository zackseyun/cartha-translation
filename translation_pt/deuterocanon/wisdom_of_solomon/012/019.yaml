base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/019.yaml
  text: But by such deeds you taught your people that the righteous must be humane[a], and you made your children full of good hope[b], because you grant repentance for sins.
translation:
  language: pt
  text: Mas, por meio de tais atos, ensinaste ao teu povo que o justo deve ser bondoso para com as pessoas[a]; e tornaste teus filhos cheios de boa esperança, porque concedes arrependimento pelos pecados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deve amar os seres humanos” ou “deve ser amigo da humanidade”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão grega também pode ser entendida como “concedes arrependimento depois dos pecados” ou “com respeito aos pecados”.
    reason: source_ambiguity
lexical_decisions:
- source_word: διὰ τῶν τοιούτων ἔργων
  choice: por meio de tais atos
  rationale: διά com genitivo tem sentido instrumental, e ἔργων se refere às ações divinas descritas no contexto. “Atos” é concreto e natural em português.
- source_word: δεῖ τὸν δίκαιον εἶναι
  choice: o justo deve ser
  rationale: Mantém o singular substantivado representativo de τὸν δίκαιον e expressa com clareza a necessidade moral indicada por δεῖ.
- source_word: φιλάνθρωπον
  choice: bondoso para com as pessoas
  rationale: Expressa a benevolência dirigida aos seres humanos, sentido central de φιλάνθρωπος, sem restringi-la especificamente à misericórdia.
- source_word: εὐέλπιδας ἐποίησας
  choice: tornaste ... cheios de boa esperança
  rationale: Preserva a construção causativa e a nuance positiva enfática de εὐέλπιδας, em vez de reduzi-la simplesmente a “esperançosos”.
- source_word: τοὺς υἱούς σου
  choice: teus filhos
  rationale: “Filhos” corresponde naturalmente ao masculino plural υἱούς e conserva a linguagem filial do texto.
- source_word: διδοῖς ἐπὶ ἁμαρτήμασιν μετάνοιαν
  choice: concedes arrependimento pelos pecados
  rationale: “Concedes” preserva a iniciativa divina expressa por διδοῖς; “pelos pecados” mantém a relação ampla entre μετάνοια e ἁμαρτήματα sem acrescentar uma formulação doutrinária posterior.
theological_decisions:
- issue: Masculino singular representativo em τὸν δίκαιον
  choice: o justo
  alternative: a pessoa justa
  rationale: “O justo” é natural em português bíblico moderno e conserva a forma singular masculina e seu valor representativo sem acrescentar “homem” ao texto.
- issue: Linguagem filial em τοὺς υἱούς σου
  choice: teus filhos
  alternative: teus filhos e filhas / teus descendentes
  rationale: O grego diz literalmente “teus filhos”; a tradução preserva essa forma, que em português também pode ter referência coletiva conforme o contexto.
- issue: Ação divina e μετάνοια
  choice: concedes arrependimento
  alternative: dás oportunidade de arrependimento
  rationale: A formulação mantém a iniciativa divina sem decidir se o dom é o próprio arrependimento ou a possibilidade de arrepender-se, tensão que o contexto pode comportar.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas verbais tradicionais coerentes com o tratamento singular de Deus (“ensinaste”, “tornaste”, “concedes”). A redação evita tecnicismos e preserva o paralelismo e a tensão teológica do grego.
