base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/010.yaml
  text: But in judging them little by little[a], you were giving room for repentance, not being unaware that their origin was evil and their wickedness innate, and that their way of thinking would never change forever[b],
translation:
  language: pt
  text: Mas, julgando-os pouco a pouco, davas espaço ao arrependimento[a], pois sabias que a origem deles era má[b], que a maldade deles era inata e que a maneira de pensar deles jamais mudaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “davas oportunidade para o arrependimento” ou “concedias tempo para o arrependimento”. O grego diz literalmente “davas lugar/espaço ao arrependimento”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a geração deles era má” ou “a linhagem deles era má”. O termo grego γένεσις pode indicar origem, nascimento ou linhagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνων δὲ κατὰ βραχύ
  choice: Mas, julgando-os pouco a pouco
  rationale: Mantém a ligação participial de κρίνων e traduz κατὰ βραχύ pelo sentido gradual e progressivo, sem definir excessivamente a relação como apenas temporal ou concessiva.
- source_word: ἐδίδους τόπον μετανοίας
  choice: davas espaço ao arrependimento
  rationale: Preserva a metáfora de τόπος, literalmente “lugar/espaço”, e expressa de modo natural a oportunidade concedida para o arrependimento.
- source_word: οὐκ ἀγνοῶν
  choice: sem desconheceres
  rationale: Conserva a formulação negativa e a ideia de plena ciência, com concordância natural com o sujeito divino na segunda pessoa.
- source_word: πονηρὰ ἦ γένεσις αὐτῶν
  choice: a origem deles era má
  rationale: “Origem” abrange os possíveis sentidos de γένεσις — nascimento, origem ou linhagem — sem impor uma interpretação biológica ou doutrinária mais estreita.
- source_word: ἔμφυτος ἡ κακία αὐτῶν
  choice: a maldade deles era inata
  rationale: “Inata” comunica a força de ἔμφυτος, aquilo que está enraizado ou presente desde o nascimento, sem acrescentar uma teoria sobre culpa herdada.
- source_word: ὁ λογισμὸς αὐτῶν
  choice: sua maneira de pensar
  rationale: A expressão portuguesa transmite o sentido disposicional de λογισμός, que pode designar pensamento, raciocínio, propósito ou mentalidade.
- source_word: οὐ μὴ ἀλλαγῇ ... εἰς τὸν αἰῶνα
  choice: jamais mudaria
  rationale: “Jamais” reúne de modo idiomático a negação enfática οὐ μή e a permanência expressa por εἰς τὸν αἰῶνα, evitando a redundância pouco natural de “nunca mudaria para sempre”.
theological_decisions:
- issue: Se o texto deve ser formulado como afirmação de incapacidade metafísica absoluta para o arrependimento
  choice: Manter a forte afirmação sobre uma maldade inata e uma maneira de pensar que jamais mudaria, sem desenvolver uma teoria filosófica ou doutrinária além do que o versículo declara.
  alternative: Suavizar para uma mera inclinação ao mal, ou intensificar para uma doutrina explícita de natureza culpada desde o nascimento e incapacidade metafísica.
  rationale: O grego sustenta simultaneamente a oportunidade de arrependimento e a afirmação severa de que o pensamento deles jamais mudaria. A tradução preserva essa tensão em vez de resolvê-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A segunda pessoa singular “davas” preserva o discurso dirigido a Deus; “sem desconheceres” evita uma construção impessoal e mantém o tom solene sem arcaísmo excessivo.
