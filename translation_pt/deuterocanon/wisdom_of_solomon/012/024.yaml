base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/024.yaml
  text: For they wandered even farther in the ways of error[a], supposing as gods even the dishonored creatures among the animals of their enemies[b], having been deceived like foolish infants.
translation:
  language: pt
  text: Pois eles se desviaram ainda mais pelos caminhos do erro[a], considerando deuses até mesmo os seres desonrados dentre os animais de seus inimigos[b], enganados como crianças insensatas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram levados ainda mais para o erro”. O grego pode enfatizar tanto o próprio desvio deles quanto o fato de terem sido desencaminhados.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “considerando deuses até mesmo os animais desonrados de seus inimigos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν πλάνης ὁδῶν
  choice: pelos caminhos do erro
  rationale: Preserva a metáfora dos caminhos e traduz πλάνη como erro, adequado ao contexto de juízo equivocado e idolatria.
- source_word: μακρότερον ἐπλανήθησαν
  choice: se desviaram ainda mais
  rationale: O comparativo μακρότερον intensifica ἐπλανήθησαν. A expressão portuguesa é natural e mantém a ideia de afastamento progressivo, embora o grego também possa sugerir que foram levados mais longe no engano.
- source_word: θεοὺς ὑπολαμβάνοντες
  choice: considerando deuses
  rationale: ὑπολαμβάνω expressa aqui tomar ou considerar algo como sendo deuses; a formulação mantém o juízo equivocado sem tornar o português excessivamente literal.
- source_word: τὰ ... ἄτιμα
  choice: os seres desprezados
  rationale: ἄτιμα designa aquilo que é sem honra, desonrado ou desprezado. 'Seres' acomoda o neutro plural e sua referência aos animais sem acrescentar uma espécie não expressa.
- source_word: ἐν ζῴοις τῶν ἐχθρῶν
  choice: entre os animais de seus inimigos
  rationale: Mantém tanto a relação marcada pelo genitivo quanto ἐν, evitando reduzir a expressão simplesmente a 'os animais de seus inimigos'.
- source_word: νηπίων δίκην ἀφρόνων
  choice: como crianças insensatas
  rationale: 'Traduz de modo conciso o símile: νήπιοι são crianças pequenas, enquanto ἄφρονες comunica falta de entendimento ou sensatez.'
- source_word: ψευσθέντες
  choice: enganados
  rationale: O particípio aoristo passivo indica que foram enganados ou iludidos. A forma reduzida é idiomática em português e conserva a relação circunstancial com a oração principal.
theological_decisions:
- issue: Avaliação moral e religiosa da idolatria
  choice: Manter a linguagem negativa de 'erro', 'desprezados', 'insensatas' e 'enganados'.
  alternative: Abrandar com termos como 'equívoco', 'humildes' ou 'inexperientes'.
  rationale: O grego caracteriza explicitamente essa idolatria como desvio, atribuição de honra divina ao que carece de honra e engano insensato; suavizar isso apagaria a crítica teológica do texto.
- issue: Agência no desvio
  choice: Usar 'se desviaram' no texto e registrar em nota a possível ênfase passiva.
  alternative: Traduzir diretamente como 'foram levados ainda mais para o erro'.
  rationale: A forma ἐπλανήθησαν pode ser entendida como desvio próprio ou como ser desencaminhado. O texto principal conserva a imagem reflexiva natural em português, e a nota preserva a ambiguidade.
translation_notes:
  register: Português moderno, corrente e digno, com leitura natural no Brasil e compreensão internacional. 'Insensatas' preserva a censura de ἀφρόνων sem recorrer a linguagem infantilizada; 'seres desprezados entre os animais' mantém a estrutura e a relativa indeterminação do grego.
