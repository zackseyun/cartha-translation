  text: For your imperishable Spirit is in all things[a].
translation:
  language: pt
  text: Pois o teu Espírito imperecível está em todas as coisas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o teu espírito imperecível está em tudo». O grego também permite essa formulação mais concisa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφθαρτόν
  choice: imperecível
  rationale: Expressa aquilo que não está sujeito à deterioração ou corrupção, em português atual e digno.
- source_word: πνεῦμά
  choice: Espírito
  rationale: O possessivo «teu» e o contexto apontam para o Espírito de Deus; a inicial maiúscula sinaliza a referência divina sem definir além do texto sua natureza pessoal.
- source_word: ἐν πᾶσιν
  choice: em todas as coisas
  rationale: Torna explícito o provável sentido neutro plural e preserva a abrangência universal, sem restringi-la apenas às pessoas.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa ou causal da conjunção, ligando o versículo ao que o precede.
theological_decisions:
- issue: Referência e uso de maiúscula em πνεῦμά σου
  choice: teu Espírito
  alternative: teu espírito
  rationale: A formulação indica a presença sustentadora de Deus em todas as coisas. A maiúscula favorece a referência divina, enquanto a nota preserva a possibilidade de uma leitura menos pessoal ou mais próxima de «sopro/espírito» divino.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Pois» conserva a ligação argumentativa com o contexto anterior; «imperecível» evita o tom mais técnico ou arcaizante de «incorruptível».
