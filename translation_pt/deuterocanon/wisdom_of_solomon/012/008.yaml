base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/008.yaml
  text: But even these[a], since they were human beings, you spared, and you sent hornets ahead as forerunners of your army, so that they might destroy them little by little[c][b];
translation:
  language: pt
  text: Mas até mesmo estes, por serem seres humanos[a], tu os poupaste e enviaste vespas[b] como precursoras do teu exército[c], para que os exterminassem pouco a pouco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como seres humanos”. O grego destaca a condição humana deles como consideração pela qual Deus os poupou.'
    reason: lexical_alternative
  - marker: b
    text: As “vespas” retomam o motivo bíblico de Deus enviar insetos que picam à frente de Israel contra povos inimigos; compare Êxodo 23:28; Deuteronômio 7:20; Josué 24:12.
    reason: cross_reference
  - marker: c
    text: 'Ou: “do teu acampamento”. O termo grego pode designar tanto um acampamento como um exército ou força militar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ τούτων
  choice: Mas até mesmo estes
  rationale: Preserva tanto a força adversativa de ἀλλά como a ênfase inclusiva de καί e mantém a referência demonstrativa aos povos mencionados no contexto.
- source_word: ὡς ἀνθρώπων
  choice: por serem seres humanos
  rationale: Expressa com naturalidade o valor causal ou circunstancial de ὡς e destaca a condição humana deles como consideração para a moderação divina.
- source_word: ἐφείσω
  choice: tu os poupaste
  rationale: O verbo denota poupar ou abster-se de causar dano; a formulação é concisa e adequada ao contexto de juízo adiado.
- source_word: ἀπέστειλάς τε
  choice: e enviaste
  rationale: Traduz diretamente o aoristo e a ligação feita por τε com a oração anterior.
- source_word: προδρόμους
  choice: como precursoras
  rationale: Mantém a imagem de agentes que seguem à frente da força principal e concorda com o substantivo feminino “vespas”.
- source_word: τοῦ στρατοπέδου σου
  choice: do teu exército
  rationale: στρατόπεδον pode indicar acampamento ou exército; “exército” comunica com clareza a imagem militar ativa neste contexto.
- source_word: σφῆκας
  choice: vespas
  rationale: É uma tradução portuguesa natural para o inseto designado pelo termo grego e preserva a conexão com o motivo bíblico de insetos que picam enviados à frente de Israel.
- source_word: ἵνα αὐτοὺς κατὰ βραχὺ ἐξολεθρεύσωσιν
  choice: para que os exterminassem pouco a pouco
  rationale: “Para que” preserva a finalidade de ἵνα; “pouco a pouco” traduz κατὰ βραχύ, enquanto “exterminassem” conserva a força de ἐξολεθρεύω.
theological_decisions:
- issue: Razão apresentada para Deus os poupar
  choice: A moderação divina é relacionada ao fato de serem seres humanos.
  alternative: Entender a expressão mais livremente como “tratando-os como homens”, sem força causal explícita.
  rationale: “Por serem seres humanos” preserva a relação sugerida pelo grego entre a condição mortal deles e a decisão divina de poupá-los, sem ampliar a afirmação para além do versículo.
- issue: Metáfora militar da ação divina
  choice: Manter “teu exército” como imagem da agência punitiva de Deus.
  alternative: Traduzir como “teu acampamento”.
  rationale: A opção conserva diretamente a retórica militar de στρατόπεδον sem alegorizá-la nem eliminar sua ambiguidade lexical, que é registrada em nota.
translation_notes:
  register: Português atual, claro e digno, com formas de segunda pessoa do singular (“tu”, “teu”) apropriadas ao discurso direto dirigido a Deus. A sintaxe permanece próxima do grego, mas evita rigidez; “seres humanos” é inclusivo e natural, e “pouco a pouco” preserva a progressão gradual do juízo.
