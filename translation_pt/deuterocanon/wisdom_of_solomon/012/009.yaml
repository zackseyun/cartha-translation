base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/009.yaml
  text: not because you were unable[a], in battle, to give the ungodly into subjection, or to wipe them out at once by savage beasts or by a sharp word[b];
translation:
  language: pt
  text: não por seres incapaz de entregar os ímpios ao teu poder em batalha, ou de exterminá-los de uma só vez[a], por meio de feras terríveis ou de uma palavra cortante[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “num único golpe”. A expressão grega ressalta que todos poderiam ser destruídos em uma única ação.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma palavra severa” ou “uma ordem incisiva”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἀδυνατῶν
  choice: não por seres incapaz
  rationale: O particípio nega que a ação gradual de Deus decorresse de falta de poder. A formulação causal, indicada pelo contexto, soa natural em português e mantém o discurso direto a Deus.
- source_word: ἐν παρατάξει
  choice: em batalha
  rationale: O substantivo designa disposição militar ou confronto em formação; “em batalha” preserva o sentido militar com linguagem clara e atual.
- source_word: ἀσεβεῖς
  choice: os ímpios
  rationale: O termo descreve pessoas irreverentes para com Deus, não apenas moralmente más. “Ímpios” conserva essa dimensão religiosa.
- source_word: ὑποχειρίους δοῦναι
  choice: entregar ... ao teu poder
  rationale: ὑποχείριος significa estar sob a mão ou o domínio de alguém. A expressão portuguesa comunica submissão e preserva a imagem de serem entregues ao poder divino.
- source_word: θηρίοις δεινοῖς
  choice: por meio de feras terríveis
  rationale: θηρία são animais selvagens, e δεινοῖς ressalta seu caráter temível. A escolha é vívida sem acrescentar crueldade não expressa no texto.
- source_word: λόγῳ ἀποτόμῳ
  choice: por meio de uma palavra cortante
  rationale: ἀπότομος pode significar cortante, severo ou incisivo. “Palavra cortante” mantém a metáfora e a possibilidade de uma ordem divina decisiva.
- source_word: ὑφʼ ἓν
  choice: de uma só vez
  rationale: A locução indica uma ação realizada de uma vez, num único ato. A expressão é idiomática e conserva a ênfase.
- source_word: ἐκτρῖψαι
  choice: exterminá-los
  rationale: O verbo denota apagar ou destruir completamente. “Exterminar” expressa com precisão a força total do termo no contexto.
theological_decisions:
- issue: Sujeito implícito e valor causal do particípio que descreve a contenção divina
  choice: Discurso direto a Deus — “não por seres incapaz” — explicitando que a demora do juízo não resultava de falta de poder
  alternative: 'Tradução mais formal: “não sendo incapaz” ou “não por falta de poder”'
  rationale: O contexto dirige-se a Deus e contrasta seu poder com a maneira comedida de julgar. A construção escolhida torna essa relação clara sem resolver além do texto a razão ou a finalidade da contenção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservou-se a estrutura de continuação do período, encerrada por ponto e vírgula. “Ímpios” mantém a dimensão religiosa de ἀσεβεῖς, e as notas preservam as principais alternativas sem suavizar a linguagem de juízo.
