base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/012.yaml
  text: For who will say[b][a], “What have you done?” Or who will oppose your judgment? And who will bring a charge against you concerning the nations that you destroyed? Or who will come before you as an avenger against unrighteous men?
translation:
  language: pt
  text: 'Pois quem dirá: “Que fizeste?” Ou quem se oporá ao teu julgamento? Quem te acusará a respeito das nações que fizeste perecer?[a] Ou quem virá apresentar-se contra ti, como vingador contra homens injustos?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a respeito de nações que pereceram, as quais fizeste”. No contexto, a expressão indica as nações que Deus levou à ruína.
    reason: lexical_alternative
  - marker: b
    text: 'A expressão grega é difícil. Também pode ser traduzida: “quem virá pôr-se diante de ti como vingador contra homens injustos?” Ela pode ter sentido mais explicitamente adversarial ou jurídico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἐρεῖ
  choice: Pois quem dirá
  rationale: Preserva γάρ como ligação explicativa e mantém o futuro da pergunta retórica.
- source_word: Τί ἐποίησας
  choice: Que fizeste?
  rationale: Reproduz de modo direto e digno a fórmula de contestação, sem acrescentar um “por quê” ausente do grego.
- source_word: ἀντιστήσεται τῷ κρίματί σου
  choice: se oporá ao teu julgamento
  rationale: Expressa resistência ativa à decisão judicial de Deus; “julgamento” conserva a amplitude de κρίμα.
- source_word: ἐγκαλέσει σοι
  choice: te acusará
  rationale: Verbo português claro que mantém o sentido forense de apresentar acusação contra alguém.
- source_word: κατὰ ἐθνῶν ἀπολωλότων, ἃ σὺ ἐποίησας
  choice: por causa das nações que fizeste perecer
  rationale: Torna inteligível a construção grega comprimida e relaciona ἐποίησας à ruína das nações, sem sugerir que apenas pereceram por si mesmas.
- source_word: εἰς κατάστασίν σοι ἐλεύσεται
  choice: virá apresentar-se contra ti
  rationale: A expressão rara sugere comparecimento ou tomada de posição adversarial, possivelmente em cenário judicial; a tradução conserva ambos os matizes sem excessiva especificação.
- source_word: ἔκδικος κατὰ ἀδίκων ἀνθρώπων
  choice: como vingador de homens injustos
  rationale: “Vingador” preserva a figura pessoal de quem reivindica justiça; em português, “vingador de” identifica aqueles cuja causa ele alegadamente defenderia, embora sejam injustos.
theological_decisions:
- issue: Contestação dos atos judiciais de Deus
  choice: Série de perguntas retóricas que apresenta o julgamento divino como não sujeito a uma acusação bem-sucedida
  alternative: Entender as perguntas apenas como afirmação de incapacidade prática para enfrentar Deus
  rationale: A repetição de τίς e o vocabulário judicial conferem forte sentido de contestação jurídica e moral, sem exigir que a tradução acrescente uma formulação doutrinária abstrata.
- issue: Referente masculino em ἀδίκων ἀνθρώπων
  choice: homens injustos
  alternative: pessoas injustas
  rationale: Mantém a forma masculina do grego e seu referente humano concreto no contexto judicial, sem transformá-la em afirmação sobre a humanidade em geral.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com tratamento de segunda pessoa singular em harmonia com o discurso dirigido a Deus. A linguagem forense do grego foi preservada sem tecnicismo excessivo.
