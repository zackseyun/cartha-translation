  text: Therefore[a], as to senseless children, you sent judgment for mockery;
translation:
  language: pt
  text: Por isso, enviaste-lhes, como a crianças sem entendimento, um juízo para escárnio[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «enviaste-lhes um juízo que servisse de escárnio». O grego permite entender a expressão como finalidade ou como resultado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural e conciso a conclusão inferencial ligada ao argumento anterior.
- source_word: ὡς παισὶν ἀλογίστοις
  choice: como a crianças sem entendimento
  rationale: Preserva a força comparativa de ὡς e entende παῖς como criança neste contexto; a expressão «sem entendimento» comunica a falta de reflexão indicada por ἀλόγιστος sem recorrer ao termo técnico «irracionais».
- source_word: τὴν κρίσιν
  choice: um juízo
  rationale: Mantém a linguagem judicial e a amplitude semântica de κρίσις, sem restringi-la indevidamente a «castigo» ou «sentença».
- source_word: εἰς ἐμπαιγμόν
  choice: para escárnio
  rationale: Conserva a construção com εἰς e sua possível noção de finalidade ou resultado, além da força de zombaria de ἐμπαιγμός.
- source_word: ἔπεμψας
  choice: enviaste-lhes
  rationale: Preserva a imagem concreta do verbo πέμπω; o pronome «lhes» torna natural em português a relação com o dativo παισίν.
theological_decisions:
- issue: Se a comparação descreve identidade literal ou modo de tratamento
  choice: Deus os trata como crianças sem entendimento
  alternative: eles são crianças sem entendimento
  rationale: A partícula ὡς tem força comparativa; a tradução evita transformar a comparação retórica numa afirmação de identidade literal.
- issue: Se κρίσις deve ser especificado como castigo
  choice: juízo
  alternative: castigo
  rationale: «Juízo» preserva tanto o aspecto judicial quanto o punitivo sem tornar o sentido mais estreito do que o grego.
- issue: Se εἰς ἐμπαιγμόν indica finalidade ou resultado
  choice: para escárnio
  alternative: como escárnio; que servisse de escárnio
  rationale: A formulação principal preserva a flexibilidade da preposição; a nota registra outra maneira natural de expressar a função ou o resultado do juízo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa singular mantém a forma de discurso direto a Deus presente no grego.
