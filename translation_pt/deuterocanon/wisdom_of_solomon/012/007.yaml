  text: so that the land most precious of all in your sight might receive a worthy colony of God's children[a][b].
translation:
  language: pt
  text: para que a terra mais preciosa de todas aos teus olhos recebesse uma colônia digna dos filhos de Deus[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma povoação digna». O termo grego pode indicar uma colônia ou uma população estabelecida.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «a terra mais preciosa de todas diante de ti».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade do que foi descrito no contexto e preserva naturalmente a força télica da oração grega.
- source_word: ἀξίαν
  choice: digna
  rationale: Qualifica ἀποικίαν como apropriada ou merecedora, sem acrescentar uma explicação ausente do texto.
- source_word: ἀποικίαν
  choice: colônia
  rationale: Preserva o sentido concreto de uma população estabelecida fora de sua origem; a alternativa mais ampla «povoação» é registrada em nota.
- source_word: δέξηται
  choice: recebesse
  rationale: O subjuntivo aoristo após ἵνα integra uma oração final. «Recebesse» é idiomático em português nessa construção e não acrescenta a ideia afetiva de acolhimento.
- source_word: θεοῦ παίδων
  choice: dos filhos de Deus
  rationale: παῖς pode designar filho ou criança sem exigir referência exclusivamente masculina. No plural misto ou coletivo, «filhos de Deus» é uma formulação portuguesa natural e mantém o sentido familiar.
- source_word: ἡ ... γῆ
  choice: a terra
  rationale: O contexto aponta para uma terra determinada, e não para o planeta ou a terra em sentido universal.
- source_word: ἡ παρὰ σοὶ πασῶν τιμιωτάτη
  choice: a terra mais preciosa de todas aos teus olhos
  rationale: «Aos teus olhos» comunica a avaliação divina expressa por παρὰ σοὶ, enquanto «mais preciosa de todas» conserva o superlativo τιμιωτάτη e a comparação abrangente de πασῶν.
theological_decisions:
- issue: Sentido de θεοῦ παίδων
  choice: filhos de Deus
  alternative: crianças de Deus; servos de Deus
  rationale: No contexto de um povo estabelecido na terra, a relação familiar é mais provável do que o sentido de «servos». O grego não restringe necessariamente o grupo ao sexo masculino; em português, o plural coletivo «filhos» pode abranger o povo todo.
translation_notes:
  register: Português moderno, digno e de leitura natural, com tratamento divino na segunda pessoa do singular. A ordem foi ajustada para clareza sem eliminar a relação entre a estima divina pela terra e o estabelecimento nela dos filhos de Deus.
