base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/012/011.yaml
  text: For it was a seed accursed from the beginning[a], and not fearing anyone because of the things in which they sinned[b], you granted them no pardon.
translation:
  language: pt
  text: Pois era uma semente amaldiçoada desde o princípio[a]; nem, por temor de alguém, lhes concedeste impunidade pelos pecados que cometeram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendência” ou “raça”; o grego diz literalmente “semente”, usada em sentido figurado para uma linhagem ou um povo.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, mais literalmente: “nem, por temer alguém, lhes concedeste impunidade pelos atos em que pecaram”. “Por temer alguém” também pode indicar consideração ou deferência para com alguém.'
    reason: alternative_reading
lexical_decisions:
- source_word: σπέρμα
  choice: semente
  rationale: Preserva a metáfora grega, que aqui designa figuradamente descendência, linhagem ou povo.
- source_word: κατηραμένον
  choice: amaldiçoada
  rationale: Expressa o estado de estar sob maldição, mantendo o tom solene do contexto.
- source_word: ἀπʼ ἀρχῆς
  choice: desde o princípio
  rationale: É uma tradução direta, natural e digna da expressão temporal.
- source_word: εὐλαβούμενος
  choice: por temer
  rationale: No contexto com τινα, indica temor, cautela ou consideração diante de alguém; a formulação preserva essa amplitude sem sugerir reverência religiosa.
- source_word: ἄδειαν
  choice: impunidade
  rationale: Neste contexto judicial, denota isenção da pena ou liberdade em relação às consequências, sentido que 'impunidade' comunica com precisão.
- source_word: ἐδίδους
  choice: concedeste
  rationale: O imperfeito grego pode indicar ação passada continuada ou característica; o pretérito perfeito é mais natural em português neste enunciado.
- source_word: ἐφʼ οἷς ἥμαρταν
  choice: pelos pecados que cometeram
  rationale: Torna idiomática em português a referência aos atos em que pecaram e que constituem a base da recusa de impunidade.
theological_decisions:
- issue: Identidade da 'semente'
  choice: Manter a metáfora 'semente' sem identificar explicitamente o povo no texto principal.
  alternative: descendência ou raça
  rationale: O contexto esclarece o referente, mas o versículo usa σπέρμα; acrescentar uma identificação explícita iria além do que esta frase declara.
- issue: Relação sintática de εὐλαβούμενός τινα com a concessão de ἄδεια
  choice: Entender que Deus não concedeu impunidade por temor ou consideração a alguém.
  alternative: Entender a frase como 'sem temer ninguém por causa dos pecados que cometeram'.
  rationale: A posição dos elementos permite alguma tensão sintática. A redação principal oferece o sentido contextual mais coerente, enquanto a nota registra uma construção mais próxima da ordem grega.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A segunda pessoa singular preserva a oração dirigida a Deus no contexto.
