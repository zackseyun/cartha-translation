  text: Neither king nor tyrant will be able to look you in the face concerning those whom you punished[a].
translation:
  language: pt
  text: Nem rei nem tirano poderá encarar-te a respeito daqueles que castigaste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enfrentar-te”, “ficar diante de ti” ou “sustentar o teu olhar”; o verbo grego é uma expressão vívida para confrontar alguém diretamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε βασιλεὺς ἢ τύραννος
  choice: Nem rei nem tirano
  rationale: A construção correlativa negativa é expressa naturalmente em português por “nem... nem...”, preservando a distinção entre βασιλεύς, “rei”, e τύραννος, “tirano”.
- source_word: ἀντοφθαλμῆσαι
  choice: encarar-te
  rationale: O verbo raro evoca enfrentar alguém face a face ou sustentar-lhe o olhar. “Encarar-te” conserva a imagem vívida e a ideia de confronto direto sem explicitar além do grego uma fórmula de prestação de contas.
- source_word: δυνήσεταί σοι
  choice: poderá encarar-te
  rationale: O futuro de δύναμαι indica capacidade futura, e o dativo σοι designa aquele que é diretamente confrontado.
- source_word: περὶ ὧν
  choice: por causa daqueles que
  rationale: No contexto, o pronome remete às pessoas castigadas. “Por causa daqueles que” é natural em português e comunica que elas são o motivo do confronto, embora a construção grega também possa ser entendida mais literalmente como “a respeito daqueles que”.
- source_word: ἐκόλασας
  choice: castigaste
  rationale: κολάζω descreve aqui a aplicação de castigo ou juízo; “castigaste” preserva o sentido punitivo sem reduzi-lo a mera disciplina corretiva.
theological_decisions:
- issue: Força da imagem de confrontar Deus
  choice: Nenhum governante terreno poderá encarar Deus por causa dos que ele castigou.
  alternative: Nenhum governante poderá enfrentar Deus, sustentar seu olhar ou chamá-lo a prestar contas por seu juízo.
  rationale: A tradução conserva a imagem de confronto face a face contida em ἀντοφθαλμῆσαι, sem transformá-la numa formulação jurídica explícita nem resolver toda a sua implicação teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ênclise em “encarar-te” mantém um tom literário moderado, apropriado ao texto sapiencial.
