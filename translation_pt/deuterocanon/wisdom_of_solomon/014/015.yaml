base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/015.yaml
  text: For a father[a], worn down by untimely grief for the child quickly taken away, made an image of the one then dead, and now honored him as a god, and handed down mysteries and rites to those under his authority[b];
translation:
  language: pt
  text: Pois um pai, consumido pelo luto prematuro[a] por uma criança que lhe fora tirada cedo demais, fez uma imagem da pessoa que então estava morta e agora a honrou como um deus; e transmitiu mistérios e ritos[b] aos que estavam sob sua autoridade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega pode ser entendida como “luto prematuro” ou como luto causado por uma morte ocorrida antes do tempo esperado.
    reason: lexical_alternative
  - marker: b
    text: “Mistérios e ritos” são observâncias religiosas, por vezes secretas ou iniciáticas, ligadas à prática de um culto.
    reason: cultural_note
lexical_decisions:
- source_word: ἀώρῳ πένθει
  choice: luto prematuro
  rationale: ἀώρῳ indica algo ocorrido antes do tempo devido, e πένθει designa luto ou pesar. A formulação concisa preserva a ligação gramatical entre o adjetivo e o luto, embora o sentido decorra da morte precoce.
- source_word: τρυχόμενος
  choice: consumido
  rationale: O particípio descreve alguém desgastado ou exaurido pelo sofrimento. “Consumido” é natural em português no contexto de luto e mantém a força da imagem.
- source_word: τοῦ ταχέως ἀφαιρεθέντος τέκνου
  choice: por uma criança que lhe fora tirada rapidamente
  rationale: τέκνον não especifica sexo, por isso “criança” evita acrescentar “filho”. ἀφαιρεθέντος é vertido como “tirada”, e ταχέως como “rapidamente”, sem introduzir uma causa específica para a morte.
- source_word: εἰκόνα
  choice: uma imagem
  rationale: O termo significa imagem ou representação. “Ídolo” anteciparia a avaliação polêmica do contexto em vez de traduzir diretamente o objeto produzido.
- source_word: τὸν τότε νεκρὸν ἄνθρωπον
  choice: a pessoa que então estava morta
  rationale: A expressão sublinha que o objeto posteriormente divinizado era um ser humano morto. “Pessoa” conserva o caráter humano sem sugerir que τέκνον fosse necessariamente do sexo masculino.
- source_word: νῦν ὡς θεὸν ἐτίμησεν
  choice: mas agora a honrou como um deus
  rationale: A tradução mantém o contraste explícito entre τότε, “então”, e νῦν, “agora”. “Como um deus” expressa a condição em que a pessoa passou a ser honrada, sem afirmar divindade verdadeira.
- source_word: παρέδωκεν
  choice: transmitiu
  rationale: O verbo indica entregar ou passar adiante. Neste contexto, “transmitiu” comunica a instituição ou perpetuação de práticas cultuais sem exceder o sentido lexical.
- source_word: τοῖς ὑποχειρίοις
  choice: aos que estavam sob sua autoridade
  rationale: O termo designa pessoas sob o poder ou controle de alguém. A formulação é clara e não restringe indevidamente o grupo a súditos políticos ou servos domésticos.
- source_word: μυστήρια καὶ τελετάς
  choice: mistérios e ritos
  rationale: 'Os dois substantivos pertencem ao vocabulário cultual: μυστήρια pode designar observâncias secretas ou iniciáticas, e τελετάς, cerimônias ou ritos religiosos.'
theological_decisions:
- issue: Tradução de θεός no contexto de crítica à idolatria
  choice: como um deus
  alternative: como divino
  rationale: O texto descreve um ser humano morto recebendo honra na condição de divindade. O artigo indefinido e a inicial minúscula preservam a alegação de deificação no relato sem identificá-lo com o Deus verdadeiro.
- issue: Identidade sexual de τέκνον e ἄνθρωπος
  choice: criança; pessoa
  alternative: filho; homem
  rationale: Nenhum dos termos gregos exige referente masculino. As escolhas mantêm a indeterminação do original e evitam introduzir um detalhe ausente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Preservou-se o contraste retórico entre “então” e “agora”, bem como a linguagem cultual, sem empregar terminologia confessional específica.
