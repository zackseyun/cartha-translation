base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/024.yaml
  text: They no longer keep either lives or marriages pure[a]; instead, one kills another by treachery[b], or by adultery causes grief.
translation:
  language: pt
  text: Já não mantêm puros nem seus modos de vida nem seus casamentos. Pelo contrário, uma pessoa mata outra numa emboscada[a] ou lhe causa sofrimento pela infidelidade conjugal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficando à espreita para matá-la”; o grego descreve um ataque oculto ou uma tocaia.
    reason: lexical_alternative
  - marker: b
    text: Ou “corrompendo o casamento”; o verbo grego pode indicar adulterar ou violar a fidelidade matrimonial.
    reason: lexical_alternative
lexical_decisions:
- source_word: βίους
  choice: modos de vida
  rationale: βίος pode indicar vida, modo de viver ou sustento. No contexto de uma lista de vícios e em paralelo com “casamentos”, “modos de vida” expressa com clareza a dimensão moral e social sem restringir o termo à subsistência.
- source_word: γάμους
  choice: casamentos
  rationale: γάμος pode significar casamento, núpcias ou leito conjugal. Aqui, o plural e a ideia de mantê-los puros apontam para as uniões matrimoniais.
- source_word: καθαρούς
  choice: puros
  rationale: O adjetivo qualifica tanto βίους como γάμους e conserva o sentido ético de pureza sem introduzir uma leitura exclusivamente ritual.
- source_word: φυλάσσουσιν
  choice: mantêm
  rationale: φυλάσσω significa guardar, preservar ou manter. “Mantêm puros” é natural em português e comunica a preservação da integridade moral.
- source_word: λοχῶν
  choice: numa emboscada
  rationale: O particípio descreve o ato de ficar à espreita ou armar uma emboscada. A tradução preserva de forma concreta o caráter oculto e premeditado do ataque.
- source_word: ἀναιρεῖ
  choice: mata
  rationale: O verbo pode significar matar, eliminar ou destruir. “Mata” é direto e não acrescenta uma qualificação jurídica ausente do texto.
- source_word: νοθεύων
  choice: pela infidelidade conjugal
  rationale: νοθεύω denota adulterar, corromper ou falsificar; junto da referência imediata aos casamentos, indica violação da fidelidade matrimonial. A formulação portuguesa torna esse sentido contextual explícito sem limitar a nota lexical.
- source_word: ὀδυνᾷ
  choice: causa sofrimento
  rationale: O verbo significa causar dor, afligir ou atormentar. “Causa sofrimento” abrange tanto a dor emocional como a aflição relacional.
theological_decisions:
- issue: Alcance da pureza em βίους ... γάμους καθαρούς
  choice: O versículo condena a incapacidade de preservar em pureza tanto os modos de vida como os casamentos.
  alternative: Entender βίους de modo mais restrito como meios de subsistência, ou interpretar a pureza principalmente em sentido ritual.
  rationale: O contexto descreve a desordem moral decorrente da idolatria. A tradução mantém o sentido ético amplo e evita restringir indevidamente βίους ou ritualizar καθαρούς.
- issue: Sentido de νοθεύων
  choice: Expressar a corrupção do vínculo matrimonial como infidelidade conjugal.
  alternative: Traduzir de modo mais formal como “corrompendo o casamento” ou mais específico como “cometendo adultério”.
  rationale: A proximidade de γάμους favorece uma referência à violação da fidelidade matrimonial, mas o verbo conserva uma noção mais ampla de adulteração ou corrupção; a nota registra essa amplitude.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Uma pessoa... outra” evita a possível ambiguidade de gênero de “um... outro”, enquanto “pelo contrário” explicita a transição adversativa de δέ. As notas preservam as alternativas lexicais concretas dos particípios gregos.
