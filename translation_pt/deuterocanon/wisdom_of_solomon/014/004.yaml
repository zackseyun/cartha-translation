lexical_decisions:
- source_word: δεικνὺς
  choice: mostrando
  rationale: O particípio presente dá continuidade ao pensamento do versículo anterior e conserva a ideia de tornar evidente.
- source_word: δύνασαι
  choice: podes
  rationale: Expressa de modo direto e natural a capacidade de Deus, a quem o texto se dirige.
- source_word: ἐκ παντὸς
  choice: de qualquer perigo
  rationale: A expressão significa literalmente «de tudo»; no contexto da navegação, indica livramento de qualquer perigo, sem apagar a amplitude do grego.
- source_word: σώζειν
  choice: salvar
  rationale: Preserva tanto o sentido concreto de livrar do perigo como a ressonância teológica mais ampla do verbo.
- source_word: ἵνα κἂν
  choice: para que até
  rationale: Mantém a relação de finalidade ou resultado de ἵνα e a força inclusiva de κἂν em português corrente.
- source_word: ἄνευ τέχνης
  choice: sem habilidade
  rationale: τέχνη designa habilidade prática ou conhecimento de um ofício; no contexto, pode referir-se especificamente à arte de navegar.
- source_word: τις
  choice: alguém
  rationale: Reproduz naturalmente o pronome indefinido singular.
- source_word: ἐπιβῇ
  choice: possa embarcar
  rationale: No contexto marítimo, o verbo significa subir a bordo; «embarcar» é preciso e idiomático.
theological_decisions:
- issue: Amplitude do poder salvador de Deus em ἐκ παντὸς σώζειν
  choice: salvar de qualquer perigo
