base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/020.yaml
  text: And the multitude[a], drawn by the charm of the workmanship, now regarded as an object of worship the man who a little before had been honored.
translation:
  language: pt
  text: E a multidão, atraída pelo encanto da obra, passou a considerar objeto de culto[a] o homem que, pouco antes, fora honrado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ídolo”, “objeto de veneração” ou “imagem sagrada”.
    reason: Alternativas lexicais possíveis para σέβασμα.
lexical_decisions:
- source_word: πλῆθος
  choice: a multidão
  rationale: Preserva o sentido coletivo de um grande número de pessoas e mantém um registro digno e natural.
- source_word: ἐφελκόμενον
  choice: atraída
  rationale: Expressa a força de atração exercida pela qualidade estética da obra sem acrescentar uma ideia indevida de coerção.
- source_word: διὰ τὸ εὔχαρι τῆς ἐργασίας
  choice: pelo encanto da obra
  rationale: Traduz de modo conciso a qualidade agradável ou cativante do trabalho artístico; 'obra' é natural em português neste contexto de fabricação de uma imagem.
- source_word: τὸν πρὸ ὀλίγου τιμηθέντα ἄνθρωπον
  choice: aquele que, pouco antes, fora honrado como homem
  rationale: Conserva o contraste retórico entre a honra anteriormente dada a um ser humano e sua posterior transformação em objeto de culto.
- source_word: νῦν
  choice: passou a
  rationale: A mudança de estado expressa por 'passou a' torna natural em português o contraste temporal com 'pouco antes', embora o valor literal seja 'agora'.
- source_word: σέβασμα
  choice: objeto de culto
  rationale: Designa algo reverenciado religiosamente sem restringir o sentido a 'ídolo' ou identificar de modo absoluto o objeto material como 'imagem sagrada'.
- source_word: ἐλογίσαντο
  choice: considerar
  rationale: Verte o ato de julgar, reputar ou ter alguém por algo, encaixando-se naturalmente na construção portuguesa.
theological_decisions:
- issue: Natureza do ato censurado em σέβασμα
  choice: objeto de culto
  alternative: ídolo; objeto de veneração; imagem sagrada
  rationale: A formulação preserva a crítica à passagem da honra humana ao culto religioso, sem impor uma definição denominacional da relação entre culto e veneração nem estreitar o termo grego mais do que o contexto exige.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para fluência, mantendo o contraste entre a condição humana anteriormente honrada e o posterior culto. O mais-que-perfeito composto foi evitado em favor de 'fora honrado', adequado ao registro literário sem soar arcaico em excesso.
