base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/026.yaml
  text: forgetfulness of favors[a], defilement of souls, perversion of birth, disorder in marriages[b], adultery and debauchery.
translation:
  language: pt
  text: esquecimento dos favores[a], contaminação das almas, alteração da geração[b], desordem nos casamentos, adultério e devassidão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esquecimento da graça” ou “da gratidão”. O termo grego χάρις pode significar favor, graça ou gratidão, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “mudança” ou “troca da geração”, expressão que também pode se referir ao nascimento ou à procriação. Neste contexto, talvez indique uma corrupção ou inversão da ordem natural ou procriadora.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτος ἀμνησία
  choice: esquecimento dos favores
  rationale: Traduz diretamente ἀμνησία como “esquecimento” e emprega “favores” para o sentido contextual de χάρις, sem impor a acepção teológica mais específica de “graça” nem explicitar como “ingratidão” aquilo que o grego deixa implícito.
- source_word: ψυχῶν μιασμός
  choice: contaminação das almas
  rationale: “Contaminação” conserva as dimensões moral e cultual de μιασμός, enquanto “almas” mantém o peso moral-espiritual de ψυχαί neste contexto sapiencial.
- source_word: γενέσεως ἐναλλαγή
  choice: alteração da geração
  rationale: A expressão grega é compacta e ambígua. “Alteração” preserva o sentido básico de mudança ou troca de ἐναλλαγή, e “geração” mantém a amplitude de γένεσις entre nascimento, origem e procriação, evitando transformar uma possível implicação contextual em tradução explícita.
- source_word: γάμων ἀταξία
  choice: desordem nos casamentos
  rationale: “Desordem” corresponde naturalmente à falta de ordem expressa por ἀταξία; “nos casamentos” torna a relação genitiva idiomática em português sem especificar indevidamente a conduta.
- source_word: μοιχεία
  choice: adultério
  rationale: Equivalente português padrão e preciso para a violação sexual do vínculo matrimonial.
- source_word: ἀσέλγεια
  choice: devassidão
  rationale: Expressa a conduta sensual desregrada e sem pudor associada a ἀσέλγεια, em registro atual e digno.
theological_decisions:
- issue: Se χάριτος deve receber a tradução teologicamente marcada “graça”
  choice: favores
  alternative: graça; gratidão
  rationale: O contexto apresenta uma lista de males morais e sociais ligados à idolatria, não uma exposição sobre a graça salvífica. “Favores” preserva um sentido lexical provável sem importar associações doutrinárias posteriores; a alternativa permanece registrada em nota.
- issue: Se ψυχῶν deve ser nivelado como “pessoas” ou “vidas”
  choice: almas
  alternative: pessoas; vidas
  rationale: “Almas” conserva o registro moral-espiritual do livro sem definir uma antropologia sistemática.
- issue: Se γενέσεως ἐναλλαγή deve ser interpretado explicitamente como perversão da ordem natural ou procriadora
  choice: alteração da geração
  alternative: perversão do nascimento; troca da geração
  rationale: O contexto pode sugerir corrupção da ordem natural ou procriadora, mas a formulação grega permanece comprimida. A tradução conserva sua ambiguidade e transfere a explicação contextual para a nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A enumeração concisa do grego foi preservada, com vocabulário digno e compreensível. As notas registram as ambiguidades lexicais reais sem resolver silenciosamente a tensão interpretativa.
