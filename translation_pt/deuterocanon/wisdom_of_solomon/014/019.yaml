base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/019.yaml
  text: For he[a], perhaps wishing to please the ruler, forced the likeness by his skill into a more beautiful form[b];
translation:
  language: pt
  text: Pois ele, talvez querendo agradar ao governante[a], forçou com sua arte a semelhança, tornando-a mais bela[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «àquele que detinha o poder» ou «ao soberano».
    reason: lexical_alternative
  - marker: b
    text: Ou, mais literalmente, «forçou a semelhança em direção ao mais belo»; o grego sugere que o artista levou a representação além da semelhança comum, idealizando-a.
    reason: lexical_alternative
lexical_decisions:
- source_word: τάχα
  choice: talvez
  rationale: Neste contexto, indica possibilidade ou suposição quanto à motivação do artista, e não rapidez temporal.
- source_word: κρατοῦντι
  choice: ao governante
  rationale: O particípio designa aquele que exerce poder ou governo; «governante» é claro, natural e adequado ao contexto político.
- source_word: βουλόμενος ἀρέσαι
  choice: querendo agradar
  rationale: Preserva tanto a intenção expressa pelo particípio quanto o sentido direto do infinitivo ἀρέσαι.
- source_word: ἐξεβιάσατο
  choice: forçou
  rationale: Mantém a ideia de exercer força para levar a representação além da semelhança comum, sem inserir uma condenação explícita ausente da frase.
- source_word: τῇ τέχνῃ
  choice: com sua arte
  rationale: Expressa o meio empregado pelo artista e conserva a amplitude de τέχνη como arte, ofício ou habilidade técnica.
- source_word: τὴν ὁμοιότητα
  choice: a semelhança
  rationale: É uma tradução direta que não identifica antecipadamente a representação como ídolo além do que o termo afirma.
- source_word: ἐπὶ τὸ κάλλιον
  choice: tornando-a mais bela
  rationale: Comunica de modo natural o movimento para uma representação mais bela ou idealizada; a nota preserva a formulação mais literal.
theological_decisions:
- issue: Enquadramento da ação do artista no contexto da crítica à idolatria
  choice: Descrever o embelezamento artístico feito para agradar ao governante, sem acrescentar condenação moral explícita.
  alternative: Traduzir ἐξεβιάσατο de modo mais interpretativo como «distorceu», realçando a crítica.
  rationale: Embora o contexto mais amplo critique a idolatria, este versículo descreve o processo de idealização da imagem por adulação política. A formulação mantém essa tensão sem introduzir juízo não expresso nesta linha.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase preserva a motivação incerta do artista e o ponto culminante no embelezamento da representação; o ponto e vírgula mantém a continuidade sintática do contexto.
