revisions:
- from: Mas aquilo que é feito por mãos é amaldiçoado[a], tanto ele como quem o fez, porque um o fez, enquanto o outro, embora perecível, foi chamado deus.[b]
  to: Mas aquilo que é feito por mãos é maldito[a], tanto ele quanto quem o fez, pois quem o fez trabalhava nele, mas o que é perecível foi chamado deus[b].
  rationale: A revisão restaura a nuance imperfeita de ἠργάζετο com «trabalhava nele», esclarece o contraste μὲν...δέ entre o fabricante e o objeto e melhora a fluência em português. Mantém-se a amplitude de χειρόποιητον, sem inserir «ídolo» no texto principal, e conserva-se «deus» sem artigo, com a alternativa anotada.
