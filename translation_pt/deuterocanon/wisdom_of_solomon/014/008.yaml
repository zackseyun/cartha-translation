base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/008.yaml
  text: But the thing made by hands is accursed[a], both it and the one who made it, because the one made it[b], but the perishable thing was called god.
translation:
  language: pt
  text: Mas aquilo que é feito por mãos é maldito[a], tanto ele quanto quem o fez, pois quem o fez trabalhava nele, mas o que é perecível foi chamado deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais explícito no contexto, «o ídolo feito por mãos». O grego diz literalmente «aquilo que é feito por mãos».
    reason: alternativa lexical
  - marker: b
    text: Ou «foi chamado um deus».
    reason: alternativa de tradução
lexical_decisions:
- source_word: χειρόποιητον
  choice: aquilo que é feito por mãos
  rationale: Preserva o sentido formal de algo produzido por mãos sem inserir no texto principal o substantivo «ídolo», embora esse seja claramente o referente no contexto.
- source_word: ἐπικατάρατον
  choice: amaldiçoado
  rationale: Expressa de modo corrente e solene a condição de estar sob maldição.
- source_word: ὁ ποιήσας αὐτό
  choice: quem o fez
  rationale: Reproduz a referência pessoal do particípio sem acrescentar gênero que o grego não explicita.
- source_word: ἠργάζετο
  choice: o fez
  rationale: No contexto, o verbo se refere ao trabalho de produzir o objeto. A formulação direta é natural em português, ainda que atenue a nuance processual do imperfeito.
- source_word: φθαρτὸν
  choice: perecível
  rationale: Mantém o contraste entre a natureza destrutível do objeto e a designação divina que lhe foi atribuída.
- source_word: θεὸς ὠνομάσθη
  choice: foi chamado deus
  rationale: Preserva a força polêmica de dar a um objeto perecível a designação «deus», sem decidir em favor da leitura classificatória «um deus».
theological_decisions:
- issue: Explicitar «ídolo» no texto principal
  choice: Manter «aquilo que é feito por mãos»
  alternative: «o ídolo feito por mãos»
  rationale: O contexto trata de ídolos, mas o grego usa uma expressão mais ampla. A tradução conserva a retórica do original e explica o referente em nota.
- issue: Traduzir θεὸς como «deus» ou «um deus»
  choice: «deus»
  alternative: «um deus»
  rationale: A ausência de artigo no grego admite discussão, mas aqui a ênfase parece recair na designação divina indevidamente dada ao objeto. A alternativa é preservada em nota.
- issue: Representar o contraste ὁ μὲν ... τὸ δὲ
  choice: «um ... enquanto o outro»
  alternative: Repetir «quem o fez ... aquilo que é perecível»
  rationale: A construção correlativa mantém claramente o contraste entre o fabricante e o objeto fabricado sem tornar a frase excessivamente pesada.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A construção «um ... o outro» preserva o contraste grego entre o fabricante e o objeto; «deus» permanece em minúscula por funcionar como designação atribuída ao ídolo.
