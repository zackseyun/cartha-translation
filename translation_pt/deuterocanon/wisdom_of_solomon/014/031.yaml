base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/031.yaml
  text: For it is not the power of the things by which they swear[a], but the punishment of those who sin[b], that always pursues the transgression of the unrighteous.
translation:
  language: pt
  text: Pois não é o poder daquilo por que juram[a], mas o castigo dos que pecam[b], que sempre persegue a transgressão dos injustos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o poder dos juramentos” ou “o poder daquilo que invocam ao jurar”. A expressão grega é condensada e pode referir-se ao próprio juramento ou às entidades invocadas nele.'
    reason: alternativa lexical
  - marker: b
    text: 'Ou: “mas o castigo dos pecadores sempre persegue a transgressão dos injustos”.'
    reason: construção alternativa
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Pois não é
  rationale: Preserva a força explicativa de γάρ e introduz naturalmente, em português, o fundamento da afirmação anterior.
- source_word: ἡ τῶν ὀμνυμένων δύναμις
  choice: o poder daquilo por que juram
  rationale: Mantém a expressão grega condensada e sua referência ao que é invocado no juramento, sem afirmar de modo excessivamente explícito se estão em vista os juramentos ou as entidades invocadas.
- source_word: ἀλλ᾽ ἡ τῶν ἁμαρτανόντων δίκη
  choice: mas o castigo dos que pecam
  rationale: Neste contexto, δίκη designa a consequência judicial e retributiva que recai sobre os transgressores. “Castigo” é natural e claro, enquanto “dos que pecam” conserva o particípio verbal.
- source_word: ἐπεξέρχεται
  choice: persegue
  rationale: Reproduz a imagem ativa de ir atrás, perseguir ou alcançar, mais forte que uma formulação estática como “recai sobre”.
- source_word: ἀεὶ
  choice: sempre
  rationale: Equivalente direto, corrente e claro do advérbio grego.
- source_word: τὴν τῶν ἀδίκων παράβασιν
  choice: a transgressão dos injustos
  rationale: Preserva o registro moral e judicial de παράβασις e ἄδικος sem intensificar “injustos” para “perversos” ou empregar o mais eclesiástico “iníquos”.
theological_decisions:
- issue: Sentido de δίκη na afirmação sobre retribuição
  choice: castigo dos que pecam
  alternative: justiça que cabe aos que pecam; pena dos pecadores
  rationale: “Castigo” expressa de maneira natural a dimensão retributiva presente no contexto, sem especificar o agente nem construir uma formulação doutrinária além do que o texto afirma.
- issue: Referente de τῶν ὀμνυμένων
  choice: daquilo por que juram
  alternative: dos juramentos; daquilo que invocam ao jurar
  rationale: A formulação conserva a ambiguidade entre a força do juramento e o suposto poder das realidades invocadas, esclarecendo as possibilidades em nota.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem contrastiva do grego foi preservada, assim como o vocabulário moral e judicial. As notas registram ambiguidades reais sem sobrecarregar o texto principal.
