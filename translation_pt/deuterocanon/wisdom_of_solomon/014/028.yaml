base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/028.yaml
  text: For either[a], while reveling, they go mad; or they prophesy lies; or they live unjustly; or they quickly swear false oaths[b];
translation:
  language: pt
  text: Pois ou, enquanto festejam, enlouquecem[a]; ou profetizam mentiras; ou vivem injustamente; ou fazem prontamente juramentos falsos[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entregando-se à alegria, ficam enlouquecidos”. O particípio seguido do verbo no perfeito permite pequenas diferenças na expressão do aspecto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “cometem perjúrio sem hesitar”. O verbo grego se refere a jurar falsamente ou cometer perjúrio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφραινόμενοι
  choice: enquanto festejam
  rationale: O particípio descreve alegria festiva ou celebração e, neste contexto, introduz a circunstância em que ocorre o comportamento enlouquecido. A formulação é natural e preserva a relação temporal.
- source_word: μεμήνασιν
  choice: enlouquecem
  rationale: O perfeito de μαίνομαι expressa um estado resultante de loucura ou frenesi. O presente em português comunica com naturalidade esse estado vigente.
- source_word: προφητεύουσιν ψευδῆ
  choice: profetizam mentiras
  rationale: Mantém diretamente a construção verbo-objeto e a acusação incisiva do grego, sem reduzi-la a uma simples falta de precisão.
- source_word: ζῶσιν ἀδίκως
  choice: vivem injustamente
  rationale: Preserva a dimensão ética e social de ἀδίκως, sem restringir o termo a uma formulação doutrinária posterior.
- source_word: ἐπιορκοῦσιν
  choice: fazem juramentos falsos
  rationale: Explicita em linguagem corrente o sentido de jurar falsamente ou cometer perjúrio, conservando a referência a juramentos.
- source_word: ταχέως
  choice: prontamente
  rationale: Neste contexto, o advérbio sugere não apenas rapidez, mas também facilidade ou disposição para jurar falsamente.
theological_decisions:
- issue: Sentido ético de ἀδίκως
  choice: injustamente
  alternative: perversamente; sem retidão
  rationale: “Injustamente” mantém a sobreposição entre conduta moral errada e injustiça característica da literatura sapiencial, sem impor uma leitura confessional específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A sequência repetida de “ou” e os pontos e vírgulas preservam a estrutura retórica do grego; o ponto e vírgula final mantém a ligação sintática com o contexto seguinte.
