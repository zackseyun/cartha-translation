    text: 'Ou: “também haverá visitação contra os ídolos das nações”. “Visitação” pode referir-se à intervenção ou inspeção divina e, neste contexto, tem implicações de juízo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural e conciso a conclusão inferencial ligada ao argumento anterior.
- source_word: ἐν εἰδώλοις ἐθνῶν ἐπισκοπὴ ἔσται
  choice: também haverá uma visitação contra os ídolos das nações
  rationale: “Visitação” preserva a amplitude de ἐπισκοπή, enquanto “contra” comunica seu caráter punitivo neste contexto. “Das nações” mantém o genitivo sem restringi-lo a uma designação étnico-religiosa específica.
- source_word: ἐν κτίσματι θεοῦ
  choice: entre as criaturas de Deus
  rationale: O singular coletivo κτίσμα pode referir-se ao conjunto do que foi criado; em português, “entre as criaturas de Deus” torna clara a relação sem sugerir que os ídolos tenham sido diretamente criados por Deus como ídolos.
- source_word: εἰς βδέλυγμα ἐγενήθησαν
  choice: eles se tornaram uma abominação
  rationale: Preserva a força religiosa e moral de βδέλυγμα e o processo expresso por ἐγενήθησαν.
- source_word: εἰς σκάνδαλα ψυχαῖς ἀνθρώπων
  choice: pedra de tropeço para as almas humanas
  rationale: Mantém tanto a metáfora de σκάνδαλον quanto ψυχή, e traduz o genérico ἀνθρώπων de forma inclusiva e inequívoca.
- source_word: εἰς παγίδα ποσὶν ἀφρόνων
  choice: armadilha para os pés dos insensatos
  rationale: Conserva a imagem concreta de captura e verte ἄφρων com sua conotação ética própria da literatura sapiencial.
theological_decisions:
- issue: Sentido de ἐπισκοπή em contexto de juízo
  choice: visitação contra os ídolos
  alternative: juízo sobre os ídolos
  rationale: O termo pode designar inspeção ou visitação divina, aqui claramente punitiva. A tradução retém “visitação” para preservar a amplitude lexical e usa “contra” para sinalizar o contexto judicial.
- issue: Referente de ἐν κτίσματι θεοῦ
  choice: entre as criaturas de Deus
  alternative: na criação de Deus
  rationale: Ambas são possíveis. A opção adotada reflete o valor coletivo de κτίσμα e evita a leitura de que a idolatria, enquanto tal, seja obra criadora de Deus.
- issue: Alcance de ἀνθρώπων
  choice: humanas
  alternative: dos homens
  rationale: O grego se refere genericamente aos seres humanos; “humanas” comunica esse alcance em português atual sem restringir o sentido ao sexo masculino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preservam-se as imagens de abominação, tropeço e armadilha, bem como a relativa amplitude do termo “visitação”.
