  text: But justice will pursue them both[a], because they thought wrongly about God by giving heed to idols, and they swore unjustly in deceit[c][b], despising holiness.
translation:
  language: pt
  text: Mas a justiça os alcançará por ambas as faltas, porque pensaram de modo errado a respeito de Deus, dando atenção aos ídolos, e juraram injustamente, com engano, desprezando a santidade[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «desprezando a piedade» ou «mostrando desprezo pelo que é santo». Quanto à primeira oração, também se pode traduzir: «as justas consequências os alcançarão por ambas as faltas».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμφότερα
  choice: por ambas as coisas
  rationale: 'O neutro plural retoma de modo conciso as duas faltas apresentadas: pensar erradamente acerca de Deus ao dar atenção aos ídolos e jurar de modo injusto e enganoso. A formulação preserva a referência dupla sem transformá-la em duas pessoas.'
- source_word: μετελεύσεται
  choice: perseguirão
  rationale: O verbo comunica a ideia de ir atrás de alguém com força punitiva. «Perseguirão» conserva essa imagem sem especificar prematuramente a forma da retribuição.
- source_word: τὰ δίκαια
  choice: as justas consequências
  rationale: O neutro plural substantivado pode indicar aquilo que a justiça exige ou as consequências merecidas. «As justas consequências» é natural em português e mantém a dimensão judicial sem restringir o sentido a uma pena específica.
- source_word: κακῶς ἐφρόνησαν περὶ θεοῦ
  choice: pensaram de modo errado a respeito de Deus
  rationale: A expressão descreve uma concepção ou juízo equivocado acerca de Deus, e não apenas sentimentos moralmente maus. A tradução é clara e atual.
- source_word: προσχόντες εἰδώλοις
  choice: dando atenção aos ídolos
  rationale: O particípio indica que eles dirigiram a atenção ou adesão aos ídolos e explica como pensaram erradamente acerca de Deus. A escolha evita acrescentar uma intensidade cultual não expressa diretamente pelo verbo.
- source_word: ἀδίκως ὤμοσαν
  choice: juraram injustamente
  rationale: ἀδίκως caracteriza o juramento como moralmente injusto ou ilícito. «Falsamente» seria possível no contexto, mas estreitaria o sentido à falta de veracidade.
- source_word: ἐν δόλῳ
  choice: com engano
  rationale: A locução indica o modo ou a esfera enganosa em que juraram. «Com engano» é idiomático e preserva a ligação com o juramento.
- source_word: καταφρονήσαντες ὁσιότητος
  choice: desprezando a santidade
  rationale: ὁσιότης pode denotar santidade, piedade ou reverência pelo que é sagrado. «Santidade» é acessível e mantém a força religiosa e moral da expressão.
theological_decisions:
- issue: Referência de ἀμφότερα e força de τὰ δίκαια
  choice: «Por ambas as coisas» retoma as duas faltas, enquanto «as justas consequências» representa aquilo que a justiça faz recair sobre os ofensores.
  alternative: Entender «ambos» como referência a dois grupos de pessoas, ou explicitar τὰ δίκαια como «justo castigo».
  rationale: A construção neutra e o conteúdo imediato favorecem a referência às duas faltas. «Justas consequências» conserva a dimensão retributiva sem definir além do texto a natureza exata do castigo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para tornar clara a relação entre as duas faltas e suas consequências, preservando a ambiguidade lexical em nota.
