  text: For they were conducting either child-killing rites, or secret mysteries, or frenzied revelries with strange customs,
translation:
  language: pt
  text: Pois celebravam ou ritos em que se matavam crianças, ou mistérios secretos, ou festas desenfreadas segundo costumes estranhos,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τεκνοφόνους τελετάς
  choice: ritos em que se matavam crianças
  rationale: Expressa com clareza o sentido ativo de τεκνοφόνος (‘que mata crianças’) e o caráter ritual de τελετή, sem sugerir apenas que as crianças eram agentes.
- source_word: κρύφια μυστήρια
  choice: mistérios secretos
  rationale: Mantém a linguagem cultual de μυστήρια e o qualificativo κρύφια de modo natural em português.
- source_word: ἐμμανεῖς ... κώμους
  choice: festas desenfreadas
  rationale: κῶμοι designa celebrações festivas e ruidosas; ἐμμανεῖς acrescenta a ideia de frenesi ou descontrole. ‘Festas desenfreadas’ comunica ambos de forma corrente.
- source_word: ἐξάλλων θεσμῶν
  choice: segundo costumes estranhos
  rationale: θεσμοί pode indicar normas, práticas ou costumes estabelecidos; ἐξάλλων indica que eram anômalos ou estranhos. A construção liga esses costumes à maneira de celebrar.
- source_word: ἄγοντες
  choice: celebravam
  rationale: Com τελετάς, μυστήρια e κώμους, o particípio tem o sentido idiomático de realizar ou celebrar tais práticas.
theological_decisions:
- issue: Natureza dos ritos que envolviam crianças
  choice: ritos em que se matavam crianças
  alternative: ritos de sacrifício de crianças
  rationale: O grego afirma que os ritos eram ‘matadores de crianças’, mas não especifica lexicalmente o mecanismo nem usa o termo técnico para sacrifício; a tradução preserva a acusação sem acrescentar uma precisão não expressa.
- issue: Relação de ἐξάλλων θεσμῶν com κώμους
  choice: festas desenfreadas segundo costumes estranhos
  alternative: festas desenfreadas de instituições incomuns
  rationale: O genitivo pode caracterizar as festas por suas normas ou práticas. ‘Segundo costumes estranhos’ preserva a relação sem transformar θεσμοί em uma instituição formal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A vírgula final foi mantida porque o versículo continua sintaticamente no seguinte.
