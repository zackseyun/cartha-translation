base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/014.yaml
  text: For by human vanity it entered into the world, and because of this their end was devised to be brief.
translation:
  language: pt
  text: Pois pela vanglória humana entrou no mundo[a][b]; e, por isso, foi planejado que o fim deles fosse breve.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sujeito de “entrou” não está expresso no grego; pelo contexto, a referência é ao surgimento dos ídolos ou à idolatria.
    reason: alternative_reading
  - marker: b
    text: 'Ou: “pela vaidade humana”. O termo grego indica glória vazia, presunção ou vanglória.'
    reason: lexical_alternative
  - marker: c
    text: O grego emprega uma forma passiva e não declara quem planejou que o fim deles fosse breve.
    reason: alternative_reading
lexical_decisions:
- source_word: κενοδοξίᾳ ἀνθρώπων
  choice: pela vanglória humana
  rationale: O dativo tem valor instrumental ou causal. “Vanglória” expressa a ideia de glória vazia e presunçosa com mais precisão que o termo mais amplo “orgulho”.
- source_word: εἰσῆλθεν εἰς κόσμον
  choice: entrou no mundo
  rationale: O português permite omitir o sujeito, preservando a ausência de sujeito expresso no grego e deixando que o contexto indique a referência à idolatria ou ao surgimento dos ídolos.
- source_word: διὰ τοῦτο
  choice: por isso
  rationale: Mantém de modo claro e natural a relação causal ou consequencial.
- source_word: αὐτῶν τέλος
  choice: o fim deles
  rationale: Conserva o pronome plural, que no contexto remete mais naturalmente aos ídolos ou às imagens, sem substituir a referência por uma interpretação explícita.
- source_word: σύντομον
  choice: breve
  rationale: Indica que o fim viria em pouco tempo, preservando a formulação concisa do grego sem intensificá-la como “repentino”.
- source_word: ἐπενόηθη
  choice: planejou-se
  rationale: A construção impessoal é natural em português e conserva a ideia de um fim concebido ou planejado sem nomear o agente.
theological_decisions:
- issue: Sujeito implícito de εἰσῆλθεν
  choice: 'O sujeito permanece sem expressão explícita: “entrou no mundo”.'
  alternative: “A idolatria entrou no mundo” ou “ela entrou no mundo”.
  rationale: O grego deixa o sujeito implícito. Como o português admite sujeito nulo, não é necessário identificar expressamente a referência e assim se preserva a ambiguidade contextual.
- issue: Agente de ἐπενόηθη
  choice: 'Construção impessoal: “planejou-se”.'
  alternative: “Deus planejou” ou “foi determinado”.
  rationale: O texto não identifica quem concebeu ou planejou esse fim. A tradução evita inserir Deus como agente e também evita transformar a formulação deliberativa em mera fatalidade.
translation_notes:
  register: Português moderno, digno e acessível, com pontuação que esclarece as duas relações causais. A omissão do sujeito é idiomática em português e preserva melhor que um pronome a ambiguidade do original.
