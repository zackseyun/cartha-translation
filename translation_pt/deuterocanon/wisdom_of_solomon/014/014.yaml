review_pass:
  verdict: revise
  source_fidelity: A primeira oração traduz adequadamente κενοδοξίᾳ γὰρ ἀνθρώπων εἰσῆλθεν εἰς κόσμον. A omissão do sujeito é possível em português e preserva a elipse grega. Na segunda, porém, «planejou-se» converte a voz passiva grega ἐπενόηθη numa construção impessoal ativa. Embora o agente continue não expresso, uma passiva portuguesa representa com maior precisão a forma e a abertura do original.
  naturalness: «Pois pela vanglória humana entrou no mundo» é fluente em registro bíblico-literário moderno. «Foi planejado que o fim deles fosse breve» é claro, natural e preserva a relação proposicional expressa pelo grego.
  terminology: «Vanglória» é uma boa equivalência para κενοδοξία, mais precisa que «vaidade» para a ideia de glória vazia. «Fim» e «breve» reproduzem adequadamente τέλος e σύντομον. A referência plural em «deles» é mantida sem explicitar indevidamente o referente.
