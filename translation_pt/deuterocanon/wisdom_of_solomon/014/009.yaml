  text: For the ungodly man and his ungodliness are equally hateful to God;[a]
translation:
  language: pt
  text: Pois tanto o ímpio como a sua impiedade são igualmente odiosos a Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Pois tanto o ímpio como a sua impiedade são igualmente odiados por Deus».'
