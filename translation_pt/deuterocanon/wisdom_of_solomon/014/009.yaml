lexical_decisions:
- source_word: ἐν ἴσῳ
  choice: igualmente
  rationale: Preserva de modo conciso e natural a ideia de igualdade expressa pelo idioma grego.
- source_word: μισητά
  choice: odiosos
  rationale: 'Mantém a força do adjetivo predicativo: tanto a pessoa como sua impiedade são objetos do ódio divino, sem suavizar a afirmação.'
- source_word: θεῷ
  choice: a Deus
  rationale: O dativo grego é expresso naturalmente em português com a preposição «a» após «odiosos».
- source_word: ὁ ἀσεβῶν
  choice: o ímpio
  rationale: O particípio substantivado masculino singular designa aquele caracterizado pela impiedade; «o ímpio» é corrente, digno e fiel à forma.
- source_word: ἡ ἀσέβεια αὐτοῦ
  choice: a sua impiedade
  rationale: Preserva a relação lexical entre «ímpio» e «impiedade» e mantém a referência do pronome ao indivíduo mencionado.
theological_decisions:
- issue: O ódio divino dirigido tanto ao ímpio como à sua impiedade
  choice: A tradução afirma que o ímpio e sua impiedade são igualmente odiosos a Deus.
  alternative: Traduzir de modo a restringir o ódio divino somente ao pecado.
  rationale: O grego inclui explicitamente tanto ὁ ἀσεβῶν como ἡ ἀσέβεια αὐτοῦ sob o predicado μισητά θεῷ. A redação conserva essa tensão sem ampliá-la para uma doutrina sistemática.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Ímpio» e «impiedade» preservam a relação cognata do grego; a ordem com «tanto... como» torna natural a coordenação enfática.
