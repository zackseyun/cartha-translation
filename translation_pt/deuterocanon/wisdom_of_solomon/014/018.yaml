base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/018.yaml
  text: And the ambition of the craftsman urged on even those who were ignorant toward an intensification of worship[a].
translation:
  language: pt
  text: E a ambição do artesão impeliu até os que não tinham conhecimento a intensificar o culto[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a aumentar a religião” ou “a acentuar a observância religiosa”.'
    reason: Alternativas lexicais para ἐπίτασιν θρησκείας, expressão que pode indicar aumento da religião, do culto ou da observância religiosa.
lexical_decisions:
- source_word: ἐπίτασιν
  choice: intensificar
  rationale: O substantivo indica aumento de força ou intensidade. A construção verbal “a intensificar” é natural em português e conserva a ideia de que a ambição do artesão levou a uma expressão mais intensa ou elaborada do culto.
- source_word: θρησκείας
  choice: culto
  rationale: No contexto de idolatria, θρησκεία se refere sobretudo à prática devocional ou observância cultual. “Culto” comunica essa dimensão concreta sem transformar o termo em uma abstração teológica.
- source_word: ἀγνοοῦντας
  choice: os que não tinham conhecimento
  rationale: O particípio designa pessoas que desconheciam ou não compreendiam algo, sem explicitar o objeto desse desconhecimento. A tradução mantém essa indefinição e evita o tom depreciativo de “os ignorantes”.
- source_word: τεχνίτου
  choice: artesão
  rationale: O termo designa o artífice que produz a imagem. “Artesão” preserva a ideia de trabalho manual habilidoso e é corrente em português.
- source_word: προετρέψατο
  choice: impeliu
  rationale: O verbo expressa incentivo ou impulso para determinada direção. “Impeliu” conserva a força do movimento promovido pela ambição do artesão sem sugerir necessariamente coerção.
- source_word: φιλοτιμία
  choice: ambição
  rationale: Embora literalmente ligado ao amor pela honra ou distinção, o termo frequentemente significa ambição. Aqui descreve a busca do artesão por prestígio, que contribuiu para ampliar o culto idólatra.
theological_decisions:
- issue: Tradução de θρησκεία em uma crítica à idolatria
  choice: culto
  alternative: religião; observância religiosa
  rationale: “Culto” põe em primeiro plano a prática devocional dirigida à imagem, de acordo com o contexto imediato, sem importar uma noção posterior ou sistemática de religião.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A forma “os que não tinham conhecimento” preserva a indefinição do grego quanto ao objeto da ignorância; “a intensificar o culto” torna natural em português a construção nominal grega.
