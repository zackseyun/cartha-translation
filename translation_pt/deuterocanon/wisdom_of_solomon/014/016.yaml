base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/016.yaml
  text: Then[a], as time passed, that ungodly custom grew strong and was kept as a law[b], and by the commands of tyrants the carved images were worshiped.
translation:
  language: pt
  text: Então, com o passar do tempo[a], esse costume ímpio se consolidou e foi observado como lei; e, por ordens dos tiranos, as imagens esculpidas[b] eram adoradas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no decorrer do tempo”. A expressão grega indica um desenvolvimento gradual.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os objetos esculpidos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα ἐν χρόνῳ
  choice: Então, com o passar do tempo
  rationale: Mantém tanto a progressão do argumento marcada por εἶτα quanto o desenvolvimento gradual expresso por ἐν χρόνῳ, em português natural.
- source_word: κρατυνθὲν
  choice: se consolidou
  rationale: O particípio de κρατύνω indica que o costume se tornou forte ou firmemente estabelecido. “Se consolidou” expressa esse processo sem sugerir necessariamente um agente explícito.
- source_word: τὸ ἀσεβὲς ἔθος
  choice: esse costume ímpio
  rationale: “Costume” corresponde a ἔθος, e “ímpio” preserva a avaliação moral e religiosa de ἀσεβές. O demonstrativo liga a expressão à prática descrita no contexto anterior.
- source_word: ὡς νόμος ἐφυλάχθη
  choice: passou a ser observado como lei
  rationale: φυλάσσω, neste contexto, tem o sentido de guardar ou observar; ὡς νόμος indica que o costume recebeu força normativa semelhante à de uma lei. “Passou a” torna clara a progressão temporal sem alterar o sentido.
- source_word: τυράννων ἐπιταγαῖς
  choice: por ordem de tiranos
  rationale: “Ordem” traduz de modo idiomático ἐπιταγαῖς, enquanto “tiranos” preserva a carga crítica de τυράννων, sem neutralizá-la como simples referência a governantes.
- source_word: ἐθρησκεύετο
  choice: eram adoradas
  rationale: O verbo denota culto ou observância religiosa. No contexto de imagens, “eram adoradas” comunica diretamente o ato de culto.
- source_word: τὰ γλυπτά
  choice: as imagens esculpidas
  rationale: A expressão designa objetos produzidos por entalhe ou escultura. “Imagens esculpidas” preserva esse aspecto material e evita tanto o arcaísmo de “imagens de escultura” quanto a interpretação mais ampla de “ídolos”.
theological_decisions:
- issue: Se τυράννων deve ser vertido de forma neutra ou crítica
  choice: tiranos
  alternative: governantes
  rationale: O termo grego tem força avaliativa neste contexto de imposição política do culto. “Tiranos” conserva essa crítica sem acrescentar uma doutrina externa.
- issue: Se τὰ γλυπτά deve ser traduzido interpretativamente como “ídolos”
  choice: imagens esculpidas
  alternative: ídolos
  rationale: O grego destaca a natureza fabricada e esculpida dos objetos; seu caráter idólatra já fica evidente pelo verbo “adoradas”.
- issue: Como representar ὡς νόμος
  choice: como lei
  alternative: como se fosse lei
  rationale: A construção grega admite a ideia de que o costume era observado na qualidade ou com a força de lei. “Como lei” preserva a concisão e a leve abertura sem decidir se havia promulgação jurídica formal.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção mantém a progressão do argumento e a crítica religiosa e política do grego, evitando linguagem arcaica.
