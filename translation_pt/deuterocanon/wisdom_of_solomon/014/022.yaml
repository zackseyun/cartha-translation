base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/022.yaml
  text: Then it was not enough for them to go astray concerning the knowledge of God[a], but also, living in a great war of ignorance[b], they call such great evils peace.
translation:
  language: pt
  text: Então, não lhes bastou desviar-se quanto ao conhecimento de Deus[a]; além disso, vivendo numa grande guerra de ignorância[b], chamam de paz males tão grandes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ser desencaminhados quanto ao conhecimento de Deus”. O infinitivo grego também pode ser entendido com um matiz mais passivo.'
    reason: lexical_alternative
  - marker: b
    text: 'A expressão “uma grande guerra de ignorância” preserva a metáfora grega: eles vivem dominados pela ignorância como se estivessem em estado de guerra ou de profundo conflito.'
    reason: cultural_note
lexical_decisions:
- source_word: Εἶτʼ
  choice: Então
  rationale: Marca a progressão do argumento sem acrescentar uma relação lógica mais específica do que o grego exige.
- source_word: οὐκ ἤρκεσεν
  choice: não lhes bastou
  rationale: Expressa de modo natural em português a construção impessoal grega, deixando explícitos pelo contexto aqueles a quem o erro não bastou.
- source_word: τὸ πλανᾶσθαι
  choice: desviar-se
  rationale: Preserva a ideia de afastamento intelectual e moral, sem decidir indevidamente se a forma média/passiva indica ação própria ou influência externa.
- source_word: περὶ τὴν τοῦ θεοῦ γνῶσιν
  choice: quanto ao conhecimento de Deus
  rationale: Mantém o caráter formal e a densidade teológica de γνῶσις, com formulação natural em português.
- source_word: μεγάλῳ ... ἀγνοίας πολέμῳ
  choice: numa grande guerra de ignorância
  rationale: Conserva a metáfora explícita de πόλεμος e a relação genitiva aberta de ἀγνοίας, sem reduzi-la a mera confusão.
- source_word: ζῶντες
  choice: vivendo
  rationale: Mantém a forma circunstancial do particípio e sua ligação direta com o verbo principal.
- source_word: τὰ τοσαῦτα κακὰ
  choice: males tão grandes
  rationale: Comunica a intensidade ou magnitude expressa por τοσαῦτα e soa idiomático em português.
- source_word: εἰρήνην
  choice: paz
  rationale: Preserva o termo simples do original e o contraste irônico com a guerra e os males.
- source_word: προσαγορεύουσιν
  choice: chamam de
  rationale: É a maneira corrente e precisa de expressar em português o ato de dar a esses males o nome de paz.
theological_decisions:
- issue: Se πλανᾶσθαι deve ser traduzido com sentido explicitamente passivo
  choice: desviar-se
  alternative: ser desencaminhados
  rationale: A forma grega admite matiz médio ou passivo. A tradução principal preserva o fato do desvio sem atribuir sua causa; a nota registra a alternativa passiva.
- issue: Se εἰρήνην deve ser ampliado para incluir segurança ou ordem
  choice: paz
  alternative: segurança
  rationale: O grego traz somente εἰρήνην. Manter “paz” conserva a ironia e evita introduzir conceitos não explicitados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora incomum do original foi preservada, e o ponto e vírgula ajuda a tornar clara a progressão entre o desvio e a denominação irônica dos males como paz.
