base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/012.yaml
  text: For the beginning of sexual immorality is the devising of idols[b][a], and the invention of them is the corruption of life.
translation:
  language: pt
  text: Pois o princípio[a] da imoralidade sexual é a concepção dos ídolos, e a invenção deles é a corrupção da vida.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a origem”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a ruína da vida” ou “a destruição da vida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀρχὴ
  choice: o princípio
  rationale: Preserva a formulação concisa e a amplitude de ἀρχή, que pode indicar começo, origem ou causa, sem tornar explícita apenas uma dessas nuances.
- source_word: πορνείας
  choice: da imoralidade sexual
  rationale: Expressa de modo atual o sentido amplo de conduta sexual ilícita; não reduz o termo a prostituição nem o transforma diretamente em metáfora de infidelidade religiosa.
- source_word: ἐπίνοια
  choice: a concepção
  rationale: Comunica a ideia de formular ou conceber algo deliberadamente e mantém o paralelismo com a posterior 'invenção'.
- source_word: εἰδώλων
  choice: dos ídolos
  rationale: No contexto judaico-grego e na polêmica da passagem, o termo designa ídolos, não meramente imagens neutras.
- source_word: εὕρεσις
  choice: a invenção
  rationale: Embora possa significar descoberta, aqui se refere ao surgimento dos ídolos como criação humana e corresponde ao paralelismo com ἐπίνοια.
- source_word: αὐτῶν
  choice: deles
  rationale: Retoma claramente 'ídolos' e conserva a relação genitiva do grego.
- source_word: φθορὰ
  choice: a corrupção
  rationale: Mantém tanto a dimensão moral quanto as consequências destrutivas de φθορά, sem restringi-lo à destruição física.
- source_word: ζωῆς
  choice: da vida
  rationale: Reproduz de modo direto o genitivo grego e conserva a expressão breve e abrangente.
theological_decisions:
- issue: Se πορνεία deve ser traduzida literalmente ou interpretada como idolatria ou infidelidade espiritual
  choice: imoralidade sexual
  alternative: idolatria; infidelidade
  rationale: O texto distingue a imoralidade sexual da concepção dos ídolos e estabelece uma relação entre ambas. Traduzir os dois conceitos como idolatria apagaria essa tensão e a afirmação causal do autor.
- issue: Se φθορὰ ζωῆς deve ser explicitada como destruição da vida humana
  choice: corrupção da vida
  alternative: ruína da vida; destruição da vida
  rationale: A formulação compacta preserva a possível abrangência moral e existencial da expressão, sem acrescentar a especificação 'humana', ausente no grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura aforística e o paralelismo do grego foram preservados; as notas registram alternativas legítimas sem resolver indevidamente a amplitude lexical.
