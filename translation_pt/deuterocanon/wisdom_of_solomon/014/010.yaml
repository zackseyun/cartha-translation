  text: For the thing done[a], together with the one who did it, will be punished.
translation:
  language: pt
  text: Pois aquilo que foi feito[a], junto com quem o fez, será castigado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «aquilo que foi produzido». No contexto, a expressão se refere ao ídolo fabricado e a quem o fez.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γάρ
  choice: Pois
  rationale: Expressa de modo natural a relação explicativa com a afirmação anterior.
- source_word: τὸ πραχθέν
  choice: aquilo que foi feito
  rationale: Preserva a amplitude do particípio passivo substantivado, que pode indicar o que foi feito ou produzido, sem inserir explicitamente «ídolo» no texto.
- source_word: σὺν
  choice: junto com
  rationale: Comunica claramente a associação e o destino conjunto daquilo que foi feito e de seu agente.
- source_word: τῷ δράσαντι
  choice: quem o fez
  rationale: Mantém o sentido amplo de «aquele que fez/praticou», ao mesmo tempo que estabelece em português a relação com o referente anterior.
- source_word: κολασθήσεται
  choice: será castigado
  rationale: Traduz com clareza o futuro passivo de κολάζω, que aqui denota punição judicial ou retributiva.
theological_decisions:
- issue: Se o objeto fabricado deve ser identificado explicitamente como ídolo no texto principal
  choice: Manter a expressão geral «aquilo que foi feito».
  alternative: «o ídolo» ou «aquilo que foi fabricado»
  rationale: O contexto aponta para o ídolo e seu fabricante, mas a oração grega emprega termos mais amplos. A formulação geral preserva essa amplitude e deixa que o contexto determine o referente.
translation_notes:
  register: Português moderno, claro e digno, com construção de ampla inteligibilidade. «Aquilo que foi feito» preserva a ambiguidade lexical do grego; «castigado» mantém o caráter punitivo de κολάζω.
