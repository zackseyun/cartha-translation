base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/017.yaml
  text: Since men were not able to honor them in person because they lived far away[a], they reproduced the distant appearance and made a visible image of the honored king[b], so that by their zeal they might flatter the absent one as though present.
translation:
  language: pt
  text: Como as pessoas não podiam honrá-los pessoalmente, por morarem longe, reproduziram a aparência vista de longe[a] e fizeram uma imagem visível do rei honrado, para que, por meio de seu empenho, adulassem[b] o ausente como se estivesse presente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a aparência de longe”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “conquistassem o favor do ausente como se estivesse presente”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς
  choice: honrá-los
  rationale: O pronome relativo retoma os governantes ou reis do contexto anterior; o pronome objeto em português mantém essa referência plural de modo natural.
- source_word: ἐν ὄψει
  choice: pessoalmente
  rationale: A expressão ligada à visão contrasta aqui presença e distância; “pessoalmente” comunica esse sentido em português atual.
- source_word: τιμᾶν
  choice: honrar
  rationale: O verbo indica prestar honra e não exige, nesta oração, linguagem explicitamente cultual.
- source_word: διὰ τὸ μακρὰν οἰκεῖν
  choice: porque moravam longe
  rationale: Expressa de modo claro a causa da impossibilidade de prestar honra na presença dos reis.
- source_word: τὴν πόρρωθεν ὄψιν
  choice: a aparência deles tal como vista de longe
  rationale: Preserva tanto o aspecto visual de ὄψις quanto a ideia espacial de πόρρωθεν, sem reduzir a expressão simplesmente a “retrato”.
- source_word: ἀνατυπωσάμενοι
  choice: reproduziram
  rationale: O particípio descreve a confecção de uma representação segundo um modelo ou aparência.
- source_word: ἐμφανῆ εἰκόνα
  choice: uma imagem visível
  rationale: Mantém o contraste entre a imagem perceptível diante das pessoas e o rei fisicamente ausente.
- source_word: τοῦ τιμωμένου βασιλέως
  choice: do rei que era honrado
  rationale: A forma desenvolvida deixa claro o valor passivo do particípio e evita que “rei honrado” seja entendido apenas como qualidade moral.
- source_word: τὸν ἀπόντα ὡς παρόντα
  choice: o ausente como se estivesse presente
  rationale: Conserva a antítese enfática entre ausência e presença.
- source_word: κολακεύωσιν
  choice: adular
  rationale: O verbo tem tom crítico e significa lisonjear ou procurar agradar servilmente, não apenas prestar honra.
- source_word: διὰ τῆς σπουδῆς
  choice: com seu empenho
  rationale: “Empenho” abrange a dedicação e o esforço empregados na produção da imagem sem atribuir valor necessariamente positivo à ação.
theological_decisions:
- issue: Se τιμᾶν deve receber tradução explicitamente cultual
  choice: honrar
  alternative: adorar; venerar
  rationale: O contexto imediato descreve inicialmente a honra prestada a governantes, embora o argumento mais amplo trate do desenvolvimento da idolatria. “Honrar” preserva essa progressão sem antecipar uma conotação cultual mais forte.
- issue: Força crítica de κολακεύωσιν
  choice: adular
  alternative: conquistar o favor de; lisonjear
  rationale: “Adular” conserva a censura implícita no verbo grego e não transforma a ação em simples homenagem respeitosa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção fluente no padrão brasileiro. A oposição entre presença e ausência foi preservada, assim como o tom crítico de “adular”. Os marcadores [a] e [b] aparecem no texto nos pontos correspondentes às alternativas.
