  text: For blessed is the wood through which righteousness comes[a].
translation:
  language: pt
  text: Pois bendita é a madeira por meio da qual vem a justiça[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «retidão». O termo grego pode indicar tanto a qualidade de ser reto quanto a justiça.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλόγηται
  choice: bendita é
  rationale: O perfeito passivo indica um estado resultante; a ordem «bendita é» mantém a ênfase inicial do grego e soa digna em português.
- source_word: γὰρ
  choice: pois
  rationale: Preserva a ligação explicativa com a afirmação anterior.
- source_word: ξύλον
  choice: madeira
  rationale: Mantém o sentido material sem especificar indevidamente «árvore» nem um objeto particular feito de madeira.
- source_word: δι' οὗ
  choice: por meio da qual
  rationale: Expressa a mediação instrumental e concorda com o antecedente feminino «madeira» em português.
- source_word: γίνεται
  choice: vem
  rationale: Traduz de modo natural a ideia de que algo surge ou se realiza, sem explicitar além do grego como isso acontece.
- source_word: δικαιοσύνη
  choice: justiça
  rationale: Em português, «justiça» é o equivalente natural e abrangente de δικαιοσύνη neste contexto, podendo incluir retidão moral e ação justa; «retidão» permanece uma alternativa possível.
theological_decisions:
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: O termo grego pode abranger tanto justiça quanto retidão moral. «Justiça» preserva melhor a amplitude lexical em português corrente, enquanto a nota registra a alternativa sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com construção concisa. A inversão «bendita é» conserva a ênfase do original sem tornar a frase obscura.
