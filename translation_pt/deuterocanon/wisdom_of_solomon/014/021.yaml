base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/021.yaml
  text: And this became an ambush against life[a], because men, enslaved by calamity or by tyranny, bestowed the incommunicable name on stones and wood.
translation:
  language: pt
  text: E isso se tornou uma cilada contra a vida, pois os seres humanos, escravizados pela calamidade ou pela tirania, atribuíram a pedras e madeira o nome que não se compartilha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o nome incomunicável”. A expressão provavelmente se refere ao nome ou à honra divina, que não devem ser atribuídos a ídolos.'
    reason: alternativa lexical e esclarecimento contextual
lexical_decisions:
- source_word: ἔνεδρον
  choice: cilada
  rationale: Preserva a imagem vívida de uma emboscada ou armadilha traiçoeira, com formulação natural em português.
- source_word: τῷ βίῳ
  choice: contra a vida
  rationale: No complemento de εἰς ἔνεδρον, exprime o alvo hostil da cilada; “vida” mantém a abrangência do grego.
- source_word: συμφορᾷ
  choice: calamidade
  rationale: Comunica uma circunstância adversa grave e mantém o registro elevado do livro.
- source_word: τυραννίδι
  choice: tirania
  rationale: É o equivalente direto e corrente para domínio tirânico.
- source_word: δουλεύσαντες
  choice: escravizados
  rationale: Retém a força de sujeição e servidão do verbo, mais intensa que a simples ideia de servir.
- source_word: τὸ ἀκοινώνητον ὄνομα
  choice: o nome que não se compartilha
  rationale: Reproduz de modo compreensível o sentido literal de um nome não partilhado, sem explicitar além do texto se se trata do nome divino, de sua honra ou de ambos.
- source_word: λίθοις καὶ ξύλοις
  choice: a pedras e madeira
  rationale: Conserva os materiais concretos mencionados no grego sem acrescentar “imagens” ou “ídolos” ao texto.
- source_word: περιέθεσαν
  choice: atribuíram
  rationale: Neste contexto, o verbo indica colocar ou conferir um nome a algo; “atribuíram” é claro e idiomático.
theological_decisions:
- issue: Sentido de τὸ ἀκοινώνητον ὄνομα no contexto contra a idolatria
  choice: o nome que não se compartilha
  alternative: o nome incomunicável
  rationale: A redação escolhida preserva a exclusividade implícita do nome sem transformar a tradução em explicação doutrinária. A nota registra a formulação teológica tradicional e a provável referência ao nome ou à honra divina.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Cilada” mantém a metáfora do original; “o nome que não se compartilha” evita o possível sentido moderno equivocado de “incomunicável” como incapaz de se comunicar.
