base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/025.yaml
  text: 'and everything is mixed together: blood and murder, theft and deceit, corruption, faithlessness, turmoil, perjury, and confusion over what is good,'
translation:
  language: pt
  text: 'e tudo está misturado: sangue e assassinato[a], roubo e engano, corrupção, infidelidade, tumulto, perjúrio e confusão quanto ao que é bom[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “derramamento de sangue e assassinato”; literalmente, o grego diz “sangue e assassinato”.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega é difícil; também pode significar “perturbação das coisas boas” ou “alvoroço por causa dos bens”.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: tudo
  rationale: O neutro plural tem sentido abrangente; “tudo” preserva de modo natural o alcance total da acusação.
- source_word: ἐπιμὶξ ἔχει
  choice: está misturado
  rationale: Mantém a imagem de mistura indiscriminada que introduz a sequência de males, sem substituí-la por uma interpretação abstrata.
- source_word: αἷμα καὶ φόνος
  choice: sangue e assassinato
  rationale: Conserva a formulação literal e enfática do grego; “sangue” pode implicar derramamento de sangue, enquanto “assassinato” expressa a morte ilícita.
- source_word: κλοπὴ καὶ δόλος
  choice: roubo e engano
  rationale: Termos correntes e claros para apropriação ilícita e fraude ou ardil; preservam o paralelismo nominal da lista.
- source_word: φθορά
  choice: corrupção
  rationale: No catálogo ético, abrange deterioração moral e social sem restringir o termo a destruição física ou depravação específica.
- source_word: ἀπιστία
  choice: infidelidade
  rationale: O contexto favorece falta de lealdade e quebra de confiança, mas “infidelidade” ainda conserva amplitude suficiente e evita restringir o termo à incredulidade doutrinária.
- source_word: τάραχος
  choice: tumulto
  rationale: Expressa perturbação, agitação e desordem social em linguagem atual e digna.
- source_word: ἐπιορκία
  choice: perjúrio
  rationale: Designa com precisão juramento falso ou violação da verdade jurada.
- source_word: θόρυβος ἀγαθῶν
  choice: confusão quanto ao que é bom
  rationale: A expressão grega é difícil. Esta tradução comunica possível desorientação moral, mas a nota preserva as leituras mais concretas de perturbação das coisas boas ou alvoroço por causa dos bens.
theological_decisions:
- issue: Sentido de ἀπιστία no catálogo de vícios
  choice: infidelidade
  alternative: incredulidade
  rationale: A enumeração descreve desintegração moral e social, favorecendo falta de fidelidade ou confiabilidade. A alternativa religiosa não é impossível lexicalmente, mas não deve ser imposta neste contexto.
- issue: Sentido de θόρυβος ἀγαθῶν
  choice: confusão quanto ao que é bom
  alternative: perturbação das coisas boas; alvoroço por causa dos bens
  rationale: A construção admite mais de uma relação entre “tumulto” e “coisas boas/bens”. A tradução principal oferece uma leitura ética coerente com o contexto, enquanto a nota mantém a ambiguidade real.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Mantém a estrutura acumulativa do catálogo grego e a pontuação aberta do versículo, que continua no contexto.
