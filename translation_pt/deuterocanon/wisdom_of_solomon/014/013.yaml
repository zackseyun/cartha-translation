  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/013.yaml
  text: For it was not from the beginning[a], nor will it be forever.
translation:
  language: pt
  text: Pois não existia desde o princípio[a], nem existirá para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego deixa o sujeito implícito no contexto; ele pode se referir aos ídolos ou à idolatria.
    reason: alternative_reading
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: Pois não ... nem
  rationale: γάρ introduz a explicação e é traduzido por “Pois”; a correlação negativa οὔτε ... οὔτε é expressa naturalmente em português por “não ... nem”.
- source_word: ἦν
  choice: existia
  rationale: O imperfeito de εἰμί indica existência no passado. “Existia” soa mais natural em português do que “era” quando o sujeito contextual pode ser um ídolo ou a idolatria.
- source_word: ἀπ' ἀρχῆς
  choice: desde o princípio
  rationale: Preserva de modo claro a ideia de não ter existido desde o começo, além de manter o paralelismo temporal com a segunda oração.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: Neste contraste entre origem passada e permanência futura, a expressão idiomática significa duração perpétua; “para sempre” é clara e corrente.
- source_word: ἔσται
  choice: existirá
  rationale: O futuro de εἰμί retoma a noção de existência. “Existirá” mantém o paralelismo com “existia” e evita a formulação pouco natural “será” com sujeito elíptico.
theological_decisions:
- issue: Sujeito implícito no grego
  choice: Manter o sujeito sem nomeá-lo no texto principal, usando a flexão verbal impessoalmente recuperável pelo contexto.
  alternative: Explicitar “o ídolo” ou “a idolatria”.
  rationale: O grego não declara o sujeito e depende do contexto anterior. Como o português permite omitir o pronome, “não existia” preserva melhor essa elipse e evita decidir entre ídolo e idolatria.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A construção concisa conserva a elipse do grego e o contraste entre o princípio e a duração eterna.
