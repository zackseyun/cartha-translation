base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/005.yaml
  text: But you intend that the works of your wisdom should not be idle[a]; therefore even with the smallest piece of wood men entrust their lives, and passing through the waves on a raft[b], they were brought safely through.
translation:
  language: pt
  text: Mas tu queres que as obras da tua sabedoria não fiquem inativas; por isso, as pessoas confiam a própria vida[a] até ao menor pedaço de madeira[b] e, atravessando as ondas numa jangada, foram salvas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a própria alma”. Neste contexto de risco no mar, o sentido provável é “vida”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a um pedaço muito pequeno de madeira”. A expressão destaca a fragilidade da embarcação em contraste com a ação preservadora da sabedoria divina.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλεις
  choice: tu queres
  rationale: Expressa a vontade ou o propósito de Deus. “Queres” mantém o sentido volitivo e a forma direta da segunda pessoa sem reduzir o verbo a mero futuro.
- source_word: μὴ ἀργὰ εἶναι
  choice: não fiquem inativas
  rationale: ἀργός pode indicar aquilo que está ocioso, inativo ou improdutivo. A formulação é natural em português e preserva a imagem das obras que não permanecem sem ação.
- source_word: τὰ τῆς σοφίας σου ἔργα
  choice: as obras da tua sabedoria
  rationale: Mantém a relação genitiva e a força teológica da sabedoria divina, sem decidir se a sabedoria é aqui apenas atributo ou agente personificado.
- source_word: διὰ τοῦτο
  choice: por isso
  rationale: Conector inferencial corrente e claro, ligando o propósito divino ao exemplo da preservação no mar.
- source_word: ἐλαχίστῳ ξύλῳ
  choice: até ao menor pedaço de madeira
  rationale: O superlativo ἐλαχίστῳ ressalta a pequenez e fragilidade do material. O dativo é entendido com πιστεύουσιν como aquilo ao qual a vida é confiada.
- source_word: πιστεύουσιν
  choice: confiam
  rationale: Com ψυχάς como objeto e o dativo do meio ou objeto de confiança, o verbo descreve a entrega da própria vida aos cuidados de algo.
- source_word: ψυχάς
  choice: a própria vida
  rationale: No contexto de perigo marítimo, ψυχή designa a vida que se arrisca, embora o sentido lexical “alma” permaneça possível e seja registrado em nota.
- source_word: κλύδωνα
  choice: as ondas
  rationale: κλύδων indica a agitação, vaga ou onda do mar. O plural idiomático “as ondas” comunica naturalmente o perigo marítimo em português.
- source_word: σχεδίᾳ
  choice: numa jangada
  rationale: σχεδία designa uma jangada ou plataforma flutuante improvisada; “jangada” é a equivalência concreta e direta.
- source_word: διεσώθησαν
  choice: foram conduzidas a salvo
  rationale: Preserva a voz passiva e a ideia intensificada de atravessar o perigo em segurança, sem explicitar além do texto quem executou a preservação.
theological_decisions:
- issue: Referência de “tua sabedoria” e ação da providência divina na preservação marítima
  choice: Manter a referência direta a Deus e atribuir eficácia às obras da sua sabedoria, sem definir a Sabedoria como pessoa distinta.
  alternative: Traduzir de modo que a Sabedoria apareça explicitamente como agente pessoal ou, no extremo oposto, reduzir a expressão à simples organização sábia de Deus.
  rationale: O grego dirige-se a Deus na segunda pessoa e fala das “obras da tua sabedoria”. A tradução conserva a tensão entre atributo divino e personificação sem impor uma formulação metafísica ausente do versículo.
- issue: Agente implícito da preservação em διεσώθησαν
  choice: 'Conservar a voz passiva: “foram conduzidas a salvo”.'
  alternative: Explicitar “tu as salvaste” ou usar a forma ativa “chegaram a salvo”.
  rationale: A voz passiva permite que o contexto sugira a ação preservadora de Deus sem inserir um sujeito que o verbo grego não declara expressamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservou-se o tratamento singular “tu”, próprio da oração dirigida a Deus, e evitou-se linguagem excessivamente técnica. “Até ao” mantém a regência de “confiar algo a” e é internacionalmente inteligível; a concordância no feminino plural de “conduzidas” retoma “as pessoas”.
