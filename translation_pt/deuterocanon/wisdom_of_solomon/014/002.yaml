  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/002.yaml
  text: For it was desire for profit that devised that one[a], and skillful wisdom constructed it;
translation:
  language: pt
  text: Pois foi o desejo de lucro que concebeu aquela embarcação[a], e a sabedoria habilidosa a construiu;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. «aquilo». O demonstrativo grego provavelmente retoma a embarcação mencionada no versículo anterior. A expressão «desejo de lucro» também pode ser traduzida por «desejo de ganho».
    reason: Referente contextual e alternativa lexical.
lexical_decisions:
- source_word: ἐκείνο
  choice: aquela embarcação
  rationale: O demonstrativo neutro retoma a embarcação do versículo anterior. Explicitar o referente produz português natural, enquanto «aquela» preserva a força demonstrativa.
- source_word: ὄρεξις πορισμῶν
  choice: desejo de lucro
  rationale: A expressão indica o impulso de obter ganho, provavelmente no contexto de comércio marítimo. «Desejo de lucro» é claro e mantém a motivação econômica.
- source_word: ἐπενόησεν
  choice: concebeu
  rationale: O verbo descreve a formulação mental da ideia; «concebeu» contrasta naturalmente com a construção material expressa no segundo membro.
- source_word: τεχνῖτις σοφία
  choice: sabedoria habilidosa
  rationale: Mantém «sabedoria» para σοφία, termo temático do livro, e usa «habilidosa» para comunicar a competência artesanal de τεχνῖτις.
- source_word: κατεσκεύασεν
  choice: construiu
  rationale: No contexto de uma embarcação, o verbo designa sua preparação ou fabricação concreta; «construiu» é direto e idiomático.
theological_decisions:
- issue: Tradução de σοφία em contexto de habilidade artesanal
  choice: sabedoria
  alternative: habilidade; perícia
  rationale: A retenção de «sabedoria» preserva a ressonância literária e teológica central do livro, enquanto «habilidosa» fornece a nuance técnica e artesanal exigida pelo contexto.
translation_notes:
  register: Português moderno, digno e acessível, com ordem sintática natural. A explicitação de «embarcação» evita o pouco idiomático «aquilo» sem eliminar a força demonstrativa; o paralelismo entre concepção e construção foi preservado.
