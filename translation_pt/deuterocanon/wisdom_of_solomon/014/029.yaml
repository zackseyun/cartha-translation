base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/029.yaml
  text: For because they trusted in lifeless idols[b][a], after swearing wickedly they do not expect to be harmed.
translation:
  language: pt
  text: Pois, porque confiam em ídolos sem vida[a], depois de jurarem de modo perverso, não esperam sofrer nenhum dano[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ídolos vazios” ou “ídolos sem valor”. O adjetivo grego ressalta que os ídolos carecem de realidade ou poder efetivo.
    reason: lexical_alternative
  - marker: b
    text: Ou “não esperam ser injustiçados” ou “não esperam ser castigados”. O grego pode indicar, de modo geral, sofrer algum mal; neste contexto, pode sugerir que não temem retribuição por jurarem de modo perverso.
    reason: alternative_reading
lexical_decisions:
- source_word: αἴγνιοι
  choice: sem vida
  rationale: O adjetivo caracteriza os ídolos como destituídos de realidade ou poder efetivo. “Sem vida” comunica isso com clareza, enquanto a nota preserva alternativas como “vazios” e “sem valor”.
- source_word: πεποιθότες
  choice: por confiarem
  rationale: O particípio perfeito expressa confiança já depositada e persistente; a construção causal em português se liga naturalmente ao γάρ e à consequência descrita.
- source_word: εἰδώλοις
  choice: ídolos
  rationale: No contexto, o termo designa imagens cultuais tratadas como deuses; “ídolos” preserva a crítica religiosa do texto.
- source_word: κακῶς
  choice: de modo perverso
  rationale: O advérbio qualifica moralmente o ato de jurar. A formulação mantém a amplitude ética do grego sem restringi-lo necessariamente a jurar falsamente.
- source_word: ὀμόσαντες
  choice: depois de jurarem
  rationale: O particípio aoristo é expresso como ação anterior à expectativa mencionada na oração principal, sem acrescentar um objeto ausente no grego.
- source_word: ἀδικηθῆναι
  choice: sofrer nenhum dano
  rationale: A expressão portuguesa preserva o sentido amplo de sofrer mal, prejuízo ou consequência adversa, sem decidir se se trata especificamente de castigo.
- source_word: οὐ προσδέχονται
  choice: não esperam
  rationale: Tradução direta e corrente da ideia de não aguardar nem prever determinada consequência.
theological_decisions:
- issue: Sentido da consequência esperada após o juramento perverso
  choice: Eles não esperam sofrer dano algum porque confiam em ídolos sem vida.
  alternative: Eles não esperam ser injustiçados; ou não esperam ser castigados por terem jurado falsamente.
  rationale: O infinitivo ἀδικηθῆναι é amplo. “Sofrer nenhum dano” mantém aberta a referência a prejuízo, retribuição ou castigo, sem impor uma interpretação mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura causal foi explicitada por “por confiarem”, e a ambiguidade da consequência foi preservada no texto e explicada em nota.
