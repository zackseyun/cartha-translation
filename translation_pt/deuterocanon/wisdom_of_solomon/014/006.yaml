base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/006.yaml
  text: For when the proud giants were being destroyed at the beginning[a], the hope of the world, taking refuge on a raft, left to the age to come a seed of generation[b], steered by your hand.
translation:
  language: pt
  text: Pois, quando, no princípio, os gigantes soberbos estavam sendo destruídos, a esperança do mundo, refugiando-se numa jangada[a] que a tua mão conduziu, deixou para a era futura uma semente de geração[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “numa embarcação” ou “num pequeno barco”. O grego diz literalmente “jangada”, termo retoricamente marcado, em vez da palavra habitual para navio ou arca.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma semente para a posteridade” ou “uma semente de origem”. O grego distingue “mundo” (κόσμος), usado antes no versículo, de “era” (αἰών) nesta expressão; “geração” traduz literalmente γενέσεως.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχῆς
  choice: no princípio
  rationale: Expressa o valor temporal do genitivo e remete ao período primordial do juízo.
- source_word: ἀπολλυμένων
  choice: estavam sendo destruídos
  rationale: Preserva o aspecto durativo do particípio presente e sua forma passiva, sem explicitar o agente.
- source_word: ὑπερηφάνων γιγάντων
  choice: gigantes soberbos
  rationale: Mantém a referência aos gigantes da tradição primeva e o sentido moral de arrogância.
- source_word: ἡ ἐλπὶς τοῦ κόσμου
  choice: a esperança do mundo
  rationale: Conserva a personificação e não decide se a expressão designa Noé, o remanescente humano ou a esperança em sentido mais abstrato.
- source_word: ἐπὶ σχεδίας
  choice: numa jangada
  rationale: σχεδία designa propriamente uma jangada ou embarcação improvisada, termo retoricamente marcado no contexto da arca.
- source_word: καταφυγοῦσα
  choice: refugiando-se
  rationale: Expressa a busca de proteção, e não apenas a fuga.
- source_word: τῷ αἰῶνι
  choice: para a era futura
  rationale: Mantém a dimensão temporal de αἰών e a distingue de κόσμος, já traduzido como 'mundo'.
- source_word: σπέρμα γενέσεως
  choice: uma semente de geração
  rationale: Preserva a metáfora da semente e evita acrescentar 'nova', ausente do grego, embora a formulação permaneça deliberadamente marcada.
- source_word: τῇ σῇ κυβερνηθείσῃ χειρί
  choice: conduzida pela tua mão
  rationale: Retém a agência divina e permite a nuance náutica de κυβερνάω sem produzir uma formulação artificial em português.
theological_decisions:
- issue: Referente de 'a esperança do mundo'
  choice: Manter a expressão personificada sem identificar explicitamente seu referente
  alternative: Explicitar Noé ou o remanescente humano preservado
  rationale: A concordância gramatical se dá com 'esperança', enquanto o contexto permite uma referência concreta a Noé e ao remanescente; a tradução preserva essa tensão.
- issue: Distinção entre κόσμος e αἰών
  choice: Traduzir κόσμος por 'mundo' e αἰών por 'era futura'
  alternative: Traduzir ambos por 'mundo' ou usar 'posteridade' para αἰών
  rationale: A diferenciação lexical do grego deve permanecer perceptível, e o contexto de continuidade humana favorece o valor temporal de αἰών.
- issue: Agência divina na preservação
  choice: Manter 'conduzida pela tua mão'
  alternative: Parafrasear como 'preservada por ti'
  rationale: A redação mantém a imagem concreta de pilotagem e a ação divina sem reduzir a metáfora a uma conclusão teológica abstrata.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A ordem foi levemente ajustada para a fluência, mantendo a estrutura elevada e as ambiguidades do grego. 'Jangada' e 'semente de geração' são escolhas deliberadamente marcadas por refletirem o léxico incomum do original.
