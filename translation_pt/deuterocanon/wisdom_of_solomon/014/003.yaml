  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/003.yaml
  text: But your providence[a], Father, steers it, because you gave a way even in the sea, and a safe path in the waves,
translation:
  language: pt
  text: Mas a tua providência, Pai, o conduz[a], pois deste um caminho até no mar e uma vereda segura entre as ondas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o governa” ou “o pilota”; o verbo grego tem sentido náutico, de acordo com a imagem do navio no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακυβερνᾷ
  choice: conduz
  rationale: O verbo tem sentido náutico de governar ou pilotar uma embarcação. “Conduz” preserva a ação orientadora e soa natural em português; a nota registra a imagem marítima mais concreta.
- source_word: πρόνοια
  choice: providência
  rationale: O termo reúne previsão e cuidado divino ativo. “Providência” conserva seu peso teológico sem acrescentar uma formulação doutrinária alheia ao texto.
- source_word: πάτερ
  choice: Pai
  rationale: Mantém o vocativo e a forma pessoal de dirigir-se a Deus, em linguagem direta e atual.
- source_word: ἔδωκας
  choice: deste
  rationale: Reproduz diretamente o aoristo de δίδωμι e permanece natural em português.
- source_word: ὁδὸν
  choice: um caminho
  rationale: É uma tradução corrente e preserva a imagem bíblica de um caminho no mar.
- source_word: τρίβον
  choice: uma vereda
  rationale: Distingue τρίβον de ὁδόν e mantém o paralelismo poético sem repetir “caminho”.
- source_word: ἀσφαλῆ
  choice: segura
  rationale: Expressa de modo claro que a vereda está livre de perigo.
- source_word: ἐν θαλάσσῃ
  choice: no mar
  rationale: Conserva a preposição e a formulação marcante do grego, sem perder naturalidade.
- source_word: ἐν κύμασι
  choice: entre as ondas
  rationale: Em português, “entre as ondas” comunica naturalmente o percurso em meio a elas e sustenta a imagem marítima.
theological_decisions:
- issue: Sentido de πρόνοια quando atribuído a Deus
  choice: providência
  alternative: cuidado; previsão
  rationale: “Providência” abrange tanto a previsão quanto o cuidado governante de Deus no contexto, preservando a densidade teológica e a ação divina sem definir além do que o verso afirma.
- issue: Referente do objeto implícito em διακυβερνᾷ
  choice: o conduz
  alternative: conduz a embarcação; o pilota
  rationale: O pronome retoma naturalmente o navio do contexto imediato, sem inserir novamente um substantivo ausente neste versículo; a tradução mantém a metáfora náutica disponível na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural para brasileiros. O paralelismo entre “caminho” e “vereda” foi preservado, assim como a invocação direta “Pai” e a imagem marítima do original.
