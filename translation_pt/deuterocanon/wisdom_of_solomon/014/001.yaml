  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/001.yaml
  text: Again[a], someone preparing to sail and about to pass through wild waves boards more fragile wood than the ship that carries him.
translation:
  language: pt
  text: De novo, um homem que se prepara para navegar e está prestes a atravessar ondas bravias sobe a bordo de uma madeira mais frágil[a] do que o navio que o transporta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «uma madeira mais apodrecida». O comparativo grego pode indicar falta de solidez ou deterioração física, além de fragilidade geral.'
    reason: alternativa lexical
lexical_decisions:
- source_word: τις
  choice: um homem
  rationale: O pronome indefinido masculino singular apresenta um caso humano representativo; a formulação é natural em português e mantém a forma do grego.
- source_word: πάλιν
  choice: De novo
  rationale: Marca a retomada com outro exemplo no desenvolvimento do argumento.
- source_word: στελλόμενος
  choice: que se prepara para navegar
  rationale: No contexto marítimo, o particípio médio expressa preparar-se ou pôr-se a caminho; a tradução explicita naturalmente a viagem por mar.
- source_word: ἄγρια ... κύματα
  choice: ondas bravias
  rationale: Preserva a imagem vívida de ondas ameaçadoras em linguagem corrente e dignificada.
- source_word: διοδεύειν
  choice: atravessar
  rationale: Expressa o movimento de passar através das ondas.
- source_word: τοῦ φέροντος αὐτὸν πλοίου
  choice: o navio que o transporta
  rationale: Reproduz com clareza a função do navio como meio que leva o viajante.
- source_word: σαθρότερον
  choice: menos firme
  rationale: Mantém a comparação e comunica falta de solidez sem restringir o sentido à podridão física.
- source_word: ξύλον
  choice: madeira
  rationale: Conserva a designação concreta e irônica do navio como objeto de madeira, sem acrescentar uma unidade ausente do grego.
- source_word: ἐπιβᾶται
  choice: embarca
  rationale: Verbo náutico natural para subir a bordo.
theological_decisions:
- issue: Sujeito masculino representativo
  choice: um homem
  alternative: alguém; uma pessoa
  rationale: O grego emprega um indefinido masculino singular como exemplo representativo; a tradução preserva essa forma sem acrescentar especificidade individual.
- issue: Sentido da comparação em σαθρότερον ξύλον
  choice: numa madeira menos firme do que o navio que o transporta
  alternative: numa madeira mais frágil; numa madeira mais apodrecida
  rationale: A expressão mantém a ironia e a força comparativa, mas não decide indevidamente se a falta de solidez consiste em fragilidade geral ou deterioração física.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil; tom digno, com imagem marítima clara e preservação da ambiguidade lexical do comparativo grego.
