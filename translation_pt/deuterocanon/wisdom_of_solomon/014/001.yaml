  source_fidelity: A tradução preserva a sequência argumentativa, o sujeito representativo, as ondas ameaçadoras e a comparação com o navio. Contudo, «menos firme» atenua o sentido de σαθρότερον, que aponta mais diretamente para algo mais frágil, inseguro ou deteriorado. «Mais frágil» conserva melhor a força comparativa sem fechar a ambiguidade em «apodrecida».
  naturalness: '«Embarca numa madeira» não é uma combinação idiomática natural em português: normalmente se embarca num navio, barco ou embarcação. «Sobe a bordo de uma madeira» é deliberadamente incomum, mas é compreensível e preserva a estranheza irônica do ξύλον, em vez de transformar a madeira num nome normal de embarcação.'
  terminology: «Ondas bravias» e «o navio que o transporta» são claros e adequados ao registro. «Um homem» pode legitimamente representar τις, embora «alguém» também fosse possível. A nota deve corresponder ao comparativo adotado e explicitar a alternativa de deterioração física.
