base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/014/027.yaml
  text: For the worship of nameless idols is the beginning and cause and end of every evil[a][b].
translation:
  language: pt
  text: Pois o culto aos ídolos sem nome é o princípio, a causa e o fim de todo mal.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ídolos que não têm nome”. O adjetivo grego pode enfatizar que esses ídolos não possuem nome verdadeiro ou digno.
    reason: lexical_alternative
  - marker: b
    text: A sequência “princípio, causa e fim” também pode ser entendida como “origem, causa e culminação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: θρησκεία
  choice: culto
  rationale: Neste contexto, refere-se à prática religiosa dirigida aos ídolos. “Culto” é natural em português e preserva melhor que “religião” o foco na devoção ou observância idolátrica.
- source_word: ἀνωνύμων
  choice: sem nome
  rationale: Traduz diretamente a ideia de algo não nomeado ou destituído de nome, sem definir se os ídolos carecem de identidade verdadeira ou são indignos de ser nomeados.
- source_word: εἰδώλων
  choice: ídolos
  rationale: No contexto polêmico de Sabedoria, designa falsas divindades representadas por imagens; “ídolos” comunica esse sentido religioso com clareza.
- source_word: παντὸς ... κακοῦ
  choice: todo mal
  rationale: A expressão genitiva é abrangente; “todo mal” é idiomático, solene e preserva a amplitude da afirmação.
- source_word: ἀρχὴ
  choice: princípio
  rationale: Preserva a estrutura retórica da tríade e pode exprimir tanto começo quanto origem, sem ampliar a interpretação.
- source_word: αἰτία
  choice: causa
  rationale: Expressa diretamente a relação causal indicada pelo substantivo grego e mantém a concisão da tríade.
- source_word: πέρας
  choice: fim
  rationale: Conserva a formulação incisiva do grego e deixa abertas as nuances de término, resultado ou culminação.
theological_decisions:
- issue: Como traduzir a tríade ἀρχὴ κακοῦ καὶ αἰτία καὶ πέρας
  choice: o princípio, a causa e o fim de todo mal
  alternative: a origem, a causa e a culminação de todo mal
  rationale: A opção escolhida mantém a forma compacta e enfática do grego, preservando a denúncia abrangente da idolatria e a possível amplitude semântica de πέρας.
- issue: Sentido de ἀνωνύμων em relação aos ídolos
  choice: ídolos sem nome
  alternative: ídolos anônimos
  rationale: “Sem nome” mantém a ambiguidade do original quanto a esses ídolos não terem identidade verdadeira, nome digno ou designação legítima; “anônimos” seria menos natural e poderia sugerir apenas desconhecimento humano.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da tríade grega foi preservada, e as notas registram alternativas legítimas sem resolver a ambiguidade do texto.
