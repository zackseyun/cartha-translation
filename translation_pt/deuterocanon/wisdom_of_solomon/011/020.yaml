base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/020.yaml
  text: And even apart from these things, they could have fallen by a single breath, pursued by justice and winnowed by the breath of your power; but you have arranged all things by measure and number and weight.
translation:
  language: pt
  text: Mesmo sem essas coisas, eles poderiam ter caído por um só sopro[a], perseguidos pela justiça[b] e joeirados pelo sopro do teu poder; mas dispuseste todas as coisas com medida, número e peso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por um só espírito” ou “por um só vento”; o grego πνεῦμα pode significar “sopro”, “vento” ou “espírito”.
    reason: lexical_alternative
  - marker: b
    text: Ou “perseguidos pelo castigo” ou “impelidos pelo julgamento”; o grego δίκη pode indicar justiça, julgamento ou pena.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ τούτων
  choice: Mesmo sem essas coisas
  rationale: χωρίς com genitivo indica separação ou ausência. A formulação expressa que Deus poderia tê-los derrubado sem recorrer aos meios antes mencionados.
- source_word: ἐνὶ πνεύματι
  choice: com um só sopro
  rationale: ἐνί significa “um só”, e πνεῦμα pode significar sopro, vento ou espírito. “Sopro” combina com a imagem concreta de joeirar e preserva a associação com a ação divina.
- source_word: πεσεῖν
  choice: ter caído
  rationale: Mantém o sentido literal do aoristo infinitivo de πίπτω e, no contexto, deixa implícita a queda destrutiva sem substituí-la interpretativamente por “perecer”.
- source_word: ὑπὸ τῆς δίκης διωχθέντες
  choice: perseguidos pela justiça
  rationale: δίκη pode designar justiça, julgamento ou punição. “Justiça” preserva a personificação de uma ordem moral que os persegue.
- source_word: λικμηθέντες
  choice: joeirados
  rationale: O verbo descreve o ato de joeirar, lançando ao vento para separar a palha. “Joeirados” conserva de modo conciso a metáfora agrícola.
- source_word: ὑπὸ πνεύματος δυνάμεώς σου
  choice: pelo sopro do teu poder
  rationale: A repetição de “sopro” representa a repetição de πνεῦμα e se ajusta à imagem de joeirar; o genitivo δυνάμεώς σου é mantido diretamente como “do teu poder”.
- source_word: ἀλλὰ πάντα ... διέταξας
  choice: mas dispuseste todas as coisas
  rationale: διατάσσω significa ordenar, dispor ou organizar. “Dispuseste” preserva a ideia de ordenação intencional em registro digno e natural.
- source_word: μέτρῳ καὶ ἀριθμῷ καὶ σταθμῷ
  choice: com medida, número e peso
  rationale: Mantém a tríade formal e memorável; σταθμός, neste contexto de pesagem, é adequadamente vertido por “peso”.
theological_decisions:
- issue: Se πνεῦμα deve ser traduzido por “espírito”, “vento” ou “sopro”
  choice: As duas ocorrências são traduzidas por “sopro” no texto principal.
  alternative: “espírito” ou “vento”
  rationale: A imagem de serem joeirados favorece uma força física como sopro ou vento. “Sopro” também preserva a ressonância da ação divina sem impor uma referência pessoal ao Espírito que o grego não exige.
- issue: Se δίκη deve ser traduzido por “justiça”, “julgamento” ou “punição”
  choice: justiça
  alternative: “julgamento” ou “punição”
  rationale: Como δίκη aparece personificada, perseguindo os adversários, “justiça” conserva melhor a dimensão moral e judicial mais ampla; as alternativas permanecem registradas em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem sintática foi suavemente ajustada ao português, enquanto a metáfora agrícola de “joeirados” e a tríade solene “medida, número e peso” foram preservadas.
