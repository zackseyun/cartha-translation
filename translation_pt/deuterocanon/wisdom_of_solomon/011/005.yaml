base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/005.yaml
  text: For by the very things through which their enemies were punished[a], they themselves, when in need, were benefited.
translation:
  language: pt
  text: Pois, por meio das coisas pelas quais os inimigos deles foram castigados, por meio dessas mesmas coisas eles próprios, quando passavam necessidade[a], foram beneficiados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “quando estavam sem saber o que fazer” ou “quando estavam em aflição”. O particípio grego pode indicar perplexidade, desamparo ou necessidade.
    reason: alternativa lexical
lexical_decisions:
- source_word: διʼ ὧν ... διὰ τούτων
  choice: por meio das coisas pelas quais ... por meio dessas mesmas coisas
  rationale: 'Preserva a repetição instrumental do grego e destaca a reversão irônica: os mesmos meios que castigaram os inimigos beneficiaram o povo de Deus.'
- source_word: ἐκολάσθησαν
  choice: foram castigados
  rationale: Expressa com clareza o tratamento punitivo indicado pelo verbo, em linguagem corrente e digna.
- source_word: οἱ ἐχθροὶ αὐτῶν
  choice: os inimigos deles
  rationale: Mantém de modo natural a relação possessiva sem introduzir uma identificação ausente neste versículo.
- source_word: αὐτοὶ
  choice: eles próprios
  rationale: Conserva a ênfase contrastiva do pronome grego em relação aos inimigos.
- source_word: ἀποροῦντες
  choice: quando passavam necessidade
  rationale: No contexto de provisão material, comunica a situação de carência, preservando em nota a amplitude semântica de perplexidade, desamparo ou aflição.
- source_word: εὐεργετήθησαν
  choice: foram beneficiados
  rationale: Mantém a voz passiva e o contraste formal com “foram castigados”, sem explicitar um agente que o versículo deixa implícito.
theological_decisions:
- issue: Reversão instrumental na ação divina
  choice: Preservar a afirmação de que os mesmos meios serviram tanto para castigar os inimigos como para beneficiar o povo.
  alternative: Generalizar o contraste sem repetir a formulação instrumental.
  rationale: A repetição διʼ ὧν ... διὰ τούτων sustenta a força literária e teológica do versículo; mantê-la evita enfraquecer a correspondência intencional entre juízo e benefício.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. A repetição de “por meio” é deliberada para reproduzir a estrutura enfática do grego; “eles próprios” conserva o contraste, e a nota mantém a ambiguidade de ἀποροῦντες.
