  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/001.yaml
  text: He prospered their works by the hand of a holy prophet[a].
translation:
  language: pt
  text: Ele fez prosperar as obras deles pela mão de um profeta santo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pelo contexto, o «profeta santo» é provavelmente Moisés, embora ele não seja nomeado no texto grego deste versículo.
    reason: Referência contextual sem inserir no texto principal uma identificação que o grego não explicita.
lexical_decisions:
- source_word: Εὐόδωσεν
  choice: fez prosperar
  rationale: 'Preserva o sentido causativo do verbo: conceder êxito ou fazer prosperar. O sujeito, implícito no grego, é retomado por «Ele» conforme o contexto, sem acrescentar «Deus» ou «o Senhor».'
- source_word: τὰ ἔργα αὐτῶν
  choice: as obras deles
  rationale: Tradução direta que mantém a amplitude de ἔργα, termo que pode abranger obras, feitos ou empreendimentos.
- source_word: ἐν χειρὶ
  choice: pela mão de
  rationale: Conserva a imagem e o idioma bíblico de mediação ou agência, embora «por meio de» fosse uma alternativa mais corrente.
- source_word: προφήτου ἁγίου
  choice: um profeta santo
  rationale: Mantém a expressão sem artigo definido e não identifica o profeta pelo nome, como também não faz o grego.
theological_decisions:
- issue: Sujeito implícito do verbo
  choice: Ele fez prosperar
  alternative: Deus fez prosperar; O Senhor fez prosperar; Fez prosperar
  rationale: O grego deixa o sujeito implícito. «Ele» permite que o antecedente divino venha do contexto, sem inserir um título ou nome ausente do versículo.
- issue: Identidade do profeta
  choice: um profeta santo
  alternative: Moisés; seu santo profeta
  rationale: O contexto provavelmente aponta para Moisés, mas o texto grego deste versículo não o nomeia nem traz pronome possessivo; a tradução preserva essa medida de indeterminação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação «pela mão de» preserva deliberadamente o idioma bíblico de agência; «por meio de» seria mais coloquial, mas perderia a imagem do original.
