base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/025.yaml
  text: For how could anything have remained[a], if you had not willed it? Or how could what had not been called by you have been preserved?
translation:
  language: pt
  text: Pois como poderia alguma coisa ter continuado a existir, se tu não a tivesses querido? Ou como poderia ter sido preservado aquilo que não foi chamado por ti?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais explícito, «aquilo que não foi chamado à existência por ti». O grego diz simplesmente «chamado», mas, neste contexto, pode referir-se ao chamado criador de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δὲ ἔμεινεν ἄν τι
  choice: Pois como poderia alguma coisa ter continuado a existir
  rationale: A pergunta retórica exprime a impossibilidade de qualquer realidade subsistir sem a vontade de Deus. «Ter continuado a existir» comunica naturalmente o valor contextual de μένω sem reduzir o sentido a mera permanência espacial.
- source_word: εἰ μὴ σὺ ἠθέλησας
  choice: se tu não a tivesses querido
  rationale: O mais-que-perfeito do subjuntivo cria em português a condição irreal exigida pela pergunta. «Querido» preserva o sentido volitivo de θέλω em linguagem corrente e digna.
- source_word: τὸ μὴ κληθὲν ὑπὸ σοῦ
  choice: aquilo que não foi chamado por ti
  rationale: Mantém o verbo κληθέν como «chamado», sem inserir no texto principal o complemento interpretativo «à existência».
- source_word: διετηρήθη
  choice: poderia ter sido preservado
  rationale: O verbo indica que algo foi conservado ou mantido. A formulação passiva preserva a estrutura grega e o paralelismo da pergunta retórica.
theological_decisions:
- issue: Se τὸ μὴ κληθέν deve ser explicitado como um chamado criador à existência
  choice: Manter «aquilo que não foi chamado por ti» no texto principal
  alternative: «aquilo que não foi chamado à existência por ti»
  rationale: O contexto favorece a ideia do chamado criador de Deus, mas o grego diz apenas «chamado». A tradução conserva essa abertura e registra a explicitação contextual em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento «tu» acompanha a apóstrofe direta a Deus; a sintaxe retórica e o paralelismo do grego foram preservados sem rigidez excessiva.
