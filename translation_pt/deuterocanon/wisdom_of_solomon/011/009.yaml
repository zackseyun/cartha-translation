base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/009.yaml
  text: For when they were tested[a], though being disciplined with mercy, they learned how the ungodly were tormented while being judged in wrath[c][b];
translation:
  language: pt
  text: Pois, quando foram postos à prova[a], embora fossem disciplinados[b] com misericórdia, compreenderam como os ímpios[c] eram atormentados ao serem julgados com ira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foram provados”. O grego indica aqui teste ou comprovação, não principalmente incitação ao pecado.
    reason: lexical_alternative
  - marker: b
    text: Ou “fossem instruídos” ou “fossem corrigidos”. O termo grego pode abranger educação, formação e disciplina corretiva.
    reason: lexical_alternative
  - marker: c
    text: Ou “os que não honram a Deus”. O termo grego destaca especialmente a impiedade ou irreverência para com Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειράσθησαν
  choice: foram postos à prova
  rationale: No contexto, o verbo indica passar por uma prova ou teste, não ser induzido ao pecado. A expressão comunica com naturalidade uma experiência que revela ou comprova o caráter.
- source_word: καίπερ
  choice: embora
  rationale: Preserva com clareza a força concessiva do particípio que se segue.
- source_word: ἐν ἐλέει
  choice: com misericórdia
  rationale: Expressa de modo idiomático a maneira misericordiosa pela qual a disciplina ocorreu, mantendo o substantivo ἔλεος.
- source_word: παιδευόμενοι
  choice: fossem disciplinados
  rationale: O verbo abrange educação, formação e correção. Aqui, “disciplinados” preserva o caráter corretivo do sofrimento e seu contraste com o juízo irado dos ímpios.
- source_word: ἔγνωσαν
  choice: compreenderam
  rationale: Indica que chegaram a saber por experiência. “Compreenderam” é natural em português e introduz claramente a comparação que aprenderam a reconhecer.
- source_word: ἐν ὀργῇ
  choice: com ira
  rationale: Mantém a força de ὀργή e apresenta a ira como circunstância ou modo do juízo, sem acrescentar uma formulação doutrinária não explícita.
- source_word: κρινόμενοι
  choice: ao serem julgados
  rationale: Traduz diretamente o processo de julgamento e evita a maior especificidade e finalidade de “condenados”.
- source_word: ἀσεβεῖς
  choice: os ímpios
  rationale: “Ímpios” conserva a dimensão de irreverência ou oposição a Deus própria de ἀσεβής, melhor que um termo moral mais genérico.
- source_word: ἐβασανίζοντο
  choice: eram atormentados
  rationale: Comunica sofrimento intenso sem especificar indevidamente o modo como esse tormento era infligido.
theological_decisions:
- issue: Natureza do sofrimento dos fiéis em contraste com o sofrimento dos ímpios
  choice: A experiência dos primeiros é descrita como prova e disciplina acompanhada de misericórdia; a dos ímpios, como tormento no contexto de um juízo com ira.
  alternative: Traduzir παιδευόμενοι de modo mais pedagógico, como “instruídos”, ou mais punitivo, como “castigados”.
  rationale: O próprio versículo contrapõe uma correção misericordiosa ao juízo irado. “Disciplinados” mantém tanto o sofrimento corretivo quanto a diferença teológica entre os dois tratamentos.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura conserva a concessão e o contraste do grego sem arcaísmos. “Ímpios” é vocabulário bíblico corrente e conciso; as notas esclarecem alternativas sem sobrecarregar o texto.
