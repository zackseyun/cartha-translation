base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/024.yaml
  text: For you love all things that exist[a], and you detest none of the things you made; for if you had hated anything[b], you would not have fashioned it.
translation:
  language: pt
  text: Pois amas tudo o que existe[a] e não abominas nada do que fizeste; porque, se tivesses odiado alguma coisa, não a terias formado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «todas as coisas que existem».
    reason: lexical_alternative
  - marker: b
    text: Ou «preparado» ou «construído». O verbo grego sugere uma ação deliberada e é diferente do verbo traduzido antes por «fizeste».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾷς
  choice: amas
  rationale: Tradução direta do presente de ἀγαπάω, preservando o sentido amplo e positivo de amor sem acrescentar uma nuance emocional específica.
- source_word: τὰ ὄντα πάντα
  choice: tudo o que existe
  rationale: Expressão natural em português que conserva a abrangência ontológica do grego, literalmente «todos os entes» ou «todas as coisas existentes».
- source_word: οὐδὲν βδελύσσῃ
  choice: não abominas nada
  rationale: βδελύσσομαι é um verbo forte, que comunica aversão ou repulsa; «abominar» preserva essa força em registro digno e compreensível.
- source_word: ὧν ἐποίησας
  choice: do que fizeste
  rationale: ποιέω tem o sentido amplo de fazer. A formulação é direta e evita tornar o verbo mais especificamente teológico por meio de «criar».
- source_word: μισῶν τι
  choice: se tivesses odiado alguma coisa
  rationale: O particípio, em conjunto com ἄν e o aoristo da oração principal, exprime uma condição contrária ao fato; esta construção reproduz isso naturalmente em português.
- source_word: κατεσκεύασας
  choice: não a terias formado
  rationale: κατασκευάζω pode significar preparar, construir ou formar. «Formado» comunica ação deliberada e distingue este verbo do anterior, ἐποίησας, sem exagerar a diferença.
theological_decisions:
- issue: Relação entre o amor divino e a criação
  choice: O versículo declara que Deus ama tudo o que existe e não abomina nada do que fez, apoiando isso na afirmação de que não teria formado aquilo que odiasse.
  alternative: Restringir a declaração apenas à bondade original da criação, ou entendê-la como aprovação positiva e irrestrita de todo estado atual das criaturas.
  rationale: O grego abrange diretamente «tudo o que existe» e «o que fizeste». A tradução conserva essa amplitude e a tensão teológica do texto sem introduzir qualificações doutrinárias nem resolver questões metafísicas que o versículo não explica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A segunda pessoa do singular foi mantida por coerência com a invocação direta a Deus. «Abominas» preserva a força do verbo grego; «formado» evita repetir «feito» e reflete, sem exagero, a diferença lexical entre os dois verbos de produção.
