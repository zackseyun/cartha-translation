  text: so that they might know that by the very things through which a person sins[a], by these he is punished.
translation:
  language: pt
  text: para que soubessem que, pelas mesmas coisas com que alguém peca, por essas mesmas é castigado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que soubessem que, por meio daquilo com que alguém peca, por meio disso é castigado”. O grego repete a mesma preposição para enfatizar a correspondência entre o pecado e o castigo.'
    reason: alternativa lexical e esclarecimento da construção grega
lexical_decisions:
- source_word: ἵνα γνῶσιν
  choice: para que soubessem
  rationale: Expressa a finalidade ou o resultado pretendido indicado por ἵνα com o subjuntivo aoristo, em português natural, sem apresentar o conhecimento como resultado já consumado.
- source_word: διʼ ὧν ... διὰ τούτων
  choice: pelas mesmas coisas com que ... por essas mesmas
  rationale: Preserva a repetição instrumental de διά e ressalta a correspondência enfática entre os meios do pecado e os do castigo.
- source_word: τις
  choice: alguém
  rationale: Mantém o sentido indefinido e genérico do singular grego em linguagem portuguesa corrente.
- source_word: ἁμαρτάνει
  choice: peca
  rationale: Conserva de modo direto a força moral e teológica do verbo grego, sem reduzi-lo ao sentido mais genérico de praticar o mal.
- source_word: κολάζεται
  choice: é castigado
  rationale: No contexto, o verbo denota punição ou sofrimento punitivo; “é castigado” comunica isso com clareza e dignidade.
theological_decisions:
- issue: Justiça segundo a correspondência entre pecado e castigo
  choice: O castigo ocorre pelas mesmas coisas com que a pessoa peca.
  alternative: Uma afirmação geral de que o pecador é castigado em conexão com seu pecado, sem salientar a correspondência dos meios.
  rationale: A construção correlativa διʼ ὧν ... διὰ τούτων destaca uma correspondência apropriada entre pecado e castigo. A tradução mantém essa lógica sem especificar além do que o texto declara.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A repetição de “mesmas” torna perceptível a ênfase correlativa do grego sem recorrer a uma formulação excessivamente literal.
