  text: And both those absent and those present were afflicted alike;[a]
translation:
  language: pt
  text: E tanto os ausentes como os presentes eram igualmente afligidos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sofriam”, “eram atormentados” ou “eram desgastados”; o verbo grego transmite a ideia de ser consumido pelo sofrimento ou afligido.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόντες
  choice: os ausentes
  rationale: O particípio substantivado de ἄπειμι designa os que estavam longe ou não estavam presentes; “os ausentes” preserva com concisão o contraste do grego.
- source_word: παρόντες
  choice: os presentes
  rationale: O particípio substantivado de πάρειμι designa os que estavam presentes; “os presentes” mantém o paralelismo formal com ἀπόντες.
- source_word: ὁμοίως
  choice: igualmente
  rationale: Expressa semelhança de modo ou medida e indica que ambos os grupos passaram por aflição comparável.
- source_word: ἐτρύχοντο
  choice: eram afligidos
  rationale: O imperfeito médio/passivo de τρύχω descreve sofrimento contínuo, com a ideia de ser desgastado ou atormentado. A formulação escolhida preserva o aspecto durativo sem restringir a natureza da aflição.
theological_decisions:
- issue: Natureza do sofrimento expresso por ἐτρύχοντο
  choice: aflição em sentido amplo
  alternative: “eram atormentados”, “sofriam” ou “eram desgastados”
  rationale: O verbo permite diferentes graus e formas de sofrimento. “Eram afligidos” evita impor uma noção mais específica de tormento físico ou punitivo do que o grego exige.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com paralelismo claro entre “os ausentes” e “os presentes”. O imperfeito “eram afligidos” conserva a duração implícita na forma verbal grega.
