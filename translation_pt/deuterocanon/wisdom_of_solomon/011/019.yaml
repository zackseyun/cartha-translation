  text: or foul masses of smoke being winnowed[a], or terrible sparks flashing from their eyes—whose harm was able not only to crush them together, but even their frightening appearance to destroy them.
translation:
  language: pt
  text: ou massas fétidas de fumaça joeiradas[a], ou faíscas terríveis relampejando de seus olhos — cujo dano podia não só esmagá-los, mas até mesmo a visão aterrorizante delas podia destruí-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lançadas e revolvidas no ar como ao joeirar”. O grego usa a imagem agrícola de joeirar, como a palha que é lançada ao ar para ser separada do grão.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρόμους
  choice: massas fétidas
  rationale: O substantivo raro comunica algo repugnante ou nocivo. “Massas fétidas” preserva a concretude ameaçadora da imagem em ligação com a fumaça.
- source_word: λικμωμένους
  choice: agitadas ao vento
  rationale: O particípio deriva de λικμάω, “joeirar”, e evoca matéria lançada ao ar como palha. A expressão portuguesa mantém a imagem de movimento pelo ar sem sugerir literalmente que a fumaça esteja sendo separada de grãos.
- source_word: καπνοῦ
  choice: de fumaça
  rationale: Reproduz de modo direto o genitivo e conserva a relação compacta e algo aberta do grego.
- source_word: δεινοὺς
  choice: terríveis
  rationale: Neste contexto, descreve algo que causa terror, não algo moralmente mau.
- source_word: ἀπʼ ὀμμάτων σπινθῆρας ἀστράπτοντας
  choice: faíscas terríveis que lhes saíam dos olhos como relâmpagos
  rationale: “Faíscas” traduz σπινθῆρας; a formulação conserva a origem nos olhos e explicita de modo idiomático a imagem relampejante de ἀστράπτοντας.
- source_word: βλάβη
  choice: poder destrutivo
  rationale: No contexto, βλάβη é o dano que tais seres poderiam causar. “Poder destrutivo” torna natural em português a construção abstrata sem reduzir sua força.
- source_word: συνεκτρῖψαι
  choice: esmagar
  rationale: O verbo composto é intensivo e indica esmagar ou despedaçar completamente; “esmagar” comunica essa força sem impor ao prefixo συν- um sentido coletivo incerto.
- source_word: ἡ ὄψις ἐκφοβήσασα
  choice: sua simples visão aterrorizante
  rationale: A construção destaca que até a mera visão deles, por provocar terror, seria mortal. “Simples” explicita o contraste enfático expresso por οὐ μόνον... ἀλλὰ καί.
- source_word: διολέσαι
  choice: aniquilar
  rationale: O verbo forte indica destruir por completo; “aniquilar” preserva sua intensidade e distingue o desfecho do anterior “esmagar”.
theological_decisions:
- issue: Grau de literalidade na imagem poética e compacta dos monstros
  choice: Preservar as massas fétidas de fumaça e as faíscas relampejantes que saem dos olhos, com leve explicitação idiomática.
  alternative: Parafrasear amplamente como nuvens pestilentas e criaturas de olhar flamejante.
  rationale: O grego emprega imagens deliberadamente estranhas e vívidas. A tradução mantém essa força sem transformar metáforas em uma descrição doutrinariamente mais definida.
- issue: Referente do relativo ὧν
  choice: “coisas cujo”, retomando coletivamente as manifestações descritas.
  alternative: “criaturas cujo”, identificando explicitamente os seres implícitos no contexto.
  rationale: O relativo pode retomar o conjunto das imagens ou os seres que as produzem. A formulação escolhida preserva a referência ampla e evita inserir um substantivo ausente deste versículo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. Conserva-se a estranheza poética do grego, mas evita-se o pouco idiomático “fumaça joeirada” no texto principal; a metáfora literal aparece na nota.
