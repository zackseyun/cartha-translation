translation:
  language: pt
  text: ou feras desconhecidas, recém-criadas e cheias de fúria, ou então feras que exalavam um hálito de fogo,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “exalando um sopro que exala fogo”. A expressão grega é condensada; o texto traduz seu sentido em português natural.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεοκτίστους
  choice: recém-criadas
  rationale: Preserva o sentido do composto, que descreve seres trazidos à existência recentemente, e não apenas animais jovens.
- source_word: θυμοῦ πλήρεις
  choice: cheias de fúria
  rationale: Expressa a ira intensa e a violência atribuídas às feras, em linguagem natural e vívida.
- source_word: θῆρας ἀγνώστους
  choice: feras desconhecidas
  rationale: θήρ designa animais selvagens e ameaçadores; ἀγνώστους indica que eram desconhecidos ou nunca vistos.
- source_word: ἤτοι
  choice: ora
  rationale: Introduz a primeira possível manifestação dessas feras e permite a continuação da série disjuntiva nos termos seguintes, sem transformar o particípio em uma alternativa independente às próprias feras.
- source_word: πυρπνόον φυσῶντας ἆσθμα
  choice: exalando um hálito de fogo
  rationale: Reproduz naturalmente a imagem comprimida de soprar ou exalar uma respiração que lança fogo, evitando em português a redundância pouco idiomática de 'respirar uma respiração que respira fogo'.
