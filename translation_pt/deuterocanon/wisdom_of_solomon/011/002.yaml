  text: Atravessaram um deserto desabitado e armaram tendas em lugares sem caminhos;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διώδευσαν
  choice: Atravessaram
  rationale: O verbo composto indica deslocamento através de uma região. “Atravessaram” expressa isso de modo natural e conciso em português.
- source_word: ἔρημον
  choice: um deserto
  rationale: Ἔρημος designa uma região erma ou deserta. “Deserto” é claro no contexto da jornada, sem exigir que se trate especificamente de uma extensão arenosa.
- source_word: ἀοίκητον
  choice: desabitado
  rationale: O adjetivo significa literalmente não habitado; “desabitado” preserva o sentido direto e concorda naturalmente com “deserto”.
- source_word: ἀβάτοις
  choice: em lugares sem caminhos
  rationale: O termo pode descrever lugares inacessíveis, não pisados ou sem vias transitáveis. “Lugares sem caminhos” conserva a imagem concreta da travessia por terreno ermo sem exagerar a ideia de impossibilidade absoluta de acesso.
- source_word: ἔπηξαν
  choice: armaram
  rationale: Com “tendas” como objeto, o verbo tem o sentido idiomático de instalar ou montar. “Armaram tendas” é uma expressão corrente e precisa.
- source_word: σκηνάς
  choice: tendas
  rationale: O plural se refere a habitações portáteis usadas durante a viagem. “Tendas” é a tradução simples e adequada, sem a conotação cultual que “tabernáculos” poderia introduzir.
theological_decisions:
- issue: Alusão à jornada de Israel pelo deserto
  choice: Manter a linguagem concreta de viagem e acampamento sem explicitar a identificação de Israel.
  alternative: Acrescentar uma referência interpretativa a Israel ou ao êxodo.
  rationale: Embora o contexto evoque a jornada do êxodo, o grego deste versículo permanece descritivo. A tradução conserva a alusão sem inserir interpretação teológica ausente da frase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o paralelismo entre atravessar a região desabitada e armar tendas no terreno sem caminhos. O ponto e vírgula acompanha o caráter continuativo da pontuação da fonte.
