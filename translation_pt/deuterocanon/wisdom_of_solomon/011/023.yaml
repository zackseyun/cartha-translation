  text: But you have mercy on all[a], because you are able to do all things[b], and you overlook the sins of men for repentance.
translation:
  language: pt
  text: Mas tens misericórdia de todos, porque tudo podes, e passas por alto[a] os pecados dos seres humanos, tendo em vista o arrependimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Passas por alto” indica que Deus, em sua misericórdia, não aplica de imediato o juízo pelos pecados, dando ocasião ao arrependimento; não significa que considere o pecado sem importância.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεεῖς
  choice: tens misericórdia de
  rationale: Expressa compaixão misericordiosa de modo natural e teologicamente significativo em português.
- source_word: πάντας
  choice: todos
  rationale: Preserva de maneira direta e concisa o alcance universal do plural grego no contexto.
- source_word: πάντα δύνασαι
  choice: tudo podes
  rationale: Reproduz a afirmação abrangente da capacidade divina em formulação concisa, digna e corrente.
- source_word: παρορᾷς
  choice: passas por alto
  rationale: Comunica a suspensão deliberada do juízo imediato; a nota esclarece que não se trata de indiferença moral.
- source_word: ἁμαρτήματα ἀνθρώπων
  choice: os pecados dos seres humanos
  rationale: Verte ἁμαρτήματα pelo termo corrente 'pecados' e representa corretamente o sentido genérico de ἀνθρώπων, que abrange a humanidade.
- source_word: εἰς μετάνοιαν
  choice: tendo em vista o arrependimento
  rationale: Mantém a construção nominal do grego e preserva sua abertura entre finalidade e resultado, sem inserir explicitamente um sujeito para o ato de arrepender-se.
theological_decisions:
- issue: Sentido da tolerância divina em παρορᾷς ἁμαρτήματα
  choice: Deus deixa temporariamente de aplicar o juízo aos pecados, em misericórdia e com vistas ao arrependimento.
  alternative: Deus ignora os pecados como se fossem irrelevantes ou já os perdoa plenamente nesta oração.
  rationale: A ligação com εἰς μετάνοιαν apresenta a ação como tolerância misericordiosa orientada ao arrependimento, não como desconhecimento, aprovação ou absolvição automática.
- issue: Relação expressa por εἰς μετάνοιαν
  choice: tendo em vista o arrependimento
  alternative: para que se arrependam
  rationale: A tradução escolhida preserva a formulação compacta e a possível nuance de finalidade ou resultado da preposição εἰς, evitando explicitar mais do que o grego.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A forma verbal na segunda pessoa do singular acompanha a interpelação direta a Deus; 'seres humanos' exprime naturalmente o sentido genérico de ἀνθρώπων.
