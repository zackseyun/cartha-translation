lexical_decisions:
- source_word: ἀντί
  choice: Em vez de
  rationale: 'Expressa substituição ou contraste: no lugar da fonte de água esperada, houve sangue.'
- source_word: πηγῆς
  choice: nascente
  rationale: Designa uma fonte ou manancial; “nascente” se combina naturalmente com “rio” em português.
- source_word: ἀενάου
  choice: que corria sem cessar
  rationale: Comunica o fluxo contínuo indicado pelo adjetivo grego, em linguagem clara e vívida.
- source_word: ποταμοῦ
  choice: rio
  rationale: É o sentido comum do substantivo e preserva a referência alusiva ao rio do relato do Êxodo sem identificá-lo explicitamente.
- source_word: αἵματι
  choice: sangue
  rationale: Mantém a imagem concreta da praga evocada pelo texto.
- source_word: λυθώδει
  choice: lamacento
  rationale: Preserva a noção de algo semelhante a lama ou lodo, apresentando o sangue como líquido sujo e poluído.
- source_word: ταραχθέντες
  choice: foram perturbados
  rationale: Reproduz o particípio passivo e conserva a possibilidade de uma perturbação tanto material quanto vivenciada.
theological_decisions:
- issue: Alusão à praga do Egito e possível explicitação do objeto elíptico
  choice: 'Manter a formulação condensada: “foram perturbados por sangue lamacento”.'
  alternative: “foram perturbados pela água transformada em sangue lamacento” ou “pelo rio transformado em sangue lamacento”.
  rationale: O grego não explicita “água”, “Nilo” nem a transformação nesta oração. A redação escolhida conserva a alusão ao Êxodo sem acrescentar elementos interpretativos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Nascente” evita o possível sentido arquitetônico de “fonte”; “que corria sem cessar” soa mais natural que formas excessivamente literárias. A vírgula final foi mantida porque o versículo continua sintaticamente no contexto seguinte.
