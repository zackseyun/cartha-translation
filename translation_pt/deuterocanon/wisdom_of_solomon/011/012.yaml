  text: For a double grief and groaning at the memory of what had happened seized them[a].
translation:
  language: pt
  text: Pois uma dor dupla e um gemido ao se lembrarem do que havia acontecido se apoderaram deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um gemido pela lembrança das coisas passadas”. A expressão grega é condensada e admite uma tradução mais literal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διπλῆ
  choice: dupla
  rationale: Preserva a imagem de duplicidade ou intensificação ligada à dor, em linguagem natural.
- source_word: ἔλαβε
  choice: se apoderaram de
  rationale: A construção personifica as emoções como forças que os dominam; o plural em português faz o verbo concordar com os dois elementos coordenados.
- source_word: λύπη
  choice: dor
  rationale: Expressa sofrimento emocional com clareza e peso, sem restringir o sentido ao luto por morte.
- source_word: στεναγμός
  choice: gemido
  rationale: Mantém a ideia de uma manifestação audível de sofrimento, mais intensa que um simples suspiro.
- source_word: μνημῶν
  choice: ao se lembrarem
  rationale: Explicita de modo natural a relação comprimida entre o gemido e a recordação, sem definir rigidamente se ela é temporal ou causal.
- source_word: τῶν παρελθουσῶν
  choice: do que havia acontecido
  rationale: Verte naturalmente o particípio substantivado feminino plural, referindo-se aos acontecimentos passados.
