base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/014.yaml
  text: For they rejected with mockery the one who had long ago been cast out at his exposure[a]; but at the end of those events they marveled[b], having thirsted unlike the righteous.
translation:
  language: pt
  text: Pois eles rejeitaram com zombaria aquele que, muito tempo antes, fora abandonado quando foi exposto[a]; mas, ao final desses acontecimentos, ficaram admirados[b], depois de terem sentido sede, de modo diferente dos justos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a criança outrora exposta e abandonada — uma alusão a Moisés.
    reason: cross_reference
  - marker: b
    text: 'Ou: “ao fim dos resultados”; o grego também pode referir-se ao desfecho final dos acontecimentos que se haviam desenrolado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκθέσει ... ῥιφέντα
  choice: fora lançado ao abandono
  rationale: A combinação descreve alguém lançado fora por meio de exposição ou abandono, especialmente de uma criança. A formulação portuguesa transmite o ato concreto sem inserir o nome de Moisés no texto.
- source_word: ἀπεῖπον
  choice: rejeitaram
  rationale: O verbo expressa repúdio ou recusa; “rejeitaram” é claro, atual e adequado à relação dos egípcios com a figura mencionada.
- source_word: χλευάζοντες
  choice: com zombaria
  rationale: O particípio indica a maneira como ocorreu a rejeição. A locução adverbial mantém essa relação de modo natural.
- source_word: ἐπὶ τέλει τῶν ἐκβάσεων
  choice: quando esses acontecimentos chegaram ao desfecho
  rationale: ἐκβάσεις pode designar resultados, desfechos ou o curso dos acontecimentos. A tradução preserva a referência ao resultado final sem impor uma identificação excessivamente específica.
- source_word: ἐθαύμασαν
  choice: ficaram admirados
  rationale: Expressa assombro ou admiração diante do resultado dos acontecimentos.
- source_word: οὐχ ὅμοια δικαίοις διψήσαντες
  choice: depois de sofrerem uma sede diferente da dos justos
  rationale: Mantém o contraste explícito entre a sede deles e a dos justos, tornando natural em português a relação circunstancial do particípio.
theological_decisions:
- issue: Identidade daquele que foi exposto e abandonado
  choice: Manter a referência indireta no texto e identificar Moisés apenas em nota.
  alternative: Nomear Moisés diretamente no corpo do versículo.
  rationale: O grego não dá o nome, embora a alusão contextual a Moisés seja clara. Preservar a referência indireta respeita a contenção do texto-fonte.
- issue: Contraste entre a sede dos egípcios e a dos justos
  choice: Preservar que a sede foi diferente, sem explicar em que aspecto.
  alternative: Explicitar que os egípcios sofreram de modo punitivo, ao contrário dos israelitas.
  rationale: O versículo afirma o contraste, mas deixa sua natureza dependente do contexto. Explicá-lo no texto eliminaria uma tensão genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Lançado ao abandono” evita o tecnicismo pouco transparente “exposto” no corpo do texto, enquanto a nota recupera a alusão histórica. A construção final preserva o contraste conciso e não explicado do grego.
