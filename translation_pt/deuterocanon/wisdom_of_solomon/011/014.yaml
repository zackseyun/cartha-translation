revisions:
- from: Pois eles rejeitaram com zombaria aquele que, muito tempo antes, fora lançado ao abandono[a]; mas, quando esses acontecimentos chegaram ao desfecho, ficaram admirados[b], depois de sofrerem uma sede diferente da dos justos.
