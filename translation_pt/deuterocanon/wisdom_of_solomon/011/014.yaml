  rationale: A revisão substitui uma locução portuguesa artificial por uma formulação que distingue a exposição da criança e seu abandono, preservando a alusão implícita do grego. Também verte o particípio διψήσαντες de modo menos interpretativo, sem explicar a natureza da diferença entre a sede deles e a dos justos.
