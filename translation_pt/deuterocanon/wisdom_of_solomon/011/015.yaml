  source_fidelity: 'O texto reproduz adequadamente a estrutura argumentativa do grego: a reciprocidade punitiva de ἀντί, os raciocínios insensatos associados à injustiça, o particípio passivo «tendo sido desencaminhados», o culto a seres rastejantes e feras desprezíveis, e o eco de ἄλογος em «irracionais». «Enviaste contra eles» e «para castigo» são interpretações contextualmente sólidas de ἐπαπέστειλας e εἰς ἐκδίκησιν.'
