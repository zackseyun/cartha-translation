  terminology: «Raciocínios insensatos», «criaturas rastejantes irracionais», «feras desprezíveis», «animais irracionais» e «castigo» mantêm bem tanto o sentido lexical como o contraste retórico do original. A nota da alternativa para ἐκδίκησις deve empregar a construção portuguesa normal «em retribuição», e não «para retribuição».
