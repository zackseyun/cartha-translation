base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/015.yaml
  text: But in return for the foolish reasonings of their unrighteousness[a], by which, having been led astray, they worshiped irrational creeping things and worthless beasts, you sent upon them a multitude of irrational animals for punishment[c][b],
translation:
  language: pt
  text: Mas, em retribuição pelos raciocínios insensatos da injustiça deles[a], pelos quais, tendo sido desencaminhados, eles adoravam criaturas rastejantes irracionais e feras desprezíveis, enviaste contra eles uma multidão de animais irracionais[b], para castigo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pensamentos insensatos”, em vez de “raciocínios insensatos”.'
    reason: lexical_alternative
  - marker: b
    text: O grego repete a ideia de “irracional” nas criaturas rastejantes que eles adoravam e nos animais enviados contra eles, criando um eco retórico.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “em retribuição” ou “para vingança”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ
  choice: como retribuição por
  rationale: Expressa a correspondência punitiva ou retributiva indicada por ἀντί no contexto, sem reduzi-la a mera substituição.
- source_word: λογισμῶν ἀσυνέτων
  choice: raciocínios insensatos
  rationale: Preserva a dimensão reflexiva de λογισμός e a censura cognitiva e moral de ἀσύνετος.
- source_word: ἀδικίας αὐτῶν
  choice: sua injustiça
  rationale: Mantém o sentido amplo de conduta moralmente errada; a construção genitiva do grego permanece aberta quanto à relação exata entre a injustiça e os raciocínios.
- source_word: πλανηθέντες
  choice: tendo sido desencaminhados
  rationale: Conserva a forma passiva e o sentido de terem sido levados ao erro.
- source_word: ἐθρήσκευον
  choice: adoravam
  rationale: Comunica de modo claro e natural a prática de culto religioso no contexto de idolatria.
- source_word: ἄλογα ἑρπετὰ
  choice: criaturas rastejantes irracionais
  rationale: ἑρπετά designa seres que rastejam, e “irracionais” preserva a força de ἄλογα e sua repetição retórica posterior.
- source_word: κνώδαλα εὐτελῆ
  choice: feras desprezíveis
  rationale: Distingue κνώδαλα do termo mais geral ζῷα e conserva a tonalidade depreciativa de εὐτελῆ.
- source_word: ἐπαπέστειλας αὐτοῖς
  choice: enviaste contra eles
  rationale: Torna explícita, de maneira idiomática, a direção hostil e judicial do envio.
- source_word: πλῆθος ἀλόγων ζῴων
  choice: uma multidão de animais irracionais
  rationale: Traduz πλῆθος e ζῷα naturalmente e repete “irracionais” para conservar o eco deliberado de ἄλογος.
- source_word: εἰς ἐκδίκησιν
  choice: para castigo
  rationale: Representa o resultado judicial da ação sem impor a conotação mais pessoal que “vingança” pode ter em português.
theological_decisions:
- issue: Força moral e religiosa de ἀδικία
  choice: sua injustiça
  alternative: sua perversidade; seu procedimento injusto
  rationale: “Injustiça” preserva a amplitude moral do termo e sua ligação contextual com a idolatria, sem restringi-lo apenas à injustiça social nem acrescentar uma qualificação interpretativa.
- issue: Repetição de ἄλογος
  choice: irracionais ... irracionais
  alternative: sem razão ... irracionais; irracionais ... brutos
  rationale: 'A repetição mantém a ironia teológica e retórica: aqueles que cultuaram seres irracionais foram castigados por animais irracionais.'
- issue: Sentido de ἐκδίκησις na ação divina
  choice: castigo
  alternative: retribuição; vingança
  rationale: “Castigo” comunica o juízo retributivo do contexto, evitando sugerir paixão vingativa e sem negar a dimensão de retribuição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais dirigidas a Deus no singular (“enviaste”). A sintaxe conserva a relação retributiva e a ambiguidade do genitivo grego, enquanto pequenas escolhas idiomáticas evitam artificialidade excessiva.
