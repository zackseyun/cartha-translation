  source_fidelity: A tradução preserva com precisão o contraste grego entre «estes» e «aqueles», bem como a distinção verbal entre ἐδοκίμασας («puseste à prova») e ἐξήτασας («examinaste»). Os particípios νουθετῶν e καταδικάζων são adequadamente expressos por «advertindo-os» e «condenando-os», sem reduzir a primeira ação a punição nem atenuar a força judicial da segunda.
