  - marker: b
    text: 'Ou: “um rei rigoroso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτους μὲν ... ἐκείνους δὲ
  choice: a estes ... aqueles, porém
  rationale: Preserva o contraste explícito entre os dois grupos sem identificar no próprio versículo quem são eles além do que os demonstrativos gregos dizem.
- source_word: ὡς πατὴρ
  choice: como um pai
  rationale: Mantém diretamente a comparação e a imagem paterna.
- source_word: νουθετῶν
  choice: advertindo-os
  rationale: Expressa orientação corretiva ou advertência, e não mero ensino nem necessariamente castigo.
- source_word: ἐδοκίμασας
  choice: puseste à prova
  rationale: Comunica a ideia de testar ou comprovar e se distingue com naturalidade do verbo da segunda oração.
- source_word: ἀπότομος
  choice: severo
  rationale: Transmite a dureza e o rigor inflexível do adjetivo sem recorrer a uma formulação excessivamente forte ou coloquial.
- source_word: βασιλεὺς
  choice: rei
  rationale: Reproduz o sentido básico e preserva a imagem régia do texto.
- source_word: καταδικάζων
  choice: condenando-os
  rationale: Mantém a força judicial adversa do particípio grego.
- source_word: ἐξήτασας
  choice: examinaste
  rationale: Indica investigação ou escrutínio cuidadoso e evita nivelar os dois verbos gregos como se ambos significassem simplesmente testar.
theological_decisions:
- issue: Tratamento divino diferenciado dos dois grupos
  choice: Preservar o contraste entre a prova corretiva de caráter paterno aplicada a “estes” e o exame condenatório de caráter régio aplicado a “aqueles”.
  alternative: Traduzir as duas orações simplesmente como formas equivalentes de provar ou testar.
  rationale: As imagens, os particípios e os verbos gregos são distintos. A tradução mantém a tensão entre correção paterna e juízo condenatório sem harmonizá-los.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com formas verbais na segunda pessoa do singular para refletir a fala dirigida diretamente a Deus. A ordem foi ajustada para soar natural em português, preservando o paralelismo e o contraste do grego.
