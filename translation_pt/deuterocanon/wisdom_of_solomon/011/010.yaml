  text: For these you tested by admonishing them as a father[b][a], but those you examined by condemning them as a stern king.
translation:
  language: pt
  text: Pois a estes puseste à prova, advertindo-os como um pai[a]; aqueles, porém, examinaste, condenando-os como um rei severo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
