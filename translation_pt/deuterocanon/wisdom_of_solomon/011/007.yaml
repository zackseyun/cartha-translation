  text: as a rebuke for the decree that killed infants,[a]
translation:
  language: pt
  text: como repreensão pelo decreto que mandava matar crianças de colo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «para repreensão de um decreto infanticida».
    reason: Alternativa lexical e sintática mais formal, que preserva a construção compacta do grego.
lexical_decisions:
- source_word: εἰς
  choice: como
  rationale: Neste fragmento dependente do contexto, εἰς indica finalidade ou função; «como» produz uma formulação natural sem eliminar essa relação.
- source_word: ἔλεγχον
  choice: repreensão
  rationale: ἔλεγχος pode expressar censura, refutação ou desmascaramento. «Repreensão» conserva aqui a ideia de uma resposta divina que expõe e condena o ato anterior.
- source_word: νηπιοκτόνου
  choice: que matava crianças de colo
  rationale: O adjetivo significa literalmente «que mata crianças pequenas». A oração relativa é mais natural em português e «crianças de colo» mantém a referência específica de νήπιος sem ampliá-la simplesmente para «crianças».
- source_word: διατάγματος
  choice: decreto
  rationale: διατάγματος designa uma determinação oficial; «decreto» é claro, atual e apropriado à alusão à ordem do faraó.
theological_decisions:
- issue: Alusão histórico-teológica à matança das crianças hebreias no Egito
  choice: «o decreto que matava crianças de colo»
  alternative: «o decreto infanticida»
  rationale: A formulação explicita o sentido do adjetivo grego e preserva a alusão histórica, sem acrescentar a identidade do governante nem outros pormenores ausentes deste fragmento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Crianças de colo» comunica νήπιος de modo natural; a nota registra a construção grega mais compacta.
