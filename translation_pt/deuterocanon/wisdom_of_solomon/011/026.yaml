base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/026.yaml
  text: But you spare all things[a], because they are yours, O Master who loves life. For your imperishable spirit is in all things.
translation:
  language: pt
  text: Mas poupas todas as coisas, porque são tuas, ó Soberano que amas a vida.[a] Pois o teu espírito imperecível está em todas as coisas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “amante das almas”. O termo grego pode referir-se ao amor pela vida ou pelos seres vivos e suas almas; aqui, o contexto destaca o cuidado de Deus por toda a criação.
    reason: lexical_alternative
  - marker: b
    text: Ou “sopro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: φείδῃ
  choice: poupas
  rationale: O verbo expressa a ação de poupar ou de se abster de causar dano; “poupas” é direto e preserva a ideia da contenção divina diante da criação.
- source_word: πάντων
  choice: todas as coisas
  rationale: O genitivo plural abrange a totalidade das coisas criadas e concorda naturalmente com o referente retomado por σά.
- source_word: σά ἐστιν
  choice: são tuas
  rationale: A formulação possessiva retoma “todas as coisas” e conserva de modo claro e conciso a relação entre o Criador e a criação.
- source_word: Δέσποτα
  choice: Soberano
  rationale: O vocativo designa quem detém autoridade e domínio. “Soberano” evita que “Mestre” seja entendido apenas como professor e mantém a distinção em relação a κύριος.
- source_word: φιλόψυχε
  choice: que amas a vida
  rationale: O composto pode referir-se ao amor pela vida ou pelas almas. No contexto do cuidado de Deus por toda a criação, “que amas a vida” comunica o alcance mais amplo sem ocultar a alternativa, registrada em nota.
- source_word: ἄφθαρτόν
  choice: imperecível
  rationale: Expressa aquilo que não perece nem está sujeito à corrupção, em linguagem atual e digna.
- source_word: πνεῦμά
  choice: espírito
  rationale: “Espírito” preserva a força pessoal e teológica possível da presença divina, enquanto a alternativa concreta “sopro” permanece indicada em nota.
- source_word: ἐν πᾶσιν
  choice: em todas as coisas
  rationale: A repetição mantém o alcance universal e o eco verbal de πάντων no início do versículo.
theological_decisions:
- issue: Sentido de φιλόψυχε no cuidado divino pela criação
  choice: que amas a vida
  alternative: amante das almas
  rationale: O contexto fala de Deus poupar todas as coisas porque lhe pertencem e de seu espírito estar em todas elas. Isso favorece o sentido criacional amplo, mas a nota conserva a leitura mais estreita ligada a “almas”.
- issue: Título divino Δέσποτα
  choice: Soberano
  alternative: Senhor; Mestre
  rationale: “Soberano” comunica domínio e autoridade sem confundir Δέσποτα com κύριος; “Mestre” seria lexicalmente próximo, mas em português moderno pode sugerir sobretudo um professor.
- issue: Amplitude semântica de πνεῦμα
  choice: espírito
  alternative: sopro
  rationale: O contexto admite a ideia da presença divina vivificadora. “Espírito” mantém a ressonância teológica, e a nota conserva a imagem de sopro sem decidir de modo excessivo entre as nuances.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação conserva o paralelismo entre “todas as coisas” e “em todas as coisas”, emprega tratamento direto na segunda pessoa e mantém um tom solene sem arcaísmos.
