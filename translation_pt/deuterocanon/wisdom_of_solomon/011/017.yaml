base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/017.yaml
  text: For your almighty hand[a], which created the world out of formless matter, was not powerless to send upon them a multitude of bears or fierce lions,
translation:
  language: pt
  text: Pois a tua mão todo-poderosa, que criou o mundo a partir de matéria sem forma[a], não era incapaz de enviar contra eles uma multidão de ursos ou leões ferozes,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a partir de matéria informe». A expressão grega reflete uma formulação cosmológica helenística e não deve ser forçada aqui para resolver debates doutrinários posteriores sobre o modo da criação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠπόρει
  choice: não era incapaz
  rationale: Preserva a formulação negativa do grego e expressa, de modo natural, que à mão de Deus não faltava poder ou recurso para agir.
- source_word: παντοδύναμός
  choice: todo-poderosa
  rationale: Transmite a ideia de poder irrestrito e concorda naturalmente com «mão», preservando a imagem do texto.
- source_word: χείρ
  choice: mão
  rationale: Mantém a metáfora concreta da ação e do poder divinos, sem substituí-la pela abstração «poder».
- source_word: κτίσασα
  choice: que criou
  rationale: Reproduz com clareza a função do particípio, que caracteriza a mão de Deus por sua obra criadora.
- source_word: κόσμον
  choice: o mundo
  rationale: É a equivalência corrente e suficientemente abrangente para κόσμος neste contexto, sem especificar indevidamente «universo».
- source_word: ἐξ ἀμόρφου ὕλης
  choice: a partir de matéria sem forma
  rationale: Conserva a expressão cosmológica helenística e sua possível carga filosófica, sem lhe impor uma conclusão doutrinária posterior.
- source_word: ἐπιπέμψαι
  choice: enviar contra eles
  rationale: Expressa tanto o ato de enviar como o sentido hostil do composto no contexto de juízo.
- source_word: πλῆθος
  choice: uma multidão de
  rationale: Mantém a ênfase quantitativa do substantivo grego.
- source_word: θρασεῖς
  choice: ferozes
  rationale: No contexto de animais predadores enviados como juízo, comunica naturalmente o caráter ameaçador de θρασεῖς.
theological_decisions:
- issue: Formulação negativa acerca da capacidade divina
  choice: não era incapaz de enviar contra eles
  alternative: podia ter enviado contra eles
  rationale: A opção preserva a litotes do grego, afirmando a plena capacidade divina sem converter a frase em uma formulação positiva mais explícita que o original.
- issue: Sentido de ἐξ ἀμόρφου ὕλης
  choice: a partir de matéria sem forma
  alternative: a partir de matéria informe
  rationale: A tradução conserva a linguagem cosmológica do versículo sem usá-la para decidir debates doutrinários posteriores sobre o modo da criação.
