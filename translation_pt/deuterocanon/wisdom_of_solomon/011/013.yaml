  text: For when they heard that those very people were being benefited through their own punishments[a], they recognized the Lord.
translation:
  language: pt
  text: Pois, quando ouviram que aqueles eram beneficiados por meio dos castigos que eles próprios sofriam, reconheceram o Senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tomaram consciência do Senhor”. O grego pode indicar percepção ou reconhecimento, sem necessariamente implicar uma plena confissão de fé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε γὰρ
  choice: Pois, quando
  rationale: Preserva tanto a força explicativa de γάρ como a relação temporal introduzida por ὅτε.
- source_word: ἤκουσαν
  choice: ouviram
  rationale: Mantém o sentido básico de receber uma notícia ou relato pelo ouvir.
- source_word: διὰ τῶν ἰδίων κολάσεων
  choice: por meio dos castigos que eles próprios sofriam
  rationale: Expressa o valor instrumental de διά e deixa claro, em português natural, que os castigos pertenciam à experiência dos egípcios, preservando a ironia do contraste.
- source_word: εὐεργετουμένους
  choice: eram beneficiados
  rationale: Preserva a voz passiva e a ideia de receber benefício.
- source_word: αὐτούς
  choice: aqueles mesmos
  rationale: Assinala o contraste com o grupo castigado e remete aos israelitas já presentes no contexto, sem inserir o nome no versículo.
- source_word: ᾔσθοντο
  choice: reconheceram
  rationale: Comunica percepção ou tomada de consciência da ação do Senhor, sem exigir a ideia de plena confissão de fé.
- source_word: τοῦ κυρίου
  choice: o Senhor
  rationale: É a tradução teológica e contextualmente adequada de κύριος quando se refere a Deus.
theological_decisions:
- issue: Referente de αὐτούς e contraste entre os castigados e os beneficiados
  choice: “aqueles mesmos” refere-se aos israelitas, beneficiados por meio dos castigos sofridos pelos egípcios
  alternative: Manter apenas “eles”, deixando o referente totalmente implícito
  rationale: O contexto contrapõe egípcios e israelitas. A formulação esclarece a referência pronominal sem nomear explicitamente o grupo nem eliminar a ironia do grego.
- issue: Alcance de ᾔσθοντο τοῦ κυρίου
  choice: “reconheceram o Senhor”
  alternative: “perceberam o Senhor” ou “tomaram consciência do Senhor”
  rationale: A expressão indica percepção ou reconhecimento da realidade e atuação do Senhor, mas não afirma necessariamente conversão ou plena fé; a nota preserva essa abertura.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A explicitação “que eles próprios sofriam” evita a possível leitura equivocada de que os castigos pertenciam aos beneficiados, ao mesmo tempo que conserva o contraste contextual.
