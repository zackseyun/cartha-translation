review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente a estrutura principal: Deus dá água abundante e, pela sede anterior do povo, mostra como puniu seus adversários. Contudo, «quando já não a esperavam» restringe ἀνελπίστως a uma falta de expectativa já estabelecida («já não»), nuance mais forte do que o grego exige. Uma formulação adverbial direta preserva melhor a ambiguidade entre «inesperadamente» e «além da esperança».'
  naturalness: O texto é claro e de registro apropriado. «Seus adversários» é mais idiomático que «os adversários deles», e «a sede que tiveram então» evita acrescentar a ideia de sofrimento, não expressa explicitamente no original.
  terminology: «Água em abundância», «mostrando» e «puniste» correspondem bem a δαψιλὲς ὕδωρ, δείξας e ἐκόλασας. Mantém-se «adversários» para ὑπεναντίους e a segunda pessoa singular dirigida a Deus.
  issues:
  - severity: low
    issue: A expressão «quando já não a esperavam» acrescenta a ideia temporal de que haviam deixado de esperar pela água.
    rationale: ἀνελπίστως significa algo como «inesperadamente» ou «além da esperança»; não requer necessariamente a implicação de uma expectativa anteriormente abandonada.
  - severity: low
    issue: «Sede que então sofreram» introduz «sofreram», ausente do grego.
    rationale: Embora a sede naturalmente implique aflição, «tiveram então» traduz de modo mais direto τοῦ τότε δίψους sem explicitar esse aspecto.
  revised_text: Tu lhes deste água em abundância, inesperadamente[a], mostrando, por meio da sede que tiveram então, como puniste seus adversários.
  revised_footnotes:
  - marker: a
