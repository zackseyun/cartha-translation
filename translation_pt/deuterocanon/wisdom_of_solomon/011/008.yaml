base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/008.yaml
  text: You gave them abundant water unexpectedly[a], showing through their thirst at that time how you punished their adversaries.
translation:
  language: pt
  text: Tu lhes deste água em abundância, inesperadamente[a], mostrando, por meio da sede que tiveram então, como puniste seus adversários.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “além da esperança” ou “quando não tinham esperança”.'
    reason: Alternativa lexical para ἀνελπίστως, que pode indicar algo ocorrido contra a expectativa ou além da esperança.
lexical_decisions:
- source_word: ἔδωκας
  choice: Tu lhes deste
  rationale: O aoristo de δίδωμι indica uma ação passada; a forma direta preserva também a segunda pessoa singular dirigida a Deus.
- source_word: δαψιλὲς ὕδωρ
  choice: água em abundância
  rationale: δαψιλής expressa grande quantidade ou provisão farta; a locução é natural e clara em português.
- source_word: ἀνελπίστως
  choice: quando já não a esperavam
  rationale: O advérbio indica que a água veio fora da expectativa ou esperança; esta formulação explicita naturalmente o valor adverbial sem eliminar a possível nuance de falta de esperança, registrada na nota.
- source_word: δείξας
  choice: mostrando
  rationale: O particípio aoristo apresenta uma circunstância associada ao ato de dar e mantém a força demonstrativa do grego.
- source_word: διὰ τοῦ τότε δίψους
  choice: por meio da sede que então sofreram
  rationale: διά com genitivo aqui aponta para o meio pelo qual se tornou visível o contraste; 'então' preserva τότε, e 'sofreram' torna idiomática a referência à experiência da sede.
- source_word: τοὺς ὑπεναντίους
  choice: os adversários deles
  rationale: O substantivo designa os que se opõem. 'Adversários' mantém o registro elevado sem deixar de ser compreensível; 'deles' explicita a relação contextual.
- source_word: ἐκόλασας
  choice: puniste
  rationale: κολάζω designa ação punitiva; 'puniste' é direto e não atenua o sentido.
theological_decisions:
- issue: Referentes do contraste entre αὐτοῖς e τοὺς ὑπεναντίους
  choice: '''Lhes/deles'' conserva no texto a referência contextual ao povo de Deus e a seus adversários.'
  alternative: Explicitar 'Israel' e 'os egípcios'.
  rationale: O contexto aponta para Israel e seus adversários, mas o versículo grego emprega pronomes e uma designação geral. Preservá-los evita inserir nomes ausentes e mantém a formulação aplicável do texto.
- issue: Função da sede do povo no contraste com o castigo dos adversários
  choice: A sede é apresentada como o meio pelo qual Deus mostrou como castigou os adversários.
  alternative: Entender a sede apenas como comparação genérica com o sofrimento dos adversários.
  rationale: A construção διὰ τοῦ τότε δίψους sustenta a ideia de meio, enquanto πῶς introduz aquilo que foi mostrado; a tradução não desenvolve além disso a lógica precisa do contraste.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. Emprega-se 'tu' para refletir a segunda pessoa singular dirigida a Deus e manter coerência verbal. A ordem foi levemente ajustada para fluência, sem resolver além do necessário as relações contextuais.
