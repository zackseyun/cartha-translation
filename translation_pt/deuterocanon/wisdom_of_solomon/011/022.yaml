base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/022.yaml
  text: For the whole world before you is like a speck on the scales[a], and like a drop of morning dew that falls upon the earth.
translation:
  language: pt
  text: Pois o mundo inteiro, diante de ti, é como a leve inclinação de uma balança[a] e como uma gota do orvalho da manhã que cai sobre a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como um pequeno peso nos pratos da balança”; o grego pode referir-se à mínima inclinação ou oscilação da balança, ou ao peso ínfimo associado a ela.
    reason: A expressão ῥοπὴ ἐκ πλαστίγγων admite mais de uma compreensão concreta. A nota preserva a alternativa lexical sem sobrecarregar o texto.
lexical_decisions:
- source_word: ῥοπὴ ἐκ πλαστίγγων
  choice: um peso minúsculo na balança
  rationale: A expressão evoca algo de peso ínfimo numa balança. Esta formulação conserva a imagem concreta e comunica a extrema pequenez, sem introduzir uma substância como “pó”, que não aparece no grego.
- source_word: ὅλος ὁ κόσμος
  choice: o mundo inteiro
  rationale: κόσμος designa aqui o mundo ordenado em sua totalidade; “o mundo inteiro” é abrangente, natural e não especifica além do texto.
- source_word: ἐναντίον σου
  choice: diante de ti
  rationale: Mantém o sentido espacial e relacional da expressão grega, ao mesmo tempo que permite perceber a comparação entre a grandeza do mundo e Deus.
- source_word: ῥανὶς δρόσου ὄρθρινὴ
  choice: uma gota do orvalho da manhã
  rationale: Reproduz com clareza a gota e a referência temporal do grego, em linguagem portuguesa corrente.
- source_word: κατελθοῦσα ἐπὶ γῆν
  choice: que cai sobre a terra
  rationale: Traduz de modo natural o particípio “que desceu/veio para baixo”, preservando a imagem do orvalho que chega à terra.
theological_decisions:
- issue: A insignificância comparativa do mundo diante de Deus
  choice: Conservar as duas comparações concretas, sem convertê-las numa declaração abstrata de que o mundo “não é nada”.
  alternative: Traduzir interpretativamente como “o mundo inteiro nada é diante de ti”.
  rationale: O grego exprime a relação por imagens poéticas de extrema pequenez, não por uma afirmação metafísica sobre a ausência de valor da criação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo poético e evita linguagem denominacional ou explicação doutrinária no corpo do versículo.
