base_translation:
  language: en
  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/004.yaml
  text: They were thirsty and called on you[a], and water was given to them from a sheer rock[b], and a remedy for thirst from hard stone.
translation:
  language: pt
  text: Tiveram sede e clamaram a ti[a]; lhes foi dada água de uma rocha escarpada e, de uma pedra dura, um remédio para a sede[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Tiveram sede e invocaram-te».'
    reason: lexical_alternative
  - marker: b
    text: O grego diz literalmente «remédio para a sede», apresentando a água como alívio restaurador.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίψησαν
  choice: Tiveram sede
  rationale: Expressa de modo natural em português o aoristo de διψάω, preservando a necessidade física descrita sem recorrer ao menos corrente «sedearam».
- source_word: ἐπεκαλέσαντό σε
  choice: clamaram a ti
  rationale: O verbo médio indica apelo dirigido a Deus em situação de necessidade. «Clamaram a ti» é corrente, digno e conserva o sentido de súplica.
- source_word: ἐδόθη αὐτοῖς
  choice: lhes foi dada
  rationale: Mantém a construção passiva do grego e não explicita o agente, embora o contexto aponte para a ação divina.
- source_word: ἐκ πέτρας ἀκροτόμου
  choice: de uma rocha escarpada
  rationale: ἀκρότομος descreve algo abrupto, íngreme ou cortado a pique. «Rocha escarpada» comunica tanto a forma do rochedo quanto a improbabilidade de dele sair água.
- source_word: ὕδωρ
  choice: água
  rationale: Equivalente direto e natural.
- source_word: ἄκος δίψης
  choice: um remédio para a sede
  rationale: Preserva a metáfora medicinal de ἄκος, que apresenta a água como provisão restauradora, e não apenas como bebida.
- source_word: ἐκ λίθου σκληροῦ
  choice: de uma pedra dura
  rationale: Reproduz o sentido simples de σκληρός e mantém o paralelismo com a rocha escarpada.
theological_decisions:
- issue: Explicitar ou não Deus como aquele que dá a água
  choice: Manter a passiva «lhes foi dada», sem acrescentar «por ti».
  alternative: «tu lhes deste água»
  rationale: Embora o contexto atribua claramente a provisão a Deus, o grego deixa o agente implícito; a tradução conserva essa contenção.
- issue: Intensidade da metáfora em ἄκος δίψης
  choice: Traduzir por «um remédio para a sede».
  alternative: «alívio para a sede»
  rationale: «Remédio» conserva a imagem curativa do substantivo grego, enquanto «alívio» a enfraqueceria.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A ordem final «de uma pedra dura, um remédio para a sede» conserva o paralelismo poético e a elipse verbal do grego sem tornar a frase obscura.
