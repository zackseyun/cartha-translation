  yaml_path: translation/deuterocanon/wisdom_of_solomon/011/021.yaml
  text: For it is always in your power to show great strength[a], and who will withstand the might of your arm?
translation:
  language: pt
  text: Pois exercer grande poder está sempre ao teu alcance[a], e quem resistirá à força do teu braço?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “exercer grande poder está sempre à tua disposição”.'
    reason: Alternativa lexical para πάρεστίν σοι, ressaltando a ideia de poder prontamente disponível.
lexical_decisions:
- source_word: μεγάλως ἰσχύειν
  choice: exercer grande poder
  rationale: A expressão combina o advérbio intensificador com o infinitivo de ἰσχύω. “Exercer grande poder” comunica de modo natural tanto a grandeza quanto a manifestação ativa da força.
- source_word: πάρεστίν σοι πάντοτε
  choice: está sempre ao teu alcance
  rationale: πάρεστιν com dativo indica algo continuamente disponível ou à disposição de alguém, não mera possibilidade abstrata.
- source_word: κράτει
  choice: à força
  rationale: κράτος denota poder efetivo ou força manifesta. “Força” mantém o contraste retórico e combina naturalmente com a imagem do braço.
- source_word: βραχίονός σου
  choice: do teu braço
  rationale: Preserva literalmente a imagem bíblica do braço como expressão do poder eficaz de Deus.
- source_word: τίς ἀντιστήσεται
  choice: quem resistirá
  rationale: O futuro forma uma pergunta retórica que ressalta a impossibilidade de oposição eficaz, sem precisar explicitar “ninguém”.
theological_decisions:
- issue: Linguagem antropomórfica do poder divino em “teu braço”
  choice: Manter a metáfora literalmente como “teu braço”
  alternative: teu poder
  rationale: A imagem é intencional e tradicional na linguagem bíblica; substituí-la por uma abstração reduziria a textura literária e teológica do texto.
- issue: Disponibilidade contínua do poder divino
  choice: “está sempre ao teu alcance”
  alternative: “tu sempre tens o poder”
  rationale: A formulação preserva a construção impessoal do grego e sua ênfase no poder sempre disponível, sem acrescentar uma formulação doutrinária mais categórica que a sintaxe exige.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento em segunda pessoa singular para conservar a interpelação direta a Deus. A ordem foi ajustada para naturalidade sem eliminar a construção impessoal nem a pergunta retórica do grego.
