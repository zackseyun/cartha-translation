  text: Resistiram aos adversários e defenderam-se dos inimigos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Fizeram frente aos inimigos e repeliram os adversários». O grego emprega dois termos próximos para os oponentes e dois verbos próximos para a resistência defensiva.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντέστησαν
  choice: Resistiram
  rationale: O aoristo de ἀνθίστημι exprime opor resistência ou fazer frente; «resistiram» é direto, natural e preserva o sentido adversativo.
- source_word: πολεμίοις
  choice: aos adversários
  rationale: O dativo plural de πολέμιος designa oponentes hostis, frequentemente em contexto militar. «Adversários» conserva esse sentido e permite manter a variação lexical do grego.
- source_word: ἠμύναντο
  choice: defenderam-se
  rationale: O aoristo médio de ἀμύνω pode significar defender-se, rechaçar ou repelir. A forma pronominal portuguesa comunica adequadamente a nuance reflexiva possível da voz média sem transformar a ação em ofensiva.
- source_word: ἐχθρούς
  choice: dos inimigos
  rationale: ἐχθρός significa «inimigo». A escolha mantém o paralelismo com πολεμίοις sem repetir a mesma palavra portuguesa.
