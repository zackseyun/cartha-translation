  yaml_path: translation/deuterocanon/psalms_of_solomon/004/003.yaml
  text: And his hand is among the first against him[a], as if in zeal, but he himself is guilty in a variety of sinful deeds[d][c][b], in acts of self-indulgence.
translation:
  language: pt
  text: E sua mão é uma das primeiras a se levantar contra ele[a], como que por zelo[b]; mas ele próprio é culpado de diversos atos pecaminosos[c] e de excessos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no início, sua mão está sobre ele”, caso se entenda a expressão grega em sentido temporal, e não como indicação de precedência entre os acusadores.'
    reason: alternative_reading
  - marker: b
    text: 'Também se pode traduzir: “como em zelo”; a expressão pode indicar zelo aparente ou uma alegada postura de zelo.'
    reason: lexical_alternative
  - marker: c
    text: A expressão grega é condensada e também pode ser entendida como “na diversidade das coisas pecaminosas”. A forma traduzida por “atos pecaminosos” também poderia, gramaticalmente, significar “pecadores”.
    reason: lexical_alternative
lexical_decisions:
- source_word: χείρ
  choice: mão
  rationale: Conserva a imagem concreta do grego e a expressão de agir contra alguém, sem substituí-la pela abstração “ação” ou “poder”.
- source_word: ἐν πρώτοις
  choice: das primeiras
  rationale: Expressa prioritariamente a prontidão ou precedência em agir contra o outro; a possível leitura temporal é registrada em nota.
- source_word: ἐπʼ αὐτόν
  choice: contra ele
  rationale: No contexto de “mão”, a preposição tem sentido adversativo e indica que a ação se dirige contra a pessoa em questão.
- source_word: ὡς ἐν ζήλει
  choice: como que por zelo
  rationale: Mantém a reserva introduzida por ὡς, sugerindo aparência ou alegação de zelo sem afirmar que ele seja genuíno.
- source_word: ἔνοχος
  choice: culpado
  rationale: Reproduz de modo natural o valor judicial e moral do termo.
- source_word: ποικιλίᾳ ἁμαρτωλῶν
  choice: diversos atos pecaminosos
  rationale: Entende ἁμαρτωλῶν como neutro plural substantivado, “coisas/atos pecaminosos”, leitura que se ajusta ao paralelismo com os excessos; a formulação portuguesa comunica a variedade sem reproduzir a compressão pouco natural do grego.
- source_word: ἀκρασίαις
  choice: excessos
  rationale: Termo corrente que comunica falta de domínio próprio e indulgência desregrada, preservando o peso moral do plural grego.
theological_decisions:
- issue: O caráter do zelo atribuído ao acusador
  choice: “como que por zelo” deixa em aberto e sob suspeita a autenticidade desse zelo.
  alternative: “por zelo” poderia apresentá-lo como inequivocamente genuíno.
  rationale: O uso de ὡς e o contraste com a culpa do próprio agente favorecem preservar a tensão entre a aparência pública de zelo e sua conduta pessoal.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com construção natural para leitores brasileiros. A tradução preserva a imagem da mão, a possível aparência de zelo e a ambiguidade gramatical relevante de ἁμαρτωλῶν nas notas.
