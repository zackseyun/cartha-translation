  text: At night and in secret places he sins as though unseen[c][b][a]; with his eyes he speaks to every woman in a scheme of evil.
translation:
  language: pt
  text: De noite e em lugares secretos[a], ele peca como se não fosse visto; com os olhos, fala[b] a toda mulher, num plano de maldade[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em lugares ocultos”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com os olhos, fala” — imagem de sinais silenciosos e sugestivos feitos pelo olhar.
    reason: cultural_note
  - marker: c
    text: 'Ou: “numa trama maligna” ou “num conluio de maldade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν νυκτὶ
  choice: De noite
  rationale: Expressão temporal natural em português, mantendo a ideia de agir sob a cobertura da noite.
- source_word: ἐν ἀποκρύφοις
  choice: em lugares secretos
  rationale: O plural substantivado aponta para locais ocultos, e não apenas para a maneira secreta de agir.
- source_word: ἁμαρτάνει
  choice: ele peca
  rationale: Tradução direta que preserva o peso moral e religioso do verbo grego.
- source_word: ὡς οὐχ ὁρώμενος
  choice: como se não fosse visto
  rationale: Mantém a forma passiva e a comparação introduzida por ὡς, sem especificar quem deixaria de vê-lo.
- source_word: ἐν ὀφθαλμοῖς αὐτοῦ λαλεῖ
  choice: com os olhos, fala
  rationale: Preserva a imagem corporal vívida de uma comunicação silenciosa feita pelo olhar.
- source_word: πάσῃ γυναικὶ
  choice: a toda mulher
  rationale: Reproduz o sentido distributivo de πάσῃ e a relação natural do dativo com o verbo 'falar'.
- source_word: ἐν συνταγῇ κακίας
  choice: num plano de maldade
  rationale: Expressa uma ação deliberadamente tramada, sem restringir συνταγή a uma conspiração formal.
