  yaml_path: translation/deuterocanon/psalms_of_solomon/004/024.yaml
  text: And they did not remember God, and they did not fear God amid all these things.
translation:
  language: pt
  text: E não se lembraram de Deus, nem temeram a Deus em meio a tudo isso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: se lembraram
  rationale: O aoristo de μιμνῄσκομαι indica trazer à memória ou manter Deus em mente; “se lembraram” é direto, natural e preserva a formulação do grego.
- source_word: ἐφοβήθησαν
  choice: temeram
  rationale: φοβέομαι, tendo Deus como objeto, pode abranger temor e reverência. “Temeram” conserva a força moral e a amplitude sem reduzir o sentido a mero respeito.
- source_word: ἐν πᾶσι τούτοις
  choice: em meio a tudo isso
  rationale: A expressão situa a falta deles no conjunto das circunstâncias anteriormente descritas. “Em meio a tudo isso” comunica esse valor contextual com clareza em português.
- source_word: καὶ ... καὶ οὐκ
  choice: E ... nem
  rationale: Na segunda oração negativa, “nem” liga naturalmente as duas faltas coordenadas em português, sem alterar a relação aditiva do grego.
theological_decisions:
- issue: Sentido do temor de Deus
  choice: temeram a Deus
  alternative: reverenciaram a Deus
  rationale: “Temer” mantém a tensão semântica entre medo, reverência e reconhecimento da autoridade divina presente em φοβέομαι, evitando uma interpretação excessivamente suavizada.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição de “Deus” foi preservada por corresponder à ênfase do texto grego.
