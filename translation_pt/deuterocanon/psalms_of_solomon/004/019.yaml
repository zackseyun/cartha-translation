  yaml_path: translation/deuterocanon/psalms_of_solomon/004/019.yaml
  text: And may his house lack everything that would fill his soul.
translation:
  language: pt
  text: E que à sua casa[a] falte tudo o que encheria a sua alma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “família” ou “casa inteira”.'
    reason: οἶκος pode indicar tanto a casa física quanto os que nela vivem.
  - marker: b
    text: “Alma” também pode ter aqui o sentido de “vida”, “ser” ou “apetite”.
    reason: ψυχή possui amplitude semântica, e o contexto pode envolver desejo ou satisfação interior.
lexical_decisions:
- source_word: ἐλλιπὴς
  choice: falte
  rationale: O adjetivo grego significa “carente, deficiente”. Como a oração não tem verbo expresso e integra uma sequência imprecatória, “que ... falte” transmite com naturalidade a força de desejo ou maldição.
- source_word: ὁ οἶκος αὐτοῦ
  choice: à sua casa
  rationale: “Casa” conserva a imagem de οἶκος e pode sugerir tanto a residência quanto, em sentido mais amplo, a família ou unidade doméstica.
- source_word: ἀπὸ παντὸς
  choice: tudo
  rationale: Com ἐλλιπής, a expressão indica privação quanto à totalidade do que é mencionado. Em português, “falte tudo” é mais natural que uma reprodução mecânica da preposição grega.
- source_word: οὗ ἐμπλήσει
  choice: o que lhe encheria
  rationale: A formulação preserva a imagem de encher e, pelo condicional, expressa aquilo que poderia proporcionar plenitude no contexto da imprecação, sem reduzir o sentido a “satisfazer”.
- source_word: ψυχὴν αὐτοῦ
  choice: a alma
  rationale: ψυχή pode designar alma, vida, pessoa ou apetite. “Alma” mantém a imagem grega e preserva sua amplitude sem escolher de forma indevida apenas o sentido de apetite.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção optativa natural. A ordem “à sua casa falte” retém o foco na privação e evita tornar a casa agente. As notas preservam as ambiguidades reais de οἶκος e ψυχή.
