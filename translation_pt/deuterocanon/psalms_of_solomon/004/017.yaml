  language: pt
  text: Que a vida dele seja de dores, pobreza e privação[a], ó Senhor; que seu sono seja de tristezas, e seu despertar, de aflições.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desamparo” ou “aflição”. O termo grego ἀπορία pode indicar falta grave, ausência de recursos, desamparo ou angústia, conforme o contexto.
