    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ὀδύναις
  choice: dores
  rationale: Abrange sofrimento físico e emocional sem intensificar indevidamente o sentido para “tormentos” ou “agonias”.
- source_word: πενίᾳ
  choice: pobreza
  rationale: Expressa com clareza a carência material indicada pelo substantivo e se encaixa naturalmente na sequência de adversidades.
- source_word: ἀπορίᾳ
  choice: privação
  rationale: Neste contexto, ao lado de “pobreza”, o termo aponta para falta grave e desamparo, não principalmente para perplexidade intelectual.
- source_word: ζωὴ
  choice: vida
  rationale: Equivalente direto que abrange toda a condição ou existência da pessoa.
- source_word: λύπαις
  choice: tristezas
  rationale: Mantém o plural grego e comunica sofrimentos emocionais repetidos ou envolventes em linguagem portuguesa natural.
- source_word: ἐξέγερσις
  choice: despertar
  rationale: Designa o ato ou estado de acordar e forma um paralelo claro com “sono”.
- source_word: ἀπορίαις
  choice: aflições
  rationale: Preserva o plural e comunica dificuldades opressivas; a variação em relação a “privação” reflete a amplitude contextual do mesmo lexema grego.
- source_word: Κύριε
  choice: ó Senhor
  rationale: Conserva o vocativo explícito e o tom de oração direta.
theological_decisions:
- issue: Força modal das orações nominais sem verbo expresso
  choice: 'Forma imprecatória: “Que ... seja”'
  alternative: 'Forma indicativa: “A vida dele é...”'
  rationale: Embora as cláusulas gregas sejam nominais e não tragam cópula expressa, o contexto imediato pertence a uma sequência contínua de imprecações optativas. A forma com “que” preserva essa função sem inserir uma certeza indicativa ausente do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “que ... seja” explicita a força imprecatória sugerida pelo contexto; a elipse posterior evita peso excessivo. A sequência “dores, pobreza e privação” mantém o paralelismo e a progressão do grego.
