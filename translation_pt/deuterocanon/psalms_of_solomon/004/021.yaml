  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A imprecação e as imagens corpóreas foram preservadas sem suavização. Não se incluiu a nota inglesa «Ou: os restos», pois ela se baseava na forma defeituosa οὐτὰ; a leitura impressa por Swete é ὀστᾶ, «ossos».'
