  to: Que a carne dos que procuram agradar às pessoas seja espalhada pelas feras, e que os ossos dos que vivem sem lei jazam diante do sol, em desonra.
  rationale: Substitui-se «fiquem expostos» por «jazam» para evitar explicitação desnecessária e conservar a imagem de restos mortais desonrados diante do sol. O restante é fiel ao grego e idiomático em português.
