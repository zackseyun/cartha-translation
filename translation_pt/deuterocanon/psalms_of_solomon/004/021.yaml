  text: May the flesh of people-pleasers be scattered by wild beasts[a], and the bones of the lawless lie before the sun in dishonor.
translation:
  language: pt
  text: Que a carne dos que procuram agradar às pessoas seja espalhada pelas feras, e que os ossos dos que vivem sem lei jazam diante do sol, em desonra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκορπισθείησαν
  choice: Que ... seja espalhada
  rationale: O optativo aoristo passivo expressa aqui um desejo ou uma imprecação; a construção com «Que» preserva esse tom.
- source_word: σάρκες
  choice: a carne
  rationale: Mantém a imagem corporal concreta e sombria do grego, sem generalizá-la como «corpos».
- source_word: ἀνθρωπαρέσκων
  choice: dos que procuram agradar às pessoas
  rationale: Expressa naturalmente a ideia de pessoas orientadas a obter aprovação humana, preservando a referência genérica do composto.
- source_word: ὑπὸ θηρίων
  choice: pelas feras
  rationale: Comunica de modo conciso e vívido a ação de animais selvagens sobre os mortos.
- source_word: ὀστᾶ (refletido pela leitura corrigida de οὐτὰ)
  choice: os ossos
  rationale: A forma fornecida «οὐτὰ» é erro de leitura/OCR de «ὀστᾶ», que Swete imprime; «ossos» também forma o paralelo concreto com «carne».
- source_word: παρανόμων
  choice: dos que vivem sem lei
  rationale: Preserva a força moral e jurídica de παράνομος em português claro, evitando que «fora da lei» sugira apenas criminalidade civil.
- source_word: κατέναντι τοῦ ἡλίου
  choice: expostos diante do sol
  rationale: «Diante do sol» conserva a imagem grega, enquanto «expostos» explicita naturalmente a vergonha pública implícita no contexto funerário.
- source_word: ἐν ἀτιμίᾳ
  choice: em desonra
  rationale: Mantém o registro solene e a noção de perda pública de honra.
theological_decisions: []
