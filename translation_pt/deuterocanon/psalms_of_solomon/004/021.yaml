    rationale: A exposição pública é fortemente sugerida por «diante do sol, em desonra», mas o grego não traz um verbo equivalente a «ficar exposto». «Jazam» preserva melhor a imagem mortuária e a elipse do segundo membro.
  revised_text: Que a carne dos que procuram agradar às pessoas seja espalhada pelas feras, e que os ossos dos que vivem sem lei jazam diante do sol, em desonra.
