review_pass:
  verdict: revise
  source_fidelity: A imprecação com «Que» reproduz adequadamente o optativo aoristo passivo σκορπισθείησαν. «Carne», «feras», «ossos», «diante do sol» e «em desonra» refletem bem a imagem concreta e pública do grego. A leitura ὀστᾶ («ossos») deve ser mantida, apesar da forma OCR defeituosa no texto fornecido. Para o segundo membro, «jazam» representa de modo mais sóbrio a elipse verbal e a imagem de cadáveres do que «fiquem expostos», que explicita um elemento apenas inferido.
  naturalness: O texto é claro, digno e natural em português moderno. «Os que procuram agradar às pessoas» é uma expressão transparente para ἀνθρωπαρέσκων. «Jazam» é um verbo literário, mas apropriado e compreensível no registro poético-solenemente imprecativo do salmo.
  terminology: '«Dos que vivem sem lei» comunica a ideia de παράνομοι sem impor uma leitura denominacional. «Em desonra» preserva adequadamente ἐν ἀτιμίᾳ. Não é necessária nota textual: a nota inglesa sobre «restos» depende da leitura errônea οὐτὰ, ao passo que a leitura correta é ὀστᾶ.'
  issues:
