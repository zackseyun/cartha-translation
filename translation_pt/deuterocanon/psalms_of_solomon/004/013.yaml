  yaml_path: translation/deuterocanon/psalms_of_solomon/004/013.yaml
  text: He did not stop until he had succeeded in scattering them as in orphanhood[c][b][a], and he made a house desolate because of lawless desire.
translation:
  language: pt
  text: Não parou até conseguir dispersá-los[c], como na orfandade[a]; e deixou uma casa desolada[b] por causa de um desejo contrário à lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como no luto pela perda de familiares” ou “como entre os órfãos”.'
    reason: lexical_alternative
  - marker: b
    text: “Casa” pode ter aqui o sentido mais amplo de “família” ou “unidade doméstica”, dado o contexto de destruição familiar.
    reason: cultural_note
  - marker: c
    text: 'O grego não expressa o objeto de “dispersar”. Uma tradução interpretativa pode suprir: “dispersar a família”.'
    reason: textual_clarity
lexical_decisions:
- source_word: οὐκ ἀπέστη
  choice: Não parou
  rationale: No contexto, a expressão indica que ele persistiu em sua ação; esta formulação comunica isso de modo natural sem sugerir apenas afastamento físico.
- source_word: ἐνίκησεν σκορπίσαι
  choice: até conseguir dispersá-los
  rationale: Com o infinitivo, ἐνίκησεν exprime êxito em realizar a ação. O pronome retoma pessoas implícitas no contexto sem antecipar οἶκον, que só aparece na oração seguinte.
- source_word: ὡς ἐν ὀρφανίᾳ
  choice: como em estado de orfandade
  rationale: A frase grega é incomum. A tradução conserva sua imagem concreta e sua estranheza significativa, sem decidir se o foco recai na perda, no desamparo ou nos órfãos.
- source_word: ἠρήμωσεν οἶκον
  choice: deixou desolada uma casa
  rationale: Preserva a força desoladora de ἠρήμωσεν e o termo concreto οἶκον, embora o contexto permita entender também a família ou unidade doméstica.
- source_word: ἕνεκεν ἐπιθυμίας παρανόμου
  choice: por causa de um desejo contrário à lei
  rationale: Torna explícita a relação de παράνομος com a transgressão da lei sem restringir ἐπιθυμία ao sentido sexual mais específico de 'luxúria'.
theological_decisions:
- issue: Natureza da lei em παρανόμου
  choice: contrário à lei
  alternative: desejo ilícito
  rationale: O grego caracteriza o desejo como transgressor da lei, mas o versículo não especifica por si só se a referência imediata é à lei divina, moral ou social; a tradução preserva essa abertura.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com sintaxe natural para leitores brasileiros. A formulação preserva a imagem incomum da orfandade, o objeto implícito de σκορπίσαι e a possível amplitude de οἶκον.
