lexical_decisions:
- source_word: παρελογίσατο
  choice: raciocinou falsamente
  rationale: Preserva a força cognitiva do verbo e sua ideia de raciocínio falho ou enganoso, sem decidir se o engano foi dirigido contra si mesmo ou contra outros.
- source_word: ἐν λόγοις
  choice: em palavras
  rationale: Tradução próxima da expressão grega, mantendo a ênfase na formulação verbal do raciocínio, embora a construção seja deliberadamente menos idiomática que «por meio de palavras».
- source_word: ὁρῶν
  choice: veja
  rationale: O particípio substantivado é expresso de modo natural em português pela oração «quem veja», preservando sua referência a alguém que observa.
- source_word: κρίνων
  choice: julgue
  rationale: Mantém o paralelo com «veja» e a força moral ou judicial do verbo grego.
theological_decisions:
- issue: Sujeito implícito dos particípios ὁρῶν e κρίνων
  choice: Não há quem veja e julgue
  alternative: Ele não vê nem julga
  rationale: O grego nega mais naturalmente a existência de alguém que veja e julgue, sem identificar explicitamente esse observador e juiz como Deus. A tradução conserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação «em palavras» conserva de propósito a expressão marcada do grego; a nota mantém a alternativa reflexiva sem a impor ao texto principal.
