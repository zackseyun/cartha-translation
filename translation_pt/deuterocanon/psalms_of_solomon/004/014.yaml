translation:
  language: pt
  text: 'Ele raciocinou falsamente, dizendo[a]: “Não há quem veja e julgue.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele se enganou com palavras.”'
