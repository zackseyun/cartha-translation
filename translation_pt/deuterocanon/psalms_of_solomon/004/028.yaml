base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/028.yaml
  text: May God remove those who do every kind of unrighteousness in arrogance[c][b][a], for the Lord our God is a great and mighty judge in righteousness.
translation:
  language: pt
  text: Que Deus remova[a] os que, com arrogância, cometem toda injustiça[b], pois o Senhor, nosso Deus, é um grande e poderoso juiz, que julga com justiça[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção grega é literalmente “Deus remover” e expressa um desejo ou uma imprecação: “Que Deus remova...”. “Remova” também pode ser entendido como “tire” ou “afaste”.'
    reason: alternative_reading
  - marker: b
    text: Ou “toda iniquidade”; também pode ser entendido como “toda espécie de injustiça”.
    reason: lexical_alternative
  - marker: c
    text: Ou “que julga com retidão”. O grego também pode ser traduzido mais literalmente como “em justiça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξᾶραι
  choice: Que Deus remova
  rationale: O infinitivo aoristo tem aqui força de desejo ou imprecação. “Que Deus remova” comunica essa força em português natural sem definir se a remoção significa expulsão, destruição ou outra forma de afastamento.
- source_word: τοὺς ποιοῦντας
  choice: os que ... cometem
  rationale: O particípio designa pessoas caracterizadas por sua conduta. Com ἀδικία, “cometer injustiça” é mais idiomático em português do que “fazer injustiça”.
- source_word: ἐν ὑπερηφανίᾳ
  choice: com arrogância
  rationale: A expressão indica a maneira ou disposição em que a injustiça é praticada. “Com arrogância” preserva o substantivo e o peso moral da expressão grega.
- source_word: πᾶσαν ἀδικίαν
  choice: toda injustiça
  rationale: A tradução mantém de perto a abrangência de πᾶσαν e o sentido moral e social de ἀδικία, sem acrescentar explicitamente “espécie de”.
- source_word: κριτὴς
  choice: juiz
  rationale: O sentido judicial é direto e fundamenta a petição para que Deus intervenha contra os injustos.
- source_word: μέγας καὶ κραταιὸς
  choice: grande e poderoso
  rationale: A combinação é clara, digna e natural em português, preservando tanto a grandeza quanto a força atribuídas ao juiz divino.
- source_word: Κύριος
  choice: Senhor
  rationale: “Senhor” é a forma portuguesa consagrada e adequada para κύριος como título divino.
- source_word: ἐν δικαιοσύνῃ
  choice: que julga com justiça
  rationale: A formulação explicita em português natural a relação da expressão preposicional com a função de juiz. “Justiça” conserva aqui tanto a ideia de julgamento justo quanto a qualidade moral indicada por δικαιοσύνη.
theological_decisions:
- issue: Sentido de δικαιοσύνη em contexto judicial
  choice: justiça
  alternative: retidão
  rationale: O contexto de κριτής favorece “justiça”, mas δικαιοσύνη também pode salientar a retidão moral de Deus. A nota preserva essa amplitude sem impor uma leitura doutrinária estreita.
- issue: Força da construção inicial com ἐξᾶραι
  choice: 'desejo ou imprecação: “Que Deus remova”'
  alternative: 'forma mais literal e elíptica: “Deus remover”'
  rationale: A sintaxe grega emprega um infinitivo, mas seu valor contextual é volitivo. A tradução apresenta esse valor de maneira inteligível, enquanto a nota registra a forma incomum do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A oração mantém o tom de imprecação sem intensificar “remova” para “destrua”. A última expressão foi levemente desdobrada para evitar a construção pouco natural “juiz em justiça”, preservando em nota a forma mais literal e a alternativa “retidão”.
