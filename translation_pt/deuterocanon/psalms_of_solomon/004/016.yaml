  yaml_path: translation/deuterocanon/psalms_of_solomon/004/016.yaml
  text: May his portion[a], O Lord, be in dishonor before you[d][c][b], his going out in groanings and his coming in in a curse.
translation:
  language: pt
  text: Que a porção dele[a], Senhor, seja desonra diante de ti; que sua saída seja entre gemidos e sua entrada, sob maldição[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sorte” ou “parte que lhe cabe”.
    reason: lexical_alternative
  - marker: b
    text: “Saída” e “entrada” formam provavelmente uma expressão bíblica pareada que abrange os movimentos ou todo o curso da vida de uma pessoa.
    reason: cultural_note
  - marker: c
    text: Mais literalmente, “em maldição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένοιτο
  choice: Que ... seja
  rationale: O optativo exprime um desejo ou pedido imprecatório; a construção portuguesa preserva esse tom de oração.
- source_word: μερὶς
  choice: porção
  rationale: Mantém a ideia de parte ou destino que cabe a alguém, sem restringi-la a uma posse material.
- source_word: ἀτιμίᾳ
  choice: desonra
  rationale: Corresponde ao substantivo abstrato e conserva o tom solene de julgamento.
- source_word: ἔξοδος
  choice: saída
  rationale: Preserva o contraste deliberado com εἴσοδος e a expressão bíblica pareada.
- source_word: στεναγμοῖς
  choice: entre gemidos
  rationale: Expressa naturalmente em português a circunstância marcada por gemidos repetidos, sem reduzir o plural grego.
- source_word: εἴσοδος
  choice: entrada
  rationale: Conserva o paralelismo antitético com 'saída'.
- source_word: ἀρᾷ
  choice: sob maldição
  rationale: Comunica de modo idiomático o estado de estar sujeito a uma maldição; a forma mais literal 'em maldição' permanece indicada em nota.
- source_word: Κύριε
  choice: Senhor
  rationale: É a forma portuguesa corrente e digna para a invocação divina.
theological_decisions:
- issue: Estrutura do desejo imprecatório
  choice: Traduzir como oração direta ao Senhor, desejando juízo sobre o indivíduo.
  alternative: Traduzir como simples previsão de julgamento.
  rationale: O optativo γένοιτο e o vocativo Κύριε sustentam um pedido ou desejo, não uma declaração meramente preditiva.
- issue: Alcance de 'saída' e 'entrada'
  choice: Manter a expressão concreta e pareada no texto.
  alternative: Explicitar como 'todo o curso da vida'.
  rationale: A formulação pode abranger os movimentos ou a vida da pessoa, mas explicitar isso no corpo do texto eliminaria a imagem e resolveria uma possível amplitude semântica.
translation_notes:
  register: Português moderno, solene e acessível. A repetição de 'que' explicita naturalmente em português que o único optativo grego rege os três elementos coordenados. O ponto e vírgula organiza a enumeração sem transformar a segunda parte em mera previsão.
