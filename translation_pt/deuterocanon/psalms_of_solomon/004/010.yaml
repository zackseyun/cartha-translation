  text: And their eyes are on a man's house in prosperity[a], like a snake[d][c][b], to undo one another's wisdom with lawless words.
translation:
  language: pt
  text: E os olhos deles estão postos na casa[b] de um homem em prosperidade[a], como uma serpente, para desfazer[c] a sabedoria uns dos outros com palavras de transgressores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em estabilidade», «em segurança» ou «em bem-estar». O termo grego pode indicar firmeza ou prosperidade estável.
    reason: lexical_alternative
  - marker: b
    text: «Casa» também pode ter o sentido de família ou propriedade, não apenas do edifício.
    reason: lexical_alternative
  - marker: c
    text: Ou «destruir», «desarticular» ou «derrubar».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: os olhos deles
  rationale: Preserva a imagem corporal vívida e o tom acusatório do grego.
- source_word: ἐπʼ οἶκον ἀνδρὸς
  choice: estão postos na casa de um homem
  rationale: Expressa naturalmente o olhar dirigido para a casa, mantendo «casa» e sua possível extensão semântica a família ou propriedade.
- source_word: ἐν εὐσταθείᾳ
  choice: em prosperidade
  rationale: No contexto, comunica uma condição firme e favorável, sem excluir os sentidos de estabilidade, segurança ou bem-estar, registrados em nota.
- source_word: ὡς ὄφις
  choice: como uma serpente
  rationale: Mantém a comparação predatória em registro bíblico atual e digno.
- source_word: διαλῦσαι
  choice: para desfazer
  rationale: O infinitivo indica finalidade; «desfazer» transmite a ideia de desarticular ou arruinar sem necessariamente afirmar destruição total.
- source_word: σοφίαν ἀλλήλων
  choice: a sabedoria uns dos outros
  rationale: Preserva tanto o valor recíproco de ἀλλήλων quanto o sentido intelectual e moral de σοφία.
- source_word: ἐν λόγοις παρανόμων
  choice: com palavras de transgressores
  rationale: Παρανόμων é genitivo plural substantivado, não adjetivo concordando com λόγοις; portanto, a tradução representa corretamente «palavras de transgressores», e não simplesmente «palavras transgressoras».
