  text: May his old age be in the solitude of childlessness[b][a], for removal.
translation:
  language: pt
  text: Que a velhice dele seja na solidão de não ter filhos, para a remoção[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo interpretativo: «até que seja levado». Literalmente, «para remoção» ou «para ser levado».'
    reason: A expressão grega εἰς ἀνάλημψιν pode sugerir o desfecho da remoção, mas não explicita uma relação temporal.
lexical_decisions:
- source_word: μονίᾳ
  choice: solidão
  rationale: O substantivo indica um estado solitário ou isolado; «solidão» é natural em português e conserva, neste contexto de imprecação, tanto o isolamento quanto seu peso aflitivo.
- source_word: ἀτεκνίας
  choice: não ter filhos
  rationale: O termo denota especificamente a ausência de filhos. A construção verbal é mais clara e corrente do que «infecundidade» e não sugere necessariamente incapacidade biológica.
- source_word: γῆρας
  choice: velhice
  rationale: Equivalente português direto para a etapa da vida indicada pelo substantivo grego.
- source_word: εἰς ἀνάλημψιν
  choice: até que seja levado
  rationale: ἀνάλημψις designa tomada ou remoção. A formulação preserva a ideia básica sem explicitar que se trata de morte, embora o contexto possa sugeri-la; a nota registra a construção grega mais literal.
- source_word: '[força imprecatória implícita]'
  choice: Que ... seja
  rationale: A oração grega não tem verbo expresso, mas a sequência contextual de pedidos de juízo sustenta a leitura optativa ou imprecatória.
theological_decisions:
- issue: Interpretar a oração sem verbo como desejo imprecatório ou descrição nominal
  choice: 'Expressá-la como desejo imprecatório: «Que a velhice dele seja...»'
  alternative: 'Traduzir como descrição: «A velhice dele, na solidão...»'
  rationale: O contexto imediato é uma série de súplicas por juízo; explicitar a força optativa conserva a tensão do texto sem suavizá-la.
- issue: Se ἀνάλημψις deve ser explicitada como morte
  choice: Manter «seja levado», sem acrescentar «pela morte»
  alternative: Traduzir «até a morte» ou «até que morra»
  rationale: A remoção pode aludir à morte no contexto, mas o substantivo grego não a nomeia diretamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Não ter filhos» evita o tom técnico de «infecundidade» e preserva a referência ao estado de ausência de descendência. A única nota assinala a ambiguidade sintática de εἰς ἀνάλημψιν.
