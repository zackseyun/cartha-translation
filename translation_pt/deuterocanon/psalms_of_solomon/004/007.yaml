  text: May God remove those who live in hypocrisy among the pious[d][c][b][a], in the corruption of his flesh and poverty his life.
translation:
  language: pt
  text: Que Deus remova[a] os que vivem em hipocrisia entre os piedosos[b] e, na corrupção de sua carne e na pobreza, remova a sua vida.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tire» ou «arranque».
    reason: lexical_alternative
  - marker: b
    text: Ou «fiéis».
    reason: lexical_alternative
  - marker: c
    text: 'O grego passa do plural («os que vivem») para os singulares «sua carne» e «sua vida», apresentando individualmente a pessoa pertencente ao grupo descrito. A construção também pode ser entendida de modo mais circunstancial: «com deterioração em sua carne e pobreza em sua vida».'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἐξάραι
  choice: remova
  rationale: Expressa a ideia principal de tirar ou eliminar do meio, sem impor necessariamente a noção de destruição física. A repetição de «remova» na segunda oração torna inteligível a construção comprimida do grego.
- source_word: ὑποκρίσει
  choice: hipocrisia
  rationale: É o equivalente direto e corrente para a dissimulação moral e religiosa indicada pelo termo.
- source_word: ὁσίων
  choice: piedosos
  rationale: Distingue ὅσιοι de um termo genérico para «santos» e descreve naturalmente pessoas caracterizadas por devoção ou fidelidade religiosa.
- source_word: φθορᾷ
  choice: corrupção
  rationale: Mantém a amplitude de φθορά, que neste contexto, ligado à carne, pode indicar deterioração ou decadência física.
- source_word: σαρκός
  choice: carne
  rationale: Conserva a concretude do grego e seu foco na condição corporal, sem transformar o termo em uma referência à natureza pecaminosa.
- source_word: πενίᾳ
  choice: pobreza
  rationale: Equivalente direto que preserva a severidade concisa da expressão.
- source_word: τὴν ζωὴν αὐτοῦ
  choice: a sua vida
  rationale: Preserva o singular do texto grego e trata «a vida» como segundo objeto de ἐξάραι, repetindo o verbo em português para clareza.
theological_decisions:
- issue: Valor sintático da abertura infinitiva
  choice: 'Desejo ou oração: «Que Deus remova...»'
  alternative: 'Declaração: «Deus remove...»; ou infinitivo dependente: «Deus remover...»'
  rationale: Embora ἐξάραι seja formalmente um infinitivo e a sintaxe seja comprimida, o contexto de denúncia favorece a leitura imprecatória, sem transformar a frase em afirmação habitual.
- issue: Relação de «a sua vida» com o verbo
  choice: Segundo objeto de «remova», com repetição do verbo em português
  alternative: 'Tomar «vida» como parte de uma expressão circunstancial: «pobreza em sua vida»'
  rationale: O acusativo τὴν ζωὴν αὐτοῦ favorece sua leitura como outro objeto de ἐξάραι. A tradução mantém a transição deliberada do grupo plural para o indivíduo singular.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por vocabulário corrente. A ordem foi levemente explicitada mediante a repetição de «remova», mas foram preservados o tom imprecatório, o singular inesperado dos pronomes e a tensão sintática da frase.
