  yaml_path: translation/deuterocanon/psalms_of_solomon/004/015.yaml
  text: He was filled with this lawlessness[a], and his eyes were set on another household to destroy it with relentless words; his soul is not satisfied, like Hades[c][b], with all these things.
translation:
  language: pt
  text: Ficou cheio desta transgressão, e seus olhos se fixaram em outra casa[a], para destruí-la com palavras implacáveis[b]; sua alma não se sacia, como o Hades[c], com todas essas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «outra família» ou «outra casa». O grego οἶκος pode indicar tanto uma construção quanto a família ou unidade doméstica que nela vive.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega traduzida por «palavras implacáveis» é difícil; também pode significar «palavras sem hesitação» ou «palavras sem demora».
    reason: alternative_reading
  - marker: c
    text: «Como o Hades» retrata algo insaciável. «Como a sepultura», «como o Sheol» ou «como o mundo dos mortos» são alternativas interpretativas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθη ἐν παρανομίᾳ ἐν ταύτῃ
  choice: Ficou cheio desta transgressão
  rationale: Preserva a imagem passiva de alguém tomado pela transgressão e verte παρανομία como violação da lei, sem reduzi-la a uma maldade genérica.
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ ἐπʼ
  choice: seus olhos se fixaram em
  rationale: Expressa em português natural o olhar dirigido com intenção para o alvo seguinte.
- source_word: οἶκον ἕτερον
  choice: outra casa
  rationale: Mantém a correspondência direta com οἶκος e permite que «casa» designe tanto a construção quanto a família ou unidade doméstica; a ambiguidade é explicitada em nota.
- source_word: ὀλοθρεύσαι
  choice: para destruí-la
  rationale: O infinitivo indica propósito hostil, e «destruir» conserva a força do verbo.
- source_word: ἐν λόγοις ἀνυπερθέσεως
  choice: com palavras implacáveis
  rationale: A expressão grega é incomum. A tradução comunica fala agressiva que não recua nem dá trégua, enquanto a nota preserva alternativas mais literais ligadas à ausência de hesitação ou demora.
- source_word: οὐκ ἐμπίπλαται ἡ ψυχὴ αὐτοῦ
  choice: sua alma não se sacia
  rationale: «Não se sacia» transmite de modo conciso a ideia contínua de apetite jamais satisfeito.
- source_word: ὡς ᾅδης
  choice: como o Hades
  rationale: Translitera diretamente o termo grego e preserva a imagem tradicional do mundo dos mortos como insaciável.
- source_word: ἐν πᾶσι τούτοις
  choice: com todas essas coisas
  rationale: Em português, a preposição «com» expressa naturalmente aquilo que, apesar de tudo, não consegue saciá-lo.
theological_decisions:
- issue: Referente e imagem de ᾅδης
  choice: Hades
  alternative: sepultura; Sheol; mundo dos mortos
  rationale: O texto grego traz ᾅδης. Manter «Hades» evita escolher silenciosamente entre interpretações cosmológicas ou metafóricas e conserva a comparação com sua proverbial insaciabilidade.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego sem rigidez excessiva. «Ficou cheio», «se fixaram» e «não se sacia» preservam as imagens do original; as notas mantêm abertas as ambiguidades reais de οἶκος, da expressão ἀνυπερθέσεως e de ᾅδης.
