  text: His eyes are on every woman without distinction[c][b][a]; his tongue is deceitful in a transaction with an oath.
translation:
  language: pt
  text: Seus olhos estão voltados para toda mulher, sem distinção[a]; sua língua é enganosa em uma transação com juramento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem se conter”. A expressão grega também pode sugerir que ele olha indiscriminadamente para todas as mulheres, sem limite ou restrição.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em um acordo, com juramento”. O termo grego pode designar uma transação, negociação ou acordo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ ἐπὶ πᾶσαν γυναῖκα
  choice: Seus olhos estão voltados para toda mulher
  rationale: Mantém a imagem concreta dos olhos como expressão da atenção ou do desejo dirigido, e preserva o alcance universal de πᾶσαν.
- source_word: ἄνευ διαστολῆς
  choice: sem distinção
  rationale: διαστολή significa primariamente distinção ou diferenciação. A tradução preserva a ideia de que ele olha indiscriminadamente para todas, sem decidir silenciosamente entre essa nuance e a possível ideia contextual de falta de contenção.
- source_word: ἡ γλῶσσα ψευδὴς
  choice: sua língua é enganosa
  rationale: Preserva a metáfora da língua como instrumento da fala e expressa naturalmente o caráter falso ou fraudulento indicado por ψευδής.
- source_word: ἐν συναλλάγματι
  choice: em uma transação
  rationale: O singular συναλλάγματι aponta para uma negociação, transação ou acordo concreto. “Transação” mantém o sentido amplo sem restringi-lo necessariamente a um contrato jurídico formal.
- source_word: μεθʼ ὅρκου
  choice: com juramento
  rationale: 'Reproduz a relação aberta do grego: a falsidade na transação é acompanhada ou reforçada por um juramento, sem pressupor um contexto judicial.'
