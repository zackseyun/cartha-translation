lexical_decisions:
- source_word: μακάριοι
  choice: Felizes
  rationale: Reproduz de modo natural e claro a forma de bem-aventurança, sem acrescentar explicitamente a ideia de que foram abençoados por um agente.
- source_word: φοβούμενοι
  choice: temem
  rationale: Preserva o verbo grego e sua tensão bíblica; no contexto, trata-se de temor reverente, não de mero pavor.
- source_word: κύριον
  choice: Senhor
  rationale: É a tradução portuguesa consagrada de κύριος como título divino e corresponde ao contexto religioso.
- source_word: ἀκακίᾳ
  choice: inocência
  rationale: Expressa de forma corrente a ausência de maldade ou dolo indicada pelo substantivo grego, embora o termo também possa salientar singeleza ou integridade moral.
