  text: Excessive in speech, excessive in outward show above all others, the one harsh in speech to condemn sinners in judgment.
translation:
  language: pt
  text: Excessivo no falar, excessivo na ostentação acima de todos, severo nas palavras para condenar pecadores em juízo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περισσὸς ἐν λόγοις
  choice: Excessivo no falar
  rationale: Preserva a ideia de excesso verbal em português natural, sem restringir λόγοις a palavras isoladas.
- source_word: περισσὸς ἐν σημειώσει
  choice: excessivo na ostentação
  rationale: Neste contexto crítico, σημείωσις aponta para exibição ou manifestação ostensiva; “ostentação” comunica a censura implícita e corresponde ao sentido de outward show.
- source_word: ὑπὲρ πάντας
  choice: mais do que todos os outros
  rationale: Expressa de modo claro o valor comparativo de ὑπέρ com acusativo.
- source_word: ὁ σκληρὸς ἐν λόγοις
  choice: é severo nas palavras
  rationale: σκληρός descreve dureza ou severidade; a formulação mantém a ligação enfática com a fala.
- source_word: κατακρῖναι ἁμαρτωλοὺς ἐν κρίσει
  choice: ao condenar pecadores em juízo
  rationale: Mantém a linguagem judicial de κατακρῖναι e κρίσει sem especificar indevidamente se o juízo é humano ou divino.
theological_decisions:
- issue: Identidade e autoridade de quem condena
  choice: Manter o sujeito sem título e a expressão geral “em juízo”
  alternative: Explicitar que se trata de um juiz religioso ou do juízo divino
  rationale: O grego não identifica aqui o cargo do personagem nem resolve a esfera exata do julgamento; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo entre as duas ocorrências de περισσός e sem marcas denominacionais.
