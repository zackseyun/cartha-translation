base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/023.yaml
  text: For he has laid waste many people’s households in disgrace[b][a], and scattered them by lust.
translation:
  language: pt
  text: Pois devastou, em desonra, muitos lares de pessoas[a] e os dispersou por desejo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “casas”; o sentido pode abranger lares inteiros ou famílias.
    reason: lexical_alternative
  - marker: b
    text: Ou “por paixão” ou “por cobiça”; no contexto, pode indicar um desejo moralmente desordenado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρήμωσεν
  choice: devastou
  rationale: Expressa a ideia forte de arruinar ou deixar desolado, em linguagem portuguesa atual e natural.
- source_word: οἴκους πολλοὺς ἀνθρώπων
  choice: muitos lares
  rationale: Embora οἴκους signifique literalmente “casas”, “lares” permite que a expressão abranja tanto a moradia quanto a unidade familiar; ἀνθρώπων indica que se trata de casas ou lares humanos, algo já implícito na formulação portuguesa.
- source_word: ἐν ἀτιμίᾳ
  choice: em desonra
  rationale: Mantém de perto a construção grega e preserva sua possível referência à condição, ao modo ou ao resultado desonroso da devastação.
- source_word: ἐσκόρπισεν
  choice: os dispersou
  rationale: Conserva a imagem central de espalhar ou desfazer a unidade dos lares; o pronome retoma “lares” sem acrescentar um objeto ausente no grego.
- source_word: ἐπιθυμίᾳ
  choice: pelo desejo
  rationale: O substantivo pode designar desejo, paixão ou cobiça. “Desejo” preserva a amplitude lexical do grego, enquanto o contexto de desonra sugere, sem exigir lexicalmente, uma conotação moral negativa.
theological_decisions:
- issue: Força moral de ἐπιθυμίᾳ
  choice: desejo
  alternative: cobiça; desejo sensual; paixão
  rationale: A tradução principal não restringe o termo a desejo sexual nem elimina sua provável conotação negativa no contexto. A nota registra as possibilidades sem impor uma interpretação doutrinária específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a concisão e o paralelismo do grego. “Em desonra” permanece deliberadamente próximo da expressão original para não decidir se a desonra caracteriza o ato, a condição dos lares ou seu resultado.
