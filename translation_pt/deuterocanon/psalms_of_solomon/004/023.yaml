  source_fidelity: A omissão de ἀνθρώπων na formulação principal deixa de explicitar que os lares são de pessoas. A revisão restitui esse elemento sem transformar o substantivo genérico em referência exclusivamente masculina. «Em desonra» preserva adequadamente a ambiguidade de ἐν ἀτιμίᾳ, e «por desejo» conserva a amplitude de ἐπιθυμίᾳ.
  naturalness: «Muitos lares de pessoas» é um pouco mais explícito que o português idiomático mais conciso, mas é claro, natural o bastante em registro bíblico moderno e evita perder um componente do grego. A pontuação impede que «em desonra» seja ligada apenas a «pessoas».
  terminology: «Devastou», «lares», «desonra», «dispersou» e «desejo» são escolhas adequadas. A nota de «desejo» mantém alternativas moralmente mais carregadas sem tornar «cobiça» ou desejo sexual o único sentido do texto.
