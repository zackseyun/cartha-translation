  text: And may the devout vindicate the judgment of their God when sinners are removed from before the righteous man—even the one speaking what pleases a man, only with deceit.
translation:
  language: pt
  text: E que os piedosos reconheçam como justa a sentença do seu Deus, quando os pecadores forem retirados de diante do justo[a] — aquele que fala o que agrada a uma pessoa somente com engano.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da presença do justo”.'
    reason: lexical_alternative
  - marker: b
    text: O grego passa do plural “pecadores” para uma descrição no singular, “aquele que fala...”, provavelmente caracterizando o pecador de modo genérico. A sintaxe do texto transmitido é incomum.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσιοι
  choice: os piedosos
  rationale: No contexto poético, designa pessoas devotas e fiéis a Deus; “os piedosos” conserva esse sentido moral e religioso sem sugerir seres angelicais.
- source_word: δικαιώσαισαν
  choice: reconheçam como justa
  rationale: O aoristo optativo expressa desejo ou exortação. Tendo κρίμα como objeto, o verbo significa afirmar ou reconhecer a justiça da sentença, não tornar algo justo.
- source_word: κρίμα
  choice: sentença
  rationale: O termo tem aqui força judicial. “Sentença” combina naturalmente com “reconheçam como justa” e mantém a ideia de uma decisão divina.
- source_word: ἐν τῷ ἐξαίρεσθαι
  choice: quando ... forem retirados
  rationale: A construção articular com infinitivo é entendida temporalmente, e a forma médio-passiva permite a formulação “forem retirados”.
- source_word: ἀπὸ προσώπου δικαίου
  choice: de diante do justo
  rationale: Preserva a expressão espacial ἀπὸ προσώπου e o singular substantivado δικαίου, sem acrescentar um substantivo ausente no grego.
- source_word: ἀνθρώπῳ ἀρέσκον
  choice: o que agrada a uma pessoa
  rationale: 'ἀρέσκον é neutro acusativo substantivado, objeto de λαλοῦντα: aquilo que é agradável a alguém. “Pessoa” comunica o valor humano genérico de ἀνθρώπῳ.'
- source_word: λαλοῦντα μόνον μετὰ δόλου
  choice: aquele que fala ... mas somente com engano
  rationale: O particípio singular caracteriza genericamente o pecador apesar da mudança de número após o plural ἁμαρτωλούς. A formulação mantém μόνον junto da ideia de falar com engano, sem eliminar a dificuldade sintática do texto transmitido.
theological_decisions:
- issue: A relação entre o singular λαλοῦντα e o plural ἁμαρτωλούς
  choice: 'Tratar o singular como caracterização genérica do pecador: “aquele que fala...”'
  alternative: 'Regularizar tudo no plural: “aqueles que falam...”'
  rationale: O texto grego transmitido muda do plural para o particípio acusativo singular. Manter o singular preserva a forma textual e sua tensão, enquanto a nota esclarece a construção.
translation_notes:
  register: Português atual, digno e de leitura ampla, com cadência poética moderada. Evitou-se vocabulário técnico no corpo do versículo; a irregularidade de número e a alternativa idiomática foram preservadas em nota.
