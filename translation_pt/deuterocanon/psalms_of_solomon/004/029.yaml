  text: Que a tua misericórdia, Senhor, esteja sobre todos os que te amam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γένοιτο
  choice: Que ... esteja
  rationale: O optativo aoristo de γίνομαι exprime aqui um desejo ou uma súplica. A construção portuguesa «Que ... esteja» comunica naturalmente essa força volitiva, sem transformar a frase numa afirmação.
- source_word: Κύριε
  choice: Senhor
  rationale: O vocativo de κύριος funciona como forma de dirigir-se a Deus. «Senhor» é a correspondência portuguesa direta e tradicional, sem expansão interpretativa.
- source_word: τὸ ἔλεός σου
  choice: a tua misericórdia
  rationale: ἔλεος designa misericórdia ou compaixão. «Misericórdia» preserva de modo direto o sentido e o tom bíblico; o possessivo foi mantido na segunda pessoa singular.
- source_word: ἐπὶ
  choice: sobre
  rationale: Com o acusativo, ἐπί apresenta a misericórdia como dirigida ou estendida a essas pessoas. «Sobre» conserva essa imagem e o registro de oração.
- source_word: πάντας τοὺς ἀγαπῶντάς σε
  choice: todos os que te amam
  rationale: O particípio presente substantivado identifica o conjunto das pessoas caracterizadas por amar a Deus. «Todos os que te amam» é fiel, claro e idiomático em português.
theological_decisions:
- issue: Tradução de κύριος em invocação direta a Deus
  choice: Senhor
  alternative: Soberano
  rationale: «Senhor» preserva a forma bíblica normal de invocação e o sentido do termo grego, sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A colocação «a tua» e «te amam» mantém naturalidade e solenidade moderada. Não são necessárias notas de rodapé.
