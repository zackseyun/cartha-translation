base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/004/025.yaml
  text: And they provoked God[a], and stirred him up to remove them from the land[c][b], because by deceit they pretended to be innocent people.
translation:
  language: pt
  text: E provocaram a ira de Deus e o incitaram a retirá-los da terra[a], porque, por meio do engano, faziam-se passar por pessoas inocentes.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do país”; “terra” também pode ter sentido mais amplo.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “almas de inocentes”; a expressão também pode significar “vidas inocentes” ou “pessoas inocentes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρώργυσαν
  choice: provocaram a ira
  rationale: Explicita de modo natural em português o sentido de provocar alguém à ira, sem enfraquecer a acusação moral.
- source_word: παρώξυναν
  choice: o incitaram
  rationale: Mantém a intensificação após a primeira acusação e a relação com o infinitivo ἐξᾶραι, preservando a forte linguagem do grego.
- source_word: ἐξᾶραι αὐτοὺς ἀπὸ τῆς γῆς
  choice: a retirá-los da terra
  rationale: Traduz a ideia de remover ou tirar, adequada ao contexto de juízo, sem impor necessariamente o sentido mais forte de exterminar.
- source_word: γῆς
  choice: terra
  rationale: Preserva a ambiguidade entre território e terra em sentido mais amplo; a nota registra a alternativa contextual 'país'.
- source_word: ψυχὰς ἀκάκων
  choice: pessoas inocentes
  rationale: ψυχή pode designar a própria pessoa, e ἀκάκων descreve pessoas sem malícia ou culpa; a formulação é clara e corrente, enquanto a nota preserva a expressão literal e outras possibilidades.
- source_word: παραλογισμῷ
  choice: por meio do engano
  rationale: Expressa o sentido de artifício enganoso ou fraude, mais provável aqui do que o sentido neutro de raciocínio.
- source_word: ὑπεκρίνοντο
  choice: faziam-se passar por
  rationale: Comunica naturalmente a ideia de representar falsamente um papel ou fingir uma identidade, em harmonia com o contexto de hipocrisia.
theological_decisions:
- issue: A linguagem de incitar Deus ao juízo
  choice: o incitaram a retirá-los
  alternative: levaram-no a retirá-los
  rationale: A opção conserva a força e a tensão da formulação grega, sem explicar de que modo a conduta humana se relaciona com a ação judicial de Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição semântica dos dois verbos de provocação foi preservada por meio de “provocaram a ira” e “incitaram”. Os marcadores de nota foram posicionados junto às expressões às quais efetivamente se referem.
