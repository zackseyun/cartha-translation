  source_fidelity: 'O texto traduz com precisão λόγοι como «palavras», παραλογισμοί como «raciocínios falsos» e εἰς πρᾶξιν como finalidade, «para pôr em prática». A construção ἐπιθυμίας ἀδίκων é morfologicamente ambígua: pode referir-se ao desejo de pessoas injustas ou ao desejo por coisas injustas. A tradução principal adota legitimamente a primeira leitura, e a nota preserva a alternativa neutra sem a apresentar como certeza.'
