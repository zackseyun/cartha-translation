  text: His words are false reasonings for carrying out the desire of unjust men[a][b][c].
translation:
  language: pt
  text: As palavras dele são raciocínios falsos[a] para pôr em prática o desejo dos injustos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «falácias» ou «enganos».
    reason: lexical_alternative
  - marker: b
    text: A expressão grega também pode ser entendida como «para pôr em prática o desejo por coisas injustas».
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: λόγοι
  choice: palavras
  rationale: Mantém o foco concreto no que ele diz, sem ampliar o termo para «discursos» ou interpretá-lo como doutrina.
- source_word: παραλογισμοί
  choice: raciocínios falsos
  rationale: O termo indica raciocínios falhos ou enganosos. A expressão preserva tanto o aspecto intelectual quanto o propósito moralmente enganador, sem recorrer a vocabulário excessivamente técnico.
- source_word: εἰς πρᾶξιν
  choice: para pôr em prática
  rationale: 'Expressa de modo natural a finalidade ou o resultado: as palavras servem para converter o desejo em ação.'
- source_word: ἐπιθυμίας
  choice: o desejo
  rationale: «Desejo» conserva a amplitude sem restringir indevidamente o sentido a cobiça sexual; o singular definido resulta natural no contexto.
- source_word: ἀδίκων
  choice: dos injustos
  rationale: Entendido no texto principal como adjetivo substantivado masculino plural em genitivo, isto é, pessoas injustas. A possibilidade gramatical de neutro plural, «de coisas injustas», é preservada em nota.
theological_decisions:
- issue: Gênero e relação semântica de ἀδίκων
  choice: dos injustos
  alternative: de coisas injustas / por coisas injustas
  rationale: A forma genitiva plural pode ser masculina ou neutra. O texto principal segue a leitura pessoal, bem atestada e coerente com o sentido moral de ἄδικος, mas a nota conserva a leitura objetiva neutra sem resolver à força a ambiguidade do grego.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. «Pôr em prática» evita o tom burocrático de «executar», enquanto «raciocínios falsos» mantém a força intelectual e moral do grego.
