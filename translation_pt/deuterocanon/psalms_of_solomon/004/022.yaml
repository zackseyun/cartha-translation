lexical_decisions:
- source_word: ἐκκόψαισαν
  choice: Que ... arranquem
  rationale: O optativo aoristo expressa aqui um desejo ou uma imprecação. A construção com «Que» reproduz essa força de modo natural em português, e «arranquem» preserva a violência da imagem sem acrescentar detalhes ausentes do grego.
- source_word: κόρακες
  choice: corvos
  rationale: κόραξ designa normalmente o corvo; «corvos» é o equivalente português corrente e mantém a imagem vívida de aves necrófagas.
- source_word: ὀφθαλμοὺς
  choice: olhos
  rationale: É o sentido comum do termo. Uma opção mais gráfica introduziria uma intensidade lexical não explicitada pelo grego.
- source_word: ὑποκρινομένων
  choice: hipócritas
  rationale: O particípio substantivado refere-se aos que fingem ou dissimulam. «Hipócritas» é conciso e natural, embora «fingidos» ou «os que dissimulam» também sejam possíveis.
