  text: And the Lord will rescue them from deceitful and sinful people[b][a], and he will rescue us from every lawless snare.
translation:
  language: pt
  text: E o Senhor os livrará de pessoas enganadoras e pecadoras, e nos livrará de toda armadilha contrária à lei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «de toda armadilha ilícita»; também é possível entender: «de toda causa de tropeço vinda do transgressor» ou «dos transgressores». Na primeira oração, também pode ser traduzido: «de pessoas enganadoras e pecadores».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Senhor
  rationale: Mantém o título divino tradicional e natural em português, sem reduzir sua força religiosa a «senhor» no sentido comum de mestre.
- source_word: ῥύσεται
  choice: livrará
  rationale: Expressa de modo claro e digno o resgate de um perigo e funciona naturalmente nas duas orações.
- source_word: ἀνθρώπων
  choice: pessoas
  rationale: O substantivo é genérico e não se restringe a homens do sexo masculino.
- source_word: δολίων
  choice: enganadoras
  rationale: Comunica diretamente a ideia de dolo e fraude, concordando com «pessoas» em português corrente.
- source_word: ἁμαρτωλῶν
  choice: pecadores
  rationale: Preserva a possibilidade de que o termo designe um grupo reconhecível como «os pecadores», em vez de diluí-lo no adjetivo genérico «pecaminosas».
- source_word: σκανδάλου
  choice: armadilha
  rationale: Neste contexto de livramento, apresenta com naturalidade a imagem de algo que faz cair ou captura, sem reduzi-la à ideia moderna de «escândalo».
- source_word: παρανόμου
  choice: contrária à lei
  rationale: Reproduz o sentido básico de παράνομος aplicado à armadilha e evita que «ilegal» soe meramente jurídico ou administrativo.
theological_decisions:
- issue: Relação sintática de δολίων καὶ ἁμαρτωλῶν com ἀνθρώπων
  choice: «de pessoas enganadoras e de pecadores»
  alternative: «de pessoas enganadoras e pecaminosas»
  rationale: A forma grega admite que ambos os adjetivos qualifiquem «pessoas», mas ἁμαρτωλῶν também pode funcionar substantivamente. A tradução mantém «pecadores» como possível designação de grupo sem impor uma identificação histórica específica.
- issue: Relação de παρανόμου com σκανδάλου
  choice: «armadilha contrária à lei»
  alternative: «armadilha do transgressor» ou «causa de tropeço vinda dos transgressores»
  rationale: A leitura adjetival, qualificando diretamente a armadilha, é a construção mais imediata; a nota conserva a ambiguidade morfológica e interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Senhor» preserva o registro bíblico; «livrará» é tradicional sem ser arcaico. A repetição de «livrará» e a mudança de «os» para «nos» foram mantidas por refletirem a estrutura e a tensão do grego.
