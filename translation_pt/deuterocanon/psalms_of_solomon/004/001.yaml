lexical_decisions:
- source_word: βέβηλε
  choice: profano
  rationale: O vocativo caracteriza a pessoa como irreverente ou moralmente impura e preserva o contraste incisivo com o conselho qualificado como santo.
- source_word: συνεδρίῳ ὁσίῳ
  choice: conselho santo
  rationale: συνέδριον designa um grupo reunido para deliberar, e ὅσιος o caracteriza como santo ou piedoso. “Conselho santo” é natural em português e mantém tanto o caráter institucional quanto o contraste moral.
- source_word: κάθησαι
  choice: toma assento
  rationale: Expressa de modo idiomático o ato de estar sentado como integrante de um conselho, sem reduzir a cena à mera postura física.
- source_word: ἡ καρδία σου μακρὰν ἀφέστηκεν
  choice: o seu coração se afastou para longe
  rationale: O perfeito de ἀφίστημι indica um afastamento ocorrido cujo resultado permanece; a formulação conserva o movimento e a atual condição de distanciamento.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: O contexto identifica κύριος como designação divina; a forma consagrada “Senhor” é clara e adequada.
- source_word: ἐν παροιμίαις
  choice: com provérbios
  rationale: É a equivalência mais direta, embora o contexto permita entender ditos proverbiais, linguagem enigmática ou palavras de escárnio; essas possibilidades são registradas em nota.
- source_word: παροργίζων
  choice: provocando
  rationale: O particípio indica causar ira ou indignação. “Provocando” mantém a construção concisa e deixa implícita, como no grego, a ideia de provocar à ira.
theological_decisions:
- issue: Sentido de ὅσιος em συνεδρίῳ ὁσίῳ
  choice: conselho santo
  alternative: conselho piedoso
  rationale: “Santo” produz em português uma oposição forte e natural a “profano”, sem identificar explicitamente o conselho com um grupo histórico específico. A alternativa “piedoso” é lexicalmente possível e fica preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem da frase conserva a acusação retórica e o contraste entre a presença externa no conselho e o afastamento interior do Senhor.
