  text: Why do you[a], profane one, sit in a holy council, while your heart has gone far away from the Lord[b], provoking the God of Israel with proverbs?
translation:
  language: pt
  text: Por que você, profano, se senta em um conselho santo[a], enquanto o seu coração se afastou para longe do Senhor, provocando o Deus de Israel com provérbios[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conselho piedoso” ou “conselho sagrado”.
    reason: lexical_alternative
  - marker: b
