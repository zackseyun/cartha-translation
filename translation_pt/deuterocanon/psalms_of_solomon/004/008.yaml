  - severity: low
    issue: «Busca agradar» acrescenta uma nuance aspectual/intencional.
    rationale: ἀρεσκόν caracteriza alguém que agrada a seres humanos; «agrada às pessoas» traduz isso mais diretamente e mantém a incerteza sintática registrada na nota.
