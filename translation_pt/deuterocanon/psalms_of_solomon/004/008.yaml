  verdict: revise
  source_fidelity: A súplica imprecatória «Que Deus exponha» transmite adequadamente a força do infinitivo grego. «Obras» preserva a repetição de ἔργα. Contudo, «busca agradar» introduz uma nuance de intenção que não é expressa de modo necessário pelo particípio ἀρεσκόν; «agrada às pessoas» é mais direto. A sequência final do rascunho reproduz a elipse grega, mas em português fica sintaticamente truncada e não deixa clara a relação de ridículo e escárnio com as obras.
  naturalness: O português é geralmente moderno e digno, mas «..., as suas obras, ao ridículo e ao escárnio» não funciona de forma natural como continuação de «exponha». Uma segunda oração no subjuntivo torna explícita em português a predicação elíptica do grego, sem alterar o sentido.
  terminology: «Ridículo» e «escárnio» distinguem de modo apropriado καταγέλωτι e μυκτηρισμῷ. «Aquele que agrada às pessoas» é compreensível internacionalmente e evita transformar uma expressão sintaticamente discutida em um rótulo técnico excessivamente interpretativo. A nota deve continuar assinalando a dificuldade do texto grego transmitido.
