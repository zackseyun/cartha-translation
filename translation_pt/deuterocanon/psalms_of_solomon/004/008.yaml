  text: May God expose the deeds of the man-pleaser[a], his deeds with ridicule and derision.
translation:
  language: pt
  text: Que Deus exponha as obras daquele que agrada às pessoas[a]; que as suas obras sejam motivo de ridículo e escárnio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «daquele que agrada aos homens». A expressão grega é sintaticamente difícil.'
    reason: Preserva a incerteza da expressão ἀνθρώπων ἀρεσκόν e registra uma tradução mais formal.
lexical_decisions:
- source_word: ἀνακαλύψαι ὁ θεὸς
  choice: Que Deus exponha
  rationale: O infinitivo ἀνακαλύψαι tem aqui força de súplica imprecatória. A construção com «que» e o presente do subjuntivo transmite naturalmente esse valor, enquanto «exponha» expressa tanto o desmascaramento como a revelação pública.
- source_word: τὰ ἔργα
  choice: as obras
  rationale: «Obras» conserva o termo moral e religioso tradicional de ἔργα e permite manter sua repetição enfática no verso.
- source_word: ἀνθρώπων ἀρεσκόν
  choice: daquele que busca agradar às pessoas
  rationale: A expressão grega transmitida é sintaticamente difícil, mas indica com maior probabilidade alguém caracterizado por procurar a aprovação humana. «Busca agradar» deixa claro o sentido ético intencional sem recorrer ao pouco natural «agradador de pessoas».
- source_word: ἐν καταγέλωτι
  choice: ao ridículo
  rationale: Na construção portuguesa com «exponha», «ao ridículo» exprime de modo natural a desonra pública associada à revelação das obras.
- source_word: μυκτηρισμῷ
  choice: ao escárnio
  rationale: «Escárnio» comunica zombaria desdenhosa e mantém distinção lexical em relação a «ridículo».
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «obras» foi mantida para reproduzir a ênfase e a elipse poética do grego; «pessoas» evita que o masculino genérico seja confundido com referência exclusiva a homens.
