  text: Because of these things he said[a], “Cast them far away from me[c][b]; the beauty of his glory did not prosper them.”
translation:
  language: pt
  text: 'Por causa dessas coisas, ele disse: “Lancem-nos para longe de mim.” A beleza de sua glória[a] não lhes trouxe benefício.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um manuscrito traz “dela” em vez de “dele/disso”.
    reason: textual_variant
  - marker: b
    text: 'Ou: “não os fez prosperar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνεκεν τούτων
  choice: Por causa dessas coisas
  rationale: Preserva a referência retrospectiva explícita às ações ou circunstâncias mencionadas anteriormente, sem especificar em excesso o antecedente.
- source_word: εἶπεν
  choice: ele disse
  rationale: Mantém o verbo comum de fala e a sobriedade do grego, que não identifica novamente o sujeito pelo nome.
- source_word: Ἀπορρίψατε αὐτὰ μακρὰν ἀπ’ ἐμοῦ
  choice: Lancem-nos para longe de mim
  rationale: “Lancem” conserva a força vívida do imperativo de ἀπορρίπτω, enquanto “para longe de mim” reproduz a ideia espacial de μακρὰν ἀπ’ ἐμοῦ.
- source_word: οὐκ εὐώδωκεν αὐτοῖς
  choice: não lhes trouxe benefício
  rationale: Expressa em português corrente o sentido contextual de εὐοδόω como beneficiar ou proporcionar vantagem, sem exigir a ideia mais estreita de prosperidade material.
- source_word: τὸ κάλλος τῆς δόξης αὐτοῦ
  choice: A beleza de sua glória
  rationale: Conserva os dois substantivos, κάλλος e δόξα, e usa um possessivo português que não força a identificação do referente de αὐτοῦ.
theological_decisions:
- issue: Referente de αὐτοῦ em τὸ κάλλος τῆς δόξης αὐτοῦ
  choice: “sua glória”, mantendo o referente aberto
  alternative: “a glória dele” ou “a glória do santuário/altar”
  rationale: A forma grega pode ser masculina ou neutra no genitivo singular, e o contexto pode apontar para uma pessoa ou para um elemento cultual neutro. O possessivo “sua” preserva essa ambiguidade genuína sem impor uma interpretação teológica.
- issue: Extensão da fala introduzida por εἶπεν
  choice: Encerrar a citação depois de “mim”
  alternative: Manter “A beleza de sua glória não lhes trouxe benefício” dentro da citação
  rationale: A passagem da primeira pessoa (“mim”) para a terceira pessoa possessiva favorece entender a última oração como comentário do salmista. Como a pontuação não pertence ao texto grego antigo, a alternativa continua possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O imperativo plural “lancem” evita uma forma excessivamente arcaica, e “trouxe benefício” comunica o valor contextual sem apagar a alternativa lexical indicada em nota.
