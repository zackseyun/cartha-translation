translation:
  language: pt
  text: e ter misericórdia do justo, livrando-o da humilhação do pecador[a][b][c], e retribuir ao pecador pelo que fez ao justo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ter misericórdia do justo em meio à humilhação do pecador». O grego é condensado; «livrando-o» explicita o provável sentido de libertação sugerido pela construção.'
    reason: lexical_alternative
  - marker: b
    text: «Humilhação» também pode ser traduzida por «aflição», «rebaixamento» ou «opressão».
    reason: lexical_alternative
  - marker: c
    text: 'Mais literalmente: «ter misericórdia do justo, da humilhação do pecador». A relação exata entre «misericórdia», «do justo» e «da humilhação do pecador» permanece sintaticamente condensada no grego.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐλεῆσαι
  choice: ter misericórdia
  rationale: Expressa de modo natural e digno a ação misericordiosa indicada pelo infinitivo aoristo, sem reduzi-la a mero sentimento.
- source_word: δίκαιον / δικαίῳ
  choice: o justo / ao justo
  rationale: O singular designa genericamente uma pessoa justa; a repetição conserva o paralelismo do grego.
- source_word: ἀπὸ ταπεινώσεως
  choice: livrando-o da humilhação
  rationale: A construção grega é condensada. O acréscimo de «livrando-o» explicita, com naturalidade em português, o provável sentido de afastamento ou libertação associado a ἀπό, enquanto «humilhação» preserva o sentido de ser rebaixado.
- source_word: ἁμαρτωλοῦ / ἁμαρτωλῷ
  choice: pelo pecador / ao pecador
  rationale: Mantém o referente pessoal no singular e o contraste direto entre o pecador e o justo.
- source_word: ἀποδοῦναι
  choice: retribuir
  rationale: Comunica a ideia de dar em retorno, aqui em sentido retributivo, com registro claro e digno.
- source_word: ἀνθʼ ὧν
  choice: pelo que
  rationale: Indica de maneira concisa o fundamento da retribuição sem acrescentar uma especificação ausente no grego.
- source_word: ἐποίησεν δικαίῳ
  choice: fez ao justo
  rationale: Reproduz naturalmente em português a relação expressa pelo dativo, sem intensificar a hostilidade além do texto.
theological_decisions:
- issue: A relação entre a misericórdia ao justo e sua humilhação pelo pecador
  choice: 'Explicitar no texto a provável ideia de libertação: «livrando-o da humilhação imposta pelo pecador»'
  alternative: 'Traduzir mais literalmente: «ter misericórdia do justo, da humilhação do pecador»'
  rationale: A sintaxe grega é comprimida e admite mais de uma formulação. A tradução principal comunica o sentido contextual provável, enquanto as notas registram a forma mais literal e outras possibilidades lexicais, sem transformar a interpretação em certeza absoluta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação por infinitivos foi preservada, como convém a um versículo que continua a estrutura da passagem anterior. Evitou-se linguagem arcaica; a ambiguidade da construção grega foi indicada nas notas.
