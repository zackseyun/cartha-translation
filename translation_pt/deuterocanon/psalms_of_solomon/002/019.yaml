  yaml_path: translation/deuterocanon/psalms_of_solomon/002/019.yaml
  text: You made their memorial perish from the earth[a]. God is a righteous judge[d][c][b], and he will not show partiality.
translation:
  language: pt
  text: Tornaste conhecida a memória deles a partir da terra.[a][b] Deus é juiz justo e não mostrará parcialidade.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “tornaste conhecida” ou “manifestaste”; a formulação da oração é incomum. Pelo contexto, alguns entendem que o sentido pretendido seria “fizeste desaparecer da terra a memória deles”, mas isso não corresponde ao significado normal do verbo grego preservado.
    reason: lexical_alternative
  - marker: b
    text: Ou “a partir do país”; o termo grego pode significar “terra” ou “país”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “não admirará um rosto”, expressão que, no contexto de um juiz, significa não favorecer ninguém nem agir com parcialidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδήλωσας
  choice: Tornaste conhecida
  rationale: Traduz diretamente o sentido normal de δηλόω, “tornar conhecido, manifestar, revelar”, sem substituir o verbo por uma ideia de desaparecimento que não está expressa no texto grego preservado.
- source_word: τὸ μνημόσυνον αὐτῶν
  choice: a memória deles
  rationale: μνημόσυνον pode designar memória, lembrança ou memorial. “A memória deles” é natural em português e mantém aberta a referência à lembrança deixada por essas pessoas.
- source_word: ἀπὸ τῆς γῆς
  choice: desde a terra
  rationale: A preposição ἀπό indica origem ou afastamento, e γῆ pode ser “terra” ou “país”. “Desde a terra” preserva a construção incomum do grego sem introduzir a noção não expressa de apagar ou eliminar.
- source_word: κριτὴς δίκαιος
  choice: juiz justo
  rationale: Mantém de modo direto tanto o caráter judicial quanto a retidão moral atribuída a Deus.
- source_word: οὐ θαυμάσει πρόσωπον
  choice: não mostrará parcialidade
  rationale: A expressão literalmente relacionada a “admirar um rosto” é um idiomatismo judicial para favorecer alguém por causa de sua pessoa ou posição. A tradução comunica esse sentido com clareza.
theological_decisions:
- issue: Como traduzir a primeira oração, cujo sentido contextual é difícil
  choice: 'Manter o significado lexical atestado de ἐδήλωσας: “Tornaste conhecida a memória deles”.'
  alternative: “Fizeste desaparecer da terra a memória deles” ou “Eliminaste da terra a memória deles”.
  rationale: Embora a ideia de eliminação da memória possa parecer mais coerente no contexto de juízo, ela contradiz o sentido normal do verbo grego transmitido e exigiria pressupor uma corrupção textual ou uma leitura conjectural. A tradução conserva a dificuldade e registra a alternativa em nota.
- issue: Sentido da expressão οὐ θαυμάσει πρόσωπον
  choice: Traduzir idiomaticamente como ausência de parcialidade.
  alternative: “Não admirará um rosto”.
  rationale: A forma literal seria obscura em português e poderia sugerir contemplação estética, enquanto o contexto judicial aponta para favoritismo ou acepção de pessoas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção deliberadamente próxima do grego na primeira oração para não ocultar sua dificuldade textual. A segunda oração é vertida de modo idiomático e natural.
