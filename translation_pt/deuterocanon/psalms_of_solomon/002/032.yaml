  text: because he despised him with dishonor[a]; he did not consider that he was a man[b], and afterward he did not consider.
translation:
  language: pt
  text: pois ele o desprezou com desonra; não levou em conta que era homem e, depois, não levou em conta o que viria depois[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o fim” ou “o desfecho”.
    reason: A expressão grega τὸ ὕστερον pode indicar o que veio depois, a consequência posterior ou o fim.
lexical_decisions:
- source_word: ἐξουδένωσεν
  choice: desprezou
  rationale: O verbo expressa tratar alguém como nada ou com desprezo. “Desprezou” é natural, conciso e preserva a força do grego.
- source_word: ἐν ἀτιμίᾳ
  choice: cobrindo-o de desonra
  rationale: A formulação torna natural em português a ideia de desonra ou ignomínia associada ao modo ou estado em que ele foi desprezado, sem reduzi-la a mero sentimento interior.
- source_word: ἐλογίσατο
  choice: levou em conta
  rationale: A expressão comunica deliberação e consideração consciente; sua repetição preserva a estrutura enfática do original.
- source_word: ἄνθρωπός
  choice: homem
  rationale: Mantém o singular do grego e sua possível ênfase na condição humana, incluindo mortalidade e fragilidade.
- source_word: τὸ ὕστερον
  choice: o que viria depois
  rationale: A expressão substantivada aponta para aquilo que é posterior, sem decidir de forma excessiva entre sequência temporal, consequência e desfecho.
theological_decisions:
- issue: Referentes dos sujeitos implícitos
  choice: Manter “ele” sem inserir “Deus”
  alternative: Explicitar “Deus” como sujeito de ἐξουδένωσεν
  rationale: O nome “Deus” não aparece neste versículo grego. Embora o contexto possa indicar mudança de referente entre as orações, explicitá-la no texto resolveria uma ambiguidade que a forma grega deixa implícita.
translation_notes:
  register: Português moderno, digno e legível. A repetição de “não levou em conta” reproduz a insistência retórica do grego; “cobrindo-o de desonra” evita a construção pouco natural “com desonra”.
