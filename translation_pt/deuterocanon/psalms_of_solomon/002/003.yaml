  text: because the sons of Jerusalem defiled the holy things of the Lord; they profaned the offerings of God with their lawless acts.
translation:
  language: pt
  text: porque os filhos de Jerusalém[a] contaminaram as coisas santas do Senhor; profanaram as ofertas a Deus[b] com seus atos de iniquidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendentes de Jerusalém”. O grego diz literalmente “filhos”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “dádivas de Deus”; no contexto, são ofertas sagradas apresentadas a Deus.
    reason: cultural_note
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: porque
  rationale: A locução introduz aqui a causa do juízo mencionado no contexto; “porque” expressa com naturalidade essa força causal.
- source_word: οἱ υἱοὶ Ἱερουσαλήμ
  choice: os filhos de Jerusalém
  rationale: Preserva o substantivo masculino plural do grego e a personificação coletiva ligada à cidade, sem o reduzir simplesmente a “habitantes”.
- source_word: ἐμίαναν
  choice: contaminaram
  rationale: Comunica a ideia de tornar ritualmente impuras coisas sagradas; é claro em português e mantém a força cultual do verbo.
- source_word: τὰ ἅγια Κυρίου
  choice: as coisas santas do Senhor
  rationale: O plural neutro aponta de modo amplo para aquilo que era consagrado ao Senhor, e não necessariamente para um único santuário ou lugar santo.
- source_word: ἐβεβήλωσαν
  choice: profanaram
  rationale: Expressa precisamente o ato de tratar como comum ou violar aquilo que é sagrado.
- source_word: τὰ δῶρα τοῦ θεοῦ
  choice: as ofertas a Deus
  rationale: No contexto cultual, δῶρα designa dádivas apresentadas como ofertas. “A Deus” esclarece em português que se trata de ofertas dedicadas a ele, evitando a impressão de dádivas concedidas por Deus aos seres humanos.
- source_word: ἐν ἀνομίαις
  choice: com seus atos de transgressão à Lei
  rationale: Representa o valor instrumental de ἐν e a relação de ἀνομία com a violação da Lei, além de tornar natural em português o plural concreto.
theological_decisions:
- issue: Sentido do genitivo em τὰ δῶρα τοῦ θεοῦ
  choice: ofertas a Deus
  alternative: dádivas de Deus
  rationale: O contexto é o da profanação das coisas sagradas, favorecendo ofertas consagradas a Deus. A alternativa formal é registrada em nota porque a construção grega, isoladamente, pode ser reproduzida como “dádivas de Deus”.
- issue: Referência de τὰ ἅγια Κυρίου
  choice: coisas santas do Senhor
  alternative: santuário do Senhor
  rationale: O plural neutro permite referência abrangente a objetos ou realidades sagradas. Traduzir no singular como “santuário” resolveria uma ambiguidade que o grego não resolve explicitamente.
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário cultual preservado. “Transgressão à Lei” mantém a dimensão normativa de ἀνομία sem recorrer ao termo menos transparente “iniquidade”.
