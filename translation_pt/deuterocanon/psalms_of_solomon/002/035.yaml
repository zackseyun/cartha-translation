  text: the one who raises me to glory and brings the proud to everlasting destruction in disgrace[d][c][b][a], because they did not know him.
translation:
  language: pt
  text: aquele que me ergue para a glória e leva os arrogantes à destruição eterna[a], em desonra[b], porque não o conheceram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “destruição para sempre”; mais literalmente, “destruição da era”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em ignomínia”.
    reason: lexical_alternative
  - marker: c
    text: Ou “não o reconheceram” ou “não o reconheceram como tal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνιστῶν
  choice: ergue
  rationale: Preserva a imagem de levantar ou fazer subir e, em contraste com o destino dos orgulhosos, evita explicitar além do necessário a ideia de exaltação.
- source_word: εἰς δόξαν
  choice: para a glória
  rationale: Expressa de modo natural o alvo ou resultado indicado por εἰς.
- source_word: κομίζων
  choice: leva
  rationale: Traduz o texto grego fornecido, κομίζων, em seu sentido básico de levar ou conduzir. Não adota a leitura conjectural κοιμίζων, que significaria fazer dormir ou deitar.
- source_word: ὑπερηφάνους
  choice: os orgulhosos
  rationale: É uma forma substantivada natural em português e conserva o sentido moral de soberba.
- source_word: ἀπωλίαν αἰῶνος
  choice: destruição eterna
  rationale: Comunica o provável valor duradouro ou sem fim de αἰῶνος, mantendo em nota a construção mais literal e sua possível nuance.
- source_word: ἐν ἀτιμίᾳ
  choice: em desonra
  rationale: Mantém de perto a construção preposicional e o sentido de perda de honra ou ignomínia.
- source_word: ἔγνωσαν
  choice: conheceram
  rationale: É a correspondência mais ampla e direta, sem decidir se o contexto enfatiza reconhecimento, conhecimento relacional ou admissão da identidade.
theological_decisions:
- issue: Referente de αὐτόν
  choice: o
  alternative: a ele
  rationale: O pronome masculino singular é preservado sem identificar explicitamente o referente, mantendo a ambiguidade do grego.
- issue: Força de αἰῶνος
  choice: eterna
  alternative: da era
  rationale: O contexto favorece duração permanente, mas a nota conserva a forma mais literal e a tensão semântica de αἰών.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem e o paralelismo do grego são preservados tanto quanto possível; a pontuação esclarece que “em desonra” acompanha o destino dos orgulhosos.
