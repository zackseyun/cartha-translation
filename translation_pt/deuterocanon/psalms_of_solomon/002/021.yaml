  yaml_path: translation/deuterocanon/psalms_of_solomon/002/021.yaml
  text: She wrapped herself in sackcloth instead of splendid clothing[c][b][a], and a cord around her head instead of a wreath.
translation:
  language: pt
  text: Ela se envolveu em pano de saco em vez de um traje esplêndido[a] e amarrou uma corda ao redor da cabeça em vez de uma grinalda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma bela veste” ou “um traje elegante”.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma coroa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέζωσατο
  choice: se envolveu ... e amarrou
  rationale: O verbo no médio descreve a própria personagem cingindo ou envolvendo em si esses elementos. A repetição do sentido verbal em duas formas naturais evita uma construção truncada em português, sem alterar a imagem do grego.
- source_word: σάκκον
  choice: pano de saco
  rationale: Expressão tradicional e ainda compreensível para a veste áspera associada ao luto e à humilhação.
- source_word: ἐνδύματος εὐπρεπείας
  choice: traje esplêndido
  rationale: Preserva o contraste entre a roupa de luto e uma veste bela, distinta ou ornamentada.
- source_word: σχοινίον
  choice: corda
  rationale: Representa de modo claro o objeto semelhante a uma corda usado ao redor da cabeça; “cordão” seria possível, mas poderia sugerir um adorno mais delicado.
- source_word: στεφάνου
  choice: grinalda
  rationale: No contraste entre adornos da cabeça, “grinalda” comunica melhor uma coroa ornamental ou festiva sem impor necessariamente uma conotação régia.
