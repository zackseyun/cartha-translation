lexical_decisions:
- source_word: ἀνέκαλυψας
  choice: Expuseste
  rationale: Expressa o ato de tirar do oculto e tornar público, de modo natural e direto em português.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: os pecados deles
  rationale: Mantém o sentido concreto e plural do grego, com referente possessivo explícito.
- source_word: ἵνα φανῇ
  choice: para que se visse
  rationale: Preserva a construção final e a voz passiva do aoristo subjuntivo, sem explicitar um agente.
- source_word: τὸ κρίμα σου
  choice: o teu juízo
  rationale: Conserva a amplitude de κρίμα, que pode designar o julgamento, veredito ou decisão judicial de Deus.
theological_decisions:
- issue: Sentido de κρίμα
  choice: juízo
  alternative: sentença
  rationale: “Juízo” preserva melhor a amplitude teológica e judicial do termo grego, sem restringi-lo apenas ao veredito final.
- issue: Relação expressa por ἵνα
  choice: para que
  alternative: de modo que
  rationale: A tradução mantém a finalidade expressa pela construção grega, sem convertê-la silenciosamente em mero resultado.
translation_notes:
  register: Português moderno, digno e claro, com forma verbal na segunda pessoa do singular coerente com a oração dirigida a Deus. A ordem da frase acompanha de perto o grego sem soar artificial.
