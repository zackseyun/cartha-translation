lexical_decisions:
- source_word: ἀτιμίᾳ
  choice: em desonra
  rationale: O substantivo expressa perda de honra, humilhação ou vergonha pública. “Em desonra” mantém a formulação concisa e digna do grego.
- source_word: τὸ κάλλος αὐτῆς
  choice: sua beleza
  rationale: κάλλος significa primariamente “beleza”, embora no contexto também possa sugerir o esplendor da cidade personificada. O possessivo preserva o referente feminino do grego.
- source_word: ἀπερρίφη
  choice: foi lançada
  rationale: A forma passiva indica que a beleza foi atirada ou arremessada. “Foi lançada” transmite a ação com naturalidade e se ajusta ao registro poético.
- source_word: ἐπὶ τὴν γῆν
  choice: por terra
  rationale: ἐπί com acusativo indica movimento em direção ao solo. A expressão idiomática “por terra” comunica tanto o movimento descendente quanto a imagem de abatimento.
