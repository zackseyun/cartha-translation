  text: For he turned his face away from mercy toward them—young and old and their children[b][a], all at once.
translation:
  language: pt
  text: Pois ele desviou o rosto e deixou de ter misericórdia deles — jovens e idosos e seus filhos — todos de uma só vez.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστρεψεν
  choice: desviou ... o rosto
  rationale: O verbo indica virar ou afastar. Com πρόσωπον como objeto, a formulação preserva a imagem concreta do grego e soa natural em português.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: o rosto
  rationale: A tradução direta preserva o idioma bíblico. O sujeito já está expresso por «ele», por isso o possessivo seria redundante em português.
- source_word: ἀπὸ ἐλέους αὐτῶν
  choice: sem ter misericórdia deles
  rationale: A construção grega é condensada. Esta formulação comunica naturalmente que a misericórdia lhes foi negada, sem substituir ἔλεος por um conceito teológico mais abstrato.
- source_word: νέον καὶ πρεσβύτην
  choice: jovens e idosos
  rationale: Embora os substantivos gregos estejam no singular, o par tem valor coletivo e distributivo. O plural é a forma idiomática mais clara em português.
- source_word: τέκνα αὐτῶν
  choice: seus filhos
  rationale: τέκνα inclui os filhos sem restrição de sexo; «filhos» tem esse uso abrangente e natural em português.
- source_word: εἰς ἅπαξ
  choice: todos de uma só vez
  rationale: A expressão reúne totalidade e simultaneidade. «Todos de uma só vez» preserva ambas no contexto de juízo.
theological_decisions:
- issue: Linguagem antropomórfica do sujeito que desvia o rosto
  choice: Preservar a imagem concreta «desviou o rosto».
  alternative: Abstrair como «retirou a sua misericórdia» ou «negou-lhes compaixão».
  rationale: O grego emprega uma imagem corporal e relacional. Mantê-la evita reduzir a tensão teológica do texto a uma afirmação abstrata.
- issue: Relação sintática condensada entre desviar o rosto e a misericórdia
  choice: Traduzir «sem ter misericórdia deles».
  alternative: «da misericórdia para com eles» ou «de se compadecer deles».
  rationale: A opção principal torna inteligível a construção em português sem decidir além do necessário se o foco recai sobre misericórdia, piedade ou compaixão; a alternativa mais literal é registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, de ampla compreensão internacional e leitura natural no Brasil. A imagem bíblica do rosto foi mantida; o travessão delimita os grupos atingidos sem alterar a abrangência do juízo.
