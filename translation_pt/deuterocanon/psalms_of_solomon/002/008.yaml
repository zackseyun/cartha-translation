- from: Pois ele desviou o rosto, sem ter misericórdia deles[a] — jovens e idosos[b] e seus filhos —, todos de uma só vez.
  to: Pois ele desviou o rosto e deixou de ter misericórdia deles — jovens e idosos e seus filhos — todos de uma só vez.
