  yaml_path: translation/deuterocanon/psalms_of_solomon/002/020.yaml
  text: For the nations insulted Jerusalem in her trampling[c][b][a]; they pulled her splendor down from the throne of glory.
translation:
  language: pt
  text: Pois as nações insultaram Jerusalém enquanto ela era pisoteada[a]; derrubaram o seu esplendor[b] do trono de glória[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A forma grega transmitida é difícil. Outra leitura possível seria: “Pois as nações viram Jerusalém pisoteada”.'
    reason: textual_and_lexical_alternative
  - marker: b
    text: 'Ou: “a sua beleza”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “de um trono glorioso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνείδισαν
  choice: insultaram
  rationale: A forma grega transmitida é textualmente difícil e costuma ser entendida como variante ou corrupção de ὠνείδισαν, de ὀνειδίζω, “insultar, censurar, escarnecer”. “Insultaram” produz uma leitura natural e condiz com o contexto de humilhação pública, sem acrescentar a ideia específica de simples percepção.
- source_word: ἐν καταπατήσει
  choice: enquanto ela era pisoteada
  rationale: O substantivo καταπάτησις descreve o ato ou estado de ser calcado aos pés. A oração temporal expressa esse quadro com naturalidade em português e conserva a imagem concreta.
- source_word: κατέσπασεν
  choice: derrubaram
  rationale: O verbo indica uma ação vigorosa para baixo. Embora esteja no singular, pode concordar em grego com o sujeito neutro plural ἔθνη; em português, a concordância natural exige o plural “derrubaram”.
- source_word: τὸ κάλλος αὐτῆς
  choice: o seu esplendor
  rationale: κάλλος pode significar “beleza”, mas “esplendor” comunica melhor, neste contexto, a dignidade visível e elevada de Jerusalém.
- source_word: ἀπὸ θρόνου δόξης
  choice: do trono de glória
  rationale: Mantém a construção genitiva e a imagem elevada do texto grego, sem decidir se δόξης é melhor entendido como genitivo atributivo, “trono glorioso”.
