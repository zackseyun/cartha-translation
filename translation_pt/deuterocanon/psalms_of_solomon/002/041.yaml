lexical_decisions:
- source_word: εὐλογητὸς
  choice: Bendito é
  rationale: O adjetivo tem função predicativa numa declaração doxológica. A formulação preserva o caráter declarativo do grego, sem transformá-lo necessariamente em desejo ou exortação, como poderia ocorrer com “bendito seja”.
- source_word: Κύριος
  choice: o Senhor
  rationale: Emprega o título divino consagrado em português; o artigo torna a expressão natural e não acrescenta conteúdo teológico estranho ao texto.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: A expressão idiomática indica duração sem fim; “para sempre” é clara, corrente e apropriada ao contexto doxológico.
- source_word: ἐνώπιον
  choice: diante de
  rationale: Reproduz de modo conciso a ideia de estar perante ou na presença de alguém, preservando a abertura semântica do grego.
- source_word: δούλων
  choice: servos
  rationale: Embora δοῦλος também possa significar “escravo”, “servos” se ajusta ao contexto relacional e cultual desta doxologia sem sair do campo semântico do termo.
