  yaml_path: translation/deuterocanon/psalms_of_solomon/002/026.yaml
  text: And they will be brought to an end[a], unless you, Lord[b], rebuke them in your wrath.
translation:
  language: pt
  text: E eles chegarão ao fim[a], a menos que tu, Senhor, os repreendas na tua ira.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serão eliminados” ou “serão destruídos” (συντελεσθήσονται).
    reason: lexical_alternative
  - marker: b
    text: 'O grego não identifica expressamente o sujeito de “chegarão ao fim”. Pelo contexto, pode-se entender: “E Israel chegará ao fim, a menos que tu, Senhor, os repreendas na tua ira”, sendo “os” uma referência aos inimigos.'
    reason: referent_ambiguity
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Mantém a conexão simples com o argumento anterior, sem acrescentar uma nuance temporal ausente no grego.
- source_word: συντελεσθήσονται
  choice: chegarão ao fim
  rationale: Expressa de modo natural em português a ideia de serem levados a seu término. Evita especificar em excesso se esse fim consiste em destruição total, embora o contexto hostil permita essa leitura.
- source_word: ἐὰν μὴ
  choice: a menos que
  rationale: É a forma portuguesa natural de exprimir a condição de exceção introduzida por ἐὰν μή.
- source_word: Κύριε
  choice: Senhor
  rationale: Traduz o vocativo de κύριος em registro próprio de oração, sem necessidade do vocativo arcaizante “ó”.
- source_word: ἐπιτιμήσεις
  choice: repreendas
  rationale: Preserva a ideia de censura severa e intervenção com autoridade contida em ἐπιτιμάω.
- source_word: ἐν ὀργῇ σου
  choice: na tua ira
  rationale: Mantém a gravidade judicial de ὀργή; “ira” é mais forte e solene que “raiva”, sem deixar de ser compreensível.
theological_decisions:
- issue: Identidade do sujeito implícito de συντελεσθήσονται e do referente de αὐτοῖς
  choice: Manter “eles” como sujeito não especificado e “os” como objeto
  alternative: Explicitar “Israel” como sujeito e entender “os” como referência aos inimigos
  rationale: O verbo grego contém um sujeito plural não expresso, e o pronome αὐτοῖς também é plural. Embora o contexto possa indicar referentes distintos, nomear Israel no texto principal resolveria uma ambiguidade que a frase grega, isoladamente, não resolve de forma explícita.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega-se “tu” por corresponder à segunda pessoa singular da oração grega e mantém-se “ira” para conservar o peso solene e judicial do original.
