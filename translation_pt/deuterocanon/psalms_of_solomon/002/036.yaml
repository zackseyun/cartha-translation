  naturalness: O texto é claro e de registro apropriado. «Um rei grande e justo» é compreensível, mas a formulação pode ser ligeiramente mais fluida com a pontuação ajustada, sem alterar os modificadores do grego. «A região debaixo do céu» expressa naturalmente a elipse espacial.
  terminology: «Juízo», «Senhor» e «nobres» são escolhas adequadas e consistentes com o registro bíblico em português. A nota de μεγιστᾶνες preserva alternativas úteis. A nota referente à expressão sob o céu deve refletir a elipse de uma região/âmbito e ter correspondência sintática com o texto.
