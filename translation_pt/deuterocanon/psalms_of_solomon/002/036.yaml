  text: And now see[a], you nobles of the earth, the judgment of the Lord, that he is a great and righteous king[b], judging what is under heaven.
translation:
  language: pt
  text: E agora, vejam, ó nobres[a] da terra, o juízo do Senhor, que ele é um rei grande e justo, que julga a região debaixo do céu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “homens importantes”, “magnatas” ou “governantes”.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, “julgando a [região] debaixo do céu”; também pode ser entendido como “julgando a terra debaixo do céu” ou “o mundo debaixo do céu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδετε
  choice: vejam
  rationale: O imperativo chama os destinatários a prestar atenção ao juízo do Senhor. “Vejam” é direto, atual e preserva a força do grego sem recorrer ao arcaizante “eis”.
- source_word: μεγιστᾶνες
  choice: nobres
  rationale: O termo designa pessoas de alta posição e influência. “Nobres” conserva o caráter sociopolítico e o tom elevado da interpelação.
- source_word: κρίμα
  choice: juízo
  rationale: Aqui o substantivo indica o ato ou a sentença judicial do Senhor. “Juízo” mantém a amplitude do termo e se ajusta ao registro bíblico corrente.
- source_word: κυρίου
  choice: Senhor
  rationale: Como título divino, κύριος é vertido por “Senhor”, conforme o uso bíblico português amplamente reconhecido.
- source_word: μέγας βασιλεὺς καὶ δίκαιος
  choice: um rei grande e justo
  rationale: A formulação associa naturalmente os dois adjetivos a βασιλεύς, preservando tanto a grandeza régia quanto a retidão moral.
- source_word: κρίνων τὴν ὑπʼ οὐρανόν
  choice: que julga o que está debaixo do céu
  rationale: O particípio apresenta a atividade judicial do rei. A expressão grega é elíptica; “o que está debaixo do céu” mantém essa abrangência sem inserir “tudo”, palavra ausente do texto.
theological_decisions:
- issue: Valor de ὅτι e explicitação do sujeito
  choice: pois ele é um rei grande e justo
  alternative: que ele é um rei grande e justo
  rationale: Neste contexto, ὅτι pode apresentar a razão pela qual se deve contemplar o juízo do Senhor. “Pois ele é” produz português natural e explicita apenas o sujeito já indicado por “Senhor”, sem introduzir uma nova identificação teológica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com a interpelação elevada “ó nobres”. Mantém-se “debaixo do céu” para refletir a expressão espacial e elíptica do grego; evita-se acrescentar “tudo”, que não aparece no original.
