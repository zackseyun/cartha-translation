  - severity: low
    issue: «Pois ele é» interpreta ὅτι como causal.
    rationale: A construção pode ser causal, mas o texto e a trilha de auditoria inglesa preservam mais diretamente um valor explicativo/declarativo. «Que ele é» mantém essa abertura sem alterar o sentido.
  - severity: low
