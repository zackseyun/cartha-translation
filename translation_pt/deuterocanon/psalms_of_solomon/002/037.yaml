  yaml_path: translation/deuterocanon/psalms_of_solomon/002/037.yaml
  text: Bless God[a], you who fear the Lord with understanding, because the mercy of the Lord is upon those who fear him[b], with judgment.
translation:
  language: pt
  text: Bendigam a Deus, vocês que temem o Senhor com entendimento[a], porque a misericórdia do Senhor está sobre os que o temem, com julgamento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com conhecimento” ou “com discernimento”.
    reason: lexical_alternative
  - marker: b
    text: Ou “com justiça”; o grego deixa condensada a relação entre misericórdia e julgamento.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bendigam
  rationale: O imperativo plural convoca diretamente os destinatários a bendizer Deus e preserva a linguagem bíblica de bênção, sem reduzi-la ao sentido mais genérico de louvor.
- source_word: οἱ φοβούμενοι
  choice: vocês que temem
  rationale: O particípio funciona como vocativo ligado ao imperativo; a formulação em segunda pessoa torna explícito e natural o discurso direto.
- source_word: κύριον / Κυρίου
  choice: Senhor
  rationale: É a tradução bíblica corrente de κύριος como título divino e mantém a repetição presente no grego.
- source_word: ἐν ἐπιστήμῃ
  choice: com entendimento
  rationale: Expressa uma reverência consciente e esclarecida em português natural, sem eliminar as possibilidades de 'conhecimento' ou 'discernimento'.
- source_word: ἔλεος
  choice: misericórdia
  rationale: É o equivalente mais direto e tradicional neste contexto devocional.
- source_word: μετὰ κρίματος
  choice: com juízo
  rationale: Mantém a formulação breve e tensa do grego, sem decidir se κρίμα enfatiza julgamento, justiça ou discernimento judicial.
theological_decisions:
- issue: Relação entre misericórdia e juízo em μετὰ κρίματος
  choice: A misericórdia do Senhor está sobre os que o temem, com juízo.
  alternative: 'A misericórdia do Senhor está sobre os que o temem, com justiça; ou: a misericórdia do Senhor para com os que o temem vem acompanhada de juízo.'
  rationale: O grego comprime a relação entre misericórdia e κρίμα. A tradução preserva essa justaposição e a tensão teológica, sem explicar de modo indevido como o juízo qualifica a misericórdia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “Senhor” e “temem” foi preservada por corresponder à estrutura do grego. Os marcadores foram posicionados junto às expressões que efetivamente explicam.
