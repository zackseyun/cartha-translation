  text: He himself is king over the heavens[a], and judges kings and rulers;
translation:
  language: pt
  text: Ele próprio é rei sobre os céus e julga reis e governantes[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “príncipes”.'
    reason: Alternativa lexical para ἀρχάς neste contexto político.
lexical_decisions:
- source_word: αὐτὸς
  choice: Ele próprio
  rationale: Expressa a ênfase do pronome grego, destacando que ele mesmo exerce a realeza.
- source_word: βασιλεὺς
  choice: rei
  rationale: Preserva diretamente a imagem régia; sem artigo, o substantivo funciona naturalmente como predicativo em português.
- source_word: ἐπὶ τῶν οὐρανῶν
  choice: sobre os céus
  rationale: Com ἐπί e genitivo, indica domínio, não apenas localização; o plural do grego é mantido.
- source_word: κρίνων
  choice: e julga
  rationale: Converte o particípio em verbo finito para dar naturalidade em português, sem perder seu sentido judicial e sua ligação com a realeza precedente.
- source_word: ἀρχάς
  choice: governantes
  rationale: Ao lado de “reis”, refere-se naturalmente a pessoas investidas de poder político; “governantes” é claro e evita impor um sentido técnico posterior.
theological_decisions:
- issue: Alcance do domínio expresso por ἐπὶ τῶν οὐρανῶν
  choice: A frase afirma a realeza divina sobre os céus e seu julgamento dos poderes políticos terrenos.
  alternative: Entender “os céus” como forma plural equivalente a “o céu”.
  rationale: 'Mantém-se o plural grego sem alterar a força teológica central: a soberania transcendente é associada ao julgamento ativo dos governantes.'
- issue: Relação sintática de κρίνων com a afirmação principal
  choice: 'Traduzir o particípio coordenadamente: “e julga”.'
  alternative: “julgando reis e governantes”.
  rationale: A forma finita é mais natural em português e preserva a ação judicial atribuída ao mesmo sujeito, sem especificar indevidamente uma relação temporal ou causal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Ele próprio” conserva a ênfase; “sobre os céus” mantém tanto a ideia de domínio quanto o plural grego.
