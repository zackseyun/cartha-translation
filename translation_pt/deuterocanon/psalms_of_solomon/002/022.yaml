  source_fidelity: 'O sentido central é preservado: a mulher personificada retira o adorno de honra/glória que Deus lhe havia conferido. Contudo, «colocado nela» é menos preciso para περιέθηκεν αὐτῇ, que indica pôr sobre/em alguém; em português, «lhe havia posto» expressa melhor essa relação sem sugerir que o objeto foi colocado dentro dela.'
