lexical_decisions:
- source_word: περιείλατο
  choice: tirou
  rationale: O aoristo médio indica naturalmente que a própria mulher retirou o que usava, sem acrescentar uma ideia de violência ausente do grego.
- source_word: μίτραν
  choice: adorno da cabeça
  rationale: No contexto da personificação feminina de Jerusalém, μίτρα designa de modo amplo um adorno ou cobertura para a cabeça. A expressão evita as conotações modernas e sobretudo masculinas de “turbante”, preservando a imagem de honra.
- source_word: δόξης
  choice: glorioso
  rationale: O adjetivo é a forma mais natural em português de expressar o genitivo qualitativo δόξης, mantendo a ideia de glória, honra e esplendor.
- source_word: περιέθηκεν αὐτῇ
  choice: havia colocado nela
  rationale: A construção preserva o sentido de pôr ou colocar sobre alguém e explicita naturalmente a anterioridade da dádiva divina em relação à retirada.
- source_word: ὁ θεός
  choice: Deus
  rationale: Equivalente português padrão, sem necessidade de expansão.
