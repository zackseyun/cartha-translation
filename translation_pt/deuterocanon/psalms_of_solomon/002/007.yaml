  yaml_path: translation/deuterocanon/psalms_of_solomon/002/007.yaml
  text: He dealt with them according to their sins[b][a], because he abandoned them into the hands of those who prevailed over them.
translation:
  language: pt
  text: Ele os tratou de acordo com os seus pecados, pois[a] os abandonou nas mãos dos que prevaleciam sobre eles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «porque».'
    reason: O grego ὅτι pode ser entendido como causal ou como explicativo/evidencial neste contexto.
  - marker: b
    text: 'Ou: «dos que os dominavam»; ou «dos que eram mais fortes do que eles».'
    reason: κατισχυόντων pode destacar o ato de prevalecer ou dominar, ou a superioridade daqueles que detinham o poder.
lexical_decisions:
- source_word: κατὰ τὰς ἁμαρτίας αὐτῶν
  choice: de acordo com os seus pecados
  rationale: κατά marca correspondência ou medida; a formulação conserva a ideia de que o tratamento recebido correspondia aos pecados deles.
- source_word: ἐποίησεν αὐτοῖς
  choice: Ele os tratou
  rationale: Embora a expressão seja literalmente «fez a eles», «os tratou» é natural em português e comunica uma ação aplicada a eles, sem acrescentar conteúdo ausente do grego.
- source_word: ἐγκατέλειπεν αὐτούς
  choice: os abandonou
  rationale: O verbo indica deixar ou desamparar alguém, expondo-o ao poder de outros; «abandonou» expressa claramente essa força.
- source_word: εἰς χεῖρας
  choice: nas mãos
  rationale: Mantém a imagem bíblica das «mãos» como expressão de domínio ou poder, em construção idiomática portuguesa.
- source_word: κατισχυόντων
  choice: dos que prevaleciam sobre eles
  rationale: O particípio presente descreve os que estavam levando vantagem ou impondo-se sobre eles; «prevaleciam» preserva tanto o aspecto ativo quanto a relativa abertura semântica.
theological_decisions:
- issue: Relação introduzida por ὅτι
  choice: pois
  alternative: porque; visto que
  rationale: Neste contexto, ὅτι pode apresentar a entrega aos adversários como explicação, concretização ou evidência do tratamento correspondente aos pecados. «Pois» evita impor uma causalidade estritamente unidirecional, e a nota conserva a alternativa causal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva a imagem bíblica de estar «nas mãos» de alguém e evita linguagem arcaica.
