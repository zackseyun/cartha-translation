  text: They made the sons of Jerusalem a mockery[a], like prostitutes within her; everyone passing by would enter in broad daylight[c][b]; they mocked them with their lawless deeds.
translation:
  language: pt
  text: Fizeram dos filhos de Jerusalém objeto de zombaria, como prostitutas dentro dela[a]; todo aquele que passava entrava em plena luz do dia[b]; zombavam das transgressões deles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “em lugar de prostitutas dentro dela”. No contexto, a expressão também pode indicar que foram tratados como prostitutas.'
    reason: alternative_reading
  - marker: b
    text: 'Literalmente: “diante do sol”, isto é, abertamente, em público.'
    reason: lexical_alternative
  - marker: c
    text: O pronome grego traduzido por “deles” pode referir-se aos filhos de Jerusalém ou aos que zombavam. A construção também pode ser entendida no sentido de zombar em meio às suas transgressões.
    reason: ambiguity
lexical_decisions:
- source_word: ἔστησαν ... εἰς ἐμπαιγμόν
  choice: fizeram ... objeto de zombaria
  rationale: A construção indica que os filhos de Jerusalém foram postos numa condição de humilhação pública; a formulação portuguesa conserva o valor resultativo e o substantivo ἐμπαιγμός.
- source_word: τοὺς υἱοὺς Ἱερουσαλήμ
  choice: os filhos de Jerusalém
  rationale: Mantém a forma masculina plural e a metáfora familiar explícitas no grego.
- source_word: ἀντὶ πορνῶν ἐν αὐτῇ
  choice: como se fossem prostitutas dentro dela
  rationale: No contexto de humilhação, ἀντί parece estabelecer uma comparação ou substituição de papel. A tradução comunica a imagem sem ocultar em nota o sentido mais literal, “em lugar das prostitutas”.
- source_word: πᾶς ὁ πορευόμενος εἰσεπορεύετο
  choice: todo aquele que passava entrava
  rationale: O imperfeito εἰσεπορεύετο sugere ação reiterada; a formulação natural em português preserva o movimento repetido dos transeuntes que entravam.
- source_word: κατέναντι τοῦ ἡλίου
  choice: em plena luz do dia
  rationale: A expressão é literalmente “diante do sol” e denota uma ação aberta e pública; “em plena luz do dia” conserva a imagem e o efeito idiomático.
- source_word: ἐνέπαιζον ταῖς ἀνομίαις αὐτῶν
  choice: zombavam por causa das transgressões deles
  rationale: O verbo mantém o tema da zombaria, enquanto o dativo pode indicar a base ou ocasião dela. “Deles” conserva, com nota, a ambiguidade do referente de αὐτῶν sem acrescentar um objeto direto ausente no grego.
theological_decisions:
- issue: Referente de αὐτῶν em ταῖς ἀνομίαις αὐτῶν
  choice: manter “deles” no texto e explicitar a ambiguidade em nota
  alternative: “suas próprias transgressões”, referindo-se aos que zombavam
  rationale: O grego não identifica inequivocamente o antecedente do pronome; escolher um dos grupos no corpo do texto resolveria indevidamente uma ambiguidade relevante.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. Conserva-se “filhos de Jerusalém” por fidelidade à metáfora masculina do original. As notas registram a literalidade de ἀντί, o idioma solar e a ambiguidade pronominal final.
