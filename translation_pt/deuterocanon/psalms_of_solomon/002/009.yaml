lexical_decisions:
- source_word: πονηρὰ
  choice: o mal
  rationale: Mantém o sentido moral amplo e incisivo do termo grego, sem restringi-lo a uma espécie específica de transgressão.
- source_word: ἐποίησαν
  choice: fizeram
  rationale: Reproduz com simplicidade o verbo grego comum e forma, com “o mal”, uma expressão natural em português.
- source_word: εἰς ἅπαξ
  choice: todos juntos
  rationale: No contexto imediato, a expressão pode indicar ação conjunta ou coletiva. A nota preserva as possibilidades de finalização decisiva ou totalidade.
- source_word: τοῦ μὴ ἀκοῦσαι
  choice: recusando-se a ouvir
  rationale: Expressa em português corrente a postura de não ouvir sugerida pelo infinitivo negativo, embora a construção grega também possa indicar propósito ou resultado; essa ambiguidade é registrada em nota.
