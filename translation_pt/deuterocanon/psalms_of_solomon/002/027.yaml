  yaml_path: translation/deuterocanon/psalms_of_solomon/002/027.yaml
  text: For they did not act out of zeal[a], but out of the desire of their soul[b],
translation:
  language: pt
  text: Pois não agiram por zelo, mas pelo desejo de sua alma[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «pelo desejo da alma»; também se pode entender «por seu próprio desejo».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: agiram
  rationale: Embora ποιέω signifique formalmente «fazer», «agir» é natural em português com expressões de motivação e mantém aberto o objeto implícito do verbo.
- source_word: ζήλῳ
  choice: zelo
  rationale: Preserva a possível força moral ou religiosa do termo e sustenta o contraste com um desejo centrado no próprio sujeito, sem impor o sentido mais negativo de «ciúme».
- source_word: ἐπιθυμίᾳ
  choice: desejo
  rationale: O termo pode indicar desejo intenso, mas «desejo» evita restringi-lo indevidamente a cobiça ou desejo sexual.
- source_word: ψυχῆς
  choice: de sua alma
  rationale: Conserva a imagem psicológica e o registro salmódico do grego, em vez de reduzir a expressão a «seu próprio desejo».
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção concisa e paralelismo preservado. A expressão «desejo de sua alma» mantém deliberadamente o sabor semítico e a ambiguidade de ψυχή entre alma e o próprio ser.
