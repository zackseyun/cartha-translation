translation:
  language: pt
  text: E o céu se tornou pesado[a][b], e a terra os abominou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A transcrição da fonte traz ἐβαρύνθησενσεν, aparentemente com uma terminação repetida; a tradução segue a forma subjacente evidente ἐβαρύνθησεν.
    reason: textual_variant
  - marker: b
    text: 'Ou: «o céu ficou pesado».'
    reason: translation_alternative
lexical_decisions:
- source_word: οὐρανός
  choice: céu
  rationale: Em paralelo com γῆ, forma a imagem cósmica de céu e terra; «céu» preserva melhor essa relação do que «firmamento» ou uma expressão de sentido meramente meteorológico.
- source_word: ἐβαρύνθησεν
  choice: se tornou pesado
  rationale: Reproduz a imagem de peso expressa por βαρύνω sem especificar indevidamente se se trata de escuridão, tempestade ou opressão moral.
- source_word: γῆ
  choice: terra
  rationale: O paralelismo cósmico com «céu» favorece «terra», e não o sentido mais localizado de «região» ou «solo».
- source_word: ἐβδελύξατο
  choice: abominou
  rationale: Comunica a forte repulsa do verbo grego e mantém o registro poético e moral do verso.
- source_word: αὐτούς
  choice: os
  rationale: Pronome objeto masculino plural que remete às pessoas julgadas no contexto.
theological_decisions:
- issue: Natureza do peso atribuído ao céu
  choice: Manter a imagem sem explicar a sua causa ou natureza
  alternative: Interpretá-la explicitamente como peso moral, escuridão ou tempestade
  rationale: O grego apresenta uma reação cósmica em paralelo com a aversão da terra, mas não define com precisão em que consiste o peso do céu; a tradução preserva essa tensão poética.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. «Abominou» mantém a intensidade da repulsa sem recorrer a linguagem excessivamente rara; «se tornou pesado» evita reduzir a imagem cósmica a um simples fenômeno meteorológico.
