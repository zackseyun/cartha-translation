  text: para lançar a arrogância do dragão na desonra.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “para pôr a arrogância do dragão em desonra”.
    reason: lexical_alternative
  - marker: b
    text: O “dragão” provavelmente representa, de modo figurado, o governante ou poder hostil do contexto; a imagem grega foi mantida no texto principal.
