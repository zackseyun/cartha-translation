lexical_decisions:
- source_word: τοῦ ἐπιθεῖναι
  choice: para lançar
  rationale: O infinitivo articular dá continuidade à finalidade ou ao pedido do contexto anterior. “Lançar ... em” conserva a ideia de colocar ou levar a determinada condição sem pressupor explicitamente uma transformação lexicalizada.
- source_word: τὴν ὑπερηφανίαν
  choice: a arrogância
  rationale: O substantivo indica exaltação orgulhosa e censurável; “arrogância” comunica claramente essa força negativa em português atual.
- source_word: τοῦ δράκοντος
  choice: do dragão
  rationale: Mantém a imagem explícita do grego e evita identificar no texto principal o governante ou poder hostil figurativamente representado.
- source_word: ἐν ἀτιμίᾳ
  choice: em desonra
  rationale: A formulação preserva o valor específico de ἀτιμία como desonra, indignidade ou ignomínia, sem o reduzir apenas à reação subjetiva de vergonha.
theological_decisions:
- issue: Identidade do “dragão”
  choice: Conservar a metáfora “dragão” no texto principal.
  alternative: Identificá-lo expressamente como um governante estrangeiro ou poder opressor histórico.
  rationale: O versículo não nomeia diretamente o referente. Manter a figura respeita a ambiguidade do texto e evita impor uma identificação histórica ou teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção concisa conserva o paralelismo poético e a imagem forte do original.
