    rationale: Em português, «Basta, Senhor, de tuas mãos pesarem...» é possível apenas de modo muito marcado e soa truncado. «Senhor, basta de tuas mãos pesarem...» preserva a súplica de cessação/suficiência expressa por Ἱκάνωσον e lê-se naturalmente.
  - severity: medium
    issue: A nota d traz uma alternativa interpretativamente excessiva.
    rationale: «Ao trazeres as nações contra Israel» torna Deus sujeito explícito da ação. Embora ἐπαγωγή possa envolver o ato de trazer contra alguém, o grego nesta formulação nominal não explicita esse agente; a nota deve manter a ambiguidade.
