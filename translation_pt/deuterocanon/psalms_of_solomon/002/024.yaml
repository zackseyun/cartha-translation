  source_fidelity: A tradução conserva adequadamente a sequência da visão e da súplica, a invocação «Senhor», o plural «mãos» e a relação instrumental entre o peso da mão divina e a investida das nações. Contudo, a construção portuguesa após «Basta» fica pouco natural, e uma alternativa da nota d explicita indevidamente Deus como agente de «trazer as nações».
  naturalness: «Suplicar perante a face do Senhor» é compreensível e preserva deliberadamente o semitismo, embora seja solene. Já «Basta, Senhor, de tuas mãos pesarem» é sintaticamente áspero em português moderno. A colocação «Senhor, basta de...» é mais idiomática, sem perda do sentido.
  terminology: «Senhor», «face do Senhor», «mãos» e «Israel» são escolhas apropriadas. «Investida das nações» traduz bem a possível acepção de ἐπαγωγή sem restringi-la a uma invasão formal nem atribuir explicitamente a Deus a ação de trazer as nações.
