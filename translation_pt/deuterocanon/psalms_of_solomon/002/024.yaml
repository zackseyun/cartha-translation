base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/024.yaml
  text: And I saw[a], and I entreated the face of the Lord and said, “Enough, Lord[d][c][b], of your hand weighing heavily on Israel by the attack of the nations.”
translation:
  language: pt
  text: 'E eu vi e supliquei perante a face do Senhor[a], dizendo: “Senhor, basta de tuas mãos pesarem sobre Israel por meio do ataque das nações[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “supliquei diante do Senhor”. A expressão grega diz literalmente “suplicar perante a face do Senhor”, uma forma semítica que pode se referir à presença ou ao favor do Senhor.
    reason: cultural_note
  - marker: b
    text: Ou “pela invasão das nações”, “por meio da investida das nações” ou “pelo trazer das nações contra Israel”. O termo grego pode designar tanto o ato de trazer algo contra alguém quanto uma investida ou ataque. Literalmente, “de tuas mãos se tornarem pesadas sobre Israel”; a expressão preserva a imagem bíblica da forte pressão exercida pelas mãos divinas. O imperativo inicial também pode ser entendido como “Faze que seja suficiente” ou “Dá-te por satisfeito”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδεήθην τοῦ προσώπου Κυρίου
  choice: supliquei perante a face do Senhor
  rationale: δέομαι expressa súplica fervorosa, e a formulação semítica com πρόσωπον é preservada de modo inteligível, sem reduzir a expressão simplesmente a uma petição dirigida ao Senhor.
- source_word: Ἱκάνωσον
  choice: Basta
  rationale: O imperativo pede que a aflição seja considerada suficiente e cesse. “Basta” comunica de modo natural e urgente esse pedido, enquanto a nota preserva traduções mais literais possíveis.
- source_word: τοῦ βαρύνεσθαι χεῖράς σου ἐπʼ Ἰσραήλ
  choice: de tuas mãos pesarem sobre Israel
  rationale: Mantém o plural χεῖράς e a imagem bíblica das mãos divinas exercendo forte pressão ou juízo sobre Israel.
- source_word: ἐν ἐπαγωγῇ ἐθνῶν
  choice: por meio do ataque das nações
  rationale: O substantivo ἐπαγωγή pode indicar tanto o ato de trazer algo contra alguém como uma incursão ou ataque; aqui a construção é entendida instrumentalmente, sem especificar mais do que o contexto permite.
- source_word: Κύριε
  choice: Senhor
  rationale: É a forma portuguesa bíblica corrente para a invocação direta do Deus de Israel e preserva o registro reverente.
theological_decisions:
- issue: Sentido da ação das mãos divinas sobre Israel
  choice: Preservar a imagem das mãos de Deus pesando sobre Israel
  alternative: Explicitar como castigo ou juízo de Deus
  rationale: O grego apresenta uma metáfora de pressão divina, sem empregar aqui um termo explícito para “castigo” ou “juízo”; a tradução conserva essa tensão em vez de interpretar seu significado teológico.
- issue: Relação entre Deus e o ataque das nações
  choice: por meio do ataque das nações
  alternative: durante o ataque das nações
  rationale: ἐν pode ter valor instrumental ou circunstancial. O contexto e a construção favorecem o valor instrumental, mas a redação não afirma além do texto qual seria a responsabilidade moral das nações ou o modo exato da ação divina.
- issue: Tradução de κύριος na oração dirigida a Deus
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” é a equivalência tradicional e amplamente compreensível, sem introduzir uma nuance mais específica do que o grego exige.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe próxima do grego sem sacrificar a naturalidade. Conserva-se deliberadamente a expressão semítica “perante a face do Senhor” e a metáfora das mãos divinas, esclarecidas em notas. O plural “mãos” segue χεῖράς no texto grego.
