lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a explicação ou fundamento da afirmação anterior, preservando de modo natural a força causal.
- source_word: οὐκ ... πᾶς ἄνθρωπος
  choice: ninguém
  rationale: No contexto, a construção expressa uma negação universal. “Ninguém” é corrente, inclusivo e natural em português.
- source_word: ἐποίησεν
  choice: fez
  rationale: O pretérito perfeito traduz diretamente o aoristo grego e apresenta o ato como concluído.
- source_word: ἐπ’ αὐτῆς
  choice: na terra
  rationale: O pronome feminino retoma ἡ γῆ (“a terra”) no versículo anterior. A formulação explicita o referente e expressa naturalmente a ideia espacial em português.
- source_word: ὅσα ἐποίησαν
  choice: o que eles fizeram
  rationale: Reproduz com clareza a comparação, sem impor se o foco recai sobre a quantidade ou sobre a natureza dos atos.
