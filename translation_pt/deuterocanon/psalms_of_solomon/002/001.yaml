  yaml_path: translation/deuterocanon/psalms_of_solomon/002/001.yaml
  text: When the sinner acted arrogantly[a], he tore down fortified walls with battering rams[b], and you did not stop him.
translation:
  language: pt
  text: Enquanto o pecador agia com arrogância,[a] derrubava muralhas fortificadas com aríetes,[b] e tu não o impediste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra tradução possível, pela posição das palavras gregas: «Enquanto o pecador se exaltava com aríetes, derrubava...»'
    reason: syntactic_ambiguity
  - marker: b
    text: Literalmente, «carneiros»; neste contexto, a palavra grega se refere provavelmente a máquinas de cerco usadas para derrubar muralhas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῷ ὑπερηφανεύεσθαι
  choice: Enquanto ... agia com arrogância
  rationale: A construção ἐν τῷ + infinitivo tem valor temporal. O verbo expressa orgulho e autoexaltação; «agia com arrogância» preserva sua força moral em português natural.
- source_word: τὸν ἁμαρτωλόν
  choice: o pecador
  rationale: Mantém o substantivo singular e sua caracterização direta, sem substituí-lo por um rótulo interpretativo como «o perverso».
- source_word: ἐν κριοῖς
  choice: com aríetes
  rationale: Embora κριός possa significar literalmente «carneiro», no contexto da derrubada de muralhas designa naturalmente aríetes, isto é, máquinas de cerco.
- source_word: κατέβαλλε
  choice: derrubava
  rationale: O pretérito imperfeito reproduz o aspecto durativo do imperfeito grego e se combina naturalmente com a oração temporal.
- source_word: τείχη ὀχυρά
  choice: muralhas fortificadas
  rationale: Em contexto militar e urbano, «muralhas fortificadas» traduz de modo claro e idiomático a ideia de muros fortes ou defensivos.
- source_word: οὐκ ἐκώλυας
  choice: tu não o impediste
  rationale: O pronome «o», implícito no grego, retoma naturalmente o pecador. A segunda pessoa singular é mantida, e o pretérito perfeito corresponde ao aoristo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de «tu» para conservar a segunda pessoa singular do original. O texto principal adota a ligação sintaticamente e contextualmente mais provável de «com aríetes» a «derrubava», enquanto a nota preserva a alternativa possibilitada pela ordem grega.
