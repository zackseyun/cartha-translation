base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/033.yaml
  text: He said[a], "I will be lord of land and sea," and he did not know that God is great[b], mighty in his great strength.
translation:
  language: pt
  text: 'Ele disse: “Serei senhor da terra[a] e do mar.” E não soube que Deus é grande, poderoso em sua grande força.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego também pode significar “território” ou “mundo”.
    reason: lexical_alternative
  - marker: b
    text: Ou “forte em seu grande poder”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: senhor
  rationale: No contexto, é a pretensão de domínio de um ser humano, não um título divino. “Senhor” preserva essa reivindicação sem acrescentar uma interpretação.
- source_word: γῆς
  choice: terra
  rationale: No par com “mar”, “terra” é a expressão portuguesa mais natural e mantém a amplitude semântica do grego, que pode indicar terra firme, território ou mundo.
- source_word: οὐκ ἔγνω
  choice: não sabia
  rationale: Reproduz diretamente a negação do verbo grego e conserva a ironia entre a arrogância do falante e seu desconhecimento da grandeza de Deus.
- source_word: κραταιὸς
  choice: poderoso
  rationale: Mantém o registro elevado e expressa força efetiva, distinguindo-se da afirmação anterior de que Deus é “grande”.
- source_word: ἐν ἰσχύϊ αὐτοῦ τῇ μεγάλῃ
  choice: em sua grande força
  rationale: Preserva a construção e a intensificação do grego, inclusive a repetição conceitual entre “poderoso” e “força”, sem suavizar a ênfase do original.
theological_decisions:
- issue: Se ὁ θεὸς deve ser entendido como título confessional ou como afirmação simples a respeito de Deus
  choice: que Deus é grande, poderoso em sua grande força
  alternative: que Deus é o Grande e Poderoso
  rationale: O grego contrasta de modo direto a pretensão humana com a grandeza e a força de Deus. A formulação titular introduziria uma ênfase que a sintaxe não exige.
translation_notes:
  register: Português atual, digno e de leitura ampla. A fala arrogante permanece concisa; a segunda oração conserva deliberadamente a repetição enfática do grego entre poder e força.
