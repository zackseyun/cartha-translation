lexical_decisions:
- source_word: ἐκχέαι
  choice: derramarem
  rationale: Preserva a imagem verbal grega de derramar e, pelo contexto sintático, mantém o infinitivo como continuação da frase anterior.
- source_word: τὴν ὀργὴν αὐτῶν εἰς ἡμᾶς
  choice: a sua ira sobre nós
  rationale: «Ira» conserva a intensidade punitiva de ὀργή, e «sobre nós» reproduz naturalmente a direção expressa por εἰς ἡμᾶς.
- source_word: ἐν ἁρπάγματι
  choice: em meio a saques
  rationale: A expressão nominal grega é compacta e difícil; esta formulação mantém o cenário de despojo violento sem decidir rigidamente se ἐν indica circunstância ou meio.
- source_word: μὴ χρονίσῃς
  choice: não demores
  rationale: É português atual e direto para o pedido de que Deus não adie sua ação.
- source_word: τοῦ ἀποδοῦναι αὐτοῖς εἰς κεφαλάς
  choice: em fazer recair sobre a cabeça deles o que merecem
  rationale: Expressa em português natural o idioma retributivo grego, segundo o qual a consequência volta sobre os próprios culpados.
theological_decisions:
- issue: Idioma de retribuição
  choice: fazer recair sobre a cabeça deles o que merecem
  alternative: retribuir-lhes sobre a cabeça
  rationale: A tradução comunica que se pede a Deus que faça a culpa e o juízo retornarem aos agressores, sem suavizar a oração nem acrescentar uma forma específica de castigo.
- issue: Valor de ἐν ἁρπάγματι
  choice: em meio a saques
  alternative: por meio de saque / saqueando-nos
  rationale: O grego permite entender a expressão como circunstância ou modo da violência. A redação conserva essa abertura, em vez de impor uma única relação sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a vírgula final porque o versículo é um segmento que prossegue no contexto. A oração imprecatória é mantida sem atenuação confessional.
