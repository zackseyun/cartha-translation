  text: And the earth will know all your righteous judgments[a], O God.
translation:
  language: pt
  text: E a terra conhecerá todos os teus julgamentos justos[a], ó Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os teus julgamentos retos”.
    reason: Alternativa lexical para δίκαια, que pode ressaltar tanto a justiça quanto a retidão dos julgamentos divinos.
lexical_decisions:
- source_word: γνώσεται
  choice: conhecerá
  rationale: O futuro de γινώσκω indica que a terra virá a conhecer ou reconhecer; “conhecerá” é direto e preserva essa amplitude sem explicitar além do grego.
- source_word: ἡ γῆ
  choice: a terra
  rationale: γῆ pode significar terra, território ou mundo; o alcance associado a todos os julgamentos divinos favorece “a terra”, que também mantém a formulação concreta do original.
- source_word: τὰ κρίματά σου
  choice: os teus julgamentos
  rationale: κρίματα designa julgamentos, decisões ou atos judiciais; “julgamentos” conserva de modo natural o sentido forense.
- source_word: πάντα
  choice: todos
  rationale: πάντα abrange o conjunto dos julgamentos e concorda naturalmente com o sintagma nominal em português.
- source_word: τὰ δίκαια
  choice: justos
  rationale: δίκαια qualifica os julgamentos como conformes à justiça; “justos” é claro e idiomático, enquanto “retos” permanece uma alternativa possível.
- source_word: ὁ θεός
  choice: ó Deus
  rationale: O nominativo com artigo funciona aqui como vocativo; “ó Deus” preserva a invocação direta e o tom de oração.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção próxima do grego. Emprega-se “teus” para manter a forma direta e solene da invocação sem arcaísmo excessivo.
