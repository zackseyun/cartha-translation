translation:
  language: pt
  text: seu corpo era levado pelas ondas com grande indignidade[a], e não havia quem o sepultasse;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em grande ultraje” ou “em meio a grande afronta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶμα
  choice: corpo
  rationale: É o equivalente comum e concreto do termo grego; a morte está clara pelo contexto, sem necessidade de explicitar “cadáver”.
- source_word: διαφερόμενον
  choice: era levado
  rationale: Preserva o sentido passivo do particípio, indicando que o corpo era transportado por uma força externa, sem acrescentar a ideia mais específica de flutuar sem rumo.
- source_word: ἐπὶ κυμάτων
  choice: pelas ondas
  rationale: Em português, “levado pelas ondas” expressa de modo natural tanto o meio quanto o movimento sobre as ondas.
- source_word: ἐν ὕβρει πολλῇ
  choice: sob grande ultraje
  rationale: “Ultraje” conserva a combinação de afronta, desonra e tratamento abusivo presente em ὕβρις, sem reduzir a expressão apenas à falta de dignidade do sepultamento.
- source_word: οὐκ ἦν ὁ θάπτων
  choice: não havia quem o sepultasse
  rationale: Reproduz de modo idiomático a ausência de qualquer pessoa que realizasse o sepultamento e preserva o tom solene do texto.
