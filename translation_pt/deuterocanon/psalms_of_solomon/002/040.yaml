base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/040.yaml
  text: For the Lord is kind to those who call on him with endurance[a], to act according to his mercy toward his holy ones[c][b], to stand continually before him in strength.
translation:
  language: pt
  text: Pois o Senhor é bondoso para com os que o invocam com perseverança[a], agindo segundo a sua misericórdia para com os seus fiéis[b], para que permaneçam continuamente diante dele com força.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com paciência” ou “com constância”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os seus piedosos”, “os seus devotos” ou “os seus santos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηστὸς
  choice: bondoso
  rationale: Expressa a bondade benevolente e relacional do Senhor, com mais precisão contextual do que o sentido amplo de “bom”.
- source_word: ἐπικαλουμένοις
  choice: os que o invocam
  rationale: No contexto de oração e súplica, “invocar” é natural, digno e preserva o sentido religioso do verbo.
- source_word: ἐν ὑπομονῇ
  choice: com perseverança
  rationale: Ὑπομονή denota constância ou resistência sustentada em meio à dificuldade, não apenas espera passiva.
- source_word: ποιῆσαι κατὰ τὸ ἔλεος αὐτοῦ
  choice: agindo segundo a sua misericórdia
  rationale: Mantém a ação divina regida por sua misericórdia e verte de modo idiomático a construção infinitiva grega comprimida.
- source_word: τοῖς ὁσίοις αὐτοῦ
  choice: os seus fiéis
  rationale: Neste contexto, ὅσιοι caracteriza pessoas devotas e leais a Deus; “fiéis” evita confundi-lo automaticamente com ἅγιοι, embora “santos” continue sendo uma alternativa lexical possível.
- source_word: παρεστᾶναι
  choice: permaneçam ... diante dele
  rationale: Preserva a imagem de presença estabelecida diante de Deus; “permaneçam” também comunica melhor em português a continuidade indicada pelo contexto.
- source_word: διὰ παντὸς
  choice: continuamente
  rationale: Reflete a duração constante da expressão grega e se ajusta ao registro devocional.
- source_word: ἐν ἰσχύι
  choice: com força
  rationale: Mantém o sentido básico de vigor ou força sem especificar, além do texto, sua origem ou natureza.
theological_decisions:
- issue: Relação dos infinitivos ποιῆσαι e παρεστᾶναι com a oração principal
  choice: 'O primeiro é apresentado como ação misericordiosa do Senhor, e o segundo como resultado para os seus fiéis: “agindo... para que permaneçam”.'
  alternative: 'Conservar ambos como infinitivos formalmente paralelos: “para agir... para permanecer...”, deixando mais aberta a identificação de seus sujeitos.'
  rationale: A sintaxe grega é condensada, e uma reprodução mecânica sugeriria em português que o próprio Senhor permanece diante de si mesmo. A formulação adotada explicita a leitura contextual mais provável, sem acrescentar a ideia de mérito ou definir a origem da força.
- issue: Sentido de ὅσιοι
  choice: fiéis
  alternative: santos; piedosos; devotos
  rationale: “Fiéis” preserva o componente de lealdade e devoção próprio de ὅσιος e evita apagar sua possível identidade comunitária no livro, sem impor uma designação sectária rígida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “para com” apenas onde ajuda a marcar a relação do Senhor com as pessoas, sem arcaísmo excessivo. A sintaxe infinitiva comprimida do grego foi moderadamente desdobrada para evitar uma leitura gramaticalmente enganosa em português.
