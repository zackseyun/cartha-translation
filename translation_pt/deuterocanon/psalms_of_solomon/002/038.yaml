lexical_decisions:
- source_word: διαστεῖλαι
  choice: distinguir
  rationale: Expressa uma diferenciação clara entre duas categorias morais e conserva o sentido discernidor ou judicial do verbo sem reduzi-lo a uma separação meramente espacial.
- source_word: ἀνὰ μέσον
  choice: entre
  rationale: É a forma idiomática e direta de marcar a distinção entre as duas partes em português.
- source_word: δικαίου
  choice: o justo
  rationale: O singular tem valor genérico e representativo; «o justo» preserva essa forma e contrasta naturalmente com «o pecador».
- source_word: ἁμαρτωλοῦ
  choice: o pecador
  rationale: Equivalente direto do substantivo singular, em paralelo antitético com «o justo».
- source_word: ἀποδοῦναι
  choice: retribuir
  rationale: No contexto de juízo, indica dar a cada um a recompensa ou punição correspondente; «retribuir» mantém o tom digno e a relação com as obras.
- source_word: ἁμαρτωλοῖς
  choice: aos pecadores
  rationale: Preserva explicitamente o dativo plural como destinatário da retribuição.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: É a expressão portuguesa corrente para a duração contínua aqui provavelmente indicada, sem esconder em nota a formulação mais literal «para a era».
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: segundo as suas obras
  rationale: Mantém de perto a construção grega e o peso moral de ἔργα, em linguagem bíblica ainda clara no português moderno.
theological_decisions:
- issue: Singulares genéricos como categorias morais
  choice: «o justo e o pecador»
  alternative: «a pessoa justa e a pecadora» ou «os justos e os pecadores»
  rationale: Os singulares gregos apresentam representantes genéricos de duas categorias no contexto do juízo. Manter o singular conserva a forma e a tensão retórica do original sem transformar a frase em referência a indivíduos específicos.
- issue: Duração expressa por εἰς τὸν αἰῶνα
  choice: «para sempre» no texto, com alternativa literal em nota
  alternative: «para a era»
  rationale: Neste contexto punitivo, a expressão provavelmente comunica duração permanente ou indefinidamente contínua. A nota preserva a formulação literal e sua possível amplitude sem tornar o texto principal obscuro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação foi vertida com «e» antes do segundo infinitivo para fluidez. «Obras» preserva a proximidade lexical e o registro bíblico sem impor uma leitura doutrinária técnica.
