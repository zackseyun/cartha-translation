lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: Pois
  rationale: Introduz de modo natural a razão do lamento, sem tornar a relação lógica mais precisa do que o grego permite.
- source_word: αὐταὶ
  choice: elas mesmas
  rationale: Preserva tanto o gênero feminino quanto a ênfase do pronome grego, sem acrescentar um substantivo ausente no versículo.
- source_word: ἐμίαυσαν (provavelmente ἐμίαναν)
  choice: profanaram
  rationale: Comunica contaminação moral ou ritual em registro solene. A forma impressa parece ser erro textual ou tipográfico por ἐμίαναν.
- source_word: ἁγνὰ
  choice: o que era puro
  rationale: Reproduz o neutro plural substantivado em português natural; a possibilidade de referência a coisas santas é mantida em nota.
- source_word: ἐν ῥύμῳ (provavelmente ἐν ῥύπῳ)
  choice: na imundície
  rationale: A leitura contextual e morfológica mais provável é ῥύπῳ, de ῥύπος, 'imundície'; ῥύμῳ no texto fornecido parece erro de transmissão ou impressão.
- source_word: ἀναμίξεως
  choice: de uma mistura ilícita
  rationale: Mantém a imagem literal de mistura e, ao mesmo tempo, sinaliza a conotação moral, provavelmente sexual, presente no contexto.
- source_word: τὴν κοιλίαν μου
  choice: Meu ventre
  rationale: Conserva a imagem corporal e visceral em português digno e corrente.
- source_word: τὰ σπλάγχνα μου
  choice: minhas entranhas
  rationale: Preserva a linguagem física intensa do lamento sem reduzi-la simplesmente a uma emoção abstrata.
- source_word: πονῶ
  choice: doem
  rationale: Expressa a dor presente e concorda naturalmente com os dois elementos corporais coordenados em português.
- source_word: ἐπὶ τούτοις
  choice: por causa dessas coisas
  rationale: Torna clara a relação causal entre os atos mencionados e a dor do salmista.
