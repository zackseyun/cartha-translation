  text: Because they themselves defiled what was pure in the filth of illicit mingling[c][b][a]. My belly and my inward parts ache over these things.
translation:
  language: pt
  text: Pois elas mesmas profanaram o que era puro[a] na imundície[c] de uma mistura ilícita[b]. Meu ventre e minhas entranhas doem por causa dessas coisas.
