  text: Sons and daughters were in evil captivity[a], their necks in a seal[b], with a mark among the nations.
translation:
  language: pt
  text: Filhos e filhas estavam em cruel cativeiro, com o pescoço marcado por um selo, marcados entre as nações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o pescoço deles em um selo, em algo marcado/distintivo entre as nações”. A imagem grega é condensada. «Marcado por um selo» e «marcados» explicitam apenas a relação sugerida pelo texto; o segundo termo também pode indicar algo notório ou posto em evidência.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ καὶ θυγατέρες
  choice: Filhos e filhas
  rationale: Mantém a expressão grega explícita e pareada, sem reduzi-la ao termo genérico “filhos” ou “crianças”.
- source_word: ἐν αἰχμαλωσίᾳ πονηρᾷ
  choice: em cruel cativeiro
  rationale: “Cativeiro” traduz diretamente αἰχμαλωσία. Neste contexto, πονηρά caracteriza a condição como penosa, maléfica ou cruel; “cruel” comunica sua gravidade em português natural sem exigir que “cativeiro” tenha caráter moral próprio.
- source_word: ἐν σφραγῖδι
  choice: sob um selo
  rationale: Conserva a imagem concreta de σφραγίς, “selo”, sem explicitar como fato uma modalidade específica de marcação que o grego apenas sugere. A nota registra a construção comprimida.
- source_word: ὁ τράχηλος αὐτῶν
  choice: o pescoço deles
  rationale: Preserva o singular coletivo do grego. Embora “os pescoços deles” seja possível em português, o singular mantém a forma e a força condensada da imagem original.
- source_word: ἐν ἐπισήμῳ
  choice: com uma marca
  rationale: ἐπίσημος pode indicar aquilo que é marcado, notório ou distintivo. “Com uma marca” retém a imagem sem decidir se se trata literalmente de ferro em brasa, estigma de escravo ou notoriedade pública.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: entre as nações
  rationale: É uma tradução transparente e não sectária de ἔθνη, adequada ao cenário de cativeiro e exposição pública.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe deliberadamente condensada para refletir a sequência nominal do grego. “Cruel cativeiro” soa natural em ampla circulação lusófona; “entre as nações” evita restringir ἔθνη ao sentido religioso de “gentios”.
