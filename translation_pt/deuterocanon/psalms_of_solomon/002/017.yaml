translation:
  language: pt
  text: Pois retribuíste aos pecadores conforme as suas obras e conforme os seus pecados extremamente maus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέδωκας
  choice: retribuíste
  rationale: Expressa a ideia de dar a alguém o que lhe é devido e preserva, no contexto, o sentido judicial de recompensa ou punição.
- source_word: τοῖς ἁμαρτωλοῖς
  choice: aos pecadores
  rationale: É o equivalente direto do substantivo grego e conserva o artigo definido, permitindo que a expressão designe tanto um grupo reconhecível no contexto quanto pecadores considerados coletivamente.
- source_word: ἔργα
  choice: obras
  rationale: Mantém a correspondência tradicional e abrangente com ἔργα, aqui entendido como atos ou conduta pelos quais os pecadores recebem retribuição.
- source_word: ἁμαρτίας
  choice: pecados
  rationale: É o equivalente mais direto e preserva a força moral e religiosa do termo grego.
- source_word: πονηρὰς σφόδρα
  choice: extremamente maus
  rationale: Reproduz tanto a qualidade negativa de πονηράς quanto a forte intensificação de σφόδρα, sem acrescentar uma categoria teológica não expressa no texto.
theological_decisions:
- issue: Possível referência de τοῖς ἁμαρτωλοῖς a um grupo específico
  choice: aos pecadores
  alternative: a pecadores
  rationale: O artigo definido do grego foi preservado. A tradução não identifica explicitamente o grupo, mantendo aberta a possibilidade de uma referência histórica específica sem excluir o sentido coletivo.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima à estrutura paralela do grego. A repetição de «conforme» conserva o paralelismo de κατὰ... καὶ κατὰ, enquanto «retribuíste» mantém o tom judicial do verso.
