base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/016.yaml
  text: I will declare you righteous[a], O God, with an upright heart; for in your judgments is your righteousness[b], O God.
translation:
  language: pt
  text: Eu declararei que és justo[a], ó Deus, com um coração íntegro; pois nos teus julgamentos está a tua justiça[b], ó Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu te justificarei” ou “reconhecerei a tua justiça”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “retidão”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιώσω
  choice: declararei que és justo
  rationale: O futuro ativo na primeira pessoa tem Deus como objeto. A formulação expressa que o salmista reconhece e proclama a justiça de Deus, sem sugerir que o torna justo; ao mesmo tempo, conserva a força declarativa do verbo.
- source_word: ἐν εὐθύτητι καρδίας
  choice: com um coração íntegro
  rationale: A expressão indica a disposição interior com que o salmista faz sua declaração. “Coração íntegro” é português natural e preserva a ideia de retidão moral e sinceridade.
- source_word: κρίμασιν
  choice: julgamentos
  rationale: O plural se refere aos julgamentos, decisões judiciais ou atos de julgar de Deus. “Julgamentos” é direto, digno e suficientemente amplo.
- source_word: δικαιοσύνη
  choice: justiça
  rationale: No contexto, a qualidade reta de Deus se manifesta em seus julgamentos. “Justiça” abrange naturalmente, em português, tanto a retidão quanto a atuação justa, enquanto “retidão” permanece uma alternativa possível.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “declararei que és justo” evita a possível impressão, em “eu te justificarei”, de que o falante torna Deus justo. “Com um coração íntegro” mantém a imagem antropológica do original em forma idiomática.
