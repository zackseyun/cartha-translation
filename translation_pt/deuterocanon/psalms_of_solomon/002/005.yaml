lexical_decisions:
- source_word: ἐξουδενώθη
  choice: foi desprezado
  rationale: O passivo exprime ser considerado sem valor ou tratado com desprezo. “Foi desprezado” é natural, digno e mantém o paralelismo de vergonha e desonra.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: diante de Deus
  rationale: Reproduz de modo direto a ideia de estar na presença, vista ou avaliação de Deus, sem restringir a expressão a um sentido exclusivamente judicial.
- source_word: ἠτιμώθη
  choice: foi desonrado
  rationale: Mantém o núcleo semântico de perda de honra e corresponde de perto ao passivo grego.
- source_word: ἕως εἰς τέλος
  choice: até o fim
  rationale: Preserva a forma e a possível tensão da expressão grega, que pode indicar duração até o fim ou, idiomaticamente, desonra completa.
theological_decisions:
- issue: Referente do sujeito não expresso dos verbos no singular
  choice: 'Omitir pronome explícito em português: “Foi desprezado...; foi desonrado...”'
  alternative: “Ele foi desprezado...” ou “Isso foi desprezado...”
  rationale: O grego não expressa o sujeito, e o contexto anterior permite relacioná-lo ao altar/santuário ou à beleza da glória de Deus, não exigindo referência ao pecador. A omissão do pronome evita resolver indevidamente o referente.
translation_notes:
  register: Português moderno, claro e solene. A construção sem pronome preserva a ambiguidade referencial do grego; “diante de Deus” e “até o fim” mantêm a concisão e o paralelismo do original.
