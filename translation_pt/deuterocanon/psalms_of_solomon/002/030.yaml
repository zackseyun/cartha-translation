base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/002/030.yaml
  text: And I did not delay until God showed me his insolence[a], pierced through on the mountains of Egypt[d][c][b], utterly despised on land and sea.
translation:
  language: pt
  text: E não esperei muito até que Deus me mostrasse a arrogância dele — ele, trespassado nas montanhas do Egito, mais desprezado que o mais insignificante na terra e no mar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἐχρόνισα
  choice: não esperei muito
  rationale: No contexto, a expressão indica que o salmista não teve de esperar muito para ver a resposta de Deus; evita sugerir que ele próprio decidiu não se demorar.
- source_word: τὴν ὕβριν αὐτοῦ
  choice: a arrogância dele
  rationale: ὕβρις denota orgulho desmedido manifestado em conduta insolente ou ultrajante. “Arrogância” é claro, atual e preserva a força moral do termo.
- source_word: ἐκκενεκεντημένον
  choice: atravessado
  rationale: O particípio masculino retrata o adversário traspassado violentamente, sem especificar a arma. A pontuação deixa claro que não é a arrogância que foi atravessada.
- source_word: ἐπὶ τῶν ὀρέων Αἰγύπτου
  choice: nas montanhas do Egito
  rationale: Tradução direta que conserva a referência inesperada, mas inequívoca, às montanhas.
- source_word: ὑπὲρ ἐλάχιστον ἐξουδενωμένον
  choice: reduzido a menos que o mais insignificante
  rationale: A formulação preserva a comparação elíptica e a ideia de ser rebaixado e tratado como nada, sem acrescentar explicitamente “pessoa” ao texto principal.
- source_word: ἐπὶ γῆς καὶ θαλάσσης
  choice: na terra e no mar
  rationale: Mantém o paralelismo espacial e o alcance abrangente da humilhação.
theological_decisions:
- issue: Referente dos particípios masculinos
  choice: A pontuação depois de “dele” faz “atravessado” e “reduzido” descreverem o adversário.
  alternative: Fazer os particípios parecerem modificar “arrogância”.
  rationale: ἐκκενεκεντημένον e ἐξουδενωμένον são masculinos acusativos singulares e não concordam com o substantivo feminino ὕβριν; portanto, retomam o homem cuja arrogância Deus revelou.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a imagem concreta e incomum das “montanhas do Egito” e a comparação extrema do grego; os dois-pontos esclarecem a mudança de “arrogância” para o homem arrogante sem inserir um pronome explicativo no texto.
