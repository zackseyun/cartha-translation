  yaml_path: translation/deuterocanon/psalms_of_solomon/002/002.yaml
  text: Foreign nations went up onto your altar[b][a]; they trampled it with their sandals in arrogance.
translation:
  language: pt
  text: Nações estrangeiras[a][b] subiram sobre o teu altar; pisotearam-no com suas sandálias, com arrogância.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “gentios”; ἔθνη pode designar “nações” em geral ou, num contexto cultual judaico, especificamente povos não israelitas.
    reason: lexical_alternative
  - marker: b
    text: Ou “nações alheias” ou “estranhas”, preservando a noção adicional de alteridade presente em ἀλλότρια.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν
  choice: subiram sobre
  rationale: Preserva o movimento ascendente concreto e, com ἐπὶ mais acusativo, a ideia de chegar à superfície do altar, sem introduzir uma nuance militar não expressa.
- source_word: τὸ θυσιαστήριόν σου
  choice: o teu altar
  rationale: “Altar” é o equivalente corrente e suficiente; o possessivo mantém a invocação direta a Deus.
- source_word: ἔθνη ἀλλότρια
  choice: Nações estrangeiras
  rationale: “Nações” conserva o sentido básico de ἔθνη, enquanto “estrangeiras” expressa a alteridade acrescentada por ἀλλότρια. As notas registram alternativas legítimas.
- source_word: κατεπάτησαν
  choice: pisotearam-no
  rationale: Expressa a ação vigorosa de calcar aos pés e sua força profanadora; o pronome retoma naturalmente “altar”.
- source_word: ἐν ὑποδήμασιν αὐτῶν
  choice: com suas sandálias
  rationale: Traduz o instrumento ou a circunstância da ação e mantém a imagem histórica concreta do calçado.
- source_word: ἐν ὑπερηφανίᾳ
  choice: com arrogância
  rationale: Comunica de modo natural a maneira e a avaliação moral do ato, preservando o valor de soberba ou insolência.
