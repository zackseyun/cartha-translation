  text: Just as they themselves used to do[a], they displayed their iniquities before the sun, and the daughters of Jerusalem were profane according to your judgment[d][c][b],
translation:
  language: pt
  text: Assim como eles próprios faziam, expuseram as suas iniquidades diante do sol[a], e as filhas de Jerusalém eram profanas segundo o teu julgamento[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, abertamente, em público; literalmente, «diante do sol».
    reason: idiom_explanation
  - marker: b
    text: 'Ou: «estavam profanadas segundo o teu julgamento».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὰ ἐποίουν αὐτοί
  choice: Assim como eles próprios faziam
  rationale: Preserva a comparação introduzida por καθά, o aspecto habitual do imperfeito ἐποίουν e a ênfase explícita de αὐτοί.
- source_word: παρεδειγμάτισαν
  choice: expuseram
  rationale: O verbo indica tornar algo visível ou submetê-lo à exposição pública; “expuseram” é natural em português e mantém esse sentido.
- source_word: ἀδικίας
  choice: iniquidades
  rationale: O plural designa atos moralmente perversos, não apenas desigualdades ou injustiças sociais; “iniquidades” conserva o peso religioso e moral do termo.
- source_word: ἀπέναντι τοῦ ἡλίου
  choice: diante do sol
  rationale: Reproduz a imagem concreta do grego, deixando a nota esclarecer sua força idiomática de publicidade.
- source_word: βέβηλοι
  choice: profanadas
  rationale: Comunica a perda ou violação da santidade. A forma predicativa feminina plural concorda naturalmente com “as filhas de Jerusalém”.
- source_word: κατὰ τὸ κρίμα σου
  choice: segundo o teu julgamento
  rationale: Mantém a ligação explícita com a decisão judicial divina sem determinar além do grego se κρίμα significa julgamento, sentença ou veredito.
theological_decisions:
- issue: Relação entre a profanação das filhas de Jerusalém e o julgamento divino
  choice: segundo o teu julgamento
  alternative: por meio do teu julgamento
  rationale: A preposição κατά permite uma relação de conformidade com o julgamento, enquanto a formulação alternativa afirmaria de modo mais direto uma causalidade que o texto não exige.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe próxima do grego sem rigidez. “Ficaram profanadas” exprime naturalmente o predicado βέβηλοι no contexto, enquanto a nota preserva a leitura mais formal e potencialmente estática.
