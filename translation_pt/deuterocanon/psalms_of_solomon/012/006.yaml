  text: May the Lord protect a quiet soul that hates the unjust[c][b][a], and may the Lord guide a man who makes peace in the house.
translation:
  language: pt
  text: Que o Senhor guarde uma alma tranquila[a] que odeia os injustos, e que o Senhor guie[b] um homem que promove a paz no lar[c].
  philosophy: optimal-equivalence
