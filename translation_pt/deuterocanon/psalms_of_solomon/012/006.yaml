lexical_decisions:
- source_word: φυλάξαι
  choice: guarde
  rationale: O aoristo optativo exprime um desejo ou oração. “Que o Senhor guarde” é natural em português e conserva a ideia de proteção e preservação.
- source_word: Κύριος
  choice: Senhor
  rationale: Aqui κύριος funciona como título divino; “Senhor” é a correspondência consagrada e adequada ao registro devocional.
- source_word: ψυχὴν
  choice: alma
  rationale: ψυχή pode designar alma, vida ou o próprio ser. “Alma” preserva neste contexto a referência à pessoa interior sem eliminar a amplitude lexical, registrada em nota.
- source_word: ἡσύχιον
  choice: tranquila
  rationale: ἡσύχιος indica quietude ou serenidade. “Tranquila” descreve com naturalidade uma disposição calma e estável.
- source_word: μισοῦσαν ἀδίκους
  choice: que odeia os injustos
  rationale: O particípio feminino modifica “alma” e caracteriza sua postura moral. “Os injustos” mantém a referência direta do adjetivo substantivado ἀδίκους sem substituí-la pela interpretação mais específica “malfeitores”.
- source_word: κατευθύναι
  choice: guie
  rationale: O verbo pode significar dirigir, conduzir ou endireitar. “Guie” comunica de modo natural a direção concedida por Deus, enquanto a alternativa mais formal aparece em nota.
- source_word: ἄνδρα
  choice: um homem
  rationale: O grego emprega o substantivo masculino singular ἀνήρ; “um homem” conserva essa forma explícita sem generalizá-la para “uma pessoa”.
- source_word: ποιοῦντα εἰρήνην
  choice: que promove a paz
  rationale: A expressão grega significa literalmente “que faz paz”. “Promove a paz” expressa em português corrente a ação contínua de trabalhar ativamente pela paz.
- source_word: ἐν οἴκῳ
  choice: no lar
  rationale: οἶκος pode referir-se à casa como espaço ou ao núcleo doméstico. “No lar” preserva de modo natural essa esfera doméstica sem decidir rigidamente entre edifício e família.
