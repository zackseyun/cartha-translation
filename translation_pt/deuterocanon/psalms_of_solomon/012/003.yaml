  text: His dwelling is to fill houses with a lying tongue[a], to cut down trees of gladness[d][c][b], flaming against the lawless.
translation:
  language: pt
  text: Sua permanência[a] consiste em encher casas com uma língua mentirosa, em derrubar árvores de alegria[b] — alegria que incendeia os transgressores.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua estadia” ou “sua residência como forasteiro”; o termo grego pode indicar morar ou permanecer em algum lugar, muitas vezes como alguém de fora.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “árvores de alegria”; a imagem pode representar aquilo que faz uma casa florescer ou se alegrar.
    reason: cultural_note
  - marker: c
    text: A frase final é muito condensada no grego. Gramaticalmente, “que incendeia” concorda mais naturalmente com “alegria”; uma referência mais livre à “língua” também foi proposta, apesar da diferença de concordância.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ παροικία αὐτοῦ
  choice: A sua estadia
  rationale: “Estadia” conserva a ideia de permanecer ou residir em algum lugar, sem tornar a expressão tão permanente quanto “morada”; a nota registra a possível nuance de residência como forasteiro.
- source_word: ἐμπλῆσαι οἴκους ἐν γλώσσῃ ψεύδει
  choice: encher casas com uma língua mentirosa
  rationale: Mantém os infinitivos que explicam em que consiste a estadia e preserva tanto a imagem concreta das casas quanto a língua como instrumento da falsidade.
- source_word: ἐκκόψαι δένδρα εὐφροσύνης
  choice: derrubar árvores da alegria
  rationale: “Derrubar” expressa a ação forte de cortar uma árvore, e a imagem incomum de “árvores da alegria” é preservada sem ser reduzida a uma paráfrase abstrata.
- source_word: φλογίζούσης παρανόμους
  choice: alegria que incendeia os transgressores
  rationale: O particípio feminino no genitivo concorda mais naturalmente com “alegria”; “incendeia” conserva a metáfora do fogo, e “transgressores” traduz os que agem contra a lei.
theological_decisions:
- issue: Referente de φλογίζούσης
  choice: Ligação principal com “alegria”
  alternative: Ligação livre com “língua”, ou uma construção textualmente difícil com sentido de inflamar os transgressores
  rationale: A concordância feminina no genitivo aponta gramaticalmente para εὐφροσύνης, também feminino no genitivo, embora o sentido resultante seja comprimido e difícil. A tradução não atribui silenciosamente a ação ao homem, pois o particípio não permite isso de modo direto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com estrutura nominal preservada. A formulação mantém a imagem abrupta e a dificuldade sintática do grego, esclarecendo-as em notas sem resolver além da evidência textual.
