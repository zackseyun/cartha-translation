translation:
  language: pt
  text: Que a salvação do Senhor esteja[a] sobre Israel, seu servo[b], para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego não traz verbo explícito. Pelo contexto de oração e desejo, também se pode traduzir: “Esteja a salvação do Senhor sobre Israel”; como declaração, seria: “A salvação do Senhor está sobre Israel”.'
    reason: grammatical_ambiguity
  - marker: b
    text: Ou “seu filho” ou “sua criança”. A palavra grega pode indicar tanto um servo quanto um filho ou uma criança.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: O genitivo foi entendido como possessivo, expressando que a salvação pertence ao Senhor e vem dele; “Senhor” preserva o título bíblico tradicional em português.
- source_word: ἡ σωτηρία
  choice: a salvação
  rationale: “Salvação” conserva tanto a ideia concreta de livramento quanto seu alcance teológico mais amplo.
- source_word: ἐπὶ Ἰσραήλ
  choice: sobre Israel
  rationale: “Sobre” preserva a imagem da preposição ἐπί e o tom de bênção dirigida a Israel.
- source_word: παῖδα αὐτοῦ
  choice: seu servo
  rationale: παῖς pode significar “servo”, “criança” ou “filho”. No contexto da relação de aliança entre Deus e Israel, “servo” é a opção principal mais provável, sem ocultar a ambiguidade lexical.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: A expressão idiomática indica duração permanente; “para sempre” é sua forma natural e digna em português atual.
theological_decisions:
- issue: Valor modal da oração nominal sem verbo explícito
  choice: Que ... esteja
  alternative: A salvação do Senhor está sobre Israel
  rationale: Embora o grego não traga verbo finito, as formas optativas dos versículos próximos favorecem a leitura desta linha como desejo ou bênção, e não como simples declaração.
- issue: Sentido de παῖς aplicado a Israel
  choice: servo
  alternative: filho/criança
  rationale: “Servo” se ajusta à linguagem bíblica da aliança e do serviço de Israel a Deus, enquanto a nota preserva a possibilidade genuína de parentesco ou filiação contida no termo grego.
translation_notes:
  register: Português moderno, claro e reverente, com forma de bênção. A construção “sobre Israel” conserva deliberadamente a imagem do grego sem se tornar obscura para leitores de português brasileiro e internacional.
