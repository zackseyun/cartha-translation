    reason: translation_alternative
lexical_decisions:
- source_word: ἐν ποικιλίᾳ στροφῆς
  choice: dão voltas de todo tipo
  rationale: A expressão grega descreve palavras marcadas por variedade de giros ou mudanças. A formulação preserva a imagem concreta das voltas e sugere, sem explicitar além do texto, o caráter tortuoso e cambiante da fala.
- source_word: οἱ λόγοι τῆς γλώσσης
  choice: As palavras da língua
  rationale: Mantém a imagem concreta da língua presente no grego, em vez de reduzi-la ao termo abstrato “fala”.
- source_word: ἀνδρὸς πονηροῦ
  choice: de um homem perverso
  rationale: O substantivo é masculino singular, e πονηρός tem aqui sentido moral. “Perverso” comunica maldade e desvio moral em português atual e digno.
- source_word: καλλονὴ
  choice: encanto
  rationale: Embora o sentido básico seja “beleza”, no contexto a qualidade atraente do homem perverso parece exercer influência destrutiva. “Encanto” preserva essa força social, enquanto a alternativa mais literal é registrada em nota.
- source_word: πῦρ ἀνάπτον
  choice: um fogo que começa a arder
  rationale: O particípio presente apresenta o fogo em processo ativo de acender-se ou inflamar-se. A tradução evita tratá-lo como fogo já aceso e soa natural em português.
- source_word: ἐν λαῷ
  choice: no meio de um povo
  rationale: Preserva o caráter coletivo e indefinido de λαῷ sem identificar um povo específico; “no meio de” expressa naturalmente a localização interna sugerida por ἐν.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. A imagem das voltas da fala e o aspecto progressivo do fogo foram preservados sem tornar explícita uma interpretação teológica ou psicológica não declarada pelo grego.
