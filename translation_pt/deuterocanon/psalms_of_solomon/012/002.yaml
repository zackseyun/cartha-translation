translation:
  language: pt
  text: As palavras da língua de um homem perverso dão voltas de todo tipo[a]; seu encanto[b] é como um fogo que começa a arder no meio de um povo.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em variedade de voltas”; o grego retrata uma fala cheia de giros e mudanças.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “beleza”.'
    reason: lexical_alternative
  - marker: c
