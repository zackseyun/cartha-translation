lexical_decisions:
- source_word: γλῶττα
  choice: língua
  rationale: Mantém a imagem concreta e vívida do grego, em vez de a transformar no abstrato “fala”.
- source_word: ψιθύρων
  choice: dos que cochicham
  rationale: Preserva a ideia literal de fala secreta ou sussurrada e deixa que o contexto comunique sua força moral; “difamadores” é uma alternativa interpretativa registrada em nota.
- source_word: ἀπόλοιτο
  choice: pereça
  rationale: Expressa de modo solene e natural o desejo ou a imprecação do optativo grego, sem especificar além do texto a forma da destruição.
- source_word: ἐν πυρὶ φλογός
  choice: em fogo ardente
  rationale: Reproduz de forma idiomática a intensidade da expressão grega literalmente associada a fogo e chama, sem o artificialismo de “fogo de chama”.
- source_word: ὁσίων
  choice: piedosos
  rationale: Ὅσιοι designa aqui pessoas devotas ou fiéis; “piedosos” preserva o sentido religioso e a referência coletiva sem confundi-lo automaticamente com ἅγιοι, “santos”.
- source_word: ἀπὸ
  choice: longe de
  rationale: Conserva a ideia espacial ou relacional de separação presente na preposição grega.
theological_decisions:
- issue: Identidade dos ὅσιοι
  choice: piedosos
  alternative: fiéis
  rationale: A tradução evita “santos” no texto principal, pois isso poderia importar uma categoria técnica não exigida por ὅσιοι; “fiéis” continua sendo uma alternativa contextual plausível.
translation_notes:
  register: Português atual, poético e solene. A construção mantém a imagem concreta da língua, a força imprecatória do verso e a separação dos piedosos, com sintaxe clara para leitores modernos.
