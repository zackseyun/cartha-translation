translation_notes:
  register: Português moderno, digno e acessível, com cadência de oração. A repetição de «despreza a lei» preserva a repetição de παράνομος e evita tanto o juridicismo de «ilegal» quanto a construção pouco idiomática «sem lei». O ponto final substitui a pontuação de continuidade da edição, pois o pedido foi fornecido como versículo isolado.
