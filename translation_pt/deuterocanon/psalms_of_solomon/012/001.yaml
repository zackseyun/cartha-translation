  text: Lord[a], deliver my soul from a lawless and wicked man, from a lawless and whispering tongue, speaking falsehood and deceit[c][b];
translation:
  language: pt
  text: Senhor, livra a minha alma do homem que despreza a lei e é perverso, da língua que despreza a lei e sussurra, que profere mentiras e enganos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «A minha alma» também pode ser traduzido por «a minha vida» ou simplesmente «a mim».
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Senhor
  rationale: Mantém o vocativo direto dirigido a Deus e corresponde ao uso consagrado e natural de κύριος em contexto de oração.
- source_word: ῥῦσαι τὴν ψυχήν μου
  choice: livra a minha alma
  rationale: O imperativo pede resgate de uma ameaça; «livra» é corrente na linguagem de oração, e «minha alma» preserva a amplitude de ψυχή, que também pode designar a vida ou a própria pessoa.
- source_word: ἀνδρὸς παρανόμου καὶ πονηροῦ
  choice: do homem que despreza a lei e é perverso
  rationale: ἀνήρ é preservado como «homem». A formulação verbal evita o pouco natural «homem sem lei» e expressa παράνομος como oposição ou desconsideração da lei, enquanto «perverso» comunica a maldade moral de πονηρός.
- source_word: γλώσσης παρανόμου καὶ ψιθυροῦ
  choice: da língua que despreza a lei e sussurra
  rationale: Conserva a imagem concreta da língua e, conforme a sintaxe grega, trata παρανόμου e ψιθυροῦ como qualificações coordenadas de γλώσσης, sem transformar ψιθυροῦ em substantivo referente a uma pessoa.
- source_word: λαλούσης ψευδῆ καὶ δόλια
  choice: que profere mentiras e enganos
  rationale: O particípio feminino continua a modificar «língua». «Profere» se ajusta à imagem poética, e os plurais substantivados refletem os neutros plurais ψευδῆ e δόλια de modo idiomático.
