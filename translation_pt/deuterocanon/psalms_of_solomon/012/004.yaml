  text: May God throw lawless houses into turmoil in war by whispering lips[a]; may God remove from the innocent the lips of the lawless in distress[c][b], and may the bones of whisperers be scattered away from those who fear the Lord.
translation:
  language: pt
  text: Que Deus lance em tumulto, na guerra, as casas dos transgressores, por meio de lábios sussurrantes[a]; que Deus afaste dos inocentes os lábios dos transgressores em aflição[b], e que os ossos dos que sussurram sejam espalhados para longe dos que temem o Senhor.
  philosophy: optimal-equivalence
