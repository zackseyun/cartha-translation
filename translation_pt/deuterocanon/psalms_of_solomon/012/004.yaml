    text: Ou “por meio de lábios difamadores”. O grupo de palavras gregas aqui usado pode indicar fala secreta e maliciosa, não apenas fala em voz baixa. “Casas” também pode significar famílias ou unidades domésticas.
    reason: lexical_alternative
  - marker: b
    text: 'A expressão grega traduzida por “em aflição” também pode significar “em perplexidade” ou “em desamparo”. Sua ligação sintática é incerta: pode referir-se aos transgressores, aos inocentes ou, de modo mais amplo, à ação de afastar.'
    reason: ambiguity
lexical_decisions:
- source_word: συνταράξαι
  choice: lance em tumulto
  rationale: O infinitivo aoristo em contexto de súplica imprecatória exprime um desejo. A formulação preserva a ideia de forte perturbação sem perder a dignidade poética.
- source_word: οἴκους
  choice: casas
  rationale: Mantém a imagem concreta do grego; no contexto, o termo também pode abranger famílias ou unidades domésticas.
- source_word: παρανόμους / παρανόμων
  choice: transgressores
  rationale: Expressa pessoas que agem contra a lei, sendo mais natural em português bíblico atual do que uma reprodução rígida como “sem-lei”.
- source_word: χείλεσι ψιθυροῖς
  choice: por meio de lábios que murmuram
  rationale: Preserva a imagem dos lábios e o provável valor instrumental do dativo. “Murmuram” pode comunicar fala secreta e maliciosa, explicada na nota.
- source_word: μακρύναι
  choice: afaste
  rationale: Comunica de modo natural a ideia de pôr longe ou remover e mantém o tom de súplica.
- source_word: ἀκάκων
  choice: inocentes
  rationale: Transmite a ausência de malícia ou dano pretendida pelo termo, em linguagem clara e corrente.
- source_word: ἐν ἀπορίᾳ
  choice: em sua aflição
  rationale: O grego pode indicar dificuldade, desamparo ou perplexidade. O possessivo explicita uma ligação contextual provável com os inocentes, mas a nota preserva a ambiguidade sintática.
- source_word: ψιθύρων
  choice: murmuradores
  rationale: Mantém o vínculo lexical com “lábios que murmuram”; a nota registra que o grupo lexical pode denotar difamadores ou maledicentes.
- source_word: φοβουμένων Κύριον
  choice: dos que temem o Senhor
  rationale: Conserva a expressão bíblica tradicional para devoção reverente e traduz Κύριον por “Senhor”.
theological_decisions:
- issue: Referente de ἐν ἀπορίᾳ
  choice: 'Ligado no texto principal aos inocentes: “em sua aflição”'
  alternative: Pode qualificar os transgressores ou, de modo mais amplo, a ação de afastar
  rationale: A posição da locução grega permite mais de uma relação sintática. A leitura adotada produz português inteligível sem eliminar a alternativa, registrada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo de súplica preservado. A repetição lexical entre “lábios que murmuram” e “murmuradores” conserva a coesão poética do grego; as ambiguidades semânticas e sintáticas relevantes aparecem em notas.
