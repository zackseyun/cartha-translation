review_pass:
  verdict: revise
  source_fidelity: O paralelismo dos optativos é bem mantido por “Que ... pereçam” e “que ... herdem”, e “os pecadores”, “os devotos” e “as promessas” refletem adequadamente os termos gregos. Contudo, “pereçam, afastados da presença” introduz um particípio que pode apresentar o afastamento como estado prévio ou circunstância adicional, em vez de expressar diretamente o afastamento “da presença” indicado por ἀπὸ προσώπου. “Longe da presença” preserva de modo mais claro a relação sem acrescentar esse enquadramento sintático.
  naturalness: A redação é clara e de registro apropriado. A pequena revisão torna a relação entre perecimento e afastamento mais idiomática em português moderno. A alternativa da nota c deve conservar o artigo definido da expressão principal.
  terminology: “Senhor” para Κύριος, “devotos” para ὅσιοι e “herdem as promessas” para κληρονομήσαισαν ἐπαγγελίας são escolhas adequadas. As notas lexicais mantêm alternativas legítimas sem fixar uma interpretação confessional.
  issues:
  - severity: low
    issue: “afastados da presença” introduz uma construção participial não explícita no grego.
    rationale: O texto grego pede que os pecadores pereçam “da/para fora da presença do Senhor”; o particípio português pode sugerir que já estão afastados. “Longe da presença” conserva melhor a separação sem criar essa relação temporal ou circunstancial.
  - severity: low
    issue: A nota c omite o artigo definido na alternativa.
    rationale: Como a tradução principal conserva corretamente οἱ em “os pecadores”, a alternativa deve dizer “Que pereçam os pecadores”, não “Que pereçam pecadores”.
  revised_text: Que os pecadores[c] pereçam longe da presença do Senhor, de uma vez por todas[b], e que os devotos do Senhor[a] herdem as promessas.
