revisions:
- from: Que os pecadores[c] pereçam, afastados da presença do Senhor de uma vez por todas[b], e que os devotos do Senhor[a] herdem as promessas.
  to: Que os pecadores[c] pereçam longe da presença do Senhor, de uma vez por todas[b], e que os devotos do Senhor[a] herdem as promessas.
  rationale: A revisão substitui o particípio interpretativo “afastados” por “longe da presença”, que exprime de forma natural a separação de ἀπὸ προσώπου Κυρίου sem enfraquecer ἀπόλοιντο (“pereçam”). Também ajusta a alternativa da nota c para preservar o artigo definido grego.
