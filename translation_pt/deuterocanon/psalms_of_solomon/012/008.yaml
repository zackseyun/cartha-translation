base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/012/008.yaml
  text: May the sinners perish from the presence of the Lord once for all[c][b][a], and may the devout of the Lord inherit the promises.
translation:
  language: pt
  text: Que os pecadores[c] pereçam longe da presença do Senhor, de uma vez por todas[b], e que os devotos do Senhor[a] herdem as promessas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os santos do Senhor” ou “os fiéis do Senhor”.
    reason: lexical_alternative
  - marker: b
    text: Ou simplesmente “uma vez”; o grego pode enfatizar tanto uma única ocorrência como o caráter definitivo.
    reason: lexical_alternative
  - marker: c
    text: Ou “Que pereçam os pecadores”.
    reason: previous_rendering
lexical_decisions:
- source_word: ἀπόλοιντο
  choice: que ... pereçam
  rationale: O optativo expressa desejo ou oração. “Que ... pereçam” preserva essa força volitiva sem especificar além do necessário se a ruína ocorre por destruição direta ou por outro meio.
- source_word: οἱ ἁμαρτωλοὶ
  choice: os pecadores
  rationale: Mantém o artigo definido grego e, assim, a possível referência a um grupo reconhecível no contexto polêmico, em vez de generalizar para pecadores quaisquer.
- source_word: ἀπὸ προσώπου Κυρίου
  choice: afastados da presença do Senhor
  rationale: A expressão é literalmente “da face do Senhor”. A formulação escolhida comunica em português atual a separação da presença divina, evitando o pouco natural “pereçam da presença”.
- source_word: ἅπαξ
  choice: de uma vez por todas
  rationale: No contexto imprecatório, transmite a possível ideia de finalidade. Uma nota preserva a leitura mais estrita, “uma vez”.
- source_word: ὅσιοι
  choice: os devotos
  rationale: Expressa piedade e lealdade religiosa sem restringir o termo ao sentido técnico de “santos”. A nota registra alternativas legítimas.
- source_word: κληρονομήσαισαν
  choice: que ... herdem
  rationale: O segundo optativo também expressa desejo. “Herdem” mantém a imagem de receber como herança aquilo que foi prometido.
- source_word: ἐπαγγελίας
  choice: as promessas
  rationale: O artigo é natural em português quando se trata das promessas divinas reconhecidas, especialmente em combinação com a linguagem de herança.
theological_decisions:
- issue: Identidade de “os pecadores”
  choice: 'Conservar o artigo definido: “os pecadores”'
  alternative: “pecadores” sem artigo
  rationale: A forma grega pode designar um grupo específico no horizonte histórico e polêmico do salmo. A tradução não identifica dogmaticamente esse grupo, mas também não apaga a especificidade gramatical.
- issue: Sentido de ὅσιοι
  choice: “os devotos”
  alternative: “os santos” ou “os fiéis”
  rationale: A escolha mantém a ideia de devoção piedosa, enquanto a nota conserva a amplitude semântica e evita impor uma categoria eclesiológica posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “que” conserva claramente o paralelismo dos dois optativos. “Afastados” explicita de modo idiomático a separação indicada por ἀπό, sem transformar a frase em uma afirmação indicativa.
