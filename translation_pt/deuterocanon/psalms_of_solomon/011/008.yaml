base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/011/008.yaml
  text: Put on[a], Jerusalem, the garments of your glory; make ready your sacred robe[c][b], for God has spoken good things to Israel forever and ever.
translation:
  language: pt
  text: Reveste-te, Jerusalém, das vestes da tua glória; prepara a tua veste sagrada[a], pois Deus falou coisas boas a Israel para todo o sempre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a veste da tua santidade” ou “a veste do teu santuário”.
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “para sempre e ainda além”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνδυσαι
  choice: Reveste-te
  rationale: O imperativo médio conclama Jerusalém a vestir-se. “Reveste-te” conserva essa força reflexiva e combina com o registro poético.
- source_word: τὰ ἱμάτια τῆς δόξης σου
  choice: as vestes da tua glória
  rationale: “Vestes” mantém o plural e o tom elevado de ἱμάτια; “glória” preserva a ressonância bíblica de δόξα sem reduzi-la a mero esplendor visual.
- source_word: ἑτοίμασον
  choice: prepara
  rationale: Verbo imperativo direto e natural em português, correspondente ao sentido de aprontar ou deixar pronta.
- source_word: τὴν στολὴν
  choice: a tua veste
  rationale: στολή designa uma veste longa ou solene. “Veste” mantém a dignidade poética sem especificar em excesso o formato da roupa; o possessivo é exigido pelo genitivo subsequente no contexto.
- source_word: τοῦ ἁγιάσματός σου
  choice: sagrada
  rationale: ἁγίασμα pode indicar santidade, algo consagrado ou um santuário. “Tua veste sagrada” comunica com naturalidade a qualidade consagrada da veste, enquanto as possibilidades mais literais são registradas em nota.
- source_word: ἐλάλησεν ἀγαθὰ
  choice: falou coisas boas
  rationale: Mantém a formulação concreta do grego, sem transformar implicitamente a fala divina em “promessas” ou “bênçãos”.
- source_word: Ἰσραὴλ
  choice: a Israel
  rationale: Reproduz o dativo grego como destinatário da fala divina.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: para todo o sempre
  rationale: Expressão portuguesa corrente para duração permanente. A força adicional e incomum de καὶ ἔτι é preservada em nota, em vez de produzir no texto principal uma expressão pouco natural.
theological_decisions:
- issue: Sentido de τοῦ ἁγιάσματός σου na imagem de Jerusalém sendo revestida
  choice: Uma veste sagrada ou consagrada pertencente a Jerusalém
  alternative: “a veste da tua santidade” ou “a veste do teu santuário”
  rationale: O substantivo ἁγίασμα permite tanto uma referência abstrata à santidade quanto uma referência concreta ao santuário. O contexto favorece a imagem de uma veste consagrada, mas não elimina as demais leituras; por isso, a ambiguidade é explicitada em nota.
- issue: Força temporal de εἰς τὸν αἰῶνα καὶ ἔτι
  choice: para todo o sempre
  alternative: “para sempre e ainda além”
  rationale: A tradução principal emprega uma expressão idiomática de perpetuidade, enquanto a nota conserva o acréscimo literal de καὶ ἔτι, que pode sugerir continuação ou intensificação além de “para sempre”.
translation_notes:
  register: Português moderno, claro e solene, com formas poéticas ainda correntes como “reveste-te” e “vestes”. A construção “falou coisas boas a Israel” foi mantida por proximidade ao grego, apesar de ser menos idiomática do que “prometeu coisas boas”, para não acrescentar a noção específica de promessa.
