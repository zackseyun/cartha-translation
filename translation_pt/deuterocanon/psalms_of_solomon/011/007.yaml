base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/011/007.yaml
  text: God made every fragrant tree spring up for them[a], so that Israel might pass through in the visitation of the glory of their God.
translation:
  language: pt
  text: Deus fez brotar para eles toda árvore aromática, para que Israel passasse na visitação da glória do seu Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sob o cuidado ou a vigilância da glória do seu Deus”.
    reason: alternativa lexical para ἐπισκοπῇ e para a relação expressa por ἐν
lexical_decisions:
- source_word: πᾶν
  choice: toda
  rationale: Com o substantivo singular ξύλον, tem sentido distributivo e abrange cada tipo de árvore.
- source_word: ξύλον
  choice: árvore
  rationale: O contexto de brotar e de aroma favorece a referência à árvore viva, não à madeira.
- source_word: εὐωδίας
  choice: aromática
  rationale: Expressa de modo natural a ideia de aroma agradável contida no genitivo, sem sugerir madeira já cortada.
- source_word: ἀνέτειλεν
  choice: fez brotar
  rationale: Preserva tanto a imagem vegetal de surgir/brotar quanto a ação causativa de Deus.
- source_word: παρέλθῃ
  choice: passasse
  rationale: Comunica o movimento de Israel pelo ambiente preparado; o contexto permite entender a ideia de atravessar sem tornar explícito um complemento ausente no grego.
- source_word: ἐπισκοπῇ
  choice: visitação
  rationale: Mantém o tom bíblico e a possível ideia de presença divina ativa, sem eliminar os sentidos relacionados de cuidado e vigilância.
- source_word: δόξης
  choice: glória
  rationale: É a tradução bíblica corrente e apropriada no contexto da manifestação ou presença divina.
theological_decisions:
- issue: Sentido de ἐν ἐπισκοπῇ δόξης θεοῦ αὐτῶν
  choice: na visitação da glória do seu Deus
  alternative: sob o cuidado ou a vigilância da glória do seu Deus
  rationale: A expressão grega admite visitação, cuidado ou supervisão. O texto principal conserva sua formulação elevada e sua ambiguidade teológica, enquanto a nota registra os outros sentidos possíveis.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe relativamente próxima do grego. “Árvore aromática” é natural e preserva a imagem poética; “visitação” mantém deliberadamente a tensão semântica do original.
