  text: Toquem a trombeta em Sião com uma trombeta de sinal dos santos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com uma trombeta de sinal para os santos”. A expressão grega é compacta e não deixa explícita a relação exata de “santos” com o sinal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σαλπίσατε
  choice: Toquem a trombeta
  rationale: O aoristo imperativo plural de σαλπίζω ordena um toque público de trombeta; a formulação mantém tanto a força imperativa quanto o número plural.
- source_word: ἐν Σιὼν
  choice: em Sião
  rationale: Preserva naturalmente o valor locativo de ἐν e o cenário público centrado em Sião.
- source_word: ἐν σάλπιγγι
  choice: com uma trombeta
  rationale: O ἐν com dativo tem valor instrumental. O artigo indefinido corresponde à ausência de artigo no grego e soa natural em português.
- source_word: σημασίας
  choice: de convocação
  rationale: σημασία indica um sinal ou ato de sinalizar. No contexto, “convocação” comunica a função do toque sem restringi-lo a um alarme militar.
- source_word: ἁγίων
  choice: para os santos
  rationale: 'O genitivo plural é entendido como objetivo em relação à ideia de sinal ou convocação: o toque se dirige aos santos. “Santos” mantém a amplitude do substantivo adjetival grego sem especificar sacerdotes, exilados ou outro grupo.'
theological_decisions:
- issue: Referente e função de ἁγίων
  choice: “para os santos”, preservando a identidade ampla do grupo e exprimindo o provável genitivo objetivo
  alternative: “dos santos”, que conserva formalmente o genitivo, mas pode sugerir posse ou origem
  rationale: O contexto favorece um sinal destinado a reunir os santos, mas o grego compacto não identifica com precisão quem eles são. A tradução não os restringe a sacerdotes, fiéis consagrados ou santos em sentido técnico.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A repetição de “trombeta” foi mantida porque está presente no grego e reforça o caráter solene da proclamação.
