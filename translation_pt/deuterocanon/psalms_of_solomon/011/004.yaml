  yaml_path: translation/deuterocanon/psalms_of_solomon/011/004.yaml
  text: They come from the north in the joy of their God[a]; from distant islands God has gathered them.
translation:
  language: pt
  text: Do norte eles vêm na alegria do seu Deus; de ilhas[a] distantes Deus os reuniu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terras costeiras”, em vez de “ilhas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ βορρᾶ
  choice: Do norte
  rationale: ἀπό com o genitivo indica origem ou procedência, e βορρᾶ designa o norte ou a região setentrional. “Do norte” é natural e preserva a força direcional.
- source_word: ἔρχονται
  choice: eles vêm
  rationale: O presente grego é mantido pelo presente simples em português, conservando a vivacidade da cena.
- source_word: τῇ εὐφροσύνῃ
  choice: na alegria
  rationale: O dativo exprime de modo plausível a maneira ou o estado concomitante. “Na alegria” mantém a forma nominal e a ligação genitiva subsequente sem explicitar uma relação causal não declarada.
- source_word: τοῦ θεοῦ αὐτῶν
  choice: do seu Deus
  rationale: A tradução direta do genitivo preserva a relação expressa no grego e evita interpretá-la como “alegria que vem de Deus” ou “diante de Deus”.
- source_word: ἐκ νήσων μακρόθεν
  choice: de ilhas distantes
  rationale: ἐκ marca procedência; νῆσοι significa normalmente “ilhas”, embora possa abranger regiões costeiras no uso bíblico, e μακρόθεν indica distância.
- source_word: συνήγαγεν
  choice: reuniu
  rationale: O aoristo apresenta a ação como realizada. O pretérito perfeito simples é a correspondência portuguesa mais natural e preserva a ação divina de ajuntar o povo.
- source_word: ὁ θεός
  choice: Deus
  rationale: O sujeito explícito é preservado, mantendo em destaque a iniciativa divina.
theological_decisions: []
