base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/011/003.yaml
  text: Stand[a], O Jerusalem, on high[c][b], and see your children gathered from east and west by the Lord.
translation:
  language: pt
  text: Põe-te de pé, ó Jerusalém, num lugar alto, e vê teus filhos reunidos pelo Senhor, todos juntos, vindos do leste e do oeste[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «de uma só vez»; ou: «como um só».'
    reason: A expressão grega εἰς ἅπαξ pode salientar simultaneidade ou unidade coletiva.
lexical_decisions:
- source_word: στῆθι
  choice: Põe-te de pé
  rationale: O imperativo chama Jerusalém a assumir uma posição erguida; a expressão é direta e natural em português, além de preparar a ordem seguinte para olhar.
- source_word: ἐφʼ ὑψηλοῦ
  choice: num lugar alto
  rationale: Expressa um ponto elevado concreto, de onde Jerusalém pode contemplar os que chegam, sem a possível conotação celestial de “nas alturas”.
- source_word: τέκνα
  choice: filhos
  rationale: Neste discurso dirigido a Jerusalém, “filhos” designa naturalmente seu povo e seus descendentes, sem restringir a referência ao sexo masculino.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: do leste e do oeste
  rationale: Os plurais gregos indicam direções ou regiões; esta é a forma corrente e clara em português.
- source_word: συνηγμένα
  choice: reunidos
  rationale: O particípio descreve os filhos trazidos e ajuntados em um só grupo.
- source_word: εἰς ἅπαξ
  choice: todos juntos
  rationale: No contexto, a expressão enfatiza a reunião conjunta ou simultânea. A tradução evita sugerir indevidamente uma ação súbita ou definitiva.
- source_word: ἀπὸ Κυρίου
  choice: pelo Senhor
  rationale: O contexto favorece entender o Senhor como agente da reunião; a voz passiva em português preserva essa relação de modo natural.
theological_decisions:
- issue: Valor de ἀπὸ Κυρίου na construção passiva
  choice: pelo Senhor
  alternative: da parte do Senhor
  rationale: 'Embora ἀπό possa indicar origem, com συνηγμένα o contexto favorece agência: é o Senhor quem reúne os filhos de Jerusalém. A alternativa preservaria mais explicitamente a ideia de origem, mas seria menos clara neste contexto.'
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Ó Jerusalém” preserva o vocativo solene, enquanto “num lugar alto” comunica uma posição física elevada sem linguagem excessivamente arcaica.
