  text: He brought the high mountains low into level ground for them[a].
translation:
  language: pt
  text: Ele rebaixou os montes altos, tornando-os terreno plano para eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ele humilhou os montes elevados, transformando-os numa planície para eles”.'
