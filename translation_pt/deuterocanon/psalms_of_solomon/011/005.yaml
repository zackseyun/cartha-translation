lexical_decisions:
- source_word: ὄρη
  choice: montes
  rationale: O substantivo designa montanhas ou grandes elevações; “montes” é natural em português bíblico contemporâneo e preserva a escala da imagem.
- source_word: ὑψηλά
  choice: altos
  rationale: Tradução atributiva direta que mantém a imagem da altura física sem recorrer a linguagem excessivamente literária.
- source_word: ἐταπείνωσεν
  choice: rebaixou
  rationale: Com montes como objeto, o verbo indica redução física de altura; “rebaixou” conserva também a força de fazer baixar.
- source_word: εἰς ὁμαλισμόν
  choice: tornando-os terreno plano
  rationale: 'A expressão indica resultado: os montes são reduzidos a uma superfície nivelada. Esta formulação explicita esse resultado de modo claro e natural.'
- source_word: αὐτοῖς
  choice: para eles
  rationale: 'O dativo é entendido como dativo de benefício: o nivelamento é realizado em favor deles.'
