base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/011/002.yaml
  text: 'Proclaim in Jerusalem the voice of one bringing good news: for God has shown mercy to Israel in their visitation[a][b][c].'
translation:
  language: pt
  text: Proclamem em Jerusalém a voz de quem anuncia boas-novas, pois Deus teve misericórdia de Israel ao visitá-lo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «na visitação deles». O termo grego também pode indicar cuidado atento, supervisão ou intervenção; aqui o contexto sugere uma visita misericordiosa de Deus a Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξατε
  choice: Proclamem
  rationale: O imperativo plural pede um anúncio público e solene; «proclamem» preserva essa força em português atual.
- source_word: φωνὴν
  choice: a voz
  rationale: Mantém a imagem concreta do grego, em vez de reduzir a expressão apenas à mensagem anunciada.
- source_word: εὐαγγελιζομένου
  choice: de quem anuncia boas-novas
  rationale: Expressa o particípio como a ação de comunicar notícias favoráveis, sem impor ao termo um sentido técnico cristão posterior.
- source_word: ἠλέησεν
  choice: teve misericórdia de
  rationale: Reproduz diretamente a linguagem de misericórdia e apresenta a ação divina como fato realizado.
- source_word: ἐπισκοπῇ
  choice: ao visitá-lo
  rationale: A formulação verbal é natural em português e, no contexto de boas-novas e misericórdia, comunica uma visita divina favorável dirigida a Israel.
- source_word: αὐτῶν
  choice: -lo
  rationale: Embora o grego use pronome plural por conceber Israel coletivamente como povo, o português retoma naturalmente o nome singular «Israel» com o pronome singular.
theological_decisions:
- issue: Sentido de ἐπισκοπῇ na oração final
  choice: visita misericordiosa de Deus a Israel
  alternative: cuidado atento, supervisão ou intervenção providencial
  rationale: O contexto imediato de boas-novas e misericórdia favorece uma visita divina benéfica. A nota preserva a amplitude semântica do substantivo grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Boas-novas» conserva o caráter comum da expressão grega sem recorrer automaticamente ao termo teológico técnico «evangelho».
