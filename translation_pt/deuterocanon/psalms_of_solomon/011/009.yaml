  text: May the Lord do what he has spoken concerning Israel and Jerusalem[a]; may the Lord raise up Israel in the name of his glory[d][c][b]. The Lord’s mercy be upon Israel forever and ever.
translation:
  language: pt
  text: Que o Senhor faça o que falou a respeito de Israel e de Jerusalém[a]; que o Senhor levante Israel[b] em nome de sua glória[c]. Que a misericórdia do Senhor esteja sobre Israel para todo o sempre[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cumpra o que falou a respeito de Israel e de Jerusalém”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “restaure Israel”.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: “pelo seu nome glorioso”. A expressão grega é condensada.'
    reason: lexical_alternative
  - marker: d
    text: 'Literalmente: “para sempre e ainda [mais/além]”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαι
  choice: faça
  rationale: Mantém o sentido básico de «fazer, realizar» e, no contexto, exprime um desejo ou súplica sem explicitar além do grego a ideia de cumprimento.
- source_word: ἐλάλησεν ἐπὶ
  choice: falou a respeito de
  rationale: Expressa naturalmente a referência do discurso a Israel e Jerusalém, sem impor um sentido profético mais específico.
- source_word: ἀναστήσαι
  choice: levante
  rationale: Conserva a imagem ampla do verbo grego, que pode envolver levantar, reerguer ou restaurar, sem limitar a referência à ressurreição ou à restauração política.
- source_word: ἐν ὀνόματι δόξης αὐτοῦ
  choice: em nome de sua glória
  rationale: Preserva a estrutura condensada do grego e mantém distintos os elementos «nome» e «glória».
- source_word: ἔλεος
  choice: misericórdia
  rationale: É a equivalência direta e corrente, sem acrescentar uma qualificação pactual não expressa no texto.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: para todo o sempre
  rationale: É uma formulação portuguesa natural e solene para duração contínua e ilimitada; a extensão literal «e ainda» é registrada em nota.
theological_decisions:
- issue: Sentido de Israel ser levantado
  choice: levante Israel
  alternative: restaure Israel; torne a estabelecer Israel
  rationale: O verbo grego admite restauração, reerguimento ou estabelecimento, mas não obriga a escolher entre ressurreição e restauração histórica ou política.
- issue: Força de «em nome de sua glória»
  choice: Manter a formulação substantiva
  alternative: pelo seu nome glorioso; por causa do seu nome glorioso
  rationale: A expressão grega é condensada e não especifica claramente valor instrumental ou causal; a tradução conserva essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com forma de súplica («Que o Senhor...»). Mantém-se a repetição de «Senhor» e a ambiguidade de «levante», evitando definir o tipo de restauração. «Para todo o sempre» oferece uma conclusão idiomática e solene, enquanto a nota conserva a forma incomum do grego.
