  text: The hills fled from their approach[c][b][a]; the forests gave them shade along their way.
translation:
  language: pt
  text: As colinas fugiram diante da chegada deles[a]; as matas[b] lhes deram sombra ao longo do caminho deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “diante da aproximação deles”. A expressão grega é compacta; também pode ser entendida, de modo menos literal, como “quando eles chegaram”.
    reason: lexical_alternative
  - marker: b
    text: Ou “os bosques”; o termo grego pode designar matas, bosques ou áreas densamente arborizadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: βουνοὶ
  choice: colinas
  rationale: O substantivo βουνός normalmente designa elevações menores do que montanhas; “colinas” preserva a escala provável e soa natural em português.
- source_word: ἔφυγον
  choice: fugiram
  rationale: É o sentido comum de φεύγω e mantém a personificação vívida do texto grego.
- source_word: ἀπὸ εἰσόδου αὐτῶν
  choice: diante da chegada deles
  rationale: Com ἔφυγον, ἀπό conserva a ideia de afastamento, enquanto εἴσοδος indica a chegada ou aproximação do grupo. A formulação portuguesa mantém a imagem sem sugerir necessariamente a entrada por uma porta.
- source_word: δρυμοὶ
  choice: matas
  rationale: δρυμός pode indicar bosque, mata ou região arborizada. “Matas” é claro e natural em português amplo, sem exigir a ideia de uma floresta extensa.
- source_word: ἐσκίασαν αὐτοῖς
  choice: lhes deram sombra
  rationale: A expressão reproduz o valor benefactivo do dativo αὐτοῖς e comunica com naturalidade que a sombra foi proporcionada a eles.
- source_word: ἐν τῇ παρόδῳ αὐτῶν
  choice: ao longo do caminho
  rationale: πάροδος pode referir-se à passagem ou ao trajeto. A escolha conserva a imagem do percurso em português idiomático.
