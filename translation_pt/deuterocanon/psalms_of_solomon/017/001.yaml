base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/001.yaml
  text: O Lord[a], you are our King forever and ever; for in you, our God[b], our soul will boast.
translation:
  language: pt
  text: Ó Senhor, tu és nosso Rei para todo o sempre[a]; pois em ti, nosso Deus, a nossa alma se gloriará[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para sempre”; mais literalmente, “para a era e ainda além”.
    reason: lexical_alternative
  - marker: b
    text: Ou “exultará em ti” ou “se vangloriará”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Ó Senhor
  rationale: O vocativo dirige-se diretamente a Deus. “Senhor” é o equivalente corrente de κύριος, e “Ó” assinala a invocação em registro digno e natural.
- source_word: Βασιλεὺς
  choice: Rei
  rationale: Preserva diretamente a imagem régia e a confissão do governo de Deus.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: para todo o sempre
  rationale: Expressão portuguesa natural que comunica duração eterna com a força intensificadora de καὶ ἔτι, sem reproduzir de modo rígido o idioma grego.
- source_word: καυχήσεται
  choice: se gloriará
  rationale: O verbo pode significar gloriar-se, exultar ou vangloriar-se. “Se gloriará” conserva a ideia de encontrar em Deus motivo de honra e alegria, sem a conotação predominantemente negativa que “se vangloriará” costuma ter em português moderno.
- source_word: ἡ ψυχὴ ἡμῶν
  choice: a nossa alma
  rationale: Mantém o singular coletivo do grego, com possuidor plural, em vez de nivelar a imagem para “nós”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com tratamento por “tu” coerente com a invocação direta. O ponto e vírgula preserva a relação explicativa introduzida por ὅτι sem tornar a frase excessivamente coloquial.
