    issue: «transgressores da lei» para ἀνόμων
    rationale: A expressão pode designar infratores de uma lei identificável, enquanto o grego caracteriza os agentes de modo mais amplo como «sem lei» ou «ímpios». «Os sem lei» conserva melhor a força lexical e moral sem especificar indevidamente a lei.
  - severity: low
    issue: Ordem pouco natural em «por toda a terra ocorreu a sua dispersão»
    rationale: A ordem é compreensível, mas «a sua dispersão ocorreu por toda a terra» mantém o sentido e soa mais fluente em português moderno.
