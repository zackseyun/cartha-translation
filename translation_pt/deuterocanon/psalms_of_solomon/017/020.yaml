revisions:
- from: Os que amavam as assembleias[a] dos piedosos[b] fugiram deles; por toda a terra ocorreu a sua dispersão[c] por obra dos transgressores da lei, porque o céu deixou de derramar chuva[d] sobre a terra.
  to: Os que amavam as assembleias[a] dos piedosos[b] fugiram deles; a sua dispersão[c] ocorreu por toda a terra, por obra dos sem lei, porque o céu deixou de derramar chuva[d] sobre a terra.
  rationale: A revisão substitui uma formulação excessivamente específica para ἀνόμων por «os sem lei», melhora a ordem da oração relativa à dispersão e torna a nota de στάξαι mais precisa. Mantêm-se «piedosos», a ambiguidade contextual de «deles» e a relação causal do texto grego.
