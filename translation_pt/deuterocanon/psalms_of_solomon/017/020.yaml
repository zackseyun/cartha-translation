  source_fidelity: 'A tradução acompanha adequadamente a estrutura do grego: os que amavam as assembleias dos piedosos fogem «deles», a dispersão é atribuída a agentes ἀνόμων, e a retenção da chuva fundamenta a oração causal. Contudo, «transgressores da lei» explicita em excesso um sentido jurídico específico para ἄνομοι, termo que significa mais amplamente «os sem lei»/«os ímpios».'
  naturalness: O português é claro e de registro apropriado. «A sua dispersão ocorreu por toda a terra» é mais natural e direto do que a inversão «por toda a terra ocorreu a sua dispersão».
  terminology: «Piedosos» é uma boa escolha contextual para ὁσίων e deve ser mantida. «Assembleias» preserva bem συναγωγάς sem impor uma instituição posterior. «Os sem lei» conserva a amplitude de ἀνόμων. A nota sobre a chuva deve indicar que o verbo grego é «gotejar/destilar», embora a tradução corrente use «derramar».
  issues:
