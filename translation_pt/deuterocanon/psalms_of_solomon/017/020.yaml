  text: Those who loved the assemblies of the the pious fled from them; their scattering by lawless men spread over all the earth, because heaven held back from dripping rain upon the earth.
translation:
  language: pt
  text: Os que amavam as assembleias[a] dos piedosos[b] fugiram deles; a sua dispersão[c] ocorreu por toda a terra, por obra dos sem lei, porque o céu deixou de derramar chuva[d] sobre a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reuniões” ou “congregações”.
    reason: lexical_alternative
  - marker: b
    text: Ou “fiéis”; literalmente, pessoas caracterizadas pela piedade ou devoção.
    reason: lexical_alternative
  - marker: c
    text: Ou “espalhamento”.
    reason: lexical_alternative
  - marker: d
    text: Mais literalmente, “de gotejar” ou “destilar chuva”.
    reason: literal_rendering
lexical_decisions:
- source_word: ἔφυγοσαν
  choice: fugiram
  rationale: Expressa de modo direto e natural o movimento de fuga indicado pelo verbo grego.
- source_word: συναγωγὰς
  choice: assembleias
  rationale: Preserva o sentido de reuniões ou comunidades congregadas sem impor necessariamente uma instituição posterior.
- source_word: ὁσίων
  choice: piedosos
  rationale: Neste contexto, ὅσιοι caracteriza pessoas devotas ou fiéis; “piedosos” distingue o termo de ἅγιοι e evita as associações eclesiásticas posteriores de “santos”.
- source_word: σκορπισμὸς
  choice: dispersão
  rationale: Comunica com clareza o estado ou processo de serem espalhados por toda a terra.
- source_word: ὑπὸ ἀνόμων
  choice: por obra dos transgressores da lei
  rationale: Torna explícita a agência da construção grega e conserva a dimensão jurídica e moral de ἄνομος.
- source_word: ἀνέσχεν
  choice: deixou de
  rationale: No contexto, o verbo indica que o céu cessou ou se absteve de produzir chuva; esta formulação é natural em português.
- source_word: στάξαι ὑετὸν
  choice: derramar chuva
  rationale: Oferece uma expressão portuguesa natural para a imagem da chuva que cai, enquanto a nota registra o sentido mais concreto de στάζω.
theological_decisions:
- issue: Identidade dos ὅσιοι
  choice: piedosos
  alternative: santos; fiéis
  rationale: A tradução caracteriza o grupo por sua devoção sem identificá-lo automaticamente com a categoria eclesiástica posterior dos “santos”.
- issue: Referente de αὐτῶν em ἀπ’ αὐτῶν
  choice: deles
  alternative: explicitar um referente contextual
  rationale: O pronome grego não identifica novamente seu referente neste versículo; manter “deles” preserva essa dependência do contexto e evita resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A ordem foi ajustada para clareza, mas a relação causal e a ambiguidade do pronome “deles” foram preservadas.
