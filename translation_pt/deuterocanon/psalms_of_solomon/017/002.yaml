  source_fidelity: O texto principal representa adequadamente χρόνος ζωῆς como “duração da vida”, o singular genérico de ἀνθρώπου e o valor proporcional de κατὰ τὸν χρόνον αὐτοῦ. A leitura principal de ἐπʼ αὐτόν como referência ao ser humano é defensável e é favorecida pelo contraste imediato com a esperança em Deus no versículo seguinte. Contudo, “esperança depositada nele” deixa de explicitar αὐτοῦ (“sua esperança”), e a nota alternativa transforma indevidamente a comparação proporcional em uma afirmação meramente temporal (“Enquanto dura”).
  naturalness: “Duração da vida” e “ser humano” são naturais em português moderno. “Segundo a duração de sua vida, assim é também a sua esperança nele” conserva a construção comparativa do grego com clareza e registro apropriado.
  terminology: “Esperança” é o equivalente direto de ἐλπίς. “Nele” mantém a leitura principal pessoal; a nota deve apresentar a alternativa de referente sem alterar o sentido de proporção expresso por κατά.
