  yaml_path: translation/deuterocanon/psalms_of_solomon/017/002.yaml
  text: And what is the span of a man's life on the earth? According to his span[b][a], so also is his hope upon him.
translation:
  language: pt
  text: E qual é a duração da vida de um ser humano sobre a terra? Segundo a duração de sua vida, assim é também a sua esperança nele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Segundo a duração de sua vida, assim é também a sua esperança nela”, entendendo o pronome final como referência à duração da vida, e não ao ser humano.'
    reason: alternative_reading
lexical_decisions:
- source_word: χρόνος ζωῆς
  choice: duração da vida
  rationale: A expressão indica o período limitado da vida humana; “duração da vida” comunica com naturalidade essa medida temporal em português.
- source_word: ἀνθρώπου
  choice: do ser humano
  rationale: O singular é genérico e designa uma pessoa humana representativa, sem restringir o sentido ao sexo masculino.
- source_word: ἐπὶ τῆς γῆς
  choice: sobre a terra
  rationale: Preserva de modo claro e digno a localização da vida humana no âmbito terreno.
- source_word: κατὰ τὸν χρόνον αὐτοῦ
  choice: De acordo com a duração da vida dele
  rationale: Mantém a ideia de correspondência ou proporção expressa por κατά, sem reduzi-la apenas ao período durante o qual a esperança subsiste.
- source_word: ἐλπὶς
  choice: esperança
  rationale: É o equivalente direto e corrente para a expectativa ou confiança humana indicada pelo substantivo grego.
- source_word: ἐπʼ αὐτόν
  choice: depositada nele
  rationale: Toma o pronome principalmente como referência ao ser humano, favorecido pelo contraste subsequente com esperar em Deus, mas registra em nota a referência gramaticalmente possível ao tempo de vida.
theological_decisions:
- issue: Referente de ἐπʼ αὐτόν
  choice: O texto principal entende “nele” como referência ao ser humano.
  alternative: O pronome pode referir-se ao tempo ou à duração da vida.
  rationale: Ambos os antecedentes são masculinos em grego. O contraste do versículo seguinte favorece a esperança depositada no ser humano, mas a ambiguidade genuína não deve ser eliminada e por isso é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição explicativa de “duração da vida” evita um possessivo excessivamente ambíguo, enquanto a nota conserva a ambiguidade real do grego.
