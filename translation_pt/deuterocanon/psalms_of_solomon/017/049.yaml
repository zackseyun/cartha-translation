lexical_decisions:
- source_word: οἱ λόγοι αὐτοῦ
  choice: Suas palavras
  rationale: λόγοι designa palavras ou declarações; “suas palavras” é direto, natural e preserva a repetição de λόγοι no versículo.
- source_word: ὡς
  choice: são como
  rationale: A partícula introduz uma comparação. O verbo “são”, implícito no grego, é expresso em português para formar uma frase natural.
- source_word: λόγοι ἁγίων
  choice: palavras de santos
  rationale: O genitivo plural ἁγίων é entendido substantivamente, referindo-se a pessoas santas. “Santos” comunica isso de modo conciso sem transformar a expressão em “palavras santas”.
- source_word: ἐν μέσῳ
  choice: em meio a
  rationale: A expressão indica presença no meio de um grupo; “em meio a” mantém a imagem espacial e soa natural em português.
- source_word: λαῶν ἡγιασμένων
  choice: povos santificados
  rationale: 'Mantém o plural λαῶν e o sentido verbal do particípio perfeito passivo ἡγιασμένων: povos que foram tornados santos ou consagrados.'
theological_decisions:
- issue: Referente de ἁγίων
  choice: santos
  alternative: coisas santas; palavras santas
  rationale: A ligação genitiva com λόγοι favorece a leitura substantiva pessoal, “palavras de santos”, sem acrescentar uma identificação denominacional específica.
- issue: Pluralidade de λαῶν
  choice: povos santificados
  alternative: povo santificado
  rationale: O plural do texto grego é preservado, evitando reduzir vários povos a um único povo por harmonização teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a repetição de “palavras”, o plural “povos” e a distinção entre “santos” e “santificados” presente no grego.
