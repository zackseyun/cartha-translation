  text: And no sojourner or foreigner shall sojourn among them any longer[a]; he will judge peoples and nations in the wisdom of his righteousness[d][c][b]. Selah.
translation:
  language: pt
  text: E nem forasteiro[a] nem estrangeiro morará mais entre eles; ele julgará povos e nações com a sabedoria da sua justiça[b]. Selá.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “residente estrangeiro”.
    reason: lexical_alternative
  - marker: b
    text: Ou “da sua retidão”.
    reason: lexical_alternative
  - marker: c
    text: “Selá” provavelmente indica uma pausa litúrgica ou musical; seu sentido exato é incerto.
    reason: cultural_note
lexical_decisions:
- source_word: πάροικος
  choice: forasteiro
  rationale: Designa alguém que reside entre um povo sem pertencer plenamente a ele. “Forasteiro” é claro, digno e mantém a distinção em relação a ἀλλογενής, embora “residente estrangeiro” explicite melhor o estatuto de residência.
- source_word: ἀλλογενής
  choice: estrangeiro
  rationale: Expressa origem externa ou pertencimento a outro povo; “estrangeiro” é o equivalente moderno mais natural.
- source_word: παροικήσει
  choice: morará entre eles
  rationale: O verbo indica residir como alguém de fora. Em português, “morará entre eles” comunica isso naturalmente no contexto, ainda que não reproduza a relação etimológica com πάροικος.
- source_word: λαούς
  choice: povos
  rationale: Preserva o plural coletivo e distingue λαούς do termo seguinte, ἔθνη.
- source_word: ἔθνη
  choice: nações
  rationale: Mantém a dupla expressão grega “povos e nações” sem reduzir ambos os termos a um só.
- source_word: σοφίᾳ
  choice: sabedoria
  rationale: No contexto régio e judicial, indica discernimento sábio; “sabedoria” é a correspondência mais direta e natural.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: “Justiça” abrange bem, em português, tanto a qualidade moral quanto a dimensão judicial do termo neste contexto; “retidão” continua sendo uma alternativa possível.
- source_word: διάψαλμα
  choice: Selá
  rationale: Translitera o marcador litúrgico ou musical tradicional sem definir de modo indevido sua função exata, que permanece incerta.
theological_decisions:
- issue: Sentido de δικαιοσύνη no contexto do julgamento régio
  choice: sua justiça
  alternative: sua retidão
  rationale: O contexto de julgar povos e nações favorece “justiça”, mas o termo também pode apontar para a retidão moral do governante. A nota preserva essa amplitude sem impor uma distinção doutrinária.
- issue: Relação do genitivo em σοφίᾳ δικαιοσύνης αὐτοῦ
  choice: com a sabedoria da sua justiça
  alternative: com sabedoria, segundo a sua justiça
  rationale: A formulação principal conserva a ligação estreita entre “sabedoria” e “justiça” presente no grego. A construção admite alguma tensão quanto à relação exata entre os substantivos, e a tradução não a transforma em explicação teológica.
translation_notes:
  register: Português atual, digno e de leitura ampla, com cadência poética. A coordenação “nem... nem...” reproduz a dupla exclusão do grego; “morará mais” expressa οὐ... ἔτι de forma idiomática. A pontuação mantém as duas afirmações principais do versículo e trata “Selá” como marcador independente.
