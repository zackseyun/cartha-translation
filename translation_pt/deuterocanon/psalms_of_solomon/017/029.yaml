  yaml_path: translation/deuterocanon/psalms_of_solomon/017/029.yaml
  text: And he will not allow unrighteousness to remain among them any longer[a], and no one who knows wickedness will dwell with them.
translation:
  language: pt
  text: E ele não permitirá que a injustiça permaneça entre eles por mais tempo[a], e ninguém que conheça a maldade habitará com eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Neste ponto, a redação grega preservada por este testemunho é textualmente difícil, especialmente em torno de “entre eles”; o sentido geral, porém, é claro: a injustiça já não permanecerá no meio da comunidade.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀφήσει
  choice: permitirá
  rationale: Com o infinitivo μεῖναι, o futuro de ἀφίημι expressa aqui a recusa de permitir que algo continue.
- source_word: ἀδικίαν
  choice: injustiça
  rationale: ἀδικία abrange injustiça, conduta errada e falta de retidão; “injustiça” é clara e preserva a dimensão moral e comunitária do contexto.
- source_word: ἔτι
  choice: por mais tempo
  rationale: Sob a negação, indica que uma situação anterior deixará de continuar.
- source_word: μεῖναι
  choice: permaneça
  rationale: Conserva a ideia de continuidade ou permanência e se encaixa naturalmente depois de “permitirá que”.
- source_word: ἐν αὐτῶν
  choice: entre eles
  rationale: Embora a forma transmitida seja gramaticalmente difícil, o contexto aponta para a presença da injustiça no meio da comunidade.
- source_word: κατοικήσει
  choice: habitará
  rationale: Mantém a ideia de residência estável e o registro elevado do salmo.
- source_word: ἄνθρωπος
  choice: ninguém
  rationale: O substantivo singular tem sentido humano genérico neste enunciado negativo; “ninguém” evita uma limitação indevida ao sexo masculino.
- source_word: εἰδὼς κακίαν
  choice: que conheça a maldade
  rationale: A expressão compacta preserva a possível ideia de familiaridade ou envolvimento com o mal, sem reduzi-la a mera informação abstrata.
- source_word: κακίαν
  choice: maldade
  rationale: κακία designa aqui o mal moral em sentido amplo, não apenas a malícia dirigida contra outra pessoa.
theological_decisions:
- issue: Exclusão moral da comunidade restaurada
  choice: O versículo exclui tanto a injustiça quanto qualquer pessoa caracterizada por familiaridade com a maldade de habitar com o povo.
  alternative: Traduzir ἀδικία com linguagem mais explicitamente religiosa, como “iniquidade”, ou entender “conhecer a maldade” como simples conhecimento intelectual.
  rationale: O contexto trata da purificação da comunidade sob um governo justo. A redação mantém lado a lado o mal abstrato e a pessoa ligada à maldade, sem introduzir categorias doutrinárias posteriores nem definir em excesso o sentido de “conhecer”.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A ordem das duas afirmações e a tensão entre a injustiça abstrata e a pessoa que “conhece a maldade” foram preservadas.
