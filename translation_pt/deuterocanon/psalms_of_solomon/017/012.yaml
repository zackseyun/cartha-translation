  text: The Lord is faithful in all his judgments that he carries out on the earth[a].
translation:
  language: pt
  text: O Senhor é fiel em todos os seus juízos que executa sobre a terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em todos os juízos que ele executa sobre a terra”. O grego explicita que são seus juízos.'
    reason: Registra a formulação alternativa, ao mesmo tempo que esclarece a presença explícita de αὐτοῦ no grego.
lexical_decisions:
- source_word: πιστός
  choice: fiel
  rationale: Adjetivo predicativo que descreve a constância e a confiabilidade do Senhor; “fiel” preserva naturalmente essa força em português.
- source_word: κύριος
  choice: Senhor
  rationale: Título reverente e tradução habitual de κύριος no uso bíblico da Septuaginta.
- source_word: κρίμασιν
  choice: juízos
  rationale: Refere-se a decisões ou atos judiciais concretos; “juízos” mantém o campo jurídico sem ampliar o sentido.
- source_word: ποιεῖ
  choice: executa
  rationale: Embora ποιέω tenha o sentido básico de “fazer”, “executar juízos” é idiomático em português e comunica que esses juízos são postos em prática.
- source_word: ἐπὶ τὴν γῆν
  choice: sobre a terra
  rationale: Expressa de modo abrangente o âmbito da ação do Senhor, sem restringir γῆ ao sentido de uma terra ou região específica.
theological_decisions:
- issue: Se o versículo enfatiza o caráter de Deus ou apenas a correção de seus atos
  choice: “O Senhor é fiel” mantém πιστός como descrição do próprio Senhor, enquanto “em todos os seus juízos” mostra onde essa fidelidade se manifesta.
  alternative: “O Senhor é justo em todos os seus juízos”
  rationale: “Justo” introduziria uma ideia lexical distinta; o grego afirma diretamente a fidelidade ou confiabilidade do Senhor.
- issue: Presença do possessivo αὐτοῦ
  choice: “seus juízos”
  alternative: “os juízos que executa”
  rationale: O pronome αὐτοῦ está expresso no grego e deve ser preservado, embora em português a oração relativa já possa indicar que os juízos pertencem ao Senhor.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe próxima do grego sem rigidez. “Executa” evita o menos natural “faz juízos”, e “sobre a terra” preserva a abrangência de γῆ.
