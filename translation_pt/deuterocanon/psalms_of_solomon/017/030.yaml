  yaml_path: translation/deuterocanon/psalms_of_solomon/017/030.yaml
  text: For he will recognize them[a], that they all are sons of their God[c][b], and he will apportion them among their tribes upon the land.
translation:
  language: pt
  text: Pois ele reconhecerá que todos eles são filhos do Deus deles[a] e os distribuirá entre as suas tribos na terra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «filhos»; no uso coletivo, a expressão pode incluir todos os pertencentes ao povo de Deus.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «sobre a terra». A palavra grega pode referir-se à terra em geral ou, neste contexto, a uma terra ou território específico.'
    reason: alternative_reading
lexical_decisions:
- source_word: γνώσεται
  choice: reconhecerá
  rationale: O futuro médio de γινώσκω, neste contexto, sugere reconhecimento pessoal da identidade deles, e não simples aquisição de conhecimento.
- source_word: υἱοὶ
  choice: filhos
  rationale: Preserva o substantivo masculino plural do grego e sua possível conotação de identidade e dignidade pactual; em português, «filhos» também pode abranger coletivamente os descendentes.
- source_word: θεοῦ ... αὐτῶν
  choice: do Deus deles
  rationale: A formulação torna inequívoco que Deus é o Deus do grupo reconhecido, evitando a ambiguidade pronominal que «seu Deus» poderia criar em português.
- source_word: καταμερίσει
  choice: distribuirá
  rationale: O verbo expressa repartição ou atribuição ordenada; «distribuirá» comunica com naturalidade a organização segundo as tribos.
- source_word: ἐν ταῖς φυλαῖς αὐτῶν
  choice: entre as suas tribos
  rationale: A expressão indica a colocação deles dentro da organização tribal; «tribos» preserva o contexto israelita.
- source_word: ἐπὶ τῆς γῆς
  choice: na terra
  rationale: «Na terra» é idiomático em português e permite tanto a leitura territorial quanto, em sentido mais amplo, a referência à terra, sem decidir silenciosamente a ambiguidade de γῆ.
theological_decisions:
- issue: Sentido de υἱοὶ θεοῦ
  choice: filhos do Deus deles
  alternative: descendentes do Deus deles / filhos e filhas do Deus deles
  rationale: A tradução mantém o masculino explícito do texto sem ampliar nem restringir a afirmação teológica; a possível abrangência coletiva é indicada em nota.
- issue: Alcance de ἐπὶ τῆς γῆς
  choice: na terra
  alternative: sobre a terra / na Terra de Israel
  rationale: γῆ pode designar a terra em sentido geral ou um território específico. O contexto favorece uma distribuição territorial, mas o texto grego não nomeia explicitamente Israel; por isso, a tradução preserva a abertura sem acrescentar um referente.
translation_notes:
  register: Português atual, claro e digno, com sintaxe fluente e vocabulário acessível. «Do Deus deles» foi mantido por clareza referencial, e «na terra» conserva a ambiguidade legítima do grego.
