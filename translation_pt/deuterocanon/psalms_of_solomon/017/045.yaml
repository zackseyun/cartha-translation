  yaml_path: translation/deuterocanon/psalms_of_solomon/017/045.yaml
  text: Shepherding the Lord’s flock in faithfulness and righteousness[d][c][b][a], he will not allow any among them to grow weak in their pasture.
translation:
  language: pt
  text: Pastoreando o rebanho do Senhor com fidelidade e justiça, ele não permitirá que nenhum deles enfraqueça em sua pastagem.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com fé”; o grego πίστει pode significar tanto fé quanto fidelidade.
    reason: lexical_alternative
  - marker: b
    text: Ou “retidão”.
    reason: lexical_alternative
  - marker: c
    text: 'Outra tradução possível: “Ele pastoreará o rebanho do Senhor com fidelidade e justiça e não permitirá que nenhum deles enfraqueça em sua pastagem”.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ποιμαίνων
  choice: Pastoreando
  rationale: Preserva o particípio grego e a metáfora do governo régio-pastoral, ligando-se naturalmente a “rebanho” e “pastagem”.
- source_word: τὸ ποίμνιον Κυρίου
  choice: o rebanho do Senhor
  rationale: Traduz de modo direto o grupo pertencente ao Senhor e mantém a imagem pastoral.
- source_word: ἐν πίστει
  choice: com fidelidade
  rationale: Neste contexto, descreve mais naturalmente a maneira confiável e íntegra de pastorear; “com fé” continua possível.
- source_word: καὶ δικαιοσύνῃ
  choice: e justiça
  rationale: “Justiça” é natural em português para a qualidade moral do governo, sem excluir a ideia mais ampla de retidão.
- source_word: οὐκ ἀφήσει
  choice: não permitirá
  rationale: Com o infinitivo seguinte, o verbo exprime impedimento ou não permissão, e não mero abandono.
- source_word: ἀσθενῆσαι
  choice: enfraqueça
  rationale: Expressa a passagem a um estado de fraqueza de maneira concisa e idiomática.
- source_word: ἐν αὐτοῖς
  choice: nenhum deles
  rationale: Torna explícito o valor distributivo no interior do rebanho, embora literalmente a expressão seja “entre/neles”.
- source_word: ἐν τῇ νομῇ αὐτῶν
  choice: em sua pastagem
  rationale: Mantém a imagem pastoral; o possessivo plural grego é vertido pelo singular distributivo natural em português.
theological_decisions:
- issue: Valor de πίστει
  choice: fidelidade
  alternative: fé
  rationale: O termo grego admite ambos os sentidos. Aqui, associado ao modo de o governante pastorear, “fidelidade” é contextualmente mais provável, sem eliminar a alternativa em nota.
- issue: Relação sintática do particípio ποιμαίνων com οὐκ ἀφήσει
  choice: 'particípio circunstancial: “Pastoreando..., ele não permitirá...”'
  alternative: 'coordenação finita: “Ele pastoreará..., e não permitirá...”'
  rationale: A tradução preserva formalmente o particípio do texto grego e evita decidir que ele tenha necessariamente força futura coordenada, embora essa leitura semitizante seja possível.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sequência “rebanho—pastoreando—pastagem” conserva a metáfora pastoral do grego. Os marcadores aparecem após a frase para não interromper excessivamente sua fluidez.
