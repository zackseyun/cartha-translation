  text: The lawless one laid waste our land, emptying it of its inhabitants; they wiped out young and old, and their children together.
translation:
  language: pt
  text: O transgressor devastou a nossa terra, deixando-a sem os seus habitantes; eles exterminaram jovens e idosos, juntamente com os filhos deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego passa do singular (“o transgressor”) para um verbo no plural (“eles exterminaram”). A tradução preserva essa mudança, sem uniformizá-la.
