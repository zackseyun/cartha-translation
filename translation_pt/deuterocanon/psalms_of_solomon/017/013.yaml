lexical_decisions:
- source_word: ἠρήμωσεν
  choice: devastou
  rationale: Expressa de modo natural e digno a ação de tornar a terra desolada, sem enfraquecer a violência do verbo.
- source_word: ὁ ἄνομος
  choice: o transgressor
  rationale: Preserva o singular substantivado e comunica alguém que viola a lei; evita ampliar o sentido para a maldade em geral.
- source_word: ἀπὸ ἐνοικούντων αὐτήν
  choice: deixando-a sem os seus habitantes
  rationale: 'Reproduz em português corrente o resultado da construção grega: a terra foi desolada mediante a remoção dos que nela habitavam.'
- source_word: ἠφάνισαν
  choice: exterminaram
  rationale: No contexto de pessoas, transmite a ideia forte de fazê-las desaparecer ou destruí-las, com registro apropriado.
- source_word: νέον καὶ πρεσβύτην
  choice: jovens e idosos
  rationale: Mantém o merismo entre os extremos de idade em linguagem portuguesa natural e inclusiva quanto ao grupo referido.
- source_word: τέκνα αὐτῶν ἅμα
  choice: juntamente com os filhos deles
  rationale: Preserva tanto a referência explícita aos filhos quanto a força inclusiva de ἅμα, indicando que sofreram o mesmo destino.
