  text: when a man foreign to our race rose up against them[a].
translation:
  language: pt
  text: quando um homem estrangeiro ao nosso povo se levantou contra eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «quando se levantou contra eles um homem alheio à nossa linhagem».'
    reason: Alternativa lexical para ἀλλότριον γένους ἡμῶν, que torna mais explícita a noção de linhagem ou origem coletiva.
lexical_decisions:
- source_word: ἐν τῷ ἐπαναστῆναι
  choice: quando se levantou
  rationale: A construção com ἐν e infinitivo articular tem valor temporal; «quando» expressa isso com naturalidade, enquanto «se levantou» conserva a força verbal.
- source_word: αὐτοῖς
  choice: contra eles
  rationale: Com ἐπανίστημι, o dativo indica naturalmente aqueles contra quem alguém se levanta.
- source_word: ἄνθρωπον
  choice: um homem
  rationale: Mantém o singular e o gênero masculino explícitos no grego.
- source_word: ἀλλότριον
  choice: de outro povo
  rationale: No contexto de pertencimento étnico ou nacional, esta formulação é natural e evita que «estrangeiro» seja entendido apenas como cidadão de outro país.
- source_word: γένους ἡμῶν
  choice: do nosso povo
  rationale: γένος designa aqui o grupo de origem ou parentesco coletivo; «nosso povo» transmite essa identidade sem as conotações modernas potencialmente enganosas de «raça».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. «De outro povo» foi preferido a «estrangeiro à nossa raça» por legibilidade e por representar o pertencimento coletivo sem introduzir categorias raciais modernas.
