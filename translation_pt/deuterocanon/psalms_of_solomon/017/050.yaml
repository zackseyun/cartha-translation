  text: Blessed are those who are alive in those days[a], to see the good things of Israel in the assembly of the tribes. May God bring it to pass!
translation:
  language: pt
  text: Felizes os que estiverem vivos naqueles dias, para verem as coisas boas de Israel na assembleia das tribos. Que Deus o realize![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, entendendo a expressão final como subordinada: «as coisas boas de Israel que Deus realizará».'
    reason: Registra a possível leitura subordinada de ποιῆσαι ὁ θεός, sem eliminar a leitura independente e volitiva adotada no texto.
lexical_decisions:
- source_word: μακάριοι
  choice: Felizes
  rationale: Termo natural e corrente para uma bem-aventurança em português, preservando a declaração de condição favorecida sem tornar a linguagem excessivamente arcaica.
- source_word: οἱ γενόμενοι ἐν ταῖς ἡμέραις ἐκείναις
  choice: os que estiverem vivos naqueles dias
  rationale: Embora γενόμενοι signifique literalmente os que vierem a existir, no contexto designa aqueles que viverão o bastante para presenciar o tempo futuro. A formulação portuguesa comunica esse sentido de modo claro.
- source_word: ἰδεῖν
  choice: para verem
  rationale: O infinitivo expressa aquilo que essas pessoas terão o privilégio de presenciar; “verem” é simples, direto e fiel.
- source_word: τὰ ἀγαθὰ Ἰσραήλ
  choice: os bens de Israel
  rationale: 'Mantém o valor concreto de τὰ ἀγαθά e deixa relativamente aberta a relação do genitivo: podem ser os bens pertencentes a Israel ou os benefícios destinados a Israel.'
- source_word: ἐν συναγωγῇ φυλῶν
  choice: na assembleia das tribos
  rationale: συναγωγή denota aqui a reunião ou assembleia das tribos. “Assembleia” preserva o tom formal e a imagem da congregação de Israel.
- source_word: ποιῆσαι ὁ θεός
  choice: Que Deus o realize!
  rationale: 'A expressão final, separada pela pontuação grega, funciona naturalmente como exclamação volitiva ou oração: um pedido para que Deus faça acontecer o que foi descrito.'
theological_decisions:
- issue: Valor sintático e volitivo de ποιῆσαι ὁ θεός
  choice: 'Traduzir como oração independente: “Que Deus o realize!”'
  alternative: 'Subordinar à frase anterior: “que Deus realizará”'
  rationale: O ponto alto no texto grego favorece uma nova unidade, e a construção comprimida pode exprimir um desejo piedoso. A tradução independente preserva o tom de súplica sem transformar a afirmação em previsão categórica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Felizes” evita o arcaísmo de “bem-aventurados”, enquanto “assembleia das tribos” conserva a solenidade e a imagem coletiva do original.
