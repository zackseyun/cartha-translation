lexical_decisions:
- source_word: εὐλογία
  choice: bênção
  rationale: O substantivo designa de modo direto uma bênção; “bênção” é o equivalente português mais transparente e natural.
- source_word: Κυρίου
  choice: do Senhor
  rationale: O genitivo expressa posse ou origem, e “do Senhor” preserva naturalmente a construção grega.
- source_word: μετʼ αὐτοῦ
  choice: com ele
  rationale: μετά com o genitivo normalmente significa “com”; a tradução conserva o sentido de acompanhamento sem acrescentar interpretação.
- source_word: ἐν ἰσχύϊ
  choice: em força
  rationale: ἰσχύς pode indicar força, vigor ou poder. “Em força” preserva de perto a forma e a ambiguidade do grego; alternativas naturais são registradas em nota.
- source_word: '[cópula implícita]'
  choice: está
  rationale: O grego omite o verbo finito. Em português, “está” torna a oração gramatical e expressa adequadamente a presença da bênção com ele.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível. A formulação mantém a concisão do grego e sua construção incomum, sem determinar se a força caracteriza a bênção, sua atuação ou aquele com quem ela está.
