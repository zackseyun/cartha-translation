  yaml_path: translation/deuterocanon/psalms_of_solomon/017/028.yaml
  text: And he will gather a holy people[a], whom he will lead in righteousness[d][c][b]; and he will judge the tribes of the people sanctified by the Lord his God.
translation:
  language: pt
  text: E ele reunirá um povo santo, que conduzirá com justiça[a]; e julgará[b] as tribos de um povo santificado pelo Senhor, seu Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com retidão”.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto régio, “julgará” também pode ter o sentido mais amplo de “governará”.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνάξει
  choice: reunirá
  rationale: Expressa de modo direto e natural a ação futura de ajuntar um povo.
- source_word: λαὸν ἅγιον
  choice: um povo santo
  rationale: Preserva tanto o caráter anartro da expressão quanto sua força religiosa e comunitária.
- source_word: ἀφήγήσεται
  choice: conduzirá
  rationale: Comunica a ideia de liderar ou guiar o povo sem acrescentar uma interpretação mais específica.
- source_word: ἐν δικαιοσύνῃ
  choice: com justiça
  rationale: Em português atual, indica naturalmente a maneira pela qual ele conduzirá; mantém aberta a dimensão moral e judicial de δικαιοσύνη.
- source_word: κρινεῖ
  choice: julgará
  rationale: Mantém o sentido básico judicial do verbo, sem apagar sua possível nuance régia de governar.
- source_word: φυλὰς λαοῦ ἡγιασμένου
  choice: as tribos de um povo santificado
  rationale: Deixa claro que o particípio singular modifica “povo”, não “tribos”, e conserva o paralelo com “um povo santo” no primeiro membro.
- source_word: ὑπὸ Κυρίου θεοῦ αὐτοῦ
  choice: pelo Senhor, seu Deus
  rationale: Preserva a ação divina e a relação pessoal indicada pelo pronome, em formulação portuguesa idiomática.
theological_decisions:
- issue: Sentido de δικαιοσύνη
  choice: com justiça
  alternative: com retidão
  rationale: “Justiça” preserva a amplitude moral e judicial do termo no contexto régio; “retidão” continua sendo uma alternativa legítima.
- issue: Alcance régio de κρίνω
  choice: julgará
  alternative: governará
  rationale: O sentido judicial básico foi mantido no texto, enquanto a nota registra a possível extensão para o exercício do governo.
- issue: Caráter passivo de ἡγιασμένου
  choice: santificado
  alternative: tornado santo
  rationale: “Santificado” conserva de forma concisa o perfeito passivo, indicando que o povo recebeu essa condição, aqui por ação do Senhor.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e leve ressonância bíblica. A tradução evita tecnicismo excessivo, preserva o paralelismo entre “um povo santo” e “um povo santificado” e não resolve indevidamente as amplitudes semânticas de δικαιοσύνη e κρίνω.
