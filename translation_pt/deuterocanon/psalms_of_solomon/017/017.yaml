  text: And the sons of the covenant prevailed over them in the midst of the mixed nations[a]; there was no one among them, in Jerusalem[b], doing mercy and truth.
translation:
  language: pt
  text: E os filhos da aliança prevaleciam sobre eles[a] no meio das nações misturadas; não havia entre eles, em Jerusalém, quem praticasse misericórdia e verdade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os superavam”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “misericórdia e fidelidade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεκρατοῦσαν αὐτῶν
  choice: prevaleciam sobre eles
  rationale: O imperfeito indica ação contínua, e ἐπικρατέω com o genitivo pode expressar prevalência ou superioridade sobre alguém. A formulação preserva essa força sem especificar domínio político ou militar; a possibilidade contextual de os superar fica registrada em nota.
- source_word: υἱοὶ τῆς διαθήκης
  choice: filhos da aliança
  rationale: Reproduz a forma masculina plural e conserva o peso identitário da expressão ligada à aliança.
- source_word: ἐν μέσῳ ἐθνῶν συμμίκτων
  choice: no meio das nações misturadas
  rationale: Mantém o sentido coletivo de ἔθνη e a ideia explícita de mistura ou mescla em σύμμικτος.
- source_word: ὁ ποιῶν
  choice: quem praticasse
  rationale: Em português, 'praticar misericórdia e verdade' comunica naturalmente a ação moral expressa pelo particípio ποιῶν, sem reduzir seu alcance a um ato isolado.
- source_word: ἔλεος
  choice: misericórdia
  rationale: É o equivalente direto que preserva a força moral e religiosa do termo.
- source_word: ἀλήθειαν
  choice: verdade
  rationale: Conserva o sentido lexical transparente e a formulação tradicional do par, sem eliminar a possível nuance de fidelidade, indicada em nota.
theological_decisions:
- issue: Forma de identidade pactual em υἱοὶ τῆς διαθήκης
  choice: filhos da aliança
  alternative: membros do povo da aliança
  rationale: A expressão grega é explicitamente masculina e funciona como designação identitária; a tradução mantém essa forma sem a neutralizar interpretativamente.
- issue: Sentido do par ἔλεος καὶ ἀλήθειαν
  choice: misericórdia e verdade
  alternative: misericórdia e fidelidade
  rationale: O par pode carregar uma nuance ética e pactual semítica. O texto principal preserva os equivalentes mais diretos, enquanto a nota mantém aberta a leitura de ἀλήθεια como fidelidade.
- issue: Força contextual de ἐπεκρατοῦσαν
  choice: prevaleciam sobre eles
  alternative: os superavam
  rationale: O verbo admite a ideia de prevalecer, dominar ou superar. A escolha principal permanece próxima da forma grega e evita explicitar em que aspecto se dava a superioridade; a alternativa contextual é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe corrente no Brasil e compreensão ampla no espaço lusófono. A pontuação conserva a inserção enfática de “em Jerusalém” sem reproduzir de modo rígido a ordem grega.
