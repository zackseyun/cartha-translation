  yaml_path: translation/deuterocanon/psalms_of_solomon/017/019.yaml
  text: They wandered in wildernesses[a], that their lives might be saved from evil, and in the eyes of the sojourning community[d][c][b], a life saved from among them was precious.
translation:
  language: pt
  text: 'Eles vagavam por regiões desertas[a], para que suas vidas[b] fossem salvas do mal; e, aos olhos da comunidade que vivia como estrangeira[c], era preciosa uma vida salva dentre eles.


    [a] Ou “lugares ermos”.

    [b] O grego ψυχή pode significar “vida” ou “alma”; neste contexto de sobrevivência, “vida” parece mais adequado. O mesmo termo ocorre novamente no fim do versículo.

    [c] Ou “comunidade no exílio”. O grego παροικία se refere à condição ou comunidade dos que vivem longe de sua terra, como estrangeiros.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lugares ermos”.
    reason: lexical_alternative
  - marker: b
    text: O grego ψυχή pode significar “vida” ou “alma”; neste contexto de sobrevivência, “vida” parece mais adequado. O mesmo termo ocorre novamente no fim do versículo.
    reason: lexical_alternative
  - marker: c
    text: Ou “comunidade no exílio”. O grego παροικία se refere à condição ou comunidade dos que vivem longe de sua terra, como estrangeiros.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλανῶντο
  choice: vagavam
  rationale: Com ἐν ἐρήμοις, indica deslocamento físico sem rumo fixo, e não engano moral.
- source_word: ἐν ἐρήμοις
  choice: por regiões desertas
  rationale: Preserva o plural e abrange lugares ermos ou desabitados sem restringir a imagem a desertos arenosos.
- source_word: σωθῆναι ψυχὰς αὐτῶν
  choice: para que suas vidas fossem salvas
  rationale: Mantém tanto a finalidade expressa pelo infinitivo quanto sua voz passiva, com ψυχή no sentido concreto de vida.
- source_word: ἀπὸ κακοῦ
  choice: do mal
  rationale: Conserva a amplitude do grego, que pode incluir maldade, dano ou calamidade.
- source_word: τίμιον
  choice: preciosa
  rationale: Expressa o alto valor atribuído à vida preservada.
- source_word: παροικίας
  choice: da comunidade que vivia como estrangeira
  rationale: Torna explícito, em português natural, o sentido coletivo de pessoas residentes fora de sua terra, evitando a conotação eclesiológica que “comunidade peregrina” poderia adquirir.
- source_word: ψυχὴ σεσωμένη
  choice: uma vida salva
  rationale: O particípio perfeito indica uma vida que se encontra no estado de ter sido resgatada; “vida” se ajusta ao contexto de sobrevivência.
- source_word: ἐξ αὐτῶν
  choice: dentre eles
  rationale: Representa naturalmente a ideia de alguém retirado ou preservado dentre o grupo mencionado.
theological_decisions:
- issue: Sentido de ψυχή nas duas ocorrências
  choice: “vida/vidas” nas duas ocorrências
  alternative: “alma/almas”
  rationale: O contexto imediato trata de fugir do perigo para sobreviver. “Vida” evita impor ao texto uma afirmação antropológica mais específica do que o grego exige.
- issue: Agente da salvação em σωθῆναι
  choice: 'Manter a construção passiva: “fossem salvas”'
  alternative: 'Construção ativa: “para salvar suas vidas”'
  rationale: A voz passiva do grego não identifica expressamente o agente da preservação; a tradução mantém essa abertura e não atribui a ação aos próprios fugitivos.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe levemente elevada adequada à poesia sapiencial. O ponto e vírgula separa as duas proposições principais sem desfazer sua ligação.
