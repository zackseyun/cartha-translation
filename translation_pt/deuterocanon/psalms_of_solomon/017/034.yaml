lexical_decisions:
- source_word: ἔρχεσθαι
  choice: para que ... venham
  rationale: O infinitivo depende do contexto sintático anterior e expressa finalidade ou resultado; não deve ser transformado aqui em uma oração futura independente.
- source_word: ἔθνη
  choice: nações
  rationale: Designa amplamente os povos não israelitas. “Nações” é natural e evita impor um contraste técnico entre judeus e gentios.
- source_word: ἀπ’ ἄκρου τῆς γῆς
  choice: dos confins da terra
  rationale: A expressão indica distância extrema. O plural idiomático em português comunica o sentido com naturalidade, embora o grego empregue o singular.
- source_word: ἰδεῖν τὴν δόξαν αὐτοῦ
  choice: ver a glória dele
  rationale: Mantém simples o infinitivo de finalidade e preserva o peso teológico usual de δόξα. “Dele” evita que “sua” tenha referente incerto em português.
- source_word: φέροντες δῶρα τοὺς ... υἱοὺς
  choice: trazendo como presentes os filhos
  rationale: Os dois acusativos indicam que os filhos trazidos são apresentados como presentes; a formulação torna essa relação explícita.
- source_word: τοὺς ἐξησθενηκότας
  choice: que estavam debilitados
  rationale: O particípio perfeito descreve uma condição de fraqueza já alcançada e ainda vigente, sem limitá-la necessariamente à exaustão física.
- source_word: υἱοὺς αὐτῆς
  choice: os filhos dela
  rationale: Preserva tanto o masculino plural específico de υἱούς quanto o pronome feminino αὐτῆς, cujo referente vem do contexto anterior.
theological_decisions:
- issue: Relação sintática com o versículo anterior
  choice: 'Manter a oração subordinada de finalidade ou resultado: “para que ... venham”'
  alternative: “As nações virão”
  rationale: ἔρχεσθαι é infinitivo e continua a construção anterior; convertê-lo em futuro independente romperia a sintaxe e poderia alterar a relação lógica entre a purificação de Jerusalém e a vinda das nações.
- issue: Identidade dos presentes
  choice: Os filhos dela são trazidos como presentes
  alternative: As nações trazem presentes e também os filhos dela
  rationale: A aposição entre δῶρα e τοὺς ... υἱούς favorece a leitura de que os próprios filhos são os presentes, embora a construção grega seja compacta.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe subordinada preservada por depender do versículo anterior. “Dos confins da terra” é idiomático; “dele” e “dela” explicitam os diferentes pronomes gregos e reduzem ambiguidades próprias de “seu/sua”.
