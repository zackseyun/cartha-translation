base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/047.yaml
  text: 'This is the splendor of the king of Israel[a], which God knew: to raise him up over the house of Israel[c][b], to discipline him.'
translation:
  language: pt
  text: 'Esta é a majestade do rei de Israel, a qual Deus conheceu[a]: levantá-lo sobre a casa de Israel[b] e discipliná-lo[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Conheceu» também pode ter a nuance de «conheceu de antemão», «reconheceu» ou «aprovou».
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «para a casa de Israel».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «instruí-lo» ou «formá-lo». A construção também pode ser entendida: «ao levantá-lo sobre a casa de Israel e discipliná-lo».'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: εὐπρέπεια
  choice: majestade
  rationale: Expressa a dignidade e o esplendor visível próprios de um rei. Além de ser natural em português, o substantivo feminino permite que «a qual» retome sem ambiguidade a qualidade régia, como faz o pronome feminino grego ἣν.
- source_word: ἔγνω
  choice: conheceu
  rationale: Mantém a amplitude do verbo grego e seu possível fundo semítico, sem decidir entre simples conhecimento, conhecimento prévio, escolha ou aprovação.
- source_word: ἀναστῆσαι
  choice: levantá-lo
  rationale: Preserva a imagem verbal de fazer surgir ou pôr de pé, adequada à elevação ou instituição do rei, sem reduzi-la explicitamente a «nomeá-lo».
- source_word: ἐπʼ οἶκον Ἰσραήλ
  choice: sobre a casa de Israel
  rationale: «Sobre» comunica naturalmente autoridade régia, enquanto «casa de Israel» conserva a expressão coletiva tradicional do original.
- source_word: παιδεῦσαι
  choice: discipliná-lo
  rationale: O verbo abrange educação, formação, correção e disciplina. «Discipliná-lo» conserva sua força sem excluir o aspecto instrutivo, registrado em nota.
theological_decisions:
- issue: Sentido do conhecimento de Deus a respeito da majestade do rei
  choice: conheceu
  alternative: conheceu de antemão; reconheceu; aprovou
  rationale: O grego não especifica uma dessas nuances. A tradução conserva o peso potencial do conhecimento divino e evita impor uma formulação doutrinária mais definida.
- issue: Relação dos infinitivos com «conheceu»
  choice: dois infinitivos após dois-pontos, coordenados por «e»
  alternative: «ao levantá-lo... e discipliná-lo»
  rationale: A construção pode explicar o conteúdo ou propósito ligado ao conhecimento de Deus. Os infinitivos preservam essa tensão melhor que uma formulação estritamente temporal.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com boa legibilidade brasileira. «Majestade» evita uma retomada pronominal que pudesse atribuir equivocadamente ἣν ao rei, pois no grego o pronome feminino retoma εὐπρέπεια. O dois-pontos conserva a relação explicativa ou de propósito dos infinitivos sem resolvê-la excessivamente.
