  text: And his hope in the Lord will not grow weak; and who can stand against him? He is strong in his deeds and mighty in the fear of God,
translation:
  language: pt
  text: E sua esperança no Senhor não se enfraquecerá; quem poderá resistir-lhe? Ele é forte em seus feitos e poderoso no temor de Deus,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσθενήσει
  choice: não se enfraquecerá
  rationale: O futuro indica tornar-se fraco ou perder força. Com “esperança” como sujeito, a forma pronominal é natural em português e preserva a metáfora do grego.
- source_word: ἡ ἐλπὶς αὐτοῦ ἐπὶ Κύριον
  choice: sua esperança no Senhor
  rationale: A expressão indica esperança ou confiança dirigida ao Senhor. “Esperança no Senhor” é idiomático e mantém essa orientação sem acrescentar a ideia explícita de repousar ou apoiar-se.
- source_word: Κύριον
  choice: Senhor
  rationale: “Senhor” é o equivalente tradicional e semanticamente adequado para κύριος neste contexto; a contração “no” fornece o artigo exigido pelo uso natural em português.
- source_word: τίς δύναται πρὸς αὐτόν;
  choice: quem poderá resistir-lhe?
  rationale: A construção grega é compacta, literalmente “quem é capaz contra ele?”. A tradução expressa seu sentido adversativo e conserva a força da pergunta retórica.
- source_word: ἰσχυρὸς ἐν ἔργοις αὐτοῦ
  choice: forte em seus feitos
  rationale: ἰσχυρός denota força, enquanto ἔργα se refere aqui a atos ou realizações. “Feitos” mantém o caráter ativo da expressão e soa natural em português.
- source_word: κραταιὸς ἐν φόβῳ θεοῦ
  choice: poderoso no temor de Deus
  rationale: κραταιός comunica vigor ou poder. “Temor de Deus” preserva o idioma bíblico e sua tensão entre reverência e medo, sem reduzi-lo apenas a respeito.
- source_word: '[cópula implícita]'
  choice: Ele é
  rationale: O grego omite a cópula na descrição final. O português normalmente requer sujeito e verbo explícitos para uma frase fluente.
theological_decisions:
- issue: Sentido de φόβος θεοῦ
  choice: temor de Deus
  alternative: reverência por Deus
  rationale: A opção escolhida preserva a amplitude e o peso teológico da expressão grega, que pode incluir reverência, assombro e medo, em vez de resolver essa tensão em favor de apenas um aspecto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura coordenada e a vírgula final foram mantidas porque o versículo continua a descrição na sequência do poema.
