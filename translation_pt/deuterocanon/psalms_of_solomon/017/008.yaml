lexical_decisions:
- source_word: ἠρήμωσαν
  choice: Devastaram
  rationale: Expressa que tornaram o trono desolado ou arruinado, preservando a força do verbo em português natural.
- source_word: τὸν θρόνον Δαυίδ
  choice: o trono de Davi
  rationale: Mantém de modo direto a referência real e dinástica.
- source_word: ἐν ὑπερηφανίᾳ ἀλλάγματος
  choice: com arrogante usurpação
  rationale: ὑπερηφανία indica arrogância; ἀλλάγματος significa literalmente mudança, troca ou substituição. No contexto político-dinástico, “usurpação” comunica de modo natural a provável ideia de substituição ilegítima, sem ocultar a formulação literal na nota.
- source_word: καταβαλεῖς
  choice: os derrubarás
  rationale: O futuro grego descreve uma ação divina decisiva de abatimento ou queda.
- source_word: ἀρεῖς
  choice: removerás
  rationale: Traduz o sentido comum de αἴρω, “tirar” ou “remover”, sem especificar indevidamente o modo do juízo.
- source_word: σπέρμα αὐτῶν
  choice: a descendência deles
  rationale: Comunica em português atual o sentido geracional de “semente”, evitando uma leitura meramente biológica.
- source_word: ἀπὸ τῆς γῆς
  choice: da terra
  rationale: Preserva a amplitude de γῆ, que pode designar a terra, o mundo habitado ou uma terra específica conforme o contexto.
theological_decisions:
- issue: Valor temporal de καταβαλεῖς e ἀρεῖς
  choice: 'futuro: “derrubarás” e “removerás”'
  alternative: 'passado narrativo: “derrubaste” e “removeste”'
  rationale: Ambas as formas gregas são morfologicamente futuras. Embora o contexto histórico possa favorecer uma leitura retrospectiva em certos entendimentos da passagem, a tradução mantém o futuro explícito do texto e registra a questão em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa singular solene (“tu”, “derrubarás”, “removerás”) corresponde à invocação direta a Deus. A ordem “removerás da terra a descendência deles” evita ambiguidade e conserva o ritmo poético.
