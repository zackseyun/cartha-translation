  text: They laid waste the throne of David in arrogant usurpation[a]. But you, O God, will cast them down and remove their offspring from the earth[b],
translation:
  language: pt
  text: Devastaram o trono de Davi com arrogante usurpação[a]. Mas tu, ó Deus, os derrubarás e removerás da terra a descendência deles[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na arrogância da mudança/substituição”. A expressão grega é condensada; “usurpação” explicita seu provável sentido político.
    reason: lexical_alternative
  - marker: b
    text: Os verbos gregos estão no futuro. Alguns entendem que, no contexto, eles se referem narrativamente a um juízo já ocorrido.
