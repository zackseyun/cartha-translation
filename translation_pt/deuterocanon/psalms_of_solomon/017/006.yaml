base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/006.yaml
  text: And in our sins sinners rose up against us[a]; they attacked us and drove us out[c][b]. Those to whom you had not promised it took it away by force.
translation:
  language: pt
  text: E, em nossos pecados[a], pecadores se levantaram contra nós; atacaram-nos e expulsaram-nos. Aqueles a quem não havias prometido isso o tomaram à força[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa de nossos pecados”.'
    reason: A preposição grega pode indicar a esfera ou circunstância em que isso ocorreu e, no contexto, também admitir sentido causal.
  - marker: b
    text: O grego não declara o que não lhes havia sido prometido nem o que tomaram à força.
    reason: Os pronomes neutros usados em português tornam a frase natural, mas o objeto permanece sem identificação no texto-fonte.
lexical_decisions:
- source_word: ἐν ταῖς ἁμαρτίαις ἡμῶν
  choice: em nossos pecados
  rationale: Mantém a formulação preposicional do grego e não decide de modo definitivo se os pecados são a circunstância ou a causa da calamidade.
- source_word: ἐπανέστησαν ἡμῖν
  choice: se levantaram contra nós
  rationale: Expressa com naturalidade a ação hostil do verbo composto, sem restringi-la necessariamente a uma rebelião política.
- source_word: ἐπέθεντο ἡμῖν
  choice: atacaram-nos
  rationale: No contexto de violência e expulsão, o verbo indica uma investida hostil; esta forma é clara e idiomática em português.
- source_word: ἐξώσαντο ἡμᾶς
  choice: expulsaram-nos
  rationale: Comunica a remoção forçada expressa pelo verbo e preserva a progressão ataque–expulsão.
- source_word: οἷς οὐκ ἐπηγγείλω
  choice: aqueles a quem não havias prometido isso
  rationale: οἷς é dativo masculino plural e remete aos pecadores; ἐπηγγείλω é segunda pessoa do singular e mantém a fala dirigida a Deus. O mais-que-perfeito situa a não promessa antes da tomada.
- source_word: μετὰ βίας ἀφείλαντο
  choice: o tomaram à força
  rationale: Preserva a ideia de apropriação coerciva. Os pronomes necessários à fluência em português representam o objeto subentendido no grego, sem identificá-lo como reino, herança ou outra realidade específica.
theological_decisions:
- issue: Identidade do interlocutor em ἐπηγγείλω
  choice: 'Manter a segunda pessoa do singular: “não havias prometido”.'
  alternative: Entender como primeira pessoa do singular ou tornar a oração impessoal.
  rationale: A forma grega é segunda pessoa do singular e dá continuidade à interpelação a Deus no contexto, sem ser necessário inserir “Deus” ou “Senhor” neste versículo.
- issue: Objeto não expresso de “prometer” e “tomar”
  choice: Representá-lo apenas por pronomes neutros (“isso”, “o”), sem especificar o referente.
  alternative: Deixar a elipse integralmente sem objeto ou explicitar “o reino”, “a herança” ou outro referente.
  rationale: O grego não nomeia o objeto. A sintaxe portuguesa requer alguma explicitação pronominal para uma frase natural, mas a tradução não deve definir o referente e, assim, resolver uma tensão que o texto preserva.
translation_notes:
  register: Português atual, digno e de leitura ampla, com colocação pronominal aceitável tanto no Brasil como em outros contextos lusófonos. A tradução conserva a sequência vívida das ações e evita identificar o objeto tomado ou acrescentar uma interpretação político-teológica específica.
