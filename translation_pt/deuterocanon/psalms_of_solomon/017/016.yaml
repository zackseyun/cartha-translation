base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/016.yaml
  text: And everything that he did in Jerusalem was just as the nations do to their gods in their cities[a][b].
translation:
  language: pt
  text: E tudo o que ele fez em Jerusalém foi como o que as nações fazem aos seus deuses em suas cidades[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A comparação em grego é elíptica; o sentido implícito também pode ser: “assim como as nações fazem com seus deuses em suas cidades”.'
    reason: lexical_alternative
  - marker: b
    text: Ou “os gentios”, em vez de “as nações”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: tudo o que
  rationale: Expressa de modo natural e abrangente a força totalizante e relativa da frase grega.
- source_word: ἐποίησεν
  choice: fez
  rationale: Mantém a amplitude do verbo grego sem especificar indevidamente a natureza dos atos.
- source_word: ἐν Ἰερουσαλήμ
  choice: em Jerusalém
  rationale: Tradução locativa direta e idiomática.
- source_word: καθὼς καὶ
  choice: foi como o que
  rationale: Torna explícita em português a relação comparativa elíptica, sem definir além do necessário os atos comparados.
- source_word: τὰ ἔθνη
  choice: as nações
  rationale: É a correspondência mais direta e se ajusta à referência geral aos povos em suas próprias cidades; “os gentios” continua possível.
- source_word: ἐν ταῖς πόλεσι
  choice: em suas cidades
  rationale: O possessivo, embora não esteja expresso junto de πόλεσι, é naturalmente recuperado do contexto e do paralelo com αὐτῶν.
- source_word: τοὺς θεοὺς αὐτῶν
  choice: aos seus deuses
  rationale: Conserva “deuses”, em vez de introduzir a interpretação “ídolos”, e representa uma possível relação sintática com o verbo subentendido.
theological_decisions:
- issue: Natureza dos θεούς das nações
  choice: deuses
  alternative: ídolos
  rationale: O texto grego diz “deuses”; traduzi-lo por “ídolos” acrescentaria uma avaliação interpretativa não explicitada nesta oração.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. A elipse grega foi completada minimamente no texto principal, enquanto a alternativa “com seus deuses” foi preservada em nota.
