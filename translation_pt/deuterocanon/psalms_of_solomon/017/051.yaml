base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/051.yaml
  text: May God hasten his mercy upon Israel[a]. He will rescue us from the uncleanness of profane enemies[c][b]. The Lord himself is our king forever and ever.
translation:
  language: pt
  text: Que Deus apresse a sua misericórdia sobre Israel[a]. Ele nos livrará da impureza de inimigos profanos[b][c]. O próprio Senhor é nosso rei para todo o sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego começa com um infinitivo, literalmente «apressar». Aqui ele é vertido de modo idiomático como um desejo ou uma súplica: «Que Deus apresse...»'
    reason: alternative_reading
  - marker: b
    text: Ou «contaminação», em vez de «impureza».
    reason: lexical_alternative
  - marker: c
    text: Ou «inimigos ímpios», em vez de «inimigos profanos».
    reason: lexical_alternative
lexical_decisions:
- source_word: ταχύναι
  choice: apresse
  rationale: O infinitivo grego exprime aqui, de modo exclamativo, um desejo ou uma súplica urgente; «Que Deus apresse» comunica essa força em português natural.
- source_word: ἔλεος
  choice: misericórdia
  rationale: É o equivalente direto e corrente, preservando a ideia do favor compassivo de Deus sem acrescentar uma nuance não explicitada no verso.
- source_word: ῥύσεται
  choice: nos livrará
  rationale: O futuro apresenta uma declaração confiante de libertação. «Livrará» é natural em português e mantém o sentido de resgate de uma condição hostil.
- source_word: ἀκαθαρσίας
  choice: impureza
  rationale: Preserva a linguagem de falta de pureza, com possíveis dimensões ritual e moral, sem restringir indevidamente o sentido.
- source_word: βεβήλων
  choice: profanos
  rationale: Expressa aquilo que não é santo ou que desrespeita o sagrado e combina com a linguagem de impureza presente na frase.
- source_word: Κύριος
  choice: Senhor
  rationale: É a forma tradicional e semanticamente apropriada para κύριος quando o termo designa Deus como soberano de Israel.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: para todo o sempre
  rationale: A expressão portuguesa comunica de forma natural a duração contínua e intensificada da realeza divina indicada pelo grego, literalmente «para a eternidade e ainda».
theological_decisions:
- issue: Força do infinitivo inicial ταχύναι
  choice: 'Desejo ou súplica: «Que Deus apresse...»'
  alternative: Uma formulação infinitiva mais literal, «Deus apressar...», ou uma declaração, «Deus apressa...»
  rationale: O infinitivo independente no início é melhor entendido como exclamativo ou volitivo. A formulação escolhida preserva o tom de oração sem convertê-lo em afirmação indicativa.
- issue: Relação do genitivo em ἀκαθαρσίας ἐχθρῶν βεβήλων
  choice: «da impureza de inimigos profanos»
  alternative: «da contaminação causada por inimigos ímpios»
  rationale: A construção grega permite entender a impureza como pertencente aos inimigos ou como procedente deles. A tradução mantém a relação genitiva sem determinar explicitamente a causalidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva a urgência da abertura, a confiança do futuro e a possível ambiguidade da relação genitiva, evitando explicitar que os inimigos causam a impureza.
