  text: And they did not glorify your honored name[a]; in splendor they set up a kingdom because of their arrogance,
translation:
  language: pt
  text: E não glorificaram o teu nome, digno de honra; em glória, estabeleceram um reino em lugar da sua própria exaltação[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: «por causa da sua arrogância». A expressão grega também pode ser entendida em sentido causal, com «exaltação» no sentido de orgulho.'
    reason: Preserva em nota a leitura causal proposta, enquanto o texto principal conserva o sentido substitutivo mais direto de ἀντὶ ὕψους αὐτῶν.
lexical_decisions:
- source_word: οὐκ ἐδόξασαν
  choice: não glorificaram
  rationale: Preserva o sentido de atribuir glória ou honra e mantém a ligação verbal com δόξῃ na cláusula seguinte.
- source_word: τὸ ὄνομά σου τὸ ἔντιμον
  choice: o teu nome, digno de honra
  rationale: ἔντιμον descreve aquilo que é estimado ou honrado. A formulação é natural em português e evita que «nome honrado» sugira apenas boa reputação.
- source_word: ἐν δόξῃ
  choice: em esplendor
  rationale: Neste contexto político, δόξα pode indicar pompa, magnificência ou esplendor visível; «esplendor» evita atribuir glória divina ao reino estabelecido.
- source_word: ἔθεντο βασίλειον
  choice: estabeleceram um reino
  rationale: τίθημι tem aqui o sentido contextual de pôr em existência ou instituir, e βασίλειον pode designar um reino ou domínio régio.
- source_word: ἀντὶ ὕψους αὐτῶν
  choice: por causa da sua arrogância
  rationale: Lê ἀντί em sentido causal e ὕψος como elevação orgulhosa. Como a expressão grega é compacta e admite leitura mais literal, essa alternativa é registrada em nota.
theological_decisions:
- issue: Sentido de ἀντὶ ὕψους αὐτῶν
  choice: por causa da sua arrogância
  alternative: no lugar da sua própria exaltação
  rationale: A leitura principal produz sentido contextual claro para o estabelecimento de um reino ilegítimo, mas a construção grega também permite uma leitura substitutiva mais literal; a nota preserva essa ambiguidade sem impor uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal de leitura natural no Brasil e inteligível internacionalmente. A pontuação conserva as duas afirmações paralelas do grego.
