review_pass:
  verdict: revise
  source_fidelity: 'A primeira cláusula é fiel. Contudo, «por causa da sua arrogância» dá a ἀντὶ um valor causal que não é o seu sentido primário e converte ὕψος («elevação/exaltação») em «arrogância». A construção grega exprime mais diretamente substituição: «em lugar da sua própria exaltação».'
  naturalness: «E não glorificaram o teu nome, digno de honra» é claro e de registro apropriado. «Em glória» é natural no registro bíblico e conserva a correspondência lexical com δόξῃ; no contexto, não exige que se entenda glória divina.
  terminology: «Glorificaram», «nome, digno de honra», «estabeleceram um reino» e «exaltação» são escolhas compreensíveis, dignas e adequadas. A nota deve registrar a leitura causal como possibilidade, não apresentá-la como tradução principal.
  issues:
  - severity: medium
    issue: A tradução principal dá sentido causal a ἀντὶ ὕψους αὐτῶν.
    rationale: ἀντί com genitivo normalmente significa «em lugar de/em vez de». Embora se possa propor uma leitura contextual de ὕψος como orgulho e de ἀντί em sentido mais livre, «por causa da sua arrogância» não preserva de modo seguro a construção nem a ambiguidade do grego.
  - severity: low
    issue: A nota atual chama a leitura substitutiva de alternativa, embora seja a correspondência mais direta com o grego.
    rationale: A leitura literal-substitutiva deve figurar no texto, e a leitura causal deve ser mantida em nota como possibilidade interpretativa.
  revised_text: E não glorificaram o teu nome, digno de honra; em glória, estabeleceram um reino em lugar da sua própria exaltação[a],
  revised_footnotes:
