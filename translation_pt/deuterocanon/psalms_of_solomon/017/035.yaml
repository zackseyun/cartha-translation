lexical_decisions:
- source_word: δόξαν Κυρίου
  choice: a glória do Senhor
  rationale: “Glória” preserva o tom elevado e o campo semântico bíblico de δόξα; o genitivo Κυρίου é traduzido naturalmente como “do Senhor”.
- source_word: ἐδόξασεν αὐτήν
  choice: a glorificou
  rationale: A escolha mantém a repetição intencional entre δόξαν e ἐδόξασεν. O pronome feminino retoma a cidade, personificada no contexto.
- source_word: βασιλεὺς δίκαιος
  choice: um rei justo
  rationale: “Justo” é a forma corrente e biblicamente adequada para δίκαιος; o artigo indefinido torna natural em português o predicativo sem artigo no grego.
- source_word: διδακτὸς ὑπὸ θεοῦ
  choice: ensinado por Deus
  rationale: Tradução direta que conserva Deus como agente do ensino e evita transformar a expressão em um título técnico.
- source_word: ἐπ’ αὐτούς
  choice: sobre eles
  rationale: No contexto de realeza, a preposição com acusativo indica o âmbito sobre o qual o rei exerce governo.
theological_decisions:
- issue: Verbo implícito na segunda oração
  choice: ele mesmo será um rei justo
  alternative: ele mesmo, um rei justo ensinado por Deus, sobre eles
  rationale: A oração grega transmitida não contém verbo expresso. “Será” é suprido por clareza e corresponde ao contexto futuro, sem definir além disso a natureza da realeza.
- issue: Posição de “ensinado por Deus”
  choice: rei justo sobre eles, ensinado por Deus
  alternative: rei justo, ensinado por Deus, sobre eles
  rationale: A redação principal aproxima “sobre eles” da função régia para maior clareza em português; a nota conserva a ordem e a possível estrutura alternativa do grego.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. Conservou-se o jogo de palavras “glória/glorificou” e a personificação feminina da cidade. A pontuação mantém a continuidade sintática do fragmento com o contexto anterior.
