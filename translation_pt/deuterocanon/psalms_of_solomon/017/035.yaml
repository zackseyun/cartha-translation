translation:
  language: pt
  text: e ver a glória do Senhor com que Deus a glorificou[a]; e ele mesmo será um rei justo sobre eles, ensinado por Deus[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “a glória do Senhor com a qual Deus a glorificou”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “instruído por Deus”.'
    reason: lexical_alternative
