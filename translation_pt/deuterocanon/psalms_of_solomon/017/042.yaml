  yaml_path: translation/deuterocanon/psalms_of_solomon/017/042.yaml
  text: And he will not grow weak in his days in his God[a], because God has made him powerful in the Holy Spirit, and wise in the counsel of understanding[c][b], with strength and righteousness.
translation:
  language: pt
  text: 'E ele não enfraquecerá durante os seus dias, apoiando-se em seu Deus, porque Deus o tornou poderoso no Espírito Santo[a] e sábio em conselho prudente, com força e retidão[b].


    [a] Ou: “em espírito santo”; a expressão também pode indicar o meio: “pelo Espírito Santo”.


    [b] Ou: “justiça”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em espírito santo”; a expressão também pode indicar o meio: “pelo Espírito Santo”.'
    reason: Preserva a possível leitura qualitativa de πνεύματι ἁγίῳ e a ambiguidade entre esfera e instrumento em ἐν.
  - marker: b
    text: 'Ou: “justiça”.'
    reason: Registra uma nuance alternativa legítima de δικαιοσύνης.
lexical_decisions:
- source_word: ἀσθενήσει
  choice: não enfraquecerá
  rationale: Mantém o valor futuro e a ideia de perder força, sem sugerir necessariamente derrota ou fracasso completo.
- source_word: ἐν ταῖς ἡμέραις αὐτοῦ
  choice: durante os seus dias
  rationale: Expressa de modo natural em português a extensão temporal indicada pela preposição ἐν.
- source_word: ἐπὶ θεῷ αὐτοῦ
  choice: apoiado em seu Deus
  rationale: Com ἐπί e dativo, a frase sugere apoio ou dependência. A tradução comunica essa relação sem introduzir uma causalidade mais forte do que o grego exige.
- source_word: κατηργάσατο
  choice: o tornou
  rationale: Neste contexto, o verbo descreve o resultado da ação de Deus sobre ele. “O tornou” é claro e se liga naturalmente aos predicativos “poderoso” e “sábio”.
- source_word: δυνατὸν
  choice: poderoso
  rationale: Preserva a ideia de capacidade e poder, adequando-se ao retrato do governante no contexto.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: no Espírito Santo
  rationale: A expressão preposicional pode ser definida mesmo sem artigo em grego e, no contexto, pode aludir ao Espírito de Deus. A nota conserva as leituras qualitativa e instrumental.
- source_word: σοφὸν ἐν βουλῇ συνέσεως
  choice: sábio em conselho prudente
  rationale: 'Traduz o genitivo de qualidade de modo legível: trata-se de conselho caracterizado por entendimento ou discernimento.'
- source_word: ἰσχύος
  choice: força
  rationale: É o equivalente direto e natural para a ideia de vigor ou poder.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: “Justiça” abrange aqui a conduta justa e a retidão; a nota registra “retidão” como alternativa válida.
theological_decisions:
- issue: Se πνεύματι ἁγίῳ designa especificamente o Espírito Santo ou descreve um espírito santo, e se ἐν indica esfera ou meio
  choice: no Espírito Santo, com nota de ambiguidade
  alternative: em espírito santo; pelo Espírito Santo
  rationale: O objeto de uma preposição pode ser definido sem artigo em grego, e o contexto favorece uma referência ao Espírito de Deus. Contudo, a forma anártrica e o alcance de ἐν permitem leituras qualitativa e instrumental, que são preservadas em nota.
- issue: Sentido de δικαιοσύνης
  choice: justiça
  alternative: retidão
  rationale: O termo pode destacar tanto a justiça exercida quanto a qualidade moral da retidão; o texto principal usa o equivalente português mais abrangente e registra a alternativa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluência brasileira. “Apoiado em seu Deus” torna explícita de maneira moderada a noção de dependência de ἐπὶ θεῷ αὐτοῦ; “conselho prudente” evita o pouco natural “conselho de entendimento” sem perder o vínculo entre deliberação e discernimento.
