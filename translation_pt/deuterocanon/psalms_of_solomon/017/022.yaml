base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/022.yaml
  text: The king was in lawlessness[a], and the judge in disobedience[c][b], and the people in sin.
translation:
  language: pt
  text: O rei estava em transgressão da lei[a], o juiz em desobediência[b] e o povo em pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego não traz verbo expresso; “estava” foi acrescentado de acordo com o contexto passado.
    reason: grammar
  - marker: b
    text: Ou “rebeldia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεὺς
  choice: rei
  rationale: É o título político direto e usual no contexto; “governante” seria mais amplo do que o grego exige.
- source_word: ἐν
  choice: na/no
  rationale: A preposição repetida descreve a esfera ou condição de cada sujeito. As contrações portuguesas preservam essa estrutura e o paralelismo.
- source_word: παρανομίᾳ
  choice: transgressão da lei
  rationale: Conserva explicitamente a força jurídico-moral de παρανομία e soa mais clara em português atual do que “ilegalidade” neste contexto.
- source_word: κριτὴς
  choice: juiz
  rationale: É a tradução direta e natural do cargo indicado pelo grego.
- source_word: ἀπειθείᾳ
  choice: desobediência
  rationale: Expressa a recusa em obedecer sem restringir o termo ao sentido de incredulidade; “rebeldia” permanece uma alternativa possível.
- source_word: λαὸς
  choice: povo
  rationale: Reproduz naturalmente o sentido coletivo sem acrescentar uma ênfase geopolítica própria de “nação”.
- source_word: ἁμαρτίᾳ
  choice: pecado
  rationale: É a correspondência direta e preserva a concisão do terceiro membro da acusação.
theological_decisions:
- issue: Tempo do verbo suprido na oração nominal grega
  choice: 'passado: “vivia”'
  alternative: 'presente: “vive” ou “está”'
  rationale: O texto grego não contém verbo expresso, mas o contexto narrativo anterior situa a descrição no passado. “Vivia” comunica uma condição ou conduta continuada sem transformar a frase em máxima atemporal.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. “Vivia na transgressão da lei” evita o pouco natural “estava em ilegalidade” e mantém a ideia de uma condição persistente; o verbo suprido vale também para os dois membros seguintes.
