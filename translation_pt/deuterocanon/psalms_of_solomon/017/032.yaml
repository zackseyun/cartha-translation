base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/032.yaml
  text: And he will have peoples of the nations serve him under his yoke[d][c][b][a], and he will glorify the Lord in a place conspicuous to all the earth.
translation:
  language: pt
  text: E ele terá povos das nações para servi-lo sob o seu jugo,[a] e glorificará o Senhor num lugar visível a toda a terra.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “terá povos das nações como súditos sob o seu jugo”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “num lugar renomado em toda a terra”. A expressão grega pode destacar tanto a visibilidade quanto a distinção ou fama do lugar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕξει λαοὺς ἐθνῶν δουλεύειν
  choice: terá povos das nações para servi-lo
  rationale: A construção com ἕξει, objeto e infinitivo indica que ele terá povos para lhe prestar serviço. Mantém-se a ausência de artigo em λαούς e preservam-se separadamente as ideias de “povos” e “nações”, sem reduzi-las antecipadamente a “gentios”.
- source_word: ὑπὸ τὸν ζυγὸν αὐτοῦ
  choice: sob o seu jugo
  rationale: Conserva a metáfora concreta do jugo e sua conotação de sujeição, em linguagem portuguesa natural.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: É a tradução corrente e digna do título κύριος neste contexto religioso.
- source_word: δοξάσει
  choice: glorificará
  rationale: Reproduz diretamente o sentido de atribuir glória ou honra, preservando o peso teológico do verbo.
- source_word: ἐν ἐπισήμῳ πάσης τῆς γῆς
  choice: num lugar visível a toda a terra
  rationale: O adjetivo substantivado ἐπισήμῳ pode indicar um lugar conspícuo, destacado ou reconhecido. “Visível a toda a terra” comunica sua proeminência pública sem tratar o genitivo como comparação.
theological_decisions:
- issue: Relação dos povos com a figura régia
  choice: para servi-lo sob o seu jugo
  alternative: escravizados sob o seu jugo
  rationale: O texto expressa serviço e sujeição, mas não exige que δουλεύειν seja explicitado como escravidão. A imagem do jugo já preserva a tensão coercitiva sem intensificá-la além do grego.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe acessível a leitores brasileiros e amplamente compreensível no mundo lusófono. Conservam-se a metáfora do jugo e a relativa indeterminação do lugar mencionado.
