  text: καὶ ἕξει λαοὺς ἐθνῶν δουλεύειν αὐτῷ ὑπὸ τὸν ζυγὸν αὐτοῦ, καὶ τὸν κύριον δοξάσει ἐν ἐπισήμῳ πάσης τῆς γῆς.
