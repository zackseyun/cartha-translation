- from: E exalta-o com poder[a] para despedaçar governantes injustos.
  to: E exalta-o com força[a], para que ele despedace governantes injustos.
  rationale: A revisão substitui ‘com poder’ por ‘com força’, equivalente mais próximo de ἰσχύν, e torna explícito em português que o propósito de despedaçar os governantes injustos pertence àquele que é exaltado. Mantêm-se o imperativo ‘exalta-o’, a intensidade de θραῦσαι e a designação política-moral ‘governantes injustos’.
