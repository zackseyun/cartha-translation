  text: And exalt him in strength to shatter unjust rulers[a][b].
translation:
  language: pt
  text: E exalta-o com força[a], para que ele despedace governantes injustos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ergue-o com força” ou “exalta-o poderosamente”.'
    reason: A relação sintática de ἰσχὺν com o imperativo permite entendê-lo como força que acompanha a exaltação ou como expressão de modo.
lexical_decisions:
- source_word: ὑψώσον
  choice: exalta-o
  rationale: O imperativo de ὑψόω expressa elevar ou exaltar. “Exalta-o” preserva essa força vertical e honorífica sem substituir o verbo pela imagem diferente de “cingir”.
- source_word: ἰσχὺν
  choice: com poder
  rationale: O acusativo tem valor de modo ou circunstância. “Com poder” é natural em português e mantém aberta a possibilidade de que a exaltação seja poderosa ou acompanhada de capacitação.
- source_word: τοῦ θραῦσαι
  choice: para despedaçar
  rationale: A construção com infinitivo exprime finalidade. “Despedaçar” conserva a intensidade destrutiva de θραύω.
- source_word: ἄρχοντας
  choice: governantes
  rationale: O termo designa pessoas que exercem autoridade; “governantes” comunica claramente o sentido político amplo.
- source_word: ἀδίκους
  choice: injustos
  rationale: O adjetivo caracteriza esses governantes pela injustiça moral e pública, sem ampliar o sentido para uma descrição geral como “perversos”.
theological_decisions:
- issue: A ação divina de elevar ou fortalecer a figura esperada
  choice: exalta-o com poder
  alternative: cinge-o de força
  rationale: A tradução segue o texto grego fornecido e validado, ὑψώσον, preservando a elevação da figura sem introduzir a metáfora de cingir, que exigiria outra forma verbal.
translation_notes:
  register: Português moderno, digno e direto, com boa legibilidade brasileira. “Exalta-o” conserva o tom elevado do verso; “despedaçar” mantém sua linguagem vigorosa.
