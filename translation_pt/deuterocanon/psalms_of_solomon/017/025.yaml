  yaml_path: translation/deuterocanon/psalms_of_solomon/017/025.yaml
  text: In wisdom and righteousness[c][b][a], cleanse Jerusalem from nations trampling her in destruction.
translation:
  language: pt
  text: Com sabedoria e justiça[a], purifica Jerusalém das nações[b] que a pisoteiam até a ruína.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retidão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “gentios”.
    reason: lexical_alternative
  - marker: c
    text: 'A ordem grega também pode ser representada assim: “Purifica Jerusalém das nações que a pisoteiam até a ruína, com sabedoria e justiça”. As expressões finais se ligam mais naturalmente ao pedido para que Jerusalém seja purificada, embora a construção grega seja compacta.'
    reason: source_ambiguity
lexical_decisions:
- source_word: καθάρισον
  choice: purifica
  rationale: O imperativo aoristo pede uma ação decisiva. “Purifica” conserva tanto a ideia de remover impureza quanto, neste contexto cívico, a de livrar Jerusalém de quem a oprime.
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἐθνῶν
  choice: nações
  rationale: O termo designa aqui povos estrangeiros que oprimem Jerusalém. “Nações” preserva a amplitude lexical sem impor um contraste técnico entre judeus e gentios.
- source_word: καταπατούντων
  choice: que a pisoteiam
  rationale: O particípio expressa dominação hostil e humilhante. “Pisoteiam” é vívido, natural e mantém a força da imagem grega.
- source_word: ἐν ἀπωλείᾳ
  choice: até a ruína
  rationale: A expressão indica o efeito destrutivo do pisoteamento. “Até a ruína” comunica resultado sem especificar além do grego se a ruína é destruição, devastação ou perdição.
- source_word: ἐν σοφίᾳ
  choice: com sabedoria
  rationale: Em português, “com sabedoria” expressa naturalmente o modo ou meio da ação pedida, preservando o conteúdo da preposição grega.
- source_word: ἐν δικαιοσύνῃ
  choice: com justiça
  rationale: “Justiça” é natural no contexto de libertação e juízo e forma um par fluente com “sabedoria”; “retidão” continua sendo alternativa lexical legítima.
theological_decisions:
- issue: Se ἐθνῶν deve ser entendido como “nações” ou “gentios”.
  choice: nações
  alternative: gentios
  rationale: O contexto imediato fala de povos estrangeiros opressores. “Nações” mantém essa referência sem introduzir uma distinção étnico-religiosa mais técnica do que o verso exige.
- issue: A que se ligam ἐν σοφίᾳ e ἐν δικαιοσύνῃ.
  choice: As expressões são ligadas ao imperativo “purifica”, indicando o modo da ação solicitada.
  alternative: Podem ser entendidas como o padrão segundo o qual as nações são julgadas e removidas; pela ordem grega, sua ligação sintática permanece compacta e não inteiramente explícita.
  rationale: A colocação inicial em português evita a leitura involuntária de que as nações pisoteiam Jerusalém com sabedoria e justiça, sem eliminar em nota a compactação e a possível tensão sintática do grego.
- issue: O sentido de ἐν ἀπωλείᾳ no pisoteamento.
  choice: até a ruína
  alternative: em destruição
  rationale: A formulação escolhida comunica de modo idiomático o resultado devastador da opressão, sem decidir se ἀπώλεια deve ser entendido como destruição total, devastação ou perdição.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismos marcados. A anteposição de “Com sabedoria e justiça” esclarece sua ligação principal com “purifica”; a nota preserva a ordem e a compactação do grego.
