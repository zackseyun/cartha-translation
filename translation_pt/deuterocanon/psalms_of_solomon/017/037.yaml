base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/037.yaml
  text: For he will not put his hope in horse and rider and bow[a], nor will he multiply gold or silver for himself for war[b], nor will he gather hopes from many for the day of battle.
translation:
  language: pt
  text: Pois ele não porá sua esperança em cavalo, cavaleiro e arco, nem acumulará para si ouro ou prata para a guerra, nem reunirá esperanças com muitos para o dia da guerra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “nem reunirá esperanças com muitos para o dia da guerra”. A expressão grega é condensada e pode indicar a confiança em grande número de pessoas ou em uma força numerosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπιεῖ ἐπὶ
  choice: porá sua esperança em
  rationale: Preserva o sentido básico de esperar e, ao mesmo tempo, expressa naturalmente a ideia contextual de apoiar-se ou confiar em recursos militares.
- source_word: ἵππον καὶ ἀναβάτην καὶ τόξον
  choice: cavalo, cavaleiro ou arco
  rationale: Mantém as três imagens militares concretas; em português, sob uma negação, “ou” comunica com naturalidade que nenhum desses recursos será objeto de esperança.
- source_word: πληθυνεῖ αὐτῷ
  choice: acumulará para si
  rationale: O verbo indica aumentar ou tornar numeroso; “acumulará” é idiomático para metais preciosos, e “para si” representa o dativo αὐτῷ.
- source_word: χρυσίον οὐδὲ ἀργύριον
  choice: ouro ou prata
  rationale: Conserva os metais mencionados explicitamente e representa o valor disjuntivo de οὐδὲ no âmbito da oração negativa.
- source_word: πολλοῖς ... συνάξει ἐλπίδας
  choice: reunirá esperanças com muitos
  rationale: Mantém a imagem incomum de “reunir esperanças” e deixa visível a formulação comprimida do dativo πολλοῖς, sem limitar “muitos” de modo explícito a soldados, aliados ou tropas.
- source_word: ἡμέραν πολέμου
  choice: o dia da batalha
  rationale: Expressão portuguesa natural que preserva o cenário militar concreto do grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leve preservação da imagem incomum do original em “reunirá esperanças”. A nota registra a ambiguidade de πολλοῖς sem resolver se se trata especificamente de soldados, aliados ou uma grande força.
