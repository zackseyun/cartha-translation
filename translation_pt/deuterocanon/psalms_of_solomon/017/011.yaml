  yaml_path: translation/deuterocanon/psalms_of_solomon/017/011.yaml
  text: God did not have mercy on them[b][a]. He searched out their offspring and did not leave one of them.
translation:
  language: pt
  text: Deus não teve misericórdia deles. Examinou a descendência deles[a] e não deixou nenhum deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «semente» ou «posteridade».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλέησεν
  choice: teve misericórdia
  rationale: Traduz diretamente o sentido de ἐλεέω e preserva a linguagem explícita de misericórdia, sem a confundir com o verbo grego específico para «poupar».
- source_word: ἐξερεύνησεν
  choice: examinou
  rationale: Expressa uma busca minuciosa e completa em português natural; no contexto, indica que Deus perscrutou toda a descendência.
- source_word: σπέρμα
  choice: descendência
  rationale: Neste contexto, refere-se à posteridade, não à semente literal. «Descendência» é clara, corrente e mantém o sentido familiar e coletivo.
- source_word: οὐκ ἀφῆκεν αὐτῶν ἕνα
  choice: não deixou nenhum deles
  rationale: Conserva a estrutura e a força totalizante da expressão grega, indicando que nem um sequer foi deixado.
theological_decisions:
- issue: Distinção entre misericórdia e poupar
  choice: não teve misericórdia deles
  alternative: não os poupou
  rationale: O grego emprega ἐλεέω, «ter/mostrar misericórdia», enquanto «não os poupou» poderia apagar essa noção e confundi-la com φείδομαι, verbo distinto usado no contexto próximo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «deles» acompanha as relações pronominais do grego e evita tornar explícito além do texto quem constitui a descendência.
