lexical_decisions:
- source_word: εὐλογήσει
  choice: abençoará
  rationale: O futuro ativo de εὐλογέω indica que ele concederá bênção ao povo; “abençoará” é a equivalência portuguesa direta e natural.
- source_word: λαὸν Κυρίου
  choice: o povo do Senhor
  rationale: λαός designa aqui o povo como comunidade pertencente ao Senhor, e o genitivo Κυρίου exprime essa relação.
- source_word: ἐν σοφίᾳ
  choice: com sabedoria
  rationale: ἐν pode indicar modo ou esfera. “Com sabedoria” é idiomático em português e mantém a ideia de uma ação realizada sabiamente, sem excluir a leitura mais literal “em sabedoria”.
- source_word: μετʼ εὐφροσύνης
  choice: com alegria
  rationale: μετά com o genitivo indica acompanhamento, enquanto εὐφροσύνη comunica alegria, júbilo ou regozijo. “Com alegria” é claro, atual e digno.
