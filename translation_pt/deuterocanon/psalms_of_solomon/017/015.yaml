    rationale: O grego apresenta o agir do inimigo «em» alteridade/estrangeiridade, não meramente um comportamento semelhante ao de um estrangeiro. «Em sua condição de estrangeiro» torna a relação mais explícita e fiel.
  revised_text: Em sua condição de estrangeiro[a], o inimigo agiu com arrogância; e seu coração era alheio ao nosso Deus[b].
