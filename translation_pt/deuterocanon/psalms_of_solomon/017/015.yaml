  yaml_path: translation/deuterocanon/psalms_of_solomon/017/015.yaml
  text: The enemy acted in estrangement[a], in pride[c][b]; and his heart was estranged from our God.
translation:
  language: pt
  text: Em sua condição de estrangeiro[a], o inimigo agiu com arrogância; e seu coração era alheio ao nosso Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em afastamento” ou “em alheamento”.
    reason: lexical_alternative
  - marker: b
    text: Ou “seu coração estava afastado do nosso Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἀλλοτριότητι
  choice: como estrangeiro
  rationale: A expressão indica condição de alteridade ou estrangeiridade. No contexto, “como estrangeiro” é natural em português e evita sugerir necessariamente o rompimento de uma relação anterior, embora a alternativa relacional permaneça registrada em nota.
- source_word: ὁ ἐχθρός
  choice: o inimigo
  rationale: Equivalente direto, claro e corrente do substantivo grego.
- source_word: ἐποίησεν
  choice: agiu
  rationale: O verbo aparece sem objeto expresso; “agiu” comunica conduta sem acrescentar uma ação específica.
- source_word: ἐν ὑπερηφανίᾳ
  choice: com arrogância
  rationale: Expressa a soberba altiva e moralmente negativa indicada pelo substantivo grego, em linguagem portuguesa natural.
- source_word: ἡ καρδία αὐτοῦ
  choice: seu coração
  rationale: Mantém a imagem bíblica do coração como centro da disposição interior.
- source_word: ἀλλοτρία ἀπὸ τοῦ θεοῦ ἡμῶν
  choice: era alheio ao nosso Deus
  rationale: “Alheio” conserva a noção de não pertencimento ou distância em relação a Deus e mantém a ligação lexical com a estrangeiridade da primeira oração.
theological_decisions:
- issue: A alteridade do inimigo pode indicar estrangeiridade étnica/política ou afastamento relacional.
  choice: como estrangeiro / alheio
  alternative: em afastamento / afastado
  rationale: A redação principal favorece a estrangeiridade sugerida pelo contexto histórico e pelo campo semântico de ἀλλότριος, sem transformar a expressão em uma afirmação explícita sobre etnia; a nota preserva a leitura relacional possível.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe concisa. “Como estrangeiro” e “alheio” reproduzem a recorrência do campo lexical grego sem recorrer ao termo técnico “alienação”.
