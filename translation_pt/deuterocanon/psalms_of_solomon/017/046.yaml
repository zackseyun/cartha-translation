  text: With equity he will lead them all[b][a], and there will be no arrogance among them to oppress one another.
translation:
  language: pt
  text: Com equidade, ele conduzirá todos eles, e não haverá entre eles arrogância que resulte em alguém ser oprimido entre eles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, de modo pouco idiomático: “e não haverá entre eles arrogância de ser oprimido entre eles”. O infinitivo grego é passivo, e a construção é difícil. No contexto, também pode ser entendido em sentido ativo: “não haverá entre eles arrogância para oprimir outros”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἰσότητι
  choice: com equidade
  rationale: ἰσότης pode indicar igualdade ou tratamento imparcial. No contexto do governo do rei, “com equidade” expressa justiça imparcial de modo natural e digno.
- source_word: πάντας αὐτοὺς
  choice: todos eles
  rationale: Preserva a força abrangente e enfática da expressão grega.
- source_word: ἄξει
  choice: ele conduzirá
  rationale: ἄγω significa normalmente “conduzir” ou “guiar”. “Conduzirá” mantém tanto a ideia de liderança quanto a possível imagem pastoral do contexto.
- source_word: ὑπερηφανία
  choice: arrogância
  rationale: O termo designa orgulho altivo e dominador; “arrogância” comunica claramente essa atitude socialmente opressiva.
- source_word: τοῦ καταδυναστευθῆναι
  choice: que resulte em alguém ser oprimido
  rationale: O infinitivo é formalmente passivo e pode expressar resultado. A formulação conserva essa voz passiva e torna inteligível a relação difícil com “arrogância”, sem ocultar a incerteza sintática.
- source_word: ἐν αὐτοῖς
  choice: entre eles / no meio deles
  rationale: As duas ocorrências situam tanto a arrogância quanto a opressão dentro da comunidade. A variação em português evita uma repetição excessivamente dura sem eliminar nenhum elemento.
theological_decisions:
- issue: Caráter social do governo do rei
  choice: A liderança equitativa exclui a arrogância que resulta na opressão de alguém dentro da comunidade.
  alternative: 'Entender a frase final em sentido ativo: ninguém agirá com arrogância para oprimir outro.'
  rationale: A tradução mantém a visão ética e social do texto, mas preserva na linha principal a forma passiva de καταδυναστευθῆναι, sem impor uma solução denominacional ou ideológica.
- issue: Dificuldade da construção τοῦ καταδυναστευθῆναι
  choice: 'Manter o sentido passivo: “alguém ser oprimido”.'
  alternative: 'Traduzir pelo sentido contextual ativo: “oprimir uns aos outros”.'
  rationale: Embora o sentido ativo seja contextual e idiomaticamente possível, o grego transmitido contém um infinitivo passivo. A nota registra a dificuldade e a alternativa sem apagar a tensão textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a repetição locativa do grego de maneira suavizada e mantém na linha principal a voz passiva, cuja dificuldade é explicada em nota.
