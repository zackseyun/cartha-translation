  naturalness: “Que resulte em alguém ser oprimido” é compreensível e mantém a cautela exigida pela sintaxe difícil. “Entre eles” é mais natural e mais próximo da repetição locativa grega do que “no meio deles”. A formulação literal da nota deve ser explicitamente identificada como pouco idiomática em português.
  terminology: “Equidade”, “conduzirá” e “arrogância” são escolhas modernas, claras e apropriadas ao registro. A alternativa ativa na nota deve permanecer claramente como leitura contextual, não como resolução do texto grego.
