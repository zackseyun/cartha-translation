base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/041.yaml
  text: And he himself will be pure from sin[a], to rule great peoples, to rebuke rulers[c][b], and to remove sinners by the strength of his word.
translation:
  language: pt
  text: E ele próprio será[a] puro de pecado[b], para governar grandes povos, repreender governantes e afastar os pecadores[c] pela força de sua palavra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego não traz um verbo explícito nesta oração; “será” é suprido conforme o contexto futuro.
    reason: grammatical_ambiguity
  - marker: b
    text: 'Ou: “puro, sem pecado”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “remover os pecadores”; possivelmente, “eliminar os pecadores”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθαρὸς ἀπὸ ἁμαρτίας
  choice: puro de pecado
  rationale: Preserva a imagem grega de pureza moral expressa por καθαρός e a ideia de separação indicada por ἀπό, sem reduzir a expressão a uma formulação doutrinária posterior.
- source_word: ἄρχειν
  choice: governar
  rationale: Comunica de modo natural o exercício de autoridade sobre povos, mantendo o sentido régio do contexto.
- source_word: λαοὺς μεγάλους
  choice: grandes povos
  rationale: Mantém tanto o plural de λαοί quanto o adjetivo μεγάλους, sem substituir 'povos' por 'nações'.
- source_word: ἐλέγξαι
  choice: repreender
  rationale: Expressa censura autoritativa e é claro no contexto de uma figura que julga governantes.
- source_word: ἄρχοντας
  choice: governantes
  rationale: Designa pessoas que exercem autoridade, sem restringir o termo a uma categoria política específica.
- source_word: ἐξᾶραι
  choice: afastar
  rationale: Conserva a noção ampla de remover ou tirar do meio sem afirmar necessariamente execução ou destruição.
- source_word: ἐν ἰσχύϊ λόγου
  choice: pela força de sua palavra
  rationale: Reproduz a força eficaz exercida por meio da palavra; o possessivo explicita naturalmente em português que se trata da palavra do sujeito.
theological_decisions:
- issue: Pureza moral da figura régia
  choice: puro de pecado
  alternative: sem pecado
  rationale: A escolha mantém a metáfora lexical de καθαρός e afirma a pureza moral do personagem sem desenvolver além do que o texto diz.
- issue: Alcance de ἐξᾶραι contra os pecadores
  choice: afastar os pecadores
  alternative: eliminar os pecadores
  rationale: O verbo pode indicar remoção e, em certos contextos, eliminação; a tradução principal preserva esse alcance sem decidir que se trata necessariamente de destruição física.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Ele próprio” dá a ênfase de καὶ αὐτός; os infinitivos são apresentados como finalidade, e a formulação evita especificar além do grego o modo pelo qual os pecadores são removidos.
