translation:
  language: pt
  text: para destruir as nações sem lei com a palavra de sua boca, para fazer as nações fugirem de diante dele por sua ameaça e para declarar culpados os pecadores pela palavra do coração deles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega é condensada. Também pode ser entendida como “convencer os pecadores de sua culpa pelo que diz o coração deles” ou “expor os pecadores pela palavra do coração deles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλοθρεῦσαι
  choice: destruir
  rationale: Conserva a força do infinitivo aoristo e a ideia de juízo, sem intensificá-la para “aniquilar”.
- source_word: ἔθνη παράνομα
  choice: as nações transgressoras da Lei
  rationale: “Nações” representa ἔθνη sem o sentido técnico posterior de “gentios”; “transgressoras da Lei” preserva de modo claro a relação de παράνομα com νόμος.
- source_word: ἐν λόγῳ στόματος αὐτοῦ
  choice: com a palavra de sua boca
  rationale: Mantém a imagem concreta de um juízo realizado pela palavra pronunciada.
- source_word: ἐν ἀπειλῇ αὐτοῦ
  choice: com a sua ameaça
  rationale: Expressa o valor instrumental de ἐν e conserva a severidade de ἀπειλή.
- source_word: φυγεῖν ἔθνη ἀπὸ προσώπου αὐτοῦ
  choice: fazer as nações fugirem de diante dele
  rationale: A formulação causativa é natural em português no encadeamento das ações, enquanto “de diante dele” preserva a expressão bíblica ligada à presença ou face.
- source_word: ἐλέγξαι
  choice: declarar culpados
  rationale: Representa o valor judicial de provar ou estabelecer a culpa no contexto, sem restringir o verbo ao ato de repreender nem reduzi-lo a apenas expor.
- source_word: ἐν λόγῳ καρδίας αὐτῶν
  choice: pela palavra do coração deles
  rationale: Preserva a formulação grega comprimida, inclusive o singular distributivo καρδίας, e não resolve indevidamente se a palavra interior serve como meio, evidência ou esfera da condenação.
theological_decisions:
- issue: Juízo messiânico efetuado pela fala
  choice: A tradução conserva boca, palavra e ameaça como os meios apresentados no texto.
  alternative: Entender toda a linguagem apenas como símbolo geral de autoridade soberana.
  rationale: O grego destaca explicitamente a eficácia judicial da fala, mas não explica seu mecanismo nem autoriza acrescentar elaboração doutrinária posterior.
- issue: Sentido da palavra do coração dos pecadores
  choice: Manter a expressão ambígua “pela palavra do coração deles”.
  alternative: Explicitar como “pelo que dizem em seu coração” ou “por suas intenções interiores”.
  rationale: A construção grega é condensada e pode indicar fala interior, intenção ou evidência procedente do próprio coração; a tradução não deve escolher silenciosamente apenas uma dessas leituras.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A coordenação dos três infinitivos foi preservada. “Transgressoras da Lei” esclarece a força moral e legal de παράνομα; “declarar culpados” comunica o valor judicial de ἐλέγξαι. A nota mantém aberta a ambiguidade da cláusula final.
