  text: Look, Lord, and raise up for them their king, Look, Lord, and raise up for them their king, the son of David, at the time you chose, O God, for him to reign over Israel your servant., at the time Look, Lord, and raise up for them their king, a son of David, at the time you chose, O God, for him to reign over Israel your servant., O God, for him to reign over Israel your servant.
translation:
  language: pt
  text: Vê, Senhor, e levanta para eles o rei deles, um filho de Davi, no tempo que tu determinaste,[a] ó Deus, para reinar sobre Israel, teu servo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “no tempo que tu viste”. Aqui, “ver” pode ter o sentido de reconhecer, escolher ou determinar o momento apropriado.
    reason: Registra a forma incomum e potencialmente significativa de ὃν ἴδες sem tornar o texto principal pouco natural.
  - marker: b
    text: Ou seja, Israel é chamado de servo de Deus. A palavra grega παῖς também pode significar “filho” ou “criança”, mas neste contexto designa Israel como servo.
    reason: παῖδά σου está em aposição a Ἰσραήλ (“Israel”), e não se refere ao rei.
lexical_decisions:
- source_word: ἴδε
  choice: Olha
  rationale: Preserva o imperativo direto e urgente dirigido ao Senhor, em linguagem portuguesa corrente.
- source_word: ἀνάστησον
  choice: levanta
  rationale: Mantém a imagem de Deus suscitar ou fazer surgir o rei, sem reduzir o verbo a uma simples nomeação política.
- source_word: υἱὸν Δαυίδ
  choice: um filho de Davi
  rationale: O grego não traz artigo nessa aposição; a formulação identifica o rei como descendente davídico sem impor uma definitude ausente da expressão.
- source_word: εἰς τὸν καιρὸν ὃν ἴδες σύ
  choice: no tempo que tu determinaste
  rationale: O sentido contextual é o tempo reconhecido ou escolhido por Deus; a nota registra a imagem literal do verbo 'ver'.
- source_word: παῖδά σου
  choice: o teu servo
  rationale: No contexto do reinado sobre Israel, 'servo' é a leitura mais natural do termo polissêmico παῖς, preservando a relação de submissão do rei a Deus.
theological_decisions:
- issue: Identidade davídica do rei esperado
  choice: um filho de Davi
  alternative: o Filho de Davi
  rationale: Evita transformar a expressão, por capitalização ou artigo definido acrescentado, em um título cristológico técnico que o grego deste verso não explicita.
- issue: Referente de παῖδά σου
  choice: o teu servo, isto é, o rei levantado por Deus
  alternative: teu filho ou Israel, teu servo
  rationale: A construção acusativo mais infinitivo liga naturalmente παῖδά σου ao sujeito de βασιλεῦσαι; ainda assim, a polissemia lexical é indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção direta e cadência de oração. Emprega “tu” de modo coerente com a invocação poética e evita capitalização interpretativa de títulos.
