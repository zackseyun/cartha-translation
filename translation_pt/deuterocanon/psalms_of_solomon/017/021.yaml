  text: πηγαὶ συνεσχέθησαν αἰώνιοι ἐξ ἀβύσσων, ἀπὸ ὀρέων ὑψηλῶν. ὅτι οὐκ ἦν ἐν αὐτοῖς ποιῶν δικαιοσύνην καὶ κρίμα· ἀπὸ ἄρχοντος αὐτῶν καὶ λαοῦ ἐλαχίστου ἐν πάσῃ ἁμαρτίᾳ.
