base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/021.yaml
  text: The everlasting springs from the depths[a], from the lofty mountains, were restrained, because there was no one among them doing righteousness and justice; from their ruler to the least of the people[b], all were in every kind of sin.
translation:
  language: pt
  text: As fontes eternas[a], provenientes das profundezas e dos montes elevados, foram contidas, porque entre eles não havia quem praticasse a justiça e o juízo; desde o governante deles até o menor do povo, todos estavam envolvidos em toda espécie de pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fontes antigas” ou “fontes de longa duração”.'
    reason: αἰώνιοι pode indicar duração contínua, antiguidade ou permanência; “eternas” preserva o tom poético, mas não elimina essas nuances.
lexical_decisions:
- source_word: πηγαὶ
  choice: fontes
  rationale: Designa nascentes ou fontes naturais de água; “fontes” preserva a imagem poética e é claro em português.
- source_word: συνεσχέθησαν
  choice: foram contidas
  rationale: O passivo indica que as fontes foram detidas ou impedidas de fluir, sem especificar o mecanismo.
- source_word: αἰώνιοι
  choice: eternas
  rationale: Mantém o tom elevado e a força duradoura de αἰώνιοι, sem introduzir o registro técnico moderno de “perenes”; a possível acepção temporal alternativa é registrada em nota.
- source_word: ἐξ ἀβύσσων
  choice: provenientes das profundezas
  rationale: “Profundezas” conserva a imagem dos lugares profundos; “provenientes” deixa claro que a expressão indica a origem das fontes, não aquilo de que elas foram impedidas.
- source_word: ἀπὸ ὀρέων ὑψηλῶν
  choice: dos montes elevados
  rationale: Reproduz a descrição geográfica em linguagem poética natural.
- source_word: ποιῶν δικαιοσύνην καὶ κρίμα
  choice: praticasse a justiça e o juízo
  rationale: Preserva a ação moral expressa pelo particípio e mantém distintos os termos ético e judicial do par grego.
- source_word: ἄρχοντος αὐτῶν
  choice: o governante deles
  rationale: “Governante” é amplo e adequado ao contraste hierárquico com o menor do povo.
- source_word: λαοῦ ἐλαχίστου
  choice: o menor do povo
  rationale: Expressa o extremo inferior da escala social sem transformar o termo em julgamento moral.
- source_word: ἐν πάσῃ ἁμαρτίᾳ
  choice: envolvidos em toda espécie de pecado
  rationale: Comunica a abrangência da expressão grega em português idiomático; “envolvidos” explicita a construção elíptica do original sem acrescentar uma categoria de pecado.
theological_decisions:
- issue: Distinção entre δικαιοσύνη e κρίμα em um texto judaico não paulino
  choice: a justiça e o juízo
  alternative: a retidão e a justiça
  rationale: A tradução mantém o par ético-jurídico sem fundir os dois termos. “Juízo” conserva mais diretamente o valor judicial de κρίμα, enquanto “justiça” comunica naturalmente δικαιοσύνη neste contexto.
- issue: Abrangência da condenação social
  choice: desde o governante deles até o menor do povo, todos
  alternative: do governante deles e do menor do povo
  rationale: A formulação entende a expressão elíptica como abrangendo toda a escala social, de acordo com o contraste entre o governante e o menor, sem limitar a acusação apenas a dois indivíduos.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. A ordem foi ajustada para que “das profundezas e dos montes elevados” indique inequivocamente a origem das fontes. O segmento final, elíptico em grego, foi completado com “todos estavam envolvidos” para produzir uma frase natural sem atenuar a acusação abrangente.
