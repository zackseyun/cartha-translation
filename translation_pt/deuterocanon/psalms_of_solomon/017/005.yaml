base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/005.yaml
  text: You[a], Lord, chose David as king over Israel, and you swore to him concerning his offspring forever[b], that his kingdom would not fail before you.
translation:
  language: pt
  text: 'Tu, Senhor, escolheste Davi como rei sobre Israel, e tu lhe juraste a respeito de sua descendência[a] para sempre: o reino dele não deixaria de existir diante de ti.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “semente”, isto é, seus descendentes.
    reason: lexical_alternative
  - marker: b
    text: Ou “a dinastia dele não cessaria diante de ti”.
    reason: alternative_reading
lexical_decisions:
- source_word: σύ ... καὶ σύ
  choice: Tu ... e tu
  rationale: Preserva a repetição enfática do pronome grego e mantém a oração como discurso direto dirigido a Deus.
- source_word: Κύριε
  choice: Senhor
  rationale: É a forma consagrada, natural e adequada para a invocação direta a Deus.
- source_word: ᾑρέτισω
  choice: escolheste
  rationale: Expressa a eleição de Davi por Deus sem acrescentar a ideia de uma cerimônia formal de nomeação.
- source_word: βασιλέα ἐπʼ Ἰσραήλ
  choice: como rei sobre Israel
  rationale: Reproduz com clareza a função real de Davi e sua autoridade sobre Israel.
- source_word: περὶ τοῦ σπέρματος
  choice: a respeito de sua descendência
  rationale: No contexto da promessa davídica, σπέρμα indica a linhagem ou os descendentes de Davi; a alternativa literal é registrada em nota.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: Comunica naturalmente a duração permanente expressa pela fórmula grega no contexto da promessa.
- source_word: τοῦ μὴ ἐκλείπειν
  choice: não deixaria de existir
  rationale: Exprime a ideia de não cessar ou desaparecer, com linguagem corrente e sem restringir o sentido à falha moral ou política.
- source_word: ἀπέναντί σου
  choice: diante de ti
  rationale: Mantém a relação do reino com a presença e a consideração de Deus.
- source_word: βασίλειον αὐτοῦ
  choice: o reino dele
  rationale: Permanece próximo do substantivo grego e evita decidir silenciosamente entre reino, realeza e dinastia; o sentido dinástico possível aparece em nota.
theological_decisions:
- issue: Linguagem da promessa davídica
  choice: A promessa une a descendência de Davi à continuidade de seu reino diante de Deus.
  alternative: A dinastia de Davi não cessaria diante de Deus.
  rationale: O grego combina σπέρμα, que aponta para a linhagem, com βασίλειον, que pode denotar reino ou domínio real. O texto principal conserva essa combinação sem converter explicitamente o reino em dinastia.
- issue: Força de εἰς τὸν αἰῶνα
  choice: para sempre
  alternative: pela era / por todo o tempo
  rationale: A expressão tem força duradoura no contexto pactual; a tradução não explica de que modo a permanência da promessa se realiza.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa coerentes com a invocação direta (“Tu”, “ti”). A repetição de “tu” reflete a ênfase do grego. “O reino dele” evita a possível ambiguidade de “seu reino” quanto ao referente.
