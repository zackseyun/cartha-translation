lexical_decisions:
- source_word: καθαριεῖ
  choice: purificará
  rationale: O verbo significa tornar limpo ou puro. «Purificará» é natural no contexto religioso e preserva a ideia de remoção da impureza.
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Forma consagrada do nome próprio em português.
- source_word: ἐν ἁγιασμῷ
  choice: em santidade
  rationale: Mantém a construção grega e preserva sem resolver a possível nuance de esfera, condição ou meio; «santificação» seria mais técnica.
- source_word: ὡς καὶ τὸ ἀπ’ ἀρχῆς
  choice: como desde o princípio
  rationale: Reproduz de modo conciso a comparação temporal, deixando a elipse perceptível em português e evitando acrescentar um referente não expresso.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe próxima do grego. «Em santidade» conserva a ambiguidade da preposição, e a segunda oração mantém a formulação elíptica, esclarecida em nota.
