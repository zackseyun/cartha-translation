  source_fidelity: A tradução de καθαριεῖ por «purificará», de Ἰερουσαλήμ por «Jerusalém» e de ἐν ἁγιασμῷ por «em santidade» é fiel e preserva adequadamente o registro cultual e a ambiguidade da construção preposicional. Contudo, «como desde o princípio» não forma em português uma comparação completa e deixa de veicular de modo inteligível a elipse grega.
