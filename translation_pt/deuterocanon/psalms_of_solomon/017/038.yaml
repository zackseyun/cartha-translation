base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/038.yaml
  text: The Lord himself is their king[a], the hope of the mighty one in God[d][c][b]; and he will have mercy on all the nations before him in fear.
translation:
  language: pt
  text: O próprio Senhor é o rei deles[a]; a esperança do poderoso é esperança em Deus[b], e ele terá misericórdia de todas as nações diante dele, com temor[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns testemunhos trazem “o rei dele” em vez de “o rei deles”, o que relacionaria mais diretamente esta linha à submissão do governante davídico ao Senhor.
    reason: textual_variant
  - marker: b
    text: 'A expressão grega traduzida por “a esperança do poderoso é esperança em Deus” é difícil e parece ter sido transmitida de forma irregular ou incerta. Também pode ser entendida como uma expressão ligada à frase anterior: “o rei deles, a esperança do poderoso em Deus”.'
    reason: textual_variant
  - marker: c
    text: Ou “diante dele, com reverência”; aqui, “temor” pode indicar tanto medo quanto reverência.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριος αὐτός
  choice: o próprio Senhor
  rationale: Mantém a ênfase do pronome αὐτός e traduz Κύριος pelo título divino tradicional e natural em português.
- source_word: βασιλεὺς αὐτῶν
  choice: o rei deles
  rationale: Segue o pronome plural do texto-base de Swete e evita a ambiguidade que “seu rei” teria em português.
- source_word: ἐλπὶς
  choice: esperança
  rationale: Preserva o vocabulário de esperança e sua repetição na cláusula difícil, sem substituí-lo por uma interpretação como “confiança”.
- source_word: τοῦ δυνατοῦ
  choice: do poderoso
  rationale: Conserva a expressão pessoal no singular e é mais corrente em português do que “do forte”, sem definir além do texto a identidade da pessoa.
- source_word: ἐλπὶθ θεοῦ
  choice: é esperança em Deus
  rationale: A forma transmitida é irregular ou incerta. A tradução a trata cautelosamente como parte de uma oração nominal e preserva tanto a repetição de “esperança” quanto sua orientação para Deus.
- source_word: ἐλεήσει
  choice: terá misericórdia de
  rationale: Expressa de modo natural e teologicamente reconhecível a ação misericordiosa indicada pelo verbo.
- source_word: πάντα τὰ ἔθνη
  choice: todas as nações
  rationale: Mantém o alcance universal de πάντα e traduz ἔθνη sem restringi-lo ao sentido religioso de “gentios”.
- source_word: ἐνώπιον αὐτοῦ ἐν φόβῳ
  choice: diante dele, com temor
  rationale: Preserva a relação de presença expressa por ἐνώπιον e deixa “temor” aberto tanto ao medo quanto à reverência.
theological_decisions:
- issue: Relação entre a realeza do Senhor e o governante davídico no contexto
  choice: O próprio Senhor é o rei deles
  alternative: O próprio Senhor é o rei dele
  rationale: A leitura principal segue o plural αὐτῶν de Swete e afirma o Senhor como rei último do povo, sem apagar a função do governante davídico no contexto. A variante singular é registrada em nota.
- issue: Relação sintática da cláusula sobre a esperança com a declaração anterior
  choice: Tratá-la como nova oração nominal após a pausa forte
  alternative: 'Entendê-la como aposto: “o rei deles, a esperança do poderoso em Deus”'
  rationale: O ponto alto após αὐτῶν favorece uma quebra de oração, e a construção transmitida é difícil demais para justificar que a tradução imponha silenciosamente uma relação apositiva.
- issue: Referente do sujeito implícito em “terá misericórdia”
  choice: Manter o pronome “ele” sem explicitar o referente
  alternative: Substituir por “o Senhor” ou “o poderoso”
  rationale: O grego não repete um sujeito nominal. Manter “ele” conserva a possível tensão contextual em vez de decidir explicitamente quem exerce a misericórdia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a repetição deliberadamente incomum de “esperança” para não ocultar a dificuldade do grego, enquanto a pontuação torna clara a forte pausa após a primeira oração.
