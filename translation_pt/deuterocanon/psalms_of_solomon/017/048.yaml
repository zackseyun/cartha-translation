lexical_decisions:
- source_word: ῥήματα
  choice: palavras
  rationale: Refere-se a palavras ou declarações proferidas; «palavras» é natural, conciso e mantém a força do grego.
- source_word: πεπυρωμένα
  choice: refinadas
  rationale: O particípio evoca a ação do fogo sobre o metal. «Refinadas» preserva a imagem metalúrgica e se ajusta à comparação com o ouro.
- source_word: ὑπὲρ χρυσίον τὸ πρῶτον τίμιον
  choice: mais do que o ouro precioso da melhor qualidade
  rationale: Expressa a comparação intensificada e a qualidade superior do ouro sem impor ao grego uma formulação excessivamente técnica.
- source_word: συναγωγαῖς
  choice: assembleias
  rationale: Designa reuniões comunitárias e evita restringir o sentido a uma instituição posterior.
- source_word: διακρινεῖ
  choice: julgará
  rationale: No contexto régio, o verbo pode ter sentido judicial ou discernidor; «julgará» é plausível, enquanto «distinguirá» e «separará» permanecem alternativas reais.
- source_word: λαὸν φυλὰς
  choice: o povo, as tribos
  rationale: Mantém a sequência nominal comprimida do grego, entendendo «as tribos» como explicação ou aposição de «o povo», sem acrescentar uma conjunção ausente.
- source_word: ἡγιασμένου
  choice: dos santificados
  rationale: Embora seja genitivo singular, o particípio substantivado pode ter referência coletiva ao povo consagrado. «Dos santificados» evita sugerir indevidamente um único indivíduo e preserva a ideia de consagração.
theological_decisions:
- issue: Referência de ἡγιασμένου
  choice: dos santificados
  alternative: do Santificado / do Santo / do consagrado
  rationale: O contexto favorece uma referência coletiva ao povo consagrado, mas a forma grega singular e a sintaxe comprimida permitem uma leitura individual; a nota conserva essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário internacional. A tradução conserva a imagem do refino pelo fogo, a ambiguidade de διακρινεῖ e a compressão sintática do final, esclarecendo as alternativas em notas.
