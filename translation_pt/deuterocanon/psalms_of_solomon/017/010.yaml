  text: According to their sins you will repay them[a], O God; may they be found according to their works.
translation:
  language: pt
  text: Conforme os seus pecados, tu lhes retribuirás, ó Deus; que lhes sobrevenha[a] conforme as suas obras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “que seja encontrado para eles conforme as suas obras”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατά
  choice: conforme
  rationale: 'Com o acusativo nas duas ocorrências, indica padrão ou medida: a retribuição corresponde aos pecados e às obras deles.'
- source_word: ἁμαρτήματα
  choice: pecados
  rationale: Tradução direta do plural, preservando o peso moral do termo sem especificar indevidamente a natureza das transgressões.
- source_word: ἀποδώσεις
  choice: tu lhes retribuirás
  rationale: O futuro expressa retribuição divina. “Retribuir” mantém o sentido judicial e é claro no registro bíblico moderno.
- source_word: ὁ θεός
  choice: ó Deus
  rationale: Embora tenha forma nominativa, funciona como vocativo em uma invocação direta.
- source_word: εὑρεθείη αὐτοῖς
  choice: que lhes sobrevenha
  rationale: O optativo passivo singular significa literalmente algo como “que seja encontrado para eles”, construção que pode indicar aquilo que alcança ou sobrevém a alguém. A tradução conserva o desejo expresso pelo optativo e não introduz um objeto explícito ausente no grego.
- source_word: ἔργα
  choice: obras
  rationale: Mantém proximidade com o grego e a linguagem tradicional de retribuição segundo as obras, sem excluir o sentido geral de atos ou ações.
theological_decisions:
- issue: Natureza da retribuição pedida na segunda oração
  choice: Manter implícito o que lhes sobrevirá
  alternative: Explicitar “castigo”, “recompensa” ou “retribuição”
  rationale: O grego não nomeia o conteúdo do que é encontrado ou sobrevém; explicitá-lo resolveria uma ambiguidade genuína e poderia estreitar indevidamente o sentido teológico.
translation_notes:
  register: Português atual, solene e acessível, com pronome sujeito expresso na primeira oração para dar clareza à invocação. “Sobrevenha” preserva a forma singular e a abertura semântica de εὑρεθείη, enquanto a nota registra a construção literal incomum.
