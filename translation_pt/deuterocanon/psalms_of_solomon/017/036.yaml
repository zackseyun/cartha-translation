base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/036.yaml
  text: And there will be no injustice in his days among them[a], because all are holy[b], and their king is the Lord Messiah.
translation:
  language: pt
  text: E não haverá injustiça entre eles nos dias dele,[a] porque todos são santos, e o rei deles é o Messias Senhor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «E não há injustiça entre eles nos dias dele».'
    reason: O verbo grego ἔστιν está no presente, embora o contexto favoreça uma referência futura.
  - marker: b
    text: 'Ou: «o Messias, o Senhor»; alternativamente, «o Messias do Senhor».'
    reason: A sequência grega χριστὸς κύριος admite mais de uma relação sintática e não contém um genitivo explícito.
lexical_decisions:
- source_word: ἀδικία
  choice: injustiça
  rationale: Expressa tanto a transgressão moral quanto a injustiça presente na vida da comunidade, sem restringir o sentido a uma categoria puramente jurídica.
- source_word: ἐν ταῖς ἡμέραις αὐτοῦ
  choice: nos dias dele
  rationale: Mantém o idioma temporal grego e a referência à era do rei sem explicitar interpretativamente «durante o seu reinado».
- source_word: ἐν μέσῳ αὐτῶν
  choice: entre eles
  rationale: Forma natural em português para indicar que a injustiça não existirá no meio da comunidade.
- source_word: ἅγιοι
  choice: santos
  rationale: É o equivalente direto e transparente, evitando desenvolver o termo como «consagrados» ou tratá-lo como designação técnica posterior.
- source_word: χριστός
  choice: Messias
  rationale: Aqui funciona como título do ungido real no contexto judaico, e não como nome próprio.
- source_word: κύριος
  choice: Senhor
  rationale: Preserva o segundo elemento da sequência titular grega sem introduzir uma relação possessiva ausente no texto.
theological_decisions:
- issue: Sentido temporal de οὐκ ἔστιν no contexto profético
  choice: não haverá
  alternative: não há
  rationale: Embora ἔστιν seja morfologicamente presente, o contexto descreve a futura era messiânica e «nos dias dele» situa a afirmação nesse período. A alternativa mais formal é preservada em nota.
- issue: Interpretação da sequência χριστὸς κύριος
  choice: o Messias Senhor
  alternative: o Messias, o Senhor; o Messias do Senhor
  rationale: O grego não contém genitivo explícito. A formulação principal conserva juntos os dois títulos e sua tensão, sem decidir se κύριος é um segundo título ou se a expressão deve ser entendida como possessiva.
- issue: Tempo das orações nominais πάντες ἅγιοι e βασιλεὺς αὐτῶν χριστὸς κύριος
  choice: todos são santos, e o rei deles é o Messias Senhor
  alternative: todos serão santos, e o rei deles será o Messias Senhor
  rationale: Como essas orações não trazem verbo expresso, o presente em português preserva a formulação nominal e evita uniformizar toda a frase no futuro além do necessário.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. «Nos dias dele» conserva o idioma da fonte; «Messias Senhor» é deliberadamente incomum para manter a ambiguidade da sequência grega, esclarecida em nota.
