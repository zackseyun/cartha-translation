base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/017/026.yaml
  text: to drive sinners out from the inheritance[a], to wipe out the pride of the sinner like a potter's vessels[d][c][b], to crush all their substance with an iron rod.
translation:
  language: pt
  text: para expulsar os pecadores da herança[a], para destruir a arrogância do pecador, como vasos de oleiro[b], para despedaçar com vara de ferro tudo o que lhes dá sustentação[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “patrimônio recebido” ou “território herdado”.
    reason: lexical_alternative
  - marker: b
    text: O grego traz “do pecador” no singular, possivelmente como singular representativo. A comparação “como vasos de oleiro” também pode ser ligada ao ato de destruir ou aos pecadores.
    reason: source_ambiguity
  - marker: c
    text: A expressão grega também pode significar “todos os bens deles”, “toda a posição deles” ou “toda a sua substância”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῶσαι
  choice: expulsar
  rationale: Expressa remoção forçada de modo natural e conciso em português.
- source_word: κληρονομίας
  choice: herança
  rationale: Preserva o sentido de posse recebida ou território atribuído e sua possível ressonância pactual.
- source_word: ἐκτρῖψαι
  choice: destruir
  rationale: O verbo pode indicar eliminação completa; “destruir” mantém essa força sem antecipar a ação concreta de συντρίψαι na oração seguinte.
- source_word: ὑπερηφανίαν
  choice: arrogância
  rationale: Comunica claramente a exaltação orgulhosa condenada no contexto.
- source_word: ἁμαρτωλοῦ
  choice: do pecador
  rationale: Mantém o singular representativo do grego, sem o converter silenciosamente em plural.
- source_word: ὡς σκεύη κεραμέως
  choice: como vasos de oleiro
  rationale: Conserva a imagem concreta de objetos de cerâmica frágeis diante do juízo; a relação exata da comparação permanece sintaticamente aberta.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: com vara de ferro
  rationale: Formulação bíblica natural que mantém a força alusiva da expressão grega.
- source_word: συντρίψαι
  choice: despedaçar
  rationale: Traduz a ideia de quebrar violentamente em pedaços e combina com a imagem da vara de ferro.
- source_word: πᾶσαν ὑπόστασιν αὐτῶν
  choice: tudo o que lhes dá sustentação
  rationale: ὑπόστασις é semanticamente amplo e pode designar base, recursos, bens ou posição; esta formulação portuguesa preserva a noção de suporte sem restringi-la apenas a posses.
theological_decisions:
- issue: Referência de ὑπόστασις
  choice: tudo o que lhes dá sustentação
  alternative: todos os seus bens; toda a posição deles; toda a sua substância
  rationale: A expressão evita decidir se o juízo recai exclusivamente sobre bens materiais, posição social ou base de poder.
- issue: Alcance da comparação com vasos de oleiro
  choice: manter a comparação em posição sintaticamente ambígua
  alternative: explicitar que a arrogância ou os pecadores são como vasos
  rationale: O grego permite tensão quanto ao elemento preciso comparado aos vasos; a tradução não deve resolver isso sem necessidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém a sequência de infinitivos do contexto e evita vocabulário excessivamente técnico; “vara de ferro” conserva a dicção bíblica tradicional sem arcaísmo.
