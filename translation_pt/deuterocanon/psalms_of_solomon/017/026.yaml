  text: ἐξῶσαι ἁμαρτωλοὺς ἀπὸ κληρονομίας, ἐκτρῖψαι ὑπερηφανίαν ἁμαρτωλοῦ ὡς σκεύη κεραμέως, ἐν ῥάβδῳ σιδηρᾷ συντρίψαι πᾶσαν ὑπόστασιν αὐτῶν.
