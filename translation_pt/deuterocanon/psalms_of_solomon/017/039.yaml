  text: For he will subdue the earth forever with the word of his mouth[c][b][a],
translation:
  language: pt
  text: Pois ele despedaçará a terra com a palavra de sua boca para sempre.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a terra do país”, isto é, “o território”, em vez de “a terra” em sentido amplo.
    reason: lexical_alternative
  - marker: b
    text: O texto grego impresso diz “despedaçará”. É provável que se trate de uma antiga confusão de letras e que a leitura pretendida fosse “ferirá”, em provável eco de Isaías 11:4, onde o governante ideal fere a terra com a palavra de sua boca.
    reason: textual_variant_and_cross_reference
lexical_decisions:
- source_word: κατάξει
  choice: despedaçará
  rationale: Traduz o texto grego impresso de Swete como forma futura de κατάγνυμι, “quebrar em pedaços, despedaçar”. Evita substituí-lo silenciosamente pela provável correção πατάξει, “ferirá”, e conserva a força judicial e violenta da frase.
- source_word: γῆν
  choice: a terra
  rationale: γῆ pode designar tanto a terra em sentido amplo quanto uma terra ou território específico. “A terra” preserva a amplitude e o tom régio do contexto, sem excluir totalmente a leitura territorial.
- source_word: τῷ λόγῳ τοῦ στόματος αὐτοῦ
  choice: com a palavra de sua boca
  rationale: Mantém de perto a imagem poética e teologicamente significativa de poder e juízo exercidos pela fala, e não por uma arma física.
- source_word: εἰς αἰῶνα
  choice: para sempre
  rationale: Expressão portuguesa corrente para duração permanente ou indefinidamente contínua, adequada ao tom solene do verso.
theological_decisions:
- issue: Possível eco de Isaías 11:4 no juízo do rei messiânico por meio de sua fala
  choice: Preservar a imagem direta de despedaçar a terra com a palavra de sua boca.
  alternative: Parafrasear como “governará” ou “subjugará a terra por sua ordem”.
  rationale: O texto apresenta uma ação judicial poderosa realizada pela fala. Uma paráfrase sobre governo suavizaria a violência da imagem e resolveria indevidamente sua tensão.
- issue: Texto impresso κατάξει em contraste com a provável correção πατάξει
  choice: Traduzir κατάξει, conforme a edição-fonte, por “despedaçará”.
  alternative: Adotar a provável correção πατάξει e traduzir “ferirá”, em harmonia mais direta com Isaías 11:4.
  rationale: O mandato requer traduzir a evidência da fonte indicada. A possível corrupção textual é relevante, mas deve ser informada em nota, não corrigida silenciosamente no texto principal.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A formulação conserva a imagem semítica “a palavra de sua boca” por seu peso poético. “Despedaçará” é forte, mas necessário para representar o texto grego impresso; a nota registra a provável leitura alternativa sem alterar silenciosamente a fonte.
