  source_fidelity: 'A tradução acompanha com precisão o enunciado grego: «os que amavam as assembleias dos santos» reproduz οἱ ἀγαπῶντες συναγωγὰς ὁσίων; «fugiram deles» conserva tanto ἔφυγοσαν ἀπʼ αὐτῶν como a indeterminação contextual do pronome; e «como pardais, voaram para longe do seu ninho» expressa adequadamente a comparação e ἐξεπετάσθησαν ἀπὸ κοίτης αὐτῶν. A opção poética «ninho» é contextual e está corretamente qualificada pela nota.'
