  text: Those who loved the assemblies of the holy ones fled from them; like sparrows they flew away from their nest.
translation:
  language: pt
  text: Os que amavam as assembleias dos santos fugiram deles; como pardais, voaram para longe do seu ninho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do seu lugar de repouso”.'
    reason: O grego κοίτη significa literalmente leito ou lugar de repouso; 'ninho' decorre da imagem dos pardais.
lexical_decisions:
- source_word: συναγωγὰς
  choice: assembleias
  rationale: Expressa reuniões ou congregações sem limitar o termo ao edifício religioso posteriormente chamado de sinagoga.
- source_word: ὁσίων
  choice: santos
  rationale: Traduz o substantivo adjetival como referência às pessoas fiéis ou piedosas, preservando a formulação religiosa concisa do grego.
- source_word: ἐξεπετάσθησαν
  choice: voaram para longe
  rationale: Reproduz de modo natural o movimento de dispersão indicado pelo verbo grego no contexto da comparação com pardais.
- source_word: κοίτης
  choice: ninho
  rationale: Embora o sentido básico seja lugar de repouso ou leito, a imagem dos pardais favorece em português a expressão natural 'ninho'.
theological_decisions:
- issue: Identidade dos 'santos'
  choice: Manter 'santos' sem explicitar a identidade do grupo
  alternative: fiéis ou piedosos
  rationale: O texto grego não identifica mais precisamente essas pessoas; a tradução preserva essa abertura sem introduzir uma definição confessional.
- issue: Referente de 'deles'
  choice: Preservar o pronome sem explicitar o antecedente
  alternative: Substituir por um grupo ou lugar identificado pelo contexto mais amplo
  rationale: O verso isolado contém o pronome αὐτῶν, e explicitar seu referente resolveria uma relação contextual que o próprio enunciado não torna explícita.
translation_notes:
  register: Português atual, digno e de leitura natural. A ordem foi ajustada ao uso corrente, mantendo o paralelismo e a imagem poética do original.
