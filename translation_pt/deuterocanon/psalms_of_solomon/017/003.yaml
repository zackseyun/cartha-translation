  text: But we will hope in God our savior, because the dominion of our God is forever with mercy, and the kingdom of our God is forever over the nations.
translation:
  language: pt
  text: Nós, porém, esperaremos em Deus, nosso salvador, pois o domínio do nosso Deus é para sempre com misericórdia, e o reino do nosso Deus é para sempre sobre as nações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλπιοῦμεν ἐπὶ
  choice: esperamos em
  rationale: Preserva o futuro de sentido confiante e a construção que indica em quem se deposita a esperança.
- source_word: σωτῆρα
  choice: salvador
  rationale: Equivalente direto e natural, sem acrescentar título ou interpretação além do grego.
- source_word: κράτος
  choice: domínio
  rationale: Expressa poder soberano e governo; distingue-se de βασιλεία, traduzido como «reino».
- source_word: μετʼ ἐλέους
  choice: com misericórdia
  rationale: Mantém a formulação instrumental ou associativa do original e sua possível tensão, sem explicitar de que modo a misericórdia acompanha o domínio.
- source_word: βασιλεία
  choice: reino
  rationale: Termo corrente e teologicamente não restritivo para o reinado ou reino de Deus.
- source_word: ἐπὶ τὰ ἔθνη
  choice: sobre as nações
  rationale: Reproduz a ideia de soberania exercida sobre os povos não especificados.
theological_decisions:
- issue: Relação entre o domínio eterno de Deus e a misericórdia
  choice: «dura para sempre com misericórdia»
  alternative: «é para sempre em misericórdia»
  rationale: A escolha conserva μετʼ ἐλέους de forma deliberadamente aberta, sem definir se a misericórdia caracteriza, acompanha ou é o meio do domínio.
- issue: Aspecto temporal das duas afirmações paralelas
  choice: «dura para sempre» / «permanece para sempre»
  alternative: «é para sempre» em ambas
  rationale: Os verbos acrescentados são exigidos pela fluência portuguesa diante das cláusulas nominais gregas e expressam continuidade, sem alterar a afirmação de eternidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva o paralelismo do versículo e diferencia «domínio» de «reino». «salvador» aparece em minúscula por funcionar como aposto descritivo, conforme o texto grego sem marcação de título.
