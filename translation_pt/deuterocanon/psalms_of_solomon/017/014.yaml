  text: In the wrath of his splendor he sent them away as far as the west[a], and the rulers of the land to mockery[c][b]; and he did not spare.
translation:
  language: pt
  text: Na ira de sua beleza[a], ele os mandou para longe, até o ocidente, e mandou os governantes da terra à zombaria[b]; e não poupou[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na ira de seu esplendor”. A expressão grega é incomum.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e mandou os governantes da terra para serem alvo de zombaria”.'
    reason: lexical_alternative
  - marker: c
    text: O grego não declara quem ou o que ele não poupou.
    reason: ambiguity
lexical_decisions:
- source_word: ἐν ὀργῇ κάλλους αὐτοῦ
  choice: Na ira de sua beleza
  rationale: Mantém a construção genitiva incomum do grego e traduz κάλλος pelo sentido lexical direto, “beleza”, sem pressupor que o sujeito seja divino nem corrigir uma possível leitura subjacente.
- source_word: ἐξαπέστειλεν αὐτὰ
  choice: ele os mandou para longe
  rationale: O verbo intensivo expressa envio para fora ou para longe. O pronome grego é neutro plural; em português, “os” retoma naturalmente o referente contextual.
- source_word: ἕως ἐπὶ δυσμῶν
  choice: até o ocidente
  rationale: δυσμαί designa o poente ou o oeste; “até o ocidente” preserva tanto a direção quanto a ideia de limite distante.
- source_word: τοὺς ἄρχοντας τῆς γῆς εἰς ἐμπαιγμόν
  choice: entregou os governantes da terra à zombaria
  rationale: O verbo ἐξαπέστειλεν é compartilhado pelas duas construções. “Entregou ... à zombaria” produz português inteligível sem introduzir explicitamente “fez”, ausente do grego.
- source_word: οὐκ ἐφείσατο
  choice: não poupou
  rationale: Preserva a forma absoluta do grego, sem acrescentar um objeto implícito como “deles”.
theological_decisions:
- issue: Identidade e caráter do sujeito
  choice: Não identificar o sujeito nem converter “beleza” em linguagem de majestade divina
  alternative: Traduzir κάλλους como “esplendor” por entender a ação como divina
  rationale: O versículo grego apenas usa o pronome “dele”. A tradução evita resolver pelo léxico uma questão contextual e conserva o sentido direto de κάλλος.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por uma formulação próxima do grego. A construção incomum “ira de sua beleza” foi preservada deliberadamente, e a coordenação verbal foi levemente explicitada com “entregou” para assegurar legibilidade.
