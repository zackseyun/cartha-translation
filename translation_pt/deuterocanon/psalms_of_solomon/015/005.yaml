  text: a new psalm with song[a], in the joy of the heart; the fruit of lips with the well-tuned instrument of the tongue[c][b]; the firstfruits of lips from a holy and righteous heart.
translation:
  language: pt
  text: 'um salmo novo com cântico, na alegria do coração;

    fruto dos lábios, com o instrumento bem afinado da língua[a];

    primícias dos lábios[b], vindas de um coração santo e justo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode entender: “com a língua como instrumento bem afinado”. A expressão grega é compacta e admite mais de uma forma de relacionar o instrumento à língua.'
    reason: lexical_alternative
  - marker: b
    text: As expressões “fruto dos lábios” e “primícias dos lábios” preservam a imagem de uma oferta, em vez de a parafrasearem simplesmente como fala ou louvor.
    reason: cultural_note
lexical_decisions:
- source_word: ψαλμὸν καινὸν
  choice: um salmo novo
  rationale: “Salmo” preserva o sentido literário e religioso de ψαλμός, enquanto καινός significa diretamente “novo”.
- source_word: μετὰ ᾠδῆς
  choice: com cântico
  rationale: μετά com o genitivo expressa acompanhamento; “cântico” é natural no registro poético-bíblico e mantém a distinção formal em relação a “salmo”.
- source_word: ἐν εὐφροσύνῃ καρδίας
  choice: na alegria do coração
  rationale: Mantém tanto o sentido de alegria de εὐφροσύνη quanto a construção genitiva que apresenta o coração como sua esfera ou fonte interior.
- source_word: καρπὸν χειλέων
  choice: fruto dos lábios
  rationale: Conserva a metáfora bíblica do fruto produzido pelos lábios, sem reduzi-la a “palavras” ou “louvor”.
- source_word: ἐν ὀργάνῳ ἤρμοσμένῳ γλώσσης
  choice: com o instrumento bem afinado da língua
  rationale: “Instrumento” traduz ὄργανον, “bem afinado” comunica o particípio de ἁρμόζω, e “da língua” preserva diretamente o genitivo γλώσσης. A formulação mantém a compactação poética e sua possível ambiguidade.
- source_word: ἀπαρχὴν χειλέων
  choice: primícias dos lábios
  rationale: “Primícias” preserva a imagem cultual de ἀπαρχή como primeira porção oferecida, em paralelo com “fruto dos lábios”.
- source_word: ἀπὸ καρδίας ὁσίας καὶ δικαίας
  choice: vindas de um coração santo e justo
  rationale: “Santo e justo” reproduz a dupla qualificação moral e religiosa de ὁσίας καὶ δικαίας. “Vindas” explicita em português a relação de origem marcada por ἀπό e concorda com “primícias”.
theological_decisions:
- issue: Metáfora cultual de fruto e primícias
  choice: Manter “fruto dos lábios” e “primícias dos lábios”
  alternative: Parafrasear como “palavras de louvor” ou “louvor oferecido pelos lábios”
  rationale: O texto associa a fala ou o canto à linguagem de produção e oferta. Preservar ambas as metáforas evita impor uma identificação teológica mais específica do que o grego declara.
- issue: Relação entre instrumento e língua
  choice: Preservar a construção “o instrumento bem afinado da língua”
  alternative: Explicitar “a língua como instrumento bem afinado”
  rationale: O genitivo grego é compacto e admite compreender a língua como o instrumento ou como aquilo a que o instrumento está ajustado. O texto principal mantém mais de perto essa tensão; a nota registra a leitura explicativa natural.
translation_notes:
  register: Português atual, digno e de leitura ampla, com cadência poética. Mantiveram-se os sintagmas nominais fragmentários do grego e o paralelismo entre “fruto” e “primícias”. “Cântico” foi preferido a “canção” por adequação ao registro bíblico sem recorrer a linguagem arcaica.
