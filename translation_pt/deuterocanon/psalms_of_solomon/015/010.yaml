  text: Pois o sinal da destruição está sobre suas testas,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σημεῖον
  choice: sinal
  rationale: “Sinal” corresponde diretamente ao termo grego e preserva o paralelismo lexical do contexto, sem limitar o sentido a uma marca física.
- source_word: ἀπωλείας
  choice: da destruição
  rationale: O genitivo qualifica o sinal como relacionado à destruição ou indicativo dela; “destruição” é claro, solene e atual.
- source_word: ἐπὶ
  choice: sobre
  rationale: Com “testa”, expressa localização e mantém o tom elevado de modo natural em português.
- source_word: μετώπου αὐτῶν
  choice: a testa deles
  rationale: Reproduz o singular distributivo do grego, entendido como a testa de cada integrante do grupo, sem apagar a forma do texto-fonte.
theological_decisions:
- issue: Relação semântica entre o sinal e a destruição
  choice: sinal da destruição
  alternative: marca destinada à destruição
  rationale: A construção grega permite que o sinal indique, pertença ou conduza à destruição; a tradução mantém essa tensão sem explicá-la além do texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A conjunção “Pois” preserva a função explicativa de γάρ; a vírgula final acompanha o caráter de linha não conclusiva do trecho fornecido.
