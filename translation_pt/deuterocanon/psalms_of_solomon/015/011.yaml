  text: And the inheritance of sinners is destruction and darkness, and their lawlessness will pursue them down to Hades.
translation:
  language: pt
  text: E a herança dos pecadores é destruição e trevas, e a transgressão da lei os perseguirá até o Hades, lá embaixo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até o Hades abaixo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κληρονομία
  choice: herança
  rationale: Preserva a imagem concreta de uma porção recebida e o contraste implícito entre a herança esperada e o destino dos pecadores.
- source_word: ἁμαρτωλῶν
  choice: pecadores
  rationale: Equivalente substantival plural direto, natural e corrente em português.
- source_word: ἀπώλεια
  choice: destruição
  rationale: Comunica perda e ruína catastróficas sem o tom arcaico ou as associações doutrinárias mais estreitas de outras opções.
- source_word: σκότος
  choice: trevas
  rationale: Preserva a imagem do grego e seu peso moral e escatológico, em formulação bíblica ainda amplamente compreensível.
- source_word: ἀνομία
  choice: transgressão da lei
  rationale: Mantém explícita a relação etimológica e conceitual com a lei, evitando generalizar o termo para simples maldade; o singular também corresponde ao grego.
- source_word: διώξεται
  choice: perseguirá
  rationale: Conserva o futuro e a imagem personificada de uma perseguição implacável, sem exigir o sentido técnico de perseguição religiosa.
- source_word: ἕως ᾅδου κάτω
  choice: até o Hades, lá embaixo
  rationale: Representa tanto o limite ou destino expresso por ἕως quanto a localização inferior marcada por κάτω, sem identificar ᾅδης com Geena.
theological_decisions:
- issue: Como traduzir ᾅδης
  choice: Hades
  alternative: inferno; morada dos mortos
  rationale: O texto grego emprega especificamente ᾅδης. A transliteração preserva essa referência ao mundo dos mortos e evita equipará-la de modo interpretativo à Geena; 'morada dos mortos' seria explicativa, mas menos formal.
- issue: Sentido de ἀνομία
  choice: transgressão da lei
  alternative: iniquidade; ilegalidade; maldade
  rationale: A opção escolhida conserva a referência constitutiva à lei e não reduz o termo a uma maldade genérica. O contexto permite uma dimensão moral e punitiva sem especificar qual lei está em vista.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência próxima do paralelismo grego. Mantém-se “Hades” por precisão terminológica. “Lá embaixo” traduz κάτω de modo natural, enquanto a nota registra uma alternativa mais formal.
