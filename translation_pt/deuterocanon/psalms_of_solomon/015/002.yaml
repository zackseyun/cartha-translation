lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão ou explicação da afirmação no contexto; “Pois” preserva naturalmente o valor causal em português.
- source_word: ἐλπὶς
  choice: esperança
  rationale: Equivalente direto e corrente do substantivo grego, sem necessidade de paráfrase.
- source_word: καταφυγὴ
  choice: refúgio
  rationale: Expressa de modo direto uma fonte ou lugar de proteção e forma uma combinação natural com “esperança”.
- source_word: τῶν πτωχῶν
  choice: dos pobres
  rationale: Reproduz naturalmente o genitivo e conserva o sentido socioeconômico mais específico de πτωχός.
- source_word: σύ
  choice: tu és
  rationale: O pronome grego é explícito e enfático; em português, a cópula precisa ser expressa, e “tu” mantém a referência direta a Deus.
- source_word: ὁ θεός
  choice: ó Deus
  rationale: O sintagma funciona como vocativo; “ó Deus” expressa com clareza a invocação direta em registro digno.
