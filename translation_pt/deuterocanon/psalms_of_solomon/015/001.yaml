  yaml_path: translation/deuterocanon/psalms_of_solomon/015/001.yaml
  text: When I was in distress[a], I called on the name of the Lord; I hoped for help from the God of Jacob[b], and I was saved.
translation:
  language: pt
  text: Quando eu estava angustiado, invoquei o nome do Senhor; esperei pelo auxílio do Deus de Jacó e fui salvo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fui libertado”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῷ θλίβεσθαί με
  choice: Quando eu estava angustiado
  rationale: A construção ἐν com infinitivo articular tem sentido temporal; o passivo θλίβεσθαι comunica estar sob aflição ou pressão. A formulação é natural em português e preserva esse sentido.
- source_word: ἐπεκαλεσάμην
  choice: invoquei
  rationale: O verbo, neste contexto de oração, significa chamar ou apelar solenemente. “Invoquei” expressa com precisão o apelo dirigido ao Senhor.
- source_word: τὸ ὄνομα Κυρίου
  choice: o nome do Senhor
  rationale: Preserva a expressão bíblica tradicional e traduz Κύριος por “Senhor”.
- source_word: εἰς βοήθειαν ἤλπισα τοῦ θεοῦ Ἰακώβ
  choice: esperei pelo auxílio do Deus de Jacó
  rationale: εἰς βοήθειαν funciona como complemento de ἤλπισα, e o genitivo τοῦ θεοῦ Ἰακώβ identifica a origem ou posse do auxílio. A redação portuguesa mantém essa relação sem artificialidade.
- source_word: ἐσώθην
  choice: fui salvo
  rationale: É a correspondência direta e abrangente de σῴζω no passivo. “Fui libertado” também é possível no contexto de uma aflição concreta e consta em nota.
theological_decisions:
- issue: Sentido de ἐσώθην
  choice: fui salvo
  alternative: fui libertado
  rationale: “Salvo” conserva a amplitude lexical do verbo grego sem limitar o texto à libertação de um perigo específico; a alternativa contextual é registrada sem impor uma leitura soteriológica estreita.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética discreta. “Angustiado”, “invoquei” e “auxílio” preservam o registro bíblico sem recorrer a linguagem arcaica.
