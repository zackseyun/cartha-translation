base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/015.yaml
  text: But those who fear the Lord will be shown mercy in it[a], and they will live by the mercy of their God, but sinners will perish forever.
translation:
  language: pt
  text: Mas os que temem o Senhor receberão misericórdia nela[a] e viverão pela misericórdia do seu Deus; mas os pecadores perecerão para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “nela”. Provavelmente se refere ao dia do juízo do Senhor mencionado pouco antes, embora também possa retomar a terra da linha anterior.'
    reason: Preservar a ambiguidade do antecedente de αὐτῇ.
lexical_decisions:
- source_word: φοβούμενοι
  choice: os que temem
  rationale: O particípio substantivado designa o grupo caracterizado por temer o Senhor; a formulação preserva o sentido religioso e é natural em português.
- source_word: κύριον
  choice: o Senhor
  rationale: É a tradução reverencial corrente de κύριος neste contexto.
- source_word: ἐλεηθήσονται
  choice: receberão misericórdia
  rationale: Expressa com naturalidade o futuro passivo e deixa claro que a misericórdia lhes é concedida.
- source_word: ἐν αὐτῇ
  choice: nela
  rationale: Mantém o pronome feminino e a ambiguidade do antecedente no grego, sem inserir explicitamente “dia” ou “terra” no texto principal.
- source_word: ἐν τῇ ἐλεημοσύνῃ
  choice: pela misericórdia
  rationale: Neste contexto, ἐλεημοσύνη indica a misericórdia divina como meio pelo qual vivem, não esmola.
- source_word: ἀπολοῦνται
  choice: perecerão
  rationale: Transmite de modo digno e direto o sentido do verbo no contexto de juízo.
- source_word: εἰς τὸν αἰῶνα χρόνον
  choice: para sempre
  rationale: Equivalente português claro e idiomático para a expressão intensiva de duração.
theological_decisions:
- issue: Antecedente de αὐτῇ
  choice: Manter “nela” no texto, sem explicitar o antecedente.
  alternative: Traduzir “naquele dia”, entendendo a expressão como referência ao dia do juízo do Senhor; também é possível relacioná-la à terra mencionada anteriormente.
  rationale: O grego não repete o substantivo antecedente. A tradução preserva essa ambiguidade genuína, e a nota apresenta as principais possibilidades contextuais.
translation_notes:
  register: Português moderno, claro e digno, com formulações de ampla compreensão e boa legibilidade brasileira. O paralelismo contrastivo foi mantido, usando ponto e vírgula para evitar a repetição pouco fluida de duas conjunções “mas” na mesma estrutura.
