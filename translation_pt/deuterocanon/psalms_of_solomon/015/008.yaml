base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/008.yaml
  text: For the sign of God is upon the righteous for salvation[e][d][c][b][a]; famine and sword and death are far from the righteous.
translation:
  language: pt
  text: Pois o sinal de Deus está sobre os justos para a salvação[a]; a fome, a espada e a morte[b] estão longe dos justos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “marca de Deus”; “para o livramento”.'
    reason: lexical_alternative
  - marker: b
    text: Em listas tradicionais de calamidades e juízos, “morte” pode ter o sentido específico de “peste”.
    reason: alternative_reading
lexical_decisions:
- source_word: σημεῖον
  choice: sinal
  rationale: “Sinal” é a correspondência portuguesa mais direta e natural, preservando a abertura semântica do grego; “marca” também é possível e pode realçar um sinal identificador.
- source_word: δικαίους / δικαίων
  choice: os justos
  rationale: Expressa naturalmente em português a classe genérica das pessoas caracterizadas pela justiça.
- source_word: εἰς σωτηρίαν
  choice: para a salvação
  rationale: Preserva a orientação ou finalidade indicada por εἰς e mantém o peso teológico de σωτηρία sem excluir a ideia concreta de livramento.
- source_word: λιμός
  choice: fome
  rationale: No português bíblico contemporâneo, “fome” designa com naturalidade a calamidade coletiva; “carestia” seria mais estreito e “fome generalizada” acrescentaria explicitação.
- source_word: ῥομφαία
  choice: espada
  rationale: É a tradução convencional e adequada no trio de calamidades.
- source_word: θάνατος
  choice: morte
  rationale: Mantém o sentido lexical explícito do texto grego. Embora o termo possa evocar pestilência em listas tradicionais de juízo, o verso não exige que essa nuance substitua o sentido mais amplo.
- source_word: μακράν
  choice: longe de
  rationale: É a expressão predicativa mais natural em português para indicar afastamento.
theological_decisions:
- issue: Natureza do sinal divino sobre os justos
  choice: sinal
  alternative: marca
  rationale: A tradução não define se se trata de uma marca física, de identificação simbólica ou de uma indicação mais ampla da proteção de Deus; preserva-se assim a abertura do grego.
- issue: Sentido de θάνατος na tríade de calamidades
  choice: morte
  alternative: peste
  rationale: “Morte” traduz diretamente θάνατος e evita impor uma retroversão hebraica incerta. “Peste” continua sendo uma possibilidade contextual em fórmulas tradicionais de juízo e é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com formulação de ampla legibilidade brasileira. Conserva-se o paralelismo conciso do grego e a repetição de “os justos”, sem substituir o segundo termo por pronome.
