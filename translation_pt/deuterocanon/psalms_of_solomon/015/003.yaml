translation:
  language: pt
  text: Pois quem tem força, ó Deus, senão para te dar graças[a] em verdade?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode significar “louvar-te” ou “reconhecer-te”; neste contexto, o verbo não indica necessariamente confissão de pecados.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἰσχύει
  choice: Pois quem tem força
  rationale: Mantém a pergunta retórica e o sentido de força ou capacidade de ἰσχύω, sem transformar o verbo simplesmente em um auxiliar modal.
- source_word: ὁ θεός
  choice: ó Deus
  rationale: O nominativo com artigo funciona aqui como vocativo, em uma oração dirigida diretamente a Deus.
- source_word: εἰ μὴ ἐξομολογήσασθαί σοι
  choice: senão para te dar graças
  rationale: A construção εἰ μή com o infinitivo é preservada por «senão para». No uso devocional da Septuaginta, ἐξομολογέομαι com dativo frequentemente expressa ação de graças ou louvor dirigido a Deus.
- source_word: ἐν ἀληθείᾳ
  choice: em verdade
  rationale: A formulação conserva de modo deliberado tanto a ideia objetiva de verdade quanto a possível nuance de sinceridade, sem escolher apenas uma delas.
theological_decisions:
- issue: Sentido de ἐξομολογήσασθαι na linguagem devocional
  choice: dar graças
  alternative: reconhecer, louvar ou confessar diante de ti
  rationale: Com σοι e neste contexto de louvor, o verbo aponta mais naturalmente para ação de graças ou louvor. «Confessar» poderia ser entendido pelo leitor moderno como confissão de pecados, especificação que o texto não exige.
- issue: Relação entre força e ação de graças
  choice: manter «quem tem força... senão para»
  alternative: quem é capaz de te dar graças
  rationale: A redação mantém a forma incomum e a tensão retórica do grego, sem reduzir ἰσχύει a mero verbo auxiliar nem explicar além do que o texto afirma.
translation_notes:
  register: Português atual, solene e acessível, com colocação pronominal natural no registro bíblico. A expressão «em verdade» foi mantida para preservar a amplitude e a cadência do original, embora «com sinceridade» seja uma possibilidade contextual.
