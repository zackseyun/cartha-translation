  text: And what is man able to do[a], except give thanks to your name?
translation:
  language: pt
  text: E o que pode fazer o ser humano, senão dar graças[a] ao teu nome?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «confessar o teu nome» ou «louvar o teu nome». O verbo grego pode ter qualquer um desses sentidos, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: o que
  rationale: Introduz uma pergunta retórica sobre aquilo que o ser humano é capaz de fazer, não sobre a identidade de uma pessoa.
- source_word: δυνατὸς ἄνθρωπος
  choice: pode fazer o ser humano
  rationale: Expressa capacidade; o verbo «fazer», implícito no grego, torna a pergunta natural em português sem acrescentar uma ação específica.
- source_word: ἄνθρωπος
  choice: o ser humano
  rationale: Preserva o singular genérico e comunica de modo claro que a referência é à humanidade em sentido representativo.
- source_word: εἰ μὴ
  choice: senão
  rationale: Na pergunta retórica, introduz naturalmente a única ação que resta ao ser humano.
- source_word: ἐξομολογήσασθαι
  choice: dar graças
  rationale: No uso bíblico dirigido ao nome de Deus, o verbo frequentemente denota gratidão expressa em louvor; a nota conserva os outros sentidos genuinamente possíveis.
- source_word: τῷ ὀνόματί σου
  choice: ao teu nome
  rationale: Mantém a relação dativa e o idioma bíblico em que a ação é dirigida ao nome de Deus.
