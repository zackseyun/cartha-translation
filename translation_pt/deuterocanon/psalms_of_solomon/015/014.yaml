  text: when God visits the earth with his judgment[a].
translation:
  language: pt
  text: quando Deus visitar a terra em seu juízo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando Deus visitar o país em seu juízo”.'
    reason: γῆ também pode significar uma terra ou país específico; o contexto imediato permite essa alternativa.
lexical_decisions:
- source_word: ὅταν
  choice: quando
  rationale: Introduz uma oração temporal com o subjuntivo; “quando” expressa de modo natural o sentido prospectivo, sem impor a ideia iterativa de “sempre que”.
- source_word: ἐπισκέπτηται
  choice: visitar
  rationale: Preserva a linguagem bíblica de visitação e a ideia de intervenção intencional, sem definir por si só essa intervenção como favorável ou punitiva; o contexto judicial esclarece sua força.
- source_word: τὴν γῆν
  choice: a terra
  rationale: γῆ pode designar tanto a terra em sentido amplo quanto uma região ou país. “A terra” é natural em português e mantém, em alguma medida, essa amplitude lexical.
- source_word: ἐν κρίματι αὐτοῦ
  choice: em seu juízo
  rationale: Mantém de perto a construção grega e o caráter judicial de κρίμα, com formulação concisa e digna.
theological_decisions:
- issue: Caráter da visitação divina
  choice: “visitar” sem qualificação adicional
  alternative: “vir para julgar”
  rationale: O verbo ἐπισκέπτομαι não especifica sozinho se a visitação traz benefício ou punição. A expressão “em seu juízo” fornece a dimensão judicial sem tornar explícito mais do que o grego.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil. A ordem foi mantida próxima do grego; “em seu juízo” conserva a concisão e a tensão judicial do original.
