  naturalness: O texto é claro e de registro apropriado, mas “por chama de fogo” sem artigo soa truncado em português moderno. A coordenação negativa explícita (“nem por uma chama de fogo”) torna a relação sintática clara e mais fluente.
  terminology: “Mal”, “abalado”, “chama de fogo”, “ira” e “injustos” são escolhas fiéis e naturais. A nota a, porém, oferece “afastado do mal”, que não exprime bem a alternativa relevante de σαλεύω com ἀπό; “removido pelo mal” conserva melhor a ideia de deslocamento/abalo causado pelo mal.
