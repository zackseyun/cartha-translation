  text: The one who does these things will never be shaken by evil[d][c][b][a]; a flame of fire and the wrath of the unrighteous will not touch him.
translation:
  language: pt
  text: Quem faz essas coisas jamais será abalado pelo mal[a] nem por uma chama de fogo[b]; e a ira contra os injustos[c] não o atingirá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não será removido pelo mal” ou “não será abalado por dano”.
    reason: lexical_alternative
  - marker: b
    text: A preposição “por” está subentendida no grego diante de “chama de fogo”. Outra tradução possível da expressão é “chama ardente”.
    reason: syntactical_and_lexical_alternative
  - marker: c
    text: Ou “a ira dos injustos”. O genitivo grego pode indicar tanto a ira dirigida contra eles como a ira que procede deles.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ὁ ποιῶν ταῦτα
  choice: Quem faz essas coisas
  rationale: O particípio substantivado tem sentido genérico; “quem faz” é natural em português e “essas coisas” explicita o referente retrospectivo de ταῦτα.
- source_word: οὐ σαλευθήσεται εἰς τὸν αἰῶνα
  choice: jamais será abalado
  rationale: O futuro passivo de σαλεύω indica ser sacudido ou desestabilizado, e εἰς τὸν αἰῶνα torna a negação duradoura. “Jamais” comunica isso com clareza.
- source_word: ἀπὸ κακοῦ
  choice: pelo mal
  rationale: Com o verbo passivo, ἀπό pode indicar aquilo de que procede o abalo. “Mal” preserva a amplitude moral e destrutiva de κακόν.
- source_word: φλογὸς πυρός
  choice: por chama de fogo
  rationale: φλογός está no genitivo e é naturalmente coordenado sob a regência de ἀπό, não como sujeito nominativo de ἅψεται. A formulação preserva a imagem enfática do grego.
- source_word: ὀργὴ ἀδίκων
  choice: a ira contra os injustos
  rationale: 'O contexto imediato permite entender ἀδίκων como genitivo objetivo: a ira dirigida contra os injustos. Como o genitivo isolado também pode ser subjetivo, a alternativa é registrada em nota.'
- source_word: οὐχ ἅψεται αὐτοῦ
  choice: não o atingirá
  rationale: ἅπτομαι pode significar tocar ou alcançar. “Atingirá” soa natural com “ira” e conserva a ideia de que ela não alcançará a pessoa descrita.
theological_decisions:
- issue: Se ἀπὸ κακοῦ descreve mal moral ou dano sofrido
  choice: pelo mal
  alternative: por dano / a partir do mal
  rationale: “Mal” mantém a densidade ética do termo sem excluir suas consequências destrutivas; a nota conserva as possibilidades contextual e espacial.
- issue: Se ἀδίκων é genitivo objetivo ou subjetivo
  choice: a ira contra os injustos
  alternative: a ira dos injustos
  rationale: O verso seguinte identifica uma ira vinda da presença do Senhor contra pecadores, favorecendo a leitura objetiva, mas a forma grega permanece gramaticalmente ambígua e a leitura subjetiva é mantida em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção genérica natural (“Quem faz”). A pontuação distingue os agentes do possível abalo da oração final sobre a ira, sem transformar “chama de fogo” em sujeito de “atingirá”.
