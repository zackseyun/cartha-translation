  text: For sins will lay waste the houses of sinners[b][a], and sinners will perish on the day of the Lord’s judgment forever.
translation:
  language: pt
  text: Pois os pecados devastarão[a] as casas dos pecadores, e, no dia do julgamento do Senhor, os pecadores perecerão para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deixarão desoladas”.'
