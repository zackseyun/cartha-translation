lexical_decisions:
- source_word: ἁμαρτίαι
  choice: os pecados
  rationale: O plural designa pecados concretos ou acumulados; a tradução direta preserva a personificação dos pecados como agentes da devastação.
- source_word: ἐξερημώσουσιν
  choice: devastarão
  rationale: Expressa tornar desolado, arruinar ou deixar ermo, mantendo a força do verbo em português natural.
- source_word: οἴκους
  choice: as casas
  rationale: Conserva o sentido básico e concreto do termo, sem ampliá-lo desnecessariamente para “famílias” ou “casas familiares”.
- source_word: ἁμαρτωλῶν / ἁμαρτωλοί
  choice: dos pecadores / os pecadores
  rationale: Mantém a repetição retórica do grego e evita substituir o termo por uma categoria interpretativa como “ímpios”.
- source_word: ἀπολοῦνται
  choice: perecerão
  rationale: Comunica ruína ou destruição em registro solene, sem especificar um mecanismo não expresso no texto.
- source_word: ἐν ἡμέρᾳ κρίσεως Κυρίου
  choice: no dia do julgamento do Senhor
  rationale: É uma formulação portuguesa natural que preserva explicitamente a relação genitiva com o Senhor.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: No contexto de juízo, comunica a duração ou finalidade persistente da perdição, preservando em nota a forma mais literal.
theological_decisions:
- issue: Escopo de εἰς τὸν αἰῶνα
  choice: “para sempre” é colocado após a expressão sobre o dia do julgamento, como no grego, e entendido mais naturalmente com “perecerão”
  alternative: A expressão pode ser vertida literalmente como “para a era” ou tomada mais amplamente como intensificação de toda a declaração de juízo
  rationale: A posição final conserva a ordem e uma possível tensão sintática do original, enquanto a leitura mais provável relaciona a expressão ao perecimento dos pecadores; a nota não transforma essa conclusão em definição dogmática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução mantém a repetição de “pecados/pecadores”, a imagem concreta de “casas” e a ordem final de “para sempre”. Os marcadores foram posicionados junto aos termos a que as notas se referem.
