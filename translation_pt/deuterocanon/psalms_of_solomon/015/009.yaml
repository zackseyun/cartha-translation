base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/015/009.yaml
  text: For they will flee from the holy ones as those pursued by war[a], but they will pursue sinners and overtake them; and those who practice lawlessness will not escape the Lord’s judgment[c][b]; they will be captured like those seized by experienced enemies.
translation:
  language: pt
  text: Pois eles fugirão dos piedosos como quem é perseguido pela guerra[a], mas perseguirão os pecadores e os alcançarão; os que praticam a iniquidade não escaparão do julgamento do Senhor; serão capturados como por inimigos experientes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega é condensada e também pode ser entendida como “como pessoas afugentadas pela guerra”.
    reason: alternative_reading
lexical_decisions:
- source_word: φεύξονται
  choice: fugirão
  rationale: Expressa diretamente a ideia futura de retirada ou fuga.
- source_word: ὡς διωκόμενοι πολέμου
  choice: como quem é perseguido pela guerra
  rationale: Preserva a formulação grega comprimida e sua imagem militar sem definir além do texto como a guerra exerce a perseguição.
- source_word: ἀπὸ ὁσίων
  choice: dos piedosos
  rationale: Neste contexto, ὅσιοι designa pessoas devotas ou fiéis; “piedosos” também evita confundi-lo com o termo mais geral para “santos”.
- source_word: καταδιώξονται
  choice: perseguirão
  rationale: Mantém o sentido intensivo de perseguição e o paralelismo verbal do período.
- source_word: καταλήψονται
  choice: os alcançarão
  rationale: Na sequência de perseguir, “alcançar” é natural e distingue este verbo da captura passiva no fim do versículo.
- source_word: οἱ ποιοῦντες ἀνομίαν
  choice: os que praticam a iniquidade
  rationale: A construção participial descreve uma conduta característica ou contínua, preservada por “praticam”.
- source_word: τὸ κρίμα Κυρίου
  choice: o julgamento do Senhor
  rationale: Tradução natural que conserva κρίμα como julgamento e κύριος como Senhor.
- source_word: ὡς ὑπὸ πολεμίων ἐμπείρων καταλημφθήσονται
  choice: serão capturados como por inimigos experientes
  rationale: Preserva a voz passiva, a comparação e a imagem de adversários experimentados, sem acrescentar um referente humano inexistente no grego.
theological_decisions:
- issue: Tradução de κύριος em τὸ κρίμα Κυρίου
  choice: o julgamento do Senhor
  alternative: o juízo do Senhor
  rationale: “Senhor” segue diretamente o grego κύριος sem introduzir uma forma do nome divino não presente no texto; “julgamento” comunica κρίμα com clareza contemporânea.
- issue: Identidade de ὅσιοι
  choice: os piedosos
  alternative: os santos / os fiéis
  rationale: A escolha mantém a referência a pessoas caracterizadas pela devoção sem transformar o termo em um título eclesiástico nem identificar o grupo mais precisamente do que permite o grego.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe fluente. A repetição de perseguir/perseguidos e a imagem militar foram mantidas. “Piedosos” foi preferido a “santos” para representar ὅσιοι neste contexto.
