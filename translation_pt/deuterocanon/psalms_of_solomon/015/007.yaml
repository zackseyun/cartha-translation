  source_fidelity: A tradução preserva adequadamente a oração temporal (ὅταν), o sujeito singular elíptico de ἐξέλθῃ, a direção hostil de ἐφʼ ἁμαρτωλοὺς, a procedência expressa por ἀπὸ προσώπου Κυρίου e a finalidade do infinitivo ὀλεθρεύσαι. “Tudo o que pertence aos pecadores” é uma representação idiomática e suficientemente ampla de πᾶσαν ὑπόστασιν ἁμαρτωλῶν.
  naturalness: O português é moderno, claro e de registro solene apropriado. A sequência “sair da presença do Senhor contra os pecadores” acompanha de perto a construção grega e permanece compreensível em português; o sujeito não expresso preserva corretamente a elipse contextual.
