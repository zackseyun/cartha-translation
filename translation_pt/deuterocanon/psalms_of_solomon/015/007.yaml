  text: when it goes out against sinners from the presence of the Lord[a], to destroy every possession of sinners.
translation:
  language: pt
  text: quando sair da presença do Senhor contra os pecadores, para destruir tudo o que pertence aos pecadores.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os bens dos pecadores”; o termo grego também pode se referir à subsistência ou a tudo aquilo em que eles se apoiam.
    reason: Preserva a amplitude semântica de ὑπόστασις, que pode indicar posses, recursos, subsistência ou base de sustentação.
lexical_decisions:
- source_word: ὅταν
  choice: quando
  rationale: Introduz uma oração temporal; “quando” é natural e não impõe a ideia de repetição que “sempre que” poderia sugerir.
- source_word: ἐξέλθῃ
  choice: sair
  rationale: O sujeito singular fica implícito no grego e é recuperado do contexto anterior. O infinitivo pessoal não expresso em português preserva essa elipse sem especificar “ele” ou “ela”.
- source_word: ἐφʼ ἁμαρτωλοὺς
  choice: contra os pecadores
  rationale: Com verbo de movimento, ἐπί indica direção e, neste contexto de juízo, orientação hostil.
- source_word: ἀπὸ προσώπου Κυρίου
  choice: da presença do Senhor
  rationale: Traduz o idioma que indica procedência de diante da face ou presença do Senhor, em linguagem portuguesa clara e digna.
- source_word: ὀλεθρεύσαι
  choice: para destruir
  rationale: O infinitivo expressa a finalidade da saída e comunica diretamente a ideia de causar destruição completa.
- source_word: πᾶσαν ὑπόστασιν ἁμαρτωλῶν
  choice: tudo o que pertence aos pecadores
  rationale: No grego judaico helenístico, ὑπόστασις pode designar bens, propriedade, recursos ou aquilo que constitui a subsistência de alguém. A formulação principal comunica naturalmente a leitura possessiva sem restringir o referente a um único objeto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A ausência de pronome antes de “sair” preserva o sujeito implícito do grego; a ordem foi ajustada levemente para tornar inequívoca a procedência “da presença do Senhor”.
