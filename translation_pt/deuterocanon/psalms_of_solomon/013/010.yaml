lexical_decisions:
- source_word: ἁμαρτωλοὶ
  choice: os pecadores
  rationale: Traduz diretamente o substantivo grego, que designa pessoas caracterizadas pelo pecado, sem substituí-lo pela categoria mais interpretativa «os perversos».
- source_word: ἀρθήσονται
  choice: serão levados
  rationale: O futuro passivo de αἴρω comunica que serão tirados ou removidos. «Serão levados» preserva a voz passiva e se liga naturalmente ao destino expresso por «à destruição».
- source_word: εἰς ἀπώλειαν
  choice: à destruição
  rationale: Mantém o sentido grave de ruína ou destruição e reproduz de modo natural em português a direção ou o resultado indicado por εἰς.
- source_word: μνημόσυνον
  choice: memória
  rationale: Neste contexto, refere-se à lembrança que permanece de alguém. «Memória» é clara, poética e permite conservar a construção passiva do grego.
- source_word: ἔτι
  choice: já não
  rationale: Com a negação e o verbo no futuro, «já não» expressa idiomaticamente a cessação duradoura indicada por οὐχ ... ἔτι.
