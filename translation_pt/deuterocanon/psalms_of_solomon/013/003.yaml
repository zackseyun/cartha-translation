  yaml_path: translation/deuterocanon/psalms_of_solomon/013/003.yaml
  text: Savage beasts rushed at them; with their teeth they tore at their flesh, and with their molars they crushed their bones; and from all these things the Lord rescued us. rushed at them; with their teeth they tore at their flesh, and with their molars they crushed their bones; and from all these things the Lord rescued us.
translation:
  language: pt
  text: Feras malignas avançaram contra eles; com seus dentes, arrancavam-lhes a carne e, com seus molares, esmagavam-lhes os ossos. E de tudo isso o Senhor nos livrou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηρία ... πονηρά
  choice: feras malignas
  rationale: Preserva tanto a imagem de animais ferozes quanto a qualificação moral ou nociva de πονηρά, sem reduzir a expressão apenas a 'selvagens'.
- source_word: ἐπέδραμοσαν αὐτοῖς
  choice: avançaram contra eles
  rationale: Expressa o movimento hostil e súbito do verbo ἐπιτρέχω com português natural.
- source_word: ἔτιλλον σάρκας αὐτῶν
  choice: arrancavam-lhes a carne
  rationale: ἔτιλλον indica puxar, arrancar ou dilacerar; o imperfeito é mantido pelo aspecto durativo de 'arrancavam'.
- source_word: ἐν ταῖς μυλαῖς
  choice: com os molares
  rationale: μύλαι designa literalmente os dentes usados para triturar, isto é, os molares.
- source_word: ἔθλων ὀστᾶ αὐτῶν
  choice: esmagavam-lhes os ossos
  rationale: Reproduz a ação intensa e continuada de triturar ou esmagar expressa por ἔθλων.
- source_word: ἐρρύσατο ἡμᾶς
  choice: nos livrou
  rationale: Traduz o aoristo de ῥύομαι como uma ação efetiva de resgate ou livramento.
theological_decisions:
- issue: Referência divina em Κύριος
  choice: o Senhor
  alternative: Yahweh
  rationale: O texto grego traz Κύριος sem o nome divino explícito; 'o Senhor' preserva diretamente a forma da fonte.
- issue: Mudança de 'eles' para 'nós'
  choice: manter a alternância pronominal
  alternative: uniformizar todos os referentes
  rationale: O grego passa deliberadamente de αὐτοῖς/αὐτῶν ('eles/deles') para ἡμᾶς ('nós'); a tradução preserva essa tensão referencial sem explicá-la.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A duplicação acidental presente na camada inglesa não foi reproduzida, pois não existe no texto grego.
