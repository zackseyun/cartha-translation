  yaml_path: translation/deuterocanon/psalms_of_solomon/013/006.yaml
  text: For the discipline of the righteous in ignorance is not like the destruction of the sinner[c][b][a];
translation:
  language: pt
  text: Pois a disciplina dos justos em ignorância[a] não é como a destruição do pecador.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como “por faltas cometidas por ignorância” ou, mais literalmente, “na ignorância”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão ou explicação do que precede; “pois” conserva naturalmente esse valor causal em português.
- source_word: οὐχ ὁμοία
  choice: não é como
  rationale: Mantém a comparação negativa entre dois tratamentos ou resultados, em linguagem corrente e sem reduzir a expressão a uma simples desigualdade quantitativa.
- source_word: ἡ παιδεία
  choice: a disciplina
  rationale: No contexto, designa correção ou tratamento formativo, em contraste com a destruição. “Disciplina” preserva tanto o aspecto corretivo quanto o formativo.
- source_word: τῶν δικαίων
  choice: dos justos
  rationale: Reproduz diretamente o genitivo plural e usa a designação bíblica corrente para esse grupo.
- source_word: ἐν ἀγνοίᾳ
  choice: em ignorância
  rationale: A formulação próxima do grego preserva a ambiguidade quanto à relação exata da ignorância com a disciplina e com os justos, sem inserir explicitamente “pecados”, palavra ausente do texto.
- source_word: ἡ καταστροφὴ
  choice: a destruição
  rationale: Expressa a ruína decisiva indicada pelo substantivo e sustenta o forte contraste com a disciplina corretiva.
- source_word: τοῦ ἁμαρτωλοῦ
  choice: do pecador
  rationale: Conserva o singular representativo e a categoria moral expressa pelo original.
theological_decisions:
- issue: Natureza do sofrimento dos justos
  choice: Manter o contraste entre a disciplina dos justos e a destruição do pecador.
  alternative: Explicitar que os justos recebem correção por pecados cometidos sem intenção.
  rationale: O contexto favorece uma disciplina corretiva em oposição à ruína do pecador, mas o versículo não explicita “pecados” nem define plenamente a função de ἐν ἀγνοίᾳ. A tradução conserva essa tensão.
translation_notes:
  register: Português moderno, sóbrio e de leitura ampla, com terminologia bíblica reconhecível. A construção “em ignorância” é deliberadamente mais formal para preservar a concisão e a ambiguidade do grego; a nota oferece a interpretação contextual mais explícita.
