base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/013/008.yaml
  text: For he will admonish a righteous man as a beloved son[c][b][a], and his discipline is like that of a firstborn.
translation:
  language: pt
  text: Pois ele advertirá um justo[a] como a um filho amado[b], e sua disciplina[c] será como a de um primogênito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o justo”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “um filho de amor”.
    reason: lexical_alternative
  - marker: c
    text: Ou “sua instrução” ou “sua formação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: νουθετήσει
  choice: advertirá
  rationale: O verbo indica uma advertência de caráter corretivo e formativo. “Advertirá” preserva esse sentido sem reduzi-lo a mera punição.
- source_word: δίκαιον
  choice: um justo
  rationale: O adjetivo substantivado está no singular e não tem artigo. “Um justo” mantém o foco individual e concorda com as imagens singulares de filho e primogênito.
- source_word: υἱὸν ἀγαπήσεως
  choice: um filho amado
  rationale: A construção genitiva pode ter valor qualitativo. “Filho amado” expressa isso de modo natural, enquanto a forma mais literal é registrada em nota.
- source_word: παιδεία
  choice: disciplina
  rationale: No contexto de correção paterna, o termo designa formação que inclui instrução e correção. “Disciplina” preserva essa amplitude melhor do que uma palavra restrita ao ensino.
- source_word: πρωτοτόκου
  choice: primogênito
  rationale: O adjetivo substantivado evoca o filho que ocupa a posição de primogênito; a tradução mantém a imagem sem acrescentar elementos ausentes do grego.
theological_decisions:
- issue: Referência de αὐτοῦ em ἡ παιδεία αὐτοῦ
  choice: “sua disciplina”, mantendo o pronome potencialmente ambíguo
  alternative: “a disciplina que ele lhe dá” ou “a disciplina do justo”
  rationale: O grego permite entender o genitivo em relação ao agente divino ou ao justo disciplinado. Tornar explícita uma dessas relações resolveria uma ambiguidade que o texto não resolve formalmente.
- issue: Elipse verbal na segunda oração
  choice: acrescentar “será” para formar uma oração natural em português
  alternative: “e sua disciplina, como a de um primogênito”
  rationale: A segunda oração grega não traz verbo expresso. O futuro copulativo deixa clara a comparação em português sem alterar seu conteúdo básico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por construções naturais no Brasil. A repetição de “como a um” e “como a de” conserva as duas comparações do grego; as notas registram alternativas relevantes sem sobrecarregar o texto principal.
