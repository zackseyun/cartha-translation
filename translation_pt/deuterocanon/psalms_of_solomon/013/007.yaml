  yaml_path: translation/deuterocanon/psalms_of_solomon/013/007.yaml
  text: A righteous man is disciplined in secret[c][b][a], so that the sinner may not gloat over the righteous man.
translation:
  language: pt
  text: O justo é disciplinado em segredo[a], para que o pecador não se alegre à custa do justo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sob contenção” ou “com moderação”. O termo grego também pode indicar restrição ou comedimento.
    reason: lexical_alternative
  - marker: b
    text: Ou “não se alegre maliciosamente com o que acontece ao justo” ou “não triunfe sobre o justo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν περιστολῇ
  choice: em segredo
  rationale: 'Embora περιστολή possa indicar contenção ou restrição, aqui a ideia de encobrimento ou ocultação explica melhor a oração final: o pecador não presencia a disciplina do justo e, assim, não tem ocasião de exultar sobre ele.'
- source_word: παιδεύεται
  choice: é disciplinado
  rationale: O verbo abrange instrução e correção; neste contexto, “é disciplinado” comunica adequadamente a ação corretiva sem especificar indevidamente sua forma.
- source_word: δίκαιος
  choice: o justo
  rationale: O singular masculino tem valor representativo. “O justo” é uma formulação proverbial natural em português e preserva a forma e o contraste moral do grego.
- source_word: ἐπιχαρῇ
  choice: exulte sobre
  rationale: O verbo composto descreve alegria hostil diante da situação de outra pessoa. “Exulte sobre” preserva a relação expressa no grego e o sentido de triunfo malicioso, embora a construção seja deliberadamente solene.
- source_word: ὁ ἁμαρτωλός
  choice: o pecador
  rationale: O artigo e o singular apresentam um tipo representativo, em contraste direto com “o justo”.
theological_decisions:
- issue: Masculino genérico em δίκαιος
  choice: o justo
  alternative: a pessoa justa
  rationale: A expressão grega está no masculino singular e tem força representativa. A tradução preserva essa forma sem restringir a aplicação do provérbio somente aos homens.
- issue: Natureza da disciplina divina ou providencial
  choice: é disciplinado
  alternative: é castigado
  rationale: O texto não identifica explicitamente o agente nem limita παιδεύεται a castigo punitivo. A voz passiva e a amplitude semântica foram mantidas para não resolver além do texto a natureza ou o agente da disciplina.
translation_notes:
  register: Português moderno, claro e digno, com forma proverbial. “Exulte sobre” conserva de modo conciso a imagem grega de alegria hostil dirigida contra o justo; a nota oferece formulações mais idiomáticas. A repetição de “o justo” reproduz a ênfase do original e evita possível ambiguidade pronominal.
