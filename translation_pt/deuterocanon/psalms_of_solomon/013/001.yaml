  text: The right hand of the Lord sheltered me[b][a]; the right hand of the Lord spared us.
translation:
  language: pt
  text: A mão direita do Senhor me abrigou[a]; a mão direita do Senhor nos poupou[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “me cobriu”.'
