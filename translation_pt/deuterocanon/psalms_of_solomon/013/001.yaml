    text: 'Ou: “teve compaixão de nós”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεξιὰ
  choice: mão direita
  rationale: O adjetivo feminino substantivado pressupõe «mão»; esta formulação natural preserva a metáfora bíblica de poder e proteção.
- source_word: Κυρίου
  choice: do Senhor
  rationale: O genitivo indica posse, e «Senhor» é a tradução corrente e adequada de κύριος neste contexto.
- source_word: ἐσκέπασέν
  choice: abrigou
  rationale: O verbo significa cobrir e, por extensão, dar proteção; «abrigou» comunica naturalmente os dois aspectos no contexto.
- source_word: με
  choice: me
  rationale: Pronome objeto de primeira pessoa do singular.
- source_word: ἐφείσατο
  choice: poupou
  rationale: O verbo, construído com genitivo, expressa poupar alguém ou abster-se de destruí-lo; «poupou» é conciso e mantém esse sentido.
- source_word: ἡμῶν
  choice: nos
  rationale: Embora esteja no genitivo grego, é o complemento pessoal exigido por φείδομαι e corresponde idiomaticamente a «nos» em português.
theological_decisions:
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Soberano
  rationale: «Senhor» é a equivalência bíblica tradicional e corrente, sem haver no verso razão contextual para adotar outra opção.
- issue: Mudança de «me» para «nos»
  choice: Preservar a alternância entre singular e plural
  alternative: Uniformizar ambos como singular ou plural
  rationale: O grego muda explicitamente de με para ἡμῶν; preservar essa tensão evita corrigir ou interpretar silenciosamente a perspectiva do salmista.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição de «a mão direita do Senhor» e a alternância entre «me» e «nos» foram mantidas conforme o grego.
