  text: For the destruction of the sinner is dreadful[a], and none of all these things will touch the righteous.
translation:
  language: pt
  text: Pois a destruição do pecador é terrível, e nada de tudo isso atingirá o justo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεινή
  choice: terrível
  rationale: Expressa a gravidade assustadora do adjetivo grego em português atual e modifica diretamente a ruína do pecador.
- source_word: καταστροφή
  choice: ruína
  rationale: Abrange a ideia de destruição, queda ou devastação sem limitar o sentido a uma derrota militar.
- source_word: ἁμαρτωλοῦ
  choice: do pecador
  rationale: Preserva o substantivo singular e sua força moral de modo direto e idiomático.
- source_word: ἅψεται
  choice: atingirá
  rationale: No contexto de calamidades que não alcançam o justo, «atingirá» comunica naturalmente o sentido de tocar ou vir sobre alguém.
- source_word: δικαίου
  choice: o justo
  rationale: Conserva o singular representativo do grego como designação de uma pessoa justa, sem acrescentar qualificações.
- source_word: οὐδὲν ἐκ πάντων τούτων
  choice: nada de tudo isso
  rationale: Formulação natural que mantém tanto a negação absoluta de οὐδέν quanto a ênfase totalizante de πάντων.
theological_decisions:
- issue: Relação entre a ruína do pecador e a segurança do justo
  choice: mas
  alternative: e
  rationale: Embora καί costume significar «e», aqui as duas orações estabelecem um contraste claro; «mas» torna explícita essa relação discursiva sem alterar o conteúdo teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem «terrível é a ruína» preserva a ênfase inicial do predicativo grego sem soar excessivamente arcaica.
