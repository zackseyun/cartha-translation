  yaml_path: translation/deuterocanon/psalms_of_solomon/013/004.yaml
  text: The ungodly was troubled because of his transgressions[b][a], lest he be taken away with sinners.
translation:
  language: pt
  text: O ímpio ficou perturbado por causa de suas transgressões, com receio de ser levado[a][b] junto com os pecadores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não quando for levado junto com os pecadores”. A expressão grega μὴ ὅτε συμπαραληφθῇ é sintaticamente difícil; o texto principal entende μή em sentido preventivo ou apreensivo.'
    reason: alternative_reading
  - marker: b
    text: “Levado junto” também pode ser traduzido por “arrastado junto” ou “levado juntamente”, ressaltando o destino compartilhado com os pecadores.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράχθη
  choice: ficou perturbado
  rationale: O passivo de ταράσσω pode indicar perturbação interior, inquietação ou abalo. “Ficou perturbado” é natural em português e não especifica indevidamente a natureza dessa perturbação.
- source_word: ὁ ἀσεβής
  choice: o ímpio
  rationale: ἀσεβής designa quem vive sem reverência a Deus; “ímpio” conserva esse sentido religioso e ético no registro bíblico corrente.
- source_word: διὰ παραπτώματα αὐτοῦ
  choice: por causa de suas transgressões
  rationale: διά com acusativo tem sentido causal neste contexto. παραπτώματα se refere a violações ou faltas morais concretas, bem expresso por “transgressões”.
- source_word: μὴ ὅτε συμπαραληφθῇ
  choice: com receio de ser levado
  rationale: A construção grega é sintaticamente difícil. A tradução principal entende μή em sentido preventivo ou apreensivo; “com receio de” comunica essa relação de modo natural, enquanto a nota preserva a alternativa temporal mais literal.
- source_word: μετὰ τῶν ἁμαρτωλῶν
  choice: junto com os pecadores
  rationale: A expressão indica participação no mesmo destino ou juízo. “Junto com” também torna perceptível a ideia associativa presente em συμπαραληφθῇ.
theological_decisions:
- issue: Natureza do destino compartilhado com os pecadores
  choice: ser levado junto com os pecadores
  alternative: ser destruído ou condenado com os pecadores
  rationale: O texto sugere um destino judicial compartilhado, mas não explicita sua natureza. A tradução evita definir esse destino como destruição ou condenação, preservando a abertura do grego.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário bíblico amplamente reconhecível. A formulação “com receio de” oferece uma leitura natural da construção preventiva sem eliminar a alternativa sintática registrada em nota.
