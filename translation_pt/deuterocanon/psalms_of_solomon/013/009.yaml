base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/013/009.yaml
  text: For the Lord will spare his faithful ones[a], and he will wipe away their trespasses by discipline[c][b]; for the life of the righteous is forever.
translation:
  language: pt
  text: Pois o Senhor poupará os seus fiéis[a] e apagará as transgressões deles por meio da disciplina[b]; pois a vida dos justos é para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os seus piedosos” ou “os que lhe são leais”.
    reason: lexical_alternative
  - marker: b
    text: Ou “apagará as transgressões deles na disciplina” ou “com correção”.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: φείσεται
  choice: poupará
  rationale: Preserva o sentido concreto de não aplicar plenamente o juízo, em harmonia com a correção mencionada em seguida.
- source_word: Κύριος
  choice: o Senhor
  rationale: Forma portuguesa natural para o título divino; embora anartro em grego, funciona claramente como título definido.
- source_word: ὁσίων
  choice: fiéis
  rationale: Neste livro, designa os que demonstram devoção e lealdade à aliança; evita confundi-lo com ἅγιοι e também evita as conotações eclesiásticas de 'santos'.
- source_word: παραπτώματα
  choice: transgressões
  rationale: Expressa faltas ou delitos morais de modo digno e corrente, com maior precisão que o termo mais amplo 'pecados'.
- source_word: ἐξαλείψει
  choice: apagará
  rationale: Conserva a imagem de remover ou obliterar por completo as faltas e soa natural em português moderno.
- source_word: ἐν παιδείᾳ
  choice: por meio da disciplina
  rationale: Torna explícito o provável valor instrumental de ἐν e apresenta παιδεία como correção formativa, sem excluir seu aspecto doloroso.
- source_word: δικαίων
  choice: dos justos
  rationale: Equivalente transparente e tradicional para δικαίων neste contexto.
- source_word: εἰς τὸν αἰῶνα
  choice: é para sempre
  rationale: Comunica com clareza a duração permanente expressa pela locução grega sem arcaísmo nem sobre-especificação.
theological_decisions:
- issue: Relação entre misericórdia e disciplina
  choice: A ação de poupar os fiéis inclui apagar suas transgressões por meio da disciplina corretiva.
  alternative: A disciplina pode ser entendida como esfera ou circunstância da remoção das transgressões, ou sobretudo como castigo.
  rationale: A sintaxe liga estreitamente o ato de poupar à remoção das faltas ἐν παιδείᾳ. A tradução mantém juntas a compaixão divina e a correção moral, sem reduzir a disciplina a mera punição nem fazer do perdão uma isenção de toda correção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. 'Fiéis' funciona como substantivo coletivo e preserva a identidade comunitária de ὅσιοι. 'Por meio da disciplina' evita que 'com disciplina' pareça apenas indicar modo e conserva o provável sentido instrumental.
