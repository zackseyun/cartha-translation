  text: But upon the godly is the mercy of the Lord[c][b][a], and upon those who fear him is his mercy.
translation:
  language: pt
  text: Mas sobre os piedosos está a misericórdia do Senhor, e sobre os que o temem está a sua misericórdia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Os que o temem” também pode ser expresso como “os que o reverenciam”; o grego, porém, conserva a linguagem bíblica mais forte do temor de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁσίους
  choice: os piedosos
  rationale: Em Salmos de Salomão, ὅσιοι designa os que se distinguem por sua devoção e fidelidade religiosa. “Os piedosos” mantém esse sentido de grupo sem confundi-lo diretamente com ἅγιοι, normalmente associado a “santos”.
- source_word: ἔλεος
  choice: misericórdia
  rationale: É a correspondência direta e natural, preservando a repetição enfática nas duas partes do versículo.
- source_word: Κυρίου
  choice: do Senhor
  rationale: Tradução tradicional e clara de κύριος quando se refere a Deus.
- source_word: φοβουμένους
  choice: os que o temem
  rationale: Conserva a linguagem bíblica forte do temor de Deus, que inclui reverência, sem reduzi-la silenciosamente a esse único aspecto.
theological_decisions:
- issue: Se a linguagem do temor de Deus deve ser suavizada para “reverenciam”
  choice: os que o temem
  alternative: os que o reverenciam
  rationale: O grego usa φοβουμένους. “Temem” preserva a tensão e a amplitude do conceito bíblico, no qual reverência e temor não são necessariamente idênticos.
- issue: Como representar ὁσίους sem apagar sua distinção de ἅγιοι
  choice: os piedosos
  alternative: os santos; os fiéis; os devotos
  rationale: “Piedosos” expressa devoção religiosa e funciona como designação coletiva, evitando importar para o texto a terminologia eclesiástica potencialmente associada a “santos”.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A construção paralela e a repetição de “misericórdia” foram mantidas para refletir a forma e a ênfase do grego.
