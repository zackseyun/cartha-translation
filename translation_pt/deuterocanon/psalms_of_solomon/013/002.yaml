base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/013/002.yaml
  text: The arm of the Lord saved us from the sword passing through[b][a], from famine and the death of sinners.
translation:
  language: pt
  text: O braço do Senhor nos salvou da espada que passava, da fome e da morte dos pecadores.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “morte destinada aos pecadores” ou “morte causada pelos pecadores”.
    reason: alternative_reading
lexical_decisions:
- source_word: βραχίων
  choice: braço
  rationale: Preserva a metáfora corporal do poder salvador do Senhor, natural na linguagem bíblica portuguesa.
- source_word: Κυρίου
  choice: Senhor
  rationale: É a forma corrente para o título divino κύριος, sem introduzir no texto grego uma convenção tipográfica ligada ao nome divino hebraico.
- source_word: ἔσωσεν
  choice: salvou
  rationale: Traduz diretamente o aoristo e conserva tanto a ideia de livramento concreto quanto sua ressonância religiosa.
- source_word: ῥομφαίας
  choice: espada
  rationale: É o equivalente português normal para a arma indicada por ῥομφαία e mantém a imagem de calamidade violenta.
- source_word: διαπορευομένης
  choice: que passava
  rationale: O particípio feminino concorda com 'espada' e descreve seu movimento através de uma região; a formulação evita acrescentar um objeto ou território não expresso no grego.
- source_word: λιμοῦ
  choice: fome
  rationale: No português contemporâneo, 'fome' pode designar naturalmente a calamidade coletiva e é mais corrente do que 'carestia'.
- source_word: θανάτου
  choice: morte
  rationale: Mantém o sentido lexical direto, sem ampliá-lo para 'destruição'.
- source_word: ἁμαρτωλῶν
  choice: dos pecadores
  rationale: Reproduz de modo transparente o genitivo grego, deixando sua relação precisa com 'morte' em aberto.
theological_decisions:
- issue: Relação do genitivo em θανάτου ἁμαρτωλῶν
  choice: morte dos pecadores
  alternative: morte destinada aos pecadores; morte causada pelos pecadores
  rationale: O genitivo é compacto e permite mais de uma relação semântica. O texto principal conserva a leitura formalmente mais próxima, enquanto a nota registra possibilidades sem decidir além da evidência grega.
translation_notes:
  register: Português moderno, claro e digno, com cadência bíblica discreta. A repetição de “da” preserva a sequência grega das três ameaças; “que passava” mantém a imagem de uma espada em movimento sem inserir “pela terra” ou expressão semelhante ausente do original.
