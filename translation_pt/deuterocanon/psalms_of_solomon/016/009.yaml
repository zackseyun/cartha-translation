  text: Direct the works of my hands in your place, and guard my steps in the remembrance of you.
translation:
  language: pt
  text: Dirige as obras das minhas mãos no teu lugar[a] e guarda os meus passos na lembrança de ti.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na tua presença”.
    reason: lexical_alternative
  - marker: b
    text: Isto é, “enquanto me lembro de ti”.
    reason: ambiguity_clarification
lexical_decisions:
- source_word: κατεύθυνον
  choice: Dirige
  rationale: O imperativo pede que Deus oriente e encaminhe corretamente as ações do salmista; “dirige” conserva tanto a ideia de guia quanto a de pôr no rumo certo.
- source_word: τὰ ἔργα τῶν χειρῶν μου
  choice: as obras das minhas mãos
  rationale: Mantém a expressão concreta e semítica refletida no grego, que abrange o trabalho e as ações do salmista.
- source_word: ἐν τόπῳ σου
  choice: no teu lugar
  rationale: Traduz diretamente τόπος, “lugar”, sem substituir no texto principal a imagem incomum por uma interpretação contextual.
- source_word: τὰ διαβήματά μου
  choice: os meus passos
  rationale: Expressão natural em português para os movimentos e, figuradamente, o curso de vida do salmista.
- source_word: ἐν τῇ μνήμῃ σου
  choice: na lembrança de ti
  rationale: 'Preserva o substantivo μνήμη e entende o genitivo como objetivo: é Deus quem o salmista mantém na lembrança, em harmonia com o contexto próximo.'
- source_word: διαφύλαξον
  choice: guarda
  rationale: Verbo forte e conciso que comunica conservar, proteger e manter seguro.
theological_decisions:
- issue: Quem se lembra em ἐν τῇ μνήμῃ σου
  choice: A expressão se refere à lembrança que o salmista tem de Deus.
  alternative: Deus se lembra do salmista.
  rationale: O genitivo pode parecer ambíguo isoladamente, mas o paralelo contextual favorece o sentido objetivo, “lembrança de ti”; a nota registra uma formulação portuguesa mais explícita sem introduzir uma ideia ausente.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas de segunda pessoa singular coerentes com a oração poética. Conserva-se no texto principal a formulação incomum “no teu lugar” por transparência ao grego, enquanto a alternativa contextual mais natural aparece em nota.
