  yaml_path: translation/deuterocanon/psalms_of_solomon/016/014.yaml
  text: If a person is rebuked by means of his ruin[b][a], your testing is in his flesh and in poverty.
translation:
  language: pt
  text: Se uma pessoa for repreendida por meio de sua ruína,[a][b] tua provação está em sua carne e na pobreza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se uma vida for censurada sob o poder de sua ruína”. O grego desta oração é difícil.'
    reason: alternative_reading
  - marker: b
    text: 'Tradução mais literal: “Se uma alma for repreendida pela mão de sua destruição, tua provação está em sua carne”.'
    reason: previous_rendering
lexical_decisions:
- source_word: ἐλέγχηται (ἐλέγχω)
  choice: for repreendida
  rationale: Mantém a ideia de censura ou correção, sem restringir o verbo a uma condenação judicial.
- source_word: ψυχήν (ψυχή)
  choice: uma pessoa
  rationale: Neste contexto semitizante, ψυχή pode designar a pessoa inteira; essa opção também torna natural a referência masculina de αὐτοῦ no grego.
- source_word: ἐν χειρὶ
  choice: por meio de
  rationale: Expressa o valor instrumental provável do hebraísmo, evitando que a tradução literal 'na mão de' obscureça o sentido.
- source_word: ἀπωλίας
  choice: ruína
  rationale: Transmite destruição ou perda devastadora em linguagem natural e preserva a dificuldade da relação com o pronome 'sua'.
- source_word: δοκιμασία
  choice: provação
  rationale: Comunica uma experiência que põe alguém à prova e revela sua condição, adequando-se ao tom poético.
- source_word: σαρκί (σάρξ)
  choice: carne
  rationale: Conserva o termo concreto do grego e sua referência ao sofrimento corporal.
- source_word: πενίᾳς
  choice: pobreza
  rationale: É o equivalente moderno mais direto para privação ou carência material.
theological_decisions:
- issue: Sentido da expressão difícil ἐν χειρὶ ἀπωλίας αὐτοῦ
  choice: por meio de sua ruína
  alternative: na mão de sua destruição / sob o poder de sua ruína
  rationale: O grego transmitido é sintaticamente difícil. A tradução principal representa o provável valor instrumental do semitismo ἐν χειρί, enquanto as notas preservam leituras mais literais e a incerteza do texto.
- issue: Referente de ψυχήν
  choice: uma pessoa
  alternative: uma alma / uma vida
  rationale: O uso semitizante permite entender ψυχή como a pessoa inteira. A alternativa lexical é registrada porque 'alma' ou 'vida' também corresponde formalmente ao termo grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem dos marcadores [a][b] foi regularizada, e as notas preservam a ambiguidade lexical e sintática do grego.
