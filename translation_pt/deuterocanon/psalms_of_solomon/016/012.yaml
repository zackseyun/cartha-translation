  yaml_path: translation/deuterocanon/psalms_of_solomon/016/012.yaml
  text: But establish my soul with favor and gladness[a]; when you strengthen my soul[b], what has been given will be enough for me.
translation:
  language: pt
  text: Mas firma a minha alma com favor e alegria[a]; quando fortaleceres a minha alma, o que foi dado me bastará[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «boa vontade» ou «beneplácito», em vez de «favor».
    reason: lexical_alternative
  - marker: b
    text: Ou «será suficiente para mim», em vez de «me bastará».
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδοκία
  choice: favor
  rationale: O substantivo pode indicar boa vontade, benevolência ou beneplácito. «Favor» é natural no contexto de oração e não acrescenta um sentido teológico técnico.
- source_word: ἱλαρότητος
  choice: alegria
  rationale: O termo comunica disposição alegre ou jovialidade. «Alegria» mantém a dignidade poética e forma uma combinação natural com «favor».
- source_word: στήρισον
  choice: firma
  rationale: O imperativo significa tornar firme ou estabelecer. «Firma» conserva a imagem de estabilidade e mantém distinção em relação a ἐνισχῦσαι, traduzido por «fortalecer» na oração seguinte.
- source_word: ψυχήν
  choice: alma
  rationale: Neste contexto devocional, «alma» preserva o sentido da pessoa interior e o tom da oração.
- source_word: ἐν τῷ ἐνισχῦσαί σε
  choice: quando fortaleceres
  rationale: A construção com ἐν e infinitivo articular pode indicar a circunstância temporal. «Quando fortaleceres» expressa isso de modo claro e natural, preservando Deus como agente.
- source_word: ἀρκέσει μοι
  choice: me bastará
  rationale: O futuro exprime suficiência. «Me bastará» é idiomático, conciso e adequado ao registro poético.
- source_word: τὸ δοθέν
  choice: o que foi dado
  rationale: O particípio substantivado permanece deliberadamente amplo. Esta formulação evita especificar como «dom» aquilo que o grego simplesmente apresenta como dado.
