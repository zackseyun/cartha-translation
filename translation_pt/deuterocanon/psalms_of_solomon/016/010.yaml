  text: Clothe my tongue and my lips with words of truth[c][b][a]; keep anger and senseless wrath far from me.
translation:
  language: pt
  text: Reveste minha língua e meus lábios de palavras de verdade[a]; afasta de mim a ira e o furor insensato[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Envolve”, “cerca”, “guarda” ou “refreia minha língua e meus lábios com palavras de verdade”.
    reason: lexical_alternative
  - marker: b
    text: Ou “furor irracional” ou “raiva sem razão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: περίστειλον
  choice: Reveste
  rationale: O verbo pode descrever o ato de envolver, cobrir ou vestir. “Reveste” conserva a imagem concreta e poética de envolver a língua e os lábios com palavras verdadeiras, sem reduzir o pedido apenas a controlar a fala.
- source_word: γλῶσσάν μου καὶ τὰ χείλη μου
  choice: minha língua e meus lábios
  rationale: Mantém os referentes corporais explícitos e o paralelismo poético do grego, em vez de generalizá-los como “minha fala” ou “minha boca”.
- source_word: ἐν λόγοις ἀληθείας
  choice: de palavras de verdade
  rationale: Com “reveste”, a preposição “de” produz uma construção natural em português e preserva tanto o plural λόγοις quanto a formulação genitiva ἀληθείας.
- source_word: ὀργὴν
  choice: ira
  rationale: “Ira” é uma correspondência direta e de registro poético, além de permitir distinguir o termo seguinte, θυμός.
- source_word: θυμὸν ἄλογον
  choice: furor insensato
  rationale: “Furor” preserva a intensidade e a distinção em relação a ὀργή; “insensato” comunica a falta de razão ou juízo expressa por ἄλογον sem soar excessivamente técnico.
- source_word: μακρὰν ποίησον ἀπʼ ἐμοῦ
  choice: afasta de mim
  rationale: Expressa em português corrente e digno o pedido para que essas disposições sejam postas longe do orante, evitando o literalismo pouco natural “faz longe de mim”.
