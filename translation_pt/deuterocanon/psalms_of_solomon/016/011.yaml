  yaml_path: translation/deuterocanon/psalms_of_solomon/016/011.yaml
  text: Keep grumbling and faintheartedness in affliction far from me[a], when I sin, as you discipline me for repentance.
translation:
  language: pt
  text: Afasta de mim a murmuração e o desânimo na aflição, caso erres ao me disciplinares para que eu me arrependa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego transmitido diz literalmente “caso erres” ou “caso peques”, dirigindo-se a Deus. A formulação é difícil e talvez reflita uma corrupção textual; por isso, alguns entendem ou corrigem: “quando eu pecar, ao me disciplinares para que eu me arrependa”.'
    reason: Preservar e explicar a dificuldade textual e teológica da segunda pessoa ἁμαρτήσῃς, registrando também a leitura contextual alternativa.
lexical_decisions:
- source_word: γογγυσμόν
  choice: murmuração
  rationale: Expressa queixa murmurada ou resmungo, preservando o tom de resistência interior sem recorrer a linguagem excessivamente coloquial.
- source_word: ὀλιγοψυχίαν
  choice: desânimo
  rationale: O termo indica abatimento, falta de coragem ou pequenez de ânimo; “desânimo” é natural e claro em português moderno.
- source_word: ἐν θλίψει
  choice: na aflição
  rationale: Mantém o sentido de sofrimento, opressão ou angústia e se ajusta ao registro de oração.
- source_word: μάκρυνον ἀπʼ ἐμοῦ
  choice: Afasta de mim
  rationale: Reproduz de modo idiomático o imperativo que pede que essas atitudes sejam postas longe do orante.
- source_word: ἐὰν ἁμαρτήσῃς
  choice: caso erres
  rationale: O texto grego transmitido traz inequivocamente a segunda pessoa do singular. “Erres” preserva essa forma e a amplitude de ἁμαρτάνω (“errar”, “falhar”, “pecar”), sem corrigir silenciosamente a dificuldade textual.
- source_word: ἐν τῷ σε παιδεύειν
  choice: ao me disciplinares
  rationale: A construção com infinitivo articular tem valor temporal; σε é o sujeito acusativo, “tu”, enquanto “me” é suprido pelo contexto como objeto da disciplina.
- source_word: εἰς ἐπιστροφήν
  choice: para que eu me arrependa
  rationale: Comunica naturalmente tanto a direção indicada por εἰς quanto a ideia de retorno ou arrependimento presente em ἐπιστροφή.
theological_decisions:
- issue: Atribuição aparente de erro a Deus em ἐὰν ἁμαρτήσῃς
  choice: 'Manter no texto principal a segunda pessoa: “caso erres”'
  alternative: “quando eu pecar” ou “caso eu peque”
  rationale: Embora a leitura contextual “quando eu pecar” seja teologicamente mais esperada e possa refletir uma corrupção textual, o testemunho grego fornecido diz literalmente “caso erres/peques”. A tradução preserva a dificuldade genuína e a explica em nota, em vez de adotar uma emenda não atestada sem sinalização.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário de oração compreensível no Brasil e em outros contextos lusófonos. A sintaxe permanece próxima do grego, e a nota torna explícita a dificuldade textual sem resolvê-la silenciosamente.
