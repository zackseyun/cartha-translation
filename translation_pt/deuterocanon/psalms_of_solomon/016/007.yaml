  yaml_path: translation/deuterocanon/psalms_of_solomon/016/007.yaml
  text: Restrain me[a], O God, from evil sin and from every evil woman who causes a foolish man to stumble.
translation:
  language: pt
  text: Refreia-me[a], ó Deus, do pecado perverso e de toda mulher perversa que faz um insensato tropeçar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Exerce domínio sobre mim, ó Deus, afastando-me de...”.'
    reason: A construção ἐπικράτησόν μου ... ἀπό pode ser entendida como um pedido para Deus exercer domínio sobre o orante e mantê-lo afastado do que segue; a tradução principal expressa o sentido contextual de contenção.
lexical_decisions:
- source_word: ἐπικράτησόν μου
  choice: Refreia-me
  rationale: O imperativo de ἐπικρατέω pede que Deus exerça domínio sobre o orante. Com ἀπό, o contexto expressa contenção ou afastamento do perigo; “Refreia-me” comunica essa força com naturalidade em português, sem apagar na nota a imagem mais literal de governo ou domínio.
- source_word: ἀπὸ ἁμαρτίας πονηρᾶς
  choice: do pecado perverso
  rationale: ἀπό indica separação ou afastamento. “Perverso” preserva a forte avaliação moral de πονηρός e soa mais natural junto de “pecado” do que uma reprodução rígida como “pecado mau”.
- source_word: καὶ ἀπὸ πάσης γυναικὸς πονηρᾶς
  choice: e de toda mulher perversa
  rationale: πάσης com o singular tem sentido abrangente. A repetição de “perversa” conserva a repetição de πονηρά no grego e mantém a ligação verbal entre o pecado e a mulher descrita.
- source_word: σκανδαλιζούσης
  choice: que faz ... tropeçar
  rationale: A expressão mantém a imagem concreta de σκανδαλίζω, isto é, pôr um obstáculo ou causar uma queda, imagem ainda clara e idiomática em português.
- source_word: ἄφρονα
  choice: um insensato
  rationale: ἄφρων caracteriza alguém sem bom senso ou sabedoria. “Insensato” é corrente no registro sapiencial e preserva o masculino singular expresso pela forma grega.
theological_decisions:
- issue: Alcance de ἄφρονα
  choice: um insensato
  alternative: uma pessoa insensata
  rationale: A forma grega é masculina singular e, neste contexto, provavelmente designa um homem. A tradução conserva essa referência sem generalizá-la silenciosamente.
- issue: Agência divina na petição
  choice: Refreia-me
  alternative: Governa-me para longe de
  rationale: A oração pede intervenção divina efetiva sobre o próprio orante, não apenas orientação. “Refreia-me” preserva essa agência, enquanto a nota registra a amplitude lexical de ἐπικρατέω.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Ó Deus” mantém o tom de oração; “insensato” preserva o registro sapiencial sem arcaísmo excessivo.
