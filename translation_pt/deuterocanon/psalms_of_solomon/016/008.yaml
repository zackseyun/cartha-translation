base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/008.yaml
  text: And do not let the beauty of a lawless woman deceive me[a], nor that of anything laid before me by worthless sin.
translation:
  language: pt
  text: E não permitas que me engane a beleza de uma mulher transgressora, nem a de qualquer coisa posta diante de mim pelo pecado sem proveito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem qualquer coisa posta diante de mim pelo pecado sem proveito”.'
    reason: A sintaxe grega é comprimida. O genitivo favorece a elipse de “beleza”, mas também é possível transportar diretamente para o segundo membro a ideia verbal de algo que engana.
lexical_decisions:
- source_word: μὴ ἀπατησάτω με
  choice: não permitas que me engane
  rationale: Reproduz naturalmente em português a força imperativa ou jussiva do aoristo e mantém o sentido de engano ligado à tentação.
- source_word: κάλλος γυναικὸς παρανόμου
  choice: a beleza de uma mulher transgressora
  rationale: κάλλος é “beleza”; παρανόμου caracteriza a mulher como alguém que transgride a lei. “Transgressora” conserva o peso moral e religioso sem sugerir apenas ilegalidade civil.
- source_word: παντὸς ὑποκειμένου
  choice: a de qualquer coisa posta diante de mim
  rationale: 'O genitivo coordena a expressão com γυναικὸς e permite entender κάλλος como elíptico: “a beleza... e a [beleza] de qualquer coisa”. “Posta diante de mim” expressa, com cautela, o sentido contextual do particípio ὑποκειμένου.'
- source_word: ἀπὸ ἁμαρτίας ἀνωφελοῦς
  choice: pelo pecado sem proveito
  rationale: ἀπό é entendido como origem ou agência daquilo que é apresentado. “Sem proveito” traduz de perto ἀνωφελοῦς (“inútil, improfícuo”) e soa mais natural do que atribuir ao pecado a qualidade de “sem valor”.
