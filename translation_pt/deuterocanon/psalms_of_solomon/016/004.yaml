revisions:
- from: Ele me picou como com um aguilhão de cavalo, visando ao despertar dele[a]; meu Salvador e meu amparo me salvou em todo tempo.
  to: Ele me espetou como um aguilhão de cavalo, para o despertar dele[a]; meu Salvador, meu amparo, salvou-me em todo tempo.
  rationale: A revisão torna a frase portuguesa mais idiomática e conserva com maior precisão a relação de meta expressa no grego. A aposição «meu Salvador, meu amparo» mantém o verbo singular do original sem produzir uma concordância anômala em português. A nota continua a expor, sem resolver, a referência disputada de αὐτοῦ.
