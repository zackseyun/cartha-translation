  text: He prodded me like a horse’s goad He prodded me like a horse’s goad to watchfulness for Him; my Savior and my helper saved me at all times.
translation:
  language: pt
  text: Ele me espetou como um aguilhão de cavalo, para o despertar dele[a]; meu Salvador, meu amparo, salvou-me em todo tempo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «para o despertar dele». O pronome pode retomar o cavalo da imagem; o sentido pretendido também pode ser que o próprio orante fosse despertado ou levado à vigilância. Alguns entendem o pronome como referência a Deus.
    reason: Preservar a ambiguidade gramatical e interpretativa de αὐτοῦ, que não corresponde explicitamente a «meu» no texto grego.
lexical_decisions:
- source_word: ἔνυξέν
  choice: picou
  rationale: Expressa a ação pontual de furar ou espetar, adequada à imagem do aguilhão, sem suavizá-la indevidamente.
- source_word: κέντρον ἵππου
  choice: aguilhão de cavalo
  rationale: Mantém a imagem concreta do instrumento usado para incitar um cavalo; o primeiro «como» do grego é vertido naturalmente por «como com».
- source_word: ἐγρήγορσιν
  choice: despertar
  rationale: Abrange a passagem do sono à vigília e, no contexto metafórico, o despertar para a vigilância.
- source_word: ἀντιλήμπτωρ
  choice: amparo
  rationale: Designa aquele que sustenta, auxilia ou toma alguém sob sua proteção; «amparo» conserva essa amplitude em português corrente.
- source_word: ἐν παντὶ καιρῷ
  choice: em todo tempo
  rationale: Reproduz a extensão temporal geral da expressão grega sem transformá-la necessariamente em frequência distributiva.
theological_decisions:
- issue: Referente de αὐτοῦ em «ἐπὶ τὴν ἐγρήγορσιν αὐτοῦ»
  choice: visando ao despertar dele[a]
  alternative: para que eu despertasse / para a vigilância diante dele
  rationale: O grego traz pronome masculino de terceira pessoa, não «meu» nem «eu». A tradução principal conserva essa forma e a ambiguidade, em vez de identificar silenciosamente o referente com o salmista ou com Deus.
- issue: Identidade do Salvador e do amparo
  choice: meu Salvador e meu amparo me salvou
  alternative: meu Salvador e meu amparo salvaram-me
  rationale: O verbo grego está no singular, favorecendo a leitura dos dois títulos como designações do mesmo agente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. A construção incomum «como com» conserva a comparação instrumental do grego; a leve estranheza de «despertar dele» é intencional e sinalizada por nota, para não apagar uma dificuldade real do texto-fonte.
