base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/005.yaml
  text: I will give thanks to you[a], O God, because you took hold of me for salvation[d][c][b], and you did not count me with sinners for destruction.
translation:
  language: pt
  text: Eu te darei graças, ó Deus, porque me socorreste para a salvação[a] e não me contaste entre os pecadores para a destruição[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o livramento”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “não me consideraste junto com os pecadores para a ruína”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογήσομαί
  choice: Eu te darei graças
  rationale: No contexto de oração dirigida a Deus, o verbo expressa louvor agradecido, não confissão de pecado. A formulação é natural, digna e mantém o aspecto futuro.
- source_word: ἀντελάβου μου
  choice: me socorreste
  rationale: O verbo indica tomar a parte de alguém para ajudá-lo. “Socorrer” comunica claramente a intervenção divina e preserva a ligação semântica com a ideia de auxílio, sem literalizar excessivamente a imagem de “tomar pela mão”.
- source_word: εἰς σωτηρίαν
  choice: para a salvação
  rationale: Mantém tanto a direção ou finalidade indicada por εἰς quanto o peso religioso de σωτηρία; “livramento” permanece uma alternativa lexical possível.
- source_word: οὐκ ἐλογίσω με
  choice: não me contaste
  rationale: 'Traduz λογίζομαι em seu sentido avaliativo ou judicial: incluir alguém numa determinada categoria ou destino.'
- source_word: μετὰ τῶν ἁμαρτωλῶν
  choice: entre os pecadores
  rationale: “Entre” exprime naturalmente a inclusão num grupo, enquanto o artigo definido em “os pecadores” conserva a possibilidade de referência a um grupo reconhecível no contexto do livro.
- source_word: εἰς ἀπώλειαν
  choice: para a destruição
  rationale: Reproduz a finalidade ou destino expresso pela construção grega e preserva a gravidade de ἀπώλεια.
theological_decisions:
- issue: Referência definida de τῶν ἁμαρτωλῶν
  choice: os pecadores
  alternative: pecadores
  rationale: O artigo grego favorece a referência definida e pode apontar para um grupo identificável no horizonte histórico do livro. A tradução conserva essa especificidade sem identificar dogmaticamente quem compõe o grupo.
- issue: Natureza da σωτηρία
  choice: salvação
  alternative: livramento
  rationale: “Salvação” preserva a amplitude do termo grego, que pode envolver resgate concreto e sentido religioso, sem restringi-lo a uma única dimensão.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Emprega “ó Deus” como vocativo bíblico corrente, “socorreste” para comunicar auxílio ativo e “os pecadores” para preservar o artigo definido do grego.
