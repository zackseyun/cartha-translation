base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/016/003.yaml
  text: When my soul was being torn away from the Lord[d][c][b][a], the God of Israel—had not the Lord helped me by his mercy forever.
translation:
  language: pt
  text: Quando minha alma estava sendo arrancada do Senhor, o Deus de Israel — se o Senhor não tivesse vindo em meu auxílio por sua misericórdia para sempre.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando minha alma estava sendo levada para longe do Senhor, o Deus de Israel”.'
    reason: lexical_alternative
  - marker: b
    text: “Para sempre” pode qualificar especificamente “sua misericórdia” ou, de modo mais amplo, toda a ação de socorro.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ διενεχθῆναι
  choice: Quando ... estava sendo arrancada
  rationale: A construção ἐν + infinitivo articular tem valor temporal. O passivo de διαφέρω aqui expressa ser levado ou separado; “arrancada” preserva a força aflitiva do contexto, sem ocultar a alternativa menos intensa.
- source_word: ψυχήν μου
  choice: minha alma
  rationale: “Alma” conserva o peso pessoal e espiritual de ψυχή nesta oração e corresponde naturalmente ao sujeito do infinitivo passivo.
- source_word: ἀπὸ Κυρίου θεοῦ Ἰσραήλ
  choice: do Senhor, o Deus de Israel
  rationale: A preposição indica afastamento, e “o Deus de Israel” é apresentado como aposição explicativa de “Senhor”.
- source_word: εἰ μὴ
  choice: se ... não tivesse
  rationale: A construção introduz uma condição contrária ao desfecho efetivo; esta forma é idiomática em português e mantém a frase como continuação conceitual da situação de perigo.
- source_word: ἀντελάβετό μου
  choice: tivesse vindo em meu auxílio
  rationale: O verbo significa tomar alguém sob amparo, socorrer ou ajudar. A expressão escolhida é natural e retém a ideia concreta de intervenção protetora.
- source_word: τῷ ἐλέει αὐτοῦ
  choice: por sua misericórdia
  rationale: O dativo tem valor instrumental; “por” apresenta a misericórdia como meio ou fundamento do socorro.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: É a equivalência portuguesa corrente e, em posição final, preserva a possível ligação tanto com a misericórdia quanto com a ação salvadora inteira.
theological_decisions:
- issue: Tradução de κύριος
  choice: Senhor
  alternative: SENHOR; Soberano
  rationale: “Senhor” é a tradução direta e tradicional de κύριος, sem impor aqui uma distinção tipográfica que o texto grego não explicita.
- issue: Escopo de εἰς τὸν αἰῶνα
  choice: Manter “para sempre” no fim da frase
  alternative: “por sua misericórdia eterna”; ligar explicitamente a expressão ao socorro
  rationale: A posição grega permite que a expressão qualifique mais estritamente a misericórdia ou, de modo mais amplo, o socorro divino. A posição final mantém essa tensão.
- issue: Caráter incompleto da condição isolada
  choice: Preservar a construção condicional com travessão
  alternative: Suprir uma consequência como “eu teria perecido”
  rationale: O grego não declara a apódose neste versículo isolado e depende do contexto anterior. Não se acrescenta uma consequência teológica ou narrativa ausente da fonte.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira ampla. O travessão sinaliza a transição para a condição sem completar artificialmente a apódose, que depende do contexto anterior.
