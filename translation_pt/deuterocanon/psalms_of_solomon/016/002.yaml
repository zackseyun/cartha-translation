  yaml_path: translation/deuterocanon/psalms_of_solomon/016/002.yaml
  text: When I was far from God[a], my soul was almost poured out to death[c][b], near the gates of Hades with a sinner.
translation:
  language: pt
  text: Quando eu estava longe de Deus, minha alma[a] quase se derramou até a morte, bem perto das portas do Hades[b], junto com um pecador[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “minha vida”.
    reason: lexical_alternative
  - marker: b
    text: Ou “da sepultura” ou “do mundo dos mortos”. O grego traz “Hades”.
    reason: lexical_alternative
  - marker: c
    text: Ou “com o pecador”, caso o singular seja entendido em sentido genérico, referindo-se à classe dos pecadores.
    reason: source_ambiguity
lexical_decisions:
- source_word: τῷ μακρὰν ἀπὸ θεοῦ
  choice: Quando eu estava longe de Deus
  rationale: A expressão grega inicial é comprimida e sintaticamente incomum. Em contexto, uma oração circunstancial temporal comunica com clareza a situação do orante sem acrescentar conteúdo.
- source_word: παρʼ ὀλίγον
  choice: quase
  rationale: A locução idiomática indica que algo esteve a ponto de acontecer; “quase” é a forma mais natural e direta em português atual.
- source_word: ἐξεχύθη ἡ ψυχή μου εἰς θάνατον
  choice: minha alma quase se derramou para a morte
  rationale: A formulação mantém a imagem vívida do verbo ἐκχέω, “derramar”, e conserva ψυχή como “alma”, sem eliminar a possibilidade contextual de “vida”.
- source_word: σύνεγγυς πυλῶν ᾅδου
  choice: bem perto das portas do Hades
  rationale: σύνεγγυς expressa grande proximidade. “Hades” preserva o termo e a imagem espacial do grego, enquanto a nota esclarece alternativas interpretativas.
- source_word: μετὰ ἁμαρτωλοῦ
  choice: junto com um pecador
  rationale: A tradução conserva o singular anartro e a associação expressa por μετά, sem impor ao português uma definitude ausente no grego. A nota registra a possível leitura genérica.
theological_decisions:
- issue: Sentido de ψυχή
  choice: alma
  alternative: vida
  rationale: ψυχή pode designar a alma, a vida ou a própria pessoa. “Alma” preserva a linguagem da oração e a imagem do eu que se derrama, enquanto “vida” permanece uma alternativa contextual legítima.
- issue: Sentido de ᾅδης
  choice: Hades
  alternative: sepultura; mundo dos mortos
  rationale: O texto grego nomeia explicitamente o Hades. Manter o termo evita reduzi-lo a uma concepção doutrinária mais estreita e conserva a imagem das suas portas.
- issue: Valor do singular ἁμαρτωλοῦ
  choice: um pecador
  alternative: o pecador, em sentido genérico
  rationale: O substantivo grego está no singular e sem artigo. “Um pecador” reproduz essa indefinição, mas o singular também pode representar genericamente a classe dos pecadores; a nota preserva essa possibilidade.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com preferência por construções naturais ao leitor brasileiro. Conserva-se deliberadamente a forte metáfora de a alma ser derramada e o nome “Hades”; as notas registram alternativas lexicais e a ambiguidade do singular final.
