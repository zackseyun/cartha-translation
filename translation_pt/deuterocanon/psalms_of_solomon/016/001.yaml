  text: When my soul was departing from the Lord[c][b][a], I almost slipped in the descent of sleep.
translation:
  language: pt
  text: Quando minha alma se afastou do Senhor[a], por pouco não escorreguei na descida do sono[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando minha alma estava separada do Senhor”. O verbo grego da primeira oração é difícil e também pode sugerir que a alma se reunia ou se compunha.'
    reason: alternative_reading
  - marker: b
    text: A expressão também pode significar “no peso do sono” ou “no torpor do sono”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῷ συστάξαι
  choice: Quando ... se afastava
  rationale: A construção ἐν τῷ com infinitivo tem valor temporal. No texto grego fornecido, o sentido contextual é expresso como o início de um afastamento, sem transformar a frase em uma afirmação doutrinária mais específica.
- source_word: ψυχήν μου
  choice: minha alma
  rationale: Mantém a dimensão interior e devocional de ψυχή e corresponde ao registro poético do salmo.
- source_word: ἀπὸ Κυρίου
  choice: do Senhor
  rationale: Com o verbo de afastamento, ἀπό indica separação. A formulação é natural em português e preserva o sentido relacional.
- source_word: παρὰ μικρόν
  choice: por pouco não
  rationale: Equivalente idiomático claro para a ideia de que algo quase aconteceu.
- source_word: ὠλίσθησα
  choice: escorreguei
  rationale: Conserva a imagem concreta de perder o apoio ou deslizar.
- source_word: ἐν καταφορᾷ ὕπνου
  choice: na descida do sono
  rationale: Preserva a metáfora descendente ligada a 'escorreguei', deixando em nota os sentidos igualmente possíveis de peso ou torpor do sono.
- source_word: Κυρίου
  choice: Senhor
  rationale: É a forma portuguesa tradicional, digna e amplamente inteligível para κύριος neste contexto religioso.
theological_decisions:
- issue: Se ἀπὸ Κυρίου indica origem ou separação relacional
  choice: 'separação relacional: “se afastava do Senhor”'
  alternative: “procedia do Senhor” ou “estava separada do Senhor”
  rationale: ἀπό pode marcar origem ou afastamento; o contexto de perigo e queda favorece a separação, mas a nota mantém uma formulação alternativa menos dinâmica.
- issue: Como tratar a dificuldade de Ἐν τῷ συστάξαι
  choice: traduzir contextualmente como início de afastamento
  alternative: “Quando minha alma se recolhia”
  rationale: A forma fornecida é lexicalmente difícil neste contexto. A tradução principal acompanha a relação sintática com ἀπὸ Κυρίου sem recorrer à leitura νυστάξαι (“cochilar”), que não aparece no texto grego apresentado.
translation_notes:
  register: Português moderno, poético e sóbrio, com sintaxe simples. “Descida do sono” mantém a imagem incomum do grego; as alternativas mais idiomáticas são registradas em nota.
