lexical_decisions:
- source_word: ἐνισχύσῃς
  choice: deres força
  rationale: Expressa a concessão de força ou apoio e permite, de modo natural em português, manter não declarado o objeto do verbo, como no grego.
- source_word: ὑφέξεται
  choice: suportará
  rationale: Transmite a ideia de aguentar ou permanecer sob um peso e funciona naturalmente na pergunta retórica.
- source_word: παιδείαν
  choice: disciplina
  rationale: Preserva o sentido de formação que inclui correção, especialmente adequado ao contexto de privação e perseverança, sem excluir o matiz de instrução.
- source_word: ἐν πενίᾳ
  choice: na pobreza
  rationale: É uma tradução direta de πενία e conserva a referência concreta à condição de pobreza ou necessidade.
theological_decisions: []
