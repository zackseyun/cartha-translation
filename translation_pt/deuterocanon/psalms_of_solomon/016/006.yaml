  yaml_path: translation/deuterocanon/psalms_of_solomon/016/006.yaml
  text: Do not withdraw your mercy from me[a], O God[c][b], nor the remembrance of you from my heart until death.
translation:
  language: pt
  text: Não afastes de mim a tua misericórdia[a], ó Deus, nem do meu coração a lembrança de ti[b], até a morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “compaixão”; de modo mais interpretativo, “amor constante”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a lembrança a teu respeito”. O único verbo, “afastes”, rege também esta segunda expressão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστήσῃς
  choice: não afastes
  rationale: O verbo pede que Deus não faça sua misericórdia e a lembrança dele se afastarem. “Não afastes” preserva a regência única sobre os dois objetos e soa natural em português.
- source_word: ἔλεός
  choice: misericórdia
  rationale: Ἔλεος designa misericórdia ou compaixão. “Misericórdia” é a correspondência mais direta e adequada ao registro de oração.
- source_word: μνήμην περὶ σοῦ
  choice: a lembrança de ti
  rationale: Μνήμη significa lembrança ou memória, e περὶ σοῦ indica que Deus é o objeto dessa lembrança. “A lembrança de ti” é clara e idiomática.
- source_word: καρδίας
  choice: coração
  rationale: No grego bíblico, “coração” representa naturalmente a vida interior, incluindo pensamento, memória e devoção.
- source_word: ἕως θανάτου
  choice: até a morte
  rationale: A expressão tem sentido temporal direto. A tradução mantém sua concisão e não a interpreta como “enquanto eu viver”.
