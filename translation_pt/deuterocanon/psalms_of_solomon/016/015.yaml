  yaml_path: translation/deuterocanon/psalms_of_solomon/016/015.yaml
  text: When the righteous one endures in these things[b][a], he will be shown mercy by the Lord.
translation:
  language: pt
  text: Quando o justo perseverar nessas coisas[a][b], receberá misericórdia do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ao perseverar nessas coisas, o justo receberá misericórdia do Senhor”.'
    reason: A construção grega pode ser entendida temporalmente (“quando”) ou instrumentalmente (“ao”, “por meio de”).
  - marker: b
    text: “O justo” traduz uma forma singular masculina do grego, que pode ser usada de maneira representativa.
    reason: A nota registra tanto a forma gramatical masculina quanto seu possível alcance representativo.
lexical_decisions:
- source_word: ἐν τῷ ὑπομεῖναι
  choice: Quando ... perseverar
  rationale: A construção ἐν com infinitivo articulado pode ter sentido temporal ou instrumental. O valor temporal se encaixa naturalmente no contexto, sem excluir por completo a ideia de meio.
- source_word: δίκαιον
  choice: o justo
  rationale: O acusativo funciona provavelmente como sujeito do infinitivo. “O justo” conserva o uso substantivado e o singular masculino, que também pode ser representativo.
- source_word: ἐν τούτοις
  choice: nessas coisas
  rationale: A expressão remete de modo transparente às provações ou circunstâncias mencionadas anteriormente, sem especificá-las além do grego.
- source_word: ἐλεηθήσεται
  choice: terá misericórdia dele
  rationale: Embora a forma grega seja passiva, esta construção ativa com “o Senhor” como sujeito é mais natural em português e preserva plenamente a ação divina de conceder misericórdia.
- source_word: ὑπὸ Κυρίου
  choice: o Senhor
  rationale: ὑπό com genitivo indica o agente da forma passiva. Na reestruturação portuguesa, esse agente torna-se o sujeito explícito, “o Senhor”.
theological_decisions:
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” é a forma devocional tradicional e direta para κύριος neste contexto, sem acrescentar uma interpretação denominacional.
- issue: Relação entre perseverança e misericórdia
  choice: Preservar a sequência expressa pelo texto sem explicar sua relação teológica
  alternative: Explicitar a perseverança como condição meritória ou apenas como evidência
  rationale: O grego associa a perseverança do justo à misericórdia do Senhor, mas não define aqui a natureza exata dessa relação; a tradução mantém essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi reestruturada para uma construção ativa natural em português, sem alterar o agente nem o conteúdo da forma passiva grega. Os marcadores seguem ordem alfabética no texto.
