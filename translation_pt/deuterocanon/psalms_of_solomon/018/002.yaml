  yaml_path: translation/deuterocanon/psalms_of_solomon/018/002.yaml
  text: Your kindness is upon Israel like a rich gift[a]; your eyes look upon them[c][b], and none of them will be lacking.
translation:
  language: pt
  text: A tua bondade está sobre Israel como uma rica dádiva[a]; os teus olhos estão voltados para eles, e não haverá falta entre eles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sobre Israel, em uma rica dádiva”. A construção grega é poética e condensada.
    reason: lexical_alternative
  - marker: b
    text: Ou “nenhum deles terá falta”.
    reason: alternative_reading
lexical_decisions:
- source_word: χρηστότης
  choice: bondade
  rationale: O termo expressa bondade benevolente, manifestada em favor de alguém. “Bondade” é natural em português e mantém a amplitude do grego; “benevolência” seria mais abstrato.
- source_word: δόματος πλουσίου
  choice: uma rica dádiva
  rationale: δόμα, com ômicron, significa “dádiva” ou “presente”, e não “teto” ou “casa” (δῶμα, com ômega). “Rica dádiva” preserva a imagem poética e o sentido de generosidade ou abundância.
- source_word: ἐπὶ Ἰσραήλ
  choice: sobre Israel
  rationale: A preposição apresenta a bondade divina vindo ou estendendo-se sobre Israel. A formulação conserva a imagem espacial e o registro poético.
- source_word: ἐπιβλέποντες
  choice: estão voltados para
  rationale: A expressão mantém a imagem dos olhos de Deus dirigidos atentamente a Israel, sem explicitar a noção interpretativa de proteção contida em “velam por”.
- source_word: οὐχ ὑστερήσει ἐξ αὐτῶν
  choice: não haverá falta entre eles
  rationale: A construção é compacta e pode ser entendida de modo impessoal. Esta versão preserva a indeterminação do sujeito e comunica naturalmente que não haverá carência no meio deles.
theological_decisions:
- issue: Sentido da oração final e sujeito de ὑστερήσει
  choice: não haverá falta entre eles
  alternative: nenhum deles terá falta
  rationale: O singular verbal permite uma leitura impessoal, enquanto ἐξ αὐτῶν indica o grupo no qual não haverá falta. A tradução evita acrescentar um sujeito não expresso e preserva a tensão da formulação grega.
- issue: Relação entre a bondade divina e a rica dádiva
  choice: como uma rica dádiva
  alternative: por meio de uma rica dádiva
  rationale: A sequência preposicional grega é comprimida. A comparação comunica com naturalidade a imagem poética adotada pela camada inglesa auditada, sem confundir δόμα com δῶμα; a nota registra a possível leitura instrumental.
translation_notes:
  register: Português atual, digno e de leitura ampla, com paralelismo poético simples. Emprega-se “tu” em concordância com o discurso direto a Deus. A formulação evita tanto o arcaísmo excessivo quanto uma paráfrase teologicamente ampliada.
