- from: A tua bondade vem sobre Israel como uma rica dádiva[a]; os teus olhos estão voltados para eles, e não haverá falta entre eles.[b]
  to: A tua bondade está sobre Israel como uma rica dádiva[a]; os teus olhos estão voltados para eles, e não haverá falta entre eles.[b]
  rationale: A revisão remove a noção não expressa de movimento e torna a nota sobre a construção de ἐπὶ δόματος πλουσίου mais cautelosa. Mantém-se “como uma rica dádiva”, em consonância com a leitura comparativa adotada no histórico de auditoria inglês, ao mesmo tempo que a nota conserva a ambiguidade sintática do grego.
