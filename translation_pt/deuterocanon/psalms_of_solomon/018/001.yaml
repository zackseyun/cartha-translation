  text: Senhor, a tua misericórdia está sobre as obras das tuas mãos para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Senhor
  rationale: O vocativo dirige-se diretamente a Deus. «Senhor» é a forma padrão, natural e digna em português, sem necessidade de acrescentar «ó».
- source_word: τὸ ἔλεός σου
  choice: a tua misericórdia
  rationale: ἔλεος expressa misericórdia ou bondade compassiva. «Misericórdia» preserva a formulação teológica tradicional e continua clara no português atual.
- source_word: ἐπὶ
  choice: está sobre
  rationale: A construção preserva a imagem espacial da misericórdia que se estende sobre aquilo que Deus fez, sem definir de modo mais específico se ela «repousa» ou atua em favor disso.
- source_word: τὰ ἔργα τῶν χειρῶν σου
  choice: as obras das tuas mãos
  rationale: A tradução mantém a expressão concreta e antropomórfica do grego, em vez de explicá-la como «criação» ou condensá-la em «obra».
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: É o equivalente corrente e natural para duração permanente neste contexto.
theological_decisions:
- issue: Se τὰ ἔργα τῶν χειρῶν σου deve ser explicitado como referência à criação.
  choice: as obras das tuas mãos
  alternative: a tua obra; as coisas que as tuas mãos fizeram
  rationale: O grego sugere aquilo que Deus fez, mas conserva a imagem ampla de «obras das mãos». A formulação escolhida evita restringir o referente ou resolver uma amplitude que o texto mantém.
- issue: Como representar a relação expressa por ἐπὶ entre a misericórdia divina e as obras de Deus.
  choice: está sobre
  alternative: repousa sobre; se estende sobre
  rationale: «Está sobre» conserva a metáfora e sua relativa indeterminação, sem acrescentar a ideia específica de repouso ou de movimento.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção próxima do grego. Emprega-se «tua/tuas» para manter a segunda pessoa singular da invocação e a coesão poética.
