translation:
  language: pt
  text: para desviar uma alma disposta a aprender[a][c] da insensatez na ignorância[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «uma alma obediente» ou «uma alma pronta a ouvir».
    reason: lexical_alternative
  - marker: b
    text: O grego distingue ἀμαθία de ἀγνοία; o verso reúne as ideias de insensatez e ignorância, em vez de simplesmente repetir a mesma palavra.
    reason: lexical_alternative
  - marker: c
    text: Ou «receptiva».
    reason: previous_rendering
lexical_decisions:
- source_word: ἀποστρέψαι
  choice: para desviar ... de
  rationale: O infinitivo aoristo expressa fazer alguém afastar-se de algo; «desviar ... de» preserva a força direcional de ἀπό e soa natural em português.
- source_word: ψυχὴν
  choice: uma alma
  rationale: Neste contexto moral e religioso, «alma» conserva o peso antropológico de ψυχή sem o reduzir a emoção ou personalidade.
- source_word: εὔκοον
  choice: disposta a aprender
  rationale: O adjetivo indica alguém pronto a ouvir e, por isso, ensinável ou obediente. «Disposta a aprender» comunica naturalmente a abertura à instrução sem impor a ideia mais específica de obediência formal.
- source_word: ἀμαθίας
  choice: insensatez
  rationale: «Insensatez» expressa a deficiência moral e intelectual do termo e evita confundi-lo com ἀγνοία, traduzido por «ignorância».
- source_word: ἐν ἀγνοίᾳ
  choice: em ignorância
  rationale: 'A formulação direta preserva a brevidade e a ambiguidade da relação sintática: pode indicar a condição em que existe a insensatez, sem explicitar se ela foi praticada ou causada pela ignorância.'
