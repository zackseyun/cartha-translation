  text: under the rod of discipline of the Lord's Messiah[a], in the fear of his God, in wisdom of spirit and righteousness and strength[d][c][b];
translation:
  language: pt
  text: sob a vara da disciplina do Messias do Senhor[a], no temor do seu Deus, com sabedoria de espírito[b], de justiça[c] e de força;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “Messias Senhor” ou “ungido do Senhor”; a sequência de genitivos no grego é compacta.
    reason: alternative_reading
  - marker: b
    text: Ou “sabedoria do Espírito”.
    reason: lexical_alternative
  - marker: c
    text: Ou “retidão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥάβδον
  choice: vara
  rationale: Com παιδείας, “vara” preserva o sentido concreto de correção e disciplina, sem realçar indevidamente a ideia régia de “cetro”.
- source_word: παιδείας
  choice: disciplina
  rationale: O termo abrange formação, instrução e correção; junto de ῥάβδον, o aspecto disciplinar e corretivo se destaca.
- source_word: χριστοῦ
  choice: Messias
  rationale: Aqui funciona como título messiânico; “Messias” preserva com naturalidade o contexto judaico da obra.
- source_word: κυρίου
  choice: do Senhor
  rationale: O genitivo é mantido na expressão “Messias do Senhor”, sem eliminar a compactação e possível ambiguidade da construção grega.
- source_word: φόβῳ
  choice: temor
  rationale: Em relação a Deus, “temor” conserva o peso bíblico de φόβος e comunica melhor sua possível dimensão reverente do que o português corrente “medo”.
- source_word: θεοῦ αὐτοῦ
  choice: seu Deus
  rationale: Preserva explicitamente o possessivo αὐτοῦ e a relação expressa pelo grego.
- source_word: σοφίᾳ
  choice: sabedoria
  rationale: É o equivalente amplo e habitual de σοφία, apropriado neste catálogo de qualidades.
- source_word: πνεύματος
  choice: de espírito
  rationale: A ausência de artigo e a ambiguidade do referente aconselham a forma minúscula e não especificada; a possível referência ao Espírito é registrada em nota.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: “Justiça” é a forma mais natural em português neste contexto e pode expressar tanto retidão quanto conduta justa; a alternativa “retidão” é preservada em nota.
- source_word: ἰσχύος
  choice: força
  rationale: Transmite o sentido de vigor ou poder de ἰσχύς sem intensificação desnecessária.
theological_decisions:
- issue: Relação entre χριστοῦ e κυρίου
  choice: Messias do Senhor
  alternative: Messias Senhor; ungido do Senhor
  rationale: A sequência compacta de genitivos permite mais de uma representação. A leitura principal preserva a relação mais provável sem transformar “Messias” em simples nome próprio; as demais possibilidades ficam explícitas em nota.
- issue: Referente de πνεύματος
  choice: espírito
  alternative: Espírito
  rationale: O grego não exige de modo inequívoco uma referência ao Espírito de Deus. A minúscula evita introduzir uma identificação teológica mais definida do que o texto permite.
- issue: Relação sintática de σοφίᾳ com os genitivos seguintes
  choice: com sabedoria de espírito, justiça e força
  alternative: com sabedoria de espírito, de justiça e de força
  rationale: A redação principal lê a sequência como um conjunto de qualidades, solução clara e natural em português. A alternativa conserva mais estritamente a possibilidade de os três genitivos dependerem de “sabedoria”.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por “temor” no contexto religioso e “vara da disciplina” para conservar a imagem concreta do grego. A formulação evita definir indevidamente se πνεῦμα é o espírito humano ou o Espírito de Deus e registra em nota a ambiguidade sintática da série final.
