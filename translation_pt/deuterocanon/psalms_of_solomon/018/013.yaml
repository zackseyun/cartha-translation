  text: Their way is in the fear of God every day[b][a], from the day God created them and forever.
translation:
  language: pt
  text: O caminho deles é vivido no temor de Deus todos os dias[a], desde o dia em que Deus os criou e para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na reverência a Deus”; “caminho” também pode significar “modo de viver” ou “conduta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν φόβῳ θεοῦ
  choice: no temor de Deus
  rationale: Preserva a expressão religiosa tradicional e seu peso teológico, indicando reverência piedosa orientada para Deus sem reduzir φόβος a uma simples atitude subjetiva.
- source_word: ἡ ὁδὸς αὐτῶν
  choice: O caminho deles
  rationale: Mantém a metáfora do curso de vida presente em ὁδός; em português, “caminho” pode designar tanto a trajetória quanto a conduta de alguém.
- source_word: καθʼ ἑκάστην ἡμέραν
  choice: todos os dias
  rationale: É uma formulação natural em português moderno e comunica a continuidade habitual indicada pelo grego.
- source_word: ἀφʼ ἧς ἡμέρας
  choice: desde o dia em que
  rationale: Expressa claramente o ponto inicial temporal e se liga de modo idiomático ao verbo seguinte.
- source_word: ἔκτισεν
  choice: criou
  rationale: Traduz diretamente κτίζω e preserva a força teológica da ação criadora de Deus.
- source_word: ἕως αἰῶνος
  choice: para sempre
  rationale: Transmite de modo claro e natural a duração indefinida e permanente da expressão grega.
