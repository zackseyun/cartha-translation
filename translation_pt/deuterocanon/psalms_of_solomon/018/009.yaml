  text: to guide men in works of righteousness in the fear of God[c][b][a], to set them all before the Lord.
translation:
  language: pt
  text: para guiar os homens em obras de justiça[a][b], no temor de Deus, e colocar todos eles diante do Senhor.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «em obras justas».
    reason: lexical_alternative
  - marker: b
    text: Ou «em obras de retidão».
    reason: lexical_alternative
  - marker: c
    text: Ou «na presença do Senhor».
    reason: lexical_alternative
lexical_decisions:
- source_word: κατευθῦναι
  choice: guiar
  rationale: Expressa orientação intencional para um caminho correto e conserva, em português natural, a força moral do infinitivo grego.
- source_word: ἄνδρας
  choice: os homens
  rationale: Mantém a forma masculina plural explícita do grego, sem substituí-la por um termo genérico que o texto não emprega.
- source_word: ἐν ἔργοις δικαιοσύνης
  choice: em obras de justiça
  rationale: Preserva o substantivo concreto ἔργοις e deixa audível a amplitude ética de δικαιοσύνη; as alternativas mais idiomáticas são registradas em notas.
- source_word: φόβῳ θεοῦ
  choice: no temor de Deus
  rationale: Conserva o conhecido idioma bíblico e representa o dativo como esfera ou modo de conduta.
- source_word: καταστῆσαι
  choice: colocar
  rationale: Comunica a ideia ampla de fazer comparecer ou pôr alguém em determinada posição, sem impor o sentido mais específico de nomear ou instituir.
- source_word: ἐνώπιον Κυρίου
  choice: diante do Senhor
  rationale: É a correspondência portuguesa transparente da expressão grega e mantém Senhor como tradução de Κυρίου.
theological_decisions:
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: Justiça preserva a correspondência lexical tradicional e pode abranger tanto a conduta moral correta quanto a prática do que é justo. Retidão explicita melhor a dimensão moral, mas estreita a ambiguidade do termo.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A coordenação dos dois infinitivos foi mantida, assim como o idioma bíblico «temor de Deus». «Obras de justiça» conserva a textura formal do grego, enquanto as notas oferecem formulações portuguesas alternativas sem resolver indevidamente a amplitude de δικαιοσύνη.
