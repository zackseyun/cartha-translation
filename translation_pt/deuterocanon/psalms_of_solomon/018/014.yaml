  source_fidelity: 'A primeira oração traduz adequadamente καὶ οὐκ ἐπλανήθησαν ἀφʼ ἧς ἡμέρας ἔκτισεν αὐτούς. Contudo, «como a seus escravos» altera ἐν ἐπιταγῇ δούλων αὐτοῦ: o grego vincula a ordem aos escravos de Deus («por ordem de seus escravos»), não diz que Deus deu uma ordem tratando os destinatários como escravos.'
  naturalness: O texto revisto mantém um português atual e claro. «Por ordem de seus escravos» é ligeiramente marcado, mas essa estranheza reflete a formulação e a relação sintática incomum do grego sem a reinterpretar.
  terminology: «Criou», «se desviaram», «se afastaram», «caminhos» e «escravos» são escolhas adequadas. «Escravos» preserva o valor de δούλων. A nota deve explicar a construção sem introduzir a leitura não sustentada de que os destinatários são escravos.
  issues:
