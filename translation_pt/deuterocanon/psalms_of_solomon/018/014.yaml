base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/018/014.yaml
  text: And they have not gone astray since the day he created them[a]. From ancient generations they have not departed from their ways[d][c][b], unless God commanded them by the command of his slaves.
translation:
  language: pt
  text: E eles não se desviaram desde o dia em que ele os criou[a]. Desde as gerações antigas, não se afastaram de seus caminhos[b], a menos que Deus lhes ordenasse por ordem de seus escravos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não vaguearam”.'
    reason: lexical_alternative
  - marker: b
    text: “Seus caminhos” pode significar os cursos ou padrões que lhes foram determinados.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “mediante uma ordem de seus escravos”. O grego liga “seus escravos” a “ordem”; a relação exata expressa pela construção é concisa.'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: ἐπλανήθησαν
  choice: se desviaram
  rationale: Expressa o afastamento de um curso estabelecido e, sem especificar uma causa externa, acomoda o valor passivo/depoente da forma grega.
- source_word: ἔκτισεν
  choice: criou
  rationale: É o equivalente direto e natural de κτίζω neste contexto da ordem da criação.
- source_word: ἀφʼ ἧς ἡμέρας
  choice: desde o dia em que
  rationale: Comunica de modo idiomático o ponto inicial temporal indicado pelo grego.
- source_word: ἀπὸ γενεῶν ἀρχαίων
  choice: desde as gerações antigas
  rationale: Preserva a referência à longa continuidade desde tempos remotos.
- source_word: ἀπέστησαν
  choice: se afastaram
  rationale: Mantém o sentido de abandonar ou sair de um curso estabelecido e forma um paralelo natural com 'se desviaram'.
- source_word: ὁδῶν αὐτῶν
  choice: seus caminhos
  rationale: Conserva a amplitude metafórica de ὁδός; no contexto, pode designar cursos ou padrões determinados.
- source_word: ἐνετείλατο
  choice: desse uma ordem
  rationale: Verte a ação de ordenar com autoridade e permite uma construção portuguesa natural com o objeto indireto αὐτοῖς.
- source_word: ἐν ἐπιταγῇ δούλων αὐτοῦ
  choice: lhes desse uma ordem como a seus escravos
  rationale: Entende a expressão como uma ordem divina dirigida àqueles que estão sujeitos a Deus, evitando em português a leitura enganosa de que Deus recebe ordens deles. A nota registra a construção grega mais literal e sua dificuldade.
- source_word: δούλων
  choice: escravos
  rationale: Preserva o sentido social forte de δοῦλος e a ênfase na sujeição integral a Deus, sem suavizá-lo para 'servos'.
theological_decisions:
- issue: Referente de 'eles/os'
  choice: Manter os pronomes sem identificar o referente
  alternative: Explicitar corpos celestes, elementos da criação ou seres criados
  rationale: O antecedente depende do contexto anterior e não é nomeado neste versículo; explicitá-lo resolveria indevidamente a ambiguidade.
- issue: Relação entre a ordem divina e 'seus escravos'
  choice: Entender a ordem como dirigida aos que pertencem a Deus
  alternative: Traduzir o genitivo como se a ordem procedesse dos escravos de Deus ou fosse transmitida por eles
  rationale: A formulação escolhida evita sugerir que Deus obedece aos seus escravos, mas a nota conserva a forma literal e reconhece a concisão ambígua da construção grega.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com construção fluente para leitores brasileiros. Mantiveram-se os pronomes sem referente explícito e o termo forte 'escravos'. A repetição 'ordem/ordenasse' foi evitada no texto principal, mas preservada na nota literal.
