  text: Your ears heed the plea of the poor in hope[d][c][b][a]; your judgments are over all the earth with mercy.
translation:
  language: pt
  text: Teus ouvidos escutam a súplica de um pobre em esperança[a]; teus julgamentos se estendem por toda a terra[b], com misericórdia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em esperança”. Também pode ser entendido como “com esperança”.
    reason: lexical_alternative
  - marker: b
    text: Ou “estão sobre toda a terra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπακούει
  choice: atendem
  rationale: O verbo indica ouvir de modo atento e responsivo. “Atendem à súplica” exprime esse sentido com naturalidade em português, sem reduzir a ação à mera percepção auditiva.
- source_word: δέησιν
  choice: súplica
  rationale: O substantivo designa um pedido insistente ou urgente. “Súplica” preserva tanto o caráter de oração quanto a intensidade do apelo.
- source_word: πτωχοῦ
  choice: do pobre
  rationale: O grego traz um masculino singular genérico. “Do pobre” mantém o número e a forma gramatical sem transformar a expressão num coletivo abstrato.
- source_word: ἐν ἐλπίδι
  choice: que vive na esperança
  rationale: A expressão significa literalmente “em esperança”. A formulação escolhida evita a leitura portuguesa equivocada de “pobre em esperança” como alguém carente de esperança e conserva a ideia de expectativa confiante.
- source_word: κρίματά
  choice: julgamentos
  rationale: “Julgamentos” é o equivalente direto e compreensível, abrangendo as decisões e os atos judiciais de Deus.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: se estendem por toda a terra
  rationale: A construção grega elíptica expressa alcance sobre a terra inteira. Esta formulação comunica esse âmbito universal de modo natural.
- source_word: μετὰ ἐλέους
  choice: com misericórdia
  rationale: A tradução mantém a forma substantiva e preserva a tensão teológica entre julgamento e misericórdia.
theological_decisions:
- issue: Relação entre os julgamentos divinos e a misericórdia
  choice: “teus julgamentos se estendem por toda a terra, com misericórdia”
  alternative: “julgas misericordiosamente toda a terra”
  rationale: A escolha conserva separadamente os substantivos “julgamentos” e “misericórdia”, como no grego, sem dissolver nem explicar a tensão entre ambos.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com preferência por construções naturais no Brasil sem regionalismos. A metáfora dos ouvidos foi preservada; “atendem” comunica uma escuta responsiva. As duas notas aparecem no texto principal nos pontos correspondentes.
