  - severity: low
    issue: Construção “Teus ouvidos atendem”
    rationale: Embora defensável em linguagem poética, o verbo “atender” com “ouvidos” como sujeito é menos natural em português do que “escutam”, sem vantagem necessária de fidelidade.
  revised_text: Teus ouvidos escutam a súplica de um pobre em esperança[a]; teus julgamentos se estendem por toda a terra[b], com misericórdia.
