base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/018/012.yaml
  text: the one who appointed the luminaries in their course for the appointed times of the hours, from day to day; and they have not departed from the path he commanded them.
translation:
  language: pt
  text: aquele que dispôs os luminares em seu percurso[a] para os tempos determinados das horas[b], dia após dia; e eles não se desviaram do caminho que lhes ordenou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em procissão”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “para tempos determinados de horas”; a expressão provavelmente se refere a uma ordem temporal fixa.
    reason: lexical_alternative
lexical_decisions:
- source_word: διατάξας
  choice: dispôs
  rationale: O particípio indica ordenar e estabelecer deliberadamente; “dispôs” conserva a ideia de organização intencional sem sugerir mera nomeação.
- source_word: φωστῆρας
  choice: os luminares
  rationale: No contexto celeste e poético, “luminares” designa com dignidade os corpos luminosos e mantém a formulação formal do grego.
- source_word: ἐν πορείᾳ
  choice: em seu percurso
  rationale: Expressa movimento ordenado e regular; evita o anacronismo científico de “órbita”, preservando também a possibilidade de uma marcha ou procissão na nota.
- source_word: καιροὺς ὡρῶν
  choice: os tempos determinados das horas
  rationale: 'Mantém a combinação incomum do grego: καιρούς como tempos próprios ou fixados e ὡρῶν como horas, sem substituí-la interpretativamente por “estações”.'
- source_word: ἀφʼ ἡμερῶν εἰς ἡμέρας
  choice: dia após dia
  rationale: Forma portuguesa natural que comunica continuidade e regularidade recorrente.
- source_word: παρέβησαν
  choice: não se desviaram
  rationale: Com ἀπό e ὁδοῦ, o sentido espacial de afastar-se ou desviar-se de um caminho é mais imediato que o sentido moral de transgredir. O perfeito composto seria pouco natural aqui em português; o pretérito perfeito preserva o aspecto global do aoristo.
- source_word: ὁδοῦ
  choice: do caminho
  rationale: Preserva a imagem concreta da rota prescrita aos luminares.
- source_word: ἐνετείλατο
  choice: ordenou
  rationale: Traduz a autoridade direta expressa pelo verbo e se encaixa naturalmente com o objeto indireto “lhes”.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe participial foi preservada porque o versículo integra uma unidade maior. A expressão deliberadamente incomum καιροὺς ὡρῶν foi mantida de modo transparente, e a ambiguidade de πορεία foi registrada em nota.
