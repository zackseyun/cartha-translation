  text: ὁ διατάξας ἐν πορείᾳ φωστῆρας εἰς καιροὺς ὡρῶν ἀφʼ ἡμερῶν εἰς ἡμέρας, καὶ οὐ παρέβησαν ἀπὸ ὁδοῦ ἧς ἐνετείλατο αὐτοῖς.
