  source_fidelity: 'A tradução mantém os elementos centrais do grego: o particípio substantivado («aquele que»), a disposição deliberada dos luminares, seu movimento ordenado, a expressão temporal incomum «tempos determinados das horas», a regularidade «dia após dia» e a permanência no caminho ordenado. «Não se desviaram» representa adequadamente παρέβησαν no contexto espacial de afastamento de um caminho.'
  naturalness: O português é moderno, claro e de registro poético-formal apropriado. «Dia após dia» é idiomático. Embora «tempos determinados das horas» seja deliberadamente pouco usual, isso reflete a construção grega e é esclarecido pela nota.
  terminology: «Luminares», «percurso», «caminho» e «ordenou» preservam a imagem celeste e a autoridade do texto sem introduzir explicações doutrinárias ou terminologia científica anacrônica. A nota em «percurso» registra de modo adequado a alternativa de πορεία.
