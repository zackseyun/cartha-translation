  yaml_path: translation/deuterocanon/psalms_of_solomon/018/011.yaml
  text: Great and glorious is our God[a], dwelling in the heights;
translation:
  language: pt
  text: Grande e glorioso é o nosso Deus, que habita nas alturas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nos lugares mais altos” ou “nos mais altos céus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέγας
  choice: grande
  rationale: Preserva o sentido adjetival básico e se ajusta ao louvor doxológico sem restringir a expressão à ideia de poder, como faria “poderoso”.
- source_word: ἔνδοξος
  choice: glorioso
  rationale: É a equivalência portuguesa mais natural neste contexto de louvor e expressa diretamente a glória atribuída a Deus.
- source_word: ἐν ὑψίστοις
  choice: nas alturas
  rationale: Mantém a imagem espacial elevada e a ambiguidade do plural substantivado grego, sem explicitar “céus”, termo que não aparece no original.
- source_word: κατοικῶν
  choice: que habita
  rationale: Traduz com naturalidade o particípio presente, indicando habitação contínua, e preserva um registro digno e corrente.
theological_decisions:
- issue: Referente de ἐν ὑψίστοις
  choice: nas alturas
  alternative: nos lugares mais altos; nos mais altos céus
  rationale: O grego permite diferentes explicitações do domínio elevado. O texto principal conserva a indeterminação espacial, evitando identificar as alturas especificamente com os céus.
translation_notes:
  register: Português moderno, claro e reverente, com construção doxológica natural. A oração relativa “que habita” evita a rigidez de um particípio nominal e mantém a relação sintática com “nosso Deus”.
