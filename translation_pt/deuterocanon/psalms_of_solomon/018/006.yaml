base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/018/006.yaml
  text: May God purify Israel for a day of mercy in blessing[e][d][c][b][a], for a day of choosing in the raising up of his Messiah.
translation:
  language: pt
  text: Que Deus purifique Israel para um dia de misericórdia, com bênção, para um dia de escolha[a], na elevação de seu Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eleição” ou “seleção”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “na exaltação de seu Messias” ou “ao levantar seu Messias”. A expressão grega pode indicar tanto o ato de erguer quanto o de exaltar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθαρίσαι
  choice: Que Deus purifique
  rationale: A forma pode expressar um desejo na terceira pessoa; a construção portuguesa com “Que” comunica naturalmente essa força de súplica. “Purifique” preserva o sentido religioso e moral de tornar puro.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Na sintaxe da frase, o nome indeclinável funciona de modo mais natural como objeto direto de “purifique”, evitando suprir um objeto ausente.
- source_word: εἰς ἡμέραν ἐλέους
  choice: para um dia de misericórdia
  rationale: Mantém a orientação prospectiva de εἰς e a ausência de artigo no grego, sem transformar a expressão necessariamente em um dia técnico já definido.
- source_word: ἐν εὐλογίᾳ
  choice: com bênção
  rationale: “Com” expressa em português corrente a maneira ou circunstância concomitante indicada por ἐν, sem decidir rigidamente entre meio e acompanhamento.
- source_word: εἰς ἡμέραν ἐκλογῆς
  choice: para um dia de escolha
  rationale: “Escolha” comunica a ideia de seleção sem a associação política moderna que “eleição” pode sugerir; a alternativa mais formal é documentada em nota.
- source_word: ἐν ἀνάξει
  choice: na elevação
  rationale: Conserva a imagem de movimento para cima e a ambiguidade entre levantar, fazer surgir e exaltar, sem restringir a expressão à ressurreição.
- source_word: χριστοῦ αὐτοῦ
  choice: de seu Messias
  rationale: Χριστός funciona aqui como título messiânico judaico; “Messias” é mais transparente do que “Cristo” neste contexto pré-cristão.
theological_decisions:
- issue: Função sintática de Ἰσραήλ
  choice: 'Tomar “Israel” como objeto direto: “Que Deus purifique Israel”.'
  alternative: “Que o Deus de Israel nos purifique”, suprindo “nos”.
  rationale: A leitura como objeto resolve diretamente a regência do verbo transitivo e não exige inserir no texto um pronome que não aparece no grego.
- issue: Força verbal de καθαρίσαι
  choice: 'Expressar um desejo ou súplica: “Que Deus purifique”.'
  alternative: “para Deus purificar” ou “purificar”.
  rationale: No contexto poético, a forma é bem compreendida como optativa de desejo; a construção escolhida reproduz essa força de maneira idiomática em português.
- issue: Sentido de ἀνάξει
  choice: Manter a expressão ampla “na elevação de seu Messias”.
  alternative: “na exaltação de seu Messias” ou “ao levantar seu Messias”.
  rationale: A tradução principal preserva tanto o movimento de erguer quanto a possível dignificação régia, sem identificar obrigatoriamente o ato com ressurreição, entronização ou aparecimento.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe de oração preservada por “Que Deus purifique”. Emprega “com bênção” em vez do mais rígido “em bênção” e mantém as duas expressões prospectivas introduzidas por “para”. Os marcadores [a] e [b] aparecem no texto principal.
