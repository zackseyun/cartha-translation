  text: Blessed are those who come to be in those days[b][a], to see the good things of the Lord that he will do for the generation to come.
translation:
  language: pt
  text: Felizes os que vierem a existir naqueles dias[a], por verem as coisas boas do Senhor[b], que ele fará para a geração vindoura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que nascerem naqueles dias” ou “os que estiverem vivos naqueles dias”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as bênçãos do Senhor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Felizes
  rationale: Expressa de modo claro e natural a condição favorecida anunciada pela fórmula de bem-aventurança, sem reduzir o termo a mera sorte.
- source_word: οἱ γενόμενοι
  choice: os que vierem a existir
  rationale: Preserva a amplitude do particípio de γίνομαι, que pode se referir aos que nascerem, passarem a existir ou estiverem vivos naquele tempo, sem restringi-lo silenciosamente ao nascimento.
- source_word: ἐν ἡμέραις ἐκείναις
  choice: naqueles dias
  rationale: Mantém a expressão temporal tradicional e plenamente compreensível no português atual.
- source_word: ἰδεῖν
  choice: para verem
  rationale: Conserva o infinitivo e apresenta a visão ou experiência dos bens futuros como aquilo que torna felizes essas pessoas.
- source_word: τὰ ἀγαθὰ Κυρίου
  choice: as coisas boas do Senhor
  rationale: Preserva o sentido amplo e concreto do plural substantivado, sem limitá-lo antecipadamente a bênçãos espirituais.
- source_word: ἃ ποιήσει
  choice: que ele fará
  rationale: Representa diretamente o relativo e o futuro de ποιέω, mantendo o Senhor como agente implícito da ação.
- source_word: γενεᾷ τῇ ἐρχομένῃ
  choice: para a geração vindoura
  rationale: Traduz o dativo como beneficiário e conserva a orientação futura do particípio ἐρχομένῃ em português natural e digno.
theological_decisions:
- issue: Alcance de οἱ γενόμενοι
  choice: os que vierem a existir
  alternative: os que nascerem / os que estiverem vivos
  rationale: A formulação principal retém a ambiguidade lexical do grego e evita decidir se a referência é especificamente ao nascimento ou, de modo mais amplo, às pessoas que viverão naquele período.
- issue: Sentido de τὰ ἀγαθὰ Κυρίου
  choice: as coisas boas do Senhor
  alternative: as bênçãos do Senhor
  rationale: A tradução principal conserva a abrangência da expressão grega; a alternativa interpretativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leve cadência bíblica. “Felizes” é acessível e preserva a forma de bem-aventurança; “vierem a existir” é deliberadamente mais amplo que “nascerem”. Todos os marcadores de nota aparecem junto às expressões correspondentes.
