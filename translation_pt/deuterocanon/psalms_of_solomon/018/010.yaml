lexical_decisions:
- source_word: γενεὰ
  choice: geração
  rationale: Preserva o sentido coletivo e nominal de γενεά, que aqui designa um conjunto de pessoas caracterizado de determinada maneira.
- source_word: ἀγαθὴ
  choice: boa
  rationale: É a correspondência direta e ampla de ἀγαθή, sem restringir indevidamente o sentido a «justa» ou «nobre».
- source_word: ἐν φόβῳ θεοῦ
  choice: no temor de Deus
  rationale: Mantém a expressão bíblica tradicional e sua amplitude, que pode abranger temor, reverência, obediência e assombro diante de Deus.
- source_word: ἐν ἡμέραις ἐλέους
  choice: em dias de misericórdia
  rationale: Reproduz de perto a construção plural e conserva a possibilidade de se tratar de dias marcados pela misericórdia divina.
- source_word: διάψαλμα
  choice: Interlúdio
  rationale: O termo provavelmente é uma indicação litúrgica ou musical; «Interlúdio» comunica essa função sem alegar uma precisão que o grego não permite.
- source_word: '[cópula implícita / oração sem verbo]'
  choice: oração nominal sem verbo explícito
  rationale: A concisão poética do grego admite em português uma frase nominal inteligível; não se acrescenta «vive» ou «está», pois isso resolveria uma relação sintática deixada implícita no original.
theological_decisions:
- issue: Como traduzir φόβος θεοῦ
  choice: temor de Deus
  alternative: reverência a Deus
  rationale: «Temor de Deus» preserva a expressão bíblica teologicamente densa e não a reduz apenas a reverência.
- issue: Relação implícita entre «geração boa» e as expressões preposicionais
  choice: manter a frase sem verbo
  alternative: «Uma geração boa vive no temor de Deus, em dias de misericórdia»
  rationale: O grego não expressa cópula nem outro verbo. A forma nominal conserva a concisão, a força poética e a ambiguidade sintática do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formulação poética concisa. Conservou-se a ordem «geração boa» para refletir o destaque do substantivo seguido de sua caracterização, evitando transformar a linha em prosa explicativa.
