  text: Uma boa geração[a], no temor de Deus, em dias de misericórdia. Interlúdio.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode explicitar a relação: «Uma boa geração vive no temor de Deus, em dias de misericórdia». O grego, porém, não traz verbo expresso.'
