  text: And your love is upon the offspring of Abraham, the sons of Israel. Your discipline is upon us as upon a firstborn, an only son,
translation:
  language: pt
  text: E o teu amor está sobre a descendência de Abraão, os filhos de Israel. A tua disciplina está sobre nós como sobre um filho primogênito, filho único,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγάπη σου
  choice: o teu amor
  rationale: “Amor” é a correspondência natural e digna para ἀγάπη e preserva o calor da relação pactual.
- source_word: σπέρμα Ἀβραάμ
  choice: a descendência de Abraão
  rationale: σπέρμα é singular coletivo; “descendência” expressa esse valor com naturalidade em português e mantém clara a referência abraâmica.
- source_word: υἱοὺς Ἰσραήλ
  choice: os filhos de Israel
  rationale: Mantém o sentido explícito de υἱούς e a ligação lexical com a imagem singular de “filho” na sequência.
- source_word: ἡ παιδία σου
  choice: a tua disciplina
  rationale: O substantivo indica formação corretiva, não mera punição; “disciplina” preserva tanto a dimensão educativa quanto a corretiva.
- source_word: ἐφʼ ἡμᾶς
  choice: está sobre nós
  rationale: Conserva a repetição de ἐπί e o paralelismo poético com a declaração anterior.
- source_word: ὡς υἱὸν πρωτότοκον μονογενῆ
  choice: como sobre um filho primogênito, filho único
  rationale: Preserva separadamente πρωτότοκον e μονογενῆ, reunindo a imagem do primogênito com a singular preciosidade do filho único, sem fundir os dois conceitos.
theological_decisions:
- issue: Relação entre “primogênito” e “filho único”
  choice: 'Manter os dois qualificativos em aposição: “um filho primogênito, filho único”'
  alternative: “um único filho primogênito”
  rationale: A formulação escolhida conserva a tensão semântica e a acumulação enfática do grego, sem harmonizar ou explicar teologicamente os termos.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe de tom poético. O uso de “teu/tua” mantém a invocação direta e é amplamente inteligível; “está sobre” conserva deliberadamente o paralelismo do original, embora seja menos coloquial. A vírgula final foi mantida porque o versículo continua sintaticamente no seguinte.
