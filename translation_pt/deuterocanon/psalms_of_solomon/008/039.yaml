  text: May favor be upon us and our children forever[a]; O Lord our Savior[c][b], we shall never again be shaken forever.
translation:
  language: pt
  text: Que haja favor para nós e para os nossos filhos para sempre[a]. Senhor, nosso Salvador, nunca mais seremos abalados, por todo o sempre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Para nós e para os nossos filhos há favor para sempre”. A frase grega não tem verbo expresso; “favor” também pode ser traduzido por “benevolência” ou “boa vontade”.'
    reason: lexical_and_syntactic_ambiguity
  - marker: b
    text: 'Literalmente: “não seremos mais abalados por um tempo eterno”; a expressão é enfática e afirma estabilidade duradoura.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδοκία
  choice: favor
  rationale: Neste contexto de oração, o substantivo pode indicar benevolência, boa vontade ou aprovação. “Favor” é claro, natural e preserva a possibilidade de se tratar do favor divino sem inserir no texto o possessivo “teu”, que não está expresso no grego.
- source_word: ἡμῖν καὶ τοῖς τέκνοις ἡμῶν
  choice: para nós e para os nossos filhos
  rationale: Os dativos indicam os beneficiários, e τέκνα abrange os filhos de modo inclusivo, sem se limitar aos do sexo masculino.
- source_word: Κύριε
  choice: Senhor
  rationale: O vocativo κύριε é a forma corrente e digna de dirigir-se a Deus neste contexto.
- source_word: σωτήρ
  choice: Salvador
  rationale: O termo designa aquele que salva ou livra; “Salvador” preserva aqui sua força de título.
- source_word: σαλευθησόμεθα
  choice: seremos abalados
  rationale: O futuro passivo expressa sofrer abalo ou perder a estabilidade. “Seremos abalados” é fiel à imagem e idiomático em português.
- source_word: οὐ ... ἔτι τὸν αἰῶνα χρόνον
  choice: nunca mais
  rationale: A combinação da negação com ἔτι e a expressão temporal enfática comunica que o abalo não voltará a ocorrer em tempo algum. “Nunca mais” transmite isso naturalmente, enquanto a nota registra a formulação intensiva.
theological_decisions:
- issue: Sujeito implícito do favor
  choice: Não acrescentar “teu” antes de “favor”
  alternative: “Que o teu favor esteja sobre nós”
  rationale: Embora o contexto torne provável que o favor seja de Deus, o grego não traz pronome possessivo. A tradução evita explicitar o que o original deixa implícito.
- issue: Valor da oração nominal inicial
  choice: 'Traduzir como petição: “Que haja favor”'
  alternative: 'Traduzir como afirmação: “Para nós e para os nossos filhos há favor”'
  rationale: A oração grega não tem verbo expresso e admite tanto leitura desiderativa quanto declarativa. No contexto de oração, a formulação como pedido é natural, mas a ambiguidade é reconhecida em nota.
translation_notes:
  register: Português contemporâneo, claro e solene, com cadência apropriada à oração poética. A repetição de “para” esclarece os beneficiários. Evitou-se o vocativo arcaizante “ó”, sem perder a dignidade do discurso dirigido a Deus.
