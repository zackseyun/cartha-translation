  text: Each one was committing adultery with his neighbor’s wife[a]; they made covenants with one another under oath about these things.
translation:
  language: pt
  text: Cada um cometia adultério com a mulher do seu próximo; fizeram entre si acordos sob juramento acerca dessas coisas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fizeram acordos com eles, mediante juramento, acerca dessas coisas”. O dativo αὐτοῖς pode ser entendido mais literalmente como “com eles”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοιχῶντο
  choice: cometia adultério
  rationale: O imperfeito indica ação contínua ou repetida; em português, o pretérito imperfeito preserva naturalmente esse aspecto.
- source_word: ἕκαστος
  choice: Cada um
  rationale: Mantém a força distributiva do singular grego, aplicando a acusação individualmente.
- source_word: τὴν γυναῖκα τοῦ πλησίον αὐτοῦ
  choice: a mulher do seu próximo
  rationale: Tradução direta e clara da construção genitiva, mantendo o contexto explícito de adultério.
- source_word: συνέθεντο συνθήκας
  choice: fizeram ... acordos
  rationale: A combinação verbal e nominal significa estabelecer ou celebrar acordos; esta formulação é natural e evita impor uma ressonância teológica mais forte que o contexto exige.
- source_word: αὐτοῖς
  choice: entre si
  rationale: Explicita a provável reciprocidade dos acordos entre os envolvidos, sem alongar desnecessariamente a frase.
- source_word: μετὰ ὅρκου
  choice: sob juramento
  rationale: Expressão portuguesa idiomática que preserva a formalidade e a força solene do juramento.
- source_word: περὶ τούτων
  choice: acerca dessas coisas
  rationale: Retoma de modo próximo e digno as práticas mencionadas anteriormente.
