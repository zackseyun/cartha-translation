  yaml_path: translation/deuterocanon/psalms_of_solomon/008/031.yaml
  text: Our eyes have seen your judgments[a], O God; we have justified your honored name forever[b],
translation:
  language: pt
  text: Nossos olhos viram os teus juízos[a], ó Deus; declaramos justo o teu nome honrado para sempre[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego é difícil neste ponto; literalmente: “nossos olhos deram os teus juízos”. A tradução segue o sentido aparente no contexto: “Nossos olhos viram os teus juízos”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “o teu nome digno de honra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδοσαν
  choice: viram
  rationale: O verbo transmitido significa literalmente “deram”, mas essa construção, com “nossos olhos” como sujeito e “os teus juízos” como objeto, é difícil. À luz do contexto imediato, em que Deus manifesta seu juízo, “viram” comunica o sentido aparente sem ocultar a dificuldade textual, registrada em nota.
- source_word: τὰ κρίματά σου
  choice: os teus juízos
  rationale: κρίματα designa aqui decisões ou atos judiciais de Deus. “Juízos” é direto, natural no registro bíblico e mantém a possível abrangência entre vereditos e atos de julgamento.
- source_word: ἐδικαιώσαμεν
  choice: declaramos justo
  rationale: A expressão preserva o valor declarativo de δικαιόω e evita sugerir que os falantes tornam Deus justo; eles reconhecem e afirmam publicamente a justiça associada ao nome divino.
- source_word: τὸ ὄνομά σου τὸ ἔντιμον
  choice: o teu nome honrado
  rationale: ἔντιμος descreve aquilo que é estimado ou tido em honra. “Honrado” preserva de modo conciso a força reverencial do grego.
- source_word: εἰς αἰῶνας
  choice: para sempre
  rationale: A locução indica duração permanente; “para sempre” é seu equivalente idiomático mais claro em português.
theological_decisions:
- issue: Como traduzir ἐδικαιώσαμεν tendo o nome de Deus como objeto
  choice: declaramos justo o teu nome
  alternative: justificamos o teu nome
  rationale: “Declaramos justo” mantém a ideia forense e declarativa do verbo sem dar a entender que seres humanos conferem justiça a Deus. A formulação expressa que eles reconhecem a retidão revelada nos juízos divinos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal e vocabulário de boa legibilidade brasileira. A vírgula final foi mantida porque o versículo prossegue sintaticamente no contexto poético.
