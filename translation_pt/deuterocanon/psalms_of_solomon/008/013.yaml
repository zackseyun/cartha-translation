  text: They trampled the altar of the Lord with every uncleanness[a], and with menstrual blood they defiled the sacrifices like profane meat[c][b];
translation:
  language: pt
  text: Pisotearam o altar do Senhor com todo tipo de impureza[a] e, com sangue menstrual[b][c], contaminaram os sacrifícios como carne profana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma grega inicial é difícil em um importante testemunho textual. Uma leitura paralela bem apoiada resulta em “Pisotearam o altar do Senhor”.
    reason: textual_variant
