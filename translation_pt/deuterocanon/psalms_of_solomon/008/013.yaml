    reason: previous_rendering
lexical_decisions:
- source_word: ἐπίπουσαν
  choice: Pisotearam
  rationale: A forma grega transmitida é difícil, mas uma leitura paralela bem atestada e o contexto de profanação violenta favorecem o sentido de pisotear. A incerteza textual é preservada em nota.
- source_word: τὸ θυσιαστήριον Κυρίου
  choice: o altar do Senhor
  rationale: Equivalente cultual direto, natural e tradicional em português.
- source_word: ἀπὸ πάσης ἀκαθαρσίας
  choice: com todo tipo de impureza
  rationale: Expressa de modo natural a abrangência de πάσης e preserva o sentido de impureza ritual de ἀκαθαρσία.
- source_word: ἐν ἀφέδρῳ αἵματος
  choice: com sangue menstrual
  rationale: Ἄφεδρος é usado tecnicamente na linguagem da Septuaginta para a impureza associada à menstruação. A formulação explícita comunica ao leitor moderno a violação cultual concreta, enquanto alternativas menos específicas ficam registradas em nota.
- source_word: ἐμίανιν
  choice: contaminaram
  rationale: No contexto ritual, o verbo indica tornar algo impuro ou profanado; “contaminaram” é claro e corrente em português.
- source_word: τὰς θυσίας
  choice: os sacrifícios
  rationale: Tradução direta e suficientemente clara no contexto do altar.
- source_word: κρέα βέβηλα
  choice: carne profana
  rationale: Preserva o contraste entre o que é consagrado e o que é comum ou não sagrado, sem reduzir βέβηλα à mera sujeira física.
