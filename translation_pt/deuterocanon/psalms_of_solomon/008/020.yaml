lexical_decisions:
- source_word: εἰσῆλθεν
  choice: Entrou
  rationale: O aoristo descreve diretamente o ato de entrar; «entrou» é natural e preciso em português.
- source_word: ὡς πατὴρ
  choice: como um pai
  rationale: Preserva o valor comparativo de ὡς sem transformar a comparação em identificação.
- source_word: οἶκον υἱῶν αὐτοῦ
  choice: na casa de seus filhos
  rationale: Mantém a imagem concreta da casa e a relação possessiva expressa por αὐτοῦ, em formulação corrente em português.
- source_word: μετʼ εἰρήνης
  choice: em paz
  rationale: Expressão idiomática que conserva o sentido circunstancial da construção grega.
- source_word: ἔστησεν τοὺς πόδας αὐτοῦ
  choice: firmou os pés
  rationale: Conserva a imagem corporal e comunica de modo natural a ideia de colocar ou estabelecer os pés com firmeza.
- source_word: μετὰ ἀσφαλείας πολλῆς
  choice: com grande segurança
  rationale: Mantém a construção nominal, o sentido de segurança de ἀσφάλεια e a intensificação de πολλῆς.
