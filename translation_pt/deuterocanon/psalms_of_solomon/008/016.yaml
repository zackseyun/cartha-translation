lexical_decisions:
- source_word: ἤγαγεν
  choice: Trouxe
  rationale: O aoristo de ἄγω apresenta a introdução dessa figura em cena. “Trouxe” expressa de modo natural o movimento causado sem acrescentar um objeto ou destino não indicado no grego.
- source_word: τὸν ἀπʼ ἐσχάτου τῆς γῆς
  choice: aquele que vem dos confins da terra
  rationale: A expressão identifica a pessoa trazida como procedente de uma extremidade geográfica. “Dos confins da terra” é idiomático, digno e preserva a ideia de grande distância presente em ἔσχατος.
- source_word: παίοντα
  choice: aquele que golpeia
  rationale: O particípio presente de παίω descreve a figura como alguém que desfere golpes. “Golpeia” é atual e mais específico que o genérico “fere”, sem o tom arcaico de “castiga” ou “fere com mão poderosa”.
- source_word: κραταιῶς
  choice: com grande força
  rationale: O advérbio indica ação vigorosa ou poderosa. “Com grande força” comunica claramente essa intensidade em português corrente e mantém o tom elevado.
