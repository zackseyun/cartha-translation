  yaml_path: translation/deuterocanon/psalms_of_solomon/008/023.yaml
  text: He destroyed their rulers and everyone wise in counsel[c][b][a]; he poured out the blood of those dwelling in Jerusalem like unclean water.
translation:
  language: pt
  text: Destruiu os governantes deles e todos os que eram sábios em deliberação[a]; derramou o sangue dos que habitavam em Jerusalém como água de impureza[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo sábio em deliberação” ou “todos os que eram sábios no conselho”. A expressão grega é condensada e tem sentido coletivo.
    reason: lexical_alternative
  - marker: b
    text: Também se pode traduzir “como água impura”. Literalmente, “como água de impureza” ou “de contaminação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώλεσεν
  choice: Destruiu
  rationale: Preserva o sentido amplo de levar à destruição, sem restringir o verbo a “matou”, embora a frase seguinte fale de derramamento de sangue.
- source_word: ἄρχοντας αὐτῶν
  choice: os governantes deles
  rationale: Mantém tanto o sentido político de ἄρχοντας quanto a referência possessiva explícita de αὐτῶν.
- source_word: πᾶν σοφὸν ἐν βουλῇ
  choice: todo aquele que era sábio em aconselhar
  rationale: Expressa em português corrente a construção grega comprimida e coletiva, preservando a ideia de pessoas caracterizadas pela sabedoria ao deliberar ou aconselhar.
- source_word: ἐξέχεεν
  choice: derramou
  rationale: Conserva a imagem concreta e violenta do verbo grego, especialmente apropriada com “sangue”.
- source_word: τῶν οἰκούντων Ἰερουσαλήμ
  choice: dos que habitavam em Jerusalém
  rationale: Mantém a força participial e indica os residentes da cidade sem substituir a expressão por um substantivo mais abstrato.
- source_word: ὡς ὕδωρ ἀκαθαρσίας
  choice: como água de impureza
  rationale: Reproduz o genitivo grego e conserva sua possível carga ritual, sem reduzi-lo silenciosamente ao adjetivo mais genérico “impura”.
theological_decisions:
- issue: Possível sentido ritual de ἀκαθαρσίας
  choice: água de impureza
  alternative: água impura
  rationale: A formulação com genitivo preserva a possibilidade de referência à impureza ou contaminação ritual, ao passo que “água impura” seria mais idiomático, mas poderia tornar a imagem apenas descritiva.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para ampla compreensão. A expressão final conserva deliberadamente a forma genitiva do grego por sua possível carga ritual; a alternativa mais idiomática aparece em nota.
