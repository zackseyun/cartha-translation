  text: God exposed their sins before the sun[a]; all the earth came to know the righteous judgments of God.
translation:
  language: pt
  text: Deus expôs os pecados deles diante do sol; toda a terra passou a conhecer os julgamentos justos[a] de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “julgamentos retos”.
