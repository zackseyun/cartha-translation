lexical_decisions:
- source_word: ἀνεκάλυψεν
  choice: expôs
  rationale: Expressa tornar público e visível o que estava oculto, preservando a força da imagem e o contexto de vergonha pública.
- source_word: ἁμαρτίας
  choice: pecados
  rationale: É a tradução direta e transparente de ἁμαρτίας neste contexto.
- source_word: ἐναντίον τοῦ ἡλίου
  choice: diante do sol
  rationale: Preserva a imagem incomum do grego e comunica exposição aberta, sem substituí-la pela expressão idiomática mais ampla “debaixo do sol”.
- source_word: ἔγνω
  choice: passou a conhecer
  rationale: Traduz o aoristo como reconhecimento resultante da exposição pública realizada por Deus, em português natural.
- source_word: πᾶσα ἡ γῆ
  choice: toda a terra
  rationale: Mantém o alcance amplo da expressão grega; “terra” é preferível a uma leitura localizada como “região”.
- source_word: κρίματα
  choice: julgamentos
  rationale: Representa diretamente os atos ou decisões judiciais divinos e permanece compreensível ao leitor moderno.
- source_word: δίκαια
  choice: justos
  rationale: Comunica tanto a retidão moral quanto a justiça dos julgamentos de Deus; “retos” é mantido em nota como alternativa legítima.
theological_decisions:
- issue: Sentido de δίκαια aplicado aos κρίματα de Deus
  choice: julgamentos justos
  alternative: julgamentos retos
  rationale: “Justos” preserva com naturalidade a dimensão judicial e moral do adjetivo; “retos” ressalta mais diretamente a retidão e permanece como alternativa em nota, sem resolver indevidamente a nuance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão deliberadamente incomum “diante do sol” foi conservada para preservar a imagem do original grego.
