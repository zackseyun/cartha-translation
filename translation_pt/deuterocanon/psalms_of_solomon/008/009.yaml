  text: Their lawless deeds were in secret chambers[a], in provocation.
translation:
  language: pt
  text: As transgressões deles eram cometidas em esconderijos, como atos de provocação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para provocar a ira”; o objeto da provocação não é expresso no grego.'
    reason: Preserva a ambiguidade de ἐν παροργισμῷ entre a caracterização dos atos como provocação e seu possível efeito de despertar ira, sem inserir um objeto no texto principal.
lexical_decisions:
- source_word: ἐν καταγώγαις κρυφίοις
  choice: em aposentos secretos
  rationale: A expressão indica lugares interiores ou recintos mantidos ocultos. “Aposentos secretos” é natural em português e preserva a provável ideia de um espaço reservado sem definir demais sua arquitetura.
- source_word: αἱ παρανομίαι αὐτῶν
  choice: as transgressões deles
  rationale: παρανομίαι designa violações da lei ou do que é correto. “Transgressões” conserva a força moral e jurídica do termo, enquanto “deles” mantém explícita a referência possessiva.
- source_word: ἐν παροργισμῷ
  choice: como provocação
  rationale: παροργισμός pode indicar provocação, especialmente uma afronta que desperta ira. A formulação preserva essa força sem inserir no texto principal um objeto — Deus — que o grego não explicita.
- source_word: '[cópula implícita]'
  choice: eram praticadas
  rationale: A frase grega não contém verbo expresso. “Eram praticadas” produz uma frase portuguesa natural e combina com o sentido concreto de παρανομίαι, sem alterar o aspecto temporal sugerido pelo contexto.
theological_decisions:
- issue: Objeto implícito da provocação
  choice: Não explicitar Deus no texto principal
  alternative: “provocando Deus à ira” ou “provocando-o à ira”
  rationale: Embora o contexto possa indicar que as transgressões provocavam a ira divina, ἐν παροργισμῷ não traz objeto expresso. A tradução mantém essa abertura, e a nota registra a possibilidade contextual.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e vocabulário de ampla compreensão. A construção passiva supre discretamente o verbo ausente no grego.
