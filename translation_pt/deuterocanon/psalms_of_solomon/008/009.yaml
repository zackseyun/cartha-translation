  source_fidelity: A tradução preserva adequadamente παρανομίαι como “transgressões” e não explicita indevidamente o destinatário da provocação. Contudo, “aposentos” restringe καταγωγαί a cômodos, quando o termo pode designar de modo mais amplo esconderijos ou lugares de refúgio ocultos. A formulação “como provocação” é compreensível, mas pode ser tornada mais idiomática sem converter a provocação em desafio ou identificar seu objeto.
  naturalness: “Eram praticadas” é possível, mas soa redundante com “transgressões”. “Eram cometidas” é a colocação portuguesa mais natural para infrações. “Esconderijos” é claro, moderno e adequado ao caráter clandestino do sintagma grego.
  terminology: “Transgressões” conserva a dimensão moral-jurídica de παρανομίαι. “Esconderijos” evita especificar arquitetura não assegurada por καταγωγαί. “Como atos de provocação” comunica naturalmente o valor de ἐν παροργισμῷ, sem introduzir Deus ou qualquer outro objeto ausente do grego.
