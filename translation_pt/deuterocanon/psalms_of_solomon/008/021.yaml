lexical_decisions:
- source_word: κατελάβετο
  choice: tomou posse de
  rationale: No contexto militar, o verbo indica assumir o controle das fortificações. “Tomou posse de” preserva essa ideia sem exigir que a tomada tenha ocorrido por combate, o que se ajusta ao contexto imediato de entrada consentida.
- source_word: τὰς πυργοβάρεις
  choice: as torres fortificadas
  rationale: O termo grego raro designa estruturas defensivas, provavelmente torres fortificadas, cidadelas ou baluartes. “Torres fortificadas” mantém a provável referência concreta e evita um termo excessivamente técnico.
- source_word: αὐτῆς
  choice: dela
  rationale: O pronome feminino retoma Jerusalém, tratada poeticamente como figura feminina. “Dela” preserva essa personificação sem repetir desnecessariamente o nome da cidade.
- source_word: τὸ τεῖχος Ἰερουσαλήμ
  choice: a muralha de Jerusalém
  rationale: “Muralha” expressa de modo natural o muro defensivo da cidade e preserva o singular coletivo do grego, mantendo explícito o nome Jerusalém.
