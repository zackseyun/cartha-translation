translation:
  language: pt
  text: Ele tomou posse das torres fortificadas dela[a][b] e da muralha de Jerusalém[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A rara palavra grega traduzida como “torres fortificadas” também pode ser entendida como “cidadelas”, “baluartes” ou “obras defensivas”.
    reason: lexical_alternative
  - marker: b
