  yaml_path: translation/deuterocanon/psalms_of_solomon/008/015.yaml
  text: Therefore God mixed for them a spirit of delusion[a]; he made them drink a cup of undiluted wine to drunkenness.
translation:
  language: pt
  text: Por isso, Deus lhes misturou um espírito de engano[a]; fez que bebessem um cálice de vinho sem diluição, até ficarem embriagados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão retoma Isaías 19:14 na Septuaginta. A transcrição grega fornecida contém aqui a forma corrompida εὕρε; o texto subjacente é πνεῦμα, “espírito”.
    reason: Registra de modo transparente a correção textual necessária e a alusão escriturística que sustenta a leitura.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Marca de modo natural e conciso a conclusão judicial decorrente das acusações anteriores.
- source_word: ἐκέρασεν αὐτοῖς
  choice: lhes misturou
  rationale: Preserva a imagem concreta de preparar uma bebida, retomada na segunda oração pelo cálice de vinho.
- source_word: πνεῦμα πλανήσεως (forma recuperada; o texto transcrito traz εὕρε πλανήσεως)
  choice: um espírito de engano
  rationale: A leitura recuperada corresponde à formulação de Isaías 19:14 na Septuaginta e explica a construção com ἐκέρασεν. 'Engano' expressa a desorientação moral e espiritual de πλάνη sem restringi-la a mero deslocamento físico.
- source_word: ἐπότισεν αὐτοὺς
  choice: fez que bebessem
  rationale: Comunica com clareza a ação causativa do verbo e a imposição do juízo.
- source_word: ποτήριον οἴνου ἀκράτου
  choice: um cálice de vinho sem diluição
  rationale: ἀκράτου designa vinho não misturado com água. A expressão é precisa e conserva a intensidade da metáfora.
- source_word: εἰς μέθην
  choice: até ficarem embriagados
  rationale: Expressa naturalmente em português o resultado ou ponto final indicado pela preposição εἰς.
theological_decisions:
- issue: A ação divina no juízo
  choice: Deus lhes misturou um espírito de engano
  alternative: Deus permitiu que fossem enganados
  rationale: A tradução mantém a atribuição direta da ação a Deus no texto grego, sem suavizá-la por meio de uma formulação permissiva.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Conservou-se o paralelismo das imagens de mistura, bebida e embriaguez, bem como a tensão da linguagem de juízo.
