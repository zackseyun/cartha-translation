  text: The sound of a great multitude was like a very strong wind[c][b][a], like a storm of great fire sweeping through the wilderness.
translation:
  language: pt
  text: O som[a] de uma grande multidão[b] era como o de um vento muito forte, como uma tempestade de muito fogo impelido através do deserto.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “A voz”.
