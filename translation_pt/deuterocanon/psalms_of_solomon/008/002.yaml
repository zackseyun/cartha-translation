lexical_decisions:
- source_word: φωνὴ
  choice: som
  rationale: No contexto da comparação, refere-se ao efeito audível produzido pela multidão; “som” é natural em português e não restringe o termo a uma fala articulada.
- source_word: λαοῦ πολλοῦ
  choice: de uma grande multidão
  rationale: Expressa o caráter coletivo de λαός e a grande quantidade indicada por πολλοῦ, sem sugerir necessariamente uma nação específica.
- source_word: ἀνέμου πολλοῦ σφόδρα
  choice: de um vento muito forte
  rationale: A expressão grega é intensificada por πολλοῦ e σφόδρα; “vento muito forte” conserva essa força em português corrente. A retomada “como o de” deixa claro que se compara o som da multidão ao som do vento.
- source_word: καταιγὶς
  choice: tempestade
  rationale: É o equivalente moderno, claro e digno para a imagem de violência atmosférica.
- source_word: πυρὸς πολλοῦ
  choice: de muito fogo
  rationale: Mantém de perto a ideia quantitativa do grego, evitando converter a expressão em “incêndio” ou acrescentar a noção não explícita de chamas.
- source_word: φερομένου διʼ ἐρήμου
  choice: levado através do deserto
  rationale: O particípio em genitivo concorda com “fogo” e apresenta esse fogo sendo conduzido ou impelido ao longo do deserto. “Através do deserto” preserva claramente o sentido de percurso de διά com genitivo.
