translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. O verbo “era” explicita a cópula subentendida e trata o nominativo φωνὴ como início de uma oração independente. A formulação conserva a sequência de comparações e mantém o particípio ligado a “fogo”, conforme a concordância grega.
