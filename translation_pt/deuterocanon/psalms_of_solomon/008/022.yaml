translation:
  language: pt
  text: Pois Deus o conduziu em segurança em meio ao erro deles.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em meio ao desvario deles”, “ao engano deles” ou “ao extravio deles”.'
