lexical_decisions:
- source_word: ἤγαγεν
  choice: conduziu
  rationale: O aoristo de ἄγω indica que Deus o levou ou guiou; “conduziu” preserva essa imagem de direção sem acrescentar uma interpretação específica.
- source_word: μετὰ ἀσφαλείας
  choice: em segurança
  rationale: A locução expressa segurança ou proteção durante o percurso; “em segurança” é natural em português e mantém a força adverbial da expressão grega.
- source_word: πλανήσει
  choice: erro
  rationale: O substantivo pode indicar erro, desvario, engano ou extravio. No contexto, “erro” comunica de modo claro a percepção equivocada do grupo, sem excluir as demais nuances, registradas em nota.
- source_word: αὐτόν
  choice: o
  rationale: O pronome é masculino singular e funciona como objeto direto; “o” é a correspondência natural em português.
- source_word: αὐτῶν
  choice: deles
  rationale: O genitivo plural é vertido naturalmente por “deles”, preservando o contraste com o referente masculino singular.
- source_word: ἐν
  choice: em meio a
  rationale: A preposição pode situar a ação dentro da circunstância criada pelo erro deles; “em meio a” preserva essa relação sem impor exclusivamente um sentido instrumental.
