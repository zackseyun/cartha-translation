  text: For you are the God of righteousness[b][a], judging Israel with discipline.
translation:
  language: pt
  text: Pois tu és o Deus da justiça,[a] que julga Israel com disciplina.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «retidão».
    reason: lexical_alternative
  - marker: b
    text: Ou «por meio da disciplina»; também «com correção».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão da oração ou confissão no contexto, preservando de modo natural o valor explicativo da conjunção.
- source_word: σὺ ὁ θεός
  choice: tu és o Deus
  rationale: A construção enfática com o pronome explícito identifica diretamente o destinatário; em português, a cópula precisa ser expressa.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: Na expressão «Deus da justiça», o termo abrange tanto a retidão moral de Deus quanto seu governo justo; «justiça» é natural e preserva essa amplitude em português.
- source_word: κρίνων
  choice: que julga
  rationale: A oração relativa reproduz com naturalidade o particípio presente e apresenta o julgamento como ação característica ou contínua de Deus.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Forma consagrada do nome próprio em português.
- source_word: ἐν παιδείᾳ
  choice: com disciplina
  rationale: παιδεία indica aqui disciplina formativa e corretiva, não apenas instrução; «com» preserva a possível nuance de modo ou instrumento de ἐν.
theological_decisions:
- issue: Relação entre o julgamento divino e παιδεία
  choice: «julga Israel com disciplina»
  alternative: «corrige Israel ao julgá-lo» / «julga Israel por meio da disciplina»
  rationale: A formulação mantém a tensão do grego entre julgamento e correção formativa, sem reduzir o julgamento a punição nem identificar completamente ambos os conceitos.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A próclise não é relevante neste versículo; «tu» conserva o tratamento direto e a ênfase do pronome grego.
