  - marker: b
    text: Ou “benevolência”, em vez de “bondade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνάγαγε
  choice: Reúne
  rationale: O imperativo aoristo pede que Deus torne a ajuntar os que estão espalhados. “Reúne” é direto, natural e preserva o tom de súplica.
- source_word: τὴν διασπορὰν Ἰσραήλ
  choice: os dispersos de Israel
  rationale: Embora διασπορά seja literalmente um substantivo, “dispersão”, aqui tem sentido coletivo e se refere às pessoas de Israel espalhadas. “Os dispersos de Israel” comunica esse referente humano com clareza, sem acrescentar onde ou como vivem.
- source_word: μετὰ ἐλέους
  choice: com misericórdia
  rationale: Mantém o valor de acompanhamento ou modo expresso por μετά com genitivo e emprega a equivalência portuguesa corrente de ἔλεος.
- source_word: χρηστότητος
  choice: bondade
  rationale: “Bondade” expressa de modo atual e digno a disposição benévola indicada por χρηστότης; “benevolência” também é possível, mas tem registro mais abstrato.
theological_decisions:
- issue: Sentido coletivo e histórico de διασπορά
  choice: os dispersos de Israel
  alternative: a dispersão de Israel / a diáspora de Israel
  rationale: A formulação escolhida explicita que a oração trata do ajuntamento de pessoas, enquanto a nota conserva a forma nominal do grego e sua possível ressonância histórica. Não se especifica uma restauração política, geográfica ou escatológica além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com forma verbal de oração dirigida a Deus. A escolha “os dispersos” evita a abstração pouco natural de “reúne a dispersão”, enquanto as notas preservam a construção nominal e as alternativas lexicais do grego.
