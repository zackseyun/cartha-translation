  text: Gather the dispersed of Israel with mercy and kindness[a][b][c].
translation:
  language: pt
  text: Reúne os dispersos de Israel com misericórdia e bondade.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a dispersão de Israel”; também se pode traduzir por “a diáspora de Israel”.
