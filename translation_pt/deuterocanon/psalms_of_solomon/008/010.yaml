  text: Um filho com a mãe e um pai com a filha se misturavam[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “se mesclavam”. O sentido é que parentes tão próximos se uniam de maneira sexualmente ilícita.
