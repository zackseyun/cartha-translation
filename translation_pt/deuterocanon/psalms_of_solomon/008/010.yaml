lexical_decisions:
- source_word: υἱὸς
  choice: um filho
  rationale: O singular tem valor representativo; o artigo indefinido torna a formulação natural em português sem transformar a frase em narrativa sobre uma pessoa específica.
- source_word: μετὰ
  choice: com
  rationale: Μετά com genitivo indica associação; “com” reproduz de modo direto e conciso essa relação.
- source_word: μητρὸς
  choice: a mãe
  rationale: Mantém o termo de parentesco e, no par “um filho com a mãe”, comunica naturalmente a relação familiar em português.
- source_word: πατὴρ
  choice: um pai
  rationale: Preserva o singular representativo e o paralelismo com “um filho”.
- source_word: θυγατρὸς
  choice: a filha
  rationale: Mantém o termo de parentesco e a simetria entre os dois pares familiares.
- source_word: συνεφύροντο
  choice: se misturavam
  rationale: O imperfeito expressa ação continuada ou repetida, e a construção pronominal preserva a imagem de mistura recíproca do verbo sem explicitar no texto principal mais do que o grego declara.
theological_decisions:
- issue: Se o sentido incestuoso deve ser explicitado no texto principal
  choice: Conservar a expressão figurada “se misturavam”.
  alternative: “mantinham relações sexuais” ou “uniam-se sexualmente”
  rationale: Os pares de parentesco tornam evidente a transgressão sexual, mas o verbo grego emprega a imagem da mistura. A tradução mantém o eufemismo e deixa a explicação explícita para a nota, evitando ampliar indevidamente o texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem paralela e incisiva do grego foi preservada; “se misturavam” mantém deliberadamente o caráter eufemístico e chocante da denúncia.
