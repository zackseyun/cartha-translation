  source_fidelity: 'A tradução preserva adequadamente ἀπήγαγεν como remoção sem acrescentar violência, mantém a dupla explícita «filhos e filhas» e verte ἐν βεβηλώσει de modo compatível com a força religioso-moral de «em profanação». Contudo, a oração relativa precisa explicitar seu sujeito: no grego, ἃ é objeto de ἐγέννησαν («os quais eles geraram»), não sujeito do verbo.'
  naturalness: «Ele levou embora» e «em profanação» são naturais em português atual de registro bíblico sóbrio. A redação proposta elimina a leitura inevitável de que os filhos e as filhas seriam aqueles que geraram alguém.
