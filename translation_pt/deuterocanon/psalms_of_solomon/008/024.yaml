  text: He led away their sons and their daughters[a], whom they had begotten in defilement.
translation:
  language: pt
  text: Ele levou embora os filhos e as filhas deles, que eles haviam gerado em profanação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em contaminação”. O substantivo grego pode indicar profanação ou contaminação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγεν
  choice: levou embora
  rationale: O aoristo de ἀπάγω indica aqui remoção ou deportação. “Levou embora” conserva o sentido concreto sem especificar além do texto o grau de violência.
- source_word: τοὺς υἱοὺς καὶ τὰς θυγατέρας αὐτῶν
  choice: os filhos e as filhas deles
  rationale: O grego nomeia explicitamente filhos e filhas; a tradução preserva o par e liga αὐτῶν aos descendentes.
- source_word: ἃ ἐγέννησαν
  choice: que haviam gerado
  rationale: γεννάω pode referir-se a gerar ou dar à luz. “Haviam gerado” mantém a referência parental ampla e expressa a anterioridade em relação ao ato de levar embora.
- source_word: ἐν βεβηλώσει
  choice: em profanação
  rationale: βεβήλωσις denota profanação, violação do sagrado ou contaminação. “Profanação” preserva de modo direto sua força religioso-moral.
theological_decisions:
- issue: Força religioso-moral de ἐν βεβηλώσει
  choice: em profanação
  alternative: em contaminação
  rationale: A expressão apresenta um juízo sobre as circunstâncias em que os descendentes foram gerados, sem explicar a natureza específica da transgressão. “Profanação” preserva essa avaliação e a ligação lexical com aquilo que é profano, sem acrescentar uma doutrina particular.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A construção conserva a especificidade de “filhos e filhas” e não explicita quem é o sujeito masculino singular de “levou”, pois o versículo isolado não o nomeia.
