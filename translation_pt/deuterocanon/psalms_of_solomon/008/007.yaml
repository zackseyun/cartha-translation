  yaml_path: translation/deuterocanon/psalms_of_solomon/008/007.yaml
  text: I said[a], “They direct their ways in righteousness.” I considered the judgments of God from the creation of heaven and earth[d][c][b]; I declared God righteous in his judgments from of old.
translation:
  language: pt
  text: 'Eu disse[a]: “Eles endireitam os seus caminhos em justiça.” Considerei os juízos de Deus desde a criação do céu e da terra; declarei Deus justo[b] em seus juízos desde os tempos antigos[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego não contém sinais de citação; a oração também pode ser apresentada sem aspas: “Eu disse: eles endireitam os seus caminhos em justiça.”'
    reason: punctuation_ambiguity
  - marker: b
    text: Ou “vindiquei Deus” ou “justifiquei Deus”.
    reason: lexical_alternative
  - marker: c
    text: Ou “em seus juízos que são desde a eternidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατευθύνουσιν
  choice: endireitam
  rationale: O verbo exprime tornar reto ou dirigir corretamente; “endireitam” conserva a imagem dos caminhos e soa natural em português.
- source_word: ὁδοὺς
  choice: caminhos
  rationale: “Caminhos” preserva a metáfora moral do grego e combina naturalmente com “endireitam”.
- source_word: δικαιοσύνῃ
  choice: justiça
  rationale: Neste contexto, designa a retidão moral segundo a qual eles procuram ordenar sua conduta; “justiça” mantém também a ligação lexical com “justo” mais adiante.
- source_word: ἀνελογισάμην
  choice: considerei
  rationale: Comunica a ideia de ponderar ou refletir cuidadosamente, sem tornar a expressão excessivamente técnica.
- source_word: κρίματα
  choice: juízos
  rationale: Abrange tanto as decisões judiciais de Deus quanto seus atos de julgamento e preserva o tom teológico do texto.
- source_word: ἐδικαίωσα
  choice: declarei Deus justo
  rationale: Expressa o reconhecimento de que Deus está certo em seus juízos, sem sugerir que o falante torna Deus justo; também conserva em português a ligação entre δικαιοσύνῃ e a raiz de ἐδικαίωσα.
- source_word: τοῖς ἀπʼ αἰῶνος
  choice: desde os tempos antigos
  rationale: Preserva o sentido de grande antiguidade sem decidir que a expressão necessariamente significa eternidade metafísica.
theological_decisions:
- issue: Sentido de ἐδικαίωσα τὸν θεόν
  choice: declarei Deus justo
  alternative: vindiquei Deus; justifiquei Deus
  rationale: A formulação escolhida mantém a força declarativa e o elo lexical com “justiça”, deixando claro que o salmista reconhece a retidão divina, em vez de conferi-la a Deus.
- issue: Alcance temporal de τοῖς ἀπʼ αἰῶνος
  choice: desde os tempos antigos
  alternative: desde a eternidade
  rationale: O grego admite tanto antiguidade remota quanto eternidade; a leitura principal evita resolver além do que a expressão exige.
- issue: Relação sintática de τοῖς ἀπʼ αἰῶνος
  choice: qualifica “juízos”
  alternative: desde sempre declarei Deus justo em seus juízos
  rationale: A concordância dativa favorece a ligação com “juízos”, embora a posição da expressão possa gerar alguma flexibilidade interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição conceitual entre “justiça” e “justo” procura refletir deliberadamente a recorrência da raiz δίκαι- no grego. As notas preservam as ambiguidades reais de pontuação, léxico, duração temporal e ligação sintática.
