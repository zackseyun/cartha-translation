  yaml_path: translation/deuterocanon/psalms_of_solomon/008/025.yaml
  text: They acted according to their uncleannesses[a], just as their fathers did.
translation:
  language: pt
  text: Agiram segundo as suas impurezas[a], assim como seus pais fizeram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas impurezas rituais” ou “suas imundícies”.
    reason: O termo grego pode designar impureza ritual, moral ou suas manifestações; a formulação principal preserva essa amplitude.
lexical_decisions:
- source_word: ἐποίησαν
  choice: Agiram
  rationale: O verbo ποιέω é amplo ('fazer'), mas aqui descreve conduta regida por um padrão introduzido por κατά; 'agiram' expressa isso naturalmente em português.
- source_word: κατὰ
  choice: segundo
  rationale: '''Segundo'' preserva de modo conciso a ideia de conduta correspondente a um padrão, sem tornar a frase excessivamente técnica.'
- source_word: τὰς ἀκαθαρσίας αὐτῶν
  choice: as suas impurezas
  rationale: O plural 'impurezas' mantém o número do grego e abrange tanto a dimensão moral quanto a ritual de ἀκαθαρσία. É mais natural no português atual do que 'imundícies'.
- source_word: καθὼς
  choice: assim como
  rationale: '''Assim como'' marca claramente a comparação e a continuidade entre a conduta deles e a de seus pais.'
- source_word: οἱ πατέρες αὐτῶν
  choice: seus pais
  rationale: '''Pais'' é o equivalente direto e conserva a linguagem familiar e ancestral do grego; o contexto pode abranger antepassados sem que isso seja explicitado no texto principal.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe concisa. Mantém-se o plural marcado do original e a linguagem tradicional de 'pais', sem substituir interpretativamente por 'antepassados'.
