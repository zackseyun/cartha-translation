lexical_decisions:
- source_word: ὅσιοι
  choice: fiéis
  rationale: O termo designa pessoas caracterizadas por devoção e lealdade a Deus. “Fiéis” expressa essa relação de aliança sem confundi-lo diretamente com ἅγιοι, embora “piedosos” também seja possível.
- source_word: ἀρνία
  choice: cordeiros
  rationale: O grego se refere especificamente a cordeiros, preservando a imagem de vulnerabilidade e mansidão.
- source_word: ἐν ἀκακίᾳ
  choice: em inocência
  rationale: A formulação nominal conserva a construção grega e sua possível ressonância semítica, em vez de reduzi-la simplesmente a um adjetivo.
- source_word: ἐν μέσῳ αὐτῶν
  choice: no meio deles
  rationale: Mantém o sentido espacial e deixa o referente de “deles” tão aberto quanto no grego.
theological_decisions:
- issue: Sentido de ὅσιοι
  choice: fiéis
  alternative: santos; piedosos
  rationale: “Fiéis” destaca a devoção leal a Deus e evita equiparar automaticamente ὅσιοι a ἅγιοι ou importar o uso eclesiástico posterior de “santos”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pretérito “eram” é suprido a partir do contexto narrativo, pois a oração grega não apresenta verbo expresso.
