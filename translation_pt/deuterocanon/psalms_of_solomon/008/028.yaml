translation:
  language: pt
  text: E os fiéis de Deus eram como cordeiros, em inocência, no meio deles.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os piedosos de Deus”.'
