  - marker: b
    text: 'Ou: “adornaram as muralhas dela com grinaldas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡμάλισαν
  choice: aplainaram
  rationale: O verbo indica tornar plano ou liso. “Aplainaram” é conciso, natural e preserva a imagem concreta de preparar uma via.
- source_word: ὁδοὺς τραχείας
  choice: estradas acidentadas
  rationale: A expressão descreve vias ásperas ou difíceis de percorrer. “Estradas acidentadas” comunica essa condição em português corrente.
- source_word: ἀπὸ εἰσόδου αὐτοῦ
  choice: antes da entrada dele
  rationale: 'Embora ἀπό normalmente expresse origem ou afastamento, aqui a construção é incomum e provavelmente tem valor espacial ou temporal: as estradas foram preparadas antes da chegada dele. A nota preserva a dificuldade do grego.'
- source_word: ἤνοιξαν πύλας
  choice: abriram portas
  rationale: Reproduz diretamente a expressão grega sem inserir artigo definido que o texto não exige.
- source_word: ἐπὶ Ἰερουσαλήμ
  choice: em direção a Jerusalém
  rationale: Com o movimento implícito na abertura das portas, ἐπί pode ser entendido em sentido direcional. A tradução conserva essa leitura sem transformar as portas explicitamente em portas pertencentes à cidade.
- source_word: ἐστεφάνωσαν
  choice: coroaram
  rationale: É o sentido literal do verbo e mantém a imagem triunfal ou festiva; a alternativa de adornar com grinaldas é registrada em nota.
- source_word: τείχη αὐτῆς
  choice: as muralhas dela
  rationale: O pronome feminino retoma Jerusalém. “Dela” evita que o possessivo seja entendido como referência ao homem mencionado anteriormente e conserva a personificação da cidade.
