  text: They made rough roads smooth before his entrance; they opened gates toward Jerusalem; they crowned her walls.
translation:
  language: pt
  text: Aplainaram estradas acidentadas antes da entrada dele[a]; abriram portões em direção a Jerusalém; coroaram as muralhas dela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde a entrada dele”. A construção grega é incomum e também pode indicar que o caminho foi preparado para a entrada dele.'
