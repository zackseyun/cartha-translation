lexical_decisions:
- source_word: ἐφοβήθη
  choice: ficou com medo
  rationale: O aoristo de φοβέω, usado aqui com sentido deponente, expressa o surgimento ou a experiência do medo. “Ficou com medo” é natural em português e mantém o coração como sujeito da imagem.
- source_word: ἡ καρδία μου
  choice: meu coração
  rationale: Preserva a imagem antropológica concreta do grego, sem substituí-la por uma interpretação abstrata como “meu íntimo”.
- source_word: ἐταράχθη
  choice: foram abalados
  rationale: Com “ossos” como sujeito e uma comparação material em seguida, o verbo indica forte agitação física. “Foram abalados” conserva a forma passiva e a dimensão corporal, sem impor a ideia mais específica de tremor.
- source_word: τὰ ὀστᾶ μου
  choice: meus ossos
  rationale: Tradução direta e concreta, que mantém a força corporal do lamento.
- source_word: ὡς
  choice: como
  rationale: Introduz a comparação de modo claro e idiomático em português.
- source_word: λίνον
  choice: linho
  rationale: O termo grego pode designar o linho como planta, fibra ou material têxtil. “Linho” preserva essa imagem e sua dificuldade, sem a explicar excessivamente no texto.
