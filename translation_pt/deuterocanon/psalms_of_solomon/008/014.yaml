  text: They omitted no sin that they did not commit[a], beyond the nations.
translation:
  language: pt
  text: Não deixaram de cometer pecado algum; nisso, foram além das nações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: «Não omitiram pecado algum que não tivessem cometido mais do que as nações.»'
    reason: A construção grega usa negações repetidas e uma oração relativa de sintaxe densa. Esta alternativa preserva mais de perto a forma, enquanto a tradução principal explicita naturalmente a comparação expressa por ὑπέρ.
lexical_decisions:
- source_word: παρέλειπον
  choice: deixaram de
  rationale: No contexto da construção negativa, o verbo indica deixar algo por fazer. A expressão portuguesa «não deixaram de cometer pecado algum» preserva a ideia de totalidade de modo natural.
- source_word: ἁμαρτίαν
  choice: pecado
  rationale: É o equivalente direto e corrente, adequado ao sentido moral e religioso do termo no contexto.
- source_word: ἐποίησαν
  choice: cometer
  rationale: Embora o verbo signifique literalmente «fazer», em português o uso idiomático com «pecado» é «cometer».
- source_word: ὑπὲρ τὰ ἔθνη
  choice: ultrapassando as nações
  rationale: ὑπέρ com acusativo expressa excesso ou superação. «Ultrapassando» conserva a força comparativa, e «nações» evita impor a conotação posterior que «gentios» pode ter.
