  source_fidelity: A tradução preserva adequadamente o paralelismo predicativo de αἰνετός e εὐλογημένος, o agente expresso por ὑπὸ Κυρίου e a duração de εἰς τὸν αἰῶνα. «Fiéis» é uma opção apropriada e não eclesiástica para ὁσίων. Contudo, a justaposição de «em seus julgamentos, nos lábios» é pouco clara em português e torna incerta a relação das duas expressões preposicionais com o louvor.
  naturalness: «Nos lábios dos fiéis» é idiomático e preserva a imagem de ἐν στόματι. A revisão emprega «por seus julgamentos» para explicitar de modo natural que os julgamentos do Senhor são o motivo de seu louvor, e usa ponto e vírgula para tornar claro o paralelismo entre as duas aclamações.
  terminology: «Senhor», «julgamentos», «fiéis», «abençoado» e «Israel» são escolhas adequadas. «Fiéis» mantém o sentido de pessoas devotadas a Deus de ὅσιοι, sem equipará-lo automaticamente a ἅγιοι («santos»).
