  text: Praised is the Lord in his judgments in the mouth of the holy ones[d][c][b][a], and blessed is Israel by the Lord forever.
translation:
  language: pt
  text: Louvado é o Senhor por seus julgamentos, nos lábios dos fiéis[a]; e Israel é abençoado pelo Senhor para sempre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na boca dos piedosos”. O termo grego também pode ser traduzido por “devotos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “e que Israel seja abençoado pelo Senhor para sempre”.'
    reason: alternative_reading
lexical_decisions:
- source_word: αἰνετὸς
  choice: Louvado é
  rationale: Mantém o adjetivo predicativo e o caráter declarativo da frase, sem transformá-la necessariamente em desejo ou exortação.
- source_word: Κύριος
  choice: o Senhor
  rationale: Forma portuguesa corrente para o título divino κύριος.
- source_word: ἐν τοῖς κρίμασιν αὐτοῦ
  choice: em seus julgamentos
  rationale: Preserva a preposição e a amplitude de κρίματα, que pode indicar juízos, decisões ou atos judiciais de Deus.
- source_word: ἐν στόματι
  choice: nos lábios
  rationale: Expressão portuguesa natural para a fala, preservando de modo idiomático a imagem grega de algo estar 'na boca' de alguém.
- source_word: ὁσίων
  choice: dos fiéis
  rationale: Expressa a devoção e lealdade a Deus próprias de ὅσιοι sem confundir o termo com ἅγιοι nem introduzir associações eclesiásticas mais fortes de 'santos'.
- source_word: εὐλογημένος
  choice: é abençoado
  rationale: Trata o adjetivo como predicativo declarativo, em paralelo com αἰνετός, deixando a possível leitura desiderativa em nota.
- source_word: Ἰσραὴλ
  choice: Israel
  rationale: Emprega a forma portuguesa estabelecida do nome próprio.
- source_word: ὑπὸ Κυρίου
  choice: pelo Senhor
  rationale: Ὑπό com genitivo assinala o Senhor como agente da bênção.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: Equivalente português claro e idiomático para duração contínua e indefinida.
theological_decisions:
- issue: Valor declarativo ou desiderativo dos adjetivos αἰνετός e εὐλογημένος
  choice: 'Formulação declarativa: ''Louvado é'' e ''é abençoado'''
  alternative: '''Louvado seja'' e ''seja abençoado'''
  rationale: A construção nominal favorece uma declaração, mas a linguagem de louvor e bênção permite uma nuance desiderativa; a alternativa mais relevante é registrada em nota sem resolver excessivamente a tensão.
- issue: Identidade dos ὅσιοι
  choice: fiéis
  alternative: piedosos; devotos
  rationale: O termo caracteriza pessoas devotadas e leais a Deus, sem exigir uma identificação denominacional ou um grupo eclesiástico específico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético preservado. “Nos lábios” evita a rigidez de “na boca” no texto principal, enquanto a nota conserva a imagem literal; “fiéis” comunica a força devocional e pactual de ὅσιοι sem recorrer a terminologia confessional.
