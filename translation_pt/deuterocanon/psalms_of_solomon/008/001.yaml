    issue: «que ressoava mortandade e destruição» é semanticamente e estilisticamente opaco em português.
    rationale: Ressoar normalmente é intransitivo ou se constrói com um som; aplicado transitivamente a «mortandade» obscurece o valor do particípio ἠχούσης e soa pouco natural.
  - severity: low
    issue: «mortandade» é menos preciso que «matança» para σφαγή.
    rationale: «Mortandade» pode designar grande número de mortes em geral, inclusive por doença ou desastre; σφαγή salienta o matar violento.
