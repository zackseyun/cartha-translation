  text: My ear heard distress and the sound of war[a], the sound of a trumpet sounding slaughter and destruction[c][b];
translation:
  language: pt
  text: Meu ouvido ouviu angústia[a] e o som de guerra, o som de uma trombeta que anunciava matança e destruição[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aflição”.
    reason: lexical_alternative
  - marker: b
    text: Ou, mais literalmente, “uma trombeta que ressoava [ou fazia ouvir] matança e destruição”.
