  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação deliberadamente marcante “Meu ouvido ouviu” preserva a imagem sensorial do original; “ressoava mortandade e destruição” mantém a construção poética e sua possível ambiguidade entre produzir um som e anunciar calamidade.
