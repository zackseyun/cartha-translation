lexical_decisions:
- source_word: Θλίψιν
  choice: angústia
  rationale: Expressa pressão, aflição ou sofrimento intenso em português natural, sem a possível carga escatológica de “tribulação”.
- source_word: φωνὴν πολέμου
  choice: o som de guerra
  rationale: Neste contexto auditivo, φωνή indica som, não uma voz que fala; “guerra” preserva o alcance amplo de πόλεμος.
- source_word: τὸ οὖς μου
  choice: meu ouvido
  rationale: Mantém a imagem corporal concreta e enfática do grego, embora “ouvi” fosse mais idiomático.
- source_word: σάλπιγγος
  choice: trombeta
  rationale: Equivalente amplo e tradicional para o instrumento usado como sinal militar, sem especificar indevidamente seu formato ou material.
- source_word: ἠχούσης
  choice: que ressoava
  rationale: Evita a repetição pouco elegante “som... que soava” e conserva a ideia de a trombeta fazer ouvir ou propagar aquilo que se segue.
- source_word: σφαγὴν
  choice: mortandade
  rationale: Comunica matança violenta e em larga escala, conservando a gravidade do termo sem acrescentar o tom coloquial que “carnificina” pode ter.
- source_word: ὄλεθρον
  choice: destruição
  rationale: Equivalente direto e abrangente para ruína devastadora, formando uma dupla forte com “mortandade”.
