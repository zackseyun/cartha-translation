base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/036.yaml
  text: Do not overlook us[a], our God[b], lest the nations swallow us up as though there were no one to redeem.
translation:
  language: pt
  text: Não nos ignores, ó nosso Deus, para que as nações não nos engulam como se não houvesse quem nos resgatasse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como se não houvesse um resgatador” ou “como se ninguém nos livrasse”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ὑπερίδῃς
  choice: Não nos ignores
  rationale: O verbo significa olhar para além de alguém e, por extensão, desconsiderar ou ignorar. A formulação é natural em português e preserva a força da súplica.
- source_word: ὁ θεὸς ἡμῶν
  choice: ó nosso Deus
  rationale: O nominativo tem função vocativa. A partícula «ó» torna explícito o chamamento sem alterar o sentido.
- source_word: ἵνα μὴ
  choice: para que ... não
  rationale: Neste contexto, a construção introduz o resultado temido da possível omissão divina; esta formulação corrente mantém essa relação sem recorrer ao mais solene «para que não suceda que».
- source_word: καταπίωσιν
  choice: engulam
  rationale: Preserva a imagem concreta de tragar por inteiro, em vez de a atenuar com «consumam» ou «destruam».
- source_word: ἔθνη
  choice: as nações
  rationale: No contexto da oração judaica, refere-se aos povos estrangeiros como categoria reconhecida. «As nações» é claro e evita impor o sentido religioso posterior de «gentios».
- source_word: ὡς μὴ ὄντος λυτρουμένου
  choice: como se não houvesse quem nos resgatasse
  rationale: A construção genitiva absoluta expressa a aparente inexistência de alguém que esteja realizando o resgate. A tradução verbal preserva o particípio e explicita «nos» como objeto contextual em português natural.
theological_decisions:
- issue: Tradução de λυτρουμένου
  choice: quem nos resgatasse
  alternative: um resgatador; quem nos livrasse
  rationale: O particípio deriva do campo semântico de resgatar ou libertar, mas não constitui aqui um título explícito. A opção verbal evita transformar a expressão em título messiânico e conserva as associações de resgate; a nota registra a alternativa mais ampla «livrar».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Ó nosso Deus» conserva o tom de oração; «engulam» mantém a metáfora vívida do grego. A nota preserva a amplitude semântica e a possível leitura substantiva do particípio.
