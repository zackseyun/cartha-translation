lexical_decisions:
- source_word: ἐμίανεν
  choice: profanou
  rationale: O verbo μίανω indica tornar impuro no sentido ritual ou moral. Neste contexto, em que Jerusalém e objetos consagrados são atingidos, “profanou” comunica com naturalidade a violação de sua santidade, sem reduzir a ideia à poluição material.
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome geográfico.
- source_word: τὰ ἡγιασμένα
  choice: as coisas consagradas
  rationale: O particípio perfeito passivo substantivado de ἁγιάζω designa coisas que foram separadas ou tornadas santas. “As coisas consagradas” preserva tanto a referência ampla quanto o resultado duradouro da consagração.
- source_word: τῷ ὀνόματι τοῦ θεοῦ
  choice: ao nome de Deus
  rationale: O dativo pode indicar dedicação ou relação com o nome divino. “Ao nome de Deus” expressa de modo conciso que essas coisas foram destinadas à honra ou ao culto do nome de Deus, sem impor uma leitura instrumental.
theological_decisions:
- issue: Relação expressa pelo dativo τῷ ὀνόματι τοῦ θεοῦ
  choice: ao nome de Deus
  alternative: em nome de Deus; pelo nome de Deus
  rationale: A formulação principal entende o dativo como dedicação, apropriada a coisas consagradas. Como a construção também admite uma relação mais geral, a nota preserva a alternativa “em nome de Deus”; evita-se fazer de “pelo nome” a leitura principal, pois ela sugere uma instrumentalidade menos provável no contexto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Profanou” combina diretamente com Jerusalém e com objetos sagrados; “as coisas consagradas” mantém a amplitude do neutro plural grego.
