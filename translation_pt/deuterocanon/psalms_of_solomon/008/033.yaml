  text: Turn your mercy toward us[a], O God[b], and have compassion on us.
translation:
  language: pt
  text: Volta para nós a tua misericórdia, ó Deus, e tem compaixão de nós.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίστρεψον
  choice: Volta
  rationale: O imperativo preserva a imagem verbal de fazer a misericórdia voltar-se em direção aos suplicantes. Em português, «volta para nós a tua misericórdia» mantém essa imagem e é compreensível no registro poético da oração.
- source_word: τὸ ἔλεός σου
  choice: a tua misericórdia
  rationale: ἔλεος designa misericórdia ou favor compassivo; «misericórdia» é o equivalente direto e natural neste pedido dirigido a Deus.
- source_word: ἐφʼ ἡμᾶς
  choice: para nós
  rationale: A preposição ἐπί com acusativo indica direção. «Para nós» expressa naturalmente o movimento figurado da misericórdia em direção aos que oram.
- source_word: οἰκτείρησον
  choice: tem compaixão de nós
  rationale: O verbo comunica piedade compassiva. «Tem compaixão de nós» preserva essa nuance e evita repetir simplesmente «misericórdia».
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leve cadência poética própria de uma súplica. A ordem «Volta para nós a tua misericórdia» conserva a imagem e a estrutura do grego sem soar excessivamente arcaica.
