lexical_decisions:
- source_word: εἶπα τῇ καρδίᾳ μου
  choice: disse ao meu coração
  rationale: Mantém de modo natural e inteligível a construção grega literal e preserva a imagem do coração como sede da reflexão interior.
- source_word: Ποῦ ἄρα
  choice: Onde, então
  rationale: Ποῦ exprime lugar, enquanto ἄρα acrescenta força inferencial ou reflexiva; “Onde, então” conserva ambas.
- source_word: κρινεῖ
  choice: julgará
  rationale: Traduz o sentido básico de κρίνω sem antecipar a ideia mais específica de condenação, que o verbo isoladamente não exige.
- source_word: αὐτόν
  choice: o
  rationale: Pronome acusativo masculino singular, retomado naturalmente em português pelo pronome objeto “o”.
- source_word: ὁ θεός
  choice: Deus
  rationale: Equivalente português padrão neste contexto, sem necessidade de explicitar o artigo grego.
