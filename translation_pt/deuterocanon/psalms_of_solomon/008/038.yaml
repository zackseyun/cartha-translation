  text: And we will not turn away from you[b][a], because your judgments toward us are good.
translation:
  language: pt
  text: E nós não nos afastaremos de ti[a], porque os teus juízos para conosco são bons[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «não nos manteremos afastados de ti» ou «não nos apartaremos de ti».
    reason: lexical_alternative
  - marker: b
    text: Ou «são bondosos».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεξόμεθά
  choice: não nos afastaremos
  rationale: O futuro médio, construído com o genitivo pessoal σου, expressa manter-se afastado ou retirar-se de alguém. «Não nos afastaremos de ti» é natural em português e preserva o sentido relacional sem acrescentar a ideia específica de apostasia.
- source_word: χρηστὰ
  choice: bons
  rationale: χρηστός pode significar bom, bondoso, benévolo ou favorável. «Bons» mantém a amplitude semântica e combina naturalmente com «juízos», enquanto a nota registra a nuance de bondade.
- source_word: κρίματά
  choice: juízos
  rationale: κρίματα designa juízos, decisões judiciais ou atos de julgamento. «Juízos» preserva o registro formal e teológico sem limitar o referente a decretos escritos.
- source_word: εἰς ἡμᾶς
  choice: para conosco
  rationale: εἰς ἡμᾶς indica direção ou relação. «Para conosco» é idiomático e conserva a relação dos juízos divinos com a comunidade, sem torná-los necessariamente apenas benéficos ou punitivos.
