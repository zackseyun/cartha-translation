base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/008/035.yaml
  text: For your faithfulness is with us[a], and we have stiffened our neck[c][b], and you are our disciplinarian.
translation:
  language: pt
  text: Pois a tua fidelidade está conosco[a], e[c] nós endurecemos a nossa cerviz[b], e tu és aquele que nos disciplina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a tua fé está conosco».'
    reason: lexical_alternative
  - marker: b
    text: «Endurecer a cerviz» é uma expressão que significa tornar-se obstinado ou teimoso.
    reason: cultural_note
  - marker: c
    text: 'Ou: «mas nós endurecemos».'
    reason: translation_alternative
lexical_decisions:
- source_word: πίστις σου
  choice: a tua fidelidade
  rationale: No contexto de uma fala dirigida a Deus, o substantivo com o possessivo exprime mais naturalmente a constância e lealdade de Deus. A alternativa formal «a tua fé» é preservada em nota.
- source_word: μεθʼ ἡμῶν
  choice: está conosco
  rationale: Reproduz diretamente o sentido relacional da expressão grega sem acrescentar explicações.
- source_word: ἐσκληρύναμεν τράχηλον ἡμῶν
  choice: endurecemos a nossa cerviz
  rationale: Preserva a metáfora bíblica e o singular coletivo do grego. «Cerviz» mantém um registro digno e reconhecível, enquanto a nota esclarece o sentido idiomático.
- source_word: παιδευτὴς ἡμῶν
  choice: aquele que nos disciplina
  rationale: Expressa a função tanto formativa quanto corretiva de παιδευτής e torna explícita, de modo natural em português, a relação indicada pelo genitivo «nosso».
theological_decisions:
- issue: Sentido de πίστις σου em referência a Deus
  choice: a tua fidelidade
  alternative: a tua fé
  rationale: A leitura principal entende a expressão como a constância fiel de Deus para com o povo, sem eliminar a alternativa lexical mais formal.
- issue: Relação entre a fidelidade divina e a obstinação humana
  choice: mas nós endurecemos
  alternative: e nós endurecemos
  rationale: O contraste é plausível pelo pronome enfático ἡμεῖς e pela progressão do contexto, embora καί corresponda formalmente a «e»; por isso, a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a metáfora bíblica da cerviz e evita um termo técnico ou excessivamente punitivo para παιδευτής.
