  text: God was vindicated in his judgments among the nations of the earth,[a]
translation:
  language: pt
  text: Deus foi reconhecido como justo em seus julgamentos entre as nações da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus foi justificado em seus julgamentos entre as nações da terra”.'
    reason: Alternativa lexical mais formal para ἐδικαίωθη.
lexical_decisions:
- source_word: ἐδικαίωθη
  choice: foi reconhecido como justo
  rationale: O aoristo passivo de δικαιόω, aplicado a Deus, indica que ele foi manifestado ou reconhecido como justo, não que tenha se tornado justo. A formulação é clara em português corrente e preserva a força declarativa do verbo.
- source_word: κρίμασιν
  choice: julgamentos
  rationale: κρίμασιν designa decisões ou atos judiciais. “Julgamentos” conserva o sentido jurídico e moral sem restringi-lo a decretos abstratos.
- source_word: ἔθνεσι
  choice: nações
  rationale: Neste contexto, ἔθνεσι refere-se amplamente aos povos da terra, e não necessariamente aos gentios em contraste com os judeus.
- source_word: τῆς γῆς
  choice: da terra
  rationale: Com “nações”, a expressão tem alcance universal; “da terra” representa naturalmente esse sentido em português.
theological_decisions:
- issue: Como traduzir δικαιόω quando Deus é o sujeito passivo
  choice: foi reconhecido como justo
  alternative: foi justificado; mostrou-se justo
  rationale: A tradução evita sugerir que Deus tenha adquirido justiça e expressa que seus julgamentos demonstraram publicamente que ele é justo. A nota preserva a alternativa formal “foi justificado”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha de perto o grego, enquanto “foi reconhecido como justo” esclarece o valor contextual do passivo sem eliminar a alternativa formal, registrada em nota.
