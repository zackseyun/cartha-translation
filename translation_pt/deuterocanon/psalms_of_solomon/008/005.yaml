lexical_decisions:
- source_word: συντριβὴ
  choice: foram esmagados
  rationale: O substantivo exprime esmagamento ou quebrantamento; a construção verbal explicita em português a predicação nominal subentendida no grego e mantém a intensidade da imagem.
- source_word: ἡ ὀσφύς μου
  choice: meus lombos
  rationale: “Lombos” é o equivalente anatômico tradicional e preserva a força corporal do lamento. O plural idiomático em português corresponde naturalmente ao singular coletivo grego.
- source_word: ἀπὸ ἀκοῆς
  choice: por causa do que ouvi
  rationale: A expressão indica a causa da reação física provocada pelo que chegou aos ouvidos do salmista. Esta formulação preserva o ato de ouvir sem pressupor que se tratasse necessariamente de uma notícia formal.
- source_word: παρελύθη
  choice: cederam
  rationale: No contexto de joelhos, o verbo descreve perda de força ou capacidade. “Cederam” é idiomático e mantém aberta a possibilidade de fraqueza intensa ou colapso, sem impor paralisia clínica.
- source_word: γόνατά μου
  choice: meus joelhos
  rationale: Equivalente lexical direto e natural.
