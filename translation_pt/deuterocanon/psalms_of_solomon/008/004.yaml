  text: I heard a voice in Jerusalem[b][a], the holy city.
translation:
  language: pt
  text: Ouvi um som em Jerusalém, cidade santa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cidade de santidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴν
  choice: um som
  rationale: No contexto imediato, φωνή retoma o ruído mencionado nos versículos anteriores; “som” preserva essa repetição retórica sem personificar indevidamente o que foi ouvido.
- source_word: ἤκουσα
  choice: Ouvi
  rationale: O aoristo indica de modo simples a percepção de um som, naturalmente expressa em português por “ouvi”.
- source_word: εἰς Ἰερουσαλήμ
  choice: em Jerusalém
  rationale: Embora εἰς normalmente indique movimento para dentro, no grego posterior também pode ter sentido locativo; aqui “em Jerusalém” produz o sentido contextual mais natural.
- source_word: πόλιν ἁγιάσματος
  choice: cidade santa
  rationale: A expressão formalmente significa “cidade de santidade”; “cidade santa” comunica esse valor com clareza e dignidade em português, enquanto a forma literal é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene. O artigo foi omitido antes de “cidade santa” para conservar a aposição enxuta do grego. “Som” foi preferido a “voz” por causa da repetição contextual de φωνή nos versículos anteriores.
