  yaml_path: translation/deuterocanon/psalms_of_solomon/008/012.yaml
  text: The holy things of God were being plundered[b][a], as though there were no heir to redeem them.
translation:
  language: pt
  text: As coisas sagradas de Deus eram saqueadas[a], como se não houvesse herdeiro que as resgatasse.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “As coisas sagradas” também pode ser entendido, de modo mais específico, como “os objetos sagrados” ou, menos provavelmente aqui, “o santuário”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “como se não existisse herdeiro que as estivesse resgatando”; o particípio grego pode ser traduzido de maneira mais direta.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ ἅγια
  choice: as coisas sagradas
  rationale: O neutro plural indica mais naturalmente aquilo que é santo ou sagrado e pertencente a Deus. A formulação mantém a referência concreta, mas ampla, sem restringi-la ao santuário.
- source_word: διηρπάζοντο
  choice: eram saqueadas
  rationale: O imperfeito expressa uma ação em curso ou repetida, e o verbo comunica apropriação violenta e espoliação.
- source_word: ὡς μὴ ὄντος
  choice: como se não houvesse
  rationale: A expressão introduz uma comparação contrária ao que se esperaria e soa natural em português.
- source_word: κληρονόμου
  choice: herdeiro
  rationale: Mantém o sentido comum do substantivo grego sem acrescentar ao termo a função de protetor ou redentor.
- source_word: λυτρουμένου
  choice: que as resgatasse
  rationale: A oração relativa expressa em português claro a ação do particípio ligada ao herdeiro, preservando a ideia de libertar ou recuperar aquilo que lhe pertence.
