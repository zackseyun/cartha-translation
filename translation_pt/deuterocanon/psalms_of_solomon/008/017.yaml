lexical_decisions:
- source_word: ἔκρινεν
  choice: decretou
  rationale: O aoristo de κρίνω pode expressar decisão ou determinação judicial. Neste contexto, “decretou” comunica de modo natural que a guerra foi determinada autoritativamente, sem sugerir apenas uma avaliação do conflito.
- source_word: τὸν πόλεμον
  choice: guerra
  rationale: πόλεμος normalmente designa guerra ou conflito armado amplo, não apenas uma batalha isolada.
- source_word: ἐπὶ
  choice: contra
  rationale: Com πόλεμος e o alvo da hostilidade, ἐπί indica direção hostil; “contra” é a formulação portuguesa mais clara.
- source_word: Ἰερουσαλήμ
  choice: Jerusalém
  rationale: Forma consagrada do nome da cidade em português.
- source_word: γῆν
  choice: terra
  rationale: γῆ tem amplitude semântica para indicar terra, região ou território. “Terra” preserva essa amplitude, enquanto a nota registra a alternativa contextual “território”.
- source_word: αὐτῆς
  choice: sua
  rationale: O pronome feminino retoma Jerusalém. “Sua terra” é natural em português e mantém a relação da cidade com a região que lhe pertence.
theological_decisions:
- issue: Força judicial de κρίνω aplicada à guerra
  choice: decretou guerra
  alternative: julgou a guerra
  rationale: A tradução principal preserva a ideia de uma decisão autorizada sem produzir a impressão moderna de que o sujeito apenas avaliou uma guerra. A formulação mais literal é mantida em nota, preservando a tensão lexical do grego.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A construção concisa acompanha o grego; as notas preservam as alternativas relevantes sem tornar o texto principal pouco natural.
