  text: He decreed war against Jerusalem and her land[a][b].
translation:
  language: pt
  text: 'Ele decretou guerra contra Jerusalém e sua terra[a][b].


    [a] Ou: “seu território”.

    [b] Ou, mais literalmente: “julgou a guerra”.'
  philosophy: optimal-equivalence
