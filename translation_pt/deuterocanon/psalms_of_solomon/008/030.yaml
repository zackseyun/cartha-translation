lexical_decisions:
- source_word: ἰδοὺ δή
  choice: Eis, pois
  rationale: A combinação funciona como marcador enfático que chama a atenção para o que segue. “Eis, pois” preserva o tom elevado e orante sem recorrer a uma formulação excessivamente arcaica.
- source_word: ὁ θεός
  choice: ó Deus
  rationale: O contexto exige leitura vocativa. “Ó Deus” é a forma natural e digna de reproduzir a invocação direta em português.
- source_word: ἔδειξας
  choice: mostraste-nos
  rationale: O aoristo indica uma ação realizada. O pretérito perfeito simples é idiomático em português e mantém “mostrar” sem acrescentar a nuance interpretativa de “revelar”.
- source_word: τὸ κρῖμά σου
  choice: o teu juízo
  rationale: κρῖμα designa aqui o ato judicial ou veredito de Deus. “Juízo” conserva o peso forense e é mais natural neste registro bíblico do que “sentença”, que seria mais restrito.
- source_word: ἐν τῇ δικαιοσύνῃ σου
  choice: em tua justiça
  rationale: A expressão pode indicar a esfera ou o modo em que Deus age. “Justiça” comunica em português tanto a retidão divina quanto sua dimensão judicial, enquanto a nota preserva a alternativa lexical “retidão”.
theological_decisions:
- issue: Sentido de δικαιοσύνη no contexto do juízo divino
  choice: justiça
  alternative: retidão
  rationale: “Justiça” preserva naturalmente em português as dimensões moral e judicial da palavra grega, sem reduzir o texto apenas à aplicação de uma pena. “Retidão” continua sendo uma alternativa legítima e é registrada em nota.
translation_notes:
  register: Português moderno, solene e acessível, com tratamento por “tu” coerente com a oração. “Eis, pois” mantém a ênfase discursiva do grego; “juízo” e “justiça” preservam o campo judicial sem eliminar sua dimensão moral.
