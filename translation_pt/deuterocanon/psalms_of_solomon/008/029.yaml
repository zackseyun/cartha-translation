  text: Praised be the Lord[b][a], who judges the whole earth in his righteousness.
translation:
  language: pt
  text: Louvado seja o Senhor, que julga toda a terra segundo a sua justiça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰνετὸς
  choice: Louvado seja
  rationale: Expressa o sentido próprio de αἰνετός, “digno de louvor/louvado”, em uma fórmula doxológica natural em português, sem confundi-lo com εὐλογητός, “bendito”.
- source_word: Κύριος
  choice: o Senhor
  rationale: Mantém o título definido e consagrado em português para κύριος neste contexto.
- source_word: ὁ κρίνων
  choice: que julga
  rationale: A oração relativa traduz com naturalidade o particípio presente substantivado e conserva seu valor caracterizador.
- source_word: πᾶσαν τὴν γῆν
  choice: toda a terra
  rationale: Preserva o alcance universal de πᾶσαν e o sentido mais provável de γῆ como terra inteira, e não uma região específica.
- source_word: ἐν δικαιοσύνῃ αὐτοῦ
  choice: segundo a sua justiça
  rationale: Em português, “segundo a sua justiça” comunica naturalmente a norma ou maneira justa pela qual o Senhor julga; “justiça” abrange aqui tanto retidão quanto ação judicial justa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e reverente, com cadência doxológica. A tradução distingue αἰνετός (“louvado”) de “bendito” e evita uma formulação excessivamente literal como “em sua justiça”, menos natural neste contexto.
