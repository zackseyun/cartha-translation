  text: The rulers of the land met him with joy[a]; they said to him, “Blessed is your way. Come[c][b], enter with peace.”
translation:
  language: pt
  text: 'Os governantes da terra foram ao encontro dele com alegria e lhe disseram: “Bem-vinda é a sua viagem[a]. Venham, entrem em paz.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Seu caminho é desejado” ou, conforme o contexto, “Sua vinda é bem-vinda”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠπάντησαν
  choice: foram ao encontro
  rationale: Expressa não apenas o encontro, mas o movimento de sair para receber alguém, adequado à cena de acolhimento.
- source_word: οἱ ἄρχοντες
  choice: os governantes
  rationale: Preserva o sentido político de autoridades ou dirigentes.
- source_word: τῆς γῆς
  choice: da terra
  rationale: Mantém a amplitude lexical de γῆ; no contexto, pode designar a região ou o país, sem excluir formalmente o sentido mais amplo.
- source_word: μετὰ χαρᾶς
  choice: com alegria
  rationale: Tradução direta e natural da expressão de modo.
- source_word: Εὐκτὴ
  choice: bem-vindo
  rationale: O adjetivo significa desejado, almejado ou acolhido com satisfação. Em predicação com ὁδός, “bem-vindo” comunica que o caminho ou a vinda era desejado, sem introduzir a ideia distinta de prosperidade.
- source_word: ἡ ὁδός σου
  choice: seu caminho
  rationale: Preserva a amplitude de ὁδός, que pode indicar estrada, viagem, vinda ou curso de ação.
- source_word: δεῦτε
  choice: venham
  rationale: Imperativo plural de convite, em concordância com o plural de εἰσέλθατε; embora se dirijam a uma figura principal, a forma grega inclui seus acompanhantes.
- source_word: εἰσέλθατε
  choice: entrem
  rationale: Reproduz o imperativo plural e o sentido explícito de entrar.
- source_word: μετʼ εἰρήνης
  choice: em paz
  rationale: Expressão idiomática portuguesa que conserva o sentido de entrada pacífica e segura.
