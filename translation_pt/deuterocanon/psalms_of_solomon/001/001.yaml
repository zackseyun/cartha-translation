base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/001/001.yaml
  text: I cried out to the Lord when I was afflicted to the end[c][b][a], to God when sinners attacked.
translation:
  language: pt
  text: Clamei ao Senhor quando fui afligido até o fim[a][b], a Deus quando pecadores me atacaram.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando eu era afligido”.'
    reason: A construção grega também pode destacar o processo contínuo de sofrer aflição.
  - marker: b
    text: “Até o fim” traduz literalmente o grego εἰς τέλος; a expressão também pode significar “completamente”, “ao extremo” ou “continuamente”.
    reason: A frase grega pode indicar duração ou funcionar como intensificador, e o contexto não resolve plenamente a nuance.
  - marker: c
    text: A expressão grega traduzida por “quando pecadores me atacaram” é difícil; também pode ter o sentido de “quando pecadores vieram sobre mim” ou indicar outra ação hostil.
    reason: A forma verbal ἐπιδέσθαι é lexicalmente incerta neste contexto, embora o lamento favoreça uma interpretação hostil.
lexical_decisions:
- source_word: ἘΒΟΗΣΑ
  choice: Clamei
  rationale: O aoristo de βοάω expressa um clamor urgente. “Clamei” é natural no contexto de oração e preserva mais força que “chamei”.
- source_word: πρὸς Κύριον
  choice: ao Senhor
  rationale: πρός com acusativo indica a direção do clamor. “Senhor” é a tradução corrente e digna de κύριος neste contexto.
- source_word: ἐν τῷ θλίβεσθαί με
  choice: quando fui afligido
  rationale: A construção ἐν com infinitivo articular tem valor temporal ou circunstancial. A forma passiva conserva a ideia de que a aflição foi sofrida pelo orante.
- source_word: εἰς τέλος
  choice: até o fim
  rationale: A tradução literal preserva a ambiguidade entre duração, extremo e possível uso intensificador, sem escolher silenciosamente uma dessas nuances.
- source_word: πρὸς τὸν θεὸν
  choice: a Deus
  rationale: Mantém o segundo membro paralelo e a repetição deliberada do destinatário do clamor.
- source_word: ἐν τῷ ἐπιδέσθαι
  choice: quando ... me atacaram
  rationale: A forma grega é lexicalmente difícil. No contexto de lamento, uma ação hostil dos pecadores contra o orante é provável; o pronome “me” explicita em português o alvo implícito.
- source_word: ἁμαρτωλοῦς
  choice: pecadores
  rationale: É a correspondência direta para pessoas caracterizadas pelo pecado, sem ampliar o sentido para “perversos” ou “ímpios”.
theological_decisions:
- issue: Tradução de κύριος em uma oração dirigida ao Deus de Israel
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” é a equivalência tradicional e corrente, adequada ao contexto, sem introduzir uma nuance mais específica de domínio.
- issue: Paralelismo entre “ao Senhor” e “a Deus”
  choice: Preservar os dois títulos
  alternative: Fundir as duas expressões em um único destinatário
  rationale: A repetição está no grego e faz parte da estrutura poética; mantê-la evita apagar a intensificação do clamor.
- issue: Natureza da aflição expressa por θλίβεσθαι
  choice: 'Manter a voz passiva: “fui afligido”'
  alternative: 'Usar o estado abstrato: “estava angustiado”'
  rationale: A voz passiva preserva a possibilidade de pressão ou aflição causada por agentes externos, sem definir quem a causou.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. O paralelismo do grego foi preservado, assim como a formulação incomum “até o fim”, cuja ambiguidade é esclarecida em nota.
