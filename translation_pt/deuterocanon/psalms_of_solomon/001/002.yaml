  text: Suddenly[a], a cry of war was silenced before me; he will hear me[c][b], because I am filled with righteousness.
translation:
  language: pt
  text: De repente, calou-se diante de mim um grito de guerra.[a] Ele[b] me ouvirá, porque estou cheio de retidão.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma grega transmitida também pode evocar a ideia de um grito ensurdecedor; “grito de batalha” é outra tradução possível para “grito de guerra”.
    reason: lexical_ambiguity
  - marker: b
    text: O grego não declara o sujeito; pelo contexto, entende-se naturalmente Deus.
    reason: implicit_subject
  - marker: c
    text: Ou “justiça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξάπινα
  choice: De repente
  rationale: Expressa o início abrupto indicado pelo advérbio e soa natural em português atual.
- source_word: κωφωθὴ
  choice: calou-se
  rationale: A forma transmitida está ligada à ideia de surdez ou emudecimento; no contexto, a leitura passiva de silenciamento produz uma frase compreensível sem substituir o texto grego fornecido por uma conjectura.
- source_word: κραυγὴ πολέμου
  choice: um grito de guerra
  rationale: Preserva a relação genitiva do grego e mantém uma expressão corrente e digna em português.
- source_word: ἐνώπιόν μου
  choice: diante de mim
  rationale: Equivalente idiomático da expressão espacial e pessoal grega.
- source_word: ἐπακούσεταί μου
  choice: me ouvirá
  rationale: O verbo pode implicar escuta favorável ou resposta, mas 'ouvirá' não explicita mais do que o grego; o sujeito continua não nomeado.
- source_word: ἐπλήσθην
  choice: estou cheio
  rationale: Comunica de modo natural o estado resultante do aoristo passivo no nexo causal do verso.
- source_word: δικαιοσύνης
  choice: retidão
  rationale: Aqui designa primariamente a condição moral/religiosa alegada pelo orante; 'justiça' permanece uma possibilidade lexical.
theological_decisions:
- issue: Sujeito implícito de ἐπακούσεταί μου
  choice: Ele me ouvirá
  alternative: Deus me ouvirá; serei ouvido
  rationale: O contexto de oração permite entender Deus como referente, mas o texto grego não o nomeia; o pronome preserva essa implicitude.
- issue: Sentido de δικαιοσύνη na alegação do orante
  choice: retidão
  alternative: justiça
  rationale: A tradução conserva a afirmação forte do texto sem reformulá-la para evitar sua tensão teológica.
translation_notes:
  register: Português moderno, claro e solene, com construção poética natural. A tradução segue o texto grego fornecido, inclusive sua forma difícil κωφωθὴ, e registra a ambiguidade em nota sem adotar silenciosamente uma emenda conjectural.
