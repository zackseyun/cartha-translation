  text: They were exalted to the stars[a]; they said[d][c][b], “We will certainly not fall.”
translation:
  language: pt
  text: 'Foram exaltados até as estrelas[a]; disseram: “Certamente não cairão.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foram elevados até as estrelas”. A expressão grega retrata, de forma hiperbólica, uma elevação extrema.
    reason: lexical_alternative
  - marker: b
    text: Ou “De modo nenhum cairão”. O grego emprega uma negação enfática; o verbo está na terceira pessoa do plural.
    reason: grammar_and_lexical_alternative
lexical_decisions:
- source_word: ὑψώθησαν
  choice: foram exaltados
  rationale: O aoristo passivo de ὑψόω admite tanto elevação concreta quanto exaltação figurada. “Foram exaltados” preserva a voz passiva e, no contexto, mantém a possível conotação de engrandecimento, sem especificar quem os exaltou.
- source_word: ἕως τῶν ἄστρων
  choice: até as estrelas
  rationale: ἕως com o genitivo indica extensão ou limite. “Até as estrelas” reproduz diretamente a imagem hiperbólica de altura extrema e soa natural em português.
- source_word: εἶπαν
  choice: disseram
  rationale: Tradução direta e não interpretativa do verbo narrativo simples.
- source_word: Οὐ μὴ πέσωσιν
  choice: Certamente não cairão
  rationale: A combinação οὐ μή exprime negação enfática. “Certamente não” comunica essa força em português atual. A terceira pessoa do plural de πέσωσιν é preservada por “cairão”, sem convertê-la em primeira pessoa.
theological_decisions:
- issue: Se a declaração deve ser apresentada explicitamente como arrogância ou apenas com sua força enfática
  choice: Manter a afirmação enfática — “Certamente não cairão” — sem acrescentar uma qualificação moral explícita
  alternative: 'Explicitar o tom de presunção, por exemplo: “Jamais cairão”'
  rationale: O contexto pode sugerir autoconfiança presunçosa, mas esta oração não contém um termo que nomeie diretamente orgulho ou arrogância. A negação enfática conserva o tom de segurança absoluta sem resolver além do texto.
- issue: Pessoa gramatical na fala citada
  choice: 'Preservar a terceira pessoa plural: “não cairão”'
  alternative: 'Naturalizar como primeira pessoa plural: “não cairemos”'
  rationale: πέσωσιν é terceira pessoa plural, não primeira. Embora uma fala direta em primeira pessoa pudesse soar mais esperada, mudar para “não cairemos” eliminaria uma característica real e potencialmente significativa do texto grego.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. A construção mantém a imagem elevada do original, a voz passiva e a incomum terceira pessoa plural na fala, evitando tanto coloquialismo quanto interpretação teológica excessiva.
