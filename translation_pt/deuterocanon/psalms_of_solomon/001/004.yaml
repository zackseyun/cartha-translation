  text: Their wealth was spread throughout all the land[c][b][a], and their glory reached to the end of the earth.
translation:
  language: pt
  text: A riqueza deles se espalhou por toda a terra[a], e sua glória[b] chegou até os confins da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Terra” também pode significar aqui “país”, “território” ou “mundo”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “renome” ou “fama”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πλοῦτος αὐτῶν
  choice: a riqueza deles
  rationale: Πλοῦτος designa riqueza ou bens; “riqueza” é corrente, coletiva e adequada ao registro poético. Αὐτῶν é expresso naturalmente por “deles”.
- source_word: διεδόθη
  choice: se espalhou
  rationale: O aoristo passivo de διαδίδωμι indica difusão ampla. A construção pronominal “se espalhou” é natural em português e evita o tom comercial de “foi distribuída”.
- source_word: εἰς πᾶσαν τὴν γῆν
  choice: por toda a terra
  rationale: A preposição εἰς com o verbo de difusão comunica extensão por toda a área. “Terra” preserva em português a possível referência tanto a um território quanto ao mundo.
- source_word: ἡ δόξα αὐτῶν
  choice: a glória deles
  rationale: Δόξα pode indicar glória, honra ou renome. “Glória” mantém o registro elevado e não restringe indevidamente o sentido à fama.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: até os confins da terra
  rationale: A expressão indica o limite mais distante da terra. “Até os confins da terra” é idiomático, claro e poeticamente digno em português.
theological_decisions:
- issue: Alcance de γῆ nas duas ocorrências
  choice: Manter “terra” nas duas ocorrências, permitindo sentido territorial ou universal
  alternative: Traduzir a primeira ocorrência por “país” ou “território” e a segunda por “terra”
  rationale: O português “terra” conserva a ambiguidade lexical do grego. O paralelismo e “até os confins” ainda permitem perceber a ampliação de alcance sem impor uma distinção ausente do vocábulo grego.
- issue: Elipse verbal no segundo membro poético
  choice: 'Preservar a elipse: “e a glória deles, até os confins da terra”'
  alternative: Explicitar “e a glória deles chegou até os confins da terra” ou repetir “se espalhou”
  rationale: O grego não traz verbo no segundo membro. A elipse é compreensível em português com a vírgula e preserva a estrutura poética e a relação aberta com διεδόθη, sem introduzir um verbo diferente.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. A ordem é natural para leitores brasileiros e amplamente compreensível no espaço lusófono. A elipse do segundo membro foi mantida deliberadamente para refletir o grego.
