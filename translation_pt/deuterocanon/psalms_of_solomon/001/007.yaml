lexical_decisions:
- source_word: αἱ ἁμαρτίαι
  choice: os pecados
  rationale: O substantivo plural designa diretamente pecados ou atos de transgressão; «pecados» é a correspondência mais natural e concisa em português.
- source_word: αὐτῶν
  choice: deles
  rationale: Preserva o pronome possessivo referente às pessoas mencionadas no contexto, sem explicitar indevidamente o referente.
- source_word: ἐν ἀποκρύφοις
  choice: eram cometidos em segredo
  rationale: A expressão grega, embora formalmente plural e elíptica, funciona aqui de modo amplo, indicando ocultação ou ação clandestina. A formulação evita restringi-la necessariamente a lugares físicos secretos.
- source_word: καὶ ἐγώ
  choice: e eu
  rationale: Mantém o valor normal de καί e não intensifica a relação como adversativa com «mas».
- source_word: οὐκ ᾔδειν
  choice: não sabia
  rationale: Expressa de forma clara e idiomática a falta de conhecimento ou percepção indicada pelo imperfeito de οἶδα.
theological_decisions:
- issue: Natureza da ocultação em ἐν ἀποκρύφοις
  choice: Os pecados eram cometidos em segredo, sem especificar de quem estavam ocultos.
  alternative: Os pecados deles estavam em lugares secretos / em coisas ocultas.
  rationale: O grego é conciso e elíptico. A tradução mantém aberta a extensão da ocultação e não afirma que os pecados estivessem escondidos de Deus nem limita a expressão a locais físicos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção «eram cometidos» explicita em português o sentido adverbial provável da expressão grega sem definir de quem os pecados estavam ocultos.
