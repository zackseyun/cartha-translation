  text: I thought in my heart that I was filled with righteousness when I prospered and became great in children[a][b][c].
translation:
  language: pt
  text: Pensei em meu coração que fiquei cheia de retidão[a] quando prosperei e me tornei numerosa em filhos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “justiça”. O grego δικαιοσύνη pode referir-se a retidão moral ou a justiça; aqui expressa a avaliação positiva que a falante faz de si mesma.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “tornei-me muita em filhos”. A expressão significa tornar-se abundante em filhos, isto é, ter muitos filhos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλογισάμην
  choice: Pensei
  rationale: O aoristo médio de λογίζομαι introduz uma reflexão interior; “pensei” é corrente e preserva a ideia de ponderação pessoal.
- source_word: ἐν καρδίᾳ μου
  choice: em meu coração
  rationale: Mantém o idioma bíblico que designa o íntimo e a reflexão interior, sem reduzi-lo apenas à atividade intelectual.
- source_word: ἐπλήσθην δικαιοσύνης
  choice: estava repleta de justiça
  rationale: Reproduz a construção passiva e a ideia de plenitude. “Justiça” abrange, em português, tanto retidão moral quanto justiça, preservando a amplitude de δικαιοσύνη. O feminino “repleta” concorda com a forma feminina πολλήν, que sinaliza a voz personificada da cidade.
- source_word: ἐν τῷ εὐθηνῆσαί με
  choice: quando prosperei
  rationale: A construção com infinitivo articular tem valor temporal, e εὐθηνέω indica prosperar ou florescer.
- source_word: πολλὴν γενέσθαι ἐν τέκνοις
  choice: me tornei numerosa em filhos
  rationale: A tradução conserva a noção de crescimento ou abundância quanto aos filhos e respeita o feminino πολλήν, evitando substituir a expressão por uma paráfrase totalmente explícita.
theological_decisions:
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: Neste contexto, a pessoa que fala associa sua prosperidade a uma avaliação positiva de sua condição moral. “Justiça” é a correspondência lexical mais ampla e tradicional em português, sem excluir a nuance de retidão.
- issue: Relação entre prosperidade e justiça
  choice: quando
  alternative: porque
  rationale: A construção grega com ἐν τῷ é temporal. Traduzir por “quando” preserva a associação percebida pela voz poética sem afirmar explicitamente que a prosperidade causava ou provava sua justiça.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe bíblica moderada. O feminino em “repleta” e “numerosa” preserva a personificação feminina indicada pelo grego; a formulação mantém a tensão entre a autopercepção de justiça e os sinais externos de prosperidade.
