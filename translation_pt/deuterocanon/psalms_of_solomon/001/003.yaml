  rationale: A revisão restitui mais adequadamente o aoristo passivo com “fiquei cheia”, traduz δικαιοσύνη por “retidão” sem eliminar a alternativa “justiça”, conserva a concordância feminina explicitamente presente no grego e corrige a nota para que ofereça informação lexical real e esteja ancorada na expressão a que se refere.
