lexical_decisions:
- source_word: ἐξύβρισαν
  choice: agiram com arrogância
  rationale: O verbo expressa conduta insolente, abusiva ou arrogante. A formulação comunica com clareza a força moral do termo sem recorrer a linguagem técnica.
- source_word: ἐν τοῖς ἀγαθοῖς αὐτῶν
  choice: em sua prosperidade
  rationale: O plural substantivado ἀγαθά pode indicar bens, vantagens ou coisas boas; neste contexto, a expressão descreve de modo natural a situação de bem-estar ou prosperidade, sem excluir sua possível dimensão material.
- source_word: οὐκ ἤνεγκαν
  choice: não suportaram
  rationale: O aoristo de φέρω pode significar suportar, aguentar ou resistir. A tradução mantém a concisão e não fornece um objeto que o grego deixa implícito.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla. “Agiram com arrogância” evita o tom menos corrente de “foram insolentes”; “prosperidade” oferece fluidez, enquanto a nota preserva a amplitude concreta de ἀγαθά. A última oração permanece deliberadamente breve e ambígua.
