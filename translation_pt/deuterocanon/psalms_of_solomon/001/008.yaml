base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/001/008.yaml
  text: Their lawless deeds surpassed those of the nations before them[b][a]; they profaned the holy things of the Lord with profanation.
translation:
  language: pt
  text: Suas transgressões ultrapassaram as das nações que vieram antes deles; profanaram as coisas santas do Senhor com profanação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o santuário do Senhor” ou “os lugares santos do Senhor”. O grego traz uma expressão plural que pode se referir, de modo amplo, ao que é sagrado.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱ ἀνομίαι αὐτῶν
  choice: Suas transgressões
  rationale: O plural ἀνομίαι denota violações da lei e pode abranger atos concretos. “Transgressões” preserva o caráter plural e moral da expressão em português natural.
- source_word: ὑπὲρ τὰ πρὸ αὐτῶν ἔθνη
  choice: ultrapassaram as das nações que vieram antes deles
  rationale: ὑπέρ com acusativo expressa comparação e excesso; a formulação verbal comunica com clareza que as transgressões excederam as dos povos anteriores.
- source_word: ἐβεβήλωσαν
  choice: profanaram
  rationale: O verbo indica tornar comum ou tratar irreverentemente aquilo que é sagrado. “Profanaram” distingue essa ideia da simples contaminação ou impureza.
- source_word: τὰ ἅγια Κυρίου
  choice: as coisas santas do Senhor
  rationale: O neutro plural pode designar coisas sagradas, lugares santos ou, em uso cultual, o santuário. A tradução ampla preserva o plural e evita restringir indevidamente a referência.
- source_word: ἐν βεβηλώσει
  choice: com profanação
  rationale: A expressão retoma a raiz do verbo e intensifica ou caracteriza a ação. A repetição “profanaram... com profanação” conserva deliberadamente essa figura cognata.
theological_decisions:
- issue: Se τὰ ἅγια Κυρίου designa especificamente o santuário ou, de modo mais amplo, aquilo que pertence à esfera sagrada do Senhor
  choice: as coisas santas do Senhor
  alternative: o santuário do Senhor / os lugares santos do Senhor
  rationale: Embora τὰ ἅγια possa funcionar como designação cultual do santuário, sua forma plural também admite referência mais ampla a coisas ou espaços sagrados. O texto principal mantém essa amplitude, e a nota registra as leituras mais específicas.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural. Conservou-se a repetição cognata “profanaram... com profanação” por sua força retórica e proximidade com o grego.
