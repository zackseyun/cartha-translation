  yaml_path: translation/deuterocanon/psalms_of_solomon/010/003.yaml
  text: For he has made straight the ways of the righteous[c][b][a], and he will not pervert them in discipline.
translation:
  language: pt
  text: Pois ele endireitou os caminhos dos justos e não os tornará tortos na disciplina.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio da disciplina” ou “na correção”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤρθωσε
  choice: endireitou
  rationale: Expressa a ação de tornar reto ou pôr no rumo certo e preserva a imagem concreta dos caminhos, bem como o aspecto perfectivo do aoristo grego.
- source_word: ὁδοὺς
  choice: caminhos
  rationale: Mantém a metáfora de percurso e também funciona naturalmente em português para indicar a conduta ou o modo de viver.
- source_word: δικαίων
  choice: dos justos
  rationale: Reproduz de modo conciso o genitivo plural substantivado, referindo-se às pessoas justas.
- source_word: διαστρέψει
  choice: os tornará tortos
  rationale: Retoma explicitamente 'os caminhos' e conserva o contraste espacial direto entre endireitar e tornar torto, sem reduzir o verbo a uma afirmação abstrata sobre perversão moral.
- source_word: ἐν παιδείᾳ
  choice: na disciplina
  rationale: Mantém a preposição ἐν e a amplitude de παιδεία, que pode indicar disciplina, correção ou formação, sem decidir se a relação é circunstancial ou instrumental.
theological_decisions:
- issue: Relação entre a disciplina divina e os caminhos dos justos
  choice: O objeto implícito de 'tornará tortos' é entendido como 'os caminhos' mencionados anteriormente; mesmo no contexto da disciplina, ele não os torna tortos.
  alternative: A frase pode significar que ele não desviará os próprios justos por meio da correção, ou que não agirá de modo perverso ao disciplinar.
  rationale: O paralelismo entre ὤρθωσε e διαστρέψει, junto com o antecedente ὁδοὺς, favorece a continuidade da imagem dos caminhos, mas a formulação grega deixa aberta a relação exata de ἐν παιδείᾳ com o verbo.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A expressão 'na disciplina' é deliberadamente formal para preservar a ambiguidade da preposição grega; a nota oferece alternativas naturais sem fixar uma única relação sintática.
