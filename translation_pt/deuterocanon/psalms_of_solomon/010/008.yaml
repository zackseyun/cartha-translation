  text: For God is kind and merciful forever[b][a], and the assemblies of Israel will glorify the name of the Lord.
translation:
  language: pt
  text: Pois Deus é bondoso[a] e misericordioso para sempre, e as assembleias[b] de Israel glorificarão o nome do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «bom».
