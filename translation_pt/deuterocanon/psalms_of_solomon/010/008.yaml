lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão ou explicação do que precede, preservando a força causal em português natural.
- source_word: χρηστός
  choice: bondoso
  rationale: No contexto do caráter divino e em paralelo com «misericordioso», expressa bondade benevolente; «bom» continua sendo uma alternativa legítima.
- source_word: ἐλεήμων
  choice: misericordioso
  rationale: Equivalente direto e consagrado para a disposição de demonstrar misericórdia, formando um par natural com «bondoso».
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: Expressão idiomática portuguesa que comunica duração permanente sem a rigidez de uma reprodução literal.
- source_word: συναγωγαὶ
  choice: assembleias
  rationale: Designa as comunidades reunidas de Israel e evita restringir o termo à instituição posterior da sinagoga.
- source_word: δοξάσουσιν
  choice: glorificarão
  rationale: Preserva tanto o futuro do verbo grego quanto seu forte sentido doxológico.
- source_word: Κυρίου
  choice: do Senhor
  rationale: Traduz κύριος pelo título tradicional «Senhor» e emprega a contração exigida pela expressão portuguesa «o nome do Senhor».
theological_decisions:
- issue: Tradução de κύριος em um texto grego deuterocanônico
  choice: Senhor
  alternative: Soberano
  rationale: «Senhor» preserva o título divino tradicional sem determinar além do que o texto grego explicita.
