base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/004.yaml
  text: And the mercy of the Lord is upon those who love him in truth[b][a], and the Lord will remember his servants with mercy.
translation:
  language: pt
  text: E a misericórdia do Senhor está sobre os que o amam em verdade[a], e o Senhor se lembrará dos seus servos[b] com misericórdia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fielmente” ou “com sinceridade”, em lugar de “em verdade”.
    reason: lexical_alternative
  - marker: b
    text: Ou “escravos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος / ἐλέει
  choice: misericórdia / com misericórdia
  rationale: “Misericórdia” preserva tanto a compaixão quanto a bondade pactual, além de manter a repetição lexical do grego.
- source_word: Κυρίου / Κύριος
  choice: Senhor
  rationale: É a forma consagrada e natural para o título divino κύριος neste contexto litúrgico judaico.
- source_word: ἐπὶ
  choice: está sobre
  rationale: Conserva a imagem grega da misericórdia que está ou repousa sobre pessoas, sem reduzir a expressão a mero benefício abstrato.
- source_word: ἀγαπῶντας
  choice: os que o amam
  rationale: Traduz o particípio substantivado de modo idiomático, preservando seu sentido relacional e contínuo.
- source_word: ἐν ἀληθείᾳ
  choice: em verdade
  rationale: Mantém a forma e a amplitude semântica do grego, que pode abranger verdade, fidelidade e sinceridade sem obrigar uma única interpretação.
- source_word: μνήσεται
  choice: se lembrará
  rationale: Expressa de modo direto o futuro e a ideia bíblica de lembrança ativa e favorável por parte do Senhor.
- source_word: δούλων
  choice: servos
  rationale: “Servos” se ajusta ao contexto devocional e à relação com o Senhor, enquanto a alternativa mais forte, “escravos”, é registrada em nota.
theological_decisions:
- issue: Sentido de ἐν ἀληθείᾳ
  choice: em verdade
  alternative: fielmente; com sinceridade
  rationale: A tradução principal preserva a ambiguidade entre veracidade, fidelidade e sinceridade, sem limitar a expressão a uma só dimensão.
- issue: Tradução de δοῦλος
  choice: servos
  alternative: escravos
  rationale: O foco imediato recai sobre a lembrança misericordiosa do Senhor, não sobre a condição jurídica dos que lhe pertencem; a alternativa mais literal em certos contextos permanece documentada.
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” é o título divino natural neste contexto e não introduz uma nuance ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “está sobre” preserva deliberadamente a imagem do original; a repetição de “misericórdia” reproduz a ligação lexical entre ἔλεος e ἐλέει.
