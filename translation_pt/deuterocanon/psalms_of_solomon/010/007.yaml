  yaml_path: translation/deuterocanon/psalms_of_solomon/010/007.yaml
  text: And the pious will give thanks in the assembly of the people[d][c][b][a], and God will have mercy on the poor in the gladness of Israel.
translation:
  language: pt
  text: E os piedosos[a] darão graças na assembleia do povo, e Deus terá misericórdia dos pobres na alegria de Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os fiéis”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “em meio ao júbilo de Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσιοι
  choice: os piedosos
  rationale: O termo designa pessoas caracterizadas pela devoção e lealdade religiosa; “os piedosos” preserva essa nuance e evita confundi-lo diretamente com ἅγιοι, “os santos”.
- source_word: ἐξομολογήσονται
  choice: darão graças
  rationale: No uso religioso da Septuaginta, o verbo frequentemente expressa ação pública de graças ou louvor; o contexto da assembleia favorece “darão graças”.
- source_word: ἐκκλησίᾳ λαοῦ
  choice: na assembleia do povo
  rationale: Tradução direta e natural para a comunidade reunida, preservando o caráter público e coletivo.
- source_word: πτωχοὺς
  choice: dos pobres
  rationale: “Pobres” conserva diretamente a dimensão social e material do termo grego.
- source_word: ἐλεήσει
  choice: terá misericórdia de
  rationale: Mantém o sentido de ação misericordiosa e seu peso teológico, em formulação corrente em português.
- source_word: ἐν εὐφροσύνῃ Ἰσραήλ
  choice: na alegria de Israel
  rationale: Reprodução próxima da construção grega, preservando tanto a repetição lexical do contexto quanto a possível ambiguidade da relação da expressão com a ação divina.
theological_decisions:
- issue: Identidade dos ὅσιοι
  choice: os piedosos
  alternative: os fiéis; os santos
  rationale: “Piedosos” expressa devoção ou lealdade religiosa sem transformar automaticamente o termo em uma designação técnica de “santos”; “fiéis” continua sendo alternativa legítima.
- issue: Relação de ἐν εὐφροσύνῃ Ἰσραήλ com a oração
  choice: na alegria de Israel
  alternative: em meio ao júbilo de Israel
  rationale: A formulação principal conserva a estrutura e a ambiguidade do grego, sem especificar além do texto se a alegria é a circunstância da misericórdia divina ou uma descrição mais ampla do resultado para Israel.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A ordem foi ajustada ao uso português, sem eliminar a ambiguidade da expressão final.
