  terminology: «Testemunho», «lei da aliança eterna», «Senhor» e «visitação» são escolhas apropriadas e consistentes com o registro bíblico solene. «Visitação» conserva, sem estreitar, os possíveis matizes de inspeção, intervenção ou juízo.
