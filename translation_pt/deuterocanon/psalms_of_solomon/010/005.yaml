base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/005.yaml
  text: For the testimony is in the law of the everlasting covenant[a]; the testimony of the Lord is upon the ways of men in visitation.
translation:
  language: pt
  text: Pois o testemunho está na lei da aliança eterna; o testemunho do Senhor diz respeito aos caminhos das pessoas, na visitação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois o testemunho na lei da aliança eterna é o testemunho do Senhor a respeito dos caminhos das pessoas, quando o Senhor visita.”'
    reason: O grego sem cópula pode ser entendido como um bicolon ou como uma única afirmação identificadora; ἐπισκοπή também pode ser expresso verbalmente como visita divina.
lexical_decisions:
- source_word: μαρτυρία
  choice: testemunho
  rationale: Preserva o sentido jurídico e pactual do substantivo, bem como sua repetição enfática nos dois membros do verso.
- source_word: ἐν νόμῳ διαθήκης αἰωνίου
  choice: na lei da aliança eterna
  rationale: Mantém de perto a estrutura grega e emprega formulação bíblica natural em português.
- source_word: Κυρίου
  choice: Senhor
  rationale: É o título divino convencional e adequado ao contexto da aliança.
- source_word: ἐπὶ ὁδοὺς ἀνθρώπων
  choice: sobre os caminhos das pessoas
  rationale: Conserva a imagem espacial de ἐπί e expressa o sentido humano genérico de ἀνθρώπων sem restringi-lo aos homens do sexo masculino.
- source_word: ἐν ἐπισκοπῇ
  choice: na visitação
  rationale: Mantém a forma nominal e a densidade solene de ἐπισκοπή, que pode envolver visita, inspeção e juízo divinos, sem decidir entre esses matizes.
- source_word: '[cópula implícita]'
  choice: está
  rationale: Supre de modo discreto a cópula ausente nas cláusulas nominais gregas e permite conservar o paralelismo do bicolon.
theological_decisions:
- issue: Relação sintática entre as duas ocorrências de ἡ μαρτυρία
  choice: 'Dois membros paralelos: “o testemunho está...; o testemunho do Senhor está...”'
  alternative: Uma só afirmação em que “o testemunho na lei da aliança eterna” é identificado como “o testemunho do Senhor”
  rationale: A repetição do artigo e do substantivo favorece um bicolon, mas o grego sem cópula também admite a leitura identificadora; a alternativa é registrada em nota para preservar a ambiguidade.
- issue: Sentido de ἐπισκοπή
  choice: visitação
  alternative: inspeção, supervisão ou o momento em que o Senhor visita
  rationale: “Visitação” preserva a amplitude do termo e não determina antecipadamente se a ação divina visa cuidado, exame ou juízo.
translation_notes:
  register: Português moderno, solene e acessível. Conserva-se o paralelismo e a repetição de “testemunho”; “visitação” é deliberadamente formal para reter a amplitude teológica do substantivo grego.
