base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/010/006.yaml
  text: Righteous and holy is our Lord in his judgments forever[a], and Israel will praise the name of the Lord with gladness.
translation:
  language: pt
  text: Justo e santo é o nosso Senhor em seus juízos para sempre[a], e Israel louvará o nome do Senhor com alegria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O nosso Senhor é justo e santo em seus juízos para sempre”.'
    reason: Registra a ordem sintática alternativa, mais comum em português, sem alterar o sentido básico.
lexical_decisions:
- source_word: δίκαιος
  choice: justo
  rationale: Como predicativo do Senhor, expressa retidão moral e também se harmoniza com o contexto de seus juízos; “justo” é natural e teologicamente amplo em português.
- source_word: ὅσιος
  choice: santo
  rationale: Quando atribuído a Deus, “santo” comunica de modo claro e digno seu caráter sagrado, sem reduzir o termo a piedade humana.
- source_word: Κύριος ἡμῶν
  choice: nosso Senhor
  rationale: Mantém o título divino e a relação expressa pelo pronome possessivo.
- source_word: κρίμασιν αὐτοῦ
  choice: em seus juízos
  rationale: Preserva o plural e a ideia de decisões ou atos judiciais do Senhor, com formulação corrente no registro bíblico português.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: É a expressão portuguesa mais natural para o valor duradouro ou perpétuo do idioma grego.
- source_word: αἰνέσει
  choice: louvará
  rationale: Reproduz diretamente o futuro verbal e a ação de louvor.
- source_word: τῷ ὀνόματι Κυρίου
  choice: o nome do Senhor
  rationale: Conserva a referência explícita ao nome, com seu peso reverencial, em vez de substituí-la por uma paráfrase.
- source_word: ἐν εὐφροσύνῃ
  choice: com alegria
  rationale: Expressa de forma idiomática a maneira jubilosa pela qual Israel louvará.
theological_decisions:
- issue: Como representar os dois atributos divinos δίκαιος e ὅσιος
  choice: justo e santo
  alternative: reto e fiel
  rationale: “Justo e santo” mantém distintas a dimensão moral-judicial e a dimensão sacra, sem reinterpretar ὅσιος como fidelidade.
- issue: Ordem dos predicativos e do sujeito
  choice: Justo e santo é o nosso Senhor
  alternative: O nosso Senhor é justo e santo
  rationale: A anteposição preserva a ênfase poética do grego sobre os atributos, embora a ordem alternativa também seja gramaticalmente possível e mais comum na prosa portuguesa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com leve elevação poética. A ordem marcada “Justo e santo é” acompanha a ênfase do original grego; “juízos” preserva o vocabulário judicial e bíblico sem paráfrase denominacional.
