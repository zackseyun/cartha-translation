    text: Ou “correção” ou “instrução corretiva”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἑτοιμάζων
  choice: Quem prepara
  rationale: O particípio presente substantivado tem sentido genérico. “Quem prepara” expressa com naturalidade a disposição característica da pessoa para receber correção.
- source_word: νῶτον
  choice: as costas
  rationale: O substantivo designa as costas. Em português, a construção “preparar as costas” dispensa possessivo e mantém o sentido genérico.
- source_word: εἰς μάστιγας
  choice: para os açoites
  rationale: A expressão indica prontidão para receber golpes disciplinares. “Açoites” preserva a imagem forte e a ligação lexical com μάστιξ no versículo anterior, sem especificar indevidamente o instrumento.
- source_word: καθαρισθήσεται
  choice: será purificado
  rationale: O futuro passivo aponta para uma purificação resultante. “Será purificado” conserva a amplitude moral, corretiva ou possivelmente ritual do verbo.
- source_word: χρηστὸς
  choice: bom
  rationale: O adjetivo pode significar “bom” ou “bondoso”. “Bom” é direto e adequado à declaração sapiencial sobre o caráter do Senhor.
- source_word: κύριος
  choice: Senhor
  rationale: “Senhor” é o equivalente convencional e contextualmente apropriado de κύριος.
- source_word: τοῖς ὑπομένουσιν
  choice: para os que suportam
  rationale: O particípio comunica perseverança debaixo de dificuldade ou correção. “Suportam” conserva essa ideia sem acrescentar uma interpretação específica.
- source_word: παιδείαν
  choice: disciplina
  rationale: Neste contexto, o termo indica formação corretiva, não mera instrução. “Disciplina” abrange tanto o processo educativo quanto a correção.
theological_decisions:
- issue: Sentido da purificação decorrente do castigo aceito
  choice: A tradução apresenta a purificação como resultado de se aceitar e suportar a disciplina.
  alternative: A imagem pode ser entendida mais especificamente como purificação ritual ou, mais amplamente, como vindicação mediante o sofrimento.
  rationale: καθαρισθήσεται denota naturalmente purificação, enquanto παιδεία aponta para correção formativa. A formulação mantém aberta a natureza exata dessa purificação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação concisa preserva o paralelismo sapiencial, a imagem corporal dos açoites e a ambiguidade entre purificação moral, corretiva e ritual.
