  text: The one who prepares his back for scourges will be cleansed[d][c][b][a], for the Lord is good to those who endure discipline.
translation:
  language: pt
  text: Quem prepara as próprias costas para os açoites[a] será purificado[b], pois o Senhor é bom para os que suportam a disciplina[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “chicotadas”.
    reason: lexical_alternative
  - marker: b
