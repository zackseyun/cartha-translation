translation:
  language: pt
  text: A salvação do Senhor está sobre a casa de Israel, para um autodomínio eterno[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A salvação do Senhor esteja sobre a casa de Israel”, entendendo a oração sem verbo como uma bênção ou um desejo.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: “moderação”, “sensatez” ou “sobriedade”.'
    reason: lexical_alternative
  - marker: c
    text: Algumas edições gregas trazem “alegria eterna” (εὐφροσύνην) em vez de “autodomínio eterno” (σωφροσύνην).
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: O genitivo é entendido naturalmente como possessivo. “Do Senhor” é a formulação portuguesa corrente e preserva o título κύριος sem acrescentar especificação não presente no grego.
- source_word: ἡ σωτηρία
  choice: a salvação
  rationale: σωτηρία pode indicar livramento ou resgate, mas “salvação” conserva sua amplitude religiosa e se ajusta ao registro dos salmos.
- source_word: ἐπὶ οἶκον Ἰσραήλ
  choice: está sobre a casa de Israel
  rationale: Como a oração grega não tem verbo expresso, “está” é suprido de modo mínimo. “Sobre” mantém a construção com ἐπί, e “casa de Israel” preserva οἶκον em vez de simplificá-lo para “Israel”.
- source_word: εἰς
  choice: para
  rationale: A preposição pode indicar finalidade ou resultado. “Para” preserva essa abertura sem impor uma relação causal mais específica.
- source_word: σωφροσύνην
  choice: autodomínio
  rationale: A palavra pode abranger autodomínio, moderação, sobriedade e sensatez. “Autodomínio” comunica com clareza sua força ética sem restringi-la ao consumo de álcool, como “sobriedade” poderia sugerir no uso moderno.
- source_word: αἰώνιον
  choice: eterno
  rationale: O adjetivo qualifica σωφροσύνην e indica duração permanente. “Eterno” é natural, digno e próximo da força de αἰώνιος.
theological_decisions:
- issue: Valor da oração nominal ἡ σωτηρία ἐπὶ οἶκον Ἰσραήλ
  choice: 'declaração: “está sobre”'
  alternative: 'bênção ou desejo: “esteja sobre”'
  rationale: Sem verbo expresso, o grego admite tanto uma declaração quanto uma formulação de bênção. O texto principal adota a leitura declarativa mais direta, enquanto a nota preserva a alternativa.
- issue: Leitura de σωφροσύνην no texto grego fornecido
  choice: autodomínio
  alternative: alegria, caso se adote a variante εὐφροσύνην
  rationale: A tradução principal segue exatamente a forma σωφροσύνην apresentada como fonte validada. A possível leitura εὐφροσύνην é registrada em nota, sem substituir silenciosamente o texto-base.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A ordem da frase permanece próxima do grego. “Está sobre” conserva a imagem original, embora seja menos coloquial; “autodomínio” evita tanto o tecnicismo quanto associações confessionais específicas.
