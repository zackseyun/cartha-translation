revisions:
- from: Feliz o homem de quem o Senhor se lembrou ao repreendê-lo[a] e que, pelo açoite[b], foi impedido de seguir um caminho mau[c], para ser purificado do pecado, a fim de que este não aumentasse[d].
  to: Bem-aventurado o homem de quem o Senhor se lembrou com repreensão[a] e que, por um açoite[b], foi impedido de seguir um caminho mau[c], para ser purificado do pecado, a fim de que este não aumentasse[d].
  rationale: A revisão preserva todos os sentidos centrais e a ambiguidade final, mas substitui a paráfrase mais interpretativa de ἐν ἐλεγμῷ por «com repreensão», que é mais fiel à construção grega. Também adota «Bem-aventurado» pelo registro de Μακάριος e corrige a formulação da nota sobre ἐκυκλώθη ἀπό para que sua alegação de literalidade seja precisa.
  reviewer_model: gpt-5.6-terra
