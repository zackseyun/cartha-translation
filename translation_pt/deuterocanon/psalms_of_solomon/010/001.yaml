  yaml_path: translation/deuterocanon/psalms_of_solomon/010/001.yaml
  text: Blessed is the man whom the Lord remembered with rebuke[a], and who was turned away from an evil way by a scourge, to be cleansed from sin[e][d][c][b], so that it might not increase.
translation:
  language: pt
  text: Bem-aventurado o homem de quem o Senhor se lembrou com repreensão[a] e que, por um açoite[b], foi impedido de seguir um caminho mau[c], para ser purificado do pecado, a fim de que este não aumentasse[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com correção”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “por uma chibata”.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “foi cercado/rodeado, afastado de um caminho mau”; a imagem é a de alguém contido ou impedido de seguir esse caminho.
    reason: lexical_alternative
  - marker: d
    text: A cláusula final também pode ser entendida como “para não aumentar o pecado” ou “para que ele não o multiplicasse”.
    reason: alternative_reading
lexical_decisions:
- source_word: Μακάριος
  choice: Feliz
  rationale: Emprega a forma corrente das bem-aventuranças em português moderno, indicando uma condição favorecida, e não apenas uma emoção passageira.
- source_word: ἀνὴρ
  choice: homem
  rationale: Preserva o masculino singular explícito do grego.
- source_word: ἐμνήσθη
  choice: se lembrou
  rationale: Mantém o sentido básico do verbo e, no contexto, expressa a atenção ativa do Senhor ao disciplinar o homem.
- source_word: ἐν ἐλεγμῷ
  choice: ao repreendê-lo
  rationale: Expressa em português natural a circunstância ou o meio da lembrança disciplinadora, sem reduzir ἔλεγμος a mera instrução.
- source_word: ἐκυκλώθη ἀπὸ ὁδοῦ πονηρᾶς
  choice: foi impedido de seguir um caminho mau
  rationale: Comunica o sentido contextual de ter sido cercado ou contido para não prosseguir no mau caminho; a imagem literal é preservada em nota.
- source_word: ἐν μάστιγι
  choice: pelo açoite
  rationale: Conserva a imagem concreta de castigo físico e permite coerência lexical com ocorrências adjacentes de μάστιξ.
- source_word: καθαρισθῆναι ἀπὸ ἁμαρτίας
  choice: para ser purificado do pecado
  rationale: Preserva o infinitivo passivo e o sentido moral de purificação, mantendo o singular coletivo de ἁμαρτία.
- source_word: τοῦ μὴ πληθῦναι
  choice: a fim de que este não aumentasse
  rationale: Toma 'pecado' como referente implícito e verte naturalmente a cláusula final comprimida, sem ocultar em nota a possibilidade de entender o homem como sujeito.
theological_decisions:
- issue: Agente ou sujeito implícito na cláusula final τοῦ μὴ πληθῦναι
  choice: O pecado é apresentado como aquilo que não deveria aumentar.
  alternative: O homem não deveria multiplicar o pecado.
  rationale: A construção grega é elíptica e admite ambas as relações. O texto principal segue a ligação mais imediata com ἁμαρτίας, enquanto a nota conserva a alternativa sem decidir uma questão teológica além da gramática.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. A formulação evita arcaísmos, mantém a linguagem de disciplina do original e registra em notas as imagens e ambiguidades que uma tradução corrente não consegue reproduzir integralmente.
