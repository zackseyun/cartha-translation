  text: and no nation will prevail against us, because you are our defender.
translation:
  language: pt
  text: E nenhuma nação prevalecerá contra nós, porque tu és o nosso defensor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἰσχύσει
  choice: não prevalecerá
  rationale: Com πρός e o acusativo, ἰσχύω expressa aqui força eficaz contra alguém; «prevalecer» comunica naturalmente que nenhuma nação conseguirá vencer ou dominar.
- source_word: πρὸς ἡμᾶς
  choice: contra nós
  rationale: Neste contexto de força e oposição, πρός com o acusativo tem sentido adversativo, expresso com clareza por «contra nós».
- source_word: ἔθνος
  choice: nação
  rationale: Mantém o singular coletivo do grego sem acrescentar a interpretação mais específica de «nação gentia».
- source_word: ὑπερασπιστής
  choice: defensor
  rationale: O substantivo designa quem se põe em defesa de outro; «defensor» preserva de modo conciso o sentido protetor e a força titular da expressão.
theological_decisions:
- issue: Formulação da proteção divina
  choice: porque tu és o nosso defensor
  alternative: porque tu és quem nos defende
  rationale: A tradução conserva o substantivo predicativo e quase titular do grego, sem transformar desnecessariamente a afirmação em uma oração verbal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O uso de «tu» preserva o tratamento direto singular dirigido a Deus; a construção permanece compacta e confessional como no grego.
