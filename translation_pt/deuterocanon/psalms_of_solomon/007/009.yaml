lexical_decisions:
- source_word: κατευθυνεῖς
  choice: Tu nos guiarás
  rationale: O futuro e o sentido de conduzir ou dirigir o caminho são preservados; “guiarás” é natural e relacional em português.
- source_word: ἐν καιρῷ ἀντιλήψεως σου
  choice: no tempo do teu auxílio
  rationale: Mantém a expressão temporal e traduz ἀντίληψις de modo amplo, sem restringi-la a “livramento”.
- source_word: τοῦ ἐλεῆσαι
  choice: para ter misericórdia
  rationale: O infinitivo articular expressa propósito; a formulação conserva o teor bíblico e a ação compassiva.
- source_word: τὸν οἶκον Ἰακώβ
  choice: da casa de Jacó
  rationale: Preserva a designação coletiva e pactual do grego, sem substituí-la interpretativamente por “Israel”.
- source_word: εἰς ἡμέραν ἐν ᾗ
  choice: tendo em vista o dia que
  rationale: Expressa a orientação para um dia futuro de modo inteligível, ao mesmo tempo que evita reduzir εἰς a um simples “no dia”.
- source_word: ἐπηγγείλω αὐτοῖς
  choice: lhes prometeste
  rationale: Embora a forma transmitida seja difícil, o contexto de fala dirigida a Deus favorece a segunda pessoa; a dificuldade é registrada em nota.
theological_decisions:
- issue: Identidade da “casa de Jacó”
  choice: Manter “casa de Jacó”
  alternative: Israel; povo de Israel
  rationale: A expressão grega deve conservar sua textura pactual e literária, sem expansão interpretativa.
- issue: Pessoa gramatical do verbo final textualmente difícil
  choice: “lhes prometeste”, entendendo a referência como promessa de Deus
  alternative: “lhes prometi”
  rationale: A oração se dirige a Deus, e a segunda pessoa produz o sentido contextual mais coerente; a alternativa formal é preservada em nota.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O pronome “tu” preserva o singular da invocação divina e mantém concordância natural. A construção “tendo em vista o dia” conserva a orientação prospectiva de εἰς sem produzir uma frase artificial.
