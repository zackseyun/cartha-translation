  yaml_path: translation/deuterocanon/psalms_of_solomon/007/008.yaml
  text: For you will have compassion on the people of Israel forever, and you will not cast them off; and we will be under your yoke forever, and under the whip of your discipline.
translation:
  language: pt
  text: Pois tu terás compaixão do povo de Israel para sempre e não o rejeitarás; e nós estaremos sob o teu jugo para sempre e sob o açoite da tua disciplina.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκτειρήσεις
  choice: terás compaixão
  rationale: Expressa de modo natural o futuro do verbo grego, que indica compaixão ou misericórdia.
- source_word: τὸ γένος Ἰσραήλ
  choice: o povo de Israel
  rationale: Neste contexto, γένος designa a coletividade ou linhagem de Israel; “povo” é claro e idiomático sem estreitar indevidamente o sentido.
- source_word: οὐκ ἀπώσεις
  choice: não o rejeitarás
  rationale: Preserva a ideia de afastar ou repudiar, com o pronome retomando naturalmente “o povo de Israel”.
- source_word: ὑπὸ ζυγόν σου
  choice: sob o teu jugo
  rationale: Mantém literalmente a metáfora de submissão à autoridade divina.
- source_word: μάστιγα παιδίας σου
  choice: sob o açoite da tua disciplina
  rationale: μάστιξ é um açoite ou instrumento de correção, e παιδεία aqui comunica disciplina formativa ou corretiva.
theological_decisions:
- issue: Permanência de Israel sob o cuidado e a autoridade de Deus
  choice: Preservar “para sempre” nas duas ocorrências
  alternative: Abrandar como “continuamente” ou omitir a segunda ocorrência
  rationale: O grego repete εἰς τὸν αἰῶνα e τὸν αἰῶνα, vinculando tanto a compaixão divina quanto a submissão do povo a uma duração indefinida ou perpétua.
- issue: Relação entre compaixão e disciplina divina
  choice: Manter juntas as imagens do jugo e do açoite disciplinar
  alternative: Suavizar “açoite” para “vara” ou “correção”
  rationale: O texto sustenta a tensão entre misericórdia, autoridade e correção; não convém eliminar a força de μάστιξ.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A estrutura coordenada e as metáforas fortes do grego foram preservadas sem explicações confessionais.
