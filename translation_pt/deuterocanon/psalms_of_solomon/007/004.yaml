  text: For if you send death[a], you will command it concerning us; for you are merciful[c][b], and you will not be angry so as to bring us to an end.
translation:
  language: pt
  text: Pois, se enviares a morte[a], tu lhe darás ordens a nosso respeito; porque és misericordioso e não te irarás a ponto de acabar conosco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A morte é apresentada como um agente que recebe ordens de Deus.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποστείλῃς
  choice: enviares
  rationale: Mantém o sentido direto de enviar e, com ἐάν, expressa uma condição eventual de modo natural em português.
- source_word: θάνατον
  choice: a morte
  rationale: É o equivalente lexical direto. Embora o contexto possa evocar uma peste como juízo divino, o grego diz literalmente ‘morte’, sem especificar a causa.
- source_word: ἐντελῇ αὐτῷ
  choice: lhe darás ordens
  rationale: Expressa com clareza a autoridade de Deus sobre a morte. O pronome português concorda naturalmente com ‘morte’, substantivo feminino.
- source_word: περὶ ἡμῶν
  choice: a nosso respeito
  rationale: Preserva a ideia de que as ordens dadas à morte dizem respeito ao povo que ora.
- source_word: ἐλεήμων
  choice: misericordioso
  rationale: Equivalente bíblico corrente e direto para a disposição compassiva atribuída a Deus.
- source_word: οὐκ ὀργισθήσῃ τοῦ συντελέσαι ἡμᾶς
  choice: não te irarás a ponto de acabar conosco
  rationale: Reproduz em português natural a relação entre a ira e seu possível resultado, sem afirmar que Deus jamais se ira. ‘Acabar conosco’ comunica a ideia de levar à destruição completa.
theological_decisions:
- issue: Alcance da negação da ira divina
  choice: não te irarás a ponto de acabar conosco
  alternative: não te irarás
  rationale: 'A formulação mantém a tensão do grego: a negação está ligada à consumação destrutiva, não necessariamente a toda e qualquer ira divina.'
- issue: Identificação de θάνατος com peste
  choice: morte no texto principal
  alternative: peste
  rationale: O possível pano de fundo de uma peste judicial não justifica substituir o sentido lexical explícito por uma identificação contextual mais restrita.
translation_notes:
  register: Português moderno, claro e reverente, com formas verbais na segunda pessoa do singular para conservar o discurso direto a Deus. A expressão ‘acabar conosco’ é corrente sem ser coloquial demais e transmite a ideia de destruição total.
