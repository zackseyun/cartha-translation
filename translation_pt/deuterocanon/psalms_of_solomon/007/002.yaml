  text: For you have rejected them[a], O God[c][b]; let not their foot trample the inheritance of your sanctuary.
translation:
  language: pt
  text: Pois tu os rejeitaste[a], ó Deus; que os pés deles não pisoteiem a herança do teu santuário[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “tu os repeliste” ou “tu os afastaste”.'
