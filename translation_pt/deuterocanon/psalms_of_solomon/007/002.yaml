lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão ou fundamento do pedido e preserva a ligação argumentativa do grego.
- source_word: ἀπώσω
  choice: tu os rejeitaste
  rationale: A forma é mais bem entendida, no grego helenístico, como aoristo médio indicativo na segunda pessoa do singular. “Rejeitaste” preserva o valor retrospectivo sem convertê-lo em ordem; a nota registra a possível nuance mais ativa de repelir ou afastar.
- source_word: πατήσαι
  choice: pisoteiem
  rationale: No pedido negativo, o verbo comunica violação hostil, não um simples ato de pisar. “Pisoteiem” conserva essa força e combina naturalmente com o sujeito coletivo em português.
- source_word: ὁ ποὺς αὐτῶν
  choice: os pés deles
  rationale: Embora o grego empregue “pé” no singular coletivo, o plural é a forma idiomática em português e mantém o mesmo sentido coletivo.
- source_word: κληρονομίαν
  choice: herança
  rationale: Mantém as associações pactuais e sagradas do termo, mais claramente do que “posse”.
- source_word: ἁγιάσματός σου
  choice: do teu santuário
  rationale: O contexto de profanação favorece o sentido cultual de lugar sagrado. A construção genitiva é preservada, sem excluir a leitura atributiva registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa coerentes com a invocação direta a Deus. O pedido com “que ... não” reproduz naturalmente o optativo de desejo, e “os pés deles” evita a rigidez do singular coletivo grego.
