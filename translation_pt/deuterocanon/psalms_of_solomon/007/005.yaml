lexical_decisions:
- source_word: ἐν τῷ κατασκηνοῦν
  choice: Quando ... habitar
  rationale: O infinitivo articular com ἐν tem valor temporal, aqui expresso naturalmente por “quando”. O futuro “habitar” se ajusta à oração principal no futuro sem eliminar a imagem de permanência.
- source_word: κατασκηνοῦν
  choice: habitar
  rationale: O verbo pode evocar armar uma tenda ou estabelecer morada. “Habitar” é claro, digno e natural em português; a imagem mais concreta é preservada na nota.
- source_word: τὸ ὄνομά σου
  choice: o teu nome
  rationale: Mantém a formulação grega e sua amplitude bíblica, na qual o nome pode representar a presença manifesta, a reputação ou a autoridade divina, sem reduzir a metáfora a apenas um desses sentidos.
- source_word: ἐν μέσῳ ἡμῶν
  choice: no meio de nós
  rationale: Equivalente corrente e solene que conserva o caráter comunitário da presença divina.
- source_word: ἐλεηθησόμεθα
  choice: receberemos misericórdia
  rationale: Expressa de modo idiomático o futuro passivo grego. Evita o sentido meramente emocional de “seremos objeto de pena” e mantém a misericórdia como algo concedido.
