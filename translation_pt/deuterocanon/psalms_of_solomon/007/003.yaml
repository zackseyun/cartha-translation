  yaml_path: translation/deuterocanon/psalms_of_solomon/007/003.yaml
  text: Discipline us according to your will[c][b][a], and do not give us over to the nations.
translation:
  language: pt
  text: Tu, disciplina-nos[a] segundo a tua vontade e não nos entregues às nações.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «corrige-nos» ou «instrui-nos». O verbo grego abrange tanto a correção como a formação.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: «não dês às nações»; «nos» está subentendido pelo contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: Tu
  rationale: Mantém o pronome enfático do grego e realça o contraste implícito entre ser disciplinado por Deus e ser entregue às nações.
- source_word: ἐν θελήματί σου
  choice: segundo a tua vontade
  rationale: Expressa de modo natural a ideia de conformidade com a vontade divina, sem excluir a formulação mais literal «em tua vontade».
- source_word: παιδεύσον
  choice: disciplina-nos
  rationale: O verbo pode abranger correção, formação e instrução; «disciplina-nos» preserva melhor essa amplitude em português atual.
- source_word: μὴ δῷς
  choice: não nos entregues
  rationale: Embora δῷς signifique literalmente «dês», o contexto indica entrega ao poder de terceiros. O objeto «nos» está subentendido no grego e é recuperado naturalmente em português.
- source_word: ἔθνεσιν
  choice: às nações
  rationale: Designa aqui povos estrangeiros; «nações» evita restringir indevidamente o sentido a uma categoria religiosa.
theological_decisions:
- issue: Contraste entre a disciplina divina e a sujeição a povos estrangeiros
  choice: Preservar o pronome «Tu» e traduzir δῷς por «entregues»
  alternative: Omitir «Tu» e traduzir literalmente «não nos dês às nações»
  rationale: A redação conserva o contraste expresso pelo σὺ enfático sem explicitar uma doutrina não declarada no texto.
translation_notes:
  register: Português moderno, digno e acessível, com formas de segunda pessoa coerentes («Tu», «tua», «disciplina-nos», «entregues»). A colocação inicial de «Tu» preserva a ênfase do grego sem recorrer ao pouco natural «tu mesmo».
