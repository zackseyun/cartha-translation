lexical_decisions:
- source_word: ἐπικαλεσόμεθαί σε
  choice: te invocaremos
  rationale: Em contexto de oração, ἐπικαλέω expressa dirigir-se a Deus em invocação. “Invocaremos” é natural, digno e preserva o sentido religioso sem acrescentar a ideia explícita de pedido ou apelo.
- source_word: ἐπακούσει ἡμῶν
  choice: nos ouvirás
  rationale: ἐπακούω pode indicar ouvir, escutar com atenção ou atender. “Nos ouvirás” conserva o núcleo lexical e a abertura semântica do grego, sem avançar para o mais interpretativo “nos responderás”.
