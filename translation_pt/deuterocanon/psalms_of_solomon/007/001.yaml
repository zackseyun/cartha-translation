  yaml_path: translation/deuterocanon/psalms_of_solomon/007/001.yaml
  text: Do not depart from us[a], O God[c][b], lest those who hate us without cause attack us.
translation:
  language: pt
  text: Não te afastes de nós[a], ó Deus, para que não nos ataquem os que nos odeiam sem motivo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego está ligado literalmente ao ato de levantar acampamento ou desmontar a tenda e partir; aqui retrata de modo vívido a retirada da presença de Deus.
    reason: cultural_note
  - marker: b
    text: 'Ou: “para que os que nos odeiam não nos ataquem sem motivo”. O advérbio grego pode modificar tanto o ódio quanto o ataque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσκηνώσῃς
  choice: te afastes
  rationale: O verbo pode descrever literalmente o ato de levantar acampamento, mas aqui expressa a retirada da presença de Deus. “Te afastes” é natural em português e mantém a força relacional; a imagem concreta do acampamento é registrada em nota.
- source_word: ἀφʼ ἡμῶν
  choice: de nós
  rationale: A preposição indica separação da comunidade; “de nós” reproduz isso de modo direto e idiomático.
- source_word: ἵνα μὴ
  choice: para que não
  rationale: A construção introduz o resultado negativo que a oração procura evitar. “Para que não” é claro e natural no português atual, sem exigir o mais literário “para que não venham a”.
- source_word: ἐπιθῶνται ἡμῖν
  choice: nos ataquem
  rationale: O verbo, com o dativo, pode significar lançar-se contra alguém. “Nos ataquem” comunica diretamente o sentido hostil.
- source_word: οἱ μισοῦντα ἡμᾶς
  choice: os que nos odeiam
  rationale: A expressão participial substantivada é vertida naturalmente por uma oração relativa, preservando os participantes e a ação.
- source_word: δωρεάν
  choice: sem motivo
  rationale: O advérbio pode indicar ação gratuita, sem razão ou sem proveito. Neste contexto, “sem motivo” expressa a hostilidade injustificada, enquanto uma nota preserva a possível ligação sintática com o ataque.
theological_decisions:
- issue: Imagem da presença divina em ἀποσκηνώσῃς
  choice: Traduzir no texto como “te afastes” e explicar em nota a imagem de levantar acampamento
  alternative: “Não levantes acampamento de junto de nós” ou “não retires de nós a tua morada”
  rationale: A primeira alternativa seria pouco natural para muitos leitores, e a segunda introduziria um objeto possessivo que não aparece explicitamente no grego. A solução escolhida comunica a súplica pela permanência da presença divina sem transformar a metáfora em formulação doutrinária explícita.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com sintaxe natural para leitores brasileiros e internacionais. A colocação “ó Deus” preserva o tom direto de oração. A ambiguidade de δωρεάν e a imagem concreta de ἀποσκηνώσῃς são mantidas por notas, sem sobrecarregar o texto principal.
