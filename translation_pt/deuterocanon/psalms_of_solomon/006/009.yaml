lexical_decisions:
- source_word: εὐλογητὸς
  choice: Bendito seja
  rationale: Reproduz de modo natural em português a fórmula doxológica expressa pelo adjetivo predicativo grego.
- source_word: Κύριος
  choice: Senhor
  rationale: É a tradução corrente do título divino κύριος e se ajusta ao contexto de louvor.
- source_word: ὁ ποιῶν
  choice: que mostra
  rationale: Na combinação ποιεῖν ἔλεος, «mostrar misericórdia» comunica naturalmente a expressão idiomática grega.
- source_word: ἔλεος
  choice: misericórdia
  rationale: É a equivalência mais transparente, preservando as ideias de compaixão e favor.
- source_word: τοῖς ἀγαπῶσιν αὐτὸν
  choice: aos que o amam
  rationale: Converte naturalmente o particípio substantivado grego em oração relativa sem alterar o sentido.
- source_word: ἐν ἀληθείᾳ
  choice: em verdade
  rationale: Mantém a forma e a ambiguidade da expressão grega, que pode indicar verdade, sinceridade ou fidelidade.
