lexical_decisions:
- source_word: ἐν τῷ μνημονεύειν
  choice: Quando ... se lembrar
  rationale: A construção ἐν τῷ com infinitivo tem sentido temporal natural neste contexto. Em português, «quando ... se lembrar» expressa isso com clareza e dignidade.
- source_word: αὐτὸν
  choice: ele
  rationale: O pronome é entendido como sujeito acusativo do infinitivo articular, e não como objeto direto; portanto, o sentido é «quando ele se lembrar», não «quando se lembrarem dele».
- source_word: τὸ ὄνομα Κυρίου
  choice: do nome do Senhor
  rationale: Preserva de perto a expressão grega e seu peso bíblico-teológico. «Senhor» é a tradução natural de Κυρίου.
- source_word: σωθήσεται
  choice: será salvo
  rationale: O futuro passivo de σῴζω pode indicar salvação ou livramento. «Será salvo» conserva o sentido amplo e a ressonância teológica, enquanto a alternativa contextual é registrada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com boa legibilidade brasileira. A colocação pronominal «se lembrar» é natural no registro contemporâneo.
