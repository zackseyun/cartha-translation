lexical_decisions:
- source_word: αἱ ὁδοὶ αὐτοῦ
  choice: Seus caminhos
  rationale: Preserva a imagem concreta e o possível sentido figurado de rumo de vida ou conduta, sem especificá-lo além do grego.
- source_word: κατευθύνονται
  choice: são dirigidos
  rationale: Mantém a voz passiva e a ação divina explícita; também comporta a ideia de serem encaminhados corretamente.
- source_word: πεφυλαγμένα
  choice: são guardadas
  rationale: 'Expressa o estado resultante do particípio perfeito: as obras permanecem sob guarda ou proteção.'
- source_word: ἔργα χειρῶν αὐτοῦ
  choice: as obras de suas mãos
  rationale: Conserva a formulação e a imagem corporal transparentes do original.
- source_word: Κυρίου
  choice: Senhor
  rationale: É a correspondência tradicional, digna e amplamente compreensível para κύριος neste contexto divino.
theological_decisions:
- issue: A ação divina expressa pelas formas passivas
  choice: Os caminhos são dirigidos e as obras são guardadas pelo próprio Senhor.
  alternative: Atenuar a afirmação para uma ideia geral de êxito ou bênção diante do Senhor.
  rationale: As duas construções com ὑπό identificam explicitamente o Senhor como agente; a tradução preserva essa forte afirmação providencial.
translation_notes:
