- from: E o Senhor ouve[b] a oração de todo aquele que está no temor de Deus; e o Senhor atende a todo pedido de uma alma[a] que espera nele.
  to: E o Senhor ouve[b] a oração de todo aquele que vive no temor de Deus; e o Senhor atende a todo pedido de toda alma[a] que espera nele.
