  text: And the Lord hears the prayer of everyone in the fear of God[b][a], and the Lord fulfills every request of a soul that hopes in him.
translation:
  language: pt
  text: E o Senhor ouve[b] a oração de todo aquele que vive no temor de Deus; e o Senhor atende a todo pedido de toda alma[a] que espera nele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou «de uma pessoa que espera nele». Grego: «de uma alma».'
    reason: lexical_alternative
  - marker: b
    text: Ou «ouviu a oração de todo aquele que teme a Deus».
    reason: previous_rendering
lexical_decisions:
- source_word: Κύριος / ὁ κύριος
  choice: Senhor
  rationale: Mantém o título divino tradicional e repete «o Senhor» nas duas orações, preservando a ênfase e o paralelismo do grego.
- source_word: εἰσήκουσεν
  choice: ouve
  rationale: O aoristo é entendido como gnômico em paralelo com o presente ἐπιτελεῖ, exprimindo uma verdade geral; a nota registra a leitura temporal mais direta.
- source_word: παντὸς ἐν φόβῳ θεοῦ
  choice: de todo aquele que está no temor de Deus
  rationale: Preserva a construção «no temor de Deus» e seu registro sapiencial, sem reduzi-la inteiramente à paráfrase «que teme a Deus».
- source_word: αἴτημα
  choice: pedido
  rationale: Termo corrente e claro em português, adequado ao contexto de oração.
- source_word: ψυχῆς
  choice: alma
  rationale: Conserva a imagem antropológica e devocional explícita do grego; «pessoa» é uma possibilidade contextual indicada em nota.
- source_word: ἐλπιζούσης πρὸς αὐτόν
  choice: que espera nele
  rationale: Expressão natural em português que mantém a esperança dirigida e depositada no Senhor.
- source_word: ἐπιτελεῖ
  choice: atende a
  rationale: Em associação com «pedido», comunica de modo idiomático a ação eficaz do Senhor; alternativas mais formais, como «leva a cumprimento», seriam menos naturais.
theological_decisions:
- issue: Valor temporal de εἰσήκουσεν
  choice: 'Presente gnômico: «ouve»'
  alternative: 'Aoristo pontual: «ouviu»'
  rationale: O paralelismo com o presente ἐπιτελεῖ favorece uma afirmação geral, mas a forma aorista permite que a tradução mais estritamente temporal seja reconhecida em nota.
- issue: Sentido de ψυχή
  choice: «alma» no texto
  alternative: «pessoa»
  rationale: «Alma» preserva a formulação do original sem definir de modo sectário uma antropologia específica; «pessoa» explicita o possível uso metonímico.
translation_notes:
  register: Português moderno, digno e legível, com leve elevação sapiencial. A expressão «está no temor de Deus» conserva deliberadamente o idioma do original, enquanto «atende a todo pedido» evita uma formulação artificial em português.
