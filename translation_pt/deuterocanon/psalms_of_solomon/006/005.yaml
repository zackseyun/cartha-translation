lexical_decisions:
- source_word: ψυχή
  choice: alma
  rationale: “Alma” preserva o sentido de vida interior ou do próprio ser, bem como o registro poético elevado, sem excluir as nuances de “vida” e “pessoa”.
- source_word: διάβασις
  choice: travessia
  rationale: O substantivo indica o ato ou lugar de atravessar; “travessia” é claro e natural no contexto do perigo representado pelos rios.
- source_word: σάλος
  choice: agitação
  rationale: O termo descreve movimento revolto ou oscilante. “Agitação” comunica de modo natural o movimento ameaçador dos mares e preserva a amplitude da imagem.
- source_word: πτοηθήσεται
  choice: não ficará aterrorizada
  rationale: A forma futura passiva indica ser tomado por forte medo ou terror. “Não ficará aterrorizada” preserva tanto a intensidade do verbo quanto sua forma passiva.
