lexical_decisions:
- source_word: Μακάριος
  choice: Feliz
  rationale: Introduz naturalmente uma bem-aventurança em português atual, preservando o tom sapiencial sem limitar o sentido a uma emoção passageira.
- source_word: ἀνὴρ
  choice: homem
  rationale: Reproduz a forma masculina singular do grego e o tom tradicional da máxima sapiencial; neste contexto, é empregado em sentido representativo.
- source_word: καρδία
  choice: coração
  rationale: Mantém o idioma bíblico para a disposição interior, sem reduzi-lo apenas à mente ou aos sentimentos.
- source_word: ἑτοίμη
  choice: pronto
  rationale: Expressa preparação ou prontidão e preserva tanto a disposição interior quanto a capacidade de agir.
- source_word: ἐπικαλέσασθαι
  choice: invocar
  rationale: Verbo natural no registro bíblico-religioso, que comunica dirigir-se ao Senhor ou apelar a ele.
- source_word: τὸ ὄνομα
  choice: o nome
  rationale: Preserva a expressão bíblica carregada de significado, evitando paráfrases interpretativas como autoridade ou reputação.
- source_word: Κυρίου
  choice: do Senhor
  rationale: É a tradução convencional e contextualmente adequada de Κυρίου na expressão 'o nome do Senhor'.
