  yaml_path: translation/deuterocanon/psalms_of_solomon/006/007.yaml
  text: With gladness in his heart he sang praise to the name of God[b][a], and he entreated the Lord for all his household.
translation:
  language: pt
  text: Com alegria no coração, ele cantou louvores ao nome de Deus e suplicou ao Senhor[a] por todos os da sua casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “suplicou à face do Senhor”, expressão que significa buscar o seu favor.
    reason: idioma_hebraizante
lexical_decisions:
- source_word: ἐν εὐφρίᾳ καρδίας αὐτοῦ
  choice: Com alegria no coração
  rationale: Expressa de modo natural a alegria interior indicada pela construção grega, preservando «coração» como centro afetivo e volitivo.
- source_word: ἐξύμνησεν
  choice: cantou louvores
  rationale: O verbo sugere louvor de caráter hínico; «cantou louvores» comunica essa especificidade melhor que o simples «louvou».
- source_word: τῷ ὀνόματι τοῦ θεοῦ
  choice: ao nome de Deus
  rationale: Mantém a referência explícita ao nome divino e o idioma bíblico de honra e invocação.
- source_word: ἐδεήθη
  choice: suplicou
  rationale: O verbo indica um pedido insistente ou fervoroso, sentido bem expresso pelo português «suplicou».
- source_word: τοῦ προσώπου Κυρίου
  choice: ao Senhor
  rationale: Com ἐδεήθη, o genitivo identifica aquele a quem se dirige a súplica. A tradução natural evita tratar a expressão como mera indicação locativa, enquanto a nota preserva o idioma literal «a face do Senhor».
- source_word: περὶ παντὸς τοῦ οἴκου αὐτοῦ
  choice: por todos os da sua casa
  rationale: Neste contexto, οἶκος designa o conjunto familiar ou doméstico, não apenas o edifício. A formulação mantém o sentido coletivo em português corrente.
theological_decisions:
- issue: Tradução do idioma τοῦ προσώπου Κυρίου
  choice: ao Senhor
  alternative: à face do Senhor; ao favor do Senhor
  rationale: A expressão é objeto de ἐδεήθη, e não uma indicação de lugar. «Suplicou ao Senhor» reproduz naturalmente a relação sintática; a nota registra a forma literal e sua provável ideia de buscar o favor divino, sem impor essa explicação ao texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva os idiomas bíblicos «nome de Deus», «coração» e «os da sua casa», esclarecendo em nota apenas a expressão que soaria opaca se traduzida literalmente.
