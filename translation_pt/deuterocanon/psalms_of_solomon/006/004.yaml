lexical_decisions:
- source_word: ἀπὸ ὁράσεως
  choice: pela visão
  rationale: A preposição ἀπό indica aqui a causa da perturbação, enquanto ὅρασις preserva a ideia de uma experiência visual ou visão onírica.
- source_word: πονηρῶν ἐνυπνίων αὐτοῦ
  choice: de seus sonhos maus
  rationale: Mantém o genitivo αὐτοῦ ligado aos sonhos e traduz πονηρός sem especificar se os sonhos são moralmente maus, nocivos ou ameaçadores.
- source_word: οὐ ταραχθήσεται
  choice: Não ficará perturbado
  rationale: O futuro passivo expressa que ele não será abalado, agitado ou perturbado.
theological_decisions:
- issue: Sentido de πονηρῶν aplicado aos sonhos
  choice: sonhos maus
  alternative: pesadelos / sonhos malignos
  rationale: A formulação mais literal preserva a amplitude semântica e evita definir os sonhos especificamente como pesadelos ou como de origem demoníaca.
translation_notes:
  register: Português moderno, claro e digno. A ordem foi ajustada para soar natural, sem eliminar a referência à visão própria da experiência onírica.
