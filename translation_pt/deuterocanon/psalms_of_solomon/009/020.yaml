lexical_decisions:
- source_word: κυρίου
  choice: do Senhor
  rationale: Preserva a relação genitiva e emprega a forma portuguesa natural e tradicional para κύριος.
- source_word: ἐλεημοσύνη
  choice: misericórdia
  rationale: Neste contexto, o substantivo expressa a disposição ou ação misericordiosa do Senhor para com Israel; “misericórdia” mantém de modo conciso seu peso teológico e relacional.
- source_word: ἡ ἐπʼ οἶκον Ἰσραήλ
  choice: está sobre a casa de Israel
  rationale: Explicita em português a relação predicativa indicada pelo artigo e pela locução prepositiva, preservando tanto a imagem de algo que está sobre Israel quanto o sentido coletivo de οἶκος.
- source_word: εἰς τὸν αἰῶνα καὶ ἔτι
  choice: para todo o sempre
  rationale: Expressão portuguesa corrente que comunica duração ilimitada e a intensificação de καὶ ἔτι, sem produzir uma formulação artificial no texto principal.
