  yaml_path: translation/deuterocanon/psalms_of_solomon/009/009.yaml
  text: The one who does righteousness stores up life for himself with the Lord[e][d][c][b][a], and the one who does unrighteousness is himself responsible for his soul in destruction.
translation:
  language: pt
  text: Quem pratica a justiça[a] acumula para si vida junto ao Senhor,[b] e quem pratica a injustiça é ele próprio responsável por sua alma, na perdição.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a retidão”.
    reason: lexical_alternative
  - marker: b
    text: Ou “diante do Senhor”; também é possível entender “da parte do Senhor”.
    reason: lexical_alternative
  - marker: c
    text: “Alma” também pode ser entendida como “vida” ou “a própria pessoa”.
    reason: lexical_alternative
  - marker: d
    text: 'A frase também pode ser traduzida: “é ele próprio culpado quanto à sua alma, para a perdição” ou “é responsável pela perdição da própria alma”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ποιῶν
  choice: quem pratica
  rationale: O particípio substantivado tem sentido genérico. “Quem pratica” é natural em português e mantém a força verbal sem restringi-la a um ato isolado.
- source_word: δικαιοσύνην
  choice: a justiça
  rationale: “Justiça” expressa aqui a conduta moralmente reta e forma um contraste direto e idiomático com “injustiça”; “retidão” também é possível.
- source_word: θησαυρίζει
  choice: acumula
  rationale: O verbo descreve guardar ou ajuntar como tesouro. “Acumula” comunica esse sentido em português atual sem recorrer ao pouco comum “entesoura”.
- source_word: ζωὴν
  choice: vida
  rationale: O substantivo sem artigo é adequadamente vertido como “vida”, preservando sua amplitude no contexto moral e religioso.
- source_word: αὐτῷ
  choice: para si
  rationale: O dativo tem valor reflexivo no contexto e ressalta que o benefício recai sobre o próprio agente.
- source_word: παρὰ Κυρίῳ
  choice: junto ao Senhor
  rationale: παρά com o dativo pode indicar proximidade ou posição perante alguém. “Junto ao Senhor” conserva a imagem de vida guardada na presença dele, sem decidir por uma origem explícita.
- source_word: ἀδικίαν
  choice: a injustiça
  rationale: Mantém o contraste lexical estreito com δικαιοσύνην e comunica conduta contrária ao que é justo.
- source_word: αὐτὸς αἴτιος
  choice: é ele próprio responsável
  rationale: αὐτός é enfático, e αἴτιος indica responsabilidade ou culpabilidade. A formulação preserva a ênfase na responsabilidade pessoal.
- source_word: τῆς ψυχῆς
  choice: por sua alma
  rationale: ψυχή pode significar alma, vida ou a própria pessoa. “Alma” preserva o peso religioso da advertência sem excluir os sentidos mais amplos, registrados em nota.
- source_word: ἐν ἀπωλείᾳ
  choice: na perdição
  rationale: A expressão grega é compacta e permite mais de uma relação sintática com αἴτιος e ψυχή. “Na perdição” conserva a preposição e evita explicitar causalidade ou resultado além do texto.
theological_decisions:
- issue: Consequência moral e responsabilidade pessoal na segunda oração
  choice: A pessoa que pratica a injustiça é apresentada como pessoalmente responsável por sua alma em relação à perdição.
  alternative: Ela causa a destruição da própria alma; ou torna-se culpada quanto à própria vida, para a perdição.
  rationale: O grego é conciso e um tanto idiomático. A tradução mantém a culpabilidade pessoal, mas não define de modo inequívoco se ἐν ἀπωλείᾳ indica estado, esfera ou resultado.
- issue: Sentido de ψυχή
  choice: alma
  alternative: vida; a própria pessoa
  rationale: “Alma” conserva a gravidade moral e religiosa da frase, enquanto a nota reconhece a amplitude semântica genuína de ψυχή.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção final permanece deliberadamente compacta para conservar a ambiguidade do grego; as alternativas mais idiomáticas e interpretativas são registradas em nota.
