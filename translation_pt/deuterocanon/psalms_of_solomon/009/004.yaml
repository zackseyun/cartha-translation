lexical_decisions:
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a razão da afirmação no contexto e preserva de modo natural a força causal do grego.
- source_word: κριτὴς
  choice: juiz
  rationale: É o equivalente direto e corrente para aquele que julga.
- source_word: δίκαιος
  choice: justo
  rationale: Em português, «juiz justo» expressa naturalmente tanto a retidão moral quanto a imparcialidade judicial atribuídas a Deus.
- source_word: ἐπὶ
  choice: sobre
  rationale: Neste contexto, indica autoridade ou jurisdição exercida em relação a todos os povos.
- source_word: πάντας τοὺς λαοὺς
  choice: todos os povos
  rationale: Mantém o plural e a referência ampla a grupos humanos; «nações» continua sendo uma alternativa contextual possível.
- source_word: τῆς γῆς
  choice: da terra
  rationale: A abrangência universal da frase favorece «terra», em vez do sentido localizado de «país» ou «território».
theological_decisions:
- issue: Alcance do juízo divino
  choice: sobre todos os povos da terra
  alternative: sobre todas as nações da terra
  rationale: A tradução conserva a afirmação universal sem restringi-la a entidades políticas; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com construção concisa. «Pois» preserva a ligação causal, e «juiz justo» soa natural tanto no português brasileiro quanto no uso internacional.
