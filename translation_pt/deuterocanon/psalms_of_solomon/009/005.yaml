lexical_decisions:
- source_word: κρυβήσεται
  choice: ficará oculto
  rationale: Preserva o futuro passivo e a imagem de ocultação diante de Deus, sem reduzir o sentido a simplesmente passar despercebido.
- source_word: γνώσεώς
  choice: conhecimento
  rationale: É o equivalente direto e natural de γνῶσις e conserva a formulação «oculto ao teu conhecimento».
- source_word: πᾶς ποιῶν ἄδικα
  choice: ninguém que pratica injustiças
  rationale: 'A construção negativa em português expressa com naturalidade a força universal do grego: toda pessoa que age injustamente não poderá permanecer oculta.'
- source_word: ἄδικα
  choice: injustiças
  rationale: Conserva a ligação lexical e temática com o campo de justiça/injustiça presente no salmo, evitando o termo mais genérico «mal».
theological_decisions:
- issue: Força universal de πᾶς sob negação
  choice: ninguém que pratica injustiças ficará oculto
  alternative: todo aquele que pratica injustiças não ficará oculto
  rationale: A opção escolhida transmite inequivocamente a universalidade da afirmação e soa mais natural em português, sem alterar seu alcance teológico.
