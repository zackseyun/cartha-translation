  text: To whom will you show kindness[a], O God[b], if not to those who call on the Lord?
translation:
  language: pt
  text: A quem tratarás com bondade[a], ó Deus, senão aos que invocam o Senhor?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com quem serás bondoso”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνι
  choice: a quem
  rationale: O dativo interrogativo indica o destinatário da ação bondosa e introduz uma pergunta retórica; “a quem” preserva essa estrutura com naturalidade em português.
- source_word: χρηστεύσῃ
  choice: tratarás com bondade
  rationale: A forma verbal está na segunda pessoa do singular e expressa ação benevolente. “Tratarás com bondade” é natural e mantém o sentido sem acrescentar a ideia mais específica de favor pactual.
- source_word: ἐπικαλουμένοις
  choice: os que invocam
  rationale: O particípio designa aqueles que apelam ao Senhor ou o invocam. “Invocam” preserva de modo conciso o sentido religioso do verbo.
- source_word: κύριον
  choice: Senhor
  rationale: Em contexto religioso, “Senhor” é o equivalente português estabelecido e adequado para κύριον.
theological_decisions:
- issue: Função de ὁ θεός
  choice: ó Deus
  alternative: Deus como sujeito da oração
  rationale: Embora esteja formalmente no nominativo, ὁ θεός funciona aqui como vocativo, uso comum no grego helenístico. A segunda pessoa singular χρηστεύσῃ confirma que Deus está sendo diretamente interpelado, não apresentado como sujeito em terceira pessoa.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla compreensão internacional. A pergunta retórica e a interpelação direta a Deus foram preservadas.
