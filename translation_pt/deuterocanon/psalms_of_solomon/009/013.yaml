lexical_decisions:
- source_word: ὅτι
  choice: pois
  rationale: Introduz a explicação ou fundamento da afirmação no contexto, preservando a força conectiva do grego.
- source_word: αἰσχύνη
  choice: vergonha
  rationale: É o equivalente direto e mantém tanto a experiência de humilhação quanto a dimensão pública da desonra.
- source_word: ἡμῖν καὶ τοῖς προσώποις ἡμῶν
  choice: está sobre nós e sobre o nosso rosto
  rationale: Mantém uma única oração, com «vergonha» regendo os dois membros paralelos. O singular distributivo «nosso rosto» soa mais natural em português e conserva a imagem concreta.
- source_word: περὶ ἁπάντων
  choice: por causa de tudo isso
  rationale: No contexto, indica de modo natural o motivo ou a ocasião da vergonha. «Isso» retoma os fatos mencionados, sem precisar repeti-los.
