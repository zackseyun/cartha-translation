  source_fidelity: A construção com uma única ocorrência de «vergonha» e dois membros coordenados é preservada adequadamente. Contudo, πρόσωποις é plural; «o nosso rosto» introduz um singular distributivo que não está no grego. «Tudo isso» também acrescenta um demonstrativo ausente de ἁπάντων.
