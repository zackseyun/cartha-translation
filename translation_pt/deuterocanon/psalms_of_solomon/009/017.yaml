  text: For you chose the offspring of Abraham above all the nations[b][a],
translation:
  language: pt
  text: Pois tu escolheste a descendência de Abraão acima de todas as nações.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «a semente de Abraão»; também pode ser traduzido como «os descendentes de Abraão».
    reason: lexical_alternative
  - marker: b
    text: Ou «mais do que todas as nações»; também, «além de todas as nações».
    reason: alternative_reading
lexical_decisions:
- source_word: ἡρέτισω
  choice: escolheste
  rationale: O verbo expressa escolha ou seleção; «escolheste» é direto, natural e preserva a ação divina sem acrescentar nuances interpretativas.
- source_word: σπέρμα
  choice: descendência
  rationale: «Descendência» comunica naturalmente o sentido coletivo do singular grego e mantém a ligação genealógica com Abraão; «semente» seria mais literal, mas menos idiomático neste contexto.
- source_word: παρὰ
  choice: acima de
  rationale: Com acusativo e valor comparativo, a expressão indica preferência em relação às demais nações. «Acima de» preserva essa força, embora também possa ser entendida como «mais do que».
- source_word: ἔθνη
  choice: nações
  rationale: «Nações» é a correspondência mais direta e menos carregada teologicamente; «gentios» tornaria explícito um contraste religioso que o termo grego, isoladamente, não exige.
theological_decisions:
- issue: A eleição da descendência de Abraão em relação às nações
  choice: Traduzir diretamente como a escolha da descendência de Abraão acima de todas as nações.
  alternative: Entender que Deus separou a descendência de Abraão dentre todas as nações ou que a preferiu mais do que todas elas.
  rationale: O texto afirma escolha divina e preferência comparativa. A tradução conserva essa força sem a reduzir a mera separação nem desenvolver categorias doutrinárias posteriores.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira. A colocação dos marcadores segue a ordem das questões no texto: primeiro «descendência», depois «acima de».'
