lexical_decisions:
- source_word: ἐπεσκέπτῃ
  choice: visitas
  rationale: Preserva o sentido formal de visitação divina e a amplitude do verbo, que, conforme o contexto, pode envolver observar, inspecionar ou cuidar, sem definir no texto principal se a visita é protetora ou judicial.
- source_word: δικαιοσύνῃ
  choice: justiça
  rationale: Em português, “justiça” expressa naturalmente tanto o caráter reto de Deus quanto seu modo justo de agir neste contexto de juízo.
- source_word: υἱοὺς ἀνθρώπων
  choice: os filhos dos homens
  rationale: Mantém a expressão semítica tradicional reproduzida literalmente no grego, ao mesmo tempo que uma nota esclarece sua referência coletiva à humanidade.
theological_decisions:
- issue: Caráter da visitação divina
  choice: Manter “visitas” sem especificar proteção ou investigação judicial.
  alternative: “examinas” ou “velas por”
  rationale: O contexto favorece a ideia de escrutínio justo, mas o verbo grego é mais amplo. A tradução principal conserva essa tensão em vez de impor exclusivamente uma leitura judicial ou pastoral.
- issue: Expressão masculina representativa
  choice: Preservar “os filhos dos homens” no texto principal.
  alternative: “os seres humanos” ou “os filhos da humanidade”
  rationale: A expressão tradicional do original é mantida, enquanto a nota explicita que sua referência abrange os seres humanos em geral.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva o paralelismo poético e a ambiguidade do verbo grego.
