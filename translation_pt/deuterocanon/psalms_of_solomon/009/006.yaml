translation:
  language: pt
  text: E as ações justas dos teus fiéis estão diante de ti, Senhor; e onde poderá alguém esconder-se do teu conhecimento, ó Deus?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύναι
  choice: ações justas
  rationale: O plural, neste contexto, aponta naturalmente para atos ou obras de justiça; a formulação evita o pouco natural «justiças» sem reduzir o sentido ao singular abstrato.
- source_word: ὁσίων
  choice: fiéis
  rationale: Ὅσιος caracteriza pessoas piedosas, devotas ou santas em sua lealdade a Deus. «Fiéis» comunica esse perfil em português atual sem pressupor uma classe formal de «santos».
- source_word: γνώσεώς
  choice: conhecimento
  rationale: Equivalente direto de γνῶσις, preservando a afirmação de que ninguém pode escapar ao conhecimento divino.
- source_word: ἄνθρωπος
  choice: alguém
  rationale: Aqui o substantivo é genérico; «alguém» exprime com naturalidade a referência a qualquer ser humano, sem restringi-la ao sexo masculino.
theological_decisions:
- issue: Sentido do plural δικαιοσύναι
  choice: ações justas
  alternative: justiças
  rationale: A tradução explicita o provável valor concreto do plural grego, sem transformar a expressão em uma afirmação sobre mérito salvífico nem impor uma leitura doutrinária.
- issue: Designação dos ὅσιοι
  choice: fiéis
  alternative: santos / piedosos
  rationale: «Fiéis» conserva a ideia de devoção e lealdade a Deus, evitando tanto uma possível leitura institucional de «santos» quanto a conotação por vezes afetada de «piedosos».
- issue: Alcance do conhecimento de Deus
  choice: onde poderá alguém esconder-se do teu conhecimento
  alternative: onde se esconderá o homem da tua ciência
  rationale: Mantém a pergunta retórica e sua tensão teológica, sem acrescentar termos como «onisciência» que não aparecem explicitamente no grego.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com ordem sintática natural. Mantém as duas invocações, «Senhor» e «ó Deus», e a força retórica da pergunta.
