  text: He will cleanse a soul in sins by confession, by open acknowledgment.
translation:
  language: pt
  text: Purificará uma alma em pecados por meio da confissão, por meio de declarações públicas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθαρίσει
  choice: Purificará
  rationale: Mantém o futuro do verbo e seu sentido de tornar puro ou limpar.
- source_word: ἐν ἁμαρτίαις
  choice: em pecados
  rationale: Preserva a preposição grega ἐν e a formulação incomum, sem resolver silenciosamente a possível tensão como se o texto dissesse 'dos pecados'.
- source_word: ψυχὴν
  choice: uma alma
  rationale: Equivalente natural que conserva o objeto singular e indefinido no contexto.
- source_word: ἐν ἐξομολογήσει
  choice: por meio da confissão
  rationale: Neste contexto, ἐν pode expressar o meio; 'confissão' comunica o reconhecimento verbal dos pecados.
- source_word: ἐν ἐξαγορίαις
  choice: por meio do reconhecimento público
  rationale: Expressa a ideia rara de declaração aberta ou pública, mantendo-a distinta de 'confissão'.
theological_decisions:
- issue: Relação entre a alma e os pecados
  choice: em pecados
  alternative: dos pecados
  rationale: O grego atestado traz ἐν ἁμαρτίαις, literalmente 'em pecados'. A tradução conserva essa relação em vez de introduzir uma ideia explícita de separação não marcada pela preposição do texto.
- issue: Agente não expresso no verbo
  choice: Purificará
  alternative: Ele purificará
  rationale: O sujeito está implícito no verbo grego e não é identificado no fragmento fornecido; omitir o pronome evita explicitação desnecessária.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição de 'por meio de' preserva o paralelismo das duas expressões gregas, enquanto 'em pecados' retém deliberadamente a construção difícil do original.
