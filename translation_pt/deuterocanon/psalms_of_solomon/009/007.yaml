review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente os termos centrais e a oposição δικαιοσύνη/ἀδικία. Contudo, “estar sob a escolha” é uma construção pouco precisa para ἐν ἐκλογῇ καὶ ἐξουσίᾳ, que apresenta as obras como dependentes ou situadas na esfera da escolha e da capacidade da alma. A forma “para praticar” deixa o sujeito do infinitivo desnecessariamente solto em português.
  naturalness: O registro é digno e compreensível, mas “sob a escolha” soa pouco idiomático em português moderno. “Dependem da escolha e do poder” comunica naturalmente a relação de agência moral. O infinitivo pessoal “praticarmos” torna clara a referência humana já presente em “nossas”.
  terminology: “Obras”, “alma”, “justiça” e “injustiça” são escolhas defensáveis e preservam tanto a repetição de ἔργα quanto o paralelismo lexical entre δικαιοσύνη e ἀδικία. “Por meio das obras de nossas mãos” mantém a expressão instrumental concreta do grego, embora seja deliberadamente mais formal.
  issues:
  - severity: medium
    issue: “Estão sob a escolha e o poder”
    rationale: A preposição “sob” sugere submissão a uma escolha já feita e não expressa com naturalidade a noção grega de que os atos estão no âmbito ou dependem da escolha e da capacidade da alma.
  - severity: low
    issue: Infinitivo sem sujeito expresso em “para praticar”
    rationale: Embora possível, a formulação pode soar pendente após “nossas obras”. O infinitivo pessoal esclarece que a ação moral é humana, sem acrescentar conteúdo interpretativo.
