  text: Our deeds are within the choice and power of our soul[d][c][b][a], to do righteousness and unrighteousness with the works of our hands.
translation:
  language: pt
  text: Nossas obras dependem da escolha e do poder de nossa alma, para praticarmos a justiça e a injustiça por meio das obras de nossas mãos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἔργα ἡμῶν
  choice: Nossas obras
  rationale: “Obras” preserva a repetição de ἔργα presente no início e no fim do verso e mantém o caráter moral e concreto das ações.
- source_word: ἐν ἐκλογῇ
  choice: sob a escolha
  rationale: Aqui ἐκλογή indica escolha ou decisão humana, não “eleição” em sentido teológico. A construção com “sob” expressa que as obras se encontram no âmbito dessa escolha.
- source_word: ἐξουσίᾳ
  choice: poder
  rationale: “Poder” comunica capacidade ou domínio para agir. “Autoridade” é lexicalmente possível, mas em português pode sugerir mais facilmente um cargo ou direito institucional.
- source_word: τῆς ψυχῆς ἡμῶν
  choice: de nossa alma
  rationale: Mantém de modo transparente o substantivo ψυχή e sua referência à sede interior da agência moral.
- source_word: τοῦ ποιῆσαι
  choice: para praticar
  rationale: “Praticar” é natural com os substantivos morais “justiça” e “injustiça”, enquanto “para” preserva sem rigidez excessiva a relação infinitiva, que pode envolver finalidade ou capacidade.
- source_word: δικαιοσύνην
  choice: justiça
  rationale: “Justiça” é uma tradução corrente e ampla de δικαιοσύνη neste contraste moral, sem restringir o termo a uma formulação confessional.
- source_word: ἀδικίαν
  choice: injustiça
  rationale: 'Preserva em português a oposição lexical direta entre δικαιοσύνη e ἀδικία: “justiça e injustiça”.'
- source_word: ἔργοις χειρῶν ἡμῶν
  choice: por meio das obras de nossas mãos
  rationale: Preserva a imagem concreta das mãos e o dativo instrumental, evitando a estranheza de “com as obras” e sem dissolver a expressão em uma paráfrase.
theological_decisions:
- issue: Agência e responsabilidade moral humanas
  choice: “sob a escolha e o poder de nossa alma”
  alternative: “na escolha e na autoridade de nossa alma”
  rationale: O verso atribui as ações humanas ao âmbito da escolha e da capacidade interior, incluindo tanto a justiça quanto a injustiça. A tradução mantém essa afirmação forte sem a transformar numa definição sistemática de livre-arbítrio.
- issue: Contraste entre δικαιοσύνη e ἀδικία
  choice: “justiça e injustiça”
  alternative: “retidão e injustiça” ou “justiça e perversidade”
  rationale: A dupla escolhida reproduz o contraste morfológico e semântico do grego e evita impor distinções teológicas que o verso não explicita.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário internacional. A sintaxe permanece próxima do grego, mas “sob” e “por meio de” tornam as relações semânticas naturais em português. Não há notas de rodapé, portanto não são necessários marcadores no texto.
