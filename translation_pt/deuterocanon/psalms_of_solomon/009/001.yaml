  yaml_path: translation/deuterocanon/psalms_of_solomon/009/001.yaml
  text: When Israel was carried away into exile to a foreign land[a], when they departed from the Lord who had redeemed them,
translation:
  language: pt
  text: Quando Israel foi levado para o exílio, para uma terra estrangeira, quando eles se afastaram do Senhor[a] que os havia redimido,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “abandonaram o Senhor” ou “apostataram do Senhor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαχθῆναι
  choice: foi levado
  rationale: O infinitivo aoristo passivo indica que Israel foi removido, não que partiu voluntariamente; “foi levado” é natural e mantém a ideia de deportação.
- source_word: ἀποικεσίᾳ
  choice: ao exílio
  rationale: No contexto, o termo designa a condição de deslocamento para fora da própria terra. “Ao exílio” comunica isso com clareza em português atual.
- source_word: γῆν ἀλλοτρίαν
  choice: uma terra estrangeira
  rationale: A expressão indica uma terra pertencente a outros, que não era a terra de Israel; “terra estrangeira” preserva esse sentido de modo idiomático.
- source_word: ἀποστῆναι
  choice: se afastaram
  rationale: O verbo pode indicar afastamento, abandono ou apostasia. “Se afastaram” mantém o sentido direcional e relacional sem impor no texto principal uma formulação técnica; a nota registra alternativas mais fortes.
- source_word: Κυρίου
  choice: Senhor
  rationale: É a tradução convencional e adequada de κύριος neste contexto de relação pactual.
- source_word: τοῦ λυτρωσαμένου
  choice: que os havia redimido
  rationale: O particípio identifica o Senhor como aquele que anteriormente resgatou Israel. “Redimido” preserva as ressonâncias de libertação e redenção, e o mais-que-perfeito composto deixa clara a anterioridade da ação.
theological_decisions:
- issue: Força teológica de ἀποστῆναι
  choice: se afastaram do Senhor
  alternative: apostataram do Senhor / abandonaram o Senhor
  rationale: O grego admite tanto afastamento quanto defecção religiosa mais explícita. A tradução principal conserva essa amplitude, enquanto a nota apresenta leituras mais fortes sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “quando” reproduz a estrutura temporal paralela do grego. O pronome “eles” explicita a mudança do singular coletivo “Israel” para o plural αὐτούς.
