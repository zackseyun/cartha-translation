  text: And you set your name upon us, O Lord; and you will never remove it.
translation:
  language: pt
  text: E puseste o teu nome sobre nós, Senhor, e não cessarás jamais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, entendendo-se um objeto implícito: «e não o farás cessar jamais». O grego não explicita o objeto de «farás cessar»; no contexto, pode referir-se ao nome do Senhor posto sobre o povo.'
    reason: Preserva no texto a construção sem objeto expresso e registra, sem a impor, a possível referência contextual ao nome.
lexical_decisions:
- source_word: ἔθου
  choice: puseste
  rationale: Aoristo de τίθημι, vertido de modo direto como ação realizada no passado.
- source_word: τὸ ὄνομά σου ἐφʼ ἡμᾶς
  choice: o teu nome sobre nós
  rationale: Preserva a imagem grega de o nome divino ser posto sobre o povo, sem explicá-la como mera posse ou proteção.
- source_word: οὐ καταπαύσεις
  choice: jamais o retirarás
  rationale: No contexto, o objeto implícito é o nome posto sobre o povo. 'Retirar' comunica naturalmente a ideia de fazê-lo cessar, sem sugerir que o Senhor deixará de agir em sentido absoluto.
- source_word: τὸν αἰῶνα
  choice: jamais
  rationale: 'A expressão adverbial reforça a negação com sentido temporal duradouro: ''nunca'', ''para sempre não''.'
theological_decisions:
- issue: Objeto implícito de καταπαύσεις
  choice: Retomar 'o teu nome' pelo pronome 'o'
  alternative: “e não cessarás para sempre”
  rationale: Embora o grego não expresse objeto, o contexto imediato favorece a referência ao nome posto sobre o povo; a nota registra a construção mais literal e sua ambiguidade gramatical.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com colocação pronominal natural e vocativo tradicional. A tradução mantém a metáfora bíblica do nome divino posto sobre o povo.
