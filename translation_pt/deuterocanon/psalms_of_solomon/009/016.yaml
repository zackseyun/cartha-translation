  yaml_path: translation/deuterocanon/psalms_of_solomon/009/016.yaml
  text: And now you are God, and we are your people whom you loved. Look and have compassion, O God of Israel, because we are yours; and do not withdraw your mercy from us, lest they attack us.
translation:
  language: pt
  text: E agora, tu és Deus, e nós somos o teu povo, a quem amaste. Olha e tem compaixão, ó Deus de Israel, pois somos teus; não afastes de nós a tua misericórdia, para que não nos ataquem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκτείρησον
  choice: tem compaixão
  rationale: Expressa de modo natural o imperativo aoristo e preserva o apelo pela compaixão divina.
- source_word: ἔλεός
  choice: misericórdia
  rationale: Equivalente tradicional e amplamente compreensível para a bondade compassiva de Deus neste contexto.
- source_word: ἐπιθῶνται
  choice: ataquem
  rationale: O verbo médio ἐπιτίθεμαι pode indicar lançar-se contra alguém ou atacá-lo; o contexto favorece a formulação direta 'nos ataquem'.
- source_word: ἀποστῇς ... ἀφʼ ἡμῶν
  choice: afastes de nós
  rationale: Reproduz a imagem espacial do grego com uma construção idiomática em português.
theological_decisions:
- issue: A relação de pertença entre Deus e Israel
  choice: pois somos teus
  alternative: porque pertencemos a ti
  rationale: Mantém a formulação concisa e relacional σοί ἐσμεν sem acrescentar uma definição doutrinária de pertença.
- issue: Valor da oração final ἵνα μὴ
  choice: para que não nos ataquem
  alternative: para que não venham contra nós
  rationale: Preserva formalmente a ideia de finalidade ou resultado pretendido, sem convertê-la em uma explicação causal.
translation_notes:
  register: Português atual, digno e acessível, com tratamento de Deus por 'tu', coerente com a segunda pessoa singular do grego. A ordem e o paralelismo do original foram preservados sem rigidez excessiva.
