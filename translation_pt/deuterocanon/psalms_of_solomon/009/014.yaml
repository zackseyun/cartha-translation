  text: E a quem ele perdoará os pecados, senão aos que pecaram?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφήσει
  choice: perdoará
  rationale: O futuro ativo de ἀφίημι, tendo pecados como objeto, significa naturalmente “perdoará”; a escolha é clara, corrente e preserva o sentido pessoal do verbo.
- source_word: ἁμαρτίας
  choice: os pecados
  rationale: O plural ἁμαρτίας designa diretamente “pecados”. O artigo definido torna a construção idiomática em português sem alterar o referente.
- source_word: τοῖς ἡμαρτηκόσι
  choice: aos que pecaram
  rationale: O particípio perfeito ativo identifica pessoas que cometeram pecado. “Aos que pecaram” preserva sua força verbal e evita transformá-lo no rótulo mais geral “aos pecadores”.
- source_word: τίνι
  choice: a quem
  rationale: O dativo singular é expresso naturalmente por “a quem” com o verbo “perdoar”, mantendo a estrutura interrogativa grega.
- source_word: εἰ μὴ
  choice: senão
  rationale: Na pergunta retórica, εἰ μὴ introduz a única resposta possível; “senão” reproduz essa função de modo conciso e natural.
theological_decisions:
- issue: Alcance do perdão divino
  choice: Manter a pergunta retórica que afirma que o perdão se dirige a quem de fato pecou.
  alternative: Entender que o perdão se destina especificamente aos que já têm consciência do próprio pecado.
  rationale: O texto afirma a lógica evidente do perdão sem mencionar consciência, arrependimento ou qualquer sistema doutrinário mais amplo; esses elementos não devem ser acrescentados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação concisa conserva o paralelismo conceitual entre “pecados” e “pecaram” e a força da pergunta retórica.
