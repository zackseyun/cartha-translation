  yaml_path: translation/deuterocanon/psalms_of_solomon/009/019.yaml
  text: In a covenant you appointed to our fathers concerning us[b][a], and we will hope in you in the turning back of our soul.
translation:
  language: pt
  text: Fizeste uma aliança com nossos pais a nosso respeito, e esperaremos em ti quando nossa alma voltar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «quando nos arrependermos»; literalmente, «no retorno de nossa alma».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκῃ
  choice: aliança
  rationale: Em contexto bíblico, διαθήκη designa uma aliança, especialmente a relação estabelecida por Deus com os antepassados; «aliança» preserva essa força teológica e intertextual.
- source_word: διέθου
  choice: fizeste
  rationale: Com διαθήκῃ, o verbo forma uma expressão de sentido equivalente a «fazer uma aliança». Esta formulação é natural em português e evita reproduzir de modo obscuro o hebraísmo grego.
- source_word: τοῖς πατράσιν ἡμῶν
  choice: com nossos pais
  rationale: Embora o dativo possa ser formalmente vertido por «aos nossos pais», a expressão de aliança pede naturalmente «com». «Pais» conserva a referência explícita aos antepassados patriarcais.
- source_word: περὶ ἡμῶν
  choice: a nosso respeito
  rationale: περί com genitivo significa diretamente «acerca de» ou «a respeito de»; esta opção evita transformar a expressão no mais interpretativo «em nosso favor».
- source_word: ἐλπιοῦμεν
  choice: esperaremos
  rationale: O futuro grego é preservado de maneira direta e natural.
- source_word: ἐπιστροφῇ
  choice: quando ... voltar
  rationale: A palavra pode expressar retorno ou conversão, com possível força penitencial. A formulação verbal mantém a imagem do voltar sem explicitar além do grego a ideia de arrependimento.
- source_word: ψυχῆς ἡμῶν
  choice: nossa alma
  rationale: Conserva o singular coletivo e a expressão antropológica do grego, sem reduzi-la a uma paráfrase como «nós».
theological_decisions:
- issue: Se ἐν ἐπιστροφῇ ψυχῆς ἡμῶν deve ser traduzido explicitamente como arrependimento
  choice: quando nossa alma voltar
  alternative: quando nos arrependermos
  rationale: O contexto provavelmente inclui arrependimento, mas o grego fala literalmente do retorno da alma. A tradução conserva a imagem e a tensão teológica sem restringir o sentido.
- issue: A relação da aliança com «nossos pais»
  choice: fizeste uma aliança com nossos pais
  alternative: estabeleceste em aliança para nossos pais
  rationale: A construção grega tem caráter semítico e funciona idiomaticamente como «fazer uma aliança». A opção escolhida transmite esse sentido sem impor uma formulação portuguesa obscura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega-se «tu» implícito nas formas verbais em consonância com a oração dirigida a Deus; a formulação evita tanto arcaísmo excessivo quanto paráfrase teológica.
