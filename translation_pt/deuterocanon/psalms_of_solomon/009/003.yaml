  text: So that you may be vindicated[a], O God, in your righteousness amid our lawless deeds[c][b];
translation:
  language: pt
  text: Para que sejas vindicado[a], ó Deus, em tua justiça[b], em meio às nossas transgressões[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para que sejas justificado»; ou: «para que fique demonstrado que és justo».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «em tua retidão».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «quanto às nossas transgressões».'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ἵνα
  choice: Para que
  rationale: Conserva o valor de propósito ou resultado da conjunção grega e liga naturalmente o verso ao contexto anterior.
- source_word: δικαιωθῇς
  choice: sejas vindicado
  rationale: O passivo, tendo Deus como sujeito, aponta para o reconhecimento ou a demonstração de que ele está certo, sem sugerir que passe a ser justo. A formulação mantém a tensão judicial do grego.
- source_word: ὁ θεός
  choice: ó Deus
  rationale: Embora formalmente nominativo, funciona como vocativo em uma oração direta; «ó Deus» preserva o tom solene e devocional.
- source_word: ἐν τῇ δικαιοσύνῃ σου
  choice: em tua justiça
  rationale: Mantém a construção com ἐν e traduz δικαιοσύνη por um termo português natural que pode abranger retidão e justiça no contexto judicial.
- source_word: ἐν ταῖς ἀνομίαις ἡμῶν
  choice: em meio às nossas transgressões
  rationale: «Em meio a» representa diretamente o segundo ἐν sem impor uma relação causal; «transgressões» comunica violações da lei de modo mais corrente que «iniquidades».
theological_decisions:
- issue: Sentido de δικαιωθῇς quando Deus é o sujeito
  choice: sejas vindicado
  alternative: sejas justificado; fique demonstrado que és justo
  rationale: «Vindicado» expressa que a justiça de Deus é reconhecida ou demonstrada diante das transgressões humanas, sem explicar além do que o passivo grego permite.
- issue: Amplitude de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: No contexto, «justiça» preserva a dimensão judicial, enquanto «retidão» continua sendo uma possibilidade lexical legítima e é indicada em nota.
- issue: Relação expressa pelo segundo ἐν
  choice: em meio às nossas transgressões
  alternative: quanto às nossas transgressões
  rationale: A leitura principal conserva o sentido espacial ou circunstancial mais direto; a nota preserva a possível referência relacional sem transformá-la em causa.
translation_notes:
  register: Português atual, digno e de leitura ampla, com cadência adequada a uma oração poética. «Vindicado» conserva o caráter judicial do verbo; «transgressões» evita tanto uma paráfrase genérica como o tom excessivamente arcaico de «iniquidades».
