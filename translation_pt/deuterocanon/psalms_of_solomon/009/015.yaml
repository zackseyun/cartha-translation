  text: You will bless the righteous[a], and you do not call them to account for the things in which they sinned[c][b]; and your goodness is toward those who sin in repentance.
translation:
  language: pt
  text: Abençoarás os justos e não lhes pedes contas daquilo em que pecaram; e a tua bondade é para com os que pecam arrependidos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os que pecam em arrependimento». A expressão grega também pode incluir a ideia de remorso ou pesar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαίους
  choice: os justos
  rationale: O adjetivo substantivado designa pessoas caracterizadas pela justiça; «os justos» é a forma bíblica consagrada e natural em português.
- source_word: εὐλογήσεις
  choice: abençoarás
  rationale: Preserva o futuro explícito do grego e o sentido religioso de conceder bênção.
- source_word: οὐκ εὐθύνεις
  choice: não lhes pedirás contas
  rationale: O verbo tem aqui valor judicial de exigir explicações ou responsabilizar. A forma portuguesa expressa esse sentido com clareza; embora use futuro por concordância discursiva com «abençoarás», o presente grego é registrado como questão interpretativa.
- source_word: περὶ ὧν ἥμαρτοσαν
  choice: daquilo em que pecaram
  rationale: Mantém a referência aos assuntos ou atos nos quais os justos pecaram, sem converter a expressão em uma formulação teológica mais específica.
- source_word: χρηστότης
  choice: bondade
  rationale: Abrange tanto a qualidade moral quanto a benevolência relacional indicada pelo substantivo grego.
- source_word: ἁμαρτάνοντας
  choice: os que pecam
  rationale: A tradução verbal conserva o particípio e evita transformar essas pessoas em uma categoria estática denominada «pecadores».
- source_word: ἐν μεταμελείᾳ
  choice: e se arrependem
  rationale: Expressa em português natural que a bondade divina se dirige aos que pecam em condição de arrependimento, evitando a impressão contraditória de que pecam enquanto se arrependem. A nuance de remorso ou pesar é preservada em nota.
theological_decisions:
- issue: Alternância entre o futuro εὐλογήσεις e o presente εὐθύνεις
  choice: «Abençoarás ... não lhes pedirás contas»
  alternative: «Abençoarás ... não lhes pedes contas»
  rationale: A concordância no futuro produz uma frase portuguesa mais coesa, mas o grego acentuado traz εὐθύνεις, formalmente presente, e pode apresentar a ausência de prestação de contas como característica atual ou habitual de Deus.
- issue: Relação entre pecado e μεταμέλεια
  choice: «os que pecam e se arrependem»
  alternative: «os que pecam em arrependimento»
  rationale: A formulação escolhida comunica naturalmente a condição penitente sem sugerir que o pecado seja cometido como ato de arrependimento; não afirma, porém, uma ordem temporal detalhada que o grego não explicita.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com formas verbais sintéticas adequadas ao registro poético. «Pedir contas» conserva o tom judicial sem soar técnico. O ponto e vírgula acompanha a progressão do período grego.
