  text: They were cast out from the inheritance that the Lord gave them; the dispersion of Israel is among every nation[a], according to the word of God.
translation:
  language: pt
  text: Foram expulsos da herança que o Senhor lhes deu; a dispersão de Israel está em todas as nações[a], segundo a palavra de Deus.
