lexical_decisions:
- source_word: ἀπερρίφησαν
  choice: foram expulsos
  rationale: O passivo indica que eles foram lançados para fora ou removidos, e “foram expulsos” comunica com naturalidade a severidade da ação no contexto do exílio.
- source_word: κληρονομίας
  choice: herança
  rationale: “Herança” conserva o sentido bíblico de uma porção concedida por Deus, especialmente a terra ou posse dada a Israel.
- source_word: Κύριος
  choice: Senhor
  rationale: É a tradução bíblica corrente de κύριος quando o termo designa o Deus de Israel.
- source_word: διασπορὰ
  choice: dispersão
  rationale: Mantém a forma nominal do grego e o sentido estabelecido de Israel espalhado entre as nações.
- source_word: ῥῆμα
  choice: palavra
  rationale: É a correspondência mais direta e preserva a possibilidade de se tratar de palavra, pronunciamento ou decreto divino, sem estreitar o sentido.
theological_decisions:
- issue: Se a expressão nominal ἡ διασπορὰ τοῦ Ἰσραήλ deve ser convertida numa oração verbal mais idiomática
  choice: a dispersão de Israel está entre todas as nações
  alternative: Israel está disperso entre todas as nações
  rationale: A redação principal preserva a construção nominal e a ênfase do grego; a forma verbal mais fluente é registrada em nota sem substituir a estrutura da fonte.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção nominal foi preservada deliberadamente, embora seja um pouco mais marcada em português.
