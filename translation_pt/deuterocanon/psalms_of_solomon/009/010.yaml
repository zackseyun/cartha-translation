translation:
  language: pt
  text: Pois os julgamentos do Senhor são feitos com justiça para cada pessoa e cada família.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego, literalmente, “segundo homem e casa”; a expressão provavelmente tem sentido distributivo: cada pessoa e cada casa ou família.'
