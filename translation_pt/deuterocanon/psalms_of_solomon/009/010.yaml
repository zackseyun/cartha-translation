  - marker: b
    text: 'Ou: “os julgamentos do Senhor são justos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματα
  choice: julgamentos
  rationale: Designa decisões ou atos judiciais; “julgamentos” conserva tanto a força jurídica quanto a moral.
- source_word: Κυρίου
  choice: do Senhor
  rationale: Equivalente corrente e digno de Κυρίου neste contexto.
- source_word: ἐν δικαιοσύνῃ
  choice: são feitos com justiça
  rationale: Conserva o substantivo “justiça” e sua ligação lexical com o contexto, enquanto expressa em português natural o caráter ou a maneira dos julgamentos.
- source_word: κατʼ ἄνδρα
  choice: para cada pessoa
  rationale: Entende κατά com acusativo em sentido distributivo. “Pessoa” comunica naturalmente a aplicação individual sem tornar o masculino grego obrigatoriamente exclusivo.
- source_word: οἶκον
  choice: cada família
  rationale: Neste paralelismo social, οἶκος indica mais provavelmente a unidade familiar ou doméstica do que a construção física; a repetição de “cada” explicita o valor distributivo.
theological_decisions:
- issue: Relação de ἐν δικαιοσύνῃ com κρίματα
  choice: são feitos com justiça
  alternative: são justos
  rationale: A formulação escolhida preserva o substantivo δικαιοσύνη e não reduz a expressão grega a um adjetivo, embora ambas as leituras comuniquem a retidão dos julgamentos.
- issue: Sentido distributivo de κατʼ ἄνδρα καὶ οἶκον
  choice: para cada pessoa e cada família
  alternative: segundo o homem e a casa
  rationale: O português explicita a provável distribuição dos julgamentos a indivíduos e unidades domésticas, sem determinar se “segundo” também implicaria correspondência às obras ou circunstâncias de cada um.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “São feitos com justiça” evita o pouco natural “estão em justiça”, preserva o substantivo temático e deixa explícito que a expressão qualifica o exercício dos julgamentos.
