review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha de perto o grego: conserva a metáfora de φυτεία, o estado resultante de ἐρριζωμένη, a duração de εἰς τὸν αἰῶνα, o plural explícito de ἐκλήξουσιν e o predicado referente a Israel. “Não chegarão ao fim” é uma opção segura para o verbo raro, sem importar o sentido moderno de fracasso associado a “falharão”.'
  naturalness: A frase é globalmente clara e de registro apropriado. Contudo, “Sua plantação” deixa o possessivo αὐτῶν sem antecedente português claro e pode sugerir que a plantação pertence a Deus, mencionado no fim. “A plantação deles” recupera o possessivo plural do grego. “Ao longo de todos os dias do céu” torna mais natural em português a expressão temporal literal.
  terminology: “Plantação”, “enraizada”, “porção” e “herança” são escolhas consistentes, naturais e adequadas ao vocabulário bíblico. A alternativa “não serão eliminados” na nota é mais forte e mais externa à imagem de cessar/chegar ao fim; “não serão cortados” preserva melhor a possível nuance contextual sem fechar o sentido.
  issues:
