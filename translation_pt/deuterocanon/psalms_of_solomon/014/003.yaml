revisions:
- from: Sua plantação está enraizada para sempre; eles não chegarão ao fim[a] durante todos os dias do céu[b], porque Israel é a porção e a herança de Deus.[c]
  to: A plantação deles está enraizada para sempre; eles não chegarão ao fim[a] ao longo de todos os dias do céu[b], porque Israel é a porção e a herança de Deus.[c]
  rationale: A revisão esclarece o possessivo plural de αὐτῶν, melhora discretamente a fluência da expressão de duração e ajusta a alternativa lexical da nota para evitar uma conotação de eliminação não exigida pelo grego. Não altera a ambiguidade intencional entre a plantação singular e o sujeito humano plural subsequente.
