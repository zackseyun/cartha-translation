base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/003.yaml
  text: Their planting is rooted forever[a]; they will not fail all the days of heaven[d][c][b], because Israel is the portion and inheritance of God.
translation:
  language: pt
  text: A plantação deles está enraizada para sempre; eles não chegarão ao fim[a] ao longo de todos os dias do céu[b], porque Israel é a porção e a herança de Deus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não cessarão” ou “não serão cortados”. O verbo grego é raro e, neste contexto, ressalta sua permanência.
    reason: lexical_alternative
  - marker: b
    text: “Todos os dias do céu” é uma expressão literal para toda a duração da ordem celeste presente.
    reason: cultural_note
  - marker: c
    text: 'Também se pode traduzir: “porque a porção e a herança de Deus é Israel”.'
    reason: alternative_reading
lexical_decisions:
- source_word: φυτεία
  choice: plantação
  rationale: Mantém a metáfora agrícola e pode designar tanto o ato de plantar quanto aquilo que foi plantado, sem explicitar além do grego o referente coletivo.
- source_word: ἐρριζωμένη
  choice: está enraizada
  rationale: Preserva a imagem botânica e expressa o estado duradouro resultante indicado pelo particípio perfeito passivo.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: É a forma portuguesa corrente de exprimir a permanência duradoura do idiomatismo neste contexto.
- source_word: ἐκλήξουσιν
  choice: não chegarão ao fim
  rationale: O verbo raro comunica cessar ou chegar ao fim. Esta formulação evita o sentido moderno potencialmente enganoso de “falharão” e preserva a ideia de continuidade.
- source_word: πάσας τὰς ἡμέρας τοῦ οὐρανοῦ
  choice: durante todos os dias do céu
  rationale: Conserva a expressão elevada e incomum do grego, sem interpretá-la prematuramente como “debaixo do céu”.
- source_word: μερὶς
  choice: porção
  rationale: Preserva a linguagem bíblica de parte atribuída ou possessão e forma um par natural com “herança”.
- source_word: κληρονομία
  choice: herança
  rationale: Mantém o sentido de bem ou possessão recebida e a ressonância pactual do vocabulário bíblico.
- source_word: τοῦ θεοῦ
  choice: de Deus
  rationale: Reproduz diretamente o genitivo possessivo sem acrescentar interpretação.
theological_decisions:
- issue: Identidade coletiva de Israel como porção e herança de Deus
  choice: Israel é a porção e a herança de Deus
  alternative: a porção e a herança de Deus é Israel
  rationale: A ordem escolhida é natural em português e mantém a afirmação pactual e possessiva do grego sem ampliá-la doutrinariamente.
- issue: Mudança da imagem singular da plantação para o sujeito plural do verbo seguinte
  choice: Sua plantação está enraizada... eles não chegarão ao fim
  alternative: Sua plantação está enraizada... ela não chegará ao fim
  rationale: O grego passa explicitamente do substantivo singular φυτεία e seu particípio singular para o verbo plural ἐκλήξουσιν. A tradução conserva essa tensão gramatical, permitindo que o plural retome as pessoas representadas pela plantação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva as imagens botânica e celestial do original, bem como a passagem deliberada do singular “plantação” ao plural “eles”.
