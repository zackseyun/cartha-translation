  register: Português atual, digno e acessível, com estrutura poética relativamente formal. A formulação deliberadamente incomum «amaram um dia de participação» preserva a compressão e a ambiguidade do grego. A vírgula final sinaliza que o pensamento prossegue no versículo seguinte.
