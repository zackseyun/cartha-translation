  yaml_path: translation/deuterocanon/psalms_of_solomon/014/004.yaml
  text: But not so the sinners and the lawless[a], who loved a day of sharing in their sin; their desire lay in the brevity of corruption,
translation:
  language: pt
  text: Mas não são assim os pecadores e os que vivem sem lei, que amaram um dia de participação em seu pecado; seu desejo estava na brevidade da corrupção[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «na pequenez da corrupção».'
    reason: A expressão grega ἐν μικρότητι σαπρίας é incomum. μικρότης pode denotar brevidade ou pequenez, enquanto σαπρία pode significar corrupção, decadência ou decomposição.
lexical_decisions:
- source_word: καὶ οὐχ οὕτως
  choice: Mas não são assim
  rationale: Expressa com naturalidade o forte contraste com a condição duradoura dos santos descrita anteriormente.
- source_word: οἱ ἁμαρτωλοὶ καὶ παράνομοι
  choice: os pecadores e os que vivem sem lei
  rationale: 'Mantém distintos os dois substantivos: ἁμαρτωλοί como «pecadores» e παράνομοι com sua força moral e jurídica de viver à margem ou em violação da lei.'
- source_word: οἱ ἠγάπησαν ἡμέραν
  choice: que amaram um dia
  rationale: Conserva a formulação singular e incomum do grego, sem transformar «um dia» em um período genérico.
- source_word: ἐν μετοχῇ ἁμαρτίας αὐτῶν
  choice: de participação em seu pecado
  rationale: μετοχή indica participação ou partilha. A construção preserva a ligação comprimida entre «um dia» e a participação no próprio pecado.
- source_word: ἐν μικρότητι σαπρίας
  choice: na brevidade da corrupção
  rationale: No contraste contextual com a permanência do versículo anterior, μικρότης pode indicar curta duração; σαπρία comunica corrupção, decomposição ou decadência. Uma nota conserva a alternativa mais literal.
- source_word: ἡ ἐπιθυμία αὐτῶν
  choice: seu desejo estava
  rationale: Traduz ἐπιθυμία de modo amplo, sem restringi-la a desejo sexual, e reproduz de maneira idiomática a construção com ἐν.
theological_decisions: []
