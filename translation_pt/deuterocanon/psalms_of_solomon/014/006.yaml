base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/006.yaml
  text: Therefore Hades and darkness and destruction are their inheritance[a], and they will not be found in the day of mercy for the righteous[d][c][b]. But the holy ones of the Lord will inherit life in gladness.
translation:
  language: pt
  text: Por isso, a herança deles é o Hades[a], as trevas e a destruição, e eles não serão encontrados no dia de misericórdia para os justos.[b] Mas os piedosos do Senhor[c] herdarão a vida com alegria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Hades» refere-se ao domínio dos mortos; não equivale necessariamente a todo o sentido posterior muitas vezes associado a «inferno».
    reason: cultural_note
  - marker: b
    text: 'Ou: «no dia da misericórdia dos justos». A construção grega admite mais de uma interpretação.'
    reason: alternative_reading
  - marker: c
    text: 'Ou: «os fiéis do Senhor»; também se pode traduzir «os santos do Senhor».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural e conciso a conclusão resultante do contexto anterior.
- source_word: κληρονομία
  choice: herança
  rationale: Preserva a imagem de herança e sua força escatológica, retomada depois pelo verbo «herdarão».
- source_word: ᾅδης
  choice: Hades
  rationale: Mantém o termo grego sem importar automaticamente as associações doutrinárias mais amplas de «inferno».
- source_word: σκότος
  choice: trevas
  rationale: Equivalente direto e digno, adequado à tríade «Hades, trevas e destruição».
- source_word: ἀπώλεια
  choice: destruição
  rationale: Tradução direta e compreensível, sem o tom excessivamente eclesiástico de alternativas como «perdição».
- source_word: οὐχ εὑρεθήσονται
  choice: não serão encontrados
  rationale: Conserva a forma passiva futura e evita explicar além do que o grego afirma.
- source_word: ἐν ἡμέρᾳ ἐλέους δικαίων
  choice: no dia de misericórdia para os justos
  rationale: Entende os justos como beneficiários da misericórdia, leitura que se ajusta ao contraste imediato, mas registra em nota a ambiguidade do genitivo.
- source_word: ὅσιοι
  choice: os piedosos
  rationale: Distingue ὅσιοι de ἅγιοι e comunica devoção e fidelidade religiosa sem recorrer automaticamente a «santos».
- source_word: Κυρίου
  choice: do Senhor
  rationale: Reproduz diretamente o genitivo e mantém a designação tradicional de κύριος.
- source_word: κληρονομήσουσιν ζωὴν
  choice: herdarão a vida
  rationale: Preserva o paralelo deliberado com a «herança» dos ímpios na primeira oração.
- source_word: ἐν εὐφροσύνῃ
  choice: com alegria
  rationale: Expressa em português corrente o modo ou circunstância jubilosa, sem rigidez sintática.
theological_decisions:
- issue: Sentido de ᾅδης
  choice: Hades
  alternative: morada dos mortos; sepultura; inferno
  rationale: O termo grego designa o domínio dos mortos e, por si só, não exige todo o conteúdo doutrinário posteriormente associado a «inferno».
- issue: Função de δικαίων em ἐν ἡμέρᾳ ἐλέους δικαίων
  choice: misericórdia para os justos
  alternative: misericórdia dos justos
  rationale: A leitura escolhida entende os justos como beneficiários da misericórdia e combina bem com o contraste do verso, mas a construção grega admite mais de uma relação genitiva; por isso, a alternativa é preservada em nota.
- issue: Identidade dos ὅσιοι
  choice: os piedosos
  alternative: os fiéis; os santos
  rationale: «Piedosos» representa devoção e fidelidade à aliança sem confundir necessariamente o termo com ἅγιοι nem definir de modo denominacional quem pertence ao grupo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição «herança/herdarão» conserva o contraste estrutural do grego; «com alegria» evita uma formulação artificial sem perder o tom elevado.
