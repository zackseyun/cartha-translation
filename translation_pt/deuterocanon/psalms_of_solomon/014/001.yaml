  yaml_path: translation/deuterocanon/psalms_of_solomon/014/001.yaml
  text: The Lord is faithful to those who love him in truth[a], to those who endure his discipline, to those who walk in the righteousness of his commandments[b], in the law that he commanded us for our life.
translation:
  language: pt
  text: O Senhor é fiel aos que o amam em verdade, aos que suportam a sua disciplina[a], aos que andam na retidão dos seus mandamentos[b], na lei que ele nos ordenou para a nossa vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «instrução». O grego παιδεία pode incluir formação, correção e ensino.
    reason: lexical_alternative
  - marker: b
    text: Ou «justiça».
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς
  choice: fiel
  rationale: Predicativo de «Senhor», expressa a constância e a confiabilidade divinas; «fiel» é natural e preserva o peso religioso do termo.
- source_word: Κύριος
  choice: Senhor
  rationale: Título divino normal no contexto devocional judaico-grego.
- source_word: ἀγαπῶσιν
  choice: amam
  rationale: Tradução direta, simples e natural, que mantém a dimensão relacional do verbo.
- source_word: ἐν ἀληθείᾳ
  choice: em verdade
  rationale: Conserva a forma e a abertura semântica da expressão grega, que pode envolver veracidade e sinceridade.
- source_word: ὑπομένουσιν
  choice: suportam
  rationale: Expressa perseverança sob algo difícil sem acrescentar uma interpretação não explícita.
- source_word: παιδείαν
  choice: disciplina
  rationale: Abrange a formação corretiva e moral; a nota registra «instrução» como alternativa legítima.
- source_word: πορευομένοις
  choice: andam
  rationale: Preserva a metáfora bíblica do caminhar como modo de vida e conduta.
- source_word: δικαιοσύνῃ
  choice: justiça
  rationale: Mantém o equivalente lexical principal e a relação com a obediência aos mandamentos; «retidão» é indicada como alternativa contextual.
- source_word: προσταγμάτων
  choice: mandamentos
  rationale: Comunica ordens divinas com clareza e em registro devocional digno.
- source_word: νόμῳ
  choice: lei
  rationale: É o equivalente transparente no contexto de mandamentos divinos.
- source_word: εἰς ζωὴν ἡμῶν
  choice: para a nossa vida
  rationale: Preserva o singular coletivo de ζωή e a possível ideia de finalidade ou benefício, sem explicá-la além do texto.
