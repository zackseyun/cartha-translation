base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/005.yaml
  text: And they did not remember God[a], that the ways of men are known before him continually[c][b], and he knows the secrets of the heart before they come to be.
translation:
  language: pt
  text: E eles não se lembraram de Deus nem de que[a] os caminhos dos seres humanos são continuamente conhecidos diante dele, e ele conhece os segredos do coração[b] antes de virem a existir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não se lembraram de Deus, pois os caminhos dos seres humanos...”. O termo grego pode introduzir tanto o conteúdo lembrado quanto uma explicação causal.'
    reason: syntactic_ambiguity
  - marker: b
    text: Literalmente, “as câmaras interiores do coração”, imagem que se refere ao que está oculto nele.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “antes de surgirem” ou “antes de acontecerem”. O grego diz de modo amplo: “antes de virem a ser”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν τοῦ θεοῦ
  choice: se lembraram de Deus
  rationale: Expressa de modo direto e natural a ideia de trazer Deus à memória ou mantê-lo em mente, preservando a força moral do contexto.
- source_word: ὁδοὶ ἀνθρώπων
  choice: os caminhos dos seres humanos
  rationale: “Caminhos” conserva tanto a imagem quanto o sentido bíblico de conduta; “seres humanos” traduz o plural genérico sem restringi-lo aos homens do sexo masculino.
- source_word: γνωσταὶ ἐνώπιον αὐτοῦ
  choice: são conhecidos diante dele
  rationale: Mantém a construção estativa e a linguagem de presença própria do grego, sem reduzir o sentido a mera visibilidade.
- source_word: διὰ παντός
  choice: continuamente
  rationale: Comunica a constância expressa pela locução grega e se integra naturalmente à oração.
- source_word: ταμεῖα καρδίας
  choice: os segredos do coração
  rationale: Embora ταμεῖα designe literalmente cômodos interiores ou câmaras, aqui a metonímia se refere ao conteúdo oculto do coração. “Segredos” evita a incoerência de fazer as próprias “câmaras” surgirem e permanece claro em português.
- source_word: ἐπίσταται
  choice: conhece
  rationale: É o equivalente mais simples e adequado para o conhecimento pleno atribuído a Deus, além de preservar o paralelo com γνωσταί.
- source_word: πρὸ τοῦ γενέσθαι
  choice: antes de virem a existir
  rationale: Preserva a formulação ampla do grego sobre algo vir a ser, sem limitá-la apenas a acontecimentos, pensamentos ou atos.
theological_decisions:
- issue: Alcance da presciência divina na oração final
  choice: Deus conhece os segredos do coração antes de eles virem a existir.
  alternative: Deus conhece os pensamentos ou desígnios ocultos antes de surgirem, ou antes de se manifestarem em ações.
  rationale: O grego afirma conhecimento prévio abrangente, mas não define uma estrutura doutrinária nem esclarece se o referente preciso são pensamentos, planos, desejos ou atos futuros. A tradução mantém essa amplitude.
- issue: Relação de ὅτι com a oração anterior
  choice: 'Entender ὅτι como introdução do conteúdo esquecido: eles não se lembraram de Deus nem de que os caminhos humanos são conhecidos diante dele.'
  alternative: 'Entender ὅτι causalmente: “não se lembraram de Deus, pois os caminhos dos seres humanos...”'
  rationale: 'A leitura de conteúdo oferece a progressão contextual mais coerente: esquecer-se de Deus inclui deixar de considerar seu conhecimento dos caminhos humanos. A nota preserva a possibilidade causal formalmente permitida por ὅτι.'
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva o paralelismo e a linguagem bíblica de “caminhos” e “coração”, mas emprega “segredos” para tornar inteligível a metonímia grega. O acréscimo idiomático “nem de que” explicita em português a leitura de conteúdo de ὅτι, enquanto a nota registra a alternativa causal.
