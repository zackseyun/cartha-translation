base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/014/002.yaml
  text: The holy ones of the Lord will live in him forever[a]; the paradise of the Lord, the trees of life[c][b], are his holy ones.
translation:
  language: pt
  text: Os fiéis do Senhor viverão por ela para sempre[a]; o paraíso do Senhor — as árvores da vida[b] — são os seus fiéis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego também pode ser entendido como “viverão nele para sempre”, referindo-se ao Senhor. “Fiéis” também pode ser traduzido por “santos”, “piedosos” ou “devotos”.
    reason: Registra tanto a ambiguidade do referente de ἐν αὐτῷ quanto alternativas lexicais legítimas para ὅσιοι.
  - marker: b
    text: O grego traz “as árvores da vida” no plural.
    reason: Esclarece que o plural, embora menos esperado por leitores familiarizados com a expressão no singular, corresponde ao texto grego.
lexical_decisions:
- source_word: ὅσιοι / ὅσιοι αὐτοῦ
  choice: os fiéis / os seus fiéis
  rationale: ὅσιος caracteriza pessoas dedicadas a Deus, piedosas e leais a ele. “Fiéis” comunica esse sentido religioso em português corrente, sem as possíveis conotações eclesiásticas posteriores de “santos”, e a repetição conserva a estrutura e a metáfora do grego.
- source_word: Κυρίου / τοῦ κυρίου
  choice: do Senhor
  rationale: “Senhor” é a tradução tradicional e natural de κύριος neste contexto religioso.
- source_word: ζήσονται
  choice: viverão
  rationale: Reproduz diretamente o futuro de ζάω em português natural.
- source_word: ἐν αὐτῷ
  choice: por ela
  rationale: O pronome retoma com maior probabilidade a “lei” mencionada imediatamente no versículo anterior; neste contexto, ἐν pode indicar o meio ou princípio segundo o qual se vive. O gênero masculino do pronome grego concorda com νόμος, embora “lei” seja feminino em português.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: É a expressão portuguesa idiomática correspondente à duração ilimitada indicada pela locução grega.
- source_word: παράδεισος
  choice: paraíso
  rationale: Preserva o tom elevado e a ressonância escatológica de παράδεισος.
- source_word: τὰ ξύλα τῆς ζωῆς
  choice: as árvores da vida
  rationale: Mantém explicitamente o plural τὰ ξύλα e verte a expressão de modo natural, apesar de a imagem bíblica mais conhecida aparecer muitas vezes no singular.
theological_decisions:
- issue: Referente de ἐν αὐτῷ
  choice: 'A lei mencionada no versículo anterior: “viverão por ela”'
  alternative: 'O Senhor: “viverão nele”'
  rationale: νόμος, “lei”, é o antecedente discursivo imediato e é masculino em grego, concordando com αὐτῷ. A alternativa que refere o pronome ao Senhor continua gramaticalmente possível e, por isso, é registrada em nota, sem transformar a leitura principal em afirmação inequívoca de união mística.
- issue: Força metafórica da segunda oração
  choice: 'Identificação sem verbo expresso: o paraíso e as árvores da vida são os fiéis do Senhor'
  alternative: O paraíso pertence aos fiéis, ou os fiéis estão no paraíso
  rationale: Os três grupos nominais estão no nominativo, sem verbo explícito. A identificação predicativa conserva melhor a metáfora poética e evita convertê-la em posse ou localização.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe poética preservada. O travessão explicita a aposição de “as árvores da vida” sem eliminar a construção identificacional deliberadamente tensa do original.
