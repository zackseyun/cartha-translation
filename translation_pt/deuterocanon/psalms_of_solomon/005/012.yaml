lexical_decisions:
- source_word: πεινάσωσιν
  choice: tiverem fome
  rationale: O aoristo do subjuntivo com ἐὰν expressa uma condição eventual; «se tiverem fome» é natural em português e não intensifica indevidamente o sentido.
- source_word: ἀροῦσιν
  choice: levantarão
  rationale: Futuro de αἴρω, «levantar/erguer». «Levantarão» preserva a imagem concreta da expressão de súplica ou dependência.
- source_word: πρόσωπον αὐτῶν
  choice: o rosto
  rationale: O grego emprega o singular «rosto» com possuidor plural. Essa construção também é clara e idiomática em português e conserva a forma coletiva do original.
- source_word: πρὸς σέ
  choice: para ti
  rationale: Expressa naturalmente a direção indicada por πρὸς e combina com «levantar o rosto», sem transformar a imagem em uma interpretação.
