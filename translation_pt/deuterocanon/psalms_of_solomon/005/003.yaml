  text: But if I cry out to you[a], do not be silent to me.
translation:
  language: pt
  text: Mas, se eu tiver clamado a ti[a], não te cales para comigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas, se eu clamar a ti, não passes por mim em silêncio”. O grego traz formalmente “se eu tiver clamado”.'
    reason: Registra a alternativa idiomática para o perfeito grego e o sentido de παρασιωπάω como passar alguém em silêncio, sem tratar essa explicitação como obrigatória.
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Mas, se
  rationale: Preserva a força condicional de ἐάν e a leve transição adversativa de δέ, com formulação natural em português.
- source_word: κεκραγέναι
  choice: eu clamar
  rationale: Embora seja formalmente um infinitivo perfeito de κράζω, a construção condensada com με tem sentido de apelo condicional. O futuro do subjuntivo após “se” expressa isso de modo idiomático, sem acentuar indevidamente um aspecto concluído.
- source_word: με
  choice: eu
  rationale: O acusativo με funciona como sujeito do infinitivo; na oração finita em português, corresponde naturalmente a “eu”.
- source_word: πρὸς σέ
  choice: a ti
  rationale: Em contexto de oração, expressa a direção pessoal do clamor. “A ti” mantém concisão, dignidade e proximidade com o grego.
- source_word: μὴ παρασιωπήσῃς
  choice: não guardes silêncio
  rationale: Conserva a imagem de silêncio presente no verbo, sem substituí-la pela interpretação mais ampla “não me ignores”.
- source_word: ἀπʼ ἐμοῦ
  choice: para comigo
  rationale: O sentido relacional de ἀπό com παρασιωπάω não se reproduz naturalmente como “de mim”. “Para comigo” comunica que o silêncio divino se dá em relação ao suplicante.
