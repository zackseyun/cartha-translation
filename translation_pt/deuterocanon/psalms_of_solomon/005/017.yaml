  text: Sobre toda a terra está a tua misericórdia, ó Senhor, com bondade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεός
  choice: misericórdia
  rationale: ἔλεος designa misericórdia ou compaixão demonstrada a quem necessita. “Misericórdia” preserva o peso nominal do grego sem acrescentar matizes pactuais não explícitos.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: sobre toda a terra
  rationale: Com ἐπί e o acusativo, a expressão indica extensão sobre a totalidade da terra. A formulação portuguesa mantém esse alcance universal e a imagem espacial do original.
- source_word: Κύριε
  choice: ó Senhor
  rationale: O vocativo Κύριε é vertido como invocação direta. “Ó Senhor” é natural em registro bíblico digno e deixa clara a força vocativa.
- source_word: χρηστότητι
  choice: em bondade
  rationale: χρηστότης pode denotar bondade, benignidade ou amabilidade. “Bondade” é clara e abrangente, e preserva a concisão da expressão preposicional.
- source_word: '[cópula implícita]'
  choice: está
  rationale: A oração grega não traz verbo expresso. “Está” fornece em português a cópula necessária e combina naturalmente com a construção espacial “sobre toda a terra”, sem transformar a afirmação em ação verbal mais específica.
