  text: Those who fear the Lord rejoiced in good things[a], and your goodness is upon Israel[c][b], your kingdom.
translation:
  language: pt
  text: Os que temem o Senhor alegraram-se com coisas boas[a], e a tua bondade está sobre Israel, no teu reino[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram alegrados em meio a bens” ou “foram alegrados com bênçãos”.'
    reason: lexical_alternative
  - marker: b
    text: A relação de “no teu reino” com a oração é incerta no grego. Também pode ser entendido como “por meio do teu reinado”; “reino” também pode significar “reinado”.
    reason: alternative_reading
lexical_decisions:
- source_word: ηὐφράνθησαν
  choice: alegraram-se
  rationale: O aoristo passivo pode significar literalmente “foram alegrados”, mas o uso em português exprime naturalmente o resultado com “alegraram-se”, sem perder o sentido celebrativo.
- source_word: οἱ φοβούμενοι Κύριον
  choice: os que temem o Senhor
  rationale: O particípio substantivado designa as pessoas caracterizadas pelo temor reverente a Deus; a formulação é natural e transparente em português.
- source_word: ἐν ἀγαθοῖς
  choice: com coisas boas
  rationale: A preposição ἐν pode assumir valor circunstancial ou instrumental. “Com coisas boas” conserva a amplitude de ἀγαθά sem especificá-las necessariamente como bênçãos.
- source_word: ἡ χρηστότης σου
  choice: a tua bondade
  rationale: “Bondade” preserva o sentido amplo de qualidade benévola e ação beneficente, sem o restringir a mera amabilidade.
- source_word: ἐπʼ Ἰσραήλ
  choice: está sobre Israel
  rationale: O verbo “está” é suprido naturalmente em português. “Sobre Israel” mantém a imagem da bondade divina repousando ou estendendo-se sobre o povo.
- source_word: τῇ βασιλείᾳ σου
  choice: no teu reino
  rationale: 'O dativo não concorda com o acusativo Ἰσραήλ e, portanto, não constitui uma aposição gramatical direta. A tradução principal entende o dativo como esfera: “no teu reino”.'
theological_decisions:
- issue: Relação sintática de τῇ βασιλείᾳ σου com a oração anterior
  choice: no teu reino
  alternative: por meio do teu reinado
  rationale: O dativo permite mais de uma relação semântica, sobretudo esfera ou meio. A tradução principal adota esfera, mas a nota preserva a possibilidade instrumental e o sentido dinâmico de βασιλεία como reinado.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantém-se o paralelismo poético e explicita-se apenas o verbo de ligação necessário em português.
