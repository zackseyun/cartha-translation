  yaml_path: translation/deuterocanon/psalms_of_solomon/005/014.yaml
  text: And you will hear[a], for who is kind and gentle but you[c][b], to gladden the soul of the humble when you open your hand in mercy?
translation:
  language: pt
  text: E tu ouvirás[a], pois quem é bondoso e clemente senão tu, para alegrar uma alma humilde[b], quando abres a tua mão com misericórdia?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “atenderás” ou “ouvirás favoravelmente”; o verbo pode indicar uma escuta que responde, especialmente à oração.
    reason: lexical_alternative
  - marker: b
    text: O grego fornecido traz uma forma que não concorda gramaticalmente com “alma”. Uma leitura genitiva, “a alma do humilde”, resolve a discordância, mas não é a forma apresentada no texto-fonte.
    reason: textual_note
  - marker: c
    text: “Abrir a mão” é uma imagem de dar ou prover generosamente.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπακούσῃ
  choice: ouvirás
  rationale: Mantém a imagem da escuta divina e deixa que o contexto de oração sugira uma escuta favorável e responsiva.
- source_word: χρηστός
  choice: bondoso
  rationale: Expressa a benevolência pessoal de Deus em linguagem corrente e digna.
- source_word: ἐπιεικής
  choice: clemente
  rationale: Comunica brandura, moderação e disposição misericordiosa sem reduzir o termo apenas a gentileza de maneiras.
- source_word: εὐφρᾶναι
  choice: para alegrar
  rationale: O infinitivo português preserva a ligação epexegética ou consecutiva do aoristo infinitivo grego.
- source_word: ψυχὴν ταπεινὸν
  choice: uma alma humilde
  rationale: Representa o sentido mais provável da expressão transmitida sem reproduzir a discordância gramatical de gênero do texto grego fornecido; a alternativa 'a alma do humilde' é registrada em nota.
- source_word: ἐν τῷ ἀνοῖξαι χεῖρά σου
  choice: quando abres a tua mão
  rationale: Conserva a imagem concreta e idiomática de provisão generosa, com construção natural em português.
- source_word: ἐν ἐλέει
  choice: com misericórdia
  rationale: Transmite o modo misericordioso da ação de forma idiomática, mantendo o registro devocional.
theological_decisions:
- issue: Relação de ταπεινὸν com ψυχὴν
  choice: uma alma humilde
  alternative: a alma do humilde
  rationale: O grego fornecido apresenta ταπεινὸν, formalmente discordante do feminino ψυχὴν, mas semanticamente aponta com naturalidade para uma alma humilde. A leitura genitiva ταπεινοῦ, refletida na alternativa, pode resultar de correção textual; por isso, não foi incorporada silenciosamente ao texto principal.
translation_notes:
  register: Português moderno, poético e devocional, de ampla compreensão internacional e leitura natural no Brasil. Mantêm-se a segunda pessoa do singular e a imagem concreta da mão aberta.
