lexical_decisions:
- source_word: λήψεται
  choice: tomará
  rationale: O futuro de λαμβάνω indica o ato de tomar ou receber; com σκῦλα, “tomará” expressa de modo direto a obtenção de bens capturados.
- source_word: σκῦλα
  choice: despojos
  rationale: O termo designa bens tomados do vencido. “Despojos” é claro e digno em português, enquanto “saque” permanece uma alternativa lexical possível.
- source_word: παρὰ
  choice: de
  rationale: Com o genitivo, παρά indica procedência ou origem; “de” reproduz naturalmente essa relação sem acrescentar a ideia não expressa de “das mãos de”.
- source_word: ἀνδρὸς δυνατοῦ
  choice: um homem poderoso
  rationale: ἀνήρ especifica um homem, e δυνατός comunica força ou poder. “Homem poderoso” preserva o masculino singular e a amplitude semântica do adjetivo.
theological_decisions:
- issue: Sujeito não expresso de λήψεται
  choice: ninguém
  alternative: ele não
  rationale: O verbo na terceira pessoa do singular não traz sujeito explícito e pode ter sentido indefinido neste enunciado proverbial. “Ninguém” evita introduzir um antecedente masculino inexistente, enquanto a nota preserva a leitura formalmente possível com “ele”.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A formulação mantém tom proverbial e digno; as notas registram tanto a alternativa lexical quanto a ambiguidade do sujeito grego.
