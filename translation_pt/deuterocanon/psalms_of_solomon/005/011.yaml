  text: You feed the birds and the fish[z], as you give rain to the desolate places for the sprouting of grass[a], to prepare fodder in the wilderness for every living thing.
translation:
  language: pt
  text: "Tu alimentas as aves e os peixes\n    ao dares chuva às regiões áridas[a],\n    para que a relva brote\n    e para preparar alimento no deserto para todo ser vivo."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando dás chuva às regiões áridas”.'
    reason: A construção grega pode indicar tanto circunstância temporal quanto meio.
lexical_decisions:
- source_word: πετεινὰ
  choice: aves
  rationale: O substantivo designa criaturas aladas, especialmente aves; “aves” é a equivalência portuguesa mais natural e direta no contexto.
- source_word: τρέφεις
  choice: alimentas
  rationale: τρέφω indica prover sustento ou nutrição. “Alimentas” preserva a imagem concreta da providência divina.
- source_word: ἐν τῷ διδόναι σὲ
  choice: ao dares
  rationale: A construção com infinitivo articular pode ter valor temporal ou instrumental. “Ao dares” é natural em português e mantém aberta, em alguma medida, essa relação; a alternativa temporal é registrada em nota.
- source_word: ἐρήμοις / ἐν ἐρήμῳ
  choice: às regiões áridas / no deserto
  rationale: As duas ocorrências remetem a lugares desertos ou ermos. A variação evita repetição pesada sem apagar a imagem comum de aridez.
- source_word: εἰς ἀνατολὴν χλόης
  choice: para que a relva brote
  rationale: ἀνατολή é literalmente o surgimento ou despontar; com χλόη, descreve a relva que nasce. A oração verbal comunica essa imagem com clareza em português moderno.
- source_word: χορτάσματα
  choice: alimento
  rationale: O plural se refere ao que serve de comida, pasto ou forragem. “Alimento” ajusta-se ao alcance amplo de “todo ser vivo” sem restringir a referência a animais domésticos.
- source_word: παντὶ ζῶντι
  choice: todo ser vivo
  rationale: A expressão é abrangente e inclui tudo quanto vive; “todo ser vivo” é conciso, digno e fiel.
theological_decisions:
- issue: Relação entre a dádiva da chuva e o sustento das criaturas
  choice: “ao dares chuva”
  alternative: “quando dás chuva” ou “por dares chuva”
  rationale: O grego permite leitura temporal ou instrumental. A formulação escolhida evita transformar essa flexibilidade sintática em uma afirmação teológica mais estreita sobre o modo da providência.
- issue: Valor de ἑτοιμάσαι
  choice: “e para preparar”
  alternative: “preparando”
  rationale: O infinitivo aoristo é melhor entendido como finalidade ou resultado pretendido da chuva e do brotar da relva; o infinitivo português preserva essa força sem especificar além do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A disposição poética acompanha o encadeamento da frase grega. “Relva” e “regiões áridas” mantêm um tom digno sem arcaísmo excessivo; “todo ser vivo” preserva o alcance universal da linha.
