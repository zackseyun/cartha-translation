  source_fidelity: 'A tradução acompanha de perto o grego: «aves e peixes» traduz τὰ πετεινὰ καὶ τοὺς ἰχθύας; «ao dares chuva» reproduz de modo adequadamente aberto o infinitivo articular ἐν τῷ διδόναι; «para que a relva brote» expressa bem εἰς ἀνατολὴν χλόης; e «para preparar alimento ... para todo ser vivo» conserva a finalidade de ἑτοιμάσαι e o alcance de παντὶ ζῶντι. «Alimento», embora singular coletivo e um pouco mais amplo que «forragem», é aceitável para χορτάσματα neste contexto universal.'
