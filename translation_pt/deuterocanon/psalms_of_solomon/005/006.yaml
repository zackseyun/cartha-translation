base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/005/006.yaml
  text: For man and his portion from you are in the balance[a]; he will not add so as to exceed your judgment[b], O God.
translation:
  language: pt
  text: Pois o ser humano e a sua porção, que vem de ti, estão numa balança[a]; ele nada acrescentará para ultrapassar o teu juízo[b], ó Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lit.: “o ser humano e a sua porção de ti estão numa balança”.'
    reason: A nota registra a construção compacta do grego, em que «de ti» qualifica a porção, e a imagem de uma balança sem artigo.
  - marker: b
    text: 'Ou: “ele não aumentará a ponto de exceder a tua decisão”.'
    reason: “Aumentar” e “decisão” representam alternativas possíveis para πλεονάσαι e κρίμα.
lexical_decisions:
- source_word: ἄνθρωπος
  choice: o ser humano
  rationale: O singular grego tem valor representativo e se refere à pessoa humana individual; esta forma preserva o singular de modo natural e inclusivo em português.
- source_word: μερὶς
  choice: a porção
  rationale: Expressa a parte ou medida atribuída a alguém e mantém a ligação com a imagem de pesagem.
- source_word: παρὰ σοῦ
  choice: que recebe de ti
  rationale: παρά com genitivo indica origem, 'de ti'. A explicitação verbal evita a sequência pouco natural 'sua porção de ti' sem converter a expressão em sentido locativo.
- source_word: ἐν σταθμῷ
  choice: na balança
  rationale: Preserva a metáfora concreta de pesagem e soa natural em português.
- source_word: οὐ προσθήσει
  choice: ele nada acrescentará
  rationale: Mantém o sentido literal de 'acrescentar'; 'nada' fornece em português o complemento implícito do verbo negado.
- source_word: τοῦ πλεονάσαι
  choice: para ultrapassar
  rationale: O infinitivo articulado indica o resultado ou propósito de acrescentar além da medida estabelecida.
- source_word: κρίμα
  choice: juízo
  rationale: Conserva o campo judicial e a ideia da decisão ou medida determinada por Deus, sem restringi-la a 'sentença' ou 'decreto'.
- source_word: ὁ θεός
  choice: ó Deus
  rationale: O nominativo grego funciona como vocativo na oração; 'ó Deus' é a forma portuguesa direta e dignificada.
theological_decisions:
- issue: Força genérica e singular de ἄνθρωπος
  choice: Traduzir por 'o ser humano' no singular
  alternative: Traduzir por 'o homem' ou 'a humanidade'
  rationale: A tradução conserva a referência singular representativa e sua retomada por 'ele', evitando tanto uma limitação ao sexo masculino quanto a transformação em coletivo abstrato.
- issue: Relação entre a porção humana e Deus em παρὰ σοῦ
  choice: 'Entender como origem: a porção é recebida de Deus'
  alternative: 'Entender como posição ou avaliação: ''diante de ti'''
  rationale: Com o genitivo σοῦ, παρά normalmente marca procedência. Isso também preserva a tensão do texto entre a dádiva divina, sua medida e o juízo de Deus.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A ordem e a metáfora do grego foram preservadas, enquanto 'que recebe' explicita apenas a relação de origem exigida por παρὰ com genitivo. Todos os marcadores de nota aparecem no texto principal.
