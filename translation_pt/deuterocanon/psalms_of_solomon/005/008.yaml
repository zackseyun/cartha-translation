translation:
  language: pt
  text: Não faças pesar a tua mão sobre nós, para que não pequemos por necessidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sob coação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαρύνῃς
  choice: faças pesar
  rationale: Conserva a imagem grega de tornar pesada a mão e soa natural em português, comunicando pressão ou aflição intensa sem explicitar além do texto.
- source_word: χεῖρά
  choice: mão
  rationale: Mantém a imagem concreta do original, que no uso bíblico também pode representar poder exercido ou castigo.
- source_word: ἐφʼ ἡμᾶς
  choice: sobre nós
  rationale: A preposição combina naturalmente com a imagem da mão que pesa e não restringe o sentido à hostilidade explícita.
- source_word: ἵνα μὴ
  choice: para que não
  rationale: Expressa de modo claro a relação de finalidade ou resultado pretendido, preservando a dependência da súplica anterior.
- source_word: διʼ ἀνάγκην
  choice: por necessidade
  rationale: Reproduz de perto a ideia de necessidade, constrangimento ou circunstância coerciva, sem decidir se a pressão é estritamente externa.
- source_word: ἁμάρτωμεν
  choice: pequemos
  rationale: O subjuntivo português corresponde naturalmente ao aoristo subjuntivo grego depois de ἵνα μή e mantém a ação subordinada à súplica.
theological_decisions:
- issue: Relação entre aflição, necessidade e pecado
  choice: Manter a afirmação de que a pressão da necessidade pode levar os suplicantes a pecar
  alternative: Reformular para indicar apenas uma tentação ou um risco abstrato
  rationale: O grego liga diretamente o peso da mão divina à possibilidade de pecado por necessidade; a tradução preserva essa tensão sem explicar a causalidade nem introduzir uma doutrina sobre responsabilidade moral.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção verbal natural no Brasil e inteligível internacionalmente. A imagem bíblica da mão pesada foi preservada, e a nota registra a nuance coerciva possível de ἀνάγκη.
