  text: But your gift is abundant in kindness and rich[b][a], and the hope in you will not be disappointed in the gift.
translation:
  language: pt
  text: Mas a tua dádiva é abundante em bondade e rica, e quem espera em ti não receberá uma dádiva concedida com parcimônia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego é condensado e elíptico. Também pode ser entendido como: “e aquele cuja esperança está em ti não poupará ao dar”, ou, tomando Deus como sujeito implícito: “e tu não pouparás ao conceder uma dádiva”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δόμα
  choice: dádiva
  rationale: Expressa aquilo que é dado e mantém o tom poético; no contexto, refere-se à concessão generosa de Deus.
- source_word: πολύ
  choice: abundante
  rationale: Comunica quantidade ou grandeza e se ajusta naturalmente ao contraste com a generosidade limitada dos seres humanos.
- source_word: μετὰ χρηστότητος
  choice: em bondade
  rationale: Preserva a qualidade benévola e graciosa que acompanha a dádiva, em português corrente e digno.
- source_word: πλούσιον
  choice: rica
  rationale: Mantém a imagem compacta do grego e, no contexto, indica plenitude e generosidade, não apenas riqueza material.
- source_word: ἡ ἐλπὶς ἐπὶ σέ
  choice: quem espera em ti
  rationale: A expressão grega é elíptica; a formulação pessoal torna o sentido inteligível em português sem eliminar a relação entre esperança e aquele que espera.
- source_word: οὐ φείσεται ἐν δόματι
  choice: não receberá com parcimônia
  rationale: O contexto apresenta Deus como doador e a pessoa necessitada como beneficiária. A formulação passiva em sentido evita fazer de quem espera o doador, embora a sintaxe grega comprimida permita outras análises.
theological_decisions:
- issue: Identidade do agente implícito em οὐ φείσεται ἐν δόματι
  choice: Entender quem espera em Deus como beneficiário de uma dádiva não concedida com parcimônia
  alternative: 'Entender quem espera em Deus como aquele que não poupa ao dar; ou tomar Deus como sujeito implícito: “ele não poupará ao dar”'
  rationale: Os versículos anteriores contrapõem a generosidade limitada dos seres humanos à abundância da dádiva divina. A tradução principal segue esse fluxo contextual, enquanto a nota preserva a ambiguidade sintática real.
translation_notes:
  register: Português moderno, claro e reverente, com leitura natural no Brasil e compreensão ampla no espaço lusófono. “Dádiva” preserva o caráter poético; “com parcimônia” reproduz a ideia de reter ou poupar sem recorrer a linguagem excessivamente coloquial.
