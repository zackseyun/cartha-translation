  text: When we are afflicted[a], we will call for help, and you will not turn away our plea[b], for you are our God.
translation:
  language: pt
  text: Quando formos afligidos[a], clamaremos a ti por socorro, e tu não rejeitarás a nossa súplica[b], pois tu és o nosso Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Em nossa aflição, clamaremos a ti por socorro.”'
    reason: lexical_alternative
  - marker: b
    text: “Nossa súplica” também pode ser traduzida como “nosso pedido” ou “nossa petição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ θλίβεσθαι ἡμᾶς
  choice: Quando formos afligidos
  rationale: A construção com ἐν e infinitivo articular tem valor temporal. A forma passiva “formos afligidos” preserva tanto a ideia de sofrimento quanto a possibilidade de pressão ou opressão externa, sem especificar sua causa.
- source_word: ἐπικαλεσόμεθα εἰς βοήθειαν
  choice: clamaremos por socorro
  rationale: O futuro médio indica um apelo direto em busca de auxílio. “Clamar por socorro” é corrente, expressa urgência e reproduz naturalmente o propósito indicado por εἰς βοήθειαν.
- source_word: οὐκ ἀποστρέψῃ
  choice: não rejeitarás
  rationale: Embora o verbo contenha a imagem de afastar-se ou voltar-se para longe, neste contexto seu efeito é o de não recusar o pedido. “Não rejeitarás” comunica isso com clareza em português moderno.
- source_word: τὴν δέησιν ἡμῶν
  choice: a nossa súplica
  rationale: δέησις designa um pedido insistente dirigido a Deus. “Súplica” conserva a intensidade e o registro de oração sem reduzir o termo a uma oração genérica.
- source_word: ὅτι σὺ ὁ θεὸς ἡμῶν εἶ
  choice: pois tu és o nosso Deus
  rationale: ὅτι apresenta a razão da confiança expressa. “Pois” mantém de forma natural a ligação causal, e o pronome “tu” conserva a ênfase do grego.
