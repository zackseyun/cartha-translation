  yaml_path: translation/deuterocanon/psalms_of_solomon/005/013.yaml
  text: You feed kings and rulers and peoples, O God; and You sustain kings and rulers and peoples, O God; and who is the hope of the poor and needy, if not you, Lord?
translation:
  language: pt
  text: Tu alimentas reis, governantes e povos, ó Deus; e qual é a esperança do pobre e do necessitado, senão tu, Senhor?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρέφεις
  choice: alimentas
  rationale: Expressa diretamente o sentido de prover alimento e sustento, sem duplicar o único verbo presente no grego.
- source_word: ἄρχοντας
  choice: governantes
  rationale: Termo natural e abrangente para autoridades dirigentes, distinto de βασιλεῖς, “reis”.
- source_word: λαοὺς
  choice: povos
  rationale: Mantém o plural do texto grego e sua referência coletiva.
- source_word: πτωχοῦ καὶ πένητος
  choice: do pobre e do necessitado
  rationale: Preserva os dois termos próximos, distinguindo pobreza de carência ou necessidade.
- source_word: ἡ ἐλπὶς τίς ἐστιν εἰ μὴ σύ
  choice: qual é a esperança... senão tu
  rationale: Reproduz a pergunta retórica e identifica o próprio Senhor, não apenas sua ajuda, como esperança.
theological_decisions:
- issue: Possível duplicação de provisão presente na camada inglesa
  choice: 'Traduzir uma única oração: “Tu alimentas reis, governantes e povos”'
  alternative: “Tu alimentas... e sustentas reis, governantes e povos”
  rationale: O texto grego fornecido contém apenas uma ocorrência de τρέφεις e não sustenta a repetição encontrada na consulta inglesa.
- issue: Tratamento do nome divino Κύριε
  choice: Senhor
  alternative: Yahweh
  rationale: Κύριε é a forma vocativa grega de κύριος; “Senhor” traduz o texto atestado sem retroverter para um nome hebraico não presente.
- issue: Número implícito em πτωχοῦ καὶ πένητος
  choice: 'Singular coletivo: “do pobre e do necessitado”'
  alternative: 'Plural: “dos pobres e necessitados”'
  rationale: Conserva o singular gramatical do grego, que pode representar genericamente cada pessoa pobre e necessitada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com emprego de “tu” coerente com o vocativo direto a Deus. A pontuação conserva as duas unidades do versículo e sua pergunta retórica.
