  text: And if you do not turn us back[a], we will not keep away[c][b], but we will come to you.
translation:
  language: pt
  text: E, se não nos fizeres voltar[a], não nos manteremos afastados[b], mas viremos a ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «nos restaurares» ou «nos reconduzires».
    reason: lexical_alternative
  - marker: b
    text: Ou «não nos absteremos» ou «não ficaremos longe».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν μὴ
  choice: se não
  rationale: Reproduz diretamente a condição negativa do grego, sem condensá-la em «a menos que».
- source_word: ἐπιστρέψῃς ἡμᾶς
  choice: nos fizeres voltar
  rationale: Preserva a construção causativa, com Deus como sujeito e «nós» como objeto, bem como a ideia de retorno, sem especificar se se trata de restauração, mudança espiritual ou retorno em outro sentido.
- source_word: οὐκ ἀφεξόμεθα
  choice: não nos manteremos afastados
  rationale: Expressa o valor médio de não se manter à distância ou não se abster, preparando com clareza o contraste com a ida até Deus.
- source_word: ἀλλʼ
  choice: mas
  rationale: Mantém de modo simples e digno o contraste adversativo do original.
- source_word: ἐπὶ σὲ ἥξομεν
  choice: viremos a ti
  rationale: Conserva a orientação pessoal para o destinatário e o sentido de chegar ou vir até ele.
theological_decisions:
- issue: Se ἐπιστρέψῃς deve receber linguagem explicitamente ligada à conversão ou à restauração
  choice: nos fizeres voltar
  alternative: nos restaurares; nos converteres
  rationale: O grego admite a ideia de restauração, especialmente em contexto sálmico, mas não exige que se resolva o retorno como conversão doutrinária ou restauração em sentido específico. A formulação escolhida conserva a imagem e a tensão do texto.
translation_notes:
  register: Português atual, digno e de cadência poética, com formas de segunda pessoa do singular adequadas à oração dirigida a Deus. A construção mantém a aparente tensão entre Deus fazê-los voltar e eles próprios se aproximarem dele.
