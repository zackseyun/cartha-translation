  text: Senhor Deus, louvarei o teu nome com júbilo, no meio dos que conhecem os teus justos julgamentos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε ὁ θεός
  choice: Senhor Deus
  rationale: Mantém a invocação divina e o título em aposição, numa formulação bíblica natural e digna em português.
- source_word: αἰνέσω
  choice: louvarei
  rationale: O futuro expressa a declaração ou resolução do salmista e é preservado diretamente.
- source_word: τῷ ὀνόματί σου
  choice: o teu nome
  rationale: Conserva o conhecido idioma bíblico referente à pessoa revelada e à reputação de Deus.
- source_word: ἐν ἀγαλλιάσει
  choice: com júbilo
  rationale: Expressa a maneira alegre e celebrativa do louvor em linguagem atual, concisa e elevada.
- source_word: ἐν μέσῳ
  choice: no meio de
  rationale: Preserva de perto a imagem espacial e o contexto comunitário do louvor.
- source_word: ἐπισταμένων
  choice: os que conhecem
  rationale: Representa naturalmente o particípio de ἐπίσταμαι, que pode significar conhecer ou compreender.
- source_word: τὰ κρίματά σου τὰ δίκαια
  choice: os teus justos julgamentos
  rationale: Mantém κρίματα como decisões ou atos judiciais de Deus e δίκαια como qualificação moral desses julgamentos.
