  text: Blessed is the one whom God remembers with measured sufficiency[a][b].
translation:
  language: pt
  text: Bem-aventurado aquele de quem Deus se lembra em justa medida de suficiência.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Bem-aventurado aquele de quem Deus se lembra em justa medida de contentamento».'
    reason: lexical_alternative
  - marker: b
    text: A palavra grega αὐτάρκεια também pode significar «contentamento» ou, mais literalmente, «autossuficiência».
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: Feliz
  rationale: É a fórmula tradicional de bem-aventurança nos salmos e, em português atual, comunica de modo claro a condição favorecida da pessoa sem exigir a construção mais solene «bem-aventurado».
- source_word: οὗ
  choice: aquele de quem
  rationale: O pronome relativo no genitivo é regido por μνημονεύει. «Aquele de quem Deus se lembra» preserva essa relação gramatical e soa natural em português.
- source_word: μνημονεύει
  choice: se lembra
  rationale: Expressa o sentido básico de recordar ou ter alguém em mente, permitindo também a conotação contextual de lembrança divina atuante e cuidadosa.
- source_word: ἐν συμμετρίᾳ
  choice: na medida certa
  rationale: συμμετρία indica proporção, medida adequada ou moderação. A expressão portuguesa comunica provisão apropriada, não excessiva.
- source_word: αὐταρκίας
  choice: o suficiente
  rationale: αὐτάρκεια pode significar suficiência, contentamento ou autossuficiência. No contexto em que Deus é o sujeito atuante, «o suficiente» comunica adequação sem sugerir independência humana em relação a Deus.
theological_decisions:
- issue: Sentido de αὐταρκίας em relação à ação de Deus
  choice: A lembrança de Deus se manifesta em conceder o suficiente na medida adequada.
  alternative: A frase pode enfatizar contentamento interior ou, mais literalmente, autossuficiência.
  rationale: A formulação principal mantém Deus como agente e evita a impressão de autonomia humana, mas as notas preservam a amplitude semântica e a sintaxe compacta do grego.
translation_notes:
  register: Português moderno, claro e digno, de leitura natural no Brasil e inteligível internacionalmente. A oração participial explicativa «dando-lhe» explicita com cautela a relação contextual entre a lembrança divina e a suficiência; as notas registram a construção mais formal e a ambiguidade lexical do grego.
