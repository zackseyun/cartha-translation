lexical_decisions:
- source_word: χρηστότης
  choice: bondade
  rationale: Neste provérbio, o termo designa a disposição benévola de uma pessoa. “Bondade” preserva a amplitude moral do grego, enquanto o contexto deixa perceber sua expressão prática.
- source_word: ἀνθρώπου
  choice: de um homem
  rationale: Mantém o singular proverbial e a forma masculina do grego, sem transformar a frase em uma afirmação coletiva.
- source_word: ἐν φειδῷ
  choice: é comedida
  rationale: Expressa limitação ou parcimônia sem impor a censura mais forte de “mesquinha”.
- source_word: αὔριον
  choice: fica para amanhã
  rationale: Torna natural em português a expressão grega elíptica, preservando a provável ideia de adiamento.
- source_word: δευτερώσῃ
  choice: a repetir
  rationale: Indica que a pessoa realiza novamente a bondade mencionada, sem acrescentar um objeto ausente do grego.
- source_word: γογγυσμοῦ
  choice: murmurar
  rationale: “Sem murmurar” reproduz de modo corrente e digno a ideia de queixa relutante.
- source_word: θαυμάσεις
  choice: você se admirará
  rationale: Mantém o futuro e a segunda pessoa do singular, com tom proverbial natural em português.
