  language: pt
  text: Pois tu és bondoso e misericordioso, o refúgio do pobre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρηστός
  choice: bondoso
  rationale: O adjetivo descreve uma bondade ativa e benevolente. “Bondoso” preserva esse calor relacional e concorda com o sujeito masculino indicado pelo grego.
- source_word: ἐλεήμων
  choice: misericordioso
  rationale: É a correspondência direta e tradicional, mantendo tanto o sentido de compaixão quanto o de exercer misericórdia.
- source_word: καταφυγή
  choice: refúgio
  rationale: Mantém a metáfora de um lugar ou meio de proteção, sem a tornar mais interpretativa com “protetor”.
- source_word: τοῦ πτωχοῦ
  choice: do pobre
  rationale: Reproduz o singular do grego e se encaixa naturalmente no registro poético dos salmos.
- source_word: ὅτι
  choice: Pois
  rationale: Introduz a explicação ou fundamento da declaração anterior e soa natural em português literário contemporâneo.
theological_decisions:
- issue: Relação sintática entre os adjetivos e “refúgio”
  choice: Os adjetivos “bondoso e misericordioso” qualificam o “tu”, enquanto “o refúgio do pobre” fica em aposição.
  alternative: “Pois o refúgio do pobre é bondoso e misericordioso.”
  rationale: No texto grego impresso, o pronome σύ é o sujeito, e os adjetivos χρηστός e ἐλεήμων estão no masculino; καταφυγή é feminino. Portanto, “refúgio” não pode ser o substantivo com o qual esses adjetivos concordam.
translation_notes:
  register: Português moderno, claro e digno, com leve cadência poética. Emprega-se “tu” por corresponder ao pronome grego explícito e ao discurso direto dirigido a Deus. A forma fornecida “ἐχρηστὸς” parece resultar da junção ou digitalização defeituosa de “σὺ χρηστός” na edição impressa de Swete.
