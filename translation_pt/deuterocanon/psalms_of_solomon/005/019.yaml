  text: If a man has an abundance[a], he sins.
translation:
  language: pt
  text: Se alguém tiver demais[a], peca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «tiver em excesso».'
    reason: Alternativa lexical mais literal para a ideia de possuir mais do que o suficiente.
lexical_decisions:
- source_word: ἐὰν
  choice: Se
  rationale: Introduz uma condição; «se» é a forma mais natural em português sem impor uma ideia habitual ou iterativa.
- source_word: ὑπερπλεονάσῃ
  choice: tiver em excesso
  rationale: O verbo indica ultrapassar a medida ou possuir mais do que o suficiente. A expressão mantém a noção de excesso sem interpretá-la como ganância.
- source_word: ὁ ἄνθρωπος
  choice: uma pessoa
  rationale: Nesta máxima condicional, o substantivo designa genericamente o ser humano. «Uma pessoa» comunica esse sentido de modo natural e abrangente no português atual.
- source_word: ἐξαμαρτάνει
  choice: peca
  rationale: Expressa aqui o sentido moral direto de cometer pecado; «peca» é conciso, claro e digno.
theological_decisions:
- issue: Se o excesso deve ser interpretado mais especificamente como ganância ou cobiça
  choice: 'Conservar a afirmação ampla sobre ter em excesso: «Se uma pessoa tiver em excesso, peca.»'
  alternative: Se uma pessoa tiver demais, peca.
  rationale: O grego relaciona diretamente excesso e pecado, mas não identifica explicitamente uma motivação interior como ganância. A tradução preserva essa tensão moral.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A formulação concisa preserva o caráter de máxima do original.
