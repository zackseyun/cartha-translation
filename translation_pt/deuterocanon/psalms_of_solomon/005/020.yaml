  text: Enough is a modest portion with righteousness, and in this is the Lord’s blessing—Enough is a modest portion with righteousness, and in this is the Lord’s blessing, for satisfaction in righteousness. in righteousness.
translation:
  language: pt
  text: Uma porção modesta, com justiça, basta; e nisso está a bênção do Senhor, para plenitude com justiça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκανὸν
  choice: Basta
  rationale: Expressa de modo natural a suficiência indicada pelo adjetivo grego usado de forma predicativa.
- source_word: τὸ μέτριον
  choice: uma porção modesta
  rationale: O substantivado μέτριον designa aquilo que é moderado ou comedido; “porção modesta” preserva o contexto de provisão sem sugerir miséria.
- source_word: ἐν δικαιοσύνῃ
  choice: com justiça
  rationale: Neste contexto, ἐν indica a qualidade ou circunstância moral que acompanha tanto a porção como a satisfação; “com justiça” é claro e mantém a repetição do grego.
- source_word: πλησμονὴν
  choice: plena satisfação
  rationale: O termo pode denotar plenitude, fartura ou saciedade. “Plena satisfação” conserva a ideia de suficiência satisfeita sem transformar necessariamente a bênção em riqueza abundante.
theological_decisions:
- issue: Relação entre moderação, justiça e bênção divina
  choice: Manter a afirmação de que uma porção modesta acompanhada de justiça basta e contém a bênção do Senhor.
  alternative: Traduzir πλησμονή como “abundância” e sugerir prosperidade material.
  rationale: O paralelismo contrasta implicitamente a suficiência justa com o excesso; “plena satisfação” evita impor uma teologia de prosperidade e preserva o sentido possível de saciedade.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura proverbial concisa. A repetição de “com justiça” reproduz a ênfase do original; o texto inglês fornecido apresenta duplicações aparentemente acidentais que não encontram apoio no grego.
