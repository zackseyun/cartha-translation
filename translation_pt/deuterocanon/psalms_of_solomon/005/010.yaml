  text: For if I am hungry[a], I will cry out to you, O God, and you will give to me.
translation:
  language: pt
  text: Pois, se eu tiver fome, clamarei a ti, ó Deus, e tu me darás[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “tu me darás”; o objeto não é expresso.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινάσω
  choice: eu tiver fome
  rationale: Com ἐὰν e o aoristo do subjuntivo, expressa uma possibilidade futura; “se eu tiver fome” é natural em português e preserva essa contingência.
- source_word: κεκράξομαι
  choice: clamarei
  rationale: “Clamar” conserva a intensidade de κράζω e se ajusta ao registro digno de uma oração, sem soar excessivamente coloquial.
- source_word: ὁ θεός
  choice: ó Deus
  rationale: Embora tenha forma nominativa com artigo, a expressão funciona como vocativo no grego bíblico; “ó Deus” explicita adequadamente a invocação direta.
- source_word: δώσεις μοι
  choice: tu me darás
  rationale: Mantém o sentido simples de “dar” e conserva a ausência do objeto no texto grego, em vez de explicitar interpretativamente aquilo que Deus dará.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e reverente, com sintaxe natural e leve tom poético. O pronome “tu” mantém a coerência da invocação direta e a forma verbal “me darás” preserva a abertura do original.
