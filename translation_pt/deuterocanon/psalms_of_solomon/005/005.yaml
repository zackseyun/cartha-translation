  rationale: A formulação torna explícito em português o objeto implícito de «receberá» e preserva a abrangência de πάντων.
- source_word: ἐὰν μὴ σὺ δῷς
  choice: se tu não o deres
  rationale: Mantém a condição do grego e a ênfase no pronome σὺ; «o» retoma naturalmente o «algo» expresso na oração anterior.
