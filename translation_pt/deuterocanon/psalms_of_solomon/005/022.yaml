  text: Blessed be the glory of the Lord, for he himself is our king.
translation:
  language: pt
  text: Bendita seja a glória do Senhor, pois ele mesmo é o nosso rei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογημένη
  choice: Bendita seja
  rationale: O adjetivo feminino concorda com «glória» e, com a cópula subentendida, forma uma expressão doxológica; «Bendita seja» preserva naturalmente em português a força de bênção e louvor.
- source_word: δόξα
  choice: glória
  rationale: É o equivalente mais direto e consagrado, capaz de expressar tanto o esplendor divino quanto a honra e o louvor associados ao Senhor.
- source_word: Κυρίου
  choice: do Senhor
  rationale: Traduz diretamente o grego κύριος; «Senhor» é a forma adequada aqui, sem empregar a convenção tipográfica reservada à representação do nome divino hebraico.
- source_word: ὅτι
  choice: pois
  rationale: Mantém o valor explicativo ou causal da conjunção e soa natural no registro doxológico da frase.
- source_word: αὐτὸς
  choice: ele mesmo
  rationale: Preserva o valor intensivo do pronome sem acrescentar a ideia de exclusividade que «ele somente» introduziria.
- source_word: βασιλεὺς
  choice: rei
  rationale: É o sentido básico e direto do substantivo, apropriado à confissão da realeza do Senhor.
- source_word: ἡμῶν
  choice: nosso
  rationale: Expressa de modo direto o genitivo possessivo da primeira pessoa do plural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência doxológica. Conserva-se a ênfase explícita de αὐτός em «ele mesmo» e a minúscula em «rei», conforme o uso comum para títulos predicativos.
