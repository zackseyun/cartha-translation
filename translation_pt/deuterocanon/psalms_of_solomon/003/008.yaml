  text: The righteous continually watches over his house[b][a], to remove wrongdoing in his transgression.
translation:
  language: pt
  text: O justo examina continuamente a sua casa[b], para remover o mal quando comete uma transgressão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em sua transgressão” ou “por causa de sua transgressão”.'
    reason: lexical_alternative
  - marker: b
    text: O versículo apresenta o justo examinando ativamente a própria casa e tratando do pecado, não agindo com descuido moral.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκέπτεται
  choice: examina
  rationale: No contexto da própria casa, o verbo indica supervisão atenta e avaliação ativa, não uma simples visita. “Examina” comunica essa diligência de modo natural.
- source_word: διὰ παντός
  choice: continuamente
  rationale: A expressão descreve uma ação constante ou habitual.
- source_word: ὁ δίκαιος
  choice: o justo
  rationale: Mantém o singular masculino do grego e apresenta a pessoa justa como exemplo moral individual, sem acrescentar o substantivo “homem”.
- source_word: τοῦ ἐξᾶραι
  choice: para eliminar
  rationale: O infinitivo articular expressa finalidade; “para eliminar” transmite com clareza a ideia de retirar o mal.
- source_word: ἀδικίαν
  choice: maldade
  rationale: Neste contexto moral e doméstico, o termo é mais amplo que injustiça social e designa aquilo que é moralmente errado.
- source_word: ἐν παραπτώματι αὐτοῦ
  choice: quando comete uma transgressão
  rationale: A construção grega é compacta e ambígua. Esta formulação entende ἐν como circunstancial ou temporal e faz do justo o referente natural de αὐτοῦ, enquanto a nota preserva alternativas mais formais e causais.
theological_decisions:
- issue: Se o versículo admite que o justo pode pecar
  choice: A tradução permite que o justo cometa uma transgressão e então aja para eliminar a maldade.
  alternative: Deixar indefinido de quem é a transgressão ou formular o texto como se o justo fosse incapaz de pecar.
  rationale: O possessivo αὐτοῦ refere-se mais naturalmente ao justo. A tradução preserva a tensão entre sua condição de justo e a possibilidade de transgressão, sem impor a ideia de perfeição sem pecado.
- issue: Relação expressa por ἐν em ἐν παραπτώματι αὐτοῦ
  choice: 'Relação circunstancial ou temporal: “quando comete uma transgressão”.'
  alternative: 'Relação locativa ou causal: “em sua transgressão” ou “por causa de sua transgressão”.'
  rationale: A leitura temporal produz português claro e é plausível no contexto, mas a nota registra as demais relações semânticas possíveis.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. “O justo” preserva a forma proverbial e o gênero gramatical do original; “examina” ressalta a supervisão deliberada. A ambiguidade da expressão final é mantida em nota.
