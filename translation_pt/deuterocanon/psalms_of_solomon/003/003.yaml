  yaml_path: translation/deuterocanon/psalms_of_solomon/003/003.yaml
  text: The righteous will remember the Lord continually[c][b][a], with thanksgiving and vindicating the judgments of the Lord.
translation:
  language: pt
  text: Os justos se lembrarão continuamente do Senhor, com ação de graças[a] e reconhecendo como justos os juízos do Senhor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «com louvor» ou «com confissão»; o termo grego pode expressar ação de graças, louvor ou confissão, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «na justificação» ou «na vindicação dos juízos do Senhor».
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοι
  choice: os justos
  rationale: O adjetivo substantivado designa aqueles que se caracterizam pela justiça; «os justos» é conciso, natural e preserva a força moral e religiosa do grego.
- source_word: μνημονεύσουσιν
  choice: se lembrarão
  rationale: O futuro expressa a lembrança contínua do Senhor. A construção pronominal é idiomática em português com o complemento introduzido por «de».
- source_word: διὰ παντός
  choice: continuamente
  rationale: A expressão idiomática indica constância, e «continuamente» preserva seu aspecto durativo.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: «Senhor» mantém o peso do título e seu uso consagrado na tradição bíblica grega.
- source_word: ἐν ἐξομολογήσει
  choice: com ação de graças
  rationale: No contexto dos salmos, ἐξομολόγησις frequentemente denota agradecimento ou confissão agradecida dirigida a Deus. «Ação de graças» distingue o termo da palavra mais genérica para louvor usada no versículo anterior, sem excluir as demais nuances, registradas em nota.
- source_word: δικαιώσει
  choice: reconhecendo como justos
  rationale: O substantivo indica justificação ou vindicação. Como seu objeto são os juízos do Senhor, a formulação comunica naturalmente que os justos afirmam ou reconhecem a justiça desses juízos.
- source_word: τὰ κρίματα τοῦ κυρίου
  choice: os juízos do Senhor
  rationale: κρίματα refere-se a decisões ou atos judiciais. «Juízos» conserva o sentido forense e o registro bíblico sem expandir indevidamente a expressão.
theological_decisions:
- issue: Sentido de δικαιώσει aplicado aos juízos do Senhor
  choice: reconhecendo como justos os juízos do Senhor
  alternative: na vindicação dos juízos do Senhor
  rationale: A tradução explicita a relação semântica de δικαιώσει com κρίματα, mas não afirma que os juízos necessitem ser tornados justos; indica que os justos reconhecem ou sustentam sua justiça. A alternativa mais formal é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Ação de graças» e «juízos» preservam o registro bíblico sem arcaísmo excessivo; a construção verbal em «reconhecendo como justos» torna inteligível a expressão nominal grega e sua força forense.
