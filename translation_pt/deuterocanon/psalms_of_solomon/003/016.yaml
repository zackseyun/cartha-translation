  text: But those who fear the Lord will rise to eternal life, and their life in the light of the Lord will never cease.
translation:
  language: pt
  text: Mas os que temem o Senhor ressuscitarão para a vida eterna, e a vida deles na luz do Senhor nunca terá fim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβούμενοι
  choice: os que temem
  rationale: O particípio substantivado designa um grupo caracterizado por uma atitude contínua diante de Deus. “Temem” preserva o peso bíblico do termo e é natural em português.
- source_word: κύριον / Κυρίου
  choice: o Senhor / do Senhor
  rationale: κύριος refere-se aqui a Deus; “Senhor” é a tradução direta e tradicional, sem introduzir a convenção tipográfica ligada ao nome hebraico YHWH.
- source_word: ἀναστήσονται
  choice: ressuscitarão
  rationale: O futuro médio pode significar “se levantarão”; neste contexto escatológico, seguido de “para a vida eterna”, “ressuscitarão” expressa naturalmente o sentido de levantar-se da morte sem converter a forma em passiva.
- source_word: εἰς ζωὴν αἰώνιον
  choice: para a vida eterna
  rationale: A preposição εἰς indica destino ou resultado; “para a vida eterna” é idiomático e conserva a força escatológica.
- source_word: ἐν φωτὶ Κυρίου
  choice: na luz do Senhor
  rationale: A tradução mantém diretamente a imagem e a relação preposicional do grego.
- source_word: οὐκ ἐκλείψει ἔτι
  choice: nunca terá fim
  rationale: ἐκλείπω pode significar falhar, cessar ou chegar ao fim. Referido à vida, “nunca terá fim” comunica com clareza sua continuidade permanente e representa naturalmente οὐκ ... ἔτι.
theological_decisions:
- issue: Linguagem de ressurreição em ἀναστήσονται εἰς ζωὴν αἰώνιον
  choice: “ressuscitarão para a vida eterna”, indicando diretamente uma futura ressurreição
  alternative: “se levantarão para a vida eterna”, que preservaria mais literalmente a amplitude lexical do verbo
  rationale: A combinação de ἀναστήσονται com “vida eterna” é mais naturalmente escatológica e aponta para a ressurreição, não apenas para renovação moral ou recuperação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação e as imagens do grego foram preservadas sem rigidez sintática.
