  text: And the Lord cleanses every devout man and his house[a][b][c].
translation:
  language: pt
  text: E o Senhor purifica todo homem piedoso[a] e a sua casa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “santo” ou “devoto”.
    reason: lexical_alternative
  - marker: b
    text: “Casa” também pode ter o sentido de família ou comunidade doméstica.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Senhor
  rationale: 'Mantém o título divino com artigo definido, segundo o uso natural em português: “o Senhor”.'
- source_word: καθαρίζει
  choice: purifica
  rationale: Preserva o aspecto presente do verbo e sua possível dimensão moral e ritual; “limpa” seria mais concreto e menos abrangente.
- source_word: πᾶν ἄνδρα
  choice: todo homem
  rationale: Reproduz o sentido distributivo de πᾶν com o substantivo masculino singular ἄνδρα, sem neutralizar a formulação explicitamente masculina do grego.
- source_word: ὅσιον
  choice: piedoso
  rationale: Expressa devoção e fidelidade religiosa em português atual e digno; “santo” é possível, mas pode sugerir sobretudo condição consagrada.
- source_word: τὸν οἶκον αὐτοῦ
  choice: a sua casa
  rationale: Conserva o sentido básico de οἶκος e a repetição lexical presente no contexto, ao mesmo tempo que “casa” em português pode abranger tanto a moradia quanto os que nela vivem.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego. “Todo homem piedoso” mantém a expressão distributiva e explicitamente masculina da fonte; “a sua casa” preserva a cadeia lexical do contexto e sua ambiguidade entre moradia e unidade doméstica.
