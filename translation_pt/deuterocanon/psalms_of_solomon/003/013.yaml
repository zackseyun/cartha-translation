  yaml_path: translation/deuterocanon/psalms_of_solomon/003/013.yaml
  text: He has fallen[a], because his fall is evil, and he will not rise. The destruction of the sinner is forever[b],
translation:
  language: pt
  text: Ele caiu, pois sua queda é terrível[a], e não se levantará. A destruição do pecador é para sempre,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sua queda é má”; também é possível: “seu cadáver é repugnante”.'
    reason: O adjetivo πονηρός pode significar mau, grave ou terrível, e o substantivo πτῶμα pode designar tanto uma queda/ruína quanto um cadáver.
lexical_decisions:
- source_word: ἔπεσεν
  choice: Ele caiu
  rationale: O pretérito perfeito traduz diretamente o aoristo e soa natural em português; o contexto e a sequência deixam clara a condição resultante.
- source_word: πονηρὸν τὸ πτῶμα αὐτοῦ
  choice: sua queda é terrível
  rationale: A associação de πτῶμα com ἔπεσεν favorece aqui o sentido de queda ou ruína. Nesse contexto, πονηρόν pode descrever algo grave, desastroso ou terrível, sem que se elimine em nota sua possível força moral nem a acepção de πτῶμα como cadáver.
- source_word: οὐκ ἀνιστήσεται
  choice: não se levantará
  rationale: Mantém a formulação direta e a finalidade severa do grego, sem acrescentar explicitamente 'de novo'.
- source_word: ἀπώλεια
  choice: destruição
  rationale: Termo claro e forte, adequado ao juízo retratado, sem o tom excessivamente eclesiástico de alternativas como 'perdição'.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: No contexto de juízo irreversível, esta é a expressão portuguesa corrente que melhor comunica duração permanente.
theological_decisions:
- issue: Possível alusão a ressurreição em οὐκ ἀνιστήσεται
  choice: não se levantará
  alternative: não ressuscitará
  rationale: A tradução preserva a imagem imediata de cair e levantar-se, sem transformar uma possível ressonância teológica em afirmação explícita.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe simples. A vírgula final foi mantida porque o versículo continua a frase na unidade seguinte.
