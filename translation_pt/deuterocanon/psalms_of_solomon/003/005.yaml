  yaml_path: translation/deuterocanon/psalms_of_solomon/003/005.yaml
  text: The righteous man is attentive and will declare the Lord just; The righteous man is attentive and will vindicate the Lord; he falls, and he looks to see what God will do for him., and he looks to see what God will do for him.
translation:
  language: pt
  text: O justo está atento e reconhecerá que o Senhor é justo[a]; ele cai e olha para ver o que Deus fará por ele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “declarará justo o Senhor”; literalmente, “justificará o Senhor”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o que Deus lhe fará”.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχων
  choice: permanece atento
  rationale: O particípio apresenta a atitude contínua e vigilante do justo. “Permanece atento” é natural em português e evita limitar o sentido a olhar físico.
- source_word: ὁ δίκαιος
  choice: o justo
  rationale: O adjetivo substantivado masculino singular designa a pessoa justa representativa; “o justo” é corrente, conciso e preserva a forma do grego.
- source_word: δικαιώσει
  choice: reconhecerá que ... é justo
  rationale: Com o Senhor como objeto, o verbo indica reconhecer, afirmar ou sustentar a justiça dele, não torná-lo justo. Esta formulação comunica o sentido sem recorrer ao menos acessível “vindicar”.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Tradução reverente e convencional de κύριος quando se refere a Deus.
- source_word: ἔπεσεν
  choice: ele cai
  rationale: Embora seja aoristo, o contexto descreve a conduta característica do justo; o presente gnômico em português harmoniza-se com “observa” e evita sugerir necessariamente um único acontecimento passado.
- source_word: ἀποβλέπει
  choice: observa
  rationale: Expressa o olhar dirigido e atento do justo, preservando sua expectativa sem acrescentar explicitamente a ideia de espera.
- source_word: τί ποιήσει αὐτῷ ὁ θεός
  choice: o que Deus fará por ele
  rationale: O dativo αὐτῷ pode ser benefactivo (“por ele”) ou mais neutro (“a ele”). O contexto favorece ligeiramente o sentido benefactivo, mas a ambiguidade é registrada em nota.
theological_decisions:
- issue: Se δικαιώσει descreve o justo como alguém que confere justiça ao Senhor ou que reconhece a justiça do Senhor
  choice: reconhecerá que o Senhor é justo
  alternative: declarará justo o Senhor; vindicará o Senhor; justificará o Senhor
  rationale: A tradução deixa claro que o ser humano reconhece ou afirma a justiça divina, sem sugerir que ele a produz, e a nota preserva uma formulação mais formal.
- issue: Se a ação divina indicada pelo dativo αὐτῷ é favorável ou simplesmente dirigida ao justo
  choice: por ele
  alternative: a ele
  rationale: O contexto imediato favorece a expectativa de auxílio, mas o grego não elimina a leitura neutra ou adversa; por isso, ela permanece em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a tensão do grego foram preservadas; evitou-se linguagem denominacional e o verbo técnico pouco corrente “vindicar” no texto principal.
