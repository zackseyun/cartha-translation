lexical_decisions:
- source_word: προσεθήκεν
  choice: Acrescentou
  rationale: O aoristo de προστίθημι tem o sentido básico de acrescentar. A escolha preserva a imagem verbal e permite que a expressão seguinte comunique a acumulação.
- source_word: ἁμαρτίας ἐφʼ ἁμαρτίαις
  choice: pecados sobre pecados
  rationale: Mantém os dois plurais deliberados do grego e reproduz de modo natural em português a ideia de acúmulo sucessivo.
- source_word: τῇ ζωῇ αὐτοῦ
  choice: à sua vida
  rationale: O dativo pode funcionar como complemento indireto de προσεθήκεν, indicando aquilo a que os pecados foram acrescentados. Esta leitura também preserva a possível ligação lexical com a referência à vida no versículo anterior.
theological_decisions:
- issue: Função do dativo τῇ ζωῇ αὐτοῦ
  choice: à sua vida
  alternative: em sua vida
  rationale: A construção admite alguma ambiguidade entre destinatário/complemento indireto e esfera. O texto principal segue a leitura gramatical de complemento indireto, enquanto a alternativa locativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e direto, com ampla legibilidade brasileira. O plural do original foi preservado, e evitou-se substituir “acrescentou” por uma paráfrase mais enfática, como “amontoou”.
