  text: A sinner stumbled[a], and he curses his life, the day of his birth and his mother’s labor pains.
translation:
  language: pt
  text: Um pecador tropeçou[a] e amaldiçoa sua vida, o dia de seu nascimento e as dores de parto de sua mãe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “caiu em desgraça”. O verbo grego pode indicar tanto um tropeço como, em sentido figurado, uma queda que leva à desgraça.
