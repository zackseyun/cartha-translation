lexical_decisions:
- source_word: προσέκοψεν
  choice: tropeçou
  rationale: Preserva a imagem vívida e o sentido primário de προσκόπτω, sem determinar se a queda figurada chegou à ruína completa.
- source_word: ἁμαρτωλός
  choice: um pecador
  rationale: Equivalente direto e natural do substantivo grego, sem explicitação interpretativa.
- source_word: καταρᾶται
  choice: amaldiçoa
  rationale: Expressa diretamente a força do verbo grego e rege naturalmente os objetos enumerados.
- source_word: ζωὴν αὐτοῦ
  choice: sua vida
  rationale: Tradução simples e fiel do objeto da maldição.
- source_word: τὴν ἡμέραν γενέσεως αὐτοῦ
  choice: o dia de seu nascimento
  rationale: Mantém de modo claro e solene a formulação do grego.
- source_word: ὠδῖνας μητρός
  choice: as dores de parto de sua mãe
  rationale: Preserva a imagem concreta do parto em português moderno e amplamente compreensível.
