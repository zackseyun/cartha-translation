  text: and he will certainly not be remembered when he visits the righteous[a][b][c].
translation:
  language: pt
  text: e certamente não será lembrado[a] quando se visitarem os justos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, entendendo o referente implícito como «a destruição», mencionada no contexto anterior: «e ela certamente não será lembrada». Entendendo-o como o pecador, pode-se traduzir: «e ele certamente não será lembrado». O grego não expressa o referente.'
    reason: alternative_reading
  - marker: b
    text: O verbo também pode ter o sentido de «voltar a atenção para» ou «cuidar de». O grego não expressa o sujeito de «visitar».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  choice: certamente não
  rationale: A dupla negação grega é enfática. “Certamente não” comunica essa força em português atual sem recorrer a uma formulação arcaica.
- source_word: μνησθήσεται
  choice: será lembrado
  rationale: A forma passiva é traduzida diretamente. O masculino segue a leitura principal em que o sujeito implícito é o pecador, sem esconder em nota a possível retomada de “destruição” no contexto anterior.
- source_word: ἐπισκέπτηται
  choice: visitar
  rationale: O verbo pode indicar visitar com atenção, voltar-se para alguém ou cuidar dele. “Visitar” permanece próximo do grego e conserva sua ressonância bíblica sem explicitar indevidamente a natureza da visita.
- source_word: δικαίους
  choice: os justos
  rationale: É uma tradução direta, natural e adequada ao contexto moral e religioso.
- source_word: sujeito implícito
  choice: ele
  rationale: A leitura principal entende que o sujeito de “será lembrado” é o pecador, em continuidade com seu destino descrito no contexto. Como o grego não expressa o pronome, a alternativa sintática é registrada em nota.
theological_decisions:
- issue: Referente do sujeito não expresso de μνησθήσεται
  choice: 'O pecador: “ele ... não será lembrado”'
  alternative: 'A destruição: “ela ... não será lembrada”'
  rationale: A leitura com o pecador produz o sentido bíblico coerente de que a memória do ímpio desaparece e acompanha a sequência contextual sobre seu destino. Contudo, o grego isoladamente não nomeia o sujeito, e “a destruição”, no contexto anterior, continua sendo uma possibilidade gramatical que deve permanecer visível.
- issue: Sujeito implícito de ἐπισκέπτηται
  choice: Mantido sem identificação explícita em “quando visitar”
  alternative: Explicitar o pecador, Deus ou outro agente contextual
  rationale: O grego não declara o sujeito do verbo. A tradução evita inserir “Deus” ou resolver uma possível mudança de sujeito sem apoio expresso no versículo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário bíblico corrente. A ordem e a concisão do grego foram preservadas. O pronome “ele” torna legível a interpretação principal, enquanto as ambiguidades reais dos sujeitos omitidos e o alcance semântico de “visitar” são mantidos nas notas.
