base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalms_of_solomon/003/007.yaml
  text: The truth of the righteous is from God their savior[b][a]; sin upon sin does not lodge in the house of a righteous man.
translation:
  language: pt
  text: A verdade[a] dos justos vem de Deus, seu Salvador; pecado sobre pecado não se aloja na casa de um justo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “A fidelidade” ou “A integridade”. Aqui, “verdade” pode designar o caráter verdadeiro, íntegro e fiel dos justos, e não apenas a verdade em sentido abstrato.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια
  choice: verdade
  rationale: Mantém o sentido lexical amplo do grego e evita restringi-lo à veracidade no falar. No contexto ético, pode também envolver fidelidade ou integridade, possibilidade registrada em nota.
- source_word: παρὰ θεοῦ
  choice: vem de Deus
  rationale: παρά com o genitivo indica fonte ou origem; “vem de Deus” expressa isso de modo natural em português.
- source_word: σωτῆρος αὐτῶν
  choice: seu Salvador
  rationale: σωτήρ significa “Salvador” ou “libertador”; o possessivo retoma o plural “os justos”, e “Salvador” preserva o registro religioso sem ampliar o sentido.
- source_word: οὐκ αὐλίζεται
  choice: não se aloja
  rationale: Preserva a imagem concreta de algo que encontra pousada ou permanência, sem reduzir o verbo simplesmente a “estar”.
- source_word: ἐν οἴκῳ δικαίου
  choice: na casa de um justo
  rationale: Mantém o singular masculino de δικαίου e traduz naturalmente a construção grega sem artigo.
- source_word: ἁμαρτία ἐφʼ ἁμαρτίαν
  choice: pecado sobre pecado
  rationale: Conserva a repetição enfática e a imagem de acumulação presente no original.
theological_decisions:
- issue: Amplitude ética de ἀλήθεια
  choice: verdade
  alternative: fidelidade; integridade
  rationale: O grego permite uma noção ética mais ampla do que mera veracidade, mas “verdade” preserva melhor a ambiguidade lexical, enquanto a nota informa as leituras contextuais possíveis sem impor uma interpretação covenantal específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção “pecado sobre pecado” e a metáfora “não se aloja” foram mantidas por sua força poética.
