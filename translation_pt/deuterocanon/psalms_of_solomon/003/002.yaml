  text: Sing a hymn and praise to God[a], the One worthy of praise. Sing, and keep watch for his watching[c][b], for a psalm to God from a good heart is good.
translation:
  language: pt
  text: Cantem um hino e um cântico de louvor a Deus, aquele que é digno de louvor.[a] Cante e mantenha-se vigilante em relação à vigilância dele,[b] pois um salmo dirigido a Deus, vindo de um coração bom, é bom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele que é louvado” ou “o Deus louvável”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão grega é incomum e também pode ser entendida como “mantenha-se vigilante para a vigilância dele” ou “esteja atento ao seu vigiar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕμνον καὶ αἶνον
  choice: um hino e um louvor
  rationale: Preserva os dois substantivos gregos e sua orientação de louvor, evitando reduzi-los a uma única ideia.
- source_word: ψάλλετε / ψάλλε
  choice: cantem / cante
  rationale: Mantém a mudança do imperativo plural para o singular presente no grego e expressa naturalmente o canto religioso.
- source_word: τῷ θεῷ τῷ αἰνετῷ
  choice: a Deus, aquele que é digno de louvor
  rationale: αἰνετός admite o sentido de 'louvado' ou 'digno de louvor'; a formulação escolhida é clara e preserva a força laudatória.
- source_word: γρηγόρησον ἐπὶ τὴν γρηγόρησιν αὐτοῦ
  choice: mantenha-se vigilante diante da vigilância dele
  rationale: Conserva a repetição cognata entre o verbo e o substantivo, bem como a formulação incomum do original, sem definir excessivamente a relação indicada por ἐπί.
- source_word: ψαλμός
  choice: salmo
  rationale: Mantém o caráter literário e cultual do termo no contexto.
- source_word: ἐξ ἀγαθῆς καρδίας
  choice: que vem de um coração bom
  rationale: Expressa a origem indicada por ἐξ em português natural e não intensifica ἀγαθός para 'puro' ou 'sincero'.
- source_word: ἀγαθὸς ... ἀγαθῆς
  choice: bom ... bom
  rationale: Preserva a repetição retórica deliberada do adjetivo grego.
