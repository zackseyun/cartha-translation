revisions:
- from: Cantem um hino e um louvor a Deus, aquele que é digno de louvor.[a] Cante e mantenha-se vigilante diante da vigilância dele,[b] pois é bom o salmo dirigido a Deus que vem de um coração bom.
  to: Cantem um hino e um cântico de louvor a Deus, aquele que é digno de louvor.[a] Cante e mantenha-se vigilante em relação à vigilância dele,[b] pois um salmo dirigido a Deus, vindo de um coração bom, é bom.
  rationale: A revisão melhora a legibilidade sem resolver a expressão grega incomum sobre a vigilância. Também reposiciona a expressão de origem («vindo de um coração bom») para que ela qualifique inequivocamente «salmo», como no grego, e emprega uma coordenação mais idiomática para os dois objetos de «cantem».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:34:04Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente os imperativos plural e singular, a dupla hino/louvor, a repetição de «bom» e a ambiguidade básica da expressão relativa à vigilância. Contudo, «diante da vigilância dele» atribui a ἐπί uma relação espacial específica que não está assegurada pelo grego incomum, e a oração relativa final pode, em português, ligar-se indevidamente a «Deus».
  naturalness: «Cantem um hino e um louvor» é compreensível, mas pouco idiomático no português moderno. «Um hino e um cântico de louvor» torna a coordenação natural sem suprimir a distinção do grego. A reformulação final elimina uma ambiguidade sintática portuguesa não pretendida.
  terminology: «Deus, aquele que é digno de louvor», «vigilante/vigilância», «salmo» e «coração bom» são escolhas adequadas. «Cântico de louvor» é uma explicitação moderada de αἶνος, preservando seu sentido de louvor cantado no paralelismo com ὕμνον.
  issues:
  - severity: medium
    issue: «diante da vigilância dele» restringe a relação de ἐπὶ τὴν γρηγόρησιν αὐτοῦ.
    rationale: A construção grega é reconhecidamente incomum; «diante de» introduz uma orientação espacial/face a que o texto não exige. Uma formulação relacional mais neutra preserva melhor a dificuldade do original.
  - severity: medium
    issue: A oração «que vem de um coração bom» pode modificar «Deus» em vez de «salmo».
    rationale: Embora o sentido provável se recupere pelo contexto, a proximidade sintática de «Deus» cria uma ambiguidade que não corresponde ao grego, em que ἐξ ἀγαθῆς καρδίας qualifica ψαλμός.
  - severity: low
    issue: «um hino e um louvor» é uma coordenação pouco natural após «cantem».
    rationale: «Louvor» normalmente funciona como nome não contável nesse uso. «Cântico de louvor» oferece um objeto cantável e conserva o segundo elemento de louvor.
  revised_text: Cantem um hino e um cântico de louvor a Deus, aquele que é digno de louvor.[a] Cante e mantenha-se vigilante em relação à vigilância dele,[b] pois um salmo dirigido a Deus, vindo de um coração bom, é bom.
