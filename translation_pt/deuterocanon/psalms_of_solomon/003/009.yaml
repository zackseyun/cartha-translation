  text: He makes atonement for unintentional sin by fasting and humbling his soul[c][b][a];
translation:
  language: pt
  text: Ele faz expiação[c] pelo pecado involuntário[a], jejuando e humilhando a sua alma[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pela falta cometida por ignorância” ou “pelo erro involuntário”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “humilhando a sua alma”, expressão bíblica que pode indicar negar-se a si mesmo ou afligir-se.
    reason: cultural_note
  - marker: c
    text: 'O verbo grego está no aoristo e também pode ser traduzido no passado: “Ele fez expiação”. Aqui, o presente o entende como descrição da conduta habitual do justo.'
    reason: textual_grammar
lexical_decisions:
- source_word: ἐξιλάσατο
  choice: faz expiação
  rationale: O verbo tem sentido cultual de expiar. O presente expressa adequadamente o valor gnômico do aoristo no contexto, que descreve a conduta habitual do justo.
- source_word: περὶ ἀγνοίας
  choice: pelo pecado involuntário
  rationale: No contexto cultual, ἀγνοία indica transgressão cometida por ignorância ou sem intenção, e não simples falta de conhecimento.
- source_word: ἐν νηστείᾳ
  choice: jejuando
  rationale: Expressa de modo natural o valor modal ou instrumental de ἐν com o substantivo ‘jejum’.
- source_word: καὶ ταπεινώσει ψυχὴν αὐτοῦ
  choice: e humilhando a sua alma
  rationale: Conserva a imagem bíblica e semítica de humilhar a alma, sem reduzi-la silenciosamente a uma expressão reflexiva genérica.
theological_decisions:
- issue: Valor expiatório do jejum e da humilhação
  choice: Preservar a formulação de que ele faz expiação jejuando e humilhando a alma
  alternative: Atenuar para ‘busca perdão’ ou ‘se arrepende’
  rationale: O grego emprega explicitamente ἐξιλάσατο e liga a ação ao jejum e à humilhação da alma; a tradução não deve substituir essa tensão cultual por uma interpretação teológica posterior.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente naturalizada, mas a linguagem cultual de ‘expiação’ e a expressão concreta ‘humilhando a sua alma’ foram preservadas.
