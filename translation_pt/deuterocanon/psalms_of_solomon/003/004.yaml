  text: The righteous man will not disdain being disciplined by the Lord[c][b][a]; his delight is continually before the Lord.
translation:
  language: pt
  text: O justo não desprezará ser disciplinado pelo Senhor[a]; seu prazer está continuamente diante do Senhor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego fornecido traz as formas incomuns e discordantes δίκαιας παιδευόμενους. A tradução segue o sentido provável de δίκαιος παιδευόμενος, “o justo, sendo disciplinado”. Se as formas fornecidas forem mantidas, a oração também pode ser entendida: “O favor dele não negligenciará os justos quando forem disciplinados pelo Senhor”.'
    reason: textual_variant
  - marker: b
    text: 'Ou: “seu agrado”. O grego não torna totalmente explícito se o possessivo se refere ao justo ou ao Senhor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλιγωρήσει
  choice: desprezará
  rationale: O verbo pode significar tratar como coisa de pouca importância, desconsiderar ou menosprezar. “Desprezará” exprime naturalmente essa atitude no contexto da disciplina e preserva o futuro do grego.
- source_word: δίκαιας παιδευόμενους
  choice: o justo ... ser disciplinado
  rationale: As formas transmitidas são gramaticalmente discordantes entre si. A tradução principal segue o sentido provável, refletido pela leitura δίκαιος παιδευόμενος, sem ocultar no texto crítico a dificuldade da forma fornecida.
- source_word: παιδευόμενους
  choice: ser disciplinado
  rationale: παιδεύω designa formação corretiva, não apenas ensino. “Ser disciplinado” mantém tanto o aspecto formativo quanto o corretivo.
- source_word: εὐδοκία
  choice: prazer
  rationale: “Prazer” comunica aqui satisfação, agrado ou disposição favorável em português corrente e digno. O possessivo “seu” conserva a possível ambiguidade do referente.
- source_word: διὰ παντός
  choice: continuamente
  rationale: A expressão indica duração constante; “continuamente” preserva esse valor e o tom elevado.
- source_word: ἔναντι Κυρίου
  choice: diante do Senhor
  rationale: Tradução formal e natural que conserva a imagem relacional e espacial do grego.
- source_word: κυρίου / Κυρίου
  choice: Senhor
  rationale: Nos dois casos, κύριος refere-se a Deus. “Senhor” preserva o uso bíblico habitual e a repetição do original.
theological_decisions:
- issue: Referente de αὐτοῦ em ἡ εὐδοκία αὐτοῦ
  choice: “seu prazer”, sem explicitar o referente
  alternative: “o prazer do justo” ou “o agrado do Senhor”
  rationale: O pronome grego admite tensão referencial no contexto. O possessivo português evita impor uma identificação não inteiramente segura.
- issue: Sentido da primeira oração diante das formas transmitidas
  choice: O justo não despreza a disciplina recebida do Senhor
  alternative: O favor dele não negligenciará os justos quando forem disciplinados pelo Senhor
  rationale: A leitura principal corresponde ao sentido contextual provável e à formulação com nominativos δίκαιος παιδευόμενος atestada na revisão textual; a tradução alternativa permanece registrada em nota por causa das formas δίκαιας παιδευόμενους fornecidas como texto-fonte.
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” mantém a continuidade do uso bíblico para Deus sem acrescentar interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A construção “ser disciplinado” evita arcaísmos como “ser castigado” ou “ser admoestado”, e as notas preservam a dificuldade textual e a ambiguidade pronominal sem sobrecarregar o versículo.
