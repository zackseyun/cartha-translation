- source_word: ἀποσκοπεύει
  choice: fica atento para ver
  rationale: Expressa um olhar atento e contínuo, com expectativa, em português natural, sem reduzir o verbo a uma observação casual.
- source_word: ὅθεν
  choice: de onde
  rationale: Preserva de modo idiomático a ideia de origem ou procedência.
- source_word: ἥξει
  choice: virá
  rationale: Reproduz diretamente o futuro de ἥκω e combina naturalmente com 'salvação'.
- source_word: σωτηρία
  choice: salvação
  rationale: É o equivalente mais amplo e apropriado ao registro religioso; 'livramento' continua sendo uma alternativa contextual possível.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome dativo mantém de forma concisa a relação de direção ou benefício, sem decidir rigidamente entre 'a ele' e 'para ele'.
