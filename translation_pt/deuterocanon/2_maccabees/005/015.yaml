  yaml_path: translation/deuterocanon/2_maccabees/005/015.yaml
  text: But not satisfied with these things[a], he even dared to enter the most holy temple in all the earth, with Menelaus as his guide, the one who had become a traitor both to the laws and to his homeland,
translation:
  language: pt
  text: Mas, não satisfeito com essas coisas, ele chegou a ousar entrar no templo mais santo de toda a terra[a], tendo Menelau como guia, que se havia tornado traidor tanto das leis como de sua pátria,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no templo mais santo de toda a região”. A palavra grega γῆ pode significar tanto “terra” como “região” ou “país”.
    reason: Alternativa lexical para γῆ; preserva sua ambiguidade sem atribuir a ἱερόν ou a ἁγιώτατον uma variação inexistente.
lexical_decisions:
- source_word: οὐκ ἀρκεσθεὶς δὲ τούτοις
  choice: Mas, não satisfeito com essas coisas
  rationale: Preserva o particípio que retoma os atos anteriores e introduz a escalada narrativa; a formulação é clara e natural em português.
- source_word: κατετόλμησεν
  choice: chegou a ousar
  rationale: Expressa a audácia censurável do verbo e ressalta que a ação representa um agravamento dos ultrajes anteriores.
- source_word: πάσης τῆς γῆς
  choice: de toda a terra
  rationale: Mantém no texto principal o alcance universalizante mais provável da afirmação, sem eliminar a possibilidade lexical de γῆ significar uma terra ou região específica.
- source_word: ἁγιώτατον ἱερὸν
  choice: o templo mais santo
  rationale: Reproduz o superlativo ἁγιώτατον e traduz ἱερόν por um termo comum, solene e adequado ao complexo sagrado.
- source_word: ὁδηγὸν ἔχων τὸν Μενέλαον
  choice: tendo Menelau como guia
  rationale: Representa de modo natural a construção participial e deixa claro o papel ativo de Menelau na entrada.
- source_word: προδότην γεγονότα
  choice: havia se tornado traidor
  rationale: O perfeito participial apresenta uma condição resultante de ações anteriores; “havia se tornado” conserva essa dimensão temporal.
- source_word: τῶν νόμων
  choice: das leis
  rationale: Mantém o plural explícito do grego, referente às leis ancestrais.
- source_word: τῆς πατρίδος
  choice: de sua pátria
  rationale: “Pátria” transmite de maneira concisa e digna o vínculo de Menelau com sua terra e seu povo.
theological_decisions:
- issue: Terminologia do templo e alcance da declaração de santidade
  choice: o templo mais santo de toda a terra
  alternative: o santuário mais santo de toda a região
  rationale: A tradução conserva a afirmação superlativa sobre a santidade do templo e deixa a ambiguidade de γῆ registrada em nota, sem restringir silenciosamente o sentido à Judeia.
