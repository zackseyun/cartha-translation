base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/024.yaml
  text: But he sent Apollonius[a], the chief polluter, with an army of twenty-two thousand, commanding him to slaughter all those in their prime and to sell the women and the younger ones.
translation:
  language: pt
  text: Mas ele enviou Apolônio, o principal profanador, com um exército de vinte e dois mil, ordenando-lhe que massacrasse todos os que estavam no vigor da idade e vendesse as mulheres e os mais jovens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, explicitando o sentido provável no contexto: “vendesse para a escravidão”. O grego diz simplesmente “vendesse”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεμψεν
  choice: enviou
  rationale: Equivalente corrente e fiel do aoristo de πέμπω, sem acrescentar nuance técnica.
- source_word: μυσάρχην
  choice: o chefe da profanação
  rationale: Preserva o caráter pejorativo do termo raro, formado em torno da ideia de contaminação ou profanação, sem transformá-lo em título oficial.
- source_word: μετὰ στρατεύματος
  choice: com um exército
  rationale: στράτευμα designa uma força militar; “exército” é natural diante do contingente numeroso mencionado.
- source_word: δισμυρίους δὲ τοῖς δισχιλίοις
  choice: vinte e dois mil
  rationale: A expressão soma literalmente vinte mil e dois mil; a forma numérica consolidada é mais natural em português.
- source_word: προστάξας
  choice: ordenando-lhe
  rationale: O particípio indica a ordem dada a Apolônio e liga-se com clareza ao verbo principal.
- source_word: τοὺς ἐν ἡλικίᾳ πάντας
  choice: todos os que estavam no vigor da idade
  rationale: A expressão aponta para pessoas em idade plena ou no auge das forças, sem definir de modo indevido uma categoria jurídica de adultos.
- source_word: κατασφάξαι
  choice: massacrasse
  rationale: O verbo composto expressa matança violenta e indiscriminada, com força maior que o simples “matar”.
- source_word: τὰς δὲ γυναῖκας
  choice: as mulheres
  rationale: No contraste entre os grupos visados, γυναῖκας tem o sentido amplo de “mulheres”, não especificamente “esposas”.
- source_word: τοὺς νεωτέρους
  choice: os mais jovens
  rationale: Mantém a forma comparativa do grego e evita restringir o grupo a crianças ou rapazes.
- source_word: πωλεῖν
  choice: vendesse
  rationale: Traduz diretamente o verbo “vender”; o contexto torna provável a venda como escravos, mas isso não está lexicalmente explícito.
theological_decisions:
- issue: Explicitar ou não a escravidão implícita em πωλεῖν
  choice: vendesse
  alternative: vendesse como escravos
  rationale: O contexto de conquista indica com grande probabilidade a escravização, mas o grego diz apenas “vender”. A tradução principal conserva essa concisão, e a nota esclarece a implicação histórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “chefe da profanação” conserva o epíteto insultuoso e incomum do grego; “no vigor da idade” mantém a amplitude da expressão etária sem impor uma faixa precisa.
