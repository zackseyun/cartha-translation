  source_fidelity: A tradução comunica corretamente a exaltação presunçosa de Antíoco, sua incapacidade de discernir a ira temporária do Soberano em razão dos pecados dos moradores e a consequente πάρορασις em relação ao lugar. “O lugar ficou desatendido”, porém, torna mais concreta e passiva uma construção grega impessoal e abstrata (“houve negligência/um passar por alto em relação ao lugar”).
  naturalness: “Se encheu de arrogância em sua mente” soa redundante e pouco idiomático em português moderno. “Se ensoberbeceu em seu modo de pensar” conserva a referência explícita à διάνοια e flui melhor. “Houve negligência em relação ao lugar” é uma formulação clara e mantém a impessoalidade do grego.
  terminology: “Soberano” é uma boa opção para δεσπότης e preserva adequadamente a distinção de κύριος (“Senhor”). “Habitantes da cidade” é natural e fiel. A nota sobre o santuário deve continuar identificada como provável explicação contextual, não como conteúdo explícito do termo grego.
