base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/017.yaml
  text: And Antiochus became arrogant in mind[a], not perceiving that the Master had been angered for a little while because of the sins of those dwelling in the city[c][b]; therefore there came to be disregard for the place.
translation:
  language: pt
  text: Antíoco se ensoberbeceu em seu modo de pensar[a], sem perceber que o Soberano[b] havia se irado por breve tempo por causa dos pecados dos habitantes da cidade; por isso, houve negligência em relação ao lugar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “teve a mente elevada” ou “ficou ensoberbecido em seus pensamentos”. A expressão grega descreve a arrogante exaltação de Antíoco.
    reason: lexical_alternative
  - marker: b
    text: “Soberano” traduz o grego despótēs, título diferente de kýrios (“Senhor”).
    reason: lexical_alternative
  - marker: c
    text: Ou “houve um passar por alto em relação ao lugar” ou “o lugar foi deixado de lado”. Provavelmente se refere à exposição temporária do santuário à profanação.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμετεωρίζετο τὴν διάνοιαν
  choice: se encheu de arrogância em sua mente
  rationale: A expressão grega evoca elevação e, neste contexto, descreve a exaltação presunçosa de Antíoco. A formulação comunica o sentido idiomático sem apagar a referência explícita à mente.
- source_word: οὐ συνορῶν
  choice: sem perceber
  rationale: O particípio indica que Antíoco não discernia a verdadeira razão dos acontecimentos; “perceber” conserva tanto o aspecto cognitivo quanto o perceptivo.
- source_word: ἀπώργισται
  choice: havia se irado
  rationale: O perfeito expressa um estado de ira resultante de provocação anterior. A forma pronominal é natural em português e evita tornar a construção artificialmente passiva.
- source_word: βραχέως
  choice: por breve tempo
  rationale: Preserva a limitação temporal da ira divina, elemento importante do argumento do versículo.
- source_word: ὁ δεσπότης
  choice: o Soberano
  rationale: “Soberano” comunica autoridade absoluta e mantém distinção lexical em relação a κύριος, normalmente traduzido por “Senhor”.
- source_word: πάρορασις
  choice: ficou desatendido
  rationale: O substantivo denota o ato de passar por alto, não atender ou negligenciar. A expressão portuguesa indica a exposição temporária do lugar sem afirmar abandono definitivo nem explicitar um mecanismo ausente do grego.
- source_word: περὶ τὸν τόπον
  choice: o lugar
  rationale: Mantém a designação ampla do grego, embora o contexto aponte para o lugar sagrado ou santuário.
- source_word: τῶν τὴν πόλιν οἰκούντων
  choice: dos habitantes da cidade
  rationale: Formulação corrente e fiel para a expressão participial que liga os pecados dos moradores à ira temporária.
theological_decisions:
- issue: Título divino δεσπότης
  choice: o Soberano
  alternative: o Senhor; o Mestre
  rationale: A escolha preserva a ideia de autoridade absoluta e evita nivelar δεσπότης com κύριος. “Mestre” poderia sugerir sobretudo um professor em português moderno, enquanto “Soberano” funciona naturalmente como título divino.
- issue: Exposição temporária do lugar sagrado
  choice: o lugar ficou desatendido
  alternative: houve negligência para com o lugar; o lugar foi deixado de lado
  rationale: 'A redação conserva a tensão do texto: o êxito de Antíoco decorre de uma condição temporária relacionada aos pecados da cidade, sem indicar impotência divina nem definir exatamente como ocorreu essa falta de atendimento.'
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. “Soberano” preserva a distinção do título grego sem a possível associação pedagógica de “Mestre”. “Ficou desatendido” evita o tom excessivamente moral de “descaso” e a força definitiva de “abandono”.
