revisions:
- from: Antíoco se encheu de arrogância em sua mente[a], sem perceber que o Soberano[b] havia se irado por breve tempo por causa dos pecados dos habitantes da cidade; por isso, o lugar ficou desatendido[c].
  to: Antíoco se ensoberbeceu em seu modo de pensar[a], sem perceber que o Soberano[b] havia se irado por breve tempo por causa dos pecados dos habitantes da cidade; por isso, houve negligência em relação ao lugar[c].
  rationale: A revisão melhora a naturalidade de português sem eliminar a menção grega à disposição mental de Antíoco. Também substitui a formulação passiva e mais específica “o lugar ficou desatendido” por uma construção impessoal que reproduz melhor πάρορασις e não define além do texto quem negligenciou o lugar ou de que modo isso se deu.
