base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/009.yaml
  text: He who had made many exiles from their homeland perished in a foreign land[b][a], having gone up to the Lacedaemonians as though he would obtain protection because of the kinship.
translation:
  language: pt
  text: Aquele que havia expulsado muitos de sua pátria morreu em terra estrangeira, tendo sido levado aos lacedemônios[a], como se fosse obter proteção por causa do parentesco.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos espartanos”. “Lacedemônios” reproduz mais literalmente o nome étnico grego.
    reason: lexical_alternative
  - marker: b
    text: O “parentesco” provavelmente se refere à tradicional relação de parentesco entre os judeus e os espartanos, mencionada em outros textos (compare 1 Macabeus 12:6–23).
    reason: cross_reference
lexical_decisions:
- source_word: συχνοὺς
  choice: muitos
  rationale: O adjetivo substantivado designa numerosas pessoas; “muitos” é natural em português e evita acrescentar uma especificação de gênero ausente do grego.
- source_word: τῆς πατρίδος
  choice: de sua pátria
  rationale: πατρίς indica a terra natal. “Pátria” mantém de modo conciso o contraste intencional com a terra estrangeira.
- source_word: ἀποξενώσας
  choice: havia expulsado
  rationale: Com τῆς πατρίδος, o verbo causativo descreve tornar pessoas estrangeiras à própria pátria, isto é, afastá-las ou expulsá-las dela. A formulação comunica claramente o exílio imposto.
- source_word: ἐπὶ ξένης
  choice: em terra estrangeira
  rationale: A expressão contrasta diretamente com “pátria” e ressalta a ironia de ele próprio morrer longe de sua terra.
- source_word: ἀπώλετο
  choice: morreu
  rationale: O aoristo médio de ἀπόλλυμι pode significar perecer ou morrer. “Morreu” é claro e natural, sem acrescentar a ideia de execução ou destruição por um agente.
- source_word: πρὸς Λακεδαιμονίους
  choice: para junto dos lacedemônios
  rationale: Preserva o nome étnico grego e o sentido relacional de πρός; “espartanos” é oferecido em nota como equivalente mais conhecido.
- source_word: ἀναχθεὶς
  choice: depois de partir
  rationale: O particípio pode descrever ser conduzido, dirigir-se ou partir, inclusive por viagem marítima. O contexto não exige coerção; a tradução neutra preserva a ambiguidade do deslocamento.
- source_word: ὡς ... τευξόμενος σκέπης
  choice: na esperança de obter proteção
  rationale: ὡς com o particípio futuro exprime a expectativa ou intenção do sujeito, e τυγχάνω com o genitivo significa obter; σκέπη denota abrigo ou proteção.
- source_word: διὰ τὴν συγγένειαν
  choice: por causa do parentesco
  rationale: A expressão alude a uma relação de origem comum considerada conhecida, sem que o grego a qualifique explicitamente como real ou apenas alegada.
theological_decisions:
- issue: Natureza do parentesco entre judeus e lacedemônios
  choice: “por causa do parentesco”, sem qualificá-lo no texto principal
  alternative: “por causa do suposto parentesco” ou “por causa do parentesco entre eles”
  rationale: O grego menciona o parentesco de forma definida, mas não o chama de alegado nem identifica expressamente as partes. A explicação histórica fica na nota, preservando a formulação e a tensão da fonte.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção enfatiza o contraste retórico entre expulsar outros da pátria e morrer em terra estrangeira. As notas aparecem na ordem em que seus referentes surgem no texto.
