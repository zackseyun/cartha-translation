revisions:
- from: Aquele que havia expulsado muitos de sua pátria morreu em terra estrangeira, depois de partir para junto dos lacedemônios[a], na esperança de obter proteção por causa do parentesco.[b]
  to: Aquele que havia expulsado muitos de sua pátria morreu em terra estrangeira, tendo sido levado aos lacedemônios[a], como se fosse obter proteção por causa do parentesco.[b]
  rationale: A revisão restaura a voz passiva de ἀναχθείς com «tendo sido levado», sem especificar se o deslocamento foi coercitivo, e traduz ὡς com o particípio futuro por «como se fosse obter». Mantêm-se o contraste retórico, o nome étnico mais literal e a ambiguidade da tradição de parentesco.
