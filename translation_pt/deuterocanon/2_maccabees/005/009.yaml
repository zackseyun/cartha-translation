review_pass:
  verdict: revise
  source_fidelity: A primeira oração transmite bem o contraste entre expulsar muitos da pátria e morrer em terra estrangeira. Contudo, «depois de partir» torna ativo o particípio passivo ἀναχθείς e elimina a nuance de ter sido levado/conduzido aos lacedemônios. Além disso, «na esperança de» suaviza o valor de ὡς com particípio futuro («como se fosse obter»).
  naturalness: O português é claro e de registro adequado. «Tendo sido levado aos lacedemônios» é natural, conserva a voz passiva e evita sugerir coerção mais específica do que o grego exige.
  terminology: «Pátria», «terra estrangeira», «lacedemônios», «proteção» e «parentesco» são escolhas fiéis e adequadas. A nota lexical para «espartanos» é útil. A nota histórica deve deixar claro que se trata de uma tradição de parentesco, sem qualificá-la no texto principal.
  issues:
  - severity: medium
    issue: «depois de partir» não preserva a voz de ἀναχθείς.
    rationale: ἀναχθείς é particípio aoristo passivo. Embora o modo concreto de deslocamento permaneça discutível, a tradução deve conservar que o sujeito foi levado ou conduzido, e não simplesmente que partiu por iniciativa própria.
  - severity: low
    issue: «na esperança de obter» reduz a força comparativa/aparente de ὡς ... τευξόμενος.
    rationale: «Como se fosse obter proteção» reproduz mais diretamente a apresentação da finalidade ou expectativa atribuída ao sujeito, sem afirmar que a proteção seria de fato obtida.
