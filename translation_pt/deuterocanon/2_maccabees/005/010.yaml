base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/010.yaml
  text: And after casting out a multitude unburied, he himself became unwept, and shared in no burial at all, nor in his ancestral tomb.
translation:
  language: pt
  text: E aquele que havia lançado fora uma multidão sem sepultura ficou ele próprio sem que alguém o pranteasse; não participou de funeral algum nem da lei ancestral.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem tomou parte na norma ancestral”. O grego diz literalmente “lei ancestral” (πατρῴου νόμου); no contexto, isso pode referir-se às práticas funerárias tradicionais. Algumas traduções seguem uma interpretação diferente, ligada ao túmulo da família.'
    reason: Preserva o sentido lexical de νόμος e assinala, sem introduzi-la no texto principal, a divergência da formulação inglesa consultiva.
lexical_decisions:
- source_word: ἀτάφων
  choice: insepulta
  rationale: Expressa que a multidão foi deixada sem sepultamento e mantém a ligação direta com o ato de lançá-la fora.
- source_word: ἀπένθητος
  choice: sem ser pranteado
  rationale: Conserva o contraste irônico entre os muitos deixados insepultos e o próprio agente, por quem ninguém guardou luto.
- source_word: κηδείας οὐδ᾽ ἥτινος
  choice: funeral algum
  rationale: Reproduz de modo natural a negação enfática de qualquer cerimônia ou cuidado fúnebre.
- source_word: πατρῴου νόμου
  choice: costume de seus antepassados
  rationale: Traduz literalmente a ideia de costume ou norma ancestral sem substituir νόμου por 'túmulo', que não é a leitura do texto grego fornecido.
theological_decisions:
- issue: Sentido de πατρῴου νόμου no contexto funerário
  choice: costume de seus antepassados
  alternative: túmulo de seus antepassados
  rationale: A edição grega fornecida traz νόμου, 'lei/costume', e não um termo para túmulo. A tradução preserva essa evidência textual e deixa o contexto funerário orientar o sentido sem alterar o substantivo.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe corrente e preservação do contraste retórico. A forma “insepulta” é deliberadamente literária, mas amplamente compreensível; “sem ser pranteado” evita reduzir ἀπένθητος apenas à ausência de uma cerimônia formal.
