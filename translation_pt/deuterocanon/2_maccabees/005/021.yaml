base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/021.yaml
  text: So Antiochus[a], after carrying off from the temple eighteen hundred talents, quickly departed for Antioch, thinking in his arrogance to make the land navigable and the sea passable on foot[b], because of the exaltation of his heart.
translation:
  language: pt
  text: Assim, Antíoco, depois de levar do templo mil e oitocentos talentos, partiu rapidamente para Antioquia, pensando, em sua arrogância, tornar a terra navegável e o mar transitável a pé[a], por causa da exaltação de seu coração[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A imagem é deliberadamente hiperbólica: Antíoco se julgava capaz de inverter a ordem natural, tornando a terra própria para a navegação e o mar próprio para caminhar.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “por causa da arrogância de seu coração”. A expressão grega fala literalmente da elevação do coração e descreve uma autoconfiança soberba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀκτακόσια πρὸς τοῖς χιλίοις
  choice: mil e oitocentos
  rationale: A expressão soma oitocentos a mil, totalizando 1.800; esta é a forma corrente e exata em português.
- source_word: ἀπενεγκάμενος ἐκ τοῦ ἱεροῦ
  choice: depois de levar do templo
  rationale: Reproduz o valor anterior do particípio e a retirada dos bens, sem restringir ἱερόν ao santuário interior.
- source_word: θᾶττον εἰς τὴν Ἀντιόχειαν ἐχωρίσθη
  choice: partiu rapidamente para Antioquia
  rationale: Expressa com naturalidade tanto a partida quanto a pressa indicada pelo advérbio.
- source_word: ἀπὸ τῆς ὑπερηφανίας
  choice: em sua arrogância
  rationale: Comunica a soberba como base de sua pretensão, com sentido claramente negativo e linguagem natural.
- source_word: τὴν μὲν γῆν πλωτὴν
  choice: tornar a terra navegável
  rationale: Mantém a imagem marítima de πλωτός e a inversão hiperbólica da ordem natural.
- source_word: τὸ πέλαγος πορευτὸν
  choice: o mar transitável a pé
  rationale: ‘Transitável’ traduz πορευτός; ‘a pé’ explicita o contraste contextual com a terra tornada navegável, sem alterar a imagem central.
- source_word: διὰ τὸν μετεωρισμὸν τῆς καρδίας
  choice: por causa da exaltação de seu coração
  rationale: Conserva a imagem grega de elevação interior e o idioma bíblico do coração, enquanto ‘arrogância’ esclarece antes seu sentido negativo.
theological_decisions:
- issue: Sentido antropológico de τῆς καρδίας
  choice: seu coração
  alternative: sua mente; seu íntimo
  rationale: ‘Coração’ preserva o idioma bíblico para o centro da intenção e do orgulho, sem reduzi-lo a uma faculdade meramente intelectual.
- issue: Repetição de duas expressões de soberba
  choice: manter ‘em sua arrogância’ e ‘exaltação de seu coração’
  alternative: fundir as expressões em uma única referência ao orgulho
  rationale: O grego emprega duas formulações distintas; preservá-las mantém a ênfase retórica e a tensão do texto.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. A sintaxe conserva o movimento narrativo do grego, e as notas esclarecem a hipérbole e a imagem do coração sem impor interpretação denominacional.
