base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/005.yaml
  text: But when a false rumor arose that Antiochus had passed from life[a], Jason, taking no fewer than a thousand men, launched a sudden attack against the city. When those on the wall had been driven back, and at last the city was already being taken, Menelaus fled into the citadel.
translation:
  language: pt
  text: Mas, quando surgiu um falso rumor de que Antíoco havia deixado esta vida[a], Jasão reuniu nada menos que mil homens e atacou a cidade de surpresa. Os que estavam sobre a muralha foram repelidos e, por fim, a cidade já estava sendo tomada, quando Menelau fugiu para a cidadela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “havia mudado de vida”, uma expressão eufemística para dizer que Antíoco havia morrido.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιάς ψευδοῦς
  choice: o falso rumor
  rationale: No contexto, λαλιά designa uma notícia que circulava; “falso rumor” é natural e preserva explicitamente sua falsidade.
- source_word: μετηλλαχότος ... τὸν βίον
  choice: havia deixado esta vida
  rationale: Mantém o caráter eufemístico da expressão grega, que literalmente alude a uma mudança de vida, mas comunica de modo claro a morte de Antíoco.
- source_word: παραλαβὼν
  choice: reuniu
  rationale: Neste contexto militar, indica que Jasão tomou consigo ou ajuntou uma tropa; “reuniu” comunica isso naturalmente em português.
- source_word: οὐκ ἐλάττους τῶν χιλίων
  choice: nada menos que mil homens
  rationale: Preserva a ênfase do limite mínimo expresso pelo grego.
- source_word: ἐφνιδίως ... συνετελέσατο ἐπίθεσιν
  choice: atacou ... de surpresa
  rationale: Expressa de maneira corrente tanto a execução do ataque como seu caráter súbito e inesperado.
- source_word: τῶν ... ἐπὶ τῷ τείχει
  choice: os que estavam sobre a muralha
  rationale: Segue o texto sem acrescentar explicitamente que eram defensores, embora isso seja provável pelo contexto.
- source_word: συνελασθέντων
  choice: foram repelidos
  rationale: No cenário de cerco, o passivo indica que os homens sobre a muralha foram forçados a recuar.
- source_word: καταλαμβανομένης τῆς πόλεως
  choice: a cidade já estava finalmente sendo tomada
  rationale: Preserva o aspecto progressivo da captura, sem afirmar que ela já havia sido concluída.
- source_word: ἐφυγάδευεν
  choice: fugiu
  rationale: Traduz diretamente o movimento de fuga sem acrescentar finalidade não explicitada no texto.
- source_word: ἀκρόπολιν
  choice: cidadela
  rationale: Designa com clareza a fortificação elevada da cidade e é mais acessível do que a transliteração “acrópole”.
