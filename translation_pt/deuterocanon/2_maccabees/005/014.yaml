  yaml_path: translation/deuterocanon/2_maccabees/005/014.yaml
  text: 'And in the three whole days[a], eighty thousand were destroyed: forty thousand by violent hands[b], and no fewer than those who were slaughtered were sold.'
translation:
  language: pt
  text: 'Nos três dias inteiros, oitenta mil foram destruídos: quarenta mil morreram pela violência humana[a], e foram vendidos não menos do que os que foram massacrados[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente algo como “nas leis das mãos”, uma expressão obscura; aqui ela é entendida como violência praticada por pessoas.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “foram vendidos como escravos”. O grego diz apenas “foram vendidos”; a escravização está implícita no contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀκτὼ ... μυριάδες
  choice: oitenta mil
  rationale: Μυριάς designa um conjunto de dez mil; assim, a expressão equivale naturalmente a “oitenta mil” em português.
- source_word: ἐν ταῖς πάσαις ἡμέραις τρισίν
  choice: ao longo dos três dias
  rationale: A formulação comunica a extensão total do período de três dias de modo natural, preservando a força temporal de πάσαις.
- source_word: κατεφθάρησαν
  choice: foram destruídos
  rationale: O verbo pode indicar tanto perecer como ser destruído. O passivo conserva a violência do contexto sem especificar além do grego a maneira exata da morte.
- source_word: τέσσαρες μὲν
  choice: quarenta mil
  rationale: O substantivo “miríades” está subentendido a partir da oração anterior; quatro miríades correspondem a quarenta mil.
- source_word: ἐν χειρῶν νόμοις
  choice: pela violência de mãos humanas
  rationale: A expressão grega, literalmente próxima de “sob as leis das mãos”, é obscura. A tradução explicita com cautela a ação violenta de agentes humanos, sem reduzi-la necessariamente a combate corpo a corpo ou a armas.
- source_word: τῶν ἐσφαγμένων
  choice: os que foram massacrados
  rationale: Σφάζω é um termo forte para matar ou chacinar; “massacrados” conserva a brutalidade e mantém um registro digno.
- source_word: ἐπράθησαν
  choice: foram vendidos
  rationale: O verbo significa literalmente “foram vendidos”. A escravização é a implicação contextual provável, mas não é expressa diretamente no verbo e, por isso, fica indicada em nota.
