translation_notes:
  register: Português moderno, claro e solene, com sintaxe acessível. A formulação preserva a contagem, o paralelismo e a violência do relato, enquanto as notas registram a obscuridade de ἐν χειρῶν νόμοις e a implicação não explícita de escravidão em ἐπράθησαν.
