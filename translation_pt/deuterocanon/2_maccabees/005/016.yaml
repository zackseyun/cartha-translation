  yaml_path: translation/deuterocanon/2_maccabees/005/016.yaml
  text: and with his polluted hands taking the sacred vessels[b][a], and with profane hands dragging away the things that had been dedicated by many kings for the increase and glory and honor of the place.
translation:
  language: pt
  text: e, com suas mãos contaminadas, tomando os objetos sagrados e, com mãos profanas, levando de arrasto aquilo que muitos reis haviam consagrado[a] para o engrandecimento, a glória e a honra do lugar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aquilo que muitos reis haviam erigido”. O particípio grego pode significar mais literalmente “erigido” ou “colocado”, referindo-se aqui provavelmente a ofertas votivas reais instaladas no templo.
    reason: lexical_alternative
  - marker: b
    text: “O lugar” é uma forma reverencial de se referir ao templo.
    reason: cultural_note
lexical_decisions:
- source_word: μιαραῖς
  choice: contaminadas
  rationale: Expressa a contaminação ritual e moral das mãos, preservando o caráter sacrílego da ação em linguagem portuguesa atual.
- source_word: ἱερὰ σκεύη
  choice: objetos sagrados
  rationale: Designa de modo claro e abrangente os artigos usados no templo, sem restringir σκεύη apenas a recipientes.
- source_word: ἀνασταθέντα
  choice: haviam consagrado
  rationale: No contexto de dádivas régias destinadas ao templo, comunica o sentido votivo provável; a alternativa mais literal é registrada em nota.
- source_word: πρὸς αὔξησιν καὶ δόξαν τοῦ τόπου καὶ τιμήν
  choice: para o engrandecimento, a glória e a honra do lugar
  rationale: Mantém a finalidade expressa por πρὸς, representa separadamente os três substantivos e conserva a referência reverencial ao templo como “o lugar”.
- source_word: βεβήλοις
  choice: profanas
  rationale: Preserva o contraste cultual preciso entre as mãos profanas e os objetos sagrados.
- source_word: συνσύρων
  choice: levando de arrasto
  rationale: Conserva a ideia de remoção violenta e indigna, de maneira natural em português.
theological_decisions:
- issue: Linguagem cultual da profanação do templo e de seus objetos
  choice: Preservar o contraste explícito entre “mãos contaminadas”, “objetos sagrados” e “mãos profanas”, bem como a designação “o lugar”
  alternative: Empregar termos genéricos como “mãos impuras”, “coisas do templo” e nomear diretamente “o templo”
  rationale: O texto enfatiza o sacrilégio por meio da oposição entre o sagrado e o profano. A tradução mantém essa polaridade sem suavizá-la nem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A construção iniciada por “e” preserva a ligação sintática e narrativa com o versículo anterior.
