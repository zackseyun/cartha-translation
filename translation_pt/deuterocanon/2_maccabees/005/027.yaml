base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/027.yaml
  text: But Judas[a], who was also called Maccabeus, having become about the tenth and having withdrawn, lived in the mountains like a wild animal with those who were with him, and they continued feeding on vegetation so as not to share in the defilement.
translation:
  language: pt
  text: Mas Judas, também chamado Macabeu, tendo ficado com um grupo de cerca de dez homens[a] e se retirado, vivia nas montanhas como os animais selvagens, junto com os que o acompanhavam. Eles continuavam a se alimentar de plantas, a fim de não tomarem parte na contaminação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego é conciso e pode ser entendido mais literalmente como “tendo se tornado aproximadamente o décimo”; provavelmente indica que Judas ficou reduzido a um grupo de cerca de dez homens.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας ... ὁ καὶ Μακκαβαῖος
  choice: Judas, também chamado Macabeu
  rationale: A construção ὁ καὶ apresenta outro nome ou título. “Macabeu” é a forma portuguesa consagrada e mantém a identificação do grego Μακκαβαῖος.
- source_word: δέκατός που γενηθεὶς
  choice: tendo ficado com um grupo de cerca de dez homens[a]
  rationale: A expressão grega é elíptica e inclui aproximação por meio de που. A tradução explicita o sentido contextual mais provável — Judas reduzido a um grupo de aproximadamente dez — sem ocultar a forma comprimida, registrada na nota.
- source_word: ἀναχωρήσας
  choice: se retirado
  rationale: Expressa afastamento diante do perigo sem determinar se foi uma retirada estritamente militar.
- source_word: ἐν τοῖς ὄρεσι
  choice: nas montanhas
  rationale: Correspondência locativa direta e natural para ἐν τοῖς ὄρεσι.
- source_word: θηρίων τρόπον διέζη
  choice: vivia ... como os animais selvagens
  rationale: Preserva a comparação com o modo de vida das feras e evita acrescentar explicitamente a ideia de mera sobrevivência.
- source_word: σὺν τοῖς μετʼ αὐτοῦ
  choice: junto com os que o acompanhavam
  rationale: Mantém genérica a identidade dos associados de Judas, como no grego.
- source_word: τὴν χορτώδη τροφὴν
  choice: plantas
  rationale: Comunica em português corrente o alimento de origem herbácea ou vegetal, adequado à subsistência nas montanhas, sem o tecnicismo de “vegetação” nem a restrição potencial de “capim”.
- source_word: σιτούμενοι διετέλουν
  choice: continuavam a se alimentar de
  rationale: 'Reproduz o aspecto durativo da construção: eles persistiam em tomar esse alimento.'
- source_word: πρὸς τῷ μὴ μετασχεῖν τοῦ μολυσμοῦ
  choice: a fim de não tomarem parte na contaminação
  rationale: Mantém tanto a finalidade quanto a noção de participação expressa por μετασχεῖν; “contaminação” conserva a possível força cultual e moral de μολυσμός sem limitá-la à impureza ritual.
theological_decisions:
- issue: Natureza de μολυσμός no contexto
  choice: contaminação, com possível força cultual e moral
  alternative: impureza exclusivamente ritual; corrupção ou poluição em sentido geral
  rationale: No contexto da perseguição de Antíoco, pode envolver alimentos e práticas proibidos, bem como infidelidade religiosa. “Contaminação” preserva essa amplitude sem resolver a tensão em favor de uma única categoria.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada para clareza, mas a sequência de retirada, vida nas montanhas, alimentação contínua e propósito de evitar a contaminação foi preservada.
