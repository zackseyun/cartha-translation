base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/011.yaml
  text: When the king was informed about what had happened[a], he concluded that Judea was in revolt; so, after setting out from Egypt, savage in spirit, he took the city by force of arms.
translation:
  language: pt
  text: Quando o rei foi informado do que havia acontecido, concluiu que a Judeia estava em revolta. Por isso, partiu do Egito com o íntimo tomado de ferocidade e conquistou a cidade pela força das armas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “capturada pela lança”, expressão militar grega para a tomada de uma cidade por meio de um ataque armado.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προεστώτων δὲ τῷ Βασιλεῖ περὶ τῶν γεγονότων
  choice: Quando o rei foi informado do que havia acontecido
  rationale: A construção absoluta indica que os acontecimentos foram apresentados ou comunicados ao rei. A formulação passiva é clara e natural, sem especificar agentes que o grego não identifica.
- source_word: διέλαβεν
  choice: concluiu
  rationale: O verbo expressa aqui um juízo ou inferência formado a partir das notícias recebidas, não mera percepção.
- source_word: ἀποστατεῖν τὴν Ἰουδαίαν
  choice: que a Judeia estava em revolta
  rationale: No contexto político, ἀποστατεῖν se refere a rebelião contra a autoridade real, e não primariamente a apostasia religiosa.
- source_word: ἀναζεύξας ἐξ Αἰγύπτου
  choice: partiu do Egito
  rationale: O particípio denota levantar acampamento ou pôr-se a caminho. A tradução preserva a sequência narrativa sem acrescentar um detalhe militar desnecessário.
- source_word: θηριωμένος τῇ ψυχῇ
  choice: com o íntimo tomado de ferocidade
  rationale: A expressão descreve uma disposição interior semelhante à de uma fera. Esta escolha conserva a imagem de brutalidade sem soar artificial em português.
- source_word: ἔλαβεν τὴν μὲν πόλιν
  choice: conquistou a cidade
  rationale: λαμβάνω tem aqui sentido militar de tomar ou capturar uma cidade; “conquistou” é corrente e inequívoco no contexto.
- source_word: δοριαλώτον
  choice: pela força das armas
  rationale: O adjetivo significa literalmente algo tomado pela lança e funciona como expressão militar para conquista mediante ataque armado.
