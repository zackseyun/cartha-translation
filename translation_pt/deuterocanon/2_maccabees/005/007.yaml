base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/007.yaml
  text: He did not gain control of the government[a], but in the end, receiving shame from the plot[b], he again fled away to Ammanitis.
translation:
  language: pt
  text: Não conseguiu obter o governo[a], mas, como resultado de sua conspiração, acabou envergonhado e partiu novamente como fugitivo para a Amonítida[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não obteve o poder” ou “não conseguiu apoderar-se do governo”. O verbo grego é raro neste contexto, mas o sentido parece ser que ele não conseguiu conquistar o poder que buscava.
    reason: lexical_alternative
  - marker: b
    text: A Amonítida era a região dos amonitas.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρχῆς
  choice: o governo
  rationale: Neste contexto, ἀρχή designa o poder ou governo que Jasão tentou tomar, e não um começo.
- source_word: οὐκ ἐκρίτησεν
  choice: não conseguiu assumir
  rationale: O verbo é raro e difícil neste contexto. A formulação expressa, sem excessiva precisão, que ele não obteve o governo que procurava tomar.
- source_word: τὸ ... τέλος
  choice: como resultado
  rationale: τέλος pode indicar o fim, desfecho ou resultado. Aqui, a expressão portuguesa comunica naturalmente o resultado final da conspiração.
- source_word: ἐπιβουλῆς
  choice: sua conspiração
  rationale: ἐπιβουλή indica uma trama ou plano hostil. O possessivo é inferido pelo contexto, no qual se trata da conspiração empreendida por Jasão.
- source_word: αἰσχύνην λαβών
  choice: recebeu ... a vergonha
  rationale: Preserva a imagem concreta do grego, literalmente 'tendo recebido vergonha', embora a construção portuguesa seja levemente reorganizada para maior clareza.
- source_word: φυγὰς ... ἀπῆλθεν
  choice: fugiu
  rationale: A combinação apresenta Jasão partindo como fugitivo. 'Fugiu' transmite de modo natural tanto a partida quanto a condição de quem estava em fuga.
- source_word: πάλιν
  choice: novamente
  rationale: Indica que esta fuga se repetiu.
- source_word: Ἀμμανῖτιν
  choice: Amonítida
  rationale: Forma portuguesa do nome regional grego, referente ao território dos amonitas.
