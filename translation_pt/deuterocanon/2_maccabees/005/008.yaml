base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/008.yaml
  text: 'So he met the end of a miserable ruin: confined with Aretas[a], the ruler of the Arabs, fleeing from city to city, pursued by all, hated as an apostate from the laws and abhorred as the destroyer of his homeland and fellow citizens[b], he was driven into Egypt.'
translation:
  language: pt
  text: 'Assim, encontrou o fim de sua miserável derrocada: confinado junto a Aretas, o governante dos árabes[a], fugindo de cidade em cidade, perseguido por todos, odiado como apóstata das leis e abominado como o algoz de sua pátria e de seus concidadãos, foi arremessado para o Egito[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o tirano dos árabes”. O termo grego também pode ser usado de modo mais neutro com o sentido de “governante”.
    reason: lexical_alternative
  - marker: b
    text: Ou “foi expulso para o Egito”. O verbo grego é muito forte e sugere que ele foi lançado para fora.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέρας ... ἔτυχεν
  choice: encontrou o fim
  rationale: Reproduz de modo natural a expressão grega de alcançar ou encontrar determinado fim, sem explicar além do texto.
- source_word: κακῆς καταστροφῆς
  choice: de sua miserável derrocada
  rationale: “Derrocada” comunica queda e ruína, enquanto “miserável” conserva a avaliação intensamente negativa de κακῆς.
- source_word: ἐγκλεισθεὶς πρὸς Ἀρέταν
  choice: confinado junto de Aretas
  rationale: Mantém a ideia de estar encerrado ou restringido e preserva a relativa abertura de πρός quanto à relação exata com Aretas, sem afirmar prisão formal.
- source_word: τύραννον
  choice: governante
  rationale: No grego helenístico, o termo pode designar um soberano sem necessariamente salientar tirania moral; a alternativa literal é registrada em nota.
- source_word: πόλιν ἐκ πόλεως φεύγων
  choice: fugindo de cidade em cidade
  rationale: Expressão portuguesa corrente que preserva o movimento repetido entre cidades.
- source_word: διωκόμενος ὑπὸ πάντων
  choice: perseguido por todos
  rationale: Conserva o sentido concreto e abrangente da perseguição sem lhe atribuir motivação religiosa específica.
- source_word: στυγούμενος
  choice: odiado
  rationale: Equivalente claro e forte para a hostilidade expressa pelo particípio.
- source_word: τῶν νόμων ἀποστάτης
  choice: apóstata das leis
  rationale: Preserva a acusação forte de abandono da lealdade às leis, inclusive sua dimensão religioso-comunitária.
- source_word: βδελυσσόμενος
  choice: abominado
  rationale: Comunica repulsa mais intensa que simples antipatia e mantém a progressão em relação a “odiado”.
- source_word: πατρίδος καὶ πολιτῶν δήμιος
  choice: o algoz de sua pátria e de seus concidadãos
  rationale: “Algoz” conserva a imagem concreta de executor e, por extensão, de causador cruel de destruição, com expressão idiomática em português.
- source_word: εἰς Αἴγυπτον ἐξεβράσθη
  choice: foi arremessado para o Egito
  rationale: O verbo é vigoroso e sugere expulsão ou lançamento para fora; “arremessado” preserva essa força sem recorrer à imagem excessivamente gráfica de “vomitado”.
theological_decisions:
- issue: Caracterização moral de Aretas por τύραννον
  choice: governante
  alternative: tirano
  rationale: O termo pode funcionar como designação política relativamente neutra. A tradução evita transferir para Aretas uma condenação que o contexto concentra no personagem em fuga, sem ocultar a alternativa lexical.
- issue: Força de ἀποστάτης em relação às leis
  choice: apóstata das leis
  alternative: desertor das leis
  rationale: “Apóstata” mantém a gravidade do abandono da ordem legal e religiosa evocada no contexto, sem especificar uma formulação doutrinária além do grego.
- issue: Imagem de δήμιος
  choice: algoz
  alternative: destruidor
  rationale: A escolha mantém tanto a brutalidade concreta de um executor quanto o sentido extensivo de agente de destruição, sem decidir de modo estreito entre essas nuances.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com cadência narrativa formal. “Derrocada”, “apóstata”, “abominado” e “algoz” preservam a intensidade retórica do grego sem tornar a frase arcaica; a sequência de particípios foi mantida para refletir a estrutura acumulativa do original.
