base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/018.yaml
  text: But if we had not become involved in many sins[a], then, just as Heliodorus, who was sent by King Seleucus to inspect the treasury, was immediately scourged and turned back from his boldness when he came forward, so also would we have been struck down.
translation:
  language: pt
  text: Mas, se não tivéssemos incorrido em muitos pecados, ele também, assim como Heliodoro, enviado pelo rei Seleuco para inspecionar o tesouro, teria sido imediatamente açoitado e, ao se apresentar, refreado em sua ousadia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνέβην προενέχεσθαι
  choice: tivesse acontecido de estarmos enredados
  rationale: Preserva a construção impessoal e contrafactual, bem como a ideia de envolvimento moral expressa pelo infinitivo médio/passivo, em português natural e digno.
- source_word: πολλοῖς ἁμαρτήμασιν
  choice: em muitos pecados
  rationale: O dativo indica a esfera de envolvimento; a preposição «em» é idiomática em português.
- source_word: ἐπὶ τὴν ἐπίσκεψιν τοῦ γαζοφυλακίου
  choice: para inspecionar o tesouro
  rationale: Expressa de modo conciso a finalidade da missão oficial, sem acrescentar ao substantivo uma especificação ausente neste versículo.
- source_word: προαχθεὶς
  choice: ao avançar
  rationale: Mantém a provável ideia de Heliodoro avançar para executar sua missão e evita decidir pela alternativa passiva «ser conduzido».
- source_word: παραχρῆμα μαστιγωθεὶς
  choice: teria sido açoitado imediatamente
  rationale: «Imediatamente» conserva a consequência instantânea, e «açoitado» mantém a gravidade e o registro literário do verbo.
- source_word: ἀνετράπη τοῦ θράσους
  choice: refreado em sua ousadia
  rationale: Comunica a reversão ou contenção de sua ação audaciosa sem carregar θράσος necessariamente com o valor mais forte de «insolência».
theological_decisions:
- issue: Conclusão implícita da condição e referente de οὗτος
  choice: 'Manter Heliodoro como sujeito da oração principal: «ele ... teria sido açoitado»'
  alternative: Acrescentar uma conclusão como «também nós teríamos sido abatidos»
  rationale: No grego, οὗτος retoma naturalmente Heliodoro, e os particípios masculinos singulares descrevem o que lhe teria acontecido. A construção é elíptica, mas não exige introduzir «nós» como sujeito de uma conclusão ausente. Assim se preservam a tensão sintática e o sentido contrafactual sem expansão teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período conserva a estrutura condicional e o tom narrativo solene, evitando arcaísmos desnecessários.
