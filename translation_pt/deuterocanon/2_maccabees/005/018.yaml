review_pass:
  verdict: revise
  source_fidelity: A tradução identifica corretamente «ele/este» como Antíoco, e não como Heliodoro nem como um «nós» acrescentado; essa é a leitura exigida pelo contexto imediato e por οὗτος. Contudo, «assim como Heliodoro» sem «também» enfraquece a comparação, e «ao avançar» trata de forma demasiado definida como ativa uma forma participial passiva (προαχθείς) cuja nuance é discutida.
  naturalness: O período é compreensível, mas «se não tivesse acontecido de estarmos enredados» é pesado no português moderno. «Se não tivéssemos incorrido em muitos pecados» é mais natural e conserva o sentido contrafactual de envolvimento/cumplicidade em pecados.
  terminology: «Heliodoro», «rei Seleuco», «tesouro», «açoitado» e «ousadia» são adequados. «Refreado em sua ousadia» comunica de modo sóbrio a reversão de ἀνετράπη τοῦ θράσους.
  issues:
  - severity: medium
    issue: A nota de rodapé explica incorretamente que Heliodoro «teria sido detido» na condição contrafactual.
    rationale: No contexto de 5:15–18 e na sintaxe, οὗτος aponta para o invasor em foco, Antíoco. Heliodoro é o precedente comparativo; a consequência contrafactual recai sobre «este», não sobre Heliodoro.
  - severity: low
    issue: A comparação está pouco explicitada e a tradução de προαχθείς decide excessivamente pela voz ativa.
    rationale: «Ele também, assim como Heliodoro» torna explícita a comparação presente no grego. «Ao se apresentar» conserva a progressão narrativa sem impor a interpretação ativa de «ao avançar» à forma passiva.
  revised_text: Mas, se não tivéssemos incorrido em muitos pecados, ele também, assim como Heliodoro, enviado pelo rei Seleuco para inspecionar o tesouro, teria sido imediatamente açoitado e, ao se apresentar, refreado em sua ousadia.
