base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/002.yaml
  text: And throughout nearly the whole city[a], for forty days, it happened that horsemen were seen running through the air, wearing garments of gold and armed with lances drawn up in squadrons[b],
translation:
  language: pt
  text: E aconteceu que, por quase toda a cidade, durante quarenta dias, foram vistos cavaleiros correndo pelo ar[a], com vestes de ouro e armados de lanças, dispostos em esquadrões[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “apareciam correndo pelo ar”. O grego φαίνεσθαι pode enfatizar tanto o aparecimento quanto o fato de algo ser visto.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser traduzida como “em formação” ou “em fileiras”; o advérbio grego sugere uma disposição militar organizada.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέβη
  choice: aconteceu
  rationale: Mantém a fórmula narrativa impessoal do grego em português natural e atual.
- source_word: καθʼ ὅλην τὴν πόλιν σχεδὸν
  choice: por quase toda a cidade
  rationale: Expressa a distribuição espacial de κατά e preserva a limitação introduzida por σχεδόν.
- source_word: ἐφʼ ἡμέρας τεσσεράκοντα
  choice: durante quarenta dias
  rationale: É uma formulação temporal idiomática que conserva a duração indicada no grego.
- source_word: φαίνεσθαι
  choice: foram vistos
  rationale: Comunica que o fenômeno se tornou visível aos observadores, sem decidir de modo categórico entre visão e aparecimento; a alternativa é registrada em nota.
- source_word: διὰ τῶν ἀέρων
  choice: pelo ar
  rationale: O plural grego é idiomático; o singular é a forma corrente em português para o espaço aéreo atravessado.
- source_word: τρέχοντας ἱππεῖς
  choice: cavaleiros correndo
  rationale: Segue de perto o particípio τρέχοντας e identifica ἱππεῖς como homens montados, sem acrescentar a ideia específica de ataque.
- source_word: διαχρύσους στολὰς ἔχοντας
  choice: com vestes de ouro
  rationale: Preserva a imagem visual intensa de vestes caracterizadas pelo ouro, sem definir se eram feitas, revestidas ou ornamentadas com ele.
- source_word: λόγχας
  choice: lanças
  rationale: Termo português amplo e natural para a arma indicada por λόγχη, apropriado ao cenário de cavalaria.
- source_word: σπειρηδὸν
  choice: dispostos em esquadrões
  rationale: Representa a organização em unidades ou formação militar sugerida pelo advérbio, embora outras expressões de formação sejam possíveis.
- source_word: ἐξωπλισμένους
  choice: armados
  rationale: Traduz de modo conciso o estado de estarem equipados com armas.
theological_decisions:
- issue: Natureza dos cavaleiros vistos no ar
  choice: foram vistos
  alternative: apareciam
  rationale: A tradução não determina se se tratava de seres fisicamente presentes ou de um fenômeno visionário, preservando a abertura semântica de φαίνεσθαι.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluente e vocabulário acessível. A vírgula final foi mantida porque o versículo continua a descrição na sequência imediata.
