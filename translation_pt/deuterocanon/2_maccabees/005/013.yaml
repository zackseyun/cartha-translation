  text: There was a killing of young and old, a destruction of men and women and children, and slaughters of virgins and infants.
translation:
  language: pt
  text: Havia matança de jovens e idosos[a], extermínio de homens, mulheres e crianças, e massacres de virgens[b] e bebês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rapazes e anciãos”, se os termos de idade forem entendidos de maneira mais específica; o contexto, porém, favorece o contraste geral entre jovens e idosos.
    reason: lexical_alternative
  - marker: b
    text: “Virgens” traduz um termo que designa mais especificamente jovens mulheres não casadas e de condição virginal; “jovens mulheres” é uma alternativa possível, mas menos precisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνετο
  choice: Havia
  rationale: O imperfeito introduz a situação em curso; “Havia” é natural em português e mantém o caráter descritivo do relato.
- source_word: νέων
  choice: jovens
  rationale: Em paralelo com πρεσβυτέρων, exprime sobretudo um contraste geral de idade, sem restringir necessariamente o grupo ao sexo masculino.
- source_word: πρεσβυτέρων
  choice: idosos
  rationale: Neste contexto, indica pessoas de idade avançada, não detentores de um cargo comunitário; “idosos” preserva o contraste com “jovens”.
- source_word: ἀναίρεσις
  choice: matança
  rationale: Designa a retirada violenta da vida. “Matança” comunica a violência coletiva sem antecipar toda a intensidade de σφαγαί no fim da frase.
- source_word: ἀφανισμός
  choice: extermínio
  rationale: O substantivo denota destruição ou eliminação completa; aplicado a pessoas, “extermínio” é idiomático e conserva a força do grego.
- source_word: παρθένων
  choice: virgens
  rationale: Preserva a referência específica a jovens mulheres não casadas, caracterizadas por sua condição virginal, em vez de reduzi-la apenas à idade.
- source_word: νηπίων
  choice: bebês
  rationale: Refere-se a crianças muito pequenas, especialmente ainda incapazes de falar; “bebês” é atual, claro e preciso.
- source_word: σφαγαί
  choice: massacres
  rationale: Termo forte de carnificina ou matança violenta; “massacres” mantém a intensificação retórica em relação a ἀναίρεσις.
