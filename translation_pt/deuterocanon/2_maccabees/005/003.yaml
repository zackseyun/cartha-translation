translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura enumerativa compatível com a visão bélica do contexto. Preferiu-se «cavalaria» a uma reprodução literal de «cavalos» e evitou-se transformar καταδρομάς inequivocamente em «contra-ataques». Os marcadores foram ligados às expressões gregas efetivamente discutidas pelas notas.
