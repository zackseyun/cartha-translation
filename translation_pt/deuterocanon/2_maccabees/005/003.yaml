  text: and the brandishing of swords[a], and squadrons of cavalry drawn up, and attacks and counterattacks by both sides, and the movement of shields, and masses of spears, and the shooting of missiles, and the gleaming of golden ornaments[b], and all kinds of armor.
translation:
  language: pt
  text: e o desembainhar de espadas, esquadrões de cavalaria dispostos em formação, ataques e investidas de ambos os lados[a], movimentos de escudos, grande quantidade de lanças[b], lançamentos de projéteis, os brilhos de ornamentos de ouro e todo tipo de armadura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «incursões de ambos os lados». O termo grego pode indicar investidas rápidas, ataques impetuosos ou incursões.
    reason: lexical_alternative
  - marker: b
    text: O termo grego traduzido como «lanças» é difícil neste contexto; pode referir-se, de modo mais geral, a numerosas armas de haste ou a equipamento bélico semelhante.
    reason: textual_variant
lexical_decisions:
- source_word: μαχαιρῶν σπασμούς
  choice: espadas sendo desembainhadas
  rationale: σπασμός indica literalmente o ato de puxar ou sacar. A formulação retrata com naturalidade a ação visível das espadas sendo tiradas da bainha, sem acrescentar a ideia lexicalmente distinta de brilho.
- source_word: ἴλας ἵππων διατεταγμένας
  choice: esquadrões de cavalaria dispostos em formação
  rationale: ἴλη é uma unidade ou esquadrão de cavalaria; ἵππων representa metonimicamente as forças montadas, e διατεταγμένας indica disposição ordenada para a batalha.
- source_word: προσβολὰς γινομένας
  choice: ataques
  rationale: No contexto militar, προσβολή designa ataque ou assalto; «ataques» é claro, amplo e natural.
- source_word: καταδρομὰς ἑκατέρων
  choice: investidas de ambos os lados
  rationale: καταδρομή pode indicar uma investida, incursão ou ataque impetuoso. «Investidas» preserva essa amplitude e evita impor a noção mais específica de contra-ataque.
- source_word: ἀσπίδων κινήσεις
  choice: movimentos de escudos
  rationale: κίνησις significa movimento; a tradução mantém a descrição ampla, sem especificar se os escudos eram agitados, erguidos ou manejados.
- source_word: καμάτων πλήθη
  choice: grande quantidade de lanças
  rationale: καμάτων é difícil neste contexto. A sequência de equipamento bélico favorece a referência a lanças, hastes ou armas semelhantes; a nota registra a incerteza.
- source_word: βελῶν βολάς
  choice: disparos de projéteis
  rationale: βέλος pode ser flecha, dardo ou outro projétil, e βολή é lançamento ou disparo. A expressão conserva a generalidade do grego.
- source_word: χρυσέων κόσμων ἐκλάμψεις
  choice: o brilho de ornamentos de ouro
  rationale: κόσμος pode significar ornamento, adorno ou equipamento, enquanto ἐκλάμψεις descreve seu brilho ou lampejo. A escolha mantém o sentido mais direto sem limitar os objetos.
- source_word: παντοίους θωρακισμούς
  choice: todo tipo de armadura
  rationale: θωρακισμός designa armadura ou proteção defensiva, e παντοίους salienta sua variedade.
