base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/022.yaml
  text: 'He also left overseers to mistreat the nation: in Jerusalem[a], Philip, a Phrygian by birth, but in character more barbarous than the one who appointed him[b];'
translation:
  language: pt
  text: 'Deixou também encarregados de maltratar a nação[a]: em Jerusalém, Filipe, frígio de nascimento, mas de caráter mais bárbaro do que aquele que o nomeou[b];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de oprimir o povo”. O infinitivo grego τοῦ κακοῦν pode indicar causar dano, maltratar ou oprimir.'
    reason: lexical_alternative
  - marker: b
    text: 'A expressão “mais bárbaro do que aquele que o nomeou” intensifica o juízo moral do autor: Filipe é retratado como ainda mais cruel que o governante que o colocou no cargo.'
    reason: cultural_note
lexical_decisions:
- source_word: κατέλειπεν
  choice: Deixou
  rationale: Preserva o sentido básico de deixar alguém para trás ou mantê-lo em determinado lugar; no contexto, a ideia de incumbência administrativa fica implícita.
- source_word: ἐπιστάτας
  choice: encarregados
  rationale: Expressa pessoas colocadas sobre outras e investidas de uma função, sem impor ao termo grego um cargo administrativo excessivamente específico.
- source_word: τοῦ κακοῦν
  choice: de maltratar
  rationale: O infinitivo articular indica propósito ou função. “Maltratar” comunica de modo natural uma ação danosa e persistente, sem restringi-la apenas à opressão política.
- source_word: τὸ γένος
  choice: a nação
  rationale: Neste contexto, designa o povo judeu como coletividade étnica e nacional. “Nação” conserva essa dimensão coletiva, enquanto “raça” seria inadequado no uso moderno.
- source_word: τὸ μὲν γένος Φρύγα
  choice: frígio de nascimento
  rationale: A expressão identifica a origem étnica ou geográfica de Filipe e estabelece o contraste retórico com seu caráter.
- source_word: τὸν δὲ τρόπον
  choice: de caráter
  rationale: τρόπος se refere aqui à índole ou maneira de agir; “de caráter” forma um contraste natural com “de nascimento”.
- source_word: βαρβαρώτερον ἔχοντα
  choice: mais bárbaro
  rationale: Mantém o comparativo explícito e a forte retórica moral do autor, sem reduzi-la ao sentido mais estreito de violência física.
- source_word: τοῦ καταστήσαντος
  choice: do que aquele que o nomeou
  rationale: O particípio aponta para quem colocou Filipe no cargo. A formulação é clara em português e preserva a comparação pessoal.
