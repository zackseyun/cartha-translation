  text: And he ordered the soldiers to cut down without mercy those they encountered[b][a], and to slaughter those who went up into the houses.
translation:
  language: pt
  text: E ordenou aos soldados que matassem sem piedade os que encontrassem[a] e que massacrassem os que subiam nas casas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os que lhes aparecessem pelo caminho». O particípio grego pode indicar pessoas encontradas no caminho dos soldados; esta tradução evita sugerir que as vítimas iniciaram o ataque.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «os que subiam nas casas». Talvez se refira a pessoas que subiam escadas dentro das casas ou iam para aposentos superiores.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: ordenou
  rationale: O aoristo de κελεύω indica que ele deu uma ordem; «ordenou» é natural e preserva a força do grego.
- source_word: κόπτειν
  choice: matassem
  rationale: Embora κόπτω tenha o sentido básico de golpear ou cortar, neste contexto de violência militar designa matar. «Matassem» comunica com clareza o resultado letal, enquanto κατασφάζειν mantém adiante a formulação mais gráfica.
- source_word: ἀφειδῶς
  choice: sem piedade
  rationale: O advérbio expressa agir sem poupar; «sem piedade» transmite de modo corrente a crueldade da ordem.
- source_word: τοὺς ἐμπίπτοντας
  choice: todos os que encontrassem
  rationale: O particípio pode referir-se aos que apareciam no caminho ou eram encontrados. Esta opção preserva o sentido contextual sem sugerir que as vítimas atacaram primeiro.
- source_word: ἀναβαίνοντας
  choice: os que subiam para dentro
  rationale: Preserva o movimento ascendente expresso por ἀναβαίνω e sua relação incomum com as casas, sem reduzir a expressão a um simples «entravam».
- source_word: κατασφάζειν
  choice: massacrassem
  rationale: O verbo composto indica matança brutal e intensificada; «massacrassem» conserva essa força em português atual.
- source_word: οἰκίαις
  choice: casas
  rationale: O contexto aponta para as construções físicas, por isso «casas» é mais adequado que «lares» ou «famílias».
