translation:
  language: pt
  text: Por volta dessa época, Antíoco empreendeu sua segunda expedição ao Egito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enviou sua segunda campanha ao Egito”. O verbo grego pode ter o sentido mais literal de “enviar” ou “despachar”, e ἔφοδος pode significar “ataque”, “campanha” ou “expedição”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ τὸν καιρὸν τοῦτον
  choice: Por volta dessa época
  rationale: A construção com περί e acusativo tem sentido temporal aproximado. A formulação é natural em português e introduz com clareza o cenário cronológico da narrativa.
- source_word: τὴν δευτέραν ἔφοδον
  choice: sua segunda expedição
  rationale: ἔφοδος pode significar ataque, campanha ou expedição. Neste contexto militar, «expedição» preserva a ideia de uma operação dirigida ao Egito sem restringi-la a um ataque pontual. O possessivo explicita naturalmente que a expedição era de Antíoco.
- source_word: ὁ Ἀντίοχος
  choice: Antíoco
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome grego.
- source_word: εἰς Αἴγυπτον
  choice: ao Egito
  rationale: εἰς indica movimento em direção a um lugar ou para dentro dele. «Ao Egito» é idiomático em português neste contexto, enquanto «para dentro do Egito» seria excessivamente literal.
- source_word: ἐστέλατο
  choice: empreendeu
  rationale: A forma média de στέλλω pode indicar que Antíoco pôs em marcha ou realizou a expedição. «Empreendeu» combina naturalmente com «expedição» e mantém Antíoco como agente, sem resolver de modo excessivamente específico se ele a iniciou, despachou ou conduziu pessoalmente.
