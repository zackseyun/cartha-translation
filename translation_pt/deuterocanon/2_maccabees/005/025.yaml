base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/025.yaml
  text: But when this man arrived in Jerusalem and pretended to be peaceable[a], he held back until the holy day of the Sabbath; and taking the Jews off guard, he ordered those under his command to arm themselves.
translation:
  language: pt
  text: Ao chegar a Jerusalém, esse homem fingiu ter intenções pacíficas. Esperou até o santo dia do sábado e, pegando os judeus desprevenidos[a], ordenou aos homens sob seu comando que se armassem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tomando os judeus de surpresa”. A expressão grega é condensada e pode aludir à vulnerabilidade dos judeus no sábado, sem explicitar a circunstância.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: ao chegar
  rationale: O particípio indica sua chegada a Jerusalém; a construção temporal é natural em português narrativo.
- source_word: τὸν εἰρηνικὸν ὑποκριθεὶς
  choice: fingiu ter intenções pacíficas
  rationale: ὑποκρίνομαι expressa representação enganosa, e εἰρηνικός caracteriza a postura pacífica que ele simulou.
- source_word: ἐπέσχεν
  choice: esperou
  rationale: No contexto, o verbo descreve a suspensão deliberada da ação até o momento oportuno.
- source_word: ἕως τῆς ἁγίας ἡμέρας τοῦ σαββάτου
  choice: até o santo dia do sábado
  rationale: Preserva tanto ἁγίας, “santo”, como a referência explícita ao sábado.
- source_word: λαβὼν ἄγοντας τοὺς Ἰουδαίους
  choice: pegando os judeus desprevenidos
  rationale: A expressão grega é condensada e provavelmente retrata o aproveitamento da vulnerabilidade dos judeus enquanto observavam o sábado; a formulação comunica naturalmente o efeito tático sem eliminar a incerteza, registrada em nota.
- source_word: τοῖς ὑφʼ ἑαυτὸν
  choice: aos homens sob seu comando
  rationale: A expressão designa seus subordinados; “homens” é suprido pelo contexto militar.
- source_word: ἐξοπλίαν παρήγγειλεν
  choice: ordenou ... que se armassem
  rationale: A combinação expressa uma ordem para equipar-se com armas, vertida de modo claro e idiomático.
theological_decisions:
- issue: Caracterização do sábado
  choice: o santo dia do sábado
  alternative: o santo sábado
  rationale: O grego chama explicitamente o dia de santo; a tradução preserva essa caracterização religiosa sem acrescentar interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa e ampla legibilidade brasileira. A oração longa do grego foi dividida em duas frases para facilitar a compreensão sem alterar a progressão dos acontecimentos.
