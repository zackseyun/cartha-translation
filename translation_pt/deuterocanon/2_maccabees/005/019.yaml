  text: But the Lord did not choose the nation for the sake of the place, but the place for the sake of the nation.
translation:
  language: pt
  text: Mas o Senhor não escolheu a nação por causa do lugar, mas escolheu o lugar por causa da nação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλʼ
  choice: Mas
  rationale: Introduz o forte contraste com a afirmação anterior de modo natural em português.
- source_word: διὰ
  choice: por causa de
  rationale: Com o acusativo, expressa aqui a razão determinante da escolha; a repetição preserva o paralelismo retórico.
- source_word: τόπον
  choice: o lugar
  rationale: Mantém o termo amplo do grego, embora no contexto se refira a Jerusalém e ao local do templo, sem explicitar mais do que o original.
- source_word: ἔθνος
  choice: a nação
  rationale: Designa o povo judeu como coletividade étnica e nacional e conserva a formulação antitética do original.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Forma portuguesa corrente para o título divino κύριος com artigo.
- source_word: ἐξελέξατο
  choice: escolheu
  rationale: Traduz diretamente o aoristo médio de ἐκλέγομαι; a repetição na segunda oração torna explícito o verbo elíptico e preserva o equilíbrio da antítese.
theological_decisions:
- issue: Relação entre o lugar sagrado e a nação escolhida
  choice: A escolha do lugar pelo Senhor é apresentada como subordinada ao seu interesse pela nação.
  alternative: O lugar teria sido escolhido de forma independente e conferiria santidade à nação.
  rationale: 'A antítese grega é explícita: não a nação por causa do lugar, mas o lugar por causa da nação. A tradução mantém essa prioridade sem acrescentar uma interpretação denominacional.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O ponto e vírgula e a expressão «pelo contrário» deixam clara a antítese compacta do grego sem alterar seu conteúdo.
