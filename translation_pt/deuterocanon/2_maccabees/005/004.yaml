  source_fidelity: O verbo ἤξιουν, de ἀξιόω, nesta construção com infinitivo, expressa um pedido ou súplica (cf. o sentido contextual de que todos desejavam/pediam um desfecho favorável), não mera expectativa. A tradução "esperavam" altera de modo relevante a atitude dos envolvidos. A construção ἐπ᾽ ἀγαθῷ ... γενέσθαι aponta para que a aparição tivesse um resultado favorável.
