base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/006.yaml
  text: But Jason kept carrying out merciless slaughter of his own fellow citizens[a], not understanding that prosperity against kinsmen is the greatest calamity[b], and thinking that he was winning trophies over enemies and not over his own countrymen.
translation:
  language: pt
  text: Mas Jasão continuava a massacrar sem piedade[a] seus próprios concidadãos, sem compreender que o êxito contra os parentes é a maior desgraça[b], e imaginando que erguia troféus sobre inimigos, e não sobre compatriotas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem poupar”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sem compreender que a prosperidade em relação aos parentes é a maior desgraça”; isto é, o aparente sucesso alcançado contra os próprios parentes é, na verdade, desastroso.
    reason: lexical_alternative
lexical_decisions:
- source_word: σφαγὰς
  choice: massacrar
  rationale: Preserva a força de matança brutal de σφαγή e funciona naturalmente com o aspecto continuativo de ἐποίει.
- source_word: τῆς πόλεως τῶν ἰδίων
  choice: seus próprios concidadãos
  rationale: Expressa tanto o vínculo cívico com os habitantes da cidade quanto a ênfase reflexiva de τῶν ἰδίων.
- source_word: ἀφειδῶς
  choice: sem piedade
  rationale: Comunica em português corrente a ação sem poupar ninguém; a alternativa mais formal 'sem poupar' é registrada em nota.
- source_word: οὐ συννοῶν
  choice: sem compreender
  rationale: Mantém o valor participial e indica que Jasão não reconhecia o verdadeiro caráter de seu aparente êxito.
- source_word: εὐημερίαν
  choice: êxito
  rationale: No contexto político-militar, designa sucesso ou resultado favorável aparente, sem sugerir apenas prosperidade material.
- source_word: δυσημερίαν
  choice: desgraça
  rationale: Conserva o contraste enfático com εὐημερίαν e soa natural e grave em português moderno.
- source_word: συγγενεῖς
  choice: parentes
  rationale: É o equivalente direto e corrente para pessoas ligadas por parentesco, preservando o aspecto familiar do termo.
- source_word: τὴν μεγίστην
  choice: a maior
  rationale: Reproduz explicitamente o superlativo grego.
- source_word: τρόπαια καταβάλλεσθαι
  choice: erguia troféus
  rationale: Preserva a imagem militar de estabelecer monumentos de vitória, em vez de reduzir a expressão ao sentido abstrato de triunfar.
- source_word: πολεμίων
  choice: inimigos
  rationale: Equivalente militar claro e direto.
- source_word: ὁμοεθνῶν
  choice: compatriotas
  rationale: Indica pessoas do mesmo povo ou nação e mantém distinção em relação a συγγενεῖς, traduzido como 'parentes'.
theological_decisions:
- issue: Avaliação moral no contraste entre êxito aparente e desgraça real
  choice: Apresentar como juízo do narrador que o êxito obtido contra os próprios parentes constitui a maior desgraça
  alternative: Traduzir de modo estritamente lexical como 'a prosperidade para com os parentes é o maior infortúnio'
  rationale: A inversão moral pertence ao próprio texto grego. 'Êxito' e 'desgraça' tornam o contraste inteligível sem acrescentar uma explicação doutrinária.
- issue: Identidade das vítimas
  choice: Distinguir 'parentes' de 'compatriotas'
  alternative: Usar 'seu próprio povo' para ambos os termos
  rationale: O grego alterna συγγενεῖς e ὁμοεθνῶν, evocando respectivamente parentesco e pertencimento ao mesmo povo; preservar a distinção mantém a tensão retórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação preserva a longa estrutura retórica do grego, mas usa construções naturais. Os marcadores [a] e [b] aparecem no texto principal e correspondem exatamente às notas.
