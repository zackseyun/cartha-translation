base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/020.yaml
  text: Therefore even the place itself[a], after sharing in the nation's misfortunes, later also shared in its benefits; and though it had been overtaken in the wrath of the Almighty, it was restored again in the reconciliation of the great Master[b], with all glory.
translation:
  language: pt
  text: Por isso, o próprio lugar, depois de participar das calamidades do povo, mais tarde também participou dos benefícios; e, depois de ter sido alcançado pela ira do Todo-Poderoso, foi novamente restaurado, com toda a glória, na reconciliação do grande Soberano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na restauração do favor do grande Soberano”. O grego diz literalmente “na reconciliação do grande Soberano” e não declara expressamente com quem ocorre a reconciliação. “Soberano” também pode ser traduzido por “Senhor”, mas o termo grego enfatiza autoridade absoluta.'
    reason: ambiguity_and_lexical_alternative
lexical_decisions:
- source_word: διόπερ
  choice: Por isso
  rationale: Expressa a forte inferência causal que liga o versículo ao relato anterior.
- source_word: αὐτὸς ὁ τόπος
  choice: o próprio lugar
  rationale: Preserva o substantivo genérico e a ênfase de αὐτός, sem explicitar 'templo' ou 'santuário' além do que o grego diz.
- source_word: συμμετασχὼν τοῦ ἔθνους δυσπετημάτων
  choice: depois de participar das calamidades do povo
  rationale: Mantém a ideia de participação conjunta; 'povo' comunica naturalmente o sentido corporativo de ἔθνος neste contexto, e 'calamidades' reflete a gravidade de δυσπετήματα.
- source_word: εὐεργετημάτων ἐκοινώνησεν
  choice: também participou dos benefícios
  rationale: Conserva o paralelismo de participação com a oração anterior e traduz εὐεργετήματα de modo amplo, sem restringi-lo a bênçãos exclusivamente espirituais.
- source_word: καταληφθεὶς ἐν τῇ τοῦ παντοκράτορος ὀργῇ
  choice: atingido pela ira do Todo-Poderoso
  rationale: Formulação natural em português para o lugar alcançado pelo juízo divino; 'Todo-Poderoso' é a tradução bíblica corrente de παντοκράτωρ.
- source_word: ἐν τῇ τοῦ μεγάλου δεσπότου καταλλαγῇ
  choice: quando o grande Soberano se reconciliou com o povo
  rationale: Torna explícitos em português os participantes exigidos pelo sentido contextual da expressão nominal grega, mas assinala em nota a formulação mais literal e sua ambiguidade. 'Soberano' preserva a autoridade absoluta de δεσπότης e o distingue de κύριος.
- source_word: μετὰ πάσης δόξης ἐπανωρθώθη
  choice: foi novamente restaurado, com toda a glória
  rationale: Preserva tanto a restauração/reerguimento do lugar quanto a plenitude de sua glória.
theological_decisions:
- issue: Distinção entre os títulos divinos παντοκράτωρ e δεσπότης
  choice: Todo-Poderoso ... grande Soberano
  alternative: Todo-Poderoso ... grande Senhor
  rationale: O texto emprega títulos diferentes. 'Soberano' comunica a autoridade absoluta de δεσπότης sem nivelá-lo a κύριος.
- issue: Sentido relacional de καταλλαγή
  choice: quando o grande Soberano se reconciliou com o povo
  alternative: na reconciliação do grande Soberano
  rationale: O contexto contrasta a ira divina com a renovação do favor e a restauração do lugar. Como a construção nominal grega não nomeia expressamente a outra parte da reconciliação, a explicitação contextual de 'com o povo' é marcada em nota para preservar a ambiguidade formal.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. Evitou-se especificar 'santuário' no corpo do texto, preservando 'lugar'. A única nota registra tanto a ambiguidade sintática de καταλλαγή quanto a alternativa lexical para δεσπότης.
