  text: And he confined all the Jews to the spectacle, and, rushing into the city with weapons, he brought down a considerable slaughter.
translation:
  language: pt
  text: Ele confinou todos os judeus no local do espetáculo[a] e, entrando de rompante na cidade com armas, matou um grande número de pessoas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na festa” ou “na exibição pública”; o grego θεωρία pode designar uma ocasião de contemplação pública ou um espetáculo festivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρίαν
  choice: espetáculo
  rationale: O termo pode designar a ocasião pública de contemplação, exibição ou festa. “Espetáculo” conserva essa amplitude concreta sem definir além do que o grego permite.
- source_word: συνεκέκλεισεν
  choice: confinou
  rationale: Expressa o ato coercivo de encerrar ou manter um grupo reunido dentro de limites.
- source_word: εἰσδραμὼν
  choice: entrando impetuosamente
  rationale: Preserva a rapidez e a força da entrada indicada pelo particípio grego, em português natural e digno.
- source_word: σὺν τοῖς ὅπλοις
  choice: com as armas
  rationale: Mantém a referência explícita às armas, em vez de reduzi-la simplesmente a “armado”.
- source_word: ἱκανὰ ... πλήθη
  choice: uma grande multidão
  rationale: O grego indica um número considerável de pessoas; a formulação conserva a magnitude sem impor uma contagem específica.
- source_word: κατέστησεν ... πλήθη
  choice: fez cair ... uma grande multidão
  rationale: A construção grega é condensada e, no contexto de uma incursão armada, denota que muitos foram abatidos. “Fez cair” preserva a imagem verbal sem transformar πλήθη no substantivo abstrato “mortandade”.
