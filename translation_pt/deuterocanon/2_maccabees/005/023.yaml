base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/023.yaml
  text: and in Gerizim[a], Andronicus; and besides these, Menelaus surpassed the others in wickedness toward the citizens[b], having a hateful disposition toward the Jewish citizens.
translation:
  language: pt
  text: E em Garizim[a], Andrônico; além desses, Menelau superava os outros em maldade contra os cidadãos[b], tendo uma disposição hostil para com os cidadãos judeus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «no Garizim».'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, «superava os outros nas piores coisas»; ou: «era pior do que os outros».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ Γαριζεὶν
  choice: e, no Garizim
  rationale: A expressão indica o local ou a jurisdição confiada a Andrônico. Em português, «no Garizim» é natural para a referência geográfica; a alternativa mais formal «em Garizim» é registrada em nota.
- source_word: Ἀνδρόνικον
  choice: Andrônico
  rationale: Forma portuguesa tradicional e reconhecível do nome grego.
- source_word: πρὸς δὲ τούτοις
  choice: além desses
  rationale: Preserva o valor aditivo do conector, incluindo Menelau entre as autoridades anteriormente mencionadas.
- source_word: Μενέλαον
  choice: Menelau
  rationale: Forma portuguesa tradicional do nome grego.
- source_word: χείριστα τῶν ἄλλων ὑπερήρτετο
  choice: superava os outros em maldade
  rationale: Conserva tanto a comparação expressa pelo verbo quanto a forte censura moral de χείριστα, sem reduzir a frase simplesmente a «era pior».
- source_word: τοῖς πολίταις
  choice: contra os cidadãos
  rationale: O dativo identifica as pessoas atingidas pela conduta de Menelau; «contra» torna clara essa relação adversa em português.
- source_word: ἀπεχθῆ ... διάθεσιν
  choice: uma atitude hostil
  rationale: διάθεσις descreve a disposição ou atitude, e ἀπεχθής comunica aversão e hostilidade. «Atitude hostil» é corrente e evita que «odiosa» seja entendida apenas como desagradável.
- source_word: πρὸς τοὺς πολίτας Ἰουδαίους
  choice: para com os cidadãos judeus
  rationale: Mantém explicitamente tanto a identidade cívica quanto a identidade judaica presentes no grego.
- source_word: ἔχων
  choice: pois mantinha
  rationale: Explicita de modo natural a ligação circunstancial do particípio com a oração principal e comunica o caráter contínuo da atitude.
theological_decisions:
- issue: Se πολίταις / πολίτας deve ser generalizado como «povo» ou preservado como «cidadãos»
  choice: Preservar «cidadãos» nas duas ocorrências.
  alternative: «povo» ou «compatriotas»
  rationale: A repetição de πολίτης destaca a dimensão cívica e social da hostilidade, não apenas a identidade étnica. A tradução mantém essa ênfase sem acrescentar uma interpretação denominacional.
- issue: Intensidade de χείριστα τῶν ἄλλων ὑπερήρτετο
  choice: «superava os outros em maldade»
  alternative: «era pior do que os outros»
  rationale: A formulação escolhida retém o movimento comparativo de ὑπερήρτετο e a censura enfática de χείριστα, preservando a força do original.
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas correntes em português. A estrutura fragmentária inicial foi mantida porque o versículo continua a enumeração iniciada no contexto anterior. A repetição de «cidadãos» reproduz deliberadamente a repetição grega.
