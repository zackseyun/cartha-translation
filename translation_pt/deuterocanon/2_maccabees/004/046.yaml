  yaml_path: translation/deuterocanon/2_maccabees/004/046.yaml
  text: But Menelaus[a], already having been won over, promised Ptolemy son of Dorymenes a considerable amount of money to persuade the king.
translation:
  language: pt
  text: Menelau, porém, já tendo sido conquistado[a], prometeu a Ptolomeu, filho de Dorímenes, uma soma considerável de dinheiro para que persuadisse o rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «já tendo conquistado favor» ou «já tendo sido ganho favoravelmente». O particípio grego λελιμμένος é difícil; pode indicar que Menelau já havia obtido ou recebido uma disposição favorável antes de prometer esse dinheiro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λελιμμένος
  choice: estava em apuros
  rationale: O particípio perfeito, de sentido difícil neste contexto, parece descrever Menelau como já reduzido a uma situação de necessidade ou forte pressão. A formulação evita a leitura de que ele próprio teria sido conquistado ou subornado, que não se ajusta bem à construção nem ao desenrolar da cena.
- source_word: ἐπηγγείλατο
  choice: prometeu
  rationale: O verbo no médio indica que Menelau se comprometeu a dar ou pagar a quantia mencionada.
- source_word: χρήματα ἱκανὰ
  choice: uma soma considerável de dinheiro
  rationale: χρήματα designa dinheiro ou recursos, e ἱκανά indica quantidade suficiente ou substancial; a expressão portuguesa comunica uma promessa financeira vultosa sem exagerar o valor.
- source_word: τῷ Πτολεμαίῳ Δορυμένους
  choice: a Ptolomeu, filho de Dorímenes
  rationale: O dativo identifica o destinatário da promessa, e o genitivo Δορυμένους funciona naturalmente como patronímico.
- source_word: πρὸς τὸ πεῖσαι τὸν βασιλέα
  choice: para que este persuadisse o rei
  rationale: A construção com πρὸς e infinitivo articular expressa finalidade. “Este” retoma Ptolomeu, o destinatário do dinheiro e agente implícito mais provável da persuasão.
