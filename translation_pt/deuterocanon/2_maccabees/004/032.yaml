base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/032.yaml
  text: But Menelaus[a], thinking that he had found a favorable opportunity, embezzled some of the gold vessels of the temple and gave them as a gift to Andronicus[b], and he had managed to sell others in Tyre and the surrounding cities.
translation:
  language: pt
  text: Mas Menelau, julgando ter encontrado uma ocasião favorável, apropriou-se indevidamente de alguns objetos de ouro pertencentes ao templo e os deu de presente a Andrônico; outros ele já havia vendido em Tiro e nas cidades vizinhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νομίσας
  choice: julgando
  rationale: O particípio aoristo introduz a avaliação subjetiva de Menelau; “julgando” é natural e preserva esse caráter.
- source_word: καιρὸν εὐφυῆ
  choice: uma ocasião favorável
  rationale: A expressão indica uma oportunidade especialmente adequada ou vantajosa.
- source_word: χρυσώματά τινα
  choice: alguns objetos de ouro
  rationale: O termo designa genericamente artigos de ouro; evita restringi-lo sem necessidade a vasos ou utensílios.
- source_word: τῶν τοῦ ἱεροῦ
  choice: pertencentes ao templo
  rationale: O genitivo assinala que os objetos eram propriedade do templo.
- source_word: νοσφισάμενος
  choice: apropriou-se indevidamente
  rationale: Expressa a apropriação ilícita de bens alheios ou confiados, com clareza e dignidade em português corrente.
- source_word: ἐχαρίσατο
  choice: os deu de presente
  rationale: Preserva a ideia de conceder algo como presente ou favor, própria do verbo no contexto.
- source_word: ἕτερα
  choice: outros
  rationale: Retoma de forma clara outros objetos de ouro do templo.
- source_word: ἐτύγχανεν πεπρακὼς
  choice: já havia vendido
  rationale: Comunica naturalmente o estado resultante de uma venda anterior; a nuance incidental de τυγχάνω é difícil de conservar sem artificialidade.
- source_word: εἴς τε Τύρον καὶ τὰς κύκλῳ πόλεις
  choice: em Tiro e nas cidades vizinhas
  rationale: Indica de modo idiomático os lugares onde os demais objetos foram vendidos.
theological_decisions:
- issue: Natureza da transgressão de Menelau contra os bens do templo
  choice: “apropriou-se indevidamente”
  alternative: “desviou” ou “furtou”
  rationale: A formulação mantém a gravidade da apropriação ilícita de bens sagrados sem impor uma categoria jurídica moderna excessivamente específica.
