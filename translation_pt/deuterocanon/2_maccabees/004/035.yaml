lexical_decisions:
- source_word: διʼ ἣν αἰτίαν
  choice: Por essa razão
  rationale: Expressa de modo natural o nexo causal com o acontecimento anterior, mantendo-se próxima do grego.
- source_word: οὐ μόνον ... δὲ καὶ
  choice: não somente ... mas também
  rationale: Reproduz a construção correlativa e sua ampliação enfática em português claro e corrente.
- source_word: Ἰουδαῖοι
  choice: os judeus
  rationale: O contraste com os demais povos indica aqui o povo judeu, e não apenas habitantes da Judeia.
- source_word: πολλοὶ
  choice: muitos
  rationale: Equivalente quantitativo direto, natural e suficiente.
- source_word: τῶν ἄλλων ἐθνῶν
  choice: dos outros povos
  rationale: Neste contexto, ἔθνη designa outros grupos étnicos ou nacionais. “Povos” torna clara a contraposição sem importar terminologia neotestamentária específica.
theological_decisions:
