  yaml_path: translation/deuterocanon/2_maccabees/004/027.yaml
  text: But Menelaus held on to the office[a], yet he made no provision at all for the money he had promised to the king.
translation:
  language: pt
  text: Menelau, porém, conservava o cargo, mas não tomava nenhuma providência quanto ao dinheiro que havia prometido ao rei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, explicitando o sentido: “não pagava nada do dinheiro que havia prometido ao rei”. O grego diz literalmente que ele “nada punha em ordem” quanto ao dinheiro prometido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχῆς
  choice: cargo
  rationale: No contexto, designa o posto oficial — o sumo sacerdócio — que Menelau continuava a ocupar, e não autoridade em sentido abstrato.
- source_word: ἐκράτει
  choice: mantinha-se
  rationale: O imperfeito expressa posse continuada; a formulação natural em português indica que Menelau permanecia no cargo.
- source_word: ἐπηγγελμένων
  choice: havia prometido
  rationale: O particípio remete à promessa anterior de determinadas quantias ao rei.
- source_word: χρημάτων
  choice: dinheiro
  rationale: O substantivo se refere concretamente aos recursos monetários prometidos ao rei.
- source_word: οὐδὲν εὐτάκτει
  choice: não providenciava absolutamente nada a respeito
  rationale: Preserva a ideia lexical de organizar ou tomar providências sem transformar implicitamente o verbo em 'pagar'; no contexto, as providências seriam para entregar o dinheiro prometido.
