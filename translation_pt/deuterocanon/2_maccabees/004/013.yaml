base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/013.yaml
  text: And there was such a height of Hellenism and an increase of foreign ways because of the surpassing shamelessness of Jason[a], who was ungodly and not the high priest,
translation:
  language: pt
  text: Foi tamanho o auge do helenismo e o avanço dos costumes estrangeiros[a], por causa da desmedida falta de vergonha de Jasão, que era ímpio e não era sumo sacerdote,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a penetração de práticas estrangeiras”. O raro termo grego aponta para a difusão de costumes não nativos, isto é, não judaicos.'
    reason: Alternativa lexical para πρόσβασις ἀλλοφυλισμοῦ e esclarecimento do raro ἀλλοφυλισμός.
lexical_decisions:
- source_word: ἀκμή
  choice: auge
  rationale: Expressa o ponto culminante ou o grau máximo de desenvolvimento e preserva naturalmente a metáfora do grego.
- source_word: Ἑλληνισμός
  choice: helenismo
  rationale: Mantém a especificidade histórica da adoção da cultura e dos costumes gregos, sem reduzir o termo a mera identidade étnica.
- source_word: πρόσβασις
  choice: avanço
  rationale: Comunica o movimento crescente ou a penetração de práticas estrangeiras; a nota registra uma alternativa que ressalta a ideia de incursão.
- source_word: ἀλλοφυλισμός
  choice: costumes estrangeiros
  rationale: O termo raro indica a adoção de práticas não nativas, especialmente não judaicas. Esta formulação é clara em português sem esconder sua dimensão cultural.
- source_word: διὰ
  choice: por causa de
  rationale: Com acusativo, a preposição introduz aqui a causa.
- source_word: ὑπερβάλλουσαν ἀναιδείαν
  choice: desmedida falta de vergonha
  rationale: Reproduz a intensificação de ἀναιδεία e sua forte censura moral em português atual e inteligível.
- source_word: ἀσεβοῦς
  choice: ímpio
  rationale: Preserva a condenação religiosa do comportamento de Jasão em registro bíblico corrente.
- source_word: οὐκ ἀρχιερέως
  choice: não era sumo sacerdote
  rationale: Mantém a negação direta e polêmica da legitimidade sacerdotal de Jasão sem acrescentar qualificadores interpretativos como “verdadeiro” ou “legítimo”.
theological_decisions:
- issue: Força de οὐκ ἀρχιερέως com referência a Jasão
  choice: “não era sumo sacerdote”, como negação direta de sua condição sacerdotal
  alternative: “não era um verdadeiro sumo sacerdote” ou “não era sumo sacerdote legítimo”
  rationale: O grego faz uma denúncia incisiva, mas não contém os adjetivos “verdadeiro” ou “legítimo”. A tradução conserva a tensão e evita explicitar além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Helenismo” preserva o termo histórico; “falta de vergonha” evita a rigidez de “desvergonha” sem enfraquecer a censura. A vírgula final foi mantida porque o versículo continua sintaticamente no contexto imediato.
