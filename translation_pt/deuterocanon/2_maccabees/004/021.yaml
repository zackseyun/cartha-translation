base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/021.yaml
  text: When Apollonius son of Menestheus had been sent to Egypt for the accession festivities of King Philometor[a], Antiochus, learning that he had become estranged from his own affairs, took thought for his own security. Therefore, after arriving at Joppa, he went on to Jerusalem.
translation:
  language: pt
  text: Depois que Apolônio, filho de Menesteu, foi enviado ao Egito para as festividades da ascensão ao trono do rei Filométor, Antíoco, ao saber que estava alheio aos acontecimentos que lhe diziam respeito[a], cuidou da própria segurança. Por isso, depois de chegar a Jope, seguiu para Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ao perceber que os acontecimentos relativos a ele lhe eram alheios». A expressão grega é condensada; pode indicar, de modo mais amplo, que Antíoco se via desligado ou em desvantagem em seus próprios assuntos políticos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποσταλέντος
  choice: foi enviado
  rationale: O particípio aoristo passivo introduz a circunstância anterior; em português, a forma finita dentro da oração temporal é natural e mantém a sequência narrativa.
- source_word: διὰ τὰ προτοκλήρια
  choice: para as festividades da ascensão ao trono
  rationale: O substantivo raro designa celebrações ligadas à entronização ou assunção formal do poder; a formulação é clara sem recorrer a uma tradução literal obscura.
- source_word: τοῦ φιλομήτορος βασιλέως
  choice: do rei Filométor
  rationale: Φιλομήτωρ é o epíteto régio pelo qual o soberano egípcio é identificado; sua transliteração preserva a referência histórica.
- source_word: μεταλαβὼν
  choice: ao saber
  rationale: No contexto, indica que Antíoco tomou conhecimento ou percebeu a situação; «ao saber» é idiomático e não acrescenta uma fonte de informação inexistente no grego.
- source_word: ἀλλότριον αὐτὸν τῶν αὐτοῦ γεγονότων πραγμάτων
  choice: que havia ficado alheio aos assuntos que lhe diziam respeito
  rationale: A construção grega é condensada e ambígua. Esta versão conserva a ideia de alienação ou afastamento expressa por ἀλλότριον e o estado resultante de γεγονότων, sem definir em excesso a natureza política dos assuntos.
- source_word: τῆς καθʼ αὑτὸν ἀσφαλίας ἐφρόντιζεν
  choice: passou a cuidar da própria segurança
  rationale: ἐφρόντιζεν expressa preocupação ativa ou providência, e ἀσφάλεια denota segurança pessoal ou política; a redação portuguesa é natural e deliberativa.
- source_word: παραγενόμενος
  choice: depois de chegar
  rationale: O particípio aoristo marca ação anterior à chegada subsequente a Jerusalém e estabelece com clareza a sequência temporal.
- source_word: κατήντησεν
  choice: seguiu para
  rationale: Expressa o movimento posterior até Jerusalém e evita repetir «chegou» logo após a referência à chegada a Jope.
theological_decisions:
- issue: Epíteto histórico Φιλομήτωρ
  choice: 'tratado como nome ou título régio: «Filométor»'
  alternative: traduzi-lo literalmente como «amigo da mãe» ou «que ama a mãe»
  rationale: O termo identifica historicamente o rei egípcio e funciona aqui como epíteto próprio; a tradução literal obscureceria a referência e soaria artificial.
- issue: Referente da expressão ἀλλότριον αὐτὸν τῶν αὐτοῦ γεγονότων πραγμάτων
  choice: manter Antíoco como sujeito de um estado de afastamento em relação aos assuntos que lhe diziam respeito
  alternative: entender que a missão ou situação de Apolônio era contrária aos interesses de Antíoco
  rationale: A concordância masculina de ἀλλότριον com αὐτόν e o perfeito γεγονότων favorecem a leitura de um estado em que Antíoco havia ficado alheio; porém, a frase permanece comprimida, e a nota registra a alternativa sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com formas correntes no Brasil e inteligibilidade internacional. «Jope» e «Filométor» seguem as formas tradicionais portuguesas; a sintaxe evita literalismo opaco, mas preserva por nota a ambiguidade central do grego.
