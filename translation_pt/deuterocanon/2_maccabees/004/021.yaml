revisions:
- from: Quando Apolônio, filho de Menesteu, foi enviado ao Egito para as festividades da ascensão ao trono do rei Filométor, Antíoco, ao saber que havia ficado alheio aos assuntos que lhe diziam respeito[a], passou a cuidar da própria segurança. Por isso, depois de chegar a Jope, seguiu para Jerusalém.
  to: Depois que Apolônio, filho de Menesteu, foi enviado ao Egito para as festividades da ascensão ao trono do rei Filométor, Antíoco, ao saber que estava alheio aos acontecimentos que lhe diziam respeito[a], cuidou da própria segurança. Por isso, depois de chegar a Jope, seguiu para Jerusalém.
