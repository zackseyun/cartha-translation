  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. “Suplantado” preserva a simetria verbal e o sentido de substituição obtida por manobra desleal; a nota registra uma alternativa mais explícita, embora menos formal.
