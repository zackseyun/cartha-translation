  yaml_path: translation/deuterocanon/2_maccabees/004/026.yaml
  text: And Jason[a], who had supplanted his own brother, having himself been supplanted by another, fled and went into the land of the Ammonites.
translation:
  language: pt
  text: E Jasão[a], que havia suplantado o próprio irmão, depois de ser ele mesmo suplantado por outro, fugiu e foi para a terra dos amonitas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que havia passado para trás o próprio irmão... depois de ser ele mesmo passado para trás por outro”. O grego emprega o mesmo verbo nas formas ativa e passiva para destacar a reversão irônica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπονοθεύσας
  choice: havia suplantado
  rationale: Expressa a ação anterior de Jasão ao tomar o lugar do irmão por meios desleais e permite conservar, em português, a repetição retórica do mesmo verbo na voz ativa e na passiva.
- source_word: ὑπονοθευθεὶς
  choice: depois de ser ele mesmo suplantado
  rationale: 'Repete o verbo da oração anterior e torna clara a reversão irônica: Jasão sofre de outro aquilo que havia feito ao próprio irmão.'
- source_word: φυγάς ... ὑπῆλθεν
  choice: fugiu para
  rationale: Combina de modo natural em português a condição de fugitivo com o movimento para outro território, sem tornar a frase pesada.
- source_word: τὴν Ἀμμανῖτιν χώραν
  choice: a terra dos amonitas
  rationale: Tradução clara e corrente do adjetivo étnico com χώρα, preservando a referência ao território associado aos amonitas.
- source_word: τὸν ἴδιον ἀδελφὸν
  choice: o próprio irmão
  rationale: Mantém a força enfática de ἴδιον e ressalta que a deslealdade foi praticada contra seu próprio irmão.
