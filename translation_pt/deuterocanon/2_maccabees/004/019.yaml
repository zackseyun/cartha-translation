base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/019.yaml
  text: Jason the vile man sent Antiochians from Jerusalem as envoys, carrying three hundred silver drachmas for the sacrifice to Heracles; but those who carried them requested that they not be used for sacrifice,
translation:
  language: pt
  text: Jasão, aquele homem abominável, enviou antioquenos como delegados, como representantes de Jerusalém,[a] levando trezentas dracmas de prata para o sacrifício a Héracles. Contudo, os próprios portadores pediram que o dinheiro não fosse usado para sacrifício,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como vindos de Jerusalém”. O grego pode indicar que eles se apresentavam como provenientes de Jerusalém ou que atuavam em sua representação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μιερὸς
  choice: aquele homem abominável
  rationale: O adjetivo é fortemente pejorativo e expressa a condenação moral e religiosa do narrador. “Abominável” preserva essa força em português atual e digno.
- source_word: θεωρούς
  choice: delegados
  rationale: O termo designa representantes oficiais, muitas vezes enviados a uma celebração ou cerimônia religiosa. “Delegados” comunica o caráter representativo sem impor no texto principal uma tecnicidade cultual.
- source_word: ὡς ἀπʼ Ἱεροσολύμων
  choice: vindos de Jerusalém
  rationale: A formulação indica origem apresentada ou capacidade representativa. A tradução principal permanece natural, enquanto a nota conserva a nuance explícita de ὡς.
- source_word: Ἀντιοχέας
  choice: antioquenos
  rationale: O acusativo plural designa pessoas associadas a Antioquia; “antioquenos” é o gentílico português claro e tradicional.
- source_word: παρακομίζοντας
  choice: levando
  rationale: O particípio descreve o transporte da quantia e é vertido de modo direto e natural.
- source_word: ἀργυρίου δραχμὰς τριακοσίους
  choice: trezentas dracmas de prata
  rationale: Preserva tanto a quantidade quanto o material da moeda, em ordem idiomática no português.
- source_word: εἰς τὴν τοῦ Ἡρακλέους θυσίαν
  choice: para o sacrifício a Héracles
  rationale: Expressa claramente que a quantia se destinava a uma oferta sacrificial dirigida a Héracles.
- source_word: ἠξίωσαν
  choice: pediram
  rationale: No contexto, o verbo indica uma solicitação ou reivindicação. “Pediram” evita elevar indevidamente sua força para “exigiram”.
- source_word: μὴ χρησθαι εἰς θυσίαν
  choice: que o dinheiro não fosse usado para sacrifício
  rationale: Torna inequívoca em português a referência à quantia transportada, sem alterar o sentido do infinitivo grego.
theological_decisions:
- issue: Julgamento moral do narrador em μιερὸς
  choice: Preservar a condenação explícita com “aquele homem abominável”
  alternative: “o homem impuro” ou “o homem maldito”
  rationale: A avaliação hostil pertence ao próprio texto grego e não deve ser suavizada nem tratada como doutrina acrescentada pelo tradutor.
- issue: Nuance representativa de ὡς ἀπʼ Ἱεροσολύμων
  choice: Usar “vindos de Jerusalém” no texto e registrar a ambiguidade em nota
  alternative: “como se fossem enviados de Jerusalém” ou “em nome de Jerusalém”
  rationale: O grego pode marcar origem alegada ou representação. A opção principal não resolve de modo excessivo essa tensão, e a nota informa a leitura mais formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém o tom condenatório do narrador, o vocabulário histórico e a frase incompleta do trecho-fonte, que prossegue no versículo seguinte.
