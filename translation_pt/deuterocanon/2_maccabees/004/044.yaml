lexical_decisions:
- source_word: Περὶ δὲ τούτων
  choice: Quanto a essas questões
  rationale: Περί com o genitivo introduz o assunto, enquanto δέ assinala uma transição no discurso. “Quanto a” reproduz essa passagem de tema sem acrescentar um advérbio temporal inexistente no grego.
- source_word: ἐνέστη
  choice: instaurou-se
  rationale: No contexto jurídico formado por κρίσις e ἐπὶ τὸν Μενέλαον, o verbo expressa o início ou surgimento de um procedimento. “Instaurou-se” é natural em português jurídico e preserva essa ideia.
- source_word: κρίσις
  choice: um processo
  rationale: κρίσις pode designar julgamento, decisão ou procedimento judicial. “Processo” comunica aqui a existência de uma ação formal sem especificar indevidamente uma etapa processual.
- source_word: ἐπὶ τὸν Μενέλαον
  choice: contra Menelau
  rationale: Em contexto jurídico, ἐπί com o acusativo indica que a ação se dirige contra uma pessoa. “Contra Menelau” é a formulação portuguesa mais clara e idiomática.
