  text: Quanto a essas questões, instaurou-se um processo contra Menelau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “surgiu um processo judicial contra Menelau”. A expressão grega é concisa e também pode indicar que se iniciaram procedimentos legais.'
