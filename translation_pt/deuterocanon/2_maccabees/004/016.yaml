base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/016.yaml
  text: 'For this reason a harsh crisis surrounded them: those whose ways they envied and whom they wanted to imitate became their enemies and punishers[a][b].'
translation:
  language: pt
  text: 'Por esse motivo[a], uma grave aflição os cercou: aqueles cujo modo de vida[b] invejavam e aos quais desejavam se assemelhar, passaram a tê-los como seus inimigos e castigadores.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Por causa deles”; a expressão grega pode apontar especificamente para as pessoas mencionadas anteriormente como causa da aflição que se seguiu.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “costumes”, “conduta” ou “maneira de viver”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν καὶ χάριν
  choice: Por esse motivo
  rationale: A construção χάριν com genitivo expressa causa. A formulação é natural em português e retoma o contexto anterior, enquanto a nota registra que o pronome grego pode apontar mais especificamente para as pessoas mencionadas.
- source_word: περιεῖχεν
  choice: os cercou
  rationale: O verbo comunica a ideia de envolver ou encerrar por todos os lados; com περίστασις, retrata a aflição que se fecha ao redor deles.
- source_word: χαλεπὴ περίστασις
  choice: uma grave aflição
  rationale: περίστασις designa aqui uma condição opressiva ou adversidade, e χαλεπή acentua sua severidade. A expressão escolhida é clara, digna e preserva o peso negativo.
- source_word: ἐζήλουν
  choice: invejavam
  rationale: ζηλόω pode indicar zelo, emulação ou inveja. Neste contexto de desejo de adotar o modo de vida alheio, o sentido de admiração cobiçosa e moralmente censurada é adequado.
- source_word: τὰς ἀγωγὰς
  choice: modo de vida
  rationale: ἀγωγή pode designar conduta, costumes, formação ou maneira de viver. No contexto, refere-se amplamente às práticas e ao estilo de vida estrangeiros.
- source_word: καθʼ ἃ ἤθελον ἐξομοιοῦσθαι
  choice: aos quais desejavam se assemelhar
  rationale: ἐξομοιόομαι significa tornar-se semelhante ou conformar-se a alguém. A tradução conserva a referência pessoal do relativo e soa natural em português.
- source_word: πολεμίους
  choice: inimigos
  rationale: Equivalente direto e corrente para os que se mostram hostis.
- source_word: τιμωρητὰς
  choice: castigadores
  rationale: τιμωρητής designa quem aplica castigo ou exige reparação. “Castigadores” preserva a ideia de retribuição sem especificar indevidamente se ela é judicial ou vingativa.
- source_word: ἔσχον
  choice: tornaram-se
  rationale: Embora o verbo signifique literalmente “tiveram”, a relação resultante é expressa com naturalidade em português por “tornaram-se”, deixando claro que os admirados acabaram na posição de inimigos e castigadores.
theological_decisions:
- issue: Força moral da adoção de práticas estrangeiras
  choice: 'O versículo é apresentado como retribuição irônica: aqueles cujo modo de vida era invejado tornaram-se inimigos e castigadores.'
  alternative: Uma declaração mais neutra, segundo a qual pessoas antes admiradas posteriormente passaram a combatê-los.
  rationale: O emprego de ἐζήλουν e τιμωρητάς, no argumento mais amplo do capítulo, sustenta uma avaliação negativa e uma consequência correspondente. A tradução mantém essa força sem acrescentar uma explicação doutrinária alheia ao texto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A estrutura de consequência irônica foi preservada, assim como a metáfora da aflição que os cerca.
