  yaml_path: translation/deuterocanon/2_maccabees/004/050.yaml
  text: But Menelaus[a], because of the greed of those in power, remained in office, growing in wickedness and having become a great plotter against his fellow citizens.
translation:
  language: pt
  text: Mas Menelau, por causa da ganância dos que detinham o poder[a], permaneceu no cargo, crescendo em maldade e tendo-se tornado um grande conspirador contra seus concidadãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pela cobiça dos governantes”. A expressão grega admite essa tradução mais formal; no texto principal, ela é apresentada de modo natural com seu sentido causal.'
    reason: alternativa lexical
lexical_decisions:
- source_word: διὰ τὰς τῶν κρατούντων πλεονεξίας
  choice: por causa da ganância dos que detinham o poder
  rationale: διά com o acusativo tem sentido causal. πλεονεξία indica ganância, cobiça ou avareza, e οἱ κρατοῦντες são os que exerciam o poder. A formulação é natural em português e preserva o sentido político.
- source_word: ἔμενεν ἐπὶ τῇ ἀρχῇ
  choice: permaneceu no cargo
  rationale: Neste contexto, ἀρχή designa cargo ou posição de autoridade. “Permaneceu no cargo” expressa o sentido administrativo sem sugerir poder político absoluto.
- source_word: ἐπιφυόμενος τῇ κακίᾳ
  choice: crescendo em maldade
  rationale: O particípio comunica desenvolvimento ou aumento contínuo, enquanto κακία denota maldade moral. A expressão conserva esse aspecto progressivo de modo claro.
- source_word: μέγας τῶν πολιτῶν ἐπίβουλος καθεστώς
  choice: tendo-se tornado um grande conspirador contra seus concidadãos
  rationale: ἐπίβουλος descreve alguém que trama contra outros, e o genitivo τῶν πολιτῶν indica o alvo dessas maquinações. “Concidadãos” preserva a relação cívica, e o particípio perfeito καθεστώς é apresentado como estado resultante.
