base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/025.yaml
  text: But after receiving the royal commands[a], he arrived, bringing nothing worthy of the high priesthood[c][b], but having the passions of a cruel tyrant and the rage of a barbarous beast.
translation:
  language: pt
  text: Depois de receber as ordens do rei[a], ele chegou sem trazer consigo nada que fosse digno do sumo sacerdócio[b]; pelo contrário, tinha os impulsos violentos de um tirano cruel e os acessos de ira de uma fera selvagem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «as ordens reais».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «sem possuir nada condizente com o sumo sacerdócio».'
    reason: lexical_alternative
  - marker: c
    text: O grego emprega dois termos parcialmente sobrepostos, aqui traduzidos por «impulsos violentos» e «acessos de ira», para intensificar o retrato de sua violência.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν δὲ τὰς βασιλικὰς ἐντολὰς
  choice: Depois de receber as ordens do rei
  rationale: O particípio aoristo indica ação anterior à chegada; «depois de receber» expressa essa relação com naturalidade. «Ordens do rei» comunica o sentido de βασιλικάς sem sugerir apenas uma qualidade abstratamente régia.
- source_word: παρεγίνετο
  choice: ele chegou
  rationale: O verbo descreve sua chegada ou comparecimento ao local; «chegou» é claro e adequado à narrativa.
- source_word: τῆς μὲν ἀρχιερωσύνης οὐδὲν ἄξιον φέρων
  choice: sem trazer consigo nada que fosse digno do sumo sacerdócio
  rationale: Preserva a imagem de φέρων e a avaliação explícita de que ele não possuía nem apresentava nada condizente com o ofício.
- source_word: ἀρχιερωσύνης
  choice: sumo sacerdócio
  rationale: Designa o cargo e a condição de sumo sacerdote, conforme o uso tradicional e inteligível em português.
- source_word: θυμοὺς
  choice: impulsos violentos
  rationale: No plural, θυμοί pode indicar ímpetos, arroubos ou disposições passionais violentas. A escolha mantém distinção em relação a ὀργάς e evita o sentido moderno mais amplo e potencialmente ambíguo de «paixões».
- source_word: ὠμοῦ τυράννου
  choice: de um tirano cruel
  rationale: ὠμός, aplicado a uma pessoa, exprime crueldade e brutalidade. «Cruel» é direto, forte e natural em português.
- source_word: θηρὸς βαρβάρου
  choice: de uma fera selvagem
  rationale: θηρίον/θήρ designa animal selvagem ou fera, e βάρβαρος aqui intensifica a brutalidade. «Fera selvagem» preserva a imagem sem sugerir primariamente uma identidade étnica.
- source_word: ὀργὰς ἔχων
  choice: tinha os acessos de ira
  rationale: O plural ὀργάς sugere manifestações ou disposições reiteradas de ira. «Acessos de ira» mantém o plural e intensifica o retrato, distinguindo-o de θυμούς.
theological_decisions:
- issue: Caracterização moral de Menelau em contraste com o sumo sacerdócio
  choice: 'Manter a condenação enfática: ele não tinha nada digno do ofício, mas exibia disposições tirânicas e animalescas.'
  alternative: Abrandar a frase como simples crítica à sua competência política ou administrativa.
  rationale: O grego estabelece deliberadamente um contraste entre οὐδὲν ἄξιον da dignidade sacerdotal e os θυμοί/ὀργαί de tirano e fera. A tradução conserva essa tensão ética sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura contrastiva foi tornada natural por «pelo contrário», sem apagar a força retórica do grego. Os marcadores aparecem junto às expressões pertinentes e em ordem alfabética.
