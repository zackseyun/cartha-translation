base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/001.yaml
  text: But the previously mentioned Simon[a], who had become an informer against the money and the homeland, kept slandering Onias, as though he were the one who had incited Heliodorus and had become the author of the troubles.
translation:
  language: pt
  text: Mas o já mencionado Simão, que se tornara delator do dinheiro e da pátria, continuava caluniando Onias, como se este tivesse incitado Heliodoro e se tornado o causador das desgraças.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o causador dos males”. A expressão grega pode referir-se de modo amplo a acontecimentos nocivos ou desgraças, e não necessariamente apenas ao mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: προειρημένος
  choice: já mencionado
  rationale: Expressa de modo natural e atual a referência retrospectiva do particípio, sem tom arcaico.
- source_word: ἐνδείκτης
  choice: delator
  rationale: Preserva o sentido hostil de quem denuncia ou fornece informação contra alguém ou algo.
- source_word: τῶν χρημάτων
  choice: dos recursos
  rationale: O plural grego designa dinheiro ou bens financeiros; “recursos” é natural no contexto e evita especificar expressamente o tesouro do templo.
- source_word: τῆς πατρίδος
  choice: da pátria
  rationale: Mantém o valor coletivo e patriótico de πατρίς em português corrente e digno.
- source_word: ἐκακολόγει
  choice: continuava caluniando
  rationale: A forma no imperfeito indica ação contínua ou repetida, enquanto “caluniando” comunica o caráter difamatório da fala.
- source_word: ἐπισεσυκώς
  choice: tivesse incitado
  rationale: Retrata a acusação de que Onias teria instigado Heliodoro; o mais-que-perfeito do subjuntivo ajusta-se naturalmente à construção comparativa e acusatória em português.
- source_word: τῶν κακῶν δημιουργός
  choice: o causador das desgraças
  rationale: Atribui responsabilidade pelos acontecimentos danosos sem restringir κακά ao mal moral; “causador” é mais idiomático aqui que “autor”.
- source_word: καθεστηκώς
  choice: se tornado
  rationale: Comunica o estado resultante indicado pelo particípio perfeito em associação com δημιουργός.
