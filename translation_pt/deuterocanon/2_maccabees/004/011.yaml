base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/011.yaml
  text: And he set aside the royal provisions laid down for the Jews through John[a], the father of Eupolemus—the one who had carried out the embassy to the Romans concerning friendship and alliance—and, while abolishing the lawful institutions[b], he introduced unlawful customs.
translation:
  language: pt
  text: Ele deixou de lado as medidas reais favoráveis aos judeus, estabelecidas por meio de João[a], pai de Eupólemo — aquele que havia realizado a missão diplomática aos romanos em favor da amizade e da aliança — e, abolindo as instituições legítimas[b], introduzia costumes contrários à lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as benevolentes disposições reais” ou “as concessões reais favoráveis aos judeus”. A expressão grega se refere a medidas do rei favoráveis aos judeus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a constituição legítima” ou “a ordem cívica legítima”. O termo grego pode designar amplamente as instituições, a constituição ou a organização cívica de uma comunidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ κείμενα ... φιλάνθρωπα βασιλικὰ
  choice: as disposições reais benevolentes estabelecidas
  rationale: Reúne o sentido de medidas régias já estabelecidas e favoráveis aos judeus, mantendo explícita a benevolência de φιλάνθρωπα sem reduzir a expressão a concessões formais.
- source_word: διὰ Ἰωάννου
  choice: por intermédio de João
  rationale: Expressa naturalmente a mediação de João na obtenção ou estabelecimento dessas disposições.
- source_word: πρεσβείαν
  choice: missão diplomática
  rationale: Indica uma missão oficial, evitando que “embaixada” seja entendida apenas como representação diplomática permanente ou edifício.
- source_word: ὑπὲρ φιλίας καὶ συμμαχίας
  choice: em favor da amizade e da aliança
  rationale: Preserva os dois termos diplomáticos e a força de ὑπέρ neste contexto.
- source_word: παρώσας
  choice: deixou de lado
  rationale: Comunica rejeição ou desconsideração das medidas vigentes sem afirmar, além do grego, um ato técnico de anulação.
- source_word: τὰς ... νομίμους ... πολιτίας
  choice: a ordem cívica legítima
  rationale: Politeiai pode abranger constituição, instituições e organização pública; “ordem cívica” preserva essa amplitude sem sugerir meramente formas modernas de governo.
- source_word: καταλύων ... ἐκαίνιζεν
  choice: enquanto abolindo ... introduzia
  rationale: Mantém a relação participial e o aspecto durativo do imperfeito, apresentando ações em curso.
- source_word: παρανόμους ἔθισμους
  choice: costumes contrários à lei
  rationale: Torna clara a oposição a νομίμους e preserva tanto a dimensão jurídica quanto a de práticas costumeiras.
theological_decisions:
- issue: Alcance de πολιτεία no contexto judaico
  choice: ordem cívica legítima
  alternative: instituições legítimas; constituição legítima; formas legítimas de governo
  rationale: A expressão pode designar a organização pública e legal estabelecida da comunidade. A tradução escolhida conserva essa amplitude e evita impor uma estrutura política moderna específica.
- issue: Força de φιλάνθρωπα βασιλικά
  choice: disposições reais benevolentes
  alternative: medidas reais favoráveis; concessões reais; decretos reais humanitários
  rationale: O grego caracteriza como favoráveis ou benevolentes as medidas do rei. A tradução explicita ambos os elementos sem decidir se eram tecnicamente decretos ou concessões.
- issue: Relação de παρανόμους com a lei judaica
  choice: costumes contrários à lei
  alternative: costumes ilegítimos; práticas ilícitas
  rationale: O contexto provavelmente aponta para práticas contrárias à lei judaica, mas o texto não acrescenta explicitamente “de Moisés”; por isso, mantém-se a formulação não especificada.
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário diplomático e jurídico compreensível. A frase longa do grego foi preservada, mas organizada com travessões para facilitar a leitura. “Eupólemo” segue acentuação portuguesa usual.
