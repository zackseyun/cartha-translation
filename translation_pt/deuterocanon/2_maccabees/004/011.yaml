  naturalness: “Enquanto abolindo” é uma construção pouco natural no português moderno. “Abolindo ... introduzia” preserva a simultaneidade expressa pelo particípio grego e o aspecto contínuo do imperfeito, com fluência. “Medidas reais favoráveis” é mais corrente e transparente que “disposições reais benevolentes”.
  terminology: “Missão diplomática”, “amizade e aliança”, “instituições legítimas” e “costumes contrários à lei” são adequados ao registro histórico-político do texto. “Medidas reais favoráveis” mantém explícitos o caráter régio e a benevolência das medidas, sem pressupor que fossem decretos ou concessões em sentido técnico.
