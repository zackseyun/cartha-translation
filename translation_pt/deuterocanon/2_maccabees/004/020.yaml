lexical_decisions:
- source_word: ἕνεκα
  choice: por causa de
  rationale: Preserva o valor causal da preposição e soa natural em português atual.
- source_word: τῶν παρόντων
  choice: as circunstâncias do momento
  rationale: O particípio neutro plural substantivado designa de modo amplo a situação então presente, sem especificar além do grego.
- source_word: κατασκευάς
  choice: aparelhamento
  rationale: No contexto naval, abrange a preparação e o equipamento das embarcações, sem restringir o sentido à construção.
- source_word: τριηρέων
  choice: trirremes
  rationale: Mantém a referência histórica ao tipo específico de navio de guerra antigo, em vez de generalizá-lo como simples embarcação.
