  text: and placing no value at all on the honors of their fathers[b][a], but considering the Greek distinctions the finest.
translation:
  language: pt
  text: sem dar valor algum às honras ancestrais[a], mas considerando as distinções gregas as melhores[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “às honras de seus antepassados”.
    reason: lexical_alternative
  - marker: b
    text: O termo grego também pode ser traduzido por “glórias” ou “honras”; aqui se refere a marcas valorizadas do prestígio cultural grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρῴας τιμὰς
  choice: honras ancestrais
  rationale: Expressa de modo natural as honras recebidas dos antepassados e ligadas à tradição herdada, sem restringi-las a privilégios jurídicos.
- source_word: ἐν οὐδενὶ τεθειμένοι
  choice: sem dar valor algum a
  rationale: Reproduz o idioma grego de considerar algo como nada ou sem importância, preservando sua forte avaliação negativa.
- source_word: Ἑλληνικὰς δόξας
  choice: distinções gregas
  rationale: Neste contraste, o plural δόξας aponta para marcas de prestígio da cultura grega; “distinções” evita tanto a repetição de “honras” quanto o sentido potencialmente excessivo de “glórias”.
- source_word: καλλίστας
  choice: as melhores
  rationale: Transmite o juízo superlativo de καλός de forma clara e idiomática no contexto de preferência cultural.
- source_word: ἡγούμενοι
  choice: considerando
  rationale: Representa diretamente o particípio de avaliação ou juízo e mantém o paralelismo da frase.
theological_decisions:
- issue: Contraste valorativo entre a herança ancestral judaica e o prestígio cultural grego
  choice: Preservar o contraste forte, dizendo que não davam valor algum às honras ancestrais e consideravam melhores as distinções gregas.
  alternative: “desprezando as honras de seus antepassados e exaltando as glórias gregas”
  rationale: O grego apresenta uma oposição contundente, mas não emprega explicitamente um verbo que signifique “desprezar” nem exige “exaltar”. A formulação escolhida mantém a tensão sem intensificar a acusação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção participial grega foi mantida em forma coordenada natural, e o contraste entre μὲν e δὲ foi expresso por “mas”.
