base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/022.yaml
  text: And he was received with great splendor by Jason and the city[a], and was welcomed with a torchlight procession and shouts; then in this way he encamped in Phoenicia.
translation:
  language: pt
  text: E ele foi recebido com grande esplendor por Jasão e pela cidade e acolhido com uma procissão de tochas e gritos[a]; então, assim, acampou na Fenícia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com porte de tochas e aclamações”. O grego descreve uma recepção pública cerimonial marcada por tochas e fortes brados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγαλομερῶς
  choice: com grande esplendor
  rationale: O advérbio indica uma recepção grandiosa e solene; a expressão é natural em português e preserva o caráter público e cerimonial.
- source_word: ἀποδεχθεὶς
  choice: foi recebido
  rationale: O particípio passivo descreve a recepção formal do visitante, sem antecipar os detalhes cerimoniais da oração seguinte.
- source_word: δᾳδουχίας
  choice: uma procissão de tochas
  rationale: O substantivo denota o porte cerimonial de tochas, provavelmente em forma de cortejo; a formulação explicita esse quadro em português corrente.
- source_word: βοῶν
  choice: gritos
  rationale: O genitivo plural refere-se a fortes brados ou clamores. “Gritos” preserva a vivacidade sem interpretar necessariamente os brados como louvores ou aclamações.
- source_word: εἰσεδέχθη
  choice: acolhido
  rationale: O verbo indica que ele foi recebido para dentro, no contexto da entrada cerimonial. “Acolhido” evita repetição rígida de “recebido” sem apagar a sobreposição semântica.
- source_word: εἶθʼ οὕτως
  choice: depois disso
  rationale: A expressão assinala a sequência após a recepção descrita. Em português, “depois disso” transmite naturalmente a ligação narrativa, sem atribuir ao acampamento a mesma maneira cerimonial.
- source_word: κατεστρατοπέδευσεν
  choice: acampou
  rationale: O verbo significa estabelecer acampamento; “acampou” é conciso e não acrescenta forças militares não mencionadas explicitamente.
- source_word: Φοινίκην
  choice: Fenícia
  rationale: Forma geográfica tradicional e amplamente reconhecida em português.
