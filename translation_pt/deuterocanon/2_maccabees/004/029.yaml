base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/029.yaml
  text: And Menelaus left Lysimachus[a], his own brother, as successor to the high priesthood, while Sostratus left Crates, the one over the Cyprians.
translation:
  language: pt
  text: Menelau deixou seu próprio irmão, Lisímaco, como sucessor no sumo sacerdócio; e Sóstrato deixou Crates, o encarregado dos cipriotas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o oficial responsável pelos cipriotas” ou “o governador dos cipriotas”. O grego não especifica com precisão o título administrativo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλιπεν
  choice: deixou
  rationale: Mantém o sentido básico de “deixar” ou “deixar em seu lugar”; o complemento explicita a função de sucessor.
- source_word: τῆς ἀρχιερωσύνης διάδοχον
  choice: como sucessor no sumo sacerdócio
  rationale: Expressa com naturalidade que Lisímaco foi deixado para suceder ou substituir Menelau no exercício do sumo sacerdócio.
- source_word: τὸν ἑαυτοῦ ἀδελφόν
  choice: seu próprio irmão
  rationale: Preserva a ênfase reflexiva de ἑαυτοῦ, não apenas a relação de parentesco.
- source_word: τὸν ἐπὶ τῶν Κυπρίων
  choice: o encarregado dos cipriotas
  rationale: Comunica a ideia de alguém posto sobre os cipriotas sem atribuir a Crates um título administrativo específico que o grego não explicita.
