base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/010.yaml
  text: And when the king had given his approval, and he had gained control of the office, he immediately shifted his countrymen over to the Greek way of life.
translation:
  language: pt
  text: Depois que o rei deu sua aprovação e Jasão assumiu o cargo, ele imediatamente levou seus compatriotas a adotar o modo de vida grego.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o caráter grego” ou “a marca grega”; a expressão se refere à adoção de padrões e costumes culturais gregos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπινεύσαντος
  choice: deu sua aprovação
  rationale: O genitivo absoluto indica ação anterior do rei; a expressão comunica consentimento oficial de modo natural em português.
- source_word: ἀρχῆς
  choice: o cargo
  rationale: No contexto, refere-se à posição de autoridade que Jasão obteve, não apenas à autoridade em sentido abstrato.
- source_word: κρατήσας
  choice: assumiu
  rationale: Expressa a obtenção efetiva do cargo e de seu controle, com formulação idiomática e concisa.
- source_word: εὐθέως
  choice: imediatamente
  rationale: Preserva a rapidez da ação após a ascensão ao cargo.
- source_word: ὁμοφύλους
  choice: seus compatriotas
  rationale: Designa os de seu próprio povo ou origem; evita explicitar 'judeus' onde o grego não o faz diretamente.
- source_word: μετέστησε
  choice: levou ... a adotar
  rationale: Comunica a ação causativa de mudar a orientação cultural de seus compatriotas sem sugerir mero deslocamento físico.
- source_word: Ἑλληνικὸν χαρακτῆρα
  choice: o modo de vida grego
  rationale: O sentido contextual é o padrão cultural grego; a tradução evita que 'caráter' seja entendido apenas em sentido psicológico.
theological_decisions:
- issue: Sentido cultural de Ἑλληνικὸν χαρακτῆρα
  choice: o modo de vida grego
  alternative: o caráter grego; os costumes gregos
  rationale: A passagem descreve a helenização promovida por Jasão. A opção escolhida mantém o sentido histórico-cultural sem acrescentar uma avaliação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção preserva a sequência do grego e explicita naturalmente o valor causativo de μετέστησε.
