base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/017.yaml
  text: For it is not easy to act wickedly against the divine laws[b][a]; but the time that follows will make these things clear.
translation:
  language: pt
  text: Pois não é fácil agir com impiedade contra as leis divinas[a]; mas o tempo que se segue deixará essas coisas claras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «ser ímpio para com as leis divinas». O verbo grego indica ação irreverente ou contrária a Deus.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «o tempo subsequente revelará isso».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσεβεῖν
  choice: agir com impiedade
  rationale: O infinitivo indica conduta irreverente ou ímpia, e não apenas uma atitude interior. «Agir com impiedade» conserva de modo claro a dimensão religiosa do termo.
- source_word: θείους
  choice: divinas
  rationale: O adjetivo significa aquilo que pertence ou diz respeito a Deus; no contexto judaico, «leis divinas» refere-se naturalmente às leis de Deus.
- source_word: νόμους
  choice: leis
  rationale: Mantém o plural explícito do grego e seu sentido jurídico-religioso sem restringi-lo a mandamentos específicos.
- source_word: οὐ ῥᾴδιον
  choice: não é fácil
  rationale: Reproduz diretamente a expressão grega e preserva a possível tensão entre dificuldade prática e gravidade moral.
- source_word: ὁ ἀκόλουθος καιρός
  choice: o tempo que se segue
  rationale: Conserva a sequência temporal indicada por ἀκόλουθος sem lhe atribuir um sentido escatológico que o texto não explicita.
- source_word: δηλώσει
  choice: deixará essas coisas claras
  rationale: Expressa o sentido de tornar manifesto ou evidente, mantendo a referência plural de ταῦτα.
theological_decisions:
- issue: Força da afirmação sobre a impiedade contra as leis de Deus
  choice: A formulação mantém a afirmação de que agir contra as leis divinas «não é fácil», enquanto o contexto sugere que os acontecimentos posteriores revelarão a gravidade disso.
  alternative: Traduzir como «não é coisa de pouca importância» ou explicitar que tal conduta atrairá o juízo divino.
  rationale: O grego admite a leitura literal de dificuldade e a força idiomática de algo grave ou não inconsequente. A tradução preserva essa tensão sem inserir uma doutrina de juízo mais explícita do que o próprio versículo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o tom sentencioso do grego e evita tanto linguagem excessivamente técnica quanto expansão interpretativa.
