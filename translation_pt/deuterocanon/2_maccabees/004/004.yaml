base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/004.yaml
  text: When Onias saw the severity of the rivalry[a], and that Apollonius son of Menestheus, the governor of Coele-Syria and Phoenicia, was increasing Simon’s wickedness[b],
translation:
  language: pt
  text: Quando Onias percebeu a gravidade da rivalidade[a] e que Apolônio, filho de Menesteu, governador[b] da Celessíria e da Fenícia, contribuía para aumentar a maldade de Simão,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «da contenda» ou «do espírito de disputa».
    reason: lexical_alternative
  - marker: b
    text: O termo grego também pode significar «general» ou «comandante»; aqui, «governador» expressa sua autoridade administrativa sobre a região.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνορῶν
  choice: Quando Onias percebeu
  rationale: O particípio introduz a circunstância que leva à ação narrada no versículo seguinte. «Percebeu» expressa observação com compreensão e é natural em português.
- source_word: τὸ χαλεπὸν
  choice: a gravidade
  rationale: O adjetivo neutro substantivado indica o caráter grave ou difícil do conflito; «a gravidade» preserva esse sentido de seriedade.
- source_word: φιλονεικίας
  choice: da rivalidade
  rationale: O termo abrange rivalidade contenciosa, disputa ou espírito de contenda. «Rivalidade» se ajusta ao conflito pessoal e político sem reduzi-lo a uma única discussão.
- source_word: Ἀπολλώνιον Μενεσθέως
  choice: Apolônio, filho de Menesteu
  rationale: O genitivo patronímico identifica Apolônio por sua filiação; a forma explícita é clara e idiomática em português.
- source_word: στρατηγόν
  choice: governador
  rationale: Embora o termo também possa designar um general ou comandante, neste contexto indica o oficial que exercia autoridade sobre uma região administrativa.
- source_word: συναύξοντα
  choice: contribuía para aumentar
  rationale: A construção comunica que Apolônio cooperava para o crescimento ou agravamento da conduta má de Simão, preservando a nuance contributiva do verbo.
- source_word: κακίαν
  choice: maldade
  rationale: «Maldade» conserva o peso moral do termo sem restringi-lo apenas a uma atitude interior ou a um ato específico.
