base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/043.yaml
  text: For this reason they wounded many of them[a], struck down some, and drove them all into flight; and they seized the temple-robber himself beside the treasury.
translation:
  language: pt
  text: Por essa razão, feriram muitos deles, derrubaram alguns e puseram todos em fuga; e capturaram o próprio ladrão do templo[a] junto ao tesouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sacrílego”. O termo grego pode designar quem comete sacrilégio, especialmente roubando um templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ἣν αἰτίαν
  choice: Por essa razão
  rationale: Expressa de modo natural em português o nexo causal com a situação anterior.
- source_word: τραυματίας ἐποίησαν
  choice: feriram
  rationale: O idiomatismo grego significa literalmente “fizeram feridos”; o verbo português preserva de forma clara o sentido de violência física.
- source_word: κατέβαλον
  choice: derrubaram
  rationale: Mantém o sentido básico de fazer cair ou abater sem afirmar de modo indevido que as pessoas foram mortas.
- source_word: εἰς φυγὴν συνήλασαν
  choice: puseram todos em fuga
  rationale: Formulação corrente que comunica que todos foram forçados a fugir.
- source_word: τὸν ἱερόσυλον
  choice: o próprio ladrão do templo
  rationale: O substantivo designa alguém que comete sacrilégio, especialmente roubando bens sagrados; o contexto do tesouro favorece a tradução concreta.
- source_word: ἐχειρώσαντο
  choice: capturaram
  rationale: O verbo médio indica apoderar-se de alguém ou tê-lo sob controle; “capturaram” evita sugerir um procedimento jurídico formal.
- source_word: παρὰ τὸ γαζοφυλάκιον
  choice: junto ao tesouro
  rationale: Preserva tanto a referência ao local onde se guardavam os bens quanto a relação espacial expressa por παρά.
theological_decisions:
- issue: Sentido de ἱερόσυλος no contexto do templo
  choice: ladrão do templo
  alternative: sacrílego
  rationale: O termo reúne as ideias de violação do sagrado e roubo de propriedade sagrada. A tradução principal explicita a ação concreta sugerida pelo contexto, enquanto a nota conserva a alternativa mais ampla.
translation_notes:
  register: Português moderno, claro e digno, com construção amplamente compreensível no Brasil e em outros contextos lusófonos. A repetição coordenada acompanha o ritmo narrativo do grego sem soar artificial.
