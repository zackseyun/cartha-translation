lexical_decisions:
- source_word: Μεταλλάξαντος δὲ τὸν βίον
  choice: Mas, quando Seleuco deixou esta vida
  rationale: A construção no genitivo absoluto situa a ação anterior e emprega uma expressão eufemística para a morte. «Deixou esta vida» preserva a formulação indireta do grego e soa natural em português.
- source_word: παραλαβόντος
  choice: assumiu
  rationale: No contexto de sucessão real, o verbo indica que Antíoco passou a exercer o governo; «assumiu» expressa isso com clareza sem acrescentar a ideia específica de conquista.
- source_word: τὴν βασιλείαν
  choice: o reino
  rationale: βασιλεία pode designar tanto o domínio real como o exercício da realeza. «O reino» mantém a amplitude do termo e combina naturalmente com «assumiu».
- source_word: Ἀντιόχου
  choice: Antíoco
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio grego.
- source_word: τοῦ προσαγορευθέντος
  choice: chamado
  rationale: O particípio identifica Antíoco por seu epíteto; «chamado» é direto, natural e fiel.
- source_word: Ἐπιφανοῦς
  choice: Epífanes
  rationale: O epíteto régio é transliterado em sua forma portuguesa consagrada, em vez de receber uma tradução interpretativa como «Manifesto» ou «Ilustre».
