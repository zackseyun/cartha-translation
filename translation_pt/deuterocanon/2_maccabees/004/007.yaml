  text: But when Seleucus passed from life[a], and Antiochus, the one called Epiphanes, took over the kingdom,
translation:
  language: pt
  text: Mas, quando Seleuco deixou esta vida[a] e Antíoco, chamado Epífanes, assumiu o reino,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente «tendo trocado a vida», uma forma eufemística de dizer que Seleuco morreu.
