base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/048.yaml
  text: And he released Menelaus[a], the cause of all the evil, from among the accused; but for those wretched men—who, even if they had pleaded their case before Scythians[c][b], would have been acquitted—for them he decreed death.
translation:
  language: pt
  text: E soltou Menelau, o responsável por toda a maldade, dentre os acusados; mas sentenciou à morte aqueles infelizes — que, mesmo se tivessem apresentado sua defesa diante de citas, teriam sido libertados sem condenação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν ... τῆς ὅλης κακίας αἴτιον
  choice: o responsável por toda a maldade
  rationale: Αἴτιος indica quem é responsável ou causador; a formulação conserva tanto a causalidade quanto a censura moral. Κακία é vertido por “maldade”, termo amplo e natural que mantém a dimensão ética.
- source_word: ἀπέλυσεν τῶν κατηγορημένων
  choice: livrou ... das acusações
  rationale: Ἀπολύω comunica soltura ou liberação. O genitivo plural substantivado κατηγορημένων pode referir-se às acusações ou aos acusados; no contexto judicial, “livrou ... das acusações” é natural sem afirmar tecnicamente uma absolvição formal.
- source_word: τοῖς ... ταλαιπώροις
  choice: aqueles infelizes
  rationale: Ταλαιπώροις expressa condição lastimável e desperta compaixão; “infelizes” preserva o tom de piedade sem sugerir pobreza material.
- source_word: οἵτινες εἰ καὶ ἐπὶ Σκυθῶν ἔλεγον
  choice: que, mesmo se tivessem apresentado sua defesa diante de citas
  rationale: A construção ἐπί com genitivo tem sentido forense de comparecer diante de juízes; ἔλεγον é elíptico e, no contexto, se refere a expor a defesa.
- source_word: ἀπελύθησαν ἀκατάγνωστοι
  choice: teriam sido postos em liberdade sem condenação
  rationale: 'A tradução mantém os dois componentes da expressão: ἀπελύθησαν, ser soltos, e ἀκατάγνωστοι, sem terem sido condenados. Evita condensá-los em “absolvidos” e conserva a ênfase do grego.'
- source_word: θάνατον ἀπέκρινεν
  choice: sentenciou à morte
  rationale: Neste contexto, ἀποκρίνω significa proferir uma decisão judicial. “Sentenciou à morte” é idiomático e comunica com precisão o resultado.
