base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/009.yaml
  text: In addition to these things[a], he promised to register another fifty talents beyond the one hundred, if he were granted authority to establish for himself a gymnasium and an enrollment of young men[b], and to enroll those in Jerusalem as Antiochenes.
translation:
  language: pt
  text: Além disso, prometeu registrar mais cinquenta talentos[a], além dos cem, caso lhe fosse concedida autoridade para estabelecer um ginásio e uma instituição para a formação de jovens[b], e para registrar os de Jerusalém como antioquenos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra “talentos” não aparece neste versículo no grego, mas é subentendida pelo contexto monetário dos versículos anteriores.
    reason: supplied_word
  - marker: b
    text: O ginásio e a instituição para a formação de jovens eram instituições cívicas e atléticas gregas, ligadas aqui à helenização de Jerusalém.
    reason: cultural_note
  - marker: c
    text: Ou, possivelmente, “registrar os de Jerusalém como cidadãos de Antioquia”. O grego diz literalmente “antioquenos” e pode indicar inscrição cívica ou uma condição jurídica vinculada a Antioquia.
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς δὲ τούτοις
  choice: Além disso
  rationale: Expressa com naturalidade o acréscimo à oferta mencionada anteriormente.
- source_word: ὑποσχεῖτο
  choice: prometeu
  rationale: Transmite de modo claro o compromisso financeiro assumido no contexto.
- source_word: ἕτερα διαγράψειν πεντήκοντα πρὸς τοῖς ἑκατόν
  choice: registrar mais cinquenta talentos, além dos cem
  rationale: Mantém a nuance administrativa de διαγράφειν; “talentos” é suprido pelo contexto monetário imediato.
- source_word: ἐὰν ἐπιχορηγηθῇ διὰ τῆς ἐξουσίας αὐτοῦ
  choice: caso lhe fosse concedida, mediante a autoridade do rei, permissão
  rationale: O passivo indica uma concessão superior, e αὐτοῦ remete contextualmente ao rei. “Permissão” explicita a função da autoridade sem sugerir que Jasão já a possuía.
- source_word: γυμνάσιον
  choice: ginásio
  rationale: Preserva o nome histórico da instituição grega de formação física, cívica e cultural.
- source_word: ἐφηβίαν
  choice: uma instituição para a formação de jovens
  rationale: Comunica em português corrente o caráter institucional da efebia sem recorrer ao termo técnico pouco conhecido “efebato”.
- source_word: αὐτῷ συστήσασθαι
  choice: fundar
  rationale: Expressa a iniciativa de estabelecer as instituições; o interesse reflexivo de Jasão é suficientemente claro no contexto, sem o pouco natural “para si mesmo”.
- source_word: τοὺς ἐν Ἱεροσολύμοις Ἀντιοχεῖς ἀναγράψαι
  choice: registrar como antioquenos os habitantes de Jerusalém
  rationale: Conserva a formulação administrativa e a designação grega sem definir além do texto o status jurídico exato envolvido.
theological_decisions:
- issue: Sentido político e cívico de Ἀντιοχεῖς
  choice: antioquenos
  alternative: cidadãos de Antioquia
  rationale: Embora o contexto provavelmente envolva inscrição ou condição cívica ligada a Antioquia, o grego emprega apenas a designação “antioquenos”; a tradução evita determinar um status legal mais específico do que a fonte.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário de alcance internacional. A formulação mantém os termos históricos necessários, explicando em notas os elementos culturais e a ambiguidade jurídica.
