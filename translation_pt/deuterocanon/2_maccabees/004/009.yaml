review_pass:
  verdict: revise
  source_fidelity: A redação representa bem a oferta adicional, o montante subentendido de talentos, o ginásio, a efebia e a inscrição como antioquenos. Contudo, “mediante a autoridade do rei” identifica αὐτοῦ com o rei e reformula a construção de modo mais específico do que o grego permite. O texto deve manter a ideia de que lhe fosse concedida autoridade, sem explicitar o possuidor referido pelo pronome. “Habitantes de Jerusalém” também pode restringir indevidamente τοὺς ἐν Ἱεροσολύμοις, que é mais literalmente “os que estavam/em Jerusalém”.
  naturalness: A tradução é clara e de registro apropriado. “Caso lhe fosse concedida autoridade para estabelecer” é mais direta, idiomática e sintaticamente fiel do que “caso lhe fosse concedida, mediante a autoridade do rei, permissão”.
  terminology: “Ginásio”, “talentos” e “antioquenos” são adequados. “Instituição para a formação de jovens” comunica acessivelmente ἐφηβία, desde que a nota esclareça tratar-se de uma instituição cívica e atlética voltada a jovens homens, sem exigir o tecnicismo “efebia” no texto principal.
  issues:
