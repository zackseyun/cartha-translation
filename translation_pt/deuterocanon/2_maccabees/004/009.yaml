    issue: “Mediante a autoridade do rei” introduz uma identificação interpretativa de αὐτοῦ.
    rationale: O grego diz διὰ τῆς ἐξουσίας αὐτοῦ e, no contexto da oração passiva, permite traduzir de forma não especificada como uma concessão de autoridade a Jasão. Nomear o rei no texto principal vai além da formulação da fonte.
  - severity: low
    issue: “Habitantes de Jerusalém” torna mais estrita a referência de τοὺς ἐν Ἱεροσολύμοις.
    rationale: A expressão pode designar os que estavam ou eram de Jerusalém, sem exigir a noção precisa de residência permanente. “Os de Jerusalém” preserva melhor essa abertura.
