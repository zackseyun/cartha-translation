base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/039.yaml
  text: But when many acts of temple robbery had been committed in the city by Lysimachus[a], with the consent of Menelaus, and the report had spread outside, the crowd gathered against Lysimachus[b], since much gold had already been plundered.
translation:
  language: pt
  text: Mas, quando Lisímaco, com o consentimento de Menelau, cometeu na cidade muitos roubos de bens sagrados[a], e a notícia[b] se espalhou para fora, a multidão se reuniu contra Lisímaco, pois muitos objetos de ouro já haviam sido saqueados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “muitos sacrilégios”; o termo grego designa mais especificamente o roubo de propriedade sagrada ou pertencente ao templo.
    reason: lexical_alternative
  - marker: b
    text: Ou “o rumor”. A palavra grega pode significar “notícia”, “relato” ou “rumor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱεροσυλημάτων
  choice: roubos de bens sagrados
  rationale: O termo designa especificamente a apropriação sacrílega de propriedade sagrada. A expressão explicita a natureza do delito e preserva o plural do grego.
- source_word: μετὰ τῆς τοῦ Μενελάου γνώμης
  choice: com o consentimento de Menelau
  rationale: γνώμη pode indicar opinião, propósito, decisão ou aprovação; neste contexto, comunica a anuência e a cumplicidade de Menelau sem afirmar que ele executou pessoalmente os roubos.
- source_word: διαδοθείσης ἔξω τῆς φήμης
  choice: a notícia se espalhou para fora
  rationale: φήμη pode significar notícia, relato ou rumor. “Notícia” é neutro, enquanto “para fora” conserva o elemento espacial expresso por ἔξω, provavelmente para além do local imediato.
- source_word: ἐπισυνήχθη τὸ πλῆθος
  choice: a multidão se reuniu
  rationale: Tradução natural e direta da reunião coletiva de grande número de pessoas.
- source_word: ἐπὶ τὸν Λυσίμαχον
  choice: contra Lisímaco
  rationale: Embora ἐπί com acusativo possa indicar direção, o contexto de indignação pública favorece a orientação hostil expressa por “contra”.
- source_word: χρυσωμάτων
  choice: objetos de ouro
  rationale: O substantivo se refere a peças ou valores feitos de ouro. “Objetos de ouro” preserva melhor o caráter concreto e plural do termo do que o simples coletivo “ouro”.
- source_word: διηρπαγμένων
  choice: já haviam sido saqueados
  rationale: O particípio perfeito passivo descreve um saque já consumado e ainda relevante; ἤδη é representado por “já”.
theological_decisions:
- issue: Natureza do delito expresso por ἱεροσυλημάτων
  choice: Roubo de propriedade sagrada
  alternative: Sacrilégios em sentido geral
  rationale: O termo grego denota mais especificamente o roubo sacrílego de bens sagrados. A tradução mantém a gravidade religiosa e histórica do ato sem ampliar o sentido para toda forma de profanação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem da primeira oração foi levemente reorganizada para tornar clara a relação entre Lisímaco, os roubos e o consentimento de Menelau, sem alterar o conteúdo.
