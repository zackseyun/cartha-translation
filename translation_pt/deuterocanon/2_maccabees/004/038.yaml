base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/038.yaml
  text: And[a], inflamed with anger, he immediately stripped off Andronikos's purple robe and tore off his garments, and after leading him around through the whole city to the very place where he had committed his impiety against Onias, there he dispatched the murderer[b], the Lord rendering to him the punishment he deserved.
translation:
  language: pt
  text: E, ardendo de ira, ele imediatamente arrancou de Andrônico o manto de púrpura e rasgou-lhe as túnicas. Depois de conduzi-lo por toda a cidade até o exato lugar onde ele havia agido impiamente contra Onias, ali abateu o assassino[a][b], enquanto o Senhor lhe dava o castigo que merecia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O termo grego é mais forte que simplesmente “assassino”: descreve alguém manchado e culpado pelo derramamento de sangue.'
    reason: lexical_alternative
  - marker: b
    text: O verbo grego traduzido por “abateu” é vívido e pode sugerir a morte com uma lança, um dardo ou arma semelhante; no contexto, o sentido mais amplo é que Andrônico foi morto ali.
    reason: lexical_alternative
lexical_decisions:
- source_word: πυρωθεὶς τοῖς θυμοῖς
  choice: ardendo de ira
  rationale: Preserva a imagem de fogo de πυρωθείς e a intensidade de θυμοῖς em português natural e solene.
- source_word: παραχρῆμα
  choice: imediatamente
  rationale: Expressa com clareza a prontidão da ação.
- source_word: τὴν τοῦ Ἀνδρονίκου πορφύραν
  choice: o manto de púrpura de Andrônico
  rationale: πορφύρα designa aqui provavelmente uma veste púrpura associada à posição social; “manto de púrpura” comunica tanto a peça quanto seu valor simbólico.
- source_word: τοὺς χιτῶνας περιρρήξας
  choice: rasgou-lhe as túnicas
  rationale: “Túnicas” conserva o sentido concreto de χιτῶνας, e o pronome deixa claro que eram as vestes de Andrônico.
- source_word: περιαγαγὼν καθʼ ὅλην τὴν πόλιν
  choice: depois de conduzi-lo por toda a cidade
  rationale: Mantém a ideia de fazê-lo percorrer publicamente a cidade sem acrescentar a noção mais específica de um desfile formal.
- source_word: ἐπʼ αὐτὸν τὸν τόπον
  choice: até o exato lugar
  rationale: Reproduz a ênfase de αὐτὸν sobre a identidade precisa do lugar.
- source_word: οὗπερ τὸν Ὀνίαν ἠσέβησεν
  choice: onde ele havia agido impiamente contra Onias
  rationale: Conserva a força religiosa e moral de ἠσέβησεν, em vez de reduzi-la a um dano genérico.
- source_word: τὸν μιαφόνον
  choice: o assassino
  rationale: Transmite diretamente o sentido central, enquanto a nuance de contaminação e culpa de sangue é preservada em nota.
- source_word: ἀπεκόντισεν
  choice: abateu
  rationale: Expressa uma morte violenta e deliberada sem afirmar no texto principal qual arma foi usada; a possível alusão a lança ou dardo é registrada em nota.
- source_word: τοῦ κυρίου τὴν ἄξιαν αὐτῷ κόλασιν ἀποδόντος
  choice: enquanto o Senhor lhe dava o castigo que merecia
  rationale: Mantém explícita a atribuição do juízo ao Senhor e verte ἄξιαν de modo idiomático, sem apagar a relação simultânea ou explicativa do genitivo absoluto.
theological_decisions:
- issue: Tradução de κύριος no relato do juízo divino
  choice: o Senhor
  alternative: Deus
  rationale: O grego traz κύριος; “o Senhor” preserva o título da fonte sem substituí-lo por uma identificação interpretativa.
- issue: Relação entre a execução humana e a retribuição divina
  choice: enquanto o Senhor lhe dava o castigo que merecia
  alternative: pois o Senhor lhe deu o castigo que merecia
  rationale: O genitivo absoluto atribui claramente ao Senhor a justa retribuição, mas sua relação circunstancial pode ser entendida como simultânea e também explicativa. “Enquanto” preserva melhor a forma sem impor uma causalidade mais explícita do que o grego exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas naturais ao público brasileiro. Mantiveram-se “ira”, “túnicas”, “impiamente” e “Senhor” para conservar o tom histórico-religioso sem arcaísmo excessivo. Os marcadores de nota aparecem junto aos elementos que explicam.
