translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O período conserva a enumeração acelerada do grego; os pontos e vírgulas distinguem os três grupos. “Tudo misturado” mantém a força concreta e algo ambígua de φύρδην, enquanto “atiravam” preserva o aspecto imperfeito da ação.
