  text: But when they also became aware of the attack by Lysimachus[a], some snatched up stones, others thick pieces of wood, and some, grabbing handfuls of the ashes lying nearby[c][b], hurled them all together at those around Lysimachus.
translation:
  language: pt
  text: Quando também tomaram conhecimento do ataque de Lisímaco[a], alguns agarraram pedras, outros, grossos pedaços de madeira[b], e outros ainda, apanhando punhados das cinzas que estavam ali perto, atiravam-nos desordenadamente contra os que acompanhavam Lisímaco[c].
