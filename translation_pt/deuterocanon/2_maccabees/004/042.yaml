  footnotes:
  - marker: a
    text: 'Ou: “sabendo também do ataque de Lisímaco”. O particípio grego pode descrever tanto o estado de saber quanto o ato de tomar conhecimento no decorrer da narrativa.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “espessuras de madeira”, isto é, peças grossas ou pesadas de madeira.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “os que estavam ao redor de Lisímaco”; a expressão provavelmente se refere a seus acompanhantes ou partidários.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνειδότες
  choice: perceberam
  rationale: O particípio indica que a multidão tomou conhecimento do ataque e reagiu. “Perceberam” comunica isso naturalmente, sem excluir o sentido mais estático de “sabendo”.
- source_word: ἐπίθεσιν
  choice: ataque
  rationale: No contexto de confronto violento, “ataque” conserva a força hostil do substantivo e é corrente em português.
- source_word: συναρπάσαντες
  choice: apanharam às pressas
  rationale: A expressão transmite a ação súbita e urgente de agarrar os objetos disponíveis, sem sugerir necessariamente que foram tomados de outra pessoa.
- source_word: ξύλων πάχη
  choice: grossos pedaços de madeira
  rationale: A expressão é literalmente próxima de “espessuras de madeira”. Esta formulação preserva a ideia de peças pesadas ou grossas sem defini-las indevidamente como porretes.
- source_word: σποδοῦ
  choice: cinzas
  rationale: É o sentido comum e concreto do substantivo; “pó” enfraqueceria a imagem, e “brasas” acrescentaria a ideia de material ainda ardente.
- source_word: δραξόμενοι
  choice: tomando punhados
  rationale: O particípio médio descreve o ato de pegar algo com a mão, provavelmente em punhados; a tradução torna esse gesto claro em português.
- source_word: φύρδην
  choice: tudo misturado
  rationale: O advérbio expressa uma ação misturada, indiscriminada ou desordenada. A escolha preserva a imagem de diferentes materiais lançados em conjunto sem impor uma precisão inexistente no grego.
- source_word: ἐνετίνασσον
  choice: atiravam
  rationale: O imperfeito retrata a ação em andamento ou repetida. “Atiravam” é natural e mantém esse aspecto verbal.
- source_word: τοὺς περὶ τὸν Λυσίμαχον
  choice: os que estavam com Lisímaco
  rationale: A expressão designa literalmente os que estavam ao redor de Lisímaco e, no contexto, provavelmente seus acompanhantes ou partidários. A tradução permanece aberta quanto à função exata deles.
