  text: he began to strike with lawless hands[a], with a certain Auranus taking the lead, advanced in age but no less in ignorance.
translation:
  language: pt
  text: começou a agir violentamente, com mãos injustas[a], enquanto um certo Aurano tomava a dianteira, avançado em idade, mas não menos em ignorância.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A formulação grega é difícil e condensada. Literalmente, fala de começar com “mãos injustas”, sem explicitar o verbo de ação. O sentido é o início de uma ação violenta e injusta, liderada por um homem chamado Aurano, avançado em idade e igualmente em ignorância.
    reason: A construção elíptica κατήρξατο χειρῶν ἀδίκων não explicita o verbo de ação associado às “mãos injustas”.
lexical_decisions:
- source_word: κατήρξατο
  choice: começou a agir
  rationale: O aoristo médio introduz o início da ação. Como a construção grega é elíptica, “começou a agir” evita acrescentar um tipo específico de golpe não expresso no texto.
- source_word: χειρῶν ἀδίκων
  choice: com mãos injustas
  rationale: Preserva a imagem concreta das “mãos” e traduz ἀδίκων diretamente como “injustas”, deixando que a nota esclareça a formulação grega comprimida e seu sentido violento.
- source_word: προηγησαμένου
  choice: tomava a dianteira
  rationale: O particípio em genitivo absoluto apresenta Aurano como quem ia à frente ou liderava a ação.
- source_word: τινὸς Αὐρανοῦ
  choice: certo Aurano
  rationale: τινός com nome próprio pode ser vertido naturalmente por “certo”; Αὐρανός é transliterado segundo a forma portuguesa “Aurano”.
- source_word: προβεβηκότος τὴν ἡλικίαν
  choice: avançado em idade
  rationale: A expressão indica alguém adiantado nos anos, isto é, idoso, e mantém o paralelismo retórico com a ignorância.
- source_word: οὐδὲν δὲ ἧττον καὶ τὴν ἄγνοιαν
  choice: mas não menos em ignorância
  rationale: 'Conserva a comparação irônica: Aurano era avançado em idade e não menos avançado na ignorância, sem suavizar a censura do autor.'
