  text: So the king came quickly to settle the affairs, leaving Andronicus, one of those holding high office, as his successor.
translation:
  language: pt
  text: Por isso, o rei veio depressa para controlar a situação, deixando Andrônico, um dos altos dignitários, como seu substituto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θᾶττον
  choice: depressa
  rationale: Expressa de modo natural a rapidez e urgência indicadas pelo comparativo grego usado adverbialmente.
- source_word: καταστεῖλαι τὰ πράγματα
  choice: apaziguar a situação
  rationale: No contexto de agitação política, a expressão significa pôr os acontecimentos sob controle ou restabelecer a ordem, não apenas resolver assuntos administrativos.
- source_word: καταλείπων τὸν διαδεχόμενον Ἀνδρόνικον
  choice: deixando em seu lugar Andrônico
  rationale: διαδεχόμενον indica que Andrônico ficou como substituto ou representante durante a ausência do rei; esta formulação evita sugerir que ele se tornou sucessor permanente ao trono.
- source_word: τῶν ἐν ἀξιώματι κειμένων
  choice: um dos altos dignitários
  rationale: O genitivo partitivo identifica Andrônico como integrante do grupo dos que ocupavam posição elevada; “altos dignitários” é conciso e adequado ao registro político da passagem.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e sem excesso de literalismo. “Em seu lugar” preserva a função temporária de Andrônico no contexto e evita a possível leitura dinástica de “sucessor”.
