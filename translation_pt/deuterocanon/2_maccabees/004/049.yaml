  text: Therefore those who had spoken beforehand concerning the city and the people and the sacred vessels quickly suffered the unjust penalty[a][b][c].
translation:
  language: pt
  text: Assim, os que haviam falado em defesa da cidade, das comunidades[a] e dos utensílios sagrados[b] logo sofreram a pena injusta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do povo” ou “dos distritos”. O plural grego pode indicar populações, grupos cívicos ou divisões territoriais; o sentido exato é incerto.
    reason: lexical_alternative
  - marker: b
    text: Isto é, os objetos sagrados, provavelmente os utensílios do templo.
    reason: contextual_clarification
  - marker: c
    text: Ou “um castigo injusto” ou “uma perda injusta”. O termo grego pode ter sentido tanto punitivo como danoso.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταχέως οὖν
  choice: Assim ... logo
  rationale: οὖν liga a frase ao resultado do contexto anterior, enquanto ταχέως indica que a consequência ocorreu prontamente. A combinação é natural em português e conserva ambas as forças.
- source_word: οἱ ... προηγορήσαντες
  choice: os que haviam defendido a causa
  rationale: No contexto judicial, o particípio indica falar previamente ou pleitear em favor de alguém ou de algo. “Defendido a causa” expressa essa função sem introduzir uma acusação ausente do grego.
- source_word: περὶ πόλεως καὶ δήμων
  choice: da cidade, das comunidades
  rationale: πόλις é “cidade”; o plural δήμων pode designar populações, grupos cívicos ou distritos. “Comunidades” preserva o plural e evita restringir indevidamente o referente.
- source_word: τῶν ἱερῶν σκευῶν
  choice: dos utensílios sagrados
  rationale: σκεύη designa objetos ou utensílios, e ἱερῶν os qualifica como sagrados. Pelo contexto, eram objetos do templo, mas a tradução não explicita além do grego.
- source_word: τὴν ἄδικον ζημίαν ὑπέσχον
  choice: sofreram uma pena injusta
  rationale: ὑπέσχον, com ζημίαν, significa sofrer ou suportar uma consequência danosa; ζημία pode ser perda, dano ou pena. O contexto de condenação favorece “pena”, enquanto ἄδικον deixa claro seu caráter injusto.
