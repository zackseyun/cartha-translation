  yaml_path: translation/deuterocanon/2_maccabees/004/005.yaml
  text: he presented himself to the king[a], not becoming an accuser of his fellow citizens, but seeking what was advantageous both publicly and privately for the whole multitude.
translation:
  language: pt
  text: apresentou-se ao rei, sem agir como acusador de seus concidadãos, mas buscando o que era benéfico tanto para a comunidade como para cada pessoa de todo o povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas buscando o que era vantajoso, pública e particularmente, para toda a população”.'
    reason: Alternativa sintática e lexical para κοινῇ καὶ κατʼ ἰδίαν παντὶ τῷ πλήθει.
lexical_decisions:
- source_word: διεκοσμήθη
  choice: apresentou-se
  rationale: No contexto da audiência real, exprime de modo natural como Onias compareceu ou se apresentou diante do rei, sem recorrer ao literalismo inadequado de uma ideia de ornamentação.
- source_word: οὐ γινόμενος
  choice: sem agir como
  rationale: O particípio indica a maneira como ele se apresentou. A formulação portuguesa conserva essa função e soa mais natural do que “não se tornando”.
- source_word: τῶν πολιτῶν
  choice: seus concidadãos
  rationale: Expressa a relação cívica de Onias com os demais membros de seu povo.
- source_word: κατήγορος
  choice: acusador
  rationale: Mantém o sentido forense básico sem sugerir o cargo institucional moderno de promotor.
- source_word: τὸ δὲ σύμφορον
  choice: o que era benéfico
  rationale: Reproduz o substantivo abstrato e o sentido de vantagem ou benefício sem atribuir ao personagem intenções além das declaradas.
- source_word: κοινῇ καὶ κατʼ ἰδίαν
  choice: tanto para a comunidade como para cada pessoa
  rationale: Torna explícito, em português natural, o contraste comprimido entre o benefício coletivo e o individual.
- source_word: παντὶ τῷ πλήθει
  choice: todo o povo
  rationale: Comunica a abrangência de πλῆθος em linguagem atual e digna, evitando o tom artificial de “toda a multidão”.
theological_decisions:
- issue: Caracterização ética do apelo de Onias ao rei
  choice: Onias comparece sem agir como acusador e procura o benefício coletivo e individual do povo.
  alternative: A frase final pode ser entendida adverbialmente como aquilo que era vantajoso pública e particularmente para toda a população.
  rationale: A sintaxe final é compacta. A tradução principal comunica a oposição entre a esfera comum e cada indivíduo, enquanto a nota preserva a alternativa sem ampliar os motivos atribuídos a Onias.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O versículo começa em minúscula porque o texto grego fornecido continua a oração do contexto anterior.
