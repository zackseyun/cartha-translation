  yaml_path: translation/deuterocanon/2_maccabees/004/047.yaml
  text: So Ptolemy took him and moved the king into a colonnade[b][a], as though to revive him.
translation:
  language: pt
  text: Então Ptolemeu, levando-o à parte[a], transferiu o rei para uma colunata, como se fosse reanimá-lo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego deixa implícito o objeto de “levando”; “o” é suprido com base no contexto.
    reason: alternative_reading
  - marker: b
    text: A expressão grega também pode ser traduzida por “como se fosse refrescá-lo” ou “como se fosse aliviá-lo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Então
  rationale: No fluxo narrativo, introduz a consequência ou o passo seguinte; “Então” é natural sem impor um sentido espacial incerto.
- source_word: ἀπολαβών
  choice: levando-o à parte
  rationale: O particípio sugere tomar ou retirar alguém da cena. O objeto está implícito no grego e é recuperado do contexto.
- source_word: περίστυλον
  choice: colunata
  rationale: Designa uma área arquitetônica dotada ou cercada de colunas; “colunata” preserva essa imagem em linguagem compreensível.
- source_word: ὡς ἀναψύχοντα
  choice: como se fosse reanimá-lo
  rationale: A construção com ὡς apresenta uma finalidade aparente ou alegada. ἀναψύχω pode significar reanimar, refrescar ou aliviar; o contexto favorece “reanimar”, sem ocultar as demais possibilidades na nota.
- source_word: μετέθηκεν
  choice: transferiu
  rationale: Expressa a mudança do rei de um lugar para outro e reproduz com clareza o valor do verbo grego.
- source_word: τὸν βασιλέα
  choice: o rei
  rationale: Tradução direta do objeto explícito de μετέθηκεν.
- source_word: ὁ Πτολεμαῖος
  choice: Ptolemeu
  rationale: Forma tradicional e corrente do nome em português.
