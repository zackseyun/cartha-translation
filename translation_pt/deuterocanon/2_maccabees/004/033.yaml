  source_fidelity: O rascunho preserva adequadamente σαφῶς ἐπεγνωκώς («ficou plenamente ciente») e a retirada prévia para um τόπος ἄσυλος. Contudo, ἀπήνεγκεν é melhor expresso por «apresentou uma denúncia» do que pela construção menos idiomática «fez a denúncia»; o texto grego não explicita o objeto da denúncia, que não deve ser acrescentado.
