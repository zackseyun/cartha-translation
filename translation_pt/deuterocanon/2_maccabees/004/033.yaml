  yaml_path: translation/deuterocanon/2_maccabees/004/033.yaml
  text: And Onias[a], when he clearly recognized this, withdrew to a place of asylum at Daphne, which lies near Antioch.
translation:
  language: pt
  text: Onias, tendo compreendido isso claramente, apresentou uma denúncia depois de se retirar para um local de asilo[a] em Dafne, perto de Antioquia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um local de refúgio”. O grego sugere um lugar inviolável de asilo, provavelmente com proteção jurídica e religiosa, e não apenas um lugar seguro em sentido geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: σαφῶς ἐπεγνωκὼς
  choice: ficou plenamente ciente
  rationale: Expressa conhecimento claro e seguro, não mera suspeita, em português natural.
- source_word: ἀπήνεγκεν
  choice: fez a denúncia
  rationale: Neste contexto, o verbo indica comunicar formalmente o ocorrido ou apresentar uma acusação; distingui-lo do particípio seguinte evita fundir dois atos presentes no grego.
- source_word: ἀποκεχωρηκὼς
  choice: depois de se retirar
  rationale: O particípio perfeito indica que Onias já havia se afastado para um lugar seguro quando fez a denúncia.
- source_word: εἰς ἄσυλον τόπον
  choice: para um local de asilo
  rationale: Preserva a ideia de um lugar inviolável, possivelmente dotado de proteção jurídico-religiosa, e não apenas de segurança genérica.
- source_word: ἐπὶ Δάφνης
  choice: em Dafne
  rationale: A preposição tem sentido locativo e identifica onde se encontrava o local de asilo.
- source_word: τῆς πρὸς Ἀντιοχίας κειμένης
  choice: situada perto de Antioquia
  rationale: Identifica geograficamente Dafne com clareza e naturalidade.
