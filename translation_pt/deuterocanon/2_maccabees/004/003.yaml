  language: pt
  text: Mas a hostilidade chegou a tal ponto que até assassinatos eram cometidos por um dos que haviam sido aprovados por Simão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por intermédio de certo indivíduo dentre os aprovados por Simão”. O grego deixa a pessoa sem identificação e destaca que ela pertencia ao grupo aprovado por Simão.'
