lexical_decisions:
- source_word: ἔχθρας
  choice: hostilidade
  rationale: Expressa oposição hostil ou inimizade e se encaixa naturalmente na escalada do conflito.
- source_word: ἐπὶ τοσοῦτον προβαινούσης
  choice: chegou a tal ponto
  rationale: Reproduz de modo idiomático a ideia de progressão até um estágio extremo.
- source_word: διὰ τινος
  choice: por um
  rationale: Mantém a indefinição de τινος; neste contexto, διά com genitivo apresenta a pessoa por intermédio de quem os crimes eram realizados.
- source_word: τῶν ὑπὸ τοῦ Σίμωνος δεδοκιμασμένων
  choice: dos que haviam sido aprovados por Simão
  rationale: Preserva tanto a construção partitiva quanto o sentido de pessoas consideradas provadas ou aprovadas por Simão, sem acrescentar a função de 'agentes' ao texto.
- source_word: φόνους
  choice: assassinatos
  rationale: φόνος designa homicídio culpável ou assassinato, e o plural indica múltiplos crimes.
- source_word: συντελεῖσθαι
  choice: eram cometidos
  rationale: É a colocação portuguesa natural com 'assassinatos' e comunica a realização efetiva e continuada dos crimes.
