lexical_decisions:
- source_word: Ἀγομένου
  choice: se realizavam
  rationale: O particípio no genitivo absoluto, derivado de ἄγω, descreve a realização dos jogos em andamento. «Se realizavam» é natural em português e preserva esse valor circunstancial.
- source_word: πενταετηρικοῦ
  choice: quadrienais
  rationale: Embora a formação grega seja literalmente associada a «cinco anos», no uso festivo antigo designa uma celebração repetida após quatro anos, segundo a contagem inclusiva.
- source_word: ἀγῶνος
  choice: jogos
  rationale: Neste contexto de festa cívica em Tiro, ἀγών se refere a competições públicas; «jogos» comunica isso sem acrescentar que fossem exclusivamente atléticas.
- source_word: ἐν Τύρῳ
  choice: em Tiro
  rationale: Tradução locativa direta do nome da cidade.
- source_word: τοῦ βασιλέως παρόντος
  choice: e o rei estava presente
  rationale: O segundo genitivo absoluto é vertido como oração coordenada para dar fluidez ao português, conservando a circunstância simultânea.
