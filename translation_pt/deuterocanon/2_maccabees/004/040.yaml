  text: But when the crowds were rising up and being filled with anger[a], Lysimachus armed about three thousand men and began unjust violence, with a certain Auranus taking the lead[c][b], a man advanced in age and no less in ignorance.
translation:
  language: pt
  text: Mas, enquanto as multidões se levantavam e se enchiam de ira, Lisímaco armou cerca de três mil homens[a] e começou a praticar violência injusta[b], tendo à frente certo Aurano, homem avançado em idade, mas não menos em ignorância[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uns três mil homens”. O número é aproximado no grego.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “começou mãos injustas”, expressão idiomática para começar a praticar violência injusta.
    reason: lexical_alternative
  - marker: c
    text: 'A formulação grega é irônica: Aurano era avançado em idade, mas igualmente avançado em ignorância.'
    reason: literary_clarification
lexical_decisions:
- source_word: ἐπεγειρομένων
  choice: se levantavam
  rationale: Expressa o início de uma mobilização agitada das multidões sem especificar uma causa externa nem acrescentar um juízo implícito em termos como “amotinavam-se”.
- source_word: ὄχλων
  choice: multidões
  rationale: Equivalente neutro e natural para ὄχλων; evita a conotação pejorativa adicional de “turbas”.
- source_word: ταῖς ὀργαῖς διεμπιπλαμένων
  choice: se enchiam de ira
  rationale: Reproduz a imagem de serem preenchidas por intensa indignação; o singular coletivo “ira” é idiomático em português.
- source_word: καθοπλίσας
  choice: armou
  rationale: Indica de modo conciso que Lisímaco equipou os homens com armas.
- source_word: πρὸς τρισχιλίους
  choice: cerca de três mil
  rationale: Preserva o valor aproximativo de πρός diante do numeral.
- source_word: κατήρξατο χειρῶν ἀδίκων
  choice: deu início a uma violência injusta
  rationale: A expressão grega, literalmente ligada a “mãos injustas”, é um idiomatismo para iniciar atos violentos e ilícitos; esta formulação conserva tanto a ação física quanto a avaliação moral.
- source_word: προηγησαμένου
  choice: sob a liderança
  rationale: Transmite naturalmente que Aurano ia à frente e dirigia a ação.
- source_word: τινὸς Αὑρανοῦ
  choice: certo Aurano
  rationale: “Certo” preserva a maneira como τινός introduz uma personagem pouco conhecida; “Aurano” translitera o nome grego em forma adequada ao português.
- source_word: προβεβηκότος τὴν ἡλικίαν
  choice: avançado em idade
  rationale: Expressa com clareza e dignidade que ele já tinha idade avançada.
- source_word: οὐδὲν δὲ ἧττον καὶ τὴν ἄγνοιαν
  choice: mas não menos em ignorância
  rationale: Mantém o paralelo comparativo e a ironia incisiva do grego, sem explicá-los dentro do texto.
