base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/008.yaml
  text: Jason[a], the brother of Onias, undermined the high priesthood, promising the king through a petition three hundred sixty talents of silver[b], and eighty talents from some other revenue.
translation:
  language: pt
  text: Jasão, irmão de Onias, obteve fraudulentamente o sumo sacerdócio, prometendo ao rei, por meio de uma petição[a], trezentos e sessenta talentos de prata[b] e mais oitenta talentos provenientes de outra fonte de receita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio de uma audiência”; o termo grego pode indicar tanto uma petição formal quanto o acesso pessoal ao rei.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sessenta talentos além dos trezentos”, isto é, um total de trezentos e sessenta talentos de prata.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπενόθευσεν
  choice: obteve fraudulentamente
  rationale: O verbo tem forte sentido negativo de agir de modo fraudulento ou corrupto. No contexto, descreve a obtenção ilícita do sumo sacerdócio por Jasão; a formulação comunica tanto a ação quanto sua avaliação moral sem especificar um mecanismo além do que o texto informa.
- source_word: ἀρχιερωσύνην
  choice: o sumo sacerdócio
  rationale: O substantivo designa o cargo ou a dignidade de sumo sacerdote. “Sumo sacerdócio” é direto, corrente e preserva a referência institucional.
- source_word: ἐπαγγειλάμενος
  choice: prometendo
  rationale: Mantém o valor verbal do particípio e apresenta a promessa de pagamento como o meio empregado por Jasão.
- source_word: διʼ ἐντεύξεως
  choice: por meio de uma petição
  rationale: ἔντευξις pode indicar uma petição ou uma audiência formal perante um governante. “Petição” se ajusta ao contexto político, enquanto a alternativa legítima é registrada em nota.
- source_word: ἀργυρίου
  choice: de prata
  rationale: O genitivo indica a substância ou forma do pagamento; “talentos de prata” é a expressão natural em português.
- source_word: τάλαντα ἑξήκοντα πρὸς τοῖς τριακοσίοις
  choice: trezentos e sessenta talentos
  rationale: A expressão grega diz literalmente “sessenta talentos além dos trezentos”. A soma explícita é mais natural no texto corrido, e a estrutura literal fica preservada em nota.
- source_word: προσόδου τινὸς ἄλλης
  choice: provenientes de outra fonte de receita
  rationale: πρόσοδος denota renda ou receita. A formulação deixa claro que os oitenta talentos viriam de uma fonte adicional, sem identificar sua natureza.
- source_word: τάλαντα ὀγδοήκοντα
  choice: oitenta talentos
  rationale: Tradução direta do valor, preservando a unidade monetária antiga.
theological_decisions:
- issue: Força moral da ação de Jasão em relação ao sumo sacerdócio
  choice: obteve fraudulentamente o sumo sacerdócio
  alternative: corrompeu o sumo sacerdócio
  rationale: O contexto descreve uma aquisição moralmente comprometida do cargo, não uma sucessão neutra. A opção escolhida mantém a avaliação negativa do verbo e esclarece que o objeto da manobra era o ofício, sem transformar a frase em uma afirmação doutrinária sobre a natureza permanente do sumo sacerdócio.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário acessível e leitura natural no Brasil e em outros contextos lusófonos. A ordem das quantias foi naturalizada, mas a forma literal foi mantida em nota; a ambiguidade de ἔντευξις também foi explicitamente preservada.
