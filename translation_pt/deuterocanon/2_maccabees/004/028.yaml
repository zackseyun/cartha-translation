base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/028.yaml
  text: But when Sostratus[a], the commander of the citadel, pressed the claim—for the handling of the revenues belonged to him—for this reason the two men were summoned by the king.
translation:
  language: pt
  text: Mas, quando Sóstrato, comandante da cidadela, fez a cobrança — pois a administração das receitas[a] cabia a ele —, os dois foram convocados pelo rei por esse motivo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pois a arrecadação das receitas cabia a ele”. A expressão grega também pode referir-se mais especificamente à arrecadação ou cobrança de valores.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιουμένου ... τὴν ἀπαίτησιν
  choice: fez a cobrança
  rationale: A expressão descreve Sóstrato tomando a iniciativa de exigir o que era devido. “Fez a cobrança” é natural em português, mantém o caráter administrativo da ação e evita especificar além do texto se se tratava de uma reivindicação, exigência ou cobrança formal.
- source_word: Σωστράτου
  choice: Sóstrato
  rationale: Forma portuguesa tradicional e transparente do nome grego Σώστρατος.
- source_word: τοῦ τῆς ἀκροπόλεως ἐπάρχου
  choice: comandante da cidadela
  rationale: Ἔπαρχος designa o oficial responsável, e ἀκρόπολις é a parte alta fortificada. “Comandante da cidadela” comunica de modo claro a função militar-administrativa sem recorrer a um título técnico pouco acessível.
- source_word: πρὸς τοῦτον γὰρ ἦν
  choice: estava sob sua autoridade
  rationale: A construção indica que a matéria pertencia à esfera de responsabilidade ou jurisdição de Sóstrato. A formulação portuguesa preserva esse sentido sem sugerir posse pessoal.
- source_word: ἡ τῶν διαφόρων πρᾶξις
  choice: a gestão das receitas
  rationale: No contexto administrativo, διάφορα pode designar receitas, valores ou quantias devidas, enquanto πρᾶξις pode abranger sua arrecadação ou administração. “Gestão das receitas” conserva essa amplitude; a nota registra a possibilidade mais específica.
- source_word: διʼ ἣν αἰτίαν
  choice: por esse motivo
  rationale: Reproduz de maneira explícita e natural o nexo causal do grego.
- source_word: οἱ δύο
  choice: os dois
  rationale: O numeral substantivado remete às duas pessoas mencionadas no contexto. O português permite “os dois” sem acrescentar um substantivo ausente do grego.
- source_word: ὑπὸ τοῦ βασιλέως προσεκλήθησαν
  choice: foram convocados pelo rei
  rationale: Mantém a voz passiva e expressa com clareza a convocação oficial feita pelo rei.
