base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/012.yaml
  text: For he gladly established a gymnasium under the very citadel[a], and by bringing the noblest of our young men under the Greek cap, he was leading them on.
translation:
  language: pt
  text: Pois ele estabeleceu de bom grado um ginásio abaixo da própria cidadela e, submetendo os mais destacados dentre os nossos ao pétaso[a], ia conduzindo-os.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pétaso era um chapéu grego de abas largas, usado aqui como sinal visível de identidade e costumes helenísticos.
    reason: Esclarecimento histórico e lexical de um termo cultural grego.
lexical_decisions:
- source_word: ἡδέως
  choice: de bom grado
  rationale: Expressa a disposição voluntária e favorável com que ele estabeleceu o ginásio, sem intensificar indevidamente a emoção.
- source_word: ὑπʼ αὐτὴν ἀκρόπολιν
  choice: logo abaixo da própria cidadela
  rationale: Preserva o sentido espacial de ὑπό com acusativo e a ênfase de αὐτήν, indicando a localização imediatamente junto ou abaixo da fortaleza.
- source_word: γυμνάσιον
  choice: ginásio
  rationale: Designa a instituição helenística de formação física, social e cultural, e não apenas um local genérico de exercícios.
- source_word: καθίδρυσεν
  choice: estabeleceu
  rationale: Comunica adequadamente a fundação e instalação de uma instituição.
- source_word: τοὺς κρατίστους τῶν ἐφʼ ἡμῶν
  choice: os mais destacados dos nossos jovens
  rationale: κρατίστους indica os melhores ou mais distintos; “jovens” explicita, com apoio no contexto do ginásio, o grupo social visado, embora a idade não seja expressa diretamente pelo substantivo grego.
- source_word: ὑποτάσσων
  choice: colocando ... sob
  rationale: Mantém tanto a imagem espacial ligada ao pétaso quanto a nuance de sujeição ou conformação cultural presente no particípio.
- source_word: ὑπὸ πέτασον
  choice: sob o pétaso
  rationale: Conserva o objeto cultural concreto do texto grego em vez de substituí-lo por uma abstração como “costumes gregos”; a nota explica o termo histórico.
- source_word: ἦγεν
  choice: ia conduzindo-os
  rationale: O imperfeito exprime uma ação progressiva. A formulação preserva a abertura do grego quanto ao destino ou à direção dessa condução.
theological_decisions:
- issue: Assimilação cultural implícita em ὑπὸ πέτασον
  choice: Manter a imagem concreta “sob o pétaso”.
  alternative: Traduzir de modo abstrato como “para os costumes gregos” ou “para o modo de vida grego”.
  rationale: O texto apresenta um marcador cultural visível, não uma formulação abstrata. A tradução preserva essa imagem e deixa que o contexto comunique a helenização.
- issue: Objeto ou direção não expressos com ἦγεν
  choice: Traduzir “ia conduzindo-os” sem acrescentar um destino explícito.
  alternative: “Ia conduzindo-os ao modo de vida grego.”
  rationale: Acrescentar um destino interpretativo resolveria uma abertura sintática e retórica que o grego mantém.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Ginásio” e “pétaso” preservam as instituições e imagens específicas do ambiente helenístico; a nota evita sobrecarregar o texto principal.
