base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/024.yaml
  text: But after being presented to the king and magnifying him by the display of his authority[a], he secured the high priesthood for himself[b], outbidding Jason by three hundred talents of silver.
translation:
  language: pt
  text: Mas ele, depois de ser apresentado ao rei[a] e de exaltá-lo com uma demonstração de autoridade[b], conseguiu para si o sumo sacerdócio, oferecendo trezentos talentos de prata a mais que Jasão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois de ser recomendado ao rei”. O grego pode indicar uma apresentação formal ou uma recomendação na corte.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com a face/presença da autoridade”, expressão que pode indicar aparência, postura ou porte impressionante de autoridade.
    reason: lexical_alternative
lexical_decisions:
- source_word: συσταθεὶς τῷ βασιλεῖ
  choice: depois de ser apresentado ao rei
  rationale: O particípio passivo indica que ele foi levado à presença do rei ou formalmente apresentado ou recomendado a ele. “Apresentado ao rei” é natural em português e preserva o contexto da corte sem especificar além do grego.
- source_word: δοξάσας αὐτὸν
  choice: de exaltá-lo
  rationale: δοξάζω pode significar glorificar, honrar ou exaltar. “Exaltá-lo” mantém a força elogiosa do verbo sem impor a conotação negativa mais específica de “bajulá-lo”.
- source_word: τῷ προσώπῳ τῆς ἐξουσίας
  choice: com uma demonstração de autoridade
  rationale: A expressão é literalmente próxima de “com a face/presença da autoridade”, mas funciona de modo idiomático. A escolha comunica uma aparência ou postura impressionante de autoridade sem reproduzir uma formulação opaca em português.
- source_word: εἰς ἑαυτὸν κατήντησεν ἀρχιερωσύνην
  choice: conseguiu para si o sumo sacerdócio
  rationale: A construção indica que ele fez o cargo chegar a si, isto é, obteve-o em benefício próprio. A formulação preserva tanto a aquisição efetiva quanto a ênfase reflexiva.
- source_word: ὑπερβάλλων τὸν Ἰάσονα τάλαντα ἀργυρίου τριακόσια
  choice: oferecendo trezentos talentos de prata a mais que Jasão
  rationale: Diante da quantia especificada, ὑπερβάλλων expressa que ele excedeu a oferta de Jasão. Esta redação torna clara a comparação financeira sem recorrer ao possível modernismo de “cobrir a oferta”.
theological_decisions:
- issue: Coloração moral do elogio dirigido ao rei
  choice: “exaltá-lo”, sem explicitar bajulação
  alternative: “bajulá-lo” ou “honrá-lo”
  rationale: Embora o contexto mostre manobra política, δοξάζω não exige por si só a interpretação pejorativa de bajulação. A tradução permite que o contexto forneça a avaliação moral.
- issue: Sentido da expressão τῷ προσώπῳ τῆς ἐξουσίας
  choice: entendê-la como manifestação exterior ou porte de autoridade
  alternative: “com a face da autoridade” ou “com semblante autoritário”
  rationale: A expressão grega é condensada e ambígua. A redação escolhida comunica seu provável sentido idiomático sem transformá-la em formulação ininteligível nem atribuir explicitamente a autoridade a uma pessoa específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se “talentos” como unidade antiga e evita-se atribuir ao texto uma censura moral mais explícita do que o verbo grego requer.
