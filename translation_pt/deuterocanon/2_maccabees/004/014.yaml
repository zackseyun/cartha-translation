  text: so that the priests were no longer eager for the services of the altar[a], but, despising the temple and neglecting the sacrifices, they hurried to take part in the unlawful exercise in the wrestling school after the summons to the discus throw[b];
translation:
  language: pt
  text: de modo que os sacerdotes já não mostravam zelo pelos serviços do altar; pelo contrário, desprezando o templo e negligenciando os sacrifícios, apressavam-se a participar da provisão ilícita[a] na palestra, depois da convocação para o disco[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “custeio ilícito”, “patrocínio ilícito” ou “fornecimento proibido”. A expressão grega é difícil e pode referir-se ao apoio ou aos recursos ligados às atividades atléticas. A palestra era o local de treinamento atlético, especialmente de luta.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: Literalmente, “depois da convocação do disco”, isto é, o chamado para participar dessa prova atlética.
    reason: cultural_note
lexical_decisions:
- source_word: λειτουργίας
  choice: serviço
  rationale: No contexto cultual, designa o serviço sacerdotal prestado no altar. O singular coletivo é natural em português e evita associar o termo exclusivamente à acepção eclesiástica posterior de “liturgia”.
- source_word: προθύμους
  choice: zelosos
  rationale: Expressa disposição ardorosa e empenho. “Zelosos” se ajusta ao contexto sacerdotal e reforça o contraste com o desprezo e a negligência subsequentes.
- source_word: νεὼ
  choice: templo
  rationale: Refere-se ao edifício do templo em Jerusalém; “templo” é a designação corrente e inequívoca.
- source_word: καταφρονοῦντες
  choice: desprezavam
  rationale: Mantém a força moral do particípio grego, que indica desprezo ativo, não mera falta de interesse.
- source_word: ἀμελοῦντες
  choice: negligenciavam
  rationale: Indica que deixavam de dar aos sacrifícios a devida atenção e cuidado.
- source_word: παλαίστρῃ
  choice: palestra
  rationale: A palavra designa o local ou escola de treinamento atlético, sobretudo de luta. O empréstimo histórico português “palestra”, esclarecido em nota, é mais preciso que “ginásio” e evita a expressão pouco natural “escola de luta”.
- source_word: παρανόμου χορηγίας
  choice: provisão ilícita
  rationale: χορηγία pode indicar fornecimento, custeio, patrocínio ou provisão. A formulação conserva a dificuldade lexical e a relação com as atividades atléticas sem reduzir o termo simplesmente a “exercício”.
- source_word: ἔσπευδον μετέχειν
  choice: correndo para participar
  rationale: Reproduz a pressa ativa expressa pelo verbo e mantém o contraste vívido com a negligência do culto.
- source_word: μετὰ τὴν τοῦ δίσκου πρόσκλησιν
  choice: assim que se fazia a convocação para o lançamento do disco
  rationale: No contexto, μετά introduz a convocação após a qual os sacerdotes se apressavam. A formulação portuguesa explicita de modo natural o evento atlético sem alterar seu sentido.
theological_decisions:
- issue: Sentido de παρανόμου no contexto da Lei judaica e da helenização
  choice: ilícita
  alternative: contrária à Lei
  rationale: O contexto apresenta a conduta como contrária à lei ancestral e aos deveres sacerdotais, mas o adjetivo grego não especifica por si só qual ordenamento está em vista. “Ilícita” preserva a condenação do narrador sem resolver essa amplitude na tradução.
- issue: Identificação precisa de χορηγία
  choice: provisão, com alternativas em nota
  alternative: atividade ou exercício
  rationale: O substantivo se refere lexicalmente a fornecimento, custeio ou patrocínio, embora no contexto possa abranger a atividade atlética assim sustentada. A tradução evita substituir a dificuldade do original por uma identificação contextual excessivamente definida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura longa do grego foi dividida em duas frases para fluidez, sem perder a relação causal nem o contraste. “Palestra” é empregado em seu sentido histórico de recinto atlético e por isso recebe esclarecimento em nota.
