base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/006.yaml
  text: For he saw that without royal intervention it was impossible for affairs to attain peace[c][b][a], and that Simon would not stop his folly.
translation:
  language: pt
  text: Pois, ao considerar isso,[a] ele via que, sem a intervenção do rei,[b] não seria possível trazer paz aos assuntos públicos e que Simão não desistiria de sua insensatez.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego começa com um particípio que pode ser traduzido por “considerando” ou “observando” e que liga estreitamente este versículo à frase anterior.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sem a πρόνοια real”. O termo grego pode significar previsão, cuidado ou provisão; aqui, provavelmente se refere à atuação ou ao apoio efetivo do rei.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “Simão não receberia uma pausa de sua insensatez”, isto é, não desistiria dela.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοπῶν
  choice: ao considerar a situação
  rationale: O particípio liga este versículo ao contexto anterior. A formulação mantém essa ligação e evita deixá-lo solto em português.
- source_word: βασιλικῆς προνοίας
  choice: intervenção do rei
  rationale: πρόνοια pode indicar previsão, cuidado ou providência. No contexto político, refere-se provavelmente à atuação prática do rei necessária para solucionar o conflito.
- source_word: τυχεῖν εἰρήνης
  choice: chegassem à paz
  rationale: O verbo com o genitivo expressa alcançar ou obter algo; a expressão é natural em português e preserva o sentido resultativo.
- source_word: ἐπὶ τὰ πράγματα
  choice: os assuntos
  rationale: τὰ πράγματα designa o estado dos assuntos ou a situação prática, aqui no âmbito público e político.
- source_word: παῦλαν οὐ λημψόμενον
  choice: não poria fim
  rationale: A expressão significa literalmente que Simão não receberia uma pausa; em português idiomático, indica que ele não cessaria sua conduta.
- source_word: ἀνοίας
  choice: insensatez
  rationale: ἄνοια denota falta de bom senso, insensatez ou loucura. A escolha conserva a avaliação moral sem sugerir necessariamente uma condição clínica.
