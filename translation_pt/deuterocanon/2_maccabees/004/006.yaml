  terminology: «Intervenção do rei» transmite bem βασιλικῆς προνοίας no contexto político, sem eliminar as alternativas lexicais registradas na nota. «Insensatez» é uma boa equivalência não clínica para ἀνοία. «Simão» está corretamente vertido.
