  text: But after a period of three years[a], Jason sent Menelaus, the brother of the aforementioned Simon, to carry the money to the king and to deliver memoranda concerning necessary matters.
translation:
  language: pt
  text: Passados três anos, porém, Jasão enviou Menelau, irmão do já mencionado Simão, para levar o dinheiro ao rei e para executar instruções por escrito acerca de assuntos necessários.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cumprir memorandos acerca de assuntos necessários” ou “finalizar relatórios escritos sobre assuntos necessários”. O termo grego pode indicar memorandos, instruções, registros ou relatórios, e a nuance administrativa exata é incerta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τριετῆ χρόνον
  choice: Passados três anos, porém
  rationale: Expressa naturalmente o período transcorrido indicado por μετά com acusativo e preserva δέ como transição narrativa leve.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Equivalente direto e natural do aoristo de ἀποστέλλω neste contexto narrativo.
- source_word: Ἰάσων / Μενέλαον / Σίμωνος
  choice: Jasão / Menelau / Simão
  rationale: Emprega as formas tradicionais e reconhecíveis desses nomes em português.
- source_word: τὸν τοῦ προσηνομένου Σίμωνος ἀδελφόν
  choice: irmão do já mencionado Simão
  rationale: Preserva a referência de προσηνομένου a uma menção anterior, em português claro e atual.
- source_word: παρακομίζοντα τὰ χρήματα τῷ βασιλεῖ
  choice: para levar o dinheiro ao rei
  rationale: Interpreta o particípio como finalidade da missão; χρήματα designa aqui dinheiro ou recursos financeiros.
- source_word: περὶ πραγμάτων ἀναγκαίων
  choice: sobre assuntos necessários
  rationale: Mantém a amplitude de πράγματα e o sentido de necessidade de ἀναγκαίων, sem impor que fossem necessariamente assuntos urgentes.
- source_word: ὑπομνηματισμοὺς τελέσοντα
  choice: concluir registros escritos
  rationale: Conserva o caráter documental ou administrativo de ὑπομνηματισμούς e a ideia de levar algo a termo em τελέσοντα, deixando a nuance exata para a nota.
