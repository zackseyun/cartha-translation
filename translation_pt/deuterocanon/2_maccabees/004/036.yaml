  yaml_path: translation/deuterocanon/2_maccabees/004/036.yaml
  text: They were indignant and deeply grieved over the man's unjust murder. But when the king returned from the regions of Cilicia[a], the Jews in the city appealed to him, and the Greeks as well, sharing in their hatred of the wicked deed,
translation:
  language: pt
  text: Eles estavam indignados e profundamente aflitos por causa do assassinato injusto daquele homem. Quando, porém, o rei voltou das regiões da Cilícia, os judeus da cidade apresentaram-lhe uma queixa, enquanto também os gregos compartilhavam do repúdio ao malfeito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os gregos também se uniam ao ódio ao mal». O raro particípio grego συμμισοπονηρούντων pode referir-se ao repúdio compartilhado ao mal em geral ou, no contexto, ao ato cometido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδείναζον
  choice: ficaram indignados
  rationale: O verbo exprime forte aflição ou revolta; em combinação com ἐδυσφόρουν, destaca aqui a indignação moral.
- source_word: ἐδυσφόρουν
  choice: profundamente aflitos
  rationale: Expressa que suportavam muito mal o ocorrido e preserva uma nuance emocional distinta da indignação.
- source_word: ἐπὶ τῷ τοῦ ἀνδρὸς ἀδίκῳ φόνῳ
  choice: com o assassinato injusto daquele homem
  rationale: φόνος indica homicídio ou assassinato, e ἄδικος explicita seu caráter injusto; 'daquele homem' retoma naturalmente a pessoa já mencionada no contexto.
- source_word: ἐπανελθόντος
  choice: voltou
  rationale: Verte de modo direto e natural o particípio temporal do genitivo absoluto.
- source_word: τῶν κατὰ Κιλικίαν τόπων
  choice: das regiões da Cilícia
  rationale: Mantém a referência geográfica ampla a lugares ou territórios da Cilícia.
- source_word: ἐνετύγχανον
  choice: lhe apresentaram sua queixa
  rationale: No contexto de súditos diante do rei, o verbo denota dirigir-se a ele com uma petição ou reclamação; a formulação explicita o destinatário implícito.
- source_word: οἱ κατὰ πόλιν Ἰουδαῖοι
  choice: os judeus da cidade
  rationale: Expressa de forma idiomática os judeus residentes na cidade.
- source_word: συμμισοπονηρούντων
  choice: se uniram a eles no repúdio àquele ato perverso
  rationale: O raro composto indica participação conjunta na aversão ao mal ou à perversidade; 'repúdio' transmite essa forte reprovação sem definir de maneira excessivamente estreita o objeto implícito.
- source_word: καὶ τῶν Ἑλλήνων
  choice: e também os gregos
  rationale: Preserva a inclusão dos gregos na reação compartilhada, conforme a construção genitiva ligada ao particípio.
