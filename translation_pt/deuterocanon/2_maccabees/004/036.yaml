revisions:
- from: Eles ficaram indignados e profundamente aflitos com o assassinato injusto daquele homem. Quando, porém, o rei voltou das regiões da Cilícia, os judeus da cidade lhe apresentaram sua queixa, e também os gregos se uniram a eles no repúdio àquele ato perverso.
  to: Eles estavam indignados e profundamente aflitos por causa do assassinato injusto daquele homem. Quando, porém, o rei voltou das regiões da Cilícia, os judeus da cidade apresentaram-lhe uma queixa, enquanto também os gregos compartilhavam do repúdio ao malfeito.[a]
