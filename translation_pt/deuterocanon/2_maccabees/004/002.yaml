  yaml_path: translation/deuterocanon/2_maccabees/004/002.yaml
  text: and he dared to call the benefactor of the city[a], the guardian of his fellow countrymen, and the zealot for the laws, a conspirator against the state.
translation:
  language: pt
  text: e ousava chamar o benfeitor da cidade, o protetor de seus compatriotas e o defensor zeloso das leis de conspirador contra o Estado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «alguém que tramava contra os assuntos públicos» ou «um conspirador contra a comunidade política». A expressão grega tem sentido político, não indica apenas hostilidade pessoal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐεργέτην
  choice: benfeitor
  rationale: Preserva o sentido honorífico e cívico de alguém que presta benefícios públicos.
- source_word: κηδεμόνα
  choice: protetor
  rationale: Exprime de modo natural o cuidado e a defesa implicados no termo grego.
- source_word: τῶν ὁμοεθνῶν
  choice: de seus compatriotas
  rationale: Comunica a solidariedade étnica e nacional com linguagem portuguesa corrente.
- source_word: ζηλωτὴν τῶν νόμων
  choice: defensor zeloso das leis
  rationale: Evita que «zelote» seja entendido como rótulo partidário e preserva a ideia de dedicação ardorosa; mantém também o plural explícito «leis».
- source_word: ἐπίβουλον τῶν πραγμάτων
  choice: conspirador contra o Estado
  rationale: Reproduz a força de uma acusação política, não de mera hostilidade pessoal; a nota registra a amplitude semântica de πράγματα.
- source_word: ἐτόλμα λέγειν
  choice: ousava chamar
  rationale: Mantém a audácia expressa pelo verbo e verte idiomaticamente a aplicação do predicativo acusatório; o imperfeito «ousava» reflete o aspecto da forma grega.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Defensor zeloso» evita a possível associação anacrônica de «zelote» com um partido específico. A colocação da nota após «Estado» vincula corretamente o marcador à expressão explicada.
