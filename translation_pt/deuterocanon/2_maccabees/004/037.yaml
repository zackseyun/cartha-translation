  yaml_path: translation/deuterocanon/2_maccabees/004/037.yaml
  text: So Antiochus[a], deeply grieved in soul and moved to pity, and having wept because of the self-control and great good order of the one who had died[c][b],
translation:
  language: pt
  text: Assim, Antíoco, profundamente entristecido na alma e movido à compaixão[a], chorou por causa do autocontrole e da grande disciplina[b] daquele que havia morrido[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “levado a ter misericórdia”; literalmente, “voltado para a misericórdia”.
    reason: lexical_alternative
  - marker: b
    text: “Disciplina” também pode ser entendida como “conduta ordeira”, “compostura” ou “correção de conduta”.
    reason: lexical_alternative
  - marker: c
    text: Ou “do falecido”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχικῶς ὑπολυπηθείς
  choice: profundamente entristecido
  rationale: A expressão descreve a tristeza interior de Antíoco. “Profundamente entristecido” comunica de modo natural a intensidade afetiva de ψυχικῶς sem uma formulação artificial como “entristecido na alma”.
- source_word: τραπεὶς ἐπὶ ἔλεος
  choice: movido à compaixão
  rationale: A expressão significa literalmente “voltado para a misericórdia/compaixão”. A tradução escolhida preserva a mudança de disposição e soa natural em português.
- source_word: δακρύσας
  choice: chorou
  rationale: Embora o grego use um particípio aoristo, o verbo finito produz uma sequência clara e natural em português, sem alterar o sentido do ato de derramar lágrimas.
- source_word: διὰ
  choice: por causa de
  rationale: Com acusativo, a preposição indica aqui a causa do choro de Antíoco.
- source_word: τοῦ μετηλλαχότος
  choice: daquele que havia morrido
  rationale: O particípio perfeito substantivado refere-se à pessoa falecida anteriormente mencionada. A formulação é transparente e preserva a anterioridade da morte.
- source_word: σωφροσύνην
  choice: autocontrole
  rationale: O termo pode indicar moderação, domínio de si, prudência ou sensatez. “Autocontrole” preserva de maneira clara sua dimensão moral sem impor uma interpretação denominacional.
- source_word: πολλὴν εὐταξίαν
  choice: grande disciplina
  rationale: εὐταξία abrange ordem, disciplina, compostura e conduta apropriada. “Grande disciplina” é conciso, inteligível e mantém aberta a referência tanto à disposição pessoal quanto ao comportamento ordeiro.
