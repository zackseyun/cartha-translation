base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/034.yaml
  text: Therefore Menelaus took Andronicus aside privately and urged him to strike down Onias by treachery[a]. Andronicus went to Onias, and after winning his confidence by deceit and greeting him with oaths, giving him his right hand, though he was under suspicion, he persuaded him to come out from the place of asylum. Then he immediately shut him away[c][b], showing no regard for justice.
translation:
  language: pt
  text: Por isso, Menelau chamou Andrônico em particular e o instigou a eliminar Onias traiçoeiramente.[a] Andrônico foi até Onias e, depois de ganhar sua confiança com engano, de acolhê-lo com juramentos e de lhe dar a mão direita, embora estivesse sob suspeita, convenceu-o a sair do lugar de asilo.[b] Então, imediatamente, encerrou-o,[c] sem nenhum respeito pela justiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra grega aqui é textual e lexicalmente difícil. Pelo contexto, Menelau instigou Andrônico a providenciar traiçoeiramente a morte de Onias.
    reason: textual_variant
  - marker: b
    text: 'Ou: «a sair do santuário» ou «a deixar o refúgio». O termo grego designa um lugar protegido de asilo.'
    reason: lexical_alternative
  - marker: c
    text: O contexto pode indicar, de modo mais forte, «assassinou-o» ou «mandou matá-lo», embora o verbo grego empregado aqui seja menos explícito.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: Por isso
  rationale: Expressa de modo natural a inferência causal que liga o versículo à situação anterior.
- source_word: λαβὼν ἰδίᾳ
  choice: chamou ... em particular
  rationale: Comunica uma conversa reservada e de caráter conspiratório, sem reproduzir de modo rígido a construção participial grega.
- source_word: παρεκάλει
  choice: instigou
  rationale: No contexto de uma ação criminosa, indica pressão ou incitamento com mais precisão do que o neutro «pediu».
- source_word: χειρόγραφον
  choice: a eliminar ... traiçoeiramente
  rationale: A forma transmitida é lexical e textualmente difícil. O contexto aponta para a promoção da morte de Onias por meio de uma trama; a nota preserva a dificuldade.
- source_word: παραγόμενος ἐπὶ τὸν Ὀνίαν
  choice: foi até Onias
  rationale: Tradução clara e idiomática da expressão de movimento.
- source_word: πεισθεὶς ἐπὶ δόλῳ
  choice: depois de ganhar sua confiança com engano
  rationale: Explicita em português o efeito da persuasão fraudulenta sem ocultar seu caráter enganoso.
- source_word: δεξιωθεὶς μεθʼ ὅρκων
  choice: saudá-lo sob juramento
  rationale: Preserva a demonstração exterior de boa-fé, reforçada por juramentos, sem interpretar excessivamente o gesto.
- source_word: δοὺς δεξιάν
  choice: estender-lhe a mão direita
  rationale: Mantém o gesto antigo de confiança e compromisso em formulação natural em português.
- source_word: καίπερ ἐν ὑποψίᾳ κείμενος
  choice: embora estivesse sob suspeita
  rationale: Conserva a construção concessiva e a ambiguidade do grego quanto à origem e ao objeto exato da suspeita.
- source_word: ἔπεισεν ἐκ τοῦ ἀσύλου προελθεῖν
  choice: convenceu-o a sair do lugar de asilo
  rationale: Mantém o sentido jurídico-protetor de ἄσυλον sem restringi-lo necessariamente a um santuário cultual.
- source_word: παραχρῆμα
  choice: imediatamente
  rationale: Equivalente temporal claro e corrente.
- source_word: παρέκλεισεν
  choice: encerrou-o
  rationale: Permanece próximo da ideia lexical de fechar ou confinar, enquanto a nota registra que o contexto pode indicar a morte de Onias.
theological_decisions:
- issue: Natureza de ἄσυλον
  choice: lugar de asilo
  alternative: santuário; refúgio
  rationale: A expressão preserva a condição de lugar protegido e inviolável sem decidir indevidamente se o aspecto cultual deve predominar.
- issue: Força de παρέκλεισεν no contexto
  choice: encerrou-o
  alternative: assassinou-o; mandou matá-lo
  rationale: A narrativa mais ampla implica a morte de Onias, mas o verbo grego neste ponto é menos explícito; o texto principal retém essa tensão e a nota apresenta o sentido contextual mais forte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi moderadamente reorganizada para clareza, preservando a sequência de engano, juramento, gesto de confiança, saída do asilo e violência. Os marcadores aparecem junto às expressões a que se referem.
