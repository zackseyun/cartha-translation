base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/030.yaml
  text: While these things were underway[a], it happened that the people of Tarsus and Mallus revolted, because they were being given as a gift to Antiochis, the king’s concubine.
translation:
  language: pt
  text: Enquanto isso acontecia, os habitantes de Tarso e de Malo se revoltaram, porque as cidades de Tarso e de Malo estavam sendo dadas como presente[a] a Antióquida, concubina do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «os habitantes de Tarso e de Malo estavam sendo dados como presente». No contexto, a referência é entendida como sendo às cidades de Tarso e de Malo.
    reason: A redação portuguesa explicita o referente contextual do dom régio e evita sugerir que os habitantes eram literalmente o presente.
lexical_decisions:
- source_word: συνεστηκότων
  choice: enquanto essa situação continuava
  rationale: O particípio em genitivo absoluto estabelece o pano de fundo temporal e liga o episódio ao contexto anterior. A formulação comunica essa transição narrativa sem sugerir uma reunião física.
- source_word: Ταρσεῖς καὶ Μαλλῶτας
  choice: os habitantes de Tarso e de Malo
  rationale: Os termos gregos são gentílicos plurais. A construção com “habitantes de” é clara e natural em português, evitando gentílicos pouco conhecidos.
- source_word: στασιάζειν
  choice: se revoltaram
  rationale: O verbo indica agitação facciosa ou rebelião política; “se revoltaram” expressa de modo conciso a ação neste contexto.
- source_word: Ἀντιοχίδι
  choice: Antióquida
  rationale: Forma portuguesa do nome próprio feminino grego Ἀντιοχίς, aqui no dativo como destinatária do presente.
- source_word: παλλακῇ
  choice: concubina
  rationale: O termo designa uma mulher em união reconhecida, porém de condição inferior à esposa principal. “Concubina” preserva melhor o sentido histórico do que “amante”, que poderia introduzir conotações modernas.
- source_word: ἐν δωρεᾷ δίδοσθαι
  choice: suas cidades estavam sendo dadas de presente
  rationale: A expressão mantém a voz passiva e o caráter de concessão régia. “Suas cidades” explicita o referente implícito — Tarso e Malo — e evita que o português dê a entender que os habitantes, e não as cidades, eram o presente.
