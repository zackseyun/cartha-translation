  text: and may he give you a faithful heart to worship him and to do his will with a great heart and a willing soul;[a]
translation:
  language: pt
  text: e que ele lhes dê um coração fiel[a] para adorá-lo e fazer a sua vontade com um coração grande e uma alma disposta;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «um coração de fé» ou «um coração crente». A expressão grega pode enfatizar a fé ou a fidelidade; o texto principal traz «coração fiel» porque o contexto destaca a adoração e a obediência.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοίη
  choice: que ele lhes dê
  rationale: O optativo exprime desejo ou oração. A construção portuguesa com «que» preserva essa força de bênção sem explicitar o sujeito além do contexto.
- source_word: καρδίαν πίστιν
  choice: um coração fiel
  rationale: A expressão associa o coração à fé ou fidelidade. No contexto de adoração e obediência, «coração fiel» comunica naturalmente uma disposição leal e perseverante, sem eliminar as leituras relacionadas à fé, registradas em nota.
- source_word: σέβεσθαι
  choice: adorá-lo
  rationale: O verbo denota reverência religiosa; «adorar» é claro e idiomático neste contexto de oração dirigida a Deus.
- source_word: τὰ θελήματα
  choice: a sua vontade
  rationale: Embora o grego empregue o plural, o singular coletivo é a forma portuguesa natural para aquilo que Deus quer.
- source_word: καρδίᾳ μεγάλῃ
  choice: com um coração grande
  rationale: Mantém a imagem grega de grandeza do coração e sua abertura sem restringi-la silenciosamente a inteireza, generosidade ou nobreza.
- source_word: ψυχῇ βουλομένῃ
  choice: uma alma disposta
  rationale: «Alma» conserva a linguagem antropológica de ψυχή, e «disposta» expressa intenção voluntária e prontidão.
theological_decisions:
- issue: Sentido da linguagem da família de πίστις em contexto devocional não paulino
  choice: coração fiel
  alternative: coração de fé; coração crente
  rationale: A ligação imediata com adorar a Deus e fazer sua vontade favorece a ideia de fidelidade ou devoção perseverante, embora o grego também permita destacar fé ou crença; essas alternativas são preservadas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega «lhes» para o destinatário plural e preserva as imagens de «coração» e «alma» do grego.
