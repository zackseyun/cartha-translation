base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/007.yaml
  text: In the reign of Demetrius[a], in the one hundred sixty-ninth year, we Jews wrote to you in the distress and in the crisis that came upon us in those years[c][b], after Jason and those with him departed from the holy land and the kingdom.
translation:
  language: pt
  text: Durante o reinado de Demétrio, no ano cento e sessenta e nove, nós, os judeus, escrevemos a vocês em meio à aflição e no auge da crise que nos sobreveio naqueles anos, desde que Jasão e os que estavam com ele se afastaram da terra santa e do reino.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “desertaram”, “se revoltaram” ou “apostataram”. O verbo grego pode indicar afastamento, defecção política ou abandono religioso.
    reason: alternative_reading
lexical_decisions:
- source_word: βασιλεύοντος Δημητρίου
  choice: Durante o reinado de Demétrio
  rationale: Reproduz de modo natural em português a fórmula cronológica do genitivo absoluto.
- source_word: ἔτους ἑκατοστοῦ ἑξηκοστοῦ ἐνάτου
  choice: no ano cento e sessenta e nove
  rationale: Mantém a datação formal com redação literária clara.
- source_word: ἡμεῖς οἱ Ἰουδαῖοι
  choice: nós, os judeus
  rationale: Conserva a ênfase do pronome e a autodesignação étnico-religiosa.
- source_word: γεγράφαμεν
  choice: escrevemos
  rationale: O perfeito grego pode ter valor epistolar; o pretérito perfeito é natural em português neste contexto.
- source_word: ἐν τῇ θλίψει
  choice: em meio à aflição
  rationale: Expressa sofrimento e pressão severos sem introduzir terminologia teológica técnica.
- source_word: ἐν τῇ ἀκμῇ
  choice: no auge da crise
  rationale: Preserva tanto a ideia literal de ponto culminante quanto a situação aguda indicada pelo contexto.
- source_word: τῇ ἐπελθούσῃ ἡμῖν
  choice: que nos sobreveio
  rationale: Apresenta a adversidade como algo que atingiu a comunidade.
- source_word: ἐν τοῖς ἔτεσιν τούτοις
  choice: naqueles anos
  rationale: A perspectiva retrospectiva favorece esta formulação natural em português.
- source_word: ἀφʼ οὗ
  choice: desde que
  rationale: Marca o ponto inicial da aflição e preserva melhor que simples 'depois que' a extensão temporal sugerida pela expressão.
- source_word: ἀπέστη
  choice: se afastaram
  rationale: Mantém aberta a possibilidade de afastamento, defecção ou revolta, sem reduzir o verbo a uma leitura exclusivamente política ou religiosa.
- source_word: Ἰάσων καὶ οἱ μετʼ αὐτοῦ
  choice: Jasão e os que estavam com ele
  rationale: Tradução direta que não especifica indevidamente a relação entre Jasão e seus associados.
- source_word: ἀπὸ τῆς ἁγίας γῆς καὶ τῆς βασιλείας
  choice: da terra santa e do reino
  rationale: Preserva os dois complementos coordenados e a linguagem de santidade aplicada à terra.
theological_decisions:
- issue: Sentido de ἀπέστη em relação a Jasão
  choice: se afastaram
  alternative: se revoltaram; desertaram; apostataram
  rationale: O verbo pode conter dimensões políticas e religiosas. A formulação principal conserva essa ambiguidade, enquanto a nota registra alternativas mais fortes sem escolher uma delas como exclusiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha a estrutura epistolar e cronológica do grego sem soar artificial; a ambiguidade central de ἀπέστη é preservada no texto e explicitada em nota.
