  yaml_path: translation/deuterocanon/2_maccabees/001/022.yaml
  text: And when this happened and some time had passed[a], and the sun shone out though it was clouded over, a great fire was kindled, so that everyone marveled.
translation:
  language: pt
  text: Quando isso aconteceu e algum tempo se passou, o sol brilhou, embora estivesse encoberto por nuvens[a], e acendeu-se um grande fogo, de modo que todos ficaram maravilhados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enquanto estava nublado”. A expressão participial grega ἐπινεφὴς ὤν descreve uma condição de nebulosidade; no texto, ela pode ser entendida de modo concessivo — o sol brilhou apesar das nuvens — ou temporal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο
  choice: Quando isso aconteceu
  rationale: Expressa em português corrente a fórmula temporal que introduz o acontecimento, sem o arcaísmo de “veio a acontecer”.
- source_word: καὶ χρόνος διῆλθεν
  choice: e algum tempo se passou
  rationale: Preserva a duração indefinida indicada por χρόνος e verte naturalmente o aoristo διῆλθεν.
- source_word: ὅ τε ἥλιος ἀνέλαμψεν
  choice: o sol brilhou
  rationale: ἀναλάμπω indica que o sol passou a brilhar ou irrompeu em brilho; a formulação escolhida é clara e não intensifica além do texto.
- source_word: ἐπινεφὴς ὤν
  choice: embora estivesse encoberto por nuvens
  rationale: A locução participial descreve uma condição nublada. A leitura concessiva explica a tensão contextual entre a cobertura de nuvens e o brilho do sol, sem eliminar a alternativa temporal.
- source_word: ἀνήφθη
  choice: acendeu-se
  rationale: O passivo de ἀνάπτω indica que o fogo foi aceso; a construção pronominal é natural em português e mantém o agente sem expressão.
- source_word: πυρὰ μεγάλη
  choice: um grande fogo
  rationale: πυρά pode designar fogo, fogueira ou pira. “Grande fogo” conserva a amplitude lexical sem especificar indevidamente sua forma.
- source_word: ὥστε θαυμάσαι πάντας
  choice: de modo que todos ficaram maravilhados
  rationale: Reproduz a relação de resultado de ὥστε com infinitivo e mantém o alcance universal de πάντας.
