lexical_decisions:
- source_word: ἔτους
  choice: No ... ano
  rationale: O genitivo integra uma fórmula breve de datação; em português, a construção adverbial «No ... ano» expressa essa função de modo natural.
- source_word: ὀγδοηκοστοῦ καὶ ὀγδόου
  choice: octogésimo oitavo
  rationale: A expressão grega analítica, literalmente «octogésimo e oitavo», forma o ordinal correspondente a «octogésimo oitavo» em português.
- source_word: ἐν Ἱεροσολύμοις
  choice: em Jerusalém
  rationale: A preposição é locativa, e o topônimo grego de forma plural é convencionalmente traduzido no singular como «Jerusalém».
