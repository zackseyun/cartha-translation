  text: and may God do good to you[a], and remember his covenant with Abraham, Isaac, and Jacob, his faithful slaves.
translation:
  language: pt
  text: e que Deus lhes faça o bem e se lembre da sua aliança com Abraão, Isaque e Jacó, seus escravos fiéis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus servos fiéis”. O grego diz “escravos”, enfatizando que eles pertencem a Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαθοποιῆσαι
  choice: faça o bem
  rationale: Expressa de modo direto e natural o desejo ou oração de que Deus aja para o bem dos destinatários, sem especificar indevidamente a forma desse benefício.
- source_word: μνησθῆναι
  choice: se lembre
  rationale: Preserva a formulação bíblica e sua ressonância pactual; nesse contexto, lembrar implica considerar fielmente a aliança e agir em conformidade com ela, sem que essa implicação seja explicitada no texto.
- source_word: διαθήκης
  choice: aliança
  rationale: A referência a Abraão, Isaque e Jacó identifica claramente a aliança bíblica, e não um acordo genérico ou testamento.
- source_word: δούλων
  choice: escravos
  rationale: Mantém a força concreta do grego, que apresenta os patriarcas como pertencentes a Deus; a alternativa tradicional e mais branda, “servos”, é registrada em nota.
- source_word: πιστῶν
  choice: fiéis
  rationale: Qualifica Abraão, Isaque e Jacó em sua relação com Deus e conserva a linguagem bíblica natural em português.
theological_decisions:
- issue: Tradução de δοῦλος em referência aos patriarcas
  choice: escravos
  alternative: servos
  rationale: “Escravos” preserva a relação de pertencimento expressa pelo termo grego, embora “servos” seja mais tradicional e fluente no registro religioso; a nota conserva essa alternativa sem enfraquecer silenciosamente o texto principal.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com construção optativa natural (“que Deus...”) e pronomes de terceira pessoa plural adequados tanto à leitura brasileira quanto ao português internacional. A conjunção inicial foi preservada por o versículo continuar a saudação do contexto anterior.
