  text: And when the sacrifice had been consumed[a], the priests and all the others offered prayer, with Jonathan leading and the rest responding, as in Nehemiah's time.
translation:
  language: pt
  text: E, enquanto o sacrifício era consumido, os sacerdotes e todos os demais fizeram uma oração, com Jônatas iniciando e os outros respondendo, como Neemias fazia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com Jônatas começando e os outros aclamando em resposta, como Neemias fez”. O grego é conciso no fim do versículo, e a relação exata da comparação com Neemias admite mais de uma interpretação.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσευχὴν ... ἐποιήσαντο
  choice: fizeram uma oração
  rationale: Reproduz de modo natural e digno a expressão grega literalmente equivalente a “fizeram uma oração”, sem acrescentar uma ideia ausente do texto.
- source_word: δαπανωμένης τῆς θυσίας
  choice: enquanto o sacrifício era consumido
  rationale: O particípio presente genitivo indica uma ação em curso simultânea à oração; “era consumido” preserva tanto o aspecto progressivo quanto o contexto sacrificial.
- source_word: οἱ ἱερεῖς καὶ πάντες
  choice: os sacerdotes e todos os demais
  rationale: Deixa claro que πάντες amplia o grupo para além dos sacerdotes, sem identificar mais precisamente quem eram os demais.
- source_word: καταρχομένου Ἰωνάθον
  choice: com Jônatas tomando a iniciativa
  rationale: κατάρχομαι pode indicar começar ou assumir a liderança; a formulação mantém o sentido de iniciar a oração sem impor uma forma litúrgica específica.
- source_word: τῶν τε λοιπῶν ἐπιφωνούντων
  choice: e os outros respondendo
  rationale: O verbo sugere que os demais pronunciavam algo em seguida ou em resposta, compatível com uma oração responsiva.
- source_word: ὡς Νεεμίου
  choice: como no tempo de Neemias
  rationale: Torna inteligível a comparação comprimida, entendendo-a como referência ao padrão associado ao tempo de Neemias, mas registra em nota a alternativa sintática.
theological_decisions:
- issue: Sentido da comparação ὡς Νεεμίου
  choice: como no tempo de Neemias
  alternative: como Neemias fez
  rationale: O grego é elíptico e permite relacionar a comparação ao período ou à atuação de Neemias. A tradução principal oferece uma leitura fluente, enquanto a nota preserva a ambiguidade genuína.
translation_notes:
  register: Português atual, solene e acessível, com legibilidade brasileira. “Jônatas” e “Neemias” seguem as formas bíblicas correntes. A ordem da frase deixa claro que tanto os sacerdotes quanto os demais participaram da oração.
