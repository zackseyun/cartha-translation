base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/020.yaml
  text: But after many years had passed, when it seemed good to God, Nehemiah, having been sent by the king of Persia, sent for the descendants of the priests who had hidden it, to get the fire.
translation:
  language: pt
  text: Mas, depois de muitos anos, quando pareceu bem a Deus, Neemias, enviado pelo rei da Pérsia, mandou os descendentes dos sacerdotes que o haviam escondido buscar o fogo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “mandou [...] para/sobre o fogo”. O grego é conciso; pelo contexto, Neemias enviou os descendentes dos sacerdotes para recuperar o fogo escondido.
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθόντων δὲ ἐτῶν ἱκανῶν
  choice: Mas, depois de muitos anos
  rationale: O genitivo absoluto estabelece a circunstância temporal; ἱκανῶν indica aqui um número considerável de anos. A formulação portuguesa é natural e preserva o valor da expressão.
- source_word: ὅτε ἔδοξεν τῷ θεῷ
  choice: quando isso pareceu bem a Deus
  rationale: Preserva o idioma grego de decisão ou aprovação divina sem o tornar mera aparência nem enfatizar indevidamente prazer emocional.
- source_word: ἀποσταλεὶς Νεεμίας ἀπὸ τοῦ βασιλέως τῆς Περσίδος
  choice: Neemias, enviado pelo rei da Pérsia
  rationale: O particípio aoristo passivo modifica Neemias e indica seu envio anterior; em português, a forma reduzida é clara e digna.
- source_word: τοὺς ἐκγόνους τῶν ἱερέων
  choice: os descendentes dos sacerdotes
  rationale: ἐκγόνους designa descendentes ou prole; “descendentes” evita restringir o sentido a filhos imediatos ou somente homens.
- source_word: τῶν ἀποκρυψάντων
  choice: que o haviam escondido
  rationale: O particípio se refere aos sacerdotes que esconderam o fogo. O pronome “o”, exigido pela clareza em português, retoma “o fogo” do contexto.
- source_word: ἔπεμψεν ἐπὶ τὸ πῦρ
  choice: mandou ... buscar o fogo
  rationale: A construção grega é concisa e admite valor de direção ou finalidade. No contexto, Neemias despacha os descendentes para recuperar o fogo escondido; a nota registra a concisão do original.
theological_decisions:
- issue: Vontade divina em ὅτε ἔδοξεν τῷ θεῷ
  choice: quando isso pareceu bem a Deus
  alternative: quando Deus julgou oportuno; quando agradou a Deus
  rationale: A escolha conserva a tensão idiomática entre parecer apropriado, decidir e aprovar, sem reduzir a frase a emoção divina nem enfraquecer a agência de Deus.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período mantém tom narrativo digno; “mandou ... buscar” comunica com clareza a construção grega comprimida, enquanto a nota preserva sua ambiguidade formal.
