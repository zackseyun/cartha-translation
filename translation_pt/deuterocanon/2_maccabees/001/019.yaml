base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/019.yaml
  text: For when our fathers were being led away into Persia[a], the devout priests took some of the fire from the altar and secretly hid it in the hollow of a dry well, where they secured it so that the place would be unknown to everyone.
translation:
  language: pt
  text: Pois, quando nossos antepassados estavam sendo levados para a Pérsia[a], os sacerdotes piedosos tomaram parte do fogo do altar e o esconderam secretamente na cavidade de um poço seco. Ali o mantiveram em segurança, de modo que o lugar ficasse desconhecido de todos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estavam sendo deportados para a Pérsia”. O verbo grego pode indicar que eram levados ou carregados para o exílio.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγοντο
  choice: estavam sendo levados
  rationale: O imperfeito passivo expressa uma ação em curso sofrida pelos antepassados no contexto do exílio. A formulação preserva o sentido de condução forçada sem tornar explícito mais do que o grego.
- source_word: Περσικὴν
  choice: a Pérsia
  rationale: O adjetivo substantivado designa a terra da Pérsia; o nome geográfico corrente é a forma mais natural em português.
- source_word: εὐσεβεῖς
  choice: piedosos
  rationale: Comunica devoção e fidelidade religiosa em registro digno e corrente, sem a possível ambiguidade de 'religiosos'.
- source_word: λαβόντες ἀπὸ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: tomaram parte do fogo do altar
  rationale: A construção indica que retiraram uma porção do fogo cuja fonte era o altar, sem sugerir que levaram todo o fogo.
- source_word: λαθραίως
  choice: secretamente
  rationale: Expressa diretamente o caráter oculto da ação.
- source_word: κοιλώματι φρέατος τάξιν ἔχοντος ἀνύδρου
  choice: na cavidade de um poço seco
  rationale: Reproduz de modo natural a imagem da cavidade de um poço em condição de estar sem água.
- source_word: κατησφαλίσαντο
  choice: o mantiveram em segurança
  rationale: O verbo indica que tornaram ou conservaram seguro aquilo que haviam escondido; a retomada pronominal refere-se naturalmente ao fogo.
- source_word: ὥστε πᾶσιν ἄγνωστον εἶναι τὸν τόπον
  choice: de modo que o lugar ficasse desconhecido de todos
  rationale: Mantém a construção de resultado ou propósito e a abrangência de πᾶσιν, sem reduzir a frase a uma simples declaração de que ninguém o conhecia.
theological_decisions:
- issue: Formulação histórico-exílica
  choice: estavam sendo levados para a Pérsia
  alternative: estavam sendo deportados para a Pérsia
  rationale: A opção escolhida conserva a voz passiva e o movimento para o exílio, mas não impõe o termo técnico 'deportados', que é plausível no contexto, porém mais específico que o verbo grego isoladamente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. 'Antepassados' evita a leitura exclusivamente masculina que 'pais' pode sugerir hoje, embora represente o uso ancestral de οἱ πατέρες. A divisão em duas frases reduz o peso sintático sem alterar a progressão do original.
