  yaml_path: translation/deuterocanon/2_maccabees/001/036.yaml
  text: And the men around Nehemiah called this Nephthar[a], which is translated “Purification”; but by most people it is called Nephi.
translation:
  language: pt
  text: Os que estavam com Neemias chamaram isso de Neftar[a], que se traduz por “Purificação”; mas a maioria das pessoas o chama de Nefti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os nomes gregos são Νεφθάρ (Neftar) e Νεφθί (Nefti).
    reason: Esclarece as duas formas distintas presentes no texto grego e sua transliteração em português.
lexical_decisions:
- source_word: προσηγόρευσαν
  choice: chamaram
  rationale: O verbo indica dar um nome ou uma designação; “chamaram” é natural em português e adequado ao contexto.
- source_word: οἱ περὶ τὸν Νεεμίαν
  choice: os que estavam com Neemias
  rationale: A expressão grega designa os associados ou companheiros de Neemias, sem exigir que se especifique apenas homens.
- source_word: τοῦτο
  choice: isso
  rationale: O demonstrativo retoma a substância mencionada anteriormente e preserva de modo conciso a referência contextual.
- source_word: Νεφθάρ
  choice: Neftar
  rationale: Transliteração adaptada à ortografia portuguesa do nome grego Νεφθάρ.
- source_word: διερμηνεύεται
  choice: se traduz por
  rationale: A forma explicita que o termo estrangeiro recebe uma tradução ou explicação equivalente.
- source_word: Καθαρισμός
  choice: Purificação
  rationale: O substantivo denota purificação ou limpeza e pode ter nuance ritual neste contexto; “Purificação” preserva a forma nominal.
- source_word: καλεῖται
  choice: o chama
  rationale: A construção portuguesa com objeto retomado por pronome expressa naturalmente a fórmula passiva grega “é chamado”.
- source_word: παρὰ τοῖς πολλοῖς
  choice: a maioria das pessoas
  rationale: A expressão indica o uso corrente entre a maioria, formulado de maneira clara e natural.
- source_word: Νεφθί
  choice: Nefti
  rationale: Transliteração portuguesa direta de Νεφθί, mantendo sua distinção em relação a Νεφθάρ.
