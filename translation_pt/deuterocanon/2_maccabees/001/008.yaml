base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/008.yaml
  text: And they set the gateway on fire and poured out innocent blood; but we prayed to the Lord and were heard. We offered sacrifice and fine flour[a], lit the lamps, and set out the loaves.
translation:
  language: pt
  text: E eles incendiaram o portal e derramaram sangue inocente. Então suplicamos ao Senhor, e ele nos ouviu. Oferecemos sacrifício e farinha fina, trouxemos as lâmpadas[a] e dispusemos os pães.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “levamos para fora as lâmpadas”. O verbo grego também pode ser entendido, neste contexto, como uma referência à preparação das lâmpadas para o serviço do templo, possivelmente incluindo o ato de acendê-las.
    reason: Preserva a alternativa lexical e a incerteza quanto à ação ritual específica.
lexical_decisions:
- source_word: ἐνέπυραν
  choice: incendiaram
  rationale: Expressa de modo natural e conciso a ação causativa de atear fogo, sem reduzir o verbo à ideia genérica de queimar.
- source_word: τὸν πυλῶνα
  choice: o portal
  rationale: πυλών designa uma entrada ou estrutura de acesso; “portal” preserva essa amplitude arquitetônica sem especificar indevidamente torre ou pórtico.
- source_word: ἐξέχεαν αἷμα ἀθῷον
  choice: derramaram sangue inocente
  rationale: Mantém a imagem vívida e tradicional do grego, em português natural.
- source_word: ἐδεήθημεν τοῦ κυρίου
  choice: suplicamos ao Senhor
  rationale: O verbo indica uma petição insistente; “suplicamos” comunica essa intensidade melhor que o termo mais geral “oramos”.
- source_word: εἰσηκούσθημεν
  choice: ele nos ouviu
  rationale: Transforma naturalmente a passiva grega em construção ativa portuguesa, sem acrescentar a noção mais específica de uma resposta verbal.
- source_word: προσηνέγκαμεν θυσίαν
  choice: oferecemos sacrifício
  rationale: Preserva a formulação cultual genérica do singular sem artigo.
- source_word: σεμίδαλιν
  choice: farinha fina
  rationale: Designa farinha de trigo fina usada em ofertas e corresponde à terminologia sacrificial clara em português.
- source_word: ἐξηγάγομεν τοὺς λύχνους
  choice: trouxemos as lâmpadas
  rationale: Conserva o sentido lexical direto de ἐξάγω, evitando converter silenciosamente a ação em “acender”; a possível função ritual é indicada em nota.
- source_word: προεθήκαμεν τοὺς ἄρτους
  choice: dispusemos os pães
  rationale: Comunica a colocação ordenada dos pães no serviço do santuário sem inserir um local ou destinatário não expresso no grego.
theological_decisions:
- issue: Tradução de κύριος
  choice: Senhor
  alternative: SENHOR; Soberano
  rationale: Neste contexto, κύριος se refere ao Deus de Israel. “Senhor” é a forma portuguesa corrente e não pressupõe que o texto grego reproduza diretamente o tetragrama.
- issue: Sentido de ἐξηγάγομεν na sequência cultual
  choice: trouxemos as lâmpadas
  alternative: acendemos as lâmpadas; preparamos as lâmpadas
  rationale: Embora o contexto seja o restabelecimento do culto no templo, o verbo grego significa literalmente levar ou trazer para fora. A tradução principal preserva esse dado e a ambiguidade da ação ritual, enquanto a nota informa a interpretação contextual possível.
- issue: Agente divino em εἰσηκούσθημεν
  choice: ele nos ouviu
  alternative: fomos ouvidos
  rationale: O referente natural é o Senhor da oração imediatamente anterior. A construção ativa é idiomática em português e mantém a afirmação de que Deus acolheu a súplica, sem expandi-la para “respondeu”.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A coordenação breve acompanha a sequência narrativa e ritual do grego. O marcador [a] foi colocado junto a “lâmpadas”, expressão à qual a nota efetivamente se refere.
