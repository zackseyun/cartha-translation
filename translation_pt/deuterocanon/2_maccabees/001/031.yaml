  yaml_path: translation/deuterocanon/2_maccabees/001/031.yaml
  text: And when the things of the sacrifice had been consumed[a], Nehemiah ordered the remaining water to be poured on larger stones.
translation:
  language: pt
  text: Quando tudo o que pertencia ao sacrifício foi consumido[a], Neemias mandou derramar a água que restava sobre pedras maiores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais explícito, “os materiais do sacrifício”. A expressão grega é mais abrangente do que simplesmente “o sacrifício”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνηλώθη
  choice: foi consumido
  rationale: O aoristo passivo indica que os elementos usados no sacrifício foram consumidos. A formulação preserva o resultado sem especificar além do texto se foram queimados ou gastos de outra maneira.
- source_word: τὰ τῆς θυσίας
  choice: tudo o que pertencia ao sacrifício
  rationale: O neutro plural substantivado com genitivo abrange os elementos ou materiais ligados ao sacrifício, e não apenas o sacrifício entendido como ato. Esta formulação é natural em português e mantém essa amplitude.
- source_word: τὸ περιλειπόμενον ὕδωρ
  choice: a água que restava
  rationale: Expressa de modo corrente o particípio que designa a água deixada após a ação anterior.
- source_word: ἐκέλευσεν
  choice: mandou
  rationale: O verbo indica uma instrução dada com autoridade; “mandou” é direto e natural no registro narrativo.
- source_word: λίθους μείζονας
  choice: pedras maiores
  rationale: Mantém o valor comparativo de μείζονας e se refere claramente ao tamanho das pedras.
- source_word: καταχεῖν
  choice: derramar ... sobre
  rationale: O infinitivo significa derramar para baixo ou sobre algo. A construção com “mandou” é idiomática em português.
