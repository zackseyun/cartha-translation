lexical_decisions:
- source_word: αὐτὸς
  choice: ele mesmo
  rationale: Preserva a ênfase do pronome intensivo na ação direta do sujeito.
- source_word: γὰρ
  choice: pois
  rationale: Expressa de modo natural o valor explicativo da conjunção em relação ao contexto anterior.
- source_word: ἐξέβρασεν
  choice: expulsou
  rationale: Comunica a remoção enérgica e decisiva indicada pelo verbo grego, sem ampliar o sentido.
- source_word: τοὺς παρατασσομένους
  choice: os que estavam em formação de batalha
  rationale: Mantém o sentido militar do particípio, referente a pessoas dispostas em ordem para combater.
- source_word: ἐν τῇ ἁγίᾳ πόλει
  choice: na cidade santa
  rationale: Reproduz diretamente tanto a localização quanto a designação sacra da cidade.
- source_word: εἰς τὴν Περσίδα
  choice: para a Pérsia
  rationale: Expressa o movimento em direção à Pérsia sem afirmar mais do que a preposição grega exige.
theological_decisions:
- issue: Ênfase na agência da ação de expulsar
  choice: ele mesmo
  alternative: ele
  rationale: A formulação conserva a ênfase do texto na atuação pessoal do sujeito, sem identificá-lo ou interpretá-lo além do contexto imediato.
