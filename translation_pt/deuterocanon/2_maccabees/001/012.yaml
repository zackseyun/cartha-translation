  text: Pois ele mesmo expulsou para a Pérsia os que estavam dispostos em ordem de batalha na cidade santa.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pôs para fora”, “afugentou” ou “expulsou violentamente”; o verbo grego retrata uma remoção vigorosa e decisiva.
