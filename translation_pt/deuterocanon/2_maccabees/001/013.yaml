  yaml_path: translation/deuterocanon/2_maccabees/001/013.yaml
  text: For when the leader and the force around him that seemed to be invincible had entered[a], they were cut down in the temple of Nanaia[b], because the priests of Nanaia had used deceit.
translation:
  language: pt
  text: Pois, quando o comandante entrou[a], ele e a força que o acompanhava, tida como invencível, foram mortos a golpes no templo de Nanaia, pois os sacerdotes de Nanaia recorreram ao engano[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «quando chegou». O grego é incomum e pode exprimir de modo geral a chegada ou presença do comandante; a entrada no templo é inferida do contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «por meio de um ardil». A construção grega também permite entender o engano como o meio pelo qual os sacerdotes provocaram a morte deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος
  choice: quando ... entraram
  rationale: O particípio é incomum se vertido literalmente como «tendo-se tornado». No contexto, introduz a chegada ou entrada do comandante e de sua força no templo; «entraram» explicita com naturalidade o movimento pressuposto pela narrativa.
- source_word: ὁ ἡγεμών
  choice: o comandante
  rationale: Ἡγεμών pode indicar líder, governante ou comandante. Aqui designa o chefe de uma força militar; «comandante» comunica essa função sem pressupor o cargo administrativo específico de governador.
- source_word: ἡ περὶ αὐτὸν ... δύναμις
  choice: a força que o acompanhava
  rationale: Em contexto militar, δύναμις designa uma força ou tropa, e περὶ αὐτόν se refere aos que estavam com ele. A formulação é idiomática e não determina indevidamente o tamanho do contingente.
- source_word: ἀνυπόστατος δοκοῦσα εἶναι
  choice: tida como invencível
  rationale: A expressão descreve a força como aparentemente impossível de enfrentar ou resistir. «Tida como» preserva o caráter de aparência expresso por δοκοῦσα, enquanto «invencível» é claro e natural.
- source_word: κατεκόπησαν
  choice: foram mortos a golpes
  rationale: O passivo de κατακόπτω indica abater ou matar mediante golpes, possivelmente cortantes. A tradução conserva a violência do verbo sem acrescentar pormenores não especificados.
- source_word: ἐν τῷ τῆς Ναναίας ἱερῷ
  choice: no templo de Nanaia
  rationale: Ἱερόν designa aqui o recinto ou templo da divindade. O nome Nanaia é transliterado.
- source_word: παραλογισμῷ χρησαμένων
  choice: recorreram ao engano
  rationale: O genitivo absoluto indica o meio ou a circunstância causal do massacre. Παραλογισμός denota engano, fraude ou ardil, e χράομαι, o emprego desse recurso.
- source_word: τῶν περὶ τὴν Ναναίαν ἱερέων
  choice: os sacerdotes de Nanaia
  rationale: A expressão designa naturalmente os sacerdotes ligados ao culto ou serviço de Nanaia. «Sacerdotes de Nanaia» é claro em português e evita um espacialismo artificial.
