  yaml_path: translation/deuterocanon/2_maccabees/001/021.yaml
  text: When they reported to us that they had found no fire[a], but thick water, he ordered them to draw some out and bring it. Then, when the things for the sacrifices had been brought forward[b], Nehemiah ordered the priests to sprinkle the water on both the wood and what was laid on it.
translation:
  language: pt
  text: Quando nos informaram que não tinham encontrado fogo[a], mas uma água espessa, ele mandou que tirassem um pouco e a trouxessem. Depois, quando os materiais para os sacrifícios foram trazidos[b], Neemias mandou os sacerdotes aspergir a água sobre a lenha e sobre o que estava colocado em cima dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “água densa” ou “líquido espesso”. A expressão grega é incomum e foi mantida de modo relativamente literal porque a natureza inesperada da substância é importante para a narrativa.
    reason: lexical_alternative
  - marker: b
    text: O grego diz literalmente “as coisas dos sacrifícios”, expressão elíptica que se refere aos materiais ou itens relacionados com os sacrifícios.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεσάφησαν
  choice: nos informaram
  rationale: Expressa a comunicação clara do que foi encontrado; em português narrativo, “informaram” transmite o sentido sem tornar a frase pesada.
- source_word: μὴ εὑρηκέναι πῦρ ἀλλὰ ὕδωρ παχύ
  choice: não tinham encontrado fogo, mas uma água espessa
  rationale: Mantém o contraste explícito e conserva a descrição incomum de ὕδωρ παχύ, importante para o desenvolvimento da narrativa.
- source_word: ἀποβλίψαντας
  choice: que tirassem um pouco
  rationale: Indica retirar parte do líquido do local onde estava, sem especificar um instrumento ou método que o grego não explicita.
- source_word: ἀνηνέχθη τὰ τῶν θυσιῶν
  choice: os materiais para os sacrifícios foram trazidos
  rationale: Torna compreensível a expressão grega elíptica, preservando sua abrangência sem reduzi-la apenas às ofertas.
- source_word: ἐπιρᾶναι
  choice: aspergir
  rationale: No contexto ritual, comunica a aplicação do líquido sobre a lenha e a oferta; preserva a possibilidade de uma ação de derramar ou borrifar sem introduzir detalhes adicionais.
- source_word: τά τε ξύλα καὶ τὰ ἐπικείμενα
  choice: sobre a lenha e sobre o que estava colocado em cima dela
  rationale: Conserva a generalidade do grego quanto ao que estava sobre a lenha e evita identificar explicitamente os elementos como porções da oferta.
theological_decisions:
- issue: Identificação de Νεεμίας
  choice: Neemias
  alternative: Neemias/Nehemias como mera transliteração formal
  rationale: “Neemias” é a forma portuguesa tradicional e amplamente reconhecida do nome, sem implicar uma identificação doutrinária além do que o texto declara.
translation_notes:
  register: Português atual, digno e acessível, com leitura natural no Brasil e compreensão internacional. A sintaxe narrativa foi suavizada sem eliminar a estranheza deliberada de “água espessa” nem a generalidade de “o que estava colocado”.
