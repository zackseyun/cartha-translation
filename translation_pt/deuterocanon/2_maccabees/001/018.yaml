base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/018.yaml
  text: Since we are about to celebrate the purification of the temple on the twenty-fifth of Chasleu[a], we thought it necessary to make this clear to you also, so that you too may celebrate the festival of booths and of the fire, when Nehemiah, after building both the temple and the altar, offered sacrifices.
translation:
  language: pt
  text: Como estamos prestes a celebrar, no dia vinte e cinco de Casleu, a purificação do templo, julgamos necessário explicar isso também a vocês, para que vocês igualmente celebrem a Festa das Tendas e a do fogo[a], quando Neemias, depois de construir tanto o templo como o altar, ofereceu sacrifícios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais interpretativo, “e a festa do fogo”. O grego diz apenas “e a do fogo”, provavelmente em alusão ao relato comemorativo que vem a seguir.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μέλλοντες ἄγειν
  choice: Como estamos prestes a celebrar
  rationale: A construção com μέλλω e infinitivo expressa intenção iminente; em contexto festivo, ἄγειν significa celebrar ou observar.
- source_word: ἐν τῷ Χασελεὺ πέμπτῃ καὶ εἰκάδι
  choice: no dia vinte e cinco de Casleu
  rationale: Expressa naturalmente em português o dia e o mês, transliterando a forma grega Χασελεύ como Casleu.
- source_word: τὸν καθαρισμὸν τοῦ ἱεροῦ
  choice: a purificação do templo
  rationale: καθαρισμός designa purificação, e ἱερόν se refere aqui ao templo ou recinto sagrado; evita-se introduzir 'dedicação', termo não empregado no grego.
- source_word: δέον ἡγησάμεθα διασαφῆσαι ὑμῖν
  choice: julgamos necessário explicar isso também a vocês
  rationale: Preserva tanto o juízo deliberado de ἡγησάμεθα quanto a necessidade indicada por δέον; διασαφῆσαι significa explicar ou tornar claro.
- source_word: ἵνα καὶ αὐτοὶ ἄγητε
  choice: para que vocês igualmente celebrem
  rationale: ἄγητε tem sentido festivo de celebrar, e καὶ αὐτοί indica que os destinatários também devem participar da observância.
- source_word: σκηνοπηγίας
  choice: a Festa das Tendas
  rationale: Designa a festa ligada à habitação em tendas; a forma é clara, corrente e conserva a imagem do termo grego.
- source_word: καὶ τοῦ πυρός
  choice: e a do fogo
  rationale: Conserva a formulação grega elíptica e alusiva, sem decidir indevidamente se se trata do nome formal de outra festa.
- source_word: ὅτε Νεεμίας
  choice: quando Neemias
  rationale: ὅτε introduz a ocasião histórica rememorada.
- source_word: ὁ οἰκοδομήσας τό τε ἱερὸν καὶ τὸ θυσιαστήριον
  choice: depois de construir tanto o templo como o altar
  rationale: O particípio aoristo é entendido como ação anterior à oferta dos sacrifícios; τε...καί correlaciona os dois objetos.
- source_word: ἀνήνεγκεν θυσίας
  choice: ofereceu sacrifícios
  rationale: Em contexto cultual, ἀναφέρω significa oferecer sacrifícios.
theological_decisions:
- issue: Sentido de σκηνοπηγίας
  choice: a Festa das Tendas
  alternative: a Festa dos Tabernáculos
  rationale: A opção escolhida torna a imagem judaica compreensível em português atual sem depender de terminologia eclesiástica tradicional.
- issue: Função de καὶ τοῦ πυρός
  choice: e a do fogo
  alternative: e a festa do fogo
  rationale: O grego é elíptico e pode aludir à comemoração narrada a seguir. O texto principal preserva essa ambiguidade, enquanto a nota registra a explicitação possível.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa e mantém a elipse incomum relativa ao fogo para preservar a ambiguidade do original.
