  yaml_path: translation/deuterocanon/2_maccabees/001/032.yaml
  text: And when this happened[a], a flame was kindled; and when the light from the altar shone forth[b], it was consumed.
translation:
  language: pt
  text: Quando isso aconteceu, uma chama se acendeu; e, quando a luz que vinha do altar resplandeceu[a], a chama se consumiu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “rebrilhou” ou “reluziu em resposta”. O verbo grego pode descrever uma luz que brilha ou lampeja em resposta.'
    reason: lexical_alternative
  - marker: b
    text: O grego diz apenas “foi consumido”, sem identificar o sujeito. Aqui se entende que a chama se consumiu; também pode se referir ao combustível ou à oferta ou, à luz do contexto mais amplo, ao líquido derramado.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  choice: Quando isso aconteceu
  rationale: ὡς com o aoristo introduz aqui uma oração temporal. A formulação expressa a sequência narrativa sem acrescentar uma ideia de imediatismo que o grego não exige.
- source_word: φλὸξ ἀνήφθη
  choice: uma chama se acendeu
  rationale: φλόξ designa uma chama, e o aoristo passivo ἀνήφθη indica que ela foi acesa ou se acendeu. A construção pronominal é natural em português e mantém o caráter passivo do acontecimento sem indicar um agente.
- source_word: ἀπὸ τοῦ θυσιαστηρίου
  choice: que vinha do altar
  rationale: A expressão identifica a origem da luz. “Altar” traduz θυσιαστήριον de modo claro e corrente.
- source_word: ἀντιλάμψαντος φωτός
  choice: a luz ... resplandeceu
  rationale: O genitivo absoluto apresenta uma circunstância concomitante. ἀντιλάμπω pode indicar brilhar, reluzir ou emitir um clarão em resposta; “resplandeceu” é natural e preserva a intensidade sem impor uma direção específica. A nuance responsiva é registrada em nota.
- source_word: ἐδαπανήθη
  choice: a chama se consumiu
  rationale: O passivo de δαπανάω significa ser consumido ou gasto. A chama é o antecedente explícito mais próximo na sequência principal, mas o grego não nomeia o sujeito desta forma verbal; por isso, outras possibilidades contextuais são mantidas em nota.
theological_decisions:
- issue: Referente implícito de ἐδαπανήθη (“foi consumido”)
  choice: A chama se consumiu.
  alternative: O combustível ou a oferta foi consumido; ou o líquido derramado foi consumido ou evaporou.
  rationale: O texto grego não declara o sujeito de ἐδαπανήθη. A chama é o antecedente mais natural na linha narrativa principal, mas as demais leituras não devem ser excluídas silenciosamente; a ambiguidade textual é explicitada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação e o ritmo preservam a sequência concisa do grego. As notas mantêm tanto a nuance lexical de ἀντιλάμπω quanto a ambiguidade sintática do sujeito de ἐδαπανήθη.
