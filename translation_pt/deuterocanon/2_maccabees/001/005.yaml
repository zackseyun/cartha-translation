  text: and may he hear your prayers[a], and be reconciled to you[c][b], and not abandon you in an evil time.
translation:
  language: pt
  text: e ouça as súplicas de vocês[a], reconcilie-se com vocês[b] e não os abandone num tempo mau[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “atenda às orações de vocês”.
    reason: lexical_alternative
  - marker: b
    text: Ou “torne a ser favorável a vocês” ou “deixe-se aplacar em relação a vocês”.
    reason: alternative_reading
  - marker: c
    text: Ou “num tempo de aflição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακούσαι
  choice: ouça
  rationale: No contexto de oração, o verbo indica ouvir com atenção ou acolher favoravelmente. “Ouça” é natural em português e não explicita além do grego que a oração será atendida.
- source_word: τῶν δεήσεων
  choice: as súplicas
  rationale: δέησις designa um pedido insistente ou uma súplica. “Súplicas” preserva essa força específica melhor que o termo mais amplo “orações”.
- source_word: καταλλαγείη
  choice: reconcilie-se
  rationale: O optativo expressa o desejo de restauração da relação ou do favor. A forma reflexiva é natural em português e mantém a tensão relacional sem especificar o meio da reconciliação.
- source_word: ἐγκαταλίποι
  choice: abandone
  rationale: “Abandonar” comunica de modo claro e atual o sentido de deixar desamparado, sem o tom arcaizante de alternativas como “desamparar” em certos registros.
- source_word: ἐν καιρῷ πονηρῷ
  choice: num tempo mau
  rationale: A expressão mantém tanto a ideia de uma ocasião ou período adverso quanto a caracterização explícita de πονηρός como “mau”, sem reduzi-la apenas a dificuldade ou aflição.
theological_decisions:
- issue: Se καταλλαγείη deve indicar apaziguamento emocional ou restauração da relação e do favor de Deus
  choice: reconcilie-se com vocês
  alternative: torne a ser favorável a vocês; deixe-se aplacar em relação a vocês
  rationale: “Reconcilie-se” conserva o aspecto relacional do grego e a possibilidade de favor restaurado, sem definir a causa, o mecanismo ou a natureza emocional dessa mudança.
translation_notes:
  register: Português moderno, digno e acessível, com emprego de “vocês” para o plural. A sequência de formas verbais mantém o caráter de desejo ou oração do optativo grego, entendido no contexto da bênção iniciada nos versículos anteriores. Os marcadores foram posicionados junto às expressões a que suas notas efetivamente se referem.
