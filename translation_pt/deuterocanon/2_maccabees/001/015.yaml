  text: And when the priests of Nanea had set these things out[a], and he had come with a few men into the enclosure of the temple precinct, they shut the temple as soon as Antiochus entered.
translation:
  language: pt
  text: Quando os sacerdotes de Naneia[a] expuseram essas coisas e Antíoco entrou, com alguns homens, no recinto da área sagrada, fecharam o templo assim que ele entrou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome grego Ναναίου também pode ser transliterado como «Nanaia».
    reason: lexical_alternative
lexical_decisions:
- source_word: προθεμένων
  choice: expuseram
  rationale: O particípio aoristo de προτίθημι indica que os objetos foram postos diante de alguém ou apresentados; «expuseram» comunica a ação concreta sem especificar indevidamente quais eram os objetos.
- source_word: αὐτά
  choice: essas coisas
  rationale: O pronome não traz um substantivo expresso neste versículo; «essas coisas» mantém a referência aberta ao contexto.
- source_word: τῶν ἱερέων τοῦ Ναναίου
  choice: os sacerdotes de Naneia
  rationale: A construção genitiva é entendida naturalmente como referência aos sacerdotes ligados à divindade Naneia; a forma portuguesa segue uma transliteração corrente e próxima do grego.
- source_word: προσελθόντος
  choice: chegou
  rationale: No encadeamento narrativo, o particípio descreve a chegada do homem depois identificado como Antíoco ao recinto, sem sugerir que tenha apenas se aproximado.
- source_word: μετʼ ὀλίγων
  choice: com alguns homens
  rationale: O grego diz literalmente «com poucos»; «homens» é uma complementação contextual natural, e «alguns» evita uma formulação rígida, embora preserve a ideia de um grupo pequeno.
- source_word: περίβολον
  choice: recinto
  rationale: περίβολος designa uma área delimitada ou cercada; «recinto» é preciso e não a identifica necessariamente como pátio.
- source_word: τοῦ τεμένους
  choice: da área sagrada
  rationale: τέμενος é uma área separada para uso sagrado. «Área sagrada» preserva sua dimensão espacial e a distingue de ἱερόν, traduzido como «templo».
- source_word: συγκλείσαντες τὸ ἱερόν
  choice: fecharam o templo
  rationale: A expressão descreve o fechamento do ἱερόν para prender Antíoco; «fecharam o templo» é claro e idiomático.
- source_word: ὡς εἰσῆλθεν
  choice: assim que ... entrou
  rationale: ὡς com o aoristo tem valor temporal e, no contexto, indica a ação imediata dos sacerdotes.
- source_word: Ἀντίοχος
  choice: Antíoco
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
