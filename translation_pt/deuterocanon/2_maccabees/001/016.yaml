  yaml_path: translation/deuterocanon/2_maccabees/001/016.yaml
  text: After opening the hidden door of the smoke chamber[a], they threw stones and struck down the leader, and after cutting him into pieces[b], they threw the heads to those outside.
translation:
  language: pt
  text: Depois de abrirem a porta oculta da câmara de fumaça[a], atiraram pedras e fulminaram o líder[b]; depois de o esquartejarem, lançaram as cabeças aos que estavam do lado de fora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da sala da fornalha” ou “do lugar de fumaça/incenso”. O termo grego é raro, e seu referente exato é incerto.
    reason: lexical_alternative
  - marker: b
    text: O verbo grego evoca um raio ou relâmpago; pode indicar que o abateram violentamente, sem necessariamente dizer que um raio literal caiu do céu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοίξαντες
  choice: Depois de abrirem
  rationale: O particípio aoristo indica uma ação anterior às ações principais; a formulação preserva a sequência com naturalidade em português.
- source_word: τὴν ... κρυπτὴν θύραν
  choice: a porta oculta
  rationale: κρυπτήν descreve algo escondido ou encoberto; “oculta” é claro e digno em português atual.
- source_word: τοῦ φατινώματος
  choice: da câmara de fumaça
  rationale: O substantivo é raro e seu referente exato é incerto. A tradução mantém a associação com fumaça sem impor uma identificação técnica ou cultual específica.
- source_word: βάλλοντες πέτρους
  choice: atiraram pedras
  rationale: Expressão direta e idiomática que representa claramente a ação violenta do particípio grego.
- source_word: συνεκεραύνωσαν
  choice: fulminaram
  rationale: O verbo deriva da linguagem de raio ou relâmpago. “Fulminaram” conserva essa imagem vívida e pode denotar um golpe violento e fatal sem afirmar necessariamente a queda literal de um raio.
- source_word: τὸν ἡγεμόνα
  choice: o líder
  rationale: ἡγεμών pode designar líder, governante ou comandante. “Líder” evita especificar um cargo que o texto grego não define aqui.
- source_word: μέλη ποιήσαντες
  choice: depois de o esquartejarem
  rationale: A expressão idiomática descreve a divisão do corpo em membros ou pedaços. “Esquartejarem” transmite o sentido de modo conciso e claro.
- source_word: καὶ τὰς κεφαλὰς
  choice: as cabeças
  rationale: Mantém-se o plural incomum do texto grego, sem corrigi-lo silenciosamente para o singular.
- source_word: τοῖς ἔξω παρρίψαντες
  choice: lançaram ... aos que estavam do lado de fora
  rationale: O dativo é entendido naturalmente como referência a pessoas que estavam fora; “lançaram” reproduz o ato de arremessar.
theological_decisions:
- issue: Se συνεκεραύνωσαν descreve um raio divino literal ou emprega uma imagem vívida de violência
  choice: “fulminaram”, com nota que preserva a imagem e a ambiguidade
  alternative: “atingiram com um raio” ou “abateram”
  rationale: Os agentes imediatos são pessoas que atiram pedras. A tradução conserva a força ligada ao raio sem transformar a frase em afirmação inequívoca de intervenção milagrosa nem apagar totalmente sua imagem.
- issue: O plural τὰς κεφαλὰς após a referência a um único líder
  choice: Manter “as cabeças”
  alternative: Regularizar para “a cabeça”
  rationale: Embora o plural seja difícil no contexto, ele pertence ao texto grego atestado. Preservá-lo evita resolver uma tensão textual por conjectura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura mantém a sequência rápida e violenta do grego. As notas registram as duas principais dificuldades lexicais sem sobrecarregar o texto, e o plural inesperado “as cabeças” é preservado.
