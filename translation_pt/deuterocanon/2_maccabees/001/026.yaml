  text: Accept the sacrifice for all your people Israel[a], and preserve your portion and sanctify it.
translation:
  language: pt
  text: Aceita o sacrifício em favor de todo o teu povo, Israel, e guarda a tua porção[a] e santifica-a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “a tua porção” provavelmente se refere a Israel como a parte que pertence a Deus, embora também possa ser entendida de modo mais amplo, por exemplo, como a terra ou o santuário.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόσδεξαι
  choice: Aceita
  rationale: O imperativo, em linguagem de oração, pede que Deus acolha favoravelmente o sacrifício; “aceita” é natural e mantém a força da súplica.
- source_word: τὴν θυσίαν
  choice: o sacrifício
  rationale: θυσία tem aqui sentido cultual concreto, mais bem expresso por “sacrifício” do que pelo termo mais amplo “oferta”.
- source_word: ὑπὲρ παντὸς τοῦ λαοῦ σου Ἰσραήλ
  choice: em favor de todo o teu povo, Israel
  rationale: ὑπέρ indica benefício ou representação. “Em favor de” explicita essa relação sem acrescentar interpretação, e a vírgula apresenta “Israel” como identificação do povo.
- source_word: διαφύλαξον
  choice: guarda
  rationale: O verbo pede que Deus mantenha seguro e preserve; “guarda” é direto, digno e corrente na linguagem de oração.
- source_word: τὴν μερίδα σου
  choice: a tua porção
  rationale: A tradução conserva a metáfora de μερίς como porção ou parte pertencente a Deus, sem a tornar explicitamente “herança” ou “povo”.
- source_word: καθαγίασον
  choice: santifica-a
  rationale: O verbo significa tornar santa ou consagrar. “Santifica-a” corresponde formalmente ao grego e o pronome retoma a expressão singular feminina “a tua porção”.
theological_decisions:
- issue: Referente de “a tua porção”
  choice: Manter a expressão metafórica sem identificar explicitamente o referente no texto.
  alternative: Traduzir interpretativamente como “o teu povo”, “a tua herança”, “a terra” ou “o santuário”.
  rationale: O contexto imediato favorece Israel, o povo de Deus, mas o grego não nomeia de novo o referente e pode evocar também a terra ou o santuário. A formulação preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se o paralelismo da oração e a metáfora bíblica de “porção”; “santifica-a” preserva o registro cultual sem explicar em excesso.
