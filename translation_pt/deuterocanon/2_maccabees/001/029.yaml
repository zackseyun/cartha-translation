  text: Plant your people in your holy place[a], just as Moses said.
translation:
  language: pt
  text: Planta o teu povo no teu lugar santo[a], assim como Moisés disse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estabelece o teu povo no teu lugar santo”. O verbo grego significa literalmente “plantar” e retrata um estabelecimento seguro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταφύτευσον
  choice: Planta
  rationale: Imperativo aoristo de καταφυτεύω, literalmente “plantar” ou “plantar firmemente”. A tradução conserva a metáfora agrícola de estabelecimento seguro, em vez de substituí-la no texto principal por um termo abstrato.
- source_word: τὸν λαόν σου
  choice: o teu povo
  rationale: λαός designa o povo como corpo coletivo, especialmente em contexto comunitário e de aliança; “o teu povo” é natural e preciso em português.
- source_word: εἰς τὸν τόπον τὸν ἅγιόν σου
  choice: no teu lugar santo
  rationale: Embora εἰς possa indicar movimento para dentro, com o verbo de plantar a expressão comunica estabelecimento no lugar. “No teu lugar santo” é idiomático e mantém τόπος como “lugar”, sem especificar terra, templo ou santuário.
- source_word: καθὼς εἶπεν Μωσῆς
  choice: assim como Moisés disse
  rationale: καθώς expressa conformidade ou comparação, e εἶπεν é o aoristo simples de “dizer”. A formulação é clara e preserva a referência ao que Moisés disse.
theological_decisions:
- issue: Referente de “teu lugar santo”
  choice: Mantido como “teu lugar santo”, sem especificação adicional.
  alternative: “tua terra santa” ou “teu santuário”
  rationale: O grego emprega τόπος, “lugar”, sem identificar explicitamente terra, templo ou santuário. A tradução preserva essa amplitude e não resolve uma ambiguidade que o texto mantém.
translation_notes:
  register: Português moderno, claro e digno, com construção amplamente compreensível e boa legibilidade brasileira. A metáfora concreta “planta” foi mantida; o pronome “teu” acompanha o tom direto da oração sem arcaísmo excessivo.
