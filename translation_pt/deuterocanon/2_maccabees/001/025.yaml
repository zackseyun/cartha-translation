  text: the only provider[a], the only righteous one, almighty and eternal, the one who rescues Israel from every evil, who made the fathers chosen and sanctified them[c][b];
translation:
  language: pt
  text: o único provedor[a], o único justo, todo-poderoso e eterno, aquele que livra Israel de todo mal, que tornou escolhidos os pais[b] e os santificou[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “benfeitor” ou “fornecedor”. O termo grego ressalta Deus como aquele que supre o necessário.
    reason: lexical_alternative
  - marker: b
    text: 'Isto é, os antepassados ou patriarcas de Israel. Outra tradução possível: “tornou eleitos os pais”.'
    reason: lexical_and_referential_clarification
  - marker: c
    text: Ou “os tornou santos” ou “os consagrou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνος
  choice: único
  rationale: A repetição atributiva destaca a exclusividade de Deus; “único” é natural e preserva essa ênfase.
- source_word: χορηγός
  choice: provedor
  rationale: Designa aquele que fornece o necessário; “provedor” conserva essa ideia em linguagem atual e digna.
- source_word: δίκαιος
  choice: justo
  rationale: O adjetivo funciona como título substantivado de Deus; em português, “o único justo” expressa isso com naturalidade.
- source_word: παντοκράτωρ
  choice: todo-poderoso
  rationale: Equivalente bíblico reconhecível que comunica poder universal sem acrescentar uma interpretação específica de soberania.
- source_word: αἰώνιος
  choice: eterno
  rationale: É a tradução idiomática e adequada ao contexto de louvor para a existência sem fim de Deus.
- source_word: διασώζων
  choice: livra
  rationale: O particípio indica ação contínua de salvar de perigo; “livra” combina naturalmente com “de todo mal” e preserva a amplitude do termo.
- source_word: ἐκ παντὸς κακοῦ
  choice: de todo mal
  rationale: Mantém a amplitude de κακόν, que pode abranger maldade, dano e calamidade.
- source_word: ποιήσας
  choice: tornou
  rationale: Na construção com predicativo do objeto, “tornou escolhidos” comunica de modo mais natural em português a força causativa de ποιέω.
- source_word: ἐκλεκτούς
  choice: escolhidos
  rationale: Expressa seleção divina de maneira clara, sem a possível carga doutrinária posterior de “eleitos”.
- source_word: τοὺς πατέρας
  choice: os pais
  rationale: Preserva a formulação bíblica e a ausência de possessivo no grego; uma nota esclarece o sentido de antepassados de Israel.
- source_word: ἡγίασας
  choice: santificou
  rationale: Conserva o registro teológico e cultual do verbo, incluindo a ideia de tornar santo ou separar para Deus.
theological_decisions:
- issue: Identidade dos τοὺς πατέρας
  choice: os pais
  alternative: os antepassados; nossos pais
  rationale: A expressão aponta para os patriarcas ou antepassados de Israel. Como o grego não traz possessivo, não se acrescenta “nossos”; a nota evita que “pais” seja entendido apenas no sentido biológico imediato.
- issue: Sentido de ἡγίασας
  choice: os santificou
  alternative: os tornou santos; os consagrou
  rationale: “Santificou” preserva tanto a linguagem elevada da oração quanto a possível abrangência entre tornar santo e separar para Deus, sem reduzir o sentido a apenas uma dessas nuances.
- issue: Força de ποιήσας ... ἐκλεκτούς
  choice: tornou escolhidos
  alternative: escolheu; constituiu como escolhidos
  rationale: A construção causativa é mantida, em vez de ser simplificada para o verbo “escolher”, preservando uma peculiaridade e possível tensão do texto grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A estrutura participial e a sequência solene de títulos foram preservadas, evitando arcaísmos. Todos os marcadores de nota aparecem no texto principal.
