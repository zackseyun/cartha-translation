base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/027.yaml
  text: Gather our dispersed people[a], free those enslaved among the nations, look upon those who are despised and abhorred; and let the nations know that you are our God.
translation:
  language: pt
  text: Reúne o nosso povo disperso[a], liberta os que vivem escravizados entre as nações, olha para os desprezados e detestados; e saibam as nações que tu és o nosso Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “a nossa dispersão”. A tradução explicita que a oração se refere à comunidade espalhada.
    reason: alternativa lexical
lexical_decisions:
- source_word: ἐπισυνάγαγε
  choice: Reúne
  rationale: O imperativo pede que Deus ajunte e reunifique os dispersos. “Reúne” comunica naturalmente tanto a ação de juntar quanto a ideia de recomposição da comunidade.
- source_word: τὴν διασπορὰν ἡμῶν
  choice: o nosso povo disperso
  rationale: A expressão significa literalmente “a nossa dispersão”, mas, por metonímia, refere-se à comunidade espalhada. A tradução explicita o referente pessoal sem perder a imagem da dispersão.
- source_word: ἐλευθέρωσον
  choice: liberta
  rationale: O verbo indica pôr em liberdade. “Liberta” é direto, vigoroso e mais específico do que uma formulação geral como “livra”.
- source_word: τοὺς δουλεύοντας
  choice: os que vivem escravizados
  rationale: δουλεύω denota servir em condição de escravidão. A formulação preserva a força dessa sujeição e evita suavizá-la como mero serviço, sem necessariamente afirmar a forma jurídica precisa da opressão.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: entre as nações
  rationale: ἔθνη designa aqui os povos ou nações em cujo meio vivem os dispersos. “Nações” evita a carga interpretativa adicional de “gentios”.
- source_word: τοὺς ἐξουθενημένους
  choice: os desprezados
  rationale: O particípio passivo descreve pessoas tratadas como insignificantes ou com desprezo. “Desprezados” conserva de modo claro esse sentido social e passivo.
- source_word: βδελυκτοὺς
  choice: detestados
  rationale: O adjetivo exprime forte repulsa. “Detestados” mantém essa intensidade e, no contexto, evita sugerir que essas pessoas sejam intrinsecamente impuras ou abomináveis.
- source_word: ἔφιδε
  choice: olha para
  rationale: O imperativo significa olhar para ou atentar para alguém. Em linguagem de oração, “olha para” é natural e fiel, sem acrescentar explicitamente a ideia de favorecer.
- source_word: γνώτωσαν
  choice: saibam
  rationale: 'O imperativo de terceira pessoa tem força de petição: que as nações venham a saber ou reconhecer. “E saibam as nações” preserva essa forma direta.'
- source_word: ὅτι σὺ ὁ θεὸς ἡμῶν
  choice: que tu és o nosso Deus
  rationale: A tradução reproduz a predicação direta e conserva o pronome explícito σύ por meio de “tu”, adequado à oração e à ênfase contextual.
theological_decisions:
- issue: Referente de “a nossa dispersão”
  choice: 'Traduzir como a própria comunidade dispersa: “o nosso povo disperso”.'
  alternative: “a nossa dispersão” ou “a nossa diáspora”
  rationale: A oração pede que Deus reúna pessoas. O substantivo grego pode designar metonimicamente a comunidade espalhada; a tradução explicita esse referente, enquanto a nota preserva a forma literal.
- issue: Força de δουλεύοντας
  choice: 'Preservar a linguagem de escravização: “os que vivem escravizados”.'
  alternative: “os que servem” ou “os que estão em servidão”
  rationale: O contexto é de sujeição entre as nações, e o verbo da família de δοῦλος tem aqui clara força de escravidão. A tradução não atenua essa condição.
- issue: Sentido de βδελυκτούς aplicado às pessoas
  choice: “detestados”, indicando como essas pessoas são vistas e tratadas.
  alternative: “abomináveis” ou “abominados”
  rationale: A coordenação com “desprezados” e o contexto de súplica favorecem a condição social dos que são alvo de repulsa. “Detestados” mantém a intensidade sem declarar que sejam objetivamente abomináveis.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém o tratamento direto a Deus por “tu”, corrente na linguagem bíblica em português, e preserva o paralelismo dos três imperativos antes da petição final.
