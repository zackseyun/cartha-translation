  yaml_path: translation/deuterocanon/2_maccabees/001/014.yaml
  text: For when Antiochus and his friends with him arrived at the place as though to marry her[a], in order to get the money in large amount as a dowry payment,
translation:
  language: pt
  text: Pois, quando Antíoco, acompanhado dos amigos que estavam com ele, chegou ao lugar como se fosse casar-se com ela[a], a fim de receber uma grande quantia em dinheiro como dote,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «como se fosse viver com ela». O verbo grego pode referir-se tanto a viver com alguém quanto a contrair matrimônio; aqui, a menção do dote favorece o sentido de casamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνοικῶν
  choice: como se ele fosse casar-se com ela
  rationale: O particípio pode indicar viver junto ou contrair matrimônio. Neste contexto, a formulação matrimonial explica a referência ao dote, enquanto «como se» comunica a aparência ou alegação sem apresentar a união como real.
- source_word: παρεγένετο εἰς τὸν τόπον
  choice: chegaram ao lugar
  rationale: Expressa de modo natural em português o movimento e a chegada ao local; o verbo fica no plural por concordância natural com Antíoco e seus amigos, sujeito composto.
- source_word: ὅ τε Ἀντίοχος καὶ οἱ σὺν αὐτῷ φίλοι
  choice: Antíoco e os amigos que estavam com ele
  rationale: Preserva tanto φίλοι, «amigos», quanto a indicação explícita de que o acompanhavam, sem impor o sentido técnico de cortesãos.
- source_word: χάριν τοῦ λαβεῖν
  choice: a fim de receber
  rationale: Mantém claramente a força de finalidade da construção grega em registro digno e corrente.
- source_word: τὰ χρήματα πλείονα
  choice: uma grande soma em dinheiro
  rationale: No contexto, o comparativo πλείονα tem força quantitativa, indicando muito ou maior quantidade de dinheiro. A tradução evita a expressão pouco natural «o dinheiro em maior quantidade».
- source_word: εἰς φερνῆς λόγον
  choice: como dote
  rationale: φερνή significa «dote», e a expressão com λόγος apresenta o dinheiro sob essa rubrica ou condição. «Como dote» é conciso e idiomático.
theological_decisions:
- issue: Identidade feminina implícita em αὐτῇ
  choice: manter o pronome «ela» no texto
  alternative: explicitar «a deusa»
  rationale: O grego emprega apenas o pronome, e a identificação decorre do contexto. Manter «ela» evita acrescentar ao versículo uma explicitação ausente do texto-fonte.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A frase conserva a vírgula final porque o versículo continua sintaticamente no seguinte. A construção matrimonial permanece marcada como aparência ou pretensão, e a ambiguidade lexical é registrada em nota.
