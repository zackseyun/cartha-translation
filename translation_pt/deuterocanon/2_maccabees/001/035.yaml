  text: And from those men the king received many different gifts[a], and distributed them.
translation:
  language: pt
  text: E daqueles homens o rei recebia muitos presentes variados[a] e os distribuía.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «muitas coisas variadas». O grego não expressa o objeto; «presentes» é suprido pelo contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: com eles
  rationale: O pronome relativo está no dativo e é entendido naturalmente com μετεδίδου, indicando aqueles com quem o rei repartia o que recebia. A forma pronominal retoma as pessoas mencionadas no contexto.
- source_word: πολλὰ διάφορα
  choice: muitos bens diversos
  rationale: A expressão neutra plural significa literalmente “muitas coisas diversas”. “Bens” oferece em português um substantivo natural e suficientemente amplo, sem especificar indevidamente que se tratava de presentes.
- source_word: ἐλάμβανεν
  choice: recebia
  rationale: O imperfeito de λαμβάνω indica uma ação passada em curso ou habitual. “Recebia” preserva esse aspecto e é mais adequado ao contexto do que “tomava”.
- source_word: μετεδίδου
  choice: repartia
  rationale: O imperfeito de μεταδίδωμι expressa dar uma parte ou compartilhar. “Repartia” conserva tanto a ideia distributiva quanto o aspecto habitual ou continuado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. A tradução conserva os dois verbos no imperfeito e liga o dativo οἷς a “repartia”, conforme a sintaxe grega, em vez de introduzir a ideia não expressa de que o rei recebia os bens daquelas pessoas.
