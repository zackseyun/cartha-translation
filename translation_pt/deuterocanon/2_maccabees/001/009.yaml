  text: And now[b][a], celebrate the days of the Festival of Booths in the month of Chislev.
translation:
  language: pt
  text: E agora, celebrem os dias da Festa das Cabanas[a] no mês de Quisleu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, na forma mais tradicional, «Festa dos Tabernáculos».
    reason: lexical_alternative
  - marker: b
    text: Quisleu corresponde aproximadamente a novembro–dezembro no calendário judaico.
    reason: cultural_note
lexical_decisions:
- source_word: ἄγητε
  choice: celebrem
  rationale: No idioma formado com ἡμέρας, ἄγω significa observar ou celebrar dias festivos, não literalmente «conduzi-los». O imperativo português transmite com naturalidade a exortação elíptica introduzida por ἵνα.
- source_word: τὰς ἡμέρας
  choice: os dias
  rationale: A tradução direta preserva a ênfase temporal da expressão grega e soa natural com o verbo «celebrar».
- source_word: τῆς σκηνοπηγίας
  choice: da Festa das Cabanas
  rationale: O substantivo designa a festa judaica em que se habitava em cabanas. Esta forma comunica o sentido com clareza, enquanto a designação tradicional é registrada em nota.
- source_word: τοῦ Χασελεὺ μηνός
  choice: no mês de Quisleu
  rationale: A construção portuguesa com «no mês de» expressa idiomaticamente a relação genitiva do grego. «Quisleu» é a forma bíblica consolidada e inteligível em português para o nome desse mês.
theological_decisions:
- issue: Designação da festa σκηνοπηγία
  choice: Festa das Cabanas
  alternative: Festa dos Tabernáculos
  rationale: A escolha torna transparente o significado do nome sem alterar a identidade da festividade judaica; a forma tradicional é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A exortação grega elíptica com ἵνα foi vertida por um imperativo natural no plural, sem acrescentar sujeito ou explicação ao texto.
