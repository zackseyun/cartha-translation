  text: Blessed in every way is our God[a], who gave up those who acted wickedly.
translation:
  language: pt
  text: Bendito é o nosso Deus em tudo, que entregou[a] os que agiram com impiedade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “deu os que agiram com impiedade”. O grego não explicita a quem eles foram dados ou entregues.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πάντα
  choice: em tudo
  rationale: A expressão adverbial intensifica «bendito» e conserva de modo conciso a abrangência do grego.
- source_word: εὐλογητὸς
  choice: Bendito
  rationale: Termo tradicional e ainda claro para a atribuição de louvor a Deus, preservando o tom litúrgico do original.
- source_word: ἡμῶν ὁ θεός
  choice: o nosso Deus
  rationale: Equivalente possessivo natural em português, sem perder a relação comunitária expressa pelo grego.
- source_word: ἔδωκεν
  choice: entregou
  rationale: No contexto de derrota e juízo dos inimigos, «entregou» expressa a provável ideia de colocá-los sob o poder de outrem, sem acrescentar um destinatário que o grego deixa implícito.
- source_word: τοὺς ἀσεβήσαντας
  choice: os que agiram com impiedade
  rationale: O particípio aoristo descreve uma conduta ímpia. A formulação preserva tanto o caráter religioso quanto moral da transgressão, sem transformar o particípio em identidade permanente.
theological_decisions:
- issue: Sentido da ação divina em ἔδωκεν com objeto pessoal hostil
  choice: Deus entregou os ímpios para derrota ou juízo, sem especificar a quem.
  alternative: Deus deu os que agiram com impiedade.
  rationale: O contexto favorece a ideia de entrega dos inimigos, mas o verbo grego significa literalmente «deu» e não declara o destinatário. A tradução principal comunica o sentido contextual provável, enquanto a nota conserva a indeterminação formal.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com cadência litúrgica moderada. A ordem «Bendito em tudo é o nosso Deus» mantém a ênfase inicial do grego sem introduzir um imperativo ausente no texto-fonte.
