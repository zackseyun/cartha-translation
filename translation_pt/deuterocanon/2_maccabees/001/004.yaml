  text: and open your heart in his law and in the commandments[a], and bring about peace;
translation:
  language: pt
  text: e abra o coração de vocês para a sua Lei e para os mandamentos, e estabeleça a paz.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em termos literais: “e abrir o coração de vocês na sua Lei e nos mandamentos, e fazer a paz”. Os infinitivos gregos dão continuidade à oração do versículo anterior.'
    reason: A nota preserva a forma sintática e as preposições do grego, esclarecendo por que o texto principal usa verbos no subjuntivo e uma construção portuguesa mais idiomática.
lexical_decisions:
- source_word: διανοίξαι
  choice: abra
  rationale: O verbo mantém a metáfora de tornar o interior humano receptivo. O subjuntivo dá continuidade natural, em português, à oração ou desejo iniciado no versículo anterior.
- source_word: τὴν καρδίαν ὑμῶν
  choice: o coração de vocês
  rationale: “Coração” preserva o conhecido idioma bíblico para a pessoa interior, incluindo vontade e entendimento; “de vocês” comunica claramente o plural de ὑμῶν.
- source_word: ἐν τῷ νόμῳ αὐτοῦ καὶ ἐν τοῖς προστάγμασιν
  choice: para a sua Lei e para os mandamentos
  rationale: Embora ἐν signifique literalmente “em”, com “abrir o coração” o português atual pede naturalmente “para”. “Lei” conserva νόμος, e “mandamentos” expressa de modo acessível as prescrições de προστάγματα.
- source_word: εἰρήνην
  choice: a paz
  rationale: “Paz” preserva a amplitude comunitária e pactual de εἰρήνη, sem reduzi-la a tranquilidade subjetiva.
- source_word: ποιῆσαι
  choice: estabeleça
  rationale: No contexto de oração dirigida a Deus, “estabeleça a paz” expressa com naturalidade o sentido causativo de “fazer/produzir paz”, sem sugerir apenas uma negociação humana.
theological_decisions:
- issue: Sujeito e força modal implícitos, herdados do versículo anterior
  choice: Empregar “abra” e “estabeleça” como continuação da oração anterior, sem acrescentar um sujeito explícito.
  alternative: 'Traduzir de modo mais literal com infinitivos: “e abrir o coração de vocês... e fazer a paz”.'
  rationale: Os infinitivos gregos dependem da oração iniciada no versículo anterior. O subjuntivo português preserva essa relação e a agência divina sem inserir no texto deste versículo um pronome ausente no grego.
- issue: Valor de ἐν após “abrir o coração”
  choice: Traduzir idiomaticamente por “para”.
  alternative: “na sua Lei e nos mandamentos”.
  rationale: O grego pode indicar a esfera em que o coração é aberto, mas a reprodução literal com “em” seria pouco natural e potencialmente obscura em português. “Para” mantém a ideia de receptividade à Lei e aos mandamentos sem definir em que consiste essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Lei” recebe inicial maiúscula por designar a Lei de Deus neste contexto; “vocês” torna inequívoco o plural e evita a marca regional de “vós”.
