  text: But when the matter became known and it was reported to the king of the Persians that[a], in the place where the priests who had been taken away had hidden the fire, water had appeared, from which also those with Nehemiah purified the sacrifices[c][b],
translation:
  language: pt
  text: Mas, quando o fato se tornou conhecido e foi relatado ao rei dos persas que, no lugar onde os sacerdotes que haviam sido levados para longe esconderam o fogo, apareceu água, com a qual também os que estavam com Neemias purificaram os sacrifícios,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φανερὸν ἐγενήθη τὸ πρᾶγμα
  choice: o fato se tornou conhecido
  rationale: Expressa que a ocorrência veio a público, em português natural, sem reduzir φανερός apenas à ideia de compreensão intelectual.
- source_word: διηγήθη
  choice: foi relatado
  rationale: O passivo e o destinatário real indicam a comunicação formal do acontecimento.
- source_word: τῷ βασιλεῖ τῶν Περσῶν
  choice: ao rei dos persas
  rationale: Mantém de perto a construção grega e soa corrente em português.
- source_word: οἱ μεταχθέντες ἱερεῖς
  choice: os sacerdotes que haviam sido levados para longe
  rationale: Preserva a remoção passiva indicada pelo particípio sem explicitar além do texto que se tratava de deportação ou exílio.
- source_word: ἔκρυψαν τὸ πῦρ ... τὸ ὕδωρ ἐφάνη
  choice: esconderam o fogo, apareceu água
  rationale: Conserva o contraste narrativo entre o fogo anteriormente escondido e o aparecimento posterior da água.
- source_word: ἀφ' οὗ
  choice: com a qual
  rationale: Toma o relativo como referência à água e exprime de modo idiomático seu uso como meio de purificação.
- source_word: οἱ περὶ τὸν Νεεμίαν
  choice: os que estavam com Neemias
  rationale: Traduz naturalmente o idioma grego referente ao grupo associado a Neemias sem acrescentar gênero não expresso.
- source_word: ἥγνισαν τὰς θυσίας
  choice: purificaram os sacrifícios
  rationale: Preserva o sentido ritual de ἁγνίζω no contexto cultual, sem substituí-lo por uma categoria teológica mais específica.
theological_decisions:
- issue: Sentido cultual de ἥγνισαν τὰς θυσίας
  choice: purificaram os sacrifícios
  alternative: consagraram os sacrifícios
  rationale: “Purificaram” corresponde mais diretamente ao ato de purificação ritual e evita introduzir uma noção mais específica que o grego não exige.
- issue: Referente de ἀφ' οὗ
  choice: referência à água, empregada como meio de purificação
  alternative: referência mais ampla ao acontecimento anterior, com sentido temporal de “depois disso”
  rationale: O antecedente imediato é τὸ ὕδωρ, e a sequência narrativa favorece a água como meio usado na purificação, embora a construção grega admita discussão.
translation_notes:
  register: Português moderno, claro e digno, com construção próxima ao grego. A vírgula final do texto-fonte não foi reproduzida, pois o versículo funciona como unidade editorial em português; a continuidade sintática com o versículo seguinte pode ser indicada no contexto corrido.
