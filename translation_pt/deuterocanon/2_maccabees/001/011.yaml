  yaml_path: translation/deuterocanon/2_maccabees/001/011.yaml
  text: Having been saved by God from great dangers[a], we give him great thanks, as those about to array ourselves against a king.
translation:
  language: pt
  text: Tendo sido salvos por Deus de grandes perigos, nós lhe agradecemos muito, como os que se colocam em formação de batalha contra um rei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como se estivéssemos em formação de batalha contra um rei” ou “como os que estão dispostos em linha de combate contra um rei”. A comparação grega é condensada e emprega uma imagem militar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ μεγάλων κινδύνων
  choice: de grandes perigos
  rationale: Preserva o plural e a intensidade de μεγάλων em português natural.
- source_word: ὑπὸ τοῦ θεοῦ σεσωσμένοι
  choice: Tendo sido salvos por Deus
  rationale: Expressa o particípio perfeito passivo, conservando tanto a ação já realizada quanto a agência explícita de Deus.
- source_word: μεγάλως εὐχαριστοῦμεν αὐτῷ
  choice: nós lhe agradecemos profundamente
  rationale: Reproduz a intensificação de μεγάλως e mantém αὐτῷ como objeto; o pronome explícito ajuda a sustentar a mudança para a comparação no singular coletivo.
- source_word: ὡς ἂν
  choice: como quem
  rationale: Introduz com naturalidade a comparação comprimida e deixa sua nuance exata aberta à nota.
- source_word: πρὸς βασιλέα
  choice: contra um rei
  rationale: No contexto militar de παρατάσσω, πρός tem sentido adversativo.
- source_word: παρατασσόμενοι
  choice: se põe em formação de batalha
  rationale: Torna inteligível a imagem militar de dispor-se em linha de combate, sem acrescentar um combate efetivamente iniciado.
theological_decisions:
- issue: Agência do livramento
  choice: Deus é apresentado diretamente como aquele que salvou os autores dos perigos.
  alternative: Uma formulação impessoal ou providencial, sem agente explícito.
  rationale: A construção ὑπὸ τοῦ θεοῦ com o particípio passivo identifica Deus de modo inequívoco como agente.
- issue: Sentido da comparação militar
  choice: Mantém-se a comparação com alguém que se dispõe contra um rei, sem explicar sua relação lógica com a ação de graças.
  alternative: Interpretar a frase como referência explícita à vitória, à resistência ou à preparação para lutar.
  rationale: O grego é sintaticamente comprimido e não explicita plenamente o ponto da comparação; a tradução não deve resolver essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Formação de batalha” explicita o valor militar inerente ao verbo grego, enquanto a nota preserva a ambiguidade da construção comparativa.
