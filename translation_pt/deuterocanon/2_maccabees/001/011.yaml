    issue: «profundamente» para μεγάλως
    rationale: O advérbio grego intensifica o agradecimento («muito», «grandemente»); «profundamente» pode alterar levemente o foco para a qualidade interior do sentimento.
  - severity: low
    issue: «como quem se põe»
    rationale: A formulação usa um singular genérico onde o particípio grego é plural e reduz a correspondência formal com os autores que falam em primeira pessoa. Uma formulação plural mantém a comparação coletiva com mais clareza.
