  text: Torment those who oppress and insolently abuse us in their pride;[a]
translation:
  language: pt
  text: Atormenta os que nos oprimem e nos ultrajam com arrogância;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Aflige os que nos oprimem e nos tratam com insolência em sua arrogância”; ou: “Pune os que nos oprimem e nos tratam com insolência em sua arrogância”.'
    reason: Alternativas lexicais para βάσανισον, ἐξυβρίζοντας e ἐν ὑπερηφανίᾳ.
lexical_decisions:
- source_word: βάσανισον
  choice: Atormenta
  rationale: O imperativo aoristo de βασανίζω pede que Deus imponha sofrimento ou castigo severo. “Atormenta” conserva a intensidade do verbo sem especificar o meio.
- source_word: τοὺς καταδυναστεύοντας
  choice: os que nos oprimem
  rationale: O particípio descreve quem exerce poder opressivo. “Os que nos oprimem” é natural em português e explicita o objeto entendido pelo contexto da oração comunitária.
- source_word: ἐξυβρίζοντας
  choice: nos ultrajam
  rationale: O verbo exprime tratamento insolente, abusivo e ofensivo. “Ultrajam” preserva sua força e dignidade, enquanto “com arrogância” comunica a atitude indicada pela expressão seguinte.
- source_word: ἐν ὑπερηφανίᾳ
  choice: com arrogância
  rationale: A expressão indica a disposição ou maneira arrogante em que se pratica o ultraje. “Com arrogância” é corrente e fiel ao sentido do grego.
theological_decisions:
- issue: Objeto implícito dos dois particípios
  choice: 'Explicitar “nos” com ambos os verbos: “nos oprimem e nos ultrajam”'
  alternative: Manter o objeto sem expressão explícita ou acrescentá-lo apenas ao segundo verbo
  rationale: O contexto é uma oração comunitária contra os que hostilizam o povo suplicante. Em português, repetir “nos” torna clara a relação sintática sem introduzir uma afirmação teológica nova.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O imperativo mantém a força da súplica, e o ponto e vírgula preserva a continuidade da oração.
