  text: 'To the Jewish brothers in Egypt: the Jewish brothers in Jerusalem and those in the land of Judea[a], greetings and good peace.'
translation:
  language: pt
  text: 'Aos irmãos judeus que estão no Egito: os irmãos judeus em Jerusalém e os da terra da Judeia, saudações[a] e boa paz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega a fórmula epistolar convencional χαίρειν («saudações»), seguida da expressão pouco comum «boa paz».
    reason: Explica a fórmula da carta e a redação deliberadamente incomum preservada na tradução.
lexical_decisions:
- source_word: Τοῖς ἀδελφοῖς τοῖς κατʼ Αἴγυπτον Ἰουδαίοις
  choice: Aos irmãos judeus no Egito
  rationale: A forma dativa introduz os destinatários da carta. “Irmãos” preserva o termo familiar masculino explícito ἀδελφοῖς, e “no Egito” expressa naturalmente o sentido regional de κατʼ Αἴγυπτον.
- source_word: οἱ ἀδελφοὶ οἱ ἐν Ἱεροσολύμοις Ἰουδαῖοι
  choice: os irmãos judeus em Jerusalém
  rationale: A expressão identifica os remetentes e repete “irmãos”, preservando a solidariedade familiar enfatizada no grego.
- source_word: καὶ οἱ ἐν τῇ χώρᾳ τῆς Ἰουδαίας
  choice: e os que estão na terra da Judeia
  rationale: “Terra” representa χώρα e mantém a construção geográfica formal sem reduzir a expressão simplesmente a “na Judeia”.
- source_word: χαίρειν
  choice: enviam saudações
  rationale: No uso epistolar, χαίρειν é uma fórmula convencional de saudação. O verbo “enviam” é uma explicitação sintática necessária para produzir uma frase corrente em português, sem traduzir o termo como a ordem literal “alegrai-vos”.
- source_word: εἰρήνην ἀγαθήν
  choice: votos de boa paz
  rationale: A expressão conserva tanto “paz” quanto o adjetivo “boa”. “Votos de” integra naturalmente essa formulação pouco comum à saudação, sem ampliá-la para conceitos como prosperidade.
theological_decisions:
- issue: Tradução de ἀδελφοῖς/ἀδελφοὶ na saudação epistolar
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: O grego repete explicitamente o substantivo familiar masculino. “Irmãos” preserva essa forma e a ênfase na fraternidade entre as comunidades, sem inserir uma expansão de gênero que o texto não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi levemente explicitada para deixar claros destinatários, remetentes e saudação, enquanto “boa paz” preserva a formulação marcada do original.
