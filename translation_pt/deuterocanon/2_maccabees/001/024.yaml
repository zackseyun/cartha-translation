base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/024.yaml
  text: 'And the prayer was in this form: “Lord God[a], creator of all things, the awesome and mighty and righteous and merciful one[b], the only king and good one,”'
translation:
  language: pt
  text: 'E a oração era assim: “Senhor Deus, criador de todas as coisas, temível[a], poderoso, justo e misericordioso, o único rei e bondoso[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que inspira temor” ou “assombroso”; o termo grego descreve aquele que provoca temor ou profunda reverência.
    reason: lexical_alternative
  - marker: b
    text: Ou “bom” ou “benigno”; o termo grego pode indicar bondade, benignidade ou benevolência.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ἡ προσευχὴ τὸν τρόπον ἔχουσα τοῦτον
  choice: E a oração era assim
  rationale: Expressa naturalmente em português a fórmula grega que introduz o teor da oração, sem perder seu caráter formal.
- source_word: Κύριε ὁ θεός
  choice: Senhor Deus
  rationale: Reproduz diretamente o vocativo da oração; em português moderno, dispensa a interjeição arcaizante “ó”.
- source_word: ὁ πάντων κτίστης
  choice: criador de todas as coisas
  rationale: Torna explícito o alcance universal de πάντων e traduz κτίστης pelo termo corrente “criador”.
- source_word: ὁ φοβερὸς
  choice: temível
  rationale: Indica aquele que inspira temor ou reverência, evitando “medroso”, sentido que “temente” ou equivalentes inadequados poderiam sugerir.
- source_word: ὁ ἰσχυρὸς
  choice: poderoso
  rationale: É uma tradução natural de ἰσχυρός no contexto de louvor aos atributos divinos.
- source_word: δίκαιος
  choice: justo
  rationale: Transmite de modo claro e corrente a retidão moral e judicial atribuída a Deus.
- source_word: ἐλεήμων
  choice: misericordioso
  rationale: É o equivalente tradicional e semanticamente direto para a disposição de mostrar misericórdia.
- source_word: ὁ μόνος βασιλεὺς
  choice: o único rei
  rationale: Preserva sem expansão a exclusividade expressa por μόνος.
- source_word: χρηστός
  choice: bondoso
  rationale: Abrange a qualidade de ser bom, benigno e benevolente e funciona naturalmente como predicativo pessoal em português.
theological_decisions:
- issue: Sentido de κύριος no endereço da oração judaica
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor Deus” é a forma portuguesa natural e consagrada para o vocativo Κύριε ὁ θεός, sem introduzir uma especificação ausente no grego.
- issue: Exclusividade em μόνος βασιλεὺς
  choice: o único rei
  alternative: o rei único
  rationale: A formulação preserva claramente a afirmação da realeza exclusiva de Deus.
- issue: Amplitude semântica de χρηστός
  choice: bondoso
  alternative: bom
  rationale: “Bondoso” comunica a bondade benevolente do atributo sem reduzir o termo apenas a utilidade ou excelência; a alternativa mais ampla é registrada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com cadência de oração. A sequência de atributos foi mantida de forma compacta; as vírgulas refletem a enumeração grega. A oração continua no versículo seguinte, por isso o texto termina com vírgula.
