  text: Then the king enclosed it and made it sacred[a], after testing the matter.
translation:
  language: pt
  text: Então o rei o cercou e o tornou sagrado[a], depois de examinar o assunto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fez dele um santuário”. O grego pode ser entendido de modo predicativo (“tornou-o sagrado”) ou como substantivo (“fez dele um santuário”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιφράξας
  choice: cercou o local
  rationale: O particípio aoristo indica a ação de cercar ou fechar ao redor. Em português, explicitar «o local» torna natural o objeto implícito sem especificar se foi usada uma cerca ou uma muralha.
- source_word: ἱερὸν
  choice: sagrado
  rationale: Tomado como predicativo de ἐποίησεν, expressa que o rei tornou sagrado o objeto ou local cercado. A forma grega também admite leitura substantivada, preservada em nota.
- source_word: ἐποίησεν
  choice: tornou
  rationale: Com o predicativo «sagrado», «tornou» é mais idiomático em português do que o literal «fez».
- source_word: δοκιμάσας
  choice: depois de verificar
  rationale: O particípio aoristo exprime ação anterior à ação principal; no contexto, δοκιμάζω indica examinar e confirmar a realidade do ocorrido.
- source_word: τὸ πρᾶγμα
  choice: o que havia acontecido
  rationale: πρᾶγμα pode designar uma coisa, questão ou acontecimento. Esta formulação corrente comunica que o fenômeno relatado foi verificado, sem definir além do contexto.
theological_decisions:
- issue: Sentido de ἱερὸν em relação ao local
  choice: 'Leitura predicativa: o rei tornou sagrado o local cercado.'
  alternative: 'Leitura substantivada: o rei fez dele um santuário.'
  rationale: Sem artigo, ἱερόν se lê naturalmente como complemento predicativo de ἐποίησεν. A tradução principal evita sugerir necessariamente a construção de um templo, mas a ambiguidade genuína é mantida na nota.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com boa legibilidade brasileira. «Cercou o local» evita especificar o tipo de barreira; «depois de verificar o que havia acontecido» comunica de modo natural a sequência e o sentido contextual.
