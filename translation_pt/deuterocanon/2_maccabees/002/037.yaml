base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/037.yaml
  text: Just as Moses prayed to the Lord[a], and fire came down from heaven and consumed the things of the sacrifice, so also Solomon prayed to the Lord[b], and the fire came down and consumed the whole burnt offerings.
translation:
  language: pt
  text: Assim como Moisés orou ao Senhor, e desceu fogo do céu e consumiu o que pertencia ao sacrifício[a], também Salomão orou ao Senhor, e o fogo desceu e consumiu os holocaustos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega é mais ampla e significa literalmente «as coisas do sacrifício»; pode se referir aos materiais ou às ofertas ligados ao sacrifício.
    reason: lexical_alternative
  - marker: b
    text: Isto é, ofertas inteiramente queimadas.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσηύξατο
  choice: orou
  rationale: O aoristo de προσεύχομαι significa simplesmente que Moisés e Salomão oraram; «orou» é direto e natural, sem acrescentar intensidade não expressa no grego.
- source_word: Κύριον
  choice: Senhor
  rationale: O texto grego traz Κύριον e se refere ao Deus de Israel. «Senhor» corresponde ao testemunho grego sem importar para o texto a forma convencional «SENHOR», usada para representar o tetragrama hebraico.
- source_word: κατέβη πῦρ ἐκ τοῦ οὐρανοῦ
  choice: desceu fogo do céu
  rationale: Mantém a ordem e a vivacidade da expressão grega em português natural.
- source_word: τὰ τῆς θυσίας
  choice: o que pertencia ao sacrifício
  rationale: A expressão neutra plural é mais ampla que «o sacrifício» e designa aquilo que estava ligado a ele, sem especificar indevidamente materiais ou ofertas.
- source_word: ἐδαπάνησεν / ἀνήλωσεν
  choice: consumiu
  rationale: No contexto do fogo sacrificial, «consumiu» é o equivalente idiomático de ambos os verbos e conserva o paralelismo intencional.
- source_word: οὕτως ... καὶ
  choice: também
  rationale: No par correlativo iniciado por καθὼς, «assim como... também» expressa claramente a comparação entre Moisés e Salomão.
- source_word: καταβῆναι τὸ πῦρ
  choice: o fogo desceu
  rationale: A construção transmitida é sintaticamente comprimida; a forma finita em português produz uma sequência coerente e mantém a descida do fogo paralela à primeira oração.
- source_word: ὁλοκαυτώματα
  choice: ofertas queimadas por inteiro
  rationale: Explicita o sentido cultual de ofertas totalmente consumidas pelo fogo e evita que o termo moderno «holocaustos» seja entendido primeiramente em seu sentido histórico contemporâneo.
theological_decisions:
- issue: Forma de κύριος em uma oração dirigida ao Deus de Israel
  choice: Senhor
  alternative: SENHOR
  rationale: Como a fonte grega apresenta Κύριον, «Senhor» traduz o texto efetivamente atestado; «SENHOR» importaria a convenção usada para o tetragrama hebraico.
- issue: Especificidade cultual de ὁλοκαυτώματα
  choice: ofertas queimadas por inteiro
  alternative: holocaustos
  rationale: A tradução preserva a ideia de que as ofertas eram integralmente queimadas, sem depender de um termo que hoje pode sugerir antes de tudo o genocídio do século XX.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção paralela («Assim como... também») e terminologia sacrificial explicada sem excesso de tecnicismo. Os marcadores foram colocados junto às expressões que as notas esclarecem.
