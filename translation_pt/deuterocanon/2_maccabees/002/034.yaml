base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/034.yaml
  text: But when Jeremiah learned of it[a], he reproved them and said, “The place will remain unknown until God gathers his people together and shows mercy.”
translation:
  language: pt
  text: 'Mas, quando Jeremias soube disso, repreendeu-os e disse: “O lugar permanecerá desconhecido até que Deus reúna o seu povo e haja misericórdia[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, o grego diz: “até que Deus reúna uma reunião do povo, e haja misericórdia”.'
    reason: A nota registra a construção enfática e pouco idiomática com “reunir uma reunião” e a formulação impessoal da cláusula final.
lexical_decisions:
- source_word: ὡς δὲ
  choice: Mas, quando
  rationale: Conserva tanto a transição narrativa quanto o valor temporal da expressão grega, em português natural.
- source_word: ἔγνων
  choice: soube disso
  rationale: O aoristo indica que Jeremias tomou conhecimento do que havia acontecido; “soube disso” expressa essa aquisição de conhecimento.
- source_word: μεμψάμενος αὐτοῖς
  choice: repreendeu-os
  rationale: O particípio transmite censura dirigida às pessoas mencionadas; “repreendeu-os” é claro, digno e preserva a força negativa.
- source_word: ἄγνωστος ὁ τόπος ἔσται
  choice: O lugar permanecerá desconhecido
  rationale: “Desconhecido” traduz diretamente ἄγνωστος, enquanto “permanecerá” comunica naturalmente o estado contínuo implicado pelo futuro de εἰμί no contexto.
- source_word: ἕως ἂν συνάγῃ ὁ θεὸς ἐπισυναγωγὴν τοῦ λαοῦ
  choice: até que Deus reúna o seu povo
  rationale: A construção grega literalmente combina o verbo “reunir” com o substantivo “reunião”; a formulação verbal evita redundância pouco natural, preservando o sentido. “Seu” explicita a relação contextual entre Deus e o povo.
- source_word: καὶ ἔλεος γένηται
  choice: e haja misericórdia
  rationale: Mantém a misericórdia como sujeito gramatical da cláusula e preserva a formulação impessoal e sua ambiguidade quanto à agência, em vez de transformá-la explicitamente numa ação de Deus.
theological_decisions:
- issue: Agência divina na cláusula final
  choice: e haja misericórdia
  alternative: e Deus mostre misericórdia
  rationale: Embora o contexto possa sugerir que a misericórdia procede de Deus, no grego ἔλεος é o sujeito de γένηται. A tradução conserva essa estrutura e não explicita uma agência que o texto deixa implícita.
- issue: Referência de τοῦ λαοῦ
  choice: o seu povo
  alternative: o povo
  rationale: O artigo grego diz literalmente “o povo”, mas, tendo Deus como sujeito do ajuntamento e dado o contexto bíblico judaico, o possessivo torna clara em português a relação contextual sem introduzir uma distinção doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução emprega “repreendeu-os” em registro corrente e formal, evita literalismo redundante no corpo do texto e preserva na cláusula final a ambiguidade gramatical do grego.
