base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/032.yaml
  text: So then[a], let us begin the narrative from this point, adding only this much to what has been said before; for it is foolish to be excessive before the history and to abridge the history itself.
translation:
  language: pt
  text: Assim, comecemos a narrativa a partir daqui, acrescentando apenas isto ao que já foi dito; pois seria insensato estender-se demais antes do relato e abreviar o próprio relato.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “história”, nas duas ocorrências de “relato”; o grego ἱστορία pode designar uma investigação ou uma narrativa histórica em sentido amplo, não apenas “história” no sentido acadêmico moderno.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐντεῦθεν οὖν
  choice: Assim, ... daqui
  rationale: Marca a transição para o corpo principal da obra. A combinação preserva tanto a força conectiva de οὖν quanto o sentido discursivo de Ἐντεῦθεν.
- source_word: ἀρξώμεθα τῆς διηγήσεως
  choice: comecemos ... a narrativa
  rationale: O subjuntivo exortativo é naturalmente expresso por “comecemos”; “narrativa” identifica o relato escrito sem sugerir ficção.
- source_word: τοῖς προειρημένοις τοσοῦτον ἐπιζεύξαντες
  choice: acrescentando apenas isto ao que já foi dito
  rationale: Expressa a ideia de anexar uma última observação limitada às considerações anteriores.
- source_word: εὔηθες
  choice: insensato
  rationale: No contexto, qualifica como falta de bom senso o desequilíbrio entre o prefácio e o relato principal.
- source_word: τὸ μὲν πρὸ τῆς ἱστορίας πλεονάζειν
  choice: alongar demais o que vem antes do relato
  rationale: Torna explícito, de modo natural em português, que πλεονάζειν indica excesso de extensão no material preliminar.
- source_word: τὴν δὲ ἱστορίαν ἐπιτέμνειν
  choice: abreviar o próprio relato
  rationale: 'Preserva o contraste retórico: exceder-se antes da matéria principal, mas encurtar a matéria propriamente dita.'
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe fluente. “Relato” evita a possível rigidez ou ambiguidade moderna de “história”, enquanto a nota preserva a alternativa lexical. O marcador foi colocado após a frase à qual a nota se aplica.
