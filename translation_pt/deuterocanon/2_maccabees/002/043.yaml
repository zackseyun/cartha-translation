  yaml_path: translation/deuterocanon/2_maccabees/002/043.yaml
  text: Since we are about to celebrate the purification[a], we have written to you. Therefore you will do well to observe the days.
translation:
  language: pt
  text: Como estamos prestes a celebrar a purificação, escrevemos a vocês. Portanto, farão bem em celebrar os dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «guardar os dias» ou «observar os dias». O mesmo verbo grego é usado anteriormente no versículo com referência à «purificação».
    reason: lexical_alternative
lexical_decisions:
- source_word: Μέλλοντες
  choice: como estamos prestes a
  rationale: Expressa de modo natural o valor prospectivo do particípio grego e sua função de indicar a ocasião da carta.
- source_word: ἄγειν
  choice: celebrar
  rationale: No contexto festivo, o verbo significa realizar, guardar ou celebrar uma festa ou seus dias. A repetição de “celebrar” nos dois casos preserva a repetição do mesmo verbo no grego.
- source_word: τὸν καθαρισμόν
  choice: a Purificação
  rationale: Mantém o sentido literal do substantivo e, com inicial maiúscula, sinaliza que aqui se trata da celebração ligada à purificação do templo, sem inserir no texto a explicação “festa da”.
- source_word: ἐγράψαμεν
  choice: escrevemos
  rationale: O aoristo epistolar pode ser vertido naturalmente pelo pretérito perfeito em português, referindo-se à própria carta.
- source_word: καλῶς ... ποιήσετε
  choice: farão bem
  rationale: É a forma portuguesa corrente e fiel para a expressão grega de recomendação ou exortação.
- source_word: τὰς ἡμέρας
  choice: os dias
  rationale: Conserva a formulação simples do grego; o contexto identifica esses dias como os da celebração.
