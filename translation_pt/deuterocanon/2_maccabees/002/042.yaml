lexical_decisions:
- source_word: ἐὰν ... χρείαν ἔχητε
  choice: se precisarem
  rationale: A expressão χρείαν ἔχειν significa “ter necessidade” ou “precisar”. A forma verbal é mais natural no português atual e mantém a condição sem explicitar indevidamente o objeto.
- source_word: οὖν
  choice: portanto
  rationale: Preserva a força inferencial ou transitiva da conjunção no contexto epistolar.
- source_word: τοὺς ἀποκομιούντας
  choice: quem possa levá-los
  rationale: O particípio designa as pessoas encarregadas de transportar ou entregar os itens mencionados no contexto. “Quem possa” expressa com naturalidade a função prevista, e “-los” supre o objeto implícito sem identificá-lo no corpo do texto.
- source_word: ὑμῖν
  choice: até vocês
  rationale: Com o verbo de transporte, esta formulação comunica claramente que os itens devem chegar aos destinatários.
- source_word: ἀποστείλατε
  choice: enviem
  rationale: Reproduz de modo direto e digno o imperativo aoristo dirigido a mais de uma pessoa.
- source_word: ἐὰν οὖν ἐὰν
  choice: Portanto, se
  rationale: O texto transmitido repete ἐὰν. A tradução verte uma única condição em português corrente e registra a irregularidade em nota.
