  yaml_path: translation/deuterocanon/2_maccabees/002/054.yaml
  text: For just as it is not easy for one who prepares a banquet[a], or even seeks the benefit of others, yet for the gratitude of the many we will gladly endure the hardship[b];
translation:
  language: pt
  text: Pois, assim como não é fácil para quem prepara um banquete[a] ou busca o bem dos outros, nós também, apesar disso, suportaremos de bom grado o sofrimento, por causa da gratidão de muitos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma festa”; o termo grego também pode designar um simpósio, isto é, uma reunião com comida e bebida.
    reason: lexical_alternative
  - marker: b
    text: “A gratidão de muitos” refere-se ao agradecimento ou apreço de muitos leitores, e não a um termo sacramental técnico.
    reason: cultural_note
lexical_decisions:
- source_word: καθάπερ
  choice: Pois, assim como
  rationale: Preserva tanto a ligação explicativa com o contexto anterior quanto a introdução da comparação.
- source_word: τῷ παρασκευάζοντι συμπόσιον
  choice: para quem prepara um banquete
  rationale: O dativo com οὐκ εὐχερές indica a pessoa para quem a tarefa não é fácil; “banquete” comunica naturalmente a imagem literária de συμπόσιον.
- source_word: ζητοῦντι τὴν ἑτέρων ὠφέλειαν
  choice: procura o benefício dos outros
  rationale: Mantém o sentido de buscar a vantagem ou o bem alheio sem acrescentar uma interpretação específica.
- source_word: οὐκ εὐχερές
  choice: não é fácil
  rationale: Equivalente corrente e direto para a expressão grega de dificuldade.
- source_word: ὅμως
  choice: ainda assim
  rationale: Expressa claramente o contraste concessivo entre a dificuldade e a disposição de suportá-la.
- source_word: διὰ τὴν τῶν πολλῶν εὐχαριστίαν
  choice: por causa da gratidão de muitos
  rationale: διὰ com acusativo indica motivo; “gratidão” conserva aqui o sentido comum de agradecimento ou apreço.
- source_word: ἡδέως
  choice: de bom grado
  rationale: Comunica disposição voluntária e positiva, em registro digno e natural.
- source_word: τὴν κακοπάθειαν
  choice: o trabalho penoso
  rationale: No contexto do trabalho literário, a expressão denota esforço árduo e sofrimento ligado à tarefa, sem sugerir indevidamente perseguição.
- source_word: ὑποίσομεν
  choice: suportaremos
  rationale: Preserva o futuro e a ideia de assumir e aguentar uma dificuldade.
theological_decisions:
- issue: Sentido de εὐχαριστία
  choice: gratidão comum ou apreço dos muitos
  alternative: ação de graças em sentido geral ou referência sacramental
  rationale: O contexto é o prólogo literário e trata da reação dos leitores ao esforço do autor; não há indicação de uso litúrgico ou sacramental técnico.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A estrutura comparativa um pouco incompleta do grego foi mantida, sem fornecer silenciosamente um segundo termo de comparação. O tom permanece literário e digno, mas acessível.
