    issue: Comparação elíptica pouco natural em português
    rationale: O texto inicial reproduz a elipse grega, mas a sequência «assim como ... ainda assim suportaremos» fica sintaticamente incompleta para leitores modernos. «Nós também» explicita apenas a correlação comparativa já implicada.
  - severity: low
    issue: «Trabalho penoso» restringe κακοπάθεια
    rationale: Embora o contexto seja um prólogo literário, κακοπάθεια designa sofrimento ou dificuldade suportada e não nomeia explicitamente trabalho. «Sofrimento» conserva maior amplitude.
