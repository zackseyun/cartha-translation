lexical_decisions:
- source_word: διακριβοῦν
  choice: o tratamento minucioso
  rationale: O infinitivo articular designa a exposição cuidadosa e detalhada de cada ponto. “Tratamento minucioso” preserva tanto a precisão quanto o caráter literário da tarefa.
- source_word: περὶ ἑκάστων
  choice: de cada assunto
  rationale: A expressão é distributiva e se refere a cada ponto da narrativa; esta formulação é clara e idiomática em português.
- source_word: τῷ συγγραφεῖ παραχωρήσαντες
  choice: deixando ao autor
  rationale: παραχωρέω indica entregar ou deixar algo ao âmbito de outra pessoa; συγγραφεύς é naturalmente “autor” neste contexto literário.
- source_word: ἐπιπορεύεσθαι
  choice: seguir
  rationale: Com ὑπογραμμοῖς, exprime o avanço metafórico ao longo de linhas orientadoras.
- source_word: ὑπογραμμοῖς
  choice: as linhas gerais
  rationale: O termo pode indicar traços, esboço ou modelo. “Linhas gerais” comunica a estrutura orientadora que o abreviador procura acompanhar.
- source_word: ἐπιτομῆς
  choice: do resumo
  rationale: Aqui designa a forma abreviada de uma obra maior. “Resumo” é corrente e inteligível, embora “epítome” seja uma alternativa técnica.
- source_word: ἀτονοῦντες
  choice: nos esforçando
  rationale: O verbo evoca falta de força, desgaste ou esforço sob uma tarefa exigente. No contexto, a formulação comunica o empenho custoso de manter-se dentro das linhas da abreviação, sem sugerir mero cuidado editorial.
