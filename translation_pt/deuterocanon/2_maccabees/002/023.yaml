  yaml_path: translation/deuterocanon/2_maccabees/002/023.yaml
  text: And when this happened[a], a flame was kindled; but when the light from the altar shone forth, it was consumed.
translation:
  language: pt
  text: Quando isso aconteceu, acendeu-se uma chama; mas, quando a luz vinda do altar resplandeceu, a chama foi consumida.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego traduzido por «resplandeceu» também pode sugerir que a luz brilhou de volta ou em resposta. Além disso, o sujeito de «foi consumida» não é expresso no grego; pode ser a chama ou, possivelmente, a oferta, o material queimado ou o líquido mencionado no contexto anterior.
    reason: Preservar a ambiguidade lexical de ἀντιλάμπω e a ambiguidade sintática do sujeito implícito de ἐδαπανήθη.
lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  choice: Quando isso aconteceu
  rationale: Expressa com naturalidade a transição temporal e o acontecimento indicado por ἐγενήθη, sem tom arcaico.
- source_word: φλὸξ ἀνήφθη
  choice: acendeu-se uma chama
  rationale: Preserva a imagem singular de φλόξ e traduz de modo corrente o passivo ἀνήφθη, indicando que a chama começou a arder.
- source_word: ἀπὸ τοῦ θυσιαστηρίου
  choice: vinda do altar
  rationale: Liga claramente a origem da luz ao altar, conforme a construção grega.
- source_word: ἀντιλάμψαντος φωτός
  choice: quando a luz ... resplandeceu
  rationale: Reproduz o genitivo absoluto como oração temporal. 'Resplandeceu' é natural e mantém a ideia de emissão intensa de luz, embora o verbo grego também possa sugerir brilho em resposta ou refletido.
- source_word: ἐδαπανήθη
  choice: a chama se consumiu
  rationale: Traduz o sentido passivo de ser consumido ou gasto e toma φλόξ, o referente singular mais próximo, como sujeito implícito; a incerteza sintática é registrada em nota.
theological_decisions:
- issue: Referente do sujeito implícito em ἐδαπανήθη
  choice: A chama se consumiu.
  alternative: A oferta, o material queimado ou o líquido mencionado no contexto anterior foi consumido.
  rationale: O grego não declara o sujeito do verbo final. A chama é o referente singular expresso mais próximo e, por isso, a leitura mais econômica neste versículo isolado; a nota preserva as demais possibilidades sem decidir além da evidência.
- issue: Nuance de ἀντιλάμπω
  choice: resplandeceu
  alternative: brilhou em resposta; refletiu sua luz; reluziu de volta
  rationale: O contexto admite tanto a ideia geral de resplandecer quanto uma nuance responsiva ou refletida. O texto principal privilegia português claro, e a nota conserva a amplitude lexical.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção direta. Evitou-se linguagem arcaica e manteve-se em nota a ambiguidade real do texto grego.
