  text: But when the matter became known[a], and it was reported to the king of the Persians that in the place where the priests who had been taken away had hidden the fire, water appeared, from which also those with Nehemiah purified the sacrifices[c][b],
translation:
  language: pt
  text: Mas, quando o fato se tornou conhecido e foi relatado ao rei dos persas que, no lugar onde os sacerdotes que haviam sido levados esconderam o fogo, apareceu água, com a qual também Neemias e seus companheiros purificaram os sacrifícios,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “da qual também os que estavam ao redor de Neemias purificaram os sacrifícios”. A expressão pode indicar a procedência da água (“da qual”) ou, de modo mais idiomático, o instrumento usado (“com a qual”); “os que estavam ao redor de Neemias” significa Neemias e seus companheiros.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερὸν ἐγενήθη τὸ πρᾶγμα
  choice: o fato se tornou conhecido
  rationale: Expressa naturalmente que o acontecimento veio a público, preservando o caráter resultativo da construção grega.
- source_word: διηγήθη
  choice: foi relatado
  rationale: Reproduz a comunicação formal da notícia ao rei sem ampliar indevidamente o sentido.
- source_word: τῷ βασιλεῖ τῶν Περσῶν
  choice: ao rei dos persas
  rationale: Mantém de perto a construção grega e soa natural no registro narrativo.
- source_word: οἱ μεταχθέντες ἱερεῖς
  choice: os sacerdotes levados para o exílio
  rationale: O particípio indica remoção de seu lugar; no contexto, o exílio é provável, mas a forma passiva evita especificar mais que o texto.
- source_word: τὸ ὕδωρ ἐφάνη
  choice: apareceu água
  rationale: Segue diretamente o grego e mantém o caráter inesperado do aparecimento.
- source_word: ἀφʼ οὗ
  choice: com a qual
  rationale: Em português, a leitura instrumental é a forma mais natural no contexto da purificação, embora o grego use literalmente uma expressão que também pode indicar procedência.
- source_word: οἱ περὶ τὸν Νεεμίαν
  choice: Neemias e seus companheiros
  rationale: Verte idiomaticamente a expressão grega para o líder e o grupo associado a ele.
- source_word: ἥγνισαν τὰς θυσίας
  choice: purificaram os sacrifícios
  rationale: Preserva o sentido ritual do verbo e a tensão do texto quanto ao objeto exato da purificação.
theological_decisions:
- issue: Sentido cultual da purificação dos sacrifícios
  choice: purificaram os sacrifícios
  alternative: consagraram as ofertas sacrificiais
  rationale: A tradução escolhida preserva a linguagem ritual do original sem determinar que se trate especificamente de consagração nem reinterpretar o objeto da ação.
- issue: Relação da água com a purificação
  choice: com a qual
  alternative: da qual
  rationale: A formulação instrumental é idiomática em português e se ajusta à ação descrita; a nota registra que o grego também permite uma leitura mais literal de procedência.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluente. “Levados para o exílio” explicita o contexto provável da remoção sem usar o termo mais específico “deportados”. A nota conserva as ambiguidades de ἀφʼ οὗ e explica o idioma οἱ περὶ τὸν Νεεμίαν.
