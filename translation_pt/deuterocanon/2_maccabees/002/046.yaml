  yaml_path: translation/deuterocanon/2_maccabees/002/046.yaml
  text: The matters concerning Judas Maccabeus and his brothers[a], and the purification of the greatest sanctuary, and the dedication of the altar,
translation:
  language: pt
  text: Os assuntos relativos a Judas Macabeu e a seus irmãos, à purificação do grande santuário e à dedicação do altar,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rededicação do altar”. O grego diz “dedicação”, mas o contexto histórico trata da restauração do altar depois de sua profanação.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ ... κατὰ τὸν Ἰούδαν
  choice: Os acontecimentos relativos a Judas
  rationale: A construção neutra plural com κατά e acusativo apresenta os assuntos ligados a Judas. “Acontecimentos relativos a” é natural em português e mantém o sentido amplo, sem restringi-lo apenas a feitos ou a uma narrativa histórica.
- source_word: Ἰούδαν τὸν Μακκαβαῖον
  choice: Judas Macabeu
  rationale: Forma tradicional e reconhecível em português para o nome e o epíteto.
- source_word: τοὺς τούτου ἀδελφούς
  choice: seus irmãos
  rationale: O referente são os irmãos literais de Judas; a expressão é exata e corrente.
- source_word: τοῦ ἱεροῦ τοῦ μεγίστου
  choice: do grandioso santuário
  rationale: ἱερόν designa aqui o complexo sagrado do templo. O superlativo μεγίστου pode ter força elativa; “grandioso” transmite elevada grandeza em português natural sem introduzir a ideia ausente de “santíssimo”.
- source_word: καθαρισμόν
  choice: purificação
  rationale: Preserva o sentido ritual e cultual da restauração do santuário.
- source_word: βωμοῦ
  choice: altar
  rationale: Equivalente comum e preciso no contexto sacrificial.
- source_word: ἐγκαινισμόν
  choice: dedicação
  rationale: O substantivo significa dedicação ou inauguração. O grego não explicita repetição; por isso, “rededicação” fica como alternativa contextual em nota.
theological_decisions:
- issue: Sentido de ἱερόν no contexto cultual judaico
  choice: santuário
  alternative: templo
  rationale: “Santuário” conserva a dimensão sagrada de ἱερόν e acompanha de perto a formulação grega. “Templo” também seria possível no contexto de Jerusalém, mas torna mais explícita a identificação arquitetônica.
- issue: Dedicação ou rededicação do altar
  choice: dedicação
  alternative: rededicação
  rationale: A tradução principal segue a forma lexical do grego, que não contém elemento explícito com o sentido de “novamente”. A alternativa registra o contexto histórico da restauração após a profanação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura coordenada e a vírgula final foram preservadas porque o texto fornecido é um fragmento que continua na sequência.
