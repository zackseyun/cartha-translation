  source_fidelity: A tradução transmite adequadamente a deportação em curso, a retirada secreta de uma porção do fogo do altar e seu ocultamento. Contudo, «onde o deixaram bem protegido» explicita de modo um pouco solto o objeto de κατησφαλίσαντο, e a formulação final «ninguém soubesse onde ficava o lugar» é redundante e menos próxima de «o lugar [ser] desconhecido de todos».
  naturalness: O português é claro e de registro apropriado. «Para que o lugar permanecesse desconhecido de todos» é mais natural, conciso e fiel que «de modo que ninguém soubesse onde ficava o lugar». «Ali o puseram em segurança» expressa com maior idiomaticidade a ação de resguardar sem especificar o método.
  terminology: «Antepassados», «sacerdotes devotos», «fogo do altar» e «Pérsia» são escolhas adequadas. «Poço seco» é uma solução aceitável para a expressão grega condensada, e a nota preserva a alternativa de cavidade/poço ou fossa sem água.
