base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/010.yaml
  text: For when our fathers were being led away into Persia[a], the devout priests secretly took some of the fire from the altar and hid it in the hollow of a dry well, where they secured it so that the place would be unknown to everyone.
translation:
  language: pt
  text: Pois, quando nossos antepassados estavam sendo levados para a Pérsia, os sacerdotes devotos retiraram secretamente parte do fogo do altar e o esconderam na cavidade de um poço seco,[a] onde o puseram em segurança, para que o lugar permanecesse desconhecido de todos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “numa cavidade semelhante a um poço, sem água”. A descrição grega é condensada e um tanto incomum, combinando termos que indicam uma cavidade e um poço ou fossa sem água.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγοντο
  choice: estavam sendo levados
  rationale: O imperfeito passivo sugere uma remoção em andamento, provavelmente forçada, sem acrescentar detalhes ausentes do grego.
- source_word: εἰς τὴν Περσικὴν
  choice: para a Pérsia
  rationale: Expressa de forma natural em português o movimento em direção à terra da Pérsia.
- source_word: οἱ πατέρες
  choice: nossos antepassados
  rationale: Neste contexto histórico, refere-se aos ancestrais do povo; “antepassados” evita a possível leitura restrita de pais imediatos.
- source_word: εὐσεβεῖς
  choice: devotos
  rationale: Preserva o caráter religioso dos sacerdotes em linguagem atual e digna.
- source_word: λαβόντες ἀπὸ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: retiraram ... parte do fogo do altar
  rationale: Indica que tomaram uma porção do fogo que estava no altar, sem sugerir que removeram todo ele.
- source_word: λαθραίως
  choice: secretamente
  rationale: Comunica claramente que a ação foi feita às escondidas; sua posição junto de “retiraram” acompanha naturalmente o grego.
- source_word: κατέκρυφαν
  choice: esconderam
  rationale: Equivalente direto e corrente, sem acrescentar a ideia mais específica de enterrar.
- source_word: ἐν κοιλώματι φρέατος τάξιν ἔχοντος ἀνύδρου
  choice: na cavidade de um poço seco
  rationale: Conserva as noções de cavidade, poço ou fossa e ausência de água, embora a formulação grega seja comprimida e incomum.
- source_word: κατησφαλίσαντο
  choice: o deixaram bem protegido
  rationale: Expressa a ideia de tornar seguro ou resguardar, sem definir se o fogo foi selado, coberto ou protegido de outra maneira.
- source_word: ὥστε πᾶσιν ἄγνωστον εἶναι τὸν τόπον
  choice: de modo que ninguém soubesse onde ficava o lugar
  rationale: 'Forma idiomática de preservar o resultado pretendido: o lugar permanecer desconhecido de todos.'
theological_decisions:
- issue: Natureza da ação dos sacerdotes com o fogo do altar
  choice: A tradução relata a preservação secreta de parte do fogo do altar durante a deportação, sem explicar seu significado ritual.
  alternative: A ação pode ser entendida como preservação da continuidade do culto ou, mais genericamente, como cuidado reverente por algo sagrado.
  rationale: O versículo descreve o ato de sacerdotes devotos, mas não explicita sua finalidade teológica; por isso, a tradução não introduz uma interpretação doutrinária ou litúrgica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Antepassados” esclarece o uso histórico de “pais”; “poço seco” mantém o texto fluente, enquanto a nota registra a dificuldade e a possível amplitude da expressão grega.
