base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/059.yaml
  text: Therefore let us begin the narrative from this point[a], adding only this much to what has been said before; for it is foolish to be excessive before the history[b], but to abridge the history itself.
translation:
  language: pt
  text: Portanto, comecemos a narrativa a partir daqui[a], acrescentando apenas isto ao que foi dito antes; pois é insensato falar demais antes da história e abreviar a própria história.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o relato”; o grego διήγησις pode designar uma exposição narrativa.
    reason: lexical_alternative
  - marker: b
    text: 'Também se pode traduzir: “é insensato estender-se em excesso antes da história e encurtar a própria história”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐντεῦθεν οὖν
  choice: Portanto, ... daqui
  rationale: Reproduz a transição inferencial de οὖν e o valor discursivo de Ἐντεῦθεν, que conduz do prefácio ao relato principal.
- source_word: ἀρξώμεθα
  choice: comecemos
  rationale: Mantém o subjuntivo exortativo na primeira pessoa do plural, com formulação natural em português.
- source_word: τῆς διηγήσεως
  choice: a narrativa
  rationale: Designa o relato escrito que se inicia; “narrativa” conserva o tom literário e permite distinguir este termo de ἱστορία na oração seguinte.
- source_word: τοῖς προειρημένοις τοσοῦτον ἐπιζεύξαντες
  choice: acrescentando apenas isto ao que já foi dito
  rationale: Expressa a ideia de anexar uma breve observação ao material anterior; “apenas” explicita com naturalidade a limitação contextual de τοσοῦτον.
- source_word: εὔηθες
  choice: insensato
  rationale: No contexto, censura uma prática literária mal concebida. “Insensato” preserva a força crítica sem soar coloquial ou ofensivo em excesso.
- source_word: τὸ μὲν πρὸ τῆς ἱστορίας πλεονάζειν
  choice: falar demais antes da história
  rationale: Traduz πλεονάζειν como excesso de palavras no material introdutório, em linguagem portuguesa clara e corrente.
- source_word: τὴν δὲ ἱστορίαν ἐπιτέμνειν
  choice: mas abreviar a própria história
  rationale: “Abreviar” comunica o sentido de cortar ou reduzir, enquanto “própria” realça o contraste retórico entre uma introdução excessiva e o relato histórico encurtado.
