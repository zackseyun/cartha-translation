revisions:
- from: E então o Senhor revelará estas coisas[a], e aparecerão a glória do Senhor e a nuvem[b], como isso se manifestava no tempo de Moisés[c] e como também Salomão pediu[d], para que o lugar fosse grandemente santificado.
  to: E então o Senhor revelará estas coisas[a], e aparecerão a glória do Senhor e a nuvem[b], conforme foi mostrado no caso de Moisés[c] e conforme Salomão também pediu que o lugar fosse grandemente santificado[d].
  rationale: A revisão substitui a leitura excessivamente temporal “no tempo de Moisés” por uma comparação com o precedente mosaico e remove o aspecto possivelmente habitual introduzido por “se manifestava”. A estrutura final conserva a ambiguidade do grego quanto àquilo que foi mostrado a Moisés, ao mesmo tempo que vincula naturalmente o pedido de Salomão à santificação do lugar.
