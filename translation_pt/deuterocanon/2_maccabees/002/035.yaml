base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/035.yaml
  text: And then the Lord will reveal these things[a], and the glory of the Lord and the cloud will appear, as it was shown in the case of Moses, and as Solomon also asked[d][c][b], that the place might be greatly sanctified.
translation:
  language: pt
  text: E então o Senhor revelará estas coisas[a], e aparecerão a glória do Senhor e a nuvem[b], conforme foi mostrado no caso de Moisés[c] e conforme Salomão também pediu que o lugar fosse grandemente santificado[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fará estas coisas virem à luz”. O verbo grego pode significar mostrar, revelar ou trazer à luz.
    reason: lexical_alternative
  - marker: b
    text: A expressão “a nuvem” provavelmente se refere à conhecida nuvem da presença divina associada a Moisés e às tradições do santuário.
    reason: cross_reference
  - marker: c
    text: Ou “como se manifestou no caso de Moisés”. A expressão grega compara essa manifestação futura com o precedente mosaico.
    reason: lexical_alternative
  - marker: d
    text: Ou “como também Salomão suplicou que o lugar fosse grandemente consagrado”. O verbo pode indicar um pedido e, neste contexto, pode aludir à oração de Salomão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναδείξει
  choice: revelará
  rationale: O verbo pode indicar trazer à luz, mostrar ou revelar. “Revelará” é natural em português e mantém a ideia de tornar conhecido o que estava oculto.
- source_word: ταῦτα
  choice: estas coisas
  rationale: Preserva o demonstrativo explícito e deixa aberto o referente contextual, sem identificar interpretativamente os objetos mencionados antes.
- source_word: ὀφθήσεται
  choice: aparecerão
  rationale: A forma passiva de ὁράω tem aqui o sentido idiomático de tornar-se visível ou aparecer. O plural em português concorda naturalmente com “a glória” e “a nuvem”.
- source_word: δόξα
  choice: glória
  rationale: É a tradução bíblica corrente e conserva a ressonância teofânica do termo.
- source_word: νεφέλη
  choice: a nuvem
  rationale: O artigo definido sugere a conhecida nuvem associada à presença divina nas tradições do santuário.
- source_word: ἐπὶ Μωσῇ
  choice: no tempo de Moisés
  rationale: A expressão remete ao precedente mosaico; esta formulação comunica a referência histórica sem sugerir que a manifestação estivesse fisicamente sobre Moisés.
- source_word: ἐδηλοῦτο
  choice: isso se manifestava
  rationale: O imperfeito médio-passivo aponta para a manifestação no precedente mosaico. “Isso” retoma conjuntamente a glória e a nuvem sem forçar a concordância singular do grego na estrutura portuguesa.
- source_word: ἠξίωσεν
  choice: pediu
  rationale: No contexto, o verbo expressa uma petição de Salomão. “Pediu” preserva o sentido sem explicitar que se tratou de oração, embora isso seja contextualmente possível.
- source_word: ὁ τόπος
  choice: o lugar
  rationale: Mantém a expressão simples do grego e permite que o contexto identifique o lugar como o santuário ou local do templo.
- source_word: καταγιασθῇ
  choice: fosse santificado
  rationale: O verbo denota tornar santo ou consagrar. “Santificado” preserva o registro bíblico e a amplitude teológica do termo.
- source_word: μεγάλως
  choice: grandemente
  rationale: Reproduz o advérbio intensificador sem substituir a intensidade por uma descrição mais interpretativa da cerimônia.
theological_decisions:
- issue: Tradução de κύριος no contexto teofânico da Septuaginta
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte grega traz κύριος. “Senhor” traduz diretamente o termo sem reconstruir no texto português uma forma hebraica não presente nesta testemunha.
- issue: Relação entre a manifestação futura e os precedentes de Moisés e Salomão
  choice: Manter a comparação histórica e teofânica sem expansão doutrinária
  alternative: Explicitar a nuvem como uma formulação técnica da presença divina
  rationale: O texto liga a revelação futura à glória, à nuvem e aos precedentes de Moisés e Salomão, mas não desenvolve uma doutrina adicional sobre a natureza dessa presença.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva termos bíblicos reconhecíveis como “glória”, “Senhor” e “santificado”, evitando arcaísmos e explicações doutrinárias no corpo do versículo.
