  yaml_path: translation/deuterocanon/2_maccabees/002/014.yaml
  text: And the priests made prayer when the sacrifice had been consumed[a], both the priests and all the others, with Jonathan beginning and the rest responding[b], as in Nehemiah.
translation:
  language: pt
  text: Os sacerdotes fizeram uma oração enquanto o sacrifício era consumido — os sacerdotes e todos os demais[a] —, com Jônatas dando início e os outros respondendo em voz alta, como no caso de Neemias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego repete de modo um tanto incomum “os sacerdotes”: “os sacerdotes fizeram uma oração… os sacerdotes e todos”. A repetição pode enfatizar que todos os presentes participaram.'
    reason: lexical_alternative
  - marker: b
    text: O grego diz de forma elíptica “como [no caso] de Neemias”. Também pode ser entendido como “como Neemias fez” ou “como na oração de Neemias”.
    reason: alternative_reading
lexical_decisions:
- source_word: προσευχὴν δὲ ἐποιήσαντο
  choice: fizeram então uma oração
  rationale: A construção idiomática significa literalmente “fizeram uma oração”. Em português, essa formulação é clara e mantém a ação expressa pelo grego; “então” comunica o valor continuativo de δέ no contexto.
- source_word: δαπανωμένης τῆς θυσίας
  choice: enquanto o sacrifício era consumido
  rationale: O particípio presente δαπανωμένης indica uma ação em curso simultânea à oração. No contexto sacrificial, δαπανάω tem o sentido natural de o sacrifício ser consumido, provavelmente pelo fogo.
- source_word: οἵ τε ἱερεῖς καὶ πάντες
  choice: os sacerdotes e todos os demais
  rationale: A tradução conserva a repetição de “os sacerdotes” já presente no grego e explicita que πάντες abrange o restante dos participantes, sem restringir indevidamente quem estava presente.
- source_word: καταρχομένου Ἰωνάθον
  choice: com Jônatas dando início
  rationale: κατάρχομαι indica começar ou tomar a iniciativa. “Dando início” preserva a possibilidade de Jônatas iniciar a oração ou a recitação responsiva, sem defini-lo mais especificamente como dirigente litúrgico.
- source_word: τῶν τε λοιπῶν ἐπιφωνούντων
  choice: e os outros respondendo em voz alta
  rationale: ἐπιφωνέω envolve pronunciar ou aclamar em voz alta e, neste contexto, provavelmente descreve uma resposta coletiva. A formulação mantém tanto o aspecto vocal quanto o provável caráter responsivo.
- source_word: ὡς Νεεμίου
  choice: como no caso de Neemias
  rationale: A expressão grega é elíptica. “Como no caso de Neemias” soa natural em português sem acrescentar ao texto principal que se trata especificamente da oração ou da prática de Neemias; a ambiguidade é registrada em nota.
theological_decisions:
- issue: Sentido da expressão elíptica ὡς Νεεμίου
  choice: como no caso de Neemias
  alternative: como Neemias fez; como na oração de Neemias; segundo Neemias
  rationale: O grego não explicita o elemento da comparação. A tradução evita decidir se a referência é à ação, à oração ou à prática de Neemias, preservando a tensão interpretativa em vez de suprir silenciosamente palavras ausentes.
- issue: Participação coletiva na oração
  choice: preservar a repetição “os sacerdotes ... os sacerdotes e todos os demais”
  alternative: simplificar para “os sacerdotes e todos os demais fizeram uma oração”
  rationale: Embora estilisticamente incomum, a repetição pertence ao texto grego e pode enfatizar que toda a assembleia se uniu à oração. Ela não deve ser apagada sem indicação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem e a repetição do grego foram preservadas tanto quanto possível sem tornar a frase ininteligível; travessões marcam a retomada explicativa do sujeito.
