lexical_decisions:
- source_word: ἐμβατείνειν
  choice: adentrar o assunto
  rationale: O verbo evoca literalmente entrar ou avançar por algo; no contexto retórico, indica aprofundar o tratamento do tema. A formulação mantém a imagem e comunica o sentido com naturalidade.
- source_word: περίπατον ποιεῖσθαι λόγῳ
  choice: fazer com as palavras um longo percurso
  rationale: A expressão significa literalmente fazer um passeio ou percurso pelo discurso. Esta tradução preserva a metáfora vívida e indica um tratamento extenso, sem recorrer a uma formulação obscura.
- source_word: πολυπραγμονεῖν
  choice: ocupar-se excessivamente
  rationale: O verbo traz a ideia de dedicar atenção demasiada ou trabalhosa a algo. O advérbio “excessivamente” conserva a nuance crítica sem sugerir indevidamente intromissão em assuntos alheios.
- source_word: ἐν τοῖς κατὰ μέρος
  choice: de cada detalhe
  rationale: A expressão se refere aos elementos particulares considerados um a um. “Cada detalhe” é claro e preserva o caráter minucioso da atividade.
- source_word: τῷ τῆς ἱστορίας ἀρχηγενέτῃ
  choice: ao autor original da história
  rationale: O termo raro designa aquele que deu origem ou produziu primeiro a narrativa histórica, em contraste com quem a resume. “Autor original” expressa essa distinção de modo natural.
- source_word: καθῆκε
  choice: cabia
  rationale: O verbo indica aquilo que compete a alguém ou lhe é apropriado. “Cabia” apresenta com concisão essa atribuição de tarefa.
