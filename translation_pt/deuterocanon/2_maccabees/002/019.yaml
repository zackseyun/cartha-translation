lexical_decisions:
- source_word: βάσανισον
  choice: Castiga
  rationale: O imperativo aoristo pede que Deus imponha sofrimento punitivo ou juízo. “Castiga” preserva a força judicial sem especificar o modo como “atormenta” faria.
- source_word: τοὺς καταδυναστεύοντας
  choice: os que oprimem
  rationale: O particípio descreve pessoas que exercem poder de modo opressivo; a formulação é natural e mantém o caráter contínuo da ação.
- source_word: καὶ ἐξυβρίζοντας
  choice: e cometem abusos
  rationale: O verbo indica agir de maneira ultrajante, insolente ou abusiva, podendo envolver mais que insultos verbais. “Cometem abusos” conserva essa amplitude em português corrente.
- source_word: ἐν ὑπερηφανίᾳ
  choice: com arrogância
  rationale: A expressão indica a atitude ou o modo arrogante em que se praticam a opressão e os abusos.
theological_decisions:
- issue: Integridade da fonte e identificação do versículo
  choice: Traduzir somente a breve petição preservada no texto grego fornecido, sem acrescentar contexto.
  alternative: Reconstruir uma frase mais extensa com base em outra localização do trecho ou em outra tradição textual.
  rationale: A fonte fornecida está sinalizada como uma incompatibilidade importante e contém apenas esta oração imperativa. A tradução permanece estritamente vinculada ao grego apresentado e explicita a incerteza em nota.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão e com boa legibilidade brasileira. “Cometem abusos” evita reduzir o verbo grego a ofensa meramente verbal. Os marcadores foram colocados junto ao texto a que se referem, mantendo explícita a ressalva textual.
