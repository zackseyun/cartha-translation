  source_fidelity: A tradução preserva com precisão a construção comparativa e aditiva (ὡσαύτως δὲ καὶ), identifica corretamente Judas e mantém sem especificação indevida o referente neutro plural de τὰ διεσπεπτωκότα πάντα. “Por causa da guerra que ocorreu” transmite adequadamente a relação causal e o caráter de acontecimento passado de γεγονότα. “Está em nosso poder” expressa de modo legítimo παρʼ ἡμῖν como posse/disponibilidade presente.
