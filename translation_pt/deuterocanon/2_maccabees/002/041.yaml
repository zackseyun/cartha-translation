  yaml_path: translation/deuterocanon/2_maccabees/002/041.yaml
  text: Likewise also Judas gathered together for us all the things that had been scattered because of the war that had occurred[b][a], and they are with us.
translation:
  language: pt
  text: Do mesmo modo, Judas também reuniu para nós tudo o que havia sido disperso por causa da guerra que ocorreu[a], e isso está em nosso poder[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa da guerra que havia acontecido”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “e está conosco”. O grego emprega um verbo no singular com um sujeito neutro plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως δὲ καὶ
  choice: Do mesmo modo, ... também
  rationale: Mantém a ligação comparativa e aditiva com a declaração anterior em português natural.
- source_word: Ἰούδας
  choice: Judas
  rationale: Forma portuguesa tradicional do nome grego neste contexto, referente a Judas Macabeu.
- source_word: τὰ διεσπεπτωκότα ... πάντα
  choice: tudo o que havia sido disperso
  rationale: Preserva a referência ampla do neutro plural sem especificar indevidamente documentos ou escritos; o mais-que-perfeito composto expressa o estado resultante anterior.
- source_word: διὰ τὸν γεγονότα πόλεμον
  choice: por causa da guerra que ocorreu
  rationale: Expressa tanto a relação causal quanto a guerra como acontecimento já ocorrido.
- source_word: ἡμῖν
  choice: para nós
  rationale: Representa naturalmente o dativo de vantagem, indicando que a reunião foi feita em benefício da comunidade do narrador.
- source_word: ἐπισυνήγαγεν
  choice: reuniu
  rationale: Verbo corrente que comunica a ação de juntar em um só conjunto aquilo que estava disperso.
- source_word: καὶ ἔστιν παρʼ ἡμῖν
  choice: e isso está em nosso poder
  rationale: Reproduz o singular grego com sujeito neutro plural coletivo e comunica posse ou disponibilidade presente sem identificar mais precisamente os materiais.
