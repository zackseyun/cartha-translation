lexical_decisions:
- source_word: προθεμένων
  choice: dispuseram
  rationale: O particípio aoristo de προτίθημι indica que objetos foram postos ou apresentados diante de alguém. “Dispuseram” expressa a ação concreta sem especificar indevidamente quais eram os objetos.
- source_word: αὐτά
  choice: essas coisas
  rationale: O pronome grego não traz neste versículo um substantivo antecedente explícito. “Essas coisas” conserva a referência anafórica vaga do texto-fonte.
- source_word: τῶν ἱερέων τοῦ Ναναίου
  choice: os sacerdotes de Naneia
  rationale: A construção genitiva identifica os sacerdotes ligados à divindade Naneia. A forma portuguesa “Naneia” representa de maneira clara a forma grega, enquanto “Nanaia” continua possível como transliteração alternativa.
- source_word: προσελθόντος
  choice: chegou
  rationale: O particípio de προσέρχομαι indica aproximação ou chegada. Com εἰς e o recinto como destino, “chegou ... ao recinto” comunica naturalmente o movimento sem confundi-lo com o εἰσῆλθεν posterior.
- source_word: μετʼ ὀλίγων
  choice: com poucos homens
  rationale: O grego omite o substantivo, mas refere-se a um pequeno número de acompanhantes. “Homens” explicita em português o elemento naturalmente subentendido.
- source_word: περίβολον
  choice: recinto
  rationale: περίβολος designa uma área delimitada ao redor ou dentro de um local sagrado. “Recinto” é claro e não impõe a configuração arquitetônica mais específica de “pátio”.
- source_word: τέμενος
  choice: santuário
  rationale: τέμενος designa um espaço consagrado ou recinto sagrado. “Santuário” mantém o sentido cultual e permite distingui-lo de ἱερόν na oração seguinte.
- source_word: συγκλείσαντες
  choice: fecharam
  rationale: O particípio indica fechar completamente. “Fecharam” é natural e não acrescenta um mecanismo, como faria “trancaram”.
- source_word: ἱερόν
  choice: templo
  rationale: ἱερόν pode designar o templo ou área sagrada. “Templo” evita a repetição de “santuário” e preserva a distinção lexical presente no grego.
- source_word: ὡς εἰσῆλθεν Ἀντίοχος
  choice: assim que Antíoco entrou
  rationale: ὡς com o aoristo tem valor temporal neste contexto. “Assim que” expressa a imediatidade com que o templo foi fechado após a entrada de Antíoco.
