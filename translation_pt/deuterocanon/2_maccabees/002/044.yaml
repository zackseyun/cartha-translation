  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A estrutura permanece aberta, pois o versículo é parte de uma oração que continua no contexto seguinte. Os marcadores foram posicionados imediatamente após os termos a que se referem.
