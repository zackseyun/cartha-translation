base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/044.yaml
  text: But God[a], who saved all his people and gave his inheritance to all, and the kingship, and the priesthood, and the sanctification[c][b],
translation:
  language: pt
  text: Mas Deus, que salvou todo o seu povo e restituiu a todos a sua herança[a], a realeza[b], o sacerdócio e a santificação[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deu a todos a sua herança”. O verbo grego pode significar dar, devolver ou restituir.
    reason: lexical_alternative
  - marker: b
    text: Ou “o reino”. O termo grego pode indicar a autoridade ou dignidade régia, bem como um reino.
    reason: lexical_alternative
  - marker: c
    text: Ou “a consagração” ou “a santidade”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ θεός
  choice: Mas Deus
  rationale: δέ liga esta oração ao contexto anterior e pode ter valor continuativo ou levemente contrastivo; “Mas Deus” preserva essa força com naturalidade.
- source_word: ὁ σώσας
  choice: que salvou
  rationale: O particípio aoristo apresenta a ação salvadora de Deus como realizada; a oração relativa é natural em português.
- source_word: τὸν πάντα λαὸν αὐτοῦ
  choice: todo o seu povo
  rationale: A construção designa coletivamente a totalidade do povo de Deus.
- source_word: ἀποδοὺς
  choice: restituiu
  rationale: ἀποδίδωμι pode significar dar, devolver ou restituir. Neste contexto de recuperação dos privilégios do povo, “restituiu” expressa adequadamente o valor do composto, sem esconder na nota a alternativa mais ampla.
- source_word: τὴν κληρονομίαν αὐτοῦ
  choice: a sua herança
  rationale: Mantém o pronome singular grego e sua referência gramatical mais direta a Deus, sem substituí-lo interpretativamente por “a herança deles”.
- source_word: πᾶσιν
  choice: a todos
  rationale: Preserva a forma distributiva concisa, referindo-se naturalmente a todo o povo mencionado antes.
- source_word: τὸ βασίλειον
  choice: a realeza
  rationale: No paralelo com sacerdócio e santificação, “realeza” comunica poder, dignidade ou instituição régia sem limitar o termo a um território.
- source_word: τὸ ἱεράτευμα
  choice: o sacerdócio
  rationale: Equivalente corrente e digno para a instituição ou função sacerdotal.
- source_word: τὸν ἁγιασμόν
  choice: a santificação
  rationale: Preserva o substantivo abstrato e seu peso cultual e teológico; “consagração” e “santidade” continuam possíveis.
theological_decisions:
- issue: Referência do possessivo em “a sua herança”
  choice: Manter o singular “sua”, com referência gramatical mais direta a Deus.
  alternative: Interpretar contextualmente como “a herança deles”, referindo-se ao povo.
  rationale: O grego αὐτοῦ remete de modo mais direto a θεός. A tradução conserva a forma e a tensão da expressão, em vez de resolver a referência por paráfrase.
- issue: Sentido de βασίλειον
  choice: realeza
  alternative: reino
  rationale: “Realeza” preserva a possibilidade de poder, dignidade ou ofício régio no paralelo institucional com sacerdócio, enquanto “reino” pode sugerir sobretudo um domínio territorial.
- issue: Sentido de ἁγιασμός
  choice: santificação
  alternative: consagração ou santidade
  rationale: O termo pode indicar processo, estado santo ou consagração cultual. “Santificação” mantém a amplitude teológica, e a nota registra as alternativas genuínas.
