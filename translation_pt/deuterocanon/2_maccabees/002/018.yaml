base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/018.yaml
  text: Gather our dispersion, free those who are enslaved among the nations, look upon those who are despised and abhorred; and let the nations know that you are our God.
translation:
  language: pt
  text: Reúne os nossos dispersos[a], liberta os que estão escravizados entre as nações, olha para os desprezados e abominados[b]; e que as nações saibam que tu és o nosso Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a nossa dispersão”. O grego usa um substantivo abstrato para designar a comunidade dispersa.
    reason: lexical_alternative
  - marker: b
    text: Ou “leva em consideração” ou “tem compaixão dos”. O grego pede que Deus volte sua atenção para os que são desprezados e abominados.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνάγαγε
  choice: Reúne
  rationale: O imperativo aoristo pede que Deus torne a ajuntar os membros dispersos do povo; “reúne” é direto, natural e mantém a força da súplica.
- source_word: τὴν διασπορὰν ἡμῶν
  choice: os nossos dispersos
  rationale: Embora o grego use literalmente o substantivo abstrato “nossa dispersão”, ele designa coletivamente a comunidade espalhada. “Os nossos dispersos” comunica esse sentido em português natural, sem restringi-lo a exilados formais.
- source_word: ἐλευθέρωσον
  choice: liberta
  rationale: O verbo significa tornar livre ou soltar; “liberta” preserva claramente o sentido de libertação e a forma imperativa.
- source_word: τοὺς δουλεύοντας
  choice: os que estão escravizados
  rationale: Neste contexto, δουλεύω descreve sujeição entre povos estrangeiros, não serviço voluntário. A formulação ressalta a condição imposta sem necessariamente definir a modalidade jurídica.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: entre as nações
  rationale: Refere-se aos povos entre os quais Israel está disperso; “nações” é natural e evita a carga interpretativa de “gentios”.
- source_word: τοὺς ἐξουθενημένους
  choice: os desprezados
  rationale: O particípio caracteriza pessoas tratadas como sem valor; “desprezados” expressa de modo conciso esse menosprezo social.
- source_word: καὶ βδελυκτοὺς
  choice: e abominados
  rationale: 'O adjetivo descreve pessoas consideradas repulsivas ou detestáveis. “Abominados” conserva a intensidade e, no contexto, funciona passivamente: aqueles que outros abominam.'
- source_word: ἔφιδε
  choice: olha para
  rationale: O imperativo pede que Deus volte sua atenção para essas pessoas. “Olha para” é corrente, digno e não torna explícita uma ideia de piedade que está apenas implícita.
- source_word: γνώτωσαν
  choice: que ... saibam
  rationale: A construção mantém a força jussiva do imperativo na terceira pessoa e o tom de petição.
- source_word: ὅτι σὺ ὁ θεὸς ἡμῶν
  choice: que tu és o nosso Deus
  rationale: Tradução natural da confissão relacional e pactual, preservando a ênfase expressa no pronome grego σὺ.
theological_decisions:
- issue: Sentido de δουλεύοντας em contexto de sujeição entre nações estrangeiras
  choice: os que estão escravizados
  alternative: os que servem
  rationale: O contexto de opressão e o pedido por libertação indicam sujeição, não serviço voluntário; a tradução mantém saliente a falta de liberdade.
- issue: Forma de representar o substantivo coletivo διασπορά
  choice: os nossos dispersos
  alternative: a nossa dispersão
  rationale: O grego emprega um substantivo abstrato para a comunidade dispersa. A opção escolhida explicita o referente humano em português idiomático, enquanto a nota preserva a forma literal e a ambiguidade lexical.
- issue: Força de ἔφιδε
  choice: olha para
  alternative: tem compaixão de
  rationale: A forma escolhida mantém o pedido para que Deus dirija sua atenção aos oprimidos, sem converter em afirmação explícita de compaixão aquilo que o verbo apenas sugere no contexto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Empregou-se “tu” para conservar a oração direta e a ênfase do grego; evitaram-se arcaísmos e terminologia denominacional.
