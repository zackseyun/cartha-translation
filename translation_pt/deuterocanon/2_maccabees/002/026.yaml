  text: And for us[a], who have undertaken the hardship of making the abridgment, the task is not easy, but a matter of sweat and sleeplessness;
translation:
  language: pt
  text: Para nós, que assumimos o trabalho penoso de preparar uma versão abreviada[a], a tarefa não é fácil, mas exige suor e noites sem dormir;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de preparar uma abreviação”. O termo grego designa a condensação de uma obra mais extensa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμῖν ... τοῖς
  choice: Para nós, que
  rationale: A construção dativa com artigo e particípio identifica os autores como aqueles que se dedicaram ao trabalho; esta formulação é natural em português e preserva a autorreferência.
- source_word: τὴν κακοπάθειαν
  choice: o trabalho penoso
  rationale: κακοπάθεια comunica sofrimento, dificuldade ou labuta. No contexto de um prefácio literário, a expressão indica o esforço árduo da atividade editorial, sem sugerir necessariamente perseguição ou aflição externa.
- source_word: ἐπιδεδιγμένοις
  choice: assumimos
  rationale: O particípio perfeito médio indica que os autores tomaram sobre si a tarefa e continuam comprometidos com ela. “Assumimos” expressa de modo conciso esse compromisso.
- source_word: τῆς ἐπιτομῆς
  choice: de fazer este resumo
  rationale: ἐπιτομή designa uma obra condensada ou abreviada. “Resumo” é corrente e inteligível; “fazer” explicita naturalmente que se trata da produção dessa condensação.
- source_word: οὐ ῥᾴδιον
  choice: a tarefa não é fácil
  rationale: A formulação reproduz de modo direto a afirmação grega, suprindo em português o referente nominal implícito na construção.
- source_word: ἱδρῶτος ... καὶ ἀγρυπνίας
  choice: exige suor e noites sem dormir
  rationale: A expressão conserva a imagem concreta do suor e da privação de sono, ao mesmo tempo que verte naturalmente os genitivos que caracterizam o custo da tarefa.
- source_word: τὸ πρᾶγμα
  choice: a tarefa
  rationale: πρᾶγμα se refere aqui ao empreendimento editorial em questão. “Tarefa” é preciso e idiomático no contexto.
