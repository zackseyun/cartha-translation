base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/040.yaml
  text: The same things were also related in the records and in the memoirs concerning Nehemiah[a], and how, in founding a library, he gathered together the books about the kings and prophets, and the writings of David[b], and letters of kings concerning votive offerings.
translation:
  language: pt
  text: Essas mesmas coisas também eram narradas nos registros e nas memórias referentes a Neemias, inclusive como ele, ao fundar uma biblioteca[a], reuniu os livros sobre os reis e os profetas, os escritos de Davi e cartas de reis a respeito de ofertas votivas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao estabelecer uma biblioteca”. O particípio grego pode indicar o ato de fundar ou organizar a biblioteca.
    reason: lexical_alternative
  - marker: b
    text: “Ofertas votivas” são dádivas dedicadas a Deus. A expressão também pode ser traduzida como “ofertas dedicadas” ou “coisas consagradas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξηγοῦντο
  choice: eram narradas
  rationale: O imperfeito apresenta o conteúdo que os documentos relatavam. “Eram narradas” preserva o sentido documental sem restringir o verbo à ideia de explicação.
- source_word: ἀναγραφαῖς
  choice: registros
  rationale: Designa registros escritos ou entradas documentais; “registros” é claro e adequado ao contexto.
- source_word: ὑπομνηματισμοῖς
  choice: memórias
  rationale: Refere-se provavelmente a escritos memoriais ou de recordação, e não necessariamente a comentários formais.
- source_word: τοῖς κατὰ τὸν Νεεμίαν
  choice: referentes a Neemias
  rationale: Expressa relação com Neemias sem afirmar indevidamente que ele próprio tenha escrito esses textos.
- source_word: καταβαλλόμενος
  choice: ao fundar
  rationale: No contexto de βιβλιοθήκην, o particípio indica estabelecer ou lançar a base de uma biblioteca, não uma ação física de derrubar.
- source_word: βιβλιοθήκην
  choice: uma biblioteca
  rationale: É o equivalente direto e natural para uma coleção organizada de livros ou escritos.
- source_word: ἐπισυνήγαγεν
  choice: reuniu
  rationale: Transmite a ação de juntar materiais em uma coleção; o português não precisa acrescentar “juntos” para conservar o sentido.
- source_word: τὰ περὶ τῶν βασιλέων καὶ προφητῶν βιβλία
  choice: os livros sobre os reis e os profetas
  rationale: Mantém o valor mais direto de περὶ, evitando afirmar que os livros tenham sido escritos pelos reis e profetas.
- source_word: τὰ τοῦ Δαυείδ
  choice: os escritos de Davi
  rationale: Explicita de maneira discreta a expressão grega elíptica, sem limitá-la especificamente aos salmos.
- source_word: ἐπιστολὰς βασιλέων
  choice: cartas de reis
  rationale: Reproduz naturalmente o genitivo grego e deixa aberta a relação precisa entre os reis e as cartas.
- source_word: περὶ ἀναθεμάτων
  choice: a respeito de ofertas votivas
  rationale: No contexto histórico e cultual, refere-se a objetos ou ofertas dedicados a Deus, e não ao sentido eclesiástico posterior de “anátema”.
theological_decisions:
- issue: Sentido de ἀναθεμάτων
  choice: ofertas votivas
  alternative: ofertas dedicadas; coisas consagradas
  rationale: A expressão indica dádivas dedicadas a Deus, provavelmente relacionadas ao templo. “Ofertas votivas” conserva o caráter religioso da dedicação e evita o sentido posterior e inadequado de condenação associado a “anátema”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o caráter documental do trecho, explicita apenas a elipse necessária em “os escritos de Davi” e posiciona cada nota junto à expressão que ela esclarece.
