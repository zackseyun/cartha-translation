base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/027.yaml
  text: Just as it is not easy for one who prepares a banquet and seeks the advantage of others[a], yet for the gratitude of the many we will gladly endure the hardship;
translation:
  language: pt
  text: Assim como não é fácil para quem prepara um banquete e procura o benefício dos outros, ainda assim, por causa da gratidão de muitos[a], suportaremos de bom grado a dificuldade;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do agradecimento de muitos”. Aqui, o termo grego significa gratidão ou ação de graças, não o termo litúrgico posterior “Eucaristia”.
    reason: Esclarece a alternativa lexical e evita uma leitura teológica anacrônica.
lexical_decisions:
- source_word: καθάπερ
  choice: Assim como
  rationale: Preserva a força comparativa que liga esta afirmação ao contexto anterior.
- source_word: τῷ παρασκευάζοντι συμπόσιον
  choice: para quem prepara um banquete
  rationale: Expressa naturalmente em português o dativo da pessoa para quem a tarefa não é fácil; “banquete” comunica uma refeição festiva preparada para convidados.
- source_word: ζητοῦντι τὴν ἑτέρων λυσιτέλειαν
  choice: e procura o benefício dos outros
  rationale: Mantém o paralelismo dos particípios e traduz λυσιτέλεια como utilidade ou proveito destinado a outras pessoas, sem especificar além do grego.
- source_word: οὐκ εὐχερές
  choice: não é fácil
  rationale: Equivalente direto e corrente da expressão impessoal grega.
- source_word: ὅμως
  choice: ainda assim
  rationale: Marca com clareza a concessão entre a dificuldade reconhecida e a disposição de suportá-la.
- source_word: διὰ τὴν τῶν πολλῶν εὐχαριστίαν
  choice: por causa da gratidão de muitos
  rationale: O διά com acusativo indica causa; εὐχαριστία tem aqui o sentido comum de gratidão ou agradecimento, e οἱ πολλοί é preservado como “muitos”.
- source_word: ἡδέως
  choice: de bom grado
  rationale: Comunica disposição voluntária e positiva diante do esforço.
- source_word: τὴν κακοπάθειαν ὑποίσομεν
  choice: suportaremos ... esse trabalho árduo
  rationale: κακοπάθεια designa sofrimento, fadiga ou esforço penoso; no contexto do trabalho literário, “trabalho árduo” é claro sem sugerir necessariamente sofrimento físico. O demonstrativo torna natural a retomada desse esforço em português.
theological_decisions:
- issue: Sentido de εὐχαριστία
  choice: gratidão
  alternative: Eucaristia
  rationale: Neste contexto judaico helenístico, o termo conserva seu sentido comum de gratidão ou agradecimento. “Eucaristia” importaria um sentido litúrgico cristão posterior que o texto não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a comparação e a concessão do grego; o ponto e vírgula preserva a continuidade sintática com o contexto.
