  text: And Moses said[a], “Because it was not eaten, the sin offering was consumed.”
translation:
  language: pt
  text: 'E Moisés disse: “Por não ter sido comida, a oferta pelo pecado[a] foi consumida.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “a coisa referente ao pecado”. A expressão grega é um idiomatismo bíblico comum para uma oferta pelo pecado.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν Μωυσῆς
  choice: E Moisés disse
  rationale: Preserva o conectivo simples καί e a introdução narrativa sem acrescentar uma sequência mais específica.
- source_word: Διὰ τὸ μὴ βεβρῶσθαι
  choice: Por não ter sido comida
  rationale: A construção de διά com infinitivo articular expressa causa. O infinitivo perfeito passivo βεβρῶσθαι é traduzido de modo natural, preservando tanto a passividade quanto o aspecto anterior da ação.
- source_word: τὸ περὶ τῆς ἁμαρτίας
  choice: a oferta pelo pecado
  rationale: A expressão é um conhecido idiomatismo sacrificial da Septuaginta. Esta formulação comunica claramente o referente cultual em português sem recorrer a um literalismo obscuro.
- source_word: ἀνηλώθη
  choice: foi consumida
  rationale: O passivo de ἀναλίσκω pode significar ser consumido, gasto ou destruído. “Foi consumida” é natural no contexto sacrificial e não especifica indevidamente o modo da consumição.
theological_decisions:
- issue: Sentido cultual de τὸ περὶ τῆς ἁμαρτίας
  choice: a oferta pelo pecado
  alternative: a coisa referente ao pecado
  rationale: O grego emprega uma expressão bíblica convencional para a oferta pelo pecado. A tradução escolhida torna explícito o referente sacrificial reconhecido, sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a concisão e a relação causal do grego; o marcador da nota foi colocado junto à expressão lexical que ela esclarece.
