  text: Having been saved by God from great dangers[a], we give him great thanks, as if arrayed against a king.
translation:
  language: pt
  text: Tendo sido salvos por Deus de grandes perigos, muito lhe agradecemos, como se estivéssemos em ordem de batalha contra um rei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como se estivéssemos dispostos em ordem de batalha contra um rei”. A comparação final em grego é condensada e pode ser traduzida com pequenas diferenças de nuance militar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ μεγάλων κινδύνων
  choice: de grandes perigos
  rationale: Preserva a ideia de livramento para fora de perigos graves, o plural e a intensidade de μεγάλων, em português claro e atual.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: por Deus
  rationale: A construção ὑπό com genitivo indica Deus como agente do salvamento.
- source_word: σεσωσμένοι
  choice: tendo sido salvos
  rationale: Reproduz o particípio perfeito passivo, apresentando o salvamento como ato realizado cujos efeitos permanecem.
- source_word: μεγάλως εὐχαριστοῦμεν αὐτῷ
  choice: muito lhe agradecemos
  rationale: Expressa naturalmente a forte intensificação de μεγάλως e conserva αὐτῷ como objeto indireto.
- source_word: ὡς ἂν
  choice: como se estivéssemos
  rationale: Introduz de maneira idiomática a comparação de caráter potencial ou figurado, sem transformá-la numa afirmação literal.
- source_word: πρὸς βασιλέα παρατασσόμενοι
  choice: em formação de batalha contra um rei
  rationale: Παρατάσσω pertence ao campo militar de dispor tropas em linha de batalha; com esse verbo, πρός assume naturalmente sentido adversativo.
theological_decisions:
- issue: Sentido da comparação militar na oração final
  choice: como se estivéssemos em formação de batalha contra um rei
  alternative: como que alinhados diante de um rei; como se estivéssemos dispostos para combater um rei
  rationale: A tradução principal mantém a imagem militar e o provável valor adversativo de πρός, mas a nota reconhece que a construção grega é condensada e admite pequenas variações de nuance.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o particípio perfeito e a comparação militar sem explicá-la além do texto.
