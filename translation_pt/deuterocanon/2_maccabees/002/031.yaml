  text: But one should allow the one producing the epitome to aim at brevity of expression and to forgo the elaborate treatment of the subject matter[a].
translation:
  language: pt
  text: Mas deve-se permitir que aquele que prepara o resumo busque a concisão da linguagem e dispense a elaboração minuciosa do assunto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aquele que faz a abreviação”. O termo grego também pode significar “tradução”, mas, neste contexto, refere-se à condensação de uma obra mais extensa.
    reason: lexical_alternative
lexical_decisions:
- source_word: σύντομον
  choice: concisão
  rationale: O adjetivo substantivado expressa brevidade ou concisão; “concisão” forma um contraste natural com a elaboração minuciosa.
- source_word: τῆς λέξεως
  choice: da linguagem
  rationale: λέξις se refere aqui ao modo de expressão ou estilo, não a uma palavra isolada.
- source_word: μεταδιώκειν
  choice: busque
  rationale: O verbo indica perseguir ou procurar alcançar algo; “busque” preserva esse sentido de propósito em português corrente.
- source_word: ἐξεργαστικόν
  choice: elaboração minuciosa
  rationale: O termo designa o desenvolvimento cuidadoso e detalhado da matéria.
- source_word: τῆς πραγματίας
  choice: do assunto
  rationale: πραγματεία indica a matéria ou o tema tratado na obra; “assunto” é claro e suficientemente abrangente.
- source_word: παραιτεῖσθαι
  choice: dispense
  rationale: Neste contexto, o verbo exprime abrir mão de algo ou deixar de realizá-lo; “dispense” comunica isso com naturalidade.
- source_word: τῷ τὴν μετάφρασιν ποιουμένῳ
  choice: aquele que prepara o resumo
  rationale: Embora μετάφρασις possa significar “tradução”, o prólogo descreve a condensação da obra de cinco volumes de Jasão de Cirene; “prepara o resumo” expressa essa função literária sem impor terminologia técnica.
- source_word: συγχωρητέον
  choice: deve-se permitir
  rationale: O adjetivo verbal impessoal indica aquilo que deve ser concedido ou admitido; a formulação preserva seu caráter exortativo.
theological_decisions:
- issue: Sentido de μετάφρασις no contexto
  choice: resumo ou abreviação
  alternative: tradução
  rationale: O contexto do prólogo apresenta esta obra como condensação de uma narrativa mais extensa, favorecendo o sentido de resumo. A nota conserva o sentido lexical alternativo sem confundir a situação literária descrita.
translation_notes:
  register: Português moderno, claro e digno, com construção impessoal natural. “Concisão da linguagem” mantém o caráter literário da frase, e “elaboração minuciosa” preserva o contraste entre brevidade e desenvolvimento detalhado.
