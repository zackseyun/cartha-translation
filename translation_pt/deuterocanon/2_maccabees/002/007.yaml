  text: After opening the secret door in the ceiling[a], they threw stones and struck down the leader, and after cutting them into pieces[c][b], they threw the heads to those outside.
translation:
  language: pt
  text: Depois de abrirem a porta oculta no teto[a], atiraram pedras e abateram violentamente o governante[b]. Depois de o esquartejarem, lançaram as cabeças aos que estavam do lado de fora[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra grega aqui traduzida por “teto” é rara e de sentido incerto; pode indicar um teto apainelado ou um espaço superior junto ao teto.
    reason: lexical_alternative
  - marker: b
    text: O verbo grego é raro e muito forte, evocando um golpe esmagador, como o de um raio.
    reason: lexical_alternative
  - marker: c
    text: O grego diz “as cabeças”, no plural, embora antes mencione apenas um governante. A formulação pode refletir uma irregularidade textual ou narrativa; a tradução conserva o plural da fonte.
    reason: textual_variant
lexical_decisions:
- source_word: ἀνοίξαντες
  choice: depois de abrirem
  rationale: O particípio aoristo indica uma ação anterior às ações principais; a construção temporal é natural em português.
- source_word: κρυπτὴν θύραν
  choice: a porta oculta
  rationale: κρυπτήν descreve algo escondido ou encoberto; “oculta” mantém esse sentido sem sugerir necessariamente uma passagem secreta construída para esse fim.
- source_word: τοῦ φατινώματος
  choice: no teto
  rationale: O substantivo é raro e provavelmente designa o teto, possivelmente um teto apainelado ou um espaço superior ligado a ele. “No teto” é claro no contexto e a incerteza é registrada em nota.
- source_word: βάλλοντες πέτρους
  choice: atiraram pedras
  rationale: Expressa de modo direto e corrente o meio pelo qual atacaram o governante.
- source_word: συνεκεραύνωσαν
  choice: abateram violentamente
  rationale: O verbo raro e enfático evoca um golpe devastador, como um raio. A tradução comunica o resultado e a violência sem recorrer ao potencialmente ambíguo “fulminaram”.
- source_word: τὸν ἡγεμόνα
  choice: o governante
  rationale: ἡγεμών pode indicar governante, governador, comandante ou líder. “Governante” conserva o caráter oficial sem especificar um cargo que o grego não define aqui.
- source_word: μέλη ποιήσαντες
  choice: depois de o esquartejarem
  rationale: A expressão literalmente ligada a “fazer membros/pedaços” descreve o desmembramento. O pronome retoma naturalmente o governante singular mencionado antes.
- source_word: τὰς κεφαλάς
  choice: as cabeças
  rationale: Mantém deliberadamente o plural do texto grego, embora ele seja difícil depois da referência singular ao governante.
- source_word: τοῖς ἔξω
  choice: aos que estavam do lado de fora
  rationale: O artigo substantiva a expressão e indica pessoas que se encontravam fora, não apenas uma direção ou lugar.
