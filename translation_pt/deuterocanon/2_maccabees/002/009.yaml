base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/009.yaml
  text: Since we are about to celebrate the purification of the temple on the twenty-fifth of Chislev[a], we thought it necessary to make this clear to you, so that you also may celebrate the festival of booths and of the fire, when Nehemiah, who built the temple and the altar[c][b], offered sacrifices.
translation:
  language: pt
  text: Como estamos para celebrar, no dia vinte e cinco de quisleu[a], a purificação do templo, julgamos necessário explicar isso claramente a vocês, para que também celebrem a Festa das Tendas[b] e a do fogo[c], quando Neemias, que construiu o templo e o altar[d], ofereceu sacrifícios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Quisleu é um mês do calendário judaico, correspondente aproximadamente a novembro/dezembro.
    reason: cultural_note
  - marker: b
    text: Ou “Festa das Cabanas”; tradicionalmente, “Tabernáculos”.
    reason: lexical_alternative
  - marker: c
    text: A expressão “a do fogo” é elíptica no grego e parece se referir à comemoração ligada à oferta de Neemias e ao relato do fogo no contexto seguinte.
    reason: cultural_note
  - marker: d
    text: 'Grego: “construiu”. O contexto histórico pode ser entendido como “reconstruiu”, mas o texto não explicita essa ideia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μέλλοντες ἄγειν
  choice: Como estamos para celebrar
  rationale: ἄγω, tendo uma celebração por objeto, significa “celebrar” ou “observar”; μέλλοντες indica que a ocasião está próxima.
- source_word: ἐν τῷ Χασελεὺ πέμπτῃ καὶ εἰκάδι
  choice: no dia vinte e cinco de quisleu
  rationale: A expressão dá a data, o vigésimo quinto dia do mês judaico de quisleu, em ordem natural no português.
- source_word: τὸν καθαρισμὸν τοῦ ἱεροῦ
  choice: a purificação do templo
  rationale: καθαρισμός denota purificação ou limpeza ritual, e ἱερόν se refere aqui ao templo ou santuário.
- source_word: δέον ἡγησάμεθα διασαφῆσαι ὑμῖν
  choice: julgamos necessário explicar isso claramente a vocês
  rationale: A construção expressa um juízo de necessidade, enquanto διασαφῆσαι comunica a ideia de explicar ou tornar claro.
- source_word: ἵνα καὶ αὐτοὶ ἄγητε
  choice: para que também celebrem
  rationale: Mantém o sentido festivo de ἄγω e representa καὶ αὐτοί sem a ênfase artificial que “vocês mesmos também” produziria em português.
- source_word: σκηνοπηγίας
  choice: a Festa das Tendas
  rationale: σκηνοπηγία é o nome da festa judaica das cabanas ou tendas. “Festa das Tendas” comunica o significado em linguagem clara e digna.
- source_word: καὶ τοῦ πυρός
  choice: e a do fogo
  rationale: O grego traz uma expressão genitiva elíptica, coordenada com a referência à festa. “A do fogo” fornece apenas o mínimo necessário à gramática portuguesa, sem definir a natureza precisa da comemoração.
- source_word: ὅτε Νεεμίας
  choice: quando Neemias
  rationale: Traduz diretamente a conjunção temporal ὅτε e preserva a ligação um tanto condensada com a celebração mencionada.
- source_word: ὁ οἰκοδομήσας τό τε ἱερὸν καὶ τὸ θυσιαστήριον
  choice: que construiu o templo e o altar
  rationale: οἰκοδομέω significa “construir”. Embora o contexto histórico possa sugerir reconstrução, o verbo grego não explicita o prefixo “re-”.
- source_word: ἀνήνεγκεν θυσίας
  choice: ofereceu sacrifícios
  rationale: Em contexto sacrificial, ἀναφέρω significa oferecer ou apresentar sacrifícios.
theological_decisions:
- issue: Designação de σκηνοπηγίας
  choice: a Festa das Tendas
  alternative: a Festa das Cabanas; Tabernáculos
  rationale: A opção traduz o sentido do nome da festa e evita depender de terminologia eclesiástica tradicional, sem alterar sua identidade judaica.
- issue: Sentido da expressão elíptica καὶ τοῦ πυρός
  choice: e a do fogo
  alternative: e a festa do fogo; e do fogo
  rationale: A formulação grega é condensada e sua relação exata com o relato seguinte não é explicitada. A tradução preserva essa tensão, acrescentando somente o artigo necessário para uma leitura natural em português.
- issue: Construção ou reconstrução por Neemias
  choice: construiu
  alternative: reconstruiu
  rationale: O contexto histórico pode levar o leitor a entender reconstrução, mas o texto-fonte emprega simplesmente οἰκοδομέω, “construir”; a tradução não introduz uma especificação ausente.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe conserva a longa conexão lógica do grego, mas usa pontuação e formulações naturais. “Quisleu” segue a forma portuguesa corrente; “Festa das Tendas” traduz o nome da celebração. A elipse referente ao fogo e a possível nuance histórica de “reconstruiu” permanecem sem resolução indevida no texto principal.
