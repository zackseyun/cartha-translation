lexical_decisions:
- source_word: καταφύτευσον
  choice: Planta
  rationale: O aoristo imperativo de καταφυτεύω expressa uma ordem ou súplica pontual e conserva a metáfora de plantar firmemente; «estabelece» seria possível, mas apagaria a imagem.
- source_word: τὸν λαόν σου
  choice: o teu povo
  rationale: λαός designa coletivamente um povo e, com frequência, tem ressonância de pertencimento pactual; «o teu povo» é natural e fiel.
- source_word: εἰς τὸν τόπον τὸν ἅγιόν σου
  choice: no teu lugar santo
  rationale: Embora εἰς costume indicar movimento para dentro, com o verbo de plantar a formulação portuguesa «plantar no» é mais natural. τόπος significa «lugar», e traduzi-lo por «terra» acrescentaria uma especificidade ausente do grego.
- source_word: καθὼς εἶπεν
  choice: assim como ... disse
  rationale: Reproduz de modo claro a comparação introduzida por καθώς e o aoristo de λέγω, sem intensificar o verbo.
- source_word: Μωσῆς
  choice: Moisés
  rationale: Forma portuguesa consagrada do nome próprio grego Μωσῆς.
theological_decisions:
- issue: Integridade do texto-fonte e incompatibilidade contextual
  choice: Traduzir diretamente a oração grega fornecida como uma petição independente.
  alternative: Reconstruir outro texto para 2 Macabeus 2:20 com base no contexto ou em edições secundárias.
  rationale: A cláusula grega fornecida não corresponde ao contexto esperado de 2 Macabeus 2:20. Para respeitar a primazia do texto-fonte indicado e preservar a incerteza, a tradução segue a redação grega existente e registra a incompatibilidade em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a metáfora concreta de «plantar» e usa-se «teu» para conservar o tom de oração sem recorrer a linguagem arcaizante. Os marcadores seguem ordem de aparecimento no texto.
