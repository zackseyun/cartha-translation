  text: And after enclosing it[a], the king made it a sanctuary[c][b], having tested the matter.
translation:
  language: pt
  text: Depois de cercá-lo[a], o rei fez dele um santuário[b], depois de examinar a questão.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depois de rodeá-lo com uma cerca” ou “depois de fortificá-lo”; o particípio grego pode indicar que o lugar foi cercado para proteção.
    reason: lexical_alternative
  - marker: b
    text: Ou “um templo” ou “um lugar sagrado”; o grego ἱερόν pode referir-se, de modo amplo, a um recinto sagrado.
    reason: lexical_alternative
  - marker: c
    text: A fonte grega fornecida para este versículo está assinalada com incerteza de validação (“grande divergência”). Esta tradução segue diretamente o texto grego apresentado, mas ele deve ser conferido em edições críticas.
    reason: textual_variant
lexical_decisions:
- source_word: περιφράξας
  choice: depois de cercá-lo
  rationale: Expressa a sequência do particípio aoristo e a ideia de rodear ou fechar para proteção, sem especificar se foi usada cerca, muralha ou fortificação.
- source_word: ἱερὸν
  choice: um santuário
  rationale: Ἱερόν pode designar um lugar ou recinto sagrado; “santuário” preserva essa amplitude sem identificar necessariamente um templo específico.
- source_word: ἐποίησεν
  choice: fez dele
  rationale: Mantém a amplitude de ποιέω, deixando em aberto se o rei construiu, estabeleceu ou destinou o lugar como santuário.
- source_word: δοκιμάσας
  choice: depois de examinar
  rationale: Δοκιμάζω pode significar testar, examinar ou verificar. “Examinar” soa natural neste contexto e não afirma de modo indevido que houve aprovação.
- source_word: τὸ πρᾶγμα
  choice: a questão
  rationale: Preserva a referência ampla de πρᾶγμα e oferece uma formulação idiomática em português.
