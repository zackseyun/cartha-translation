lexical_decisions:
- source_word: περιφράξας
  choice: depois de cercá-lo
  rationale: Expressa a sequência do particípio aoristo e a ideia de rodear ou fechar para proteção, sem especificar se foi usada cerca, muralha ou fortificação.
- source_word: ἱερὸν
  choice: um santuário
  rationale: Ἱερόν pode designar um lugar ou recinto sagrado; “santuário” preserva essa amplitude sem identificar necessariamente um templo específico.
- source_word: ἐποίησεν
  choice: fez dele
  rationale: Mantém a amplitude de ποιέω, deixando em aberto se o rei construiu, estabeleceu ou destinou o lugar como santuário.
- source_word: δοκιμάσας
  choice: depois de examinar
  rationale: Δοκιμάζω pode significar testar, examinar ou verificar. “Examinar” soa natural neste contexto e não afirma de modo indevido que houve aprovação.
- source_word: τὸ πρᾶγμα
  choice: a questão
  rationale: Preserva a referência ampla de πρᾶγμα e oferece uma formulação idiomática em português.
