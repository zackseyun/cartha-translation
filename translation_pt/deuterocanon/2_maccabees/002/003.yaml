lexical_decisions:
- source_word: αὐτὸς
  choice: ele mesmo
  rationale: Preserva a ênfase explícita do pronome grego.
- source_word: γὰρ
  choice: pois
  rationale: Mantém a função explicativa ou justificativa da conjunção no encadeamento do texto.
- source_word: ἐξέβρασεν
  choice: expulsou
  rationale: Expressa a ideia de remoção forçada de modo natural e digno em português.
- source_word: τοὺς παρατασσομένους
  choice: os que estavam dispostos em ordem de batalha
  rationale: Conserva o sentido militar do particípio de παρατάσσω sem reduzi-lo genericamente a adversários ou combatentes.
- source_word: ἐν τῇ ἁγίᾳ πόλει
  choice: na cidade santa
  rationale: Traduz diretamente a designação do texto, sem substituí-la pelo nome Jerusalém.
- source_word: εἰς τὴν Περσίδα
  choice: para a Pérsia
  rationale: Indica o destino do movimento de maneira idiomática em português; a posição do complemento junto a 'expulsou' evita sugerir que 'na cidade santa' modifique o destino.
