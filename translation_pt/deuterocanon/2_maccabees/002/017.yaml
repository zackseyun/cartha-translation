  text: Accept the sacrifice for all your people Israel[b][a], and preserve your portion and sanctify it.
translation:
  language: pt
  text: Aceita o sacrifício em favor de todo o teu povo de Israel[a]; preserva a tua porção[b] e santifica-a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Recebe a oferta em favor de todo o teu povo, Israel.”'
    reason: Alternativa lexical e sintática que reproduz mais diretamente a aposição grega e traduz πρόσδεξαι por “recebe” e θυσίαν por “oferta”.
  - marker: b
    text: “Tua porção” provavelmente se refere a Israel como o povo que pertence a Deus; outra tradução possível é “tua herança”.
    reason: A metáfora de μερίδα admite ressonância pactual, mas o grego não resolve explicitamente o referente.
lexical_decisions:
- source_word: πρόσδεξαι
  choice: Aceita
  rationale: O imperativo, em contexto de oração, pede que Deus acolha favoravelmente o sacrifício. “Aceita” expressa com naturalidade esse sentido cultual.
- source_word: θυσίαν
  choice: o sacrifício
  rationale: θυσία designa uma oferta sacrificial; “sacrifício” conserva a especificidade cultual do termo.
- source_word: ὑπὲρ παντὸς τοῦ λαοῦ σου Ἰσραήλ
  choice: em favor de todo o teu povo de Israel
  rationale: ὑπέρ com o genitivo indica benefício ou representação. A formulação portuguesa é clara e mantém a abrangência de παντός, embora “Israel” no grego esteja em aposição a “teu povo”.
- source_word: διαφύλαξον
  choice: preserva
  rationale: O verbo significa guardar, proteger ou conservar em segurança. “Preserva” se ajusta ao registro de oração.
- source_word: τὴν μερίδα σου
  choice: a tua porção
  rationale: μερίδα significa literalmente porção ou parte. A escolha mantém a metáfora bíblica sem identificar explicitamente seu referente como “herança” ou “povo”.
- source_word: καθαγίασον
  choice: santifica-a
  rationale: O verbo significa tornar santo ou consagrar. O pronome feminino retoma naturalmente “a tua porção”, objeto singular da oração anterior.
theological_decisions:
- issue: Referente de “a tua porção”
  choice: Manter a metáfora “a tua porção”
  alternative: “a tua herança” ou “o povo que te pertence”
  rationale: O grego não explicita o referente além da metáfora. Preservá-la permite a provável alusão a Israel como povo pertencente a Deus sem transformar essa interpretação em texto explícito.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “tu”. O ponto e vírgula separa o pedido relativo ao sacrifício dos dois imperativos seguintes. A metáfora “porção” e o verbo “santificar” preservam o registro religioso do original.
