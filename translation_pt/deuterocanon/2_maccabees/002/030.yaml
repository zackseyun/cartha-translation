lexical_decisions:
- source_word: ἐμβατεύειν
  choice: aprofundar-se no assunto
  rationale: No contexto, o infinitivo indica entrar profundamente na matéria e tratá-la em detalhe, não um movimento físico literal.
- source_word: περίπατον ποιεῖσθαι λόγῳ
  choice: percorrê-lo amplamente no discurso
  rationale: Preserva de modo natural a metáfora de percorrer o tema em larga extensão, sem reduzir a expressão a uma simples ideia de explicação.
- source_word: πολυπραγμονεῖν
  choice: ocupar-se minuciosamente
  rationale: Aqui descreve dedicação intensa e talvez excessiva aos pormenores da obra histórica, não intromissão moral nos assuntos alheios.
- source_word: ἐν τοῖς κατὰ μέρος
  choice: de cada detalhe
  rationale: Expressa os elementos particulares considerados um por um e se integra naturalmente à construção portuguesa.
- source_word: τῷ τῆς ἱστορίας ἀρχηγενέτῃ
  choice: ao autor original da história
  rationale: O termo raro designa aquele que produziu originalmente a história; esta formulação preserva a distinção entre o historiador original e o resumidor.
- source_word: καθήκει
  choice: cabe
  rationale: Comunica de forma concisa aquilo que compete ou é próprio de alguém.
