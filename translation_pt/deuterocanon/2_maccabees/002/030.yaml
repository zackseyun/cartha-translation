  text: To go into detail and to make a circuit with the discourse[a], and to be overly busy with the particulars, belongs to the originator of the history;
translation:
  language: pt
  text: Aprofundar-se no assunto, discorrer amplamente sobre ele[a] e ocupar-se excessivamente dos pormenores cabe ao autor original da história;
