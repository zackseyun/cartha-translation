base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/049.yaml
  text: and to recover the sanctuary renowned throughout the whole inhabited world[a], and to free the city, and to restore the laws that were about to be abolished, since the Lord was showing them mercy with all forbearance[b],
translation:
  language: pt
  text: e recuperar o santuário, célebre em todo o mundo habitado[a], libertar a cidade e restabelecer as leis que estavam prestes a ser abolidas, enquanto o Senhor lhes mostrava misericórdia com toda a clemência[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em todo o mundo”; literalmente, “em todo o mundo habitado”.
    reason: lexical_alternative
  - marker: b
    text: Ou “com toda a brandura”, “com toda a benevolência” ou “com toda a tolerância”.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβόητον
  choice: célebre
  rationale: Expressa aquilo de que muito se fala, famoso ou renomado, preservando o tom elevado sem soar arcaico.
- source_word: καθʼ ὅλην τὴν οἰκουμένην
  choice: em todo o mundo habitado
  rationale: Mantém a formulação grega e sua referência ao mundo conhecido ou habitado, sem impor necessariamente o sentido global moderno.
- source_word: ἱερὸν
  choice: santuário
  rationale: Destaca o caráter sagrado do complexo do templo de Jerusalém sem especificar além do substantivo grego.
- source_word: ἀνακομίσασθαι
  choice: recuperar
  rationale: No contexto, indica reaver ou retomar o santuário; 'recuperar' transmite naturalmente essa retomada.
- source_word: ἐλευθερῶσαι
  choice: libertar
  rationale: Preserva de modo conciso o sentido político de tornar livre a cidade.
- source_word: τοὺς μέλλοντας καταλύεσθαι νόμους
  choice: as leis que estavam prestes a ser abolidas
  rationale: Conserva tanto a iminência expressa por μέλλοντας quanto a ameaça de supressão contida no infinitivo passivo καταλύεσθαι.
- source_word: ἐπανορθῶσαι
  choice: restabelecer
  rationale: Em contexto jurídico e institucional, comunica pôr novamente em vigor ou em ordem.
- source_word: τοῦ κυρίου
  choice: o Senhor
  rationale: O referente é Deus, que age misericordiosamente para com o povo; 'Senhor' é a forma portuguesa convencional e adequada.
- source_word: μετὰ πάσης ἐπιεικείας
  choice: com toda a clemência
  rationale: ἐπιείκεια pode indicar brandura, benevolência, tolerância ou clemência; aqui 'clemência' se harmoniza com o exercício da misericórdia divina e preserva a nuance de indulgência.
- source_word: ἐλεημονοῦντος αὐτοῖς
  choice: lhes mostrava misericórdia
  rationale: Expressa de maneira natural a ação misericordiosa contínua do Senhor em favor deles.
theological_decisions:
- issue: Tradução de κύριος
  choice: o Senhor
  alternative: o senhor / o soberano
  rationale: O contexto atribui misericórdia divina ao agente; a tradução tradicional 'o Senhor' identifica a referência a Deus sem acrescentar uma especificação ausente do grego.
- issue: Relação circunstancial do particípio ἐλεημονοῦντος
  choice: enquanto o Senhor lhes mostrava misericórdia
  alternative: visto que o Senhor lhes mostrava misericórdia
  rationale: O genitivo absoluto admite valor circunstancial e possivelmente causal. 'Enquanto' preserva melhor essa abertura sem afirmar de modo exclusivo uma relação causal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura coordenada preserva a continuidade sintática do contexto, indicada pela abertura com “e” e pela vírgula final. As notas registram a amplitude semântica de οἰκουμένη e ἐπιείκεια.
