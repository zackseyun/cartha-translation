base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/011.yaml
  text: And after many years had passed[a], when it pleased God, Nehemiah, having been sent by the king of Persia, sent the descendants of the priests who had hidden it to get the fire.
translation:
  language: pt
  text: Depois de terem passado muitos anos, quando Deus julgou oportuno[a], Neemias, enviado pelo rei da Pérsia, mandou os descendentes dos sacerdotes que haviam escondido o fogo irem buscá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando pareceu bem a Deus” ou “quando agradou a Deus”.'
    reason: Alternativas para a expressão grega ὅτε ἔδοξεν τῷ θεῷ.
lexical_decisions:
- source_word: διελθόντων δὲ ἐτῶν ἱκανῶν
  choice: Depois de terem passado muitos anos
  rationale: O genitivo absoluto exprime o tempo decorrido; ἱκανῶν indica aqui uma quantidade considerável de anos. A formulação é natural em português e mantém a relação temporal.
- source_word: ὅτε ἔδοξεν τῷ θεῷ
  choice: quando Deus julgou oportuno
  rationale: ἔδοξεν com dativo comunica que algo pareceu bom ou adequado a alguém. “Julgou oportuno” preserva a ideia da decisão e do tempo divinos sem sugerir mera aparência.
- source_word: ἀποσταλεὶς Νεεμίας ἀπὸ τοῦ βασιλέως τῆς Περσίδος
  choice: Neemias, enviado pelo rei da Pérsia
  rationale: O particípio aoristo passivo apresenta Neemias como comissionado pelo rei persa. Em português, “enviado pelo” expressa naturalmente a agência de ἀπό neste contexto.
- source_word: τοὺς ἐκγόνους τῶν ἱερέων
  choice: os descendentes dos sacerdotes
  rationale: ἐκγόνους designa descendentes ou prole, sem exigir que fossem filhos imediatos; “descendentes” mantém essa amplitude.
- source_word: τῶν ἀποκρυψάντων
  choice: que haviam escondido o fogo
  rationale: O particípio remete aos sacerdotes da narrativa anterior. O objeto não é repetido no grego, mas é recuperado do contexto; explicitá-lo evita ambiguidade pouco natural em português.
- source_word: ἔπεμψεν ἐπὶ τὸ πῦρ
  choice: mandou ... irem buscá-lo
  rationale: πέμπω com ἐπί e acusativo indica envio em direção a algo ou com o propósito de obtê-lo. “Mandou ... irem buscá-lo” comunica com clareza a missão de recuperar o fogo.
theological_decisions:
- issue: Vontade divina em ὅτε ἔδοξεν τῷ θεῷ
  choice: quando Deus julgou oportuno
  alternative: quando pareceu bem a Deus; quando agradou a Deus
  rationale: A escolha conserva a noção de que o momento dependia da decisão divina, sem intensificar a afirmação nem reduzir ἔδοξεν a uma impressão incerta.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com sintaxe fluente para leitores brasileiros. O pronome “-lo” retoma “o fogo” e evita repetir o substantivo no encerramento.
