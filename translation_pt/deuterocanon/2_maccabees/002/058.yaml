base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/058.yaml
  text: But the pursuit of brevity in expression[a], and the refusal of an elaborate treatment of the subject, should be allowed to one who is making an abridgment.
translation:
  language: pt
  text: Mas deve-se permitir a quem prepara uma versão resumida[a] buscar concisão na linguagem e abrir mão de um tratamento minucioso do assunto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a quem faz uma tradução”, se μετάφρασις for entendida em seu sentido mais comum; neste contexto, porém, o termo parece indicar uma versão resumida ou um epítome.
    reason: lexical_alternative
lexical_decisions:
- source_word: σύντομον
  choice: concisão
  rationale: O adjetivo substantivado indica brevidade ou concisão de estilo; “concisão” é natural em português e combina bem com “na linguagem”.
- source_word: λέξεως
  choice: linguagem
  rationale: Neste contexto literário, λέξις se refere à forma de expressão ou redação, não a uma palavra isolada.
- source_word: μεταδιώκειν
  choice: buscar
  rationale: O infinitivo expressa aquilo a que o responsável pela versão resumida pode aspirar; “buscar” preserva esse sentido de empenho intencional.
- source_word: ἐξεργαστικὸν
  choice: tratamento minucioso
  rationale: O termo denota elaboração completa e detalhada; a expressão escolhida comunica claramente o contraste com a concisão.
- source_word: πραγματίας
  choice: do assunto
  rationale: πραγματεία designa aqui a matéria ou o tema tratado, e não necessariamente um acontecimento específico.
- source_word: παραιτεῖσθαι
  choice: abrir mão de
  rationale: O infinitivo médio indica recusar, dispensar ou deixar de lado deliberadamente algo; “abrir mão de” é atual e claro.
- source_word: τῷ τὴν μετάφρασιν ποιουμένῳ
  choice: a quem prepara uma versão resumida
  rationale: Embora μετάφρασις possa significar “tradução”, o prólogo descreve a condensação da obra mais extensa de Jasão de Cirene; “versão resumida” comunica esse papel sem sugerir necessariamente transferência entre línguas.
- source_word: συγχωρητέον
  choice: deve-se permitir
  rationale: O adjetivo verbal impessoal indica aquilo que deve ser concedido ou admitido; “deve-se permitir” preserva essa força normativa.
theological_decisions:
- issue: Sentido de μετάφρασις no contexto
  choice: versão resumida
  alternative: tradução
  rationale: O contexto do prólogo trata da redução de uma obra extensa a uma apresentação mais breve. Ainda assim, como “tradução” é um sentido lexical possível e comum, a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e ampla legibilidade brasileira. “Abrir mão de” dá naturalidade contemporânea sem tornar o registro coloquial demais; “tratamento minucioso” mantém o contraste literário com “concisão”.
