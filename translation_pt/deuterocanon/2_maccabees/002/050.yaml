  text: what has been set forth by Jason of Cyrene in five books[a], we will attempt to abridge in one volume.
translation:
  language: pt
  text: o que foi apresentado por Jasão de Cirene em cinco livros, tentaremos resumir em um único volume.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «abreviar» ou «condensar». O verbo grego se refere à produção de uma versão mais curta de uma obra escrita maior.
    reason: lexical_alternative
lexical_decisions:
- source_word: δηλωθέντα
  choice: o que foi apresentado
  rationale: O particípio refere-se ao conteúdo exposto por Jasão; «apresentado» é natural no contexto literário e não força o sentido para «esclarecido».
- source_word: διὰ πέντε βιβλίων
  choice: em cinco livros
  rationale: διά com o genitivo indica aqui o meio ou a extensão literária da obra; «em cinco livros» é a formulação portuguesa idiomática.
- source_word: πειρασόμεθα
  choice: tentaremos
  rationale: O futuro médio exprime a iniciativa com tom modesto; «tentaremos» preserva de modo conciso essa atitude do autor.
- source_word: διʼ ἑνὸς συντάγματος
  choice: em um único volume
  rationale: σύνταγμα designa uma obra escrita organizada ou compilação; «um único volume» torna clara e natural a contraposição aos cinco livros.
- source_word: ἐπιτεμεῖν
  choice: resumir
  rationale: O verbo significa reduzir uma obra extensa a uma versão mais breve. «Resumir» é claro e corrente em português, embora «abreviar» também seja possível.
- source_word: ὑπὸ Ἰάσονος τοῦ Κυρηναίου
  choice: por Jasão de Cirene
  rationale: Mantém a identificação geográfica de forma idiomática em português e usa a forma tradicional do nome próprio.
