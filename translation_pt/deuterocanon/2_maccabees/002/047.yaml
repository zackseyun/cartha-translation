  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτι τε
  choice: e também
  rationale: A expressão acrescenta outro elemento à enumeração em curso; “e também” conserva naturalmente essa força aditiva.
- source_word: τοὺς ... πολέμους
  choice: as guerras
  rationale: πολέμους designa de modo amplo guerras ou conflitos militares; “as guerras” é a correspondência mais direta e adequada ao caráter resumido da frase.
- source_word: πρὸς
  choice: contra
  rationale: Em ligação com πολέμους, πρὸς indica oposição dirigida a adversários; “contra” expressa claramente esse sentido.
- source_word: Ἀντίοχον τὸν Ἐπιφανῆ
  choice: Antíoco Epífanes
  rationale: Mantém o nome e o epíteto régio em sua forma histórica consagrada em português, em vez de traduzir literalmente o epíteto.
- source_word: τὸν τούτου υἱὸν Εὐπάτορα
  choice: seu filho Eupátor
  rationale: τούτου retoma Antíoco e identifica Eupátor como filho dele; a formulação é concisa e natural em português.
