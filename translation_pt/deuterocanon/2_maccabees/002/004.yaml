base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/004.yaml
  text: For when the leader and the force around him[a], which seemed invincible, had arrived, they were cut down in the temple of Nanaia, because the priests attending Nanaia had used deceit.
translation:
  language: pt
  text: Pois, quando o líder e a força que o acompanhava, que parecia invencível[a], chegaram, foram mortos a golpes no templo de Nanaia, porque os sacerdotes ligados a Nanaia recorreram a um ardil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “irresistível”; a expressão grega descreve uma força que parecia impossível de enfrentar.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος
  choice: quando ... chegaram
  rationale: No contexto narrativo, o particípio indica a chegada do líder e de sua força ao templo, não uma mudança de estado. O plural é natural em português por causa do sujeito composto expresso na frase.
- source_word: ἡγεμών
  choice: líder
  rationale: Mantém o sentido amplo de alguém no comando sem especificar indevidamente um cargo civil ou militar.
- source_word: ἡ περὶ αὐτὸν ... δύναμις
  choice: a força que o acompanhava
  rationale: Em contexto militar, δύναμις designa um contingente ou força armada; περὶ αὐτόν refere-se aos que estavam com o líder.
- source_word: ἀνυπόστατος δοκοῦσα εἶναι
  choice: que parecia invencível
  rationale: A expressão descreve uma força que aparentava não poder ser enfrentada ou resistida. A formulação preserva o valor militar provável, enquanto a nota registra uma alternativa pertinente.
- source_word: κατεκόπησαν
  choice: foram mortos a golpes
  rationale: Expressa a matança violenta indicada pelo verbo passivo sem recorrer a uma formulação arcaica ou sugerir necessariamente um instrumento específico.
- source_word: ἐν τῷ τῆς Ναναίας ἱερῷ
  choice: no templo de Nanaia
  rationale: ἱερόν pode indicar templo ou santuário; “templo” é claro e natural neste contexto.
- source_word: παραλογισμῷ χρησαμένων
  choice: recorreram a um ardil
  rationale: 'O genitivo absoluto apresenta o meio ou a circunstância da matança: os sacerdotes empregaram engano ou estratagema.'
- source_word: τῶν περὶ τὴν Ναναίαν ἱερέων
  choice: os sacerdotes ligados a Nanaia
  rationale: A construção περὶ com o acusativo indica os sacerdotes associados ao culto de Nanaia, sem exigir uma relação possessiva literal.
theological_decisions:
- issue: Forma do nome divino Ναναία
  choice: Nanaia
  alternative: Nanea; Nanaya
  rationale: Por ser nome próprio de uma deusa, é transliterado em vez de traduzido. “Nanaia” acompanha de perto a forma grega do texto-fonte.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção relativa mantém “que parecia invencível” ligada gramaticalmente à força, como no grego.
