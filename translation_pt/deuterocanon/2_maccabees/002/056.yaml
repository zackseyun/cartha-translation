base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/056.yaml
  text: For just as[a], in the case of a new house, the architect must take thought for the whole foundation, but the one undertaking to decorate and paint it must examine the things suitable for adornment, so also, I think, it is with us.
translation:
  language: pt
  text: Pois, assim como, no caso de uma casa nova, o arquiteto deve cuidar de todo o alicerce, enquanto aquele que se propõe a preparar[a] e pintar a casa deve examinar o que é adequado para ornamentá-la, assim também, penso eu, acontece conosco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “decorar”. O verbo grego também pode indicar preparar, equipar ou dar acabamento a uma casa, e não apenas ornamentá-la.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: assim como
  rationale: Introduz naturalmente a comparação e preserva sua estrutura formal.
- source_word: τῆς καινῆς οἰκίας
  choice: no caso de uma casa nova
  rationale: Mantém a imagem concreta da construção e expressa com clareza a relação contextual.
- source_word: ἀρχιτέκτονι
  choice: o arquiteto
  rationale: Designa o responsável principal pelo projeto e pela construção, preservando o caráter técnico do termo.
- source_word: τῆς ὅλης καταβολῆς
  choice: de todo o alicerce
  rationale: καταβολή, neste contexto arquitetônico, aponta para a fundação ou seu assentamento; 'todo o alicerce' é concreto e legível sem ampliar o sentido para a estrutura inteira.
- source_word: φροντιστέον
  choice: deve cuidar
  rationale: Reproduz a necessidade expressa pelo adjetivo verbal e o sentido de atenção responsável.
- source_word: ἐγκαινίζειν
  choice: preparar
  rationale: No paralelo com pintar e ornamentar uma casa, indica equipá-la, acabá-la ou prepará-la, não necessariamente dedicá-la cerimonialmente; a nota preserva a alternativa 'decorar'.
- source_word: ζωγραφεῖν
  choice: pintar
  rationale: É a equivalência natural no contexto de acabamento e ornamentação de uma casa.
- source_word: τὰ ἐπιτήδεια πρὸς διακόσμησιν
  choice: o que é adequado para ornamentá-la
  rationale: Mantém em aberto se estão em vista materiais, recursos ou escolhas apropriadas, sem restringir indevidamente o referente.
- source_word: ἐξεταστέον
  choice: deve examinar
  rationale: Preserva tanto a obrigação quanto a ideia de avaliação cuidadosa.
- source_word: οὕτως δοκῶ καὶ ἐπὶ ἡμῶν
  choice: assim também, penso eu, acontece conosco
  rationale: Conserva a aplicação da analogia e a modéstia parentética de δοκῶ.
