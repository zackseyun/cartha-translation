  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção conserva a analogia arquitetônica e a expressão parentética do autor. 'Alicerce' foi preferido a 'fundação' por naturalidade concreta, e 'preparar' evita reduzir ἐγκαινίζειν apenas ao ato de ornamentar.
