  text: And when the things for the sacrifice had been consumed[b][a], Nehemiah ordered them to pour the remaining water on the larger stones.
translation:
  language: pt
  text: E, quando as coisas destinadas ao sacrifício tinham sido consumidas[a], Neemias ordenou que derramassem a água restante sobre as pedras maiores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “as coisas do sacrifício”. A expressão é elíptica e pode referir-se, de modo amplo, ao que era destinado ao sacrifício.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνηλώθη
  choice: tinham sido consumidas
  rationale: O passivo indica que aquilo que se destinava ao sacrifício se esgotou ou foi consumido; a formulação preserva essa amplitude sem especificar o meio.
- source_word: τὰ τῆς θυσίας
  choice: as coisas destinadas ao sacrifício
  rationale: A expressão grega é elíptica. Esta tradução permanece lexicalmente ampla e é mais compreensível em português do que a forma literal “as coisas do sacrifício”.
- source_word: τὸ περιλειπόμενον ὕδωρ
  choice: a água restante
  rationale: Reprodução direta, concisa e natural da expressão participial.
- source_word: ὁ Νεεμίας
  choice: Neemias
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: ἐκέλευσεν
  choice: ordenou que derramassem
  rationale: O verbo expressa uma ordem com autoridade; a oração com sujeito indeterminado reproduz naturalmente o infinitivo grego sem acrescentar um referente explícito.
- source_word: λίθους μείζονας
  choice: as pedras maiores
  rationale: O comparativo μείζονας é preservado por “maiores”; o artigo definido acompanha a provável referência contextual a pedras já identificáveis.
- source_word: καταχεῖν
  choice: derramassem ... sobre
  rationale: O composto indica derramar sobre ou por cima de algo; “sobre” é idiomático e conserva a direção da ação.
