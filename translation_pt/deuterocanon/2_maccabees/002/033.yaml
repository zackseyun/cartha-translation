  text: And some of those who had followed came near to mark the way[a], but they were not able to find it.
translation:
  language: pt
  text: E alguns dos que o acompanhavam aproximaram-se para assinalar o caminho[a], mas não conseguiram encontrá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a estrada” ou “a rota”. O termo grego ὁδός pode designar caminho, estrada ou rota, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: se aproximaram
  rationale: O particípio aoristo de προσέρχομαι indica movimento em direção ao lugar em questão; “se aproximaram” preserva esse sentido sem especificar indevidamente o ponto de aproximação.
- source_word: τινὲς τῶν συνακολουθούντων
  choice: alguns dos que o haviam acompanhado
  rationale: A construção partitiva τινὲς τῶν com particípio é mantida de forma explícita. O mais-que-perfeito composto apresenta o acompanhamento como anterior à tentativa narrada, e o pronome “o” recupera Jeremias no contexto.
- source_word: ὥστε ἐπισημήνασθαι τὴν ὁδόν
  choice: para marcar o caminho
  rationale: Neste contexto, ὥστε com infinitivo expressa finalidade ou resultado pretendido. ἐπισημήνασθαι denota assinalar ou marcar, e “caminho” preserva a flexibilidade semântica de ὁδός.
- source_word: οὐκ ἠδυνήθησαν
  choice: não conseguiram
  rationale: Expressa de maneira natural em português a incapacidade indicada por δύναμαι, sem alterar seu sentido.
- source_word: εὑρεῖν
  choice: encontrá-lo
  rationale: O infinitivo depende de ἠδυνήθησαν. O pronome retoma gramaticalmente “o caminho”, embora o contexto permita que a busca envolva o acesso ou local anteriormente mencionado.
