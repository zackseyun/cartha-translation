  text: while leaving the detailed treatment of each matter to the author[a], and taking pains to follow the outlines of the epitome.
translation:
  language: pt
  text: deixando ao autor o tratamento minucioso de cada assunto[a] e empenhando-nos em seguir as linhas gerais do resumo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «deixando ao autor investigar com exatidão cada ponto e procurando avançar segundo o esboço da obra resumida». O grego emprega termos literários que contrastam uma obra completa com sua versão condensada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακριβοῦν
  choice: o tratamento minucioso
  rationale: O infinitivo substantivado indica a tarefa de tratar cada ponto com exatidão e detalhe numa obra extensa; «tratamento minucioso» preserva tanto a precisão quanto o caráter literário da tarefa.
- source_word: περὶ ἑκάστων
  choice: de cada assunto
  rationale: Mantém o sentido distributivo e amplo da expressão grega em português natural.
- source_word: τῷ συγγραφεῖ
  choice: ao autor
  rationale: Designa quem compôs a obra histórica mais extensa, em contraste com o responsável pelo resumo.
- source_word: παραχωρήσαντες
  choice: deixando
  rationale: Expressa de modo idiomático a ideia de reservar ou ceder ao autor da obra maior a tarefa detalhada.
- source_word: ἐπιπορεύεσθαι
  choice: seguir
  rationale: Com ὑπογραμμοῖς, comunica avançar segundo linhas orientadoras ou um esquema.
- source_word: ὑπογραμμοῖς
  choice: as linhas gerais
  rationale: Representa as linhas orientadoras ou o esboço que estruturam a condensação, sem sugerir um esquema formal moderno demais.
- source_word: ἐπιτομῆς
  choice: do resumo
  rationale: Neste contexto literário, indica uma versão condensada de uma obra mais extensa; «resumo» é claro e corrente para leitores modernos.
- source_word: σπουδάζοντες
  choice: empenhando-nos
  rationale: Transmite esforço diligente e intencional, não apenas desejo ou entusiasmo.
