translation:
  language: pt
  text: ó único provedor[a], ó único justo, todo-poderoso e eterno, tu que salvas Israel de todo mal[b], que tornaste os antepassados escolhidos e os santificaste[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “único benfeitor” ou “único fornecedor”. O grego χορηγός designa quem fornece ou proporciona algo.
    reason: lexical_alternative
  - marker: b
    text: Ou “de todo dano” ou “de toda aflição”.
    reason: lexical_alternative
  - marker: c
    text: Ou “os tornaste santos” ou “os consagraste”. No grego, os títulos e particípios anteriores estão no nominativo masculino singular, enquanto “santificaste” traduz uma forma explicitamente na segunda pessoa do singular; a tradução entende toda a frase como invocação direta.
    reason: lexical_and_grammatical_ambiguity
lexical_decisions:
- source_word: ὁ μόνος χορηγός
  choice: ó único provedor
  rationale: Χορηγός designa quem fornece ou proporciona o necessário. “Provedor” mantém a amplitude do termo e funciona como título divino; o “ó” torna explícito o caráter invocativo confirmado pela forma verbal na segunda pessoa no fim da frase.
- source_word: ὁ μόνος δίκαιος
  choice: único justo
  rationale: Preserva a repetição de μόνος e o valor substantivado de δίκαιος numa sequência solene de títulos dirigidos a Deus.
- source_word: παντοκράτωρ
  choice: todo-poderoso
  rationale: Equivalente corrente e compreensível do título divino, mantendo sua força e solenidade.
- source_word: αἰώνιος
  choice: eterno
  rationale: É a equivalência portuguesa mais natural no contexto de atributos divinos.
- source_word: ὁ διασώζων
  choice: tu que salvas
  rationale: Διασώζω exprime salvar ou levar em segurança para fora de um perigo. “Salvas” é direto e, com “tu”, mantém a invocação em segunda pessoa sugerida por ἡγίασας.
- source_word: ἐκ παντὸς κακοῦ
  choice: de todo mal
  rationale: Mantém a amplitude de κακόν, que pode abranger mal, dano ou aflição, sem restringir o sentido.
- source_word: τοὺς πατέρας
  choice: os antepassados
  rationale: No contexto da história de Israel, πατέρες se refere aos ancestrais do povo; “antepassados” comunica isso com clareza moderna.
- source_word: ποιήσας ... ἐκλεκτούς
  choice: que tornaste escolhidos
  rationale: Preserva tanto o verbo ποιέω, “fazer/tornar”, quanto o predicativo ἐκλεκτούς, evitando substituir a construção simplesmente por “escolheste”.
- source_word: ἡγίασας
  choice: os santificaste
  rationale: A forma é aoristo indicativo na segunda pessoa do singular. “Santificaste” conserva o sentido de tornar santo ou separar para Deus e também a mudança formal presente no grego.
theological_decisions:
- issue: Sequência de títulos divinos e mudança para a segunda pessoa
  choice: 'Apresentar toda a frase como invocação direta: “ó único provedor... tu que salvas... que tornaste... e os santificaste”.'
  alternative: 'Manter os títulos na terceira pessoa e reproduzir abruptamente a segunda pessoa apenas no último verbo: “o único provedor... aquele que salva... que tornou... e tu os santificaste”.'
  rationale: Os grupos gregos com artigo têm forma nominativa, mas podem funcionar como títulos em invocação; além disso, ἡγίασας é inequivocamente segunda pessoa. A formulação portuguesa explicita a provável função oracional sem ocultar a peculiaridade formal, registrada em nota.
- issue: Sentido de ἐκλεκτούς aplicado aos antepassados
  choice: “tornaste escolhidos”
  alternative: “escolheste” ou “constituíste como eleitos”
  rationale: A opção conserva a construção do texto, sem introduzir jargão doutrinário nem definir além do necessário a natureza dessa escolha.
- issue: Sentido de ἁγιάζω
  choice: “santificaste”
  alternative: “tornaste santos” ou “consagraste”
  rationale: “Santificaste” mantém o peso teológico e a possível abrangência entre tornar santo e separar para Deus, sem escolher exclusivamente uma dessas nuances.
translation_notes:
  register: Português moderno, solene e acessível, com sintaxe de oração litúrgica. “Antepassados” foi preferido a “pais” para evitar ambiguidade familiar imediata. A repetição de “único” e a série de atributos foram mantidas, enquanto o vocativo e a segunda pessoa dão naturalidade em português e refletem a forma verbal final do grego.
