  yaml_path: translation/deuterocanon/2_maccabees/002/053.yaml
  text: And for us[a], who have undertaken the hardship of making the abridgment, the task is not easy, but one of sweat and sleeplessness;
translation:
  language: pt
  text: E, para nós[a], que assumimos o trabalho árduo de fazer o resumo, a tarefa não é fácil, mas exige suor e noites sem dormir;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “que temos demonstrado a dificuldade do resumo”. A expressão grega é um tanto idiomática; a tradução apresenta o sentido de assumir e suportar o trabalho envolvido na produção do resumo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμῖν ... τοῖς
  choice: para nós, que
  rationale: O dativo com artigo e particípio identifica os autores como os caracterizados pela ação seguinte. “Para nós, que” é natural em português e preserva a autorreferência e o valor explicativo.
- source_word: τὴν κακοπάθειαν
  choice: o trabalho árduo
  rationale: κακοπάθεια denota sofrimento, dificuldade ou labuta penosa. No contexto de um prólogo literário sobre trabalho editorial, “trabalho árduo” comunica a carga sem sugerir especificamente perseguição.
- source_word: ἐπιδεδειγμένοις
  choice: assumimos
  rationale: O particípio perfeito médio/passivo de ἐπιδείκνυμι significa literalmente algo como “tendo demonstrado”, mas, com κακοπάθεια, a expressão é idiomática e aponta para assumir e suportar a labuta. “Assumimos” exprime esse sentido sem impor uma leitura excessivamente literal.
- source_word: τῆς ἐπιτομῆς
  choice: de fazer o resumo
  rationale: ἐπιτομή é uma abreviação ou resumo de uma obra maior. A formulação explicita naturalmente em português que a dificuldade consiste na produção desse resumo.
- source_word: οὐ ῥᾴδιον
  choice: não é fácil
  rationale: Tradução direta e corrente do adjetivo predicativo, preservando a afirmação sobre a dificuldade da tarefa.
- source_word: ἱδρῶτος ... καὶ ἀγρυπνίας
  choice: exige suor e noites sem dormir
  rationale: A construção genitiva caracteriza a tarefa por suor e vigília. “Exige” torna a relação natural em português, enquanto “suor e noites sem dormir” conserva a imagem concreta da labuta e da perda de sono.
- source_word: τὸ πρᾶγμα
  choice: a tarefa
  rationale: πρᾶγμα refere-se aqui ao trabalho em questão, isto é, preparar o resumo. “A tarefa” é conciso e idiomático.
