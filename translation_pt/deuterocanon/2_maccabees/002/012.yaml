  yaml_path: translation/deuterocanon/2_maccabees/002/012.yaml
  text: As they explained to us that they had found not fire but thick water[a], he ordered them, after drawing some out, to bring it. Then when the things for the sacrifices had been brought forward[c][b], Nehemiah ordered the priests to sprinkle the water on both the wood and what was laid upon it.
translation:
  language: pt
  text: Quando nos explicaram que não tinham encontrado fogo, mas água espessa[a], ele lhes ordenou que tirassem um pouco e a levassem[b]. Depois que os materiais para os sacrifícios foram trazidos, Neemias ordenou aos sacerdotes que aspergissem a água sobre a lenha e sobre o que estava colocado em cima dela[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “água densa” ou “líquido espesso”. A expressão grega é incomum e pode destacar deliberadamente o caráter estranho da substância.
    reason: lexical_alternative
  - marker: b
    text: O termo grego traduzido por “tirassem um pouco” é raro e difícil. Pelo contexto, indica que deviam retirar parte do líquido e levá-la.
    reason: textual_difficulty
  - marker: c
    text: Ou “derramassem a água sobre a lenha e sobre o que estava colocado em cima dela”.
    reason: alternative_reading
lexical_decisions:
- source_word: διεσάφησαν
  choice: explicaram
  rationale: O verbo indica que a informação foi esclarecida ou comunicada de modo explícito; “explicaram” é natural e mantém esse sentido.
- source_word: μὴ εὑρηκέναι πῦρ ἀλλὰ ὕδωρ παχύ
  choice: não tinham encontrado fogo, mas água espessa
  rationale: Mantém o contraste do grego e conserva a expressão incomum “água espessa”, sem transformá-la interpretativamente em outra substância.
- source_word: ἀποβλίψαντας
  choice: que tirassem um pouco
  rationale: A forma é rara e difícil; a tradução comunica com prudência a ação contextual de retirar parte do líquido, sem especificar um método não expresso com segurança.
- source_word: φέρειν
  choice: e a levassem
  rationale: Expressa naturalmente o infinitivo dependente da ordem, retomando a água retirada.
- source_word: ἀνηνέχθη τὰ τῶν θυσιῶν
  choice: os materiais para os sacrifícios foram trazidos
  rationale: A expressão grega é elíptica e abrange aquilo que se destinava aos sacrifícios; “materiais” evita restringi-la apenas às vítimas ou ofertas.
- source_word: ἐπιρᾶναι
  choice: aspergissem
  rationale: No contexto sacrificial, descreve adequadamente a aplicação da água sobre a lenha e o que estava sobre ela, embora o verbo também possa admitir a ideia mais geral de derramar.
- source_word: τά τε ξύλα καὶ τὰ ἐπικείμενα
  choice: sobre a lenha e sobre o que estava colocado em cima dela
  rationale: Preserva tanto a referência coletiva à madeira quanto a formulação ampla do grego para os elementos colocados sobre ela.
- source_word: Νεεμίας
  choice: Neemias
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Modo de aplicar a água aos materiais do sacrifício
  choice: aspergissem a água
  alternative: derramassem a água
  rationale: “Aspergissem” se ajusta ao contexto ritual, mas a nota preserva a possibilidade lexical mais geral de derramar, sem fazer dessa escolha uma afirmação doutrinária.
- issue: Caráter incomum da substância encontrada
  choice: água espessa
  alternative: líquido espesso
  rationale: A formulação mantém a estranheza deliberada do texto, bem como a tensão narrativa entre o fogo procurado e a substância encontrada.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas naturais no Brasil e inteligíveis internacionalmente. A sintaxe foi moderadamente reorganizada para clareza, preservando as expressões incomuns e as ambiguidades relevantes do grego.
