base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/036.yaml
  text: And it was also made clear that[a], as one having wisdom[b], he offered a sacrifice for the dedication and completion of the sanctuary.
translation:
  language: pt
  text: Também se esclarecia que ele, como alguém dotado de sabedoria, ofereceu um sacrifício pela dedicação[a] e conclusão[b] do santuário.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “rededicação”. O contexto histórico pode indicar uma nova dedicação, mas o grego diz simplesmente “dedicação”.
    reason: lexical_alternative
  - marker: b
    text: Ou “consagração do santuário”. O termo grego pode ter o sentido cultual de levar algo à sua plena condição sagrada.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεσαφείτο
  choice: também se esclarecia
  rationale: O imperfeito passivo de διασαφέω indica que algo era exposto ou tornado claro. A formulação conserva tanto o valor explicativo quanto o aspecto durativo do grego.
- source_word: ὡς σοφίαν ἔχων
  choice: como alguém dotado de sabedoria
  rationale: A expressão preserva o sentido modal ou caracterizador de ὡς com o particípio, sem impor uma relação estritamente causal. Em português atual, é mais natural do que a reprodução literal “como alguém que tinha sabedoria”.
- source_word: ἀνήνεγκεν
  choice: ofereceu
  rationale: Em contexto sacrificial, ἀναφέρω significa oferecer um sacrifício; “ofereceu” é a forma idiomática e precisa em português.
- source_word: θυσίαν
  choice: um sacrifício
  rationale: Equivalente corrente de θυσία no contexto cultual, sem expansão interpretativa.
- source_word: ἐγκαινισμοῦ
  choice: pela dedicação
  rationale: O genitivo caracteriza a finalidade ou natureza do sacrifício. “Dedicação” traduz o termo grego sem acrescentar a ideia historicamente plausível, mas não explícita, de repetição.
- source_word: τελειώσεως
  choice: conclusão
  rationale: τελείωσις designa o ato de levar algo à sua plena realização e pode ter sentido cultual. “Conclusão” preserva o núcleo lexical, enquanto “consagração” permanece como alternativa em nota.
- source_word: τοῦ ἱεροῦ
  choice: do santuário
  rationale: ἱερόν designa o recinto ou complexo sagrado. “Santuário” comunica adequadamente esse referente sem reduzi-lo a uma parte específica do edifício.
theological_decisions:
- issue: Nuance cultual de τελειώσεως em relação ao santuário
  choice: conclusão
  alternative: consagração
  rationale: O substantivo pode indicar que algo foi levado à sua plena condição sagrada. O texto principal mantém o sentido lexical mais amplo, e a nota registra a possível acepção cultual.
- issue: Implicação histórica de ἐγκαινισμοῦ
  choice: dedicação
  alternative: rededicação
  rationale: Embora o contexto macabeu envolva a restauração do templo, o substantivo grego não expressa por si só a repetição da dedicação. Por isso, “rededicação” aparece apenas como alternativa em nota.
- issue: Relação expressa por ὡς σοφίαν ἔχων
  choice: como alguém dotado de sabedoria
  alternative: por ter sabedoria
  rationale: A construção pode descrever a maneira ou a condição em que ele agiu e também admitir nuance causal. A tradução principal evita tornar obrigatoriamente causal uma relação que o grego deixa flexível.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. “Como alguém dotado de sabedoria” evita rigidez excessiva e conserva a ambiguidade entre caracterização modal e possível causa. Os marcadores foram colocados junto aos termos a que as notas efetivamente se referem.
