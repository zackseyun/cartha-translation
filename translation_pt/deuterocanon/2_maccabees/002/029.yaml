base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/029.yaml
  text: For just as the architect of a new house must take thought for the whole structure[a], but the one undertaking to decorate it with painted ornament must consider the things suitable for adornment, so also, I think, it is with us.
translation:
  language: pt
  text: Pois, assim como o arquiteto de uma casa nova deve cuidar da fundação inteira, enquanto quem se encarrega de dar-lhe o acabamento e pintá-la[a] deve examinar o que é apropriado para a decoração, assim também, penso eu, o mesmo se dá conosco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “inaugurá-la e pintá-la”. O verbo grego pode significar inaugurar, dedicar ou renovar; neste contexto, sua associação com a pintura e a decoração favorece o sentido de dar acabamento à casa.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γάρ
  choice: Pois, assim como
  rationale: Preserva tanto a ligação explicativa de γάρ quanto a introdução enfática da comparação por καθάπερ, em português natural.
- source_word: ἀρχιτέκτονι
  choice: o arquiteto
  rationale: Designa o responsável principal pelo projeto e pela construção, e não apenas um trabalhador da obra.
- source_word: τῆς ὅλης καταβολῆς
  choice: de toda a construção
  rationale: No contexto da casa, καταβολή pode apontar para o lançamento dos alicerces ou, por extensão, para a execução estrutural como um todo. 'Toda a construção' mantém o alcance global exigido por ὅλης sem reduzir a responsabilidade do arquiteto apenas aos alicerces.
- source_word: φροντιστέον
  choice: deve cuidar
  rationale: Expressa de modo natural a necessidade ou obrigação contida no adjetivo verbal grego.
- source_word: ἐγκαινίζειν καὶ ζωγραφεῖν
  choice: dar-lhe o acabamento e pintá-la
  rationale: A associação dos dois verbos com διακόσμησις favorece uma atividade de acabamento e ornamentação. A tradução evita especificar uma técnica pictórica não explicitada pelo texto.
- source_word: τὰ ἐπιτήδεια πρὸς διακόσμησιν
  choice: o que é apropriado para a decoração
  rationale: Conserva a generalidade de τὰ ἐπιτήδεια, que pode abranger materiais, elementos ou recursos adequados à ornamentação.
- source_word: οὕτως δοκῶ καὶ ἐπὶ ἡμῶν
  choice: assim também, penso eu, acontece conosco
  rationale: Mantém a aplicação da comparação ao trabalho do autor e preserva a ressalva modesta expressa por δοκῶ.
