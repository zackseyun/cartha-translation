translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A sintaxe comparativa do grego foi preservada, mas a obrigação impessoal foi vertida por formas pessoais naturais em português. Evitou-se 'pintura encáustica', pois o verbo ζωγραφεῖν não determina por si só essa técnica específica.
