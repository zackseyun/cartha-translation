base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/001.yaml
  text: 'And those in Judea[a], and the council of elders, and Judas, to Aristobulus, teacher of King Ptolemy, who is also of the family of the anointed priests, and to the Jews in Egypt: greetings and good health.'
translation:
  language: pt
  text: 'E os que estão na Judeia, o conselho de anciãos e Judas, a Aristóbulo, mestre do rei Ptolomeu, que também pertence à linhagem dos sacerdotes ungidos[a], e aos judeus que estão no Egito: saudações e votos de boa saúde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sacerdotes consagrados”. O grego diz literalmente “sacerdotes ungidos”; aqui, “ungidos” não é um título, mas descreve os sacerdotes que recebiam a unção.'
    reason: Esclarece uma alternativa lexical e evita que χριστῶν seja entendido indevidamente como título cristológico.
lexical_decisions:
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: os que estão na Judeia
  rationale: Mantém a expressão grega deliberadamente ampla, sem acrescentar “judeus”, embora isso seja provável pelo contexto.
- source_word: γερουσία
  choice: conselho de anciãos
  rationale: Expressa de modo claro e corrente o sentido institucional de um corpo formado por anciãos.
- source_word: διδασκάλῳ
  choice: mestre
  rationale: É uma tradução direta e natural para a função de Aristóbulo junto ao rei Ptolomeu, sem especificar indevidamente se era tutor particular.
- source_word: ὄντι δὲ ἀπὸ τοῦ τῶν χριστῶν ἱερέων γένους
  choice: que também pertence à linhagem dos sacerdotes ungidos
  rationale: Preserva γένος como descendência ou linhagem e traduz χριστῶν em seu sentido comum de “ungidos”, sem tratá-lo como título cristológico.
- source_word: χαίρειν καὶ ὑγιαίνειν
  choice: saudações e votos de boa saúde
  rationale: Reproduz a fórmula epistolar grega em português natural, comunicando tanto a saudação quanto o desejo de bem-estar.
- source_word: Ἰούδας
  choice: Judas
  rationale: Emprega a forma portuguesa tradicional do nome pessoal neste contexto helenístico judaico.
theological_decisions:
- issue: Sentido de χριστῶν em τῶν χριστῶν ἱερέων
  choice: sacerdotes ungidos
  alternative: sacerdotes consagrados
  rationale: Aqui χριστῶν é um adjetivo plural ligado a “sacerdotes” e se refere à unção sacerdotal; não funciona como título messiânico ou cristológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A conjunção inicial “E” foi mantida para preservar a ligação do versículo com o contexto anterior. A estrutura remetente-destinatário da saudação formal foi conservada sem eliminar a amplitude de “os que estão na Judeia”.
