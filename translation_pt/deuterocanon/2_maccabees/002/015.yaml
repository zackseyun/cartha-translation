    text: Ou “bom” ou “benevolente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ἡ προσευχὴ τὸν τρόπον ἔχουσα τοῦτον
  choice: E a oração era assim
  rationale: A expressão idiomática introduz o teor da oração; esta formulação é natural em português e preserva a função introdutória do grego.
- source_word: Κύριε ὁ θεός
  choice: Senhor Deus
  rationale: Vocativo direto e título divino; em português não é necessário acrescentar a interjeição “ó”.
- source_word: ὁ πάντων κτίστης
  choice: criador de todas as coisas
  rationale: κτίστης designa quem cria ou funda, e πάντων tem alcance universal.
- source_word: ὁ φοβερὸς
  choice: o temível
  rationale: Indica aquele que inspira temor ou reverência; “temível” evita o sentido moderno inadequado de alguém que sente medo.
- source_word: ὁ ἰσχυρὸς
  choice: poderoso
  rationale: Expressa de modo natural a força e o poder divinos indicados por ἰσχυρός.
- source_word: δίκαιος
  choice: justo
  rationale: Em português, “justo” traduz diretamente o atributo moral e judicial de δίκαιος sem restringi-lo a uma terminologia confessional.
- source_word: ἐλεήμων
  choice: misericordioso
  rationale: É a equivalência direta e consagrada para quem demonstra misericórdia.
- source_word: ὁ μόνος βασιλεὺς
  choice: o único rei
  rationale: Preserva tanto a exclusividade de μόνος quanto o título real βασιλεύς.
- source_word: χρηστός
  choice: bondoso
  rationale: Neste elenco de atributos divinos, “bondoso” comunica a bondade benevolente de χρηστός com mais naturalidade que “bom” substantivado.
theological_decisions:
- issue: Tradução de κύριος no vocativo divino
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” preserva o título divino tradicional e corresponde diretamente ao uso de κύριος neste contexto de oração.
- issue: Amplitude semântica de δίκαιος como atributo divino
  choice: justo
  alternative: reto
  rationale: Ambos são possíveis, mas “justo” mantém de modo mais imediato as dimensões moral e judicial do termo sem desenvolver uma interpretação adicional.
translation_notes:
  register: Português moderno, digno e acessível, com cadência apropriada a uma oração. Os adjetivos coordenados foram mantidos como predicados substantivados sob um único artigo em português, evitando repetição artificial. A pontuação final permanece aberta porque o versículo continua a oração.
