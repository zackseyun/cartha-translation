  text: 'And the prayer had this form: “Lord God[a], creator of all things, the fearful and mighty and righteous and merciful one[c][b], the only king and good one,”'
translation:
  language: pt
  text: 'E a oração era assim: “Senhor Deus, criador de todas as coisas, o temível[a], poderoso, justo[b] e misericordioso, o único rei, bondoso[c],'
  philosophy: optimal-equivalence
  footnotes:
