    text: 'Ou: «a fim de tomar posse da maior quantia de dinheiro, sob a alegação de uma inspeção».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνοικῶν αὐτῇ
  choice: a acompanhavam
  rationale: Embora συνοικέω possa significar literalmente «viver com», o contexto de deslocamento favorece a ideia de estar junto e acompanhar. O pronome feminino αὐτῇ é preservado como «a», sem normalização silenciosa.
- source_word: παρῆγεν εἰς τὸν τόπον
  choice: levavam-no para lá
  rationale: παράγω admite o sentido de conduzir ou levar consigo. O objeto masculino não está expresso no grego, mas é suprido de modo mínimo; a incerteza sintática e pronominal é indicada em nota.
- source_word: οἱ σὺν αὐτῷ φίλοι
  choice: seus amigos
  rationale: Forma natural em português para os amigos ou associados que estavam com Antíoco.
- source_word: κύριον τὸ λαβεῖν
  choice: obter o controle
  rationale: A construção expressa alcançar domínio ou poder sobre algo, mais do que simplesmente pegá-lo fisicamente.
- source_word: τὰ χρήματα πλείονα
  choice: o dinheiro
  rationale: O núcleo semântico é preservado no texto corrente; a possível nuance comparativa de πλείονα, «a soma maior», aparece na nota.
- source_word: εἰς ἐφορῆς λόγον
  choice: sob o pretexto de uma inspeção
  rationale: A expressão apresenta a inspeção ou supervisão como razão alegada, provavelmente um pretexto, para a ação.
