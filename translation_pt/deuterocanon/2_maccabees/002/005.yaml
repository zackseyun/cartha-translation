  yaml_path: translation/deuterocanon/2_maccabees/002/005.yaml
  text: For as Antiochus and his friends were accompanying her to the place[a], they were bringing him there to gain control of the money[b], under the pretext of inspection.
translation:
  language: pt
  text: Pois, enquanto Antíoco e seus companheiros a acompanhavam até o lugar,[a] levavam-no para lá a fim de obter controle sobre o dinheiro,[b] sob o pretexto de uma inspeção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego transmitido deste versículo tem uma sintaxe difícil; alguns detalhes quanto ao sujeito, ao objeto e à referência dos pronomes são incertos.
    reason: textual_variant
