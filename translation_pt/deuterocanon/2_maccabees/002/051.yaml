  text: For[a], seeing the flood of numbers and the difficulty for those who wish to enter into the narratives of the history because of the abundance of material[b],
translation:
  language: pt
  text: Pois, considerando a enxurrada de números[a] e a dificuldade que há para os que desejam adentrar os relatos da história, devido à abundância do material[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a massa de números»; o grego emprega uma metáfora vívida para uma quantidade avassaladora.
    reason: lexical_alternative
  - marker: b
    text: O verbo raro traduzido por «adentrar» também pode sugerir envolver-se nos relatos históricos ou abrir caminho por eles.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνορῶντες
  choice: considerando
  rationale: O particípio introduz a razão para o trabalho de abreviação; «considerando» exprime naturalmente a percepção ponderada indicada pelo contexto.
- source_word: τὸ χῦμα τῶν ἀριθμῶν
  choice: a enxurrada de números
  rationale: Mantém a metáfora vívida de uma quantidade avassaladora e conserva o sentido direto de ἀριθμῶν, sem o reduzir interpretativamente a «detalhes».
- source_word: τὴν οὖσαν δυσχέρειαν
  choice: a dificuldade que há
  rationale: Representa a dificuldade efetivamente existente e soa natural em português.
- source_word: τοῖς θέλουσιν εἰσκυκλεῖσθαι
  choice: para os que desejam adentrar
  rationale: O verbo raro sugere entrar, envolver-se ou abrir caminho por algo; «adentrar» preserva essa imagem sem especificar em excesso.
- source_word: τοῖς τῆς ἱστορίας διηγήμασιν
  choice: os relatos da história
  rationale: Expressa com clareza os relatos narrativos que compõem a obra histórica, mantendo a relação genitiva do grego.
- source_word: διὰ τὸ πλῆθος τῆς ὕλης
  choice: devido à abundância do material
  rationale: ὕλη designa aqui a matéria ou o conteúdo da obra, e πλῆθος sua grande quantidade.
