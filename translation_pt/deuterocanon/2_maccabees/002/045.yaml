  text: just as he promised through the law[a]. For we hope in God that he will soon have mercy on us and gather us from under heaven into the holy place[c][b]; for he rescued us from great evils and cleansed the place.
translation:
  language: pt
  text: como ele prometeu por meio da Lei. Pois esperamos em Deus que, em breve, ele terá misericórdia de nós e nos reunirá de debaixo do céu para o santo lugar[a][b]; pois ele nos livrou de grandes males[c] e purificou o lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega é elíptica; pode ser entendida como “de toda parte debaixo do céu”, isto é, dos lugares da dispersão.
    reason: lexical_alternative
  - marker: b
    text: Isto é, o local sagrado em Jerusalém; no contexto, refere-se à área do templo.
    reason: cultural_note
  - marker: c
    text: Ou “de grandes calamidades” ou “de grandes aflições”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ἐπηγγείλατο
  choice: como ele prometeu
  rationale: καθώς expressa conformidade ou comparação. “Como ele prometeu” é natural em português e conserva essa relação.
- source_word: διὰ τοῦ νόμου
  choice: por meio da Lei
  rationale: διά com o genitivo indica aqui o meio pelo qual a promessa foi comunicada. A inicial maiúscula sinaliza a Lei de Moisés no contexto judaico.
- source_word: ἐλπίζομεν ... ἐπὶ τῷ θεῷ
  choice: esperamos em Deus
  rationale: A construção expressa depositar a esperança em alguém; “esperamos em Deus” é idiomático e fiel.
- source_word: ταχέως
  choice: em breve
  rationale: No contexto de uma ação divina futura, o advérbio indica que se espera que ela aconteça logo; “em breve” é natural e digno.
- source_word: ἐλεήσει
  choice: terá misericórdia de nós
  rationale: ἐλεέω significa mostrar ou ter misericórdia. A formulação mantém o tom teológico sem arcaísmo.
- source_word: ἐπισυνάξει
  choice: nos reunirá
  rationale: O verbo denota ajuntar pessoas dispersas e pode sugerir restauração. “Nos reunirá” preserva esse sentido.
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανόν
  choice: de todas as partes debaixo do céu
  rationale: A expressão grega é elíptica e aponta para os lugares da dispersão sob o céu. A explicitação “de todas as partes” torna a frase compreensível em português sem eliminar a imagem do texto-fonte.
- source_word: εἰς τὸν ἅγιον τόπον
  choice: no santo lugar
  rationale: τόπος significa “lugar”, e ἅγιος o caracteriza como sagrado. “No” comunica naturalmente o movimento para esse destino em português.
- source_word: ἐξείλατο
  choice: livrou
  rationale: Na voz média, ἐξαιρέω significa resgatar ou livrar de perigo. “Livrou” é corrente e adequado ao registro bíblico.
- source_word: ἐκ μεγάλων κακῶν
  choice: de grandes males
  rationale: κακά abrange males, calamidades e aflições. “Grandes males” mantém essa amplitude sem decidir entre mal moral e sofrimento.
- source_word: τὸν τόπον ἐκαθάρισεν
  choice: purificou o lugar
  rationale: καθαρίζω pode significar limpar ou purificar; no contexto de um local sagrado, “purificou” comunica melhor a dimensão ritual, enquanto “lugar” preserva o substantivo genérico τόπος.
theological_decisions:
- issue: Referente de “o santo lugar” e “o lugar”
  choice: Manter “lugar” nas duas ocorrências
  alternative: “santuário” ou “templo”
  rationale: O contexto aponta para a área sagrada do templo em Jerusalém, mas o grego emprega τόπος, não um termo explícito para templo ou santuário. A tradução evita tornar o texto principal mais específico que a fonte.
- issue: Natureza dos “grandes males”
  choice: Preservar a expressão ampla “grandes males”
  alternative: “grandes calamidades” ou “grandes aflições”
  rationale: κακά pode designar tanto males quanto desgraças e sofrimentos. A escolha não restringe indevidamente a referência.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe foi suavemente explicitada onde o grego é elíptico, e as ambiguidades lexicais relevantes foram preservadas ou registradas em notas.
