  text: and the appearances from heaven that came to those who fought bravely with zeal for Judaism[a], so that, though they were few, they plundered the whole country and drove off the barbarian hordes[c][b],
translation:
  language: pt
  text: e as manifestações que vieram do céu aos que combateram valentemente e com zelo pelo judaísmo[b][a], de modo que, embora fossem poucos, saquearam toda a região e puseram em fuga as multidões bárbaras[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aparições vindas do céu” ou “epifanias celestes”.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “judaísmo” se refere à religião e ao modo de vida judaicos defendidos contra a pressão estrangeira.
    reason: cultural_note
  - marker: c
    text: “Multidões bárbaras” reproduz a designação etnocultural do próprio texto grego; outra tradução possível é “multidões estrangeiras”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφανείας
  choice: manifestações
  rationale: O substantivo indica aparições ou manifestações visíveis. “Manifestações” comunica com naturalidade uma intervenção perceptível sem impor um sentido técnico posterior.
- source_word: τὰς ἐξ οὐρανοῦ γενομένας
  choice: vindas do céu
  rationale: A expressão preserva a origem celestial e apresenta as manifestações como acontecimentos, sem a formulação pouco natural “que aconteceram do céu”.
- source_word: τοῖς ... ἀνδραγαθήσασιν
  choice: concedidas aos que combateram valentemente
  rationale: O dativo identifica os beneficiários das manifestações, e o verbo, em contexto militar, descreve uma atuação corajosa. “Concedidas” explicita de modo natural a relação dativa, sem especificar a forma da intervenção.
- source_word: φιλοτίμως
  choice: com zelo
  rationale: O advérbio expressa dedicação zelosa ou empenho honroso; “com zelo” mantém esse elemento sem o fundir com a ideia distinta de valentia.
- source_word: ὑπὲρ τοῦ Ἰουδαισμοῦ
  choice: pelo judaísmo
  rationale: O termo designa a religião e o modo de vida judaicos defendidos diante da pressão estrangeira. “Judaísmo” é o equivalente direto e estabelecido.
- source_word: ὡς
  choice: de modo que
  rationale: Neste contexto, introduz o resultado surpreendente da intervenção e da luta; “de modo que” expressa essa consequência com clareza.
- source_word: τὴν ὅλην χώραν
  choice: toda a região
  rationale: χώρα pode significar terra, território ou região. “Toda a região” é natural no contexto geográfico-militar e evita sugerir necessariamente um Estado nacional moderno.
- source_word: ὀλίγους ὄντας
  choice: embora fossem poucos
  rationale: A construção participial tem força concessiva e ressalta o contraste entre o pequeno número dos combatentes e seu êxito.
- source_word: λεηλατεῖν
  choice: saquearam
  rationale: O verbo denota pilhar ou tomar despojos; “saquearam” preserva diretamente a força militar e moralmente incômoda do original.
- source_word: τὰ βάρβαρα πλήθη
  choice: as multidões bárbaras
  rationale: A tradução conserva tanto o substantivo coletivo quanto a designação etnocultural polemicamente marcada do texto grego, sem intensificá-la para “hordas”.
- source_word: διώκειν
  choice: puseram em fuga
  rationale: Embora o verbo possa significar “perseguir”, aqui descreve o êxito militar contra as forças adversárias. “Puseram em fuga” comunica o resultado sem acrescentar a ideia de aniquilação.
theological_decisions:
- issue: Sentido de Ἰουδαϊσμός no contexto histórico de 2 Macabeus
  choice: judaísmo
  alternative: modo de vida judaico
  rationale: O grego nomeia uma identidade religiosa e cultural defendida contra pressões helenizantes. O termo direto preserva a formulação do texto, enquanto a nota esclarece sua amplitude histórica.
- issue: Natureza das ἐπιφάνειαι vindas do céu
  choice: manifestações vindas do céu
  alternative: aparições celestes
  rationale: A redação mantém aberta a natureza exata desses acontecimentos perceptíveis e não determina se consistiram em seres visíveis, sinais ou outra forma de intervenção divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A oração mantém o caráter de continuação sintática indicado pelo “e” inicial e pela vírgula final. Preservam-se a linguagem militar, a referência cultural ao judaísmo e o rótulo polêmico do original, este último acompanhado de nota explicativa.
