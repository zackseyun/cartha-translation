  text: But when it happened that time had passed and the sun shone out[a], though it had been overcast, a great fire was kindled, so that everyone marveled.
translation:
  language: pt
  text: Mas, depois de algum tempo, o sol brilhou, embora estivesse encoberto por nuvens[a], e acendeu-se um grande fogo, de modo que todos ficaram maravilhados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enquanto estava encoberto por nuvens”. A expressão grega também pode ser entendida mais literalmente como “estando nublado”.'
    reason: alternativa lexical e sintática
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο καὶ χρόνος διῆλθεν
  choice: Mas, depois de algum tempo
  rationale: Expressa de modo natural a transição temporal introduzida por δέ e o decorrer do tempo, sem reproduzir de forma artificial o idiomatismo ὡς ἐγένετο.
- source_word: ὅ τε ἥλιος ἀνέλαμψεν
  choice: o sol brilhou
  rationale: ἀναλάμπω indica que o sol resplandeceu ou irrompeu em brilho; a formulação escolhida é clara e preserva o sentido básico.
- source_word: ἐπινεφὴς ὤν
  choice: embora estivesse encoberto por nuvens
  rationale: O adjetivo significa ‘nublado’ ou ‘encoberto por nuvens’. A leitura concessiva se ajusta ao contexto, mas a possível leitura simultânea é preservada em nota.
- source_word: ἀνήφθη πυρὰ μεγάλη
  choice: acendeu-se um grande fogo
  rationale: Mantém a referência genérica de πυρά a um fogo ou grande chama, sem acrescentar no texto principal que se tratava especificamente de fogo sacrificial.
- source_word: ὥστε θαυμάσαι πάντας
  choice: de modo que todos ficaram maravilhados
  rationale: Reproduz a ideia de resultado expressa por ὥστε com infinitivo e conserva o alcance universal de πάντας.
theological_decisions:
- issue: Natureza de πυρά no contexto
  choice: grande fogo
  alternative: grande fogo sacrificial
  rationale: Embora o contexto mais amplo esteja ligado ao sacrifício, o grego deste versículo diz apenas πυρὰ μεγάλη. A tradução evita explicitar uma interpretação contextual que o texto não declara aqui.
- issue: Relação de ἐπινεφὴς ὤν com o brilho do sol
  choice: 'leitura concessiva: “embora estivesse encoberto por nuvens”'
  alternative: 'leitura simultânea: “enquanto estava encoberto por nuvens”'
  rationale: A construção grega permite mais de uma relação circunstancial. A leitura concessiva é natural no contexto, mas a alternativa é indicada em nota para não eliminar a ambiguidade.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A ordem foi levemente ajustada para fluidez, preservando a progressão temporal, o brilho do sol, o acendimento do fogo e a reação coletiva.
