base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/030.yaml
  text: And after crushing the forces around Timothy and Bacchides[a], they killed more than twenty thousand of them, gained firm control of very high strongholds, and divided the plentiful plunder, making themselves equal sharers with the oppressed and orphans and widows, and even with the elderly.
translation:
  language: pt
  text: Depois de esmagarem as forças de Timóteo e Báquides, mataram mais de vinte mil deles, passaram a controlar plenamente fortalezas muito elevadas e repartiram o abundante despojo, dando a si mesmos uma parte igual à dos oprimidos, dos órfãos, das viúvas e até dos idosos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dando partes iguais aos oprimidos, aos órfãos, às viúvas e até aos idosos”. O pronome grego admite as duas interpretações; o texto principal entende que os próprios combatentes receberam partes iguais às desses grupos vulneráveis.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνερείσαντες
  choice: depois de esmagarem
  rationale: O particípio expressa uma derrota violenta e decisiva; “esmagarem” preserva essa força no contexto militar.
- source_word: τοὺς περὶ Τιμόθεον καὶ Βακχίδην
  choice: as forças de Timóteo e Báquides
  rationale: A construção οἱ περὶ + nome designa o grupo associado aos líderes; “as forças de” comunica naturalmente o sentido militar sem sugerir apenas os dois homens.
- source_word: ὑπὲρ τοὺς δισμυρίους
  choice: mais de vinte mil
  rationale: Traduz diretamente o numeral e a ideia de exceder indicada por ὑπέρ com acusativo.
- source_word: ἀνεῖλον
  choice: mataram
  rationale: No relato de batalha, o verbo significa matar; a formulação é direta e atual.
- source_word: ὀχυρωμάτων ὑψηλῶν εὖ μάλα ἐγκρατεῖς ἐγένοντο
  choice: tomaram pleno controle de fortalezas muito elevadas
  rationale: ἐγκρατεῖς ἐγένοντο indica domínio ou posse efetiva; “muito elevadas” representa ὑψηλῶν intensificado por εὖ μάλα.
- source_word: λάφυρα πλείονος
  choice: o abundante despojo
  rationale: A expressão indica grande quantidade de bens capturados; “despojo” é natural e digno em narrativa militar bíblica.
- source_word: ἐμερίσαντο
  choice: repartiram
  rationale: O verbo denota dividir ou distribuir em porções; “repartiram” prepara naturalmente a referência às partes iguais.
- source_word: ἰσομοίρους αὐτοὺς ... ποιήσαντες
  choice: fazendo de si mesmos participantes em partes iguais com
  rationale: Entende αὐτούς em sentido reflexivo, retomando o grupo que age. A formulação preserva a ideia de que os combatentes aceitaram porções iguais às dos grupos vulneráveis.
- source_word: τοῖς ἠκισμένοις
  choice: os oprimidos
  rationale: O termo designa pessoas maltratadas ou sujeitas a injustiça; “oprimidos” se ajusta à lista de grupos vulneráveis.
- source_word: πρεσβυτέροις
  choice: os idosos
  rationale: Neste contexto distributivo, refere-se provavelmente a pessoas de idade avançada, não a titulares de um ofício comunitário.
theological_decisions:
- issue: Referente de αὐτούς em ἰσομοίρους αὐτοὺς ... ποιήσαντες
  choice: Os combatentes fizeram de si mesmos participantes em partes iguais com os grupos vulneráveis.
  alternative: Eles deram aos oprimidos, órfãos, viúvas e idosos partes iguais às suas.
  rationale: O pronome pode retomar reflexivamente o grupo agente, embora também possa apontar aos beneficiários. A leitura principal segue a primeira possibilidade, e a nota conserva a ambiguidade sintática real.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário internacional. A sintaxe mantém a sequência vigorosa do grego sem soar arcaica; a nota preserva a ambiguidade do pronome.
