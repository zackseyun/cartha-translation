base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/023.yaml
  text: He also brought Eleazar[a], and after bringing forward the holy book and giving the watchword[b], “God’s Help,” he himself led the first company and engaged Nicanor.
translation:
  language: pt
  text: 23 Designou também Eleazar.[a] Depois de apresentar o livro sagrado e dar como senha “Socorro de Deus”[b], ele próprio se pôs à frente da primeira companhia[c] e entrou em combate com Nicanor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz literalmente apenas “também Eleazar”; o verbo “designou” é retomado do versículo anterior.
    reason: contextual_ellipsis
  - marker: b
    text: Ou “Ajuda de Deus”; a expressão grega é condensada e também pode ser entendida como “Deus é socorro”.
    reason: lexical_alternative
  - marker: c
    text: O termo militar também pode ser traduzido por “primeira coorte” ou “primeiro destacamento”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι δὲ καὶ Ἐλεάζαρον
  choice: Designou também Eleazar
  rationale: A expressão traz apenas o nome de Eleazar no acusativo; o verbo “designou” é retomado do contexto imediatamente anterior, no qual Judas estabelece os comandantes. Essa retomada produz uma frase natural em português sem atribuir a παραγαγών, cujo objeto é “o livro sagrado”, uma relação sintática com Eleazar.
- source_word: παραγαγὼν τὴν ἱερὰν βίβλον
  choice: Depois de apresentar o livro sagrado
  rationale: O particípio aoristo introduz uma ação anterior ao verbo principal, e παράγω pode indicar trazer ou fazer avançar algo diante do grupo. “Apresentar” comunica de modo natural que o livro foi trazido à presença dos combatentes, sem especificar que se tratava materialmente de um rolo nem afirmar explicitamente que houve leitura.
- source_word: σύνθημα
  choice: senha
  rationale: No contexto militar, σύνθημα designa um sinal ou uma palavra combinada para identificação e mobilização. “Senha” é clara e corrente em português, mantendo a função militar do termo.
- source_word: θεοῦ Βοηθείας
  choice: Socorro de Deus
  rationale: A expressão grega é condensada e funciona como conteúdo da senha. “Socorro de Deus” preserva a relação genitiva e o caráter breve de um lema, sem transformar a expressão numa oração completa.
- source_word: τῆς πρώτης σπείρης
  choice: da primeira companhia
  rationale: σπεῖρα designa uma unidade militar. “Companhia” é compreensível e evita sugerir com demasiada precisão uma coorte formalmente romana.
- source_word: αὐτὸς προηγούμενος
  choice: ele próprio se pôs à frente
  rationale: A formulação conserva tanto a ênfase de αὐτός quanto a ideia de liderança pessoal na dianteira expressa pelo particípio προηγούμενος.
- source_word: συνέβαλε τῷ Νικάνορι
  choice: entrou em combate com Nicanor
  rationale: No relato militar, συμβάλλω com dativo indica encontrar-se ou travar batalha com alguém. A tradução não apresenta Judas unilateralmente como agressor e exprime com clareza o início do confronto.
theological_decisions:
- issue: Sujeito implícito da sequência de particípios e do verbo principal
  choice: 'Judas continua sendo o sujeito: ele apresenta o livro, dá a senha, lidera a primeira companhia e combate Nicanor.'
  alternative: Eleazar poderia ser entendido como figura mais diretamente ligada a uma ou mais dessas ações.
  rationale: Eleazar aparece no acusativo e depende do verbo retomado do versículo anterior, enquanto a cadeia participial e o verbo principal continuam naturalmente com o sujeito narrativo anterior, Judas. Ainda assim, a construção é compacta e algumas tradições de tradução associam Eleazar à apresentação ou leitura do livro.
- issue: Conteúdo exato da senha θεοῦ Βοηθείας
  choice: “Socorro de Deus”
  alternative: “Ajuda de Deus” ou “Deus é socorro”
  rationale: O grego permite mais de uma análise da fórmula breve. A tradução principal mantém a construção nominal e a relação com Deus sem convertê-la numa afirmação verbal mais explícita.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluente. “Socorro” conserva um tom elevado sem ser arcaico; “companhia” comunica a organização militar sem impor uma estrutura romana excessivamente específica. A elipse inicial foi explicitada a partir do contexto e sinalizada em nota.
