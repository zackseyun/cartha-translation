  source_fidelity: A tradução preserva adequadamente a elipse que introduz Eleazar, suprindo de modo plausível, a partir do contexto militar imediato, «Designou». Mantém Judas como sujeito da sequência «apresentar o livro», «dar a senha», liderar e entrar em combate. «Apresentar o livro sagrado», «senha», «primeira companhia» e «entrou em combate com Nicanor» representam bem os elementos gregos sem acrescentar pormenores materiais ou táticos indevidos.
