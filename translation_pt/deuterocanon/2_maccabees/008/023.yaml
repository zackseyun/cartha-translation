  terminology: «Livro sagrado» traduz naturalmente τὴν ἱερὰν βίβλον, sem decidir se o objeto material era um rolo. «Socorro de Deus» conserva a brevidade nominal e a ambiguidade sintática de θεοῦ Βοηθείας; a nota registra alternativas pertinentes. «Companhia» é uma boa solução legível para σπεῖρα e a nota evita falsa precisão terminológica.
