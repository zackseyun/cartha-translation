base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/019.yaml
  text: And he also recounted to them the help that had come to their forefathers[a], and the one against Sennacherib[b], how a hundred eighty-five thousand were destroyed.
translation:
  language: pt
  text: 'Além disso, recordou-lhes os auxílios recebidos por seus antepassados[a] e o auxílio contra Senaquerib[b]: como cento e oitenta e cinco mil pereceram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os livramentos concedidos a seus antepassados”. O termo grego pode indicar atos de ajuda, socorro ou resgate.
    reason: lexical_alternative
  - marker: b
    text: Alusão à destruição do exército de Senaquerib nos dias de Ezequias; ver 2 Reis 19:35 e Isaías 37:36.
    reason: cross_reference
lexical_decisions:
- source_word: προσαναλεξάμενος
  choice: recordou-lhes
  rationale: O particípio descreve a recapitulação verbal de acontecimentos passados diante dos homens de Judas. “Recordou-lhes” é natural em português e inclui a ideia de trazer os fatos novamente à memória.
- source_word: ἀντιλήμψεις
  choice: auxílios
  rationale: O substantivo indica atos de ajuda ou socorro em situação crítica. “Auxílios” preserva o plural grego e evita especificar no texto principal uma agência que a oração não nomeia expressamente.
- source_word: ἐπὶ τῶν προγόνων γενομένας
  choice: recebidos por seus antepassados
  rationale: A formulação comunica que os antepassados foram beneficiários desses auxílios. Embora “ocorridos no tempo de seus antepassados” seja mais estruturalmente literal, a escolha adotada é mais clara e continua sem nomear explicitamente o agente.
- source_word: τὴν ἐπὶ Σεναχηρεὶμ
  choice: o auxílio contra Senaquerib
  rationale: O artigo e a expressão preposicional retomam elipticamente ἀντιλήμψεις. Repetir “auxílio” torna a referência clara e idiomática em português.
- source_word: ἑκατὸν ὀγδοήκοντα πέντε χιλιάδες
  choice: cento e oitenta e cinco mil
  rationale: Tradução direta e convencional do numeral em português.
- source_word: ὡς ἀπώλοντο
  choice: quando cento e oitenta e cinco mil pereceram
  rationale: No contexto da recordação, ὡς introduz o acontecimento ligado à intervenção contra Senaquerib. “Pereceram” conserva a ausência de agente expresso e evita tornar explícito quem os destruiu.
theological_decisions:
- issue: Agência divina implícita nos auxílios aos antepassados e na morte das forças de Senaquerib
  choice: Não acrescentar “Deus” como agente no texto principal.
  alternative: “os auxílios que Deus concedeu a seus antepassados” e “quando Deus destruiu cento e oitenta e cinco mil”
  rationale: A tradição histórica evocada atribui a libertação a Deus, mas esta oração grega não o nomeia explicitamente. A tradução mantém a alusão e preserva a forma implícita do original.
- issue: Identidade dos cento e oitenta e cinco mil
  choice: Manter apenas o numeral, sem acrescentar “soldados” ou “homens”.
  alternative: “cento e oitenta e cinco mil soldados pereceram”
  rationale: O contexto histórico indica o exército de Senaquerib, mas o substantivo não aparece nesta oração. Não explicitá-lo preserva a concisão e a elipse do grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Além disso” representa a progressão marcada pelo particípio e pelas partículas gregas; “Senaquerib” segue a forma bíblica portuguesa consagrada. A redação conserva as elipses relevantes sem sacrificar a compreensão.
