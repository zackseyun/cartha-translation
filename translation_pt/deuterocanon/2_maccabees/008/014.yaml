base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/014.yaml
  text: But they were selling all that remained[a], and at the same time were imploring the Lord to rescue those who had been sold by the ungodly Nikanor before he encountered them.
translation:
  language: pt
  text: Eles, porém, vendiam tudo o que lhes restava e, ao mesmo tempo, suplicavam ao Senhor que livrasse aqueles que o ímpio Nicanor havia vendido[a] antes de encontrá-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, possivelmente vendidos como escravos. O grego diz apenas «vendidos».
    reason: Esclarece a implicação contextual da venda sem inseri-la como elemento explícito do texto grego, e concorda com o referente plural.
lexical_decisions:
- source_word: τὰ περιλελειμμένα πάντα
  choice: tudo o que lhes restava
  rationale: Expressa de modo natural o sentido abrangente de tudo aquilo que ainda permanecia, sem especificar além do grego se eram bens ou posses.
- source_word: ἐπώλουν
  choice: vendiam
  rationale: O imperfeito grego indica uma ação em andamento ou repetida; o imperfeito português preserva esse aspecto.
- source_word: ὁμοῦ δὲ
  choice: e, ao mesmo tempo
  rationale: Marca a simultaneidade entre a venda dos bens restantes e a súplica ao Senhor.
- source_word: τὸν κύριον
  choice: ao Senhor
  rationale: No contexto de uma súplica dirigida a Deus, «Senhor» é a tradução adequada e tradicional de κύριος.
- source_word: ἠξίουν
  choice: suplicavam
  rationale: Comunica a intensidade do pedido feito a Deus em uma situação de grave perigo.
- source_word: ῥύσασθαι
  choice: que livrasse
  rationale: Transmite a ideia de retirar alguém do perigo sem acrescentar conotações soteriológicas mais amplas.
- source_word: τοὺς ... πεπραμένους
  choice: aqueles que ... havia vendido
  rationale: Preserva a anterioridade e o resultado vigente do particípio perfeito, sem acrescentar no texto principal que a venda era para escravidão.
- source_word: ὑπὸ τοῦ δυσσεβοῦς Νικάνορος
  choice: que o ímpio Nicanor havia vendido
  rationale: «Ímpio» preserva a forte avaliação moral e religiosa de δυσσεβής; «Nicanor» é a forma corrente do nome em português.
- source_word: πρὶν συντυχεῖν
  choice: antes de encontrá-los
  rationale: Mantém a noção de um encontro ainda não ocorrido e deixa que o contexto indique seu caráter hostil, sem tornar explícito no texto algo que o verbo não especifica por si só.
theological_decisions:
- issue: Tradução de κύριος em uma oração dirigida a Deus
  choice: Senhor
  alternative: senhor ou mestre
  rationale: O referente é Deus, e o contexto de oração elimina a necessidade de conservar no texto uma ambiguidade lexical meramente abstrata.
- issue: Explicitar que os vendidos seriam escravizados
  choice: aqueles que ... havia vendido
  alternative: aqueles que havia vendido como escravos
  rationale: O contexto indica venda para escravidão, mas πεπραμένους diz literalmente apenas «vendidos». O texto principal não acrescenta essa especificação; a nota registra a implicação contextual.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção fluente e sem arcaísmos. O marcador da nota foi colocado junto a «vendido», expressão à qual a explicação lexical se refere.
