base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/011.yaml
  text: So he immediately sent to the cities along the coast[a], inviting them to buy Jewish bodies, promising to hand over ninety bodies for a talent[b]; but he did not expect the punishment from the Almighty that was about to come upon him.
translation:
  language: pt
  text: Imediatamente, mandou avisar as cidades costeiras, convidando-os a comprar corpos de judeus[a] e prometendo entregar noventa corpos por um talento. Mas não esperava o castigo[b] da parte do Todo-Poderoso, que estava prestes a alcançá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “corpos”, referindo-se a judeus tratados como cativos negociáveis. Algumas traduções suavizam a expressão para “pessoas” ou explicitam a implicação como “escravos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a justiça da parte do Todo-Poderoso, que estava prestes a alcançá-lo”. A palavra grega pode indicar tanto a justiça em ação quanto o castigo resultante.
    reason: alternative_reading
lexical_decisions:
- source_word: παραθαλασσίους πόλεις
  choice: cidades costeiras
  rationale: Expressa de modo natural e preciso as cidades situadas junto ao mar.
- source_word: προκαλούμενος ἐπʼ ἀγορασμόν
  choice: um convite para comprarem
  rationale: No contexto comercial, o particípio indica uma convocação ou solicitação dirigida a possíveis compradores; a formulação verbal é clara em português.
- source_word: Ἰουδαίων σωμάτων
  choice: corpos de judeus
  rationale: Preserva a linguagem deliberadamente desumanizadora do grego, que trata os judeus como mercadoria, sem acrescentar ao texto a palavra interpretativa “escravos”.
- source_word: ἐνενήκοντα σώματα ταλάντου παραχωρήσειν
  choice: entregar noventa corpos por um talento
  rationale: 'Mantém a formulação comercial condensada e apresenta a expressão como uma proporção: noventa cativos em troca de um talento.'
- source_word: οὐ προσδεχόμενος
  choice: não esperava
  rationale: Comunica naturalmente que ele não previa nem levava em conta o que estava por vir.
- source_word: τὴν ... δίκην
  choice: o castigo
  rationale: No contexto de retribuição divina iminente, δίκη pode indicar a consequência punitiva da justiça; a ambiguidade com “justiça” é registrada em nota.
- source_word: μέλλουσαν παρακολουθήσειν αὐτῷ
  choice: que estava prestes a alcançá-lo
  rationale: Reproduz a ideia de algo que viria em seu encalço e o atingiria, em português atual e idiomático.
- source_word: τοῦ παντοκράτορος
  choice: do Todo-Poderoso
  rationale: É a forma portuguesa consagrada e inteligível do título divino que enfatiza poder e soberania universais.
theological_decisions:
- issue: Título divino παντοκράτωρ
  choice: Todo-Poderoso
  alternative: Soberano de tudo
  rationale: “Todo-Poderoso” é a equivalência tradicional e natural em português, preservando a ênfase no domínio e poder universais sem introduzir uma formulação doutrinária adicional.
- issue: Manter ou suavizar σώματα
  choice: corpos de judeus
  alternative: judeus; pessoas judias; escravos judeus
  rationale: “Corpos” conserva a objetificação chocante do original. “Pessoas” atenuaria sua força retórica, enquanto “escravos” tornaria explícita uma implicação contextual que o grego não nomeia diretamente.
- issue: Sentido de δίκη
  choice: castigo
  alternative: justiça
  rationale: O contexto favorece a consequência punitiva da justiça divina, mas o termo grego também pode designar a própria justiça em ação; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “enviou ... um convite” explicita apenas o complemento implícito do verbo grego e evita a forma pouco natural “enviou às cidades”. A repetição de “corpos” é intencional, pois conserva a brutal linguagem mercantil do original.
