  text: having appointed his brothers to lead each division[a], Simon and Joseph and Jonathan, assigning to each one a thousand men in addition to five hundred,
translation:
  language: pt
  text: Tendo designado seus irmãos — Simão, José e Jônatas — para liderar cada divisão, atribuindo a cada um mil homens além de quinhentos[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “mil, além de quinhentos”, isto é, 1.500 sob o comando de cada líder.
    reason: Esclarece a expressão numérica aditiva do grego sem substituí-la no texto principal.
lexical_decisions:
- source_word: τάξας
  choice: Depois de pôr
  rationale: O particípio aoristo apresenta uma ação preparatória. “Depois de pôr” expressa com naturalidade a relação circunstancial sem antecipar o verbo principal do contexto seguinte.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: seus irmãos
  rationale: Mantém o sentido familiar direto do grego, confirmado pelos três nomes que vêm em seguida.
- source_word: προηγουμένους
  choice: à frente
  rationale: Embora o verbo signifique literalmente “ir adiante”, no contexto militar indica exercer liderança ou comando.
- source_word: ἑκάτερας τάξεως
  choice: de cada divisão
  rationale: τάξις designa aqui uma formação ou unidade militar; “divisão” é claro e corrente, e conserva a distribuição indicada pelo grego.
- source_word: ὑποτάξας
  choice: colocou sob o comando
  rationale: Reproduz a imagem do grego de pôr soldados sob a autoridade de cada líder, com maior precisão militar do que o simples “designou”.
- source_word: ἑκάστῳ
  choice: de cada um
  rationale: Explicita a distribuição individual entre Simão, José e Jônatas.
- source_word: χιλίους πρὸς τοῖς πεντακοσίοις
  choice: mil homens, além de quinhentos
  rationale: Preserva a construção aditiva do grego, cujo total é 1.500 para cada comandante; “homens” é suprido naturalmente por se tratar de tropas.
