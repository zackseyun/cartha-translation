  yaml_path: translation/deuterocanon/2_maccabees/008/026.yaml
  text: For it was the day before the Sabbath[a], and for that reason they did not continue pursuing them for long.
translation:
  language: pt
  text: Pois era o dia anterior ao sábado[a]; por essa razão, não continuaram por muito tempo a persegui-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão grega traduzida como «o dia anterior ao sábado» é textual e lexicalmente difícil na redação de Swete («ἡ πρὸ τοῦ σαββάτου δίκη»). A tradução segue o sentido contextual claro: a proximidade do sábado limitou a duração da perseguição.'
    reason: textual_variant
lexical_decisions:
- source_word: ἦν γὰρ
  choice: Pois era
  rationale: γάρ introduz a razão da ação precedente; «Pois era» preserva a ligação explicativa em português natural.
- source_word: ἡ πρὸ τοῦ σαββάτου δίκη
  choice: o dia anterior ao sábado
  rationale: 'Embora δίκη seja lexical e textualmente difícil nesta expressão, πρὸ τοῦ σαββάτου e o contexto indicam um sentido temporal: o dia que antecedia o sábado.'
- source_word: διʼ ἣν αἰτίαν
  choice: por essa razão
  rationale: Reproduz de modo claro e corrente a relação causal expressa pela locução grega.
- source_word: οὐκ ἐμακροτόνησαν
  choice: não prolongaram
  rationale: O verbo indica que não estenderam por muito tempo a ação expressa pelo particípio seguinte.
- source_word: κατατρέχοντες αὐτούς
  choice: a perseguição contra eles
  rationale: κατατρέχω descreve perseguir ou correr no encalço de adversários; a formulação nominal produz uma frase natural sem perder o contexto militar.
