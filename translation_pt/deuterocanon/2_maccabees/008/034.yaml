  revision_rationale: A revisão torna inequívoco que os judeus eram aqueles que Nicanor pretendia vender e aproxima a sintaxe portuguesa da qualificação direta presente no grego. Mantém-se «três vezes maldito», uma opção legível que conserva a intensificação formal e a carga pejorativa do raro τρισαλιτήριος, com nota para alternativas plausíveis.
