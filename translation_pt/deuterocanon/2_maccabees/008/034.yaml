  text: Mas o três vezes maldito Nicanor, que havia trazido três mil comerciantes para vender os judeus,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρισαλιτήριος
  choice: três vezes maldito
  rationale: Preserva o elemento intensificador τρις- (“três vezes”) e a forte censura moral e religiosa do raro adjetivo ἀλιτήριος. A expressão é compreensível em português e evita reduzir o termo a um insulto meramente emocional.
- source_word: Νικάνωρ
  choice: Nicanor
  rationale: Forma tradicional e amplamente reconhecível do nome grego em português.
- source_word: τρισχιλίους ἐμπόρους
  choice: três mil comerciantes
  rationale: Tradução direta do numeral e do substantivo que designa negociantes trazidos para comprar os cativos.
- source_word: ἐπὶ τὴν πρᾶσιν τῶν Ἰουδαίων
  choice: para a venda dos judeus
  rationale: A preposição com o acusativo expressa finalidade; a formulação mantém explicitamente os judeus como aqueles que seriam vendidos.
- source_word: ἀγαγών
  choice: que havia trazido
  rationale: O particípio aoristo fornece uma circunstância anterior à ação principal da frase mais ampla; o mais-que-perfeito composto comunica essa relação com naturalidade.
theological_decisions:
- issue: Sentido do raro insulto τρισαλιτήριος
  choice: três vezes maldito
  alternative: completamente impuro; extremamente perverso; três vezes miserável
  rationale: A opção conserva tanto a intensificação formal quanto a possível carga moral-religiosa, sem decidir de modo silencioso entre todas as nuances de culpa, impureza, desgraça e maldição presentes no termo raro.
translation_notes:
  register: Português atual, claro e digno, com a ordem do período preservada porque o texto-fonte fornecido é apenas o início de uma frase que continua além deste trecho. “Judeus” é usado no sentido etnorreligioso natural neste contexto.
