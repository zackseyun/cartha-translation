    rationale: O grego qualifica diretamente Nicanor por τρισαλιτήριος. A revisão preserva o insulto e a intensificação sem inserir o substantivo genérico «homem».
  revised_text: Mas o três vezes maldito Nicanor, que havia trazido três mil comerciantes para vender os judeus,
