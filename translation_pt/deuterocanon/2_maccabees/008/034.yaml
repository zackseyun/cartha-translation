    rationale: ἐπὶ τὴν πρᾶσιν τῶν Ἰουδαίων indica que os judeus seriam vendidos. Em português, «venda dos judeus» também pode sugerir uma venda feita por eles. «Para vender os judeus» explicita a relação exigida pelo contexto sem acrescentar informação.
  - severity: low
