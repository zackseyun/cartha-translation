  verdict: revise
  source_fidelity: 'A tradução conserva os elementos centrais: Nicanor, os três mil comerciantes, a finalidade de vender os judeus e a anterioridade de ἀγαγών. Contudo, «para a venda dos judeus» pode ser lido como uma venda realizada pelos judeus, enquanto o genitivo grego designa os judeus como as pessoas destinadas à venda.'
  naturalness: «Aquele homem três vezes maldito» é compreensível, mas introduz «homem» sem necessidade e torna menos direta a construção atributiva do grego. «O três vezes maldito Nicanor» é claro, solene sem ser arcaizante e preserva a posição qualificativa.
  terminology: «Nicanor» é a forma tradicional portuguesa e é adequada. «Três vezes maldito» mantém de modo explícito a intensificação τρις- e a invectiva grave de τρισαλιτήριος. A nota deve apresentar as alternativas como possibilidades lexicais, sem fazer de «impuro» a única nuance determinante.
