base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/020.yaml
  text: 'And the engagement in Babylonia against the Galatians had gone this way: when all who came to the need were eight thousand[a], together with four thousand Macedonians, and the Macedonians were at a loss, the six thousand destroyed the one hundred twenty thousand because of the help coming to them from heaven, and they received great advantage.'
translation:
  language: pt
  text: 'E também o combate ocorrido na Babilônia contra os gálatas[a]: os que acorreram para enfrentar a emergência eram ao todo oito mil, acompanhados de quatro mil macedônios; quando os macedônios ficaram sem saber o que fazer, os seis mil destruíram os cento e vinte mil graças à ajuda que lhes vinha do céu e obtiveram grande vantagem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “gauleses”. O termo étnico grego pode ser traduzido das duas maneiras, conforme se enfatizem os gálatas da Anatólia ou sua identidade celta mais ampla.
    reason: alternative_reading
lexical_decisions:
- source_word: παράταξιν
  choice: combate
  rationale: O substantivo pode indicar uma formação de batalha ou o confronto travado; “combate” comunica naturalmente o sentido militar sem sugerir uma campanha prolongada.
- source_word: Γαλάτας
  choice: gálatas
  rationale: É a correspondência direta e tradicional do etnônimo grego; a possível identificação mais ampla como gauleses é preservada em nota.
- source_word: ἐπὶ τὴν χρείαν ἦλθον
  choice: acorreram para enfrentar a emergência
  rationale: A expressão descreve a ida em resposta a uma necessidade ou crise. Esta formulação mantém a ideia de urgência sem o português pouco natural de uma tradução estritamente literal.
- source_word: ἀπορουμένων
  choice: ficaram sem saber o que fazer
  rationale: O particípio exprime falta de recursos, perplexidade ou impasse; a formulação preserva essa amplitude sem impor especificamente derrota militar ou pressão externa.
- source_word: ἀπώλεσαν
  choice: destruíram
  rationale: Mantém a força ampla do verbo, que significa destruir ou fazer perecer, sem restringi-lo indevidamente a uma forma específica de morte.
- source_word: δώδεκα μυριάδας
  choice: cento e vinte mil
  rationale: Converte de modo claro a expressão numérica grega “doze miríades”, conservando o número apresentado pelo texto.
- source_word: διὰ τὴν γινομένην αὐτοῖς ἀπʼ οὐρανοῦ βοήθειαν
  choice: graças à ajuda que lhes vinha do céu
  rationale: Preserva tanto a relação causal quanto a origem celestial da ajuda, sem substituir a circunlocução do texto por uma referência explícita a Deus.
- source_word: ὠφέλειαν πολλὴν ἔλαβον
  choice: obtiveram grande vantagem
  rationale: ὠφέλεια pode indicar benefício, proveito ou vantagem; no contexto militar, “grande vantagem” permanece amplo e não reduz o resultado especificamente a despojos.
theological_decisions:
- issue: Referência da “ajuda ... do céu”
  choice: Manter a formulação reverencial “ajuda que lhes vinha do céu”.
  alternative: Explicitar “ajuda de Deus” ou entender a frase apenas como boa fortuna providencial.
  rationale: No grego judaico, “do céu” frequentemente alude à intervenção divina sem nomear Deus diretamente. A tradução conserva a reserva e a tensão teológica da expressão original.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe foi levemente reorganizada para tornar inteligível a sequência complexa do grego, sem corrigir nem harmonizar seus dados numéricos.
