  naturalness: O português do rascunho é geralmente claro e de registro apropriado. «Pagar o tributo que o rei devia aos romanos» é mais idiomático e evita a leitura contraditória de pagar ao rei uma quantia devida aos romanos.
  terminology: «Tributo», «talentos», «Nicanor» e «cativeiro» são adequados. «Cativeiro dos judeus» reflete αἰχμαλωσία de modo mais direto; a nota pode esclarecer que o dinheiro seria obtido mediante a captura e comercialização dos cativos, sem afirmar resgates, que o versículo não especifica.
