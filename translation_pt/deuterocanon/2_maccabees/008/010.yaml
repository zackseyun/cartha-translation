base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/010.yaml
  text: But Nikanor undertook to pay to the king the tribute owed to the Romans[a], amounting to two thousand talents[b], from the captivity of the Jews.
translation:
  language: pt
  text: Nicanor, porém, assumiu o compromisso de pagar o tributo que o rei devia aos romanos[a], no valor de dois mil talentos, com os recursos provenientes do cativeiro dos judeus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “o tributo ao rei, para os romanos”. O grego é conciso; no contexto, o sentido parece ser que Nicanor pretendia satisfazer, em favor do rei, a obrigação deste para com Roma.
    reason: alternative_reading
  - marker: b
    text: Isto é, por meio da captura dos judeus e do dinheiro obtido com a venda deles como cativos.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδιωτεύσατο
  choice: assumiu o compromisso
  rationale: Expressa que Nicanor tomou pessoalmente sobre si a obrigação, em português natural, sem definir em excesso a possível nuance administrativa do verbo.
- source_word: φόρον
  choice: tributo
  rationale: No contexto político-imperial, designa melhor o pagamento devido a uma potência superior do que o termo genérico “imposto”.
- source_word: τῷ βασιλεῖ
  choice: ao rei
  rationale: Tradução direta do dativo de destinatário.
- source_word: τοῖς ις Ῥωμαίοις
  choice: devido aos romanos
  rationale: A expressão grega é compacta e textualmente peculiar; o contexto indica o tributo relacionado à obrigação do rei para com Roma. A nota preserva a formulação mais literal.
- source_word: ὄντα τάλαντων δισχιλίων
  choice: no valor de dois mil talentos
  rationale: Formulação monetária natural que conserva sem conversão a unidade antiga.
- source_word: ἐκ τῆς τῶν Ἰουδαίων αἰχμαλωσίας
  choice: com o produto da captura dos judeus
  rationale: Explicita de modo sóbrio que a captura dos judeus seria a fonte dos recursos, provavelmente por venda ou resgate, evitando o sentido estático e menos claro de “cativeiro”.
- source_word: ἐκπληρώσειν
  choice: pagar
  rationale: No contexto financeiro, significa cumprir ou quitar a obrigação; “pagar” é a forma mais clara em português.
theological_decisions:
- issue: Relação sintática de τοῖς ις Ῥωμαίοις com o tributo e o rei
  choice: o tributo é entendido como devido aos romanos e pago ao rei
  alternative: “o tributo ao rei, para os romanos”
  rationale: O grego é condensado, mas o contexto favorece a ideia de Nicanor levantar recursos para cobrir a obrigação régia perante Roma. A tradução apresenta esse sentido provável, e a nota conserva a alternativa mais literal.
- issue: Sentido econômico de αἰχμαλωσία
  choice: recursos provenientes da captura dos judeus
  alternative: “do cativeiro dos judeus”
  rationale: A frase indica a fonte planejada do pagamento. A tradução não especifica no texto se o lucro viria de venda ou resgate, mantendo essa explicação como nota histórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Nicanor” segue a forma portuguesa tradicional. A ordem da frase foi ajustada para fluência, e a ambiguidade do grego foi preservada em nota.
