base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/029.yaml
  text: After doing these things[a], and making a common prayer of supplication[b], they begged the merciful Lord to be fully reconciled to his slaves.
translation:
  language: pt
  text: Depois de realizarem essas coisas e fazerem juntos uma súplica, imploraram ao Senhor misericordioso que se reconciliasse plenamente[b] com os seus escravos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «servos». O termo grego δοῦλοις pode ser traduzido das duas maneiras; «escravos» preserva aqui com mais força a ideia de pertencimento e dependência.
    reason: lexical_alternative
  - marker: b
    text: Ou «se reconciliasse por completo» ou «enfim se reconciliasse». A expressão grega εἰς τέλος pode intensificar a reconciliação ou indicar que ela chegou à sua conclusão.
    reason: alternative_reading
lexical_decisions:
- source_word: διαπραξάμενοι
  choice: depois de realizarem essas coisas
  rationale: O particípio resume como concluídas as ações anteriores, sem especificar além do que o grego afirma.
- source_word: κοινὴν ἱκετίαν ποιησάμενοι
  choice: fazerem juntos uma súplica
  rationale: Expressa de modo natural o caráter comum ou coletivo da súplica, preservando a ideia de um apelo religioso insistente.
- source_word: ἐλεήμονα κύριον
  choice: Senhor misericordioso
  rationale: Mantém κύριος como título divino e traduz ἐλεήμων pela designação corrente da disposição compassiva de Deus.
- source_word: ἠξίουν
  choice: imploraram
  rationale: Comunica a intensidade do pedido melhor do que o simples «pediram», sem tornar a expressão excessivamente dramática.
- source_word: εἰς τέλος καταλλαγῆναι
  choice: que se reconciliasse plenamente
  rationale: Preserva o sentido relacional de καταλλάσσω e entende εἰς τέλος como intensificação da reconciliação, mantendo em nota a possível nuance temporal ou de conclusão.
- source_word: τοῖς αὐτοῦ δούλοις
  choice: com os seus escravos
  rationale: Conserva o sentido forte de pertencimento e dependência expresso por δοῦλος; «servos» permanece uma alternativa legítima em português.
theological_decisions:
- issue: Sentido de δοῦλοις na relação com Deus
  choice: seus escravos
  alternative: seus servos
  rationale: O termo grego denota pessoas sujeitas a um senhor e ressalta aqui pertencimento e dependência. A tradução mantém essa força sem transformá-la em formulação doutrinária técnica.
- issue: Força de εἰς τέλος em relação a καταλλαγῆναι
  choice: se reconciliasse plenamente
  alternative: se reconciliasse por completo; enfim se reconciliasse
  rationale: A construção pode intensificar a reconciliação ou apresentá-la como levada à conclusão. O texto principal adota a primeira leitura, enquanto a nota preserva a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe corrente no Brasil e compreensão ampla no espaço lusófono. «Fazerem juntos uma súplica» evita o pouco idiomático «fazerem uma súplica comum», sem perder o caráter coletivo de κοινήν.
