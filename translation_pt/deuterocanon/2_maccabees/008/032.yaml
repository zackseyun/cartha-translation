  text: But they killed the commander among those with Timothy, a thoroughly worthless man who had caused the Jews much distress.
translation:
  language: pt
  text: Também mataram o comandante entre os que estavam com Timóteo, um homem intolerável[a], que havia causado muito sofrimento aos judeus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego pode referir-se a alguém a quem não se pode resistir ou enfrentar; neste contexto, também é entendido como «intolerável», «perverso» ou «sem escrúpulos».
    reason: Registra a amplitude de ἀνυπόστατος e mantém a leitura pejorativa exigida pelo contexto, sem eliminar a possível nuance de invencibilidade.
lexical_decisions:
- source_word: φυλάρχην
  choice: chefe tribal
  rationale: O termo designa literalmente o chefe de um povo ou tribo; preserva-se essa função específica em vez de reduzi-la ao sentido genérico de “comandante”.
- source_word: τῶν περὶ Τιμόθεον
  choice: que estava entre os homens de Timóteo
  rationale: A expressão indica o grupo em torno de Timóteo. “Entre” evita afirmar, além do grego, que ele comandava todas as forças de Timóteo.
- source_word: ἀνυπόστατον
  choice: temível
  rationale: O sentido básico é “a quem não se pode resistir/enfrentar”, daí “formidável” ou “temível”. A escolha mantém esse valor no contexto de um adversário militar; a tradição de tradução também admite uma leitura moral, registrada em nota.
- source_word: πολλὰ ... ἐπιλελυπηκότα
  choice: havia causado muito sofrimento
  rationale: A construção expressa que ele havia afligido intensamente os judeus; “muito sofrimento” é natural em português e conserva a intensidade do plural/adverbial πολλὰ.
