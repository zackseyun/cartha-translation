base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/033.yaml
  text: And while they were celebrating the victory in their homeland[a], they burned those who had set fire to the sacred gates, including Kallisthenes, who had fled into a certain house for shelter; and he received the reward worthy of his ungodliness.
translation:
  language: pt
  text: Enquanto celebravam a vitória em sua pátria, atearam fogo aos que haviam incendiado os portões sagrados e também a Calístenes, que se refugiara numa moradia[a]. E ele recebeu a recompensa que sua impiedade merecia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “num lugar de habitação”. O termo grego é incomum, e não se sabe ao certo que tipo de moradia está em vista.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπινίκια ... ἄγοντες
  choice: Enquanto celebravam a vitória
  rationale: A expressão idiomática descreve celebrações após a vitória; a formulação é natural em português e conserva o caráter festivo.
- source_word: ἐν τῇ πατρίδι
  choice: em sua pátria
  rationale: πατρίς designa a terra natal ou pátria; a escolha mantém o sentido coletivo sem especificar além do grego.
- source_word: τοὺς ἐμπρήσαντας τοὺς ἱεροὺς πυλῶνας
  choice: aos que haviam incendiado os portões sagrados
  rationale: O particípio indica ação anterior, e ἱερούς conserva a natureza cultual dos portões sem impor uma identificação arquitetônica mais específica.
- source_word: Καλλισθένην
  choice: Calístenes
  rationale: Forma tradicional e natural do nome grego em português.
- source_word: ὑφήψαν
  choice: atearam fogo
  rationale: O verbo significa acender ou incendiar, inclusive com a ideia de pôr fogo por baixo; a expressão portuguesa comunica diretamente a ação sem acrescentar explicitamente 'vivos', que não aparece no texto.
- source_word: εἰς ἐνοίκιον πεφευγότα
  choice: que se refugiara numa moradia[a]
  rationale: πεφευγότα indica que ele fugira ou buscara refúgio; ἐνοίκιον é incomum e parece indicar algum tipo de habitação, cuja natureza exata permanece incerta.
- source_word: τὸν ἄξιον τῆς δυσσεβείας ... μισθόν
  choice: a recompensa que sua impiedade merecia
  rationale: A formulação preserva a ideia irônica de μισθός como recompensa ou paga merecida e expressa com clareza a relação com a impiedade.
theological_decisions:
- issue: Força cultual de ἱεροὺς πυλῶνας
  choice: portões sagrados
  alternative: portões do templo
  rationale: “Sagrados” mantém a qualificação religiosa expressa no grego sem identificar de modo mais específico a estrutura arquitetônica.
- issue: Sentido moral e religioso de δυσσεβείας
  choice: impiedade
  alternative: irreverência para com Deus
  rationale: “Impiedade” conserva de modo conciso o juízo religioso e ético do termo, sem ampliar seu referente.
- issue: Caráter retributivo de μισθός
  choice: recompensa que ... merecia
  alternative: paga correspondente à sua impiedade
  rationale: A escolha preserva a ironia judicial do texto — uma recompensa negativa e merecida — sem introduzir uma formulação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, e o marcador da nota foi colocado junto à expressão incerta que ele explica.
