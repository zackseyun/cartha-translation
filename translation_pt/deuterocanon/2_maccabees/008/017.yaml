  source_fidelity: 'A revisão é necessária para representar melhor αἰκισμός, que designa maus-tratos ou tratamento ultrajante, não meramente a humilhação resultante. «Tendo diante dos olhos» reproduz de modo mais direto o particípio aoristo λαβόντας do que «mantendo». Os demais elementos são preservados: o ultraje contrário à lei, o lugar santo, a cidade objeto de escárnio e a supressão da ordem/modo de vida ancestral.'
  naturalness: O texto revisto mantém uma construção participial natural para a continuidade com o versículo anterior e evita a combinação um tanto redutora «humilhação da cidade ridicularizada». «Cidade que fora objeto de escárnio» torna explícita em português a voz passiva perfeita de ἐμπεπαιγμένης sem acrescentar interpretação.
