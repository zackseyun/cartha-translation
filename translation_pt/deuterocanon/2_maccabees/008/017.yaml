  text: having set before their eyes the lawless outrage committed by them against the holy place, and the abuse of the city that had been mocked, and also the overthrow of the ancestral way of life.
translation:
  language: pt
  text: tendo diante dos olhos o ultraje ilegal que eles cometeram contra o lugar santo, os maus-tratos infligidos à cidade que fora objeto de escárnio e também a destruição do modo de vida ancestral.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸ ὀφθαλμῶν λαβόντας
  choice: mantendo diante dos olhos
  rationale: Preserva a imagem idiomática grega de tomar ou conservar esses fatos diante dos olhos, isto é, tê-los vividamente em mente.
- source_word: ἀνόμως ... ὕβριν
  choice: o ultraje cometido ilegalmente
  rationale: ἀνόμως qualifica a ação como contrária à lei, enquanto ὕβρις expressa insolência violenta, afronta ou ultraje.
- source_word: ἅγιον τόπον
  choice: lugar santo
  rationale: Equivalente direto e natural, sem explicitar 'templo' além do que o grego diz.
- source_word: τὴν τῆς ἐμπεπαιγμένης πόλεως αἰκισμόν
  choice: a humilhação da cidade ridicularizada
  rationale: αἰκισμός denota tratamento ultrajante, maus-tratos ou desonra; 'humilhação' combina naturalmente com a cidade já descrita como objeto de escárnio.
- source_word: προγονικῆς πολιτείας
  choice: modo de vida dos antepassados
  rationale: πολιτεία pode abranger ordem cívica, costumes e modo de vida; a formulação mantém essa amplitude melhor que uma referência apenas política.
- source_word: κατάλυσιν
  choice: destruição
  rationale: Expressa a ideia de dissolução, derrubada ou supressão da ordem ancestral.
theological_decisions:
- issue: Identidade do 'lugar santo'
  choice: lugar santo
  alternative: templo
  rationale: Mantém a designação do texto grego e evita resolver por explicitação uma referência que o contexto permite reconhecer.
- issue: Amplitude de πολιτεία
  choice: modo de vida dos antepassados
  alternative: constituição ancestral
  rationale: A opção escolhida preserva o alcance social, religioso e cívico do termo sem reduzi-lo a uma constituição política moderna.
translation_notes:
  register: Português moderno, digno e acessível, com construção participial adequada à continuidade sintática do versículo anterior. A sequência coordenada e a intensidade retórica do grego foram preservadas.
