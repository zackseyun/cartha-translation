translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Celessíria” segue a forma tradicional portuguesa do topônimo histórico. A construção foi levemente reordenada para evitar repetição pouco natural entre “progredir” e “avançar”, sem eliminar a progressão e os êxitos crescentes do grego.
