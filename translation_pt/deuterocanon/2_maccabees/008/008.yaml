base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/008.yaml
  text: But when Philip saw that the man was gradually making progress and advancing all the more often in successes, he wrote to Ptolemy, the governor of Coele-Syria and Phoenicia, to come to the aid of the king’s cause.
translation:
  language: pt
  text: Mas, ao perceber que o homem[a] avançava pouco a pouco e obtinha êxitos cada vez mais frequentes, Filipe escreveu a Ptolemeu, governador da Celessíria e da Fenícia, pedindo-lhe que viesse em auxílio dos interesses do rei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, Judas Macabeu, mencionado no contexto circundante.
    reason: cross_reference
  - marker: b
    text: Ou “da causa do rei” ou “dos assuntos do rei”. A expressão grega pode abranger os interesses reais de modo amplo, e não apenas uma ação militar específica.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιδὼν
  choice: ao perceber
  rationale: O particípio exprime a percepção que motivou a ação de Filipe; “ao perceber” é natural e abrange o sentido de notar ou reconhecer.
- source_word: κατὰ μικρὸν
  choice: pouco a pouco
  rationale: Conserva de modo idiomático a ideia de desenvolvimento gradual.
- source_word: εἰς προκοπὴν ἐρχόμενον
  choice: avançava
  rationale: Expressa progresso crescente no contexto político-militar sem sugerir especificamente prosperidade material.
- source_word: τὸν ἄνδρα
  choice: aquele homem
  rationale: Mantém a referência explícita e um pouco distanciada do grego; a nota identifica Judas pelo contexto.
- source_word: πυκνότερον
  choice: cada vez mais frequentes
  rationale: O comparativo pode indicar frequência crescente; em combinação com o plural εὐημερίαις, a formulação comunica a repetição cada vez maior dos resultados favoráveis.
- source_word: ἐν ταῖς εὐημερίαις προβαίνοντα
  choice: obtinha êxitos cada vez mais frequentes
  rationale: Reformula naturalmente a imagem de avançar em circunstâncias favoráveis, preservando o sentido de sucessos reiterados no conflito.
- source_word: στρατηγὸν
  choice: governador
  rationale: Neste contexto, designa a autoridade administrativa de Ptolemeu sobre a Celessíria e a Fenícia, embora o termo também possa ter conotação militar.
- source_word: ἐπιβοηθεῖν
  choice: que viesse em auxílio
  rationale: Preserva tanto a ideia de prestar ajuda quanto o movimento de vir em socorro.
- source_word: τοῖς τοῦ βασιλέως πράγματι
  choice: dos interesses do rei
  rationale: A expressão refere-se amplamente aos negócios, interesses ou causa real, não necessariamente a uma única operação militar.
