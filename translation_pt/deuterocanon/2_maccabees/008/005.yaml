base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/005.yaml
  text: But when Maccabaeus had formed a band[a], he had by then become irresistible to the nations, because the wrath of the Lord had turned to mercy.
translation:
  language: pt
  text: Mas, quando Macabeu reuniu um grupo de combatentes, já se tornara irresistível para as nações[a], porque a ira do Senhor havia se transformado em misericórdia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para os gentios»; o termo grego pode designar os povos não judeus ao redor da Judeia.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος ... ἐν συστήματι
  choice: depois que Macabeu reuniu um grupo de combatentes
  rationale: A expressão indica que Macabeu passou a atuar com um corpo organizado. A formulação explicita o caráter combativo sugerido pelo contexto sem definir indevidamente o tamanho ou a estrutura militar do grupo.
- source_word: ἀνυπόστατος
  choice: irresistível
  rationale: O adjetivo descreve alguém a quem não se pode resistir ou fazer frente; «irresistível» é conciso, natural e adequado ao contexto militar.
- source_word: τοῖς ἔθνεσιν
  choice: para as nações
  rationale: Traduz diretamente o plural de ἔθνος e preserva alguma amplitude lexical, embora no contexto designe provavelmente os povos não judeus ao redor da Judeia.
- source_word: τῆς ὀργῆς
  choice: a ira
  rationale: «Ira» conserva o peso solene da desaprovação divina expresso pelo grego.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: O título refere-se ao Deus de Israel; «Senhor» é a forma portuguesa tradicional e corrente.
- source_word: εἰς ἔλεον τραπείσης
  choice: havia se transformado em misericórdia
  rationale: Preserva a imagem forte de mudança contida em τρέπω e o valor anterior da construção participial, em português natural.
theological_decisions:
- issue: Relação causal do genitivo absoluto e mudança da ira divina para misericórdia
  choice: porque a ira do Senhor havia se transformado em misericórdia
  alternative: enquanto a ira do Senhor se transformava em misericórdia
  rationale: No contexto, o genitivo absoluto explica a razão do êxito de Macabeu. A tradução mantém a afirmação teológica e sua tensão metafórica sem explicar como ocorreu a mudança nem suavizá-la.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. «Macabeu» segue a forma portuguesa corrente. A ordem da frase conserva a progressão narrativa e a explicação teológica do grego.
