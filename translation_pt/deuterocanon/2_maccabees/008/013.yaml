  yaml_path: translation/deuterocanon/2_maccabees/008/013.yaml
  text: But those who had become cowardly and distrusted the justice of God kept slipping away and going into exile[a].
translation:
  language: pt
  text: Mas os que haviam perdido a coragem e não confiavam no juízo de Deus fugiam e abandonavam sua terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não confiavam na justiça de Deus”; neste contexto, também pode ter o sentido de “na vingança de Deus”.'
    reason: Registra a amplitude lexical de δίκη entre justiça, juízo e ação retributiva divina.
lexical_decisions:
- source_word: δειλανδροῦντες
  choice: haviam perdido a coragem
  rationale: Expressa o estado de covardia ou desânimo censurado pelo particípio, com naturalidade em português e sem suavizar excessivamente sua força.
- source_word: ἀπιστοῦντες
  choice: não confiavam
  rationale: Com o juízo de Deus como objeto, o verbo indica falta de confiança na atuação judicial divina, mais que incredulidade genérica.
- source_word: τὴν τοῦ θεοῦ δίκην
  choice: no juízo de Deus
  rationale: “Juízo” preserva a amplitude entre justiça divina, decisão judicial e ação retributiva, sem restringir o sentido a vingança.
- source_word: διεδίδρασκον ἑαυτούς
  choice: fugiam às escondidas
  rationale: O imperfeito comunica ação contínua ou repetida, e a formulação reflexiva sugere que procuravam escapar; “às escondidas” transmite o possível caráter furtivo sem tornar a frase pesada.
- source_word: ἐξετόπιζον
  choice: abandonavam a sua terra
  rationale: Comunica deslocamento para fora do lugar de origem sem pressupor exílio formal ou deportação, sentidos que o verbo não exige.
theological_decisions:
- issue: Sentido de τὴν τοῦ θεοῦ δίκην
  choice: o juízo de Deus
  alternative: a justiça de Deus; a vingança de Deus
  rationale: A expressão pode indicar tanto a justiça divina como princípio quanto sua intervenção judicial concreta. “Juízo” conserva essa tensão e evita definir a ação especificamente como vingança.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Evitou-se “ir para o exílio”, que poderia sugerir desterro oficial; “abandonavam a sua terra” explicita apenas o deslocamento implicado pelo grego.
