  text: But they took the money of those who had come to buy them. And after pursuing them for a considerable distance, they turned back from the region, being hemmed in,
translation:
  language: pt
  text: Mas eles tomaram o dinheiro dos que tinham vindo para comprá-los. Depois de persegui-los por uma distância considerável[a], voltaram da região, estando cercados[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por bastante tempo”; a expressão grega pode indicar duração prolongada, além de distância considerável.
    reason: lexical_alternative
