lexical_decisions:
- source_word: χρήματα
  choice: dinheiro
  rationale: No contexto, designa os recursos levados pelos negociantes para comprar os prisioneiros; “dinheiro” é a expressão moderna mais específica e natural.
- source_word: τῶν παραγενομένων ἐπὶ τὸν ἀγορασμὸν αὐτῶν
  choice: dos que tinham vindo para comprá-los
  rationale: Expressa de modo idiomático tanto a chegada dos compradores quanto o propósito da compra; o pronome remete aos judeus que os inimigos esperavam vender.
- source_word: συνδιώξαντες
  choice: depois de persegui-los
  rationale: O particípio indica uma ação anterior ao retorno. O componente συν- não precisa ser explicitado, pois no contexto a perseguição é realizada conjuntamente pelo grupo.
- source_word: ἐφʼ ἱκανόν
  choice: por uma distância considerável
  rationale: No contexto de perseguição e deslocamento, a expressão provavelmente indica extensão espacial, embora também possa referir-se à duração.
- source_word: ἀνέλυον
  choice: retornaram
  rationale: Em contexto de deslocamento, o verbo pode indicar partir ou voltar. Após a perseguição, “retornaram” comunica com clareza que interromperam o avanço e voltaram.
- source_word: ἀπὸ τῆς χώρας
  choice: deixando a região
  rationale: A construção indica afastamento da área onde ocorria a perseguição. Esta formulação é mais natural em português do que o literal “retornaram da região”.
- source_word: συγκλειόμενοι
  choice: estavam sendo encurralados
  rationale: O particípio descreve pressão, confinamento ou restrição em curso, sem identificar além do texto a causa exata dessa limitação.
