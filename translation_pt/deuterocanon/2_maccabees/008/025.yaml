  source_fidelity: A tradução transmite adequadamente χρήματα, a finalidade de compra, a perseguição e a extensão potencialmente espacial de ἐφ’ ἱκανόν. Contudo, “pois estavam sendo encurralados” torna causal uma relação que o particípio pode sugerir, mas não determina, e “encurralados” é mais concreto e militar do que o grego συγκλειόμενοι exige. Uma formulação participial mais neutra preserva melhor a ambiguidade.
  naturalness: O texto é claro e de registro apropriado. “Retornaram, deixando a região” é compreensível, embora “voltaram da região” seja mais direto. A revisão evita a perífrase pesada “estavam sendo encurralados” e conserva a frase final aberta, como no texto-fonte.
  terminology: “Dinheiro”, “comprá-los”, “distância considerável” e “região” são escolhas adequadas e naturais. “Cercados” reproduz o campo semântico de confinamento/cerco sem especificar a causa ou o agente.
