base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/024.yaml
  text: But with the Almighty as their ally, they slaughtered more than nine thousand of the enemy, and they wounded and maimed most of Nicanor’s army, and forced them all to flee.
translation:
  language: pt
  text: Mas, tendo o Todo-Poderoso como aliado, eles massacraram mais de nove mil inimigos, feriram e mutilaram a maior parte do exército de Nicanor e obrigaram todos a fugir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ παντοκράτορος
  choice: o Todo-Poderoso
  rationale: Título divino consagrado e natural em português, que expressa poder e domínio universais sem ampliar o sentido do grego.
- source_word: συμμάχου
  choice: como aliado
  rationale: Preserva o sentido militar de alguém que combate ao lado de outro; é mais específico que «ajudador».
- source_word: κατέσφαξαν
  choice: massacraram
  rationale: Reproduz a força e a violência do verbo grego no contexto de batalha, mais intensas que o simples «mataram».
- source_word: ὑπὲρ τοὺς ἐννακισχιλίους
  choice: mais de nove mil
  rationale: ὑπέρ com acusativo, diante de um número, indica quantidade superior.
- source_word: τραυματίας
  choice: feriram
  rationale: Expressa de modo corrente o ato de deixar soldados feridos e se coordena naturalmente com o verbo seguinte.
- source_word: τοῖς μέλεσιν ἀπηρεῖς
  choice: mutilaram
  rationale: Sintetiza a condição de pessoas gravemente incapacitadas nos membros, conservando a severidade do resultado físico.
- source_word: τὸ πλεῖον μέρος τῆς τοῦ Νικάνορος στρατειᾶς
  choice: a maior parte do exército de Nicanor
  rationale: Formulação clara que conserva a referência à maioria da força militar sob Nicanor.
- source_word: πάντας δὲ φεύγειν ἠνάγκασαν
  choice: e obrigaram todos a fugir
  rationale: Mantém tanto a ideia de coerção quanto o alcance explícito de πάντας, sem especificar além do texto a quem «todos» se refere.
theological_decisions:
- issue: Tradução do título divino παντοκράτωρ no contexto de livramento militar
  choice: o Todo-Poderoso
  alternative: o Soberano de tudo
  rationale: «Todo-Poderoso» é um título reverente, reconhecível e fiel à ênfase na supremacia do poder divino, sem introduzir uma interpretação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção «tendo ... como aliado» conserva a imagem militar sem soar excessivamente literal. Não foram necessárias notas de rodapé.
