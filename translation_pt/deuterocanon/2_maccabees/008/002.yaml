base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/002.yaml
  text: And they were calling on the Lord to look upon the people trampled down by all[a], and also to have mercy on the temple that had been defiled by ungodly men;
translation:
  language: pt
  text: E eles invocavam o Senhor, pedindo que olhasse para o povo pisoteado por todos e que também tivesse compaixão do templo que havia sido profanado[a] por homens ímpios;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «violado» ou «dessacralizado». O termo grego ressalta que o templo santo foi tratado como algo comum por agentes humanos ímpios.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεκαλοῦντο
  choice: invocavam
  rationale: O imperfeito expressa uma ação contínua ou repetida de apelo em oração. «Invocavam» é natural no registro bíblico e conserva o sentido religioso do verbo.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Trata-se do título divino em uma oração dirigida ao Deus de Israel. «O Senhor» é a forma reverente e convencional em português, sem explicitar o tetragrama.
- source_word: ἐφιδεῖν
  choice: que olhasse para
  rationale: O infinitivo indica um pedido para que Deus volte sua atenção ao sofrimento do povo, e não apenas que o veja. A construção com «pedindo que» produz português natural.
- source_word: τὸν ... λαόν
  choice: o povo
  rationale: Refere-se coletivamente ao povo de Israel. «Povo» é claro e mantém a dimensão comunitária do termo.
- source_word: καταπατούμενον
  choice: pisoteado
  rationale: Preserva a imagem concreta de ser calcado aos pés e a ideia de humilhação violenta, sem reduzi-la ao termo abstrato «oprimido».
- source_word: ὑπὸ πάντων
  choice: por todos
  rationale: Reproduz a abrangência da expressão grega sem acrescentar um referente que o texto não especifica.
- source_word: οἰκτεῖραι
  choice: que ... tivesse compaixão de
  rationale: Expressa o apelo à misericórdia divina em linguagem portuguesa atual e digna.
- source_word: τὸν ναόν
  choice: o templo
  rationale: O referente é o templo de Jerusalém; «templo» é a designação mais clara no contexto histórico.
- source_word: βεβηλωθέντα
  choice: que havia sido profanado
  rationale: O particípio perfeito passivo descreve o estado resultante de tratar como comum aquilo que era santo. «Profanado» conserva essa oposição entre sagrado e comum.
- source_word: ὑπὸ τῶν ἀσεβῶν ἀνθρώπων
  choice: por homens ímpios
  rationale: «Ímpios» preserva a dimensão religiosa de ἀσεβῶν, e «homens» representa o substantivo masculino plural que identifica os agentes humanos.
theological_decisions:
- issue: Tradução de κύριος em uma oração ao Deus de Israel
  choice: o Senhor
  alternative: o Soberano
  rationale: «O Senhor» comunica adequadamente o título divino e a reverência da oração, sem identificar explicitamente κύριος com uma forma do nome divino que não aparece no texto grego.
- issue: Descrição da violação do templo
  choice: profanado
  alternative: contaminado
  rationale: «Profanado» destaca que um lugar santo foi tratado de modo incompatível com sua santidade. A tradução não especifica o rito ou meio exato da profanação, que o verbo por si só não define.
- issue: Forma masculina em ἀσεβῶν ἀνθρώπων
  choice: homens ímpios
  alternative: pessoas ímpias
  rationale: A forma escolhida conserva a referência masculina do sintagma grego no contexto dos agentes históricos, sem ampliar nem neutralizar silenciosamente a expressão.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A perífrase «pedindo que» liga naturalmente os dois infinitivos gregos à invocação. O ponto e vírgula final preserva o caráter continuativo da sintaxe da passagem.
