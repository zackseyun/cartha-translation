base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/018.yaml
  text: For they[a], he said, have put their confidence in weapons and boldness, but we have put our confidence in Almighty God, who is able with a single nod to bring down both those coming against us and the whole world.
translation:
  language: pt
  text: “Pois eles”, disse ele, “depositaram sua confiança nas armas e na ousadia; nós, porém, depositamos nossa confiança no Deus Todo-Poderoso, que é capaz de, com um único gesto[a], derrubar tanto os que vêm contra nós como o mundo inteiro.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com um só aceno” ou “com um único sinal”. O termo grego pode designar um aceno de cabeça, gesto ou sinal, ressaltando que Deus pode derrubar sem esforço os que vêm contra nós.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλοις
  choice: nas armas
  rationale: No contexto militar, ὅπλα designa armas ou equipamentos de guerra; “armas” é claro e atual em português.
- source_word: τόλμαις
  choice: na ousadia
  rationale: τόλμα expressa coragem arrojada ou atrevimento. “Ousadia” conserva essa força sem definir se ela é prudente ou temerária.
- source_word: ἐπὶ τῷ παντοκράτορι θεῷ
  choice: no Deus Todo-Poderoso
  rationale: Com πεποίθαμεν, ἐπί com dativo indica em quem se apoia a confiança. A formulação é idiomática e mantém o título divino.
- source_word: παντοκράτορι
  choice: Todo-Poderoso
  rationale: “Todo-Poderoso” é o equivalente português consagrado para o título divino παντοκράτωρ e preserva sua força teológica.
- source_word: δυναμένῳ
  choice: que é capaz de
  rationale: O particípio modifica Deus e explicita o fundamento da confiança nele; esta construção é natural e fiel.
- source_word: τοὺς ἐρχομένους ἐφʼ ἡμᾶς
  choice: os que vêm contra nós
  rationale: A expressão preserva tanto o movimento de aproximação como o sentido hostil, sem especificar indevidamente uma fase do ataque.
- source_word: τὸν ὅλον κόσμον
  choice: o mundo inteiro
  rationale: κόσμος pode designar o mundo ou o universo ordenado. “O mundo inteiro” mantém a amplitude retórica e a ambiguidade normal do termo.
- source_word: ἑνὶ νεύματι
  choice: com um único aceno
  rationale: νεῦμα denota um aceno, gesto ou sinal. “Um único aceno” comunica vividamente a facilidade soberana da ação divina.
- source_word: καταβαλεῖν
  choice: derrubar
  rationale: O verbo significa lançar abaixo ou abater. “Derrubar” funciona naturalmente tanto para os inimigos como para “o mundo inteiro”.
- source_word: πεποίθασιν / πεποίθαμεν
  choice: depositaram sua confiança / depositamos nossa confiança
  rationale: Os perfeitos expressam confiança estabelecida e persistente. A repetição mantém o paralelismo enfático das duas orações.
theological_decisions:
- issue: Tradução do título divino παντοκράτωρ
  choice: Deus Todo-Poderoso
  alternative: o Deus que governa tudo
  rationale: A forma escolhida preserva o título reconhecível e sua afirmação da supremacia divina, sem transformá-lo numa explicação interpretativa.
- issue: Alcance de κόσμος na declaração do poder divino
  choice: o mundo inteiro
  alternative: o universo inteiro
  rationale: “Mundo” conserva o sentido comum de κόσμος e deixa intacta a possível amplitude cósmica da afirmação, sem resolvê-la além do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. As aspas esclarecem que o versículo continua a fala do contexto, e o contraste entre “eles” e “nós” preserva a estrutura enfática do grego.
