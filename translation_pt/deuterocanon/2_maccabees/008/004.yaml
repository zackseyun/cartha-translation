  text: and also to remember the lawless destruction of the innocent infants[a], and the blasphemies committed against his name[b], and to hate evil.
translation:
  language: pt
  text: e que também se lembrasse da destruição criminosa das crianças inocentes[a], das blasfêmias cometidas contra o seu nome e odiasse o mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das crianças sem pecado”. O adjetivo grego significa literalmente “sem pecado” e, neste contexto, ressalta a inocência delas como vítimas. O substantivo se refere a crianças muito novas.
    reason: lexical_alternative
  - marker: b
    text: Ou “abominasse a perversidade”. O verbo grego é raro e expressa forte aversão ao mal.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνησθῆναι
  choice: se lembrasse
  rationale: O infinitivo pertence a uma sequência de petições; a forma subjuntiva torna essa dependência natural em português e mantém o sentido de trazer algo à memória.
- source_word: ἀναμαρτήτων
  choice: inocentes
  rationale: Embora signifique literalmente “sem pecado”, no contexto qualifica as crianças como vítimas sem culpa. “Inocentes” preserva essa força sem transformar a expressão em uma afirmação doutrinária sobre impecabilidade absoluta.
- source_word: νηπίων
  choice: crianças
  rationale: O termo designa crianças muito novas. “Crianças” é claro e natural em português; a nota registra a nuance etária do grego.
- source_word: παρανόμου
  choice: criminosa
  rationale: Expressa que a destruição contrariava a lei e a justiça. “Criminosa” comunica essa força moral e jurídica de modo mais idiomático do que “ilegal” ou “sem lei” neste contexto.
- source_word: ἀπωλίας
  choice: destruição
  rationale: Mantém o sentido amplo e grave do substantivo grego sem explicitar “massacre”, embora o contexto envolva morte violenta.
- source_word: βλασφημιῶν
  choice: blasfêmias
  rationale: Como a ofensa é dirigida ao nome divino, “blasfêmias” preserva o sentido religioso específico e o peso teológico do termo.
- source_word: γενομένων εἰς τὸ ὄνομα αὐτοῦ
  choice: cometidas contra o seu nome
  rationale: “Cometidas” traduz idiomaticamente a ocorrência dos atos, e “contra” expressa a direção hostil indicada pelo contexto.
- source_word: μισοπνηρῆσαι
  choice: odiasse o mal
  rationale: O verbo raro exprime forte aversão ao mal ou à perversidade. A formulação é direta, natural e conserva o paralelismo da sequência de petições.
theological_decisions:
- issue: Sentido de ἀναμαρτήτων aplicado às crianças mortas
  choice: crianças inocentes
  alternative: crianças sem pecado
  rationale: “Inocentes” conserva a ênfase contextual na ausência de culpa das vítimas, enquanto a alternativa mais literal poderia ser entendida como solução de uma questão doutrinária que o texto não procura desenvolver.
- issue: Objeto da aversão em μισοπνηρῆσαι
  choice: odiasse o mal
  alternative: abominasse a perversidade
  rationale: “O mal” mantém a abrangência do termo e evita restringi-lo aos ofensores ou a uma modalidade específica de perversidade.
translation_notes:
  register: Português moderno, digno e acessível, com construção subordinada adequada à sequência de petições do contexto. Evitou-se linguagem confessional específica; “criminosa” comunica de forma corrente a violação da lei e da justiça.
