  yaml_path: translation/deuterocanon/2_maccabees/008/015.yaml
  text: and not because of them[a], but because of the covenants made with their fathers[b], and because of the invocation of his majestic and magnificent name over them.
translation:
  language: pt
  text: e não por causa deles[a], mas por causa das alianças feitas com seus antepassados e por causa de seu nome venerável e majestoso ter sido invocado sobre eles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não em favor deles”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a invocação de seu nome venerável e majestoso sobre eles”. A expressão se refere ao nome de Deus ser invocado sobre o povo.
    reason: cultural_note
lexical_decisions:
- source_word: εἰ μὴ διʼ αὐτούς
  choice: não por causa deles
  rationale: Expressa de modo natural a negação do fundamento ou motivo, preservando o contraste com as razões apresentadas em seguida.
- source_word: διὰ τὰς πρὸς τοὺς πατέρας αὐτῶν διαθήκας
  choice: por causa das alianças feitas com seus antepassados
  rationale: “Alianças” corresponde ao uso judaico-escriturístico de διαθήκας; “feitas com” comunica naturalmente a relação indicada por πρός. “Antepassados” evita restringir πατέρες aos pais imediatos.
- source_word: ἕνεκα
  choice: porque
  rationale: Introduz a segunda razão e mantém a coordenação causal em português corrente.
- source_word: τῆς ἐπʼ αὐτοὺς ἐπικλήσεως
  choice: foi invocado sobre eles
  rationale: A forma verbal é mais natural em português que o substantivo “invocação”, sem perder a ideia de o nome divino ser chamado sobre o povo nem a força de ἐπί.
- source_word: τοῦ σεμνοῦ καὶ μεγαλοπρεποῦς ὀνόματος αὐτοῦ
  choice: seu nome venerável e majestoso
  rationale: “Venerável” preserva o caráter digno e augusto de σεμνός, enquanto “majestoso” comunica μεγαλοπρεπής em linguagem elevada, porém compreensível.
theological_decisions:
- issue: Fundamento pactual da ação favorável de Deus
  choice: A ação é associada não ao mérito do próprio povo, mas às alianças com seus antepassados e ao nome divino invocado sobre ele.
  alternative: Parafrasear o trecho como referência apenas à reputação de Deus ou apenas às promessas ancestrais.
  rationale: O grego apresenta explicitamente duas razões em contraste com “não por causa deles”; a tradução mantém ambas sem desenvolver uma doutrina de mérito ou eleição além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com fluidez brasileira. A construção verbal “foi invocado sobre eles” conserva o idioma bíblico sem tornar a frase excessivamente nominal ou técnica.
