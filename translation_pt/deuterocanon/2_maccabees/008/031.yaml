  yaml_path: translation/deuterocanon/2_maccabees/008/031.yaml
  text: After carefully stripping them of their arms[a], they put everything in the proper places, but they carried the rest of the spoils to Jerusalem.
translation:
  language: pt
  text: Depois de lhes recolher cuidadosamente as armas[a], colocaram tudo nos lugares apropriados; o restante dos despojos, porém, levaram para Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois de os despojarem cuidadosamente de suas armas”. O particípio grego pode enfatizar tanto a retirada das armas dos derrotados como o recolhimento delas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁπλολογήσαντες
  choice: depois de lhes recolher ... as armas
  rationale: O particípio indica tirar ou recolher as armas dos derrotados. A formulação mantém o objeto pessoal αὐτούς por meio de “lhes” e deixa explícita a ação concreta.
- source_word: ἐπιμελῶς
  choice: cuidadosamente
  rationale: Expressa ação feita com atenção e cuidado, em linguagem portuguesa atual e natural.
- source_word: πάντα συνέθηκαν
  choice: colocaram tudo
  rationale: Traduz diretamente a ideia de pôr ou depositar todas as armas recolhidas, sem especificar além do que o grego afirma.
- source_word: εἰς τοὺς ἐπικαίρους τόπους
  choice: nos lugares apropriados
  rationale: ἐπίκαιρος pode indicar aquilo que é adequado, conveniente ou oportuno; no contexto, refere-se a locais apropriados para o que foi recolhido.
- source_word: τὰ δὲ λοιπὰ τῶν σκύλων
  choice: o restante dos despojos, porém
  rationale: σκῦλα designa despojos tomados em guerra, e λοιπά distingue o restante daquilo que acabara de ser colocado nos lugares apropriados.
- source_word: ἤνεγκαν εἰς Ἰεροσόλυμα
  choice: levaram para Jerusalém
  rationale: O aoristo de φέρω indica aqui o transporte físico dos despojos até Jerusalém; “levaram” é claro e idiomático.
