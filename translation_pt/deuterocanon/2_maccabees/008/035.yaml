base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/035.yaml
  text: Having been humbled by those who were thought to be the least among his own[a], and by the Lord’s help having laid aside his splendid robe, he made himself like a fugitive, traveling through the inland country in isolation and came to Antioch[c][b], having prospered beyond all expectation in the destruction of his army.
translation:
  language: pt
  text: Humilhado por aqueles que eram considerados os mais insignificantes entre os seus, ele, com a ajuda do Senhor, deixou de lado sua veste esplêndida e, como um fugitivo, atravessou sozinho o interior, chegando a Antioquia, tendo tido êxito extraordinário na destruição de seu próprio exército.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A formulação é irônica: seu “êxito extraordinário” consistiu na destruição de seu próprio exército. “Como um fugitivo” traduz uma expressão que também pode significar, mais literalmente, “à maneira de alguém em fuga”; o termo grego pode designar um escravo fugitivo, mas o contexto não exige esse sentido específico.'
    reason: irony; lexical_alternative
lexical_decisions:
- source_word: ταπεινωθεὶς
  choice: foi humilhado
  rationale: Preserva a voz passiva e a reversão vergonhosa expressa pelo particípio aoristo, em linguagem portuguesa natural.
- source_word: ὑπὸ τῶν καθʼ αὑτὸν νομιζομένων ἐλαχίστων εἶναι
  choice: por aqueles que considerava os mais insignificantes
  rationale: Entende καθʼ αὑτόν como referência à avaliação do próprio personagem e mantém a ironia de ele ser abatido por pessoas que desprezava. A formulação grega é compacta, mas esta leitura se ajusta bem à sintaxe e ao contexto.
- source_word: τῇ τοῦ κυρίου βοηθείᾳ
  choice: Com a ajuda do Senhor
  rationale: 'O dativo expressa meio ou auxílio e, pela posição sintática, é ligado à humilhação: foi pela ajuda do Senhor que seus adversários o abateram.'
- source_word: τὴν δοξικὴν ἀποθέμενος ἐσθῆτα
  choice: Tirou sua veste esplêndida
  rationale: ἀποτίθημι indica tirar ou despir, enquanto δοξικός caracteriza uma roupa de aparência magnífica, provavelmente indicativa de posição.
- source_word: διὰ τῆς μεσογείου
  choice: atravessou o interior do país
  rationale: μεσόγειος designa aqui a região interior, longe da costa; não se refere ao mar Mediterrâneo.
- source_word: δραπέτου τρόπον
  choice: como um fugitivo
  rationale: Reproduz a comparação adverbial sem impor a conotação mais específica de escravo fugitivo, possível em δραπέτης, mas não exigida no contexto.
- source_word: ἔρημον ἑαυτὸν ποιήσας
  choice: sozinho
  rationale: A expressão literal, 'fazendo-se solitário/desamparado', descreve sua fuga sem companhia; 'sozinho' transmite isso com clareza e naturalidade.
- source_word: ἧκεν εἰς Ἀντιόχειαν
  choice: até chegar a Antioquia
  rationale: Expressa de modo idiomático o movimento concluído indicado por ἧκεν.
- source_word: ὑπὲρ ἅπαν εὐημερηκὼς
  choice: depois de ter sido extraordinariamente bem-sucedido
  rationale: Mantém deliberadamente o vocabulário positivo e hiperbólico de εὐημερέω e ὑπὲρ ἅπαν, necessário para conservar a ironia do grego.
- source_word: ἐπὶ τῇ τοῦ στρατοῦ διαφθορᾷ
  choice: na destruição de seu próprio exército
  rationale: διαφθορά significa destruição ou ruína. 'Seu próprio' explicita o referente contextual e torna perceptível, sem eliminar, a ironia da frase.
theological_decisions:
- issue: Referência de κύριος
  choice: Senhor
  alternative: senhor
  rationale: No contexto narrativo, o título se refere ao Deus de Israel; a inicial maiúscula identifica essa referência sem acrescentar conteúdo ao grego.
- issue: Relação sintática de τῇ τοῦ κυρίου βοηθείᾳ
  choice: A ajuda do Senhor é o meio pelo qual ele foi humilhado
  alternative: A ajuda do Senhor acompanha o ato de tirar a veste
  rationale: A posição do dativo junto de ταπεινωθεὶς e do agente introduzido por ὑπό favorece sua ligação com a humilhação. A alternativa é gramaticalmente menos natural e produz um sentido contextual obscuro.
- issue: Ironia de εὐημερηκὼς ἐπὶ τῇ τοῦ στρατοῦ διαφθορᾷ
  choice: extraordinariamente bem-sucedido na destruição de seu próprio exército
  alternative: sofreu a destruição completa de seu exército
  rationale: A escolha conserva a tensão irônica do texto, que emprega um verbo positivo para caracterizar o resultado desastroso da campanha, em vez de explicar ou neutralizar essa ironia no corpo da tradução.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. O período grego muito longo foi dividido para tornar clara a sequência narrativa. O travessão antes da oração final ajuda a sinalizar a ironia sem substituí-la por uma paráfrase explicativa.
