base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/009.yaml
  text: But he quickly selected Nicanor son of Patroclus[a], one of his chief Friends, and sent him, having assigned to him no fewer than twenty thousand from the nations of every tribe to wipe out the whole Jewish people. They also appointed with him Gorgias, a military man experienced in matters of war[c][b],
translation:
  language: pt
  text: Ele, porém, escolheu depressa Nicanor, filho de Pátroclo, um dos principais Amigos[a], e o enviou, depois de pôr sob seu comando não menos de vinte mil homens dentre povos de toda espécie[b], para exterminar todo o povo da Judeia[c]. Também designaram para atuar com ele Górgias, um general com ampla experiência em assuntos de guerra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «um dos primeiros Amigos». “Amigos” provavelmente era um título da corte para associados de alta posição do rei, e não apenas uma referência a amizade pessoal.'
    reason: lexical_alternative
  - marker: b
    text: A expressão grega é incomum e pode indicar forças de origem étnica mista ou gente proveniente de povos de toda espécie.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «todo o povo judeu». O grego diz literalmente «todo o povo da Judeia».'
    reason: alternative_reading
lexical_decisions:
- source_word: προχειρισάμενος
  choice: escolheu
  rationale: O particípio indica escolher ou designar alguém para uma tarefa; «escolheu» é natural e preserva essa amplitude.
- source_word: τῶν πρώτων φίλων
  choice: um dos principais Amigos
  rationale: Em contexto cortesão helenístico, φίλοι pode funcionar como título de associados do rei; a inicial maiúscula sinaliza esse uso, e «principais» expressa πρώτων.
- source_word: ὑποτάξας
  choice: depois de pôr sob seu comando
  rationale: Expressa com clareza a colocação das tropas sob a autoridade militar de Nicanor.
- source_word: παμφύλων ἔθνη
  choice: homens dentre povos de toda espécie
  rationale: A expressão incomum sugere contingentes de procedências étnicas variadas. «Homens» fica implícito no número masculino οὐκ ἐλάττους e evita dizer que vinte mil nações foram subordinadas.
- source_word: οὐκ ἐλάττους τῶν δισμυρίων
  choice: não menos de vinte mil
  rationale: Reproduz diretamente a construção comparativa quantitativa do grego.
- source_word: τὸ πᾶν τῆς Ἰουδαίας ἐξᾶραι γένος
  choice: para exterminar todo o povo da Judeia
  rationale: ἐξᾶραι tem aqui o sentido forte de eliminar por completo; γένος designa o grupo étnico-nacional, e «povo» evita as conotações biológicas modernas de «raça».
- source_word: συνέστησαν δὲ αὐτῷ καὶ Γοργίαν
  choice: Também designaram para atuar com ele Górgias
  rationale: Comunica a nomeação de Górgias para servir ao lado de Nicanor, sem pressupor subordinação estrita.
- source_word: ἄνδρα στρατηγὸν
  choice: um general
  rationale: στρατηγός identifica diretamente a função militar de Górgias; «general» é claro, digno e fiel.
- source_word: εὖ πολεμικαῖς χρείαις ἔχοντα πεῖραν
  choice: com ampla experiência em assuntos de guerra
  rationale: A frase ressalta experiência prática e sólida em operações militares.
theological_decisions:
- issue: Tradução de γένος no contexto étnico-nacional
  choice: povo da Judeia
  alternative: raça da Judeia; nação da Judeia; povo judeu
  rationale: «Povo» preserva o sentido coletivo étnico-nacional sem introduzir noções biológicas modernas. «Da Judeia» mantém a construção genitiva e sua possível nuance territorial.
- issue: Força de ἐξᾶραι
  choice: exterminar
  alternative: eliminar; arrancar pela raiz
  rationale: No contexto de uma campanha contra a totalidade de um povo, o verbo indica destruição completa; «exterminar» conserva essa gravidade sem suavização.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe acompanha a sequência do grego sem ficar artificial; «Amigos» recebe maiúscula para indicar o provável título cortesão.
