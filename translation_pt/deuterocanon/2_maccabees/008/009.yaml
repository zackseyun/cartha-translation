  source_fidelity: A tradução acompanha de perto o grego. «Escolheu depressa», «um dos principais Amigos», «pôr sob seu comando», «não menos de vinte mil», «exterminar todo o povo da Judeia» e a designação de Górgias preservam adequadamente as relações sintáticas e o sentido militar do texto. «Homens dentre povos de toda espécie» explicita de modo justificável o referente humano subentendido na construção numericamente marcada e mantém a estranheza de παμφύλων ἔθνη sem a resolver em excesso.
