base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/016.yaml
  text: Then Maccabeus[a], after gathering those with him, about six thousand in number, urged them not to be terrified by the enemy, nor to fear the great multitude of the nations that had come against them unjustly, but to fight bravely,
translation:
  language: pt
  text: Então Macabeu reuniu os que estavam com ele, em número de seis mil, e os exortou a não se aterrorizarem diante dos inimigos[a], nem temerem a grande multidão das nações que tinham vindo injustamente contra eles, mas a lutarem com bravura,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “dos prisioneiros” ou “dos cativos”. A redação é difícil neste ponto; o contexto indica forças hostis, por isso o texto principal traduz o sentido como “dos inimigos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συναγαγών
  choice: reuniu
  rationale: O particípio aoristo indica uma ação anterior à exortação. A coordenação verbal comunica a sequência com naturalidade em português.
- source_word: τοὺς περὶ αὐτὸν ὄντας
  choice: os que estavam com ele
  rationale: Reproduz de modo idiomático a expressão grega, sem especificar interpretativamente que eram “seus homens”.
- source_word: ἀριθμὸν ἑξακισχιλίους
  choice: em número de seis mil
  rationale: Mantém a indicação numérica do grego sem acrescentar a aproximação “cerca de”, que não está expressa no texto-fonte.
- source_word: παρεκάλει
  choice: os exortou
  rationale: No contexto de preparação para o combate, expressa um apelo firme e encorajador. O pronome explicita em português o objeto subentendido pelo grego.
- source_word: μὴ καταπλαγῆναι
  choice: a não se aterrorizarem
  rationale: Comunica a ideia de serem tomados ou dominados pelo terror.
- source_word: τοῖς δεσμίοις
  choice: diante dos inimigos
  rationale: O sentido lexical habitual é “prisioneiros” ou “cativos”, mas ele é difícil neste contexto, que trata das forças hostis. A tradução contextual fica no texto principal, e a forma lexical é preservada em nota.
- source_word: μηδὲ εὐλαβεῖσθαι
  choice: nem temerem
  rationale: Expressa temor ou apreensão e mantém o paralelismo com a exortação anterior.
- source_word: τὴν ... πολυπληθείαν
  choice: a grande multidão
  rationale: Conserva a ênfase do substantivo grego na superioridade numérica.
- source_word: τῶν ... ἐθνῶν
  choice: das nações
  rationale: Preserva o sentido étnico-político amplo sem impor o uso teológico posterior de “gentios”.
- source_word: ἀδίκως παραγενομένων ἐπʼ αὐτούς
  choice: que tinham vindo injustamente contra eles
  rationale: Mantém tanto a ação hostil dirigida contra o grupo quanto a avaliação de que ela era injusta.
- source_word: ἀγωνίσασθαι
  choice: a lutarem
  rationale: No contexto militar, o verbo se refere diretamente ao combate.
- source_word: γενναίως
  choice: com bravura
  rationale: Expressa coragem no combate em linguagem portuguesa natural e dignificada.
theological_decisions:
- issue: Tradução de ἐθνῶν no contexto militar judaico
  choice: nações
  alternative: gentios; povos
  rationale: “Nações” conserva a referência a grupos estrangeiros hostis e evita transformar o termo em uma designação teológica mais técnica.
- issue: Tratamento do termo textualmente difícil δεσμίοις
  choice: inimigos no texto, com nota lexical
  alternative: prisioneiros; cativos
  rationale: A acepção lexical comum produz uma leitura obscura na exortação militar. O contexto favorece a referência às forças adversárias, mas a nota preserva transparentemente a dificuldade e as alternativas genuínas.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura mantém o período em andamento e a vírgula final, pois o versículo continua na unidade sintática seguinte. Evitou-se acrescentar “cerca de” à cifra precisa do texto grego.
