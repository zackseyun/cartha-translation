base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/036.yaml
  text: And the one who had undertaken to pay tribute to the Romans from the capture of those in Jerusalem kept proclaiming that the Jews had as their defender one who fought for them[a], and that for this reason the Jews were invulnerable[b], because they followed the laws that had been commanded to them.
translation:
  language: pt
  text: E aquele que havia assumido o compromisso de pagar o tributo aos romanos com o produto da captura dos habitantes de Jerusalém[a] continuava a declarar que os judeus tinham quem lutasse em sua defesa[b] e que, por isso, eram invulneráveis, pois seguiam as leis que lhes haviam sido prescritas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com o produto do cativeiro dos habitantes de Jerusalém”. A expressão grega se refere aos recursos que se esperava obter ao capturar os habitantes da cidade.'
    reason: lexical_alternative
  - marker: b
    text: O texto não identifica expressamente quem lutava em defesa dos judeus; o contexto indica Deus.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... ἀναδεξάμενος
  choice: aquele que havia assumido o compromisso
  rationale: O particípio aoristo médio substantivado retoma Nicanor e indica que ele assumira uma obrigação; a formulação mantém o teor financeiro sem especificar indevidamente um contrato formal.
- source_word: φόρον
  choice: tributo
  rationale: Designa uma obrigação financeira para com uma potência imperial e conserva o tom político do pagamento aos romanos.
- source_word: ἀπὸ τῆς τῶν ἐν Ἱεροσολύμοις αἰχμαλωσίας
  choice: com o produto da captura dos habitantes de Jerusalém
  rationale: A expressão aponta para a captura ou cativeiro projetado dos habitantes e, no contexto financeiro, para os recursos que disso resultariam. A explicitação de 'produto' comunica naturalmente a relação pretendida sem restringir o substantivo a 'escravização'.
- source_word: κατορθώσασθαι
  choice: pagar
  rationale: Embora o verbo possa significar realizar ou levar a bom termo, neste contexto seu sentido idiomático é cumprir o pagamento prometido.
- source_word: κατήγγελλεν
  choice: passou a declarar
  rationale: Expressa a ação durativa indicada pelo imperfeito grego em português natural, sem reduzir o verbo a um acontecimento pontual.
- source_word: ὑπέρμαχον ἔχειν
  choice: tinham quem lutasse em sua defesa
  rationale: Preserva tanto a função protetora quanto o componente ativo e militar de alguém que combate em favor de outros, mantendo sem nomear a identidade do defensor.
- source_word: ἀτρώτους
  choice: invulneráveis
  rationale: Reproduz o sentido de não sujeitos a ferimento e se ajusta ao contexto militar.
- source_word: διὰ τὸ ἀκολουθεῖν
  choice: pois seguiam
  rationale: Mantém claramente a relação causal expressa pela preposição com infinitivo.
- source_word: τοῖς ἑαυτῶν προστεταγμένοις νόμοις
  choice: as leis que lhes haviam sido prescritas
  rationale: Conserva a força do particípio perfeito passivo, indicando leis anteriormente impostas ou determinadas para eles.
theological_decisions:
- issue: Identidade daquele que luta em defesa dos judeus em ὑπέρμαχον ἔχειν
  choice: referente não nomeado no texto principal, com nota indicando que o contexto aponta para Deus
  alternative: nomear diretamente Deus como defensor
  rationale: O contexto sugere fortemente Deus, mas o grego não o nomeia nesta oração. A tradução preserva essa referência indireta e evita resolver a ambiguidade textual.
- issue: Relação entre obediência à Lei e invulnerabilidade
  choice: manter a afirmação causal tal como apresentada pelo narrador
  alternative: atenuar a relação como mera associação ou explicá-la sistematicamente
  rationale: O grego atribui a condição dos judeus ao fato de seguirem as leis prescritas. A tradução conserva essa tensão teológica sem acrescentar uma doutrina de mérito, aliança ou recompensa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi suavizada para evitar uma construção excessivamente literal, preservando o aspecto durativo, a causalidade e a referência indireta ao defensor.
