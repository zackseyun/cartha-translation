base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/001.yaml
  text: But Judas[a], who was also called Maccabeus, and those with him, slipping in secretly into the villages, were calling together their relatives; and taking in those who had remained in Judaism, they gathered about six thousand.
translation:
  language: pt
  text: Judas, também chamado Macabeu, e os que estavam com ele entravam furtivamente nas aldeias, sem serem notados. Ali convocavam seus parentes e acolhiam os que haviam permanecido no judaísmo[a], chegando a reunir um total de seis mil pessoas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “permanecido fiéis ao modo de vida judaico”. Aqui, “judaísmo” se refere à identidade religiosa e às práticas judaicas em contraste com a pressão para adotar costumes gregos.
    reason: Registra uma tradução interpretativa possível e esclarece o sentido contextual de Ἰουδαϊσμός.
lexical_decisions:
- source_word: παρεισπορευόμενοι
  choice: entravam furtivamente
  rationale: Expressa tanto o movimento de entrada nas aldeias quanto seu caráter clandestino, em linguagem portuguesa natural.
- source_word: λεληθότως
  choice: sem serem notados
  rationale: Preserva a ideia de que os movimentos passavam despercebidos e reforça, sem mera repetição, o sentido furtivo do particípio anterior.
- source_word: προσεκαλοῦντο
  choice: convocavam
  rationale: O verbo na voz média indica que chamavam pessoas para junto de si; “convocavam” comunica a reunião de apoiadores sem afirmar recrutamento militar formal.
- source_word: τοὺς συγγενεῖς
  choice: seus parentes
  rationale: Equivalente moderno e inclusivo para os membros de sua parentela.
- source_word: τοὺς μεμενηκότας ἐν τῷ Ἰουδαϊσμῷ
  choice: os que haviam permanecido no judaísmo
  rationale: Segue de perto o grego e conserva a referência à identidade e prática judaicas diante da pressão helenizante, sem acrescentar explicitamente a noção interpretativa de lealdade.
- source_word: προσλαμβανόμενοι
  choice: acolhiam
  rationale: Indica que Judas e seus companheiros recebiam essas pessoas e as integravam ao grupo.
- source_word: συνῆγον εἰς ἑξακισχιλίους
  choice: chegando a reunir cerca de seis mil pessoas
  rationale: Comunica o total resultante de modo idiomático. “Pessoas” explicita o referente humano implícito no masculino plural grego sem restringi-lo desnecessariamente a combatentes.
- source_word: ὁ καὶ Μακκαβαῖος
  choice: também chamado Macabeu
  rationale: Apresenta Macabeu como nome adicional ou epíteto de Judas em formulação portuguesa clara.
theological_decisions:
- issue: Tradução de Ἰουδαϊσμός
  choice: judaísmo
  alternative: modo de vida judaico
  rationale: “Judaísmo” é o equivalente lexical direto e mantém juntas as dimensões religiosa e comunitária do termo, em contraste contextual com a helenização. A alternativa explicativa é registrada em nota para evitar que o termo seja entendido apenas como designação institucional moderna.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A primeira oração foi dividida em duas frases para evitar acúmulo excessivo de particípios, sem alterar a progressão do grego. Os tempos no imperfeito preservam o caráter continuado das ações; “chegando a reunir” apresenta o total alcançado.
