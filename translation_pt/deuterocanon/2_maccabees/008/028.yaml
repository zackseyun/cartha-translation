base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/028.yaml
  text: But after the Sabbath[a], having distributed some of the spoils to those who had been oppressed, and to the widows and the orphans[b], they divided the rest among themselves and their children.
translation:
  language: pt
  text: Mas, depois do sábado, eles distribuíram parte dos despojos[b] entre os que haviam sido maltratados[a], as viúvas e os órfãos; então repartiram o restante entre si e seus filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “os oprimidos”, “os afligidos” ou “os que haviam sofrido abusos”. O particípio grego se refere de modo amplo a pessoas submetidas a sofrimento ou maus-tratos.
    reason: lexical_alternative
  - marker: b
    text: “Despojos” também pode ser traduzido como “saque” ou “espólio de guerra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ τὸ σάββατον
  choice: Mas, depois do sábado
  rationale: μετά com acusativo indica tempo posterior, enquanto δέ marca uma transição levemente adversativa ou continuativa. “Mas” preserva a ligação discursiva sem criar contraste forte.
- source_word: τοῖς ἠκισμένοις
  choice: os que haviam sido maltratados
  rationale: O particípio perfeito passivo designa pessoas que sofreram tratamento cruel, dano ou abuso. A formulação é ampla e corrente, sem restringir o grupo a uma categoria social técnica.
- source_word: ταῖς χήραις καὶ τοῖς ὀρφανοῖς
  choice: as viúvas e os órfãos
  rationale: São as designações diretas e tradicionais das categorias sociais expressas pelo grego.
- source_word: μερίσαντες ἀπὸ τῶν σκύλων
  choice: eles distribuíram parte dos despojos
  rationale: μερίζω indica dividir ou distribuir, e σκῦλα, em contexto militar, são despojos de guerra. ἀπό, junto da menção posterior ao restante, indica que uma parte foi retirada dos despojos para essa distribuição.
- source_word: τὰ λοιπὰ
  choice: o restante
  rationale: Refere-se ao que sobrou dos despojos após a primeira distribuição.
- source_word: αὐτοὶ καὶ τὰ παιδία διεμερίσαντο
  choice: repartiram o restante entre si e seus filhos
  rationale: O médio διεμερίσαντο descreve a divisão entre os beneficiários. “Seus filhos” explicita de modo natural a relação contextual de τὰ παιδία com os próprios combatentes.
theological_decisions:
- issue: Ênfase social e ordem da distribuição dos despojos
  choice: A tradução mostra que primeiro uma parte foi destinada aos maltratados, às viúvas e aos órfãos, e depois o restante foi repartido entre os combatentes e seus filhos.
  alternative: Traduzir mais formalmente “tendo repartido dos despojos”, sem explicitar que se tratava de uma parte.
  rationale: A sequência grega, o uso de ἀπό e a referência subsequente ao “restante” sustentam essa ordem e essa relação quantitativa. A formulação torna explícita a sintaxe contextual, sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural e ampla legibilidade brasileira. Os marcadores foram posicionados junto aos termos que efetivamente explicam.
