base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/027.yaml
  text: After they had collected their weapons and stripped the spoils from the enemies[a], they devoted themselves to the Sabbath, abundantly blessing and giving thanks to the Lord who had preserved them to this day[b], having appointed for them the beginning of mercy.
translation:
  language: pt
  text: Depois de recolherem as armas e de despojarem os inimigos[a], dedicaram-se ao sábado, bendizendo e dando graças abundantemente ao Senhor, que os havia preservado até aquele dia e lhes havia destinado um começo de misericórdia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, quanto à segunda ação: “retirarem os despojos dos inimigos”.'
    reason: A expressão grega descreve a tomada dos despojos dos inimigos derrotados; «despojar os inimigos» é idiomático, enquanto a alternativa explicita o objeto tomado.
  - marker: b
    text: 'Ou: “lhes havia estabelecido um começo de misericórdia” ou “lhes havia dado o primeiro sinal de misericórdia”. O grego pode indicar que esse livramento marcou o início de um favor divino renovado.'
    reason: A expressão ἀρχὴν ἐλέους τάξαντος αὐτοῖς admite a nuance de estabelecer ou destinar um começo de misericórdia, e pode ser entendida como o primeiro sinal dela.
lexical_decisions:
- source_word: ὁπλολογήσαντες
  choice: depois de recolherem as armas
  rationale: O particípio indica a coleta de armas após a batalha; a formulação é natural em português e não especifica além do grego a quem pertenciam.
- source_word: τὰ σκῦλα ἐκδύσαντες τῶν πολεμίων
  choice: despojarem os inimigos
  rationale: Expressa de modo idiomático o ato de retirar dos inimigos derrotados os despojos, preservando a força concreta de ἐκδύσαντες.
- source_word: περὶ τὸ σάββατον ἐγίνοντο
  choice: ocuparam-se com o sábado
  rationale: A expressão é idiomática e sugere que voltaram sua atenção à observância do sábado, sem nomear ritos que o texto não especifica.
- source_word: περισσῶς
  choice: abundantemente
  rationale: Mantém a intensidade do advérbio, qualificando tanto o bendizer quanto o dar graças.
- source_word: εὐλογοῦντες καὶ ἐξομολογούμενοι
  choice: bendizendo e dando graças
  rationale: Distingue os dois atos de louvor; no contexto de culto e livramento, ἐξομολογούμενοι tem sentido de ação de graças.
- source_word: τῷ κυρίῳ
  choice: ao Senhor
  rationale: No contexto bíblico-teológico, κύριος designa o Deus de Israel.
- source_word: τῷ διασώζοντι εἰς τὴν ἡμέραν ταύτην
  choice: que os havia preservado até aquele dia
  rationale: Comunica a ação divina de conduzi-los em segurança até o momento narrado; 'aquele dia' ajusta naturalmente a referência ao relato em português.
- source_word: ἀρχὴν ἐλέους τάξαντος αὐτοῖς
  choice: lhes havia concedido o começo da misericórdia
  rationale: Preserva a noção de que esse livramento inaugura a misericórdia divina, sem convertê-lo em restauração plena; 'concedido' representa τάξαντος de forma natural no contexto.
theological_decisions:
- issue: Sentido de ἀρχὴν ἐλέους τάξαντος αὐτοῖς
  choice: o livramento é o começo da misericórdia concedida por Deus
  alternative: o primeiro sinal da misericórdia ou o início de um favor divino renovado
  rationale: A tradução mantém a tensão de um ato inicial, sem afirmar que a restauração já estivesse completa nem introduzir uma formulação doutrinária não expressa no grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação conserva a construção cultual ligada ao sábado e a imagem teológica do 'começo da misericórdia', esclarecendo alternativas somente em notas.
