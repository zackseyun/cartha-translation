lexical_decisions:
- source_word: προσέπεσεν
  choice: recebeu notícia
  rationale: No contexto da construção προσπίπτω περί, indica que uma informação chegou a Judas. Em português, “recebeu notícia” exprime naturalmente esse valor idiomático.
- source_word: περὶ τῆς τοῦ Νικάνορος ἐφόδου
  choice: do avanço de Nicanor
  rationale: ἐφόδος pode significar avanço, investida ou ataque. “Avanço” preserva o movimento hostil sem afirmar que o combate já havia começado.
- source_word: μεταδόντος
  choice: comunicou
  rationale: O particípio em genitivo absoluto descreve Judas transmitindo aos demais a informação recebida. “Comunicou” é natural e mantém o sentido de compartilhar ou transmitir.
- source_word: τοῖς σὺν αὐτῷ
  choice: aos que estavam com ele
  rationale: Tradução direta e não especificadora, sem identificar indevidamente essas pessoas como soldados, companheiros ou oficiais.
- source_word: τὴν παρουσίαν τοῦ στρατοπέδου
  choice: a chegada do exército
  rationale: παρουσία pode indicar presença ou chegada, e στρατόπεδον pode designar tanto o acampamento quanto o exército. No contexto, a expressão comprimida aponta naturalmente para a chegada ou presença da força inimiga.
