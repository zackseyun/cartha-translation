  text: But news of Nicanor’s advance came to Judas[a]; and when he had shared with those with him the presence of the army camp[b],
translation:
  language: pt
  text: Mas Judas recebeu notícia do avanço de Nicanor[a] e, depois de comunicar aos que estavam com ele a chegada do exército[b],
  philosophy: optimal-equivalence
  footnotes:
