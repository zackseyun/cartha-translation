  yaml_path: translation/deuterocanon/2_maccabees/008/006.yaml
  text: And coming upon cities and countryside unexpectedly[a], he would set them on fire; and by seizing strategic places, he put not a few of the enemies to flight,
translation:
  language: pt
  text: Chegando inesperadamente a cidades e áreas rurais, ele as incendiava; e, apoderando-se de posições estratégicas[a], punha em fuga não poucos inimigos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «posições vantajosas» (ἐπικαίρους τόπους).
    reason: lexical_alternative
lexical_decisions:
- source_word: πόλεις
  choice: cidades
  rationale: É o sentido comum de núcleos urbanos e mantém o contraste com as áreas rurais.
- source_word: χώρας
  choice: áreas rurais
  rationale: No contraste com πόλεις, indica os territórios rurais ao redor, não países politicamente definidos.
- source_word: ἀπροσδοκήτως
  choice: inesperadamente
  rationale: Expressa de modo direto que sua chegada não era esperada, sem acrescentar detalhes sobre a forma do ataque.
- source_word: ἐρχόμενος
  choice: chegando
  rationale: O particípio introduz a ação circunstancial ligada ao verbo principal; esta forma preserva a sequência e soa natural em português.
- source_word: ἐνεπίμπρα
  choice: incendiava
  rationale: O imperfeito grego descreve ação repetida ou continuada no quadro narrativo; o pronome «as» explicita como objetos as cidades e áreas rurais.
- source_word: ἐπικαίρους τόπους
  choice: posições estratégicas
  rationale: Em contexto militar, refere-se a lugares oportunos ou vantajosos para a ação; «posições estratégicas» comunica bem essa função.
- source_word: ἀπολαμβάνων
  choice: apoderando-se de
  rationale: No contexto de locais militares, indica tomar posse ou controle deles.
- source_word: οὐκ ὀλίγους
  choice: não poucos
  rationale: Preserva a litotes do grego, que enfatiza um número considerável sem substituí-la diretamente por «muitos».
- source_word: τῶν πολεμίων
  choice: inimigos
  rationale: Mantém o plural grego; o artigo pode ser omitido naturalmente em português após «não poucos».
- source_word: τροπούμενος
  choice: punha em fuga
  rationale: Preserva o sentido militar de fazer os adversários recuarem ou fugirem, em vez do sentido mais geral de derrotá-los.
