  yaml_path: translation/deuterocanon/2_maccabees/008/003.yaml
  text: and to have mercy also on the city that was being destroyed and was about to be leveled to the ground[a], and to hear the blood crying out to him[b];
translation:
  language: pt
  text: que também tivesse misericórdia da cidade que estava sendo destruída e prestes a ser arrasada até o chão, e ouvisse o sangue[a] que clamava a ele[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, «os sangues»; o plural pode intensificar a ideia de sangue derramado ou de culpa de sangue.
    reason: lexical_alternative
  - marker: b
    text: A imagem do sangue que clama a Deus provavelmente evoca o tema bíblico do sangue inocente que pede que Deus o ouça.
    reason: cross_reference
lexical_decisions:
- source_word: ἐλεῆσαι
  choice: tivesse misericórdia
  rationale: O infinitivo aoristo dá continuidade ao conteúdo da súplica iniciada no contexto anterior. A oração com «que» e o imperfeito do subjuntivo é natural em português e preserva a dependência sintática.
- source_word: καταφθειρομένην
  choice: que estava sendo destruída
  rationale: O particípio presente indica uma destruição em andamento, não apenas um estado já consumado.
- source_word: πόλιν
  choice: cidade
  rationale: Mantém o substantivo comum do grego; embora o contexto indique Jerusalém, o nome próprio não aparece nesta oração.
- source_word: μέλλουσαν ἰσόπεδον γίνεσθαι
  choice: prestes a ser arrasada até o chão
  rationale: «Prestes a» expressa a iminência de μέλλουσαν, e «arrasada até o chão» comunica de modo natural a ideia de ficar nivelada com o solo.
- source_word: τῶν ... αἱμάτων
  choice: o sangue
  rationale: O grego emprega o plural literal «os sangues», mas o português normalmente usa o singular coletivo nesta imagem. A nota preserva a forma incomum do original e sua possível força intensiva.
- source_word: καταβοώντων πρὸς αὐτόν
  choice: que clamava a ele
  rationale: Preserva a imagem concreta do sangue que clama a Deus, com concordância singular exigida pela formulação idiomática em português.
- source_word: εἰσακοῦσαι
  choice: ouvisse
  rationale: Em linguagem de oração, o verbo pode sugerir ouvir favoravelmente ou atender; «ouvisse» mantém essa nuance aberta sem acrescentar uma resposta explícita.
theological_decisions:
- issue: Possível alusão bíblica no sangue que clama a Deus
  choice: Manter a imagem «o sangue que clamava a ele» sem explicitar o motivo do clamor.
  alternative: o sangue dos mortos que clamava a ele por vingança
  rationale: O grego não identifica expressamente as vítimas nesta oração nem acrescenta «por vingança». A tradução conserva a ressonância bíblica e a tensão teológica sem impor uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção inicia em continuidade com a oração anterior; «arrasada até o chão» evita um literalismo pouco natural, e «o sangue» conserva a imagem bíblica em idioma corrente.
