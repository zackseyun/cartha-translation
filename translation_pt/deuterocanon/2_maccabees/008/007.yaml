base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/007.yaml
  text: He especially took the nights as allies for such attacks[b][a], and the report of his valor spread everywhere.
translation:
  language: pt
  text: Ele fazia sobretudo das noites suas aliadas para ataques desse tipo[a], e a fama de sua bravura se espalhava por toda parte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, o grego diz que ele “tomava as noites como colaboradoras” para esses ataques, personificando a noite como sua aliada.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega traduzida por “a fama de sua bravura” é incomum. Ao que parece, refere-se à notícia ou reputação de sua coragem, que se difundia amplamente.
    reason: textual_variant
lexical_decisions:
- source_word: μάλιστα
  choice: sobretudo
  rationale: Mantém a ênfase do advérbio e soa natural em português contemporâneo.
- source_word: τὰς νύκτας ... συνεργοὺς ἐλάμβανεν
  choice: fazia ... das noites suas aliadas
  rationale: Preserva a personificação das noites como colaboradoras, mas evita uma formulação excessivamente literal e pouco idiomática como “tomava as noites como aliadas”.
- source_word: πρὸς τὰς τοιαύτας ἐπιβολάς
  choice: para ataques desse tipo
  rationale: No contexto militar, ἐπιβολή designa investidas ou empreendimentos hostis; “ataques” é claro, atual e não acrescenta tecnicismo.
- source_word: ἡ ἁλὴ τῆς εὐανδρείας αὐτοῦ
  choice: a fama de sua bravura
  rationale: A expressão grega transmitida é incomum, mas o contexto indica a reputação ou notícia de sua coragem militar. “Bravura” comunica εὐανδρεία sem reproduzir literalmente sua conotação masculina antiga.
- source_word: διηχεῖτο πανταχῇ
  choice: se espalhava por toda parte
  rationale: Expressa de modo idiomático a ideia de algo que repercute e se torna conhecido em todos os lugares.
