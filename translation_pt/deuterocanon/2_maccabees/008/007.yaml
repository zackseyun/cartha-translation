  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A metáfora militar das noites como aliadas foi preservada, enquanto a construção sintática foi naturalizada. A formulação evita arcaísmos e linguagem marcada por gênero sem eliminar o sentido de coragem em combate.
