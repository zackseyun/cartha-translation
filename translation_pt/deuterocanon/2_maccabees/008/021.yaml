  text: With these words he encouraged them and made them ready to die for the laws and the fatherland[a], and he formed the army into four parts.
translation:
  language: pt
  text: Com essas palavras, ele os deixou cheios de coragem e prontos para morrer pelas leis e pela pátria; então dividiu o exército em quatro partes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφʼ οἷς
  choice: Com essas palavras
  rationale: A expressão retoma a exortação anterior e indica o meio pelo qual Judas animou os homens; esta formulação é natural em português.
- source_word: εὐθαρσεῖς αὐτοὺς παραστήσας
  choice: ele os deixou cheios de coragem
  rationale: A construção apresenta Judas levando os homens a um estado de ânimo confiante e corajoso; a tradução conserva o valor causativo em português corrente.
- source_word: ἑτοίμους ... ἀποθνήσκειν
  choice: prontos para morrer
  rationale: Mantém de modo direto tanto o sentido de prontidão quanto a referência explícita à morte.
- source_word: ὑπὲρ τῶν νόμων καὶ τῆς πατρίδος
  choice: pelas leis e pela pátria
  rationale: Preserva o plural de νόμων e o sentido de defesa ou dedicação expresso por ὑπέρ. “Pátria” comunica naturalmente o vínculo ancestral e coletivo de πατρίς.
- source_word: τετραμερές τι ἐποίησεν τὸ στράτευμα
  choice: dividiu o exército em quatro partes
  rationale: Expressa de maneira idiomática que Judas organizou a força militar em quatro agrupamentos, sem atribuir ao indefinido τι uma precisão além do contexto.
theological_decisions:
- issue: Relação entre fidelidade às leis e lealdade à πατρίς
  choice: pelas leis e pela pátria
  alternative: pela Lei e pela terra ancestral
  rationale: O plural grego recomenda “leis”, sem reduzir necessariamente a expressão à Torá como título singular. “Pátria” retém a força coletiva e ancestral do termo sem acrescentar uma doutrina nacionalista posterior.
translation_notes:
  register: 'Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem da frase acompanha o movimento do grego: exortação, disposição para o sacrifício e organização militar.'
