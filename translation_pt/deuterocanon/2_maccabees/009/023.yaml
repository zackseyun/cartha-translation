  yaml_path: translation/deuterocanon/2_maccabees/009/023.yaml
  text: And seeing that my father[a], whenever he campaigned in the upper regions, appointed the one who would succeed him,
translation:
  language: pt
  text: E, vendo que também meu pai, sempre que partiu em campanha[a] para as regiões mais altas, designou aquele que lhe sucederia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “acampou”; o verbo grego pode ter esse sentido mais literal, mas o sentido militar mais amplo parece ajustar-se melhor ao contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρῶν
  choice: vendo
  rationale: O particípio introduz a consideração que fundamenta a ação do orador; “vendo” é natural e conserva o sentido de reconhecer um fato.
- source_word: πατήρ
  choice: meu pai
  rationale: Embora o possessivo esteja implícito no contexto grego, ele é necessário em português para identificar naturalmente o pai do orador.
- source_word: καθʼ οὓς καιρούς
  choice: sempre que
  rationale: A expressão tem força distributiva e aponta para as ocasiões recorrentes em que o pai saía em campanha.
- source_word: εἰς τοὺς ἄνω τόπους
  choice: para as regiões do alto
  rationale: Mantém a orientação espacial de εἰς e a formulação deliberadamente ampla de ἄνω, sem decidir se eram especificamente regiões montanhosas ou territórios interiores.
- source_word: ἐστρατοπέδευσεν
  choice: partia em campanha
  rationale: O verbo pode significar literalmente “acampar”, mas neste contexto de deslocamento militar régio tem provavelmente o sentido mais amplo de realizar uma campanha.
- source_word: ἀνέδειξεν
  choice: designava
  rationale: No contexto, o verbo indica a indicação formal de quem assumiria a sucessão; o imperfeito em português harmoniza com a construção iterativa “sempre que”.
- source_word: τὸν διαδεξάμενον
  choice: aquele que lhe sucederia
  rationale: Preserva a ideia verbal do particípio e deixa claro que se trata da pessoa destinada a suceder ao pai.
