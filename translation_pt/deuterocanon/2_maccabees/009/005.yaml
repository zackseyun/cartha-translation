base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/005.yaml
  text: But the all-seeing Lord, the God of Israel, struck him with an incurable and unseen blow; and just as he finished speaking, an unrelenting pain in his bowels seized him, with bitter torments in his inner parts,
translation:
  language: pt
  text: Mas o Senhor que tudo vê, o Deus de Israel, atingiu-o com um golpe incurável e invisível;[a] mal ele acabou de falar, foi tomado por uma dor incurável nas entranhas e por tormentos amargos em seu interior.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «com um flagelo incurável e invisível». A palavra grega pode indicar golpe, ferida ou flagelo.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: «uma dor incurável das entranhas e tormentos amargos das partes interiores».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παντεπόπτης
  choice: que tudo vê
  rationale: Expressa de modo natural e digno aquele que vê todas as coisas, preservando a força do composto grego.
- source_word: κύριος
  choice: Senhor
  rationale: Mantém o título divino, aqui em aposição a «o Deus de Israel».
- source_word: ἐπάταξεν
  choice: atingiu-o
  rationale: Conserva a ação direta de Deus e combina naturalmente com «golpe», sem tom arcaico.
- source_word: ἀνιάτῳ καὶ ἀοράτῳ πληγῇ
  choice: com um golpe incurável e invisível
  rationale: Preserva os dois qualificativos e a amplitude de πληγή, que pode indicar golpe, ferida ou flagelo; a nota registra essa ambiguidade.
- source_word: ἄρτι δὲ αὐτοῦ καταλήξαντος τὸν λόγον
  choice: mal ele acabou de falar
  rationale: Representa a imediatidade da construção temporal grega em português corrente.
- source_word: ἔλαβεν αὐτὸν
  choice: foi tomado por
  rationale: Expressa idiomaticamente a dor que de súbito se apodera dele.
- source_word: ἀνήκεστος
  choice: incurável
  rationale: O sentido básico é aquilo que não admite cura ou remédio; a repetição acompanha a repetição semântica do grego.
- source_word: τῶν σπλάγχνων ἀλγηδών
  choice: dor incurável nas entranhas
  rationale: Mantém a referência concreta aos órgãos internos e a intensidade física da expressão.
- source_word: πικραὶ τῶν ἔνδον βάσανοι
  choice: tormentos amargos em seu interior
  rationale: Preserva πικραί como «amargos» e comunica de modo claro que os tormentos eram internos.
theological_decisions:
- issue: Ação divina na aflição de Antíoco
  choice: 'Deus é apresentado como agente direto: «atingiu-o».'
  alternative: Suavizar para «permitiu que fosse afligido».
  rationale: O grego faz explicitamente do Senhor, o Deus de Israel, o sujeito de ἐπάταξεν; a tradução preserva essa atribuição direta sem resolver ou atenuar a tensão teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom permanece narrativo e digno; «entranhas» conserva a concretude visceral do grego, enquanto «em seu interior» evita uma repetição pesada.
