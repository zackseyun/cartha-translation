base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/002.yaml
  text: For he had entered the so-called Persepolis and attempted to rob the temple and seize control of the city[a]; therefore, when the crowds rushed to arms, they turned him back, and it happened that Antiochus, put to flight by the local inhabitants[b], made a shameful retreat.
translation:
  language: pt
  text: Pois ele havia entrado na chamada Persépolis e tentado saquear o templo[a] e tomar o controle da cidade. Por isso, quando as multidões avançaram, recorreram à defesa armada[b]; e aconteceu que Antíoco, posto em fuga pelos habitantes locais, bateu em vergonhosa retirada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O verbo grego se refere especificamente a roubar ou saquear um lugar sagrado; também se pode traduzir: “cometer sacrilégio saqueando o templo”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “voltaram-se para o auxílio das armas”, isto é, recorreram à resistência armada.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσεληλύθει
  choice: havia entrado
  rationale: O mais-que-perfeito grego indica uma ação anterior aos acontecimentos narrados em seguida.
- source_word: τὴν λεγομένην Περσέπολιν
  choice: a chamada Persépolis
  rationale: Representa λεγομένην de modo natural e sem acrescentar uma insinuação de dúvida ao nome.
- source_word: ἐπεχείρησεν
  choice: tentado
  rationale: Preserva a ideia de tentativa, sem afirmar que o saque ou a tomada da cidade se consumaram.
- source_word: ἱεροσυλεῖν
  choice: saquear o templo
  rationale: O verbo designa especificamente o roubo ou saque de um lugar sagrado; a formulação mantém tanto a ação quanto seu objeto cultual.
- source_word: συνέχειν
  choice: tomar o controle da cidade
  rationale: No contexto político-militar, exprime a intenção de dominar ou manter a cidade sob controle.
- source_word: τῶν πληθῶν ὁρμησάντων
  choice: quando as multidões avançaram
  rationale: O genitivo absoluto descreve o movimento súbito e decidido da população.
- source_word: ἐπὶ τὴν τῶν ὅπλων βοήθειαν ἐτράπησαν
  choice: recorreram à defesa armada
  rationale: Mantém o sujeito plural e o sentido literal de voltar-se para o auxílio das armas, expresso em português corrente.
- source_word: τροπωθέντα
  choice: posto em fuga
  rationale: O particípio tem sentido militar de ser derrotado e obrigado a fugir.
- source_word: τῶν ἐγχωρίων
  choice: pelos habitantes locais
  rationale: Designa as pessoas daquela região sem as conotações potencialmente ambíguas de outros termos.
- source_word: αἰσχύμονα τὴν ἀναζυγὴν ποιήσασθαι
  choice: bateu em vergonhosa retirada
  rationale: Expressa de modo idiomático tanto a retirada quanto a desonra associada a ela.
