  yaml_path: translation/deuterocanon/2_maccabees/009/026.yaml
  text: Therefore I urge you and ask you, remembering the benefits shown both publicly and privately, each of you to maintain the goodwill that now exists toward me and my son.
translation:
  language: pt
  text: Portanto, peço e exorto vocês a que, lembrando-se dos benefícios recebidos tanto em público como em particular, cada um mantenha a boa vontade que agora existe para comigo e para com meu filho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρακαλῶ ... καὶ ἀξιῶ
  choice: peço e exorto
  rationale: Expressa os dois atos de fala do grego — apelo e solicitação insistente — em ordem natural no português, sem tornar ἀξιῶ uma exigência autoritária.
- source_word: τῶν εὐεργεσιῶν
  choice: dos benefícios recebidos
  rationale: Εὐεργεσία indica benefícios ou favores concedidos. A inclusão de “recebidos” explicita naturalmente a relação implícita, sem identificar indevidamente o benfeitor.
- source_word: κοινῇ καὶ κατʼ ἰδίαν
  choice: tanto em público como em particular
  rationale: Reproduz o contraste entre a esfera coletiva/pública e a individual/privada em linguagem corrente.
- source_word: ἕκαστον συντηρεῖν
  choice: cada um mantenha
  rationale: Conserva a responsabilidade individual de ἕκαστον e o sentido de preservar ou continuar algo já existente em συντηρεῖν.
- source_word: τὴν οὖσαν εὔνοιαν
  choice: a boa vontade que agora existe
  rationale: Mantém o particípio presente οὖσαν e a ideia de uma disposição favorável já vigente.
- source_word: εἰς ἐμὲ καὶ τὸν υἱόν
  choice: para comigo e para com meu filho
  rationale: Forma portuguesa idiomática que conserva os dois objetos da boa vontade sem acrescentar identificação ao filho.
