  yaml_path: translation/deuterocanon/2_maccabees/009/020.yaml
  text: Farewell[a], and your children. And your own affairs—your own affairs—your own affairs will be according to your judgment. Having my hope in heaven,
translation:
  language: pt
  text: Fiquem bem, vocês e seus filhos. E os seus próprios assuntos — os seus próprios assuntos — os seus próprios assuntos[a] — estarão segundo o parecer de vocês. Tendo a minha esperança voltada para o céu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho grego usado aqui repete «os seus próprios assuntos» três vezes. A repetição pode ser enfática, mas também pode ter surgido acidentalmente durante a transmissão do texto.
    reason: textual_variant
lexical_decisions:
- source_word: ἐρρῶσθε
  choice: Que vocês ... estejam bem
  rationale: A forma funciona como um voto convencional de bem-estar dirigido a mais de uma pessoa. A construção com «que ... estejam bem» é natural em português moderno e preserva melhor esse valor do que uma ordem literal como «sejam fortes».
- source_word: τὰ τέκνα
  choice: seus filhos
  rationale: Neste contexto, o artigo tem sentido naturalmente possessivo. «Filhos» inclui a descendência sem restringir o termo a pessoas do sexo masculino.
- source_word: τὰ ἴδια
  choice: os assuntos de vocês
  rationale: O neutro plural refere-se idiomaticamente às questões ou aos interesses próprios dos destinatários. «Assuntos» é claro e não acrescenta uma interpretação específica.
- source_word: κατὰ γνώμην ὑμῶν
  choice: de acordo com o parecer de vocês
  rationale: γνώμη pode indicar parecer, juízo ou intenção. «Parecer» conserva essa amplitude e o tom formal sem transformar a expressão em mera preferência.
- source_word: ἔσται
  choice: estarão
  rationale: É o futuro de εἰμί. A concordância plural é exigida pelo português, embora o grego apresente a forma no singular.
- source_word: εἰς οὐρανὸν τὴν ἐλπίδα ἔχων
  choice: Tendo a minha esperança voltada para o céu
  rationale: A formulação mantém a expressão participial e a orientação indicada por εἰς, sem determinar além do texto se «céu» designa Deus, a esfera celeste ou ambos.
theological_decisions:
- issue: Repetição de τὰ ἴδια três vezes no testemunho grego
  choice: Manter as três ocorrências no texto principal
  alternative: Reduzir a expressão a uma única ocorrência como possível duplicação acidental na transmissão
  rationale: O testemunho-fonte repete a expressão três vezes. Para não corrigir silenciosamente o texto nem decidir se a repetição é retórica ou acidental, a tradução a preserva e explica a incerteza em nota.
- issue: Referente teológico de οὐρανός na expressão de esperança
  choice: Traduzir simplesmente como «céu»
  alternative: Explicitar «Deus no céu» ou «a ajuda do céu»
  rationale: O grego não explicita o referente último da esperança. A tradução conserva a formulação aberta e evita acrescentar uma identificação teológica que o trecho não declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para boa legibilidade brasileira e internacional. A repetição incomum e a construção participial interrompida foram mantidas por fidelidade ao testemunho grego e ao caráter fragmentário do versículo.
