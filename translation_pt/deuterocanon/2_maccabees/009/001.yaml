lexical_decisions:
- source_word: Περὶ δὲ τὸν καιρὸν ἐκεῖνον
  choice: Por volta daquela época
  rationale: Περὶ com acusativo temporal indica aproximação. A formulação preserva esse sentido e soa natural em português; δέ funciona aqui como transição narrativa e não exige uma palavra adicional.
- source_word: ἐτύγχανεν
  choice: aconteceu que
  rationale: Conserva a nuance incidental ou circunstancial do verbo, em vez de reduzi-lo a uma simples afirmação de estado.
- source_word: Ἀντίοχος
  choice: Antíoco
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio grego.
- source_word: ἀναλελυκὼς
  choice: voltava
  rationale: No contexto, o particípio indica o regresso de Antíoco da região persa. Com ἐτύγχανεν, a forma verbal finita produz uma frase natural em português.
- source_word: ἀκόσμως
  choice: em desordem
  rationale: A expressão pode indicar desordem, impropriedade ou ignomínia. 'Em desordem' mantém aberta a possibilidade de desorganização concreta e de retorno vergonhoso.
- source_word: ἐκ τῶν περὶ τὴν Περσίδα τόπων
  choice: das regiões ao redor da Pérsia
  rationale: Preserva a referência geográfica ampla e imprecisa dos 'lugares ao redor da Pérsia', evitando identificar a expressão estritamente com o território persa.
