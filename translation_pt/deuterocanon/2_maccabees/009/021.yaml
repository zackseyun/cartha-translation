base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/021.yaml
  text: I remembered your honor and goodwill with affection[a]; after returning from the regions of Persia and falling into an illness that has become severe, I considered it necessary to take thought for the common safety of all of you[c][b];
translation:
  language: pt
  text: Eu me lembrava com afeto da honra e da boa vontade de vocês[a]; depois de voltar das regiões da Pérsia e de cair numa enfermidade que se encontrava em estado grave[b], considerei necessário zelar pela segurança comum de todos vocês[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da honra e do favor de vocês”. O termo grego εὔνοια pode significar “boa vontade” ou “favor”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “caindo numa enfermidade que tem δυσχερία”. A expressão descreve uma doença em condição grave ou difícil de suportar.
    reason: lexical_alternative
  - marker: c
    text: Ou “da segurança pública de todos vocês”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: honra
  rationale: Preserva a amplitude de τιμή — honra ou estima — e se ajusta ao tom formal de uma carta régia.
- source_word: εὔνοια
  choice: boa vontade
  rationale: Expressa a disposição favorável e benevolente indicada pelo termo, sem reduzi-lo a lealdade política.
- source_word: ἐμνημόνευον
  choice: eu me lembrava
  rationale: O imperfeito grego sugere uma lembrança contínua; a forma portuguesa mantém esse aspecto de modo natural.
- source_word: φιλοστόργως
  choice: com afeto
  rationale: Comunica o calor afetivo do advérbio, que pode ter matiz familiar, sem tornar explícito além do que o texto afirma.
- source_word: ἐπαναγαγών
  choice: depois de voltar
  rationale: No contexto, o particípio é entendido em sentido intransitivo e estabelece a sequência temporal.
- source_word: κατὰ τὴν Περσίδα τόπων
  choice: das regiões da Pérsia
  rationale: Representa de modo idiomático a referência ampla aos lugares ou territórios persas.
- source_word: περιπεσών
  choice: cair numa
  rationale: Com ἀσθενείᾳ, descreve naturalmente o ingresso involuntário em um estado de enfermidade.
- source_word: ἀσθενείᾳ
  choice: enfermidade
  rationale: Neste contexto, o sentido é doença física, e 'enfermidade' mantém um registro digno e claro.
- source_word: δυσχερίαν ἔχουσῃ
  choice: que se tornou grave
  rationale: Transmite que a enfermidade apresenta uma condição séria ou difícil, preservando a estrutura descritiva da expressão grega.
- source_word: ἀναγκαῖον ἡγησάμην
  choice: considerei necessário
  rationale: Equivalência direta e natural para a fórmula de avaliação e decisão.
- source_word: φροντίσαι
  choice: cuidar
  rationale: Expressa atenção responsável e providência, adequadas ao contexto político-administrativo, sem especificar medidas não mencionadas.
- source_word: κοινῆς ... ἀσφαλείας
  choice: segurança comum
  rationale: Mantém tanto a ideia de proteção e estabilidade quanto seu caráter compartilhado por toda a comunidade.
