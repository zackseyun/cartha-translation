base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/025.yaml
  text: Moreover[a], considering the rulers nearby and those bordering the kingdom, who are watching for opportunities and awaiting what will happen, I have appointed my son Antiochus as king, whom, when I repeatedly went up to the upper satrapies, I often entrusted and commended to most of you[b]. And I have written to him the things written below.
translation:
  language: pt
  text: Além disso, levando em conta os governantes das regiões próximas e os que fazem fronteira com o reino, atentos às oportunidades e à espera do que acontecerá, designei como rei meu filho Antíoco. Quando eu viajava repetidas vezes para as satrapias superiores, costumava confiá-lo e recomendá-lo à maioria de vocês.[a] Também lhe escrevi o que segue abaixo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Satrapias superiores” conserva o termo administrativo persa usado no grego e provavelmente se refere às províncias interiores ou orientais do reino.
    reason: cultural_note
lexical_decisions:
- source_word: κατανοῶν
  choice: levando em conta
  rationale: Expressa uma avaliação refletida das circunstâncias, e não apenas observação visual.
- source_word: τοὺς παρακειμένους δυνάστας καὶ γειτνιῶντας τῆς βασιλείας
  choice: os governantes das regiões próximas e os que fazem fronteira com o reino
  rationale: Preserva as duas descrições geopolíticas sobrepostas; δυνάστας designa governantes, não poderes abstratos.
- source_word: τοῖς καιροῖς ἐπέχοντας
  choice: atentos às oportunidades
  rationale: καιρός pode indicar a ocasião propícia, e a expressão sugere vigilância politicamente oportunista.
- source_word: προσδοκῶντας τὸ ἀποβησόμενον
  choice: à espera do que acontecerá
  rationale: Mantém aberto o resultado esperado, sem especificar algo que o grego não explicita.
- source_word: ἀναδέδειχα
  choice: designei
  rationale: No contexto da sucessão real, indica nomeação ou designação formal.
- source_word: ἀνατρέχων εἰς τὰς ἄνω σατραπίας
  choice: quando eu viajava repetidas vezes para as satrapias superiores
  rationale: Conserva o caráter reiterado do verbo e o termo administrativo persa σατραπίας.
- source_word: παρεκατετίθεμην καὶ συνίστων
  choice: costumava confiá-lo e recomendá-lo
  rationale: Distingue a entrega aos cuidados de outros da recomendação pessoal que vem em seguida.
- source_word: τὰ ὑπογεγραμμένα
  choice: o que está registrado abaixo
  rationale: Reproduz de modo natural o caráter documental da referência ao texto subsequente.
