  to: 'Mas, inflamado de ira, ele pensava em descarregar sobre os judeus a maldade dos que o haviam posto em fuga. Por isso, ordenou ao condutor da carruagem que dirigisse sem parar e levasse a viagem até o fim, enquanto o juízo vindo do céu o acompanhava. Pois, em sua arrogância, ele havia dito: “Quando eu chegar lá, farei de Jerusalém uma sepultura coletiva de judeus[a]”.'
