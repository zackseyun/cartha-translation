base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/004.yaml
  text: But in his rage he thought to vent on the Jews the malice of those who had put him to flight. Therefore he ordered the charioteer[a], driving without stopping, to press on with the journey, while the judgment from heaven was accompanying him. For in his arrogance he had said, “When I arrive there, I will make Jerusalem a burial place of Jews.”
translation:
  language: pt
  text: 'Mas, inflamado de ira, ele pensava em descarregar sobre os judeus a maldade dos que o haviam posto em fuga. Por isso, ordenou ao condutor da carruagem que dirigisse sem parar e levasse a viagem até o fim, enquanto o juízo vindo do céu o acompanhava. Pois, em sua arrogância, ele havia dito: “Quando eu chegar lá, farei de Jerusalém uma sepultura coletiva de judeus[a]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma vala comum de judeus”. O termo grego designa um lugar de sepultamento para muitos mortos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαρθεὶς δὲ τῷ θυμῷ
  choice: Mas, inflamado de ira
  rationale: Expressa de modo natural a ideia de ser tomado ou exaltado pela ira, preservando a intensidade emocional do grego.
- source_word: ᾤετο
  choice: ele pensava
  rationale: Mantém o valor de intenção ou concepção mental, sem transformar o propósito de Antíoco em fato consumado.
- source_word: τῶν πεφυγαδευκότων αὐτὸν κακίαν
  choice: a maldade dos que o haviam posto em fuga
  rationale: Preserva a ligação gramatical entre κακία e aqueles que o fizeram fugir, sem identificar indevidamente essas pessoas com os judeus.
- source_word: ἐναπερείσασθαι
  choice: descarregar sobre
  rationale: Comunica com clareza a ideia contextual de transferir ou lançar sobre os judeus a hostilidade causada por outros.
- source_word: τὸν ἁρματηλάτην
  choice: ao condutor do carro
  rationale: É uma formulação corrente e precisa para o responsável por conduzir o carro, evitando o tom excessivamente arcaico de “auriga”.
- source_word: ἀδιαλείπτως ἐλαύνοντα
  choice: que dirigisse sem parar
  rationale: Reproduz o sentido de condução contínua expresso por ἀδιαλείπτως.
- source_word: καταλύειν τὴν πορείαν
  choice: e concluísse a viagem
  rationale: O verbo pode indicar levar o percurso ao seu término; esta opção preserva o destino final como foco sem sugerir uma parada tranquila.
- source_word: τῆς ἐξ οὐρανοῦ τῆς κρίσεως συνοδούσης αὐτῷ
  choice: enquanto o juízo vindo do céu o acompanhava
  rationale: Conserva tanto a simultaneidade do genitivo absoluto quanto a imagem explícita de um juízo celeste que segue como companheiro de viagem.
- source_word: ὑπερηφάνως
  choice: em sua arrogância
  rationale: Transmite o orgulho altivo e censurável indicado pelo advérbio.
- source_word: Πολυάνδριον
  choice: uma sepultura coletiva
  rationale: Indica um lugar destinado a muitos mortos e preserva a força ameaçadora da declaração sem fixar como única a imagem mais específica de uma vala comum.
theological_decisions:
- issue: Agência divina no castigo de Antíoco
  choice: o juízo vindo do céu o acompanhava
  alternative: o castigo vindo do céu o seguia
  rationale: “Juízo” preserva o caráter judicial de κρίσις e a atribuição explícita de sua origem ao céu, sem reduzir o termo apenas ao sofrimento resultante.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém a ironia narrativa entre a pressa arrogante de Antíoco e o juízo celeste que já o acompanha.
