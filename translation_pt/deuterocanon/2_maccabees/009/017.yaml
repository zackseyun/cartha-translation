  text: And besides these things[a], he would also become a Jew and would visit every inhabited place[b], proclaiming the power of God.
translation:
  language: pt
  text: Além disso, ele também se tornaria judeu[a] e visitaria todos os lugares habitados, proclamando o poder[b] de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seria judeu”. No contexto, a expressão provavelmente se refere a assumir identidade ou lealdade judaica, não a uma mudança de etnia.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “força”, “potência” ou “domínio”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τούτοις
  choice: Além disso
  rationale: Expressa de modo natural e conciso a força aditiva da locução grega, ligando esta promessa às anteriores.
- source_word: Ἰουδαῖος ἔσεσθαι
  choice: se tornaria judeu
  rationale: No contexto, a construção indica que ele promete assumir identidade ou lealdade judaica, e não que passaria a ter outra etnia. A formulação preserva a força extraordinária da promessa sem introduzir uma noção técnica posterior de conversão.
- source_word: πάντα τόπον οἰκητὴν
  choice: todo lugar habitado
  rationale: Reproduz o sentido distributivo de πάντα τόπον e o provável valor adjetival de οἰκητήν, apesar da forma grega incomum neste contexto.
- source_word: ἐπελεύσεσθαι
  choice: percorreria
  rationale: Comunica o movimento por diversos lugares com a finalidade de fazer uma proclamação pública; é mais natural em português do que uma reprodução rígida de 'iria' ou 'viria sobre'.
- source_word: καταγγέλλοντα
  choice: proclamando
  rationale: O particípio indica anúncio público e enfático, adequadamente expresso por 'proclamando'.
- source_word: τὸ τοῦ θεοῦ κράτος
  choice: o poder de Deus
  rationale: κράτος pode significar poder, força, potência ou domínio. 'Poder' é claro e natural no contexto do reconhecimento da superioridade divina, enquanto outras nuances são registradas em nota.
theological_decisions:
- issue: Sentido da promessa de Antíoco de ser Ἰουδαῖος
  choice: Ele promete tornar-se judeu, isto é, assumir identidade ou lealdade judaica.
  alternative: Ele apenas favoreceria os judeus ou viveria à maneira judaica sem assumir essa identidade.
  rationale: A expressão grega é mais forte que uma simples promessa de benevolência. A tradução mantém essa força, mas evita impor ao texto categorias técnicas posteriores de conversão.
- issue: Nuance de κράτος aplicado a Deus
  choice: poder
  alternative: força, potência ou domínio
  rationale: O termo abrange tanto força eficaz quanto domínio. O contexto não exige que uma dessas nuances seja isolada, por isso a tradução usa o termo português mais abrangente e preserva as alternativas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Percorreria” torna natural a ideia de deslocamento por todos os lugares habitados; as notas preservam as ambiguidades relevantes de Ἰουδαῖος ἔσεσθαι e κράτος.
