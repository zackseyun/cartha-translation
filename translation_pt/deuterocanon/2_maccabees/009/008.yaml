  yaml_path: translation/deuterocanon/2_maccabees/009/008.yaml
  text: But the one who had thought[a], in his arrogance over men, to command even the waves of the sea, and imagined that he could weigh out the heights of the mountains on a scale, was brought down to the ground and carried in a litter[b], plainly showing to all the power of God.
translation:
  language: pt
  text: Mas aquele que, por se julgar acima dos seres humanos em sua arrogância[a], pensava poder dar ordens até às ondas do mar e imaginava poder pesar numa balança as alturas dos montes, foi reduzido a ficar por terra e era transportado numa liteira, mostrando claramente a todos o poder de Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa de sua arrogância sobre os homens”. O grego diz literalmente “sobre os homens” e expressa que ele se exaltava acima dos seres humanos.'
    reason: lexical_alternative
  - marker: b
    text: 'Neste ponto, o texto grego fornecido apresenta uma repetição irregular: “a fé, a fé, o poder”. É provável que se trate de corrupção textual ou repetição de copista; a tradução segue o sentido claro da oração: “o poder de Deus”.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀντιδοκῶν
  choice: pensava poder dar ordens
  rationale: No contexto, o particípio expressa a pretensão arrogante de Antíoco diante das ondas. A formulação comunica naturalmente a ideia contextual de arrogar-se domínio sobre elas, sem tratar sua pretensão como realidade.
- source_word: διὰ τὴν ὑπὲρ ἀνθρώπων ὑπερηφανίαν
  choice: por se julgar acima dos seres humanos em sua arrogância
  rationale: Explicita o sentido de superioridade de ὑπὲρ e conserva a relação causal marcada por διά. “Seres humanos” representa naturalmente o plural genérico ἀνθρώπων em português atual.
- source_word: πλάστιγγι
  choice: numa balança
  rationale: Mantém a imagem concreta de pesar ou determinar uma medida por meio de uma balança.
- source_word: τῶν ὀρέων ... ὕψη
  choice: as alturas dos montes
  rationale: Representa os dois substantivos gregos e preserva a hipérbole elevada do texto.
- source_word: στήσειν
  choice: poder pesar
  rationale: Com πλάστιγγι, o verbo assume o sentido contextual de estabelecer ou determinar o peso numa balança; “pesar” transmite a imagem com clareza em português.
- source_word: κατὰ γῆν γενόμενος
  choice: foi lançado por terra
  rationale: Expressa tanto a condição física junto ao chão quanto a reversão retórica entre sua antiga altivez e sua humilhação.
- source_word: ἐν φορίᾳ παρεκομίζετο
  choice: transportado numa liteira
  rationale: “Liteira” designa adequadamente um veículo no qual uma pessoa enferma ou incapacitada era carregada e combina com o cenário histórico.
- source_word: φανερὰν ... πᾶσιν ... ἐνδεικνύμενος
  choice: mostrando claramente a todos
  rationale: Conserva o caráter público e manifesto do efeito produzido pela humilhação de Antíoco.
- source_word: τοῦ θεοῦ ... δύναμιν
  choice: o poder de Deus
  rationale: Reproduz de modo direto e digno a construção genitiva e o ponto retórico evidente da oração.
- source_word: τὴν πίστιν τὴν πίστιν τὴν δύναμιν
  choice: o poder
  rationale: O texto fornecido apresenta uma repetição anômala de πίστιν antes de δύναμιν. A tradução põe no texto principal o sentido sintaticamente claro, enquanto registra a irregularidade em nota.
theological_decisions:
- issue: Sentido genérico de ἀνθρώπων
  choice: seres humanos
  alternative: homens; humanidade
  rationale: O plural grego abrange os seres humanos em geral. A opção é corrente, precisa e evita que o leitor moderno interprete a referência como restrita ao sexo masculino.
- issue: Repetição anômala de πίστιν no texto-fonte
  choice: Traduzir no texto principal “o poder de Deus” e registrar a irregularidade em nota
  alternative: Incluir “fé” ou “fidelidade” no texto principal
  rationale: A sequência τὴν πίστιν τὴν πίστιν τὴν δύναμιν é textualmente irregular e provavelmente contém repetição de copista ou corrupção. Não se introduz uma afirmação teológica sobre fé ou fidelidade onde a forma grega é instável; preserva-se o problema em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A frase conserva a progressão retórica entre a arrogância desmedida de Antíoco e sua humilhação pública. “Liteira” mantém a ambientação histórica; as notas preservam tanto a alternativa lexical quanto a dificuldade textual sem sobrecarregar o versículo.
