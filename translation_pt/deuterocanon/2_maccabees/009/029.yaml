  yaml_path: translation/deuterocanon/2_maccabees/009/029.yaml
  text: But Philip[a], his companion, was carrying the body; and, because he feared Antiochus’s son[b], he went over to Ptolemy Philometor in Egypt.
translation:
  language: pt
  text: Filipe, seu companheiro[a], transportava o corpo; mas, por temer o filho de Antíoco, foi levado para o Egito, para junto de Ptolomeu Filométor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Companheiro” também pode indicar alguém criado junto com ele, isto é, um associado íntimo da corte ou companheiro de criação.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “transferiu-se para o Egito, para junto de Ptolomeu Filométor”. O verbo grego está na forma passiva e significa literalmente que ele “foi transportado” ou “foi transferido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκομίζετο
  choice: transportava
  rationale: O imperfeito expressa uma ação em curso. “Transportava” comunica com naturalidade o traslado do corpo e preserva o aspecto durativo.
- source_word: τὸ σῶμα
  choice: o corpo
  rationale: Mantém a formulação definida do grego sem acrescentar um possessivo; o contexto identifica de quem era o corpo.
- source_word: σύντροφος
  choice: companheiro
  rationale: O termo pode designar um companheiro próximo, inclusive alguém criado junto com a pessoa; “companheiro” preserva essa amplitude sem impor um título cortesão específico.
- source_word: εὐλαβηθεὶς
  choice: por temer
  rationale: O particípio indica temor ou cautela como motivo da ação seguinte. A formulação causal é clara e idiomática.
- source_word: τὸν υἱὸν Ἀντιόχου
  choice: o filho de Antíoco
  rationale: Reproduz diretamente a relação familiar expressa no grego, sem interpretar o filho como “herdeiro”.
- source_word: πρὸς Πτολεμαῖον τὸν Φιλομήτορα
  choice: para junto de Ptolomeu Filométor
  rationale: πρός indica movimento em direção à pessoa ou à sua esfera de proteção; “para junto de” preserva melhor esse valor do que uma simples localização geográfica.
- source_word: διεκομίσθη
  choice: foi levado
  rationale: Preserva a forma passiva do grego. No contexto, pode indicar que Filipe foi transferido ou se deslocou para o Egito, razão pela qual a alternativa é registrada em nota.
