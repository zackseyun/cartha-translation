revisions:
- from: Pois estou convencido de que, se ele for orientado[a] pelo meu propósito com equidade e humanidade, tratará vocês de acordo com isso.
  to: Pois estou convencido de que ele, tendo-se alinhado[a] ao meu propósito com moderação e humanidade, tratará vocês de modo correspondente.
  rationale: A revisão elimina a condição não marcada no grego e substitui a imagem excessivamente específica de orientação por “tendo-se alinhado”, que transmite de modo natural a provável relação com o propósito do falante, enquanto a nota preserva as alternativas para o particípio difícil. Também posiciona “com moderação e humanidade” como a caracterização do modo de disposição/condução, sem impor uma interpretação teológica ou denominacional.
