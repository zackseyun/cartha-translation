  yaml_path: translation/deuterocanon/2_maccabees/009/027.yaml
  text: For I am convinced that[a], if he is guided by my purpose with fairness and humanity, he will deal with you accordingly.
translation:
  language: pt
  text: Pois estou convencido de que ele, tendo-se alinhado[a] ao meu propósito com moderação e humanidade, tratará vocês de modo correspondente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O particípio grego traduzido por “tendo-se alinhado” é condensado e de sentido discutido; também pode ser entendido como “tendo sido disposto” ou “sendo posto em conformidade” com o propósito de quem fala.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπεισμαι
  choice: estou convencido
  rationale: O perfeito de πείθω expressa uma convicção firme e já estabelecida; “estou convencido” é claro e natural em português.
- source_word: ἐπιεικῶς
  choice: com equidade
  rationale: O advérbio comunica razoabilidade, moderação e consideração justa. “Com equidade” preserva essa qualidade ética sem reduzi-la a mera brandura.
- source_word: φιλανθρώπως
  choice: com humanidade
  rationale: O termo descreve uma atitude humana e benevolente para com as pessoas; “com humanidade” mantém sua força e forma um par natural com “equidade”.
- source_word: συνσταθέντα
  choice: se ele for orientado
  rationale: O particípio é sintaticamente condensado e parece indicar que ele é disposto ou posto em conformidade com o propósito do rei. A formulação condicional oferece uma leitura clara sem ocultar a dificuldade, registrada na nota.
- source_word: τῇ ἐμῇ προαιρέσει
  choice: pelo meu propósito
  rationale: προαίρεσις indica uma intenção, escolha ou propósito deliberado. “Meu propósito” comunica de modo conciso a orientação estabelecida pelo rei.
- source_word: συνπεριενεχθήσεσθαι
  choice: tratará vocês de acordo com isso
  rationale: O verbo futuro composto descreve a maneira correspondente como alguém se conduzirá para com outros. A tradução explicita tanto a relação com os destinatários quanto a conformidade com a disposição mencionada.
