base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/018.yaml
  text: 'But when his pains had somewhat let up[a], for the just judgment of God had come upon him, and when he recognized his own condition, he wrote to the Jews the letter written below, having the character of a petition[c][b], and reading as follows:'
translation:
  language: pt
  text: 'Mas, quando suas dores cederam um pouco[a] — pois o justo juízo de Deus havia sobrevindo a ele —, reconhecendo a própria condição[b], escreveu aos judeus a carta transcrita abaixo, em forma de súplica[c], cujo teor era o seguinte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando suas dores estavam cedendo um pouco”. O raro advérbio grego é de sentido difícil; no contexto, parece indicar que as dores haviam cedido em alguma medida, não que tivessem terminado.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “reconhecendo as coisas referentes a si mesmo”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “com o caráter de uma petição”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰουδαϊσμῶς
  choice: um pouco
  rationale: O advérbio é raro e de sentido difícil. No contexto de ληγόντων τῶν πόνων, indica com cautela que as dores diminuíram em alguma medida, sem afirmar que cessaram por completo.
- source_word: ληγόντων τῶν πόνων
  choice: quando suas dores diminuíram
  rationale: O verbo λήγω, aplicado às dores, comunica que elas estavam cedendo ou perdendo intensidade. A formulação é natural em português e mantém a circunstância temporal do genitivo absoluto.
- source_word: δικαία ἡ τοῦ θεοῦ κρίσις
  choice: o justo juízo de Deus
  rationale: Preserva tanto o caráter judicial de κρίσις quanto a afirmação moral expressa por δικαία.
- source_word: ἐπεληλύθει ... ἐπʼ αὐτόν
  choice: havia sobrevindo a ele
  rationale: O mais-que-perfeito conserva a anterioridade da ação e 'sobrevir a' expressa que o juízo o alcançou, sem enfraquecer a agência divina.
- source_word: τὰ κατʼ αὐτὸν ἐπιγνούς
  choice: reconhecendo a própria condição
  rationale: A expressão grega é condensada, literalmente referindo-se às coisas concernentes a ele. No contexto, indica que tomou consciência do estado em que se encontrava.
- source_word: τὴν ὑπογεγραμμένην ἐπιστολήν
  choice: a carta transcrita abaixo
  rationale: O particípio aponta para o texto da carta apresentado logo em seguida; 'transcrita abaixo' é claro e apropriado ao contexto editorial.
- source_word: ἱκετηρίας τάξιν
  choice: em forma de súplica
  rationale: ἱκετηρία denota súplica ou petição, e τάξις descreve aqui sua forma ou caráter. A escolha mantém o tom de apelo sem tecnicismo desnecessário.
- source_word: περιέχουσαν δὲ οὕτως
  choice: cujo teor era o seguinte
  rationale: Fórmula portuguesa natural para introduzir o conteúdo de uma carta, equivalente ao sentido de 'contendo o seguinte'.
theological_decisions:
- issue: Atribuição do sofrimento de Antíoco ao juízo divino
  choice: Afirmar explicitamente que o justo juízo de Deus havia sobrevindo a ele.
  alternative: Empregar uma formulação neutra que apresente sua condição apenas como sofrimento físico.
  rationale: O grego atribui expressamente o que lhe aconteceu ao justo juízo de Deus. A tradução conserva essa afirmação teológica sem ampliá-la nem suavizá-la.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e ampla inteligibilidade internacional. A estrutura narrativa solene foi preservada, e os travessões isolam a explicação causal sem obscurecer a sequência principal.
