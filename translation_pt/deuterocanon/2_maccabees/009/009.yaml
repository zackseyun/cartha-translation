  text: so that worms even swarmed from the body of the ungodly man[a], and while he was still alive, in pains and agonies, his flesh fell away[b], and because of his stench the whole camp was burdened by the rottenness.
translation:
  language: pt
  text: de modo que vermes até fervilhavam para fora do corpo daquele homem ímpio[a]; e, enquanto ele ainda estava vivo, em meio a dores e agonias, sua carne ia caindo[b]. Por causa do seu mau cheiro, todo o acampamento era oprimido pela podridão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vermes fervilhavam do corpo daquele homem ímpio”. O verbo grego significa mais literalmente “ferver para cima”, “borbulhar” ou “fervilhar para fora”.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “sua carne estava caindo”, enquanto ele ainda estava vivo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δυσσεβοῦς
  choice: homem ímpio
  rationale: Preserva a dimensão religiosa e moral de δυσσεβής, indicando irreverência para com Deus, sem reduzi-la à maldade em geral.
- source_word: σκώληκας ἀναζεῖν
  choice: brotavam vermes
  rationale: O verbo ἀναζέω evoca literalmente algo que ferve ou borbulha para cima. No contexto, “brotavam” comunica de modo natural e vívido o aparecimento abundante de vermes, enquanto a nota preserva a imagem mais literal.
- source_word: ζῶντος
  choice: enquanto ele ainda estava vivo
  rationale: Torna explícita a força temporal da construção e ressalta que a decomposição ocorreu antes da morte.
- source_word: ἐν ὀδύναις καὶ ἀλγηδόσιν
  choice: em meio a dores e agonias
  rationale: Mantém os dois termos de sofrimento físico intenso em português atual e compreensível.
- source_word: τὰς σάρκας αὐτοῦ διαπίπτειν
  choice: sua carne se desprendia
  rationale: Conserva o sentido literal de σάρκες e o aspecto durativo do infinitivo presente, expressando a carne que se soltava ou caía.
- source_word: ὑπὸ δὲ τῆς ὀσμῆς αὐτοῦ
  choice: Por causa do seu mau cheiro
  rationale: Embora ὀσμή possa ser neutro, o contexto de putrefação exige um odor ofensivo; “mau cheiro” é claro e natural.
- source_word: πᾶν τὸ στρατόπεδον
  choice: todo o acampamento
  rationale: Tradução direta e natural do acampamento militar referido pelo texto.
- source_word: βαρύνεσθαι τὴν σαπρίαν
  choice: era oprimido pela podridão
  rationale: A construção grega é incomum; “oprimido” preserva a metáfora de peso de βαρύνω, e “podridão” traduz a corrupção putrefata de σαπρία sem suavizá-la.
theological_decisions:
- issue: Caracterização moral e religiosa de Antíoco em δυσσεβοῦς
  choice: homem ímpio
  alternative: homem perverso
  rationale: “Ímpio” mantém a referência à falta de reverência para com Deus, ao passo que “perverso” poderia indicar apenas maldade moral genérica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação preserva o caráter gráfico do original, sua dimensão religiosa e a dificuldade metafórica da cláusula final, sem acrescentar interpretação denominacional.
