base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/016.yaml
  text: And the holy temple[a], which he had formerly plundered, he would adorn with the finest votive offerings, and he would restore all the sacred vessels many times over, and from his own revenues he would provide the expenses required for the sacrifices[b];
translation:
  language: pt
  text: e que adornaria com as mais belas ofertas votivas o templo santo que antes havia saqueado, devolveria todos os utensílios sagrados em número muitas vezes maior[a] e, com suas próprias receitas, cobriria as despesas necessárias para os sacrifícios;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “restituiria todos os utensílios sagrados em quantidades múltiplas”. O grego expressa restituição em medida multiplicada, não simples reposição.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκύλευεν
  choice: antes havia saqueado
  rationale: O imperfeito descreve a ação anterior de despojar o templo; a forma retrospectiva em português ressalta o contraste com as promessas agora feitas.
- source_word: ἅγιον ναὸν
  choice: o templo santo
  rationale: Mantém tanto a referência concreta ao templo de Jerusalém quanto sua qualidade cultual de espaço santo.
- source_word: καλλίστοις ἀναθήμασιν
  choice: com as mais belas ofertas votivas
  rationale: O superlativo καλλίστοις é preservado por “as mais belas”, enquanto “ofertas votivas” explicita que se trata de dádivas dedicadas e expostas no santuário.
- source_word: κοσμήσειν
  choice: adornaria
  rationale: Expressa o embelezamento do templo por meio das ofertas dedicadas e acompanha naturalmente a série de promessas no discurso indireto.
- source_word: τὰ ἱερὰ σκεύη
  choice: os utensílios sagrados
  rationale: Designa com clareza os objetos e implementos usados no culto do templo, sem sugerir apenas recipientes.
- source_word: πολυπλάσια πάντα ἀποδώσειν
  choice: devolveria todos ... em quantidade muitas vezes maior
  rationale: Preserva a ideia de restituição multiplicada, e não de mera reposição, embora o grego não determine uma proporção exata.
- source_word: τὰς ... συντάξεις
  choice: as despesas
  rationale: No contexto financeiro do culto, refere-se aos valores ou provisões devidos para a manutenção dos sacrifícios.
- source_word: ἐπιβαλλούσας πρὸς τὰς θυσίας
  choice: necessárias para os sacrifícios
  rationale: Comunica de modo natural os custos que cabiam ou eram exigidos para a realização dos sacrifícios.
- source_word: ἐκ τῶν ἰδίων προσόδων
  choice: com suas próprias receitas
  rationale: Preserva a nuance fiscal de πρόσοδοι e a ênfase em custear as despesas a partir de recursos próprios.
- source_word: χορηγήσειν
  choice: cobriria
  rationale: No contexto de despesas, “cobriria” expressa naturalmente a provisão financeira implícita no verbo.
theological_decisions:
- issue: Terminologia cultual relativa ao templo
  choice: 'Manter termos explicitamente cultuais: “templo santo”, “ofertas votivas”, “utensílios sagrados” e “sacrifícios”.'
  alternative: Empregar termos genéricos como “santuário”, “presentes”, “objetos religiosos” ou “ofertas”.
  rationale: O texto trata especificamente do templo de Jerusalém e de seu sistema sacrificial; a terminologia cultual conserva essa especificidade histórica e religiosa sem acrescentar interpretação confessional.
translation_notes:
  register: Português moderno, corrente e digno, com legibilidade brasileira. A oração inicia com “e que” porque o versículo continua a enumeração das promessas do contexto anterior. “Utensílios” é preferido a “vasos” por abranger os diversos implementos do templo. O ponto e vírgula final preserva a continuidade sintática da passagem.
