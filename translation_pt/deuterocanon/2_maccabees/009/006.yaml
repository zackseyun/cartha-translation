  text: very justly[b][a], he who had tortured the inward parts of others with many and foreign afflictions.
translation:
  language: pt
  text: com toda a justiça, ele que havia torturado as entranhas[a] de outros com muitos sofrimentos insólitos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “órgãos internos” ou “vísceras”. O grego é concreto e corporal, não meramente emocional.
    reason: lexical_alternative
  - marker: b
    text: Ou “estranhos” ou “extraordinários”. O termo grego descreve sofrimentos fora do comum e também pode ter o sentido de “estrangeiros”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάνυ δικαίως
  choice: com toda a justiça
  rationale: πάνυ intensifica δικαίως. A expressão portuguesa conserva a forte avaliação moral e a função adverbial de modo natural e dignificado.
- source_word: σπλάγχνα
  choice: as entranhas
  rationale: O termo designa concretamente os órgãos internos ou as vísceras. Neste contexto de tortura, “entranhas” preserva o sentido corporal sem o reduzir a uma metáfora emocional.
- source_word: βασανίσαντα
  choice: havia torturado
  rationale: O particípio indica tormento severo e descreve retrospectivamente o que ele fizera. “Havia torturado” expressa com clareza essa anterioridade no fragmento narrativo.
- source_word: πολλαῖς καὶ ξενίζουσαις συμφοραῖς
  choice: com muitos sofrimentos insólitos
  rationale: συμφοραί pode indicar calamidades ou aflições; no contexto, “sofrimentos” comunica o mal infligido. ξενίζουσαις caracteriza esses sofrimentos como estranhos, extraordinários ou fora do comum; “insólitos” preserva essa força sem sugerir apenas procedência estrangeira.
- source_word: τὸν ... βασανίσαντα
  choice: ele que havia torturado
  rationale: O particípio articular identifica a pessoa submetida ao castigo. A construção mantém a forma explicativa do grego e liga naturalmente este fragmento ao contexto anterior.
theological_decisions:
- issue: Avaliação moral do sofrimento de Antíoco
  choice: “com toda a justiça” apresenta o sofrimento como retribuição merecida.
  alternative: “muito justamente” ou “bem merecidamente”.
  rationale: O grego declara explicitamente que o sofrimento foi justo. A tradução conserva essa avaliação moral e teológica sem ampliar a explicação nem atenuar a tensão do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Como o texto fornecido é um fragmento sintaticamente ligado ao contexto anterior, preserva-se a construção explicativa “ele que...”, sem criar uma oração independente ausente do grego.
