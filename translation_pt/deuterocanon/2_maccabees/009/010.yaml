base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/010.yaml
  text: And no one was able to carry the man who a little earlier had seemed to touch the stars of heaven[a], because of the unbearable burden of the stench.
translation:
  language: pt
  text: E ninguém conseguia transportar aquele que, pouco antes, parecia tocar as estrelas do céu[a], por causa do peso insuportável do mau cheiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «julgava poder tocar as estrelas do céu». O grego pode indicar tanto uma exaltação aparente quanto a opinião presunçosa que ele tinha de si mesmo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ... δοκοῦντα
  choice: aquele que ... parecia
  rationale: O particípio articular tem função substantiva e se refere a Antíoco. «Aquele que» é natural em português e preserva a construção sem acrescentar uma identificação ausente do versículo.
- source_word: μικρῷ πρότερον
  choice: pouco antes
  rationale: A expressão indica um passado recente; «pouco antes» é corrente e mantém a nuance temporal comparativa.
- source_word: τῶν οὐρανίων ἄστρων
  choice: as estrelas do céu
  rationale: A formulação preserva a imagem cósmica e o tom elevado do grego em português natural.
- source_word: ἅπτεσθαι
  choice: tocar
  rationale: O verbo significa literalmente tocar ou agarrar. Neste contexto hiperbólico, «tocar» conserva melhor a imagem da exaltação arrogante.
- source_word: παρακομίζειν
  choice: transportar
  rationale: O verbo descreve levar ou conduzir alguém de um lugar a outro. «Transportar» expressa com clareza essa ação e combina naturalmente com a incapacidade causada pelo odor.
- source_word: διὰ τὸ τῆς ὀσμῆς ἀφόρητον βάρος
  choice: por causa do peso insuportável do mau cheiro
  rationale: «Peso» mantém a metáfora vívida de βάρος para a força opressiva do odor, enquanto «mau cheiro» comunica naturalmente o sentido contextual de ὀσμή.
theological_decisions:
- issue: Descrição hiperbólica da antiga arrogância de Antíoco
  choice: parecia tocar as estrelas do céu
  alternative: julgava poder tocar as estrelas do céu
  rationale: A construção com δοκέω e infinitivo pode indicar tanto exaltação aparente quanto presunção pessoal. O texto principal mantém a ambiguidade, e a nota registra a leitura alternativa sem resolver indevidamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe portuguesa, preservando a ironia, a hipérbole e a metáfora concreta do original.
