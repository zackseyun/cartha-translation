  source_fidelity: 'O sentido central está bem preservado: uma decisão anterior de negar sepultura e expor os judeus, juntamente com as crianças pequenas, seguida da promessa de torná-los iguais aos atenienses. A revisão torna mais explícito que as aves e os animais são os agentes que devorariam os expostos, sem acrescentar uma definição jurídica à comparação com os atenienses.'
  naturalness: A redação proposta melhora a fluência e a referência sintática em português moderno. “Crianças pequenas” é mais abrangente e idiomático para νήπιοι do que “bebês”, e “para que aves e animais selvagens os devorassem” evita a construção passiva um tanto solta de “para serem devorados”.
  terminology: “Sepultura”, “aves”, “animais selvagens” e “atenienses” são adequados. A nota conserva corretamente a provável dimensão cívica da igualdade, identificando-a como provável e não como conteúdo explícito do grego.
