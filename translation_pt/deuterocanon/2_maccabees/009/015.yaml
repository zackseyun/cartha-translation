base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/015.yaml
  text: But the Jews[a], whom he had determined not even to count worthy of burial, but to cast out with their infants for the birds to devour and for the wild beasts—he would make them all equal to the Athenians.
translation:
  language: pt
  text: Mas, quanto aos judeus, a quem ele havia decidido não considerar nem sequer dignos de sepultura, mas lançar fora, junto com suas crianças pequenas, para que aves e animais selvagens os devorassem, ele faria todos iguais aos atenienses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente, “concederia a todos eles uma condição igual à dos atenienses”, provavelmente em referência a privilégios cívicos ou posição legal, e não apenas a prestígio social.
    reason: Esclarece a provável força política da expressão sem torná-la mais específica do que o grego no texto principal.
lexical_decisions:
- source_word: διέγνωκε
  choice: havia decidido
  rationale: Expressa uma decisão firme tomada anteriormente, preservando a relação temporal sugerida pelo contexto.
- source_word: μηδὲ ταφῆς ἀξιῶσαι
  choice: não considerar dignos nem sequer de sepultura
  rationale: Mantém o valor avaliativo de ἀξιόω e a ênfase de μηδέ, em vez de reduzir a expressão à simples negação do sepultamento.
- source_word: οἰωνοβρώτους
  choice: para serem devorados pelas aves
  rationale: Explicita em português corrente o adjetivo que descreve pessoas ou corpos deixados para serem comidos por aves.
- source_word: σὺν τοῖς νηπίοις
  choice: junto com seus bebês
  rationale: νήπιοι indica crianças muito pequenas; “bebês” comunica de modo direto a idade e a brutalidade da ameaça.
- source_word: ἐκρίψαι
  choice: lançar fora
  rationale: Preserva a ideia concreta de jogar ou abandonar os corpos, negando-lhes sepultura.
- source_word: θηρίοις
  choice: pelos animais selvagens
  rationale: No contexto da exposição dos corpos, o dativo indica que seriam entregues aos animais; a formulação portuguesa integra esse sentido ao infinitivo “serem devorados”.
- source_word: πάντας αὐτοὺς ἴσους Ἀθηναίοις ποιήσειν
  choice: ele faria todos iguais aos atenienses
  rationale: Reproduz diretamente a comparação do grego sem especificar no texto principal se a igualdade era de cidadania, direitos ou posição legal.
theological_decisions:
- issue: Sentido político e cultural de “iguais aos atenienses”
  choice: Manter a comparação literal no texto principal.
  alternative: “concederia a todos eles os mesmos direitos dos atenienses” ou “os tornaria cidadãos em igualdade com os atenienses”
  rationale: O grego afirma que ele os faria iguais aos atenienses, mas não define explicitamente o mecanismo ou a extensão jurídica dessa igualdade. A nota registra a provável dimensão cívica sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe ajustada para tornar compreensível o forte contraste entre a decisão anterior de negar sepultura e a promessa posterior de igualdade. A repetição de “ele” antes de “faria” evita que o longo segmento intermediário obscureça o sujeito.
