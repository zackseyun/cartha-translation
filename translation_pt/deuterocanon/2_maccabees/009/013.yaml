  text: 'But the polluted man kept praying to the Master who would no longer have mercy on him[b][a], saying this:'
translation:
  language: pt
  text: 'Mas o homem impuro continuava orando ao Soberano[a], que já não teria misericórdia dele, dizendo assim:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grego despótēs, aqui traduzido por “Soberano”; não é o termo mais comum kýrios, geralmente traduzido por “Senhor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὔχετο
  choice: continuava orando
  rationale: O imperfeito apresenta a oração como ação em curso; a formulação preserva esse aspecto durativo em português natural.
- source_word: ὁ μιερὸς
  choice: o homem impuro
  rationale: O adjetivo substantivado denota forte impureza moral ou cultual. “Impuro” conserva essa carga, enquanto “homem” explicita naturalmente o referente masculino.
- source_word: δεσπότην
  choice: Soberano
  rationale: δεσπότης enfatiza autoridade absoluta e não é o título mais comum κύριος. “Soberano” comunica essa nuance com dignidade e evita o sentido moderno predominante de patrão associado a “mestre” em alguns contextos.
- source_word: οὐκέτι
  choice: já não
  rationale: 'Expressa de modo corrente a negação temporal: a misericórdia não mais seria concedida.'
- source_word: ἐλεήσοντα
  choice: que já não teria misericórdia dele
  rationale: O particípio futuro ativo, tendo αὐτόν como objeto, aponta para uma ação futura em relação à oração; a oração relativa reproduz isso naturalmente.
- source_word: οὕτως λέγων
  choice: dizendo assim
  rationale: Introduz de maneira direta e natural a fala que vem no versículo seguinte.
theological_decisions:
- issue: Tradução de δεσπότης como título de Deus
  choice: Soberano
  alternative: Senhor; Mestre
  rationale: O grego emprega δεσπότης, não κύριος. “Soberano” preserva a ênfase na autoridade absoluta sem confundir os dois títulos gregos.
- issue: Afirmação de que Deus já não teria misericórdia dele
  choice: mantida como descrição inequívoca do narrador
  alternative: formular como mera expectativa ou percepção do homem
  rationale: O particípio futuro com artigo modifica diretamente o Soberano; o texto não apresenta a afirmação apenas como opinião do personagem, por isso não se deve atenuar a tensão teológica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi suavemente ajustada à sintaxe portuguesa, mantendo o aspecto verbal, a forte censura moral e a afirmação teologicamente tensa do original.
