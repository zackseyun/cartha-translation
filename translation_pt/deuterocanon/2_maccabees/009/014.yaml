  yaml_path: translation/deuterocanon/2_maccabees/009/014.yaml
  text: As for the holy city[a], which he had been hurrying to make level with the ground and to build into a mass grave, he will declare it free.
translation:
  language: pt
  text: Quanto à cidade santa, à qual ele se dirigia às pressas para arrasá-la e transformá-la numa sepultura coletiva[a], ele a declarará livre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vala comum” ou “lugar de sepultamento para muitos”. O termo grego indica uma sepultura destinada a muitos mortos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγίαν πόλιν
  choice: cidade santa
  rationale: Expressão natural e biblicamente reconhecível para Jerusalém, preservando o sentido de ἅγιος.
- source_word: σπεύδων παρεγίνετο
  choice: à qual ele se dirigia às pressas
  rationale: Preserva tanto o movimento de aproximação expresso por παρεγίνετο quanto a urgência de σπεύδων, sem absorver um dos elementos.
- source_word: ἰσόπεδον ποιῆσαι
  choice: arrasá-la
  rationale: Comunica de modo claro e natural a ação de reduzir a cidade ao nível do chão.
- source_word: πολυάνδριον
  choice: sepultura coletiva
  rationale: O termo designa um lugar de sepultamento para muitos mortos; a escolha mantém o sentido sombrio sem limitar indevidamente a forma da sepultura a uma vala.
- source_word: οἰκοδομῆσαι
  choice: transformá-la numa
  rationale: Embora o verbo signifique literalmente construir, neste contexto descreve o propósito de converter a cidade destruída em lugar de sepultamento; esta formulação é natural em português e preserva o resultado pretendido.
- source_word: ἐλευθέραν ἀναδείξει
  choice: ele a declarará livre
  rationale: Mantém o futuro e apresenta ἀναδείκνυμι como ato público de conferir ou anunciar uma condição, sem impor a noção técnica de autonomia.
theological_decisions:
- issue: Natureza da promessa de Antíoco sobre a condição de Jerusalém
  choice: ele a declarará livre
  alternative: ele a tornará livre
  rationale: A tradução preserva a ideia de uma declaração pública de condição, sem afirmar mais do que o grego acerca do modo político ou prático pelo qual a liberdade seria efetivada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a aproximação apressada de Antíoco, a violência de sua intenção anterior e o contraste com sua promessa de declarar livre a cidade.
