base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/003.yaml
  text: But while he was at Ecbatana[b][a], news came to him of what had happened to Nicanor and those with Timothy.
translation:
  language: pt
  text: Mas, enquanto ele estava na região de Ecbátana[a], chegaram-lhe notícias do que havia acontecido com Nicanor e com os que estavam com Timóteo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em Ecbátana”. A expressão grega pode indicar a própria cidade ou a região em torno dela.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “sobrevieram-lhe as coisas relativas a Nicanor e aos que estavam com Timóteo, as quais haviam acontecido”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντι δὲ αὐτῷ
  choice: Mas, enquanto ele estava
  rationale: O genitivo absoluto tem valor temporal e circunstancial. “Enquanto ele estava” expressa isso com naturalidade; δέ marca a transição narrativa com “Mas”.
- source_word: κατʼ Ἐκβάτανα
  choice: na região de Ecbátana
  rationale: κατά com o nome de lugar no acusativo pode indicar localização na cidade ou em seus arredores. “Na região de Ecbátana” preserva essa amplitude sem impor uma precisão ausente do grego.
- source_word: προσεπέσε
  choice: chegaram-lhe notícias
  rationale: O verbo significa literalmente algo como “sobreveio-lhe” ou “veio sobre ele”. Como o sujeito conceitual são os acontecimentos relatados, a formulação idiomática comunica que ele recebeu notícia deles.
- source_word: τὰ ... γεγονότα
  choice: do que havia acontecido
  rationale: O particípio perfeito substantivado no neutro plural designa os acontecimentos já ocorridos. O mais-que-perfeito composto preserva a anterioridade em português corrente.
- source_word: τὰ κατὰ Νικάνορα
  choice: com Nicanor
  rationale: A expressão τὰ κατά + acusativo significa “os fatos relativos a” alguém. No contexto de “o que havia acontecido”, “com Nicanor” é claro e evita afirmar além do texto se os fatos lhe foram favoráveis ou adversos.
- source_word: τοὺς περὶ Τιμόθεον
  choice: os que estavam com Timóteo
  rationale: A construção οἱ περὶ + nome pessoal designa o grupo ligado à pessoa, podendo abranger seus companheiros ou partidários. Esta tradução conserva o caráter coletivo sem especificar indevidamente uma estrutura militar.
