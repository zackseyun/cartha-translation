translation_notes:
  register: Português moderno, claro e digno, com sintaxe epistolar natural. O remetente foi antecipado para facilitar a leitura, enquanto a nota registra a ordem grega. “General” conserva o título στρατηγός sem reinterpretá-lo como outro cargo.
