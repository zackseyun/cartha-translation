base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/019.yaml
  text: 'King Antiochus and general[a], to the good Jewish citizens: many greetings, and health[b], and prosperity.'
translation:
  language: pt
  text: 'Antíoco, rei e general[a], aos bons cidadãos judeus: muitas saudações, saúde e prosperidade[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'No grego, o nome e os títulos do remetente aparecem depois da fórmula de saudação: “aos bons cidadãos judeus... o rei Antíoco e general”. A antecipação do remetente torna o estilo da carta mais claro em português.'
    reason: cultural_note
  - marker: b
    text: Ou “bem-estar”; o grego εὖ πράττειν significa “ir bem” ou “estar bem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς χρηστοῖς
  choice: aos bons
  rationale: χρηστός pode indicar bondade, benevolência ou dignidade. Neste endereço epistolar, “bons” preserva de modo conciso o tom elogioso sem especificar além do grego.
- source_word: Ἰουδαίοις
  choice: judeus
  rationale: Em 2 Macabeus, o termo normalmente designa o povo judeu em sentido étnico-religioso, não apenas os habitantes da Judeia.
- source_word: τοῖς πολίταις
  choice: cidadãos
  rationale: πολίτης significa “cidadão”; a tradução direta conserva o caráter formal do destinatário da carta.
- source_word: πολλὰ χαίρειν
  choice: muitas saudações
  rationale: É uma fórmula epistolar convencional. “Muitas saudações” comunica a intensificação de πολλά em português natural.
- source_word: ὑγιαίνειν
  choice: saúde
  rationale: Na sequência da saudação, o infinitivo expressa um voto de boa saúde; o substantivo se encaixa naturalmente na fórmula portuguesa.
- source_word: εὖ πράττειν
  choice: prosperidade
  rationale: A expressão significa “ir bem” ou “estar bem”. “Prosperidade” é uma formulação epistolar compacta, embora “bem-estar” também seja possível.
- source_word: βασιλεὺς Ἀντίοχος καὶ στρατηγὸς
  choice: Antíoco, rei e general
  rationale: A formulação preserva as duas designações do remetente e as apresenta em ordem natural em português, sem eliminar a construção incomum do grego.
