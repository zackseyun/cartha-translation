base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/012.yaml
  text: 'As his pains intensified from moment to moment[a], and he was not even able to endure his own stench, he said this: “It is right to submit to God[c][b], and for one who is mortal not to think proudly.”'
translation:
  language: pt
  text: 'À medida que suas dores se intensificavam a cada instante[a], e já não conseguia suportar nem mesmo o próprio mau cheiro, ele disse: “É justo[b] submeter-se a Deus e, sendo mortal[c], não pensar com arrogância.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de momento em momento” ou “continuamente”.
    reason: lexical_alternative
  - marker: b
    text: Ou “É correto” ou “É apropriado”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “não, sendo mortal, pensar com arrogância”; a expressão formula um princípio geral sobre os seres humanos em sua mortalidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ στιγμὴν
  choice: a cada instante
  rationale: Expressa a progressão repetida das dores ao longo de momentos sucessivos, em linguagem portuguesa natural.
- source_word: ἐπιτεινόμενος ταῖς ἀλγηδόσιν
  choice: suas dores se intensificavam
  rationale: O particípio indica agravamento contínuo, e ἀλγηδών designa dor ou sofrimento, aqui claramente físico.
- source_word: μηδὲ τῆς ὀσμῆς αὐτοῦ ἀνέχεσθαι δυνάμενος
  choice: já não conseguia suportar nem mesmo o próprio mau cheiro
  rationale: No contexto da enfermidade, ὀσμή tem sentido desagradável. “Mau cheiro” é claro e corrente, sem a intensidade adicional que “fedor” poderia sugerir.
- source_word: ταῦτʼ ἔφη
  choice: ele disse
  rationale: Introdução direta e natural da declaração que vem em seguida; o demonstrativo grego não precisa ser reproduzido de modo rígido.
- source_word: Δίκαιον
  choice: É justo
  rationale: O adjetivo é empregado impessoalmente e pode indicar o que é justo, correto ou apropriado. “É justo” conserva bem a dimensão moral.
- source_word: ὑποτάσσεσθαι τῷ θεῷ
  choice: submeter-se a Deus
  rationale: Preserva a ideia de colocar-se sob a autoridade de Deus e corresponde naturalmente à forma média/passiva do infinitivo.
- source_word: μὴ θνητὸν ὄντα
  choice: sendo mortal
  rationale: Mantém de forma concisa a condição ou razão ligada à mortalidade humana, sem restringir a máxima a um gênero específico.
- source_word: ὑπερήφανα φρονεῖν
  choice: não pensar com arrogância
  rationale: Conserva o componente cognitivo de φρονεῖν e comunica com naturalidade a atitude orgulhosa expressa pelo advérbio.
theological_decisions:
- issue: Força genérica de μὴ θνητὸν ὄντα
  choice: sendo mortal, não pensar com arrogância
  alternative: que um mortal não tenha pensamentos arrogantes
  rationale: A construção grega enuncia um princípio geral sobre a condição mortal humana. A tradução preserva essa abrangência sem convertê-la em afirmação exclusivamente masculina.
- issue: Nuance de Δίκαιον
  choice: É justo
  alternative: É correto; É apropriado
  rationale: “Justo” mantém a possível dimensão moral do termo, enquanto a nota reconhece que ele também pode exprimir correção ou conveniência.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção mantém o agravamento progressivo das dores e a formulação proverbial da fala, sem suavizar a submissão a Deus nem ampliar indevidamente o vocabulário da enfermidade.
