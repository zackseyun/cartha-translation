  text: Then the great extent of his arrogance began to come to an end[a], shattered, and to come to recognition under a divine scourge[b],
translation:
  language: pt
  text: Foi então que, quebrantado, ele começou a ver sua grande arrogância diminuir e a chegar ao reconhecimento sob um açoite divino,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνταῦθα οὖν
  choice: Foi então que
  rationale: Marca de modo natural o ponto de virada da narrativa, preservando tanto a sequência quanto a leve força conclusiva de οὖν.
- source_word: ἤρξατο
  choice: começou
  rationale: Expressa diretamente o valor incoativo do verbo e rege naturalmente as duas ações seguintes.
- source_word: τὸ πολὺ τῆς ὑπερηφανίας
  choice: sua enorme arrogância
  rationale: A expressão grega é idiomática e ressalta a grandeza ou extensão da arrogância. A formulação compacta é natural em português, e “arrogância” comunica melhor que “orgulho” a soberba insolente do personagem no contexto.
- source_word: λήγειν
  choice: deixar
  rationale: No contexto, indica começar a cessar ou desistir da arrogância. “Deixar” produz uma construção portuguesa clara sem afirmar que a transformação já estava completa.
- source_word: τεθραυσμένος
  choice: quebrantado
  rationale: O particípio perfeito passivo descreve o estado resultante de ele ter sido abatido ou quebrado. “Quebrantado” abrange o colapso físico e interior sem especificar além do texto.
- source_word: εἰς ἐπίγνωσιν ἔρχεσθαι
  choice: cair em si
  rationale: Expressa de maneira corrente a chegada ao reconhecimento ou à compreensão da própria situação, sem elevar necessariamente o sentido a arrependimento espiritual.
- source_word: θείᾳ μάστιγι
  choice: sob o açoite divino
  rationale: Preserva a metáfora de μάστιξ e sua força de castigo ou aflição de origem divina.
theological_decisions:
- issue: Se a passagem afirma arrependimento genuíno ou apenas reconhecimento forçado sob o juízo
  choice: “cair em si”, no sentido de chegar ao reconhecimento
  alternative: “arrepender-se” ou “chegar ao pleno conhecimento”
  rationale: ἐπίγνωσις indica reconhecimento ou conhecimento, mas não exige por si só arrependimento. A tradução mantém aberta a tensão teológica.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A ordem foi ajustada para deixar claro que “quebrantado” descreve o personagem. A vírgula final foi mantida porque o texto-fonte fornecido termina em vírgula e aparenta continuar no versículo ou cláusula seguinte.
