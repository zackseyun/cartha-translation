  text: sem perder a esperança quanto ao meu estado, mas tendo grande esperança de escapar da doença.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἀπογινώσκων
  choice: sem perder a esperança
  rationale: O particípio expressa a ideia de não desistir nem cair em desespero; a formulação é natural em português e se liga bem ao contraste seguinte.
- source_word: τὰ κατʼ ἐμαυτόν
  choice: quanto ao meu estado
  rationale: A expressão idiomática abrange o que diz respeito ao próprio falante; no contexto da enfermidade, «meu estado» comunica o sentido sem o restringir além do necessário.
- source_word: ἔχων πολλὴν ἐλπίδα
  choice: tendo grande esperança
  rationale: Mantém a estrutura participial e a ênfase de πολλήν, em linguagem clara e digna.
- source_word: ἐκφεύξεσθαι
  choice: de escapar
  rationale: O infinitivo futuro médio indica a expectativa de livrar-se da enfermidade; «escapar» preserva a imagem do grego, em vez de explicá-la simplesmente como recuperação.
- source_word: τὴν ἀσθένειαν
  choice: da doença
  rationale: Neste contexto, ἀσθένεια designa uma aflição física. «Doença» é corrente e concreto, embora «enfermidade» também seja possível.
