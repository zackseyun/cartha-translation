  text: so that[a], if anything unexpected should happen and some difficulty should arise, those in the country, knowing to whom the affairs have been entrusted, may not be thrown into confusion;
translation:
  language: pt
  text: para que, se acontecer algo inesperado e surgir alguma dificuldade, os que estão no país, sabendo a quem os assuntos foram confiados[a], não se perturbem;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a quem os assuntos foram deixados”. O perfeito passivo grego pode enfatizar tanto o simples ato de deixar como a entrega formal de responsabilidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: para que
  rationale: Introduz a finalidade e mantém de forma natural a ligação sintática com o contexto anterior.
- source_word: ἐάν τι παράδοξον ἀποβῇ
  choice: se acontecer algo inesperado
  rationale: παράδοξον indica aqui algo imprevisto ou fora do esperado; a formulação portuguesa é corrente e evita o tom mais sensacional de “extraordinário”.
- source_word: προσπέλθῃ τι δυσχερές
  choice: surgir alguma dificuldade
  rationale: Expressa de modo idiomático a ocorrência de algo difícil, penoso ou problemático, preservando o paralelismo com a oração anterior.
- source_word: εἰδότες
  choice: sabendo
  rationale: Conserva a forma participial e sua relação circunstancial com os que estão no país.
- source_word: οἱ κατὰ τὴν χώραν
  choice: os que estão no país
  rationale: Mantém a referência abrangente às pessoas presentes no território, sem restringi-la indevidamente a uma província específica.
- source_word: ᾧ καταλέλειπται τὰ πράγματα
  choice: a quem os assuntos foram confiados
  rationale: O perfeito passivo pode indicar assuntos deixados sob a responsabilidade de alguém; “confiados” comunica naturalmente a delegação implícita, enquanto a alternativa mais literal é preservada em nota.
- source_word: μὴ ἐπιταράσσωνται
  choice: não fiquem desorientados
  rationale: O verbo intensivo denota forte perturbação ou confusão. “Fiquem desorientados” é claro em português e se ajusta ao contexto de incerteza política.
