  yaml_path: translation/deuterocanon/2_maccabees/009/028.yaml
  text: So then the murderer and blasphemer[a], after suffering the worst things, just as he had treated others, came to a most pitiable end in a foreign land among the mountains.
translation:
  language: pt
  text: Assim, pois, o assassino e blasfemador, depois de sofrer os piores males, do mesmo modo como havia tratado os outros, teve uma morte das mais lamentáveis em terra estrangeira, entre as montanhas.[a]
