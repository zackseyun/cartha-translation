    text: No testemunho grego fornecido, a linha termina, por divisão de linha, em κατέ-. O sentido prossegue claramente com a ideia de ele chegar ao fim ou morrer; a tradução reflete essa continuação.
    reason: textual_variant
lexical_decisions:
- source_word: ἀνδροφόνος
  choice: assassino
  rationale: O composto designa quem mata seres humanos; “assassino” é natural em português e preserva a forte condenação moral do contexto.
- source_word: βλάσφημος
  choice: blasfemador
  rationale: No contexto, descreve alguém que fala de modo ímpio contra Deus; “blasfemador” conserva essa força religiosa.
- source_word: τὰ χείριστα παθών
  choice: depois de sofrer os piores males
  rationale: A construção temporal é natural em português, e “os piores males” mantém o superlativo sem especificar indevidamente os sofrimentos.
- source_word: ὡς ἑτέρους διέθηκεν
  choice: do mesmo modo como havia tratado os outros
  rationale: A formulação preserva a comparação retributiva explícita e expressa naturalmente a maneira cruel como ele procedera com outras pessoas.
- source_word: ἐπὶ ξένης
  choice: em terra estrangeira
  rationale: A expressão indica que ele morreu longe de sua própria terra e mantém o tom patético da passagem.
- source_word: ἐν τοῖς ὄρεσιν
  choice: entre as montanhas
  rationale: Reproduz com naturalidade a localização em região montanhosa.
- source_word: οἰκτίστῳ μόρῳ
  choice: uma morte das mais lamentáveis
  rationale: μόρος pode denotar destino fatal ou morte, e οἰκτίστῳ é superlativo; a escolha comunica claramente o desfecho mortal e sua condição extremamente digna de lástima.
- source_word: κατέ-
  choice: teve uma morte
  rationale: O testemunho fornecido termina na divisão de linha κατέ-, mas a continuação sintática e o contexto indicam que o verbo descreve seu fim ou morte; a nota torna transparente essa situação material.
theological_decisions:
- issue: Caráter retributivo da morte de Antíoco
  choice: manter explicitamente que ele sofreu do mesmo modo como havia tratado os outros
  alternative: apenas relatar sua morte, sem destacar a correspondência entre seus atos e seu sofrimento
  rationale: A oração ὡς ἑτέρους διέθηκεν apresenta a morte como retribuição correspondente e constitui uma tensão teológica central do versículo, que não deve ser suavizada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, sem eliminar o tom condenatório nem a relação explícita de retribuição.
