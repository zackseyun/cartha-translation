base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/007.yaml
  text: But he in no way ceased from his arrogance[a]; rather, he was filled even more with pride, breathing fire in his rage against the Jews and ordering the journey to be hastened. Then it happened that he fell from the chariot as it was rushing along, and in the hard fall[b] all the limbs of his body were wrenched out of joint.
translation:
  language: pt
  text: Ele, porém, de modo algum abandonava sua arrogância; pelo contrário, estava ainda mais cheio de orgulho. Respirando fogo em sua fúria contra os judeus, ordenava que apressassem a viagem.[a] Então aconteceu que ele caiu do carro, que avançava impetuosamente, e, com a queda violenta, todos os membros do seu corpo foram deslocados.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ordenava que acelerassem a marcha”. A palavra grega pode designar viagem, deslocamento ou marcha, conforme o contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “todos os membros do seu corpo foram arrancados das juntas”. O raro verbo grego provavelmente descreve os membros sendo violentamente deslocados após a queda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδαμῶς ... ἔληγεν
  choice: de modo algum abandonava
  rationale: Preserva a negação enfática e exprime naturalmente a ideia de não cessar nem deixar a arrogância.
- source_word: ἀγερωχίας
  choice: arrogância
  rationale: Comunica de modo claro o orgulho altivo e dominador indicado pelo substantivo.
- source_word: ὑπερηφανίας ἐπεπλήρωτο
  choice: estava ainda mais cheio de orgulho
  rationale: Mantém a imagem de estar cheio e a intensificação expressa por ἔτι δὲ καί.
- source_word: πῦρ πνέων τοῖς θυμοῖς
  choice: respirando fogo em sua fúria
  rationale: Conserva a metáfora vívida do grego e traduz a intensidade hostil de θυμοῖς em português natural.
- source_word: ἐπὶ τοὺς Ἰουδαίους
  choice: contra os judeus
  rationale: O contexto de ira torna explícita a direção hostil da preposição.
- source_word: κελεύων ἐποξύνειν τὴν πορίαν
  choice: ordenava que apressassem a viagem
  rationale: Expressa naturalmente a ordem de acelerar o deslocamento, sem decidir no texto principal se πορία deve ser entendido especificamente como marcha.
- source_word: ἅρματος φερομένου ῥοίζῳ
  choice: do carro, que avançava impetuosamente
  rationale: Comunica a velocidade e a força do movimento; 'carro' é uma designação portuguesa natural para o veículo antigo nesse contexto.
- source_word: δυσχερεῖ πτώματι
  choice: com a queda violenta
  rationale: No contexto do acidente, 'violenta' transmite a severidade da queda com clareza.
- source_word: πάντα τὰ μέλη τοῦ σώματος ἀποσφύζειν
  choice: todos os membros do seu corpo foram deslocados
  rationale: O verbo raro parece descrever um desprendimento ou deslocamento violento dos membros; a formulação evita especificidade anatômica excessiva no texto principal.
theological_decisions:
- issue: Caracterização moral de Antíoco por dois termos relacionados ao orgulho
  choice: Preservar 'arrogância' e 'orgulho' como termos distintos
  alternative: Uniformizar ambos como 'arrogância' ou ambos como 'orgulho'
  rationale: O grego emprega ἀγερωχία e ὑπερηφανία, palavras relacionadas mas distintas, e essa variação reforça a escalada moral do retrato sem introduzir interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A metáfora 'respirando fogo' foi preservada; a sintaxe foi dividida em períodos para clareza sem perder a progressão narrativa.
