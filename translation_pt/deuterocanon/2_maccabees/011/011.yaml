  yaml_path: translation/deuterocanon/2_maccabees/011/011.yaml
  text: But springing at the enemies like lions, they struck down eleven thousand of them, and sixteen hundred cavalry; and they forced them all to flee.
translation:
  language: pt
  text: Mas, lançando-se como leões contra os inimigos, abateram onze mil deles e mil e seiscentos cavaleiros; e obrigaram todos a fugir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λεόντινων δὲ ἐντινάξαντες εἰς τοὺς πολεμίους
  choice: Mas, lançando-se como leões contra os inimigos
  rationale: Expressa com naturalidade a imagem leonina e o movimento impetuoso contra o inimigo, sem transformar a comparação em identificação literal.
- source_word: κατέστρωσαν
  choice: abateram
  rationale: O verbo indica derrubar ou deixar prostrados no campo de batalha; “abateram” preserva a força marcial sem acrescentar pormenores ausentes.
- source_word: χιλίους πρὸς τοῖς μυρίοις
  choice: onze mil
  rationale: A construção aditiva significa literalmente mil além de dez mil.
- source_word: ἱππεῖς δὲ ἑξακοσίους πρὸς χιλίοις
  choice: e mil e seiscentos cavaleiros
  rationale: A construção aditiva indica seiscentos além de mil; “cavaleiros” traduz diretamente ἱππεῖς como combatentes montados.
- source_word: τοὺς δὲ πάντας ἠνάγκασαν φεύγειν
  choice: e obrigaram todos os demais a fugir
  rationale: “Obrigaram ... a fugir” reproduz a coerção expressa pelo grego. “Os demais” explicita naturalmente que se trata dos inimigos que restaram após os abatidos, evitando a impressão contraditória de que os já abatidos também fugiram.
