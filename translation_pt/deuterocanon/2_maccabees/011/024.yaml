  yaml_path: translation/deuterocanon/2_maccabees/011/024.yaml
  text: Having heard that the Jews did not approve of my father's change to Greek ways[a], but were choosing their own way of life and asking that their lawful customs be permitted to them,
translation:
  language: pt
  text: Tendo ouvido que os judeus não aprovavam a mudança promovida por meu pai para os costumes gregos[a], mas preferiam seu próprio modo de vida e pediam que lhes fosse permitido observar suas normas tradicionais,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para as práticas gregas”. A expressão grega se refere à adoção de costumes helenizantes, não necessariamente apenas ao uso da língua grega.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκοότες
  choice: Tendo ouvido
  rationale: Preserva o particípio perfeito que introduz o fundamento da resposta régia e mantém o tom formal da carta.
- source_word: μὴ συνεὐδοκοῦντας
  choice: não concordam com
  rationale: Expressa a falta de anuência ou aprovação sem sugerir mera preferência pessoal.
- source_word: τῇ τοῦ πατρὸς εἰς τὰ Ἑλληνικὰ μεταθέσει
  choice: a mudança promovida por meu pai para os costumes gregos
  rationale: μετάθεσις indica mudança ou transferência, enquanto τὰ Ἑλληνικά se refere, no contexto, a práticas culturais helenizantes, não apenas ao idioma.
- source_word: τὴν ἑαυτῶν ἀγωγήν
  choice: seu próprio modo de vida
  rationale: ἀγωγή abrange conduta e maneira de viver, com sentido comunitário e cultural neste contexto.
- source_word: αἱρετίζοντας
  choice: preferem
  rationale: Comunica a escolha deliberada de manter o próprio modo de vida e produz português mais natural do que uma formulação progressiva.
- source_word: ἀξιοῦν
  choice: pedem que
  rationale: Neste contexto epistolar, o verbo introduz um pedido formal, sem necessariamente afirmar um direito incontroverso.
- source_word: συγχωρηθῆναι αὐτοῖς τὰ νόμιμα
  choice: que lhes seja permitido observar suas normas tradicionais
  rationale: A formulação conserva a ideia passiva de permissão; 'normas tradicionais' reúne as dimensões legal e consuetudinária de τὰ νόμιμα, e 'observar' explicita naturalmente em português o exercício dessas normas.
theological_decisions:
- issue: Sentido de εἰς τὰ Ἑλληνικά
  choice: orientação cultural para os costumes gregos
  alternative: mudança para a língua grega
  rationale: O contraste imediato com o modo de vida judaico e com τὰ νόμιμα mostra que estão em vista práticas helenizantes e costumes culturais, não apenas uma mudança linguística.
