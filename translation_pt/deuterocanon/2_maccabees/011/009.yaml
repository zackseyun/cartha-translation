base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/009.yaml
  text: And all together they blessed the merciful God and were strengthened in spirit[a], being ready to wound not only men but even the fiercest wild beasts and iron walls.
translation:
  language: pt
  text: Todos juntos bendisseram o Deus misericordioso e foram fortalecidos em seu íntimo[a], prontos para ferir não apenas homens, mas também as feras mais selvagens e muralhas de ferro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “foram fortalecidos em suas almas”. A expressão grega indica fortalecimento interior, coragem ou firmeza de ânimo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοῦ δὲ πάντες
  choice: Todos juntos
  rationale: Expressa a ação coletiva e unânime indicada pela combinação de ὁμοῦ com πάντες, em português natural.
- source_word: εὐλόγησαν
  choice: bendisseram
  rationale: Preserva o sentido religioso de falar bem de Deus e corresponde de modo direto ao verbo grego, sem excluir a ideia de louvor.
- source_word: τὸν ἐλεήμονα θεόν
  choice: o Deus misericordioso
  rationale: Mantém explicitamente a qualidade divina expressa pelo adjetivo ἐλεήμονα.
- source_word: ἐπερρώσθησαν ταῖς ψυχαῖς
  choice: foram fortalecidos em seu íntimo
  rationale: Comunica o fortalecimento interior, a coragem e a firmeza de ânimo requeridos pelo contexto, preservando a voz passiva sem sugerir uma definição técnica da alma.
- source_word: τιτρώσκειν
  choice: ferir
  rationale: O infinitivo denota causar dano ou ferimento e pode ser aplicado tanto aos seres vivos quanto, na imagem hiperbólica, às muralhas.
- source_word: ἀνθρώπους
  choice: homens
  rationale: Reflete diretamente o substantivo grego no cenário militar e conserva o contraste com as feras.
- source_word: θῆρας δὲ τοὺς ἀγριωτάτους
  choice: mas também as feras mais selvagens
  rationale: Preserva θῆρας como feras e a força superlativa de ἀγριωτάτους; 'mas também' torna explícita em português a correlação com 'não apenas'.
- source_word: σιδηρᾶ τείχη
  choice: muralhas de ferro
  rationale: Reproduz a imagem vívida de obstáculos aparentemente invulneráveis; 'muralhas' se ajusta ao contexto militar.
- source_word: ὄντες ἕτοιμοι
  choice: prontos
  rationale: Apresenta de modo natural a disposição resultante do fortalecimento interior.
theological_decisions:
- issue: Sentido de ψυχαῖς em uma expressão de coragem diante da batalha
  choice: foram fortalecidos em seu íntimo
  alternative: foram fortalecidos em suas almas
  rationale: Neste contexto, ψυχαῖς descreve principalmente a disposição interior, a coragem e a determinação, não uma formulação técnica sobre a constituição humana. A nota preserva a forma mais literal.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção mantém a imagem hiperbólica das feras e das muralhas de ferro, bem como o encadeamento entre fortalecimento interior e prontidão para o combate.
