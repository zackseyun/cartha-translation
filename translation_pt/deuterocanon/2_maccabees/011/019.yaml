base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/019.yaml
  text: If[a], then, you maintain your goodwill in these matters, I will also continue from now on to try to be the cause of good things for you.
translation:
  language: pt
  text: Se, portanto, mantiverem a boa vontade em relação a esses assuntos, também daqui em diante procurarei ser a causa de coisas boas para vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “procurarei proporcionar benefícios a vocês”. O termo grego traduzido por “ser a causa de” indica responsabilidade causal por algo.
    reason: lexical_alternative
lexical_decisions:
- source_word: συντηρήσητε
  choice: mantiverem
  rationale: O verbo indica conservar ou continuar demonstrando uma disposição já existente; “mantiverem” expressa isso de modo claro e natural.
- source_word: εὔνοιαν
  choice: boa vontade
  rationale: O substantivo designa uma disposição favorável ou benevolente e combina com o tom diplomático da carta.
- source_word: εἰς τὰ πράγματα
  choice: em relação a esses assuntos
  rationale: A expressão se refere de maneira geral aos assuntos em questão, sem especificá-los além do que o grego permite.
- source_word: εἰς τὸ λοιπόν
  choice: daqui em diante
  rationale: A locução aponta para o tempo futuro a partir do presente e é idiomática em português.
- source_word: πειράσομαι
  choice: procurarei
  rationale: O futuro médio comunica intenção e esforço, não a garantia do resultado; “procurarei” preserva essa nuance.
- source_word: αἰτιαῖος
  choice: ser a causa de
  rationale: O adjetivo expressa responsabilidade causal. A formulação mantém explicitamente essa relação sem reduzir o sentido a mera boa intenção.
- source_word: ἀγαθῶν
  choice: coisas boas
  rationale: O plural substantivado é amplo e não especifica a natureza dos bens ou benefícios prometidos.
