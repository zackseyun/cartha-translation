  text: Farewell[a]. In the one hundred forty-eighth year[b], on the fifteenth day of Xanthicus.
translation:
  language: pt
  text: Passem bem[a]. No ano cento e quarenta e oito, no décimo quinto dia do mês de Xântico[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tenham saúde” ou “estejam bem”. No encerramento de uma carta, a expressão funciona como fórmula de despedida.
    reason: lexical_alternative
  - marker: b
    text: Xântico é o nome de um mês macedônio usado na datação da era selêucida.
    reason: cultural_note
lexical_decisions:
- source_word: ὑγιαίνετε
  choice: Passem bem
  rationale: Embora signifique literalmente “tenham saúde” ou “estejam bem”, aqui o verbo funciona como fórmula de despedida no encerramento de uma carta. “Passem bem” conserva a imagem de bem-estar e soa como despedida compreensível em português.
- source_word: ἔτους
  choice: ano
  rationale: Integra a fórmula de datação no genitivo e é traduzido diretamente por “ano”.
- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: cento e quarenta e oito
  rationale: A sequência ordinal indica o número do ano. Na fórmula portuguesa “no ano cento e quarenta e oito”, o cardinal é a forma natural e inequívoca.
- source_word: Ξανθικοῦ
  choice: Xântico
  rationale: Nome do mês macedônio, transliterado numa forma portuguesa clara e historicamente reconhecível, em vez de traduzido.
- source_word: πεντεκαιδεκάτῃ
  choice: no décimo quinto dia
  rationale: O adjetivo ordinal no dativo concorda com “dia”, subentendido no grego; o português explicita esse substantivo para produzir uma data natural.
