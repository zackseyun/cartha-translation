base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/031.yaml
  text: that the Jews may make use of their own provisions and laws[a], just as before[b]; and none of them shall in any way be harassed concerning the things done in ignorance.
translation:
  language: pt
  text: que os judeus possam usar suas próprias provisões e seguir suas leis, como antes[a]; e nenhum deles será de modo algum importunado a respeito do que foi ignorado[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como anteriormente”.
    reason: alternativa de tradução para καθὰ καὶ τὸ πρότερον
  - marker: b
    text: Ou “por causa das coisas feitas por ignorância” ou “a respeito de assuntos que haviam sido ignorados”. A expressão grega não especifica de quem era a ignorância nem a natureza dessas coisas.
    reason: ambiguidade lexical e sintática em περὶ τῶν ἠγνοημένων
lexical_decisions:
- source_word: χρῆσθαι
  choice: possam usar ... e seguir
  rationale: O infinitivo expressa a permissão concedida. Em português, a repetição semântica distribuída entre “usar” para provisões e “seguir” para leis soa natural, sem alterar o fato de que o grego emprega um único verbo para ambos os complementos.
- source_word: δαπανήμασιν
  choice: provisões
  rationale: O termo pode designar despesas, recursos ou provisões. “Provisões” mantém a referência concreta provável neste contexto sem restringi-la explicitamente a alimentos.
- source_word: νόμοις
  choice: leis
  rationale: Preserva o sentido jurídico-religioso de νόμος e evita reduzi-lo a meros costumes.
- source_word: καθὰ καὶ τὸ πρότερον
  choice: como antes
  rationale: Expressão portuguesa natural que conserva a referência à prática anterior.
- source_word: παρενοχληθήσεται
  choice: será ... importunado
  rationale: O futuro passivo descreve interferência ou perturbação sofrida; “importunado” comunica isso com dignidade e sem sugerir necessariamente violência física.
- source_word: περὶ τῶν ἠγνοημένων
  choice: por causa das coisas feitas por ignorância
  rationale: A formulação conserva a amplitude da expressão participial grega, que pode abranger atos praticados sem conhecimento, sem especificar a natureza exata das possíveis infrações.
theological_decisions:
- issue: Alcance de περὶ τῶν ἠγνοημένων
  choice: Proteção geral contra importunação por coisas feitas por ignorância
  alternative: Proteção referente a assuntos anteriormente ignorados ou não levados em conta
  rationale: O grego não identifica quem desconhecia os fatos nem define se eram infrações legais específicas. A tradução mantém a formulação ampla, e a nota registra a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A tradução evita limitar δαπανήμασιν a alimentos e preserva em nota a ambiguidade da cláusula final.
