  verdict: revise
  source_fidelity: A cláusula final grega, περὶ τῶν ἠγνοημένων, usa um particípio perfeito passivo neutro e não declara explicitamente que se trata de atos «feitos por ignorância». Essa redação resolve de modo excessivo uma expressão que também pode referir-se a coisas ou assuntos ignorados/omitidos. «Provisões» para δαπανήμασιν e «leis» para νόμοις são opções defensáveis e mantêm a amplitude do original.
  naturalness: O texto é claro e de registro adequado. A substituição de «por causa das coisas feitas por ignorância» por «a respeito do que foi ignorado» é natural em português e reproduz melhor a relação indicada por περί.
  terminology: «Seguir suas leis» comunica naturalmente o emprego de χρῆσθαι com νόμοις, sem enfraquecer o valor de νόμοις. «Importunado» é uma tradução aceitável de παρενοχληθήσεται no contexto de interferência ou assédio.
