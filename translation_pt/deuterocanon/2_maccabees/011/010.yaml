  text: They advanced in battle formation[a], having the ally from heaven before them, because the Lord had shown them mercy.
translation:
  language: pt
  text: Eles avançaram em formação de batalha[a], com o aliado vindo do céu à frente deles, pois o Senhor tivera misericórdia deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles avançaram equipados para a batalha, com o aliado celestial indo à frente deles.” O início da frase grega é condensado e admite construções ligeiramente diferentes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πρόηγον
  choice: avançaram ... diante de si
  rationale: A expressão participial neutra singular é condensada e pouco usual. No contexto, descreve o avanço e permite manter a ideia de que o aliado celestial estava diante deles.
- source_word: ἐν διασκευῇ
  choice: em formação de batalha
  rationale: A expressão indica equipamento, preparo ou disposição para o combate; esta formulação preserva tanto a prontidão quanto o caráter militar.
- source_word: σύμμαχον
  choice: aliado
  rationale: O substantivo designa alguém que combate ao lado de outro e conserva melhor a força militar do termo do que uma palavra genérica como “ajudador”.
- source_word: ἀπʼ οὐρανοῦ
  choice: vindo do céu
  rationale: Neste contexto religioso e militar, οὐρανός se refere ao céu como esfera divina, não apenas ao firmamento físico.
- source_word: ἐλεήσαντος
  choice: havia tido misericórdia
  rationale: O particípio aoristo apresenta a misericórdia do Senhor como fundamento do avanço confiante; o mais-que-perfeito composto expressa naturalmente essa relação anterior em português.
- source_word: τοῦ κυρίου
  choice: o Senhor
  rationale: No contexto das Escrituras judaicas, κύριος é uma referência reverente a Deus e é traduzido de modo tradicional como “Senhor”.
theological_decisions:
- issue: Identidade do “aliado vindo do céu”
  choice: Mantida implícita como “o aliado vindo do céu”
  alternative: Um anjo auxiliador ou a ajuda direta de Deus
  rationale: O grego não identifica explicitamente o aliado celestial; a tradução conserva essa abertura teológica sem especificar um anjo nem uma manifestação divina direta.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A formulação preserva o caráter militar do versículo e a ambiguidade sintática da abertura por meio da nota.
