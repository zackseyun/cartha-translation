  text: 'And the king’s letter contained this: “King Antiochus to his brother Lysias[b][a], greetings.”'
translation:
  language: pt
  text: 'A carta do rei dizia o seguinte: “O rei Antíoco a seu irmão Lísias:[a] saudações.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmão” pode ser um título da corte que indica proximidade política, e não necessariamente parentesco literal.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡ ... τοῦ βασιλέως ἐπιστολή
  choice: A carta do rei
  rationale: ἐπιστολή é o termo comum para uma mensagem escrita; “carta” é natural e atual em português, preservando o genitivo “do rei”.
- source_word: περιεῖχεν οὕτως
  choice: dizia o seguinte
  rationale: Embora a expressão signifique literalmente “continha assim”, ela introduz idiomaticamente o teor da carta. “Dizia o seguinte” comunica essa função com naturalidade.
- source_word: Βασιλεὺς Ἀντίοχος
  choice: O rei Antíoco
  rationale: Reproduz de modo natural em português a sequência grega de título e nome no cabeçalho da carta.
- source_word: τῷ ἀδελφῷ Λυσίᾳ
  choice: seu irmão Lísias
  rationale: O possessivo explicita em português a relação indicada pelo remetente, sem decidir se ἀδελφός descreve parentesco literal ou um título cortesão.
- source_word: χαίρειν
  choice: saúda
  rationale: χαίρειν é a fórmula epistolar grega convencional. Integrada à frase, “saúda” produz um cabeçalho conciso e natural em português.
