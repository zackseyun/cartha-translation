  text: Menelaus informed us that you wish, after coming down, to attend to your own affairs.
translation:
  language: pt
  text: Menelau nos informou de que deseja que vocês, depois de descerem, se ocupem de seus próprios assuntos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estejam com os seus”. A expressão grega pode referir-se aos próprios assuntos ou bens, ou às pessoas do próprio grupo; a formulação do texto-fonte é difícil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεφάνισεν
  choice: informou
  rationale: O verbo indica tornar algo conhecido ou comunicá-lo; “informou” é natural em português moderno e adequado ao tom oficial da carta.
- source_word: βουλόμενος
  choice: desejam
  rationale: O particípio expressa vontade. “Desejam” preserva o tom cortês e formal melhor do que o coloquial “querem”.
- source_word: κατελθόντας
  choice: depois de descer
  rationale: O particípio aoristo tem sentido temporal provável. A tradução mantém o movimento descendente e não explicita um destino que o grego deixa implícito.
- source_word: γίνεσθαι πρὸς τοῖς ἰδίοις
  choice: cuidar dos seus próprios assuntos
  rationale: A expressão é difícil e pode apontar para os próprios interesses, bens ou pessoas. No texto principal, esta formulação comunica naturalmente a leitura referente aos próprios assuntos, enquanto a nota preserva a alternativa pessoal.
- source_word: ὑμᾶς
  choice: vocês
  rationale: Pronome de segunda pessoa do plural, dirigido à comunidade como grupo; “vocês” oferece ampla legibilidade brasileira.
- source_word: Μενέλαος
  choice: Menelau
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida do nome grego.
