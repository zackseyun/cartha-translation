  text: Farewell[a]. May it be as we desire; and we ourselves also are in good health.
translation:
  language: pt
  text: Passem bem.[a] Que seja como desejamos; e nós mesmos também estamos com boa saúde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Estejam bem”. A expressão também era usada convencionalmente em correspondência.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρρωσθε
  choice: Passem bem
  rationale: A forma pode funcionar como saudação ou despedida epistolar, literalmente ligada à ideia de estar forte ou bem. “Passem bem” conserva essa nuance e soa digna em português.
- source_word: εἴη ἂν
  choice: Que tudo seja
  rationale: O optativo com ἄν exprime desejo. A inclusão de “tudo” torna a frase natural em português sem especificar indevidamente o conteúdo desejado.
- source_word: ὡς βούλομεθα
  choice: como desejamos
  rationale: Mantém o sentido volitivo de βούλομαι e o registro formal da correspondência.
- source_word: καὶ αὐτοὶ δὲ
  choice: nós também
  rationale: Reproduz a referência enfática aos remetentes e a ideia aditiva, evitando uma formulação portuguesa pesada como “nós mesmos também”.
- source_word: ὑγιαίνομεν
  choice: estamos com boa saúde
  rationale: Expressa diretamente o sentido de estar saudável e corresponde ao uso epistolar do verbo.
