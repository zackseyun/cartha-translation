base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/004.yaml
  text: not at all taking into account the might of God[b][a], but puffed up by the tens of thousands of foot soldiers and the thousands of horsemen and the eighty elephants.
translation:
  language: pt
  text: sem levar de modo algum em conta o poder de Deus, mas cheio de orgulho pelas dezenas de milhares de soldados de infantaria[a], pelos milhares de cavaleiros e pelos oitenta elefantes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz «miríades de soldados de infantaria»; a expressão pode indicar literalmente dezenas de milhares ou, de modo mais geral, um número muito grande.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδάμως
  choice: de modo algum
  rationale: Preserva a negação enfática do advérbio grego em português natural e digno.
- source_word: ἐπιλογιζόμενος
  choice: levar em conta
  rationale: Expressa a ideia de considerar ou calcular um fator, adequada ao contraste com a confiança nos recursos militares.
- source_word: τὸ τοῦ θεοῦ κράτος
  choice: o poder de Deus
  rationale: κράτος indica aqui força ou poder efetivo, em contraste com o poderio militar humano; «poder» é claro e natural em português amplo.
- source_word: πεφρονηματισμένος
  choice: cheio de orgulho
  rationale: Comunica o estado persistente de exaltação arrogante indicado pelo particípio perfeito, sem recorrer a uma expressão excessivamente coloquial.
- source_word: μυριάσιν τῶν πεζῶν
  choice: dezenas de milhares de soldados de infantaria
  rationale: Mantém o valor numérico possível de μυριάδες e a referência explícita às tropas a pé, sem afirmar uma contagem exata.
- source_word: χιλιάσι τῶν ἱππέων
  choice: milhares de cavaleiros
  rationale: Reproduz a expressão numérica plural e identifica de maneira concreta as tropas montadas.
- source_word: ἐλέφασιν τοῖς ὀγδοήκοντα
  choice: oitenta elefantes
  rationale: Traduz diretamente a quantidade exata e o substantivo da enumeração militar.
theological_decisions:
- issue: Sentido de τὸ τοῦ θεοῦ κράτος no contraste com os recursos militares
  choice: o poder de Deus
  alternative: a força de Deus; o domínio de Deus
  rationale: O contexto destaca a capacidade efetiva de Deus diante do poderio militar. «Poder» preserva essa ideia sem especificar domínio régio nem restringi-la à força física.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém o contraste grego entre a desconsideração do poder divino e a confiança orgulhosa nas forças militares.
