base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/002.yaml
  text: After gathering about eighty thousand men and all the cavalry[a], he advanced against the Jews, intending to make the city a dwelling place for Greeks,
translation:
  language: pt
  text: Depois de reunir cerca de oitenta mil homens e toda a cavalaria, ele avançou contra os judeus[a], pretendendo fazer da cidade uma morada para gregos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os habitantes da Judeia”. O grego Ἰουδαίους pode designar o povo judeu ou as pessoas da Judeia, conforme o contexto.
    reason: Alternativa lexical que preserva a possível dimensão geográfica da designação grega em português natural.
lexical_decisions:
- source_word: συναθροίσας
  choice: Depois de reunir
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal; a formulação preserva essa sequência de modo natural em português.
- source_word: περὶ τὰς ὀκτὼ μυριάδας
  choice: cerca de oitenta mil homens
  rationale: μυριάς designa dez mil, de modo que oito miríades correspondem a oitenta mil; περί diante do numeral indica aproximação. “Homens” é explicitado pelo contexto militar.
- source_word: τὴν ἵππον ἅπασαν
  choice: toda a cavalaria
  rationale: Em contexto militar, ἵππος pode designar coletivamente a tropa montada, e não apenas os cavalos.
- source_word: παρεγένετο ἐπὶ τοὺς Ἰουδαίους
  choice: ele avançou contra os judeus
  rationale: A construção com ἐπί e acusativo exprime aqui movimento hostil contra um adversário; “avançou contra” comunica com clareza o cenário militar.
- source_word: λογιζόμενος
  choice: pretendendo
  rationale: No contexto, o particípio exprime desígnio ou intenção, não apenas reflexão mental.
- source_word: τὴν μὲν πόλιν
  choice: da cidade
  rationale: Na construção portuguesa “fazer da cidade”, o objeto grego é expresso naturalmente por complemento introduzido por “de”. A partícula μέν antecipa a continuação no versículo seguinte, por isso a frase termina com vírgula.
- source_word: Ἕλλησιν
  choice: para gregos
  rationale: 'O dativo indica os beneficiários ou habitantes previstos: a cidade seria uma morada destinada a gregos. A ausência de artigo no grego é refletida de forma natural.'
- source_word: οἰκητήριον ποιήσειν
  choice: fazer da cidade uma morada
  rationale: A expressão significa tornar algo um lugar de habitação. “Fazer da cidade uma morada” é corrente, clara e não acrescenta a ideia mais específica de colônia.
theological_decisions:
- issue: Designação étnica ou geográfica Ἰουδαίους
  choice: os judeus
  alternative: os judeanos
  rationale: O termo pode designar tanto o povo judeu quanto os habitantes da Judeia. Neste contexto, o grupo é apresentado como povo envolvido no conflito, favorecendo “os judeus”, enquanto “os judeanos” permanece uma alternativa lexical legítima e é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O pronome “ele” explicita o sujeito retomado do contexto anterior. A vírgula final preserva a estrutura incompleta do versículo, pois μέν prepara o contraste ou desenvolvimento que continua no versículo seguinte.
