base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/008.yaml
  text: And there[a], when they were near Jerusalem, a horseman appeared going before them[b], clothed in white and brandishing golden armor.
translation:
  language: pt
  text: Ali mesmo, quando estavam perto de Jerusalém, apareceu um cavaleiro que ia à frente deles[a], vestido de branco e brandindo uma armadura completa de ouro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que os precedia”. O particípio grego indica que ele estava ou avançava diante deles, sem afirmar explicitamente que exercia o comando.'
    reason: lexical_alternative
  - marker: b
    text: O texto não identifica explicitamente o cavaleiro. A descrição pode sugerir um protetor celestial, mas a tradução não acrescenta essa identificação ao que o grego declara.
    reason: cultural_note
lexical_decisions:
- source_word: αὐτόθι
  choice: ali mesmo
  rationale: Mantém o valor locativo enfático do advérbio, remetendo ao lugar mencionado no contexto, sem transformá-lo em mero marcador temporal.
- source_word: πρὸς τοῖς Ἱεροσολύμοις
  choice: perto de Jerusalém
  rationale: Com o dativo, πρός expressa aqui proximidade; a formulação é natural e não afirma que já estivessem dentro da cidade.
- source_word: ὄντων
  choice: quando estavam
  rationale: Converte o genitivo absoluto em oração temporal idiomática, preservando o sujeito implícito no plural.
- source_word: ἐφάνη
  choice: apareceu
  rationale: Expressa uma manifestação visível e repentina sem identificar a natureza do personagem.
- source_word: προηγούμενος αὐτῶν
  choice: que ia à frente deles
  rationale: Preserva a imagem espacial do particípio sem concluir que o cavaleiro exercia formalmente o comando militar.
- source_word: ἔφιππος
  choice: um cavaleiro
  rationale: O adjetivo é empregado substantivamente e descreve alguém montado a cavalo; “cavaleiro” é a equivalência portuguesa mais clara.
- source_word: ἐν λευκῇ ἐσθῆτι
  choice: vestido de branco
  rationale: Formulação portuguesa concisa e digna para a veste branca descrita no grego.
- source_word: πανοπλίαν χρυσῆν
  choice: uma armadura completa de ouro
  rationale: πανοπλία designa o conjunto completo da armadura; “completa” conserva uma precisão que se perderia em “armadura” apenas.
- source_word: κραδαίνων
  choice: brandindo
  rationale: Conserva a ideia de movimento vigoroso e ostensivo, embora o objeto seja, de modo incomum, a armadura completa.
theological_decisions:
- issue: Identidade da figura montada
  choice: Descrever apenas “um cavaleiro” que apareceu
  alternative: Identificá-lo como anjo, protetor celestial ou guerreiro enviado por Deus
  rationale: O grego relata a aparência e as ações da figura, mas não a identifica explicitamente. A tradução preserva essa reserva narrativa e permite a inferência sem torná-la afirmação textual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. “Ali mesmo” conserva a referência espacial; “armadura completa” retém o sentido específico de πανοπλία. A construção deliberadamente incomum “brandindo uma armadura completa” acompanha a imagem do texto grego, sem normalizá-la silenciosamente como espada ou arma.
