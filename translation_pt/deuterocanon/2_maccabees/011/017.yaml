  yaml_path: translation/deuterocanon/2_maccabees/011/017.yaml
  text: John and Absalom[a], who were sent by you, delivered the written memorandum and made request concerning the matters indicated in it.
translation:
  language: pt
  text: João e Absalão, enviados por vocês, apresentaram o comunicado escrito abaixo[a] e fizeram um pedido a respeito dos assuntos nele indicados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o documento anexado” ou “a determinação escrita abaixo”. A expressão grega é documental e um tanto técnica.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωάνης
  choice: João
  rationale: Forma bíblica tradicional e amplamente reconhecida em português para o nome próprio grego.
- source_word: Ἀβεσσαλώμ
  choice: Absalão
  rationale: Forma bíblica tradicional e reconhecível em português, adequada ao nome próprio grego.
- source_word: οἱ πεμφθέντες παρʼ ὑμῶν
  choice: enviados por vocês
  rationale: Expressão natural em português que preserva tanto o sentido passivo do particípio quanto a ideia de que os destinatários haviam incumbido os dois homens dessa missão.
- source_word: ἐπιδόντες
  choice: apresentaram
  rationale: No contexto diplomático e documental, o verbo indica a entrega ou apresentação formal de um documento.
- source_word: τὸν ὑπογεγραμμένον χρηματισμόν
  choice: o comunicado escrito abaixo
  rationale: Mantém o tom documental de χρηματισμός e o sentido espacial ou editorial de ὑπογεγραμμένον, sem definir o texto de modo excessivamente técnico como decreto.
- source_word: ἠξίουν
  choice: fizeram um pedido
  rationale: Reproduz o tom formal do imperfeito em contexto diplomático, evitando a informalidade de simplesmente 'pediram'.
- source_word: περὶ τῶν διʼ αὐτοῦ σημαινομένων
  choice: a respeito dos assuntos nele indicados
  rationale: Entende αὐτοῦ como referência ao comunicado e verte a construção de maneira clara, sem especificar qual era o conteúdo do pedido.
