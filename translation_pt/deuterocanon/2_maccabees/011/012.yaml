base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/012.yaml
  text: But most of them escaped wounded and naked[a], and Lysias himself also escaped by fleeing shamefully.
translation:
  language: pt
  text: A maioria deles, porém, escapou ferida e nua[a]; e o próprio Lísias também escapou, fugindo vergonhosamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «despojada», caso γυμνοί se refira a terem sido privados das roupas ou da armadura durante a fuga, e não a estarem totalmente nus.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πλείονες
  choice: a maioria deles
  rationale: O comparativo substantivado indica a maior parte do grupo; «a maioria deles» preserva com naturalidade o sentido quantitativo.
- source_word: τραυματίαι
  choice: ferida
  rationale: O termo designa pessoas que sofreram ferimentos. A concordância no singular com o coletivo «maioria» produz português natural sem perder o sentido.
- source_word: γυμνοὶ
  choice: nua
  rationale: O sentido básico é «nua». No contexto da fuga militar, pode indicar que foram despojados, mas o grego não especifica se estavam totalmente sem roupa.
- source_word: διεσώθησαν
  choice: escapou
  rationale: No contexto da batalha, διασῴζω descreve sobreviver e conseguir fugir; «escapou» comunica ambos os aspectos de modo conciso.
- source_word: αἰσχρῶς
  choice: vergonhosamente
  rationale: O advérbio caracteriza a fuga como desonrosa e preserva a avaliação explícita do texto grego.
- source_word: φεύγων
  choice: fugindo
  rationale: O particípio presente exprime a circunstância ou maneira pela qual Lísias escapou; o gerúndio mantém essa relação sem torná-la excessivamente causal.
