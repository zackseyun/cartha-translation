  yaml_path: translation/deuterocanon/2_maccabees/011/020.yaml
  text: But concerning these matters in detail[b][a], I have given orders that both these men and those from me should speak with you.
translation:
  language: pt
  text: 20 Quanto a essas questões, em particular, dei instruções para que tanto estes homens como os que vêm da minha parte[a] conversem com vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os da minha parte”; provavelmente se refere aos representantes ou agentes do rei.
    reason: lexical_alternative
  - marker: b
    text: Ou “tratem do assunto com vocês”. O verbo grego pode indicar discussão ou negociação, e não apenas uma conversa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ δὲ τούτων
  choice: Quanto a essas questões
  rationale: ὑπέρ com o genitivo tem aqui o sentido de “a respeito de”; δέ funciona como uma transição leve, expressa naturalmente por “quanto a” no contexto epistolar.
- source_word: κατὰ μέρος
  choice: em detalhe
  rationale: A expressão indica tratar os assuntos por partes ou ponto por ponto; “em detalhe” é natural e preserva o teor administrativo.
- source_word: ἐντέταλμαι
  choice: dei instruções
  rationale: O perfeito de ἐντέλλομαι comunica instruções oficiais já dadas e ainda vigentes. “Dei instruções” mantém a autoridade sem intensificar desnecessariamente para “ordenei”.
- source_word: τούτους τε καὶ τοὺς παρʼ ἐμοῦ
  choice: tanto estes homens como os que vêm da minha parte
  rationale: A construção τε...καί coordena os dois grupos. “Estes homens” remete aos representantes mencionados no contexto, enquanto “os que vêm da minha parte” conserva a relativa indeterminação da expressão grega.
- source_word: διαλεχθῆναι ὑμῖν
  choice: conversem com vocês
  rationale: διαλέγομαι pode indicar conversar, discutir ou negociar. “Conversem com vocês” é claro, atual e deixa aberta a natureza exata do diálogo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formulação administrativa natural. Empregou-se “vocês” para o plural de segunda pessoa, favorecendo ampla legibilidade brasileira sem coloquialismo excessivo.
