  text: But since he was not foolish[a], but was considering the defeat that had happened to him and had realized that the Hebrews were unconquerable, because the mighty God was fighting alongside them, he sent ahead
translation:
  language: pt
  text: Mas, como não era insensato, ao considerar o revés que lhe acontecera e reconhecer que os hebreus eram inconquistáveis, pois o Deus poderoso lutava ao lado deles[a], enviou antecipadamente
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo o Deus poderoso como seu aliado”. O verbo grego contém a ideia de agir como aliado, especialmente em contexto militar.'
    reason: Alternativa lexical para συμμαχοῦντος que preserva a ideia de aliança militar.
lexical_decisions:
- source_word: οὐκ ἀνόους δὲ ὑπάρχων
  choice: Mas, como não era insensato
  rationale: ἀνόους indica falta de entendimento ou bom senso. “Não era insensato” conserva a forma negativa e o tom avaliativo; “como” expressa naturalmente a relação circunstancial com a ação principal.
- source_word: πρὸς ἑαυτὸν ἀντιβάλλων
  choice: ponderou consigo mesmo
  rationale: ἀντιβάλλω pode indicar pôr em confronto, comparar ou ponderar. Com πρὸς ἑαυτόν, a expressão descreve uma reflexão interior; “ponderou consigo mesmo” comunica isso sem a rigidez de uma tradução palavra por palavra.
- source_word: τὸ γεγονὸς περὶ αὐτὸν ἐλάττωμα
  choice: o revés que lhe havia acontecido
  rationale: ἐλάττωμα pode designar perda, desvantagem ou revés. No contexto militar, “revés” é preciso sem necessariamente sugerir uma derrota total.
- source_word: συννοήσας
  choice: reconheceu
  rationale: O particípio aoristo indica que ele chegou a compreender a situação antes de enviar a mensagem. “Reconheceu” exprime essa percepção concluída.
- source_word: ἀνικήτους εἶναι τοὺς Ἑβραίους
  choice: que os hebreus eram inconquistáveis
  rationale: ἀνίκητος significa não vencido ou impossível de vencer. “Inconquistáveis” preserva a força do adjetivo e o contexto militar.
- source_word: τοῦ δυναμένου θεοῦ
  choice: o Deus poderoso
  rationale: A expressão participial caracteriza Deus como capaz ou poderoso. “O Deus poderoso” é natural em português e mantém a ênfase em seu poder eficaz.
- source_word: συμμαχοῦντος αὐτοῖς
  choice: lutava ao lado deles
  rationale: συμμαχέω significa combater junto, atuar como aliado ou prestar auxílio militar. “Lutava ao lado deles” torna explícita a nuance bélica do contexto.
- source_word: προαποστείλας
  choice: enviou antecipadamente
  rationale: O verbo composto indica enviar antes ou com antecedência. A formulação mantém o movimento para a continuação da frase no versículo seguinte, sem acrescentar um objeto ausente neste trecho.
theological_decisions:
- issue: Atribuição da invencibilidade dos hebreus ao auxílio divino em combate
  choice: pois o Deus poderoso lutava ao lado deles
  alternative: tendo o Deus poderoso como aliado
  rationale: O grego apresenta Deus como participante ativo e aliado dos hebreus no contexto militar. A tradução mantém essa afirmação sem reduzi-la a uma providência genérica nem ampliá-la além do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sequência de particípios gregos foi organizada em orações naturais, preservando a relação lógica e o caráter incompleto da frase, que prossegue no versículo seguinte.
