base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/025.yaml
  text: Therefore[a], since we also choose that this nation should be free from disturbance, we decide that the temple should be restored to them, and that they should live according to the customs of their ancestors.
translation:
  language: pt
  text: Portanto, visto que queremos que esta nação também fique livre de perturbações, decidimos que o templo lhes seja restituído e que vivam segundo os costumes de seus antepassados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “organizem sua vida em comunidade segundo os costumes vigentes no tempo de seus antepassados”.'
    reason: Preserva tanto a dimensão cívico-comunitária de πολιτεύεσθαι quanto a possível nuance temporal de ἐπὶ τῶν προγόνων.
lexical_decisions:
- source_word: αἱρούμενοι
  choice: visto que queremos
  rationale: O particípio médio expressa a preferência ou escolha de uma política. A construção causal torna a relação com a decisão principal natural em português, sem eliminar o elemento volitivo.
- source_word: καὶ τοῦτο τὸ ἔθνος
  choice: esta nação também
  rationale: 'A posição de καί favorece sua ligação com “esta nação”: a política de evitar perturbações deve abranger também o povo judeu.'
- source_word: ἐκτὸς ταραχῆς
  choice: livre de perturbações
  rationale: A expressão indica ausência de agitação, desordem ou conflito, especialmente no âmbito público; a formulação mantém essa amplitude.
- source_word: κρίνομεν
  choice: decidimos
  rationale: No contexto de uma carta governamental, o verbo indica uma determinação administrativa, sem exigir o sentido técnico mais forte de “decretamos”.
- source_word: τὸ ἱερὸν
  choice: o templo
  rationale: Embora possa designar um lugar sagrado ou santuário, neste contexto refere-se naturalmente ao templo de Jerusalém.
- source_word: ἀποκατασταθῆναι αὐτοῖς
  choice: lhes seja restituído
  rationale: O infinitivo passivo indica que o templo deve ser devolvido ou restaurado a eles em sua condição e posse anteriores. “Restituído” preserva a ideia relacional expressa por αὐτοῖς.
- source_word: πολιτεύεσθαι
  choice: que vivam
  rationale: O verbo abrange a condução da vida cívica ou comunitária. “Vivam”, qualificado pelos costumes ancestrais, comunica o sentido com clareza sem transformar a concessão em independência política explícita.
- source_word: κατὰ τὰ ἐπὶ τῶν προγόνων αὐτῶν ἔθη
  choice: segundo os costumes de seus antepassados
  rationale: A expressão se refere às práticas ancestrais e pode conter a nuance temporal de costumes vigentes no tempo dos antepassados; essa nuance é registrada na nota.
theological_decisions:
- issue: Alcance de πολιτεύεσθαι em relação à lei e aos costumes judaicos
  choice: Expressar de modo amplo a vida comunitária regida pelos costumes ancestrais.
  alternative: “governem-se segundo os costumes de seus antepassados”
  rationale: O verbo possui conotações cívicas, mas o complemento referente aos costumes indica sobretudo permissão para manter o modo de vida comunitário e religioso tradicional, não necessariamente uma concessão de autonomia política plena.
translation_notes:
  register: Português moderno, digno e acessível, com formulação administrativa adequada ao contexto da carta. O marcador foi colocado junto à expressão cuja ambiguidade lexical a nota esclarece.
