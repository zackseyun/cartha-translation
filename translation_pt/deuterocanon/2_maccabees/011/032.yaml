  text: And I have also sent Menelaus to encourage you[a].
translation:
  language: pt
  text: E também enviei Menelau para encorajar vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “exortar vocês” ou “fazer um apelo a vocês”. O verbo grego παρακαλέω pode incluir encorajamento, exortação ou apelo, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπομφα
  choice: enviei
  rationale: O perfeito ativo indica uma ação concluída com relevância presente. Em português, o pretérito perfeito simples é a forma mais natural neste contexto epistolar.
- source_word: δὲ
  choice: E
  rationale: Aqui, δέ funciona como conectivo leve, dando continuidade ao pensamento sem contraste forte.
- source_word: καὶ
  choice: também
  rationale: Expressa a ideia aditiva de que Menelau foi enviado como recurso ou emissário adicional.
- source_word: τὸν Μενέλαον
  choice: Menelau
  rationale: Adota-se a forma portuguesa tradicional e amplamente reconhecida do nome grego Μενέλαος.
- source_word: παρακαλέσοντα
  choice: para encorajar
  rationale: O particípio futuro expressa propósito após o verbo de envio. παρακαλέω pode abranger encorajar, exortar e fazer um apelo; no contexto diplomático, “encorajar” preserva bem seu sentido amplo e positivo.
- source_word: ὑμᾶς
  choice: vocês
  rationale: É o objeto plural do particípio e se refere diretamente aos destinatários da carta; “vocês” oferece leitura clara e natural em português moderno.
