lexical_decisions:
- source_word: ἔρρωσθε
  choice: Saudações
  rationale: Fórmula epistolar de encerramento que deseja saúde ou bem-estar; “Saudações” soa natural e digno em português, sem reproduzir de modo rígido a força imperativa literal.
- source_word: ἔτους ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: No ano cento e quarenta e oito
  rationale: Traduz naturalmente a fórmula grega de datação e conserva o número por extenso, adequado ao tom documental.
- source_word: Διὸς Κορινθίου
  choice: Dios Coríntios
  rationale: Mantém por transliteração o nome histórico do mês preservado no grego, em vez de impor uma equivalência incerta com outro calendário.
- source_word: τετράδι καὶ εἰκάδι
  choice: no vigésimo quarto dia
  rationale: O idiomatismo grego, literalmente “no quarto e vigésimo”, indica o vigésimo quarto dia do mês; a forma portuguesa comunica a data com clareza.
