  text: 'And to the nation the king’s letter was as follows: “King Antiochus to the council of elders of the Jews and to the other Jews[b][a], greetings.”'
translation:
  language: pt
  text: 'E a carta do rei à nação era a seguinte: “O rei Antíoco, ao conselho de anciãos[b] dos judeus e aos demais judeus[a], saudações.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos outros judeus”.'
    reason: lexical_alternative
  - marker: b
    text: O termo grego traduzido por “conselho de anciãos” designa um corpo oficial de anciãos; outra tradução possível é “senado”.
    reason: cultural_note
lexical_decisions:
- source_word: Πρὸς δὲ τὸ ἔθνος
  choice: E ... à nação
  rationale: πρός com o acusativo introduz o destinatário da carta; “nação” preserva o sentido coletivo e político de ἔθνος.
- source_word: ἡ τοῦ βασιλέως ἐπιστολὴ τοιαύδε ἦν
  choice: a carta do rei ... dizia o seguinte
  rationale: Formulação natural em português para introduzir o teor de um documento, mantendo a posse expressa pelo genitivo.
- source_word: Βασιλεὺς Ἀντίοχος
  choice: O rei Antíoco
  rationale: Preserva o título real anteposto ao nome, de modo natural em português.
- source_word: τῇ γερουσίᾳ τῶν Ἰουδαίων
  choice: ao conselho de anciãos dos judeus
  rationale: γερουσία designa um corpo oficial de anciãos; “conselho de anciãos” é claro e evita as associações políticas modernas de “senado”.
- source_word: τοῖς ἄλλοις Ἰουδαίοις
  choice: aos demais judeus
  rationale: ἄλλοις distingue o restante dos judeus do conselho mencionado anteriormente; “demais” expressa essa relação com naturalidade.
- source_word: χαίρειν
  choice: envia saudações
  rationale: Trata-se da fórmula epistolar grega convencional. A forma verbal explicita em português a construção elíptica da saudação sem mudar seu sentido.
