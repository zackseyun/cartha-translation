lexical_decisions:
- source_word: Μετʼ ὀλίγον ... παντελῶς χρονίσκον
  choice: depois de pouquíssimo tempo
  rationale: A construção combina a ideia de um breve intervalo com o diminutivo χρονίσκον intensificado por παντελῶς. A formulação portuguesa é natural e preserva a brevidade enfática.
- source_word: ἐπίτροπος
  choice: tutor
  rationale: No contexto da corte, o termo designa alguém a quem o rei foi confiado, podendo também sugerir funções de regência. “Tutor” conserva o sentido básico sem impor um título constitucional específico.
- source_word: συγγενής
  choice: parente
  rationale: Expressa de modo claro e atual a relação familiar indicada pelo grego, sem arcaísmo desnecessário.
- source_word: ἐπὶ τῶν πραγμάτων
  choice: administrador dos assuntos do reino
  rationale: A expressão indica responsabilidade oficial pelos negócios públicos. A explicitação “do reino” torna o referente natural em português sem convertê-lo em um título técnico.
- source_word: λίαν βαρέως φέρων
  choice: profundamente abalado
  rationale: O idioma grego indica que Lísias recebeu muito mal ou sofreu intensamente por causa dos acontecimentos. A escolha preserva o forte peso emocional em português corrente e digno.
- source_word: ἐπὶ τοῖς γεγονόσι
  choice: com o que havia acontecido
  rationale: O particípio perfeito substantivado remete aos acontecimentos recentes. Esta formulação conserva naturalmente em português a perspectiva retrospectiva do grego.
