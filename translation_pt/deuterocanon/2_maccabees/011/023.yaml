lexical_decisions:
- source_word: τοῦ πατρὸς ἡμῶν
  choice: nosso pai
  rationale: Preserva o idioma dinástico e cortesão referente ao predecessor falecido, sem explicitar além do grego.
- source_word: εἰς θεοὺς μεταστάντος
  choice: tendo ... partido para junto dos deuses
  rationale: Mantém a fórmula eufemística pagã da corte helenística para a morte, em vez de reduzi-la a “morrido”.
- source_word: βουλόμενοι
  choice: desejando
  rationale: O particípio expressa a intenção declarada dos remetentes e se integra naturalmente à estrutura epistolar.
- source_word: τοὺς ἐκ τῆς βασιλείας
  choice: os habitantes do reino
  rationale: Expressa de modo natural as pessoas pertencentes ao âmbito do reino, sem acrescentar a ideia mais específica de “súditos”.
- source_word: ἀπερισπάστως ὄντας
  choice: livres de perturbações
  rationale: Comunica uma condição sem agitação ou distração; no contexto político, “perturbações” sugere estabilidade pública.
- source_word: γενέσθαι πρὸς τὴν τῶν Ἰουδαίων ἐπιμέλειαν
  choice: se dediquem aos assuntos dos judeus
  rationale: Torna inteligível a construção grega comprimida e preserva o campo semântico de atenção, cuidado ou administração, sem decidir que o objeto sejam exclusivamente as pessoas judias.
theological_decisions:
- issue: Manutenção da fórmula régia pagã para a morte
  choice: partido para junto dos deuses
  alternative: morrido
  rationale: A carta helenística emprega linguagem explicitamente pagã. A tradução preserva essa voz histórica em vez de normalizá-la segundo uma formulação monoteísta.
- issue: Objeto de ἐπιμέλεια na cláusula final
  choice: assuntos dos judeus
  alternative: cuidado dos judeus
  rationale: O genitivo e a sintaxe comprimida permitem entender tanto cuidado voltado aos judeus quanto atenção a seus assuntos. O texto principal adota a formulação contextual mais natural, e a nota preserva a alternativa.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura participial adequada ao trecho de uma carta régia. “Habitantes do reino” favorece legibilidade internacional; “judeus” permanece em minúscula segundo o uso corrente em português. A vírgula final foi mantida porque o versículo termina no meio do período epistolar.
