  yaml_path: translation/deuterocanon/2_maccabees/011/030.yaml
  text: Therefore[a], for those who come down until the thirtieth of Xanthicus, there will be a right hand of assurance together with permission[b],
translation:
  language: pt
  text: Portanto, para os que descerem até o dia trinta de Xântico[b], haverá uma garantia de boa-fé[a], juntamente com a permissão,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “uma mão direita com a permissão”. Nesse contexto, “mão direita” é uma expressão que indica uma garantia ou compromisso de boa-fé.
    reason: lexical_alternative
  - marker: b
    text: Xântico era o nome de um mês do calendário macedônio usado na datação helenística.
    reason: cultural_note
lexical_decisions:
- source_word: τοῖς ... καταπορευομένοις
  choice: para os que descerem
  rationale: O particípio de καταπορεύομαι indica movimento para baixo ou para longe. “Descerem” conserva essa direção sem especificar um destino que o grego não declara.
- source_word: μέχρι τριακάδος Ξανθικοῦ
  choice: até o dia trinta de Xântico
  rationale: Expressa o limite temporal de forma natural em português. Xântico é mantido como nome transliterado do mês macedônio.
- source_word: ὑπάρξει
  choice: haverá
  rationale: O futuro de ὑπάρχω tem aqui valor existencial; “haverá” evita introduzir um agente não expresso no grego.
- source_word: δεξιὰ
  choice: uma garantia de boa-fé
  rationale: Embora signifique literalmente “mão direita”, δεξιά é usado em linguagem diplomática e jurídica para uma garantia ou compromisso selado pela mão direita. A formulação comunica o sentido idiomático em português corrente.
- source_word: μετὰ τῆς ἀδείας
  choice: juntamente com a permissão
  rationale: Ἄδεια pode indicar permissão, liberdade ou autorização. “Permissão” preserva o sentido amplo de concessão oficial sem explicitar além do texto.
