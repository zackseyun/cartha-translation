translation_notes:
  register: Português moderno, digno e direto, adequado ao teor de uma carta oficial. “Parente do rei” evita o arcaísmo de “parente consanguíneo” ou “kinsman” e não transforma a expressão em um título cortesão sem apoio explícito no texto.
