  yaml_path: translation/deuterocanon/2_maccabees/011/035.yaml
  text: Concerning the things that Lysias, the king’s kinsman, granted to you, we also approve.
translation:
  language: pt
  text: Quanto ao que Lísias, parente do rei, concedeu a vocês, nós também aprovamos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὲρ ὧν
  choice: Quanto ao que
  rationale: Introduz o assunto em pauta. A formulação preserva a referência abrangente do grego e soa natural em português.
- source_word: Λυσίας
  choice: Lísias
  rationale: Forma portuguesa tradicional do nome grego, com acentuação adequada.
- source_word: ὁ συγγενὴς τοῦ βασιλέως
  choice: parente do rei
  rationale: συγγενής indica relação de parentesco. “Parente” é atual e claro, sem especificar um grau de parentesco que o grego não informa.
- source_word: συνεχώρησεν
  choice: concedeu
  rationale: No contexto diplomático, o verbo expressa concessão ou autorização oficial.
- source_word: ὑμῖν
  choice: a vocês
  rationale: Reproduz o objeto indireto plural de modo claro e amplamente compreensível, com boa legibilidade brasileira.
- source_word: καὶ ἡμεῖς συνευδοκοῦμεν
  choice: nós também aprovamos
  rationale: Expressa a adesão formal dos remetentes às concessões de Lísias, mantendo a ênfase explícita de ἡμεῖς e o valor associativo de συν-.
