  - marker: a
    text: Aqui, “irmãos” provavelmente se refere a outros judeus ou membros do mesmo povo.
    reason: cultural_note
lexical_decisions:
- source_word: αὐτὸς δὲ πρῶτος ὁ Μακκαβαῖος
  choice: Mas o próprio Macabeu, sendo o primeiro
  rationale: “O próprio” preserva a ênfase de αὐτός; “sendo o primeiro” comunica a iniciativa marcada por πρῶτος, e “mas” funciona como transição narrativa leve para δέ.
- source_word: ἀναλαβὼν τὰ ὅπλα
  choice: a empunhar as armas
  rationale: A expressão indica tomar as armas ou armar-se; “empunhar as armas” é idiomático em português e mantém o sentido militar.
- source_word: προετρέψατο τοὺς ἄλλους
  choice: exortou os outros
  rationale: “Exortou” conserva a força de incentivo e convocação de προτρέπω sem acrescentar uma ordem explícita.
- source_word: ἅμα αὐτῷ διακινδυνεύοντας
  choice: que com ele se arriscavam
  rationale: A oração relativa naturaliza o particípio acusativo que concorda com “os outros” e preserva a ideia de compartilhar o perigo com Macabeu, sem transformá-la silenciosamente em um segundo complemento de “exortou”.
- source_word: ἐπιβοηθεῖν τοῖς ἀδελφοῖς αὐτῶν
  choice: a socorrer seus irmãos
  rationale: “Socorrer” expressa a ajuda urgente de ἐπιβοηθέω; “irmãos” mantém a linguagem de parentesco do grego.
- source_word: ὁμοῦ δὲ καὶ προθύμως ἐξώρμησαν
  choice: e juntos se lançaram prontamente
  rationale: “Juntos” traduz ὁμοῦ, “prontamente” comunica a disposição de προθύμως, e “se lançaram” conserva o movimento enérgico de ἐξορμάω sem especificar indevidamente uma carga militar formal.
theological_decisions:
- issue: Sentido de ἀδελφοῖς αὐτῶν
  choice: seus irmãos
  alternative: seus compatriotas / seus parentes
  rationale: O grego emprega literalmente “irmãos”. Embora o contexto provavelmente se refira a outros judeus ou membros do mesmo povo, a tradução mantém a metáfora de parentesco e explica sua provável referência em nota.
- issue: Relação sintática de διακινδυνεύοντας com προετρέψατο
  choice: que com ele se arriscavam
  alternative: a enfrentar o perigo junto com ele e a socorrer
  rationale: O particípio acusativo concorda diretamente com “os outros” e pode descrevê-los circunstancialmente. A redação evita coordená-lo com o infinitivo “socorrer”, preservando a estrutura e a tensão interpretativa do grego.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluidez brasileira. A formulação mantém a sequência narrativa e a linguagem coletiva do original sem importar terminologia denominacional.
