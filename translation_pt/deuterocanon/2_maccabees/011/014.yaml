base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/014.yaml
  text: He persuaded him to come to terms on all the just demands[a], and that he would also persuade the king, compelling him to become their friend.
translation:
  language: pt
  text: Ele o persuadiu a chegar a um acordo sobre todas as reivindicações justas[a] e de que também persuadiria o rei, obrigando-o a tornar-se amigo deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a reconciliar-se em todas as questões legítimas” ou “a fazer um acordo sobre todas as reivindicações justas”. O grego συλλύεσθαι é conciso e pode indicar a obtenção de um entendimento ou acordo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεισεν
  choice: o persuadiu
  rationale: O aoristo de πείθω indica que ele convenceu ou persuadiu a pessoa mencionada no contexto; “persuadiu” é direto e preserva a ligação com πείσει na oração seguinte.
- source_word: συλλύεσθαι
  choice: a chegar a um acordo
  rationale: No contexto diplomático, o infinitivo médio/passivo comprimido expressa acomodação, reconciliação ou acordo, e não uma dissolução literal.
- source_word: ἐπὶ πᾶσι τοῖς δικαίοις
  choice: sobre todas as reivindicações justas
  rationale: τὰ δίκαια pode designar aquilo que é justo, devido ou legitimamente reivindicado; a formulação concreta se ajusta ao contexto de negociação.
- source_word: διότι καὶ τὸν βασιλέα πείσει
  choice: e lhe assegurou que também persuadiria o rei
  rationale: διότι é entendido como introduzindo mais conteúdo da persuasão. A explicitação “lhe assegurou” produz português natural sem transformar a oração em causa; o futuro πείσει é vertido como futuro do pretérito no discurso indireto.
- source_word: φίλον αὐτοῖς
  choice: amigo deles
  rationale: Preserva o predicativo φίλον e a ideia de amizade ou alinhamento político favorável.
- source_word: ἀναγκάζων γενέσθαι
  choice: pressionando-o a tornar-se
  rationale: ἀναγκάζω envolve coerção ou forte pressão. “Pressionando” conserva essa força e evita sugerir necessariamente força física.
theological_decisions:
- issue: Sentido de τοῖς δικαίοις no contexto político-jurídico
  choice: reivindicações justas
  alternative: questões legítimas; direitos justos
  rationale: Aqui o termo se refere ao que é justo ou devido numa negociação, não a uma doutrina abstrata de justiça ou retidão.
- issue: Relação sintática de διότι com ἔπεισεν
  choice: conteúdo adicional da persuasão, expresso por “lhe assegurou que”
  alternative: 'oração causal: “porque também persuadiria o rei”'
  rationale: A construção admite alguma compressão. A leitura de conteúdo acompanha o fluxo da promessa diplomática, mas a tradução evita apagar inteiramente a tensão sintática mediante uma formulação explicativa discreta.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A tradução mantém o tom político-diplomático e emprega “tornar-se” em vez da forma mais coloquial “se tornar”.
