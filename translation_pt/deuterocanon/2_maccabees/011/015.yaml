  yaml_path: translation/deuterocanon/2_maccabees/011/015.yaml
  text: And Maccabeus agreed to everything that Lysias urged, being concerned for what was advantageous; for whatever Maccabeus set before Lysias in writing concerning the Jews, the king granted.
translation:
  language: pt
  text: Macabeu concordou com tudo o que Lísias solicitava, tendo em vista o que era vantajoso; pois tudo o que Macabeu apresentou por escrito a Lísias a respeito dos judeus, o secretário[a] concedeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego desta edição diz “o secretário”; outros testemunhos trazem “o rei”.
    reason: Registra uma variante textual relevante que explica a leitura amplamente difundida “o rei”, sem substituir a leitura da edição-fonte.
lexical_decisions:
- source_word: ἐπένευσε
  choice: concordou
  rationale: Expressa assentimento ou anuência de modo natural, sem acrescentar a ideia de mera aprovação passiva.
- source_word: παρεκάλει
  choice: solicitava
  rationale: O verbo pode indicar pedir, instar ou exortar; no contexto de negociação, “solicitava” mantém o caráter de pedido insistente sem exagerá-lo.
- source_word: τοῦ συμφέροντος φροντίζων
  choice: tendo em vista o que era vantajoso
  rationale: Conserva a ideia de ponderar e cuidar daquilo que convinha ou trazia benefício, sem especificar indevidamente para quem.
- source_word: ἔδωκεν ... διὰ γραπτῶν
  choice: apresentou por escrito
  rationale: Reproduz idiomaticamente o ato de encaminhar a Lísias, em forma escrita, as questões relativas aos judeus.
- source_word: συνεχώρησεν
  choice: concedeu
  rationale: No contexto, indica deferir ou consentir com as solicitações apresentadas.
- source_word: ὁ γραμματεύς
  choice: o secretário
  rationale: Traduz diretamente o texto grego fornecido; “secretário” é natural para um oficial administrativo, enquanto “escriba” poderia sugerir indevidamente uma função religiosa judaica.
