lexical_decisions:
- source_word: ἔρρωσθε
  choice: Passem bem
  rationale: Fórmula epistolar de despedida, dirigida a mais de uma pessoa. A expressão portuguesa comunica de modo natural o desejo de bem-estar e a função de encerramento, sem transformar a fórmula em uma exortação literal à força.
- source_word: ἔτους
  choice: ano
  rationale: Equivalente direto na fórmula de datação.
- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: cento e quarenta e oito
  rationale: Preserva o número do ano na era usada pelo documento e segue a forma corrente, clara e idiomática de indicar anos em português.
- source_word: Ξανθικοῦ
  choice: Xântico
  rationale: Transliteração portuguesa do nome grego do mês, preservando a referência histórica do calendário macedônico.
- source_word: πεντεκαιδεκάτῃ
  choice: no décimo quinto dia
  rationale: A forma dativa indica a data; explicita-se “dia” para clareza e naturalidade em português.
