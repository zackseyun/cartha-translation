translation_notes:
  register: Português moderno, claro e digno, com tom administrativo apropriado a uma carta oficial. Emprega-se “vocês” de forma implícita no imperativo plural “enviem”, natural tanto no Brasil quanto em amplo uso internacional; a ambiguidade da expressão com ἔχωμεν é preservada na nota.
