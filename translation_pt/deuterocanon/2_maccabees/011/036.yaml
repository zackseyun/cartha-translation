base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/036.yaml
  text: But whatever he has decided should be presented to the king, send someone at once to examine these matters, so that we may settle them as is fitting for us; for we are going on to Antioch.
translation:
  language: pt
  text: Quanto ao que ele decidiu que fosse apresentado ao rei, enviem imediatamente alguém para examinar essas questões, a fim de que possamos resolvê-las como nos convém[a], pois estamos seguindo para Antioquia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que possamos tratar delas como é apropriado para nós”. O grego diz literalmente “para que as tenhamos como nos convém”, expressão que provavelmente se refere a encaminhar ou resolver adequadamente essas questões.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δὲ
  choice: Quanto ao que
  rationale: δέ introduz uma transição moderada, enquanto ἃ retoma de modo geral os assuntos mencionados; a formulação portuguesa conecta naturalmente esta instrução à anterior.
- source_word: ἔκρινεν
  choice: ele decidiu
  rationale: κρίνω designa aqui uma decisão administrativa, não necessariamente um julgamento judicial. O sujeito singular permanece implícito, como no grego.
- source_word: προσανενεχθῆναι τῷ Βασιλεῖ
  choice: que fosse apresentado ao rei
  rationale: O infinitivo passivo indica o encaminhamento formal de uma questão à autoridade real, sem definir um procedimento mais específico.
- source_word: πέμψατέ τινα παραχρῆμα
  choice: enviem imediatamente alguém
  rationale: Preserva a força imperativa e a urgência de παραχρῆμα; τινα é indefinido e não exige especificação de gênero em português.
- source_word: ἐπισκεψόμενον περὶ τούτων
  choice: para examinar essas questões
  rationale: O particípio futuro expressa a finalidade do envio e ἐπισκέπτομαι, neste contexto administrativo, comunica a ideia de averiguar ou examinar os assuntos.
- source_word: ἵνʼ ἔχωμεν ὡς καθήκει ἡμῖν
  choice: a fim de que possamos resolvê-las como nos convém
  rationale: O uso de ἔχω neste contexto é idiomático e provavelmente se refere a dar às questões o devido encaminhamento. A nota registra a expressão grega mais literal e preserva sua abertura sem deixar o texto principal obscuro.
- source_word: ἡμεῖς γὰρ προσάγομεν πρὸς Ἀντιοχίαν
  choice: pois estamos seguindo para Antioquia
  rationale: Com destino expresso por πρὸς, προσάγομεν descreve o avanço ou deslocamento rumo a Antioquia; γάρ apresenta a razão da urgência.
