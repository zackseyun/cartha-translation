base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/034.yaml
  text: 'The Romans also sent them a letter[a], worded as follows: “Quintus Memmius and Titus Manius, elders of the Romans, to the people of the Jews, greetings.”'
translation:
  language: pt
  text: 'Os romanos também lhes enviaram uma carta[a], redigida nos seguintes termos: “Quinto Mêmio e Tito Mânio, anciãos dos romanos, ao povo dos judeus, saudações.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “anciãos romanos” ou, conforme o contexto, “representantes dos romanos”. O termo grego significa literalmente “anciãos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπέμψαν δὲ καὶ οἱ Ῥωμαῖοι
  choice: Os romanos também lhes enviaram
  rationale: O aoristo de πέμπω indica simplesmente o ato de enviar; δὲ καὶ é expresso com naturalidade por “também”. “Os romanos” mantém o caráter coletivo do grego sem especificar indevidamente autoridades.
- source_word: ἐπιστολήν, ἔχουσαν οὕτως
  choice: uma carta, redigida nos seguintes termos
  rationale: “Carta” é o equivalente moderno comum de ἐπιστολή. A fórmula participial ἔχουσαν οὕτως introduz o teor do documento; “redigida nos seguintes termos” preserva seu tom formal.
- source_word: Κόιντος Μέμμιος, Τίτος Μάνιος
  choice: Quinto Mêmio e Tito Mânio
  rationale: Os nomes são aportuguesados segundo formas clássicas transparentes; a conjunção torna natural em português a enumeração assindética grega.
- source_word: πρεσβυταὶ Ῥωμαίων
  choice: anciãos dos romanos
  rationale: πρεσβυταί significa literalmente “anciãos”. Embora o contexto possa apontar para representantes ou emissários, o texto principal evita definir o cargo com mais precisão do que o grego permite.
- source_word: τῷ δήμῳ τῶν Ἰουδαίων
  choice: ao povo dos judeus
  rationale: δήμος designa o povo em sentido cívico ou corporativo. A formulação conserva de perto a estrutura e o tom epistolar do original.
- source_word: χαίρειν
  choice: saudações
  rationale: Trata-se da fórmula convencional de abertura de uma carta, não de uma ordem para alegrar-se.
