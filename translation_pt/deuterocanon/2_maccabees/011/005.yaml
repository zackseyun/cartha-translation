base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/005.yaml
  text: But after entering Judea and approaching Beth-zur[a], a fortified place about five schoeni from Jerusalem[b], he was besieging it.
translation:
  language: pt
  text: Depois de entrar na Judeia e aproximar-se de Bete-Zur, um local fortificado situado a cerca de cinco esquenos[a] de Jerusalém, ele a pressionava[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O esqueno era uma antiga unidade de distância, cujo comprimento exato variava conforme a época e a região.
    reason: cultural_note
  - marker: b
    text: Ou «sitiava-a». O verbo grego significa literalmente «pressionava» ou «afligia» e, neste contexto, provavelmente descreve pressão militar contra Bete-Zur.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: Depois de entrar
  rationale: O particípio aoristo indica uma ação anterior à ação principal; a formulação expressa essa sequência temporal em português natural.
- source_word: συνεγγίσας
  choice: se aproximar
  rationale: Traduz de modo direto o movimento de chegar perto de Bete-Zur, preservando a relação participial com a ação principal.
- source_word: Βεθσουρῶν
  choice: Bete-Zur
  rationale: Forma portuguesa reconhecível do topônimo semítico, próxima da tradição bíblica lusófona.
- source_word: ἐρυμνῷ χωρίῳ
  choice: um lugar fortificado
  rationale: Preserva tanto a ideia de localidade em χωρίον quanto a de força defensiva ou fortificação em ἐρυμνός, sem especificar indevidamente cidade ou fortaleza.
- source_word: ἀπέχοντι ὡσεὶ σχοίνους πέντε
  choice: situado a cerca de cinco esquenos de Jerusalém
  rationale: Mantém a aproximação expressa por ὡσεὶ e conserva a antiga unidade de distância, cuja conversão moderna seria incerta.
- source_word: τοῦτο
  choice: o lugar
  rationale: Explicita em português o referente do pronome grego — Bete-Zur enquanto lugar fortificado — evitando uma referência pronominal pouco clara.
- source_word: ἔθλιβε
  choice: submetia o lugar a forte pressão
  rationale: Conserva a imagem lexical de pressionar ou afligir e o aspecto continuativo do imperfeito, ao mesmo tempo que se ajusta ao contexto militar sem impor como única leitura o termo técnico «sitiar».
