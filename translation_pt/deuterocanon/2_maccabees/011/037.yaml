  yaml_path: translation/deuterocanon/2_maccabees/011/037.yaml
  text: Therefore hurry[a], and send some men[b], so that we too may learn what your intention is.
translation:
  language: pt
  text: Por isso, apressem-se e enviem algumas pessoas[a], para que também nós saibamos qual é a posição de vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «certas pessoas» ou «certos enviados». O grego τινας não identifica o grupo com maior precisão.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «de que tipo de opinião vocês são». A expressão pode se referir à opinião, disposição ou intenção deles.
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Por isso
  rationale: Conjunção inferencial que liga o pedido ao que foi dito antes, preservando a relação lógica em português natural.
- source_word: σπεύσατε
  choice: apressem-se
  rationale: O imperativo aoristo plural exige ação imediata; esta forma comunica urgência sem soar arcaica.
- source_word: πέμψατέ τινας
  choice: enviem alguns representantes
  rationale: πέμψατε significa «enviem», e τινας indica pessoas não especificadas. No contexto diplomático, «representantes» expressa naturalmente a função provável, sem determinar sua identidade.
- source_word: ὅπως
  choice: para que
  rationale: Introduz a finalidade do envio.
- source_word: καὶ ἡμεῖς
  choice: também nós
  rationale: Preserva a inclusão ou ênfase de καί sobre o pronome explícito ἡμεῖς.
- source_word: ἐπιγνῶμεν
  choice: saibamos
  rationale: O subjuntivo aoristo, na oração de finalidade, exprime chegar a conhecer ou determinar a posição dos destinatários.
- source_word: ὁποῖοί ἐστε γνώμης
  choice: qual é a posição de vocês
  rationale: A expressão grega pergunta literalmente de que tipo é a opinião ou disposição deles. «Posição» é natural no contexto de negociação e preserva a ideia de parecer ou orientação sem restringi-la apenas a uma intenção futura.
