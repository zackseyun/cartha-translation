  text: and to make the sanctuary taxable in silver[a], like the other temples of the nations, and to make the high priesthood sold each year[b];
translation:
  language: pt
  text: e tornar o santuário sujeito à cobrança de tributo em dinheiro[a], como os demais templos das nações, e pôr à venda, todos os anos, o sumo sacerdócio[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sujeito a um imposto em dinheiro” ou “avaliado para pagar tributo em dinheiro”. O raro adjetivo grego indica que o santuário seria transformado em fonte de receita monetária, à semelhança dos templos pagãos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tornar vendável, todos os anos, o sumo sacerdócio”. O grego apresenta o próprio cargo como algo que podia ser vendido, ressaltando a profanação pretendida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  choice: santuário
  rationale: Refere-se ao recinto sagrado de Jerusalém. “Santuário” preserva o sentido cultual e permite distingui-lo de τεμένη na sequência.
- source_word: ἀργυρολόγητον
  choice: sujeito à cobrança de tributo em dinheiro
  rationale: O adjetivo raro combina a noção de prata/dinheiro com arrecadação ou tributo. A formulação expressa que o santuário seria convertido em fonte de receita monetária, sem sugerir necessariamente uma modalidade fiscal mais específica do que o grego permite.
- source_word: τεμένη
  choice: templos
  rationale: Designa os recintos sagrados das nações; “templos” é a forma mais natural no português corrente neste contraste.
- source_word: πρατὴν
  choice: pôr à venda
  rationale: O adjetivo apresenta o cargo como vendável. A locução verbal é natural em português e mantém explícita a comercialização do ofício.
- source_word: ἀρχιερωσύνην
  choice: sumo sacerdócio
  rationale: Designa o cargo ou dignidade do sumo sacerdote, não apenas seu ocupante.
- source_word: κατʼ ἔτος
  choice: todos os anos
  rationale: Expressa a recorrência anual da venda do cargo.
- source_word: ποιήσειν
  choice: tornar / pôr
  rationale: O infinitivo tem força causativa e rege as duas propostas; em português, a variação idiomática evita uma construção artificial sem alterar essa relação.
