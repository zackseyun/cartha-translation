base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/016.yaml
  text: 'For letters had been written to the Jews from Lysias[a], containing this form: “Lysias to the multitude of the Jews[b], greetings.”'
translation:
  language: pt
  text: 'Pois cartas tinham sido escritas aos judeus por Lísias, com o seguinte teor[a]: “Lísias à multidão dos judeus[b]: saudações.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com a seguinte formulação”. A expressão grega pode referir-se à forma da carta ou às palavras que ela contém.
    reason: lexical_alternative
  - marker: b
    text: Ou “ao corpo dos judeus” ou “à comunidade dos judeus”. O termo grego designa um grande grupo coletivo, sem necessariamente indicar uma assembleia formal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν γὰρ γεγραμμέναι
  choice: Pois tinham sido escritas
  rationale: A construção perifrástica expressa um estado resultante anterior, bem representado pelo mais-que-perfeito composto passivo; γάρ liga a informação à explicação precedente.
- source_word: τοῖς Ἰουδαίοις
  choice: aos judeus
  rationale: Neste contexto, o termo designa o povo judeu como grupo étnico-religioso, não apenas os habitantes da Judeia.
- source_word: ἐπιστολαὶ
  choice: cartas
  rationale: É o termo corrente e natural para correspondência administrativa, sem a formalidade desnecessária de “epístolas”.
- source_word: παρὰ μὲν Λυσίου
  choice: da parte de Lísias
  rationale: παρά com o genitivo indica a origem ou procedência das cartas; “da parte de” preserva essa relação sem necessariamente converter a construção em voz ativa.
- source_word: περιέχουσαι τὸν τρόπον τοῦτον
  choice: com o seguinte teor
  rationale: A expressão introduz o conteúdo ou a formulação da carta. “Com o seguinte teor” é idiomático em português e mantém a possível referência tanto à forma quanto às palavras que seguem.
- source_word: τῷ πλήθει τῶν Ἰουδαίων
  choice: à comunidade dos judeus
  rationale: πλῆθος indica o corpo coletivo ou grande conjunto dos judeus. “Comunidade” comunica o destinatário coletivo com naturalidade, sem afirmar que se tratava de uma assembleia formal.
- source_word: χαίρειν
  choice: saudações
  rationale: No início de cartas, o infinitivo funciona como a fórmula epistolar convencional de saudação, e não como uma ordem literal para alegrar-se.
