translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe conserva o valor passivo e anterior da construção grega, enquanto “com o seguinte teor” emprega uma fórmula portuguesa corrente para introduzir uma carta citada.
