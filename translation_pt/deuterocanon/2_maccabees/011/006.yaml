base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/006.yaml
  text: But when those around Maccabeus learned that he was besieging the strongholds[a], they, together with the crowds, pleaded with the Lord with lamentations and tears to send a good angel for the salvation of Israel.
translation:
  language: pt
  text: Mas, quando Macabeu e os que estavam com ele souberam que Lísias sitiava as fortalezas, suplicaram ao Senhor, juntamente com as multidões, com lamentos e lágrimas, que enviasse um anjo bom para a salvação de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a libertação de Israel”. O termo grego pode indicar resgate ou libertação em uma crise concreta, além de salvação em sentido mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετέλαβον
  choice: souberam
  rationale: No contexto, o verbo indica que o grupo recebeu ou tomou conhecimento da ação militar; “souberam” é natural e evita o sentido inadequado de “participaram”.
- source_word: οἱ περὶ τὸν Μακκαβαῖον
  choice: os que estavam com Macabeu
  rationale: Expressa de modo natural o grupo ligado a Macabeu sem afirmar mais do que o idioma grego quanto à inclusão dele na ação.
- source_word: πολιορκοῦντα αὐτὸν τὰ ὀχυρώματα
  choice: que ele estava sitiando as fortalezas
  rationale: O particípio transmite uma ação militar em curso, e ὀχυρώματα designa lugares fortificados. O pronome “ele” preserva a referência anafórica do grego.
- source_word: μετὰ ὀδυρμῶν καὶ δακρύων
  choice: entre lamentos e lágrimas
  rationale: Mantém a intensidade emocional da súplica em português corrente e digno.
- source_word: ἱκέτευον
  choice: suplicaram
  rationale: Comunica uma petição intensa e reverente sem arcaísmo desnecessário.
- source_word: σὺν τοῖς ὄχλοις
  choice: juntamente com as multidões
  rationale: Preserva o caráter coletivo e público da oração.
- source_word: τὸν κύριον
  choice: ao Senhor
  rationale: No contexto de oração judaica, κύριος refere-se a Deus e conserva sua forma reverencial usual.
- source_word: ἀγαθὸν ἄγγελον
  choice: um anjo bom
  rationale: Tradução direta que preserva a formulação e não restringe indevidamente o sentido de ἀγαθός a “favorável” ou “protetor”.
- source_word: πρὸς σωτηρίαν τῷ Ἰσραήλ
  choice: para a salvação de Israel
  rationale: “Salvação” mantém a amplitude semântica e a ressonância teológica de σωτηρία, enquanto o contexto militar permite também o sentido concreto de libertação.
theological_decisions:
- issue: Tradução de κύριος em uma oração judaica
  choice: Senhor
  alternative: Deus
  rationale: A tradução conserva o termo do texto grego e sua força reverencial, sem substituir o título por uma identificação interpretativa.
- issue: Sentido de σωτηρία em uma crise militar
  choice: salvação
  alternative: libertação
  rationale: O contexto favorece a ideia de livramento concreto, mas “salvação” preserva a amplitude teológica do termo; a alternativa contextual é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem eliminar a ambiguidade do referente de “ele” nem a amplitude de “salvação”.
