lexical_decisions:
- source_word: εὖ οὖν ποιήσεις
  choice: Portanto, você fará bem
  rationale: Preserva o futuro idiomático com força de recomendação ou aprovação, em português atual e natural.
- source_word: διαπεμψάμενος πρὸς αὐτούς
  choice: em enviar uma mensagem a eles
  rationale: Expressa o ato de fazer chegar uma comunicação aos destinatários sem especificar indevidamente quem a levaria.
- source_word: δοὺς δεξιάς
  choice: lhes dar garantias de boa-fé
  rationale: Traduz o sentido diplomático da expressão literalmente ligada a 'dar as mãos direitas'; a nota registra a imagem grega.
- source_word: προαίρεσιν
  choice: intenção
  rationale: Representa o propósito deliberado sem acrescentar a ideia positiva de benevolência, que não está explícita no substantivo.
- source_word: εὔθυμοί
  choice: fiquem animados
  rationale: Comunica a ideia de ganhar ânimo ou confiança como resultado de conhecer a intenção declarada.
- source_word: ἡδέως διαγίνωνται πρὸς τῇ τῶν ἰδίων ἀντιλήψει
  choice: se dediquem de bom grado a cuidar dos próprios assuntos
  rationale: Reproduz de modo natural a ideia de prosseguir ocupando-se voluntariamente do que lhes diz respeito, sem restringir τὰ ἴδια apenas a bens materiais.
