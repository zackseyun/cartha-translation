translation:
  language: pt
  text: Portanto, você fará bem em enviar-lhes comunicação e lhes dar garantias de boa-fé[a], para que, conhecendo a nossa intenção, fiquem animados e se dediquem de bom grado a cuidar dos próprios assuntos.
