lexical_decisions:
- source_word: προσήγγειλεν
  choice: revelou
  rationale: Expressa a comunicação de informação secreta aos inimigos com naturalidade, sem acrescentar uma noção técnica de traição ausente do verbo.
- source_word: τὰ μυστήρια
  choice: os segredos
  rationale: No contexto militar, refere-se a informações confidenciais ou planos secretos, não a ritos religiosos.
- source_word: ἐκ τῆς Ἰουδαϊκῆς τάξεως
  choice: das fileiras judaicas
  rationale: Conserva a ideia de pertencimento ao grupo ou contingente judeu; “fileiras” é idiomático no contexto militar.
- source_word: ἀνεζητήθη
  choice: foi procurado
  rationale: Mantém o sentido passivo de busca ou procura dirigida contra Ródoco.
- source_word: κατελήμφθη
  choice: capturado
  rationale: No encadeamento de busca, captura e confinamento, traduz com precisão a detenção efetiva.
- source_word: κατεκλείσθη
  choice: preso
  rationale: Comunica de modo corrente que ele foi encerrado ou mantido em confinamento.
