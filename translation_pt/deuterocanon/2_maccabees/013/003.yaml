base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/003.yaml
  text: Menelaus also joined them and[a], with great insincerity, kept urging Antiochus on—not for the safety of the fatherland[b], but because he thought he would be established in power.
translation:
  language: pt
  text: Menelau também se juntou a eles e, com muita dissimulação[a], insistia com Antíoco — não pela segurança da pátria[b], mas porque pensava que seria posto no poder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com muita insinceridade”; o termo grego pode indicar fala fingida ou ocultação dos verdadeiros motivos.
    reason: lexical_alternative
  - marker: b
    text: Ou “pelo bem-estar da terra natal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέμιξεν
  choice: se juntou
  rationale: Expressa de modo natural o ato de Menelau associar-se ao grupo, preservando o sentido contextual de συνέμιξεν sem o literalismo pouco idiomático de “misturou-se”.
- source_word: παρεκάλει
  choice: continuava a instigar
  rationale: O imperfeito indica ação persistente ou repetida; “continuava a” preserva esse aspecto, e “instigar” comunica que Menelau pressionava Antíoco a agir.
- source_word: μετὰ πολλῆς εἰρωνίας
  choice: com muita dissimulação
  rationale: Neste contexto, εἰρωνία indica fingimento ou ocultação dos verdadeiros motivos, e não “ironia” no sentido moderno mais comum.
- source_word: σωτηρίᾳ
  choice: segurança
  rationale: Refere-se à preservação ou ao bem-estar político da terra natal, não à salvação em sentido especificamente teológico.
- source_word: πατρίδος
  choice: pátria
  rationale: Mantém de forma concisa e digna a ideia da terra ancestral ou do próprio país.
- source_word: ἐπὶ τῆς ἀρχῆς κατασταθήσεται
  choice: seria instalado no poder
  rationale: Comunica a expectativa de ser colocado numa posição de autoridade, sem restringir ἀρχή a um cargo específico nem ampliá-lo necessariamente para realeza.
theological_decisions:
- issue: Caracterização moral do motivo de Menelau em εἰρωνία
  choice: dissimulação
  alternative: ironia; insinceridade
  rationale: O contraste explícito entre a alegada preocupação com a pátria e a ambição pessoal de Menelau favorece o sentido de fingimento. “Dissimulação” preserva essa avaliação moral sem acrescentar uma doutrina ou motivação não expressa.
- issue: Sentido de σωτηρία aplicado à pátria
  choice: segurança
  alternative: salvação; bem-estar
  rationale: O contexto é político e nacional. “Segurança” evita sugerir indevidamente o sentido teológico que “salvação” costuma ter, embora preserve a ideia de preservação.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A construção mantém o contraste retórico do grego e explicita o aspecto contínuo do imperfeito sem tornar a frase pesada.
