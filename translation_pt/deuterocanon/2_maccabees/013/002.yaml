base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/002.yaml
  text: 'and with him Lysias[a], the guardian and overseer of affairs, each having a Greek force: eleven myriads of infantry, five thousand three hundred cavalry, twenty-two elephants[b], and three hundred scythed chariots.'
translation:
  language: pt
  text: 'e, com ele, Lísias, o guardião e encarregado dos assuntos[a]. Cada um deles dispunha de uma força militar helênica: onze miríades de soldados de infantaria[b], cinco mil e trezentos cavaleiros, vinte e dois elefantes e trezentos carros de guerra equipados com foices.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o regente e responsável pelos assuntos de governo”. Os títulos gregos de Lísias indicam uma guarda que lhe foi confiada e autoridade administrativa.
    reason: alternative_reading
  - marker: b
    text: Isto é, 110.000 soldados de infantaria. O texto mantém a expressão numérica grega, na qual uma miríade equivale a dez mil.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν αὐτῷ
  choice: com ele
  rationale: Expressa de modo direto e natural a ideia de acompanhamento.
- source_word: Λυσίαν
  choice: Lísias
  rationale: Forma tradicional e natural em português para o nome grego Λυσίας.
- source_word: τὸν ἐπίτροπον
  choice: o tutor
  rationale: ἐπίτροπος designa alguém a quem foi confiada tutela ou autoridade. “Tutor” preserva o sentido de guarda confiada sem definir de maneira excessiva sua função política.
- source_word: καὶ ἐπὶ τῶν πραγμάτων
  choice: e encarregado dos negócios
  rationale: A expressão indica responsabilidade administrativa pelos assuntos de governo; esta formulação mantém o caráter oficial e continua clara em português.
- source_word: ἕκαστον ἔχοντα δύναμιν Ἑλληνικὴν
  choice: Cada um deles dispunha de uma força militar helênica
  rationale: Mantém a referência distributiva de ἕκαστον a Antíoco e Lísias e traduz δύναμις como força militar. “Helênica” sinaliza o contexto político-militar grego sem restringir necessariamente a composição étnica das tropas.
- source_word: πεζῶν μυριάδας ἕνδεκα
  choice: onze miríades de soldados de infantaria
  rationale: Conserva a forma numérica grega, em que cada miríade corresponde a dez mil, e explicita que πεζοί são soldados de infantaria.
- source_word: ἱππέων πεντακισχιλίους τριακοσίους
  choice: cinco mil e trezentos cavaleiros
  rationale: O substantivo contável “cavaleiros” permite associar naturalmente o número aos soldados montados.
- source_word: ἐλέφαντας εἴκοσι δύο
  choice: vinte e dois elefantes
  rationale: Tradução direta, sem acrescentar “de guerra”, qualificação apenas implícita no contexto.
- source_word: ἅρματα δὲ δρεπανηφόρα τριακόσια
  choice: trezentos carros de guerra equipados com foices
  rationale: Comunica com clareza moderna que os carros portavam lâminas em forma de foice, evitando o pouco corrente “carros falcados”.
