base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/007.yaml
  text: By such a fate the lawless Menelaus happened to die[a], not even obtaining burial in the earth.
translation:
  language: pt
  text: 'Foi esse o fim que coube ao transgressor Menelau: morreu sem sequer obter sepultura na terra.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sem sequer obter a terra”; pelo contexto, o sentido é que Menelau nem mesmo recebeu sepultura.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιούτῳ μόρῳ
  choice: foi esse o fim que coube
  rationale: μόρος pode indicar destino, sorte fatal ou fim trágico. A formulação remete ao modo de morte descrito anteriormente e preserva o tom solene sem soar artificial em português.
- source_word: τὸν παράνομον
  choice: o transgressor
  rationale: παράνομος caracteriza quem viola a lei. “Transgressor” conserva a força jurídico-moral do grego e evita que “fora da lei” seja entendido apenas no sentido criminal moderno.
- source_word: συνέβη θανεῖν
  choice: morreu
  rationale: A ideia de algo que sobreveio a Menelau já está expressa por “o fim que coube”; traduzir novamente συνέβη de modo explícito produziria uma construção pesada e redundante em português.
- source_word: μηδὲ τῆς γῆς τυγχάνοντα
  choice: sem sequer obter sepultura na terra
  rationale: Literalmente, a expressão diz que ele não obteve nem sequer a terra. No contexto de sua morte, trata-se de não receber sepultamento; “sepultura” explicita a referência idiomática, enquanto “na terra” preserva a imagem grega.
- source_word: Μενέλαον
  choice: Menelau
  rationale: Forma tradicional portuguesa do nome grego Μενέλαος.
theological_decisions:
- issue: Caracterização moral de Menelau por παράνομος
  choice: o transgressor Menelau
  alternative: o perverso Menelau
  rationale: “Transgressor” mantém a referência à violação da lei presente em παράνομος, sem ampliar a expressão para uma condenação teológica mais genérica.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A estrutura foi reorganizada para soar natural, mantendo o tom sentencioso do grego e sua referência ao fim trágico anteriormente narrado.
