base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/023.yaml
  text: He attacked those around Judas[a], but was defeated. Having become desperate, he took action against Philip in Antioch, the one left in charge of affairs; he was thrown into confusion, appealed to the Jews, submitted, and swore to all the just terms. He was reconciled and offered sacrifice, honored the sanctuary and the place[b], and showed kindness.
translation:
  language: pt
  text: Atacou os homens de Judas e foi derrotado. Desesperado, tomou providências contra Filipe, em Antioquia, a quem havia deixado encarregado dos negócios;[a] ficou confuso, apelou aos judeus, submeteu-se e jurou aceitar todas as condições justas.[b] Reconciliou-se com eles, ofereceu um sacrifício, honrou o santuário e o lugar e mostrou benevolência.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A sequência grega referente à iniciativa contra Filipe em Antioquia e à confusão que se seguiu é concisa e difícil; não se pode determinar com certeza a natureza exata dessa iniciativa.
    reason: textual_variant
  - marker: b
    text: 'Ou: “tudo o que era justo”. A expressão pode referir-se, em sentido geral, ao que era justo ou, mais especificamente, às condições do acordo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέβαλεν τοῖς περὶ τὸν Ἰούδαν
  choice: Atacou os homens de Judas
  rationale: O verbo indica ataque militar, e a expressão idiomática designa o grupo ou as tropas de Judas. A formulação é natural sem identificar cada integrante.
- source_word: ἥττων ἐγένετο
  choice: foi derrotado
  rationale: A expressão comunica que ele levou a pior no confronto, isto é, sofreu derrota militar.
- source_word: μετέλαβεν ... τὸν Φίλιππον
  choice: tomou providências contra Filipe
  rationale: A sequência grega é comprimida e de interpretação incerta. Esta formulação comunica uma iniciativa relativa a Filipe e preserva a provável força adversativa sem especificar indevidamente captura, substituição ou aliança.
- source_word: ἀπονοηθεὶς
  choice: Desesperado
  rationale: O particípio descreve alguém sem saída, perplexo ou levado ao desespero após a derrota.
- source_word: τὸν ἀπολελειμμένον ἐπὶ τῶν πραγμάτων
  choice: a quem havia deixado encarregado dos negócios
  rationale: A expressão indica responsabilidade administrativa ou governamental. “Negócios” conserva a amplitude de πράγματα no contexto de Estado.
- source_word: συνεχύθη
  choice: ficou confuso
  rationale: O passivo expressa perturbação, tumulto interior ou confusão, sem exigir uma descrição psicológica mais específica.
- source_word: τοὺς Ἰουδαίους παρεκάλεσεν
  choice: apelou aos judeus
  rationale: παρακαλέω pode significar pedir, exortar ou suplicar; “apelou” se ajusta ao contexto diplomático e mantém essa amplitude.
- source_word: ὑπετάγη
  choice: submeteu-se
  rationale: Mantém de modo conciso o sentido passivo ou médio de ceder e colocar-se sob as condições de outrem.
- source_word: ἐπὶ πᾶσι τοῖς δικαίοις
  choice: aceitar todas as condições justas
  rationale: No contexto de acordo, δικαίοις provavelmente designa exigências ou condições consideradas justas. O acréscimo contextual “aceitar” torna natural em português aquilo sobre o qual ele jurou.
- source_word: συνελύθη
  choice: Reconciliou-se com eles
  rationale: No contexto, o verbo indica o encerramento da hostilidade ou a conclusão de um acordo. O pronome explicita apenas o referente já presente, os judeus.
- source_word: θυσίαν προσήγαγεν
  choice: ofereceu um sacrifício
  rationale: É a formulação cultual normal e mantém a ação concreta narrada.
- source_word: ἐτίμησεν τὸν νεὼ καὶ τὸν τόπον
  choice: honrou o santuário e o lugar
  rationale: νεώς aponta mais precisamente para o santuário, enquanto τόπος permanece “lugar”; a tradução não funde os dois termos nem acrescenta “santo”, ausente nesta frase.
- source_word: ἐφιλανθρώπησεν
  choice: mostrou benevolência
  rationale: O verbo descreve conduta humana, bondosa ou favorável. A formulação conserva essa ideia sem inventar um objeto específico.
theological_decisions:
- issue: Terminologia cultual para νεώς e θυσίαν προσήγαγεν
  choice: “santuário” e “ofereceu um sacrifício”
  alternative: “templo” e “apresentou uma oferta”
  rationale: As escolhas preservam o cenário cultual histórico de Jerusalém e distinguem o santuário sem introduzir linguagem doutrinária posterior.
- issue: Sequência difícil μετέλαβεν ... τὸν Φίλιππον ... συνεχύθη
  choice: 'Formulação cautelosa: “tomou providências contra Filipe ...; ficou confuso”'
  alternative: Interpretar especificamente como captura de Filipe, substituição de Filipe, recurso a Filipe ou simples recebimento de notícias sobre ele
  rationale: A sintaxe é concisa e difícil. A tradução conserva o movimento narrativo e a provável relação adversativa sem resolver uma incerteza real do texto grego.
- issue: Sentido de ἐπὶ πᾶσι τοῖς δικαίοις
  choice: “todas as condições justas”
  alternative: “tudo o que era justo”
  rationale: O contexto favorece termos de um acordo, mas a nota registra a possibilidade de uma referência mais geral ao que era justo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A narrativa usa construções diretas, evita arcaísmos e conserva as incertezas relevantes do grego por meio de formulação cautelosa e notas.
