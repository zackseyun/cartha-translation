base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/004.yaml
  text: But the King of kings stirred up Antiochus’s anger against the wretch, and when Lysias pointed him out as being responsible for the evils and for everything, he ordered them to put him to death, taking him to Beroea, as is the custom in that place.
translation:
  language: pt
  text: Mas o Rei dos reis despertou a ira de Antíoco contra aquele miserável[a]. E, depois que Lísias indicou que ele era responsável pelos males e por tudo o mais[b], Antíoco ordenou que o levassem a Bereia[c] e o matassem ali, conforme o costume daquele lugar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “contra aquele malfeitor” ou “contra aquele canalha”. O termo grego expressa forte condenação moral.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega é condensada e pode ser traduzida mais literalmente como “responsável pelos males e por tudo”.
    reason: textual_ambiguity
  - marker: c
    text: Bereia é apresentada aqui como o lugar ao qual ele foi levado para ser morto segundo o costume local.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ δὲ βασιλεὺς τῶν βασιλέων
  choice: Mas o Rei dos reis
  rationale: Mantém a expressão titular e o contraste narrativo introduzido por δέ. A inicial maiúscula sinaliza que, no contexto, o título se refere reverentemente a Deus.
- source_word: ἐξήγειρεν τὸν θυμὸν τοῦ Ἀντιόχου
  choice: despertou a ira de Antíoco
  rationale: Preserva a força causativa de ἐξήγειρεν e traduz θυμός por uma palavra atual, mas suficientemente forte.
- source_word: ἐπὶ τὸν ἀλιτήριον
  choice: contra aquele miserável
  rationale: ἀλιτήριος é um termo forte de reprovação moral. “Miserável” conserva o tom condenatório sem especificar juridicamente “criminoso”.
- source_word: Λυσίου ὑποδείξαντος
  choice: depois que Lísias indicou
  rationale: Expressa de modo natural a circunstância do genitivo absoluto e o ato de identificar a responsabilidade do homem.
- source_word: τοῦτον αἴτιον τῶν κακῶν εἶναι καὶ πάντων
  choice: que ele era responsável pelos males e por tudo o mais
  rationale: Traduz αἴτιος como responsabilidade causal e mantém a amplitude da formulação comprimida καὶ πάντων sem restringi-la a males específicos.
- source_word: προσέταξεν ... προσαπολέσαι
  choice: ordenou ... que ... o matassem
  rationale: Comunica claramente uma ordem de execução; o composto προσαπολέσαι tem aqui sentido de dar cabo do condenado.
- source_word: ἀγαγόντας εἰς Βέροιαν
  choice: que o levassem a Bereia
  rationale: O particípio indica a ação acompanhante pela qual a ordem seria cumprida.
- source_word: ὡς ἔθος ἐστὶν ἐν τῷ τόπῳ
  choice: conforme o costume daquele lugar
  rationale: Mantém a referência ao procedimento local em português natural.
theological_decisions:
- issue: Referência de “Rei dos reis”
  choice: Título divino referente a Deus
  alternative: Título régio meramente hiperbólico
  rationale: No contexto narrativo, o título apresenta Deus como soberano que dirige os acontecimentos envolvendo reis humanos. A tradução preserva esse peso sem acrescentar uma explicação doutrinária ao versículo.
- issue: Agência divina e ira de Antíoco
  choice: “despertou a ira de Antíoco”
  alternative: “permitiu que Antíoco se irasse”
  rationale: O verbo grego atribui ação causativa ao Rei dos reis; substituí-la por mera permissão suavizaria uma tensão teológica genuína do texto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluente e legibilidade brasileira. A repetição explícita de “Antíoco” evita ambiguidade no sujeito da ordem. A divisão em duas frases reduz o peso do período grego sem alterar sua sequência lógica.
