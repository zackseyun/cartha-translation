  text: And he received Maccabaeus favorably[a], and left Hegemonides as commander from Ptolemais as far as the Gerrenians,
translation:
  language: pt
  text: E acolheu Macabeu favoravelmente e deixou Hegemônides como comandante de Ptolemaida até os Genneros[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz uma forma que pode ser transliterada como «os Genneros». A identificação desse povo ou lugar é textual e geograficamente incerta; por isso, a tradução conserva a forma grega sem propor uma localização mais específica.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: acolheu ... favoravelmente
  rationale: A forma média sugere recepção favorável, e não mera aceitação; a expressão explicita essa nuance sem ampliar indevidamente o sentido.
- source_word: κατέλειπεν
  choice: deixou
  rationale: Preserva o sentido básico de deixar alguém numa posição; o complemento «como comandante» comunica a função exercida sem transformar o verbo em «nomeou».
- source_word: στρατηγόν
  choice: comandante
  rationale: Expressa com clareza a autoridade militar sem impor uma patente moderna mais específica do que o grego.
- source_word: ἀπὸ Πτολεμαΐδος ἕως τῶν Γεννήρων
  choice: desde Ptolemaida até os Genneros
  rationale: A construção indica extensão territorial. Como a identificação de Γεννήρων é incerta, conserva-se uma forma transliterada, evitando uma localização ou etnia excessivamente específica.
- source_word: Ἡγεμονίδην
  choice: Hegemônides
  rationale: Transliteração portuguesa natural do nome próprio grego, com acento para orientar a pronúncia.
- source_word: Μακκαβαῖον
  choice: Macabeu
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para a designação pessoal grega.
