  text: And when day was already beginning to appear[a], this had happened because the Lord’s protection had quickly come to his aid.
translation:
  language: pt
  text: Quando o dia já começava a clarear, isso havia acontecido, pois a proteção do Senhor tinha vindo prontamente em seu auxílio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme se entenda o raro substantivo grego ἐπαρήγορασις: “por causa do auxílio oportuno da proteção do Senhor em favor dele”. O termo pode enfatizar auxílio pronto, socorro ou alívio.'
    reason: Alternativa lexical; preserva a incerteza quanto à nuance de ἐπαρήγορασις e à relação precisa entre o auxílio e a proteção do Senhor.
lexical_decisions:
- source_word: ὑποφαινούσης ... τῆς ἡμέρας
  choice: quando o dia já começava a clarear
  rationale: O genitivo absoluto descreve o primeiro surgimento da luz do dia. A formulação conserva o aspecto inicial da ação e soa natural em português.
- source_word: τοῦτο ἐγέγονει
  choice: isso já havia acontecido
  rationale: A forma verbal apresenta o fato como já consumado em relação ao amanhecer; o mais-que-perfeito composto, reforçado por “já”, expressa claramente essa anterioridade.
- source_word: διὰ
  choice: porque
  rationale: Com o acusativo, a preposição tem valor causal neste contexto. “Porque” comunica essa relação de modo direto e natural.
- source_word: ἐπαρήγορασιν
  choice: viera prontamente em auxílio
  rationale: O substantivo raro parece indicar auxílio, alívio ou socorro oportuno, não apenas encorajamento verbal. A expressão preserva tanto a ideia de ajuda quanto a possível nuance de prontidão.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome no dativo identifica o beneficiário da intervenção; “lhe” preserva essa relação sem explicitar além do texto o referente masculino.
- source_word: τοῦ κυρίου
  choice: do Senhor
  rationale: “Senhor” é a tradução tradicional e contextualmente apropriada de κύριος quando designa Deus.
- source_word: σκέπην
  choice: proteção
  rationale: Embora possa significar cobertura ou abrigo, no contexto de livramento militar o termo denota proteção, sem exigir uma imagem física específica.
theological_decisions:
- issue: Tradução de κύριος em uma narrativa grega deuterocanônica
  choice: Senhor
  alternative: Soberano
  rationale: No contexto, κύριος se refere a Deus como fonte do livramento. “Senhor” mantém a reverência e a continuidade com o uso corrente na tradução da Septuaginta.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. “Começava a clarear” reproduz naturalmente o início do amanhecer; “viera prontamente em auxílio” mantém o tom narrativo e a rara expressão grega sem recorrer a vocabulário arcaico como “socorro” em construção excessivamente formal.
