base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/013.yaml
  text: But he himself[a], after meeting with the elders, decided, before the king’s army could invade Judea and gain control of the city, to go out and decide the matter with the help of God.
translation:
  language: pt
  text: 'Ele, porém, depois de se reunir em particular com os anciãos, decidiu que, antes que o exército do rei invadisse a Judeia e tomasse o controle da cidade, eles deveriam sair e resolver a questão[a] com a ajuda de Deus.


    [a] Ou “decidir a situação” ou “julgar o que fazer”. A expressão grega é ampla e pode se referir à resolução da crise que enfrentavam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “decidir a situação” ou “julgar o que fazer”. A expressão grega é ampla e pode se referir à resolução da crise que enfrentavam.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθʼ ἑαυτὸν ... σὺν τοῖς πρεσβυτέροις γενόμενος
  choice: depois de se reunir em particular com os anciãos
  rationale: A expressão καθʼ ἑαυτόν indica uma reunião reservada, não uma ação solitária, pois o texto acrescenta explicitamente que ele estava com os anciãos.
- source_word: ἐβουλεύσατο
  choice: decidiu
  rationale: O verbo descreve uma deliberação que resulta numa resolução; “decidiu” é natural e conciso, enquanto a consulta já está expressa na oração anterior.
- source_word: πρὶν εἰσβαλεῖν τὸ στράτευμα τοῦ βασιλέως ἐπὶ τὴν Ἰουδαίαν
  choice: antes que o exército do rei invadisse a Judeia
  rationale: Em contexto militar, εἰσβάλλω denota uma entrada hostil; “invadisse” comunica claramente essa força.
- source_word: γενέσθαι τῆς πόλεως ἐγκρατεῖς
  choice: tomasse o controle da cidade
  rationale: ἐγκρατεῖς expressa domínio ou posse efetiva; a formulação é corrente e evita o arcaísmo de “se tornasse senhor da cidade”.
- source_word: ἐξελόντας
  choice: eles deveriam sair
  rationale: A forma transmitida no trecho fornecido corresponde, no contexto e na tradição de tradução indicada, à ação coletiva de sair; o plural é preservado sem definir além do texto todos os integrantes do grupo.
- source_word: κρῖναι τὰ πράγματα
  choice: resolver a questão
  rationale: A expressão é ampla e descreve levar a crise a uma decisão ou desfecho. A nota registra alternativas para não ocultar sua amplitude semântica.
- source_word: τῇ τοῦ θεοῦ βοηθείᾳ
  choice: com a ajuda de Deus
  rationale: O dativo expressa meio ou auxílio; esta é a equivalência mais natural e mantém explícita a dependência da ajuda divina.
theological_decisions:
- issue: Sujeito implícito da ação plural ligada a ἐξελόντας κρῖναι
  choice: Judas e seus associados, expressos por “eles”
  alternative: Judas sozinho sairia e resolveria a questão
  rationale: O particípio acusativo plural aponta para uma ação coletiva relacionada ao grupo que deliberava. A tradução conserva o plural sem especificar se ele abrange somente os anciãos ou também outros companheiros.
- issue: Amplitude de κρῖναι τὰ πράγματα
  choice: resolver a questão, com alternativas em nota
  alternative: julgar a situação ou decidir o que fazer
  rationale: O grego pode envolver julgamento, decisão ou resolução prática da crise. A tradução principal é idiomática, e a nota preserva a tensão lexical.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Judeia”, “anciãos” e “exército do rei” mantêm o registro histórico-bíblico sem arcaísmo excessivo. O pronome plural “eles” conserva a ação coletiva sugerida pela construção grega.
