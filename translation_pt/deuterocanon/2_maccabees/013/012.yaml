base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/012.yaml
  text: And when all had done the same together and had implored the merciful Lord with weeping and fasting and prostration for three days without ceasing[a], Judas encouraged them and ordered them to assemble.
translation:
  language: pt
  text: Depois que todos fizeram juntos o mesmo e imploraram ao Senhor misericordioso, com choro, jejuns e prostração, durante três dias sem cessar, Judas os encorajou e ordenou que se apresentassem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ordenou que se reunissem” ou “ordenou que viessem”. O verbo grego pode indicar chegar, comparecer ou estar presente; no contexto militar, também pode implicar que estivessem prontos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντων ... τὸ αὐτὸ ποιησάντων ὁμοῦ
  choice: Depois que todos fizeram juntos o mesmo
  rationale: O genitivo absoluto apresenta a circunstância anterior à ação de Judas; a formulação conserva tanto a ação comum quanto a força coletiva de πάντων e ὁμοῦ.
- source_word: καταξιωσάντων τὸν ἐλεήμονα κύριον
  choice: imploraram ao Senhor misericordioso
  rationale: Embora καταξιόω possa significar considerar digno, neste contexto de oração acompanhada de choro, jejuns e prostração indica uma súplica insistente.
- source_word: τὸν ἐλεήμονα κύριον
  choice: o Senhor misericordioso
  rationale: ἐλεήμων expressa misericórdia ou compaixão, e κύριος recebe a tradução reverente e habitual 'Senhor'.
- source_word: μετὰ κλαυθμοῦ καὶ νηστειῶν καὶ προπτώσεως
  choice: com choro, jejuns e prostração
  rationale: A preposição apresenta os atos que acompanhavam a súplica. 'Jejuns' conserva o plural grego, e 'prostração' expressa o ato corporal de se lançar por terra em oração.
- source_word: ἐπὶ ἡμέρας τρεῖς ἀδιαλείπτως
  choice: durante três dias sem cessar
  rationale: A construção indica duração, e ἀδιαλείπτως ressalta a persistência contínua.
- source_word: παρακαλέσας αὐτοὺς
  choice: Judas os encorajou
  rationale: παρακαλέω pode significar encorajar, exortar ou instar; após a súplica coletiva e antes da ação militar, 'encorajou' preserva a combinação de ânimo e exortação.
- source_word: ἐκέλευσεν παραγίνεσθαι
  choice: ordenou que se apresentassem
  rationale: παραγίνομαι pode denotar chegar, comparecer ou estar presente. 'Apresentar-se' preserva a ideia de comparecimento sob ordem sem acrescentar explicitamente a noção interpretativa de prontidão militar.
theological_decisions:
- issue: Tradução de κύριον
  choice: Senhor
  alternative: Soberano
  rationale: '''Senhor'' é a forma reverente natural neste contexto de oração dirigida a Deus e não acrescenta uma afirmação doutrinária além do texto.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha o encadeamento grego sem sacrificar a naturalidade. O plural 'jejuns' foi mantido para refletir νηστειῶν, e a ambiguidade de παραγίνεσθαι foi preservada no texto e explicitada em nota.
