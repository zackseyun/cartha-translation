base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/009.yaml
  text: But the king[a], weighed down in spirit, advanced, intending to inflict on the Jews the worst things that had happened under his father.
translation:
  language: pt
  text: Mas o rei, com a mente sobrecarregada, avançava, pretendendo[a] fazer recair sobre os judeus os piores males que haviam ocorrido no tempo de seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “esperando fazer recair”. O particípio grego pode indicar expectativa ou intenção.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φρονήμασιν
  choice: espírito
  rationale: O dativo plural indica a esfera interior em que o rei estava sobrecarregado. “Espírito” comunica de modo natural sua disposição e seus pensamentos, sem reduzir a expressão a uma emoção específica.
- source_word: βεβαρημένος
  choice: sobrecarregado
  rationale: O particípio perfeito descreve um estado persistente e conserva a imagem de um peso interior.
- source_word: ἦρχετο
  choice: avançava
  rationale: No contexto de uma campanha militar, o imperfeito indica movimento em curso. “Avançava” é mais preciso do que o genérico “vinha” e evita a possível leitura de “começava”.
- source_word: τὰ χείριστα
  choice: os piores males
  rationale: O superlativo neutro plural é substantivado. “Males” torna explícita a natureza adversa dos acontecimentos sem especificar quais atos estavam em vista.
- source_word: τῶν ἐπὶ τοῦ πατρὸς αὐτοῦ γεγονότων
  choice: entre os que haviam ocorrido no tempo de seu pai
  rationale: A construção indica acontecimentos do período ou regime do pai. “No tempo de seu pai” preserva a referência temporal sem afirmar mais explicitamente do que o grego que se tratava de todo o reinado.
- source_word: ἐνδεξόμενος
  choice: pretendendo fazer recair
  rationale: No contexto hostil e com o dativo τοῖς Ἰουδαίοις, o particípio expressa o propósito de trazer esses males sobre os judeus. A nota preserva a possível nuance de expectativa.
theological_decisions:
- issue: Nuance modal de ἐνδεξόμενος
  choice: pretendendo fazer recair
  alternative: esperando fazer recair
  rationale: O contexto favorece intenção deliberada, mas o particípio admite uma nuance de expectativa; a ambiguidade é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão ampla no espaço lusófono. A formulação mantém o movimento militar, a metáfora do peso interior e a ambiguidade modal do particípio grego.
