  - severity: low
    issue: «cujo fogo e cujas cinzas eram santos»
    rationale: Embora compreensível, «santos» aplicado conjuntamente a fogo e cinzas é menos idiomático em português. «Sagrados» mantém o valor cultual pretendido e melhora a fluência.
