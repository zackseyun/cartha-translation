base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/008.yaml
  text: Very justly[a]; for because he had committed many sins against the altar, whose fire and ashes were holy[b], he met his death in ashes.
translation:
  language: pt
  text: Muito justamente, pois, visto que ele havia cometido muitos pecados contra o altar, cujo fogo e cujas cinzas eram sagrados, nas cinzas encontrou a morte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “nas cinzas recebeu a morte”. A expressão provavelmente evoca seus pecados contra o altar e suas cinzas sagradas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάνυ δικαίως
  choice: muito justo
  rationale: A expressão intensifica o caráter merecido e justo do destino. A formulação liga-se naturalmente ao contexto narrativo em português.
- source_word: συνετέλεσεν πολλὰ ... ἁμαρτήματα
  choice: havia cometido muitos pecados
  rationale: No contexto, o verbo com ἁμαρτήματα designa a prática de atos pecaminosos; esta é a equivalência portuguesa mais natural e preserva a força moral e religiosa.
- source_word: περὶ τὸν βωμόν
  choice: contra o altar
  rationale: Em contexto de sacrilégio, περί indica pecados relacionados ao altar e dirigidos contra sua santidade, não mera localização ao redor dele.
- source_word: ἁγνὸν
  choice: santos
  rationale: Embora também possa significar 'puros', no contexto cultual o termo comunica a condição sagrada e consagrada do fogo e das cinzas.
- source_word: ἐν σποδῷ
  choice: nas cinzas
  rationale: Preserva a imagem concisa e a correspondência irônica entre os pecados ligados às cinzas do altar e a morte nas cinzas.
- source_word: τὸν θάνατον ἐκομίσατο
  choice: encontrou a morte
  rationale: Equivalente idiomático que expressa o resultado de receber ou obter para si a morte, sem tornar a frase artificial.
theological_decisions:
- issue: Descrição cultual do fogo e das cinzas do altar
  choice: cujo fogo e cujas cinzas eram santos
  alternative: cujo fogo era puro e cujas cinzas eram santas
  rationale: O grego apresenta um único adjetivo predicativo com os substantivos coordenados. Aplicar 'santos' a ambos comunica a consagração cultual, embora 'puros' permaneça lexicalmente possível.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe de ampla compreensão e boa legibilidade brasileira. A repetição de “cinzas” foi mantida para preservar a correspondência intencional do grego.
