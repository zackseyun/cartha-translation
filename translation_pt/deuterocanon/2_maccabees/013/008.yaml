revisions:
- from: E isso foi muito justo[a], pois, visto que ele havia cometido muitos pecados contra o altar, cujo fogo e cujas cinzas eram santos, foi nas cinzas que encontrou a morte.[b]
  to: Muito justamente, pois, visto que ele havia cometido muitos pecados contra o altar, cujo fogo e cujas cinzas eram sagrados, nas cinzas encontrou a morte.[a]
  rationale: A revisão restitui à abertura a função adverbial enfática do grego, evita o demonstrativo não expresso e substitui uma combinação menos natural por «fogo e cinzas eram sagrados», que conserva o caráter consagrado de ἁγνόν no contexto do altar. A posição inicial de «nas cinzas» preserva a ênfase e a correspondência intencional com as cinzas do altar.
