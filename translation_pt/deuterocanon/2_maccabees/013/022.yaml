  text: The king negotiated further with those in Bethsura[a], gave and received pledges of good faith, and went away[b],
translation:
  language: pt
  text: O rei voltou a negociar com os que estavam em Betsura[a], deu e recebeu garantias de boa-fé[b] e foi embora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Betsura também pode ser traduzida como “Bete-Zur”, refletindo o nome hebraico por trás da forma grega.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “deu e recebeu a mão direita”, gesto usado para firmar um compromisso ou confirmar um acordo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδευτερολόγησεν
  choice: voltou a negociar
  rationale: O verbo indica literalmente falar ou tratar uma segunda vez; no contexto político-militar, seguido pela troca da mão direita como garantia, refere-se naturalmente à retomada das negociações.
- source_word: τοῖς ἐν Βαθσούροις
  choice: com os que estavam em Betsura
  rationale: A expressão designa as pessoas presentes na cidade, sem especificar além do grego que fossem homens ou defensores.
- source_word: Βαθσούροις
  choice: Betsura
  rationale: Forma portuguesa clara baseada no nome grego do lugar; a forma hebraizante alternativa, Bete-Zur, é registrada em nota.
- source_word: δεξιὰν ἔδωκεν, ἔλαβεν
  choice: deu e recebeu garantias de acordo
  rationale: A formulação grega, literalmente dar e receber a mão direita, é um gesto idiomático de compromisso ou ratificação. A tradução comunica sua força diplomática sem impor detalhes não expressos.
- source_word: ἀπῇει
  choice: foi embora
  rationale: Equivalente narrativo direto e corrente para o ato de partir.
