translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa simples. “Voltou a negociar” preserva a ideia de uma segunda tratativa; “garantias de acordo” torna explícito apenas o sentido idiomático do gesto, explicado literalmente em nota.
