base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/014.yaml
  text: And after entrusting the outcome to the Lord of the world[a], and urging those with him to fight bravely to the death for the laws, the temple, the city, the homeland, and the commonwealth[b], he encamped near Modein.
translation:
  language: pt
  text: Depois de confiar a decisão ao Senhor do mundo[a] e de exortar os que estavam com ele a lutar corajosamente até a morte pelas leis, pelo templo, pela cidade, pela pátria e pela ordem política[b], dispôs seu exército nas proximidades de Modeim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Senhor do universo”. A palavra grega κόσμος pode designar o mundo ou o universo ordenado.
    reason: lexical_alternative
  - marker: b
    text: A expressão “ordem política” traduz πολιτεία, termo que também pode significar “constituição”, “comunidade política” ou “modo de vida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς δὲ τὴν ἐπιτροπὴν
  choice: Depois de confiar a causa
  rationale: A construção idiomática com δίδωμι e ἐπιτροπή indica entregar algo aos cuidados ou à decisão de outro. “Confiar a causa” é natural em português e evita tanto o sentido administrativo de “supervisão” quanto a explicitação excessiva de “resultado”.
- source_word: τῷ κυρίῳ τοῦ κόσμου
  choice: ao Senhor do mundo
  rationale: “Senhor” preserva o peso bíblico de κύριος; “mundo” traduz diretamente κόσμος, cuja possível extensão a “universo” é registrada em nota.
- source_word: παρακαλέσας
  choice: exortou
  rationale: No contexto de um apelo militar, παρακαλέω expressa incentivo veemente; “exortou” mantém a força sem especificar além do texto.
- source_word: τοὺς σὺν αὐτῷ
  choice: os que estavam com ele
  rationale: Tradução direta que não restringe o referente a uma categoria mais específica do que o grego.
- source_word: γενναίως ἀγωνίσασθαι μέχρι θανάτου
  choice: a lutar corajosamente até a morte
  rationale: O contexto é militar, justificando “lutar”; “até a morte” conserva a formulação grega e sua tensão entre perseverança e disposição de morrer.
- source_word: περὶ νόμων, ἱεροῦ, πόλεως, πατρίδος, πολιτείας
  choice: pelas leis, pelo templo, pela cidade, pela pátria e pela ordem política
  rationale: περί indica aquilo em defesa do qual lutariam. Mantêm-se o plural “leis” e a sequência retórica. “Ordem política” preserva a dimensão cívico-institucional de πολιτεία sem impor o sentido moderno mais estreito de “Estado” ou “constituição”.
- source_word: περὶ δὲ Μωδεεὶμ
  choice: nas proximidades de Modeim
  rationale: περί com topônimo indica a região ao redor ou a vizinhança do lugar, sem afirmar localização exata.
- source_word: ἐποιήσατο τὴν στρατιάν
  choice: dispôs seu exército
  rationale: A expressão militar indica organizar ou posicionar as tropas. “Dispôs seu exército” é conciso e não introduz a ideia de acampamento, ausente do léxico explícito.
theological_decisions:
- issue: Sentido da entrega a Deus em τὴν ἐπιτροπήν
  choice: confiar a causa ao Senhor
  alternative: confiar o resultado ao Senhor
  rationale: “A causa” preserva a indeterminação do objeto entregue aos cuidados de Deus; “resultado” explicitaria que se trata apenas do desfecho, enquanto “supervisão” soaria administrativa em português.
- issue: Tradução de κύριος no título divino
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” conserva o uso bíblico tradicional e expressa a soberania divina sem substituir o título do texto.
- issue: Amplitude de πολιτεία
  choice: ordem política
  alternative: constituição; comunidade política; modo de vida
  rationale: O termo pode abranger constituição, organização cívica, cidadania ou modo de vida. “Ordem política” retém a dimensão pública e coletiva, e a nota preserva as alternativas legítimas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A longa enumeração do grego foi preservada, bem como a sequência participial, convertida em períodos verbais naturais. “Modeim” segue uma transliteração portuguesa legível do topônimo.
