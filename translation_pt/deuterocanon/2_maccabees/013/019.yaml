  yaml_path: translation/deuterocanon/2_maccabees/013/019.yaml
  text: And at Bethsura he attacked a small garrison of the Jews[a], but was turned back, was repulsed[c][b], and was weakened.
translation:
  language: pt
  text: Em Betsura[a], ele avançou contra uma pequena fortaleza dos judeus[b], mas foi rechaçado, encontrou resistência e ficou enfraquecido.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Bete-Zur”. O grego apresenta o nome do lugar na forma Βαθσούρα/Βαθσούροις.
    reason: lexical_alternative
  - marker: b
    text: “Fortaleza” também pode ser entendida como “posto fortificado” ou, por extensão, “guarnição”; o grego φρούριον pode destacar o lugar defendido ou a força militar nele instalada.
    reason: lexical_alternative
  - marker: c
    text: 'A sequência de verbos é breve e cumulativa: ele avançou contra o lugar, foi rechaçado, deparou com resistência e perdeu força.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βαθσούροις
  choice: Betsura
  rationale: Translitera de modo claro e natural em português a forma grega do topônimo, sem substituir silenciosamente essa forma pela semítica.
- source_word: φρούριον ὀλίγον
  choice: uma pequena fortaleza
  rationale: φρούριον designa primariamente um lugar fortificado, e ὀλίγον qualifica seu tamanho ou sua força limitada. A expressão mantém a referência ao posto defensivo sem convertê-lo necessariamente nas tropas da guarnição.
- source_word: τῶν Ἰουδαίων
  choice: dos judeus
  rationale: O genitivo identifica a fortaleza como pertencente aos judeus ou mantida por eles; a formulação concisa preserva essa amplitude.
- source_word: προσῆγεν
  choice: avançou contra
  rationale: No contexto militar, o verbo descreve a aproximação ou avanço ofensivo contra o alvo. A escolha conserva esse movimento, em vez de reduzi-lo genericamente a 'atacou'.
- source_word: ἐτροποῦτο
  choice: foi rechaçado
  rationale: A forma indica uma reversão militar sob pressão. 'Foi rechaçado' comunica o revés sem necessariamente sugerir uma derrota total.
- source_word: προσενέκρουσεν
  choice: encontrou resistência
  rationale: O verbo exprime bater ou chocar-se contra um obstáculo. Nesta sequência militar, a expressão apresenta com naturalidade a resistência que deteve o avanço, preservando a voz ativa da forma grega.
- source_word: ἡλαττονοῦτο
  choice: ficou enfraquecido
  rationale: O verbo denota tornar-se menor, inferior ou reduzido. No contexto, refere-se naturalmente à perda de força militar.
