base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/006.yaml
  text: Here everyone pushes on to destruction the man guilty of temple robbery[a], or one who has committed some outstanding excess of other evils.
translation:
  language: pt
  text: Ali, todos empurram para a destruição quem é culpado de saquear um templo[a] ou mesmo quem tenha cometido algum mal especialmente grave entre outros males.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cometer sacrilégio”. O termo grego se refere especificamente a violar ou roubar um templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνταῦθα
  choice: Ali
  rationale: Retoma naturalmente, em português, o lugar descrito no contexto imediato, preservando o valor locativo do advérbio.
- source_word: ἱεροσυλίας ἔνοχον
  choice: quem é culpado de saquear um templo
  rationale: 'Expressa com clareza tanto o sentido judicial de ἔνοχος quanto o núcleo concreto de ἱεροσυλία: roubar ou violar os bens de um templo.'
- source_word: ἢ καί τινων ἄλλων κακῶν
  choice: ou ... em alguns outros males
  rationale: Mantém a alternativa e a referência ampla a outros atos malignos, sem restringir κακά apenas a crimes juridicamente definidos.
- source_word: ὑπεροχὴν πεποιημένον
  choice: quem tenha chegado ao extremo
  rationale: Formulação portuguesa natural que conserva a ideia distinta de excesso ou grau excepcional de maldade, sem o pouco idiomático 'ter cometido uma preeminência'.
- source_word: ἅπαντες
  choice: todos
  rationale: Reproduz diretamente o caráter abrangente da participação coletiva.
- source_word: προωθοῦσιν εἰς ὄλεθρον
  choice: empurram para a destruição
  rationale: Preserva a imagem física do verbo, inclusive seu movimento para a frente, e o resultado severo indicado por ὄλεθρος.
theological_decisions:
- issue: Sentido de ἱεροσυλία
  choice: saquear um templo
  alternative: cometer sacrilégio
  rationale: A opção escolhida mantém o sentido concreto de roubo ou violação de templo. 'Sacrilégio' é possível, mas pode abranger uma gama mais ampla de profanações religiosas do que o termo grego sugere diretamente.
translation_notes:
  register: Português atual, claro e digno, com sintaxe acessível. “Ali” liga o versículo ao local mencionado no contexto; “chegado ao extremo” evita uma construção artificial e conserva a noção de excesso excepcional.
