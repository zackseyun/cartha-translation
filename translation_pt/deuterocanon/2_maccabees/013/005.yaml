base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/005.yaml
  text: In that place there was a tower fifty cubits high[a], full of ashes, and it had all around it a circular contrivance sloping steeply down into the ashes.
translation:
  language: pt
  text: Nesse lugar havia uma torre de cinquenta côvados de altura, cheia de cinzas. Ela tinha ao seu redor um dispositivo circular[a] que, por todos os lados, descia abruptamente para dentro das cinzas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um aparelho redondo” ou “um mecanismo circular”. O termo grego para o aparato é inespecífico, e o adjetivo pode destacar sua forma arredondada mais do que um eventual movimento giratório.
    reason: lexical_alternative
lexical_decisions:
- source_word: πύργος
  choice: torre
  rationale: É o equivalente comum e natural para uma construção alta desse tipo.
- source_word: πεντήκοντα πήχεων
  choice: de cinquenta côvados de altura
  rationale: πήχυς designa o côvado, antiga unidade de comprimento; “de altura” explicita de modo idiomático a dimensão indicada no contexto da torre.
- source_word: πλήρης σποδοῦ
  choice: cheia de cinzas
  rationale: Reproduz diretamente a construção com πλήρης e o sentido de σποδός, usando em português uma forma natural para uma massa de cinza.
- source_word: ὄργανον
  choice: dispositivo
  rationale: O termo grego é amplo e pode designar instrumento, aparelho ou mecanismo; “dispositivo” preserva essa falta de especificidade.
- source_word: περιφερές
  choice: circular
  rationale: O adjetivo descreve mais naturalmente a forma arredondada do dispositivo, sem pressupor que ele girasse.
- source_word: πάντοθεν
  choice: por todos os lados
  rationale: Expressa a abrangência espacial do advérbio, indicando que a inclinação cercava toda a estrutura.
- source_word: ἀπόκρημνον
  choice: íngreme
  rationale: Comunica a descida acentuada ou precipitada indicada pelo adjetivo, sem impor detalhes estruturais ausentes do grego.
- source_word: εἰς τὴν σποδόν
  choice: que descia até as cinzas
  rationale: Torna clara, em português corrente, a orientação descendente do dispositivo em direção às cinzas; “até” evita afirmar além do texto como se dava a entrada nelas.
