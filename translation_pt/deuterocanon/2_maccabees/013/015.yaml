base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/015.yaml
  text: And after giving those around him the battle cry[a], “God’s Victory,” he attacked the royal court by night with the finest armed young men, struck down about two thousand men in the camp[b], and cut down the leading elephant together with its rider.
translation:
  language: pt
  text: 'Depois de dar aos que estavam com ele a palavra de ordem[a]: “Vitória de Deus”, atacou de noite o recinto real com os melhores jovens, bem armados. No acampamento, matou cerca de dois mil homens e abateu o elefante principal junto com o homem que estava na torre sobre ele[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “senha”, “sinal” ou “grito de guerra”. O termo grego designa uma palavra ou sinal militar de reconhecimento ou comando.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com aquele que estava na estrutura semelhante a uma casa”, isto é, na torre ou plataforma montada sobre o elefante.
    reason: cultural_note
lexical_decisions:
- source_word: σύνθημα
  choice: palavra de ordem
  rationale: O termo designa uma senha, sinal ou palavra de reconhecimento em contexto militar. “Palavra de ordem” preserva essa amplitude melhor que “grito de guerra”, sem impedir que a expressão tenha sido proclamada em voz alta.
- source_word: Θεοῦ Νίκην
  choice: Vitória de Deus
  rationale: Mantém a forma nominal e a relação genitiva do grego, funcionando naturalmente como conteúdo conciso da palavra de ordem.
- source_word: νεανίσκων ἀρίστων κεκοσμημένων
  choice: os melhores jovens, bem armados
  rationale: Em contexto militar, κεκοσμημένων indica que estavam equipados ou preparados; “bem armados” comunica isso de modo claro, enquanto ἀρίστων é preservado por “melhores”.
- source_word: τὴν βασιλικὴν αὐλήν
  choice: o recinto real
  rationale: αὐλή pode indicar pátio ou área cercada; no cenário militar, “recinto real” evita que “corte real” seja entendido primariamente como o séquito ou a instituição monárquica.
- source_word: ἀνεῖλεν εἰς ἄνδρας δυσχιλίους
  choice: matou cerca de dois mil homens
  rationale: ἀναιρέω aqui significa matar, e εἰς com o numeral exprime uma contagem aproximada.
- source_word: τὸν πρωτεύοντα τῶν ἐλεφάντων
  choice: o elefante principal
  rationale: A expressão aponta para o animal de posição ou importância preeminente; “principal” preserva essa nuance sem fixar necessariamente sua posição física à frente.
- source_word: σὺν τῷ κατʼ οἰκίαν ὄντι
  choice: junto com o homem que estava em sua torre
  rationale: A construção é literalmente alusiva ao ocupante da estrutura semelhante a uma pequena casa montada sobre o elefante. A tradução conserva a imagem cultural sem reduzir o ocupante especificamente a “cavaleiro”.
