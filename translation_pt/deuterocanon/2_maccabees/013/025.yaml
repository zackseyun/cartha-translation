base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/025.yaml
  text: He came to Ptolemais[a]. The people of Ptolemais were displeased about the terms, for they were exceedingly fearful[b], and they wanted to set aside the arrangements.
translation:
  language: pt
  text: Ele chegou a Ptolemaida. Os habitantes de Ptolemaida estavam descontentes com as condições, pois estavam extremamente amedrontados; queriam rejeitar as estipulações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O substantivo grego é incomum e provavelmente se refere às disposições específicas do acordo; também pode ser traduzido como “determinações”. O texto-fonte deste versículo apresenta uma divergência assinalada na validação; a tradução segue o texto grego preservado, embora alguns pormenores lexicais sejam menos seguros que o habitual.
    reason: lexical_alternative; textual_variant
lexical_decisions:
- source_word: ἐδυσφόρουν
  choice: estavam descontentes
  rationale: O verbo indica que receberam ou encararam mal a situação, ficando contrariados ou incomodados; “estavam descontentes” é natural no contexto político sem intensificar a emoção indevidamente.
- source_word: συνθηκῶν
  choice: condições
  rationale: No contexto, o plural se refere às condições negociadas do acordo; “condições” comunica isso com clareza em português corrente.
- source_word: ἐδειλίαζον
  choice: sentiam medo
  rationale: Preserva a ideia de temor ou timidez sem introduzir tão fortemente o juízo moral associado a “eram covardes”.
- source_word: ὑπεράγαν
  choice: excessivo
  rationale: Reproduz a forte intensificação do advérbio, literalmente algo como “em extremo” ou “além da medida”.
- source_word: ἀθετεῖν
  choice: anular
  rationale: O verbo pode significar invalidar, rejeitar ou deixar sem efeito; “anular” expressa adequadamente a intenção de desfazer as disposições acordadas.
- source_word: διαστάλσεις
  choice: estipulações
  rationale: O substantivo raro parece designar as disposições específicas do acordo. “Estipulações” mantém essa precisão formal e evita confundi-lo inteiramente com συνθῆκαι.
