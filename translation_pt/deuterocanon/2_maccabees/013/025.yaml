translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. “Ptolemaida” segue a forma portuguesa corrente do topônimo. O nexo causal do grego foi preservado; o ponto e vírgula e “por isso” explicitam de modo natural a progressão para a intenção de anular as estipulações.
