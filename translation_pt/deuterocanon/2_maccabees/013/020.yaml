  text: But Judas kept sending in what was needed to those inside[a].
translation:
  language: pt
  text: Judas, porém, continuava enviando aos que estavam lá dentro o que era necessário.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “enviava o que era necessário”. O imperfeito grego pode indicar uma ação contínua ou repetida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς δὲ ἔνδον
  choice: aos que estavam lá dentro
  rationale: ἔνδον indica as pessoas situadas no interior do lugar cercado. A formulação é natural em português e não acrescenta “homens”, ausente no grego.
- source_word: Ἰούδας
  choice: Judas
  rationale: Mantém a forma tradicional e amplamente reconhecida do nome pessoal em português no contexto de 2 Macabeus.
- source_word: τὰ δέοντα
  choice: o que era necessário
  rationale: A expressão participial neutra plural designa, de modo amplo, as coisas necessárias. Evita especificar “provisões”, algo apenas implícito no contexto.
- source_word: εἰσεπέμπεν
  choice: continuava enviando
  rationale: O imperfeito grego apresenta a ação como contínua ou repetida no passado; “continuava enviando” preserva esse aspecto sem exigir que se escolha entre duração e repetição.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Lá dentro” preserva a referência espacial contextual, enquanto “o que era necessário” mantém a generalidade do grego.
