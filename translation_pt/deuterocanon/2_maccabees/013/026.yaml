  source_fidelity: A expressão «diante do tribunal» trata βῆμα como uma entidade judicial perante a qual Lísias compareceu. O grego diz mais literalmente que ele se aproximou do βῆμα, termo que pode indicar uma tribuna/estrado e, conforme o contexto, um tribunal. «Tribuna» preserva melhor essa amplitude sem introduzir uma cena judicial mais definida. «Retirou-se para Antioquia» traduz adequadamente o movimento de ἀνέζευξεν em contexto militar.
  naturalness: A revisão torna a abertura mais idiomática e precisa («aproximou-se da tribuna») e substitui «Foi assim que transcorreram o ataque e a retirada» por uma formulação narrativa mais natural em português.
  terminology: «Tribuna» é uma solução portuguesa moderna e funcional para βῆμα; a nota mantém «tribunal» e «plataforma» como alternativas. Os termos militares «ataque» e «retirada» permanecem sóbrios e não sugerem derrota ou fuga.
