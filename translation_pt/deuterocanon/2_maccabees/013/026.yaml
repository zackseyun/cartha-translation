  yaml_path: translation/deuterocanon/2_maccabees/013/026.yaml
  text: Lysias came forward to the tribunal, made as good a defense as he could, persuaded them, calmed them, made them well-disposed, and marched back to Antioch. Thus the king’s attack and withdrawal proceeded.
translation:
  language: pt
  text: Lísias aproximou-se da tribuna[a] e fez sua defesa da melhor maneira que pôde[b]. Ele os convenceu, acalmou-os e tornou-os favoráveis; depois, retirou-se para Antioquia. Assim se desenrolaram o ataque e a retirada do rei[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tribunal” ou “plataforma”.
    reason: lexical_alternative
  - marker: b
    text: O advérbio grego é difícil; também pode significar “adequadamente” ou “conforme as circunstâncias permitiam”.
    reason: lexical_alternative
  - marker: c
    text: Ou “a investida e o recuo do rei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθεν
  choice: apresentou-se diante de
  rationale: No cenário público e oficial, expressa naturalmente o ato de aproximar-se e tomar a palavra, sem acrescentar conteúdo ao grego.
- source_word: βῆμα
  choice: tribunal
  rationale: Embora possa designar uma plataforma ou cadeira de julgamento, o contexto de uma defesa pública favorece o sentido funcional de tribunal.
- source_word: ἀπελογήσατο
  choice: fez sua defesa
  rationale: 'Reproduz o sentido usual da forma média: apresentar uma defesa, aqui qualificada pelo advérbio seguinte.'
- source_word: ἐνδεχομένως
  choice: da melhor maneira que pôde
  rationale: O advérbio é difícil e pode indicar adequação ou aquilo que era possível nas circunstâncias; esta formulação preserva a ideia de capacidade condicionada.
- source_word: συνέπεισεν
  choice: os convenceu
  rationale: Transmite de modo claro o êxito da persuasão indicado pelo verbo composto.
- source_word: κατεπράϋνεν
  choice: acalmou-os
  rationale: Conserva o sentido de acalmar ou apaziguar sem sugerir meios não declarados no texto.
- source_word: εὐμενεῖς ἐποίησεν
  choice: tornou-os favoráveis
  rationale: Preserva tanto a construção causativa quanto a mudança de disposição dos ouvintes.
- source_word: ἀνέζευξεν
  choice: partiu de volta
  rationale: O verbo tem colorido militar de levantar acampamento ou partir; a expressão evita afirmar mais especificamente uma marcha ou uma fuga.
- source_word: ἐφόδου
  choice: ataque
  rationale: No resumo da campanha, representa com clareza uma investida ou avanço hostil.
- source_word: ἀναζυγῆς
  choice: retirada
  rationale: Indica o movimento militar de partir ou recuar, sem pressupor uma debandada.
- source_word: ἐχώρησεν
  choice: transcorreram
  rationale: No encerramento narrativo, o verbo resume como esses acontecimentos se desenrolaram.
theological_decisions:
- issue: O versículo não contém termo doutrinário significativamente controverso; a principal tensão é lexical, sobretudo nos termos judiciais e militares.
  choice: Traduzir como resumo narrativo da defesa bem-sucedida de Lísias e da posterior retirada do rei.
  alternative: Verter βῆμα como “plataforma” e ἀναζυγή como “recuo” ou “levantamento do acampamento”.
  rationale: A tradução comunica o contexto histórico sem transformar a retirada em fuga nem especificar além do grego a natureza física do βῆμα.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe foi dividida em períodos para evitar uma sequência excessivamente pesada, sem perder a progressão do grego.
