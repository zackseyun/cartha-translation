translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem da frase acompanha de perto o grego, enquanto «tendo conhecido por experiência» e «por meio de estratagemas» evitam literalismo pouco natural. A vírgula final foi mantida porque o trecho grego fornecido termina como parte de uma oração que prossegue.
