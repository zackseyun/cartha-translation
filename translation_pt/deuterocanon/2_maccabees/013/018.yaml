  yaml_path: translation/deuterocanon/2_maccabees/013/018.yaml
  text: But the king[a], having learned by experience the Jews’ boldness, tried to take the strongholds by stratagems[c][b],
translation:
  language: pt
  text: Mas o rei, tendo aprendido pela experiência a ousadia dos judeus[a], tentou tomar[b] as posições[c] por meio de estratagemas,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: “tendo adquirido experiência da ousadia dos judeus”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo grego é difícil neste contexto; também pode ser entendido de modo mais geral como “atacou” ou “investiu contra”.
    reason: lexical_alternative
  - marker: c
    text: Ou “os lugares”; no contexto militar, o termo pode indicar posições ou locais defendidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰληφὼς πεῖραν
  choice: tendo conhecido por experiência
  rationale: Reproduz de modo natural o valor do idioma grego, literalmente «tendo adquirido experiência», e deixa claro que o rei aprendeu isso na prática.
- source_word: εὐτολμίας
  choice: ousadia
  rationale: Conserva a ideia de disposição para agir com atrevimento sem decidir entre a avaliação positiva de «coragem» e a negativa de «audácia».
- source_word: κατεῖρασεν
  choice: tentou tomar
  rationale: Expressa a investida ou tentativa militar indicada pelo verbo difícil neste contexto, sem afirmar que as posições foram efetivamente conquistadas.
- source_word: διὰ μεθόδων
  choice: por meio de estratagemas
  rationale: No contexto militar, μέθοδοι designa recursos calculados, manobras ou ardis, e não apenas métodos em sentido genérico.
- source_word: τοὺς τόπους
  choice: as posições
  rationale: Embora τόπους signifique literalmente «lugares», «posições» comunica com naturalidade a referência contextual a locais defendidos, sem especificar indevidamente que eram fortalezas.
