base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/011.yaml
  text: '[they were] about to be deprived of the law and fatherland and holy temple[a], and [he urged them] not to allow the people, who had just now recovered a little[b], to become subject to the reviling nations.'
translation:
  language: pt
  text: '[ele os exortou] a não permitir que [eles] fossem privados da Lei, da pátria[a] e do templo santo, nem que o povo, que acabara de recobrar um pouco o alento, ficasse sujeito às nações que proferiam insultos[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «terra natal».
    reason: lexical_alternative
  - marker: b
    text: Ou «nações que blasfemavam». O termo grego pode indicar fala injuriosa ou profana.
    reason: lexical_alternative
lexical_decisions:
- source_word: στερεῖσθαι
  choice: ser privados de
  rationale: Expressa a perda imposta ou o despojamento indicado pelo infinitivo grego, em formulação natural e vigorosa em português.
- source_word: νόμου
  choice: a Lei
  rationale: No contexto judaico, designa a Lei ancestral/Torá; a inicial maiúscula ajuda a indicar essa referência específica sem acrescentar interpretação denominacional.
- source_word: πατρίδος
  choice: a pátria
  rationale: Preserva o sentido de terra ancestral e a dimensão familiar-nacional do termo; «terra natal» continua possível e é registrada em nota.
- source_word: ἱεροῦ ἁγίου
  choice: o templo santo
  rationale: ἱερόν refere-se ao templo ou recinto do templo, qualificado como santo; a expressão é clara e digna em português.
- source_word: ἄρτι βραχέως ἀνεψυγμένα
  choice: que acabara de recobrar um pouco o alento
  rationale: Comunica tanto a recente melhora quanto seu caráter limitado, conservando de modo idiomático a imagem de reanimação ou alívio.
- source_word: λαὸν
  choice: o povo
  rationale: Refere-se coletivamente ao povo judeu e corresponde diretamente ao substantivo grego.
- source_word: δυσφήμοις ἔθνεσιν
  choice: às nações que proferiam insultos
  rationale: Torna natural em português o valor verbal de δυσφήμοις, ligado à fala injuriosa, sem restringi-lo indevidamente ao sentido teológico de blasfêmia; a alternativa é indicada em nota.
- source_word: ὑποχειρίους γενέσθαι
  choice: ficasse sujeito a
  rationale: Expressa passar ao domínio ou poder de outros em português corrente, sem enfraquecer a ideia de subjugação.
theological_decisions:
- issue: Suprimento do sujeito e do verbo principal exigidos pelo contexto
  choice: Usar «[eles estavam]» e «[ele os exortou]» entre colchetes
  alternative: Manter uma construção fragmentária ou reestruturar livremente a frase como discurso indireto dependente do versículo anterior
  rationale: O trecho grego isolado é sintaticamente dependente do contexto. Os colchetes tornam a leitura inteligível e deixam explícito que essas palavras são supridas, não diretamente expressas neste versículo.
- issue: Amplitude semântica de δυσφήμοις
  choice: «nações que proferiam insultos», com nota para «blasfemavam»
  alternative: «nações blasfemas»
  rationale: O termo pode indicar fala injuriosa, difamatória ou profana. A tradução principal preserva o sentido amplo, enquanto a nota mantém visível a possibilidade de referência à blasfêmia.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega «recobrar um pouco o alento» para conservar com naturalidade a imagem grega de alívio ou reanimação. Os colchetes sinalizam os elementos recuperados do contexto imediato.
