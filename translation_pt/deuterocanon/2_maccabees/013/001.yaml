  text: In the one hundred forty-ninth year[a], it happened to those around Judas that Antiochus Eupator had arrived with forces against Judea,
translation:
  language: pt
  text: No ano cento e quarenta e nove, chegou ao conhecimento dos que estavam com Judas[a] que Antíoco Eupátor havia chegado com numerosas tropas contra a Judeia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aconteceu aos que estavam com Judas que Antíoco Eupátor tinha vindo”. O verbo grego pode apresentar tanto o acontecimento em si como a notícia dele chegando ao grupo de Judas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτῳ δὲ ἐνάτῳ καὶ τεσσερακοστῷ καὶ ἑκατοστῷ ἔτει
  choice: No ano cento e quarenta e nove
  rationale: A construção no dativo indica o momento em que ocorreu o fato. A formulação portuguesa mantém a data formal do texto grego sem reproduzir de modo artificial a repetição de ἔτει.
- source_word: προσέπεσεν
  choice: chegou ao conhecimento
  rationale: Com o dativo τοῖς περὶ τὸν Ἰούδαν e o conteúdo subsequente do relato, o verbo pode indicar que um acontecimento ou notícia alcançou o grupo de Judas. A tradução explicita esse sentido contextual sem eliminar em nota a leitura mais estritamente eventiva.
- source_word: τοῖς περὶ τὸν Ἰούδαν
  choice: dos que estavam com Judas
  rationale: A expressão designa o círculo de associados de Judas. Esta forma é natural em português e não acrescenta que fossem exclusivamente homens.
- source_word: Ἀντίοχον τὸν Εὐπάτορα
  choice: Antíoco Eupátor
  rationale: Mantém o nome pessoal e o epíteto régio em sua forma portuguesa convencional.
- source_word: παραγεγόνα
  choice: havia chegado
  rationale: A forma perfeita apresenta a chegada como concluída e relevante para a situação narrada; o mais-que-perfeito composto expressa adequadamente essa relação temporal.
- source_word: σὺν πλήθεσιν
  choice: com numerosas tropas
  rationale: Embora πλήθη signifique literalmente multidões ou grandes contingentes, o contexto militar favorece 'tropas'. 'Numerosas' preserva a ideia de grande quantidade sem impor a noção mais específica de um único exército.
- source_word: ἐπὶ τὴν Ἰουδαίαν
  choice: contra a Judeia
  rationale: Em contexto de deslocamento militar, ἐπί com acusativo pode expressar avanço hostil contra um território. 'Contra' conserva essa orientação adversativa.
