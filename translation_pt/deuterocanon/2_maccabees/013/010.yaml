base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/010.yaml
  text: And when Judas learned these things, he ordered the multitude to call upon the Lord day and night, that, as at other times, so now also he might come to their aid,
translation:
  language: pt
  text: Quando Judas soube dessas coisas, ordenou à multidão que invocasse o Senhor dia e noite, para que, como em outras ocasiões, também agora lhes viesse em auxílio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego é elíptico e literalmente traz algo como: «se alguma vez também em outra ocasião, também agora, socorrer». A tradução exprime o sentido comparativo provável: um pedido para que o Senhor ajude agora, como já ajudara antes.'
    reason: Registra a elipse e a nuance formal da construção grega, sem tornar a frase principal artificial nem apresentar como inequívoca uma formulação discutida.
lexical_decisions:
- source_word: μεταλαβὼν
  choice: quando Judas soube
  rationale: O particípio indica que Judas recebeu ou tomou conhecimento das notícias. “Soube” expressa esse sentido de modo natural e conciso em português.
- source_word: παρήγγειλεν
  choice: ordenou
  rationale: Mantém a força autoritativa do verbo sem tornar a narração excessivamente solene.
- source_word: τῷ πλήθει
  choice: à multidão
  rationale: Preserva o caráter coletivo de πλῆθος, que designa o grupo reunido sob a liderança de Judas.
- source_word: διʼ ἡμέρας καὶ νυκτὸς
  choice: dia e noite
  rationale: É a formulação idiomática corrente para uma ação contínua ou reiterada.
- source_word: ἐπικαλεῖσθαι τὸν κύριον
  choice: que invocasse o Senhor
  rationale: “Invocar” comunica o apelo dirigido a Deus em oração e preserva o tom bíblico da expressão.
- source_word: κύριον
  choice: Senhor
  rationale: No contexto judaico de oração, κύριος se refere a Deus; “Senhor” conserva a ressonância bíblica e teológica apropriada.
- source_word: εἴ ποτε καὶ ἄλλοτε, καὶ νῦν
  choice: se alguma vez os havia socorrido, também agora
  rationale: A formulação mantém a condição retórica do grego, em vez de transformá-la sem indicação numa comparação afirmativa, e explicita apenas o auxílio subentendido pela construção elíptica.
- source_word: ἐπιβοηθεῖν
  choice: viesse em seu auxílio
  rationale: Expressa tanto a ajuda quanto a ideia de intervenção em resposta a um clamor urgente.
theological_decisions:
- issue: Tradução de κύριος numa oração dirigida a Deus
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” é a forma bíblica corrente para κύριος neste contexto e não introduz uma nuance secular de domínio.
- issue: Força da construção εἴ ποτε καὶ ἄλλοτε
  choice: se alguma vez os havia socorrido
  alternative: assim como em outras ocasiões
  rationale: A opção principal conserva a forma condicional e a tensão retórica do grego. A alternativa transmite o sentido contextual provável, mas converte a condição em afirmação explícita.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluente. “Multidão” e “invocasse o Senhor” mantêm o tom elevado do relato sem arcaísmo excessivo.
