review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz bem a sequência narrativa, a ordem de Judas, a oração contínua e o apelo ao Senhor. Contudo, «se alguma vez os havia socorrido» transforma a construção elíptica εἴ ποτε καὶ ἄλλοτε, καὶ νῦν numa condição portuguesa pouco natural e introduz um mais-que-perfeito indicativo que o grego não explicita. No contexto, a formulação comparativa é a representação mais segura e clara da súplica por auxílio presente em continuidade com auxílios anteriores.
  naturalness: «Quando Judas soube dessas coisas» e «ordenou à multidão que invocasse o Senhor dia e noite» são naturais e adequados ao registro. «Como em outras ocasiões, também agora lhes viesse em auxílio» é mais fluente do que a condicional atual; «lhes» evita que «seu» possa remeter a Judas.
  terminology: «Senhor» para κύριος e «invocasse» para ἐπικαλεῖσθαι são apropriados no contexto de oração. «Multidão» conserva satisfatoriamente o valor coletivo de τῷ πλήθει.
  issues:
  - severity: medium
    issue: 'A construção εἴ ποτε καὶ ἄλλοτε, καὶ νῦν foi vertida como uma condição factual no mais-que-perfeito: «se alguma vez os havia socorrido».'
    rationale: O grego é elíptico, mas no contexto funciona como apelo para que Deus ajude agora tal como em outras ocasiões. A redação atual acrescenta uma forma verbal e uma relação condicional que não são necessárias e soa artificial em português.
  - severity: low
    issue: «Em seu auxílio» tem antecedente possessivo potencialmente ambíguo.
    rationale: «Lhes viesse em auxílio» deixa claro que o auxílio é dirigido ao grupo mencionado, sem alterar o sentido.
  revised_text: Quando Judas soube dessas coisas, ordenou à multidão que invocasse o Senhor dia e noite, para que, como em outras ocasiões, também agora lhes viesse em auxílio.[a]
