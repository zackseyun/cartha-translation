  text: But Dositheus and Sosipater, commanders under Maccabaeus, went out and destroyed those left behind by Timothy in the stronghold, more than ten thousand men.
translation:
  language: pt
  text: Mas Dositeu e Sosípatro, entre os comandantes de Macabeu, saíram e destruíram os que Timóteo havia deixado na fortaleza, mais de dez mil homens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν περὶ τὸν Μακκαβαῖον ἡγουμένων
  choice: comandantes sob as ordens de Macabeu
  rationale: O particípio ἡγουμένων indica liderança, e a expressão com περὶ associa Dositeu e Sosípatro a Macabeu. No contexto militar, «comandantes sob as ordens de Macabeu» transmite com naturalidade tanto a função quanto a relação hierárquica.
- source_word: ἐξοδεύσαντες
  choice: saíram
  rationale: O particípio significa sair ou partir. «Saíram» preserva a formulação simples do grego sem acrescentar uma marcha explicitamente não indicada.
- source_word: τοὺς ὑπὸ Τιμοθέου ... καταλειφθέντας
  choice: os que Timóteo havia deixado
  rationale: 'ὑπὸ Τιμοθέου expressa o agente do particípio passivo καταλειφθέντας. A oração ativa em português é clara e reproduz corretamente a relação: Timóteo deixou esses homens na fortaleza.'
- source_word: ἀπώλεσαν
  choice: destruíram
  rationale: O verbo pode significar destruir, fazer perecer ou matar. «Destruíram» mantém o sentido amplo de aniquilação militar sem estreitá-lo indevidamente.
- source_word: ἐν τῷ ὀχυρώματι
  choice: na fortaleza
  rationale: ὀχύρωμα designa um lugar fortificado. «Fortaleza» é corrente, natural e adequado ao cenário militar.
- source_word: πλείους τῶν μυρίων ἀνδρῶν
  choice: mais de dez mil homens
  rationale: A expressão comparativa indica literalmente um número superior a dez mil; «homens» é apropriado porque se trata de uma força combatente masculina.
