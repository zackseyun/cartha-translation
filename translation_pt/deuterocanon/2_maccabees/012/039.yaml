review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva os principais elementos do grego: o grupo ligado a Judas, a recolha dos corpos dos caídos, os parentes e os túmulos ancestrais. Contudo, «pois já se tornara necessário» transforma a indicação temporal καθʼ ὃν χρόνον («quando», «na ocasião em que») numa relação causal e introduz uma anterioridade mais marcada do que a necessária.'
  naturalness: O português é geralmente claro e moderno. A sequência «para junto de seus parentes, nos túmulos de seus antepassados» é compreensível, mas a pontuação e a construção podem tornar menos nítida a relação entre os parentes e o local de sepultamento.
  terminology: «Judas», «corpos», «os que haviam caído», «parentes» e «túmulos ancestrais» são adequados. «Túmulos ancestrais» comunica naturalmente πατρῴους τάφους sem reduzir indevidamente a expressão a «pais».
  issues:
