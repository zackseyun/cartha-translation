  text: On the following day[a], the men with Judas came, when the need had arisen, to gather up the bodies of those who had fallen and to restore them with their relatives to the tombs of their fathers.
translation:
  language: pt
  text: No dia seguinte, os homens que estavam com Judas vieram, quando se tornou necessário, para recolher os corpos dos que haviam caído e levá-los de volta com seus parentes, nos túmulos ancestrais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ δὲ ἐχομένῃ
  choice: No dia seguinte
  rationale: Expressão temporal idiomática e natural em português, fiel ao sentido de sequência do grego.
- source_word: οἱ περὶ τὸν Ἰούδαν
  choice: os homens que estavam com Judas
  rationale: Representa o grupo ou os companheiros de Judas sem acrescentar uma designação militar que o grego não explicita.
- source_word: καθʼ ὃν χρόνον τὸ τῆς χρείας ἐγέγονει
  choice: pois já se tornara necessário
  rationale: Expressa de modo fluente que as circunstâncias passaram a exigir a ação; o mais-que-perfeito preserva a anterioridade indicada pelo grego.
- source_word: τὰ σώματα τῶν προπεπτωκότων
  choice: os corpos dos que haviam caído
  rationale: Mantém a imagem verbal de cair, empregada aqui para os mortos em combate, sem tornar explícito além do texto.
- source_word: ἀνακομίσασθαι
  choice: recolher
  rationale: No contexto, significa recuperar os corpos no local da batalha para transportá-los ao sepultamento.
- source_word: ἀποκαταστῆσαι
  choice: levá-los de volta
  rationale: Comunica naturalmente a ideia de restituir ou devolver os corpos ao lugar familiar e apropriado, sem a estranheza de 'restaurá-los' em português.
- source_word: μετὰ τῶν συγγενῶν
  choice: para junto de seus parentes
  rationale: Preserva explicitamente a referência aos parentes e indica a associação funerária, sem determinar de modo indevido a relação espacial exata.
- source_word: εἰς τοὺς πατρῴους τάφους
  choice: nos túmulos de seus antepassados
  rationale: Traduz o valor ancestral de πατρῴους de modo claro e idiomático, conservando a referência explícita aos túmulos.
theological_decisions:
- issue: Relação entre os parentes e os túmulos ancestrais no local de sepultamento
  choice: levá-los de volta para junto de seus parentes, nos túmulos de seus antepassados
  alternative: levá-los de volta com seus parentes para os túmulos de seus pais
  rationale: A formulação conserva os dois elementos presentes no grego — parentes e túmulos ancestrais — sem fundi-los nem impor uma interpretação doutrinária. 'Antepassados' comunica melhor em português o sentido de πατρῴους do que o literal 'pais'.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. A estrutura foi levemente reorganizada para evitar uma oração temporal pesada, sem eliminar nenhuma informação do grego.
