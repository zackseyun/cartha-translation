    issue: «pois já se tornara necessário»
    rationale: καθʼ ὃν χρόνον é uma locução temporal, não uma conjunção causal. «Quando se tornou necessário» preserva melhor a sintaxe e o sentido do original.
  - severity: low
    issue: Relação sintática entre parentes e túmulos
    rationale: A reformulação para «com seus parentes, nos túmulos ancestrais» retém os dois complementos expressos no grego e soa mais direta no contexto funerário.
  revised_text: No dia seguinte, os homens que estavam com Judas vieram, quando se tornou necessário, para recolher os corpos dos que haviam caído e levá-los de volta com seus parentes, nos túmulos ancestrais.
