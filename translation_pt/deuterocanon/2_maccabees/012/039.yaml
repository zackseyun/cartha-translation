revisions:
- from: No dia seguinte, os homens que estavam com Judas vieram, pois já se tornara necessário recolher os corpos dos que haviam caído e levá-los de volta para junto de seus parentes, nos túmulos de seus antepassados.
  to: No dia seguinte, os homens que estavam com Judas vieram, quando se tornou necessário, para recolher os corpos dos que haviam caído e levá-los de volta com seus parentes, nos túmulos ancestrais.
  rationale: A revisão substitui a relação causal e o mais-que-perfeito desnecessário por uma oração temporal correspondente ao grego. Também torna mais fluente a expressão do retorno dos mortos para o sepultamento junto de seus parentes nos túmulos ancestrais, sem eliminar nenhum dos dois elementos nem especificar uma relação espacial além do texto.
