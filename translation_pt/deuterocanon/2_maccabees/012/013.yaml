lexical_decisions:
- source_word: Ἐπέβαλεν
  choice: avançou contra
  rationale: Preserva o movimento militar e a hostilidade do verbo sem especificar prematuramente se já houve ataque direto.
- source_word: ἐπί τινα πόλιν
  choice: contra certa cidade
  rationale: Mantém a preposição de sentido hostil e a apresentação indefinida expressa por τινα.
- source_word: γεφυρῶν
  choice: de pontes
  rationale: Reproduz o genitivo grego comprimido, provavelmente descritivo de uma cidade caracterizada por pontes ou obras semelhantes, sem resolver sua ambiguidade.
- source_word: ὀχυρὰν
  choice: fortemente fortificada
  rationale: Explicita de modo natural o caráter defensivo da força indicada pelo adjetivo.
- source_word: τείχεσιν περιτεφραγμένην
  choice: cercada de muralhas
  rationale: Expressa com clareza a imagem da cidade rodeada por estruturas defensivas.
- source_word: παμμιγέσιν ἔθνεσιν
  choice: povos de diversas origens
  rationale: Comunica a composição populacional amplamente mista indicada por παμμιγής e conserva a pluralidade de ἔθνη, evitando a conotação moderna de Estados-nação.
- source_word: κατοικουμένην
  choice: habitada
  rationale: Equivalente direto e idiomático do particípio passivo.
- source_word: ὄνομα δὲ Κασπείν
  choice: seu nome era Caspim
  rationale: Preserva a fórmula explícita de nomeação; Caspim é uma transliteração portuguesa legível de Κασπείν.
