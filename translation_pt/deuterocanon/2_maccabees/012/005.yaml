lexical_decisions:
- source_word: μεταλαβών
  choice: ao tomar conhecimento
  rationale: No contexto, o particípio indica que Judas recebeu ou ficou sabendo do ocorrido; esta formulação comunica isso naturalmente sem acrescentar a fonte da informação.
- source_word: τὴν γεγονυῖαν ... ὠμότητα
  choice: da crueldade cometida
  rationale: O particípio perfeito γεγονυῖαν apresenta a crueldade como fato já ocorrido; “cometida” preserva a ideia de uma atrocidade praticada, em português idiomático.
- source_word: εἰς τοὺς ὁμοεθνεῖς
  choice: contra os seus compatriotas
  rationale: ὁμοεθνεῖς designa pessoas do mesmo povo ou nação que Judas; “compatriotas” é claro, corrente e mantém esse vínculo étnico-nacional.
- source_word: τοῖς περὶ αὐτὸν ἀνδράσιν
  choice: aos homens que estavam com ele
  rationale: A expressão idiomática refere-se aos homens que acompanhavam Judas, sem exigir uma designação militar mais específica.
