base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/038.yaml
  text: Then Judas[a], taking the army, came to the city of Odollam. And as the week was ending, they purified themselves there according to the custom and spent the Sabbath there.
translation:
  language: pt
  text: Então Judas, levando consigo o exército, chegou à cidade de Odolam. Quando a semana chegava ao fim[a], eles se purificaram ali segundo o costume, e Judas passou ali o sábado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “quando a semana se aproximava”; o contexto e a menção seguinte do sábado indicam a aproximação do sétimo dia.
    reason: alternativa lexical
lexical_decisions:
- source_word: ἀναλαβών
  choice: levando consigo
  rationale: O particípio indica que Judas tomou o exército consigo ao retomar o deslocamento; a expressão é natural em português sem acrescentar a ideia específica de que ele o reuniu.
- source_word: στράτευμα
  choice: exército
  rationale: O termo designa um corpo militar; “exército” é o equivalente moderno mais direto.
- source_word: ἧκεν
  choice: chegou
  rationale: O verbo indica chegada a um lugar, sentido expresso com clareza por “chegou”.
- source_word: Ὀδολλὰμ πόλιν
  choice: à cidade de Odolam
  rationale: Mantém explícito πόλιν, “cidade”, e translitera o topônimo grego em forma natural para o português.
- source_word: τῆς ... ἑβδομάδος ἐπιβαλλούσης
  choice: quando a semana chegava ao fim
  rationale: A expressão grega é temporal e literalmente difícil, descrevendo a semana como estando a chegar ou avançar. A menção imediata do sábado aponta para a aproximação do fim da semana; a nota preserva a formulação mais literal e sua ambiguidade.
- source_word: κατὰ τὸν ἐθισμόν
  choice: segundo o costume
  rationale: ἐθισμός indica prática habitual; a formulação é clara, digna e próxima do grego.
- source_word: ἁγνισθέντες
  choice: eles se purificaram
  rationale: O particípio passivo tem aqui sentido reflexivo natural e conserva a nuance de purificação ritual, sem reduzi-la a higiene física.
- source_word: αὐτόθι
  choice: ali
  rationale: Equivalente locativo simples e natural.
- source_word: τὸ σάββατον διῆγεν
  choice: passaram o sábado
  rationale: διῆγεν significa passar um período de tempo. A tradução evita acrescentar uma afirmação litúrgica mais forte do que o verbo, embora o contexto implique a observância do sábado.
theological_decisions:
- issue: Linguagem ritual antes do sábado
  choice: eles se purificaram ali segundo o costume
  alternative: eles se limparam ali, como de costume
  rationale: “Purificaram-se” preserva a conotação ritual de ἁγνισθέντες e o contexto da prática judaica, sem inserir detalhes não declarados no texto.
- issue: Referência ao encerramento da semana
  choice: quando a semana chegava ao fim
  alternative: quando a semana se aproximava / quando se aproximava o sétimo dia
  rationale: A tradução comunica o sentido temporal indicado pelo sábado subsequente, enquanto a nota reconhece que a expressão grega, tomada isoladamente, é menos explícita e pode ser vertida mais literalmente.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa corrente. “Odolam” translitera o nome grego; “sábado” permanece em minúscula conforme o uso moderno. A formulação conserva a linguagem de purificação ritual sem explicá-la além do que o versículo afirma.
