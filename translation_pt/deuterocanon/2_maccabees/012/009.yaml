  text: And making a night attack on the people of Jamnia[a], he set the harbor and the fleet on fire, so that the rays of the light were visible as far as Jerusalem[b], it being two hundred forty stadia away.
translation:
  language: pt
  text: E, atacando de noite os habitantes de Jâmnia, incendiou o porto juntamente com a frota, de modo que os clarões da luz podiam ser vistos até Jerusalém, que ficava a duzentos e quarenta estádios de distância.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O estádio era uma antiga unidade de comprimento. Duzentos e quarenta estádios correspondem aproximadamente a 43–45 quilômetros.
    reason: cultural_note
lexical_decisions:
- source_word: τοῖς Ἰαμνίταις
  choice: os habitantes de Jâmnia
  rationale: O dativo indica o alvo do ataque. A expressão é natural em português moderno e preserva a referência geográfica.
- source_word: νυκτὸς ἐπιβαλὼν
  choice: atacando de noite
  rationale: O particípio descreve uma investida militar realizada à noite; a formulação mantém tanto a ação quanto a circunstância temporal.
- source_word: ἐνέπρησεν
  choice: incendiou
  rationale: O verbo significa pôr fogo ou queimar; “incendiou” é direto e adequado aos objetos mencionados.
- source_word: τὸν λιμένα σὺν τῷ στόλῳ
  choice: o porto juntamente com a frota
  rationale: λιμήν é o porto ou ancoradouro, e στόλος, neste contexto, é o conjunto de navios. “Juntamente com” representa explicitamente σύν.
- source_word: ὥστε ἐπιφαίνεσθαι
  choice: de modo que ... podiam ser vistos
  rationale: A construção indica resultado e visibilidade; esta forma é clara e idiomática em português.
- source_word: τὰς αὐγὰς τοῦ φέγγους
  choice: os clarões da luz
  rationale: A tradução conserva a imagem relativamente literal de brilhos ou clarões provenientes da luz, sem substituir silenciosamente a expressão por “labaredas” ou “incêndio”.
- source_word: εἰς τὰ Ἱεροσόλυμα
  choice: até Jerusalém
  rationale: 'No contexto, εἰς marca o alcance da visibilidade: os clarões eram perceptíveis até Jerusalém.'
- source_word: σταδίων ὄντων διακοσίων τεσσεράκοντα
  choice: que ficava a duzentos e quarenta estádios de distância
  rationale: O genitivo absoluto informa a distância. A oração relativa explicita de modo natural que Jerusalém estava a essa distância, sem acrescentar valor concessivo ausente no grego.
