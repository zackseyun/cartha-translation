  yaml_path: translation/deuterocanon/2_maccabees/012/002.yaml
  text: But of the local commanders[a], Timotheus and Apollonius son of Gennaeus, and further Hieronymus and Demophon, and besides these Nicanor the Cypriarch, would not let them live in peace.
translation:
  language: pt
  text: Mas os comandantes locais — Timóteo, Apolônio, filho de Geneu, Jerônimo, Demofonte e, além deles, Nicanor, o cipriarca[a] — não os deixavam viver em paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “cipriarca”, título que pode significar “governante de Chipre” ou designar um oficial ligado a Chipre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ... κατὰ τόπον στρατηγῶν
  choice: os comandantes locais
  rationale: A expressão designa comandantes ligados a determinadas localidades ou regiões. “Comandantes locais” conserva o sentido administrativo sem impor um posto técnico mais específico.
- source_word: ὁ τοῦ Γενναίου
  choice: filho de Geneu
  rationale: O artigo seguido do genitivo funciona como patronímico e identifica Apolônio por seu pai.
- source_word: ἔτι δὲ ... πρὸς δὲ τούτοις
  choice: Jerônimo, Demofonte e, além deles, Nicanor
  rationale: A formulação portuguesa mantém o caráter cumulativo da enumeração sem reproduzir de modo artificial todos os conectivos gregos.
- source_word: ὁ Κυπριάρχης
  choice: o cipriarca[a]
  rationale: A transliteração preserva o título grego e evita defini-lo com precisão maior do que a fonte permite; a nota explica seu provável sentido.
- source_word: οὐκ εἴων
  choice: não os deixavam
  rationale: O imperfeito indica impedimento continuado; a expressão é natural em português e conserva essa força durativa.
- source_word: ἡσυχίαν ἄγειν
  choice: viver em paz
  rationale: Tradução idiomática da expressão que significa levar uma vida tranquila ou permanecer em sossego.
