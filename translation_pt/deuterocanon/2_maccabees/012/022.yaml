base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/022.yaml
  text: But when Judas’s company first appeared[a], and dread came upon the enemies—fear also coming upon them from the appearing of the One who watches over all things—they rushed into flight, each man being driven a different way, so that they were often injured by their own men and run through by the points of their swords.
translation:
  language: pt
  text: Mas, assim que a tropa de Judas apareceu, o pavor tomou conta dos inimigos; e, com a manifestação daquele que tudo observa[a], o medo caiu sobre eles. Então se lançaram em fuga, cada um sendo levado para um lado diferente, de modo que muitas vezes eram feridos pelos próprios companheiros e transpassados pelas pontas de suas espadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da manifestação daquele que vê todas as coisas”. O grego repete aqui a mesma linguagem de aparecimento usada anteriormente no versículo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφανείσης ... ἐπιφανίας
  choice: apareceu ... manifestação
  rationale: 'Preserva, tanto quanto o português natural permite, a repetição da linguagem de aparecimento no grego: primeiro para a tropa de Judas, depois para a ação divina.'
- source_word: σπείρης
  choice: tropa
  rationale: Expressa uma unidade militar sem impor o sentido técnico e o tamanho exato de uma coorte romana.
- source_word: δέους ... φόβου
  choice: pavor ... medo
  rationale: Mantém os dois termos gregos próximos, mas distintos, com linguagem clara e intensa.
- source_word: τοῦ τὰ πάντα ἐφορῶντος
  choice: daquele que tudo observa
  rationale: ἐφοράω abrange ver, observar e supervisionar. A formulação conserva a abrangência da percepção divina sem explicitar além do texto uma noção técnica de providência.
- source_word: εἰς φυγὴν ὥρμησαν
  choice: se lançaram em fuga
  rationale: Comunica o movimento súbito e impetuoso de ὁρμάω em português idiomático.
- source_word: ἄλλος ἀλλαχῇ φερόμενος
  choice: cada um correndo numa direção
  rationale: Reproduz a dispersão caótica e distributiva da expressão, embora torne o passivo grego mais natural em português.
- source_word: ὑπὸ τῶν ἰδίων βλάπτεσθαι
  choice: eram feridos pelos próprios companheiros
  rationale: No contexto militar, 'companheiros' explicita que eram homens do próprio lado, enquanto 'feridos' traduz naturalmente o dano sofrido.
- source_word: ταῖς τῶν ξιφῶν ἀκμαῖς ἀναπείρεσθαι
  choice: transpassados pelas pontas de suas espadas
  rationale: Mantém a imagem concreta de perfuração pelas extremidades afiadas das espadas.
theological_decisions:
- issue: Descrição divina τοῦ τὰ πάντα ἐφορῶντος
  choice: daquele que tudo observa
  alternative: daquele que vela sobre todas as coisas; daquele que vê todas as coisas
  rationale: A opção conserva diretamente a afirmação da percepção universal de Deus e deixa em aberto a nuance entre observar e supervisionar, sem importar terminologia doutrinária posterior.
- issue: ἐπιφανία aplicada à ação divina
  choice: manifestação
  alternative: aparecimento
  rationale: ‘Manifestação’ é digna e natural no contexto teológico, além de preservar a relação lexical com o aparecimento inicial da tropa sem definir a forma exata da intervenção divina.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi dividida em duas frases para clareza, preservando a progressão: aparecimento da tropa, terror de origem divina, fuga caótica e ferimentos causados entre os próprios inimigos.'
