base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/006.yaml
  text: 'And calling on God[a], the righteous judge, he came against the murderers of his brothers: by night he set the harbor on fire and burned the ships, and he stabbed those who had fled there.'
translation:
  language: pt
  text: E, invocando a Deus, o justo juiz, foi contra os assassinos de seus irmãos. Durante a noite, incendiou o porto e queimou as embarcações; e traspassou os que haviam fugido para lá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que haviam se refugiado ali”. O particípio grego pode enfatizar que eles haviam fugido para aquele lugar em busca de refúgio.'
    reason: alternativa lexical
lexical_decisions:
- source_word: ἐπικαλεσάμενος
  choice: invocando
  rationale: Expressa o apelo religioso dirigido a Deus antes da ação, em português natural e solene.
- source_word: τὸν δίκαιον κριτὴν θεόν
  choice: a Deus, o justo juiz
  rationale: Preserva a aposição e a força moral e judicial de δίκαιον sem ampliar a afirmação teológica.
- source_word: παραγενόμενος ἐπὶ
  choice: foi contra
  rationale: Neste contexto hostil, indica movimento dirigido contra os responsáveis pelo massacre.
- source_word: τοὺς μιαιφόνους τῶν ἀδελφῶν
  choice: os assassinos de seus irmãos
  rationale: “Assassinos” transmite a forte ideia de culpa de sangue em μιαιφόνους; “irmãos” mantém o termo relacional, que no contexto pode incluir compatriotas.
- source_word: τὸν μὲν λιμένα
  choice: o porto
  rationale: λιμήν pode designar porto ou ancoradouro; “porto” é claro e adequado ao cenário narrativo.
- source_word: νύκτωρ
  choice: durante a noite
  rationale: Indica de modo natural o momento do ataque.
- source_word: ἐνέπρησεν
  choice: incendiou
  rationale: Comunica diretamente a ação de atear fogo.
- source_word: τὰ σκάφη κατέφλεξεν
  choice: queimou as embarcações
  rationale: “Embarcações” abrange barcos e navios sem especificar tamanho; “queimou” preserva a ação sem repetição pesada.
- source_word: τοὺς δὲ ἐκεῖ συμφυγόντας
  choice: os que haviam fugido juntos para ali
  rationale: Mantém tanto a ideia de fuga conjunta do composto συμφεύγω quanto o movimento para aquele lugar, sem tornar explícita demais a noção possível de refúgio.
- source_word: ἐξεκέντησεν
  choice: trespassou
  rationale: Preserva a ideia de perfurar com arma pontiaguda sem acrescentar uma arma que o grego não especifica.
theological_decisions:
- issue: Caracterização de Deus como juiz em contexto de retaliação militar
  choice: a Deus, o justo juiz
  alternative: a Deus, o juiz reto
  rationale: A tradução conserva o título judicial e o apelo de Judas à justiça divina, sem apresentar comentário que aprove ou condene além do que o versículo afirma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura foi dividida em duas frases para fluidez. O marcador da nota foi colocado junto à expressão a que de fato se refere no grego; na camada inglesa fornecida, ele aparece após “God”, embora o conteúdo da nota trate de συμφυγόντας.
