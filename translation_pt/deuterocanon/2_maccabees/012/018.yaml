  yaml_path: translation/deuterocanon/2_maccabees/012/018.yaml
  text: But they did not catch Timotheus in those places[a], for he had then withdrawn from the places without accomplishing anything, though he had left a garrison in a certain place[b], and a very strong one at that.
translation:
  language: pt
  text: Mas eles não alcançaram Timóteo naqueles lugares[a], pois ele, naquela ocasião, já havia se retirado daqueles lugares sem conseguir nada, embora tivesse deixado uma guarnição em certo lugar — e uma guarnição muito forte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não capturaram Timóteo naqueles lugares”. O verbo grego pode significar alcançar, apanhar ou capturar.
    reason: lexical_alternative
  - marker: b
    text: A expressão “muito forte” descreve mais diretamente a guarnição, embora também possa sugerir a força ou a fortificação do lugar onde ela foi deixada.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέλαβον
  choice: alcançaram
  rationale: No contexto de perseguição militar, o verbo pode significar alcançar, apanhar ou capturar. “Alcançaram” expressa naturalmente que Timóteo escapou antes da chegada deles, sem afirmar que chegaram a prendê-lo.
- source_word: ἐπὶ τῶν τόπων
  choice: naqueles lugares
  rationale: Preserva a referência local no plural e remete aos lugares mencionados no contexto, sem reduzi-los a uma única região.
- source_word: ἄπρακτον
  choice: sem conseguir nada
  rationale: Comunica de modo corrente que Timóteo se retirou sem obter resultado ou realizar seu objetivo.
- source_word: ἐκλελυκότα
  choice: já havia se retirado
  rationale: A forma participial descreve sua saída anterior; “retirado” combina com o contexto militar, e “já havia” torna clara a anterioridade.
- source_word: ἐκ τῶν τόπων
  choice: dali
  rationale: Evita a repetição pouco natural de “daqueles lugares” em português, mantendo a referência aos mesmos locais.
- source_word: καταλελοιπότα
  choice: tivesse deixado
  rationale: 'Preserva o contraste: embora o próprio Timóteo tivesse se retirado, deixou uma força para trás.'
- source_word: φρουράν
  choice: uma guarnição
  rationale: Em narrativa militar, designa adequadamente uma força armada deixada para guardar uma posição.
- source_word: ἐν τινι τόπῳ
  choice: em certo lugar
  rationale: Mantém a indefinição do grego sem especificar indevidamente o local.
- source_word: μάλιστα ὀχυράν
  choice: uma guarnição muito forte
  rationale: O adjetivo feminino singular concorda diretamente com φρουράν. A formulação preserva essa referência, embora a força da guarnição possa envolver a fortificação de sua posição.
