  text: De lá, partiram e percorreram setecentos e cinquenta estádios até Carax e até os judeus chamados tubienos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os chamados judeus tubienos”; o nome do grupo, Τουβιηνοί, também pode ser traduzido interpretativamente como “tobíadas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσπάσαντες
  choice: marcharam
  rationale: O particípio indica que se afastaram ou partiram daquele lugar; no contexto de uma expedição militar, “marcharam” expressa isso com naturalidade.
- source_word: σταδίους ἑπτακοσίους πεντήκοντα
  choice: setecentos e cinquenta estádios
  rationale: Mantém a antiga unidade de distância presente no texto grego e preserva sua ambientação histórica, sem inserir uma conversão moderna no texto principal.
- source_word: διήνυσαν
  choice: chegaram
  rationale: O verbo descreve o cumprimento ou percurso de uma distância; junto às expressões de destino, “chegaram” comunica de modo natural a conclusão do trajeto.
- source_word: εἰς τὸν Χάρακα
  choice: a Carax
  rationale: O nome geográfico é transliterado, e a preposição “a” expressa de modo idiomático o movimento em direção ao lugar.
- source_word: τοὺς λεγομένους Τουβιηνοὺς Ἰουδαίους
  choice: aos judeus chamados tubienos
  rationale: “Chamados” reproduz λεγομένους sem acrescentar tom depreciativo. “Tubienos” adapta o gentílico grego à morfologia portuguesa, enquanto a possível identificação interpretativa como “tobíadas” fica em nota.
