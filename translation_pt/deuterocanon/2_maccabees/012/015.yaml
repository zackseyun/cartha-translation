base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/015.yaml
  text: But those around Judas[a], having called on the great Sovereign of the world—the one who, in the time of Joshua, brought down Jericho without rams or siege engines—assaulted the wall fiercely.
translation:
  language: pt
  text: Mas os que estavam com Judas, depois de invocarem o grande Soberano do mundo — aquele que, nos dias de Josué[a], derrubou Jericó sem aríetes nem máquinas de cerco —, atacaram a muralha com ferocidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega a forma Iēsoû, que aqui se refere a Josué, o líder associado à queda de Jericó.
    reason: Esclarece que a mesma forma grega pode corresponder a Josué ou Jesus e identifica o referente exigido pelo contexto.
lexical_decisions:
- source_word: οἱ δὲ περὶ τὸν Ἰούδαν
  choice: Mas os que estavam com Judas
  rationale: A construção περὶ com acusativo designa o grupo ligado a um líder. A formulação é natural em português e não acrescenta uma identificação militar que o grego não explicita.
- source_word: ἐπικαλεσάμενοι
  choice: depois de invocarem
  rationale: O particípio médio indica apelo ou invocação, aqui dirigido a Deus. A oração temporal expressa com clareza a anterioridade do particípio grego.
- source_word: τὸν μέγαν τοῦ κόσμου δυνάστην
  choice: o grande Soberano do mundo
  rationale: δυνάστης denota alguém dotado de poder e domínio. “Soberano” conserva a elevação e a autoridade do título sem soar arcaico.
- source_word: ἄτερ κριῶν καὶ μηχανῶν ὀργανικῶν
  choice: sem aríetes nem máquinas de cerco
  rationale: κριοί são aríetes em contexto de cerco, e μηχαναί ὀργανικαί são engenhos ou máquinas bélicas. A expressão portuguesa é precisa e facilmente compreensível.
- source_word: κατακρημνίσαντα τὴν Ἰερειχώ
  choice: derrubou Jericó
  rationale: O verbo descreve fazer cair ou lançar abaixo. “Derrubou” comunica de modo conciso a queda das defesas de Jericó sem inserir “muralhas”, substantivo apenas implícito nesta oração.
- source_word: κατὰ τοὺς Ἰησοῦ χρόνους
  choice: nos dias de Josué
  rationale: A alusão à queda de Jericó identifica inequivocamente Ἰησοῦς como Josué, filho de Num. Usa-se a forma portuguesa convencional do nome.
- source_word: ἐνέσεισαν θηριωδῶς τῷ τείχει
  choice: atacaram a muralha com ferocidade
  rationale: Embora ἐνέσεισαν possa evocar sacudir ou investir contra algo, o contexto é um ataque à muralha. “Com ferocidade” conserva a força de θηριωδῶς sem a estranheza de uma reprodução literal como “à maneira de feras”.
theological_decisions:
- issue: Identificação de Ἰησοῦ na alusão a Jericó
  choice: Josué
  alternative: Jesus, como reprodução formal da mesma forma nominal grega
  rationale: O contexto histórico remete inequivocamente a Josué e à queda de Jericó. Empregar “Jesus” confundiria o leitor moderno e obscureceria o referente original.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A estrutura parentética preserva a invocação solene e a alusão histórica sem tornar o período excessivamente pesado.
