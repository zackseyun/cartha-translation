  yaml_path: translation/deuterocanon/2_maccabees/012/012.yaml
  text: But Judas[a], recognizing that they were truly useful to them in many ways, agreed to keep peace with them; and after giving right hands, they parted to their tents.
translation:
  language: pt
  text: Judas, porém, reconhecendo que eles lhes eram realmente úteis em muitos aspectos, concordou em manter a paz com eles. Depois de apertarem as mãos direitas[a], separaram-se e foram para suas tendas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tendo tomado as mãos direitas”; era um gesto costumeiro de compromisso ou acordo.
    reason: cultural_note
lexical_decisions:
- source_word: ὑπολαβών
  choice: reconhecendo
  rationale: Expressa a avaliação ponderada de Judas no contexto, sem reduzi-la a mera suposição.
- source_word: ὡς ἀληθῶς
  choice: realmente
  rationale: Preserva de modo natural em português a força enfática do advérbio grego.
- source_word: ἐν πολλοῖς
  choice: em muitos aspectos
  rationale: Reproduz a amplitude idiomática da expressão, que indica utilidade em diversas questões.
- source_word: χρησίμους
  choice: úteis
  rationale: Mantém o sentido direto de benefício prático no contexto político-militar.
- source_word: ὑπεχώρησεν εἰρήνην ἄξειν πρὸς αὐτούς
  choice: concordou em manter a paz com eles
  rationale: Traduz naturalmente tanto a ideia de concessão ou assentimento em ὑπεχώρησεν quanto a de manter relações pacíficas em εἰρήνην ἄξειν.
- source_word: λαβόντες δεξιάς
  choice: depois de darem as mãos direitas
  rationale: Conserva a imagem concreta do gesto mútuo de compromisso sem explicitar no texto principal um sentido jurídico mais específico que o grego.
- source_word: εἰς τὰς σκηνὰς ἐχωρίσθησαν
  choice: cada grupo voltou para suas tendas
  rationale: Comunica a separação das duas partes em direção às respectivas tendas; 'cada grupo' esclarece o sujeito plural sem alterar o sentido contextual.
theological_decisions:
- issue: Sentido diplomático de λαβόντες δεξιάς
  choice: Manter no texto a imagem literal de dar as mãos direitas
  alternative: Traduzir de forma idiomática como “firmaram um pacto” ou “deram garantias mútuas”
  rationale: A imagem histórica é textualmente relevante e não exige que se atribua ao gesto uma categoria jurídica mais específica do que a permitida pelo grego.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A conjunção adversativa foi vertida por “porém”; o período foi dividido para maior fluidez. A expressão concreta do acordo foi preservada no texto e explicada brevemente em nota.
