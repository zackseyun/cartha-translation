  text: After these agreements had been made[a], Lysias went away to the king[b], but the Jews occupied themselves with farming.
translation:
  language: pt
  text: Depois de concluídos esses acordos[a], Lísias partiu para junto do rei, enquanto os judeus se dedicavam à agricultura[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois de firmados esses acordos”. O particípio grego destaca que os acordos já haviam sido efetivados.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “ocupavam-se com a agricultura”; a expressão grega significa que estavam envolvidos no trabalho agrícola.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένων
  choice: depois de concluídos
  rationale: O particípio aoristo em construção absoluta indica uma ação já completada antes dos verbos principais; com «acordos», «concluídos» expressa naturalmente sua efetivação.
- source_word: συνθηκῶν
  choice: acordos
  rationale: O termo designa acordos ou pactos. «Acordos» é amplo e natural, sem a formalidade possivelmente excessiva de «tratados» nem a carga teológica de «alianças».
- source_word: ἀπῆε
  choice: partiu
  rationale: O verbo narrativo indica afastamento ou partida. «Partiu» é corrente, conciso e preserva esse movimento.
- source_word: πρὸς τὸν βασιλέα
  choice: para junto do rei
  rationale: πρός com acusativo indica direção a uma pessoa. A formulação conserva essa direção sem acrescentar que Lísias «voltou», algo apenas inferível pelo contexto.
- source_word: περὶ τὴν γεωργίαν ἐγίνοντο
  choice: se dedicavam à agricultura
  rationale: A expressão idiomática comunica envolvimento em trabalho agrícola. A tradução natural evita reproduzir de modo rígido o sentido literal de «estavam em torno da agricultura».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. «Enquanto» expressa com fluidez o contraste entre a partida de Lísias e a retomada das atividades agrícolas pelos judeus.
