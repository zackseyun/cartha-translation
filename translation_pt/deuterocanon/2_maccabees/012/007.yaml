  yaml_path: translation/deuterocanon/2_maccabees/012/007.yaml
  text: But when the place had been closed up[a], he withdrew, intending to come again and root out the entire citizen body of the people of Joppa.
translation:
  language: pt
  text: Mas, quando o lugar foi fechado, ele se retirou, pretendendo voltar e arrancar pela raiz toda a comunidade cívica[a] de Jope.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todo o corpo de cidadãos de Jope”. O termo grego pode designar a comunidade política, o corpo de cidadãos ou a coletividade cívica.
    reason: alternativa lexical
lexical_decisions:
- source_word: τοῦ ... χωρίου
  choice: o lugar
  rationale: χωρίον pode indicar um lugar, uma área ou uma localidade. A opção neutra evita especificar, sem base suficiente, se se tratava de um distrito ou de uma fortificação.
- source_word: συγκλεισθέντος
  choice: foi fechado
  rationale: O particípio aoristo passivo de συγκλείω expressa que o lugar foi fechado ou encerrado. A tradução mantém a voz passiva e não define o mecanismo militar exato.
- source_word: ἀνέλυσεν
  choice: ele se retirou
  rationale: Em narrativa, ἀναλύω pode significar partir ou levantar acampamento. “Retirou-se” convém ao contexto militar e à intenção explícita de retornar.
- source_word: πάλιν ἥξων
  choice: com a intenção de voltar
  rationale: O particípio futuro comunica propósito ou intenção; a formulação explicita essa nuance em português natural.
- source_word: ἐκριζῶσαι
  choice: arrancar pela raiz
  rationale: ἐκριζόω significa literalmente arrancar pela raiz e, figuradamente, eliminar por completo. A expressão conserva tanto a metáfora quanto a severidade da ação pretendida.
- source_word: τὸ σύμπαν ... πολίτευμα
  choice: toda a comunidade cívica
  rationale: πολίτευμα designa uma coletividade cívica ou política organizada, e não apenas indivíduos isolados; σύμπαν ressalta sua totalidade. “Comunidade cívica” preserva o sentido corporativo sem restringi-lo somente ao governo.
- source_word: τῶν Ἰοππιτῶν
  choice: dos habitantes de Jope
  rationale: Ἰοππῖται designa os habitantes ou cidadãos de Jope. A forma escolhida é clara e natural para leitores modernos.
theological_decisions:
- issue: Severidade e alcance da ação pretendida contra Jope
  choice: “arrancar pela raiz toda a comunidade cívica dos habitantes de Jope”
  alternative: “destruir todos os habitantes de Jope” ou “eliminar todo o governo de Jope”
  rationale: O grego enfoca πολίτευμα, uma coletividade cívico-política, qualificada por τὸ σύμπαν. A tradução preserva o alcance corporativo e a linguagem severa sem reduzi-la apenas às autoridades nem afirmar de modo inequívoco cada indivíduo da população.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção explicita naturalmente a intenção expressa pelo particípio futuro e preserva a metáfora de ἐκριζόω. O marcador foi colocado junto à expressão que a nota esclarece.
