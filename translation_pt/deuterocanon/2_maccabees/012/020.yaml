  yaml_path: translation/deuterocanon/2_maccabees/012/020.yaml
  text: But Maccabeus[a], after arranging the troops around him in companies, stationed them over against the companies; and they charged against Timothy, who had around him twelve myriads of foot soldiers, two thousand horsemen[b], and besides these seven thousand more.
translation:
  language: pt
  text: Mas Macabeu, depois de organizar em companhias o exército que estava com ele, posicionou seus homens diante das companhias. E avançaram contra Timóteo, que tinha consigo doze miríades de soldados de infantaria[a], dois mil cavaleiros e, além desses, outros sete mil[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, 120.000 soldados de infantaria.
    reason: Esclarece o valor numérico de «doze miríades» sem substituir a expressão grega no texto principal.
  - marker: b
    text: 'A frase final é condensada no grego: «e, além dos sete mil». Não se especifica a que tipo de tropa pertenciam esses sete mil adicionais.'
    reason: Preserva a elipse e a ambiguidade do texto grego, evitando identificar sem base os soldados adicionais.
lexical_decisions:
- source_word: διατάξας
  choice: depois de organizar
  rationale: O particípio aoristo indica uma ação preparatória anterior ao avanço; a formulação é natural e mantém a sequência.
- source_word: τὴν περὶ αὐτὸν στρατιὰν
  choice: o exército que estava com ele
  rationale: Expressa de modo idiomático a força militar reunida em torno de Macabeu.
- source_word: σπειρηδόν
  choice: em companhias
  rationale: Preserva a organização por unidades militares sem impor o termo técnico romano “coortes”.
- source_word: κατέστησεν αὐτοὺς ἐπὶ τῶν σπειρῶν
  choice: posicionou seus homens diante das companhias inimigas
  rationale: A expressão grega é condensada; no contexto de batalha, indica o posicionamento das tropas em confronto com as formações adversárias. “Inimigas” explicita o referente contextual, não uma informação independente.
- source_word: ὥρμησαν
  choice: avançaram contra
  rationale: Comunica o movimento ofensivo vigoroso sem especificar além do que o verbo exige se foi uma carga formal.
- source_word: μυριάδας δώδεκα πεζῶν
  choice: doze miríades de soldados de infantaria
  rationale: Mantém a forma numérica grega e sua possível tonalidade literária, fornecendo o equivalente aritmético em nota.
- source_word: ἱππεῖς δὲ δισχιλίους
  choice: dois mil cavaleiros
  rationale: Tradução clara e direta para tropas montadas.
- source_word: καὶ πρὸς τοῖς ἑπτακισχιλίοις
  choice: e, além desses, outros sete mil
  rationale: πρός com dativo tem sentido aditivo. Como o substantivo referente aos sete mil está elíptico, a tradução não determina que tipo de tropa eram.
