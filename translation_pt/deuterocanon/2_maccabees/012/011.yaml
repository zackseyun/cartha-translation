  yaml_path: translation/deuterocanon/2_maccabees/012/011.yaml
  text: And when a fierce battle had taken place[a], and those with Judas had prevailed because of the help from God, the nomads, having been weakened, asked Judas to give them his right hand[b], promising both to provide pasture and to be useful to them in the future.
translation:
  language: pt
  text: Depois de uma batalha renhida, os homens que estavam com Judas foram bem-sucedidos graças à ajuda vinda de Deus. Enfraquecidos, os nômades pediram a Judas que lhes desse a mão direita[a], prometendo dar-lhes gado e ajudá-los no futuro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dar a mão direita era um gesto de acordo, usado para selar a paz ou uma aliança.
    reason: cultural_note
  - marker: b
    text: A redação grega no fim do versículo é comprimida e gramaticalmente irregular; o sentido provável é que os nômades prometeram gado e ajuda futura ao grupo de Judas.
    reason: textual_note
lexical_decisions:
- source_word: καρτερᾶς μάχης
  choice: uma batalha renhida
  rationale: Expressa a intensidade e a dureza do combate em português natural, sem sugerir uma duração não declarada.
- source_word: τῶν περὶ τὸν Ἰούδαν
  choice: os homens que estavam com Judas
  rationale: Reproduz o sentido idiomático do grupo ou das forças ligadas a Judas sem especificar uma organização militar além do texto.
- source_word: διὰ τὴν παρὰ τοῦ θεοῦ βοήθειαν
  choice: graças à ajuda vinda de Deus
  rationale: Preserva tanto a relação causal quanto a procedência divina explicitada por παρά.
- source_word: εὐημερησάντων
  choice: foram bem-sucedidos
  rationale: No contexto da batalha, indica êxito sem ampliar o sentido para uma vitória total ou definitiva.
- source_word: ἐλαττωθέντες
  choice: enfraquecidos
  rationale: Mantém a ideia de terem sido reduzidos em força, sem afirmar categoricamente que foram derrotados.
- source_word: οἱ νομάδες
  choice: os nômades
  rationale: Trata o termo como designação descritiva de um povo de modo de vida nômade, não como nome próprio.
- source_word: δοῦναι ... δεξιὰν
  choice: desse a mão direita
  rationale: Conserva a imagem cultural do grego; uma nota explica que se trata de um gesto de paz ou aliança.
- source_word: βοσκήματα δώσειν
  choice: dar-lhes gado
  rationale: O plural βοσκήματα denota animais criados ou apascentados, isto é, gado; esta tradução segue mais diretamente o valor lexical do substantivo grego.
- source_word: ἐν τοῖς λοιποῖς
  choice: no futuro
  rationale: No contexto da promessa, comunica naturalmente a ideia de relações ou necessidades posteriores.
- source_word: ὠφέλησεν αὐτούς
  choice: ajudá-los
  rationale: Expressa o sentido geral de beneficiar ou prestar auxílio, enquanto a nota registra a forma comprimida e irregular do texto transmitido.
theological_decisions:
- issue: Atribuição do êxito militar à ação divina
  choice: graças à ajuda vinda de Deus
  alternative: por terem recebido ajuda de Deus
  rationale: O grego atribui explicitamente o êxito do grupo de Judas à ajuda procedente de Deus; a tradução mantém essa afirmação sem intensificá-la para uma intervenção descrita em termos mais específicos.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A divisão em duas frases evita uma construção excessivamente pesada, sem alterar a sequência narrativa. A expressão cultural da mão direita é preservada no texto e esclarecida em nota.
