revisions:
- from: Mas certo Dositeu, um dos homens de Bacinor, homem forte e montado, agarrou Górgias e, segurando-o pela capa, arrastava-o com força, pretendendo capturar vivo aquele maldito. Então um dos cavaleiros trácios avançou contra Dositeu e lhe decepou o ombro[a]; assim, Górgias escapou para Marisa.
  to: Mas certo Dositeu, um dos homens de Bacinor, homem montado e forte, tinha Górgias em seu poder; e, agarrando sua capa, arrastava-o vigorosamente, querendo capturar vivo aquele maldito. Quando um dos cavaleiros trácios investiu contra Dositeu e decepou-lhe o ombro[a], Górgias escapou para Marisa.
  rationale: A revisão melhora a correspondência aspectual de εἶχεν, torna explícito que o ataque do trácio foi contra Dositeu e ajusta a ligação temporal dos acontecimentos, sem alterar o sentido nem resolver além do necessário a incerteza anatômica de τὸν ὦμον καθελόντος.
