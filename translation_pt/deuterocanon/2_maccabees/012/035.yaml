  text: But a certain Dositheus[a], one of Bacenor’s men, a horseman and a strong man, had hold of Gorgias; and seizing his cloak, he was dragging him along forcefully, intending to take the accursed man alive, when one of the Thracian horsemen rushed upon him and cut off his shoulder, and Gorgias escaped to Marisa.
translation:
  language: pt
  text: Mas certo Dositeu, um dos homens de Bacinor, homem montado e forte, tinha Górgias em seu poder; e, agarrando sua capa, arrastava-o vigorosamente, querendo capturar vivo aquele maldito. Quando um dos cavaleiros trácios investiu contra Dositeu e decepou-lhe o ombro[a], Górgias escapou para Marisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “atingiu-lhe gravemente o ombro” ou “inutilizou-lhe o ombro”. O grego descreve um golpe devastador na região do ombro, mas o resultado anatômico exato não é inteiramente claro.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δωσίθεος
  choice: Dositeu
  rationale: Forma portuguesa tradicional e reconhecível do nome grego.
- source_word: τῶν τοῦ Βακινόρος
  choice: um dos homens de Bacinor
  rationale: Expressa naturalmente a vinculação de Dositeu ao grupo de Bacinor sem especificar uma patente não indicada no grego.
- source_word: ἔφιππος ἀνὴρ καὶ καρτερός
  choice: homem forte e montado
  rationale: Preserva tanto a condição de combatente a cavalo quanto a força física ressaltada no contexto.
- source_word: εἶχεν τοῦ Γοργίου
  choice: agarrou Górgias
  rationale: O contexto indica que Dositeu havia prendido fisicamente Górgias; esta formulação é direta e natural em português.
- source_word: λαβόμενος τῆς χλαμύδος
  choice: segurando-o pela capa
  rationale: χλαμύς designa uma capa, muitas vezes militar; a tradução mantém o objeto concreto sem sobrecarregar o texto.
- source_word: ἦγεν αὐτὸν εὐρώστως
  choice: arrastava-o com força
  rationale: No contexto de combate e de apreensão pela capa, ἦγεν descreve condução forçada, e εὐρώστως reforça o vigor da ação.
- source_word: βουλόμενον τὸν κατάρατον λαβεῖν ζωγρείαν
  choice: pretendendo capturar vivo aquele maldito
  rationale: Mantém a intenção de Dositeu, a captura com vida expressa por ζωγρείαν e o insulto hostil κατάρατον.
- source_word: τῶν ἱππέων τινὸς Θρακῶν
  choice: um dos cavaleiros trácios
  rationale: Tradução clara da referência a um integrante da cavalaria trácia.
- source_word: ἐπενεχθέντος αὐτῷ
  choice: avançou contra Dositeu
  rationale: Comunica o movimento hostil súbito e explicita o referente do pronome para evitar ambiguidade indevida em português.
- source_word: τὸν ὦμον καθελόντος
  choice: lhe decepou o ombro
  rationale: Conserva a violência e a provável ideia de separação ou destruição causada pelo golpe, enquanto a nota registra a incerteza anatômica e lexical.
- source_word: διέφυγεν Γοργίας εἰς Μαρισά
  choice: Górgias escapou para Marisa
  rationale: Reproduz diretamente o desfecho e o destino da fuga.
