  text: And after taking up a collection man by man[a], he sent two thousand silver drachmas to Jerusalem to provide a sin offering, acting very well and nobly, because he was reasoning about the resurrection.
translation:
  language: pt
  text: Depois de fazer uma coleta, homem por homem[a], enviou a Jerusalém duas mil dracmas de prata para que se oferecesse um sacrifício pelo pecado, agindo muito bem e nobremente, pois refletia sobre a ressurreição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio de uma contribuição individual”, “por cabeça” ou “segundo a lista dos homens”. A expressão grega é um tanto técnica e talvez indique uma quantia cobrada de cada homem.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατʼ ἀνδρολόγιον
  choice: de homem em homem
  rationale: Preserva o sentido distributivo da expressão técnica sem definir além do texto se houve coleta individual, taxa por cabeça ou cobrança segundo uma lista de homens.
- source_word: ποιησάμενος
  choice: Depois de fazer uma coleta
  rationale: O particípio indica uma ação anterior; no contexto monetário, “fazer uma coleta” exprime naturalmente a reunião dos fundos.
- source_word: ἀργυρίου δραχμὰς δισχιλίας
  choice: duas mil dracmas de prata
  rationale: Mantém tanto a quantia e a unidade monetária quanto a referência explícita à prata.
- source_word: προσαγαγεῖν
  choice: para que se oferecesse
  rationale: Expressa a finalidade do envio do dinheiro e preserva o fato de que Judas providenciou que o sacrifício fosse apresentado, sem afirmar que ele próprio o ofereceu.
- source_word: περὶ ἁμαρτίας θυσίαν
  choice: um sacrifício pelo pecado
  rationale: É uma formulação sacrificial clara e natural em português, sem acrescentar uma especificação ausente do grego.
- source_word: πάνυ καλῶς καὶ ἀστείως πράττων
  choice: Agiu muito bem e nobremente
  rationale: Reproduz a forte avaliação positiva do narrador; “nobremente” comunica aqui a ideia de conduta elevada e apropriada.
- source_word: ὑπὲρ ἀναστάσεως διαλογιζόμενος
  choice: pois levava em conta a ressurreição
  rationale: Mantém a relação causal e a ideia de consideração refletida, em português corrente e digno.
theological_decisions:
- issue: Aprovação autoral do envio de dinheiro para um sacrifício pelo pecado relacionado aos mortos
  choice: 'Conservar a aprovação explícita: “Agiu muito bem e nobremente”.'
  alternative: Empregar uma descrição neutra que atenue o juízo moral do narrador.
  rationale: πάνυ καλῶς καὶ ἀστείως é inequivocamente elogioso. A tradução não deve reduzir essa tensão teológica por razões confessionais.
- issue: Sentido de ἀνάστασις
  choice: “a ressurreição”
  alternative: “a ressurreição dos mortos”
  rationale: O substantivo grego não traz complemento expresso. O contexto esclarece a referência, mas a tradução evita acrescentá-lo ao texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva a terminologia monetária antiga, a aprovação enfática do narrador e a ambiguidade administrativa de κατʼ ἀνδρολόγιον.
