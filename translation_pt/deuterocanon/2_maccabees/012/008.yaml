lexical_decisions:
- source_word: μεταλαβὼν
  choice: ocupando-se também
  rationale: O particípio introduz outro grupo como alvo da atuação de Judas. A expressão portuguesa preserva a transição sem especificar indevidamente se ele os atacou, enfrentou ou apenas voltou sua atenção para eles.
- source_word: τοὺς ἐν Ἰαμνίᾳ
  choice: dos que estavam em Jâmnia
  rationale: Mantém amplo o referente do artigo seguido da expressão locativa, sem acrescentar que se tratava de todos os habitantes da cidade.
- source_word: τὸν αὐτὸν ... τρόπον
  choice: o mesmo
  rationale: Em português, o objeto elíptico é recuperável pelo contexto. A formulação preserva a concisão e a continuidade sintática do grego.
- source_word: ἐπιτελεῖν
  choice: fazer
  rationale: No contexto, o verbo indica levar a efeito a mesma conduta hostil. “Fazer” é natural e evita explicitar um plano ou ataque além do que a construção afirma.
- source_word: βουλομένους
  choice: queriam
  rationale: Expressa a vontade ou intenção contemporânea do grupo em linguagem corrente, sem converter necessariamente o desejo em plano já definido.
- source_word: τοῖς κατοικοῦσιν Ἰουδαίοις
  choice: contra os judeus que ali moravam
  rationale: A preposição “contra” explicita a direção hostil indicada pelo contexto, enquanto “que ali moravam” traduz naturalmente o particípio κατοικοῦσιν.
