  yaml_path: translation/deuterocanon/2_maccabees/012/037.yaml
  text: Beginning the battle cry in the language of his fathers[a], with hymns[b], he shook those around Gorgias by surprise and put them to flight.
translation:
  language: pt
  text: Tendo iniciado, na língua de seus antepassados[a], o grito de guerra com hinos, ele surpreendeu os que estavam com Górgias e os pôs em fuga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na língua ancestral”. A expressão grega pode destacar a língua empregada ou o caráter ancestral do clamor.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “provocou a virada deles”; em contexto militar, a expressão indica retirada ou debandada.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταρξάμενος
  choice: Depois de iniciar
  rationale: O particípio aoristo médio apresenta a ação inicial que antecede as demais. A formulação mantém essa relação temporal de modo natural em português.
- source_word: τῇ πατρίῳ φωνῇ
  choice: na língua de seus antepassados
  rationale: πατρίῳ exprime caráter ancestral, e φωνή pode designar voz, fala ou língua. No contexto, a expressão provavelmente indica a língua ancestral em que o grito foi dado, sem excluir totalmente a nuance de um modo tradicional de clamar.
- source_word: τὴν μεθʼ ὕμνων κραυγήν
  choice: o grito de guerra acompanhado de hinos
  rationale: κραυγή é um clamor ou grito forte e, no contexto militar, admite naturalmente 'grito de guerra'. μεθʼ ὕμνων indica que o grito vinha acompanhado de hinos, preservando simultaneamente os elementos militar e religioso.
- source_word: ἐνσείσας
  choice: abalou
  rationale: O verbo significa literalmente sacudir ou abalar. A escolha conserva a imagem vívida e comunica a perturbação causada entre os inimigos.
- source_word: ἀπροσδοκήτως
  choice: de surpresa
  rationale: O advérbio indica que a ação ocorreu de maneira inesperada. 'De surpresa' transmite com naturalidade sua dimensão tática.
- source_word: τοῖς περὶ τὸν Γοργίαν
  choice: os que estavam com Górgias
  rationale: A expressão designa o grupo ou as tropas reunidas em torno de Górgias. Esta forma é clara e permanece próxima da construção grega.
- source_word: τροπὴν ἐποιήσατο αὐτῶν
  choice: os pôs em fuga
  rationale: τροπή, em contexto militar, designa a virada para fugir, a retirada ou a debandada. A locução portuguesa expressa com clareza o resultado militar.
theological_decisions:
- issue: Caráter religioso do grito de guerra
  choice: O texto apresenta um grito de guerra acompanhado de hinos.
  alternative: Um clamor de louvor ou um grito entoado como hino.
  rationale: A construção grega une κραυγή a μεθʼ ὕμνων. A tradução preserva tanto a ação militar quanto a expressão religiosa, sem transformar a cena em uma afirmação doutrinária além do que o texto diz.
- issue: Sentido de τῇ πατρίῳ φωνῇ
  choice: Referência principal à língua dos antepassados.
  alternative: Referência ao caráter ancestral ou tradicional do próprio grito.
  rationale: φωνή pode significar voz, fala ou língua, e πατρίῳ pode qualificar a forma ancestral da expressão. O contexto favorece a língua ancestral, mas a nota mantém visível a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. 'Antepassados' evita uma formulação excessivamente literal sem apagar a ideia ancestral; 'os que estavam com Górgias' conserva a estrutura coletiva do grego. As duas notas estão marcadas no texto principal.
