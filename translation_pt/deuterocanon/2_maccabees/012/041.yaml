lexical_decisions:
- source_word: εὐλογήσαντες
  choice: bendisseram
  rationale: O particípio aoristo é expresso por uma oração finita natural em português. “Bendisseram” conserva o sentido religioso de falar bem de Deus e louvá-lo.
- source_word: τὰ τοῦ δικαιοκρίτου κυρίου
  choice: os atos do Senhor, o justo Juiz
  rationale: A construção neutra plural com genitivo é elíptica, literalmente “as coisas do Senhor”. “Os atos” explicita com cautela o referente provável no contexto, enquanto a nota preserva a indeterminação do grego.
- source_word: δικαιοκρίτου
  choice: o justo Juiz
  rationale: O composto designa aquele que julga com justiça. “Justo Juiz” preserva a linguagem bíblica e a relação com o campo semântico da justiça.
- source_word: κυρίου
  choice: Senhor
  rationale: Aqui κύριος é um título divino; “Senhor” é a forma reverente e convencional em português.
- source_word: τὰ κεκρυμμένα
  choice: o que está oculto
  rationale: O particípio perfeito passivo substantivado refere-se coletivamente às coisas ocultas. O singular neutro idiomático em português mantém esse alcance sem sugerir apenas um objeto.
- source_word: φανερὰ ποιοῦντος
  choice: torna manifesto
  rationale: Preserva a construção causativa do grego, “fazer manifesto”, em linguagem clara e digna.
theological_decisions:
- issue: Sentido da expressão elíptica τὰ τοῦ δικαιοκρίτου κυρίου
  choice: os atos do Senhor, o justo Juiz
  alternative: o Senhor, o justo Juiz; ou, mais literalmente, as coisas do Senhor, o justo Juiz
  rationale: O artigo neutro plural exige algum conteúdo subentendido, mas não o especifica. “Atos” se ajusta ao contexto dos procedimentos justos de Deus, e a nota registra a ambiguidade real em vez de ocultá-la.
- issue: Tradução de κύριος como título divino
  choice: Senhor
  alternative: Soberano
  rationale: “Senhor” corresponde ao uso bíblico habitual e não introduz uma nuance alheia ao texto.
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A ordem da frase acompanha de perto o grego sem sacrificar a naturalidade.
