  yaml_path: translation/deuterocanon/2_maccabees/012/032.yaml
  text: But after the so-called Pentecost, they moved out against Gorgias, the governor of Idumea.
translation:
  language: pt
  text: Depois da festa chamada Pentecostes[a], marcharam contra Górgias, comandante da Idumeia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «a chamada Pentecostes».
    reason: lexical_alternative
  - marker: b
    text: Ou «governador da Idumeia». O termo grego pode designar uma autoridade militar ou civil.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ
  choice: Depois de
  rationale: A preposição tem sentido temporal e introduz o período posterior à festa.
- source_word: τὴν λεγομένην πεντηκοστήν
  choice: a festa chamada Pentecostes
  rationale: Explicita naturalmente que se trata da festa, preserva o sentido de λεγομένην sem a possível conotação cética de «a assim chamada» e mantém o nome tradicional «Pentecostes».
- source_word: ὥρμησαν
  choice: marcharam
  rationale: No contexto de uma campanha militar, comunica que o grupo se pôs em movimento de modo organizado, sem exigir a ideia mais forte de correr ou atacar impetuosamente.
- source_word: ἐπὶ Γοργίαν
  choice: contra Górgias
  rationale: Com um verbo de movimento militar, ἐπί seguido do acusativo indica aqui direção hostil.
- source_word: στρατηγόν
  choice: governador
  rationale: O termo pode designar tanto um chefe militar quanto uma autoridade regional; a construção «da Idumeia» favorece a função de governo territorial, embora a alternativa militar seja registrada em nota.
- source_word: Ἰδουμαίας
  choice: Idumeia
  rationale: É a forma portuguesa tradicional do topônimo grego Ἰδουμαία.
