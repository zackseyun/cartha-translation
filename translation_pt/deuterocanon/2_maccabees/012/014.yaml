base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/014.yaml
  text: But those inside[a], trusting in the strength of the walls and in the supply of provisions, treated Judas and his men more arrogantly, reviling them[b], and even blaspheming and speaking what is not lawful.
translation:
  language: pt
  text: 'Mas os que estavam lá dentro, confiando na solidez das muralhas e no estoque de provisões, tratavam Judas e os seus com ainda mais insolência: insultavam-nos, blasfemavam e diziam coisas que não era lícito dizer.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “diziam o que não se deve dizer”. A expressão grega pode indicar aquilo que não é permitido por razões morais ou religiosas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἔνδον
  choice: Mas os que estavam lá dentro
  rationale: A expressão é espacial e designa os defensores no interior da fortificação. A tradução evita acrescentar uma identificação não expressa no grego.
- source_word: πεποιθότες
  choice: confiando
  rationale: O particípio perfeito indica confiança já estabelecida e contínua nas defesas e nos mantimentos.
- source_word: τῇ τῶν τειχέων ἐρυμνότητι
  choice: na solidez das muralhas
  rationale: ἐρυμνότης comunica força defensiva ou segurança militar; “solidez” é natural em português e adequado ao contexto de cerco.
- source_word: τῇ τε τῶν βρωμάτων παραθέσει
  choice: e no estoque de provisões
  rationale: No contexto militar, βρώματα e παράθεσις apontam para alimentos armazenados ou disponíveis; “estoque de provisões” expressa isso com clareza.
- source_word: ἀναυθαγέστερον ἐχρῶντο
  choice: tratavam ... com ainda mais insolência
  rationale: Mantém o valor comparativo do advérbio e transmite comportamento arrogante, presunçoso e hostil.
- source_word: τοῖς περὶ τὸν Ἰούδαν
  choice: Judas e os seus
  rationale: O idioma grego designa Judas e o grupo que o acompanhava. “Os seus” é conciso, natural e não limita o grupo apenas a combatentes sem necessidade.
- source_word: λοιδοροῦντες
  choice: insultavam-nos
  rationale: O verbo indica injúria ou abuso verbal. “Insultavam” comunica diretamente essa força no português atual.
- source_word: βλασφημοῦντες
  choice: blasfemavam
  rationale: Preserva a possível dimensão religiosa e a progressão para além de simples insultos.
- source_word: λαλοῦντες ἃ μὴ θέμις
  choice: diziam coisas que não era lícito dizer
  rationale: θέμις se refere ao que é permitido, devido ou sancionado, inclusive em sentido moral ou religioso. A formulação conserva essa amplitude.
theological_decisions:
- issue: Força de βλασφημοῦντες em relação a λοιδοροῦντες
  choice: Manter “insultavam” e “blasfemavam” como ações distintas.
  alternative: Fundir ambos os termos em uma descrição geral de abuso verbal.
  rationale: A sequência grega intensifica a fala hostil e pode atribuir a βλασφημοῦντες um peso religioso. Preservar os dois verbos evita reduzir blasfêmia a mero insulto.
- issue: Natureza da proibição em ἃ μὴ θέμις
  choice: Traduzir por “coisas que não era lícito dizer”, sem especificar se a proibição era estritamente legal, moral ou religiosa.
  alternative: “coisas proibidas” ou “palavras ímpias”.
  rationale: O grego permite força moral e religiosa, mas não define aqui uma categoria única; a tradução conserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A coordenação final reproduz a acumulação retórica do grego sem tornar a frase excessivamente literal.
