lexical_decisions:
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Traduz diretamente o aoristo de ἐξέρχομαι, preservando o movimento narrativo sem acrescentar uma nuance militar não expressa pelo verbo.
- source_word: μετὰ
  choice: com
  rationale: A preposição indica acompanhamento; “com” é natural, claro e fiel.
- source_word: πεζῶν
  choice: soldados de infantaria
  rationale: No contraste militar com ἱππέων, o termo designa combatentes a pé. “Soldados de infantaria” é claro em português moderno e evita a ambiguidade de “homens a pé”.
- source_word: τρισχιλίων
  choice: três mil
  rationale: Tradução direta do numeral cardinal.
- source_word: ἱππέων
  choice: cavaleiros
  rationale: O substantivo designa homens montados, especialmente tropas de cavalaria; “cavaleiros” mantém a referência às pessoas, em paralelo com “soldados”.
- source_word: τετρακοσίων
  choice: quatrocentos
  rationale: Tradução direta do numeral cardinal.
