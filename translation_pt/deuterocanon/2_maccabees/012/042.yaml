  yaml_path: translation/deuterocanon/2_maccabees/012/042.yaml
  text: they turned to supplication[a], asking that the sin that had been committed might be completely blotted out. But the noble Judas urged the multitude to keep themselves free from sin, since they had seen before their eyes the things that had happened because of the sin of those who had fallen.
translation:
  language: pt
  text: Voltaram-se para a súplica, pedindo que o pecado cometido fosse completamente apagado. Mas o nobre Judas exortou a multidão a manter-se sem pecado[a], pois tinham visto diante dos próprios olhos o que acontecera por causa do pecado dos que haviam caído.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a conservar-se livre de pecado”.'
    reason: Registra uma alternativa idiomática para a expressão grega compacta que descreve a manutenção de uma condição sem pecado.
lexical_decisions:
- source_word: εἰς ἱκεσίαν ἐτράπησαν
  choice: Voltaram-se para a súplica
  rationale: Preserva o movimento expresso pelo idioma grego e o caráter solene e rogatório de ἱκεσία; “súplica” é mais específico que “oração”.
- source_word: ἀξιώσαντες
  choice: pedindo
  rationale: No contexto, o particípio introduz o conteúdo da petição. “Pedindo” é claro e natural, sem intensificar indevidamente o verbo.
- source_word: τὸ γεγονὸς ἁμάρτημα
  choice: o pecado cometido
  rationale: Expressa de modo idiomático o pecado como fato já consumado, conforme o particípio perfeito γεγονός.
- source_word: τελείως ἐξαλειφθῆναι
  choice: fosse completamente apagado
  rationale: “Apagado” conserva a imagem de ἐξαλείφω aplicada à remoção do pecado, e “completamente” representa τελείως.
- source_word: ὁ δὲ γενναῖος Ἰούδας
  choice: Mas o nobre Judas
  rationale: γενναῖος pode indicar nobreza ou valentia. “Nobre” mantém a caracterização honorífica sem restringi-la apenas à coragem militar.
- source_word: παρεκάλεσε τὸ πλῆθος
  choice: exortou a multidão
  rationale: Aqui παρακαλέω tem força exortativa, e “multidão” representa diretamente o coletivo τὸ πλῆθος.
- source_word: συντηρεῖν αὐτοὺς ἀναμαρτήτους εἶναι
  choice: a manter-se sem pecado
  rationale: Reproduz a exortação a conservar uma condição isenta de pecado, mantendo a formulação compacta do grego sem acrescentar uma noção explícita de perfeição absoluta.
- source_word: ὑπʼ ὄψιν ἑωρακότας
  choice: pois tinham visto diante dos próprios olhos
  rationale: Torna explícita a relação circunstancial do particípio e preserva a ênfase na experiência visual direta.
- source_word: τὰ γεγονότα
  choice: o que acontecera
  rationale: Tradução natural do particípio perfeito substantivado, referindo-se aos acontecimentos e às consequências já presenciadas.
- source_word: διὰ τὴν τῶν προπεπτωκότων ἁμαρτίαν
  choice: por causa do pecado dos que haviam caído
  rationale: Mantém a relação causal e o sentido contextual de προπίπτω para os que caíram em combate, sem confundi-lo com uma simples queda moral.
theological_decisions:
- issue: Alcance moral de ἀναμαρτήτους
  choice: sem pecado
  alternative: livres de pecado; sem cometer pecado
  rationale: “Sem pecado” traduz diretamente o adjetivo e preserva sua tensão, enquanto o contexto imediato indica uma exortação a evitar a transgressão que ocasionou a morte dos caídos. A tradução não acrescenta uma doutrina de impecabilidade absoluta nem reduz silenciosamente a força da expressão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se o tom solene de “súplica”, a imagem de o pecado ser “apagado” e a referência militar aos que “haviam caído”.
