  yaml_path: translation/deuterocanon/2_maccabees/012/036.yaml
  text: But those with Esdrin were fighting for a longer time and were exhausted[a], so Judas called on the Lord to appear as an ally and as the leader of the battle.
translation:
  language: pt
  text: Mas os homens que estavam com Ésdrin vinham lutando por mais tempo e estavam exaustos. Então Judas invocou o Senhor, pedindo que se manifestasse como aliado e como aquele que vai à frente na batalha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como aliado e como guia na batalha”. O grego προοδηγός pode destacar aquele que vai adiante para guiar.'
    reason: Alternativa lexical para προοδηγός, preservando tanto a ideia de guia quanto a de precedência.
lexical_decisions:
- source_word: τῶν δὲ περὶ τὸν Ἔσδριν
  choice: Mas os homens que estavam com Ésdrin
  rationale: A construção περὶ com nome pessoal designa o grupo ligado à pessoa. A formulação mantém essa associação sem atribuir a Ésdrin uma patente militar não expressa no grego.
- source_word: ἐπὶ πλεῖον μαχομένων
  choice: já lutavam havia mais tempo
  rationale: No contexto, ἐπὶ πλεῖον indica sobretudo a duração prolongada do combate, e o imperfeito perifrástico em português comunica sua continuidade.
- source_word: κατακόπων ὄντων
  choice: estavam exaustos
  rationale: κατάκοπος descreve quem ficou muito fatigado pelo esforço; “exaustos” transmite com clareza a força do termo.
- source_word: ἐπικαλεσάμενος
  choice: invocou
  rationale: Em contexto de oração dirigida a Deus, “invocou” exprime naturalmente o ato de chamar o Senhor em busca de auxílio.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: No contexto judaico grego, κύριος é a designação reverente de Deus; “Senhor” é a equivalência portuguesa tradicional e natural.
- source_word: σύμμαχον
  choice: como aliado
  rationale: σύμμαχος designa quem combate ao lado de alguém. “Aliado” conserva a nuance militar específica.
- source_word: φανῆναι
  choice: que se manifestasse
  rationale: A forma de φαίνω pede que Deus torne patente sua atuação, sem obrigar a leitura de uma aparição fisicamente visível.
- source_word: προοδηγὸν ... τοῦ πολέμου
  choice: como aquele que vai à frente na batalha
  rationale: προοδηγός é quem segue adiante para conduzir. A expressão explicita essa imagem e toma πόλεμος no sentido do combate imediato.
theological_decisions:
- issue: Tradução de κύριος na invocação dirigida a Deus
  choice: o Senhor
  alternative: o Soberano
  rationale: “Senhor” preserva a linguagem reverente do contexto judaico e não introduz uma interpretação denominacional.
- issue: Natureza da manifestação divina em φανῆναι
  choice: que se manifestasse como aliado
  alternative: que aparecesse como aliado
  rationale: “Se manifestasse” mantém aberta a questão de como o auxílio divino se tornaria evidente, sem afirmar nem excluir uma aparição visível.
- issue: Papel divino expresso por προοδηγός
  choice: aquele que vai à frente na batalha
  alternative: guia na batalha
  rationale: A formulação conserva a imagem de Deus indo adiante dos combatentes sem transformar necessariamente o termo em um título militar formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Havia mais tempo” comunica a duração do combate; “aquele que vai à frente” evita um tecnicismo e conserva a imagem concreta do grego.
