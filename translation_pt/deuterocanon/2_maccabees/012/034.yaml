  text: And when they had joined battle[b][a], it happened that a few of the Jews fell.
translation:
  language: pt
  text: Depois de entrarem em combate[a], aconteceu que poucos dos judeus caíram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais formalmente, “depois de se colocarem em formação de batalha”. O particípio grego é militar e pode enfatizar tanto a formação para a batalha como o início do combate.
    reason: lexical_alternative
