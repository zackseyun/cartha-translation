lexical_decisions:
- source_word: παραταξαμένους
  choice: depois de entrarem em combate
  rationale: O particípio aoristo médio de παρατάσσω tem sentido militar e pode indicar tanto formar a linha de batalha como travar combate. A formulação temporal é natural em português e mantém o contexto militar sem restringir o termo apenas à disposição das tropas.
- source_word: συνέβη
  choice: aconteceu
  rationale: Preserva a construção narrativa impessoal do grego em linguagem portuguesa atual.
- source_word: πεσεῖν
  choice: caíram
  rationale: Mantém o sentido literal e idiomático de πίπτω. No contexto de batalha, provavelmente implica morte, mas não explicita 'foram mortos', assim como o grego.
- source_word: ὀλίγους
  choice: alguns
  rationale: Expressa de modo natural o pequeno número indicado por ὀλίγους. A nota não é necessária, pois o contexto comunica que foram poucos.
- source_word: τῶν Ἰουδαίων
  choice: dos judeus
  rationale: Reproduz a construção partitiva e emprega a designação convencional e clara neste contexto.
