base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/040.yaml
  text: But under the tunic of each of the dead they found sacred tokens of the idols of Jamnia[a], which the law forbids the Jews to have[b]; and it became clear to all that for this reason these men had fallen.
translation:
  language: pt
  text: Mas, debaixo da túnica de cada um dos mortos, encontraram objetos sagrados dos ídolos de Jâmnia[a], cuja posse a Lei proíbe aos judeus; e ficou claro para todos que, por essa razão, aqueles homens tinham caído[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “objetos consagrados”, “ofertas votivas” ou, possivelmente, “amuletos” dos ídolos de Jâmnia.
    reason: lexical_alternative
  - marker: b
    text: “Tinham caído” é uma expressão de contexto militar que significa que tinham sido mortos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερώματα
  choice: objetos sagrados
  rationale: O termo designa objetos associados ao culto ou à devoção religiosa, sem determinar sua forma exata. A tradução evita especificá-los indevidamente como amuletos.
- source_word: χιτῶνας
  choice: túnica
  rationale: 'χίτων é uma veste, geralmente usada junto ao corpo. O singular acompanha a construção distributiva grega: a túnica de cada morto.'
- source_word: τῶν ἀπὸ Ἰαμνίας εἰδώλων
  choice: dos ídolos de Jâmnia
  rationale: Preserva de modo direto a associação dos objetos com os ídolos ligados à cidade de Jâmnia, sem decidir além do necessário se os objetos ou os ídolos procediam de lá.
- source_word: ἀπήργει
  choice: proíbe ... a posse
  rationale: O verbo expressa afastamento por proibição. A formulação portuguesa explicita de modo natural que os judeus eram proibidos de possuir esses objetos.
- source_word: πεπτωκέναι
  choice: tinham caído
  rationale: Mantém a imagem de πίπτω e o idioma militar do contexto, no qual cair significa morrer em combate.
- source_word: τούσδε
  choice: aqueles homens
  rationale: Torna explícito o referente humano do demonstrativo, isto é, os soldados mortos mencionados no início do versículo.
- source_word: διὰ τήνδε τὴν αἰτίαν
  choice: por essa razão
  rationale: Expressa naturalmente a relação causal afirmada no grego.
theological_decisions:
- issue: Relação causal entre os objetos idolátricos e a morte dos soldados
  choice: O texto afirma que ficou claro para todos que os homens tinham caído por essa razão.
  alternative: Apresentar a relação apenas como uma opinião possível da comunidade.
  rationale: A construção grega declara que isso se tornou evidente para todos. A tradução conserva essa inferência causal sem acrescentar uma explicação teológica nem definir de que modo a transgressão ocasionou a morte.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Lei” recebe inicial maiúscula por se referir à Lei judaica. A ordem foi levemente ajustada para fluência, preservando a progressão do achado, da proibição legal e da conclusão causal.
