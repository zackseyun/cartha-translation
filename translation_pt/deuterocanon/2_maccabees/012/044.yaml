  yaml_path: translation/deuterocanon/2_maccabees/012/044.yaml
  text: For if he were not expecting those who had fallen to rise again[a], it would be excessive and foolish to pray for the dead.
translation:
  language: pt
  text: Pois, se ele não esperasse que os que haviam caído ressuscitassem[a], seria supérfluo e insensato orar pelos mortos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os que haviam morrido”; literalmente, “os que haviam caído”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προπεπτωκότας
  choice: os que haviam caído
  rationale: Preserva a imagem do particípio perfeito grego e, no contexto militar, designa naturalmente os que morreram em combate sem substituir a metáfora por uma explicação.
- source_word: ἀναστῆναι
  choice: ressuscitassem
  rationale: No contexto, o infinitivo refere-se à ressurreição. “Ressuscitassem” é claro e natural em português e não impõe uma forma passiva ausente do grego.
- source_word: προσεδόκα
  choice: esperasse
  rationale: Expressa a expectativa ou espera indicada pelo verbo, sem acrescentar a nuance afetiva de “ter esperança”.
- source_word: περισσὸν
  choice: supérfluo
  rationale: Comunica aquilo que é desnecessário ou excedente e mantém o valor próprio do termo sem antecipar a ideia mais interpretativa de “sem propósito”.
- source_word: ληρῶδες
  choice: insensato
  rationale: Transmite com dignidade e clareza a ideia de falta de sentido ou juízo presente no adjetivo grego.
- source_word: ὑπὲρ νεκρῶν
  choice: pelos mortos
  rationale: É a maneira idiomática de expressar em português a oração em favor dos mortos, correspondente a ὑπέρ com genitivo.
- source_word: εὔχεσθαι
  choice: orar
  rationale: No contexto, traduz diretamente a ação de dirigir oração, sem a tornar mais técnica ou elaborada.
theological_decisions:
- issue: A expectativa da ressurreição como fundamento da oração pelos mortos
  choice: 'Mantida como afirmação condicional: se ele não esperasse que os mortos em combate ressuscitassem, orar por eles seria supérfluo e insensato.'
  alternative: Explicitar “ressurreição corporal” ou interpretar a passagem à luz de doutrinas posteriores sobre o estado intermediário ou a purificação após a morte.
  rationale: O grego estabelece a relação lógica entre a expectativa da ressurreição e a oração pelos mortos, mas não desenvolve aqui tais formulações posteriores. A tradução preserva essa tensão sem acréscimos confessionais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Supérfluo e insensato” conserva os dois qualificativos gregos sem tornar a frase coloquial nem excessivamente interpretativa.
