  yaml_path: translation/deuterocanon/2_maccabees/012/024.yaml
  text: But Timothy himself[a], having fallen into the hands of those with Dositheus and Sosipater, begged with much cunning to be let go unharmed, because he had the parents of many of them, and of others their brothers[b], and it would happen that these would be disregarded.
translation:
  language: pt
  text: O próprio Timóteo, porém, caiu nas mãos de Dositeu, Sosípatro e seus homens. Então, com muita astúcia,[a] suplicou que o soltassem são e salvo, pois tinha em seu poder os pais de muitos deles e os irmãos de outros, e esses acabariam sendo tratados como se nada valessem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com muito ardil” ou “com muita manha”. Neste contexto, o grego γοητία provavelmente se refere a uma súplica astuta ou enganosa, e não a feitiçaria literal.
    reason: lexical_alternative
  - marker: b
    text: O grego é condensado. Timóteo argumenta que mantinha sob seu poder os pais de muitos daqueles homens e os irmãos de outros; o desfecho de sua súplica é expresso como resultando em que esses parentes fossem desconsiderados ou tratados sem consideração.
    reason: cultural_note
lexical_decisions:
- source_word: ἐμπεσὼν
  choice: caiu nas mãos de
  rationale: O particípio significa literalmente “tendo caído em/entre”, mas, neste contexto, indica que Timóteo ficou sob o poder do grupo adversário. A expressão portuguesa explicita naturalmente a captura implícita.
- source_word: τοῖς περὶ τὸν Δωσίθεον καὶ Σωσίπατρον
  choice: Dositeu, Sosípatro e seus homens
  rationale: A construção οἱ περὶ com acusativo pode incluir as pessoas nomeadas e seus associados. Esta formulação comunica com clareza o sentido coletivo.
- source_word: ἠξίου
  choice: suplicou
  rationale: Embora o verbo possa significar “pedia” ou “solicitava”, a situação de um prisioneiro procurando preservar a vida favorece “suplicou”, sem exceder o sentido contextual.
- source_word: μετὰ πολλῆς γοητίας
  choice: com muita astúcia
  rationale: γοητία pode designar engano, charlatanismo ou artifícios. Aqui se refere mais provavelmente a uma súplica manipuladora ou ardilosa, não a feitiçaria literal.
- source_word: ἐξαφεῖναι ὡς σῷον αὐτόν
  choice: que o soltassem são e salvo
  rationale: A expressão reúne a libertação e a preservação da integridade ou da vida de Timóteo. “São e salvo” é corrente, claro e mantém ambos os elementos.
- source_word: διὰ τὸ πλειόνων μὲν γονεῖς, ὧν δὲ ἀδελφοὺς ἔχειν
  choice: pois tinha em seu poder os pais de muitos deles e os irmãos de outros
  rationale: Neste contexto, ἔχειν indica posse ou controle sobre esses parentes, aparentemente como prisioneiros ou reféns. “Em seu poder” torna explícita essa força contextual sem afirmar mais do que o texto permite.
- source_word: ἀλογηθῆναι
  choice: ser tratados como se nada valessem
  rationale: O verbo passivo transmite a ideia de ser desconsiderado, não levado em conta ou estimado como nada. A formulação portuguesa preserva a força da ameaça implícita.
- source_word: συμβήσεται
  choice: acabariam sendo
  rationale: O futuro apresenta a consequência que Timóteo alega que ocorreria. A construção verbal escolhida é natural em português dentro da ameaça condicional implícita.
