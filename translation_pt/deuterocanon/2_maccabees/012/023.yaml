  text: But Judas pressed the pursuit more vigorously[a], and, striking down the wretches, he destroyed as many as three thousand men.
translation:
  language: pt
  text: Judas, porém, continuou a perseguição com mais vigor e, abatendo aqueles miseráveis, matou trinta mil homens.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego transmitido diz literalmente “três miríades de homens”, isto é, trinta mil. A cifra é difícil neste contexto; muitas traduções entendem que aqui se refere a três mil homens.
    reason: textual_variant
lexical_decisions:
- source_word: ἐποίει ... τὸν διωγμόν
  choice: intensificou a perseguição
  rationale: Expressa em português natural a ideia de conduzir e tornar mais enérgica a perseguição, em conjunto com εὐτονώτερον.
- source_word: εὐτονώτερον
  choice: intensificou
  rationale: O comparativo indica maior vigor ou intensidade; integrado ao verbo, evita uma formulação pesada como “fez a perseguição mais vigorosamente”.
- source_word: συνετίνων
  choice: abatendo
  rationale: No contexto militar, comunica golpes violentos que derrubam os adversários sem especificar uma arma não mencionada no grego.
- source_word: τοὺς ἀλιτηρίους
  choice: aqueles miseráveis
  rationale: Preserva o forte juízo pejorativo do narrador em linguagem atual, sem introduzir a conotação estritamente jurídica de “criminosos”.
- source_word: διέφθειρεν
  choice: matou
  rationale: Com homens como objeto em uma batalha, διαφθείρω tem o sentido contextual de matar; “matou” é direto e natural.
- source_word: εἰς μυριάδας τρεῖς ἀνδρῶν
  choice: até três miríades de homens
  rationale: O texto grego transmitido diz literalmente “três miríades de homens”, isto é, trinta mil. A tradução principal preserva essa evidência de alta confiança, enquanto a nota registra a dificuldade contextual e a interpretação alternativa de três mil.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A redação conserva a forte avaliação moral do narrador e mantém no texto principal o número efetivamente atestado no grego, sem ocultar a dificuldade textual.
