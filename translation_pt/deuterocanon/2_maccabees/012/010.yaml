  text: From there[a], after they had gone nine stadia, while making their march against Timotheus, Arabs fell upon him, no fewer than five thousand, and five hundred horsemen.
translation:
  language: pt
  text: Depois de partirem dali e percorrerem nove estádios, enquanto marchavam contra Timóteo, árabes — não menos de cinco mil homens, além de quinhentos cavaleiros — o atacaram[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz o pronome no singular, “o” (αὐτῷ). Alguns entendem que a referência abrange coletivamente as tropas de Judas e traduzem “os”, mas o texto-fonte aqui mantém o singular.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποστάντες
  choice: depois de partirem
  rationale: O particípio aoristo indica o afastamento do lugar anterior; “depois de partirem” expressa a sequência narrativa de modo natural.
- source_word: σταδίους ἐννέα
  choice: nove estádios
  rationale: Mantém a unidade antiga de distância dada pelo texto, sem introduzir uma conversão aproximada.
- source_word: ποιουμένων τὴν πορίαν
  choice: enquanto marchavam
  rationale: A construção descreve deslocamento em curso; “marchavam” corresponde ao contexto militar e soa natural em português.
- source_word: ἐπὶ τὸν Τιμόθεον
  choice: contra Timóteo
  rationale: Neste contexto militar, ἐπί com acusativo indica avanço hostil, não apenas movimento na direção de alguém.
- source_word: ἐπέβαλον
  choice: atacaram
  rationale: O verbo comunica uma investida hostil. “Atacaram” é claro, atual e evita a rigidez de uma tradução literal como “caíram sobre”.
- source_word: Ἄραβες
  choice: árabes
  rationale: É o etnônimo moderno e direto correspondente ao grego.
- source_word: αὐτῷ
  choice: o
  rationale: O pronome grego está no singular; a tradução o preserva, embora o contexto possa levar alguns tradutores a entender a referência coletivamente.
- source_word: οὐκ ἐλάττους τῶν πεντακισχιλίων
  choice: não menos de cinco mil homens
  rationale: Preserva a ideia de quantidade mínima. “Homens” explicita naturalmente os indivíduos contados sem alterar o total.
- source_word: ἱππεῖς δὲ πεντακόσιοι
  choice: além de quinhentos cavaleiros
  rationale: ἱππεῖς designa combatentes montados; “além de” apresenta com clareza o contingente adicional.
