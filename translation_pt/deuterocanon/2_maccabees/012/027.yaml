  yaml_path: translation/deuterocanon/2_maccabees/012/027.yaml
  text: But after the rout and destruction of these men[a], he marched also against Ephron, a fortified city, in which there were mixed multitudes; and strong young men, stationed before the walls, were fighting vigorously[b], while there were many stores of engines and missiles there.
translation:
  language: pt
  text: Depois da derrota e da destruição desses homens, ele também marchou contra Efrom, uma cidade fortificada. Nela havia multidões de diversas origens[a], e jovens robustos, postados diante das muralhas, resistiam vigorosamente. Havia ali também muitas reservas[b] de máquinas de guerra e projéteis.
  philosophy: optimal-equivalence
