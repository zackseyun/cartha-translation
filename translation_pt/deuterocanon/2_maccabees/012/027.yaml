  naturalness: O português é claro e de registro adequado. A revisão torna a abertura mais fiel sem prejudicar a fluência e usa “postados” como expressão militar natural.
  terminology: “Cidade fortificada”, “multidões de diversas origens”, “jovens robustos”, “máquinas de guerra” e “projéteis” são escolhas adequadas. “Efrom” é uma forma portuguesa estabelecida e pode ser mantida. A nota de “reservas” preserva a alternativa de sentido de παραθέσεις.
