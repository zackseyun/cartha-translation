  - marker: b
    text: 'Ou: “muitos estoques de máquinas de guerra e projéteis”. O termo grego pode indicar suprimentos militares acumulados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τροπὴν καὶ ἀπώλειαν
  choice: derrotar e destruir
  rationale: No contexto militar, a expressão descreve primeiro a derrota que põe o inimigo em fuga e depois sua destruição. A formulação verbal é natural em português e mantém a progressão dos dois substantivos gregos.
- source_word: ἐπεστράτευσεν καὶ ἐπὶ
  choice: marchou também contra
  rationale: O verbo indica empreender uma expedição militar contra um alvo; esta formulação preserva tanto o movimento militar quanto a hostilidade.
- source_word: Ἔφρων πόλιν ὀχυράν
  choice: Efrom, uma cidade fortificada
  rationale: ὀχυράν caracteriza a força defensiva da cidade. “Fortificada” é preciso e corrente; “Efrom” representa o nome grego Ἔφρων em forma portuguesa.
- source_word: πάμφυλα πλήθη
  choice: multidões de diversas origens
  rationale: πάμφυλα sugere uma população composta de pessoas de muitos povos, grupos ou linhagens. A escolha conserva esse caráter misto sem limitar o sentido a tribos específicas.
- source_word: νεανίαι δὲ ῥωμαλέοι
  choice: jovens robustos
  rationale: νεανίαι designa homens jovens, e ῥωμαλέοι salienta vigor físico. “Jovens robustos” transmite ambos de modo conciso.
- source_word: πρὸ τῶν τειχῶν καθεστῶτες
  choice: posicionados diante das muralhas
  rationale: O particípio sugere que os jovens haviam tomado ou recebido uma posição defensiva; “posicionados” expressa melhor esse sentido militar do que simplesmente “em pé”.
- source_word: εὐρώστως ἀπεμάχοντο
  choice: resistiam vigorosamente
  rationale: O imperfeito descreve resistência continuada, enquanto εὐρώστως acrescenta intensidade. “Resistiam vigorosamente” é natural e preserva a perspectiva defensiva do verbo.
- source_word: ὀργάνων καὶ βελῶν
  choice: máquinas de guerra e projéteis
  rationale: No contexto militar, ὄργανα são máquinas ou engenhos de guerra, e βέλη abrange objetos lançados ou disparados. “Projéteis” evita restringir indevidamente o termo a dardos ou flechas.
- source_word: πολλαὶ παραθέσεις
  choice: grandes estoques
  rationale: Aqui παραθέσεις provavelmente se refere a acúmulos ou reservas de equipamento militar. “Grandes estoques” comunica essa abundância com clareza, embora o substantivo também possa sugerir materiais reunidos ou dispostos.
