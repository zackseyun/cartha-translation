translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. O sujeito “Judas” foi explicitado a partir do contexto narrativo para evitar ambiguidade em português; o grego deste versículo traz apenas o verbo na terceira pessoa. Mantiveram-se o cenário militar, a resistência prolongada e a composição variada da população, sem acrescentar identificação étnica ou interpretação teológica.
