base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/003.yaml
  text: 'But the people of Joppa committed such a great act of impiety: they invited the Jews living among them to embark, with their wives and children, in the boats provided by them, as though there were no hostility toward them at all;'
translation:
  language: pt
  text: 'Mas os habitantes de Jope cometeram um ato de impiedade tão grave: convidaram os judeus que viviam entre eles a embarcar, com suas mulheres e seus filhos, nos barcos que eles mesmos haviam providenciado, como se não houvesse hostilidade alguma contra eles;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰοππῖται
  choice: os habitantes de Jope
  rationale: O gentílico cívico designa coletivamente a população de Jope; esta formulação é natural e clara em português moderno.
- source_word: τηλικοῦτο
  choice: tão grave
  rationale: Preserva a forte intensificação da magnitude do ato e combina de modo idiomático com «ato de impiedade».
- source_word: συνετελέσαντο
  choice: cometeram
  rationale: Com δυσσέβημα como objeto, o verbo indica realizar ou perpetrar uma ação condenável; «cometeram» é idiomático nesse contexto.
- source_word: δυσσέβημα
  choice: ato de impiedade
  rationale: Mantém o peso religioso e moral do substantivo, sem reduzi-lo a um delito genérico.
- source_word: παρακαλέσαντες
  choice: convidaram
  rationale: No contexto, descreve um convite feito sob falsa aparência de cordialidade; a formulação preserva essa cortesia enganosa.
- source_word: τοὺς ἐν ἑαυτοῖς οἰκοῦντας Ἰουδαίους
  choice: os judeus que viviam entre eles
  rationale: Expressa com clareza que esses judeus residiam no meio da comunidade de Jope.
- source_word: ἐμβῆναι
  choice: a embarcar
  rationale: É o verbo português preciso para entrar em embarcações, com registro corrente e digno.
- source_word: τὰ παρακατασταθέντα ὑπʼ αὐτῶν σκάφη
  choice: nos barcos que eles mesmos haviam providenciado
  rationale: σκάφη refere-se a barcos, e o particípio indica que foram disponibilizados ou preparados pelos próprios habitantes de Jope; «eles mesmos» torna explícita a ênfase contextual sem alterar o referente.
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: com suas mulheres e seus filhos
  rationale: Os possessivos naturalmente indicam que se trata das famílias dos judeus convidados; «mulheres» preserva a possibilidade lexical de esposas sem recorrer a uma explicitação excessiva.
- source_word: ὡς μηδεμίας ἐνεστώσης πρὸς αὐτοὺς δυσμενείας
  choice: como se não houvesse hostilidade alguma contra eles
  rationale: Reproduz a aparência enganosa introduzida por ὡς, a existência presente da hostilidade e a ênfase negativa de μηδεμίας.
theological_decisions:
- issue: Força moral e religiosa de δυσσέβημα
  choice: ato de impiedade
  alternative: ato perverso; ação ímpia
  rationale: «Impiedade» conserva a avaliação explicitamente religiosa e moral do texto sem introduzir categorias doutrinárias posteriores.
