base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/028.yaml
  text: But after calling on the Sovereign[a], who with judgments shatters the forces of the enemies, they took the city under their control[c][b], and struck down twenty-five thousand of those inside.
translation:
  language: pt
  text: Mas, depois de invocarem o Soberano[a], que, por atos de juízo[b], despedaça as forças dos inimigos, eles tomaram a cidade sob seu domínio[c] e abateram vinte e cinco mil dos que estavam lá dentro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Poderoso” ou “o Governante”, como título divino.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega traduzida por “por atos de juízo” contém uma forma incomum no texto transmitido; o sentido provável é que Deus despedaça os inimigos mediante atos de juízo.
    reason: textual_variant
  - marker: c
    text: Ou “capturaram a cidade”; literalmente, “tomaram a cidade sob a mão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσάμενοι
  choice: depois de invocarem
  rationale: O particípio aoristo indica que a invocação de Deus antecedeu a tomada da cidade; a formulação é natural e preserva a sequência narrativa.
- source_word: τὸν δυνάστην
  choice: o Soberano
  rationale: Como título divino, exprime poder e domínio sem introduzir um título mais específico que não consta do grego.
- source_word: μετὰ κρίτους
  choice: por atos de juízo
  rationale: A forma transmitida κρίτους é incomum. A tradução comunica cautelosamente o provável sentido judicial e a função instrumental da expressão.
- source_word: συντρίβοντα
  choice: despedaça
  rationale: O particípio presente descreve uma ação característica do Soberano e transmite a derrota violenta e completa dos inimigos.
- source_word: τὰς τῶν πολεμίων ὀλκάς
  choice: as forças dos inimigos
  rationale: Embora ὀλκάς seja lexical e textualmente difícil neste contexto, 'forças' oferece um sentido militar coerente sem reduzi-lo à ideia abstrata de força individual.
- source_word: ἔλαβον τὴν πόλιν ὑποχείριον
  choice: tomaram a cidade sob seu domínio
  rationale: Preserva tanto a tomada da cidade quanto a ideia de sujeição ao poder dos vencedores contida em ὑποχείριον.
- source_word: κατέστρωσαν
  choice: abateram
  rationale: No contexto militar, o verbo indica fazer cair ou matar em grande número; 'abateram' é grave, atual e conciso.
- source_word: τῶν ἔνδον
  choice: dos que estavam lá dentro
  rationale: Mantém a referência inclusiva e espacial sem acrescentar 'homens' ou identificar indevidamente todos como habitantes.
- source_word: εἰς μυριάδας δύο πεντακισχιλίους
  choice: vinte e cinco mil
  rationale: Expressa diretamente em português o total numérico indicado pelo grego.
theological_decisions:
- issue: Título divino τὸν δυνάστην
  choice: o Soberano
  alternative: o Poderoso; o Governante
  rationale: A escolha destaca o domínio e o poder de Deus, preservando o caráter titular da expressão sem importar terminologia confessional específica.
- issue: A ação divina expressa por μετὰ κρίτους
  choice: por atos de juízo
  alternative: com juízos; mediante juízos
  rationale: A tradução mantém a afirmação de que Deus derrota os inimigos por ações judiciais, ao mesmo tempo que uma nota registra a anomalia da forma grega transmitida.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A ordem foi ajustada para manter as notas junto às expressões correspondentes. Evitaram-se arcaísmos como “potentado” e explicitações não presentes no grego.
