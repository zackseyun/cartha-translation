  yaml_path: translation/deuterocanon/2_maccabees/012/025.yaml
  text: But when he had assured them at length that he would restore these men unharmed[b][a], they released him for the safety of their brothers.
translation:
  language: pt
  text: Mas, depois que ele lhes garantiu com muitas palavras[a] que devolveria esses homens ilesos, eles o soltaram em consideração à segurança de seus irmãos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “longamente”. Literalmente, “por meio de muitas palavras”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “o livramento” ou “a salvação”; neste contexto, o termo grego provavelmente se refere à preservação física.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστώσαντος
  choice: depois que ele lhes garantiu
  rationale: O particípio aoristo de πιστόω expressa aqui o ato de dar garantias ou tornar algo digno de crédito. A construção temporal reproduz naturalmente o genitivo absoluto.
- source_word: διὰ πλειόνων
  choice: com muitas palavras
  rationale: A expressão indica uma garantia dada mediante palavras numerosas ou explicações extensas. A tradução conserva a imagem do grego; a alternativa idiomática aparece em nota.
- source_word: τὸν ὁρισμὸν ἀποκαταστῆσαι
  choice: que devolveria
  rationale: ὁρισμός pode indicar determinação, condição fixada ou compromisso. No contexto, a oração infinitiva comunica o conteúdo concreto da garantia; a formulação evita uma expressão nominal pouco natural em português.
- source_word: τούτους ἀπημάντους
  choice: esses homens ilesos
  rationale: ἀπήμαντος significa livre de dano ou ferimento. O demonstrativo tem referente humano masculino no contexto, por isso se explicita 'homens'.
- source_word: ἀπέλυσαν αὐτόν
  choice: eles o soltaram
  rationale: ἀπολύω significa soltar, libertar ou deixar partir. 'Soltaram' é direto e natural nesta narrativa.
- source_word: ἕνεκα τῆς τῶν ἀδελφῶν σωτηρίας
  choice: para preservar a segurança de seus irmãos
  rationale: ἕνεκα introduz a finalidade ou o interesse que motivou a soltura, e σωτηρία designa aqui primordialmente a preservação física. 'Preservar' torna essa relação final natural em português sem atribuir ao termo um sentido exclusivamente teológico.
theological_decisions:
- issue: Sentido de σωτηρία em contexto militar
  choice: segurança
  alternative: salvação; livramento
  rationale: A situação trata da integridade e libertação de pessoas ameaçadas. 'Segurança' comunica o sentido contextual de preservação física, enquanto a nota mantém visível a amplitude lexical do termo.
- issue: Referente de ἀδελφῶν
  choice: seus irmãos
  alternative: os irmãos; seus compatriotas
  rationale: O substantivo grego é masculino plural e pode abranger irmãos, parentes ou membros do mesmo povo. O texto conserva a forma concreta 'irmãos' e não resolve além do necessário a relação exata.
- issue: Valor de ὁρισμός na garantia dada
  choice: expresso pela oração 'que devolveria'
  alternative: o compromisso de devolver; a determinação de devolver
  rationale: O termo pode denotar decisão, estipulação ou compromisso. A tradução comunica o conteúdo prometido sem impor uma classificação jurídica específica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluência brasileira. A ordem narrativa e a ambiguidade contextual de 'irmãos' foram preservadas; os dois marcadores aparecem no texto na ordem correspondente às notas.
