  text: Then he advanced against Carnion and Atargatis[b][a], and slaughtered twenty-five thousand men.
translation:
  language: pt
  text: Então avançou contra Cárnio e Atargátion[a] e massacrou vinte e cinco mil pessoas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “o santuário de Atárgatis”; Atargátion pode designar um santuário ligado à deusa Atárgatis, e não um segundo nome de lugar.
    reason: lexical_alternative
  - marker: b
    text: 'Em grego, literalmente: “duas miríades de corpos e cinco mil”, isto é, vinte e cinco mil mortos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξελθὼν
  choice: avançou
  rationale: O particípio significa literalmente “tendo saído”, mas, nesta narrativa militar, “avançou” expressa de modo natural o deslocamento para o ataque.
- source_word: ἐπὶ
  choice: contra
  rationale: Com um alvo e seguido de ação hostil, ἐπί indica aqui movimento dirigido contra esse alvo.
- source_word: τὸ Κάρνιον
  choice: Cárnio
  rationale: O topônimo é transliterado e adaptado à forma e à acentuação naturais em português.
- source_word: τὸ Ἀτεργάτιον
  choice: Atargátion
  rationale: A forma grega neutra é preservada como nome próprio transliterado; a possibilidade de designar o santuário de Atárgatis fica registrada em nota, sem ser imposta ao texto.
- source_word: κατέσφαξεν
  choice: massacrou
  rationale: O verbo descreve matança violenta em grande escala; “massacrou” preserva sua força melhor que o neutro “matou”.
- source_word: μυριάδας σωμάτων δύο πεντακισχιλίους
  choice: vinte e cinco mil pessoas
  rationale: A expressão numérica totaliza 25.000. Embora σωμάτων signifique literalmente “corpos”, aqui conta pessoas mortas; “pessoas” evita acrescentar ao grego uma especificação masculina.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção é concisa, como a narrativa grega; os nomes próprios recebem acentuação que orienta a pronúncia em português. As notas preservam tanto a incerteza sobre Atargátion quanto a formulação numérica incomum do original.
