  text: for if he was looking to the splendid reward laid up for those who have fallen asleep in godliness[a], the thought was holy and devout. Therefore he made atonement for the dead[b], so that they might be released from sin.
translation:
  language: pt
  text: pois, se ele tinha em vista a esplêndida recompensa reservada para os que adormeceram em piedade[a], santo e piedoso era esse pensamento. Por isso, realizou a expiação pelos mortos[b], para que fossem libertos do pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “a mais excelente dádiva reservada”; o termo grego εὐχαριστήριον é incomum aqui e pode ter o sentido de benefício ou recompensa reservada.
    reason: lexical_alternative
  - marker: b
    text: Ou “fez expiação” ou “fez propiciação” pelos mortos.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτε
  choice: pois, se
  rationale: Preserva a força condicional e explicativa da expressão no encadeamento com o contexto anterior, sem reduzi-la a uma afirmação puramente causal.
- source_word: ἐμβλέπων
  choice: tinha em vista
  rationale: Expressa atenção dirigida e consideração de uma realidade futura em português natural.
- source_word: τοῖς μετʼ εὐσεβίας κοιμωμένοις
  choice: os que adormeceram em piedade
  rationale: Mantém o eufemismo bíblico do sono para a morte e apresenta εὐσέβεια em linguagem religiosa clara e digna.
- source_word: κάλλιστον ἀποκείμενον εὐχαριστήριον
  choice: a esplêndida recompensa reservada
  rationale: κάλλιστον recebe força superlativa elogiosa; ἀποκείμενον indica algo guardado ou reservado. Embora εὐχαριστήριον seja incomum aqui e possa designar uma dádiva de gratidão, o contexto favorece recompensa ou benefício reservado.
- source_word: ὁσία καὶ εὐσεβὴς ἡ ἐπίνοια
  choice: santo e piedoso era esse pensamento
  rationale: Conserva os dois qualificativos religiosos e a amplitude de ἐπίνοια, que pode indicar pensamento ou intenção.
- source_word: ὅθεν
  choice: Por isso
  rationale: Marca de modo natural a inferência extraída da avaliação precedente.
- source_word: περὶ τῶν τεθνηκότων
  choice: pelos mortos
  rationale: Comunica o objeto ou os beneficiários do ato sem acrescentar uma teoria específica de substituição.
- source_word: τὸν ἐξιλασμόν
  choice: a expiação
  rationale: Termo português estabelecido para o ato de tratar ou remover o pecado, sem restringir o sentido a uma teoria particular; alternativas técnicas são registradas em nota.
- source_word: ἐποιήσατο
  choice: realizou
  rationale: Forma uma combinação idiomática com 'expiação' e preserva a realização deliberada do ato cultual.
- source_word: τῆς ἁμαρτίας ἀπολυθῆναι
  choice: para que fossem libertos do pecado
  rationale: Mantém a voz passiva e a finalidade ou resultado expresso pelo infinitivo, sem inserir uma elaboração doutrinária posterior.
theological_decisions:
- issue: Natureza do benefício pós-morte implicado pela expiação em favor dos mortos
  choice: Traduzir diretamente que a expiação foi realizada pelos mortos para que fossem libertos do pecado.
  alternative: Entender o ato apenas como memorial, ou desenvolvê-lo segundo uma doutrina posterior específica de purificação após a morte.
  rationale: O grego afirma explicitamente um ato de expiação referente aos mortos, orientado à libertação do pecado. A tradução conserva essa afirmação e sua tensão teológica sem impor sistemas doutrinários posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preserva o eufemismo bíblico “adormecer”, a condicionalidade de εἶτε e a formulação teologicamente tensa do benefício destinado aos mortos.
