  text: After giving thanks and urging them beforehand also in the future to be well-disposed toward the nation[a], they came to Jerusalem, as the feast of weeks was approaching.
translation:
  language: pt
  text: Depois de darem graças e de exortá-los de antemão a serem favoráveis ao povo dali em diante, chegaram a Jerusalém, quando se aproximava a Festa das Semanas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “Pentecostes”.
    reason: Informa o nome tradicional da Festa das Semanas sem substituir a expressão explícita do texto grego.
lexical_decisions:
- source_word: εὐχαριστήσαντες
  choice: depois de darem graças
  rationale: O particípio aoristo indica uma ação anterior à chegada. A expressão preserva a brevidade do grego sem especificar a quem ou por quê deram graças.
- source_word: προπαρακαλέσαντες
  choice: de os exortarem de antemão
  rationale: A tradução conserva tanto o sentido de exortar quanto a nuance temporal do prefixo προ-, entendida como uma exortação feita antes da partida.
- source_word: εἰς τὰ λοιπά
  choice: dali em diante
  rationale: Expressão idiomática voltada para o futuro; esta formulação é natural em português e mantém a ideia de conduta futura.
- source_word: πρὸς τὸ γένος
  choice: ao povo
  rationale: No contexto, γένος designa o povo judeu como coletividade étnica e nacional. “Povo” é claro e evita as conotações modernas de “raça”.
- source_word: εὐμενεῖς εἶναι
  choice: fossem favoráveis
  rationale: Expressa uma disposição benévola ou amistosa, sem acrescentar uma ação específica não declarada no texto.
- source_word: παρεγενήθησαν
  choice: chegaram
  rationale: Verbo narrativo comum para chegar a determinado lugar; “chegaram” é direto e natural.
- source_word: τῆς τῶν ἑβδομάδων ἑορτῆς
  choice: a Festa das Semanas
  rationale: Traduz diretamente o nome descritivo da festa judaica, em vez de substituí-lo pelo nome tradicional posterior “Pentecostes”.
- source_word: οὔσης ὑπογύου
  choice: quando se aproximava
  rationale: A oração absoluta indica a circunstância temporal, e ὑπόγυος comunica que a festa estava próxima ou iminente.
theological_decisions:
- issue: Nome da festa em τῆς τῶν ἑβδομάδων ἑορτῆς
  choice: Festa das Semanas
  alternative: Pentecostes
  rationale: O grego apresenta explicitamente o título descritivo da festa. A tradução principal o preserva, enquanto o nome tradicional é informado em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura participial foi convertida em oração temporal natural; manteve-se sem objeto explícito a ação de dar graças, enquanto “os” explicita apenas os destinatários já pressupostos pela exortação e pelo adjetivo plural grego.
