  yaml_path: translation/deuterocanon/2_maccabees/012/030.yaml
  text: And when the Jews who were settled there testified to the goodwill that the people of Scythopolis had toward them[a], and to their gentle treatment in times of misfortune,
translation:
  language: pt
  text: E, quando os judeus que moravam ali deram testemunho da boa vontade que os habitantes de Citópolis tinham para com eles e do tratamento amável que lhes dispensaram em tempos de adversidade,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «da recepção cordial que lhes deram»; a expressão grega fala literalmente de um encontro ou recepção amável.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπομαρτυρησάντων
  choice: deram testemunho
  rationale: O particípio aoristo introduz aquilo que os judeus locais atestaram; «deram testemunho» preserva o sentido de testemunhar ou confirmar.
- source_word: τῶν ἐκεῖ καθεστώτων Ἰουδαίων
  choice: os judeus que moravam ali
  rationale: A expressão se refere aos judeus estabelecidos e residentes naquele lugar; esta formulação é natural e clara em português atual.
- source_word: οἱ Σκυθοπολεῖται
  choice: os habitantes de Citópolis
  rationale: O gentílico grego designa os moradores da cidade; explicitar «habitantes de Citópolis» evita um gentílico pouco conhecido.
- source_word: εὔνοιαν
  choice: boa vontade
  rationale: Expressa uma disposição favorável e benevolente para com os judeus.
- source_word: ἐν τοῖς τῆς ἀτυχίας καιροῖς
  choice: em tempos de adversidade
  rationale: ἀτυχία indica infortúnio ou circunstâncias adversas, sem exigir a ideia mais forte de calamidade.
- source_word: ἥμερον ἀπάντησιν
  choice: tratamento amável
  rationale: Embora ἀπάντησις denote literalmente encontro ou recepção, no contexto a expressão descreve a maneira branda e amistosa como os habitantes lidaram com os judeus.
