base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/021.yaml
  text: But when Timothy learned of Judas’s advance[a], he sent the women and the rest of the baggage ahead to the place called Carnion, for the place was hard to besiege and difficult to approach because of the narrowness of all the surrounding terrain.
translation:
  language: pt
  text: Ao tomar conhecimento do avanço de Judas, Timóteo mandou adiante as mulheres e o restante da bagagem para o lugar chamado Cárnio, pois o local era difícil de sitiar e de alcançar, devido à estreiteza de toda a região ao redor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “devido à estreiteza de todos os lugares”, provavelmente em referência aos acessos apertados ao redor do local.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφοδον
  choice: avanço
  rationale: No contexto militar, indica a aproximação ou investida das forças de Judas. “Avanço” preserva esse sentido sem afirmar que o ataque propriamente dito já havia começado.
- source_word: μεταλαβὼν
  choice: ao tomar conhecimento
  rationale: Expressa de modo natural a ideia de receber informação ou ficar sabendo do movimento de Judas.
- source_word: προεξαπέστειλεν
  choice: mandou adiante
  rationale: Preserva a força do verbo composto, que indica enviar antecipadamente ou para a frente.
- source_word: ἀποσκευήν
  choice: bagagem
  rationale: Refere-se aos bens móveis, pertences ou equipamentos transportados com o grupo; “bagagem” se ajusta bem ao contexto imediato.
- source_word: τὸ λεγόμενον Κάρνιον
  choice: o lugar chamado Cárnio
  rationale: Traduz de modo claro a fórmula que introduz o nome do lugar, sem a conotação depreciativa que “o chamado” pode adquirir em português.
- source_word: δυσπολιόρκητον
  choice: difícil de sitiar
  rationale: Mantém o sentido militar preciso de um local que não é fácil de cercar e atacar mediante sítio.
- source_word: δυσπρόσιτον
  choice: difícil de alcançar
  rationale: Conserva a ideia concreta de acesso difícil sem exagerá-la como inacessibilidade absoluta.
- source_word: χωρίον
  choice: local
  rationale: Termo amplo e natural para a localidade, sem acrescentar a noção não explícita de fortaleza.
- source_word: διὰ τὴν πάντων τῶν τόπων στενότητα
  choice: devido à estreiteza de toda a região ao redor
  rationale: Comunica em português natural a configuração apertada do terreno circundante, mantendo em nota a formulação mais literal e sua possível referência aos acessos.
