lexical_decisions:
- source_word: ἀναζεύξαντές
  choice: levantaram acampamento
  rationale: O particípio descreve o ato de desfazer ou levantar o acampamento antes da partida; a expressão é natural em português e preserva o contexto de deslocamento.
- source_word: ὥρμησαν
  choice: partiram rumo a
  rationale: Neste relato de viagem, o verbo indica movimento decidido em direção a um destino, não necessariamente pressa ou ataque.
- source_word: ἐπὶ Σκυθῶν πόλιν
  choice: rumo à cidade dos citas
  rationale: Mantém a formulação descritiva do grego, em vez de substituí-la diretamente pelo topônimo provável, e entende ἐπί como direção neste contexto.
- source_word: ἀπέχουσαν
  choice: a ... de
  rationale: A construção concisa expressa de modo natural em português a distância da cidade em relação a Jerusalém.
- source_word: σταδίους ἑξακοσίους
  choice: seiscentos estádios
  rationale: Conserva a unidade antiga do texto-fonte sem introduzir uma conversão moderna aproximada no corpo do versículo.
