  text: And when they had taken the city by the will of God[a], they made an immeasurable slaughter, so that the nearby lake, having a width of two stadia, appeared to be overflowing[b], filled with blood.
translation:
  language: pt
  text: E, depois de tomarem a cidade pela vontade de Deus, realizaram matanças incontáveis, de modo que o lago próximo, com dois estádios[a] de largura, parecia derramar-se[b], cheio de sangue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O estádio era uma antiga unidade de comprimento; dois estádios correspondem a cerca de 370 metros.
    reason: cultural_note
  - marker: b
    text: 'Ou: “parecia estar fluindo, cheio de sangue”. O verbo grego pode descrever algo que corre ou se derrama; a imagem vívida apresenta o lago como cheio de sangue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαβόμενοι
  choice: depois de tomarem
  rationale: O particípio aoristo, em contexto militar, indica a tomada ou captura da cidade e estabelece uma ação anterior à matança.
- source_word: τῇ τοῦ θεοῦ θελήσει
  choice: pela vontade de Deus
  rationale: Preserva a atribuição explícita da tomada da cidade à vontade divina, sem ampliar a afirmação teológica do texto.
- source_word: ἀμυθήτους ... σφαγάς
  choice: matanças incontáveis
  rationale: Reproduz o plural grego e a ideia de mortes tão numerosas que não podem ser contadas ou relatadas, em português claro e vigoroso.
- source_word: παρακειμένην λίμνην
  choice: o lago próximo
  rationale: Expressa naturalmente que o lago ficava junto à cidade ou ao local da matança.
- source_word: τὸ πλάτος ἔχουσαν σταδίους δύο
  choice: com dois estádios de largura
  rationale: Mantém a antiga unidade de medida e transmite de modo conciso que a dimensão indicada é a largura.
- source_word: καταρρεῖν
  choice: transbordar
  rationale: Comunica em português a imagem vívida de água ou sangue correndo para fora; a nota registra a possibilidade de entender o verbo mais genericamente como correr ou fluir.
- source_word: τὸ αἷμα πεπληρωμένην φαίνεσθαι
  choice: parecia transbordar, cheio de sangue
  rationale: Preserva tanto a linguagem de aparência quanto o particípio que descreve o lago como cheio de sangue, sem apresentar a imagem hiperbólica como medição literal.
theological_decisions:
- issue: Atribuição da tomada da cidade à vontade divina
  choice: pela vontade de Deus
  alternative: segundo a vontade de Deus
  rationale: O dativo grego pode indicar meio ou conformidade. A formulação escolhida conserva a afirmação direta e sua tensão teológica, sem explicar se ela implica apenas permissão ou aprovação divina.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível ao leitor comum. “Matanças incontáveis” mantém a força hiperbólica e o plural do grego; “pela vontade de Deus” preserva, sem atenuação explicativa, a tensão teológica do original.
