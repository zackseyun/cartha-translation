  source_fidelity: A tomada da cidade, a atribuição à vontade de Deus, as matanças incalculáveis, a proximidade e a largura do lago são bem reproduzidas. Contudo, «transbordar» especifica um extravasamento que καταρρεῖν não exige; o verbo descreve mais diretamente correr, fluir ou derramar-se. A formulação revista preserva a imagem deliberadamente vívida e estranha de um lago cheio de sangue que parecia derramar-se.
  naturalness: O português é claro e de registro apropriado. «Parecia derramar-se, cheio de sangue» é uma construção imagética, mas é justificadamente marcada, pois acompanha a construção e a hipérbole do grego sem introduzir a noção mais específica de transbordamento.
  terminology: «Pela vontade de Deus», «matanças incontáveis», «lago próximo» e «estádios» são escolhas adequadas. A nota de medida é suficiente e o marcador permanece corretamente ligado a «estádios».
