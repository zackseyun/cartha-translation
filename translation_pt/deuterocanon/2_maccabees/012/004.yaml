  yaml_path: translation/deuterocanon/2_maccabees/012/004.yaml
  text: But after the common resolution of the city[a], and when these men had accepted it as though they wanted peace and had nothing suspicious in mind, they took them away and drowned them, no fewer than two hundred of them.
translation:
  language: pt
  text: Mas, depois da decisão coletiva da cidade e de esses homens a terem aceitado, como se desejassem viver em paz e não tivessem nada de suspeito[a], levaram-nos e os afogaram, não menos de duzentos deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “não tivessem intenções suspeitas”. A expressão grega pode indicar tanto que nada neles parecia suspeito quanto que não tinham propósito suspeito.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ κοινὸν τῆς πόλεως ψήφισμα
  choice: a decisão conjunta da cidade
  rationale: ψήφισμα designa uma decisão, resolução ou decreto formal. “Decisão conjunta” preserva tanto o caráter cívico quanto a participação coletiva expressa por κοινόν, sem sugerir um edito real.
- source_word: τούτων ἐπιδεξαμένων
  choice: quando esses homens a aceitaram
  rationale: O genitivo absoluto apresenta esses homens como os que aceitaram a decisão ou proposta da cidade. A formulação é natural em português e mantém a relação temporal.
- source_word: ὡς ἂν εἰρηνεύειν θέλοντων
  choice: como se quisessem viver em paz
  rationale: A construção ὡς ἄν indica aparência ou percepção, sem decidir se o desejo de paz era sincero ou apenas aparente.
- source_word: μηδὲν ὑπόπτον ἐχόντων
  choice: não tivessem nenhuma intenção suspeita
  rationale: A expressão pode apontar para a ausência aparente de propósito suspeito. A tradução principal é idiomática, enquanto a nota conserva a possível leitura passiva.
- source_word: ἀχθέντας
  choice: levaram-nos
  rationale: O particípio passivo de ἄγω indica que eles foram conduzidos ou levados. A voz ativa com sujeito indeterminado acompanha naturalmente o verbo principal em português.
- source_word: ἐβύθισαν
  choice: os afogaram
  rationale: βυθίζω significa fazer afundar ou submergir; aplicado a pessoas neste contexto, “afogaram” expressa claramente o resultado.
- source_word: ὄντας οὐκ ἔλαττον τῶν διακοσίων
  choice: em número não inferior a duzentos
  rationale: A expressão estabelece um limite mínimo e preserva com precisão a força de οὐκ ἔλαττον.
