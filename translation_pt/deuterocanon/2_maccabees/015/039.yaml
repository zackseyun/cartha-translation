  text: And if it is well written and suitably arranged[a], that is what I myself wanted; but if it is poorly and moderately done, this was what I could achieve.
translation:
  language: pt
  text: E, se ficou bem escrito e adequadamente organizado, era isso mesmo que eu queria; mas, se ficou pobre e apenas mediano[a], foi o que consegui fazer.
  philosophy: optimal-equivalence
  footnotes:
