base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/017.yaml
  text: And having been encouraged by the very noble words of Judas[a], which were able to stir them on to virtue and to make the souls of young men manly, they resolved not merely to make a campaign, but to press on bravely and, engaging with all courage, settle the matter[d][c][b], because the city and the holy things and the temple were also in danger.
translation:
  language: pt
  text: Encorajados pelas palavras tão nobres de Judas, capazes de incitá-los à virtude[a] e de tornar viris os ânimos dos jovens[b], eles resolveram não simplesmente sair em campanha[c], mas avançar com bravura e, entrando em combate com toda a coragem, resolver a questão, pois também estavam em perigo a cidade, as coisas santas e o templo[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à excelência” ou, neste contexto militar, “ao valor”. O grego ἀρετή pode ter sentido tanto moral quanto guerreiro.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “tornar viris as almas dos jovens”. O grego emprega uma imagem explicitamente masculina para comunicar coragem.
    reason: lexical_alternative
  - marker: c
    text: 'O sentido não é que decidiram deixar de lutar, mas que resolveram não apenas empreender uma campanha comum: pretendiam levar o conflito a um desfecho decisivo.'
    reason: alternative_reading
  - marker: d
    text: O grego distingue “as coisas santas” do “templo”; por isso, os dois elementos são mantidos separadamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακληθέντες
  choice: Encorajados
  rationale: No contexto do discurso que os fortalece para a batalha, exprime o efeito de παρακαλέω sem excluir seu tom de exortação.
- source_word: πάνυ καλοῖς
  choice: tão nobres
  rationale: Comunica a elevada qualidade moral e retórica das palavras de Judas de modo natural em português.
- source_word: δυναμένοις ἐπ' ἀρετὴν παρορμῆσαι
  choice: capazes de incitá-los à virtude
  rationale: Mantém a amplitude de ἀρετή, que pode abranger virtude, excelência e, neste contexto, valor guerreiro.
- source_word: ψυχὰς νέων ἐπανδρῶσαι
  choice: tornar viris os ânimos dos jovens
  rationale: Preserva a imagem masculina explícita de ἐπανδρόω, enquanto 'ânimos' expressa naturalmente ψυχαί no contexto de coragem.
- source_word: διέγνωσαν μὴ στρατεύεσθαι
  choice: resolveram não simplesmente sair em campanha
  rationale: O contraste com as ações seguintes mostra que não decidiram evitar o combate, mas ir além de uma simples campanha militar.
- source_word: γενναίως δὲ ἐφέρεσθαι
  choice: mas avançar com bravura
  rationale: Expressa tanto o movimento ativo quanto a coragem indicados pela locução grega.
- source_word: μετὰ πάσης εὐανδρείας
  choice: com toda a coragem
  rationale: Reproduz a força totalizante de πάσης e o sentido marcial de εὐανδρεία em português corrente; a imagem masculina já aparece na oração anterior.
- source_word: ἐμπλακέντες
  choice: entrando em combate
  rationale: No contexto militar, indica envolver-se diretamente no conflito.
- source_word: κρῖναι τὰ πράγματα
  choice: resolver a questão
  rationale: Expressa a intenção de levar o conflito a um desfecho decisivo sem impor detalhes ausentes do grego.
- source_word: τὴν πόλιν καὶ τὰ ἅγια καὶ τὸ ἱερὸν
  choice: a cidade, as coisas santas e o templo
  rationale: Mantém separados τὰ ἅγια e τὸ ἱερόν, conforme a enumeração do texto grego.
- source_word: κινδυνεύειν
  choice: estavam em perigo
  rationale: Traduz diretamente a ameaça que fundamentava a resolução dos combatentes.
theological_decisions:
- issue: Linguagem masculina de ψυχὰς νέων ἐπανδρῶσαι
  choice: tornar viris os ânimos dos jovens
  alternative: encher de coragem o ânimo dos jovens
  rationale: A formulação escolhida conserva a imagem masculina deliberada do grego, embora a alternativa seja mais neutra e idiomática.
- issue: Sentido de μὴ στρατεύεσθαι diante dos infinitivos seguintes
  choice: não simplesmente sair em campanha
  alternative: não sair em campanha
  rationale: Uma negação absoluta contradiria a resolução imediata de avançar e entrar em combate; o contraste exige o sentido de 'não apenas' ou 'não simplesmente'.
- issue: Distinção entre τὰ ἅγια e τὸ ἱερόν
  choice: as coisas santas e o templo
  alternative: o santuário
  rationale: A tradução evita fundir dois elementos que o grego enumera separadamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi suavizada sem apagar a retórica marcial, a imagem masculina do original nem a distinção entre os objetos sagrados e o templo.
