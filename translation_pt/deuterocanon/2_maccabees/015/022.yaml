base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/022.yaml
  text: 'And he spoke[a], calling upon him in this way: “You, Master, sent your angel in the time of Hezekiah king of Judea, and he struck down a hundred eighty-five thousand in the camp of Sennacherib.”'
translation:
  language: pt
  text: 'E ele dizia, invocando desta maneira: “Tu, Soberano, enviaste o teu anjo no tempo de Ezequias, rei da Judeia[a], e ele abateu cento e oitenta e cinco mil no acampamento de Senaqueribe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, “rei de Judá”. O grego traz “da Judeia” (Ἰουδαίας), mas a referência histórica é a Ezequias, rei de Judá.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: ele dizia
  rationale: O imperfeito grego apresenta a fala em andamento e introduz de modo natural o conteúdo da invocação.
- source_word: ἐπικαλούμενος
  choice: invocando
  rationale: O particípio descreve uma invocação dirigida a Deus; a forma portuguesa preserva o sentido religioso sem acrescentar um objeto que não está expresso no grego.
- source_word: τόνδε τὸν τρόπον
  choice: desta maneira
  rationale: Expressão idiomática que introduz as palavras exatas da oração.
- source_word: Σύ
  choice: Tu
  rationale: Mantém o pronome explícito e enfático do grego no início da oração.
- source_word: δέσποτα
  choice: Soberano
  rationale: Expressa autoridade absoluta e mantém δέσποτα distinto de κύριος; em português atual, funciona com dignidade como vocativo dirigido a Deus.
- source_word: ἀπέστειλας
  choice: enviaste
  rationale: Equivalente direto e natural do verbo no contexto da ação divina passada.
- source_word: τὸν ἄγγελόν σου
  choice: o teu anjo
  rationale: No contexto bíblico da intervenção contra o exército de Senaqueribe, ἄγγελος designa naturalmente um anjo.
- source_word: ἐπὶ Ἐζεκίου
  choice: no tempo de Ezequias
  rationale: No contexto histórico, ἐπί com genitivo situa a intervenção divina durante o reinado de Ezequias; evita a leitura enganosa de que o anjo teria sido enviado contra ele.
- source_word: τοῦ βασιλέως τῆς Ἰουδαίας
  choice: rei da Judeia
  rationale: Reproduz diretamente Ἰουδαίας no texto grego, enquanto uma nota registra a designação histórica alternativa 'Judá'.
- source_word: ἀνεῖλεν
  choice: abateu
  rationale: Comunica de forma clara e digna que o anjo matou os soldados, sem recorrer a linguagem arcaica.
- source_word: ἐκ τῆς παρεμβολῆς Σενναχηρείμ
  choice: no acampamento de Senaqueribe
  rationale: Embora ἐκ tenha sentido básico de origem ou procedência, a construção identifica os mortos como pertencentes ao acampamento; a formulação locativa é idiomática e inequívoca em português.
- source_word: εἰς ἑκατὸν ὀγδοήκοντα πέντε χιλιάδας
  choice: cento e oitenta e cinco mil
  rationale: Transmite naturalmente em português o total expresso pelo numeral grego.
theological_decisions:
- issue: Distinção entre δέσποτα e κύριος
  choice: Soberano
  alternative: Senhor; Mestre
  rationale: “Soberano” conserva a ideia de autoridade absoluta própria de δέσποτα e evita apagar a distinção lexical em relação a κύριος. “Mestre” poderia sugerir principalmente um professor, e “Senhor” confundiria os dois termos gregos.
- issue: Sentido de ἐπὶ Ἐζεκίου na intervenção do anjo
  choice: no tempo de Ezequias
  alternative: contra Ezequias; sobre Ezequias
  rationale: A alusão histórica apresenta Ezequias como o rei em cujo tempo ocorreu o livramento, não como alvo do anjo. A tradução temporal respeita o uso possível da preposição e evita contradição contextual.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A oração preserva a ênfase do pronome inicial e o tom solene sem arcaísmos.
