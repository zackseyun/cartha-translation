  text: But those around Judas joined battle with the enemies with invocation and prayers[a][b].
translation:
  language: pt
  text: Mas os que estavam com Judas entraram em combate com os inimigos, com invocação e orações[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “clamando a Deus e fazendo orações”. O grego diz “com invocação e orações”, sem declarar nesta oração a quem a invocação é dirigida.'
    reason: lexical_alternative
  - marker: b
    text: “Orações” também pode ser traduzido por “votos”, pois a palavra grega pode ter ambos os sentidos, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ περὶ τὸν Ἰούδαν
  choice: Mas os que estavam com Judas
  rationale: A construção περὶ com acusativo designa os associados a um líder. A formulação portuguesa é natural e evita explicitar além do grego que se tratava de “Judas e seus homens”.
- source_word: μετὰ ἐπικλήσεως
  choice: com invocação
  rationale: ἐπίκλησις indica invocação ou ato de clamar por auxílio, com sentido religioso neste contexto. “Invocação” preserva esse sentido sem acrescentar expressamente “a Deus”, objeto não declarado na oração grega.
- source_word: καὶ εὐχῶν
  choice: e orações
  rationale: εὐχή pode significar oração ou voto. Em combinação com ἐπίκλησις e no contexto da entrada em combate, “orações” expressa melhor a provável ideia de súplica, enquanto a alternativa “votos” é preservada em nota.
- source_word: συνῆψαν
  choice: entraram em combate
  rationale: No uso militar, συνάπτω significa travar ou iniciar combate. “Entraram em combate” é corrente, claro e conserva a força marcial do verbo.
- source_word: τοῖς πολεμίοις
  choice: com os inimigos
  rationale: O dativo indica a parte contra a qual se combate. Em português, “entrar em combate com os inimigos” transmite naturalmente essa relação adversativa.
theological_decisions:
- issue: Força religiosa de ἐπίκλησις no contexto da batalha
  choice: Manter a linguagem religiosa explícita como “invocação”
  alternative: “clamando a Deus” ou o genérico “apelo”
  rationale: O texto retrata o grupo de Judas entrando na batalha em atitude de dependência religiosa. Como esta oração grega não nomeia explicitamente Deus como objeto, a tradução não o insere no texto principal, embora esclareça essa leitura possível em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Os que estavam com Judas” verte o idioma grego sem a rigidez de “os que estavam ao redor de Judas”; “invocação” mantém deliberadamente a formulação religiosa e a ambiguidade do objeto.
