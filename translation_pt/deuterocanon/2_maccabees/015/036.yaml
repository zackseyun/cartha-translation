  text: And they all decreed by common vote that this day should by no means be left unmarked,[a]
translation:
  language: pt
  text: E todos decretaram, por voto comum, que este dia de modo algum ficasse sem ser assinalado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “que este dia de modo algum ficasse sem ser observado” ou “sem comemoração”. O termo grego ἀπαρασήμαντον significa literalmente “sem uma marca ou sinal distintivo” e, aqui, pode referir-se à lembrança ou observância pública do dia.
