lexical_decisions:
- source_word: ἐδογμάτισαν
  choice: decretaram
  rationale: Preserva o caráter formal e público da decisão expressa pelo aoristo de δογματίζω.
- source_word: πάντες
  choice: todos
  rationale: Mantém a ênfase na participação unânime do grupo.
- source_word: μετὰ κοινοῦ ψηφίσματος
  choice: por voto comum
  rationale: Conserva tanto o caráter compartilhado de κοινοῦ quanto o sentido cívico e deliberativo de ψήφισμα.
- source_word: μηδαμῶς
  choice: de modo algum
  rationale: Reproduz com naturalidade a forte negação do advérbio grego.
- source_word: ἐᾶσαι
  choice: se deixasse
  rationale: Expressa idiomaticamente a ideia de permitir que o dia permanecesse na condição indicada pelo adjetivo seguinte.
- source_word: ἀπαρασήμαντον
  choice: sem comemoração
  rationale: No contexto de um dia estabelecido para memória pública, comunica claramente o sentido contextual; a nota preserva a imagem literal e a alternativa mais ampla.
- source_word: τήνδε τὴν ἡμέραν
  choice: esse dia
  rationale: Em português narrativo, 'esse dia' aponta naturalmente para o dia específico já em foco.
