    rationale: A expressão grega se refere ao grupo associado a Judas, não declara posse nem especifica o sexo dos integrantes. «Os que estavam com Judas» conserva a amplitude e a relação expressas no original.
  - severity: low
    issue: «com toda a segurança»
    rationale: É compreensível e fiel, mas «com total segurança» é mais fluente no português moderno para a expectativa de Nicanor de agir sem perigo.
  revised_text: Mas Nicanor, ao saber que os que estavam com Judas se encontravam nas regiões da Samaria, resolveu atacá-los no dia de descanso[a], com total segurança.
