base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/001.yaml
  text: But Nicanor[a], having learned that those with Judas were in the regions of Samaria, resolved to attack them on the day of rest with complete security.
translation:
  language: pt
  text: Mas Nicanor, ao saber que os que estavam com Judas se encontravam nas regiões da Samaria, resolveu atacá-los no dia de descanso[a], com total segurança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente, “no sábado”; o grego diz literalmente “no dia de descanso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταλαβών
  choice: ao saber
  rationale: Neste contexto, com uma oração de acusativo e particípio, o verbo indica tomar conhecimento de uma informação. “Ao saber” é natural em português e conserva a relação circunstancial do particípio grego.
- source_word: τοὺς περὶ τὸν Ἰούδαν ὄντας
  choice: os homens de Judas
  rationale: A expressão οἱ περὶ com nome pessoal designa o grupo ligado à pessoa. “Os homens de Judas” comunica de modo claro a ideia de seus companheiros ou seguidores, sem sugerir mera proximidade física.
- source_word: ἐν τοῖς κατὰ Σαμάρειαν τόποις
  choice: nas regiões da Samaria
  rationale: A construção indica os lugares ou distritos associados à Samaria, sem exigir uma delimitação administrativa mais precisa.
- source_word: ἐβουλεύσατο
  choice: resolveu
  rationale: A forma média exprime deliberação que resulta numa decisão ou plano definido; “resolveu” preserva essa força.
- source_word: τῇ τῆς καταπαύσεως ἡμέρᾳ
  choice: no dia de descanso
  rationale: A expressão significa literalmente “no dia do descanso/da cessação”. Como o texto não emprega aqui o termo grego usual para sábado, a tradução mantém a formulação literal e registra a provável identificação em nota.
- source_word: μετὰ πάσης ἀσφαλείας
  choice: com toda a segurança
  rationale: A frase expressa a expectativa de Nicanor de agir em plena segurança, sem perigo para si; esta formulação preserva de perto a construção grega.
- source_word: ἐπιβαλεῖν
  choice: atacá-los
  rationale: Em contexto militar, o verbo significa lançar-se contra alguém ou atacar. O pronome retoma de maneira natural os homens de Judas.
theological_decisions:
- issue: Identificação do “dia de descanso”
  choice: Manter “dia de descanso” no texto principal e indicar em nota que se trata, mais especificamente, do sábado.
  alternative: Traduzir diretamente “no sábado”.
  rationale: O grego emprega uma expressão transparente para “dia de descanso”, e não o termo usual σάββατον. A tradução preserva essa forma do original sem ocultar seu provável referente histórico e religioso.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa natural. O marcador foi colocado após “dia de descanso”, expressão à qual a nota efetivamente se refere.
