base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/012.yaml
  text: 'His vision was like this: Onias[a], who had become high priest, a noble and good man, modest in bearing, gentle in manner, and one who spoke fittingly, and who from childhood had cultivated all the proper qualities of virtue—this man was stretching out his hands and praying for the whole body of the Jews.'
translation:
  language: pt
  text: 'Sua visão era esta: Onias, que se tornara sumo sacerdote, homem nobre e bom, modesto em sua postura, gentil em seu modo de agir, que falava de maneira apropriada e que, desde a infância, cultivara todas as qualidades próprias da virtude — esse homem, com as mãos estendidas, orava por toda a comunidade dos judeus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por todo o corpo coletivo dos judeus”. O grego apresenta os judeus como um único conjunto organizado.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρία
  choice: visão
  rationale: No contexto de um sonho ou cena contemplada, “visão” comunica uma experiência visual reveladora, sem reduzir o termo a mera aparência ou contemplação abstrata.
- source_word: γενόμενον ἀρχιερέα
  choice: que se tornara sumo sacerdote
  rationale: Mantém o sentido literal do particípio aoristo (“tendo-se tornado”) e o valor retrospectivo da descrição, sem substituí-lo pela interpretação “antigo sumo sacerdote”.
- source_word: καλὸν καὶ ἀγαθόν
  choice: nobre e bom
  rationale: A expressão descreve o caráter moral de Onias; “nobre” traduz καλός nesse uso ético, em vez de sugerir beleza física.
- source_word: αἰδήμονα μὲν τὴν ἀπάντησιν
  choice: modesto em sua postura
  rationale: A formulação grega é idiomática e caracteriza sua conduta exterior como respeitosa e reservada, sem limitar o sentido a uma saudação específica.
- source_word: πρᾶον δὲ τὸν τρόπον
  choice: gentil em seu modo de agir
  rationale: Expressa a brandura de temperamento e conduta indicada por πρᾶος em português corrente e digno.
- source_word: λαλιάν προειμένον πρεπόντως
  choice: que falava de maneira apropriada
  rationale: A frase grega é difícil, mas destaca a propriedade de sua fala. A tradução conserva πρεπόντως sem impor uma interpretação mais específica, como eloquência ou liberdade de expressão.
- source_word: ἐκ παιδὸς ἐκμεμελετηκότα
  choice: desde a infância, cultivara
  rationale: O perfeito indica formação cuidadosa e duradoura desde a infância; “cultivara” transmite melhor essa prática contínua do que mero estudo intelectual.
- source_word: πάντα τὰ τῆς ἀρετῆς ἴδια
  choice: todas as qualidades próprias da virtude
  rationale: Traduz as características ou disposições pertencentes à virtude, preservando o alcance abrangente de πάντα.
- source_word: κατεύχεσθαι
  choice: orava
  rationale: O verbo denota oração em favor de outros. “Orava” é claro e mantém o caráter intercessório apresentado pela visão.
- source_word: τῷ παντὶ τῶν Ἰουδαίων συστήματι
  choice: por toda a comunidade dos judeus
  rationale: σύστημα apresenta os judeus como um conjunto ou corpo coletivo. “Comunidade” é natural em português e evita linguagem institucional anacrônica.
theological_decisions:
- issue: Onias retratado em papel intercessório dentro da visão
  choice: Traduzir diretamente que Onias estendia as mãos e orava por toda a comunidade judaica.
  alternative: Atenuar κατεύχεσθαι como se Onias apenas desejasse o bem aos judeus.
  rationale: O grego descreve oração, e não mero voto de bem-estar. A tradução preserva a representação literária e teológica da intercessão sem desenvolver implicações doutrinárias além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A longa descrição foi mantida como uma unidade coerente, mas organizada com pontuação natural. Evitou-se acrescentar um marcador temporal como “então” ou “ora”, pois não há equivalente explícito no grego.
