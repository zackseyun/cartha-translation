lexical_decisions:
- source_word: εἶθ᾽ οὕτως
  choice: Então, desse modo
  rationale: Preserva tanto a sequência temporal quanto a maneira da aparição, em português natural.
- source_word: ἐπιφανῆναι
  choice: apareceu
  rationale: No contexto do relato de uma visão, expressa diretamente o evento de tornar-se visível sem acrescentar uma interpretação teológica.
- source_word: ἄνδρα
  choice: um homem
  rationale: Tradução direta e natural de ἀνήρ.
- source_word: πολιᾷ
  choice: pelos cabelos brancos
  rationale: Concretiza a referência aos cabelos grisalhos ou brancos como sinal de idade e dignidade.
- source_word: δόξῃ
  choice: pela glória
  rationale: Mantém o registro bíblico elevado e a ideia de dignidade visível.
- source_word: διαφέροντα
  choice: que se distinguia
