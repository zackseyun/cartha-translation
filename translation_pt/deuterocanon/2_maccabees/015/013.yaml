- source_word: θαυμαστὴν
  choice: maravilhosa
  rationale: Expressa o assombro suscitado pela aparência, com registro digno e corrente.
- source_word: μεγαλοπρεπεστάτην
  choice: esplendidíssima
  rationale: Preserva a força superlativa e evita repetir o campo lexical de majestade já empregado para ὑπεροχή.
- source_word: τὴν περὶ αὐτὸν ὑπεροχήν
  choice: a majestade que o envolvia
  rationale: Verte idiomaticamente a eminência ou grandeza extraordinária associada à figura e perceptível ao redor dela.
