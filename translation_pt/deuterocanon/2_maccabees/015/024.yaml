base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/024.yaml
  text: Let those who come against your holy people with blasphemy be struck with terror by the greatness of your arm[c][b][a]. And thus he ended in these words.
translation:
  language: pt
  text: Que sejam tomados de terror pela grandeza do teu braço[a][b] os que vêm com blasfêmia contra o teu santo povo. E assim, com essas palavras, ele terminou.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «fiquem aterrorizados» ou «fiquem consternados»; o verbo grego expressa ser tomado por medo ou assombro.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «pela grandeza do teu braço», imagem bíblica do poder de Deus em ação.
    reason: cultural_note
  - marker: c
    text: Ou «E assim ele concluiu»; a expressão grega retoma o que acabara de ser dito.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγέθει βραχίονός σου
  choice: pela grandeza do teu braço
  rationale: Preserva a imagem concreta do braço divino e entende o dativo μεγέθει como meio ou causa, expresso naturalmente por «pela».
- source_word: καταπλαγήτωσαν
  choice: sejam tomados de terror
  rationale: Reproduz o imperativo passivo e a ideia vívida de ser atingido por medo ou consternação.
- source_word: οἱ μετὰ βλασφημίας παραγινόμενοι
  choice: os que vêm com blasfêmia
  rationale: παραγίνομαι indica vir, chegar ou apresentar-se; μετὰ βλασφημίας descreve a maneira hostil dessa aproximação sem exigir que o substantivo abstrato grego seja pluralizado.
- source_word: ἐπὶ τὸν ἅγιον σου λαόν
  choice: contra o teu santo povo
  rationale: No contexto de movimento hostil, ἐπί com acusativo significa «contra»; «santo povo» preserva diretamente a formulação grega.
- source_word: καὶ οὕτως μὲν ἐν τούτοις ἔληξεν
  choice: E assim, com essas palavras, ele terminou
  rationale: ἔληξεν significa terminar ou concluir, e ἐν τούτοις retoma naturalmente as palavras que acabaram de ser pronunciadas.
theological_decisions:
- issue: Força metafórica de «teu braço» na oração dirigida a Deus
  choice: Manter «teu braço» no texto principal
  alternative: «teu poder» ou «teu braço poderoso»
  rationale: A imagem bíblica do braço de Deus comunica seu poder em ação e preserva a ressonância intertextual sem substituir a metáfora por uma interpretação.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com formas de segunda pessoa («teu») próprias da oração bíblica. A ordem da frase foi ajustada para soar natural, mantendo a petição, a imagem do braço divino e a aproximação hostil dos adversários.
