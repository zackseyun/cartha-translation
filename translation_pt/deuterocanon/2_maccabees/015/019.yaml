  text: And for those shut up in the city, the anxiety also was no small matter, as they were troubled about the attack in the open country.
translation:
  language: pt
  text: Também a angústia dos que estavam confinados na cidade não era pequena, pois estavam aflitos por causa do ataque em campo aberto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da investida em campo aberto”. A expressão grega contrasta os que estavam na cidade com o combate que acontecia fora dela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατειλημμένοις
  choice: confinados
  rationale: O particípio perfeito passivo descreve os que se encontravam retidos ou cercados na cidade pelas circunstâncias. “Confinados” conserva o valor passivo em registro natural e digno.
- source_word: οὐ πάρεργος
  choice: não era pequena
  rationale: A expressão indica que a angústia não era secundária nem insignificante. “Não era pequena” reproduz com naturalidade a força enfática do idioma grego.
- source_word: ἀγωνία
  choice: angústia
  rationale: O termo denota intensa aflição ou tensão interior. “Angústia” comunica aqui uma perturbação mais forte do que simples preocupação.
- source_word: ταρασσομένοις
  choice: pois estavam aflitos
  rationale: O particípio explicita a condição emocional que produzia a angústia. “Aflitos” expressa perturbação intensa sem acrescentar uma causa além da indicada no texto.
- source_word: τῆς ἐν ὑπαίθρῳ προσβολῆς
  choice: por causa do ataque em campo aberto
  rationale: προσβολή tem sentido militar de ataque ou investida, e ἐν ὑπαίθρῳ contrasta o espaço aberto fora da cidade com os que estavam dentro dela.
