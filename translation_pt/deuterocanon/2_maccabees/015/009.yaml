  text: And by encouraging them from the Law and the Prophets, and also by reminding them of the struggles they had already completed, he made them more eager.
translation:
  language: pt
  text: E, encorajando-os com base na Lei e nos Profetas, e lembrando-lhes também as lutas que já haviam levado até o fim, tornou-os mais dispostos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραμυθούμενος
  choice: encorajando-os
  rationale: No contexto de preparação para o combate, expressa consolo e exortação que infundem ânimo; «encorajando» comunica naturalmente essa função.
- source_word: ἐκ τοῦ νόμου καὶ τῶν προφητῶν
  choice: com base na Lei e nos Profetas
  rationale: Mantém a ideia de que o encorajamento procedia das Escrituras, preservando também os títulos tradicionais das duas coleções.
- source_word: τοὺς ἀγῶνας
  choice: as lutas
  rationale: Termo amplo que pode incluir combates, esforços e provações; «lutas» preserva essa extensão sem restringi-lo apenas a batalhas.
- source_word: ἐκτετελεκότες
  choice: haviam levado até o fim
  rationale: O perfeito de ἐκτελέω enfatiza ações completadas, e não apenas suportadas; a formulação portuguesa conserva a noção de conclusão.
- source_word: προθυμοτέρους
  choice: mais dispostos
  rationale: Expressa maior prontidão e ardor para agir sem especificar indevidamente uma emoção ou ação não declarada no grego.
