lexical_decisions:
- source_word: Λάβε
  choice: Receba
  rationale: O imperativo aoristo de λαμβάνω pode significar tanto “tomar” como “receber”. Neste contexto visionário, em que a espada é apresentada como dádiva divina, “receba” expressa naturalmente a entrega sem enfraquecer a ordem.
- source_word: τὴν ἁγίαν ῥομφαίαν
  choice: a espada santa
  rationale: ῥομφαία designa uma espada ou lâmina grande; “espada” é o equivalente português natural. “Santa” preserva de modo direto o caráter divinamente separado indicado por ἁγίαν.
- source_word: δῶρον παρὰ τοῦ θεοῦ
  choice: um presente de Deus
  rationale: δῶρον está em aposição à espada e παρά com genitivo indica sua origem. “Um presente de Deus” é claro, natural e mantém a identificação da espada como dádiva divina.
- source_word: δι’ ἧς
  choice: com a qual
  rationale: O pronome relativo retoma “espada” e tem sentido instrumental. “Com a qual” é a formulação idiomática mais natural em português.
- source_word: θραύσεις
  choice: você despedaçará
  rationale: O futuro de θραύω descreve uma ruptura violenta. “Despedaçará” conserva a força vívida e marcial do verbo grego.
- source_word: τοὺς ὑπεναντίους
  choice: os adversários
  rationale: ὑπεναντίος designa quem se opõe ou é hostil. “Adversários” preserva esse sentido e o registro solene, sem especificar além do grego.
theological_decisions:
- issue: Sentido de ἁγίαν aplicado à espada
  choice: santa
  alternative: sagrada
  rationale: “Santa” traduz diretamente ἁγίαν e conserva a apresentação da espada como separada e procedente de Deus, sem restringir o termo a uma nuance exclusivamente cultual.
- issue: Relação sintática de δῶρον παρὰ τοῦ θεοῦ com a espada
  choice: 'aposição: “um presente de Deus”'
  alternative: 'valor predicativo: “como presente de Deus”'
  rationale: A construção grega admite uma expressão apositiva ou predicativa. A aposição identifica naturalmente a espada como dádiva de Deus e evita sugerir que o modo de recebê-la seja o foco; a alternativa é registrada em nota para preservar a possibilidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento por “você” comunica diretamente o singular grego sem arcaísmo. A ordem breve e o futuro vigoroso preservam o tom visionário e marcial.
