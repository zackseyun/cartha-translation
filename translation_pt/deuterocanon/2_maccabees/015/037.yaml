  text: and to keep the thirteenth day of the twelfth month—called Adar in the Syrian language—as a notable day[b][a], one day before Mordecai's day.
translation:
  language: pt
  text: e considerar o décimo terceiro dia do décimo segundo mês — chamado Adar na língua local[a] — uma data marcante, um dia antes do Dia de Mardoqueu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz uma expressão incomum, que pode significar “na língua comum” ou “no vernáculo”. Alguns entendem que ela reflete uma leitura difícil ligada à designação siríaca, isto é, aramaica, do nome do mês.
    reason: textual_and_lexical_alternative
  - marker: b
    text: Isto é, o dia anterior à comemoração associada a Mardoqueu, provavelmente uma referência à festa de Purim.
    reason: cross_reference
lexical_decisions:
- source_word: ἔχειν
  choice: manter
  rationale: No contexto de uma comemoração do calendário, indica conservar a data como dia assinalado; “manter” também preserva a forma infinitiva e a ligação com o contexto anterior.
- source_word: ἐπίσημον
  choice: especial
  rationale: Expressa que o dia é marcado ou distinto, sem acrescentar a força jurídica ou litúrgica de “feriado” ou “festa oficial”.
- source_word: προκαδεκάτην
  choice: décimo terceiro dia
  rationale: O ordinal composto designa o dia anterior ao décimo quarto, isto é, o décimo terceiro; a forma direta é mais clara em português.
- source_word: τοῦ δωδεκάτου μηνός
  choice: do décimo segundo mês
  rationale: Reproduz diretamente a especificação cronológica do genitivo grego.
- source_word: Ἀδὰρ
  choice: Adar
  rationale: Mantém por transliteração o nome tradicional do mês.
- source_word: τῇ κυριακῇ φωνῇ
  choice: na língua oficial
  rationale: O texto grego fornecido tem κυριακῇ, “senhorial, do senhor” e, por extensão possível, “oficial”. Como a expressão é incomum e pode refletir uma leitura problemática em lugar de Συριακῇ, a nota registra explicitamente a incerteza em vez de emendar silenciosamente para “siríaca”.
- source_word: πρὸ μιᾶς ἡμέρας
  choice: um dia antes
  rationale: Forma portuguesa natural que preserva com precisão a relação temporal.
- source_word: τῆς Μαρδοχαϊκῆς ἡμέρας
  choice: do Dia de Mardoqueu
  rationale: O adjetivo significa “relativo a Mardoqueu”. A forma escolhida mantém a designação comemorativa sem inserir “Purim” no texto principal.
theological_decisions:
- issue: Natureza da comemoração indicada por ἐπίσημον
  choice: um dia especial
  alternative: um dia festivo ou feriado oficial
  rationale: O adjetivo assinala um dia distinto, mas não determina por si só seu estatuto litúrgico ou legal.
- issue: Sentido de τῇ κυριακῇ φωνῇ
  choice: na língua oficial, com nota textual
  alternative: na língua siríaca; na língua comum; no vernáculo
  rationale: A leitura grega apresentada é κυριακῇ, não Συριακῇ. A tradução segue a evidência fornecida e a nota preserva a possibilidade de que exista uma dificuldade textual ligada à designação siríaca ou aramaica do mês.
- issue: Identificação do Dia de Mardoqueu
  choice: manter a alusão no texto e explicar em nota
  alternative: traduzir diretamente como festa de Purim
  rationale: A formulação grega menciona Mardoqueu, não Purim; a provável identificação histórica pode ser informada sem substituir o modo de expressão do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Dia de Mardoqueu” recebe maiúscula por funcionar como nome da comemoração. A redação conserva a estrutura continuativa do versículo e não resolve silenciosamente a dificuldade textual de κυριακῇ.
