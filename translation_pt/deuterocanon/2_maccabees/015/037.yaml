  terminology: «Adar» e «Dia de Mardoqueu» estão adequados. «Data marcante» preserva o sentido de dia assinalado/distinto sem impor que se trate de feriado ou festa. A nota sobre a língua deve explicar a dificuldade de κυριακῇ e registrar a alternativa siríaca/aramaica, sem afirmar uma emenda como certa.
