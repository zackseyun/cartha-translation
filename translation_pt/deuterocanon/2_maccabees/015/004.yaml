  yaml_path: translation/deuterocanon/2_maccabees/015/004.yaml
  text: But they declared[a], “The Lord lives; he himself is the ruler in heaven, the one who commanded the observance of the seventh day.”
translation:
  language: pt
  text: 'Mas eles declararam: “O Senhor vive; ele mesmo é o soberano no céu, aquele que ordenou guardar o sétimo dia.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “guardar o sábado”. O grego diz “o sétimo dia”, em referência à observância do sábado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποφηναμένων
  choice: eles declararam
  rationale: O particípio introduz a resposta solene dos judeus; “declararam” conserva a força formal e pública do verbo sem soar arcaico.
- source_word: κύριος
  choice: Senhor
  rationale: No contexto judaico, refere-se a Deus e preserva o uso reverente tradicional da Septuaginta.
- source_word: ζῶν
  choice: vive
  rationale: A formulação “O Senhor vive” é natural em português e mantém a força confessional e solene de Ἔστιν ὁ κύριος ζῶν.
- source_word: δυνάστης
  choice: soberano
  rationale: Expressa aquele que detém poder e domínio; “soberano” comunica claramente a autoridade divina no céu.
- source_word: κελεύσας
  choice: ordenou
  rationale: Conserva a autoridade vinculante da ordem divina expressa pelo particípio aoristo.
- source_word: ἀσκεῖν
  choice: guardar
  rationale: Neste contexto, o verbo significa praticar ou observar; “guardar” é idiomático em português quando se fala de um dia sagrado.
- source_word: τὴν ἑβδόμαδα
  choice: o sétimo dia
  rationale: Mantém a expressão grega mais literal, que no contexto se refere à observância do sábado.
theological_decisions:
- issue: Tradução da expressão sabática τὴν ἑβδόμαδα
  choice: o sétimo dia
  alternative: o sábado
  rationale: O grego emprega literalmente a expressão “o sétimo [dia]”, não o termo usual para sábado. O texto principal preserva essa forma, e a nota esclarece sua referência contextual.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção preserva o tom solene da resposta e a formulação literal “o sétimo dia”, esclarecida em nota.
