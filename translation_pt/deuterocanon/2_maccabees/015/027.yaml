revisions:
- from: Enquanto lutavam com as mãos, oravam a Deus com o coração; e derrubaram nada menos que trinta e cinco mil e quatrocentos homens[a], imensamente alegrados pelo cuidado de Deus.[b]
  to: Enquanto lutavam com as mãos e oravam a Deus em seus corações, abateram não menos de trinta e cinco mil e quatrocentos[a], muito alegrados pelo cuidado de Deus.[b]
  rationale: A revisão substitui a expressão potencialmente idiomática «com o coração» por «em seus corações», que representa melhor o plural e a interioridade do dativo grego; torna a locução numérica mais direta; e remove «homens», preservando a elipse do original. As notas permanecem corretamente ancoradas no número textual e em «cuidado de Deus».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:29:29Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente o contraste grego entre o combate exterior, «com as mãos», e a oração interior dirigida a Deus, bem como o número transmitido (35.400) e a alegria atribuída ao cuidado de Deus. Contudo, «com o coração» no singular tende em português a sugerir sobretudo sinceridade, em vez da localização interior expressa pelo plural καρδίαις. «Em seus corações» conserva melhor o contraste e o plural do grego. A inclusão de «homens» depois do número esclarece uma elipse possível no contexto militar, mas não é necessária e especifica um objeto que o versículo deixa elíptico.
  naturalness: O texto é claro e de registro apropriado. «Enquanto lutavam com as mãos e oravam a Deus em seus corações» é mais idiomático e torna mais nítido o paralelismo. «Não menos de» é uma formulação ligeiramente mais direta para οὐδὲν ἧττον do que «nada menos que».
  terminology: «Cuidado de Deus» corresponde bem a ἐπιμέλεια e evita introduzir «providência» como termo teológico na linha principal. «Abateram» é natural em contexto bélico e reproduz sem excesso interpretativo o sentido de «derrubaram/deixaram caídos».
