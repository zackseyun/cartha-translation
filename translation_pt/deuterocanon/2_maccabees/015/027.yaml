  yaml_path: translation/deuterocanon/2_maccabees/015/027.yaml
  text: And while fighting with their hands[a], they were praying in their hearts to God, and they struck down no fewer than thirty-five thousand and four hundred[b], having been greatly gladdened by the care of God.
translation:
  language: pt
  text: Enquanto lutavam com as mãos e oravam a Deus em seus corações, abateram não menos de trinta e cinco mil e quatrocentos[a], muito alegrados pelo cuidado de Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego expressa o número como “três miríades, cinco mil e quatrocentos”, isto é, 35.400. A forma transmitida na parte referente aos “cinco mil” é comprimida ou irregular, mas o total pretendido é claro.
    reason: textual_variant
  - marker: b
    text: 'Ou: “muito encorajados pelo cuidado providencial de Deus”. Mais literalmente, o grego diz “o cuidado de Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῖς μὲν χερσὶν ἀγωνιζόμενοι
  choice: Enquanto lutavam com as mãos
  rationale: ἀγωνίζομαι, no contexto de uma batalha, indica lutar ou combater. A formulação mantém o contraste entre a ação exterior das mãos e a oração interior do coração.
- source_word: ταῖς δὲ καρδίαις πρὸς τὸν θεὸν εὐχόμενοι
  choice: oravam a Deus com o coração
  rationale: O dativo καρδίαις exprime meio ou esfera e se contrapõe a χερσίν. “Com o coração” conserva essa estrutura sem reduzir a expressão apenas à ideia moderna de sinceridade.
- source_word: κατέστρωσαν
  choice: derrubaram
  rationale: Em contexto militar, o verbo significa abater ou deixar caídos. “Derrubaram” é claro e vigoroso, sem especificar além do grego a maneira como os inimigos morreram.
- source_word: οὐδὲν ἧττον
  choice: nada menos que
  rationale: A expressão enfatiza que o total não foi inferior ao número indicado.
- source_word: μυριάδων πένθων καὶ τετρακισχιλίων
  choice: trinta e cinco mil e quatrocentos
  rationale: A expressão numérica transmitida está comprimida ou irregular, mas aponta para três miríades mais cinco mil e quatrocentos, totalizando 35.400.
- source_word: τῇ τοῦ θεοῦ μεγάλως ἐφρανθέντες ἐπιμελείᾳ
  choice: imensamente alegrados pelo cuidado de Deus
  rationale: ἐπιμέλεια significa cuidado, atenção ou solicitude; ἐφρανθέντες indica que eles foram alegrados. A tradução preserva a relação causal sem introduzir o termo teológico mais específico “providência”.
theological_decisions:
- issue: Traduzir τοῦ θεοῦ ἐπιμελείᾳ como “cuidado de Deus” ou como “providência de Deus”
  choice: cuidado de Deus
  alternative: providência de Deus; cuidado providencial de Deus
  rationale: “Cuidado” corresponde diretamente a ἐπιμέλεια. “Providência” é uma interpretação teologicamente possível, mas mais técnica e abrangente do que a afirmação lexical do texto.
translation_notes:
  register: 'Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações e o paralelismo entre “mãos” e “coração” foram preservados. Os marcadores das notas foram colocados junto aos termos que de fato explicam: [a] após o número e [b] após “cuidado de Deus”.'
