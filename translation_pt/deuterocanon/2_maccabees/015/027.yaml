    rationale: O grego usa o plural καρδίαις e estabelece um contraste entre as mãos que combatem e a interioridade da oração. «Em seus corações» preserva ambos os aspectos com maior precisão.
  - severity: low
    issue: «homens» explicita o objeto elíptico do verbo.
    rationale: O contexto permite entender que se trata dos adversários, mas o grego fornece apenas a expressão numérica. Omitir «homens» mantém a elipse do texto-fonte.
