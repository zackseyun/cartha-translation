base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/011.yaml
  text: And after arming each of them[a], not with the security of shields and spears so much as with encouragement from noble words, and after relating to them a trustworthy dream[b], he made them all rejoice.
translation:
  language: pt
  text: Depois de armar cada um deles, não tanto com a proteção de escudos e lanças quanto com o encorajamento proporcionado por palavras nobres e, depois de lhes contar um sonho digno de confiança[a], ele os alegrou sobremaneira.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um sonho crível”. O grego descreve o sonho como digno de confiança.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ele os alegrou mais do que tudo”. A expressão grega também pode ter sentido intensivo: “sobremaneira” ou “imensamente”.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: καθοπλίσας
  choice: depois de armar
  rationale: Preserva a sequência do particípio aoristo e o sentido de equipar para a batalha, sem tornar enfático demais o valor do prefixo.
- source_word: οὐ τὴν ἀσπίδων καὶ λογχῶν ἀσφάλειαν, ὡς τὴν ἐν τοῖς ἀγαθοῖς λόγοις παράκλησιν
  choice: não tanto com a segurança de escudos e lanças, mas com o encorajamento encontrado em palavras nobres
  rationale: Reproduz de modo idiomático o contraste οὐ...ὡς entre a proteção das armas e o fortalecimento proporcionado pelas palavras, sem excluir que os homens estivessem materialmente armados.
- source_word: προσηγησάμενος
  choice: depois de lhes contar
  rationale: Expressa a apresentação narrativa do sonho aos soldados e torna explícito, de maneira natural em português, o grupo a quem ele foi contado.
- source_word: ὄνειρον ἀξιόπιστον
  choice: um sonho digno de confiança
  rationale: Traduz literalmente a ideia de algo merecedor de crédito, sem afirmar uma origem divina que o versículo não explicita.
- source_word: ὑπὲρ τὰ πάντα ηὔφραινεν
  choice: ele os encheu de alegria acima de tudo
  rationale: Mantém a força causativa de εὐφραίνω e conserva a expressão intensiva ou comparativa ὑπὲρ τὰ πάντα, cuja relação exata é incomum e admite mais de uma formulação.
theological_decisions:
- issue: Natureza do sonho
  choice: um sonho digno de confiança
  alternative: um sonho crível; um sonho confiável
  rationale: O texto avalia positivamente a credibilidade do sonho, mas não declara neste versículo que ele fosse inspirado ou enviado por Deus.
- issue: Força de ὑπὲρ τὰ πάντα
  choice: acima de tudo
  alternative: imensamente; mais do que qualquer outra coisa
  rationale: A formulação preserva a tensão entre uma leitura intensiva e uma leitura comparativa, em vez de reduzir a expressão apenas a um advérbio de intensidade.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário militar comum. A sintaxe mantém o encadeamento narrativo dos particípios gregos, mas evita rigidez excessiva.
