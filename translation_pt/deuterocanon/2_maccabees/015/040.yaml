base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/040.yaml
  text: For just as drinking wine by itself[a], and then again water, is unpleasant, but wine mixed with water becomes pleasing and produces delight, so also the style of the composition delights the ears of those who read the work. Here, then, will be the end.
translation:
  language: pt
  text: Pois, assim como é desagradável beber vinho sozinho e, por sua vez, água por si só[a], mas o vinho misturado com água se torna agradável e produz prazer, assim também a elaboração do relato deleita os ouvidos dos que leem a obra. Aqui, então, será o fim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «e, por sua vez, a água é hostil»; pelo contexto, o sentido é que tanto o vinho tomado sozinho como a água tomada por si só são menos agradáveis do que uma mistura apropriada.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: Pois, assim como
  rationale: Introduz a comparação que explica a observação literária final; «Pois» explicita de modo natural seu valor explicativo.
- source_word: οἶνον κατὰ μόνας πίνειν
  choice: beber vinho sem mistura
  rationale: κατὰ μόνας significa que o vinho é bebido sozinho, sem água; «sem mistura» comunica esse sentido com naturalidade no contexto da comparação.
- source_word: ὕδωρ πάλιν πολέμιον
  choice: e, por sua vez, água pura é desagradável
  rationale: πολέμιον significa literalmente «hostil» ou «inimigo», mas aqui caracteriza a água bebida separadamente como desagradável. «Pura» deixa explícito o contraste contextual com a mistura, sem atribuir impureza à água.
- source_word: συγκερασθεὶς
  choice: misturado
  rationale: Refere-se diretamente à mistura de vinho com água; é a opção portuguesa mais clara e corrente.
- source_word: ἐπιτερπῇ τὴν χάριν ἀποτελεῖ
  choice: se torna agradável e produz prazer
  rationale: Preserva tanto a qualidade agradável da mistura como o prazer que ela resulta em produzir.
- source_word: τὸ τῆς κατασκευῆς τοῦ λόγου
  choice: a elaboração do relato
  rationale: κατασκευή indica elaboração ou construção literária, e λόγος designa aqui o relato escrito. A formulação é concisa e natural.
- source_word: τέρπει τὰς ἀκοὰς
  choice: deleita os ouvidos
  rationale: Mantém a imagem auditiva vívida do grego, adequada a um texto que também podia ser ouvido em leitura pública.
- source_word: τῶν ἐντυγχανόντων τῇ συντάξει
  choice: dos que leem a obra
  rationale: ἐντυγχάνω pode significar ler ou deparar-se com um texto, enquanto σύνταξις se refere à composição escrita; a tradução expressa o sentido contextual sem rigidez.
- source_word: Ἐνταῦθα δὲ ἔσται ἡ τελευτή
  choice: Aqui, então, será o fim
  rationale: Conserva a concisão e a finalidade deliberada da frase que encerra o livro.
