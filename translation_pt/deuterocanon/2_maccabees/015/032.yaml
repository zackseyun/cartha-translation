  yaml_path: translation/deuterocanon/2_maccabees/015/032.yaml
  text: And after displaying the head of the accursed Nikanor and the hand of that blasphemer[a], which he had stretched out against the holy house of the Almighty and boasted greatly[b],
translation:
  language: pt
  text: E, depois de exibir a cabeça do impuro Nicanor[a] e a mão daquele blasfemador[b], que ele havia estendido contra a santa Casa do Todo-Poderoso e com a qual se vangloriara muito,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «do abominável Nicanor». O adjetivo grego é um termo forte de reprovação religiosa e moral e pode significar «contaminado» ou «abominável».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «daquele difamador» ou «daquele que proferia insultos». O termo grego pode designar de modo geral quem fala de maneira injuriosa; «blasfemador» ressalta o contexto de afronta ao templo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδειξάμενος
  choice: depois de exibir
  rationale: O particípio aoristo tem valor narrativo sequencial e introduz uma ação anterior à continuação da frase no versículo seguinte; esta forma é natural em português e preserva essa relação.
- source_word: μιεροῦ
  choice: impuro
  rationale: O adjetivo expressa forte reprovação religiosa e moral, com a ideia de contaminação ou abominação. «Impuro» conserva esse campo sem acrescentar explicitamente a noção de uma maldição divina.
- source_word: δυσφήμου
  choice: blasfemador
  rationale: O termo pode indicar quem difama, insulta ou fala de modo injurioso. No contexto da afronta à Casa santa, «blasfemador» comunica naturalmente a dimensão religiosa, sem ocultar a alternativa mais geral registrada em nota.
- source_word: ἐκτείνας
  choice: havia estendido
  rationale: A forma deixa claro que o gesto hostil de Nicanor contra o templo ocorreu antes da exibição de sua mão.
- source_word: ἐπὶ τὸν ἅγιον ... οἶκον
  choice: contra a santa Casa
  rationale: O contexto de ameaça e hostilidade favorece o sentido adversativo de ἐπί com acusativo. «Casa», com inicial maiúscula, funciona aqui como designação reverente do templo.
- source_word: παντοκράτορος
  choice: Todo-Poderoso
  rationale: É a forma portuguesa tradicional, clara e reverente para o título divino, evitando uma transliteração ou uma construção artificial.
- source_word: ἐμεγαλαύχησεν
  choice: vangloriando-se arrogantemente
  rationale: O verbo denota jactância marcada por orgulho. Esta formulação reproduz sua força no contexto e se integra naturalmente à oração portuguesa.
theological_decisions:
- issue: Tradução de παντοκράτωρ como título divino
  choice: Todo-Poderoso
  alternative: Soberano de tudo
  rationale: O título deve ser traduzido. «Todo-Poderoso» é uma equivalência consagrada e amplamente inteligível, mantendo o peso teológico sem impor uma formulação confessional específica.
- issue: Força religiosa de δυσφήμου
  choice: blasfemador
  alternative: difamador
  rationale: A afronta é dirigida à Casa santa de Deus, de modo que «blasfemador» expressa adequadamente a impiedade contextual; a amplitude lexical do termo grego é preservada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A frase permanece aberta, terminando em vírgula, porque o particípio inicial e a construção sintática prosseguem no versículo seguinte. As notas foram posicionadas imediatamente após os termos a que se referem.
