  yaml_path: translation/deuterocanon/2_maccabees/015/008.yaml
  text: And he urged those with him not to fear the attack of the nations, but to keep in mind the help that had previously come to them from heaven, and now to expect the victory that would come to them from the Almighty.
translation:
  language: pt
  text: E ele encorajava os que estavam com ele a não temer o ataque das nações, mas a ter em mente os auxílios que antes lhes haviam vindo do céu e a esperar agora a vitória que lhes viria da parte do Todo-Poderoso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλει
  choice: encorajava
  rationale: O imperfeito indica uma exortação continuada; «encorajava» transmite apoio firme e natural, sem perder a força do contexto militar.
- source_word: τοὺς σὺν αὐτῷ
  choice: os que estavam com ele
  rationale: Reproduz com clareza a expressão grega e identifica naturalmente os homens que acompanhavam Judas.
- source_word: μὴ δειλιᾷν
  choice: a não temer
  rationale: No contexto, o verbo descreve ceder ao medo ou perder a coragem; «não temer» é corrente e preserva a força exortativa.
- source_word: τὴν τῶν ἐθνῶν ἔφοδον
  choice: o ataque das nações
  rationale: ἔφοδος designa uma investida hostil. «Nações» conserva a formulação étnica do grego sem acrescentar uma carga teológica desnecessária.
- source_word: ἔχοντας δὲ κατὰ νοῦν
  choice: mas a ter em mente
  rationale: Expressa de modo idiomático a orientação de conservar conscientemente na memória os auxílios anteriores.
- source_word: τὰ προγεγονότα αὐτοῖς ἀπʼ οὐρανοῦ βοηθήματα
  choice: os auxílios que antes lhes haviam vindo do céu
  rationale: O perfeito aponta para atos anteriores de ajuda cujos efeitos permanecem relevantes; «auxílios» mantém o plural do grego.
- source_word: τὰ νῦν προσδοκᾷν
  choice: e a esperar agora
  rationale: O infinitivo continua o conteúdo da exortação, e «esperar» comunica a expectativa confiante indicada pelo contexto.
- source_word: τὴν παρὰ τοῦ παντοκράτορος ἐσομένην αὐτοῖς νίκην
  choice: a vitória que lhes viria da parte do Todo-Poderoso
  rationale: A construção futura é preservada por «viria», enquanto «da parte de» explicita que o Todo-Poderoso é a fonte da vitória.
theological_decisions:
- issue: Tradução do título divino παντοκράτωρ
  choice: Todo-Poderoso
  alternative: Onipotente
  rationale: «Todo-Poderoso» é um título divino estabelecido e inteligível em português, preservando o peso teológico do grego sem impor formulação filosófica mais técnica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura coordenada conserva o movimento da exortação grega; não foram necessárias notas de rodapé.
