  text: But that thrice-accursed man asked whether there is in heaven a sovereign who commanded the keeping of the sabbath day[a].
translation:
  language: pt
  text: Mas aquele homem três vezes maldito perguntou se há no céu algum soberano que ordenou guardar o dia de sábado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se está no céu o Soberano, aquele que ordenou guardar o dia de sábado”. O grego pode ser entendido tanto como uma descrição indefinida (“há no céu algum soberano...?”) quanto como uma referência mais definida ao Deus de Israel.'
    reason: alternative_reading
lexical_decisions:
- source_word: τρισαλιτήριος
  choice: três vezes maldito
  rationale: Conserva o prefixo intensivo τρις- e a forte condenação expressa pelo raro epíteto grego, sem reduzi-lo simplesmente a “muito perverso”.
- source_word: ἐπηρώτησεν
  choice: perguntou
  rationale: É a forma portuguesa mais direta e natural; o caráter hostil da pergunta já é comunicado pelo contexto e pelo epíteto.
- source_word: δυνάστης
  choice: soberano
  rationale: Expressa alguém dotado de poder e domínio, mantendo o registro elevado sem recorrer a “Senhor”, que poderia impor associações específicas de título divino.
- source_word: προστατάξας
  choice: ordenou
  rationale: Reproduz a ideia de uma determinação dada com autoridade.
- source_word: ἄγειν
  choice: guardar
  rationale: No uso relacionado a um dia sagrado, o infinitivo tem o sentido idiomático de observar ou guardar esse dia.
- source_word: τὴν τῶν σαββάτων ἡμέραν
  choice: o dia de sábado
  rationale: Identifica com clareza o sábado semanal e evita reproduzir de modo artificial o plural formal da expressão grega.
theological_decisions:
- issue: Referência da autoridade celestial
  choice: algum soberano no céu
  alternative: o Soberano no céu
  rationale: A formulação principal preserva a pergunta hostil como uma descrição existencial, sem transformar δυνάστης em título divino fixo. Como o artigo grego também permite entender a expressão como referência definida ao Deus de Israel, essa leitura é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Três vezes maldito” mantém a força retórica do insulto; “guardar o dia de sábado” conserva uma expressão bíblica natural sem soar excessivamente técnica.
