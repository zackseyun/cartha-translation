  source_fidelity: A estrutura de genitivos absolutos é bem representada por uma oração temporal, e os termos militares foram em geral compreendidos corretamente. Contudo, κρίσις, neste contexto imediatamente bélico, designa mais naturalmente o desfecho ou a decisão decisiva que se aproxima; «julgamento» é possível, mas em português tende a deslocar o sentido para um juízo jurídico ou teológico. Os aoristos dos demais genitivos absolutos também pedem anterioridade mais uniforme do que a alternância atual entre mais-que-perfeito e imperfeito.
  naturalness: «Julgamento que estava por vir» é pesado e redundante. «Posicionadas convenientemente» soa pouco idiomático em português contemporâneo para uma disposição tática; «adequadamente posicionadas» é mais natural. A sequência com mais-que-perfeito composto torna clara a preparação já concluída antes da ação que se segue.
  terminology: «Cavalaria» e «alas» são adequados para τῆς ἵππου e κατὰ κέρας. «Feras» preserva a generalidade de θηρία, e a nota identifica prudentemente os elefantes sem transformar essa probabilidade em certeza textual.
