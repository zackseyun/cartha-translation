  - severity: low
    issue: Aspecto verbal e fluidez da disposição militar
    rationale: Os particípios aoristos coordenados descrevem preparativos já realizados. «Haviam entrado», «fora disposto» e «haviam sido posicionadas» refletem isso com maior consistência; «adequadamente» é mais idiomático que «convenientemente».
