  yaml_path: translation/deuterocanon/2_maccabees/015/020.yaml
  text: And when all were already expecting the coming judgment[a], and the enemies had already joined battle, and the army had been drawn up, and the beasts had been suitably stationed in one part, and the cavalry posted on the flanks[b],
translation:
  language: pt
  text: Quando todos já aguardavam o desfecho iminente[a], e os inimigos já haviam entrado em combate, e o exército fora disposto em formação, e as feras[b] haviam sido adequadamente posicionadas em um setor, e a cavalaria fora disposta nas alas,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o julgamento que se aproximava”, “a decisão iminente” ou “a crise que se aproximava”.
    reason: Registra a amplitude semântica de κρίσις, cujo sentido imediato no contexto militar é o de um desfecho ou decisão decisiva.
  - marker: b
    text: Provavelmente os elefantes de guerra empregados na formação de batalha.
    reason: Esclarece a referência histórica provável sem substituir no texto principal o termo genérico grego.
lexical_decisions:
- source_word: προσδοκώντων
  choice: aguardavam
  rationale: Expressa espera acompanhada de expectativa e se encaixa naturalmente na tensão do contexto militar.
- source_word: τὴν ἐσομένην κρίσιν
  choice: o julgamento que estava por vir
  rationale: κρίσις pode indicar julgamento, decisão ou momento decisivo. A tradução mantém o peso do termo e sua possível ressonância teológica sem apagar o sentido militar imediato.
- source_word: προσμιξάντων τῶν πολεμίων
  choice: os inimigos já tinham travado combate
  rationale: No contexto militar, προσμίγνυμι indica que as forças entraram em confronto; a expressão portuguesa comunica isso com clareza.
- source_word: τῆς στρατιᾶς ἐκταγείσης
  choice: o exército estava em formação
  rationale: O particípio passivo descreve o exército ordenado para a batalha. A formulação é corrente e evita um literalismo pouco natural.
- source_word: τῶν θηρίων
  choice: as feras
  rationale: Preserva o termo genérico do grego; a provável identificação como elefantes de guerra fica na nota.
- source_word: ἐπὶ μέρος
  choice: em um setor
  rationale: Indica uma parte determinada da linha de batalha sem especificar além do texto.
- source_word: εὐκαίρως ἀποκατασταθέντων
  choice: tinham sido posicionadas convenientemente
  rationale: Combina a ideia de colocação tática com a adequação expressa pelo advérbio εὐκαίρως.
- source_word: τῆς δὲ ἵππου
  choice: a cavalaria
  rationale: O coletivo literalmente relacionado a 'cavalo' designa aqui a tropa montada.
- source_word: κατὰ κέρας τεταγμένης
  choice: estava disposta nas alas
  rationale: κέρας é um termo militar para a ala ou o flanco de uma formação; 'alas' conserva a imagem tática e é compreensível em português.
theological_decisions:
- issue: Tradução de κρίσις no contexto de uma batalha, com possível ressonância teológica
  choice: julgamento
  alternative: decisão; crise; desfecho decisivo
  rationale: O contexto aponta para o resultado decisivo da batalha, mas 'julgamento' é semanticamente possível e preserva a gravidade e a tensão teológica do grego. A nota registra as alternativas sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa fluida. O período permanece aberto com vírgula porque o versículo grego continua na sequência. As notas preservam a ambiguidade lexical e esclarecem o contexto militar.
