base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/030.yaml
  text: And he ordered that the head of Nikanor[a], and the hand with the shoulder, be cut off and carried to Jerusalem—he who with his whole body and soul had fought in the forefront for the citizens, and who had preserved from youth his goodwill toward his fellow countrymen.
translation:
  language: pt
  text: E ordenou que cortassem a cabeça de Nicanor e a mão junto com o ombro[a] e as levassem para Jerusalém — ele, que com todo o corpo e alma lutara na linha de frente pelos cidadãos e que, desde a juventude, conservara sua boa vontade para com seus compatriotas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o braço junto com o ombro”; literalmente, “a mão junto com o ombro”, provavelmente em referência ao membro superior decepado.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέταξεν
  choice: ordenou
  rationale: Expressa de modo natural e direto a força autoritativa do aoristo de προστάσσω.
- source_word: ὁ καθʼ ὅλον σώματι καὶ ψυχῇ πρωταγωνιστὴς
  choice: ele, que de corpo e alma havia lutado na linha de frente
  rationale: Preserva a imagem de dedicação corporal e anímica total e o sentido de πρωταγωνιστής como aquele que ocupa a posição principal ou dianteira na luta.
- source_word: ὑπὲρ τῶν πολιτῶν
  choice: pelos cidadãos
  rationale: Mantém a nuance cívica de πολῖται sem a reduzir à ideia mais ampla de compatriotas.
- source_word: τὴν τῆς ἡλικίας εὔνοιαν
  choice: desde a juventude, ... sua boa vontade
  rationale: No contexto, τῆς ἡλικίας caracteriza temporalmente a benevolência mantida ao longo da vida; a formulação portuguesa é natural e acompanha a leitura contextual refletida pela tradição de tradução.
- source_word: ὁμοεθνεῖς
  choice: compatriotas
  rationale: Comunica com concisão pessoas do mesmo povo ou nação.
- source_word: διαφυλάξας
  choice: conservara
  rationale: O mais-que-perfeito traduz adequadamente o particípio aoristo retrospectivo e ressalta a manutenção duradoura dessa disposição.
- source_word: ἀποτεμόντας
  choice: que cortassem
  rationale: O particípio acusativo dependente de προσέταξεν expressa o conteúdo da ordem; em português, a oração finita no subjuntivo é idiomática.
- source_word: τὴν χεῖρα σὺν τῷ ὤμῳ
  choice: a mão junto com o ombro
  rationale: Segue de perto a expressão grega, embora ela provavelmente designe todo o membro superior decepado; a alternativa é registrada em nota.
- source_word: περιφέρειν εἰς Ἰερουσαλήμ
  choice: as levassem para Jerusalém
  rationale: Com εἰς, indica transporte até Jerusalém. Evita acrescentar a ideia não explícita de desfile, sem excluir uma posterior exibição pública.
theological_decisions:
- issue: Referente das descrições apositivas
  choice: As descrições se referem ao sujeito implícito de “ordenou”, isto é, Judas Macabeu.
  alternative: Ler as expressões apenas como elogio narrativo pouco integrado à sintaxe do sujeito.
  rationale: Os dois artigos ὁ introduzem aposições que caracterizam naturalmente quem emitiu a ordem; o travessão preserva a estrutura elogiosa sem inserir o nome ausente neste versículo.
- issue: Linguagem de σώματι καὶ ψυχῇ
  choice: de corpo e alma
  alternative: com todo o seu ser
  rationale: Retém a linguagem antropológica e a força retórica do grego sem impor uma definição doutrinária posterior da relação entre corpo e alma.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leitura natural no Brasil. A ordem dos elementos foi ajustada apenas o necessário para clareza; a aposição elogiosa e a intensidade retórica do grego foram preservadas.
