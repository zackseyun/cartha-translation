  text: But Maccabeus was continually confident, with every hope, that he would obtain help from the Lord.
translation:
  language: pt
  text: Mas Macabeu permanecia constantemente confiante, com plena esperança de obter auxílio do Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδιαλείπτως πεποιθώς
  choice: permanecia sempre confiante
  rationale: Expressa tanto a continuidade indicada por ἀδιαλείπτως quanto o estado durativo de confiança do particípio perfeito πεποιθώς, em português natural.
- source_word: μετὰ πάσης ἐλπίδος
  choice: com toda a esperança
  rationale: Mantém de perto a formulação grega e evita reduzir πάσης a uma simples ideia de intensidade como “plena”, embora a expressão portuguesa permaneça deliberadamente incomum.
- source_word: ἀντιλήμψεως
  choice: ajuda
  rationale: No contexto, designa auxílio ou socorro; “ajuda” é claro e acessível sem acrescentar uma modalidade específica de intervenção.
- source_word: τεύξεσθαι παρὰ τοῦ κυρίου
  choice: receberia ajuda da parte do Senhor
  rationale: 'τεύχομαι com genitivo comunica alcançar ou obter algo, enquanto παρά com genitivo marca a procedência: a ajuda vem do Senhor.'
theological_decisions:
- issue: Grau de certeza e esperança de Macabeu
  choice: permanecia sempre confiante, com toda a esperança
  alternative: tinha plena esperança
  rationale: Preserva a coexistência, no grego, da confiança contínua e da esperança, sem fundi-las nem transformar a expectativa em declaração de resultado já garantido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. “Macabeu” segue a forma tradicional portuguesa do nome; “Senhor” traduz κύριος sem introduzir uma identificação mais específica que o texto grego.
