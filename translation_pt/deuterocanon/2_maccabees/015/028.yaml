  yaml_path: translation/deuterocanon/2_maccabees/015/028.yaml
  text: But once they were relieved of the pressure, and as they withdrew with joy[c][b][a], they recognized Nikanor fallen forward with his armor.
translation:
  language: pt
  text: Mas, uma vez livres daquela necessidade[a], enquanto partiam com alegria[b], reconheceram Nicanor caído para a frente[c], com toda a sua armadura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “livres da urgência”, “aliviados da pressão” ou “libertos da crise”; a expressão grega é um tanto idiomática.
    reason: lexical_alternative
  - marker: b
    text: Ou “enquanto se retiravam com alegria” ou “enquanto se dispersavam com alegria”; o verbo pode indicar partida ou retirada.
    reason: lexical_alternative
  - marker: c
    text: Ou simplesmente “caído” ou “jazendo caído”; “caído para a frente” preserva a possível nuance direcional do verbo grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεγυμνωμένοι ἀπὸ τῆς χρείας
  choice: livres daquela necessidade
  rationale: A expressão combina o sentido literal de ter sido despojado ou desembaraçado com χρεία, 'necessidade' ou 'urgência'. A formulação conserva o caráter idiomático sem inserir explicitamente 'pressão' ou 'crise'.
- source_word: ἀναλύοντες
  choice: enquanto partiam
  rationale: O verbo pode indicar partir, retirar-se ou dispersar-se. 'Partiam' é natural e mantém a direção do movimento aberta, sem atribuir ao verbo o sentido específico de 'voltar'.
- source_word: ἐπέγνωσαν
  choice: reconheceram
  rationale: ἐπιγινώσκω aqui indica identificar ou reconhecer claramente a pessoa caída.
- source_word: προπεπτωκότα
  choice: caído para a frente
  rationale: A tradução preserva a possível nuance direcional do composto προπίπτω, embora o contexto também permita simplesmente 'caído'.
- source_word: σὺν τῇ πανοπλίᾳ
  choice: com toda a sua armadura
  rationale: πανοπλία designa o conjunto completo da armadura ou equipamento militar; 'toda a sua armadura' expressa essa plenitude em português corrente.
