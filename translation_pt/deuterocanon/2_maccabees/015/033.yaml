revisions:
- from: Depois de cortar a língua do ímpio Nicanor, ele disse que a daria, pedaço por pedaço, às aves e que penduraria, em frente ao templo, a paga de sua insensatez.[a]
  to: Depois de cortar a língua do ímpio Nicanor, ele disse que a lançaria, pedaço por pedaço, às aves e que penduraria, em frente ao templo, a paga de sua insensatez.[a]
  rationale: Substituído apenas «daria» por «lançaria», para refletir com maior fidelidade a ação violenta e concreta expressa no contexto, mantendo a sintaxe, o registro e a ambiguidade retributiva da expressão grega.
