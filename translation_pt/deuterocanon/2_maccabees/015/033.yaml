  yaml_path: translation/deuterocanon/2_maccabees/015/033.yaml
  text: And after cutting out the tongue of the ungodly Nikanor, he said he would throw it piece by piece to the birds, and hang up the wages of his folly opposite the temple.
translation:
  language: pt
  text: Depois de cortar a língua do ímpio Nicanor, ele disse que a lançaria, pedaço por pedaço, às aves e que penduraria, em frente ao templo, a paga de sua insensatez.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o castigo devido por sua insensatez”. A expressão grega pode indicar a retribuição ou aquilo que alguém recebe em troca de seus atos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσαν
  choice: língua
  rationale: O ato físico de cortá-la exige o sentido anatômico do termo, não os sentidos figurados de idioma ou fala.
- source_word: δυσσεβοῦς
  choice: ímpio
  rationale: Preserva a caracterização religiosa de Nicanor como alguém irreverente para com Deus, em linguagem bíblica clara e corrente.
- source_word: ἐκτεμών
  choice: depois de cortar
  rationale: Expressa naturalmente a anterioridade do particípio e a remoção física da língua.
- source_word: ἔφη
  choice: ele disse que
  rationale: Introduz em português natural o conteúdo e a intenção expressos pelos infinitivos no discurso indireto.
- source_word: μετὰ μέρος
  choice: pedaço por pedaço
  rationale: Comunica a divisão e entrega em porções, de modo vívido e adequado ao contexto.
- source_word: τοῖς ὄρνεσιν
  choice: às aves
  rationale: Representa diretamente o dativo de destinatário, mantendo um registro digno.
- source_word: τὰ δʼ ἐπίχειρα
  choice: a paga
  rationale: Conserva a ideia metafórica de retribuição recebida pelos próprios atos; o singular coletivo é idiomático em português.
- source_word: τῆς ἀνοίας
  choice: de sua insensatez
  rationale: Expressa a falta de juízo com seu tom moral, sem sugerir necessariamente uma condição clínica.
- source_word: κατέναντι τοῦ ναοῦ
  choice: em frente ao templo
  rationale: Mantém a referência espacial sem definir com precisão indevida se o objeto ficaria exatamente defronte ou apenas diante do templo.
- source_word: κρεμιάσαι
  choice: penduraria
  rationale: Comunica tanto a suspensão quanto a exposição pública pretendida.
theological_decisions:
- issue: Caracterização moral e religiosa de Nicanor em δυσσεβοῦς
  choice: ímpio
  alternative: irreverente
  rationale: “Ímpio” mantém a dimensão explicitamente religiosa do grego e continua compreensível no português moderno.
- issue: Sentido retributivo de τὰ ἐπίχειρα τῆς ἀνοίας
  choice: a paga de sua insensatez
  alternative: o castigo devido por sua insensatez
  rationale: A formulação principal preserva a metáfora de retribuição e a tensão entre recompensa e pena, sem transformar implicitamente a expressão em uma afirmação doutrinária sobre retribuição divina.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A construção evita arcaísmos, conserva a violência concreta do relato e não suaviza sua avaliação moral-religiosa.
