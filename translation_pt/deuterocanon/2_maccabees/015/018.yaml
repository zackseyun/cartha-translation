base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/018.yaml
  text: For the concern about wives and children[a], and further about brothers and relatives, weighed less with them[b], but the greatest and first fear was for the consecrated temple.
translation:
  language: pt
  text: Pois a preocupação com as esposas e os filhos, e também com os irmãos e parentes, tinha menor importância para eles[a]; mas o temor pelo templo consagrado era o maior e o primeiro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “jazia numa parte menor para eles”, isto é, tinha menos importância ou prioridade.
    reason: lexical_alternative
  - marker: b
    text: Ou “preocupação” ou “ansiedade”; neste contexto, o grego φόβος pode indicar tanto medo quanto preocupação diante do perigo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ περὶ γυναικῶν καὶ τέκνων
  choice: a preocupação com as esposas e os filhos
  rationale: O artigo com περὶ + genitivo substantiva a expressão e indica aquilo que lhes causava preocupação. No contexto familiar, γυναικῶν é naturalmente entendido como “esposas”, embora também possa significar “mulheres”.
- source_word: ἔτι δὲ ἀδελφῶν καὶ συγγενῶν
  choice: e também com os irmãos e parentes
  rationale: ἔτι δέ acrescenta outro grupo familiar; συγγενεῖς designa parentes ou pessoas da mesma parentela. A formulação é clara e corrente em português.
- source_word: ἐν ἥττονι μέρει κείμενος αὐτοῖς
  choice: ocupava para eles um lugar de menor importância
  rationale: A expressão grega diz literalmente que essa preocupação “jazia numa parte menor” para eles, isto é, tinha prioridade inferior. A tradução conserva a imagem espacial de modo compreensível.
- source_word: μέγιστος δὲ καὶ πρῶτος
  choice: mas o maior e principal
  rationale: A combinação de μέγιστος com πρῶτος intensifica a ideia de primazia. “Maior e principal” mantém os dois elementos sem soar artificial.
- source_word: ὁ περὶ τοῦ καθηγιασμένου ναοῦ φόβος
  choice: temor era pelo templo consagrado
  rationale: φόβος pode expressar temor ou preocupação ansiosa; “temor” preserva sua força emocional. καθηγιασμένου é um particípio perfeito que apresenta o templo como tendo sido consagrado.
theological_decisions:
- issue: Sentido de φόβος no contexto militar e religioso
  choice: temor
  alternative: preocupação ou ansiedade
  rationale: O termo inclui tanto medo quanto inquietação diante do perigo. “Temor” preserva a força do grego, enquanto a nota mantém aberta a nuance de preocupação ansiosa.
- issue: Tradução de καθηγιασμένου ναοῦ
  choice: templo consagrado
  alternative: templo santo ou templo santificado
  rationale: O particípio enfatiza o estado resultante da consagração do templo. “Consagrado” comunica essa ideia cultual com precisão e naturalidade.
- issue: Prioridade dada ao templo em comparação com a família
  choice: conservar explicitamente a comparação do texto
  alternative: suavizar a comparação como simples diferença de preocupações
  rationale: O grego declara que a preocupação com os familiares ocupava posição inferior e que o temor pelo templo era máximo e primeiro. A tradução mantém essa tensão sem explicá-la ou harmonizá-la teologicamente.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do grego sem rigidez excessiva. “Esposas”, “parentes”, “principal” e “consagrado” têm ampla compreensão no português internacional e boa legibilidade brasileira.
