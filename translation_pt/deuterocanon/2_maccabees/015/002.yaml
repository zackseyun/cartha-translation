base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/002.yaml
  text: But when the Jews who were being compelled to accompany him said[a], “Do not destroy them in so savage and barbarous a way; rather[b], assign honor to the day that has been specially honored in holiness by the One who watches over all,”
translation:
  language: pt
  text: 'Mas os judeus que eram obrigados a acompanhá-lo disseram: “De modo algum os destruas de maneira tão cruel e bárbara[a]; antes, dá a devida honra[b] ao dia que foi especialmente honrado como santo por Aquele que vela por todos”,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não os mates de maneira tão cruel e bárbara”. O verbo grego pode significar matar ou destruir.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “atribui honra/glória ao dia que foi preferido com santidade por Aquele que vela por todos”. A expressão pede que se demonstre o devido respeito pelo dia sagrado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ... Ἰουδαίων
  choice: os judeus
  rationale: Neste contexto, o termo designa o povo judeu como grupo étnico-religioso, e não apenas os habitantes da Judeia.
- source_word: κατὰ ἀνάγκην συνεπομένων αὐτῷ
  choice: que eram obrigados a acompanhá-lo
  rationale: Expressa claramente que acompanhavam Nicanor por coação, não como partidários voluntários.
- source_word: Μηδαμῶς
  choice: De modo algum
  rationale: Preserva a força enfática da proibição grega em português corrente e digno.
- source_word: ἀγρίως καὶ βαρβάρως
  choice: de maneira tão cruel e bárbara
  rationale: Mantém a dupla caracterização retórica da brutalidade; “cruel” comunica naturalmente o valor contextual de ἀγρίως.
- source_word: ἀπολέσῃς
  choice: destruas
  rationale: O verbo pode significar destruir ou matar. “Destruir” conserva sua amplitude, enquanto a nota registra a alternativa letal adequada ao contexto.
- source_word: δόξαν δὲ ἀπομέρισον
  choice: antes, dá a devida honra
  rationale: Comunica de modo natural a ideia de reservar ou atribuir honra ao dia, sem fazer de δόξα uma referência técnica à glória divina.
- source_word: τῇ προτετιμημένῃ ... ἡμέρᾳ
  choice: ao dia que foi especialmente honrado
  rationale: O particípio perfeito indica que o dia já recebeu distinção ou honra especial.
- source_word: ὑπὸ τοῦ πάντα ἐφορῶντος
  choice: por Aquele que vela por todos
  rationale: Preserva a circunlocução reverente para Deus e a nuance de seu olhar atento e providencial.
- source_word: μεθʼ ἁγιότητος
  choice: como santo
  rationale: Expressa em português natural o caráter sagrado sob o qual o dia foi distinguido, sem introduzir o verbo mais específico “santificar”.
theological_decisions:
- issue: Referência implícita a Deus em τοῦ πάντα ἐφορῶντος
  choice: Aquele que vela por todos
  alternative: aquele que vê todas as coisas
  rationale: Mantém a referência pessoal e reverente a Deus, bem como a ideia de supervisão, sem acrescentar terminologia teológica posterior.
- issue: Condição sagrada do dia
  choice: o dia que foi especialmente honrado como santo
  alternative: o dia santificado acima dos demais por Deus
  rationale: Preserva a distinção sagrada do dia sem converter a expressão grega em uma afirmação mais específica de que Deus o “santificou”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção foi tornada natural sem apagar a intensidade da proibição, a possível acepção letal de ἀπολέσῃς nem a formulação reverente e indireta para Deus.
