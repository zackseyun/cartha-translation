  yaml_path: translation/deuterocanon/2_maccabees/015/031.yaml
  text: And when he arrived there[a], he called together his fellow countrymen and the priests, stood them before the altar, and sent for those from the citadel.
translation:
  language: pt
  text: Ao chegar ali, ele reuniu seus compatriotas e os sacerdotes, colocou-os diante do altar e mandou chamar os que estavam na cidadela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente, “os da Acra”, a fortaleza de Jerusalém.
    reason: Registra a possível função de ἄκρα como designação histórica específica, além do sentido comum de “cidadela”.
lexical_decisions:
- source_word: παραγενόμενος
  choice: Ao chegar
  rationale: O particípio aoristo indica uma ação anterior às ações principais; a construção temporal é natural em português e preserva essa sequência.
- source_word: συγκαλεσάμενος
  choice: reuniu
  rationale: Expressa a convocação de pessoas para uma reunião, em linguagem corrente e concisa.
- source_word: τοὺς ὁμοεθνεῖς
  choice: seus compatriotas
  rationale: ὁμοεθνής designa pessoas do mesmo povo ou nação; “compatriotas” preserva esse vínculo sem explicitar além do grego que eram judeus.
- source_word: τοὺς ἱερεῖς
  choice: os sacerdotes
  rationale: Equivalente direto e natural do substantivo plural.
- source_word: πρὸ τοῦ θυσιαστηρίου στῆσας
  choice: colocou-os diante do altar
  rationale: 'O aoristo ativo στῆσας admite sentido causativo/transitivo, e os grupos anteriormente mencionados fornecem o objeto implícito mais natural: ele os pôs de pé ou os posicionou diante do altar.'
- source_word: μετεπέμψατο
  choice: mandou chamar
  rationale: Reproduz a ideia de enviar alguém para convocar outras pessoas à sua presença.
- source_word: τοὺς ἐκ τῆς ἄκρας
  choice: os que estavam na cidadela
  rationale: Identifica de modo natural as pessoas procedentes ou pertencentes à fortaleza; a possível referência específica à Acra de Jerusalém é preservada em nota.
theological_decisions:
- issue: Referência de ἄκρα na Jerusalém dos Macabeus
  choice: a cidadela
  alternative: a Acra
  rationale: A decisão é histórico-geográfica, não doutrinária. O texto principal mantém o sentido comum e acessível, enquanto a nota registra a provável identificação com a fortaleza conhecida como Acra.
- issue: Valor sintático de στῆσας
  choice: colocou-os diante do altar
  alternative: ficou de pé diante do altar
  rationale: A forma ativa causativa e os acusativos imediatamente anteriores favorecem a leitura transitiva, segundo a qual ele posicionou os compatriotas e sacerdotes diante do altar; a alternativa intransitiva é gramaticalmente menos provável neste contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação evita arcaísmos e mantém concisão narrativa.
