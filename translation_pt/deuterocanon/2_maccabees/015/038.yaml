base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/038.yaml
  text: So[a], since the events concerning Nicanor had turned out in this way, and from those times the city had remained in the possession of the Hebrews[b], I too will bring my account to a close here.
translation:
  language: pt
  text: Assim, já que os acontecimentos relativos a Nicanor tiveram esse desfecho, e desde aqueles tempos a cidade permaneceu sob o domínio dos hebreus[a], também eu encerrarei aqui o meu relato.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “a cidade foi mantida sob o controle dos hebreus”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, o narrador declara explicitamente que encerra neste ponto o seu relato escrito.
    reason: clarification
lexical_decisions:
- source_word: Τῶν ... κατὰ Νικάνορα χωρησάντων οὕτως
  choice: já que os acontecimentos relativos a Nicanor tiveram esse desfecho
  rationale: A construção absoluta resume retrospectivamente o resultado dos acontecimentos ligados a Nicanor. “Tiveram esse desfecho” comunica de modo natural o valor contextual de χωρέω e a referência retrospectiva de οὕτως.
- source_word: ἀπ᾿ ἐκείνων τῶν καιρῶν
  choice: desde aqueles tempos
  rationale: Mantém o plural do grego e expressa o ponto inicial da situação que continuou depois da derrota de Nicanor.
- source_word: κρατηθείσης τῆς πόλεως ὑπὸ τῶν Ἐβραίων
  choice: a cidade permaneceu sob o domínio dos hebreus
  rationale: κρατέω indica que a cidade foi mantida sob poder ou controle. “Permaneceu sob o domínio” transmite o estado continuado sugerido pelo contexto sem acrescentar a identificação explícita da cidade como Jerusalém.
- source_word: Ἐβραίων
  choice: hebreus
  rationale: Reproduz diretamente o etnônimo grego, sem substituí-lo por “judeus”, embora esse termo também pudesse ser natural no contexto histórico.
- source_word: καὶ αὐτὸς αὐτόθι τὸν λόγον καταπαύσω
  choice: também eu encerrarei aqui o meu relato
  rationale: “Também eu” preserva a ênfase autoral de καὶ αὐτός; “aqui” representa αὐτόθι, e “encerrarei ... o meu relato” expressa de modo digno e atual o sentido narrativo de τὸν λόγον καταπαύσω.
