base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/034.yaml
  text: And they all blessed the manifest Lord toward heaven[a], saying, “Blessed is the one who has kept his own place undefiled.”
translation:
  language: pt
  text: 'E todos, voltados para o céu, bendisseram o Senhor que se manifestou, dizendo: “Bendito seja aquele que preservou seu próprio lugar[a] livre de contaminação!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu próprio santuário” ou “seu próprio templo”. O grego diz “lugar”, mas o contexto provavelmente se refere ao lugar santo preservado da contaminação.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὸν οὐρανόν
  choice: voltados para o céu
  rationale: A expressão indica a direção celeste do louvor. A formulação portuguesa comunica naturalmente essa orientação sem fazer do céu o destinatário da bênção.
- source_word: εὐλόγησαν / Εὐλογητός
  choice: bendisseram / Bendito
  rationale: Mantém a ligação lexical e retórica entre o verbo e a aclamação seguinte, além de conservar o sentido religioso de εὐλογέω.
- source_word: τὸν ἐπιφανῆ κύριον
  choice: o Senhor que se manifestou
  rationale: Traduz ἐπιφανής como a manifestação evidente do Senhor em sua ação decisiva. A construção verbal é mais natural em português do que “o Senhor manifesto” e evita reduzir o termo ao sentido meramente estético de “glorioso”.
- source_word: διατηρήσας
  choice: manteve
  rationale: Expressa a preservação contínua do lugar no estado indicado pelo predicativo ἀμίαντον, com linguagem clara e concisa.
- source_word: τὸν ἑαυτοῦ τόπον
  choice: seu próprio lugar
  rationale: Conserva o termo amplo τόπος no texto principal, sem explicitar como templo ou santuário aquilo que o contexto sugere, mas o substantivo grego não especifica.
- source_word: ἀμίαντον
  choice: sem contaminação
  rationale: Preserva a ideia de pureza cultual e ausência de profanação em linguagem moderna e compreensível.
theological_decisions:
- issue: Se τὸν ἑαυτοῦ τόπον deve ser explicitamente interpretado como o santuário ou templo de Deus
  choice: Manter “seu próprio lugar” no texto principal
  alternative: “seu próprio santuário” ou “seu próprio templo”
  rationale: O contexto aponta fortemente para o lugar santo, mas τόπος é mais amplo que ναός ou ἱερόν. A opção principal preserva a formulação do grego, enquanto a nota registra a provável referência contextual.
- issue: Como representar τὸν ἐπιφανῆ κύριον
  choice: “o Senhor que se manifestou”
  alternative: “o Senhor manifesto” ou “o Senhor glorioso”
  rationale: A tradução escolhida comunica que o Senhor se tornou evidente por sua intervenção, sem converter necessariamente o adjetivo em um título técnico nem limitá-lo à ideia de esplendor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Bendisseram/Bendito” preserva a repetição enfática do grego; “voltados para o céu” evita a construção portuguesa ambígua de bendizer “ao céu”.
