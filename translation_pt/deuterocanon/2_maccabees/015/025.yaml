lexical_decisions:
- source_word: Οἱ δὲ περὶ τὸν Νικάνορα
  choice: Mas os homens que estavam com Nicanor
  rationale: A construção περὶ + acusativo designa os que cercavam ou acompanhavam um líder. A formulação identifica naturalmente o grupo de Nicanor sem especificar uma estrutura militar ausente do grego.
- source_word: σαλπίγγων
  choice: trombetas
  rationale: O genitivo plural após μετά expressa acompanhamento. “Trombetas” é o equivalente direto e evita associar o termo a um instrumento militar moderno mais específico.
- source_word: παιάνων
  choice: cânticos de guerra
  rationale: παιάν pode designar um canto triunfal ou marcial. “Cânticos de guerra” comunica de forma acessível o caráter musical e militar, enquanto a nota preserva a alternativa lexical mais técnica.
- source_word: προσῆγον
  choice: avançaram
  rationale: No contexto de batalha, o verbo descreve movimento em direção ao confronto. “Avançaram” preserva esse sentido direcional e militar.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla, com formulação natural no contexto narrativo militar. “Ao som de” explicita idiomaticamente o acompanhamento indicado por μετά sem alterar o conteúdo.
