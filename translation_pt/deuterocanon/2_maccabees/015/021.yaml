base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/021.yaml
  text: When Maccabeus saw the presence of the crowds[a], the varied array of weapons, and the savagery of the beasts positioned advantageously, he stretched out his hands to heaven and called on the wonder-working Lord, knowing that victory is not secured by weapons, but that, whenever it is judged right by him[b], he grants it to those who are worthy.
translation:
  language: pt
  text: Quando Macabeu viu a presença das multidões, o variado equipamento bélico e a ferocidade dos animais[a] colocados num local favorável, estendeu as mãos para o céu e invocou o Senhor que realiza maravilhas[b], sabendo que a vitória não depende das armas, mas que, conforme lhe parecia justo, ele a concede aos que são dignos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto, os animais provavelmente eram elefantes de guerra, embora o grego diga apenas «animais».
    reason: cultural_note
  - marker: b
    text: 'Ou: «o Senhor que realiza milagres».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδών
  choice: viu
  rationale: Introduz a percepção de Macabeu diante do cenário de batalha; «viu» é natural e suficientemente amplo no contexto.
- source_word: τὴν τῶν πλήθων παρουσίαν
  choice: a presença das multidões
  rationale: Mantém de perto a formulação grega e comunica a presença intimidadora das forças reunidas sem reduzi-la apenas ao número.
- source_word: τῶν ὅπλων τὴν ποικίλην παρασκευήν
  choice: a variedade do equipamento das armas
  rationale: παρασκευή pode indicar preparação ou equipamento; ligado a «armas», aponta para o aparelhamento militar diversificado.
- source_word: θηρίων
  choice: animais
  rationale: Preserva a referência genérica do grego sem identificar no texto principal os animais como elefantes.
- source_word: ἐπὶ μέρος εὔκαιρον
  choice: colocados em posição estratégica
  rationale: Expressa a disposição tática dos animais num ponto adequado ou vantajoso.
- source_word: ἀγριότητα
  choice: ferocidade
  rationale: Comunica a natureza ameaçadora e violenta dos animais em português corrente.
- source_word: ἀνατείνας χεῖρας εἰς τὸν οὐρανόν
  choice: estendeu as mãos para o céu
  rationale: Conserva a imagem concreta do gesto tradicional de oração.
- source_word: τερατοποιὸν κύριον
  choice: o Senhor que realiza maravilhas
  rationale: Reproduz o sentido de agente expresso pelo adjetivo e mantém um tom elevado sem recorrer a uma construção pouco natural.
- source_word: καθὼς δὲ ἐὰν αὐτῷ κριθῇ
  choice: conforme julgar melhor
  rationale: Expressa que a concessão da vitória depende do juízo soberano do Senhor, preservando a formulação condicional.
- source_word: περιποιεῖται τὴν νίκην
  choice: concede a vitória
  rationale: O verbo tem aqui o sentido de obter ou assegurar algo em favor de alguém; «concede» torna clara a agência divina.
- source_word: τοῖς ἀξίοις
  choice: aos que são dignos
  rationale: Mantém a força avaliativa da expressão sem definir em que consiste essa dignidade.
theological_decisions:
- issue: Agência divina na vitória
  choice: A vitória não depende das armas, mas é concedida pelo Senhor conforme o seu juízo.
  alternative: A vitória ocorre exclusivamente por intervenção milagrosa, sem qualquer papel de meios humanos.
  rationale: O grego contrapõe as armas à decisão e à concessão do Senhor, subordinando o poder militar à agência divina sem formular uma negação geral de todo meio humano.
- issue: Dignidade dos destinatários
  choice: Preservar «aos que são dignos».
  alternative: Interpretar a expressão como mérito pelo qual eles necessariamente conquistam a vitória.
  rationale: O texto contém uma avaliação de dignidade, mas não explica sua base nem estabelece uma doutrina completa de mérito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe preserva a progressão do período grego, mas evita rigidez excessiva; as ambiguidades sobre os animais, a dignidade e a agência divina foram mantidas.
