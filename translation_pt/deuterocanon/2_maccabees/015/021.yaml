revisions:
- from: Quando Macabeu viu a presença das multidões, a variedade do equipamento das armas e a ferocidade dos animais colocados em posição estratégica[a], estendeu as mãos para o céu e invocou o Senhor que realiza maravilhas[b], sabendo que a vitória não depende das armas, mas que ele a concede aos que são dignos, conforme julgar melhor.
