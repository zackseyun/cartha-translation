  text: 'Then Jeremiah stretched out his right hand and handed Judas a golden sword, and as he gave it he addressed him with these words:'
translation:
  language: pt
  text: 'Então Jeremias estendeu a mão direita e entregou a Judas uma espada de ouro. Ao entregá-la, dirigiu-lhe estas palavras:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προτείναντα
  choice: estendeu
  rationale: O particípio de προτείνω descreve o gesto de estender a mão para a frente; “estendeu” é natural e fiel em português.
- source_word: τὴν δεξιὰν
  choice: a mão direita
  rationale: O grego diz literalmente “a direita”, com “mão” subentendida; explicitá-la é necessário para uma expressão portuguesa natural.
- source_word: παραδοῦναι
  choice: entregou
  rationale: No contexto, o verbo indica transferir a espada para a posse de Judas. “Entregou” preserva essa nuance melhor que o simples “deu”.
- source_word: Ἰούδα
  choice: Judas
  rationale: “Judas” é a forma portuguesa tradicional e reconhecível do nome de Judas Macabeu.
- source_word: ῥομφαίαν χρυσῆν
  choice: uma espada de ouro
  rationale: ῥομφαία designa uma espada ou lâmina grande; “espada” é a designação geral mais clara. “De ouro” expressa naturalmente o material indicado por χρυσῆν.
- source_word: διδόντα
  choice: Ao entregá-la
  rationale: O particípio indica que a fala acompanha o ato de entrega. A construção mantém essa simultaneidade sem tornar o período pesado.
- source_word: προσφωνῆσαι τάδε
  choice: dirigiu-lhe estas palavras
  rationale: προσφωνέω significa dirigir-se verbalmente a alguém, e τάδε introduz a fala seguinte. A formulação conserva o tom formal e prepara a citação.
theological_decisions:
- issue: Apresentação visionária de Jeremias concedendo uma arma
  choice: Narrar diretamente a ação, sem acrescentar no versículo que ela ocorre em uma visão.
  alternative: Inserir uma expressão como “na visão” para explicitar o contexto.
  rationale: O grego deste versículo apenas relata a ação de Jeremias; o caráter visionário já é estabelecido pelo contexto próximo. Acrescentá-lo aqui introduziria informação ausente desta linha.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases evita uma coordenação excessivamente longa e preserva a relação temporal dos particípios gregos.
