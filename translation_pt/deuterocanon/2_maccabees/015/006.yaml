  text: And Nicanor[a], in complete confidence and with arrogant pride, had decided to make a public example of those with Judas.
translation:
  language: pt
  text: Nicanor, porém, completamente confiante e cheio de arrogância, já tinha decidido dar um destino comum aos que estavam com Judas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “impor um tratamento comum ao grupo de Judas”. A expressão grega κοινὸν ... τρόπον é idiomática e de sentido incerto; pode referir-se a um tratamento ou destino comum para os associados de Judas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν Νικάνωρ
  choice: Quanto a Nicanor
  rationale: A construção com μέν introduz Nicanor e prepara um contraste com o que segue. “Quanto a” expressa essa transição sem acrescentar conteúdo.
- source_word: μετὰ πάσης ἀσφαλείας
  choice: sentindo-se completamente seguro
  rationale: Neste contexto, a expressão indica plena confiança ou sensação de segurança, não necessariamente proteção física.
- source_word: ὑψαυχενῶν
  choice: cheio de arrogância
  rationale: O particípio descreve altivez e orgulho insolente. A formulação comunica com naturalidade o tom moral do grego.
- source_word: διεγνώκει
  choice: já havia decidido
  rationale: O mais-que-perfeito apresenta uma decisão firme tomada anteriormente; “já havia decidido” preserva esse valor temporal.
- source_word: κοινὸν ... τρόπον συστήσασθαι
  choice: fazer ... um exemplo público
  rationale: A expressão é idiomática e difícil de reproduzir literalmente. A tradução comunica o provável sentido de impor ao grupo um tratamento público e exemplar, sem introduzir a ideia não expressa de destruição.
- source_word: τῶν περὶ τὸν Ἰούδαν
  choice: dos que estavam com Judas
  rationale: A expressão designa o grupo ligado a Judas, sem se limitar a Judas nem especificar além do texto que eram apenas soldados.
