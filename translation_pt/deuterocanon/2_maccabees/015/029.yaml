  yaml_path: translation/deuterocanon/2_maccabees/015/029.yaml
  text: And when a cry and turmoil arose[b][a], they blessed the Sovereign in their ancestral language.
translation:
  language: pt
  text: Quando surgiram um clamor e um tumulto, eles bendiziam o Soberano[a] em sua língua ancestral[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Poderoso” ou “o Governante”; o título grego designa aquele que possui poder ou autoridade.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com a voz ancestral”; a expressão provavelmente significa que bendiziam a Deus em sua língua tradicional ou nativa.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης
  choice: Quando se levantaram
  rationale: O particípio aoristo em genitivo absoluto expressa uma circunstância temporal. A formulação com “quando” é natural em português e conserva o sentido de que o clamor e o tumulto surgiram.
- source_word: κραυγῆς
  choice: um clamor
  rationale: κραυγή indica um grito forte ou clamor. “Clamor” preserva o singular e a intensidade sem definir indevidamente se eram gritos de guerra, celebração ou outra espécie de brado.
- source_word: ταραχῆς
  choice: um tumulto
  rationale: ταραχή denota agitação, confusão ou desordem. “Tumulto” é claro e vigoroso no contexto narrativo.
- source_word: εὐλόγουν
  choice: bendiziam
  rationale: O imperfeito de εὐλογέω sugere ação em curso. “Bendiziam” preserva a linguagem de bênção dirigida a Deus, em vez de reduzi-la à ideia mais geral de louvor.
- source_word: τὸν δυνάστην
  choice: o Soberano
  rationale: δυνάστης designa quem detém poder ou autoridade. Como título divino neste contexto, “Soberano” comunica poder e governo com dignidade, sem recorrer a uma forma arcaica.
- source_word: τῇ πατρίῳ φωνῇ
  choice: em sua língua ancestral
  rationale: A expressão dativa indica meio ou modo. Embora φωνή signifique literalmente “voz”, aqui pode designar a fala ou língua; “língua ancestral” comunica de modo natural a referência à tradição linguística do povo.
theological_decisions:
- issue: Tradução do título divino τὸν δυνάστην
  choice: o Soberano
  alternative: o Poderoso; o Governante
  rationale: “Soberano” mantém tanto a autoridade quanto o poder contidos no título grego, sem importar um título divino mais específico que não aparece no texto. A nota preserva as alternativas lexicais legítimas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Bendiziam” conserva o valor religioso de εὐλογέω e o aspecto durativo do imperfeito; “língua ancestral” esclarece o provável sentido idiomático sem ocultar a forma literal, registrada em nota.
