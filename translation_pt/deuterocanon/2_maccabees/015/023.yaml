  yaml_path: translation/deuterocanon/2_maccabees/015/023.yaml
  text: And now[a], O Sovereign of the heavens, send a good angel before us for fear and trembling.
translation:
  language: pt
  text: E agora, ó Soberano dos céus, envia um anjo bom à nossa frente para causar temor e tremor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “à nossa frente, para temor e tremor”. O grego não declara explicitamente quem sentiria esse temor, embora o contexto sugira os inimigos.'
    reason: Alternativa lexical e preservação da ambiguidade do referente.
lexical_decisions:
- source_word: δυνάστα
  choice: Soberano
  rationale: O vocativo de δυνάστης designa quem detém poder e autoridade. “Soberano” conserva o tom elevado e a ideia de governo na invocação.
- source_word: τῶν οὐρανῶν
  choice: dos céus
  rationale: Mantém o plural do grego e soa natural no registro bíblico em português.
- source_word: ἀπόστειλον
  choice: envia
  rationale: Traduz diretamente o imperativo aoristo de ἀποστέλλω como uma súplica dirigida a Deus.
- source_word: ἄγγελον ἀγαθὸν
  choice: um anjo bom
  rationale: Neste contexto militar e religioso, ἄγγελος indica um ser angelical; “bom” preserva o sentido simples de ἀγαθός sem ampliá-lo interpretativamente.
- source_word: ἔμπροσθεν ἡμῶν
  choice: à nossa frente
  rationale: Expressa de modo corrente que o anjo deve ir adiante do grupo, preservando a dimensão espacial da frase.
- source_word: εἰς δέος καὶ τρόμον
  choice: para causar temor e tremor
  rationale: Entende εἰς como finalidade ou resultado e verte o par grego de modo claro, sem acrescentar no texto quem experimentará essas emoções.
theological_decisions:
- issue: Referente de “temor e tremor”
  choice: Expressar o efeito pretendido sem identificar explicitamente quem sentirá temor e tremor.
  alternative: Traduzir de modo mais formal como “para temor e tremor”.
  rationale: O contexto militar sugere que o efeito recairá sobre os inimigos, mas o grego não declara o referente. A tradução preserva essa ausência de objeto explícito, enquanto comunica o valor final/resultativo de εἰς.
translation_notes:
  register: Português moderno, claro e digno, com leve elevação própria de uma oração. “Soberano dos céus” conserva a solenidade e o plural do original; “à nossa frente” é mais corrente do que “diante de nós” para a ideia de avançar à frente de um exército.
