base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/014.yaml
  text: Then Onias answered and said[a], “This is Jeremiah, the prophet of God, who loves his brothers and prays much for the people and the holy city.”
translation:
  language: pt
  text: 'Então Onias respondeu: “Este é Jeremias, o profeta de Deus, aquele que ama seus irmãos[a] e ora muito pelo povo e pela cidade santa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele que ama os irmãos”. O termo grego significa literalmente alguém que ama os irmãos e, neste contexto, expressa afeição por seu próprio povo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντα δὲ τὸν Ὀνίαν εἰπεῖν
  choice: Então Onias respondeu
  rationale: A construção participial seguida de εἰπεῖν introduz a fala; em português narrativo, “respondeu” expressa naturalmente o conjunto sem a redundância pouco idiomática de “respondeu e disse”.
- source_word: φιλάδελφος
  choice: aquele que ama seus irmãos
  rationale: Preserva a imagem familiar do adjetivo grego, literalmente relacionado ao amor aos irmãos, e comunica de modo natural a afeição de Jeremias por seus compatriotas.
- source_word: πολλὰ προσευχόμενος
  choice: ora muito
  rationale: Mantém o valor descritivo do particípio e a força adverbial de πολλὰ, indicando intercessão abundante ou frequente sem especificar além do grego.
- source_word: λαοῦ
  choice: o povo
  rationale: Equivalência direta que, no contexto, se refere ao povo de Israel sem acrescentar o possessivo “seu”, ausente do grego.
- source_word: τῆς ἁγίας πόλεως
  choice: a cidade santa
  rationale: Tradução direta e consagrada, preservando a qualificação de santidade aplicada à cidade.
- source_word: ὁ τοῦ θεοῦ προφήτης
  choice: o profeta de Deus
  rationale: Segue de perto a estrutura grega e é natural em português.
theological_decisions:
- issue: Sentido comunitário de φιλάδελφος na visão de Jeremias intercedendo por Israel
  choice: aquele que ama seus irmãos
  alternative: aquele que ama seus compatriotas
  rationale: “Irmãos” conserva a metáfora familiar e a possível tensão entre parentesco e solidariedade nacional; “compatriotas” explicitaria o sentido contextual, mas reduziria a imagem do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para uma apresentação natural em português, mantendo Jeremias identificado como profeta de Deus e como aquele que ama e intercede.
