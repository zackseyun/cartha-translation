  yaml_path: translation/deuterocanon/2_maccabees/015/010.yaml
  text: And after stirring up their spirits[a], he urged them on[b], at the same time pointing out the godlessness of the nations and the violation of oaths.
translation:
  language: pt
  text: E, depois de lhes despertar o ânimo, ele os exortou, mostrando ao mesmo tempo a impiedade das nações[a] e a quebra dos juramentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dos gentios”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς θυμοῖς διεγείρας αὐτούς
  choice: depois de lhes despertar o ânimo
  rationale: A expressão descreve o despertar da disposição interior dos combatentes. “Ânimo” conserva a amplitude de θυμός — ardor, coragem, paixão ou ira — sem reduzir o sentido apenas à raiva.
- source_word: παρήγγειλεν
  choice: ele os exortou
  rationale: No contexto de uma convocação militar, o verbo tem força diretiva e motivadora. “Exortou” comunica ambas sem impor a ideia mais estrita de uma ordem formal.
- source_word: ἅμα παρειδείκνυς
  choice: mostrando ao mesmo tempo
  rationale: A construção participial indica uma ação simultânea à exortação e apresenta o que ele colocava diante dos ouvintes.
- source_word: τὴν τῶν ἐθνῶν ἀθεσίαν
  choice: a impiedade das nações
  rationale: “Impiedade” expressa a censura religiosa de ἀθεσία. “Nações” é adequado ao cenário histórico e mantém aberta a possibilidade semântica de “gentios”.
- source_word: τὴν τῶν ὅρκων παράβασιν
  choice: a quebra dos juramentos
  rationale: A expressão portuguesa é natural e comunica claramente a violação de compromissos juramentados. O texto grego não declara explicitamente de quem eram os juramentos, por isso não se acrescentou pronome possessivo.
theological_decisions:
- issue: Sentido de ἐθνῶν
  choice: nações
  alternative: gentios
  rationale: No relato histórico, “nações” designa de modo natural os povos estrangeiros, sem importar conotações confessionais posteriores; a alternativa legítima é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. “Despertar o ânimo” evita restringir θυμός exclusivamente à coragem ou à ira; “quebra dos juramentos” mantém a formulação impessoal do grego.
