base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/005.yaml
  text: But the other said[a], “I also am a ruler upon the earth[b], the one who commands men to take up arms and to carry out the king’s business.” Yet he did not prevail to accomplish his savage purpose.
translation:
  language: pt
  text: 'Mas o outro disse: “Eu também sou um governante sobre a terra, aquele que ordena tomar as armas[a] e executar os encargos do rei.” Contudo, ele não conseguiu levar a cabo seu propósito cruel.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “portar armas”. Em grego, literalmente, “levantar/tomar as armas”, expressão ligada à ação militar.
    reason: lexical_alternative
  - marker: b
    text: Ou “seu plano atroz” ou “sua resolução monstruosa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάστης
  choice: governante
  rationale: Designa alguém que detém poder ou domínio. “Governante” é claro e atual, sem atribuir ao personagem o título mais específico de rei ou soberano.
- source_word: προστατάσσων
  choice: aquele que ordena
  rationale: Preserva o caráter autoritativo e descritivo do particípio grego, indicando alguém que dá ordens.
- source_word: αἴρειν τὰ ὅπλα
  choice: tomar as armas
  rationale: Reproduz de modo idiomático a expressão militar grega, cujo sentido literal é levantar ou tomar as armas.
- source_word: τὰς βασιλικὰς χρείας ἐπιτελεῖν
  choice: executar os encargos do rei
  rationale: χρείας abrange assuntos, serviços ou incumbências; no contexto, a expressão indica tarefas oficiais ligadas ao rei, sem restringi-las a deveres cerimoniais.
- source_word: ὅμως
  choice: Contudo
  rationale: Marca com clareza o forte contraste entre a alegação de autoridade do personagem e seu fracasso.
- source_word: οὐ κατέσχεν
  choice: não conseguiu
  rationale: No contexto, comunica que ele não prevaleceu nem teve êxito em concretizar sua intenção, em português natural.
- source_word: ἐπιτελέσαι
  choice: levar a cabo
  rationale: Expressa a ideia de completar ou realizar plenamente aquilo que se pretendia.
- source_word: σχέτλιον
  choice: cruel
  rationale: Transmite a forte censura moral do adjetivo, que pode caracterizar algo cruel, atroz ou monstruoso.
- source_word: βούλημα
  choice: propósito
  rationale: Indica intenção deliberada ou resolução, sem acrescentar detalhes que o grego não especifica.
theological_decisions:
- issue: Identificação do personagem como autoridade terrena no contexto visionário
  choice: “Eu também sou um governante sobre a terra”
  alternative: “Eu também sou rei na terra” ou “Eu também exerço domínio sobre a terra”
  rationale: A tradução conserva a autodescrição do personagem sem identificá-lo além do que o texto afirma e sem transformar δυνάστης no título mais específico de rei.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Executar os encargos do rei” mantém o caráter oficial de βασιλικὰς χρείας; “levar a cabo” preserva a ideia de consumação expressa por ἐπιτελέσαι. Os marcadores das notas foram colocados junto às expressões a que efetivamente se referem.
