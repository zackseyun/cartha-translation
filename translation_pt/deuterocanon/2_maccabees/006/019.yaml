  yaml_path: translation/deuterocanon/2_maccabees/006/019.yaml
  text: But he[a], choosing death with honor rather than life with defilement, went to the rack of his own accord,
translation:
  language: pt
  text: Mas ele, preferindo a morte com honra a uma vida com impureza, dirigiu-se por vontade própria ao instrumento de tortura[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, «tímpano» ou «tambor»; trata-se de um instrumento de tortura, cuja forma exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετʼ εὐκλείας θάνατον
  choice: a morte com honra
  rationale: Mantém o substantivo «morte» e expressa εὐκλεία como honra ou boa reputação, em contraste direto com a vida marcada por profanação.
- source_word: μᾶλλον ἢ
  choice: preferindo... a
  rationale: Reproduz de modo natural em português a comparação pela qual uma opção é estimada acima da outra.
- source_word: μετὰ μύσους βίον
  choice: a vida com profanação
  rationale: μύσος pode indicar impureza, contaminação ou profanação moral e ritual. «Profanação» preserva a força religiosa do contexto sem limitar o termo a uma categoria cerimonial específica.
- source_word: ἀναδεξάμενος
  choice: preferindo
  rationale: No contexto, o particípio indica aceitação deliberada da morte; combinado com μᾶλλον ἢ, «preferindo» comunica de forma concisa a decisão consciente entre morte e vida.
- source_word: αὐθαιρέτως
  choice: por vontade própria
  rationale: Expressa claramente que ele agiu voluntariamente, sem sugerir que foi conduzido passivamente.
- source_word: ἐπὶ τὸ τύμπανον
  choice: ao cavalete de tortura
  rationale: τύμπανον designa aqui um instrumento de suplício. «Cavalete de tortura» comunica sua função ao leitor moderno, enquanto a nota registra o termo literal e a incerteza quanto ao formato exato.
- source_word: προσῆγεν
  choice: dirigiu-se
  rationale: O verbo, junto de αὐθαιρέτως, descreve seu avanço voluntário até o instrumento; «dirigiu-se» é natural e evita a ideia de que outros o levaram.
theological_decisions:
- issue: Sentido de μύσος no contexto do martírio
  choice: profanação
  alternative: impureza; contaminação; desonra
  rationale: A escolha conserva a dimensão moral e religiosa da conduta imposta a Eleazar, sem transformar o termo em uma formulação doutrinária mais específica do que o grego.
- issue: Identificação de τύμπανον
  choice: cavalete de tortura
  alternative: tímpano; tambor; roda de tortura
  rationale: O contexto exige um aparelho de suplício, mas sua forma exata é incerta. A tradução funcional favorece a compreensão, e a nota preserva a literalidade e a incerteza histórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção paralela «morte com honra» / «vida com profanação» preserva o contraste do grego; a vírgula final foi mantida porque o versículo prossegue na frase seguinte.
