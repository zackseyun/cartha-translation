  text: And the pressure of this evil was harsh and grievous for everyone[a].
translation:
  language: pt
  text: A imposição desse mal foi severa e difícil de suportar para todos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A pressão desse mal foi dura e penosa para todos” ou “A chegada desse mal foi severa e penosa para todos”.'
    reason: Alternativas lexicais para ἐπίστασις e para o par χαλεπή … δυσχερής.
lexical_decisions:
- source_word: χαλεπὴ
  choice: severa
  rationale: Expressa a intensidade e a dureza da situação, em linguagem portuguesa natural e digna.
- source_word: δυσχερὴς
  choice: difícil de suportar
  rationale: Preserva a ideia de algo penoso, opressivo ou difícil de aguentar, distinguindo-a de χαλεπή.
- source_word: τοῖς ὅλοις
  choice: para todos
  rationale: Reproduz de modo claro e idiomático o alcance universal da expressão grega.
- source_word: ἡ ἐπίστασις
  choice: a imposição
  rationale: No contexto, designa a incidência ou aplicação opressiva do mal descrito, e não mero conhecimento; “imposição” mantém a ação externa sobre o povo.
- source_word: τῆς κακίας
  choice: desse mal
  rationale: Aponta concretamente para a política perversa e opressiva já narrada, sem especificar além do que o grego permite.
theological_decisions:
- issue: Referente de κακία no contexto
  choice: Referência concreta ao mal opressivo já descrito
  alternative: O mal em sentido abstrato ou a maldade como qualidade pessoal
  rationale: O contexto trata de profanação e perseguição impostas. A formulação “desse mal” conserva a ligação narrativa sem transformar a frase numa máxima geral.
- issue: Sentido de ἐπίστασις
  choice: A imposição do mal
  alternative: A pressão ou a chegada desse mal
  rationale: O substantivo admite nuances de incidência, pressão ou imposição. O texto principal destaca a ação opressiva aplicada ao povo, enquanto a nota preserva alternativas legítimas.
translation_notes:
  register: Português contemporâneo, amplamente internacional e de fácil leitura no Brasil. A formulação mantém tom narrativo digno e conserva, em nota, a ambiguidade lexical de ἐπίστασις.
