base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/031.yaml
  text: So then[a], in this way he passed away, leaving behind his own death as an example of courage and a memorial of virtue[c][b], not only for the young but also for most of the nation.
translation:
  language: pt
  text: Assim, ele faleceu[a] desse modo, deixando a própria morte como exemplo de coragem[b] e memorial de virtude[c], não somente para os jovens, mas também para a maioria do povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “morreu”. O grego emprega uma expressão mais elevada que o verbo comum para morrer.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “nobreza de caráter” ou “bravura”.
    reason: lexical_alternative
  - marker: c
    text: Ou “memorial de excelência moral”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετήλλαξεν
  choice: faleceu
  rationale: O verbo é uma expressão elevada e eufemística para morrer. “Faleceu” preserva a dignidade do relato e permanece claro em português atual.
- source_word: τοῦτον τὸν τρόπον
  choice: desse modo
  rationale: Expressa diretamente a maneira pela qual ocorreu a morte e produz uma formulação natural em português.
- source_word: ὑπόδειγμα
  choice: exemplo
  rationale: Designa algo apresentado como padrão a ser imitado; “exemplo” é claro e idiomático.
- source_word: γενναιότητος
  choice: coragem
  rationale: No contexto da morte deliberadamente exemplar de Eleazar, o termo ressalta valentia e grandeza de ânimo. “Coragem” comunica esse valor sem restringi-lo à bravura militar.
- source_word: μνημόσυνον
  choice: memorial
  rationale: Denota aquilo que conserva ou perpetua a lembrança; “memorial” mantém o tom solene e comemorativo.
- source_word: ἀρετῆς
  choice: virtude
  rationale: Aqui indica excelência moral. “Virtude” preserva a concisão e a força ética do grego.
- source_word: τοῖς νέοις
  choice: para os jovens
  rationale: O dativo indica os destinatários ou beneficiários do exemplo; a expressão é natural e não especifica gênero indevidamente.
- source_word: τοῖς πλείστοις τοῦ ἔθνους
  choice: para a maior parte da nação
  rationale: Traduz πλείστοις sem convertê-lo em totalidade e conserva o sentido coletivo e nacional de ἔθνος.
- source_word: καταλιπών
  choice: deixando
  rationale: O particípio descreve o legado resultante da morte de Eleazar. “Deixando” expressa isso de modo claro, sem acrescentar a ideia jurídica de legado.
theological_decisions:
- issue: Terminologia moral no relato de martírio
  choice: Traduzir γενναιότης por “coragem” e ἀρετή por “virtude”.
  alternative: “nobreza” e “excelência moral”
  rationale: A combinação mantém a força ética e exemplar da morte de Eleazar sem importar categorias doutrinárias posteriores. “Coragem” é especialmente adequada ao contexto, enquanto a nota preserva a amplitude de γενναιότης.
- issue: Expressão eufemística para a morte
  choice: Usar “faleceu”.
  alternative: “morreu” ou “partiu desta vida”
  rationale: “Faleceu” reflete o caráter elevado e eufemístico de μετήλλαξεν sem soar obscuro ou excessivamente ornamentado.
- issue: Alcance dos beneficiários do exemplo
  choice: Manter “a maior parte da nação”.
  alternative: “a maioria do povo”
  rationale: A formulação conserva tanto o valor não totalizante de πλείστοις quanto a dimensão coletiva de ἔθνος, sem ampliar o texto para toda a nação.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A ordem foi levemente ajustada para fluência, sem alterar as relações sintáticas nem a ambiguidade lexical relevante.
