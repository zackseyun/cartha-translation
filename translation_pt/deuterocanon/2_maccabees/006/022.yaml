    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: para que
  rationale: Introduz a finalidade da ação e mantém de modo natural em português a força final da conjunção grega.
- source_word: τοῦτο πράξας
  choice: depois de fazer isso
  rationale: O particípio aoristo indica uma ação anterior à dos verbos principais; esta formulação torna clara essa sequência sem rigidez excessiva.
- source_word: ἀπολυθῇ τοῦ θανάτου
  choice: fosse poupado da morte
  rationale: No contexto, a expressão significa ser solto ou preservado da execução. A formulação é natural em português e evita sugerir uma afirmação sobre salvação ou vida após a morte.
- source_word: διὰ τὴν ἀρχαίαν πρὸς αὐτοὺς φιλίαν
  choice: por causa da antiga amizade que tinha com eles
  rationale: Preserva o caráter antigo ou duradouro da amizade e explicita de maneira idiomática a relação indicada por πρὸς αὐτούς, sem alterar seu sentido.
- source_word: τύχοι φιλανθρωπίας
  choice: recebesse benevolência
  rationale: τυγχάνω com genitivo tem o sentido de obter ou receber; φιλανθρωπία designa bondade, humanidade ou tratamento benevolente. “Benevolência” conserva essa amplitude.
theological_decisions:
- issue: Sentido de ἀπολυθῇ τοῦ θανάτου
  choice: Ser poupado da morte, isto é, da execução
  alternative: Ser libertado da morte
  rationale: A expressão pertence ao contexto narrativo e judicial imediato. A tradução evita introduzir conotações doutrinárias de libertação espiritual ou de vida após a morte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém a finalidade e a sequência temporal do grego; as notas registram alternativas legítimas sem sobrecarregar o texto principal.
