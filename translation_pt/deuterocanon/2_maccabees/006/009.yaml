  text: But those who did not choose to adopt the Greek ways were to be slaughtered[a]. Thus one could see the present misery.
translation:
  language: pt
  text: Mas os que não escolhessem adotar os costumes gregos seriam massacrados.[a] Assim, podia-se ver a miséria presente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “passar para os costumes gregos”. A expressão grega significa literalmente “passar para as coisas gregas” e se refere, de modo amplo, aos costumes e às práticas helenísticas.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ προαιρουμένους
  choice: os que não escolhessem
  rationale: Preserva a ideia de decisão deliberada expressa por προαιρέομαι, sem acrescentar motivos não declarados.
- source_word: μεταβαίνειν ἐπὶ τὰ Ἑλληνικά
  choice: adotar os costumes gregos
  rationale: Traduz idiomaticamente o sentido de passar para o conjunto de práticas e modos de vida helenísticos; a nota conserva a imagem literal e a amplitude da expressão.
- source_word: κατασφάζειν
  choice: seriam massacrados
  rationale: Mantém a força violenta do verbo, mais intensa do que simplesmente 'matar', e expressa naturalmente em português a determinação do decreto.
- source_word: παρῆν οὖν ὁρᾶν
  choice: Assim, podia-se ver
  rationale: Reproduz de modo natural a construção impessoal que apresenta uma realidade claramente observável.
- source_word: τὴν ἐνεστῶσαν ταλαιπωρίαν
  choice: a miséria presente
  rationale: Representa diretamente ἐνεστῶσαν como aquilo que estava então presente ou em curso, sem introduzir uma noção adicional de chegada.
theological_decisions:
- issue: Alcance de ἐπὶ τὰ Ἑλληνικά
  choice: adoção dos costumes gregos
  alternative: tornar-se grego etnicamente ou adotar apenas a língua grega
  rationale: No contexto, a expressão abrange práticas e modo de vida helenísticos, inclusive sua dimensão cultural e religiosa, mas não afirma transformação étnica nem se limita ao idioma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'Costumes gregos' é mais idiomático em português do que uma reprodução literal de 'as coisas gregas'; 'massacrados' conserva a brutalidade do original.
