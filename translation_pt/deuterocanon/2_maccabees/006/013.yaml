  yaml_path: translation/deuterocanon/2_maccabees/006/013.yaml
  text: For indeed[a], not allowing those who act impiously to go on for a long time, but immediately bringing punishments upon them, is a sign of great kindness.
translation:
  language: pt
  text: Pois o fato de não deixar que os que agem com impiedade prossigam por muito tempo, mas de fazê-los incorrer imediatamente em castigos, é sinal de grande bondade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois não deixar os que agem com impiedade continuar por muito tempo, mas fazê-los logo incorrer em penalidades, é sinal de grande benevolência.”'
    reason: Registra alternativas legítimas para ἐᾶσθαι, ἐπιτίμια e εὐεργεσία, conservando a ambiguidade lexical sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: τὸ μὴ πολὺν χρόνον ἐᾶσθαι
  choice: o fato de não deixar que ... prossigam por muito tempo
  rationale: A construção com infinitivo articular funciona como sujeito da oração. “Não deixar que ... prossigam” comunica naturalmente que essas pessoas não têm permissão para continuar por longo tempo sem intervenção.
- source_word: τοὺς δυσσεβοῦντας
  choice: os que agem com impiedade
  rationale: Preserva a força verbal do particípio grego, descrevendo uma conduta, em vez de fixar as pessoas numa categoria estática como “os ímpios”.
- source_word: ἀλλʼ εὐθέως
  choice: mas ... imediatamente
  rationale: Mantém o contraste entre uma longa demora e a pronta aplicação do castigo.
- source_word: περιπίπτειν τοῖς ἐπιτιμίοις
  choice: fazê-los incorrer ... em castigos
  rationale: “Incorrer em castigos” reproduz de modo idiomático a ideia de cair sob penalidades. A formulação causativa explicita em português a contraposição contextual sem reduzir os castigos a mera correção disciplinar.
- source_word: μεγάλης εὐεργεσίας
  choice: grande bondade
  rationale: “Bondade” é corrente e acessível, expressa o caráter benéfico da ação e evita tanto o tom técnico de “beneficência” quanto a especificidade teológica adicional de “misericórdia”.
- source_word: σημεῖόν ἐστιν
  choice: é sinal
  rationale: Equivalência direta que conserva o valor indicativo ou evidencial de σημεῖον.
theological_decisions:
- issue: Como exprimir que a punição rápida é uma forma de benevolência
  choice: Manter diretamente que fazer os transgressores incorrerem logo em castigos é “sinal de grande bondade”.
  alternative: Traduzir εὐεργεσία por “misericórdia” ou suavizar ἐπιτίμια como “disciplina”.
  rationale: O texto apresenta a pronta punição como ação benéfica. “Bondade” preserva essa tensão teológica sem suavizar “castigos” nem introduzir uma noção mais específica de misericórdia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “o fato de” torna clara a função substantiva dos infinitivos gregos; “os que agem com impiedade” evita linguagem arcaica e preserva o aspecto comportamental do original.
