translation:
  language: pt
  text: para que, quando nossos pecados chegarem ao limite[a], ele[b] não se vingue de nós mais tarde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “chegarem ao fim”. A expressão pode indicar que os pecados atingiram sua medida plena.
    reason: lexical_alternative
  - marker: b
    text: O sujeito “ele” está implícito no grego e é retomado do contexto imediato, onde se refere ao Senhor.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα μὴ
  choice: para que [...] não
  rationale: Expressa naturalmente em português a finalidade negativa da oração, sem recorrer a uma formulação excessivamente formal.
- source_word: πρὸς τέλος
  choice: ao seu limite
  rationale: Conserva a ideia de atingir um ponto final ou limite. No contexto, pode indicar que os pecados chegaram à sua medida plena, sem tornar essa interpretação mais explícita do que o grego.
- source_word: ἀφικομένων
  choice: tiverem chegado
  rationale: O particípio no genitivo absoluto descreve os pecados atingindo esse limite; a oração temporal com futuro do subjuntivo é idiomática em português.
- source_word: ἡμῶν τῶν ἁμαρτιῶν
  choice: os nossos pecados
  rationale: Reproduz de modo claro e natural a relação possessiva do grego.
- source_word: ὕστερον
  choice: mais tarde
  rationale: Mantém o contraste temporal com a disciplina imediata mencionada no contexto.
- source_word: ἐκδικά
  choice: execute vingança contra
  rationale: Preserva a força judicial e retributiva do verbo, mais específica do que simplesmente 'castigar'.
theological_decisions:
- issue: O sujeito divino está implícito no grego e é recuperado do contexto imediato.
  choice: ele não execute vingança contra nós
  alternative: o Senhor não execute vingança contra nós
  rationale: O pronome fornece o sujeito exigido em português sem inserir nesta oração o título divino que o grego não repete.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e legibilidade brasileira. A formulação preserva tanto a finalidade negativa quanto a imagem dos pecados chegando a um limite.
