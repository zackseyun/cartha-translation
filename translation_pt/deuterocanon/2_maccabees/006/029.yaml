base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/029.yaml
  text: Those who were leading him changed the goodwill they had shown him a little earlier into hostility because of the words just spoken[a], since they regarded them, as they supposed, as madness.
translation:
  language: pt
  text: Os que o conduziam transformaram em hostilidade a benevolência que pouco antes lhe haviam demonstrado, por causa das palavras que ele acabara de dizer, pois eles próprios as consideravam uma loucura[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “insensatez”, “desvario” ou “atitude desesperada”. O termo grego expressa a avaliação dos homens que o conduziam, não necessariamente o juízo do narrador.
    reason: Alternativa lexical e esclarecimento da perspectiva narrativa.
lexical_decisions:
- source_word: τῶνδε ἀγόντων πρὸς αὐτόν
  choice: Os que o conduziam
  rationale: A expressão identifica os homens que levavam Eleazar. “Conduziam” é natural em português e preserva a ideia de escolta sem acrescentar detalhes.
- source_word: τὴν μικρῷ πρότερον εὐμένειαν
  choice: a benevolência que pouco antes lhe haviam demonstrado
  rationale: εὐμένεια indica boa vontade, favor ou benevolência; μικρῷ πρότερον situa essa atitude pouco tempo antes. A explicitação de “lhe haviam demonstrado” torna clara a relação em português.
- source_word: δυσμένειαν
  choice: hostilidade
  rationale: Como contraponto direto de εὐμένεια, δυσμένεια comunica a mudança de uma disposição favorável para uma atitude hostil.
- source_word: διὰ τὴν τῶν προειρημένων λόγων
  choice: por causa das palavras que ele acabara de dizer
  rationale: προειρημένων remete às palavras proferidas no contexto imediatamente anterior. “Acabara de dizer” é idiomático e mantém a referência temporal próxima.
- source_word: ὡς αὐτοὶ ὑπελάμβανον
  choice: pois eles próprios as consideravam
  rationale: A formulação atribui expressamente a avaliação aos homens que o conduziam, mantendo a distância do narrador.
- source_word: ἀπόνοιαν
  choice: uma loucura
  rationale: ἀπόνοια pode expressar loucura, insensatez, desvario ou atitude desesperada. “Uma loucura” transmite aqui a avaliação depreciativa dos acompanhantes sem apresentá-la como juízo do narrador.
theological_decisions:
- issue: Distância narrativa em relação ao julgamento dos acompanhantes
  choice: 'A qualificação das palavras como “uma loucura” é explicitamente atribuída aos homens: “eles próprios as consideravam”.'
  alternative: Traduzir diretamente como “por causa da loucura das palavras que ele acabara de dizer”.
  rationale: ὡς αὐτοὶ ὑπελάμβανον marca a avaliação como opinião deles. A tradução evita afirmar que o próprio narrador considerava loucas as palavras de Eleazar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem da frase conserva a mudança enfática de benevolência para hostilidade e mantém as duas relações causais sem tornar o período excessivamente pesado.
