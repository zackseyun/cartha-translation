base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/030.yaml
  text: But as he was about to die under the blows[a], he groaned and said, “To the Lord, who has the holy knowledge, it is clear that, though I could have been released from death, I am enduring cruel pains in my body while being scourged[b]; but in my soul I gladly suffer these things because of fear of him.”
translation:
  language: pt
  text: 'Quando estava prestes a morrer sob os golpes, ele gemeu e disse: “É evidente ao Senhor, que possui o santo conhecimento, que, embora eu pudesse ser livrado da morte[a], suporto no corpo dores cruéis enquanto sou açoitado; mas, na alma, sofro de bom grado essas coisas por temor a ele[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ser livrado da morte” significa ser poupado da execução ou escapar da morte mediante submissão às exigências impostas.
    reason: lexical_alternative
  - marker: b
    text: Ou “por reverência a ele”. O grego diz “temor”, termo que pode incluir temor reverente diante de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλων ... τελευτᾷν
  choice: quando estava prestes a morrer
  rationale: A construção com μέλλων e infinitivo expressa iminência; esta formulação é natural em português e mantém o caráter narrativo.
- source_word: ταῖς πληγαῖς
  choice: sob os golpes
  rationale: O dativo indica o meio ou a circunstância em que ele morria, sem exigir que se especifique além do grego.
- source_word: ἀναστενάξας
  choice: ele gemeu
  rationale: O particípio descreve um suspiro profundo ou gemido audível; “gemeu” é conciso e adequado à cena.
- source_word: Τῷ κυρίῳ
  choice: ao Senhor
  rationale: Mantém o dativo grego e a designação divina tradicional em português.
- source_word: τῷ τὴν ἁγίαν γνῶσιν ἔχοντι
  choice: que possui o santo conhecimento
  rationale: Preserva γνῶσις como “conhecimento” e o caráter marcado da expressão, sem ampliá-la para “verdade” ou “onisciência”.
- source_word: φανερὸν ἐστὶν
  choice: é evidente
  rationale: Expressão impessoal clara e digna em português contemporâneo.
- source_word: δυνάμενος ἀπολυθῆναι τοῦ θανάτου
  choice: embora eu pudesse ter sido livrado da morte
  rationale: O valor concessivo é exigido pelo contexto; “livrado da morte” conserva a metáfora de libertação sem reduzir a frase apenas a “escapar”.
- source_word: σκληρὰς ... ἀλγηδόνας
  choice: dores cruéis
  rationale: Mantém tanto o substantivo concreto “dores” quanto a dureza intensificadora de σκληράς.
- source_word: κατὰ σῶμα
  choice: no corpo
  rationale: Forma idiomática que preserva o contraste explícito entre corpo e alma.
- source_word: μαστιγούμενος
  choice: enquanto sou açoitado
  rationale: Expressa a ação simultânea e traduz o castigo por açoites em registro atual e digno.
- source_word: κατὰ ψυχὴν
  choice: na alma
  rationale: Preserva ψυχή e a oposição antropológica com σῶμα, sem convertê-la em mera disposição psicológica.
- source_word: ἡδέως
  choice: de bom grado
  rationale: Comunica aceitação voluntária e positiva com mais naturalidade e gravidade em português do que “prazerosamente”.
- source_word: διὰ τὸν αὐτοῦ φόβον
  choice: por temor a ele
  rationale: “Temor” mantém a força de φόβος e, no uso religioso português, admite a nuance de reverência sem eliminá-la nem resolver a ambiguidade.
theological_decisions:
- issue: Sentido de φόβος em relação ao Senhor
  choice: temor a ele
  alternative: reverência por ele
  rationale: O grego φόβος pode designar medo ou temor reverente diante de Deus. “Temor” preserva essa tensão, e a nota registra a nuance alternativa.
- issue: Valor de ψυχή em contraste com σῶμα
  choice: alma
  alternative: interior
  rationale: O texto contrasta diretamente sofrimento corporal e disposição da ψυχή; “alma” conserva a distinção lexical e antropológica sem impor uma paráfrase psicológica.
- issue: Alcance de ἀπολυθῆναι τοῦ θανάτου
  choice: ser livrado da morte
  alternative: escapar da morte
  rationale: A expressão pode referir-se a ser poupado da execução mediante conformidade. A tradução mantém a imagem de libertação, e a nota esclarece o sentido contextual sem inseri-lo no corpo do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno sem arcaísmos. Mantêm-se as imagens de libertação, o contraste entre corpo e alma e a ambiguidade reverencial de φόβος.
