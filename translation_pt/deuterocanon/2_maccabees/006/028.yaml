  text: thus leaving to the young a noble example of dying willingly and bravely for the revered and holy laws. And after saying these things[a], he immediately went to the rack,
translation:
  language: pt
  text: deixando assim aos jovens um nobre exemplo de morrer de boa vontade e com coragem pelas veneráveis e santas leis. Depois de dizer essas coisas, dirigiu-se imediatamente ao instrumento de tortura[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, τύμπανον, literalmente “tambor”; aqui, refere-se a um instrumento de tortura.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς δὲ νέοις
  choice: aos jovens
  rationale: O dativo indica os beneficiários ou aqueles para quem o exemplo é deixado; «jovens» é abrangente e não restringe desnecessariamente o referente a homens.
- source_word: ὑπόδειγμα γενναῖον
  choice: um nobre exemplo
  rationale: «Exemplo» traduz ὑπόδειγμα, enquanto «nobre» preserva a dignidade moral e a conotação de coragem de γενναῖον.
- source_word: καταλελοιπὼς
  choice: deixando
  rationale: O particípio perfeito aponta para um exemplo deixado como legado duradouro; a forma portuguesa é natural e mantém a ligação com a ação seguinte.
- source_word: εἰς τὸ προθύμως καὶ γενναίως ... ἀπευθανατίζειν
  choice: de morrer de boa vontade e com coragem
  rationale: A construção infinitiva descreve o conteúdo e a finalidade exemplar de sua morte. «De boa vontade» expressa prontidão voluntária sem sugerir entusiasmo impróprio, e «com coragem» comunica claramente o modo de morrer.
- source_word: ὑπὲρ τῶν σεμνῶν καὶ ἁγίων νόμων
  choice: pelas veneráveis e santas leis
  rationale: «Pelas» conserva o sentido de morrer em defesa ou por causa das leis; «veneráveis» e «santas» mantêm a avaliação positiva explícita dos adjetivos gregos.
- source_word: τοσαῦτα δὲ εἰπών
  choice: Depois de dizer essas coisas
  rationale: Transição temporal idiomática que representa diretamente o particípio aoristo e o demonstrativo quantitativo no contexto.
- source_word: ἐπὶ τὸ τύμπανον
  choice: para o instrumento de tortura
  rationale: No contexto, τύμπανον designa um aparelho de suplício. A tradução funcional evita a imagem enganosa de um tambor musical sem fixar uma identificação mecânica mais precisa do que a evidência permite.
- source_word: εὐθέως ἦλθεν
  choice: foi imediatamente
  rationale: Expressa tanto a prontidão de εὐθέως quanto o movimento em direção ao aparelho de tortura.
theological_decisions:
- issue: A valorização do martírio e das leis
  choice: Preservar «de boa vontade e com coragem» e «veneráveis e santas leis».
  alternative: Empregar termos menos valorativos, como «resolutamente» e «leis respeitadas».
  rationale: O grego apresenta explicitamente a morte de Eleazar como exemplar e qualifica positivamente as leis; neutralizar essa linguagem apagaria a tensão moral e teológica do texto.
- issue: Identificação de τύμπανον
  choice: Traduzir no texto como «instrumento de tortura» e registrar o sentido literal em nota.
  alternative: Traduzir especificamente como «cavalete», «roda» ou literalmente «tambor».
  rationale: A função de instrumento de suplício é clara, mas sua forma exata não é plenamente determinada. A opção escolhida preserva a certeza contextual sem impor uma identificação discutível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha a progressão do grego sem soar artificial; evita-se tanto o arcaísmo quanto uma especificação excessiva do aparelho de tortura.
