  text: and also to defile the temple in Jerusalem and to name it for Olympian Zeus[a], and the one on Gerizim, as those who inhabited the place happened to do[b], for Zeus the protector of strangers.
translation:
  language: pt
  text: e também profanar o templo de Jerusalém e dar-lhe o nome de Zeus Olímpico[a]; e dar ao templo do monte Gerizim, conforme eram os habitantes daquele lugar[b], o nome de Zeus, protetor dos estrangeiros[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “renomeá-lo Zeus Olímpico”. O verbo grego pode indicar a atribuição de uma designação adicional ou nova.'
    reason: lexical_alternative
  - marker: b
    text: 'O grego é condensado e também pode ser entendido como: “conforme eram os habitantes daquele lugar”.'
    reason: ambiguity
  - marker: c
    text: 'Grego: “Zeus Xenios”, título de Zeus como patrono da hospitalidade e protetor de hóspedes e estrangeiros.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μολῦναι
  choice: profanar
  rationale: No contexto do templo, o infinitivo expressa contaminação cultual e desrespeito ao caráter sagrado. “Profanar” comunica isso de modo mais natural em português do que “poluir” ou “contaminar”.
- source_word: νεὼ
  choice: templo
  rationale: O termo designa o edifício ou santuário do culto; “templo” é a forma corrente e adequada tanto para Jerusalém quanto, por elipse, para Gerizim.
- source_word: προσονομάσαι
  choice: dar-lhe o nome de
  rationale: O verbo pode indicar atribuir um nome adicional ou novo. A expressão preserva essa amplitude sem decidir se houve simples designação, dedicação ou renomeação formal.
- source_word: Διὸς Ὀλυμπίου
  choice: Zeus Olímpico
  rationale: Traduz o epíteto divino de forma reconhecível em português, mantendo Zeus como nome próprio.
- source_word: Γαριζείν
  choice: monte Gerizim
  rationale: A forma “Gerizim” segue o uso bíblico em português; “monte” explicita de modo natural o referente geográfico sem alterar o sentido.
- source_word: καθὼς ἐτύγχανον οἱ τὸν τόπον οἰκοῦντες
  choice: conforme a condição dos habitantes daquele lugar
  rationale: A construção grega é condensada e admite mais de uma compreensão. Esta formulação conserva a relação circunstancial com os moradores sem afirmar de maneira indevida que eles pediram ou desejaram o novo nome.
- source_word: Διὸς ξενίου
  choice: Zeus Hospitaleiro
  rationale: Ξένιος é o título de Zeus ligado à hospitalidade e à proteção de hóspedes e estrangeiros. “Hospitaleiro” mantém a forma de epíteto e seu campo semântico, com esclarecimento em nota.
theological_decisions:
- issue: Tradução dos títulos de uma divindade pagã no relato da profanação dos templos judaicos
  choice: Zeus Olímpico e Zeus Hospitaleiro
  alternative: Zeus Olympios e Zeus Xenios; Zeus do Olimpo e Zeus Protetor dos Estrangeiros
  rationale: Traduzir os epítetos permite ao leitor perceber o caráter das designações impostas, sem confundir os títulos com nomes próprios independentes nem suavizar a profanação narrada.
- issue: Sentido da oração καθὼς ἐτύγχανον οἱ τὸν τόπον οἰκοῦντες
  choice: conforme a condição dos habitantes daquele lugar
  alternative: como desejavam os habitantes daquele lugar; conforme eram os habitantes daquele lugar; de acordo com o costume dos habitantes
  rationale: O grego é breve e ambíguo. A redação escolhida conserva a referência à situação ou condição dos moradores e evita atribuir-lhes explicitamente um pedido, desejo ou costume que não aparece de forma inequívoca.
- issue: Referente elíptico de τὸν ἐν Γαριζείν
  choice: ao templo do monte Gerizim
  alternative: ao de Gerizim; ao santuário de Gerizim
  rationale: O substantivo “templo” é retomado por elipse no grego. Explicitá-lo em português torna a coordenação compreensível sem acrescentar conteúdo teológico.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A estrutura coordenada acompanha o grego, enquanto a pontuação e a explicitação elíptica de “templo” evitam obscuridade desnecessária.
