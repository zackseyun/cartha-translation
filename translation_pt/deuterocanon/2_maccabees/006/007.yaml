base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/007.yaml
  text: And they were being led[a], under bitter compulsion, to the king’s monthly birthday observance for the sacrificial meal; and when a festival of Dionysus came, they were being forced, wearing ivy wreaths[b], to join the procession in honor of Dionysus.
translation:
  language: pt
  text: Eram levados, sob amarga coação, à celebração mensal do aniversário do rei, para participar da refeição sacrificial[a]; e, quando chegava uma festa de Dioniso, eram obrigados a usar coroas de hera[b] e a seguir em procissão em honra de Dioniso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “para comer as vísceras ou porções sacrificiais”. O termo grego se refere à participação no rito mediante o consumo das porções oferecidas.
    reason: lexical_alternative
  - marker: b
    text: A hera estava associada ao culto de Dioniso; a expressão provavelmente indica coroas ou grinaldas de hera usadas durante a procissão.
    reason: cultural_note
lexical_decisions:
- source_word: ἤγον
  choice: Eram levados
  rationale: O imperfeito retrata uma prática recorrente ou continuada de conduzi-los sob coerção; a forma passiva natural em português preserva a falta de identificação dos agentes.
- source_word: μετὰ πικρᾶς ἀνάγκης
  choice: sob amarga coação
  rationale: Expressa tanto a imposição externa quanto seu caráter penoso, sem dar a ἀνάγκη o sentido mais neutro de mera necessidade.
- source_word: εἰς τὴν κατὰ μῆνα τοῦ βασιλέως γενέθλιον ἡμέραν
  choice: à celebração mensal do aniversário do rei
  rationale: κατὰ μῆνα indica recorrência mensal, e γενέθλιον ἡμέραν designa a observância do aniversário; “celebração” soa natural e conserva o caráter público da ocasião.
- source_word: ἐπὶ σπλαγχνισμόν
  choice: para participar da refeição sacrificial
  rationale: No contexto ritual, o termo se refere ao consumo das vísceras ou porções da vítima sacrificada. A formulação comunica a participação cultual sem obscurecer o texto com literalismo anatômico.
- source_word: Διονυσίων ἑορτῆς
  choice: uma festa de Dioniso
  rationale: Identifica de modo transparente uma festividade dionisíaca sem impor um título técnico específico além do que o grego exige.
- source_word: κισσοὺς ἔχοντες
  choice: usar coroas de hera
  rationale: Literalmente, a expressão diz que tinham heras; no contexto da procissão dionisíaca, refere-se provavelmente a hera usada como grinalda ou coroa. A nota registra essa inferência cultural.
- source_word: πομπεύειν
  choice: seguir em procissão
  rationale: O verbo denota participar de uma procissão ritual; a expressão é corrente, digna e preserva o caráter cerimonial.
- source_word: τῷ Διονύσῳ
  choice: em honra de Dioniso
  rationale: O dativo indica a orientação ou dedicação cultual da procissão; a formulação explicita essa relação em português idiomático.
theological_decisions:
- issue: Grau de explicitação da participação forçada no rito sacrificial em ἐπὶ σπλαγχνισμόν
  choice: “para participar da refeição sacrificial” no texto principal
  alternative: “para comer as vísceras/porções sacrificiais”
  rationale: A tradução principal deixa claro que se tratava de participação imposta em um rito pagão, mas evita uma formulação anatômica potencialmente obscura. A nota preserva o alcance lexical mais literal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém o paralelismo das duas ações coercivas e explicita apenas o necessário para tornar inteligíveis os costumes cultuais antigos.
