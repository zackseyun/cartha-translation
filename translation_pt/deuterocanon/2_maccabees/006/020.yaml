  text: But after spitting it out[a], he came forward in the manner required for those who choose to resist things that it is not lawful to taste, even for the sake of one’s attachment to life.
translation:
  language: pt
  text: Mas, depois de cuspir a carne, ele se apresentou do modo como devem fazê-lo os que perseveram em resistir[a] ao que não é lícito provar, mesmo por apego à vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que perseveram em se defender”. O grego reúne perseverança e resistência numa expressão compacta e de interpretação difícil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προπτύσας
  choice: depois de cuspi-la
  rationale: O particípio aoristo indica que Eleazar expeliu da boca a carne que lhe haviam dado. O pronome feminino retoma naturalmente a carne no contexto imediato.
- source_word: καθʼ ὃν ἔδει τρόπον
  choice: como deviam fazer
  rationale: Expressa a maneira considerada necessária e apropriada, preservando a força ética de ἔδει em português corrente.
- source_word: προσέρχεσθαι
  choice: ele se apresentou
  rationale: O infinitivo descreve sua aproximação voluntária do suplício. A formulação finita produz uma frase natural em português sem especificar um destino que não está explícito neste versículo.
- source_word: τοὺς ὑπομένοντας ἀμύνασθαι
  choice: os que perseveram em resistir
  rationale: ὑπομένω comunica firmeza ou perseverança sob provação, enquanto ἀμύνομαι indica repelir ou resistir. A combinação conserva tanto a constância quanto a resistência ativa.
- source_word: ὧν οὐ θέμις γεύσασθαι
  choice: àquilo que não é lícito provar
  rationale: θέμις tem força moral e religiosa, e γεύομαι significa literalmente provar ou saborear. A tradução evita reduzir a expressão a uma preferência pessoal.
- source_word: διὰ τὴν πρὸς ζῆν φιλοστοργίαν
  choice: nem mesmo por apego à vida
  rationale: 'φιλοστοργία designa uma afeição ou ligação intensa e natural. ''Apego à vida'' preserva essa nuance, enquanto ''nem mesmo'' explicita a relação concessiva exigida pelo contexto: o desejo de continuar vivendo não torna lícito o ato.'
theological_decisions:
- issue: Força ético-religiosa de οὐ θέμις no contexto do martírio judaico
  choice: não é lícito
  alternative: é proibido
  rationale: '''Não é lícito'' mantém a dimensão legal e sagrada da expressão sem importar terminologia doutrinária posterior.'
- issue: Relação entre a resistência e o apego à vida
  choice: nem mesmo por apego à vida
  alternative: por causa do amor à vida
  rationale: A construção grega é compacta, mas o contexto indica que o apego à vida poderia motivar a transgressão, não a resistência. A tradução mantém essa tensão sem sugerir que o amor à vida seja em si condenado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem foi levemente ajustada para clareza, preservando a concisão e a tensão ética do grego.
