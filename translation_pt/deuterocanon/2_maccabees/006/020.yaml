review_pass:
  verdict: revise
  source_fidelity: A tradução conserva adequadamente o ato de cuspir, a exigência ético-religiosa de «não é lícito» e a ideia de resistência perseverante. Contudo, «cuspi-la» introduz um pronome sem antecedente no versículo, e «como deviam fazer» deixa pouco claro que o verbo subentendido é «apresentar-se».
  naturalness: A redação atual é geralmente compreensível, mas «ele se apresentou como deviam fazer» soa truncada em português. A explicitação moderada de «a carne», recuperada do contexto imediato, e de «fazê-lo» produz uma frase mais clara e natural sem acrescentar sentido interpretativo indevido.
  terminology: «Não é lícito provar» preserva bem o valor sacral e moral de οὐ θέμις e a especificidade de γεύσασθαι. «Apego à vida» representa de modo apropriado φιλοστοργία. «Perseveram em resistir» é defensável para ὑπομένοντας ἀμύνασθαι; a nota, porém, deve evitar a alternativa pouco idiomática «suportam resistir».
  issues:
  - severity: medium
    issue: Pronome sem antecedente explícito em «cuspi-la».
    rationale: Embora o contexto anterior trate da carne, o versículo isolado não fornece um antecedente feminino para «-la». Explicitar «a carne» torna a referência inequívoca e corresponde ao objeto expelido no contexto narrativo.
  - severity: medium
    issue: Construção ambígua em «ele se apresentou como deviam fazer».
    rationale: O grego associa a maneira de apresentar-se aos que perseveram em resistir. «do modo como devem fazê-lo» torna explícito, em português, o verbo elíptico e preserva a relação sintática.
  - severity: low
    issue: 'Alternativa da nota pouco natural: «os que suportam resistir».'
    rationale: Em português, «suportar resistir» não expressa com clareza a compactação grega entre perseverar/suportar e resistir. Uma formulação com «perseveram em se defender» é mais idiomática e ainda assinala a dificuldade lexical.
  revised_text: Mas, depois de cuspir a carne, ele se apresentou do modo como devem fazê-lo os que perseveram em resistir[a] ao que não é lícito provar, mesmo por apego à vida.
