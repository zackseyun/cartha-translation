revisions:
- from: Mas, depois de cuspi-la, ele se apresentou como deviam fazer os que perseveram em resistir[a] àquilo que não é lícito provar, nem mesmo por apego à vida.
  to: Mas, depois de cuspir a carne, ele se apresentou do modo como devem fazê-lo os que perseveram em resistir[a] ao que não é lícito provar, mesmo por apego à vida.
