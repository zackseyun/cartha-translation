  yaml_path: translation/deuterocanon/2_maccabees/006/001.yaml
  text: But after not much time[a], the king sent an aged Athenian to compel the Jews to depart from the laws of their fathers and not to live by the laws of God[b],
translation:
  language: pt
  text: Não muito tempo depois, o rei enviou um ateniense idoso para obrigar os judeus a abandonar as leis de seus pais[a] e a não viver segundo as leis de Deus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as leis ancestrais”. O grego conserva a linguagem paterna: “as leis de seus pais”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετʼ οὐ πολὺν ... χρόνον
  choice: Não muito tempo depois
  rationale: Expressa com naturalidade em português a brevidade temporal do idiomatismo grego, literalmente «depois de não muito tempo».
- source_word: ἐξαπέστειλεν
  choice: enviou
  rationale: Equivalente corrente e suficiente para o sentido de mandar ou despachar alguém.
- source_word: γέροντι Ἀθηναῖον
  choice: um ateniense idoso
  rationale: Entende γέροντι como descrição da idade, não como título oficial, e mantém uma formulação natural e digna.
- source_word: ἀναγκάζειν
  choice: para obrigar
  rationale: Preserva tanto a ideia de coerção quanto a função de propósito do infinitivo.
- source_word: μεταβαίνειν ἀπὸ τῶν πατρίων νόμων
  choice: a abandonar as leis de seus pais
  rationale: «Abandonar» comunica claramente o afastamento exigido; «leis de seus pais» conserva a linguagem paterna e ancestral do grego.
- source_word: τοῖς τοῦ θεοῦ νόμοις μὴ πολιτεύεσθαι
  choice: a não viver segundo as leis de Deus
  rationale: Transmite a conduta de vida regida por essas leis sem restringir indevidamente o verbo à esfera política formal.
theological_decisions:
- issue: Linguagem paterna em πατρίων
  choice: as leis de seus pais
  alternative: as leis ancestrais
  rationale: O grego contém linguagem explicitamente paterna/ancestral; a tradução escolhida preserva essa textura sem acrescentar uma doutrina particular.
- issue: Alcance de πολιτεύεσθαι sob as leis divinas
  choice: viver segundo as leis de Deus
  alternative: conduzir-se segundo as leis de Deus
  rationale: A escolha mantém o sentido amplo de orientar a vida e a conduta pelas leis, sem reduzir o termo apenas à cidadania ou à organização política.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A ordem foi ajustada para a naturalidade do português, preservando o sentido e a tensão do grego. A vírgula final foi mantida porque o versículo continua na frase seguinte.
