  text: But the altar was filled with unlawful things by those who had departed from the laws[a].
translation:
  language: pt
  text: Mas o altar estava cheio de coisas proibidas, postas ali por aqueles que haviam se afastado das leis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «coisas ilícitas», «abominações» ou «coisas impuras». O grego descreve aquilo que não é permitido, aqui em um contexto de profanação cultual.
    reason: lexical_alternative
lexical_decisions:
- source_word: θυσιαστήριον
  choice: altar
  rationale: É o equivalente português corrente e exato, sem a expansão desnecessária «altar de sacrifícios».
- source_word: ἀποδιεσταλμένοις
  choice: aqueles que haviam se afastado de
  rationale: Expressa separação ou distanciamento das leis sem introduzir no texto principal o rótulo interpretativo «apóstatas».
- source_word: νόμων
  choice: das leis
  rationale: Mantém o plural explícito do grego; o contexto identifica essas leis como judaicas, sem que seja necessário acrescentar «ancestrais».
- source_word: ἀθεμίτοις
  choice: coisas proibidas
  rationale: Traduz o que não é permitido ou sancionado. «Coisas» explicita naturalmente em português o substantivo implícito, enquanto «abominações» acrescentaria uma carga cultual mais forte.
- source_word: ἐπεπλήρωτο
  choice: estava cheio
  rationale: O mais-que-perfeito passivo descreve o estado resultante do altar, já cheio. Esta formulação portuguesa comunica esse estado de modo natural.
theological_decisions:
- issue: Intensidade cultual de ἀθεμίτοις
  choice: coisas proibidas
  alternative: abominações; coisas ilícitas; coisas impuras
  rationale: Embora o contexto seja de profanação cultual, o termo grego enfatiza primariamente aquilo que não é permitido. A escolha preserva a força jurídico-religiosa sem tornar explícita uma avaliação mais forte do que o próprio vocábulo exige.
- issue: Agência associada ao enchimento do altar
  choice: postas ali por aqueles que haviam se afastado das leis
  alternative: o altar estava cheio de coisas proibidas por causa daqueles que haviam se afastado das leis
  rationale: O dativo τοῖς ἀποδιεσταλμένοις pode indicar os agentes responsáveis. «Postas ali por» torna essa relação inteligível em português, sem afirmar que as próprias pessoas constituíam o conteúdo do altar.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A ordem foi ajustada para evitar a leitura equivocada de que as pessoas eram aquilo de que o altar estava cheio. O marcador [a] aparece no texto principal.
