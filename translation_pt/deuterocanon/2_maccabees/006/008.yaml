  text: And a decree went out to the neighboring Greek cities[a], at the suggestion of Ptolemy, to follow the same policy against the Jews, and to kill them,
translation:
  language: pt
  text: Também foi expedido um decreto às cidades gregas vizinhas, por proposta de Ptolomeu, para que adotassem a mesma política contra os judeus e os massacrassem[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego é mais gráfico, com referência às entranhas; aqui, indica matar de modo brutal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψήφισμα
  choice: decreto
  rationale: Designa uma decisão ou determinação oficial; “decreto” comunica com clareza seu caráter público e formal.
- source_word: ἐξῆλθεν εἰς
  choice: foi expedido às
  rationale: A expressão descreve a emissão e o envio do decreto aos destinatários. A forma passiva é natural em português administrativo.
- source_word: ἀστυγείτονας Ἑλληνίδας πόλεις
  choice: cidades gregas vizinhas
  rationale: Expressa de modo conciso tanto a proximidade geográfica quanto a identidade cultural ou política grega dessas cidades.
- source_word: Πτολεμαίου ὑποθεμένου
  choice: por proposta de Ptolomeu
  rationale: O genitivo absoluto apresenta Ptolomeu como quem propôs a medida; a formulação evita sugerir que ele apenas deu um conselho informal.
- source_word: τὴν αὐτὴν ἀγωγὴν ... ἄγειν
  choice: adotassem a mesma política
  rationale: A construção cognata indica seguir ou pôr em prática o mesmo modo oficial de proceder contra os judeus. “Adotassem a mesma política” é corrente e preserva o contexto administrativo.
- source_word: σπλαγχνίζειν
  choice: os massacrassem
  rationale: O verbo é incomumente gráfico e se relaciona às entranhas; no contexto, indica matar com brutalidade. “Massacrassem” conserva a violência sem impor no texto principal a imagem anatômica mais literal.
theological_decisions:
- issue: Intensidade e imagem de σπλαγχνίζειν
  choice: os massacrassem
  alternative: os matassem; lhes arrancassem as entranhas
  rationale: A palavra não constitui uma questão doutrinária, mas sua força narrativa deve ser preservada. “Massacrassem” comunica morte brutal em português natural, enquanto a nota registra a imagem visceral do grego sem transformar uma possibilidade lexical em descrição incontestável do método.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservou-se a vírgula final porque a oração prossegue no versículo seguinte. O marcador foi colocado junto ao verbo que a nota explica, e não junto a “cidades gregas”.
