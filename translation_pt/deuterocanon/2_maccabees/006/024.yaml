lexical_decisions:
- source_word: Οὐ γὰρ
  choice: Pois não
  rationale: Preserva a função explicativa de γάρ, ligando esta razão ao contexto anterior.
- source_word: τῆς ἡμετέρας ἡλικίας
  choice: de alguém da nossa idade
  rationale: Expressa de modo natural em português a etapa avançada da vida, mantendo o autorreferimento digno no plural.
- source_word: ἄξιόν ἐστιν
  choice: é digno
  rationale: Conserva o peso moral de ἄξιος, que indica aquilo que condiz com a dignidade de alguém.
- source_word: ὑποκριθῆναι
  choice: fingir
  rationale: No contexto, o verbo significa representar um papel ou simular conformidade; “fingir” é claro e atual.
- source_word: ἵνα
  choice: levando assim
  rationale: Comunica a consequência prevista da simulação sem impor uma intenção deliberada de enganar os jovens.
- source_word: πολλοὶ τῶν νέων
  choice: muitos jovens
  rationale: Designa naturalmente o grupo dos mais novos sem especificar o sexo além do que o contexto exige.
- source_word: ὑπολαβόντες
  choice: a pensar
  rationale: Transmite a inferência equivocada que os jovens fariam com base na conduta aparente de Eleazar.
- source_word: Ἐλεάζαρον τὸν ἐνενηκονταετῆ
  choice: Eleazar, aos noventa anos
  rationale: Mantém a indicação enfática da idade em português idiomático.
- source_word: μεταβεβληκέναι
  choice: passou a adotar
  rationale: Reflete o perfeito grego como uma mudança de conduta já ocorrida segundo a percepção dos observadores.
- source_word: εἰς ἀλλοφυλισμόν
  choice: costumes estrangeiros
  rationale: Expressa a adoção de práticas não judaicas sem recorrer a termos posteriores ou mais carregados, como “paganismo”.
theological_decisions:
- issue: Sentido de ἀλλοφυλισμός no contexto do martírio judaico
  choice: costumes estrangeiros
  alternative: modo de vida estrangeiro
  rationale: A expressão comunica o aparente abandono dos costumes ancestrais judaicos em favor de práticas gentílicas, sem acrescentar uma formulação doutrinária ausente do grego.
