  text: Pois não convém, em nossa idade, fingir, levando assim muitos jovens a pensar que Eleazar, aos noventa anos, passou a adotar costumes estrangeiros[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “passou a viver segundo um modo de vida estrangeiro”; o grego se refere à adoção de costumes não judeus.'
