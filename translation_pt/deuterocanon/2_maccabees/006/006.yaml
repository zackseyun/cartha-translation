  text: And it was permitted neither to keep the Sabbath[a], nor to observe the ancestral festivals, nor even simply to acknowledge being a Jew.
translation:
  language: pt
  text: Não era permitido guardar o sábado, nem observar as festas ancestrais, nem sequer declarar-se judeu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “judeano”, caso o termo seja entendido em sentido mais geográfico e étnico; neste contexto, porém, a proibição do sábado e das festas favorece “judeu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δʼ οὔτε ... οὔτε ... οὔτε
  choice: Não era permitido ... nem ... nem
  rationale: A construção impessoal com infinitivos descreve ações vedadas; esta formulação reproduz com naturalidade a sequência negativa tripla do grego.
- source_word: σαββατίζειν
  choice: guardar o sábado
  rationale: Expressa de modo claro e corrente a observância religiosa do sábado.
- source_word: πατρίους ἑορτὰς
  choice: festas ancestrais
  rationale: Preserva tanto o caráter religioso das celebrações quanto sua transmissão pelos antepassados.
- source_word: διαφυλάττειν
  choice: observar
  rationale: No contexto de festas religiosas, significa mantê-las ou celebrá-las segundo a tradição.
- source_word: ἁπλῶς
  choice: simplesmente
  rationale: Conserva a intensificação da última proibição, relativa até à mera identificação pública.
- source_word: Ἰουδαῖον
  choice: judeu
  rationale: Neste contexto de repressão ao sábado e às festas, o termo designa mais naturalmente a identidade étnico-religiosa judaica, não apenas a procedência geográfica.
- source_word: ὁμολογεῖν εἶναι
  choice: declarar-se
  rationale: Transmite de forma idiomática o reconhecimento ou a manifestação aberta da própria identidade, sem acrescentar conotações confessionais posteriores.
theological_decisions:
- issue: Sentido de Ἰουδαῖον no contexto da perseguição
  choice: judeu
  alternative: judeano
  rationale: As proibições visam práticas e identidade judaicas; “judeu” comunica melhor essa dimensão étnico-religiosa, enquanto a nota preserva a possível nuance geográfico-étnica.
translation_notes:
  register: Português moderno, claro e digno, com estrutura coordenada natural. O marcador foi colocado após “judeu”, termo ao qual a nota lexical efetivamente se refere.
