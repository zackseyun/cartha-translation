  language: pt
  text: Contudo, que isto fique dito para nossa lembrança; agora devemos passar, em poucas palavras, à narrativa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Contudo
  rationale: Marca a transição adversativa de modo natural e digno, sem exagerar o contraste.
- source_word: ἕως ὑπομνήσεως
  choice: para nos servir de lembrança
  rationale: 'Expressa o valor final da fórmula grega: o que acaba de ser dito deve funcionar como recordação ou advertência breve.'
- source_word: διʼ ὀλίγων
  choice: em poucas palavras
  rationale: Reproduz o sentido idiomático de brevidade, e não uma passagem por poucas etapas.
- source_word: ἐλευστέον ἐπὶ τὴν διήγησιν
  choice: devemos passar ... à narrativa
  rationale: A construção verbal de obrigação pede uma formulação impessoal ou inclusiva; esta opção é clara em português e conserva a ideia de prosseguir para o relato.
theological_decisions:
- issue: Sentido do dativo ἡμῖν
  choice: para nos servir
  alternative: ditas por nós
  rationale: O dativo pode ser entendido em relação aos destinatários beneficiados ou, com o perfeito passivo, como indicação do agente. O texto principal segue a leitura contextual de lembrança dirigida ao próprio grupo inclusivo, e a nota preserva a alternativa gramatical.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. “Narrativa” conserva o caráter metanarrativo do versículo; “estas coisas” mantém a referência ampla do demonstrativo grego.
