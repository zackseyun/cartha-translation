base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/021.yaml
  text: But those who had been appointed over the unlawful meal[a], because of their long-standing acquaintance with the man, took him aside privately and urged him to bring meat that it was proper for him to use, prepared by himself, and to pretend that he was eating the meats from the sacrifice that had been ordered by the king[b],
translation:
  language: pt
  text: Mas os encarregados da refeição proibida[a], movidos de compaixão por conhecerem aquele homem havia muitos anos, levaram-no à parte e insistiram que trouxesse carne que ele mesmo tivesse preparado e que era apropriado que ele comesse, e fingisse estar comendo as carnes do sacrifício que o rei havia ordenado que ele comesse[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “das práticas proibidas”. A expressão grega é elíptica e, neste contexto, refere-se à refeição imposta com carne proibida.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, carnes provenientes de ofertas sacrificiais pagãs, que o rei havia ordenado que ele comesse.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ ... πρὸς τὰ παράνομα ... τεταγμένοι
  choice: os encarregados da refeição proibida
  rationale: O particípio perfeito passivo indica pessoas designadas para uma função. A expressão τὰ παράνομα é elíptica; no contexto imediato, refere-se à refeição imposta com carne sacrificial proibida, sem identificá-la diretamente com θυσία, termo distinto que aparece depois.
- source_word: σπλαγχνισμοῦ
  choice: movidos de compaixão
  rationale: Explicita o sentido de piedade ou compaixão presente no substantivo grego, em vez de deixá-lo apenas implícito na antiga familiaridade.
- source_word: διὰ τὴν ἐκ τῶν παλαιῶν χρόνων πρὸς τὸν ἄνδρα γνῶσιν
  choice: por conhecerem aquele homem havia muitos anos
  rationale: γνῶσις designa aqui conhecimento pessoal ou familiaridade; a formulação é natural em português e preserva a longa duração.
- source_word: ἀπολαμβάνοντες αὐτὸν κατʼ ἰδίαν ἐκάλουν
  choice: levaram-no à parte e insistiram
  rationale: A construção descreve o ato de separá-lo dos demais em particular e, no contexto, fazer-lhe uma proposta insistente.
- source_word: ἐνέγκοντα κρέα
  choice: que trouxesse carne
  rationale: 'Expressa de modo direto a ação proposta: trazer carne própria para substituir a carne sacrificial.'
- source_word: οἷς καθῆκον αὐτῷ χρᾶσθαι
  choice: que lhe fosse permitido comer
  rationale: Embora χρᾶσθαι seja literalmente mais amplo, o contexto alimentar torna 'comer' a equivalência natural; 'permitido' comunica que a carne era apropriada segundo as obrigações dele.
- source_word: διʼ αὐτοῦ παρασκευασθέντα
  choice: preparada por ele mesmo
  rationale: Indica carne preparada por Eleazar ou sob seu próprio controle, em contraste com a carne do sacrifício.
- source_word: ὑποκρῖναι
  choice: fingisse
  rationale: Neste contexto, o verbo significa simular ou representar falsamente uma ação.
- source_word: τὰ ὑπὸ τοῦ βασιλέως τεταγμένα τῶν ἀπὸ τῆς θυσίας κρεῶν
  choice: as carnes do sacrifício prescritas pelo rei
  rationale: Mantém a referência plural de κρεῶν, a procedência sacrificial e a determinação régia, sem confundir essa expressão com τὰ παράνομα no início do versículo.
theological_decisions:
- issue: Referente de τὰ παράνομα
  choice: refeição proibida
  alternative: práticas ilícitas / sacrifício ilícito
  rationale: O contexto trata da ingestão forçada de carne proibida. 'Refeição proibida' torna claro o referente, mas evita equiparar τὰ παράνομα a θυσία, que aparece como termo distinto no fim do versículo.
- issue: Expressão de σπλαγχνισμοῦ
  choice: compaixão explicitada no texto principal
  alternative: deixar a compaixão implícita na familiaridade de longa data
  rationale: O grego contém expressamente a ideia de compaixão; incluí-la preserva a motivação dos agentes e evita perda semântica.
- issue: Natureza moral da carne substituta
  choice: que lhe fosse permitido comer
  alternative: que lhe fosse apropriado usar
  rationale: A formulação contextualiza καθῆκον sem especificar além do texto a fonte exata da permissão, preservando a tensão entre conformidade exterior e fidelidade às obrigações de Eleazar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Empregou-se “proibida” em vez de “ilícita” por clareza comum; “movidos de compaixão” preserva um elemento explícito do grego. A vírgula final mantém a continuidade sintática com o versículo seguinte.
