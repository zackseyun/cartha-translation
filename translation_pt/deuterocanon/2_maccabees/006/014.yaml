base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/014.yaml
  text: 'For he did not decide to deal with us as he does with the other nations: he waits patiently with them until they have reached the full measure of their sins[a], and then punishes them.'
translation:
  language: pt
  text: 'Pois o Soberano[a] não decidiu que conosco seria como com as outras nações: quanto a elas, espera com paciência até que cheguem à plenitude de seus pecados e então as pune.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: «o senhor absoluto» ou «o soberano» (ὁ δεσπότης), em referência a Deus.'
    reason: A nota registra a força lexical de δεσπότης e a distingue de κύριος, frequentemente traduzido por «Senhor».
lexical_decisions:
- source_word: ἀναμένει
  choice: espera
  rationale: O verbo indica esperar ou adiar a ação até determinado momento; aqui descreve o adiamento do castigo das outras nações.
- source_word: μακροθυμῶν
  choice: com paciência
  rationale: O particípio expressa paciência e tolerância prolongada e foi vertido como locução adverbial ligada a «espera».
- source_word: ὁ δεσπότης
  choice: o Soberano
  rationale: δεσπότης designa quem detém autoridade plena. «Soberano» preserva a referência explícita a Deus sem confundir o termo com κύριος, normalmente traduzido por «Senhor».
- source_word: καταντήσαντας αὐτοὺς πρὸς ἐκπλήρωσιν ἁμαρτιῶν
  choice: até que cheguem à plenitude de seus pecados
  rationale: A expressão comunica a chegada dos pecados à sua medida completa; «plenitude» mantém essa imagem sem acrescentar uma medida não expressa como substantivo no grego.
- source_word: κολάσῃ
  choice: as pune
  rationale: O verbo denota aplicação de castigo. «Pune» é direto, atual e adequado ao registro.
- source_word: οὐ ... οὕτως καὶ ἐφʼ ἡμῶν ἔκρινεν εἶναι
  choice: não decidiu que conosco seria como com as outras nações
  rationale: A formulação explicita em português a comparação negativa comprimida do grego e conserva o contraste entre o tratamento dado a Israel e o dado às demais nações.
theological_decisions:
- issue: A paciência divina para com as nações em contraste com o tratamento de Israel
  choice: Deus não determinou que seu modo de agir com Israel fosse igual ao adotado com as outras nações, cujo castigo é adiado até a plenitude de seus pecados.
  alternative: 'Traduzir de modo estritamente linear: «não julgou que assim também fosse no nosso caso».'
  rationale: A estrutura οὐ ... καθάπερ ... οὕτως καὶ ἐφ’ ἡμῶν estabelece o contraste, embora de forma sintaticamente condensada. A tradução o torna natural sem explicar por que Deus age de modo diferente nem resolver a tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase foi reorganizada para tornar explícito o contraste comprimido no grego. O marcador [a] aparece imediatamente após «Soberano», termo ao qual a nota se refere.
