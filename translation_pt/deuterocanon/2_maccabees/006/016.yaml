  yaml_path: translation/deuterocanon/2_maccabees/006/016.yaml
  text: Therefore he never withdraws his mercy from us; but while disciplining with calamity, he does not abandon his own people.
translation:
  language: pt
  text: Por isso, ele nunca afasta de nós a sua misericórdia; ao nos disciplinar com a calamidade, não abandona o seu próprio povo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διόπερ
  choice: Por isso
  rationale: Introduz a conclusão decorrente do contexto anterior e soa natural no português atual.
- source_word: οὐδέποτε
  choice: nunca
  rationale: Equivalente direto e idiomático do advérbio de tempo negado.
- source_word: τὸν ἔλεον
  choice: a sua misericórdia
  rationale: ἔλεος expressa misericórdia ou compaixão; o possessivo explicita de modo natural que se trata da misericórdia de Deus, já implícita no contexto.
- source_word: ἀφʼ ἡμῶν ἀφίστησιν
  choice: afasta de nós
  rationale: Preserva a ideia de fazer algo retirar-se ou ficar distante, mantendo a construção concisa do grego.
- source_word: παιδεύων
  choice: ao nos disciplinar
  rationale: No contexto, παιδεύω indica formação corretiva por meio do sofrimento; “disciplinar” conserva esse sentido sem restringi-lo a castigo punitivo.
- source_word: μετὰ συμφορᾶς
  choice: por meio da adversidade
  rationale: συμφορά designa infortúnio, calamidade ou adversidade. A formulação comunica aqui o meio ou circunstância dolorosa da disciplina, sem atenuar seu peso.
- source_word: οὐκ ἐγκαταλείπει
  choice: não abandona
  rationale: Equivalente moderno e claro para a ideia de não deixar para trás nem desamparar.
- source_word: τὸν ἑαυτοῦ λαόν
  choice: o seu próprio povo
  rationale: “Próprio” preserva a ênfase possessiva do reflexivo ἑαυτοῦ.
theological_decisions:
- issue: Sentido de παιδεύων na descrição da ação divina
  choice: ao nos disciplinar
  alternative: ao nos castigar; ao nos educar
  rationale: A passagem apresenta a adversidade como disciplina corretiva, em tensão com a permanência da misericórdia e sem equipará-la ao abandono divino.
- issue: Explicitação do possuidor em τὸν ἔλεον
  choice: a sua misericórdia
  alternative: a misericórdia
  rationale: Embora o grego empregue o artigo, o sujeito e o contexto tornam a referência a Deus inequívoca; o possessivo proporciona clareza natural em português sem acrescentar uma afirmação teológica nova.
- issue: Força de μετὰ συμφορᾶς
  choice: por meio da adversidade
  alternative: com calamidade; em meio à adversidade
  rationale: A expressão pode indicar meio ou acompanhamento. A tradução conserva a relação entre sofrimento e disciplina, sem afirmar além do texto uma teoria abrangente sobre a causalidade divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o contraste entre disciplina dolorosa, misericórdia contínua e não abandono do povo de Deus.
