  yaml_path: translation/deuterocanon/2_maccabees/006/011.yaml
  text: But others[a], having gathered nearby in the caves to observe the week in secret, were informed against to Philip and were burned together, because they scrupled to defend themselves out of regard for the honor of that most holy day.
translation:
  language: pt
  text: Outros, porém, reuniram-se nas cavernas próximas para observar a semana às escondidas[a]. Denunciados a Filipe, foram queimados juntos, porque, por reverência à dignidade daquele dia santíssimo, tiveram escrúpulo de se defender.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para observar o sábado em segredo”. O grego diz literalmente “observar a semana às escondidas”, mas, neste contexto, provavelmente se refere à observância do sábado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: Outros, porém
  rationale: Expressa o contraste indefinido com o grupo anterior de modo natural em português.
- source_word: πλησίον συνδρομόντες εἰς τὰ σπήλαια
  choice: reuniram-se nas cavernas próximas
  rationale: συνδρομόντες indica convergência ou reunião; a formulação portuguesa comunica naturalmente o movimento para cavernas situadas nas proximidades.
- source_word: λεληθότως ἄγειν τὴν ἑβδομάδα
  choice: para observar a semana às escondidas
  rationale: Preserva o valor lexical de ἑβδομάδα, 'semana', e traduz λεληθότως de maneira idiomática, sem ocultar a provável referência contextual ao sábado.
- source_word: μηνυθέντες τῷ Φιλίππῳ
  choice: Denunciados a Filipe
  rationale: O particípio passivo sugere que foram delatados ou denunciados, e não meramente mencionados.
- source_word: συνεφλογίσθησαν
  choice: foram queimados juntos
  rationale: Mantém o sentido coletivo do verbo composto sem acrescentar explicitamente 'vivos', elemento apenas implícito no contexto.
- source_word: διὰ τὸ εὐλαβῶς ἔχειν βοηθῆσαι αὐτοῖς
  choice: porque [...] tiveram escrúpulo de se defender
  rationale: εὐλαβῶς ἔχειν denota reserva reverente ou escrupulosa; ajudar a si mesmos, neste contexto, equivale naturalmente a defender-se.
- source_word: κατὰ δόξαν τῆς σεμνοτάτης ἡμέρας
  choice: por reverência à dignidade daquele dia santíssimo
  rationale: A expressão comunica o respeito pela honra e solenidade religiosa do dia, preservando o superlativo de σεμνοτάτης.
theological_decisions:
- issue: Sentido de τὴν ἑβδομάδα no contexto da perseguição
  choice: a semana
  alternative: o sábado
  rationale: O texto grego diz literalmente 'a semana', não empregando o termo explícito σάββατον. A tradução principal conserva essa forma, enquanto a nota registra a provável referência contextual à observância do sábado.
- issue: Natureza da recusa das vítimas
  choice: tiveram escrúpulo de se defender por reverência ao dia
  alternative: recusaram-se a ajudar uns aos outros
  rationale: O dativo αὐτοῖς admite naturalmente valor reflexivo neste contexto, isto é, ajudar a si mesmos ou defender-se; isso se harmoniza com a situação narrativa sem impor uma elaboração doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A construção preserva a ambiguidade de 'semana' no texto principal e esclarece na nota a provável referência ao sábado.
