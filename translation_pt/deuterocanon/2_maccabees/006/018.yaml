  yaml_path: translation/deuterocanon/2_maccabees/006/018.yaml
  text: A certain Eleazar[a], one of the leading scribes, a man already advanced in age and most handsome in appearance, was being forced, with his mouth pried open, to eat pork.
translation:
  language: pt
  text: Um certo Eleazar, um dos principais escribas, homem já avançado em idade e de belíssima aparência, era forçado, com a boca aberta à força, a comer carne de porco.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλεάζαρός τις
  choice: Certo Eleazar
  rationale: A construção apresenta o personagem de modo indefinido; “certo Eleazar” preserva esse valor narrativo em português natural e mantém a forma tradicional do nome.
- source_word: τῶν πρωτευόντων γραμματέων
  choice: um dos escribas mais importantes
  rationale: πρωτευόντων indica destaque ou posição elevada; “mais importantes” comunica essa proeminência sem redefinir γραμματεῖς como juristas ou mestres.
- source_word: ἤδη προβεβηκὼς τὴν ἡλικίαν
  choice: já avançado em idade
  rationale: Preserva a ideia de alguém que já havia chegado a idade avançada, em registro digno e corrente.
- source_word: τὴν πρόσοψιν τοῦ προσώπου κάλλιστος
  choice: de belíssima aparência
  rationale: Mantém o superlativo e a referência explícita ao aspecto visível, sem introduzir a qualidade moral de nobreza.
- source_word: ἀναχαινόμενον
  choice: com a boca aberta à força
  rationale: Expressa a abertura coercitiva da boca de forma clara e vívida, sem sugerir que Eleazar a abriu voluntariamente.
- source_word: ἠναγκάζετο
  choice: era forçado
  rationale: O imperfeito passivo indica coerção em curso; “era forçado” reproduz naturalmente a voz passiva e o aspecto durativo.
- source_word: ὕειον κρέας
  choice: carne de porco
  rationale: Equivalente português moderno, direto e exato para carne suína, preservando o referente concreto do grego.
theological_decisions:
- issue: Referência ao alimento impuro no contexto do martírio
  choice: carne de porco
  alternative: carne suína
  rationale: O grego nomeia concretamente carne de porco; a tradução mantém o referente sem acrescentar ao versículo uma explicação sobre a lei alimentar judaica.
- issue: Descrição da aparência de Eleazar
  choice: de belíssima aparência
  alternative: de aparência muito nobre
  rationale: κάλλιστος descreve beleza ou excelência visível. A opção escolhida evita transformar uma descrição física em juízo moral ou social não explicitado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por construções naturais no Brasil sem regionalismos. Não há marcadores de nota no texto porque nenhuma nota é necessária nesta versão.
