base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/004.yaml
  text: For the sanctuary was filled by the Gentiles with debauchery and revelry, boldly carousing with prostitutes, approaching women in the sacred precincts, and even bringing inside things that were not proper.
translation:
  language: pt
  text: Pois os gentios enchiam o santuário de devassidão e festejos desenfreados, comportando-se descaradamente com prostitutas[a], aproximando-se de mulheres nos recintos sagrados[b] e até levando para dentro coisas impróprias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cortesãs”; o grego ἑταίρων pode designar mulheres mantidas como companheiras sexuais.
    reason: lexical_alternative
  - marker: b
    text: A expressão “aproximando-se de mulheres” provavelmente implica conduta sexual imprópria nos recintos sagrados, embora o grego seja menos explícito do que “mantendo relações com mulheres”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  choice: santuário
  rationale: Refere-se ao templo de Jerusalém como espaço sagrado profanado; “santuário” preserva o valor cultual e se harmoniza com a menção aos recintos sagrados.
- source_word: ἀσωτίας
  choice: devassidão
  rationale: Expressa excesso moral dissoluto e irresponsável em linguagem portuguesa corrente e digna.
- source_word: κώμων
  choice: festejos desenfreados
  rationale: Designa celebrações ruidosas e dissolutas; a expressão comunica o caráter excessivo sem recorrer a vocabulário arcaico.
- source_word: ἐθνῶν
  choice: gentios
  rationale: No contexto judaico, indica os não judeus em contraste com o santuário santo, sem acrescentar a carga religiosa mais específica de “pagãos”.
- source_word: θρασυνόντων
  choice: descaradamente
  rationale: O particípio comunica conduta atrevida e insolente; o advérbio qualifica naturalmente a ação que se segue.
- source_word: ἑταίρων
  choice: prostitutas
  rationale: No uso helenístico e neste contexto de profanação sexual, o termo normalmente designa cortesãs ou prostitutas, não simples companheiras.
- source_word: ἐν τοῖς ἱεροῖς
  choice: nos recintos sagrados
  rationale: O plural aponta para as áreas sagradas do complexo do templo sem especificar indevidamente uma estrutura arquitetônica.
- source_word: τερβόλων γυναιξὶ πλησιαζόντων
  choice: aproximando-se de mulheres
  rationale: A formulação conserva o sentido básico de πλησιάζω e deixa que o contexto sugira a impropriedade sexual, sem torná-la mais explícita do que o grego.
- source_word: τὰ μὴ καθήκοντα
  choice: coisas impróprias
  rationale: Mantém a referência deliberadamente ampla a objetos ou práticas inadequados ao santuário, sem restringi-la a uma categoria legal específica.
- source_word: ἔνδον εἰσφερόντων
  choice: levando para dentro
  rationale: Preserva de modo natural a ênfase espacial na introdução dessas coisas no interior do espaço sagrado.
theological_decisions:
- issue: Sentido de ἐθνῶν no contexto da profanação cultual judaica
  choice: gentios
  alternative: nações; pagãos
  rationale: “Gentios” mantém o contraste étnico-religioso entre os não judeus e o santuário sem intensificar a censura com uma designação não exigida pelo termo.
- issue: Grau de explicitação da conduta sexual em πλησιαζόντων
  choice: aproximando-se de mulheres
  alternative: mantendo relações com mulheres; envolvendo-se com mulheres
  rationale: O contexto sugere fortemente conduta sexual imprópria, mas o verbo grego é menos explícito; a tradução preserva essa tensão em vez de resolvê-la no texto principal.
translation_notes:
  register: Português moderno, natural e solene, com ampla legibilidade brasileira. A construção “era tomado... que o enchiam” conserva tanto a profanação sofrida pelo santuário quanto a agência dos gentios, evitando a rigidez de um passivo literal. Os marcadores [a] e [b] aparecem no texto principal.
