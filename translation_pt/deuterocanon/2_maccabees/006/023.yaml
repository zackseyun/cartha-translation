    rationale: A construção grega apresenta Eleazar tomando uma decisão nobre, digna das qualidades enumeradas, e então, mais decisivamente, declarando-se em conformidade com a santa legislação. A pontuação com ponto e “uma decisão” altera esse vínculo e enfraquece a progressão da frase.
  revised_text: Eleazar, porém, tomou uma decisão nobre, digna de sua idade, da dignidade da velhice, da conduta distinta que havia adquirido e de seu excelente modo de viver desde a infância — ou melhor, em conformidade com a santa legislação estabelecida por Deus — e declarou abertamente que o enviassem sem demora ao Hades.[a]
