base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/023.yaml
  text: But he[a], adopting a noble resolve worthy of his age and of the dignity of old age, and of the distinction of his acquired and honored way of life, and of the finest conduct from childhood—rather, in keeping with the holy and God-given law—declared himself plainly, saying that they should send him quickly to Hades.
translation:
  language: pt
  text: Eleazar, porém, tomou uma decisão nobre, digna de sua idade, da dignidade da velhice, da conduta distinta que havia adquirido e de seu excelente modo de viver desde a infância — ou melhor, em conformidade com a santa legislação estabelecida por Deus — e declarou abertamente que o enviassem sem demora ao Hades.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao reino dos mortos”. Em grego, “ao Hades”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισμὸν ἀστεῖον
  choice: uma decisão nobre
  rationale: λόγισμος indica aqui uma decisão ponderada, e ἀστεῖος qualifica seu valor moral como nobre ou digno.
- source_word: ἐπικτήτου καὶ ἐπιφανοῦς πολιτείας
  choice: da conduta distinta que havia adquirido
  rationale: πολιτεία, nesta enumeração sobre o caráter de Eleazar, refere-se à conduta ou modo de vida; ἐπίκτητος preserva a ideia de algo adquirido, e ἐπιφανής, a de distinção reconhecida.
- source_word: ἐκ παιδὸς καλλίστης ἀναστροφῆς
  choice: de seu excelente modo de viver desde a infância
  rationale: ἀναστροφή denota conduta ou modo de vida, enquanto ἐκ παιδός situa essa trajetória desde a infância.
- source_word: τῆς ἁγίας καὶ θεοκτίστου νομοθεσίας
  choice: a santa legislação estabelecida por Deus
  rationale: νομοθεσία é propriamente legislação ou ordenamento legal, e θεόκτιστος expressa que foi estabelecida por Deus.
- source_word: ἀκολούθως ἀπεφήνατο
  choice: Então declarou abertamente
  rationale: ἀκολούθως liga a declaração à legislação precedente; em português, essa relação já é explicitada por “uma decisão coerente com”, permitindo que “então” faça a transição natural para ἀπεφήνατο.
- source_word: ταχέως λέγων προπέμπειν εἰς τὸν ᾅδην
  choice: que o enviassem sem demora ao Hades
  rationale: A construção exprime sua exigência de ser enviado prontamente à morada dos mortos; mantém-se “Hades” para não confundir o termo com inferno ou juízo final.
theological_decisions:
- issue: Tradução de ᾅδης
  choice: Hades
  alternative: morada dos mortos
  rationale: O termo grego designa o domínio dos mortos, não necessariamente o lugar de punição final. A transliteração preserva essa distinção, e a nota esclarece o sentido.
- issue: Tradução de θεοκτίστου νομοθεσίας
  choice: a santa legislação estabelecida por Deus
  alternative: a lei santa dada por Deus
  rationale: A formulação preserva tanto a santidade quanto a origem divina da legislação, sem reduzir νομοθεσία silenciosamente a uma designação denominacional da Lei mosaica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe aliviada para evitar uma enumeração excessivamente pesada. O nome “Eleazar” explicita o referente do pronome grego a partir do contexto imediato. A correção retórica de μᾶλλον δέ foi preservada por “ou melhor”.
