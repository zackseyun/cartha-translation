base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/012.yaml
  text: Therefore I urge those who read this book not to be disheartened because of these calamities[a], but to consider that these punishments are not for destruction[c][b], but for the discipline of our people.
translation:
  language: pt
  text: Por isso, exorto os que leem este livro[a] a não desanimarem[b] por causa dessas calamidades, mas a considerarem que esses castigos não são para a destruição, e sim para a disciplina[c] do nosso povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega também pode ser traduzida como “os que se deparam com este livro”.
    reason: lexical_alternative
  - marker: b
    text: Ou “a não perderem o ânimo”.
    reason: lexical_alternative
  - marker: c
    text: “Disciplina” também pode ser traduzida como “instrução” ou “correção”; o termo grego inclui a ideia de formação por meio da correção.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: exorto
  rationale: Expressa o apelo sério e enfático do narrador, em linguagem digna e ainda corrente em português.
- source_word: τοὺς ἐντυγχάνοντας τῇδε τῇ βίβλῳ
  choice: os que leem este livro
  rationale: No contexto de um livro, ἐντυγχάνω se refere naturalmente aos que entram em contato com a obra por meio da leitura; a nota preserva o sentido mais literal de “deparar-se com”.
- source_word: μὴ συντελεσθαι
  choice: a não desanimarem
  rationale: A forma verbal comunica a ideia de não sucumbir interiormente nem perder o ânimo diante dos acontecimentos.
- source_word: διὰ τὰς συμφορὰς
  choice: por causa dessas calamidades
  rationale: συμφοραί designa graves infortúnios ou desastres; “calamidades” mantém o peso do contexto.
- source_word: λογίζεσθαι
  choice: a considerarem
  rationale: Preserva o sentido de avaliar ou reconhecer refletidamente a natureza e a finalidade dos castigos.
- source_word: τὰς τιμωρίας
  choice: esses castigos
  rationale: τιμωρία denota castigo ou punição; o demonstrativo estabelece em português a ligação natural com as calamidades já mencionadas.
- source_word: μὴ πρὸς ὄλεθρον
  choice: não são para a destruição
  rationale: Mantém tanto o sentido de ruína ou destruição de ὄλεθρος quanto a orientação final expressa por πρὸς.
- source_word: ἀλλὰ πρὸς παιδείαν
  choice: e sim para a disciplina
  rationale: παιδεία reúne os sentidos de disciplina, correção e formação; “disciplina” preserva melhor essa amplitude no contexto de sofrimento corretivo.
- source_word: τοῦ γένους ἡμῶν
  choice: do nosso povo
  rationale: γένος designa aqui a comunidade judaica entendida como grupo de parentesco e povo; evita as conotações modernas potencialmente enganosas de “raça”.
theological_decisions:
- issue: O sofrimento como destruição punitiva ou disciplina corretiva
  choice: Os castigos são apresentados como destinados à disciplina do povo, não à sua destruição.
  alternative: Entender παιδεία apenas como instrução geral, sem a dimensão de correção por meio do sofrimento.
  rationale: O contraste explícito entre μὴ πρὸς ὄλεθρον e ἀλλὰ πρὸς παιδείαν atribui aos castigos uma finalidade corretiva e formativa em vez de destrutiva. A tradução mantém esse contraste sem identificar expressamente o agente dos castigos, que o versículo não nomeia.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A construção “não são para... e sim para...” conserva de modo direto o contraste teleológico do grego, sem explicitar uma agência divina que permanece implícita no contexto.
