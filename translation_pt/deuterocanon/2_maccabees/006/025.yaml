  yaml_path: translation/deuterocanon/2_maccabees/006/025.yaml
  text: and they too[a], because of my hypocrisy and because of this brief and momentary life, might be led astray because of me[c][b], and I would acquire hatred and a stain upon my old age.
translation:
  language: pt
  text: e eles também, por causa do meu fingimento[a] e desta vida breve e passageira[b], sejam desencaminhados por minha causa; e eu atraia sobre mim repulsa[c] e uma mancha na minha velhice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “hipocrisia” ou “dissimulação”. O grego indica uma conduta fingida que enganaria quem a observasse.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “por causa do viver breve e momentâneo”, isto é, para conservar por pouco tempo a vida que lhe restava.
    reason: lexical_alternative
  - marker: c
    text: O termo grego também pode significar “impureza”, “abominação” ou “aversão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόκρισιν
  choice: fingimento
  rationale: No contexto, o termo indica uma conduta encenada que daria uma falsa impressão aos observadores. “Fingimento” comunica isso de modo mais direto em português atual do que “hipocrisia”, sem diminuir a gravidade moral.
- source_word: μικρὸν καὶ ἀκαριαῖον ζῆν
  choice: desta vida breve e momentânea
  rationale: O infinitivo substantivado refere-se ao curto período de vida que Eleazar poderia preservar. A formulação natural conserva tanto a brevidade quanto a transitoriedade expressas pelos dois adjetivos.
- source_word: πλανηθῶσιν
  choice: sejam desencaminhados
  rationale: A forma passiva no subjuntivo apresenta os observadores como levados ao erro pelo exemplo de Eleazar; “desencaminhados” mantém juntas as ideias de engano e desvio moral.
- source_word: μύσος
  choice: repulsa
  rationale: O substantivo pode exprimir impureza, abominação ou aquilo que provoca aversão. “Repulsa” preserva aqui a ideia de tornar-se objeto de aversão pública, sem confundi-la com simples ódio pessoal.
- source_word: κηλῖδα
  choice: uma mancha
  rationale: A tradução conserva a metáfora concreta de uma nódoa sobre a reputação.
- source_word: γήρως
  choice: para a minha velhice
  rationale: A expressão liga a mancha aos anos finais de uma vida até então honrada e mantém o efeito patético do grego.
- source_word: κατακτήσωμαι
  choice: eu atraia sobre mim
  rationale: A voz média indica algo que o próprio Eleazar obteria para si como consequência de sua conduta. “Atraia sobre mim” exprime naturalmente esse caráter autoinfligido.
theological_decisions:
- issue: Força moral de ὑπόκρισις no contexto do martírio
  choice: fingimento
  alternative: hipocrisia; dissimulação
  rationale: A tradução destaca uma conformidade apenas aparente que induziria outros ao erro. Não reduz o ato a uma estratégia neutra nem acrescenta uma categoria doutrinária posterior.
- issue: Sentido da cláusula final
  choice: repulsa e uma mancha que Eleazar atrairia sobre si
  alternative: impureza e uma mancha; ódio e desonra
  rationale: A formulação conserva tanto a aversão ligada a μύσος quanto a metáfora de κηλίς, e a voz média de κατακτάομαι é representada como consequência que recairia sobre o próprio Eleazar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A minúscula inicial preserva o fato de que o trecho continua a construção sintática do versículo anterior. O ponto e vírgula distingue a consequência para os outros da desonra que recairia sobre Eleazar.
