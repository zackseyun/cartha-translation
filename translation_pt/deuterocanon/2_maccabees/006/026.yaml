base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/026.yaml
  text: For even if for the present I escape the punishment from men[b][a], yet I will escape neither alive nor dead from the hands of the Almighty.
translation:
  language: pt
  text: Pois, ainda que por enquanto eu escape do castigo imposto pelos homens[a], não escaparei das mãos do Todo-Poderoso, nem vivo nem morto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de forma mais literal, «do castigo vindo dos homens».
    reason: lexical_alternative
  - marker: b
    text: Isto é, ele não pode escapar do juízo divino nem em vida nem por meio da morte.
    reason: clarification
lexical_decisions:
- source_word: εἰ γὰρ καὶ
  choice: Pois, ainda que
  rationale: Preserva a força explicativa de γάρ e o valor concessivo de καί com εἰ, em português natural.
- source_word: ἐπὶ τοῦ παρόντος
  choice: por enquanto
  rationale: Expressa com clareza a limitação temporal da frase grega.
- source_word: ἐξελοῦμαι
  choice: eu escape
  rationale: Neste contexto, a forma média indica livrar-se ou escapar de uma punição; «escape» é a formulação mais direta.
- source_word: τὴν ἐξ ἀνθρώπων τιμωρίαν
  choice: do castigo imposto pelos homens
  rationale: Torna explícita a origem agentiva indicada por ἐξ e mantém o contraste entre a punição humana e o juízo divino.
- source_word: ἀλλὰ
  choice: não escaparei
  rationale: O contraste adversativo é expresso naturalmente pela passagem da concessão inicial à negação enfática da oração principal, sem necessidade de um «mas» adicional.
- source_word: τὰς τοῦ παντοκράτορος χεῖρας
  choice: das mãos do Todo-Poderoso
  rationale: Mantém a imagem bíblica concreta de «mãos» e traduz παντοκράτωρ por um título divino reconhecível, sem acrescentar «Deus», ausente do grego.
- source_word: οὔτε ζῶν οὔτε ἀποθανών
  choice: nem vivo nem morto
  rationale: Conserva a polaridade incisiva do grego e comunica que nem a vida nem a morte permitem fugir do alcance divino.
- source_word: ἐκφεύξομαι
  choice: não escaparei
  rationale: Reproduz de modo idiomático o futuro e a ideia de escapar das mãos ou do poder de alguém.
theological_decisions:
- issue: Tradução de παντοκράτωρ
  choice: Todo-Poderoso
  alternative: Onipotente
  rationale: «Todo-Poderoso» é um título divino corrente e transparente, preserva a ideia de soberania e poder universais e não acrescenta um substantivo ausente no original.
- issue: Alcance da afirmação οὔτε ζῶν οὔτε ἀποθανών
  choice: nem vivo nem morto
  alternative: nem enquanto viver nem depois de morrer
  rationale: 'A formulação concisa preserva a tensão do texto: a morte não põe o falante fora do alcance do Todo-Poderoso, sem desenvolver uma doutrina do além que o versículo não explicita.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para soar natural, mantendo a concessão inicial, o contraste entre punição humana e poder divino e a imagem das mãos do Todo-Poderoso.
