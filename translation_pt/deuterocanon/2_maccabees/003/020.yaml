  text: And all of them[a], stretching out their hands toward heaven[b], were making supplication.
translation:
  language: pt
  text: E todas elas[a], estendendo as mãos para o céu, faziam uma súplica[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todas as mulheres”; o adjetivo grego está no feminino plural e provavelmente se refere às mulheres mencionadas no contexto anterior.
    reason: lexical_alternative
  - marker: b
    text: O termo grego significa petição insistente ou súplica, não necessariamente uma “ladainha” formal no sentido eclesiástico posterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαι
  choice: todas elas
  rationale: O feminino plural provavelmente retoma as mulheres mencionadas no contexto anterior. “Todas elas” mantém essa referência e soa natural sem repetir explicitamente o substantivo.
- source_word: προτείνουσαι
  choice: estendendo
  rationale: O particípio descreve o gesto simultâneo de estender as mãos em oração.
- source_word: τὰς χεῖρας
  choice: as mãos
  rationale: O artigo grego é reproduzido naturalmente em português; a relação possessiva fica clara pelo sujeito.
- source_word: εἰς τὸν οὐρανόν
  choice: para o céu
  rationale: A preposição indica a direção do gesto, e “céu” é a expressão natural no contexto de oração.
- source_word: ἐποιοῦντο
  choice: faziam
  rationale: O imperfeito expressa uma ação contínua no passado; “faziam” preserva esse aspecto em combinação com “súplicas”.
- source_word: τὴν λιτανείαν
  choice: súplicas
  rationale: O termo designa uma petição insistente ou súplica. O plural idiomático em português comunica a ação reiterada sem sugerir a forma litúrgica posterior associada a “ladainha”.
theological_decisions:
- issue: Sentido de οὐρανός no gesto de oração
  choice: céu
  alternative: firmamento
  rationale: No contexto de uma súplica com as mãos erguidas, “céu” conserva tanto a imagem direcional quanto a associação com a esfera divina, sem acrescentar uma formulação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém o aspecto contínuo do imperfeito e preserva a provável referência feminina sem torná-la mais explícita do que o texto grego.
