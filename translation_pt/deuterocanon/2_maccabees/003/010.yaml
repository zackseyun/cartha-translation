  text: But when the high priest pointed out that these were deposits belonging to widows and orphans,[a]
translation:
  language: pt
  text: Mas, quando o sumo sacerdote explicou que eram depósitos pertencentes a viúvas e órfãos,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «depósitos de viúvas e órfãos». Os genitivos gregos admitem essa tradução mais literal; o sentido provável é que os valores pertenciam a eles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ δὲ ἀρχιερέως
  choice: Mas, quando o sumo sacerdote
  rationale: A construção em genitivo absoluto estabelece a circunstância, enquanto δέ marca uma transição com leve contraste. A formulação portuguesa preserva ambos os valores com naturalidade.
- source_word: ὑποδείξαντος
  choice: explicou
  rationale: O particípio aoristo de ὑποδείκνυμι indica que o sumo sacerdote tornou clara a natureza dos valores. «Explicou» é corrente e adequado ao contexto, sem sugerir necessariamente um gesto físico.
- source_word: παρακαταθήκας
  choice: depósitos
  rationale: O termo designa dinheiro ou bens confiados a alguém para serem guardados. «Depósitos» é conciso e evita importar categorias jurídicas modernas como «fundos fiduciários».
- source_word: εἶναι
  choice: eram
  rationale: O infinitivo integra o discurso indireto dependente de ὑποδείξαντος; em português, a oração finita introduzida por «que» é a construção idiomática.
- source_word: χηρῶν τε καὶ ὀρφανῶν
  choice: pertencentes a viúvas e órfãos
  rationale: Os genitivos indicam mais naturalmente a quem pertenciam os depósitos. A explicitação com «pertencentes a» comunica esse valor possessivo sem eliminar a possibilidade de uma tradução formal mais curta, registrada em nota.
