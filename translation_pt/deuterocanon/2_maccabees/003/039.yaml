  terminology: «Morada no céu» é uma opção natural para κατοικίαν ἐπουράνιον ἔχων e é corretamente qualificada pela nota. «Velar por» e «prestar auxílio» mantêm a distinção entre supervisão/vigilância e ajuda, sem fundi-las num termo teologicamente mais carregado como «protetor».
