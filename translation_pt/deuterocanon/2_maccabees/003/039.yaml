base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/039.yaml
  text: For he himself[a], who has his dwelling in heaven, is the overseer and helper of that place[b], and he strikes and destroys those who come to do harm.
translation:
  language: pt
  text: Pois ele mesmo[a], que tem sua morada no céu, é quem vela por aquele lugar[b] e lhe presta auxílio; ele golpeia e destrói os que vêm para causar dano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que habita no céu”. O grego diz literalmente: “que tem a morada celestial”.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, o templo; o grego diz mais literalmente “daquele lugar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικίαν ἐπουράνιον ἔχων
  choice: que tem sua morada no céu
  rationale: Mantém a construção participial e a referência à habitação celestial, em português natural e sem transformar a expressão em uma identificação explícita não presente no grego.
- source_word: ἐπόπτης
  choice: vigia
  rationale: Expressa aquele que observa e vela por algo, preservando a distinção em relação a βοηθός. “Supervisor” soaria administrativo demais, e “protetor” anteciparia a ideia de auxílio.
- source_word: βοηθός
  choice: auxiliador
  rationale: Reproduz o sentido básico de quem presta auxílio e forma um par distinto com “vigia”, sem impor uma nuance exclusivamente militar.
- source_word: ἐκείνου τοῦ τόπου
  choice: daquele lugar
  rationale: Conserva o termo amplo τόπος; o contexto identifica o lugar como o templo, informação esclarecida em nota sem ser inserida no texto.
- source_word: τοὺς παραγινομένους ἐπὶ κακώσει
  choice: os que vêm para causar dano
  rationale: Comunica com clareza tanto o movimento de chegada quanto a finalidade hostil expressa por ἐπὶ κακώσει.
- source_word: τύπτων ἀπόλλυσι
  choice: golpeando ... ele os destrói
  rationale: Preserva a relação sintática entre o particípio presente e o verbo principal, bem como a intensidade das duas ações, sem recorrer a linguagem arcaica.
theological_decisions:
- issue: Referente de αὐτός
  choice: Manter “ele mesmo”, deixando que o contexto identifique o sujeito como Deus.
  alternative: Explicitar “o próprio Deus”.
  rationale: O contexto aponta para Deus como defensor celestial do templo, mas o versículo grego não acrescenta o substantivo θεός; a tradução conserva a ênfase de αὐτός sem tornar explícito o que permanece contextual.
- issue: Natureza da proteção do templo
  choice: Traduzir separadamente “vigia e auxiliador”.
  alternative: Fundir os termos como “protetor” ou “guardião”.
  rationale: A formulação mantém os dois predicados gregos e evita reduzir a vigilância e o auxílio divinos a uma única noção teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da última oração foi mantida próxima do grego para preservar a relação entre golpear e destruir; “auxiliador” foi preferido a “ajudador” por adequação ao registro literário.
