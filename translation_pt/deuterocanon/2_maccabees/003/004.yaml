  yaml_path: translation/deuterocanon/2_maccabees/003/004.yaml
  text: But a certain Simon[a], of the tribe of Benjamin, having been appointed overseer of the temple, was at odds with the high priest about the administration of the market in the city.
translation:
  language: pt
  text: Certo Simão, porém, da tribo de Benjamim, havia sido nomeado supervisor do templo e estava em desacordo com o sumo sacerdote a respeito da administração do mercado[a] na cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fiscalização do mercado” ou “regulamentação do mercado”. O termo grego se refere à supervisão cívica relacionada ao mercado.
    reason: lexical_alternative
lexical_decisions:
- source_word: προστάτης
  choice: supervisor
  rationale: Expressa uma função oficial de direção e supervisão ligada ao templo, sem atribuir a Simão um título sacerdotal nem sugerir uma função militar.
- source_word: τοῦ ἱεροῦ
  choice: do templo
  rationale: Ἱερόν designa normalmente o complexo do templo; “templo” é claro e natural em português.
- source_word: καθεσταμένος
  choice: havia sido nomeado
  rationale: O particípio indica que Simão fora constituído oficialmente nessa função; o mais-que-perfeito composto esclarece que a nomeação precedia o conflito.
- source_word: διηχθῆναι
  choice: entrou em conflito
  rationale: Comunica uma desavença real com o sumo sacerdote sem intensificá-la indevidamente como hostilidade aberta.
- source_word: ἀρχιερεῖ
  choice: o sumo sacerdote
  rationale: É a designação portuguesa consagrada e precisa para o cargo judaico referido.
- source_word: ἀγορανομίας
  choice: fiscalização do mercado
  rationale: O termo se refere à supervisão ou regulamentação cívica vinculada ao mercado. “Fiscalização” transmite essa atividade administrativa em português corrente.
- source_word: κατὰ τὴν πόλιν
  choice: na cidade
  rationale: Mantém o valor locativo da expressão e evita fundi-la indevidamente com o substantivo como se significasse apenas “mercado municipal”.
theological_decisions:
- issue: Natureza do cargo de Simão em relação ao templo
  choice: Simão é apresentado como supervisor oficialmente nomeado do templo, sem título sacerdotal.
  alternative: Entender προστάτης como “protetor” ou patrono do templo em sentido mais amplo.
  rationale: A combinação προστάτης ... καθεσταμένος aponta para uma função constituída de supervisão. O versículo não afirma que Simão fosse sacerdote, por isso a tradução não acrescenta essa condição.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação verbal evita uma construção participial pesada, preservando a sequência entre a nomeação de Simão e seu conflito com o sumo sacerdote.
