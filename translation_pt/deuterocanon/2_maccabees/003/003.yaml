  yaml_path: translation/deuterocanon/2_maccabees/003/003.yaml
  text: so that even Seleucus[a], the king of Asia[b], used to provide from his own revenues all the expenses that fell due for the services of the sacrifices.
translation:
  language: pt
  text: de modo que até Seleuco, rei da Ásia[a], cobria, com suas próprias receitas, todas as despesas exigidas para os serviços dos sacrifícios.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “Ásia” se refere, no uso helenístico, aos domínios asiáticos do rei selêucida, não ao continente moderno em toda a sua extensão.
    reason: cultural_note
  - marker: b
    text: 'Ou: “todas as despesas necessárias para os serviços dos sacrifícios”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε καὶ
  choice: de modo que até
  rationale: Preserva a ideia de resultado expressa por ὥστε e a ênfase inclusiva de καί, ligando o versículo à descrição anterior.
- source_word: χορηγεῖν
  choice: cobria
  rationale: No contexto financeiro, indica que Seleuco fornecia os recursos necessários às próprias custas; “cobria” combina naturalmente com “despesas” em português.
- source_word: ἐκ τῶν ἰδίων προσόδων
  choice: com suas próprias receitas
  rationale: Mantém o sentido fiscal de πρόσοδοι como receitas ou rendimentos, especialmente os recebimentos do rei.
- source_word: λειτουργίας
  choice: serviços
  rationale: No contexto do templo, refere-se aos serviços rituais ligados aos sacrifícios, sem exigir o sentido eclesiástico posterior de “liturgias” ou “ministérios”.
- source_word: τῶν θυσιῶν
  choice: dos sacrifícios
  rationale: Reproduz diretamente o genitivo grego e conserva a relação entre os serviços do templo e os sacrifícios.
- source_word: ἐπιβάλλοντα δαπανήματα
  choice: despesas exigidas
  rationale: Expressa despesas necessárias ou impostas pelas atividades sacrificiais, de maneira idiomática e sem especificar além do grego quem as teria de pagar.
- source_word: τὸν τῆς Ἀσίας βασιλέα
  choice: rei da Ásia
  rationale: Mantém o título histórico de forma direta; uma nota esclarece o alcance geográfico helenístico de “Ásia”.
theological_decisions:
- issue: Terminologia cultual em uma narrativa histórica deuterocanônica
  choice: serviços dos sacrifícios
  alternative: ministérios dos sacrifícios; liturgias sacrificiais
  rationale: A formulação comunica o funcionamento cultual do templo sem importar categorias eclesiásticas posteriores nem transformar uma informação financeira em afirmação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário histórico-cultual não confessional. “Cobria... as despesas” torna natural a relação financeira, enquanto “serviços dos sacrifícios” permanece próximo da construção grega.
