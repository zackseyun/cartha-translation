  text: and that to wrong those who had trusted in the holiness of the place[a], and in the majesty and inviolability of the temple honored throughout the whole world, was utterly impossible.
translation:
  language: pt
  text: e que era absolutamente impossível cometer injustiça contra os que haviam confiado na santidade do lugar e na majestade e inviolabilidade[a] do templo, honrado no mundo inteiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «direito de asilo»; isto é, a imunidade sagrada do templo contra violação ou apreensão.'
    reason: alternativa lexical
lexical_decisions:
- source_word: ἀδικήσαί
  choice: cometer injustiça contra
  rationale: Expressa com clareza a ação moral e juridicamente injusta contra pessoas, sem restringi-la a dano físico.
- source_word: τοὺς πεπιστευκότας
  choice: os que haviam confiado
  rationale: O particípio perfeito indica uma confiança já depositada e ainda relevante; o mais-que-perfeito português preserva essa anterioridade.
- source_word: ἁγιωσύνῃ
  choice: santidade
  rationale: Reproduz diretamente o caráter sagrado do lugar e mantém distinção em relação à majestade e à proteção jurídica mencionadas depois.
- source_word: σεμνότητι
  choice: majestade
  rationale: Comunica a dignidade elevada e venerável do templo em português natural e solene.
- source_word: ἀσυλίᾳ
  choice: inviolabilidade
  rationale: Abrange a imunidade do templo contra violação ou apreensão, preservando em nota a possível nuance técnica de asilo.
- source_word: τετιμημένου
  choice: honrado
  rationale: O particípio perfeito passivo descreve o reconhecimento duradouro de que o templo desfrutava.
- source_word: κατὰ τὸν σύμπαντα κόσμον
  choice: no mundo inteiro
  rationale: Preserva o alcance universal e retórico da expressão de modo idiomático.
- source_word: παντελῶς ἀμήχανον εἶναι
  choice: era absolutamente impossível
  rationale: Mantém a forte intensificação da impossibilidade presente nos dois termos gregos.
theological_decisions:
- issue: Se ἀσυλίᾳ deve ser traduzido com linguagem explícita de asilo
  choice: inviolabilidade
  alternative: direito de asilo; condição de asilo
  rationale: O termo pode evocar especificamente o privilégio de asilo, mas aqui aparece coordenado com qualidades abstratas do templo. “Inviolabilidade” conserva a proteção jurídico-sacral sem estreitar prematuramente o sentido; a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A construção mantém o verso como continuação sintática do contexto anterior. O marcador [a] foi colocado junto de «inviolabilidade», termo ao qual a nota corresponde.
