  text: But he suddenly fell to the ground and was enveloped in deep darkness[a]; and they picked him up and put him on a stretcher,
translation:
  language: pt
  text: Mas ele caiu de repente por terra e foi envolvido por densas trevas[a]; então o ergueram e o colocaram numa maca,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego de Swete repete γῆν três vezes seguidas (literalmente, “por terra terra terra”). Trata-se quase certamente de uma repetição de copista ou de transcrição; a tradução segue o sentido claro da expressão: “por terra”.'
    reason: textual_variant
lexical_decisions:
- source_word: αἴφνω
  choice: de repente
  rationale: Expressa a ocorrência súbita e inesperada com linguagem natural no português atual.
- source_word: πεσόντα
  choice: caiu
  rationale: Traduz diretamente o particípio aoristo de πίπτω sem acrescentar a interpretação mais específica de que ele desmaiou.
- source_word: πρὸς τὴν γῆν
  choice: por terra
  rationale: Equivalente idiomático que preserva o movimento da queda em direção ao chão.
- source_word: πολλῷ σκότει
  choice: densas trevas
  rationale: Comunica a intensidade da escuridão em registro digno e corrente, sem definir se a experiência foi física, perceptiva ou sobrenatural.
- source_word: περιχυθέντα
  choice: foi envolvido
  rationale: Preserva a imagem passiva de algo que se derrama ao redor ou cobre completamente a pessoa.
- source_word: συναρπάσαντες
  choice: o ergueram
  rationale: No contexto, indica que os presentes o apanharam após a queda; esta formulação é clara e não sugere a violência que 'agarraram' poderia implicar.
- source_word: φορεῖον
  choice: maca
  rationale: É o equivalente moderno mais claro para o objeto usado para transportar uma pessoa incapacitada.
- source_word: ἐνθέντες
  choice: o colocaram numa
  rationale: Transmite naturalmente o ato de pô-lo no meio de transporte, mantendo a sequência de ações do grego.
theological_decisions:
- issue: Natureza das “densas trevas”
  choice: Manter a expressão sem explicar sua natureza
  alternative: Interpretá-las explicitamente como cegueira, desmaio ou manifestação sobrenatural
  rationale: O grego descreve Heliodoro como envolvido por trevas, mas não resolve aqui a natureza exata da experiência; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação verbal explicita em português a sequência dos particípios gregos sem alterar seu encadeamento. A vírgula final foi preservada porque o versículo fornecido continua sintaticamente no contexto.
