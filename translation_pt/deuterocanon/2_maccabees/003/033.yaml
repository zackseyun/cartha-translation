base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/033.yaml
  text: And while the high priest was making atonement[a], the same young men appeared again to Heliodorus, clothed in the same garments, and standing there they said, “Give many thanks to Onias the high priest, for because of him the Lord has graciously granted you your life.”
translation:
  language: pt
  text: 'Enquanto o sumo sacerdote realizava o rito de expiação[a], os mesmos jovens apareceram novamente a Heliodoro, vestidos com as mesmas roupas. De pé, disseram: “Seja muito grato ao sumo sacerdote Onias, pois foi por causa dele que o Senhor lhe concedeu bondosamente a vida.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “realizava a expiação”; mais tecnicamente, “realizava o rito de propiciação”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιουμένου ... τὸν ἱλασμόν
  choice: realizava o rito de expiação
  rationale: A construção designa a realização de um ato ritual expiatório. A formulação é natural em português, conserva o contexto cultual e evita sugerir que o sacerdote produzia por si mesmo a expiação.
- source_word: οἱ αὐτοὶ νεανίαι
  choice: os mesmos jovens
  rationale: Mantém a referência masculina e a continuidade explícita com os personagens que haviam aparecido antes.
- source_word: ἐν ταῖς αὐταῖς ἐσθήσεσιν ἐστολισμένοι
  choice: vestidos com as mesmas roupas
  rationale: Expressa com clareza tanto o estado de estarem trajados quanto a identidade visual das vestes, sem ornamentação indevida.
- source_word: στάντες
  choice: De pé
  rationale: Reproduz a postura indicada pelo particípio sem acrescentar uma localização que o grego não especifica.
- source_word: Πολλὰ ... χάριτας ἔχε
  choice: Seja muito grato
  rationale: O idioma grego exorta Heliodoro a nutrir profunda gratidão. Esta forma é mais natural em português do que uma reprodução literal do plural χάριτας.
- source_word: διὰ γὰρ αὐτὸν
  choice: pois foi por causa dele
  rationale: διά com acusativo indica aqui causa ou motivo; a construção também preserva a função explicativa de γάρ.
- source_word: σοὶ κεχάρισται τὸ ζῆν
  choice: lhe concedeu bondosamente a vida
  rationale: χαρίζομαι comunica uma concessão favorável ou graciosa, enquanto τὸ ζῆν é expresso de modo idiomático como 'a vida'.
- source_word: Κύριος
  choice: o Senhor
  rationale: Forma portuguesa corrente e reverente para o título divino neste contexto.
theological_decisions:
- issue: Sentido cultual de ἱλασμός
  choice: rito de expiação
  alternative: rito de propiciação; fazia expiação
  rationale: “Expiação” preserva o peso sacrificial e a ideia de remoção da culpa sem impor uma teoria específica da expiação; “rito” explicita que se trata de uma ação cultual realizada pelo sumo sacerdote.
- issue: Nuance favorável de κεχάρισται
  choice: concedeu bondosamente
  alternative: concedeu; favoreceu, concedendo
  rationale: A tradução conserva o elemento de favor ou graça do verbo, sem transformar a declaração em uma formulação doutrinária mais específica.
- issue: Relação causal de διὰ ... αὐτόν
  choice: por causa dele
  alternative: por meio dele
  rationale: O acusativo favorece a ideia de causa ou motivo. A tradução mantém a afirmação de que a vida de Heliodoro foi poupada em consideração a Onias, sem explicar o mecanismo dessa relação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A divisão em duas frases reduz o peso sintático sem alterar a sequência narrativa. “Bondosamente” preserva a nuance de favor de κεχάρισται; “De pé” evita acrescentar “ao lado dele” ou “ali”, elementos ausentes do grego.
