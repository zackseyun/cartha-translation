base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/024.yaml
  text: But when he had already arrived there with the guards at the treasury[a], the Sovereign of spirits and of all authority made a great manifestation, so that all who had dared to come in, struck with awe at the power of God[c][b], were turned to weakness and fear.
translation:
  language: pt
  text: Mas, quando ele já havia chegado ali com os guardas[a], na tesouraria, o Soberano dos espíritos e de toda autoridade realizou uma grande manifestação[b], de modo que todos os que haviam ousado entrar[c], tomados de assombro diante do poder de Deus, ficaram reduzidos à fraqueza e ao medo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “guarda-costas”; o grego se refere literalmente a portadores de lança.
    reason: lexical_alternative
  - marker: b
    text: Ou “fez uma grande aparição”; o grego ressalta uma manifestação divina impressionante.
    reason: lexical_alternative
  - marker: c
    text: A expressão também pode ser entendida, de modo mais geral, como “haviam ousado reunir-se” ou “comparecer”; o contexto imediato favorece a ideia de entrar na área da tesouraria.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτόθι
  choice: ali
  rationale: Retoma de modo natural, em português, o lugar mencionado no contexto imediato.
- source_word: δορυφόροις
  choice: guardas
  rationale: Embora o termo designe literalmente portadores de lança, aqui indica funcionalmente a escolta armada de Heliodoro.
- source_word: γαζοφυλάκιον
  choice: tesouro
  rationale: Designa o recinto onde se guardavam os bens valiosos; “tesouro” é conciso e corrente no contexto do templo.
- source_word: ὁ τῶν πνευμάτων καὶ πάσης ἐξουσίας δυνάστης
  choice: o Soberano dos espíritos e de toda autoridade
  rationale: “Soberano” preserva o sentido de governante poderoso de δυνάστης sem substituí-lo pelo título κύριος; “toda autoridade” mantém a abrangência de πάσης ἐξουσίας.
- source_word: ἐπιφάνειαν μεγάλην ἐποίησεν
  choice: realizou uma grandiosa manifestação
  rationale: Preserva a ideia de uma intervenção divina visível e impressionante, com formulação digna e inteligível.
- source_word: κατατολμήσαντας συνελθεῖν
  choice: haviam ousado entrar
  rationale: O contexto favorece a entrada na área do tesouro, embora συνελθεῖν possa, de modo mais geral, significar reunir-se ou comparecer.
- source_word: καταπλαγέντας
  choice: tomados de assombro
  rationale: Expressa o impacto súbito de espanto e temor produzido pela manifestação do poder divino.
- source_word: τὴν τοῦ θεοῦ δύναμιν
  choice: diante do poder de Deus
  rationale: A preposição acrescentada torna natural em português a relação com “tomados de assombro”, sem alterar o conteúdo.
- source_word: εἰς ἔκλυσιν καὶ δειλίαν τραπῆναι
  choice: ficaram reduzidos à fraqueza e ao medo
  rationale: Comunica a passagem para um estado de prostração ou perda de forças e de temor, evitando intensificar δειλία além do necessário.
theological_decisions:
- issue: Título divino ὁ τῶν πνευμάτων καὶ πάσης ἐξουσίας δυνάστης
  choice: o Soberano dos espíritos e de toda autoridade
  alternative: o Senhor dos espíritos e de todo poder
  rationale: A escolha mantém a distinção lexical entre δυνάστης e κύριος e conserva a afirmação da supremacia divina sobre os espíritos e toda autoridade, sem impor uma interpretação mais específica sobre a identidade dos “espíritos”.
- issue: Caráter da intervenção em ἐπιφάνειαν μεγάλην ἐποίησεν
  choice: realizou uma grandiosa manifestação
  alternative: fez uma grande aparição
  rationale: “Manifestação” conserva a linguagem epifânica e não determina além do texto a forma exata da intervenção, que é desenvolvida nos versículos seguintes.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, mantendo o encadeamento do grego e suas ambiguidades relevantes.
