  text: So then they were calling on the all-powerful Lord to keep what had been entrusted to those who had made the deposit safe with all security[a].
translation:
  language: pt
  text: Assim, eles invocavam o Senhor todo-poderoso, pedindo-lhe que guardasse em completa segurança os bens confiados por aqueles que os haviam entregue para guarda[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os bens confiados àqueles que os haviam entregue para guarda». O grego se refere às pessoas que haviam deixado seus bens sob custódia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεκαλοῦντο
  choice: invocavam
  rationale: O imperfeito indica uma súplica em andamento; «invocavam» conserva o sentido religioso e é natural em português.
- source_word: παγκρατῆ
  choice: todo-poderoso
  rationale: Expressa aquele que detém poder sobre tudo, em linguagem transparente e reverente.
- source_word: κύριον
  choice: Senhor
  rationale: É o título divino reverencial apropriado para κύριος neste contexto.
- source_word: τὰ πεπιστευμένα
  choice: os bens confiados
  rationale: O particípio substantivado se refere, no contexto, aos bens entregues para custódia; «bens» torna o referente claro sem especificar sua natureza.
- source_word: τοῖς πεπιστευκόσιν
  choice: para aqueles que os haviam posto sob custódia
  rationale: O particípio ativo designa as pessoas que entregaram os bens para serem guardados; a formulação evita o sentido financeiro moderno de «depositantes».
- source_word: σῶα διαφυλάσσειν
  choice: preservasse ... os bens
  rationale: A combinação verbal exprime manter os bens intactos e seguros; «preservasse» transmite tanto a guarda quanto a conservação.
- source_word: μετὰ πάσης ἀσφαλείας
  choice: em completa segurança
  rationale: Reproduz a intensificação do grego com uma expressão corrente e natural em português.
theological_decisions:
- issue: Tradução do título divino κύριον
  choice: Senhor
  alternative: Soberano
  rationale: «Senhor» preserva o título reverencial tradicional e corresponde diretamente a κύριος, sem introduzir uma nuance não exigida pelo contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «pedindo que» explicita naturalmente a função do infinitivo grego após o verbo de invocação, sem alterar o conteúdo da súplica.
