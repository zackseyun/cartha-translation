  text: After setting a day[a], he went in to arrange the examination concerning these matters; and there was no small anxiety throughout the whole city.
translation:
  language: pt
  text: Depois de marcar um dia, ele entrou para organizar a inspeção relativa a essas questões; e não era pequena a apreensão[a] por toda a cidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “não era pequena a apreensão”, uma lítotes que indica grande aflição pública.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταξάμενος ἡμέραν
  choice: Depois de marcar um dia
  rationale: O particípio aoristo médio indica a fixação prévia de um dia. A formulação preserva a relação temporal e a indefinição do substantivo anartro.
- source_word: εἰσῄει
  choice: ele entrou
  rationale: O imperfeito é apresentado de modo natural na sequência narrativa, conservando a ideia de movimento para dentro.
- source_word: τὴν περὶ τούτων ἐπίσκεψιν
  choice: a inspeção relativa a essas questões
  rationale: ἐπίσκεψις designa aqui uma averiguação oficial no contexto do tesouro do templo; “inspeção” mantém o caráter administrativo, e περὶ τούτων não é omitido.
- source_word: οἰκονομήσων
  choice: para organizar
  rationale: O particípio futuro expressa finalidade. “Organizar” comunica a intenção de administrar ou providenciar a inspeção sem acrescentar que ela já foi realizada.
- source_word: οὐ μικρὰ
  choice: não era pequena
  rationale: Preserva a lítotes grega em vez de reduzi-la a “grande”, mantendo sua força retórica.
- source_word: καθʼ ὅλην τὴν πόλιν
  choice: por toda a cidade
  rationale: Expressa a distribuição da apreensão pela cidade inteira e conserva a ênfase de ὅλην.
- source_word: ἀγωνία
  choice: apreensão
  rationale: No contexto, descreve a intensa inquietação coletiva diante da inspeção iminente. “Apreensão” é corrente e evita sugerir sofrimento físico.
