  text: Because of the piety and hatred of wickedness there, it came about that even the kings themselves honored the place and glorified the sanctuary with the finest gifts sent.
translation:
  language: pt
  text: Por causa da piedade e do repúdio à maldade, acontecia que até os próprios reis honravam o lugar e glorificavam o santuário com as mais excelentes ofertas enviadas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com as mais esplêndidas ofertas enviadas”. O termo grego pode designar coisas remetidas como dádivas ou benfeitorias; a nuance exata depende do contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσέβειαν
  choice: piedade
  rationale: Expressa reverência a Deus manifestada em conduta devota e se ajusta naturalmente ao contexto do templo.
- source_word: μισοπονηρίαν
  choice: repúdio à maldade
  rationale: Preserva a forte rejeição moral contida no composto grego, evitando em português a possível conotação pessoal de 'ódio'.
- source_word: συνέβαινεν
  choice: acontecia
  rationale: O imperfeito indica uma consequência ou situação recorrente; 'acontecia' comunica esse aspecto com naturalidade.
- source_word: τιμᾶν
  choice: honravam
  rationale: Mantém o sentido de conferir honra e elevada consideração pública ao lugar.
- source_word: τὸν τόπον
  choice: o lugar
  rationale: Reproduz a referência reverencial e não especificada do grego ao local do templo.
- source_word: τὸ ἱερὸν
  choice: o santuário
  rationale: Conserva o caráter sagrado do recinto e distingue esta expressão de 'o lugar'.
- source_word: ἀποστολαῖς
  choice: presentes enviados
  rationale: No contexto, indica bens remetidos como dádivas ou benfeitorias ao santuário; a formulação preserva a ideia lexical de envio.
- source_word: ταῖς κρατίσταις
  choice: os mais excelentes
  rationale: Traduz o superlativo como indicação da qualidade superior das dádivas.
- source_word: δοξάζειν
  choice: glorificavam
  rationale: Preserva a distinção em relação a τιμᾶν e comunica a concessão de honra e esplendor ao santuário.
theological_decisions:
- issue: As qualidades morais como causa do favor dos reis
  choice: A piedade e o repúdio à maldade são apresentados sem um portador pessoal explicitamente identificado.
  alternative: Atribuir essas qualidades especificamente ao sumo sacerdote, à administração da cidade ou ao templo.
  rationale: O grego apresenta as qualidades como base causal do resultado, mas neste trecho não explicita quem as manifesta. A expressão 'que havia ali' mantém a referência ampla e não resolve indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A ordem causal e a ambiguidade quanto ao portador da piedade e do repúdio à maldade foram preservadas; a repetição conceitual entre 'honravam' e 'glorificavam' reflete os dois verbos gregos.
