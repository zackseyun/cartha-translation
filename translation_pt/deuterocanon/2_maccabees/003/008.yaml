  text: So Heliodorus immediately set out on the journey[a], outwardly as though to inspect the cities of Coele-Syria and Phoenicia, but in reality to carry out the king’s purpose.
translation:
  language: pt
  text: Heliodoro pôs-se imediatamente a caminho, aparentemente para inspecionar as cidades da Celessíria e da Fenícia, mas, na realidade, para executar o propósito do rei[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto-fonte traz aqui um “A” anômalo antes de “rei” (βασιλέως), provavelmente um artefato editorial ou de transcrição, e não parte do sentido. A tradução segue o significado contextual claro: “o propósito do rei”.'
