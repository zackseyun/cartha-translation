lexical_decisions:
- source_word: εὐθέως
  choice: imediatamente
  rationale: Expressa a prontidão da ação em português moderno e claro.
- source_word: ἐποιεῖτο τὴν πορίαν
  choice: partiu ... em viagem
  rationale: Reproduz naturalmente o sentido de iniciar ou empreender a viagem, sem recorrer a uma formulação excessivamente literal.
- source_word: τῇ μὲν ἐμφάσει
  choice: aparentemente
  rationale: Marca de modo conciso o contraste entre a aparência declarada e a finalidade real, sem tornar a ideia de pretexto mais explícita do que o grego.
- source_word: ὡς ... ἐφοδεῦσαι
  choice: para inspecionar
  rationale: ὡς com o infinitivo apresenta a finalidade aparente; ἐφοδεῦσαι sugere percorrer para examinar ou inspecionar, mais do que uma simples visita.
- source_word: τὰς κατὰ Κοίλην Συρίαν καὶ Φοινίκην πόλεις
  choice: as cidades da Celessíria e da Fenícia
  rationale: Emprega os nomes geográficos históricos correntes em português e preserva a relação regional do original.
- source_word: τῷ πράγματι δέ
  choice: mas, na realidade
  rationale: Conserva claramente a oposição entre aparência e realidade.
- source_word: τὴν ... πρόθεσιν ἐπιτελεῖν
  choice: executar o propósito
  rationale: Traduz πρόθεσις como intenção deliberada e ἐπιτελεῖν como sua efetivação; a expressão é digna e natural.
- source_word: τοῦ A βασιλέως
  choice: do rei
  rationale: O “A” isolado no texto fornecido parece ser uma anomalia editorial ou de transcrição, sem função inteligível na construção; verte-se o sentido contextual claro.
