  yaml_path: translation/deuterocanon/2_maccabees/003/005.yaml
  text: And since he was unable to overcome Onias[a], he went to Apollonius son of Thrasaeus[b], who at that time was governor of Coele-Syria and Phoenicia.
translation:
  language: pt
  text: Como não conseguia prevalecer contra Onias, dirigiu-se a Apolônio, filho de Traseu[a], que naquele tempo era governador[b] da Celessíria e da Fenícia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Apolônio Traseu”. O genitivo grego pode ser entendido como patronímico; aqui foi traduzido por “filho de Traseu”.'
    reason: lexical_alternative
  - marker: b
    text: O título grego também pode significar “general” ou “comandante militar”; aqui foi traduzido por “governador” porque o contexto destaca sua autoridade sobre a Celessíria e a Fenícia.
    reason: lexical_alternative
lexical_decisions:
- source_word: νικήσαι
  choice: prevalecer contra
  rationale: Expressa a ideia de obter vantagem sobre Onias em uma disputa, sem sugerir necessariamente uma derrota militar.
- source_word: μὴ δυνάμενος
  choice: Como não conseguia
  rationale: Transmite de modo natural o valor circunstancial e causal do particípio grego.
- source_word: ἦλθεν πρὸς
  choice: foi procurar
  rationale: Indica o movimento em direção a Apolônio e, no contexto narrativo, comunica naturalmente que ele recorreu a essa autoridade.
- source_word: Ἀπολλώνιον Θρασαίου
  choice: Apolônio, filho de Traseu
  rationale: O genitivo Θρασαίου é entendido de modo mais natural como patronímico; a tradução explicita a relação para o leitor moderno.
- source_word: τὸν ... στρατηγόν
  choice: que ... era governador
  rationale: Embora στρατηγός também possa significar comandante militar, a jurisdição territorial aqui indicada favorece o sentido administrativo de governador.
- source_word: κατʼ ἐκεῖνον τὸν καιρόν
  choice: naquele tempo
  rationale: Reproduz com clareza a localização temporal do cargo de Apolônio.
- source_word: Κοίλης Συρίας καὶ Φοινίκης
  choice: da Celessíria e da Fenícia
  rationale: Emprega as formas portuguesas tradicionais dos nomes históricos das regiões.
