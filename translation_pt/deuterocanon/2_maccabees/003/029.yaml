  yaml_path: translation/deuterocanon/2_maccabees/003/029.yaml
  text: And he[a], because of the divine power, lay speechless and deprived of all hope and salvation;
translation:
  language: pt
  text: Ele, pela ação divina, jazia sem poder falar, privado de toda esperança e de salvação[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “livramento” ou “resgate”. Neste contexto, o termo grego pode referir-se a ser livrado do perigo ou da morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: θείαν ἐνέργειαν
  choice: ação divina
  rationale: ἐνέργεια indica atuação ou poder em operação. “Ação divina” expressa de modo natural que o estado dele resultou da intervenção ativa de Deus, sem reduzir o termo a uma ideia abstrata de poder.
- source_word: ἄφωνος
  choice: sem fala
  rationale: O adjetivo significa “sem voz” ou “incapaz de falar”. “Sem fala” conserva essa condição concreta em linguagem clara e digna.
- source_word: πάσης ἐστερημένος ἐλπίδος καὶ σωτηρίας
  choice: privado de toda esperança de salvação
  rationale: A formulação acompanha de perto a construção grega. Neste contexto, “salvação” pode referir-se concretamente a resgate ou livramento da morte, não necessariamente à salvação em sentido doutrinário.
- source_word: ἔρριπτο
  choice: jazia
  rationale: A forma verbal descreve o estado contínuo em que ele se encontrava, caído e incapacitado. “Jazia” é natural no contexto e preserva a gravidade da cena sem acrescentar um agente não expresso.
theological_decisions:
- issue: Sentido de σωτηρία no contexto de juízo e perigo físico
  choice: salvação
  alternative: livramento; resgate
  rationale: “Salvação” mantém a amplitude lexical do grego, enquanto o contexto imediato permite entendê-la como sobrevivência, resgate ou livramento físico. A nota preserva essas possibilidades sem impor uma leitura exclusivamente doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para soar natural, mantendo a relação causal e o estado contínuo descritos no grego.
