  source_fidelity: 'A tradução transmite adequadamente a causa divina, a incapacidade de falar e o estado de queda descrito por ἔρριπτο. Contudo, «privado de toda esperança de salvação» pode em português ligar «esperança» a «salvação» como seu complemento («esperança de ser salvo»), ao passo que o grego coordena δύο objetos: «toda esperança e salvação/livramento».'
