  yaml_path: translation/deuterocanon/2_maccabees/003/001.yaml
  text: While the holy city was inhabited in complete peace[a], and the laws were being observed in the best way because of Onias the high priest,
translation:
  language: pt
  text: Enquanto a cidade santa vivia em plena paz, e as leis eram observadas da melhor maneira[a] por causa de Onias, o sumo sacerdote,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «muito bem». O advérbio grego κάλλιστα pode ter sentido superlativo («da melhor maneira») ou intensivo («muito bem»).
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῆς ἁγίας πόλεως
  choice: a cidade santa
  rationale: Expressão natural e tradicional em português, que preserva o caráter religioso de ἁγίας.
- source_word: κατοικουμένης μετὰ πάσης εἰρήνης
  choice: vivia em plena paz
  rationale: Embora κατοικουμένης descreva literalmente a cidade como habitada, esta formulação comunica com naturalidade o estado contínuo da cidade e a abrangência de πάσης εἰρήνης, evitando o pouco idiomático «estava habitada em plena paz».
- source_word: τῶν νόμων
  choice: as leis
  rationale: Mantém o plural grego e se refere ao conjunto das normas observadas pela comunidade.
- source_word: ὅτι κάλλιστα
  choice: da melhor maneira
  rationale: Preserva a força superlativa do advérbio, embora «muito bem» também seja possível.
- source_word: συντηρουμένων
  choice: eram observadas
  rationale: No contexto de leis, «observar» é a opção corrente e semanticamente apropriada, conservando o sentido passivo do particípio.
- source_word: διὰ τὴν Ὀνίου τοῦ ἀρχιερέως
  choice: por causa de Onias, o sumo sacerdote
  rationale: διά com acusativo tem valor causal; «por causa de» preserva essa relação sem transformar Onias apenas em agente instrumental.
theological_decisions:
- issue: Força causal de διά na referência a Onias
  choice: por causa de Onias, o sumo sacerdote
  alternative: por meio de Onias, o sumo sacerdote
  rationale: A construção apresenta a situação favorável como relacionada causalmente a Onias. A tradução evita acrescentar uma explicação teológica para essa relação.
- issue: Escopo da relação causal
  choice: Mantém-se a frase causal no fim, permitindo que ela se relacione com a situação descrita como um todo.
  alternative: Ligá-la exclusivamente à observância das leis.
  rationale: A estrutura do período pode associar a causa tanto à paz da cidade quanto à observância das leis; a tradução não restringe explicitamente esse alcance.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A oração permanece aberta com vírgula final porque o trecho grego fornecido é parte de uma construção que continua; não se acrescentou material ausente da fonte apresentada.
