  yaml_path: translation/deuterocanon/2_maccabees/003/015.yaml
  text: But the priests[a], having thrown themselves down before the altar in their priestly robes, were calling out to heaven to the one who had given the law concerning deposits[b], that he should keep these things safe for those who had deposited them.
translation:
  language: pt
  text: Mas os sacerdotes, com suas vestes sacerdotais, lançaram-se por terra diante do altar e clamavam ao céu[a], àquele que havia estabelecido a lei sobre os bens confiados em depósito[b], para que os guardasse intactos para os que os haviam confiado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Ao céu» é uma forma reverencial de se referir a Deus.
    reason: cultural_note
  - marker: b
    text: Isto é, bens entregues ao templo para serem guardados em segurança.
    reason: cultural_note
lexical_decisions:
- source_word: ῥίψαντες ἑαυτούς
  choice: lançaram-se por terra
  rationale: Preserva a força física e vívida de ῥίπτω, ao mesmo tempo que soa natural em português e comunica a postura de súplica sem reduzir a expressão ao termo interpretativo «prostraram-se».
- source_word: ἐπεκαλοῦντο εἰς οὐρανόν
  choice: clamavam ao céu
  rationale: O imperfeito indica uma ação contínua, e «clamavam» expressa a urgência da súplica. «Ao céu» conserva a circunlocução reverencial explícita no grego.
- source_word: τὸν περὶ παρακαταθήκης νομοθετήσαντα
  choice: àquele que havia estabelecido a lei sobre os bens confiados em depósito
  rationale: «Estabelecido a lei» mantém a força jurídica de νομοθετέω. A formulação ampliada esclarece que παρακαταθήκη se refere a bens entregues para guarda, sem perder a ideia de depósito.
- source_word: τοῖς παρακαταθεμένοις
  choice: para os que os haviam confiado
  rationale: Identifica naturalmente as pessoas que entregaram os bens para guarda. A repetição de «confiado» preserva em parte a ligação cognata presente no grego.
- source_word: ταῦτα σῶα διαφυλάξαι
  choice: para que os guardasse intactos
  rationale: «Guardasse intactos» reúne a ideia de proteção expressa por διαφυλάσσω e a de preservação sem dano ou perda expressa por σῶα.
- source_word: ἐν ταῖς ἱερατικαῖς στολαῖς
  choice: com suas vestes sacerdotais
  rationale: Expressão clara, digna e corrente, que preserva o caráter cerimonial das roupas sem recorrer a vocabulário eclesiástico arcaizante.
theological_decisions:
- issue: Circunlocução reverencial na oração
  choice: ao céu
  alternative: a Deus
  rationale: O grego diz literalmente «ao céu», usando uma forma reverencial de referência a Deus. Manter essa expressão respeita a formulação e a tensão do texto, sem explicitar mais do que a fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase mantém a referência reverencial «ao céu» e explicita o sentido jurídico de παρακαταθήκη sem transformar o texto em paráfrase. Todos os marcadores de nota aparecem no texto principal.
