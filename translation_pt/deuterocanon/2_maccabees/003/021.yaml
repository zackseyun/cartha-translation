  text: Pitiful indeed was the complete prostration of the crowd[a], and the expectation of the high priest[b], who was in great agony—
translation:
  language: pt
  text: Digna de compaixão era a prostração geral da multidão[a], bem como a expectativa[b] do sumo sacerdote, que sofria grande angústia—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego pode indicar literalmente uma queda para a frente ou prostração; neste contexto, também pode sugerir o profundo abatimento coletivo da multidão.
