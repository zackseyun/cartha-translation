lexical_decisions:
- source_word: ἐλεεινή
  choice: Digna de compaixão
  rationale: Expressa o caráter lamentável e comovente da cena em português natural e digno, preservando a força afetiva do adjetivo grego.
- source_word: τοῦ πλήθους
  choice: da multidão
  rationale: πλῆθος designa aqui o conjunto de pessoas reunidas; “multidão” é claro e adequado ao contexto público.
- source_word: παμμιγῆ
  choice: geral
  rationale: No contexto, o adjetivo indica que a prostração abrangia a multidão como um todo. “Geral” preserva essa extensão sem impor uma leitura excessivamente específica do composto.
- source_word: πρόπτωσιν
  choice: prostração
  rationale: Mantém a imagem concreta de cair para a frente ou lançar-se ao chão, permitindo também a conotação de abatimento coletivo.
- source_word: τοῦ μεγάλως ἀγωνιῶντος ἀρχιερέως
  choice: do sumo sacerdote, que sofria grande angústia
  rationale: Reproduz a intensidade de μεγάλως e o forte sofrimento ou ansiedade expresso por ἀγωνιῶντος, em linguagem portuguesa corrente.
- source_word: προσδο-
  choice: expectativa
  rationale: O trecho visível parece iniciar uma palavra da família de προσδοκία, ligada a expectativa ou espera. Como a forma está truncada na linha fornecida, a escolha é conservadora e a incerteza é explicitada em nota.
