base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/038.yaml
  text: If you have any enemy or one plotting against your affairs[a], send him there[b], and you will receive him back flogged—if indeed he even survives—because there truly is some power of God about the place.
translation:
  language: pt
  text: Se você tem algum inimigo ou alguém que trama contra os seus interesses[a], mande-o para lá; você o receberá de volta açoitado — se é que ele sobreviver[b] —, porque realmente há algum poder de Deus naquele lugar[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alguém que trama contra os seus negócios” ou “contra os seus assuntos”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser entendida como “se é que ele consegue sair de lá com vida”; ela ressalta o perigo de encontrar o poder divino associado ao lugar.
    reason: lexical_alternative
  - marker: c
    text: 'Mais literalmente: “em torno do lugar”.'
    reason: literal_rendering
lexical_decisions:
- source_word: πολέμιον
  choice: inimigo
  rationale: O termo designa um adversário pessoal; “inimigo” é a equivalência mais direta e natural em português atual.
- source_word: πραγμάτων ἐπίβουλον
  choice: alguém que trama contra os seus interesses
  rationale: ἐπίβουλος indica quem trama ou maquina contra alguém, enquanto πραγμάτων abrange assuntos, negócios ou interesses. A formulação preserva a amplitude da expressão grega sem soar artificial.
- source_word: πέμψον αὐτὸν ἐκεῖ
  choice: mande-o para lá
  rationale: Traduz diretamente o imperativo e mantém o tom incisivo da fala.
- source_word: μεμαστιγωμένον
  choice: açoitado
  rationale: O particípio perfeito passivo indica que a pessoa volta depois de sofrer um castigo corporal severo; “açoitado” é claro, digno e adequado ao contexto antigo.
- source_word: προσδέξῃ
  choice: você o receberá de volta
  rationale: O verbo exprime receber a pessoa; “de volta” explicita naturalmente o retorno implícito no contexto.
- source_word: ἐάνπερ καὶ διασωθῇ
  choice: se é que ele sobreviver
  rationale: διασῴζω pode significar sair a salvo ou sobreviver, e as partículas ἐάνπερ καί reforçam a dúvida enfática. A expressão portuguesa conserva a ironia sombria e o perigo real.
- source_word: διὰ τὸ ... εἶναί τινα θεοῦ δύναμιν
  choice: porque realmente há algum poder de Deus
  rationale: A construção apresenta a causa, e τινα deixa a manifestação indefinida, embora real. “Algum poder de Deus” preserva essa reserva sem transformar a frase numa definição doutrinária mais precisa.
- source_word: περὶ τὸν τόπον
  choice: naquele lugar
  rationale: Embora περί com acusativo tenha nuance espacial de “em torno de”, em português “naquele lugar” comunica com naturalidade a associação do poder divino com o local; a forma mais literal é registrada em nota.
- source_word: ἀληθῶς
  choice: realmente
  rationale: O advérbio enfatiza que esse poder é real; “realmente” é corrente e mantém a força da afirmação.
theological_decisions:
- issue: Como traduzir θεοῦ δύναμιν no contexto do templo e da presença divina
  choice: algum poder de Deus
  alternative: o poder de Deus; certo poder divino
  rationale: O grego conserva uma formulação indefinida com τινα, ao mesmo tempo que afirma sua realidade por meio de ἀληθῶς. A tradução mantém essa tensão e evita tanto definir plenamente a manifestação quanto diluí-la numa força meramente impessoal.
translation_notes:
  register: Português moderno, claro e digno, com construção compreensível tanto no Brasil quanto em outros contextos lusófonos. O tratamento por “você” corresponde ao singular da fala e favorece a legibilidade brasileira; “açoitado” preserva a gravidade histórica sem arcaísmo excessivo.
