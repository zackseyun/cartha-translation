  text: To see the appearance of the high priest was enough to wound the mind[b][a]; for his face and altered color made visible the agony in his soul.
translation:
  language: pt
  text: Ver a aparência do sumo sacerdote era suficiente para ferir a mente[a]; pois seu semblante e sua cor alterada deixavam visível a agonia em sua alma[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «transpassar a mente» ou «afligir a mente». O grego emprega metaforicamente um verbo que significa ferir, descrevendo o efeito sobre quem o via.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «a agonia segundo a alma», isto é, a agonia interior de sua alma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ὁρῶντα
  choice: Ver
  rationale: A construção grega é elíptica e descreve de modo geral o efeito causado em quem olhava. O infinitivo em português preserva essa força impessoal com naturalidade.
- source_word: ἰδέαν
  choice: aparência
  rationale: Refere-se ao aspecto visível do sumo sacerdote, abrangendo sua expressão e seu porte sem restringir o sentido.
- source_word: τιτρώσκεσθαι τὴν διάνοιαν
  choice: feria a mente
  rationale: Mantém a metáfora forte do verbo grego, literalmente ligado a ferir, e traduz διάνοια por «mente» sem substituir a imagem por uma explicação.
- source_word: ὄψις
  choice: semblante
  rationale: No contexto, o termo aponta para o aspecto perceptível do rosto; «semblante» evita a repetição de «aparência» e combina naturalmente com a alteração da cor.
- source_word: τῆς χρόας παρηλλαγμένον
  choice: a alteração de sua cor
  rationale: χρόα designa a cor ou compleição corporal, e o grego indica que ela havia mudado sem especificar de que modo.
- source_word: ἐνέφαινεν
  choice: deixavam visível
  rationale: Expressa a ideia de tornar manifesto ou perceptível, ligando os sinais exteriores à angústia interior.
- source_word: τὴν κατὰ ψυχὴν ἀγωνίαν
  choice: a agonia que havia em sua alma
  rationale: Preserva tanto a intensidade de ἀγωνία quanto a linguagem antropológica de ψυχή, deixando claro pelo contexto que se trata de sofrimento interior.
theological_decisions:
- issue: Linguagem antropológica de ψυχή
  choice: alma
  alternative: íntimo; ser interior
  rationale: «Alma» mantém a ressonância do termo grego sem transformar o versículo em uma afirmação técnica sobre a constituição humana; aqui, o contexto indica a sede da agonia interior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a metáfora de ferir a mente e a referência à alma, sem suavizar a intensidade do grego nem impor uma leitura antropológica técnica.
