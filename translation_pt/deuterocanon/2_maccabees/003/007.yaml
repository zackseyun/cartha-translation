base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/007.yaml
  text: After conferring with the king[a], Apollonius informed him about the money that had been reported to him. Then the king appointed Heliodorus, who was over the affairs of state[c][b], and sent him with orders to carry out the removal of the aforementioned money.
translation:
  language: pt
  text: Depois de falar com o rei[a], Apolônio o informou a respeito do dinheiro de que havia sido informado. Então o rei designou Heliodoro, encarregado dos assuntos de Estado[b], e o enviou com ordens de efetuar a retirada do dinheiro já mencionado[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depois de se encontrar com o rei” ou “depois de consultar o rei”. O particípio grego pode sugerir uma audiência ou consulta formal.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o que estava sobre os assuntos”; tratava-se de um título administrativo para um alto funcionário responsável pelos negócios do Estado.
    reason: cultural_note
  - marker: c
    text: Ou “de levar embora o dinheiro já mencionado”. O grego ressalta a execução da retirada do lugar onde o dinheiro estava guardado.
    reason: lexical_alternative
lexical_decisions:
- source_word: συμμίξας
  choice: Depois de se reunir com
  rationale: O particípio indica que Apolônio esteve com o rei, provavelmente em audiência ou consulta. A formulação conserva o valor temporal sem restringir indevidamente o encontro a uma deliberação formal.
- source_word: ἐνεφάνισεν
  choice: informou-o
  rationale: No contexto administrativo, o verbo descreve Apolônio levando a informação ao conhecimento do rei.
- source_word: μηνυθέντων
  choice: havia sido denunciado
  rationale: O verbo pode significar revelar ou denunciar algo a uma autoridade. Como o contexto envolve a indicação de dinheiro que seria confiscado, “denunciado” preserva essa possível conotação sem acrescentar uma acusação específica.
- source_word: χρημάτων
  choice: dinheiro
  rationale: Aqui o termo se refere às quantias guardadas no templo; “dinheiro” é claro, natural e preciso no contexto.
- source_word: προχειρισάμενος
  choice: designou
  rationale: O rei escolhe oficialmente Heliodoro para cumprir uma missão. “Designou” expressa tanto a escolha quanto a incumbência formal.
- source_word: τὸν ἐπὶ τῶν πραγμάτων
  choice: encarregado dos assuntos de Estado
  rationale: A expressão funciona como título administrativo de um alto funcionário responsável pelos negócios do governo.
- source_word: ἐκκομιδὴν ποιήσασθαι
  choice: efetuar a retirada
  rationale: A construção significa executar a remoção ou o transporte do dinheiro para fora do lugar onde estava guardado. A tradução mantém o tom oficial e não determina além do grego se o ato deve ser entendido sobretudo como confisco ou transporte.
- source_word: προειρημένων
  choice: já mencionado
  rationale: O particípio remete ao dinheiro citado anteriormente e conserva a ligação explícita com a primeira parte do versículo.
