  text: and some also belonging to Hyrcanus son of Tobias[a], a man of very high position. The ungodly Simon was not slandering to that extent. Altogether there were four hundred talents of silver and two hundred of gold.
translation:
  language: pt
  text: e também alguns depósitos pertencentes a Hircano, filho de Tobias, homem de posição muito elevada. O ímpio Simão, porém, não caluniava a esse ponto. Ao todo, havia quatrocentos talentos de prata e duzentos de ouro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “duzentos de ouro”; “talentos” fica subentendido com base na frase anterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὰ δὲ καὶ
  choice: e também certa quantia
  rationale: O pronome indefinido refere-se a uma parte não especificada do dinheiro depositado; “certa quantia” torna a referência monetária natural em português.
- source_word: Ὑρκανοῦ τοῦ Τωβίου
  choice: Hircano, filho de Tobias
  rationale: O genitivo patronímico é expresso de modo idiomático e explícito em português.
- source_word: σφόδρα ἀνδρὸς ἐν ὑπεροχῇ κειμένου
  choice: homem que ocupava posição de grande destaque
  rationale: A expressão descreve elevada posição social; evita o literalismo físico de κειμένου e conserva a forte intensificação de σφόδρα.
- source_word: οὐχ οὕτως διαβάλλων
  choice: as acusações ... não chegavam a tanto
  rationale: διαβάλλω pode indicar acusar maliciosa ou falsamente; a formulação preserva a força comparativa de οὐχ οὕτως sem afirmar que tudo o que Simão disse era falso.
- source_word: ὁ δυσσεβὴς Σίμων
  choice: o ímpio Simão
  rationale: “Ímpio” preserva de forma concisa a censura moral e religiosa de δυσσεβής.
- source_word: τὰ δὲ πάντα
  choice: Ao todo
  rationale: Expressão natural para introduzir a soma total.
- source_word: ἀργυρίου τετρακόσια τάλαντα
  choice: quatrocentos talentos de prata
  rationale: Reproduz com clareza a unidade de peso e o material especificados no grego.
- source_word: χρυσίου δὲ διακόσια
  choice: duzentos de ouro
  rationale: Mantém na tradução a elipse grega de “talentos”, recuperável pela frase paralela anterior.
theological_decisions:
- issue: Caracterização moral de Simão em δυσσεβής
  choice: o ímpio Simão
  alternative: o irreverente Simão; o perverso Simão
  rationale: “Ímpio” conserva especificamente a dimensão religiosa e moral do termo, sem acrescentar uma afirmação doutrinária.
- issue: Alcance de οὐχ οὕτως διαβάλλων
  choice: as acusações do ímpio Simão não chegavam a tanto
  alternative: o ímpio Simão não caluniava a esse ponto
  rationale: 'A escolha mantém a tensão narrativa: Simão é apresentado como acusador malicioso, mas a frase reconhece que sua alegação não era exagerada a ponto de eliminar a existência de depósitos privados.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, e a elipse do original foi preservada e explicada em nota.
