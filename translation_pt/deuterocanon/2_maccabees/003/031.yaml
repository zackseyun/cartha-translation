  text: But quickly some of Heliodorus's companions were urging Onias to call upon the Most High and grant life to the one who was lying at his last breath[a][b].
translation:
  language: pt
  text: Mas logo alguns dos companheiros de Heliodoro pediam insistentemente a Onias que invocasse o Altíssimo[a] e concedesse a vida àquele que jazia no último suspiro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “clamasse ao Altíssimo”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “àquele que jazia no último sopro”, isto é, à beira da morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταχὺ
  choice: logo
  rationale: Expressa a prontidão e urgência da ação de modo natural em português, sem intensificar o advérbio.
- source_word: τινες τῶν τῷ Ἡλιοδώρῳ συνηθῶν
  choice: alguns dos companheiros de Heliodoro
  rationale: συνήθων designa pessoas de convivência ou associação próxima; “companheiros” é claro e adequado ao contexto narrativo.
- source_word: ἠξίουν
  choice: insistiram com
  rationale: O imperfeito grego retrata um apelo insistente ou continuado. A formulação portuguesa comunica a força do pedido sem exigir uma construção progressiva pouco elegante.
- source_word: ἐπικαλέσασθαι τὸν ὕψιστον
  choice: invocasse o Altíssimo
  rationale: Em contexto religioso, ἐπικαλέομαι significa invocar ou clamar a alguém. “O Altíssimo” preserva o título divino sem acrescentar “Deus”, ausente do grego.
- source_word: τὸ ζῆν χαρίσασθαι
  choice: concedesse a vida
  rationale: χαρίζομαι apresenta a vida como algo concedido graciosamente; a tradução mantém Onias como sujeito gramatical do segundo infinitivo, sem resolver a tensão do enunciado.
- source_word: τῷ παντελῶς ἐν ἐσχάτῃ πνοῇ κειμένῳ
  choice: àquele que jazia no último suspiro
  rationale: Mantém a imagem vívida de alguém prostrado no instante extremo da vida, enquanto a nota esclarece o sentido idiomático.
theological_decisions:
- issue: Título divino τὸν ὕψιστον
  choice: o Altíssimo
  alternative: o Deus Altíssimo
  rationale: “O Altíssimo” é um título divino tradicional e direto, preservando a forma substantivada do grego sem introduzir uma palavra ausente.
- issue: Sujeito implícito de χαρίσασθαι
  choice: Onias continua como sujeito de “concedesse”
  alternative: o Altíssimo concedesse a vida
  rationale: A sintaxe coordena os dois infinitivos sob o pedido dirigido a Onias. Explicitar o Altíssimo como sujeito do segundo verbo eliminaria uma tensão real e acrescentaria uma mudança de sujeito não marcada no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem foi ajustada para fluidez, e a ambiguidade sintática relevante foi preservada sem inserir explicação doutrinária no texto.
