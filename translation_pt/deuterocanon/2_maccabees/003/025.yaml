base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/025.yaml
  text: For a horse appeared to them with a fearsome rider[a], adorned with a most beautiful saddlecloth; and rushing headlong, it struck Heliodorus with its front hoofs[b], while the one seated on it appeared to be wearing golden armor.
translation:
  language: pt
  text: Pois lhes apareceu um cavalo, adornado com belíssimos arreios[a], que levava um cavaleiro aterrador. Avançando impetuosamente, o cavalo golpeou Heliodoro com os cascos dianteiros[b], e aquele que o montava parecia usar uma armadura de ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “adornado com uma belíssima equipagem”; o termo grego se refere aos arreios ou adornos do cavalo.
    reason: lexical_alternative
  - marker: b
    text: O verbo grego significa literalmente “sacudiu” e, neste contexto, pode indicar que o cavalo atingiu ou golpeou violentamente Heliodoro com os cascos dianteiros.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθη
  choice: apareceu diante deles
  rationale: O aoristo passivo de ὁράω tem aqui sentido de manifestação visível. A formulação é natural em português e preserva o caráter súbito da aparição.
- source_word: τις ἵππος
  choice: um cavalo
  rationale: τις funciona como indefinido; traduzir por “certo cavalo” daria uma ênfase desnecessária.
- source_word: φοβερὸν ἔχων τὸν ἐπιβάτην
  choice: com um cavaleiro aterrador
  rationale: A expressão caracteriza o cavaleiro como alguém que inspira medo, sem explicar além do que o grego afirma.
- source_word: καλλίστῃ σαγῇ διακεκοσμημένος
  choice: adornado com belíssimos arreios
  rationale: σαγή designa o equipamento ou os adornos do cavalo. “Arreios” é claro e abrangente, enquanto “belíssimos” reflete o superlativo καλλίστῃ.
- source_word: φερόμενος δὲ ῥύδην
  choice: avançando impetuosamente
  rationale: A expressão comunica movimento rápido, direto e violento; esta formulação mantém a força narrativa em português corrente.
- source_word: ἔσεισεν
  choice: golpeou
  rationale: Embora o sentido básico seja “sacudir”, neste contexto o verbo descreve o impacto violento produzido pelos cascos do cavalo.
- source_word: τὰς ἐμπροσθίους ὁπλάς
  choice: com os cascos dianteiros
  rationale: ὁπλή é especificamente “casco”, e ἐμπροσθίους identifica os membros dianteiros.
- source_word: ὁ δὲ ἐπικαθήμενος
  choice: aquele que o montava
  rationale: Mantém a construção descritiva do particípio substantivado e retoma o cavaleiro sem tornar a frase artificial.
- source_word: χρυσῆν πανοπλίαν
  choice: uma armadura de ouro
  rationale: πανοπλία indica a armadura completa; “armadura de ouro” é digna, clara e não decide se o material era ouro maciço ou tinha aparência dourada.
theological_decisions:
- issue: Natureza da aparição na cena de juízo no templo
  choice: Narrar diretamente o aparecimento do cavalo e do cavaleiro em termos concretos
  alternative: Qualificar o acontecimento como visão, símbolo ou metáfora
  rationale: O grego relata uma aparição e um ataque de modo concreto, mas não define sua natureza ontológica. A tradução preserva essa tensão sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “o cavalo” na segunda frase evita ambiguidade sobre o sujeito de “golpeou”. Os marcadores [a] e [b] aparecem no texto nos pontos correspondentes.
