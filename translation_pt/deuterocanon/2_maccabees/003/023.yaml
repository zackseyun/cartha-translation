lexical_decisions:
- source_word: ὁ δὲ
  choice: porém
  rationale: δέ introduz aqui uma transição com leve contraste; “porém” conserva essa força adversativa de modo natural e digno.
- source_word: Ἡλιόδωρος
  choice: Heliodoro
  rationale: Forma portuguesa tradicional e reconhecível do nome grego.
- source_word: τὸ διεγνωσμένον
  choice: o que havia sido decidido
  rationale: O particípio perfeito passivo substantivado indica algo já determinado; a formulação preserva tanto o resultado anterior quanto a naturalidade em português.
- source_word: ἐπετέλει
  choice: estava executando
  rationale: O imperfeito apresenta uma ação em andamento no passado, e “estava executando” comunica a ideia de pôr em prática uma decisão.
