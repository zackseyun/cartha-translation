lexical_decisions:
- source_word: τὰ ... καθʼ Ἡλιόδωρον
  choice: o caso de Heliodoro
  rationale: A construção neutra plural com κατά refere-se idiomaticamente aos acontecimentos ou ao assunto relacionado a Heliodoro. “O caso de Heliodoro” mantém o tom conclusivo e resumidor do versículo em português natural.
- source_word: γαζοφυλακίου
  choice: tesouro
  rationale: O termo designa o tesouro ou a câmara do tesouro. “Tesouro” é conciso, claro e adequado ao contexto financeiro do templo.
- source_word: τήρησιν
  choice: proteção
  rationale: τήρησις pode indicar guarda, conservação ou proteção. Aqui, “proteção” comunica de modo natural que o tesouro foi preservado contra a apropriação pretendida.
- source_word: οὕτως
  choice: assim
  rationale: O advérbio remete ao modo como os acontecimentos acabaram de ser narrados e encerra o episódio de forma idiomática.
- source_word: ἐχώρησεν
  choice: foi assim que se desenrolou
  rationale: Neste resumo narrativo, o verbo expressa como o caso transcorreu ou veio a acontecer. “Desenrolou-se” conserva esse sentido sem impor uma conclusão além do texto.
