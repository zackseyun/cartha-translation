  yaml_path: translation/deuterocanon/2_maccabees/003/028.yaml
  text: The man who had just entered the treasury with much rushing about and all his guard[a], they carried out helpless, being completely incapacitated[c][b], having plainly recognized the sovereign power.
translation:
  language: pt
  text: Aquele que acabara de entrar no tesouro já mencionado[b], em meio a muita correria[a] e com toda a sua escolta, era levado, desamparado e completamente incapacitado[c], tendo claramente reconhecido o poder soberano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «em meio a grande agitação»; o grego sugere correria ou movimentação intensa durante sua entrada.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «o tesouro mencionado anteriormente».
    reason: lexical_alternative
  - marker: c
    text: A expressão grega é idiomática e difícil; indica que ele havia sido inteiramente reduzido à impotência.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ἄρτι ... εἰσελθόντα
  choice: Aquele que acabara de entrar
  rationale: O artigo com o particípio funciona substantivamente. A construção preserva o referente sem inserir o nome de Heliodoro, e «acabara de entrar» expressa ἄρτι com o particípio aoristo.
- source_word: μετὰ πολλῆς παραδρομῆς
  choice: em meio a grande agitação
  rationale: παραδρομή sugere correria, movimentação ou alvoroço. «Grande agitação» mantém a ideia de movimentação intensa e admite a possível conotação de aparato ostensivo.
- source_word: πάσης δορυφορίας
  choice: com toda a sua escolta
  rationale: δορυφορία designa escolta armada ou guarda pessoal. «Escolta» é natural em português e evita sugerir apenas sentinelas estacionários.
- source_word: τὸ προειρημένον ... γαζοφυλάκιον
  choice: o tesouro já mencionado
  rationale: γαζοφυλάκιον é o tesouro ou a câmara do tesouro, enquanto προειρημένον significa «mencionado anteriormente». A tradução conserva ambos os elementos.
- source_word: ἔφερον
  choice: era agora carregado
  rationale: O imperfeito descreve a ação em curso. «Agora» explicita o contraste narrativo entre sua entrada imponente e sua retirada, sem acrescentar um agente.
- source_word: ἀβοήθητον
  choice: desamparado
  rationale: O adjetivo significa sem ajuda ou incapaz de obter auxílio. «Desamparado» comunica sua impotência e contrasta com a presença da escolta.
- source_word: τοῖς ὅλοις καθεστῶτα
  choice: completamente incapacitado
  rationale: A expressão é idiomática e difícil; descreve o estado total em que ele ficou. Esta formulação transmite que foi inteiramente reduzido à impotência.
- source_word: φανερῶς
  choice: claramente
  rationale: O advérbio indica que o reconhecimento era manifesto ou evidente.
- source_word: τὴν δυναστείαν
  choice: o poder soberano
  rationale: δυναστεία pode indicar poder, domínio ou autoridade governante. «Poder soberano» preserva tanto a força quanto a nuance de supremacia.
- source_word: ἐπεγνωκότα
  choice: tendo reconhecido
  rationale: O particípio expressa o reconhecimento ou a plena percepção resultante da experiência sofrida.
theological_decisions:
- issue: Referente de «o poder soberano»
  choice: Manter a expressão abstrata, deixando o contexto identificar esse poder como divino
  alternative: Explicitar «o poder de Deus» ou «o poder do Senhor do templo»
  rationale: O contexto aponta para o poder divino que protege o templo, mas o versículo usa δυναστεία sem nomear Deus diretamente. A tradução preserva essa formulação e sua tensão.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluente. O paralelismo entre a entrada acompanhada e a retirada desamparada foi preservado. Todos os marcadores de nota aparecem no texto principal.
