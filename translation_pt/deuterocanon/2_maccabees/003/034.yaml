  yaml_path: translation/deuterocanon/2_maccabees/003/034.yaml
  text: But you[a], having been scourged from heaven, proclaim to all the majestic power of God. And when they had said these things[b], they became invisible.
translation:
  language: pt
  text: Mas você, tendo sido açoitado pelo céu, proclame a todos o majestoso poder de Deus.[a] Depois de dizerem essas coisas, eles se tornaram invisíveis.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a grandeza do poder de Deus”. A expressão grega combina termos que indicam majestade ou grandeza e poder ou força.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eles desapareceram” ou “sumiram de vista”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμαστιγωμένος
  choice: tendo sido açoitado
  rationale: O particípio perfeito passivo indica que a pessoa sofreu um castigo físico severo cujos efeitos permanecem; “açoitado” conserva a força concreta e o tom elevado.
- source_word: ἐξ οὐρανοῦ
  choice: do céu
  rationale: Preserva a origem celestial do castigo sem explicitar além do grego que Deus foi diretamente o agente.
- source_word: διάγγελλε
  choice: proclame
  rationale: O imperativo pede divulgação pública e ampla, sentido mais forte que o simples “conte”.
- source_word: πᾶσι
  choice: a todos
  rationale: Expressa de modo direto o público universal indicado pelo dativo plural.
- source_word: τὸ μεγαλεῖον ... κράτος
  choice: o majestoso poder
  rationale: Reproduz em português natural a combinação grega de grandeza ou majestade com poder ou força, mantendo o registro elevado.
- source_word: ἀφανεῖς ἐγένοντο
  choice: eles se tornaram invisíveis
  rationale: Segue de perto a formulação grega, que descreve os personagens tornando-se não visíveis, e conserva o caráter sobrenatural da cena.
theological_decisions:
- issue: Agência do castigo vindo do céu
  choice: tendo sido açoitado do céu
  alternative: tendo sido açoitado por Deus desde o céu
  rationale: A tradução mantém a origem celestial expressa no texto sem acrescentar uma identificação explícita do agente que o grego deixa implícita.
- issue: Desaparecimento das figuras celestiais
  choice: eles se tornaram invisíveis
  alternative: eles desapareceram
  rationale: A opção escolhida preserva a descrição literal e sobrenatural de se tornarem não visíveis, sem reduzi-la apenas à ideia de partida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” adequado à interpelação singular. A construção “do céu” conserva deliberadamente a concisão e a ambiguidade de agência do grego.
