base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/035.yaml
  text: But Heliodorus[a], after offering a sacrifice to God and making very great vows to the one who had preserved his life, and after taking leave of Onias[c][b], returned to the king.
translation:
  language: pt
  text: Heliodoro, porém, depois de oferecer um sacrifício a Deus e fazer grandíssimos votos[a] àquele que lhe havia preservado a vida, despediu-se de Onias[b] e marchou de volta[c] para o rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fazer grandíssimas orações”. A palavra grega pode significar “orações” ou “votos”; o contexto sacrificial favorece “votos”.
    reason: lexical_alternative
  - marker: b
    text: Ou “acolheu Onias”. O verbo grego também pode significar “receber” ou “acolher”, mas o contexto da partida favorece o sentido de despedir-se.
    reason: lexical_alternative
  - marker: c
    text: O verbo grego tem sentido militar e pode sugerir levantar acampamento ou iniciar uma marcha de retorno.
    reason: cultural_note
lexical_decisions:
- source_word: θυσίαν ἀνενέγκων
  choice: depois de oferecer um sacrifício
  rationale: A expressão indica a oferta de um sacrifício. A construção temporal em português reproduz com naturalidade a sequência marcada pelo particípio aoristo.
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: O dativo identifica Deus como o destinatário do sacrifício.
- source_word: εὐχὰς μεγίστας εὐξάμενος
  choice: fazer grandíssimos votos
  rationale: εὐχή pode designar oração ou voto; no contexto sacrificial, “votos” é provável. “Grandíssimos” preserva a força superlativa de μεγίστας e a repetição etimológica grega é vertida de modo idiomático.
- source_word: τῷ τὸ ζῆν περιποιήσαντι
  choice: àquele que lhe havia preservado a vida
  rationale: O particípio substantivado retoma Deus como aquele que assegurou a continuação da vida de Heliodoro após ele ter estado perto da morte.
- source_word: τὸ ζῆν
  choice: a vida
  rationale: Embora a expressão seja literalmente “o viver”, “a vida” é a forma idiomática em português; o pronome “lhe” deixa claro, conforme o contexto, que se trata da vida de Heliodoro.
- source_word: τὸν Ὀνίαν ἀποδεξάμενος
  choice: despediu-se de Onias
  rationale: ἀποδέχομαι admite sentidos como receber, acolher ou despedir-se. Como Heliodoro parte em seguida, a despedida é a leitura contextual mais provável, sem ocultar a alternativa na nota.
- source_word: ἀνεστρατοπέδευσεν
  choice: marchou de volta
  rationale: O verbo tem coloração militar e pode sugerir levantar acampamento ou iniciar a marcha de retorno. “Marchou de volta” conserva essa nuance sem tornar a frase artificial.
- source_word: πρὸς τὸν βασιλέα
  choice: para o rei
  rationale: πρός com acusativo indica movimento em direção a uma pessoa; o sentido de retorno já está expresso por “de volta”.
theological_decisions:
- issue: Referente de “àquele que lhe havia preservado a vida”
  choice: A expressão refere-se a Deus como aquele que preservou a vida de Heliodoro.
  alternative: “Àquele que lhe havia concedido a vida”, como afirmação mais geral sobre o doador da vida.
  rationale: A proximidade de τῷ θεῷ e o contexto imediato da recuperação de Heliodoro sustentam a referência a Deus e o sentido específico de preservação de sua vida, sem acrescentar uma formulação doutrinária externa ao texto.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe fluente. “Grandíssimos votos” conserva a intensidade do grego e o caráter religioso da expressão; “marchou de volta” mantém discretamente a coloração militar do verbo.
