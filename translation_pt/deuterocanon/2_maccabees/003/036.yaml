  text: And he testified to everyone about the works of the greatest God that he had seen with his own eyes[a].
translation:
  language: pt
  text: E dava testemunho a todos das obras do maior Deus, que tinha visto com os próprios olhos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de forma mais tradicional, «Deus Altíssimo». Aqui, o grego usa «maior» (μεγίστου), não o termo habitual para «altíssimo».
    reason: Alternativa lexical tradicional para o qualificativo divino, com esclarecimento da diferença no grego.
lexical_decisions:
- source_word: ἐξεμαρτύρει
  choice: dava testemunho
  rationale: O imperfeito indica uma ação contínua ou repetida. «Dava testemunho» preserva o caráter público do relato e soa natural em português.
- source_word: πᾶσιν
  choice: a todos
  rationale: O dativo indica os destinatários do testemunho e mantém o alcance universal da expressão grega.
- source_word: ἅπερ
  choice: do que
  rationale: A construção introduz o conteúdo testemunhado; «do que» permite ligar com clareza aquilo que ele viu à explicação subsequente, «as obras».
- source_word: ὑπʼ ὄψιν
  choice: com os próprios olhos
  rationale: A expressão enfatiza a experiência visual direta; esta formulação idiomática conserva a força de testemunho ocular.
- source_word: τεθεαμένος
  choice: tinha visto
  rationale: O particípio perfeito descreve uma visão pessoal já ocorrida e ainda relevante. «Tinha visto» é claro, corrente e adequado ao contexto narrativo.
- source_word: ἔργα
  choice: obras
  rationale: «Obras» traduz diretamente as ações atribuídas a Deus e mantém a linguagem bíblica sem se tornar arcaica.
- source_word: τοῦ μεγίστου θεοῦ
  choice: do grandíssimo Deus
  rationale: O superlativo μέγιστος significa «grandíssimo» ou «o maior». A escolha evita substituí-lo silenciosamente pelo título convencional «Altíssimo», que normalmente traduz outro adjetivo grego.
theological_decisions:
- issue: Tradução do qualificativo divino μεγίστου θεοῦ
  choice: do grandíssimo Deus
  alternative: do Deus Altíssimo
  rationale: O texto grego emprega μέγιστος, «grandíssimo/o maior», não ὕψιστος, «altíssimo». A tradução principal conserva essa distinção lexical, enquanto a forma tradicional é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O travessão explicita que «as obras do grandíssimo Deus» identifica aquilo que ele tinha visto, evitando uma ligação ambígua do pronome relativo com «Deus».
