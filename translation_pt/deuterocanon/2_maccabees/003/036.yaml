    issue: «Grandíssimo» não reproduz da forma mais exata o valor de superlativo relativo de μεγίστου.
    rationale: Em português, «grandíssimo» é normalmente um superlativo absoluto, isto é, «muito grande», enquanto o grego μέγιστος significa «o maior» ou «o mais grande». «Do maior Deus» preserva melhor a forma e o contraste lexical assinalado na nota.
  - severity: low
    issue: O travessão cria uma aposição menos direta do que a construção grega.
    rationale: O objeto de ἐξεμαρτύρει é «as obras ... que tinha visto». A construção com «das obras ... que tinha visto» reflete essa ligação semântica e sintática de modo mais transparente.
  revised_text: E dava testemunho a todos das obras do maior Deus, que tinha visto com os próprios olhos[a].
