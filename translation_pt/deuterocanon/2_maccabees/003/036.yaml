revisions:
- from: E dava testemunho a todos do que tinha visto com os próprios olhos — as obras do grandíssimo Deus[a].
  to: E dava testemunho a todos das obras do maior Deus, que tinha visto com os próprios olhos[a].
  rationale: A revisão substitui o superlativo absoluto português «grandíssimo» pelo superlativo relativo «maior», correspondente a μεγίστου, e reorganiza a frase para que «obras» seja diretamente o conteúdo do testemunho e o antecedente inequívoco de «que tinha visto».
