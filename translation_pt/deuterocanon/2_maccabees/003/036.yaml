    text: Ou, de forma mais tradicional, «Deus Altíssimo». Aqui, o grego usa «maior» (μεγίστου), não o termo habitual para «altíssimo».
    reason: Alternativa lexical tradicional para o qualificativo divino, com esclarecimento da diferença no grego.
