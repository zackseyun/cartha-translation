lexical_decisions:
- source_word: ἐπερωτήσαντος
  choice: perguntou
  rationale: O genitivo absoluto estabelece a circunstância da pergunta do rei; “perguntou” é natural e corresponde ao sentido sem formalidade desnecessária.
- source_word: ποῖός τις εἴη
  choice: quem seria
  rationale: A expressão introduz uma pergunta indireta sobre a identidade e a qualidade da pessoa; “quem seria” preserva essa abertura em português corrente.
- source_word: ἐπιτήδειος
  choice: adequado
  rationale: O adjetivo indica alguém apropriado ou apto para a missão; “adequado” comunica a ideia com clareza e dignidade.
- source_word: ἔτι ἅπαξ
  choice: mais uma vez
  rationale: A expressão indica uma nova ocasião singular; “mais uma vez” preserva tanto a repetição quanto a ênfase em uma ocasião adicional.
- source_word: διαπεμφθῆναι
  choice: para ser enviado
  rationale: O infinitivo passivo descreve o envio de alguém em missão; esta formulação é direta e natural.
- source_word: εἰς Ἱεροσόλυμα
  choice: a Jerusalém
  rationale: Com verbo de movimento ou envio, “a Jerusalém” expressa naturalmente o destino.
- source_word: ἔφησεν
  choice: ele disse
  rationale: A forma apenas introduz a resposta de Heliodoro, cujo conteúdo vem no versículo seguinte; “disse” evita acrescentar interpretação.
