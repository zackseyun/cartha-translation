base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/006.yaml
  text: And he reported that the treasury in Jerusalem was full of immense sums of money[a], so that the quantity of the separate funds was beyond counting, and that they were not connected with the account of the sacrifices[c][b], but that it was possible for these things to fall under the king’s authority.
translation:
  language: pt
  text: E ele informou que o tesouro em Jerusalém estava repleto de imensas somas de dinheiro, de modo que o montante dos diversos fundos era incalculável, e que esses recursos não pertenciam à conta dos sacrifícios,[a] mas poderiam passar para o poder do rei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não estavam relacionados com a administração dos sacrifícios”. A expressão grega também pode indicar que esses recursos não faziam parte das despesas sacrificiais regulares.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ficar sob a autoridade do rei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσήγγειλεν
  choice: informou
  rationale: O verbo indica transmitir uma informação ou apresentar um relato; “informou” é natural no contexto narrativo.
- source_word: χρημάτων ἀμυθήτων
  choice: imensas somas de dinheiro
  rationale: χρήματα designa dinheiro ou riquezas, e ἀμύθητος ressalta uma grandeza difícil de calcular.
- source_word: γαζοφυλάκιον
  choice: tesouro
  rationale: Refere-se ao recinto ou depósito em que dinheiro e objetos valiosos eram guardados; “tesouro” é a forma bíblica corrente em português.
- source_word: τὸ πλῆθος τῶν διαφόρων
  choice: o montante dos diversos fundos
  rationale: A expressão parece indicar a totalidade de diferentes somas ou categorias de recursos depositados, sem definir de modo excessivo sua natureza.
- source_word: ἀναρίθμητον
  choice: incalculável
  rationale: Transmite de modo conciso a ideia de algo impossível ou extremamente difícil de contar.
- source_word: μὴ προσήκειν αὐτὰ πρὸς τὸν τῶν θυσιῶν λόγον
  choice: esses recursos não pertenciam à conta dos sacrifícios
  rationale: προσήκειν indica pertinência, enquanto λόγος pode ser conta, matéria ou administração; a tradução mantém essa amplitude com nota explicativa.
- source_word: ὑπὸ τὴν τοῦ βασιλέως ἐξουσίαν πεσεῖν
  choice: poderiam passar para o poder do rei
  rationale: Reproduz o movimento sugerido por πεσεῖν ὑπό e expressa submissão ao poder ou controle real.
- source_word: ταῦτα
  choice: esses recursos
  rationale: Explicita o referente monetário do pronome grego sem alterar seu sentido contextual.
theological_decisions:
- issue: Natureza dos recursos do templo mencionados
  choice: Distinguir os recursos da conta dos sacrifícios sem negar toda associação sagrada
  alternative: Apresentá-los como depósitos inteiramente seculares ou como bens legitimamente confiscáveis
  rationale: O grego afirma apenas que não pertenciam ao λόγος dos sacrifícios; não determina que fossem totalmente profanos nem legitima sua apropriação pelo rei.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A redação conserva a distinção entre os fundos e a conta sacrificial e mantém a possibilidade, não a legitimidade, de eles passarem ao poder real.
