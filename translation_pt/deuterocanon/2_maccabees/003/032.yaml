  text: But the high priest[a], becoming suspicious that the king might perhaps suppose that some wrongdoing against Heliodorus had been carried out by the Jews, offered a sacrifice for the man's recovery.
translation:
  language: pt
  text: Mas o sumo sacerdote, receando que o rei talvez supusesse que os judeus tinham cometido algum crime contra Heliodoro, ofereceu um sacrifício pela recuperação[a] daquele homem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pelo livramento daquele homem” ou “pela salvação daquele homem”. O termo grego σωτηρία pode abranger resgate, preservação ou salvação, mas aqui provavelmente se refere à recuperação física de Heliodoro.
    reason: alternativa lexical
lexical_decisions:
- source_word: ὕποπτος ... γενόμενος
  choice: receando
  rationale: No contexto, o sumo sacerdote passa a temer ou desconfiar da conclusão que o rei poderia tirar; “receando” expressa com naturalidade essa apreensão sem sugerir que o próprio sacerdote estivesse sob suspeita.
- source_word: μή ποτε
  choice: que ... talvez
  rationale: A construção introduz uma possibilidade temida; “que ... talvez” conserva tanto a incerteza quanto o tom de apreensão.
- source_word: διάλημψιν
  choice: supusesse
  rationale: O termo indica a impressão ou conclusão que o rei poderia formar. “Supusesse” é claro e não torna a inferência tão forte quanto “suspeitasse”.
- source_word: κακουργίαν τινά
  choice: algum crime
  rationale: κακουργία designa uma ação má ou criminosa, e τινά mantém seu caráter indefinido. “Algum crime” é natural e adequado ao possível juízo político do rei.
- source_word: περὶ τὸν Ἡλιόδωρον
  choice: contra Heliodoro
  rationale: Com κακουργία e o verbo de realização, a expressão indica uma ação hostil dirigida contra Heliodoro.
- source_word: συντετελέσθαι
  choice: tinham cometido
  rationale: O infinitivo perfeito apresenta a ação como já consumada. Em português, “cometer um crime” é a combinação idiomática mais direta.
- source_word: προσήγαγε θυσίαν
  choice: ofereceu um sacrifício
  rationale: É uma formulação sacrificial corrente, clara e fiel ao ato descrito.
- source_word: ὑπὲρ τῆς ... σωτηρίας
  choice: pela recuperação
  rationale: Embora σωτηρία possa significar salvação, livramento ou preservação, o contexto imediato é a restauração física de Heliodoro; “recuperação” comunica esse sentido provável.
- source_word: τοῦ ἀνδρός
  choice: daquele homem
  rationale: A expressão retoma explicitamente Heliodoro. “Daquele homem” preserva o substantivo e produz uma retomada natural em português.
theological_decisions:
- issue: Sentido de σωτηρία no contexto da restauração de Heliodoro
  choice: recuperação física
  alternative: livramento ou salvação
  rationale: O contexto narrativo imediato trata do colapso corporal de Heliodoro e de sua restauração. “Recuperação” é o sentido mais provável, enquanto a nota preserva a amplitude lexical e evita excluir outras nuances do termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para identificar cedo o sujeito, e “receando” evita a leitura equivocada de que o sumo sacerdote teria se tornado suspeito.
