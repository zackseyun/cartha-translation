base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/030.yaml
  text: And they were blessing the Lord[a], who was glorifying his own place; and the temple, which a little earlier had been full of fear and turmoil, was filled with joy and gladness when the Almighty Lord appeared.
translation:
  language: pt
  text: E eles bendiziam o Senhor, que glorificava o seu próprio lugar; e o templo, que pouco antes estivera cheio de temor e tumulto, encheu-se de alegria e júbilo quando o Senhor Todo-Poderoso se manifestou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “apareceu”. O termo grego está associado a uma manifestação divina.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλόγουν
  choice: bendiziam
  rationale: O imperfeito indica ação contínua ou repetida. “Bendiziam” preserva a construção direta com o Senhor e mantém um registro bíblico digno, mas compreensível.
- source_word: παραδοξάζοντα
  choice: glorificava
  rationale: O particípio descreve o Senhor conferindo ou manifestando glória em relação ao seu lugar. “Glorificava” preserva a ligação verbal com glória sem explicar em excesso o modo da ação.
- source_word: τὸν ἑαυτοῦ τόπον
  choice: o seu próprio lugar
  rationale: Mantém o sentido literal de τόπος e a ênfase reflexiva de ἑαυτοῦ; o substantivo “templo” na oração seguinte esclarece a referência.
- source_word: τὸ μικρῷ πρότερον
  choice: pouco antes
  rationale: Expressão portuguesa natural para o estado imediatamente anterior indicado pelo grego.
- source_word: δέους καὶ ταραχῆς γέμον
  choice: estivera cheio de temor e tumulto
  rationale: “Temor” comunica a intensidade solene de δέος, enquanto “tumulto” expressa a agitação de ταραχή. O mais-que-perfeito marca claramente a condição anterior.
- source_word: ἱερόν
  choice: templo
  rationale: Neste contexto, ἱερόν designa o complexo do templo, e “templo” é a equivalência corrente e clara.
- source_word: τοῦ παντοκράτορος ... κυρίου
  choice: o Senhor Todo-Poderoso
  rationale: Reproduz ambos os elementos do título divino de modo idiomático em português e evita a forma menos natural “o Todo-Poderoso Senhor”.
- source_word: ἐπιφανέντος
  choice: se manifestou
  rationale: O verbo está associado à manifestação ou aparição divina. “Se manifestou” conserva a dimensão epifânica sem necessariamente sugerir que Deus tenha assumido forma visível.
- source_word: χαρᾶς καὶ εὐφροσύνης ἐπληροῦτο
  choice: encheu-se de alegria e júbilo
  rationale: Preserva os dois substantivos coordenados e expressa de modo natural a mudança pela qual o templo passou a ficar caracterizado por celebração e alegria.
theological_decisions:
- issue: Ação divina para com o templo em παραδοξάζοντα τὸν ἑαυτοῦ τόπον
  choice: O Senhor é apresentado como glorificando o seu próprio lugar mediante sua intervenção.
  alternative: O Senhor tornava maravilhoso o seu lugar ou mostrava que ele era glorioso.
  rationale: “Glorificava” conserva a afirmação teológica e a relação com o templo sem definir de modo indevido o mecanismo da glorificação.
- issue: Sentido de ἐπιφανέντος κυρίου
  choice: “quando o Senhor Todo-Poderoso se manifestou”
  alternative: “quando o Senhor Todo-Poderoso apareceu”
  rationale: “Se manifestou” comunica a epifania divina narrada no texto, preservando a possibilidade de manifestação por atos e sinais, sem impor uma aparição corporal ou visível.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Bendiziam” e “júbilo” preservam o tom solene sem tornar a frase arcaica. A nota mantém a alternativa lexical legítima para a linguagem de epifania.
