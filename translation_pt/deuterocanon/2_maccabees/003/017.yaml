base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/017.yaml
  text: For a certain dread and bodily trembling had come over the man[a], by which the pain present in his heart was becoming evident to those who were watching.
translation:
  language: pt
  text: Pois um certo pavor e um tremor no corpo haviam tomado conta daquele homem; por meio deles, a dor presente em seu coração[a] se tornava evidente aos que o observavam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a angústia presente em seu íntimo”. A expressão grega pode indicar sofrimento emocional interior, além de dor em sentido mais geral.
    reason: lexical_alternative
lexical_decisions:
- source_word: περικεχύτο
  choice: haviam tomado conta
  rationale: O perfeito de περιχέω descreve figuradamente algo que envolveu ou dominou a pessoa. A expressão comunica com naturalidade o estado resultante, sem recorrer à imagem pouco idiomática de algo ‘derramado sobre’ alguém.
- source_word: δέος τι
  choice: um certo pavor
  rationale: ‘Pavor’ expressa medo intenso, enquanto ‘um certo’ preserva a nuance atenuadora ou indefinida de τι.
- source_word: φρικασμὸς σώματος
  choice: um tremor no corpo
  rationale: Mantém explícita a manifestação física e soa mais natural em português corrente do que uma formulação nominal rígida como ‘estremecimento corporal’.
- source_word: διʼ ὧν
  choice: por meio deles
  rationale: Retoma conjuntamente o pavor e o tremor como sinais pelos quais o sofrimento interior se tornava perceptível.
- source_word: πρόδηλον ἐγίνετο
  choice: se tornava evidente
  rationale: Preserva o aspecto progressivo do imperfeito ἐγίνετο e a ideia de uma condição interior que se manifestava exteriormente.
- source_word: τοῖς θεωροῦσιν
  choice: aos que o observavam
  rationale: Conserva a força verbal do particípio e descreve de modo claro as pessoas que presenciavam a cena.
- source_word: τὸ κατὰ καρδίαν ἐνεστὸς ἄλγος
  choice: a dor presente em seu coração
  rationale: 'Segue de perto os elementos gregos: ἄλγος como dor, κατὰ καρδίαν como localização interior e ἐνεστὸς como aquilo que está presente. A nota registra a possível nuance emocional mais forte.'
