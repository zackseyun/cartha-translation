  text: And those from the houses were rushing out in groups for a public supplication[a], because the place was about to come into contempt.
translation:
  language: pt
  text: E os moradores saíam às pressas de suas casas, em grupos, para uma súplica pública, pois o lugar[a] estava prestes a ser tratado com desprezo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o recinto do templo; o grego diz simplesmente “o lugar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἐκ τῶν οἰκιῶν
  choice: os moradores saíam de suas casas
  rationale: A expressão designa coletivamente as pessoas que estavam nas casas. Em português, “os moradores” evita a construção pouco natural “os das casas”; “suas” torna explícita uma relação naturalmente implícita no contexto.
- source_word: ἀγεληδὸν
  choice: em grupos
  rationale: O advérbio sugere movimento coletivo, literalmente como rebanhos. “Em grupos” conserva esse sentido sem uma conotação animalizante indevida.
- source_word: ἐξεπήδων
  choice: saíam às pressas
  rationale: O imperfeito apresenta uma ação em andamento, e o verbo comunica a vivacidade de saltar ou precipitar-se para fora. “Saíam às pressas” expressa a urgência em português natural.
- source_word: ἐπὶ πανδήμῳ ἱκετείᾳ
  choice: para uma súplica pública
  rationale: ἱκετεία indica uma súplica solene e urgente, enquanto πάνδημος ressalta sua dimensão pública ou coletiva.
- source_word: διὰ τὸ μὴ μέλλειν
  choice: pois ... estava prestes a
  rationale: No contexto, a construção comunica a iminência do ultraje ao lugar. “Estava prestes a” reproduz essa perspectiva de perigo imediato em português corrente.
- source_word: εἰς καταφρόνησιν ἔρχεσθαι
  choice: ser tratado com desprezo
  rationale: A expressão significa literalmente “chegar ao desprezo”. A forma passiva natural esclarece que o lugar enfrentava tratamento desonroso sem reduzir a ideia a mera perda de reputação.
- source_word: τὸν τόπον
  choice: o lugar
  rationale: O grego emprega o termo geral τόπος. Embora o contexto aponte para o recinto do templo, “o lugar” preserva a formulação do texto-fonte.
theological_decisions:
- issue: Referente de τὸν τόπον
  choice: o lugar, entendido no contexto como o recinto do templo
  alternative: o santuário; o templo
  rationale: O contexto imediato trata do templo de Jerusalém e da ameaça de desonra contra ele, mas o grego usa τόπος, não um termo mais explícito para templo ou santuário. O texto principal conserva essa generalidade, e a nota identifica o referente contextual.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A ordem foi levemente ajustada para evitar construções artificiais, preservando a ação contínua, a urgência e o caráter coletivo da súplica.
