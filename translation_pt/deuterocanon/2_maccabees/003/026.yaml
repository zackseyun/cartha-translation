base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/026.yaml
  text: But two other young men appeared to him[a], outstanding in strength, most handsome in appearance, and splendid in clothing; and standing on either side of him, they kept scourging him without stopping, landing many blows on him.
translation:
  language: pt
  text: Mas apareceram-lhe outros dois jovens, notáveis pela força, belíssimos na aparência[a] e esplêndidos nas vestes. Postando-se um de cada lado dele, açoitavam-no sem parar, desferindo-lhe muitos golpes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “belíssimos em seu porte”. A expressão grega associa a beleza à glória ou aparência visível.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι δὲ δύο
  choice: Mas ... outros dois
  rationale: ἕτεροι com δύο indica duas figuras adicionais, distintas do cavaleiro já mencionado; δέ marca uma transição narrativa suave.
- source_word: ἐφάνησαν αὐτῷ
  choice: apareceram-lhe
  rationale: O aoristo de φαίνω tem aqui o sentido intransitivo comum de aparecer; o pronome enclítico preserva αὐτῷ de modo conciso.
- source_word: νεανίαι
  choice: jovens
  rationale: Designa homens jovens, sem implicar por si só que fossem guerreiros ou anjos.
- source_word: τῇ ῥώμῃ μὲν ἐκπρεπεῖς
  choice: notáveis pela força
  rationale: ῥώμη denota força ou vigor físico, e ἐκπρεπής indica aquilo que se destaca.
- source_word: κάλλιστοι δὲ τὴν δόξαν
  choice: belíssimos na aparência
  rationale: κάλλιστοι é superlativo, enquanto δόξα, neste conjunto de descrições visíveis, aponta para aparência, esplendor ou porte; a nota preserva a amplitude da expressão.
- source_word: διαπρεπεῖς δὲ τὴν περιβολήν
  choice: esplêndidos nas vestes
  rationale: περιβολή refere-se à roupa ou indumentária, e διαπρεπής descreve sua qualidade marcante e magnífica.
- source_word: οἵ καὶ παραστάντες ἐξ ἑκατέρου μέρους
  choice: Postando-se um de cada lado dele
  rationale: O particípio é vertido como ação circunstancial, e ἐξ ἑκατέρου μέρους significa que os dois tomaram posição em lados opostos da vítima.
- source_word: ἐμαστίγουν αὐτὸν ἀδιαλείπτως
  choice: açoitavam-no sem parar
  rationale: O imperfeito comunica ação contínua; μαστιγόω é açoitar ou flagelar, e ἀδιαλείπτως significa continuamente, sem interrupção.
- source_word: πολλὰς ἐπιρριπτοῦντες αὐτῷ πληγάς
  choice: desferindo-lhe muitos golpes
  rationale: O particípio explica como ocorria o açoitamento; πληγαί são golpes, e ἐπιρρίπτω exprime aplicá-los ou desferi-los sobre alguém.
theological_decisions:
- issue: Natureza das figuras celestiais
  choice: outros dois jovens
  alternative: dois anjos; dois seres celestiais
  rationale: O grego os chama νεανίαι e descreve sua força, beleza e vestes, mas não os identifica explicitamente como anjos neste versículo. A tradução mantém a descrição narrativa sem resolver essa identificação teológica.
translation_notes:
  register: Português moderno, digno e de leitura natural, com ampla inteligibilidade internacional e boa fluidez para leitores brasileiros. A construção mantém a progressão descritiva do grego e o aspecto contínuo do açoitamento.
