base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/009.yaml
  text: And when he arrived in Jerusalem and was courteously received by the high priest of the city[a], he reported the manifestation that had taken place, explained for what reason he was present, and inquired whether these things were truly so.
translation:
  language: pt
  text: Quando chegou a Jerusalém e foi recebido cordialmente pelo sumo sacerdote da cidade, expôs o que havia sido comunicado[a], explicou por que estava ali e perguntou se as coisas eram realmente assim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a manifestação que havia ocorrido”. O termo grego pode indicar uma divulgação ou algo que se tornou conhecido, bem como uma manifestação.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενηθεὶς
  choice: Quando chegou
  rationale: O particípio aoristo indica a chegada de Heliodoro e funciona naturalmente como oração temporal em português.
- source_word: φιλοφρόνως ... ἀποδεχθεὶς
  choice: foi recebido cordialmente
  rationale: Expressa uma recepção cortês e amistosa sem intensificar indevidamente o grau de afeto.
- source_word: ὑπὸ τοῦ ἀρχιερέως τῆς πόλεως
  choice: pelo sumo sacerdote da cidade
  rationale: Mantém a vinculação sintática do genitivo τῆς πόλεως com o sumo sacerdote, tal como no grego.
- source_word: ἀνέθετο
  choice: expôs
  rationale: No contexto, indica que Heliodoro apresentou formalmente o assunto ao sumo sacerdote; “expôs” conserva o tom narrativo e oficial.
- source_word: περὶ τοῦ γεγονότος ἐμφανισμοῦ
  choice: a informação que havia sido revelada
  rationale: ἐμφανισμός pode designar aquilo que foi dado a conhecer ou uma revelação/divulgação. No contexto da denúncia anterior sobre o tesouro, a formulação evita sugerir necessariamente uma aparição sobrenatural.
- source_word: καί τινος ἕνεκεν πάρεστι, διεσάφησεν
  choice: explicou por que estava ali
  rationale: Traduz de modo idiomático tanto a ideia de esclarecer quanto o motivo de sua presença.
- source_word: ἐπυνθάνετο
  choice: perguntou
  rationale: O verbo denota procurar saber ou indagar; “perguntou” é claro e natural, sem perder o sentido contextual.
- source_word: εἰ ταῖς ἀληθείαις ταῦτα οὕτως ἔχοντα τυγχάνει
  choice: se as coisas eram realmente assim
  rationale: Reproduz a pergunta sobre a veracidade factual do relato em português corrente.
theological_decisions:
- issue: Sentido de ἐμφανισμός
  choice: informação que havia sido revelada
  alternative: manifestação que havia ocorrido
  rationale: O contexto imediato favorece uma informação ou denúncia tornada conhecida, embora o substantivo também possa ter o sentido mais concreto de manifestação. A alternativa é preservada em nota, sem impor uma leitura sobrenatural.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluida. “Sumo sacerdote” mantém o termo bíblico consagrado; “cordialmente” evita tanto a frieza de uma recepção meramente protocolar quanto uma cordialidade exagerada.
