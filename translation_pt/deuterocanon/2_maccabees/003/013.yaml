  text: But the other[a], because he had royal orders, kept insisting that these things were to be taken into the royal treasury.
translation:
  language: pt
  text: Mas o outro, por ter ordens reais, continuava insistindo que esses bens tinham de ser levados para o tesouro real.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o tesouro do rei”. Neste contexto, o grego εἰς τὸ βασιλικόν provavelmente se refere ao erário ou tesouro real.'
