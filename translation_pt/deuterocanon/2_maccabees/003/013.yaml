lexical_decisions:
- source_word: ὁ δ᾽ ἕτερος
  choice: Mas o outro
  rationale: Preserva o contraste introduzido por δέ e não acrescenta um substantivo ausente do grego.
- source_word: δι᾽ ἃς εἶχεν βασιλικὰς ἐντολάς
  choice: por ter ordens reais
  rationale: Expressa de modo natural a relação causal e entende βασιλικάς como ordens provenientes da autoridade régia.
- source_word: πάντως ἔλεγεν
  choice: continuava insistindo
  rationale: O imperfeito ἔλεγεν sugere ação persistente, enquanto πάντως lhe dá força enfática.
- source_word: εἰς τὸ βασιλικὸν
  choice: para o tesouro real
  rationale: No contexto de bens e confisco, o neutro substantivado provavelmente designa o erário ou tesouro da coroa.
- source_word: ἀναλημπτέα
  choice: tinham de ser levados
  rationale: A forma adjetival verbal indica necessidade ou obrigação; a formulação portuguesa preserva essa força.
- source_word: ταῦτα
  choice: esses bens
  rationale: O demonstrativo plural retoma os valores mencionados no contexto; 'bens' torna a referência clara sem alterar seu sentido.
