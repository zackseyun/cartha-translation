  source_fidelity: 'A tradução reproduz adequadamente a sequência e o sentido central do grego: mulheres em trajes de luto pelas ruas e virgens encerradas que correm ou olham pelas janelas. Contudo, “viviam recolhidas” transforma o adjetivo κατάκλειστοι, que descreve seu estado no episódio (“encerradas/reclusas”), numa caracterização habitual de seu modo de vida. A nota b reforça essa ampliação sem apoio explícito no versículo.'
  naturalness: O texto é claro e natural em português moderno. “Panos de saco” e “espiavam pelas janelas” funcionam bem no registro narrativo. “Estavam reclusas” é igualmente idiomático e mais próximo do aspecto contextual do original.
  terminology: “Virgens” preserva corretamente παρθένοι. “Panos de saco” comunica o vestuário áspero de luto representado por σάκκους, e “portões” é uma boa opção para πυλῶνας. A formulação da nota sobre o pano de saco deve evitar afirmar com excesso de precisão que ele estava preso “ao redor do corpo”, pois o grego especifica que era cingido abaixo dos seios.
