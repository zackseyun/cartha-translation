  text: And the women[a], with sackcloth bound under their breasts, were crowding the streets; and the virgins who were shut in, some were running together to the gates, others to the walls[c][b], and some were peering out through the windows.
translation:
  language: pt
  text: As mulheres, com panos de saco presos abaixo dos seios[a], enchiam as ruas; e as virgens que estavam reclusas[b], umas corriam juntas para os portões, outras para as muralhas, e algumas espiavam pelas janelas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os panos de saco eram vestes ásperas usadas como sinal de luto, aflição ou penitência; aqui, estavam cingidos abaixo dos seios.
    reason: cultural_note
  - marker: b
    text: Ou “encerradas”. O termo grego descreve as virgens como mantidas em reclusão ou no interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεζωσμέναι ... σάκκους ὑπὸ τοὺς μαστούς
  choice: com panos de saco amarrados abaixo dos seios
  rationale: 'Mantém a imagem concreta do grego: o pano de luto estava preso ao redor do corpo, abaixo dos seios. “Panos de saco” é mais natural em português do que o simples plural “sacos” e conserva a associação com luto e penitência.'
- source_word: κατὰ τὰς ὁδοὺς ἐπλήθυνον
  choice: enchiam as ruas
  rationale: O verbo significa literalmente que se multiplicavam ou aumentavam pelas ruas; no contexto, a expressão idiomática comunica que apareciam ali em grande número.
- source_word: κατάκλειστοι
  choice: que viviam recolhidas
  rationale: Expressa a condição habitual de permanecerem encerradas ou reclusas, com português natural, sem sugerir necessariamente prisão coercitiva.
- source_word: παρθένων
  choice: virgens
  rationale: Preserva a especificidade lexical de παρθένος, em vez de generalizá-la como “jovens” ou “moças”.
- source_word: συνέτρεχον
  choice: corriam juntas
  rationale: Conserva tanto o movimento apressado quanto o elemento coletivo expresso pelo composto verbal.
- source_word: πυλῶνας
  choice: portões
  rationale: O termo designa portões ou entradas monumentais; “portões” distingue-os naturalmente das portas de uma casa.
- source_word: διὰ τῶν θυρίδων διεκύπτον
  choice: espiavam pelas janelas
  rationale: Reproduz a ação contínua de olhar para fora a partir do interior, com a nuance de observar atentamente.
