  text: wanting to die nobly rather than to fall into the hands of those criminals and be outrageously treated in a way unworthy of his own nobility[a].
translation:
  language: pt
  text: querendo morrer nobremente, em vez de cair nas mãos daqueles criminosos e ser ultrajado de modo indigno de sua própria nobreza[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ser maltratado” ou “ser humilhado”; o verbo grego pode abranger amplamente tratamento abusivo e degradante, não apenas insultos verbais.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγενῶς
  choice: nobremente
  rationale: Preserva o sentido de agir de maneira nobre ou honrada e mantém a ligação lexical com εὐγενείας, traduzido adiante por “nobreza”.
- source_word: θέλων
  choice: querendo
  rationale: Reproduz de modo natural o particípio que expressa vontade ou propósito, sem intensificá-lo indevidamente.
- source_word: ἀποθανεῖν
  choice: morrer
  rationale: Tradução direta e corrente do infinitivo grego.
- source_word: ἤπερ
  choice: em vez de
  rationale: Expressa naturalmente o contraste entre a morte preferida e a alternativa rejeitada.
- source_word: ἀλιτηρίοις
  choice: aqueles criminosos
  rationale: Comunica o forte caráter pejorativo do termo para pessoas perversas ou criminosas sem recorrer a linguagem arcaica.
- source_word: ὑποχείριος γενέσθαι
  choice: cair nas mãos de
  rationale: Expressão idiomática portuguesa que transmite ficar sob o poder hostil de alguém, adequada ao contexto de captura.
- source_word: τῆς ἰδίας εὐγενείας
  choice: sua própria nobreza
  rationale: Preserva a possível referência tanto à condição nobre quanto ao caráter ou dignidade pessoal, além da ligação com εὐγενῶς.
- source_word: ἀναξίως
  choice: de modo indigno de
  rationale: Torna explícita, em português natural, a relação entre o tratamento sofrido e a nobreza da personagem.
- source_word: ὑβρισθῆναι
  choice: ser ultrajado
  rationale: Abrange tratamento insolente, humilhante ou abusivo sem restringir o verbo apenas a insultos verbais; a nota registra alternativas possíveis.
