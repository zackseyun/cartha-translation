base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/008.yaml
  text: 'I have now come a second time concerning the high priesthood: first[a], because I sincerely have in mind the interests of the king, and second, because I am also considering those of my own fellow citizens; for by the folly of the men mentioned before'
translation:
  language: pt
  text: '“Agora vim pela segunda vez a respeito do sumo sacerdócio: primeiro[a], porque considero sinceramente os interesses do rei; e, segundo, porque também levo em conta os interesses dos meus próprios concidadãos, pois, pela insensatez dos homens já mencionados…”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase grega prossegue no versículo seguinte; a oração final deste versículo fica incompleta no trecho fornecido e foi traduzida de modo a refletir essa continuação.
    reason: textual_variant
lexical_decisions:
- source_word: τὴν ἀρχιερωσύνην
  choice: a respeito do sumo sacerdócio
  rationale: ἀρχιερωσύνη designa o ofício ou a dignidade de sumo sacerdote; a expressão preserva essa referência sem explicitar além do grego.
- source_word: δεύτερον νῦν ἐλήλυθα
  choice: agora vim pela segunda vez
  rationale: Mantém tanto o valor temporal de νῦν quanto o ordinal de δεύτερον, em português natural.
- source_word: ὑπὲρ τῶν ἀνηκόντων τῷ βασιλεῖ
  choice: pelos interesses do rei
  rationale: τὰ ἀνήκοντα indica aquilo que diz respeito a alguém; no contexto político, “interesses do rei” comunica o sentido de forma idiomática.
- source_word: γνησίως φρονῶν
  choice: tenho sincera consideração
  rationale: Reúne a sinceridade expressa por γνησίως e a disposição mental ou preocupação de φρονῶν, sem transformar explicitamente a frase numa declaração de lealdade.
- source_word: τῶν ἰδίων πολιτῶν
  choice: os meus próprios concidadãos
  rationale: πολῖται significa concidadãos, enquanto ἰδίων reforça que são os seus próprios; evita introduzir uma noção étnica não exigida pelo texto.
- source_word: στοχαζόμενος
  choice: me preocupo com
  rationale: No paralelismo, o verbo indica consideração deliberada pelo bem ou pelos interesses dos concidadãos; “me preocupo com” é claro e natural.
- source_word: τῇ μὲν γὰρ τῶν προειρημένων
  choice: pois, pela insensatez dos homens já mencionados
  rationale: O excerto grego termina no início de uma oração causal que prossegue no versículo seguinte. A formulação segue a continuação sintática atestada pela camada de consulta e deixa a frase deliberadamente incompleta.
