base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/014.yaml
  text: But those in Judea who had driven Judas out kept flocking in droves to Nicanor from among the nations[a], thinking that the misfortunes and disasters of the Jews would become their own prosperity.
translation:
  language: pt
  text: Mas os que, na Judeia, haviam expulsado Judas faziam os povos juntar-se em massa a Nicanor, pensando que os infortúnios e as calamidades dos judeus seriam para eles prosperidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “juntavam-se em massa a Nicanor junto com os povos”. O grego traz ἔθνη (“povos”, muitas vezes “gentios”) numa construção comprimida; embora o acusativo favoreça a leitura do texto principal, a relação exata do termo com o verbo admite outra análise.'
    reason: alternativa sintática e lexical
lexical_decisions:
- source_word: οἱ ... πεφυγαδευκότες τὸν Ἰούδαν
  choice: os que ... haviam expulsado Judas
  rationale: 'O particípio perfeito de φυγαδεύω tem força causativa: eles fizeram Judas fugir ou o expulsaram. “Haviam expulsado” conserva essa força e é natural em português.'
- source_word: ἐπὶ τῆς Ἰουδαίας
  choice: na Judeia
  rationale: A expressão identifica o âmbito em que estavam aqueles que haviam expulsado Judas. Evita fazer dela, sem necessidade, o complemento de origem da expulsão.
- source_word: ἔθνη
  choice: os povos
  rationale: ἔθνη pode significar “povos”, “nações” ou, no contexto judaico, “gentios”. “Os povos” preserva o valor étnico-político sem impor a interpretação mais estreita.
- source_word: συνέμιγνυν ... τῷ Νικάνορι
  choice: juntavam-se ... a Nicanor
  rationale: O verbo indica mistura ou associação; com o dativo, “juntavam-se a Nicanor” comunica naturalmente a adesão ao seu lado.
- source_word: ἀγεληδόν
  choice: em massa
  rationale: O advérbio significa literalmente “em rebanhos” e sugere reunião numerosa, possivelmente depreciativa. “Em massa” é atual e mantém a ideia coletiva sem uma metáfora animal excessivamente marcada.
- source_word: ἀτυχίας καὶ συμφοράς
  choice: infortúnios e calamidades
  rationale: 'Mantém os dois substantivos distintos: ἀτυχία aponta para má sorte ou adversidade, enquanto συμφορά tem força mais grave, de calamidade.'
- source_word: ἰδίας εὐημερίας
  choice: sua própria prosperidade
  rationale: Preserva o contraste deliberado entre as desgraças dos judeus e o benefício esperado pelos adversários.
- source_word: δοκοῦντες ἔσεσθαι
  choice: pensando que ... se tornariam
  rationale: O particípio com infinitivo futuro expressa expectativa; o plural concorda em português com “os infortúnios e as calamidades” e “se tornariam” explicita a conversão esperada em vantagem própria.
theological_decisions:
- issue: Sentido de ἔθνη no contexto histórico judaico
  choice: os povos
  alternative: os gentios
  rationale: Embora ἔθνη frequentemente designe os gentios, a construção sintática é comprimida e o foco imediato é a aliança política. A tradução mais ampla preserva a ambiguidade lexical.
- issue: Relação sintática de ἔθνη com συνέμιγνυν e τῷ Νικάνορι
  choice: juntavam-se em massa a Nicanor, junto com os povos
  alternative: misturavam os povos, em massa, com Nicanor
  rationale: A forma verbal pode ser lida de maneira comprimida, e a relação exata entre os grupos não é inteiramente transparente. O texto principal apresenta a associação mais provável, enquanto a nota registra a alternativa sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Em massa” evita o literalismo pouco natural de “em rebanhos”; a nota preserva a ambiguidade genuína da construção grega.
