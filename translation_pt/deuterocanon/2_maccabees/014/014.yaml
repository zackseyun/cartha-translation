  source_fidelity: A oração principal do rascunho toma ἔθνη como companhia dos sujeitos (“junto com os povos”), mas, na construção grega transmitida, ἔθνη está no acusativo e é mais naturalmente o objeto de συνέμιγνυν. A tradução deve refletir essa leitura direta no texto principal e deixar a leitura intransitiva como alternativa em nota. A cláusula final exprime que as desgraças dos judeus seriam consideradas prosperidade para os opositores, não necessariamente que se ‘tornariam’ prosperidade.
