  text: But after fuller consideration of these matters[a], and when the leader had communicated it to the crowds, and unanimous agreement had become evident[b], they assented to the terms.
translation:
  language: pt
  text: Mas, depois de uma consideração mais aprofundada dessas questões[a], depois que o líder as deu a conhecer às multidões e tendo-se tornado evidente o consenso unânime[b], assentiram aos termos.
  philosophy: optimal-equivalence
  footnotes:
