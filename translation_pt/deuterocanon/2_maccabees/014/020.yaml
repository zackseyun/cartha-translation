lexical_decisions:
- source_word: πλείονος δὲ γενομένης περὶ τούτων ἐπισκέψεως
  choice: depois de examinarem mais a fundo essas questões
  rationale: A construção em genitivo absoluto apresenta uma circunstância anterior; «mais a fundo» preserva a força comparativa de πλείονος, e «examinar» expressa aqui o sentido deliberativo de ἐπίσκεψις.
- source_word: τοῦ ἡγουμένου
  choice: o líder
  rationale: Designa aquele que dirige ou preside, sem identificar no próprio grego um cargo político mais específico.
- source_word: τοῖς πλήθεσιν
  choice: às multidões
  rationale: Mantém o plural coletivo de πλήθη e emprega uma expressão atual e compreensível.
- source_word: ἀνακοινωσαμένου
  choice: comunicar
  rationale: O verbo indica compartilhar ou dar conhecimento da questão, sem exigir a ideia mais formal de proclamação.
- source_word: φανείσης ὁμοψήφου συγγνώμης
  choice: quando ficou evidente que havia consenso unânime
  rationale: ὁμόψηφος denota concordância de um só voto, enquanto συγγνώμη tem aqui o sentido de acordo ou consentimento, não de perdão; a formulação explicita naturalmente que esse consenso se tornou manifesto.
- source_word: ἔνευσαν
  choice: aceitaram
  rationale: O verbo pode indicar um gesto de assentimento ou o próprio consentimento; «aceitaram» transmite com naturalidade a concordância com as condições.
- source_word: ταῖς συνθήκαις
  choice: os termos
  rationale: συνθῆκαι refere-se às condições de um acordo; «os termos» é conciso e não especifica além do que o versículo declara.
