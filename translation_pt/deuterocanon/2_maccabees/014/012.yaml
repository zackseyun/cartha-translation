  text: And he immediately selected Nikanor[a], who had become commander of the elephants, and appointed him general over Judea, and sent him out.
translation:
  language: pt
  text: E ele escolheu imediatamente Nicanor, que se tornara comandante dos elefantes, nomeou-o general da Judeia[a] e o enviou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “governador da Judeia” ou “governador militar da Judeia”. O título grego στρατηγός pode indicar tanto um comandante militar como uma autoridade governamental regional; neste contexto, o cargo provavelmente abrangia ambas as funções.
    reason: lexical_alternative
lexical_decisions:
- source_word: προχειρισάμενος
  choice: escolheu
  rationale: O particípio indica escolher ou designar alguém para uma tarefa. “Escolheu” preserva esse sentido e evita repetir “nomeou”, usado para ἀναδείξας.
- source_word: εὐθέως
  choice: imediatamente
  rationale: Expressa a prontidão da ação em linguagem moderna e clara.
- source_word: τὸν γενόμενον ἐλεφαντάρχην
  choice: que havia sido comandante dos elefantes
  rationale: ἐλεφαντάρχης designa o oficial responsável por elefantes de guerra. O mais-que-perfeito composto apresenta esse cargo como anterior à missão narrada, sem afirmar mais do que o grego.
- source_word: στρατηγὸν τῆς Ἰουδαίας
  choice: general da Judeia
  rationale: στρατηγός pode designar tanto um comandante militar como uma autoridade regional com atribuições governamentais. “General da Judeia” mantém o título militar no texto e a nota registra a amplitude possível.
- source_word: ἀναδείξας
  choice: nomeou-o
  rationale: O verbo indica designação ou nomeação para um cargo oficial; “nomeou” é natural e preciso em português.
- source_word: ἐξαπέστειλεν
  choice: o enviou
  rationale: O verbo composto expressa envio para uma missão. Em português, “o enviou” comunica isso naturalmente, sem a formulação menos idiomática “enviou-o para fora”.
