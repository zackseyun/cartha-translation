base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/035.yaml
  text: You[a], O Lord, though needing nothing from anyone[b], were pleased for a temple of your dwelling to come into being among us.
translation:
  language: pt
  text: Tu, Senhor, que não tens necessidade de coisa alguma[a], tiveste por bem que viesse a existir entre nós[b] um templo para tua habitação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sendo sem necessidade de todas as coisas”; isto é, sem precisar de coisa alguma.
    reason: lexical_alternative
  - marker: b
    text: Ou “em nós”. O grego pode ter ambos os sentidos; neste contexto do templo, “entre nós” provavelmente indica a presença de Deus no meio da comunidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπροσδεὴς τῶν ὅλων
  choice: não necessites de coisa alguma
  rationale: A expressão indica que o Senhor não tem necessidade de nada. A formulação conserva a abrangência de τῶν ὅλων sem restringi-la apenas a pessoas e soa natural em português.
- source_word: ηὐδόκησας
  choice: quiseste
  rationale: O verbo expressa agrado e decisão favorável. “Quiseste” comunica claramente o aspecto volitivo no contexto da oração, sem exagerar o componente emocional.
- source_word: ναὸν
  choice: um templo
  rationale: ναός designa o templo ou santuário entendido como lugar da presença divina; “templo” é a tradução corrente e adequada ao contexto.
- source_word: τῆς σῆς σκηνώσεως
  choice: para tua habitação
  rationale: Embora a construção seja literalmente próxima de “de tua habitação”, em português “templo para tua habitação” expressa com naturalidade a função do templo como lugar da presença de Deus, sem introduzir terminologia posterior.
- source_word: ἐν ἡμῖν
  choice: entre nós
  rationale: No contexto do templo, o plural provavelmente indica a presença de Deus no meio da comunidade. A possibilidade formal de “em nós” é preservada em nota.
- source_word: γενέσθαι
  choice: que existisse
  rationale: O infinitivo de γίνομαι significa vir a ser ou passar a existir. “Que existisse” evita acrescentar a ideia específica de construção, ausente do grego, e produz uma frase natural.
theological_decisions:
- issue: Autossuficiência divina em ἀπροσδεὴς τῶν ὅλων
  choice: embora não necessites de coisa alguma
  alternative: sendo independente de todas as coisas
  rationale: A tradução mantém a tensão entre Deus não precisar de nada e, ainda assim, querer um templo para sua habitação. “Embora” torna explícita a relação concessiva naturalmente implicada pelo contexto, sem transformar a frase em uma abstração filosófica.
- issue: Sentido comunitário ou interior de ἐν ἡμῖν
  choice: entre nós
  alternative: em nós
  rationale: A referência explícita ao templo favorece o sentido comunitário e local, isto é, o templo no meio do povo. Como o grego também admite formalmente “em nós”, essa alternativa permanece na nota.
translation_notes:
  register: Português moderno, claro e solene, com tratamento direto por “tu”, adequado à oração. Evitou-se tanto uma formulação excessivamente literal e pouco natural quanto uma interpretação individualizante de ἐν ἡμῖν.
