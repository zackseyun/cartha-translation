  yaml_path: translation/deuterocanon/2_maccabees/014/039.yaml
  text: But Nikanor[a], wanting to make plain the hostility he had toward the Jews, sent more than five hundred soldiers to arrest him.
translation:
  language: pt
  text: Mas Nicanor, querendo tornar evidente a hostilidade que nutria contra os judeus, enviou mais de quinhentos[a] soldados para prendê-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “além dos quinhentos”.
    reason: Esclarece a forma da expressão grega, cujo sentido é “mais de quinhentos”.
lexical_decisions:
- source_word: βουλόμενος
  choice: querendo
  rationale: Expressa de modo natural a vontade ou intenção de Nicanor, sem tornar o sentido mais deliberado do que o grego exige.
- source_word: πρόδηλον ποιῆσαι
  choice: tornar evidente
  rationale: 'Preserva a construção causativa: Nicanor queria fazer com que sua hostilidade se tornasse clara ou manifesta.'
- source_word: ἣν εἶχεν πρὸς τοὺς Ἰουδαίους δυσμένειαν
  choice: a hostilidade que nutria contra os judeus
  rationale: “Hostilidade” representa bem a disposição adversa indicada por δυσμένεια; “nutria” traduz idiomaticamente εἶχεν sem reduzir a expressão a uma emoção passageira.
- source_word: ἀπέστειλεν στρατιώτας
  choice: enviou ... soldados
  rationale: Tradução direta e corrente dos termos narrativos gregos.
- source_word: ὑπὲρ τοὺς πεντακοσίους
  choice: mais de quinhentos
  rationale: Com acusativo e referência numérica, ὑπέρ indica quantidade superior a quinhentos.
- source_word: συλλαβεῖν αὐτόν
  choice: para prendê-lo
  rationale: No contexto de soldados enviados contra uma pessoa, συλλαμβάνω indica capturá-la ou detê-la; “prender” comunica de modo claro a finalidade da ação.
