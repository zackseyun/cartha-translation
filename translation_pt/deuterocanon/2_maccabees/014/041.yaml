    issue: “vendo-se completamente cercado”
    rationale: O grego περικάλυπτος γενόμενος descreve a condição em que ele ficou—cercado/encurralado—e não declara que ele tenha percebido ou se dado conta dessa condição. “Vendo-se” introduz uma inferência evitável.
