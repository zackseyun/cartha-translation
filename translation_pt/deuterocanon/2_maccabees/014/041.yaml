    issue: “voltou a espada contra si mesmo”
    rationale: 'Embora comunique o sentido narrativo, “voltou ... contra” descreve uma mudança de direção ou um gesto que o grego não especifica. ὑπέθηκεν ἑαυτῷ τὸ ξίφος é deliberadamente menos específico: ele pôs/aplicou a espada a si mesmo.'
