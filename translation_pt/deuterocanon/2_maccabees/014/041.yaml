base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/041.yaml
  text: But when the crowds were about to seize the tower[a], and were forcing the courtyard gate, and were ordering that fire be brought and the doors set on fire, he, completely surrounded, put the sword to himself;
translation:
  language: pt
  text: Quando, porém, as multidões estavam prestes a tomar a torre, forçavam o portão do pátio e mandavam trazer fogo, pôr fogo às portas e queimá-las, ele, completamente cercado, pôs a espada contra si mesmo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “lançou-se sobre a espada” ou “cravou a espada em si mesmo”. Mais literalmente, o grego diz “pôs a espada contra si mesmo”.
    reason: Alternativas lexicais para uma expressão grega que descreve a ação sem especificar claramente seu movimento.
lexical_decisions:
- source_word: τῶν ... πληθῶν
  choice: as multidões
  rationale: πλῆθος designa uma multidão ou grande número de pessoas. “As multidões” preserva o plural e não acrescenta o tom pejorativo de “a turba”.
- source_word: μελλόντων
  choice: estavam prestes a
  rationale: A construção com infinitivo expressa iminência, não uma ação já concluída.
- source_word: τὸν πύργον καταλαβέσθαι
  choice: tomar a torre
  rationale: καταλαμβάνω indica aqui apoderar-se de uma posição. “Tomar” é natural no contexto de um ataque e não especifica além do grego.
- source_word: τὴν αὐλαίαν θύραν
  choice: o portão do pátio
  rationale: αὐλαία relaciona a entrada ao pátio, e θύρα, neste contexto arquitetônico, é mais bem representado por “portão”.
- source_word: βιαζομένων
  choice: forçavam
  rationale: O particípio transmite o emprego de força contra o portão; “forçavam” mantém tanto a ação violenta quanto o caráter progressivo.
- source_word: κελευόντων πῦρ προσάγειν
  choice: mandavam trazer fogo
  rationale: κελεύω expressa ordem, e προσάγω descreve fazer chegar o fogo ao lugar atacado.
- source_word: τὰς θύρας ὑφάπτειν καὶ τὰς θύρας φλέγειν
  choice: pôr fogo às portas e queimá-las
  rationale: A tradução conserva a acumulação de dois verbos gregos próximos, ὑφάπτω e φλέγω, sem tornar a frase portuguesa excessivamente rígida.
- source_word: περικάλυπτος γενόμενος
  choice: vendo-se completamente cercado
  rationale: No contexto, a expressão descreve alguém encerrado ou cercado por todos os lados. “Vendo-se” comunica naturalmente a mudança de situação indicada por γενόμενος.
- source_word: ὑπέθηκεν ἑαυτῷ τὸ ξίφος
  choice: voltou a espada contra si mesmo
  rationale: A expressão grega diz de modo pouco específico que ele colocou ou aplicou a espada contra si. Esta formulação preserva a ação autodestrutiva sem impor o movimento mais específico de “lançar-se sobre a espada” ou “cravá-la”.
theological_decisions:
- issue: Descrição do ato de Razis contra a própria vida
  choice: voltou a espada contra si mesmo
  alternative: lançou-se sobre a espada; cravou a espada em si mesmo
  rationale: A narrativa é eticamente sensível, mas o grego não detalha com precisão o movimento. A tradução evita tanto um eufemismo quanto uma descrição mecânica mais específica do que a fonte permite.
translation_notes:
  register: Português moderno, digno e narrativo, com ampla legibilidade brasileira. A ordem dos acontecimentos e a repetição retórica dos dois verbos ligados ao fogo foram preservadas. O marcador da nota foi colocado junto à expressão que ela explica.
