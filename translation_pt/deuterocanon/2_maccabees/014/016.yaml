- source_word: προστάξαντος
  choice: deu a ordem
  rationale: O particípio aoristo de προστάσσω expressa a ordem que desencadeia a ação; a formulação é natural e mantém o contexto militar.
- source_word: τοῦ ἡγουμένου
  choice: o comandante
  rationale: Ἡγούμενος pode designar líder ou comandante; aqui, o contexto militar favorece «comandante» sem atribuir-lhe um cargo civil específico.
- source_word: ἀναζεύξας
  choice: levantou acampamento
  rationale: O verbo é empregado para levantar acampamento e pôr-se em marcha; a tradução conserva a imagem militar concreta.
- source_word: συνμίσγει
  choice: travou combate com
  rationale: Embora o sentido literal seja «misturar-se com», em narrativa militar o verbo indica entrar em confronto ou combate.
- source_word: ἐπὶ κώμην
  choice: junto ao povoado de
  rationale: Ἐπί com acusativo pode indicar movimento em direção a um lugar ou ação em sua área; «junto ao povoado» conserva alguma abertura entre localização e proximidade.
- source_word: Λεσσαού
  choice: Lessaú
  rationale: Transliteração adaptada à ortografia e à acentuação naturais do português a partir da forma grega Λεσσαού.
