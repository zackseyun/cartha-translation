lexical_decisions:
- source_word: Μετὰ δὲ τριετῆ χρόνον
  choice: Mas, depois de três anos
  rationale: μετά com o acusativo indica tempo decorrido, e δέ funciona como transição narrativa suave, aqui expressa por “Mas”.
- source_word: προσέπεσεν τοῖς περὶ τὸν Ἰούδαν
  choice: chegou aos que estavam com Judas a notícia
  rationale: Embora προσπίπτω signifique literalmente “cair sobre”, neste contexto a expressão comunica de modo idiomático que uma informação chegou a Judas e aos seus companheiros.
- source_word: Δημήτριον τὸν τοῦ Σελεύκου
  choice: Demétrio, filho de Seleuco
  rationale: A construção grega com artigo e genitivo indica filiação; esta forma é clara e natural em português.
- source_word: διὰ τοῦ κατὰ Τρίπολιν λιμένος εἰσπλεύσαντα
  choice: havia entrado pelo porto de Trípolis
  rationale: O particípio εἰσπλεύσαντα descreve a entrada por via marítima, e διά com o genitivo marca o porto como via de acesso; o mais-que-perfeito composto ajusta a ação ao conteúdo da notícia.
- source_word: μετὰ πλήθους ἰσχυροῦ καὶ στόλου
  choice: com uma poderosa força militar e uma frota
  rationale: πλῆθος designa aqui um corpo numeroso de homens em contexto militar, ἰσχυροῦ ressalta seu poder, e στόλος identifica distintamente a frota.
