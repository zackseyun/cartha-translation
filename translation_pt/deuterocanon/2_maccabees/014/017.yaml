  naturalness: “Havia enfrentado Nicanor” e “sofrera um leve revés” são naturais em português moderno. “Súbita incapacidade de falar dos adversários” preserva a expressão incomum do grego com clareza suficiente; a nota explica que a relação inteira é difícil.
  terminology: Os nomes “Simão”, “Judas” e “Nicanor” estão adequados. “Leve revés” transmite figuradamente ἐπταικώς sem introduzir uma derrota decisiva ou uma avaliação moral.
