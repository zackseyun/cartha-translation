  text: But Simon[a], the brother of Judas, had come to terms with Nicanor[c][b], though reluctantly, having stumbled because of the sudden speechlessness of his opponents.
translation:
  language: pt
  text: Simão, irmão de Judas, havia enfrentado Nicanor, mas sofrera um leve revés por causa da súbita incapacidade de falar dos adversários.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A oração grega é difícil. Literalmente, fala de Simão tendo “tropeçado” ou sofrido um revés, por causa da súbita “falta de fala” dos adversários. “Leve” procura refletir o advérbio grego, literalmente “lentamente”, cujo sentido preciso nesta construção é incerto.
    reason: textual_ambiguity
lexical_decisions:
- source_word: συμβεβληκὼς ἦν τῷ Νικάνορι
  choice: havia entrado em confronto com Nicanor
  rationale: No contexto narrativo de combate, συμβάλλω com dativo indica mais naturalmente encontrar ou enfrentar alguém em batalha. A construção perifrástica no mais-que-perfeito aponta para uma ação anterior já ocorrida.
- source_word: βραδέως
  choice: momentâneo
  rationale: Embora o sentido básico seja “lentamente”, aqui o advérbio qualifica o revés e parece limitar sua duração ou extensão. “Momentâneo” produz português natural sem associá-lo indevidamente ao confronto anterior.
- source_word: ἐπταικώς
  choice: sofrera um revés
  rationale: πταίω significa literalmente “tropeçar” e, por extensão, falhar ou ficar em desvantagem. A formulação escolhida conserva a ideia de um contratempo militar sem sugerir pecado moral.
- source_word: ἐφνίδιον ... ἀφασίαν
  choice: súbita perplexidade
  rationale: ἀφασία significa literalmente falta de fala, mas pode representar o estado de quem fica atônito ou desconcertado. “Perplexidade” mantém essa imagem de desorientação em linguagem compreensível.
- source_word: τῶν ἀντιπάλων
  choice: provocada pelos adversários
  rationale: O genitivo admite mais de uma relação sintática. Nesta frase difícil, a leitura causal — perplexidade provocada pelo lado adversário — dá sentido ao revés de Simão, mas a nota registra a incerteza.
