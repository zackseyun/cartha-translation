lexical_decisions:
- source_word: ἔτι δὲ ἔμπνους ὑπάρχων
  choice: Ainda respirando
  rationale: Preserva a imagem física e vívida de ἔμπνους, isto é, estar ainda com fôlego ou vivo, e funciona naturalmente como transição narrativa.
- source_word: πεπυρωμένος τοῖς θυμοῖς
  choice: ardendo de ira
  rationale: Reproduz a metáfora de πεπυρωμένος, literalmente abrasado ou incendiado, e entende θυμοῖς como a intensa ira ou paixão do personagem.
- source_word: ἐξαναστὰς
  choice: levantou-se
  rationale: Expressa de modo natural o ato de se erguer apesar dos ferimentos, sem acrescentar intensidade não explicitada.
- source_word: φερομένων κρουνηδὸν τῶν αἱμάτων
  choice: o sangue lhe jorrasse em torrentes
  rationale: Comunica o fluxo vigoroso evocado por κρουνηδόν e emprega uma construção idiomática em português; a imagem mais literal de fonte é preservada em nota.
- source_word: δυσχερῶν τῶν τραυμάτων ὄντων
  choice: os ferimentos fossem graves
  rationale: No contexto corporal, δυσχερῶν caracteriza os ferimentos como penosos ou graves; esta formulação é clara, digna e atual.
- source_word: δρόμῳ τοὺς ὄχλους διελθών
  choice: atravessou correndo as multidões
  rationale: Mantém δρόμῳ como indicação do modo de deslocamento e conserva o plural de ὄχλους.
- source_word: στὰς ἐπί τινος πέτρας ἀπορρώγος
  choice: parando sobre uma rocha escarpada
  rationale: ἀπορρώγος pode descrever uma rocha abrupta, saliente ou alcantilada; 'escarpada' preserva o sentido topográfico sem especificá-lo em excesso.
