base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/030.yaml
  text: But Maccabaeus[a], perceiving from Nicanor’s actions toward him that he had assumed a harsher than usual manner, and understanding that this severity did not come from the better course, gathered not a few of his men and kept himself hidden from Nicanor.
translation:
  language: pt
  text: Mas Macabeu, percebendo pelas atitudes de Nicanor para com ele que a recepção que costumava lhe dar se tornara mais hostil, e entendendo que essa severidade não era para o melhor[a], reuniu um bom número dos seus homens e manteve-se escondido de Nicanor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “essa severidade não provinha da melhor intenção”. A expressão grega pode se referir tanto à intenção de Nicanor quanto ao rumo de ação que ele havia adotado.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσθητήριον διεξαγαγόντος ... τὰ πρὸς αὐτόν
  choice: pelas atitudes de Nicanor para com ele
  rationale: A construção grega é difícil e descreve a disposição que Nicanor deixou transparecer em seu trato com Macabeu. “Atitudes” comunica o comportamento observável sem transformar αἰσθητήριον numa faculdade abstrata.
- source_word: συνιδὼν
  choice: percebendo
  rationale: O particípio indica reconhecimento perspicaz, não mera visão.
- source_word: τὴν ἠθισμένην ἀπάντησιν ἀγριωτέρως ἐσχηκότα
  choice: seu modo habitual de recebê-lo se tornara mais hostil
  rationale: Preserva a ideia de uma mudança no encontro ou recepção costumeira. “Mais hostil” expressa o comparativo ἀγριωτέρως de forma natural no contexto.
- source_word: νοήσας
  choice: entendendo
  rationale: Marca a conclusão a que Macabeu chegou com base na conduta de Nicanor.
- source_word: οὐκ ἀπὸ τοῦ βελτίστου τὴν αὐστηρίαν εἶναι
  choice: essa severidade não procedia do melhor propósito
  rationale: Expressa de modo inteligível a inferência de que a severidade não tinha origem boa ou honrosa, enquanto a nota registra a possível referência alternativa ao rumo de ação.
- source_word: συστρέψας οὐκ ὀλίγους τῶν περὶ αὐτὸν
  choice: reuniu um bom número dos seus homens
  rationale: A expressão litótica οὐκ ὀλίγους indica quantidade considerável; “seus homens” condiz com o contexto militar.
- source_word: συνεκρύπτετο τὸν Νικάνορα
  choice: manteve-se escondido de Nicanor
  rationale: O imperfeito comunica uma situação continuada de ocultação.
theological_decisions:
- issue: Ambiguidade de οὐκ ἀπὸ τοῦ βελτίστου
  choice: não procedia do melhor propósito
  alternative: não era para o melhor / não vinha do melhor rumo
  rationale: A formulação principal privilegia uma origem ou motivação não boa, mas a nota preserva a possibilidade de o grego se referir antes à política ou ao rumo adotado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “Macabeu”, forma tradicional e corrente em português, e evita literalismos pouco naturais sem apagar a ambiguidade do grego.
