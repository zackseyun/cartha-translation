base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/037.yaml
  text: A certain Razis[a], one of the elders from Jerusalem, was reported to Nicanor—a man devoted to his city and very highly regarded[b], and because of his goodwill called the father of the Jews.
translation:
  language: pt
  text: Um certo Razis, um dos anciãos de Jerusalém, foi denunciado a Nicanor[a]. Era um homem dedicado à sua cidade[b] e muito estimado; por causa de sua benevolência, era chamado pai dos judeus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi levado ao conhecimento de Nicanor”. O verbo grego pode indicar simplesmente que se transmitiram informações sobre alguém, embora, neste contexto, possa ter o sentido hostil de denúncia.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “amigo de sua cidade” ou “aquele que ama sua cidade”; isto é, dedicado ao bem de sua comunidade cívica.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ῥαζεὶς
  choice: Razis
  rationale: Translitera o nome próprio grego de modo simples e reconhecível em português.
- source_word: πρεσβυτέρων
  choice: anciãos
  rationale: Designa membros mais velhos e reconhecidos da liderança comunitária, não apenas homens de idade avançada.
- source_word: ἐμηνύθη
  choice: foi denunciado
  rationale: O passivo indica que informações sobre Razis foram levadas a Nicanor; o contexto hostil favorece “denunciado”, embora o verbo também admita uma formulação mais neutra, preservada em nota.
- source_word: φιλοπολίτης
  choice: dedicado à sua cidade
  rationale: Expressa amor e compromisso com a pólis sem recorrer ao potencialmente anacrônico “patriota”.
- source_word: σφόδρα καλῶς ἀκούων
  choice: muito estimado
  rationale: Reproduz naturalmente o sentido idiomático de possuir excelente reputação pública.
- source_word: εὔνοιαν
  choice: benevolência
  rationale: Comunica uma disposição favorável e bondosa que explica o título honorífico dado a Razis.
- source_word: πατὴρ τῶν Ἰουδαίων
  choice: pai dos judeus
  rationale: Mantém diretamente o título honorífico do grego, sem sugerir paternidade biológica.
- source_word: προσαγορευόμενος
  choice: era chamado
  rationale: Indica uma designação habitual em português corrente e digno.
theological_decisions:
- issue: Descrição honorífica de Razis
  choice: Preservar sem atenuação os elogios cívicos e comunitários do texto.
  alternative: Interpretá-los como “patriota” ou “benfeitor da nação”.
  rationale: O grego retrata Razis de maneira fortemente favorável, mas não exige conceitos políticos ou títulos mais específicos do que aqueles efetivamente empregados.
translation_notes:
  register: Português moderno, claro e digno, com fluência natural tanto no Brasil quanto em outros contextos lusófonos. A divisão em duas frases esclarece que os elogios descrevem Razis, sem alterar a relação sintática do grego.
