lexical_decisions:
- source_word: διόπερ
  choice: Por isso
  rationale: Expressa de modo natural a conclusão causal ou inferencial introduzida pela conjunção grega.
- source_word: ἔπεμψεν
  choice: enviou
  rationale: Equivalente direto e corrente do aoristo de πέμπω; o sujeito permanece implícito, como no grego.
- source_word: Ποσίδωνιον καὶ Θεόδοτον καὶ Ματταθίαν
  choice: Posidônio, Teódoto e Matatias
  rationale: Emprega as formas portuguesas tradicionais e legíveis dos nomes próprios; a enumeração natural em português dispensa repetir a conjunção.
- source_word: δοῦναι καὶ λαβεῖν
  choice: dar e receber
  rationale: Preserva a estrutura recíproca dos dois infinitivos gregos e o caráter bilateral do compromisso.
- source_word: δεξιάς
  choice: garantias solenes
  rationale: No idioma grego, a mão direita dada e recebida funciona como sinal de compromisso, boa-fé ou acordo. A tradução comunica o sentido no texto principal, enquanto a nota conserva a imagem concreta.
