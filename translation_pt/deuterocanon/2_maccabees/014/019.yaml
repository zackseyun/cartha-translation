  text: Therefore he sent Posidonius and Theodotus and Mattathias to give and receive pledges[a].
translation:
  language: pt
  text: Por isso, enviou Posidônio, Teódoto e Matatias para dar e receber garantias[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dar e receber mãos direitas”, gesto que confirmava um compromisso de boa-fé ou um acordo.
