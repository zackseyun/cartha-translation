base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/034.yaml
  text: 'After saying these things[a], he went away. But the priests, stretching out their hands toward heaven, were calling on the one who is always the champion of our nation, saying these things:'
translation:
  language: pt
  text: 'Depois de dizer essas coisas, ele foi embora. Os sacerdotes, porém, estendendo as mãos para o céu, invocavam aquele que sempre combate em defesa de nossa nação[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele que é sempre o defensor de nossa nação”. O termo grego também pode designar quem combate em defesa de alguém.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα δὲ εἰπὼν
  choice: Depois de dizer essas coisas
  rationale: Expressa naturalmente em português o valor temporal do particípio e retoma o discurso anterior sem ampliar seu conteúdo.
- source_word: ἀπῆλθεν
  choice: ele foi embora
  rationale: Tradução narrativa clara e atual para o verbo de afastamento.
- source_word: προτείναντες τὰς χεῖρας
  choice: estendendo as mãos
  rationale: Preserva explicitamente o gesto físico de oração e a relação participial com o verbo principal.
- source_word: εἰς τὸν οὐρανόν
  choice: para o céu
  rationale: Indica a direção do gesto de modo natural, sem sugerir entrada no céu.
- source_word: ἐπεκαλοῦντο
  choice: invocavam
  rationale: Mantém o aspecto durativo do imperfeito e expressa com precisão o ato de dirigir uma súplica a Deus.
- source_word: τὸν διὰ παντὸς ὑπέρμαχον
  choice: aquele que sempre combate em defesa
  rationale: Conserva tanto a continuidade indicada por διὰ παντός quanto a dimensão marcial e protetora de ὑπέρμαχος.
- source_word: τοῦ ἔθνους ἡμῶν
  choice: de nossa nação
  rationale: Preserva o sentido corporativo e nacional de ἔθνος neste contexto judaico.
- source_word: ταῦτα λέγοντες
  choice: dizendo
  rationale: Introduz de forma idiomática em português o conteúdo da oração que vem em seguida; repetir 'essas coisas' seria pouco natural.
theological_decisions:
- issue: Descrição divina em τὸν διὰ παντὸς ὑπέρμαχον τοῦ ἔθνους ἡμῶν
  choice: aquele que sempre combate em defesa de nossa nação
  alternative: o defensor permanente de nossa nação
  rationale: A formulação escolhida retém a imagem de alguém que luta em favor de outro, inerente a ὑπέρμαχος, sem transformar a expressão em título técnico nem enfraquecer seu caráter protetor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi ajustada para soar natural, preservando a progressão narrativa, o gesto de oração e a força marcial-protetora da descrição divina.
