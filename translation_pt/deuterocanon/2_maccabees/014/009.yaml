base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/009.yaml
  text: Since you know each of these things[a], O king, take thought for the country and for our nation that is being hard pressed[b], according to the gracious goodwill you have toward all.
translation:
  language: pt
  text: Visto que conheces cada uma dessas coisas, ó rei, cuida do país e de nossa nação, que está sob pressão[a], conforme a benevolência que demonstras prontamente para com todos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nossa nação, que está cercada” ou “nossa nação, que está sendo acossada”. O particípio grego pode indicar estar cercado, assediado ou sob pressão.
    reason: lexical_alternative
  - marker: b
    text: A expressão traduzida por “benevolência que demonstras prontamente” é rara e descreve uma bondade prontamente demonstrada, acessível ou favoravelmente disposta para com os outros.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστα ... τούτων
  choice: cada uma dessas coisas
  rationale: Preserva o sentido distributivo de ἕκαστα com o genitivo τούτων, em vez de reduzi-lo ao coletivo “todas essas coisas”.
- source_word: ἐπεγνωκώς
  choice: visto que conheces
  rationale: O particípio perfeito expressa conhecimento já adquirido; a construção causal é natural em português e se ajusta ao apelo dirigido ao rei.
- source_word: προσνοήθητι
  choice: cuida
  rationale: O imperativo pede consideração atenta acompanhada de solicitude. “Cuida” comunica ambas as ideias de modo corrente e digno.
- source_word: χώρας
  choice: país
  rationale: No contexto político, χώρα designa o território em questão; “país” reproduz adequadamente esse sentido.
- source_word: τοῦ περιισταμένου γένους ἡμῶν
  choice: de nossa nação, que está sendo duramente pressionada
  rationale: γένος refere-se aqui ao povo como coletividade, e o particípio presente περιισταμένου retrata uma aflição em curso, podendo sugerir cerco, assédio ou forte pressão.
- source_word: καθ᾽ ἣν ἔχεις ... φιλανθρωπίαν
  choice: conforme a benevolência ... que demonstras
  rationale: κατά indica o padrão ao qual se apela, e φιλανθρωπία denota humanidade, bondade ou benevolência. “Demonstras” torna idiomática em português a disposição que o rei tem para com todos.
- source_word: εὐαπάντητον
  choice: sempre pronta
  rationale: O adjetivo raro parece caracterizar uma benevolência prontamente oferecida, acessível ou favoravelmente disposta; “sempre pronta” conserva essa nuance sem criar um tecnicismo.
- source_word: πρὸς ἅπαντας
  choice: para com todos
  rationale: Expressa naturalmente em português a direção relacional da disposição indicada por πρός com acusativo.
