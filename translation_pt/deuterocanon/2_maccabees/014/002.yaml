lexical_decisions:
- source_word: κεκρατηκέναι
  choice: ter assumido o controle
  rationale: O infinitivo perfeito de κρατέω indica que o domínio já havia sido alcançado; a expressão comunica controle político e militar sem afirmar sua permanência.
- source_word: τῆς χώρας
  choice: do país
  rationale: χώρα designa aqui o território ou reino disputado, não apenas a terra em sentido físico.
- source_word: ἐπανελόμενον
  choice: depois de eliminar
  rationale: O particípio de ἐπαναιρέω indica a retirada definitiva dos rivais. “Eliminar” preserva a força do contexto político e admite a implicação de morte sem especificar o modo.
- source_word: Ἀντίοχον
  choice: Antíoco
  rationale: Forma portuguesa tradicional do nome próprio grego.
- source_word: ἐπίτροπον
  choice: tutor
  rationale: ἐπίτροπος pode designar tutor, responsável ou regente. “Tutor” expressa diretamente a relação pessoal com Antíoco, enquanto a função política é indicada na nota.
- source_word: Λυσίαν
  choice: Lísias
  rationale: Forma portuguesa tradicional do nome próprio grego.
