base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/027.yaml
  text: But the king became enraged[a], and, provoked by the slanders of that utterly wicked man, wrote to Nikanor[b], saying that he took the treaty very badly and ordering him to send Maccabeus to Antioch as a prisoner at once.
translation:
  language: pt
  text: Mas o rei ficou furioso e, incitado pelas calúnias daquele homem inteiramente perverso, escreveu a Nicanor, dizendo que estava profundamente descontente com os acordos[a] e ordenando-lhe que enviasse Macabeu imediatamente a Antioquia como prisioneiro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “termos de paz”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “preso” ou “amarrado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθυμος γενόμενος
  choice: ficou furioso
  rationale: A expressão indica que o rei se inflamou de ira; esta formulação preserva a intensidade e soa natural em português.
- source_word: πανπονήρου
  choice: inteiramente perverso
  rationale: O composto intensifica a caracterização moral de πονηρός, sem acrescentar conteúdo ausente do grego.
- source_word: διαβολαῖς
  choice: calúnias
  rationale: No contexto, designa acusações maliciosas e difamatórias, provavelmente falsas, feitas contra Macabeu.
- source_word: ἐρεθισθεὶς
  choice: incitado
  rationale: O particípio descreve o rei sendo instigado pelas calúnias e estabelece a relação causal com sua reação.
- source_word: συνθηκῶν
  choice: acordo
  rationale: O plural grego pode designar acordos, condições pactuadas ou termos de paz; no contexto político, 'acordo' é claro e não especifica além da evidência.
- source_word: φάσκων βαρέως φέρειν
  choice: dizendo que estava profundamente descontente
  rationale: O idioma expressa forte desagrado ou ofensa. A tradução evita o pouco natural 'recebia mal' e mantém o discurso indireto.
- source_word: δέσμιον
  choice: como prisioneiro
  rationale: O adjetivo indica alguém preso, cativo ou sob custódia; não exige especificamente correntes físicas.
- source_word: ἐξαποστέλλειν
  choice: enviasse
  rationale: Transmite adequadamente a ordem de remeter Macabeu a Antioquia.
- source_word: ταχέως
  choice: imediatamente
  rationale: Expressa com naturalidade a urgência da ordem real.
theological_decisions:
- issue: Caracterização moral em πανπονήρου
  choice: daquele homem inteiramente perverso
  alternative: daquele homem totalmente mau
  rationale: A forte avaliação moral está explícita no grego e deve ser preservada, sem suavização nem ampliação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem dos acontecimentos e a força emocional do grego foram preservadas, evitando construções excessivamente literais que soariam artificiais.
