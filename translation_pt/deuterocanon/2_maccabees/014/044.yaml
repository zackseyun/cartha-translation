  text: But when they quickly drew back[a], and a space opened up, he came into the middle of the courtyard.
translation:
  language: pt
  text: Mas, quando eles recuaram depressa e se abriu um espaço, ele veio parar no meio do espaço aberto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναποδισάντων
  choice: recuaram
  rationale: O particípio descreve as pessoas afastando-se para trás; “recuaram” é natural, direto e não exige uma leitura estritamente militar.
- source_word: ταχέως
  choice: depressa
  rationale: Preserva de modo corrente a rapidez repentina do movimento.
- source_word: γενομένου διαστήματος
  choice: se abriu um espaço
  rationale: A construção genitiva absoluta indica que, ao recuarem, formou-se uma separação ou abertura entre as pessoas.
- source_word: ἦλθεν
  choice: foi cair
  rationale: Embora o verbo signifique literalmente “veio/foi”, o contexto imediato é o salto de Razis do muro; “foi cair” expressa naturalmente o movimento e o resultado sem acrescentar uma nova ação.
- source_word: κατὰ μέσον τὸν κενεῶνα
  choice: bem no meio do vão
  rationale: A expressão localiza a queda no centro do espaço vazio que acabara de se formar. “Vão” evita a interpretação arquitetônica injustificada de “pátio” e mantém a imagem concreta da abertura na multidão.
