base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/015.yaml
  text: But when they heard of Nikanor’s advance and the attack of the Gentiles[a], they sprinkled dust upon themselves and implored the one who had established his people forever[c][b], and who always comes to the aid of his own portion with manifestation.
translation:
  language: pt
  text: Mas, quando souberam do avanço de Nicanor e do ataque dos gentios[a], lançaram pó sobre si e suplicaram àquele que estabeleceu o seu povo para sempre e que sempre socorre a porção que lhe pertence de maneira manifesta[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das nações”. O termo grego pode designar as nações em geral, mas, neste contexto, refere-se a povos não judeus que se opunham aos judeus.
    reason: lexical_alternative
  - marker: b
    text: Ou “com manifestação”, “abertamente” ou “com intervenção visível”. A expressão grega sugere auxílio acompanhado por uma ação divina manifesta.
    reason: alternative_reading
  - marker: c
    text: Ou “a sua herança”. A expressão pode conservar o sentido pactual do povo de Deus como a porção que lhe foi atribuída.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: quando souberam
  rationale: O particípio aoristo introduz a circunstância temporal da ação principal; esta formulação é natural em português.
- source_word: ἔφοδον
  choice: avanço
  rationale: Designa um movimento militar hostil e mantém distinção em relação a ἐπίθεσιν, traduzido como “ataque”.
- source_word: ἐπίθεσιν
  choice: ataque
  rationale: Expressa de modo direto a investida militar mencionada no texto.
- source_word: τῶν ἐθνῶν
  choice: dos gentios
  rationale: Neste contexto judaico, refere-se aos povos não judeus que se opõem ao povo judeu, sem perder a possibilidade lexical geral indicada em nota.
- source_word: καταπασάμενοι γῆν
  choice: cobriram-se de pó
  rationale: Comunica naturalmente o gesto de lançar terra ou pó sobre si em sinal de aflição e súplica.
- source_word: ἐλιτάνευσαν
  choice: suplicaram
  rationale: Preserva o sentido de pedido intenso e reverente em linguagem corrente e digna.
- source_word: τὸν ἄχρι αἰῶνος συστήσαντα τὸν αὐτοῦ λαόν
  choice: àquele que estabeleceu o seu povo para sempre
  rationale: Mantém o particípio descritivo, o sentido constitutivo de συνίστημι e a duração expressa por ἄχρι αἰῶνος.
- source_word: ἀεὶ δὲ ... ἀντιλαμβανόμενον
  choice: e que sempre socorre
  rationale: O presente participial descreve uma ação característica e contínua de auxílio.
- source_word: μετʼ ἐπιφανείας
  choice: com manifestação visível
  rationale: Conserva a ideia de auxílio acompanhado por manifestação evidente, sem impor o termo técnico “epifania”.
- source_word: τῆς ἑαυτοῦ μερίδος
  choice: a porção que lhe pertence
  rationale: Preserva a imagem da porção atribuída a Deus e torna explícita em português a força reflexiva de ἑαυτοῦ.
theological_decisions:
- issue: Sentido de τῶν ἐθνῶν no contexto judaico
  choice: gentios
  alternative: nações
  rationale: “Gentios” comunica a referência contextual aos povos não judeus, enquanto a nota preserva o sentido lexical mais amplo.
- issue: Natureza do auxílio expresso por μετʼ ἐπιφανείας
  choice: com manifestação visível
  alternative: abertamente; com manifestação
  rationale: A tradução conserva a tensão entre uma aparição divina e uma intervenção claramente perceptível, sem definir em excesso o modo da ação.
- issue: Imagem pactual de τῆς ἑαυτοῦ μερίδος
  choice: a porção que lhe pertence
  alternative: a sua herança
  rationale: “Porção” permanece próxima do grego; a nota registra “herança”, que torna mais explícita a conotação pactual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A ordem da frase foi ajustada para fluidez, preservando os pares semânticos do grego e a ambiguidade teológica da manifestação divina.
