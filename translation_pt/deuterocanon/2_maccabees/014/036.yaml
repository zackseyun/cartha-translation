base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/036.yaml
  text: And now, O Lord, holy in every holiness, keep this house, recently purified, undefiled forever.
translation:
  language: pt
  text: E agora, Senhor, santo em toda santidade[b], conserva para sempre incontaminada esta casa[a], recentemente purificada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “este templo”. No grego, “esta casa” é uma maneira bíblica comum de se referir ao santuário.
    reason: lexical_alternative
  - marker: b
    text: A expressão “santo em toda santidade” traduz de perto uma formulação grega incomum, que também pode ser entendida como “santo acima de toda consagração” ou como outra expressão intensiva semelhante.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγιε παντὸς ἁγιασμοῦ
  choice: santo em toda santidade
  rationale: Mantém a formulação grega incomum e intensiva, sem acrescentar a ideia interpretativa de que Deus seja aqui chamado explicitamente de fonte da santidade.
- source_word: κύριε
  choice: Senhor
  rationale: É a tradução portuguesa corrente de κύριος como título divino e preserva o vocativo da oração.
- source_word: διατήρησον
  choice: conserva
  rationale: Expressa o pedido para que Deus mantenha continuamente o estado de pureza do santuário.
- source_word: εἰς αἰῶνα
  choice: para sempre
  rationale: Equivalente idiomático e claro para a duração indefinida expressa pela locução grega.
- source_word: ἀμίαντον
  choice: sem profanação
  rationale: No contexto cultual do templo, comunica que a casa deve permanecer livre de contaminação ou violação sagrada; evita a possível leitura meramente física de 'sem mancha'.
- source_word: τόνδε τὸν ... οἶκον
  choice: esta casa
  rationale: Preserva o sentido literal de οἶκος e o uso bíblico de 'casa' para o santuário, esclarecido em nota.
- source_word: προσφάτως κεκαθερισμένον
  choice: recentemente purificada
  rationale: Reproduz tanto a referência temporal de προσφάτως quanto o estado resultante indicado pelo particípio perfeito passivo κεκαθερισμένον.
theological_decisions:
- issue: Designação do santuário por οἶκος
  choice: casa
  alternative: templo
  rationale: O grego diz literalmente 'casa', designação bíblica comum do santuário. A tradução mantém a imagem do texto sem ocultar o referente, indicado em nota.
- issue: Sentido da expressão ἄγιε παντὸς ἁγιασμοῦ
  choice: santo em toda santidade
  alternative: santíssimo; fonte de toda santidade; santo acima de toda consagração
  rationale: A construção grega é elevada e incomum. A opção escolhida conserva sua tensão e caráter intensivo sem definir uma relação teológica—como origem ou superioridade—que a sintaxe não explicita de modo inequívoco.
- issue: Nuance cultual de ἀμίαντον
  choice: sem profanação
  alternative: imaculada; incontaminada; sem mancha
  rationale: Como o objeto é o templo recém-purificado, a ausência de profanação comunica de modo natural a pureza cultual em vista, sem restringi-la a sujeira física.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A oração conserva o tom solene e a formulação deliberadamente incomum do vocativo grego. Os marcadores [a] e [b] aparecem no texto principal; [b] foi colocado ao fim do versículo por comentar a invocação anterior sem interromper excessivamente a frase.
