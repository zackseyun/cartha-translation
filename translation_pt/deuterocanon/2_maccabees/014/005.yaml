base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/005.yaml
  text: That day was quiet. But when he found an opportunity suitable for his own folly[a], and had been summoned by Demetrius to the council and asked in what disposition and purpose the Jews stood,
translation:
  language: pt
  text: Naquele dia, ele teve tranquilidade. Mas, tendo aproveitado uma ocasião favorável à sua própria insensatez[a], foi convocado por Demétrio ao conselho e questionado sobre qual era a disposição e o propósito dos judeus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “tendo tomado uma ocasião como colaboradora de sua própria insensatez”. O grego é condensado e indica que ele aproveitou uma ocasião que servia ao seu plano insensato.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν ἡμέραν ἐκείνην ἡσυχίαν ἔσχεν
  choice: Aquele dia transcorreu em calma
  rationale: Reproduz de modo natural o idiomatismo grego, literalmente “aquele dia teve tranquilidade”, sem acrescentar a ideia mais específica de paz política.
- source_word: καιρὸν δὲ λαβών
  choice: Mas, tendo encontrado uma ocasião
  rationale: καιρός indica uma ocasião oportuna; a construção participial foi mantida para preservar a continuidade sintática com o restante da frase.
- source_word: τῆς ἰδίας ἀνοίας συνεργόν
  choice: favorável à sua própria insensatez
  rationale: O grego chama a ocasião, de modo condensado, de “colaboradora” da insensatez dele. A tradução comunica que a ocasião servia ao seu intento insensato sem transformar a metáfora em personificação excessivamente rígida.
- source_word: προσκληθεὶς εἰς συνέδριον
  choice: foi convocado ... ao conselho
  rationale: συνέδριον designa aqui um órgão ou reunião deliberativa; “conselho” é claro e adequado ao contexto oficial.
- source_word: ὑπὸ τοῦ Δημητρίου
  choice: por Demétrio
  rationale: Transliteração portuguesa tradicional do nome Δημήτριος.
- source_word: ἐπερωτηθείς
  choice: questionado
  rationale: Preserva o caráter oficial da consulta, sendo um pouco mais forte que “perguntado” sem sugerir necessariamente um interrogatório hostil.
- source_word: ἐν τίνι διαθέσει καὶ βουλῇ καθεστήκασιν
  choice: sobre a disposição e o propósito dos judeus
  rationale: 'Mantém distintos os dois substantivos gregos: διάθεσις aponta para a postura ou disposição presente, e βουλή para a intenção ou propósito deliberado.'
- source_word: οἱ Ἰουδαῖοι
  choice: os judeus
  rationale: No contexto macabeu, o termo designa o povo judeu em sentido étnico-religioso e político, não apenas habitantes da Judeia.
theological_decisions:
- issue: Alcance de οἱ Ἰουδαῖοι
  choice: os judeus
  alternative: os judeanos
  rationale: “Os judeus” expressa melhor a referência coletiva ao povo no contexto, sem restringi-la indevidamente à procedência geográfica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A vírgula final foi preservada porque o período grego continua no versículo seguinte; a formulação mantém essa abertura sintática.
