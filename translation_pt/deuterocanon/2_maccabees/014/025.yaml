  text: He urged him to marry and have children; he married[a], settled down, and shared in common life.
translation:
  language: pt
  text: Ele o incentivou a se casar e ter filhos; ele se casou, estabeleceu-se e participou da vida comum.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “participou da vida” ou “teve parte na vida”. A expressão grega é um tanto idiomática e provavelmente se refere à entrada na vida doméstica e social comum.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλεσεν
  choice: incentivou
  rationale: O verbo expressa persuasão ou encorajamento insistente. “Incentivou” é natural em português e comunica mais do que um simples pedido, sem sugerir coerção.
- source_word: γῆμαι
  choice: a se casar
  rationale: O infinitivo de γαμέω significa “casar-se”. A forma escolhida é corrente e não acrescenta especificações ausentes do grego.
- source_word: παιδοποιήσασθαι
  choice: ter filhos
  rationale: A expressão indica gerar descendência. “Ter filhos” é a formulação moderna mais natural e evita o tom arcaico de “gerar filhos”.
- source_word: ἐγάμησεν
  choice: ele se casou
  rationale: Tradução direta e natural do aoristo narrativo de γαμέω.
- source_word: εὐστάθησεν
  choice: estabeleceu-se
  rationale: O verbo sugere adquirir estabilidade ou uma condição estabelecida. No contexto da vida familiar, “estabeleceu-se” preserva esse sentido com linguagem natural e digna.
- source_word: ἐκοινώνησεν βίου
  choice: participou da vida comum
  rationale: A construção é idiomática e descreve participação no curso comum da vida humana, provavelmente doméstica e social. A tradução mantém a ideia de participação e a abertura semântica de βίος.
