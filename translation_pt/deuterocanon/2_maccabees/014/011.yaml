base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/011.yaml
  text: When this man had said such things[a], the rest of the Friends, being quickly ill-disposed toward Judas[b], further incited Demetrius.
translation:
  language: pt
  text: Depois que esse homem disse tais coisas, os demais Amigos[a], que nutriam certa hostilidade contra Judas, prontamente instigaram ainda mais Demétrio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os outros cortesãos do rei; no grego, “os demais Amigos”, provavelmente um título da corte, e não uma referência a amigos no sentido comum.
    reason: cultural_note
  - marker: b
    text: O verbo grego é raro e também pode significar que eles predispuseram ou tornaram Demétrio ainda mais hostil contra Judas.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιούτων δὲ ῥηθέντων ὑπὸ τούτου
  choice: Depois que esse homem disse tais coisas
  rationale: O genitivo absoluto estabelece a circunstância temporal. A oração ativa é natural em português e mantém a referência ao orador mencionado imediatamente antes.
- source_word: θᾶττον
  choice: prontamente
  rationale: Expressa a rapidez da reação sem forçar o valor comparativo possível do advérbio.
- source_word: οἱ λοιποὶ φίλοι
  choice: os demais Amigos
  rationale: No contexto da corte selêucida, φίλοι provavelmente designa os cortesãos que portavam o título de “Amigos”; a inicial maiúscula sinaliza esse uso técnico.
- source_word: δυσμενῶς ἔχοντες τι πρὸς τὸν Ἰούδαν
  choice: que nutriam certa hostilidade contra Judas
  rationale: Reproduz a disposição adversa expressa pelo idioma grego e conserva a atenuação ou indefinição de τι por meio de “certa”.
- source_word: προετετύρωμαν
  choice: instigaram ainda mais
  rationale: O verbo raro parece indicar que os cortesãos intensificaram a disposição de Demétrio contra Judas; a formulação mantém o aspecto causativo sem especificar além da evidência.
- source_word: τὸν Δημήτριον
  choice: Demétrio
  rationale: Forma portuguesa consagrada do nome grego.
