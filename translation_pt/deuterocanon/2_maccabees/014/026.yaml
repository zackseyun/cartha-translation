base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/026.yaml
  text: But Alcimus[a], perceiving the goodwill toward one another and learning of the agreements that had been made, came to Demetrius and said that Nicanor was favoring interests contrary to the state; for he had appointed Judas, the plotter against his kingdom[b], as successor.
translation:
  language: pt
  text: Alcimo, porém, ao perceber a boa vontade entre eles e tomar conhecimento dos acordos[a] que haviam sido feitos, foi ter com Demétrio e disse que Nicanor tinha intenções contrárias aos interesses do reino[b], pois havia designado Judas, o conspirador contra o seu reino[c], como sucessor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por «tratados» ou «termos», referindo-se aos arranjos firmados entre as partes.
    reason: lexical_alternative
  - marker: b
    text: Mais literalmente, «pensava coisas alheias aos assuntos». A expressão grega formula uma acusação de deslealdade política ou de orientação contrária aos interesses do reino.
    reason: lexical_alternative
  - marker: c
    text: Isto é, o reino de Demétrio, conforme o contexto; o grego diz literalmente «o reino dele».
    reason: referent_clarification
lexical_decisions:
- source_word: συνιδὼν
  choice: percebendo
  rationale: O particípio expressa reconhecer ou dar-se conta da situação, e não apenas vê-la fisicamente.
- source_word: εὔνοιαν
  choice: boa vontade
  rationale: Preserva a disposição favorável e amistosa entre as partes sem exagerar o grau de intimidade.
- source_word: συνθήκας
  choice: acordos
  rationale: É uma designação ampla e natural para os arranjos firmados; «tratados» ou «termos» também são possíveis conforme o grau de formalidade.
- source_word: λαβὼν
  choice: tomando conhecimento
  rationale: Embora o verbo signifique literalmente «tendo recebido», neste contexto indica receber notícia dos acordos já feitos.
- source_word: ἀλλότρια φρονεῖν τῶν πραγμάτων
  choice: defendia interesses contrários aos assuntos do reino
  rationale: A expressão grega é comprimida e literalmente fala em pensar coisas alheias aos assuntos; a formulação portuguesa comunica a acusação de orientação política incompatível com os interesses do governo sem a reduzir simplesmente a uma ação concreta.
- source_word: ἐπίβουλον
  choice: o conspirador contra
  rationale: Mantém a ideia de alguém que trama ou maquina contra o reino.
- source_word: διάδοχον
  choice: como sucessor
  rationale: Traduz diretamente a designação para suceder alguém sem acrescentar a noção hereditária sugerida por «herdeiro».
- source_word: ἀπέδειξεν
  choice: havia designado
  rationale: No contexto de função ou sucessão, o verbo tem o sentido de nomear ou indicar oficialmente.
theological_decisions:
- issue: Sentido político de ἀλλότρια φρονεῖν τῶν πραγμάτων
  choice: Apresentar a fala como acusação de que Nicanor defendia interesses contrários aos assuntos do reino.
  alternative: «pensava coisas alheias aos assuntos públicos» ou «agia contra os interesses do Estado»
  rationale: A tradução conserva o caráter político da denúncia e algo da dimensão de pensamento ou orientação presente em φρονεῖν, evitando tanto uma formulação portuguesa obscura quanto transformar a acusação apenas em atos consumados.
- issue: Referente de αὐτοῦ em «seu reino»
  choice: Manter o pronome possessivo no texto e esclarecer em nota que o contexto aponta para Demétrio.
  alternative: Explicitar no corpo do texto «contra o reino de Demétrio»
  rationale: O grego usa um pronome de terceira pessoa cujo referente contextual é Demétrio. A redação preserva a forma do original, enquanto a nota evita confusão para o leitor.
- issue: Força de διάδοχον
  choice: «como sucessor» sem especificar expressamente a quem Judas sucederia.
  alternative: «como seu sucessor», «como herdeiro» ou «como substituto»
  rationale: O original não explicita o referente da sucessão neste versículo; acrescentá-lo resolveria uma ambiguidade que o texto mantém.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com sintaxe narrativa fluente. «Alcimo», «Demétrio» e «Nicanor» seguem as formas portuguesas tradicionais. As notas preservam alternativas lexicais e esclarecem ambiguidades sem inserir interpretação denominacional.
