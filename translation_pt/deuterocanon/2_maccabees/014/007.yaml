lexical_decisions:
- source_word: βασιλείαν
  choice: o reino
  rationale: No contexto político, designa naturalmente o reino enquanto domínio e governo, sem restringir o sentido à realeza pessoal.
- source_word: εὐσταθείας
  choice: estabilidade
  rationale: Expressa uma condição firme e segura; “estabilidade” é claro e natural no contexto político.
- source_word: τυχεῖν
  choice: alcançasse
  rationale: O infinitivo aoristo significa obter ou atingir; a construção portuguesa com “para que” exige o subjuntivo e transmite com naturalidade a finalidade do trecho.
- source_word: ὅθεν
  choice: Por isso
  rationale: Introduz uma consequência ou inferência baseada no que precede.
- source_word: ἀφελόμενος
  choice: tendo removido
  rationale: Preserva o valor participial e o sentido de retirar, sem acrescentar um objeto ausente no fragmento.
- source_word: προγονικήν
  choice: o que era ancestral
  rationale: Como o substantivo qualificado pelo adjetivo não foi preservado no texto fornecido, a substantivação neutra em português mantém a frase compreensível sem reconstruir se eram leis, costumes, honra ou outra realidade ancestral.
