  yaml_path: translation/deuterocanon/2_maccabees/014/029.yaml
  text: But since it was not possible to oppose the king[a], he kept watching for an opportunity to accomplish it by a stratagem.
translation:
  language: pt
  text: Mas, como não era possível agir contra o rei, ele ficava à procura de uma oportunidade para realizar isso por meio de um estratagema.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego deixa implícito o objeto de «realizar». Com uma explicitação interpretativa baseada no contexto, também se pode traduzir: «para levar a cabo seu intento por meio de um estratagema».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ δὲ
  choice: Mas, como
  rationale: Conserva a transição e a relação causal, com a leve nuance adversativa de δέ.
- source_word: τῷ βασιλεῖ ἀντιπρᾶξαι
  choice: agir contra o rei
  rationale: Expressa diretamente a ação de oposição indicada pelo verbo e pelo dativo, sem acrescentar a ideia não explícita de agir «abertamente».
- source_word: οὐκ ἦν
  choice: não era possível
  rationale: Mantém o caráter impessoal da construção grega e seu sentido de impossibilidade.
- source_word: εὔκαιρον
  choice: uma ocasião oportuna
  rationale: O adjetivo substantivado designa um momento ou uma oportunidade favorável; esta formulação é natural e preserva esse valor temporal.
- source_word: ἐτήρει
  choice: ficava à espera de
  rationale: A forma no imperfeito indica uma atitude contínua; a expressão portuguesa comunica essa duração e a busca vigilante pela ocasião adequada.
- source_word: τοῦ ἐπιτελέσαι
  choice: para realizar isso
  rationale: O infinitivo articular exprime finalidade. «Isso» torna a frase natural em português, mas deixa para a nota a informação de que o objeto permanece implícito no grego.
- source_word: στρατηγήματι
  choice: por meio de um estratagema
  rationale: Preserva a ideia de um expediente calculado ou ardil tático, sem restringi-lo indevidamente ao âmbito militar nem acentuar um juízo moral.
