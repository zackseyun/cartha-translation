base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/022.yaml
  text: Judas stationed armed men[a], ready in strategic places, lest some treachery from the enemies should suddenly arise; and they held the fitting conference.
translation:
  language: pt
  text: Judas posicionou homens armados, de prontidão, em lugares estratégicos, para que não surgisse de repente alguma ação traiçoeira da parte dos inimigos; eles tiveram uma conversa adequada à ocasião.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conversaram entre si de maneira apropriada”. A expressão grega é idiomática e indica uma conversa ou consulta mútua adequada à ocasião.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέταξεν
  choice: posicionou
  rationale: No contexto militar, o verbo descreve a disposição de homens em determinados pontos, não apenas a emissão de uma ordem.
- source_word: ἐνόπλους ἑτοίμους
  choice: homens armados, de prontidão
  rationale: Mantém a referência genérica a pessoas armadas e expressa claramente que estavam preparadas para agir.
- source_word: ἐν τοῖς ἐπικαίροις τόποις
  choice: em lugares estratégicos
  rationale: No contexto de segurança militar, os lugares são vantajosos ou decisivos; “estratégicos” comunica esse sentido com naturalidade.
- source_word: μή ποτε
  choice: para que não
  rationale: Introduz a finalidade preventiva da medida tomada por Judas.
- source_word: ἐκ τῶν πολεμίων
  choice: da parte dos inimigos
  rationale: Preserva a ideia de origem ou procedência da ameaça sem especificar além do grego.
- source_word: ἐφνιδίως
  choice: de repente
  rationale: Expressa a ocorrência súbita e inesperada indicada pelo advérbio.
- source_word: κακουργία
  choice: ação traiçoeira
  rationale: No cenário diplomático e militar, designa uma ação mal-intencionada ou desleal; a formulação evita reduzir o termo a uma traição já definida.
- source_word: γένηται
  choice: surgisse
  rationale: Com “ação traiçoeira” como sujeito, traduz naturalmente a ideia de algo vir a acontecer.
- source_word: τὴν ἁρμόζουσαν ἐποίησαν κοινολογίαν
  choice: eles tiveram a conversa apropriada
  rationale: A expressão idiomática se refere a uma conversa ou consulta mútua adequada à ocasião. O pronome explicita com naturalidade o sujeito plural implícito, sem identificar os participantes além do contexto.
