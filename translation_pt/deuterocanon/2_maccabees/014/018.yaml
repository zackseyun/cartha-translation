base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/018.yaml
  text: Yet when Nicanor heard of the valor that those around Judas had[a], and of their courage in the struggles for their fatherland, he was reluctant to settle the matter by bloodshed.
translation:
  language: pt
  text: No entanto, quando Nicanor ouviu falar da bravura dos que estavam com Judas e da coragem deles nas lutas pela pátria, hesitou em resolver a questão por meio de derramamento de sangue.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “decidir a questão pelo sangue” ou “executar o julgamento por meio de derramamento de sangue”. A expressão grega é idiomática e admite uma tradução mais formal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως δὲ
  choice: No entanto
  rationale: Marca a transição concessiva em relação ao contexto anterior, em linguagem natural e digna.
- source_word: ἀκούων
  choice: quando ... ouviu falar
  rationale: Expressa o particípio como circunstância temporal e preserva a ideia de que Nicanor recebeu notícias sobre o grupo de Judas.
- source_word: ἀνδραγαθίαν
  choice: bravura
  rationale: Comunica excelência corajosa, especialmente em contexto de combate, sem reproduzir de modo artificial a etimologia masculina do termo grego.
- source_word: οἱ περὶ τὸν Ἰούδαν
  choice: os que estavam com Judas
  rationale: Traduz com clareza o idioma grego que designa o grupo ligado a Judas, sem restringi-lo explicitamente a soldados ou companheiros.
- source_word: ἐν τοῖς περὶ τῆς πατρίδος ἀγῶσιν
  choice: nas lutas pela pátria
  rationale: Mantém a amplitude de ἀγῶσιν como lutas ou combates e conserva o tom patriótico de πατρίς.
- source_word: εὐψυχίαν
  choice: coragem
  rationale: Equivalente corrente para a firmeza de ânimo e ousadia indicadas pelo termo no contexto.
- source_word: ὑπευλαβεῖτο
  choice: hesitou
  rationale: Expressa a cautela e relutância de Nicanor sem afirmar que sua reação foi necessariamente medo.
- source_word: τὴν κρίσιν διʼ αἵματος ποιήσασθαι
  choice: resolver a questão por meio de derramamento de sangue
  rationale: Verte o idioma grego em português natural, preservando tanto a ideia de decidir ou solucionar a questão quanto o meio violento indicado por διʼ αἵματος.
