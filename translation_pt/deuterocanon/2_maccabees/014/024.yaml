  text: And he kept Judas continually before him[b][a]; he was inwardly drawn to the man.
translation:
  language: pt
  text: E mantinha Judas constantemente diante de si[a]; estava interiormente inclinado em favor daquele homem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mantinha Judas sempre em sua presença”. A expressão grega pode indicar tanto que Judas era mantido fisicamente por perto como que permanecia constantemente sob sua atenção.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “havia se afeiçoado profundamente àquele homem” ou “sentia profunda afeição por aquele homem”. O advérbio e o verbo gregos expressam uma disposição interior e duradoura de favor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶχεν ... ἐν προσώπῳ
  choice: mantinha ... diante de si
  rationale: Preserva a imagem concreta de estar diante do rosto ou na presença de alguém e, ao mesmo tempo, permite a ideia de manter Judas por perto ou sob atenção constante.
- source_word: διὰ παντός
  choice: constantemente
  rationale: Expressa a continuidade indicada pela locução grega de modo natural no registro narrativo.
- source_word: ψυχικῶς
  choice: no íntimo
  rationale: O advérbio raro, derivado de ψυχή, descreve uma disposição interior. “No íntimo” conserva essa dimensão sem recorrer à formulação pouco natural “na alma” nem transformar o termo em mero intensificador.
- source_word: προσεκέκλιτο
  choice: sentia-se inclinado para
  rationale: A forma verbal apresenta uma disposição já estabelecida de aproximação, favor ou afeição. A tradução mantém essa amplitude sem defini-la necessariamente como aliança formal ou profunda amizade.
- source_word: τῷ ἀνδρί
  choice: aquele homem
  rationale: Reproduz a referência nominal explícita a Judas e conserva sua leve ênfase, em vez de reduzi-la simplesmente ao pronome “ele”.
