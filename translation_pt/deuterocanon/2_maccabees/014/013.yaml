lexical_decisions:
- source_word: Ἰούδᾳ
  choice: para Judá
  rationale: Mantém a referência geográfica adotada pelo contexto e pela camada inglesa auditada, sem ampliar o fragmento grego fornecido.
- source_word: ἐπανελέσθαι
  choice: matar
  rationale: O infinitivo de ἐπαναιρέω, neste contexto hostil, significa eliminar ou matar, e não meramente capturar.
- source_word: σκορπίσαι
  choice: dispersar
  rationale: Expressa diretamente a ação de espalhar e desfazer o grupo que acompanhava Judas.
- source_word: καταστῆσαι
  choice: nomear
  rationale: No contexto de atribuição de um cargo, indica constituir ou instalar alguém oficialmente.
- source_word: τοῦ μεγίστου ἱεροῦ
  choice: do grandioso templo
  rationale: Preserva o superlativo grego e a referência ao santuário/complexo do templo em linguagem natural.
