base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/031.yaml
  text: But when the other man realized that he had been outmaneuvered by the man’s boldness[a], he came to the greatest and holy temple, while the priests were offering the customary sacrifices, and ordered them to hand over the man.
translation:
  language: pt
  text: Mas o outro, percebendo que aquele homem o havia derrotado com bravura e habilidade estratégica[a], foi ao maior e santo templo[b], enquanto os sacerdotes ofereciam os sacrifícios prescritos, e ordenou que lhe entregassem aquele homem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nobremente” ou “valorosamente”. O advérbio grego descreve o modo como aquele homem o superou em estratégia.
    reason: lexical_alternative
  - marker: b
    text: Ou “ao grandioso e santo templo”. O grego emprega o superlativo, literalmente “maior”, que aqui também pode funcionar como uma descrição exaltada do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συγνοὺς
  choice: percebendo
  rationale: O particípio aoristo indica a percepção que antecede a ação principal; “percebendo” preserva a sequência narrativa com naturalidade.
- source_word: ὁ ἕτερος
  choice: o outro
  rationale: Retoma a outra figura do confronto já identificada pelo contexto, sem acrescentar um nome ausente do grego.
- source_word: γενναίως
  choice: corajosamente
  rationale: O advérbio expressa ação nobre, valorosa ou corajosa. “Corajosamente” conserva melhor essa nuance do que “habilmente”, que reduziria o termo à perícia estratégica.
- source_word: ἐστρατήγηται
  choice: havia sido ... superado em estratégia
  rationale: O perfeito passivo comunica um revés já consumado e ainda reconhecido naquele momento; a formulação mantém a nuance militar e estratégica do verbo.
- source_word: παραγενόμενος
  choice: foi
  rationale: O particípio narrativo descreve a chegada ao templo; “foi” é corrente e claro em português.
- source_word: ἐπὶ τὸ μέγιστον καὶ ἅγιον ἱερόν
  choice: ao maior e santo templo
  rationale: “Maior” conserva o superlativo μέγιστον, e “templo” traduz naturalmente ἱερόν neste contexto, podendo abranger o complexo do templo.
- source_word: τὰς καθηκούσας θυσίας
  choice: os sacrifícios prescritos
  rationale: καθηκούσας designa o que é devido, apropriado ou estabelecido; “prescritos” comunica que se tratava das ofertas requeridas.
- source_word: προσαγόντων
  choice: ofereciam
  rationale: No contexto sacrificial, “oferecer” é o equivalente português mais natural.
- source_word: ἐκέλευσεν παραδοῦναι
  choice: ordenou que lhe entregassem
  rationale: A expressão indica uma ordem autoritativa para entregar alguém à custódia do mandante; o pronome “lhe” explicita naturalmente o destinatário implícito.
- source_word: τὸν ἄνδρα
  choice: aquele homem
  rationale: Mantém a referência explícita ao indivíduo procurado e reproduz a repetição enfática de ἀνήρ no versículo.
theological_decisions:
- issue: Alcance de ἱερόν na referência ao santuário de Jerusalém
  choice: templo
  alternative: santuário; complexo do templo
  rationale: ἱερόν pode designar o recinto sagrado de modo amplo. “Templo” é a forma mais natural e reconhecível em português, sem restringir necessariamente a referência ao edifício interior.
- issue: Força de γενναίως na derrota estratégica
  choice: corajosamente
  alternative: nobremente; valorosamente; habilmente
  rationale: O grego associa ao verbo um advérbio de valor ou nobreza, mas não especifica com precisão como essa qualidade se manifestou. A tradução conserva essa tensão, e a nota registra alternativas legítimas sem transformar a coragem em uma explicação doutrinária ou psicológica.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com sintaxe narrativa fluente. Conserva-se a linguagem estratégica do original e o superlativo aplicado ao templo, enquanto notas breves registram alternativas lexicais genuínas.
