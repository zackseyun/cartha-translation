  text: For as long as Judas remains[a], it is impossible for affairs to attain peace.
translation:
  language: pt
  text: Pois, enquanto Judas permanecer[a], será impossível que a situação alcance a paz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras iniciais no testemunho grego preservado são textualmente difíceis; o sentido da oração é que a permanência de Judas torna impossível a paz.
    reason: textual_variant
lexical_decisions:
- source_word: ἰσχρὰ
  choice: enquanto
  rationale: A forma transmitida é textualmente difícil, mas, em conjunto com περιὼν e no contexto, introduz o período durante o qual a permanência de Judas impede a paz. “Enquanto” expressa essa força temporal sem reconstruir em excesso o texto problemático.
- source_word: Ἰούδας
  choice: Judas
  rationale: Forma tradicional e amplamente reconhecida do nome pessoal em português.
- source_word: περιὼν
  choice: permanecer
  rationale: O particípio de περίειμι pode indicar continuar vivo ou presente. “Permanecer” conserva essa amplitude e comunica a continuidade de Judas como fator político.
- source_word: ἀδύνατον
  choice: será impossível
  rationale: Predicado impessoal que, em português, pede uma construção explícita. O futuro harmoniza naturalmente com a oração temporal, sem alterar a impossibilidade afirmada.
- source_word: εἰρήνης
  choice: a paz
  rationale: Equivalente comum e suficientemente amplo; evita restringir o sentido a um tratado formal.
- source_word: τυχεῖν
  choice: alcance
  rationale: Com o genitivo εἰρήνης, exprime chegar a obter ou atingir a paz. “Alcançar a paz” é idiomático em português.
- source_word: τὰ πράγματα
  choice: a situação
  rationale: No contexto, designa o conjunto das circunstâncias ou dos assuntos públicos. “A situação” é natural e preserva a referência política geral.
