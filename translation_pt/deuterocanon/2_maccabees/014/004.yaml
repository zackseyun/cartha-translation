  text: he came to King Demetrius in the one hundred fifty-first year, bringing him a gold crown and a palm branch, and besides these the customary offerings from the temple foliage; and on that day he kept quiet.
translation:
  language: pt
  text: Ele foi ao rei Demétrio no ano cento e cinquenta e um, levando-lhe uma coroa de ouro, um ramo de palmeira e, além destes, os ramos do templo que eram apresentados conforme o costume.[a] Naquele dia, ele permaneceu quieto.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as coisas costumeiramente apresentadas, isto é, ramos do templo”. A frase grega é condensada e um tanto elíptica.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “teve/manteve quietude”. A expressão pode indicar que ele se absteve de agir ou de apresentar sua acusação naquele dia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν πρὸς τὸν βασιλέα Δημήτριον
  choice: Ele foi ao rei Demétrio
  rationale: O aoristo de ἔρχομαι com πρός e acusativo expressa deslocamento em direção ao rei. Em português narrativo, «foi ao rei» é natural sem pressupor o ponto de vista espacial de quem narra.
- source_word: ὡς πρώτῳ καὶ ἑκατοστῷ καὶ πεντηκοστῷ ἔτει
  choice: no ano cento e cinquenta e um
  rationale: Trata-se de uma fórmula cronológica. O valor aproximativo possível de ὡς não precisa ser explicitado neste contexto.
- source_word: προσάγων αὐτῷ στέφανον χρυσοῦν
  choice: levando-lhe uma coroa de ouro
  rationale: O particípio indica o que ele levava ao aproximar-se. «Coroa de ouro» comunica com clareza o presente de corte.
- source_word: φοίνικα
  choice: um ramo de palmeira
  rationale: No contexto cerimonial, φοῖνιξ designa um ramo de palmeira, não a árvore inteira.
- source_word: πρὸς δὲ τούτοις τοῖς νομιζομένοις θαλλῶν τοῦ ἱεροῦ
  choice: e, além disso, os ramos do templo que costumavam ser apresentados
  rationale: A expressão grega é comprimida e elíptica. A tradução conserva a ligação dos ramos com o templo e explicita com naturalidade a ideia de prática costumeira, sem transformá-la em prescrição formal.
- source_word: καὶ τὴν ἡμέραν ἐκείνην ἡσυχίαν ἔσχεν
  choice: Naquele dia, porém, ele não tomou nenhuma outra iniciativa
  rationale: A locução idiomática significa permanecer quieto ou abster-se de agir. No contexto, a formulação indica que ele não avançou sua ação naquele dia, evitando a impressão de mero silêncio verbal.
