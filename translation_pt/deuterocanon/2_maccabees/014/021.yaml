  yaml_path: translation/deuterocanon/2_maccabees/014/021.yaml
  text: So they set a day on which they would come together privately; and from each side a sedan chair was brought forward[a], and seats were set out.
translation:
  language: pt
  text: Assim, marcaram um dia para se encontrarem em particular; cada lado trouxe uma liteira[a], e dispuseram assentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego δίφραξ é raro neste trecho e pode indicar uma liteira, uma cadeira portátil ou um assento semelhante; sua forma exata é incerta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτάξαντο ἡμέραν
  choice: marcaram um dia
  rationale: O médio de τάσσω indica que as partes combinaram ou fixaram a ocasião; “marcaram um dia” é natural em português e mantém o caráter indefinido de ἡμέραν.
- source_word: κατʼ ἰδίαν
  choice: em particular
  rationale: Expressa uma reunião reservada, afastada do público, em registro atual e digno.
- source_word: ἥξουσιν εἰς τὸ αὐτό
  choice: se encontrariam
  rationale: A expressão significa literalmente chegar ao mesmo lugar; no contexto, o sentido idiomático é reunir-se. O futuro grego é vertido pelo futuro do pretérito, conforme a subordinação ao verbo passado.
- source_word: παρʼ ἑκάστου
  choice: de cada lado
  rationale: No encontro entre duas partes, ἕκαστος aponta naturalmente para cada uma delas, não para cada indivíduo presente.
- source_word: δίφραξ
  choice: liteira
  rationale: O termo raro parece designar um assento portátil ou veículo carregado. “Liteira” preserva essa imagem sem sugerir indevidamente um carro de guerra; a incerteza exata é registrada em nota.
- source_word: ἔθεσαν δίφρους
  choice: dispuseram assentos
  rationale: δίφρος pode designar banco, cadeira ou assento. “Assentos” evita precisão material não garantida, e “dispuseram” comunica a preparação do local.
