lexical_decisions:
- source_word: τῶν δὲ μεθʼ ὅρκων φασκόντων
  choice: Mas, quando juraram
  rationale: O genitivo absoluto introduz uma circunstância, e μεθʼ ὅρκων caracteriza a afirmação como feita mediante juramentos. Em português corrente, «quando juraram» comunica de modo compacto tanto a alegação quanto sua confirmação solene.
- source_word: μὴ γινώσκειν
  choice: que não sabiam
  rationale: O infinitivo apresenta o conteúdo da afirmação. A oração finita com «que» é a forma mais natural de discurso indireto em português.
- source_word: ποῦ ποτʼ ἐστίν
  choice: onde estava
  rationale: Embora o grego empregue o presente «está», a concordância temporal no discurso indireto português favorece «estava» depois da moldura narrativa no passado. A partícula ποτʼ acrescenta uma nuance indefinida ou enfática, mas não exige uma expressão como «afinal» no texto principal.
- source_word: ὁ ζητούμενος
  choice: o homem procurado
  rationale: O particípio passivo substantivado significa literalmente «aquele que está sendo procurado». O contexto deixa claro que se trata de uma pessoa; «o homem procurado» é natural e conserva o sentido passivo sem a carga policial moderna de «foragido».
