    issue: Relação sintática e modal das orações finais
    rationale: «Com a possibilidade de ... pois» transforma εἰ ἀθετήσει ... μηδὲν ... ἠδικηκότος numa possibilidade nominal seguida de causa. «A ideia de anular ... embora» conserva melhor a eventualidade considerada e o contraste de que o homem não cometera injustiça.
  - severity: low
