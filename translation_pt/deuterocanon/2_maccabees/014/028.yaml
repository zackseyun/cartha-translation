revisions:
- from: Quando, porém, esses homens se prostraram diante de Nicanor[a], ele ficou confuso e muito contrariado com a possibilidade de anular os termos já estabelecidos[b], pois aquele homem não havia cometido injustiça alguma.
  to: Quando, porém, esses homens se prostraram diante de Nikanor[a], ele ficou confuso e levou muito a mal a ideia de anular os termos já estabelecidos[b], embora aquele homem não tivesse cometido injustiça alguma.
  rationale: A revisão mantém a imagem física de προσπίπτω, distingue a confusão de συνεκέχυτο da reação desfavorável expressa por δυσφόρως ἔφερεν, preserva o caráter ainda considerado de εἰ ἀθετήσει e evita impor uma causalidade não explicitada pela formulação grega. Também alinha a grafia do nome à política de transliteração do projeto.
