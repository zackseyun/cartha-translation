base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/028.yaml
  text: But when these men fell before Nikanor[a], he was thrown into confusion and took it badly that he should set aside the agreed terms[b], though the man had done no wrong.
translation:
  language: pt
  text: Quando, porém, esses homens se prostraram diante de Nikanor[a], ele ficou confuso e levou muito a mal a ideia de anular os termos já estabelecidos[b], embora aquele homem não tivesse cometido injustiça alguma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “caíram aos pés de Nikanor”, em atitude de súplica.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “as disposições já tomadas” ou “o acordo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσπεσόντων
  choice: se prostraram diante de
  rationale: O particípio de προσπίπτω retrata um gesto físico de lançar-se ou cair diante de alguém, frequentemente como súplica. A formulação mantém a imagem corporal e comunica naturalmente a atitude dos homens.
- source_word: συνεκέχυτο
  choice: ficou confuso
  rationale: O verbo expressa desorientação ou perturbação interior. “Ficou confuso” preserva esse sentido sem reduzi-lo apenas a tristeza ou irritação.
- source_word: δυσφόρως ἔφερεν
  choice: muito contrariado
  rationale: A expressão idiomática indica suportar algo com dificuldade, desgosto ou forte incômodo. “Muito contrariado” é claro em português atual e conserva a intensidade emocional.
- source_word: τὰ διεσταλμένα
  choice: os termos já estabelecidos
  rationale: O particípio perfeito substantivado aponta para disposições ou condições previamente definidas. A escolha se ajusta ao contexto de um acordo, sem determinar de modo excessivamente específico sua forma.
- source_word: ἀθετήσει
  choice: anular
  rationale: O verbo pode significar rejeitar, invalidar ou deixar sem efeito. “Anular” preserva a força de desfazer o que havia sido estabelecido.
- source_word: μηδὲν τἀνδρὸς ἠδικηκότος
  choice: pois aquele homem não havia cometido injustiça alguma
  rationale: O genitivo absoluto afirma que o homem não praticara injustiça. A tradução mantém o alcance moral e jurídico da expressão sem ampliar a afirmação para além da situação imediata.
- source_word: Νικάνορι
  choice: Nicanor
  rationale: Forma portuguesa direta e reconhecível do nome grego Νικάνωρ, adequada à leitura corrente em português.
theological_decisions:
- issue: Alcance da afirmação μηδὲν τἀνδρὸς ἠδικηκότος
  choice: A frase declara que aquele homem não havia cometido injustiça alguma na situação em questão.
  alternative: “Aquele homem não havia prejudicado ninguém.”
  rationale: A tradução conserva a afirmação moral-jurídica do texto, mas não a transforma numa declaração abrangente sobre toda a vida ou o caráter do homem.
translation_notes:
  register: Português moderno, digno e de leitura fluente, com vocabulário acessível. A construção “com a possibilidade de” preserva o caráter eventual de εἰ sem produzir uma oração condicional pouco natural em português.
