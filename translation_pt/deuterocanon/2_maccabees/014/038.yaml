base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/038.yaml
  text: For in earlier times[a], when separation was being judged, he had come under accusation for Judaism[b], and had risked both body and soul for Judaism with all earnestness.
translation:
  language: pt
  text: Pois, em tempos anteriores[a], quando a separação estava sendo julgada, ele havia sido acusado por causa do judaísmo[b] e, com toda a dedicação, havia arriscado corpo e alma em defesa do judaísmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando estava sendo julgado um caso relativo à separação ou à recusa de associação”. A expressão grega é condensada e provavelmente se refere a um contexto judicial.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “judaísmo” não indica apenas uma religião abstrata, mas também a identidade ancestral e o modo de vida judaicos mantidos sob pressão.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τοῖς ἔμπροσθεν χρόνοις
  choice: em tempos anteriores
  rationale: Reproduz com naturalidade o sentido retrospectivo da expressão grega, sem recorrer a linguagem arcaica.
- source_word: τῆς ἀμιξίας
  choice: a separação
  rationale: ἀμιξία designa a condição de não se misturar ou de evitar associação. “Separação” mantém a amplitude social e cultural do termo; a formulação incomum é esclarecida em nota.
- source_word: κρίσις
  choice: estava sendo julgada
  rationale: O substantivo aponta para julgamento ou processo judicial. A forma verbal torna a construção comprimida compreensível em português sem eliminar sua ambiguidade.
- source_word: εἰσενηνεγμένος
  choice: havia sido acusado
  rationale: 'O particípio perfeito de εἰσφέρω assume aqui provável sentido forense: alguém contra quem foi apresentada uma acusação. “Havia sido acusado” comunica esse valor em português corrente.'
- source_word: Ἰουδαισμοῦ
  choice: por causa do judaísmo
  rationale: O genitivo indica o fundamento ou conteúdo da acusação. “Judaísmo” conserva o termo grego e não o restringe somente a religião, etnia ou cultura.
- source_word: σῶμα καὶ ψυχὴν
  choice: corpo e alma
  rationale: Mantém o par antropológico enfático do grego e expressa a totalidade da pessoa posta em perigo.
- source_word: ὑπὲρ τοῦ Ἰουδαισμοῦ
  choice: em defesa do judaísmo
  rationale: Neste contexto, ὑπέρ indica dedicação e exposição ao perigo em favor de uma causa. “Em defesa de” explicita essa relação sem ampliar indevidamente o texto.
- source_word: παραβεβλημένος
  choice: havia arriscado
  rationale: O verbo comunica a ideia de expor algo ao perigo. “Arriscado” é claro e idiomático com “corpo e alma”.
- source_word: μετὰ πάσης ἐκτενίας
  choice: com toda a dedicação
  rationale: A expressão indica intensidade, empenho pleno ou fervor. “Com toda a dedicação” é natural, digna e evita sugerir uma emoção mais específica do que o grego exige.
theological_decisions:
- issue: Sentido histórico de Ἰουδαϊσμός no período do Segundo Templo
  choice: judaísmo
  alternative: modo de vida judaico
  rationale: O cognato português preserva a designação grega e sua abrangência histórica, que inclui identidade ancestral, práticas e fidelidade religiosa, sem reduzi-la a uma única dimensão.
- issue: Valor de ψυχή no par σῶμα καὶ ψυχήν
  choice: alma
  alternative: vida
  rationale: “Corpo e alma” preserva a formulação explícita do original e sua força totalizante, sem decidir se ψυχή deve ser entendida aqui estritamente como vida ou como dimensão imaterial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe judicial incomum do grego foi mantida no texto e esclarecida em nota; a repetição de “judaísmo” foi preservada por sua função enfática.
