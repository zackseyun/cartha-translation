base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/043.yaml
  text: But since he had not succeeded in the blow because of the urgency of the struggle[a], and the crowds were rushing in within the gates[b], he ran up bravely onto the wall and hurled himself manfully down into the crowds.
translation:
  language: pt
  text: Mas, como não conseguiu atingir seu objetivo com o golpe, por causa da urgência da luta[a], e as multidões irrompiam para dentro pelos portões, ele correu corajosamente para o alto da muralha e se lançou com coragem viril[b] sobre as multidões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como não conseguiu realizar seu propósito com o golpe”. O grego indica que o primeiro golpe autoinfligido não produziu o resultado pretendido.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “de modo viril” ou “como homem”; o termo grego descreve a ousadia por meio de uma expressão especificamente masculina.
    reason: source_nuance
lexical_decisions:
- source_word: τῇ δὲ πληγῇ μὴ κατευκτήσας
  choice: como o golpe não alcançou seu objetivo
  rationale: A construção indica que o golpe autoinfligido não produziu o resultado pretendido. Esta formulação preserva o golpe como sujeito sem sugerir apenas uma ferida.
- source_word: διὰ τὴν τοῦ ἀγῶνος σπουδήν
  choice: por causa da urgência da luta
  rationale: ἀγών designa aqui o confronto violento, e σπουδή, a pressão ou urgência do momento.
- source_word: τῶν ὄχλων
  choice: as multidões
  rationale: Mantém o plural e evita especificar além do grego que se tratava de uma turba, embora o contexto seja hostil.
- source_word: ἔσω τῶν θυρωμάτων εἰσβαλλόντων
  choice: já invadiam o recinto pelos portões
  rationale: Expressa a entrada para dentro dos acessos; 'invadiam' comunica o movimento impetuoso no contexto, e 'o recinto' torna natural a direção interior indicada por ἔσω.
- source_word: ἀναδραμὼν γενναίως ἐπὶ τὸ τεῖχος
  choice: correu corajosamente para o alto da muralha
  rationale: Preserva o movimento rápido para cima, o valor expresso por γενναίως e o sentido fortificado de τεῖχος.
- source_word: ἀπεκρήμνισεν ἑαυτὸν
  choice: se lançou dali ... sobre as multidões
  rationale: O verbo descreve lançar-se de uma altura; 'dali' deixa clara a descida desde a muralha sem inserir 'de cabeça', que não está expresso.
- source_word: ἀνδρωδῶς
  choice: com coragem viril
  rationale: Preserva a nuance explicitamente masculina do advérbio grego, de modo mais claro e atual em português do que 'varonilmente'.
theological_decisions:
- issue: Nuance masculina de ἀνδρωδῶς
  choice: com coragem viril
  alternative: corajosamente
  rationale: A tradução conserva a caracterização masculina da valentia presente no grego sem transformá-la em afirmação doutrinária.
- issue: Resultado pretendido do golpe autoinfligido
  choice: não alcançou seu objetivo
  alternative: não foi bem-sucedido com o golpe
  rationale: O contexto indica que o golpe falhou em produzir o resultado pretendido, mas a tradução não explicita esse resultado além do que o versículo afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. 'Muralha' explicita o caráter defensivo de τεῖχος; 'coragem viril' retém a nuance de gênero do original. Os marcadores [a] e [b] aparecem no texto e correspondem às notas.
