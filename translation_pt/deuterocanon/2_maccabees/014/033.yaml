base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/033.yaml
  text: 'Stretching out his right hand toward the temple[a], he swore this: “If you do not hand Judas over to me as a prisoner, I will make this sanctuary of God a plain, tear down the altar, and raise up here a splendid temple to Dionysus.”'
translation:
  language: pt
  text: 'Estendendo a mão direita em direção ao templo, ele jurou: “Se vocês não me entregarem Judas como prisioneiro, transformarei este santuário de Deus numa planície[a], arrasarei o altar e erguerei aqui um templo magnífico para Dioniso.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “farei deste santuário de Deus um campo aberto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προτείνας τὴν δεξιὰν
  choice: Estendendo a mão direita
  rationale: Reproduz de modo natural o gesto físico que acompanha o juramento; o possessivo é dispensável em português.
- source_word: ἐπὶ τὸν νεών
  choice: em direção ao templo
  rationale: Com o verbo de gesto, ἐπί tem sentido direcional; “templo” designa aqui o edifício sagrado.
- source_word: ὤμοσεν ταῦτα
  choice: ele jurou
  rationale: Expressão concisa e idiomática; o conteúdo do juramento vem imediatamente depois.
- source_word: δέσμιον μοι τὸν Ἰούδαν παραδῶτε
  choice: me entregarem Judas como prisioneiro
  rationale: Preserva a força predicativa de δέσμιον sem pressupor correntes literais e traduz παραδίδωμι como transferência hostil de custódia.
- source_word: τόνδε τὸν τοῦ θεοῦ σηκόν
  choice: este santuário de Deus
  rationale: “Santuário” distingue σηκός do νεώς anterior e comunica a estrutura sagrada de modo claro.
- source_word: εἰς πεδίον ποιήσω
  choice: transformarei ... numa planície
  rationale: 'Mantém a imagem concreta do grego: reduzir o santuário a terreno aberto, sem substituí-la apenas por uma paráfrase como “destruirei”.'
- source_word: τὸ θυσιαστήριον κατασκάψω
  choice: arrasarei o altar
  rationale: κατασκάπτω expressa demolição completa; “arrasar” é natural no contexto de uma ameaça contra uma construção.
- source_word: ἱερὸν ... τῷ Διονύσῳ
  choice: um templo ... para Dioniso
  rationale: “Templo” é o equivalente direto e claro para o edifício cultual dedicado a Dioniso.
- source_word: ἐπιφανές
  choice: magnífico
  rationale: Expressa o caráter notável, imponente ou esplêndido do templo proposto.
theological_decisions:
- issue: Distinção entre os termos gregos para espaços sagrados
  choice: Traduzir νεώς como “templo”, σηκός como “santuário” e ἱερόν como “templo”.
  alternative: Uniformizar todos os termos como “templo”.
  rationale: A diferenciação preserva parte da variedade lexical e retórica do grego sem criar distinções técnicas excessivas; a repetição de “templo” para νεώς e ἱερόν continua natural porque os referentes são diferentes.
- issue: Imagem da destruição do santuário
  choice: “transformarei este santuário de Deus numa planície”
  alternative: “reduzirei este santuário de Deus ao chão”
  rationale: A formulação escolhida conserva a imagem explícita de πεδίον e a violência da ameaça, sem resolver a metáfora em uma simples afirmação de demolição.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe acessível e uso de “vocês” adequado à legibilidade brasileira e amplamente compreensível. “Dioniso” segue a forma portuguesa corrente do nome grego.
