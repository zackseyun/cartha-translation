translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A coordenação foi suavizada com “além disso”, e a nuance depreciativa de ἀγελαίους foi preservada em nota para evitar uma formulação pouco idiomática no texto principal.
