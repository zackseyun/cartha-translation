  yaml_path: translation/deuterocanon/2_maccabees/014/023.yaml
  text: Nicanor stayed on in Jerusalem and did nothing out of place[a]; and he dismissed the gathered crowds.
translation:
  language: pt
  text: Nicanor permaneceu em Jerusalém, não fez nada indevido e dispersou as multidões[a] que se haviam reunido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as turbas reunidas”; mais literalmente, “as multidões semelhantes a um rebanho”. O adjetivo grego tem sentido depreciativo e descreve pessoas agindo como uma massa desordeira.
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβεν
  choice: permaneceu
  rationale: O imperfeito expressa permanência continuada por certo período; “permaneceu” é natural e preserva esse valor durativo sem acrescentar detalhes.
- source_word: ἔπραττεν οὐδὲν ἄτοπον
  choice: não fez nada indevido
  rationale: ἄτοπος pode significar impróprio, estranho ou fora de lugar. “Nada indevido” comunica, neste contexto narrativo e político, ausência de conduta imprópria sem restringir excessivamente o sentido.
- source_word: συναχθέντας
  choice: que haviam se reunido
  rationale: A oração relativa explicita com naturalidade o particípio passivo e indica que as multidões já estavam reunidas antes de serem dispersadas.
- source_word: ἀγελαίους
  choice: multidões (com nota sobre o sentido depreciativo)
  rationale: O adjetivo evoca pessoas agrupadas como rebanho e tem força depreciativa. Uma tradução literal seria pouco natural; a nota preserva essa nuance sem tornar o texto principal artificial.
- source_word: ὄχλους
  choice: multidões
  rationale: Equivalente corrente de ὄχλοι, adequado para um grande agrupamento de pessoas.
- source_word: ἀπέλυσεν
  choice: dispersou
  rationale: No contexto, o verbo se refere a mandar embora ou desfazer o agrupamento, não a libertar prisioneiros; “dispersou” expressa isso de modo claro.
