  text: For he thought that by arresting him he would bring disaster on these people[a].
translation:
  language: pt
  text: Pois ele pensou que, prendendo aquele homem, causaria uma desgraça a essas pessoas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Pois pareceu-lhe que, prendendo aquele homem, causaria uma calamidade a estes homens.”'
    reason: Preserva como alternativa a construção mais formal de ἔδοξεν e os valores mais literais de τούτοις e συμφοράν.
lexical_decisions:
- source_word: ἔδοξεν
  choice: pensou
  rationale: No contexto, o verbo expressa a avaliação ou conclusão do sujeito. “Pensou” é natural em português e se ajusta à construção com o infinitivo que vem em seguida.
- source_word: συλλαβών
  choice: prendendo
  rationale: O particípio indica a captura ou detenção de alguém; “prendendo” comunica claramente essa ideia no contexto narrativo.
- source_word: ἐκεῖνον
  choice: aquele homem
  rationale: O demonstrativo aponta para um indivíduo específico já mencionado. “Aquele homem” preserva sua força demonstrativa melhor do que um simples pronome.
- source_word: τούτοις
  choice: a essas pessoas
  rationale: O dativo designa o grupo que está em vista. “Essas pessoas” é idiomático e evita restringir desnecessariamente o grupo a homens adultos, embora a forma grega seja masculina.
- source_word: ἐνεργάσασθαι
  choice: causaria
  rationale: O infinitivo médio tem aqui o sentido de produzir ou provocar algo. “Causaria” conserva de modo conciso a força causativa.
- source_word: συμφοράν
  choice: uma desgraça
  rationale: O substantivo denota calamidade, infortúnio ou dano grave. “Uma desgraça” é corrente, clara e mantém a gravidade da expressão.
