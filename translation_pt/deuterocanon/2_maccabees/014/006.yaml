lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: Em resposta
  rationale: Expressa de modo natural a função discursiva da locução grega, que introduz uma resposta ao que acaba de ser dito.
- source_word: ἔφη
  choice: ele disse
  rationale: Equivalente narrativo direto e sóbrio, sem acrescentar intensidade ausente do grego.
- source_word: Οἱ λεγόμενοι
  choice: Aqueles ... que são chamados
  rationale: Mantém no texto principal o sentido potencialmente neutro de λεγόμενοι; a possível nuance distanciadora ou depreciativa é registrada em nota.
- source_word: Ἀσιδαῖοι
  choice: assideus
  rationale: Emprega a forma portuguesa tradicional do nome de uma facção judaica histórica, evitando traduzi-lo interpretativamente como “os piedosos”.
- source_word: ὧν ἀφηγεῖται
  choice: liderados por
  rationale: Reproduz com naturalidade a ideia de Judas estar à frente do grupo, sem transformar a construção em uma afirmação mais forte sobre cargo ou autoridade formal.
- source_word: Ἰούδας ὁ Μακκαβαῖος
  choice: Judas Macabeu
  rationale: Usa a forma portuguesa corrente do nome e do epíteto histórico.
- source_word: πολεμοτροφοῦσιν
  choice: continuam alimentando a guerra
  rationale: Preserva a imagem vívida do verbo composto, que apresenta a guerra como algo nutrido ou mantido, e comunica a ação persistente no contexto.
- source_word: στασιάζουσιν
  choice: provocando revoltas
  rationale: Comunica em linguagem corrente a promoção ativa de sedição, conflito faccioso ou rebelião civil.
- source_word: οὐκ ἐῶντες
  choice: não permitindo
  rationale: Mantém o particípio sem acrescentar o objeto, pois a frase grega prossegue no versículo seguinte.
theological_decisions:
- issue: Identificação de Ἀσιδαῖοι
  choice: assideus
  alternative: os piedosos
  rationale: O termo funciona aqui como nome de um grupo histórico. A transliteração tradicional evita inserir no texto uma avaliação positiva que o narrador não explicita.
- issue: Nuance de Οἱ λεγόμενοι
  choice: que são chamados
  alternative: os assim chamados
  rationale: A expressão pode ser neutra ou conter certo distanciamento. O texto principal não força a nuance depreciativa, mas a alternativa é preservada em nota.
- issue: Frase incompleta no limite do versículo
  choice: não permitindo
  alternative: fornecer antecipadamente o complemento do versículo seguinte
  rationale: A divisão termina com οὐκ ἐῶντες. Preservar a suspensão evita importar palavras do versículo seguinte e mantém a estrutura da fonte.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível. Conservou-se a metáfora de “alimentar a guerra” e a suspensão sintática no fim do versículo. O marcador [a] foi colocado junto à expressão que efetivamente comenta.
