  text: In reply he said[a], “Those among the Jews who are called Hasideans, whose leader is Judas Maccabaeus, keep feeding war and stirring up rebellion[b], not allowing
translation:
  language: pt
  text: 'Em resposta, ele disse: “Aqueles dentre os judeus que são chamados assideus[a], liderados por Judas Macabeu, continuam alimentando a guerra e provocando revoltas, não permitindo[b]'
