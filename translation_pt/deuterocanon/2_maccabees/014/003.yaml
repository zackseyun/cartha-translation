  yaml_path: translation/deuterocanon/2_maccabees/014/003.yaml
  text: But a certain Alcimus[a], who had formerly become high priest and had willingly defiled himself in the times of separation, realized that in no way was there safety for him, nor any longer access to the holy altar,
translation:
  language: pt
  text: Mas certo Álcimo, que anteriormente havia se tornado sumo sacerdote e havia se contaminado voluntariamente nos tempos da separação[a], percebeu que de modo algum havia segurança para ele, nem mais acesso ao altar santo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos tempos da apostasia”. O grego se refere literalmente aos “tempos da separação” ou da “não mistura”, expressão que pode descrever um período de contaminação e afastamento religioso.'
    reason: Registra a alternativa contextual sem eliminar a ambiguidade lexical do grego.
lexical_decisions:
- source_word: Ἄλκιμος
  choice: Álcimo
  rationale: Emprega a forma portuguesa tradicional do nome grego, com acentuação natural em português.
- source_word: προγεγονὼς ἀρχιερεύς
  choice: que anteriormente havia se tornado sumo sacerdote
  rationale: Preserva a força verbal do particípio, que indica que Álcimo havia alcançado anteriormente essa condição.
- source_word: ἑκουσίως
  choice: voluntariamente
  rationale: Expressa de modo claro que a ação foi intencional, não involuntária.
- source_word: μεμολυσμένος
  choice: havia se contaminado
  rationale: Conserva o sentido reflexivo e a dimensão ritual e moral da contaminação, bem como o resultado persistente sugerido pelo perfeito.
- source_word: ἐν τοῖς τῆς ἀμιξίας χρόνοις
  choice: nos tempos da separação
  rationale: Mantém o sentido mais transparente de ἀμιξία, sem substituir a ambiguidade histórica e religiosa por uma interpretação mais específica.
- source_word: συννοήσας
  choice: percebeu
  rationale: Verbo natural em português para a compreensão da situação por Álcimo.
- source_word: καθʼ ὁντιναοῦν τρόπον
  choice: de modo algum
  rationale: Com a negação, comunica a impossibilidade por qualquer meio.
- source_word: σωτηρία
  choice: segurança
  rationale: Neste contexto, indica preservação ou segurança pessoal em suas circunstâncias, sem exigir o sentido teológico mais específico de salvação.
- source_word: πρὸς τὸ ἅγιον θυσιαστήριον ἔτι πρόσοδος
  choice: nem mais acesso ao altar santo
  rationale: Traduz πρόσοδος como acesso ou possibilidade de aproximação e expressa com naturalidade a perda continuada desse acesso.
theological_decisions:
- issue: Sentido de ἀμιξία neste contexto histórico-religioso
  choice: tempos da separação
  alternative: tempos da apostasia
  rationale: O substantivo denota literalmente separação ou ausência de mistura. Embora 'apostasia' possa explicar o contexto, a tradução principal preserva a expressão menos interpretativa e registra a alternativa em nota.
