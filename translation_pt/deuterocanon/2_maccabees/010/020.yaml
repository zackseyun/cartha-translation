  text: But concerning these matters in detail[b][a], I have instructed both these men and those from me to speak with you.
translation:
  language: pt
  text: Quanto a essas questões, em seus pormenores[a], dei instruções tanto a estes homens como aos que vêm de minha parte[b] para conversarem com vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “parte por parte” ou “especificamente”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os da minha parte”; provavelmente se refere a representantes ou mensageiros de quem escreve.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ δὲ τούτων
  choice: Quanto a essas questões
  rationale: Neste contexto epistolar, ὑπέρ introduz o assunto tratado. “Quanto a” é natural e mantém o contraste expresso por δέ sem recorrer a um “mas” desnecessariamente forte.
- source_word: κατὰ μέρος
  choice: em seus pormenores
  rationale: A expressão indica consideração por partes ou em detalhe. A formulação escolhida é clara em português e preserva a ideia de tratamento minucioso.
- source_word: ἐντέταλμαι
  choice: dei instruções
  rationale: O perfeito de ἐντέλλομαι apresenta instruções já dadas e ainda pertinentes. “Dei instruções” combina precisão com o tom diplomático, sem a força excessiva de “ordenei”.
- source_word: τούτους
  choice: estes homens
  rationale: O demonstrativo aponta para pessoas identificáveis no contexto; “estes homens” é natural e não acrescenta uma função específica.
- source_word: τοὺς παρʼ ἐμοῦ
  choice: os que vêm de minha parte
  rationale: A expressão significa literalmente pessoas “da parte de” quem escreve e pode indicar enviados ou representantes. A tradução conserva essa abertura sem inserir explicitamente “enviados”.
- source_word: διαλεχθῆναι ὑμῖν
  choice: para conversarem com vocês
  rationale: διαλέγομαι pode denotar falar, dialogar ou discutir um assunto. “Conversarem com vocês” mantém o caráter recíproco e soa natural em português moderno.
