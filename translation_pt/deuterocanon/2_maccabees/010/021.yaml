lexical_decisions:
- source_word: ἔρρωσθε
  choice: Saudações
  rationale: Forma convencional de encerramento epistolar, literalmente ligada à ideia de estar bem ou ter saúde; “Saudações” comunica em português atual sua função de despedida sem transformá-la numa exortação à força.
- source_word: ἔτους ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: No ano cento e quarenta e oito
  rationale: Fórmula de datação no genitivo que indica o 148º ano, entendido historicamente como ano da era selêucida; a forma por extenso mantém clareza e dignidade.
- source_word: Διὸς Κορινθίου
  choice: Dios Coríntio
  rationale: Preserva por transliteração o nome calendárico grego, sem impor uma equivalência moderna incerta. A forma em duas palavras reflete os dois elementos presentes no texto-fonte.
- source_word: τετράδι καὶ εἰκάδι
  choice: no dia vinte e quatro
  rationale: A expressão grega diz literalmente “no quarto e vigésimo”, modo idiomático de indicar o vigésimo quarto dia; a ordem natural em português é “dia vinte e quatro”.
