  text: Therefore[a], for those going down until the thirtieth of Xanthicus, there will be a right hand given with safe-conduct[c][b],
translation:
  language: pt
  text: Portanto, para os que partirem até o dia trinta de Xântico[b], haverá uma garantia de salvo-conduto.[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “haverá mão direita com permissão”. A expressão provavelmente se refere a um compromisso ou garantia de passagem segura.
    reason: lexical_alternative
  - marker: b
    text: Xântico era o nome de um mês do calendário macedônio usado na datação helenística.
    reason: cultural_note
  - marker: c
    text: A formulação grega é concisa e parece integrar uma frase mais ampla. O verbo traduzido por “partirem” também pode significar “descerem” ou “seguirem viagem”.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Portanto
  rationale: Expressa a ligação conclusiva do grego em registro digno e natural.
- source_word: καταπορευομένοις
  choice: os que partirem
  rationale: O particípio pode indicar movimento para baixo ou para longe. Neste contexto, “partirem” comunica com naturalidade o provável sentido, sem definir o destino ou o sentido exato do deslocamento; a ambiguidade é registrada em nota.
- source_word: μέχρι τριακάδος Ξανθικοῦ
  choice: até o dia trinta de Xântico
  rationale: Apresenta claramente o prazo indicado no grego e conserva, por transliteração, o nome histórico do mês macedônio.
- source_word: ὑπάρξει
  choice: haverá
  rationale: Reproduz de modo direto e idiomático o futuro existencial grego.
- source_word: δεξιὰ μετὰ τῆς ἀδείας
  choice: uma garantia de salvo-conduto
  rationale: A expressão literal une “mão direita” a permissão, liberdade ou imunidade. Em linguagem diplomática, a mão direita pode representar um compromisso ou garantia; “garantia de salvo-conduto” comunica a função provável da expressão, enquanto a nota preserva sua forma literal e incerteza.
