  yaml_path: translation/deuterocanon/2_maccabees/010/036.yaml
  text: But if there are matters that should be brought before the king[a], send someone at once to look into these things, so that we may act as is fitting for us; for we are going on to Antioch.
translation:
  language: pt
  text: Quanto ao que se decidiu apresentar ao rei[a], enviem imediatamente alguém para examinar essas questões, para que possamos agir como nos convém, pois estamos seguindo para Antioquia.[b]
  philosophy: optimal-equivalence
  footnotes:
