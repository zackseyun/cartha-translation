    text: Literalmente, “quanto ao que decidiu apresentar ao rei”. O sujeito de “decidiu” não é expresso neste versículo e é determinado pelo contexto anterior.
    reason: grammatical_ambiguity
  - marker: b
    text: O texto grego fornecido corresponde, nas numerações usuais, a 2 Macabeus 11:36, e não a 10:36.
    reason: reference_mismatch
lexical_decisions:
- source_word: ἃ δὲ ἔκρινεν
  choice: Quanto ao que ele decidiu
  rationale: A construção grega traz o verbo no singular e não contém uma partícula condicional. A tradução conserva o sujeito implícito, sem transformá-la em uma oração com “se”; o antecedente de “ele” depende do contexto anterior.
- source_word: προσανενεχθῆναι τῷ Βασιλεῖ
  choice: que fosse apresentado ao rei
  rationale: O infinitivo passivo indica levar uma questão à consideração da autoridade real, sem especificar se isso ocorreria oralmente ou por escrito.
- source_word: πέμψατέ τινα παραχρῆμα
  choice: enviem imediatamente alguém
  rationale: Mantém a força do imperativo plural e a urgência expressa por παραχρῆμα em português natural.
- source_word: ἐπισκεψόμενον περὶ τούτων
  choice: para examinar essas questões
  rationale: 'O particípio futuro expressa a finalidade da pessoa enviada: averiguar ou examinar os assuntos mencionados.'
- source_word: ἵνʼ ἔχωμεν ὡς καθήκει ἡμῖν
  choice: a fim de que possamos tratá-las como nos convém
  rationale: A expressão grega é elíptica; “tratá-las” explicita apenas o complemento exigido pelo português, preservando a ideia de proceder de modo apropriado.
- source_word: ἡμεῖς γὰρ προσάγομεν πρὸς Ἀντιοχίαν
  choice: pois estamos avançando para Antioquia
  rationale: προσάγομεν descreve movimento em direção a Antioquia; “avançando para” conserva tanto o aspecto progressivo do presente quanto o destino.
