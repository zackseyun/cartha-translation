lexical_decisions:
- source_word: ὑπὲρ ὧν
  choice: Quanto ao que
  rationale: A expressão introduz o assunto em pauta. Esta formulação é natural em português e mantém a referência relativamente aberta do pronome grego.
- source_word: Λυσίας
  choice: Lísias
  rationale: Forma tradicional e natural do nome grego em português.
- source_word: ὁ συγγενὴς τοῦ βασιλέως
  choice: parente do rei
  rationale: Traduz diretamente a relação expressa por συγγενής, sem excluir a possibilidade de a expressão também funcionar como título da corte.
- source_word: συνεχώρησεν
  choice: concedeu
  rationale: No contexto diplomático, o verbo indica concessões ou permissões já dadas por Lísias.
- source_word: ὑμῖν
  choice: a vocês
  rationale: Expressa claramente o objeto indireto plural em português moderno de ampla compreensão.
- source_word: καὶ ἡμεῖς συνευδοκοῦμεν
  choice: nós também damos nossa aprovação
  rationale: Comunica que os remetentes ratificam ou endossam o que Lísias concedeu, preservando o valor de concordância conjunta do verbo.
