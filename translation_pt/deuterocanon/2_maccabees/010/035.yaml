  text: Concerning the matters that Lysias[a], the king’s kinsman, has granted to you, we also approve.
translation:
  language: pt
  text: Quanto ao que Lísias, parente do rei[a], concedeu a vocês, nós também damos nossa aprovação.
  philosophy: optimal-equivalence
