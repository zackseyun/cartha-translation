  text: If[a], then, you maintain your goodwill toward these matters[b], I will also try from now on to be the cause of good things.
translation:
  language: pt
  text: Portanto, se mantiverem a boa vontade em relação a estes assuntos[a], também procurarei, daqui em diante, ser causa de coisas boas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em relação a estas questões” ou “em favor deste empreendimento”. A expressão grega é ampla e pode se referir ao assunto ou à obra como um todo.
