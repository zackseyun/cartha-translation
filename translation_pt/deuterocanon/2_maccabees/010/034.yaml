base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/034.yaml
  text: 'The Romans also sent them a letter[a], worded as follows: “Quintus Memmius and Titus Manius, elders of the Romans, to the people of the Jews[b], greetings.”'
translation:
  language: pt
  text: 'Os romanos também lhes enviaram uma carta, redigida nos seguintes termos: “Quinto Mêmio e Tito Mânio, anciãos dos romanos[a], ao povo judeu[b], saudações.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “anciãos dos romanos” também pode designar, mais especificamente, emissários ou senadores romanos; o termo grego, porém, significa literalmente “anciãos”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ao povo dos judeus”. O grego traz literalmente “ao povo dos judeus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπέμψαν δὲ καὶ οἱ Ῥωμαῖοι
  choice: Os romanos também enviaram
  rationale: Expressa de modo natural o aoristo de πέμπω, o valor aditivo de καί e o sujeito coletivo οἱ Ῥωμαῖοι, sem acrescentar uma instituição política não explicitada.
- source_word: πρὸς αὐτοὺς ἐπιστολήν
  choice: lhes enviaram uma carta
  rationale: A colocação pronominal é idiomática em português, e “carta” é o equivalente direto de ἐπιστολήν.
- source_word: ἔχουσαν οὕτως
  choice: redigida nos seguintes termos
  rationale: Reproduz naturalmente a fórmula que introduz o teor da carta.
- source_word: Κόιντος Μέμμιος, Τίτος Μάνιος
  choice: Quinto Mêmio e Tito Mânio
  rationale: Adota formas portuguesas transparentes dos nomes greco-latinos e acrescenta a conjunção exigida pela fluência do português.
- source_word: πρεσβυταὶ Ῥωμαίων
  choice: anciãos dos romanos
  rationale: Mantém o sentido lexical amplo de πρεσβυταί e evita especificar “senadores” ou “emissários”, sentidos possíveis no contexto, mas não expressos diretamente.
- source_word: τῷ δήμῳ τῶν Ἰουδαίων
  choice: ao povo judeu
  rationale: Comunica de modo atual e claro o sentido corporativo de δῆμος, enquanto a nota registra a estrutura mais literal do grego.
- source_word: χαίρειν
  choice: saudações
  rationale: É o equivalente convencional da fórmula epistolar grega, não uma ordem para que os destinatários se alegrem.
