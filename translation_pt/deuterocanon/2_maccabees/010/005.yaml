base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/005.yaml
  text: But when he entered Judea and came near Bethsura[a], a fortified place about five schoeni from Jerusalem[b], he was pressing it hard.
translation:
  language: pt
  text: Mas, ao entrar na Judeia e aproximar-se de Betsur, que era uma praça fortificada situada a cerca de cinco esquenos[a] de Jerusalém, ele a pressionava intensamente.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O esqueno era uma antiga unidade de distância, cujo equivalente moderno exato variava; por isso, a medida grega foi mantida em vez de ser convertida com falsa precisão.
    reason: cultural_note
  - marker: b
    text: 'Ou: “ele a sitiava”. O grego diz literalmente “ele a pressionava”, expressão que pode indicar pressão militar contra uma praça fortificada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν ... εἰς τὴν Ἰουδαίαν
  choice: ao entrar na Judeia
  rationale: O particípio aoristo é expresso naturalmente como circunstância temporal, sem forçar se a entrada foi estritamente anterior à aproximação.
- source_word: συνεγγίσας Βεθσουρῶν
  choice: aproximar-se de Betsur
  rationale: συνεγγίζω indica chegar perto ou aproximar-se; “Betsur” é uma transliteração portuguesa clara do topônimo.
- source_word: ὄντι μὲν ἐρυμνῷ χωρίῳ
  choice: que era uma praça fortificada
  rationale: ἐρυμνός descreve um local forte ou defensável, e χωρίον designa aqui um lugar; “praça fortificada” comunica com naturalidade o sentido militar.
- source_word: Ἱεροσολύμων δὲ ἀπέχοντι ὡσεὶ σχοίνους πέντε
  choice: situada a cerca de cinco esquenos de Jerusalém
  rationale: Mantém-se a antiga unidade σχοῖνος, cuja equivalência moderna variava, evitando uma conversão falsamente precisa.
- source_word: τοῦτο ἔθλιβε
  choice: ele a pressionava duramente
  rationale: θλίβω significa literalmente apertar ou pressionar. No contexto militar, a formulação preserva a imagem e não especifica além do grego uma operação técnica de cerco.
