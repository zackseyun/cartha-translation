  yaml_path: translation/deuterocanon/2_maccabees/010/026.yaml
  text: Therefore you will do well to send to them and give them pledges of good faith[a], so that, knowing our intention[c][b], they may be encouraged and may live gladly with support for their own interests.
translation:
  language: pt
  text: Portanto, você fará bem em enviar-lhes uma mensagem e lhes dar garantias de boa-fé[a], para que, conhecendo a nossa intenção, fiquem animados e vivam contentes, com apoio em seus próprios assuntos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dar as mãos direitas”, um idiomatismo grego para oferecer garantias solenes de paz ou de boa-fé.
    reason: lexical_alternative
  - marker: b
    text: A frase final também pode ser entendida mais estritamente como “com auxílio em relação aos seus próprios bens ou interesses”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὖ οὖν ποιήσεις
  choice: Portanto, você fará bem
  rationale: Conserva a forma idiomática de recomendação expressa pelo futuro grego e liga a orientação ao contexto anterior.
- source_word: διαπεμψάμενος πρὸς αὐτούς
  choice: em enviar alguém até eles
  rationale: O verbo indica o envio de uma comunicação ou de emissários. A formulação portuguesa torna explícito apenas o agente necessariamente implícito, sem especificar se era mensageiro ou representante.
- source_word: δοὺς δεξιάς
  choice: lhes dar garantias de boa-fé
  rationale: A expressão literal, “dar as mãos direitas”, é um idiomatismo que designa garantias solenes, compromisso amistoso ou promessa de paz; o sentido é apresentado no texto e a imagem original, em nota.
- source_word: προαίρεσιν
  choice: intenção
  rationale: Expressa uma decisão ou propósito deliberado sem acrescentar a ideia mais específica de política oficial ou benevolência.
- source_word: εὔθυμοί
  choice: fiquem animados
  rationale: O adjetivo indica bom ânimo ou disposição confiante; “animados” é natural e mantém a relação de resultado com o conhecimento da intenção declarada.
- source_word: ἡδέως διαγίνωνται
  choice: vivam contentes
  rationale: Reproduz de modo natural a ideia de passar a vida ou o tempo de maneira agradável e satisfeita.
- source_word: πρὸς τῇ τῶν ἰδίων ἀντιλήψει
  choice: recebendo apoio em seus próprios assuntos
  rationale: ἀντίληψις denota auxílio ou apoio, enquanto τὰ ἴδια pode abranger assuntos, interesses ou bens próprios. A tradução conserva essa amplitude sem restringir a referência a posses materiais.
