translation_notes:
  register: 'Português moderno, claro e digno, com tratamento por “você” adequado a uma instrução dirigida a uma pessoa. A tradução prioriza equivalência ótima: verte os idiomatismos gregos de modo compreensível e registra em notas tanto a imagem literal quanto a ambiguidade da frase final.'
