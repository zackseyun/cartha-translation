revisions:
- from: Mas o próprio Macabeu foi o primeiro a pegar em armas e exortou os outros a, enfrentando o perigo junto com ele,[a] socorrer seus irmãos.[b] Então, todos juntos se lançaram prontamente.
  to: Mas o próprio Macabeu foi o primeiro a pegar em armas e exortou os outros a arriscarem-se juntamente com ele para socorrer seus irmãos.[a][b] E, juntos, saíram com entusiasmo.
  rationale: A revisão elimina a inferência acrescentada por «Então» e reformula a oração participial para expressar com clareza que os outros são exortados a correr o risco juntamente com Macabeu. «Saíram com entusiasmo» conserva o movimento de ἐξώρμησαν e a disposição de προθύμως, sem especificar uma manobra militar além do que o grego permite.
