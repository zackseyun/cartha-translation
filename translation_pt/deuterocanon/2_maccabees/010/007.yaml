base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/007.yaml
  text: But Maccabeus himself was the first to take up arms[a], and he urged the others, by risking danger together with him, to come to the aid of their brothers[b]; and together they also charged out eagerly.
translation:
  language: pt
  text: Mas o próprio Macabeu foi o primeiro a pegar em armas e exortou os outros a arriscarem-se juntamente com ele para socorrer seus irmãos.[a][b] E, juntos, saíram com entusiasmo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego também pode ser traduzido como “compartilhando com ele o perigo”.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “irmãos” também pode designar seus compatriotas ou companheiros judeus.
    reason: contextual_clarification
lexical_decisions:
- source_word: πρῶτος
  choice: foi o primeiro
  rationale: O uso predicativo destaca que Macabeu tomou a iniciativa antes dos demais.
- source_word: ἀναλαβὼν τὰ ὅπλα
  choice: a pegar em armas
  rationale: A expressão descreve o ato de armar-se; a formulação portuguesa é natural e preserva o contexto militar.
- source_word: προετρέψατο
  choice: exortou
  rationale: O verbo indica incentivo enérgico à ação; “exortou” mantém a força do grego em registro digno e corrente.
- source_word: ἅμα αὐτῷ διακινδυνεύοντας
  choice: enfrentando o perigo junto com ele
  rationale: A frase participial apresenta os outros como participantes do risco assumido por Macabeu, sem reduzir διακινδυνεύω a uma simples companhia.
- source_word: ἐπιβοηθεῖν
  choice: socorrer
  rationale: O verbo composto exprime ir em auxílio de alguém numa situação urgente; “socorrer” transmite essa força de modo conciso.
- source_word: τοῖς ἀδελφοῖς αὐτῶν
  choice: seus irmãos
  rationale: Mantém o sentido literal e relacional de ἀδελφοί, que no contexto também pode designar outros judeus ou compatriotas.
- source_word: ὁμοῦ
  choice: todos juntos
  rationale: Explicita a ação coletiva indicada pelo advérbio, em português idiomático.
- source_word: προθύμως
  choice: prontamente
  rationale: Expressa disposição voluntária e decidida; evita acrescentar uma emoção não necessariamente exigida pelo termo.
- source_word: ἐξώρμησαν
  choice: se lançaram
  rationale: Preserva o movimento vigoroso de saída ou avanço sugerido pelo verbo, sem especificar além do texto se foi uma carga militar formal.
theological_decisions:
- issue: Sentido coletivo de ἀδελφοῖς no contexto nacional e militar
  choice: seus irmãos
  alternative: seus compatriotas
  rationale: O sentido contextual pode abranger correligionários ou compatriotas judeus, mas a tradução principal preserva a metáfora familiar e a forma masculina do grego; a amplitude contextual é indicada em nota.
translation_notes:
  register: 'Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, mantendo a progressão do grego: Macabeu toma a iniciativa, convoca os demais ao risco compartilhado e ao socorro, e todos partem juntos com disposição.'
