  text: Farewell[a]. In the one hundred forty-eighth year[b], on the fifteenth day of Xanthicus.
translation:
  language: pt
  text: Passem bem.[a] No ano cento e quarenta e oito, no décimo quinto dia de Xântico.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “tenham saúde” ou “estejam bem”; aqui é uma fórmula convencional de despedida.
    reason: lexical_alternative
  - marker: b
    text: Xântico era o nome de um mês macedônio usado em fórmulas de datação helenísticas.
    reason: cultural_note
lexical_decisions:
- source_word: ὑγιαίνετε
  choice: Passem bem
  rationale: O imperativo plural significa literalmente “tenham saúde/estejam bem”, mas funciona aqui como fórmula convencional de despedida. “Passem bem” conserva tanto a função epistolar quanto a imagem de bem-estar.
- source_word: ἔτους
  choice: ano
  rationale: Integra uma fórmula de datação no genitivo e corresponde diretamente a “ano”.
- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: cento e quarenta e oito
  rationale: Expressão ordinal que identifica o 148º ano; na fórmula portuguesa “no ano cento e quarenta e oito”, o cardinal é natural e inequívoco.
- source_word: Ξανθικοῦ
  choice: Xântico
  rationale: Nome do mês macedônio, vertido pela forma portuguesa transliterada “Xântico”.
- source_word: πεντεκαιδεκάτῃ
  choice: no décimo quinto dia
  rationale: O dativo feminino pertence à fórmula de datação; “no décimo quinto dia” explicita naturalmente o substantivo subentendido.
