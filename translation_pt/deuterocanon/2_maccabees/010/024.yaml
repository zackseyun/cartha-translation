  - marker: b
    text: 'Ou: “que lhes fossem permitidas suas normas” ou “seus costumes estabelecidos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκοότες
  choice: tendo ouvido
  rationale: O particípio perfeito circunstancial indica informação anteriormente recebida e mantém a ligação sintática com o contexto.
- source_word: μὴ συνεὐδοκοῦντας
  choice: não aprovavam
  rationale: Expressa de modo natural a falta de aprovação ou consentimento diante da mudança mencionada.
- source_word: τῇ τοῦ πατρὸς εἰς τὰ Ἑλληνικὰ μεταθέσει
  choice: a mudança de seu pai para os costumes gregos
  rationale: μετάθεσις indica mudança ou transferência, enquanto τὰ Ἑλληνικά aponta para práticas e costumes gregos, não apenas para o idioma. A formulação conserva a referência comprimida ao pai sem explicá-la além do grego.
- source_word: τὴν ἑαυτῶν ἀγωγὴν αἱρετίζοντας
  choice: preferiam seu próprio modo de vida
  rationale: ἀγωγή abrange conduta ou modo de vida, e αἱρετίζω pode significar escolher ou preferir; 'preferiam' produz em português um contraste natural com a rejeição dos costumes gregos.
- source_word: ἀξιοῦν
  choice: pediam
  rationale: No contexto de uma solicitação, traduz o sentido de pedir ou requerer sem intensificá-lo como exigência.
- source_word: συγχωρηθῆναι αὐτοῖς τὰ νόμιμα
  choice: que lhes fosse permitido observar suas normas
  rationale: συγχωρηθῆναι exprime concessão ou permissão, e τὰ νόμιμα designa prescrições e costumes estabelecidos. O verbo 'observar' explicita idiomaticamente em português o exercício dessas normas, sem restringi-las a leis escritas.
theological_decisions:
- issue: Sentido cultural de εἰς τὰ Ἑλληνικά
  choice: para os costumes gregos
  alternative: para o modo de vida grego; para o helenismo
  rationale: A expressão se refere à adoção de práticas culturais gregas em contraste com o modo de vida judaico. 'Costumes gregos' é claro e evita tornar o texto excessivamente técnico.
- issue: Amplitude de τὰ νόμιμα no contexto judaico
  choice: suas normas
  alternative: suas leis; seus costumes ancestrais
  rationale: '''Normas'' conserva a dimensão prescritiva sem limitar o termo à legislação escrita nem acrescentar explicitamente a ideia de ancestralidade, que permanece contextual.'
- issue: Referência de τοῦ πατρός
  choice: de seu pai
  alternative: do pai; de seu antepassado
  rationale: Mantém a referência singular e a formulação comprimida do texto grego, sem resolver por conjectura sua identidade ou função.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A tradução mantém a estrutura participial e o caráter contínuo do período, indicado pela vírgula final, e preserva a ambiguidade da referência a 'seu pai'.
