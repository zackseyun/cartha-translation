translation:
  language: pt
  text: tendo ouvido que os judeus não aprovavam a mudança de seu pai para os costumes gregos[a], mas preferiam seu próprio modo de vida e pediam que suas leis lhes fossem permitidas[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a mudança de seu pai para o modo de vida grego” ou “para o helenismo”. A expressão grega é condensada e se refere à adoção de práticas culturais gregas.'
