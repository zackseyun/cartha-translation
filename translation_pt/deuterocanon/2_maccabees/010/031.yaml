  text: that the Jews should make use of their own resources and laws as before[a], and that none of them should in any way be harassed concerning the things done in ignorance.
translation:
  language: pt
  text: que os judeus fizessem uso de seus próprios recursos[a] e de suas leis, como antes, e que nenhum deles fosse de modo algum importunado quanto ao que havia sido feito por ignorância.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “suas próprias despesas”; o termo grego pode indicar gastos, despesas ou recursos materiais de sustento.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῆσθαι
  choice: fizessem uso de
  rationale: O infinitivo expressa o conteúdo da determinação e rege os dativos seguintes; “fizessem uso de” conserva seu sentido direto e funciona naturalmente em português.
- source_word: τοῖς ἑαυτῶν δαπανήμασιν
  choice: seus próprios recursos
  rationale: δαπάνη e seus derivados podem indicar despesas, gastos ou meios materiais de sustento. “Recursos” comunica aqui os meios materiais à disposição dos judeus sem limitar indevidamente o sentido a pagamentos específicos; a alternativa literal é registrada em nota.
- source_word: νόμοις
  choice: suas leis
  rationale: νόμος significa normalmente “lei”. Embora possa abranger costumes, “leis” é a tradução mais direta e preserva a dimensão normativa da frase.
- source_word: καθὰ καὶ τὸ πρότερον
  choice: como antes
  rationale: A expressão remete de forma concisa à prática anterior; “como antes” é natural e fiel.
- source_word: παρενοχληθήσεται
  choice: fosse de modo algum importunado
  rationale: O verbo passivo indica sofrer incômodo, interferência ou assédio. “Importunado” mantém a ideia de perturbação sem introduzir necessariamente violência física; a construção portuguesa harmoniza o futuro grego com o conteúdo da determinação.
- source_word: περὶ τῶν ἠγνοημένων
  choice: por causa do que havia sido feito por ignorância
  rationale: O particípio perfeito passivo substantivado de ἀγνοέω abrange, de modo impessoal, aquilo que ocorreu ou foi praticado sem conhecimento. A formulação preserva essa amplitude e a relação causal possível de περί no contexto.
