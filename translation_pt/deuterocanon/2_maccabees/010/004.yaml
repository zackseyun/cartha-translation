lexical_decisions:
- source_word: οὐδάμως
  choice: de modo algum
  rationale: Preserva a negação enfática e soa natural em português atual.
- source_word: ἐπιλογιζόμενος
  choice: levar em conta
  rationale: Expressa a ideia de considerar ou calcular um fator, adequada ao contexto de avaliação de forças militares.
- source_word: τὸ τοῦ θεοῦ κράτος
  choice: a força de Deus
  rationale: κράτος designa aqui força ou poder efetivo, em contraste direto com os recursos militares humanos.
- source_word: πεφρονηματισμένος
  choice: cheio de orgulho
  rationale: Comunica o estado consolidado de arrogância e exaltação própria indicado pelo particípio perfeito.
- source_word: μυριάσιν τῶν πεζῶν
  choice: pelas dezenas de milhares de soldados de infantaria
  rationale: Mantém o valor numérico potencial de μυριάδες e identifica claramente as tropas a pé.
- source_word: χιλιάσι τῶν ἱππέων
  choice: pelos milhares de cavaleiros
  rationale: O plural indica múltiplos milhares, e 'cavaleiros' é uma tradução direta e acessível de ἱππεῖς.
- source_word: ἐλέφασιν τοῖς ὀγδοήκοντα
  choice: pelos oitenta elefantes
  rationale: Reproduz com exatidão o contingente numerado e mantém o paralelismo da enumeração.
theological_decisions:
- issue: Tradução de κράτος em referência a Deus
  choice: a força de Deus
  alternative: o poder de Deus; o domínio de Deus
  rationale: O contexto contrapõe a capacidade efetiva de Deus às forças militares humanas. 'Força' preserva esse contraste sem introduzir uma afirmação mais abstrata sobre domínio ou soberania.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva o caráter fragmentário do trecho grego e o contraste entre a força divina e a confiança arrogante nos recursos militares.
