  text: But most of them escaped wounded and naked[a]; and Lysias himself also escaped by fleeing shamefully.
translation:
  language: pt
  text: Mas a maioria deles escapou ferida e nua[a]; e o próprio Lísias também escapou, fugindo vergonhosamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “despojada”; pode indicar que fugiram depois de perder o equipamento, a armadura ou as vestes exteriores na batalha.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πλείονες
  choice: a maioria deles
  rationale: O comparativo substantivado indica a parte maior do grupo; “a maioria deles” é natural e mantém o sentido quantitativo.
- source_word: τραυματίαι
  choice: ferida
  rationale: O termo designa pessoas feridas. A concordância no singular feminino acompanha o coletivo “a maioria”, sem acrescentar um substantivo ausente no grego.
- source_word: γυμνοὶ
  choice: nua
  rationale: Mantém o sentido direto de “nua” ou “despojada”, sem decidir se houve perda de roupas, armadura ou equipamento durante a derrota.
- source_word: διεσώθησαν
  choice: escapou
  rationale: No contexto militar, o verbo indica sair com vida e conseguir fugir; a forma singular concorda naturalmente com “a maioria” em português.
- source_word: αἰσχρῶς
  choice: vergonhosamente
  rationale: Preserva de modo conciso a avaliação de vergonha ou desonra expressa pelo advérbio grego.
- source_word: φεύγων
  choice: fugindo
  rationale: O gerúndio conserva a circunstância simultânea do particípio presente, sem impor uma distinção rígida entre meio e concomitância.
- source_word: διεσώθη
  choice: escapou
  rationale: No relato da derrota, comunica claramente que Lísias sobreviveu e conseguiu fugir.
