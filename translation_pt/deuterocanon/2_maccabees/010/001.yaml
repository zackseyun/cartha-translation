review_pass:
  verdict: revise
  source_fidelity: 'A oração traduz com precisão a sequência e a estrutura incompleta do grego: o intervalo muito breve, os três predicados de Lísias e seu pesar/reação diante dos acontecimentos. Contudo, «profundamente contrariado» pode em português sugerir mera irritação ou frustração, enfraquecendo λίαν βαρέως φέρων, que expressa levar algo muito a mal, com forte pesar ou indignação. Há também uma discrepância externa importante: o texto grego fornecido é normalmente 2 Macabeus 11:1, não 10:1.'
  naturalness: «Pouquíssimo tempo depois» é natural e reproduz bem a intensificação temporal. «Tutor do rei» pode ser lido modernamente como professor particular; «tutor e parente do rei» mantém o sentido de ἐπίτροπος com menos ambiguidade. «Levando muito a mal o que havia acontecido» é idiomático e conserva a amplitude emocional do grego.
  terminology: Lísias está correto. «Tutor» é uma opção defensável para ἐπίτροπος, com nota para «regente». «Encarregado dos assuntos» conserva a imprecisão institucional de ἐπὶ τῶν πραγμάτων melhor do que explicitar «assuntos de Estado», embora o contexto seja governamental. Não há termos teológicos nesta oração.
  issues:
  - severity: medium
    issue: «Profundamente contrariado» é semanticamente mais estreito e potencialmente mais brando que λίαν βαρέως φέρων.
    rationale: A expressão grega indica que Lísias levava os fatos muito a mal, podendo abranger pesar e indignação. «Levando muito a mal» conserva essa força sem selecionar indevidamente uma emoção específica.
  - severity: low
    issue: «Tutor do rei» pode ser entendido como instrutor, não como responsável pela tutela/supervisão do rei.
    rationale: Embora «tutor» possa ter o sentido jurídico pertinente, a coordenação «tutor e parente do rei» e uma nota que ofereça «regente» tornam a função mais clara.
  - severity: high
    issue: A referência 2 Macabeus 10:1 não corresponde ao texto grego apresentado nas numerações usuais; este inicia 2 Macabeus 11:1.
    rationale: Trata-se de problema de identificação editorial, não de redação da tradução. A referência deve ser conferida antes da publicação.
  revised_text: Pouquíssimo tempo depois[a], Lísias, tutor e parente do rei[b], encarregado dos assuntos[c], levando muito a mal o que havia acontecido,
  revised_footnotes:
  - marker: a
    text: 'Ou: “depois de um breve intervalo”. A expressão grega enfatiza que passou pouquíssimo tempo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “regente”. O termo grego pode designar alguém incumbido da tutela ou supervisão do rei.'
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “sobre os assuntos”; provavelmente se refere a uma elevada função administrativa.
    reason: lexical_alternative
  revision_rationale: A revisão substitui uma expressão emocionalmente mais fraca por uma que reproduz o idioma grego sem restringir seu sentido a tristeza ou irritação. Também torna «tutor» menos suscetível à leitura de instrutor e evita acrescentar «de Estado» onde o grego diz apenas «dos assuntos». A vírgula final é preservada porque o trecho-fonte também é uma oração incompleta.
