lexical_decisions:
- source_word: Μετʼ ὀλίγον δὲ παντελῶς χρονίσκον
  choice: Pouquíssimo tempo depois
  rationale: Reproduz de modo natural a expressão temporal e a intensificação de παντελῶς, que ressalta a extrema brevidade do intervalo.
- source_word: ἐπίτροπος τοῦ βασιλέως
  choice: tutor do rei
  rationale: ἐπίτροπος designa alguém a quem foi confiada a supervisão ou tutela do rei. “Tutor” preserva essa relação sem definir de forma excessivamente específica um cargo constitucional.
- source_word: συγγενὴς
  choice: parente dele
  rationale: Expressa a relação indicada por συγγενής e deixa claro, em português, que Lísias era parente do rei.
- source_word: ἐπὶ τῶν πραγμάτων
  choice: encarregado dos assuntos de Estado
  rationale: A expressão significa literalmente “sobre os assuntos” e parece indicar uma função administrativa. A formulação escolhida é clara, mas evita impor um título oficial exato não explicitado pelo grego.
- source_word: λίαν βαρέως φέρων ἐπὶ τοῖς γεγονόσι
  choice: profundamente contrariado com o que havia acontecido
  rationale: O idioma βαρέως φέρειν comunica forte desgosto, aflição ou indignação diante de algo. “Profundamente contrariado” conserva essa amplitude melhor do que uma formulação que indique apenas tristeza.
