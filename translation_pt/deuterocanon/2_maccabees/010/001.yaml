  text: But after a very short time[a], Lysias, the king’s guardian and kinsman and the one over affairs, taking the events very hard[c][b],
translation:
  language: pt
  text: Pouquíssimo tempo depois[a], Lísias, tutor do rei[b], parente dele e encarregado dos assuntos de Estado[c], profundamente contrariado com o que havia acontecido,
