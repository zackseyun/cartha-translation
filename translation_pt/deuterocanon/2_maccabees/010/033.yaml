translation:
  language: pt
  text: Passem bem[a]. No ano cento e quarenta e oito, no décimo quinto dia de Xântico[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega significa literalmente “sejam fortes” ou “estejam bem”, mas era usada nas cartas como fórmula convencional de despedida.
    reason: lexical_alternative
  - marker: b
    text: Xântico era o nome de um mês do calendário macedônio usado em datações do período helenístico.
    reason: cultural_note
lexical_decisions:
- source_word: ἔρρωσθε
  choice: Passem bem
  rationale: O imperativo plural de ῥώννυμι significa literalmente “sejam fortes” ou “estejam bem”, mas aqui funciona como fórmula convencional de despedida epistolar. “Passem bem” preserva esse valor em português natural.
- source_word: ἔτους
  choice: No ano
  rationale: O genitivo integra uma fórmula de datação; em português, a construção idiomática pede “no ano”.
- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: cento e quarenta e oito
  rationale: A expressão ordinal qualifica “ano”; a formulação portuguesa corrente é “no ano cento e quarenta e oito”, sem acrescentar qual era cronológica está em vista.
- source_word: Ξανθικοῦ
  choice: Xântico
  rationale: Nome de um mês macedônio, transliterado segundo a forma tradicional e inteligível em português.
- source_word: πεντεκαιδεκάτῃ
  choice: no décimo quinto dia
  rationale: O dativo indica o dia do mês na fórmula de datação; a preposição e o substantivo “dia” são explicitados naturalmente em português.
