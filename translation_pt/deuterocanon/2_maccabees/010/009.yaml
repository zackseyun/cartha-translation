base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/009.yaml
  text: And all together they blessed the merciful God and were strengthened in their souls[b][a], being ready to wound not only men but even the fiercest wild beasts and iron walls.
translation:
  language: pt
  text: Todos juntos bendisseram o Deus misericordioso e foram fortalecidos no íntimo[a], ficando prontos para ferir não somente homens, mas também as feras mais selvagens e muralhas de ferro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «foram fortalecidos em suas almas»; também pode ser entendido como «cobraram ânimo».
    reason: lexical_alternative
  - marker: b
    text: A imagem de ferir até «muralhas de ferro» é provavelmente hiperbólica e expressa extrema coragem para a batalha.
    reason: cultural_note
lexical_decisions:
- source_word: ὁμοῦ δὲ πάντες
  choice: Então, todos juntos
  rationale: Expressa a ação coletiva e simultânea indicada por ὁμοῦ e πάντες. «Então» dá continuidade narrativa a δέ sem impor um contraste forte.
- source_word: εὐλόγησαν
  choice: bendisseram
  rationale: Mantém o sentido tradicional de εὐλογέω quando Deus é o objeto, em linguagem bíblica digna e compreensível.
- source_word: τὸν ἐλεήμονα θεόν
  choice: o Deus misericordioso
  rationale: Reproduz diretamente a construção atributiva e o sentido de compaixão e misericórdia de ἐλεήμων.
- source_word: ἐπερρώσθησαν ταῖς ψυχαῖς
  choice: foram fortalecidos no íntimo
  rationale: Preserva a voz passiva e comunica de modo natural o fortalecimento interior, sem transformar ψυχαῖς em uma afirmação antropológica técnica.
- source_word: οὐ μόνον ἀνθρώπους θῆρας δὲ τοὺς ἀγριωτάτους καὶ σιδηρᾶ τείχη
  choice: não somente homens, mas até as feras mais selvagens e muralhas de ferro
  rationale: Conserva a progressão enfática e hiperbólica dos objetos, explicitando θῆρας como «feras» e usando «até» para marcar a escalada.
- source_word: τιτρώσκειν
  choice: ferir
  rationale: Verte o sentido básico de causar ferimento e mantém a imagem incomum aplicada tanto a seres vivos quanto, hiperbolicamente, a muralhas.
- source_word: ὄντες ἕτοιμοι
  choice: ficando prontos
  rationale: Mantém a ligação participial entre o fortalecimento interior e a prontidão resultante para agir.
theological_decisions:
- issue: Nuance antropológica de ψυχαῖς
  choice: foram fortalecidos no íntimo
  alternative: foram fortalecidos em suas almas; cobraram ânimo
  rationale: A expressão descreve a resolução interior, não uma doutrina técnica sobre a alma. «No íntimo» preserva a dimensão interior sem resolver ψυχή como «espírito» nem tornar a frase artificial.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se deliberadamente a imagem marcial incomum de «ferir [...] muralhas de ferro», explicada em nota, e evita-se dar a ψυχαῖς um sentido antropológico técnico.
