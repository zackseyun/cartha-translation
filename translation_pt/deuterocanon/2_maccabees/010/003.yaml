  text: and to make the sanctuary taxable[a], like the other shrines of the nations, and to make the high priesthood sold each year[c][b];
translation:
  language: pt
  text: e tornar o santuário sujeito a tributo[a], como os demais recintos sagrados das nações, e pôr o sumo sacerdócio à venda todos os anos[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sujeito à cobrança de dinheiro”. O termo grego indica que o santuário seria submetido a tributação ou arrecadação monetária.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “tornar vendável todos os anos o sumo sacerdócio”. A expressão enfatiza que o ofício seria comercializado anualmente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  choice: santuário
  rationale: Refere-se ao complexo sagrado de Jerusalém; “santuário” conserva o caráter cultual sem restringir a referência apenas ao edifício.
- source_word: ἀργυρολόγητον
  choice: sujeito a tributo
  rationale: O adjetivo indica que o santuário seria submetido à cobrança ou arrecadação de dinheiro. A expressão é clara e preserva melhor que “tributável” a ideia de uma obrigação imposta.
- source_word: τεμένη
  choice: recintos sagrados
  rationale: Designa áreas ou complexos consagrados ao culto. A escolha mantém a distinção lexical entre os lugares cultuais das nações e o ἱερόν de Jerusalém.
- source_word: ἐθνῶν
  choice: das nações
  rationale: É a correspondência direta do grego e conserva a referência ampla aos povos não judeus sem acrescentar uma caracterização pejorativa.
- source_word: πρατήν
  choice: à venda
  rationale: O predicativo indica que o cargo seria posto à venda. Em português, “pôr ... à venda” comunica de modo natural e enfático a comercialização do sumo sacerdócio.
- source_word: ἀρχιερωσύνην
  choice: o sumo sacerdócio
  rationale: Refere-se ao ofício ou dignidade do sumo sacerdote; “sumo sacerdócio” é conciso e tradicional sem alterar o sentido.
- source_word: ποιήσειν
  choice: tornar ... e pôr
  rationale: O infinitivo rege os dois complementos na construção grega comprimida. A variação verbal em português torna naturais as duas relações predicativas sem mudar seu paralelismo conceitual.
theological_decisions:
- issue: Terminologia cultual para o lugar santo de Jerusalém e os locais sagrados não judeus
  choice: Traduzir ἱερόν por “santuário” e τεμένη por “recintos sagrados”
  alternative: Traduzir ambos por “santuário(s)” ou usar “templo(s)” para τεμένη
  rationale: O grego emprega termos diferentes. Preservar a distinção evidencia que o santuário de Jerusalém seria tratado fiscalmente como os demais espaços cultuais, sem introduzir uma avaliação teológica além do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva o caráter fragmentário do versículo no contexto maior e a coordenação do grego, ao mesmo tempo que explicita naturalmente em português as duas ações regidas por ποιήσειν.
