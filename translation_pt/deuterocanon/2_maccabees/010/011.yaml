  yaml_path: translation/deuterocanon/2_maccabees/010/011.yaml
  text: But springing at the enemies like lions[a], they laid low eleven thousand of them, and one thousand six hundred cavalry; and they forced them all to flee.
translation:
  language: pt
  text: Mas, lançando-se sobre os inimigos como leões, abateram onze mil deles e mil e seiscentos cavaleiros[a]; e obrigaram todos a fugir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego, literalmente: “mil além de dez mil [...] seiscentos além de mil”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λεόντινων
  choice: como leões
  rationale: A forma rara exprime comparação ou modo leonino; “como leões” conserva a imagem com naturalidade em português.
- source_word: ἐντινάξαντες
  choice: lançando-se sobre
  rationale: O particípio descreve um movimento súbito e violento contra o inimigo; a expressão combina naturalmente com a imagem dos leões.
- source_word: κατέστρωσαν
  choice: abateram
  rationale: No contexto de batalha, o verbo indica derrubar ou matar combatentes; “abateram” é direto e mantém alguma amplitude sem suavizar a violência.
- source_word: χιλίους πρὸς τοῖς μυρίοις
  choice: onze mil
  rationale: A construção aditiva significa literalmente “mil além de dez mil”; apresentar o total é claro e fiel ao sentido.
- source_word: ἱππεῖς
  choice: cavaleiros
  rationale: Designa soldados montados. “Cavaleiros” é corrente, concreto e adequado à narrativa antiga.
- source_word: ἑξακοσίους πρὸς χιλίοις
  choice: mil e seiscentos
  rationale: A expressão grega soma seiscentos a mil; a forma explícita é natural no registro narrativo em português.
- source_word: τοὺς δὲ πάντας ἠνάγκασαν φεύγειν
  choice: e obrigaram todos a fugir
  rationale: Preserva tanto a força causativa de ἠνάγκασαν quanto o alcance de πάντας, sem acrescentar “os demais”, que não está explícito no grego.
