  yaml_path: translation/deuterocanon/2_maccabees/010/028.yaml
  text: Farewell[a]. May it be as we would wish[b]; and we ourselves are also well.
translation:
  language: pt
  text: Passem bem[a]. Que seja como desejamos[b]; nós também estamos bem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego emprega literalmente linguagem de saúde nesta despedida: “Estejam fortes/bem [...] e nós também estamos saudáveis”. “Passem bem” reproduz o sentido idiomático da fórmula de encerramento de uma carta.'
    reason: lexical_alternative
  - marker: b
    text: Este texto parece ser uma fórmula de encerramento epistolar e, em muitas divisões modernas dos versículos, não apresenta continuidade narrativa com o contexto ao redor. A redação da fonte foi traduzida tal como se encontra.
    reason: cultural_note
lexical_decisions:
- source_word: ἔρρωσθε
  choice: Passem bem
  rationale: Imperativo plural de ῥώννυμι empregado como fórmula de encerramento epistolar. “Passem bem” preserva tanto o valor idiomático de despedida quanto a linguagem de saúde do grego.
- source_word: εἴη ἂν
  choice: Que seja
  rationale: O optativo com ἄν apresenta aqui um desejo ou possibilidade desejada. “Que seja” expressa isso de modo natural e conciso em português.
- source_word: ὡς βούλομεθα
  choice: como desejamos
  rationale: βούλομαι indica querer ou desejar. “Como desejamos” conserva o sentido volitivo e o tom cortês da fórmula.
- source_word: ὑγιαίνομεν
  choice: estamos bem
  rationale: O verbo significa literalmente estar saudável ou em boas condições. “Estamos bem” é idiomático e mantém a reciprocidade da saudação.
- source_word: καὶ αὐτοὶ δὲ
  choice: nós também
  rationale: A combinação assinala conexão, reciprocidade e leve ênfase no sujeito. Em português, “nós também” comunica esses elementos sem rigidez desnecessária.
