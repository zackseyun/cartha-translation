base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/013.yaml
  text: But since he was not foolish[a], but was considering within himself the defeat that had happened to him, and had realized that the Hebrews were unconquerable because the mighty God was fighting alongside them[b], he sent ahead
translation:
  language: pt
  text: Mas, como não era insensato, ponderando consigo mesmo o revés que sofrera e tendo percebido que os hebreus[a] eram invencíveis, pois o Deus poderoso[b] lutava ao lado deles, enviou antecipadamente...
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “hebreus”; algumas traduções trazem “judeus”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o Deus que tem poder” ou “o Deus que é capaz”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἀνόους δὲ ὑπάρχων
  choice: Mas, como não era insensato
  rationale: Preserva a litotes do grego e seu juízo sobre a capacidade de compreensão do personagem, em português natural.
- source_word: πρὸς ἑαυτὸν ἀντιβάλλων
  choice: ponderou consigo mesmo
  rationale: Expressa a reflexão interior e mantém o elemento reflexivo da construção grega.
- source_word: τὸ γεγονὸς περὶ αὐτὸν ἐλάττωμα
  choice: o revés que sofrera
  rationale: “Revés” conserva a amplitude de ἐλάττωμα — perda, desvantagem ou derrota — sem tornar o resultado militar mais específico do que o grego.
- source_word: συννοήσας
  choice: percebeu
  rationale: Comunica de modo corrente a compreensão a que ele chegou depois de refletir.
- source_word: ἀνικήτους εἶναι τοὺς Ἑβραίους
  choice: que os hebreus eram invencíveis
  rationale: “Invencíveis” preserva a força de ἀνίκητος, e “hebreus” traduz diretamente Ἑβραίους sem harmonizá-lo com “judeus”.
- source_word: τοῦ δυναμένου θεοῦ
  choice: o Deus poderoso
  rationale: Formulação concisa e natural que comunica a capacidade ou o poder divino expresso pelo particípio δυναμένου.
- source_word: συμμαχοῦντος αὐτοῖς
  choice: lutava ao lado deles
  rationale: Mantém o sentido militar de Deus atuar como aliado, em vez de reduzi-lo a auxílio genérico.
- source_word: προαποστείλας
  choice: enviou antecipadamente
  rationale: Preserva a ideia de enviar antes da ação subsequente; as reticências indicam que a construção continua no versículo seguinte.
theological_decisions:
- issue: Designação do povo em Ἑβραίους
  choice: hebreus
  alternative: judeus
  rationale: O texto grego emprega explicitamente Ἑβραίους; a tradução mantém essa designação e registra a alternativa em nota.
- issue: Ação divina na batalha
  choice: o Deus poderoso lutava ao lado deles
  alternative: Deus os ajudava
  rationale: A formulação preserva a afirmação de participação divina ativa como aliada militar, sem suavizá-la para uma ajuda genérica.
- issue: Sentido de τοῦ δυναμένου θεοῦ
  choice: o Deus poderoso
  alternative: o Deus que tem poder
  rationale: A escolha é idiomática em português, enquanto a nota conserva a forma mais literal e a nuance de capacidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. A frase permanece aberta ao final porque προαποστείλας introduz uma ação cujo complemento e desdobramento aparecem na continuação.
