lexical_decisions:
- source_word: ἐνεφάνισεν
  choice: nos informou
  rationale: O verbo indica tornar algo conhecido ou comunicar uma informação. “Nos informou” é natural em português e mantém o destinatário expresso por ἡμῖν.
- source_word: βουλόμενος
  choice: querendo
  rationale: O particípio expressa o desejo ou a intenção de Menelau e conserva, sem explicitação excessiva, sua ligação sintática com o verbo principal.
- source_word: κατελθόντας
  choice: depois de descerem
  rationale: O particípio aoristo indica ação anterior à expressa pelo infinitivo; esta formulação comunica claramente a sequência temporal.
- source_word: γίνεσθαι πρὸς τοὺς ἰδίους
  choice: ficassem com os seus
  rationale: A expressão grega, literalmente próxima de “estar/tornar-se junto dos seus”, é condensada. “Ficassem com os seus” preserva seu sentido relacional sem acrescentar a ideia interpretativa de restauração.
- source_word: τοὺς ἰδίους
  choice: os seus
  rationale: A expressão substantivada é elíptica e pode designar o próprio povo, grupo ou lado. “Os seus” mantém essa abertura contextual em português.
