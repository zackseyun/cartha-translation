review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva os elementos centrais: Menelau como sujeito, «nos» para ἡμῖν, o particípio de desejo/intenção βουλόμενος, a anterioridade de κατελθόντας e a abertura referencial de τοὺς ἰδίους. Contudo, «ficassem com os seus» tende a significar permanência com um grupo ao qual já se pertence, enquanto γίνεσθαι πρὸς sugere mais naturalmente passar para/juntar-se aos seus. A revisão evita a noção adicional de «restauração» e mantém a ambiguidade quanto a povo, grupo ou lado.'
  naturalness: «Menelau nos informou, querendo que vocês, depois de descerem, se juntassem aos seus» é português moderno, fluente e de leitura brasileira ampla. A construção conserva de modo inteligível a compactação e a ligação participial difíceis do grego.
  terminology: «Menelau» é a forma portuguesa estabelecida. «Os seus» reproduz adequadamente o substantivo elíptico τοὺς ἰδίους sem decidir entre povo, partidários ou grupo próprio. «Se juntassem» representa γίνεσθαι πρὸς de forma mais precisa que «ficassem», sem impor leitura confessional ou doutrinária.
  issues:
  - severity: medium
    issue: «Ficassem com os seus» para γίνεσθαι πρὸς τοὺς ἰδίους
    rationale: «Ficar com» normalmente comunica permanecer com alguém, ao passo que a construção grega aponta para vir a estar junto dos seus, isto é, unir-se a eles. «Se juntassem aos seus» conserva a elipse e melhor expressa essa transição, sem a paráfrase interpretativa «ser restaurados».
