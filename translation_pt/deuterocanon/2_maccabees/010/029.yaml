translation:
  language: pt
  text: Menelau nos informou, querendo que vocês, depois de descerem, se juntassem aos seus.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ficassem com os seus» ou «estivessem com o seu próprio povo». A expressão grega é condensada.
    reason: lexical_alternative
