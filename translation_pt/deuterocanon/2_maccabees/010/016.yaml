base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/016.yaml
  text: 'For letters had been written to the Jews from Lysias[a], containing this form: “Lysias to the multitude of the Jews[b], greetings.”'
translation:
  language: pt
  text: 'Pois haviam sido escritas aos judeus cartas da parte de Lísias, com o seguinte teor[a]: “Lísias, ao conjunto dos judeus[b], saudações.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com esta formulação” ou “nos seguintes termos”. A expressão grega pode indicar a forma ou as palavras da carta.
    reason: lexical_alternative
  - marker: b
    text: Ou “à coletividade dos judeus”, “à multidão dos judeus” ou “à assembleia dos judeus”. O termo grego designa um corpo numeroso ou um grupo tomado coletivamente, sem determinar por si só que fosse uma assembleia formal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν γὰρ γεγραμμέναι
  choice: Pois haviam sido escritas
  rationale: Reproduz naturalmente em português o valor perifrástico de anterioridade e a voz passiva, enquanto γάρ é mantido com valor explicativo por meio de “Pois”.
- source_word: ἐπιστολαὶ
  choice: cartas
  rationale: É o termo corrente e adequado para correspondência oficial, sem o tom arcaizante de “epístolas”.
- source_word: τοῖς Ἰουδαίοις
  choice: aos judeus
  rationale: Entende o dativo como indicação dos destinatários das cartas.
- source_word: παρὰ μὲν Λυσίου
  choice: da parte de Lísias
  rationale: Preserva a ideia de origem ou procedência expressa por παρά com genitivo e soa natural no contexto de correspondência.
- source_word: περιέχουσαι τὸν τρόπον τοῦτον
  choice: com o seguinte teor
  rationale: Expressa de maneira idiomática que as cartas continham a formulação citada em seguida, sem limitar τρόπος apenas ao formato externo.
- source_word: τῷ πλήθει τῶν Ἰουδαίων
  choice: ao conjunto dos judeus
  rationale: Mantém o sentido coletivo de πλῆθος sem pressupor que se trate de uma assembleia formal nem sugerir apenas uma multidão física.
- source_word: χαίρειν
  choice: saudações
  rationale: Traduz a fórmula epistolar grega convencional, em vez do sentido lexical isolado “alegrar-se”.
