  text: John and Absalom[a], who were sent from you, after delivering the written document, asked about the matters indicated by it.
translation:
  language: pt
  text: Depois de entregarem o documento escrito[a], João e Absalão, que foram enviados por vocês, fizeram pedidos a respeito dos assuntos nele indicados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «a comunicação escrita» ou «o decreto escrito»; o termo grego pode designar uma comunicação ou determinação oficial. A expressão também pode referir-se a um texto consignado por escrito.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωάνης
  choice: João
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: Ἀβεσσαλώμ
  choice: Absalão
  rationale: Emprega a forma portuguesa tradicional do nome bíblico, em vez de uma transliteração mais próxima do grego.
- source_word: οἱ πεμφθέντες παρʼ ὑμῶν
  choice: enviados por vocês
  rationale: A construção participial passiva identifica os dois homens como representantes enviados pelos destinatários; «por vocês» exprime naturalmente a origem e a agência do envio.
- source_word: ἐπιδόντες
  choice: apresentaram
  rationale: O particípio aoristo indica uma ação anterior ou circunstancial à solicitação; no contexto documental, «apresentaram» é mais natural do que uma tradução estritamente literal como «entregaram».
- source_word: τὸν ὑπογεγραμμένον χρηματισμόν
  choice: o documento assinado
  rationale: χρηματισμός designa aqui uma comunicação ou documento oficial, e ὑπογεγραμμένον pode indicar que estava subscrito ou assinado. A formulação preserva o caráter formal sem classificá-lo necessariamente como decreto.
- source_word: ἠξίουν
  choice: fizeram um pedido
  rationale: O imperfeito de ἀξιόω, seguido de περί, expressa que eles solicitavam providência ou consideração acerca do conteúdo indicado, não apenas que buscavam informação.
- source_word: περὶ τῶν διʼ αὐτοῦ σημαινομένων
  choice: a respeito dos assuntos nele indicados
  rationale: O pronome retoma naturalmente o documento, e a expressão portuguesa conserva o sentido de matérias comunicadas ou assinaladas por meio dele.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com «vocês» para o plural explícito ὑμῶν. O marcador da nota foi colocado após «documento assinado», termo ao qual a nota lexical se refere, e não após o nome «Absalão».
