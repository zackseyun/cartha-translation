  text: 'And the king’s letter contained this: “King Antiochus to his brother Lysias[b][a], greetings.”'
translation:
  language: pt
  text: A carta do rei dizia o seguinte:[a] “O rei Antíoco saúda seu irmão[b] Lísias.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “A carta do rei continha assim”. A expressão introduz o conteúdo da carta e também pode ser traduzida por “era a seguinte”.
    reason: lexical_alternative
  - marker: b
    text: “Irmão” pode indicar parentesco literal ou ser uma forma convencional de tratamento no ambiente régio e cortesão; o grego não esclarece qual sentido está em vista.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡ ... ἐπιστολή
  choice: A carta do rei
  rationale: ἐπιστολή designa uma carta ou comunicação escrita; “carta” é a forma moderna e natural em português. O genitivo τοῦ βασιλέως foi expresso por “do rei”.
- source_word: περιεῖχεν οὕτως
  choice: dizia o seguinte
  rationale: A expressão significa literalmente que a carta “continha assim”. Em português, “dizia o seguinte” introduz naturalmente o teor da carta sem alterar o sentido.
- source_word: Βασιλεὺς Ἀντίοχος
  choice: O rei Antíoco
  rationale: Βασιλεύς funciona como título do remetente. O artigo, embora não esteja expresso no grego, é natural e normalmente necessário em português.
- source_word: τῷ ἀδελφῷ
  choice: seu irmão
  rationale: O dativo identifica o destinatário, e o possessivo explicita de modo idiomático a relação implícita na fórmula epistolar. “Irmão” preserva a ambiguidade entre parentesco literal e tratamento régio ou cortesão.
- source_word: Λυσίᾳ
  choice: Lísias
  rationale: Transliteração portuguesa tradicional do nome próprio grego, com acento conforme a pronúncia corrente.
- source_word: χαίρειν
  choice: saúda
  rationale: Na abertura de cartas gregas, χαίρειν é uma fórmula convencional de saudação. “Saúda” integra essa fórmula com naturalidade à sintaxe portuguesa; a tradução lexical “alegrar-se” seria enganosa neste contexto.
