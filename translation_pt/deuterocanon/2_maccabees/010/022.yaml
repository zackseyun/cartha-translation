review_pass:
  verdict: revise
  source_fidelity: A introdução reproduz adequadamente a ideia de que a carta do rei introduzia o seu conteúdo. Contudo, a fórmula epistolar grega «Βασιλεὺς Ἀντίοχος τῷ ἀδελφῷ Λυσίᾳ χαίρειν» é mais bem preservada em português como cabeçalho de carta, com destinatário e saudação explícitos, do que como a oração declarativa «O rei Antíoco saúda...».
  naturalness: «Tinha o seguinte teor» é moderno e natural para introduzir o texto de uma carta. «Rei Antíoco, ao seu irmão Lísias, saudações» é uma fórmula portuguesa clara, formal e idiomática, que conserva a concisão do original.
  terminology: «Carta», «rei», «irmão», «Lísias» e «saudações» são escolhas adequadas. «Irmão» mantém corretamente a indeterminação entre parentesco literal e tratamento dinástico/cortesão.
  issues:
  - severity: low
    issue: A saudação foi convertida em oração declarativa.
    rationale: «O rei Antíoco saúda seu irmão Lísias» comunica o sentido geral, mas reduz a forma de cabeçalho epistolar do grego. «Rei Antíoco, ao seu irmão Lísias, saudações» representa mais diretamente os elementos remitente–destinatário–saudação.
  - severity: high
    issue: A referência indicada parece não corresponder ao texto grego fornecido.
    rationale: O texto apresentado é normalmente numerado como 2 Macabeus 11:22, e não 10:22. Isso exige conferência editorial antes da publicação, embora não altere a tradução do texto grego fornecido.
  revised_text: A carta do rei tinha o seguinte teor:[a] “Rei Antíoco, ao seu irmão[b] Lísias, saudações.”
  revised_footnotes:
  - marker: a
    text: Literalmente, “A carta do rei continha assim”. A expressão introduz o conteúdo da carta e também pode ser traduzida por “era a seguinte”.
    reason: lexical_alternative
  - marker: b
    text: “Irmão” pode indicar parentesco literal ou ser uma forma convencional de tratamento no ambiente régio e cortesão; o grego não esclarece qual sentido está em vista.
    reason: cultural_note
  revision_rationale: 'A revisão conserva o sentido da introdução e torna explícita, em forma epistolar portuguesa, a estrutura do original: remetente («Rei Antíoco»), destinatário («ao seu irmão Lísias») e saudação («saudações»). As notas permanecem devidamente ancoradas e preservam a ambiguidade de «irmão». A discrepância de referência deve ser resolvida editorialmente.'
