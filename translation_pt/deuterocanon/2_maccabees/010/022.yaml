  source_fidelity: 'O texto grego é uma fórmula de abertura epistolar: “Rei Antíoco, a seu irmão Lísias, saudações.” A versão proposta comunica o sentido geral, mas reestrutura a fórmula como uma oração verbal (“saúda”), em vez de preservar mais claramente o cabeçalho da carta e o substantivo de saudação implícito em χαίρειν.'
