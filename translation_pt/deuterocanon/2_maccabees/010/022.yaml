    rationale: '“O rei Antíoco saúda seu irmão Lísias” é idiomático, mas Βασιλεὺς Ἀντίοχος τῷ ἀδελφῷ Λυσίᾳ χαίρειν é mais precisamente uma rubrica de carta: remetente, destinatário e “saudações”.'
