lexical_decisions:
- source_word: συναθροίσας
  choice: Depois de reunir
  rationale: O particípio aoristo indica uma ação anterior ao verbo principal; a formulação preserva com naturalidade essa sequência.
- source_word: περὶ τὰς ὀκτὼ μυριάδας
  choice: cerca de oitenta mil homens
  rationale: μυριάς designa dez mil; oito miríades equivalem a oitenta mil. περί diante do numeral indica aproximação, e “homens” é explicitado pelo contexto militar.
- source_word: τὴν ἵππον ἅπασαν
  choice: toda a cavalaria
  rationale: Em contexto militar, ἵππος pode designar coletivamente a cavalaria; ἅπασαν ressalta a totalidade.
- source_word: παρεγένετο ἐπὶ τοὺς Ἰουδαίους
  choice: avançou contra os judeus
  rationale: παραγίνομαι com ἐπί e acusativo, neste contexto bélico, descreve movimento hostil contra um adversário, não simples chegada.
- source_word: λογιζόμενος
  choice: pensando em
  rationale: Preserva o aspecto mental de cálculo ou intenção sem tornar o propósito mais categórico do que o grego exige.
- source_word: τὴν μὲν πόλιν
  choice: a cidade
  rationale: A referência definida é a Jerusalém no contexto. A partícula μέν introduz um contraste cuja continuação está no versículo seguinte.
- source_word: Ἕλλησιν
  choice: para os gregos
  rationale: O dativo indica aqueles em cujo benefício ou para cujo uso a cidade seria transformada; “gregos” é claro e acessível.
- source_word: οἰκητήριον ποιήσειν
  choice: transformar a cidade em lugar de moradia
  rationale: A construção expressa a intenção de fazer da cidade um local habitável ou residência para os gregos.
