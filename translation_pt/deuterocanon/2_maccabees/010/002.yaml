  text: After gathering about eighty thousand men and all the cavalry[a], he came against the Jews, thinking to make the city a dwelling place for Greeks[b],
translation:
  language: pt
  text: Depois de reunir cerca de oitenta mil homens[a] e toda a cavalaria, ele avançou contra os judeus, pensando em transformar a cidade em lugar de moradia para os gregos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “cerca de oito miríades”, isto é, cerca de oitenta mil.
