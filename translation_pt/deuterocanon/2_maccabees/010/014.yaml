  yaml_path: translation/deuterocanon/2_maccabees/010/014.yaml
  text: He persuaded him to come to terms on all the just demands[a], and that he would also persuade the king[b], compelling him to become their friend.
translation:
  language: pt
  text: Ele o convenceu de que chegaria a um acordo em tudo o que era justo[a] e de que também convenceria o rei[b], obrigando-o a tornar-se amigo deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego é raro e difícil neste testemunho. Também pode significar “reconciliar-se” ou “resolver a questão”, em condições justas.
    reason: textual_variant
  - marker: b
    text: 'Ou: “porque também convenceria o rei”. O termo grego pode introduzir tanto o conteúdo da persuasão quanto a razão dela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεισεν / πείσει
  choice: convenceu / convenceria
  rationale: As duas formas de πείθω foram traduzidas com o mesmo verbo para preservar a repetição deliberada do grego. O aoristo é expresso pelo pretérito perfeito, e o futuro dentro do discurso indireto, pelo futuro do pretérito.
- source_word: συλλύεσθαι
  choice: chegar a um acordo
  rationale: O verbo é raro e difícil neste testemunho. No contexto diplomático, indica mais provavelmente reconciliação ou resolução negociada; a expressão escolhida comunica esse sentido sem restringi-lo a um acordo jurídico formal.
- source_word: ἐπὶ πᾶσι τοῖς δικαίοις
  choice: em tudo o que era justo
  rationale: O adjetivo substantivado refere-se ao conjunto das matérias ou condições consideradas justas. A formulação preserva a abrangência de πᾶσι e evita acrescentar a noção específica de exigências, que não está explícita.
- source_word: διότι καὶ τὸν βασιλέα πείσει
  choice: e de que também convenceria o rei
  rationale: διότι pode introduzir conteúdo ou causa. A tradução principal entende a oração como parte daquilo de que ele convenceu o interlocutor, mantendo em nota a leitura causal.
- source_word: φίλον αὐτοῖς
  choice: amigo deles
  rationale: Reproduz de modo natural a construção grega e permite o sentido político de alguém favorável a eles, sem reduzir φίλος a intimidade pessoal.
- source_word: ἀναγκάζων γενέσθαι
  choice: obrigando-o a tornar-se
  rationale: Mantém a força coercitiva de ἀναγκάζω e o aspecto resultativo de γενέσθαι. O pronome retoma naturalmente o rei.
