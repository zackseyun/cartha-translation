base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/006.yaml
  text: But when those around Makkabaios[a], while besieging it, gained possession of the strongholds, with lamentations and tears they, together with the crowds[b], pleaded with the Lord to send a good angel for the salvation of Israel.
translation:
  language: pt
  text: Quando os que estavam com Macabeu tomaram posse das fortalezas, enquanto Macabeu o sitiava,[a] eles, junto com as multidões, suplicaram, entre lamentações e lágrimas, ao Senhor que enviasse um anjo bom[b] para a salvação de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz literalmente “enquanto Macabeu o sitiava”. O pronome singular “o” (αὐτόν) tem antecedente dependente do contexto anterior, que não é explicitado neste versículo.
    reason: alternative_reading
  - marker: b
    text: Ou “um anjo benévolo”. A expressão grega “um anjo bom” pode descrever tanto o caráter do anjo quanto sua atuação benéfica.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ μετέλαβον
  choice: Quando ... souberam
  rationale: 'Neste contexto, μεταλαμβάνω introduz a informação recebida, seguida pela construção participial acusativa: eles souberam que alguém estava sitiando as fortalezas. Traduzir como tomada de posse faria de τὰ ὀχυρώματα objeto do verbo principal e não explicaria adequadamente πολιορκοῦντα αὐτόν.'
- source_word: οἱ περὶ τὸν Μακκαβαῖον
  choice: os que estavam com Macabeu
  rationale: A expressão idiomática designa o grupo ou os companheiros de Macabeu, sem especificar patente militar nem número além do que o grego afirma.
- source_word: πολιορκοῦντα αὐτὸν τὰ ὀχυρώματα
  choice: que ele estava sitiando as fortalezas
  rationale: αὐτόν funciona como sujeito acusativo da ação expressa pelo particípio, e τὰ ὀχυρώματα como seu objeto. O antecedente de 'ele' depende do contexto anterior e permanece implícito no trecho fornecido.
- source_word: τὰ ὀχυρώματα
  choice: as fortalezas
  rationale: O substantivo refere-se a lugares ou posições fortificadas; 'fortalezas' é preciso, corrente e adequado ao contexto militar.
- source_word: μετὰ ὀδυρμῶν καὶ δακρύων
  choice: entre lamentações e lágrimas
  rationale: Preserva a intensidade emocional e o paralelismo do grego em português natural e digno.
- source_word: ἱκέτευον
  choice: suplicaram
  rationale: O verbo exprime um pedido insistente e humilde, mais forte que simplesmente 'pediram'.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: No contexto das Escrituras judaicas, κύριος é a designação reverente de Deus e se traduz tradicionalmente por 'Senhor'.
- source_word: ἀγαθὸν ἄγγελον
  choice: um anjo bom
  rationale: Mantém o sentido direto de ἀγαθός sem definir se a bondade descreve o caráter do anjo ou sua atuação benéfica.
- source_word: ἀποστεῖλαι πρὸς σωτηρίαν τῷ Ἰσραήλ
  choice: que enviasse ... para a salvação de Israel
  rationale: Conserva a formulação final do grego e a amplitude de σωτηρία, que pode abranger salvação, livramento ou preservação.
theological_decisions:
- issue: Sentido de ἀγαθὸν ἄγγελον
  choice: um anjo bom
  alternative: um anjo benévolo
  rationale: O texto não identifica o anjo nem define uma categoria doutrinária. A tradução literal preserva a reserva do grego e sua possível referência tanto ao caráter quanto à função benéfica do anjo.
- issue: Amplitude de σωτηρία
  choice: salvação de Israel
  alternative: livramento de Israel
  rationale: ‘Salvação’ preserva a amplitude lexical e teológica do termo sem restringi-lo apenas ao resgate militar imediato, embora esse sentido esteja presente no contexto.
translation_notes:
  register: 'Português moderno, claro e digno, com legibilidade brasileira. A sintaxe foi reorganizada apenas o necessário para tornar explícita a relação gramatical do grego. Há uma discrepância importante nos dados fornecidos: o texto grego citado corresponde tradicionalmente a 2 Macabeus 11:6, não a 10:6; o rascunho traduz fielmente o texto grego apresentado.'
