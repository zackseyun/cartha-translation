translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Atenção editorial indispensável: o texto grego fornecido não corresponde a 2 Macabeus 10:27 nas edições correntes; ele corresponde a 2 Macabeus 11:27. Por isso, esta tradução representa fielmente o trecho grego fornecido, mas não deve ser publicada sob a referência 2MA.10.27 sem correção ou nova verificação da fonte.'
