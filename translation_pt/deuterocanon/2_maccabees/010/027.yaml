  text: 'And to the nation the king’s letter was as follows: “King Antiochus to the council of elders of the Jews and to the other Jews[b][a], greetings.”'
translation:
  language: pt
  text: 'Quanto à nação, a carta do rei era a seguinte: “O rei Antíoco, ao conselho de anciãos[a] dos judeus e aos demais judeus[b]: saudações.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego designa um órgão oficial formado por anciãos.
    reason: cultural_note
  - marker: b
    text: Ou “aos outros judeus” ou “ao restante dos judeus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸς δὲ τὸ ἔθνος
  choice: Quanto à nação
  rationale: A construção introduz a carta dirigida ao povo judeu como corpo coletivo. “Quanto à nação” preserva a transição marcada por δέ e o sentido corporativo de ἔθνος, sem sugerir que essas palavras façam parte do cabeçalho citado.
- source_word: ἡ τοῦ βασιλέως ἐπιστολὴ τοιαύδε ἦν
  choice: a carta do rei era a seguinte
  rationale: Formulação portuguesa natural para introduzir o teor de uma correspondência, preservando o valor de τοιαύδε.
- source_word: Βασιλεὺς Ἀντίοχος
  choice: O rei Antíoco
  rationale: Mantém a forma titular do remetente no início do cabeçalho. O artigo é natural em português nesse tipo de fórmula.
- source_word: τῇ γερουσίᾳ τῶν Ἰουδαίων
  choice: ao conselho de anciãos dos judeus
  rationale: γερουσία designa um órgão oficial composto de anciãos. “Conselho de anciãos” comunica a natureza institucional sem recorrer a transliteração nem importar associações romanas de “senado”.
- source_word: τοῖς ἄλλοις Ἰουδαίοις
  choice: aos demais judeus
  rationale: ἄλλοις distingue o restante da população judaica do conselho já mencionado. “Demais” é claro, atual e ligeiramente mais formal que “outros” neste cabeçalho real.
- source_word: χαίρειν
  choice: saudações
  rationale: No início de cartas, χαίρειν é uma fórmula epistolar convencional; “saudações” traduz sua função, em vez do sentido lexical isolado “alegrar-se”.
