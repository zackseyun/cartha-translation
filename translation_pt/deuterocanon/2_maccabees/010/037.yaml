translation_notes:
  register: Português moderno, amplamente internacional, com boa legibilidade no Brasil. A construção é direta e digna; “vocês” comunica naturalmente o plural de segunda pessoa. A nota de referência é necessária porque há incompatibilidade substancial entre a identificação solicitada e o texto grego apresentado.
