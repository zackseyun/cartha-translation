translation:
  language: pt
  text: Por isso, apressem-se e enviem algumas pessoas, para que também possamos saber qual é a posição de vocês.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de que tipo de mente/opinião vocês são”. A expressão pode se referir à disposição, ao parecer, à resolução ou à intenção de vocês.
