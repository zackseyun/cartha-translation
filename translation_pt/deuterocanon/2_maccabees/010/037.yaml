  text: Therefore hurry[a], and send some men, so that we too may learn what your intention is.
translation:
  language: pt
  text: Por isso, apressem-se e enviem algumas pessoas, para que nós também saibamos qual é a disposição de vocês.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de que tipo de mente/opinião vocês são”. A expressão pode se referir à disposição, ao parecer, à resolução ou à intenção deles.
    reason: lexical_alternative
  - marker: b
    text: O texto grego fornecido corresponde a 2 Macabeus 11:37 na numeração das edições correntes, e não a 10:37.
    reason: source_reference_mismatch
lexical_decisions:
- source_word: διὸ
  choice: Por isso
  rationale: Conjunção inferencial que liga o pedido ao contexto anterior; a forma é natural e mantém a relação lógica.
- source_word: σπεύσατε
  choice: apressem-se
  rationale: O imperativo aoristo exige ação imediata; “apressem-se” transmite a urgência em português atual e digno.
- source_word: πέμψατέ τινας
  choice: enviem algumas pessoas
  rationale: τινας é um plural indefinido, sem substantivo expresso. “Algumas pessoas” evita acrescentar ao grego que seriam necessariamente homens, mensageiros ou representantes.
- source_word: ὅπως
  choice: para que
  rationale: Introduz a finalidade do envio, de modo claro e idiomático.
- source_word: καὶ ἡμεῖς
  choice: nós também
  rationale: Preserva tanto a inclusão expressa por καί quanto a ênfase do pronome ἡμεῖς.
- source_word: ἐπιγνῶμεν
  choice: saibamos
  rationale: O subjuntivo aoristo de ἐπιγινώσκω indica chegar a saber ou averiguar; “saibamos” é natural e não exagera a força do verbo composto.
- source_word: ὁποῖοί ἐστε γνώμης
  choice: qual é a disposição de vocês
  rationale: A expressão grega significa literalmente algo como “de que tipo de mente/opinião vocês são”. “Disposição” conserva melhor a abertura entre atitude, parecer, resolução e intenção do que uma tradução restrita a apenas uma dessas ideias.
