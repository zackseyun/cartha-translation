  yaml_path: translation/deuterocanon/2_maccabees/010/015.yaml
  text: But Maccabeus agreed to everything that Lysias urged, being concerned for the common good; for whatever Maccabeus submitted in writing to Lysias concerning the Jews, the secretary approved.
translation:
  language: pt
  text: Mas Macabeu concordou com tudo o que Lísias solicitava, tendo em vista o que era vantajoso; pois tudo o que Macabeu apresentou por escrito a Lísias a respeito dos judeus, o secretário aprovou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπένευσε
  choice: concordou
  rationale: Expressa o assentimento de Macabeu às solicitações de Lísias, sem acrescentar a ideia mais específica de um acordo formal.
- source_word: παρεκάλει
  choice: solicitava
  rationale: O verbo pode indicar apelo, pedido ou exortação; no contexto de negociação, “solicitava” preserva o caráter insistente sem exagerá-lo.
- source_word: τοῦ συμφέροντος φροντίζων
  choice: tendo em vista o que era vantajoso
  rationale: Mantém o sentido amplo de cuidar ou considerar aquilo que convém, sem inserir “bem comum”, noção possível, mas não expressa diretamente pelo grego.
- source_word: ἔδωκεν ... διὰ γραπτῶν
  choice: apresentou por escrito
  rationale: Traduz idiomaticamente a entrega de propostas ou condições em documentos escritos.
- source_word: συνεχώρησεν
  choice: aprovou
  rationale: No contexto, indica consentimento ou concessão às propostas escritas; “aprovou” é natural e conserva o sentido administrativo.
- source_word: ὁ γραμματεύς
  choice: o secretário
  rationale: Equivalente direto e contextual para o oficial designado pelo substantivo grego.
