lexical_decisions:
- source_word: ἐπὶ τοῦ πατρὸς ἡμῶν ... μεταστάντος
  choice: visto que nosso pai partiu
  rationale: A construção participial fornece a circunstância causal e temporal da declaração régia; «visto que» exprime naturalmente esse valor, enquanto «nosso pai» mantém a referência direta do grego.
- source_word: εἰς θεοὺς
  choice: para junto dos deuses
  rationale: Preserva a linguagem explicitamente politeísta e o eufemismo régio helenístico, sem reduzi-lo simplesmente a «morreu»; «para junto dos» soa idiomático em português e mantém a ideia de passagem ao âmbito dos deuses.
- source_word: βουλόμενοι
  choice: desejando
  rationale: O particípio ligado ao remetente régio é mantido como particípio, preservando a sintaxe contínua da carta e seu registro formal.
- source_word: τοὺς ἐκ τῆς βασιλείας
  choice: os habitantes do reino
  rationale: No contexto administrativo, a expressão designa as pessoas pertencentes ao âmbito do reino. «Habitantes» é claro e evita o possível sentido dinástico de «os do reino».
- source_word: ἀπερισπάστως
  choice: livres de perturbações
  rationale: O advérbio indica ausência de distração, impedimento ou agitação. Nesta conjuntura política, «livres de perturbações» comunica melhor a dimensão pública do que uma formulação meramente interior.
- source_word: ὄντας γενέσθαι
  choice: livres de perturbações
  rationale: A expressão comprimida, literalmente próxima de «venham a estar sem perturbação», é vertida de modo natural como o estado pretendido para os habitantes, sem acrescentar uma ação ausente do texto.
- source_word: πρὸς τὴν τῶν Ἰουδαίων ἐπιμέλειαν
  choice: se dediquem aos assuntos dos judeus
  rationale: ἐπιμέλεια abrange cuidado, atenção e administração. «Dedicar-se aos assuntos» conserva o teor administrativo e evita pressupor que se trate exclusivamente de cuidado benevolente.
theological_decisions:
- issue: Eufemismo régio helenístico εἰς θεοὺς μεταστάντος
  choice: partiu para junto dos deuses
  alternative: morreu; faleceu
  rationale: A formulação politeísta pertence à perspectiva da corte selêucida relatada no texto. Preservá-la representa a linguagem da fonte sem endossá-la nem neutralizá-la teologicamente.
translation_notes:
  register: Português moderno, digno e acessível, com tonalidade própria de correspondência régia. A oração permanece aberta ao versículo seguinte, como no fragmento grego fornecido. O marcador [a] aparece imediatamente após a expressão explicada.
