  text: since our father has departed to the gods[a], and since we desire that those in the kingdom, being free from disturbance, should give attention to the affairs of the Jews,
translation:
  language: pt
  text: visto que nosso pai partiu para junto dos deuses[a], e desejando que os habitantes do reino possam, sem perturbação, dedicar-se aos assuntos dos judeus,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «partiu para junto dos deuses»; eufemismo régio helenístico para a morte, expresso da perspectiva da corte do remetente.
