base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/008.yaml
  text: And while they were there near Jerusalem[a], a horseman appeared, going before them[b], clothed in white and brandishing golden armor.
translation:
  language: pt
  text: Enquanto estavam ali, perto de Jerusalém, apareceu um cavaleiro[a] que ia à frente deles[b], vestido de branco e brandindo uma armadura completa de ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto não identifica explicitamente o cavaleiro. A descrição pode sugerir uma figura celestial ou angelical, mas o grego não o declara.
    reason: alternative_reading
  - marker: b
    text: Ou “os precedia”. A expressão grega indica que ele estava ou avançava diante deles e, no contexto, também pode sugerir que os guiava.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτόθι δὲ πρὸς τοῖς Ἱεροσολύμοις ὄντων
  choice: Enquanto estavam ali, perto de Jerusalém
  rationale: A construção participial estabelece a circunstância de fundo, ao mesmo tempo temporal e local. “Perto de Jerusalém” expressa o sentido local de πρός com dativo sem sugerir movimento em direção à cidade.
- source_word: ἐφάνη
  choice: apareceu
  rationale: Expressa de modo natural o surgimento repentino e visível da figura, sem definir a natureza da aparição.
- source_word: προηγούμενος αὐτῶν
  choice: que ia à frente deles
  rationale: Preserva a ideia básica de estar ou avançar diante do grupo, sem afirmar de modo inequívoco que a figura os comandava ou guiava.
- source_word: ἔφιππος
  choice: um cavaleiro
  rationale: O adjetivo grego significa literalmente “montado” ou “a cavalo”; a forma substantivada “um cavaleiro” é clara e idiomática em português.
- source_word: ἐν λευκῇ ἐσθῆτι
  choice: vestido de branco
  rationale: Mantém o destaque visual da roupa branca sem especificar uma peça de vestuário que o grego não identifica.
- source_word: πανοπλίαν χρυσῆν
  choice: uma armadura completa de ouro
  rationale: πανοπλία designa o conjunto completo do equipamento de combate. “Armadura completa” conserva essa extensão melhor do que apenas “armadura”, e “de ouro” reproduz a descrição χρυσῆν sem decidir se era ouro maciço ou aparência dourada.
- source_word: κραδαίνων
  choice: brandindo
  rationale: Conserva o movimento vigoroso expresso pelo particípio e a imagem marcial, mesmo que brandir uma armadura seja uma formulação incomum.
theological_decisions:
- issue: Natureza da aparição
  choice: Descrever a figura apenas como “um cavaleiro”
  alternative: “um cavaleiro celestial” ou “um anjo a cavalo”
  rationale: O texto sugere uma manifestação sobrenatural, mas não identifica explicitamente a figura como anjo ou outro ser celestial. A tradução mantém essa abertura.
- issue: Função da figura que vai à frente
  choice: “ia à frente deles”
  alternative: “os guiava” ou “os liderava”
  rationale: O particípio pode sugerir condução no contexto, mas declara diretamente apenas que a figura seguia adiante deles. A tradução evita transformar a possível implicação em afirmação explícita.
translation_notes:
  register: Português atual, digno e de leitura ampla, com construção narrativa direta. Conservou-se a formulação incomum “brandindo uma armadura completa de ouro” para refletir a imagem específica do grego, sem substituí-la por uma arma não mencionada no texto.
