  yaml_path: translation/deuterocanon/2_maccabees/010/010.yaml
  text: As before[a], being in battle array and having the ally from heaven[b], because the Lord had shown them mercy.
translation:
  language: pt
  text: Como antes, em ordem de batalha[a] e tendo o aliado vindo do céu[b], pois o Senhor tivera misericórdia deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como anteriormente, estando preparados”, caso a expressão grega seja entendida de modo mais geral como prontidão ou equipamento, e não especificamente como ordem militar.'
    reason: lexical_alternative
  - marker: b
    text: 'O grego é condensado; mais literalmente: “tendo o aliado vindo do céu, tendo o Senhor tido misericórdia deles”.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πρόηγον
  choice: como antes
  rationale: A expressão adverbial remete à ocasião anterior e estabelece uma comparação, em vez de indicar apenas um tempo passado indefinido.
- source_word: ἐν διασκευῇ
  choice: em formação de batalha
  rationale: διασκευή pode indicar preparação, equipamento ou disposição; no contexto militar, a expressão comunica de modo natural que estavam organizados para o combate, sem eliminar a alternativa mais ampla indicada em nota.
- source_word: σύμμαχον
  choice: aliado
  rationale: O termo designa literalmente alguém que combate ao lado de outro; “aliado” preserva sua metáfora militar melhor que o termo mais genérico “auxiliador”.
- source_word: τὸν ἀπʼ οὐρανοῦ σύμμαχον
  choice: o aliado vindo do céu
  rationale: Mantém tanto a imagem militar quanto a origem celeste da ajuda, sem identificar o referente de maneira mais explícita do que o grego.
- source_word: ἔχοντες
  choice: tendo
  rationale: Reproduz diretamente o particípio e liga a situação dos combatentes à declaração seguinte sobre a misericórdia do Senhor.
- source_word: ἐλεήσαντος αὐτοὺς τοῦ κυρίου
  choice: pois o Senhor teve misericórdia deles
  rationale: Expressa de modo natural o genitivo absoluto como causa ou fundamento da ajuda celeste, preservando o tema da misericórdia.
theological_decisions:
- issue: Referente e natureza da ajuda celestial
  choice: Manter “o aliado vindo do céu” sem identificar explicitamente esse aliado.
  alternative: “Deus como seu aliado vindo do céu” ou “o auxiliador celestial”.
  rationale: O texto atribui a assistência à misericórdia do Senhor, mas emprega uma metáfora militar e não explicita diretamente a identidade do “aliado”; a tradução conserva essa tensão.
- issue: Relação lógica do genitivo absoluto
  choice: 'Traduzir com valor causal: “pois o Senhor teve misericórdia deles”.'
  alternative: “quando o Senhor teve misericórdia deles” ou, mais literalmente, “tendo o Senhor tido misericórdia deles”.
  rationale: A leitura causal explica naturalmente por que dispunham do aliado celeste, embora a construção grega compacta também permita uma ligação circunstancial menos definida.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com boa legibilidade brasileira. A estrutura participial e algo fragmentária do grego foi mantida, pois o versículo parece continuar o contexto anterior; as notas registram a amplitude lexical e a sintaxe comprimida.
