base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/025.yaml
  text: Therefore[a], since we choose that this nation also should be free from disturbance, we judge that the sanctuary should be restored to them[c][b], and that they should live according to the customs of their ancestors.
translation:
  language: pt
  text: Portanto, visto que decidimos[a] que também esta nação fique livre de agitação, determinamos[b] que o santuário[c] lhes seja restituído e que vivam[d] segundo os costumes de seus antepassados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escolhemos”. O particípio grego αἱρούμενοι indica uma escolha ou decisão que serve de fundamento para a determinação seguinte.
    reason: lexical_alternative
  - marker: b
    text: Ou “julgamos” ou “decretamos”. Aqui, κρίνομεν pertence à linguagem administrativa de uma decisão oficial.
    reason: lexical_alternative
  - marker: c
    text: “O santuário” também pode ser traduzido por “o templo”, pois τὸ ἱερόν pode designar o complexo sagrado do templo.
    reason: lexical_alternative
  - marker: d
    text: O verbo traduzido por “vivam” também pode sugerir a organização da vida comunitária ou cívica, e não apenas a conduta particular.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱρούμενοι
  choice: visto que decidimos
  rationale: O particípio apresenta a decisão prévia como fundamento da determinação oficial. A formulação preserva o sentido deliberativo de αἱρέομαι e soa natural em português.
- source_word: ἔθνος
  choice: nação
  rationale: No contexto administrativo régio, refere-se ao povo judeu como coletividade distinta; “nação” conserva essa dimensão coletiva e política.
- source_word: ἐκτὸς ταραχῆς εἶναι
  choice: fique livre de agitação
  rationale: A expressão indica ausência de tumulto, perturbação ou desordem pública. “Agitação” mantém essa nuance sem restringi-la indevidamente.
- source_word: κρίνομεν
  choice: determinamos
  rationale: Neste documento oficial, o verbo expressa uma resolução administrativa. “Determinamos” comunica melhor esse valor do que o sentido moderno mais comum de “julgamos”.
- source_word: τὸ ἱερὸν
  choice: o santuário
  rationale: Ἱερόν pode designar o templo ou o conjunto sagrado. “Santuário” preserva a referência cultual sem definir em excesso sua extensão arquitetônica.
- source_word: ἀποκατασταθῆναι
  choice: seja restituído
  rationale: O infinitivo passivo indica a devolução ou restauração do santuário ao povo e à sua condição anterior; “restituído” ressalta adequadamente o complemento αὐτοῖς, “a eles”.
- source_word: πολιτεύεσθαι
  choice: vivam
  rationale: Com a expressão relativa aos costumes ancestrais, o verbo diz respeito ao modo de vida da comunidade. “Vivam” é claro e natural, enquanto a nota preserva sua possível dimensão cívica.
- source_word: κατὰ τὰ ἐπὶ τῶν προγόνων αὐτῶν ἔθη
  choice: segundo os costumes de seus antepassados
  rationale: A expressão aponta para práticas tradicionais recebidas dos antepassados. A tradução é clara e conserva a referência ancestral.
