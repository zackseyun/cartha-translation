  text: For in this way you have not escaped the judgment of God[a], the all-powerful overseer.
translation:
  language: pt
  text: Pois assim você não escapou[a] do julgamento de Deus, o Todo-Poderoso, que tudo observa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego transmitido em Swete diz literalmente: “Pois assim você escapou do julgamento de Deus, o Todo-Poderoso, que tudo observa”. O contexto favorece fortemente o sentido negativo: “você não escapou”.'
    reason: textual_variant
lexical_decisions:
- source_word: οὕτω
  choice: assim
  rationale: Retoma de modo natural a conduta mencionada no contexto anterior, preservando a ligação adverbial sem explicá-la além do texto.
- source_word: γὰρ
  choice: pois
  rationale: Mantém a relação explicativa com a declaração precedente.
- source_word: κρίσιν
  choice: julgamento
  rationale: Expressa a avaliação e a consequente ação judicial divina sem restringir o sentido a uma sentença formal.
- source_word: ἐκπέφευγας
  choice: você não escapou
  rationale: O perfeito indica uma tentativa de fuga cujo resultado permanece. Embora a forma grega transmitida seja afirmativa, o contexto exige o sentido negativo; a dificuldade textual é registrada em nota.
- source_word: παντοκράτορος
  choice: Todo-Poderoso
  rationale: Comunica de maneira clara e corrente o domínio e poder irrestritos de Deus, preservando o caráter de título.
- source_word: ἐπόπτου
  choice: que tudo vê
  rationale: Transmite em português natural a ideia daquele que observa e supervisiona, especialmente adequada ao contexto de um julgamento do qual nada fica oculto.
- source_word: θεοῦ
  choice: Deus
  rationale: Representa diretamente o genitivo dependente de “julgamento”, com os títulos divinos apresentados em seguida.
theological_decisions:
- issue: Tradução dos títulos divinos παντοκράτορος ἐπόπτου θεοῦ
  choice: Deus, o Todo-Poderoso que tudo vê
  alternative: o Deus todo-poderoso e observador; Deus, o Todo-Poderoso que vela por tudo
  rationale: A formulação conserva tanto a onipotência quanto a função de observar, sem introduzir terminologia doutrinária específica. “Que tudo vê” é mais natural e transparente em português do que o substantivo “observador” ou “supervisor” aplicado a Deus.
- issue: Forma verbal transmitida sem negação explícita
  choice: você não escapou
  alternative: você escapou
  rationale: O texto de Swete traz formalmente uma afirmação, mas o contexto imediato adverte o perseguidor de que ele não poderá evitar o julgamento divino. A tradução adota o sentido contextual provável e informa com transparência a forma transmitida em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O pronome “você” corresponde ao singular dirigido diretamente ao perseguidor. A ordem da frase preserva o vínculo explicativo e mantém os títulos divinos explícitos sem tornar a construção artificial.
