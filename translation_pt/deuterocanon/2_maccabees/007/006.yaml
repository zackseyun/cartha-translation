base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/006.yaml
  text: The Lord God is watching[a], and in truth he is being moved to compassion for us, just as Moses made clear in the song that testifies openly, saying[c][b], “And he will be moved to compassion for his slaves.”
translation:
  language: pt
  text: 'O Senhor Deus está vendo e, de fato, está sendo movido à compaixão por nós[a], assim como Moisés deixou claro por meio do cântico que testemunha abertamente contra eles, dizendo: “E ele será movido à compaixão por seus escravos[c]”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “está sendo consolado [...] será consolado”. O verbo grego pode exprimir consolo, exortação ou compaixão; aqui, o contexto e a citação do Cântico de Moisés favorecem o sentido de ser movido à compaixão ou voltar-se com piedade.'
    reason: lexical_alternative
  - marker: b
    text: A citação remete a Deuteronômio 32:36, onde se diz que o Senhor será movido em favor de seus escravos.
    reason: cross_reference
  - marker: c
    text: 'Ou: “seus servos”. Grego: “seus escravos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφορᾷ
  choice: está vendo
  rationale: O presente expressa observação ativa e contínua. “Está vendo” preserva essa vivacidade sem acrescentar a ideia de proteção implícita em “está velando”.
- source_word: ταῖς ἀληθείαις
  choice: de fato
  rationale: O dativo plural tem força adverbial neste contexto. “De fato” é natural em português e evita o literalismo obscuro “pelas verdades”.
- source_word: παρακαλεῖται
  choice: está sendo movido à compaixão
  rationale: A citação do Cântico de Moisés favorece o sentido de compadecer-se ou voltar-se com piedade. A formulação mantém a voz passiva e não reduz a ambiguidade lexical a um simples “tem compaixão”.
- source_word: διεσάφησεν
  choice: deixou claro
  rationale: O verbo indica tornar algo claro ou explícito; esta expressão é corrente, concisa e digna em português.
- source_word: κατὰ πρόσωπον ἀντιμαρτυρούσης
  choice: que testemunha abertamente
  rationale: A expressão conserva o motivo do cântico como testemunha e comunica a franqueza de κατὰ πρόσωπον sem o português pouco natural “testemunha diante do rosto”.
- source_word: ᾠδῆς
  choice: cântico
  rationale: “Cântico” é natural no registro bíblico português e identifica adequadamente o Cântico de Moisés.
- source_word: δούλοις
  choice: escravos
  rationale: “Escravos” torna visível a relação de posse e dependência expressa pelo termo grego, enquanto a nota registra a alternativa tradicional “servos”.
- source_word: παρακληθήσεται
  choice: será movido à compaixão
  rationale: A forma futura passiva mantém o paralelismo lexical com παρακαλεῖται e se ajusta ao sentido da alusão a Deuteronômio 32:36.
theological_decisions:
- issue: Sentido de παρακαλεῖται e παρακληθήσεται na alusão ao Cântico de Moisés
  choice: “está sendo movido à compaixão” e “será movido à compaixão”
  alternative: “está sendo consolado” e “será consolado”; ou “se compadece” e “se compadecerá”
  rationale: O contexto e a alusão a Deuteronômio favorecem compaixão ou mudança de disposição em favor do povo. A voz passiva foi mantida para não eliminar a tensão da formulação grega.
- issue: Tradução de δούλοις na citação
  choice: “seus escravos”
  alternative: “seus servos”
  rationale: “Escravos” corresponde de modo transparente ao vínculo expresso por δοῦλος. Como “servos” é tradicional e contextualmente possível, a alternativa aparece em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. “Cântico” preserva o registro bíblico sem arcaísmo excessivo; a construção passiva deliberadamente incomum conserva a forma e a tensão do grego.
