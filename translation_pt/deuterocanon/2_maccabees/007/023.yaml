base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/023.yaml
  text: Therefore the Creator of the world, who formed the origin of man and devised the origin of all things, will in mercy give back to you both breath and life, since you now disregard yourselves for the sake of his laws.
translation:
  language: pt
  text: Portanto, o Criador do mundo, que formou a origem da humanidade e concebeu a origem de todas as coisas, com misericórdia devolverá a vocês o fôlego e a vida, pois agora vocês não poupam a si mesmos por causa das leis dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τοῦ κόσμου κτίστης
  choice: o Criador do mundo
  rationale: Expressa diretamente o título grego, em linguagem natural e digna.
- source_word: ἀνθρώπου γένεσιν
  choice: a origem da humanidade
  rationale: γένεσις indica origem ou começo; 'humanidade' representa aqui ἄνθρωπος em sentido coletivo e evita restringir a referência ao sexo masculino.
- source_word: πάντων ἐξευρὼν γένεσιν
  choice: concebeu a origem de todas as coisas
  rationale: ἐξευρίσκω sugere descobrir, elaborar ou conceber; neste contexto criacional, 'concebeu' preserva a ideia de determinação sábia sem sugerir que Deus encontrou algo previamente desconhecido.
- source_word: τὸ πνεῦμα καὶ τὴν ζωὴν
  choice: o fôlego e a vida
  rationale: πνεῦμα pode significar espírito, sopro ou fôlego. No contexto da restauração da vida após o martírio, 'fôlego' mantém a dimensão vital concreta e evita impor uma antropologia técnica.
- source_word: ὑπερορᾶτε ἑαυτοὺς
  choice: vocês não poupam a si mesmos
  rationale: O sentido contextual é desconsiderar a própria preservação ou vida em fidelidade às leis de Deus; esta formulação é mais natural em português do que uma tradução literal como 'desprezam a si mesmos'.
theological_decisions:
- issue: Restauração divina após a morte
  choice: devolverá a vocês o fôlego e a vida
  alternative: devolverá a vocês o espírito e a vida
  rationale: A tradução afirma a esperança de restauração presente no texto sem especificar além dele a relação entre espírito, corpo e ressurreição.
- issue: Motivo do martírio
  choice: por causa das leis dele
  alternative: por amor às leis dele
  rationale: A expressão causal traduz διά com acusativo sem acrescentar uma caracterização afetiva que não está explicitamente formulada.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural 'vocês' de ampla legibilidade brasileira. A sintaxe mantém o encadeamento solene do grego, mas evita literalismos pouco naturais.
