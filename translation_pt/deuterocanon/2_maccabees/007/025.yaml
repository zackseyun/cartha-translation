  text: But since the young man was paying no attention at all, the king called the mother to him and urged her to become an adviser to the youth for his preservation.
translation:
  language: pt
  text: Mas, como o jovem não dava ouvidos de modo algum,[a] o rei chamou a mãe para junto de si e a exortou a aconselhar o rapaz para preservar-lhe a vida.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não lhe dava nenhuma atenção”. O grego enfatiza a recusa completa em atender ao que era dito.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “para sua segurança”, “para seu livramento” ou “para sua salvação”. O termo grego pode abranger preservação, segurança, livramento e salvação; neste contexto imediato, refere-se sobretudo à preservação da vida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ... νεανίου
  choice: o jovem
  rationale: Traduz naturalmente o substantivo que designa um homem jovem e mantém o referente sem acrescentar informação.
- source_word: μηδαμῶς προσέχοντος
  choice: não lhe dava nenhuma atenção
  rationale: Preserva a ênfase absoluta de μηδαμῶς e expressa em português corrente a recusa completa em dar ouvidos; o pronome retoma naturalmente o rei no contexto.
- source_word: προσκαλεσάμενος
  choice: chamou a mãe
  rationale: Comunica que o rei a chamou à sua presença, sem a formalidade mais forte de “convocou”.
- source_word: παρῄνει
  choice: insistiu com ela
  rationale: Expressa a exortação persuasiva e a pressão exercida pelo rei de modo natural em português.
- source_word: γενέσθαι ... σύμβουλον
  choice: para que aconselhasse
  rationale: A formulação verbal é mais idiomática em português do que “tornar-se conselheira”, preservando a função que o rei queria que a mãe desempenhasse.
- source_word: τοῦ μειρακίου
  choice: o rapaz
  rationale: Mantém a pequena variação lexical em relação a νεανίου e designa naturalmente uma pessoa jovem.
- source_word: ἐπὶ σωτηρία
  choice: visando à sua salvação
  rationale: Mantém a amplitude semântica de σωτηρία, que pode indicar preservação da vida, livramento ou salvação; o contexto imediato aponta para a sobrevivência física, esclarecida em nota.
theological_decisions:
- issue: Sentido de σωτηρία no contexto do martírio
  choice: visando à sua salvação
  alternative: para salvar-lhe a vida; visando à sua segurança; visando ao seu livramento
  rationale: “Salvação” preserva a amplitude e a tensão do termo grego sem reduzir silenciosamente seu sentido. A nota esclarece que, no plano imediato da narrativa, o rei pretende preservar a vida do rapaz.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção foi tornada idiomática sem eliminar a ênfase do grego nem estreitar indevidamente a amplitude de σωτηρία.
