  yaml_path: translation/deuterocanon/2_maccabees/007/026.yaml
  text: And after he had urged her much[a], she agreed to persuade her son.
translation:
  language: pt
  text: E, depois de ele insistir muito com ela[a], ela concordou em persuadir o filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois de ele insistir longamente com ela, ela se comprometeu a persuadir o filho”.'
    reason: Alternativa lexical que preserva outros matizes possíveis de πολλὰ e ἐπεδέξατο.
lexical_decisions:
- source_word: πολλὰ
  choice: muito
  rationale: Acusativo adverbial que indica a intensidade ou extensão da insistência, sem especificar se ela foi longa ou repetida.
- source_word: παραινέσαντος
  choice: depois de ele insistir com ela
  rationale: O genitivo absoluto descreve a forte exortação dirigida à mãe. “Insistir com” é natural em português e se ajusta melhor ao contexto do que o mais brando “aconselhar”.
- source_word: ἐπεδέξατο
  choice: concordou
  rationale: A forma média expressa a aceitação do pedido ou da proposta; “concordou em” introduz naturalmente o infinitivo em português.
- source_word: πεῖσειν
  choice: em persuadir
  rationale: O infinitivo futuro de πείθω indica aquilo que ela aceitou fazer. “Persuadir” preserva de modo direto o sentido do verbo grego.
- source_word: τὸν υἱόν
  choice: o filho
  rationale: Embora o grego use artigo e substantivo, o contexto identifica claramente o filho da mãe; em português, “o filho” é natural e não exige explicitar o possessivo.
