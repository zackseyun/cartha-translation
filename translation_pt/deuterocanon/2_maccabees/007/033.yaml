base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/033.yaml
  text: But if our living Lord has become angry for a little while for the sake of rebuke and discipline[b][a], he will again be reconciled with his own slaves.
translation:
  language: pt
  text: Mas, se o nosso Senhor vivo se irou por pouco tempo para repreensão e disciplina, voltará a reconciliar-se[b] com os seus próprios escravos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seus próprios servos”. A palavra grega pode designar tanto escravos como servos, conforme o contexto.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “voltará a mostrar-se favorável aos seus próprios escravos/servos”. O verbo grego pode enfatizar a restauração do favor depois da ira.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mas, se
  rationale: Marca a transição condicional e preserva o leve contraste com o contexto anterior.
- source_word: χάριν ἐπιπλήξεως καὶ παιδίας
  choice: para nos repreender e disciplinar
  rationale: χάριν introduz finalidade ou motivo; a formulação verbal é natural em português e explicita o objeto humano implícito no contexto, sem alterar a função corretiva dos dois substantivos.
- source_word: ὁ ζῶν κύριος ἡμῶν
  choice: o nosso Senhor vivo
  rationale: Preserva o particípio atributivo ζῶν e a ênfase no Deus que vive.
- source_word: βραχέως ἐπωργίσται
  choice: se irou por pouco tempo
  rationale: Expressa a duração breve e o estado resultante do perfeito grego em português corrente.
- source_word: καὶ πάλιν καταλλαγήσεται
  choice: ele voltará a se reconciliar
  rationale: Comunica a restauração futura da relação após a ira temporária, preservando a voz formalmente média/passiva do verbo.
- source_word: τοῖς ἑαυτοῦ δούλοις
  choice: com os seus próprios escravos
  rationale: Mantém a força de pertencimento de ἑαυτοῦ e o sentido social forte de δοῦλοι; a alternativa 'servos' é registrada em nota.
theological_decisions:
- issue: Sentido de δοῦλοι em relação a κύριος
  choice: escravos
  alternative: servos
  rationale: A relação entre Senhor e aqueles que lhe pertencem torna saliente o vínculo de domínio expresso por δοῦλοι, embora 'servos' seja uma alternativa contextual legítima.
- issue: Sentido de καταλλαγήσεται na relação entre Deus e seus subordinados
  choice: voltará a se reconciliar com
  alternative: voltará a mostrar-se favorável a / será novamente aplacado para com
  rationale: A tradução conserva a tensão entre a ira divina temporária e a restauração relacional, sem definir o mecanismo dessa restauração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem das notas foi normalizada para [a][b].
