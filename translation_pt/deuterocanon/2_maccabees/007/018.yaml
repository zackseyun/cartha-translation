  yaml_path: translation/deuterocanon/2_maccabees/007/018.yaml
  text: After him they brought the sixth[a], and as he was about to die he said, “Do not be deceived; for we are suffering these things because of ourselves, having sinned against our own God[b]. Astonishing things have happened.”
translation:
  language: pt
  text: 'Depois dele, levaram o sexto; e, quando estava prestes a morrer, ele disse: “Não se iluda ainda mais[a], pois estamos sofrendo estas coisas por nossa própria culpa, tendo pecado contra o nosso próprio Deus. Aconteceram coisas dignas de espanto[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não continue se enganando” ou “Não se deixe enganar”. A expressão grega é concisa, e πλανῶ pode transmitir a ideia de estar iludido, enganado ou desorientado.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “Aconteceram coisas dignas de espanto”. A expressão também pode ser entendida como “Aconteceram coisas espantosas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τοῦτον ἤγον τὸν ἕκτον
  choice: Depois dele, levaram o sexto
  rationale: Μετὰ τοῦτον indica sequência, e o imperfeito ἤγον é vertido pelo pretérito perfeito, natural na narrativa portuguesa. “O sexto” evita acrescentar “irmão”, que está implícito no contexto, mas não nesta frase.
- source_word: μέλλον ἀποθνήσκειν
  choice: quando estava prestes a morrer
  rationale: μέλλω com infinitivo expressa iminência; a formulação portuguesa conserva o valor temporal de modo natural.
- source_word: Μὴ πλανῶ μάλλον
  choice: Não se iluda ainda mais
  rationale: πλανάω pode indicar engano, desorientação ou ilusão; μάλλον aqui admite o sentido de continuação ou intensificação. “Ainda mais” preserva a expressão comprimida sem decidir além do necessário.
- source_word: ἡμεῖς γὰρ διʼ ἑαυτοὺς ταῦτα πάσχομεν
  choice: pois estamos sofrendo estas coisas por nossa própria culpa
  rationale: διʼ ἑαυτούς indica causa radicada nos próprios sofredores. “Por nossa própria culpa” comunica com clareza essa responsabilidade, confirmada pelo particípio seguinte.
- source_word: ἁμαρτόντες εἰς τὸν ἑαυτῶν θεόν
  choice: porque pecamos contra o nosso próprio Deus
  rationale: O particípio ἁμαρτόντες fornece a causa do sofrimento, e εἰς com ἁμαρτάνω apresenta Deus como alvo da ofensa. A oração causal é mais natural em português do que um gerúndio.
- source_word: ἄξια θαυμασμοῦ γέγονε
  choice: Aconteceram coisas dignas de espanto
  rationale: A tradução mantém de perto o sentido avaliativo de ἄξια θαυμασμοῦ e não introduz um conectivo inferencial ausente no grego.
theological_decisions:
- issue: Causa do sofrimento dos irmãos
  choice: O falante atribui o sofrimento deles à própria culpa, especificamente ao pecado contra Deus.
  alternative: Entender διʼ ἑαυτούς de maneira mais geral como “por causa de nós mesmos”, sem explicitar culpa.
  rationale: A ligação imediata com ἁμαρτόντες torna explícita a culpabilidade. A tradução preserva essa afirmação teológica de juízo sem ampliá-la nem suavizá-la.
- issue: Relação lógica da frase final com a anterior
  choice: Manter a frase final sem “portanto”.
  alternative: Acrescentar “portanto” para explicitar uma inferência contextual.
  rationale: O texto grego não contém conjunção antes de ἄξια θαυμασμοῦ γέγονε; omitir o conectivo preserva a justaposição e sua possível tensão.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A pontuação conserva o fluxo narrativo; “própria culpa” torna explícita a causalidade já presente no grego, sem importar formulações confessionais.
