base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/028.yaml
  text: I beg you[a], child, look at heaven and earth and see everything in them, and know that God made them not out of existing things, and that the human race comes to be in the same way.
translation:
  language: pt
  text: 'Eu lhe peço, meu filho: olhe para o céu e para a terra, veja tudo o que há neles e reconheça que Deus não os fez de coisas que já existiam[a]. A humanidade também vem a existir dessa mesma maneira.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de forma mais interpretativa, “do nada”. O grego diz literalmente “não a partir de coisas existentes”.
    reason: Registra a conhecida interpretação teológica sem substituir no texto a formulação própria do original.
lexical_decisions:
- source_word: ἀξιῶ σε
  choice: Eu lhe peço
  rationale: No contexto da súplica materna, transmite um pedido insistente e comovido sem soar excessivamente formal.
- source_word: τέκνον
  choice: meu filho
  rationale: Embora τέκνον seja literalmente 'filho/criança', o destinatário é o filho da mulher; 'meu filho' é natural em português e preserva o afeto do vocativo.
- source_word: ἀναβλέψαντα
  choice: olhe para
  rationale: Converte naturalmente o particípio grego em exortação direta. O sentido de erguer o olhar está implícito em relação ao céu, sem criar dificuldade quando a terra também é mencionada.
- source_word: οὐρανὸν καὶ τὴν γῆν
  choice: o céu e a terra
  rationale: Mantém o par cosmológico tradicional e natural em português; 'céu' é mais abrangente que 'firmamento' ou 'atmosfera'.
- source_word: τὰ ἐν αὐτοῖς πάντα
  choice: tudo o que há neles
  rationale: Expressa claramente a totalidade indicada por πάντα e conserva a referência conjunta ao céu e à terra.
- source_word: γνῶναι
  choice: reconheça
  rationale: Neste encadeamento, indica chegar ao conhecimento mediante olhar e ver; 'reconheça' comunica essa conclusão perceptiva com naturalidade.
- source_word: οὐκ ἐξ ὄντων
  choice: não os fez de coisas que já existiam
  rationale: Preserva a formulação negativa do grego, literalmente 'não a partir de coisas existentes', sem substituí-la no texto pela fórmula teológica posterior 'do nada'.
- source_word: ἐποίησεν
  choice: fez
  rationale: Reflete o verbo grego comum ποιέω com precisão, enquanto o contexto deixa claro que se trata da ação criadora de Deus.
- source_word: τὸ τῶν ἀνθρώπων γένος
  choice: A humanidade
  rationale: Equivalente coletivo, inclusivo e corrente para a expressão grega que designa o gênero humano.
- source_word: οὕτω γίγνεται
  choice: também vem a existir dessa mesma maneira
  rationale: Conserva o aspecto de passagem à existência em γίγνεται e torna explícita, sem alterar o sentido, a comparação retrospectiva expressa por οὕτω.
theological_decisions:
- issue: Se οὐκ ἐξ ὄντων deve ser traduzido diretamente pela fórmula 'do nada'
  choice: não os fez de coisas que já existiam
  alternative: criou-os do nada
  rationale: A expressão grega sustenta a ideia de criação sem matéria preexistente, mas literalmente formula isso como 'não a partir de coisas existentes'. O texto principal preserva essa forma e a nota registra a interpretação teológica mais concisa.
- issue: Como relacionar o surgimento da humanidade à criação precedente
  choice: A humanidade também vem a existir dessa mesma maneira
  alternative: assim também surgiu o gênero humano
  rationale: O presente γίγνεται é mantido como expressão geral, e 'dessa mesma maneira' conserva a referência de οὕτω sem definir além do grego em que sentido exato se dá a analogia.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A pontuação divide a longa construção grega em duas frases para maior clareza, preservando a ligação lógica entre a criação do cosmos e o surgimento da humanidade.
