  text: And so this one also passed away in purity[b][a], having placed his full confidence in the Lord.
translation:
  language: pt
  text: E assim também este morreu em pureza[a], tendo depositado toda a sua confiança no Senhor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “morreu de modo puro”, isto é, de maneira pura ou incontaminada. O advérbio grego provavelmente tem sentido moral.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “confiando inteiramente no Senhor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὗτος οὖν
  choice: E assim também este
  rationale: Preserva a força conectiva e conclusiva de καὶ...οὖν, bem como a ênfase demonstrativa de οὗτος, mantendo a sequência da narrativa.
- source_word: καθαρῶς
  choice: em pureza
  rationale: Expressa de modo natural a provável força moral e religiosa do advérbio, sem restringi-lo indevidamente à pureza ritual.
- source_word: μετήλλαξεν
  choice: morreu
  rationale: No contexto, o verbo é uma expressão respeitosa para morrer. O português corrente prefere aqui a forma direta «morreu», sem perder a dignidade do relato.
- source_word: παντελῶς
  choice: toda a sua
  rationale: Transfere a intensidade total do advérbio para a expressão idiomática «toda a sua confiança».
- source_word: ἐπὶ τῷ κυρίῳ
  choice: no Senhor
  rationale: Com πεποιθώς, indica aquele em quem a confiança se apoia; «no Senhor» é a formulação portuguesa natural.
- source_word: πεποιθώς
  choice: tendo depositado ... confiança
  rationale: O particípio perfeito sugere confiança já firmada e ainda vigente no momento da morte; a construção portuguesa conserva essa ideia de estado resultante.
- source_word: κύριος
  choice: Senhor
  rationale: Tradução tradicional e adequada ao contexto judaico-grego para o soberano divino.
theological_decisions:
- issue: Nuance moral ou religiosa de καθαρῶς ao descrever a morte do mártir
  choice: «morreu em pureza», indicando pureza ou integridade na maneira ou condição em que morreu
  alternative: «morreu de modo puro» ou simplesmente «morreu irrepreensível»
  rationale: O contexto de martírio e fidelidade à lei de Deus favorece uma nuance moral e religiosa. «Em pureza» preserva essa ressonância sem especificar uma categoria ritual.
- issue: Força aspectual de πεποιθώς
  choice: Confiança já depositada e mantida até a morte
  alternative: Apenas «confiando plenamente», sem realçar o estado resultante
  rationale: A construção com particípio perfeito sustenta uma postura de confiança estabelecida, mas a alternativa mais simples permanece semanticamente possível e é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem da frase acompanha o desenvolvimento grego sem soar artificial; «morreu» evita um eufemismo excessivamente marcado, enquanto «em pureza» conserva a tensão moral e religiosa do original.
