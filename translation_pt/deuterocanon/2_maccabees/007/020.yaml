base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/020.yaml
  text: But the mother was especially admirable and worthy of honorable memory[a]; seeing her seven sons perish in a single day[b], she bore it courageously because of her hopes in the Lord.
translation:
  language: pt
  text: 20 Mas a mãe foi extraordinariamente admirável e digna de honrosa lembrança[a]. Vendo seus sete filhos morrerem num só dia[b], suportou tudo corajosamente por causa das esperanças que depositava no Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “digna de boa memória”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “perecerem” ou “serem mortos”. O verbo grego é amplo e pode significar perecer ou ser destruído; aqui aparece no contexto da execução deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπεραγόντως
  choice: extraordinariamente
  rationale: Intensifica de modo natural a elevada avaliação da mãe, sem perder a força superlativa do advérbio.
- source_word: ἀγαθὴ
  choice: admirável
  rationale: Neste contexto de elogio moral, transmite melhor o valor avaliativo de «boa» e evita uma repetição pouco expressiva com ἀγαθῆς.
- source_word: μνήμης ἀγαθῆς ἀξία
  choice: digna de honrosa lembrança
  rationale: Expressa que ela merece ser recordada favoravelmente, preservando o sentido memorial sem introduzir uma fórmula religiosa posterior.
- source_word: ἀπολλυμένους
  choice: morrerem
  rationale: No contexto da execução dos filhos, comunica com clareza o resultado mortal, enquanto a nota preserva a amplitude do verbo grego, que também pode significar perecer ou ser destruído.
- source_word: συνορῶσα
  choice: vendo
  rationale: Mantém a forma participial e apresenta a mãe como testemunha de toda a cena.
- source_word: μιᾷ τοῦ καιροῦ ἡμέρᾳ
  choice: num só dia
  rationale: Preserva a concentração da tragédia em um único dia com expressão portuguesa natural.
- source_word: εὐψύχως
  choice: corajosamente
  rationale: Comunica a firmeza de ânimo diante do sofrimento em linguagem atual e digna.
- source_word: ἔφερεν
  choice: suportou tudo
  rationale: O verbo significa suportar ou aguentar a provação; «tudo» explicita naturalmente em português o objeto implícito, isto é, a experiência descrita.
- source_word: διὰ τὰς ἐπὶ Κύριον ἐλπίδας
  choice: por causa das esperanças que depositava no Senhor
  rationale: Conserva o plural ἐλπίδας e expressa de maneira idiomática esperanças dirigidas a Deus ou nele apoiadas.
- source_word: Κύριον
  choice: Senhor
  rationale: É a forma portuguesa tradicional e natural para κύριος quando se refere a Deus.
theological_decisions:
- issue: Tradução de κύριος
  choice: Senhor
  alternative: o Soberano
  rationale: O referente é Deus, e «Senhor» conserva a designação do texto sem acrescentar uma identificação mais específica.
- issue: Plural de ἐλπίδας
  choice: as esperanças que depositava no Senhor
  alternative: a esperança que tinha no Senhor
  rationale: O plural do grego foi preservado para não reduzir as expectativas da mãe a uma abstração singular nem especificar seu conteúdo além do texto.
- issue: Natureza da morte dos filhos
  choice: morrerem
  alternative: serem mortos
  rationale: O contexto deixa claro que se trata de execução, mas o verbo grego é mais amplo; a tradução evita estreitá-lo no texto principal, e a nota registra a alternativa contextual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção mantém o fluxo narrativo do grego, evita linguagem denominacional e preserva o plural «esperanças». Todos os marcadores de nota aparecem no texto principal.
