base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/009.yaml
  text: And as he was at his last breath[a], he said, “You, accursed wretch, release us from this present life, but the King of the world will raise us up, who have died for his laws[b], into an everlasting renewal of life.”
translation:
  language: pt
  text: 'Quando já estava dando seu último suspiro, ele disse: “Você, maldito, nos tira desta vida presente, mas o Rei do mundo nos ressuscitará — a nós que morremos por causa das leis dele — para uma eterna volta à vida.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão grega combina “eterna” com um substantivo raro que significa “volta à vida” ou “revivificação”. Outra tradução possível: “para uma ressurreição eterna de vida”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐσχάτῃ ... πνοῇ γενόμενος
  choice: Quando já estava dando seu último suspiro
  rationale: Expressa de modo natural e vívido o momento da morte, preservando a imagem literal do último sopro e o valor temporal do particípio γενόμενος.
- source_word: ἀλάστωρ
  choice: maldito
  rationale: Mantém a força do insulto dirigido ao perseguidor sem introduzir o sentido mitológico mais especializado de “vingador”.
- source_word: ἐκ τοῦ παρόντος ... ζῆν ἀπολύεις
  choice: nos tira desta vida presente
  rationale: Traduz a ideia de ser desligado da existência atual e conserva o contraste entre a capacidade do tirano de pôr fim à vida presente e a ação futura de Deus.
- source_word: ὁ ... τοῦ κόσμου βασιλεὺς
  choice: o Rei do mundo
  rationale: É uma tradução direta de κόσμος e preserva o contraste implícito entre o soberano terreno e o soberano de toda a ordem criada.
- source_word: ἀποθανόντας ἡμᾶς ὑπὲρ τῶν αὐτοῦ νόμων
  choice: a nós que morremos por causa das leis dele
  rationale: Representa o particípio aoristo em relação à futura ressurreição e traduz ὑπέρ como a causa da morte, isto é, a fidelidade às leis de Deus.
- source_word: εἰς αἰώνιον ἀναβίωσιν ζωῆς
  choice: para uma eterna volta à vida
  rationale: Preserva a força incomum de ἀναβίωσις, “viver novamente” ou “voltar à vida”, sem reduzi-la simplesmente ao vocabulário mais comum de ressurreição.
- source_word: ἀναστήσει
  choice: ressuscitará
  rationale: Comunica com clareza o sentido de levantar dentre os mortos no contexto, enquanto a expressão seguinte preserva separadamente a noção rara de voltar à vida.
theological_decisions:
- issue: Linguagem de ressurreição no contexto do martírio
  choice: O Rei do mundo ressuscitará os que morreram por causa das leis dele para uma eterna volta à vida.
  alternative: O Rei do mundo nos levantará para uma ressurreição eterna de vida.
  rationale: O grego reúne ἀναστήσει e a expressão rara εἰς αἰώνιον ἀναβίωσιν ζωῆς. A tradução conserva tanto a ação divina de ressuscitar quanto a ideia adicional de voltar à vida eternamente, sem fundi-las numa fórmula doutrinária única.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Maldito” mantém a veemência da fala sem soar artificial; os travessões esclarecem a relação de “a nós que morremos” com “nos ressuscitará”. O marcador [a] aparece no texto principal e corresponde à única nota.
