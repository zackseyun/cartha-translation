base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/017.yaml
  text: But do not think that our nation has been abandoned by God. But as for you[a], endure and see his great power, how it will torture you and your offspring.
translation:
  language: pt
  text: Mas não pense que o nosso povo foi abandonado por Deus. Quanto a você, porém, mantenha-se firme e veja como o grande poder dele[a] torturará você e os seus descendentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “veja como ele torturará você e os seus descendentes”, entendendo Deus, e não “o grande poder dele”, como sujeito implícito.'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ δόκει
  choice: não pense
  rationale: O imperativo presente com μή expressa uma proibição direta; “não pense” é natural e fiel em português atual.
- source_word: τὸ γένος ἡμῶν
  choice: o nosso povo
  rationale: Neste contexto, γένος se refere coletivamente ao povo judeu; “povo” é mais natural e menos ambíguo que “raça” ou “linhagem”.
- source_word: ὑπὸ τοῦ θεοῦ καταλελεῖφθαι
  choice: foi abandonado por Deus
  rationale: O infinitivo perfeito passivo indica o estado resultante de ter sido deixado ou abandonado; a formulação preserva a força teológica da afirmação.
- source_word: σὺ δὲ καρτέρει
  choice: Quanto a você, porém, resista
  rationale: O pronome explícito é contrastivo, e καρτέρει ordena firmeza ou perseverança. “Resista” comunica o desafio dirigido ao tirano sem transformar o verbo simplesmente em “espere”.
- source_word: θεώρει
  choice: contemple
  rationale: θεωρέω significa observar ou contemplar; “contemple” mantém o tom solene e a força retórica do desafio.
- source_word: τὸ μεγαλεῖον αὐτοῦ κράτος
  choice: o grande poder dele
  rationale: A expressão ressalta a grandeza da força divina. “Grande poder” é direto e inteligível, enquanto “dele” retoma Deus sem inserir o nome novamente.
- source_word: σὲ καὶ τὸ σπέρμα σου
  choice: você e os seus descendentes
  rationale: σπέρμα é literalmente “semente”, mas aqui designa a posteridade; “descendentes” é a equivalência idiomática adequada.
- source_word: βασανιεῖ
  choice: torturará
  rationale: βασανίζω denota torturar ou atormentar; “torturará” preserva a severidade concreta do juízo anunciado.
theological_decisions:
- issue: Sujeito de βασανιεῖ
  choice: 'O grande poder de Deus é tomado como o antecedente sintático: “que torturará”.'
  alternative: 'Deus é o sujeito implícito: “como ele torturará você e os seus descendentes”.'
  rationale: A expressão neutra singular τὸ μεγαλεῖον αὐτοῦ κράτος pode funcionar como sujeito do verbo singular e é o antecedente mais imediato. A nota preserva a leitura pessoal alternativa, possível no grego, sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento por “você” preserva a interpelação direta; “porém” explicita o contraste de δέ sem recorrer a uma construção arcaizante.
