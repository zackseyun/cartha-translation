    rationale: Na sequência θεώρει ... ὡς ... βασανιεῖ, o sentido é “veja como ... torturará”. A oração “que torturará” é possível como paráfrase, mas reduz essa relação de observação/constatação.
  - severity: low
    issue: “Resista” é menos preciso para καρτέρει.
    rationale: O imperativo pede firmeza e capacidade de suportar; “resista” pode ser entendido como convocação a opor-se ativamente. “Mantenha-se firme” preserva melhor a ideia de constância.
