review_pass:
  verdict: revise
  source_fidelity: A tradução reproduz bem o sentido geral. Contudo, a construção relativa “o grande poder dele, que torturará” torna menos explícito o valor de ὡς (“como”) e transforma a sequência em uma simples oração explicativa. Reordenar para “veja como o grande poder dele torturará” reflete diretamente a sintaxe e a força retórica gregas. “Mantenha-se firme” expressa καρτέρει com mais precisão do que “resista”, que pode sugerir oposição ativa.
  naturalness: O texto é claro e de registro digno. “Mantenha-se firme e veja como...” é mais idiomático em português moderno do que “resista e contemple..., que...”, sem perder o tom desafiador do discurso.
  terminology: “Nosso povo”, “abandonado por Deus”, “grande poder” e “descendentes” são escolhas adequadas. “Torturará” mantém corretamente a gravidade de βασανιεῖ. A nota continua necessária, pois o sujeito de βασανιεῖ pode ser o poder divino mencionado ou Deus entendido como sujeito implícito.
