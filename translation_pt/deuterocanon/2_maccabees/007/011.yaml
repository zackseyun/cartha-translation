  text: And he said bravely, “From heaven I received these, and for his laws I disregard them, and from him I hope to receive them back again.”
translation:
  language: pt
  text: 'E disse com coragem: “Do céu recebi estas coisas e, por causa das suas leis, as desprezo; e é dele que espero recebê-las novamente.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενναίως
  choice: com coragem
  rationale: Expressa de modo natural o valor adverbial de agir ou falar bravamente diante do sofrimento, sem acrescentar uma avaliação doutrinária.
- source_word: Ἐξ οὐρανοῦ
  choice: Do céu
  rationale: Preserva literalmente a formulação grega e sua referência reverente indireta à origem divina.
- source_word: κέκτημαι
  choice: recebi
  rationale: Embora o perfeito possa significar ‘possuo’ ou ‘obtive’, o contexto enfatiza que os membros mencionados foram recebidos do céu; esta escolha também corresponde à expectativa de recebê-los de novo.
- source_word: ὑπερορῶ
  choice: não faço caso
  rationale: Comunica a ideia de desconsiderar ou abrir mão destas coisas por fidelidade às leis divinas, sem sugerir necessariamente ódio pelo corpo.
- source_word: πάλιν ἐλπίζω κομίσεσθαι
  choice: espero recebê-las novamente
  rationale: Mantém explicitamente a esperança futura de recuperar aquilo que está sendo perdido, sem explicar além do que o versículo afirma.
theological_decisions:
- issue: Referente de αὐτοῦ e esperança de restauração
  choice: Manter ‘dele’ e a afirmação de que espera receber as coisas novamente
  alternative: Explicitar ‘de Deus’ ou interpretar diretamente como ressurreição dos membros
  rationale: O grego emprega o pronome e formula a esperança sem uma explicação doutrinária completa; a tradução preserva essa forma e sua tensão contextual.
translation_notes:
  register: Português moderno, digno e acessível. A repetição demonstrativa do grego foi parcialmente preservada por ‘estas coisas’ e pelos pronomes subsequentes, evitando identificar no próprio versículo aquilo a que o contexto anterior se refere.
