base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/001.yaml
  text: It also happened that seven brothers, along with their mother, having been arrested, were being forced by the king to taste the unlawful flesh of swine, while being tortured with whips and cords.
translation:
  language: pt
  text: Aconteceu também que sete irmãos foram presos com sua mãe e obrigados pelo rei a provar da carne de porco proibida[a], enquanto eram torturados com chicotes e correias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ilícita”. O termo grego indica aquilo que era proibido pela lei; não emprega especificamente a palavra “impura”.
    reason: lexical_alternative
  - marker: b
    text: “Correias” também pode ser traduzido como “tiras” ou, mais literalmente, “tendões”, usados aqui como instrumentos de tortura.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνέβη δὲ καὶ
  choice: Aconteceu também que
  rationale: Preserva a transição narrativa e a força aditiva de καί em português natural.
- source_word: ἑπτὰ ἀδελφοὺς μετὰ τῆς μητρὸς συλλημφθέντας
  choice: sete irmãos foram presos com sua mãe
  rationale: Mantém o referente masculino de ἀδελφούς e expressa de modo claro e corrente a prisão conjunta deles e da mãe.
- source_word: ἀναγκάζεσθαι ὑπὸ τοῦ βασιλέως
  choice: obrigados pelo rei
  rationale: Conserva a coerção e o agente da construção passiva sem tornar a frase pesada.
- source_word: ἀπὸ τῶν ἀθεμίτων υἱείων κρεῶν
  choice: da carne de porco proibida
  rationale: ἀθέμιτος indica aquilo que é proibido ou ilícito; a formulação é clara e preserva a dimensão legal-religiosa sem introduzir o termo distinto 'impura'.
- source_word: ἐφάπτεσθαι
  choice: a provar
  rationale: No contexto alimentar, o verbo vai além do sentido literal de tocar e indica tomar a carne como alimento; 'provar' preserva a coerção sem afirmar uma quantidade consumida.
- source_word: μάστιξιν καὶ νευραῖς
  choice: com chicotes e correias
  rationale: μάστιγες designa chicotes ou açoites, e νευραί pode designar tiras, correias ou cordas usadas como instrumentos de tortura.
- source_word: αἰκιζομένους
  choice: enquanto eram torturados
  rationale: O verbo denota maus-tratos violentos; os instrumentos mencionados justificam a tradução forte e contextual 'torturados'.
theological_decisions:
- issue: Linguagem da violação das normas alimentares judaicas
  choice: carne de porco proibida
  alternative: carne de porco impura
  rationale: O grego emprega ἀθέμιτος, 'proibida/ilícita', e não um termo que signifique especificamente 'impura'; a tradução conserva essa distinção.
- issue: Alcance de ἐφάπτεσθαι no contexto alimentar
  choice: provar
  alternative: comer / participar de
  rationale: '''Provar'' comunica que se exigia a ingestão da carne, sem reduzir o verbo ao literal ''tocar'' nem especificar mais do que o texto quanto à quantidade.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi levemente reorganizada para fluência, sem eliminar a progressão narrativa nem a gravidade da cena.
