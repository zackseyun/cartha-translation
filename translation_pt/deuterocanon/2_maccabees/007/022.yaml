  terminology: «Espírito» para πνεῦμα preserva a distinção do grego em relação a «vida» e não impõe uma interpretação estreita. A nota deve apresentar a alternativa de modo frasal, pois a alternativa afeta o par «espírito e vida», não apenas uma palavra isolada.
