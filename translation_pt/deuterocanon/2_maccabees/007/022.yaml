base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/022.yaml
  text: I do not know how you appeared in my womb[a], nor was it I who granted you spirit and life, and it was not I who arranged the formation of each of you.
translation:
  language: pt
  text: Não sei como vocês apareceram no meu ventre, nem fui eu que lhes concedi o espírito[a] e a vida, nem fui eu que organizei a formação de cada um de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o sopro e a vida». A palavra grega pode significar «espírito», «sopro» ou «vento»; aqui se refere ao princípio que anima a vida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἶδʼ ὅπως
  choice: Não sei como
  rationale: Reproduz de modo natural e direto a confissão de desconhecimento da mãe quanto ao processo pelo qual os filhos vieram a existir.
- source_word: εἰς τὴν ἐμὴν ἐφάνητε κοιλίαν
  choice: vocês apareceram no meu ventre
  rationale: Mantém o sentido literal de ἐφάνητε, preservando a ideia de uma origem misteriosa para a mãe; em português, «no meu ventre» é mais idiomático do que «para dentro do meu ventre».
- source_word: οὐδὲ ἐγὼ
  choice: nem fui eu que
  rationale: Conserva a ênfase da negação da autoria materna sem produzir uma construção artificial.
- source_word: τὸ πνεῦμα καὶ τὴν ζωὴν ὑμῖν ἐχαρισάμην
  choice: lhes concedi o espírito e a vida
  rationale: «Concedi» expressa o ato de dar como dádiva; «espírito» mantém a amplitude de πνεῦμα e sua distinção em relação a «vida».
- source_word: καὶ τὴν ἑκάστου στοιχείωσιν
  choice: a formação de cada um de vocês
  rationale: «Formação» comunica com clareza a constituição ou organização dos elementos de cada corpo, e «cada um de vocês» preserva o valor distributivo de ἑκάστου.
- source_word: οὐκ ἐγὼ διερρύθμισα
  choice: nem fui eu que dispus
  rationale: «Dispus» transmite a ideia de ordenar e organizar intencionalmente, sem impor terminologia excessivamente técnica.
theological_decisions:
- issue: Sentido de πνεῦμα no discurso materno sobre a origem humana
  choice: espírito
  alternative: sopro
  rationale: Como o texto distingue πνεῦμα de ζωή, «espírito» preserva dois aspectos relacionados, mas não idênticos, e mantém a amplitude teológica do grego; «sopro» continua sendo uma possibilidade lexical legítima.
- issue: Alcance da negação da causalidade materna
  choice: A mãe nega ser a autora última do espírito, da vida e da formação dos filhos.
  alternative: A mãe nega qualquer participação causal em sua geração.
  rationale: 'A formulação preserva a tensão do texto: ela reconhece implicitamente a maternidade, mas nega ter concedido ou organizado por si mesma aquilo que constitui a vida dos filhos.'
translation_notes:
  register: Português atual, digno e amplamente compreensível, com «vocês» para o plural e construções naturais ao público brasileiro. O paralelismo negativo do grego foi preservado. O marcador da nota foi colocado junto de «espírito», termo ao qual a alternativa lexical efetivamente se refere.
