base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/031.yaml
  text: But you[a], having become the inventor of every evil against the Hebrews, will certainly not escape the hands of God.
translation:
  language: pt
  text: Mas você, tendo-se tornado o inventor[a] de todo mal contra os hebreus, de modo nenhum escapará das mãos de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «idealizador» ou «autor de todo mal».'
    reason: Alternativas lexicais para εὑρετής, termo que pode indicar quem inventa, concebe ou dá origem a algo.
lexical_decisions:
- source_word: σὺ δὲ
  choice: Mas você
  rationale: δέ assinala o contraste e a mudança para uma interpelação direta; “Mas você” conserva o tom confrontador em português atual.
- source_word: πάσης κακίας
  choice: de toda maldade
  rationale: κακία abrange maldade, perversidade e mal; “toda maldade” preserva a acusação moral ampla sem restringi-la a crimes específicos.
- source_word: εὑρετὴς γενόμενος
  choice: que se tornou o idealizador[a]
  rationale: εὑρετής designa quem descobre, inventa ou concebe algo. “Idealizador” comunica aqui a elaboração ativa dos males e soa natural em português; “se tornou” representa γενόμενος.
- source_word: εἰς τοὺς Ἑβραίους
  choice: contra os hebreus
  rationale: No contexto hostil, εἰς tem sentido adversativo e é traduzido naturalmente por “contra”; “hebreus” reproduz diretamente Ἑβραίους.
- source_word: οὐ μὴ διαφύγῃς
  choice: de modo nenhum escapará
  rationale: οὐ μή com o subjuntivo aoristo expressa negação enfática; “de modo nenhum escapará” conserva essa força de maneira digna e clara.
- source_word: τὰς χεῖρας τοῦ θεοῦ
  choice: das mãos de Deus
  rationale: Mantém o plural e a imagem concreta do texto grego, corrente na linguagem bíblica sobre o poder e o juízo divinos.
theological_decisions:
- issue: Expressão antropomórfica do juízo divino
  choice: das mãos de Deus
  alternative: do poder de Deus; do juízo de Deus
  rationale: A tradução preserva a imagem concreta do grego em vez de substituí-la por uma explicação abstrata.
- issue: Designação étnica Ἑβραίους
  choice: os hebreus
  alternative: os judeus
  rationale: O texto-fonte emprega especificamente “hebreus”; manter essa designação evita substituir um termo étnico por outro, ainda que relacionado.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e compreensão internacional. A interpelação direta e a negação enfática preservam o tom acusatório; a ordem foi levemente ajustada à sintaxe natural do português.
