lexical_decisions:
- source_word: ἐκθύμως ... γενόμενος
  choice: ficou furioso
  rationale: Expressa de modo natural tanto a mudança de estado indicada por γενόμενος quanto a intensidade emocional de ἐκθύμως.
- source_word: χειρίστως ἀπήντησεν
  choice: tratou ... com mais crueldade
  rationale: No contexto de tortura e execução, ἀπήντησεν descreve como o rei lidou com o jovem, enquanto χειρίστως, com a comparação seguinte, indica tratamento especialmente cruel.
- source_word: παρὰ τοὺς ἄλλους
  choice: do que os outros
  rationale: Torna explícita em português a comparação marcada pela construção grega.
- source_word: πικρῶς φέρων
  choice: ressentindo-se amargamente
  rationale: Comunica a reação interior amarga do rei em português corrente, sem reduzir a força emocional da expressão.
- source_word: μυκτηρισμός
  choice: zombaria
  rationale: Designa escárnio ou ridicularização desdenhosa e corresponde naturalmente à provocação no contexto.
