base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/036.yaml
  text: For our brothers[a], having now endured a brief pain, have fallen under God's covenant into everlasting life; but you, by the judgment of God, will justly bear the penalties of your arrogance.
translation:
  language: pt
  text: Pois os nossos irmãos, agora, depois de suportarem um breve sofrimento, morreram sob a aliança de Deus, para a vida eterna[a]; você, porém, pelo julgamento de Deus, sofrerá as justas penas da sua arrogância.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “caíram sob a aliança de Deus para a vida eterna”. “Caíram” traduz literalmente o verbo grego; no contexto, refere-se à morte. A relação exata entre “aliança de Deus” e “vida eterna” é compacta no grego.'
    reason: Registra a imagem literal de πεπτώκασιν e preserva a ambiguidade sintática entre aliança e vida eterna, sem impor uma explicação doutrinária.
lexical_decisions:
- source_word: βραχὺν ... πόνον
  choice: um breve sofrimento
  rationale: Preserva o contraste entre a curta duração do sofrimento dos mártires e a vida sem fim, com linguagem natural e sem intensificar πόνος para “tormento”.
- source_word: ἐπενέγκαντες
  choice: depois de suportarem
  rationale: O particípio expressa que os irmãos passaram pelo sofrimento e o suportaram antes do estado descrito pelo verbo principal.
- source_word: ἀενάου ζωῆς
  choice: para a vida eterna
  rationale: ἀέναος indica duração contínua ou perpétua. “Vida eterna” é clara e corrente; a preposição “para” apresenta de modo legível a relação comprimida entre aliança, morte e vida, sem afirmar mais do que o contexto permite.
- source_word: ὑπὸ διαθήκην θεοῦ
  choice: sob a aliança de Deus
  rationale: Mantém explicitamente tanto a preposição ὑπό quanto a linguagem de aliança, apesar da construção incomum.
- source_word: πεπτώκασιν
  choice: caíram
  rationale: Conserva a imagem literal do verbo πίπτω. No contexto, a queda se refere à morte dos irmãos, interpretação registrada na nota sem substituir silenciosamente a formulação grega.
- source_word: κρίσει
  choice: julgamento
  rationale: Equivalente direto e apropriado ao contexto judicial da retribuição divina.
- source_word: δίκαια τὰ πρόστιμα
  choice: as justas penas
  rationale: πρόστιμα designa penalidades impostas; “penas” evita o sentido monetário estreito de “multas”. δίκαια caracteriza essas penas como justas.
- source_word: ὑπερηφανίας
  choice: arrogância
  rationale: Expressa a soberba altiva e dominadora do rei em linguagem moderna e moralmente incisiva.
theological_decisions:
- issue: Relação entre o martírio, a aliança de Deus e a vida eterna na expressão comprimida ἀενάου ζωῆς ὑπὸ διαθήκην θεοῦ πεπτώκασιν
  choice: Os irmãos “caíram sob a aliança de Deus para a vida eterna”.
  alternative: Os irmãos “morreram sob a aliança de Deus, que conduz à vida eterna” ou “caíram sob a aliança de vida eterna de Deus”.
  rationale: A sintaxe grega é compacta e permite mais de uma forma de relacionar “vida eterna” com “aliança” e “caíram”. O texto principal preserva a imagem da queda, a linguagem da aliança e a orientação para a vida eterna; a nota registra a leitura contextual de “caíram” como “morreram” sem resolver indevidamente toda a tensão sintática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” no discurso direto singular para evitar solenidade artificial, preservando o contraste enfático entre os irmãos e o perseguidor.
