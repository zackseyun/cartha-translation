    issue: «saber de nós» para μανθάνειν ἡμῶν
    rationale: A expressão pode ser entendida como «saber algo a nosso respeito», não como aprender informação conosco/a partir de nós. «Aprender de nós» preserva claramente a relação do genitivo com o verbo.
  - severity: low
    issue: «assumiu a função de porta-voz» para γενόμενος προήγορος
    rationale: É interpretativamente aceitável, mas é mais perifrástico e sugere uma designação funcional. «Tornando-se porta-voz deles» mantém a nuance de γενόμενος e o papel representativo sem sugerir um cargo.
