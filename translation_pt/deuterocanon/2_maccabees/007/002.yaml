base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/002.yaml
  text: But one of them[a], becoming their spokesman, said, “What do you intend to ask and learn from us? For we are ready to die rather than transgress the ancestral laws.”
translation:
  language: pt
  text: 'Um deles, porém, tornando-se porta-voz deles, disse: “O que você pretende perguntar e aprender de nós? Pois estamos prontos para morrer, em vez de transgredir as leis de nossos antepassados[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as leis ancestrais”.'
    reason: Alternativa lexical mais concisa para πατρῷα νόμους.
lexical_decisions:
- source_word: εἷς δὲ αὐτῶν
  choice: Um deles, porém
  rationale: A construção com genitivo partitivo significa literalmente “um deles”; “porém” marca a transição e o contraste introduzidos por δέ.
- source_word: γενόμενος προήγορος
  choice: assumiu a função de porta-voz
  rationale: προήγορος designa quem fala primeiro ou em nome de outros. A formulação portuguesa expressa naturalmente que ele passa a representar o grupo, sem transformá-lo necessariamente em líder.
- source_word: Μέλλεις ἐρωτᾷν, καὶ μανθάνειν ἡμῶν;
  choice: O que você pretende perguntar e saber de nós?
  rationale: μέλλεις comunica intenção ou ação iminente. A pergunta retórica é vertida de modo corrente, mantendo os dois verbos e a referência a obter deles a informação.
- source_word: ἕτοιμοι γάρ ἀποθνήσκειν ἐσμέν
  choice: Pois estamos prontos para morrer
  rationale: Preserva a prontidão expressa por ἕτοιμοι e o infinitivo ativo ἀποθνήσκειν, sem acrescentar a ideia de execução que não está explicitada na forma verbal.
- source_word: ἢ ... παραβαίνειν
  choice: em vez de transgredir
  rationale: A expressão apresenta uma preferência moral entre morrer e violar a lei. “Transgredir” conserva o peso jurídico e religioso do verbo παραβαίνω.
- source_word: τὰ πατρῷα νόμους
  choice: as leis de nossos antepassados
  rationale: πατρῷα caracteriza leis recebidas dos antepassados. A formulação conserva a dimensão familiar e tradicional, e “nossos” explicita em português a pertença comunitária implícita no contexto.
theological_decisions:
- issue: Identidade judaica e tradição pactual em πατρῷα νόμους
  choice: as leis de nossos antepassados
  alternative: as leis ancestrais
  rationale: A opção escolhida mantém em primeiro plano a transmissão comunitária recebida dos antepassados, sem acrescentar uma identificação denominacional nem reduzir a expressão a uma noção abstrata de tradição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” torna explícito o singular de μέλλεις; “assumiu a função de porta-voz” evita tanto o arcaísmo quanto a inferência de que o irmão se tornou líder permanente.
