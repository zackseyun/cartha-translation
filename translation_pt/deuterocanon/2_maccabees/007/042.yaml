  text: So then, let this be enough about the mother’s compassion and the extraordinary tortures.
translation:
  language: pt
  text: Assim, baste o que foi dito sobre os sentimentos de compaixão e as torturas extremas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Assim, fique declarado até este ponto o que diz respeito aos sentimentos de compaixão e às crueldades extremas.”'
    reason: Alternativa mais formal para a fórmula conclusiva e para αἰκίαι.
lexical_decisions:
- source_word: τὰ ... περὶ τοὺς σπλαγχνισμούς
  choice: sobre os sentimentos de compaixão
  rationale: O plural σπλαγχνισμούς designa sentimentos profundos, ternura ou compaixão. A formulação preserva o plural sem acrescentar explicitamente «da mãe», embora o contexto deixe claro a quem se refere.
- source_word: τὰς ὑπερβαλλούσας αἰκίας
  choice: as torturas extremas
  rationale: αἰκίαι indica maus-tratos cruéis ou torturas concretas, e ὑπερβαλλούσας intensifica sua gravidade como algo que excede a medida comum.
- source_word: ἐπὶ τοσούτου δεδηλώσθω
  choice: baste o que foi dito
  rationale: 'A combinação funciona como fórmula conclusiva: literalmente, algo como «fique declarado até este ponto». «Baste o que foi dito» transmite com naturalidade o limite imposto à narrativa e conserva o tom formal.'
