base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/024.yaml
  text: But Antiochus[a], thinking that he was being despised and taking note of the reproachful tone, while the youngest was still alive, not only urged him with words, but also assured him with oaths that he would both make him rich and make him blessed, if he turned away from the traditions of his fathers[c][b], and that he would have him as a friend and entrust him with offices.
translation:
  language: pt
  text: Antíoco, porém, pensando que estava sendo desprezado e percebendo o tom de reprovação, enquanto o mais novo ainda estava vivo, não somente procurou convencê-lo com palavras, mas também lhe garantiu, sob juramento, que o faria rico e afortunado, caso abandonasse as tradições de seus antepassados; além disso, faria dele seu amigo[a] e lhe confiaria cargos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Amigo” também pode ter aqui o sentido de título da corte: um associado ou dignitário favorecido pelo rei.'
    reason: cultural_note
  - marker: b
    text: Ou “lhe confiaria responsabilidades”; o grego se refere a funções ou assuntos confiados pelo rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰόμενος
  choice: pensando
  rationale: Preserva a perspectiva subjetiva de Antíoco sem afirmar como fato que ele era desprezado.
- source_word: καταφρονεῖσθαι
  choice: estava sendo desprezado
  rationale: Reproduz o infinitivo passivo e se ajusta ao contexto de honra e desprezo.
- source_word: τὴν ὀνειδίζουσαν ... φωνήν
  choice: o tom de censura
  rationale: Expressa em português natural a ideia literal de uma voz que censura ou repreende.
- source_word: ὑφορώμενος
  choice: percebendo
  rationale: Comunica a atenção de Antíoco à maneira de falar, sem intensificar indevidamente a possível nuance de suspeita.
- source_word: ἔτι τοῦ νεωτέρου περιόντος
  choice: enquanto o mais novo ainda estava vivo
  rationale: O genitivo absoluto indica circunstância simultânea; no contexto dos martírios, περιόντος significa que ele ainda sobrevivia.
- source_word: ἐποιεῖτο τὴν παράκλησιν
  choice: procurou convencê-lo
  rationale: A expressão denota um apelo insistente; a formulação é corrente e adequada à tentativa de persuasão.
- source_word: διʼ ὅρκων ἐπίστου
  choice: lhe garantiu, sob juramento
  rationale: Conserva tanto a garantia solene quanto o meio juramentado usado para persuadi-lo.
- source_word: πλουτιεῖν
  choice: o faria rico
  rationale: Tradução direta da promessa de enriquecimento material.
- source_word: μακαριστὸν ποιήσειν
  choice: o faria afortunado
  rationale: No contexto de patronato régio, indica condição próspera e privilegiada; evita uma conotação religiosa mais forte que o contexto não exige.
- source_word: μεταθέμενον ἀπὸ τῶν πατρίων
  choice: caso abandonasse as tradições de seus pais
  rationale: Torna explícito o valor condicional do particípio e preserva a dimensão ancestral das práticas judaicas sem especificá-las além do grego.
- source_word: φίλον ἕξειν
  choice: faria dele seu amigo
  rationale: Mantém 'amigo', que pode ser linguagem comum ou designação ligada à corte, deixando a nuance política para a nota.
- source_word: χρείας ἐμπιστεύσειν
  choice: lhe confiaria cargos
  rationale: No contexto régio, sugere responsabilidades ou funções confiadas pelo rei; 'cargos' comunica bem a provável dimensão oficial.
theological_decisions:
- issue: Sentido de πατρίων no contexto de apostasia
  choice: as tradições de seus pais
  alternative: os costumes ancestrais
  rationale: A tradução conserva a herança familiar e religiosa sem acrescentar uma terminologia confessional específica.
- issue: Sentido de μακαριστόν numa promessa secular do rei
  choice: afortunado
  alternative: feliz; invejável; bem-aventurado
  rationale: '''Afortunado'' preserva a ideia de condição favorecida e próspera, evitando resolver o termo como bênção divina.'
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente ajustada para fluência, preservando a progressão entre persuasão verbal, juramento e promessas régias.
