  text: so that the king himself and those with him were astonished at the young man's spirit, because he regarded the sufferings as nothing.
translation:
  language: pt
  text: De modo que o próprio rei e os que estavam com ele ficaram espantados com o espírito[a] do jovem, pois ele não fazia caso algum das dores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: ânimo.'
    reason: Registra uma alternativa contextual para ψυχή sem substituir a opção mais ampla adotada no texto.
lexical_decisions:
- source_word: ψυχήν
  choice: espírito
  rationale: Neste contexto, designa a disposição interior ou o ânimo do jovem diante da tortura. “Espírito” preserva a amplitude do termo grego sem o reduzir explicitamente a “coragem”.
- source_word: ἐκπλήσσεσθαι
  choice: ficaram espantados
  rationale: Expressa a forte surpresa causada pela reação incomum do jovem.
- source_word: ἐνʼ οὐδενὶ τὰς ἀλγηδόνας ἐτίθετο
  choice: não fazia caso algum das dores
  rationale: Reproduz de modo natural a expressão idiomática grega, literalmente ligada a considerar ou colocar as dores como nada.
