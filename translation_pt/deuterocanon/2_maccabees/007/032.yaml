  language: pt
  text: Pois estamos sofrendo por causa dos nossos próprios pecados;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡμεῖς
  choice: nós (expresso na forma verbal e reforçado por «nossos próprios»)
  rationale: O pronome grego é explícito e enfático. Em português, «estamos» já identifica o sujeito; a força autorreferente da frase fica clara e natural com «nossos próprios pecados», evitando a redundância menos fluida de «nós estamos».
- source_word: γὰρ
  choice: pois
  rationale: Preserva a função explicativa da partícula, ligando a afirmação ao contexto anterior, em registro atual e digno.
- source_word: διὰ
  choice: por causa de
  rationale: Com acusativo, διά indica causa. «Por causa de» expressa diretamente essa relação causal, sem sugerir finalidade ou benefício.
- source_word: τὰς ἑαυτῶν ἁμαρτίας
  choice: nossos próprios pecados
  rationale: «Próprios» conserva a ênfase reflexiva de ἑαυτῶν e a admissão de responsabilidade dos falantes.
- source_word: πάσχομεν
  choice: estamos sofrendo
  rationale: A construção progressiva comunica naturalmente em português o sofrimento presente e em curso indicado pelo contexto.
theological_decisions:
- issue: Causa do sofrimento dos falantes
  choice: O sofrimento presente é atribuído aos próprios pecados dos falantes.
  alternative: «Sofremos por nossos pecados», sem explicitar plenamente a ênfase reflexiva.
  rationale: O grego estabelece de modo explícito a relação causal e reforça a responsabilidade dos próprios falantes. A tradução mantém essa afirmação penitencial sem atenuá-la nem ampliá-la.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Pois» conserva a conexão explicativa; «estamos sofrendo» soa natural; e «nossos próprios pecados» mantém a ênfase reflexiva do grego. O ponto e vírgula preserva a continuidade sintática indicada na fonte.
