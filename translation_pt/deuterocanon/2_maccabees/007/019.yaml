base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/019.yaml
  text: But as for you[a], do not suppose that you will be innocent, having attempted to fight against God.
translation:
  language: pt
  text: Você, porém, não pense que ficará sem culpa por ter tentado lutar contra Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por ter tentado opor-se a Deus”. O verbo grego significa literalmente “lutar contra Deus”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Você, porém
  rationale: Preserva tanto o contraste expresso por δέ como a ênfase do pronome σὺ, mantendo uma interpelação direta e natural.
- source_word: μὴ νομίσῃς
  choice: não pense
  rationale: Expressa com clareza a proibição de alimentar uma suposição equivocada, em linguagem portuguesa corrente.
- source_word: ἀθῷος
  choice: sem culpa
  rationale: Mantém o sentido principal de ausência de culpa ou responsabilidade, sem substituí-lo pela consequência inferida de ficar impune.
- source_word: ἔσεσθαι
  choice: ficará
  rationale: Reproduz o valor futuro do infinitivo dependente de νομίσῃς de modo idiomático em português.
- source_word: θεομαχεῖν
  choice: lutar contra Deus
  rationale: Preserva a força concreta do verbo composto grego, que descreve oposição a Deus em termos de combate.
- source_word: ἐπιχειρήσας
  choice: por ter tentado
  rationale: Comunica de modo natural o particípio aoristo e sua provável nuance causal, apresentando a tentativa como fundamento da declaração de culpa.
theological_decisions:
- issue: Tradução de θεομαχεῖν
  choice: lutar contra Deus
  alternative: opor-se a Deus
  rationale: 'A tradução escolhida conserva a imagem forte e explícita do grego: a perseguição é caracterizada como combate contra o próprio Deus. A alternativa é possível, mas enfraquece a metáfora.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A construção “Você, porém” mantém a ênfase do grego sem rigidez excessiva; “sem culpa” evita interpretar ἀθῷος como simples ausência de punição.
