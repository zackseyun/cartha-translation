  text: But looking at him[a], he said, “Though you have authority among men, being mortal, you do what you want[b];
translation:
  language: pt
  text: 'Ele, porém, olhou para ele e disse: “Você tem autoridade entre os seres humanos e faz o que quer, embora seja mortal[a];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «perecível» ou «corruptível».
    reason: φθαρτός pode ressaltar tanto a mortalidade quanto a condição sujeita à deterioração.
lexical_decisions:
- source_word: ὁ δὲ πρὸς αὐτὸν ἰδὼν
  choice: Ele, porém, olhou para ele
  rationale: Mantém o sujeito e o objeto pronominais do grego, traduz ἰδών por uma forma verbal natural em português e representa δέ como transição narrativa por meio de «porém».
- source_word: Ἐξουσίαν
  choice: autoridade
  rationale: No contexto político, ἐξουσία indica autoridade ou poder exercido legitimamente; «autoridade» é mais preciso que o termo mais amplo «poder».
- source_word: ἐν ἀνθρώποις
  choice: entre os seres humanos
  rationale: Traduz naturalmente a esfera indicada por ἐν com o dativo e deixa claro o valor genérico de ἀνθρώποις, sem restringi-lo aos homens do sexo masculino.
- source_word: ὃ θέλεις ποιεῖς
  choice: faz o que quer
  rationale: Expressão corrente e direta que preserva o sentido da oração relativa grega sem o tom arcaico de «fazes o que desejas».
- source_word: φθαρτὸς ὤν
  choice: embora seja mortal
  rationale: «Mortal» comunica no contexto a fragilidade e transitoriedade do governante humano; a oração concessiva torna natural em português a força circunstancial do particípio.
theological_decisions:
- issue: Nuance antropológica de φθαρτὸς ὤν na repreensão ao governante terreno
  choice: embora seja mortal
  alternative: sendo perecível / sendo corruptível
  rationale: A formulação destaca o contraste entre a autoridade política do rei e sua condição humana transitória, sem introduzir uma doutrina específica sobre corrupção moral.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. «Você» preserva a interpelação direta de modo corrente. O ponto e vírgula final mantém a continuidade sintática sugerida pelo texto grego para o versículo seguinte.
