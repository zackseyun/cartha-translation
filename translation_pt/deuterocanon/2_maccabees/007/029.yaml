base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/029.yaml
  text: Do not fear this executioner[a], but, becoming worthy of your brothers, accept death[c][b], so that in mercy I may receive you back together with your brothers.
translation:
  language: pt
  text: Não tenha medo deste carrasco[a]; pelo contrário, tornando-se digno de seus irmãos, aceite a morte, para que, na misericórdia[b], eu possa recebê-lo de volta[c] junto com seus irmãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “deste torturador”. O grego δήμιος designa mais precisamente um executor, embora o contexto também envolva tortura.
    reason: lexical_alternative
  - marker: b
    text: A expressão “na misericórdia” provavelmente se refere à misericórdia divina, mas Deus não é nomeado explicitamente nesta oração grega.
    reason: alternative_reading
  - marker: c
    text: Ou “possa recuperá-lo” ou “possa recebê-lo”. A expressão comunica a esperança da mãe de voltar a estar com o filho, junto com os irmãos dele.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ φοβηθῇς
  choice: Não tenha medo
  rationale: Expressa de modo natural e direto, em português atual, a proibição enfática dirigida pela mãe ao filho.
- source_word: τὸν δήμιον τοῦτον
  choice: deste carrasco
  rationale: δήμιος designa propriamente o encarregado de executar a sentença; “carrasco” é o equivalente corrente e também se ajusta ao contexto de tortura.
- source_word: τῶν ἀδελφῶν σου ἄξιος γενόμενος
  choice: mostre-se digno de seus irmãos
  rationale: Reproduz idiomaticamente a ideia de tornar-se ou revelar-se digno dos irmãos, sem alterar a referência aos irmãos literais do jovem.
- source_word: ἐπίδεξαι τὸν θάνατον
  choice: aceite a morte
  rationale: ἐπιδέχομαι pode significar receber ou aceitar; aqui indica a aceitação voluntária da morte diante do martírio.
- source_word: ἵνα
  choice: para que
  rationale: Mantém a relação de propósito ou resultado introduzida pela conjunção grega.
- source_word: ἐν τῷ ἐλέει
  choice: na misericórdia
  rationale: Conserva a expressão compacta do grego e não acrescenta explicitamente Deus como agente, embora o contexto sugira a misericórdia divina.
- source_word: σὺν τοῖς ἀδελφοῖς σου
  choice: junto com seus irmãos
  rationale: Traduz com clareza a ideia de companhia e reunião expressa por σύν.
- source_word: κομίσωμαί σε
  choice: eu possa recebê-lo de volta
  rationale: κομίζω admite o sentido de receber ou recuperar; “recebê-lo de volta” preserva a esperança de restituição e reencontro sem explicitar além do texto como isso ocorrerá.
theological_decisions:
- issue: Se Deus deve ser explicitado como fonte da misericórdia em ἐν τῷ ἐλέει
  choice: Manter “na misericórdia” sem acrescentar “de Deus”.
  alternative: “pela misericórdia de Deus” ou “na misericórdia de Deus”
  rationale: A misericórdia divina é fortemente sugerida pelo contexto, mas Deus não é nomeado nesta oração grega; a formulação escolhida preserva essa implicação sem convertê-la em afirmação explícita.
- issue: A esperança de ressurreição ou restauração em κομίσωμαί σε
  choice: Traduzir por “eu possa recebê-lo de volta”.
  alternative: “eu possa recebê-lo” ou “eu possa recuperá-lo”
  rationale: A fala da mãe comunica esperança de reencontro além da morte. “Recebê-lo de volta” mantém essa dimensão de restituição sem definir explicitamente os mecanismos da ressurreição.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. “Carrasco” é corrente e contextual; “mostre-se digno” evita uma construção participial pesada; “recebê-lo de volta” mantém o tom solene e a esperança de reencontro.
