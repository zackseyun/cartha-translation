lexical_decisions:
- source_word: Ἐχομένως
  choice: Em seguida
  rationale: Marca a continuidade sequencial da narrativa de modo natural e conciso.
- source_word: δὲ
  choice: não representado separadamente
  rationale: A progressão indicada pela partícula já é transmitida por “Em seguida”; acrescentar “e”, “mas” ou “então” seria desnecessário.
- source_word: τὸν πέμπτον
  choice: o quinto
  rationale: Mantém a formulação elíptica do grego; pelo contexto, trata-se do quinto entre os sete irmãos.
- source_word: προσάγοντες
  choice: trouxeram ... para a frente
  rationale: Expressa que fizeram o quinto avançar e o colocaram diante dos seus algozes, preservando o movimento indicado pelo particípio.
- source_word: ᾐκίζοντο
  choice: passaram a torturá-lo
  rationale: O verbo denota maus-tratos violentos ou tortura. A construção portuguesa comunica naturalmente o início da ação no novo episódio e conserva o valor durativo do imperfeito melhor do que um simples pretérito perfeito.
