  text: Next they brought forward the fifth and tortured him[a].
translation:
  language: pt
  text: Em seguida, trouxeram o quinto[a] para a frente e o torturavam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o quinto”. A palavra “irmão” está implícita no contexto dos sete irmãos.
