  text: And last of the sons[a], the mother died.
translation:
  language: pt
  text: Por último, depois dos filhos, morreu a mãe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por último, morreu a mãe, depois dos filhos.” A expressão grega é uma indicação breve de sequência: a mãe morreu após os filhos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσχάτῃ
  choice: Por último
  rationale: O dativo feminino singular de ἔσχατος tem aqui valor adverbial e marca a sequência final dos acontecimentos. “Por último” é natural em português e preserva a concisão narrativa.
- source_word: τῶν υἱῶν
  choice: depois dos filhos
  rationale: υἱῶν significa especificamente “filhos” no sentido de filhos homens. Ligado a ἐσχάτῃ, o genitivo indica que a mãe morreu depois deles; explicitar “depois” evita a impressão equivocada de que ela fazia parte do grupo dos filhos.
- source_word: ἡ μήτηρ
  choice: a mãe
  rationale: A expressão grega traz artigo e substantivo, sem possessivo explícito. “A mãe” mantém essa forma e é perfeitamente clara no contexto.
- source_word: ἐτελεύτησεν
  choice: morreu
  rationale: τελευτάω significa aqui “morrer” ou “chegar ao fim”. “Morreu” é direto, natural e preserva a brevidade solene do grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem verbal que conserva a ênfase final na mãe. A formulação evita tanto um possessivo não expresso no grego quanto uma leitura portuguesa que pudesse incluir a mãe entre os filhos.
