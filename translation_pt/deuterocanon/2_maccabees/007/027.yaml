base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/027.yaml
  text: 'But bending down to him[a], and mocking the cruel tyrant, she spoke in her native tongue as follows: “My son, have mercy on me, who carried you in the womb for nine months, nursed you for three years, raised you, brought you to this age[b], and cared for you.”'
translation:
  language: pt
  text: 'Mas ela se inclinou para ele e, zombando do tirano cruel, disse na língua de seus antepassados[a]: “Meu filho, tenha misericórdia de mim, que carreguei você no ventre por nove meses, amamentei você por três anos[b], criei você, levei você até esta idade e cuidei de você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em sua língua materna” ou “em sua língua ancestral”. O grego se refere à língua própria, herdada da família ou do povo.
    reason: lexical_alternative
  - marker: b
    text: Ou “dei de mamar a você por três anos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκύψασα αὐτῷ
  choice: se inclinou para ele
  rationale: O particípio de προσκύπτω descreve inclinar-se em direção a alguém. A formulação preserva o gesto concreto sem sugerir adoração ou submissão.
- source_word: χλενάσασα
  choice: zombando
  rationale: Expressa ridicularização desdenhosa e comunica com naturalidade a atitude desafiadora da mãe.
- source_word: τὸν ὠμὸν τύραννον
  choice: o tirano cruel
  rationale: ὠμός pode indicar crueldade ou ferocidade; “cruel” é claro, forte e idiomático em português.
- source_word: τῇ πατρίᾳ φωνῇ
  choice: na língua de seus antepassados
  rationale: Preserva a ideia de uma língua herdada da família ou do povo, sem reduzir necessariamente a expressão à primeira língua individual da mulher.
- source_word: ἐλέησόν με
  choice: tenha misericórdia de mim
  rationale: Mantém a força direta e afetiva do imperativo de ἐλεέω, sem suavizar o apelo materno.
- source_word: τὴν ἐν γαστρὶ περιενέγκασάν σε
  choice: que carreguei você no ventre
  rationale: Reproduz de modo natural e digno a referência à gestação.
- source_word: θηλάσασάν σε ἔτη τρία
  choice: amamentei você por três anos
  rationale: θηλάζω se refere especificamente a alimentar ao peito; “amamentei” é preciso e corrente.
- source_word: ἐκθρέψασάν σε
  choice: criei você
  rationale: O verbo abrange nutrir e criar uma criança; “criei” evita uma formulação excessivamente literal.
- source_word: ἀγαγοῦσαν εἰς τὴν ἡλικίαν ταύτην
  choice: levei você até esta idade
  rationale: Mantém a imagem de conduzir o filho até sua idade presente em português natural.
- source_word: τροφοφορήσασαν
  choice: cuidei de você
  rationale: O verbo raro comunica sustento e cuidado continuado. “Cuidei de você” é natural e não restringe o sentido apenas à provisão material.
theological_decisions:
- issue: O apelo materno ἐλέησόν με
  choice: tenha misericórdia de mim
  alternative: tenha compaixão de mim
  rationale: A opção conserva a intensidade e a forma tradicional do pedido de misericórdia, embora aqui a expressão seja afetiva, não uma fórmula doutrinária.
- issue: A identidade linguística em τῇ πατρίᾳ φωνῇ
  choice: na língua de seus antepassados
  alternative: em sua língua materna
  rationale: A tradução escolhida mantém a dimensão ancestral ou étnica da expressão e evita decidir se o texto se refere estritamente à primeira língua da mãe.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “você” preserva a sequência enfática do apelo materno e evita ambiguidades. Os marcadores foram colocados junto às expressões a que suas notas efetivamente se referem.
