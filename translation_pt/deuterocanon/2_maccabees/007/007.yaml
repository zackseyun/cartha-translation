base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/007.yaml
  text: When the first had died in this way[a], they brought the second to the mockery; and after tearing off the skin of his head with the hair, they asked[b], “Will you eat before your body is punished limb by limb?”
translation:
  language: pt
  text: 'Depois que o primeiro morreu dessa maneira, levaram o segundo para ser alvo de zombaria. Depois de lhe arrancarem o couro cabeludo com os cabelos[a], perguntaram-lhe: “Você vai comer[b] antes que seu corpo seja castigado, membro por membro?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a pele da cabeça com os cabelos”.
    reason: lexical_alternative
  - marker: b
    text: A pergunta se refere a comer o alimento proibido pela Lei dos antepassados, como deixa claro o contexto.
    reason: cross_reference
lexical_decisions:
- source_word: Μεταλλάξαντος
  choice: morreu
  rationale: Neste contexto narrativo, o verbo refere-se idiomaticamente à morte do primeiro irmão após a tortura, e não a uma mudança neutra.
- source_word: τοῦ πρώτου
  choice: o primeiro
  rationale: Preserva a elipse do grego, que é clara no contexto e natural em português.
- source_word: τὸν τρόπον τοῦτον
  choice: dessa maneira
  rationale: Retoma diretamente o modo como o primeiro morreu.
- source_word: ἦγον ἐπὶ τὸν ἐμπαιγμόν
  choice: levaram o segundo para ser alvo de zombaria
  rationale: Comunica que ele foi conduzido para sofrer escárnio e abuso, preservando a força de ἐμπαιγμός sem reduzir a cena a mero divertimento verbal.
- source_word: τὸ τῆς κεφαλῆς δέρμα
  choice: a pele da cabeça
  rationale: Reproduz de perto a expressão grega e evita que um termo mais técnico atenue a descrição concreta.
- source_word: σὺν ταῖς θριξὶν
  choice: junto com os cabelos
  rationale: Explicita que os cabelos foram arrancados juntamente com a pele.
- source_word: περισύραντες
  choice: depois de lhe arrancarem
  rationale: Expressa a remoção violenta indicada pelo verbo e mantém clara a sequência dos atos.
- source_word: ἐπηρώτων
  choice: perguntaram-lhe
  rationale: O pretérito perfeito oferece fluxo narrativo natural em português; o imperfeito grego pode descrever a ação em andamento sem exigir repetição explícita.
- source_word: Εἰ φάγεσαι
  choice: Você vai comer
  rationale: Mantém a pergunta direta e deixa que o contexto esclareça tratar-se do alimento proibido.
- source_word: πρὸ τοῦ τιμωρηθῆναι
  choice: antes que ... seja castigado
  rationale: Preserva o sentido amplo de punição do verbo, enquanto a expressão seguinte especifica seu caráter corporal.
- source_word: κατὰ μέλος
  choice: membro por membro
  rationale: Conserva a força distributiva e a referência às partes do corpo.
- source_word: τὸ σῶμα
  choice: seu corpo
  rationale: É o equivalente concreto e natural para o corpo físico submetido ao castigo.
