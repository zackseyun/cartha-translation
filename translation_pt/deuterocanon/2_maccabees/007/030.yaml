base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/030.yaml
  text: And while she was still finishing[a], the young man said, “What are you waiting for? I do not obey the king’s command, but I obey the command of the law that was given to our fathers through Moses.”
translation:
  language: pt
  text: 'Enquanto ela ainda terminava de falar, o jovem disse: “O que vocês estão esperando?[a] Não obedeço à ordem do rei; obedeço, porém, à ordem da Lei dada aos nossos pais por meio de Moisés.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por que vocês estão esperando?” A pergunta grega é elíptica e também pode transmitir a ideia de “Por que vocês estão demorando?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ ταύτης καταληγούσης
  choice: Enquanto ela ainda terminava de falar
  rationale: O genitivo absoluto indica uma ação simultânea. καταλήγω sugere chegar ao fim; no contexto, o complemento natural é a fala da mãe, explicitado em português para evitar uma construção truncada.
- source_word: ὁ νεανίας
  choice: o jovem
  rationale: νεανίας designa um homem jovem. “O jovem” é natural em português e adequado ao contexto narrativo.
- source_word: Τίνα μένετε;
  choice: O que vocês estão esperando?
  rationale: A pergunta grega é elíptica e desafia diretamente os agentes do rei. Esta formulação é corrente em português e preserva a ideia de espera ou demora.
- source_word: οὐχ ὑπακούω
  choice: Não obedeço
  rationale: Mantém o presente grego e expressa a recusa resoluta do jovem sem convertê-lo desnecessariamente em futuro.
- source_word: τοῦ προστάγματος τοῦ βασιλέως
  choice: à ordem do rei
  rationale: πρόσταγμα significa ordem, mandamento ou decreto. “Ordem” é idiomático e permite conservar o paralelismo com a ordem da Lei.
- source_word: τοῦ δὲ προστάγματος ἀκούω τοῦ νόμου
  choice: obedeço, porém, à ordem da Lei
  rationale: ἀκούω com genitivo pode significar ouvir, atender ou obedecer. O contraste com ὑπακούω e a referência a uma ordem favorecem “obedeço”; “porém” preserva a oposição marcada por δέ.
- source_word: τοῦ δοθέντος τοῖς πατράσιν ἡμῶν
  choice: dada aos nossos pais
  rationale: O particípio concorda com νόμου, e πατράσιν é literalmente “pais”, evocando a linhagem ancestral da aliança. A formulação preserva essa linguagem sem neutralizá-la.
- source_word: διὰ Μωσῆ
  choice: por meio de Moisés
  rationale: διά com genitivo indica mediação ou agência; “por meio de Moisés” transmite essa relação com precisão.
theological_decisions:
- issue: Sentido ancestral de πατράσιν
  choice: nossos pais
  alternative: nossos antepassados
  rationale: O grego emprega o masculino plural “pais” em linguagem de continuidade ancestral e da aliança. A tradução conserva essa forma, sem impedir que o contexto seja entendido como referência às gerações ancestrais.
- issue: Relação entre a ordem régia e a Lei
  choice: ordem do rei / ordem da Lei
  alternative: decreto do rei / mandamento da Lei
  rationale: A repetição de πρόσταγμα estabelece um contraste retórico deliberado entre duas autoridades. Repetir “ordem” preserva essa tensão sem acrescentar uma distinção teológica ausente do grego.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Emprega “vocês” porque o verbo grego está no plural e “Lei” com inicial maiúscula por se referir à Lei mosaica. O ponto e vírgula torna claro o contraste entre as duas declarações sem alterar a estrutura argumentativa.
