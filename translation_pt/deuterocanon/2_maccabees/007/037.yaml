base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/037.yaml
  text: But I[a], like my brothers, give up both body and life for the laws of our fathers, calling on God quickly to become merciful to the nation, and for you, through torments and whippings[b], to confess that he alone is God.
translation:
  language: pt
  text: Mas eu, assim como os meus irmãos, entrego o corpo e a vida[a] pelas leis de nossos pais, invocando a Deus para que logo se mostre misericordioso com a nossa nação e para que você, por meio de torturas e açoites, confesse[b] que somente ele é Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sorte” ou “destino”. O termo grego pode indicar a sorte ou o destino de alguém, mas aqui se refere concretamente à vida entregue no martírio.
    reason: lexical_alternative
  - marker: b
    text: Ou “reconheça publicamente”. O verbo grego também pode indicar uma admissão ou um reconhecimento aberto.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: assim como
  rationale: Introduz de modo natural a comparação entre a entrega do irmão e a de seus irmãos.
- source_word: σῶμα καὶ τύχην
  choice: o corpo e a vida
  rationale: σῶμα designa o corpo físico; embora τύχη costume significar sorte, destino ou condição, neste contexto de martírio refere-se concretamente à vida que é entregue.
- source_word: προδίδωμι
  choice: entrego
  rationale: No contexto, indica a entrega voluntária do corpo e da vida; evita o sentido inadequado de 'traio'.
- source_word: περὶ τῶν πατρίων νόμων
  choice: pelas leis de nossos pais
  rationale: Exprime que a entrega ocorre em defesa das leis herdadas dos antepassados e conserva a imagem familiar de πατρίων.
- source_word: ἐπικαλούμενοι τὸν θεόν
  choice: invocando a Deus
  rationale: Retrata uma súplica dirigida a Deus e mantém a ligação participial com a entrega do mártir.
- source_word: ἵλεων ταχὺ τῷ ἔθνει γενέσθαι
  choice: para que logo se mostre misericordioso com a nossa nação
  rationale: Comunica o pedido para que Deus passe a agir favoravelmente para com o povo; 'se mostre misericordioso' é natural em português sem apagar o aspecto ingressivo de γενέσθαι.
- source_word: μετὰ ἐτασμῶν καὶ μαστίγων
  choice: por meio de torturas e açoites
  rationale: Mantém o valor instrumental de μετά e expressa claramente os tormentos e golpes físicos previstos no texto.
- source_word: ἐξομολογήσασθαι
  choice: confesse
  rationale: Preserva o tom solene de admissão da verdade; a possibilidade de reconhecimento público é registrada em nota.
- source_word: διότι μόνος αὐτὸς θεὸς ἐστίν
  choice: que somente ele é Deus
  rationale: Conserva a ênfase exclusiva de μόνος αὐτός e remete ao Deus já mencionado.
theological_decisions:
- issue: Confissão monoteísta na oração final
  choice: que somente ele é Deus
  alternative: que ele é o único Deus
  rationale: A formulação escolhida preserva a ênfase de μόνος αὐτός sobre a exclusividade de Deus sem expandir a afirmação.
- issue: Caráter familiar de πατρίων
  choice: leis de nossos pais
  alternative: leis de nossos antepassados
  rationale: A opção mantém a imagem histórica e familiar do grego, em vez de reduzi-la a uma referência cultural abstrata.
- issue: Súplica relativa ao rei perseguidor
  choice: e para que você, por meio de torturas e açoites, confesse
  alternative: e que, por meio de torturas e açoites, Deus leve você a confessar
  rationale: A construção conserva a coordenação e a tensão sintática do grego, sem explicitar uma causalidade divina que o texto não declara diretamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'você' para a interpelação direta ao rei e 'açoites' como termo bíblico ainda corrente, sem arcaísmo excessivo. Os marcadores de nota foram colocados junto aos termos efetivamente comentados.
