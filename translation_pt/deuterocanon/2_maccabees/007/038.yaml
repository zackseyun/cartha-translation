  text: and in me and my brothers bring to an end the wrath of the Almighty that has justly been kindled against our whole nation[a].
translation:
  language: pt
  text: e faça cessar em mim e em meus irmãos a ira do Todo-Poderoso, que foi acesa com justiça contra todo o nosso povo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e faça a ira parar comigo e com meus irmãos”. O grego diz literalmente “em mim e em meus irmãos”, indicando que a ira chegaria ao seu termo neles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στῆσαι
  choice: faça cessar
  rationale: 'O infinitivo aoristo de ἵστημι tem aqui sentido causativo: fazer a ira parar. A formulação é natural em português e preserva a ideia de pôr fim a algo já em curso.'
- source_word: παντοκράτορος
  choice: Todo-Poderoso
  rationale: Título divino consagrado e claro em português, que comunica adequadamente a força de παντοκράτωρ.
- source_word: ὀργήν
  choice: ira
  rationale: “Ira” preserva melhor que “raiva” ou “zanga” a gravidade judicial e teológica da palavra neste contexto.
- source_word: σύμπαν ἡμῶν γένος
  choice: todo o nosso povo
  rationale: Neste contexto, γένος designa coletivamente o povo judeu. “Povo” é mais natural e menos sujeito a equívocos modernos que “raça”, enquanto σύμπαν é representado por “todo”.
- source_word: δικαίως
  choice: com justiça
  rationale: Expressa que a ira foi suscitada de modo justo, preservando o valor moral e judicial do advérbio.
- source_word: ἐπημμένην
  choice: se acendeu
  rationale: O particípio perfeito descreve a ira como já acesa e ainda vigente. O pretérito perfeito com a construção resultativa do português mantém a metáfora e se ajusta à oração relativa.
- source_word: ἐν ἐμοὶ δὲ καὶ τοῖς ἀδελφοῖς μου
  choice: em mim e em meus irmãos
  rationale: Retém a preposição ἐν e a imagem de que a ira chegaria ao seu ponto final neles, embora “comigo e com meus irmãos” seja uma alternativa mais idiomática.
theological_decisions:
- issue: A ira divina e o martírio como ponto em que o juízo cessa
  choice: O texto é vertido como um pedido para que a justa ira do Todo-Poderoso contra o povo cesse no próprio falante e em seus irmãos.
  alternative: Entender que a ira “se detenha sobre” eles ou, de modo mais livre, que seja “satisfeita” por meio deles.
  rationale: O sentido causativo de στῆσαι com ὀργήν favorece a ideia de fazer cessar a ira. A tradução mantém a tensão de que o sofrimento deles marca seu término, sem introduzir uma doutrina técnica de expiação que o versículo não explicita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Faça cessar” oferece naturalidade sem apagar a força causativa; a nota conserva a construção grega incomum e sua ambiguidade.
