base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/005.yaml
  text: 'And when he had become useless to the others[a], he ordered him to be brought to the fire while still breathing and to be fried in the pan. And when the vapor from the pan had spread considerably, they encouraged one another, together with their mother, to die nobly[b], saying this:'
translation:
  language: pt
  text: 'Quando ele se tornara inútil para os outros, o rei mandou que o levassem ao fogo enquanto ainda respirava[a] e que o fritassem na frigideira. Quando a frigideira desprendia vapor em quantidade considerável[b], eles, junto com a mãe, encorajavam uns aos outros a morrer com nobreza, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “enquanto ainda estava vivo”. O grego enfatiza que a tortura prosseguiu antes que ele morresse.
    reason: lexical_alternative
  - marker: b
    text: Ou “fumaça” ou “emanações”. O termo grego pode designar vapor ou emanações semelhantes à fumaça.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρηστον ... τοῖς λοιποῖς γενόμενον
  choice: já se tornou inútil para os outros
  rationale: Preserva a formulação brutal e desumanizadora do grego, bem como a referência aos demais irmãos, sem explicar além do que o texto diz.
- source_word: ἐκέλευσεν
  choice: o rei mandou
  rationale: O sujeito está subentendido pelo contexto imediato; explicitar “o rei” evita ambiguidade em português e mantém a força coercitiva do verbo.
- source_word: τῇ πυρᾷ προσάγειν
  choice: que o levassem ao fogo
  rationale: “Fogo” expressa o instrumento de tortura sem sugerir indevidamente uma pira funerária.
- source_word: ἔτινουν
  choice: enquanto ainda respirava
  rationale: Comunica vividamente que a vítima continuava viva durante a tortura; a nota registra a alternativa mais geral.
- source_word: τηγανίζειν
  choice: que o fritassem na frigideira
  rationale: Mantém a especificidade chocante do verbo derivado do termo para frigideira ou chapa rasa.
- source_word: τῆς ... ἀτμίδος ἐφʼ ἱκανὸν διδούσης τοῦ τηγάνου
  choice: quando a frigideira já soltava muito vapor
  rationale: Formulação natural em português para a emissão considerável de vapor pela frigideira, sem fixar excessivamente a natureza exata das emanações.
- source_word: ἀλλήλους παρεκάλουν σὺν τῇ μητρὶ
  choice: eles, junto com a mãe, encorajavam uns aos outros
  rationale: Inclui a mãe no encorajamento mútuo e preserva o aspecto continuado da cena.
- source_word: γενναίως τελευτᾷν
  choice: a morrer com nobreza
  rationale: Conserva tanto a coragem quanto a dimensão honorável de γενναίως, sem introduzir categorias doutrinárias posteriores.
theological_decisions:
- issue: Caracterização moral da morte dos irmãos
  choice: morrer com nobreza
  alternative: morrer corajosamente
  rationale: A expressão mantém o valor de honra e coragem presente em γενναίως sem transformar a narrativa em uma formulação doutrinária.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira e vocabulário amplamente internacional. A violência concreta e a formulação desumanizadora do original foram preservadas sem suavização. Os marcadores foram posicionados junto aos termos a que suas notas realmente se referem.
