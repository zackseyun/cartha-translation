lexical_decisions:
- source_word: Μετὰ δὲ τοῦτον
  choice: Depois dele
  rationale: A expressão marca a sequência dos irmãos e mantém a referência pessoal de modo natural em português.
- source_word: ὁ τρίτος
  choice: o terceiro
  rationale: O ordinal substantivado identifica o terceiro irmão; o contexto torna desnecessário acrescentar “irmão”.
- source_word: ἐνεπαίζετο
  choice: foi ridicularizado
  rationale: O verbo indica zombaria ou escárnio. A escolha preserva a humilhação sem acrescentar ao termo a ideia de tortura, já presente no contexto mais amplo.
- source_word: τὴν γλῶσσαν αἰτηθεὶς
  choice: Quando lhe exigiram a língua
  rationale: O particípio aoristo passivo é expresso por uma oração temporal natural. “Exigiram” comunica a natureza coerciva do pedido, e “lhe” identifica o possuidor da parte do corpo.
- source_word: ταχέως
  choice: sem demora
  rationale: Expressa a rapidez e prontidão da reação em português corrente e digno.
- source_word: προέβαλλεν
  choice: a pôs para fora
  rationale: Com “língua” como objeto, esta é uma formulação portuguesa clara e idiomática para o ato de projetá-la para a frente.
- source_word: εὐθαρσῶς
  choice: corajosamente
  rationale: O advérbio comunica coragem, confiança e firmeza diante da ameaça.
- source_word: τὰς χεῖρας … προέτεινεν
  choice: estendeu … as mãos
  rationale: Reproduz diretamente o gesto de apresentar as mãos, mantendo a vivacidade do texto grego.
