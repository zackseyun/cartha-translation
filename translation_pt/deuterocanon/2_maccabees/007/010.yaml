  text: After him[a], the third was mocked, and when his tongue was demanded, he quickly held it out and courageously stretched out his hands.
translation:
  language: pt
  text: Depois dele, o terceiro foi ridicularizado. Quando lhe exigiram a língua,[a] ele a pôs para fora sem demora e estendeu corajosamente as mãos.
  philosophy: optimal-equivalence
