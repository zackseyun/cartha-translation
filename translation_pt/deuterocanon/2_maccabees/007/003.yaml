  text: Then the king became furious and ordered frying pans and cauldrons to be heated[a].
translation:
  language: pt
  text: Então o rei ficou furioso e ordenou que frigideiras e caldeirões fossem aquecidos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fossem aquecidos até ficarem em brasa”; o verbo grego indica aquecimento pelo fogo, possivelmente intenso.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκθύμως
  choice: furioso
  rationale: O termo expressa ira intensa; “furioso” preserva sua força emocional em português natural.
- source_word: γενόμενος
  choice: ficou
  rationale: O particípio indica a entrada do rei nesse estado emocional; “ficou furioso” é a formulação idiomática em português.
- source_word: ὁ βασιλεὺς
  choice: o rei
  rationale: Equivalência direta do título presente no grego, sem especificação adicional.
- source_word: προσέταξεν
  choice: ordenou
  rationale: Transmite de modo conciso a emissão de uma ordem com autoridade.
- source_word: τήγανα
  choice: frigideiras
  rationale: Designa utensílios de metal usados para fritar ou assar; “frigideiras” é claro e corrente.
- source_word: λέβητας
  choice: caldeirões
  rationale: Refere-se a grandes recipientes metálicos; “caldeirões” comunica melhor seu porte e o contexto do que termos mais domésticos.
- source_word: ἐκπυροῦν
  choice: fossem aquecidos
  rationale: O verbo indica aquecer pelo fogo, possivelmente de modo intenso. A tradução mantém o sentido explícito sem impor que os objetos chegaram a ficar incandescentes.
