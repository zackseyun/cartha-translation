translation:
  language: pt
  text: Quando este também morreu[a], torturavam o quarto da mesma maneira, maltratando-o.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “partiu desta vida”. O verbo grego pode funcionar como uma expressão respeitosa para a morte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταλλάξαντος
  choice: morreu
  rationale: No genitivo absoluto e neste contexto de martírio, o verbo funciona como expressão para morrer ou deixar esta vida. “Morreu” é claro e natural, enquanto a nota preserva o valor eufemístico possível.
- source_word: τοῦτον δὲ
  choice: este também
  rationale: O demonstrativo retoma o irmão mencionado anteriormente, e a combinação com καί comunica a progressão adicional da narrativa.
- source_word: τὸν τέταρτον
  choice: o quarto
  rationale: Mantém a forma concisa do grego; o contexto identifica claramente que se trata do quarto irmão.
- source_word: ὡσαύτως
  choice: da mesma maneira
  rationale: Expressa de modo natural que o tratamento infligido aos irmãos anteriores se repetiu.
- source_word: ἐβασάνιζον
  choice: torturavam
  rationale: O verbo denota tortura física neste contexto, e o imperfeito português preserva o aspecto durativo do imperfeito grego.
- source_word: αἰκιζόμενοι
  choice: maltratando-o
  rationale: O particípio acrescenta a ideia de maus-tratos violentos que acompanhavam a tortura; o pronome objeto é naturalmente explicitado em português a partir do contexto.
