base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/014.yaml
  text: 'And when he was about to die[a], he said this: “It is preferable, when dying at the hands of men, to await the hopes given by God—that one will be raised again by him[b]. But for you there will be no resurrection to life.”'
translation:
  language: pt
  text: 'Quando estava prestes a morrer, ele disse: “É preferível, ao morrer às mãos dos homens, aguardar as esperanças que vêm de Deus: ser ressuscitado novamente por ele.[a] Para você, porém, não haverá ressurreição para a vida.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “É preferível, ao morrer às mãos dos homens, esperar as esperanças da parte de Deus — ser ressuscitado novamente por ele.” O grego conserva “esperanças” no plural e liga de forma compacta essa expectativa à ressurreição por Deus.'
    reason: Preserva o plural de ἐλπίδας e esclarece, sem acrescentar a ideia de “cumprimento”, a construção sintaticamente compacta do original.
  - marker: b
    text: A expressão “não haverá ressurreição para a vida” pode indicar exclusão de uma ressurreição que conduz à vida, sem negar explicitamente toda e qualquer ressurreição.
    reason: Conserva a tensão semântica de ἀνάστασις εἰς ζωὴν sem optar por uma conclusão doutrinária além do texto.
lexical_decisions:
- source_word: γενόμενος πρὸς τῷ τελευτᾷν
  choice: quando estava prestes a morrer
  rationale: A construção idiomática com πρὸς τῷ e infinitivo expressa iminência. A formulação é natural em português e conserva claramente o sentido temporal.
- source_word: οὕτως ἔφη
  choice: ele disse
  rationale: Introduz a fala de modo simples e idiomático. O valor de οὕτως já fica evidente pela citação que se segue, sem necessidade do pouco natural “disse assim”.
- source_word: Αἱρετὸν
  choice: é preferível
  rationale: Preserva o sentido avaliativo de algo digno de escolha ou preferível, com registro corrente e digno.
- source_word: μεταλλάσσοντας ἀπὸ ἀνθρώπων
  choice: ao morrer às mãos dos homens
  rationale: Neste contexto de martírio, μεταλλάσσω se refere a deixar esta vida, enquanto ἀπὸ ἀνθρώπων assinala a agência humana. “Às mãos dos homens” comunica isso naturalmente.
- source_word: τὰς ὑπὸ τοῦ θεοῦ προσδοκᾷν ἐλπίδας
  choice: aguardar o cumprimento das esperanças que vêm de Deus
  rationale: Em português, “aguardar esperanças” seria obscuro. “Aguardar o cumprimento” explicita idiomaticamente que as esperanças são realidades esperadas, enquanto “que vêm de Deus” preserva a relação de origem sem introduzir a ideia não expressa de promessa.
- source_word: πάλιν ἀναστήσεσθαι ὑπʼ αὐτοῦ
  choice: ser ressuscitado novamente por ele
  rationale: Conserva o infinitivo passivo futuro, a ação divina e o valor de πάλιν. O pronome “ele” retoma Deus sem substituir o texto por uma repetição interpretativa.
- source_word: ἀνάστασις εἰς ζωὴν
  choice: ressurreição para a vida
  rationale: Mantém formalmente a expressão teologicamente significativa e deixa intacta a qualificação “para a vida”, sem convertê-la em uma negação absoluta de toda ressurreição.
theological_decisions:
- issue: Esperança de ressurreição do mártir em contraste com a declaração dirigida ao perseguidor
  choice: O mártir espera ser ressuscitado por Deus, enquanto ao destinatário se declara que não haverá “ressurreição para a vida”.
  alternative: Entender a frase final como negação de qualquer ressurreição para o destinatário.
  rationale: A expressão εἰς ζωὴν qualifica ἀνάστασις. Preservá-la mantém aberta a possibilidade de que se negue especificamente uma ressurreição que conduz à vida, em vez de se afirmar explicitamente que o destinatário jamais ressuscitará.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno e direto. Evitaram-se tanto construções excessivamente literais e pouco idiomáticas quanto explicações doutrinárias inseridas no corpo do versículo.
