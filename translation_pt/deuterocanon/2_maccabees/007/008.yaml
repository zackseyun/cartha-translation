base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/008.yaml
  text: But he answered in the language of his fathers and said[a], “No.” Therefore this one also received the next torture, like the first.
translation:
  language: pt
  text: 'Ele, porém, respondeu na língua de seus antepassados[a]: “Não.” Por isso, também ele sofreu a tortura seguinte, como o primeiro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em sua língua ancestral” ou “em sua língua materna”. O grego se refere literalmente à fala ou língua dos antepassados.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: respondeu
  rationale: O particípio aoristo de ἀποκρίνομαι tem sentido deponente e introduz naturalmente a resposta direta.
- source_word: τῇ πατρίῳ φωνῇ
  choice: na língua de seus antepassados
  rationale: πατρίος expressa vínculo ancestral, e φωνή, neste contexto, designa fala ou língua. A formulação conserva a dimensão familiar e étnica sem identificar uma língua específica.
- source_word: προσεῖπεν
  choice: '[incorporado em] respondeu'
  rationale: Embora o verbo possa significar “disse” ou “dirigiu-se”, em português a sequência literal “respondeu... e disse” seria pesada. A fala direta depois de “respondeu” comunica naturalmente sua função.
- source_word: Οὐχί
  choice: Não
  rationale: É uma negativa enfática em resposta direta; “Não” preserva sua força no contexto sem acrescentar uma intensificação ausente do texto.
- source_word: διόπερ
  choice: Por isso
  rationale: Expressa a consequência direta da recusa em português moderno e natural.
- source_word: οὗτος
  choice: também ele
  rationale: O pronome demonstrativo aponta para o irmão em questão. “Também ele” mantém o contraste sequencial sem a rigidez de “este também”.
- source_word: τὴν ἑξῆς ἔλαβεν βάσανον
  choice: sofreu a tortura seguinte
  rationale: βάσανος designa aqui tortura, e ἑξῆς indica a etapa seguinte da sequência. O uso idiomático de “sofreu” evita o calque pouco natural “recebeu a tortura”.
- source_word: ὡς ὁ πρῶτος
  choice: como o primeiro
  rationale: Mantém a comparação concisa com o primeiro irmão, sem explicitar além do grego.
theological_decisions:
- issue: Sentido de τῇ πατρίῳ φωνῇ
  choice: na língua de seus antepassados
  alternative: em sua língua ancestral; em sua língua materna
  rationale: A opção preserva a associação ancestral e identitária da expressão grega, importante no contexto de resistência à perseguição, sem decidir qual idioma era falado nem reduzir o sentido apenas à língua aprendida na infância.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redundância grega entre “respondeu” e “disse” foi condensada de modo idiomático, sem perda do conteúdo. O marcador [a] aparece imediatamente após a expressão que esclarece.
