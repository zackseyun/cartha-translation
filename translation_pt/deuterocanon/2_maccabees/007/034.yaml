base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/034.yaml
  text: But you[a], O unholy one, most defiled of all men, do not be vainly puffed up, inflamed with uncertain hopes, having raised your hands against the children of heaven.
translation:
  language: pt
  text: Mas você, ó ímpio, o mais impuro de todos os homens, não se exalte em vão, inflamado por esperanças incertas, tendo levantado as mãos contra os filhos do céu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os filhos celestiais”. O grego pode descrever os próprios filhos como “celestiais” ou apresentá-los como “filhos do céu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόσιε
  choice: ímpio
  rationale: O vocativo denuncia diretamente a falta de reverência e santidade; “ímpio” preserva a dimensão religiosa e é natural em português bíblico atual.
- source_word: μιαρώτατε
  choice: o mais impuro
  rationale: O superlativo de μιαρός comunica contaminação ou impureza moral e ritual; “o mais impuro” mantém essa imagem sem reduzi-la apenas a vileza genérica.
- source_word: μὴ μάτην μετεωρίζου
  choice: não se exalte em vão
  rationale: A expressão combina elevação ou autoexaltação com inutilidade; esta formulação é clara, digna e próxima da imagem grega.
- source_word: φρυττόμενος
  choice: ardendo
  rationale: O particípio sugere estar aquecido, inflamado ou excitado; “ardendo” conserva a metáfora de calor e se liga naturalmente às esperanças.
- source_word: ἀδήλοις ἐλπίσιν
  choice: de esperanças incertas
  rationale: ἀδήλοις indica aquilo que não é evidente, seguro ou definido; “incertas” preserva a instabilidade sem acrescentar a ideia de engano.
- source_word: οὐρανίους παῖδας
  choice: os filhos do céu
  rationale: παῖδας pode significar filhos ou crianças, e οὐρανίους pode qualificá-los como celestiais ou vinculá-los ao céu. “Filhos do céu” preserva a formulação teológica elevada e sua abertura interpretativa.
- source_word: ἐπαράμενος χεῖρας
  choice: depois de levantar as mãos contra
  rationale: O particípio aoristo descreve a ação hostil anterior ou circunstancial; “levantar as mãos contra” mantém a imagem corporal e o sentido de agressão.
theological_decisions:
- issue: Sentido de οὐρανίους em οὐρανίους παῖδας
  choice: os filhos do céu
  alternative: os filhos celestiais
  rationale: O grego permite entender o adjetivo como qualidade (“celestiais”) ou como pertença/associação com o céu. O texto principal conserva a relação com o céu sem inserir explicitamente um título divino ausente do original; a nota registra a alternativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com sintaxe direta e tratamento por “você”. A tradução conserva a força da denúncia, a linguagem de impureza, a metáfora de exaltação e calor, e a ambiguidade teológica de οὐρανίους παῖδας.
