base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/021.yaml
  text: And she encouraged each one of them in the language of their fathers[a], filled with a noble spirit, and, stirring her womanly reasoning with manly courage, she said to them[b],
translation:
  language: pt
  text: 'Ela encorajava cada um deles na língua de seus antepassados[a], cheia de nobre determinação e, tendo despertado seu raciocínio feminino com coragem masculina, dizia-lhes[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «na língua ancestral» ou «em sua língua materna». O grego se refere literalmente à fala paterna ou ancestral.
    reason: lexical_alternative
  - marker: b
    text: 'O grego estabelece um contraste de gênero deliberado: literalmente, «tendo despertado o raciocínio feminino com coragem (ou ânimo) masculina». A formulação reflete categorias retóricas da época.'
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστον
  choice: cada um deles
  rationale: O acusativo singular tem sentido distributivo e indica que ela se dirigia individualmente a cada filho.
- source_word: παρεκάλει
  choice: encorajava
  rationale: No contexto do martírio, o verbo expressa incentivo e fortalecimento para permanecer firme, mais do que simples consolo.
- source_word: τῇ πατρίῳ φωνῇ
  choice: na língua de seus antepassados
  rationale: πατρίῳ designa o que é ancestral ou paterno, e φωνῇ aqui se refere à língua falada; a formulação preserva o vínculo ancestral sem criar ambiguidade artificial sobre o possuidor.
- source_word: γενναίῳ ... φρονήματι
  choice: cheia de nobre determinação
  rationale: φρόνημα pode indicar disposição, atitude interior ou resolução; 'nobre determinação' comunica com naturalidade a firmeza moral sugerida no contexto.
- source_word: τὸν θῆλυν λογισμόν
  choice: seu raciocínio feminino
  rationale: A expressão preserva tanto o sentido de λογισμός, raciocínio ou pensamento, quanto a caracterização explicitamente feminina de θῆλυς.
- source_word: ἄρσενι θυμῷ
  choice: com coragem masculina
  rationale: θυμός aqui denota ânimo corajoso ou impetuoso, não ira; 'coragem masculina' mantém o contraste de gênero deliberado do grego.
- source_word: διεγείρασα
  choice: despertando
  rationale: O particípio aoristo descreve o ato de pôr em ação ou avivar a disposição interior antes de ela falar.
- source_word: λέγουσα πρὸς αὐτούς
  choice: dizia-lhes
  rationale: A construção participial introduz a fala seguinte; o imperfeito em português se articula naturalmente com 'encorajava' e com a continuação narrativa.
theological_decisions:
- issue: Contraste retórico de gênero na descrição da mãe
  choice: Preservar no texto principal o contraste entre 'raciocínio feminino' e 'coragem masculina'.
  alternative: Neutralizar como 'sentimentos naturais' e 'brava determinação', ou suavizar como 'sentimentos maternos' e 'ânimo forte'.
  rationale: O grego emprega deliberadamente θῆλυς e ἄρσην para construir um contraste segundo categorias retóricas antigas. Neutralizá-lo apagaria uma tensão real do texto; a nota esclarece seu caráter cultural sem endossá-lo como afirmação universal.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Mantém-se a linguagem de gênero do original, acompanhada de nota cultural, e usa-se 'antepassados' para preservar o sentido ancestral de πατρίῳ.
