  source_fidelity: 'A abertura do rascunho inverte o referente de ἔτυχεν. O verbo está no singular e se refere ao homem em questão: ele obteve/desfrutou da benevolência que «temos para com todas as nações», e não «alcançamos» nós essa benevolência. Os infinitivos dependentes de ἐπὶ τοσοῦτον ὥστε descrevem o resultado dessa posição: ele é proclamado, recebe homenagem e continua na posição imediatamente abaixo do trono.'
  naturalness: A redação proposta torna clara a sequência sintática e mantém o registro solene de uma proclamação de corte. «Receber homenagem» é mais direto e idiomático que «recebe a reverência», sem eliminar a nota sobre a prostração literal.
  terminology: «Benevolência», «nações», «proclamado nosso pai» e «trono real» são adequados. «A segunda pessoa depois do trono real» preserva a expressão cortesã incomum e a noção de precedência inferior ao trono, sem a explicar excessivamente.
  issues:
