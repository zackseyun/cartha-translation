    issue: O sujeito de ἔτυχεν foi traduzido como «nós» em «Alcançamos».
    rationale: ἔτυχεν é singular, enquanto ἔχομεν («temos») é primeira pessoa plural dentro da oração relativa. A construção diz que ele obteve ou desfrutou da benevolência que nós temos para com todas as nações.
  - severity: medium
    issue: A ligação de «permanecendo» com a posição final fica menos explícita no rascunho.
    rationale: διατελεῖν é um infinitivo de continuação coordenado aos demais resultados. «Continuar como» preserva claramente a duração do status.
  revised_text: Ele desfrutou da benevolência que temos para com todas as nações, a tal ponto que é proclamado nosso pai, recebe homenagem de todos[a] e continua como a segunda pessoa depois do trono real.
