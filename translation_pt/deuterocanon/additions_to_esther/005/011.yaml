  yaml_path: translation/deuterocanon/additions_to_esther/005/011.yaml
  text: We have attained such goodwill toward every nation that he is proclaimed our father and is honored by all[a], continuing as the second person to the royal throne.
translation:
  language: pt
  text: Ele desfrutou da benevolência que temos para com todas as nações, a tal ponto que é proclamado nosso pai, recebe homenagem de todos[a] e continua como a segunda pessoa depois do trono real.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «diante dele todos se prostram». O verbo grego pode indicar prostração ou homenagem prestada a um superior.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυχεν
  choice: alcançamos
  rationale: Com o genitivo, τυγχάνω expressa obter ou alcançar algo; a forma portuguesa preserva a construção na primeira pessoa do plural.
- source_word: φιλανθρωπίας
  choice: benevolência
  rationale: Indica uma disposição bondosa ou favorável. «Benevolência» mantém o tom formal e evita o sentido moderno inadequado de «filantropia».
- source_word: πρὸς πᾶν ἔθνος
  choice: para com todas as nações
  rationale: Expressa a direção da benevolência e preserva o alcance distributivo de πᾶν ἔθνος em contexto imperial.
- source_word: ἐπὶ τοσοῦτον ὥστε
  choice: tal ... que
  rationale: Reproduz de maneira natural em português a construção grega que introduz uma consequência.
- source_word: ἀναγορεύεσθαι
  choice: é proclamado
  rationale: Preserva o sentido de declaração pública ou designação oficial, adequado ao registro da corte.
- source_word: πατέρα
  choice: pai
  rationale: Mantém o título familiar literal, sem substituí-lo por uma interpretação como «protetor» ou «patrono».
- source_word: προσκυνούμενον
  choice: recebe a reverência de todos
  rationale: Conserva o sentido de homenagem deferente no contexto da corte sem afirmar de modo inequívoco culto divino; o gesto corporal mais literal consta em nota.
- source_word: τὸ δεύτερον τοῦ Βασιλικοῦ θρόνου πρόσωπον
  choice: a segunda pessoa depois do trono real
  rationale: Comunica a posição imediatamente inferior à autoridade régia, ao mesmo tempo que preserva «pessoa» para πρόσωπον e a formulação cortesã incomum.
- source_word: διατελεῖν
  choice: permanecendo
  rationale: Expressa a duração ou continuidade do estado e liga naturalmente o verbo à posição descrita na oração final.
theological_decisions:
- issue: Sentido de προσκυνούμενον em contexto de corte real
  choice: recebe a reverência de todos
  alternative: todos se prostram diante dele; é adorado por todos
  rationale: O verbo pode indicar prostração ou homenagem diante de um superior e, em outros contextos, adoração. Aqui, o cenário imperial favorece reverência cortesã, mas a nota preserva o gesto concreto e a amplitude lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém o tom oficial da proclamação imperial e conserva a formulação deliberadamente cortesã da posição junto ao trono.
