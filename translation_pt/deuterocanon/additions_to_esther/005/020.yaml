  text: and to strengthen them[a], so that they might defend themselves against those who attacked them in the time of distress, on the thirteenth day of the twelfth month, Adar[b], on that same day.
translation:
  language: pt
  text: e para fortalecê-los[a], a fim de que se defendessem dos que os atacassem em tempo de aflição[b], no décimo terceiro dia do décimo segundo mês, Adar, naquele mesmo dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «para apoiá-los» ou «para reforçá-los».
    reason: lexical_alternative
  - marker: b
    text: A expressão «em tempo de aflição» também pode ser entendida de modo mais geral como «em tempo de angústia» ou «em tempo de dificuldade».
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπισχύειν
  choice: fortalecê-los
  rationale: O infinitivo expressa a concessão de força ou apoio adicional; «fortalecê-los» preserva o sentido causativo e se liga naturalmente ao contexto.
- source_word: ὅπως
  choice: a fim de que
  rationale: Introduz uma oração de finalidade; a formulação mantém claramente a força intencional do grego.
- source_word: θλίψεως
  choice: aflição
  rationale: Em ἐν καιρῷ θλίψεως, o termo indica pressão, angústia ou calamidade; «aflição» conserva o peso da expressão sem especificar indevidamente sua natureza.
- source_word: ἐπιθεμένους
  choice: os que os atacassem
  rationale: O particípio de ἐπιτίθημι tem aqui sentido hostil; «atacassem» é atual, claro e adequado ao contexto de violência.
- source_word: ἀμύνωνται
  choice: se defendessem
  rationale: A voz média indica ação em defesa própria; a escolha preserva tanto a reflexividade quanto o caráter autorizado da resistência.
- source_word: τῇ τρισκαιδεκάτῃ τοῦ δωδεκάτου μηνὸς Ἀδὰρ
  choice: no décimo terceiro dia do décimo segundo mês, adar
  rationale: A data é apresentada explicitamente, mantendo o nome do mês por transliteração e a ordem informativa do grego.
- source_word: τῇ αὐτῇ ἡμέρᾳ
  choice: naquele mesmo dia
  rationale: A expressão enfatiza a identidade do dia com a data indicada; «naquele mesmo dia» conserva essa ênfase.
