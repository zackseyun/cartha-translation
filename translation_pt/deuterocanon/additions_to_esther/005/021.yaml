lexical_decisions:
- source_word: ταύτην
  choice: isso
  rationale: O demonstrativo feminino retoma a situação mencionada imediatamente antes. “Isso” mantém o referente amplo e soa natural em português.
- source_word: ὁ πάντα δυναστεύων θεὸς
  choice: Deus, que governa sobre tudo
  rationale: δυναστεύω expressa o exercício de poder ou domínio. A formulação comunica a soberania ativa de Deus sem recorrer a um título teológico posterior nem à conotação negativa de “dominar”.
- source_word: ἀντʼ ὀλεθρίας
  choice: em vez da destruição
  rationale: ἀντί indica substituição ou reversão, e ὀλεθρία denota destruição ou ruína. A tradução preserva o contraste direto.
- source_word: τοῦ ἐκλεκτοῦ γένους
  choice: do povo escolhido
  rationale: Neste contexto comunitário judaico, γένος designa o povo unido por origem e identidade. “Povo escolhido” é claro e natural em português, enquanto a alternativa mais literal é registrada em nota.
- source_word: ἐποίησεν αὐτοῖς εὐφροσύνην
  choice: transformou isso em alegria para eles
  rationale: ποιέω com os acusativos ταύτην e εὐφροσύνην comunica que a situação foi convertida em alegria. “Transformou isso em” explicita naturalmente essa construção em português.
theological_decisions:
- issue: A soberania divina em ὁ πάντα δυναστεύων θεὸς
  choice: Deus, que governa sobre tudo
  alternative: o Deus soberano sobre tudo
  rationale: A tradução conserva a ação soberana de Deus na reversão da ameaça sem transformar a expressão em um título divino fixo.
- issue: A identidade coletiva em τοῦ ἐκλεκτοῦ γένους
  choice: o povo escolhido
  alternative: a linhagem escolhida
  rationale: γένος pode indicar povo, raça, descendência ou linhagem. O contexto aponta para Israel como coletividade étnica e pactual; “povo” comunica isso com naturalidade, e a nota preserva a nuance genealógica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A oração relativa mantém a ênfase no governo universal de Deus, e a vírgula final preserva a continuidade sintática do trecho maior.
