  text: For God[a], who rules over all, has made this a joy for them instead of the destruction of the chosen race,
translation:
  language: pt
  text: Pois Deus, que governa sobre tudo, transformou isso em alegria para eles, em vez da destruição do povo escolhido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da linhagem escolhida”.
