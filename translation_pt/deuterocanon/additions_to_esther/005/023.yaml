  yaml_path: translation/deuterocanon/additions_to_esther/005/023.yaml
  text: so that both now and after these things there may be deliverance for us and for the Persians who are well-disposed toward us[a], but for those plotting against us[b], a memorial of destruction.
translation:
  language: pt
  text: para que, tanto agora como depois destas coisas, haja livramento[a] para nós e para os persas que nos são favoráveis, mas, para os que tramam contra nós, um memorial de destruição.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «salvação». O grego σωτηρία pode ter ambos os sentidos, mas aqui provavelmente se refere à preservação concreta diante do perigo.
    reason: lexical_alternative
  - marker: b
    text: Ou «uma lembrança da destruição» ou «um lembrete da destruição deles». A expressão grega é compacta e pode indicar um memorial duradouro da queda dos que tramam contra eles.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: para que
  rationale: Introduz a finalidade ou o resultado esperado e conserva a orientação prospectiva da oração.
- source_word: σωτηρία
  choice: livramento
  rationale: Neste contexto político e narrativo, indica preservação concreta diante do perigo, sem excluir a amplitude semântica de «salvação».
- source_word: εὐνοοῦσιν
  choice: que nos são favoráveis
  rationale: Expressa boa vontade ou disposição benévola para com o grupo, sem ampliar o sentido para amizade ou apoio formal.
- source_word: Πέρσαις
  choice: os persas
  rationale: O dativo está coordenado com ἡμῖν sob σωτηρία; a forma portuguesa explicita naturalmente o artigo.
- source_word: ἐπιβουλεύουσιν
  choice: tramam contra nós
  rationale: Comunica de modo natural a ideia de conspiração ou maquinação hostil.
- source_word: μνημόσυνον
  choice: um memorial
  rationale: Preserva a noção de algo que mantém uma lembrança duradoura e o tom solene da expressão grega.
- source_word: ἀπωλείας
  choice: destruição
  rationale: Designa ruína ou queda catastrófica; «destruição» é direto e adequado ao contexto.
- source_word: μετὰ ταῦτα
  choice: depois destas coisas
  rationale: Mantém a sequência temporal explícita e o paralelismo retórico com «agora».
theological_decisions:
- issue: Tradução de σωτηρία numa narrativa cortesã deuterocanônica
  choice: livramento
  alternative: salvação; resgate
  rationale: O contexto imediato trata da preservação do povo e de seus aliados no ambiente persa. «Livramento» se ajusta à situação concreta sem reduzir o termo a um resgate meramente secular nem impor uma conotação soteriológica técnica.
- issue: Sentido de μνημόσυνον τῆς ἀπωλείας
  choice: um memorial de destruição
  alternative: uma lembrança da destruição; um lembrete da destruição deles
  rationale: A construção grega é compacta e elíptica. A tradução conserva seu tom solene e deixa aberta a relação exata entre o memorial e a destruição, sem inserir um pronome interpretativo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A estrutura mantém o contraste entre o livramento dos beneficiários e o memorial de destruição reservado aos adversários, preservando a concisão e a ambiguidade do grego.
