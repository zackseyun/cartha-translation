  text: For by these methods he thought that[a], once he had made us desolate, he would transfer the rule of the Persians to the Macedonians.
translation:
  language: pt
  text: Pois, por esses meios, ele pensou que, depois de nos deixar desolados[a], transferiria o domínio dos persas para os macedônios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «depois de nos tornar desolados» ou «quando nos tivesse deixado abandonados». A expressão grega é idiomática, e a maneira exata de entender o estado de desolação pode ser expressa de mais de uma forma.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ γὰρ τῶν τρόπων τούτων
  choice: Pois ele pensou que, por esses meios
  rationale: “Por esses meios” expressa naturalmente a ideia instrumental de τρόποι neste contexto de intriga política; “pois” preserva a ligação explicativa de γάρ.
- source_word: ᾠήθη
  choice: ele pensou
  rationale: O aoristo deponente exprime a suposição ou avaliação do sujeito; “pensou” é claro e direto.
- source_word: λαβὼν ἡμᾶς ἐρήμους
  choice: depois de nos deixar desolados
  rationale: A construção participial é idiomática. Esta formulação conserva a anterioridade da ação e o estado de desolação sem tornar o português artificial.
- source_word: τὴν τῶν Περσῶν ἐπικράτησιν
  choice: o domínio dos persas
  rationale: ἐπικράτησις denota domínio, supremacia ou poder governante; “domínio” preserva o sentido político e o registro digno sem ampliar para “império”.
- source_word: εἰς τοὺς Μακεδόνας μετάξει
  choice: transferiria ... para os macedônios
  rationale: “Transferiria” representa o futuro sob o escopo de “pensou” e comunica a passagem do domínio de um povo para outro.
theological_decisions:
- issue: Formulação histórico-política em uma adição grega deuterocanônica
  choice: Manter explicitamente “persas” e “macedônios” e traduzir a transferência de domínio de modo direto.
  alternative: Generalizar como “o reino persa para os gregos”.
  rationale: O grego nomeia especificamente os dois povos e fala de transferência de domínio; não há razão textual para harmonizar ou generalizar a afirmação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi ajustada para fluência, mantendo a relação explicativa, a anterioridade do particípio e a ambiguidade da expressão idiomática em nota.
