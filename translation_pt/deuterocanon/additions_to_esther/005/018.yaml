  yaml_path: translation/deuterocanon/additions_to_esther/005/018.yaml
  text: because the very man who had brought about these things was crucified at the gate of Susa with his whole household[a], since God, who rules over all, swiftly repaid him with the punishment he deserved,
translation:
  language: pt
  text: porque o próprio homem que havia levado a cabo essas coisas foi crucificado[a] junto aos portões de Susa com toda a sua casa, pois Deus, que governa todas as coisas, rapidamente lhe retribuiu com o castigo que merecia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “foi empalado” ou “foi pendurado numa estaca”. O verbo grego pode designar execução numa estaca ou numa cruz; o método persa exato não precisa ter sido igual à crucificação romana posterior.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ
  choice: porque
  rationale: Introduz a causa do que foi afirmado anteriormente, preservando a força explicativa da construção grega.
- source_word: αὐτὸν τὸν ταῦτα ἐξεργασάμενον
  choice: justamente o homem que havia tramado essas coisas
  rationale: “Justamente” comunica a ênfase de αὐτόν; “tramado” expressa com naturalidade o ato de levar a cabo ações nocivas, sem especificar além do contexto.
- source_word: πρὸς ταῖς Σούσων πύλαις
  choice: junto aos portões de Susa
  rationale: Preserva tanto a ideia locativa de πρός com dativo quanto o plural πύλαις.
- source_word: ἐσταυρῶσθαι
  choice: foi crucificado
  rationale: É a correspondência direta do verbo grego, enquanto a nota registra que ele pode abranger execução em poste ou estaca no contexto persa.
- source_word: σὺν τῇ πανοικίᾳ
  choice: com toda a sua casa
  rationale: “Casa” no sentido coletivo preserva a amplitude de πανοικία, que pode incluir família, servos e demais dependentes, sem restringi-la à família nuclear.
- source_word: τὴν καταξίαν ... κρίσιν
  choice: o castigo que merecia
  rationale: A formulação reúne a noção de juízo ou punição de κρίσις e a de retribuição merecida de καταξία em português natural.
- source_word: τοῦ τὰ πάντα ἐπικρατοῦντος θεοῦ
  choice: Deus, que governa sobre todas as coisas
  rationale: Expressa o domínio universal indicado por ἐπικρατέω sem acrescentar formulação doutrinária alheia ao texto.
- source_word: διὰ τάχους
  choice: rapidamente
  rationale: Equivalente adverbial idiomático que preserva a ideia de prontidão e rapidez.
- source_word: ἀποδόντος αὐτῷ κρίσιν
  choice: lhe retribuiu com o castigo
  rationale: Mantém a agência divina e o sentido de retribuição judicial de ἀποδίδωμι com κρίσις.
theological_decisions:
- issue: Ação divina no juízo
  choice: Deus é apresentado como aquele que retribui ativa e rapidamente ao culpado com o castigo merecido.
  alternative: Atenuar a agência divina ou traduzir κρίσις apenas como “juízo”.
  rationale: A construção grega atribui diretamente a Deus a retribuição judicial; “castigo” preserva, no contexto, a dimensão punitiva, sem desenvolver uma doutrina além do enunciado.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A oração permanece em minúscula e termina com vírgula por integrar uma frase mais ampla no contexto. “Toda a sua casa” mantém o sentido coletivo antigo sem limitar a referência à família nuclear.
