  text: But every city or region as a whole that does not act according to these orders will be consumed with spear and fire in wrath[a]; it will be made not only impassable to men[b], but also most hateful to wild animals and birds for all time.
translation:
  language: pt
  text: Mas toda cidade ou região, em sua totalidade, que não agir de acordo com estas ordens será consumida pela lança e pelo fogo, com ira[a]; será tornada não apenas inacessível aos seres humanos[b], mas também sumamente detestável aos animais selvagens e às aves por todos os tempos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por lança e fogo”. O grego usa literalmente “lança”; algumas traduções empregam o termo mais geral “espada”.'
    reason: Registra uma alternativa para a construção instrumental e esclarece a escolha lexical específica de δόρατι.
  - marker: b
    text: O termo grego refere-se genericamente aos seres humanos.
    reason: Esclarece o alcance genérico de ἀνθρώποις.
lexical_decisions:
- source_word: πᾶσα ... πόλις ἢ χώρα τὸ σύνολον
  choice: toda cidade ou região, em sua totalidade
  rationale: Preserva tanto o sentido distributivo de πᾶσα quanto a ênfase de τὸ σύνολον na totalidade da cidade ou região.
- source_word: κατὰ ταῦτα μὴ ποιήσῃ
  choice: não agir de acordo com estas ordens
  rationale: No contexto de um decreto real, ποιέω indica cumprir ou executar aquilo que foi ordenado; “estas ordens” explicita o referente contextual de ταῦτα.
- source_word: δόρατι καὶ πυρὶ
  choice: pela lança e pelo fogo
  rationale: Mantém o instrumento expresso pelos dativos e traduz δόρυ em seu sentido específico de “lança”, sem generalizá-lo como “espada”.
- source_word: καταναλωθήσεται μετʼ ὀργῆς
  choice: será consumida ... com ira
  rationale: “Consumida” conserva a imagem forte de destruição de καταναλίσκω, enquanto “com ira” preserva a relação aberta entre a destruição e a ira acompanhante.
- source_word: ἄβατος
  choice: inacessível
  rationale: Expressa de modo natural em português a ideia de um lugar no qual não se pode entrar ou transitar.
- source_word: ἀνθρώποις
  choice: aos seres humanos
  rationale: O plural grego é genérico e abrange a humanidade, não apenas pessoas do sexo masculino.
- source_word: θηρίοις καὶ πετεινοῖς
  choice: aos animais selvagens e às aves
  rationale: Distingue com clareza os animais selvagens das criaturas voadoras, aqui vertidas naturalmente como aves.
- source_word: εἰς τὸν ἅπαντα χρόνον
  choice: por todos os tempos
  rationale: Comunica duração indefinidamente prolongada em registro solene sem apagar a formulação temporal do grego.
- source_word: ἔχθιστος κατασταθήσεται
  choice: será tornada ... sumamente detestável
  rationale: “Sumamente” conserva a força superlativa de ἔχθιστος, e a construção passiva reflete κατασταθήσεται.
theological_decisions:
- issue: Alcance de ἀνθρώποις
  choice: seres humanos
  alternative: homens
  rationale: Embora a forma grega seja morfologicamente masculina, seu referente neste contexto é genérico; “seres humanos” comunica esse alcance sem sugerir exclusão das mulheres.
- issue: Instrumento de destruição em δόρατι
  choice: lança
  alternative: espada
  rationale: O testemunho grego especifica “lança”; a tradução evita substituir essa imagem por uma arma tradicionalmente mais comum em versões bíblicas.
- issue: Relação sintática de μετʼ ὀργῆς
  choice: com ira
  alternative: furiosamente
  rationale: A formulação mantém aberta a possibilidade de a ira acompanhar ou caracterizar a execução do castigo, em vez de a reduzir a um simples advérbio de modo.
translation_notes:
  register: Português moderno, solene e acessível, com sintaxe própria de um decreto punitivo. A tradução conserva a repetição enfática da totalidade, a imagem concreta da lança e do fogo e o superlativo forte da cláusula final.
