  text: and to look ahead to what comes after these things[a], so as to grant the kingdom, undisturbed, to all people in peace[b],
translation:
  language: pt
  text: e a considerar o que virá depois destas coisas[a], a fim de proporcionar a todos o reino livre de perturbações, em paz,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dar atenção ao que vem depois”. O verbo grego pode significar prestar atenção ou considerar; neste contexto, a expressão seguinte lhe dá orientação para o futuro.
    reason: lexical_alternative
  - marker: b
    text: Ou “um domínio” ou “um governo real”. A palavra grega pode referir-se ao reino como território ou, de modo mais abstrato, à realeza ou ao reinado.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέχειν
  choice: considerar
  rationale: O infinitivo indica dar atenção ou ponderar; com a expressão temporal seguinte, “considerar o que virá” transmite naturalmente a atenção voltada às consequências futuras.
- source_word: τὰ μετὰ ταῦτα
  choice: o que virá depois destas coisas
  rationale: A expressão é temporal e aponta para acontecimentos ou consequências posteriores; a formulação preserva essa orientação futura.
- source_word: Βασιλείαν
  choice: um reino
  rationale: Mantém a amplitude do termo grego, que pode designar tanto o domínio político quanto, em sentido mais abstrato, o governo ou reinado.
- source_word: ἀτάραχον
  choice: livre de perturbações
  rationale: Expressa a ausência de agitação, tumulto ou instabilidade política e evita a possível leitura psicológica de “imperturbável”.
- source_word: τοῖς πᾶσιν ἀνθρώποις
  choice: a todos
  rationale: O substantivo grego é genérico e inclusivo; “a todos” comunica o alcance universal sem sugerir apenas pessoas do sexo masculino.
- source_word: μετʼ εἰρήνης
  choice: em paz
  rationale: A expressão portuguesa é natural no contexto e preserva o substantivo “paz”, indicando a condição pacífica em que o reino é proporcionado.
- source_word: παρέξεσθαι
  choice: proporcionar
  rationale: O infinitivo futuro médio expressa fazer com que algo esteja disponível ou seja assegurado; “proporcionar” funciona naturalmente com o reino oferecido em benefício de todos.
