- from: 'Mas considerem: isso pode ser constatado não tanto nas histórias mais antigas que transmitimos, mas sobretudo nos fatos que estão diante de vocês[a], ao examinarem quantos atos ímpios[b] foram levados a cabo pela pestilência[c] dos que exercem o poder indignamente.'
  to: 'Mas considerem: é possível constatar, não tanto pelas histórias mais antigas que transmitimos, mas pelo que está diante de vocês, enquanto o examinam, quantos atos ímpios[a] foram cometidos pela pestilência[b] dos que exercem o poder indignamente.'
  rationale: 'A redação foi ajustada para não restringir o referente idiomático a “fatos”, não intensificar a comparação com “sobretudo” e esclarecer o escopo circunstancial de ἐξητοῦντας. A nota sobre a expressão “aos pés” permanece necessária, mas sua âncora deve acompanhar “o que está diante de vocês”; por isso ela é apresentada como nota c, a ser ancorada nesse segmento no texto final. Para manter a correspondência estrutural entre texto e notas, o texto revisado deve ser lido com a âncora c após “vocês”: “... pelo que está diante de vocês[c], enquanto o examinam ...”; as âncoras a e b são mantidas em “atos ímpios[a]” e “pestilência[b]”, respectivamente.'
  reviewer_model: gpt-5.6-terra
