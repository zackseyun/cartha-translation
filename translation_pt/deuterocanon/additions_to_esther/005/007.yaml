base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/007.yaml
  text: But consider whether it is possible[a], not so much from the earlier histories that we have handed down as from the things lying at your feet, while you investigate[c][b], to discern how many lawless deeds have been accomplished by the pestilence of those who rule unworthily.
translation:
  language: pt
  text: 'Mas considerem: é possível constatar, não tanto pelas histórias mais antigas que transmitimos, mas pelo que está diante de vocês, enquanto o examinam, quantos atos ímpios[a] foram cometidos pela pestilência[b] dos que exercem o poder indignamente.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “perversos”. O termo grego pode destacar tanto a maldade quanto o desrespeito ao que é sagrado.
    reason: lexical_alternative
  - marker: b
    text: “Pestilência” é usada aqui provavelmente como metáfora do caráter destrutivo dos que exercem o poder indignamente.
    reason: cultural_note
lexical_decisions:
- source_word: σκοπεῖτε
  choice: considerem
  rationale: O imperativo plural convoca os destinatários a observar e refletir atentamente, não apenas a olhar.
- source_word: ἐξέστιν
  choice: isso pode ser constatado
  rationale: Neste contexto, o verbo impessoal expressa possibilidade, não permissão. A formulação explicita em português a ação inferida pela construção grega.
- source_word: παλαιοτέρων ... ἱστοριῶν
  choice: histórias mais antigas
  rationale: Preserva o comparativo e o sentido de relatos ou registros históricos.
- source_word: παρεδώκαμεν
  choice: que transmitimos
  rationale: Representa expressamente o verbo grego omitido em versões mais breves e mantém a ideia de tradição entregue aos destinatários.
- source_word: παρὰ πόδας ὑμᾶς
  choice: nos fatos que estão diante de vocês
  rationale: Traduz de modo natural o idioma literalmente relacionado ao que está 'aos pés' dos destinatários, isto é, imediatamente presente e acessível.
- source_word: ἐξητοῦντας
  choice: ao examinarem
  rationale: O particípio indica investigação atenta e é vertido por uma construção circunstancial natural em português.
- source_word: ὅσα
  choice: quantos
  rationale: Conserva a noção quantitativa do pronome, em vez de reduzi-lo ao sentido genérico de 'quais'.
- source_word: ἀνοσίως
  choice: atos ímpios
  rationale: A forma adverbial é reestruturada como qualificativo de 'atos' em português, preservando a condenação moral e religiosa do termo.
- source_word: συντετελεσμένα
  choice: foram levados a cabo
  rationale: Expressa o resultado consumado indicado pelo particípio perfeito passivo sem recorrer a uma formulação excessivamente rígida.
- source_word: λοιμότητι
  choice: pela pestilência
  rationale: Mantém a metáfora vívida de uma força destrutiva semelhante a uma praga.
- source_word: τῶν ἀναξία δυναστευόντων
  choice: dos que exercem o poder indignamente
  rationale: Reflete o valor adverbial de ἀναξία e o sentido de δυναστεύω como exercício de domínio ou poder.
theological_decisions:
- issue: Força moral e religiosa de ἀνοσίως
  choice: atos ímpios
  alternative: atos perversos; atos contrários ao que é sagrado
  rationale: “Ímpios” mantém tanto a dimensão religiosa quanto a grave censura ética, sem restringir o termo a uma infração ritual específica.
- issue: Imagem de λοιμότης aplicada aos governantes
  choice: pestilência
  alternative: corrupção; praga
  rationale: A tradução conserva a metáfora do texto grego e não a reduz antecipadamente a uma interpretação moral abstrata.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura contrastiva foi naturalizada como “não tanto... mas sobretudo”, preservando a comparação retórica. “Vocês” torna explícito o plural dos destinatários; a imagem menos transparente de “aos pés” é explicada em nota.
