base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/004.yaml
  text: And[a], while taking away gratitude not only from men, but also being puffed up by the boasts of those who are exceedingly good[b], they suppose they will escape the judgment of the God who always sees all things and hates evil.
translation:
  language: pt
  text: E, não somente retirando a gratidão do meio das pessoas, mas também ensoberbecidos pelas vanglórias dos que são extraordinariamente bons[a], eles julgam que escaparão à justiça[b] do Deus que sempre observa todas as coisas — justiça que odeia o mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma grega traduzida por «os que são extraordinariamente bons» é textual e lexicalmente difícil; provavelmente se refere a pessoas consideradas excepcionalmente boas ou nobres.
    reason: textual_variant
  - marker: b
    text: Ou «ao julgamento», «à pena» ou «ao castigo». O termo grego δίκη pode ter sentido tanto judicial quanto punitivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστίαν
  choice: gratidão
  rationale: O substantivo expressa gratidão ou reconhecimento; «gratidão» preserva o caráter abstrato do termo e se encaixa naturalmente como objeto de «retirando».
- source_word: ἀνταναιροῦντες
  choice: retirando
  rationale: O particípio indica tirar, eliminar ou privar. «Retirando» conserva a imagem concreta sem intensificá-la para «destruindo».
- source_word: κόμποις
  choice: vanglórias
  rationale: κόμπος pode indicar alarde, jactância ou discurso presunçoso. «Vanglórias» comunica com clareza a ostentação arrogante do contexto.
- source_word: ἐπαρθέντες
  choice: ensoberbecidos
  rationale: O particípio passivo descreve pessoas elevadas pelo orgulho. «Ensoberbecidos» expressa diretamente essa nuance moral em português corrente e digno.
- source_word: ἀπεράγἀθων
  choice: dos que são extraordinariamente bons
  rationale: A forma transmitida é textual e lexicalmente difícil, mas parece designar pessoas apresentadas como excepcionalmente boas ou nobres. A tradução mantém esse sentido provável sem ocultar a incerteza, registrada em nota.
- source_word: κατοπτεύοντος
  choice: que sempre observa todas as coisas
  rationale: O particípio denota observar ou vigiar; a formulação preserva tanto o alcance universal de τὰ πάντα quanto a continuidade indicada por ἀεί.
- source_word: μισοπόνηρον
  choice: justiça que odeia o mal
  rationale: Na forma grega, o adjetivo acusativo feminino concorda naturalmente com δίκην, caracterizando a justiça de modo personificado como oposta ao mal. A repetição de «justiça» em português torna clara essa ligação gramatical.
- source_word: δίκην
  choice: justiça
  rationale: δίκη pode abranger justiça, julgamento, pena ou castigo. «Justiça» preserva a amplitude judicial e punitiva sem restringir prematuramente o sentido.
theological_decisions:
- issue: Relação de μισοπόνηρον com Deus e com δίκην
  choice: «justiça que odeia o mal»
  alternative: «Deus que [...] odeia o mal»
  rationale: Embora seja teologicamente natural atribuir diretamente a Deus o ódio ao mal, μισοπόνηρον está no acusativo feminino singular e concorda com δίκην. A tradução preserva essa construção e sua personificação da justiça divina, sem negar que essa justiça procede de Deus.
- issue: Vigilância divina universal
  choice: «do Deus que sempre observa todas as coisas»
  alternative: «do Deus que tudo vê»
  rationale: A formulação explicita τὰ πάντα e ἀεί, preservando a descrição compacta de Deus como observador contínuo de tudo, sem acrescentar terminologia doutrinária posterior.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Ensoberbecidos» e «vanglórias» mantêm a solenidade retórica sem arcaísmo excessivo. A construção final repete «justiça» para conservar com clareza a concordância do grego e sua personificação incomum.
