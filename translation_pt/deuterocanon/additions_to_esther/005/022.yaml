  terminology: «Dia memorável» representa satisfatoriamente ἐπίσημον ἡμέραν; «celebrem» é um imperativo apropriado para ἄγετε em contexto de observância festiva. A nota lexical evita tratar «designadas» como interpretação exclusiva e registra o aspecto de festivais que recebem ou portam um nome.
