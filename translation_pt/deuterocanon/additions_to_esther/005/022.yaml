lexical_decisions:
- source_word: καὶ ὑμεῖς οὖν
  choice: Portanto, também vocês
  rationale: Preserva o valor conclusivo de οὖν e a inclusão enfática de καὶ ὑμεῖς em português natural.
- source_word: ἐν ταῖς ἐπωνύμοις ὑμῶν ἑορταῖς
  choice: em suas festas assim denominadas
  rationale: Mantém o sentido básico de ἐπώνυμος, isto é, aquilo que recebe ou porta uma denominação, sem decidir se as festas são especificamente instituídas ou comemorativas.
- source_word: ἐπίσημον ἡμέραν
  choice: um dia memorável
  rationale: ἐπίσημος descreve algo marcado, distinto ou notável; “memorável” comunica naturalmente a proeminência celebrativa do dia.
- source_word: μετὰ πάσης εὐωχίας
  choice: com toda espécie de banquete
  rationale: εὐωχία designa banquete, festim ou prazer festivo, frequentemente ligado a comida; a formulação também representa o alcance de πάσης.
- source_word: ἄγετε
  choice: celebrem
  rationale: Neste contexto festivo, o imperativo pede que se observe ou realize o dia; “celebrem” é corrente, claro e digno.
