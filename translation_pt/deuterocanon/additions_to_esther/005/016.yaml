  text: being sons of the Most High[a], greatest, living God[b], who directs the kingdom for us and for our forefathers in the best order.
translation:
  language: pt
  text: sendo filhos[a] do Deus Altíssimo, supremo e vivo, que dirige o reino em favor de nós e de nossos antepassados da melhor maneira.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em sentido coletivo: «sendo filhos e filhas do Deus Altíssimo». O grego diz literalmente «filhos».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «que guia ou ordena o reino em favor de nós e de nossos antepassados na mais excelente disposição».'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὺς
  choice: filhos
  rationale: O grego emprega o plural masculino explícito e ressalta a relação filial; «filhos» preserva essa formulação, enquanto a nota registra a alternativa coletiva «filhos e filhas».
- source_word: τοῦ ὑψίστου μεγίστου ζῶντος θεοῦ
  choice: do Deus Altíssimo, grandíssimo e vivo
  rationale: A tradução conserva a sequência cumulativa de epítetos divinos e o superlativo de μέγιστος, com uma construção elevada, mas compreensível em português.
- source_word: κατευθύνοντος
  choice: que dirige
  rationale: O particípio denota conduzir, orientar ou ordenar. «Dirige» abrange tanto governo quanto orientação providencial sem especificar além do texto.
- source_word: τὴν βασιλείαν
  choice: o reino
  rationale: Neste contexto, βασιλεία pode designar o reino, o domínio ou o exercício da realeza. «O reino» é natural e mantém a amplitude do termo.
- source_word: ἡμῖν τε καὶ τοῖς προγόνοις ἡμῶν
  choice: para nós e para os nossos antepassados
  rationale: «Antepassados» transmite com clareza o sentido histórico-familiar de πρόγονοι sem introduzir marcação masculina desnecessária.
- source_word: ἐν τῇ καλλίστῃ διαθέσει
  choice: na melhor ordem
  rationale: διάθεσις refere-se aqui a disposição, organização ou ordenamento; «na melhor ordem» preserva o superlativo e a noção de administração excelentemente ordenada.
theological_decisions:
- issue: Linguagem corporativa de filiação divina
  choice: sendo filhos do Deus Altíssimo
  alternative: sendo filhos e filhas do Deus Altíssimo
  rationale: Mantém-se no texto principal a linguagem filial masculina explícita do grego, sem transformá-la silenciosamente em formulação neutra ou inclusiva; a alternativa é indicada em nota.
- issue: Extensão temporal da ação divina sobre o reino
  choice: que dirige o reino
  alternative: que dirigiu o reino
  rationale: O particípio presente é vertido como ação geral ou contínua, sem restringir a declaração a um ato passado.
- issue: Sentido de βασιλεία
  choice: o reino
  alternative: a realeza
  rationale: «Reino» permite entender tanto o domínio real quanto o âmbito governado, preservando a amplitude contextual em vez de impor exclusivamente a instituição ou o exercício da realeza.
translation_notes:
  register: Português atual, digno e de leitura amplamente acessível, com leve elevação retórica para reproduzir a acumulação dos títulos divinos. A construção participial «sendo» foi mantida para não acrescentar uma relação causal ausente do grego.
