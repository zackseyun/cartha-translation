  text: Therefore you will do well not to make use of the letters sent out by Haman son of Hammedatha,[a]
translation:
  language: pt
  text: Portanto, vocês farão bem em não fazer uso das cartas enviadas por Hamã, filho de Hamedata.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em não agir com base nas cartas enviadas por Hamã, filho de Hamedata”. O verbo grego pode significar “fazer uso de” ou “valer-se de”; neste contexto, pode implicar não executar o que as cartas determinavam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς οὖν ποιήσετε
  choice: Portanto, vocês farão bem
  rationale: Preserva a relação inferencial de οὖν e traduz naturalmente a construção futura καλῶς ποιήσετε, que também comunica uma exortação moderada.
- source_word: μὴ προσχρησάμενοι
  choice: se não fizerem uso
  rationale: Expressa a circunstância ou condição indicada pelo particípio aoristo com μή, sem restringir o sentido a 'obedecer' ou 'cumprir'.
- source_word: τοῖς ... γράμμασιν
  choice: das cartas
  rationale: No contexto administrativo real, γράμματα designa comunicações escritas; 'cartas' é direto e corrente.
- source_word: ὑπὸ Ἁμὰν Ἁμαδάθου
  choice: por Hamã, filho de Hamedata
  rationale: Torna explícita em português a relação patronímica expressa pelo genitivo Ἁμαδάθου.
- source_word: ἀποσταλεῖσι
  choice: enviadas
  rationale: Reproduz de modo natural o particípio passivo que caracteriza as cartas já despachadas.
