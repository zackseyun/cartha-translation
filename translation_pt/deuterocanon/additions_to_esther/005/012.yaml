  text: But[a], unable to bear his arrogance, he made it his aim to deprive us of both our position and our life.
translation:
  language: pt
  text: 'Mas, incapaz de suportar a arrogância dele, fez disso seu objetivo: privar-nos tanto de nossa posição como de nossa vida.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “privar-nos tanto de nossa autoridade como de nosso espírito/fôlego”. O grego ἀρχή pode significar “governo”, “cargo” ou “autoridade”, e πνεῦμα pode significar “espírito”, “fôlego” ou “vida”.
    reason: Alternativas lexicais genuínas para ἀρχή e πνεῦμα.
lexical_decisions:
- source_word: οὐκ ἐνέγκας
  choice: incapaz de suportar
  rationale: O particípio aoristo de φέρω é usado idiomaticamente no sentido de suportar ou tolerar; a formulação conserva sua força circunstancial e soa natural em português.
- source_word: τὴν ὑπερηφανίαν
  choice: a arrogância dele
  rationale: Ὑπερηφανία indica orgulho altivo ou arrogância. O pronome explicita em português o possuidor entendido pelo contexto, sem alterar a avaliação moral do termo.
- source_word: ἐπετήδευσεν
  choice: fez disso seu objetivo
  rationale: O verbo expressa empenho deliberado, propósito ou busca intencional. Esta formulação comunica a intenção sem afirmar que ela foi bem-sucedida.
- source_word: τῆς ἀρχῆς
  choice: de nossa posição
  rationale: Ἀρχή pode designar governo, cargo, autoridade ou posição dirigente. “Posição” preserva de modo amplo o sentido político e cortesão, enquanto a nota registra alternativas mais específicas.
- source_word: στερῆσαι ἡμᾶς
  choice: privar-nos
  rationale: Στερέω significa tirar algo de alguém ou privá-lo de algo; a colocação pronominal é clara e idiomática em português.
- source_word: καὶ τοῦ πνεύματος
  choice: como de nossa vida
  rationale: Πνεῦμα pode significar espírito, fôlego ou vida. Neste paralelismo entre perda de posição e perda do πνεῦμα, “vida” comunica com naturalidade a ameaça mortal, sem introduzir uma noção teológica abstrata.
theological_decisions:
- issue: Sentido de πνεῦμα em um contexto de ameaça política
  choice: vida
  alternative: espírito ou fôlego
  rationale: A combinação de perda da posição com perda do πνεῦμα aponta naturalmente para a perda da vida ou do fôlego vital. A nota preserva a amplitude lexical do grego e evita resolver a expressão em favor de uma antropologia teológica específica.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente para leitores brasileiros e compreensão internacional. A construção com dois-pontos torna explícito o conteúdo do objetivo sem acrescentar resultado ou êxito à ação.
