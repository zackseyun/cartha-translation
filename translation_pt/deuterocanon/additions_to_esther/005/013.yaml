  text: having sought[a], by devious schemes of deceit, the destruction of Mordecai, our savior and continual benefactor, and Esther, the blameless partner of the kingdom[b], together with all their nation.
translation:
  language: pt
  text: tendo pedido, por meio de ardilosos esquemas de engano[b], a destruição de Mordecai, nosso salvador[a] e constante benfeitor, e de Ester, a irrepreensível partícipe do reino, juntamente com toda a nação deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “libertador”. Aqui, “salvador” (σωτήρ) se refere a Mordecai como alguém que salvou ou preservou, não necessariamente como um título formal.
    reason: lexical_alternative
  - marker: b
    text: A expressão traduzida por “ardilosos esquemas de engano” reúne vários termos gregos pejorativos que comunicam complexidade, maquinação e raciocínio enganoso.
    reason: lexical_alternative
lexical_decisions:
- source_word: σωτῆρα
  choice: salvador
  rationale: É o equivalente direto do substantivo grego e, neste contexto narrativo, descreve Mordecai como alguém que salvou ou preservou; a nota evita que seja entendido necessariamente como título teológico.
- source_word: διὰ παντὸς
  choice: constante
  rationale: Expressa continuidade e combina naturalmente com “benfeitor” em português atual.
- source_word: εὐεργέτην
  choice: benfeitor
  rationale: Preserva tanto a ideia de fazer o bem quanto a nuance pública e cortesã de quem prestou serviço valioso.
- source_word: ἄμεμπτον
  choice: irrepreensível
  rationale: Mantém a força moral e jurídica de alguém contra quem não se pode apresentar censura.
- source_word: κοινωνὸν τῆς Βασιλείας
  choice: participante do reino
  rationale: Conserva a noção de participação ou associação sem reduzir a expressão a mera companhia pessoal nem definir excessivamente se βασιλεία indica reino, realeza ou governo real.
- source_word: σὺν παντὶ τῷ τούτων ἔθνει
  choice: juntamente com toda a nação deles
  rationale: “Nação” preserva o sentido coletivo-político de ἔθνος, e “deles” reflete o demonstrativo plural que retoma Mordecai e Ester.
- source_word: πολυπλόκοις μεθόδων παραλογισμοῖς
  choice: por meio de ardilosos esquemas de engano
  rationale: A formulação portuguesa reúne de modo legível as ideias de complexidade, maquinação e raciocínio fraudulento presentes no denso agrupamento grego.
- source_word: αἰτησάμενος εἰς ἀπώλειαν
  choice: tendo pedido ... que fossem destruídos
  rationale: Preserva o valor participial e a ideia de uma solicitação cujo resultado pretendido era a destruição das pessoas nomeadas.
theological_decisions:
- issue: Uso de “salvador” para Mordecai
  choice: salvador, em seu sentido comum de quem salva ou preserva
  alternative: libertador; preservador
  rationale: σωτήρ não é exclusivamente um termo teológico. Neste contexto, caracteriza o serviço salvador de Mordecai; a nota preserva o sentido lexical sem importar associações cristológicas.
- issue: Referente de “nação deles”
  choice: O plural retoma conjuntamente Mordecai e Ester.
  alternative: a nação dele; a nação dessas pessoas
  rationale: O demonstrativo plural τούτων aponta mais naturalmente para as duas pessoas anteriormente nomeadas e as vincula ao povo ameaçado.
- issue: Sentido de τῆς Βασιλείας
  choice: do reino
  alternative: da realeza; do reinado; do poder real
  rationale: A expressão grega admite nuances de reino, realeza ou governo. “Do reino” mantém a formulação aberta e evita especificar além da evidência textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi ajustada para clareza, sem eliminar o caráter participial do fragmento nem resolver indevidamente a amplitude de βασιλεία.
