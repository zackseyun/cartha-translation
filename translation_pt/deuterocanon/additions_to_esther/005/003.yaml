  text: And they seek not only to mistreat those subject to us[a], but, unable to bear prosperity, they even attempt to scheme against their own benefactors;
translation:
  language: pt
  text: E não só procuram fazer mal aos que estão sujeitos a nós, mas também, incapazes de suportar a prosperidade[a], tentam tramar contra os seus próprios benfeitores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a fartura” ou “a saciedade”; o termo grego pode indicar abundância excessiva ou saturação.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτεταγμένους ἡμῖν
  choice: os que estão sujeitos a nós
  rationale: Expressa com clareza a relação de subordinação indicada pelo particípio de ὑποτάσσω, sem restringi-la indevidamente a uma categoria política específica.
- source_word: ζητοῦσι κακοποιεῖν
  choice: procuram fazer mal
  rationale: Reproduz de modo natural a construção grega e conserva a ideia explícita de praticar o mal contra alguém.
- source_word: κόρον
  choice: prosperidade
  rationale: No contexto, o termo aponta para fartura ou saciedade excessiva que gera arrogância; “prosperidade” comunica bem o sentido moral, enquanto a nota preserva a amplitude lexical.
- source_word: οὐ δυνάμενοι φέρειν
  choice: incapazes de suportar
  rationale: Mantém a imagem de não conseguir aguentar ou tolerar determinada condição e corresponde diretamente à construção participial grega.
- source_word: τοῖς ἑαυτῶν εὐεργέταις
  choice: contra os seus próprios benfeitores
  rationale: “Benfeitores” conserva a força social e moral de εὐεργέταις, e “próprios” representa o reflexivo enfático ἑαυτῶν.
- source_word: ἐπιχειροῦσι μηχανᾶσθαι
  choice: chegam até a tramar contra
  rationale: “Tramar contra” comunica o ato hostil de arquitetar um plano; “chegam até” expressa idiomaticamente a progressão enfática introduzida pela coordenação grega.
