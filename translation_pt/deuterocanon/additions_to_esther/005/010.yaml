base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/010.yaml
  text: For Haman son of Hammedatha[a], a Macedonian, being alien to the true Persian blood and far removed from our goodwill, though he had been received by us as a guest[b],
translation:
  language: pt
  text: Pois Hamã, filho de Hamedata, macedônio[a], era alheio ao verdadeiro sangue dos persas[b] e estava muito distante de nossa benevolência, embora tivesse sido acolhido por nós como hóspede,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego chama Hamã de “macedônio”. Essa designação pertence à redação da adição grega e pode refletir seu contexto histórico ou sua apresentação polêmica.
    reason: cultural_note
  - marker: b
    text: A expressão grega é sintaticamente difícil. Também pode ser entendida como “na verdade, alheio ao sangue dos persas”; em ambos os casos, o sentido geral é que Hamã não pertencia genuinamente à linhagem persa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἁμὰν Ἁμαδάθου
  choice: Hamã, filho de Hamedata
  rationale: O genitivo patronímico é expresso naturalmente em português por “filho de”, preservando a identificação pessoal.
- source_word: Μακεδὼν
  choice: macedônio
  rationale: Mantém no texto principal a designação étnica explícita do testemunho grego.
- source_word: ταῖς ἀληθείας ἀλλότριος τοῦ τῶν Περσῶν αἵματος
  choice: alheio ao verdadeiro sangue dos persas
  rationale: Preserva ἀλλότριος como ausência de pertencimento e mantém tanto a linguagem de “sangue” quanto a possível noção de autenticidade associada à difícil expressão ταῖς ἀληθείας.
- source_word: πολὺ διεστηκὼς
  choice: estava muito distante
  rationale: Expressa o estado duradouro de grande separação indicado pelo particípio perfeito.
- source_word: τῆς ἡμετέρας χρηστότητος
  choice: de nossa benevolência
  rationale: “Benevolência” comunica a bondade ou disposição favorável de caráter régio e político.
- source_word: ἐπιξενωθεὶς ἡμῖν
  choice: embora tivesse sido acolhido por nós como hóspede
  rationale: Traduz a ideia passiva de receber hospitalidade; “embora” explicita a força concessiva exigida pelo contexto da oração.
theological_decisions:
- issue: Designação étnica de Hamã na adição grega
  choice: Manter “macedônio” no texto principal
  alternative: Atenuar para “estrangeiro” ou tratar a designação como glosa posterior
  rationale: Μακεδών consta explicitamente no texto grego fornecido. A tradução deve conservar essa leitura historicamente carregada sem reconstruir uma forma hipotética anterior.
- issue: Expressão grega sintaticamente difícil sobre o sangue persa
  choice: “alheio ao verdadeiro sangue dos persas”
  alternative: “na verdade, alheio ao sangue dos persas” ou “sem pertencer à linhagem persa”
  rationale: A redação transmitida é difícil. A escolha retém a possível relação de ἀληθείας com a autenticidade da ascendência, sem eliminar a metáfora de sangue; a nota registra a alternativa adverbial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A vírgula final foi mantida porque o segmento continua sintaticamente no versículo seguinte. “Verdadeiro sangue dos persas” conserva a metáfora e a dificuldade do grego, enquanto a nota evita apresentar uma única análise sintática como indiscutível.
