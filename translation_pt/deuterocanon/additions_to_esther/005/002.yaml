lexical_decisions:
- source_word: πολλοὶ
  choice: Muitos
  rationale: O adjetivo substantivado introduz uma observação geral; “Muitos” é direto e natural em português.
- source_word: τῇ πλείστῃ ... χρηστότητι
  choice: pela imensa bondade
  rationale: O dativo indica a causa ou o meio pelo qual recebiam honra. “Imensa” expressa naturalmente o superlativo πλείστῃ, e “bondade” preserva o sentido de χρηστότης.
- source_word: τῶν εὐεργετούντων
  choice: de seus benfeitores
  rationale: O particípio substantivado designa aqueles que lhes fazem o bem; “benfeitores” é conciso, idiomático e adequado ao contexto.
- source_word: πυκνότερον
  choice: quanto mais ... mais
  rationale: Embora o advérbio possa ter sentido ligado a frequência ou intensidade, aqui integra uma correlação comparativa; a construção portuguesa comunica com clareza a progressão.
- source_word: τιμώμενοι
  choice: eram honrados
  rationale: Reproduz diretamente o particípio passivo de τιμάω em uma forma natural em português.
- source_word: μεῖζον ἐφρόνησαν
  choice: mais se tornavam arrogantes
  rationale: A expressão literalmente envolve “pensar coisas maiores” e, no contexto, indica presunção crescente. A formulação preserva o comparativo e comunica o valor idiomático.
