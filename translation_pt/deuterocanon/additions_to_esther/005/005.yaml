    issue: “participantes de sangue inocente” é pouco idiomático e semanticamente opaco em português.
    rationale: μετόχους αἱμάτων ἀθώων designa participação ou cumplicidade no derramamento de sangue inocente; a formulação revisada expressa essa relação de modo claro sem acrescentar uma identificação do sujeito feminino.
  - severity: medium
    issue: “a quem, como amigos, se confiara a administração dos assuntos” trata φίλων como predicativo interpretativo.
    rationale: φίλων é formalmente genitivo e pode ser traduzido de forma mais próxima como “os assuntos de amigos”. Isso evita identificar sem necessidade os administradores como amigos do sujeito implícito.
