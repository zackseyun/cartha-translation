base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/005.yaml
  text: And often[a], by madness, she has made many of those appointed to positions of authority, trusted to manage affairs as friends, sharers in innocent blood, and has engulfed them in disasters beyond remedy[b],
translation:
  language: pt
  text: Muitas vezes, ela[a], pela loucura, fez com que muitos dos que tinham sido nomeados para cargos de autoridade e a quem fora confiada a administração dos assuntos de amigos se tornassem cúmplices do derramamento de sangue inocente[b] e os envolveu em calamidades sem remédio,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz um sujeito feminino singular (“ela fez... ela envolveu”), mas o referente imediato não é nomeado explicitamente neste versículo.
    reason: alternative_reading
  - marker: b
    text: Literalmente, “participantes de sangue inocente”. A expressão indica participação no derramamento de sangue inocente.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάκις
  choice: muitas vezes
  rationale: Expressa diretamente a ideia de ocorrência repetida em português corrente.
- source_word: τῶν ἐπʼ ἐξουσίας τεταγμένων
  choice: dos que haviam sido nomeados para cargos de autoridade
  rationale: Preserva tanto a ideia de nomeação ou designação quanto o exercício de autoridade oficial.
- source_word: τῶν πιστευθέντων χειρίζειν φίλων τὰ πράγματα
  choice: a quem, como amigos, se confiara a administração dos assuntos
  rationale: 'Mantém a construção sintaticamente condensada: esses homens eram tidos como amigos e receberam a confiança de administrar os assuntos, sem restringir explicitamente estes a negócios privados ou estatais.'
- source_word: παρανοίᾳ
  choice: pela loucura
  rationale: O substantivo denota loucura ou desvario; a preposição conserva o valor instrumental do dativo.
- source_word: μετόχους αἱμάτων ἀθώων
  choice: participantes de sangue inocente
  rationale: Conserva a imagem forte e semítica de participação em sangue inocente, deixando a nota esclarecer que se trata de cumplicidade no derramamento desse sangue.
- source_word: καταστῆσα
  choice: fez com que ... se tornassem
  rationale: Reproduz de modo natural em português a força causativa do particípio grego.
- source_word: περιέβαλε
  choice: envolveu
  rationale: Mantém a imagem verbal de cercar ou envolver alguém com calamidades.
- source_word: συμφοραῖς ἀνηκέστοις
  choice: em calamidades sem remédio
  rationale: Traduz a impossibilidade de cura ou reparação em linguagem clara, digna e próxima da expressão grega.
theological_decisions:
- issue: Referente do sujeito feminino singular implícito nos verbos
  choice: Empregar o pronome feminino “ela” sem identificar seu referente
  alternative: Identificá-lo como a calúnia, a ira do rei, a fortuna ou outro impulso personificado
  rationale: As formas verbais gregas pressupõem um sujeito feminino singular, mas o referente não é nomeado neste versículo isolado. A tradução conserva a referência gramatical sem impor uma identificação interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem foi levemente ajustada para tornar inteligível a sintaxe grega condensada, sem identificar o sujeito feminino nem eliminar a imagem de “sangue inocente”.
