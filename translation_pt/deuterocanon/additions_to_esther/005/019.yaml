lexical_decisions:
- source_word: ἀντίγραφον
  choice: uma cópia
  rationale: Designa uma cópia ou duplicata de um documento e se ajusta ao contexto administrativo.
- source_word: ἐπιστολῆς
  choice: carta
  rationale: Representa diretamente o sentido usual de ἐπιστολή, mesmo se tratando aqui de uma comunicação oficial.
- source_word: ἐκθέντες
  choice: depois de exporem publicamente
  rationale: O particípio indica colocar o documento à vista ou divulgá-lo; a formulação preserva a relação circunstancial e explicita o caráter público junto com μετὰ παρρησίας.
- source_word: ἐν παντὶ τόπῳ
  choice: em todos os lugares
  rationale: Preserva de modo natural em português a força distributiva da expressão grega.
- source_word: μετὰ παρρησίας
  choice: publicamente
  rationale: No contexto de promulgação, indica divulgação aberta e pública, sem introduzir a ideia psicológica de coragem.
- source_word: ἐᾶν
  choice: devem permitir
  rationale: O infinitivo tem sentido administrativo de permitir; o valor diretivo foi expresso naturalmente em português, em continuidade com o decreto.
- source_word: χρῆσθαι
  choice: sigam
  rationale: Embora signifique literalmente 'usar' ou 'fazer uso de', em relação a leis e costumes 'seguir' é mais idiomático e comunica a prática autorizada.
- source_word: τοῖς ἑαυτῶν νομίμοις
  choice: suas próprias leis
  rationale: νόμιμα pode abranger leis, normas e costumes estabelecidos; 'leis' mantém o registro oficial, e a amplitude lexical é registrada em nota.
