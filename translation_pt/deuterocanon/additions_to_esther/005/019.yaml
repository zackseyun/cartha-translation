  text: And after posting a copy of this letter in every place openly[a], to permit the Jews to make use of their own laws,
translation:
  language: pt
  text: E depois de exporem publicamente uma cópia desta carta em todos os lugares, devem permitir que os judeus sigam suas próprias leis,[a]
  philosophy: optimal-equivalence
  footnotes:
