  yaml_path: translation/deuterocanon/additions_to_esther/005/001.yaml
  text: 'The following is a copy of the letter: Great King Artaxerxes to the rulers of the provinces of the one hundred twenty-seven satrapies from India to Ethiopia[a], and to those who are loyal to our interests: greetings.'
translation:
  language: pt
  text: 'O que segue é uma cópia da carta: O Grande Rei Artaxerxes, aos governantes dos territórios das cento e vinte e sete satrapias, da Índia à Etiópia, e aos que apoiam os nossos interesses[a]: saudações.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “aos que pensam as nossas coisas”, isto é, aos que favorecem ou apoiam a causa do rei.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντίγραφον
  choice: cópia
  rationale: Designa a reprodução escrita de um documento e corresponde naturalmente ao contexto administrativo.
- source_word: ἐπιστολῆς
  choice: carta
  rationale: É o equivalente moderno e claro para uma comunicação real escrita.
- source_word: τὰ ὑπογεγραμμένα
  choice: que segue
  rationale: A expressão introduz o conteúdo escrito logo depois; esta formulação é idiomática em português.
- source_word: Βασιλεὺς μέγας
  choice: Grande Rei
  rationale: Preserva o título régio de caráter imperial persa.
- source_word: σατραπείαις
  choice: satrapias
  rationale: Mantém o termo administrativo persa específico empregado no grego, em vez de reduzi-lo ao termo genérico “províncias”.
- source_word: χωρῶν ἄρχουσι
  choice: governantes dos territórios
  rationale: Expressa de modo claro os oficiais que governavam as unidades territoriais mencionadas.
- source_word: τοῖς τὰ ἡμέτερα φρονοῦσι
  choice: aos que apoiam os nossos interesses
  rationale: Traduz o sentido político do idiomatismo, referente aos que favorecem a causa ou os interesses do rei, sem impor a noção mais forte de lealdade absoluta.
- source_word: χαίρειν
  choice: saudações
  rationale: É a fórmula epistolar convencional e seu equivalente natural em português atual.
- source_word: ἑκατὸν εἴκοσι ἑπτὰ
  choice: cento e vinte e sete
  rationale: Tradução direta do numeral em forma corrente no português.
