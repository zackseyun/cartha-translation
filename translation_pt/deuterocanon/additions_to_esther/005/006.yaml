lexical_decisions:
- source_word: κακοηθείας
  choice: maldade
  rationale: Expressa a disposição moral perversa ou maliciosa; “maldade” é natural e digna em português, sem restringir excessivamente o sentido a rancor pessoal.
- source_word: ψευδεῖ
  choice: falso
  rationale: Qualifica diretamente o raciocínio como enganoso ou não verdadeiro.
- source_word: παραλογισμῷ
  choice: raciocínio
  rationale: Mantém o sentido cognitivo de cálculo ou argumentação falha, enquanto “falso” explicita seu caráter errôneo.
- source_word: παραλογισαμένων
  choice: tendo julgado mal
  rationale: Indica que se chegou a uma conclusão equivocada a respeito do objeto seguinte; a formulação é clara e preserva a relação etimológica conceitual com “raciocínio”.
- source_word: ἐπικρατούντων
  choice: os que detêm o poder
  rationale: Refere-se aos que exercem domínio ou autoridade sem limitar a expressão a um cargo formal específico.
- source_word: ἀκέραιον
  choice: sincera
  rationale: No contexto, comunica uma disposição íntegra, não corrompida ou sem duplicidade, e combina naturalmente com “boa vontade”.
- source_word: εὐγνωμοσύνην
  choice: boa vontade
  rationale: Aqui designa uma disposição benevolente dos governantes, mais provavelmente que gratidão; “boa vontade” preserva bem essa amplitude.
theological_decisions:
- issue: Força sintática de τὴν τῶν ἐπικρατούντων ἀκέραιον εὐγνωμοσύνην
  choice: a sincera boa vontade pertencente aos que detêm o poder
  alternative: a sincera gratidão demonstrada para com os que detêm o poder
  rationale: A leitura mais direta entende τῶν ἐπικρατούντων como genitivo subjetivo de εὐγνωμοσύνην. O sentido de disposição benevolente também se ajusta melhor ao contexto, embora a alternativa lexical e sintática seja possível.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A construção participial foi preservada porque o trecho integra uma frase mais extensa.
