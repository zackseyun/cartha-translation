  text: But we find that the Jews, who have been handed over to destruction by that thrice-accursed man, are not criminals, but are governed by most righteous laws,
translation:
  language: pt
  text: Mas verificamos que os judeus, entregues à destruição por aquele homem três vezes maldito[a], não são criminosos, mas vivem segundo leis sumamente justas[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por aquele três vezes maldito”. O grego emprega um insulto excepcionalmente forte para o homem responsável.'
