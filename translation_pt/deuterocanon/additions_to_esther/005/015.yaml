  - marker: b
    text: 'Ou: “conduzem sua vida cívica segundo leis sumamente justas”. O verbo grego se refere à maneira de viver ou de se portar como membro de uma comunidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Mas verificamos
  rationale: δέ assinala contraste com a acusação anterior, e εὑρίσκομεν expressa uma conclusão após exame; “verificamos” soa natural no registro oficial.
- source_word: τοὺς ... Ἰουδαίους
  choice: os judeus
  rationale: No contexto grego de Ester, o termo designa o povo judeu como grupo étnico-religioso.
- source_word: ὑπὸ τοῦ τρισαλιτηρίου
  choice: por aquele homem três vezes maldito
  rationale: Preserva a força excepcional do insulto intensivo τρισαλιτήριος e explicita de modo natural o referente masculino.
- source_word: παραδεδομένους εἰς ἀφανισμόν
  choice: entregues à destruição
  rationale: Mantém o sentido passivo de serem postos nas mãos de alguém para destruição, sem especificar além do grego.
- source_word: οὐ κακούργους ὄντας
  choice: não são criminosos
  rationale: κακοῦργος tem sentido forense de malfeitor ou criminoso, adequado à revisão imperial das acusações.
- source_word: δικαιοτάτοις ... νόμοις
  choice: leis sumamente justas
  rationale: Reproduz o superlativo e conserva, em português corrente, a dimensão moral e jurídica do adjetivo.
- source_word: πολιτευομένους
  choice: vivem segundo
  rationale: O verbo médio descreve a maneira de conduzir a vida cívica; “vivem segundo” evita a noção excessivamente passiva de serem governados pelas leis.
theological_decisions:
- issue: Sentido ético-jurídico de δικαιοτάτοις
  choice: sumamente justas
  alternative: muitíssimo retas
  rationale: “Justas” preserva diretamente a dimensão jurídica e também admite a avaliação moral, sem introduzir uma distinção doutrinária ausente do texto.
- issue: Relação dos judeus com suas leis em πολιτευομένους
  choice: vivem segundo
  alternative: são governados por
  rationale: A forma média enfatiza sua conduta ou vida cívica conforme as leis, e não apenas uma sujeição passiva ao governo delas.
translation_notes:
  register: Português moderno, digno e acessível, com tom de decreto imperial. A formulação conserva o contraste, a linguagem forense e o superlativo do grego. A vírgula final foi mantida porque o versículo integra uma frase que continua no segmento seguinte.
