  yaml_path: translation/deuterocanon/additions_to_esther/001/014.yaml
  text: And the king examined the two eunuchs[a], and after they confessed[b], they were led away.
translation:
  language: pt
  text: E o rei examinou[a] os dois eunucos[b] e, depois que eles confessaram, foram levados embora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “questionou”; o verbo grego pode indicar uma averiguação formal.
    reason: lexical_alternative
  - marker: b
    text: Ou “oficiais da corte”; contudo, o grego diz especificamente “eunucos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήτασεν
  choice: examinou
  rationale: O verbo indica averiguação ou exame formal. “Examinou” preserva essa amplitude sem impor o tom mais severo de “interrogou”.
- source_word: εὐνούχους
  choice: eunucos
  rationale: O termo grego designa especificamente eunucos. Embora eles pudessem exercer funções na corte, a tradução mantém a designação explícita do texto-fonte.
- source_word: ὁμολογήσαντες
  choice: depois que eles confessaram
  rationale: O particípio exprime admissão ou confissão em resposta ao exame; a oração temporal comunica com naturalidade a sequência da ação.
- source_word: ἀπήχθησαν
  choice: foram levados embora
  rationale: A forma passiva indica que foram retirados sob autoridade, sem especificar destino ou punição não mencionados no grego.
