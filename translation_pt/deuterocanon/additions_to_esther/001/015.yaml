  text: And the king wrote these words as a memorial[b][a], and Mordecai wrote concerning these words.
translation:
  language: pt
  text: E o rei escreveu estas palavras[b] como memorial[a], e Mardoqueu escreveu a respeito destas palavras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para servir de memorial” ou “para lembrança”. A expressão grega pode enfatizar tanto um memorial comemorativo quanto um registro preservado para que algo seja lembrado.
    reason: lexical_alternative
  - marker: b
    text: Ou “estes assuntos” ou “estas coisas”. A palavra grega pode significar “palavras” ou, em sentido mais amplo, “assuntos”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: escreveu
  rationale: O aoristo de γράφω indica diretamente o ato de escrever ou registrar. “Escreveu” é natural em português e preserva a repetição do verbo implícita na estrutura das duas orações.
- source_word: τοὺς λόγους τούτους
  choice: estas palavras
  rationale: λόγοι pode designar “palavras”, “assuntos” ou “acontecimentos”. “Estas palavras” mantém a forma lexical mais direta e evita definir além do necessário aquilo a que o texto se refere.
- source_word: εἰς μνημόσυνον
  choice: como memorial
  rationale: A expressão indica algo destinado a conservar a lembrança, podendo referir-se tanto a um memorial comemorativo quanto a um registro preservado. “Como memorial” conserva essa amplitude em português.
- source_word: Μαρδοχαῖος
  choice: Mardoqueu
  rationale: “Mardoqueu” é a forma tradicional e amplamente reconhecida do nome em português.
- source_word: περὶ τῶν λόγων τούτων
  choice: a respeito destas palavras
  rationale: περί com o genitivo significa “a respeito de” ou “acerca de”. A repetição de “estas palavras” acompanha a repetição grega e preserva a possível referência ao conteúdo anteriormente mencionado.
