base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/001/017.yaml
  text: And Haman son of Hammedatha[a], the Bougaean, was honored before the king, and he was seeking to harm Mordecai and his people because of the king’s two eunuchs.
translation:
  language: pt
  text: E Hamã, filho de Hamedata, o Bugeu[a], era honrado diante do rei e procurava fazer mal a Mardoqueu e a seu povo por causa dos dois eunucos do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “Bugeu”. Uma tradição mais conhecida identifica Hamã como “agagita”, mas este testemunho grego traz “Bugeu”.'
    reason: Leitura alternativa em outra tradição textual.
lexical_decisions:
- source_word: Ἁμὰν Ἁμαδάθου
  choice: Hamã, filho de Hamedata
  rationale: O genitivo Ἁμαδάθου indica naturalmente filiação. Empregam-se as formas portuguesas correntes dos nomes.
- source_word: Βουγαῖος
  choice: o bugueu
  rationale: A designação obscura é transliterada, sem ser harmonizada com outra tradição textual; o artigo definido dá fluidez à aposição em português.
- source_word: ἔνδοξος
  choice: honrado
  rationale: No contexto da corte, descreve a posição prestigiosa de Hamã diante do rei, e não uma glória intrínseca.
- source_word: ἐνώπιον τοῦ βασιλέως
  choice: diante do rei
  rationale: Expressão natural e formal que preserva o cenário cortesão.
- source_word: ἐζήτει κακοποιῆσαι
  choice: procurava fazer mal
  rationale: O imperfeito ἐζήτει expressa intenção continuada, enquanto κακοποιῆσαι comunica de modo amplo a ação maliciosa pretendida.
- source_word: τὸν Μαρδοχαῖον καὶ τὸν λαὸν αὐτοῦ
  choice: Mardoqueu e o povo dele
  rationale: λαός refere-se ao povo associado a Mardoqueu. “Dele” evita possível leitura de que se trate do povo do rei.
- source_word: ὑπὲρ τῶν δύο εὐνούχων τοῦ βασιλέως
  choice: por causa dos dois eunucos do rei
  rationale: No contexto, ὑπέρ indica a causa ou o motivo ligado ao episódio dos dois eunucos; a formulação conserva essa relação sem acrescentar detalhes.
theological_decisions:
- issue: Identificação da designação Βουγαῖος
  choice: Transliterar como “bugueu”
  alternative: “agagita”
  rationale: O testemunho grego fornecido lê Βουγαῖος. A tradução segue essa leitura em vez de harmonizá-la com a identificação mais conhecida de outra tradição textual; a variante é informada em nota.
- issue: Sentido de ὑπὲρ na motivação de Hamã
  choice: “por causa de”
  alternative: “a respeito de” ou “em favor de”
  rationale: A leitura causal é a mais coerente com a hostilidade decorrente do caso dos dois eunucos, sem especificar além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e acessível, com formas bíblicas correntes dos nomes. Preservou-se a estrutura coordenada do grego e a designação textual obscura, esclarecida em nota.
