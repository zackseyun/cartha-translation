lexical_decisions:
- source_word: ἄνθρωπος Ἰουδαῖος
  choice: um homem judeu
  rationale: A expressão identifica um indivíduo do sexo masculino e sua pertença étnico-religiosa; esta formulação é direta e natural em português.
- source_word: οἰκῶν
  choice: que morava
  rationale: O particípio indica residência habitual. «Morava» é corrente e adequado ao contexto narrativo.
- source_word: ἐν Σούσοις τῇ πόλει
  choice: na cidade de Susã
  rationale: A construção grega menciona tanto Susã quanto «a cidade». A ordem portuguesa torna a expressão natural sem omitir nenhum elemento.
- source_word: μέγας
  choice: importante
  rationale: Neste contexto cortesão, μέγας provavelmente indica posição, influência ou destaque, e não tamanho físico.
- source_word: θεραπεύων
  choice: que servia
  rationale: No contexto da corte, o particípio denota serviço ou assistência prestada, sem a conotação especificamente religiosa que outras opções poderiam sugerir.
- source_word: ἐν τῇ αὐλῇ τοῦ βασιλέως
  choice: na corte do rei
  rationale: αὐλή aqui aponta para o âmbito da corte real; «corte» preserva melhor o sentido institucional do que «palácio» ou «pátio».
