base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/001/011.yaml
  text: And when Mordecai awoke[a], after seeing this dream and what God had purposed to do, he kept it in his heart[b], and in every matter he wanted to understand it until nightfall.
translation:
  language: pt
  text: Quando Mardoqueu despertou, depois de ter visto esse sonho e o que Deus tinha decidido fazer, guardou-o no coração[a] e queria compreendê-lo em todos os aspectos[b] até o cair da noite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste ponto, o texto-fonte parece conter um pequeno artefato de transcrição ou impressão (“ἐν Β τῇ καρδίᾳ”); o sentido natural é “no coração”.
    reason: textual_variant
  - marker: b
    text: Ou “em cada assunto” ou “em cada palavra”. A expressão grega é ampla e pode referir-se a tudo o que dizia respeito ao sonho.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεγερθείς
  choice: quando ... despertou
  rationale: O particípio aoristo passivo tem valor temporal no fluxo narrativo. A formulação é natural em português e não explicita um agente que o grego não identifica.
- source_word: ἑωρακώς
  choice: depois de ter visto
  rationale: O particípio perfeito indica uma percepção já ocorrida em relação à ação principal; a locução portuguesa preserva essa relação temporal.
- source_word: τὸ ἐνύπνιον
  choice: esse sonho
  rationale: ἐνύπνιον designa normalmente um sonho. “Visão” acrescentaria uma especificação que o texto não exige.
- source_word: τί ὁ θεὸς βεβούλευται ποιῆσαι
  choice: o que Deus tinha decidido fazer
  rationale: O perfeito médio de βουλεύω expressa uma intenção deliberada e estabelecida. “Tinha decidido” comunica isso com clareza em português corrente.
- source_word: εἶχεν αὐτὸ ... τῇ καρδίᾳ
  choice: guardou-o no coração
  rationale: Preserva a imagem antropológica de καρδία e comunica retenção interior e reflexão, sem reduzi-la apenas a um processo mental.
- source_word: ἐν Β τῇ καρδίᾳ
  choice: no coração
  rationale: O “Β” do texto diplomático parece ser um pequeno artefato tipográfico ou de transcrição. A tradução reproduz o sentido inteligível da expressão grega.
- source_word: ἐν παντὶ λόγῳ
  choice: em todos os aspectos
  rationale: λόγος pode significar “palavra”, “assunto”, “relato” ou, nesta construção, indicar abrangência. “Em todos os aspectos” é natural e mantém a amplitude contextual.
- source_word: ἤθελεν ἐπιγνῶναι αὐτό
  choice: queria compreendê-lo
  rationale: ἐπιγινώσκω sugere alcançar conhecimento ou reconhecimento mais pleno. No contexto de reflexão sobre um sonho, “compreender” exprime bem esse sentido.
- source_word: ἕως τῆς νυκτός
  choice: até o cair da noite
  rationale: A expressão marca duração até a chegada da noite; esta formulação é idiomática e preserva o ponto final temporal.
- source_word: Μαρδοχαῖος
  choice: Mardoqueu
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome grego, adequada à legibilidade internacional com boa recepção brasileira.
theological_decisions:
- issue: Tradução de ὁ θεός
  choice: Deus
  alternative: o Deus
  rationale: “Deus” é a tradução portuguesa padrão do título divino neste contexto; não há razão textual para acrescentar qualificação.
- issue: Imagem antropológica de καρδία
  choice: guardou-o no coração
  alternative: guardou-o na mente
  rationale: A escolha preserva a imagem bíblica do coração como centro da reflexão interior, sem restringir o sentido ao âmbito meramente cognitivo.
- issue: Intenção divina expressa por βεβούλευται
  choice: o que Deus tinha decidido fazer
  alternative: o que Deus tinha planejado fazer
  rationale: “Decidido” conserva o valor de intenção deliberada e estabelecida do perfeito médio, sem desenvolver uma doutrina mais ampla sobre decreto ou providência.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente para leitores brasileiros e compreensão internacional. Conserva-se o idioma bíblico “no coração”, enquanto a expressão ambígua ἐν παντὶ λόγῳ recebe uma tradução contextual acompanhada de nota.
