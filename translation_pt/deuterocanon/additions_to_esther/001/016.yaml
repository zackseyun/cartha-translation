  text: And the king ordered Mordecai to serve in the court[a], and he gave him gifts on account of these things.
translation:
  language: pt
  text: E o rei ordenou que Mardoqueu servisse na corte[a] e lhe deu presentes por causa dessas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «no palácio». A expressão grega diz literalmente «na corte» e pode referir-se ao serviço na corte real ou dentro do recinto do palácio.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέταξεν
  choice: ordenou
  rationale: Expressa uma determinação feita com autoridade e se ajusta naturalmente à ação do rei; evita interpretar a construção como nomeação formal.
- source_word: θεραπεύειν
  choice: servisse
  rationale: No contexto da corte, o infinitivo indica prestar serviço ou assistência; «servisse» é claro, atual e não sugere um ministério religioso.
- source_word: ἐν τῇ αὐλῇ
  choice: na corte
  rationale: Preserva o sentido locativo e a referência ao ambiente da corte real, embora αὐλή também possa designar o pátio ou recinto do palácio.
- source_word: δόματα
  choice: presentes
  rationale: Traduz diretamente dádivas oferecidas pelo rei sem acrescentar a ideia interpretativa de recompensa.
- source_word: περὶ τούτων
  choice: por causa dessas coisas
  rationale: Mantém o valor causal contextual e o plural do demonstrativo grego, remetendo aos acontecimentos anteriores.
