  text: And behold[a], two great dragons came forward, both ready to fight; and a great sound came from them[b],
translation:
  language: pt
  text: E eis que dois grandes dragões avançaram, ambos prontos para lutar[a]; e deles veio um som forte[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para lutar corpo a corpo”; o verbo grego pode designar especificamente luta corpo a corpo.
    reason: lexical_alternative
  - marker: b
    text: Ou “uma voz forte” ou “um grande clamor”; o termo grego pode significar voz, clamor ou som.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: e eis que
  rationale: Preserva a força vívida e visionária da partícula, em registro digno e reconhecível no português atual.
- source_word: δράκοντες μεγάλοι
  choice: grandes dragões
  rationale: Mantém diretamente a imagem simbólica e a possível dimensão portentosa de μεγάλοι, sem reduzi-la a serpentes ou monstros genéricos.
- source_word: προῆλθον
  choice: avançaram
  rationale: Expressa de modo natural o movimento dos dois seres para a confrontação, sem o arcaísmo de 'saíram adiante'.
- source_word: ἕτοιμοι ... ἀμφότεροι
  choice: ambos prontos
  rationale: Reproduz com clareza tanto a prontidão quanto a inclusão explícita dos dois.
- source_word: παλαίειν
  choice: para lutar
  rationale: Comunica naturalmente o confronto hostil no contexto; a possibilidade mais específica de luta corporal é preservada em nota.
- source_word: φωνὴ μεγάλη
  choice: um grande som
  rationale: Mantém a correspondência com μεγάλη e a amplitude semântica de φωνή sem pressupor fala articulada nem especificar que se tratava de um rugido.
- source_word: αὐτῶν
  choice: deles
  rationale: 'Interpreta o genitivo como indicação de origem, de maneira concisa e idiomática: o som veio deles.'
theological_decisions:
- issue: Natureza dos dragões na visão de Mardoqueu
  choice: Traduzir diretamente a imagem como 'dragões', sem identificá-los no texto.
  alternative: Substituir a imagem por figuras históricas, reinos ou outra interpretação alegórica.
  rationale: Neste ponto, a visão apresenta o símbolo, mas ainda não o explica; a tradução deve preservar a imagem e sua tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. 'E eis que' conserva o caráter visionário; a ordem 'deles veio' destaca a origem do som e evita sugerir fala articulada. A vírgula final reflete a continuidade sintática do trecho-fonte.
