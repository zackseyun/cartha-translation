base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/001/001.yaml
  text: In the second year of the reign of Artaxerxes the great king[a], on the first day of Nisan, Mordecai son of Jair, son of Shimei, son of Kish, of the tribe of Benjamin, saw a dream[b],
translation:
  language: pt
  text: No segundo ano do reinado de Artaxerxes, o grande rei, no primeiro dia de Nisã[a], Mardoqueu, filho de Jair, filho de Simei, filho de Quis, da tribo de Benjamim, teve um sonho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, o nome do mês aparece como Nisa; Nisã é a forma portuguesa habitual do nome do mês judaico.
    reason: cultural_note
  - marker: b
    text: 'Literalmente, em grego: “viu um sonho”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτους δευτέρου βασιλεύοντος
  choice: No segundo ano do reinado
  rationale: Reproduz de modo natural a fórmula grega de datação e conserva a referência ao ano de governo.
- source_word: Ἀρταξέρξου τοῦ μεγάλου βασιλέως
  choice: de Artaxerxes, o grande rei
  rationale: Translitera o nome régio na forma portuguesa consagrada e preserva o epíteto persa sem o transformar em nome próprio.
- source_word: τῇ μιᾷ τοῦ Νεισὰ
  choice: no primeiro dia de Nisã
  rationale: Explicita o sentido calendárico de «no um de Nisa» e usa a forma portuguesa habitual do mês judaico.
- source_word: ἐνύπνιον εἶδεν
  choice: teve um sonho
  rationale: A expressão grega diz literalmente «viu um sonho», mas «teve um sonho» comunica o mesmo sentido em português corrente; a formulação literal é preservada em nota.
- source_word: Μαρδοχαῖος ὁ τοῦ Ἰαείρου, τοῦ Σεμεείου τοῦ Κεισαίου
  choice: Mardoqueu, filho de Jair, filho de Simei, filho de Quis
  rationale: Emprega as formas portuguesas bíblicas correntes e torna explícita a sequência de ascendência indicada pelos genitivos gregos.
- source_word: ἐκ φυλῆς Βενιαμείν
  choice: da tribo de Benjamim
  rationale: Expressão genealógica natural em português que corresponde diretamente à procedência tribal indicada pelo grego.
