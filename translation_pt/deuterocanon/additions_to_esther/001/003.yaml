  text: He was from the captivity that Nebuchadnezzar king of Babylon had carried away from Jerusalem with Jeconiah king of Judea.
translation:
  language: pt
  text: Ele pertencia ao grupo dos exilados[a] que Nabucodonosor, rei da Babilônia, havia levado de Jerusalém com Jeconias, rei da Judeia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “era um dos que foram levados ao cativeiro” ou “vinha do cativeiro”. O grego diz literalmente “do cativeiro”.'
    reason: lexical_alternative
  - marker: b
    text: “Judeia” reproduz a forma grega; o referente histórico é a linhagem real de Judá.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκ τῆς αἰχμαλωσίας
  choice: pertencia ao grupo dos exilados
  rationale: A expressão indica que ele procedia da comunidade levada ao cativeiro. Esta formulação comunica naturalmente em português o sentido do substantivo abstrato grego sem sugerir que ele próprio fosse uma entidade chamada “cativeiro”.
- source_word: ᾐχμαλώτευσεν
  choice: havia levado
  rationale: O verbo descreve a ação de levar pessoas como cativas. No contexto, “havia levado” expressa a remoção forçada e se encaixa com naturalidade na oração relativa.
- source_word: Ναβουχοδονόσορ
  choice: Nabucodonosor
  rationale: Forma tradicional e amplamente reconhecida em português para o nome do rei babilônico.
- source_word: μετὰ Ἰεχονίου
  choice: com Jeconias
  rationale: μετά com genitivo indica acompanhamento; “com Jeconias” preserva de modo conciso essa relação.
- source_word: τῆς Ἰουδαίας
  choice: da Judeia
  rationale: Segue diretamente a forma geográfico-política grega Ἰουδαία, preservando a formulação da fonte, embora o referente histórico esteja ligado ao reino de Judá.
theological_decisions:
- issue: Traduzir a linguagem da deportação sem acrescentar conotações teológicas posteriores
  choice: pertencia ao grupo dos exilados ... havia levado
  alternative: era do cativeiro ... havia levado cativo
  rationale: O enunciado é histórico e identificador. A tradução mantém a ideia de exílio forçado, mas evita transformar a condição social do grupo em uma afirmação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com nomes bíblicos correntes no uso brasileiro. A construção “pertencia ao grupo dos exilados” prioriza inteligibilidade sem apagar o caráter coletivo e histórico de αἰχμαλωσία.
