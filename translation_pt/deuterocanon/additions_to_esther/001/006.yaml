base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/001/006.yaml
  text: And at their cry every nation was made ready for war[b][a], so as to fight against the nation of the righteous.
translation:
  language: pt
  text: E, ao clamor deles, toda nação foi preparada para a guerra, a fim de combater a nação dos justos.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «à voz deles» ou «ao som que faziam»; o grego pode referir-se de maneira mais ampla à voz, ao ruído ou ao clamor produzido por eles.
    reason: lexical_alternative
  - marker: b
    text: Ou «a nação justa». A expressão grega pode ser entendida como uma construção genitiva («a nação dos justos») ou como uma descrição mais compacta.
    reason: alternative_reading
lexical_decisions:
- source_word: φωνῇ
  choice: clamor
  rationale: No contexto marcial, transmite uma voz ou um ruído coletivo que incita à guerra, sem especificar indevidamente seu conteúdo.
- source_word: ἡτοιμάσθη
  choice: foram preparadas
  rationale: Preserva a força passiva do aoristo grego e concorda naturalmente com a formulação distributiva portuguesa «todas as nações».
- source_word: πᾶν ἔθνος
  choice: todas as nações
  rationale: Expressa de modo natural em português o sentido distributivo de «cada/toda nação», mantendo o contraste com a nação dos justos.
- source_word: εἰς πόλεμον
  choice: para a guerra
  rationale: Reproduz de forma concisa a ideia de preparação ou movimento orientado para a guerra.
- source_word: ὥστε πολεμῆσαι
  choice: a fim de combater
  rationale: Mantém aberta a nuance entre finalidade e resultado natural própria de ὥστε com infinitivo, sem afirmar que o combate já ocorreu.
- source_word: δικαίων ἔθνος
  choice: a nação dos justos
  rationale: Conserva a construção genitiva e sua ambiguidade, sem substituir a expressão descritiva por uma identificação étnica explícita.
theological_decisions:
- issue: Identificação de δικαίων ἔθνος
  choice: a nação dos justos
  alternative: a nação justa; a nação dos judeus
  rationale: O grego emprega uma descrição, não um nome étnico explícito. A tradução preserva essa formulação e não identifica interpretativamente a nação no texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Clamor» preserva o tom elevado sem soar arcaico; «a fim de combater» mantém a relação lógica sem resolver excessivamente a nuance grega.
