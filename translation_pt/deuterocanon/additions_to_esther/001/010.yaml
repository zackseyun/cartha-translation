  text: Light and the sun rose[b][a], and the lowly were exalted and devoured the glorious.
translation:
  language: pt
  text: A luz e o sol nasceram, e os humildes[a] foram exaltados e devoraram os ilustres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os de condição humilde”. O grego pode indicar tanto uma disposição humilde quanto uma posição social baixa.
    reason: lexical_alternative
  - marker: b
    text: Ou “os honrados” ou “os nobres”. O termo grego se refere aos que possuem honra ou renome.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: a luz
  rationale: Preserva o substantivo isolado e sua força imagética, sem reduzi-lo a uma simples indicação de horário como “a claridade do dia”.
- source_word: ὁ ἥλιος
  choice: o sol
  rationale: Correspondência direta e natural ao sintagma grego.
- source_word: ἀνέτειλεν
  choice: nasceram
  rationale: Em português, “nascer” é o verbo idiomático para o surgimento do sol; o plural acomoda naturalmente os dois sujeitos coordenados, “a luz e o sol”.
- source_word: οἱ ταπεινοὶ
  choice: os humildes
  rationale: Mantém a ambiguidade entre humildade de disposição e condição social rebaixada; a nota registra a alternativa socialmente mais explícita.
- source_word: ὑψώθησαν
  choice: foram exaltados
  rationale: Reproduz de modo conciso a voz passiva e o contraste vertical de rebaixamento e elevação.
- source_word: κατέφαγον
  choice: devoraram
  rationale: Conserva a intensidade concreta e dramática do verbo grego, em vez de suavizá-lo para “venceram” ou “consumiram”.
- source_word: τοὺς ἐνδόξους
  choice: os ilustres
  rationale: Designa pessoas de honra, renome ou posição elevada de forma idiomática em português, sem pressupor especificamente nobreza ou poder político.
theological_decisions:
- issue: Se as imagens devem ser explicadas como uma declaração literal de libertação e vitória
  choice: 'Preservar diretamente a linguagem simbólica: “A luz e o sol nasceram... os humildes foram exaltados e devoraram os ilustres.”'
  alternative: Explicitar o sentido como a libertação dos oprimidos e sua vitória sobre os poderosos.
  rationale: O grego é condensado e imagético. Explicar quem age, como ocorre a vitória ou quais grupos estão em vista resolveria uma tensão que o texto mantém aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção breve e paralela conserva o caráter visionário do original. Os marcadores foram colocados imediatamente após os termos a que se referem.
