  yaml_path: translation/deuterocanon/additions_to_esther/001/007.yaml
  text: And behold[a], a day of darkness and gloom, of affliction and distress, of misery and great turmoil upon the earth.
translation:
  language: pt
  text: E eis um dia de trevas e escuridão, de aflição e angústia, de sofrimento e grande tumulto sobre a terra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sobre o país». O termo grego γῆ pode designar tanto a terra em sentido amplo como uma terra ou um país específico.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: e eis
  rationale: Preserva a irrupção abrupta e visionária da interjeição em registro elevado, sem recorrer ao coloquial «olhem».
- source_word: ἡμέρα
  choice: um dia
  rationale: A formulação indefinida é natural em português e conserva o anúncio ominoso da frase nominal grega.
- source_word: σκότους καὶ γνόφου
  choice: de trevas e escuridão
  rationale: Mantém os dois termos paralelos do grego e a intensificação poética da imagem, sem fundi-los em uma só expressão.
- source_word: θλίψις καὶ στενοχωρία
  choice: de aflição e angústia
  rationale: Reproduz a dupla ideia de sofrimento opressivo e aperto extremo em linguagem atual e digna.
- source_word: κάκωσις
  choice: sofrimento
  rationale: Comunica a condição dolorosa sem introduzir um agente opressor que o contexto imediato não explicita.
- source_word: τάραχος μέγας
  choice: grande tumulto
  rationale: Abrange a perturbação e a desordem expressas pelo substantivo, preservando diretamente a intensidade de μέγας.
- source_word: ἐπὶ τῆς γῆς
  choice: sobre a terra
  rationale: Convém ao tom amplo e visionário da passagem, enquanto a possível referência a um território específico é preservada em nota.
theological_decisions:
- issue: Alcance de γῆ na descrição da calamidade
  choice: sobre a terra
  alternative: sobre o país
  rationale: O catálogo solene de trevas, aflição e tumulto favorece o alcance mais amplo, mas o substantivo grego também pode designar uma terra ou país específico; a nota preserva essa ambiguidade real.
translation_notes:
  register: Português moderno, solene e acessível. A estrutura nominal e exclamativa «E eis um dia...» conserva a força abrupta do grego. As três duplas coordenadas mantêm o ritmo cumulativo do anúncio de calamidade.
