  text: 'And this was his dream: behold[a], voices and tumult, thunder and earthquake, upheaval upon the earth.'
translation:
  language: pt
  text: 'E este foi o seu sonho: eis que havia vozes e tumulto, trovões e terremoto, agitação sobre a terra.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sons e alvoroço [...] perturbação no país». Os termos gregos podem indicar tanto vozes como sons, e γῆ pode significar «terra» ou «país».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνύπνιον
  choice: sonho
  rationale: É o sentido comum do termo e evita ampliar o grego para «visão em sonho».
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva a força vívida e apresentativa da interjeição, em registro bíblico ainda compreensível no português atual.
- source_word: φωναὶ
  choice: vozes
  rationale: É a correspondência mais direta e conserva a possibilidade de sons vocais distintos; «sons» também é possível.
- source_word: θόρυβος
  choice: tumulto
  rationale: Expressa uma perturbação ruidosa e combina com o tom elevado da sequência.
- source_word: βρονταὶ
  choice: trovões
  rationale: O plural reproduz naturalmente o plural grego e sugere sucessivos estrondos.
- source_word: σεισμός
  choice: terremoto
  rationale: É o sentido normal neste contexto de fenômenos ameaçadores; mantém-se sem artigo para acompanhar a enumeração grega.
- source_word: τάραχος
  choice: agitação
  rationale: Conserva a noção ampla de perturbação ou desordem sem decidir se o fenômeno é físico, social ou ambos.
- source_word: ἐπὶ τῆς γῆς
  choice: sobre a terra
  rationale: Mantém o alcance amplo sugerido pela cena, embora γῆ também possa designar uma terra ou região.
theological_decisions:
- issue: Alcance de γῆ na cena onírica
  choice: terra
  alternative: país / região
  rationale: Os trovões e o terremoto favorecem uma perturbação de escala terrestre, mas a nota preserva o possível sentido territorial sem importar uma estrutura apocalíptica posterior.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com boa legibilidade brasileira. «Eis que» conserva a vivacidade narrativa; «agitação» mantém deliberadamente a amplitude semântica de τάραχος.
