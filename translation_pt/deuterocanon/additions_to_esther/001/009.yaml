  yaml_path: translation/deuterocanon/additions_to_esther/001/009.yaml
  text: And they cried out to God[a], and from their cry there came, as it were, a great river from a little spring, abundant water.
translation:
  language: pt
  text: E eles clamaram a Deus; do clamor deles, porém, surgiu, como que de uma pequena nascente, um grande rio, água em abundância.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um grande rio, muita água”.'
    reason: Registra uma tradução mais literal de ὕδωρ πολύ, cuja forma breve e apositiva também pode ser reproduzida por “muita água”.
lexical_decisions:
- source_word: ἐβόησαν
  choice: clamaram
  rationale: O verbo indica um grito forte ou apelo urgente; “clamaram” expressa uma súplica fervorosa dirigida a Deus em linguagem bíblica clara e ainda corrente.
- source_word: πρὸς τὸν θεόν
  choice: a Deus
  rationale: Com o verbo de clamor, πρός assinala o destinatário; “a Deus” é a formulação natural em português.
- source_word: βοῆς
  choice: clamor
  rationale: “Clamor” mantém a relação lexical com “clamaram” e se encaixa naturalmente na construção “do clamor deles”.
- source_word: ἐγένετο
  choice: surgiu
  rationale: Neste contexto, o verbo apresenta o aparecimento do grande rio, não uma transformação; “surgiu” comunica esse sentido com clareza.
- source_word: ὡσανεὶ
  choice: como que
  rationale: A expressão conserva o caráter comparativo ou aproximativo da imagem sem convertê-la numa afirmação rigidamente literal.
- source_word: μικρᾶς πηγῆς
  choice: uma pequena nascente
  rationale: πηγή designa uma fonte ou nascente; “nascente” torna clara a origem fluvial, e “pequena” traduz diretamente μικρᾶς.
- source_word: ποταμὸς μέγας
  choice: um grande rio
  rationale: A tradução direta preserva o contraste enfático entre a pequena nascente e o grande rio.
- source_word: ὕδωρ πολύ
  choice: água em abundância
  rationale: A expressão aposta reforça a copiosidade do rio; “água em abundância” é natural em português e mantém essa ênfase.
theological_decisions:
- issue: Natureza da imagem na segunda oração
  choice: Manter a comparação por meio de “como que”, sem transformar a imagem em descrição histórica inequivocamente literal.
  alternative: Omitir o elemento comparativo e apresentar diretamente o surgimento do rio.
  rationale: O grego contém ὡσανεί, que sinaliza comparação ou aproximação. Preservá-lo mantém a tensão simbólica e evita definir além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Clamaram” e “clamor” preservam a conexão lexical do grego sem soar excessivamente arcaicos; “como que” mantém a qualidade figurativa da visão.
