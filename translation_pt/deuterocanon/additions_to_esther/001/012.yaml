base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/001/012.yaml
  text: And Mordecai remained in the court with Gabatha and Tharra[a], the two eunuchs of the king who were guarding the court[b],
translation:
  language: pt
  text: E Mardoqueu permaneceu[a] no pátio do palácio[b] com Gabata e Tarra, os dois eunucos do rei que guardavam o pátio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ficou quieto”, “permaneceu tranquilo” ou “descansou”. O verbo grego pode expressar permanência em quietude, silêncio ou repouso.
    reason: lexical_alternative
  - marker: b
    text: Ou “na corte”. A palavra grega pode designar o pátio fechado de uma residência real e, por extensão, o ambiente palaciano.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡσύχασεν
  choice: permaneceu
  rationale: Neste contexto, o aoristo de ἡσυχάζω pode indicar que Mardoqueu ficou ou permaneceu ali, em estado de quietude. “Permaneceu” produz uma frase natural sem impor a ideia mais específica de silêncio; a nota preserva as alternativas.
- source_word: αὐλή
  choice: pátio do palácio / pátio
  rationale: αὐλή designa aqui o pátio fechado da residência real. A primeira ocorrência recebe “do palácio” para explicitar o cenário; na repetição, “pátio” basta e evita peso desnecessário.
- source_word: μετά
  choice: com
  rationale: 'A preposição expressa associação direta: Mardoqueu estava com Gabata e Tarra.'
- source_word: εὐνούχων
  choice: eunucos
  rationale: O grego emprega o termo concreto “eunucos”; preservá-lo é mais preciso do que substituí-lo por “oficiais” ou “camareiros”.
- source_word: φυλασσόντων
  choice: guardavam
  rationale: O particípio presente indica a função contínua de vigiar ou proteger o pátio.
- source_word: Μαρδοχαῖος
  choice: Mardoqueu
  rationale: Forma portuguesa consagrada e amplamente reconhecível do nome.
- source_word: Γαβὰθα
  choice: Gabata
  rationale: Transliteração portuguesa direta da forma grega, com adaptação ortográfica natural.
- source_word: Θαῤῥὰ
  choice: Tarra
  rationale: Transliteração portuguesa direta da forma grega, preservando a consoante dupla representada no texto-fonte.
