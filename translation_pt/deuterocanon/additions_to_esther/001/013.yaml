base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/001/013.yaml
  text: He listened to their plans and investigated their intentions[a], and he learned that they were preparing to lay hands on King Artaxerxes. And he informed the king about them.
translation:
  language: pt
  text: Ele escutou os planos deles e investigou suas intenções; então soube que estavam se preparando para pôr as mãos sobre o rei Artaxerxes.[a] E informou o rei a respeito deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “atacar o rei Artaxerxes”. A expressão grega diz literalmente “pôr as mãos” sobre ele e pode indicar, mais especificamente, uma ação hostil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκρόασεν
  choice: escutou
  rationale: Expressa atenção deliberada, e não apenas percepção auditiva.
- source_word: λογισμοὺς
  choice: planos
  rationale: No contexto de intriga palaciana, refere-se a deliberações voltadas para uma ação concreta.
- source_word: μερίμνας
  choice: intenções
  rationale: Neste contexto, designa aquilo que ocupava a mente dos conspiradores; “intenções” comunica naturalmente o sentido contextual, sem introduzir ansiedade emocional.
- source_word: ἐξηραύνησεν
  choice: investigou
  rationale: Traduz a ideia de examinar ou averiguar cuidadosamente.
- source_word: ἑτοιμάζουσιν
  choice: estavam se preparando
  rationale: O aspecto da forma grega indica uma preparação em andamento no contexto narrativo.
- source_word: τὰς χεῖρας ἐπιβαλεῖν
  choice: pôr as mãos em
  rationale: Preserva a expressão corporal do grego e sua ambiguidade entre agarrar e praticar uma ação hostil.
- source_word: ὑπέδειξεν
  choice: informou
  rationale: Indica que ele levou o assunto ao conhecimento do rei, em linguagem portuguesa clara e natural.
