base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/001/008.yaml
  text: And every righteous nation was thrown into turmoil[a], fearing their own calamities[c][b], and they prepared to perish.
translation:
  language: pt
  text: E todas as nações justas[a] ficaram perturbadas[b], temendo os seus próprios males[c], e prepararam-se para perecer[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “retas”. Aqui, “justas” indica retidão moral, não apenas justiça no sentido jurídico.
    reason: lexical_alternative
  - marker: b
    text: Ou “ficaram agitadas”, “ficaram em alvoroço” ou “foram perturbadas”.
    reason: lexical_alternative
  - marker: c
    text: Ou “as próprias calamidades” ou “as desgraças que lhes sobreviriam”.
    reason: lexical_alternative
  - marker: d
    text: Ou “para serem destruídas”. O grego também pode expressar a ideia de perecer ou de sofrer destruição.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιον
  choice: justa
  rationale: “Justa” preserva o sentido moral de δίκαιος e é uma caracterização natural de “nação” em português, sem restringir o termo ao âmbito jurídico.
- source_word: ἐταράχθη
  choice: ficou profundamente perturbada
  rationale: O verbo passivo expressa forte perturbação ou agitação. Esta formulação comunica a intensidade de modo natural, sem limitar o sentido a tumulto público.
- source_word: πᾶν ἔθνος
  choice: toda nação
  rationale: Mantém a construção distributiva no singular do grego e deixa aberta a referência a cada nação ou povo.
- source_word: φοβούμενοι
  choice: temendo
  rationale: Preserva a relação participial, que pode indicar tanto a causa quanto a circunstância concomitante da perturbação.
- source_word: τὰ ἑαυτῶν κακά
  choice: as próprias calamidades
  rationale: No contexto de destruição iminente, κακά designa males sofridos, desgraças ou calamidades, não necessariamente maldade moral.
- source_word: ἡτοιμάσθησαν
  choice: se preparou
  rationale: A forma verbal tem sentido médio ou intransitivo de pôr-se em prontidão. O singular em português mantém a concordância natural com o sujeito coletivo “toda nação”.
- source_word: ἀπολέσθαι
  choice: para perecer
  rationale: “Perecer” conserva a gravidade e a amplitude do infinitivo médio, sem decidir entre morrer e ser destruído.
theological_decisions:
- issue: Sentido de δίκαιον na descrição da nação
  choice: justa, em sentido moral
  alternative: reta; juridicamente justa
  rationale: No grego bíblico, δίκαιος frequentemente descreve retidão moral. “Justa” conserva essa ressonância sem acrescentar uma qualificação confessional.
- issue: Agente ou modo da destruição em ἀπολέσθαι
  choice: perecer
  alternative: ser destruída
  rationale: A forma grega permite conceber o resultado como perecimento ou como destruição sofrida; o texto principal não explicita um agente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A construção coletiva foi regularizada no singular no texto principal; a mudança de número presente no grego é registrada em nota.
