  source_fidelity: A tradução transmite adequadamente a perturbação, o temor dos males próprios e a preparação para perecer. Contudo, “profundamente” acrescenta uma intensidade não expressa especificamente por ἐταράχθη. Além disso, a regularização integral para o singular apaga a passagem deliberada do singular distributivo πᾶν ἔθνος para os plurais φοβούμενοι e ἡτοιμάσθησαν; em português, “todas as nações” preserva naturalmente o alcance distributivo e a sequência plural.
  naturalness: “Toda nação justa ficou profundamente perturbada ... e se preparou” é compreensível e fluente, mas a concordância singular torna menos visível o movimento coletivo do grego. “Todas as nações justas ficaram perturbadas ... e prepararam-se” é moderno, claro e natural em português internacional.
  terminology: “Justas” é uma boa opção para δίκαιον, desde que a nota esclareça a conotação de retidão moral. “Males” é mais diretamente correspondente a κακά do que “calamidades”, sem excluir no contexto o sentido de desgraças. “Perecer” preserva bem a ambiguidade de ἀπολέσθαι.
