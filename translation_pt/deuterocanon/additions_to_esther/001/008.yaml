  - severity: low
    issue: A mudança grega do singular distributivo para o plural é neutralizada
    rationale: O grego começa com “toda nação” e continua com particípio e verbo no plural. A versão singular é gramatical em português, mas elimina esse traço. “Todas as nações” comunica o mesmo alcance sem exigir uma nota gramatical explicativa.
