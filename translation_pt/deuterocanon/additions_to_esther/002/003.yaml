base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/003.yaml
  text: And when I asked my counselors how this might be brought to completion[a], Haman showed us the way—he who excelled among us in prudence, had been proved unchanging in goodwill and in steadfast loyalty, and had received the second rank of honor in the kingdom.
translation:
  language: pt
  text: E, quando perguntei aos meus conselheiros como isso poderia ser levado a cabo, Hamã nos indicou o caminho[a] — ele, que se distinguira entre nós pela prudência, se havia mostrado constante em sua boa vontade e firme em sua lealdade, e recebera a segunda dignidade do reino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Hamã nos mostrou”, “Hamã nos indicou” ou “Hamã nos deu a conhecer”. No grego, o objeto do verbo fica implícito e deve ser entendido a partir da pergunta anterior sobre como levar o assunto a cabo.
    reason: lexical_alternative
lexical_decisions:
- source_word: πυθομένου δέ μου τῶν συμβούλων
  choice: quando perguntei aos meus conselheiros
  rationale: O genitivo absoluto introduz a circunstância da consulta feita pelo rei. “Perguntei aos meus conselheiros” é natural em português e explicita corretamente a relação possessiva implícita no contexto cortesão.
- source_word: πῶς ἂν ἀχθείη τοῦτο ἐπὶ πέρας
  choice: como isso poderia ser levado a cabo
  rationale: Preserva o caráter potencial e passivo de ἀχθείη e traduz a expressão idiomática ἐπὶ πέρας por uma formulação portuguesa corrente que indica conclusão ou realização.
- source_word: σωφροσύνῃ παρʼ ἡμῖν διενέγκας
  choice: que se destacava entre nós pela prudência
  rationale: No contexto político-administrativo, σωφροσύνη indica prudência ou bom senso; διενέγκας descreve alguém que se distingue ou sobressai.
- source_word: ἐν τῇ εὐνοίᾳ ἀπαραλλάκτως
  choice: boa vontade constante
  rationale: εὔνοια significa boa vontade ou benevolência, e ἀπαραλλάκτως acrescenta a ideia de ausência de mudança. “Constante” comunica essa estabilidade com naturalidade.
- source_word: βεβαίᾳ πίστει ἀποδεδειγμένος
  choice: havia demonstrado ... firme lealdade
  rationale: Aqui πίστις designa fidelidade ou confiabilidade no serviço real, não fé religiosa. βεβαίᾳ reforça sua firmeza, enquanto ἀποδεδειγμένος indica uma qualidade já comprovada.
- source_word: δεύτερον τῶν βασιλείων γέρας ἀπενηνεγμένος
  choice: recebera a segunda posição de honra no reino
  rationale: γέρας denota honra, dignidade ou privilégio. A formulação comunica em português moderno a elevada posição de Hamã, secundária apenas à do rei, sem reduzir a expressão a um simples prêmio.
- source_word: Ἁμὰν ἐπεδείξεν ἡμῖν
  choice: Hamã nos indicou o caminho
  rationale: ἐπιδείκνυμι pode significar mostrar, indicar ou dar a conhecer. Como o objeto direto fica implícito no grego e é recuperado da pergunta anterior, “indicou o caminho” torna a elipse inteligível em português; a nota registra alternativas mais formais.
theological_decisions:
- issue: Sentido de πίστις em contexto cortesão não teológico
  choice: lealdade
  alternative: fé; fidelidade; confiabilidade
  rationale: O rei elogia a constância de Hamã no serviço da coroa. “Lealdade” preserva o sentido político e relacional do termo sem introduzir uma referência indevida à fé religiosa.
- issue: Objeto implícito de ἐπεδείξεν
  choice: indicou o caminho
  alternative: nos mostrou; nos indicou; deu-nos a conhecer
  rationale: O grego não declara o objeto, que deve ser inferido da pergunta sobre como realizar o assunto. A tradução torna a elipse compreensível, enquanto a nota preserva a ambiguidade formal.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A estrutura mantém o tom formal de um decreto real, mas evita vocabulário arcaico. O travessão acomoda a longa caracterização de Hamã sem obscurecer a oração principal.
