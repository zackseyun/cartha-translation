base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/002.yaml
  text: The matter was being hurried along even in Susa; but the king and Haman were reclining at table[a], while the city was in turmoil.
translation:
  language: pt
  text: O assunto era levado adiante com urgência também em Susã; o rei e Hamã, porém, estavam reclinados à mesa[a], enquanto a cidade estava em tumulto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “estavam festejando” ou “banqueteavam”. O verbo grego evoca especificamente pessoas reclinadas em divãs durante uma refeição formal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσπεύδετο
  choice: era levado adiante com urgência
  rationale: O imperfeito passivo descreve um processo contínuo que estava sendo acelerado. A formulação preserva tanto a voz passiva quanto a ideia de urgência em português natural.
- source_word: τὸ πρᾶγμα
  choice: o assunto
  rationale: O substantivo é amplo e pode significar assunto, questão ou negócio. “O assunto” mantém essa generalidade sem especificar indevidamente “decreto”, embora o contexto envolva uma ordem real.
- source_word: καὶ εἰς Σουσάν
  choice: também em Susã
  rationale: A expressão estende a ação a Susã. “Também em Susã” comunica isso com naturalidade, sem impor um sentido estritamente espacial a εἰς.
- source_word: ἐκωθωνίζοντο
  choice: estavam reclinados à mesa
  rationale: O verbo evoca a postura de reclinar-se em divãs durante uma refeição ou banquete. A tradução conserva essa imagem cultural específica, enquanto a nota oferece equivalentes mais gerais.
- source_word: ἐταράσσετο
  choice: estava em tumulto
  rationale: O imperfeito indica um estado contínuo de agitação. “Estava em tumulto” expressa de modo idiomático a perturbação coletiva da cidade e ressalta o contraste com o rei e Hamã à mesa.
- source_word: ἡ πόλις
  choice: a cidade
  rationale: Tradução direta de πόλις; no contexto, pode abranger a população ou o corpo cívico de Susã, sentido que “a cidade” transmite adequadamente.
