base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/005.yaml
  text: Therefore[a], having recognized that this nation alone stands in opposition to every man, introducing a foreign way of life in its laws, and being ill-disposed toward our affairs, accomplishing the worst evils, so that the kingdom does not attain stability[b],
translation:
  language: pt
  text: Portanto, tendo reconhecido que só esta nação se mantém continuamente em oposição a toda pessoa[a], alterando suas leis para introduzir um modo de vida estranho e mostrando-se hostil aos nossos interesses, praticando os piores males, de modo que o reino não alcance estabilidade[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente “a todo ser humano” e acrescenta a ideia de continuidade: “o tempo todo” ou “continuamente”.'
    reason: lexical_alternative
  - marker: b
    text: Esta é a caracterização hostil apresentada pela carta régia. A formulação sobre as leis e o modo de vida é condensada e retrata os costumes dessa nação como estranhos ao império.
    reason: cultural_note
lexical_decisions:
- source_word: διειληφότες
  choice: tendo reconhecido
  rationale: O particípio apresenta como fundamento da acusação uma conclusão já formada, sem necessariamente indicar uma decisão jurídica formal.
- source_word: ἔθνος
  choice: nação
  rationale: No contexto político e hostil da carta, o termo identifica um grupo étnico-político; “nação” preserva essa força sem as conotações modernas de “raça”.
- source_word: μονώτατον
  choice: só esta nação
  rationale: O superlativo destaca essa nação como a única ou singularmente isolada entre as demais; a construção portuguesa transmite que ela está sendo especialmente apontada.
- source_word: ἐν ἀντιπαραγωγῇ ... κείμενον
  choice: se mantém ... em oposição
  rationale: A expressão descreve uma postura adversária contínua; “se mantém em oposição” preserva o valor durativo de κείμενον.
- source_word: διὰ παντὸς
  choice: continuamente
  rationale: A locução adverbial explicita a permanência alegada dessa oposição e não deve ser omitida.
- source_word: παντὶ ... ἀνθρώπῳ
  choice: a toda pessoa
  rationale: O singular grego tem sentido genérico. Em português atual, “toda pessoa” preserva a universalidade sem sugerir referência exclusiva ao sexo masculino.
- source_word: διαγωγὴν νόμων ξενίζουσαν παραλλάσσον
  choice: adotando, por meio de suas leis, um modo de vida estranho
  rationale: A construção grega é condensada e retoricamente hostil. A tradução conserva tanto a dimensão legal quanto a cultural sem afirmar de modo indevido que as leis foram alteradas.
- source_word: δυσονοοῦν τοῖς ἡμετέροις πράγμασιν
  choice: hostil aos nossos interesses
  rationale: O particípio expressa disposição adversa, e πράγματα, neste contexto régio, abrange os interesses e assuntos do governo.
- source_word: τὰ χείριστα συντελοῦν κακὰ
  choice: pratica os piores males
  rationale: A formulação mantém a forte acusação moral do grego em português natural e digno.
- source_word: πρὸς τὸ μὴ τὴν βασιλείαν εὐσταθείας τυγχάνειν
  choice: de modo que o reino não alcance estabilidade
  rationale: A formulação portuguesa conserva a relação de consequência ou finalidade alegada sem decidir rigidamente entre essas duas nuances possíveis.
theological_decisions:
- issue: Caracterização régia hostil do povo judeu
  choice: Manter a acusação em sua força retórica, como fala da carta régia
  alternative: Suavizar a linguagem ou inserir no corpo do texto uma ressalva explícita do narrador
  rationale: O trecho registra a perspectiva hostil do autor da carta. Traduzir fielmente essa voz não equivale a endossar suas alegações; a nota esclarece o enquadramento.
- issue: Relação entre finalidade e resultado na cláusula final
  choice: “de modo que”, preservando abertura entre resultado e propósito
  alternative: “a fim de impedir que”, que definiria a cláusula estritamente como intenção
  rationale: A construção πρὸς τὸ μή com infinitivo pode apresentar finalidade, mas o contexto também permite ler a estabilidade frustrada como consequência alegada. A tradução evita resolver silenciosamente essa tensão.
translation_notes:
  register: Português moderno, formal e acessível, com fluidez brasileira e vocabulário amplamente internacional. A frase permanece aberta por vírgula porque o período da carta continua no versículo seguinte. A linguagem acusatória foi preservada como voz do documento, sem ser convertida em afirmação neutra do narrador.
