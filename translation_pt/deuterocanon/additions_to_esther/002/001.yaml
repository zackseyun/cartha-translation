base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/001.yaml
  text: 'And this is the copy of the letter: Great King Artaxerxes writes these things to the rulers and local governors of the one hundred twenty-seven provinces from India to Ethiopia[b][a], who are subject to him.'
translation:
  language: pt
  text: 'Esta é a cópia da carta: “O Grande Rei Artaxerxes escreve o seguinte[b] aos governantes e governadores locais das cento e vinte e sete províncias[a], desde a Índia até a Etiópia, que estão sob sua autoridade.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “regiões” ou “territórios”; o termo grego é mais amplo, mas aqui ocorre em um contexto de administração imperial.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “escreve estas coisas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολῆς
  choice: carta
  rationale: ἐπιστολή designa uma comunicação escrita; “carta” é a forma corrente e adequada ao contexto oficial.
- source_word: ἀντίγραφον
  choice: cópia
  rationale: ἀντίγραφον indica uma cópia ou transcrição de um documento; “cópia” preserva o sentido com clareza.
- source_word: Βασιλεὺς μέγας
  choice: o grande rei
  rationale: Preserva o título régio formal sem o transformar em uma descrição meramente ocasional.
- source_word: Ἀρταξέρξης
  choice: Artaxerxes
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: χωρῶν
  choice: províncias
  rationale: Embora χώρα possa significar região ou território, “províncias” comunica bem as divisões territoriais no contexto da administração imperial.
- source_word: ἄρχουσι
  choice: governantes
  rationale: O termo denota pessoas que exercem autoridade e deve permanecer mais amplo que τοπάρχαις.
- source_word: τοπάρχαις
  choice: administradores locais
  rationale: Expressa de modo acessível a autoridade exercida sobre uma localidade ou distrito, distinguindo-a dos governantes mencionados antes.
- source_word: ὑποτεταγμένοις
  choice: que estão sob sua autoridade
  rationale: Transmite a subordinação indicada pelo particípio e explicita naturalmente, em português, que a autoridade é a do rei.
- source_word: τάδε γράφει
  choice: escreve o seguinte
  rationale: É uma fórmula epistolar natural em português e conserva a função introdutória do grego, literalmente “escreve estas coisas”.
theological_decisions:
- issue: Título régio e linguagem administrativa em uma adição deuterocanônica
  choice: Manter o formato de cabeçalho de uma carta imperial e a terminologia administrativa do texto grego.
  alternative: Parafrasear como uma proclamação real genérica ou harmonizar os títulos com outra versão de Ester.
  rationale: O versículo é administrativo e narrativo. A tradução evita acrescentar harmonizações históricas ou interpretações teológicas ausentes do texto-fonte.
translation_notes:
  register: Português moderno, claro e digno, com tom formal apropriado a uma carta imperial. A ordem foi levemente ajustada para fluência, sem alterar os destinatários nem o alcance territorial do texto grego.
