base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/006.yaml
  text: Therefore we have instructed those writing to you in the documents written by Haman[a], who was appointed over affairs and was our second father, to destroy all of them—together with women and children—root and branch, by the swords of their enemies, without any pity or sparing, on the fourteenth day of Adar, the twelfth month, of this present year[b],
translation:
  language: pt
  text: Portanto, instruímos os que redigem para vocês[a], nos documentos escritos por Hamã — que havia sido encarregado dos negócios e era nosso segundo pai[b] —, a destruir todos eles, junto com as mulheres e as crianças, exterminando-os pela raiz, à espada de seus inimigos, sem nenhuma piedade nem clemência, no décimo quarto dia de Adar, o décimo segundo mês, deste ano,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos que ditam para vocês”. O particípio grego pode se referir a funcionários que redigem documentos ou ditam sua formulação.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “nosso segundo pai”, expressão honorífica da corte para indicar a elevada posição de Hamã.
    reason: cultural_note
lexical_decisions:
- source_word: ὑποστεῖλαιμεν
  choice: demos instruções
  rationale: A forma é difícil, mas, no contexto administrativo da carta régia, comunica a emissão de uma ordem. A tradução mantém esse sentido sem recorrer a uma formulação opaca.
- source_word: τοῖς ὑπαγρευομένοις ὑμῖν
  choice: aos que redigem para vocês
  rationale: ὑπαγορεύω pode indicar ditar ou fornecer a redação de um documento. “Redigem” é natural em português e evita identificar com precisão indevida a função burocrática dessas pessoas; a alternativa literal é preservada em nota.
- source_word: ἐν τοῖς γεγραμμένοις ὑπʼ Ἁμὰν
  choice: nos documentos escritos por Hamã
  rationale: “Documentos” se ajusta ao contexto oficial e preserva a amplitude de γεγραμμένοις, sem restringi-lo necessariamente a cartas.
- source_word: τοῦ τεταγμένου ἐπὶ τῶν πραγμάτων
  choice: havia sido encarregado dos negócios
  rationale: A expressão descreve a nomeação de Hamã para a administração dos assuntos do reino. “Negócios” conserva o tom oficial sem acrescentar “do Estado”, ausente do grego.
- source_word: δευτέρου πατρὸς ἡμῶν
  choice: nosso segundo pai
  rationale: A tradução preserva a metáfora honorífica incomum da corte, em vez de substituí-la interpretativamente por “principal conselheiro”.
- source_word: ἀπολέσαι
  choice: para que destruam
  rationale: O verbo expressa diretamente a ordem de destruição total e não deve ser suavizado por linguagem administrativa eufemística.
- source_word: ὁλορριζεί
  choice: exterminando-os pela raiz
  rationale: A expressão comunica extirpação completa e retém em português a imagem da raiz de modo natural.
- source_word: ταῖς τῶν ἐχθρῶν μαχαίραις
  choice: à espada de seus inimigos
  rationale: O dativo é instrumental. O singular coletivo “à espada” é idiomático em português e mantém a referência às armas dos inimigos das vítimas.
- source_word: ἄνευ παντὸς οἴκτου καὶ φειδοῦς
  choice: sem nenhuma piedade nem clemência
  rationale: A dupla formulação preserva a intensificação e distingue compaixão de disposição para poupar.
- source_word: τῇ τεσσαρεσκαιδεκάτῃ τοῦ δωδεκάτου μηνὸς Ἀδὰρ
  choice: no décimo quarto dia de Adar, o décimo segundo mês
  rationale: A data é apresentada em ordem natural no português, mantendo o nome transliterado do mês e sua identificação no calendário.
- source_word: τοῦ ἐνεστῶτος ἔτους
  choice: deste ano
  rationale: A formulação é clara e atual, preservando a referência ao ano corrente sem rigidez desnecessária.
theological_decisions:
- issue: Linguagem de violência no decreto régio
  choice: Traduzir diretamente a ordem de extermínio, incluindo mulheres e crianças
  alternative: Empregar linguagem administrativa mais branda, como “remover” ou “lidar com”
  rationale: O grego ordena explicitamente destruição integral, reforçada por ὁλορριζεί e pela ausência de piedade ou clemência. Suavizar a linguagem ocultaria a gravidade moral e narrativa do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem das orações foi ajustada para reduzir a ambiguidade sintática em português, sem eliminar a incerteza sobre a função dos redatores. O vocabulário conserva o tom administrativo do decreto e a severidade explícita da ordem.
