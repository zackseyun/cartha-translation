base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/004.yaml
  text: among all the tribes throughout the inhabited world there is mixed in a certain hostile people[a], opposed in its laws to every nation, and continually disregarding the decrees of the kings[c][b], so that the blameless joint-rule directed by us may not be maintained.
translation:
  language: pt
  text: Há, misturado entre todas as tribos do mundo habitado, certo povo hostil, cujas leis[a] se opõem às de todas as nações e que continuamente desconsidera os decretos dos reis[b], a fim de impedir que se mantenha a administração conjunta[c], conduzida por nós de modo irrepreensível.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “costumes”. A palavra grega νόμοι pode designar tanto leis quanto práticas tradicionais.
    reason: lexical_alternative
  - marker: b
    text: A construção grega é sintaticamente condensada; “desconsidera” traduz o provável sentido de deixar de lado ou negligenciar as ordens reais.
    reason: lexical_alternative
  - marker: c
    text: Ou “governo comum” ou “governo compartilhado”. O raro termo grego συναρχία pode indicar governo conjunto ou administração comum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πάσαις ταῖς κατὰ τὴν οἰκουμένην φυλαῖς
  choice: entre todas as tribos espalhadas pelo mundo habitado
  rationale: Preserva o sentido básico de φυλαί como grupos tribais ou étnicos e traduz οἰκουμένη de modo relativamente literal. “Espalhadas” explicita com naturalidade a distribuição indicada pela construção grega.
- source_word: ἀναμεμιγμένον
  choice: está misturado
  rationale: Expressa a presença intercalada desse povo entre outros grupos, preservando a retórica hostil da carta sem reduzir a ideia a mera localização geográfica.
- source_word: δυσμενῆ λαόν τινα
  choice: certo povo hostil
  rationale: Mantém a indefinição de τινα, o substantivo coletivo singular λαόν e a conotação de hostilidade ou má disposição de δυσμενῆ.
- source_word: τοῖς νόμοις ἀντίθετον πρὸς πᾶν ἔθνος
  choice: cujas leis se opõem às de todas as nações
  rationale: 'Torna explícita em português a comparação elíptica: as leis desse povo são apresentadas como contrárias às dos demais povos. “Leis” conserva o sentido jurídico primário de νόμοι, enquanto a nota registra a possível acepção de costumes.'
- source_word: τά τε τῶν βασιλέων παραπέμποντας διηνεκῶς προστάγματα
  choice: e que continuamente desconsidera os decretos dos reis
  rationale: A construção grega é comprimida; “desconsidera” comunica o provável sentido contextual de παραπέμπω como deixar de lado ou negligenciar. Mantém-se o plural “reis” do texto grego.
- source_word: πρὸς τὸ μὴ κατατίθεσθαι
  choice: a fim de impedir que se mantenha
  rationale: A formulação expressa finalidade impeditiva e, no contexto político, entende κατατίθεσθαι como assegurar ou manter em vigor. A nota não é necessária, pois a frase portuguesa continua prudente e inteligível.
- source_word: τὴν ὑφʼ ἡμῶν κατευθυνομένην ἀμέμπτως συναρχίαν
  choice: a administração conjunta, conduzida por nós de modo irrepreensível
  rationale: “Administração conjunta” verte naturalmente o raro συναρχία sem impor uma estrutura política excessivamente específica. A posição de “de modo irrepreensível” deixa claro que ἀμέμπτως modifica o modo como o governo é conduzido.
theological_decisions:
- issue: Retórica política da acusação real
  choice: Manter a caracterização hostil e propagandística do povo acusado
  alternative: Suavizar para uma descrição neutra, como “povo diferente” ou “costumes distintos”
  rationale: A hostilidade pertence à voz da carta real e deve ser preservada como parte do retrato literário, sem ser convertida em afirmação neutra do narrador.
- issue: Valor de συναρχία
  choice: administração conjunta
  alternative: governo comum; governo compartilhado; corregência
  rationale: O termo grego é raro e admite mais de uma nuance política. A tradução escolhida preserva sua amplitude sem introduzir uma doutrina ou uma forma institucional não especificada pelo texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sintaxe foi moderadamente reorganizada para clareza, mantendo o tom oficial, acusatório e propagandístico da carta. Evitou-se “corregência” no texto principal por ser mais técnico e potencialmente restritivo.
