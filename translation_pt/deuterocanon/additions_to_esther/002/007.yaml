base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/007.yaml
  text: so that those who were hostile in the past and are hostile now[a], after going down violently to Hades in a single day, may for all time afterward provide us with stable and undisturbed affairs.
translation:
  language: pt
  text: para que os que eram hostis no passado e ainda o são agora, depois de descerem violentamente ao Hades[a] num único dia, nos proporcionem, daí em diante e para sempre, uma situação estável e sem perturbações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à sepultura” ou “ao mundo dos mortos”. O termo grego designa o domínio dos mortos, não especificamente o lugar do castigo final.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυσμενεῖς
  choice: hostis
  rationale: O adjetivo designa pessoas que nutrem má vontade ou agem como adversárias. “Hostis” preserva esse sentido sem pressupor uma condição formal de inimigos.
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: num único dia
  rationale: A expressão ressalta que a queda ocorrerá de modo súbito e concentrado.
- source_word: βιαίως
  choice: violentamente
  rationale: O advérbio indica uma descida imposta pela força e preserva a severidade da formulação grega.
- source_word: εἰς τὸν ἅδην κατελθόντες
  choice: depois de descerem violentamente ao Hades
  rationale: Mantém a imagem explícita da descida ao domínio dos mortos; o particípio é expresso temporalmente para dar clareza à frase em português.
- source_word: εἰς τὸν μετέπειτα χρόνον ... διὰ τέλους
  choice: daí em diante e para sempre
  rationale: A combinação das duas expressões aponta tanto para o período subsequente quanto para sua continuidade permanente, sem eliminar a ênfase de nenhuma delas.
- source_word: εὐσταθῆ καὶ ἀτάραχα
  choice: estável e sem perturbações
  rationale: Os adjetivos descrevem condições firmes e livres de agitação ou desordem. A formulação é natural em português e mantém os dois aspectos.
- source_word: παρέχωσιν ἡμῖν ... τὰ πράγματα
  choice: nos proporcionem ... uma situação
  rationale: τὰ πράγματα refere-se aqui ao estado geral das coisas ou às condições públicas. “Uma situação” comunica esse uso idiomático com clareza, embora o grego empregue o plural.
theological_decisions:
- issue: Tradução de ᾅδης no contexto grego deuterocanônico
  choice: Hades
  alternative: a sepultura; o mundo dos mortos
  rationale: O texto grego nomeia explicitamente o domínio dos mortos. Manter “Hades” preserva a especificidade da fonte e evita importar a ideia mais restrita de lugar de castigo final.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe mantém o tom formal de uma proclamação real, mas evita construções excessivamente literais. O marcador da nota foi colocado imediatamente após “Hades”, termo ao qual a nota se refere.
