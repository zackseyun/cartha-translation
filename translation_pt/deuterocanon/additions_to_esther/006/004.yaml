  text: But the two dragons are I and Haman[a].
translation:
  language: pt
  text: Mas os dois dragões somos eu e Hamã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas as duas serpentes somos eu e Hamã”. O termo grego δράκοντες pode designar dragões ou serpentes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... δύο δράκοντες
  choice: os dois dragões
  rationale: δράκοντες pode designar dragões ou grandes serpentes. “Dragões” preserva a imagem vívida do sonho e corresponde diretamente ao substantivo plural; a alternativa é registrada em nota.
- source_word: ἐγώ εἰμι καὶ Ἁμάν
  choice: somos eu e Hamã
  rationale: 'Embora o grego empregue literalmente a cópula no singular com o pronome enfático (“eu sou”), em português a concordância no plural é natural porque a identificação abrange duas figuras: “eu e Hamã”.'
- source_word: Ἁμάν
  choice: Hamã
  rationale: Forma tradicional e amplamente reconhecida do nome próprio em português.
- source_word: δέ
  choice: Mas
  rationale: δέ introduz uma transição leve; “Mas” expressa adequadamente a passagem explicativa para a identificação dos símbolos.
theological_decisions:
- issue: Identificação simbólica no sonho de Ester
  choice: Os dois dragões são identificados diretamente como o narrador (“eu”, isto é, Mordecai no contexto) e Hamã.
  alternative: Traduzir δράκοντες como “serpentes”, sem alterar a identificação.
  rationale: O grego apresenta uma equação simbólica direta. A tradução não acrescenta explicação interpretativa ao corpo do versículo, e a alternativa lexical genuína é preservada em nota.
translation_notes:
  register: Português moderno, digno e de leitura natural, com forma nominal brasileira reconhecível. A construção “somos eu e Hamã” evita o artificial “sou eu e Hamã” e mantém explícita a dupla identificação.
