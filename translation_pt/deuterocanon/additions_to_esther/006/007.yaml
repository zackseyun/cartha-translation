  text: For this reason he made two lots[a], one for the people of God and one for all the nations;
translation:
  language: pt
  text: 'Por isso, ele fez duas sortes: uma para o povo de Deus e outra para todas as nações[a];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todos os gentios”. A palavra grega pode indicar as nações em geral, especialmente quando aparecem em contraste com o povo de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural e conciso a relação causal-consecutiva do grego.
- source_word: ἐποίησεν
  choice: fez
  rationale: Reflete o verbo grego genérico sem introduzir a ideia mais específica de lançar sortes.
- source_word: κλήρους δύο
  choice: duas sortes
  rationale: Mantém explicitamente o numeral e emprega o termo tradicional e inteligível para objetos usados na determinação de um resultado.
- source_word: ἕνα τῷ λαῷ τοῦ θεοῦ
  choice: uma para o povo de Deus
  rationale: Preserva a construção e o contraste do grego em português natural; o feminino concorda com 'sorte'.
- source_word: ἕνα πᾶσι τοῖς ἔθνεσιν
  choice: outra para todas as nações
  rationale: O uso de 'outra' é idiomático na correlação portuguesa 'uma... outra', enquanto 'todas as nações' conserva a amplitude lexical de ἔθνη.
theological_decisions:
- issue: Sentido de ἔθνεσιν em contraste com o povo de Deus
  choice: todas as nações
  alternative: todos os gentios
  rationale: '''Nações'' preserva o sentido lexical amplo e a tensão entre o povo de Deus e os demais povos, sem restringir no texto principal a referência ao uso teológico de ''gentios''.'
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A pontuação conserva a continuidade indicada pelo ponto e vírgula do texto-fonte, embora o versículo seja apresentado como unidade autônoma.
