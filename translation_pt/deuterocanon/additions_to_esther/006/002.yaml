  text: For I remembered the dream that I saw concerning these matters[a], for not a word of them has passed by.
translation:
  language: pt
  text: Pois me lembrei do sonho que vi a respeito destes acontecimentos, pois nem uma palavra deles passou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nenhuma palavra deles deixou de se cumprir”; a frase grega também pode significar que nada do que o sonho anunciava deixou de acontecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθην
  choice: me lembrei
  rationale: O aoristo passivo/depoente tem sentido ativo neste contexto; “me lembrei” é natural em português e expressa a recordação do sonho anterior.
- source_word: ἐνυπνίου
  choice: sonho
  rationale: O substantivo designa diretamente um sonho; não é necessário acrescentar “visão”, o que tornaria a tradução mais interpretativa.
- source_word: περὶ τῶν λόγων τούτων
  choice: a respeito destes acontecimentos
  rationale: λόγοι pode denotar palavras, assuntos ou acontecimentos. Neste contexto, remete às coisas prefiguradas pelo sonho; “acontecimentos” torna essa referência clara sem a limitar a palavras faladas.
- source_word: οὐδὲ γὰρ παρῆλθεν ἀπʼ αὐτῶν λόγος
  choice: porque nenhuma palavra dele deixou de se cumprir
  rationale: A expressão grega é concisa e literalmente fala de nenhuma “palavra” ter passado. Em contexto retrospectivo, pode indicar que nenhum elemento do sonho falhou; a formulação portuguesa conserva “palavra” e explicita com moderação o provável valor eventivo.
theological_decisions:
- issue: Sentido de οὐδὲ γὰρ παρῆλθεν ἀπʼ αὐτῶν λόγος
  choice: nenhuma palavra dele deixou de se cumprir
  alternative: nenhuma palavra dele passou
  rationale: A construção pode ser entendida literalmente como algo que não “passou” ou, de modo eventivo, como nada ter falhado em acontecer. O texto principal usa a leitura contextual mais natural, enquanto a nota registra a formulação literal e preserva a ambiguidade.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe natural no Brasil. “Pois” e “a respeito” mantêm um tom narrativo formal sem arcaísmo; a nota preserva a concisão e a ambiguidade do grego.
