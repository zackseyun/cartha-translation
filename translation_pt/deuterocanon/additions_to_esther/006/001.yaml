lexical_decisions:
- source_word: Καὶ
  choice: E
  rationale: Preserva a ligação narrativa simples, sem acrescentar uma nuance temporal.
- source_word: εἶπεν
  choice: disse
  rationale: Equivalente natural do aoristo de λέγω em uma introdução narrativa de fala.
- source_word: Μαρδοχαῖος
  choice: Mardoqueu
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: Παρὰ τοῦ θεοῦ
  choice: de Deus
  rationale: Com o genitivo, παρά indica aqui fonte ou origem; a formulação atribui os acontecimentos a Deus sem definir em detalhe o modo de sua ação.
- source_word: ἐγένετο
  choice: vieram
  rationale: Expressa que os fatos tiveram sua origem em Deus e forma uma construção natural em português com “de Deus”; a nota registra o sentido alternativo de “acontecer”.
- source_word: ταῦτα
  choice: Estas coisas
  rationale: Mantém o demonstrativo neutro plural, que remete aos acontecimentos mencionados no contexto.
theological_decisions:
- issue: Origem ou causalidade divina expressa por παρά com genitivo
  choice: Estas coisas vieram de Deus
  alternative: Estas coisas aconteceram da parte de Deus
  rationale: A tradução conserva a atribuição dos acontecimentos a Deus como sua fonte, sem impor uma explicação mais específica sobre o mecanismo da causalidade divina.
translation_notes:
