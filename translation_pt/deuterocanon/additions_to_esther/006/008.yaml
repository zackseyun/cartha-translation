  text: And these two lots came at the hour and appointed time[a], and at the day of judgment before God and all the nations,
translation:
  language: pt
  text: E essas duas sortes[a] chegaram à hora e ao tempo determinado, ao dia do julgamento diante de Deus e de todas as nações,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “esses dois destinos” ou “esses dois quinhões”. O grego “sortes” preserva a imagem de algo atribuído por sorteio.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δύο κλῆροι
  choice: esses dois destinos
  rationale: κλῆροι designa literalmente sortes ou quinhões atribuídos por sorteio, mas aqui tem força figurada no contexto dos dois desfechos revelados; “destinos” comunica essa função em português natural, enquanto a nota preserva a imagem concreta do grego.
- source_word: ἦλθον
  choice: chegaram
  rationale: O aoristo de ἔρχομαι indica que chegaram ao momento assinalado; “chegaram” é natural em português e não introduz a ideia de as sortes terem sido lançadas.
- source_word: εἰς ὥραν καὶ καιρόν
  choice: à hora e ao tempo determinado
  rationale: A combinação ressalta tanto a hora específica como a ocasião apropriada ou fixada. “Tempo determinado” expressa a nuance contextual de καιρός sem perder a distinção entre os dois termos.
- source_word: εἰς ἡμέραν κρίσεως
  choice: ao dia do julgamento
  rationale: κρίσις tem sentido judicial. A repetição implícita do movimento em direção a um momento culminante é preservada por “ao dia”.
- source_word: ἐνώπιον τοῦ θεοῦ καὶ πᾶσι τοῖς ἔθνεσιν
  choice: diante de Deus e de todas as nações
  rationale: “Diante de” reproduz o caráter solene e judicial de ἐνώπιον. Seu alcance é naturalmente entendido sobre os dois complementos coordenados, sem repetir a preposição.
theological_decisions:
- issue: Sentido de κλῆροι no contexto
  choice: “destinos” no texto, com a imagem literal das “sortes” em nota
  alternative: “essas duas sortes” ou “esses dois quinhões”
  rationale: O contexto personifica ou resume dois desfechos que chegam ao momento do juízo. “Destinos” torna o sentido figurado inteligível em português, e a nota evita ocultar a metáfora concreta e a possível ambiguidade do grego.
- issue: Alcance de ἐνώπιον sobre Deus e todas as nações
  choice: uma só expressão, “diante de Deus e de todas as nações”
  alternative: repetir “diante de” antes de “todas as nações”
  rationale: O grego traz uma única ocorrência de ἐνώπιον, seguida de termos coordenados. A formulação escolhida preserva essa estrutura e permite entender Deus e as nações como testemunhas do julgamento.
translation_notes:
  register: Português moderno, solene e acessível. “Tempo determinado” evita o pouco natural “estação” para καιρός; “julgamento” mantém o cenário judicial. A vírgula final foi preservada porque o segmento continua na unidade literária seguinte.
