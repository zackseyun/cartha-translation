  text: And God remembered his people[a], and vindicated his inheritance.
translation:
  language: pt
  text: E Deus se lembrou do seu povo e fez justiça à sua herança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «justificou» ou «vindicou a sua herança». O verbo grego pode ter sentido jurídico ou vindicatório; aqui se refere à defesa pública do povo de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθη
  choice: se lembrou
  rationale: Preserva o idioma bíblico de lembrar-se, que neste contexto pode incluir a ideia pactual de agir favoravelmente, sem explicitar além do grego.
- source_word: ὁ θεός
  choice: Deus
  rationale: Equivalente português padrão de θεός neste contexto.
- source_word: τοῦ λαοῦ αὐτοῦ
  choice: do seu povo
  rationale: λαός designa naturalmente o povo de Deus; a formulação é corrente e preserva a relação expressa pelo pronome.
- source_word: ἐδικαίωσεν
  choice: fez justiça a
  rationale: A expressão comunica a força jurídica e vindicatória de δικαιόω aplicada coletivamente à herança de Deus, evitando restringir o verbo ao uso doutrinário de 'justificar'.
- source_word: τὴν κληρονομίαν ἑαυτοῦ
  choice: à sua herança
  rationale: Mantém a metáfora bíblica de κληρονομία, pela qual o povo é apresentado como a herança de Deus.
theological_decisions:
- issue: Sentido de ἐδικαίωσεν num contexto coletivo de livramento
  choice: fez justiça à sua herança
  alternative: justificou a sua herança; vindicou a sua herança
  rationale: A escolha preserva a dimensão jurídica e pública da ação divina sem importar indevidamente sentidos paulinos posteriores. A nota registra alternativas legítimas do verbo grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção 'se lembrou do seu povo' conserva o idioma bíblico; 'fez justiça à sua herança' soa natural e retém a ambiguidade jurídica relevante.
