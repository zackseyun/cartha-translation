  text: The little spring that became a river was Esther, whom the king married and made queen; and there was light and sun and abundant water.
translation:
  language: pt
  text: A pequena fonte tornou-se um rio, e havia luz, sol e muita água. Ester é o rio; o rei se casou com ela e a fez rainha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ μικρὰ πηγή
  choice: a pequena fonte
  rationale: πηγή designa uma fonte ou nascente de água. “Fonte” é natural em português e preserva a imagem de uma origem pequena que se transforma em rio.
- source_word: ἡ ἐγένετο ποταμός
  choice: que se tornou um rio
  rationale: Mantém de modo direto a transformação expressa pelo aoristo de γίνομαι e conserva a metáfora.
- source_word: φῶς καὶ ἥλιος καὶ ὕδωρ πολύ
  choice: luz, sol e água em abundância
  rationale: Traduz literalmente os dois primeiros símbolos e expressa com naturalidade a quantidade indicada por πολύ.
- source_word: Ἐσθήρ ἐστιν ὁ ποταμός
  choice: é Ester. Ela é o rio
  rationale: Preserva o presente ἐστιν e a identificação explícita de Ester com o rio. A retomada em duas frases torna inteligível a sintaxe grega sem eliminar sua repetição interpretativa.
- source_word: ἣν ἐγάμησεν ὁ βασιλεύς
  choice: o rei se casou com ela
  rationale: ἐγαμέω significa casar-se; a formulação é corrente e clara em português moderno.
- source_word: ἐποίησεν βασίλισσαν
  choice: a fez rainha
  rationale: O verbo com predicativo acusativo indica que o rei a tornou rainha; a expressão portuguesa é concisa e fiel.
theological_decisions:
- issue: Ordem e força da identificação dos símbolos do sonho
  choice: Apresentar primeiro o conjunto simbólico e depois manter explicitamente a afirmação “Ela é o rio”.
  alternative: “A pequena fonte que se tornou um rio, e havia luz, sol e água em abundância. Ester é o rio, com quem o rei se casou e a quem fez rainha.”
  rationale: A passagem interpreta imagens de um sonho. A tradução conserva a identificação enfática de Ester com o rio e mantém juntos os elementos “luz”, “sol” e “água”, sem lhes impor uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Os travessões integram a descrição parentética dos demais elementos simbólicos e evitam deixar a primeira oração como fragmento. A repetição “é Ester. Ela é o rio” preserva a identificação formal do grego com fluência em português.
