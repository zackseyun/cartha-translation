base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/006/006.yaml
  text: But my people—that is[a], Israel—are those who cried out to God and were saved. And the Lord saved his people, and the Lord rescued us from all these evils, and God did the signs and the great wonders that have not happened among the nations.
translation:
  language: pt
  text: Mas o meu povo — isto é, Israel — são os que clamaram a Deus por ajuda[a] e foram salvos. O Senhor salvou o seu povo, e o Senhor nos livrou de todos estes males; e Deus realizou os sinais e os grandes prodígios que nunca ocorreram entre as nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “buscaram ajuda junto de Deus”. A construção grega é incomum, mas, pelo contexto, o sentido é que Israel recorreu a Deus e foi salvo por ele.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἔθνος τὸ ἐμόν
  choice: o meu povo
  rationale: Embora ἔθνος possa significar “nação”, aqui designa coletivamente o povo do falante, logo identificado como Israel; “meu povo” é natural e não sugere um Estado moderno.
- source_word: οὗτός ἐστιν Ἰσραήλ
  choice: isto é, Israel
  rationale: Expressa de modo natural em português a identificação enfática e apositiva presente no grego.
- source_word: οἱ βοηθήσαντες πρὸς τὸν θεόν
  choice: os que clamaram a Deus por ajuda
  rationale: A construção grega é incomum, mas o contexto de salvação indica um apelo a Deus por socorro, não ajuda prestada a Deus. A formulação mantém explícita tanto a súplica quanto a ideia lexical de ajuda.
- source_word: σωθέντες / ἔσωσεν
  choice: foram salvos / salvou
  rationale: Preserva a conexão lexical e temática entre as duas formas de σῴζω.
- source_word: ἐρρύσατο
  choice: livrou
  rationale: Distingue este verbo de σῴζω e comunica libertação de perigos ou males.
- source_word: τῶν κακῶν τούτων
  choice: todos estes males
  rationale: Mantém a amplitude de κακά, que pode abranger males, desgraças e aflições.
- source_word: σημεῖα καὶ τὰ τέρατα τὰ μεγάλα
  choice: os sinais e os grandes prodígios
  rationale: Emprega a combinação bíblica corrente em português e preserva a intensidade de μεγάλα.
- source_word: ἃ οὐ γέγονεν ἐν τοῖς ἔθνεσιν
  choice: que nunca ocorreram entre as nações
  rationale: “Nunca ocorreram” expressa idiomaticamente a negação do perfeito grego, enquanto “entre as nações” conserva o contraste com Israel.
- source_word: κύριος
  choice: Senhor
  rationale: Traduz diretamente κύριος no texto grego, sem substituir a forma pelo tratamento tipográfico reservado ao nome divino hebraico.
theological_decisions:
- issue: Sentido de βοηθήσαντες πρὸς τὸν θεόν
  choice: Israel clamou a Deus por ajuda.
  alternative: Israel buscou ajuda junto de Deus.
  rationale: A sintaxe grega é difícil e permite mais de uma formulação em português, mas o contexto deixa claro que Israel recorreu a Deus e foi salvo. A tradução evita o sentido enganoso de que Israel teria ajudado Deus, sem ocultar a dificuldade lexical, registrada em nota.
- issue: Relação entre σωθέντες, ἔσωσεν e ἐρρύσατο
  choice: “foram salvos / salvou” para σῴζω e “livrou” para ῥύομαι.
  alternative: “foram libertos / libertou” e “resgatou”.
  rationale: A escolha conserva a repetição intencional de σῴζω e, ao mesmo tempo, diferencia o verbo que enfatiza a retirada do perigo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A pontuação evita uma sequência pesada de coordenações sem apagar a repetição solene de “o Senhor”. “Prodígios” mantém o registro bíblico sem ser obscuro.
