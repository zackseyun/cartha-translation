base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/006/011.yaml
  text: In the fourth year of the reign of Ptolemy and Cleopatra[a], Dositheus, who said that he was a priest and a Levite, and Ptolemy his son, brought in the following letter of the Purim festival, which they said also existed and had been translated by Lysimachus son of Ptolemy[b], one of those in Jerusalem.
translation:
  language: pt
  text: No quarto ano do reinado de Ptolomeu e Cleópatra, Dositeu, que dizia ser sacerdote e levita, e seu filho Ptolomeu trouxeram a carta que segue, acerca da festa de Purim[a]. Dositeu e seu filho disseram que ela existia e que havia sido traduzida por Lisímaco, filho de Ptolomeu[b], um dos que estavam em Jerusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, «dos Φρουραίων», designação grega usada aqui para a festa judaica de Purim.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «a qual, segundo disseram, estava disponível e havia sido traduzida por Lisímaco, filho de Ptolomeu». A formulação grega é concisa e pode ressaltar a existência ou disponibilidade do documento, não sua autenticidade.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔτους τετάρτου Βασιλεύοντος Πτολεμαίου καὶ Κλεοπάτρας
  choice: No quarto ano do reinado de Ptolomeu e Cleópatra
  rationale: Reproduz de modo natural em português a fórmula cronológica grega e mantém os dois nomes ligados ao reinado.
- source_word: εἰσήνεγκεν
  choice: trouxeram
  rationale: O verbo significa introduzir ou trazer um documento. Embora esteja no singular no grego, o sujeito composto inclui Dositeu e seu filho; o plural é a concordância natural em português.
- source_word: ὃς ἔφη εἶναι ἱερεὺς καὶ Λευείτης
  choice: que dizia ser sacerdote e levita
  rationale: Mantém o relato neutro de sua identificação, sem acrescentar a suspeita que 'alegava' poderia sugerir, e conserva a coordenação dos dois termos.
- source_word: τὴν προκειμένην ἐπιστολὴν
  choice: a presente carta
  rationale: προκειμένην aponta para o documento posto diante do leitor; 'presente carta' é claro e apropriado ao caráter de colofão.
- source_word: τῶν Φρουραίων
  choice: acerca da festa de Purim
  rationale: Identifica para o leitor moderno a festa judaica designada pela forma grega Φρουραῖα, preservada em nota.
- source_word: ἣν ἔφασαν εἶναι
  choice: Eles disseram que ela existia
  rationale: A construção é concisa e ambígua. 'Existia' preserva a afirmação mínima sobre a existência ou disponibilidade do documento sem transformá-la numa declaração de autenticidade.
- source_word: καὶ ἑρμηνευκέναι
  choice: e que havia sido traduzida
  rationale: Em contexto documental, ἑρμηνεύω indica com maior probabilidade a tradução do texto.
- source_word: Λυσίμαχον Πτολεμαίου
  choice: Lisímaco, filho de Ptolomeu
  rationale: O genitivo é entendido naturalmente como filiação.
- source_word: τῶν ἐν Ἰερουσαλήμ
  choice: um dos que estavam em Jerusalém
  rationale: Conserva a construção partitiva do grego em português corrente.
theological_decisions:
- issue: Neutralidade de ὃς ἔφη εἶναι
  choice: que dizia ser
  alternative: que alegava ser
  rationale: A formulação principal não insinua falsidade ou dúvida onde o verbo grego pode ser apenas uma forma neutra de relatar a autodescrição.
- issue: Identificação de τῶν Φρουραίων
  choice: acerca da festa de Purim
  alternative: da festa dos Frureus
  rationale: A tradução comunica o referente histórico da designação grega sem impor interpretação doutrinária; a forma lexical grega é registrada em nota.
- issue: Sentido de ἣν ἔφασαν εἶναι
  choice: Eles disseram que ela existia
  alternative: Eles disseram que ela era autêntica
  rationale: O grego não explicita autenticidade. A versão mantém a tensão documental e evita acrescentar uma afirmação teológica ou histórica mais forte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com nomes em formas tradicionais portuguesas. A oração longa do grego foi dividida para melhorar a legibilidade, sem eliminar a ambiguidade documental. Todos os marcadores de nota aparecem no texto principal.
