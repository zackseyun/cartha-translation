base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/006/010.yaml
  text: And these days shall be for them in the month of Adar[a], on the fourteenth and on the fifteenth of the same month, with assembly and joy and gladness before God[b], throughout the generations forever among his people Israel.
translation:
  language: pt
  text: E estes dias serão para eles, no mês de Adar, o décimo quarto e o décimo quinto dia do mesmo mês, com assembleia[a], alegria e júbilo diante de Deus[b], por todas as gerações, para sempre, entre o seu povo Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com reunião” ou “com convocação”. O termo grego refere-se aqui a uma reunião da comunidade, não especificamente a um edifício de sinagoga.
    reason: lexical_alternative
  - marker: b
    text: Ou “na presença de Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται αὐτοῖς αἱ ἡμέραι αὗται
  choice: estes dias serão celebrados por eles
  rationale: O grego diz literalmente que esses dias “serão para eles”; em português, “serão celebrados por eles” explicita de modo natural o valor festivo e observacional indicado pelo contexto, sem alterar os participantes.
- source_word: ἐν μηνὶ Ἀδάρ
  choice: no mês de adar
  rationale: Mantém por transliteração o nome do mês judaico e emprega a forma corrente em português.
- source_word: τῇ τεσσαρεσκαιδεκάτῃ καὶ τῇ πεντεκαιδεκάτῃ τοῦ αὐτοῦ μηνός
  choice: no décimo quarto e no décimo quinto dia do mesmo mês
  rationale: Explicita “dia”, subentendido nos ordinais gregos, para produzir uma indicação de data inequívoca e natural em português.
- source_word: μετὰ συναγωγῆς
  choice: com reunião
  rationale: Aqui συναγωγή designa o ato ou evento de a comunidade reunir-se, não especificamente um edifício religioso.
- source_word: χαρᾶς καὶ εὐφροσύνης
  choice: alegria e júbilo
  rationale: Preserva os dois substantivos coordenados e distingue a alegria geral da manifestação festiva e exultante expressa por εὐφροσύνη.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: diante de Deus
  rationale: Tradução direta e idiomática que conserva a orientação explícita da celebração para Deus.
- source_word: εἰς γενεὰς εἰς τὸν αἰῶνα
  choice: por todas as gerações, para sempre
  rationale: 'Conserva os dois elementos durativos e sua força cumulativa: continuidade geracional e permanência.'
- source_word: ἐν τῷ λαῷ αὐτοῦ Ἰσραήλ
  choice: entre o seu povo Israel
  rationale: “Entre” expressa naturalmente a localização da observância no âmbito do povo, mantendo a identificação pactual “seu povo Israel”.
theological_decisions:
- issue: Referência explícita a Deus no contexto da celebração
  choice: diante de Deus
  alternative: na presença de Deus
  rationale: θεοῦ está expresso no texto grego; a tradução o mantém para não reduzir a observância a uma comemoração apenas cívica. As duas formulações portuguesas são semanticamente possíveis.
- issue: Duração da observância em εἰς γενεὰς εἰς τὸν αἰῶνα
  choice: por todas as gerações, para sempre
  alternative: de geração em geração, para sempre
  rationale: A formulação escolhida preserva tanto a continuidade através das gerações quanto a força durativa de εἰς τὸν αἰῶνα, sem limitar teologicamente o alcance da expressão.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez brasileira e compreensão internacional. A frase mantém o tom solene de instituição comemorativa. Os marcadores [a] e [b] aparecem no texto principal e correspondem exatamente às notas.
