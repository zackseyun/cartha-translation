  text: but the nations had assembled to destroy the name of the Jews[a][b].
translation:
  language: pt
  text: mas as nações tinham se reunido[a] para destruir o nome[b] dos judeus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tinham sido reunidas”. O particípio grego tem forma passiva.
    reason: lexical_alternative
  - marker: b
    text: “Destruir o nome” é uma expressão idiomática bíblica que pode significar apagar a memória de um povo ou pôr fim à sua existência.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: nações
  rationale: No contexto de Ester, refere-se aos povos não judeus. “Nações” é natural, claro e menos carregado teologicamente do que “gentios”.
- source_word: ἐπισυναχθέντα
  choice: tinham se reunido
  rationale: Expressa com naturalidade em português a reunião coletiva anterior, embora o particípio grego tenha forma passiva; a alternativa passiva é registrada em nota.
- source_word: ἀπολέσαι
  choice: para destruir
  rationale: O infinitivo indica finalidade. “Destruir” preserva a amplitude do grego sem intensificar indevidamente a violência descrita.
- source_word: τὸ ὄνομα
  choice: o nome
  rationale: Mantém literalmente a imagem do grego e preserva o valor idiomático bíblico, explicado em nota.
- source_word: Ἰουδαίων
  choice: dos judeus
  rationale: Em Ester, o termo designa convencionalmente o povo judeu; esta é a forma padrão e mais clara em português.
theological_decisions:
- issue: Força idiomática de “destruir o nome dos judeus”
  choice: Manter no texto principal o idioma literal “destruir o nome dos judeus”.
  alternative: apagar a memória dos judeus; eliminar por completo os judeus
  rationale: A expressão provavelmente implica erradicar a memória ou a existência continuada de um povo, mas conservar a formulação literal preserva a imagem da fonte e evita resolver em excesso o idioma.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A construção “tinham se reunido” é idiomática; a voz passiva formal do grego é preservada em nota. A imagem literal “destruir o nome” foi mantida para conservar a ambiguidade e a força do texto-fonte.
