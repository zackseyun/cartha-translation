  text: And lifting up the golden scepter[a], he placed it on her neck, and kissed her and said, “Speak to me.”
translation:
  language: pt
  text: 'E, erguendo o cetro de ouro, ele o colocou sobre o pescoço dela, beijou-a[a] e disse: “Fale comigo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “saudou-a”; o verbo grego pode indicar uma saudação, mas, neste contexto, provavelmente se refere a um beijo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρας
  choice: erguendo
  rationale: O particípio aoristo de αἴρω apresenta a ação que antecede os verbos principais; “erguendo” preserva o gesto concreto com naturalidade.
- source_word: χρυσῆν ῥάβδον
  choice: o cetro de ouro
  rationale: Embora ῥάβδος possa designar vara ou bastão, no contexto da corte real refere-se adequadamente a um cetro.
- source_word: ἐπέθηκεν
  choice: colocou
  rationale: Expressa de modo direto e idiomático a ação de pôr o cetro sobre o pescoço dela.
- source_word: ἐπὶ τὸν τράχηλον αὐτῆς
  choice: sobre o pescoço dela
  rationale: Tradução direta da expressão grega, mantendo clara a referência a Ester.
- source_word: ἠσπάσατο
  choice: beijou-a
  rationale: ἀσπάζομαι frequentemente significa saudar, mas os gestos físicos desta cena favorecem o sentido concreto de beijar; a alternativa legítima é preservada em nota.
- source_word: Λάλησόν μοι
  choice: Fale comigo
  rationale: Forma natural e digna em português para o imperativo com μοι, comunicando o convite direto do rei para que Ester fale.
