translation:
  language: pt
  text: corando no auge de sua beleza[a], e seu rosto estava alegre, como se fosse afável[b], mas seu coração estava apertado de medo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ruborizada no pleno viço de sua beleza”. O grego combina um particípio que significa “ficar vermelha” ou “corar” com uma expressão que indica a beleza em seu auge.
    reason: lexical_alternative
  - marker: b
    text: Ou “como se fosse amável” ou “como se fosse querida”. A expressão grega pode descrever um rosto agradável e acolhedor, mas conserva uma comparação pouco comum.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρυθριῶσα
  choice: corando
  rationale: O particípio presente descreve o rosto ou a aparência tornando-se ruborizada; “corando” preserva a imagem visível e o aspecto contínuo.
- source_word: ἀκμῇ κάλλους αὐτῆς
  choice: no auge de sua beleza
  rationale: ἀκμή indica o ponto culminante, o pleno vigor ou o apogeu; com κάλλος, a expressão se refere à beleza em seu auge.
- source_word: ἱλαρόν
  choice: alegre
  rationale: O termo pode indicar alegria, vivacidade ou luminosidade na expressão do rosto. “Alegre” é direto e preserva o tom emocional.
- source_word: ὡς προσφιλές
  choice: como se fosse afável
  rationale: προσφιλής pode significar querido, agradável ou amável, e ὡς introduz aparência ou comparação. “Como se fosse afável” mantém a formulação comparativa e sugere uma expressão acolhedora sem afirmar que ela própria era amada.
- source_word: ἀπεστενωμένη
  choice: apertado
  rationale: O particípio comunica a ideia de estar comprimido ou estreitado. Aplicado ao coração, “apertado” conserva a metáfora física e é idiomático em português para angústia.
- source_word: ἀπὸ τοῦ φόβου
  choice: de medo
  rationale: ἀπό pode indicar origem ou causa; “de medo” exprime de modo natural e conciso que o temor causava o aperto interior.
