  text: And he said to her[a], “What is it, Esther? I am your brother[b]; take courage.”
translation:
  language: pt
  text: 'E ele lhe disse: “O que há, Ester?[a] Eu sou seu irmão[b]. Tenha coragem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que está acontecendo, Ester?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Eu sou seu parente”, se o termo for entendido em sentido mais amplo que o de irmão literal.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ἐστιν
  choice: O que há
  rationale: Expressão interrogativa natural em português que conserva a brevidade e a franqueza do grego; pode também indicar ‘o que está acontecendo?’ sem explicitar além do texto.
- source_word: ἀδελφός
  choice: irmão
  rationale: É o sentido direto do termo grego. Embora neste contexto possa designar um parente ou expressar proximidade e solidariedade, a tradução principal preserva a forma familiar concreta.
- source_word: θάρσει
  choice: Tenha coragem
  rationale: Imperativo corrente e digno em português, que transmite a exortação a recobrar a confiança sem recorrer a linguagem arcaica.
- source_word: ἐγὼ ὁ ἀδελφός σου
  choice: Eu sou seu irmão
  rationale: A oração completa reproduz a ênfase do pronome explícito ἐγώ e mantém o caráter tranquilizador da declaração.
theological_decisions:
- issue: Designação familiar de quem fala com Ester
  choice: Manter ‘irmão’ no texto principal
  alternative: Traduzir de modo mais amplo por ‘parente’
  rationale: O grego emprega diretamente ἀδελφός, ‘irmão’. Como o alcance exato da relação pode ser entendido de modo mais amplo no contexto narrativo, essa possibilidade é indicada em nota, sem resolver a ambiguidade dentro da tradução.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. ‘O que há?’ evita o possível valor retrospectivo de ‘O que foi?’; ‘Tenha coragem’ conserva a força direta do imperativo.
