base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/004/006.yaml
  text: And after she had gone in through all the doors[a], she stood before the king; and he was sitting on the throne of his kingdom[b], and was clothed in all the splendor of his majesty.
translation:
  language: pt
  text: Depois de entrar por todas as portas[a], ela se pôs diante do rei. Ele estava sentado no trono do seu reino, vestido com toda a indumentária de seu esplendor.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «por todos os portais», caso a expressão se refira às sucessivas entradas do palácio.
    reason: lexical_alternative
  - marker: b
    text: O texto grego fornecido termina abruptamente em ἐνεδεΒ, aparentemente uma forma truncada de um verbo com o sentido de «estar vestido» ou «ter-se vestido». A tradução apresenta o sentido mais provável da frase preservada.
    reason: textual_variant
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: Depois de entrar
  rationale: O particípio aoristo tem valor temporal e indica a ação anterior ao ato de ela se colocar diante do rei.
- source_word: πάσας τὰς θύρας
  choice: por todas as portas
  rationale: Mantém o sentido comum de θύρα e comunica naturalmente a passagem por uma sequência de entradas; no contexto palaciano, «portais» também é possível.
- source_word: κατέστη ἐνώπιον τοῦ βασιλέως
  choice: ela se pôs diante do rei
  rationale: Expressa a ideia de chegar e tomar posição diante do rei, de modo natural e compatível com o cenário da corte.
- source_word: θρόνου τῆς βασιλείας αὐτοῦ
  choice: trono do seu reino
  rationale: Preserva a construção genitiva grega e evita reduzir a expressão à forma adjetival «trono real».
- source_word: πᾶσαν στολὴν τῆς ἐπιφανείας αὐτοῦ
  choice: vestido com todo o esplendor de sua majestade
  rationale: στολή se refere à indumentária, enquanto ἐπιφάνεια descreve aqui magnificência visível. A formulação portuguesa comunica a pompa da veste régia sem atribuir ao termo um sentido teológico técnico.
- source_word: ἐνεδεΒ
  choice: vestido
  rationale: A forma transmitida no excerto termina abruptamente, mas parece ser o início truncado de uma forma verbal ligada a ἐνδύω/ἐνδύομαι, cujo sentido contextual é vestir-se ou estar vestido.
