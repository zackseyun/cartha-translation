  register: Português atual, digno e de leitura ampla, com construção narrativa fluente. Conservou-se «trono do seu reino» para refletir a forma do grego, enquanto «esplendor de sua majestade» transmite a magnificência régia em linguagem natural. Os marcadores foram posicionados junto aos pontos a que suas notas efetivamente se referem.
