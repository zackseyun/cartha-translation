lexical_decisions:
- source_word: ἑτέρα
  choice: outra
  rationale: O feminino singular indica outra acompanhante; o contexto torna desnecessário acrescentar «mulher».
- source_word: ἐπηκολούθει
  choice: vinha atrás
  rationale: O imperfeito expressa uma ação contínua de acompanhar por trás; esta formulação é natural em português e preserva o sentido espacial do verbo.
- source_word: κουφίζουσα
  choice: aliviando o peso
  rationale: O particípio de κουφίζω comunica a ideia de tornar mais leve ou aliviar uma carga. A expressão explicita de modo natural a imagem aplicada às vestes, sem determinar exatamente como a acompanhante fazia isso.
- source_word: τὴν ἔνδυσιν αὐτῆς
  choice: de suas vestes
  rationale: ἔνδυσις designa a roupa ou indumentária, podendo ter sentido coletivo; «vestes» combina clareza, dignidade narrativa e naturalidade.
- source_word: καὶ αὐτὴ
  choice: e ela
  rationale: A expressão inicia uma oração que continua no segmento seguinte. A tradução mantém a construção incompleta, sem acrescentar conteúdo ausente deste trecho.
