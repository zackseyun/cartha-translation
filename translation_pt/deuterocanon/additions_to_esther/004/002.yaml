lexical_decisions:
- source_word: γενηθεῖσα ἐπιφανής
  choice: quando apareceu
  rationale: A expressão participial indica que Ester passou a estar visível, apresentando-se publicamente. “Quando apareceu” comunica isso de modo natural sem acrescentar ideias de esplendor ou fama.
- source_word: ἐπικαλεσαμένη
  choice: depois de invocar
  rationale: O particípio médio descreve o apelo dirigido a Deus, provavelmente em oração. “Depois de invocar” torna clara a sequência anterior ao verbo principal.
- source_word: τὸν πάντων ἐπόπτην θεὸν
  choice: a Deus, aquele que vela por todos
  rationale: ἐπόπτης designa quem observa, supervisiona ou vela. A formulação escolhida evita o tom burocrático de “supervisor” e preserva a ideia de cuidado e vigilância universais.
- source_word: σωτῆρα
  choice: é Salvador
  rationale: σωτήρ pode significar “salvador” ou “libertador”. “Salvador” mantém o título religioso elevado e, com “é”, integra-o claramente à descrição do mesmo Deus.
- source_word: παρέλαβεν
  choice: levou consigo
  rationale: No contexto de Ester sair acompanhada, o verbo tem o sentido de tomar alguém consigo, não meramente receber ou pegar.
- source_word: τὰς δύο ἅβρας
  choice: as duas criadas
  rationale: ἅβρα refere-se aqui a jovens servas ou assistentes pessoais. “Criadas” é conciso e compreensível, enquanto a nota esclarece a função contextual.
theological_decisions:
- issue: Relação entre ἐπόπτην, θεὸν e σωτῆρα
  choice: a Deus, aquele que vela por todos e é Salvador
  alternative: a Deus, o Guardião de todos e Salvador
  rationale: A redação atribui ao mesmo Deus tanto a vigilância universal quanto a condição de Salvador. Ela preserva os dois predicados sem sugerir duas figuras distintas nem transformar “Salvador” apenas em uma ação verbal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção evita termos burocráticos para o título divino e usa “levou consigo” para expressar naturalmente o acompanhamento das duas servas.
