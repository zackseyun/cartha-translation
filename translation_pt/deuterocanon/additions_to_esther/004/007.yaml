    reason: lexical_alternative
lexical_decisions:
- source_word: ὅλος διὰ χρυσοῦ καὶ λίθων πολυτελῶν
  choice: inteiramente coberto de ouro e pedras preciosas
  rationale: Torna inteligível em português a expressão grega elíptica sem especificar uma veste que o trecho preservado não menciona; «preciosas» comunica o elevado valor de πολυτελῶν.
- source_word: φοβερὸς σφόδρα
  choice: sua aparência era aterradora
  rationale: Preserva a forte reação de temor expressa por φοβερός e, ao explicitar «aparência», liga naturalmente a descrição visual anterior ao efeito causado pelo rei.
- source_word: ἄρας τὸ πρόσωπον αὐτοῦ
  choice: Erguendo o rosto
  rationale: Mantém o movimento corporal vívido do particípio aoristo sem o reduzir simplesmente a «olhou para cima».
- source_word: πεπυρωμένον δόξῃ
  choice: que resplandecia de majestade
  rationale: Expressa tanto a imagem ardente de πεπυρωμένον quanto a glória régia de δόξῃ, evitando sugerir combustão literal.
- source_word: ἐν ἀκμῇ θυμοῦ
  choice: no auge da ira
  rationale: ἀκμή indica o ponto máximo de intensidade; a formulação portuguesa é natural e preserva a força de θυμός.
- source_word: ἔβλεψεν
  choice: ele lançou-lhe o olhar
  rationale: O verbo isolado ganha em português uma formulação idiomática compatível com o olhar hostil descrito pelo contexto, sem acrescentar fala ou ação não presente.
- source_word: μετέβαλε τὸ χρῶμα αὐτῆς ἐν ἐκλύσει
  choice: sua cor mudou quando desfaleceu
  rationale: Comunica claramente a mudança visível da fisionomia associada à perda de forças, preservando a relação entre os dois elementos gregos.
- source_word: κατέκυψεν
  choice: ela se curvou
  rationale: Descreve o movimento físico descendente sem necessariamente apresentá-lo como gesto deliberado de reverência.
- source_word: ἅβρας
  choice: criada delicada
  rationale: ἁβρά sugere delicadeza, suavidade ou refinamento; «delicada» preserva essa caracterização da acompanhante.
- source_word: τῆς προπορευομένης
  choice: que ia à sua frente
  rationale: Traduz de modo natural o particípio que identifica a criada que precedia a rainha na marcha.
theological_decisions:
- issue: Abertura fragmentária ou elíptica do segmento grego transmitido
  choice: Sinalizar a incompletude com reticências e traduzir apenas as palavras preservadas.
  alternative: Suprir no texto principal algo como «ele estava vestido» ou «trajava uma veste».
  rationale: O trecho fornecido começa no meio da descrição. Não reconstruir silenciosamente o material ausente preserva com transparência a incerteza textual e evita introduzir um tipo de vestimenta não nomeado no segmento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi levemente ajustada para fluidez narrativa, sem eliminar a intensidade visual do grego nem reconstruir a abertura ausente.
