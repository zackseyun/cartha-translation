  text: For you are wonderful[a], Lord, and your face is full of grace.
translation:
  language: pt
  text: Pois tu és maravilhoso, Senhor, e o teu rosto está cheio de graça.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o teu rosto está cheio de graças”; também pode expressar que a tua presença está cheia de favor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θαυμαστὸς
  choice: maravilhoso
  rationale: O adjetivo descreve alguém que causa admiração ou assombro. “Maravilhoso” é natural em português atual e conserva o tom reverente.
- source_word: κύριε
  choice: Senhor
  rationale: No contexto de oração e de tratamento direto a Deus, “Senhor” é a correspondência portuguesa natural e tradicional para κύριε.
- source_word: πρόσωπόν
  choice: rosto
  rationale: “Rosto” preserva o sentido direto e a imagem antropomórfica do grego, sem convertê-la interpretativamente em “presença”.
- source_word: χαρίτων
  choice: graça
  rationale: Embora o plural grego possa indicar graças, favores ou qualidades graciosas, o singular coletivo “graça” produz uma formulação portuguesa natural e mantém a ressonância devocional.
- source_word: μεστόν
  choice: está cheio de
  rationale: A expressão traduz de modo idiomático o adjetivo que significa “cheio” ou “repleto”, explicitando em português a cópula subentendida na construção grega.
theological_decisions:
- issue: Linguagem antropomórfica aplicada a Deus em “teu rosto”
  choice: Conservar a expressão literal “teu rosto”
  alternative: tua presença
  rationale: O grego emprega πρόσωπον de maneira direta. A tradução mantém a imagem e sua tensão teológica, em vez de substituí-la por uma abstração interpretativa.
- issue: Sentido de χάρις na descrição de Deus
  choice: Traduzir pelo singular coletivo “graça”
  alternative: favores; graciosidade
  rationale: O plural χαρίτων admite mais de uma nuance. “Graça” é natural neste contexto, conserva a força religiosa do termo e evita restringir o sentido a favores concedidos ou a uma qualidade meramente estética.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e a imagem do grego foram preservadas sem rigidez; “Pois” representa ὅτι como introdução explicativa dentro da oração.
