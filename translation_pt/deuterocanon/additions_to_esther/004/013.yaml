  yaml_path: translation/deuterocanon/additions_to_esther/004/013.yaml
  text: And he said to him[a], “I saw you, lord, like an angel of God, and my heart was troubled with fear because of your glory.”
translation:
  language: pt
  text: 'E lhe disse: “Eu o vi, senhor, como um anjo de Deus[a], e meu coração se perturbou por medo da tua glória.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Aqui, “como” expressa comparação: ele lhe pareceu semelhante a um anjo de Deus, sem ser identificado como tal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ
  choice: E lhe disse
  rationale: Mantém o sujeito não expresso do grego, sem introduzir desnecessariamente um pronome de gênero, e traduz αὐτῷ com naturalidade.
- source_word: Εἶδόν σε
  choice: Eu o vi
  rationale: O aoristo narrativo é vertido pelo pretérito perfeito simples; “o” representa o objeto singular masculino em registro digno e corrente.
- source_word: κύριε
  choice: meu senhor
  rationale: Trata-se de uma forma respeitosa de dirigir-se ao rei, uma figura humana; a inicial minúscula evita identificá-lo com Deus.
- source_word: ὡς ἄγγελον θεοῦ
  choice: como um anjo de Deus
  rationale: “Como” preserva a comparação de ὡς, e a expressão sem artigo é naturalmente indefinida. “Anjo” comunica melhor o esplendor celestial evocado do que “mensageiro”.
- source_word: ἐταράχθη ἡ καρδία μου
  choice: meu coração ficou perturbado
  rationale: Conserva a imagem antropológica do coração como centro das emoções e expressa a agitação interior indicada pelo passivo de ταράσσω.
- source_word: ἀπὸ φόβου τῆς δόξης σου
  choice: de temor por causa da sua glória
  rationale: Explicita de modo natural que o temor, suscitado pela glória do rei, foi a origem da perturbação, sem reduzir δόξα apenas a aparência exterior.
theological_decisions:
- issue: Referente de κύριε
  choice: “meu senhor”, com inicial minúscula, referido ao rei
  alternative: “Senhor”, com inicial maiúscula, sugerindo referência divina
  rationale: O contexto imediato descreve Ester diante do rei. A forma honorífica deve ser preservada sem atribuir ao rei uma identidade divina.
- issue: Natureza da comparação com o anjo de Deus
  choice: 'comparação: “como um anjo de Deus”'
  alternative: 'identificação: “na qualidade de anjo de Deus”'
  rationale: Neste contexto, ὡς apresenta a figura humana como semelhante a um anjo em glória e aspecto temível, não como sendo literalmente um anjo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção sem sujeito expresso em “E lhe disse” respeita a forma grega; “meu senhor” soa natural como tratamento dirigido a um rei.
