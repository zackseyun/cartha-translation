  text: And the king was troubled[a], and all his attendants were comforting her.
translation:
  language: pt
  text: E o rei estava perturbado, e toda a sua comitiva a consolava.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a encorajava”. O verbo grego pode indicar consolar, encorajar, exortar ou instar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράσσετο
  choice: estava perturbado
  rationale: O imperfeito de ταράσσω expressa um estado contínuo de perturbação interior; “estava perturbado” preserva o aspecto verbal sem intensificá-lo como pânico.
- source_word: πᾶσα ἡ θεραπεία αὐτοῦ
  choice: toda a sua comitiva
  rationale: Neste contexto de corte, θεραπεία designa coletivamente as pessoas que serviam e acompanhavam o rei. “Toda a sua comitiva” é natural e mantém o caráter coletivo da expressão grega.
- source_word: παρεκάλει αὐτήν
  choice: a consolava
  rationale: παρακαλέω pode significar consolar, encorajar, exortar ou instar. No contexto imediato da aflição de Ester, “a consolava” é uma leitura natural, sem ocultar em nota a possibilidade de encorajamento.
