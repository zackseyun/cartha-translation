  yaml_path: translation/deuterocanon/additions_to_esther/004/001.yaml
  text: And it happened on the third day[a], when she had stopped praying, that she took off the garments of her service and put on her splendor[b];
translation:
  language: pt
  text: E aconteceu que, no terceiro dia, quando ela terminou de orar, tirou as vestes de seu serviço[a] e revestiu-se de seu esplendor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «as vestes de sua devoção» ou «de sua assistência». O termo grego pode indicar serviço, assistência ou prática devocional.
    reason: lexical_alternative
  - marker: b
    text: Ou «sua glória». Aqui, a expressão provavelmente se refere às suas vestes régias esplêndidas ou à sua magnificência.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενήθη
  choice: aconteceu
  rationale: Fórmula narrativa grega vertida de modo natural e digno, sem o arcaísmo de «sucedeu» ou «veio a acontecer».
- source_word: ἐν τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: no terceiro dia
  rationale: Forma temporal corrente em português e correspondência direta da expressão grega.
- source_word: ὡς ἐπαύσατο προσευχομένη
  choice: quando ela terminou de orar
  rationale: Expressa que a oração chegou ao fim antes das ações seguintes, sem sugerir necessariamente uma interrupção abrupta.
- source_word: ἐξεδύσατο τὰ ἱμάτια
  choice: tirou as vestes
  rationale: Tradução clara do ato de remover a roupa; «vestes» mantém o registro elevado da cena.
- source_word: τῆς θεραπείας
  choice: de sua devoção
  rationale: No contexto imediato de oração e troca de vestes, «devoção» comunica naturalmente a prática devocional, enquanto a nota preserva os sentidos mais amplos de serviço e assistência presentes no grego.
- source_word: περιεβάλετο
  choice: revestiu-se de
  rationale: Preserva a imagem de vestir-se ou envolver-se e combina naturalmente com o substantivo abstrato «esplendor».
- source_word: τὴν δόξαν αὐτῆς
  choice: seu esplendor
  rationale: No contexto da troca de roupas antes de comparecer ao rei, indica sua magnificência visível e régia; evita que «glória» soe exclusivamente abstrata ou teológica.
theological_decisions:
- issue: Sentido de τῆς θεραπείας na troca de vestes de Ester
  choice: de sua devoção
  alternative: de seu serviço; de sua assistência; de seu culto
  rationale: A proximidade da oração favorece uma referência à observância devocional, mas θεραπεία possui campo semântico mais amplo. A nota mantém essa ambiguidade e evita restringir o termo a um rito litúrgico formal.
- issue: Sentido de τὴν δόξαν αὐτῆς
  choice: seu esplendor
  alternative: sua glória
  rationale: A mudança de vestes e o contexto régio favorecem a magnificência exterior, sem excluir a formulação mais literal «sua glória», registrada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período conserva a cadência narrativa do grego. «Vestes» e «revestiu-se» dão dignidade à cena sem recorrer a linguagem excessivamente arcaica. Os marcadores foram colocados junto às expressões a que suas respectivas notas se referem.
