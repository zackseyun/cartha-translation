lexical_decisions:
- source_word: οὐ μὴ ἀποθάνῃς
  choice: Você certamente não morrerá
  rationale: A dupla negação com o aoristo do subjuntivo expressa uma negação enfática; “certamente não morrerá” preserva essa força em português natural.
- source_word: κοινὸν
  choice: se aplica a todos
  rationale: Neste contexto, κοινόν caracteriza o decreto como comum ou de aplicação geral, não como algo vulgar ou impuro. A formulação explicita naturalmente o alcance compartilhado da determinação.
- source_word: πρόσταγμά
  choice: decreto
  rationale: O termo designa uma ordem ou determinação oficial; “decreto” condiz com o contexto régio.
- source_word: ἡμῶν
  choice: nosso
  rationale: Mantém a primeira pessoa do plural do texto grego, preservando a voz régia ou coletiva sem interpretá-la além do necessário.
