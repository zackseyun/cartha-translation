lexical_decisions:
- source_word: μετέβαλεν
  choice: mudou
  rationale: Expressa de modo direto a mudança causada por Deus, sem acrescentar uma interpretação além do verbo grego.
- source_word: τὸ πνεῦμα τοῦ βασιλέως
  choice: o espírito do rei
  rationale: Preserva a formulação concreta do grego e sua textura teológica, enquanto a nota registra os sentidos contextuais de disposição e ânimo.
- source_word: εἰς πραΰτητα
  choice: tornando-o bondoso
  rationale: No contexto, indica que o ânimo do rei foi abrandado e se tornou benigno. A construção evita o pouco natural «mudou... para mansidão».
- source_word: ἀγωνιάσας
  choice: Angustiado
  rationale: Conserva a forte aflição emocional do particípio grego e se integra naturalmente à narrativa.
- source_word: ἀνεπήδησεν
  choice: se levantou de um salto
  rationale: Comunica o movimento repentino e enérgico indicado pelo verbo.
- source_word: ἀνέλαβεν αὐτὴν ἐπὶ τὰς ἀγκάλας αὐτοῦ
  choice: tomou-a nos braços
  rationale: É uma expressão portuguesa natural e fiel à ação física descrita.
- source_word: μέχρις οὗ κατέστη
  choice: até que ela se recuperasse
  rationale: No contexto do desfalecimento de Ester, exprime claramente seu retorno à estabilidade; a nota preserva a alternativa menos específica.
- source_word: παρεκάλει
  choice: a consolava
  rationale: O imperfeito sugere ação continuada, e «consolava» corresponde ao ato de tranquilizá-la por meio da fala.
- source_word: λόγοις εἰρηνικοῖς
  choice: com palavras de paz
  rationale: Mantém a ligação lexical com paz e soa digna e compreensível em português; a nota oferece a formulação funcional.
theological_decisions:
- issue: Ação divina sobre a disposição interior do rei
  choice: Deus mudou o espírito do rei
  alternative: Deus mudou a disposição do rei
  rationale: O grego atribui explicitamente a Deus a mudança interior do rei. «Espírito» mantém essa afirmação e a terminologia da fonte sem reduzi-la a uma descrição meramente psicológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação divide o longo período grego para dar fluidez narrativa. Mantém-se «espírito» no texto principal para preservar a formulação e a tensão teológica da fonte, esclarecendo o sentido contextual em nota.
