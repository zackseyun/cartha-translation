  text: And God changed the king’s spirit to gentleness[a], and in anguish he sprang up from his throne and took her into his arms until she recovered[c][b], and he comforted her with peaceful words.
translation:
  language: pt
  text: E Deus mudou o espírito do rei, tornando-o brando[a]. Angustiado, ele se levantou de um salto do trono, tomou-a nos braços até que ela se recuperasse[b] e a consolava com palavras de paz[c].
