lexical_decisions:
- source_word: ὅτι
  choice: pois
  rationale: Introduz a razão ou explicação do que vem antes, de modo conciso e natural em português.
- source_word: κίνδυνός μου
  choice: minha vida
  rationale: Embora κίνδυνος signifique literalmente «perigo» ou «risco», neste enunciado a expressão indica que a vida da pessoa está exposta a perigo; a tradução pelo sentido comunica o idioma com naturalidade.
- source_word: ἐν χειρί μου
  choice: está em minhas mãos
  rationale: Preserva a imagem concreta do grego e, em conjunto com «minha vida», expressa a situação de grave risco.
