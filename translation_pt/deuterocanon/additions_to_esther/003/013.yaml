base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/013.yaml
  text: And she was pleading with the Lord[a], the God of Israel, and said, “My Lord, our king, you alone are the only one; help me, who am alone and have no helper except you,”
translation:
  language: pt
  text: 'Ela suplicava ao Senhor, o Deus de Israel, e disse: “Meu Senhor, nosso rei, só tu és[a]. Ajuda-me, pois estou sozinha e não tenho ninguém que me ajude, a não ser tu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tu és o único”. O grego é elíptico neste ponto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεῖτο
  choice: suplicava
  rationale: Expressa um pedido intenso e preserva o aspecto contínuo do imperfeito grego, sem reduzir a ação a uma oração genérica.
- source_word: Κυρίου θεοῦ Ἰσραήλ
  choice: ao Senhor, o Deus de Israel
  rationale: Mantém os dois títulos em aposição e verte κύριος segundo a forma bíblica corrente em português.
- source_word: Κύριέ μου
  choice: Meu Senhor
  rationale: Representa explicitamente o possessivo μου e conserva o caráter pessoal da invocação.
- source_word: ὁ βασιλεὺς ἡμῶν
  choice: nosso rei
  rationale: Preserva o título régio atribuído diretamente a Deus e sua contraposição implícita ao poder dos reis humanos.
- source_word: σὺ εἶ μόνος
  choice: só tu és
  rationale: Conserva a formulação elíptica do grego sem introduzir no texto principal um predicativo não expresso; a nota oferece a leitura mais desenvolvida.
- source_word: βοήθησόν μοι
  choice: Ajuda-me
  rationale: Traduz de modo direto e vigoroso o imperativo aoristo que pede socorro imediato.
- source_word: τῇ μόνῃ
  choice: pois estou sozinha
  rationale: Explicita de modo natural em português a condição da suplicante indicada pelo adjetivo feminino no dativo.
- source_word: μὴ ἔχουσῃ βοηθὸν
  choice: não tenho ninguém que me ajude
  rationale: Preserva a ideia pessoal de βοηθός em português corrente, evitando o pouco natural 'ajudador'.
- source_word: εἰ μὴ σέ
  choice: a não ser tu
  rationale: 'Expressa claramente a exclusão absoluta: fora de Deus, ela não tem quem a socorra.'
theological_decisions:
- issue: Título régio divino na oração de Ester
  choice: nosso rei
  alternative: nosso soberano
  rationale: O texto chama explicitamente o Deus de Israel de rei; manter o título conserva a afirmação de sua soberania sem atenuá-la.
- issue: Confissão elíptica em σὺ εἶ μόνος
  choice: só tu és
  alternative: tu és o único
  rationale: A formulação principal preserva a elipse e a tensão do grego. A alternativa mais explícita é registrada em nota, sem decidir por completo qual predicado está subentendido.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com fluência brasileira. A repetição de formas ligadas a 'ajudar' foi mantida por clareza e para refletir a recorrência de βοηθέω/βοηθός no grego. O marcador da nota foi colocado junto à expressão elíptica que ele explica.
