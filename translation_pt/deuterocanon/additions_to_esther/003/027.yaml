base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/027.yaml
  text: And your slave did not eat at Haman’s table[a], and I did not honor the king’s banquet, nor did I drink the wine of libations[b];
translation:
  language: pt
  text: E a tua escrava não comeu à mesa de Hamã[a], nem honrei o banquete do rei, nem bebi o vinho das libações[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tua serva». O grego diz literalmente «tua escrava», no feminino, termo que expressa subordinação mais forte.
    reason: lexical_alternative
  - marker: b
    text: Isto é, vinho associado a libações, ou ofertas de bebida, e não apenas vinho comum.
    reason: cultural_note
lexical_decisions:
- source_word: ἡ δούλη σου
  choice: a tua escrava
  rationale: Preserva o feminino e a forte relação de subordinação expressa por δούλη; a mudança da terceira para a primeira pessoa na oração é mantida como no grego.
- source_word: ἔφαγεν
  choice: não comeu
  rationale: Equivalente direto e corrente do aoristo de ἐσθίω, conservando a terceira pessoa do texto-fonte.
- source_word: τράπεζαν Ἁμάν
  choice: à mesa de Hamã
  rationale: Expressão idiomática em português que mantém a imagem concreta da mesa e a ideia de participar da comida oferecida por Hamã.
- source_word: ἐδόξασα
  choice: nem honrei
  rationale: Neste contexto, δοξάζω indica tratar o banquete como digno de honra; «honrei» evita uma conotação teológica indevida de «glorifiquei».
- source_word: συμπόσιον βασιλέως
  choice: o banquete do rei
  rationale: «Banquete» transmite naturalmente a refeição festiva, inclusive sua associação com bebida, em registro digno.
- source_word: οἶνον σπονδῶν
  choice: o vinho das libações
  rationale: Mantém a construção genitiva e a nuance ritual de σπονδαί, sem reduzir a expressão a vinho comum.
theological_decisions:
- issue: Força de δούλη na autorreferência de Ester
  choice: escrava
  alternative: serva
  rationale: «Escrava» preserva a subordinação mais forte codificada pelo substantivo grego feminino, enquanto a nota registra a alternativa mais branda e comum em linguagem devocional.
- issue: Nuance cultual de οἶνον σπονδῶν
  choice: vinho das libações
  alternative: vinho de ofertas derramadas
  rationale: A formulação conserva a associação ritual sem especificar além do que o grego afirma nem determinar a natureza exata do rito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Foi preservada a mudança incomum da terceira pessoa («a tua escrava não comeu») para a primeira («nem honrei... nem bebi»), pois ela está presente no texto grego. A pontuação final com ponto e vírgula acompanha o caráter continuativo do trecho.
