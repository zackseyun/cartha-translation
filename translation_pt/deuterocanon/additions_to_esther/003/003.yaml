lexical_decisions:
- source_word: ὅτι
  choice: porque
  rationale: No contexto da oração, introduz a razão do que foi dito antes; “porque” expressa de modo natural seu valor causal.
- source_word: σὺ ἐποίησας
  choice: tu fizeste
  rationale: O pronome expresso σὺ preserva a ênfase em Deus como agente. “Fizeste” permanece próximo do sentido amplo de ποιέω, sem tornar a formulação mais técnica por meio de “criaste”.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: o céu e a terra
  rationale: Reproduz a conhecida expressão abrangente para o cosmos e mantém os substantivos concretos do grego.
- source_word: πᾶν θαυμαζόμενον
  choice: tudo o que é maravilhoso
  rationale: A construção substantivada singular tem sentido coletivo. Esta formulação é natural em português e comunica tanto a qualidade admirável quanto, de forma aproximada, aquilo que causa admiração.
- source_word: ἐν τῇ ὑπʼ οὐρανόν
  choice: debaixo do céu
  rationale: Expressa de maneira idiomática o domínio terreno situado sob o céu, conservando a imagem espacial do grego.
theological_decisions:
- issue: Alcance da linguagem da criação
  choice: Apresentar Deus como aquele que fez o céu, a terra e tudo o que é maravilhoso debaixo do céu.
  alternative: Empregar “criaste” e formular a frase como uma declaração mais técnica sobre a criação.
  rationale: O grego faz uma afirmação abrangente sobre a ação divina, mas usa o verbo comum ποιέω. “Fizeste” conserva esse alcance sem acrescentar uma formulação doutrinária mais técnica.
- issue: Sentido de θαυμαζόμενον
  choice: “tudo o que é maravilhoso”
  alternative: “tudo o que causa admiração” ou “tudo aquilo que é admirado”
  rationale: O particípio pode destacar aquilo que é objeto de admiração ou aquilo que é maravilhoso. A tradução principal mantém uma expressão natural, e a nota preserva a nuance passiva.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. A segunda pessoa singular preserva o tratamento direto da oração e a ênfase do pronome grego. A vírgula final mantém a continuidade sintática do trecho no contexto maior.
