  text: porque tu fizeste o céu e a terra e tudo o que é maravilhoso debaixo do céu,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tudo o que causa admiração debaixo do céu” ou “tudo aquilo que é admirado debaixo do céu”. O particípio grego pode indicar o que é maravilhoso ou aquilo que desperta admiração.
