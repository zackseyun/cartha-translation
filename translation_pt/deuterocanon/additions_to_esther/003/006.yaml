  text: for I could have kissed the soles of his feet for the salvation of Israel,[a]
translation:
  language: pt
  text: pois eu poderia ter beijado as plantas dos pés dele para a salvação de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o livramento de Israel”.'
    reason: σωτηρία pode designar salvação ou livramento; neste contexto, refere-se ao resgate de Israel.
lexical_decisions:
- source_word: ἠδυνάμην
  choice: eu poderia ter
  rationale: A forma imperfeita de δύναμαι expressa capacidade em sentido hipotético ou concessivo no contexto da oração de Ester; a formulação preserva a disposição possível sem afirmar que o ato ocorreu.
- source_word: φιλεῖν
  choice: beijado
  rationale: Embora φιλέω também possa significar amar ou demonstrar afeto, com o objeto corporal πέλματα ποδῶν denota naturalmente o ato de beijar como gesto de submissão ou homenagem.
- source_word: πέλματα ποδῶν αὐτοῦ
  choice: as plantas dos pés dele
  rationale: πέλμα designa a planta ou parte inferior do pé. A expressão portuguesa mantém a imagem corporal vívida e evita a ambiguidade possessiva que 'seus pés' poderia criar.
- source_word: πρὸς σωτηρίαν Ἰσραήλ
  choice: pela salvação de Israel
  rationale: σωτηρία admite tanto 'salvação' como 'livramento'; aqui πρὸς indica finalidade, expressa naturalmente por 'pela', e o contexto aponta para o resgate de Israel.
theological_decisions:
- issue: Natureza da declaração de Ester sobre submissão ao rei
  choice: Declaração hipotética de que ela estaria disposta a um ato extremo de homenagem pela salvação de Israel
  alternative: Relato literal de um ato já realizado, ou afirmação geral de amor e honra
  rationale: A construção com ἠδυνάμην é mais bem entendida como capacidade ou disposição hipotética, enquanto a referência concreta às plantas dos pés favorece a imagem de submissão extrema, não apenas de afeto geral.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. 'Plantas dos pés dele' preserva a imagem do grego e elimina uma possível ambiguidade de referente.
