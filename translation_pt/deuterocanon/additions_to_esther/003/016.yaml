  text: And now we have sinned before you, and you have handed us over into the hands of our enemies.
translation:
  language: pt
  text: E agora pecamos diante de ti, e tu nos entregaste nas mãos dos nossos inimigos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ νῦν
  choice: E agora
  rationale: Preserva de modo natural tanto a conexão com a oração anterior quanto a referência temporal, sem introduzir contraste ausente no grego.
- source_word: ἡμάρτομεν
  choice: pecamos
  rationale: O aoristo indica o pecado confessado como fato; em português, o pretérito perfeito é direto e natural neste contexto de oração.
- source_word: ἐνώπιόν σου
  choice: diante de ti
  rationale: Expressa estar perante Deus, sob seu olhar, preservando as dimensões relacional e judicial da locução.
- source_word: παρέδωκας
  choice: tu nos entregaste
  rationale: Mantém explícitos o sujeito divino e a transferência do povo ao domínio dos inimigos, sem atenuar a agência de Deus.
- source_word: εἰς χεῖρας
  choice: nas mãos
  rationale: Conserva o idioma bíblico de sujeição ao poder de outra pessoa e soa natural em português.
- source_word: τῶν ἐχθρῶν ἡμῶν
  choice: dos nossos inimigos
  rationale: Tradução direta e corrente que identifica aqueles sob cujo poder o povo foi entregue.
theological_decisions:
- issue: Agência divina no juízo sobre o povo
  choice: A tradução declara diretamente que Deus entregou o povo aos seus inimigos.
  alternative: Empregar uma formulação passiva ou mais branda que deixe implícita a agência divina.
  rationale: O grego dirige-se a Deus na segunda pessoa e faz dele o sujeito explícito de παρέδωκας. A formulação preserva a afirmação teológica e sua tensão com a confissão de pecado.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe própria da oração. O pronome «tu» foi mantido porque o verbo grego se dirige explicitamente a Deus na segunda pessoa do singular e porque a forma é amplamente inteligível no português bíblico internacional.
