  text: But rescue us by your hand, and help me, who am alone and have no one except you, Lord. You have knowledge of all things,
translation:
  language: pt
  text: Mas livra-nos pela tua mão e ajuda-me, pois estou sozinha e não tenho ninguém além de ti, Senhor. Tu tens conhecimento de todas as coisas,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥῦσαι
  choice: livra-nos
  rationale: O imperativo aoristo pede libertação de um perigo concreto. «Livra-nos» é natural na linguagem bíblica de oração e mantém o objeto plural ἡμᾶς.
- source_word: ἐν χειρί σου
  choice: pela tua mão
  rationale: Preserva a metáfora bíblica da mão como instrumento de poder e expressa de modo claro a ideia de agência.
- source_word: βοήθησόν μοι
  choice: ajuda-me
  rationale: Tradução direta e corrente do imperativo com pronome dativo, adequada a uma súplica urgente.
- source_word: τῇ μόνῃ
  choice: pois estou sozinha
  rationale: O feminino singular identifica a condição da orante. A oração explicativa comunica naturalmente que sua solidão fundamenta o pedido.
- source_word: μὴ ἔχουσῃ εἰ μὴ σέ
  choice: e não tenho ninguém além de ti
  rationale: Mantém a continuação participial da descrição de desamparo e explicita em português o objeto pessoal implícito.
- source_word: Κύριε
  choice: Senhor
  rationale: Na invocação dirigida a Deus, «Senhor» é a tradução portuguesa tradicional, clara e apropriada para κύριος.
- source_word: πάντων γνῶσιν ἔχεις
  choice: Tu tens conhecimento de todas as coisas
  rationale: Reflete formalmente a construção nominal γνῶσιν ἔχεις, sem reduzi-la ao simples verbo «saber», e conserva o tom elevado da oração.
theological_decisions:
- issue: Tradução de κύριος na invocação direta a Deus
  choice: Senhor
  alternative: Soberano
  rationale: O contexto é uma oração ao Deus de Israel; «Senhor» mantém a referência divina convencional sem introduzir uma nuance interpretativa adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a metáfora «pela tua mão» e a construção elevada «tens conhecimento de todas as coisas». A vírgula final foi mantida porque o segmento prossegue no versículo seguinte.
