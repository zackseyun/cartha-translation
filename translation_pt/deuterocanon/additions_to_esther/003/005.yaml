  source_fidelity: 'O conteúdo central é fiel: preserva a dupla afirmação de conhecimento dirigida ao Senhor, os երեք motivos negados (insolência, orgulho e ambição), a caracterização de Hamã como arrogante e a recusa de προσκυνεῖν sem qualificá-la como adoração. Contudo, a construção «fiz isso: não me prostrar» não estabelece de modo gramatical e natural, em português, a relação que o infinitivo articular grego explicita.'
  naturalness: 'Há uma inadequação sintática após os dois-pontos: «fiz isso: não me prostrar» põe um infinitivo solto após uma forma verbal finita. A revisão torna explícito que o ato em questão foi deixar de prostrar-se, mantendo a negação dos motivos sem acrescentar um motivo positivo.'
