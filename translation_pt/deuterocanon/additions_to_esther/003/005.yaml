base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/005.yaml
  text: You know all things; you know[a], Lord, that it was not in insolence or in pride or in ambition that I did this—refusing to bow down to the proud Haman.
translation:
  language: pt
  text: Tu conheces todas as coisas; tu sabes, Senhor, que não foi por insolência, nem por orgulho, nem por ambição que deixei de me prostrar diante do arrogante Hamã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deixar de prestar reverência ao arrogante Hamã”.'
    reason: Alternativa lexical para προσκυνεῖν, que pode indicar prostração ou homenagem, sem necessariamente significar adoração.
lexical_decisions:
- source_word: σὺ πάντα γινώσκεις
  choice: Tu conheces todas as coisas
  rationale: Mantém a ênfase do pronome e o alcance abrangente da afirmação, em registro adequado à oração.
- source_word: σὺ οἶδας
  choice: tu sabes
  rationale: Preserva a repetição enfática dos dois verbos gregos de conhecimento, sem fundi-los numa só expressão.
- source_word: Κύριε
  choice: Senhor
  rationale: É a forma corrente e digna de tratamento dirigido a Deus.
- source_word: οὐκ ἐν ὕβρει
  choice: não foi por insolência
  rationale: Expressa a conduta afrontosa e desmedida indicada por ὕβρις; a construção com «por» comunica naturalmente o motivo negado.
- source_word: οὐδὲ ἐν ὑπερηφανείᾳ
  choice: nem por orgulho
  rationale: Distingue o orgulho interior da insolência mencionada antes, com linguagem clara e atual.
- source_word: οὐδὲ ἐν φιλοδοξίᾳ
  choice: nem por ambição
  rationale: Comunica de maneira concisa o desejo egoísta de honra ou prestígio que φιλοδοξία pode designar.
- source_word: ἐποίησα τοῦτο
  choice: fiz isso
  rationale: Tradução direta que permite à expressão infinitiva seguinte explicar em que consistiu a ação.
- source_word: τὸ μὴ προσκυνεῖν
  choice: não me prostrar diante de
  rationale: Representa o gesto físico de inclinar-se ou prostrar-se; a nota registra a alternativa sem impor ao contexto o sentido estritamente cultual.
- source_word: τὸν ὑπερήφανον Ἁμάν
  choice: o arrogante Hamã
  rationale: Conserva a caracterização moral explícita de Hamã e diferencia ὑπερήφανος do substantivo anteriormente traduzido por «orgulho».
theological_decisions:
- issue: Motivo da recusa de Mardoqueu em honrar Hamã
  choice: O texto nega que a recusa tenha nascido de insolência, orgulho ou ambição, sem declarar aqui seu motivo positivo.
  alternative: Explicitar que a recusa foi exclusivamente religiosa, política ou pessoal.
  rationale: O grego apenas exclui três motivações condenáveis. A tradução não acrescenta uma explicação que este versículo não oferece.
- issue: Valor de προσκυνεῖν no gesto dirigido a Hamã
  choice: Traduzir como «prostrar-se diante de», sem definir o gesto como adoração.
  alternative: Traduzir como «adorar» ou «prestar reverência».
  rationale: O verbo pode descrever prostração, homenagem ou adoração conforme o contexto. A formulação escolhida preserva essa amplitude e evita decidir antecipadamente a natureza teológica do gesto.
translation_notes:
  register: Português moderno, claro e digno, com cadência de oração. A repetição «conheces... sabes» reproduz a ênfase do grego. Emprega-se «tu» por coerência com o tratamento direto e solene a Deus; «Hamã» segue a forma portuguesa consagrada.
