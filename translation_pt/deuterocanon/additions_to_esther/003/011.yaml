  text: And Esther the queen fled to the Lord[a], seized by a struggle of death[b],
translation:
  language: pt
  text: E a rainha Ester refugiou-se no Senhor[a], tomada por uma luta de morte[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fugiu para o Senhor”. O verbo grego pode indicar fugir para alguém em busca de refúgio.
    reason: lexical_alternative
  - marker: b
    text: Ou “tomada por uma luta mortal” ou “em agonia de morte”. A expressão grega reúne as ideias de luta intensa e morte iminente.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέφυγεν
  choice: buscou refúgio
  rationale: O verbo expressa fugir para alguém em busca de proteção. “Buscou refúgio” comunica claramente esse movimento figurado em direção ao Senhor, sem sugerir mera fuga física.
- source_word: κύριον
  choice: Senhor
  rationale: No contexto, o termo se refere a Deus. “Senhor” traduz κύριος sem introduzir a forma “SENHOR”, pois o texto grego não apresenta explicitamente o nome divino.
- source_word: ἐν ἀγῶνι θανάτου
  choice: por uma agonia de morte
  rationale: ἀγών pode indicar luta, conflito intenso ou agonia. A expressão mantém a ligação compacta com θανάτου e transmite a crise extrema diante da morte, sem definir se o enfoque é interior, circunstancial ou ambos.
- source_word: κατειλημμένη
  choice: tomada
  rationale: O particípio passivo indica que Ester foi alcançada, dominada ou envolvida por essa condição. “Tomada” é vívido, conciso e natural em português.
theological_decisions:
- issue: Designação de Deus por κύριον
  choice: Senhor
  alternative: SENHOR
  rationale: A passagem mostra Ester recorrendo ao Deus de Israel, mas o texto-fonte traz κύριον, não uma representação explícita do tetragrama. “Senhor” preserva essa distinção.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A ordem “a rainha Ester” acompanha o destaque do grego. A vírgula final foi preservada porque o segmento termina em uma oração que continua no contexto.
