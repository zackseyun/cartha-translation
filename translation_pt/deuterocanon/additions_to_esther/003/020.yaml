  text: and to open the mouth of the nations to the praises of worthless things[b][a], and for a fleshly king to be marveled at forever.
translation:
  language: pt
  text: e abrir a boca das nações para que louvem coisas vãs[a], e para que um rei de carne[b] seja admirado para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que proclamem as excelências de coisas vãs” ou “para os louvores de vaidades”. O grego diz mais literalmente: “para as excelências de coisas vãs”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “um rei mortal” ou “um rei meramente humano”. Em grego: “um rei de carne”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι στόμα
  choice: abrir a boca
  rationale: Preserva a imagem idiomática grega de dar ocasião ou capacidade para falar, sem substituí-la por uma paráfrase abstrata.
- source_word: ἐθνῶν
  choice: das nações
  rationale: É a tradução ampla e pouco interpretativa do termo, que neste contexto se refere aos povos não israelitas.
- source_word: ἀρετὰς ματαίων
  choice: os louvores de coisas vãs
  rationale: “Louvores” comunica naturalmente a atribuição de excelências, enquanto “coisas vãs” conserva a indeterminação e a força pejorativa de ματαίων sem explicitar “ídolos” no texto principal.
- source_word: θαυμασθῆναι
  choice: seja admirado
  rationale: Expressa o sentido passivo de causar admiração ou assombro sem intensificá-lo indevidamente para “ser adorado”.
- source_word: βασιλέα σάρκινον
  choice: um rei de carne
  rationale: Mantém a expressão concreta do grego e o contraste entre um governante meramente humano e Deus.
- source_word: εἰς αἰῶνα
  choice: para sempre
  rationale: Verte de modo natural o valor duradouro do idioma grego neste contexto.
theological_decisions:
- issue: Se ματαίων deve ser explicitado como referência a ídolos
  choice: coisas vãs
  alternative: ídolos sem valor
  rationale: Embora o contexto sugira aclamação idolátrica, o substantivo implícito permanece indeterminado no grego. A tradução conserva essa ambiguidade e deixa a possível referência cultual ser inferida do contexto.
- issue: Como expressar o contraste entre o rei humano e Deus em σάρκινον
  choice: um rei de carne
  alternative: um rei mortal; um rei meramente humano
  rationale: A formulação concreta preserva a tensão teológica do original sem transformar a metáfora em explicação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. A construção “abrir a boca ... para proclamar” preserva a imagem grega com fluidez; “rei de carne” mantém deliberadamente a expressão vívida do original.
