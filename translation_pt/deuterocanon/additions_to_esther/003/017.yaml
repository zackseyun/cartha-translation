lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: porque
  rationale: A expressão introduz a causa ou o fundamento do juízo reconhecido na oração; “porque” transmite essa relação de modo claro e natural.
- source_word: ἐδοξάσαμεν
  choice: glorificamos
  rationale: O verbo δοξάζω indica atribuir glória ou honra. “Glorificamos” é direto, preserva o tom confessional e evita expandir desnecessariamente a expressão.
- source_word: τοὺς θεοὺς αὐτῶν
  choice: os deuses deles
  rationale: Mantém o plural e o possessivo do grego, além do contraste entre os deuses dos outros povos e o Senhor.
- source_word: δίκαιος
  choice: justo
  rationale: “Justo” expressa em português tanto a retidão moral quanto a justiça do agir divino, preservando a amplitude contextual de δίκαιος.
- source_word: Κύριε
  choice: Senhor
  rationale: É o vocativo de κύριος e, nesta oração dirigida a Deus, “Senhor” é a forma portuguesa natural e tradicional.
theological_decisions:
- issue: Sentido de δίκαιος na declaração dirigida a Deus
  choice: justo
  alternative: reto
  rationale: “Justo” conserva simultaneamente as dimensões moral e judicial do termo, sem decidir entre elas. “Reto” explicita melhor a primeira dimensão e é registrado em nota.
- issue: Sentido de κύριος como invocação divina
  choice: Senhor
  alternative: Soberano
  rationale: No contexto de oração, κύριος funciona como forma de tratamento dirigida a Deus. “Senhor” preserva esse uso sem introduzir uma formulação interpretativa mais específica.
translation_notes:
  register: Português atual, digno e acessível, com ordem sintática natural. A abertura em minúscula preserva o caráter de continuação do segmento anterior. Os pronomes na fala dirigida a Deus foram mantidos em forma corrente, sem capitalização devocional acrescentada ao texto grego.
