base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/028.yaml
  text: And your slave has not rejoiced from the day of my change until now[a], except in you, Lord[b], God of Abraham.
translation:
  language: pt
  text: E a tua escrava[a] não se alegrou, desde o dia da minha mudança[b] até agora, a não ser em ti, Senhor, Deus de Abraão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “serva”. O grego emprega a forma feminina de “escravo/servo” (δούλη), como autodesignação humilde diante de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “minha reviravolta” ou “desde que a minha situação mudou”. A expressão grega não especifica a natureza exata da mudança.
    reason: alternative_reading
lexical_decisions:
- source_word: δούλη
  choice: escrava
  rationale: O substantivo é a forma feminina de δοῦλος e expressa dependência e auto-humilhação diante de Deus. “Escrava” preserva essa força, enquanto “serva” é uma alternativa possível no registro de oração.
- source_word: ηὐφράνθη
  choice: não se alegrou
  rationale: O verbo denota alegrar-se ou regozijar-se. “Não se alegrou” é natural em português e não acrescenta um motivo não expresso no grego.
- source_word: ἀφʼ ἡμέρας μεταβολῆς μου
  choice: desde o dia da minha mudança
  rationale: μεταβολή pode indicar mudança, alteração ou reviravolta. A formulação conserva a natureza indeterminada da mudança.
- source_word: πλὴν ἐπὶ σοί
  choice: a não ser em ti
  rationale: πλήν introduz a exceção, e ἐπί com dativo apresenta Deus como esfera ou fundamento exclusivo da alegria.
- source_word: Κύριε
  choice: Senhor
  rationale: Tradução vocativa convencional e adequada de κύριος.
- source_word: ὁ θεὸς Ἀβραάμ
  choice: Deus de Abraão
  rationale: Reproduz naturalmente em português o título divino de caráter pactual.
theological_decisions:
- issue: Autodesignação δούλη na oração
  choice: tua escrava
  alternative: tua serva
  rationale: “Escrava” mantém a linguagem enfática de total dependência presente no grego; a nota registra “serva” como possibilidade legítima de registro.
- issue: Sentido de μεταβολή na oração de Ester
  choice: minha mudança
  alternative: minha reviravolta; mudança da minha situação
  rationale: O texto grego não define se se trata de posição social, sorte ou circunstâncias; a tradução preserva essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. Conserva-se o tom humilde da oração e a ambiguidade de μεταβολή.
