  text: Do not overlook your portion[a], which I redeemed for myself out of the land of Egypt.
translation:
  language: pt
  text: Não ignores a tua porção[a], que resgataste para ti da terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: a tua parte. A expressão pode referir-se ao povo como porção pertencente a Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ὑπερίδῃς
  choice: Não ignores
  rationale: A forma proibitiva pede uma ordem negativa. “Não ignores” comunica o sentido de não deixar de lado nem tratar com descaso, sem intensificar indevidamente para “não desprezes”.
- source_word: τὴν μερίδα σου
  choice: a tua porção
  rationale: μερίς significa “porção” ou “parte” e, neste contexto, pode evocar o povo como posse de Deus. “Porção” preserva a metáfora sem explicitar “povo” ou impor o sentido mais técnico de “herança”.
- source_word: ἣν
  choice: que
  rationale: O pronome relativo retoma diretamente “a tua porção”.
- source_word: σεαυτῷ
  choice: para ti
  rationale: O dativo reflexivo indica que Deus resgatou essa porção para si mesmo, como sua posse. Em português, “para ti” preserva naturalmente a segunda pessoa reflexiva no contexto da oração dirigida a Deus.
- source_word: ἐλυτρώσω
  choice: resgataste
  rationale: 'A forma grega é a segunda pessoa do singular do aoristo médio de λυτρόω: “tu resgataste”, e não “eu resgatei”. “Resgataste” conserva tanto a pessoa verbal quanto a força redentora do verbo.'
- source_word: ἐκ γῆς Αἰγύπτου
  choice: da terra do Egito
  rationale: Tradução natural da fórmula bíblica que identifica o Egito como o lugar de onde Deus resgatou sua porção.
theological_decisions:
- issue: Nuance pactual de μερίς como designação do povo pertencente a Deus
  choice: a tua porção
  alternative: a tua herança; o povo que te pertence
  rationale: O texto chama o objeto do resgate de “tua porção”, sem inserir explicitamente “povo”. A tradução mantém a metáfora e sua ressonância pactual sem ampliar o original.
- issue: Pessoa verbal de ἐλυτρώσω e referência reflexiva de σεαυτῷ
  choice: que resgataste para ti
  alternative: que resgataste como tua propriedade
  rationale: 'A oração é dirigida a Deus, e as formas gregas são de segunda pessoa: ἐλυτρώσω significa “resgataste” e σεαυτῷ, “para ti mesmo”. A formulação evita a leitura incoerente “eu resgatei para mim” presente na camada inglesa de consulta.'
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa coerentes com a oração dirigida a Deus. “Não ignores” é corrente e preserva a ideia de não negligenciar; “porção” mantém a imagem bíblica sem explicação excessiva no corpo do texto.
