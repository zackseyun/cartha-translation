base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/008.yaml
  text: And now[a], Lord God, King, God of Abraham, spare your people[b], because they are watching us for destruction and have desired to destroy your inheritance from the beginning.
translation:
  language: pt
  text: E agora, Senhor Deus, Rei, Deus de Abraão, poupa o teu povo, pois eles voltam os olhos contra nós para nos destruir[a] e desejaram exterminar a tua herança desde o princípio[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fixam os olhos em nós para a nossa ruína”. A expressão grega é condensada e indica uma intenção hostil dirigida à nossa destruição.
    reason: lexical_alternative
  - marker: b
    text: Ou “desde os tempos antigos” ou “desde a antiguidade”.
    reason: alternative_reading
lexical_decisions:
- source_word: Κύριε
  choice: Senhor
  rationale: Vocativo direto de κύριος; “Senhor” preserva o título bíblico corrente e o registro da oração.
- source_word: ὁ θεὸς ὁ βασιλεὺς
  choice: Deus, Rei
  rationale: Mantém de forma compacta a sequência de títulos em aposição, sem transformar “Rei” numa construção interpretativa.
- source_word: φεῖσαι
  choice: poupa
  rationale: O imperativo de φείδομαι pede que Deus não permita a destruição do povo; “poupa” é direto e lexicalmente preciso.
- source_word: τοῦ λαοῦ σου
  choice: o teu povo
  rationale: λαός, nesta oração de aliança, designa o povo pertencente a Deus.
- source_word: ἐπιβλέπουσιν ἡμῖν εἰς καταφθοράν
  choice: voltam os olhos contra nós para nos destruir
  rationale: A expressão grega é condensada e comunica um olhar hostil dirigido à ruína dos suplicantes. A formulação portuguesa torna natural essa direção adversa sem reduzir o sentido a mera observação.
- source_word: καταφθοράν
  choice: destruir
  rationale: O substantivo expressa ruína ou destruição; a construção verbal é mais idiomática em português e conserva sua força.
- source_word: ἐπεθύμησαν
  choice: desejaram
  rationale: Preserva o sentido de desejo ou intenção, sem elevar indevidamente o verbo a “planejaram”.
- source_word: ἀπολέσαι
  choice: exterminar
  rationale: No contexto de destruição coletiva, “exterminar” expressa naturalmente a força de ἀπολέσαι e evita a repetição imediata de “destruir”.
- source_word: τὴν ἐξ ἀρχῆς κληρονομίαν σου
  choice: a tua herança desde o princípio
  rationale: Mantém a metáfora de Israel como herança de Deus e traduz formalmente ἐξ ἀρχῆς, deixando em nota sua possível força idiomática temporal.
theological_decisions:
- issue: Referente de “tua herança”
  choice: Preservar “herança” como designação metafórica do povo de Deus
  alternative: Explicitar “o povo que é tua herança” ou entender a expressão como terra e patrimônio da aliança
  rationale: O paralelismo com “teu povo” favorece a referência a Israel, mas a tradução não elimina a amplitude possível da metáfora.
- issue: Força temporal de ἐξ ἀρχῆς
  choice: desde o princípio
  alternative: desde os tempos antigos / desde a antiguidade
  rationale: A tradução principal acompanha de perto o grego; a nota conserva a possibilidade de referência idiomática a uma posse antiga, não necessariamente ao começo absoluto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “tu” coerente com o discurso direto a Deus. A invocação acumulada foi preservada, e as duas ambiguidades relevantes do grego foram registradas em notas.
