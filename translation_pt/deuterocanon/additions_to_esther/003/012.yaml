  to: Ela tirou suas vestes de esplendor e vestiu roupas de angústia e luto. Em vez dos perfumes luxuosos[a], encheu a cabeça de cinzas e esterco[b], humilhou muito o seu corpo e encheu cada lugar de seu adorno festivo com seus cabelos retorcidos[c].
