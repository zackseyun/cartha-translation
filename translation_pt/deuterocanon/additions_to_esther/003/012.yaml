base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/012.yaml
  text: And taking off her garments of glory[a], she put on garments of distress and mourning; and instead of splendid perfumes, she filled her head with ashes and dung, and she humbled her body greatly[c][b], and every place of her joyful adornment she filled with the twisting of her hair.
translation:
  language: pt
  text: Ela tirou suas vestes de esplendor e vestiu roupas de angústia e luto. Em vez dos perfumes luxuosos[a], encheu a cabeça de cinzas e esterco[b], humilhou muito o seu corpo e encheu cada lugar de seu adorno festivo com seus cabelos retorcidos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “perfumes orgulhosos” ou “arrogantes”; a expressão provavelmente se refere a fragrâncias caras e ostentosas.
    reason: lexical_alternative
  - marker: b
    text: Ou “cobriu a cabeça de cinzas e esterco”. O grego diz mais literalmente “encheu a cabeça”.
    reason: lexical_alternative
  - marker: c
    text: A frase final é difícil. Pode indicar que os lugares de seu corpo antes ornamentados para a alegria passaram a ficar marcados por seus cabelos torcidos, emaranhados ou desalinhados em sinal de luto.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφελομένη τὰ ἱμάτια τῆς δόξης αὐτῆς
  choice: tirou suas vestes de esplendor
  rationale: Expressa naturalmente o ato deliberado de retirar as roupas e conserva o contraste entre o esplendor régio e as roupas de luto. “Esplendor” comunica aqui aparência magnífica e posição, não apenas honra abstrata.
- source_word: ἱμάτια στενοχωρίας καὶ πένθους
  choice: roupas de angústia e luto
  rationale: “Angústia” preserva a força de στενοχωρία, enquanto “luto” é o equivalente claro e corrente de πένθος neste contexto.
- source_word: ἀντὶ τῶν ὑπερηφάνων ἡδυσμάτων
  choice: em vez dos perfumes luxuosos
  rationale: ἡδύσματα designa substâncias aromáticas, perfumes ou unguentos. Embora ὑπερήφανος signifique literalmente “orgulhoso” ou “arrogante”, aplicado a perfumes indica aqui seu caráter ostentoso ou luxuoso; a nota preserva a expressão grega incomum.
- source_word: σποδοῦ καὶ κοπριῶν
  choice: cinzas e esterco
  rationale: Mantém sem suavização a imagem física e extrema do auto-humilhamento. κόπρια significa diretamente esterco ou excremento usado como estrume.
- source_word: ἔπλησεν τὴν κεφαλήν
  choice: encheu a cabeça
  rationale: Conserva o verbo grego “encher”, apesar de sua expressão incomum em português. A nota oferece “cobriu” como formulação idiomática provável.
- source_word: τὸ σῶμα ἐταπείνωσεν σφόδρα
  choice: humilhou profundamente o corpo
  rationale: Preserva tanto o objeto explícito, “o corpo”, quanto a ideia de rebaixamento ou auto-humilhação intensa, sem acrescentar um rito específico não declarado no texto.
- source_word: πάντα τόπον κόσμου ἀγαλλιάματος αὐτῆς
  choice: cada parte antes enfeitada para a alegria
  rationale: κόσμος significa aqui adorno, não “mundo”, e ἀγαλλίαμα aponta para alegria ou celebração. “Antes” explicita apenas o contraste contextual entre a aparência festiva e o luto atual.
- source_word: στρεπτῶν τριχῶν αὐτῆς
  choice: seus cabelos retorcidos
  rationale: Mantém a relação lexical de στρεπτός com algo torcido ou retorcido, sem decidir de modo excessivamente seguro se os cabelos estavam trançados, emaranhados ou desalinhados como gesto de luto.
theological_decisions:
- issue: Intensidade e caráter físico do luto de Ester
  choice: Manter “cinzas e esterco” e “humilhou profundamente o corpo”.
  alternative: Suavizar para “cinzas e sujeira” ou generalizar como “afligiu-se profundamente”.
  rationale: O grego enfatiza um rebaixamento corporal radical. A tradução não deve reduzir essa força nem substituir as imagens concretas por uma descrição genérica de tristeza.
- issue: Sentido da frase difícil στρεπτῶν τριχῶν αὐτῆς
  choice: Traduzir de modo conservador como “seus cabelos retorcidos” e explicar a incerteza em nota.
  alternative: Interpretar diretamente como “cabelos emaranhados”, “cabelos desalinhados” ou “arrancamento dos cabelos”.
  rationale: O texto aponta para cabelos torcidos, mas não estabelece com clareza a aparência ou o gesto exato. A opção conserva a ambiguidade sem impor uma prática específica de luto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construções naturais para leitores brasileiros. A sequência de ações foi dividida em duas frases para legibilidade, mantendo o encadeamento narrativo. As imagens fortes do original foram preservadas, e as expressões gregas incomuns ou incertas receberam notas sem resolução excessiva.
