  terminology: “Vestes de esplendor”, “roupas de angústia e luto”, “cinzas e esterco” e “perfumes luxuosos” são escolhas adequadas. A nota de “perfumes orgulhosos” preserva corretamente a estranheza de ὑπερηφάνων. “Adorno festivo” comunica κόσμος ἀγαλλιάματος com mais concisão e sem a paráfrase temporal “antes enfeitada”.
