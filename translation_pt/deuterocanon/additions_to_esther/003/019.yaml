  text: to remove the decree from your mouth and to destroy your inheritance[a], and to shut the mouth of those who praise you, and to extinguish the glory of your house and your altar[d][c][b],
translation:
  language: pt
  text: para remover o decreto da tua boca[a] e destruir a tua herança[b], fechar a boca dos que te louvam[c] e extinguir a glória da tua casa[d] e o teu altar,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tirar o decreto da tua boca”. A expressão pode indicar a remoção ou anulação da determinação que procede de Deus.'
    reason: lexical_alternative
  - marker: b
    text: “Tua herança” provavelmente se refere ao povo ou à possessão pertencente a Deus, conforme a linguagem pactual bíblica.
    reason: cultural_note
  - marker: c
    text: 'Ou: “silenciar os que te louvam”. O texto principal preserva mais de perto a imagem grega de fechar a boca.'
    reason: lexical_alternative
  - marker: d
    text: “Tua casa” provavelmente se refere ao templo, embora o grego diga literalmente “casa”.
    reason: cultural_note
lexical_decisions:
- source_word: ἐξᾶραι ὁρισμὸν στόματός σου
  choice: abolir o decreto da tua boca
  rationale: “Abolir” expressa a retirada ou anulação pretendida pelo infinitivo ἐξᾶραι, enquanto “decreto” comunica a determinação autorizada indicada por ὁρισμός. Mantém-se “da tua boca” para preservar a imagem concreta e o paralelismo com a boca dos que louvam.
- source_word: ἀφανίσαι κληρονομίαν σου
  choice: destruir a tua herança
  rationale: ἀφανίζω indica fazer desaparecer ou levar à ruína; “destruir” conserva a força da ameaça. “Herança” mantém a linguagem pactual de κληρονομία sem identificar explicitamente o referente.
- source_word: ἐμφράξαι στόμα αἰνούντων σοι
  choice: fechar a boca dos que te louvam
  rationale: A expressão conserva a imagem concreta de bloquear ou fechar a boca, mas usa uma construção corrente em português. O particípio presente é traduzido naturalmente como “os que te louvam”.
- source_word: σβέσαι δόξαν οἴκου σου
  choice: extinguir a glória da tua casa
  rationale: σβέννυμι evoca apagar fogo ou luz; “extinguir” preserva essa metáfora aplicada à glória. “Casa” traduz οἶκος sem inserir “templo” no texto principal.
- source_word: θυσιαστήριόν σου
  choice: o teu altar
  rationale: Tradução direta e usual de θυσιαστήριον, mantendo o possessivo da invocação dirigida a Deus.
theological_decisions:
- issue: Referente de “tua herança”
  choice: Mantido como “tua herança”
  alternative: teu povo
  rationale: No contexto, a expressão provavelmente designa o povo que pertence a Deus, mas o grego não o identifica de modo explícito. A formulação preserva a ressonância pactual e a abertura do original.
- issue: Sentido de “tua casa”
  choice: Mantido literalmente como “tua casa”
  alternative: teu templo
  rationale: A casa provavelmente é o templo, sobretudo pela menção conjunta do altar, mas o texto grego emprega οἶκος, “casa”. A tradução não transforma a inferência contextual em explicitação.
- issue: Relação sintática entre glória, casa e altar
  choice: “extinguir a glória da tua casa e o teu altar”
  alternative: “extinguir a glória da tua casa e do teu altar”
  rationale: O grego apresenta “a glória da tua casa” e depois “o teu altar” como elementos coordenados sob o infinitivo “extinguir”. A tradução evita fazer de “altar” um segundo complemento de “glória”.
translation_notes:
  register: Português moderno, digno e acessível, com formas de segunda pessoa coerentes com a oração dirigida a Deus. A redação conserva as imagens concretas de “boca”, “casa” e “extinguir”, evitando explicitações interpretativas no texto principal.
