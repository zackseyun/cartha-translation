base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/022.yaml
  text: Remember[a], Lord; make yourself known in the time of our affliction, and encourage me[b], O King of the gods and ruler over every authority.
translation:
  language: pt
  text: Lembra-te, Senhor; torna-te conhecido[a] no tempo da nossa aflição e dá-me coragem, ó Rei dos deuses[b] e soberano sobre toda autoridade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sê conhecido” ou “manifesta-te”. A forma grega pode exprimir tanto um pedido para que Deus seja conhecido quanto para que ele próprio se manifeste.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “Rei dos deuses”. A expressão proclama a supremacia de Deus sobre tudo o que é chamado deus ou poder divino.
    reason: theological_clarity
lexical_decisions:
- source_word: μνήσθητι
  choice: Lembra-te
  rationale: O imperativo aoristo médio, em linguagem de oração, é preservado como apelo direto e idiomático, sem explicitar além do grego o que Deus deve recordar.
- source_word: Κύριε
  choice: Senhor
  rationale: Vocativo de κύριος empregado como título divino; “Senhor” é a equivalência consagrada, natural e adequada ao registro da oração.
- source_word: γνώρισθητι
  choice: torna-te conhecido
  rationale: O imperativo aoristo passivo admite força passiva ou reflexiva. A formulação comunica um pedido de manifestação divina e mantém a ambiguidade relevante em nota.
- source_word: ἐν καιρῷ θλίψεως ἡμῶν
  choice: no tempo da nossa aflição
  rationale: Mantém tanto καιρός, como tempo ou ocasião determinada, quanto θλῖψις, aflição ou angústia, em português claro e solene.
- source_word: ἐμὲ θάρσυνον
  choice: dá-me coragem
  rationale: θαρσύνω significa encorajar ou infundir coragem. “Dá-me coragem” expressa de modo natural o pedido pessoal da oração.
- source_word: Βασιλεῦ τῶν θεῶν
  choice: ó Rei dos deuses
  rationale: Reproduz diretamente o título grego, sem suavizá-lo para “acima dos deuses”; o contexto expressa a supremacia do Senhor.
- source_word: πάσης ἀρχῆς ἐπικρατῶν
  choice: e soberano sobre toda autoridade
  rationale: ἀρχή pode designar autoridade, domínio ou poder, e ἐπικρατέω indica exercer domínio. A tradução preserva a abrangência e funciona naturalmente como continuação do título dirigido a Deus.
theological_decisions:
- issue: Título divino Βασιλεῦ τῶν θεῶν
  choice: ó Rei dos deuses
  alternative: ó Rei acima dos deuses
  rationale: A redação explícita do grego é mantida para não eliminar sua tensão teológica. No contexto da oração judaica, o título proclama a supremacia do Senhor sobre tudo o que é chamado deus, sem exigir que a tradução resolva a natureza desses referentes.
- issue: Voz e força de γνώρισθητι
  choice: torna-te conhecido
  alternative: sê conhecido; manifesta-te
  rationale: A forma passiva pode ser lida de maneira mais estritamente passiva ou com sentido de automanifestação. O texto principal usa uma construção portuguesa natural, enquanto a nota conserva as alternativas sem determinar o modo preciso da intervenção divina.
- issue: Relação de πάσης ἀρχῆς ἐπικρατῶν com o título precedente
  choice: e soberano sobre toda autoridade
  alternative: ó Rei que domina os deuses e toda autoridade
  rationale: A tradução conserva a estrutura de título duplo sugerida por Βασιλεῦ τῶν θεῶν seguido do particípio ἐπικρατῶν, em vez de reconfigurar “dos deuses” como objeto do particípio.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Preservaram-se a linguagem direta da oração, o título incomum “Rei dos deuses” e a distinção entre “deuses” e “toda autoridade”.
