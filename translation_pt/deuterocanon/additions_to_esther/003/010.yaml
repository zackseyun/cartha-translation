base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/010.yaml
  text: Hear my petition and be merciful to your allotted people[a], and turn our mourning into gladness, so that, living, we may sing praise to your name, O Lord, and do not destroy the mouth of those who praise you. And all Israel cried out with all their strength[b], because their death was before their eyes.
translation:
  language: pt
  text: Ouve a minha súplica e tem misericórdia do teu povo, tua porção[a]. Transforma o nosso luto em alegria, para que, permanecendo vivos, cantemos louvores ao teu nome, ó Senhor; e não destruas a boca dos que te louvam[b]. E todo o Israel clamou com todas as suas forças, pois a morte deles estava diante dos seus olhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tem misericórdia da tua porção” ou “do teu quinhão”. Aqui, a expressão se refere ao povo que pertence a Deus.
    reason: lexical_alternative
  - marker: b
    text: A expressão “não destruas a boca” pede que Deus não elimine nem silencie aqueles que o louvam.
    reason: imagery_clarification
lexical_decisions:
- source_word: ἄκουσον τῆς δεήσεώς μου
  choice: Ouve a minha súplica
  rationale: O imperativo é direto e próprio da linguagem de oração. “Súplica” conserva o sentido de pedido urgente expresso por δέησις.
- source_word: ἱλάσθητι τῷ κλήρῳ σου
  choice: tem misericórdia do povo que te coube como porção
  rationale: ἱλάσθητι pede favor ou misericórdia, sem exigir terminologia técnica de expiação. κλῆρος designa literalmente lote ou porção atribuída e, no contexto, refere-se ao povo pertencente a Deus.
- source_word: στρέψον τὸ πένθος ἡμῶν εἰς εὐφροσύνην
  choice: Transforma o nosso luto em alegria
  rationale: Expressa com naturalidade a inversão entre luto e júbilo presente no grego.
- source_word: ἵνα ζῶντες ὑμνῶμεν σου τὸ ὄνομα
  choice: para que, permanecendo vivos, cantemos louvores ao teu nome
  rationale: O particípio ζῶντες associa a sobrevivência à possibilidade de louvar, enquanto ὑμνῶμεν sugere louvor cantado.
- source_word: μὴ ἀφανίσῃς στόμα αἰνούντων σου
  choice: não destruas a boca dos que te louvam
  rationale: Mantém a imagem concreta e forte do original; uma nota esclarece seu sentido figurado de não silenciar nem eliminar os adoradores.
- source_word: ἐκέκραξαν ἐξ ἰσχύος αὐτῶν
  choice: clamou com todas as suas forças
  rationale: Forma idiomática em português para o clamor intenso de todo o povo.
- source_word: θάνατος αὐτῶν ἐν ὀφθαλμοῖς αὐτῶν
  choice: a morte deles estava diante dos seus olhos
  rationale: Conserva a repetição referencial e a imagem vívida do perigo mortal iminente.
theological_decisions:
- issue: Sentido de τῷ κλήρῳ σου
  choice: do povo que te coube como porção
  alternative: do teu quinhão / da tua herança
  rationale: A formulação explicita o referente coletivo sem apagar a metáfora de uma porção atribuída a Deus.
- issue: Tradução de κύριε
  choice: ó Senhor
  alternative: ó SENHOR
  rationale: A fonte grega apresenta κύριε; “Senhor” traduz diretamente o título sem pressupor nesta testemunha grega uma representação tipográfica específica do tetragrama.
- issue: Imagem da boca destruída
  choice: preservar literalmente no texto e explicar em nota
  alternative: não silencies os que te louvam
  rationale: A imagem original vincula a preservação da vida à continuidade do louvor. Mantê-la evita resolver silenciosamente sua força poética.
translation_notes:
  register: Português moderno, claro e solene, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. O tratamento de Deus usa a segunda pessoa do singular, tradicional na linguagem bíblica, sem arcaísmos desnecessários.
