base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/025.yaml
  text: And you know that I hated the glory of the lawless[a], and I abhor the bed of the uncircumcised and of every foreigner.
translation:
  language: pt
  text: E sabes que odiei a glória dos sem lei e abomino o leito[a] dos incircuncisos e de todo estrangeiro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “leito conjugal” ou “relação sexual”; no grego, “leito” pode representar, por metonímia, relações conjugais ou sexuais.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμίσησα
  choice: odiei
  rationale: O aoristo ativo indicativo expressa, de modo direto, uma ação passada; “odiei” preserva a força do verbo sem a atenuar.
- source_word: δόξαν
  choice: a glória
  rationale: Mantém o sentido elevado de honra, esplendor ou prestígio, sem restringir indevidamente a amplitude de δόξα.
- source_word: ἀνόμων
  choice: dos que não obedecem à lei
  rationale: Expressa em português natural a relação de ἄνομος com a ausência ou violação da lei, evitando reduzi-lo ao sentido moral mais genérico de “ímpios”.
- source_word: βδελύσσομαι
  choice: abomino
  rationale: O presente conserva a ação atual, e “abomino” comunica a forte repulsa expressa pelo verbo grego em registro solene e compreensível.
- source_word: κοίτην
  choice: o leito
  rationale: Preserva a imagem do grego e deixa implícita sua possível referência metonímica às relações conjugais ou sexuais.
- source_word: ἀπεριτμήτων
  choice: dos incircuncisos
  rationale: Reproduz o adjetivo substantivado no plural sem acrescentar “homens”, substantivo que não está expresso no grego.
- source_word: παντὸς ἀλλοτρίου
  choice: de todo estrangeiro
  rationale: No contexto, em paralelo com “incircuncisos”, ἀλλότριος designa mais naturalmente uma pessoa estrangeira ou alheia, e não uma coisa estrangeira.
theological_decisions:
- issue: Se κοίτην deve ser explicitado como relação sexual ou leito conjugal
  choice: o leito
  alternative: a relação sexual; o leito conjugal
  rationale: A formulação conserva a metáfora e a ambiguidade lexical do grego, sem impor uma especificidade interpretativa maior do que o texto exige.
- issue: Se ἀνόμων deve ser traduzido genericamente como “ímpios”
  choice: dos que não obedecem à lei
  alternative: dos ímpios; dos sem lei
  rationale: A opção mantém perceptível a ligação do termo com a lei e evita converter a expressão em uma categoria genérica de maldade.
translation_notes:
  register: Português atual, digno e acessível, com sintaxe fluente e tratamento implícito por “tu” em “sabes”. O marcador foi colocado junto de “leito”, termo ao qual a nota lexical se refere.
