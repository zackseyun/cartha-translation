base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/029.yaml
  text: O God[a], who are mighty over all, hear the voice of those who have lost hope, and rescue us from the hand of those who do evil, and rescue me from my fear.
translation:
  language: pt
  text: Ó Deus, que és poderoso sobre todos, ouve a voz dos que perderam a esperança, livra-nos da mão dos que praticam o mal e livra-me do meu medo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “daquilo que temo”. O grego pode se referir tanto ao medo da própria Ester quanto ao perigo que ela teme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς
  choice: Ó Deus
  rationale: O nominativo com artigo funciona como vocativo na oração; “Ó Deus” preserva de modo natural o tom de invocação.
- source_word: ὁ ἰσχύων ἐπὶ πάντας
  choice: que és poderoso sobre todos
  rationale: Expressa a força e supremacia de Deus, mantendo o alcance pessoal mais provável de πάντας sem restringi-lo além do necessário.
- source_word: εἰσάκουσον φωνὴν ἀπηλπισμένων
  choice: ouve a voz dos que perderam a esperança
  rationale: “Ouve” corresponde ao imperativo de súplica, e “dos que perderam a esperança” comunica o estado resultante expresso pelo particípio perfeito ἀπηλπισμένων.
- source_word: ῥῦσαι ἡμᾶς
  choice: livra-nos
  rationale: “Livrar” é corrente, digno e apropriado à libertação de um perigo imediato.
- source_word: ἐκ χειρὸς τῶν πονηρευομένων
  choice: das mãos dos que praticam o mal
  rationale: Conserva a metáfora bíblica da mão como poder ou domínio; o plural idiomático em português soa natural. O particípio é vertido sem limitar o mal a uma conspiração específica.
- source_word: ῥῦσαί με
  choice: livra-me
  rationale: A repetição de “livra” preserva o paralelismo retórico do verbo grego repetido.
- source_word: ἐκ τοῦ φόβου μου
  choice: do meu medo
  rationale: É a leitura mais direta da expressão e mantém aberta a possibilidade de referência tanto ao medo interior quanto, por extensão, ao perigo temido.
theological_decisions:
- issue: Se ἐκ τοῦ φόβου μου indica libertação do sentimento interior ou do objeto externo temido
  choice: do meu medo
  alternative: daquilo que temo
  rationale: A formulação principal segue de perto o grego e preserva a tensão emocional; a nota registra a possibilidade de referência ao perigo que provoca o medo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A coordenação final usa ponto e vírgula e “também” para tornar clara a passagem da súplica coletiva à pessoal, sem alterar o paralelismo. O marcador de nota foi colocado imediatamente após a expressão ambígua.
