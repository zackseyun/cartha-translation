  verdict: revise
  source_fidelity: A tradução reproduz adequadamente o aoristo («fiz»), a finalidade negativa, o contraste entre a glória de um homem e a de Deus, a recusa futura e o plural de «essas coisas». «Prostrar-me diante de» é uma boa opção contextual para προσκυνέω, e a nota preserva de modo apropriado a alternativa «adorar». Contudo, «por orgulho» torna mais explicitamente causal o que o grego ἐν ὑπερηφανίᾳ expressa de modo mais aberto como modo/atitude; «com orgulho» conserva melhor essa abertura.
  naturalness: O texto é claro e de registro apropriado. Ainda assim, «ninguém, exceto diante de ti» é menos fluente em português porque a exceção recai sobre a pessoa, não sobre a locução inteira. «Ninguém, a não ser diante de ti» é possível, mas «ninguém, exceto a ti» preserva melhor a construção do grego após «prostrar-me diante de».
  terminology: «Glória», «Deus» e «meu Senhor» são adequados neste contexto de oração. A maiúscula em «Senhor» é justificável pelo referente divino contextual, sem exigir uma interpretação denominacional. A nota lexical para προσκυνέω é pertinente e deve permanecer ancorada na expressão traduzida.
