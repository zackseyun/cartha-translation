  yaml_path: translation/deuterocanon/additions_to_esther/003/007.yaml
  text: But I did this so that I might not place the glory of man above the glory of God; and I will bow down to no one except you[a], my lord, and I will not do these things in pride.
translation:
  language: pt
  text: Mas fiz isso para não colocar a glória de um homem acima da glória de Deus; não me prostrarei diante de ninguém, exceto a ti[a], meu Senhor, nem farei essas coisas com orgulho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não adorarei ninguém além de ti, meu Senhor”. O verbo grego pode significar prostrar-se em homenagem ou adorar, conforme o contexto.'
    reason: alternativa lexical
lexical_decisions:
- source_word: ἐποίησα
  choice: fiz
  rationale: O aoristo de ποιέω apresenta a ação de modo direto; “fiz” é natural e preserva o passado simples.
- source_word: ἵνα μὴ θῶ
  choice: para não colocar
  rationale: Mantém a ideia de pôr ou estabelecer algo acima de outra coisa, em construção corrente no português moderno.
- source_word: δόξαν ἀνθρώπου
  choice: a glória de um homem
  rationale: Preserva δόξα como “glória” nos dois lados do contraste e conserva o singular ἀνθρώπου, sem transformá-lo em uma abstração.
- source_word: ὑπεράνω
  choice: acima de
  rationale: Expressa diretamente a comparação hierárquica entre a glória humana e a glória de Deus.
- source_word: οὐ προσκυνήσω
  choice: não me prostrarei diante de
  rationale: προσκυνέω pode indicar prostração em homenagem ou adoração. A tradução principal conserva o gesto concreto sem eliminar a possível dimensão religiosa, registrada em nota.
- source_word: οὐδένα πλὴν σοῦ
  choice: ninguém, exceto diante de ti
  rationale: Reproduz a negação universal e a exceção, repetindo “diante de” para clareza e naturalidade em português.
- source_word: τοῦ κυρίου μου
  choice: meu Senhor
  rationale: No contexto de oração, a expressão se dirige a Deus; “Senhor” é a forma portuguesa natural, com maiúscula por funcionar como título divino.
- source_word: οὐ ποιήσω αὐτὰ
  choice: nem farei essas coisas
  rationale: Conserva o futuro e o plural de αὐτά, além de ligar naturalmente esta negação à anterior.
- source_word: ἐν ὑπερηφανίᾳ
  choice: por orgulho
  rationale: ὑπερηφανία denota orgulho ou arrogância; “por orgulho” comunica de modo idiomático que essa não é a motivação de sua conduta.
theological_decisions:
- issue: Sentido de προσκυνέω diante de uma autoridade humana
  choice: não me prostrarei diante de
  alternative: não adorarei
  rationale: A cena envolve recusa de homenagem corporal a um ser humano, mas o verbo também pode denotar adoração. A tradução principal mantém o ato concreto, e a nota preserva a alternativa teologicamente relevante.
- issue: Referente e forma de ἀνθρώπου
  choice: de um homem
  alternative: humana
  rationale: O genitivo está no singular e pode aludir à glória de uma pessoa concreta. A formulação escolhida preserva essa forma sem universalizá-la desnecessariamente.
- issue: Tratamento de κύριος na oração
  choice: meu Senhor
  alternative: meu senhor
  rationale: O pronome “ti” e o contexto de oração indicam que o interlocutor é Deus. A maiúscula assinala o título divino sem alterar o conteúdo lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe fluente para leitores brasileiros. A formulação preserva o paralelismo entre a glória do homem e a glória de Deus, bem como a ambiguidade de προσκυνέω por meio de nota.
