  text: And you are Lord of all[a], and there is no one who will oppose you, O Lord.
translation:
  language: pt
  text: E tu és Senhor de todos, e não há ninguém que se oponha a ti, Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: Senhor
  rationale: Em contexto de oração, é um título divino e uma forma direta de tratamento; “Senhor” preserva tanto a autoridade quanto o tom reverente.
- source_word: πάντων
  choice: de todos
  rationale: Mantém a construção genitiva e expressa naturalmente o senhorio universal, sem restringir o referente a coisas impessoais.
- source_word: οὐκ ἔστιν ὃς
  choice: não há ninguém que
  rationale: Preserva a estrutura existencial e a negação abrangente do grego em português atual e claro.
- source_word: ἀντιτάξεται
  choice: se oponha
  rationale: O verbo indica colocar-se contra alguém. Após “não há ninguém que”, o subjuntivo é a construção idiomática em português e comunica adequadamente a inexistência de qualquer opositor.
- source_word: σοι
  choice: a ti
  rationale: Conserva a referência direta à segunda pessoa e complementa naturalmente o verbo pronominal “opor-se”.
- source_word: τῷ κυρίῳ
  choice: Senhor
  rationale: Embora tenha forma dativa com artigo, funciona aqui como tratamento direto, em aposição a “ti”, conforme o uso de oração na Septuaginta.
theological_decisions:
- issue: Repetição de κύριος como título divino e tratamento direto
  choice: Senhor ... Senhor
  alternative: Senhor ... ao Senhor
  rationale: A segunda ocorrência, apesar da forma dativa articulada, é mais coerentemente entendida como tratamento direto em aposição a “ti”. A tradução mantém a repetição e o caráter devocional sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, reverente e amplamente compreensível, com boa legibilidade brasileira. A ordem e a repetição do original foram preservadas onde soam naturais; evitou-se o mais arcaizante “ó Senhor” por não ser necessário para marcar o tratamento direto.
