  text: And now they were not satisfied with the bitterness of our slavery[a], but they have laid their hands upon us,
translation:
  language: pt
  text: E agora, não se contentaram com a amargura da nossa escravidão, mas puseram as mãos contra nós[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “puseram as mãos”. A expressão é elíptica; “contra nós” explicita o sentido hostil indicado pelo contexto, mas o objeto não é expresso nesta frase grega.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ἱκανώθησαν
  choice: não satisfeitos
  rationale: O passivo de ἱκανόω indica que a situação anterior não lhes bastou. A formulação é natural em português e preserva a ideia de que a opressão já existente ainda não era suficiente para eles.
- source_word: ἐν πικρασμῷ
  choice: com a amargura
  rationale: πικρασμός expressa amargura ou tratamento que causa amargura. A tradução direta evita ampliar interpretativamente para “opressão amarga”, enquanto o contexto de escravidão comunica a aflição concreta.
- source_word: δουλείας ἡμῶν
  choice: da nossa escravidão
  rationale: δουλεία designa escravidão ou condição servil. “Nossa escravidão” preserva de modo direto a gravidade da sujeição coletiva, sem atenuá-la.
- source_word: ἔθηκαν τὰς χεῖρας αὐτῶν
  choice: eles estenderam as mãos
  rationale: A expressão grega é elíptica, literalmente próxima de “puseram as mãos”. “Estenderam as mãos” mantém a imagem e sua abertura sem inserir no texto principal um objeto que não aparece neste segmento.
theological_decisions:
- issue: Sentido de δουλεία no contexto de sujeição nacional
  choice: escravidão
  alternative: servidão
  rationale: “Escravidão” conserva a força do termo grego e a gravidade da lamentação, sem especificar uma forma histórica particular de escravização.
- issue: Objeto e sentido da ação de estender as mãos
  choice: preservar a elipse no texto e explicá-la em nota
  alternative: estenderam as mãos contra nós
  rationale: O grego não apresenta objeto explícito neste segmento. Preservar a elipse mantém a ambiguidade e evita resolver antecipadamente se a expressão indica agressão contra os suplicantes ou outra ação hostil desenvolvida na continuação.
translation_notes:
