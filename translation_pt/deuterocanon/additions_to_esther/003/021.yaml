base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/021.yaml
  text: Do not hand over your scepter[a], Lord, to those who do not exist, and do not let them gloat over our downfall; instead, turn their plan against them, and make an example of the one who began this attack against us.
translation:
  language: pt
  text: Não entregues, Senhor, o teu cetro aos que não existem[a], nem permitas que zombem da nossa queda. Pelo contrário, volta contra eles o próprio plano deles e faze do homem que iniciou o ataque contra nós um exemplo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos que não são nada” ou “aos que nada são”. O grego diz literalmente “aos que não são”.
    reason: Registra alternativas lexicais para a expressão grega incomum sem introduzir uma interpretação metafísica nem eliminar sua ambiguidade retórica e teológica.
lexical_decisions:
- source_word: μὴ παραδῷς
  choice: Não entregues
  rationale: Mantém o sentido de entregar ou ceder algo ao poder de outros, em formulação natural para uma oração solene.
- source_word: τὸ σκῆπρόν σου
  choice: o teu cetro
  rationale: Preserva a imagem concreta do cetro como emblema da autoridade real de Deus, sem reduzi-la abstratamente a “poder” ou “governo”.
- source_word: τοῖς μὴ οὖσιν
  choice: aos que não existem
  rationale: Reproduz a formulação grega deliberadamente forte, literalmente “aos que não são”, sem decidir se designa inimigos insignificantes, ídolos ou outra referência polemicamente descrita.
- source_word: μὴ καταγελασάτωσαν
  choice: nem permitas que zombem
  rationale: καταγελάω indica rir de alguém com desprezo ou escárnio. “Zombem” conserva esse sentido de modo claro e digno.
- source_word: ἐν τῇ πτώσει ἡμῶν
  choice: da nossa queda
  rationale: Mantém a imagem de πτῶσις e expressa a ruína coletiva sem explicação excessiva.
- source_word: στρέψον τὴν βουλὴν αὐτῶν ἐπʼ αὐτούς
  choice: volta contra eles o próprio plano deles
  rationale: “Plano” traduz βουλή adequadamente no contexto de uma conspiração, e “o próprio” torna clara em português a reversão do plano contra seus autores.
- source_word: τὸν δὲ ἀρξάμενον ἐφʼ ἡμᾶς
  choice: o homem que iniciou o ataque contra nós
  rationale: O particípio substantivado é masculino singular e significa aquele que começou; “o ataque” explicita com moderação a ação hostil implícita em ἐφʼ ἡμᾶς.
- source_word: παραδειγμάτισον
  choice: faze ... um exemplo
  rationale: Preserva a ideia de expor alguém publicamente como exemplo punitivo, sem especificar além do grego a forma da punição.
theological_decisions:
- issue: Sentido de τοῖς μὴ οὖσιν
  choice: aos que não existem
  alternative: aos que nada são; a seres sem realidade
  rationale: A expressão grega é incomumente absoluta e pode ter força depreciativa ou polêmico-teológica. A tradução principal conserva essa tensão, enquanto a nota registra alternativas sem identificar dogmaticamente o referente.
- issue: Cetro divino
  choice: Preservar a imagem “teu cetro”
  alternative: teu poder; teu governo
  rationale: O texto apresenta a autoridade régia do Senhor por meio de um símbolo concreto. Mantê-lo evita apagar a metáfora e não exige definir de que modo essa autoridade poderia ser “entregue” aos inimigos.
translation_notes:
  register: Português moderno, claro e solene, com formas verbais dirigidas a Deus no singular (“entregues”, “permitas”, “volta”, “faze”). A sintaxe acompanha de perto a progressão da oração grega, mas evita construções artificiais. O marcador [a] aparece imediatamente após a expressão anotada.
