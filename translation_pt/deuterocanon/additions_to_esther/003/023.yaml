  text: Put fitting words in my mouth before the lion, and turn his heart to hatred against the one who is warring against us, to his destruction and that of those who are of one mind with him.
translation:
  language: pt
  text: 'Põe em minha boca palavras apropriadas diante do leão[a] e muda o coração dele, levando-o a odiar aquele que guerreia contra nós, para a destruição daquele[b] e dos que compartilham seu propósito.


    [a] “O leão” é uma metáfora para o rei na oração de Ester; o grego preserva essa imagem em vez de nomeá-lo diretamente.


    [b] Ou “para o fim daquele” ou “para a ruína daquele”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O leão” é uma metáfora para o rei na oração de Ester; o grego preserva essa imagem em vez de nomeá-lo diretamente.
    reason: cultural_note
  - marker: b
    text: Ou “para o fim daquele” ou “para a ruína daquele”.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὸς λόγον εὔρυθμον εἰς τὸ στόμα μου
  choice: Põe em minha boca palavras apropriadas
  rationale: O imperativo δὸς significa literalmente “dá”, mas “põe em minha boca” é natural em português neste contexto. λόγον εὔρυθμον pede uma fala apropriada, bem formulada e adequada à ocasião; o plural idiomático “palavras apropriadas” comunica esse sentido.
- source_word: ἐνώπιον τοῦ λέοντος
  choice: diante do leão
  rationale: Mantém a metáfora explícita do grego, sem substituí-la interpretativamente por “rei”.
- source_word: μετάθες τὴν καρδίαν αὐτοῦ εἰς μῖσος
  choice: muda o coração dele, levando-o a odiar
  rationale: μετάθες solicita uma alteração da disposição interior, e εἰς μῖσος indica o resultado ou direcionamento para o ódio. A formulação portuguesa evita a expressão pouco natural “muda o coração para o ódio”.
- source_word: τοῦ πολεμοῦντος ἡμᾶς
  choice: aquele que guerreia contra nós
  rationale: Preserva o particípio ativo singular e sua força verbal, provavelmente referente ao principal adversário, sem generalizá-lo como “inimigos”.
- source_word: εἰς συντέλειαν αὐτοῦ
  choice: para a destruição deste
  rationale: No contexto, συντέλεια designa um fim consumado e destrutivo. “Deste” reduz a possível ambiguidade pronominal em português, apontando para aquele que guerreia contra o povo.
- source_word: τῶν ὁμονοούντων αὐτῷ
  choice: dos que estão de acordo com ele
  rationale: Expressa os que compartilham a intenção ou propósito do adversário, sem comprimir interpretativamente o termo em “aliados”.
theological_decisions:
- issue: Identificação do “leão”
  choice: Conservar “leão” no texto principal
  alternative: Traduzir interpretativamente como “rei”
  rationale: O original apresenta a imagem metafórica na oração de Ester. Preservá-la mantém a linguagem literária e a tensão da cena.
- issue: Número e referência de τοῦ πολεμοῦντος ἡμᾶς
  choice: 'Manter o referente no singular: “aquele que guerreia contra nós”'
  alternative: “nosso inimigo” ou “nossos inimigos”
  rationale: O particípio grego é singular. A tradução evita ampliar o referente, enquanto a oração seguinte inclui os que concordam com ele.
- issue: Força de εἰς συντέλειαν
  choice: “para a destruição”
  alternative: “para o fim” ou “para a ruína”
  rationale: A formulação conserva a direção para o resultado sem decidir rigidamente entre propósito e consequência; a nota registra a amplitude lexical.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário internacional. A metáfora original foi mantida; construções excessivamente literais e pouco naturais foram evitadas.
