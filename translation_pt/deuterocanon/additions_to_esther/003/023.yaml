  to: 'Põe em minha boca palavras apropriadas diante do leão[a] e muda o coração dele, levando-o a odiar aquele que guerreia contra nós, para a destruição daquele[b] e dos que compartilham seu propósito.


    [a] “O leão” é uma metáfora para o rei na oração de Ester; o grego preserva essa imagem em vez de nomeá-lo diretamente.


    [b] Ou “para o fim daquele” ou “para a ruína daquele”.'
