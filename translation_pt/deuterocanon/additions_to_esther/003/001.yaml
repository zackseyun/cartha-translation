lexical_decisions:
- source_word: ἐδεήθη
  choice: suplicou
  rationale: O verbo expressa um pedido intenso e humilde; “suplicou” preserva essa força e soa natural e digno em português.
- source_word: Κυρίου
  choice: ao Senhor
  rationale: Depois de “suplicou”, a regência idiomática em português pede “ao Senhor”; “Senhor” mantém o valor tradicional e contextual de κύριος.
- source_word: μνημονεύων
  choice: lembrando-se
  rationale: O particípio indica uma ação concomitante à súplica. “Lembrando-se” preserva a ambiguidade entre recordação interior e evocação verbal.
- source_word: πάντα τὰ ἔργα
  choice: todas as obras
  rationale: A expressão reproduz o alcance abrangente de πάντα e mantém em “obras” o sentido amplo de ἔργα, adequado à linguagem bíblica corrente.
- source_word: Κυρίου
  choice: do Senhor
  rationale: A repetição de “Senhor” corresponde à repetição grega e evita substituí-la por pronome ou paráfrase.
theological_decisions:
- issue: Tradução de κύριος na linguagem de oração do grego deuterocanônico
  choice: Senhor
  alternative: SENHOR; Soberano
  rationale: “Senhor” traduz diretamente κύριος sem impor nesta cláusula a convenção tipográfica ligada ao nome divino; “Soberano” estreitaria indevidamente o sentido.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da oração e a repetição de “Senhor” acompanham de perto o grego; a vírgula final foi preservada porque o segmento continua no contexto.
