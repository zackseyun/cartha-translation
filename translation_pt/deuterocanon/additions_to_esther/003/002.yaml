  text: And he said[a], “Lord, Lord, King over all powers, because everything is in your authority, and there is no one who can oppose you when you desire to save Israel.”
translation:
  language: pt
  text: 'E ele disse: “Senhor, Senhor, Rei sobre todos os poderes[a], pois tudo está sob a tua autoridade, e não há quem possa se opor a ti quando queres salvar Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Rei de todos os domínios”. A expressão grega pode abranger toda forma de poder ou domínio, não apenas reinos políticos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Senhor
  rationale: Vocativo de κύριος empregado como título divino na oração; “Senhor” é a forma portuguesa natural e tradicional, sem acréscimo interpretativo.
- source_word: βασιλεῦ πάντων κρατῶν
  choice: Rei sobre todos os poderes
  rationale: κρατῶν pode abranger poderes, forças ou domínios. A formulação preserva o alcance amplo da soberania expressa no grego, sem restringi-la a reinos políticos.
- source_word: ἐν ἐξουσίᾳ σου
  choice: sob a tua autoridade
  rationale: ἐξουσία pode indicar autoridade ou poder. “Sob a tua autoridade” comunica de modo idiomático em português que tudo se encontra sujeito à autoridade divina.
- source_word: τὸ πᾶν
  choice: tudo
  rationale: Expressa naturalmente em português a totalidade indicada pelo neutro substantivado grego.
- source_word: ὁ ἀντιδρῶσων
  choice: quem possa se opor
  rationale: O particípio futuro substantivado designa aquele que se oporia ou conseguiria resistir; “possa se opor” preserva aqui a ideia de oposição eficaz.
- source_word: ἐν τῷ θέλειν σε
  choice: quando queres
  rationale: A construção com infinitivo articular tem valor temporal ou circunstancial. “Quando queres” é direta e mantém a referência à vontade divina.
- source_word: σῶσαι τὸν Ἰσραήλ
  choice: salvar Israel
  rationale: σῴζω significa salvar ou livrar; “salvar” é a correspondência direta e adequada ao registro da oração.
theological_decisions:
- issue: Repetição do vocativo Κύριε, κύριε
  choice: Senhor, Senhor
  alternative: Ó Senhor, Senhor
  rationale: A repetição presente no grego é mantida por transmitir urgência e reverência, sem acrescentar interjeição ou possessivo.
- issue: Alcance de κρατῶν
  choice: todos os poderes
  alternative: todos os domínios
  rationale: A expressão parece afirmar soberania abrangente, e não apenas domínio sobre reinos terrenos. “Poderes” conserva essa amplitude; a alternativa é registrada em nota.
- issue: Nuance de ἐξουσία
  choice: autoridade
  alternative: poder
  rationale: “Autoridade” preserva a nuance de soberania legítima no contexto régio, sem reduzir a expressão à mera capacidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva a repetição enfática do vocativo e emprega segunda pessoa singular na oração. A colocação do marcador junto a “poderes” identifica diretamente a expressão explicada pela nota.
