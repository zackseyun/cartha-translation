base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/026.yaml
  text: You know my distress[a], that I loathe the sign of my pride, which is upon my head in the days of my appearance; I loathe it like a menstrual cloth[e][d][c][b], and I do not wear it in the days of my rest.
translation:
  language: pt
  text: Tu conheces a minha aflição[a], que detesto o sinal da minha soberba[b], que está sobre a minha cabeça nos dias em que apareço[c]. Detesto-o como um trapo de menstruação[d] e não o uso nos meus dias de quietude[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a minha necessidade” ou “a situação que me constrange”.
    reason: lexical_alternative
  - marker: b
    text: O “sinal da minha soberba” provavelmente é um adorno ou emblema da posição real de Ester usado sobre a cabeça; o grego não identifica o objeto com precisão.
    reason: cultural_note
  - marker: c
    text: Mais literalmente, “nos dias da minha aparição”, isto é, quando Ester aparecia diante de outros, provavelmente em público ou na corte.
    reason: lexical_alternative
  - marker: d
    text: O grego diz literalmente “como um trapo de menstruação”, uma imagem deliberadamente explícita de repulsa.
    reason: lexical_alternative
  - marker: e
    text: Ou “nos meus dias de repouso”, “de recolhimento” ou “de privacidade”, em contraste com suas aparições.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγκην
  choice: aflição
  rationale: Neste contexto de oração, o substantivo indica a situação premente e angustiosa de Ester. “Aflição” comunica isso naturalmente, sem excluir por completo a ideia de necessidade ou constrangimento.
- source_word: βδελύσσομαι
  choice: detesto
  rationale: O verbo expressa forte repulsa. “Detesto” é corrente, enfático e adequado às duas ocorrências.
- source_word: σημεῖον τῆς ὑπερηφανίας μου
  choice: o sinal da minha soberba
  rationale: Mantém a formulação ampla do grego e sua avaliação negativa, sem identificar indevidamente o objeto como coroa ou diadema.
- source_word: ὃ ἐστιν ἐπὶ τῆς κεφαλῆς μου
  choice: que levo sobre a cabeça
  rationale: A formulação portuguesa torna clara a relação com um adorno usado na cabeça, preservando o conteúdo sem especificar o objeto.
- source_word: ἐν ἡμέραις ὀπτασίας μου
  choice: nos dias em que me apresento em público
  rationale: No contexto, ὀπτασία se refere às ocasiões em que Ester é vista ou comparece publicamente. A expressão escolhida é natural e explicita apenas a implicação contextual imediata.
- source_word: ῥάκος καταμηνίων
  choice: um trapo de menstruação
  rationale: Preserva tanto o sentido concreto de ῥάκος, “trapo”, quanto a referência explícita à menstruação, sem suavizar a imagem deliberadamente repulsiva.
- source_word: φορῶ
  choice: uso
  rationale: “Usar” é o equivalente natural em português para portar um adorno ou emblema, especialmente quando o objeto exato não é nomeado.
- source_word: ἐν ἡμέραις ἡσυχίας μου
  choice: nos meus dias de repouso
  rationale: “Repouso” conserva a noção de quietude e o contraste com as ocasiões públicas, embora o termo grego também possa sugerir privacidade ou recolhimento.
theological_decisions:
- issue: Natureza do objeto rejeitado por Ester
  choice: Manter a expressão geral “sinal da minha soberba”, com nota explicativa sobre um provável adorno ou emblema real.
  alternative: Traduzir diretamente como “coroa”, “diadema” ou “adorno de cabeça”.
  rationale: O grego não dá nome ao objeto. A tradução evita transformar uma inferência contextual em identificação explícita.
- issue: Força da comparação ligada à impureza menstrual
  choice: Conservar no texto principal a referência explícita a um “trapo de menstruação”.
  alternative: Suavizar para “pano impuro” ou “trapo imundo”.
  rationale: A imagem menstrual é expressa diretamente no grego e comunica a intensidade da repulsa de Ester; omiti-la reduziria a força do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção foi levemente reordenada para fluidez, mas a intensidade da repulsa, a imagem menstrual e a falta de especificação do adorno foram preservadas.
