base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/015.yaml
  text: I had heard from my birth[a], in the tribe of my ancestral family, that you, Lord, took Israel from among all the nations, and our fathers from among all their ancestors, as an everlasting inheritance, and you did for them what you spoke.
translation:
  language: pt
  text: Eu tinha ouvido desde o meu nascimento, na tribo de minha família ancestral, que tu, Senhor, tomaste Israel dentre todas as nações e nossos pais dentre todos os antepassados deles como herança eterna, e fizeste por eles tudo o que disseste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cumpriste para eles tudo o que prometeste”. Mais literalmente, o grego diz: “fizeste por eles tudo o que disseste”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ ἤκουον ἐκ γενετῆς μου
  choice: Eu ouvia desde o meu nascimento
  rationale: O imperfeito apresenta uma tradição recebida e continuamente conhecida desde o início da vida; esta formulação preserva o aspecto verbal sem sugerir um único ato de ouvir.
- source_word: ἐν φυλῇ πατριάς μου
  choice: na tribo da minha família ancestral
  rationale: Distingue φυλή, “tribo”, de πατριά, “família” ou linhagem ancestral, mantendo a estrutura de parentesco do grego.
- source_word: σύ, Κύριε
  choice: tu, Senhor
  rationale: Preserva o tratamento direto e a força vocativa; “Senhor” é a equivalência tradicional e digna para Κύριε.
- source_word: ἔλαβες τὸν Ἰσραὴλ ἐκ πάντων τῶν ἐθνῶν
  choice: tomaste Israel dentre todas as nações
  rationale: “Tomaste” permanece próximo de λαμβάνω, enquanto “dentre” expressa seleção a partir de um conjunto sem explicitar além do texto a ideia de eleição.
- source_word: τοὺς πατέρας ἡμῶν
  choice: nossos pais
  rationale: Mantém o termo masculino de parentesco empregado explicitamente no grego, sem neutralizá-lo como “antepassados”.
- source_word: ἐκ πάντων τῶν προγόνων αὐτῶν
  choice: dentre todos os antepassados deles
  rationale: πρόγονοι designa os antepassados, e “deles” conserva a referência sintática mais imediata aos pais.
- source_word: εἰς κληρονομίαν αἰώνιον
  choice: como herança eterna
  rationale: Preserva a linguagem pactual de κληρονομία e a duração expressa por αἰώνιον, sem definir doutrinariamente a relação de posse.
- source_word: ἐποίησας αὐτοῖς ὅσα ἐλάλησας
  choice: fizeste por eles tudo o que disseste
  rationale: Mantém a relação literal entre fazer e dizer, mas usa uma construção natural em português; ὅσα admite aqui o sentido abrangente de “tudo o que”.
theological_decisions:
- issue: Linguagem pactual em εἰς κληρονομίαν αἰώνιον
  choice: como herança eterna
  alternative: como possessão perpétua
  rationale: “Herança eterna” conserva a ressonância pactual e a possível tensão sobre quem constitui a herança, sem impor uma definição teológica posterior.
- issue: Cumprimento da palavra divina em ἐποίησας αὐτοῖς ὅσα ἐλάλησας
  choice: fizeste por eles tudo o que disseste
  alternative: cumpriste para eles tudo o que prometeste
  rationale: A opção principal não transforma explicitamente “disseste” em “prometeste”, preservando a formulação e a amplitude do grego; a nota registra a leitura idiomática possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “tu” por coerência com o verbo grego de segunda pessoa e evita formas arcaicas como “ó Senhor”. Mantém a repetição conceitual entre “pais” e “antepassados”, presente no original.
