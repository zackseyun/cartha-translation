  text: And like a noble athlete[a], though being beaten, the old man was defeating those who were torturing him.
translation:
  language: pt
  text: E, como um nobre atleta[a], mesmo sendo golpeado, o ancião vencia os que o torturavam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “atleta valente”.'
    reason: Alternativa lexical para γενναῖος, que pode destacar mais diretamente a coragem.
lexical_decisions:
- source_word: καθάπερ
  choice: como
  rationale: Introduz diretamente a comparação e preserva de modo natural a imagem do texto grego.
- source_word: γενναῖος
  choice: nobre
  rationale: Expressa tanto coragem quanto elevação moral e mantém o tom retórico; “valente” também é possível.
- source_word: ἀθλητής
  choice: atleta
  rationale: Preserva sem expansão interpretativa a metáfora explícita da competição atlética.
- source_word: τυπτόμενος
  choice: mesmo sendo golpeado
  rationale: Representa a ação passiva e contínua do particípio presente, tornando explícito o valor concessivo sugerido pelo contraste com a vitória.
- source_word: ἐνίκα
  choice: vencia
  rationale: O imperfeito indica uma vitória em curso durante o suplício e mantém a linguagem da competição.
- source_word: τοὺς βασανίζοντας
  choice: os que o torturavam
  rationale: O particípio substantivado designa aqueles que lhe infligiam tortura; o pronome “o” é explicitado pelo contexto.
- source_word: ὁ γέρων
  choice: o ancião
  rationale: Designa dignamente o homem de idade avançada e conserva o contraste retórico entre sua velhice e a imagem do atleta vitorioso.
theological_decisions:
- issue: Representação metafórica do martírio como vitória atlética
  choice: Manter diretamente a metáfora em “nobre atleta” e “vencia”
  alternative: Explicitar o sentido como “suportava heroicamente e triunfava sobre seus torturadores”
  rationale: O texto apresenta a resistência do ancião como vitória numa competição. Preservar a metáfora mantém a ênfase moral e retórica sem impor uma explicação doutrinária.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Ancião” é usado em sentido etário, não como título ou cargo. A ordem foi ajustada levemente para soar natural sem perder o contraste e a metáfora do grego.
