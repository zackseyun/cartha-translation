  text: And first they stripped the old man[a], adorned with the dignity of godliness.
translation:
  language: pt
  text: E primeiro despiram o homem idoso, adornado com a dignidade própria da devoção a Deus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “piedade”. A expressão grega também pode ser traduzida como “a nobre compostura associada à devoção”.'
    reason: Preserva alternativas legítimas para εὐσέβεια e εὐσχημοσύνη, cuja combinação grega é compacta e admite mais de uma formulação.
lexical_decisions:
- source_word: καὶ πρῶτον μὲν
  choice: E, primeiro
  rationale: Preserva tanto a ligação narrativa de καί como o início de uma sequência indicado por πρῶτον μέν, em português natural.
- source_word: περιέδυσαν
  choice: despiram
  rationale: Expressa diretamente o ato de tirar as roupas de alguém e mantém o caráter humilhante da ação.
- source_word: τὸν γεραιὸν
  choice: o homem idoso
  rationale: Traduz a referência à idade com respeito e clareza, sem sugerir necessariamente o cargo religioso que “ancião” pode indicar.
- source_word: ἐκκεκοσμημένον
  choice: adornado
  rationale: Mantém a metáfora do grego, segundo a qual a dignidade espiritual ornamentava o homem, em contraste expressivo com o ato de despi-lo.
- source_word: τὴν περὶ τὴν εὐσέβειαν εὐσχημοσύνην
  choice: com a dignidade própria da devoção a Deus
  rationale: εὐσχημοσύνη comunica dignidade, decoro ou nobre compostura; περὶ τὴν εὐσέβειαν relaciona essa qualidade à reverência e fidelidade para com Deus. A formulação é clara sem eliminar a densidade metafórica.
- source_word: εὐσέβειαν
  choice: devoção a Deus
  rationale: Torna explícita a orientação religiosa de εὐσέβεια e comunica de modo atual a ideia de reverência fiel; “piedade” continua sendo uma alternativa legítima.
theological_decisions:
- issue: Tradução da linguagem de εὐσέβεια em 4 Macabeus
  choice: devoção a Deus
  alternative: piedade
  rationale: A expressão designa uma virtude religiosa central no livro, ligada à reverência e fidelidade a Deus. “Devoção a Deus” é clara ao leitor moderno, enquanto a nota preserva a alternativa tradicional e a amplitude lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Homem idoso” evita a possível leitura institucional de “ancião”; “adornado” conserva a imagem elevada e o contraste deliberado com “despiram”.
