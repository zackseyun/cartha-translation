base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/021.yaml
  text: and shall we be despised by the tyrant as unmanly[a], yet not defend our divine law even to death?
translation:
  language: pt
  text: E seremos desprezados pelo tirano como homens sem coragem[a] e não defenderemos a nossa lei divina até a morte?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como covardes”. O termo grego é literalmente masculino e descreve homens considerados sem coragem ou sem bravura viril.
    reason: Preservar a alternativa lexical e esclarecer a retórica de gênero do original.
lexical_decisions:
- source_word: καταφρονηθῶμεν
  choice: seremos desprezados
  rationale: Preserva a voz passiva e a ideia de ser tratado com desdém, além de manter o tom de pergunta retórica deliberativa.
- source_word: τοῦ τυράννου
  choice: pelo tirano
  rationale: “Tirano” conserva a avaliação moral negativa do grego, em vez de usar um termo neutro como “governante” ou “rei”.
- source_word: ἄνανδροι
  choice: como homens sem coragem
  rationale: Expressa de modo natural em português tanto a acusação de covardia quanto o caráter masculino do insulto grego, literalmente associado à falta de virilidade.
- source_word: τὸν θεῖον ἡμῶν νόμον
  choice: a nossa lei divina
  rationale: Mantém a ordem conceitual do grego e identifica a lei como divina, isto é, pertencente a Deus ou proveniente dele.
- source_word: μέχρι θανάτου
  choice: até a morte
  rationale: 'Preserva de forma concisa o limite extremo da defesa: continuar até a própria morte.'
- source_word: προασπίσαιμεν
  choice: defenderemos
  rationale: O verbo evoca originalmente proteger com um escudo e, neste contexto, significa tomar a defesa da lei.
theological_decisions:
- issue: A acusação masculina contida em ἄνανδροι
  choice: como homens sem coragem
  alternative: como covardes; como homens sem virilidade
  rationale: A formulação escolhida preserva a dimensão masculina da retórica sem recorrer à expressão potencialmente ambígua ou pouco natural “sem virilidade”. A alternativa “covardes” comunica bem o sentido, mas neutraliza essa característica do original.
- issue: Alcance de μέχρι θανάτου
  choice: até a morte
  alternative: mesmo que isso nos custe a vida; até o ponto de morrer
  rationale: A tradução mais concisa preserva a força e também a abertura da expressão grega, sem explicitar além do texto se a morte é resultado certo ou limite da disposição de resistir.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. A estrutura interrogativa conserva o desafio retórico do grego; “homens sem coragem” evita tanto a neutralização completa de ἄνανδροι quanto a possível conotação sexual moderna de “sem virilidade”.
