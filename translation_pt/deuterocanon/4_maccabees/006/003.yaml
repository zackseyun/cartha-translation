lexical_decisions:
- source_word: ἔπειτα
  choice: Depois
  rationale: Advérbio sequencial que marca a etapa seguinte da tortura; «Depois» é natural e preserva a progressão narrativa.
- source_word: περιαγκωνίσαντες
  choice: tendo-lhe prendido os braços para trás
  rationale: O particípio aoristo de um verbo raro, formado com ἀγκών («cotovelo/braço»), parece indicar que os braços ou cotovelos foram imobilizados ou torcidos. A formulação comunica a ação física sem afirmar de modo categórico um método técnico de amarração.
- source_word: ἑκατέρωθεν
  choice: pelos dois lados
  rationale: O advérbio indica uma ação realizada de ambos os lados; a expressão preserva essa disposição bilateral.
- source_word: μάστιξιν
  choice: com chicotes
  rationale: Dativo instrumental plural de μάστιξ. «Chicotes» é claro, atual e compreensível, sem o tom arcaizante de alternativas como «açoites» enquanto substantivo instrumental.
- source_word: κατήκιζον
  choice: torturavam-no
  rationale: O imperfeito retrata maus-tratos severos em andamento. No contexto dos chicotes, «torturavam-no» comunica tanto a gravidade quanto o aspecto durativo.
