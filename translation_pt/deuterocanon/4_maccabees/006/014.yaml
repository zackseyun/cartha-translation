lexical_decisions:
- source_word: Τί
  choice: Por que
  rationale: Neste contexto de repreensão interrogativa, τί pergunta pela razão ou pelo motivo, e não por um objeto.
- source_word: τοῖς κακοῖς τούτοις
  choice: com estes males
  rationale: O dativo pode indicar meio ou circunstância. “Males” mantém a amplitude de κακά e evita especificar “torturas”, termo não explícito na oração.
- source_word: σεαυτὸν
  choice: você ... se
  rationale: Expressa naturalmente em português o objeto reflexivo de ἀπόλλυες.
- source_word: ἀλογίστως
  choice: de modo irracional
  rationale: Preserva a ideia de agir sem razão ou ponderação e a ligação temática da obra entre razão e paixões.
- source_word: ἀπόλλυες
  choice: está se destruindo
  rationale: O presente expressa uma ação em curso; a construção reflexiva atribui ao próprio Eleazar a destruição alegada pelo interlocutor.
- source_word: Ἐλεάζαρ
  choice: Eleazar
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Sentido de κακοῖς no contexto do martírio de Eleazar
  choice: males
  alternative: sofrimentos; castigos; torturas
  rationale: “Males” conserva a abrangência do substantivo grego e não introduz no texto principal uma especificação contextual maior do que a fonte permite.
- issue: Valor do dativo τοῖς κακοῖς τούτοις
  choice: com estes males
  alternative: por meio destes males; nestes sofrimentos
  rationale: A formulação mantém certa abertura entre meio e circunstância, sem decidir além do necessário como os males se relacionam com a destruição alegada.
translation_notes:
  register: Português atual, digno e claro, com legibilidade brasileira. A expressão “de modo irracional” é um pouco mais formal, mas preserva a linguagem temática da obra e continua acessível.
