  text: Why are you irrationally destroying yourself with these evils[a], Eleazar?
translation:
  language: pt
  text: Por que você está se destruindo irracionalmente com estes males[a], Eleazar?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio destes males”; o dativo pode indicar meio ou circunstância. No contexto, refere-se aos sofrimentos infligidos a Eleazar.
