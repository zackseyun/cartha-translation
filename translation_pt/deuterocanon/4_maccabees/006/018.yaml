  yaml_path: translation/deuterocanon/4_maccabees/006/018.yaml
  text: For it would indeed be irrational, if, after living our whole life up to old age in truth and lawfully preserving the reputation founded on it, we should now change course,
translation:
  language: pt
  text: Pois seria realmente contrário à razão se, depois de vivermos toda a vida até a velhice de acordo com a verdade e de preservarmos, em conformidade com a lei, a reputação fundada nelas[a], agora mudássemos de rumo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a reputação que elas nos deram”. O referente exato do pronome grego não está explícito neste versículo.'
    reason: Preserva a ambiguidade sintática de ἐπ’ αὐτῶν e registra uma alternativa plausível sem identificar indevidamente o antecedente.
lexical_decisions:
- source_word: ἄλογιστον
  choice: contrário à razão
  rationale: Expressa a ideia de algo irracional ou insensato e preserva a ênfase do livro no domínio da razão, em linguagem portuguesa clara e digna.
- source_word: πρὸς ἀλήθειαν
  choice: de acordo com a verdade
  rationale: Traduz naturalmente a orientação normativa indicada por πρός, sem reduzir a expressão a mera sinceridade subjetiva.
- source_word: τὸν μέχρι γήρως βίον
  choice: durante toda a vida, até a velhice
  rationale: Torna explícita a extensão da vida vivida até a idade avançada, conforme o sentido da construção grega.
- source_word: νομίμως φυλάσσοντες
  choice: preservarmos legitimamente
  rationale: Mantém tanto a ideia de guardar ou conservar quanto o caráter conforme à lei expresso por νομίμως.
- source_word: μεταβαλοίμεθα
  choice: mudássemos de rumo
  rationale: Comunica uma mudança de posição ou conduta no contexto, sem especificar indevidamente a natureza exata dessa mudança.
theological_decisions:
- issue: Referente de αὐτῶν em τὴν ἐπ’ αὐτῶν δόξαν
  choice: fundada nessas coisas
  alternative: fundada nisso; reputação que elas nos deram
  rationale: O pronome grego está no plural e seu referente exato não é plenamente explícito no versículo. A tradução preserva essa indeterminação em vez de identificar dogmaticamente um antecedente.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A frase permanece aberta com vírgula, acompanhando a continuidade sintática do texto-fonte para o versículo seguinte.
