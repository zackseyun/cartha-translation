  yaml_path: translation/deuterocanon/4_maccabees/006/033.yaml
  text: But now[a], since reason has conquered the passions[b], we rightly assign to it the authority of leadership.
translation:
  language: pt
  text: Mas agora, visto que a razão venceu as paixões[a], atribuímos-lhe devidamente a autoridade para governar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
