lexical_decisions:
- source_word: νυνὶ δέ
  choice: Mas agora
  rationale: Marca uma transição com leve contraste e preserva a virada argumentativa.
- source_word: λογισμοῦ
  choice: a razão
  rationale: No contexto de 4 Macabeus, designa a faculdade de juízo racional e moral que governa os impulsos; a formulação é concisa e mantém o termo central da obra.
- source_word: τὰ πάθη
  choice: as paixões
  rationale: Refere-se aos impulsos e afetos que devem ser governados pela razão, não primordialmente a sofrimentos.
- source_word: νικήσαντος
  choice: venceu
  rationale: Expressa de modo natural em português a vitória apresentada pelo particípio aoristo, mantendo seu aspecto consumado no contexto.
- source_word: αὐτῷ
  choice: lhe
  rationale: Retoma 'a razão' sem acrescentar personificação além da retórica do grego.
- source_word: προσηκόντως
  choice: com toda a justiça
  rationale: Comunica que a atribuição é apropriada, devida e correta; em português corrente, evita a possível ambiguidade de 'justamente' como marcador temporal.
- source_word: τὴν τῆς ἡγεμονίας ... ἐξουσίαν
  choice: a autoridade para governar
  rationale: Preserva tanto a noção de autoridade ou direito em ἐξουσία quanto a de governo ou direção em ἡγεμονία, com sintaxe portuguesa natural.
- source_word: προσνέμομεν
  choice: atribuímos
  rationale: Traduz a ideia de conferir ou reconhecer algo como pertencente propriamente à razão.
theological_decisions:
- issue: Enquadramento antropológico e filosófico de λογισμός e πάθη
  choice: Traduzir λογισμός por 'razão' e πάθη por 'paixões'.
  alternative: Traduzir λογισμός por 'juízo racional' e πάθη por 'emoções' ou 'sofrimentos'.
  rationale: 'A oposição expressa a tese central de 4 Macabeus: a razão disciplinada prevalece sobre os impulsos. A tradução conserva essa moldura conceitual sem importar categorias confessionais posteriores.'
- issue: Natureza da autoridade reconhecida à razão
  choice: Manter a formulação retórica 'atribuímos-lhe ... a autoridade para governar'.
  alternative: Explicitar como 'reconhecemos que a razão deve governar'.
  rationale: A alternativa explicativa reduziria a imagem jurídica e política formada por προσνέμομεν, ἐξουσία e ἡγεμονία. A redação escolhida preserva a tensão e a força da afirmação grega.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. 'Com toda a justiça' evita a ambiguidade temporal de 'justamente'; 'autoridade para governar' torna natural a construção grega sem perder seus dois elementos semânticos.
