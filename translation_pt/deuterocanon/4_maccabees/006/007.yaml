  text: And falling to the ground because his body could not bear the pains[a], he kept his reason upright and unbending.
translation:
  language: pt
  text: E, caindo ao chão porque seu corpo não conseguia suportar as dores, ele mantinha a razão[a] reta e inabalável.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “juízo racional”. O termo grego tem aqui o sentido filosófico de julgamento moral guiado pela razão.
    reason: lexical_alternative
lexical_decisions:
- source_word: πίπτων
  choice: caindo
  rationale: O particípio presente indica uma ação em curso e simultânea à ação principal, preservada de modo direto pelo gerúndio em português.
- source_word: εἰς τὸ ἔδαφος
  choice: ao chão
  rationale: Expressa naturalmente a superfície sobre a qual ele cai no contexto da tortura.
- source_word: ἀπὸ τοῦ μὴ φέρειν
  choice: porque ... não conseguia suportar
  rationale: A construção indica a causa da queda; a oração causal é clara e idiomática em português.
- source_word: τὸ σῶμα
  choice: seu corpo
  rationale: Embora o grego empregue o artigo, o possessivo explicita de modo natural em português que se trata do corpo do próprio homem.
- source_word: τὰς ἀλγηδόνας
  choice: as dores
  rationale: Designa dores físicas intensas; esta opção é direta, digna e evita intensificar além do que o substantivo exige.
- source_word: ὀρθὸν εἶχεν
  choice: mantinha ... reta
  rationale: Preserva a imagem de algo conservado em posição ereta e a aplica à firmeza moral e intelectual.
- source_word: ἀκλινῆ
  choice: inabalável
  rationale: Comunica que a razão não cede nem se desvia sob a pressão, sem a possível conotação negativa que 'inflexível' pode ter em português.
- source_word: τὸν λογισμόν
  choice: a razão
  rationale: Em 4 Macabeus, o termo designa a faculdade racional e o juízo moral que governa as paixões; 'razão' preserva de modo conciso seu peso filosófico.
theological_decisions:
- issue: Sentido filosoficamente carregado de λογισμός
  choice: razão
  alternative: juízo racional
  rationale: A obra ressalta o domínio da razão piedosa sobre as paixões e o sofrimento corporal. 'Razão' mantém essa força conceitual sem ampliar indevidamente o texto; a nota registra a alternativa mais explícita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A redação conserva o contraste imagético entre o corpo que cai e a razão que permanece reta e inabalável.
