translation:
  language: pt
  text: “Obedeça às ordens do rei!”, gritava um arauto de outro lado[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “de outra parte, um arauto gritava”. O grego ressalta que o clamor vinha de outra direção; no contexto, isso pode sugerir que era um arauto diferente.'
    reason: alternativa lexical e preservação da construção espacial do grego
lexical_decisions:
- source_word: Πείσθητι
  choice: Obedeça
  rationale: Embora a forma passiva de πείθω possa ser entendida literalmente como “deixe-se persuadir”, neste contexto ela exorta à submissão às determinações reais; “obedeça” comunica naturalmente essa força.
- source_word: ταῖς τοῦ βασιλέως ἐντολαῖς
  choice: às ordens do rei
  rationale: ἐντολαί designa determinações dotadas de autoridade. “Ordens” expressa com clareza o caráter coercitivo das determinações reais.
- source_word: ἑτέρωθεν
  choice: outro
  rationale: O advérbio significa literalmente “de outro lado” ou “de outra parte”. Ligado contextualmente ao arauto, é vertido no texto corrente como “outro arauto”, mantendo-se a imagem espacial em nota.
- source_word: κῆρυκος
  choice: arauto
  rationale: κῆρυξ é um proclamador oficial; “arauto” é preciso, digno e reconhecível em português.
- source_word: ἐπιβοῶντος
  choice: gritava
  rationale: O particípio indica uma proclamação feita em voz alta. “Gritava” preserva a intensidade e se integra naturalmente à construção narrativa.
