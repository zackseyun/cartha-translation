  text: and we ourselves would become a pattern of ungodliness for the young[a], so that we might become an example of eating what is defiled.
translation:
  language: pt
  text: E nós mesmos nos tornaríamos, para os jovens, um modelo de impiedade, para que nos tornássemos um exemplo de comer o que é impuro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «um exemplo de alimentação impura»; ou: «um exemplo de consumir alimentos impuros».'
    reason: Alternativas lexicais para o substantivo composto μιαροφαγίας.
lexical_decisions:
- source_word: τύπος
  choice: modelo
  rationale: Preserva a ideia de padrão ou modelo e mantém distinção lexical em relação a παράδειγμα, traduzido como «exemplo».
- source_word: ἀσεβείας
  choice: impiedade
  rationale: Expressa de modo direto e digno a falta de reverência para com Deus, preservando a força religiosa e moral do termo.
- source_word: τοῖς νέοις
  choice: para os jovens
  rationale: Mantém o sentido amplo de νέοι sem restringi-lo desnecessariamente a jovens do sexo masculino.
- source_word: παράδειγμα
  choice: exemplo
  rationale: É o equivalente português natural no contexto e evita repetir «modelo», usado para τύπος.
- source_word: μιαροφαγίας
  choice: consumo de alimentos impuros
  rationale: Comunica naturalmente a ideia composta de comer aquilo que está contaminado ou impuro, sem reduzi-la a um termo técnico específico da legislação alimentar.
- source_word: γενοίμεθα / γενώμεθα
  choice: nos tornaríamos / tornando-nos assim
  rationale: O condicional preserva o caráter hipotético da primeira forma; a construção com gerúndio e «assim» exprime o resultado decorrente sem impor uma finalidade deliberada excessivamente explícita.
theological_decisions:
- issue: Força moral e religiosa de ἀσεβείας
  choice: impiedade
  alternative: irreverência; falta de temor a Deus
  rationale: «Impiedade» conserva a referência à conduta contrária à reverência devida a Deus e é corrente no registro bíblico português.
- issue: Especificidade de μιαροφαγίας
  choice: consumo de alimentos impuros
  alternative: comer o que está contaminado; alimentação impura
  rationale: A escolha preserva a noção de ingestão impura ou contaminada, adequada ao contexto, sem acrescentar uma classificação legal mais específica do que o composto grego exige.
- issue: Relação expressa por ἵνα
  choice: 'resultado: «tornando-nos assim»'
  alternative: 'finalidade: «para que nos tornássemos»'
  rationale: No contexto, a cláusula pode apresentar a consequência ou caracterização resultante de se tornar modelo de impiedade. A tradução mantém essa ligação sem sugerir que os falantes desejariam intencionalmente servir de mau exemplo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Modelo» e «exemplo» preservam a variação retórica entre τύπος e παράδειγμα.
