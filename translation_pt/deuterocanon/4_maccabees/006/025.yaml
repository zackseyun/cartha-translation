  text: There[a], while burning him with instruments devised for torture[c][b], they flung themselves upon him and poured foul-smelling broths into his nostrils.
translation:
  language: pt
  text: Ali, enquanto o queimavam com instrumentos engenhosamente concebidos para torturar[a], lançavam-se sobre ele[b] e derramavam líquidos malcheirosos[c] em suas narinas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com instrumentos cruelmente engenhados”. A expressão grega ressalta que os instrumentos foram habilmente concebidos para causar o mal.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “saltavam sobre ele” ou “investiam contra ele”. O verbo pode indicar um salto ou avanço violento.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “caldos fétidos”. O substantivo grego pode designar caldo, suco ou outra mistura líquida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνθα
  choice: Ali
  rationale: Preserva a transição locativa e a vivacidade da cena, em vez de reduzi-la a uma simples sequência temporal como “Então”.
- source_word: διὰ κακοτέχνων ὀργάνων
  choice: com instrumentos engenhosamente concebidos para torturar
  rationale: Expressa tanto a ideia de instrumentos quanto a de fabricação habilidosa voltada a um fim cruel; “para torturar” torna explícita a função indicada pelo contexto sem recorrer a uma formulação artificial.
- source_word: καταφλέγοντες
  choice: enquanto o queimavam
  rationale: Comunica a queima intensa indicada pelo particípio e integra naturalmente a ação simultânea na narrativa.
- source_word: ὑπερίπτοσαν
  choice: lançavam-se sobre ele
  rationale: Preserva a ideia de movimento súbito e violento contra a vítima, sem impor a leitura meramente espacial de que saltavam por cima dela.
- source_word: δυσώδεις χυλούς
  choice: líquidos malcheirosos
  rationale: “Líquidos” mantém a amplitude de χυλός, que pode designar caldo, suco ou mistura líquida, enquanto “malcheirosos” traduz claramente δυσώδεις.
- source_word: μυκτῆρας
  choice: narinas
  rationale: Reproduz o plural anatômico específico do grego e preserva a precisão gráfica da descrição.
- source_word: κατέχεον
  choice: derramavam
  rationale: O imperfeito grego descreve uma ação em curso ou repetida; o imperfeito português conserva naturalmente esse aspecto no contexto.
