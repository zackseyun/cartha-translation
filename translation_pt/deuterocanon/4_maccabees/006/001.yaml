  text: After he had spoken against the tyrant’s persuasions in this way[c][b][a], the bodyguards came forward and harshly dragged Eleazar to the tortures.
translation:
  language: pt
  text: Depois de se pronunciar dessa maneira contra os apelos do tirano[a], os guarda-costas[b] se aproximaram e arrastaram Eleazar cruelmente[c] para as torturas[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tentativas de persuasão”; o termo grego pode indicar exortação ou encorajamento, mas aqui se refere aos esforços do tirano para fazê-lo ceder.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “portadores de lança”, expressão usada para assistentes armados ou membros da guarda de um governante.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “amargamente”; neste contexto, o advérbio indica a crueldade ou severidade com que o trataram.
    reason: lexical_alternative
  - marker: d
    text: Ou “para os instrumentos de tortura” ou “para o lugar de tortura”; a expressão grega, no plural, pode referir-se às próprias torturas, aos meios empregados ou ao local em que eram aplicadas.
    reason: textual_ambiguity
lexical_decisions:
- source_word: Τοῦτον τὸν τρόπον
  choice: dessa maneira
  rationale: Expressão adverbial idiomática que preserva a referência ao modo como Eleazar respondeu.
- source_word: ἀντιρρητορεύσαντα
  choice: se pronunciou contra
  rationale: Conserva o sentido de falar em oposição sem impor a ideia mais específica de um debate formal.
- source_word: παρηγορίαις
  choice: apelos
  rationale: No contexto, designa as tentativas retóricas do tirano de levar Eleazar a ceder; “apelos” é natural e não sugere consolação benigna.
- source_word: δορυφόροι
  choice: guarda-costas
  rationale: Embora signifique literalmente “portadores de lança”, o termo designa aqui os assistentes armados que protegiam e serviam o governante.
- source_word: παραστάντες
  choice: se aproximaram
  rationale: Representa com naturalidade a entrada dos guardas em cena para executar a ação seguinte.
- source_word: πικρῶς
  choice: cruelmente
  rationale: O advérbio comunica neste contexto a dureza e a severidade do tratamento, mais naturalmente do que o equivalente formal “amargamente”.
- source_word: ἔσυραν
  choice: arrastaram
  rationale: Preserva a ideia de puxar alguém à força e a violência da ação.
- source_word: ἐπὶ τὰ βασανιστήρια
  choice: para os instrumentos de tortura
  rationale: Mantém o plural concreto e comunica o provável sentido dos meios usados para torturar, sem ocultar que a expressão também pode ser entendida em relação ao lugar da tortura.
- source_word: τὸν Ἐλεάζαρον
  choice: Eleazar
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome próprio.
