  text: Nós poremos diante de você alguns dos alimentos cozidos; você, porém, finja provar da carne de porco e salve-se.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡψημένων
  choice: cozidos
  rationale: O particípio indica alimentos preparados pelo calor. “Cozidos” preserva o sentido culinário amplo sem impor o método específico de assar, que o grego não exige.
- source_word: βρωμάτων
  choice: alimentos
  rationale: βρῶμα designa aquilo que se come, não necessariamente apenas carne. “Alimentos” mantém essa amplitude.
- source_word: παραθήσομεν
  choice: poremos diante de você
  rationale: No contexto de uma refeição, παρατίθημι significa colocar ou servir algo diante de alguém. A formulação conserva a ação concreta e explicita o complemento implícito.
- source_word: ὑποκρινόμενος
  choice: finja
  rationale: O particípio expressa simulação ou fingimento. Em português, coordená-lo ao imperativo seguinte produz uma frase natural e preserva a proposta de dissimulação.
- source_word: τῶν ὑείων
  choice: da carne de porco
  rationale: A expressão refere-se a alimento suíno. “Carne de porco” é clara, corrente e torna explícito o objeto da proibição alimentar no contexto.
- source_word: ἀπογεύσασθαι
  choice: provar
  rationale: O infinitivo significa experimentar ou provar uma pequena quantidade de alimento. “Provar” é a equivalência mais direta e natural.
- source_word: σώθητι
  choice: salve-se
  rationale: O imperativo passivo pode ter valor idiomático de autopreservação. Aqui se refere à sobrevivência física imediata, e “salve-se” conserva a concisão e a força do apelo.
theological_decisions:
- issue: Referência à carne proibida no contexto do martírio judaico
  choice: carne de porco
  alternative: alimento suíno
  rationale: A tradução identifica com clareza o alimento cuja ingestão violaria a lei judaica, sem acrescentar interpretação confessional.
- issue: Sentido de σώθητι
  choice: salve-se
  alternative: seja salvo; preserve a sua vida
  rationale: O contexto aponta para escapar da morte física. “Salve-se” mantém a forma incisiva do grego sem introduzir um sentido soteriológico que o versículo não exige.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. A construção correlativa μέν...δέ é representada pelo ponto e vírgula e por “porém”. Preferiu-se “cozidos” a “assados”, pois o grego indica preparo culinário pelo calor sem sustentar com segurança esse método mais específico.
