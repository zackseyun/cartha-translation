  yaml_path: translation/deuterocanon/4_maccabees/006/030.yaml
  text: And after saying these things[a], the holy man nobly gave himself over to the tortures, and he stood firm by reason for the law, even to the tortures of death.
translation:
  language: pt
  text: E, depois de dizer essas coisas, o homem santo enfrentou nobremente as torturas[a] e, por causa da Lei, resistiu com a razão até as torturas mortais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego traduzido como “enfrentou as torturas” é raro e de sentido difícil; também pode sugerir que ele foi ao encontro da morte ou que se entregou às torturas em confronto direto com elas.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτα εἰπών
  choice: E, depois de dizer essas coisas
  rationale: Reproduz com naturalidade a sequência expressa pelo particípio aoristo, sem a rigidez de uma construção excessivamente literal.
- source_word: ὁ ἱερὸς ἀνήρ
  choice: o homem santo
  rationale: Preserva tanto o caráter santo indicado por ἱερός quanto a referência masculina explícita de ἀνήρ.
- source_word: εὐγενῶς
  choice: nobremente
  rationale: Mantém o tom moral e retórico do advérbio, que descreve a dignidade e a coragem com que ele agiu.
- source_word: ταῖς βασάνοις
  choice: as torturas
  rationale: No contexto do martírio, βάσανοι designa claramente tormentos ou atos de tortura.
- source_word: ἐναντεθάνει
  choice: enfrentou ... as torturas
  rationale: O verbo raro parece combinar a ideia de confronto com a proximidade da morte; esta formulação conserva o confronto deliberado sem definir em excesso seu sentido incerto.
- source_word: μέχρι τῶν θανάτου βασάνων
  choice: até mesmo às torturas que o levaram à morte
  rationale: Expressa o limite extremo da resistência e torna natural em português a relação genitiva entre morte e torturas.
- source_word: ἀντέστη
  choice: resistiu
  rationale: Traduz diretamente a ideia de manter-se contra algo e perseverar diante da oposição.
- source_word: τῷ λογισμῷ
  choice: mediante a razão
  rationale: Trata λογισμός como a faculdade ou princípio racional central ao argumento de 4 Macabeus, em vez de reduzi-lo a pensamentos pessoais.
- source_word: διὰ τὸν νόμον
  choice: por causa da Lei
  rationale: 'Preserva claramente o valor causal ou motivador de διά com acusativo: a fidelidade à Lei motiva sua resistência.'
theological_decisions:
- issue: Sentido filosoficamente carregado de λογισμός
  choice: mediante a razão
  alternative: em seu raciocínio; por meio do juízo racional
  rationale: A expressão mantém o tema do domínio racional sobre as paixões em 4 Macabeus sem importar terminologia filosófica posterior ou excessivamente técnica.
- issue: Relação de διὰ τὸν νόμον com a resistência
  choice: por causa da Lei
  alternative: em defesa da Lei; pela Lei
  rationale: O grego permite uma nuance causal e possivelmente motivacional. A tradução explicita a causa sem transformar de modo indevido a frase em linguagem de defesa institucional.
- issue: Referência masculina de ἀνήρ
  choice: homem
  alternative: pessoa
  rationale: ἀνήρ designa explicitamente um homem adulto; conservar essa referência corresponde à forma do texto-fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Lei” recebe inicial maiúscula por designar aqui a Lei judaica. A redação conserva por nota a incerteza do verbo raro ἐναντεθάνει e evita fazer da formulação inglesa a base exclusiva da tradução.
