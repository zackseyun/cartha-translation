- from: E, depois de dizer essas coisas, o homem santo enfrentou nobremente as torturas[a] e, por causa da Lei, resistiu mediante a razão até mesmo às torturas que o levaram à morte.
  to: E, depois de dizer essas coisas, o homem santo enfrentou nobremente as torturas[a] e, por causa da Lei, resistiu com a razão até as torturas mortais.
  rationale: A revisão remove uma intensificação não exigida pelo grego e substitui a paráfrase causal das torturas por “torturas mortais”, que conserva melhor a formulação concisa do original. Também torna a expressão instrumental referente à razão mais natural em português. A nota preserva a incerteza lexical do verbo raro ἐναντεθάνει.
