lexical_decisions:
- source_word: αἰσχρόν
  choice: vergonhoso
  rationale: Expressa com naturalidade a desonra moral e pública indicada pelo adjetivo grego.
- source_word: ἐπιβιώσομεν
  choice: continuássemos vivos
  rationale: Preserva a ideia do verbo composto de continuar a viver ou sobreviver à ameaça presente.
- source_word: ὀλίγον χρόνον
  choice: por mais algum tempo
  rationale: Traduz a duração breve e, em conjunto com ἐπιβιώσομεν, comunica naturalmente a ideia de prolongar a vida apenas por pouco tempo.
- source_word: καταγελώμενοι
  choice: sendo ridicularizados
  rationale: Mantém o valor passivo e contínuo do particípio, bem como o caráter público do escárnio.
- source_word: πρὸς ἀπάντων
  choice: por todos
  rationale: Conserva a abrangência universal da expressão grega em português claro.
- source_word: ἐπὶ δειλίᾳ
  choice: por causa de nossa covardia
  rationale: Explicita que a covardia atribuída aos falantes seria o motivo do escárnio; o possessivo é exigido naturalmente pelo português neste contexto, embora esteja implícito no grego.
