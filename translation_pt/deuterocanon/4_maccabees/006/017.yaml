  yaml_path: translation/deuterocanon/4_maccabees/006/017.yaml
  text: Let us not think so badly, we who are Abraham’s children, as to become fainthearted and act out a disgraceful scene unworthy of us.
translation:
  language: pt
  text: Nós, filhos de Abraão, não pensemos de modo tão indigno, a ponto de, desanimando, representarmos uma cena indigna de nós.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κακῶς φρονήσαιμεν
  choice: não pensemos de modo tão indigno
  rationale: Expressa o juízo moral de κακῶς aplicado ao modo de pensar, sem reduzi-lo a simples erro intelectual.
- source_word: οἱ Ἀβραὰμ παῖδες
  choice: nós, filhos de Abraão
  rationale: Mantém a identificação enfática do grupo; neste contexto, παῖδες indica descendentes ou filhos, não servos.
- source_word: μαλακοψυχήσαντας
  choice: perdendo a coragem
  rationale: Verte de maneira natural a ideia de fraquejar interiormente ou tornar-se pusilânime, sem acrescentar uma acusação mais forte de covardia.
- source_word: δρᾶμα ὑποκρίνασθαι
  choice: encenarmos um ato
  rationale: Preserva a linguagem teatral formada por δρᾶμα e ὑποκρίνομαι, ao mesmo tempo que permite perceber a referência a uma conduta concreta.
- source_word: ἀπρεπὲς ἡμῖν
  choice: que não é digno de nós
  rationale: Comunica que o ato seria impróprio ou incompatível com a identidade dos falantes, em português claro e digno.
