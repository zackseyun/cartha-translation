  text: Be merciful to your nation[b][a], being satisfied with our punishment on their behalf.
translation:
  language: pt
  text: Sê misericordioso com a tua nação, dando-te por satisfeito com o nosso castigo em favor deles.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «considerando suficiente a nossa pena por eles».'
    reason: lexical_alternative
  - marker: b
    text: A expressão «em favor deles» preserva o possível sentido representativo do grego, sem especificar um modelo doutrinário posterior de expiação.
    reason: cultural_note
lexical_decisions:
- source_word: ἵλεως γενοῦ
  choice: Sê misericordioso
  rationale: A expressão idiomática constitui um apelo para que Deus mostre favor e misericórdia. A formulação é natural em português e evita o caráter técnico ou pouco corrente de «propício».
- source_word: τῷ ἔθνει σου
  choice: com a tua nação
  rationale: ἔθνος designa aqui a comunidade coletiva pela qual o orador intercede. «Nação» preserva esse sentido corporativo, enquanto a preposição «com» é a regência natural de «misericordioso» em português.
- source_word: ἀρκεσθεὶς
  choice: dando-te por satisfeito
  rationale: O particípio expressa a ideia de considerar algo suficiente. Esta construção conserva sua relação circunstancial com o apelo principal e soa natural em português.
- source_word: τῇ ἡμετέρᾳ ... δίκῃ
  choice: com o nosso castigo
  rationale: No contexto do martírio, δίκη indica pena ou sofrimento punitivo. «Castigo» comunica claramente esse sentido sem transformar o termo em uma abstração jurídica.
- source_word: περὶ αὐτῶν
  choice: em favor deles
  rationale: περί com genitivo admite o sentido de «a respeito deles», mas neste contexto intercessório pode indicar benefício ou representação. «Em favor deles» preserva essa força sem definir um modelo expiatório posterior.
theological_decisions:
- issue: Força representativa do sofrimento dos mártires em περὶ αὐτῶν
  choice: O castigo dos mártires é apresentado como sofrido em favor dos membros da nação.
  alternative: «A respeito deles», em sentido mais geral e sem força representativa explícita.
  rationale: O contexto é intercessório e favorece a noção de benefício ou representação, mas a tradução e a nota evitam impor ao texto uma teoria posterior e plenamente desenvolvida da expiação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. O imperativo «Sê» mantém o tom direto de oração; «dando-te por satisfeito» reproduz o particípio grego sem rigidez excessiva.
