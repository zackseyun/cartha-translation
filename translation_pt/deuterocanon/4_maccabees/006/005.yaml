base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/005.yaml
  text: But the noble-minded and truly well-born Eleazar[a], as though being tortured in a dream, was not turned aside in any way.
translation:
  language: pt
  text: Mas Eleazar, de espírito nobre e verdadeiramente de nobre nascimento, como se fosse torturado em um sonho[a], não se deixava desviar de modo algum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, “como se estivesse em um sonho”. O grego emprega uma comparação, não afirma que Eleazar estivesse literalmente sonhando.
    reason: Esclarece o caráter figurativo da expressão grega e evita uma leitura literal.
lexical_decisions:
- source_word: μεγαλόφρων
  choice: de espírito nobre
  rationale: Expressa grandeza de espírito e nobreza moral de modo natural em português, sem confundi-la com a origem social indicada por εὐγενής.
- source_word: εὐγενής
  choice: de nobre nascimento
  rationale: Preserva o sentido de boa origem ou linhagem e mantém a distinção em relação à nobreza interior expressa por μεγαλόφρων.
- source_word: ὡς ἀληθῶς
  choice: verdadeiramente
  rationale: Conserva a ênfase do advérbio grego e se liga naturalmente à descrição da origem nobre de Eleazar.
- source_word: ὥσπερ ἐν ὀνείρῳ
  choice: como se ... em um sonho
  rationale: Mantém a comparação explícita do grego sem afirmar que Eleazar estivesse literalmente sonhando.
- source_word: βασανιζόμενος
  choice: fosse torturado
  rationale: No contexto do martírio, o particípio se refere concretamente à tortura física; a forma verbal integra com naturalidade a construção comparativa.
- source_word: κατ᾽ οὐδὲν τρόπον
  choice: de modo algum
  rationale: Reproduz a negação total do idioma grego em português corrente e enfático.
- source_word: μετετρέπετο
  choice: não se deixava desviar
  rationale: Preserva o sentido de não ser afastado de seu propósito e reflete a resistência de Eleazar sem tornar explícito além do texto aquilo de que ele não se desviava.
theological_decisions:
- issue: Caracterização da resistência de Eleazar durante a tortura
  choice: 'A experiência é apresentada por meio de uma comparação: ele era torturado como se estivesse em um sonho, sem se deixar desviar.'
  alternative: Entender a expressão mais livremente como se a tortura lhe parecesse irreal.
  rationale: A construção ὥσπερ ἐν ὀνείρῳ é figurativa. A tradução conserva a imagem e a firmeza de Eleazar sem afirmar um estado literal de sonho nem acrescentar uma explicação filosófica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “De espírito nobre” e “de nobre nascimento” preservam a distinção entre qualidade moral e origem social. A colocação de [a] junto à imagem do sonho identifica sem ambiguidade o trecho explicado.
