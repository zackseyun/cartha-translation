  text: His face indeed was sweating, and he was breathing very hard, and he was being admired even by the very men who were torturing him because of his courage.
translation:
  language: pt
  text: Seu rosto, de fato, suava, e ele ofegava intensamente[a]; até os próprios homens que o torturavam ficavam admirados com sua coragem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “respirava com muita dificuldade”.'
    reason: lexical_alternative
  - marker: b
    text: 'A expressão grega é enfática: eram justamente os homens que o torturavam que se admiravam de sua coragem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱδρῶν γέ τοι τὸ πρόσωπον
  choice: Seu rosto, de fato, suava
  rationale: Reproduz o estado físico contínuo expresso pelo particípio, verte naturalmente o artigo grego por um possessivo em português e conserva a ênfase de γέ τοι com “de fato”.
- source_word: ἐπασθμαίνων σφοδρῶς
  choice: ofegava intensamente
  rationale: O verbo indica respiração difícil ou ofegante, e σφοδρῶς a intensifica. A formulação é concisa, corrente e não exagera o grego.
- source_word: ὑπʼ αὐτῶν τῶν βασανιζόντων
  choice: até os próprios homens que o torturavam
  rationale: A construção grega é enfática; “até” e “os próprios” preservam o impacto de serem justamente os torturadores aqueles que se admiravam.
- source_word: ἐθαυμάζετο
  choice: ficavam admirados
  rationale: O imperfeito passivo expressa uma reação contínua de admiração ou assombro; a construção portuguesa torna natural a mudança para a perspectiva dos agentes sem alterar o sentido.
- source_word: ἐπὶ τῇ εὐψυχίᾳ
  choice: com sua coragem
  rationale: εὐψυχία designa coragem ou firmeza de ânimo diante do sofrimento. “Coragem” é clara e não acrescenta uma avaliação doutrinária.
