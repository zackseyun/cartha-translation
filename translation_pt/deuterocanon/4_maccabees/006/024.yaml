  text: When they saw that he was so noble-minded in the face of these compulsions, and that he was not even changing toward pity for them, they led him to the fire.
translation:
  language: pt
  text: Quando viram que ele se mostrava tão nobre de espírito diante daquelas coações[a][b] e que nem sequer se deixava levar à compaixão por eles[c], levaram-no ao fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pressões” ou “constrangimentos”. O grego ἀνάγκας indica aqui forças coercivas impostas a ele, não necessidades comuns.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega traduzida por “nobre de espírito” denota grandeza de ânimo ou magnanimidade.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “à compaixão deles”. Aqui, o sentido mais provável é “à compaixão por eles”; gramaticalmente, também se pode entender “à compaixão que eles sentiam”.
    reason: ambiguity
lexical_decisions:
- source_word: Πρὸς τὰς ἀνάγκας
  choice: enfrentava aquelas coações
  rationale: A construção descreve a postura dele perante pressões coercivas. “Coações” comunica força imposta sem reduzir o termo a necessidades comuns nem especificá-lo exclusivamente como torturas.
- source_word: οὕτως μεγαλοφρονοῦντα
  choice: com tamanha grandeza de espírito
  rationale: O particípio expressa elevação, nobreza ou magnanimidade de ânimo. A locução é natural e conserva a dimensão interior e ética do termo.
- source_word: ἰδόντες
  choice: Quando viram
  rationale: O particípio aoristo tem aqui valor circunstancial temporal e introduz naturalmente a ação principal.
- source_word: μηδὲ
  choice: nem sequer
  rationale: Preserva a força enfática da negação grega.
- source_word: πρὸς τὸν οἰκτιρμὸν αὐτῶν μεταβαλλόμενον
  choice: mudava de atitude diante da compaixão deles
  rationale: “Mudava de atitude” explicita de modo idiomático a mudança de disposição indicada por μεταβαλλόμενον; “diante de” conserva a relação expressa por πρός sem afirmar que a compaixão efetivamente o persuadiu.
- source_word: ἐπὶ τὸ πῦρ αὐτὸν ἦγον
  choice: levaram-no ao fogo
  rationale: Expressa movimento até o fogo como lugar ou instrumento da execução, sem acrescentar que naquele instante o lançaram dentro dele.
theological_decisions:
- issue: Referente do genitivo αὐτῶν em οἰκτιρμὸν αὐτῶν
  choice: compaixão deles
  alternative: compaixão por eles
  rationale: O contexto favorece o genitivo subjetivo, isto é, a compaixão sentida por seus algozes ou assistentes; contudo, a forma grega isoladamente também pode ser entendida objetivamente. A nota preserva essa ambiguidade sem alterar silenciosamente o sentido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A ordem foi reorganizada para clareza, mantendo a relação temporal dos particípios e a tensão lexical do grego.
