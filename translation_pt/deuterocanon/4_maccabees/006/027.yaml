  text: You know[a], O God, that though it is possible for me to be saved[b], I am dying in burning torments because of the law.
translation:
  language: pt
  text: Tu sabes, ó Deus, que, embora me seja possível ser salvo[a], estou morrendo em tormentos abrasadores por causa da Lei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escapar com vida” ou “ser libertado”; aqui, o sentido é que ainda havia para ele uma possibilidade de livramento físico.
    reason: lexical_alternative
  - marker: b
    text: Ou “por amor à Lei”. A referência é à fidelidade perseverante à Lei de Moisés em meio à perseguição.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ οἶσθα
  choice: Tu sabes
  rationale: Mantém o pronome enfático e a forma direta da oração, em linguagem corrente e digna.
- source_word: θεέ
  choice: ó Deus
  rationale: Reproduz naturalmente o vocativo grego em uma súplica solene.
- source_word: παρὸν μοι
  choice: embora me seja possível
  rationale: Expressa que uma saída ainda está ao alcance do orador e explicita a força concessiva exigida pelo contraste contextual.
- source_word: σῴζεσθαι
  choice: ser salvo
  rationale: Preserva a amplitude lexical do verbo grego; no contexto, a referência primária é ao livramento físico da tortura e da morte.
- source_word: βασάνοις καυστικαῖς
  choice: em tormentos abrasadores
  rationale: Comunica tanto o sofrimento das torturas quanto seu caráter ardente, com formulação natural em português.
- source_word: ἀποθνῄσκω
  choice: estou morrendo
  rationale: O gerúndio com auxiliar transmite o aspecto vívido e contínuo do presente grego.
- source_word: διὰ τὸν νόμον
  choice: por causa da Lei
  rationale: Conserva a relação causal expressa pelo grego; a inicial maiúscula sinaliza a referência contextual à Lei mosaica sem acrescentar conteúdo ao texto.
theological_decisions:
- issue: Sentido de σῴζεσθαι no contexto do martírio
  choice: livramento ou preservação física, vertido como “ser salvo”
  alternative: escapar com vida; ser libertado
  rationale: O contraste imediato é entre a possibilidade de evitar a morte e a decisão de suportá-la. “Ser salvo” conserva a formulação ampla do grego sem impor exclusivamente um sentido doutrinário posterior.
- issue: Força de διὰ τὸν νόμον
  choice: relação causal ligada à fidelidade à Lei, vertida como “por causa da Lei”
  alternative: por amor à Lei; em favor da Lei
  rationale: A tradução mantém a causalidade formal do grego e deixa que o contexto comunique a fidelidade do mártir, sem inserir uma motivação mais específica do que o original declara.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. O tratamento por “tu” preserva a oração direta sem soar excessivamente arcaico; “tormentos abrasadores” mantém a intensidade da imagem grega.
