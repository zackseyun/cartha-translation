base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/035.yaml
  text: Even if it is ridiculous, I demonstrate not only that reason has gained mastery over pains, but also that it rules over pleasures and does not yield to them.
translation:
  language: pt
  text: Ainda que seja ridículo, demonstro não apenas que a razão conquistou domínio sobre as dores, mas também que domina os prazeres e não cede a eles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ καὶ γελοῖον
  choice: Ainda que isso seja ridículo
  rationale: A expressão grega é elíptica. A inclusão de “isso seja” produz uma frase natural em português sem determinar além do texto o referente implícito; “ridículo” preserva a concessão retórica de γελοῖον.
- source_word: ἀλγηδόνων
  choice: dores
  rationale: O substantivo designa experiências de dor. “Dores” é a correspondência direta e evita intensificar o termo como “torturas”, embora o contexto envolva martírio.
- source_word: ἐπιδείκνυμι
  choice: demonstro
  rationale: O verbo expressa mostrar ou demonstrar de modo patente e combina com o caráter argumentativo e exemplar da passagem.
- source_word: κεκρατηκέναι τὸν λογισμόν
  choice: que a razão conquistou domínio
  rationale: 'A formulação procura conservar o aspecto perfeito de κεκρατηκέναι: o domínio foi alcançado e permanece como estado demonstrável.'
- source_word: τὸν λογισμόν
  choice: a razão
  rationale: “Razão” mantém de forma concisa o termo programático do livro para a faculdade racional que governa as paixões, sem introduzir terminologia filosófica posterior.
- source_word: τῶν ἡδονῶν κρατεῖν
  choice: domina os prazeres
  rationale: “Domina” comunica a ideia de exercer poder sobre algo. A variação em relação a “conquistou domínio” também preserva a diferença aspectual entre o perfeito anterior e o infinitivo presente.
- source_word: μηδὲ αὐταῖς ὑπείκειν
  choice: e não cede a eles
  rationale: ὑπείκω significa ceder ou dar lugar. A tradução conserva a imagem de resistência e retoma naturalmente “os prazeres” pelo pronome masculino exigido em português.
theological_decisions:
- issue: Tradução de λογισμός no contexto filosófico e martirial
  choice: a razão
  alternative: o juízo racional; a mente racional
  rationale: O livro apresenta a razão devota como governante das paixões. “A razão” preserva essa força conceitual sem acrescentar uma interpretação denominacional nem tornar o texto desnecessariamente técnico.
- issue: Possível intensificação de ἀλγηδόνων devido ao contexto de tortura
  choice: dores
  alternative: sofrimentos; tormentos
  rationale: Embora o contexto seja de sofrimento extremo, o substantivo tem o sentido básico de dores. A opção escolhida não introduz uma intensidade maior do que a explicitamente expressa pelo vocábulo.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Conserva-se o ponto após a oração concessiva elíptica, conforme a segmentação da fonte fornecida, e mantém-se o “E” inicial da segunda frase para representar καί.
