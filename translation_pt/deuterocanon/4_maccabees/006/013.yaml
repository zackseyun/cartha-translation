  yaml_path: translation/deuterocanon/4_maccabees/006/013.yaml
  text: Some of the king’s men[a], being moved by sympathy because of their long acquaintance with him, and others approaching him in admiration of his endurance, were saying[b],
translation:
  language: pt
  text: 'Alguns dos homens do rei, movidos pela compaixão decorrente de sua longa convivência com ele,[a] e outros, aproximando-se dele com admiração por sua perseverança,[b] diziam:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa da familiaridade com ele”. O grego pode indicar convivência habitual ou familiaridade adquirida ao longo do tempo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “com admiração por sua firmeza”. O termo grego traz a ideia de perseverança ou constância sob provação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν συμπαθείᾳ
  choice: movidos pela compaixão
  rationale: Expressa naturalmente em português o estado afetivo ou a motivação dos que agiam, preservando o sentido de solidariedade e compaixão de συμπάθεια.
- source_word: τῆς συνηθείας
  choice: por causa da longa convivência com ele
  rationale: συνήθεια pode indicar familiaridade, associação habitual ou convivência prolongada. A formulação comunica uma relação anterior sem elevá-la necessariamente à amizade íntima.
- source_word: ἐν θαυμαστῷ τῆς καρτερίας
  choice: admirados com sua perseverança
  rationale: A expressão descreve assombro ou admiração diante da firme resistência de Eleazar; καρτερία denota perseverança ou constância sob provação.
- source_word: προσίοντες αὐτῷ
  choice: aproximando-se dele
  rationale: Mantém de modo direto a ação participial de chegar perto de Eleazar.
- source_word: τινες τῶν τοῦ βασιλέως
  choice: alguns dos homens do rei
  rationale: A construção designa pessoas ligadas ao serviço ou séquito do rei, sem especificar um cargo que o grego não explicita.
- source_word: ἔλεγον
  choice: diziam
  rationale: O imperfeito grego sugere fala em andamento e também prepara naturalmente a continuação no versículo seguinte.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com estrutura narrativa fluente. A distinção entre dois grupos — uns motivados pela compaixão decorrente da convivência, outros pela admiração diante da perseverança — foi preservada. Os marcadores aparecem imediatamente após as expressões a que se referem.
