  text: And it is right for us to acknowledge that reason is sovereign[b][a], since it even prevails over outward pains.
translation:
  language: pt
  text: E é justo reconhecermos que o domínio pertence à razão[a], visto que ela prevalece até mesmo sobre as dores externas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a razão tem domínio” ou “o poder pertence à razão”. A expressão grega ressalta a força governante da razão.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “dores vindas de fora”. A expressão provavelmente inclui o sofrimento físico, mas o grego diz literalmente que as dores são externas ou vêm de fora.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιόν ἐστιν
  choice: é justo
  rationale: A expressão impessoal indica que reconhecer essa conclusão é correto ou justo; a formulação conserva sua força avaliativa.
- source_word: ὁμολογεῖν ἡμᾶς
  choice: reconhecermos
  rationale: No contexto argumentativo, ὁμολογεῖν significa admitir ou declarar como verdadeira uma conclusão, não confessar pecado.
- source_word: τὸ κράτος εἶναι τοῦ λογισμοῦ
  choice: que o domínio pertence à razão
  rationale: A construção atribui κράτος — poder, força dominante ou domínio — ao λογισμός. Esta formulação preserva a estrutura e a ênfase no poder governante da razão sem transformar a afirmação em terminologia política.
- source_word: ὅπου γε καὶ
  choice: visto que ... até mesmo
  rationale: 'A expressão introduz a prova da afirmação anterior e acrescenta ênfase: a razão prevalece inclusive neste caso extremo.'
- source_word: τῶν ἔξωθεν ἀλγηδόνων
  choice: sobre as dores externas
  rationale: ἔξωθεν significa literalmente 'de fora' ou 'externas', e ἀλγηδόνων designa dores. A tradução mantém a formulação ampla, sem restringi-la explicitamente ao sofrimento corporal.
- source_word: ἐπικρατεῖ
  choice: prevalece ... sobre
  rationale: O verbo expressa superioridade efetiva, domínio ou vitória sobre algo; 'prevalece sobre' é natural e preserva essa força.
theological_decisions:
- issue: Força filosófico-antropológica de λογισμός em 4 Macabeus
  choice: o domínio pertence à razão
  alternative: a razão é soberana; a razão tem domínio
  rationale: O texto afirma o poder governante da faculdade racional sobre a dor. A tradução mantém essa tese filosófica sem introduzir categorias teológicas posteriores nem resolver além do necessário a relação entre razão, vontade e sofrimento.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão internacional. Emprega-se “razão” como termo filosófico central e “dores externas” para preservar a amplitude do grego.
