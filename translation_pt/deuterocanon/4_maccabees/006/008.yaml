  text: Then indeed one of the cruel guards[a], leaping at his sides, kept striking him so that, when he fell[b], he might rise again.
translation:
  language: pt
  text: Então, certamente, um dos guardas cruéis[a], lançando-se contra os flancos dele, chutava-o repetidamente para que, ao cair, ele se levantasse de novo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um dos cruéis guardas pessoais”. Em grego, o termo designa literalmente um dos guardas portadores de lança do governante.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “se levantasse de novo” significa voltar a ficar em pé depois de cair, não ressuscitar.
    reason: lexical_alternative
lexical_decisions:
- source_word: λάξ γέ τοι
  choice: Então
  rationale: A expressão é textualmente difícil nesta forma e funciona no contexto como transição enfática; “Então” mantém o avanço narrativo sem impor um sentido concreto incerto.
- source_word: τῶν πικρῶν
  choice: cruéis
  rationale: Embora πικρός signifique literalmente “amargo”, aplicado a pessoas pode indicar dureza ou crueldade, como exige o contexto de tortura.
- source_word: δορυφόρων
  choice: guardas
  rationale: O termo significa literalmente “portadores de lança” e pode designar guardas ou membros de uma escolta; “guardas” comunica naturalmente sua função no episódio.
- source_word: κενεῶνας
  choice: os lados dele
  rationale: Refere-se às partes ocas laterais do corpo, isto é, aos flancos; “os lados dele” é claro e natural em português corrente.
- source_word: ἐναλλόμενος
  choice: lançando-se contra
  rationale: Preserva o movimento súbito e vigoroso do particípio sem sugerir necessariamente que o guarda tenha saltado sobre o corpo da vítima.
- source_word: ἔτυπτεν
  choice: continuava a golpeá-lo
  rationale: O imperfeito indica ação contínua ou repetida; a formulação retrata os golpes reiterados.
- source_word: ὅπως ἐξανίσταιτο
  choice: para que ... ele se levantasse de novo
  rationale: 'A construção expressa propósito: os golpes visavam obrigá-lo a voltar a ficar em pé.'
- source_word: πίπτων
  choice: ao cair
  rationale: O particípio apresenta a queda como simultânea à ação descrita, preservando de modo natural a imagem de ele ser golpeado enquanto sucumbia.
theological_decisions:
- issue: Possível leitura de “se levantasse de novo” como referência à ressurreição
  choice: levantar-se fisicamente depois de cair durante a tortura
  alternative: entender a expressão como linguagem de ressurreição
  rationale: O contexto e a construção verbal indicam que o guarda o força a voltar a ficar em pé; a nota evita importar para o versículo uma afirmação doutrinária que ele não faz.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem foi ajustada à sintaxe portuguesa, mantendo a violência reiterada da cena e a relação de propósito do grego.
