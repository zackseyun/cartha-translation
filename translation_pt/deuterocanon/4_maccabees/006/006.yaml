base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/006.yaml
  text: But no—no—no! Lifting his eyes high toward heaven[a], the old man was exposing his flesh to the whips, and was streaming with blood[c][b], and his sides were being pierced.
translation:
  language: pt
  text: Mas não — não — não! Erguendo bem alto os olhos para o céu, o ancião expunha sua carne aos açoites[a]; o sangue lhe escorria pelo corpo[b], e seus flancos eram continuamente feridos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «deixava sua carne exposta sob os açoites». O verbo grego pode destacar que a carne se tornava visível ou manifesta durante a flagelação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «ficava coberto de sangue». A expressão grega retrata o sangue correndo ou se espalhando continuamente sobre ele.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «suas costelas eram continuamente feridas». O termo grego pode indicar os lados do tronco ou, mais especificamente, a região das costelas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ ἀλλὰ ἀλλὰ
  choice: Mas não — não — não!
  rationale: A repetição abrupta tem forte valor enfático e marca uma reação resoluta. Em português, a combinação de «mas» com a tríplice negação preserva melhor essa força do que a repetição pouco natural de «mas».
- source_word: ὑψηλοὺς ἀντείνας ... τοὺς ὀφθαλμούς
  choice: Erguendo bem alto os olhos
  rationale: Reproduz o gesto físico ascendente de modo idiomático e vívido em português.
- source_word: εἰς τὸν οὐρανόν
  choice: para o céu
  rationale: É a formulação portuguesa natural para a direção do olhar e mantém aberta a dimensão religiosa do gesto sem explicá-la.
- source_word: ἀπέφαινετο ταῖς μάστιξιν τὰς σάρκας
  choice: expunha sua carne aos açoites
  rationale: Mantém a carne como objeto literal e conserva a imagem do corpo exposto à ação dos instrumentos de flagelação.
- source_word: ὁ γέρων
  choice: o ancião
  rationale: Expressa idade avançada com dignidade narrativa e sem sugerir um cargo religioso, como poderia ocorrer com «presbítero» ou, em certos contextos, «ancião»; aqui o contexto deixa claro o sentido etário.
- source_word: κατερρεῖτο τῷ αἵματι
  choice: o sangue lhe escorria pelo corpo
  rationale: Torna natural em português a imagem durativa de sangue correndo ou descendo sobre ele, sem reduzir a expressão à mera constatação de que sangrava.
- source_word: τὰ πλευρά
  choice: seus flancos
  rationale: Designa a região lateral do tronco sem restringir indevidamente o referente aos ossos das costelas.
- source_word: κατετιτρώσκετο
  choice: eram continuamente feridos
  rationale: O imperfeito passivo apresenta uma ação em curso ou repetida. «Feridos» evita especificar além do grego se os golpes perfuravam completamente, rasgavam ou apenas lesionavam.
theological_decisions:
- issue: Sentido de σάρκας no contexto do suplício
  choice: carne em sentido corporal literal
  alternative: corpo ou pele
  rationale: O contexto descreve tortura física; não há aqui contraste antropológico ou uso moral-teológico de σάρξ. «Carne» preserva a concretude do original.
- issue: Valor religioso de οὐρανός
  choice: céu
  alternative: firmamento
  rationale: «Céu» mantém tanto o referente espacial quanto a possível ressonância religiosa do olhar erguido, sem transformar a alusão em interpretação explícita.
translation_notes:
  register: Português moderno, claro e digno, com ritmo narrativo solene. A coordenação do grego foi levemente ajustada com ponto e vírgula para legibilidade. Os aspectos durativos dos imperfeitos foram mantidos por «expunha», «escorria» e «eram continuamente feridos». Os marcadores foram colocados junto às expressões às quais suas notas efetivamente se referem.
