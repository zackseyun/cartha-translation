  yaml_path: translation/deuterocanon/4_maccabees/006/032.yaml
  text: For if the passions had gained mastery over reason[b][a], I would have given them testimony to my self-control.
translation:
  language: pt
  text: Pois, se as paixões tivessem prevalecido sobre a razão, eu lhes teria prestado o testemunho de seu domínio.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eu lhes teria dado a prova de que haviam vencido”.'
    reason: A expressão grega também pode ser entendida de maneira mais explicativa, com μαρτυρία como “prova” e ἐπικρατία como a vitória ou prevalência das paixões.
lexical_decisions:
- source_word: πάθη
  choice: as paixões
  rationale: Neste contexto ético-filosófico, o termo designa impulsos e afetos que disputam o governo da conduta com a razão, não sofrimentos externos.
- source_word: λογισμοῦ
  choice: a razão
  rationale: O termo se refere à faculdade de julgar e deliberar racionalmente; “razão” mantém de modo claro o contraste central com as paixões.
- source_word: κεκράτηκει
  choice: tivessem prevalecido sobre
  rationale: A forma verbal indica domínio ou vitória sobre algo; o mais-que-perfeito grego é adequadamente representado pelo mais-que-perfeito composto do subjuntivo na condição irreal em português.
- source_word: ἀπεδόμην
  choice: eu lhes teria prestado
  rationale: O verbo significa dar, retribuir ou prestar o que cabe. “Prestar testemunho” é natural em português e conserva a nuance testemunhal da expressão.
- source_word: μαρτυρίαν
  choice: o testemunho
  rationale: 'Preserva a imagem probatória ou forense: a conduta do falante serviria de testemunho em favor daquilo que tivesse vencido.'
- source_word: ἐπικρατίας
  choice: de seu domínio
  rationale: O substantivo denota prevalência, supremacia ou domínio. O possessivo explicita naturalmente que, na hipótese, o domínio pertenceria às paixões, referidas por τούτοις.
theological_decisions:
- issue: Contraste antropológico entre razão e paixões
  choice: 'Manter as categorias ético-filosóficas explícitas do texto: “paixões” e “razão”.'
  alternative: Interpretar como “meus desejos” e “meu bom senso”, ou introduzir uma categoria doutrinária posterior como “natureza pecaminosa”.
  rationale: A formulação conserva o argumento próprio de 4 Macabeus sem convertê-lo em terminologia de uma tradição teológica posterior.
- issue: Sentido de τῆς ἐπικρατίας μαρτυρίαν
  choice: “o testemunho de seu domínio”
  alternative: “o testemunho do meu autocontrole”
  rationale: A hipótese afirma que, se as paixões tivessem vencido a razão, o falante teria reconhecido o domínio delas. O grego não contém pronome de primeira pessoa, e “meu autocontrole” tornaria a lógica da frase obscura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “prevalecido sobre” preserva o vocabulário de domínio do grego, enquanto “prestado o testemunho” mantém sua imagem testemunhal sem soar excessivamente técnica.
