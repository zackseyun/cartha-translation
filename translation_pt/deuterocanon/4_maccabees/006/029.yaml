  text: Make my blood their purification[b][a], and take my life in exchange for theirs.
translation:
  language: pt
  text: Faz do meu sangue a purificação deles[a] e toma a minha vida em troca da vida deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Faz do meu sangue a limpeza deles”. O grego καθαρσόν pode denotar purificação ou limpeza em sentido cultual.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “toma a minha vida em troca da deles”. A expressão indica substituição de vida por vida. “Como resgate por eles” é possível, mas mais interpretativo.
    reason: alternative_reading
lexical_decisions:
- source_word: καθαρσὸν ... ποίησον
  choice: Faze ... a purificação
  rationale: A construção predicativa pede o sentido de fazer do sangue um meio de purificação. “Purificação” conserva a conotação cultual sem impor uma formulação doutrinária posterior.
- source_word: αἷμα
  choice: sangue
  rationale: Tradução direta, necessária para preservar a linguagem sacrificial explícita.
- source_word: ἀντίψυχον
  choice: em troca da vida deles
  rationale: Expressa a substituição ou troca de vida por vida sem acrescentar necessariamente a nuance comercial de “resgate”.
- source_word: ψυχήν
  choice: vida
  rationale: No contexto do martírio, refere-se à vida entregue; “alma” poderia sugerir indevidamente apenas a parte imaterial da pessoa.
- source_word: λάβε
  choice: toma
  rationale: Reproduz de modo direto e natural o imperativo dirigido a Deus.
theological_decisions:
- issue: Linguagem sacrificial e substitutiva na oração do mártir
  choice: Manter explicitamente “purificação” e “em troca da vida deles”
  alternative: “Faze do meu sangue a expiação deles e recebe a minha alma como resgate por eles”
  rationale: O grego associa o sangue à purificação e apresenta a vida do mártir como dada em lugar da vida de outros. A tradução preserva essa tensão sem convertê-la em uma formulação doutrinária mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Faze” mantém a forma singular do imperativo e um tom solene sem arcaísmo excessivo; a repetição de “vida” esclarece o referente de “deles”.
