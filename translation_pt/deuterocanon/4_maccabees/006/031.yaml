lexical_decisions:
- source_word: ὁμολογουμένως
  choice: é reconhecido
  rationale: O advérbio indica algo admitido ou reconhecido de comum acordo; a formulação é natural em português e mantém esse valor.
- source_word: οὖν
  choice: portanto
  rationale: Expressa a conclusão inferida da argumentação precedente.
- source_word: δεσπότης
  choice: domina
  rationale: O substantivo descreve quem exerce autoridade e controle. A construção verbal soa natural em português e preserva a ideia de governo sem introduzir a associação teológica de «Senhor».
- source_word: τῶν παθῶν
  choice: as paixões
  rationale: No contexto filosófico-moral de 4 Macabeus, πάθη designa paixões ou impulsos sujeitos ao governo da razão.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: a razão piedosa
  rationale: A expressão une o exercício racional à reverência para com Deus. «Razão piedosa» é conciso, inteligível e preserva ambas as dimensões.
theological_decisions:
- issue: Sentido de εὐσεβής na expressão filosófico-teológica
  choice: piedosa
  alternative: temente a Deus; devota
  rationale: O adjetivo apresenta a razão como orientada pela reverência a Deus, não como racionalidade autônoma. «Piedosa» preserva essa dimensão religiosa sem ampliar o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi ajustada de «é senhora das paixões» para «domina as paixões», preservando o sentido de autoridade e produzindo uma frase mais natural.
