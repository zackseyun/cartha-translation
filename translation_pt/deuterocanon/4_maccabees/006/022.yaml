  yaml_path: translation/deuterocanon/4_maccabees/006/022.yaml
  text: In response to this[a], you, O children of Abraham, die nobly for the sake of godliness.
translation:
  language: pt
  text: Em resposta a isso, vocês, ó filhos de Abraão, morram nobremente por causa da devoção a Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «por causa da piedade». O termo grego εὐσέβεια indica devoção reverente a Deus expressa numa conduta fiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: Diante disso
  rationale: A expressão liga a exortação ao que acaba de ser dito. «Diante disso» é natural em português e preserva a ideia de reação ou resposta sem tornar explícita demais a relação discursiva.
- source_word: ὑμεῖς μέν
  choice: vocês
  rationale: O pronome é enfático, enquanto μέν sinaliza tópico ou contraste leve. «Vocês» preserva a ênfase da interpelação direta; traduzir μέν separadamente produziria aqui uma formulação artificial.
- source_word: ὦ Ἀβραὰμ παῖδες
  choice: ó filhos de Abraão
  rationale: παῖδες pode designar filhos ou crianças. «Filhos de Abraão» conserva a linguagem familiar e a ressonância de pertencimento ao patriarca; «ó» mantém o tom retórico elevado do vocativo.
- source_word: εὐγενῶς
  choice: nobremente
  rationale: O advérbio elogia uma conduta nobre e elevada. «Nobremente» é conciso e não reduz o sentido apenas à coragem.
- source_word: ὑπὲρ τῆς εὐσεβείας
  choice: por causa da devoção a Deus
  rationale: Neste contexto judaico de martírio, εὐσέβεια denota reverência e fidelidade religiosa expressas na conduta. «Devoção a Deus» comunica claramente a orientação divina do termo, e «por causa de» expressa de modo natural o motivo pelo qual morrem.
- source_word: τελευτᾶτε
  choice: morrem
  rationale: O verbo é uma forma digna de falar da morte ou do fim da vida. «Morrem» é direto, solene no contexto e mantém o presente retórico do grego.
theological_decisions:
- issue: Tradução de εὐσέβεια no contexto de martírio
  choice: devoção a Deus
  alternative: piedade
  rationale: A expressão descreve reverência fiel a Deus, demonstrada na conduta, pela qual os descendentes de Abraão aceitam morrer. «Devoção a Deus» torna essa orientação explícita sem introduzir uma doutrina técnica; «piedade» continua sendo uma alternativa lexical legítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O vocativo «ó filhos de Abraão» conserva a elevação retórica do grego; o restante da frase usa construção natural e direta.
