  text: But you[a], the tyrant’s bodyguards, why do you delay?
translation:
  language: pt
  text: Mas vocês, guardas pessoais[a] do tirano, por que demoram?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente “portadores de lança”; isto é, os guardas armados ou guardas pessoais do tirano.
