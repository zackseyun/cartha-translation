lexical_decisions:
- source_word: οἱ ... δορυφόροι
  choice: vocês, guardas pessoais
  rationale: Embora δορυφόροι signifique literalmente “portadores de lança”, no contexto designa os homens armados encarregados da proteção e das ordens do tirano. “Guardas pessoais” comunica essa função em português natural; “vocês” explicita a interpelação direta indicada pela segunda pessoa do plural em μέλλετε.
- source_word: τοῦ τυράννου
  choice: do tirano
  rationale: O genitivo expressa a relação dos guardas com o tirano. “Tirano” conserva a forte conotação política e moral de τύραννος.
- source_word: τί μέλλετε;
  choice: por que demoram?
  rationale: Empregado de modo absoluto nesta repreensão, μέλλω indica demora ou hesitação antes de agir, não simples futuridade. A formulação preserva o desafio impaciente e permanece concisa.
- source_word: οἱ δὲ
  choice: Mas vocês
  rationale: δέ marca a transição adversativa, enquanto o verbo na segunda pessoa mostra que os guardas são interpelados diretamente. “Mas vocês” reproduz essa mudança de foco com naturalidade.
