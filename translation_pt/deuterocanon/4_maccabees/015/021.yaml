  yaml_path: translation/deuterocanon/4_maccabees/015/021.yaml
  text: Not in this way do siren songs or swanlike voices with feminine sound draw those who hear[a], as the voices of children calling to their mother amid tortures.
translation:
  language: pt
  text: Nem melodias de sereias nem vozes de cisnes de timbre feminino atraem os ouvintes tanto quanto as vozes dos filhos que, em meio a torturas, chamam pela mãe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cantos de sereias” e “vozes semelhantes às de cisnes”. O grego emprega imagens poéticas clássicas para sons de forte poder de atração.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σειρήνιοι μελῳδίαι
  choice: melodias de sereias
  rationale: Preserva a alusão clássica às Sereias e traduz diretamente o caráter musical de μελῳδίαι, sem reduzir a imagem a um som apenas encantador.
- source_word: κύκνιοι ... φωναί
  choice: vozes de cisnes
  rationale: Mantém a imagem poética dos cisnes; o adjetivo grego pode significar tanto “de cisnes” como “semelhantes às de cisnes”.
- source_word: πρὸς θηλυκίαν
  choice: de timbre feminino
  rationale: Expressa em português natural a qualidade feminina atribuída às vozes, evitando a formulação obscura e excessivamente literal “voltadas para o feminino” e sem acrescentar a ideia interpretativa de charme ou sedução.
- source_word: ἐφέλκονται
  choice: atraem
  rationale: Comunica o movimento figurado de puxar ou atrair os ouvintes e se encaixa naturalmente na comparação οὐχ οὕτως ... ὡς, vertida como “não ... tanto ... como”.
- source_word: τέκνων φωναί
  choice: as vozes dos filhos
  rationale: No contexto do chamado dirigido à mãe, “filhos” torna explícita em português a relação já indicada pela construção grega, sem restringir idade ou sexo.
- source_word: μετὰ βασάνων
  choice: em meio a torturas
  rationale: Mantém o plural e apresenta as torturas como a circunstância em que as vozes são ouvidas, sem especificar além do grego.
- source_word: μητέρα φωνούντων
  choice: chamam pela mãe
  rationale: φωνέω indica aqui chamar ou clamar; “chamar pela mãe” é idiomático, emocionalmente adequado e preserva a mãe como destinatária do clamor.
theological_decisions:
- issue: Comparação retórica com imagens mitológicas e poéticas
  choice: Manter no texto as referências explícitas às sereias e aos cisnes
  alternative: Generalizar como “melodias encantadoras” e “belas vozes”
  rationale: A força do contraste depende das imagens clássicas, que pertencem ao universo retórico do autor; preservá-las respeita o texto sem lhes atribuir valor doutrinário.
- issue: Identidade relacional de τέκνων diante de μητέρα
  choice: Traduzir τέκνων por “filhos”
  alternative: Traduzir por “crianças”
  rationale: “Filhos” evidencia a relação materna central à frase e permanece compatível com o sentido amplo do substantivo grego.
translation_notes:
  register: Português moderno, digno e acessível, com cadência retórica preservada pela construção “nem... nem... tanto... como”. “Timbre feminino” mantém a característica sonora do grego sem introduzir “charme” ou “sedução”, conceitos possíveis no contexto, mas não expressos diretamente.
