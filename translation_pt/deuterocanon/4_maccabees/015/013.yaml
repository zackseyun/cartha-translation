base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/013.yaml
  text: O sacred nature[a], and the affections of parents, and filial love toward parents, and nurture[b], and the unconquerable passions of mothers.
translation:
  language: pt
  text: Ó natureza sagrada[a], afetos dos pais, amor filial para com os pais, criação dos filhos e emoções indomáveis das mães![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vínculo natural” para “natureza”. O grego φύσις pode indicar tanto a própria natureza como a ordem natural manifestada nos afetos familiares.
    reason: lexical_alternative
  - marker: b
    text: “Emoções” traduz aqui sentimentos ou afetos muito fortes, não necessariamente desejos desordenados.
    reason: lexical_alternative
lexical_decisions:
- source_word: φύσις ἱερά
  choice: natureza sagrada
  rationale: Mantém a apóstrofe elevada e o sentido amplo de φύσις como natureza ou ordem natural, sem reduzir a expressão apenas a um sentimento específico.
- source_word: φίλτρα γονέων
  choice: afetos dos pais
  rationale: No contexto familiar, φίλτρα designa laços de afeto ou manifestações de amor; evita-se o sentido mágico, possível em outros contextos.
- source_word: γονεύσιν φιλοστόργε
  choice: amor filial para com os pais
  rationale: φιλοστόργος expressa afeição terna própria dos vínculos familiares, e o dativo γονεύσιν indica que essa afeição se dirige aos pais. A formulação nominal é natural na sequência exclamativa portuguesa.
- source_word: τροφεῖα
  choice: criação dos filhos
  rationale: A expressão comunica de modo claro o cuidado e o sustento envolvidos em criar uma criança, adequados ao contexto dos vínculos entre pais e filhos.
- source_word: μητέρων ἀδάμαστα πάθη
  choice: emoções indomáveis das mães
  rationale: ἀδάμαστα indica aquilo que não pode ser domado ou vencido, enquanto πάθη aqui são emoções intensas. “Emoções” evita a possível conotação sexual ou moralmente desordenada de “paixões” no português atual.
theological_decisions:
- issue: Se o versículo afirma uma doutrina sobre uma ordem familiar santificada ou faz uma exclamação retórica acerca dos vínculos naturais da família
  choice: Uma exclamação retórica que enaltece o caráter sagrado e a força dos afetos familiares naturais
  alternative: Um lamento que invoca a força dos vínculos maternos e paternos sem qualificá-los como sagrados
  rationale: A abertura com Ὦ e a série de expressões coordenadas formam uma apóstrofe retórica elevada. Traduzir ἱερά por “sagrada” preserva a avaliação do autor sem transformar a frase numa formulação doutrinária.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com cadência exclamativa. A repetição de “ó” diante de cada elemento foi evitada para conservar fluidez, embora toda a série permaneça sob a força da apóstrofe inicial.
