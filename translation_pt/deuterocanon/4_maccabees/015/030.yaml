  text: O more noble than males in courage[a], and more manly than men in endurance.
translation:
  language: pt
  text: Ó mulher, mais nobre do que os do sexo masculino em coragem e mais viril[a] do que os homens em perseverança!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mais corajosa”. O grego diz literalmente “mais viril do que os homens”, preservando um jogo retórico com uma virtude culturalmente associada aos homens.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρρένων
  choice: os do sexo masculino
  rationale: O termo designa o sexo masculino de modo mais básico que ἀνήρ. A expressão, embora um pouco marcada, preserva a distinção deliberada em relação a ἀνδρῶν (“homens”) na segunda oração.
- source_word: πρὸς καρτερίαν
  choice: em firmeza
  rationale: καρτερία indica firmeza, fortaleza ou resistência resoluta. “Em firmeza” conserva o valor da virtude e se encaixa naturalmente na construção comparativa.
- source_word: γενναιοτέρα
  choice: mais nobre
  rationale: O comparativo pode expressar nobreza, bravura e elevação de caráter. “Mais nobre” preserva a amplitude moral do termo sem reduzi-lo apenas à coragem.
- source_word: ἀνδρῶν
  choice: homens
  rationale: ἀνήρ designa normalmente homens adultos e aqui sustenta o contraste retórico com ἀρρένων.
- source_word: πρὸς ὑπομονὴν
  choice: em perseverança
  rationale: ὑπομονή denota perseverança ou resistência paciente sob provação; “perseverança” é claro, digno e corrente em português.
- source_word: ἀνδρειοτέρα
  choice: mais viril
  rationale: O adjetivo deriva de ἀνήρ e evoca uma coragem culturalmente associada ao homem. “Mais viril” preserva o jogo retórico entre ἀνδρειοτέρα e ἀνδρῶν, ainda que seu sentido possa ser expresso de forma mais idiomática como “mais corajosa”.
theological_decisions:
- issue: Retórica comparativa de gênero no elogio à mãe
  choice: Manter explicitamente a comparação com o sexo masculino e a formulação “mais viril do que os homens”.
  alternative: Neutralizar como “mais corajosa do que todos” ou simplesmente “superior em perseverança”.
  rationale: 'O grego realiza uma inversão retórica deliberada: uma mulher é elogiada por superar os homens em virtudes culturalmente codificadas como masculinas. Neutralizar o gênero apagaria parte essencial da força literária.'
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leitura natural no Brasil. “Os do sexo masculino” é deliberadamente mais formal para preservar a diferença lexical entre ἀρρένων e ἀνδρῶν; “mais viril” mantém o jogo de palavras e recebe nota explicativa.
