base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/023.yaml
  text: But devout reason[a], strengthening her inward affections even in those very sufferings[b], strained to disregard her temporary love for her children.
translation:
  language: pt
  text: Mas a razão piedosa[a], fortalecendo os afetos mais íntimos dela em meio àqueles mesmos sofrimentos, esforçou-se para deixar de lado seu amor passageiro pelos filhos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «razão devota». No grego, esta é uma expressão central em 4 Macabeus para a razão orientada pela reverência a Deus.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «amor passageiro pelos filhos» ou «afeição materna transitória». O texto contrasta o vínculo materno natural com a fidelidade mantida em meio ao sofrimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  choice: afetos mais íntimos
  rationale: O termo designa literalmente as partes internas do corpo e, em sentido figurado, os sentimentos profundos. A expressão conserva algo da interioridade da metáfora sem soar anatômica ou obscura.
- source_word: εὐσεβὴς λογισμός
  choice: razão piedosa
  rationale: Expressão programática de 4 Macabeus para a razão orientada pela reverência a Deus. A tradução preserva tanto o aspecto racional quanto o religioso.
- source_word: ἐν αὐτοῖς τοῖς πάθεσιν
  choice: em meio àqueles mesmos sofrimentos
  rationale: Neste contexto, πάθη se refere aos sofrimentos ou tormentos, e não meramente a paixões interiores; «aqueles mesmos» reproduz a ênfase grega.
- source_word: ἀνδρειώσας
  choice: fortalecendo
  rationale: O particípio indica tornar valente ou corajoso. «Fortalecendo» é natural em português e comunica a firmeza conferida aos afetos durante a provação.
- source_word: ἐτέτεινεν
  choice: esforçou-se
  rationale: O verbo sugere tensão, extensão ou empenho intenso. A forma reflexiva expressa em português o esforço volitivo sem recorrer a uma imagem pouco natural.
- source_word: τὴν πρόσκαιρον φιλοτεκνίαν
  choice: seu amor passageiro pelos filhos
  rationale: φιλοτεκνία é a afeição pelos próprios filhos, enquanto πρόσκαιρον a caracteriza como pertencente ao tempo presente ou transitório. «Passageiro» preserva o contraste sem apresentar o amor materno como mau em si.
- source_word: παροδεῖν
  choice: deixar de lado
  rationale: O infinitivo significa passar ao largo, não levar em conta ou desconsiderar. «Deixar de lado» comunica uma renúncia deliberada em linguagem corrente e digna.
theological_decisions:
- issue: Tradução da expressão central εὐσεβὴς λογισμός
  choice: razão piedosa
  alternative: razão devota
  rationale: A formulação mantém unidos o exercício da razão e sua orientação reverente para Deus, sem introduzir categorias filosóficas ou confessionais posteriores.
- issue: Sentido de πρόσκαιρον φιλοτεκνίαν
  choice: seu amor passageiro pelos filhos
  alternative: sua afeição materna transitória
  rationale: O adjetivo estabelece um contraste entre o vínculo natural ligado à vida presente e a fidelidade mantida no sofrimento; não afirma que o amor pelos filhos seja intrinsecamente condenável.
- issue: Agência sintática de ὁ εὐσεβὴς λογισμός
  choice: a razão piedosa como sujeito que fortalece e se empenha
  alternative: os afetos dela como sujeito, fortalecidos pela razão piedosa
  rationale: No grego, ὁ εὐσεβὴς λογισμός está no nominativo e ἀνδρειώσας concorda com ele, favorecendo sua função de sujeito. A tradução torna essa relação clara sem eliminar a tensão figurada da frase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Afetos mais íntimos» evita um literalismo anatômico; «em meio àqueles mesmos sofrimentos» conserva a ênfase do grego; e «amor passageiro» mantém deliberadamente a tensão do texto sem depreciar a maternidade.
