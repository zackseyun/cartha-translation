revisions:
- from: Embora visse a perdição dos seus sete filhos e a complexa variedade das torturas, a nobre mãe superou tudo isso[a] por causa de sua fé em Deus.[b]
  to: Embora visse a destruição de seus sete filhos e a intrincada variedade das torturas, a nobre mãe, depois de abraçar a todos eles[a], deixou-os ir por causa de sua fé em Deus.[b]
  rationale: 'A revisão restaura a construção participial e o verbo principal do grego: a mãe abraça, cumprimenta ou se despede de todos os filhos e os deixa ir. A nota preserva a incerteza lexical de ἀσπάζομαι sem transformar a ação em uma vitória psicológica não expressa pelo texto. ''Embora visse'' conserva a força concessiva de καίπερ e o particípio presente ὁρῶσα; ''fé em Deus'' oferece uma formulação portuguesa natural para πρὸς θεὸν πίστιν.'
