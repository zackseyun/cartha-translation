base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/024.yaml
  text: Even while seeing the destruction of her seven children and the intricate variety of the tortures[a], the noble mother, after embracing them all[b], let them go because of her faith toward God.
translation:
  language: pt
  text: Embora visse a destruição de seus sete filhos e a intrincada variedade das torturas, a nobre mãe, depois de abraçar a todos eles[a], deixou-os ir por causa de sua fé em Deus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo também pode significar “cumprimentar a todos eles” ou “despedir-se de todos eles”.
    reason: lexical_alternative
  - marker: b
    text: Ou “por causa de sua confiança em Deus” ou “por causa de sua fidelidade a Deus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: Embora
  rationale: 'Introduz de modo natural a concessão: aquilo que a mãe presenciou não a impediu de permanecer firme.'
- source_word: ἑπτὰ τέκνων
  choice: dos seus sete filhos
  rationale: τέκνα é literalmente mais amplo, mas o contexto identifica os sete como filhos dela; a forma possessiva é natural em português.
- source_word: ἀπώλειαν
  choice: perdição
  rationale: Preserva o sentido forte de destruição ou perda fatal sem reduzir explicitamente o substantivo a “morte”.
- source_word: τὴν τῶν στρεβλῶν πολύπλοκον ποικιλίαν
  choice: a complexa variedade das torturas
  rationale: Expressa tanto a multiplicidade quanto a complexidade dos suplícios; “torturas” comunica em português corrente o valor contextual de στρεβλά.
- source_word: ἡ γενναία μήτηρ
  choice: a nobre mãe
  rationale: γενναία reúne ideias de nobreza moral e coragem; “nobre” conserva essa elevação elogiosa.
- source_word: ἀπάσασα … ἐξελυσεν
  choice: superou tudo isso
  rationale: A sequência transmitida é difícil e não sustenta com segurança a ideia de abraçar ou despedir-se dos filhos. Pelo contexto e pela imagem de desfazer ou soltar expressa por ἐξέλυσεν, “superou tudo isso” oferece uma tradução contextual inteligível sem criar uma cena ausente do grego.
- source_word: διὰ τὴν πρὸς θεὸν πίστιν
  choice: por causa de sua fé em Deus
  rationale: διά com acusativo indica causa; “fé em Deus” é a expressão portuguesa natural para a orientação relacional marcada por πρὸς θεόν.
theological_decisions:
- issue: Sentido de πίστις
  choice: fé
  alternative: confiança; fidelidade
  rationale: “Fé” preserva o termo teológico amplo e a ambiguidade entre confiança e firme fidelidade; as alternativas são registradas em nota.
- issue: Agência da mãe diante dos sofrimentos
  choice: superou tudo isso
  alternative: desfez tudo isso; não se deixou abalar por nada disso; desconsiderou tudo isso
  rationale: A formulação evita atribuir insensibilidade à mãe e apresenta sua vitória como resultado da fé, sem acrescentar o abraço ou a despedida sugeridos pela camada inglesa, mas não sustentados claramente pela forma grega fornecida.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente para leitores brasileiros e compreensão internacional. “Perdição” mantém solenidade sem arcaísmo excessivo; “superou tudo isso” esclarece uma construção grega difícil, cuja incerteza é preservada em nota.
