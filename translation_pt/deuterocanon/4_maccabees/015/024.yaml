  naturalness: A revisão mantém um português moderno, fluente e digno. 'Deixou-os ir' torna inteligível o sentido contextual de ἐξέλυσεν sem sugerir que a mãe aprovasse ou causasse a morte dos filhos.
  terminology: '''Destruição'' traduz ἀπώλεια de modo mais direto que ''perdição'', termo que em português pode adquirir conotações morais ou religiosas não exigidas aqui. ''Fé em Deus'' é natural e conserva πίστις; as alternativas relevantes permanecem em nota.'
