  text: But the mother urged each son individually[a], and all of them together[b], toward death for the sake of godliness.
translation:
  language: pt
  text: Mas a mãe exortava cada filho individualmente[a], e a todos juntos, a morrer por causa da devoção a Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «um por um ... todos juntos». O grego contrasta a exortação dirigida a cada filho separadamente com a dirigida a todos como grupo.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «uma morte de devoção a Deus». A expressão também pode indicar uma morte suportada por causa da piedade ou reverência a Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Mas
  rationale: Marca a continuação com leve contraste ou ênfase, sem sobrecarregar a frase com um «também» pouco natural aqui.
- source_word: καθʼ ἕνα παῖδα
  choice: cada filho individualmente
  rationale: Preserva a força distributiva de καθʼ ἕνα; «filho» explicita corretamente que os παῖδες são os filhos homens da mãe neste contexto.
- source_word: ὁμοῦ πάντας
  choice: todos juntos
  rationale: Conserva tanto a totalidade expressa por πάντας quanto a ideia de grupo expressa por ὁμοῦ.
- source_word: ἡ μήτηρ
  choice: a mãe
  rationale: Correspondência direta e natural.
- source_word: ἐπὶ ... προέτρεπεν
  choice: exortava ... a enfrentar
  rationale: «Exortava» comunica o incentivo insistente de προέτρεπεν; «a enfrentar» torna natural em português a orientação para o destino indicado por ἐπὶ com acusativo, sem sugerir que a mãe causava diretamente a morte.
- source_word: τὸν ... θάνατον
  choice: a morte
  rationale: Mantém o termo simples do grego, sem substituí-lo interpretativamente por «martírio».
- source_word: τῆς εὐσεβείας
  choice: por causa da devoção a Deus
  rationale: Expressa em linguagem clara a relação do genitivo com a morte e o sentido religioso de εὐσέβεια no livro, preservando em nota a formulação atributiva possível.
theological_decisions:
- issue: Sentido de εὐσέβεια no contexto de morte fiel
  choice: devoção a Deus
  alternative: piedade; reverência a Deus
  rationale: «Devoção a Deus» é clara no português moderno e mantém a dimensão religiosa da palavra sem introduzir terminologia confessional específica.
- issue: Relação do genitivo τῆς εὐσεβείας com θάνατον
  choice: morte por causa da devoção a Deus
  alternative: morte caracterizada pela devoção a Deus
  rationale: O genitivo admite mais de uma nuance. O texto principal adota a relação causal/final mais provável no contexto, enquanto a nota preserva a alternativa atributiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção evita «instava-os rumo à morte», que seria excessivamente literal e menos natural, e conserva por notas as ambiguidades genuínas do grego.
