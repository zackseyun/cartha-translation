base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/022.yaml
  text: How greatly and how many times, then, was the mother tortured with torments while her sons were being tortured with wheels and cauteries?
translation:
  language: pt
  text: Quão intensamente e quantas vezes, então, a mãe era atormentada por tormentos[a], enquanto os filhos eram torturados com rodas e ferros em brasa[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “era torturada com torturas”. O grego repete formas da mesma raiz para dar força retórica.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “cautérios”, isto é, instrumentos ardentes usados para queimar ou cauterizar; também se pode traduzir por “instrumentos de queimar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πηλίκοις
  choice: quão intensamente
  rationale: O adjetivo interrogativo/exclamativo é usado para ressaltar a grandeza ou intensidade dos tormentos; a formulação adverbial é natural em português e mantém a força retórica.
- source_word: πόσαις
  choice: quantas vezes
  rationale: Em paralelo com πηλίκοις e no contexto dos tormentos, exprime sua multiplicidade ou repetição. A opção preserva o sentido iterativo sem tornar a frase excessivamente literal.
- source_word: τότε
  choice: então
  rationale: Marca o momento narrativo e a transição retórica de modo conciso.
- source_word: ἡ μήτηρ
  choice: a mãe
  rationale: Mantém o artigo do grego sem acrescentar um possessivo não expresso, embora o contexto identifique de quem ela é mãe.
- source_word: βασανιζομένων
  choice: eram torturados
  rationale: O particípio descreve sofrimento físico infligido aos filhos pelos instrumentos mencionados e tem valor contínuo em relação ao verbo principal.
- source_word: τροχοῖς
  choice: rodas
  rationale: Tradução direta do plural grego, sem substituí-lo por uma identificação interpretativa como 'potros de tortura'.
- source_word: καυτηρίοις
  choice: ferros em brasa
  rationale: Expressão clara e corrente para instrumentos que queimam ou cauterizam; evita o tecnicismo pouco transparente 'cautérios', sem restringir necessariamente o termo a ferros de marcar.
- source_word: ἐβασανίζετο
  choice: era atormentada
  rationale: O imperfeito comunica sofrimento contínuo. 'Atormentada' afirma a intensidade do sofrimento da mãe sem declarar que os mesmos instrumentos foram aplicados fisicamente a ela.
- source_word: βασάνοις
  choice: por tormentos
  rationale: Conserva a repetição retórica entre o verbo e o substantivo cognatos, ainda que ela soe marcada em português, como também ocorre no grego.
theological_decisions:
- issue: Natureza do sofrimento da mãe
  choice: A mãe é descrita como verdadeiramente e intensamente atormentada enquanto presencia a tortura dos filhos, sem se afirmar que os instrumentos foram aplicados a ela.
  alternative: Entender que a própria mãe sofreu tortura física pelos mesmos instrumentos, ou reduzir a expressão a mera tristeza emocional.
  rationale: As rodas e os instrumentos ardentes estão ligados sintaticamente aos filhos. A linguagem repetida da raiz βασαν-, porém, atribui à mãe sofrimento extremo; a tradução mantém essa tensão sem definir seu mecanismo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção deliberadamente enfática “atormentada por tormentos” preserva a repetição retórica do grego; “ferros em brasa” comunica com clareza o instrumento sem recorrer a um termo técnico obscuro.
