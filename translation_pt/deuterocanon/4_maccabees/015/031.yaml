  yaml_path: translation/deuterocanon/4_maccabees/015/031.yaml
  text: For just as Noah’s ark[a], being borne along in the world-filling flood, steadfastly endured the waves,
translation:
  language: pt
  text: Pois, assim como a arca de Noé, levada pelo dilúvio que encheu o mundo,[a] suportou firmemente as ondas,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “levada no dilúvio que encheu o mundo”.'
    reason: A construção grega também pode ser expressa com o particípio ligado diretamente ao âmbito do dilúvio.
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Pois, assim como
  rationale: Mantém tanto a ligação explicativa de γάρ quanto a introdução explícita da comparação por καθάπερ, em português natural.
- source_word: ἡ Νῶε κιβωτός
  choice: a arca de Noé
  rationale: É a designação bíblica consagrada e identifica com clareza o referente de κιβωτός neste contexto.
- source_word: ἐν τῷ κοσμοπληθεῖ κατακλυσμῷ
  choice: pelas águas do dilúvio que encheu o mundo
  rationale: Expressa a escala universal indicada pelo composto κοσμοπληθεῖ e integra de modo idiomático a esfera em que a arca era levada.
- source_word: κοσμοφορουμένη
  choice: levada pelas águas
  rationale: Preserva o sentido passivo e o movimento contínuo do particípio, sem impor uma direção ou uma causa mais específica do que o contexto permite.
- source_word: καρτερῶς
  choice: com firmeza
  rationale: Comunica resistência perseverante em linguagem atual e digna, conservando o motivo da constância enfatizado em 4 Macabeus.
- source_word: ὑπήνεγκεν
  choice: suportou
  rationale: Representa a ideia de aguentar sob pressão e combina naturalmente com o objeto 'as ondas'.
- source_word: τοὺς κλύδωνας
  choice: as ondas
  rationale: Transmite com clareza as águas agitadas ou vagas violentas designadas pelo termo, sem recorrer a vocabulário excessivamente literário.
theological_decisions:
- issue: A imagem do dilúvio de Noé como comparação tipológica
  choice: Manter a comparação de forma direta, sem explicitar um simbolismo adicional.
  alternative: Ampliar a imagem como símbolo específico do martírio ou da salvação.
  rationale: O texto emprega a arca como analogia de resistência firme; a tradução conserva essa função sem acrescentar uma interpretação doutrinária não declarada neste trecho.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A vírgula final foi mantida porque o versículo introduz uma comparação que prossegue no contexto seguinte.
