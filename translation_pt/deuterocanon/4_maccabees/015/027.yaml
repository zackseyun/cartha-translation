  text: I did not recognize the salvation that was saving seven sons for a little while[a].
translation:
  language: pt
  text: Não reconheci a salvação que preservava sete filhos por pouco tempo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não reconheci o livramento que preservava sete filhos por breve tempo.”'
    reason: Registra uma tradução contextual alternativa para σωτηρία e σώζουσαν, destacando a ideia de preservação temporária.
lexical_decisions:
- source_word: οὐκ ἐπέγνων
  choice: Não reconheci
  rationale: Preserva o sentido de não reconhecer ou não perceber plenamente aquilo que estava diante da pessoa, sem limitar o verbo à mera compreensão intelectual.
- source_word: τὴν σώζουσαν ... σωτηρίαν
  choice: a salvação que salvava
  rationale: Mantém a repetição intencional da mesma raiz grega em σώζουσαν e σωτηρίαν. Embora a repetição seja marcante em português, ela é compreensível e conserva o peso retórico e a possível ressonância teológica do original.
- source_word: ἑπτὰ υἱοὺς
  choice: sete filhos
  rationale: No contexto, υἱούς se refere especificamente aos sete filhos homens da mãe. Em português, “filhos” é a designação natural nesse contexto.
- source_word: πρὸς ὀλίγον χρόνον
  choice: por pouco tempo
  rationale: Expressa com naturalidade a duração limitada indicada pela frase grega, sem acrescentar uma interpretação sobre o desfecho.
theological_decisions:
- issue: Sentido de σωτηρία no contexto do martírio
  choice: salvação, com o sentido imediato de preservação temporária indicado pelo restante da frase
  alternative: livramento ou preservação, sem a ressonância mais ampla de “salvação”
  rationale: A expressão “por pouco tempo” põe em primeiro plano a preservação temporária da vida, mas σωτηρία também pode carregar um sentido mais amplo. “Salvação” preserva essa tensão, enquanto “que salvava” esclarece sua atuação imediata sem a resolver por completo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição “salvação que salvava” é deliberada para reproduzir a relação lexical e o efeito retórico do grego.
