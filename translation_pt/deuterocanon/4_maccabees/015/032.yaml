base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/032.yaml
  text: So you also[a], guardian of the law, though surrounded on every side by the flood of passions and pressed by the fierce winds of your sons’ torments[b], bravely endured the storms of godliness.
translation:
  language: pt
  text: Assim também você, guardiã da Lei, cercada por todos os lados pelo dilúvio das paixões[a] e acossada pelos ventos impetuosos das torturas de seus filhos, suportou corajosamente as tempestades da devoção a Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “emoções”; neste contexto, a palavra grega também pode ser entendida como “sofrimentos”. Em 4 Macabeus, ela é um termo importante para as paixões que a razão deve dominar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “tempestades da piedade”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νομοφύλαξ
  choice: guardiã da Lei
  rationale: O composto designa alguém que guarda ou protege a Lei. “Guardiã da Lei” é natural em português, conserva o sentido ativo e concorda com a mulher a quem o texto se dirige.
- source_word: πανταχόθεν
  choice: por todos os lados
  rationale: Com περικυκλουμένῃ, ressalta que ela estava cercada de todas as direções.
- source_word: τῶν παθῶν ... κατακλυσμῷ
  choice: dilúvio das paixões
  rationale: κατακλυσμός forma uma imagem intensa de inundação. πάθη é termo central em 4 Macabeus para impulsos e afetos que a razão deve dominar; “paixões” preserva melhor essa ligação temática do que uma paráfrase.
- source_word: καρτεροῖς ἀνέμοις
  choice: ventos impetuosos
  rationale: καρτερός expressa força ou severidade; “impetuosos” mantém viva a metáfora da tempestade.
- source_word: ταῖς τῶν υἱῶν βασάνοις
  choice: das torturas de seus filhos
  rationale: βάσανοι denota torturas ou tormentos. A formulação portuguesa conserva a construção genitiva e, no contexto, refere-se às torturas sofridas pelos filhos.
- source_word: συνεχομένη
  choice: acossada
  rationale: O particípio transmite a ideia de estar pressionada ou apertada por forças hostis; “acossada” combina naturalmente com a imagem dos ventos.
- source_word: γενναίως
  choice: corajosamente
  rationale: Comunica de modo atual e claro tanto a coragem quanto a nobre firmeza sugeridas pelo advérbio.
- source_word: ὑπέμεινας
  choice: suportou
  rationale: Expressa resistência perseverante sob provação sem acrescentar uma interpretação além do verbo grego.
- source_word: τοὺς τῆς εὐσεβείας χειμῶνας
  choice: as tempestades da devoção a Deus
  rationale: χειμών pode indicar inverno ou tempestade e aqui prolonga a metáfora náutica. εὐσέβεια indica reverência e fidelidade religiosa; “devoção a Deus” evita que “piedade” seja entendida apenas como compaixão.
theological_decisions:
- issue: Sentido de πάθη no contexto filosófico e martirológico
  choice: paixões
  alternative: emoções; sofrimentos
  rationale: O argumento recorrente de 4 Macabeus trata do domínio das paixões pela razão devota, favorecendo o sentido filosófico. A nota registra tanto uma equivalência moderna possível quanto o sentido de sofrimento que o contexto de martírio pode sugerir.
- issue: Sentido de εὐσέβεια
  choice: devoção a Deus
  alternative: piedade
  rationale: A expressão comunica reverência e fidelidade religiosa sem importar uma doutrina denominacional. A construção “tempestades da devoção a Deus” também mantém a relação genitiva aberta, sem decidir se as tempestades pertencem à devoção ou são enfrentadas por causa dela.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência de imagens — dilúvio, ventos e tempestades — foi preservada. “Lei” recebe inicial maiúscula por designar a Lei judaica neste contexto; “você” oferece tratamento direto e atual sem perder solenidade.
