  text: O only woman who gave birth to godliness in its fullness[a][b].
translation:
  language: pt
  text: Ó única mulher[a] que deste à luz a piedade em toda a sua plenitude[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mulher singular” ou “mulher, só tu”. O grego ressalta que ela se destaca de maneira única entre as mulheres nessa demonstração de devoção.
    reason: lexical_alternative
  - marker: b
    text: Ou “devoção a Deus em toda a sua plenitude”. Em 4 Macabeus, o termo grego traduzido por “piedade” designa a fidelidade reverente a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ
  choice: Ó
  rationale: Marca a invocação exclamativa e preserva o tom retórico elevado do grego.
- source_word: μόνη γύναι
  choice: única mulher
  rationale: Reproduz a ideia de singularidade expressa por μόνη no vocativo, sem interpretar γυνή especificamente como “esposa”.
- source_word: τὴν εὐσέβειαν
  choice: a piedade
  rationale: “Piedade” é um equivalente tradicional e amplo para εὐσέβεια, aqui entendida como fidelidade reverente a Deus; a nota registra uma alternativa mais explícita para leitores modernos.
- source_word: ὁλόκληρον
  choice: em toda a sua plenitude
  rationale: Expressa a inteireza e completude da piedade de modo natural em português, concordando semanticamente com o substantivo.
- source_word: ἀποκυήσασα
  choice: que deste à luz
  rationale: Mantém a metáfora materna explícita do particípio aoristo; a segunda pessoa é natural dentro da invocação direta.
theological_decisions:
- issue: Linguagem metafórica do parto aplicada à εὐσέβεια
  choice: 'Manter literalmente a imagem: “deste à luz a piedade”'
  alternative: “produziste uma piedade plena”
  rationale: O verbo grego pertence ao campo do parto, e a imagem materna é central ao contexto; substituí-la por “produzir” enfraqueceria deliberadamente a retórica.
- issue: Sentido religioso de εὐσέβεια
  choice: “piedade”, explicada como devoção fiel a Deus
  alternative: “devoção a Deus”
  rationale: “Piedade” preserva a concisão e a amplitude do termo grego, enquanto a nota evita que seja entendido apenas como compaixão ou pena.
translation_notes:
  register: Português moderno, solene e inteligível, com a invocação retórica “Ó” e a metáfora do parto preservadas. A formulação evita arcaísmos além da segunda pessoa verbal exigida naturalmente pelo tom de endereço direto.
