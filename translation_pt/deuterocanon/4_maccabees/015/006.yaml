  yaml_path: translation/deuterocanon/4_maccabees/015/006.yaml
  text: But of all mothers[a], the mother of the seven became the most devoted to her children, she who through seven pregnancies had her affection for them deeply planted within her;
translation:
  language: pt
  text: Mas, entre todas as mães, a mãe dos sete[a] foi a mais afeiçoada aos filhos, ela que, por meio de sete gestações, tinha o afeto por eles implantado em seu íntimo;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a mãe dos sete”. O contexto identifica os sete como seus filhos.
    reason: A expressão grega deixa implícito o substantivo que designa os sete; a tradução mantém essa concisão.
lexical_decisions:
- source_word: φιλοτεκνωτέρα
  choice: a mais dedicada aos filhos
  rationale: O comparativo, em relação a “todas as mães”, tem valor superlativo. A formulação comunica afeição excepcional pelos próprios filhos em português natural e digno.
- source_word: ἡ τῶν ἑπτὰ μήτηρ
  choice: a mãe dos sete
  rationale: Conserva a expressão elíptica do grego; o contexto identifica os sete como seus filhos.
- source_word: ἑπτὰ κυοφορίαις
  choice: ao longo de sete gestações
  rationale: Mantém a referência concreta às sete experiências de gestação, sem substituí-la pelo ato mais geral de dar à luz.
- source_word: ἐπιφυτευομένην
  choice: implantado em si
  rationale: Preserva a metáfora de algo plantado ou enxertado no íntimo dela, com construção portuguesa inteligível.
- source_word: φιλοστοργίαν
  choice: o afeto
  rationale: Expressa o carinho natural próprio dos vínculos familiares; o contexto materno torna desnecessário acrescentar “materno”.
- source_word: πρὸς αὐτούς
  choice: por eles
  rationale: Indica de maneira idiomática a direção do afeto para os sete filhos.
