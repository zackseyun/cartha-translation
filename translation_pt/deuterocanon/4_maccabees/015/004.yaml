base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/004.yaml
  text: Oh[a], how can I describe the child-loving affections of parents, who imprint the likeness of soul and form in the small, marvelous character of a child[c][b], especially since mothers make fathers more sympathetic toward their children who have been born.
translation:
  language: pt
  text: Ó, como poderia eu retratar os afetos dos pais por seus filhos, afetos que imprimem a semelhança da alma e da forma na pequena e admirável imagem infantil[a], sobretudo porque as mães se mostram mais sensíveis do que os pais para com os filhos que nasceram[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega também pode ser entendida como “pequeno e admirável cunho de criança” ou “impressão infantil”; ela prolonga a metáfora de gravar ou imprimir uma marca.
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente, “para com os que nasceram”; isto é, para com os filhos. O grego compara as mães aos pais: elas se mostram mais sensíveis para com os filhos.'
    reason: source_clarification
lexical_decisions:
- source_word: ἠθολογήσαιμι
  choice: poderia retratar
  rationale: O verbo elevado sugere apresentar ou delinear expressivamente um caráter ou sentimento; “retratar” preserva melhor essa força retórica do que o mais neutro “descrever”.
- source_word: φιλότεκνα ... πάθη
  choice: afetos dos pais por seus filhos
  rationale: A expressão indica sentimentos parentais profundos e amorosos dirigidos aos próprios filhos. A formulação é natural em português e evita o pouco idiomático “afetos amantes dos filhos”.
- source_word: ψυχῆς τε καὶ μορφῆς ὁμοιότητα
  choice: a semelhança da alma e da forma
  rationale: Mantém explicitamente tanto a semelhança interior quanto a exterior, sem reduzir ψυχή a mera personalidade nem μορφή apenas a aparência.
- source_word: παιδοχαρακτῆρα
  choice: imagem de uma criança
  rationale: O composto evoca a figura ou impressão distintiva de uma criança. “Imagem” funciona naturalmente com o verbo “imprimem”, enquanto a nota conserva a metáfora concreta de cunho ou marca gravada.
- source_word: ἐναποσφραγίζοντα
  choice: imprimem
  rationale: Preserva a metáfora de selar ou gravar uma impressão e produz uma construção portuguesa clara.
- source_word: συμπαθεστέρας
  choice: mais sensíveis para com
  rationale: O comparativo expressa maior participação afetiva, ternura ou empatia. “Mais sensíveis para com” comunica essa disposição emocional no contexto parental.
- source_word: τοῖς γεννηθεῖσιν
  choice: para com os filhos que nasceram
  rationale: O particípio significa literalmente “os que nasceram” e, no contexto, refere-se aos filhos; a explicitação evita uma expressão artificial sem perder o conteúdo.
theological_decisions:
- issue: Nuance antropológica em “semelhança da alma e da forma”
  choice: Conservar no texto tanto “alma” quanto “forma”
  alternative: Verter dinamicamente como “semelhança de caráter e aparência”
  rationale: O texto não formula necessariamente uma antropologia técnica, mas nomeia de modo explícito ψυχή e μορφή. Preservar os dois termos mantém a tensão entre a dimensão interior e a exterior.
- issue: Identificação do termo comparativo em συμπαθεστέρας τῶν πατέρων
  choice: 'Entender τῶν πατέρων como genitivo de comparação: as mães são mais sensíveis do que os pais'
  alternative: Entender que as mães tornam os pais mais sensíveis
  rationale: Na oração infinitiva, τὰς μητέρας é o sujeito acusativo de καθεστάναι, συμπαθεστέρας é seu predicativo comparativo e τῶν πατέρων fornece o padrão de comparação. Assim, o grego contrasta mães e pais; não apresenta as mães como agentes que transformam os pais.
translation_notes:
  register: Português moderno, claro e digno, com abertura retoricamente elevada. A sintaxe foi aliviada sem eliminar a metáfora da impressão nem o contraste explícito entre mães e pais.
