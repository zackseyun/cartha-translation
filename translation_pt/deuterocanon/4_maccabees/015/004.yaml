  to: Ó, como poderia eu retratar os afetos dos pais por seus filhos, afetos que imprimem a semelhança da alma e da forma na pequena e admirável imagem infantil[a], sobretudo porque as mães se mostram mais sensíveis do que os pais para com os filhos que nasceram[b]?
