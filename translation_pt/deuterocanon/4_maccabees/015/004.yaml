  naturalness: O registro é claro e adequadamente elevado. A reposição do complemento comparativo junto a “mais sensíveis” torna a última oração imediatamente compreensível. “Imagem infantil” é mais conciso e natural do que “imagem de uma criança”, sem eliminar a metáfora de impressão.
