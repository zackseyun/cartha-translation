  source_fidelity: A expressão τὰς καθʼ ἕκαστον αὐτῶν ὠδῖνας refere-se às muitas dores de parto associadas a cada filho, não às dores que cada filho sofreu. A redação proposta acerta a referência materna, mas «sofreu por cada um deles» pode sugerir sofrimento vicário ou em favor deles, em vez das dores do parto de cada nascimento.
