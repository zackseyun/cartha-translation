lexical_decisions:
- source_word: ὠδῖνας
  choice: dores de parto
  rationale: O termo designa propriamente as dores do parto e, no contexto da mãe e de seus filhos, convém preservar essa imagem materna concreta.
- source_word: καθʼ ἕκαστον αὐτῶν
  choice: por cada um deles
  rationale: A expressão distribui as dores maternas em relação a cada filho; evita atribuir as dores aos próprios filhos, o que o grego não afirma.
- source_word: συμπάθειαν
  choice: compaixão
  rationale: Expressa a participação afetiva no sofrimento alheio em português corrente e digno.
- source_word: ἠναγκασμένην ... ἔχειν
  choice: era compelida a sentir
  rationale: Reproduz a força de necessidade ou constrangimento de ἀναγκάζω sem sugerir mera preferência emocional.
theological_decisions:
- issue: Origem das dores mencionadas
  choice: As dores são entendidas como dores de parto sofridas pela mãe em relação a cada filho.
  alternative: As dores foram sofridas por cada um dos filhos.
  rationale: ὠδῖνας tem sentido primário de dores de parto, e καθʼ ἕκαστον αὐτῶν indica relação distributiva — “por cada um deles” —, não faz de cada filho o sujeito que sofreu essas dores.
translation_notes:
  register: Português moderno, natural e digno, com legibilidade brasileira. A redação mantém a estrutura de continuação do fragmento, inclusive a vírgula final, e conserva a intensidade tanto da imagem materna quanto da compulsão afetiva.
