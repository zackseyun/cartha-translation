base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/001.yaml
  text: O reasoning[a], tyrant over the passions of children! And godliness is to a mother more longed-for than children.
translation:
  language: pt
  text: Ó razão, tirana das paixões pelos filhos; para uma mãe, a piedade é mais desejável do que os filhos[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão grega é muito condensada. A primeira parte também pode ser entendida como: “Ó razão, tirana das paixões dos filhos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: λογισμέ
  choice: razão
  rationale: O vocativo dirige-se à faculdade racional, tema central de 4 Macabeus. “Razão” é natural em português e conserva o sentido filosófico de λογισμός.
- source_word: τέκνων παθῶν
  choice: dos afetos pelos filhos
  rationale: 'No contexto da mãe e de seus filhos, τέκνων pode funcionar como genitivo objetivo: os afetos dirigidos aos filhos. A construção grega é compacta, por isso a outra relação sintática possível é registrada em nota.'
- source_word: τύραννε
  choice: tirana
  rationale: Mantém a metáfora forte de τύραννος e concorda naturalmente com “razão” em português; expressa o domínio rigoroso da razão sobre os afetos.
- source_word: εὐσέβεια
  choice: piedade
  rationale: Neste contexto judaico, indica devoção reverente e fidelidade a Deus. “Piedade” preserva a dimensão religiosa sem acrescentar formulação doutrinária.
- source_word: ποθεινοτέρα
  choice: mais desejável
  rationale: O comparativo descreve aquilo que é mais almejado ou estimado. “Mais desejável” é claro e mantém a comparação explícita com os filhos.
- source_word: μητρὶ τέκνων
  choice: para uma mãe do que os próprios filhos
  rationale: O dativo μητρί indica a pessoa para quem a piedade é mais desejável, e o genitivo τέκνων marca o segundo termo da comparação. “Próprios” apenas torna natural em português a referência aos filhos da mãe.
theological_decisions:
- issue: Relação entre a razão e os afetos maternos
  choice: A razão é chamada de “tirana dos afetos pelos filhos”
  alternative: A razão é “tirana das paixões dos filhos”
  rationale: O contexto favorece os afetos da mãe dirigidos aos filhos, mas a sintaxe condensada permite a leitura alternativa; a nota preserva essa ambiguidade.
- issue: Sentido religioso de εὐσέβεια
  choice: piedade
  alternative: devoção a Deus
  rationale: “Piedade” mantém a formulação concisa e a abrangência do termo grego, sem explicitar no corpo do texto mais do que a expressão original.
- issue: Força retórica da construção
  choice: Tratar razão e piedade como objetos da mesma exclamação
  alternative: Dividir em duas declarações independentes
  rationale: O ὦ inicial e o caráter encomiástico do período favorecem uma exclamação coordenada; a repetição portuguesa de “ó” esclarece a estrutura sem eliminar sua intensidade.
translation_notes:
  register: Português moderno, claro e solene. A exclamação e a metáfora ousada do original foram preservadas, com leve explicitação sintática para fluência.
