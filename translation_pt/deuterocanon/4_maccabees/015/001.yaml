    rationale: Embora a relação maternal esteja implícita, «os filhos» traduz τέκνων sem intensificação interpretativa.
  - severity: low
    issue: «afetos» atenua o campo semântico filosófico de πάθη.
    rationale: «Paixões» é o correspondente mais direto e mantém a terminologia recorrente de 4 Macabeus.
