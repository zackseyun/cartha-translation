  source_fidelity: 'A primeira ocorrência de τέκνων pode, no contexto, ser entendida como genitivo objetivo, isto é, as paixões/afetos voltados aos filhos; a nota preserva a leitura alternativa, «as paixões dos filhos». A segunda ocorrência integra claramente a comparação: a piedade é mais desejável para uma mãe do que os filhos. Convém não converter εὐσέβεια, que está no nominativo, em um segundo vocativo português.'
  naturalness: «Paixões pelos filhos» comunica melhor o vocabulário ético-filosófico de πάθη do que «afetos», sem perder a referência ao vínculo materno. A oração explícita «para uma mãe, a piedade é...» é natural em português contemporâneo e conserva a concisão elevada do original.
  terminology: «Razão» é adequado para λογισμός neste contexto. «Tirana» mantém deliberadamente a metáfora intensa de τύραννος. «Piedade» é uma opção estabelecida e suficientemente ampla para εὐσέβεια; o contexto define seu sentido de devoção reverente, não de compaixão.
  issues:
  - severity: low
    issue: «Ó piedade» transforma o nominativo εὐσέβεια em vocativo.
    rationale: O grego só introduz λογισμέ com ὦ; εὐσέβεια funciona como o sujeito nominal da comparação. A revisão preserva essa distinção sintática.
  - severity: low
