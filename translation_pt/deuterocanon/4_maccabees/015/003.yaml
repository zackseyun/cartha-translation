translation:
  language: pt
  text: Ela amou mais a piedade que salva para a vida eterna de acordo com Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que salva para a vida eterna segundo Deus”. A expressão grega pode indicar conformidade com a vontade ou o padrão de Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσέβειαν
  choice: piedade
  rationale: Preserva o sentido temático de devoção reverente a Deus expressa em conduta fiel. Embora “devoção a Deus” seja possível, “piedade” mantém a concisão e o caráter de virtude do termo grego.
- source_word: μᾶλλον
  choice: mais
  rationale: Marca a preferência comparativa em relação ao vínculo natural pressuposto pelo contexto, sem inserir essa comparação no verbo.
- source_word: ἠγάπησεν
  choice: amou
  rationale: Verte diretamente o verbo grego; a ideia de preferência já é expressa por μᾶλλον.
- source_word: τὴν σώζουσαν
  choice: que salva
  rationale: Reproduz de modo direto e natural o particípio atributivo feminino que retoma “piedade”.
- source_word: εἰς αἰώνιον ζωὴν
  choice: para a vida eterna
  rationale: Expressa em português corrente a direção, finalidade ou resultado indicado por εἰς.
- source_word: κατὰ θεόν
  choice: segundo Deus
  rationale: Mantém a formulação condensada do grego e preserva sua ambiguidade quanto à conformidade com a vontade, o padrão ou a aprovação de Deus.
theological_decisions:
- issue: Sentido de κατὰ θεόν em relação à piedade e à salvação
  choice: segundo Deus
  alternative: em conformidade com Deus; como Deus quer; diante de Deus
  rationale: A tradução relativamente formal evita decidir se a expressão indica a vontade, o padrão ou a aprovação de Deus, preservando a tensão do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. “Piedade” é empregado no sentido de devoção reverente e fidelidade a Deus, não no sentido de compaixão. A ordem da frase acompanha de perto o grego sem eliminar a ambiguidade de “segundo Deus”.
