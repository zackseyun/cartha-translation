base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/029.yaml
  text: O mother of the nation[a], avenger of the law, defender of godliness[b], and prizewinner in the struggle through motherly affections.
translation:
  language: pt
  text: Ó mãe da nação[a], vingadora da Lei, defensora da devoção a Deus e campeã na luta por meio de seus afetos maternos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mãe do povo” ou “mãe da raça”; o grego ἔθνος pode designar uma nação, um povo ou um grupo étnico.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega é condensada e diz, mais literalmente, “portadora do prêmio da luta por meio das entranhas”. “Entranhas” representa os sentimentos mais profundos, aqui especialmente o afeto e a compaixão de mãe.
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ ἔθνους
  choice: mãe da nação
  rationale: Mantém o vocativo elevado e o sentido coletivo de ἔθνος, sem restringi-lo necessariamente à etnia.
- source_word: ἔκδικε τοῦ νόμου
  choice: vingadora da Lei
  rationale: ἔκδικος designa quem reivindica justiça ou toma a defesa de uma causa; “vingadora” conserva a força retórica do grego. A maiúscula em “Lei” assinala a Torá neste contexto judaico.
- source_word: ὑπερασπίστεια τῆς εὐσεβείας
  choice: defensora da devoção a Deus
  rationale: Expressa a proteção ativa indicada pelo raro feminino ὑπερασπίστεια e torna explícito o referente religioso de εὐσέβεια sem recorrer ao termo potencialmente estreito “piedade”.
- source_word: διὰ σπλάγχνων ἀγῶνος
  choice: na luta travada em meio aos afetos maternos
  rationale: Preserva a imagem de um combate moral relacionado aos sentimentos profundos; “maternos” é inferido com segurança pelo contexto imediato da mãe, enquanto “em meio a” mantém aberta a relação exata expressa por διά.
- source_word: ἀθλοφόρε
  choice: vencedora premiada
  rationale: O termo pertence à linguagem atlética e descreve quem conquista e leva o prêmio; a formulação conserva tanto a vitória quanto a noção de prêmio.
theological_decisions:
- issue: Sentido religioso de εὐσέβεια
  choice: devoção a Deus
  alternative: piedade; reverência
  rationale: No contexto de fidelidade à Lei e do martírio judaico, o termo abrange reverência religiosa demonstrada na conduta. A tradução evita tanto uma leitura meramente sentimental quanto terminologia confessional posterior.
- issue: Relação de διά em διὰ σπλάγχνων ἀγῶνος
  choice: luta travada em meio aos afetos maternos
  alternative: luta por causa dos afetos maternos; luta mediante os afetos maternos; luta contra os afetos maternos
  rationale: A expressão grega é condensada e pode indicar o âmbito, a mediação ou a circunstância do combate. “Em meio aos” preserva a tensão entre o amor materno e a perseverança sem afirmar que ela combateu simplesmente contra ou por meio dele.
translation_notes:
  register: Português moderno, solene e inteligível, com paralelismo honorífico. “Ó” preserva o vocativo retórico; “Lei” identifica a Lei judaica no contexto. A frase final mantém a metáfora atlética e a ambiguidade controlada da relação entre a luta e os afetos maternos.
