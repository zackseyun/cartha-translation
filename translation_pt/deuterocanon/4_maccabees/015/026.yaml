translation:
  language: pt
  text: 'uma mãe que tinha nas mãos dois votos[a] em favor dos filhos: um que trazia a morte e outro que trazia livramento,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “duas pedrinhas”; ψῆφος designava a pedra usada para dar um voto e, por extensão, o próprio voto.
    reason: lexical_alternative
lexical_decisions:
- source_word: δύο
  choice: dois
  rationale: Numeral cardinal que modifica ψήφους.
- source_word: ψήφους
  choice: votos
  rationale: ψῆφος designava originalmente a pequena pedra usada numa votação e, por extensão, o voto dado. “Votos” comunica com naturalidade a imagem de duas decisões contrapostas, enquanto a nota preserva a imagem concreta original.
- source_word: κρατοῦσα
  choice: tinha nas mãos
  rationale: Expressa de modo natural e concreto a ideia de segurar ou ter sob seu poder, preservando a imagem de posse decisiva.
- source_word: μήτηρ
  choice: uma mãe
  rationale: Mantém o substantivo anartro e a ênfase materna em português idiomático.
- source_word: θανατηφόρον
  choice: que trazia a morte
  rationale: Reproduz o sentido de “portador de morte” e forma um contraste verbal claro com σωτήριον.
- source_word: σωτήριον
  choice: que trazia livramento
  rationale: Comunica aquilo que salva ou preserva sem impor ao termo, isoladamente, um sentido soteriológico técnico.
- source_word: ὑπὲρ τέκνων
  choice: em favor dos filhos
  rationale: Preserva a noção de uma decisão tomada em benefício ou em defesa dos filhos. O grego não traz pronome possessivo explícito, por isso “dos filhos” evita acrescentá-lo desnecessariamente.
theological_decisions:
- issue: Sentido de σωτήριον no contexto do martírio
  choice: que trazia livramento
  alternative: que trazia salvação
  rationale: “Livramento” mantém o contraste entre morte e preservação sem definir além do que esta oração explicita a natureza dessa salvação.
translation_notes:
  register: Português moderno, claro e digno, com imagem concreta em “tinha nas mãos”. A estrutura paralela “um que trazia... e outro que trazia...” preserva o contraste retórico do grego. A vírgula final foi mantida porque o fragmento continua no versículo seguinte ou no contexto sintático maior.
