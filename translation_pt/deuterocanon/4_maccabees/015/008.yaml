  yaml_path: translation/deuterocanon/4_maccabees/015/008.yaml
  text: Because of her fear toward God[a], she disregarded the temporary safety of her children.
translation:
  language: pt
  text: Por causa do seu temor a Deus, ela não levou em conta o livramento temporário[a] de seus filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “salvação temporária” ou “preservação temporária”. Aqui, a palavra grega σωτηρία se refere à preservação física de curto prazo, não à salvação eterna.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸν ... φόβον
  choice: Por causa do seu temor
  rationale: διά com acusativo indica causa. “Temor” preserva a força de φόβος e, por ter Deus como objeto, comunica temor reverente sem reduzi-lo a simples respeito.
- source_word: πρὸς τὸν θεόν
  choice: a Deus
  rationale: Após φόβον, πρός com acusativo expressa a orientação desse temor. Em português, “temor a Deus” é a formulação natural e fiel.
- source_word: ὑπερεῖδεν
  choice: não levou em conta
  rationale: O verbo indica olhar além de algo ou não lhe dar consideração. A expressão mostra que a mãe subordinou o livramento imediato dos filhos a uma lealdade maior, sem sugerir que ela simplesmente não o percebeu.
- source_word: τὴν ... σωτηρίαν
  choice: o ... livramento
  rationale: Neste contexto, σωτηρία se refere ao resgate físico da tortura e da morte. “Livramento” mantém o sentido concreto sem sugerir necessariamente salvação eterna.
- source_word: πρόσκαιρον
  choice: temporário
  rationale: O adjetivo limita o livramento ao presente e ao que dura apenas por algum tempo.
- source_word: τῶν τέκνων
  choice: de seus filhos
  rationale: τέκνα significa “filhos” ou “crianças”; o possessivo, implícito no contexto, é necessário para uma formulação portuguesa natural.
theological_decisions:
- issue: Sentido de φόβος em relação a Deus
  choice: temor a Deus
  alternative: reverência por Deus
  rationale: “Temor” conserva a categoria bíblica mais forte e a tensão do termo grego, enquanto a referência a Deus indica seu caráter reverente.
- issue: Sentido de σωτηρία neste contexto
  choice: livramento físico temporário
  alternative: salvação ou preservação temporária
  rationale: πρόσκαιρον e o contexto dos martírios apontam para a conservação imediata da vida, não para salvação eterna; a nota preserva a amplitude lexical do grego.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A construção causal e o contraste entre temor a Deus e livramento apenas temporário foram preservados.
