  yaml_path: translation/deuterocanon/4_maccabees/015/005.yaml
  text: For the more mothers are weak in spirit and have more children[b][a], the more they are devoted to their children.
translation:
  language: pt
  text: Pois, quanto mais as mães são frágeis de ânimo[a] e quanto mais filhos têm, tanto mais amam seus filhos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fracas de espírito” ou “de pouco ânimo”. O termo grego pode indicar fragilidade interior, emocional ou de coragem.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “são mais amantes dos filhos”; também pode ser traduzido por “são mais apegadas aos filhos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσῳ ... τοσούτῳ μᾶλλον
  choice: quanto mais ... tanto mais
  rationale: Reproduz de modo natural em português a correlação proporcional e preserva a força comparativa da construção grega.
- source_word: ἀσθενόψυχοι
  choice: frágeis de ânimo
  rationale: Mantém a referência à fraqueza da ψυχή sem restringi-la indevidamente à covardia ou à fragilidade emocional.
- source_word: πολυγονώτεραι
  choice: quanto mais filhos têm
  rationale: Expressa idiomaticamente a ideia comparativa de possuir prole mais numerosa, evitando o tom técnico de “mais prolíficas”.
- source_word: ὑπάρχουσιν
  choice: são / têm
  rationale: O verbo serve de apoio copulativo aos predicados; a formulação portuguesa distribui seu sentido de maneira idiomática.
- source_word: αἱ μητέρες
  choice: as mães
  rationale: Correspondência direta e natural.
- source_word: φιλοτεκνώτεραι
  choice: tanto mais amam seus filhos
  rationale: Transmite a afeição comparativamente maior pelos próprios filhos e se encaixa naturalmente na correlação “quanto mais ... tanto mais”.
