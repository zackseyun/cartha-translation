base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/019.yaml
  text: Nor[a], as a third son was breathing his last, did you weep when you saw the eyes of each one, bull-like, looking upon the tortures and the same torment[c][b], and their nostrils foretelling death.
translation:
  language: pt
  text: Nem quando um terceiro filho dava o último suspiro[a] choraste, nem ao contemplares os olhos de cada um, que, como touros[b], fitavam as torturas e o mesmo suplício, e as narinas deles, que prenunciavam a morte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nem, enquanto um terceiro morria, choraste...”. A abertura grega é elíptica; “filho” é suprido pelo contexto, que fala dos filhos da mãe.'
    reason: lexical_alternative
  - marker: b
    text: A expressão grega significa literalmente “como touros” e provavelmente descreve a firmeza e a intensidade com que eles encaravam as torturas e o mesmo suplício.
    reason: cultural_note
  - marker: c
    text: A imagem pode aludir à respiração visível ou agonizante dos que estavam perto da morte. O grego, porém, diz literalmente que as narinas prenunciavam ou sinalizavam a morte.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ τρίτος ἀποψύχων
  choice: Nem quando um terceiro filho dava o último suspiro
  rationale: 'A expressão é elíptica: τρίτος não traz um substantivo expresso, mas o contexto identifica o referente como um filho. ἀποψύχων descreve alguém expirando; “dava o último suspiro” conserva a imagem da vida que se esvai e soa natural em português.'
- source_word: θεωροῦσα
  choice: ao contemplares
  rationale: O particípio indica a mãe observando atentamente a cena. “Ao contemplares” mantém o vínculo circunstancial com “choraste” e o tom solene do discurso direto.
- source_word: ταυρηδόν
  choice: como touros
  rationale: O advérbio significa literalmente “à maneira de touro”. A comparação explícita preserva a imagem grega e, pela posição na frase, qualifica o modo firme e intenso de olhar.
- source_word: ἐπὶ τῶν βασάνων ὁρῶντας
  choice: fitavam ... em meio às torturas
  rationale: ὁρῶντας concorda com “olhos” e descreve seu olhar; βάσανοι designa torturas ou tormentos. “Fitavam” expressa um olhar sustentado, enquanto “em meio às torturas” evita transformar necessariamente βάσανοι em instrumentos materiais.
- source_word: τὸν αὐτὸν αἰκισμόν
  choice: o mesmo suplício
  rationale: αἰκισμός denota maus-tratos cruéis, ultraje físico ou tortura. “Suplício” distingue o termo de βάσανοι sem suavizar a violência e comunica que cada filho enfrentava o mesmo tratamento cruel.
- source_word: τοὺς μυκτῆρας προσημειουμένους αὐτῶν τὸν θάνατον
  choice: as narinas deles, que prenunciavam a morte
  rationale: A tradução conserva a imagem corporal incomum do grego. προσημειουμένους indica que as narinas davam antecipadamente um sinal da morte, provavelmente pela respiração visível ou agonizante.
- source_word: οὐκ ἔκλαυσας
  choice: choraste
  rationale: Com “nem ... nem”, a negação já está expressa naturalmente em português. κλαίω é o verbo comum para chorar ou verter lágrimas.
theological_decisions:
- issue: Sujeito implícito na abertura elíptica
  choice: Acrescentar “filho” em “um terceiro filho”
  alternative: Manter apenas “um terceiro”
  rationale: O substantivo não aparece no grego deste versículo, mas é fornecido inequivocamente pelo contexto dos filhos da mãe. O acréscimo esclarece a referência sem introduzir uma afirmação teológica nova.
- issue: Alcance da imagem ταυρηδόν
  choice: Aplicar “como touros” ao olhar dos filhos
  alternative: Aplicar a imagem de modo geral à postura deles durante a tortura
  rationale: A posição sintática liga mais diretamente o advérbio aos olhos que fitavam. A tradução preserva essa ligação imediata sem explicar indevidamente se a imagem enfatiza ferocidade, coragem ou firmeza.
- issue: Natureza do sinal de morte nas narinas
  choice: 'Preservar literalmente a imagem: “prenunciavam a morte”'
  alternative: Explicitar como “a respiração mostrava que estavam perto da morte”
  rationale: O grego não especifica o mecanismo físico. Manter “narinas” e “prenunciavam” conserva a força e a ambiguidade da imagem, deixando a provável referência à respiração para a nota.
translation_notes:
  register: Português moderno, corrente e digno, com formas de segunda pessoa coerentes com o discurso solene (“contemplares”, “choraste”). A ordem foi levemente regularizada para ligar as duas construções com οὐδέ ao verbo final, sem eliminar a elipse da abertura. Mantiveram-se as imagens fortes e incomuns do original, evitando explicações interpretativas no corpo do texto.
