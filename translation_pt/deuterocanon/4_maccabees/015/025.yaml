  text: For just as[a], in her own soul as in a council chamber, she saw fearsome counselors—nature and birth and love for her children and the torture of her children—
translation:
  language: pt
  text: Pois, assim como numa sala de conselho, ela via em sua própria alma conselheiros temíveis — a natureza, o nascimento, o amor pelos filhos e a tortura de seus filhos[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “o cavalete de tortura de seus filhos”; o instrumento representa aqui a tortura que eles sofreram.
