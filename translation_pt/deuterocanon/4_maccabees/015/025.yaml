lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Pois, assim como
  rationale: Preserva tanto a conexão explicativa de γάρ como a força comparativa de καθάπερ, mantendo a frase aberta para sua continuação no contexto.
- source_word: ἐν βουλευτηρίῳ
  choice: numa sala de conselho
  rationale: βουλευτήριον designa o recinto em que um conselho delibera; a expressão mantém viva a metáfora da alma como lugar de debate.
- source_word: τῇ ἑαυτῆς ψυχῇ
  choice: em sua própria alma
  rationale: Conserva o peso antropológico de ψυχή e a ênfase reflexiva de ἑαυτῆς, sem reduzir o sentido apenas à atividade mental.
- source_word: δεινοὺς ... συμβούλους
  choice: conselheiros temíveis
  rationale: δεινός pode indicar algo terrível, temível ou formidável; aqui qualifica as poderosas pressões interiores personificadas como conselheiros.
- source_word: ὁρῶσα
  choice: ela via
  rationale: O particípio foi vertido como oração finita para produzir português claro, sem alterar a imagem de contemplação interior.
- source_word: φύσιν
  choice: a natureza
  rationale: Mantém a amplitude de φύσις, que pode abranger constituição, impulso ou instinto natural, sem explicitar apenas uma dessas nuances.
- source_word: γένεσιν
  choice: o nascimento
  rationale: Reproduz de modo conciso o sentido básico de geração ou nascimento e preserva certa abertura quanto ao vínculo materno decorrente de ter dado à luz.
- source_word: φιλοτεκνίαν
  choice: o amor pelos filhos
  rationale: Expressa diretamente a afeição de alguém por seus filhos, sem acrescentar uma qualificação ausente do substantivo grego.
- source_word: τέκνων στρέβλαν
  choice: a tortura de seus filhos
  rationale: στρέβλα designa literalmente um instrumento de tortura, provavelmente o cavalete, e aqui pode funcionar metonimicamente para o suplício sofrido pelos filhos. A tradução principal comunica essa força com naturalidade; o sentido concreto fica registrado em nota.
