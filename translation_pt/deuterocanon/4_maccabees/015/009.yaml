base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/009.yaml
  text: And not only that, but because of the nobility of her sons and their obedience to the law, she had an even greater motherly affection for them.
translation:
  language: pt
  text: 'E não só isso: por causa do caráter nobre de seus filhos e da obediência deles à lei, ela sentia por eles uma afeição materna ainda maior.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴν δέ, ἀλλὰ καί
  choice: E não só isso
  rationale: Expressa naturalmente a progressão cumulativa da construção grega, que acrescenta um novo aspecto ao argumento.
- source_word: καλοκἀγαθίαν
  choice: caráter nobre
  rationale: Comunica a excelência moral e a nobreza de caráter indicadas pelo termo, evitando a possível leitura social de «nobreza» isoladamente.
- source_word: εὐπείθειαν
  choice: obediência
  rationale: No complemento πρὸς τὸν νόμον, designa disposição obediente e submissão à lei; «obediência» é clara e corrente.
- source_word: νόμον
  choice: lei
  rationale: O contexto aponta para a lei ancestral judaica. A minúscula preserva a forma não marcada do grego sem ocultar a referência contextual.
- source_word: μείζω
  choice: ainda maior
  rationale: Reproduz o comparativo e sua força intensificadora em português idiomático.
- source_word: φιλοστοργίαν
  choice: afeição materna
  rationale: O substantivo denota afeição natural entre familiares; como o sujeito é a mãe e os objetos são seus filhos, a formulação explicita de modo legítimo a nuance contextual.
theological_decisions:
- issue: Explicitação da nuance materna de φιλοστοργία
  choice: afeição materna
  alternative: afeição familiar; carinho natural
  rationale: Embora o termo grego seja mais amplo e denote afeição familiar, o referente concreto é o amor da mãe por seus filhos. A explicitação favorece a clareza sem introduzir afirmação teológica nova.
- issue: Capitalização de νόμος
  choice: lei
  alternative: Lei
  rationale: A referência contextual à lei judaica é clara, mas o grego não oferece distinção ortográfica equivalente; a minúscula preserva essa ausência de marcação e evita transformar a opção editorial em interpretação adicional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Caráter nobre» evita uma formulação excessivamente abstrata; «sentia por eles» traduz de forma natural ἔσχεν ... ἐν αὐτοῖς.
