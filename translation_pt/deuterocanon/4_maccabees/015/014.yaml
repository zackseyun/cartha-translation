  text: As she watched each one being tortured and burned[a], the mother did not change because of her piety.
translation:
  language: pt
  text: Ao ver cada um ser torturado e queimado[a], a mãe não mudou por causa da sua piedade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Ao ver cada um, um após outro, ser torturado no cavalete e queimado». O verbo grego traduzido como «ser torturado» pode referir-se mais especificamente ao suplício no cavalete.'
    reason: Alternativa lexical que preserva o valor sucessivo de καθʼ ἓν e o possível sentido mais específico de στρεβλούμενον.
lexical_decisions:
- source_word: καθʼ ἓν
  choice: cada um
  rationale: A expressão é distributiva e apresenta os filhos individualmente; «cada um» é natural e preserva o sentido sem explicitação indevida.
- source_word: στρεβλούμενον
  choice: ser torturado
  rationale: O verbo denota tortura e pode referir-se mais especificamente ao suplício no cavalete. A formulação geral é clara no português atual, enquanto a nota preserva a possibilidade mais específica.
- source_word: φλεγόμενον
  choice: queimado
  rationale: O particípio indica estar em chamas ou ser queimado; «queimado» mantém de modo conciso a imagem violenta e o paralelismo verbal.
- source_word: ὁρῶσα
  choice: Ao ver
  rationale: O particípio circunstancial tem valor temporal; «Ao ver» expressa com naturalidade a percepção da mãe durante os suplícios.
- source_word: μήτηρ
  choice: a mãe
  rationale: O grego traz simplesmente o substantivo definido; «a mãe» permanece próximo do texto e é claro no contexto.
- source_word: οὐ μετεβάλετο
  choice: não mudou
  rationale: A tradução conserva o sentido básico de mudar ou alterar-se, sem substituir a ambiguidade pela interpretação contextual «não vacilou».
- source_word: διὰ τὴν εὐσέβειαν
  choice: por causa da sua piedade
  rationale: A expressão indica a causa de sua constância. «Piedade» preserva o vocabulário ético-religioso central da obra, e o possessivo torna a frase idiomática.
theological_decisions:
- issue: Tradução de εὐσέβεια no contexto do martírio judaico helenístico
  choice: piedade
  alternative: devoção a Deus; reverência a Deus
  rationale: «Piedade» mantém a noção de fidelidade reverente a Deus manifestada em obediência e perseverança, sem reduzir o termo a emoção religiosa nem acrescentar uma explicação ausente do grego.
- issue: Sentido da constância em οὐ μετεβάλετο
  choice: não mudou
  alternative: não vacilou; não se desviou
  rationale: A opção formal preserva a amplitude do verbo. O contexto sugere firmeza, mas a tradução não torna explícita uma nuance interpretativa que o original deixa implícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a concisão e a tensão do grego, sem transformar «não mudou» em uma paráfrase interpretativa. O marcador [a] aparece no texto principal.
