lexical_decisions:
- source_word: σάρκας
  choice: as carnes
  rationale: O plural concreto de σάρξ preserva a força visceral da cena de martírio; «corpos» seria menos preciso e suavizaria a imagem.
- source_word: ὥσπερ
  choice: como
  rationale: Introduz de modo natural e conciso a comparação expressa no grego.
- source_word: προσωπεῖα
  choice: máscaras
  rationale: O termo designa normalmente máscaras, em especial máscaras teatrais, e não meramente rostos; a tradução conserva a comparação perturbadora do original.
- source_word: προκειμένας
  choice: expostas diante deles
  rationale: O particípio de πρόκειμαι descreve algo posto, estendido ou exposto diante de alguém. «Expostas diante deles» mantém tanto a disposição visível quanto a relação espacial indicada pelo contexto, sem especificar quem realizou a ação.
theological_decisions: []
translation_notes:
  register: Formulação breve, digna e visual, apropriada ao caráter fragmentário do texto. «Carnes» mantém o plural incomum e concreto do grego; «expostas» evita impor uma ação mais definida do que o particípio permite. O pronome em «diante deles» é contextual, pois não aparece de forma independente no fragmento grego fornecido.
