revisions:
- from: Pois eles eram justos e autocontrolados, corajosos, de espírito elevado e amorosos com os irmãos. E eram tão dedicados à mãe que lhe obedeciam, ao mesmo tempo que observavam até a morte as prescrições da Lei.[a]
  to: Pois eles eram justos, autocontrolados, corajosos, de espírito elevado e afeiçoados aos irmãos; e eram tão dedicados à mãe que lhe obedeciam, mesmo observando até a morte as prescrições da Lei.[a]
  rationale: 'A revisão limita-se a substituir uma expressão relacional pouco idiomática por «afeiçoados aos irmãos» e a recompor o período para refletir mais diretamente a lista coordenada e a consequência intensiva do grego. «Mesmo observando» conserva o valor concessivo-aditivo de καὶ ... φυλάσσοντας: a obediência à mãe ocorre juntamente com a guarda das prescrições, inclusive diante da morte, sem introduzir uma interpretação doutrinária sobre a relação entre as duas ações.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T00:33:43Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução transmite adequadamente a lista de virtudes e a construção central: os filhos obedeciam à mãe enquanto permaneciam fiéis às prescrições da Lei até a morte. «Justos», «autocontrolados», «corajosos», «de espírito elevado», «dedicados à mãe», «observavam», e «prescrições da Lei» correspondem bem aos termos gregos e ao seu contexto. A vírgula e a coordenação final preservam a simultaneidade expressa pelo particípio φυλάσσοντας.'
  naturalness: «Amorosos com os irmãos» é compreensível, mas pouco idiomático para uma qualidade estável numa enumeração de virtudes. «Afeiçoados aos irmãos» é mais natural e conserva precisamente o sentido de φιλάδελφοι sem generalizar a referência aos irmãos. A manutenção da frase em uma única progressão também reflete melhor o período grego e evita repetir «E eram».
  terminology: A terminologia é consistente e apropriada. «Lei», com maiúscula, é defensável no contexto da Lei ancestral judaica. «Prescrições da Lei» traduz τὰ νόμιμα de modo claro e sem especificação interpretativa indevida. A nota oferece alternativas lexicais legítimas; «ordenanças legítimas» deve ser entendida como alternativa mais literal, não como a opção preferida no texto.
