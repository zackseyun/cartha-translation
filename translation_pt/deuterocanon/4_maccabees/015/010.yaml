base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/010.yaml
  text: For they were righteous and self-controlled[a], brave and noble-minded and loving their brothers, and so devoted to their mother that, even while keeping the law's requirements to the point of death[b], they obeyed her.
translation:
  language: pt
  text: Pois eles eram justos, autocontrolados, corajosos, de espírito elevado e afeiçoados aos irmãos; e eram tão dedicados à mãe que lhe obedeciam, mesmo observando até a morte as prescrições da Lei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as ordenanças legítimas” ou “os costumes prescritos pela Lei”.
    reason: O substantivo τὰ νόμιμα pode designar prescrições legais, ordenanças reconhecidas ou costumes estabelecidos pela Lei ancestral.
lexical_decisions:
- source_word: δίκαιοι
  choice: justos
  rationale: No catálogo de virtudes, o termo expressa retidão moral e religiosa; “justos” é natural em português e preserva essa amplitude.
- source_word: σώφρονες
  choice: autocontrolados
  rationale: O adjetivo indica sensatez acompanhada de domínio dos desejos; “autocontrolados” comunica claramente o aspecto de domínio próprio.
- source_word: ἀνδρεῖοι
  choice: corajosos
  rationale: O sentido contextual é valentia. “Corajosos” evita uma tradução literalmente marcada por gênero, como “viris”, sem perder o valor moral.
- source_word: μεγαλόψυχοι
  choice: de espírito elevado
  rationale: A expressão conserva a imagem de grandeza interior do composto grego e é mais transparente no português corrente do que “magnânimos”.
- source_word: φιλάδελφοι
  choice: amorosos com os irmãos
  rationale: O composto descreve afeição pelos irmãos; o contexto trata especificamente dos sete irmãos, por isso a referência masculina é mantida.
- source_word: φιλόμητρος
  choice: dedicados à mãe
  rationale: O termo exprime amor e lealdade afetuosa à mãe; “dedicados” transmite ambos os aspectos de modo natural.
- source_word: μέχρι θανάτου
  choice: até a morte
  rationale: A expressão indica o limite extremo da fidelidade deles e mantém a formulação concisa do grego.
- source_word: τὰ νόμιμα
  choice: as prescrições da Lei
  rationale: No contexto macabeu, refere-se às normas recebidas da Lei ancestral. “Prescrições da Lei” é claro sem restringi-las indevidamente a uma categoria ritual ou civil.
- source_word: φυλάσσοντας
  choice: observavam
  rationale: Com τὰ νόμιμα, o particípio significa cumprir ou guardar normas prescritas; “observavam” é idiomático nesse contexto.
- source_word: πείθεσθαι αὐτῇ
  choice: lhe obedeciam
  rationale: πείθομαι com dativo pode significar obedecer ou atender a alguém. Aqui descreve a resposta dos filhos à exortação materna, e “lhe obedeciam” expressa isso diretamente.
theological_decisions:
- issue: Força moral e religiosa de δίκαιοι
  choice: justos
  alternative: retos
  rationale: “Justos” preserva a associação tradicional do termo com a retidão diante de Deus e com a conduta moral, sem reduzi-lo a um sentido jurídico.
- issue: Precisão da referência familiar em φιλάδελφοι
  choice: amorosos com os irmãos
  alternative: amorosos entre si
  rationale: O contexto imediato é o dos sete irmãos; manter “irmãos” reproduz a referência familiar explícita em vez de generalizá-la.
- issue: Relação entre obediência materna e fidelidade à Lei
  choice: lhe obedeciam, ao mesmo tempo que observavam até a morte as prescrições da Lei
  alternative: mesmo observando até a morte as prescrições da Lei, obedeciam a ela
  rationale: A formulação evita sugerir um conflito necessário entre obedecer à mãe e guardar a Lei. O particípio grego apresenta as ações como concomitantes, sem resolver além do texto a relação lógica entre elas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração de virtudes foi mantida direta; a longa frase grega foi dividida em duas para maior clareza, sem alterar sua progressão lógica.
