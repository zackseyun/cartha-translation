base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/011.yaml
  text: Nevertheless[a], although so many impulses of motherly affection were drawing the mother toward sympathy, the all-varied tortures were not able, by any of them, to turn aside her reason.
translation:
  language: pt
  text: Mas, ainda assim, embora tantos apelos do amor pelos filhos arrastassem a mãe à compaixão, em nenhum caso os mais variados tormentos conseguiram desviar sua razão[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu juízo racional”; o termo grego destaca a faculdade da razão, um tema central de 4 Macabeus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  choice: Mas, ainda assim
  rationale: Preserva a forte transição concessiva e a ênfase da combinação grega, em português natural.
- source_word: καίπερ
  choice: embora
  rationale: Introduz de modo claro e corrente a oração concessiva.
- source_word: τοσούτων ὄντων τῶν περὶ φιλοτεκνίαν
  choice: embora tantos apelos do amor pelos filhos
  rationale: φιλοτεκνία designa o amor ou apego aos próprios filhos; “apelos” comunica as muitas forças afetivas em ação sem reduzir a expressão a meros sentimentos.
- source_word: εἰς συμπάθειαν ἑλκόντων
  choice: arrastassem ... à compaixão
  rationale: Mantém a imagem vigorosa de ἕλκω, “puxar/arrastar”, e traduz συμπάθεια como participação compassiva no sofrimento.
- source_word: τὴν μητέρα
  choice: a mãe
  rationale: Conserva o artigo definido do grego sem acrescentar um possessivo ausente.
- source_word: ἐπʼ οὐδενὸς αὐτῶν
  choice: diante de nenhum deles
  rationale: No contexto, a expressão aponta naturalmente para cada um dos filhos submetidos ao suplício. A formulação conserva a referência pronominal sem explicitar além do grego.
- source_word: τὸν λογισμὸν αὐτῆς
  choice: sua razão
  rationale: λογισμός é termo central de 4 Macabeus para a faculdade racional ou juízo fundamentado; “razão” preserva o tema filosófico e evita reduzi-lo a mera determinação.
- source_word: αἱ παντοίκιλοι βάσανοι
  choice: os mais variados tormentos
  rationale: Expressa a ampla variedade indicada por παντοίκιλοι e o sofrimento coercivo de βάσανοι em linguagem portuguesa natural e digna.
- source_word: ἴσχυσαν μετατρέψαι
  choice: conseguiram desviar
  rationale: Comunica tanto a incapacidade expressa por ἰσχύω com infinitivo quanto a ideia de fazer mudar de direção presente em μετατρέπω.
theological_decisions:
- issue: Tradução de λογισμός em contexto filosoficamente marcado
  choice: sua razão
  alternative: seu juízo racional; sua determinação
  rationale: O livro destaca o governo da razão sobre as paixões. “Razão” mantém essa afirmação temática sem introduzir categorias doutrinárias posteriores; “determinação” enfatizaria excessivamente a vontade.
- issue: Referente de αὐτῶν em ἐπʼ οὐδενὸς αὐτῶν
  choice: deles, entendido contextualmente como os filhos
  alternative: dessas coisas, entendido como os apelos afetivos
  rationale: Embora a forma pronominal isolada permita ligação gramatical com os elementos afetivos recém-mencionados, a construção ἐπί com genitivo e o contexto dos filhos torturados favorecem o sentido “no caso de nenhum deles”. A tradução mantém o pronome, preservando certa abertura do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase mantém o contraste e a tensão do grego sem recorrer a formulações excessivamente literais.
