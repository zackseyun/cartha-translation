- from: Mas, ainda assim, embora tantos apelos do amor pelos filhos arrastassem a mãe à compaixão, diante de nenhum deles os mais variados tormentos conseguiram desviar sua razão[a].
  to: Mas, ainda assim, embora tantos apelos do amor pelos filhos arrastassem a mãe à compaixão, em nenhum caso os mais variados tormentos conseguiram desviar sua razão[a].
  rationale: Substituiu-se «diante de nenhum deles» por «em nenhum caso» para refletir de forma mais fiel e natural a construção grega ἐπʼ οὐδενὸς αὐτῶν, sem resolver além do necessário o antecedente de αὐτῶν. O restante da tradução e a nota são mantidos.
