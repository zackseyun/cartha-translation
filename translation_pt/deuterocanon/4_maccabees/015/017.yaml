  text: O mother[a], now tested by pains more bitter than the birth pangs for them.
translation:
  language: pt
  text: Ó mãe, agora provada por dores mais amargas do que as dores de parto que sofreste ao dá-los à luz![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “as dores de parto por eles”. A expressão grega relaciona as dores de parto aos filhos, provavelmente referindo-se às dores sentidas ao dá-los à luz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πικροτέρων
  choice: mais amargas
  rationale: Mantém o comparativo e a metáfora de πικρός, preservando a força retórica sem reduzi-la simplesmente a “mais intensas”.
- source_word: μήτηρ
  choice: mãe
  rationale: Vocativo direto e natural, dirigido à mãe dos filhos mencionados no contexto.
- source_word: πόνων
  choice: dores
  rationale: No contexto, designa sofrimentos dolorosos e sustenta a comparação com as dores de parto mencionadas em seguida.
- source_word: πειρασθεῖσα
  choice: provada
  rationale: O particípio expressa ter passado por uma experiência penosa que também constitui uma provação; “provada” conserva essas duas nuances.
- source_word: ἤπερ
  choice: do que
  rationale: Introduz de modo natural em português o segundo termo da comparação.
- source_word: τῶν ἐπʼ αὐτοῖς ὠδίνων
  choice: as dores de parto que sofreste ao dá-los à luz
  rationale: ὠδῖνες são dores de parto, e ἐπʼ αὐτοῖς relaciona essas dores aos filhos. A formulação explicita o sentido contextual mais provável, enquanto a nota registra a construção mais literal e sua pequena margem de ambiguidade.
