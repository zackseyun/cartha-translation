lexical_decisions:
- source_word: μήτηρ
  choice: uma mãe
  rationale: O substantivo sem artigo caracteriza a mulher no fluxo da frase; o artigo indefinido soa natural em português sem impor uma definitude ausente nesta oração.
- source_word: δυεῖν προκειμένων
  choice: tendo diante de si duas coisas
  rationale: Reproduz a construção circunstancial e conserva a imagem de duas realidades postas diante dela, sem reduzi-las explicitamente a meras opções.
- source_word: εὐσεβείας
  choice: a reverência a Deus
  rationale: No contexto de 4 Macabeus, o termo designa devoção e fidelidade religiosa. A formulação explicita o referente divino e é clara no português atual.
- source_word: σωτηρίας προσκαίρου
  choice: a preservação temporária
  rationale: σωτηρία pode indicar salvação, livramento ou preservação; προσκαίρου limita essa segurança à vida presente. A escolha evita sugerir salvação espiritual definitiva.
- source_word: τῆς ἑπτὰ υἱῶν
  choice: de seus sete filhos
  rationale: O possessivo torna explícita, de modo natural em português, a relação materna já indicada por μήτηρ.
- source_word: κατὰ τὴν τοῦ τυράννου ὑπόσχεσιν
  choice: conforme a promessa do tirano
  rationale: κατά com acusativo expressa conformidade com os termos da promessa; “conforme” preserva essa relação com concisão.
theological_decisions:
- issue: Sentido de εὐσέβεια no contexto de martírio
  choice: reverência a Deus
  alternative: piedade; devoção a Deus
  rationale: A expressão mantém o caráter religioso da escolha e sua orientação para Deus, sem restringi-la a uma tradição confessional específica.
- issue: Sentido de σωτηρία em contraste com προσκαίρου
  choice: preservação temporária
  alternative: livramento temporário; salvação temporária
  rationale: O contexto trata da prometida conservação da vida dos filhos pelo tirano, não de salvação escatológica. A nota registra a amplitude lexical sem apagar a limitação expressa por προσκαίρου.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase permanece aberta com travessão final porque o texto fornecido é um segmento sintaticamente incompleto do período maior. Os marcadores foram colocados junto aos termos aos quais suas notas efetivamente se referem.
