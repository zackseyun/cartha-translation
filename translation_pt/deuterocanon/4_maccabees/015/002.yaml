translation:
  language: pt
  text: uma mãe, com duas coisas diante de si — a reverência a Deus[a] e a preservação temporária[b] de seus sete filhos, conforme a promessa do tirano —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “piedade” ou “devoção a Deus”.
