  text: But the daughter remembered the steadfastness of Abraham, who feared God.
translation:
  language: pt
  text: Mas a filha se lembrou da perseverança de Abraão, que temia a Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do piedoso Abraão” ou “de Abraão, temente a Deus”.'
    reason: Alternativas lexicais para θεοσεβοῦς, que pode ser expresso por um adjetivo ou por uma locução que descreve a reverência de Abraão para com Deus.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Conjunção adversativa que marca contraste com o contexto anterior; “Mas” é a forma mais natural e concisa em português.
- source_word: θεοσεβοῦς
  choice: que temia a Deus
  rationale: O adjetivo caracteriza Abraão como reverente ou devoto para com Deus. A oração relativa mantém explícita a referência a Deus e soa natural em português moderno.
- source_word: Ἀβραὰμ
  choice: Abraão
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome próprio.
- source_word: καρτερίας
  choice: perseverança
  rationale: O substantivo denota constância, resistência ou firmeza sob provação. “Perseverança” comunica com clareza essa persistência resoluta no contexto exemplar.
- source_word: θυγάτηρ
  choice: a filha
  rationale: Reproduz o substantivo grego com artigo definido sem acrescentar um possessivo ausente do texto.
- source_word: ἐμνήσθη
  choice: se lembrou
  rationale: O aoristo médio de μιμνῄσκομαι significa lembrar-se ou trazer à memória; “se lembrou” é corrente e fiel.
theological_decisions:
- issue: Preservação da referência explícita a Deus em θεοσεβοῦς
  choice: Abraão, que temia a Deus
  alternative: o piedoso Abraão; Abraão, temente a Deus
  rationale: Como o composto grego inclui θεο- (“Deus”), a tradução conserva essa referência explícita e apresenta Abraão como modelo de reverência para com Deus, sem reduzir a expressão a uma virtude genérica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade no Brasil. Mantém “a filha” sem inserir “sua” e usa uma oração relativa para traduzir naturalmente o adjetivo atributivo grego.
