base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/024.yaml
  text: For they had a firmer harmony with one another[a]; for, having been trained by the same law, having practiced the same virtues, and having been brought up in a righteous way of life[b], they were drawn more closely together.
translation:
  language: pt
  text: Tinham entre si uma harmonia mais firme[a], pois, tendo sido instruídos pela mesma lei, praticado as mesmas virtudes e sido criados em um modo de vida justo[b], ficaram ainda mais unidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma concórdia mais forte entre si”.'
    reason: lexical_alternative
  - marker: b
    text: A oração final é condensada no grego; o sentido é que a formação comum na Lei, nas virtudes e na vida justa os tornou ainda mais unidos.
    reason: alternative_reading
lexical_decisions:
- source_word: θέστερον
  choice: mais firme
  rationale: O comparativo indica maior firmeza ou estabilidade. A expressão “mais firme” conserva essa força comparativa e se liga naturalmente a “harmonia” em português.
- source_word: ὁμόνοιαν
  choice: harmonia
  rationale: O termo expressa concórdia e unidade de pensamento. “Harmonia” comunica de modo natural a relação de concordância mútua indicada por πρὸς ἀλλήλους.
- source_word: νόμῳ
  choice: lei
  rationale: Em 4 Macabeus, o termo normalmente designa a Lei judaica que moldava a vida dos irmãos. “Lei” mantém a formulação concisa do grego sem explicitação interpretativa indevida.
- source_word: παιδευθέντες
  choice: tendo sido instruídos
  rationale: O particípio passivo abrange educação, formação e disciplina. “Instruídos” é claro no contexto da formação comum pela Lei.
- source_word: ἐξασκήσαντες
  choice: praticado
  rationale: O verbo denota exercício ativo e disciplinado. “Praticado” preserva a ideia de cultivar virtudes por meio da ação habitual.
- source_word: ἀρετάς
  choice: virtudes
  rationale: No discurso moral helenístico, o substantivo designa virtudes ou excelências morais; “virtudes” é o equivalente mais transparente.
- source_word: τῷ δικαίῳ ... βίῳ
  choice: em um modo de vida justo
  rationale: A expressão descreve o ambiente e o padrão ético em que foram criados. “Modo de vida justo” transmite tanto retidão quanto conduta vivida.
- source_word: συντραφέντες
  choice: tendo sido criados
  rationale: O verbo se refere a ser criado ou nutrido, possivelmente com nuance de criação conjunta. O contexto de formação compartilhada já comunica essa mutualidade.
- source_word: μᾶλλον ἐφʼ αὐτοὺς ἤγαγον
  choice: ficaram ainda mais unidos
  rationale: A construção grega é comprimida. Esta formulação exprime com naturalidade o resultado dos elementos anteriores — maior aproximação mútua — sem introduzir uma causa externa específica.
theological_decisions:
- issue: Referência de “lei” em um texto judaico de martírio
  choice: “a mesma lei” como referência à Lei judaica compartilhada que formou os irmãos
  alternative: uma lei moral genérica
  rationale: O uso de νόμος em 4 Macabeus e o contexto dos irmãos apontam para a Lei ancestral judaica. A tradução mantém apenas “lei”, preservando a concisão e evitando acrescentar uma identificação que o versículo não explicita.
- issue: Agente ou causa da união na cláusula final comprimida
  choice: expressar o resultado como “ficaram ainda mais unidos”
  alternative: “essas coisas os aproximaram ainda mais uns dos outros”
  rationale: O grego relaciona a formação comum na Lei, nas virtudes e na vida justa com a maior união dos irmãos, mas sua sintaxe é compacta. A formulação escolhida preserva essa relação sem definir além do texto a agência gramatical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção participial foi mantida sem rigidez excessiva, e a cláusula grega final, sintaticamente comprimida, foi vertida de modo natural sem eliminar sua tensão interpretativa.
