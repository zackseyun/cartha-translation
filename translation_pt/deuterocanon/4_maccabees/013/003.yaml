lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Agora, porém
  rationale: Expressa de modo natural o contraste marcado pela combinação do advérbio temporal com a conjunção adversativa.
- source_word: οὐχ οὕτως
  choice: não foi assim
  rationale: Conserva a formulação elíptica do grego sem explicitar indevidamente a comparação pressuposta; o passado se ajusta à ação narrativa de περιεγένοντο.
- source_word: ἀλλὰ
  choice: pelo contrário
  rationale: Marca com clareza a correção enfática que segue a negação.
- source_word: τῷ ἐπαινουμένῳ λογισμῷ
  choice: por meio do raciocínio que Deus louva
  rationale: A locução «por meio de» torna explícito o valor instrumental do dativo. «Raciocínio» preserva o caráter ativo e deliberativo de λογισμός, termo programático em 4 Macabeus, e a oração relativa comunica de forma corrente o particípio passivo.
- source_word: παρὰ θεῷ
  choice: que Deus louva
  rationale: Em ligação com ἐπαινουμένῳ, identifica naturalmente Deus como aquele de quem procede o louvor. A construção ativa é idiomática em português e não acrescenta conteúdo ao grego.
- source_word: περιεγένοντο
  choice: eles venceram
  rationale: Comunica de maneira direta a ideia de prevalecer sobre forças adversárias.
- source_word: τῶν παθῶν
  choice: as paixões
  rationale: No argumento filosófico de 4 Macabeus, πάθη designa impulsos e afetos submetidos ao governo da razão, e não apenas sofrimentos externos.
theological_decisions:
- issue: Tradução do termo programático λογισμός em 4 Macabeus
  choice: raciocínio
  alternative: razão; juízo racional
  rationale: «Raciocínio» ressalta a atividade moral e deliberativa sem reduzir o termo a uma faculdade abstrata nem impor uma formulação filosófica mais técnica.
- issue: Sentido de παρὰ θεῷ com ἐπαινουμένῳ
  choice: que Deus louva
  alternative: louvado diante de Deus; aprovado aos olhos de Deus
  rationale: A construção mais naturalmente apresenta Deus como fonte do louvor, embora a relação expressa por παρά possa ser vertida de modo mais amplo. A opção preserva a aprovação divina sem desenvolver implicações teológicas além do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Pelo contrário» preserva a força corretiva do período, e «por meio de» evita que o valor instrumental do dativo fique obscuro.
