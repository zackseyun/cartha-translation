  text: But now it is not so; rather[a], by the reasoning that is praised by God, they overcame the passions.
translation:
  language: pt
  text: Mas agora não é assim; pelo contrário, por meio do raciocínio elogiado por Deus[a], eles venceram as paixões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio da razão elogiada por Deus”. O termo grego pode significar “razão”, “raciocínio” ou “juízo racional”.'
