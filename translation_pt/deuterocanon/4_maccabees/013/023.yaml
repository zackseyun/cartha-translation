lexical_decisions:
- source_word: ἀσκήσεως
  choice: disciplina
  rationale: O substantivo indica exercício, prática ou treinamento disciplinado. “Disciplina” conserva o sentido moral moldado pela Lei sem impor o sentido técnico do ascetismo posterior.
- source_word: ἐν νόμῳ θεοῦ
  choice: na lei de Deus
  rationale: A construção grega situa a disciplina no âmbito da lei de Deus. A formulação mantém a preposição do original e soa natural em português.
- source_word: φιλαδελφίας
  choice: amor fraternal
  rationale: O termo designa especificamente o amor entre irmãos; a tradução preserva o vínculo familiar presente na narrativa.
- source_word: καθεστηκυίας
  choice: estando ... estabelecido
  rationale: O particípio perfeito descreve uma condição já estabelecida e ainda vigente. A construção portuguesa preserva esse estado resultante.
- source_word: συμπαθούσης
  choice: manifestando solidariedade
  rationale: O particípio expressa partilha de sentimentos, compaixão ou solidariedade. Esta opção é corrente em português e evita reduzir o termo a mera afinidade emocional.
- source_word: οἱ ἑπτὰ ἀδελφοὶ
  choice: os sete irmãos
  rationale: O grego é explicitamente masculino e se refere aos sete irmãos conhecidos na narrativa.
- source_word: συνπα-
  choice: se uniram—
  rationale: O testemunho fornecido termina no meio de uma palavra composta iniciada por συνπα-. A tradução é provisória, guiada pelo contexto de solidariedade, e o travessão assinala que a leitura está incompleta.
theological_decisions:
- issue: Linguagem de parentesco marcada pelo gênero
  choice: os sete irmãos
  alternative: os sete irmãos e irmãs / os sete parentes
  rationale: O texto grego usa o substantivo masculino e a narrativa trata de sete irmãos homens; neutralizar o termo apagaria uma informação do original.
- issue: Palavra truncada no fim do testemunho fornecido
  choice: tradução provisória seguida de travessão e nota
  alternative: reconstruir silenciosamente o verbo completo com base em outra edição
  rationale: Como a evidência textual apresentada termina em συνπα-, a tradução sinaliza com transparência a incompletude em vez de afirmar como certa uma reconstrução não contida no testemunho fornecido.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O versículo começa como continuação sintática do contexto anterior, por isso foi mantida a inicial minúscula. A combinação “Assim, portanto” conserva a força discursiva de οὕτως δὴ τοίνυν sem tentar eliminar sua ênfase.
