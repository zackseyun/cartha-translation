base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/013.yaml
  text: Because of godliness Isaac endured[a]. And each one, while looking at the others, all together cheerful and very courageous, said[c][b], “Let us dedicate ourselves to God with our whole heart—to the one who gave us our lives—and let us use our bodies to keep watch over the law.”
translation:
  language: pt
  text: 'Por causa da devoção a Deus, Isaque perseverou[a]. E cada um, olhando uns para os outros — todos juntos, alegres e muito corajosos —, dizia: “Consagremo-nos de todo o coração a Deus, aquele que nos deu a vida[b], e usemos os nossos corpos para guardar vigilantemente a Lei[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por causa da piedade, Isaque suportou”. O termo grego pode indicar piedade, devoção ou reverência a Deus; o verbo também pode ser traduzido por “suportou” ou “permaneceu firme”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “àquele que deu as almas” ou “as vidas”. A palavra grega pode significar tanto “alma” quanto “vida”; neste contexto, “vida” parece ser o sentido mais provável.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “empreguemos os nossos corpos na guarda da Lei”. O grego conserva a imagem de vigiar e guardar, não apenas a ideia mais geral de obedecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν εὐσέβειαν
  choice: Por causa da devoção a Deus
  rationale: Explicita de modo natural a orientação divina de εὐσέβεια, virtude central em 4 Macabeus, sem reduzi-la à mera prática religiosa.
- source_word: ὑπέμεινεν
  choice: perseverou
  rationale: Expressa constância sob provação; neste enunciado elíptico, soa mais natural em português do que “suportou” sem complemento.
- source_word: ἐφορῶντες ... ἀλλήλους
  choice: olhando para os outros
  rationale: Conserva a reciprocidade do olhar entre os irmãos e evita atribuir explicitamente uma finalidade de encorajamento que o grego apenas sugere.
- source_word: φαιδροὶ καὶ μάλα θαρραλέοι
  choice: alegres e muito corajosos
  rationale: Reproduz tanto a disposição luminosa e animada de φαιδροί quanto a intensidade de μάλα aplicada à coragem.
- source_word: ἀφιερώσωμεν ... ἑαυτούς
  choice: Consagremo-nos
  rationale: Mantém o sentido solene de entregar ou dedicar a si mesmos a Deus, com formulação corrente e digna.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: de todo o coração
  rationale: Equivalente idiomático direto que preserva a ideia de entrega integral.
- source_word: τῷ δόντι τὰς ψυχάς
  choice: aquele que nos deu a vida
  rationale: ψυχή admite “alma” ou “vida”; no contexto de martírio, a dádiva da vida que pode ser oferecida de volta a Deus é o sentido contextual mais provável.
- source_word: χρήσωμεν ... τὰ σώματα
  choice: usemos o nosso corpo
  rationale: Traduz o uso instrumental do corpo de cada irmão. O singular distributivo em português é natural, embora o grego tenha o plural “corpos”.
- source_word: τῇ περὶ τὸν νόμον φυλακῇ
  choice: para guardar vigilantemente a Lei
  rationale: Preserva a imagem de guarda vigilante contida em φυλακή, sem achatá-la para o simples verbo “obedecer”.
theological_decisions:
- issue: Sentido de εὐσέβεια como virtude teológica central
  choice: devoção a Deus
  alternative: piedade
  rationale: “Devoção a Deus” torna clara a direção teocêntrica do termo e é amplamente compreensível; “piedade” permanece possível, mas pode ser entendida apenas como religiosidade ou compaixão.
- issue: Sentido de ψυχάς na expressão sobre Deus como doador
  choice: vida
  alternative: almas
  rationale: O contexto de martírio favorece a vida recebida de Deus, sem exigir uma afirmação antropológica específica. A nota conserva a ambiguidade lexical genuína.
- issue: Imagem de φυλακή em relação à Lei
  choice: guardar vigilantemente a Lei
  alternative: observar a Lei
  rationale: A opção escolhida conserva a metáfora de vigilância e guarda do grego; “observar” comunica o resultado prático, mas reduz essa imagem.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por formulações naturais no Brasil sem regionalismos. A ordem e a tensão do grego foram preservadas tanto quanto possível. “Lei” recebe inicial maiúscula por designar a Lei judaica neste contexto. Os marcadores aparecem imediatamente após as expressões às quais se referem.
