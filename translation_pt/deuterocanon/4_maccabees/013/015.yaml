  text: For great is the struggle of the soul and the danger laid up in eternal torment for those who transgress the commandment of God.
translation:
  language: pt
  text: Pois grande é a luta da alma e grande é o perigo reservado no tormento eterno para os que transgridem o mandamento de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγὼν
  choice: luta
  rationale: Expressa de modo natural o combate ou conflito intenso indicado pelo substantivo grego, sem restringi-lo a uma competição atlética.
- source_word: ψυχῆς
  choice: da alma
  rationale: Mantém a formulação antropológica do texto e sua possível amplitude sem substituí-la por uma interpretação mais específica.
- source_word: κίνδυνος
  choice: perigo
  rationale: Equivalente direto e corrente para o risco grave mencionado no contexto.
- source_word: ἐν αἰωνίῳ βασάνῳ κείμενος
  choice: reservado no tormento eterno
  rationale: Transmite que o perigo está posto ou aguarda no âmbito do tormento eterno; 'reservado' é idiomático em português, embora κείμενος literalmente tenha o sentido de 'estar posto/jazer'.
- source_word: παραβαίνουσι
  choice: transgridem
  rationale: Preserva o sentido de ultrapassar ou violar uma norma, em registro digno e compreensível.
- source_word: ἐντολὴν τοῦ θεοῦ
  choice: mandamento de Deus
  rationale: Correspondência direta, natural e tradicional, sem acrescentar especificação inexistente no grego.
theological_decisions:
- issue: Relação sintática de ἐν αἰωνίῳ βασάνῳ κείμενος
  choice: o perigo é descrito como reservado no tormento eterno
  alternative: o perigo consiste em tormento eterno
  rationale: O particípio κείμενος concorda com κίνδυνος e a preposição ἐν é preservada; a tradução evita converter a construção em uma identificação mais explícita do que o grego oferece.
- issue: Valor de αἰωνίῳ
  choice: eterno
  alternative: duradouro / da era
  rationale: Neste contexto escatológico e punitivo, 'eterno' é a equivalência portuguesa mais direta e estabelecida, sem comentário doutrinário adicional.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A repetição de 'grande' torna explícito em português que μέγας qualifica naturalmente tanto 'luta' quanto 'perigo', evitando a leitura pouco idiomática de que apenas a luta seria grande.
