  text: The souls of brothers are affectionate in embraces[c][b][a], and they grow much stronger through living together and through daily familiarity and the rest of their upbringing.
translation:
  language: pt
  text: As almas dos irmãos são afetuosas nos abraços[a] e se fortalecem ainda mais pela vida em comum[b], pela convivência diária e pelos demais aspectos de sua formação[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «almas fraternas, afetuosas nos abraços». A expressão grega é condensada e permite relacionar «fraternas» e «almas» de maneiras ligeiramente diferentes.'
    reason: lexical_alternative
  - marker: b
    text: Também pode ser entendido como «por terem sido criados juntos» ou «pelo companheirismo».
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «pelo restante de sua educação» ou «por seu outro treinamento».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισμάτων
  choice: nos abraços
  rationale: Preserva a imagem concreta de envolver alguém nos braços. A construção grega é condensada e sem verbo expresso nesta oração, por isso a relação sintática permanece parcialmente aberta.
- source_word: φιλάδελφοι
  choice: dos irmãos
  rationale: No contexto narrativo, refere-se especificamente aos sete irmãos. A formulação mantém a força familiar e o gênero do referente, sem generalizá-lo para irmãos e irmãs.
- source_word: ψυχαί
  choice: almas
  rationale: Conserva o registro elevado e a referência à vida interior e aos afetos, em vez de reduzir o termo a pessoas ou indivíduos.
- source_word: αὔξονται σφοδρότερον
  choice: se fortalecem ainda mais
  rationale: Expressa o aumento de intensidade indicado pelo comparativo, de modo natural em português, sem sugerir violência.
- source_word: διὰ συντροφίας
  choice: por terem sido criados juntos
  rationale: συντροφία pode indicar convivência, companheirismo ou criação em comum. No contexto familiar, a criação conjunta comunica claramente o vínculo formado desde cedo.
- source_word: τῆς καθʼ ἡμέραν συνηθείας
  choice: pela convivência diária
  rationale: Traduz a proximidade habitual e reiterada de cada dia em linguagem corrente e digna.
- source_word: τῆς ἄλλης παιδίας
  choice: pelos demais aspectos de sua formação
  rationale: O termo pode abranger criação, educação e treinamento. Esta opção mantém a amplitude do processo formativo e evita limitá-lo apenas à instrução formal.
theological_decisions:
- issue: Linguagem familiar marcada por gênero no contexto de irmãos literais
  choice: irmãos
  alternative: irmãos e irmãs; pessoas da mesma família
  rationale: A passagem trata dos sete irmãos do relato. Manter «irmãos» representa com exatidão os referentes masculinos concretos, sem transformar a frase em uma afirmação inclusiva mais ampla.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva «almas» e «abraços» para manter o caráter concreto e elevado do grego, enquanto explicita o verbo exigido pela fluidez do português. As notas registram a compressão sintática e a amplitude semântica de συντροφία e παιδία.
