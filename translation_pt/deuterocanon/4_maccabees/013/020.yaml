lexical_decisions:
- source_word: ἐν ᾗ
  choice: na qual
  rationale: Preserva a relação expressa pelo pronome relativo feminino no dativo sem especificar o antecedente, que não aparece no fragmento fornecido.
- source_word: ἀδελφοὶ
  choice: irmãos
  rationale: O substantivo grego está no masculino plural e, no contexto, designa irmãos homens em sentido literal.
- source_word: τὸν ἴσον ... χρόνον
  choice: durante o mesmo período
  rationale: Expressa com naturalidade em português a igualdade de duração indicada pelo grego.
- source_word: κατοικήσαντες
  choice: tendo vivido
  rationale: O particípio denota habitar ou viver; esta formulação mantém seu valor circunstancial e soa natural em português.
- source_word: ἐν τῷ αὐτῷ χρόνῳ
  choice: ao mesmo tempo
  rationale: Transmite a simultaneidade da formação de modo idiomático, sem alterar o sentido temporal.
- source_word: πλασθέντες
  choice: tendo sido formados
  rationale: Mantém a voz passiva e a imagem de formação, provavelmente referente ao desenvolvimento pré-natal.
- source_word: ἀπὸ τοῦ αὐτοῦ αἵματος
  choice: do mesmo sangue
  rationale: Conserva a imagem concreta do sangue compartilhado e a ideia de origem biológica comum.
- source_word: αὐξηθέντες
  choice: tendo crescido
  rationale: Representa o sentido de crescimento ou desenvolvimento sem introduzir a noção mais específica de criação ou educação.
- source_word: διὰ τῆς αὐτῆς
  choice: por meio da mesma
  rationale: Reproduz a preposição instrumental e o adjetivo feminino substantivado, deixando a expressão incompleta como no testemunho grego fornecido.
