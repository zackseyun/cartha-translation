base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/006.yaml
  text: For just as towers on harbor breakwaters[a], beating back the threats of the waves, provide a calm harbor for those sailing in,
translation:
  language: pt
  text: Pois, assim como as torres nos quebra-mares dos portos, repelindo as ameaças das ondas, oferecem um ancoradouro tranquilo[a] aos que chegam navegando,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um porto tranquilo” ou “um abrigo tranquilo”. A palavra grega pode designar porto, ancoradouro ou abrigo marítimo.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Pois, assim como
  rationale: Preserva tanto a ligação explicativa de γάρ como a introdução da comparação por καθάπερ, em português natural.
- source_word: προβλῆτες λιμένων πύργοι
  choice: as torres nos quebra-mares dos portos
  rationale: A expressão grega descreve torres em estruturas projetadas para fora e destinadas à proteção portuária. “Quebra-mares” comunica com clareza essa imagem concreta sem eliminar as “torres” do original.
- source_word: τὰς κυμάτων ἀπειλὰς
  choice: as ameaças das ondas
  rationale: Mantém a personificação expressa por ἀπειλάς, em vez de reduzi-la simplesmente ao impacto físico das ondas.
- source_word: ἀνακόπτοντες
  choice: repelindo
  rationale: Expressa a ação contínua e vigorosa de deter ou fazer recuar as ondas, além de concordar naturalmente com “torres”.
- source_word: γαληνὸν παρέχουσιν ... τὸν ὅρμον
  choice: oferecem um ancoradouro tranquilo
  rationale: γαλ­ηνός qualifica o lugar abrigado como calmo ou tranquilo, e ὅρμος pode designar um ancoradouro, porto ou refúgio marítimo.
- source_word: τοῖς εἰσπλέουσιν
  choice: aos que chegam navegando
  rationale: Conserva o sentido náutico do particípio, que descreve os que entram no local pelo mar.
