  text: Let us not fear the one who seems to kill[a].
translation:
  language: pt
  text: Não temamos aquele que parece matar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquele que aparenta matar” ou “aquele que é considerado capaz de matar”. O grego ressalta o caráter apenas aparente desse poder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ φοβηθῶμεν
  choice: Não temamos
  rationale: O subjuntivo exortativo na primeira pessoa do plural, precedido de μή, é expresso de modo direto e natural em português por “Não temamos”.
- source_word: τὸν δοκοῦντα
  choice: aquele que parece
  rationale: δοκέω tem aqui o sentido mais natural de “parecer” ou “aparentar”. A formulação preserva a distinção entre poder aparente e poder real sem acrescentar ao texto uma explicação interpretativa.
- source_word: ἀποκτενεῖν
  choice: matar
  rationale: O infinitivo dependente de δοκοῦντα indica aquilo que a pessoa parece fazer ou ser capaz de fazer. “Matar” é a tradução mais direta, clara e idiomática.
theological_decisions:
- issue: A nuance entre poder aparente e poder real em τὸν δοκοῦντα ἀποκτενεῖν
  choice: O perseguidor parece matar
  alternative: O perseguidor pretende matar; o perseguidor é considerado capaz de matar
  rationale: O sentido básico de δοκοῦντα favorece “parece”. No contexto do martírio, isso mantém a tensão entre a morte corporal aparente e o limite do poder do perseguidor, sem explicitar no texto principal uma conclusão teológica adicional.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A forma exortativa “Não temamos” conserva a concisão e a força retórica do grego.
