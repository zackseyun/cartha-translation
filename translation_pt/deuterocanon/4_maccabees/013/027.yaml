base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/027.yaml
  text: But likewise[a], although nature and custom and the dispositions of virtue were drawing together for them the affections of brotherhood, those who were left behind endured, because of piety, as they watched their brothers, being tortured to death, objects of pity[b].
translation:
  language: pt
  text: Mas, do mesmo modo, embora a natureza, a convivência e as disposições virtuosas estreitassem entre eles os laços do amor fraterno[a], os que ainda restavam suportaram, por causa da piedade[b], ver seus irmãos — que despertavam compaixão — sendo torturados até a morte.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os afetos da fraternidade”. O grego expressa os vínculos afetivos que uniam os irmãos.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “piedade” significa devoção reverente a Deus e à sua lei, não o sentimento de compaixão.
    reason: theological_clarity
  - marker: c
    text: 'O grego reúne vários particípios numa construção condensada; mais literalmente: “os que restavam suportaram, por causa da piedade, vendo os irmãos serem objeto de compaixão e serem torturados até a morte”.'
    reason: source_syntax
lexical_decisions:
- source_word: συνηθείας
  choice: convivência
  rationale: No contexto dos irmãos, o termo indica a familiaridade criada pelo convívio habitual. “Convivência” é mais natural e concreta em português do que “costume”, sem reduzir a ideia a um mero hábito individual.
- source_word: τὰ τῆς ἀδελφότητος φίλτρα
  choice: os laços do amor fraterno
  rationale: φίλτρα designa aqui os afetos ou vínculos que atraem e unem; a expressão escolhida comunica tanto o vínculo quanto sua força afetiva, sem recorrer ao sentido literal inadequado de “encantos”.
- source_word: συναξόντων
  choice: estreitassem entre eles
  rationale: O particípio descreve a natureza, a convivência e as disposições virtuosas intensificando e reunindo os afetos fraternos. “Estreitassem” produz uma frase portuguesa natural e preserva essa força relacional.
- source_word: τῶν τῆς ἀρετῆς ἠθῶν
  choice: as disposições virtuosas
  rationale: A expressão aponta para traços ou disposições de caráter formados pela virtude; esta tradução evita confundi-la com συνηθείας.
- source_word: ἀνέσχοντο
  choice: suportaram
  rationale: O verbo exprime resistência firme diante de intenso sofrimento emocional. A construção “suportaram ... ver” torna explícita em português a relação com o particípio ὁρῶντες.
- source_word: εὐσέβειαν
  choice: piedade
  rationale: Termo temático em 4 Macabeus para a devoção reverente a Deus e à sua lei. A nota impede que o leitor o entenda aqui apenas como compaixão.
- source_word: οἱ ὑπολελειμμένοι
  choice: os que ainda restavam
  rationale: Identifica os irmãos que ainda não tinham sido mortos naquele ponto, sem sugerir, como “sobreviventes” poderia sugerir, que escapariam ao fim.
- source_word: κατοικτιζομένους
  choice: que despertavam compaixão
  rationale: Preserva o sentido passivo do particípio — serem objeto de compaixão — e o relaciona diretamente aos irmãos, em português compreensível.
- source_word: μέχρι θανάτου βασανιζομένους
  choice: sendo torturados até a morte
  rationale: Mantém a imagem de tortura que prossegue até a morte, sem suavizar a violência do original.
theological_decisions:
- issue: Sentido de εὐσέβεια no contexto do martírio
  choice: piedade, entendida como devoção reverente a Deus
  alternative: devoção; reverência religiosa
  rationale: “Piedade” preserva o vocabulário moral e religioso recorrente do livro, enquanto a nota esclarece que não se trata do sentimento de pena mencionado na mesma frase.
- issue: Força da linguagem de fraternidade
  choice: amor fraterno / irmãos
  alternative: afeto familiar / familiares
  rationale: O grego emprega explicitamente ἀδελφότης e ἀδελφούς. A tradução mantém a referência masculina aos irmãos martirizados e a dimensão afetiva da fraternidade.
- issue: Relação entre devoção e afeto familiar
  choice: manter ambos em tensão
  alternative: explicar que a piedade venceu ou suprimiu o amor fraterno
  rationale: O texto afirma que os irmãos suportaram a visão por causa da piedade, apesar dos fortes laços naturais, habituais e morais; não declara que o afeto foi eliminado. A tradução evita acrescentar essa conclusão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente reorganizada para tornar clara a relação entre “suportaram” e “ver”, preservando por notas a forma comprimida e a ambiguidade lexical do grego.
