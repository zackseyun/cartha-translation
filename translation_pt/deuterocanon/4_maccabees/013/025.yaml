lexical_decisions:
- source_word: ὁμόγνοια
  choice: propósito comum
  rationale: Expressa a ideia de partilhar a mesma disposição ou orientação interior, sem repetir o campo lexical de ὁμόνοια.
- source_word: καλοκἀγαθίας
  choice: viver com nobreza e bondade
  rationale: Torna natural em português o ideal ético condensado em καλοκἀγαθία, mantendo visíveis seus componentes de nobreza e bondade.
- source_word: ἐπέτεινεν
  choice: fortalecia
  rationale: O verbo indica intensificar ou aumentar; no contexto relacional, “fortalecia” comunica com clareza o aumento da concórdia.
- source_word: ὁμόνοιαν
  choice: harmonia
  rationale: Designa concórdia ou unidade entre pessoas e mantém distinção verbal em relação a ὁμόγνοια.
- source_word: πρὸς ἀλλήλους
  choice: entre eles
  rationale: Reproduz de modo idiomático a relação recíproca indicada pela expressão grega.
