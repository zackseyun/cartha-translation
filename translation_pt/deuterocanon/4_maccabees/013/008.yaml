  text: For[a], having formed a sacred chorus of piety, they kept encouraging one another, saying,
translation:
  language: pt
  text: 'Pois, tendo formado um coro sagrado de piedade[a], continuavam encorajando uns aos outros, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser entendido como “um coro santo de devoção”. O grego reúne uma imagem cultual (“coro sagrado”) e εὐσέβεια, termo central da obra para a devoção fiel a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  choice: sagrado
  rationale: Preserva o sentido cultual de algo consagrado ou pertencente à esfera sagrada e combina naturalmente com a imagem de χορός.
- source_word: εὐσεβείας
  choice: piedade
  rationale: Em 4 Macabeus, designa a devoção fiel a Deus como virtude central. “Piedade” mantém essa dimensão religiosa sem explicitar no texto mais do que o grego diz.
- source_word: στήσαντες
  choice: tendo formado
  rationale: Com χορόν, o particípio de ἵστημι indica constituir ou organizar o coro, não erguer algo fisicamente.
- source_word: χορὸν
  choice: coro
  rationale: Conserva a imagem grega de um grupo coral, com possíveis ressonâncias cerimoniais, sem especificar apenas canto ou dança.
- source_word: παρεθάρσυνον
  choice: continuavam encorajando
  rationale: O imperfeito expressa uma ação durativa ou repetida; a formulação portuguesa preserva esse aspecto.
- source_word: ἀλλήλους
  choice: uns aos outros
  rationale: Equivalente recíproco natural e claro em português.
- source_word: λέγοντες
  choice: dizendo
  rationale: Mantém a função do particípio como introdução direta às palavras que seguem.
theological_decisions:
- issue: Tradução de εὐσέβεια no contexto do martírio
  choice: piedade
  alternative: devoção a Deus
  rationale: “Piedade” preserva a virtude teológico-moral central da obra e a concisão do original. “Devoção a Deus” explicitaria corretamente a orientação religiosa, mas acrescentaria um complemento não expresso neste versículo.
translation_notes:
  register: Português atual, digno e amplamente compreensível. A expressão incomum “coro sagrado de piedade” foi mantida para preservar a metáfora cultual do grego; “continuavam encorajando” comunica o valor durativo do imperfeito.
