  text: Let us not be cowardly in demonstrating our piety[a].
translation:
  language: pt
  text: Não sejamos covardes ao demonstrar nossa devoção.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não percamos a coragem na demonstração de nossa piedade.”'
    reason: Alternativa lexical que preserva tanto o sentido possível de δειλανδρέω como a forma nominal de ἀπόδειξις e a tradução tradicional de εὐσέβεια.
lexical_decisions:
- source_word: μὴ δειλανδρήσωμεν
  choice: Não sejamos covardes
  rationale: O subjuntivo hortativo de primeira pessoa do plural pede uma exortação inclusiva. “Não sejamos covardes” preserva diretamente a força moral de δειλανδρέω, sem suavizá-la para apenas “não desanimemos”.
- source_word: πρὸς τὴν ... ἀπόδειξιν
  choice: ao demonstrar
  rationale: Neste contexto, πρὸς indica relação com a ação expressa por ἀπόδειξις. A construção verbal “ao demonstrar” é natural em português e conserva a ideia de manifestação ou comprovação visível.
- source_word: τῆς εὐσεβίας
  choice: nossa devoção a Deus
  rationale: εὐσέβεια designa reverência religiosa manifestada em conduta fiel. “Devoção a Deus” explicita naturalmente o referente divino em português, enquanto “nossa” é suprido pelo contexto da ação dos próprios falantes.
theological_decisions:
- issue: Sentido de εὐσέβεια no contexto de exortação ao martírio
  choice: devoção a Deus
  alternative: piedade
  rationale: “Devoção a Deus” comunica reverência e fidelidade prática sem sugerir uma virtude meramente exterior. “Piedade” é lexicalmente possível e mais compacta, mas no português atual pode ser entendida como compaixão.
- issue: Força da exortação em δειλανδρήσωμεν
  choice: não sejamos covardes
  alternative: não percamos a coragem
  rationale: A opção principal mantém a avaliação moral explícita do verbo grego; a alternativa preserva o aspecto de perda de ânimo, mas é um pouco mais branda.
translation_notes:
  register: Português moderno, claro e digno, com exortação inclusiva. A formulação evita linguagem confessional técnica; a nota registra a alternativa mais formal e literal.
