base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/005.yaml
  text: How then can one fail to acknowledge in these men the mastery over suffering that comes from blessedness[a], since they were not turned aside even by the pains of fire?
translation:
  language: pt
  text: Como, então, não reconhecer nestes homens o domínio sobre as paixões próprio da boa razão[a], pois eles não se deixaram desviar nem mesmo pelas dores causadas pelo fogo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais formal, “o domínio sobre as paixões da boa razão”. A expressão grega é rara e difícil. “Boa razão” também pode ser entendida como bom juízo ou raciocínio bem ponderado; ela elogia o autodomínio virtuoso dos irmãos.
    reason: Alternativa lexical para a expressão rara τῆς εὐλογιστίας παθοκρατίαν.
lexical_decisions:
- source_word: πῶς οὖν οὐκ ἔστιν ... ὁμολογεῖν
  choice: Como, então, deixar de reconhecer
  rationale: A pergunta retórica apresenta esse reconhecimento como inevitável; a formulação portuguesa conserva essa força com naturalidade.
- source_word: τούτοις
  choice: nestes homens
  rationale: O dativo aponta para a qualidade reconhecida neles; a explicitação de “homens” é natural no contexto dos irmãos.
- source_word: τὴν τῆς εὐλογιστίας παθοκρατίαν
  choice: o domínio sobre as paixões próprio da piedade
  rationale: παθοκρατία designa domínio ou governo sobre paixões, afetos ou sofrimentos. εὐλογιστία é rara e difícil; “piedade” expressa aqui uma disposição virtuosa e religiosa sem reduzir a expressão a mera bem-aventurança.
- source_word: οἱ ... οὐκ ἐπεστράφησαν
  choice: os fizeram recuar
  rationale: 'A construção preserva o valor passivo e causativo do grego: as dores não conseguiram desviá-los de sua resolução.'
- source_word: τῶν μὲν διὰ πυρὸς ἀλγηδόνων
  choice: nem mesmo as dores causadas pelo fogo
  rationale: ἀλγηδόνων significa dores ou tormentos, e διὰ πυρός indica o fogo como meio; “nem mesmo” comunica a força contextual de μὲν na argumentação.
theological_decisions:
- issue: Sentido da expressão rara τῆς εὐλογιστίας παθοκρατίαν
  choice: domínio sobre as paixões próprio da piedade
  alternative: domínio sobre o sofrimento que vem da bem-aventurança; domínio das paixões pertencente à boa razão
  rationale: O contexto de 4 Macabeus elogia o autodomínio virtuoso dos irmãos. A tradução mantém a amplitude de πάθος e sinaliza em nota a dificuldade de εὐλογιστία, sem impor uma definição filosófica ou doutrinária excessivamente estreita.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe retórica natural. “Paixões” preserva a linguagem moral-filosófica do livro, enquanto a nota registra a ambiguidade de εὐλογιστία.
