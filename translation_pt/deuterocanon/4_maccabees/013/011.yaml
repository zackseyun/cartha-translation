  text: And one said[a], “Take courage, brother,” while another said, “Endure nobly.”
translation:
  language: pt
  text: 'E um dizia[a]: “Coragem, irmão!”; e o outro: “Suporte com nobreza!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, em grego: “um dizia ... mas o outro ...”, indicando falas sucessivas entre os irmãos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θάρρει
  choice: Coragem
  rationale: O imperativo de θαρρέω/θαρσέω é uma exortação à coragem. A forma elíptica “Coragem!” é natural em português e preserva a força direta do grego.
- source_word: ἀδελφέ
  choice: irmão
  rationale: Vocativo masculino singular, adequado ao contexto dos irmãos e à interpelação direta.
- source_word: Εὐγενῶς
  choice: com nobreza
  rationale: O advérbio descreve uma perseverança moralmente elevada e honrosa. “Com nobreza” comunica esse valor melhor do que apenas “com bravura”.
- source_word: καρτέρησον
  choice: Suporte
  rationale: O imperativo aoristo de καρτερέω conclama a resistir firmemente ao sofrimento. “Suporte” é conciso e natural no contexto imediato, sem acrescentar interpretação.
- source_word: ὁ μέν ... ὁ δέ
  choice: um ... o outro
  rationale: A construção correlativa distingue dois falantes sucessivos. “Um ... o outro” mantém a estrutura distributiva sem inserir um substantivo ausente no grego.
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito grego admite valor durativo ou iterativo. “Dizia” preserva esse aspecto melhor que o pontual “disse” e continua natural na narrativa.
