base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/001.yaml
  text: Therefore[a], since the seven brothers looked down on pains even to death[c][b], it is acknowledged from every side that godly reason is sovereign over the passions.
translation:
  language: pt
  text: Portanto, visto que os sete irmãos desprezaram os sofrimentos até a morte[a], é reconhecido por toda parte que a razão piedosa[b] é soberana sobre as paixões[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “trataram com desprezo os sofrimentos até a morte” ou “consideraram insignificantes os sofrimentos até a morte”.
    reason: lexical_alternative
  - marker: b
    text: “Razão piedosa” também pode ser traduzida por “razão devota” ou “razão orientada pela reverência a Deus”. A expressão grega é um tema central de 4 Macabeus.
    reason: lexical_alternative
  - marker: c
    text: Neste livro, “paixões” designa impulsos e tendências que a razão deve governar, não simplesmente todos os sentimentos humanos.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ τοίνυν
  choice: Portanto
  rationale: A combinação tem força inferencial e introduz a conclusão tirada do argumento anterior; “Portanto” é natural e clara em português.
- source_word: τῶν μέχρι θανάτου πόνων
  choice: os sofrimentos até a morte
  rationale: πόνοι indica dores ou sofrimentos, e μέχρι θανάτου leva esses sofrimentos ao seu extremo, a morte, sem exigir que se explicite além do grego se são sofrimentos causadores da morte ou suportados até morrer.
- source_word: ὑπερεφρόνησαν
  choice: desprezaram
  rationale: O verbo expressa considerar algo inferior, indigno de atenção ou incapaz de intimidar. “Desprezaram” conserva a força retórica e é idiomático em português.
- source_word: οἱ ἑπτὰ ἀδελφοί
  choice: os sete irmãos
  rationale: O masculino plural se refere especificamente aos sete irmãos homens da narrativa.
- source_word: συνομολογεῖται ἀπανταχόθεν
  choice: todos reconhecem
  rationale: A formulação comunica o reconhecimento comum e abrangente expresso pelo passivo συνομολογεῖται e por ἀπανταχόθεν, evitando o pouco natural “reconhece-se de todas as partes”.
- source_word: αὐτόδεσπότος
  choice: é soberana sobre
  rationale: O adjetivo raro comunica domínio exercido por autoridade própria. “Soberana sobre” expressa governo pleno sem introduzir a possível ambiguidade de “autônoma” ou “senhora de si”.
- source_word: τῶν παθῶν
  choice: sobre as paixões
  rationale: No argumento ético-filosófico de 4 Macabeus, πάθη são impulsos e tendências que devem ser governados, não apenas emoções neutras nem sofrimentos externos.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: a razão piedosa
  rationale: A expressão central do livro designa o juízo racional moldado pela reverência a Deus. “Razão piedosa” preserva de modo conciso tanto o componente racional quanto o religioso.
theological_decisions:
- issue: Tradução da expressão programática εὐσεβὴς λογισμός
  choice: a razão piedosa
  alternative: a razão orientada pela devoção a Deus; a razão devota
  rationale: “Razão piedosa” mantém a concisão e a terminologia conceitual do texto, enquanto a nota esclarece que não se trata de racionalidade religiosa em sentido vago, mas de razão formada pela reverência a Deus.
- issue: Sentido ético-filosófico de πάθη
  choice: as paixões
  alternative: os impulsos; os desejos
  rationale: “Paixões” preserva a categoria moral e psicológica do livro sem reduzi-la a emoções em geral nem determinar de antemão quais impulsos específicos estão em vista.
- issue: Força de αὐτόδεσπότος
  choice: soberana sobre
  alternative: senhora das; dotada de domínio próprio sobre
  rationale: A escolha afirma a capacidade governante da razão piedosa sobre as paixões, mas não transforma o verso numa tese denominacional sobre autonomia humana ou mérito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem do período acompanha a progressão lógica do grego, mas “todos reconhecem” naturaliza a construção passiva e abrangente. Os termos conceituais “razão piedosa” e “paixões” são mantidos e esclarecidos em notas.
