  text: For along with godliness she made brotherly love even more desirable to them.
translation:
  language: pt
  text: Pois, junto com a devoção a Deus, ela tornava o amor entre irmãos mais querido para eles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὺν
  choice: junto com
  rationale: Expressa acompanhamento e preserva a ligação entre as duas virtudes em português natural.
- source_word: εὐσεβείᾳ
  choice: devoção a Deus
  rationale: Torna explícita, sem acrescentar uma doutrina específica, a orientação religiosa de εὐσέβεια no contexto de 4 Macabeus; é mais clara para leitores atuais do que apenas “piedade”.
- source_word: ποθεινοτέραν
  choice: mais querido
  rationale: O comparativo descreve algo mais estimado, desejado ou objeto de afeição. “Mais querido” combina naturalmente com o amor familiar e não acrescenta a intensificação “ainda”, ausente do grego.
- source_word: αὐτοῖς
  choice: para eles
  rationale: 'Conserva o dativo de referência: o amor entre irmãos se tornava mais querido na estima deles.'
- source_word: κατεσκεύαζεν
  choice: ela tornava
  rationale: Reproduz a construção causativa e o aspecto durativo do imperfeito grego, indicando a atuação contínua da mãe na formação dos filhos.
- source_word: φιλαδελφίαν
  choice: o amor entre irmãos
  rationale: No contexto imediato, refere-se à afeição entre irmãos literais. A formulação evita que “amor fraternal” seja entendido apenas em seu sentido religioso mais amplo.
theological_decisions:
- issue: Sentido de εὐσέβεια como virtude central em 4 Macabeus
  choice: devoção a Deus
  alternative: piedade; reverência
  rationale: “Devoção a Deus” preserva a orientação teológica da virtude em linguagem moderna e acessível, sem reduzi-la a práticas exteriores nem vinculá-la a uma tradição confessional específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha de perto o grego sem soar rígida; o imperfeito “tornava” mantém a ideia de ação contínua.
