  text: It is impossible to overlook the rule of reason[a], for they prevailed over both passion and pains.
translation:
  language: pt
  text: Não se pode ignorar o domínio da razão[a], pois eles prevaleceram tanto sobre a paixão como sobre as dores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mente”. O termo grego pode indicar a mente ou o entendimento; aqui, provavelmente ressalta o juízo racional que governa as paixões.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν παριδεῖν
  choice: Não se pode ignorar
  rationale: A construção impessoal exprime impossibilidade, e παριδεῖν significa deixar de considerar ou ignorar. A formulação é idiomática e mantém a força avaliativa do grego.
- source_word: ἡγεμονίαν
  choice: o domínio
  rationale: O substantivo denota governo, liderança ou autoridade governante; aqui, refere-se ao poder dirigente da razão sobre paixões e dores.
- source_word: τῆς διανοίας
  choice: da razão
  rationale: No argumento filosófico de 4 Macabeus, o termo designa a faculdade racional que governa os impulsos. “Razão” é mais preciso neste contexto, embora “mente” também seja possível.
- source_word: ἐπεκράτησαν
  choice: prevaleceram sobre
  rationale: O verbo significa mostrar-se mais forte, dominar ou prevalecer. A expressão portuguesa é direta e preserva a relação com os genitivos seguintes.
- source_word: πάθους
  choice: a paixão
  rationale: Neste escrito, πάθος costuma indicar paixão ou impulso não racional. O singular coletivo do grego é preservado.
- source_word: πόνων
  choice: as dores
  rationale: O plural aponta para as dores físicas suportadas, especialmente no contexto de tortura, sem explicitar além do que diz o grego.
- source_word: καὶ πάθους καὶ πόνων
  choice: tanto sobre a paixão como sobre as dores
  rationale: A correlação “tanto... como...” reproduz a ênfase da repetição grega e distingue o impulso interior das dores corporais.
theological_decisions:
- issue: Como traduzir διάνοια sem apagar a tensão antropológica e filosófica do livro
  choice: razão
  alternative: mente; entendimento
  rationale: “Razão” torna claro o tema do governo racional sobre as paixões sem introduzir categorias doutrinárias posteriores. A nota registra a amplitude lexical de “mente”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o registro filosófico do texto sem soar técnica em excesso.
