  yaml_path: translation/deuterocanon/4_maccabees/013/002.yaml
  text: For just as those enslaved to their passions ate delicacies—for we said that they had been conquered by these things—[a]
translation:
  language: pt
  text: Pois, assim como os que foram escravizados pelas paixões comeram iguarias — porque dizíamos que tinham sido vencidos por essas coisas —[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «comeram alimentos luxuosos» ou «viveram com requinte». O verbo grego é raro e sugere um consumo refinado e indulgente. «Por essas coisas» traduz literalmente o demonstrativo grego e pode referir-se às paixões ou, de modo mais amplo, ao que foi mencionado.
    reason: Alternativa lexical e preservação da ambiguidade referencial do demonstrativo.
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Pois, assim como
  rationale: Preserva tanto a força explicativa de γάρ quanto o sentido comparativo de ὥσπερ, deixando aberta a continuação da comparação.
- source_word: τοῖς πάθεσιν δουλωθέντες
  choice: os que se tornaram escravos das paixões
  rationale: Mantém a forte metáfora de escravidão de δουλόω e traduz πάθη segundo o contexto ético-filosófico de 4 Macabeus.
- source_word: ἡμεροφάγησαν
  choice: comeram iguarias
  rationale: O verbo raro indica alimentação refinada ou luxuosa; esta formulação é natural e conserva o foco no consumo indulgente.
- source_word: ἐλέγομεν γὰρ
  choice: porque dizíamos
  rationale: O imperfeito é representado naturalmente e a conjunção conserva a função explicativa do comentário parentético.
- source_word: τούτοις νενικῆσθαι
  choice: haviam sido vencidos por elas
  rationale: O perfeito infinitivo expressa um estado resultante de derrota; o pronome feminino retoma de modo natural 'paixões', referente mais plausível de τούτοις.
theological_decisions:
- issue: Sentido moral e psicológico de πάθη
  choice: paixões
  alternative: sofrimentos; emoções; desejos
  rationale: No argumento de 4 Macabeus, o termo designa forças afetivas e impulsos em contraste com a razão; 'paixões' preserva esse quadro sem impor uma elaboração doutrinária posterior.
- issue: Força metafórica de δουλωθέντες
  choice: se tornaram escravos
  alternative: foram submetidos; ficaram sujeitos
  rationale: A imagem de escravidão é central ao contraste entre domínio e derrota e, portanto, não deve ser enfraquecida.
- issue: Referente de τούτοις
  choice: elas, isto é, as paixões
  alternative: essas coisas, possivelmente abrangendo as práticas indulgentes
  rationale: A concordância não determina o referente, mas as paixões são o antecedente conceitual mais direto; a nota registra a amplitude possível do demonstrativo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O travessão marca a observação parentética. A vírgula final foi mantida porque o versículo encerra uma oração comparativa cuja continuação vem no contexto seguinte.
