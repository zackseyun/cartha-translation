  naturalness: O português é claro e de registro adequado. A retirada da vírgula após o travessão evita uma pontuação inadequada («—,[a]»), e «foram escravizados pelas paixões» é mais direto e idiomático do que «se tornaram escravos das paixões» sem enfraquecer a imagem.
  terminology: «Paixões», «escravizados», «iguarias» e «vencidos» representam adequadamente o vocabulário ético-filosófico e a imagem de domínio/derrota do grego. «Essas coisas» preserva a abertura referencial de τούτοις.
