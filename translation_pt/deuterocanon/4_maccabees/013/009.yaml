base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/009.yaml
  text: Let us die as brothers[a], brothers, for the sake of the law; let us imitate the three young men in Syria[b], who despised the furnace of equal torment.
translation:
  language: pt
  text: Morramos como irmãos, irmãos, por causa da Lei; imitemos os três jovens na Síria[a], que desprezaram a fornalha comparável à que eles enfrentaram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, os três jovens judeus conhecidos de Daniel 3. O grego diz aqui «na Síria», em vez da localização mais conhecida, «na Babilônia».
    reason: cross_reference
  - marker: b
    text: O adjetivo grego que qualifica «fornalha» é raro e difícil. Pode indicar uma fornalha comparável àquela enfrentada pelos três jovens; outras interpretações são possíveis.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφικῶς
  choice: como irmãos
  rationale: O advérbio indica a maneira solidária e fraterna de morrer; a repetição com o vocativo «irmãos» preserva a ênfase retórica do grego.
- source_word: ἀποθάνωμεν
  choice: Morramos
  rationale: O subjuntivo aoristo é hortativo; «morramos» comunica diretamente a exortação coletiva.
- source_word: ἀδελφοὶ
  choice: irmãos
  rationale: O vocativo se dirige a irmãos homens dentro da narrativa, portanto a forma masculina é contextualmente precisa.
- source_word: περὶ τοῦ νόμου
  choice: por causa da Lei
  rationale: 'περί com genitivo expressa aqui causa ou interesse: morrer em razão da fidelidade à Lei. A inicial maiúscula sinaliza a Lei mosaica sem acrescentar conteúdo denominacional.'
- source_word: μιμησώμεθα
  choice: imitemos
  rationale: Mantém a força hortativa e a referência explícita à imitação do exemplo anterior.
- source_word: τοὺς τρεῖς τοὺς ἐπὶ τῆς Συρίας νεανίσκους
  choice: os três jovens na Síria
  rationale: Segue a localização expressa no texto grego, sem harmonizá-la com a localização mais conhecida de Daniel 3.
- source_word: ἰσοπαίδος
  choice: comparável à deles
  rationale: O adjetivo é raro e de interpretação incerta. A tradução preserva a provável ideia de correspondência entre a fornalha presente e a enfrentada pelos três jovens, evitando atribuir-lhe uma precisão lexical indevida.
- source_word: καμίνου
  choice: fornalha
  rationale: É o termo português corrente e tradicional para a fornalha ardente associada ao episódio de Daniel 3.
- source_word: κατεφρόνησαν
  choice: desprezaram
  rationale: Preserva a força de tratar com desdém ou não temer a ameaça da fornalha.
theological_decisions:
- issue: Alusão a Daniel 3 e localização geográfica
  choice: os três jovens na Síria
  alternative: os três jovens na Babilônia
  rationale: O grego traz explicitamente ἐπὶ τῆς Συρίας. A tradução preserva essa forma textual em vez de harmonizá-la com Daniel 3.
- issue: Gênero de ἀδελφοί
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: Os interlocutores são irmãos homens na narrativa; a tradução mantém o referente histórico concreto.
- issue: Sentido do raro ἰσοπαίδος
  choice: fornalha comparável à deles
  alternative: fornalha de igual tormento
  rationale: A forma grega é obscura. A escolha exprime com cautela a comparação provável com a provação dos três jovens, enquanto uma nota registra a incerteza.
translation_notes:
  register: Português moderno, claro e digno, com subjuntivos hortativos naturais («morramos», «imitemos»). Conserva-se a repetição enfática «como irmãos, irmãos» e a ambiguidade lexical de ἰσοπαίδος é sinalizada em nota.
