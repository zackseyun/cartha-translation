  text: Therefore, let us arm ourselves with the mastery over passions that comes from godly reason.
translation:
  language: pt
  text: Portanto, armemo-nos com o domínio sobre as paixões que vem da razão divina.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com o domínio da razão divina sobre as paixões”.'
    reason: Alternativa lexical e sintática que preserva a leitura mais direta do genitivo como domínio exercido pela razão divina.
lexical_decisions:
- source_word: καθοπλισώμεθα
  choice: armemo-nos
  rationale: O subjuntivo exortativo na primeira pessoa do plural expressa um chamado coletivo e preserva naturalmente a metáfora militar de tomar armas para a luta moral.
- source_word: τοιγαροῦν
  choice: portanto
  rationale: A partícula introduz uma conclusão baseada na exortação anterior; “portanto” mantém com clareza seu valor inferencial.
- source_word: τῇ ... παθοκρατίᾳ
  choice: com o domínio sobre as paixões
  rationale: O dativo indica o meio com que os leitores devem se armar. “Domínio sobre as paixões” comunica governo efetivo, não simples repressão, e preserva o sentido do composto παθοκρατία.
- source_word: τοῦ θείου λογισμοῦ
  choice: que vem da razão piedosa
  rationale: A formulação expressa de modo natural a razão religiosa e moral como fonte desse domínio, sem eliminar a possibilidade de o genitivo indicar que o domínio é exercido pela própria razão.
- source_word: θείου
  choice: piedosa
  rationale: Neste contexto judaico de exortação moral, “piedosa” indica uma razão caracterizada pela devoção a Deus e evita sugerir necessariamente uma entidade metafísica chamada “razão divina”.
- source_word: λογισμοῦ
  choice: razão
  rationale: Em 4 Macabeus, o termo designa a capacidade de julgamento racional e moral que governa as paixões; “razão” é a tradução concisa e estabelecida em português.
theological_decisions:
- issue: Sentido de θεῖος λογισμός no contexto moral e filosófico judaico
  choice: razão piedosa
  alternative: razão divina
  rationale: “Razão piedosa” preserva a dimensão ética e religiosa da expressão sem importar conotações metafísicas ou cristológicas posteriores; a alternativa mais literal é registrada em nota.
- issue: Relação do genitivo τοῦ θείου λογισμοῦ com παθοκρατίᾳ
  choice: o domínio vem da razão piedosa
  alternative: o domínio sobre as paixões pertence à razão divina ou é exercido por ela
  rationale: O genitivo pode indicar fonte, caráter ou agente. O texto principal adota uma formulação natural de fonte, enquanto a nota conserva a ambiguidade legítima.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A forma exortativa “armemo-nos” conserva a metáfora do grego; “paixões” mantém o vocabulário moral-filosófico do livro sem reduzi-lo a emoções em geral.
