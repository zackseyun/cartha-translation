base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/007.yaml
  text: Thus the seven-towered blessedness of the young men[a], having fortified the harbor of godliness, conquered the licentiousness of the passions.
translation:
  language: pt
  text: Assim, o discernimento dos jovens, como uma fortaleza de sete torres[a], depois de fortificar o porto da devoção a Deus, venceu o descontrole das paixões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «o discernimento de sete torres dos jovens». A imagem provavelmente apresenta o discernimento dos sete irmãos como uma fortaleza protegida por sete torres. O substantivo grego também pode ser entendido como «bom senso», «raciocínio correto» ou «nobre resolução».
    reason: A expressão grega é rara e intensamente figurada; a nota preserva sua forma e sua ambiguidade lexical.
lexical_decisions:
- source_word: ἑπτάπυργος
  choice: como uma fortaleza de sete torres
  rationale: O adjetivo composto significa literalmente «de sete torres». A formulação comparativa torna inteligível em português a imagem da virtude dos sete irmãos como uma estrutura fortificada, sem eliminá-la.
- source_word: εὐλογιστία
  choice: discernimento
  rationale: O substantivo raro aponta para bom raciocínio, sensatez ou nobre disposição mental. «Discernimento» se ajusta ao tema do domínio racional das paixões em 4 Macabeus e evita o sentido pouco provável de mera «bem-aventurança».
- source_word: νεανίσκων
  choice: jovens
  rationale: Designa os jovens irmãos e é uma forma natural e fiel em português atual.
- source_word: ὀχυρώσασα
  choice: depois de fortificar
  rationale: Preserva tanto a anterioridade circunstancial do particípio aoristo quanto a imagem militar de tornar seguro um lugar fortificado.
- source_word: λιμένα
  choice: porto
  rationale: É o sentido concreto do substantivo e conserva a metáfora de um refúgio seguro.
- source_word: εὐσεβείας
  choice: devoção a Deus
  rationale: Explicita de modo acessível a reverência religiosa e a fidelidade a Deus implicadas por εὐσέβεια neste livro, sem reduzir o termo a religiosidade exterior.
- source_word: παθῶν
  choice: paixões
  rationale: No contexto filosófico-moral, refere-se aos impulsos e afetos que precisam ser governados, não aos sofrimentos.
- source_word: ἀκολασίαν
  choice: descontrole
  rationale: O termo denota falta de disciplina, excesso desenfreado ou intemperança. «Descontrole» comunica esse sentido amplo sem a conotação predominantemente sexual que «licenciosidade» costuma ter no português atual.
- source_word: ἐνίκησεν
  choice: venceu
  rationale: Mantém o tom triunfal e a imagem de combate do verbo grego, com naturalidade em português.
theological_decisions:
- issue: A expressão figurada ἡ ἑπτάπυργος τῶν νεανίσκων εὐλογιστία
  choice: o discernimento dos jovens, como uma fortaleza de sete torres
  alternative: o discernimento de sete torres dos jovens; a resolução digna dos sete jovens
  rationale: O grego personifica a qualidade racional e moral dos jovens como algo dotado de sete torres, provavelmente evocando os sete irmãos. A tradução mantém a imagem, mas usa uma comparação explícita para que a construção seja compreensível em português. A nota registra a forma mais literal e a possível alusão aos sete.
- issue: O sentido religioso de εὐσέβεια
  choice: devoção a Deus
  alternative: piedade; reverência
  rationale: Em 4 Macabeus, o termo expressa reverência a Deus concretizada na fidelidade à sua lei. A escolha comunica esse conteúdo teológico ao leitor moderno sem acrescentar uma formulação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora militar e portuária foi preservada; a sintaxe foi levemente explicitada para evitar uma expressão opaca, e «descontrole» foi preferido a termos arcaicos ou excessivamente sexualizados.
