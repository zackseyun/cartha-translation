  source_fidelity: A tradução acompanha adequadamente a estrutura e o sentido do grego. «Discernimento» é uma opção defensável para εὐλογιστία no contexto ético-filosófico de 4 Macabeus; «como uma fortaleza de sete torres» explicita, sem eliminar, a imagem incomum de ἑπτάπυργος. «Depois de fortificar», «porto», «devoção a Deus», «paixões» e «venceu» representam bem os elementos centrais da oração. «Descontrole das paixões» comunica de forma ampla a ἀκολασία, sem restringi-la indevidamente ao campo sexual.
