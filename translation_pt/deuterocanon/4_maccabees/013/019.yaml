  source_fidelity: A estrutura do período, a litotes inicial, a linguagem da providência e a distinção entre os pais e o ventre materno são em geral bem preservadas. Contudo, “onisciente” traduz conhecimento total, ao passo que πάνσοφος significa “onissábia” / “plenamente sábia”; é necessária correção para conservar o sentido do adjetivo grego.
