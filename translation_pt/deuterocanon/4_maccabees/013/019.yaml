  yaml_path: translation/deuterocanon/4_maccabees/013/019.yaml
  text: And you are not ignorant of the affections of human nature[a], which the divine and all-wise providence apportioned to those who are born through the fathers, having planted them through the mother's womb;
translation:
  language: pt
  text: E vocês não desconhecem os profundos laços da natureza humana[a], que a providência divina e onissábia repartiu aos que nascem por meio dos pais, tendo-os plantado por meio do ventre materno;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os afetos próprios da humanidade” ou “os vínculos humanos”. Aqui, o grego φίλτρα indica fortes laços de afeição, não encantamentos mágicos literais.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ ἀγνοεῖτε
  choice: vocês não desconhecem
  rationale: Preserva a litotes e a interpelação direta, com naturalidade no português moderno e registro digno.
- source_word: τὰ τῆς ἀνθρωπότητος φίλτρα
  choice: os profundos laços da natureza humana
  rationale: φίλτρα designa aqui fortes vínculos afetivos, não encantamentos mágicos; “profundos laços” comunica sua intensidade sem perder a ligação genitiva com ἀνθρωπότης.
- source_word: θεία καὶ πάνσοφος πρόνοια
  choice: a providência divina e onisciente
  rationale: “Providência” conserva o peso filosófico-teológico de πρόνοια. Neste contexto, πάνσοφος indica sabedoria plena; “onisciente” é uma formulação portuguesa compacta, embora “plenamente sábia” seja alternativa mais estritamente composicional.
- source_word: ἔμερισεν
  choice: repartiu
  rationale: Expressa a distribuição ou concessão ordenada desses laços pela providência.
- source_word: τοῖς γεννωμένοις
  choice: aos que nascem
  rationale: Mantém o particípio passivo em português claro e idiomático.
- source_word: διὰ τῶν πατέρων
  choice: por meio dos pais
  rationale: Retém a mediação paterna expressa pelo grego; “pais” aqui tem sentido masculino, em paralelo com o ventre materno.
- source_word: φυτεύσασα
  choice: tendo-os plantado
  rationale: Preserva a imagem metafórica de plantar ou implantar, bem como a relação participial com “providência”.
- source_word: διὰ τῆς μητρῴας γαστρός
  choice: por meio do ventre materno
  rationale: Representa de modo direto a referência distintamente materna e mantém a repetição de διά.
theological_decisions:
- issue: Sentido de πρόνοια no contexto judaico-helenístico
  choice: providência
  alternative: previsão / cuidado previdente
  rationale: “Providência” expressa o governo e a ordenação divinos sem acrescentar uma formulação doutrinária posterior específica.
- issue: Distinção entre a contribuição paterna e o ventre materno
  choice: manter “por meio dos pais” e “por meio do ventre materno”
  alternative: generalizar como “por meio dos progenitores”
  rationale: O grego distingue explicitamente as referências paterna e materna; preservá-las evita apagar a estrutura do argumento.
translation_notes:
  register: Português moderno, claro e elevado, com legibilidade brasileira. A construção mantém o período contínuo e o ponto e vírgula do contexto. “Vocês” torna explícito o plural da interpelação. “Pais” é usado no sentido de progenitores masculinos, exigido pelo contraste com “ventre materno”.
