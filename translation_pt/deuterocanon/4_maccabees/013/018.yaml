base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/018.yaml
  text: And Jacob will welcome you[a], and all the fathers will praise you. And as each one of their brothers was being taken away, those who remained were saying, “Do not disgrace us, brother[b], nor prove false to those who died before us.”
translation:
  language: pt
  text: 'E Jacó acolherá você[a], e todos os pais o louvarão. E, quando cada um de seus irmãos era levado à força, os que restavam diziam: “Não nos envergonhe, irmão, nem desminta os que morreram antes de nós[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “receberá você” ou “irá ao seu encontro”. O verbo grego está no plural, embora “Jacó” esteja no singular; provavelmente retoma também patriarcas mencionados no contexto anterior.
    reason: lexical_alternative
  - marker: b
    text: Ou “nem se mostre falso para com os que morreram antes de nós”. Isto é, não invalide nem traia o testemunho dos irmãos que já morreram.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδέξονται
  choice: acolherá
  rationale: O verbo expressa receber ou acolher alguém, possivelmente com uma conotação calorosa e honrosa. O singular em português acompanha Jacó como sujeito expresso e torna natural o trecho, embora a forma grega seja plural, provavelmente por continuar uma série de patriarcas mencionados no contexto anterior.
- source_word: οἱ πατέρες
  choice: todos os pais
  rationale: Mantém a expressão literal e honorífica para os antepassados patriarcais, sem substituí-la pela interpretação mais explícita “antepassados”.
- source_word: ἐπαινέσουσιν
  choice: louvarão
  rationale: Equivalente direto e digno de “elogiar” ou “louvar”, apropriado à aprovação conferida pelos patriarcas.
- source_word: ἐνὶ ἑκάστῳ τῶν ἀποσπωμένων
  choice: quando cada um ... era levado à força
  rationale: Reproduz a ocorrência repetida, irmão por irmão, e conserva a ideia de separação coerciva presente em ἀποσπάω sem tornar a violência mais específica do que o texto permite.
- source_word: οἱ περιλειπόμενοι
  choice: os que ficavam
  rationale: Designa os irmãos que ainda permaneciam naquele momento, sem sugerir que sobreviveriam ao episódio inteiro.
- source_word: Μὴ καταισχύνῃς ἡμᾶς
  choice: Não nos envergonhe
  rationale: Expressa a ideia de trazer vergonha ou desonra ao grupo em português corrente e solene.
- source_word: μηδὲ ψεύσῃ τοὺς προαποθανόντας
  choice: nem desminta os que morreram antes de nós
  rationale: “Desminta” preserva a imagem difícil de tornar falsos ou invalidar os que morreram anteriormente, sem reduzir de imediato o sentido a uma simples traição pessoal.
theological_decisions:
- issue: Identidade de Jacó na cena de acolhimento após a morte
  choice: O nome é mantido como referência pessoal ao patriarca Jacó.
  alternative: Entender Jacó coletivamente como Israel.
  rationale: A associação com “todos os pais” favorece a referência ao patriarca entre os antepassados honrados; a tradução não acrescenta uma explicação doutrinária sobre o estado dos mortos.
- issue: Sentido do apelo para não “desmentir” os mortos
  choice: Conservar a imagem de não invalidar ou contradizer os que morreram antes.
  alternative: Traduzir diretamente como “não traia os que morreram antes de nós”.
  rationale: A formulação grega admite tensão entre tornar falso, mostrar-se falso para com alguém e trair seu testemunho; “desminta” retém essa tensão, com esclarecimento em nota.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, evitando regionalismos fortes. O tratamento por “você” corresponde ao irmão individualmente interpelado. A repetição narrativa foi vertida de modo fluente, e as ambiguidades relevantes foram preservadas ou registradas em nota.
