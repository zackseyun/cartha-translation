translation:
  language: pt
  text: tendo sido levados à plena maturidade em sua alma, tendo sido dados à luz após períodos iguais de tempo e bebendo leite das mesmas fontes[a], das quais são nutridos juntos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'As «fontes» são uma imagem materna; também se pode traduzir: «mamando nos mesmos seios».'
