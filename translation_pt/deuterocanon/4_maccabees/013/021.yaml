  - marker: b
    text: 'A oração final também pode ser entendida como: «das quais são criados juntos». O verbo grego pode indicar tanto a nutrição quanto a criação em comum.'
    reason: alternative_reading
lexical_decisions:
- source_word: ψυχῆς τελεσφορηθέντες
  choice: tendo sido levados à plena maturidade quanto à alma
  rationale: Preserva o valor passivo de τελεσφορηθέντες e entende ψυχῆς como genitivo de referência, sem recorrer ao termo teologicamente carregado «aperfeiçoados».
- source_word: διὰ τῶν ἴσων ... χρόνων
  choice: depois de iguais períodos de gestação
  rationale: No contexto de ἀποτεχθέντες, os «iguais períodos de tempo» são os períodos de gestação; a explicitação torna a imagem materna clara em português.
- source_word: ἀποτεχθέντες
  choice: vindo ao mundo
  rationale: Expressa de modo natural o nascimento indicado pelo particípio passivo, evitando a formulação pouco idiomática «tendo sido dados à luz» na sequência.
- source_word: γαλακτοποτοῦντες ... πηγῶν
  choice: bebendo leite das mesmas fontes
  rationale: Mantém tanto o sentido do verbo composto, «beber leite», quanto a metáfora explícita de πηγαί, «fontes», sem introduzir diretamente «seios» no texto.
- source_word: συντρέφονται
  choice: são nutridos juntos
  rationale: Conserva no texto a ideia imediata de nutrição e também o prefixo associativo συν-, embora o verbo possa abranger a criação conjunta.
