  text: But he kept saying[a], “Remember from whom you come, and by what father's hand you are to be slaughtered.”
translation:
  language: pt
  text: 'Mas ele continuava dizendo: “Lembrem-se de onde vocês vêm[a], ou por mão de qual pai vocês serão degolados.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de quem vocês descendem”. A expressão grega pode indicar lugar de origem, mas, neste contexto, também pode apontar para a linhagem familiar.'
    reason: alternativa lexical e preservação da ambiguidade
lexical_decisions:
- source_word: ὁ δὲ ἔλεγεν
  choice: Mas ele continuava dizendo
  rationale: O imperfeito ἔλεγεν sugere ação contínua ou repetida; “continuava dizendo” preserva esse aspecto. δέ marca a transição do discurso e é vertido por “Mas”.
- source_word: Μνήσθητε
  choice: Lembrem-se
  rationale: O imperativo aoristo pede uma recordação deliberada e direta. O plural explícito concorda com os destinatários.
- source_word: πόθεν ἐστέ
  choice: de onde vocês vêm
  rationale: Traduz diretamente πόθεν sem eliminar a possibilidade contextual de que a origem mencionada seja familiar ou ancestral.
- source_word: ἢ
  choice: ou
  rationale: Mantém a conjunção disjuntiva presente no texto grego, em vez de substituí-la silenciosamente por “e”.
- source_word: τίνος πατρὸς χειρὶ
  choice: pela mão de que pai
  rationale: Preserva a pergunta sobre a identidade ou natureza do pai e conserva a imagem concreta de χείρ como meio ou agência.
- source_word: σφαγιασθῆναι
  choice: serão degolados
  rationale: O verbo denota morte violenta por abate e pode ter ressonância sacrificial. “Degolados” conserva a força brutal sem explicitar uma interpretação teológica adicional.
theological_decisions:
- issue: Sentido de πόθεν ἐστέ
  choice: “de onde vocês vêm”, com nota sobre a possível referência à linhagem
  alternative: “de quem vocês descendem”
  rationale: πόθεν expressa primariamente origem e pode ser local ou figurada. O contexto paterno favorece a linhagem, mas o texto principal mantém a ambiguidade lexical.
- issue: Ressonância sacrificial de σφαγιασθῆναι
  choice: “serão degolados”
  alternative: “serão imolados”
  rationale: “Imolados” tornaria mais explícita a leitura sacrificial. “Degolados” comunica a violência do verbo e permite que a possível alusão sacrificial permaneça implícita.
- issue: Relação expressa por ἢ
  choice: “ou”
  alternative: “e”
  rationale: A forma grega transmitida traz uma disjunção. Embora a ligação entre as duas exortações seja difícil, preservá-la evita harmonizar ou resolver a tensão sintática sem apoio textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais (“vocês”). A construção incomum “pela mão de que pai” conserva deliberadamente a imagem e a tensão do grego.
