  source_fidelity: A tradução preserva a cadeia de vocativos laudatórios e trata adequadamente βασάνων como «torturas», βιαιότερε como força superior no contexto e os dois termos para homem idoso. Contudo, «rei maior que os sofrimentos» reproduz uma solução comparativa do trilho inglês, mas não expressa bem o superlativo μέγιστε nem a relação de domínio sugerida pelo genitivo παθῶν.
  naturalness: «Rei maior que os sofrimentos» soa pouco idiomático em português e é semanticamente menos preciso. «Rei supremo sobre os sofrimentos» é natural, mantém o registro elevado e conserva a metáfora sem transformar «rei» em título político.
  terminology: «Ancião», «homem idoso», «torturas», «fogo» e «sofrimentos» são escolhas claras e adequadas ao registro. «Supremo» traduz o valor superlativo de μέγιστε; «sobre» explicita de modo idiomático a esfera metafórica de domínio, sem impor leitura doutrinária.
