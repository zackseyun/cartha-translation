  yaml_path: translation/deuterocanon/4_maccabees/007/010.yaml
  text: O Eleazar[a], elder stronger than torments, old man more intense than fire[b], and king greater than sufferings.
translation:
  language: pt
  text: Ó ancião mais forte que as torturas[a], homem idoso mais vigoroso que o fogo[b] e rei supremo sobre os sofrimentos, Eleazar!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «tormentos»; neste contexto, o grego pode designar mais especificamente torturas.
    reason: lexical_alternative
  - marker: b
    text: «Ancião», «homem idoso» e «rei» são aclamações metafóricas dirigidas a Eleazar; «rei» não indica aqui um cargo político.
    reason: cultural_note
lexical_decisions:
- source_word: βασάνων
  choice: torturas
  rationale: No contexto do martírio, o termo designa sofrimentos infligidos deliberadamente e pode referir-se de modo específico à tortura; «torturas» preserva essa força concreta.
- source_word: βιαιότερε
  choice: mais forte que
  rationale: Embora o comparativo possa significar literalmente «mais violento» ou «mais impetuoso», aqui ele exalta a força moral de Eleazar diante da violência das torturas. «Mais forte que» comunica naturalmente a comparação sem atribuir crueldade a Eleazar.
- source_word: γέρων
  choice: ancião
  rationale: Conserva a dignidade do vocativo dirigido a um homem de idade avançada e permite distingui-lo do vocativo seguinte.
- source_word: εὐτονώτερε
  choice: mais vigoroso que
  rationale: O adjetivo expressa vigor, tensão, firmeza ou intensidade. «Mais vigoroso que» mantém a qualidade atribuída a Eleazar e a comparação elevada com o fogo.
- source_word: πρεσβῦτα
  choice: homem idoso
  rationale: Representa o segundo vocativo referente à idade sem repetir «ancião», preservando o paralelismo retórico do grego.
- source_word: παθῶν
  choice: sofrimentos
  rationale: Neste contexto, refere-se às aflições suportadas, não a paixões interiores.
- source_word: μέγιστε βασιλεῦ
  choice: rei maior que
  rationale: Preserva a metáfora régia e entende o genitivo como comparação, em continuidade com os dois comparativos anteriores.
- source_word: Ἐλεαζάρ
  choice: Eleazar
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
theological_decisions:
- issue: Linguagem honorífica e metafórica dirigida a Eleazar
  choice: Manter os três vocativos elevados — «ancião», «homem idoso» e «rei» — e suas comparações.
  alternative: Reduzir a frase a uma descrição explicativa, como «tu és mais forte que as torturas e os sofrimentos».
  rationale: O grego aclama Eleazar por meio de uma sequência poética de vocativos. Preservar essa forma evita apagar a retórica ou transformar «rei» em afirmação de cargo político.
- issue: Sentido de βιαιότερε aplicado a Eleazar
  choice: «mais forte que»
  alternative: «mais violento que»
  rationale: A tradução escolhida conserva a ideia contextual de força superior sem sugerir que Eleazar pratica violência; a tensão semântica do termo é reconhecida na decisão lexical.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura exclamativa e paralelismo próximos do grego. A colocação final de «Eleazar» segue a ordem enfática da fonte. «Homem idoso» evita a conotação depreciativa que «velho» pode adquirir no uso atual, ao mesmo tempo que distingue πρεσβῦτα de γέρων.
