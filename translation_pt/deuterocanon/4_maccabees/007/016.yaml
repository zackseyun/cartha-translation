  yaml_path: translation/deuterocanon/4_maccabees/007/016.yaml
  text: If[a], then, an old man despised tortures even to the point of death because of piety, then surely pious reason is ruler over the passions.
translation:
  language: pt
  text: Ora, se um homem idoso desprezou torturas até a morte por causa da piedade[a], então é indiscutível que a razão piedosa governa as paixões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por amor à piedade». A expressão grega pode indicar tanto a causa quanto a finalidade.'
    reason: alternativa lexical
lexical_decisions:
- source_word: γέρων
  choice: um homem idoso
  rationale: Expressa naturalmente uma pessoa do sexo masculino em idade avançada, preservando a referência singular sem o possível tom depreciativo de «um velho».
- source_word: τῶν μέχρι θανάτου βασάνων
  choice: torturas que chegavam até a morte
  rationale: '«Torturas» comunica a severidade de βάσανοι, e a oração relativa preserva a extensão indicada por μέχρι θανάτου: tormentos suportados até o limite da morte.'
- source_word: περιεφρόνησεν
  choice: desprezou
  rationale: 'Mantém a força retórica do verbo: ele considerou as torturas de pouca importância diante de sua fidelidade religiosa.'
- source_word: διʼ εὐσέβειαν
  choice: por causa da piedade
  rationale: A formulação representa a leitura causal mais provável no argumento, entendendo a devoção reverente a Deus como motivo da resistência; a possível nuance de finalidade é registrada em nota.
- source_word: ὁμολογουμένως
  choice: é indiscutível que
  rationale: Transmite a ideia de uma conclusão reconhecida ou admitida por todos, em português corrente e enfático.
- source_word: ἡγεμὼν
  choice: governa
  rationale: A conversão natural do substantivo predicativo em verbo comunica o exercício de autoridade e domínio no contexto filosófico, sem sugerir um cargo político.
- source_word: τῶν παθῶν
  choice: as paixões
  rationale: Preserva o sentido filosófico das forças afetivas e impulsos que devem ser governados, em vez de reduzir o termo a emoções em geral.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: a razão piedosa
  rationale: 'Conserva a estrutura e a terminologia programática da obra: a faculdade racional formada e orientada pela reverência a Deus.'
theological_decisions:
- issue: Tradução da expressão filosófico-teológica ὁ εὐσεβὴς λογισμός
  choice: a razão piedosa
  alternative: a razão orientada pela piedade
  rationale: A escolha mantém unidas as dimensões racional e devocional da tese central de 4 Macabeus, sem introduzir categorias doutrinárias posteriores.
- issue: Valor semântico de διʼ εὐσέβειαν
  choice: por causa da piedade
  alternative: por amor à piedade
  rationale: 'O sentido causal se ajusta ao argumento: a reverência a Deus motivou o desprezo pelas torturas. Como a construção também pode admitir finalidade, essa alternativa é preservada em nota.'
- issue: Relação entre a razão piedosa e as paixões
  choice: governa as paixões
  alternative: é soberana sobre as paixões
  rationale: A tradução afirma domínio regulador, conforme ἡγεμών, sem sugerir que as paixões sejam eliminadas ou sem resolver além do texto a natureza desse governo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Ora, se... então» torna explícita a progressão argumentativa já presente no grego; a terminologia filosófica central «razão piedosa» e «paixões» foi preservada.
