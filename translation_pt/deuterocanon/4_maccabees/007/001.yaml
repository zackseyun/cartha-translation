  yaml_path: translation/deuterocanon/4_maccabees/007/001.yaml
  text: For just as the reasoning of our father Eleazar[a], like an excellent helmsman, was steering the ship of godliness on the sea of the passions[b],
translation:
  language: pt
  text: Pois, assim como um excelente timoneiro, o raciocínio de nosso pai Eleazar guiava, ao leme, o navio da devoção a Deus[a] pelo mar das paixões[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o navio da piedade”. O termo grego εὐσέβεια indica devoção reverente a Deus, expressa em conduta fiel.
    reason: lexical_alternative
  - marker: b
    text: Aqui, o grego πάθη provavelmente significa “paixões” ou emoções e impulsos desordenados, tema central de 4 Macabeus, e não apenas “sofrimentos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: Pois, assim como
  rationale: Preserva tanto a função explicativa de γάρ como a comparação introduzida por ὥσπερ, mantendo a ligação com o contexto anterior.
- source_word: ἄριστος κυβερνήτης
  choice: um excelente timoneiro
  rationale: Mantém a imagem náutica e expressa habilidade notável sem dar a ἄριστος um sentido absoluto desnecessário.
- source_word: ὁ ... λογισμός
  choice: o raciocínio
  rationale: Em 4 Macabeus, λογισμός designa a faculdade de ponderação moral que governa as paixões. “Raciocínio” conserva o aspecto ativo sem impor terminologia filosófica posterior.
- source_word: τοῦ πατρὸς ἡμῶν Ἐλεαζάρου
  choice: de nosso pai Eleazar
  rationale: Conserva a relação genitiva e a forma honorífica e familiar com que Eleazar é apresentado.
- source_word: πηδαλιουχῶν
  choice: conduzia ao leme
  rationale: Reproduz a ação contínua do particípio e sua referência específica ao governo da embarcação por meio do leme.
- source_word: τὴν τῆς εὐσεβείας ναῦν
  choice: a nau da piedade
  rationale: “Nau” sustenta a metáfora elevada, enquanto “piedade” comunica devoção reverente a Deus manifestada em conduta fiel.
- source_word: ἐν τῷ τῶν παθῶν πελάγει
  choice: pelo mar das paixões
  rationale: Mantém a metáfora do mar aberto e verte πάθη segundo o tema moral-psicológico recorrente da obra, em vez de reduzi-lo a sofrimentos externos.
theological_decisions:
- issue: Sentido de λογισμός no governo moral das paixões
  choice: o raciocínio
  alternative: a razão; a mente racional; o juízo racional
  rationale: A escolha preserva a atividade de ponderar e dirigir moralmente sem transformar o termo em uma abstração técnica nem resolver a tensão entre razão, Lei e devoção presente na obra.
- issue: Sentido religioso de εὐσέβεια
  choice: piedade
  alternative: devoção a Deus; religiosidade
  rationale: “Piedade” conserva o peso religioso e moral do termo, entendido como reverência a Deus expressa em fidelidade prática; a nota esclarece o sentido para leitores modernos.
- issue: Sentido de πάθη
  choice: paixões
  alternative: emoções; sofrimentos
  rationale: No argumento de 4 Macabeus, o termo aponta sobretudo para impulsos e emoções sujeitos ao governo do raciocínio. “Paixões” preserva essa linguagem filosófico-moral sem negar toda a amplitude possível do termo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A imagem náutica foi mantida de modo consistente em “timoneiro”, “leme”, “nau” e “mar”. A vírgula final preserva o caráter incompleto do período grego fornecido, que continua no contexto seguinte.
