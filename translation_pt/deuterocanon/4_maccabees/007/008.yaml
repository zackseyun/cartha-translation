  text: Such men must be those who establish the law with their own blood[a], and defend it with noble sweat through sufferings unto death.
translation:
  language: pt
  text: Assim devem ser aqueles que firmam a lei com o próprio sangue[a] e a defendem com nobre suor, por meio de sofrimentos até a morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sustentam a lei” ou “dão realidade à lei”. O verbo grego pode significar fazer ou produzir; aqui, provavelmente se refere a firmar a lei por meio da fidelidade, e não a criá-la como legisladores.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιούτους δεῖ εἶναι
  choice: Assim devem ser
  rationale: 'Preserva a ideia de necessidade e o valor qualitativo do demonstrativo: pessoas desse caráter ou dessa espécie.'
- source_word: τοὺς δημιουργοῦντας τὸν νόμον
  choice: aqueles que firmam a lei
  rationale: Embora δημιουργέω possa significar fazer ou produzir, o contexto não trata de legislar, mas de confirmar e tornar efetiva a lei pela fidelidade. “Firmam” comunica esse sentido sem eliminar a amplitude lexical, registrada na nota.
- source_word: ἰδίῳ αἵματι
  choice: com o próprio sangue
  rationale: Reproduz o dativo instrumental e mantém a imagem concreta e sacrificial do grego.
- source_word: γενναίῳ ἱδρῶτι
  choice: com nobre suor
  rationale: Mantém a metáfora corporal e intensa; “nobre” expressa a coragem e a dignidade associadas a γενναῖος.
- source_word: τοῖς μέχρι θανάτου πάθεσιν
  choice: em meio a sofrimentos até a morte
  rationale: πάθη designa aflições suportadas, e μέχρι θανάτου apresenta a morte como o limite extremo sem especificar além do texto se ela já ocorreu.
- source_word: ὑπερασπίζοντας
  choice: a defendem
  rationale: Expressa diretamente a ação de defender ou lutar em favor da lei, retomada pelo pronome.
theological_decisions:
- issue: Sentido de δημιουργοῦντας τὸν νόμον
  choice: aqueles que firmam a lei
  alternative: aqueles que fazem a lei; aqueles que sustentam a lei
  rationale: O contexto apresenta pessoas que confirmam a lei por sua conduta e sofrimento, não legisladores que a criam. “Firmam” preserva a força ativa do verbo sem importar essa leitura equivocada.
- issue: Referência masculina da construção participial
  choice: aqueles que
  alternative: os homens que
  rationale: A forma masculina plural é representada por “aqueles”, construção natural em português que não acrescenta o substantivo “homens”, ausente do texto grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a imagem incomum e concreta de “nobre suor” e a tensão de “até a morte”.
