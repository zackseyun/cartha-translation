  source_fidelity: 'A tradução acompanha de perto os dois dativos instrumentais do grego: «pelo espírito da razão» para τῷ πνεύματι τοῦ λογισμοῦ e «por meio de uma razão semelhante à de Isaque» para τῷ Ἰσακείῳ λογισμῷ. «Tornou ineficaz» expressa adequadamente ἠκύρωσεν, sem alegar uma destruição física do instrumento. «Roda de tortura de muitas cabeças» preserva a imagem de πολυκέφαλον στρέβλαν e a nota comunica apropriadamente a incerteza histórica e lexical de στρέβλα.'
