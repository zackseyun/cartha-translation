  text: by the spirit of reason[a], and by Isaac-like reason he nullified the many-headed wheel.
translation:
  language: pt
  text: pelo espírito da razão e, por meio de uma razão semelhante à de Isaque, ele tornou ineficaz a roda de tortura de muitas cabeças.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o instrumento de tortura de muitas cabeças”. O termo grego designa um aparelho de tortura, mas sua forma exata é incerta; “roda de tortura” conserva uma possível imagem concreta.
    reason: alternativa lexical e incerteza histórica quanto ao instrumento
lexical_decisions:
- source_word: πνεύματι
  choice: espírito
  rationale: Conserva a imagem de uma força ou disposição interior que anima a razão, sem identificar o termo com o Espírito Santo.
- source_word: λογισμοῦ / λογισμῷ
  choice: razão
  rationale: A repetição de λογισμός é central em 4 Macabeus e designa a razão disciplinada que governa as paixões; repetir “razão” mantém essa ligação lexical.
- source_word: Ἰσακείῳ
  choice: semelhante à de Isaque
  rationale: O adjetivo exprime semelhança com Isaque. Esta formulação natural preserva a alusão sem transformá-la em simples posse nem desenvolver sua interpretação.
- source_word: πολυκέφαλον
  choice: de muitas cabeças
  rationale: Reproduz literalmente a imagem vívida do adjetivo composto, embora a forma exata do aparelho permaneça incerta.
- source_word: στρέβλαν
  choice: roda de tortura
  rationale: O termo indica um instrumento de tortura. “Roda de tortura” preserva uma possível imagem concreta, enquanto a nota registra a incerteza sobre o aparelho exato.
- source_word: ἠκύρωσεν
  choice: tornou ineficaz
  rationale: Exprime o sentido de invalidar ou privar de efeito, indicando que o instrumento não alcançou seu propósito diante da firmeza do sofredor.
theological_decisions:
- issue: Natureza do “espírito” em τῷ πνεύματι τοῦ λογισμοῦ
  choice: força ou disposição interior da razão, com “espírito” em minúscula
  alternative: referência ao Espírito Santo; mente ou poder da razão
  rationale: O contexto exalta o domínio exercido pela razão sobre o sofrimento e as paixões, sem indicação imediata de que πνεῦμα seja o Espírito divino.
- issue: Sentido da alusão a Isaque
  choice: 'comparação alusiva: “uma razão semelhante à de Isaque”'
  alternative: a razão pertencente a Isaque; explicitação como imitação do exemplo de Isaque
  rationale: A forma adjetival indica semelhança. A tradução mantém a alusão e evita acrescentar uma explicação teológica que o texto não formula.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A construção “por meio de uma razão semelhante à de Isaque” evita o adjetivo artificial “isaquiano”. A repetição de “razão” conserva o motivo lexical do original, e “espírito” permanece em minúscula para não impor uma leitura pneumatológica.
