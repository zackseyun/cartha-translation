  yaml_path: translation/deuterocanon/4_maccabees/007/003.yaml
  text: In no way did he turn aside the rudders of godliness[a], until he sailed into the harbor of victory over death.
translation:
  language: pt
  text: De modo algum ele desviou os lemes da devoção, até alcançar, navegando, o porto da vitória sobre a morte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente, mas com menor probabilidade neste contexto: “o porto da vitória da morte”. A sequência de genitivos no grego é condensada.'
    reason: Registra a ambiguidade sintática genuína da expressão grega sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: κατʼ οὐδένα τρόπον
  choice: De modo algum
  rationale: Expressa com naturalidade e força a negação enfática do grego.
- source_word: μετέτρεψεν
  choice: desviou
  rationale: O verbo pode significar mudar, virar ou desviar; “desviou” mantém a ideia de alteração de rumo dentro da metáfora náutica.
- source_word: τοὺς τῆς εὐσεβείας οἴακας
  choice: os lemes da devoção
  rationale: Mantém o plural concreto de οἴακες e a imagem marítima. “Devoção” comunica aqui a reverência e fidelidade religiosa de εὐσέβεια sem o possível sentido predominante de compaixão que “piedade” tem no português corrente.
- source_word: ἕως οὗ
  choice: até
  rationale: Reproduz de modo direto a relação temporal indicada pelo grego.
- source_word: ἔπλευσεν
  choice: alcançar, navegando
  rationale: Preserva tanto a ação de navegar quanto a chegada ao destino, em construção idiomática portuguesa.
- source_word: ἐπὶ ... λιμένα
  choice: o porto
  rationale: “Porto” é o equivalente natural de λιμήν e conserva a imagem de um destino alcançado por navegação.
- source_word: τὸν τῆς θανάτου νίκης λιμένα
  choice: o porto da vitória sobre a morte
  rationale: Entende θανάτου como genitivo objetivo de νίκης. Essa leitura se harmoniza com o elogio da perseverança do mártir, mas a compressão da sequência de genitivos permite outra análise, registrada em nota.
theological_decisions:
- issue: Relação dos genitivos em τὸν τῆς θανάτου νίκης λιμένα
  choice: o porto da vitória sobre a morte
  alternative: o porto da vitória da morte
  rationale: No contexto de resistência fiel até o martírio, a primeira leitura dá continuidade ao movimento elogioso e à metáfora de chegada vitoriosa. Como a formulação grega é compacta e admite formalmente a ideia de uma vitória pertencente à morte, a alternativa não é eliminada, mas preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora náutica foi mantida por meio de “lemes”, “navegando” e “porto”; evitou-se “piedade” porque, no uso corrente, pode sugerir sobretudo compaixão.
