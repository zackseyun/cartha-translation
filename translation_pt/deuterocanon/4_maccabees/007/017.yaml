  text: But perhaps some might say[a], “Not all gain mastery over their passions[b], because not all have prudent reason.”
translation:
  language: pt
  text: 'Mas talvez alguns digam: “Nem todos dominam as paixões[a], pois nem todos têm uma razão prudente[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “prevalecem sobre as paixões” ou “mantêm as paixões sob controle”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “têm uma razão sábia/sensata”. O grego emprega aqui um termo-chave para o juízo racional, central ao argumento de 4 Macabeus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσως δʼ ἂν εἴποιέν τινες
  choice: Mas talvez alguns digam
  rationale: Preserva a introdução de uma objeção hipotética; o optativo com ἄν expressa possibilidade, e esta formulação é natural em português.
- source_word: τῶν παθῶν
  choice: as paixões
  rationale: Neste livro, πάθη designa sobretudo paixões, emoções e impulsos sujeitos ao governo da razão, não sofrimentos externos.
- source_word: οὐ πάντες περικρατοῦσιν
  choice: Nem todos dominam
  rationale: περικρατέω indica exercer domínio ou prevalecer sobre algo. “Dominam” comunica isso de modo conciso e digno, sem acrescentar uma ideia explícita de capacidade.
- source_word: φρόνιμον
  choice: prudente
  rationale: O adjetivo denota sabedoria prática, sensatez ou bom juízo; “prudente” conserva sua nuance ético-filosófica.
- source_word: τὸν λογισμόν
  choice: uma razão
  rationale: λογισμός é um termo central de 4 Macabeus para a faculdade de raciocinar e julgar. “Razão” é claro e mantém a terminologia filosófica, enquanto o artigo indefinido produz uma construção natural em português com o adjetivo predicativo.
theological_decisions:
- issue: Afirmação antropológico-filosófica sobre o domínio moral de si
  choice: A falta de domínio sobre as paixões é relacionada ao fato de nem todos terem uma razão caracterizada pela prudência.
  alternative: Entender que nem todos exercem a razão prudentemente, sem qualquer referência à qualidade em que a possuem.
  rationale: A construção grega com ἔχουσιν e o adjetivo predicativo φρόνιμον descreve a razão como prudente. A tradução não deve ser ampliada para negar que essas pessoas possuam qualquer faculdade racional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A fala hipotética foi marcada por dois-pontos e aspas; “paixões” e “razão” preservam o vocabulário filosófico central do livro.
