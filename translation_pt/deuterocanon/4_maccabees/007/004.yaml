base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/004.yaml
  text: No city under siege ever held out against many and varied siege engines as that most holy man[a], while his sacred soul was being burned by tortures and the wheel[b], stirred up those besieging him through the reason that defends godliness.
translation:
  language: pt
  text: 'Nenhuma cidade sitiada jamais resistiu a muitas e variadas máquinas de cerco como aquele homem santíssimo: enquanto sua alma sagrada era abrasada por torturas e instrumentos de tortura[a], ele abalou os que o sitiavam por meio da razão que defende a devoção a Deus.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “instrumentos de torção” ou “cavaletes de tortura”. O termo grego designa instrumentos que torciam ou distendiam o corpo, mas não permite identificar com certeza um aparelho específico.
    reason: lexical_alternative
  - marker: b
    text: Ou “por causa da razão que defende a devoção a Deus”. A construção grega pode indicar tanto o meio como a causa de ele abalar os que o sitiavam.
    reason: source_ambiguity
lexical_decisions:
- source_word: πόλις
  choice: cidade
  rationale: Preserva diretamente a imagem militar de uma cidade submetida a cerco.
- source_word: μηχανήμασιν
  choice: máquinas de cerco
  rationale: O contexto explícito de cerco favorece o sentido militar, não o genérico de mecanismos ou dispositivos.
- source_word: ἀντέσχεν
  choice: resistiu
  rationale: Expressa com naturalidade a perseverança de uma cidade sob ataque e mantém o paralelo com o mártir.
- source_word: πανάγιος
  choice: santíssimo
  rationale: Reproduz o valor intensivo e o registro elevado do adjetivo grego.
- source_word: ἱερὰν ψυχὴν
  choice: alma sagrada
  rationale: Mantém a linguagem sacral e psicológica do original sem reduzir ψυχή simplesmente a “vida”.
- source_word: αἰκισμοῖς
  choice: torturas
  rationale: Comunica claramente os maus-tratos cruéis no contexto do martírio.
- source_word: στρέβλαις
  choice: instrumentos de torção
  rationale: Evita identificar sem certeza o aparelho como roda ou cavalete e preserva a noção etimológica e contextual de torcer ou distender.
- source_word: πυρπολούμενος
  choice: era abrasada
  rationale: Conserva a vigorosa metáfora de queimar, aplicando-a naturalmente à alma em português.
- source_word: ἐκίνησεν
  choice: abalou
  rationale: Expressa que a firmeza do mártir perturbou seus algozes e se harmoniza com a metáfora continuada do cerco, sem especificar indevidamente que ele os repeliu.
- source_word: τοὺς πολιορκοῦντας
  choice: os que o sitiavam
  rationale: Preserva a aplicação metafórica da linguagem de cerco aos perseguidores.
- source_word: λογισμόν
  choice: razão
  rationale: Mantém o termo temático central de 4 Macabeus para a faculdade racional que governa as paixões.
- source_word: ὑπερασπίζοντα τῆς εὐσεβείας
  choice: que defende a devoção a Deus
  rationale: Transmite a defesa ativa expressa pelo particípio e esclarece o sentido religioso de εὐσέβεια, evitando que “piedade” seja entendida como mera compaixão.
theological_decisions:
- issue: Sentido de εὐσέβεια
  choice: devoção a Deus
  alternative: piedade
  rationale: A expressão comunica reverência religiosa e conduta fiel em linguagem portuguesa atual; “piedade” é possível, mas pode ser entendida principalmente como compaixão.
- issue: Sentido temático de λογισμός
  choice: razão
  alternative: discernimento racional
  rationale: “Razão” preserva de forma concisa a terminologia filosófico-moral recorrente do livro, sem acrescentar uma interpretação técnica não exigida pelo texto.
- issue: Força de διὰ com acusativo
  choice: por meio da razão
  alternative: por causa da razão
  rationale: O contexto permite compreender a razão como o meio pelo qual ele abala os perseguidores, mas a construção também admite valor causal; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com a extensa metáfora militar do cerco preservada. A pontuação com dois-pontos esclarece a comparação sem desfazer sua intensidade retórica.
