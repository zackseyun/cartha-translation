base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/009.yaml
  text: You[a], father, confirmed our law-abiding way by our endurance unto glory, and, speaking honorably of holiness, you did not abolish it, and by your deeds you certified the words of philosophy[b].
translation:
  language: pt
  text: Tu, pai, confirmaste nosso modo de vida conforme a lei por meio de atos de perseverança, para a glória[a]; e, ao falar com reverência da santidade, não a anulaste; por teus atos, atestaste os ensinamentos da filosofia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até resultar em glória”. A expressão grega pode indicar finalidade ou resultado.
    reason: lexical_alternative
  - marker: b
    text: Ou “as palavras” ou “os argumentos da filosofia”. O termo grego λόγοι admite esses sentidos.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνομίαν
  choice: modo de vida conforme a lei
  rationale: Expressa a vida ordenada pela lei, e não apenas uma legalidade abstrata; preserva o caráter ético e concreto do termo no contexto.
- source_word: διὰ τῶν ὑπομονῶν
  choice: por meio de atos de perseverança
  rationale: Mantém o plural grego e apresenta a perseverança sob sofrimento como meio de confirmação, sem acrescentar um possessivo ausente do texto.
- source_word: εἰς δόξαν
  choice: para a glória
  rationale: Conserva a ideia de direção ou finalidade de εἰς, deixando em aberto se a glória é objetivo ou resultado.
- source_word: ἐκύρωσας
  choice: confirmaste
  rationale: Comunica a ideia de validar ou estabelecer como verdadeiro e digno o modo de vida conforme a lei.
- source_word: ἁγιαστίαν
  choice: santidade
  rationale: Equivalente natural para a qualidade religiosa e moral indicada pelo substantivo.
- source_word: σεμνολογήσας
  choice: ao falar com reverência de
  rationale: Preserva tanto o ato de falar quanto o tom digno e reverente do verbo, sem reduzi-lo simplesmente a 'honrar'.
- source_word: οὐ κατέλυσας
  choice: não a anulaste
  rationale: Indica que a conduta do pai não desfez nem invalidou a santidade da qual ele falava.
- source_word: ἐπιστοποίησας
  choice: atestaste
  rationale: Expressa confirmação mediante evidência, aqui fornecida pelos atos.
- source_word: τοὺς τῆς φιλοσοφίας λόγους
  choice: os ensinamentos da filosofia
  rationale: Neste contexto, λόγοι designa formulações, argumentos ou ensinamentos filosóficos; 'ensinamentos' é natural em português, enquanto a nota preserva outras possibilidades.
theological_decisions:
- issue: Sentido de φιλοσοφία em 4 Macabeus
  choice: filosofia
  alternative: sabedoria; ensino racional
  rationale: O livro emprega conscientemente vocabulário filosófico helenístico. 'Filosofia' preserva esse universo conceitual sem domesticá-lo como mera sabedoria genérica.
- issue: Referente implícito de διὰ τῶν ὑπομονῶν
  choice: atos de perseverança, sem possessivo
  alternative: nossa perseverança; tua perseverança
  rationale: O grego não contém possessivo junto de ὑπομονῶν. Evitar acrescentá-lo conserva a ambiguidade sobre quem pratica os atos de perseverança.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas de segunda pessoa do singular para refletir a interpelação direta do grego. A redação evita inserir possessivo onde o original não o traz e mantém a linguagem filosófica característica da obra.
