lexical_decisions:
- source_word: οὐδὲν
  choice: em nada
  rationale: 'O neutro acusativo tem valor adverbial neste contexto e intensifica a negação: o aparente contraexemplo não contraria de modo algum o argumento.'
- source_word: οὖν
  choice: portanto
  rationale: Mantém a inferência que liga esta afirmação ao argumento anterior.
- source_word: ἐναντιοῦται
  choice: contraria
  rationale: Expressa oposição ou conflito argumentativo de maneira natural em português, sem afirmar mais especificamente que houve uma contradição lógica formal.
- source_word: τὸ φαίνεσθαί τινας
  choice: o fato de alguns parecerem
  rationale: Reproduz a função substantiva do infinitivo articular e preserva a distinção entre aparência e realidade contida em φαίνεσθαι.
- source_word: παθοκρατεῖσθαι
  choice: dominados pelas paixões
  rationale: Preserva a imagem de governo ou controle exercido pelos πάθη e se integra ao vocabulário filosófico da obra.
- source_word: διὰ τὸν ἀσθενῆ λογισμόν
  choice: devido à fraqueza da razão
  rationale: Traduz διά com sentido causal e apresenta em português corrente a ideia de uma capacidade racional fraca, mantendo o contraste entre razão e paixões.
theological_decisions:
- issue: Contraste antropológico e filosófico entre razão e paixões
  choice: razão e dominados pelas paixões
  alternative: mente e vencidos pelas emoções
  rationale: A escolha conserva o quadro conceitual recorrente de 4 Macabeus, no qual a razão governa as paixões, sem introduzir categorias doutrinárias posteriores.
- issue: Complemento implícito de ἐναντιοῦται
  choice: essa conclusão
  alternative: 'deixar o verbo sem complemento expresso: “em nada se opõe”'
  rationale: O grego deixa implícito aquilo que não é contrariado; “essa conclusão” torna a relação argumentativa clara em português sem identificar uma doutrina além do contexto imediato.
translation_notes:
  register: Português atual, digno e acessível, com vocabulário filosófico estável. “Paixões” e “razão” preservam os termos centrais do argumento; a formulação evita tanto o literalismo pouco natural quanto a explicitação doutrinária excessiva.
