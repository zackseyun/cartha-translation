  text: Therefore[a], nothing is opposed by the fact that some appear to be ruled by passions because of weak reason.
translation:
  language: pt
  text: Portanto, o fato de alguns parecerem dominados pelas paixões devido à fraqueza da razão não contraria em nada essa conclusão.[a]
