base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/022.yaml
  text: And knowing that it is blessed to endure every pain for the sake of virtue[a], would he not prevail over the passions for the sake of godliness?
translation:
  language: pt
  text: E, sabendo que é uma bênção suportar todo sofrimento por causa da virtude, não dominaria ele as paixões por causa da piedade[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “devoção reverente”; o termo grego se refere à reverência e à devoção para com Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: sabendo
  rationale: Preserva de modo compacto o particípio de οἶδα, que apresenta a base da pergunta retórica.
- source_word: διὰ τὴν ἀρετήν
  choice: por causa da virtude
  rationale: ἀρετή designa aqui virtude ou excelência moral; a formulação conserva tanto o sentido ético quanto o paralelismo com διὰ τὴν εὐσέβειαν.
- source_word: πάντα πόνον
  choice: todo sofrimento
  rationale: πόνος pode indicar dor, labor ou provação. “Todo sofrimento” é natural em português e abrange o valor coletivo da expressão.
- source_word: ὑπομένειν
  choice: suportar
  rationale: Expressa permanecer firme sob dor ou provação sem acrescentar a ideia específica de simples resignação.
- source_word: μακάριόν ἐστιν
  choice: é uma bênção
  rationale: Comunica a avaliação positiva e elevada de μακάριον em português corrente, evitando a construção pouco natural “é bem-aventurado suportar”.
- source_word: περικρατήσειεν
  choice: não dominaria ele
  rationale: O verbo indica alcançar domínio ou prevalecer sobre algo; a formulação mantém a força da pergunta retórica grega.
- source_word: τῶν παθῶν
  choice: as paixões
  rationale: Em 4 Macabeus, πάθη é vocabulário ético-filosófico para afetos e impulsos que devem ser governados, não para sofrimentos externos.
- source_word: διὰ τὴν εὐσέβειαν
  choice: por causa da piedade
  rationale: εὐσέβεια denota reverência e devoção religiosa. “Piedade” preserva o termo tradicional e o paralelismo sintático, enquanto a nota evita que seja entendido apenas como compaixão.
theological_decisions:
- issue: Relação entre virtude, paixões e piedade
  choice: Manter “virtude”, “paixões” e “piedade” como vocabulário ético-religioso distinto.
  alternative: Verter os termos como “excelência”, “impulsos” e “devoção a Deus”.
  rationale: A redação preserva a integração, própria de 4 Macabeus, entre o quadro moral helenístico e a devoção religiosa judaica, sem reduzir as paixões a emoções em geral nem explicitar no corpo do texto mais do que o grego diz.
- issue: Força de μακάριόν ἐστιν
  choice: “é uma bênção”
  alternative: “é bem-aventurado” ou “é uma felicidade”
  rationale: “É uma bênção” mantém a avaliação elevada da perseverança sem impor uma construção artificial em português; o contexto admite uma conotação moral e religiosa sem exigir uma fórmula técnica de bem-aventurança.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se a estrutura de pergunta retórica e o paralelismo “por causa da virtude... por causa da piedade”. O marcador foi colocado junto de “piedade”, termo a que a nota efetivamente se refere.
