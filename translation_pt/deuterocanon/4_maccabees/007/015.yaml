  text: O blessed old age[a], and venerable gray hair, and a law-abiding life, which a faithful seal of death brought to completion.
translation:
  language: pt
  text: Ó velhice bem-aventurada, ó veneráveis cabelos brancos e ó vida em conformidade com a Lei, que o selo fidedigno da morte[a] levou à plenitude!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser entendido como: “que o selo verdadeiro ou confiável da morte aperfeiçoou”. O grego condensa a metáfora e pode apresentar a morte como a confirmação segura de tal vida.'
    reason: alternativa lexical e esclarecimento da metáfora
lexical_decisions:
- source_word: μακαρίου γήρως
  choice: velhice bem-aventurada
  rationale: Expressa a honra invejável e elevada atribuída à idade avançada, sem reduzir μακάριος a mera felicidade emocional.
- source_word: σεμνῆς πολιᾶς
  choice: veneráveis cabelos brancos
  rationale: Preserva a imagem da brancura dos cabelos como sinal de idade e a ideia de dignidade digna de reverência.
- source_word: βίου νομίμου
  choice: vida em conformidade com a Lei
  rationale: No contexto de 4 Macabeus, νόμιμος aponta para uma vida fiel à Lei judaica; a formulação é clara e evita o sentido meramente civil de 'vida dentro da lei'.
- source_word: πιστὴ ... σφραγὶς
  choice: selo fidedigno
  rationale: Mantém a metáfora compacta do grego e comunica que o selo é seguro, confiável ou autenticador.
- source_word: θανάτου
  choice: da morte
  rationale: Conserva o genitivo e a imagem grega de um 'selo da morte', sem convertê-lo silenciosamente em uma construção instrumental.
- source_word: ἐτελείωσεν
  choice: levou à plenitude
  rationale: Transmite conclusão, consumação ou aperfeiçoamento sem impor ao verbo um sentido teológico técnico.
theological_decisions:
- issue: Sentido de βίου νομίμου no contexto do martírio judaico
  choice: vida em conformidade com a Lei
  alternative: vida legítima; vida obediente à lei
  rationale: A referência provável é à fidelidade à Lei ancestral, tema central da obra. A inicial maiúscula torna essa referência contextual perceptível sem ampliar a frase para uma explicação.
- issue: Força de ἐτελείωσεν
  choice: levou à plenitude
  alternative: completou; aperfeiçoou
  rationale: A opção conserva a tensão entre completar uma vida e conduzi-la à perfeição por meio da morte, sem decidir em favor de uma leitura doutrinária específica.
- issue: Relação metafórica entre morte, selo e vida
  choice: o selo fidedigno da morte ... levou à plenitude
  alternative: a morte serviu de selo seguro e completou
  rationale: A tradução mantém a construção metafórica incomum do grego; a nota registra a possibilidade de entender a morte como confirmação segura da vida.
translation_notes:
  register: Português moderno, solene e acessível, com cadência exclamativa. A repetição de “ó” reproduz a força retórica da exclamação grega. “Cabelos brancos” é natural no português contemporâneo; “selo fidedigno” preserva deliberadamente a imagem incomum do original.
