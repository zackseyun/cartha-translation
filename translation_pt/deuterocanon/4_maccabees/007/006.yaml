base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/006.yaml
  text: O priest[a], worthy of the priesthood, you did not defile your sacred teeth, nor did you make your stomach—which had room for godliness and purity—a partner in defiling food.
translation:
  language: pt
  text: Ó sacerdote digno do sacerdócio, você não contaminou seus dentes sagrados, nem fez o estômago, que acolhera a devoção a Deus e a pureza, participar de uma alimentação contaminadora.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem associou à alimentação contaminadora o estômago que acolhera a devoção a Deus e a pureza”. O raro termo grego refere-se a comer de modo que produz contaminação ritual ou moral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ ἄξιε τῆς ἱερωσύνης ἱερεῦ
  choice: Ó sacerdote digno do sacerdócio
  rationale: Mantém o vocativo enfático e a repetição retórica entre “sacerdote” e “sacerdócio”.
- source_word: ἐμίανας
  choice: contaminou
  rationale: Expressa contaminação cultual e moral em português corrente, sem reduzir a frase a uma mancha meramente física.
- source_word: τοὺς ἱεροὺς ὀδόντας
  choice: seus dentes sagrados
  rationale: Preserva a imagem corporal concreta e surpreendente do grego, bem como seu registro cultual.
- source_word: θεοσέβειαν
  choice: devoção a Deus
  rationale: Torna explícita a orientação do termo para Deus e comunica reverência piedosa sem vocabulário técnico.
- source_word: καθαρισμόν
  choice: pureza
  rationale: No contexto, designa a condição de pureza ligada à fidelidade alimentar; “pureza” é natural e mantém a dimensão cultual e moral.
- source_word: χωρήσασαν γαστέρα
  choice: o estômago que acolhera
  rationale: “Acolhera” conserva a ideia de conter ou dar lugar a algo; “estômago” é claro no contexto alimentar.
- source_word: ἐκοινώνησας
  choice: profanou
  rationale: O verbo pode significar tornar comum e, no contexto de pureza ritual, profanar ou contaminar. “Profanou” preserva o contraste com o que é sagrado.
- source_word: μιεροφαγίᾳ
  choice: comendo alimentos impuros
  rationale: O composto raro associa o ato de comer à contaminação. A formulação comunica com clareza tanto a alimentação quanto seu caráter impuro.
theological_decisions:
- issue: Linguagem de pureza cultual aplicada aos dentes, ao estômago e à alimentação
  choice: Manter as imagens concretas de “dentes sagrados” e do estômago que acolheu devoção e pureza
  alternative: Generalizar a frase como simples recusa de alimentos impuros
  rationale: A retórica grega atribui deliberadamente santidade e pureza aos membros do corpo. Preservá-la mantém a força da fidelidade do sacerdote sem acrescentar uma explicação doutrinária.
- issue: Relação sintática de μιεροφαγίᾳ com ἐκοινώνησας
  choice: 'Entender o dativo como meio: “profanou, comendo alimentos impuros”'
  alternative: 'Entendê-lo em sentido associativo: “tornou o estômago participante de uma alimentação contaminadora”'
  rationale: O uso instrumental produz português natural e corresponde bem ao sentido de profanar o estômago por meio de uma ingestão impura, enquanto a nota preserva a alternativa associativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “você” para evitar a flexão arcaizante sem perder a solenidade do vocativo. A imagem corporal incomum do original foi preservada.
