  text: For[a], like a sheer cliff, father Eleazar, stretching out his own mind[b], broke around himself the surging waves of the passions that were raging.
translation:
  language: pt
  text: Pois o pai Eleazar, estendendo a própria mente como um promontório escarpado[a], quebrou ao redor de si as ondas revoltas das paixões[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um penhasco íngreme” ou “uma elevada rocha escarpada”. A imagem grega é a de uma formação rochosa abrupta que se projeta diante do mar.
    reason: lexical_alternative
  - marker: b
    text: Aqui, “paixões” se refere a impulsos ou apetites desordenados, tema central do argumento de 4 Macabeus sobre o domínio da mente racional.
    reason: cultural_note
lexical_decisions:
- source_word: πρόκρημνον ἄκραν
  choice: um promontório escarpado
  rationale: A expressão evoca uma elevação rochosa íngreme que avança sobre o mar e resiste às ondas. “Promontório escarpado” preserva tanto a forma saliente quanto o cenário marítimo da metáfora.
- source_word: διάνοιαν
  choice: mente
  rationale: Neste contexto, designa a faculdade racional ou a firme disposição de Eleazar. “Mente” mantém o contraste central do livro entre a razão humana e as paixões sem acrescentar uma formulação filosófica mais técnica do que o grego.
- source_word: ἐκτείνας
  choice: estendendo
  rationale: 'Conserva a ação concreta da metáfora: Eleazar estende a mente como uma formação rochosa diante das ondas.'
- source_word: περιέκλασεν
  choice: quebrou ao redor de si
  rationale: A formulação preserva a força espacial do prefixo περι- e apresenta as ondas quebrando ao redor de Eleazar, sem reduzir o verbo a uma paráfrase abstrata como “repeliu”.
- source_word: μαινομένους
  choice: revoltas
  rationale: O particípio caracteriza as ondas como violentas e descontroladas. “Revoltas” é natural no vocabulário marítimo e conserva a personificação das paixões.
- source_word: παθῶν
  choice: paixões
  rationale: No argumento moral e filosófico de 4 Macabeus, o termo se refere a impulsos e apetites que devem ser governados pela mente racional. “Paixões” preserva seu peso conceitual.
- source_word: κλύδωνας
  choice: ondas
  rationale: O substantivo indica ondas fortes e agitadas. O adjetivo “revoltas” comunica aqui sua violência e movimento em português natural.
theological_decisions:
- issue: 'Antropologia filosófica em 4 Macabeus: mente e paixões'
  choice: “mente” e “paixões”
  alternative: “razão” e “emoções”
  rationale: O versículo apresenta o contraste por meio de uma metáfora, não de uma definição doutrinária explícita. “Mente” e “paixões” preservam a tensão moral e psicológica sem equiparar indevidamente todas as emoções a impulsos desordenados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. A ordem da frase foi ajustada para tornar clara a comparação entre a mente de Eleazar e o promontório, mantendo a metáfora marítima e a força espacial do grego.
