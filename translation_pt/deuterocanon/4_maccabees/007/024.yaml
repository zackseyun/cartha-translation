lexical_decisions:
- source_word: διὰ τοῦτό γε τοι
  choice: Por isso mesmo
  rationale: Expressa a conclusão introduzida por διὰ τοῦτό e conserva de modo natural a ênfase combinada de γε τοι.
- source_word: καὶ μειρακίσκοι
  choice: até jovens
  rationale: Neste contexto, καί tem valor inclusivo e enfático ('até mesmo'), enquanto μειρακίσκοι designa rapazes ou homens jovens; 'jovens' é claro e natural em português.
- source_word: φιλοσοφοῦντες
  choice: filosofando
  rationale: Preserva o vocabulário filosófico explícito do autor e o valor circunstancial do particípio, sem reduzi-lo a uma conduta ética genérica.
- source_word: τῷ τῆς εὐσεβείας λογισμῷ
  choice: segundo o raciocínio da piedade
  rationale: Mantém λόγισμος como deliberação racional e εὐσέβεια como devoção reverente a Deus. 'Segundo' comunica que a atividade filosófica era orientada por esse raciocínio, sem eliminar a possível nuance instrumental do dativo.
- source_word: χαλεπωτέρων βασανιστηρίων
  choice: torturas mais severas
  rationale: Conserva a comparação de χαλεπωτέρων e entende βασανιστήρια, no contexto, como sofrimentos infligidos por tortura.
- source_word: ἐπεκράτησαν
  choice: prevaleceram sobre
  rationale: Reproduz a ideia de mostrar-se superior a algo ou dominá-lo, com uma construção portuguesa natural diante de 'torturas'.
theological_decisions:
- issue: Relação programática entre razão e piedade em 4 Macabeus
  choice: o raciocínio da piedade
  alternative: a razão piedosa; o raciocínio orientado pela devoção a Deus
  rationale: A formulação mantém unidos os dois elementos do grego — deliberação racional e reverência religiosa — sem decidir se o genitivo define origem, qualidade ou governo da razão.
- issue: Valor do dativo em τῷ ... λογισμῷ
  choice: segundo o raciocínio
  alternative: por meio do raciocínio; com o raciocínio
  rationale: A escolha apresenta o raciocínio piedoso como norma orientadora do filosofar, mas a nota registra a possível leitura instrumental, preservando a ambiguidade sintática.
