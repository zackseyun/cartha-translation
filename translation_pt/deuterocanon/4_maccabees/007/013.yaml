  text: And yet[a], most astonishingly, though he was an old man, with the pains of his body already loosened, and his flesh relaxed, and even his sinews worn out, he renewed his youth.
translation:
  language: pt
  text: 'E, no entanto, o mais extraordinário: embora fosse idoso, com os esforços do corpo já enfraquecidos, a carne flácida e até os tendões exaustos, ele rejuvenesceu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “recobrou o vigor da juventude”. O verbo grego indica tornar-se jovem novamente ou renovar o vigor juvenil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καίτοι τὸ θαυμασιώτατον
  choice: E, o que é mais extraordinário
  rationale: Expressa de modo natural a transição concessiva e o superlativo retórico, sem reduzir a frase a um simples advérbio.
- source_word: γέρων ὤν
  choice: embora fosse idoso
  rationale: O particípio tem valor concessivo no contexto; “idoso” é atual, respeitoso e idiomático.
- source_word: λελυμένων ἤδη τῶν τοῦ σώματος πόνων
  choice: com as forças do corpo já debilitadas
  rationale: Neste retrato da velhice, πόνοι aponta para a capacidade corporal de esforço, enquanto λελυμένων descreve sua perda ou afrouxamento. A formulação evita o pouco coerente “dores afrouxadas”, preservando em nota a amplitude do grego.
- source_word: περικεχαλασμένων δὲ τῶν σαρκῶν
  choice: a carne flácida
  rationale: Mantém o sentido corporal de σάρξ e traduz o estado de afrouxamento indicado por χαλάω em português natural.
- source_word: κεκμηκότων δὲ καὶ τῶν νεύρων
  choice: e até os tendões exaustos
  rationale: νεῦρα, em descrição anatômica antiga, refere-se a tendões ou nervos físicos, não ao sentido psicológico moderno de “nervos”; “até” preserva a ênfase de καί.
- source_word: ἀνενέασεν
  choice: ele rejuvenesceu
  rationale: O verbo significa tornar-se jovem de novo ou recuperar vigor juvenil; “rejuvenesceu” é conciso, elevado e natural.
theological_decisions:
- issue: Sentido de σάρξ em contexto de velhice e tortura física
  choice: carne
  alternative: corpo; músculos
  rationale: O termo é estritamente físico aqui, sem conotação paulina ou moral. “Carne” conserva a imagem concreta do original.
- issue: Natureza do rejuvenescimento expresso por ἀνενέασεν
  choice: rejuvenesceu
  alternative: recobrou o vigor da juventude
  rationale: A tradução mantém a afirmação retórica sem decidir se o rejuvenescimento deve ser entendido como transformação física literal ou renovação de vigor e coragem.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com fluidez brasileira. A enumeração mantém a progressão retórica do enfraquecimento corporal até o rejuvenescimento final.
