lexical_decisions:
- source_word: κατακλυζόμενος
  choice: inundado
  rationale: Preserva de modo natural a imagem de um dilúvio ou inundação e abre a metáfora aquática sustentada em toda a oração.
- source_word: ἀπειλαῖς
  choice: ameaças
  rationale: É o sentido comum e claro do termo no contexto da coerção exercida pelo tirano.
- source_word: καταντλούμενος
  choice: açoitado
  rationale: No contexto das ondas tempestuosas, comunica o impacto repetido e violento da água sem recorrer a uma tradução mecanicamente literal e obscura ligada a tirar ou lançar água.
- source_word: βασάνων
  choice: tormentos
  rationale: Expressa sofrimento severo infligido no contexto do martírio, sem restringir indevidamente o termo a uma técnica específica de tortura.
- source_word: τρικυμίαις
  choice: ondas tempestuosas
  rationale: Torna explícita e inteligível a imagem de mar revolto presente no substantivo grego, mantendo o tom elevado.
- source_word: τοῦ τυράννου
  choice: do tirano
  rationale: Reproduz diretamente o genitivo e conserva a caracterização moral importante no contexto.
