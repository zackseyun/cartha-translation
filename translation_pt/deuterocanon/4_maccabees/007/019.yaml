  text: those who believe that they do not die to God[a], but live to God, just as our patriarchs Abraham, Isaac, and Jacob.
translation:
  language: pt
  text: os que creem que não morrem diante de Deus[a], mas vivem diante de Deus, assim como nossos patriarcas Abraão, Isaque e Jacó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “aos olhos de Deus” ou “em relação a Deus”; o dativo grego pode indicar relação, e não simples direção.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πιστεύοντες
  choice: os que creem
  rationale: O particípio presente substantivado designa pessoas caracterizadas pela fé; a formulação é natural e preserva seu valor verbal.
- source_word: θεῷ ... τῷ θεῷ
  choice: para Deus ... para Deus
  rationale: O dativo expressa relação ou referência. A repetição preserva a simetria entre não morrer e viver sem transformar a expressão em uma paráfrase interpretativa.
- source_word: οὐκ ἀποθνήσκουσιν
  choice: não morrem
  rationale: Reproduz diretamente o presente do verbo ἀποθνῄσκω e mantém o contraste com ζῶσιν.
- source_word: ὥσπερ γὰρ
  choice: assim como
  rationale: Introduz a comparação com os patriarcas. A força explicativa de γάρ fica subordinada à comparação na construção grega irregular; explicitá-la como «pois» em português tornaria a frase truncada.
- source_word: οἱ πατριάρχαι ἡμῶν
  choice: nossos patriarcas
  rationale: Mantém a designação histórica específica dos antepassados Abraão, Isaque e Jacó.
- source_word: ἀλλὰ ζῶσιν
  choice: mas vivem
  rationale: Preserva de modo conciso a antítese marcada por ἀλλά.
theological_decisions:
- issue: Sentido do dativo θεῷ / τῷ θεῷ na afirmação sobre morte e vida
  choice: para Deus
  alternative: diante de Deus; aos olhos de Deus; em relação a Deus
  rationale: A formulação compacta conserva a ambiguidade relacional do dativo e a tensão teológica da afirmação, sem decidir se ela trata principalmente da perspectiva de Deus ou da relação dos fiéis com ele.
- issue: Relação dos patriarcas com a antítese entre morrer e viver
  choice: A comparação foi colocada ao fim, aplicando-se à afirmação «não morrem para Deus, mas vivem para Deus».
  alternative: Manter a ordem grega, com a comparação inserida antes de «mas vivem para Deus».
  rationale: A ordem portuguesa evita uma frase truncada e torna explícita a relação comparativa já presente no grego, sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. «Para Deus» é deliberadamente compacto e ligeiramente formal para conservar a ambiguidade do dativo grego; a nota oferece equivalentes relacionais mais explícitos.
