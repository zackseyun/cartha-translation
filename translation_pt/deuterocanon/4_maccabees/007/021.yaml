lexical_decisions:
- source_word: ἐπεὶ
  choice: Pois
  rationale: Introduz a explicação ou razão ligada ao contexto anterior, preservando a conexão argumentativa.
- source_word: τίς
  choice: quem
  rationale: Pronome interrogativo que inicia uma pergunta retórica; “quem” é a forma natural em português.
- source_word: πρὸς ὅλον τὸν τῆς φιλοσοφίας κανόνα
  choice: segundo a norma integral da filosofia
  rationale: πρός com κανών expressa conformidade com um padrão; “norma integral” conserva tanto o caráter normativo de κανών quanto a abrangência de ὅλον.
- source_word: εὐσεβῶς φιλοσοφῶν
  choice: praticando piedosamente a filosofia
  rationale: Expressa a filosofia como modo de vida e conserva o caráter religioso de εὐσεβῶς, sem reduzi-la à reflexão abstrata.
- source_word: πεπιστευκὼς θεῷ
  choice: tendo depositado sua confiança em Deus
  rationale: O particípio perfeito indica confiança estabelecida, e o dativo θεῷ identifica aquele em quem essa confiança foi depositada.
theological_decisions:
- issue: Sentido de πιστεύω no contexto filosófico e martirológico
  choice: tendo depositado sua confiança em Deus
  alternative: tendo crido em Deus
  rationale: O contexto favorece confiança ou dependência de Deus, não apenas assentimento intelectual; a formulação evita acrescentar conteúdo doutrinário não expresso.
