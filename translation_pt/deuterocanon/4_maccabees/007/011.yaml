  yaml_path: translation/deuterocanon/4_maccabees/007/011.yaml
  text: For just as the father Aaron[a], armed with the censer, running through the midst of the multitude, overcame the fire-bearing angel,
translation:
  language: pt
  text: Pois assim como o pai Arão, armado com o incensário, correndo por entre a multidão do povo, venceu o anjo portador do fogo[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o anjo do fogo” ou “o anjo destruidor”. A expressão provavelmente alude à intervenção de Arão durante a praga em Números 16.
    reason: Registra alternativas lexicais e esclarece a provável alusão sem resolver no texto principal a identidade do anjo.
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: Pois, assim como
  rationale: Conserva tanto o valor explicativo de γάρ como a comparação introduzida por ὥσπερ, em português natural.
- source_word: ὁ πατὴρ Ἀαρὼν
  choice: o pai Aarão
  rationale: Preserva o artigo e o uso honorífico e ancestral de πατήρ sem tornar a expressão excessivamente técnica.
- source_word: τῷ θυμιατηρίῳ καθωπλισμένος
  choice: armado com o incensário
  rationale: O dativo é instrumental, e καθωπλισμένος traz uma imagem marcial vívida; “incensário” mantém a referência cultual.
- source_word: διὰ τοῦ ἔθνοπλήθους ἐπιτρέχων
  choice: correndo por entre a multidão do povo
  rationale: Mantém a ação participial e comunica tanto o movimento urgente como a ideia de uma grande concentração do povo.
- source_word: τὸν ἐμπυριστὴν ἄγγελον
  choice: o anjo portador do fogo
  rationale: Reproduz a associação explícita do anjo com o fogo sem identificá-lo interpretativamente, no texto principal, como o anjo destruidor.
- source_word: ἐνίκησεν
  choice: venceu
  rationale: Preserva de modo direto e digno a linguagem de vitória de νικάω.
theological_decisions:
- issue: Identidade e função do anjo na alusão à intervenção de Aarão durante a praga
  choice: o anjo portador do fogo
  alternative: o anjo do fogo; o anjo destruidor
  rationale: O grego associa o anjo ao fogo, mas não o denomina expressamente “destruidor”. A tradução principal conserva essa formulação e deixa a identificação alusiva para a nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A vírgula final foi mantida porque o versículo introduz uma comparação cuja continuação sintática vem no contexto seguinte.
