  text: For only the wise and self-controlled man is courageous[a], master of the passions.
translation:
  language: pt
  text: Pois somente aquele que é sábio e senhor de si[a] é corajoso, senhor das paixões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega aqui o masculino singular de modo genérico; também se pode traduzir por “a pessoa que é sábia e tem domínio próprio”.
    reason: Esclarece a forma gramatical e o alcance genérico da expressão sem restringir a máxima aos homens.
lexical_decisions:
- source_word: μόνος
  choice: somente
  rationale: 'Expressa a exclusividade enfática da máxima: apenas a pessoa assim caracterizada é verdadeiramente corajosa.'
- source_word: σοφὸς
  choice: sábio
  rationale: No contexto ético-filosófico, designa sabedoria intelectual e moral.
- source_word: σώφρων
  choice: senhor de si
  rationale: Expressão portuguesa natural que comunica autocontrole e moderação disciplinada, em consonância com o domínio das paixões mencionado no fim do versículo.
- source_word: ἀνδρεῖός
  choice: corajoso
  rationale: Transmite coragem ou fortaleza sem introduzir a conotação de virilidade que uma tradução etimologizante poderia sugerir.
- source_word: τῶν παθῶν
  choice: das paixões
  rationale: Neste contexto, πάθη são paixões ou impulsos que devem ser governados pela razão, não apenas emoções neutras ou sofrimentos externos.
- source_word: κύριος
  choice: senhor
  rationale: Aqui indica domínio e autoridade sobre as paixões, não um título divino; a construção nominal preserva a forma compacta do grego.
- source_word: ὁ σοφὸς καὶ σώφρων
  choice: aquele que é sábio e senhor de si
  rationale: Representa naturalmente em português os adjetivos substantivados masculinos, sem acrescentar ao texto grego o substantivo explícito “homem”.
theological_decisions:
- issue: Masculino singular genérico na máxima ética
  choice: aquele que é sábio e senhor de si
  alternative: a pessoa sábia e autocontrolada; o homem sábio e senhor de si
  rationale: O grego emprega formas masculinas singulares substantivadas de alcance genérico. “Aquele” conserva essa forma gramatical, enquanto a nota esclarece seu uso, sem restringir a afirmação aos homens nem apagar a forma do original.
- issue: Sentido não divino de κύριος
  choice: senhor das paixões
  alternative: mestre das paixões; aquele que domina as paixões
  rationale: O contexto é antropológico e ético. “Senhor” indica domínio, preserva a força nominal de κύριος e não funciona aqui como título divino.
- issue: Relação entre os predicados ἀνδρεῖος e κύριος
  choice: é corajoso, senhor das paixões
  alternative: é corajoso e senhor das paixões
  rationale: A justaposição com vírgula preserva a formulação compacta e a possível força explicativa do segundo predicado, sem impor uma coordenação mais explícita do que a encontrada no grego.
translation_notes:
  register: Português atual, digno e amplamente compreensível. “Senhor de si” evita o tom técnico de “autocontrolado” e cria uma correspondência retórica natural com “senhor das paixões”.
