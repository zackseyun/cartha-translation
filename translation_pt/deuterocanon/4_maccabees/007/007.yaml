  yaml_path: translation/deuterocanon/4_maccabees/007/007.yaml
  text: O you who are in harmony with the law and a philosopher of the divine way of life[a][b].
translation:
  language: pt
  text: Ó tu, que estás em harmonia com a lei[a] e és filósofo do modo de vida divino[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «em acordo com a lei» ou «em consonância com a lei». O termo grego evoca concordância ou harmonia.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: «filósofo da vida divina» ou «filósofo do modo piedoso de viver». A expressão também pode indicar uma vida caracterizada pela devoção a Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ
  choice: Ó
  rationale: Partícula de vocativo que introduz uma interpelação direta; «Ó» conserva o tom elevado e retórico do grego.
- source_word: σύμφωνε
  choice: que estás em harmonia com
  rationale: O adjetivo vocativo σύμφωνος expressa concordância ou consonância. A formulação preserva a metáfora de harmonia e soa natural em português.
- source_word: νόμου
  choice: a lei
  rationale: Genitivo ligado a σύμφωνε. Neste contexto judaico, refere-se naturalmente à lei ancestral ou divina; o artigo torna a expressão idiomática sem acrescentar uma designação que o grego não explicita.
- source_word: καὶ
  choice: e
  rationale: Conjunção coordenativa simples que une as duas descrições dirigidas à mesma pessoa.
- source_word: φιλόσοφε
  choice: és filósofo
  rationale: Vocativo empregado na interpelação. «Filósofo» mantém de forma direta o vocabulário filosófico característico de 4 Macabeus; a cópula é suprida para fluência em português.
- source_word: θείου
  choice: divino
  rationale: Adjetivo genitivo que qualifica βίου. «Divino» conserva a expressão elevada e evita explicitar além do texto se se trata de algo pertencente a Deus ou caracterizado pela devoção a Deus.
- source_word: βίου
  choice: modo de viver
  rationale: βίος pode designar não apenas a vida, mas a conduta ou maneira de viver. «Modo de viver» comunica esse sentido de forma mais clara e natural do que a expressão potencialmente ambígua «vida divina».
theological_decisions:
- issue: Como traduzir θείου βίου
  choice: do modo divino de viver
  alternative: da vida divina; do modo piedoso de viver; de uma vida dedicada a Deus
  rationale: A opção conserva a concisão e o tom elevado da expressão grega, ao mesmo tempo que comunica o sentido de βίος como maneira de viver. Não resolve indevidamente se θεῖος significa estritamente «divino» ou, por extensão, «piedoso» e orientado para Deus.
- issue: Se νόμου deve receber maiúscula como título
  choice: a lei
  alternative: a Lei
  rationale: O contexto provavelmente aponta para a lei judaica, mas o grego não possui aqui um sinal que exija tratá-la como título. A minúscula evita importar uma convenção editorial posterior.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A abertura vocativa e a exclamação preservam a força retórica do original; «modo divino de viver» evita a rigidez de «modo de vida divino» sem apagar a ambiguidade de θείου βίου.
