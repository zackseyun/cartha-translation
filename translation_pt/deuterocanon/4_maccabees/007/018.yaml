  source_fidelity: A tradução preserva corretamente a adversativa, o alcance inclusivo de ὅσοι, a dedicação integral, a exclusividade enfática de οὗτοι μόνοι e o domínio sobre as paixões ligadas à carne. Contudo, «zelam pela» tende a significar proteger, defender ou promover algo, e não expressa de modo direto o empenho devoto indicado por προνοοῦσιν neste contexto.
  naturalness: O português é claro e de registro adequado. A revisão substitui uma colocação levemente deslocada por uma formulação mais idiomática, sem perder a concisão nem a ênfase.
  terminology: «Devoção a Deus» comunica apropriadamente εὐσέβεια no contexto de 4 Macabeus, sem a ambiguidade contemporânea de «piedade» como compaixão. «Paixões da carne» mantém σάρξ e πάθη sem introduzir uma leitura doutrinária adicional.
