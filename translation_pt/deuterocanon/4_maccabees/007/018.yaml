  yaml_path: translation/deuterocanon/4_maccabees/007/018.yaml
  text: But all who care for godliness with their whole heart[b][a], these alone are able to master the passions of the flesh.
translation:
  language: pt
  text: Mas todos os que se dedicam de todo o coração à devoção a Deus, somente esses são capazes de dominar as paixões da carne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «os impulsos da carne».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ
  choice: Mas
  rationale: Preserva a força adversativa que contrapõe esta afirmação ao argumento anterior.
- source_word: ὅσοι
  choice: todos os que
  rationale: Expressa de modo natural a referência inclusiva a toda uma classe de pessoas.
- source_word: τῆς εὐσεβείας
  choice: pela devoção a Deus
  rationale: Neste livro, εὐσέβεια designa reverência e fidelidade devota a Deus e à sua lei. A formulação evita o sentido corrente de compaixão que «piedade» pode ter em português.
- source_word: προνοοῦσιν
  choice: zelam
  rationale: Comunica preocupação ativa, cuidado intencional e compromisso contínuo com a devoção.
- source_word: ἐξ ὅλης καρδίας
  choice: de todo o coração
  rationale: É uma expressão portuguesa natural que conserva a ideia de dedicação integral.
- source_word: οὗτοι μόνοι
  choice: somente esses
  rationale: Mantém a retomada demonstrativa e a forte exclusividade do grego.
- source_word: δύνανται κρατεῖν
  choice: são capazes de dominar
  rationale: Preserva tanto a ideia de capacidade quanto o sentido forte de exercer domínio ou controle.
- source_word: τῶν τῆς σαρκὸς παθῶν
  choice: as paixões da carne
  rationale: No contexto ético-filosófico, πάθη são paixões ou impulsos, não sofrimentos; «carne» conserva o termo antropológico sem introduzir a interpretação doutrinária de «natureza pecaminosa».
theological_decisions:
- issue: Sentido de σάρξ no contexto ético-antropológico
  choice: carne
  alternative: corpo; natureza pecaminosa
  rationale: O texto relaciona as paixões à dimensão carnal ou corpórea, mas não identifica explicitamente a carne com uma «natureza pecaminosa». A tradução literal preserva a tensão e evita sobreinterpretação.
- issue: Sentido religioso de εὐσέβεια
  choice: devoção a Deus
  alternative: piedade; reverência
  rationale: A expressão torna explícita a orientação divina já inerente ao termo neste contexto, sem reduzi-lo a mera respeitabilidade moral nem confundi-lo com compaixão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, enquanto o travessão conserva a ênfase de οὗτοι μόνοι. «Devoção a Deus» evita a ambiguidade moderna de «piedade», e «paixões da carne» mantém a linguagem antropológica do original.
