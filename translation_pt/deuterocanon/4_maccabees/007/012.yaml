  text: Thus Eleazar[a], the descendant of Aaron, though being burned through the fire[b], did not change his resolve.
translation:
  language: pt
  text: Assim, Eleazar, descendente de Arão[a], embora fosse consumido pelo fogo, não mudou sua determinação[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, «o aarônida», isto é, alguém pertencente à linhagem de Arão.
    reason: lexical_alternative
  - marker: b
    text: Ou «seu raciocínio» ou «seu propósito racional». O termo grego pode indicar uma determinação orientada pela razão, tema importante em 4 Macabeus.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Assim
  rationale: Retoma o relato anterior e introduz sua conclusão de modo conciso e natural.
- source_word: ὁ Ἀαρωνίδης
  choice: descendente de Arão
  rationale: Expressa claramente a pertença à linhagem de Arão sem recorrer ao pouco conhecido termo técnico «aarônida».
- source_word: Ἐλεάζαρος
  choice: Eleazar
  rationale: Forma tradicional e reconhecível do nome em português.
- source_word: διὰ τοῦ πυρὸς ὑπερτηκόμενος
  choice: embora fosse consumido pelo fogo
  rationale: O particípio evoca alguém que se derrete ou se consome sob calor intenso; a formulação comunica tanto o suplício em curso quanto o valor concessivo exigido pelo contraste.
- source_word: οὐ μετετράπη
  choice: não mudou
  rationale: Indica que Eleazar não alterou nem abandonou sua disposição interior sob tortura.
- source_word: τὸν λογισμόν
  choice: sua resolução
  rationale: No contexto imediato, λογισμός designa a determinação racional mantida por Eleazar. «Resolução» preserva a firmeza moral e permite registrar em nota a dimensão filosófica de «razão».
theological_decisions:
- issue: O sentido de λογισμός no argumento de 4 Macabeus sobre o domínio racional das paixões
  choice: sua resolução
  alternative: seu raciocínio; seu propósito racional
  rationale: A tradução principal comunica com naturalidade a determinação firme de Eleazar, sem apagar em nota o peso filosófico do termo nem transformar a frase numa afirmação doutrinária mais específica.
translation_notes:
  register: Português moderno, claro e digno, com construção concessiva natural. Conserva-se a imagem forte de ser consumido pelo fogo e registra-se em nota a ambiguidade filosófica de λογισμός.
