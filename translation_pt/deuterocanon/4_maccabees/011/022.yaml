  text: I too[a], armed with noble virtue, will be laid to rest with my brothers[b],
translation:
  language: pt
  text: Também eu, armado de nobre virtude[a], serei colocado com meus irmãos[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de nobreza e bondade” ou “de excelência moral”; o termo grego indica nobreza de caráter moral.
