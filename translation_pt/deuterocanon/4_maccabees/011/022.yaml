lexical_decisions:
- source_word: καλοκαγαθίᾳ
  choice: de nobre virtude
  rationale: O dativo indica a qualidade ou o meio com que o falante está armado. A expressão comunica excelência de caráter, com conotações éticas e nobres, e não apenas distinção social.
- source_word: καθωπλισμένος
  choice: armado
  rationale: Preserva de modo conciso a metáfora marcial do particípio de καθοπλίζω, que significa armar ou equipar plenamente.
- source_word: τεθήσομαι
  choice: serei posto
  rationale: Mantém a voz passiva do futuro de τίθημι e evita tornar explícita demais a ideia de sepultamento, embora o contexto de martírio indique a união aos irmãos na morte.
- source_word: κἀγώ
  choice: Também eu
  rationale: Expressa com naturalidade a inclusão enfática do falante no destino de seus irmãos.
- source_word: μετὰ τῶν ἀδελφῶν μου
  choice: junto de meus irmãos
  rationale: Representa o acompanhamento indicado por μετά com genitivo e conserva a referência masculina aos irmãos do contexto.
theological_decisions:
- issue: Sentido do passivo τεθήσομαι no contexto de martírio
  choice: serei posto junto de meus irmãos
  alternative: serei sepultado junto de meus irmãos; serei posto para repousar junto de meus irmãos
  rationale: O contexto aponta para a morte e possivelmente o sepultamento, mas o verbo grego é mais geral. A tradução principal preserva essa amplitude, enquanto a nota registra a provável nuance funerária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve elevação adequada ao discurso de martírio. A ordem “Também eu” preserva a ênfase, e “serei posto” conserva a ambiguidade do passivo grego.
