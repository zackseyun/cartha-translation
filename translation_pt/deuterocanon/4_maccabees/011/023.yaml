  yaml_path: translation/deuterocanon/4_maccabees/011/023.yaml
  text: By bringing against yourself a great avenger as well[a], you innovator of tortures and enemy of those who are truly reverent.
translation:
  language: pt
  text: trazendo também contra ti um grande vingador[a], ó inventor de torturas e inimigo dos que são verdadeiramente piedosos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um grande espírito vingador”; o termo grego ἀλάστωρ pode indicar tanto um vingador pessoal como uma força de retribuição.
    reason: alternativa lexical
lexical_decisions:
- source_word: μέγαν
  choice: grande
  rationale: Mantém de modo direto a intensificação de ἀλάστορα.
- source_word: σοι
  choice: contra ti
  rationale: 'Com προσβαλλών, o dativo tem aqui sentido desfavorável: o tirano faz recair sobre si uma consequência hostil.'
- source_word: προσβαλλὼν
  choice: atraindo
  rationale: Expressa naturalmente em português o ato de fazer vir contra si algo hostil, sem reduzir o particípio a uma formulação puramente abstrata.
- source_word: καὶ αὐτὸς
  choice: também
  rationale: Conserva o valor aditivo da expressão grega de maneira concisa.
- source_word: ἀλάστορα
  choice: vingador
  rationale: O termo pode designar um vingador pessoal ou uma potência vingadora; a opção principal é clara e concisa, e a amplitude semântica é registrada em nota.
- source_word: καινοτόμε τῶν βασάνων
  choice: ó inventor de torturas
  rationale: Traduz a acusação de criar formas novas de suplício em linguagem portuguesa natural e contundente.
- source_word: πολέμιε
  choice: inimigo
  rationale: Preserva a interpelação direta e hostil do vocativo grego.
- source_word: τῶν ἀληθῶς εὐσεβούντων
  choice: dos que são verdadeiramente piedosos
  rationale: Comunica a devoção religiosa genuína expressa por εὐσεβέω, sem introduzir uma especificação ausente do texto.
theological_decisions:
- issue: Sentido religioso de εὐσεβούντων
  choice: dos que são verdadeiramente piedosos
  alternative: dos que verdadeiramente reverenciam a Deus
  rationale: “Piedosos” mantém o sentido religioso e a ausência de objeto explícito no grego; a alternativa explicita Deus e, por isso, interpreta mais do que o texto formalmente declara.
- issue: Natureza de ἀλάστωρ
  choice: vingador
  alternative: espírito vingador
  rationale: O grego admite tanto um agente vingador quanto uma força ou entidade de retribuição. O texto principal mantém a formulação pessoal mais simples, enquanto a nota preserva a alternativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com vocativos enfáticos. O trecho conserva a forma participial e aparentemente incompleta do grego, por depender do contexto anterior.
