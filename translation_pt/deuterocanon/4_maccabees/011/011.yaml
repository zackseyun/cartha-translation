lexical_decisions:
- source_word: κατὰ τοῦτον τὸν τρόπον καὶ
  choice: Desse mesmo modo
  rationale: Expressa de forma natural a ideia de modo e a força conectiva de καί no contexto, sem a rigidez de «segundo esta maneira também».
- source_word: πνεῦμα
  choice: espírito
  rationale: Preserva a referência à dimensão interior ou vital da pessoa e mantém sua distinção em relação a σῶμα, sem restringir o termo a «mente» ou «respiração».
- source_word: στενοχωρούμενος
  choice: sendo comprimido
  rationale: Mantém a imagem concreta de pressão ou estreitamento e permite que o sentido de aflição permaneça implícito.
- source_word: σῶμα
  choice: corpo
  rationale: Equivalente direto e natural para a referência corporal.
- source_word: ἀγχόμενος
  choice: sendo sufocado
  rationale: Comunica a constrição física e a falta de ar como processo em curso, sem necessariamente especificar o mecanismo como estrangulamento.
theological_decisions:
- issue: Distinção antropológica entre πνεῦμα e σῶμα
  choice: Manter o par como «espírito» e «corpo»
  alternative: Traduzir πνεῦμα como «respiração» ou «mente»
  rationale: O grego justapõe dimensões interior e corporal do sofrimento. A tradução conserva essa tensão sem impor uma antropologia doutrinária mais desenvolvida.
