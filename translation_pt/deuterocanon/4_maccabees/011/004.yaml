  text: O hateful and misanthropic man[b][a], what have we done that you are ravaging us in this way?
translation:
  language: pt
  text: Ó homem detestável e inimigo da humanidade, o que fizemos para que nos devastes dessa maneira?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Devastar” também pode ser traduzido como “destruir” ou “arruinar”; o verbo grego costuma descrever uma devastação violenta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ
  choice: Ó
  rationale: Mantém a exclamação vocativa e o tom direto e confrontador do grego.
- source_word: μισάρετε
  choice: homem detestável
  rationale: Expressa a forte censura do adjetivo sem lhe atribuir um objeto específico de ódio que não esteja explícito na forma grega.
- source_word: μισάνθρωπε
  choice: inimigo da humanidade
  rationale: Comunica de modo natural e digno a ideia daquele que odeia os seres humanos, preservando o paralelismo insultuoso do vocativo.
- source_word: τί δράσαντες
  choice: o que fizemos
  rationale: É a formulação portuguesa idiomática para a construção participial que pergunta qual ato poderia justificar esse tratamento.
- source_word: πορθεῖς
  choice: nos devastes
  rationale: Preserva a imagem forte de devastação violenta do verbo, aqui aplicada ao tratamento brutal infligido às vítimas.
- source_word: τοῦτον ... τὸν τρόπον
  choice: dessa maneira
  rationale: Reproduz naturalmente a expressão adverbial grega e sua referência à forma de violência que está sendo praticada.
