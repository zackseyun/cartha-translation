base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/025.yaml
  text: For your not being able to persuade our reason[a], nor to compel us to eat defiled food—is that not your defeat?
translation:
  language: pt
  text: Pois o fato de não conseguires persuadir a nossa razão[a], nem obrigar-nos a comer carne[b], não é a tua derrota?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o nosso juízo racional».'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «comer carne». Neste contexto, refere-se a carne proibida pela Lei judaica.
    reason: contextual_clarification
lexical_decisions:
- source_word: μὴ δυνηθῆναί σε
  choice: não teres conseguido
  rationale: Expressa naturalmente em português a incapacidade constatada pelo infinitivo substantivado, preservando a ênfase no fracasso do interlocutor.
- source_word: μεταπεῖσαι
  choice: pela persuasão, mudar
  rationale: O verbo envolve persuadir alguém ou algo a mudar. A formulação evita o pouco natural «persuadir a nossa razão» sem perder o componente explícito de persuasão.
- source_word: τὸν λογισμὸν ἡμῶν
  choice: a nossa razão
  rationale: Mantém o vocabulário conceitual central de 4 Macabeus, no qual a razão ou o juízo racional se contrapõe às paixões.
- source_word: βιάσασθαι
  choice: nos forçar
  rationale: Comunica de modo direto o uso de coerção contra os falantes e explicita o objeto implícito exigido pelo português.
- source_word: πρὸς τὴν μεμοφαγίαν
  choice: a comer carne
  rationale: Reproduz o sentido lexical de consumo de carne, deixando para a nota a informação contextual de que se trata de carne proibida pela Lei.
- source_word: οὐ κατάλυσίς ἐστιν σου;
  choice: não é isso a tua derrota?
  rationale: Conserva a pergunta retórica e comunica com clareza o sentido de ruína, derrocada ou derrota do perseguidor.
theological_decisions:
- issue: O valor filosófico de λογισμός
  choice: a nossa razão
  alternative: o nosso juízo racional
  rationale: «Razão» preserva o termo temático do livro sem reduzir seu sentido a mera opinião ou resolução, enquanto a nota registra uma alternativa contextual.
- issue: O grau de explicitação de μεμοφαγία
  choice: comer carne
  alternative: comer carne proibida
  rationale: O texto principal permanece próximo do valor lexical do substantivo grego; a condição religiosa dessa carne, evidente no episódio, é esclarecida em nota sem ser inserida silenciosamente no texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de segunda pessoa do singular coerentes («teres», «tua»). A construção «pela persuasão, mudar» conserva a distinção retórica entre tentar convencer e tentar forçar.
