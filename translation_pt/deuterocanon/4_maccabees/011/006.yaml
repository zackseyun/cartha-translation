lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Conjunção adversativa que marca contraste com a afirmação anterior; “Mas” é conciso e natural.
- source_word: ταῦτα
  choice: essas coisas
  rationale: Mantém o demonstrativo neutro plural e deixa seu referente tão amplo quanto no grego.
- source_word: ὑμῶν
  choice: vindas de vocês
  rationale: Expressa de modo idiomático o provável valor de origem ou relação do genitivo no contexto, sem ocultar a formulação mais literal registrada na nota.
- source_word: βασάνων
  choice: torturas
  rationale: Neste contexto de martírio, o termo designa suplícios físicos; o plural corresponde ao genitivo plural grego.
- source_word: ἄξια
  choice: dignas de
  rationale: Reproduz a construção de ἄξιος com genitivo, preservando a linguagem de mérito ou correspondência presente no original.
