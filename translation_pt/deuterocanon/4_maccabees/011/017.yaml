  text: After he said these things[a], they led him to the wheel.
translation:
  language: pt
  text: Depois que ele disse essas coisas, levaram-no até a roda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a roda de tortura usada no relato do martírio.
    reason: Nota cultural que esclarece a função do objeto sem inserir essa explicação no texto principal.
lexical_decisions:
- source_word: ταῦτα
  choice: essas coisas
  rationale: O demonstrativo neutro plural retoma as palavras anteriores; “essas coisas” preserva o plural e soa natural em português.
- source_word: εἰπόντα
  choice: depois que ele disse
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal; a oração temporal expressa essa relação com clareza e naturalidade.
- source_word: παρῆγον
  choice: levaram-no
  rationale: O imperfeito de παράγω descreve a condução dele ao instrumento; “levaram-no” mantém o agente indefinido expresso pela terceira pessoa do plural.
- source_word: ἐπὶ
  choice: até
  rationale: Com movimento em direção a um objeto, ἐπί pode indicar aproximação ou destino. “Até” evita afirmar que ele já foi colocado sobre o instrumento.
- source_word: τὸν τροχόν
  choice: a roda
  rationale: τροχός significa literalmente “roda”. A tradução conserva o termo simples do grego, enquanto a nota esclarece sua função no contexto.
