  naturalness: O português é geralmente claro e adequado, mas ““Muito bem”, dizia ele. “Mesmo contra a vontade...”” soa como duas enunciações desconexas. Uma única fala, com o tirano explicitamente como sujeito, reproduz melhor a sintaxe e flui com mais naturalidade. “Em favor da nossa lei” é compreensível, mas “por nossa lei” é mais idiomático no contexto de perseverança sob sofrimento.
  terminology: “Tirano”, “favores”, “sofrimentos”, “perseverança” e “lei” são escolhas adequadas. A nota deve evitar especificar “torturas” onde o versículo fala de modo mais amplo em sofrimentos/provações, embora o contexto seja persecutório.
