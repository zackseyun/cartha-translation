base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/012.yaml
  text: “Good,” said the tyrant[a], though unwillingly, “he grants us favors—good indeed—by giving us the opportunity, through nobler sufferings[b], to display our endurance for our law.”
translation:
  language: pt
  text: “Muito bem”, dizia ele, “o tirano, mesmo contra a vontade, nos concede favores — e faz muito bem — ao nos dar a oportunidade de demonstrar, por meio de sofrimentos mais nobres, nossa perseverança por nossa lei.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão “nos concede favores” é irônica: os sofrimentos infligidos pelo tirano tornam-se uma oportunidade para os mártires demonstrarem sua perseverança.'
    reason: cultural_note
lexical_decisions:
- source_word: Καλῶς ... καλῶς
  choice: Muito bem ... sim, muito bem
  rationale: Preserva a repetição enfática do grego e seu tom de aprovação irônica, com formulação natural em português.
- source_word: ἔλεγεν
  choice: dizia ele
  rationale: O imperfeito apresenta a fala em andamento no contexto narrativo; o sujeito implícito é o mártir que está falando, não ὁ τύραννος.
- source_word: ἄκων ὁ τύραννος
  choice: Mesmo contra a vontade, o tirano
  rationale: ἄκων está no nominativo masculino singular e concorda com ὁ τύραννος; portanto, caracteriza a ação involuntária do tirano, e não a maneira como o mártir fala.
- source_word: χάριτας ἡμῖν χαρίζῃ
  choice: nos concede favores
  rationale: Mantém, tanto quanto possível em português idiomático, a construção cognata e a ironia pela qual as torturas do perseguidor são tratadas como favores.
- source_word: διὰ γενναιοτέρων πόνων
  choice: por meio de sofrimentos mais nobres
  rationale: πόνοι designa aqui provações dolorosas, enquanto o comparativo γενναιοτέρων qualifica esses sofrimentos como mais nobres ou valorosos.
- source_word: ἐπιδείξασθαι παρέχων
  choice: dando-nos a oportunidade de demonstrar
  rationale: Explicita de modo natural a ideia de proporcionar ocasião para tornar visível uma qualidade.
- source_word: τὴν εἰς τὸν νόμον ἡμῶν καρτερίαν
  choice: nossa perseverança em favor da nossa lei
  rationale: καρτερία expressa firme perseverança sob sofrimento; εἰς τὸν νόμον indica orientação e compromisso para com a lei.
theological_decisions:
- issue: Sentido de νόμος no contexto do martírio judaico
  choice: lei
  alternative: Lei
  rationale: O termo se refere à lei ancestral e divina à qual os mártires permanecem fiéis. A inicial minúscula mantém o português corrente, e “nossa lei” identifica suficientemente o referente sem impor convenção confessional.
- issue: Identidade do sujeito de ἔλεγεν
  choice: O mártir é quem fala; “o tirano” é sujeito de “concede”
  alternative: O tirano é quem diz a frase
  rationale: A concordância de ἄκων com ὁ τύραννος e a progressão do discurso mostram que o tirano age contra a própria vontade ao proporcionar aos mártires a ocasião de demonstrar perseverança. Fazer do tirano o falante produziria uma referência incomum a si mesmo na terceira pessoa e enfraqueceria a sintaxe.
translation_notes:
  register: Português moderno, digno e acessível, com leve solenidade adequada ao discurso de martírio. A pontuação distingue a fórmula narrativa “dizia ele” da fala e conserva a repetição retórica de καλῶς.
