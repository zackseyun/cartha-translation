  to: “Muito bem”, dizia ele, “o tirano, mesmo contra a vontade, nos concede favores — e faz muito bem — ao nos dar a oportunidade de demonstrar, por meio de sofrimentos mais nobres, nossa perseverança por nossa lei.”[a]
