translation:
  language: pt
  text: se de fato tivesses sensibilidade para os desejos humanos[a] e tivesses esperança de salvação da parte de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego transmitido traz uma construção incomum (literalmente, algo como «de seres humanos, de desejos»). O sentido provável é «desejos» ou «anseios humanos».
    reason: Assinala a anomalia sintática do texto transmitido e explica a tradução adotada, sem ocultar a incerteza textual.
lexical_decisions:
- source_word: εἴπερ
  choice: se de fato
  rationale: Preserva a força condicional enfática da expressão grega.
- source_word: ἠσθάνου
  choice: tivesses alguma consciência
  rationale: Expressa percepção ou sensibilidade, em linguagem portuguesa natural, sem reduzir o verbo a mero conhecimento intelectual.
- source_word: πόθων
  choice: dos desejos
  rationale: Mantém o sentido amplo do genitivo plural de πόθος, que pode abranger desejos, anseios ou afetos.
- source_word: παρὰ θεῷ
  choice: junto de Deus
  rationale: Conserva a relação espacial/relacional sugerida por παρά com o dativo, sem decidir de modo excessivo entre 'da parte de Deus' e 'diante de Deus'.
- source_word: σωτηρίου
  choice: de salvação
  rationale: No contexto de martírio, 'salvação' preserva melhor a amplitude religiosa de σωτήριον do que o mais restrito 'livramento'.
theological_decisions:
- issue: Natureza da esperança associada a Deus
  choice: esperança de salvação junto de Deus
  alternative: esperança de livramento da parte de Deus
  rationale: A formulação escolhida preserva tanto a dimensão teológica de σωτήριον quanto a ambiguidade relacional de παρὰ θεῷ, sem limitar a referência a um resgate temporal.
translation_notes:
  register: Português moderno, digno e acessível, com formas verbais no singular informal-literário ('tivesses') adequadas à interpelação direta. A redação mantém a tensão e a estranheza moderada da construção grega.
