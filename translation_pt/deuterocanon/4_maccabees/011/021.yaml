lexical_decisions:
- source_word: ἀνίκητος
  choice: invencível
  rationale: Expressa de modo natural e direto aquilo que não pode ser vencido, preservando a força predicativa do adjetivo grego.
- source_word: γὰρ
  choice: pois
  rationale: Introduz a explicação ou fundamento da afirmação no contexto, em registro corrente e digno.
- source_word: ὦ τύραννε
  choice: ó tirano
  rationale: Mantém o vocativo explícito e o tom confrontador do discurso dirigido ao governante.
- source_word: ἡ εὐσεβὴς ἐπιστήμη
  choice: o entendimento piedoso
  rationale: Combina a dimensão intelectual de ἐπιστήμη com a reverência a Deus expressa por εὐσεβής. “Entendimento” evita restringir o termo a mero acúmulo de informação, enquanto “piedoso” conserva sua dimensão religiosa.
theological_decisions:
- issue: Como traduzir a expressão programática εὐσεβὴς ἐπιστήμη
  choice: o entendimento piedoso
  alternative: a razão piedosa; o conhecimento devoto
  rationale: A escolha preserva a união entre compreensão racional e reverência a Deus sem impor terminologia filosófica técnica. As alternativas permanecem na nota por refletirem possibilidades genuínas do grego e a tensão temática de 4 Macabeus.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O vocativo “ó tirano” e a exclamação preservam a intensidade retórica da fala; a ordem foi ajustada ao uso natural do português sem eliminar o nexo explicativo de γὰρ.
