  text: Your fire is cold to us[a], your catapults are painless, and your violence is powerless.
translation:
  language: pt
  text: O teu fogo é frio para nós, as catapultas não nos causam dor[a], e a tua violência não tem poder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os instrumentos de tortura não nos causam dor”. A palavra grega καταπέλται significa literalmente “catapultas”, mas, neste contexto, pode referir-se de modo mais amplo a instrumentos de suplício.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πῦρ σου
  choice: o teu fogo
  rationale: Tradução direta que preserva a imagem concreta do instrumento de tortura e a referência pessoal ao tirano.
- source_word: ψυχρὸν ἡμῖν
  choice: é frio para nós
  rationale: 'Mantém o sentido literal e o paradoxo enfático: para os mártires, o fogo do perseguidor se mostra ineficaz.'
- source_word: ἄπονοι οἱ καταπέλται
  choice: as catapultas não nos causam dor
  rationale: καταπέλται designa literalmente catapultas ou máquinas de arremesso; a formulação verbal é mais natural em português do que 'são indolores' e expressa com clareza ἄπονοι no contexto.
- source_word: ἀδύνατος ἡ βία σου
  choice: a tua violência não tem poder
  rationale: ἀδύνατος significa 'sem poder', 'incapaz'. A expressão preserva a declaração desafiadora de que a violência do tirano não consegue vencê-los.
theological_decisions:
- issue: Paradoxo retórico na fala dos mártires
  choice: Conservar literalmente a afirmação de que o fogo é frio e declarar que os tormentos são ineficazes.
  alternative: Abrandar a imagem para 'o teu fogo parece fresco' ou explicar que eles suportam o sofrimento.
  rationale: O texto emprega linguagem desafiadora, não uma explicação metafísica da temperatura do fogo. A tradução direta preserva a força e a tensão da declaração sem interpretá-la em excesso.
translation_notes:
  register: Português moderno, claro e digno, com construção acessível tanto no Brasil quanto em outros contextos lusófonos. O pronome possessivo 'teu' conserva a interpelação direta e solene. A repetição enfática das três afirmações foi mantida.
