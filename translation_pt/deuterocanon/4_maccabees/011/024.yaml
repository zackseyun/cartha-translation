  yaml_path: translation/deuterocanon/4_maccabees/011/024.yaml
  text: Six young men have overthrown your tyranny.
translation:
  language: pt
  text: Nós, seis jovens, derrubamos a tua tirania.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἓξ
  choice: seis
  rationale: Cardinal numeral used directly with the subject.
- source_word: μειράκια
  choice: jovens
  rationale: Refers to the speaker and his brothers as young males. “Jovens” is natural in modern Portuguese and preserves their youth without the potentially childish force of “meninos”.
- source_word: κατελύσαμέν
  choice: derrubamos
  rationale: 'The aorist of καταλύω presents a decisive accomplishment: their steadfast resistance has brought the tyrant’s power down in the rhetorical and moral sense intended here.'
- source_word: σου
  choice: tua
  rationale: Second-person singular possessive. The direct address suits the taunting rhetorical context.
- source_word: τὴν τυραννίδα
  choice: tirania
  rationale: Direct, current equivalent for tyrannical or oppressive rule.
theological_decisions:
- issue: Força do aoristo numa provocação dirigida ao perseguidor
  choice: “derrubamos”, como ação decisiva e consumada
  alternative: “pusemos fim à” ou “temos derrubado”
  rationale: O aoristo apresenta o feito como completo. O pretérito perfeito simples é a forma mais natural em português e conserva a afirmação triunfal de que a firmeza dos seis já derrotou moralmente a tirania, sem transformá-la necessariamente numa queda política literal.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A explicitação pronominal “Nós” destaca o contraste retórico entre os seis jovens e a tirania do interlocutor; “tua” mantém a interpelação direta.
