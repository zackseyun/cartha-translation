  source_fidelity: 'A tradução preserva todos os elementos do grego: o sujeito de primeira pessoa plural identificado como seis jovens (ἓξ μειράκια), a realização decisiva expressa pelo aoristo κατελύσαμεν e o objeto direto, «a tua tirania» (σου τὴν τυραννίδα). «Derrubamos» transmite adequadamente, no contexto retórico, a derrota moral e efetiva da tirania, sem alegar uma deposição política literal.'
  naturalness: «Nós, seis jovens, derrubamos a tua tirania» é claro, idiomático e tem a força de desafio solene apropriada ao contexto. A forma «derrubamos» pode formalmente coincidir com o presente em português, mas o objeto e o contexto tornam natural a leitura de pretérito perfeito; não exige alteração.
