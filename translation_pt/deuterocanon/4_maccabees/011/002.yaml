lexical_decisions:
- source_word: Οὐ μέλλω
  choice: Não vou
  rationale: Com o infinitivo, μέλλω pode indicar intenção ou disposição iminente. “Não vou” comunica em português atual a resolução enfática do falante sem transformar a expressão numa simples previsão.
- source_word: τύραννε
  choice: tirano
  rationale: O vocativo interpela diretamente o governante com a força moralmente carregada do termo grego.
- source_word: πρὸς τὸν ... βασανισμόν
  choice: diante da tortura
  rationale: Em ligação com παραιτεῖσθαι, a expressão indica aquilo de que o falante se recusaria a participar ou diante do qual poderia recuar. “Tortura” corresponde ao contexto de suplício dos mártires.
- source_word: ὑπὲρ τῆς ἀρετῆς
  choice: por amor à virtude
  rationale: A locução preserva o sentido de agir ou sofrer em favor da virtude e soa natural no registro ético-filosófico da passagem.
- source_word: παραιτεῖσθαι
  choice: recuar
  rationale: O verbo pode significar recusar, declinar ou esquivar-se. Neste contexto, “recuar” expressa a decisão de não se retrair diante do sofrimento, enquanto a nota registra a alternativa mais formal.
theological_decisions:
- issue: Sentido de ἀρετή no contexto filosófico do martírio
  choice: virtude
  alternative: excelência
  rationale: “Virtude” conserva o sentido ético-filosófico central de 4 Macabeus, ligado à excelência moral e à firmeza sob sofrimento, sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e direto, com boa legibilidade brasileira. A ordem vocativa e o termo “tirano” preservam o tom confrontador; a nota mantém a amplitude semântica de παραιτεῖσθαι.
