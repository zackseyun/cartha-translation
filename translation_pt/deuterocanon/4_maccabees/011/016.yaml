  text: So if it seems good to you to torture those who do not eat defiling food[a], torture us.
translation:
  language: pt
  text: Assim, se te parece bem torturar os que não comeram alimentos impuros[a], tortura-nos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “os que não comeram contaminação” ou “impureza”. O grego deixa implícito o objeto de comer; no contexto, refere-se aos que recusaram alimentos impuros.
    reason: A expressão grega é incomum e elíptica; a nota registra sua formulação literal e explica a explicitação contextual de “alimentos”.
lexical_decisions:
- source_word: ὥστʼ
  choice: Assim
  rationale: Introduz a conclusão inferida do argumento anterior, com força lógica e expressão natural em português.
- source_word: εἰ σοὶ δοκεῖ
  choice: se te parece bem
  rationale: Conserva a construção idiomática com dativo e o tom de desafio formal dirigido ao rei.
- source_word: βασανίζειν
  choice: torturar
  rationale: No contexto de martírio, designa sofrimento físico deliberadamente infligido, e não mero incômodo ou aflição.
- source_word: μὴ μεμοφαγοῦντας
  choice: os que não comem alimento que contamina
  rationale: Explicita o objeto elíptico com base no contexto, em que se recusa alimento proibido capaz de causar contaminação ritual, sem reduzir a expressão apenas a jejum ou abstinência genérica.
- source_word: βασάνιζε
  choice: tortura-nos
  rationale: Repete o verbo para preservar a força retórica; o objeto implícito é explicitado de modo natural em português.
theological_decisions:
- issue: Explicitação do objeto de comer em μὴ μεμοφαγοῦντας
  choice: alimento que contamina
  alternative: coisa impura; alimento impuro; não comeram
  rationale: O contexto exige referência ao alimento proibido, mas a formulação relativa preserva a ideia de contaminação sem definir além do necessário a natureza exata dessa impureza.
- issue: Objeto implícito do imperativo final
  choice: tortura-nos
  alternative: tortura
  rationale: O grupo dos falantes é o objeto claramente subentendido; explicitá-lo produz uma frase portuguesa completa e mantém o desafio direto.
translation_notes:
  register: Português atual, digno e direto, com segunda pessoa singular para conservar o confronto pessoal com o rei. A repetição de “torturar/tortura” reproduz deliberadamente a ênfase do grego.
