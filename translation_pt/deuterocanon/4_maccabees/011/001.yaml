lexical_decisions:
- source_word: Ὡς δὲ καὶ οὗτος
  choice: Quando também este
  rationale: Mantém a transição temporal, a ideia de sequência e a referência enfática ao irmão mencionado anteriormente.
- source_word: ταῖς βασάνοις καταικισθεὶς
  choice: maltratado pelas torturas
  rationale: Expressa tanto as torturas (βασάνοις) quanto o tratamento cruel indicado pelo particípio καταικισθείς, sem fundir este último indevidamente com o verbo morrer.
- source_word: ἐναπέθανεν
  choice: morreu
  rationale: Traduz de modo direto o aoristo que conclui a morte do quarto irmão antes da ação seguinte.
- source_word: ὁ πέμπτος
  choice: o quinto
  rationale: Preserva o ordinal substantivado do grego; o contexto identifica claramente o quinto irmão.
- source_word: παρεσήμαινεν
  choice: fez um sinal
  rationale: Mantém o sentido básico de dar ou fazer um sinal sem explicitar aquilo que o texto grego deixa implícito.
- source_word: λέγων
  choice: dizendo
  rationale: Conserva a construção participial que introduz a fala do versículo seguinte.
