  yaml_path: translation/deuterocanon/4_maccabees/011/027.yaml
  text: For our guards stand over us not for a tyrant[a], but for divine law; for this reason we have undefeated reason.
translation:
  language: pt
  text: Pois os guardas que nos vigiam não servem a um tirano, mas à lei divina; por isso, temos uma razão invencível.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «nosso raciocínio é invencível» ou «possuímos uma razão inconquistável». O termo grego λογισμός é central em 4 Macabeus e designa a faculdade racional ou o juízo racional.
    reason: lexical_alternative
lexical_decisions:
- source_word: τυράννου
  choice: tirano
  rationale: Preserva a força negativa de τύραννος, que designa aqui um governante opressor ou absoluto, sem neutralizá-lo como «rei» ou «governante».
- source_word: θείου νόμου
  choice: lei divina
  rationale: Reproduz de perto a construção adjetival grega e mantém a referência à lei proveniente de Deus sem ampliar a formulação.
- source_word: προεστήκασιν ἡμῶν
  choice: que nos vigiam
  rationale: A forma perfeita de προΐστημι com o genitivo ἡμῶν indica que os guardas estão colocados sobre os irmãos, exercendo vigilância ou controle. «Que nos vigiam» expressa isso em português natural.
- source_word: οἱ δορυφόροι
  choice: os guardas
  rationale: Embora o termo designe literalmente portadores de lança, no contexto refere-se aos homens armados que guardam e executam as ordens do tirano; «guardas» comunica sua função sem especificar indevidamente a arma.
- source_word: ἀνίκητον
  choice: invencível
  rationale: O adjetivo significa não vencido ou não superado. «Invencível» é idiomático e mantém a força enfática da afirmação.
- source_word: λογισμόν
  choice: razão
  rationale: Em 4 Macabeus, λογισμός é um termo central para a faculdade racional ou o juízo racional que governa as paixões. «Razão» preserva de modo conciso essa dimensão filosófica.
- source_word: διὰ τοῦτο
  choice: por isso
  rationale: Marca de forma natural em português a conclusão inferida da afirmação anterior.
theological_decisions:
- issue: Contraste entre a autoridade do tirano e a autoridade da lei divina
  choice: não servem a um tirano, mas à lei divina
  alternative: não estão sob um tirano, mas sob a lei divina
  rationale: A formulação preserva o contraste antitético do grego e expressa a autoridade em nome da qual os guardas atuam, sem transformar o versículo numa declaração doutrinária mais ampla.
- issue: Força da afirmação sobre λογισμός
  choice: temos uma razão invencível
  alternative: nosso raciocínio é invencível
  rationale: Mantém a construção grega com ἔχομεν («temos») e preserva o destaque filosófico dado à razão, sem decidir de modo rígido entre faculdade racional e atividade de raciocinar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi tornada natural sem apagar o contraste retórico nem a terminologia filosófica do livro.
