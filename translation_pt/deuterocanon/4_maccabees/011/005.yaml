base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/005.yaml
  text: Or does it not seem evil that we worship the Creator of all things and live according to his virtuous law?[a][b]
translation:
  language: pt
  text: Ou não parece um mal[a] adorarmos o Criador de todas as coisas e vivermos segundo a sua lei virtuosa?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “errado”. O grego κακόν pode indicar aquilo que é mau, censurável ou moralmente errado.
    reason: lexical_alternative
  - marker: b
    text: A expressão “sua lei virtuosa” também pode ser traduzida por “sua lei nobre” ou “sua lei excelente”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κακὸν
  choice: um mal
  rationale: O adjetivo substantivado expressa aquilo que é moralmente mau ou censurável. “Um mal” conserva a força moral e funciona naturalmente na pergunta retórica.
- source_word: οὐ δοκεῖ
  choice: não parece
  rationale: δοκέω indica parecer ou apresentar-se ao juízo; “não parece” preserva tanto o sentido quanto a forma retórica.
- source_word: τὸν πάντων κτίστην
  choice: o Criador de todas as coisas
  rationale: κτίστης designa o criador ou fundador, e πάντων lhe confere alcance universal. A formulação mantém o registro teológico elevado sem acrescentar conteúdo.
- source_word: εὐσεβοῦμεν
  choice: adorarmos
  rationale: Neste contexto, com “o Criador de todas as coisas” como objeto, o verbo indica devoção religiosa. “Adorarmos” comunica isso com clareza no português atual.
- source_word: κατὰ
  choice: segundo
  rationale: κατά com acusativo marca conformidade com uma norma. “Segundo” é conciso, natural e exato.
- source_word: τὸν ἔναρετον αὐτοῦ νόμον
  choice: a sua lei virtuosa
  rationale: ἔναρετος atribui à lei excelência ou qualidade moral. “Lei virtuosa” preserva diretamente essa caracterização ética, embora “lei nobre” e “lei excelente” também sejam possíveis.
- source_word: ζῶμεν
  choice: vivermos
  rationale: O verbo descreve a maneira de conduzir a vida. O infinitivo pessoal coordena-se naturalmente com “adorarmos” depois de “parece um mal”.
theological_decisions:
- issue: Sentido de εὐσεβοῦμεν em relação a Deus
  choice: adorarmos
  alternative: reverenciarmos; demonstrarmos devoção ao
  rationale: Como o objeto é “o Criador de todas as coisas”, trata-se explicitamente de devoção religiosa. “Adorarmos” torna clara essa orientação sem introduzir uma distinção confessional ausente do grego.
- issue: Força da pergunta retórica iniciada por ἢ
  choice: Ou não parece um mal... ?
  alternative: Ou não parece errado... ?; Ou não se considera um mal... ?
  rationale: A manutenção de “Ou” conserva a ligação argumentativa com o contexto anterior, e “não parece” retém a forma interrogativa e sua tensão, sem convertê-la numa afirmação independente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregaram-se os infinitivos pessoais “adorarmos” e “vivermos” para uma construção natural. A formulação preserva a pergunta retórica e a caracterização moral incomum, porém significativa, da lei como “virtuosa”.
