  text: And after heating sharp spits[a], they applied them to his back; and after piercing his sides, they burned his entrails from it.
translation:
  language: pt
  text: Depois de aquecerem espetos pontiagudos, aplicavam-nos às costas dele; e, depois de lhe perfurarem os lados, queimavam-lhe as entranhas por dentro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «a partir dele» ou «desde ele». A expressão grega é ambígua; provavelmente indica que a queimadura alcançava as partes internas depois que os lados haviam sido perfurados.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀβελίσκους ὀξεῖς
  choice: espetos pontiagudos
  rationale: ὀβελίσκος designa um pequeno espeto ou instrumento metálico semelhante; ὀξύς ressalta sua ponta penetrante. A expressão mantém a natureza provável do instrumento sem recorrer ao termo mais genérico «pontas».
- source_word: πυρώσαντες
  choice: depois de aquecerem
  rationale: O particípio indica ação anterior à aplicação dos espetos e, neste contexto, implica que foram intensamente aquecidos. A formulação preserva a sequência sem acrescentar explicitamente «ao rubro», ausente do grego.
- source_word: τοῖς νώτοις προσέφερον
  choice: aplicavam-nos às costas dele
  rationale: προσφέρω significa levar até, pôr em contato ou aplicar. «Aplicavam» exprime naturalmente a ação no contexto de tortura, enquanto «às costas dele» torna explícito em português o referente humano implícito.
- source_word: τὰ πλευρὰ διαπείραντες
  choice: depois de lhe perfurarem os lados
  rationale: πλευρά pode indicar lados, flancos ou costelas, e διαπείρω descreve perfuração ou penetração. «Lados» evita restringir indevidamente o sentido a «costelas».
- source_word: τὰ σπλάγχνα
  choice: as entranhas
  rationale: No contexto físico, σπλάγχνα se refere aos órgãos internos. «Entranhas» conserva a força concreta e visceral do grego.
- source_word: διέκαιον
  choice: queimavam
  rationale: O imperfeito retrata uma ação em curso. «Queimavam» reproduz o aspecto verbal e o sentido direto do verbo.
- source_word: ἀπʼ αὐτοῦ
  choice: por dentro
  rationale: A expressão é literalmente «a partir dele» ou «desde ele», mas sua referência exata é pouco clara. No contexto da perfuração dos lados, «por dentro» comunica a provável direção ou localização da queimadura; a nota registra a forma literal e a ambiguidade.
