  yaml_path: translation/deuterocanon/4_maccabees/011/015.yaml
  text: For since we were both born and brought up for the same things[a], we likewise ought to die for the same things.
translation:
  language: pt
  text: Pois, uma vez que nascemos e fomos criados para as mesmas coisas[a], devemos igualmente morrer pelas mesmas coisas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para os mesmos propósitos” ou “em vista das mesmas causas”. O grego emprega nas duas orações uma expressão ampla, literalmente “as mesmas coisas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ αὐτά
  choice: para as mesmas coisas
  rationale: A expressão indica orientação ou propósito e mantém, em português, a formulação ampla e o paralelismo deliberado do grego.
- source_word: γενηθέντες
  choice: nascemos
  rationale: No contexto familiar e biográfico, esta é a forma mais natural de expressar o particípio grego.
- source_word: τραφέντες
  choice: fomos criados
  rationale: Expressa formação e criação desde a infância, e não apenas alimentação física.
- source_word: ὑπὲρ τῶν αὐτῶν
  choice: pelas mesmas coisas
  rationale: A preposição indica morrer em favor ou em defesa dos mesmos compromissos; a redação conserva a repetição ampla do original sem especificar indevidamente seu referente.
- source_word: ἀποθνήσκειν
  choice: morrer
  rationale: Reproduz diretamente o infinitivo, sem acrescentar um agente responsável pela morte.
- source_word: ὀφείλομεν
  choice: devemos
  rationale: Comunica de modo claro e corrente a obrigação moral expressa pelo verbo.
- source_word: ὁμοίως
  choice: igualmente
  rationale: Sublinha a correspondência entre a origem e criação comuns e a obrigação comum de morrer.
theological_decisions:
- issue: Se o objeto implícito deve ser explicitado como “princípios”, “causas” ou “leis”
  choice: Manter “as mesmas coisas” nas duas orações
  alternative: os mesmos princípios; as mesmas causas; as mesmas leis
  rationale: O grego repete uma expressão neutra e ampla sem nomear explicitamente o referente. Embora o contexto maior envolva compromissos ligados à Lei, especificá-los aqui eliminaria uma ambiguidade genuína do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Fomos criados” é natural neste contexto familiar; a repetição de “as mesmas coisas” foi preservada por refletir uma característica significativa do grego.
