  text: As he was saying such things[a], the bodyguards bound him and dragged him to the wheel.
translation:
  language: pt
  text: Enquanto ele dizia essas coisas, os guardas o amarraram e o arrastaram até o instrumento de tortura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “até a catapulta” ou “até a roda”. A palavra grega designa literalmente uma catapulta, mas aqui parece referir-se a um aparelho usado para tortura.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαῦτα
  choice: essas coisas
  rationale: O demonstrativo plural retoma de modo amplo o conteúdo das palavras anteriores; “essas coisas” é natural e preserva essa referência geral.
- source_word: λέγοντα
  choice: Enquanto ele dizia
  rationale: O particípio presente indica que a fala estava em andamento quando os guardas o prenderam.
- source_word: δορυφόροι
  choice: guardas
  rationale: Embora o termo signifique literalmente “portadores de lança”, no uso helenístico designa guardas oficiais; “guardas” é claro sem especificar além do que o contexto exige.
- source_word: δήσαντες
  choice: amarraram
  rationale: O particípio aoristo indica que eles o imobilizaram antes de arrastá-lo; “amarraram” comunica isso em linguagem corrente.
- source_word: εἵλκον
  choice: arrastaram
  rationale: O imperfeito descreve a ação violenta e continuada de levá-lo à força.
- source_word: καταπέλτην
  choice: instrumento de tortura
  rationale: O substantivo costuma designar uma catapulta, mas neste contexto refere-se a um aparelho de tortura cuja identificação exata é incerta. A formulação contextual evita a imagem enganosa de uma arma de guerra e não afirma que fosse especificamente uma roda.
theological_decisions:
- issue: Identificação de καταπέλτην no contexto de tortura
  choice: instrumento de tortura
  alternative: catapulta; roda
  rationale: O contexto exige um aparelho de tortura, mas o grego não identifica inequivocamente seu formato. A tradução preserva a incerteza histórica e lexical, deixando as alternativas para a nota.
translation_notes:
  register: Português moderno, claro e digno, com construção fluente e vocabulário acessível. A opção “instrumento de tortura” prioriza a referência contextual sem apresentar como certa a identificação tradicional com a roda.
