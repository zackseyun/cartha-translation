  yaml_path: translation/deuterocanon/4_maccabees/011/003.yaml
  text: But I came forward of my own accord[a], so that, after killing me also[b], you might incur punishment from heavenly justice for still more acts of wrongdoing.
translation:
  language: pt
  text: Mas eu mesmo me apresentei por vontade própria[a], para que, depois de matar também a mim, você incorra em punição por parte da justiça celestial[b], por ainda mais atos de injustiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “avancei por iniciativa própria” ou “vim por minha própria iniciativa”.
    reason: lexical_alternative
  - marker: b
    text: “Justiça celestial” também pode ser traduzido por “justiça do céu” ou “julgamento celestial”.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτὸς δʼ ἀπʼ ἐμαυτοῦ
  choice: Mas eu mesmo me apresentei por vontade própria
  rationale: A combinação enfatiza a iniciativa pessoal e voluntária do falante. “Me apresentei” comunica, no contexto, que ele avançou e se colocou diante do tirano, enquanto “eu mesmo” e “por vontade própria” preservam a ênfase acumulada do grego.
- source_word: ὅπως
  choice: para que
  rationale: Introduz a finalidade pretendida pelo falante e mantém a tensão da declaração sem reformulá-la como simples consequência.
- source_word: κἀμὲ κατακτείνας
  choice: depois de matar também a mim
  rationale: 'O particípio aoristo indica ação anterior ao verbo principal, e κἀμέ conserva o sentido aditivo: o falante será incluído entre as vítimas.'
- source_word: περὶ πλειόνων ἀδικημάτων
  choice: por ainda mais atos de injustiça
  rationale: Preserva tanto a ideia de responsabilidade por ofensas quanto o valor comparativo de πλειόνων, sem restringir ἀδικημάτων a uma categoria jurídica moderna.
- source_word: ὀφλήσῃς
  choice: você incorra
  rationale: O verbo exprime contrair dívida ou responsabilidade. “Incorra” mantém a nuance de sujeição a uma penalidade e se combina naturalmente com “castigo”.
- source_word: τῇ οὐρανίᾳ δίκῃ
  choice: da justiça celestial
  rationale: δίκη pode designar justiça, julgamento ou justiça retributiva personificada. A expressão portuguesa mantém a origem ou autoridade transcendente do castigo sem identificar explicitamente a frase com uma formulação doutrinária específica.
- source_word: τιμωρίαν
  choice: castigo
  rationale: Expressa punição retributiva em linguagem clara, corrente e digna.
theological_decisions:
- issue: Sentido de τῇ οὐρανίᾳ δίκῃ
  choice: justiça celestial
  alternative: justiça do céu; julgamento celestial
  rationale: “Justiça celestial” preserva a referência à ordem retributiva transcendente e a possível personificação de δίκη, sem resolver se a expressão destaca a fonte do castigo, o tribunal divino ou a própria ação de julgar.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação conserva a ênfase do grego na iniciativa voluntária do falante, a finalidade expressa por ὅπως e a linguagem de responsabilidade perante a justiça transcendente.
