  text: On it, while being stretched out with measured care and disjointed, he was being burned underneath.
translation:
  language: pt
  text: Sobre ele, enquanto era estirado metodicamente[a] e tinha as articulações deslocadas[b], era queimado por baixo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cuidadosamente” ou “de maneira controlada”; o advérbio grego destaca a aplicação deliberada e ordenada da tortura.
    reason: lexical_alternative
  - marker: b
    text: Ou “tinha as juntas deslocadas” ou “tinha os membros violentamente desconjuntados”; o verbo grego se refere ao deslocamento violento das articulações ou vértebras.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφ' οὗ
  choice: Sobre ele
  rationale: Conserva a referência anafórica ao instrumento ou à superfície de tortura mencionada no contexto anterior, sem especificar além do grego.
- source_word: κατατεινόμενος
  choice: era estirado
  rationale: Expressa a ação passiva de puxar e manter o corpo estendido ou retesado sobre o instrumento de tortura.
- source_word: εὐμελῶς
  choice: metodicamente
  rationale: Comunica o caráter ordenado, deliberado e regulado da ação; em português corrente, soa mais natural do que uma tradução excessivamente literal.
- source_word: ἐκσφονδυλιζόμενος
  choice: tinha as articulações deslocadas
  rationale: Torna explícita a violenta deslocação das juntas ou vértebras indicada pelo verbo, sem chegar à ideia mais forte de despedaçamento.
- source_word: ὑπεκαίετο
  choice: era queimado por baixo
  rationale: Preserva tanto o aspecto durativo do imperfeito passivo quanto a indicação espacial de que o fogo agia de baixo.
