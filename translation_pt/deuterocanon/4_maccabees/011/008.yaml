  yaml_path: translation/deuterocanon/4_maccabees/011/008.yaml
  text: Now look[a], being alien to God[b], you are making war against those who are devout toward God.
translation:
  language: pt
  text: 'Agora, veja: estando alheio a Deus[a], você guerreia[b] contra os que demonstram devoção a Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “afastado de Deus” ou “estranho a Deus”.
    reason: lexical_alternative
  - marker: b
    text: Ou “combate” ou “trava guerra”.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν ἰδὲ
  choice: Agora veja
  rationale: Reproduz o marcador temporal e o imperativo de atenção, mantendo o tom direto e confrontador sem recorrer ao arcaizante “eis”.
- source_word: ἀλλότριος ὢν θεοῦ
  choice: estando alheio a Deus
  rationale: Mantém a construção participial e a ideia de separação ou não pertencimento em relação a Deus, sem transformá-la em categoria teológica técnica.
- source_word: πολεμεῖς
  choice: você guerreia
  rationale: Preserva a intensidade marcial e a ação hostil expressa pelo presente grego; “combate” seria possível, mas um pouco menos explícito quanto à imagem de guerra.
- source_word: τοὺς εὐσεβοῦντας
  choice: os que demonstram devoção
  rationale: Expressa de modo natural a piedade ou reverência praticada continuamente pelos referidos indivíduos.
- source_word: εἰς τὸν θεόν
  choice: a Deus
  rationale: Indica Deus como o objeto e a direção da devoção em português corrente, sem a formulação menos idiomática “para com Deus”.
theological_decisions:
- issue: Força relacional de ἀλλότριος θεοῦ
  choice: alheio a Deus
  alternative: afastado de Deus; estranho a Deus; pertencente a outro, e não a Deus
  rationale: O contexto caracteriza a postura ímpia e hostil do tirano em relação a Deus. “Alheio a Deus” preserva a forte separação relacional e moral, mas não especifica indevidamente sua causa nem a converte em doutrina técnica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa foi vertida por “você”, natural no português brasileiro contemporâneo, e a repetição de “Deus” foi mantida por corresponder à ênfase do grego.
