  yaml_path: translation/deuterocanon/4_maccabees/011/020.yaml
  text: But while he was being tortured[a], as one belonging to a holy age, he said, “For the sake of godliness, when so many brothers were called into training in sufferings, we were not conquered.”
translation:
  language: pt
  text: 'Mas ele, enquanto era torturado, como alguém pertencente a uma existência santa[a], dizia: “Por isso, por causa da devoção a Deus, nós, tantos irmãos chamados para o treinamento em sofrimentos, não fomos vencidos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como alguém de uma vida consagrada” ou “como alguém pertencente a uma era santa”. A expressão grega é incomum e pode descrever um modo de vida consagrado, e não uma “era” em sentido temporal.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασανιζόμενος
  choice: enquanto era torturado
  rationale: O particípio presente passivo indica ação em curso; no contexto do martírio, refere-se concretamente à tortura física.
- source_word: ἱεροπρεποῦς αἰῶνος
  choice: como alguém pertencente a uma existência santa
  rationale: A expressão grega é incomum. “Existência” conserva a amplitude de αἰών, que pode apontar para duração ou modo de vida, sem impor o sentido temporal mais estreito de “era”.
- source_word: εὐσέβειαν
  choice: devoção a Deus
  rationale: Explicita em português corrente a orientação religiosa de εὐσέβεια e sua associação, no livro, com fidelidade a Deus.
- source_word: γυμνασίαν πόνων
  choice: treinamento dos sofrimentos
  rationale: Mantém a metáfora atlética de γυμνασία e traduz πόνων como sofrimentos, adequado às provações físicas narradas.
- source_word: ἀδελφοὶ
  choice: irmãos
  rationale: Refere-se literalmente aos irmãos do mártir no contexto narrativo.
- source_word: κληθέντες
  choice: tenham sido chamados
  rationale: Preserva a voz passiva e a possível nuance tanto de convocação quanto de chamado para a provação.
- source_word: οὐκ ἐνικήθημεν
  choice: não fomos vencidos
  rationale: Conserva a voz passiva e a imagem de vitória e derrota expressa por νικάω.
theological_decisions:
- issue: Interpretação de ἱεροπρεποῦς αἰῶνος
  choice: como alguém pertencente a uma existência santa
  alternative: como alguém de uma vida consagrada; como alguém pertencente a uma era santa
  rationale: A tradução mantém a expressão comprimida e sua ambiguidade entre duração da vida, existência e modo de viver, enquanto a nota registra alternativas plausíveis.
- issue: Valor de εὐσέβεια
  choice: devoção a Deus
  alternative: piedade; reverência
  rationale: A formulação comunica a dimensão dirigida a Deus sem reduzir o termo a sentimento interior nem acrescentar uma formulação confessional específica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A sintaxe preserva a imagem atlética e a ambiguidade da expressão grega incomum sem soar excessivamente arcaica.
