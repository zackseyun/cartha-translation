  terminology: «Devoção a Deus» comunica bem εὐσέβεια neste contexto, sem impor formulação doutrinária. «Sofrimentos», «irmãos», «chamados» e «vencidos» são escolhas apropriadas. A nota deve continuar a assinalar a incerteza de ἱεροπρεποῦς αἰῶνος.
