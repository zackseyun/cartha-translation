  text: I am younger than my brothers in age, but in understanding I am their equal.
translation:
  language: pt
  text: Quanto à idade, sou mais jovem que meus irmãos; quanto ao entendimento, porém, sou igual a eles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡλικίᾳ
  choice: quanto à idade
  rationale: Neste contraste entre irmãos, ἡλικία se refere naturalmente à idade cronológica; a expressão também preserva o paralelismo com «quanto ao entendimento».
- source_word: νεώτερος
  choice: mais jovem
  rationale: O comparativo indica que o falante tem menos idade que seus irmãos.
- source_word: ἀδελφῶν
  choice: irmãos
  rationale: O plural masculino se refere especificamente aos irmãos do falante no contexto narrativo.
- source_word: διανοίᾳ
  choice: quanto ao entendimento
  rationale: Aqui διανοία designa discernimento ou capacidade de compreender, em contraste com a idade física.
- source_word: ἡλικιώτης
  choice: igual a eles
  rationale: Embora o termo possa indicar alguém da mesma idade, o contraste retórico exige aqui igualdade no âmbito do entendimento, não igualdade cronológica.
theological_decisions:
- issue: Sentido de ἡλικιώτης em contraste com νεώτερος
  choice: igualdade com os irmãos quanto ao entendimento
  alternative: igualdade em maturidade ou em capacidade de julgar
  rationale: A primeira oração afirma explicitamente que o falante é mais jovem. Portanto, a segunda apresenta paridade mental ou moral, preservando o contraste sem criar uma contradição.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção correlativa «quanto à... quanto ao...» reproduz o contraste grego μὲν... δὲ sem soar artificial.
