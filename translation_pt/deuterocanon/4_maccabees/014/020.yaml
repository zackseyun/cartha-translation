translation:
  language: pt
  text: Mas a afeição pelos filhos não demoveu a mãe dos jovens, que era do mesmo espírito que Abraão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a mãe dos jovens, do mesmo espírito que Abraão”.
    reason: A expressão grega ὁμόψυχον pode também ser vertida por “do mesmo ânimo que Abraão” ou “de uma só alma com Abraão”; indica afinidade de disposição, não uma relação genealógica.
lexical_decisions:
- source_word: μετεκίνησεν
  choice: não abalou
  rationale: O verbo descreve deslocar alguém de uma posição ou estado; no contexto, indica que o afeto não fez a mãe vacilar em sua firme resolução. “Não abalou” mantém a metáfora e soa natural em português.
- source_word: συμπάθεια τέκνων
  choice: o afeto materno pelos filhos
  rationale: συμπάθεια expressa sentimento compartilhado, ternura ou afeição. No contexto da mãe e de seus filhos, “afeto materno” comunica a força relacional sem reduzir o termo à acepção moderna mais estreita de “simpatia”.
- source_word: τέκνων
  choice: pelos filhos
  rationale: Embora não haja possessivo explícito no grego, a relação com a mãe está clara no contexto. O artigo definido em português evita acrescentar desnecessariamente “seus”.
- source_word: ὁμόψυχον
  choice: que tinha o mesmo espírito de
  rationale: O adjetivo indica comunhão de alma, disposição ou ânimo. A formulação preserva a forte identificação interior com Abraão e também a expressividade do grego.
- source_word: τῶν νεανιῶν μητέρα
  choice: a mãe dos jovens
  rationale: νεανίαι designa jovens do sexo masculino. “Os jovens” é corrente e digno em português, e o contexto deixa claro que se trata dos filhos martirizados.
theological_decisions:
- issue: Sentido da comparação com Abraão
  choice: A mãe é apresentada como tendo a mesma disposição interior de Abraão.
  alternative: A mãe é simplesmente descrita como semelhante a Abraão ou como sua descendente.
  rationale: ὁμόψυχον aponta para identidade de ânimo ou espírito, não para descendência étnica. A tradução conserva a solidariedade moral e espiritual sem especificar além do que o grego afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, preservando a ênfase no afeto materno que não conseguiu afastá-la de sua firmeza.
