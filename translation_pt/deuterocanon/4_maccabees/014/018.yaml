  yaml_path: translation/deuterocanon/4_maccabees/014/018.yaml
  text: And why is it necessary to point out[a], by means of the irrational animals[b], the affection for their children?
translation:
  language: pt
  text: E por que é necessário demonstrar, por meio dos animais irracionais[a], a afeição que têm por seus filhotes[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio de animais desprovidos de razão”. O grego ressalta que os animais não possuem razão, em contraste com a racionalidade humana.
    reason: lexical_alternative
  - marker: b
    text: Ou “a afeição por sua prole”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί δεῖ
  choice: por que é necessário
  rationale: Preserva a força da pergunta retórica e a ideia de que essa demonstração é desnecessária.
- source_word: διὰ τῶν ἀλόγων ζῴων
  choice: por meio dos animais irracionais
  rationale: Mantém o sentido literal de seres vivos sem razão e o contraste filosófico implícito com a racionalidade humana.
- source_word: ἐπιδεικνύναι
  choice: demonstrar
  rationale: Expressa claramente o ato de mostrar algo mediante exemplos, como pede o contexto retórico.
- source_word: συμπάθειαν
  choice: afeição
  rationale: Neste contexto, indica o vínculo afetivo e terno dos pais com a prole; evita o sentido moderno mais restrito de 'simpatia'.
- source_word: πρὸς τὰ τέκνα
  choice: que têm por seus filhotes
  rationale: Torna explícita em português a relação dos animais com a própria prole; 'filhotes' é a designação natural para as crias de animais.
