lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca o forte contraste com o contexto anterior de modo natural em português.
- source_word: πάντες
  choice: todos eles
  rationale: Explicita a referência coletiva ao grupo já mencionado, sem acrescentar conteúdo.
- source_word: ὥσπερ
  choice: como se
  rationale: Introduz uma comparação, e não uma afirmação literal.
- source_word: ἐπʼ ἀθανασίας ὁδὸν
  choice: por um caminho para a imortalidade
  rationale: Conserva a metáfora do caminho e expressa a imortalidade como destino, mantendo em nota a construção mais formal com o genitivo.
- source_word: τρέχοντες
  choice: corressem
  rationale: Preserva a imagem de movimento rápido e concorda naturalmente com a comparação introduzida por «como se».
- source_word: ἐπὶ τὸν ... θάνατον
  choice: rumo à morte
  rationale: Expressa a direção indicada por ἐπί com acusativo e mantém a imagem de deslocamento.
- source_word: διὰ τῶν βασάνων
  choice: através das torturas
  rationale: Mantém tanto a ideia de atravessar o sofrimento como a de que as torturas conduzem à morte.
- source_word: ἔσπευδον
  choice: apressavam-se
  rationale: O imperfeito retrata uma ação contínua, e o verbo preserva a ideia de pressa ou empenho.
theological_decisions:
- issue: Sentido de ἀθανασία no contexto do martírio
  choice: imortalidade
  alternative: vida eterna
  rationale: O substantivo grego designa diretamente a condição de não morrer. «Imortalidade» preserva o termo e sua tensão teológica sem interpretá-lo como a expressão mais ampla «vida eterna».
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A metáfora do percurso — correr, caminho, rumo e através — foi preservada. A vírgula final acompanha a continuidade sintática do texto fornecido.
