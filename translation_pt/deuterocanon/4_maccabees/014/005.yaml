  yaml_path: translation/deuterocanon/4_maccabees/014/005.yaml
  text: But all of them[a], as though running on a road to immortality, were hurrying toward death through tortures[b],
translation:
  language: pt
  text: Mas todos eles, como se corressem por um caminho para a imortalidade[a], apressavam-se rumo à morte através das torturas[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por um caminho de imortalidade”.'
