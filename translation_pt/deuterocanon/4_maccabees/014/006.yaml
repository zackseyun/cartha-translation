base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/006.yaml
  text: For just as hands and feet move in harmony with the directions of the soul[a], so those holy youths also, as if by the immortal soul of godliness[b], were in harmony with death for its sake.
translation:
  language: pt
  text: Pois, assim como as mãos e os pés se movem em harmonia com as orientações da alma, assim também aqueles santos jovens, como que movidos pela alma imortal da piedade[a], concordaram com a morte em favor da piedade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “devoção a Deus”. O termo grego εὐσέβεια designa reverência e fidelidade religiosa.'
    reason: lexical_alternative
  - marker: b
    text: 'O grego repete palavras da mesma raiz: as mãos e os pés se movem “em harmonia”, e os jovens “concordaram” com a morte, ressaltando sua resolução unânime.'
    reason: wordplay
lexical_decisions:
- source_word: καθάπερ ... οὕτως
  choice: assim como ... assim também
  rationale: Preserva de modo natural a estrutura comparativa correlativa do grego e representa o valor de οὕτως.
- source_word: συμφώνως ... συνεφώνησαν
  choice: em harmonia ... entraram em harmonia
  rationale: Mantém a repetição deliberada da raiz συμφων-, que liga o movimento coordenado dos membros à decisão unânime dos jovens.
- source_word: τοῖς τῆς ψυχῆς ἀφηγήμασιν
  choice: com as orientações da alma
  rationale: ἀφήγημα exprime direção ou orientação; esta formulação é corrente em português e preserva a função diretiva da alma na comparação.
- source_word: οἱ ἱεροὶ μειρᾶκες ἐκεῖνοι
  choice: aqueles santos jovens
  rationale: Expressa tanto o caráter consagrado indicado por ἱεροί quanto a juventude masculina indicada por μειρᾶκες, sem tornar a frase pesada.
- source_word: ὡς ὑπὸ ψυχῆς ἀθανάτου τῆς εὐσεβείας
  choice: como que movidos pela alma imortal da piedade
  rationale: Acréscimo contextual de 'movidos' explicita em português a elipse verbal retomada da primeira parte, enquanto 'como que' conserva o caráter figurado de ὡς e evita transformar a personificação em afirmação metafísica literal.
- source_word: πρὸς τὸν ὑπὲρ αὐτῆς ... θάνατον
  choice: com a morte em favor dela
  rationale: Preserva a relação de concordância com a morte e o sentido de morte enfrentada em favor da piedade; o pronome retém a referência feminina possível no português.
theological_decisions:
- issue: Personificação de εὐσέβεια e a expressão 'alma imortal da piedade'
  choice: 'Conservar a personificação figurada: ''como que movidos pela alma imortal da piedade''.'
  alternative: '''como se estivessem sob o domínio de uma alma imortal, isto é, a piedade'''
  rationale: O texto compara os jovens a membros movidos por uma alma e personifica a piedade. A redação preserva essa imagem e sua tensão sem postular uma alma separada nem converter a frase em categoria antropológica posterior.
- issue: Referência de αὐτῆς
  choice: Manter 'dela', remetendo naturalmente à piedade.
  alternative: Explicitar 'em favor da piedade'.
  rationale: O pronome grego retoma εὐσέβεια; conservar o pronome mantém a coesão e a personificação do original, enquanto a nota elimina possível obscuridade sem alterar o texto principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a imagem corporal, a personificação da piedade e o jogo lexical de concordância do grego.
