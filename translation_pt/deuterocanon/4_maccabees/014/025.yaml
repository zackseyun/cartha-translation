review_pass:
  verdict: revise
  source_fidelity: A construção correlativa «ὅσῳ ... τοσούτῳ» está bem refletida por «quanto mais ... tanto mais», e «amam os filhos» transmite adequadamente o comparativo φιλοτεκνότεραι. Contudo, πολυγονώτεραι refere-se mais diretamente a ter/gerar muitos filhos; «prolíficas» conserva melhor essa noção do que «fecundas», que pode indicar apenas fertilidade.
  naturalness: A redação proposta é clara, idiomática e de registro adequado em português moderno. «Frágeis de espírito» preserva prudentemente a metáfora do grego sem a reduzir a covardia.
  terminology: «Prolíficas» é mais preciso neste contexto para πολυγονώτεραι. A nota deve apresentar «mais amantes dos filhos», e não «tanto mais amantes dos filhos», pois «tanto mais» decorre da construção correlativa, não do adjetivo isoladamente.
  issues:
  - severity: low
    issue: «Mais fecundas» pode sugerir capacidade de conceber, em vez de maior número de filhos.
    rationale: πολυγονώτεραι descreve comparativamente mães que têm ou geram mais filhos; «mais prolíficas» representa essa ideia de modo mais direto.
  - severity: low
    issue: A nota chama «tanto mais amantes dos filhos» de literal.
    rationale: O elemento «tanto mais» traduz τοσούτῳ da estrutura correlativa; φιλοτεκνότεραι, isoladamente, corresponde a «mais amantes dos filhos» ou «mais afetuosas para com os filhos».
  revised_text: Pois, quanto mais frágeis de espírito e mais prolíficas são as mães, tanto mais amam os filhos.[a]
