lexical_decisions:
- source_word: ὅσῳ ... τοσούτῳ
  choice: quanto mais ... tanto mais
  rationale: A construção correlativa portuguesa preserva com naturalidade a relação proporcional expressa pelo grego.
- source_word: ἀσθενέψυχοι
  choice: frágeis de espírito
  rationale: Mantém a imagem de fraqueza interior presente no composto grego sem restringi-la indevidamente a covardia ou instabilidade emocional.
- source_word: πολυγονώτεραι
  choice: mais fecundas
  rationale: Expressa o comparativo ligado à geração de muitos filhos em linguagem clara e digna; evita o sentido estritamente técnico que “prolíficas” pode assumir.
- source_word: ὑπάρχουσιν
  choice: são
  rationale: O verbo tem função copulativa neste contexto, e a forma simples é natural em português.
- source_word: αἱ μητέρες
  choice: as mães
  rationale: Correspondência direta e inequívoca.
- source_word: φιλοτεκνότεραι
  choice: tanto mais amam os filhos
  rationale: Comunica de modo idiomático o adjetivo comparativo “mais amantes dos filhos”, preservando tanto a ideia de amor quanto a força comparativa.
