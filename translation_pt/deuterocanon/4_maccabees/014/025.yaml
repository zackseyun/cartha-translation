  text: For the more mothers are weak in spirit and more prolific[a], the more they love their children.
translation:
  language: pt
  text: Pois, quanto mais frágeis de espírito e mais prolíficas são as mães, tanto mais amam os filhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “mais amantes dos filhos”; o grego emprega um adjetivo que significa “que ama os filhos”.
