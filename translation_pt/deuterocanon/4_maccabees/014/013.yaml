lexical_decisions:
- source_word: θεωρεῖτε
  choice: Vejam
  rationale: O imperativo plural convoca os ouvintes a observar e ponderar o exemplo; “Vejam” conserva de modo natural essa força exortativa.
- source_word: πολυπλόκος
  choice: complexa
  rationale: O adjetivo descreve algo entrelaçado ou composto de muitos aspectos. “Complexa” comunica esse sentido em português atual sem introduzir uma imagem excessivamente obscura.
- source_word: φιλοτεκνίας
  choice: pelos filhos
  rationale: O substantivo designa o amor ou afeição de alguém por seus próprios filhos. A formulação mantém o alcance parental geral do grego, embora o contexto imediato trate de uma mãe.
- source_word: στοργή
  choice: afeição
  rationale: στοργή indica o afeto natural próprio das relações familiares; “afeição”, especificada por “pelos filhos”, expressa essa nuance com clareza.
- source_word: ἕλκουσα
  choice: que atrai
  rationale: O particípio retrata a força exercida pela afeição parental. “Atrai” preserva a metáfora sem sugerir coerção violenta.
- source_word: πάντα
  choice: tudo
  rationale: O neutro plural tem sentido abrangente; “tudo” conserva essa amplitude e também a concisão do original.
- source_word: σπλάγχνων
  choice: que brota das entranhas
  rationale: O termo significa literalmente as partes internas do corpo e, figuradamente, a sede dos sentimentos profundos. A expressão conserva a imagem corporal de modo compreensível em português.
- source_word: συμπάθειαν
  choice: compaixão
  rationale: O substantivo expressa participação no sofrimento ou sentimento compartilhado. No contexto afetivo, “compaixão” é natural e mantém a intensidade emocional.
theological_decisions:
- issue: Alcance de φιλοτεκνία no contexto da mãe dos sete irmãos
  choice: afeição pelos filhos
  alternative: amor materno
  rationale: Embora o contexto imediato se concentre na mãe, o vocábulo grego é mais amplo e designa a afeição de alguém por seus filhos. A tradução evita restringir ao amor materno aquilo que o termo apresenta de forma geral.
- issue: Imagem antropológica de σπλάγχνα
  choice: compaixão que brota das entranhas
  alternative: profunda compaixão
  rationale: A tradução preserva a imagem antiga das entranhas como sede da emoção, sem convertê-la silenciosamente em “coração” nem eliminar sua concretude.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com imperativo plural natural. Conserva-se a metáfora das entranhas, esclarecida pela construção “que brota”, e evita-se limitar a afeição parental ao âmbito materno no texto principal.
