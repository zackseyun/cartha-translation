  text: But see how intricate the affection of love for children is[a], drawing everything toward the sympathy of the inward parts.
translation:
  language: pt
  text: Vejam, porém, como é complexa a afeição pelos filhos[a], que atrai tudo para a compaixão que brota das entranhas.
  philosophy: optimal-equivalence
  footnotes:
