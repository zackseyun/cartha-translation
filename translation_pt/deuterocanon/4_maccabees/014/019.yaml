  yaml_path: translation/deuterocanon/4_maccabees/014/019.yaml
  text: For even bees[a], around the time of making honeycomb, defend themselves against those who approach, and, as with iron, strike with their stinger those who come near their brood[c][b], and defend them to the death.
translation:
  language: pt
  text: Pois até as abelhas, na época de produzir cera e formar os favos[a], defendem-se dos que se aproximam e, como se usassem ferro, ferem com o ferrão[b] os que chegam perto de sua cria[c]; e defendem-se até a morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na época de produzir cera”. O grego se refere especificamente à produção de cera ou à formação dos favos, e não apenas à produção de mel em geral.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com o κέντρον”; neste contexto, o sentido natural é “ferrão”.
    reason: lexical_alternative
  - marker: c
    text: O grego diz “sua cria”, usando a imagem da proteção dos descendentes; a comparação é retórica, não uma descrição zoológica técnica.
    reason: cultural_note
lexical_decisions:
- source_word: ὅπου γε καὶ
  choice: Pois até
  rationale: Introduz com ênfase uma comparação que sustenta o argumento; a formulação é natural e mantém a força explicativa.
- source_word: περὶ τὸν τῆς κηρογονίας καιρὸν
  choice: na época de produzir cera e formar os favos
  rationale: κηρογονία designa especificamente a produção de cera ou a formação dos favos, não a produção de mel em sentido geral.
- source_word: ἐπαμύνονται
  choice: defendem-se / a defendem
  rationale: O verbo expressa resistência defensiva. Na primeira ocorrência, o sentido é reflexivo; na última, o contexto favorece como objeto a cria mencionada imediatamente antes.
- source_word: καθάπερ σιδήρῳ
  choice: como se usassem ferro
  rationale: Preserva a comparação com ferro e explicita de modo natural o valor instrumental do dativo.
- source_word: τῷ κέντρῳ
  choice: com o ferrão
  rationale: No contexto das abelhas, κέντρον é o órgão usado para ferroar; “ferrão” é o termo corrente em português.
- source_word: πλήσσουσι
  choice: ferem
  rationale: O verbo significa golpear ou atingir; “ferem” comunica com naturalidade o efeito do ferrão sem enfraquecer a imagem.
- source_word: τῇ νοσσίᾳ αὐτῶν
  choice: perto de sua cria
  rationale: νοσσιά pode indicar ninhada ou cria. “Cria” preserva a imagem de proteção da descendência sem empregar terminologia zoológica inadequada às abelhas.
- source_word: ἕως θανάτου
  choice: até a morte
  rationale: Reproduz diretamente o limite extremo da defesa expresso no grego.
