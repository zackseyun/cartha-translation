base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/029.yaml
  text: For they were righteous and self-controlled[a], brave and noble-minded and loving toward their brothers, and so devoted to their mother that, even to the point of death, they obeyed her by keeping the law.
translation:
  language: pt
  text: Pois eram justos e moderados, corajosos, nobres de espírito e amorosos para com os irmãos; e eram tão dedicados à mãe, a ponto de lhe obedecerem, observando os preceitos da Lei[a] até a morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “as leis ancestrais”, “as prescrições” ou “os costumes”. O grego emprega uma expressão no plural para as exigências legais e religiosas que eles estavam decididos a observar.
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοί
  choice: justos
  rationale: Em uma lista de virtudes, o termo descreve retidão moral; “justos” é natural em português e conserva sua dimensão ética e religiosa.
- source_word: σώφρονες
  choice: disciplinados
  rationale: O adjetivo indica moderação e domínio de si. “Disciplinados” expressa de modo corrente o autocontrole demonstrado por eles diante da morte.
- source_word: ἀνδρεῖοι
  choice: corajosos
  rationale: O sentido central é coragem. A escolha evita reproduzir uma conotação masculina desnecessária de modo mais explícito que o contexto.
- source_word: μεγαλόψυχοι
  choice: nobres de espírito
  rationale: O composto sugere grandeza de alma ou elevação moral. A expressão preserva esse tom elevado em linguagem compreensível.
- source_word: φιλάδελφοι
  choice: amorosos para com os irmãos
  rationale: O termo denota afeição fraterna; o contexto trata especificamente dos irmãos, por isso a referência masculina foi preservada.
- source_word: φιλόμητρος
  choice: dedicados à mãe
  rationale: O termo indica amor e forte apego à mãe. “Dedicados” também prepara naturalmente a obediência descrita na oração seguinte.
- source_word: οὕτως, ὥστε
  choice: tão ... que
  rationale: A construção correlativa expressa intensidade e resultado, reproduzidos de maneira idiomática em português.
- source_word: μέχρι θανάτου
  choice: até a morte
  rationale: A expressão assinala o limite extremo da fidelidade e mantém a força concisa do grego.
- source_word: τὰ νόμιμα
  choice: os preceitos da Lei
  rationale: O neutro plural designa as prescrições legais ou costumes religiosos judaicos. “Preceitos da Lei” preserva tanto a pluralidade quanto a referência à Lei nesse contexto de martírio.
- source_word: φυλάσσοντας
  choice: observando
  rationale: Em contexto jurídico-religioso, φυλάσσω significa cumprir ou observar; “observando” combina naturalmente com “preceitos”.
- source_word: πείθεσθαι αὐτῇ
  choice: lhe obedeceram
  rationale: Com dativo pessoal, πείθομαι pode significar obedecer. Esse sentido se ajusta à devoção filial destacada no contexto.
theological_decisions:
- issue: Sentido de τὰ νόμιμα no contexto do martírio judaico
  choice: os preceitos da Lei
  alternative: as leis ancestrais; as prescrições; os costumes estabelecidos
  rationale: A expressão aponta para as exigências religiosas que os irmãos se recusaram a transgredir. A tradução conserva o plural grego e explicita a associação contextual com a Lei, sem acrescentar uma qualificação denominacional.
- issue: Relação entre obediência à mãe e observância da Lei
  choice: lhe obedeceram, observando os preceitos da Lei
  alternative: foram persuadidos por ela a observar os preceitos da Lei
  rationale: O dativo pessoal favorece o sentido de obediência, enquanto o particípio descreve como essa obediência se manifestou. A redação não transforma a mãe em fonte da Lei, mas conserva sua atuação na fidelidade dos filhos.
- issue: Referência familiar de φιλάδελφοι
  choice: amorosos para com os irmãos
  alternative: amorosos para com os seus; cheios de amor fraternal
  rationale: O relato se refere a irmãos do sexo masculino, e a tradução específica preserva essa referência narrativa em vez de neutralizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração conserva o tom retórico da lista de virtudes; o ponto e vírgula separa essa lista de seu clímax, a obediência até a morte.
