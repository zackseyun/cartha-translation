  yaml_path: translation/deuterocanon/4_maccabees/014/023.yaml
  text: He loved piety more[b][a], the piety that saves unto eternal life according to God.
translation:
  language: pt
  text: Amou mais a piedade[a], a piedade que salva para a vida eterna segundo Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «devoção a Deus»; o termo grego também pode transmitir a ideia de reverência religiosa expressa na conduta.
    reason: lexical_alternative
  - marker: b
    text: «Segundo Deus» também pode significar «conforme a vontade de Deus» ou «no juízo de Deus».
    reason: alternative_reading
lexical_decisions:
- source_word: εὐσέβειαν
  choice: piedade
  rationale: Em contexto judaico-helenístico, o termo designa devoção reverente a Deus expressa numa conduta fiel. «Piedade» conserva sua dimensão religiosa e ética.
- source_word: μᾶλλον
  choice: mais
  rationale: O advérbio indica comparação ou preferência; «mais» mantém essa força sem explicitar um termo de comparação ausente no trecho.
- source_word: ἠγάπησεν
  choice: amou
  rationale: É o sentido direto de ἀγαπάω; a ideia de preferência já é expressa por μᾶλλον.
- source_word: τὴν σώζουσαν
  choice: aquela que salva
  rationale: O artigo com o particípio retoma «a piedade» e a caracteriza. «Aquela que salva» evita uma repetição pesada e preserva a construção atributiva.
- source_word: εἰς αἰώνιον ζωὴν
  choice: para a vida eterna
  rationale: εἰς expressa aqui meta ou resultado. «Para a vida eterna» é natural em português atual e mantém essa orientação.
- source_word: κατὰ θεόν
  choice: segundo Deus
  rationale: A expressão grega é condensada e pode indicar conformidade com a vontade ou o padrão de Deus, ou avaliação divina. A tradução formal preserva essa abertura interpretativa.
theological_decisions:
- issue: Sentido e ligação sintática de κατὰ θεόν
  choice: segundo Deus
  alternative: conforme a vontade de Deus; no juízo de Deus
  rationale: A expressão pode qualificar a ação salvadora, a vida eterna ou a natureza da piedade. A formulação concisa evita fixar uma relação sintática ou doutrinária mais específica do que o grego permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sujeito implícito como no grego. A repetição enfática do substantivo foi evitada por meio de «aquela», sem perda da relação atributiva. A expressão «segundo Deus» foi mantida deliberadamente concisa para preservar a ambiguidade do original.
