revisions:
- from: Mas, ainda que não pudessem impedir isso, voando ao redor deles por todos os lados, sofrendo em seu afeto e chamando-os com sua própria voz, ajudariam seus filhos da maneira que pudessem.[a]
  to: Mas, mesmo que não consigam impedi-lo, voando ao redor deles por todos os lados, sofrendo por causa de seu afeto e chamando-os com a própria voz, ajudam seus filhotes de toda maneira que podem.[a]
  rationale: A revisão conserva a imagem de voo, o afeto natural e o chamamento vocal, mas torna a frase idiomática em português e aproxima os tempos verbais do presente genérico do grego. «Filhotes» torna explícito, sem expansão doutrinária, o quadro de criaturas aladas e sua prole indicado pela construção grega e pela nota.
