  text: But even if they could not prevent it[a], flying around them on every side, grieving in their affection, and calling to them in their own voice, they would help their children in whatever way they could.
translation:
  language: pt
  text: Mas, mesmo que não consigam impedi-lo, voando ao redor deles por todos os lados, sofrendo por causa de seu afeto e chamando-os com a própria voz, ajudam seus filhotes de toda maneira que podem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A imagem grega é aviária: uma mãe voa ao redor de seus filhotes e os chama.'
    reason: cultural_note
lexical_decisions:
- source_word: κωλύειν
  choice: impedir
  rationale: Expressa de modo natural a ideia de deter ou evitar o dano, sem especificar além do grego.
- source_word: περιιπτάμενα κυκλόθεν αὐτῶν
  choice: voando ao redor deles por todos os lados
  rationale: Preserva tanto a imagem de aves em movimento em torno dos filhotes quanto a intensificação de κυκλόθεν.
- source_word: ἀλγοῦντα τῇ στοργῇ
  choice: sofrendo em seu afeto
  rationale: Mantém a dor indicada por ἀλγοῦντα e o afeto familiar natural de στοργή, sem inserir explicitamente 'materno', que vem do contexto.
- source_word: ἀνακαλούμενα τῇ ἰδίᾳ φωνῇ
  choice: chamando-os com sua própria voz
  rationale: Conserva a ação de chamar e a imagem da vocalização própria do animal, sem decidir entre simplesmente chamar e chamar de volta.
- source_word: καθʼ ὃν δύναται τρόπον
  choice: da maneira que pudessem
  rationale: Formulação portuguesa corrente que comunica auxílio por qualquer modo ao alcance delas.
- source_word: βοηθεῖ τοῖς τέκνοις
  choice: ajudariam seus filhos
  rationale: Verte diretamente a ideia de prestar auxílio à descendência e harmoniza o singular grego genérico com o sujeito plural inferido pelo contexto.
theological_decisions:
- issue: Imagem metafórica de aves-mães aplicada às mães humanas
  choice: Manter explicitamente a imagem de voar ao redor dos filhos.
  alternative: Generalizar como 'ficando ao redor deles' ou 'cercando-os'.
  rationale: O particípio περιιπτάμενα é claramente aviário; preservar essa imagem mantém a força retórica da comparação sem acrescentar doutrina.
- issue: Valor de στοργή
  choice: Traduzir como 'afeto', deixando o caráter materno ser fornecido pelo contexto.
  alternative: Traduzir como 'afeto materno'.
  rationale: στοργή denota afeto natural ou familiar, mas o adjetivo 'materno' não está expresso no substantivo; a versão conserva a precisão e a tensão contextual.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do grego sem perder naturalidade. O marcador foi colocado ao fim do versículo porque a nota esclarece a imagem aviária do conjunto da oração.
