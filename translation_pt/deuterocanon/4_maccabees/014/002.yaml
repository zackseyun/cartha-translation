lexical_decisions:
- source_word: βασιλέως
  choice: do rei
  rationale: O genitivo singular é possessivo e, no contexto, refere-se a um rei específico.
- source_word: λογισμοὶ
  choice: pensamentos
  rationale: O termo pode designar pensamentos, raciocínios ou deliberações; “pensamentos” é claro e natural sem excluir a ideia de reflexão.
- source_word: βασιλικώτεροι
  choice: mais régios
  rationale: Mantém o comparativo e conserva, em português, a ligação retórica entre “rei” e “régios”.
- source_word: ἐλευθερώτεροι
  choice: mais livres
  rationale: Reproduz diretamente o comparativo e preserva a possível nuance de liberdade ou independência.
