  yaml_path: translation/deuterocanon/4_maccabees/014/031.yaml
  text: But the mother urged each son individually[a], and all of them together[b], toward death for the sake of godliness.
translation:
  language: pt
  text: Mas a mãe exortava tanto cada filho individualmente[a] como todos juntos a seguir rumo à morte por causa da devoção a Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um por um”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “piedade”. O termo grego denota reverência devota e dedicação fiel a Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Mas
  rationale: Sinaliza a continuação com leve contraste ou ênfase, sem tornar a conexão discursiva mais forte do que o grego exige.
- source_word: καθʼ ἕνα παῖδα
  choice: cada filho individualmente
  rationale: καθʼ ἕνα tem sentido distributivo, “um por um”; παῖδα designa aqui cada um dos filhos homens da mãe no contexto narrativo.
- source_word: ὁμοῦ πάντας
  choice: todos juntos
  rationale: Preserva o sentido coletivo e o contraste deliberado com a exortação dirigida a cada filho individualmente.
- source_word: ἡ μήτηρ
  choice: a mãe
  rationale: Reproduz de modo natural o sintagma definido do grego, sem acrescentar o possessivo implícito no contexto.
- source_word: ἐπὶ τὸν ... θάνατον προέτρεπεν
  choice: exortava ... a seguir rumo à morte
  rationale: “Exortava” comunica a força de προέτρεπεν, enquanto “rumo à morte” preserva a orientação expressa por ἐπί com acusativo, evitando apresentar a morte como um ato diretamente causado pela mãe.
- source_word: τῆς εὐσεβείας
  choice: por causa da devoção a Deus
  rationale: εὐσέβεια indica reverência religiosa e dedicação fiel; “devoção a Deus” explicita de forma natural em português a orientação divina que o contexto pressupõe.
theological_decisions:
- issue: Sentido de εὐσέβεια no contexto de martírio
  choice: por causa da devoção a Deus
  alternative: por causa da piedade
  rationale: A expressão comunica reverência e fidelidade religiosas, não mera respeitabilidade moral. A nota conserva “piedade” como alternativa mais formal e lexicalmente tradicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção correlativa “tanto... como...” mantém a relação entre a exortação individual e a coletiva; “rumo à morte” conserva a imagem direcional e a tensão do original.
