  source_fidelity: A tradução transmite adequadamente as duas razões — a excelência moral dos filhos e sua obediência à Lei — e o afeto materno comparativamente maior. Contudo, “tornou-se” introduz uma mudança temporal que o grego ἔσχεν não exige; a formulação deve expressar que ela tinha/manifestava afeto maior, sem afirmar que ele passou a sê-lo.
  naturalness: O português é claro, moderno e de registro apropriado. “O afeto materno que tinha por eles era ainda maior” é igualmente natural e evita a inferência temporal indevida.
  terminology: “Nobreza de caráter” é uma boa solução para καλοκἀγαθία, preservando a dimensão de excelência moral e nobreza. “Obediência à lei” é fiel a εὐπείθεια e νόμος; a nota esclarece corretamente a referência à lei ancestral judaica. O marcador da nota lexical é deslocado para incidir diretamente sobre o termo explicado.
