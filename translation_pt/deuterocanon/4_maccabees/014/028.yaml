base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/028.yaml
  text: But not only that[a]; rather, because of the noble goodness of her sons and their obedience to the law[b], her motherly affection for them was even greater.
translation:
  language: pt
  text: 'Mas não foi só isso: por causa da nobreza de caráter[a] de seus filhos e da obediência deles à lei[b], o afeto materno que tinha por eles era ainda maior.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “virtude”. O termo grego reúne as ideias de bondade moral e nobreza.
    reason: lexical_alternative
  - marker: b
    text: Isto é, a lei ancestral judaica.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ μὴν δέ, ἀλλὰ καὶ
  choice: Mas não foi só isso
  rationale: 'Reproduz a transição enfática e aditiva do grego em português natural: além do ponto anterior, apresenta-se outra razão.'
- source_word: καλοκἀγαθίαν
  choice: nobreza de caráter
  rationale: Expressa conjuntamente a bondade moral e a nobreza associadas ao termo composto grego, sem o reduzir apenas a posição social.
- source_word: τῶν υἱῶν
  choice: de seus filhos
  rationale: O contexto identifica a mãe como referente do possessivo, e o substantivo grego designa especificamente seus filhos homens.
- source_word: εὐπείθειαν
  choice: obediência
  rationale: Comunica com clareza a disposição de acatar e obedecer, aqui dirigida à lei.
- source_word: νόμον
  choice: à lei
  rationale: Mantém a forma do grego; no contexto de 4 Macabeus, trata-se da lei ancestral judaica.
- source_word: μείζω
  choice: ainda maior
  rationale: Preserva o comparativo explícito e sua força intensificadora em relação ao que precede.
- source_word: φιλοστοργίαν
  choice: afeto materno
  rationale: O termo indica profundo afeto natural entre familiares; o contexto materno permite explicitar essa relação sem alterar seu sentido.
- source_word: ἐν αὐτοῖς ἔσχεν
  choice: que sentia por eles tornou-se
  rationale: Verte idiomaticamente a ideia de ter ou nutrir esse afeto por eles, enquanto a construção portuguesa com o comparativo comunica que ele se intensificou.
theological_decisions:
- issue: Referência de “a lei”
  choice: A lei ancestral judaica, isto é, a Torá
  alternative: Lei em sentido moral genérico
  rationale: Em 4 Macabeus, a fidelidade dos mártires é definida repetidamente por sua obediência à lei ancestral; portanto, a expressão não se refere apenas à moralidade em geral.
- issue: Termo familiar marcado por gênero
  choice: filhos
  alternative: crianças
  rationale: O grego emprega o masculino específico υἱῶν, e o contexto trata da mãe e de seus sete filhos homens.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A pontuação preserva a virada retórica do grego; “afeto materno” mantém a força emocional sem sentimentalismo excessivo.
