base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/030.yaml
  text: But even so[a], although so many impulses of motherly love were drawing the mother toward sympathy[b], the all-varied tortures were not able by any one of them to turn aside her reason.
translation:
  language: pt
  text: Mas, mesmo assim, embora tantos impulsos ligados ao amor pelos filhos[a] arrastassem a mãe à compaixão, as torturas de toda espécie não conseguiram, em nenhum deles[b], desviar-lhe a razão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “afeição materna”. O termo grego se refere especificamente ao amor de uma pessoa por seus filhos.
    reason: lexical_alternative
  - marker: b
    text: 'O referente do pronome não é explicitado na frase. A expressão tem sentido distributivo: as torturas não conseguiram desviar a razão da mãe em nenhum dos casos evocados pelo contexto.'
    reason: source_ambiguity
  - marker: c
    text: “Razão” também pode ser traduzido por “juízo racional” ou, de modo mais interpretativo, “determinação”. Em 4 Macabeus, o termo é usado repetidamente para a razão que governa as emoções.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  choice: Mas, mesmo assim
  rationale: Reproduz a forte transição adversativa e concessiva do grego em português atual e digno.
- source_word: καίπερ
  choice: embora
  rationale: Expressa de modo conciso o valor concessivo do particípio que se segue.
- source_word: τοσούτων ὄντων τῶν περὶ φιλοτεκνίαν
  choice: embora tantos impulsos ligados ao amor pelos filhos
  rationale: Conserva a ideia de numerosos fatores afetivos relacionados à φιλοτεκνία, sem restringi-los a argumentos ou reivindicações conscientes.
- source_word: φιλοτεκνίαν
  choice: amor pelos filhos
  rationale: Designa especificamente a afeição de uma pessoa por seus filhos; a formulação é clara e evita tornar o termo mais abstrato do que o grego.
- source_word: εἰς συμπάθειαν ἑλκόντων
  choice: arrastassem ... à compaixão
  rationale: Mantém a metáfora de uma poderosa atração emocional e traduz συμπάθεια como participação compassiva no sofrimento.
- source_word: τὴν μητέρα
  choice: a mãe
  rationale: Preserva o substantivo definido do texto grego, sem acrescentar um possessivo.
- source_word: ἐπʼ οὐδενὸς αὐτῶν
  choice: no caso de nenhum deles
  rationale: 'Mantém a referência pronominal e o sentido distributivo: em nenhum caso individual as torturas alcançaram seu efeito. A nota registra a ambiguidade do referente.'
- source_word: αἱ παντοίκιλοι βάσανοι
  choice: as torturas de toda espécie
  rationale: Transmite tanto a variedade intensificada por παντοίκιλοι quanto o sentido concreto de βάσανοι neste contexto.
- source_word: ἴσχυσαν μετατρέψαι
  choice: não conseguiram ... desviar
  rationale: Expressa a incapacidade das torturas de mudar o curso do juízo da mãe.
- source_word: τὸν λογισμὸν αὐτῆς
  choice: a razão dela
  rationale: Preserva λογισμός como termo central da argumentação filosófica de 4 Macabeus e evita reduzi-lo apenas a determinação ou força de vontade.
theological_decisions:
- issue: Sentido de λογισμός no contexto filosófico de 4 Macabeus
  choice: a razão dela
  alternative: sua determinação; seu juízo racional
  rationale: “Razão” mantém o contraste recorrente do livro entre o governo racional e as paixões, sem impor uma leitura denominacional ou reduzir o termo a mera resolução pessoal.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe próxima do movimento retórico do grego. “Amor pelos filhos” favorece compreensão internacional e brasileira; “torturas de toda espécie” evita o artificialismo de uma reprodução literal de παντοίκιλοι. As notas preservam as ambiguidades lexical e referencial sem sobrecarregar o versículo.
