lexical_decisions:
- source_word: ἱερὰς
  choice: sagradas
  rationale: Preserva o sentido religioso de algo santo ou ligado ao divino e mantém o registro elevado do grego.
- source_word: ἐναρμόστους
  choice: harmoniosas
  rationale: Expressa aquilo que está bem ajustado e em harmonia, conservando tanto a imagem de harmonia quanto a ideia de unidade.
- source_word: περὶ τῆς εὐσεβείας
  choice: quanto à devoção a Deus
  rationale: No contexto de 4 Macabeus, εὐσέβεια designa reverência fiel a Deus com implicações éticas. A formulação explicita esse referente e soa natural em português atual.
- source_word: τῶν ἑπτὰ ἀδελφῶν
  choice: dos sete irmãos
  rationale: Refere-se aos sete irmãos do sexo masculino na narrativa; a tradução é precisa e corrente.
- source_word: συμφωνίας
  choice: manifestações de concordância
  rationale: A forma grega é acusativo plural. Esta formulação preserva o plural e comunica naturalmente a concordância ou unidade dos irmãos, evitando o sentido de acordos negociados.
theological_decisions:
- issue: Sentido de εὐσέβεια no contexto do martírio
  choice: devoção a Deus
  alternative: piedade
  rationale: A expressão comunica reverência e fidelidade prática a Deus sem reduzir o termo a mera religiosidade exterior; “piedade” continua sendo uma alternativa tradicional possível.
translation_notes:
  register: Fragmento sintático mantido como no texto fornecido. Linguagem elevada, porém compreensível. O plural do grego foi preservado por meio de “manifestações de concordância”, em contraste com o singular da camada inglesa de consulta.
