base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/021.yaml
  text: O reason[b][a], tyrant over the passions of children! And godliness is to a mother more longed for than children.
translation:
  language: pt
  text: Ó razão, tirana das paixões dos filhos![a] E a devoção a Deus é, para uma mãe, mais desejada do que seus filhos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tirana das paixões pelos filhos”. O grego permite relacionar “dos filhos” estreitamente com “paixões”; no contexto, também pode indicar os afetos despertados pelos filhos.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “a piedade é, para uma mãe, mais desejada do que seus filhos”.'
    reason: alternative_reading
lexical_decisions:
- source_word: λογισμέ
  choice: razão
  rationale: O vocativo dirige-se à razão como força que governa as paixões, tema central de 4 Macabeus. “Razão” é conciso e preserva o caráter filosófico do termo.
- source_word: τέκνων
  choice: dos filhos / os próprios filhos
  rationale: τέκνα designa filhos ou crianças sem especificar sexo. Neste contexto familiar e materno, “filhos” é a forma mais natural em português; “próprios” explicita apenas a relação já indicada pelo contexto, sem alterar a comparação.
- source_word: παθῶν
  choice: paixões
  rationale: Em 4 Macabeus, πάθη são impulsos ou afetos sujeitos ao domínio da razão. “Paixões” conserva esse sentido filosófico e moral.
- source_word: τύραννε
  choice: tirana
  rationale: O vocativo metafórico apresenta a razão como governante absoluta das paixões. O feminino concorda naturalmente com “razão” e mantém a força da imagem grega.
- source_word: εὐσέβεια
  choice: devoção a Deus
  rationale: Aqui εὐσέβεια indica fidelidade reverente dirigida a Deus, não religiosidade genérica. A expressão comunica esse referente com clareza em português moderno.
- source_word: μητρί
  choice: para uma mãe
  rationale: O dativo expressa referência ou relação. “Para uma mãe” reproduz naturalmente essa função na construção comparativa.
- source_word: ποθεινοτέρα
  choice: mais desejável
  rationale: O comparativo exprime aquilo que é mais desejado ou ansiado. “Mais desejável” é natural em português e preserva a força comparativa.
theological_decisions:
- issue: Sentido de εὐσέβεια no contexto do martírio
  choice: devoção a Deus
  alternative: piedade
  rationale: “Devoção a Deus” deixa claro que se trata de fidelidade reverente a Deus, sem introduzir terminologia confessional posterior; “piedade” também é possível, mas pode ser entendida como mera compaixão no português atual.
- issue: Relação de τέκνων com παθῶν
  choice: paixões dos filhos
  alternative: paixões pelos filhos
  rationale: A tradução principal conserva de perto a ligação genitiva formal do grego. A alternativa é contextualmente plausível, pois o discurso trata do afeto materno pelos filhos; a nota preserva essa ambiguidade sem a resolver silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A exclamação e a personificação vigorosa da razão foram preservadas. As notas registram tanto a ambiguidade do genitivo quanto uma alternativa tradicional para εὐσέβεια.
