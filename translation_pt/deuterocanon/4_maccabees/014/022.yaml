  yaml_path: translation/deuterocanon/4_maccabees/014/022.yaml
  text: a mother[a], with two things set before her—godliness, and the temporary safety of her seven sons according to the tyrant’s promise[b];
translation:
  language: pt
  text: 'uma mãe, tendo diante de si duas coisas: a reverência a Deus[a] e a segurança temporária de seus sete filhos, segundo a promessa do tirano[b];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “piedade” ou “devoção a Deus”; o termo grego εὐσέβεια indica reverência e fidelidade para com Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “libertação temporária”; o grego se refere à preservação da vida por pouco tempo, conforme a promessa do tirano, não necessariamente à salvação em sentido teológico mais amplo.
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ
  choice: uma mãe
  rationale: O substantivo sem artigo funciona de modo apositivo ou resumitivo no fluxo da frase; o artigo indefinido produz uma formulação natural em português sem impor uma definitude ausente do grego.
- source_word: δυεῖν προκειμένων
  choice: tendo diante de si duas coisas
  rationale: A construção circunstancial indica que duas realidades ou alternativas estavam postas diante da mãe. A formulação conserva a imagem de πρόκειμαι sem tornar o português rígido.
- source_word: εὐσεβείας
  choice: a reverência a Deus
  rationale: Em 4 Macabeus, εὐσέβεια designa devoção fiel dirigida a Deus, e não religiosidade genérica. A tradução explicita essa orientação divina de maneira clara e digna.
- source_word: σωτηρίας προσκαίρου
  choice: a segurança temporária
  rationale: No contexto, σωτηρία se refere a poupar a vida dos filhos no presente, enquanto πρόσκαιρος ressalta o caráter breve e transitório dessa preservação; 'segurança temporária' evita sugerir necessariamente salvação em sentido teológico pleno.
- source_word: τῆς ἑπτὰ υἱῶν
  choice: de seus sete filhos
  rationale: O contexto estabelece que são os filhos da mãe. O possessivo é natural e necessário para a clareza em português, embora esteja implícito na construção grega.
- source_word: κατὰ τὴν τοῦ τυράννου ὑπόσχεσιν
  choice: segundo a promessa do tirano
  rationale: κατά com acusativo expressa conformidade ou fundamento, e ὑπόσχεσις é a promessa feita pelo tirano de poupar os filhos caso cedessem.
theological_decisions:
- issue: Tradução de εὐσέβεια no contexto do martírio
  choice: reverência a Deus
  alternative: piedade; devoção a Deus
  rationale: A expressão preserva a orientação da virtude para Deus e sua ligação com a fidelidade religiosa, sem depender de vocabulário eclesiástico potencialmente opaco.
- issue: Sentido de σωτηρία neste contexto
  choice: segurança temporária
  alternative: libertação temporária; salvação passageira
  rationale: O contraste diz respeito à preservação física imediata prometida pelo tirano, não necessariamente à salvação em sentido escatológico. A escolha mantém o sentido contextual sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A estrutura fragmentária e a pontuação final foram mantidas porque o versículo integra uma frase que prossegue no contexto. Os travessões destacam naturalmente as duas alternativas colocadas diante da mãe.
