  text: O most holy seven of harmonious brothers[a], for just as in the creation of the world the days are concerned with godliness[b],
translation:
  language: pt
  text: Ó santíssimo grupo de sete irmãos em harmonia! Pois, assim como na criação do mundo os dias dizem respeito à piedade[a],[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “devoção a Deus” (εὐσέβεια).
    reason: lexical_alternative
