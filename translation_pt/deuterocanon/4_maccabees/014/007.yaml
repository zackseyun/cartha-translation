lexical_decisions:
- source_word: πανάγιε
  choice: santíssimo
  rationale: O adjetivo no vocativo expressa santidade em grau intensivo; “santíssimo” preserva essa força em português natural e solene.
- source_word: συμφώνων
  choice: em harmonia
  rationale: Expressa a concórdia e a unidade de disposição entre os irmãos, conservando a imagem de consonância sem recorrer a uma formulação técnica.
- source_word: ἀδελφῶν
  choice: irmãos
  rationale: O plural grego é masculino e, no contexto narrativo, designa especificamente os sete irmãos.
- source_word: ἑβδομάς
  choice: grupo de sete
  rationale: O substantivo denota uma unidade ou conjunto formado por sete. A expressão explicita o sentido em português corrente, evitando o tecnicismo “héptade”.
- source_word: κοσμοποιίας
  choice: criação do mundo
  rationale: O composto grego se refere à formação do cosmos; esta expressão é clara e mantém a referência cosmológica.
- source_word: ἡμέραι
  choice: dias
  rationale: Equivalente direto e natural do substantivo grego.
- source_word: περὶ τὴν εὐσέβειαν
  choice: dizem respeito à devoção a Deus
  rationale: A construção é condensada. “Dizem respeito a” preserva sua relação sem especificá-la em excesso, e “devoção a Deus” comunica o caráter religioso e ético de εὐσέβεια com clareza contemporânea.
theological_decisions:
- issue: Tradução de εὐσέβεια
  choice: devoção a Deus
  alternative: piedade
  rationale: Em 4 Macabeus, εὐσέβεια é uma virtude central que reúne reverência a Deus e conduta fiel. “Devoção a Deus” torna explícito esse sentido para leitores modernos, enquanto “piedade” continua sendo uma alternativa legítima e mais concisa.
- issue: Comparação sintaticamente incompleta
  choice: manter a oração aberta com vírgula
  alternative: completar a comparação com conteúdo do versículo seguinte
  rationale: O grego fornecido termina no primeiro membro introduzido por καθάπερ (“assim como”). Manter a suspensão preserva a estrutura e evita importar palavras do versículo seguinte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A exclamação reproduz o vocativo elevado; a vírgula final preserva deliberadamente a comparação incompleta do texto grego.
