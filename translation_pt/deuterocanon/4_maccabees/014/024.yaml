    reason: lexical_alternative
  revision_rationale: A revisão elimina a especificação não presente em “delas”, vertendo τοῖς γεννηθεῖσιν por “os recém-nascidos”. Mantém-se a ambiguidade contextual do original, bem como a imagem incomum de impressão. A nota foi ajustada para uma alternativa portuguesa mais idiomática e coerente com a metáfora do selo.
