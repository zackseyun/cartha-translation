base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/024.yaml
  text: How can I describe the affection of parents for their children—the fervor that stamps into the small form of a child the marvelous likeness of soul and appearance[a], This is especially so because fathers make mothers more sympathetic toward those who have been born?
translation:
  language: pt
  text: Como poderei descrever o ardor dos pais que amam seus filhos, o qual imprime, na pequena figura da criança, a maravilhosa semelhança de alma e de forma?[a] Isso se dá sobretudo porque os pais tornam as mães mais compassivas para com os recém-nascidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o ardor dos pais que amam seus filhos, que grava na pequena marca infantil a maravilhosa semelhança de alma e de aparência”. O grego é retoricamente denso e emprega uma imagem rara de selar ou imprimir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα τρόπον ἠθολογήσῃμι
  choice: Como poderei descrever
  rationale: Expressa de modo natural a pergunta retórica e a dificuldade do orador em retratar esse afeto.
- source_word: φιλοτέκνα γονέων αἴθη
  choice: o ardor dos pais que amam seus filhos
  rationale: Preserva tanto o amor parental indicado por φιλοτέκνα quanto a intensidade calorosa de αἴθη.
- source_word: ψυχῆς τε καὶ μορφῆς ὁμοιότητα
  choice: a maravilhosa semelhança de alma e de forma
  rationale: Mantém a distinção entre a dimensão interior e a forma exterior, sem reduzir ψυχή a mero temperamento.
- source_word: εἰς μικρὸν παιδοχαρακτῆρα
  choice: na pequena figura da criança
  rationale: Oferece uma formulação compreensível para o raro composto παιδοχαρακτήρ e se integra à imagem de impressão ou selo.
- source_word: ἐναποσφραγίζοντα
  choice: imprime
  rationale: Conserva com naturalidade a metáfora de selar ou gravar características na criança.
- source_word: μάλιστα διὰ τὸ
  choice: Isso acontece sobretudo porque
  rationale: Torna explícita em português a ligação causal e enfática da oração grega.
- source_word: τῶν πατέρων
  choice: os pais
  rationale: Aqui πατέρες contrasta com μητέρας e significa especificamente os pais do sexo masculino.
- source_word: τοῖς γεννηθεῖσιν
  choice: os filhos que delas nasceram
  rationale: Identifica o referente implícito do particípio e mantém a relação dos recém-nascidos com as mães.
- source_word: συμπαθεστέρας
  choice: mais compassivas para com
  rationale: Preserva o comparativo e o sentido de profunda solidariedade afetiva, sem especificar além do grego a natureza dessa intensificação.
