  yaml_path: translation/deuterocanon/4_maccabees/014/014.yaml
  text: For even the irrational animals have toward the offspring born from them a sympathy and affection like that of human beings[a][b].
translation:
  language: pt
  text: Pois até os animais irracionais têm pelos seus próprios filhotes[a] simpatia e afeição semelhantes às dos seres humanos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “pelas coisas geradas a partir deles”, isto é, pela sua própria prole.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “semelhantes às que os seres humanos têm”.'
    reason: clarification
lexical_decisions:
- source_word: ὅπου γε καὶ
  choice: Pois até
  rationale: No contexto, a expressão introduz uma razão de apoio com força enfática, não uma indicação estritamente locativa.
- source_word: τὰ ἄλογα ζῷα
  choice: os animais irracionais
  rationale: Preserva o contraste grego entre os animais, considerados sem capacidade racional, e os seres humanos.
- source_word: τὴν πρὸς τὰ ἐξ αὐτῶν γεννώμενα
  choice: pelos seus próprios filhotes
  rationale: Expressa com naturalidade que se trata da prole gerada pelos próprios animais; a nota registra a formulação mais literal.
- source_word: συνπίθειαν
  choice: compaixão
  rationale: Comunica a ideia de sensibilidade e solidariedade afetiva para com a prole, distinguindo-a da afeição familiar indicada pelo termo seguinte.
- source_word: στοργὴν
  choice: afeição
  rationale: Denota a afeição natural ou familiar, especialmente apropriada à relação entre progenitores e sua prole.
- source_word: ὁμοίαν ... τοῖς ἀνθρώποις
  choice: semelhantes às dos seres humanos
  rationale: 'Torna explícita e idiomática a comparação: a compaixão e a afeição dos animais são semelhantes às encontradas nos seres humanos.'
