  yaml_path: translation/deuterocanon/4_maccabees/014/010.yaml
  text: What could be more painful than these things? For the power of fire[a], being sharp and brief, quickly destroyed the bodies.
translation:
  language: pt
  text: Que poderia ser mais doloroso do que tudo isso? Pois a força do fogo, aguda e breve, desfez rapidamente os corpos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “destruiu os corpos”. O verbo grego pode significar “desfazer”, “desagregar”, “dissolver” ou “destruir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν τί γένοιτο ἐπαλγέστερον;
  choice: Que poderia ser mais doloroso do que tudo isso?
  rationale: Mantém a pergunta retórica e o sentido comparativo de ἐπαλγέστερον. “Tudo isso” retoma com naturalidade, em português, o antecedente plural de ὧν.
- source_word: ὀξεῖα
  choice: intensa
  rationale: Embora o sentido básico seja “aguda” ou “cortante”, “intensa” comunica naturalmente a ação penetrante do fogo sem produzir uma combinação pouco idiomática como “força aguda”.
- source_word: σύντομος
  choice: breve
  rationale: Preserva o valor temporal de algo curto ou de pouca duração, sem confundi-lo com ταχέως, que expressa a rapidez do resultado.
- source_word: ἡ τοῦ πυρὸς οὖσα δύναμις
  choice: a força do fogo
  rationale: Reproduz de modo claro e digno a ideia do poder ou força operante do fogo.
- source_word: ταχέως διέλυσε τὰ σώματα
  choice: rapidamente desfez os corpos
  rationale: “Desfez” conserva a imagem de διέλυσε, que pode indicar desagregar, dissolver ou destruir, enquanto “rapidamente” traduz diretamente ταχέως.
