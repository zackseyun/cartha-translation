lexical_decisions:
- source_word: οὐδεὶς ἐκ τῶν ἑπτὰ μειρακίων
  choice: Nenhum dos sete jovens
  rationale: A construção partitiva indica que nem sequer um dos sete agiu assim. “Jovens” transmite μειρακίων de modo natural, sem sugerir crianças.
- source_word: ἐδειλίασεν
  choice: se acovardou
  rationale: Preserva a nuance moral de δειλιάω — mostrar covardia ou perder a coragem — e é idiomático em português.
- source_word: οὐδὲ
  choice: nem
  rationale: Liga naturalmente as duas orações negativas e mantém sua força cumulativa.
- source_word: πρὸς τὸν θάνατον
  choice: diante da morte
  rationale: No contexto de ὀκνέω, exprime a reação perante a morte; esta formulação é natural em português e evita uma reprodução mecânica da preposição grega.
- source_word: ὤκνησεν
  choice: recuou
  rationale: ὀκνέω pode indicar hesitar, retrair-se ou recuar. “Recuou” comunica com clareza que nenhum deles se esquivou da morte.
theological_decisions:
- issue: Referência distributiva aos sete jovens
  choice: 'Manter o singular em ambas as orações: “Nenhum ... se acovardou, nem recuou”'
  alternative: 'Empregar o plural na segunda oração: “nem recuaram diante da morte”'
  rationale: No grego, οὐδεὶς é o sujeito singular distributivo e ambos os verbos estão no singular. O português reproduz essa construção com naturalidade, destacando que nem um só dos sete recuou.
translation_notes:
  register: Português atual, digno e acessível, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A formulação concisa conserva a ênfase distributiva e o paralelismo negativo do grego.
