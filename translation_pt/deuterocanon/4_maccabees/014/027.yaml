base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/027.yaml
  text: and[a], though she was compelled to feel sympathy for them because of the many pains each one of them suffered[b], because of fear toward God she overlooked the temporary preservation of her children.
translation:
  language: pt
  text: e, embora as muitas dores sofridas por cada um deles a obrigassem a se compadecer deles, por temor a Deus[b] ela não levou em conta a preservação temporária de seus filhos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a segurança temporária de seus filhos” ou “o livramento momentâneo de seus filhos”. O grego se refere ao resgate imediato ou à sobrevivência física, não necessariamente à salvação em sentido teológico.
    reason: lexical_alternative
  - marker: b
    text: “Temor a Deus” também pode ser entendido como reverência ou profundo respeito por Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠδῖνας
  choice: dores
  rationale: O termo designa dores intensas ou agonias; no contexto do martírio, “dores” comunica de modo natural os sofrimentos físicos de cada filho sem introduzir necessariamente a imagem específica das dores de parto.
- source_word: συμπάθειαν
  choice: se compadecer
  rationale: O substantivo expressa participação afetiva no sofrimento alheio. A locução verbal é corrente em português e preserva a compaixão inevitável da mãe pelos filhos.
- source_word: καθʼ ἕκαστον αὐτῶν
  choice: por cada um deles
  rationale: Mantém a força distributiva da expressão grega, individualizando o sofrimento de cada filho.
- source_word: ἠναγκασμένην ... ἔχειν
  choice: a obrigassem a se compadecer
  rationale: A construção indica que os sofrimentos dos filhos tornavam incontornável a compaixão materna. A reformulação ativa é natural em português e preserva essa força.
- source_word: φόβον
  choice: temor
  rationale: “Temor” conserva o peso de φόβος e, quando dirigido a Deus, pode abranger medo reverente sem reduzir o sentido apenas a “reverência”.
- source_word: ὑπερείδειν
  choice: não levou em conta
  rationale: O verbo indica passar por cima, desconsiderar ou não dar prioridade a algo. Esta formulação evita sugerir falta de amor e mostra que a mãe subordinou a sobrevivência imediata dos filhos à fidelidade a Deus.
- source_word: πρόσκαιρον σωτηρίαν
  choice: preservação temporária
  rationale: No contexto, σωτηρία aponta para resgate, preservação ou sobrevivência física diante da tortura. “Preservação temporária” mantém o contraste temporal e evita impor ao termo um sentido técnico de salvação espiritual.
theological_decisions:
- issue: Sentido de σωτηρία no contexto do martírio
  choice: preservação física e temporária
  alternative: salvação espiritual; segurança temporária; livramento momentâneo
  rationale: O contexto imediato trata da possibilidade de os filhos escaparem da tortura e continuarem vivos. A tradução evita transformar a expressão numa afirmação soteriológica que o versículo não exige.
- issue: Força de φόβος dirigido a Deus
  choice: temor a Deus
  alternative: medo de Deus; reverência a Deus
  rationale: “Temor” mantém tanto a formulação explícita do grego quanto sua possível dimensão reverente, preservando a tensão entre a compaixão materna e a lealdade a Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura concessiva foi reorganizada para maior naturalidade, sem eliminar o contraste do grego entre a compaixão inevitável da mãe e sua fidelidade a Deus. Os marcadores foram colocados junto às expressões que suas respectivas notas explicam.
