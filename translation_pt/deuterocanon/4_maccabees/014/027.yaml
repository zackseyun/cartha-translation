  source_fidelity: 'A tradução preserva adequadamente a estrutura concessiva e causal do grego: a compaixão inevitável da mãe diante dos sofrimentos individuais dos filhos é contrastada com o fato de ela colocar a sobrevivência temporária deles em segundo plano por temor a Deus. “Dores”, “se compadecer”, “temor a Deus”, “não levou em conta” e “preservação temporária” são escolhas defensáveis para ὠδῖνας, συμπάθεια, φόβος, ὑπερείδειν e πρόσκαιρος σωτηρία.'
