  text: Moreover[a], by urging them on to torture, they sought that they should not only despise the pains, but also master the emotions of brotherly affection for their brothers.
translation:
  language: pt
  text: Além disso, ao incitá-los à tortura, pretendiam que eles não apenas desprezassem as dores, mas também dominassem as emoções[a] de sua afeição pelos irmãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as paixões de sua afeição pelos irmãos”. O grego πάθη pode significar “paixões” ou “emoções”; a expressão ressalta que, sob tortura, eles precisavam dominar até mesmo os intensos impulsos ligados à afeição familiar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέτι
  choice: Além disso
  rationale: Introduz mais um ponto na progressão do argumento, em português natural e digno.
- source_word: ἐπὶ τὸν αἰκισμόν
  choice: à tortura
  rationale: No contexto do martírio, exprime maus-tratos físicos cruéis; “tortura” comunica adequadamente sua gravidade.
- source_word: ἐποτρύνοντες
  choice: ao incitá-los
  rationale: Preserva a ideia de impelir ativamente alguém e o valor circunstancial do particípio.
- source_word: ὡς μὴ μόνον ... ἀλλὰ καί
  choice: pretendiam que ... não apenas ... mas também
  rationale: Torna clara a ideia de propósito ou resultado pretendido sem resolver além do necessário a nuance de ὡς.
- source_word: τῶν ἀλγηδόνων
  choice: as dores
  rationale: Designa diretamente as dores sofridas durante a tortura, sem ampliar o sentido para todo tipo de sofrimento.
- source_word: περιφρονῆσαι
  choice: desprezassem
  rationale: Conserva a força de considerar as dores indignas de atenção ou importância.
- source_word: τῆς τῶν ἀδελφῶν φιλαδελφίας
  choice: do amor fraternal por seus irmãos
  rationale: Mantém a ênfase familiar explícita do grego, inclusive sua repetição semântica deliberada.
- source_word: παθῶν
  choice: as emoções
  rationale: É acessível ao leitor moderno e preserva a referência a impulsos afetivos sujeitos ao domínio, sem impor terminologia filosófica excessivamente técnica.
- source_word: κρατῆσαι
  choice: dominassem
  rationale: Expressa alcançar controle sobre algo e corresponde ao tema do livro de domínio das paixões ou emoções.
theological_decisions:
- issue: Sentido de πάθη no quadro filosófico-moral de 4 Macabeus
  choice: as emoções
  alternative: as paixões
  rationale: “Emoções” comunica de modo claro o aspecto afetivo, enquanto a nota preserva “paixões” como alternativa legítima e a relação com o tema do autocontrole.
- issue: Relação entre domínio racional e amor familiar
  choice: dominar as emoções do amor fraternal
  alternative: superar o amor por seus irmãos
  rationale: “Dominar” evita sugerir que o amor familiar seja abolido ou considerado mau; o texto fala do controle de seus impulsos sob tortura.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com legibilidade brasileira. A construção conserva a repetição familiar do grego e sua tensão entre afeição fraternal e domínio das emoções.
