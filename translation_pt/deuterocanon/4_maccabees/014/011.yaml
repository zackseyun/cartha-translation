base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/011.yaml
  text: And do not consider it remarkable if reason gained the mastery over those men in their torments[b][a], since even a woman's mind looked down on more severe pains.
translation:
  language: pt
  text: E não considerem surpreendente que a razão tenha prevalecido sobre aqueles homens em meio às torturas,[a] visto que até a mente de uma mulher desprezou dores mais variadas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tenha dominado aqueles homens em seus tormentos”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “dores de formas ainda mais diversas” ou “sofrimentos mais múltiplos”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θαυμαστόν
  choice: surpreendente
  rationale: Expressa aquilo que causa admiração ou espanto e soa natural com ἡγεῖσθε em uma exortação moderna.
- source_word: ἡγεῖσθε
  choice: considerem
  rationale: Com o predicativo θαυμαστόν, significa julgar ou considerar algo de determinada maneira.
- source_word: λογισμός
  choice: razão
  rationale: Preserva o termo filosófico central de 4 Macabeus, sem acrescentar uma qualificação teológica ausente neste versículo.
- source_word: περιεκράτησεν
  choice: tenha prevalecido sobre
  rationale: Comunica domínio decisivo, mantendo a possibilidade de entender que a razão venceu ou dominou aqueles homens durante a provação.
- source_word: βασάνοις
  choice: torturas
  rationale: No contexto do martírio, refere-se a sofrimentos deliberadamente infligidos; 'torturas' é direto e historicamente adequado.
- source_word: ὅπου γε καί
  choice: visto que até
  rationale: Reproduz a força explicativa e intensificadora da expressão grega em português corrente.
- source_word: νοῦς
  choice: mente
  rationale: Designa a faculdade de pensar e a disposição interior, em contraste com as dores físicas.
- source_word: πολυτροπωτέρων
  choice: mais variadas
  rationale: O comparativo indica dores de formas mais múltiplas ou diversas; evita convertê-lo sem necessidade em mera intensidade.
- source_word: ὑπερεφρόνησεν
  choice: desprezou
  rationale: O verbo indica considerar algo inferior ou elevar-se acima disso; 'desprezou' preserva sua força sem paráfrase extensa.
- source_word: ἀλγηδόνων
  choice: dores
  rationale: É o equivalente direto e natural para sofrimentos dolorosos.
theological_decisions:
- issue: Tradução do termo filosófico λογισμός no contexto do martírio
  choice: razão
  alternative: juízo racional
  rationale: '''Razão'' mantém o vocabulário filosófico recorrente da obra e a afirmação de seu domínio, sem importar terminologia doutrinária posterior.'
- issue: Contraste de gênero entre τῶν ἀνδρῶν e γυναικός
  choice: aqueles homens ... a mente de uma mulher
  alternative: aquelas pessoas ... sua mente
  rationale: O grego marca expressamente o contraste entre os homens e uma mulher; a tradução o conserva sem neutralização.
- issue: Objeto do domínio expresso por περιεκράτησεν
  choice: prevaleceu sobre aqueles homens em meio às torturas
  alternative: dominou as torturas sofridas por aqueles homens
  rationale: A sintaxe grega liga diretamente o verbo a 'aqueles homens' e situa o domínio 'nas torturas'; a tradução mantém essa construção e sua tensão antropológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva o contraste retórico entre os homens e a mulher e mantém os termos filosóficos de modo conciso. Os marcadores aparecem na ordem textual [a], [b].
