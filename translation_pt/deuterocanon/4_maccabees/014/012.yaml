  text: For the mother of the seven young men endured the tortures of each one of her children[a].
translation:
  language: pt
  text: Pois a mãe dos sete jovens suportou as torturas de cada um de seus filhos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais especificamente, “os suplícios no cavalete sofridos por cada um de seus filhos”, pois o termo grego pode indicar tortura praticada no cavalete.
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ
  choice: mãe
  rationale: Equivalente direto e natural, preservando o vínculo familiar central ao impacto do versículo.
- source_word: τῶν ἐπτὰ νεανίσκων
  choice: dos sete jovens
  rationale: νεανίσκων designa jovens do sexo masculino; em português, “jovens” é claro no contexto e evita antecipar “filhos”, expresso depois por τέκνων.
- source_word: ὑπήνεγκεν
  choice: suportou
  rationale: Expressa o ato de aguentar firmemente o sofrimento, em linguagem corrente e digna.
- source_word: στρέβλας
  choice: torturas
  rationale: O termo pode indicar especificamente suplícios no cavalete, mas também admite o sentido mais geral de torturas; a opção ampla preserva essa margem sem impor um instrumento específico.
- source_word: τὰς ἐφʼ ἑνὶ ἑκάστῳ τῶν τέκνων
  choice: as torturas de cada um de seus filhos
  rationale: Mantém a força distributiva de ἑνὶ ἑκάστῳ e a relação materna de τέκνων, sem acrescentar explicitamente um verbo como “infligidas”.
