base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/032.yaml
  text: O sacred nature[a], and parents’ affections, and filial love toward parents, and nurture[b], and mothers’ unconquerable passions.
translation:
  language: pt
  text: Ó natureza sagrada, ó afeto dos pais[a], ó amor filial pelos pais, ó sustento e criação[b], ó sentimentos indomáveis das mães[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “laços afetuosos dos pais”. A palavra grega pode designar literalmente encantos ou filtros de amor, mas aqui se refere mais naturalmente ao afeto familiar.
    reason: lexical_alternative
  - marker: b
    text: Ou “criação” ou “cuidado recebido na infância”. O termo grego pode abranger tanto o sustento quanto a formação dos filhos.
    reason: lexical_alternative
  - marker: c
    text: Ou “paixões indomáveis das mães”; também é possível entender “sofrimentos invencíveis das mães”, embora isso seja menos provável no contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: φύσις ἱερά
  choice: natureza sagrada
  rationale: Preserva a amplitude de φύσις, que pode indicar a natureza ou a ordem natural, e mantém o tom elevado da invocação sem explicitar além do grego a ideia de vínculo familiar.
- source_word: φίλτρα γονέων
  choice: afeto dos pais
  rationale: φίλτρα pode designar literalmente encantos ou filtros de amor, mas neste contexto aponta com mais naturalidade para o afeto e os laços emocionais dos pais.
- source_word: γονεύσιν φιλοστόργε
  choice: amor filial pelos pais
  rationale: A construção exprime afeição familiar terna dirigida aos pais, indicados pelo dativo γονεύσιν. A formulação nominal em português acompanha a sequência retórica de invocações.
- source_word: τροφεῖα
  choice: sustento e criação
  rationale: O termo abrange a alimentação, o cuidado e a formação envolvidos em criar os filhos. A expressão dupla comunica essa amplitude em português corrente.
- source_word: μητέρων ἀδάμαστα πάθη
  choice: sentimentos indomáveis das mães
  rationale: πάθη pode significar paixões, emoções ou sofrimentos. O contexto favorece a força irresistível da afeição materna; “sentimentos” evita o sentido moderno potencialmente pejorativo de “paixões”, enquanto “indomáveis” reproduz ἀδάμαστα.
theological_decisions:
- issue: Como representar a linguagem emocional sobre os vínculos familiares sem introduzir doutrina posterior
  choice: Apresentar o versículo como uma invocação retórica da natureza, do afeto familiar e da força dos sentimentos maternos
  alternative: Entender πάθη especificamente como “sofrimentos” das mães
  rationale: O contexto ressalta a força e a sacralidade dos vínculos familiares, sem formular uma afirmação doutrinária. A tradução mantém a ambiguidade lexical relevante em nota e não moraliza o termo πάθη.
translation_notes:
  register: Português moderno, claro e solene, com repetição de “ó” para conservar o caráter exclamativo e intensamente retórico do grego. “Amor filial” é corrente em registro digno e esclarece a direção da afeição sem tornar a frase excessivamente explicativa.
