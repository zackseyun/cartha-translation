  text: Now we[a], hearing of the affliction of those young men, shudder; but they, not only seeing it, and not only hearing the immediate word of threat, but also suffering it,
translation:
  language: pt
  text: Agora nós, ao ouvirmos falar da aflição daqueles jovens, estremecemos; eles, porém, não apenas a viram, nem apenas ouviram a ameaça proferida naquele momento[a], mas também a sofreram,
