lexical_decisions:
- source_word: θλῖψιν
  choice: aflição
  rationale: Expressa a provação angustiante e severa sofrida pelos jovens, mantendo a amplitude do termo grego sem lhe impor um sentido teológico técnico.
- source_word: νεανιῶν
  choice: jovens
  rationale: Identifica de modo natural e atual os jovens do sexo masculino mencionados no contexto; em português, o masculino plural preserva adequadamente essa referência.
- source_word: φρίττομεν
  choice: estremecemos
  rationale: Comunica a reação física e emocional de horror indicada pelo verbo grego, em linguagem clara e digna.
- source_word: ὁρῶντες
  choice: viram
  rationale: Preserva o contraste entre ver, ouvir e sofrer. A forma finita torna a longa sequência mais natural em português sem alterar sua progressão retórica.
- source_word: παραχρῆμα
  choice: proferida naquele momento
  rationale: 'Explicita a força temporal do advérbio: a ameaça foi pronunciada ali, no próprio momento da provação.'
- source_word: ἀπειλῆς λόγον
  choice: a ameaça
  rationale: Reproduz em português corrente o sentido de uma fala ameaçadora. A formulação mais literal é preservada em nota.
- source_word: πάσχοντες
  choice: a sofreram
  rationale: 'Marca o clímax da sequência: os jovens não apenas perceberam a aflição, mas passaram pessoalmente por ela.'
