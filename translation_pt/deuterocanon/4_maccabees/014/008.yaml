  text: Thus the young men[a], dancing around the seven, encircled them, abolishing the fear of tortures.
translation:
  language: pt
  text: Assim, os jovens, dançando em torno do grupo de sete[a], rodeavam-no, desfazendo o medo das torturas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido como “grupo de sete” significa literalmente um conjunto de sete, ou “héptade”; aqui se refere aos sete irmãos, não a uma semana.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Assim
  rationale: Introduz de modo conciso a maneira ou o resultado da descrição anterior.
- source_word: περὶ τὴν ἑβδομάδα
  choice: em torno do grupo de sete
  rationale: Ἑβδομάς designa aqui um conjunto de sete — no contexto, os sete irmãos — e não uma semana. A formulação explicita o sentido coletivo sem perder a imagem espacial.
- source_word: χορεύοντες
  choice: dançando
  rationale: Preserva a imagem de uma dança, provavelmente circular, enquanto o verbo seguinte expressa de maneira explícita o movimento em círculo.
- source_word: οἱ μεῖρακες
  choice: os jovens
  rationale: Designa pessoas jovens do sexo masculino; “os jovens” é natural, digno e adequado ao contexto.
- source_word: ἐκύκλουν
  choice: giravam em círculo
  rationale: O imperfeito descreve movimento contínuo ou repetido. A expressão conserva a ideia de circularidade e a sequência distinta dos dois verbos gregos.
- source_word: τὸν βασάνων φόβον
  choice: o medo das torturas
  rationale: Βάσανοι se refere aqui a torturas infligidas, e a construção portuguesa mantém a relação genitiva do grego.
- source_word: καταλύοντες
  choice: desfazendo
  rationale: Comunica o ato de desmantelar ou reduzir a nada o medo, sem exigir a ideia institucional sugerida por “abolindo” em português.
theological_decisions:
- issue: Sentido de ἑβδομάδα
  choice: referência coletiva ao grupo dos sete irmãos
  alternative: uma semana
  rationale: O contexto do martírio favorece claramente um conjunto de sete pessoas, não um período do calendário; a nota preserva a particularidade lexical do grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção mantém a sobreposição imagética entre dançar e girar em círculo presente no grego, sem eliminar a tensão da cena.
