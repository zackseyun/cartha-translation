  yaml_path: translation/deuterocanon/4_maccabees/014/016.yaml
  text: But in the peaks of mountains and the clefts of ravines and the hollows of trees and their tops[a], making nests, it gives birth and keeps away the one who approaches.
translation:
  language: pt
  text: Mas, nos picos das montanhas, nas fendas dos desfiladeiros, nas cavidades das árvores e nas partes mais altas deles[a], faz o ninho, dá à luz e mantém afastado quem se aproxima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “e nas extremidades deles”. A expressão também pode referir-se às partes altas; o antecedente de “deles” não é inteiramente claro.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ δὲ κατὰ τὰς κορυφὰς ὀρέων
  choice: Mas, nos picos das montanhas
  rationale: O uso de κατά com acusativo tem sentido locativo ou distributivo; “nos picos” transmite com naturalidade o lugar elevado em que o animal se instala.
- source_word: φαράγγων ἀπορρῶγας
  choice: nas fendas dos desfiladeiros
  rationale: ἀπορρώξ designa fenda, ruptura ou penhasco escarpado; “fendas” conserva a imagem do terreno acidentado sem tornar a frase excessivamente técnica.
- source_word: δένδρων ὀπὰς
  choice: nas cavidades das árvores
  rationale: ὀπή pode indicar abertura, buraco ou cavidade; no contexto de nidificação, “cavidades” é claro e natural.
- source_word: τὰς τούτων ἄκρας
  choice: nas extremidades desses lugares
  rationale: A expressão significa literalmente “as extremidades/partes mais altas destes”. Como o referente exato de τούτων não é inteiramente seguro, a tradução mantém a referência ampla em vez de a restringir às copas das árvores.
- source_word: νοσσοποιούμενα
  choice: faz o ninho
  rationale: O particípio descreve a ação de preparar ou fazer um ninho. O singular foi mantido de acordo com os verbos finitos e com a referência genérica do contexto.
- source_word: ἀποτίκτει
  choice: dá à luz
  rationale: O verbo significa parir ou produzir descendência; “dá à luz” é direto, atual e preserva a imagem reprodutiva.
- source_word: τὸν προσιόντα
  choice: quem se aproxima
  rationale: O particípio substantivado singular tem valor genérico; “quem se aproxima” conserva esse valor sem introduzir plural.
- source_word: κωλύει
  choice: mantém afastado
  rationale: No contexto de proteção do ninho e da cria, a expressão comunica de modo natural a ação de impedir ou deter a aproximação.
