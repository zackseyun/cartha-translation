  yaml_path: translation/deuterocanon/4_maccabees/014/026.yaml
  text: But of all mothers[a], the mother of the seven became the most devoted to her children, she who, through seven pregnancies, had her affection for them deeply planted within her;
translation:
  language: pt
  text: Mas, entre todas as mães[a], a mãe dos sete tornou-se a mais dedicada aos filhos, ela que, ao longo de sete gestações, tinha profundamente implantado em si o afeto por eles;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mais amorosa para com os filhos”. A forma grega é comparativa, mas, no contexto de “todas as mães”, indica que ela se destacava entre todas por seu amor aos filhos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πασῶν δὲ τῶν μητέρων
  choice: Mas, entre todas as mães
  rationale: O genitivo partitivo é expresso naturalmente por “entre todas as mães”. δέ marca uma transição com leve contraste, aqui representada por “Mas”.
- source_word: ἐγένετο
  choice: tornou-se
  rationale: Preserva o sentido verbal de vir a ser, em vez de reduzi-lo a uma simples cópula.
- source_word: ἡ τῶν ἑπτὰ μήτηρ
  choice: a mãe dos sete
  rationale: Mantém a formulação concisa do grego, que não repete explicitamente “filhos” neste sintagma.
- source_word: φιλοτεκνοτέρα
  choice: a mais dedicada aos filhos
  rationale: Embora a forma grega seja comparativa, a comparação com todas as mães lhe confere sentido superlativo no contexto. “Dedicada aos filhos” comunica forte amor e apego maternos em português corrente.
- source_word: ἥτις
  choice: ela que
  rationale: Conserva o valor explicativo e qualitativo do pronome, introduzindo a razão de sua dedicação excepcional.
- source_word: ἑπτὰ κυοφορίας
  choice: ao longo de sete gestações
  rationale: “Gestações” traduz com precisão κυοφορίας, enquanto “ao longo de” expressa o desenvolvimento temporal e corporal sugerido pelo contexto.
- source_word: τὴν πρὸς αὐτοὺς ... φιλοστοργίαν
  choice: o afeto por eles
  rationale: φιλοστοργία designa afeto familiar terno. “Afeto” preserva esse sentido sem acrescentar uma qualificação não explícita.
- source_word: ἐπιφυτευομένην
  choice: teve implantado em si
  rationale: Preserva a metáfora de algo plantado ou incutido interiormente e produz uma construção compreensível diante da sintaxe condensada do grego.
