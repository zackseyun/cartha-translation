  text: For even among birds[a], some, making their nests on houses, protect their young.
translation:
  language: pt
  text: Pois até entre as aves, as aves domesticadas, fazendo ninhos nos telhados das casas[a], protegem seus filhotes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fazendo ninhos nas casas”.'
    reason: A expressão grega pode ser entendida de modo menos específico como nidificação em associação com as casas; o composto relacionado a “telhado” favorece “nos telhados das casas” no texto principal.
lexical_decisions:
- source_word: πετεινῶν
  choice: aves
  rationale: O genitivo plural designa de modo amplo as aves; “aves” é natural e preciso em português.
- source_word: ἥμερα
  choice: as domesticadas
  rationale: O adjetivo neutro plural significa “mansas” ou “domesticadas” e distingue esse grupo das demais aves. A tradução explicita essa nuance, que não deve ser reduzida simplesmente a “algumas”.
- source_word: κατὰ τὰς οἰκίας
  choice: nas casas
  rationale: A preposição κατά indica aqui a localização dos ninhos em relação às casas. “Nas casas” preserva o cenário doméstico sem fixar indevidamente uma parte específica da construção.
- source_word: ὀροφοποιοῦντα
  choice: fazem seus ninhos
  rationale: No contexto das aves, o composto descreve a construção de ninhos na área do teto ou telhado; a formulação comunica a ação com naturalidade, enquanto a nota registra a leitura espacial mais literal.
- source_word: προασπίζει
  choice: protegem
  rationale: O verbo exprime pôr-se em defesa de alguém, protegendo-o. “Protegem” é claro e mantém a ideia de defesa parental.
- source_word: νεοττῶν
  choice: os filhotes
  rationale: O termo designa aves novas ou crias. “Filhotes” é corrente e natural em português, sem restringir a espécie.
