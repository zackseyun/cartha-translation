lexical_decisions:
- source_word: δραμὼν
  choice: correndo
  rationale: O particípio aoristo de τρέχω descreve um movimento rápido anterior ao verbo principal; o gerúndio mantém a vivacidade e a fluidez da narrativa em português.
- source_word: ἐπὶ πλησίον
  choice: para junto
  rationale: A expressão reúne a ideia de movimento, comunicada por ἐπί, e a de proximidade, comunicada por πλησίον. “Para junto” preserva ambas de modo natural, sem definir uma distância que o grego não especifica.
- source_word: τῶν τηγάνων
  choice: das frigideiras
  rationale: Τήγανον designa uma panela rasa usada para fritar. “Frigideiras” é o equivalente português mais direto; no contexto, são utensílios aquecidos empregados como instrumentos de tortura.
- source_word: ἔφη
  choice: disse
  rationale: Forma narrativa comum para introduzir fala direta; “disse” é a equivalência mais natural e sóbria em português.
