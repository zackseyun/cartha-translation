  text: Whom the tyrant pitied[a], even though he had been cruelly mistreated by his brothers, seeing that he was already wearing the chains,
translation:
  language: pt
  text: O tirano teve compaixão dele, embora tivesse sido duramente maltratado por seus irmãos, ao vê-lo já com correntes ao redor dele,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατοικτειρήσας
  choice: teve compaixão
  rationale: O particípio expressa compaixão ou pena; “teve compaixão” mantém a força afetiva em português natural e digno.
- source_word: ὁ τύραννος
  choice: o tirano
  rationale: Preserva a designação moralmente carregada do governante perseguidor, sem neutralizá-la como “rei” ou “governante”.
- source_word: καίπερ
  choice: embora
  rationale: Introduz com clareza a concessão expressa pelo grego.
- source_word: δεινῶς ... κακισθείς
  choice: tivesse sido duramente maltratado
  rationale: Reproduz a intensidade do advérbio e o sentido amplo de tratamento severamente mau sem especificar uma forma de violência que o grego não explicita aqui.
- source_word: ὑπὸ τῶν ἀδελφῶν αὐτοῦ
  choice: pelos irmãos daquele jovem
  rationale: “Irmãos” conserva a referência masculina do contexto; “daquele jovem” torna explícito, de modo natural, que αὐτοῦ remete ao jovem, enquanto o particípio nominativo κακισθείς se refere ao tirano.
- source_word: ὁρῶν
  choice: Ao vê-lo
  rationale: Expressa naturalmente a relação circunstancial do particípio e liga a compaixão do tirano ao que ele viu.
- source_word: ἤδη
  choice: já
  rationale: Equivalente direto que indica que as correntes já estavam colocadas.
- source_word: τὰ δεσμὰ περικείμενον
  choice: com as correntes ao redor do corpo
  rationale: Conserva a imagem literal das correntes que circundavam o jovem, evitando reduzir a expressão apenas ao estado abstrato de estar preso.
theological_decisions:
- issue: Referência masculina de ἀδελφῶν
  choice: irmãos
  alternative: irmãos e irmãs; familiares
  rationale: O episódio trata de irmãos do sexo masculino; a tradução mantém a referência contextual e gramatical sem neutralização indevida.
- issue: Valor avaliativo de τύραννος
  choice: tirano
  alternative: rei; governante
  rationale: O termo grego apresenta o perseguidor de forma moralmente negativa; uma designação política neutra enfraqueceria a retórica do texto.
- issue: Referente de κακισθείς e de αὐτοῦ
  choice: o tirano foi maltratado pelos irmãos do jovem
  alternative: o jovem foi maltratado pelos próprios irmãos
  rationale: κακισθείς está no nominativo masculino singular e concorda com ὁ τύραννος; αὐτοῦ pode remeter ao jovem mencionado pelo pronome relativo. A formulação portuguesa esclarece essa estrutura gramatical sem atribuir o maltrato ao jovem.
translation_notes:
  register: Português moderno, amplamente compreensível e de leitura natural no Brasil, com tom narrativo digno. A oração foi reordenada para evitar ambiguidade sintática em português, mas a vírgula final foi mantida porque o versículo termina como parte de uma frase que prossegue.
