base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/013.yaml
  text: Were you not ashamed[a], though you are a man, most beastly one, to cut out the tongues of those who share the same sufferings and have come from the same elements, and after mutilating him in this way[b], to torture him?
translation:
  language: pt
  text: Você não teve vergonha, embora seja homem, ó mais bestial de todos, de cortar as línguas daqueles que partilham a mesma condição[a] e foram formados dos mesmos elementos[b] e, depois de mutilá-lo desse modo, torturá-lo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «que passam pelas mesmas experiências», «sujeitos aos mesmos sofrimentos» ou «às mesmas paixões». O grego ὁμοιοπαθεῖς pode indicar pessoas que compartilham experiências, afecções ou condições semelhantes.
    reason: lexical_alternative
  - marker: b
    text: «Elementos» traduz o termo filosófico grego στοιχεῖα e se refere aqui aos componentes materiais comuns dos seres humanos.
    reason: cultural_note
lexical_decisions:
- source_word: οὐκ ᾐδέσθης
  choice: Você não teve vergonha
  rationale: Mantém a força moral da pergunta de censura; «vergonha» é mais adequada que a ideia mais fraca de mero constrangimento.
- source_word: ἄνθρωπος ὢν
  choice: embora seja homem
  rationale: A oração participial tem valor concessivo no contexto e prepara o contraste retórico entre ser humano e agir como fera.
- source_word: θηριωδέστατε
  choice: ó mais bestial de todos
  rationale: Preserva o vocativo superlativo e a imagem de comportamento semelhante ao de uma fera, com formulação natural em português.
- source_word: τοὺς ὁμοιοπαθεῖς
  choice: daqueles que partilham a mesma condição
  rationale: Expressa a condição e vulnerabilidade humanas compartilhadas sem restringir indevidamente o termo grego a sofrimento, sentimentos ou paixões.
- source_word: καὶ ἐκ τῶν αὐτῶν γεγονότας στοιχείων
  choice: e foram formados dos mesmos elementos
  rationale: Conserva «elementos», termo de fundo filosófico, ao mesmo tempo que verte γεγονότας de modo claro e idiomático.
- source_word: γλωττοτομῆσαι
  choice: cortar as línguas
  rationale: O verbo composto designa o corte ou a mutilação da língua; o plural explicita naturalmente a referência ao grupo.
- source_word: καὶ τοῦτον καταικίσας τὸν τρόπον
  choice: e, depois de mutilá-lo desse modo
  rationale: καταικίζω indica maus-tratos violentos ou mutilação. O pronome singular preserva a passagem do grupo para o indivíduo que está sendo torturado.
- source_word: βασανίσαι
  choice: torturá-lo
  rationale: No contexto de martírio, o verbo denota tortura física severa, não apenas aflição ou tormento genérico.
theological_decisions:
- issue: Contraste antropológico em ἄνθρωπος ὢν ... θηριωδέστατε
  choice: Preservar explicitamente o contraste entre ser homem e comportar-se de modo bestial.
  alternative: «embora seja humano, ó mais selvagem de todos»
  rationale: A acusação retórica depende da ironia de um ser humano agir como fera; a formulação mantém essa tensão sem acrescentar uma afirmação doutrinária.
- issue: Sentido de στοιχεῖα na constituição humana
  choice: Traduzir por «elementos» no texto principal.
  alternative: «componentes básicos» ou «mesma constituição material»
  rationale: «Elementos» preserva a linguagem filosófica do original e a afirmação de uma constituição humana comum sem explicar além do que o texto diz.
- issue: Mudança do plural para o singular em τοὺς ... τοῦτον ... βασανίσαι
  choice: Manter «daqueles» no plural e «mutilá-lo ... torturá-lo» no singular.
  alternative: Uniformizar toda a frase no plural.
  rationale: A mudança gramatical está no grego e provavelmente focaliza o indivíduo que está sendo torturado; preservá-la evita apagar uma tensão real do texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A pergunta longa e acusatória do grego foi mantida, com pontuação que facilita a leitura. «Bestial» conserva a imagem animal sem recorrer a insulto coloquial; os marcadores [a] e [b] aparecem junto aos termos a que suas notas se referem.
