  text: Release me[a], he says, so that I may tell the king and all his friends who are with him.
translation:
  language: pt
  text: “Solte-me”, diz ele, “para que eu fale ao rei e a todos os amigos que estão com ele”.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a todos os seus companheiros que estão com ele”. O termo grego φίλοι pode designar amigos pessoais ou associados da corte; “amigos” preserva o sentido mais direto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπόλυσόν
  choice: Solte
  rationale: O imperativo aoristo de ἀπολύω pede que o falante seja libertado da restrição. “Solte-me” é direto, natural e não acrescenta uma ideia jurídica específica.
- source_word: με
  choice: me
  rationale: Pronome de primeira pessoa do singular, objeto direto do imperativo.
- source_word: φησίν
  choice: diz ele
  rationale: Mantém o presente histórico do grego e sua vivacidade narrativa.
- source_word: εἴπω
  choice: para que eu fale
  rationale: O subjuntivo aoristo depois do imperativo expressa finalidade. Com objetos no dativo, “fale ao” representa naturalmente o ato de dirigir palavras ao rei e aos demais.
- source_word: τῷ βασιλεῖ
  choice: ao rei
  rationale: Dativo que indica a pessoa a quem se dirige a fala.
- source_word: τοῖς σὺν αὐτῷ φίλοις πᾶσιν
  choice: a todos os amigos que estão com ele
  rationale: Preserva πᾶσιν (“todos”), φίλοις (“amigos”) e explicita σὺν αὐτῷ (“com ele”) sem decidir se se trata apenas de amizade pessoal ou de associação cortesã.
