base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/011.yaml
  text: “You unholy man,” she said[a], “most ungodly tyrant of all wicked men, were you not ashamed, after receiving good things and kingship from God[b], to kill his servants and torture the practitioners of godliness?”
translation:
  language: pt
  text: “Ó homem profano”, disse ela, “tirano mais ímpio de todos os malfeitores[a], você não se envergonhou de, depois de receber de Deus os benefícios e o poder real[b], matar os servos dele e torturar os que se dedicam à devoção a Deus[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tirano mais ímpio de todos os perversos”. O grego acumula termos de forte censura e emprega uma forma superlativa.'
    reason: lexical_alternative
  - marker: b
    text: “Poder real” também pode ser traduzido por “realeza” ou “reino”; aqui, o contexto favorece a dignidade e a autoridade recebidas pelo rei.
    reason: lexical_ambiguity
  - marker: c
    text: Mais literalmente, “os praticantes da piedade”. O termo pode descrever pessoas que se exercitam ou se disciplinam na devoção religiosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνόσιε
  choice: Homem profano
  rationale: O vocativo denuncia alguém que viola o que é santo. “Profano” conserva essa força religiosa e, com “homem”, forma uma interpelação natural em português.
- source_word: πάντων τῶν πονηρῶν ἀσεβέστατε τύραννε
  choice: tirano mais ímpio de todos os perversos
  rationale: Mantém o superlativo ἀσεβέστατε, o sentido pejorativo de τύραννε e a referência coletiva de πάντων τῶν πονηρῶν, reproduzindo o acúmulo retórico do grego.
- source_word: οὐκ ᾐδέσθης
  choice: você não teve vergonha
  rationale: Expressa de maneira atual e direta a pergunta retórica de censura moral.
- source_word: παρὰ τοῦ θεοῦ λαβὼν τὰ ἀγαθὰ καὶ τὴν βασιλείαν
  choice: depois de receber de Deus os bens e a realeza
  rationale: “Depois de receber” explicita o valor antecedente do particípio; “bens” mantém τὰ ἀγαθὰ amplo, e “realeza” aponta para a condição ou autoridade régia sem restringi-la ao território.
- source_word: τοὺς θεράποντας αὐτοῦ
  choice: os servos dele
  rationale: Conserva a relação de serviço e pertencimento a Deus sem atribuir aos homens um cargo religioso específico.
- source_word: κατακτείνειν
  choice: matar
  rationale: Tradução clara e direta do verbo intensivo de tirar a vida, sem acrescentar um método não especificado.
- source_word: τοὺς τῆς εὐσεβείας ἀσκητάς
  choice: os que se dedicam à devoção a Deus
  rationale: Comunica a prática disciplinada indicada por ἀσκητάς e torna explícita a orientação religiosa de εὐσέβεια; evita tanto o sentido moderno de compaixão de “piedade” quanto as associações técnicas posteriores de “ascetas”.
- source_word: στρεβλοῦν
  choice: torturar
  rationale: Expressa o sentido geral do verbo, que pode envolver distensão no cavalete, sem especificar um instrumento que o versículo não nomeia.
theological_decisions:
- issue: Sentido de εὐσέβεια no contexto do martírio judaico
  choice: devoção a Deus
  alternative: piedade
  rationale: A escolha conserva a orientação para Deus e é clara no português atual; “piedade” poderia ser entendida principalmente como compaixão.
- issue: Identidade dos θεράποντες de Deus
  choice: servos
  alternative: ministros
  rationale: O texto apresenta pessoas que servem a Deus, mas não define ofício institucional ou cultual; “servos” preserva essa generalidade.
- issue: Alcance de βασιλεία
  choice: realeza
  alternative: reino; poder real
  rationale: No contexto, trata-se do que o tirano recebeu de Deus, provavelmente sua dignidade e autoridade régias. “Realeza” preserva esse enfoque, embora o substantivo grego também possa designar reino ou domínio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” adequado à acusação direta. A frase conserva a intensidade retórica do original sem recorrer a vocabulário excessivamente arcaico; “devoção a Deus” evita a ambiguidade contemporânea de “piedade”.
