  text: But even in the present life[a], and after you die, he will punish you.
translation:
  language: pt
  text: Mas ele castigará você tanto nesta vida[a] como depois que você morrer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas ele castigará você agora, nesta vida, e quando estiver morto”.'
    reason: Alternativa lexical e sintática para a correlação καὶ ... καὶ e para o particípio θανόντα.
lexical_decisions:
- source_word: σὲ
  choice: você
  rationale: Pronome acusativo de segunda pessoa do singular, objeto direto do verbo; “você” oferece leitura natural e amplamente compreensível em português moderno.
- source_word: δὲ
  choice: Mas
  rationale: A partícula marca contraste com o contexto anterior; “Mas” preserva adequadamente sua força adversativa.
- source_word: καὶ ... καὶ
  choice: ainda ... e
  rationale: O primeiro καὶ realça que o castigo já alcança a vida presente, enquanto o segundo coordena a vida presente e o período posterior à morte. A nota registra a possível correlação “tanto... como”.
- source_word: ἐν τῷ νῦν βίῳ
  choice: nesta vida
  rationale: Expressão portuguesa natural para a vida presente, mantendo o contraste explícito com o que ocorre depois da morte.
- source_word: θανόντα
  choice: depois que você morrer
  rationale: O particípio aoristo concorda com σὲ e tem sentido temporal; a oração explicita com naturalidade que o segundo âmbito do castigo é posterior à morte.
- source_word: τιμωρήσεται
  choice: ele castigará
  rationale: O futuro médio de τιμωρέω descreve ação punitiva de um sujeito masculino singular implícito no contexto. “Castigará” preserva o sentido sem intensificá-lo indevidamente como “se vingará”.
theological_decisions:
- issue: Sujeito implícito do verbo futuro
  choice: ele castigará você
  alternative: você será castigado
  rationale: O grego emprega a terceira pessoa do singular na voz média, não uma forma passiva. Mantém-se, portanto, a agência do sujeito implícito sem identificá-lo além do que a própria oração permite.
- issue: Alcance temporal do castigo
  choice: ainda nesta vida e depois que você morrer
  alternative: tanto agora, nesta vida, como quando você estiver morto
  rationale: A tradução conserva os dois âmbitos temporais expressos no grego — a vida presente e a condição posterior à morte — sem atenuar nem desenvolver teologicamente essa afirmação.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira e compreensão internacional. A ordem da frase é natural em português, e a nota preserva uma representação mais formal da correlação grega e do particípio.
