lexical_decisions:
- source_word: ὅθεν
  choice: Por isso
  rationale: Introduz uma inferência baseada no contexto anterior, em linguagem natural e atual; a nota preserva alternativas possíveis.
- source_word: καὶ αὐτὸς
  choice: ele próprio
  rationale: Expressa de modo idiomático a ênfase conjunta da conjunção καί e do pronome intensivo αὐτός, sem inserir um 'também' pouco natural.
- source_word: ἀποθνήσκειν
  choice: morrer
  rationale: Mantém o sentido lexical direto do infinitivo, que, com μέλλων, indica morte iminente.
- source_word: μέλλων
  choice: estava prestes a
  rationale: Comunica iminência com naturalidade, sem sugerir predestinação ou fatalismo.
- source_word: ἔφη
  choice: disse
  rationale: Equivalente narrativo simples e não interpretativo para o verbo de elocução.
