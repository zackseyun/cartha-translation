  text: And as he too died blessedly, after being thrown into the cauldron, the seventh came forward, the youngest of all.
translation:
  language: pt
  text: E, depois que ele também morreu de maneira bem-aventurada, após ser lançado num caldeirão, apresentou-se o sétimo, o mais novo de todos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακαρίως
  choice: de modo bendito
  rationale: Mantém a força adverbial e a avaliação positiva da morte no contexto do martírio, sem sugerir mera felicidade emocional.
- source_word: ἐναπέθανεν
  choice: morreu
  rationale: O verbo composto indica morrer na circunstância imposta; em português, «morreu» é natural, enquanto o particípio seguinte explicita essa circunstância.
- source_word: καταβληθείς
  choice: lançado
  rationale: Conserva a passividade e a ação forçada do particípio aoristo; a sequência é comunicada pela construção «depois que».
- source_word: λέβητα
  choice: caldeirão
  rationale: Designa com precisão um grande recipiente metálico e se ajusta ao contexto de tortura.
- source_word: παρεγίνετο
  choice: apresentou-se
  rationale: Expressa a entrada voluntária do próximo irmão em cena, sem acrescentar detalhes ausentes do grego.
- source_word: ὁ πάντων νεώτερος
  choice: o mais novo de todos
  rationale: Reproduz de maneira clara e idiomática a identificação superlativa do sétimo irmão.
theological_decisions:
- issue: Sentido de μακαρίως no contexto do martírio
  choice: morreu de modo bendito
  alternative: morreu felizmente
  rationale: «De modo bendito» preserva a avaliação honrosa e espiritualmente positiva da morte, ao passo que «felizmente» poderia ser entendido como simples satisfação emocional ou como resultado afortunado.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, preservando a progressão narrativa e a força adverbial do grego.
