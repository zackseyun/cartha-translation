  source_fidelity: 'A tradução preserva os elementos essenciais: a morte do irmão, sua morte avaliada positivamente, o lançamento forçado em um caldeirão e a entrada do sétimo irmão, o mais jovem. Contudo, «de modo bendito» é pouco idiomático em português moderno, e a posição de «lançado no caldeirão» pode momentaneamente deixar menos clara sua vinculação ao irmão que morreu. Uma construção participial/temporal mais explícita reflete melhor καταβληθείς.'
  naturalness: O registro é digno, mas «morreu de modo bendito» soa calcado e pouco natural. «De maneira bem-aventurada» mantém o valor avaliativo-religioso de μακαρίως sem reduzi-lo a felicidade subjetiva. «Após ser lançado num caldeirão» deixa clara a sequência e a voz passiva.
  terminology: «Caldeirão» é apropriado para λέβης. «O mais novo de todos» é uma boa formulação para ὁ πάντων νεώτερος. «Bem-aventurada» comunica adequadamente a qualificação honrosa de μακαρίως no contexto martirial, sem impor uma formulação doutrinária específica.
