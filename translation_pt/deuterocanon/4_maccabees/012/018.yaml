  yaml_path: translation/deuterocanon/4_maccabees/012/018.yaml
  text: But I call upon the God of my fathers[b][a], that he may be merciful to my nation.
translation:
  language: pt
  text: Mas clamo ao Deus dos meus antepassados[a], para que ele seja misericordioso com o meu povo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o Deus dos meus pais” ou “o Deus ancestral”.
    reason: lexical_alternative
  - marker: b
    text: Ou “minha nação”, “minha parentela” ou, mais literalmente, “minha raça/linhagem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλοῦμαι
  choice: clamo ao
  rationale: Expressa um apelo fervoroso dirigido a Deus e preserva o sentido de oração, em linguagem natural e digna, sem a possível conotação ritual de “invoco”.
- source_word: πατρῷον θεόν
  choice: Deus dos meus antepassados
  rationale: Comunica com clareza a relação ancestral e histórica indicada pelo adjetivo πατρῷον, preservando sua ressonância bíblica sem restringi-la apenas aos antepassados masculinos.
- source_word: ὅπως
  choice: para que
  rationale: Introduz naturalmente a finalidade ou o conteúdo do apelo no contexto da oração.
- source_word: ἐλέως γένηται
  choice: ele seja misericordioso
  rationale: O adjetivo predicativo com γένηται pede que Deus se mostre misericordioso. A formulação portuguesa é natural e evita sugerir uma mudança no caráter de Deus.
- source_word: τῷ γένει μου
  choice: com o meu povo
  rationale: No contexto, γένος abrange a comunidade judaica à qual o orador pertence. “Meu povo” mantém essa amplitude e evita as conotações modernas potencialmente enganosas de “raça”.
theological_decisions:
- issue: Alcance de τῷ γένει μου
  choice: meu povo
  alternative: minha nação; minha parentela; minha linhagem
  rationale: A solidariedade do mártir com a comunidade judaica favorece o sentido coletivo amplo, mas a nota preserva a extensão lexical do termo grego.
- issue: Sentido de πατρῷον θεόν
  choice: Deus dos meus antepassados
  alternative: Deus ancestral; Deus dos meus pais
  rationale: A escolha conserva o vínculo histórico e pactual com as gerações anteriores sem introduzir uma formulação doutrinária além do grego.
- issue: Força de γένηται
  choice: seja misericordioso
  alternative: venha a ser misericordioso; mostre-se misericordioso
  rationale: Em português, “seja” expressa adequadamente a petição e não implica que Deus precise mudar de caráter para tornar-se misericordioso.
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade brasileira. “Clamo ao” mantém o tom de oração; “antepassados” é inclusivo e corrente; “meu povo” comunica naturalmente o referente coletivo.
