  text: He sent for him to come nearer[a], and tried to encourage him, saying,
translation:
  language: pt
  text: 'Mandou chamá-lo para mais perto[a] e tentou encorajá-lo, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Chamou-o para mais perto e procurava consolá-lo, dizendo».'
    reason: Registra as alternativas legítimas de μετεπέμψατο, ἐπειρᾶτο e παρηγορεῖν, além da possível nuance durativa do imperfeito.
lexical_decisions:
- source_word: πλησιέστερον
  choice: para mais perto
  rationale: O comparativo adverbial indica maior proximidade; em conjunto com μετεπέμψατο, a expressão comunica naturalmente que ele o mandou chamar para que se aproximasse.
- source_word: αὐτὸν
  choice: -lo
  rationale: Pronome acusativo masculino singular, retomado de modo natural pelo pronome oblíquo em português.
- source_word: μετεπέμψατο
  choice: mandou chamá-lo
  rationale: A forma média de μεταπέμπω significa mandar buscar ou chamar alguém; «mandou chamá-lo» é corrente e preserva a iniciativa do sujeito sem sugerir formalidade excessiva.
- source_word: παρηγορεῖν
  choice: encorajá-lo
  rationale: Neste contexto de persuasão diante do sofrimento, «encorajar» exprime adequadamente o esforço de fortalecer ou exortar, embora «consolar» também seja lexicalmente possível.
- source_word: ἐπειρᾶτο
  choice: tentou
  rationale: Traduz a tentativa expressa pelo imperfeito médio. O português conciso «tentou», ligado ao infinitivo, mantém o sentido sem tornar a frase pesada.
- source_word: λέγων
  choice: dizendo
  rationale: Preserva o particípio presente que introduz a fala subsequente e a vincula ao esforço de encorajamento.
