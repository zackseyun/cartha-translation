  text: But if you are persuaded[a], you will be a friend, and you will have charge of the affairs of the kingdom.
translation:
  language: pt
  text: Mas, se você for convencido, será meu amigo e terá a direção[a] dos assuntos do reino.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a administração” ou “a liderança”. O termo grego pode indicar direção, liderança ou administração.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεισθεὶς
  choice: se você se deixar convencer
  rationale: O particípio aoristo passivo é empregado com valor condicional no contexto. A formulação conserva a ideia de ser persuadido e soa natural em português, sem intensificá-la para “ceder” ou “obedecer”.
- source_word: φίλος
  choice: meu amigo
  rationale: O sentido básico é “amigo”. O possessivo, implícito na fala dirigida ao interlocutor, torna a relação natural em português; o possível matiz de posição favorecida na corte não é explicitado.
- source_word: ἔσῃ
  choice: será
  rationale: Tradução direta e corrente do futuro de εἰμί.
- source_word: τῶν ἐπὶ τῆς βασιλείας πραγμάτων
  choice: dos assuntos do reino
  rationale: πράγματα designa assuntos ou negócios, e a expressão preposicional os situa na esfera do reino ou do governo real.
- source_word: ἀφήγησιν
  choice: terá a direção
  rationale: Neste contexto, o substantivo indica direção, liderança ou administração dos assuntos reais. A construção com “terá” explicita em português o verbo elíptico exigido pela frase grega.
