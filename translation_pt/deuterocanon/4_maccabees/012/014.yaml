  text: But those who died nobly fulfilled their godliness toward God;[a]
translation:
  language: pt
  text: Mas aqueles que morreram nobremente levaram sua devoção a Deus à plenitude.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “completaram sua piedade para com Deus”.'
    reason: Registra alternativas lexicais formais para ἐπλήρωσαν, εὐσέβεια e εἰς τὸν θεόν.
lexical_decisions:
- source_word: ἀλλ᾽
  choice: Mas
  rationale: Introduz o contraste com o contexto anterior de maneira direta e natural.
- source_word: οἱ μὲν
  choice: aqueles
  rationale: Identifica o primeiro lado de um contraste; μέν fica implícito em português para evitar uma formulação artificial.
- source_word: εὐγενῶς
  choice: nobremente
  rationale: Preserva a avaliação moral positiva da maneira como enfrentaram a morte.
- source_word: ἀποθανόντες
  choice: que morreram
  rationale: A oração relativa traduz naturalmente o particípio aoristo e conserva a referência ao ato consumado.
- source_word: ἐπλήρωσαν
  choice: levaram à plenitude
  rationale: Expressa o sentido de encher, completar ou conduzir à plena realização, sem sugerir apenas o cumprimento de uma obrigação.
- source_word: τὴν ... εὐσέβειαν
  choice: sua devoção
  rationale: No contexto, designa reverência fiel manifestada na conduta; “devoção” é corrente, digna e menos sujeita às conotações negativas que “piedade” pode ter no português moderno.
- source_word: εἰς τὸν θεόν
  choice: a Deus
  rationale: Indica a orientação e o objeto da devoção em português natural.
theological_decisions:
- issue: Sentido de εὐσέβεια no contexto do martírio
  choice: devoção
  alternative: piedade; reverência
  rationale: “Devoção” abrange a atitude reverente e a fidelidade prática a Deus sem transformar o termo em conceito técnico nem restringi-lo a sentimento interior.
- issue: Força de ἐπλήρωσαν
  choice: levaram à plenitude
  alternative: cumpriram; completaram
  rationale: A formulação conserva a ideia de que a morte nobre conduziu a devoção à sua expressão plena, mantendo aberta a relação exata entre morte e devoção.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A frase mantém tom digno e conciso; “levaram à plenitude” conserva a imagem verbal grega, enquanto “devoção a Deus” evita tanto arcaísmo quanto uma leitura meramente sentimental.
