  text: E, alegrando-se sobretudo com a promessa do jovem, rapidamente o desamarraram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιχαρέντες
  choice: alegrando-se
  rationale: Mantém o valor participial e expressa que eles ficaram contentes por causa da promessa, sem transformar a ação em uma oração independente.
- source_word: μάλιστα
  choice: sobretudo
  rationale: Preserva a ênfase no motivo principal da alegria com linguagem natural e digna.
- source_word: ἐπαγγελίᾳ
  choice: promessa
  rationale: É o equivalente mais direto neste contexto, no qual o jovem oferece um compromisso ou garantia verbal.
- source_word: τοῦ παιδός
  choice: do jovem
  rationale: παῖς admite sentidos como criança, menino, servo ou jovem; aqui, o contexto dos irmãos macabeus favorece 'jovem' sem sugerir necessariamente uma criança pequena.
- source_word: ταχέως
  choice: rapidamente
  rationale: Reproduz de modo claro o caráter imediato e célere da ação.
- source_word: ἔλυσαν
  choice: desamarraram
  rationale: No contexto de tortura e contenção física, traduz concretamente o ato de soltá-lo das amarras, em vez do sentido mais genérico de libertar.
