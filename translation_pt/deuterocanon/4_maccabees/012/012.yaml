review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a retribuição, o fogo comparativamente mais intenso, os tormentos e a falta de libertação. Porém, «por toda a eternidade» resolve em excesso a expressão εἰς ὅλον τὸν αἰῶνα, cujo sentido temporal deve permanecer lexicalmente aberto. «Não lhe darão alívio» é interpretativo em comparação com o sentido mais direto de «não o soltarão» ou «não o libertarão».
  naturalness: A redação revista mantém português atual, claro e digno. «Não o soltarão durante toda a era» preserva a imagem verbal sem perder inteligibilidade; a nota esclarece a expressão temporal.
  terminology: «Justiça divina», «fogo», «eterno» e «tormentos» são adequados. «Mais intenso» é uma equivalência idiomática defensável para πυκνοτέρῳ no contexto de fogo.
  issues:
  - severity: medium
    issue: A expressão temporal foi fixada como «por toda a eternidade».
    rationale: O grego diz εἰς ὅλον τὸν αἰῶνα, literalmente «durante toda a era/tempo». Mesmo em proximidade de αἰωνίῳ («eterno»), não é seguro eliminar no texto principal a amplitude de αἰών.
  - severity: low
    issue: «Não lhe darão alívio» explicita uma consequência em vez de traduzir diretamente o verbo.
    rationale: ἀνήσουσί σε significa primariamente «não o soltarão/deixarão ir». A formulação direta preserva melhor a imagem e evita restringir o enunciado a alívio subjetivo.
  revised_text: Por essas coisas, a justiça divina lhe reserva um fogo mais intenso e eterno e tormentos, que não o soltarão durante toda a era.[a]
  revised_footnotes:
  - marker: a
    text: 'Ou «durante todo o tempo». Grego: «durante toda a era»; o alcance de aiōn («era», «tempo») varia conforme o contexto.'
    reason: Explicita a formulação grega εἰς ὅλον τὸν αἰῶνα sem predeterminar sua duração em termos doutrinários.
  revision_rationale: A revisão preserva a força retributiva e a linguagem de punição do original, mas mantém aberta a expressão temporal disputada e traduz ἀνίημι de modo mais próximo como «soltar».
