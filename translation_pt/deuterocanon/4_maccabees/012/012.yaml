base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/012.yaml
  text: For these things, divine justice is storing up for you a denser and eternal fire and torments, which through the whole age will not release you.
translation:
  language: pt
  text: Por essas coisas, a justiça divina lhe reserva um fogo mais intenso e eterno e tormentos, que não o soltarão durante toda a era.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou «durante todo o tempo». Grego: «durante toda a era»; o alcance de aiōn («era», «tempo») varia conforme o contexto.'
    reason: Explicita a formulação grega εἰς ὅλον τὸν αἰῶνα sem predeterminar sua duração em termos doutrinários.
lexical_decisions:
- source_word: ἀνθ᾽ ὧν
  choice: Por causa dessas coisas
  rationale: Expressa a relação retributiva do grego de modo natural e mantém a referência ao que foi dito antes.
- source_word: ταμιεύεταί σε
  choice: reserva para você
  rationale: Preserva a imagem de algo guardado ou acumulado para a pessoa, sem tornar a frase artificial em português.
- source_word: πυκνοτέρῳ
  choice: mais intenso
  rationale: Embora o sentido básico seja «mais denso», aplicado ao fogo o termo comunica maior concentração ou intensidade; «mais intenso» é claro e idiomático.
- source_word: αἰωνίῳ πυρὶ
  choice: fogo ... eterno
  rationale: Reproduz diretamente o adjetivo αἰώνιος e sua relação com «fogo».
- source_word: βασάνοις
  choice: tormentos
  rationale: Equivalente direto e adequado ao contexto de punição.
- source_word: οὐκ ἀνήσουσί σε
  choice: não lhe darão alívio
  rationale: ἀνίημι pode indicar soltar, afrouxar ou aliviar; no contexto de tormentos, «dar alívio» comunica naturalmente que eles não cessarão nem afrouxarão.
theological_decisions:
- issue: Duração expressa por εἰς ὅλον τὸν αἰῶνα
  choice: por toda a eternidade
  alternative: durante toda a era
  rationale: No contexto, a expressão reforça αἰωνίῳ e indica duração completa e contínua. A nota registra a forma mais literal e sua possível tradução para não ocultar a amplitude lexical de αἰών.
- issue: Referente do pronome relativo αἱ
  choice: os tormentos são apresentados como aquilo que não dará alívio
  alternative: o fogo e os tormentos não o soltarão
  rationale: O relativo feminino plural αἱ concorda formalmente com βασάνοις, também feminino plural em grego, e não com πυρί, neutro singular.
translation_notes:
  register: Português atual, digno e acessível, com leitura natural no Brasil e compreensão internacional. Evitou-se o pouco idiomático «fogo mais denso», sem apagar a ideia comparativa de πυκνοτέρῳ.
