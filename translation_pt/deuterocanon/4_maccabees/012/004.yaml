base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/004.yaml
  text: You see the outcome of your brothers’ madness[a]; for because of disobedience they have been tortured and have died. But you, if you do not obey, will yourself also die before your time[c][b], after being miserably tortured.
translation:
  language: pt
  text: Você vê o desfecho[a] da loucura dos seus irmãos, pois, por causa da desobediência, eles foram torturados[b] e morreram. Mas você, se não obedecer[c], também morrerá antes do tempo, depois de ser cruelmente torturado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o fim” ou “o resultado”.
    reason: lexical_alternative
  - marker: b
    text: O verbo grego pode referir-se mais especificamente a ser estirado no cavalete de tortura.
    reason: cultural_note
  - marker: c
    text: Ou “se não se deixar persuadir”; aqui, a persuasão implica ceder à ordem e obedecer.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τέλος
  choice: o desfecho
  rationale: No contexto, indica o fim ou resultado da conduta dos irmãos. “Desfecho” preserva a ideia de fim e consequência em português natural.
- source_word: ἀπονοίας
  choice: loucura
  rationale: O termo expressa falta de juízo ou irracionalidade e mantém a avaliação hostil feita pelo personagem que fala.
- source_word: ἀπείθειαν
  choice: desobediência
  rationale: Refere-se à recusa dos irmãos em cumprir a ordem do tirano; “desobediência” comunica diretamente essa força prática.
- source_word: στρεβλωθέντες
  choice: foram torturados
  rationale: O verbo pode designar especificamente o suplício no cavalete, mas “foram torturados” evita especificar no texto principal um instrumento que o contexto imediato não nomeia.
- source_word: τεθήκασιν
  choice: morreram
  rationale: Nesse contexto, o perfeito grego descreve os irmãos como mortos; “morreram” expressa de modo claro e idiomático o resultado.
- source_word: πεισθείης
  choice: obedecer
  rationale: Embora o sentido básico seja “ser persuadido”, no contexto coercitivo a consequência prática é ceder e cumprir a ordem. A nota preserva a alternativa lexical.
- source_word: ταλαί βασανισθεὶς
  choice: depois de ser cruelmente torturado
  rationale: A formulação transmite a intensidade miserável e dolorosa do suplício e apresenta a tortura como anterior à morte.
- source_word: πρὸ ὥρας
  choice: antes do tempo
  rationale: A expressão idiomática indica uma morte prematura ou fora do tempo esperado.
theological_decisions:
- issue: Avaliação da atitude dos irmãos por quem fala
  choice: “loucura”
  alternative: “insensatez” ou “imprudência”
  rationale: A fala é uma ameaça hostil dirigida ao irmão sobrevivente. A tradução conserva a retórica condenatória do personagem sem transformá-la em avaliação do narrador.
- issue: Sentido de πεισθείης no contexto da ordem do tirano
  choice: “obedecer” no texto, com “deixar-se persuadir” em nota
  alternative: “deixar-se persuadir” no texto principal
  rationale: “Obedecer” comunica a exigência concreta de submissão, enquanto a nota preserva a ambiguidade lexical do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O tratamento por “você” mantém a interpelação direta e ameaçadora. A ordem das orações foi ajustada levemente para fluidez, sem eliminar a relação causal nem a sequência entre tortura e morte.
