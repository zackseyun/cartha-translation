translation:
  language: pt
  text: Não renunciarei ao testemunho dos meus irmãos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ao testemunho dado pelos meus irmãos»; no contexto, a palavra também tem conotações de martírio.
    reason: Registra uma alternativa lexical e a ressonância contextual sem inseri-la diretamente no texto.
lexical_decisions:
- source_word: Οὐκ
  choice: Não
  rationale: Negação direta que rege o verbo.
- source_word: ἀπαντυμολοῶ
  choice: renunciarei
  rationale: Expressa a recusa em repudiar ou abandonar algo sob pressão. O futuro em português comunica naturalmente a determinação do falante neste contexto.
- source_word: μαρτυρίας
  choice: testemunho
  rationale: Preserva o sentido lexical direto de declaração ou testemunho, sem explicitar indevidamente o martírio, embora essa associação permaneça no contexto.
- source_word: τῶν ἀδελφῶν μου
  choice: dos meus irmãos
  rationale: Refere-se aos irmãos homens do falante na narrativa; a formulação é precisa e natural em português.
theological_decisions:
- issue: Se μαρτυρίας deve ser traduzido com linguagem explícita de martírio
  choice: testemunho
  alternative: martírio; testemunho dado
  rationale: Embora o contexto de 4 Macabeus associe fortemente o testemunho à morte dos irmãos, traduzir por «martírio» tornaria explícita uma interpretação que o substantivo grego deixa implícita. «Testemunho» preserva essa tensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. «Renunciarei ao testemunho» conserva a força solene da declaração e evita vocabulário arcaico.
