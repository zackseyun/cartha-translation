  text: and when his mother had encouraged him in the Hebrew language[a], as we will tell a little later,
translation:
  language: pt
  text: e, quando sua mãe o encorajou em língua hebraica[a], como contaremos um pouco mais adiante,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na língua dos hebreus”. A expressão grega se refere à língua em que a mãe falou com ele.
    reason: lexical_alternative
lexical_decisions:
- source_word: προτρεψαμένης
  choice: encorajou
  rationale: O particípio de προτρέπω expressa incentivo ou exortação ativa. “Encorajou” é natural em português e preserva a força do verbo sem torná-lo excessivamente imperativo.
- source_word: τῇ Ἑβραΐδι φωνῇ
  choice: em língua hebraica
  rationale: Neste contexto, φωνή designa a língua ou forma de fala usada pela mãe, e não apenas sua voz ou um som. “Em língua hebraica” mantém com clareza a referência linguística.
- source_word: μετὰ μικρὸν ὕστερον
  choice: um pouco mais adiante
  rationale: A expressão aponta para uma retomada próxima no decorrer da narrativa. “Um pouco mais adiante” comunica naturalmente essa referência textual.
- source_word: δὲ
  choice: e
  rationale: Aqui δέ funciona como conectivo narrativo leve, sem contraste forte; “e” preserva a continuidade.
- source_word: ὡς ἐροῦμεν
  choice: como contaremos
  rationale: O futuro introduz um comentário do autor que anuncia um relato posterior. “Contaremos” é idiomático e apropriado ao contexto narrativo.
