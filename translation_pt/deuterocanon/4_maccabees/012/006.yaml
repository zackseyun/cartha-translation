  yaml_path: translation/deuterocanon/4_maccabees/012/006.yaml
  text: And while urging these things[a], he sent for the boy’s mother, so that, having pity on her after she had been deprived of so many sons, he might persuade her to make the one remaining compliant for his deliverance.
translation:
  language: pt
  text: Enquanto insistia nessas coisas, ele mandou chamar a mãe do rapaz, para que, compadecido dela, que havia sido privada de tantos filhos, a induzisse a tornar dócil o filho que ainda restava, visando ao livramento dele[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “salvação”. Aqui, o termo grego provavelmente se refere ao livramento físico da execução, embora também possa ter um sentido mais amplo.
    reason: Registra a alternativa lexical e preserva a amplitude semântica de σωτηρία.
lexical_decisions:
- source_word: παρακαλῶν
  choice: insistia
  rationale: No contexto, o particípio descreve a pressão verbal contínua do tirano. “Insistia” é natural em português e comunica uma exortação enfática sem sugerir encorajamento benevolente.
- source_word: μετεπέμψατο
  choice: mandou chamar
  rationale: O verbo médio significa enviar alguém para buscar ou convocar uma pessoa. “Mandou chamar” é idiomático e mantém a ação sem explicitar um grau de coerção que o verbo, por si só, não define.
- source_word: ἐλεήσας
  choice: compadecido
  rationale: Expressa a compaixão atribuída ao agente. A escolha preserva o sentido contextual sem a possível carga teológica de “ter misericórdia”.
- source_word: στερηθεῖσαν
  choice: que havia sido privada
  rationale: 'Preserva a voz passiva e a anterioridade contextual do particípio: outros lhe haviam tirado os filhos.'
- source_word: παρορμήσειεν
  choice: induzisse
  rationale: O verbo indica impelir ou levar alguém a agir. “Induzisse” representa adequadamente a tentativa de mover a mãe a influenciar o filho, sem suavizar o caráter manipulador da ação.
- source_word: σωτηρίαν
  choice: livramento
  rationale: Neste contexto imediato, refere-se sobretudo a escapar da execução. “Livramento” comunica resgate físico, enquanto a nota conserva o sentido lexical mais amplo de “salvação”.
- source_word: εὐπειθῆ ποιῆσαι
  choice: tornar dócil
  rationale: A expressão significa fazer alguém disposto a ceder ou obedecer. “Tornar dócil” é compreensível e evita apresentar essa submissão coerciva como obediência moralmente positiva.
- source_word: τὸν περιλειπόμενον
  choice: o filho que ainda restava
  rationale: Identifica naturalmente em português o único filho sobrevivente no contexto, sem precisar acrescentar ao texto grego uma formulação explícita como “ainda vivo”.
theological_decisions:
- issue: Sentido de σωτηρία no contexto do martírio
  choice: livramento, principalmente no sentido de escapar fisicamente da execução
  alternative: salvação em sentido mais amplo, inclusive religioso
  rationale: A cena trata da tentativa de poupar o último filho caso ele cedesse. Ainda assim, a amplitude semântica do termo grego é preservada em nota, sem impor ao versículo uma afirmação doutrinária sobre salvação eterna.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para clareza, mantendo a cadeia de propósito e a compaixão alegada pelo tirano. O pronome “dele” explicita que o livramento visado é o do filho restante, leitura mais natural no contexto.
