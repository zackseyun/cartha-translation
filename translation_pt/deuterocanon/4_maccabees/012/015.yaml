  yaml_path: translation/deuterocanon/4_maccabees/012/015.yaml
  text: But you will wail miserably for putting to death, without cause, the champions of virtue[a][b].
translation:
  language: pt
  text: Mas você lamentará em grande aflição por ter matado sem motivo[b] os combatentes da virtude[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os atletas da virtude” ou “os que lutam pela virtude”; o termo grego evoca participantes de uma competição ou luta e é usado aqui em sentido honorífico.
    reason: lexical_alternative
  - marker: b
    text: Ou “injustamente” ou “sem justificativa”. O grego diz literalmente “sem causa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Mas você
  rationale: Preserva o contraste adversativo e a interpelação direta ao tirano em português corrente.
- source_word: κακῶς
  choice: em grande aflição
  rationale: Ligado a οἰμώξεις, intensifica o lamento e comunica sofrimento profundo sem recorrer ao pouco natural 'lamentará miseravelmente'.
- source_word: οἰμώξεις
  choice: lamentará
  rationale: Expressa o lamento intenso indicado pelo verbo grego, mantendo um registro digno e natural.
- source_word: τοὺς τῆς ἀρετῆς ἀγωνιστάς
  choice: os que lutam pela virtude
  rationale: Conserva a imagem de pessoas empenhadas numa luta moral e evita que 'atletas' seja entendido apenas em sentido esportivo.
- source_word: ἀναίτιως
  choice: sem motivo
  rationale: Mantém a ideia literal de ausência de causa ou fundamento, deixando a injustiça implícita sem a explicitar além do grego.
- source_word: ἀποκτεῖναι
  choice: por ter matado
  rationale: O infinitivo aponta para o ato pelo qual o destinatário lamentará; a construção com infinitivo composto é clara e idiomática em português.
theological_decisions:
- issue: Sentido moral-filosófico de ἀρετή no contexto do martírio
  choice: virtude
  alternative: excelência moral
  rationale: '''Virtude'' preserva de modo conciso o vocabulário ético helenístico-judaico sem introduzir uma formulação teológica posterior.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A frase conserva o tom direto de denúncia, a metáfora de luta e a abertura semântica de ἀναίτιως.
