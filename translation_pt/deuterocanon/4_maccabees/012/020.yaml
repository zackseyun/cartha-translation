  text: And after praying these things[a], he threw himself onto the frying pans; and so he died.
translation:
  language: pt
  text: Depois de fazer essa oração, ele se lançou sobre as frigideiras e assim morreu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, «entregou» ou «devolveu»; o grego não declara o que foi entregue.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτα κατευξάμενος
  choice: Depois de orar assim
  rationale: O particípio aoristo indica que a oração precedeu a ação principal; ταῦτα retoma o conteúdo das palavras anteriores. A formulação é natural em português e conserva a sequência temporal.
- source_word: ἑαυτὸν ἔρριψεν
  choice: ele se lançou
  rationale: O pronome reflexivo e o verbo ῥίπτω descrevem uma ação deliberada e enérgica. “Lançou-se” mantém essa força sem soar arcaico.
- source_word: κατὰ τῶν τηγάνων
  choice: sobre as frigideiras
  rationale: κατά com o genitivo expressa aqui movimento para baixo, sobre ou contra os instrumentos de tortura; τηγάνον designa uma frigideira ou recipiente semelhante aquecido.
- source_word: ἀπέδωκεν
  choice: entregou a vida
  rationale: O verbo significa literalmente “deu de volta/entregou”, mas o objeto está elíptico no grego. No contexto do martírio, refere-se à morte; “entregou a vida” preserva algo da expressão grega sem deixar o sentido obscuro.
theological_decisions:
- issue: Sentido elíptico de ἀπέδωκεν no relato de martírio
  choice: entregou a vida
  alternative: morreu; entregou [o espírito]
  rationale: O contexto deixa claro que ele morreu, mas o texto não nomeia “vida” nem “espírito”. A tradução escolhida comunica a morte e mantém a imagem de entrega, enquanto a nota registra a elipse e evita afirmar especificamente que o objeto seja o espírito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Frigideiras” preserva o referente concreto do grego, embora o contexto deixe claro que eram instrumentos aquecidos de tortura.
