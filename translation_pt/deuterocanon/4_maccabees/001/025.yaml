  text: And within pleasure there is also a malicious disposition[a], being the most versatile of all the passions.
translation:
  language: pt
  text: No prazer, porém, também há uma disposição perversa, a mais multiforme de todas as paixões.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a mais variada” ou “a mais versátil”.
    reason: O grego πολυτροπωτάτη pode destacar a multiplicidade de formas, variações ou recursos dessa disposição.
lexical_decisions:
- source_word: ἐν ... τῇ ἡδονῇ
  choice: no prazer
  rationale: A construção ἐν com o dativo situa essa disposição dentro da categoria do prazer; “no prazer” preserva essa relação de modo natural em português.
- source_word: κακοήθης διάθεσις
  choice: a disposição perversa
  rationale: διάθεσις indica disposição ou tendência, enquanto κακοήθης lhe atribui caráter moralmente mau. “Perversa” comunica esse valor sem restringi-lo necessariamente à intenção consciente de causar dano, como poderia ocorrer com “maliciosa”.
- source_word: πολυτροπωτάτη
  choice: a mais multiforme
  rationale: O superlativo de πολύτροπος expressa multiplicidade de formas, modos ou recursos. “Multiforme” conserva essa amplitude e evita a conotação geralmente positiva de “versátil” em português.
- source_word: πάντων τῶν παθῶν
  choice: de todas as paixões
  rationale: Neste contexto filosófico, πάθη designa impulsos ou paixões sujeitos ao governo da razão, e não meramente emoções ou sofrimentos.
- source_word: οὖσα
  choice: que é
  rationale: A oração relativa reproduz em português natural a relação descritiva do particípio com “disposição”, sem impor um sentido causal.
theological_decisions:
- issue: Sentido de πάθη no contexto ético-filosófico judaico-helenístico
  choice: paixões
  alternative: emoções; afetos
  rationale: “Paixões” preserva a categoria moral e psicológica central ao argumento de 4 Macabeus sobre o domínio exercido pela razão, sem afirmar que toda emoção seja moralmente má.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação mantém o encadeamento filosófico do grego e preserva a amplitude de πολυτροπωτάτη por meio de nota lexical.
