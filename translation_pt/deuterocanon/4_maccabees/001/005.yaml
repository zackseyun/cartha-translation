  yaml_path: translation/deuterocanon/4_maccabees/001/005.yaml
  text: How then[a], perhaps some might say, if reason rules over the passions, does it not also master forgetfulness and ignorance? In attempting to say this, they are being ridiculous.
translation:
  language: pt
  text: Como é que, então — talvez alguns digam —, se a razão domina as paixões, não domina também o esquecimento e a ignorância? Ao tentarem dizer isso, eles caem no ridículo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “É ridículo tentar dizer isso.” O grego γελοῖον ἐπιχειροῦντες λέγειν pode ser entendido de modo impessoal ou como referência aos próprios objetores.'
    reason: alternative_reading
lexical_decisions:
- source_word: πῶς οὖν
  choice: Como, então
  rationale: Introduz uma objeção em forma de pergunta retórica e preserva a progressão do argumento.
- source_word: ἴσως εἴποιεν ἄν τινες
  choice: talvez digam alguns
  rationale: Expressa de modo natural a objeção possível e cautelosa indicada por ἴσως com optativo e ἄν.
- source_word: τῶν παθῶν
  choice: as paixões
  rationale: No quadro ético-filosófico de 4 Macabeus, designa impulsos e afetos sujeitos ao governo da razão, não sofrimentos externos.
- source_word: ὁ λογισμός
  choice: a razão
  rationale: Representa a faculdade de reflexão e deliberação racional central à tese do livro.
- source_word: κρατεῖ
  choice: domina
  rationale: Comunica exercício de poder ou controle sobre as paixões, em português corrente e digno.
- source_word: λήθης καὶ ἀγνοίας
  choice: o esquecimento e a ignorância
  rationale: Mantém os dois substantivos como deficiências mentais distintas, sem ampliação interpretativa.
- source_word: οὐ δεσπόζει
  choice: ela não domina também
  rationale: Preserva a ideia forte de senhorio ou domínio; o pronome retoma claramente «a razão», e «também» explicita a relação lógica da objeção.
- source_word: γελοῖον ἐπιχειροῦντες λέγειν
  choice: Ao tentarem dizer isso, eles caem no ridículo
  rationale: Liga naturalmente o particípio aos objetores implícitos e conserva o tom polêmico, enquanto a possível leitura impessoal é registrada em nota.
theological_decisions:
- issue: Terminologia antropológica e filosófica em 4 Macabeus
  choice: Traduzir λογισμός por «razão» e πάθη por «paixões»
  alternative: Traduzir λογισμός por «juízo racional» ou «mente», e πάθη por «emoções» ou «impulsos»
  rationale: O par escolhido preserva o vocabulário filosófico do argumento contínuo do livro sem introduzir uma antropologia confessional posterior.
- issue: Relação de γελοῖον com a construção participial
  choice: 'Aplicar o ridículo aos objetores: «eles caem no ridículo»'
  alternative: 'Tomar a expressão impessoalmente: «é ridículo tentar dizer isso»'
  rationale: As duas análises são possíveis. O texto principal apresenta de forma idiomática a ligação provável com os falantes implícitos, e a nota preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O uso de «razão» e «paixões» mantém o registro filosófico sem soar excessivamente técnico; os travessões distinguem com clareza a objeção intercalada.
