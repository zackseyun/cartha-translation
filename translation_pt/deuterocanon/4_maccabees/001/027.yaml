translation:
  language: pt
  text: e, no que diz respeito ao corpo, comer de tudo, a gula e comer sozinho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “comer um só tipo de alimento” ou “alimentar-se de um único tipo de alimento”. A palavra grega μονοφαγία permite esse sentido mais literal, embora “comer sozinho” se ajuste bem ao contexto da lista de vícios.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ τὸ σῶμα
  choice: e, no que diz respeito ao corpo
  rationale: κατά com o acusativo indica aqui a esfera em que os vícios seguintes se enquadram. A formulação preserva a classificação do grego e soa natural em português.
- source_word: παντοφαγία
  choice: comer de tudo
  rationale: O composto designa o ato ou hábito de comer toda espécie de alimento. Esta expressão é mais clara e corrente do que um termo técnico como “onivorismo”, sem reduzir o sentido simplesmente ao excesso quantitativo.
- source_word: λαμαργία
  choice: a gula
  rationale: O termo denota apetite voraz ou alimentação excessiva; “gula” é o equivalente tradicional, claro e conciso em uma lista de vícios.
- source_word: μονοφαγία
  choice: comer sozinho
  rationale: No contexto ético, pode designar o hábito antissocial de comer sem companhia. Como a composição da palavra também permite entender “comer um só tipo de alimento”, essa ambiguidade é preservada em nota.
theological_decisions:
- issue: Sentido de μονοφαγία
  choice: comer sozinho
  alternative: comer um só tipo de alimento; alimentação baseada em um único tipo de alimento
  rationale: A opção principal se ajusta bem a uma lista ética de hábitos corporais e de conduta social, mas a morfologia grega admite a alternativa. Por isso, a tradução não elimina a ambiguidade, registrando-a em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém-se a forma de lista do original; “comer de tudo” evita tecnicismo desnecessário, e a ambiguidade de μονοφαγία é explicitada em nota.
