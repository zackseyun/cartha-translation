  text: Each of these the all-working reason[a], thoroughly purifying and pruning and entwining and raising up and transforming in every way[b], tames the raw materials of character and passions.
translation:
  language: pt
  text: Quanto a cada uma delas, a razão eficaz em tudo[a], purificando por completo, podando, entrelaçando, erguendo e transformando de todas as formas[b], doma as matérias-primas do caráter e das paixões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a razão que opera em tudo”. O adjetivo grego é raro e ressalta a eficácia abrangente da razão.'
    reason: lexical_alternative
  - marker: b
    text: 'O grego acumula uma série de particípios com imagens de cultivo e trabalho artesanal: purificar, podar, entrelaçar, erguer e transformar. A sequência retrata a razão moldando o material interior da pessoa.'
    reason: cultural_note
lexical_decisions:
- source_word: ὧν ἕκαστος
  choice: Quanto a cada uma delas
  rationale: Mantém a referência distributiva ao que foi mencionado antes e evita forçar uma função sintática excessivamente específica numa construção grega difícil.
- source_word: ὁ πανεγώργος λογισμός
  choice: a razão que age de todas as maneiras
  rationale: λογισμός é a faculdade racional central no argumento de 4 Macabeus; o raro πανεγώργος destaca a amplitude e a eficácia de sua atuação.
- source_word: περικαθαίρων
  choice: purificando por completo
  rationale: Expressa a força intensificadora de περι- e a ideia de limpeza abrangente.
- source_word: ἀποκνίζων
  choice: podando
  rationale: Comunica a retirada seletiva do que é excessivo ou áspero e se integra à sequência de imagens de cultivo e trabalho artesanal.
- source_word: περιπλέκων
  choice: entrelaçando
  rationale: Preserva a imagem concreta de tecer, enredar ou envolver ao redor.
- source_word: ἐπάρδων
  choice: erguendo
  rationale: Conserva o sentido formativo de levantar sem acrescentar uma noção abstrata de exaltação.
- source_word: πάντα τρόπον μεταχέων
  choice: transformando de todas as formas
  rationale: Reproduz tanto a alteração profunda sugerida pelo verbo quanto a abrangência de πάντα τρόπον.
- source_word: ἐξημεροῖ
  choice: doma
  rationale: Mantém a imagem vívida de tornar manso ou civilizado aquilo que é indócil.
- source_word: τὰς τῶν ἠθῶν καὶ παθῶν ὕλας
  choice: as matérias-primas do caráter e das paixões
  rationale: Preserva a metáfora material de ὕλη e distingue as disposições de caráter (ἤθη) dos impulsos afetivos (πάθη).
theological_decisions:
- issue: Sentido de λογισμός no argumento filosófico-teológico de 4 Macabeus
  choice: razão
  alternative: juízo racional
  rationale: “Razão” é claro, conciso e mantém a ideia da faculdade que governa as paixões em conformidade com a piedade, sem importar terminologia doutrinária posterior.
- issue: Sentido de πάθη
  choice: paixões
  alternative: emoções
  rationale: Neste contexto, o termo designa impulsos e afecções interiores sujeitos ao governo racional, e não sofrimentos externos; “paixões” preserva melhor essa tensão ética.
- issue: Relação de ὧν ἕκαστος com a oração principal
  choice: Quanto a cada uma delas
  alternative: Cada uma delas
  rationale: A formulação temática conserva a referência distributiva e a dificuldade da construção grega sem resolver silenciosamente o referente ou criar em português um segundo objeto direto incompatível com “as matérias-primas”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A longa sequência participial foi preservada para reproduzir o efeito retórico do grego; “matérias-primas” conserva deliberadamente a metáfora concreta de ὕλη.
