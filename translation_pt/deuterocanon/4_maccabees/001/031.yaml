  text: Self-control, then, is mastery over desires.
translation:
  language: pt
  text: O domínio próprio, portanto, é o controle sobre os desejos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνη
  choice: domínio próprio
  rationale: No contexto, designa a virtude prática de governar os próprios impulsos. “Domínio próprio” é claro e corrente, preserva a dimensão ética e evita a possível estreiteza de “temperança” ou o sentido predominantemente intelectual de “prudência”.
- source_word: δὴ τοίνυν
  choice: portanto
  rationale: As partículas introduzem, com leve ênfase, uma conclusão ou formulação decorrente do argumento anterior. “Portanto” reproduz naturalmente essa transição em português.
- source_word: ἐστὶν
  choice: é
  rationale: Mantém a cópula simples da definição formal.
- source_word: ἐπικράτεια
  choice: controle
  rationale: Expressa o exercício de poder ou prevalência sobre algo. “Controle sobre” é idiomático e claro em português; evita repetir “domínio” logo após “domínio próprio”.
- source_word: τῶν ἐπιθυμιῶν
  choice: sobre os desejos
  rationale: ἐπιθυμίαι tem aqui sentido ético amplo, não necessariamente sexual ou sempre negativo. “Desejos” preserva essa abrangência, e “sobre” explicita de modo natural a relação regida por ἐπικράτεια.
