  yaml_path: translation/deuterocanon/4_maccabees/001/020.yaml
  text: The two most comprehensive kinds of passions are pleasure and pain[a]; and each of these is by nature also connected with the soul.
translation:
  language: pt
  text: As duas categorias mais abrangentes das paixões são o prazer e a dor[a]; e cada uma delas também está, por natureza, ligada à alma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “As duas naturezas mais abrangentes das paixões são o prazer e a dor”. A formulação grega é condensada, e φύσεις pode ser traduzido mais literalmente por “naturezas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παθῶν
  choice: das paixões
  rationale: Neste contexto filosófico, πάθος designa paixões ou impulsos afetivos, não apenas sofrimentos.
- source_word: φύσεις
  choice: categorias
  rationale: Embora o sentido literal seja “naturezas”, aqui o termo classifica as paixões; “categorias” comunica essa função taxonômica com clareza.
- source_word: περιεκτικώταται
  choice: mais abrangentes
  rationale: O superlativo indica as categorias de maior alcance, que englobam as demais.
- source_word: ἡδονή
  choice: prazer
  rationale: É o equivalente corrente no discurso ético e filosófico.
- source_word: πόνος
  choice: dor
  rationale: Em oposição a ἡδονή, “dor” expressa naturalmente o polo contrário.
- source_word: ἑκάτερον
  choice: cada uma delas
  rationale: 'Retoma distributivamente as duas realidades femininas mencionadas: o prazer e a dor.'
- source_word: περὶ τὴν ψυχὴν
  choice: ligada à alma
  rationale: A expressão indica uma relação com a alma; a formulação evita o literalismo obscuro “ao redor da alma”.
- source_word: πέφυκεν
  choice: está, por natureza
  rationale: O perfeito de φύω exprime uma condição inerente ou natural.
theological_decisions:
- issue: Sentido antropológico de ψυχή
  choice: alma
  alternative: vida; ser interior
  rationale: No contexto filosófico-antropológico, ψυχή aponta para a dimensão interior da pessoa, e não apenas para a vida biológica; “alma” preserva o termo tradicional sem acrescentar precisão doutrinária alheia ao texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário filosófico não técnico. A tradução mantém a relação algo aberta entre prazer, dor e alma.
