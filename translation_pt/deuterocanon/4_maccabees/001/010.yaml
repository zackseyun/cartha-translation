base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/010.yaml
  text: Therefore[a], it is incumbent on me to praise the men who, at this time, died with their mother for the sake of nobility and goodness; and, as for honors[b], to pronounce them blessed.
translation:
  language: pt
  text: Portanto, quanto às virtudes, cabe-me louvar os homens que, naquele tempo, morreram com sua mãe por causa da nobreza e da bondade[a]; e, quanto às honras, proclamá-los bem-aventurados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa da virtude”. O termo grego καλοκἀγαθία reúne as ideias de nobreza e bondade ou excelência moral.
    reason: lexical_alternative
  - marker: b
    text: A frase grega final é condensada e de sintaxe difícil. O sentido parece ser que, além de louvar suas virtudes, o autor lhes presta a honra de proclamá-los bem-aventurados.
    reason: alternative_reading
lexical_decisions:
- source_word: τῶν μὲν οὖν ἀρετῶν
  choice: Portanto, quanto às virtudes
  rationale: Preserva a construção tópica e contrastiva μὲν...δέ, que relaciona as virtudes dos mártires às honras que lhes são atribuídas.
- source_word: ἐπεστί μοι ἐπαινεῖν
  choice: cabe-me louvar
  rationale: A expressão impessoal indica incumbência ou responsabilidade. “Cabe-me” mantém o tom formal sem soar arcaico, e “louvar” traduz diretamente ἐπαινεῖν.
- source_word: τοὺς ... ἀποθανόντας ... ἄνδρας
  choice: os homens que ... morreram
  rationale: Transforma naturalmente o particípio grego em oração relativa e preserva a referência masculina específica aos filhos.
- source_word: κατὰ τοῦτον τὸν καιρόν
  choice: naquele tempo
  rationale: Refere-se ao período narrado e já evocado pelo autor; “naquele tempo” é idiomático em português nesse contexto retrospectivo.
- source_word: ὑπὲρ τῆς καλοκἀγαθίας
  choice: por causa da nobreza e da bondade
  rationale: καλοκἀγαθία reúne os conceitos de nobreza e bondade ou excelência moral. A formulação dupla preserva essa amplitude sem impor um termo teológico técnico.
- source_word: μετὰ τῆς μητρός
  choice: com sua mãe
  rationale: Expressa de modo natural que os homens participaram da mesma morte juntamente com a mãe.
- source_word: τῶν δὲ τιμῶν μακαρισμῷ ὤν
  choice: e, quanto às honras, proclamá-los bem-aventurados
  rationale: A frase grega é condensada e sintaticamente difícil. A tradução conserva o contraste com “quanto às virtudes” e verte μακαρισμός como uma declaração pública de bem-aventurança.
theological_decisions:
- issue: Sentido de καλοκἀγαθία no contexto do martírio
  choice: nobreza e bondade
  alternative: virtude; excelência moral
  rationale: O termo pertence ao vocabulário ético grego e combina caráter nobre com bondade moral. A tradução mantém ambos os aspectos sem convertê-lo em categoria doutrinária posterior.
- issue: Força de μακαρισμός
  choice: proclamá-los bem-aventurados
  alternative: declará-los felizes; honrá-los com uma bênção
  rationale: “Bem-aventurados” comunica a atribuição solene de uma condição digna de congratulação, sem sugerir que o narrador esteja conferindo uma bênção eficaz.
- issue: Referência masculina de ἄνδρας
  choice: os homens
  alternative: aqueles; as pessoas
  rationale: O substantivo grego identifica especificamente os filhos homens que morreram com a mãe; a referência de gênero foi preservada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela “quanto às virtudes... quanto às honras” conserva a retórica do grego; “cabe-me” mantém a ideia de incumbência sem excessiva solenidade.
