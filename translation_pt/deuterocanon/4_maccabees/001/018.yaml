  text: And the forms of wisdom are prudence and justice and courage and self-control[a].
translation:
  language: pt
  text: E as formas da sabedoria são a prudência, a justiça[a], a coragem e o domínio próprio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «retidão». Aqui, por se tratar de uma lista de virtudes, prefere-se «justiça» para δικαιοσύνη.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴδεα
  choice: formas
  rationale: O termo designa aqui as formas ou modalidades constitutivas pelas quais a sabedoria se manifesta; «formas» mantém proximidade com o grego sem impor uma explicação adicional.
- source_word: καθεστᾶσιν
  choice: são
  rationale: Neste enunciado em forma de lista, o verbo tem força copulativa e indica identidade estabelecida; «são» é a expressão portuguesa mais natural.
- source_word: φρόνησις
  choice: prudência
  rationale: Na enumeração clássica das virtudes, o termo denota discernimento prático; «prudência» preserva o registro ético-filosófico.
- source_word: δικαιοσύνη
  choice: justiça
  rationale: Neste catálogo de virtudes, o sentido ético de justiça é mais provável que o sentido mais amplo de retidão; a alternativa é preservada em nota.
- source_word: ἀνδρία
  choice: coragem
  rationale: É o equivalente moderno, claro e não marcado pelo gênero para a virtude da bravura ou fortaleza.
- source_word: σωφροσύνη
  choice: domínio próprio
  rationale: O termo indica moderação e controle disciplinado dos impulsos; «domínio próprio» é corrente, claro e digno em português.
theological_decisions:
- issue: Tradução de δικαιοσύνη numa lista filosófica de virtudes
  choice: justiça
  alternative: retidão
  rationale: O contexto imediato é a enumeração das virtudes cardeais gregas, favorecendo «justiça». Como δικαιοσύνη também pode expressar «retidão» em contextos bíblicos, essa possibilidade permanece registrada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Mantém-se o tom conciso e ético-filosófico do original; os artigos definidos tornam a enumeração idiomática em português.
