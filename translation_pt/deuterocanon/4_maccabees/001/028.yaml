  yaml_path: translation/deuterocanon/4_maccabees/001/028.yaml
  text: Therefore[a], just as pleasure and pain are two growths of the body and the soul, many passions are offshoots of these[b];
translation:
  language: pt
  text: Assim, tal como o prazer e a dor são dois brotos[a] do corpo e da alma, muitas paixões[b] são ramificações deles;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “plantas” ou “rebentos”; o grego mantém uma imagem botânica ao longo de toda a frase.
    reason: lexical_alternative
  - marker: b
    text: Ou “emoções” ou “afetos”; neste escrito, a palavra grega pode indicar as paixões ou os impulsos emocionais que a razão deve governar.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ οὖν
  choice: Assim, tal como
  rationale: “Assim” preserva a continuidade inferencial de οὖν, e “tal como” introduz naturalmente a comparação expressa por καθάπερ.
- source_word: δυοῖν
  choice: dois
  rationale: 'O dual grego indica precisamente dois elementos: o prazer e a dor.'
- source_word: τοῦ σώματος καὶ τῆς ψυχῆς
  choice: do corpo e da alma
  rationale: Mantém o par antropológico do grego e liga os genitivos aos “brotos”, sem acrescentar uma definição doutrinária de ψυχή.
- source_word: φυτῶν
  choice: brotos
  rationale: A escolha preserva a imagem botânica que continua em παραφυάδες e soa natural em português no uso metafórico.
- source_word: ἡδονῆς τε καὶ πόνου
  choice: o prazer e a dor
  rationale: É o par filosófico direto e reconhecível que designa as duas experiências afetivas básicas do argumento.
- source_word: τῶν παθῶν
  choice: paixões
  rationale: Neste contexto filosófico, πάθη designa paixões ou impulsos afetivos sujeitos ao governo da razão, e não apenas sofrimentos.
- source_word: παραφυάδες
  choice: ramificações
  rationale: Conserva a metáfora vegetal e expressa que as demais paixões derivam do prazer e da dor.
theological_decisions:
- issue: Sentido antropológico de σώματος καὶ ψυχῆς
  choice: do corpo e da alma
  alternative: do corpo e da vida
  rationale: O contexto filosófico e o paralelismo favorecem “alma”, preservando a estrutura conceitual do autor sem lhe impor precisão doutrinária posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora botânica foi preservada por meio de “brotos” e “ramificações”; o ponto e vírgula mantém a continuidade sintática do trecho.
