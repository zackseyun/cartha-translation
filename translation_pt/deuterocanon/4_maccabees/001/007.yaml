lexical_decisions:
- source_word: Πολλαχόθεν ... καὶ ἀλλαχόθεν
  choice: por muitos ângulos e por diferentes caminhos
  rationale: A expressão conserva a duplicação retórica dos advérbios gregos e comunica, em português natural, a variedade de pontos de partida e linhas de argumentação.
- source_word: ἔχοιμʼ ἂν
  choice: eu poderia
  rationale: O optativo com ἄν expressa possibilidade; “poderia” reproduz essa força sem transformar a afirmação em certeza ou promessa.
- source_word: ἐπιδεῖξαι
  choice: demonstrar
  rationale: No contexto argumentativo, “demonstrar” transmite melhor do que “mostrar” a apresentação de razões, sem necessariamente impor o sentido técnico de prova conclusiva.
- source_word: αὐτοκράτωρ
  choice: é soberana sobre
  rationale: O termo indica autoridade plena ou domínio. “É soberana sobre” preserva a metáfora de governo e forma uma construção natural com “as paixões”.
- source_word: τῶν παθῶν
  choice: sobre as paixões
  rationale: Neste tratado, πάθη designa desejos, impulsos e afetos sujeitos ao governo da razão; “paixões” preserva esse campo filosófico sem reduzi-lo apenas a emoções.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: a razão piedosa
  rationale: “Razão” representa o sentido filosófico-moral de λογισμός, e “piedosa” conserva a orientação religiosa de εὐσεβής sem introduzir uma categoria teológica posterior.
theological_decisions:
- issue: Sentido da expressão programática ὁ εὐσεβὴς λογισμός
  choice: a razão piedosa
  alternative: a razão reverente a Deus
  rationale: A formulação escolhida preserva de modo conciso tanto a dimensão racional quanto a religiosa. A alternativa explicita o objeto da reverência, que está implícito no contexto, mas não é nomeado diretamente nesta expressão grega.
- issue: Relação entre a razão piedosa e as paixões
  choice: é soberana sobre as paixões
  alternative: domina as paixões
  rationale: “Soberana” mantém a força governante de αὐτοκράτωρ sem afirmar que as paixões são eliminadas; elas permanecem presentes, mas sob autoridade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem da frase foi ajustada para fluidez, sem eliminar a força potencial de “eu poderia” nem a metáfora de governo presente no grego.
