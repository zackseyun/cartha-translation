base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/017.yaml
  text: This[a], then, is the instruction of the law[b], by which we learn divine matters reverently and human matters profitably.
translation:
  language: pt
  text: Esta, portanto, é a instrução[a] da lei, por meio da qual aprendemos com reverência as realidades divinas e, de modo proveitoso, as realidades humanas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “formação” ou “disciplina”. A palavra grega παιδεία inclui a ideia de educação que forma o caráter e a conduta.
    reason: lexical_alternative
  - marker: b
    text: Ou “as coisas divinas ... as coisas humanas”. O grego contrapõe amplamente o âmbito divino ao humano.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη δὴ τοίνυν
  choice: Esta, portanto,
  rationale: A expressão é enfática e transitiva; esta formulação conserva a retomada do argumento e soa natural em português.
- source_word: ἡ τοῦ νόμου παιδεία
  choice: a formação da lei
  rationale: παιδεία abrange instrução, disciplina e educação formativa, especialmente moral. “Formação” preserva essa amplitude melhor que uma referência apenas à transmissão de conhecimentos, enquanto “da lei” mantém a relação genitiva do grego.
- source_word: διʼ ἧς
  choice: por meio da qual
  rationale: Expressa claramente o sentido instrumental da expressão grega.
- source_word: τὰ θεῖα
  choice: as realidades divinas
  rationale: O neutro plural designa amplamente aquilo que pertence ao âmbito divino, sem exigir a especificação interpretativa “as coisas de Deus”.
- source_word: σεμνῶς
  choice: com reverência
  rationale: O advérbio comunica seriedade, dignidade e reverência, sentido apropriado ao aprendizado das realidades divinas.
- source_word: τὰ ἀνθρώπινα
  choice: as realidades humanas
  rationale: Mantém o contraste amplo e paralelo com τὰ θεῖα, sem restringir a expressão a um tipo específico de assunto humano.
- source_word: συμφερόντως
  choice: de modo proveitoso
  rationale: Expressa aquilo que é útil, benéfico ou vantajoso, em português natural e sem sugerir necessariamente lucro material.
- source_word: μανθάνομεν
  choice: aprendemos
  rationale: Conserva o presente gnômico e a formulação direta do grego.
theological_decisions:
- issue: Sentido de νόμος neste contexto
  choice: lei
  alternative: Lei / Torá
  rationale: Embora o contexto de 4 Macabeus aponte para a lei judaica, o grego traz simplesmente νόμος. A forma “lei”, sem explicitação ou maiúscula interpretativa, preserva a redação da fonte e permite que o contexto identifique o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação conserva o paralelismo entre os âmbitos divino e humano e evita especificar além do grego.
