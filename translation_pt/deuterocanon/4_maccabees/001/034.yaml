base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/034.yaml
  text: Therefore[a], though we desire creatures from the water, birds[b], and four-footed animals—all kinds of food forbidden to us by the law—we abstain because of the mastery of reason.
translation:
  language: pt
  text: Portanto, embora desejemos animais aquáticos[a], aves e animais de quatro patas — todos os tipos de alimentos que nos são proibidos pela Lei —, abstemo-nos por causa do domínio da razão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seres que vivem na água”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “por causa da supremacia da razão” ou “do domínio da razão”. A expressão reflete a tese central do livro de que a razão disciplinada, formada pela Lei, governa os desejos do corpo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιγαροῦν
  choice: Portanto
  rationale: Partícula inferencial que apresenta uma conclusão decorrente do argumento anterior; “Portanto” preserva essa força lógica em português natural.
- source_word: ἐνύδρων
  choice: animais aquáticos
  rationale: O termo designa seres animais que vivem na água. A tradução é clara e abrangente, sem restringir o sentido apenas a peixes.
- source_word: ἐπιθυμοῦντες
  choice: embora desejemos
  rationale: O particípio exprime um desejo real em contraste com a abstinência; a formulação concessiva torna explícita essa relação contextual sem eliminar a tensão do original.
- source_word: ὀρνέων
  choice: aves
  rationale: Equivalente corrente e digno para o termo geral grego que designa pássaros e outras aves.
- source_word: τετραπόδων
  choice: animais de quatro patas
  rationale: Preserva a imagem concreta do grego e é mais imediatamente compreensível ao leitor comum do que “quadrúpedes”.
- source_word: παντοίων βρωμάτων
  choice: todo tipo de alimento
  rationale: Mantém o alcance abrangente da expressão grega e funciona naturalmente como explicação das categorias mencionadas.
- source_word: τῶν ἀπηγορευμένων ἡμῖν κατὰ τὸν νόμον
  choice: que nos é proibido pela Lei
  rationale: Expressa com concisão que esses alimentos são proibidos em conformidade com a Lei; a inicial maiúscula identifica, pelo contexto, a Lei judaica.
- source_word: ἀπέχομεθα
  choice: abstemo-nos
  rationale: Verbo preciso para a decisão ética e alimentar de não consumir aquilo que se deseja.
- source_word: διὰ τὴν τοῦ λογισμοῦ ἐπικράτειαν
  choice: por causa do domínio da razão
  rationale: Conserva tanto a relação causal quanto a ideia central de que a razão exerce poder governante sobre os desejos.
theological_decisions:
- issue: Sentido de λογισμός no argumento filosófico-teológico de 4 Macabeus
  choice: razão
  alternative: juízo racional
  rationale: '“Razão” é a tradução mais concisa e consistente para o conceito central do livro: a capacidade racional disciplinada pela Lei que governa as paixões. “Juízo racional” explicitaria uma nuance legítima, mas tornaria o termo-chave menos direto.'
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto conserva tom argumentativo e digno, usa “animais de quatro patas” em vez do mais técnico “quadrúpedes” e mantém “razão” como termo-chave ao longo da obra.
