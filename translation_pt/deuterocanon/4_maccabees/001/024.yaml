  text: A ira é uma paixão comum ao prazer e à dor, se alguém refletir sobre a ocasião em que ela o acometeu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμός
  choice: ira
  rationale: No contexto da análise das paixões, designa a ira ou cólera; “ira” é natural, digna e precisa em português.
- source_word: κοινὸν πάθος
  choice: uma paixão comum
  rationale: Preserva a ideia de uma paixão compartilhada pelo prazer e pela dor, sem tornar a relação mais específica do que o grego.
- source_word: ἡδονῆς καὶ πόνου
  choice: ao prazer e à dor
  rationale: Mantém a coordenação e a abstração dos dois genitivos gregos.
- source_word: ἐὰν ἐννοηθῇ τις
  choice: se alguém refletir
  rationale: Expressa de modo idiomático a construção grega, cujo sentido é considerar ou trazer à mente.
- source_word: ὅτε αὐτῷ περιέπεσεν
  choice: sobre a ocasião em que ela o acometeu
  rationale: “Ocasião” comunica o valor contextual de ὅτε, enquanto “acometeu” preserva a ideia de a paixão sobrevir à pessoa.
