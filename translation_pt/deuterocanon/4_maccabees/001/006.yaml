base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/006.yaml
  text: For reason does not rule over one's own passions[a], but over those things opposed to justice and courage and self-control and prudence; and over these, not so as to destroy them, but so as not to yield to them.
translation:
  language: pt
  text: Pois a razão não domina as paixões que lhe são próprias, mas as que se opõem à justiça[a], à coragem, ao domínio próprio e à prudência; e domina estas não para destruí-las, mas para não ceder a elas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “retidão”.'
    reason: Alternativa lexical para δικαιοσύνη; “justiça” foi preferido por se tratar de uma lista filosófica de virtudes.
lexical_decisions:
- source_word: λογισμός
  choice: razão
  rationale: Designa aqui a faculdade de deliberar racionalmente, termo central no argumento filosófico de 4 Macabeus.
- source_word: κρατεῖ
  choice: domina
  rationale: Expressa exercício de poder ou senhorio sobre as paixões; a repetição implícita do verbo na segunda oração foi explicitada para clareza em português.
- source_word: πάθη
  choice: paixões
  rationale: No contexto ético-filosófico, refere-se a impulsos e afetos, não a sofrimentos.
- source_word: δικαιοσύνη
  choice: justiça
  rationale: No catálogo helenístico das quatro virtudes, “justiça” é mais adequado ao contexto do que o sentido religioso mais específico que “retidão” poderia sugerir.
- source_word: ἀνδρεία
  choice: coragem
  rationale: Comunica de modo atual e não marcado pelo gênero a virtude da valentia ou fortaleza.
- source_word: σωφροσύνη
  choice: domínio próprio
  rationale: Expressa a autodisciplina moral da σωφροσύνη em linguagem clara e corrente.
- source_word: φρόνησις
  choice: prudência
  rationale: Preserva o sentido de sabedoria prática e o registro de uma lista clássica de virtudes.
- source_word: καταλῦσαι
  choice: destruí-las
  rationale: Mantém a força do verbo, que aqui indica eliminar ou desfazer as paixões contrárias às virtudes.
- source_word: μὴ εἴξαι
  choice: não ceder a elas
  rationale: Reproduz diretamente a ideia de não dar lugar nem se render às paixões.
theological_decisions:
- issue: Sentido de δικαιοσύνη em uma lista helenística de virtudes
  choice: justiça
  alternative: retidão
  rationale: O contexto imediato apresenta as quatro virtudes cardeais em uma argumentação filosófica sobre razão e paixões; “justiça” corresponde melhor a esse enquadramento, sem excluir a alternativa lexical indicada em nota.
- issue: A afirmação de que a razão não domina “as paixões que lhe são próprias”
  choice: preservar a formulação reflexiva do grego
  alternative: generalizar como “todas as paixões” ou reinterpretar o referente
  rationale: O texto grego contém ἑαυτοῦ e produz uma tensão conceitual genuína. A tradução evita resolvê-la silenciosamente, mantendo a referência às paixões próprias da razão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção reflexiva potencialmente difícil foi mantida por fidelidade à ambiguidade conceitual do grego; a elipse de κρατεῖ foi suprida na segunda oração para fluência.
