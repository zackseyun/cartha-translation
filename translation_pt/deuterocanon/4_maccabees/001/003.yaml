    text: 'Ou: “se de fato a razão parece prevalecer sobre as paixões que constituem obstáculos para os que exercem autocontrole”. A expressão grega com σωφρονούντων é condensada e admite essa tradução mais formal, embora menos clara em português.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ ἄρα
  choice: se, então
  rationale: Preserva tanto a força condicional de εἰ como a nuance inferencial e conectiva de ἄρα, em português natural.
- source_word: τῶν σωφρονούντων
  choice: que impedem o autocontrole
  rationale: A expressão grega é condensada e sintaticamente difícil em sua relação com κωλυτικῶν παθῶν. A formulação funcional explicita o provável sentido de paixões que se opõem ao autocontrole, sem ocultar a alternativa mais formal, registrada em nota.
- source_word: κωλυτικῶν παθῶν
  choice: as paixões que impedem
  rationale: κωλυτικός indica aquilo que impede ou obstrui, e πάθη designa paixões ou impulsos. A oração relativa é clara e natural em português.
- source_word: ὁ λογισμός
  choice: a razão
  rationale: Em 4 Macabeus, λογισμός é um termo filosófico central para o juízo racional. “A razão” mantém a concisão e o peso conceitual do argumento.
- source_word: φαίνεται ἐπικρατεῖν
  choice: fica evidente que ... é capaz de dominar
  rationale: φαίνεται pode significar “parece” ou “mostra-se”, enquanto ἐπικρατεῖν expressa prevalecer ou dominar. A escolha comunica o tom demonstrativo do argumento sem tratá-lo como mera impressão.
- source_word: γαστριμαργίας
  choice: a gula
  rationale: O termo denota apetite excessivo, sobretudo por comida; “gula” é o equivalente português direto e consagrado.
- source_word: ἐπιθυμίας
  choice: o desejo
  rationale: ἐπιθυμία tem sentido amplo de desejo ou anseio. “Desejo” evita restringi-lo indevidamente ao desejo sexual.
theological_decisions:
- issue: Sentido filosófico-antropológico de λογισμός em 4 Macabeus
  choice: a razão
  alternative: o juízo racional; a faculdade racional
  rationale: O versículo sustenta a capacidade da razão disciplinada de prevalecer sobre as paixões. “A razão” preserva a afirmação filosófica sem introduzir terminologia técnica posterior.
- issue: Sentido de σωφρονούντων na expressão grega condensada
  choice: entendido funcionalmente como referência ao autocontrole impedido pelas paixões
  alternative: entendido mais formalmente como “dos que exercem autocontrole”
  rationale: Uma reprodução estritamente formal seria obscura em português e deixaria incerta a relação do genitivo com κωλυτικῶν παθῶν. O texto principal explicita a leitura contextual provável, enquanto a nota preserva a ambiguidade real.
