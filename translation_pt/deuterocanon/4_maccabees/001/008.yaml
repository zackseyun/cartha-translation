  text: But I could prove this far more from the courage of Eleazar, the seven brothers, and their mother, who died for the sake of virtue.
translation:
  language: pt
  text: Mas eu poderia demonstrar isso muito mais a partir da coragem de Eleazar, dos sete irmãos e da mãe deles, que morreram pela virtude.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολὺ δὲ πλέον
  choice: Mas... muito mais
  rationale: Mantém a transição adversativa e a intensificação comparativa do grego, com ordem natural em português.
- source_word: ἀποδείξαιμι
  choice: eu poderia demonstrar
  rationale: Reproduz o valor potencial do optativo e o sentido argumentativo de provar ou demonstrar.
- source_word: ἀνδραγαθείας
  choice: coragem
  rationale: No contexto do martírio, designa bravura ou valor heroico; “coragem” é clara, digna e não marcada por gênero em português moderno.
- source_word: ὑπὲρ ἀρετῆς ἀποθανόντων
  choice: que morreram por causa da virtude
  rationale: Expressa que a morte ocorreu em defesa ou em favor da virtude, preservando a formulação ampla do texto sem especificar além do grego.
- source_word: τῆς τούτων μητρός
  choice: da mãe deles
  rationale: Representa literalmente a relação indicada por τούτων e soa natural em português.
theological_decisions:
- issue: Sentido de ἀρετή
  choice: virtude
  alternative: excelência moral / fidelidade religiosa
  rationale: “Virtude” preserva a amplitude ética e filosófica do termo no argumento de 4 Macabeus, sem reduzi-lo a uma doutrina específica.
- issue: Relação de ὑπέρ com a morte
  choice: por causa da virtude
  alternative: em defesa da virtude
  rationale: A escolha mantém aberta a nuance entre causa, compromisso e defesa; “em defesa de” tornaria a finalidade mais explícita do que o necessário.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A frase conserva o tom argumentativo e filosófico do original, evitando tanto arcaísmo quanto paráfrase excessiva.
