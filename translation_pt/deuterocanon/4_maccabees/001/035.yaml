base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/035.yaml
  text: For the passions of desires are held in check[a], being turned back by the self-controlled mind; and all the body's impulses are governed by reason.
translation:
  language: pt
  text: Pois as paixões dos desejos são contidas, sendo feitas recuar pela mente autocontrolada; e todos os impulsos do corpo são governados pela razão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e todos os movimentos do corpo são levados pela razão a buscar a honra”. O verbo grego é incomum neste contexto e normalmente traz a ideia de aspirar com empenho ou amar a honra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντέχεται
  choice: são contidas
  rationale: O verbo expressa resistência ou contenção; com o sujeito neutro plural τὰ πάθη, o singular grego é regular. A escolha comunica que as paixões são refreadas, não eliminadas.
- source_word: τὰ τῶν ὀρέξεων πάθη
  choice: as paixões dos desejos
  rationale: Mantém a estrutura conceitual do grego, em que πάθη são paixões ou afecções e ὀρέξεις são desejos ou apetites, sem fundir os dois termos.
- source_word: τοῦ σώφρονος νοὸς
  choice: pela mente que tem domínio próprio
  rationale: σώφρων reúne sensatez, moderação e autocontrole. A formulação é natural em português e preserva a dimensão moral e racional.
- source_word: ἀνακαμπτόμενα
  choice: repelidas
  rationale: O particípio evoca algo dobrado ou feito voltar para trás. “Repelidas” preserva a imagem de reversão e evita a repetição de “contidas”.
- source_word: τὰ τοῦ σώματος κινήματα
  choice: todos os impulsos do corpo
  rationale: κινήματα pode indicar movimentos, agitações ou impulsos. No contexto da psicologia moral do livro, “impulsos” comunica melhor os movimentos internos ligados ao corpo.
- source_word: φιλοτιμοῦνται
  choice: são governados
  rationale: No contexto, a formulação comunica a ação ordenadora da razão de modo claro; como o verbo grego é incomum aqui e normalmente envolve zelo, aspiração ou amor à honra, essa nuance é preservada em nota.
- source_word: τοῦ λογισμοῦ
  choice: pela razão
  rationale: λογισμός é termo central no argumento de 4 Macabeus e designa a razão ou o juízo racional.
theological_decisions:
- issue: Linguagem antropológica da psicologia moral
  choice: A razão contém as paixões e governa os impulsos corporais.
  alternative: Explicitar os impulsos como pecaminosos ou empregar categorias doutrinárias posteriores.
  rationale: O texto trabalha com categorias da filosofia moral judaico-helenística. A tradução mantém esse universo conceitual sem acrescentar a ideia de “natureza pecaminosa” nem afirmar a eliminação das paixões.
- issue: Sentido incomum de φιλοτιμοῦνται
  choice: Traduzir no texto como “são governados” e registrar a nuance de honra e aspiração em nota.
  alternative: “São levados a buscar a honra” ou “esforçam-se honrosamente”.
  rationale: A construção com os movimentos do corpo é incomum e admite mais de uma compreensão. O texto principal prioriza a coerência contextual, enquanto a nota conserva a ambiguidade lexical genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preserva-se a linguagem de psicologia moral do original; a alternativa lexical de φιλοτιμοῦνται é explicitada sem sobrecarregar o texto principal.
