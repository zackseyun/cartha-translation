  yaml_path: translation/deuterocanon/4_maccabees/001/009.yaml
  text: For all these[a], having disregarded the pain even unto death[b], demonstrated that reason rules over the passions.
translation:
  language: pt
  text: Pois todos eles, tendo desprezado o sofrimento que chegava até a morte[a], demonstraram que a razão domina as paixões[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tendo feito pouco caso do sofrimento que chegava até a morte”.'
    reason: Alternativa lexical para ὑπεριδόντες; mantém a relação do sofrimento com o limite indicado por ἕως θανάτου.
  - marker: b
    text: 'Ou: “o juízo racional exerce domínio sobre as paixões”.'
    reason: Alternativa que explicita a nuance de λογισμός e a força de περικρατεῖ.
lexical_decisions:
- source_word: ἅπαντες ... οὗτοι
  choice: todos eles
  rationale: Reproduz o alcance inclusivo de ἅπαντες e a referência demonstrativa de οὗτοι sem acrescentar uma identificação que depende do contexto anterior.
- source_word: πόνον
  choice: sofrimento
  rationale: No contexto de tortura e morte, designa a dor ou aflição suportada; “sofrimento” é natural e suficientemente abrangente em português.
- source_word: ἕως θανάτου
  choice: que se estendia até a morte
  rationale: Expressa o limite extremo indicado pelo grego e evita sugerir explicitamente o martírio, que é fornecido pelo contexto.
- source_word: ὑπεριδόντες
  choice: tendo desprezado
  rationale: Conserva a ideia de considerar o sofrimento como algo sem poder decisivo sobre eles; em português, é mais idiomático do que reproduzir literalmente a imagem de “olhar de cima”.
- source_word: ἐπεδείξαντο
  choice: demonstraram
  rationale: 'Preserva o tom argumentativo: a conduta dessas pessoas é apresentada como evidência da tese do autor.'
- source_word: περικρατεῖ
  choice: domina
  rationale: Comunica superioridade e exercício de poder sobre algo, de maneira forte e natural.
- source_word: τῶν παθῶν
  choice: as paixões
  rationale: Mantém o sentido filosófico dos impulsos e afetos que podem se opor ao juízo racional, sem reduzi-los simplesmente a emoções.
- source_word: ὁ λογισμός
  choice: a razão
  rationale: É a formulação concisa e corrente para a capacidade de julgamento racional que ocupa lugar central no argumento de 4 Macabeus.
theological_decisions:
- issue: Como traduzir ὁ λογισμός sem importar categorias teológicas posteriores
  choice: a razão
  alternative: o juízo racional
  rationale: “A razão” preserva a afirmação filosófico-moral do texto de que a racionalidade disciplinada domina as paixões, sem identificá-la indevidamente com revelação, consciência ou outra categoria doutrinária.
- issue: Se o contexto de martírio deve ser explicitado em ἕως θανάτου πόνον
  choice: o sofrimento que se estendia até a morte
  alternative: o sofrimento mortal
  rationale: A tradução mantém a formulação e a extensão do sofrimento dadas pelo grego, deixando que o contexto identifique os acontecimentos como martírio.
- issue: Força de ὑπεριδόντες diante do sofrimento
  choice: tendo desprezado
  alternative: não fazendo caso de
  rationale: A opção principal conserva a atitude de superioridade ou desconsideração expressa pelo verbo, sem afirmar que os sofrimentos não foram sentidos.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção argumentativa clara. “Paixões” conserva o vocabulário filosófico do livro; as notas registram alternativas relevantes sem resolver além do grego a relação entre sofrimento e morte.
