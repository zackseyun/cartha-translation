  yaml_path: translation/deuterocanon/4_maccabees/001/002.yaml
  text: For the discourse is indeed necessary for understanding[b][a], and it contains praise of the greatest virtue—I mean prudence.
translation:
  language: pt
  text: Pois a exposição sobre isso é, de fato, necessária para o conhecimento[a] e contém o elogio da maior virtude — refiro-me à prudência[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a compreensão”. A expressão grega εἰς ἐπιστήμην admite ambos os sentidos.
    reason: lexical_alternative
  - marker: b
    text: Ou “sabedoria prática”. O grego φρόνησις indica discernimento moral prudente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖος
  choice: necessário
  rationale: Preserva a ideia de necessidade, e não apenas de utilidade, em linguagem portuguesa natural.
- source_word: εἰς ἐπιστήμην
  choice: para o conhecimento
  rationale: ἐπιστήμη designa conhecimento ou compreensão de caráter disciplinado; “para o conhecimento” mantém de modo conciso a finalidade intelectual expressa pelo grego.
- source_word: λόγος
  choice: discurso
  rationale: Neste contexto, λόγος se refere à exposição argumentativa em curso, não a uma palavra isolada.
- source_word: τῆς μεγίστης ἀρετῆς
  choice: da maior virtude
  rationale: Mantém o vocabulário moral-filosófico do texto, no qual ἀρετή denota virtude ou excelência.
- source_word: φρονήσεως
  choice: prudência
  rationale: “Prudência” é uma tradução filosófica estabelecida para φρόνησις e comunica discernimento moral aplicado, sem reduzir o termo a mera cautela.
- source_word: περιέχει ἔπαινον
  choice: contém o elogio
  rationale: Reproduz com clareza a afirmação de que o discurso inclui louvor à virtude nomeada.
theological_decisions:
- issue: Tradução da terminologia filosófica da virtude sem impor categorias doutrinárias posteriores
  choice: Usar “virtude” e “prudência” em seu sentido moral-filosófico
  alternative: Usar termos mais amplos, como “excelência” e “sabedoria prática”
  rationale: A abertura de 4 Macabeus emprega um registro filosófico. Esses termos preservam o universo conceitual do autor sem acrescentar uma leitura confessional específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi mantida fluente, e os travessões destacam a explicação do próprio autor. Os marcadores foram colocados junto aos termos a que suas notas efetivamente se referem.
