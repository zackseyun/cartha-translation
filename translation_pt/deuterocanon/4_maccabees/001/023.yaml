  text: Before pain there is fear[a], and after pain, grief.
translation:
  language: pt
  text: Antes da dor vem o medo; depois da dor, a tristeza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o pesar» ou «a aflição».
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ
  choice: antes de
  rationale: A preposição temporal indica aquilo que antecede a dor; «antes de» é a forma mais clara e natural em português.
- source_word: πόνου / τὸν πόνον
  choice: dor
  rationale: Embora πόνος também possa significar esforço ou sofrimento, a sequência aforística — medo antes e tristeza depois — favorece o sentido experiencial de «dor».
- source_word: φόβος
  choice: medo
  rationale: Equivalente português corrente e semanticamente neutro de φόβος; «pavor» ou «temor» acrescentariam intensidade ou tom não exigidos pelo grego.
- source_word: μετὰ
  choice: depois de
  rationale: Com o acusativo, a preposição tem sentido temporal e assinala o que se segue à experiência da dor.
- source_word: λύπη
  choice: tristeza
  rationale: λύπη pode designar tristeza, pesar, aflição ou dor emocional. «Tristeza» preserva a amplitude do termo e soa natural na formulação concisa.
theological_decisions: []
translation_notes:
  register: Formulação breve, proverbial e dignificada, em português moderno de ampla compreensão. O verbo «vem», implícito no grego nominal, torna a frase natural sem alterar a relação temporal. O marcador [a] aparece no texto principal.
