  text: but it also is shown to rule over the passions that hinder righteousness[a], such as malice, and over the passions that hinder courage—anger, pain, and fear.
translation:
  language: pt
  text: mas também se mostra capaz de dominar as paixões que impedem a justiça[a], como a maldade, e as paixões que impedem a coragem — a ira, a dor e o medo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «retidão».'
    reason: Alternativa lexical para δικαιοσύνη; «justiça» é apropriado no contexto das virtudes, mas o termo pode abranger retidão moral.
lexical_decisions:
- source_word: κυριεύειν
  choice: dominar
  rationale: Expressa exercer controle ou senhorio sobre algo; “dominar” é natural em português e preserva a ideia de prevalecer sobre as paixões.
- source_word: ἀναφαίνεται
  choice: se mostra capaz de
  rationale: No argumento, o verbo indica que algo se torna evidente. A construção com o infinitivo κυριεύειν pede em português uma formulação que deixe clara a capacidade demonstrada de dominar.
- source_word: ἐμποδιστικῶν
  choice: que impedem
  rationale: A oração relativa é mais natural que “impeditivas” e preserva o sentido de obstruir a virtude mencionada.
- source_word: παθῶν
  choice: paixões
  rationale: No contexto filosófico, refere-se a impulsos ou afetos que podem dominar a conduta, não primariamente a sofrimentos externos.
- source_word: δικαιοσύνης
  choice: justiça
  rationale: Nesta enumeração de virtudes éticas, “justiça” é o equivalente mais direto e natural de δικαιοσύνη, sem excluir a dimensão de retidão moral.
- source_word: κακοηθείας
  choice: maldade
  rationale: O termo designa má índole ou disposição perversa; “maldade” é claro, corrente e suficientemente amplo.
- source_word: ἀνδρείας
  choice: coragem
  rationale: Na linguagem helenística das virtudes, designa coragem ou bravura; a escolha evita uma formulação de gênero desnecessária.
- source_word: θυμοῦ
  choice: ira
  rationale: Na lista de paixões que impedem a coragem, o termo tem sentido negativo de cólera; “ira” mantém o registro digno do texto.
- source_word: πόνου
  choice: dor
  rationale: Entre as paixões que constituem obstáculos à coragem, “dor” é o sentido mais direto, embora o grego também possa referir-se a sofrimento ou penosidade.
- source_word: φόβου
  choice: medo
  rationale: É o equivalente básico e claro, adequado ao contraste com a coragem.
theological_decisions:
- issue: Tradução de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: O contexto é uma lista filosófica de virtudes, na qual δικαιοσύνη corresponde naturalmente à virtude da justiça. “Retidão” continua possível, mas poderia ampliar o termo para uma qualidade moral mais geral e reduzir a correspondência com a terminologia clássica das virtudes.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A coordenação e o travessão preservam a estrutura argumentativa e a enumeração do grego.
