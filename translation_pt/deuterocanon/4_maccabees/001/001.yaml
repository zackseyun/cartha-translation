base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/001.yaml
  text: Since I am about to demonstrate a most philosophical argument—whether devout reason is master of the passions—I would rightly advise you to give eager attention to philosophy[a].
translation:
  language: pt
  text: Como estou prestes a demonstrar uma questão sumamente filosófica — se a razão piedosa tem pleno domínio sobre as paixões —, eu os aconselharia, com razão, a prestar atenção com entusiasmo à filosofia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “se a razão piedosa é senhora das paixões” ou “exerce domínio absoluto sobre elas”.'
    reason: 'Registra alternativas para αὐτόδεσποτος: a metáfora concisa de autoridade e a explicitação de sua possível força intensiva.'
lexical_decisions:
- source_word: ΦΙΛΟΣΟΦΩΤΑΤΟΝ λόγον
  choice: um argumento sumamente filosófico
  rationale: λόγος designa aqui o argumento ou exposição que o autor apresentará; o superlativo φιλοσοφώτατον é preservado por “sumamente filosófico”, mantendo o tom retórico elevado.
- source_word: ἐπιδείκνυσθαι μέλλων
  choice: Ao me dispor a demonstrar
  rationale: Expressa a intenção iminente indicada por μέλλων e o sentido de expor ou demonstrar publicamente contido em ἐπιδείκνυσθαι.
- source_word: εἰ
  choice: se
  rationale: Introduz a questão indireta que será demonstrada. Em português, “se” é a forma natural e mantém o caráter investigativo da proposição.
- source_word: αὐτόδεσποτός
  choice: é senhora
  rationale: No contexto, o composto indica domínio independente ou pleno. “É senhora das paixões” preserva a metáfora de autoridade e permite registrar em nota a força possível de “domínio absoluto”.
- source_word: τῶν παθῶν
  choice: das paixões
  rationale: No vocabulário filosófico helenístico, πάθη se refere às paixões, afetos ou impulsos emocionais; “paixões” preserva esse campo conceitual.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: a razão piedosa
  rationale: “Razão” comunica a faculdade racional expressa por λογισμός, enquanto “piedosa” mantém a orientação religiosa de εὐσεβής sem transformar o conceito em racionalidade meramente secular.
- source_word: συμβουλεύσαιμʼ ἂν ὑμῖν ὀρθῶς
  choice: faria bem em aconselhá-los
  rationale: A construção com optativo e ἄν transmite uma recomendação cortês e ponderada; “faria bem” incorpora naturalmente o valor avaliativo de ὀρθῶς.
- source_word: ὅπως προθύμως προσέχητε
  choice: a prestar atenção, com entusiasmo
  rationale: προσέχω indica atenção, e προθύμως acrescenta disposição pronta, zelo ou entusiasmo.
- source_word: τῇ φιλοσοφίᾳ
  choice: à filosofia
  rationale: Mantém a formulação ampla do grego e o enquadramento filosófico que o próprio autor dá ao tratado.
theological_decisions:
- issue: Preservar em εὐσεβὴς λογισμός tanto a dimensão religiosa quanto a racional
  choice: a razão piedosa
  alternative: o raciocínio devoto
  rationale: “Razão piedosa” conserva a razão como faculdade governante e, ao mesmo tempo, sua orientação reverente a Deus, sem reduzir a expressão nem a racionalismo secular nem a mera devoção.
- issue: Expressar a extensão do domínio indicado por αὐτόδεσπος
  choice: é senhora das paixões
  alternative: exerce domínio absoluto sobre as paixões
  rationale: A formulação principal preserva a metáfora concisa do grego; a nota registra a possibilidade de explicitar a intensidade do composto como domínio absoluto, sem decidir além do que o termo exige no corpo do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O período longo e os travessões preservam a abertura retórica do tratado, enquanto “faria bem em aconselhá-los” evita rigidez excessivamente acadêmica.
