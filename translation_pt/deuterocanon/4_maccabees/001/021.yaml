lexical_decisions:
- source_word: παλαιαὶ
  choice: antigas
  rationale: Preserva a ideia de que essas sequências são antigas ou estabelecidas há muito tempo, sem acrescentar uma explicação ausente do grego.
- source_word: περὶ τὴν ἡδονὴν καὶ τὸν πόνον
  choice: relacionadas ao prazer e à dor
  rationale: περί com acusativo indica aqui referência ou esfera; a formulação é natural em português e mantém aberta a natureza exata dessa relação.
- source_word: παθῶν
  choice: de paixões
  rationale: No contexto filosófico de 4 Macabeus, πάθη designa paixões ou impulsos afetivos sujeitos ao governo da razão, e não simplesmente sofrimentos ou emoções em geral.
- source_word: ἀκολουθίαι
  choice: sequências
  rationale: Expressa a noção de elementos que se seguem em determinada ordem, sem impor a ideia causal mais forte de “consequências”.
theological_decisions:
- issue: Sentido filosófico-antropológico de πάθη em 4 Macabeus
  choice: paixões
  alternative: emoções; afetos
  rationale: “Paixões” conserva melhor a nuance filosófica dos impulsos afetivos que devem ser governados pela razão, sem reduzir o termo a sofrimento nem ampliá-lo a toda emoção.
