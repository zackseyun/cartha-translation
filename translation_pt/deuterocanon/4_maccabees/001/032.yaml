  yaml_path: translation/deuterocanon/4_maccabees/001/032.yaml
  text: Among desires, some are of the soul and others of the body; and over both of these, reason is evidently master.
translation:
  language: pt
  text: Entre os desejos, alguns são da alma, e outros, do corpo; e é evidente que a razão prevalece sobre ambos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a razão mostra-se superior a ambos”.'
    reason: Alternativa lexical para ἐπικρατεῖ φαίνεται, que explicita a ideia de superioridade preservando o valor de manifestação de φαίνεται.
lexical_decisions:
- source_word: ἐπιθυμιῶν
  choice: desejos
  rationale: “Desejos” mantém a amplitude de ἐπιθυμία e se ajusta à classificação filosófica do versículo sem lhe impor sentido exclusivamente negativo.
- source_word: ψυχικαί
  choice: da alma
  rationale: Preserva a categoria antropológica grega e o contraste explícito com “do corpo”, evitando termos técnicos ou potencialmente enganosos como “psíquicos”.
- source_word: σωματικαί
  choice: do corpo
  rationale: É o correspondente natural e paralelo de “da alma”, mantendo clara a oposição presente no grego.
- source_word: λογισμός
  choice: a razão
  rationale: Em 4 Macabeus, λογισμός designa a faculdade racional ou o juízo orientado pela razão; “a razão” é conciso, natural e coerente com o argumento filosófico da obra.
- source_word: ἐπικρατεῖ
  choice: prevalece sobre
  rationale: O verbo exprime domínio, superioridade ou vitória sobre algo. “Prevalece sobre” reproduz essa força sem acrescentar a metáfora pessoal de ser “senhora” ou “mestre”.
- source_word: φαίνεται
  choice: é evidente que
  rationale: A construção comunica que o predomínio da razão se mostra ou se torna manifesto. “É evidente que” expressa esse valor de maneira clara e idiomática em português.
theological_decisions:
- issue: Distinção antropológica entre ψυχικαί e σωματικαί
  choice: alguns desejos são “da alma”, e outros, “do corpo”
  alternative: alguns são mentais, e outros, corporais
  rationale: A formulação conserva as categorias do texto grego sem convertê-las numa psicologia moderna nem aprofundá-las em um dualismo doutrinário não explicitado.
- issue: Força de λογισμὸς ἐπικρατεῖ φαίνεται
  choice: é evidente que a razão prevalece sobre ambos
  alternative: a razão demonstra dominar ambos
  rationale: “Prevalece sobre” mantém a ideia de superioridade efetiva da razão, enquanto “é evidente” preserva a força de φαίνεται sem apresentar a afirmação como mais absoluta do que o grego exige.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. A vírgula em “e outros, do corpo” evita repetição desnecessária sem obscurecer a estrutura. O marcador [a] está ligado à oração cuja formulação alternativa a nota esclarece.
