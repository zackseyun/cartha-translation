  yaml_path: translation/deuterocanon/4_maccabees/001/030.yaml
  text: For reason is the guide of the virtues and the master of the passions. Therefore, I will first demonstrate through the restraining works of self-control that reason is self-governing over the passions.
translation:
  language: pt
  text: Pois a razão é guia das virtudes e senhora das paixões. Portanto, demonstrarei primeiro, por meio das ações restritivas do domínio próprio, que a razão é senhora absoluta das paixões[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “exerce domínio soberano sobre as paixões”.'
    reason: Registra uma formulação portuguesa alternativa para αὐτοδέσποτος, que exprime senhorio ou domínio absoluto e independente.
lexical_decisions:
- source_word: λογισμός
  choice: razão
  rationale: No contexto filosófico de 4 Macabeus, designa a faculdade racional ou o raciocínio que dirige a conduta; “razão” é natural, clara e mantém a repetição do termo.
- source_word: ἡγεμών
  choice: guia
  rationale: Expressa direção e liderança sem a conotação política mais estreita de “governante”.
- source_word: παθῶν
  choice: paixões
  rationale: Preserva o vocabulário filosófico para impulsos e afecções, sem reduzi-lo apenas a emoções no sentido moderno.
- source_word: αὐτοκράτωρ
  choice: senhora
  rationale: Comunica domínio efetivo sobre as paixões em português idiomático e mantém a metáfora de autoridade.
- source_word: σωφροσύνης
  choice: domínio próprio
  rationale: Neste contexto, refere-se à moderação ou autocontrole moral; “domínio próprio” é compreensível e adequado à argumentação ética.
- source_word: αὐτοδέσποτος
  choice: governa por si mesma
  rationale: Preserva o elemento reflexivo de αὐτο- e a ideia de autoridade independente, distinguindo-o de αὐτοκράτωρ na oração anterior.
theological_decisions:
- issue: Alcance da soberania da razão sobre as paixões
  choice: “governa por si mesma as paixões”
  alternative: “é soberana sobre as paixões”
  rationale: A formulação escolhida conserva a afirmação forte do autor e o componente de autogoverno de αὐτοδέσποτος, sem acrescentar uma doutrina posterior sobre autonomia moral absoluta.
- issue: Relação sintática de κωλυτικῶν com σωφροσύνης
  choice: “ações restritivas do domínio próprio” no texto, com nota de ambiguidade
  alternative: “ações que impedem o domínio próprio”
  rationale: O grego admite discussão quanto a se as ações exercem restrição própria da moderação ou se são obstáculos a ela; a nota evita resolver silenciosamente a tensão textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Mantiveram-se “razão”, “virtudes” e “paixões” para conservar o caráter filosófico do argumento. A repetição de “razão” reproduz a ênfase do grego.
