  text: Therefore[a], reason is a mind that, with right living, gives preference to the word of wisdom.
translation:
  language: pt
  text: Portanto, a razão é uma mente que, aliada a uma vida reta, dá preferência à palavra da sabedoria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ao princípio da sabedoria» ou «ao discurso da sabedoria». A palavra grega λόγος pode significar «palavra», «discurso», «explicação» ou «princípio».
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισμός
  choice: razão
  rationale: No contexto, o termo designa a faculdade de deliberar racionalmente; «razão» é conciso, natural e adequado ao caráter filosófico da definição.
- source_word: νοῦς
  choice: mente
  rationale: Refere-se à própria faculdade mental. «Mente» é claro e corrente, sem o tecnicismo adicional de «intelecto».
- source_word: μετὰ ὀρθοῦ βίου
  choice: acompanhada de uma vida correta
  rationale: A expressão associa a razão a um modo de viver moralmente reto. «Acompanhada de» explicita com naturalidade a relação de μετά, e «vida correta» conserva o alcance ético e existencial da frase.
- source_word: προτιμῶν
  choice: dá preferência a
  rationale: O particípio indica preferência ativa. A locução portuguesa preserva essa força comparativa sem exigir que se explicite um objeto alternativo não declarado.
- source_word: τὸν σοφίας λόγον
  choice: a palavra da sabedoria
  rationale: A formulação mantém a estrutura grega e preserva a amplitude de λόγος, que aqui pode indicar palavra, discurso, formulação racional ou princípio.
theological_decisions:
- issue: Traduzir a definição ético-filosófica sem restringir excessivamente o sentido de λόγος
  choice: a palavra da sabedoria
  alternative: o discurso da sabedoria; o princípio da sabedoria
  rationale: Como λόγος admite vários sentidos relacionados, a tradução principal conserva certa abertura sem impor um significado filosófico ou doutrinário mais estreito; a nota registra as principais alternativas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção definicional e a tensão entre faculdade racional, conduta ética e sabedoria foram preservadas.
