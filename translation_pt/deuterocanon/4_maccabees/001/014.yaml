  yaml_path: translation/deuterocanon/4_maccabees/001/014.yaml
  text: But let us determine what reason is[a], and what passion is, and how many kinds of passions there are[c][b], and whether reason rules over all these.
translation:
  language: pt
  text: Mas examinemos o que é a razão[a], o que é a paixão[b], quantas são as espécies de paixões e se a razão domina todas elas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “raciocínio” ou “juízo racional”.
    reason: lexical_alternative
  - marker: b
    text: Ou “emoção” ou “impulso”; aqui, o termo grego tem sentido filosófico e se refere às forças afetivas.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρίνωμεν
  choice: examinemos
  rationale: O subjuntivo exortativo convida o leitor a uma investigação conjunta. “Examinemos” é natural em português e abrange o ato de distinguir e determinar os conceitos.
- source_word: λογισμός
  choice: razão
  rationale: No argumento de 4 Macabeus, designa a faculdade de avaliação racional que pode exercer domínio sobre as paixões. “Razão” preserva de modo conciso o sentido filosófico.
- source_word: πάθος
  choice: paixão
  rationale: Neste contexto filosófico, refere-se a uma disposição afetiva ou impulso, não a sofrimento. “Paixão” conserva o contraste ético tradicional com a razão.
- source_word: πόσα παθῶν εἰδέα
  choice: quantas são as espécies de paixões
  rationale: εἰδέα indica espécies, classes ou formas. “Espécies” preserva com clareza o caráter classificatório da pergunta.
- source_word: ἐπικρατεῖ
  choice: domina sobre
  rationale: O verbo exprime predomínio ou senhorio. “Domina sobre” mantém a metáfora de governo sem reduzir o sentido ao mero controle psicológico.
- source_word: τούτων
  choice: todas elas
  rationale: O pronome retoma as paixões mencionadas e conserva de forma idiomática a referência inclusiva.
theological_decisions:
- issue: Contraste filosófico entre λογισμός e πάθος
  choice: razão ... paixão
  alternative: raciocínio ... emoção; juízo racional ... impulso
  rationale: A formulação mantém a tensão programática do livro entre a faculdade racional e os impulsos afetivos, sem impor terminologia psicológica moderna nem resolver antecipadamente a questão do domínio.
translation_notes:
