lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Mas também
  rationale: Preserva a transição e a ênfase adicional do grego sem tornar a expressão artificial em português.
- source_word: περὶ τούτου
  choice: sobre isso
  rationale: Mantém ampla a referência do demonstrativo e soa natural em português moderno.
- source_word: νῦν αὐτίκα δή
  choice: agora mesmo
  rationale: Reúne de modo idiomático a forte ênfase de imediatismo presente no conjunto de advérbios.
- source_word: λέγειν ἐξέσται
  choice: será possível falar
  rationale: Expressa a possibilidade ou viabilidade retórica, sem eliminar a nuance alternativa de permissão, registrada em nota.
- source_word: ἀρξαμένων τῆς ὑποθέσεως
  choice: começando pelo tema
  rationale: Representa de maneira concisa a construção participial comprimida e toma ὑπόθεσις como o tema ou assunto apresentado.
- source_word: ὅπερ εἴωθα ποιεῖν
  choice: como costumo fazer
  rationale: Reproduz com naturalidade o comentário do autor sobre seu método habitual.
- source_word: εἰς τὸν περὶ αὐτῶν τρέψομαι λόγον
  choice: passarei ao discurso a respeito deles
  rationale: Comunica o movimento retórico de voltar ou dirigir o discurso para o tópico seguinte, conservando o registro formal de λόγος.
- source_word: αὐτῶν
  choice: deles
  rationale: Preserva a ambiguidade do pronome grego entre pessoas e assuntos, explicada em nota.
- source_word: δόξαν διδοὺς
  choice: dando glória
  rationale: Equivalente direto e consagrado da expressão doxológica.
- source_word: τῷ πανσόφῳ θεῷ
  choice: ao Deus plenamente sábio
  rationale: Traduz o epíteto πανσόφῳ em linguagem digna e clara, evitando uma formação pouco natural como 'todo-sábio'.
theological_decisions:
- issue: Tradução do epíteto divino πανσόφῳ
  choice: Deus plenamente sábio
  alternative: Deus de toda sabedoria; Deus sapientíssimo
  rationale: Mantém a afirmação enfática da sabedoria divina e o tom doxológico sem acrescentar uma formulação doutrinária alheia ao texto nem recorrer a linguagem arcaizante.
