  text: But even about this it will now be possible to speak at once[a], beginning with the subject, as I am accustomed to do, and thus I will turn to the discourse about them[b], giving glory to the all-wise God.
translation:
  language: pt
  text: Mas também sobre isso será possível falar agora mesmo[a], começando pelo tema, como costumo fazer; e, assim, passarei ao discurso a respeito deles[b], dando glória ao Deus plenamente sábio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será permitido falar agora mesmo sobre isso”; o grego ἐξέσται pode indicar tanto permissão quanto possibilidade.'
    reason: lexical_alternative
  - marker: b
    text: “Deles” pode referir-se às pessoas que serão tratadas no argumento seguinte; pela formulação imediata, também é possível entender “dessas questões”.
