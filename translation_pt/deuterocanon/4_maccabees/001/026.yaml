  yaml_path: translation/deuterocanon/4_maccabees/001/026.yaml
  text: Against the soul are arrogance and love of money and love of honor and contentiousness and envy;[a]
translation:
  language: pt
  text: Contra a alma estão a arrogância, o amor ao dinheiro, o amor à honra, o gosto por contendas e a inveja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mau-olhado”; βασκανία pode indicar inveja ou uma malevolência invejosa associada ao mau-olhado.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: Contra
  rationale: Com o genitivo ψυχῆς, introduz aquilo que se volta adversamente contra a alma; “contra” preserva essa força e a estrutura da enumeração.
- source_word: ψυχῆς
  choice: a alma
  rationale: Designa aqui a alma ou vida interior atingida pelos vícios; “alma” conserva diretamente o sentido antropológico do grego.
- source_word: ἀλαζονία
  choice: arrogância
  rationale: Expressa orgulho pretensioso e autoafirmação presunçosa; “arrogância” é natural, atual e moralmente claro.
- source_word: φιλαργυρία
  choice: amor ao dinheiro
  rationale: O composto significa literalmente amor à prata ou ao dinheiro; a formulação preserva a imagem lexical e o valor moral do termo.
- source_word: φιλοδοξία
  choice: amor à honra
  rationale: Refere-se ao apego à honra, reputação ou glória; “amor à honra” mantém o paralelismo dos compostos gregos iniciados por φιλο- sem tornar o termo neutro.
- source_word: φιλονεικία
  choice: gosto por contendas
  rationale: Denota inclinação para disputas e rivalidades; a expressão é clara em português e comunica uma disposição habitual, não apenas uma contenda isolada.
- source_word: βασκανία
  choice: inveja
  rationale: No contexto de uma lista de vícios, “inveja” é a tradução mais clara; a possível conotação de mau-olhado ou malevolência invejosa é preservada em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “amor” preserva parcialmente o padrão lexical grego, enquanto “gosto por contendas” evita o pouco usual “contenciosidade”.
