base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/011.yaml
  text: For those men became even more admirable[a], not only to all people for their courage and endurance, but also to those who tortured them; they became the cause of the overthrow of the tyranny against the nation, having conquered the tyrant by endurance[b], so that through them the fatherland was purified.
translation:
  language: pt
  text: Pois aqueles homens se tornaram ainda mais admiráveis, não somente aos olhos de todos, por sua coragem e perseverança, mas também aos olhos dos que os torturaram. Eles se tornaram a causa da queda da tirania exercida contra a nação, tendo vencido o tirano por sua perseverança, de modo que, por meio deles, a pátria[a] foi purificada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “terra natal”. O grego πατρίς designa a terra de origem; “pátria” preserva o tom retórico elevado.
    reason: lexical_alternative
  - marker: b
    text: “Foi purificada” também pode ser entendido como “foi limpa”, com possíveis sentidos moral, ritual ou de restauração nacional.
    reason: alternative_reading
lexical_decisions:
- source_word: θαυμαστότεροι
  choice: ainda mais admiráveis
  rationale: O comparativo de θαυμαστός expressa estima intensificada. “Ainda mais admiráveis” conserva essa força e se ajusta ao elogio moral do contexto.
- source_word: ἀνδρίᾳ
  choice: coragem
  rationale: No contexto, o termo designa valor ou bravura. “Coragem” é claro em português moderno e evita restringir a virtude a uma formulação marcada por gênero.
- source_word: ὑπομονῇ
  choice: perseverança
  rationale: Nas duas ocorrências, o termo indica constância sob sofrimento. “Perseverança” comunica tanto a resistência quanto a firmeza continuada e mantém uniformidade no versículo.
- source_word: αἰκισαμένων
  choice: os que os torturaram
  rationale: O particípio se refere aos que lhes infligiram maus-tratos cruéis. “Torturaram” explicita adequadamente a violência e preserva a força verbal.
- source_word: αἴτιοι κατέστησαν
  choice: se tornaram a causa
  rationale: A construção atribui aos mártires agência causal no resultado narrado. A formulação conserva de modo transparente essa relação, sem reduzi-la a mera influência indireta.
- source_word: καταλυθῆναι
  choice: queda
  rationale: O infinitivo passivo descreve a tirania sendo derrubada ou eliminada. “Queda” é idiomático em contexto político e preserva a ideia de sua ruína.
- source_word: τὴν κατὰ τοῦ ἔθνους τυραννίδα
  choice: a tirania exercida contra a nação
  rationale: “Exercida contra” torna natural em português a relação indicada por κατά, enquanto “nação” preserva o sentido coletivo de ἔθνος sem identificar além do que o texto declara.
- source_word: νικήσαντες τὸν τύραννον
  choice: pois venceram o tirano
  rationale: O particípio aoristo apresenta a vitória sobre o tirano como circunstância causal ligada à queda da tirania. “Venceram” mantém com clareza a imagem de vitória.
- source_word: ὥστε καθαρσθῆναι
  choice: de modo que ... foi purificada
  rationale: ὥστε com infinitivo expressa resultado. “Purificada” preserva as possíveis ressonâncias políticas, morais e rituais do verbo sem escolher apenas uma delas.
- source_word: πατρίδα
  choice: a pátria
  rationale: πατρίς designa a terra natal. “Pátria” é natural em português, conserva o tom retórico elevado e mantém o vínculo afetivo e territorial do termo.
theological_decisions:
- issue: O sentido da purificação da pátria por meio dos mártires
  choice: Manter a afirmação de que, por meio deles, a pátria foi purificada, sem definir o mecanismo.
  alternative: Interpretar exclusivamente como libertação política, purificação moral ou ritual, ou atribuir explicitamente valor expiatório ao sofrimento dos mártires.
  rationale: καθαρσθῆναι permite ressonâncias de limpeza ou purificação moral, ritual e nacional. O contexto associa o sofrimento dos mártires a um benefício coletivo, mas este versículo não sistematiza como isso ocorre; por isso, a tradução preserva a tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “perseverança” reproduz a repetição enfática do grego. A longa construção grega foi dividida em duas frases para clareza, sem alterar a sequência lógica; “pátria” mantém o tom elevado sem soar arcaico.
