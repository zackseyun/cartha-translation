base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/033.yaml
  text: For why is it that[a], when we are moved toward the forbidden foods, we turn away from the pleasures that come from them? Is it not because reason is able to prevail over desires? I think so.
translation:
  language: pt
  text: Pois, quando somos atraídos pelos alimentos proibidos, por que nos afastamos dos prazeres que eles proporcionam? Não é porque a razão é capaz de dominar os desejos[a]? Eu penso que sim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “apetites”; neste contexto de alimentos, o termo grego pode ressaltar o desejo corporal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ πόθεν
  choice: Pois ... por que
  rationale: A combinação introduz uma pergunta retórica explicativa. “Pois ... por que” conserva tanto a ligação com o argumento anterior quanto o sentido interrogativo, em português natural.
- source_word: κινούμενοι πρὸς
  choice: quando somos atraídos por
  rationale: O particípio exprime um movimento ou impulso em direção a algo. “Somos atraídos por” comunica de modo natural esse impulso interior sem afirmar que ele necessariamente resulta em ação.
- source_word: τὰς ἀπειρημένας τροφάς
  choice: os alimentos proibidos
  rationale: ἀπειρημένας designa aquilo que foi proibido, e τροφάς se refere aqui concretamente a alimentos.
- source_word: ἀποτρεπόμεθα
  choice: nos afastamos de
  rationale: Preserva a imagem verbal de voltar-se para longe ou desviar-se de algo, em vez de reduzi-la simplesmente a “evitamos”.
- source_word: τὰς ἐξ αὐτῶν ἡδονάς
  choice: os prazeres que eles proporcionam
  rationale: Explicita de maneira idiomática que os prazeres procedem dos alimentos, sem acrescentar uma ideia ausente do grego.
- source_word: ὁ λογισμός
  choice: a razão
  rationale: No argumento filosófico de 4 Macabeus, o termo indica a faculdade racional ou o juízo racional que governa as paixões. “A razão” é direto, claro e não excessivamente técnico.
- source_word: τῶν ὀρέξεων ἐπικρατεῖν
  choice: dominar os desejos
  rationale: ἐπικρατεῖν significa prevalecer ou exercer domínio sobre; ὀρέξεις pode abranger desejos e, neste contexto alimentar, apetites corporais.
- source_word: ἐγὼ μὲν οἶμαι
  choice: Eu penso que sim
  rationale: Mantém a conclusão afirmativa em tom pessoal e moderado, com formulação corrente e digna.
theological_decisions:
- issue: Força filosófico-antropológica de λογισμός em 4 Macabeus
  choice: a razão
  alternative: o juízo racional; a mente racional
  rationale: O versículo sustenta que a faculdade racional pode governar os desejos corporais. “A razão” preserva essa afirmação central sem impor categorias doutrinárias posteriores nem tornar a linguagem excessivamente acadêmica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da primeira pergunta foi ajustada para fluência natural, mantendo seu caráter retórico e explicativo. O marcador da nota foi colocado junto a “desejos”, termo ao qual a alternativa lexical se refere.
