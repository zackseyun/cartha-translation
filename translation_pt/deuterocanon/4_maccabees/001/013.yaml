lexical_decisions:
- source_word: Ζητοῦμεν
  choice: examinemos
  rationale: O presente da primeira pessoa do plural funciona, neste contexto argumentativo, como convite deliberativo à investigação; “examinemos” é natural e preserva essa força.
- source_word: δὴ τοίνυν
  choice: Portanto
  rationale: A combinação de partículas assinala retomada e inferência. “Portanto” expressa de modo claro e digno a transição lógica, sem reproduzir pesadamente cada partícula.
- source_word: αὐτοκράτωρ
  choice: domina
  rationale: O termo indica autoridade independente ou pleno domínio. A construção verbal “domina” comunica naturalmente em português que a razão exerce senhorio sobre as paixões.
- source_word: τῶν παθῶν
  choice: as paixões
  rationale: No discurso moral helenístico, πάθη designa paixões ou impulsos afetivos sujeitos ao governo racional, não simplesmente emoções neutras; “paixões” preserva essa nuance filosófica.
- source_word: ὁ λογισμός
  choice: a razão
  rationale: Aqui λογισμός é a faculdade ou atividade racional central à tese da obra. “A razão” é conciso, corrente e filosoficamente apropriado.
theological_decisions:
- issue: Sentido filosófico-antropológico de λογισμός em relação a πάθη
  choice: a razão domina as paixões
  alternative: o juízo racional exerce soberania sobre as paixões
  rationale: A formulação conserva a tese ética de que a razão pode exercer autoridade sobre as paixões, sem importar categorias teológicas posteriores nem reduzir πάθη a emoções moralmente neutras.
