  yaml_path: translation/deuterocanon/4_maccabees/018/009.yaml
  text: But when these sons had reached adulthood[a], their father died. Blessed was that man, for after experiencing the life of having good children[b], he did not suffer the season of childlessness.
translation:
  language: pt
  text: Mas, quando esses filhos chegaram à idade adulta, o pai deles morreu. Feliz aquele homem, pois, depois de conhecer a vida com bons filhos, não sofreu o período de não ter filhos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, no contexto, ele morreu antes de ter de suportar a angústia de ficar sem filhos após a morte deles.
    reason: cross_reference
lexical_decisions:
- source_word: ἐνηλίκων γενομένων
  choice: chegaram à idade adulta
  rationale: Expressa naturalmente a transição concluída para a plena idade no genitivo absoluto.
- source_word: ἐτελεύτησεν
  choice: morreu
  rationale: Equivalente moderno, claro e digno para o uso do verbo como referência à morte.
- source_word: μακάριος
  choice: Feliz
  rationale: Comunica a condição invejável ou favorecida declarada no contexto, sem necessariamente introduzir uma ação divina não explicitada.
- source_word: εὐτεκνίας
  choice: de quem tem bons filhos
  rationale: Preserva tanto o estado de ter filhos quanto a avaliação positiva deles, especialmente pertinente no contexto dos filhos virtuosos.
- source_word: βίον ἐπιστήσας
  choice: depois de conhecer a vida
  rationale: Traduz a ideia de ter conhecido por experiência um modo de vida, mantendo a expressão deliberadamente incomum do grego.
- source_word: ἀτεκνίας
  choice: ficar sem filhos
  rationale: No contexto narrativo, indica a condição de vir a estar privado dos filhos, embora o substantivo também possa denotar ausência de filhos em sentido geral.
- source_word: οὐκ ὠδυνήθη
  choice: não sofreu
  rationale: Conserva a noção de dor ou angústia experimentada.
- source_word: καιρόν
  choice: o tempo
  rationale: Representa um período ou ocasião determinada em português natural, sem reduzir a expressão a um instante.
theological_decisions:
- issue: Em que sentido o pai é declarado feliz diante do martírio posterior dos filhos
  choice: O pai morreu antes de passar pela dolorosa condição de ficar sem os filhos.
  alternative: O texto poderia contrastar genericamente ter filhos com nunca os ter tido, sem alusão direta à morte posterior deles.
  rationale: O contexto imediato favorece a referência narrativa à perda dos filhos, mas a explicação fica em nota para não resolver em excesso a formulação concisa do original.
translation_notes:
  register: Português moderno, digno e de leitura ampla. “Feliz” evita uma formulação excessivamente eclesiástica; “conhecer a vida” conserva o caráter elevado e algo incomum da expressão grega. O marcador [a] aparece no texto principal.
