base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/003.yaml
  text: For this reason[a], because of their godliness, when those men gave up their bodies to those sufferings, they were not only admired by men, but were also counted worthy of a divine share.
translation:
  language: pt
  text: Por essa razão, por causa de sua devoção a Deus, ao entregarem seus corpos àqueles sofrimentos, eles não somente foram admirados pelas pessoas, mas também foram considerados dignos de uma porção divina.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma porção da parte de Deus” ou “participação no que é divino”. A expressão grega é concisa e pode se referir tanto a algo concedido por Deus quanto à participação em uma porção divina.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: Por isso
  rationale: A locução retoma o contexto anterior e introduz a consequência; “Por isso” expressa essa relação de modo natural e conciso.
- source_word: διὰ τὴν εὐσέβειαν
  choice: por sua devoção a Deus
  rationale: Em 4 Macabeus, εὐσέβεια designa reverência e fidelidade religiosa. A formulação torna claro o sentido religioso sem recorrer ao tom potencialmente afetado de “piedade”.
- source_word: προεμενοι τὰ σώματα
  choice: eles entregaram o corpo
  rationale: O particípio médio comunica a entrega voluntária do próprio corpo. “Entregaram” preserva esse sentido sem acrescentar uma conotação sacrificial que não é explícita.
- source_word: τοῖς πόνοις ἐκείνοι
  choice: àqueles sofrimentos
  rationale: πόνοις pode indicar dores ou sofrimentos, e ἐκείνοι aponta para as provações já narradas. “Sofrimentos” é amplo e natural no contexto.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: não somente ... mas também
  rationale: Mantém com clareza a estrutura correlativa e a progressão retórica do grego.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: pelas pessoas
  rationale: O substantivo se refere aqui aos seres humanos em geral, em contraste com o âmbito divino, e não especificamente a homens do sexo masculino.
- source_word: ἐθαυμάσθησαν
  choice: foram admirados
  rationale: Reproduz de maneira idiomática o passivo e a ideia de serem contemplados com admiração.
- source_word: θείας μερίδος
  choice: uma porção divina
  rationale: A expressão grega é condensada e pode indicar tanto algo concedido por Deus quanto participação no que é divino. “Porção divina” conserva essa abertura.
- source_word: κατηξιώθησαν
  choice: considerados dignos de
  rationale: Preserva o sentido avaliativo do verbo e o registro elevado da passagem.
theological_decisions:
- issue: Sentido de θείας μερίδος
  choice: uma porção divina
  alternative: uma porção da parte de Deus; participação no divino
  rationale: O grego não define se se trata de uma porção concedida por Deus ou de participação em uma realidade divina. A tradução principal e a nota preservam essa tensão sem impor conceitos como recompensa celestial ou deificação.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Evitou-se “piedade” para não sugerir mera compaixão no uso corrente, e “pessoas” comunica com precisão a referência humana genérica. O marcador foi colocado junto de “porção divina”, expressão à qual a nota se refere.
