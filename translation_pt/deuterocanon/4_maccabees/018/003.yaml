revisions:
- from: Por isso, visto que, por sua devoção a Deus, eles entregaram o corpo àqueles sofrimentos, não somente foram admirados pelas pessoas, mas também considerados dignos de uma porção divina.[a]
  to: Por essa razão, por causa de sua devoção a Deus, ao entregarem seus corpos àqueles sofrimentos, eles não somente foram admirados pelas pessoas, mas também foram considerados dignos de uma porção divina.[a]
  rationale: A revisão corrige o plural de τὰ σώματα e elimina a sobreposição pouco natural entre ‘Por isso’ e ‘visto que’. Mantém-se ‘devoção a Deus’, ‘sofrimentos’, ‘pessoas’ e ‘porção divina’, pois reproduzem o sentido, o registro e a abertura teológica do grego sem impor uma leitura doutrinária específica. A nota permanece ancorada em ‘porção divina’ e esclarece as alternativas de θείας μερίδος.
