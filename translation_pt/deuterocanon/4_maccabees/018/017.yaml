  text: He bore witness to Ezekiel[a], who says[b], “Will these dry bones live?”
translation:
  language: pt
  text: 'Ele invocava Ezequiel como testemunha[a], que diz: “Será que estes ossos secos viverão?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “confirmava Ezequiel” ou “apelava para o testemunho de Ezequiel”. O verbo grego tem sentido testemunhal e é difícil de representar por uma única expressão em português.'
    reason: lexical_alternative
  - marker: b
    text: Alusão a Ezequiel 37:3, na visão do vale de ossos secos.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιστοποιεῖτο
  choice: invocava ... como testemunha
  rationale: A forma verbal tem sentido testemunhal e, no contexto, apresenta Ezequiel como autoridade profética evocada em apoio à esperança expressa. A formulação é natural em português e evita definir em excesso se o verbo significa especificamente “confirmar” ou “dar testemunho”.
- source_word: τὸν Ἰεζεκιὴλ
  choice: Ezequiel
  rationale: Emprega a forma tradicional e amplamente reconhecida do nome em português.
- source_word: τὸν λέγοντα
  choice: que diz
  rationale: O particípio presente introduz uma citação das Escrituras; o presente é idiomático em português para uma voz textual que continua falando.
- source_word: Εἰ ζήσεται
  choice: Será que ... voltarão a viver?
  rationale: Aqui εἰ introduz uma pergunta indireta ou deliberativa, ecoando Ezequiel 37:3. “Será que” conserva a incerteza da pergunta, e “voltarão a viver” expressa naturalmente a retomada da vida por ossos já secos.
- source_word: τὰ ὀστᾶ τὰ ξηρὰ ταῦτα
  choice: estes ossos secos
  rationale: Reproduz de modo claro e idiomático o substantivo, o adjetivo atributivo e o demonstrativo gregos.
theological_decisions:
- issue: Fórmula de apelo a Ezequiel e alusão à restauração dos ossos secos
  choice: Apresentar Ezequiel como testemunha e manter a frase citada como pergunta aberta.
  alternative: “Confirmava Ezequiel” ou “dava testemunho de Ezequiel”, com uma formulação que explicitasse diretamente a ressurreição.
  rationale: O texto recorre à imagem de Ezequiel 37, mas não desenvolve aqui toda a sua interpretação teológica. A tradução preserva a força da alusão e a tensão interrogativa sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Invocava ... como testemunha” preserva o tom jurídico-testemunhal sem soar excessivamente técnico; “será que” mantém a pergunta genuína e natural.
