lexical_decisions:
- source_word: ὑπεμίμνησκεν
  choice: continuava lembrando
  rationale: O imperfeito indica ação contínua ou repetida; a expressão conserva esse aspecto de modo natural em português.
- source_word: ὑμᾶς
  choice: vocês
  rationale: Mantém o destinatário no plural e oferece ampla legibilidade no português moderno, sobretudo no Brasil.
- source_word: τὴν Ἡσαΐου γραφὴν
  choice: da Escritura de Isaías
  rationale: Neste contexto judaico, γραφή designa um texto sagrado, não um escrito qualquer; a construção preserva o singular do grego.
- source_word: τὴν λέγουσαν
  choice: que diz
  rationale: Reproduz com naturalidade o particípio atributivo que introduz a citação.
- source_word: Κἂν
  choice: Mesmo que
  rationale: A crase de καὶ ἐάν tem aqui valor condicional concessivo.
- source_word: διὰ πυρὸς διέλθῃς
  choice: você atravesse o fogo
  rationale: Conserva a imagem de passar através do fogo e o destinatário singular presente na citação.
- source_word: φλὸξ
  choice: a chama
  rationale: Distingue a chama do fogo mencionado antes e soa natural em português.
- source_word: οὐ κατακαύσει σε
  choice: não queimará você
  rationale: Traduz diretamente a promessa de que a chama não queimará a pessoa, sem ampliar o verbo para 'consumir'.
theological_decisions:
- issue: Forma da citação de Isaías
  choice: Traduzir a redação grega própria de 4 Macabeus
  alternative: Harmonizar a frase com uma tradução portuguesa conhecida de Isaías 43:2
  rationale: A tradução deve representar o texto de 4 Macabeus, cuja formulação difere ligeiramente das formas tradicionais de Isaías.
- issue: Aspecto de ὑπεμίμνησκεν
  choice: continuava lembrando
  alternative: lembrou
  rationale: O imperfeito enfatiza uma ação prolongada ou repetida, sem exigir que se escolha exclusivamente entre esses dois matizes.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Vocês” traduz o plural ὑμᾶς na narrativa, enquanto “você” preserva o singular σε dentro da citação.
