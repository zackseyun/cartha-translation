base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/001.yaml
  text: O children[a], descendants of the seed of Abraham, Israelites, obey this law[b], and be godly in every way.
translation:
  language: pt
  text: Ó filhos, descendentes da linhagem de Abraão[a], israelitas, obedeçam a esta lei e vivam com devoção em tudo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “descendentes das sementes abraâmicas”. A expressão grega acumula termos de descendência para enfatizar a identidade ancestral.
    reason: lexical_alternative
  - marker: b
    text: Ou “sejam piedosos em todos os sentidos” ou “ajam com reverência em tudo”. O verbo indica uma conduta devota que honra a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: Ó
  rationale: Preserva a interjeição vocativa e o tom retórico elevado do apelo.
- source_word: τῶν Ἀβραμιαίων σπερμάτων ἀπόγονοι
  choice: descendentes da linhagem de Abraão
  rationale: Expressa a identidade ancestral enfatizada pela formulação grega acumulativa, mas em português natural; a nota registra sua forma mais literal e incomum.
- source_word: παῖδες
  choice: filhos
  rationale: Mantém o vocativo filial sem restringir indevidamente o grupo a homens adultos.
- source_word: Ἰσραηλεῖται
  choice: israelitas
  rationale: É a designação étnico-nacional convencional em português.
- source_word: πείθεσθε
  choice: obedeçam
  rationale: Com o dativo τῷ νόμῳ, o verbo indica acatamento prático da lei, não apenas persuasão interior.
- source_word: τῷ νόμῳ τούτῳ
  choice: a esta lei
  rationale: Reproduz o demonstrativo e deixa que o contexto identifique a lei ancestral de Israel, sem acrescentar explicação ao texto.
- source_word: πάντα τρόπον
  choice: em tudo
  rationale: Forma idiomática e abrangente de exprimir conduta em todos os aspectos.
- source_word: εὐσεβεῖτε
  choice: vivam com devoção
  rationale: Comunica conduta reverente e orientada para Deus em português corrente, evitando tanto uma formulação arcaica quanto a redução a mero sentimento interior.
theological_decisions:
- issue: Referência de “esta lei”
  choice: Manter “esta lei”, entendida contextualmente como a lei ancestral de Israel
  alternative: Explicitar “esta Lei” ou “a Torá”
  rationale: O contexto israelita aponta para a lei pactual, mas o grego não traz um termo adicional equivalente a “Torá”; a tradução preserva a formulação e a tensão do original.
- issue: Sentido religioso e ético de εὐσεβεῖτε
  choice: “vivam com devoção”
  alternative: “sejam piedosos” ou “ajam com reverência”
  rationale: A escolha conserva a dimensão de conduta reverente que honra a Deus, sem importar uma definição confessional específica de piedade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O vocativo “Ó” conserva a elevação retórica; “filhos, descendentes” mantém deliberadamente a ênfase genealógica do grego, enquanto as notas registram sua formulação literal incomum.
