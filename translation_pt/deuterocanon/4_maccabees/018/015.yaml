  yaml_path: translation/deuterocanon/4_maccabees/018/015.yaml
  text: David sang to us[a], the hymn-writer, saying[b], “Many are the afflictions of the righteous.”
translation:
  language: pt
  text: 'Davi, o compositor de hinos, cantava para nós[a], dizendo: “Muitas são as aflições dos justos”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais idiomático: “O salmista Davi cantava para nós, dizendo: ‘Muitas são as aflições dos justos’”.'
    reason: lexical_alternative
  - marker: b
    text: A citação retoma o Sl 33:20 na Septuaginta (Sl 34:19 em muitas numerações modernas).
    reason: cross_reference
lexical_decisions:
- source_word: τὸν ὑμνογράφον
  choice: o compositor de hinos
  rationale: Preserva o sentido lexical de alguém que compõe hinos e identifica a expressão como aposto de Davi. É mais transparente que simplesmente “o salmista”, embora esta seja uma alternativa idiomática.
- source_word: ἐμελῴδει
  choice: cantava
  rationale: O verbo denota cantar ou entoar melodicamente. O imperfeito grego é representado pelo imperfeito português, sem reduzir o aspecto a um evento pontual.
- source_word: ἡμῖν
  choice: para nós
  rationale: O dativo indica os ouvintes ou beneficiários do canto; “para nós” é natural em português neste contexto.
- source_word: Δαυεὶδ
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: Πολλαὶ αἱ θλίψεις
  choice: Muitas são as aflições
  rationale: Mantém a construção predicativa e o tom elevado da citação bíblica.
- source_word: τῶν δικαίων
  choice: dos justos
  rationale: Expressão concisa e tradicional para pessoas justas, adequada ao registro sapiencial e bíblico.
theological_decisions:
- issue: Relação de ὑμνογράφος com Davi
  choice: Tratar “o compositor de hinos” como aposto de Davi.
  alternative: Traduzir de modo mais idiomático como “o salmista Davi”.
  rationale: Apesar da sintaxe grega comprimida e de uma aparente irregularidade de caso, o contexto identifica Davi como o autor ou compositor do cântico citado; a tradução mantém essa identificação sem converter o título lexical em uma designação tradicional.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira. A formulação conserva o título pouco comum “compositor de hinos” no texto e oferece “salmista” em nota. O imperfeito “cantava” acompanha o aspecto de ἐμελῴδει.
