  terminology: “Davi”, “compositor de hinos”, “aflições” e “justos” são escolhas consistentes, não confessionais e adequadas ao tom da passagem. A nota b identifica corretamente Sl 33:20 LXX e a numeração 34:19 usada em muitas tradições modernas.
