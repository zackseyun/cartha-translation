  text: He mutilated the pupils of their eyes, cut out their tongues, and killed them with various tortures.
translation:
  language: pt
  text: Mutilou-lhes as pupilas dos olhos, cortou-lhes as línguas e os matou com diversas torturas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς τῶν ὀμμάτων κόρας
  choice: as pupilas dos olhos
  rationale: Neste contexto anatômico, κόρας designa as pupilas. A formulação preserva a precisão e a expressão explícita do grego, sem substituí-la por «globos oculares».
- source_word: ἐπήρωσεν
  choice: mutilou-lhes
  rationale: O verbo indica mutilar, incapacitar ou cegar. «Mutilou» conserva o caráter físico e violento da ação sem especificar, além do que o verbo exige, que as pupilas foram arrancadas.
- source_word: γλώσσας ἐξέτεμεν
  choice: cortou-lhes as línguas
  rationale: ἐκτέμνω significa cortar para fora ou extirpar. «Cortou-lhes as línguas» é direto, natural e mantém a violência concreta da expressão.
- source_word: βασάνοις ποικίλαις
  choice: com diversas torturas
  rationale: A expressão apresenta as torturas como meio ou instrumento da morte; «diversas» traduz ποικίλαις de modo claro e corrente.
- source_word: ἀπέκτεινεν
  choice: os matou
  rationale: Tradução direta e moderna do verbo comum para matar; o pronome retoma naturalmente as vítimas mencionadas no contexto.
