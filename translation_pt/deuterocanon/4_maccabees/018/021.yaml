translation_notes:
  register: Português moderno, claro e digno, com construção compreensível tanto no Brasil quanto em outros contextos lusófonos. O uso de pronomes enclíticos evita a repetição pesada de possessivos e mantém explícita a relação das partes do corpo com as vítimas.
