lexical_decisions:
- source_word: Αὕτη
  choice: Esta
  rationale: Mantém o demonstrativo feminino do grego e sua referência concisa ao que foi dito anteriormente, sem explicitar além do texto.
- source_word: ζωὴ
  choice: vida
  rationale: É o equivalente direto e natural do substantivo grego, sem acrescentar a ideia interpretativa de “modo de vida”.
- source_word: ὑμῶν
  choice: de vocês / seus
  rationale: Expressa claramente a segunda pessoa do plural em português de ampla compreensão, evitando a ambiguidade regional de “vossa” e a possível leitura singular de “sua”.
- source_word: μακαριότης
  choice: felicidade
  rationale: Comunica em linguagem atual o estado venturoso ou feliz indicado pelo termo grego; “bem-aventurança” seria mais formal, porém menos natural para leitores comuns.
- source_word: ἡμερῶν
  choice: dias
  rationale: Conserva a imagem concreta e o plural do grego, sem substituir por interpretações como “vida inteira” ou “anos”.
