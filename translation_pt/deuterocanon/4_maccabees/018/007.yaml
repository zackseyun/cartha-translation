base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/007.yaml
  text: For I remained a pure virgin[a], and I did not go beyond my father's house; rather[b], I guarded the rib that had been built.
translation:
  language: pt
  text: Pois permaneci virgem pura e não fui além da casa de meu pai[a]; mas guardava a costela que havia sido edificada[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não transgredi os limites da casa de meu pai». A expressão grega pode indicar tanto a permanência literal no âmbito da casa paterna quanto o respeito aos seus limites morais.'
    reason: alternative_reading
  - marker: b
    text: 'Ou: «o lado que havia sido edificado». A frase provavelmente alude à criação da mulher a partir do lado ou da costela de Adão em Gênesis e é usada aqui como metáfora discreta da castidade preservada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενήθην
  choice: permaneci
  rationale: Embora o verbo possa significar literalmente «tornei-me» ou «fui», o contexto descreve a conservação da virgindade; «permaneci» expressa esse sentido de modo natural, sem sugerir que ela passou a ser virgem.
- source_word: παρθένος ἁγνή
  choice: virgem e pura
  rationale: παρθένος indica uma virgem, e ἁγνή, neste contexto, comunica pureza ou castidade moral. A coordenação mantém claros os dois elementos em português corrente.
- source_word: οὐχ ὑπερέβην
  choice: não fui além
  rationale: A expressão conserva o sentido básico de ultrapassar ou ir além e permite tanto uma referência espacial quanto a ideia moral de não transpor limites.
- source_word: πατρικὸν οἶκον
  choice: a casa de meu pai
  rationale: Forma portuguesa natural para a casa ou o núcleo doméstico paterno; o possessivo é inferido com segurança pelo contexto em primeira pessoa.
- source_word: ἐφύλασσον
  choice: guardei
  rationale: O verbo denota guardar, vigiar ou preservar. «Guardei» mantém a metáfora sem explicitar indevidamente a castidade; embora o imperfeito grego indique ação contínua, o pretérito perfeito é mais fluente nesta sequência em português.
- source_word: τὴν ᾠκοδομημένην πλευράν
  choice: a costela que havia sido edificada
  rationale: πλευρά pode significar «lado» ou «costela», e οἰκοδομέω significa «edificar, construir». A formulação incomum conserva a provável alusão à formação da mulher a partir da costela ou do lado de Adão em Gênesis.
theological_decisions:
- issue: Interpretação da alusão a Gênesis em «a costela que havia sido edificada»
  choice: Manter a metáfora no texto principal, sem explicá-la como eufemismo para a virgindade.
  alternative: Parafrasear como «preservei minha castidade» ou traduzir πλευρά por «lado».
  rationale: O grego emprega linguagem incomum e alusiva. Preservá-la respeita a textura literária e evita tornar explícito um sentido sexual que o texto apenas sugere.
- issue: Sentido de «não fui além da casa de meu pai»
  choice: Conservar uma expressão que pode indicar tanto permanência no âmbito doméstico quanto respeito aos seus limites morais.
  alternative: Resolver como «não saí da casa de meu pai» ou «não transgredi os limites da casa de meu pai».
  rationale: O verbo grego admite a dimensão espacial e a moral; a tradução não deve eliminar essa tensão genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção deliberadamente incomum «costela que havia sido edificada» foi mantida para preservar a alusão verbal e literária do grego.
