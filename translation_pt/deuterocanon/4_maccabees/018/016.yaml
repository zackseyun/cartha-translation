revisions:
- from: 'Ele citava Salomão para nós como provérbio, aquele que diz: “É árvore de vida para todos os que fazem a vontade dele.”[a][b]'
  to: 'Ele nos apresentava Salomão de modo proverbial, como aquele que diz: “É árvore de vida para todos os que fazem a vontade dele.”[a][b]'
  rationale: A revisão substitui uma construção não idiomática por «nos apresentava Salomão de modo proverbial», que conserva a apresentação de Salomão como autoridade de uma máxima sem tratar o nome próprio como se fosse o próprio provérbio. A nota foi ajustada para descrever com precisão a ambiguidade do pronome grego e a necessária adaptação de gênero ao português.
