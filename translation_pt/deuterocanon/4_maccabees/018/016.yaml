  source_fidelity: 'A tradução preserva adequadamente a estrutura essencial: Salomão é a autoridade citada, a fórmula sapiencial é mantida e «a vontade dele» representa de modo plausível o referente pessoal favorecido pelo contexto. Contudo, «citava Salomão para nós como provérbio» não expressa com naturalidade em português a ação proverbial de ἐπαροιμίαζεν.'
  naturalness: «Ele nos apresentava Salomão de modo proverbial» é mais claro e idiomático do que «Ele citava Salomão para nós como provérbio», sem reduzir Salomão simplesmente ao conteúdo de uma citação. «A todos os que fazem» dá uma formulação natural e solene para o dativo πᾶσιν τοῖς ποιοῦσιν.
  terminology: '«Salomão», «árvore de vida» e «a vontade dele» são adequados. A nota alternativa deve evitar sugerir que o grego tenha um pronome feminino: αὐτοῦ pode ter referente não pessoal/neutro em termos gramaticais, o que em português pode ser vertido contextualmente por «dela» em referência à árvore, mas essa diferença precisa ser explicitada.'
