  yaml_path: translation/deuterocanon/4_maccabees/018/016.yaml
  text: He held up Solomon before us as a proverb, the one who says, “It is a tree of life for all who do his will.”
translation:
  language: pt
  text: 'Ele nos apresentava Salomão de modo proverbial, como aquele que diz: “É árvore de vida para todos os que fazem a vontade dele.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, referindo-se à árvore: “a vontade dela”. O pronome grego pode ter um referente não pessoal, embora o contexto favoreça a referência a Deus.'
    reason: alternative_reading
  - marker: b
    text: A máxima retoma Provérbios 3:18 em forma adaptada.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαροιμίαζεν
  choice: citava ... como provérbio
  rationale: O verbo indica citar ou apresentar alguém de maneira proverbial. A formulação conserva Salomão como objeto direto e comunica com clareza a ação retórica.
- source_word: τὸν Σαλομῶντα
  choice: Salomão
  rationale: Transliteração tradicional e amplamente reconhecida do nome próprio em português.
- source_word: ἡμῖν
  choice: para nós
  rationale: O dativo identifica os destinatários perante os quais a citação proverbial era feita.
- source_word: τὸν λέγοντα
  choice: aquele que diz
  rationale: Preserva o particípio presente substantivado e identifica Salomão como quem profere a máxima citada.
- source_word: Ξύλον ζωῆς
  choice: árvore de vida
  rationale: Mantém a expressão sapiencial que ecoa Provérbios 3:18; em português, o predicativo pode ocorrer naturalmente sem artigo.
- source_word: πᾶσιν τοῖς ποιοῦσιν
  choice: para todos os que fazem
  rationale: Tradução direta e idiomática que abrange todas as pessoas que realizam a ação indicada.
- source_word: αὐτοῦ τὸ θέλημα
  choice: a vontade dele
  rationale: A expressão conserva o pronome masculino da leitura contextual que o refere a Deus, sem inserir explicitamente o nome divino; a alternativa gramatical é registrada em nota.
theological_decisions:
- issue: Referente de αὐτοῦ na citação
  choice: a vontade dele
  alternative: a vontade dela
  rationale: O contexto da fidelidade a Deus favorece um referente pessoal masculino, embora a forma grega permita relacionar o pronome de modo impessoal ou com a realidade feminina subentendida na alusão sapiencial. A ambiguidade genuína é preservada em nota.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com leitura natural no Brasil. A construção “citava Salomão para nós como provérbio” procura preservar a relação sintática incomum do grego sem transformar Salomão apenas nas suas palavras. O sujeito não expresso de “É árvore de vida” mantém a concisão e parte da abertura do original.
