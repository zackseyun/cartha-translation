    issue: Construção «citava Salomão para nós como provérbio» é pouco natural e semanticamente imprecisa em português.
    rationale: Em português, uma pessoa normalmente é citada como autoridade ou é apresentada/evocada proverbialmente; «como provérbio» aplicado diretamente a Salomão soa como se ele próprio fosse um provérbio. O grego permite conservar a relação entre Salomão e a citação sem essa estranheza.
  - severity: low
    issue: A nota a apresenta «a vontade dela» como se fosse simplesmente uma leitura de gênero feminino do pronome grego.
    rationale: O pronome αὐτοῦ não é feminino. A alternativa decorre de um possível referente não pessoal, que em português pode ser retomado por «dela» por causa de «árvore», mas a nota deve qualificar essa adaptação de gênero.
