base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/006.yaml
  text: 'Then indeed, having set out from Jerusalem, he encamped against the Persians. And the mother of the seven boys was saying these things also to each one of her children:'
translation:
  language: pt
  text: 'Então, tendo partido de Jerusalém, ele acampou contra os persas. E a mãe dos sete rapazes dizia também estas coisas a cada um de seus filhos:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε δὴ
  choice: Então
  rationale: O advérbio marca com naturalidade a sequência narrativa; o reforço de δὴ é percebido no contexto, e acrescentar «de fato» soaria pesado em português.
- source_word: ὑπάρας
  choice: tendo partido
  rationale: Preserva a anterioridade do particípio aoristo em relação ao verbo principal e expressa de modo natural a saída de Jerusalém.
- source_word: ἐστρατοπέδευσεν ἐπὶ Πέρσας
  choice: acampou para combater os persas
  rationale: Mantém o sentido militar do verbo e explicita de maneira idiomática a orientação hostil de ἐπί com acusativo, sem sugerir que o acampamento tenha sido montado fisicamente sobre os persas.
- source_word: ἡ μήτηρ τῶν ἑπτὰ παίδων
  choice: a mãe dos sete rapazes
  rationale: παῖδες pode designar crianças, rapazes ou filhos; «rapazes» comunica que os sete descendentes eram do sexo masculino e preserva a variação em relação a τέκνοις.
- source_word: Ἔλεγεν
  choice: dizia
  rationale: O pretérito imperfeito português preserva naturalmente o aspecto contínuo ou reiterado do imperfeito grego.
- source_word: καὶ ταῦτα
  choice: também estas coisas
  rationale: Conserva tanto o valor aditivo de καί quanto a referência demonstrativa de ταῦτα.
- source_word: ἑνὶ ἑκάστῳ
  choice: a cada um
  rationale: Reproduz o valor distributivo e a atenção individual expressos pela combinação grega.
- source_word: τοῖς τέκνοις
  choice: de seus filhos
  rationale: τέκνα é um termo relacional de descendência; «filhos» é natural em português para descendentes conhecidos como homens e evita a possível leitura etária infantil de «crianças».
theological_decisions:
- issue: Termos familiares marcados por gênero no contexto da fala materna
  choice: Traduzir παῖδες por «rapazes» e τέκνοις por «filhos»
  alternative: Usar «filhos» nas duas ocorrências ou «crianças» na segunda
  rationale: A escolha preserva a variação lexical do grego, comunica corretamente o sexo dos sete e mantém o tom familiar, sem introduzir uma distinção doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «para combater» torna idiomática a relação militar sem apagar sua força hostil; o dois-pontos preserva a introdução da fala subsequente.
