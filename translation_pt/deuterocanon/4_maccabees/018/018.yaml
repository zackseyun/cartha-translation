  text: For she did not forget the song that Moses taught[a], which teaches, ‘I kill, and I make alive.’
translation:
  language: pt
  text: 'Pois ela não se esqueceu do cântico que Moisés ensinou[a], o qual ensina: “Eu matarei e farei viver.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Esta frase alude ao Cântico de Moisés em Deuteronômio 32:39. Algumas traduções dessa passagem dizem: “Eu mato e faço viver”; aqui, porém, o grego emprega o futuro: “Eu matarei e farei viver”.'
    reason: cross_reference
lexical_decisions:
- source_word: ᾠδήν
  choice: cântico
  rationale: Expressa naturalmente uma composição cantada de caráter solene e se ajusta à referência ao Cântico de Moisés, sem acrescentar conteúdo ausente do grego.
- source_word: ἐδίδαξεν
  choice: ensinou
  rationale: Reproduz de modo direto o aoristo e o sentido pedagógico do verbo.
- source_word: οὐκ ἐπελάθετο
  choice: não se esqueceu
  rationale: Preserva diretamente a ideia de memória expressa pelo verbo, em português corrente.
- source_word: τὴν διδάσκουσαν
  choice: o qual ensina
  rationale: O particípio concorda com ᾠδήν e atribui ao cântico a ação de ensinar. A oração relativa mantém essa leve personificação e concorda com o substantivo português masculino “cântico”.
- source_word: Ἐγὼ ἀποκτενῶ, καὶ ζῆν ποιήσω
  choice: Eu matarei e farei viver
  rationale: Mantém os futuros explícitos do texto grego e conserva a força causativa de ζῆν ποιήσω, sem suavizar a declaração.
- source_word: γάρ
  choice: Pois
  rationale: Mantém a função explicativa do conector em relação ao que precede.
theological_decisions:
- issue: Forma verbal da declaração divina citada do Cântico de Moisés
  choice: Eu matarei e farei viver
  alternative: Eu mato e faço viver
  rationale: O texto imediato de 4 Macabeus emprega formas futuras; por isso, a tradução não o harmoniza silenciosamente com versões de Deuteronômio 32:39 que usam o presente.
translation_notes:
  register: Português moderno, solene e acessível. “Cântico” preserva o caráter reconhecível da referência bíblica; a construção “o qual ensina” evita ambiguidade quanto ao antecedente e mantém a personificação discreta do original.
