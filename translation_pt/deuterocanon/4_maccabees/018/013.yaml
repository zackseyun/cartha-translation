  text: And he also glorified Daniel in the lions’ pit[a], whom he also called blessed.
translation:
  language: pt
  text: E também glorificava Daniel na cova dos leões[a], a quem também chamava feliz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no fosso dos leões”. O grego diz literalmente “em uma cova de leões”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόξαζεν
  choice: glorificava
  rationale: O imperfeito preserva a ação verbal no passado e δοξάζω admite o sentido elevado de glorificar, honrar ou exaltar. Embora aplicado aqui a Daniel, “glorificava” mantém a força retórica do grego sem implicar necessariamente culto.
- source_word: ἐν λάκκῳ λεόντων
  choice: na cova dos leões
  rationale: λάκκος designa uma cova, fosso ou cisterna. “Cova dos leões” é natural em português e permanece próxima da expressão grega, literalmente “em uma cova de leões”.
- source_word: ἐμακάριζεν
  choice: chamava feliz
  rationale: μακαρίζω significa declarar, chamar ou considerar alguém feliz ou bem-aventurado. “Chamava feliz” preserva a construção verbal e é claro em português atual.
- source_word: καὶ ... καί
  choice: também ... também
  rationale: A repetição de καί liga a frase à enumeração precedente e enfatiza ambos os predicados; a repetição de “também” conserva esse efeito cumulativo.
- source_word: ὃν
  choice: a quem
  rationale: O pronome relativo retoma Daniel como objeto do segundo verbo. “A quem” preserva com clareza a relação sintática e o registro elevado.
theological_decisions:
- issue: Linguagem elevada de louvor aplicada a Daniel
  choice: “glorificava Daniel”
  alternative: “honrava Daniel” ou “exaltava Daniel”
  rationale: O grego emprega δοξάζω diretamente com Daniel como objeto. A tradução conserva a intensidade e a tensão do texto, sem suavizá-la por receio de que “glorificar” seja entendido exclusivamente como linguagem de culto.
- issue: Sentido de μακαρίζω aplicado a Daniel
  choice: “chamava feliz”
  alternative: “chamava bem-aventurado” ou “considerava feliz”
  rationale: “Chamava feliz” expressa o ato de declarar Daniel em condição afortunada ou abençoada, sem acrescentar uma conotação litúrgica que o verbo, por si só, não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se os dois “também” e o verbo forte “glorificava” para reproduzir a retórica cumulativa e elevada do grego.
