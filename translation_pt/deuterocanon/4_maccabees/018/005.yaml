  rationale: A revisão substitui a explicitação «com penas eternas» por «eternamente», solução natural em português que não fornece um substantivo ausente no grego. Também simplifica a última oração para expressar com mais clareza o afastamento do modo de vida ancestral. Mantém-se a vírgula final, pois o período continua no versículo seguinte.
