review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente o contraste entre a punição terrena e a punição duradoura, a incapacidade completa de Antíoco e a coerção cultural visada. Contudo, «penas eternas» introduz explicitamente o substantivo «penas», ausente na expressão elíptica ἀϊδίων; uma formulação adverbial é mais natural em português e evita essa adição. A porção final também pode refletir mais diretamente a ligação entre o modo de vida ancestral e o povo ancestral.
  naturalness: O texto é claro, atual e de registro apropriado. «É castigado eternamente» é mais idiomático do que «é castigado com penas eternas» e preserva melhor a elipse do grego.
  terminology: «Tirano», «castigado», «povo de Jerusalém», «costumes estrangeiros» e «antepassados» são escolhas adequadas. «Modo de vida do povo de seus antepassados» é compreensível, mas «afastar-se do modo de vida de seus antepassados» é mais direto e evita uma construção possessiva pesada.
  issues:
  - severity: medium
    issue: Explicitação de «penas» em «com penas eternas».
    rationale: ἀϊδίων é um adjetivo sem substantivo expresso no texto grego. Embora «penas» seja inferível pelo contexto de κολάζεται, a tradução principal não precisa suprir esse substantivo; «é castigado eternamente» preserva a concisão e a indeterminação lexical.
  - severity: low
    issue: Formulação final excessivamente parafrástica.
    rationale: «Abandonar o modo de vida do povo de seus antepassados» introduz uma relação mais elaborada do que a construção grega requer. «Afastar-se do modo de vida de seus antepassados» comunica naturalmente a separação do modo de vida ancestral, mantendo a referência étnico-cultural no contexto.
  revised_text: E o tirano Antíoco foi castigado também na terra e é castigado eternamente[a]; pois não conseguiu de modo algum obrigar o povo de Jerusalém a adotar costumes estrangeiros e a afastar-se do modo de vida de seus antepassados,
