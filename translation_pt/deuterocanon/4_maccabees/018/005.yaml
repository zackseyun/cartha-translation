- from: E o tirano Antíoco foi castigado também na terra e é castigado com penas eternas[a]; pois não conseguiu de modo algum obrigar o povo de Jerusalém a adotar costumes estrangeiros e a abandonar o modo de vida do povo de seus antepassados,
