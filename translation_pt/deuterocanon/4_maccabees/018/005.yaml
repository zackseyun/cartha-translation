base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/005.yaml
  text: And the tyrant Antiochus has been punished also on earth[a], and is punished with eternal things; for he was utterly unable to compel the people of Jerusalem to adopt foreign ways and to abandon the customs of their fathers' nation,
translation:
  language: pt
  text: E o tirano Antíoco foi castigado também na terra e é castigado eternamente[a]; pois não conseguiu de modo algum obrigar o povo de Jerusalém a adotar costumes estrangeiros e a afastar-se do modo de vida de seus antepassados,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «é castigado com penas eternas». O grego traz uma expressão elíptica com «eternas» e não declara o substantivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τύραννος
  choice: tirano
  rationale: Preserva a carga moral negativa do termo grego e caracteriza o governo opressor de Antíoco sem o neutralizar como mero “rei” ou “governante”.
- source_word: τετιμώρηται
  choice: foi castigado
  rationale: O perfeito indica uma punição já sofrida, cujos efeitos permanecem relevantes; a forma portuguesa é clara e natural.
- source_word: ἀϊδίων κολάζεται
  choice: é castigado com penas eternas
  rationale: Em português, a expressão requer maior explicitação para ser inteligível. “Penas” é suprido pelo contexto de κολάζεται, enquanto a nota registra que o grego deixa o substantivo elíptico.
- source_word: οὐδὲν οὐδαμῶς ἴσχυσεν
  choice: não conseguiu de modo algum
  rationale: Reproduz de maneira idiomática a negação enfática acumulada no grego.
- source_word: ἀναγκάσαι
  choice: obrigar
  rationale: Expressa diretamente a coerção indicada pelo infinitivo, em registro atual e digno.
- source_word: τοὺς Ἱεροσολυμείτας
  choice: o povo de Jerusalém
  rationale: É mais natural e abrangente em português moderno do que “os jerusalemitas”, mantendo a referência coletiva.
- source_word: ἀλλοφυλῆσαι
  choice: adotar costumes estrangeiros
  rationale: Comunica a assimilação cultural e religiosa a outro povo sugerida pelo verbo, evitando a ideia inadequada de simples mudança geográfica.
- source_word: τῶν πατρίων ἐθνῶν ἐκδιαιτηθῆναι
  choice: abandonar o modo de vida do povo de seus antepassados
  rationale: “Modo de vida” reflete a dimensão de prática e conduta em ἐκδιαιτηθῆναι; “povo de seus antepassados” conserva a referência transmitida a πατρίων e ἐθνῶν de forma compreensível em português.
theological_decisions:
- issue: A natureza da punição duradoura de Antíoco em ἀϊδίων κολάζεται
  choice: O texto afirma que, além do castigo terreno, Antíoco está sujeito a penas eternas, sem definir sua forma ou mecanismo.
  alternative: “é castigado eternamente” ou, de modo mais literal e elíptico, “é castigado com coisas eternas”.
  rationale: O contraste com o castigo na terra aponta para retribuição contínua, mas o grego não explicita o substantivo qualificado por ἀϊδίων. A tradução torna a frase natural e a nota preserva essa característica textual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. Conservou-se a vírgula final porque o período grego continua no versículo seguinte.
