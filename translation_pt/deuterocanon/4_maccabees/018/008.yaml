base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/008.yaml
  text: No destroyer in the desolate wilderness ruined me in the open field[a], nor did the serpent, destroyer through deceit, violate the purity of my virginity; but I remained with my husband through the time of my prime.
translation:
  language: pt
  text: Nenhum devastador do deserto, destruidor no campo aberto,[a] me corrompeu; nem a serpente, que devasta por meio do engano, violou a pureza da minha virgindade; mas permaneci com meu marido por todo o tempo do meu vigor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego acumula duas designações destrutivas na primeira oração: literalmente, “um devastador do deserto, um destruidor no campo aberto”. A construção é condensada e sua relação exata com a descrição da serpente na oração seguinte pode ser entendida de mais de uma maneira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέφθειρέν
  choice: corrompeu
  rationale: O verbo pode indicar destruir ou corromper. No paralelismo com a violação da virgindade, “corrompeu” conserva a dimensão física e moral sem tornar explícito além do grego.
- source_word: λυμεὼν
  choice: devastador / devastadora
  rationale: O substantivo designa quem causa dano, arruína ou devasta. A repetição, com flexão de gênero em português por causa de “serpente”, preserva a insistência retórica do grego.
- source_word: τῆς ἐρημίας
  choice: do deserto
  rationale: Mantém o genitivo ligado ao primeiro “devastador” e a imagem de um lugar ermo, sem especificar uma geografia técnica.
- source_word: φθορεὺς ἐν πεδίῳ
  choice: me corrompeu em campo aberto
  rationale: ἐν πεδίῳ significa “no campo/na planície”. Como φθορεύς se acumula em aposição com λυμεών, a tradução evita uma duplicação pesada, mas registra em nota a compressão do original.
- source_word: ἐλυμήνατό
  choice: violou
  rationale: Com “a pureza da minha virgindade” como objeto, o verbo aponta para ultraje ou violação sexual, não apenas dano genérico.
- source_word: τὰ ἁγνὰ τῆς παρθενίας
  choice: a pureza da minha virgindade
  rationale: Converte naturalmente o plural substantivado grego, “as coisas puras da virgindade”, preservando a ênfase na castidade.
- source_word: ἀπάτης
  choice: pelo engano
  rationale: O genitivo pode caracterizar o agente ou indicar seu meio de ação. “Pelo engano” preserva essa relação sem reduzir o termo a mero adjetivo.
- source_word: ὄφις
  choice: a serpente
  rationale: “Serpente” mantém o registro elevado e a provável ressonância da serpente enganadora, sem explicitar a alusão no texto.
- source_word: ἔμεινα
  choice: permaneci
  rationale: Expressa continuidade perseverante e se ajusta ao registro digno da passagem.
- source_word: χρόνον ἀκμῆς
  choice: durante o vigor da vida
  rationale: ἀκμή denota auge, plenitude ou vigor. A formulação é natural e deixa em aberto se o foco recai na juventude, na maturidade ou no período de maior vigor.
- source_word: σὺν ἀνδρί
  choice: com meu marido
  rationale: Embora ἀνήρ também possa significar simplesmente “homem”, o contexto autobiográfico de virgindade, castidade e união conjugal favorece “marido”.
theological_decisions:
- issue: Possível alusão à serpente enganadora e afirmação de pureza sexual
  choice: Manter “a serpente” e “pelo engano” sem ampliar a alusão.
  alternative: Traduzir genericamente como “cobra enganadora” ou identificar expressamente a serpente com uma figura teológica específica.
  rationale: ὄφις e ἀπάτης sustentam a ressonância literária, mas o versículo não identifica explicitamente a serpente nem desenvolve a alusão; a tradução conserva essa tensão.
- issue: Relação entre o primeiro devastador e a serpente
  choice: Conservar duas orações coordenadas e a repetição de “devastador/devastadora”.
  alternative: Fundir todas as expressões em uma única descrição da serpente.
  rationale: A sintaxe e a acumulação de termos destrutivos são comprimidas e podem permitir mais de uma análise. A tradução não força uma identificação completa, e a nota sinaliza a dificuldade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem retórica e a repetição do original foram preservadas sempre que naturais; a nota registra a sintaxe comprimida sem impor uma interpretação única.
