  text: And Phinehas the zealot was speaking to us[b][a], and Hananiah and Azariah and Mishael in the fire were teaching you.
translation:
  language: pt
  text: E Fineias, o zeloso,[a] falava conosco, e os que estavam no fogo — Ananias, Azarias e Misael — ensinavam a vocês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o homem cheio de zelo”. O termo grego destaca o zelo exemplar de Fineias.'
    reason: lexical_alternative
  - marker: b
    text: 'Literalmente: “os que estavam no fogo”. A expressão identifica os três jovens pela provação na fornalha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: falava
  rationale: O imperfeito grego sugere ação contínua ou reiterada; “falava” preserva esse aspecto com naturalidade.
- source_word: ζηλωτὴν
  choice: o zeloso
  rationale: O substantivo caracteriza Fineias por seu zelo exemplar. “O zeloso” evita a possível associação moderna de “zelote” com um partido político-religioso posterior.
- source_word: Φινεές
  choice: Fineias
  rationale: Forma bíblica tradicional e amplamente reconhecida em português.
- source_word: ἐδίδασκεν
  choice: ensinavam
  rationale: Embora o verbo esteja no singular no grego, o complemento enumera três personagens; em português, a concordância semântica no plural é natural e comunica que os três serviam de exemplo instrutivo. O imperfeito é preservado.
- source_word: τοὺς ἐν πυρὶ
  choice: os que estiveram no fogo
  rationale: A expressão identifica os três jovens por sua provação na fornalha. “Estiveram” torna explícita a referência histórica sem sugerir que permaneciam literalmente no fogo no momento do discurso.
- source_word: Ἀνανίαν καὶ Ἀζαρίαν καὶ Μισαήλ
  choice: Ananias, Azarias e Misael
  rationale: Empregam-se as formas bíblicas correntes em português, com coordenação natural.
theological_decisions:
- issue: Função retórica de Fineias e dos três jovens como exemplos
  choice: Os imperfeitos são vertidos como “falava” e “ensinavam”, apresentando as figuras recordadas como instrutores pelo seu exemplo.
  alternative: Traduzir pontualmente por “falou” e “ensinaram”, como simples referência histórica.
  rationale: O aspecto verbal e o contexto retórico favorecem uma ação apresentada como contínua, sem transformar essa nuance literária em afirmação doutrinária.
- issue: Sentido de ζηλωτής aplicado a Fineias
  choice: “o zeloso”
  alternative: “o zelote”
  rationale: A tradução conserva o destaque dado ao zelo exemplar de Fineias e evita importar a identidade do movimento zelote de época posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os nomes seguem formas bíblicas correntes em português. A repetição grega de καί entre os três nomes foi suavizada para a coordenação portuguesa normal.
