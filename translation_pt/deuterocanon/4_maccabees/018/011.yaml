base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/011.yaml
  text: And he recounted to us Abel[a], who was slain by Cain, and Isaac being offered up as a whole burnt offering, and Joseph in prison.
translation:
  language: pt
  text: Ela nos lia sobre Abel, morto por Caim, sobre Isaque, oferecido como holocausto[a], e sobre José, na prisão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega aqui a linguagem sacrificial do holocausto, uma oferta inteiramente queimada, evocando Gênesis 22; Isaque, porém, não chegou a ser sacrificado.
    reason: Esclarece a força sacrificial do termo grego sem dar a entender que o sacrifício de Isaque foi consumado.
lexical_decisions:
- source_word: ἀνεγίνωσκεν … ἡμῖν
  choice: nos lia sobre
  rationale: O verbo ἀναγινώσκω, no grego deste período, significa normalmente “ler”, e o imperfeito indica uma ação habitual ou reiterada. “Nos lia sobre” é natural em português e mantém a referência provável à leitura dos relatos das Escrituras, sem ampliar o sentido para “contava” sem necessidade.
- source_word: τὸν ἀναιρεθέντα … ὑπὸ Κάϊν
  choice: morto por Caim
  rationale: O particípio de ἀναιρέω denota aqui que Abel foi morto violentamente. “Morto por Caim” preserva com clareza a voz passiva e o agente expresso no grego.
- source_word: τὸν ὁλοκαυτούμενον Ἰσαάκ
  choice: Isaque, oferecido como holocausto
  rationale: ὁλοκαυτούμενον emprega linguagem sacrificial de oferta inteiramente queimada. “Oferecido como holocausto” conserva a alusão a Gênesis 22 sem afirmar que Isaque chegou a ser morto ou queimado.
- source_word: τὸν ἐν φυλακῇ Ἰωσήφ
  choice: José, na prisão
  rationale: A expressão locativa ἐν φυλακῇ refere-se diretamente ao encarceramento de José; “na prisão” é a formulação moderna mais clara.
- source_word: Ἄβελ / Κάϊν / Ἰσαάκ / Ἰωσήφ
  choice: Abel / Caim / Isaque / José
  rationale: Foram usadas as formas tradicionais e amplamente reconhecidas desses nomes bíblicos em português.
theological_decisions:
- issue: Linguagem sacrificial aplicada a Isaque
  choice: oferecido como holocausto
  alternative: sendo queimado por inteiro
  rationale: A tradução mantém a terminologia sacrificial deliberada do grego e sua ligação com Gênesis 22, mas evita sugerir, contra o próprio relato, que Isaque tenha sido efetivamente morto e consumido pelo fogo.
translation_notes:
  register: Português moderno, claro e digno, com formas bíblicas correntes. A repetição de “sobre” torna explícita em português a relação dos três nomes com o verbo “lia”, enquanto as aposições breves preservam o ritmo enumerativo do grego.
