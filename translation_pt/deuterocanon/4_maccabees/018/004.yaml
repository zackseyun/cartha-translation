base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/004.yaml
  text: And because of them the nation was at peace[a], and, having renewed good order in the homeland[b], it has besieged the enemies completely.
translation:
  language: pt
  text: E, por causa deles[a], a nação viveu em paz e, tendo restaurado a boa ordem na pátria, expulsou por completo os inimigos mediante cerco[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio deles”; o grego pode indicar causa ou instrumento.
    reason: lexical_alternative
  - marker: b
    text: O verbo grego é intensivo, deriva de “sitiar” e pode indicar vencer, tomar ou expulsar mediante cerco; também pode ser entendido mais literalmente como “sitiou completamente os inimigos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ αὐτοὺς
  choice: por causa deles
  rationale: διά com acusativo expressa mais naturalmente causa neste contexto; a formulação mantém a relevância causal dos mártires sem definir além do que o versículo afirma.
- source_word: εἰρήνευσεν
  choice: viveu em paz
  rationale: O verbo pode significar estar ou viver em paz. A escolha é natural em português e não sugere necessariamente a celebração de um tratado.
- source_word: τὸ ἔθνος
  choice: a nação
  rationale: Preserva o sentido coletivo e político da comunidade judaica no contexto.
- source_word: εὐνομίαν
  choice: a boa ordem
  rationale: εὐνομία indica ordem bem estabelecida sob leis adequadas; “boa ordem” evita restringir o termo apenas à legalidade abstrata ou à administração governamental.
- source_word: τὴν ἐπὶ τῆς πατρίδος
  choice: na pátria
  rationale: Localiza a ordem restaurada na terra ancestral e conserva, de modo idiomático, o valor afetivo e cívico de πατρίς.
- source_word: ἀνανεωσάμενος
  choice: tendo restaurado
  rationale: O particípio apresenta a renovação da ordem como ação anterior ou associada ao resultado militar. “Restaurado” comunica que essa ordem voltou a vigorar.
- source_word: ἐκπεπολιόρκηκε
  choice: expulsou por completo ... mediante cerco
  rationale: O perfeito composto sobre πολιορκέω contém a imagem do cerco e forte valor resultativo. A tradução exprime tanto o meio militar quanto a remoção ou derrota consumada, deixando em nota a leitura mais estritamente intensiva.
- source_word: τοὺς πολεμίους
  choice: os inimigos
  rationale: Equivalente claro e corrente, adequado ao contexto militar.
theological_decisions:
- issue: Importância causal dos mártires para a paz nacional
  choice: A paz da nação veio “por causa deles”.
  alternative: “Por meio deles”, com sentido mais instrumental.
  rationale: O grego atribui aos mártires uma função causal ou mediadora, mas este versículo, isoladamente, não define uma doutrina completa de expiação. A tradução conserva a afirmação e a tensão do texto sem ampliá-las.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. Mantiveram-se a cadeia narrativa, a causalidade explícita e a imagem militar do cerco; as ambiguidades relevantes foram registradas em notas.
