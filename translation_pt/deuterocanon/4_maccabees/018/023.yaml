base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/023.yaml
  text: But the children of Abraham[a], together with their victory-bearing mother, are gathered to the place of their fathers[b], having received pure and immortal souls from God.
translation:
  language: pt
  text: Mas os filhos de Abraão, junto com sua mãe que conquistou o prêmio[a], reúnem-se no lugar de seus antepassados[b], tendo recebido de Deus almas puras e imortais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “sua mãe portadora do prêmio”. O grego conserva a imagem atlética de uma competição em que se conquista e leva o prêmio.
    reason: lexical_alternative
  - marker: b
    text: Ou “passam a fazer companhia a seus antepassados”. O verbo grego pode enfatizar a entrada numa companhia, e não apenas o ato de reunir-se.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀβραμιαῖοι ... παῖδες
  choice: os filhos de Abraão
  rationale: A expressão designa os irmãos mártires como descendentes de Abraão. “Filhos” preserva o referente masculino do contexto e a relação de pertencimento expressa pelo adjetivo.
- source_word: σὺν τῇ ἀθλοφόρῳ μητρὶ
  choice: junto com sua mãe que conquistou o prêmio
  rationale: ἀθλοφόρος pertence à linguagem das competições e descreve quem alcança ou leva o prêmio. A formulação mantém essa imagem de maneira compreensível e natural em português.
- source_word: εἰς πατέρων χῶρον
  choice: no lugar de seus pais
  rationale: χῶρος indica lugar ou região, e πατέρων aponta para os pais ou antepassados. A tradução mantém a imagem ancestral sem identificar esse lugar com céu, paraíso ou outra localização doutrinariamente mais específica.
- source_word: συναγελιᾶζονται
  choice: reúnem-se
  rationale: O verbo exprime reunir-se ou passar a fazer parte de uma companhia. “Reúnem-se” é conciso, natural e preserva a ideia corporativa.
- source_word: ψυχὰς
  choice: almas
  rationale: No contexto da recompensa dos mártires após a morte, ψυχή tem sentido antropológico e escatológico mais bem representado por “alma” do que por “vida”.
- source_word: ἁγνὰς καὶ ἀθανάτους
  choice: puras e imortais
  rationale: A expressão verte diretamente as duas qualidades, sem ampliar ἁγνός para uma noção confessional mais específica de santidade.
- source_word: ἀπειληφότες
  choice: tendo recebido
  rationale: O particípio de ἀπολαμβάνω indica que eles receberam ou obtiveram essas almas da parte de Deus.
- source_word: παρὰ τοῦ θεοῦ
  choice: de Deus
  rationale: παρά com o genitivo marca a origem; “de Deus” expressa essa relação sem acrescentar imagens ausentes do grego.
theological_decisions:
- issue: Imagem da vida após a morte em εἰς πατέρων χῶρον
  choice: no lugar de seus pais
  alternative: na região de seus antepassados; na companhia de seus pais
  rationale: O texto indica destino e associação ancestral, mas não nomeia céu, paraíso nem seio de Abraão. A tradução conserva essa reserva teológica.
- issue: Sentido antropológico de ψυχὰς ἁγνὰς καὶ ἀθανάτους
  choice: almas puras e imortais
  alternative: vidas puras e imortais
  rationale: O contexto de martírio e recompensa além da morte favorece “almas”, preservando a afirmação do texto sem reduzi-la à continuidade da vida terrena.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. “Que conquistou o prêmio” torna inteligível a metáfora atlética sem substituí-la por um termo genérico como “triunfante”. “Pais” preserva a formulação familiar do grego; no contexto, pode abranger os antepassados.
