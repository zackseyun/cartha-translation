  text: for which divine justice has pursued[a], and will pursue, the accursed one.
translation:
  language: pt
  text: por causa das quais a justiça divina perseguiu e perseguirá o amaldiçoado[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o impuro” ou “o abominável”; o termo grego é raro e transmite forte condenação moral e religiosa.
    reason: Alternativa lexical para um termo grego raro e de sentido exato incerto.
lexical_decisions:
- source_word: ὑπὲρ ὧν
  choice: por causa das quais
  rationale: Neste contexto, ὑπέρ com o pronome relativo indica a causa ou o fundamento da ação judicial. A formulação mantém a ligação relativa com o contexto anterior sem explicitar um antecedente que o grego deixa implícito.
- source_word: ἡ θεία δίκη
  choice: a justiça divina
  rationale: δίκη pode designar justiça, punição ou vingança. “Justiça divina” preserva tanto o caráter judicial quanto a força retributiva da expressão, sem restringi-la a apenas um desses sentidos.
- source_word: μετῆλθεν
  choice: perseguiu
  rationale: O verbo expressa ir atrás de alguém com intenção hostil ou punitiva. “Perseguiu” comunica essa força e permite conservar a repetição verbal com o futuro seguinte.
- source_word: καὶ μετελεύσεται
  choice: e perseguirá
  rationale: A forma futura retoma a mesma ideia verbal de μετῆλθεν. Repetir “perseguir” preserva o paralelismo retórico entre a ação passada e a futura.
- source_word: τὸν ἀλιόστορα
  choice: o amaldiçoado
  rationale: O termo é raro e fortemente pejorativo, aparentemente relacionado a maldição, impureza ou abominação. “O amaldiçoado” expressa de modo claro sua condenação moral e religiosa, enquanto a incerteza lexical é registrada em nota.
theological_decisions:
- issue: Como traduzir δίκη no contexto da retribuição divina
  choice: a justiça divina
  alternative: a punição divina; a vingança divina
  rationale: A expressão apresenta uma ação retributiva de origem divina, mas o substantivo pode abranger tanto a justiça em sentido judicial quanto a punição que ela executa. A escolha conserva essa tensão sem impor uma leitura doutrinária mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha de perto o grego, mas permanece natural. O paralelismo temporal “perseguiu e perseguirá” foi mantido.
