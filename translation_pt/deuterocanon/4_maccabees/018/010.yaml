translation:
  language: pt
  text: que, enquanto ainda estava conosco, ensinava[a] a vocês a lei e os profetas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «costumava ensinar»; o imperfeito grego pode indicar uma ação contínua ou habitual no passado.'
    reason: lexical_alternative
  - marker: b
    text: A expressão «a lei e os profetas» refere-se às Escrituras sagradas de Israel, especialmente à Torá e aos escritos proféticos.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς
  choice: que
  rationale: Pronome relativo que retoma o antecedente no contexto anterior; «que» preserva a ligação sintática de modo natural em português.
- source_word: ἐδίδασκεν
  choice: ensinava
  rationale: O imperfeito grego apresenta a ação no passado sem delimitá-la como pontual; o imperfeito português preserva naturalmente o possível sentido contínuo ou habitual.
- source_word: ὑμᾶς
  choice: a vocês
  rationale: Pronome plural que designa os destinatários do ensino. «A vocês» é claro, corrente e evita a ambiguidade regional de «vos».
- source_word: ἔτι ὢν σὺν ἡμῖν
  choice: enquanto ainda estava conosco
  rationale: A oração temporal expressa de maneira idiomática a circunstância do particípio, preservando ἔτι («ainda») e σὺν ἡμῖν («conosco»).
- source_word: τὸν νόμον
  choice: a lei
  rationale: Refere-se à lei judaica, provavelmente à Torá. A minúscula evita acrescentar ao grego uma convenção tipográfica editorial.
- source_word: καὶ τοὺς προφήτας
  choice: e os profetas
  rationale: Mantém a conhecida associação escriturística com «a lei» e pode designar tanto os escritos proféticos como o testemunho autorizado dos profetas.
theological_decisions:
- issue: Uso de maiúsculas em «Lei» e «Profetas» como divisões técnicas das Escrituras
  choice: a lei e os profetas
  alternative: a Lei e os Profetas
  rationale: A expressão aponta claramente para as Escrituras sagradas de Israel, mas as maiúsculas seriam uma interpretação tipográfica ausente do texto grego. A nota explicita o sentido escriturístico.
- issue: Valor aspectual do imperfeito ἐδίδασκεν
  choice: ensinava
  alternative: ensinou
  rationale: «Ensinava» conserva a ação passada em curso ou costumeira sem decidir rigidamente entre esses matizes; «ensinou» seria possível, porém menos transparente quanto ao aspecto do grego.
translation_notes:
  register: Português moderno, digno e acessível, com construção de ampla compreensão e boa legibilidade brasileira. O imperfeito «ensinava» preserva a abertura aspectual do grego; as minúsculas em «lei» e «profetas» evitam impor uma convenção editorial, enquanto a nota esclarece o referente.
