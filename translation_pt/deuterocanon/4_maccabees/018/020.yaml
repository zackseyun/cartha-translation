  yaml_path: translation/deuterocanon/4_maccabees/018/020.yaml
  text: How bitter was that day—and yet not bitter—when the bitter Greek tyrant[a], after kindling fire in the cruel cauldrons and, in boiling rage, bringing the seven boys to the catapult and again to his tortures[b],
translation:
  language: pt
  text: Como foi amargo aquele dia — e não amargo[a] —, quando o amargo tirano dos gregos, depois de acender fogo nos cruéis caldeirões e, fervendo de ira, levar os sete rapazes à catapulta[b] e novamente às suas torturas,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão “e não amargo” preserva o paradoxo grego: o dia foi amargo pelo sofrimento, mas não amargo quanto à honra e à fidelidade manifestadas na perseverança dos mártires.'
    reason: lexical_alternative
  - marker: b
    text: Ou “ao potro de tortura” ou “a um instrumento de tortura”. A palavra grega normalmente designa uma catapulta ou máquina semelhante, mas aqui provavelmente se refere a um aparelho usado para infligir tormento.
    reason: lexical_alternative
lexical_decisions:
- source_word: πικρᾶς ... οὐ πικρᾶς ... πικρὸς
  choice: amargo ... não amargo ... amargo
  rationale: Mantém a repetição retórica da raiz grega e o paradoxo do texto, ainda que “amargo tirano” seja uma formulação marcada em português.
- source_word: Ἑλλήνων τύραννος
  choice: tirano dos gregos
  rationale: Conserva a construção genitiva do grego sem decidir além do texto se o tirano era grego ou apenas governava os gregos.
- source_word: πῦρ φλέξας
  choice: depois de acender fogo
  rationale: Expressa naturalmente o valor temporal do particípio aoristo e preserva a imagem concreta.
- source_word: λέβησι ὠμοῖς
  choice: nos cruéis caldeirões
  rationale: λέβης designa um caldeirão; neste contexto, ὠμός tem sentido figurado de cruel ou brutal.
- source_word: ζέουσιν θυμοῖς
  choice: fervendo de ira
  rationale: Preserva a imagem de fervura e sua provável ligação retórica com os caldeirões aquecidos.
- source_word: ἀγαγὼν
  choice: levar
  rationale: O infinitivo, subordinado a “depois de”, reproduz em português o valor circunstancial do particípio grego.
- source_word: ἐπὶ τὸν καταπέλτην
  choice: à catapulta
  rationale: Mantém o sentido lexical usual de καταπέλτης no texto principal, deixando em nota a provável aplicação do termo a um instrumento de tortura.
- source_word: τὰς βασάνους αὐτοῦ
  choice: às suas torturas
  rationale: Preserva tanto o sentido de suplícios quanto o possessivo αὐτοῦ.
- source_word: τοὺς ἑπτὰ παῖδας
  choice: os sete rapazes
  rationale: παῖδες pode designar filhos, meninos ou jovens; “rapazes” comunica juventude sem tornar explícita uma relação filial que este substantivo, isoladamente, não exige.
theological_decisions:
- issue: Paradoxo retórico em καὶ οὐ πικρᾶς
  choice: e não amargo
  alternative: e, contudo, não amargo
  rationale: A formulação escolhida conserva a justaposição abrupta do grego, sem explicar no corpo do texto em que sentido o dia não foi amargo.
- issue: Sentido de καταπέλτης no contexto de martírio
  choice: catapulta
  alternative: potro de tortura / instrumento de tortura
  rationale: O sentido lexical comum permanece no texto, enquanto a nota informa a possibilidade contextual sem apresentá-la como certeza.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A construção permanece deliberadamente incompleta e termina em vírgula porque o texto grego fornecido é um fragmento sintático que continua além deste versículo. A repetição pouco usual de “amargo” foi mantida por sua função retórica.
