  text: knowing that godly reason is master of the passions[b][a], and not only of inward sufferings but also of outward pains.
translation:
  language: pt
  text: sabendo que a razão reverente a Deus[a] é senhora das paixões[b], e não só dos sofrimentos interiores, mas também das dores exteriores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a razão piedosa”. A expressão grega é central em 4 Macabeus e designa a razão moldada pela reverência a Deus.
    reason: lexical_alternative
  - marker: b
    text: O grego distingue πάθη, “paixões”, de πόνοι, “dores” ou “sofrimentos”, e contrapõe o interior ao exterior.
    reason: lexical_clarification
lexical_decisions:
- source_word: γινώσκοντες
  choice: sabendo
  rationale: Preserva a forma participial e sua ligação com o contexto, sem decidir de modo excessivo se a relação é temporal ou causal.
- source_word: τῶν παθῶν
  choice: das paixões
  rationale: πάθη é um termo filosófico central em 4 Macabeus para paixões e impulsos sujeitos ao governo da razão; a escolha também o distingue de πόνων, 'dores'.
- source_word: δεσπότης ἐστίν
  choice: é senhora
  rationale: Conserva a metáfora de autoridade e domínio exercido pela razão, com concordância natural em português, sem usar um título religioso como 'Senhor'.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: a razão reverente a Deus
  rationale: Expressa tanto o elemento racional de λογισμός quanto a reverência religiosa de εὐσεβής, evitando que a frase seja entendida como mero racionalismo secular.
- source_word: τῶν ἔνδοθεν
  choice: das que vêm de dentro
  rationale: Mantém a oposição espacial entre o que procede do interior e as dores vindas de fora, suprindo de modo natural o referente implícito.
- source_word: τῶν ἔξωθεν πόνων
  choice: das dores que vêm de fora
  rationale: Traduz πόνων por 'dores' e reproduz claramente o contraste com as paixões interiores, sem intensificar o termo para 'tormentos'.
theological_decisions:
- issue: Tradução da expressão programática ὁ εὐσεβὴς λογισμός
  choice: a razão reverente a Deus
  alternative: a razão piedosa
  rationale: 'A formulação escolhida torna explícita a orientação para Deus presente em εὐσεβής e conserva a afirmação teológico-filosófica do livro: não é a razão autônoma, mas a razão marcada pela reverência a Deus que governa as paixões e suporta as dores externas.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção 'é senhora' preserva a personificação e a ideia de domínio do grego; 'vêm de dentro/fora' comunica de modo natural sua antítese espacial.
