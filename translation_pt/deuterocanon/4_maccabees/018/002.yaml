  source_fidelity: A abertura participial «sabendo que» e a formulação «a razão reverente a Deus é senhora das paixões» representam adequadamente γινώσκοντες e ὁ εὐσεβὴς λογισμός ... τῶν παθῶν δεσπότης. Contudo, «não só das que vêm de dentro» faz «das que» retomar explicitamente «paixões», enquanto o grego usa o substantivo neutro elíptico τῶν ἔνδοθεν em paralelo com «dores exteriores». Uma formulação que nomeie os sofrimentos interiores preserva melhor a coordenação e o contraste do versículo.
