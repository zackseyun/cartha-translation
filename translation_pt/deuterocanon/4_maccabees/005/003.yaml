  yaml_path: translation/deuterocanon/4_maccabees/005/003.yaml
  text: But if any should be unwilling to eat defiling food[b][a], let them be broken on the wheel and put to death.
translation:
  language: pt
  text: Mas, se alguns não quisessem comer alimento que os tornaria impuros[a], fossem torturados na roda[b] e mortos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “comer alimento contaminado” ou “comer algo ritualmente impuro”. O verbo grego contém em si a ideia de comer aquilo que causa impureza ritual; nesta oração, o objeto não é expresso separadamente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “fossem supliciados na roda” ou “quebrados na roda”. O particípio grego se refere a uma forma de tortura realizada com uma roda, mas não define todos os detalhes do método.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ τινες
  choice: Mas, se alguns
  rationale: Reproduz a introdução de uma nova hipótese ou exceção; “alguns” conserva o plural indefinido de τινες.
- source_word: μὴ θέλοιεν
  choice: não quisessem
  rationale: Preserva a nuance de vontade ou disposição expressa por θέλω e se integra naturalmente à construção condicional em português.
- source_word: μιεροφαγῆσαι
  choice: comer alimento que os tornaria impuros
  rationale: O verbo composto expressa comer algo ritualmente contaminante, embora o objeto não esteja declarado separadamente; a formulação explicita o efeito sem restringi-lo indevidamente a carne.
- source_word: τούτους
  choice: fossem
  rationale: Em português, o referente humano plural pode ficar implícito no sujeito da oração passiva, evitando a construção menos natural “que estes fossem”.
- source_word: τροχισθέντας
  choice: torturados na roda
  rationale: O particípio designa suplício ligado à roda; “torturados na roda” é claro e evita especificar como certo o método exato de quebrar o corpo.
- source_word: ἀναιρεθῆναι
  choice: mortos
  rationale: Expressa diretamente a execução ou eliminação física indicada pelo infinitivo passivo, em registro digno e corrente.
