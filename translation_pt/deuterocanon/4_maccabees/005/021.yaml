  text: For through either one, the law takes equal pride.
translation:
  language: pt
  text: Pois, por meio de cada um dos dois[a], a Lei se gloria igualmente.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio de qualquer um dos dois”; o grego se refere especificamente a dois elementos ou pessoas em vista.
    reason: lexical_alternative
  - marker: b
    text: Ou “a Lei se orgulha igualmente”. O grego personifica a Lei com um verbo que expressa orgulho ou exultação.
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ἑκατέρου
  choice: por meio de qualquer um dos dois
  rationale: ἑκάτερος diz respeito a cada um de dois elementos em vista. A formulação mantém a referência dual e expressa que, seja qual for dos dois considerado, ele serve de meio.
- source_word: γὰρ
  choice: pois
  rationale: γάρ introduz a explicação ou fundamentação da afirmação anterior; “pois” conserva essa ligação de modo natural e conciso.
- source_word: ὡς ὁμοίως
  choice: igualmente
  rationale: A expressão reforça a equivalência entre os dois casos. “Igualmente” transmite esse valor adverbial sem reproduzir de modo artificial a forma grega.
- source_word: ὁ νόμος
  choice: a Lei
  rationale: νόμος se refere à Lei judaica, ou Torá. A inicial maiúscula ajuda a indicar esse referente específico no contexto.
- source_word: ὑπερηφανεῖται
  choice: se gloria
  rationale: O verbo denota orgulho, exultação ou glória. “Se gloria” preserva a personificação da Lei e soa dignificado em português.
theological_decisions:
- issue: Personificação da Lei
  choice: a Lei se gloria igualmente
  alternative: a Lei é igualmente honrada por meio de ambos
  rationale: O grego apresenta a Lei como sujeito de ὑπερηφανεῖται. Manter a personificação preserva a força retórica do texto e evita transformá-la numa declaração interpretativa sobre a honra conferida à Lei.
translation_notes:
  register: Português moderno, claro e dignificado, com ampla legibilidade brasileira. “Se gloria” mantém a personificação retórica sem recorrer a linguagem excessivamente coloquial; a referência aos dois elementos permanece explícita.
