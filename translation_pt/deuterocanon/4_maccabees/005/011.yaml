lexical_decisions:
- source_word: ἀποσκεδάσεις
  choice: dissiparás
  rationale: O futuro de ἀποσκεδάννυμι comunica a ideia de dispersar ou desfazer algo espalhando-o. “Dissiparás” conserva essa imagem e soa natural em relação à confusão intelectual.
- source_word: λῆρον
  choice: o absurdo
  rationale: λῆρος pode indicar disparate, insensatez ou conversa vazia. “O absurdo” preserva a força depreciativa sem restringir o sentido apenas à fala.
- source_word: λογισμῶν
  choice: dos teus raciocínios
  rationale: λογισμός abrange raciocínio, pensamento e argumento. “Raciocínios” mantém a linguagem intelectual característica de 4 Macabeus.
- source_word: ἄξιον τῆς ἡλικίας
  choice: digna da tua idade
  rationale: A expressão descreve o que é condizente com a idade ou etapa da vida do interlocutor, sem acrescentar explicitamente a noção interpretativa de maturidade.
- source_word: ἀναλαβὼν νοῦν
  choice: assumindo uma mente
  rationale: A formulação conserva a imagem grega de tomar ou assumir uma mente, embora a expressão seja deliberadamente mais formal que a fala cotidiana.
- source_word: φιλοσοφήσεις
  choice: filosofarás
  rationale: O verbo designa explicitamente o exercício da filosofia ou da reflexão filosófica. Mantê-lo evita reduzir a linguagem conceitual do autor a um simples “pensarás”.
- source_word: τὴν τοῦ συμφέροντος ἀλήθειαν
  choice: a verdade do que é proveitoso
  rationale: συμφέρον refere-se ao que é útil, vantajoso ou benéfico. A tradução preserva a construção genitiva e sua possível tensão entre verdade e verdadeira vantagem.
theological_decisions:
- issue: Terminologia filosófica em 4 Macabeus
  choice: 'Manter a linguagem filosófica explícita: “raciocínios”, “mente” e “filosofarás”.'
  alternative: Empregar linguagem moral mais genérica, como “pensamentos”, “bom senso” e “refletirás”.
  rationale: O livro apresenta intencionalmente a piedade judaica em categorias filosóficas. Preservar essa terminologia mantém o mundo conceitual do autor e evita impor uma leitura confessional posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se a segunda pessoa do singular por corresponder ao discurso direto grego. A construção “assumindo uma mente” é formal e ligeiramente incomum, mas retém a imagem do original; “filosofarás” preserva deliberadamente a terminologia central da obra.
