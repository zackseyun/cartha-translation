  yaml_path: translation/deuterocanon/4_maccabees/005/037.yaml
  text: My fathers will welcome me as a champion[a], since I did not fear your constraints, even unto death.
translation:
  language: pt
  text: Meus antepassados me acolherão como combatente[a], pois não temi as tuas coações até a morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “meus antepassados me acolherão para uma luta/competição”. O grego emprega imagem agonística, que pode evocar uma competição atlética ou um combate.
    reason: A construção grega com ἀγῶνα é incomum e admite mais de uma forma de representar sua imagem em português.
lexical_decisions:
- source_word: ἀγών᾽
  choice: como combatente
  rationale: A forma elidida representa ἀγῶνα e introduz uma imagem agonística, ligada à luta, ao combate ou à competição. “Como combatente” produz uma frase natural em português e conserva essa imagem sem elevar explicitamente o personagem à condição de “campeão”.
- source_word: οἱ πατέρες
  choice: meus antepassados
  rationale: No contexto da morte iminente e da expectativa de acolhimento, refere-se aos pais ancestrais, não apenas aos pais imediatos. “Meus antepassados” comunica esse sentido com clareza no português atual.
- source_word: προσδέξονται
  choice: me acolherão
  rationale: O verbo expressa recepção favorável. “Acolherão” preserva tanto o ato de receber quanto sua conotação calorosa.
- source_word: μὴ φοβηθέντα
  choice: pois não temi
  rationale: O particípio aoristo caracteriza o falante e pode exprimir a razão de seu acolhimento. A oração causal é natural em português sem apagar essa relação sintática.
- source_word: σου
  choice: tuas
  rationale: Mantém a referência direta, em segunda pessoa singular, ao agente das coações.
- source_word: τὰς μέχρι θανάτου ἀνάγκας
  choice: as tuas coações, mesmo até a morte
  rationale: ἀνάγκας designa pressões coercivas ou imposições, e μέχρι θανάτου indica seu alcance extremo. A tradução conserva o plural, a coerção exercida pelo interlocutor e o limite da morte.
theological_decisions:
- issue: Identidade dos “pais” e acolhimento após a morte
  choice: “Meus antepassados” acolherão o falante após sua resistência fiel.
  alternative: Entender “os pais” apenas como os antepassados venerados, sem salientar uma recepção após a morte.
  rationale: O contexto de martírio iminente favorece a ideia de acolhimento pelos antepassados falecidos. A tradução mantém a afirmação no nível do próprio texto, sem desenvolver uma doutrina mais ampla sobre o estado dos mortos.
- issue: Sentido da imagem agonística
  choice: “Como combatente”, preservando a imagem de luta aplicada ao falante.
  alternative: “Para uma luta/competição” ou “como campeão”.
  rationale: “Como combatente” mantém a metáfora agonística e a referência pessoal sem transformar a construção ambígua em uma afirmação honorífica mais específica do que o grego exige.
translation_notes:
  register: Português atual, digno e de leitura ampla, com construção compreensível no Brasil. Emprega “antepassados” para esclarecer o referente de “pais” e conserva a segunda pessoa singular, adequada ao confronto direto com o tirano.
