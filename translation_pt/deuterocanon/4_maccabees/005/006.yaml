base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/006.yaml
  text: Before I begin the tortures against you[a], old man, I would advise you of this, so that by tasting the pork you might save yourself. For I respect your age and your gray hair, though after having had it for so long a time[b], you do not seem to me to philosophize by practicing the religion of the Jews.
translation:
  language: pt
  text: 'Antes de começar as torturas contra você, ó ancião, eu lhe daria este conselho: para que, provando da carne de porco, você possa preservar a vida. Pois respeito sua idade e seus cabelos brancos; contudo, embora os tenha há tanto tempo, você não me parece filosofar ao praticar a religião dos judeus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “filosofar”, preservando a linguagem recorrente do livro sobre filosofia e razão.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἄρξασθαι τῶν κατὰ σοῦ βασάνων
  choice: Antes de começar as torturas contra você
  rationale: Expressa naturalmente a construção temporal com πρίν e conserva a primeira pessoa, enquanto βάσανοι designa aqui torturas concretas dirigidas contra Eleazar.
- source_word: ὦ πρεσβῦτα
  choice: ó ancião
  rationale: O vocativo se refere à idade avançada, não necessariamente a um cargo. “Ancião” mantém um tom direto e digno; a interjeição “ó” assinala o vocativo.
- source_word: συμβουλεύσαιμʼ ἂν σοι ταῦτα
  choice: eu lhe daria o seguinte conselho
  rationale: O optativo com ἄν apresenta a recomendação de modo cortês ou atenuado, em contraste retórico com a ameaça de tortura.
- source_word: ἀπογευσάμενος τῶν ὑείων
  choice: prove um pouco da carne de porco
  rationale: ἀπογεύομαι indica provar ou saborear, e τὰ ὕεια se refere à carne suína. A formulação é clara e corrente em português.
- source_word: σώζοιο
  choice: possa preservar a vida
  rationale: No contexto, o verbo aponta para escapar da tortura e da morte. A expressão evita sugerir, sem base contextual, salvação espiritual, e a alternativa mais literal é registrada em nota.
- source_word: αἰδοῦμαι γάρ σου τὴν ἡλικίαν καὶ τὴν πολιάν
  choice: Pois respeito sua idade e seus cabelos brancos
  rationale: αἰδέομαι exprime respeito ou reverência neste contexto, e πολιᾶ designa os cabelos brancos próprios da velhice.
- source_word: ἣν μετὰ τοσοῦτον ἔχων χρόνον
  choice: embora os tenha há tanto tempo
  rationale: Preserva a referência irônica aos cabelos brancos mencionados imediatamente antes. O singular grego é ajustado ao plural idiomático “cabelos brancos” em português.
- source_word: οὔ μοι δοκεῖς φιλοσοφεῖν
  choice: você não me parece filosofar
  rationale: Mantém explicitamente o vocabulário de filosofia, recorrente e tematicamente importante em 4 Macabeus, sem reduzi-lo a “ser sensato” ou “ser sábio”.
- source_word: τῇ Ἰουδαίων χρωμένῃ θρησκείᾳ
  choice: ao praticar a religião dos judeus
  rationale: χράομαι com o dativo pode indicar uso, adesão ou prática; “praticar” comunica com naturalidade a observância religiosa indicada por θρησκεία.
theological_decisions:
- issue: Sentido de σώζοιο
  choice: preservação da vida diante da tortura e da morte
  alternative: “possa salvar-se”, sem explicitar o tipo de salvação
  rationale: O governante procura persuadir Eleazar a comer carne proibida para escapar do castigo físico iminente. A tradução principal torna esse referente contextual explícito sem introduzir uma afirmação sobre salvação espiritual.
- issue: Tradução de φιλοσοφεῖν
  choice: conservar o verbo “filosofar”
  alternative: “agir com sabedoria” ou “ser sensato”
  rationale: O livro relaciona repetidamente razão, filosofia e fidelidade religiosa. Preservar o termo mantém essa rede conceitual e a tensão irônica da acusação do governante.
- issue: Referente de ἣν
  choice: os cabelos brancos
  alternative: a velhice ou, de modo mais amplo, a idade avançada
  rationale: A concordância singular feminina no grego aponta mais diretamente para πολιάν. Como o português emprega naturalmente o plural “cabelos brancos”, o pronome correspondente também fica no plural.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O texto conserva o tom cortês, porém ameaçador, do discurso e mantém o vocabulário filosófico característico de 4 Macabeus.
