base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/010.yaml
  text: If[a], while vainly boasting about the truth, you still despise even me at the cost of your own punishment[b], will you not wake up from your foolish philosophy?
translation:
  language: pt
  text: Se, vangloriando-se em vão a respeito da verdade, você ainda desprezar até a mim, à custa do seu próprio castigo[a], não despertará da filosofia insensata de vocês[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para sua própria punição” ou “trazendo castigo sobre si mesmo”. A expressão grega admite mais de uma formulação da consequência que recai sobre o próprio interlocutor.
    reason: lexical_alternative
  - marker: b
    text: Ou “filosofia tagarela” ou “filosofia de palavreado vazio”. O adjetivo grego pode indicar fala vazia, tola ou tagarela. “De vocês” traduz um pronome plural.
    reason: lexical_alternative
lexical_decisions:
- source_word: κενοδοξῶν
  choice: vangloriando-se em vão
  rationale: Preserva tanto a ação verbal quanto a ideia de glória própria vazia ou sem fundamento, em português natural.
- source_word: περὶ τὸ ἀληθές
  choice: da verdade
  rationale: Em ligação com “vangloriar-se”, a construção portuguesa “vangloriar-se da verdade” exprime de modo idiomático que a verdade é o assunto ou fundamento alegado da jactância, sem definir em que consiste essa verdade.
- source_word: κἀμοῦ
  choice: até a mim
  rationale: 'A crase grega inclui καί e dá ênfase inclusiva: o interlocutor chega a desprezar também o próprio falante. “Até a mim” conserva essa força retórica.'
- source_word: καταφρονήσεις
  choice: desprezar
  rationale: O verbo indica desconsideração marcada por desprezo; a escolha mantém a intensidade e a concisão do grego.
- source_word: ἐπὶ τῇ ἰδίᾳ τιμωρίᾳ
  choice: para seu próprio castigo
  rationale: A frase aponta para a consequência que recairá sobre o próprio interlocutor. A formulação é clara, mas a nota registra alternativas possíveis para a relação expressa por ἐπί.
- source_word: οὐκ ἐξυπνώσεις
  choice: não despertará
  rationale: Mantém a metáfora de despertar de um estado de ilusão e a forma de pergunta retórica, que espera uma resposta afirmativa.
- source_word: φλυάρου φιλοσοφίας
  choice: filosofia insensata
  rationale: φλύαρος pode caracterizar fala vazia, tola ou tagarela. “Insensata” comunica com clareza o juízo depreciativo, enquanto a nota preserva a imagem verbal mais concreta.
- source_word: ὑμῶν
  choice: de vocês
  rationale: Explicita que o pronome grego é plural, evitando a ambiguidade de “sua” e preservando o alargamento da censura do indivíduo ao grupo ou à corrente que ele representa.
theological_decisions:
- issue: Força retórica da repreensão
  choice: A fala é apresentada como um desafio moral incisivo, mantendo a metáfora do despertar e o vocabulário filosófico.
  alternative: Parafrasear a conclusão como “não cairá em si e abandonará suas ideias absurdas?”.
  rationale: A alternativa explicaria o sentido, mas apagaria a metáfora de ἐξυπνάω e substituiria φιλοσοφία por uma categoria mais genérica. O texto conserva a tensão entre a linguagem filosófica da obra e seu uso polêmico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “você” no tratamento singular e “de vocês” para tornar visível a mudança do pronome grego ao plural. A sintaxe mantém o tom direto e confrontador do original.
