  yaml_path: translation/deuterocanon/4_maccabees/005/031.yaml
  text: I am not so old and manly that[a], for the sake of godliness, my reason should not be youthful.
translation:
  language: pt
  text: Não sou tão velho e viril que, por causa da devoção a Deus[a], minha razão deixe de ser jovem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «piedade». O termo grego indica devoção reverente a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέρων
  choice: velho
  rationale: Expressa idade avançada e se encaixa naturalmente na construção predicativa «não sou tão velho».
- source_word: ἀνδρῶδης
  choice: viril
  rationale: Preserva a força masculina e retórica do termo grego, que aqui sugere firmeza própria de um homem adulto, sem reduzi-lo apenas a «maduro».
- source_word: εὐσέβειαν
  choice: devoção a Deus
  rationale: Torna explícita, em português corrente, a reverência fiel a Deus e à sua lei que o termo designa neste contexto judaico.
- source_word: νεάζειν
  choice: ser jovem
  rationale: Conserva a metáfora de juventude em contraste direto com a velhice do falante.
- source_word: λογισμόν
  choice: razão
  rationale: 'Mantém o sentido filosófico central de λογισμός em 4 Macabeus: a faculdade racional que governa as paixões.'
- source_word: ὥστε μοι ... μὴ νεάζειν τὸν λογισμόν
  choice: que ... minha razão deixe de ser jovem
  rationale: 'Reproduz de modo idiomático o resultado negado pela construção ὥστε com infinitivo: idade e virilidade não impedem que sua razão permaneça jovem em favor da devoção.'
theological_decisions:
- issue: Sentido de εὐσέβεια no contexto do martírio judaico
  choice: devoção a Deus
  alternative: piedade
  rationale: A formulação escolhida comunica claramente a orientação religiosa do termo sem soar arcaica nem importar uma acepção denominacional; a alternativa lexical é preservada em nota.
- issue: Força masculina de ἀνδρῶδης
  choice: viril
  alternative: maduro; vigoroso
  rationale: O grego tem forma e força explicitamente masculinas. «Viril» conserva essa dimensão retórica, embora possa também sugerir vigor e firmeza adulta.
- issue: Relação entre velhice corporal e juventude da razão
  choice: minha razão deixe de ser jovem
  alternative: minha razão não seja jovem
  rationale: A escolha mantém a tensão metafórica e torna claro que a idade avançada não extingue a juventude da faculdade racional motivada pela devoção, sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi levemente naturalizada, preservando o paradoxo retórico entre a velhice do homem e a juventude de sua razão.
