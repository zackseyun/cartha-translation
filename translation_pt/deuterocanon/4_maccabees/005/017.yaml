  text: Therefore[a], indeed, we consider it right in no way to break the law.
translation:
  language: pt
  text: Por isso, de fato, julgamos correto[a] não transgredir a lei de modo algum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “consideramos apropriado”.'
    reason: Alternativa lexical para ἀξιοῦμεν, que exprime o juízo sobre aquilo que é adequado ou correto.
lexical_decisions:
- source_word: διὸ
  choice: Por isso
  rationale: Introduz a conclusão decorrente do argumento anterior, preservando de modo natural a força inferencial do grego.
- source_word: δὴ
  choice: de fato
  rationale: Conserva a ênfase confirmatória da partícula sem lhe atribuir peso excessivo.
- source_word: κατʼ οὐδένα τρόπον
  choice: de modo algum
  rationale: Expressa a negação categórica e, junto do infinitivo, deixa claro que nenhuma forma de transgressão é admitida.
- source_word: παρανομεῖν
  choice: transgredir a lei
  rationale: Reproduz diretamente a ideia de agir contra a lei; “transgredir” mantém o teor jurídico e moral em linguagem compreensível.
- source_word: ἀξιοῦμεν
  choice: julgamos correto
  rationale: Neste contexto, o verbo indica uma avaliação do que é apropriado ou devido, não apenas uma opinião neutra.
theological_decisions:
- issue: Identidade da lei mencionada
  choice: a lei
  alternative: a Lei
  rationale: Embora o contexto aponte para a lei ancestral judaica, o versículo não traz qualificativo explícito. A forma em minúscula preserva a generalidade gramatical sem negar a referência contextual.
- issue: Alcance da negação
  choice: não transgredir a lei de modo algum
  alternative: de modo algum julgamos correto transgredir a lei
  rationale: A posição de κατʼ οὐδένα τρόπον junto de παρανομεῖν favorece sua ligação com o ato de transgredir. A redação mantém essa relação sem alterar o sentido prático da declaração.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “De fato” retém a ênfase de δὴ; “transgredir a lei” preserva o teor jurídico-moral do original.
