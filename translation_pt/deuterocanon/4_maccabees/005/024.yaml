base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/024.yaml
  text: And it trains in righteousness[a], so that one may be fair in all matters of conduct, and it teaches piety[b], so that one may worship only the God who truly exists with due majesty.
translation:
  language: pt
  text: E ela educa para a retidão[a], para que se aja com equidade em todos os aspectos da conduta, e ensina a piedade, para que se adore somente o Deus que verdadeiramente existe[b], de modo digno de sua majestade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “justiça”. O grego δικαιοσύνη pode indicar tanto retidão moral como justiça; neste contexto, a formação ética está em primeiro plano.
    reason: lexical_alternative
  - marker: b
    text: Ou “somente o verdadeiro Deus”. O grego enfatiza literalmente “o Deus que existe”, em contraste com os falsos deuses.
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιοσύνην
  choice: retidão
  rationale: No contexto de formação ética, o termo indica caráter e conduta moralmente corretos. “Justiça” continua sendo uma nuance possível e é preservada em nota.
- source_word: παιδεύει
  choice: educa
  rationale: O verbo descreve formação moral, não mera transmissão de informação; “educa” é natural em português e conserva esse caráter formativo.
- source_word: διὰ πάντων τῶν ἠθῶν
  choice: em toda a conduta
  rationale: ἤθη abrange hábitos, caráter e comportamento; a formulação portuguesa comunica de modo conciso o conjunto da vida moral.
- source_word: ἰσονομεῖν
  choice: agir com equidade
  rationale: O verbo sugere igualdade de tratamento ou observância do que é equitativo. “Agir com equidade” preserva essa força ética sem restringi-la ao âmbito jurídico.
- source_word: εὐσεβείαν
  choice: piedade
  rationale: Designa devoção reverente para com Deus; “piedade” é a correspondência tradicional e ainda inteligível no registro bíblico moderno.
- source_word: σέβειν
  choice: adorar
  rationale: Com Deus como objeto explícito, o verbo exprime reverência religiosa e culto; “adorar” transmite adequadamente essa força.
- source_word: μόνον τὸν ὄντα θεὸν
  choice: somente o Deus que verdadeiramente existe
  rationale: A expressão ressalta o Deus real e existente em contraste com deuses falsos, preservando a ênfase ontológica do particípio ὄντα.
- source_word: μεγαλοπρεπῶς
  choice: de modo digno de sua majestade
  rationale: O advérbio indica uma maneira condizente com grandeza e esplendor. A expressão é natural em português e evita o sentido possivelmente exibicionista de “magnificamente”.
theological_decisions:
- issue: Sentido de δικαιοσύνη em contexto ético não paulino
  choice: retidão
  alternative: justiça
  rationale: “Retidão” destaca a formação moral indicada pelo contexto, enquanto “justiça” permanece uma leitura lexical legítima e é registrada em nota.
- issue: Força de μόνον τὸν ὄντα θεὸν
  choice: somente o Deus que verdadeiramente existe
  alternative: somente o verdadeiro Deus
  rationale: A redação escolhida conserva a ênfase explícita do grego no ser real de Deus, em contraste com falsos deuses, sem acrescentar uma formulação doutrinária externa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação e a dupla construção final do grego foram preservadas. O pronome impessoal “se” evita introduzir um sujeito não expresso, e as notas mantêm as alternativas lexicais e teológicas relevantes.
