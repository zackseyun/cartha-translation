  text: He permitted us to eat the things suited to our souls[a], but he forbade us to eat flesh that is opposed to them.
translation:
  language: pt
  text: Ele nos permitiu comer as coisas adequadas às nossas almas[a], mas nos proibiu de comer carne que lhes é contrária.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as coisas afins às nossas almas” e, na sequência, “carne que lhes é oposta”. O grego ressalta a correspondência ou incompatibilidade com as almas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκειωθησόμενα
  choice: estariam em harmonia
  rationale: O particípio futuro passivo expressa correspondência, afinidade ou adequação às almas. A formulação preserva essa relação moral sem especificá-la além do grego.
- source_word: ψυχαῖς
  choice: almas
  rationale: Neste contexto, ψυχή possui força moral e psicológica, não apenas o sentido de vida biológica; “almas” conserva essa dimensão antropológica.
- source_word: ἐπέτρεψεν
  choice: permitiu
  rationale: Expressa de modo claro e digno a permissão no contexto da instrução divina sobre alimentos.
- source_word: ἐναντιωθησόμενα
  choice: seria contrária
  rationale: Mantém a ideia de oposição ou incompatibilidade com as almas e, em português, concorda naturalmente com o substantivo coletivo “carne”.
- source_word: ἐκώλυσεν
  choice: proibiu
  rationale: No paralelismo com “permitiu”, o verbo indica proibição, mais do que mero impedimento.
- source_word: σαρκοφαγεῖν
  choice: comer a carne
  rationale: Reproduz diretamente o sentido de “comer carne” e conserva a repetição verbal de “comer” presente no argumento.
theological_decisions:
- issue: Força antropológica de ψυχαῖς na relação com a lei alimentar
  choice: “almas”, com a linguagem relacional “em harmonia” e “contrária”
  alternative: “vidas” ou “seres”, com uma formulação mais concreta
  rationale: O texto associa os alimentos à vida interior e moral. A tradução mantém essa afirmação ético-antropológica sem introduzir uma definição doutrinária posterior da alma.
- issue: Natureza da correspondência entre alimentos e almas
  choice: Preservar a relação como harmonia ou contrariedade
  alternative: Explicitar a relação como benefício ou dano moral
  rationale: Os particípios gregos descrevem congruência e oposição, mas não definem precisamente o mecanismo; a tradução conserva essa tensão sem reduzir o sentido a saúde física ou contaminação espiritual.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o contraste retórico entre permissão e proibição e conserva o plural “nossas almas” do grego.
