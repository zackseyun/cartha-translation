  text: So do not suppose this to be a small sin[a], if we were to eat polluted food.
translation:
  language: pt
  text: Portanto, não pense que seria um pecado pequeno[a] se comêssemos alimento impuro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «se comêssemos o que é impuro». O verbo grego reúne a ideia de comer alimento tornado impuro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ... νομίσῃς
  choice: não pense
  rationale: O verbo νομίζω introduz uma avaliação; a forma negativa adverte o interlocutor a não minimizar a gravidade do ato.
- source_word: μικρὰν ... ἁμαρτίαν
  choice: um pecado pequeno
  rationale: Mantém a relação direta entre o adjetivo μικράν e o substantivo ἁμαρτίαν, preservando o contraste pretendido pelo orador.
- source_word: ταύτην
  choice: que seria
  rationale: Em português, a referência ao ato é expressa naturalmente pela oração seguinte, sem necessidade de repetir «este ato».
- source_word: εἰ
  choice: se
  rationale: Preserva de modo simples e idiomático o valor condicional e prospectivo da oração.
- source_word: μιεροφαγήσαμεν
  choice: comêssemos alimento profanado
  rationale: O verbo composto reúne a ideia de comer algo tornado impuro ou profano. «Alimento» explicita o objeto incorporado no sentido verbal, e «profanado» conserva a dimensão religiosa, não meramente física, da impureza.
theological_decisions:
- issue: Grau de explicitação da impureza em μιεροφαγήσαμεν
  choice: comêssemos alimento profanado
  alternative: comêssemos o que é impuro
  rationale: O contexto trata do consumo proibido em conflito com a santidade da Lei. «Profanado» mantém a dimensão cultual e moral do termo, enquanto a nota registra uma alternativa mais geral sem impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção condicional natural e vocabulário religioso não técnico.
