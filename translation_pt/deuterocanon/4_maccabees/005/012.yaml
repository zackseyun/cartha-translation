  text: and by bowing down to my humane persuasion[a], you will have pity on your own old age.
translation:
  language: pt
  text: E, ao se curvar diante do meu apelo benevolente[a], você terá compaixão da sua própria velhice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ao prestar homenagem ao”; no contexto mais amplo de apostasia forçada, talvez “ao adorar”.
    reason: Alternativas lexicais para προσκυνήσας, cuja extensão semântica inclui prostração, homenagem e adoração.
lexical_decisions:
- source_word: προσκυνήσας
  choice: ao se curvar diante de
  rationale: O particípio aoristo de προσκυνέω expressa aqui o ato de prostração, deferência ou submissão esperado pelo rei. A formulação preserva o gesto corporal e sua força de sujeição sem decidir que se trata explicitamente de adoração.
- source_word: μου
  choice: meu
  rationale: Genitivo possessivo ligado a παρηγορίαν; o rei apresenta o apelo como seu.
- source_word: τὴν φιλάνθρωπον παρηγορίαν
  choice: meu apelo benevolente
  rationale: παρηγορία pode indicar encorajamento, exortação ou persuasão; neste contexto coercivo, “apelo” é natural e não endossa a alegada bondade do rei. φιλάνθρωπον descreve esse apelo, segundo a apresentação do próprio falante, como benevolente ou humano.
- source_word: οἰκτειρήσεις
  choice: você terá compaixão de
  rationale: O futuro de οἰκτείρω significa ter pena ou compaixão. Com “sua própria velhice” como objeto, comunica que obedecer equivaleria a poupar a si mesmo.
- source_word: τὸ σεαυτοῦ γῆρας
  choice: sua própria velhice
  rationale: γῆρας significa “velhice”, e σεαυτοῦ acrescenta posse reflexiva enfática, preservada por “própria”.
theological_decisions:
- issue: Força de προσκυνέω no contexto da exigência real
  choice: se curvar diante de
  alternative: prestar homenagem a; adorar
  rationale: O verbo pode indicar prostração, homenagem ou adoração. O objeto imediato é o “apelo benevolente” do rei, favorecendo a ideia ampla de submissão à exigência; porém, como o contexto envolve coerção à apostasia, a possibilidade de uma conotação cultual é mantida em nota.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. “Você” torna direta a fala singular do rei. “Benevolente” conserva a autodescrição retórica do rei sem afirmar que seu apelo coercivo seja de fato misericordioso.
