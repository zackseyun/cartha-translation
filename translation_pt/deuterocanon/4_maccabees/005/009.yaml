- source_word: ποιήσειν
  choice: agir
  rationale: Neste contexto, ποιεῖν descreve a conduta do interlocutor; «agir» é natural e preserva o valor verbal.
- source_word: δοκεῖς
  choice: você me parece
  rationale: Na construção com infinitivo, δοκεῖς significa «parece», não «pensa».
