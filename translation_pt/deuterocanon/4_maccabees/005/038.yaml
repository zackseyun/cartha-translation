base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/038.yaml
  text: For you may indeed tyrannize over the ungodly[a], but over my reasonings concerning godliness you will rule neither by words nor by deeds.
translation:
  language: pt
  text: Pois você exercerá tirania sobre os ímpios; mas não dominará meus raciocínios[a] acerca da piedade, nem por palavras nem por atos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus juízos racionais”. O termo grego λογισμός é central em 4 Macabeus e indica deliberação racional e moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσεβῶν
  choice: os ímpios
  rationale: O genitivo plural indica as pessoas sobre as quais o tirano exerce poder. “Ímpios” preserva o contraste moral e religioso com εὐσέβεια.
- source_word: τυραννήσεις
  choice: exercerá tirania sobre
  rationale: Mantém o futuro do verbo e sua conotação de domínio opressivo, em vez de reduzi-lo ao sentido neutro de governar.
- source_word: τῶν δὲ ἐμῶν ... λογισμῶν
  choice: meus raciocínios
  rationale: λογισμός é termo central em 4 Macabeus para a deliberação racional e moral; “raciocínios” conserva essa ligação conceitual melhor que “pensamentos”.
- source_word: περὶ τῆς εὐσεβείας
  choice: acerca da piedade
  rationale: “Piedade” expressa aqui a devoção e fidelidade religiosa a Deus, preservando a oposição lexical a “ímpios”.
- source_word: δεσπόσεις
  choice: dominará
  rationale: Transmite a ideia de tornar-se senhor ou exercer controle sobre algo e estabelece o contraste entre a tirania externa e a incapacidade de controlar as convicções racionais do falante.
- source_word: οὔτε λόγοις ... οὔτε δι᾽ ἔργων
  choice: nem por palavras nem por atos
  rationale: Reproduz a estrutura negativa equilibrada do grego e mantém aberta a abrangência de λόγοι e ἔργα, sem restringi-los apenas a argumentos ou violência.
theological_decisions:
- issue: Preservação do contraste ético-religioso entre ἀσεβής e εὐσέβεια
  choice: ímpios / piedade
  alternative: irreverentes / devoção a Deus
  rationale: A formulação escolhida conserva a oposição lexical entre falta de reverência religiosa e fidelidade devota, sem acrescentar uma interpretação denominacional.
- issue: Natureza dos λογισμοί do falante
  choice: raciocínios acerca da piedade
  alternative: juízos racionais acerca da piedade
  rationale: “Raciocínios” preserva a ênfase do livro na deliberação racional sem decidir se o termo designa pensamentos, argumentos ou juízos já formados.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção adversativa preserva o contraste μὲν ... δέ, e o futuro verbal foi mantido sem introduzir uma modalidade ausente do grego.
