base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/016.yaml
  text: But we[a], Antiochus, being persuaded by a divine law, order our lives by it, and we consider no compulsion to be stronger than obedience to our law.
translation:
  language: pt
  text: Nós, Antíoco, convencidos por uma lei divina, vivemos segundo ela[a] e consideramos que nenhuma coação é mais forte do que a obediência à nossa lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «persuadidos pela lei divina, conduzimos nossa vida de acordo com ela».'
    reason: Alternativa lexical que preserva tanto a possível determinação de θείῳ νόμῳ quanto a nuance de πολιτευόμεθα como condução da vida.
lexical_decisions:
- source_word: θείῳ
  choice: divina
  rationale: O adjetivo caracteriza νόμος como divino sem especificar além do grego se a ênfase recai na qualidade ou na origem da lei.
- source_word: πεπεισμένοι
  choice: convencidos
  rationale: O particípio perfeito passivo expressa persuasão já efetuada e um estado resultante firme; «convencidos» comunica ambos de modo natural em português.
- source_word: νόμῳ
  choice: lei
  rationale: Neste contexto, νόμος designa a Lei judaica; «lei» é a tradução direta e transparente, e a ocorrência posterior com «nossa» explicita sua referência comunitária.
- source_word: πολιτευόμεθα
  choice: vivemos segundo ela
  rationale: O verbo pode indicar viver ou conduzir-se como membro de uma comunidade política. Aqui descreve o modo de vida regido pela lei; «vivemos segundo ela» preserva essa dimensão prática e normativa.
- source_word: οὐδεμίαν ἀνάγκην
  choice: nenhuma coação
  rationale: No contexto da pressão exercida pelo governante, ἀνάγκη denota coerção, não mera necessidade abstrata.
- source_word: βιαιοτέραν
  choice: mais forte
  rationale: O comparativo comunica a força coerciva em contraste com a obediência. «Mais forte» é natural em português e evita a formulação menos idiomática «coação mais violenta».
- source_word: τῆς πρὸς τὸν νόμον ἡμῶν εὐπειθείας
  choice: do que a obediência à nossa lei
  rationale: εὐπείθεια denota disposição para obedecer ou submissão pronta. «Obediência» preserva com clareza a seriedade da fidelidade à lei.
theological_decisions:
- issue: Caracterização da Lei judaica
  choice: uma lei divina
  alternative: a lei divina; uma lei vinda de Deus
  rationale: A expressão anarticulada θείῳ νόμῳ admite sentido indefinido ou qualitativo. «Uma lei divina» acompanha a forma grega e afirma seu caráter divino sem determinar de modo excessivo se o foco é qualidade ou origem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. A fala mantém o contraste retórico entre a coação externa e a força vinculante da obediência à lei.
