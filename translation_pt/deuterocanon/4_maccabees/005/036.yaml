  yaml_path: translation/deuterocanon/4_maccabees/005/036.yaml
  text: Nor will you defile my mouth, made venerable by old age, nor the years of a law-abiding life.
translation:
  language: pt
  text: Nem contaminarás minha boca, venerável pela velhice, nem a idade de uma vida obediente à lei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μιαίνεις
  choice: profanarás
  rationale: No contexto de coerção religiosa, o verbo exprime contaminação ou desonra moral e cultual; “profanar” transmite essa força com naturalidade.
- source_word: τὸ σεμνὸν γήρως στόμα
  choice: minha boca, tornada venerável pela velhice
  rationale: Preserva a relação entre a dignidade da boca do orador e sua velhice, evitando tratar “venerável” como qualidade sem causa expressa.
- source_word: νομίμου βίου
  choice: uma vida vivida conforme a Lei
  rationale: Comunica que a vida foi conduzida segundo a lei religiosa no contexto judaico; a maiúscula em “Lei” explicita a referência contextual à Lei judaica.
- source_word: ἡλικίαν
  choice: os anos
  rationale: Aqui o termo aponta para o período de vida ou idade acumulada; “os anos” é idiomático em português e mantém a ideia do longo curso de uma vida fiel.
theological_decisions:
- issue: Sentido religioso de νόμιμος
  choice: conforme a Lei
  alternative: obediente à lei
  rationale: O contexto é de fidelidade à Lei judaica sob perseguição. A formulação escolhida torna essa referência perceptível sem acrescentar uma identificação denominacional.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A coordenação repetida com “nem” conserva a estrutura retórica do grego; “tornada venerável pela velhice” mantém a relação causal sem produzir uma formulação excessivamente literal.
