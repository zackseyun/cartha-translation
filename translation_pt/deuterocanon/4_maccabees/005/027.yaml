base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/027.yaml
  text: But tyrannically you are not only compelling us to break the law[a], but also to eat, so that you may further mock us with this most hateful defilement by food.
translation:
  language: pt
  text: Mas você, de modo tirânico, não só nos força a transgredir a lei, mas também a comer, para zombar ainda mais de nós com esta abominável alimentação impura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «com este abominável comer impuro» ou «com esta abominável contaminação alimentar». O termo grego é raro e combina as ideias de comer e de contaminação ou impureza ritual e moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: τυραννικὸν
  choice: agindo como tirano
  rationale: O adjetivo caracteriza adverbialmente a ação do governante como despótica; a formulação é natural em português e preserva a acusação direta.
- source_word: ἀναγκάζεις
  choice: você ... nos força
  rationale: Expressa claramente a coerção indicada pelo presente verbal grego.
- source_word: παρανομεῖν
  choice: transgredir a Lei
  rationale: O verbo significa agir contra a lei. Neste contexto, refere-se à Lei judaica; a inicial maiúscula torna essa referência inteligível sem acrescentar 'de Deus' ou 'ancestral' ao texto.
- source_word: ἐσθίειν
  choice: comer
  rationale: Tradução direta e natural do infinitivo simples.
- source_word: ὅπως
  choice: para
  rationale: Introduz a finalidade pretendida pelo tirano, de modo conciso e idiomático em português.
- source_word: ἐχθίστῃ
  choice: abominável
  rationale: Comunica a extrema repulsa do superlativo grego com naturalidade; neste contexto, 'abominável' tem força equivalente a 'sumamente detestável'.
- source_word: μιεροφαγίᾳ
  choice: profanação pelo alimento
  rationale: O raro composto reúne as ideias de comer e de contaminação ou profanação ritual/moral. A expressão conserva ambas sem reduzir o sentido apenas ao alimento proibido.
- source_word: ἔτι
  choice: ainda
  rationale: Preserva a ideia de indignidade adicional ou continuada associada à zombaria.
- source_word: ἐγγελάσῃς
  choice: zombar de nós
  rationale: Transmite diretamente o sentido de rir de alguém, escarnecer ou ridicularizar.
theological_decisions:
- issue: Sentido de 'lei' em παρανομεῖν no contexto do martírio macabeu
  choice: transgredir a Lei
  alternative: transgredir a lei de Deus; violar a lei ancestral
  rationale: O contexto aponta para a Torá, mas o grego não acrescenta 'de Deus' nem 'ancestral'. A tradução identifica a referência contextual sem inserir um qualificativo ausente.
- issue: Natureza da contaminação em μιεροφαγίᾳ
  choice: profanação pelo alimento
  alternative: comer impuro; alimentação contaminadora
  rationale: A escolha preserva conjuntamente as dimensões alimentar e ritual/moral do composto raro, sem determinar além do que o termo permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A fala mantém o tom acusatório direto. 'Agindo como tirano' evita o advérbio pouco natural 'tiranicamente'; 'profanação pelo alimento' conserva a tensão lexical do raro composto grego.
