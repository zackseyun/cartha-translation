  yaml_path: translation/deuterocanon/4_maccabees/005/004.yaml
  text: But when many had been seized, one man, first from the flock, a Hebrew named Eleazar, a priest by birth, trained in the law in knowledge, advanced in age, and known to many around the tyrant because of his age, opened his mouth.
translation:
  language: pt
  text: Mas, depois que muitos foram capturados, um homem, o primeiro dentre o grupo[a], um hebreu chamado Eleazar, de linhagem sacerdotal, versado na Lei[b], de idade avançada e conhecido de muitos dos que estavam ao redor do tirano por causa de sua idade, abriu a boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o primeiro do rebanho”. O grego diz literalmente “do rebanho”, empregando uma metáfora para o grupo de hebreus.
    reason: lexical_alternative
  - marker: b
    text: Ou “conhecedor da Lei”. O grego descreve Eleazar como instruído no que diz respeito à Lei, não como um profissional do direito no sentido moderno.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναρπασθέντων
  choice: tendo muitos sido capturados
  rationale: O particípio indica apreensão forçada. “Capturados” conserva a coerção sem especificar indevidamente o modo.
- source_word: ἀγέλης
  choice: rebanho
  rationale: O termo significa literalmente “rebanho” ou “manada” e aqui funciona metaforicamente para o grupo dos hebreus; a tradução preserva essa imagem.
- source_word: Ἑβραῖος
  choice: um hebreu
  rationale: Reproduz diretamente a designação étnica usada no grego, sem substituí-la pelo mais interpretativo “judeu”.
- source_word: τὸ γένος ἱερεύς
  choice: sacerdote de nascimento
  rationale: Expressa a origem familiar ou linhagem sacerdotal de Eleazar de modo conciso e natural.
- source_word: τὴν ἐπιστήμην νομικός
  choice: conhecedor da Lei
  rationale: A construção qualifica Eleazar por seu saber relativo à Lei. “Conhecedor da Lei” evita a conotação moderna de profissão jurídica e mantém linguagem clara.
- source_word: τὴν ἡλικίαν προήκων
  choice: de idade avançada
  rationale: Tradução idiomática e dignificada da indicação de que Eleazar estava avançado em anos.
- source_word: πολλοῖς τῶν περὶ τὸν τύραννον
  choice: muitos dos que cercavam o tirano
  rationale: Designa pessoas do séquito ou círculo do tirano, mantendo de perto a imagem espacial da expressão grega.
- source_word: γνώριμος
  choice: conhecido
  rationale: Representa diretamente o sentido de alguém familiar ou conhecido por outros.
- source_word: ἠνῴχετο τὸ στόμιον αὐτοῦ
  choice: abriu a boca
  rationale: Preserva o idioma solene do original para indicar que ele começou a falar.
