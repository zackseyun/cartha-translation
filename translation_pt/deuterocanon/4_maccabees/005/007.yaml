lexical_decisions:
- source_word: διὰ τί γὰρ
  choice: Pois por que
  rationale: Preserva tanto a pergunta direta de διὰ τί quanto a força argumentativa e explicativa de γάρ.
- source_word: τῆς φύσεως
  choice: a natureza
  rationale: Mantém o sentido amplo de φύσις, sem especificá-lo indevidamente como constituição física ou ordem natural.
- source_word: κεχαρισμένης
  choice: tenha tornado
  rationale: O particípio perfeito descreve uma concessão ou favorecimento com resultado presente; nesta construção, “tenha tornado” expressa naturalmente o estado resultante, sem introduzir conotação teológica de graça.
- source_word: καλλίστην
  choice: excelente em grau máximo
  rationale: Reproduz o superlativo de καλός e seu sentido de qualidade superior no contexto alimentar, evitando transformar o juízo retórico em uma afirmação mais específica como “o melhor alimento”.
- source_word: τὴν τοῦδε τοῦ ζῴου σαρκοφαγίαν
  choice: o consumo da carne deste animal
  rationale: Traduz σαρκοφαγία de modo idiomático e digno, mantendo a referência concreta à carne e nominalizando o ato de comê-la.
- source_word: βδελύττεις
  choice: abomina
  rationale: Comunica a forte repulsa expressa pelo verbo grego e se ajusta ao registro elevado do discurso.
