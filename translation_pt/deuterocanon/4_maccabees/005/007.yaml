  yaml_path: translation/deuterocanon/4_maccabees/005/007.yaml
  text: For why do you loathe the eating of the flesh of this animal[a], though nature has graciously made it most excellent?
translation:
  language: pt
  text: Pois, por que você abomina o consumo da carne deste animal[a], embora a natureza o tenha favorecido como sendo da mais alta qualidade?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
