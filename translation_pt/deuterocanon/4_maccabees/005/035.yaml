revisions:
- from: Nem envergonharei você, ó razão filosófica[a], nem renunciarei a você, honrado sacerdócio e conhecimento da Lei.[b]
  to: Não te desonrarei, ó razão filosófica[a], nem renunciarei a ti, ó honrado sacerdócio e conhecimento da Lei[b].
  rationale: A revisão substitui o coloquial «você» pelas formas retóricas «te/ti», mais adequadas à interpelação personificada e ao registro do original. «Desonrarei» explicita com mais precisão a dimensão pública de honra e vergonha em καταισχύνω. Mantêm-se a ambiguidade sintática dos vocativos finais, os termos teológicos e as alternativas das notas; apenas se ajusta a posição do marcador b.
