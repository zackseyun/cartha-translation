  yaml_path: translation/deuterocanon/4_maccabees/005/035.yaml
  text: Nor will I disgrace you[a], O philosophical reason, nor will I renounce you[b], honored priesthood and knowledge of the law.
translation:
  language: pt
  text: Não te desonrarei, ó razão filosófica[a], nem renunciarei a ti, ó honrado sacerdócio e conhecimento da Lei[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “razão filosoficamente orientada”. O vocativo grego φιλόσοφε λόγε é compacto e estilizado.
    reason: lexical_alternative
  - marker: b
    text: Ou “estimado ofício sacerdotal e domínio da legislação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταισχυνῶ
  choice: envergonharei
  rationale: O futuro de καταισχύνω expressa a recusa de causar vergonha ou desonra ao ideal personificado; “envergonhar” preserva de modo natural a dimensão de honra e vergonha.
- source_word: φιλόσοφε λόγε
  choice: ó razão filosófica
  rationale: O vocativo λόγε, qualificado por φιλόσοφε, dirige-se de forma personificada à razão de caráter filosófico. A formulação é compacta e mantém ambos os componentes do grego.
- source_word: ἑξαρνήσομαί
  choice: renunciarei
  rationale: O futuro médio de ἐξαρνέομαι indica repúdio ou abandono de lealdade; “renunciar” comunica essa força melhor que uma simples negação.
- source_word: ἱεροσύνη τιμία
  choice: honrado sacerdócio
  rationale: ἱεροσύνη designa o sacerdócio ou ofício sacerdotal, e τιμία lhe atribui honra e elevado valor. O masculino “honrado” concorda em português com “sacerdócio”.
- source_word: νομοθεσίας ἐπιστήμη
  choice: conhecimento da Lei
  rationale: ἐπιστήμη denota conhecimento ou domínio, enquanto νομοθεσία pode referir-se à legislação ou à Lei dada. “Conhecimento da Lei” é claro no contexto judaico sem restringir indevidamente a expressão.
theological_decisions:
- issue: Personificação e relação entre os três compromissos invocados
  choice: Preservar a interpelação direta à razão filosófica, ao sacerdócio e ao conhecimento da Lei como realidades personificadas que o orador se recusa a desonrar ou abandonar.
  alternative: Ler os substantivos apenas como uma enumeração não personificada de filosofia e tradição judaica, ou tratar “sacerdócio” e “conhecimento da Lei” estritamente como apostos de “razão filosófica”.
  rationale: A segunda pessoa e os vocativos sustentam a personificação retórica. A tradução conserva a possível tensão sintática entre vocativos coordenados e apostos, sem impor uma identificação doutrinária entre eles.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Você” torna explícita a segunda pessoa singular sem arcaísmo; “Lei” recebe inicial maiúscula por designar, neste contexto judaico, a Lei recebida. Os marcadores foram posicionados junto às expressões a que suas alternativas se referem.
