  text: I will not pity my own old age so much that I would, by my own act, abolish the ancestral law.
translation:
  language: pt
  text: Não terei tanta compaixão da minha própria velhice a ponto de, por meu próprio ato, abolir a lei dos antepassados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχ οὕτως
  choice: não ... tanta
  rationale: 'Em correlação com ὥστε, exprime grau e resultado: “não a tal ponto que”. A formulação portuguesa mantém essa relação de modo natural.'
- source_word: οἰκτειρήσω
  choice: terei ... compaixão
  rationale: O verbo denota sentir piedade ou compaixão. “Ter compaixão” preserva o sentido afetivo sem antecipar a consequência prática de poupar a própria vida.
- source_word: τὸ ἐμαυτοῦ γῆρας
  choice: minha própria velhice
  rationale: γῆρας significa “velhice”, e ἐμαυτοῦ reforça a referência ao próprio falante; “minha própria velhice” conserva essa ênfase.
- source_word: ὥστε
  choice: a ponto de
  rationale: Introduz o resultado que decorreria de uma compaixão excessiva por si mesmo. “A ponto de” expressa com clareza a relação de grau e resultado.
- source_word: με διʼ ἐμαυτοῦ
  choice: por meu próprio ato
  rationale: 'A expressão salienta a agência pessoal: ele mesmo seria responsável pela ação. A escolha evita o possível sentido de isolamento de “por mim mesmo”.'
- source_word: τὸν πάτριον νόμον
  choice: a lei dos antepassados
  rationale: πάτριος qualifica aquilo que foi recebido dos pais ou antepassados. A expressão é clara em português moderno e mantém a dimensão histórica e comunitária da lei.
- source_word: καταλῦσαι
  choice: abolir
  rationale: O verbo pode significar desfazer, derrubar ou anular. Aqui descreve o efeito de pôr de lado a autoridade da lei mediante a própria conduta; “abolir” preserva a força retórica do original.
theological_decisions:
- issue: Sentido de πάτριον νόμον no contexto do martírio judaico
  choice: a lei dos antepassados
  alternative: a lei de meus pais
  rationale: A expressão aponta para a lei recebida pela comunidade judaica de seus antepassados. A tradução preserva a herança comunitária sem acrescentar terminologia confessional posterior.
- issue: Força de καταλῦσαι aplicada à lei
  choice: abolir
  alternative: violar
  rationale: “Violar” explicitaria a ação concreta, mas reduziria a força de καταλῦσαι, que apresenta essa concessão pessoal como um desfazer ou anular da lei. “Abolir” conserva a formulação enfática e a tensão retórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura “não... tanta... a ponto de” reproduz naturalmente a correlação grega de grau e resultado. Não são necessárias notas de rodapé.
