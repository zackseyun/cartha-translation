  yaml_path: translation/deuterocanon/4_maccabees/005/008.yaml
  text: For it is foolish not to enjoy the pleasant things that are without reproach[a], and unjust to turn away from the gifts of nature.
translation:
  language: pt
  text: Pois é insensato não desfrutar das coisas agradáveis sem reprovação[a], e injusto afastar-se das dádivas da natureza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “prazeres irrepreensíveis”.'
    reason: Alternativa lexical que entende ἡδέων de modo substantivado e condensa χωρὶς ὀνείδους.
lexical_decisions:
- source_word: ἀνόητον
  choice: insensato
  rationale: Expressa falta de bom senso ou entendimento e preserva a força intelectual e moral do adjetivo grego em português natural.
- source_word: ἀπολαύειν
  choice: desfrutar
  rationale: No contexto, o infinitivo indica usufruir com prazer; “desfrutar” comunica isso de modo claro e corrente.
- source_word: τῶν χωρὶς ὀνείδους ἡδέων
  choice: das coisas agradáveis que não trazem desonra
  rationale: Mantém explícitos tanto o caráter prazeroso de ἡδέων quanto a qualificação moral χωρὶς ὀνείδους, sem transformar a frase numa aprovação irrestrita do prazer.
- source_word: ἄδικον
  choice: injusto
  rationale: Preserva a avaliação ética forte do termo grego, em vez de reduzi-la a algo meramente impróprio.
- source_word: ἀποστρέφεσθαι
  choice: afastar-se de
  rationale: Reproduz naturalmente a imagem do infinitivo médio, segundo a qual a pessoa se volta para longe de algo.
- source_word: τὰς τῆς φύσεως χάριτας
  choice: as dádivas da natureza
  rationale: χάριτες designa aqui benefícios ou coisas graciosamente concedidas; “dádivas da natureza” é idiomático e evita impor ao termo uma conotação teológica posterior.
theological_decisions:
- issue: Caracterização moral dos prazeres naturais
  choice: O versículo afirma que certas coisas agradáveis são moralmente admissíveis, pois não trazem desonra, e que não devem ser recusadas.
  alternative: A expressão pode ser condensada como “os prazeres irrepreensíveis”.
  rationale: O grego qualifica expressamente as coisas agradáveis com χωρὶς ὀνείδους. A tradução conserva tanto o prazer quanto seu limite moral, sem apresentar uma aprovação geral e irrestrita do prazer.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo entre “insensato” e “injusto” e evita linguagem arcaica ou excessivamente técnica.
