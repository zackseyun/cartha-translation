  text: You will not even gouge out my eyes and melt my inward parts[a].
translation:
  language: pt
  text: Nem sequer arrancarás os meus olhos e derreterás as minhas entranhas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «os meus órgãos internos». O termo grego se refere às vísceras.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδʼ ἂν
  choice: Nem sequer
  rationale: Expressa de modo natural a negação enfática do grego sem enfraquecer sua força retórica.
- source_word: ἐκκόψεις
  choice: arrancarás
  rationale: O verbo significa cortar ou retirar. Com «olhos» como objeto, «arrancar» transmite com clareza e vividez a violência da ação.
- source_word: τὰ ὄμματα
  choice: os meus olhos
  rationale: O substantivo plural designa literalmente os olhos; o possessivo é exigido pelo contexto e pelo pronome grego subsequente.
- source_word: τὰ σπλάγχνα
  choice: as minhas entranhas
  rationale: O termo se refere às vísceras ou aos órgãos internos. «Entranhas» preserva o sentido corporal concreto e a intensidade da imagem.
- source_word: τήξεις
  choice: derreterás
  rationale: Mantém o sentido concreto de fazer derreter ou dissolver, sem substituir a imagem incomum do original por uma interpretação.
