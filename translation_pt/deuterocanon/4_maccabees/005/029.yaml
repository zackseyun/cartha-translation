lexical_decisions:
- source_word: οὔτε
  choice: nem
  rationale: Dá continuidade natural, em português, à série negativa do contexto anterior.
- source_word: ἱεροὺς
  choice: sagrados
  rationale: Preserva o peso religioso e solene dos juramentos sem recorrer a linguagem arcaica.
- source_word: τῶν προγόνων
  choice: dos antepassados
  rationale: Expressa com naturalidade a ascendência masculina indicada pelo plural grego e evita acrescentar o possessivo «nossos», ausente do texto.
- source_word: περὶ τοῦ φυλάξαι τὸν νόμον
  choice: de guardar a lei
  rationale: Apresenta o conteúdo dos juramentos; «guardar» conserva o sentido de observar fielmente a lei.
- source_word: τὸν νόμον
  choice: a lei
  rationale: Mantém a formulação simples do grego; no contexto, trata-se da lei judaica ancestral.
- source_word: ὅρκους
  choice: juramentos
  rationale: Traduz a obrigação solenemente jurada, mais especificamente do que «votos».
- source_word: οὐ παρήσω
  choice: não desconsiderarei
  rationale: Comunica a recusa de ignorar ou deixar sem efeito os juramentos, sem sugerir necessariamente abandono total.
theological_decisions:
- issue: Linguagem ancestral em τῶν προγόνων
  choice: dos antepassados
  alternative: dos pais
  rationale: «Antepassados» é corrente, conserva a referência ancestral masculina do grego e não introduz o possessivo «nossos».
- issue: Referência de τὸν νόμον
  choice: a lei
  alternative: a Lei; a lei ancestral
  rationale: A expressão se refere à lei judaica, mas a tradução evita inserir uma explicação não explicitada pelo grego ou resolver a questão por capitalização.
