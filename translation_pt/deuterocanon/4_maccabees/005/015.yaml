  text: 'And having taken the right to speak, he began to address the assembly as follows:'
translation:
  language: pt
  text: 'E, tendo recebido permissão para falar, começou a dirigir-se à assembleia desta maneira:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: tendo recebido
  rationale: O particípio aoristo apresenta a circunstância anterior ao verbo principal. Neste contexto, com ἐξουσίαν, «tendo recebido» exprime de modo natural a concessão da oportunidade ou permissão para falar.
- source_word: τοῦ λέγειν
  choice: para falar
  rationale: O infinitivo articular define o âmbito de ἐξουσίαν; em português, «permissão para falar» é a construção corrente e clara.
- source_word: ἐξουσίαν
  choice: permissão
  rationale: Embora o termo possa significar autoridade, direito ou liberdade, aqui designa a autorização concedida para tomar a palavra, sem sugerir poder institucional.
- source_word: ἤρξατο
  choice: começou
  rationale: Reproduz diretamente o sentido incoativo de ἄρχομαι e mantém um registro digno e natural.
- source_word: δημηγορεῖν
  choice: a dirigir-se à assembleia
  rationale: O verbo indica falar publicamente diante de uma reunião. A expressão conserva a dimensão pública e cívica sem a conotação negativa de «discursar inflamadamente».
- source_word: οὕτως
  choice: desta maneira
  rationale: Introduz o conteúdo do discurso que vem a seguir; a expressão é natural em português e preserva o sentido de «assim».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluente. «Assembleia» preserva o caráter público do discurso; «permissão para falar» evita a formulação pouco idiomática «tomado o direito de falar».
