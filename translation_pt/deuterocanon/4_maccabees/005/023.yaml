lexical_decisions:
- source_word: σωφροσύνην
  choice: domínio próprio
  rationale: Neste contexto ético, designa o governo disciplinado de si mesmo; a expressão é clara, atual e se ajusta à oração seguinte sobre dominar prazeres e desejos.
- source_word: ἐκδιδάσκει
  choice: ensina
  rationale: Embora o composto possa sugerir instrução completa, “ensina” comunica naturalmente o sentido sem ampliar indevidamente a nuance.
- source_word: κρατεῖν
  choice: dominar
  rationale: Preserva a ideia ativa de exercer poder ou senhorio sobre prazeres e desejos.
- source_word: ἡδονῶν
  choice: prazeres
  rationale: Mantém o sentido amplo do termo, sem restringi-lo a prazeres sensuais.
- source_word: ἐπιθυμιῶν
  choice: desejos
  rationale: Conserva a abrangência do grego e evita a conotação especificamente sexual que “concupiscências” pode assumir hoje.
- source_word: ἀνδρείαν
  choice: coragem
  rationale: É o termo ético moderno mais natural para essa virtude, sem reproduzir a carga masculina da etimologia.
- source_word: ἐξασκεῖν
  choice: exercitar
  rationale: Expressa o cultivo ativo e habitual de uma virtude.
- source_word: πόνον
  choice: sofrimento
  rationale: No contexto de martírio, abrange dor, aflição e provação; “sofrimento” é mais natural em português com “suportar todo”.
- source_word: ἑκουσίως
  choice: voluntariamente
  rationale: Preserva explicitamente a ideia de aceitação por livre vontade.
- source_word: ὑπομένειν
  choice: suportar
  rationale: Comunica de modo corrente a perseverança sob o sofrimento.
theological_decisions:
- issue: Tradução dos termos gregos de virtude em contexto filosófico e martirial deuterocanônico
  choice: 'Empregar termos éticos atuais: “domínio próprio” e “coragem”.'
  alternative: “temperança” para σωφροσύνην e “fortaleza” ou “virilidade” para ἀνδρείαν.
  rationale: As escolhas mantêm o caráter ético do texto, com linguagem clara e sem arcaísmo ou marca de gênero desnecessária.
- issue: Valor de ὥστε com infinitivo
  choice: Traduzir por “para que” com subjuntivo.
  alternative: Usar construção consecutiva, como “de modo a”.
  rationale: No contexto, as orações apresentam o resultado ou objetivo prático do ensino. “Para que” preserva essa relação sem eliminar a possível sobreposição entre finalidade e resultado.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Mantém-se o paralelismo das duas construções com ὥστε e o ponto e vírgula final do trecho fornecido.
