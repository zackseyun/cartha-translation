lexical_decisions:
- source_word: Προκαθίσας
  choice: depois que ... tomou assento
  rationale: Expressa de modo natural o particípio circunstancial e apresenta Antíoco sentado em posição de autoridade antes da ação seguinte.
- source_word: γέ τοι
  choice: Então
  rationale: Reproduz a força discursiva e transitiva da combinação de partículas sem lhe atribuir conteúdo concreto excessivo.
- source_word: μετὰ τῶν συνέδρων
  choice: com seu conselho
  rationale: Designa de forma concisa o grupo oficial que se assentava em conselho com Antíoco.
- source_word: ὁ τύραννος
  choice: o tirano
  rationale: Mantém a caracterização explicitamente negativa do autor, sem suavizá-la para um título político neutro.
- source_word: ἐπὶ τινος ὑψηλοῦ τόπου
  choice: em certo lugar elevado
  rationale: Preserva tanto a indefinição de τινος quanto a elevação física indicada pela expressão, evitando sugerir necessariamente um local de culto.
- source_word: τῶν στρατευμάτων αὐτῶν
  choice: suas tropas
  rationale: Mantém o sentido coletivo militar e traduz o pronome de modo natural, sem especificar além do que o grego permite.
- source_word: παρεστηκότων
  choice: se posicionaram
  rationale: Comunica que as tropas estavam postadas junto ao governante e ao conselho; em português, é mais natural no cenário militar do que uma reprodução rígida de 'estavam de pé'.
- source_word: κυκλόθεν
  choice: ao redor
  rationale: Expressa claramente o cerco ou posicionamento circundante indicado pelo advérbio.
- source_word: εὐόπλων
  choice: plenamente armadas
  rationale: Preserva a ideia de tropas equipadas para combate e a atmosfera ameaçadora da cena.
theological_decisions:
- issue: Avaliação autoral de Antíoco em τύραννος
  choice: Manter “o tirano” no texto principal
  alternative: “o governante” ou “o rei”
  rationale: O grego emprega uma designação moralmente carregada, não um título régio neutro. Preservá-la mantém a retórica do autor sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A oração permanece aberta com vírgula porque o versículo grego é sintaticamente continuado pelo contexto seguinte.
