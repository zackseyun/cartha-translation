  yaml_path: translation/deuterocanon/4_maccabees/005/001.yaml
  text: So then[a], when the tyrant Antiochus had taken his seat with his council on a certain high place, and their fully armed troops were standing around on every side,
translation:
  language: pt
  text: Então, depois que o tirano Antíoco tomou assento com seu conselho em certo lugar elevado[a], e as tropas deles, plenamente armadas, estavam postadas ao redor,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em algum lugar alto”. A expressão grega indica um local elevado, não necessariamente um “lugar alto” de culto.'
