  yaml_path: translation/deuterocanon/4_maccabees/005/022.yaml
  text: But you mock our philosophy[a], as though we did not live in it with blessedness.
translation:
  language: pt
  text: Mas você ridiculariza a nossa filosofia, como se não vivêssemos nela com sensatez.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “com bom senso” ou “de maneira razoável”. O substantivo grego é raro e indica bom raciocínio ou sensatez.
    reason: lexical_alternative
lexical_decisions:
- source_word: χλευάζεις
  choice: ridiculariza
  rationale: O verbo expressa zombaria e desprezo; “ridiculariza” mantém a força da acusação direta em português natural.
- source_word: φιλοσοφίαν
  choice: filosofia
  rationale: Conserva a categoria empregada pelo próprio autor para apresentar o modo de vida judaico orientado pela razão e pela piedade, sem substituí-la por uma paráfrase religiosa.
- source_word: ὥσπερ
  choice: como se
  rationale: Introduz de modo idiomático a suposição que o interlocutor atribui falsamente aos judeus.
- source_word: εὐλογιστίας
  choice: com sensatez
  rationale: O substantivo raro deriva do campo de raciocinar ou calcular bem e, neste contexto, indica bom juízo ou razoabilidade, não “bênção” no sentido de εὐλογία.
- source_word: ἐν αὐτῇ βιούντων
  choice: vivêssemos nela
  rationale: Reproduz diretamente a imagem grega de viver “nela”, retomando “filosofia”, sem explicitar além do texto se isso significa viver segundo seus princípios.
theological_decisions:
- issue: Sentido de φιλοσοφία em 4 Macabeus
  choice: Manter “filosofia” no texto principal.
  alternative: modo de vida; ensino
  rationale: O livro apresenta deliberadamente a piedade judaica como filosofia; preservar o termo mantém a moldura retórica do autor e evita impor uma designação confessional mais estreita.
- issue: Sentido de εὐλογιστία
  choice: Entender como sensatez ou bom raciocínio.
  alternative: bem-aventurança; felicidade; boa reputação
  rationale: A formação lexical e o contexto favorecem a ideia de raciocínio correto ou conduta razoável. Traduzir por “bem-aventurança” confundiria o termo com vocabulário de bênção e introduziria uma ressonância teológica que o grego não exige.
translation_notes:
  register: Português atual, digno e acessível, com legibilidade brasileira. “Você” torna explícita a segunda pessoa singular do verbo grego sem recorrer ao registro arcaizante de “tu”; “vivêssemos nela” preserva a formulação metafórica do original.
