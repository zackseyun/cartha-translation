    reason: cultural_note
lexical_decisions:
- source_word: ψεύσομαί σε
  choice: Não serei falso contigo
  rationale: O futuro médio de ψεύδομαι, com objeto pessoal, pode expressar não apenas dizer uma mentira, mas mostrar-se falso ou desleal para com alguém. A formulação conserva essa amplitude melhor do que simplesmente «não mentirei para ti».
- source_word: παιδευτὰ νόμε
  choice: ó lei educadora
  rationale: Os dois vocativos apresentam a Lei como agente de formação e disciplina. «Lei educadora» é natural em português, mantém νόμος explícito e preserva a personificação sem transformar a expressão em uma abstração.
- source_word: φείσομαί σε
  choice: te pouparei
  rationale: φείδομαι significa poupar, preservar ou refrear-se em relação a alguém ou algo. A tradução direta mantém a expressão retoricamente tensa do grego, sem explicar de modo indevido em que sentido o autodomínio não seria poupado.
- source_word: φίλη
  choice: amado
  rationale: O adjetivo vocativo comunica afeição e reforça a personificação. «Amado» preserva o tom elevado e concorda com «autodomínio».
- source_word: ἐγκράτεια
  choice: autodomínio
  rationale: Designa o governo dos desejos e impulsos. «Autodomínio» é claro, digno e um pouco mais forte do que «autocontrole», ajustando-se ao contexto de resistência sob tortura.
theological_decisions:
- issue: Personificação da Lei e do autodomínio
  choice: 'Manter a apóstrofe direta: «ó lei educadora» e «amado autodomínio».'
  alternative: Converter os vocativos em afirmações abstratas sobre obedecer à Lei e exercer autocontrole.
  rationale: O grego dirige-se diretamente a essas realidades personificadas. Preservar a figura mantém a forma literária e a tensão ética do texto sem acrescentar uma interpretação doutrinária.
- issue: Sentido da promessa feita à Lei
  choice: Traduzir ψεύσομαί σε por «não serei falso contigo».
  alternative: «não te negarei», «não te trairei» ou «não mentirei para ti».
  rationale: A opção escolhida mantém aberta a possibilidade de falsidade, deslealdade ou traição, em vez de fixar apenas uma dessas nuances.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A segunda pessoa foi mantida apenas nas formas oblíquas naturais («contigo», «te»), evitando excesso de solenidade arcaizante. A ordem e o paralelismo das duas declarações negativas acompanham de perto o grego.
