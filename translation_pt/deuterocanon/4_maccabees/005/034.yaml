translation:
  language: pt
  text: Não te serei desleal[a], ó Lei educadora[b], nem te pouparei, querido autodomínio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não te trairei», «não te negarei» ou «não mentirei para ti». O verbo grego pode indicar tanto mentir a alguém como mostrar-se falso ou desleal para com essa pessoa.'
    reason: lexical_alternative
  - marker: b
