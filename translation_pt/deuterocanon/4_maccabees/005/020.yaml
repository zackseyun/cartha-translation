  text: For to break the law in small matters and in great matters is equivalent[a].
translation:
  language: pt
  text: Pois transgredir a lei em questões pequenas e em questões grandes é equivalente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «transgredir a lei em coisas pequenas e em coisas grandes é o mesmo».'
    reason: Alternativa lexical para ἰσοδύναμον e para os plurais substantivados do grego.
lexical_decisions:
- source_word: παρανομεῖν
  choice: transgredir a lei
  rationale: O verbo indica agir contra a lei. «Transgredir a lei» conserva de modo claro e digno a força jurídica do grego.
- source_word: ἐν μικροῖς καὶ ἐν μεγάλοις
  choice: em questões pequenas e em questões grandes
  rationale: Os plurais neutros substantivados contrastam assuntos de menor e maior importância; «questões» torna a construção natural em português sem eliminar a antítese.
- source_word: ἰσοδύναμόν
  choice: tem o mesmo peso
  rationale: O adjetivo significa igual em força ou valor. A expressão comunica a equivalência afirmada sem sugerir necessariamente consequências ou penas idênticas em todos os aspectos.
- source_word: γὰρ
  choice: Pois
  rationale: Preserva a função explicativa que liga esta afirmação ao argumento anterior.
theological_decisions:
- issue: Equivalência moral entre violações menores e maiores
  choice: A transgressão da lei em questões pequenas e grandes tem o mesmo peso.
  alternative: Transgredir em coisas pequenas e grandes é equivalente.
  rationale: A formulação mantém a forte afirmação de ἰσοδύναμόν, mas não determina que toda transgressão tenha gravidade, pena ou consequências idênticas sob todos os aspectos.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de «questões» preserva o paralelismo equilibrado do grego.
