base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/018.yaml
  text: And yet[a], even if our law were not truly divine, as you suppose, though we think it to be divine, even so you would have no right to nullify our honor in matters of piety.
translation:
  language: pt
  text: E, no entanto, mesmo que a nossa lei não fosse verdadeiramente divina, como você supõe, embora nós a consideremos divina, nem assim você teria o direito de invalidar nossa honra em razão de nossa piedade[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a nossa reputação de piedade”. A expressão grega pode indicar uma posição honrosa ou boa reputação fundada na reverência a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: καίτοι
  choice: E, no entanto
  rationale: Introduz com naturalidade a forte ressalva concessiva do argumento.
- source_word: κατὰ ἀλήθειαν
  choice: verdadeiramente
  rationale: Expressa o sentido adverbial de “na realidade”, sem reproduzir literalmente o idioma grego.
- source_word: ὁ νόμος ἡμῶν
  choice: a nossa lei
  rationale: Designa especificamente a lei judaica, mas sem acrescentar ao grego uma convenção teológica de maiúscula.
- source_word: θεῖος
  choice: divina
  rationale: Preserva diretamente a afirmação sobre a natureza ou condição da lei, sem expandi-la para “dada por Deus”.
- source_word: ὡς σὺ ὑπολαμβάνεις
  choice: como você supõe
  rationale: Mantém o juízo atribuído ao interlocutor e o tom levemente contestador da fala.
- source_word: ἄλλως δὲ νομίζομεν αὐτὸν εἶναι θεῖον
  choice: embora nós a consideremos divina
  rationale: Conserva o contraste parentético e concessivo entre a suposição do interlocutor e a convicção dos judeus.
- source_word: οὐδὲ οὕτως ἔχων ἡμῖν ἦν ... ἀκυρῶσαι
  choice: nem assim você teria o direito de invalidar
  rationale: Comunica em português claro a falta de legitimidade ou permissão para tornar sem efeito aquilo que é mencionado.
- source_word: τὴν ἐπὶ τῇ εὐσεβείᾳ δόξαν
  choice: a honra que temos por nossa piedade
  rationale: Retém tanto a dimensão de honra ou reconhecimento social de δόξα quanto o sentido religioso de εὐσέβεια; a possível nuance de reputação é registrada em nota.
theological_decisions:
- issue: Condição divina da lei (θεῖος)
  choice: divina
  alternative: dada por Deus
  rationale: “Divina” corresponde ao nível exato da afirmação grega e não transforma a concessão retórica em formulação doutrinária mais desenvolvida.
- issue: Sentido de εὐσέβεια
  choice: piedade
  alternative: devoção a Deus
  rationale: “Piedade” preserva o termo moral-religioso central da obra, que reúne reverência a Deus e conduta fiel, sem limitar seu alcance a um único aspecto.
- issue: Valor de δόξα na expressão final
  choice: honra
  alternative: reputação
  rationale: “Honra” mantém a ideia de posição honrosa, enquanto a nota reconhece que o grego também pode enfatizar a reputação pública decorrente da piedade.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com sintaxe retórica preservada por meio de uma oração parentética. “Você” oferece legibilidade brasileira sem recorrer a linguagem coloquial; “lei” permanece em minúscula por não haver marca equivalente no grego.
