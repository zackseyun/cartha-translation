  terminology: “Lei”, “divina” e “piedade” são escolhas adequadas e consistentes com o grego e com o registro da obra. “Honra” é defensável para δόξα, desde que sua relação com a piedade seja expressa com clareza; a nota preserva apropriadamente a alternativa “reputação”.
