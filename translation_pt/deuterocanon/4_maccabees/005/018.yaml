  source_fidelity: 'A estrutura concessiva e os termos principais são bem representados: καίτοι por “E, no entanto”; θεῖος por “divina”; e εὐσέβεια por “piedade”. Contudo, “a honra que temos por nossa piedade” deixa ambígua a relação expressa por ἐπί + dativo e pode sugerir honra dirigida à piedade, em vez de honra ou reputação decorrente dela.'
