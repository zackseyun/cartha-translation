base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/025.yaml
  text: Therefore we do not eat defiling food[a]; for because we believe that the law has been established by God, we know that the Creator of the world, in giving the law[b], also sympathizes with our nature.
translation:
  language: pt
  text: Por isso, não comemos alimento impuro[a]; porque cremos que a Lei foi estabelecida por Deus, sabemos que o Criador do mundo, ao dar a Lei[b], também mostra consideração por nós segundo a natureza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “não comemos o que está contaminado” ou “o que é impuro”.'
    reason: lexical_alternative
  - marker: b
    text: 'O grego também pode ser entendido assim: “o Criador do mundo, ao legislar, mostra consideração por nossa natureza”.'
    reason: alternative_reading
lexical_decisions:
- source_word: μιεροφαγοῦμεν
  choice: comemos o que é impuro
  rationale: O verbo composto denota comer algo contaminado ou impuro. A formulação conserva o objeto implícito sem restringir indevidamente o sentido a uma categoria ritual específica.
- source_word: πιστεύοντες
  choice: por crermos
  rationale: O particípio tem valor causal no contexto, explicando a recusa de comer; a construção é natural e preserva a dimensão de fé ou convicção.
- source_word: καθέστασθαι
  choice: foi estabelecida
  rationale: O infinitivo perfeito apresenta a Lei como instituída e ainda vigente.
- source_word: νόμον
  choice: a Lei
  rationale: O artigo aponta para a Lei divina específica que rege a prática judaica; a inicial maiúscula torna clara essa referência em português.
- source_word: κατὰ φύσιν
  choice: segundo a natureza
  rationale: A tradução formal conserva a possível relação da expressão tanto com a compaixão para conosco quanto com o modo de legislar, sem decidir silenciosamente a ambiguidade sintática.
- source_word: συμπαθεῖ
  choice: se compadece de nós
  rationale: O verbo expressa solidariedade, consideração ou sentimento partilhado. A escolha é idiomática e retém a dimensão relacional, embora 'é solidário conosco' também seja possível.
- source_word: νομοθετῶν
  choice: ao dar a Lei
  rationale: O particípio descreve o Criador exercendo a função de legislador; esta expressão liga naturalmente o ato à Lei já mencionada.
- source_word: ὁ τοῦ κόσμου κτίστης
  choice: o Criador do mundo
  rationale: Tradução direta do título, preservando seu alcance cósmico e seu peso teológico.
theological_decisions:
- issue: Implicação da recusa alimentar
  choice: A declaração diz que eles não comem aquilo que é impuro segundo a Lei divina.
  alternative: 'O verbo pode ser vertido de modo mais abstrato: ''não nos contaminamos comendo''.'
  rationale: O verbo composto contém a ideia de comer o que está contaminado, e o contexto trata de alimentos proibidos; a versão evita acrescentar categorias confessionais posteriores.
- issue: Relação entre Deus, a natureza e a legislação
  choice: O Criador, ao legislar, compadece-se de nós segundo a natureza.
  alternative: A frase pode significar que 'o Criador do mundo, ao legislar, mostra consideração por nossa natureza'.
  rationale: O dativo ἡμῖν favorece uma relação dirigida a 'nós', mas κατὰ φύσιν admite mais de uma ligação sintática. O texto principal mantém uma formulação próxima do grego, e a nota apresenta a leitura idiomática alternativa.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. 'Lei' recebe inicial maiúscula por se referir à Lei divina específica. A construção 'segundo a natureza' preserva uma ambiguidade genuína do grego, esclarecida sem ser eliminada pela nota.
