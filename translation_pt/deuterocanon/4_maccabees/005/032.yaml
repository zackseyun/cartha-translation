lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: Diante disso
  rationale: Expressa de modo idiomático a transição e a resposta ao que acaba de ser dito, sem reproduzir de forma rígida o plural neutro grego.
- source_word: τροχοὺς
  choice: as rodas
  rationale: Mantém o sentido concreto e literal do instrumento nomeado no grego; traduzir por “instrumentos de tortura” ou “cavaletes” interpretaria além do texto.
- source_word: εὐτρέπιζε
  choice: prepare
  rationale: Imperativo claro e corrente que transmite a ordem de deixar o equipamento pronto.
- source_word: τὸ πῦρ
  choice: o fogo
  rationale: Tradução direta, com artigo definido, do fogo específico presente na cena.
- source_word: ἔκφυσα
  choice: sopre
  rationale: Preserva a imagem verbal grega de soprar sobre o fogo para fazê-lo arder mais intensamente.
- source_word: σφοδρότερον
  choice: com ainda mais força
  rationale: Comunica naturalmente a intensificação comparativa da ação de soprar.
