base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/002.yaml
  text: He ordered the guards to drag away each one of the Hebrews and force them to taste pork and meat sacrificed to idols[b][a];
translation:
  language: pt
  text: Ordenava aos guardas[a] que arrastassem cada um dos hebreus e obrigassem cada um deles a provar carne de porco e carne sacrificada a ídolos[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “guarda-costas”; mais literalmente, “porta-lanças”.
    reason: lexical_alternative
  - marker: b
    text: Ou “alimento oferecido a ídolos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκέλευεν
  choice: Ordenava
  rationale: O imperfeito grego apresenta a ordem em curso ou reiterada no contexto narrativo; “ordenava” preserva esse aspecto e a força de autoridade.
- source_word: τοῖς δορυφόροις
  choice: aos guardas
  rationale: Embora o termo signifique literalmente “porta-lanças” e possa designar guarda-costas, “guardas” comunica com naturalidade a função exercida na cena.
- source_word: ἕνα ἕκαστον τῶν Ἐβραίων
  choice: cada um dos hebreus
  rationale: A expressão é distributiva e enfática, individualizando as vítimas; “hebreus” traduz diretamente Ἐβραίων.
- source_word: περισπᾶσθαι
  choice: que arrastassem para fora
  rationale: O verbo indica puxar ou arrastar alguém para longe; a formulação conserva a coerção física sem reduzi-la ao sentido mais genérico de “prender”.
- source_word: κρεῶν ὑείων
  choice: carne de porco
  rationale: É a forma corrente e clara de expressar carne suína, mantendo explícita a transgressão alimentar imposta.
- source_word: εἰδωλοθύτων
  choice: carne sacrificada a ídolos
  rationale: No paralelismo com κρεῶν, a referência é a alimento, provavelmente carne, proveniente de sacrifícios idolátricos; a nota registra a possibilidade mais ampla.
- source_word: ἀναγκάζειν
  choice: os obrigassem
  rationale: Expressa de modo direto a compulsão exercida sobre os hebreus.
- source_word: ἀπογεύεσθαι
  choice: a provar
  rationale: Preserva o sentido específico de provar ou tomar um pouco, sem ampliar indevidamente a ação para uma refeição completa.
theological_decisions:
- issue: Designação Ἐβραίων
  choice: hebreus
  alternative: judeus
  rationale: O texto grego emprega explicitamente “hebreus”; conservar essa designação mantém sua textura étnico-histórica sem harmonização interpretativa.
- issue: Grau de participação no alimento proibido indicado por ἀπογεύεσθαι
  choice: provar
  alternative: comer; participar de
  rationale: A redação conserva a tensão de que até uma pequena ingestão seria uma violação forçada, sem afirmar consumo pleno.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “carne” evita a leitura de que o segundo termo apenas qualifica a carne de porco. A pontuação final com ponto e vírgula acompanha o caráter continuativo do trecho fornecido.
