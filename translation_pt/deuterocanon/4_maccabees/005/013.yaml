  source_fidelity: A oração condicional e o optativo potencial estão bem representados, assim como a indefinição da identidade do poder. Contudo, “por toda transgressão” desloca ἐπὶ πᾶσιν para uma generalização sobre a transgressão; a expressão é mais naturalmente entendida com o perdão, “em todas essas coisas”.
  naturalness: O texto é claro e de registro apropriado. “Poder que vele por esta religião” é mais natural em português do que “poder que supervisione esta religião”, sem identificar esse poder.
  terminology: “Religião”, “transgressão”, “sob coação” e “perdoaria” são escolhas adequadas. A nota deve preservar a alternativa lexical de ἐποπτική e a ambiguidade de alcance de ἐπὶ πᾶσιν.
