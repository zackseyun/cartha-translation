  yaml_path: translation/deuterocanon/4_maccabees/005/013.yaml
  text: 'For consider this also: even if there is some overseeing power of this religion[b][a], it would pardon you for the lawlessness done under compulsion in all these things.'
translation:
  language: pt
  text: 'Pois considere também isto: se é que há algum poder que vele por esta religião[a], ele lhe perdoaria, em todas essas coisas, pela transgressão cometida sob coação.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “algum poder vigilante desta religião”. O grego não especifica a identidade desse poder.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “ele lhe perdoaria pela transgressão cometida por necessidade”. A expressão “em todas essas coisas” pode ter seu alcance entendido de maneiras diferentes.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνθυμήθητι
  choice: considere
  rationale: O imperativo pede reflexão ponderada; “considere” conserva a força exortativa em português atual e digno.
- source_word: θρησκείας
  choice: religião
  rationale: No modo como o perseguidor apresenta a fé e as práticas judaicas, o termo é amplo e externo; “religião” reproduz adequadamente esse enquadramento.
- source_word: ἐποπτικὴ δύναμις
  choice: algum poder que supervisione
  rationale: Expressa uma força ou poder vigilante sem identificá-lo explicitamente com Deus, preservando a indefinição do grego.
- source_word: συγγνωμονήσειέν
  choice: perdoaria
  rationale: O optativo, na condição hipotética, indica um resultado potencial. “Perdoaria” comunica concessão de perdão de modo natural, sem reduzir a ação a mera desculpa.
- source_word: παρανομίᾳ
  choice: transgressão
  rationale: O substantivo designa uma ação contrária à lei. “Transgressão” mantém o sentido jurídico e moral no contexto da violação forçada da Lei judaica.
- source_word: διʼ ἀνάγκην
  choice: sob coação
  rationale: No contexto, a necessidade decorre de coerção externa. “Sob coação” torna explícita essa pressão sem sugerir uma escolha voluntária.
- source_word: ἐπὶ πᾶσιν
  choice: por toda
  rationale: 'Ligada à transgressão, a expressão pode ter valor abrangente: toda e qualquer infração exigida nas circunstâncias. A nota registra a alternativa de relacioná-la a “tudo isso”.'
theological_decisions:
- issue: Identidade do “poder que supervisione” a religião
  choice: Manter o poder deliberadamente não identificado
  alternative: Traduzir explicitamente como Deus, providência divina ou guardião da religião
  rationale: O grego formula a ideia de modo hipotético e não nomeia Deus. A tradução conserva essa ambiguidade e a retórica cética do perseguidor.
- issue: Possibilidade de perdão para uma transgressão coagida
  choice: Apresentar a afirmação como argumento hipotético do interlocutor
  alternative: Transformá-la em declaração doutrinária direta sobre culpa e perdão
  rationale: A forma condicional e o optativo pertencem à tentativa de persuasão do personagem; não devem ser convertidos numa definição teológica do narrador.
translation_notes:
  register: Português contemporâneo, digno e acessível, com construção hipotética clara. “Esse poder” evita um pronome de referente incerto e não atribui personalidade ou identidade além do que o grego afirma. Os marcadores [a] e [b] aparecem no texto principal.
