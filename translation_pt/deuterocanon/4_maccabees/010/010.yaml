  yaml_path: translation/deuterocanon/4_maccabees/010/010.yaml
  text: But we[a], O most defiled tyrant, suffer these things for the sake of the discipline and virtue of God.
translation:
  language: pt
  text: Nós, porém, ó tirano imundíssimo, padecemos tudo isso por causa da disciplina e da virtude de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa da disciplina e da virtude que vêm de Deus”. O genitivo “de Deus” pode qualificar tanto “disciplina” quanto “virtude”; também pode caracterizá-las como relacionadas ou voltadas para Deus.'
    reason: Alternativa lexical e esclarecimento da ambiguidade do genitivo θεοῦ.
lexical_decisions:
- source_word: Ἡμεῖς μέν
  choice: Nós, porém
  rationale: O pronome enfático e μέν apresentam os mártires em contraste com a posição do tirano ou com a contraparte implícita. “Nós, porém” conserva essa força de modo natural em português.
- source_word: ὦ μιαρώτατε τύραννε
  choice: ó tirano imundíssimo
  rationale: μιαρώτατε é superlativo e comunica impureza ou contaminação com forte carga moral e religiosa; “imundíssimo” preserva tanto a intensidade do insulto quanto essa imagem. τύραννε é traduzido diretamente por “tirano”.
- source_word: διὰ παιδείαν
  choice: por causa da disciplina
  rationale: Com acusativo, διά indica aqui causa ou motivo. παιδεία abrange educação, formação e disciplina; “disciplina” mantém o campo ético-formativo sem reduzir o sentido à instrução escolar.
- source_word: καὶ ἀρετὴν
  choice: e da virtude
  rationale: ἀρετή designa virtude ou excelência moral. “Virtude” é conciso e adequado ao argumento ético da obra.
- source_word: θεοῦ
  choice: de Deus
  rationale: O genitivo explícito é preservado em vez de ser convertido em um adjetivo interpretativo como “divina”. Sua posição após os dois substantivos permite que qualifique a expressão coordenada inteira, embora a relação semântica exata permaneça aberta.
- source_word: ταῦτα πάσχομεν
  choice: padecemos tudo isso
  rationale: πάσχομεν significa sofrer ou padecer, e ταῦτα remete concretamente aos tormentos em curso. “Padecemos tudo isso” é atual, digno e idiomático.
theological_decisions:
- issue: Relação de θεοῦ com παιδείαν καὶ ἀρετήν
  choice: Manter o genitivo literal na expressão “a disciplina e a virtude de Deus”.
  alternative: Explicitar como “a disciplina e a virtude que vêm de Deus” ou “a formação e a virtude voltadas para Deus”.
  rationale: O grego permite que θεοῦ qualifique os dois substantivos, mas não especifica se a relação é de origem, pertença, orientação ou caracterização. A tradução principal conserva essa tensão, e a nota apresenta possibilidades sem escolher uma doutrina particular.
- issue: Valor de διά com acusativo
  choice: por causa de
  alternative: em favor de / por amor à
  rationale: διά com acusativo exprime normalmente causa ou motivo. “Por causa de” reproduz esse valor sem decidir se os mártires sofrem em razão da formação recebida ou visando preservá-la.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Padecemos” mantém a solenidade do contexto martirial sem soar arcaico; “imundíssimo” conserva a linguagem intensa de impureza moral e religiosa do grego.
