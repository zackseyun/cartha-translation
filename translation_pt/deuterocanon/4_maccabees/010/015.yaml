  yaml_path: translation/deuterocanon/4_maccabees/010/015.yaml
  text: By the blessed death of my brothers[a], and by the tyrant’s eternal destruction, and by the everlasting life of the godly[b], I will not renounce my noble brotherhood.
translation:
  language: pt
  text: 'Juro pela morte bendita dos meus irmãos, pela destruição eterna do tirano e pela vida perpétua dos piedosos[a]: não renegarei a nobre irmandade[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego emprega dois adjetivos de sentido muito próximo quanto à duração: “eterna” para a destruição do tirano e “perpétua” para a vida dos piedosos.'
    reason: lexical_alternative
  - marker: b
    text: Ou “a nobre fraternidade”. No contexto, a expressão se refere ao vínculo honroso do falante com seus irmãos.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὰ
  choice: Juro por
  rationale: A partícula com acusativo introduz uma fórmula solene de juramento; explicitar o verbo em português transmite com naturalidade sua função, sem acrescentar conteúdo ao juramento.
- source_word: μακάριον ... θάνατον
  choice: morte bendita
  rationale: μακάριος atribui condição honrada e abençoada, não mera felicidade; “bendita” é corrente, digna e adequada à valorização religiosa da morte dos irmãos.
- source_word: τῶν ἀδελφῶν μου
  choice: dos meus irmãos
  rationale: O plural masculino corresponde ao contexto, que trata dos irmãos homens do falante.
- source_word: αἰώνιον ... ὄλεθρον
  choice: destruição eterna
  rationale: ὄλεθρος indica destruição ou ruína, e αἰώνιος ressalta sua duração; a expressão preserva a força do contraste escatológico.
- source_word: ἀΐδιον ... βίον
  choice: vida perpétua
  rationale: ἀΐδιος indica duração contínua e permanente. “Perpétua” mantém uma distinção estilística em relação a αἰώνιος, embora os sentidos sejam próximos.
- source_word: τῶν εὐσεβῶν
  choice: dos piedosos
  rationale: εὐσεβής designa quem demonstra reverência religiosa; “piedosos” é conciso e tradicional sem exigir uma elaboração doutrinária.
- source_word: οὐκ ἀρνήσομαι
  choice: não renegarei
  rationale: No contexto, ἀρνέομαι significa recusar-se a repudiar ou desonrar o vínculo com os irmãos; “renegar” exprime essa rejeição deliberada.
- source_word: τὴν εὐγένῃ ἀδελφότητα
  choice: a nobre irmandade
  rationale: ἀδελφότης expressa fraternidade ou vínculo entre irmãos, enquanto εὐγενής comunica nobreza de origem ou caráter. O artigo definido foi preservado, sem inserir um possessivo ausente no grego.
theological_decisions:
- issue: Contraste escatológico entre o tirano e os piedosos
  choice: Afirmar diretamente a destruição duradoura do tirano e a vida permanente dos piedosos.
  alternative: Interpretar o contraste apenas como linguagem moral geral ou explicá-lo segundo um sistema detalhado de recompensa e castigo após a morte.
  rationale: O grego estabelece o contraste com clareza, mas não desenvolve aqui seus mecanismos ou categorias doutrinárias; a tradução conserva a afirmação e seus limites.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A fórmula de juramento foi explicitada como “Juro por”, e os três elementos paralelos foram mantidos. Evitaram-se arcaísmos como “ditosa” e acréscimos confessionais.
