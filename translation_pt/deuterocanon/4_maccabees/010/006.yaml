  text: E arrancavam os dedos, os braços, as pernas e os cotovelos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “puxavam para fora” / “retiravam à força”; o verbo grego indica a remoção forçada de membros ou de partes deles nesta cena de tortura.
    reason: lexical_alternative
lexical_decisions:
- source_word: περίειλκον
  choice: arrancavam
  rationale: O imperfeito descreve uma ação violenta em curso ou repetida no cenário de tortura. “Arrancavam” comunica a remoção à força de modo natural e direto, sem especificar além do que o grego permite.
- source_word: δακτύλους
  choice: dedos
  rationale: É o sentido anatômico comum do termo; o contexto não exige maior especificação.
- source_word: βραχίονας
  choice: braços
  rationale: É a tradução mais direta e corrente, embora o termo possa, em certos contextos, referir-se mais especificamente aos antebraços.
- source_word: σκέλη
  choice: pernas
  rationale: Expressa de modo claro e natural a referência aos membros inferiores.
- source_word: ἀγκῶνας
  choice: cotovelos
  rationale: O substantivo designa normalmente os cotovelos ou a articulação do braço. “Cotovelos” preserva a enumeração corporal contundente do grego.
