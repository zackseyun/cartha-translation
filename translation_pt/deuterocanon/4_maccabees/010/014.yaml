  yaml_path: translation/deuterocanon/4_maccabees/010/014.yaml
  text: But he said to them[a], “The fire you have against me is not so scorching as to make me a coward.”
translation:
  language: pt
  text: 'Mas ele lhes disse: “O fogo que vocês usam contra mim não é tão abrasador a ponto de me acovardar[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fazer-me agir como covarde”. O verbo pode também conservar uma conotação etimológica de falta de coragem masculina.'
    reason: Alternativa lexical para δειλανδρῆσαι; esclarece a possível nuance etimológica sem apresentar uma paráfrase interpretativa como tradução literal.
lexical_decisions:
- source_word: καυστικώτερον
  choice: tão abrasador
  rationale: No padrão οὐχ οὕτω ... ὥστε, o comparativo exprime grau; “não é tão abrasador que...” preserva a imagem do calor intenso e produz uma construção natural em português.
- source_word: ἔχετε ... κατʼ ἐμοῦ τὸ πῦρ
  choice: o fogo que vocês têm contra mim
  rationale: Mantém o fogo concreto usado na tortura e a orientação hostil expressa por κατʼ ἐμοῦ, sem transformar a imagem em explicação.
- source_word: δειλανδρῆσαι
  choice: me acovardar
  rationale: O verbo é causativo e indica tornar alguém covarde ou fazê-lo agir sem coragem. “Me acovardar” comunica de modo direto e idiomático a tentativa de quebrar sua coragem.
- source_word: ὁ δὲ αὐτοῖς ἔφη
  choice: Mas ele lhes disse
  rationale: δέ assinala aqui uma resposta com leve contraste; “Mas” reproduz adequadamente essa virada adversativa.
- source_word: οὐχ οὕτω ... ὥστε
  choice: não é tão ... que possa
  rationale: A construção portuguesa expressa naturalmente a relação grega de grau e resultado; “possa” explicita o resultado pretendido sem afirmar que o fogo possui vontade própria.
theological_decisions:
- issue: δειλανδρῆσαι pode evocar tanto covardia quanto, etimologicamente, falta de virilidade.
  choice: me acovardar
  alternative: fazer com que eu aja como covarde; mais literalmente, tirar-me a coragem de homem
  rationale: O contexto enfatiza coragem moral diante da tortura. A tradução principal conserva esse sentido sem converter a formulação antiga em uma afirmação doutrinária sobre masculinidade; a nota registra a nuance possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Vocês” torna explícito o plural de αὐτοῖς e ἔχετε; “abrasador” preserva a imagem concreta da tortura pelo fogo. A colocação pronominal em “me acovardar” é natural no discurso direto brasileiro.
