  text: I will not renounce the noble kinship of our brotherhood[a].
translation:
  language: pt
  text: Não renunciarei ao nobre laço que nos une como irmãos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não renegarei o nobre vínculo de parentesco entre irmãos.”'
    reason: Alternativa lexical mais formal, que torna explícito o sentido de συγγένεια e traduz ἐξόμνυμαι por “renegarei”.
lexical_decisions:
- source_word: οὐκ
  choice: não
  rationale: Negação simples, ligada diretamente ao verbo.
- source_word: ἐξόμνυμαι
  choice: renunciarei
  rationale: O verbo pode significar negar, repudiar ou abjurar. “Renunciarei” preserva a ideia de rejeitar deliberadamente o vínculo familiar sem introduzir de modo explícito uma fórmula de juramento.
- source_word: τὴν ... συγγένειαν
  choice: o ... laço que nos une
  rationale: συγγένεια designa parentesco ou vínculo familiar. A formulação escolhida comunica esse sentido de modo natural em português e evita a rigidez de “parentesco da irmandade”.
- source_word: εὐγενῆ
  choice: nobre
  rationale: Mantém tanto a dignidade moral quanto a possível conotação de nobreza de origem presente em εὐγενής.
- source_word: τῆς ἀδελφότητος
  choice: como irmãos
  rationale: ἀδελφότης indica fraternidade ou vínculo entre irmãos. Neste contexto familiar, “como irmãos” expressa claramente a relação concreta, preservando o termo masculino do grego.
theological_decisions:
- issue: Termo familiar de gênero masculino ἀδελφότης
  choice: como irmãos
  alternative: fraternidade; vínculo entre irmãos
  rationale: O contexto é o vínculo dos irmãos da família martirizada. A tradução conserva a referência masculina concreta, sem a neutralizar nem ampliar indevidamente.
- issue: Relação entre συγγένεια e ἀδελφότης
  choice: laço que nos une como irmãos
  alternative: parentesco da nossa irmandade
  rationale: A construção grega acumula termos de parentesco. A tradução mantém os dois componentes sem produzir em português uma expressão obscura ou artificial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação evita a expressão pouco natural “parentesco da irmandade”, mas preserva a ênfase grega no nobre vínculo familiar entre irmãos.
