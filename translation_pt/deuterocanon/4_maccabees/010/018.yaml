  yaml_path: translation/deuterocanon/4_maccabees/010/018.yaml
  text: But he said[a], “Even if you take away the instrument of speech, God hears those who are silent.”
translation:
  language: pt
  text: 'Mas ele disse: “Mesmo que você retire o instrumento da voz[a], Deus ouve os que estão em silêncio.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o instrumento da voz”. A expressão provavelmente se refere ao órgão ou aos órgãos do corpo usados para falar.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἂν ἀφέλῃς
  choice: Mesmo que você retire
  rationale: Κἂν (καὶ ἐάν) introduz uma condição concessiva, e ἀφέλῃς, segunda pessoa do singular de ἀφαιρέω, significa retirar ou tirar. A formulação mantém tanto a concessão quanto a referência direta ao interlocutor.
- source_word: τὸ τῆς φωνῆς ὄργανον
  choice: o instrumento da voz
  rationale: Preserva a metáfora de ὄργανον como instrumento ou órgão e a relação genitiva com φωνή, sem especificar indevidamente a língua ou todo o aparelho vocal.
- source_word: σιωπώντων
  choice: os que estão em silêncio
  rationale: O particípio presente genitivo plural de σιωπάω é substantivado e descreve pessoas que permanecem caladas; a tradução é clara e natural em português.
- source_word: ἀκούει
  choice: ouve
  rationale: Mantém o sentido direto do verbo e o paradoxo intencional de Deus ouvir pessoas que não falam.
- source_word: ὁ θεός
  choice: Deus
  rationale: Equivalente padrão e natural do sujeito nominativo grego.
theological_decisions:
- issue: Se a frase afirma que Deus ouve pessoas em silêncio ou, de modo mais interpretativo, orações não verbalizadas
  choice: Deus ouve os que estão em silêncio
  alternative: Deus ouve as orações silenciosas
  rationale: O grego menciona explicitamente pessoas que estão em silêncio, não “orações”. A tradução conserva a afirmação e sua tensão sem acrescentar uma interpretação devocional.
- issue: Valor de καί antes de σιωπώντων
  choice: Sem acrescentar “também” ou “até mesmo” na oração principal
  alternative: Deus ouve também/até mesmo os que estão em silêncio
  rationale: O valor inclusivo ou enfático de καί já é amplamente comunicado pela condição concessiva “Mesmo que”; evitar outro marcador produz português mais direto sem eliminar o paradoxo do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” para representar com clareza a segunda pessoa do singular. A metáfora corporal do grego foi preservada e esclarecida em nota.
