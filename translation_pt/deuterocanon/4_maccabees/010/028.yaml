  text: Now look[a], being alien to God[c][b], you are making war against those who are reverent toward God.
translation:
  language: pt
  text: 'Agora veja[a]: sendo alheio a Deus[b], você guerreia[c] contra os que agem com reverência para com Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Agora, olhe” ou “Agora, eis”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “estranho a Deus” ou “afastado de Deus”.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “faz guerra contra” ou “combate”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: Agora
  rationale: Marca o momento presente e introduz a conclusão incisiva do discurso.
- source_word: ἰδὲ
  choice: veja
  rationale: Imperativo que chama enfaticamente a atenção do interlocutor; “veja” é natural e mantém o tom confrontador.
- source_word: ἀλλότριος ὢν θεοῦ
  choice: sendo alheio a Deus
  rationale: Preserva a construção participial e a ideia de não pertencimento ou afastamento relacional expressa por ἀλλότριος com o genitivo.
- source_word: πολεμεῖς
  choice: você guerreia contra
  rationale: Conserva a imagem forte de hostilidade bélica e o aspecto presente da ação.
- source_word: τοὺς εὐσεβοῦντας εἰς τὸν θεόν
  choice: os que agem com reverência para com Deus
  rationale: Reproduz verbalmente o particípio e mantém Deus como direção ou objeto da conduta reverente, sem restringir o sentido especificamente ao culto.
theological_decisions:
- issue: Força relacional de ἀλλότριος θεοῦ
  choice: alheio a Deus
  alternative: afastado de Deus
  rationale: “Alheio a Deus” preserva a noção de não pertencimento ou estranheza sem definir além do texto a natureza metafísica ou definitiva dessa condição.
- issue: Sentido de εὐσεβεῖν em relação a Deus
  choice: agir com reverência para com Deus
  alternative: adorar a Deus com reverência
  rationale: A formulação escolhida mantém o sentido amplo de conduta piedosa e reverente, evitando acrescentar a ideia mais específica de adoração cultual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A segunda pessoa foi expressa por “você”, adequada ao confronto direto; “guerreia” preserva a imagem bélica do grego, e “agem com reverência para com Deus” mantém a formulação ampla e deliberadamente não sectária.
