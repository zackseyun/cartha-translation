  text: And when this one had died in a manner worthy of his brothers[a], they dragged forward the fourth, saying,
translation:
  language: pt
  text: 'E, depois que este morreu de modo digno de seus irmãos[a], arrastaram o quarto para a frente, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “depois de morrer de modo digno de irmão”. A expressão indica que ele morreu de maneira condizente com um dos irmãos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου
  choice: este
  rationale: Retoma de modo demonstrativo o irmão mencionado anteriormente, preservando a força dêitica do grego sem tornar a frase pesada.
- source_word: θανόντος
  choice: depois que este morreu
  rationale: O particípio aoristo em genitivo absoluto indica uma ação concluída antes da ação principal; a oração temporal soa natural em português.
- source_word: ἀδελφοπρεπῶς
  choice: de modo digno de seus irmãos
  rationale: Expressa uma morte condizente com a dos irmãos no contexto do martírio, conservando tanto a referência familiar quanto o sentido honorífico; a nota registra a construção incomum do grego.
- source_word: τὸν τέταρτον
  choice: o quarto
  rationale: Mantém o substantivo implícito como no grego; o contexto deixa claro que se trata do quarto irmão.
- source_word: ἐπεσπῶντο
  choice: arrastaram ... para a frente
  rationale: Comunica o movimento forçado de trazer a vítima adiante, adequado ao cenário de coerção e tortura.
- source_word: λέγοντες
  choice: dizendo
  rationale: Preserva a ligação participial com a fala que vem em seguida.
