  text: But God will swiftly pursue you[a], for you are cutting out the tongue that sings the melodies of divine hymns.
translation:
  language: pt
  text: Mas Deus irá rapidamente atrás de você[a], pois você está cortando a língua que entoa os hinos divinos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deus rapidamente perseguirá você” ou “Deus rapidamente castigará você”. O verbo grego pode significar ir atrás de alguém ou persegui-lo e, neste contexto, implica juízo divino.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταχέως
  choice: logo
  rationale: Expressa a rapidez ou iminência da ação divina de maneira natural em português, sem definir se a ênfase recai exclusivamente na velocidade ou no tempo próximo.
- source_word: μετελεύσεται
  choice: irá atrás de você
  rationale: Preserva a imagem de μετέρχομαι como ir atrás ou perseguir alguém. No contexto, a ação implica juízo e punição, mas o texto principal não reduz essa imagem ao verbo abstrato 'punir'.
- source_word: ὁ θεός
  choice: Deus
  rationale: Tradução direta do sujeito grego.
- source_word: τὴν ... γλῶτταν
  choice: a língua
  rationale: Mantém o sentido físico e concreto do órgão mutilado, essencial à cena de martírio.
- source_word: τῶν θείων ὕμνων
  choice: os hinos divinos
  rationale: Conserva o caráter elevado de θείων e a referência explícita a hinos, sem acrescentar um destinatário não expresso gramaticalmente.
- source_word: μελῳδόν
  choice: que entoa
  rationale: Converte naturalmente em oração relativa o adjetivo grego que caracteriza a língua como produtora de canto ou melodia. 'Entoa' preserva a dimensão musical sem a redundância de 'canta as melodias dos hinos'.
- source_word: ἐκτέμνεις
  choice: está cortando fora
  rationale: Reproduz o presente da ação e a violência concreta de extirpar a língua; 'cortando fora' é compreensível em português amplo e conserva mais da imagem do composto grego do que apenas 'cortando'.
theological_decisions:
- issue: Sentido da retribuição divina em μετελεύσεται ὁ θεός
  choice: Deus irá atrás do perseguidor em juízo
  alternative: Deus logo castigará você; Deus logo perseguirá você
  rationale: O verbo apresenta Deus como aquele que vai atrás do tirano. O contexto implica ação punitiva, mas a formulação principal preserva a imagem e a tensão do grego, enquanto a nota registra a explicitação possível.
translation_notes:
  register: Português moderno, digno e acessível, com construção de ampla legibilidade brasileira. A frase mantém a interpelação direta e a violência da cena, enquanto 'entoa os hinos divinos' reproduz o tom elevado e musical do original.
