  source_fidelity: A tradução preserva corretamente a ameaça dirigida ao interlocutor, Deus como sujeito, a ação de perseguição implícita em μετελεύσεται e a mutilação da língua que entoa hinos divinos. Contudo, «logo» tende a indicar sobretudo iminência temporal, ao passo que ταχέως qualifica mais diretamente a rapidez da ação; «rapidamente» representa melhor o advérbio grego.
  naturalness: «Irá atrás de você» é natural e acessível, mas «logo irá atrás» pode sugerir apenas que a ação ocorrerá em breve. «Irá rapidamente atrás de você» mantém a imagem verbal e exprime com maior precisão a rapidez. «Está cortando fora» é compreensível, porém menos idiomático; «está cortando a língua» é mais fluente sem atenuar a violência do contexto.
  terminology: «Deus», «língua» e «hinos divinos» são adequados e mantêm o registro elevado do grego. «Entoa» transmite apropriadamente o caráter musical de μελῳδόν. A nota deve conservar as alternativas sem transformar a perseguição em punição no texto principal.
