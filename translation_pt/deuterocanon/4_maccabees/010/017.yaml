  yaml_path: translation/deuterocanon/4_maccabees/010/017.yaml
  text: When bloodthirsty and murderous and most savage Antiochus heard these things[a], he ordered his tongue to be cut out.
translation:
  language: pt
  text: Ao ouvir isso, Antíoco, sedento de sangue, assassino e extremamente cruel[a], mandou que lhe cortassem a língua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega aqui um adjetivo superlativo raro, que também pode ser traduzido como “ferocíssimo” ou “extremamente selvagem”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: isso
  rationale: O demonstrativo neutro plural retoma de modo amplo as declarações anteriores; em português corrente, “isso” expressa essa referência sem restringi-la apenas às palavras.
- source_word: ἀκούσας
  choice: Ao ouvir
  rationale: O particípio aoristo indica uma ação anterior à ordem; a construção temporal é natural e preserva a sequência narrativa.
- source_word: αἱμοβόρος
  choice: sedento de sangue
  rationale: Mantém a imagem intensa do composto grego e caracteriza Antíoco como alguém ávido por derramamento de sangue.
- source_word: φονώδης
  choice: assassino
  rationale: Transmite de forma direta e compreensível a disposição homicida indicada pelo adjetivo grego.
- source_word: πανμμερώτατος
  choice: extremamente cruel
  rationale: Reproduz a força superlativa do adjetivo raro em linguagem portuguesa natural; “cruel” se ajusta à brutalidade descrita no contexto.
- source_word: ἐκέλευσεν
  choice: mandou
  rationale: Expressa uma ordem dada para ser executada por terceiros e combina naturalmente com a construção causativa seguinte.
- source_word: τὴν γλῶτταν αὐτοῦ
  choice: lhe ... a língua
  rationale: A construção portuguesa com pronome dativo possessivo expressa de modo idiomático que se trata da língua da vítima, sem inserir no texto uma identificação ausente do grego.
- source_word: ἐκτεμεῖν
  choice: que ... cortassem
  rationale: O verbo significa cortar ou extirpar; a oração com sujeito indeterminado torna explícito, de modo natural, que outros executariam a ordem de Antíoco.
