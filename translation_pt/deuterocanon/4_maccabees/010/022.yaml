  text: I am not about to refuse[a], tyrant, the torture for the sake of virtue.
translation:
  language: pt
  text: Não pretendo, tirano, recusar[a] a tortura em defesa da virtude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não me esquivarei da tortura em defesa da virtude.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ μέλλω
  choice: Não pretendo
  rationale: A construção μέλλω com infinitivo pode indicar intenção ou ação iminente. “Não pretendo” conserva a postura resoluta e voltada para o que está prestes a acontecer, em português natural.
- source_word: τύραννε
  choice: tirano
  rationale: O vocativo dirige-se diretamente ao governante perseguidor com uma designação moralmente carregada; “tirano” é o equivalente mais direto e transparente.
- source_word: πρὸς τὸν ... βασανισμόν
  choice: a tortura
  rationale: βασανισμός designa tortura ou tormento severo. Neste contexto, a construção preposicional aponta para o suplício que o jovem enfrentará; “recusar a tortura” comunica isso com clareza em português.
- source_word: ὑπὲρ τῆς ἀρετῆς
  choice: por amor à virtude
  rationale: ὑπέρ expressa aqui a causa ou aquilo em defesa do qual se sofre, e ἀρετή denota virtude ou excelência moral. “Por amor à virtude” preserva o motivo do sofrimento sem tornar a frase artificial.
- source_word: παραιτεῖσθαι
  choice: recusar
  rationale: O infinitivo médio pode significar recusar, declinar ou esquivar-se. “Recusar” é conciso e adequado ao desafio direto do falante.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocativo direto e tom resoluto. A formulação evita arcaísmos e conserva a força moral de ἀρετή como “virtude”.
