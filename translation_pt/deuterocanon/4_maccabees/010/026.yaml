  text: But these things from you are not worthy even of tortures,[a]
translation:
  language: pt
  text: Mas essas coisas da parte de vocês não são dignas de torturas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo mais literal: «Mas essas coisas de vocês não são dignas de torturas». A expressão ὑμῶν é condensada e pode significar «de vocês» ou «da parte de vocês».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Conjunção adversativa que marca contraste enfático; «Mas» é a forma mais natural e concisa em português.
- source_word: ταῦτα
  choice: essas coisas
  rationale: Preserva o plural neutro e mantém amplo o referente do demonstrativo; «essas» aponta naturalmente para o que os interlocutores fazem ou apresentam.
- source_word: ὑμῶν
  choice: da parte de vocês
  rationale: Expressa de modo natural o genitivo idiomático e comprimido, que pode indicar aquilo que procede dos interlocutores ou é feito por eles.
- source_word: βασάνων
  choice: torturas
  rationale: No contexto de martírio, refere-se a atos ou instrumentos de tortura, e não apenas a sofrimento abstrato.
- source_word: ἄξια
  choice: não são dignas de
  rationale: Reproduz a construção de ἄξια com genitivo sem acrescentar o intensificador «sequer», que não está expresso no grego.
