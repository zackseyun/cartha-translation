  source_fidelity: 'A ideia central é preservada: a fala exprime aceitação voluntária da mutilação em lealdade a Deus. Contudo, «por amor a Deus» explicita uma motivação afetiva que não está lexicalmente marcada por ὑπὲρ τοῦ θεοῦ; «por causa de Deus» reproduz de modo mais neutro a relação de causa/compromisso. Além disso, τὰ τοῦ σώματος μέλη é melhor expresso como objeto direto de «mutilados», não por «nos membros».'
  naturalness: «Somos mutilados nos membros do corpo» é compreensível, mas pouco idiomático e enfraquece a construção concreta do grego. «Temos os membros do corpo mutilados» é natural, mantém a passiva de sentido e deixa claro que as partes corporais são aquilo que sofre a mutilação.
  terminology: «De bom grado» traduz adequadamente ἡδέως, com disposição resoluta. «Membros do corpo» conserva μέλη sem limitar o sentido a braços e pernas. «Mutilados» corresponde a ἀκρωτηριαζόμεθα sem intensificar para esquartejamento.
