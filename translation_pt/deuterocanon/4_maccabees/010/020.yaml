    rationale: Os membros são o objeto afetado pela mutilação. Em português, «temos os membros do corpo mutilados» comunica isso com clareza e preserva o caráter passivo do sofrimento imposto.
  revised_text: Por causa de Deus[a], de bom grado temos os membros do corpo mutilados.
