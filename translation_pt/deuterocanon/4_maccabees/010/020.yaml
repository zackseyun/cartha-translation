  text: For the sake of God[a], we gladly have the limbs of our body mutilated.
translation:
  language: pt
  text: Por causa de Deus[a], de bom grado temos os membros do corpo mutilados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por Deus”.'
    reason: Alternativa mais concisa para ὑπὲρ τοῦ θεοῦ; a expressão pode indicar a causa ou a lealdade pela qual se suporta a mutilação.
lexical_decisions:
- source_word: ἡδέως
  choice: de bom grado
  rationale: Expressa disposição voluntária e resoluta diante do sofrimento, sem sugerir prazer leviano na mutilação.
- source_word: ὑπὲρ τοῦ θεοῦ
  choice: por amor a Deus
  rationale: Ὑπέρ com genitivo indica aqui a causa ou lealdade pela qual o sofrimento é suportado. A formulação portuguesa comunica devoção sem sugerir substituição em lugar de Deus.
- source_word: τὰ τοῦ σώματος μέλη
  choice: nos membros do corpo
  rationale: O acusativo funciona como referência à parte afetada pela mutilação. “Membros do corpo” preserva a expressão concreta do grego e evita restringi-la indevidamente apenas a braços e pernas.
- source_word: ἀκρωτηριαζόμεθα
  choice: somos mutilados
  rationale: Mantém a voz passiva e o sentido de mutilação ou amputação, sem intensificar necessariamente para “somos esquartejados”.
theological_decisions:
- issue: Sofrimento do mártir por Deus
  choice: por amor a Deus
  alternative: por Deus; por causa de Deus
  rationale: A frase apresenta a fidelidade a Deus como motivo do sofrimento. “Por amor a Deus” torna essa relação inteligível em português sem introduzir uma ideia de expiação ou de atuação como substituto de Deus.
translation_notes:
  register: Português atual, digno e amplamente compreensível. A ordem foi ajustada para fluidez, mas a voz passiva, a disposição voluntária e a referência às partes do corpo foram preservadas.
