  yaml_path: translation/deuterocanon/4_maccabees/010/001.yaml
  text: And after he had endured this death[a], worthy to be sung of, the third was led in[b], being urged much by many to save himself by tasting it.
translation:
  language: pt
  text: Depois que este suportou com firmeza uma morte digna de ser cantada[a], o terceiro foi conduzido, enquanto muitos insistiam repetidamente com ele para que, provando[b], salvasse a própria vida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também se pode traduzir por “uma morte célebre” ou “uma morte memorável”. O adjetivo grego sugere literalmente algo celebrado em canto ou recordado com louvor.
    reason: lexical_alternative
  - marker: b
    text: Isto é, provando o alimento proibido e, assim, preservando a vida.
    reason: cultural_note
lexical_decisions:
- source_word: ἀοίδιμον
  choice: digna de ser cantada
  rationale: Preserva a imagem literal de algo celebrado em canto e o tom elevado do elogio martirológico, sem reduzi-lo ao sentido mais genérico de “célebre” ou “memorável”.
- source_word: θάνατον
  choice: morte
  rationale: Corresponde diretamente ao substantivo grego e mantém o foco no fim sofrido pelo irmão anterior.
- source_word: καρτερήσαντος
  choice: suportou com firmeza
  rationale: Expressa tanto a resistência ao sofrimento quanto a constância moral sugerida pelo verbo.
- source_word: ὁ τρίτος ἤγετο
  choice: o terceiro foi conduzido
  rationale: Mantém a voz passiva e o movimento imposto ao terceiro irmão, sem acrescentar um destino que o grego não explicita.
- source_word: παρακαλούμενος πολλὰ ὑπὸ πολλῶν
  choice: enquanto muitos insistiam repetidamente com ele
  rationale: 'Reproduz as duas ênfases da expressão: a multiplicidade das pessoas e a intensidade ou repetição dos apelos.'
- source_word: ὅπως ἀπογευσάμενος σώζοιτο
  choice: para que, provando um pouco, salvasse a própria vida
  rationale: Conserva a construção final e deixa implícito o objeto de “provar”, como no grego; neste contexto, σώζοιτο se refere à preservação da vida.
theological_decisions:
- issue: Elevação martirológica em ἀοίδιμον θάνατον
  choice: morte digna de ser cantada
  alternative: morte célebre; morte memorável; morte gloriosa
  rationale: A formulação mantém o elogio retórico do texto e sua imagem poética sem introduzir uma categoria doutrinária posterior.
- issue: Objeto implícito de ἀπογευσάμενος
  choice: provando um pouco, com explicação contextual em nota
  alternative: provando o alimento proibido; provando-o
  rationale: O grego não nomeia o objeto. A tradução preserva essa elipse, enquanto a nota esclarece a referência contextual sem incorporá-la indevidamente ao texto principal.
- issue: Sentido contextual de σώζοιτο
  choice: salvasse a própria vida
  alternative: fosse salvo; se salvasse
  rationale: No contexto, o apelo visa evitar a execução mediante conformidade alimentar. A formulação explicita a preservação da vida, não uma salvação espiritual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada para soar natural, mas foram preservados o tom elevado, a passividade de “foi conduzido” e o objeto implícito de “provando”.
