base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/016.yaml
  text: Go on[a], tyrant, with your tortures, so that even through these you may learn that I am a brother of those who have been tortured before.
translation:
  language: pt
  text: Prossiga, tirano, com as torturas, para que, mesmo por meio delas, você aprenda que sou irmão dos que foram torturados antes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos que já haviam sido torturados”. O particípio grego indica que eles foram torturados antes do falante.'
    reason: alternativa lexical e explicitação da anterioridade
lexical_decisions:
- source_word: ἔπιθι
  choice: Prossiga
  rationale: O imperativo funciona como desafio dirigido ao tirano. “Prossiga” comunica a atitude desafiadora em português natural, sem acrescentar conteúdo.
- source_word: τύραννε
  choice: tirano
  rationale: Mantém o vocativo direto e tanto o sentido político quanto a condenação moral do termo grego.
- source_word: βασάνοις
  choice: com as torturas
  rationale: O dativo plural indica aqui os atos ou meios de tortura associados ao imperativo. Não se acrescenta o possessivo “suas”, ausente do grego.
- source_word: ἵνα καὶ διὰ τούτων μάθῃς
  choice: para que, até por meio delas, você aprenda
  rationale: “Para que” preserva a finalidade expressa por ἵνα; “até” representa o valor enfático de καί, e “por meio delas” apresenta as torturas como meio pelo qual o tirano aprenderá.
- source_word: ἀδελφός
  choice: irmão
  rationale: Conserva o masculino singular explícito e a solidariedade familiar do mártir com os homens torturados anteriormente.
- source_word: τῶν προβασανισθέντων
  choice: dos que foram torturados antes
  rationale: Expressa a voz passiva e a anterioridade indicada por προ-, identificando os irmãos submetidos à tortura antes do falante.
theological_decisions:
- issue: Termo de parentesco masculino ἀδελφός no contexto do martírio familiar
  choice: irmão
  alternative: um dos irmãos / um dos irmãos e irmãs
  rationale: O grego emprega o masculino singular, e o contexto apresenta um homem que se identifica com seus irmãos anteriormente torturados. A tradução evita neutralizar o gênero expresso no texto.
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e leitura natural no Brasil. O tratamento por “você” torna explícito o sujeito singular já indicado pelo verbo grego; o vocativo “tirano” preserva o confronto direto.
