base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/004.yaml
  text: In response to this[a], if you have any instrument of punishment, bring it against my body; for my soul, even if you wish it[b], you will not touch.
translation:
  language: pt
  text: Em resposta a isso, se vocês têm algum instrumento de punição[a], apliquem-no ao meu corpo; pois não tocarão minha alma[b], mesmo que o queiram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “algum meio de punição” ou “algum instrumento de tortura”; o termo grego se refere concretamente a um instrumento ou meio usado para punir.
    reason: lexical_alternative
  - marker: b
    text: Ou “minha vida”; o grego ψυχή também pode significar “vida”, mas aqui “alma” corresponde melhor ao contraste com “corpo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: Em resposta a isso
  rationale: Expressa de modo natural o valor discursivo da locução grega, que introduz a resposta do mártir ao que acaba de ser dito ou feito.
- source_word: εἴ τι ἔχετε κολαστήριον
  choice: se vocês têm algum instrumento de punição
  rationale: κολαστήριον designa concretamente um instrumento ou meio de punir, possivelmente de torturar, e não apenas a punição em sentido abstrato.
- source_word: προσαγάγετε τῷ σώματί μου
  choice: usem-no contra o meu corpo
  rationale: No contexto, o imperativo exige que o instrumento seja aplicado ao corpo. A formulação portuguesa preserva a força hostil sem sugerir apenas que seja trazido para perto.
- source_word: τῆς γὰρ ψυχῆς μου
  choice: pois, quanto à minha alma
  rationale: A construção genitiva anteposta realça a alma como aquilo que os perseguidores não podem alcançar; 'quanto à' reproduz esse destaque com clareza.
- source_word: οὐδʼ ἂν θέλητε
  choice: mesmo que queiram
  rationale: Preserva a concessão e a ideia de que nem sequer a vontade dos algozes pode superar a impossibilidade declarada.
- source_word: ἅψεσθε
  choice: vocês não a tocarão
  rationale: O futuro de ἅπτομαι admite 'tocar' ou 'agarrar'; 'tocar' é conciso e mantém o contraste enfático entre a vulnerabilidade do corpo e a intangibilidade da alma.
theological_decisions:
- issue: Tradução de ψυχή em contraste com σῶμα
  choice: alma
  alternative: vida
  rationale: O contraste explícito com 'corpo' favorece 'alma' e preserva a tensão antropológica do texto. A alternativa 'vida' permanece indicada em nota, pois é semanticamente possível no grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento plural por “vocês”. A ordem foi levemente ajustada para soar natural, preservando a ênfase da construção grega e o contraste entre corpo e alma.
