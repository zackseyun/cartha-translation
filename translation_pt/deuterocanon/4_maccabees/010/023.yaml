base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/023.yaml
  text: But I myself came forward of my own accord[a], so that by killing me also, you may incur punishment from heavenly justice for still more acts of wrongdoing.
translation:
  language: pt
  text: Eu, porém, vim por minha própria iniciativa, para que, matando-me também, você incorra em punição da parte da justiça celestial[a] por ainda mais atos de injustiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “justiça do céu” ou “julgamento celestial”. O grego não menciona Deus explicitamente aqui, mas se refere à justiça transcendente associada ao céu.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρῆλθον
  choice: vim
  rationale: No contexto, o verbo indica que o falante se apresentou diante do tirano. “Vim”, reforçado pela expressão de iniciativa voluntária, é claro e natural sem introduzir detalhes ausentes do grego.
- source_word: ἀπʼ ἐμαυτοῦ
  choice: por minha própria iniciativa
  rationale: A expressão indica ação voluntária, originada no próprio falante, e recebe em português uma formulação natural que preserva essa ênfase.
- source_word: κατακτείνας
  choice: ao matar
  rationale: O particípio aoristo acompanha a ação principal e pode ser expresso naturalmente como circunstância ligada à responsabilidade incorrida, sem fixar indevidamente uma sequência temporal rígida.
- source_word: ὀφλήσῃς
  choice: incorra em
  rationale: Em contexto judicial, o verbo exprime contrair uma obrigação ou tornar-se passível de penalidade. “Incorrer em punição” comunica essa responsabilidade de modo idiomático.
- source_word: τῇ οὐρανίᾳ δίκῃ
  choice: da parte da justiça celestial
  rationale: A expressão remete à justiça transcendente associada ao céu. A formulação mantém a relação entre essa justiça e a punição sem nomear Deus explicitamente.
- source_word: τιμωρίαν
  choice: punição
  rationale: É o equivalente moderno mais direto para a consequência punitiva indicada pelo substantivo, sem a carga mais pessoal de “vingança”.
- source_word: περὶ πλειόνων ἀδικημάτων
  choice: por ainda mais atos de injustiça
  rationale: A tradução conserva o caráter moral e jurídico de ἀδίκημα e o sentido cumulativo do comparativo πλειόνων.
theological_decisions:
- issue: Sentido de τῇ οὐρανίᾳ δίκῃ no contexto do juízo moral transcendente
  choice: justiça celestial
  alternative: justiça do céu; julgamento celestial; justiça divina
  rationale: “Justiça celestial” conserva a referência ao âmbito celeste e a relativa impessoalidade de δίκη. Evita explicitar “divina”, pois o grego não nomeia Deus, e não reduz o termo apenas ao ato de julgar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. A posição da nota foi vinculada à expressão que ela esclarece.
