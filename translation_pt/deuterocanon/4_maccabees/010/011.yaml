  text: But because of your ungodliness and blood-guilt[a], you will endure unending torments.
translation:
  language: pt
  text: Mas você, por causa da sua impiedade e do seu homicídio que traz contaminação[a], suportará tormentos sem fim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “culpa de sangue” ou “homicídio contaminador”. O termo grego reúne as ideias de homicídio ou derramamento de sangue e da contaminação moral ou religiosa que ele produz.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσέβειαν
  choice: impiedade
  rationale: Expressa de modo natural e digno a irreverência e a oposição a Deus presentes no termo grego.
- source_word: μιαιφονίαν
  choice: assassinatos que contaminam
  rationale: 'Preserva os dois elementos do composto grego: o homicídio ou derramamento de sangue e a contaminação moral ou religiosa resultante.'
- source_word: ἀκαταλύτους
  choice: sem fim
  rationale: No contexto de βασάνους, comunica claramente aquilo que não é interrompido nem levado ao fim, sem deslocar a ênfase para a intensidade.
- source_word: καρτερήσεις
  choice: suportará
  rationale: Conserva o futuro e o sentido de aguentar ou padecer de forma continuada.
- source_word: βασάνους
  choice: tormentos
  rationale: Abrange sofrimento punitivo severo sem restringir o sentido apenas a métodos físicos de tortura.
theological_decisions:
- issue: Força moral e religiosa da acusação contra o tirano
  choice: impiedade e assassinatos que contaminam
  alternative: impiedade e culpa de sangue
  rationale: A formulação mantém tanto a ofensa contra Deus quanto o caráter contaminador do sangue derramado, sem reduzir μιαιφονία a mera responsabilidade jurídica.
- issue: Alcance temporal de ἀκαταλύτους
  choice: tormentos sem fim
  alternative: tormentos incessantes
  rationale: A expressão representa diretamente o sentido de algo que não é desfeito ou levado ao fim, sem acrescentar uma explicação doutrinária além da afirmação do texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leitura natural no Brasil. O singular abstrato grego μιαιφονίαν foi vertido pelo plural concreto idiomático, acompanhado de oração explicativa breve para conservar sua dimensão de contaminação.
