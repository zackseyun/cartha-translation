  text: Do not be as insane as your brothers with the same madness, but be persuaded by the king and save yourself.
translation:
  language: pt
  text: Não enlouqueça também você, como seus irmãos, com a mesma loucura; pelo contrário, deixe-se convencer pelo rei e salve a si mesmo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μανῇς … μανίαν
  choice: enlouqueça … com a mesma loucura
  rationale: Preserva a figura etimológica e a retórica enfática do grego, empregando linguagem natural e clara em português.
- source_word: πεισθεὶς τῷ βασιλεῖ
  choice: deixe-se convencer pelo rei
  rationale: Mantém o sentido passivo de πεισθείς e evita reduzir a expressão diretamente a “obedeça”, embora a anuência prática esteja implícita.
- source_word: σῶζε σεαυτόν
  choice: salve a si mesmo
  rationale: Reproduz a ordem direta e a ênfase reflexiva explícita de σεαυτόν.
theological_decisions:
- issue: Amplitude de πείθομαι com dativo
  choice: deixe-se convencer pelo rei
  alternative: obedeça ao rei
  rationale: A escolha preserva a imagem de persuasão ou anuência presente no particípio grego, sem excluir a obediência resultante nem impor uma interpretação mais estreita.
translation_notes:
  register: Português moderno, claro e digno, com preferência pela forma amplamente compreensível “você”. A repetição “enlouqueça/loucura” foi mantida intencionalmente por refletir a força retórica do original.
