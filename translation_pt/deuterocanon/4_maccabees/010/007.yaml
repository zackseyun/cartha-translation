  yaml_path: translation/deuterocanon/4_maccabees/010/007.yaml
  text: And since they were in no way able to strangle him[a], they dragged off the skin with the very tips of his fingers and flayed him, and immediately they led him to the wheel.
translation:
  language: pt
  text: E, como de modo algum conseguiam estrangulá-lo, arrancaram-lhe a pele juntamente com as pontas dos dedos[a] e o esfolaram; imediatamente, levaram-no à roda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com as próprias pontas dos dedos”. A expressão grega é incomum e muito gráfica; pode indicar que a pele foi arrancada juntamente com as extremidades dos dedos ou até elas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μηδένα τρόπον
  choice: de modo algum
  rationale: Expressão portuguesa natural que preserva a negação enfática e total do grego.
- source_word: ἰσχύοντες
  choice: conseguiam
  rationale: Neste contexto, o particípio indica capacidade efetiva para realizar a ação do infinitivo, não apenas força física.
- source_word: ἄγξαι
  choice: estrangulá-lo
  rationale: O verbo designa apertar ou comprimir a garganta; “estrangular” é preciso e claro no contexto de tortura.
- source_word: περισύραντες τὸ δέρμα
  choice: arrancaram-lhe a pele
  rationale: Reproduz a ação violenta de puxar e retirar a pele, em português corrente e digno.
- source_word: σὺν ἄκραις ταῖς τῶν δακτύλων κορυφαῖς
  choice: até as pontas dos dedos
  rationale: 'Comunica a imagem gráfica mais provável: a pele foi retirada até as extremidades dos dedos. A construção grega com σύν é incomum, por isso a alternativa mais literal é registrada em nota.'
- source_word: ἀπεσκύθισον
  choice: o esfolaram
  rationale: O verbo pode significar tirar a pele ou o couro cabeludo; “esfolaram” mantém o sentido amplo adequado ao contexto corporal sem restringi-lo à cabeça.
- source_word: εὐθέως
  choice: imediatamente
  rationale: Preserva a rápida sucessão dos acontecimentos.
- source_word: ἦγον ἐπὶ τὸν τροχόν
  choice: levaram-no para a roda
  rationale: Expressão direta de movimento em direção à roda, instrumento de tortura.
