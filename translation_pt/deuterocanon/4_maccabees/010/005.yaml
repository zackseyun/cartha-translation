  text: But bitterly resenting the man's boldness[a], they dislocated his hands and feet with joint-wrenching instruments, and prying them out of their sockets[b], they dismembered him.
translation:
  language: pt
  text: Mas eles, reagindo com amargo ressentimento à ousadia do homem[a], deslocavam-lhe as mãos e os pés com instrumentos que torciam as articulações e, arrancando-os de suas juntas[b], desmembravam-no.
