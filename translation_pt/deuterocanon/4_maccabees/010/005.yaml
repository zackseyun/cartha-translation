    text: 'Ou, mais literalmente: “suportando com amargura a ousadia do homem”. No contexto, a expressão indica que reagiram com amargo ressentimento à sua fala franca e destemida.'
    reason: lexical_alternative
  - marker: b
    text: O grego emprega termos raros para os instrumentos aplicados às articulações e para a separação violenta dos membros, ressaltando a brutalidade da tortura.
    reason: cultural_note
lexical_decisions:
- source_word: πικρῶς ἐνέγκαντες
  choice: suportando com amargura
  rationale: Preserva a construção participial e o sentido mais literal de ἐνέγκαντες, enquanto πικρῶς expressa a reação hostil e ressentida; evita resolver completamente a expressão como simples ressentimento.
- source_word: παρρησίαν
  choice: ousadia
  rationale: Comunica coragem e franqueza ao falar em português corrente e digno.
- source_word: ἀρθρεμβόλοις ὀργάνοις
  choice: com instrumentos que torciam as articulações
  rationale: Explicita de modo natural a função dos raros instrumentos indicados pelo composto grego, sem impor um aparelho específico não nomeado no texto.
- source_word: ἐξήρθρουν
  choice: deslocavam
  rationale: É o equivalente moderno e preciso para tirar mãos e pés das articulações.
- source_word: ἐξ ἁρμῶν ἀναμοχλεύοντες
  choice: arrancando-os de suas juntas
  rationale: Reproduz a ação mecânica e violenta de alavancar ou forçar para fora dos pontos de articulação.
- source_word: ἐξέμελιζον
  choice: desmembravam-no
  rationale: Verbo gráfico que representa o ato de separar violentamente os membros, sem restringir indevidamente o objeto apenas às extremidades mencionadas.
theological_decisions:
- issue: Grau de explicitação da violência
  choice: 'Manter a descrição corporal explícita: deslocar, arrancar das juntas e desmembrar'
  alternative: Suavizar com termos gerais como “mutilar” ou “torturar”
  rationale: O grego descreve de modo deliberadamente gráfico as articulações e a separação dos membros; suavizá-lo reduziria a força narrativa do martírio.
- issue: Sentido de πικρῶς ἐνέγκαντες
  choice: “suportando com amargura”, preservando a forma incomum e sua tensão semântica
  alternative: “ressentidos com” ou “não tolerando”
  rationale: O verbo significa literalmente levar, suportar ou aguentar, mas o advérbio e o contexto sugerem reação hostil. A formulação escolhida mantém ambas as dimensões, com esclarecimento em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A sintaxe conserva a relação participial do grego, e o vocabulário permanece digno, claro e deliberadamente gráfico, como o original.
