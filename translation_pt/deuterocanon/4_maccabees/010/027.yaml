  text: if indeed you had human feelings, and had hope from God for deliverance.
translation:
  language: pt
  text: se de fato tivesses sentimentos humanos[a] e tivesses esperança de livramento da parte de Deus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «anseios humanos» ou «afeições humanas». A expressão grega é condensada e apela aos vínculos afetivos próprios do ser humano.
    reason: lexical_alternative
  - marker: b
    text: Ou «salvação». O grego pode indicar tanto livramento imediato quanto salvação em sentido mais amplo.
    reason: alternative_reading
lexical_decisions:
- source_word: εἴπερ
  choice: se de fato
  rationale: Preserva tanto o caráter condicional quanto a ênfase retórica da partícula, sem convertê-la em afirmação causal.
- source_word: ἠσθάνου ἀνθρώπους πόθων
  choice: tivesses sentimentos humanos
  rationale: A expressão grega é comprimida e apela à sensibilidade ou afeição humana comum. A formulação portuguesa comunica a dimensão afetiva com naturalidade, sem restringi-la à mera percepção intelectual.
- source_word: ἐλπίδα εἶχες παρὰ θεῷ
  choice: pusesses em Deus a esperança
  rationale: Expressa em português corrente uma esperança situada em relação a Deus e nele fundamentada. Evita o pouco natural «esperança junto de Deus» e não afirma de modo excessivamente específico que a esperança procede de Deus.
- source_word: σωτηρίου
  choice: de livramento
  rationale: Neste contexto de sofrimento e morte iminentes, «livramento» comunica de modo imediato a ideia de resgate, preservando em nota a possibilidade mais ampla de «salvação».
theological_decisions:
- issue: Sentido de σωτηρίου no contexto do martírio
  choice: livramento
  alternative: salvação
  rationale: O termo admite tanto resgate diante do perigo quanto salvação em sentido mais amplo. O contexto imediato favorece «livramento», mas a alternativa teologicamente mais abrangente é preservada em nota.
- issue: Relação da esperança com Deus em παρὰ θεῷ
  choice: pusesses em Deus a esperança
  alternative: tivesses esperança junto de Deus
  rationale: A preposição com o dativo indica proximidade ou relação. A tradução escolhida é idiomática e mantém Deus como fundamento da esperança, sem definir além do texto o modo exato dessa relação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção condicional emprega o imperfeito do subjuntivo de modo natural. As notas preservam a amplitude lexical das duas expressões mais ambíguas.
