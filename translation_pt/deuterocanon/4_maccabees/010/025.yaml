  yaml_path: translation/deuterocanon/4_maccabees/010/025.yaml
  text: Or does it not seem evil to you that we worship the Creator of all and live according to his virtuous law?[a]
translation:
  language: pt
  text: Ou não parece um mal que adoremos o Criador de tudo e vivamos segundo a sua lei virtuosa?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: «Ou não parece um mal que adoremos o Criador de tudo e vivamos segundo a sua lei virtuosa?» O grego não explicita o destinatário; a pergunta retórica pode contestar o julgamento moral de um adversário implícito.'
    reason: alternativa sintática e preservação da ambiguidade do destinatário
lexical_decisions:
- source_word: κακὸν
  choice: um mal
  rationale: Conserva a forte avaliação moral do grego e funciona naturalmente com «parecer» em português.
- source_word: οὐ δοκεῖ
  choice: não lhe parece
  rationale: Expressa uma avaliação em forma de pergunta retórica. O pronome «lhe» torna natural em português o destinatário implícito no contexto.
- source_word: τὸν πάντων κτίστην
  choice: o Criador de tudo
  rationale: Traduz κτίστης pelo título claro e elevado «Criador» e mantém o alcance abrangente de πάντων.
- source_word: εὐσεβοῦμεν
  choice: adoremos
  rationale: No contexto de devoção dirigida ao Criador, «adorar» comunica de modo claro e corrente a reverência religiosa expressa pelo verbo.
- source_word: κατὰ
  choice: segundo
  rationale: Indica conformidade com a lei e oferece uma formulação concisa e natural.
- source_word: τὸν ἔναρετον αὐτοῦ νόμον
  choice: a sua lei virtuosa
  rationale: Mantém a qualificação moral explícita de ἔναρετος, sem reduzi-la à ideia mais genérica de uma lei apenas boa ou excelente.
- source_word: ζῶμεν
  choice: vivamos
  rationale: Preserva o sentido de conduzir a vida em conformidade com uma norma; o subjuntivo é exigido naturalmente pela construção portuguesa «parece um mal que».
theological_decisions:
- issue: Referente e força da pergunta retórica
  choice: A fala questiona se adorar o Criador e viver segundo sua lei deve ser julgado um mal pelo interlocutor.
  alternative: 'A pergunta pode ser formulada sem explicitar o destinatário: «Ou não parece um mal que...?»'
  rationale: O grego não contém pronome explícito de segunda pessoa, mas o confronto retórico pressupõe o julgamento do interlocutor. «Lhe» torna essa relação clara em português sem alterar o conteúdo da pergunta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Lei virtuosa» é uma formulação deliberadamente pouco comum para preservar a qualificação moral explícita do grego.
