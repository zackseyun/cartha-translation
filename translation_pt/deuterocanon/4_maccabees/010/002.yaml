base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/002.yaml
  text: But he cried out and said[a], “Do you not know that the same father sowed me among those who die, and the same mother gave birth to me, and I was brought up in the same principles?”
translation:
  language: pt
  text: 'Mas ele gritou e disse: “Ou vocês não sabem que o mesmo pai me semeou junto com os que morreram[a], que a mesma mãe me deu à luz e que fui criado segundo os mesmos princípios?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre os que morreram”. O grego conserva a metáfora agrícola de “semear” para falar da geração humana.'
    reason: Registra a possível nuance associativa ou espacial do dativo e esclarece a metáfora deliberadamente preservada, sem substituí-la no texto.
lexical_decisions:
- source_word: ἀναβοήσας
  choice: gritou
  rationale: Expressa uma manifestação vocal forte e repentina em português atual, sem acrescentar conteúdo ao verbo.
- source_word: Ἢ ἀγνοεῖτε
  choice: Ou vocês não sabem
  rationale: Mantém a partícula que liga a pergunta ao contexto anterior e reproduz a força retórica da repreensão sem a aspereza pouco natural de 'vocês ignoram'.
- source_word: αὐτός ... πατήρ
  choice: o mesmo pai
  rationale: No paralelismo com 'a mesma mãe', identifica a origem paterna comum do falante e dos irmãos.
- source_word: ἔσπειρεν
  choice: me semeou
  rationale: Conserva deliberadamente a metáfora agrícola grega aplicada à geração humana; 'me gerou' seria mais natural, mas apagaria a imagem do original.
- source_word: τοῖς ἀποθανοῦσιν
  choice: junto com os que morreram
  rationale: O particípio aoristo aponta naturalmente para os que já morreram no contexto, e o dativo associa o falante a eles. 'Junto com' comunica essa origem comum sem tornar a relação sintática excessivamente rígida.
- source_word: ἐγέννησεν
  choice: me deu à luz
  rationale: É a expressão portuguesa corrente para o ato materno de gerar e preserva o contraste com a metáfora aplicada ao pai.
- source_word: ἀνετράφην
  choice: fui criado
  rationale: Transmite de modo natural a ideia de formação recebida durante a criação.
- source_word: ἐπὶ τοῖς αὐτοῖς ... δόγμασιν
  choice: segundo os mesmos princípios
  rationale: Expressa a base comum da formação moral e religiosa. 'Princípios' preserva a amplitude de δόγματα sem reduzi-lo a decretos jurídicos nem a doutrinas confessionais posteriores.
theological_decisions:
- issue: Metáfora de geração em ἔσπειρεν
  choice: Conservar 'me semeou' no texto principal.
  alternative: me gerou
  rationale: A formulação grega atribui ao pai uma ação figurada de semear. Preservar essa imagem mantém a corporeidade e a força retórica do texto sem introduzir uma explicação doutrinária.
- issue: Referente temporal de τοῖς ἀποθανοῦσιν
  choice: os que morreram
  alternative: os que morrem; os mortais
  rationale: O particípio aoristo substantivado favorece a referência aos irmãos já mortos no relato. A tradução evita converter a expressão em uma afirmação antropológica geral sobre todos os mortais.
- issue: Relação expressa pelo dativo τοῖς ἀποθανοῦσιν
  choice: junto com os que morreram
  alternative: entre os que morreram
  rationale: O dativo permite certa tensão na maneira de associar o falante aos irmãos. 'Junto com' destaca a geração comum, enquanto a nota registra a alternativa mais espacial sem decidir além da evidência.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Emprega 'vocês' para o plural explícito na pergunta e mantém a imagem incomum de 'semear' por fidelidade ao grego; a nota auxilia o leitor sem suavizar a tensão do original.
