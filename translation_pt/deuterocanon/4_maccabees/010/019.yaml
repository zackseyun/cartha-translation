  yaml_path: translation/deuterocanon/4_maccabees/010/019.yaml
  text: Look[a], my tongue has been broken; cut it off[b]. For not even by this will you cut out our reasoned judgment.
translation:
  language: pt
  text: 'Olhe: minha língua já está quebrada; corte-a. Pois nem mesmo assim você extirpará nosso juízo racional.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz «nosso juízo racional», não «meu»; o plural pode expressar a solidariedade do falante com seus irmãos.
    reason: alternative_reading
  - marker: b
    text: 'O verbo final é um termo vívido para «cortar a língua», empregado aqui de modo metafórico: mutilar a língua do falante não pode extirpar o juízo racional compartilhado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Veja
  rationale: Interjeição direta que chama a atenção, em português atual e digno.
- source_word: κέχλασται
  choice: já está esmagada
  rationale: O perfeito indica o estado resultante de uma ação sofrida; “esmagada” comunica a grave mutilação sem definir um mecanismo específico.
- source_word: ἡ γλῶσσα
  choice: minha língua
  rationale: Embora o grego use artigo definido, o contexto exige referência à língua do próprio falante; o possessivo é idiomático em português.
- source_word: τέμνε
  choice: corte-a fora
  rationale: O imperativo retoma a língua como objeto e exprime sua remoção violenta de modo claro.
- source_word: οὐ γὰρ παρὰ τοῦτο
  choice: Pois nem mesmo assim
  rationale: Expressa que nem por esse ato de mutilação o torturador alcançará seu objetivo.
- source_word: τὸν λογισμὸν
  choice: juízo racional
  rationale: Preserva os aspectos intelectual e moralmente resoluto de λογισμός, termo central em 4 Macabeus.
- source_word: ἡμῶν
  choice: nosso
  rationale: Mantém o plural do texto grego, apesar do falante individual, preservando sua possível solidariedade com os irmãos.
- source_word: γλωσσοτομήσεις
  choice: extirpará
  rationale: O composto significa literalmente cortar a língua; aplicado metaforicamente ao juízo racional, “extirpará” conserva a ideia de remoção violenta sem produzir uma expressão ininteligível.
theological_decisions:
- issue: Sentido de λογισμός no contexto filosófico-teológico de 4 Macabeus
  choice: juízo racional
  alternative: razão; determinação racional
  rationale: A formulação mantém tanto o raciocínio quanto a firmeza moral, sem reduzir o termo ao intelecto abstrato nem importar terminologia doutrinária posterior.
- issue: Plural ἡμῶν embora o falante seja singular
  choice: nosso juízo racional
  alternative: meu juízo racional
  rationale: O testemunho grego fornecido traz o plural, que pode expressar a solidariedade do mártir com seus irmãos; a tradução não o harmoniza silenciosamente com o contexto singular.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A violência concreta da primeira oração e a metáfora da oração final foram preservadas sem arcaísmo.
