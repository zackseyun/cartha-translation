  yaml_path: translation/deuterocanon/4_maccabees/010/024.yaml
  text: O hateful and misanthropic man[a], what are you doing by exposing us in this way?
translation:
  language: pt
  text: Ó odioso e misantropo, o que estamos fazendo, para que nos exponhas dessa maneira?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nos ponhas diante dessa maneira” ou “nos apresentes dessa maneira”. O verbo grego pode significar “pôr diante”, “apresentar” ou “expor”; no contexto, “expor” pode sugerir apresentá-los publicamente ao abuso ou ao castigo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισάρετε
  choice: inimigo da virtude
  rationale: O vocativo composto caracteriza o destinatário como alguém que odeia a virtude. A formulação preserva o conteúdo do composto grego e funciona como repreensão direta em português.
- source_word: μισάνθρωπε
  choice: inimigo da humanidade
  rationale: O composto designa literalmente quem odeia os seres humanos. “Inimigo da humanidade” comunica esse sentido com força e clareza, sem o tom mais técnico de “misantropo”.
- source_word: τί δρῶντες
  choice: o que você está fazendo
  rationale: 'A construção grega apresenta tensão de número: o particípio está no plural, embora o destinatário seja interpelado no singular e προθεῖς também esteja no singular. A tradução segue a interpelação singular exigida pelo contexto, sem reproduzir uma discordância ininteligível em português.'
- source_word: ἡμᾶς
  choice: nos
  rationale: Pronome de primeira pessoa do plural, objeto da ação expressa por προθεῖς.
- source_word: προθεῖς
  choice: ao nos expor
  rationale: O particípio de προτίθημι pode indicar pôr diante, apresentar ou expor. No contexto de perseguição, “expor” transmite a ideia de colocar publicamente as vítimas diante do abuso ou do castigo.
- source_word: τοῦτον τὸν τρόπον
  choice: dessa maneira
  rationale: Expressão idiomática de modo, vertida de forma natural e próxima ao grego.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” para ampla legibilidade brasileira. Os dois vocativos foram mantidos em paralelo para preservar a força retórica do grego. A discordância de número presente na expressão grega τί δρῶντες não foi reproduzida mecanicamente, pois o restante da interpelação aponta para um destinatário singular.
