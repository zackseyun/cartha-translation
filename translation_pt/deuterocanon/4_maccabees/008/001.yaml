base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/001.yaml
  text: For since in the first trial the notorious tyrant was defeated[a], being unable to compel the old man to eat defiling food,
translation:
  language: pt
  text: Pois, como na primeira tentativa o notório tirano foi derrotado, por não ter conseguido obrigar o ancião a comer alimento considerado impuro,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a comer carne impura” ou “a comer alimento proibido”. O verbo grego é raro e se refere a comer algo considerado impuro segundo a lei judaica.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπειδὴ γὰρ
  choice: Pois, como
  rationale: Preserva tanto o valor explicativo de γάρ quanto a relação causal de ἐπειδή, com formulação natural em português.
- source_word: κατὰ τὴν πρώτην πεῖραν
  choice: na primeira tentativa
  rationale: πεῖρα pode indicar prova ou tentativa; aqui, o contexto destaca a primeira tentativa do tirano de compelir o ancião.
- source_word: ἐνικήθη
  choice: foi derrotado
  rationale: Reproduz diretamente o passivo de νικάω e caracteriza o fracasso do tirano.
- source_word: περιφανὴς
  choice: notório
  rationale: O adjetivo indica alguém destacado ou amplamente conhecido; junto de 'tirano', 'notório' comunica essa proeminência com adequada conotação negativa.
- source_word: ὁ τύραννος
  choice: o notório tirano
  rationale: Mantém a força moral e política de τύραννος, sem suavizá-lo para 'governante'.
- source_word: μὴ δυνηθεὶς
  choice: por não ter conseguido
  rationale: Expressa de modo natural o particípio circunstancial, que apresenta a causa ou maneira da derrota.
- source_word: ἀναγκάσαι
  choice: obrigar
  rationale: Verbo corrente e forte em português para a coerção expressa pelo grego.
- source_word: γέροντα
  choice: o ancião
  rationale: Embora sem artigo no grego, refere-se contextualmente ao homem idoso já conhecido; 'ancião' mantém registro digno sem sugerir necessariamente um cargo.
- source_word: μαιροφαγῆσαι
  choice: a comer alimento que o tornaria impuro
  rationale: O verbo raro aponta para o consumo de alimento considerado contaminante segundo a lei judaica. A formulação preserva o efeito de impureza sem restringir indevidamente o referente a carne.
theological_decisions:
- issue: Natureza do alimento em μαιροφαγῆσαι
  choice: alimento que o tornaria impuro
  alternative: carne contaminada; alimento proibido
  rationale: A tradução conserva a dimensão de impureza associada à lei judaica sem especificar além do que o verbo raro permite e sem reduzir a ideia à mera proibição.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A frase permanece aberta com vírgula porque o versículo continua sintaticamente no contexto seguinte.
