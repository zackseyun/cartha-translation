base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/019.yaml
  text: Shall we not fear the tortures[a], brothers, and reckon with the threats of the torments, and flee this empty glory and deadly arrogance?
translation:
  language: pt
  text: Não haveremos de temer as torturas, irmãos, levar em conta as ameaças de tortura e fugir dessa glória vazia[a] e dessa arrogância mortífera?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dessa vanglória”.
    reason: κενοδοξία pode ser traduzida de maneira mais compacta como “vanglória”, embora “glória vazia” torne a composição grega mais transparente.
lexical_decisions:
- source_word: οὐ φοβησόμεθα
  choice: Não haveremos de temer
  rationale: O futuro em pergunta retórica tem força deliberativa e exortativa. A formulação preserva tanto o valor futuro quanto a pergunta, sem reduzi-la a uma afirmação.
- source_word: ἄνδρες ἀδελφοί
  choice: irmãos
  rationale: O vocativo dirige-se enfaticamente aos irmãos homens no contexto narrativo. “Irmãos” é natural em português e mantém a referência masculina; a força de ἄνδρες é absorvida no tom solene do apelo.
- source_word: τὰ βασανιστήρια
  choice: as torturas
  rationale: No contexto, o termo designa torturas ou castigos de tortura. “As torturas” é direto e não especifica indevidamente instrumentos.
- source_word: λογιούμεθα
  choice: levar em conta
  rationale: O verbo expressa considerar ou atribuir peso a algo. “Levar em conta” comunica esse sentido de modo corrente e claro.
- source_word: τὰς τῶν βασάνων ἀπειλάς
  choice: as ameaças dos suplícios
  rationale: A construção genitiva indica ameaças relacionadas aos tormentos. “Suplícios” distingue a expressão do substantivo anterior e preserva o registro grave.
- source_word: φεύξομεν
  choice: fugir
  rationale: Mantém a imagem concreta do verbo grego, que significa fugir ou escapar, e sua força de rejeição moral.
- source_word: τὴν κενοδοξίαν ταύτην
  choice: dessa glória vazia
  rationale: κενοδοξία denota glória vã ou presunção. “Glória vazia” preserva a imagem do composto grego em linguagem transparente.
- source_word: ὀλεθροφόρον ἀλαζονίαν
  choice: dessa arrogância mortífera
  rationale: ὀλεθροφόρος caracteriza aquilo que traz destruição, e ἀλαζονία indica arrogância ou jactância. “Arrogância mortífera” é conciso, digno e preserva a força destrutiva da expressão.
theological_decisions:
- issue: Pergunta retórica com três verbos coordenados
  choice: 'Manter toda a sequência sob o alcance da pergunta negativa: “Não haveremos de temer..., levar em conta... e fugir...?”'
  alternative: 'Transformar a passagem em declaração ou exortação: “Não temeremos... nem levaremos em conta..., mas fugiremos...”'
  rationale: A sintaxe e a pontuação gregas apresentam uma pergunta retórica única. Manter essa forma preserva a tensão do apelo e evita inserir negações e uma oposição adversativa que não aparecem no texto.
- issue: Vocativo masculino ἄνδρες ἀδελφοί
  choice: irmãos
  alternative: irmãos e homens; irmãos e irmãs
  rationale: O contexto e a forma grega são explicitamente masculinos. “Irmãos” conserva essa referência sem produzir uma expressão artificial em português.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A construção “não haveremos de” conserva a retórica deliberativa do futuro grego; “suplícios” e “mortífera” mantêm o peso literário sem arcaísmo excessivo.
