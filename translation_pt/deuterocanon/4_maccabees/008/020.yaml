lexical_decisions:
- source_word: ἐλεήσωμεν
  choice: Tenhamos compaixão
  rationale: O subjuntivo exortativo de ἐλεέω faz um apelo à compaixão. A formulação evita introduzir a ideia mais específica de “poupar”, que não está expressa diretamente no verbo.
- source_word: τὰς ἑαυτῶν ἡλικίας
  choice: nossa própria juventude
  rationale: Ἡλικία pode indicar idade, etapa da vida ou vigor juvenil. No contexto dos irmãos ainda jovens, “juventude” comunica com naturalidade a fase da vida que cada um é instado a considerar; o sentido distributivo do plural grego é expresso coletivamente em português.
- source_word: κατοικτειρήσωμεν
  choice: tenhamos pena
  rationale: O segundo subjuntivo exortativo exprime piedade compassiva. “Tenhamos pena” é corrente e preserva a distinção verbal em relação a “tenhamos compaixão” na primeira oração.
- source_word: τὸ τῆς μητρὸς
  choice: da velhice de nossa mãe
  rationale: 'O texto grego desta testemunha é elíptico: o artigo neutro não vem acompanhado de um substantivo expresso. Pelo contexto, “velhice” é a complementação mais provável, mas seu caráter inferido é assinalado em nota.'
