  text: Let us have mercy on our own youth[a], and let us pity our mother’s old age,
translation:
  language: pt
  text: Tenhamos compaixão de nossa própria juventude e tenhamos pena da velhice de nossa mãe[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “daquilo que é de nossa mãe” ou “da condição de nossa mãe”, deixando implícito o substantivo. “Velhice” foi suprido com base no contexto como o sentido mais provável.
