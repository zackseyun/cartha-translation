base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/005.yaml
  text: Young men[a], I warmly admire the beauty of each one of you, and, valuing so highly the number of so many brothers, I not only urge you not to go mad with the same madness as the old man who has already been tortured, but also—
translation:
  language: pt
  text: Jovens, admiro cordialmente a beleza de cada um de vocês e, tendo em tão alta estima a grande quantidade de irmãos que vocês são, não apenas os aconselho a não enlouquecer com a mesma loucura do ancião que já foi torturado, mas também—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego termina aqui com “mas também”, e a frase continua no versículo seguinte.
    reason: continuação sintática entre versículos
lexical_decisions:
- source_word: Ὦ νεανίαι
  choice: Jovens
  rationale: É uma forma direta e natural de se dirigir, em português moderno, a jovens do sexo masculino; o contexto deixa claro que se trata dos irmãos.
- source_word: φιλοφρόνως
  choice: cordialmente
  rationale: Expressa a atitude afável e favorável do orador sem ampliar indevidamente o sentido.
- source_word: καθʼ ἑνὸς ἑκάστου ὑμῶν ... τὸ κάλλος
  choice: a beleza de cada um de vocês
  rationale: Preserva tanto a referência à beleza quanto a ênfase distributiva em cada jovem individualmente.
- source_word: τὸ πλῆθος τοσούτων ἀδελφῶν ὑπερτιμῶν
  choice: tendo em tão alta estima o fato de serem tantos irmãos
  rationale: Reproduz a elevada estima expressa pelo particípio e comunica em português natural o tamanho notável do grupo de irmãos.
- source_word: οὐ μόνον συμβουλεύω
  choice: não apenas os aconselho
  rationale: Mantém a construção correlativa que fica incompleta no fim do versículo; “aconselho” corresponde diretamente ao teor persuasivo de συμβουλεύω.
- source_word: μὴ μανῆναι ... μανίαν
  choice: a não enlouquecer com a mesma loucura
  rationale: Conserva a repetição retórica entre o verbo e o substantivo cognato, embora a formulação seja deliberadamente marcada.
- source_word: τῷ προβασανισθέντι γέροντι
  choice: do ancião que já foi torturado
  rationale: “Ancião” preserva o sentido de γέρων, e “já foi torturado” expressa a anterioridade do particípio προβασανισθέντι.
- source_word: ἀλλὰ καὶ
  choice: mas também—
  rationale: Mantém a oração inacabada e sinaliza que a continuação vem no versículo seguinte.
theological_decisions:
- issue: Referência masculina de ἀδελφῶν
  choice: irmãos
  alternative: irmãos e irmãs / familiares
  rationale: O contexto trata especificamente dos filhos homens e irmãos entre si; a forma masculina não é genérica neste caso.
- issue: Oração incompleta no fim do versículo
  choice: preservar “mas também—”
  alternative: completar ou reformular a ideia
  rationale: O texto grego fornecido termina em ἀλλὰ καὶ; completar a frase acrescentaria conteúdo não presente neste versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição “enlouquecer com a mesma loucura” foi mantida para refletir o efeito retórico intencional do grego; o travessão preserva a interrupção da frase.
