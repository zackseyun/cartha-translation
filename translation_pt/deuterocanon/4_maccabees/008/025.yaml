  rationale: É a correspondência direta da expressão grega; a minúscula evita impor ao fragmento um uso titular não demonstrado.
- source_word: ἑκουσίως
  choice: de bom grado
  rationale: Transmite o sentido de ação voluntária ou disposta, sem ocultar que, no fragmento incompleto, sua ligação sintática exata permanece incerta.
- source_word: ἡμᾶς
