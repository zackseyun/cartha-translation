base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/009.yaml
  text: And after changing your way of life[a], enjoy your youth. But if by your disobedience you provoke me to anger, you will force me, through dreadful punishments, to destroy each one of you by tortures.
translation:
  language: pt
  text: E, depois de mudarem seu modo de vida, desfrutem a juventude. Pois, se com sua desobediência vocês me provocarem à ira[a], me obrigarão a destruir cada um de vocês por meio de terríveis castigos e torturas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “se, por causa de sua desobediência, vocês me tratarem com ira”. A expressão grega é difícil; o texto principal apresenta o sentido mais provável.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταδιαιτηθέντες
  choice: depois de mudarem seu modo de vida
  rationale: O particípio indica a adoção de outro modo de viver ou conduta. A formulação é natural em português e não acrescenta a ideia específica de arrependimento.
- source_word: ἐντρυφήσατε
  choice: desfrutem
  rationale: O imperativo convida os jovens a gozar ou aproveitar sua juventude; “desfrutem” preserva esse sentido sem a carga moral de “entreguem-se aos prazeres”.
- source_word: ταῖς νεότησιν ὑμῶν
  choice: a juventude
  rationale: Embora o grego use o plural, a expressão refere-se naturalmente ao período da juventude dos destinatários.
- source_word: ἀπειθείας
  choice: desobediência
  rationale: Equivalente direto que preserva a ideia de recusa em obedecer sem intensificá-la como rebelião.
- source_word: ὀργίλως με διαθῆσθε
  choice: vocês me provocarem à ira
  rationale: A construção grega é difícil. No contexto da ameaça seguinte, a tradução expressa naturalmente a ideia provável de que a desobediência os fará despertar a ira do governante.
- source_word: δειναῖς κολάσεσιν
  choice: sob terríveis castigos
  rationale: δίνος qualifica os castigos como temíveis ou terríveis; “sob” comunica de modo natural o âmbito ou condição punitiva da execução.
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: cada um de vocês
  rationale: Preserva a ênfase distributiva da expressão grega.
- source_word: βασάνων
  choice: torturas
  rationale: No contexto judicial e persecutório, βάσανος designa tortura ou tormento, aqui como meio de causar a morte.
- source_word: ἀπολέσαι
  choice: destruir
  rationale: Mantém a escolha verbal ampla de ἀπόλλυμι; neste contexto, a destruição por torturas implica a morte.
theological_decisions:
- issue: Sentido da expressão difícil ἐὰν ὀργίλως με διαθῆσθε
  choice: se com sua desobediência vocês me provocarem à ira
  alternative: se, por causa de sua desobediência, vocês me tratarem com ira
  rationale: 'A sintaxe permite uma leitura mais literal em que os jovens tratam o falante iradamente, mas a ameaça subsequente favorece o sentido causativo: a desobediência deles desperta a ira do tirano. A nota preserva a ambiguidade genuína.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregou-se “vocês” por naturalidade internacional com leitura brasileira; evitou-se linguagem arcaica e também uma paráfrase que eliminasse a dificuldade do grego.
