  yaml_path: translation/deuterocanon/4_maccabees/008/013.yaml
  text: Then[a], when the bodyguards set out wheels, joint-rackers, stretching-machines, clawing hooks, catapults, cauldrons[b], frying pans, thumbscrews, iron hands, wedges, and the live coals of the fire, the tyrant took up the matter and said,
translation:
  language: pt
  text: 'Então, quando os guardas dispuseram[a] rodas, instrumentos para deslocar articulações, aparelhos de torção, ganchos, catapultas[b], caldeirões, frigideiras, prensas para os dedos, mãos de ferro, cunhas e as brasas vivas do fogo, o tirano tomou a palavra e disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vários nomes de instrumentos neste versículo são raros ou técnicos, e algumas identificações são aproximadas. “Instrumentos para deslocar articulações” também pode ser entendido como “quebradores de membros”; “aparelhos de torção”, como “potros de tortura”; e “prensas para os dedos”, como “prensas para os polegares”.
    reason: lexical_alternative
  - marker: b
    text: O texto grego diz literalmente “catapultas”, item incomum nesta lista. A tradução preserva essa leitura, em vez de substituí-la por um instrumento de tortura conjecturado.
    reason: alternative_reading
lexical_decisions:
- source_word: τροχούς
  choice: rodas
  rationale: Preserva o sentido básico do substantivo grego sem especificar além do texto que se tratava de rodas de tortura.
- source_word: ἀρθρενβόλους
  choice: instrumentos para deslocar articulações
  rationale: O composto raro parece designar instrumentos que feriam ou deslocavam articulações; a formulação funcional é clara sem alegar uma identificação técnica exata.
- source_word: στρεβλωτήριά
  choice: aparelhos de torção
  rationale: O termo deriva da ideia de torcer e torturar; esta tradução conserva essa imagem e evita restringi-lo ao potro.
- source_word: τροχαντῆρας
  choice: ganchos
  rationale: O vocábulo técnico é raro e parece indicar instrumentos em forma de gancho; a opção simples evita precisão indevida.
- source_word: καταπέλτας
  choice: catapultas
  rationale: É o sentido normal e textual, embora o objeto seja incomum nesta lista de instrumentos de tortura.
- source_word: λέβητας
  choice: caldeirões
  rationale: Designa grandes recipientes metálicos usados para aquecer ou ferver.
- source_word: τήγανά
  choice: frigideiras
  rationale: Equivalente corrente para recipientes rasos empregados para aquecer ou fritar.
- source_word: δακτυλήθρας
  choice: prensas para os dedos
  rationale: A palavra se relaciona aos dedos e, neste contexto, parece indicar aparelhos que os comprimiam; a tradução evita restringir o instrumento apenas aos polegares.
- source_word: χεῖρας σιδηρᾶς
  choice: mãos de ferro
  rationale: Mantém literalmente a imagem vívida do grego, embora provavelmente se refira a instrumentos de agarrar ou dilacerar.
- source_word: σφῆνας
  choice: cunhas
  rationale: É o valor lexical comum do termo, sem acrescentar um modo de uso não declarado.
- source_word: τὰ ζώπυρα τοῦ πυρός
  choice: as brasas vivas do fogo
  rationale: Reproduz a imagem enfática de carvões ou brasas ainda ardentes.
- source_word: οἱ δορυφόροι
  choice: os guardas
  rationale: Embora literalmente sejam portadores de lança, no contexto régio o termo designa os guardas do governante.
- source_word: ὑπολαβὼν ... ἔφη
  choice: tomou a palavra e disse
  rationale: Expressa naturalmente a retomada ou intervenção verbal indicada pelo particípio, sem impor a ideia mais específica de resposta.
theological_decisions:
- issue: Designação avaliativa do governante por τύραννος
  choice: o tirano
  alternative: o rei; o governante
  rationale: Preserva o juízo moral explícito do autor sobre o caráter opressor do governante, em vez de neutralizá-lo.
