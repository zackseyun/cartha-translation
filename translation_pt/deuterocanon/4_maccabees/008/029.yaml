  text: So when the tyrant stopped urging them to eat defiling food[a], they all together, with one voice, as if from the same soul, said[b],
translation:
  language: pt
  text: 'Assim, quando o tirano parou de aconselhá-los a comer alimento que os tornaria impuros[a], todos juntos, a uma só voz, como que de uma mesma alma, disseram[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a comer alimento impuro” ou “a comer alimento contaminado”. O termo grego se refere a comer algo cujo consumo causaria impureza religiosa.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “como que de uma mesma alma”, expressão que ressalta sua completa unidade de propósito.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Assim
  rationale: Introduz o resultado e a continuação da cena; junto de «que», forma uma transição temporal e consequencial natural em português.
- source_word: ἅμα τῷ παύσασθαι
  choice: Assim que ... parou
  rationale: Expressa de modo idiomático a proximidade temporal da construção grega, sem impor uma simultaneidade mecânica.
- source_word: τὸν τύραννον
  choice: o tirano
  rationale: Preserva o caráter pejorativo e político de τύραννος no contexto da obra.
- source_word: συμβουλεύοντα αὐτοῖς
  choice: de aconselhá-los
  rationale: Mantém o sentido lexical de dar conselho ou recomendar; a pressão coercitiva já é comunicada pelo contexto e pela designação «tirano».
- source_word: μιεροφαγῆσαι
  choice: a comer alimento que os tornaria impuros
  rationale: Explicita de maneira clara o efeito de impureza religiosa contido no raro verbo composto, sem especificar um alimento que o grego não identifica.
- source_word: πάντες ... διὰ μιᾶς φωνῆς ὁμοῦ
  choice: todos juntos, a uma só voz
  rationale: Reproduz tanto a totalidade e ação conjunta quanto a unidade da fala, em formulação natural e digna.
- source_word: ὥσπερ ἀπὸ τῆς αὐτῆς ψυχῆς
  choice: como se falassem da mesma alma
  rationale: Conserva a imagem antropológica de ψυχή e torna explícita em português a relação da alma com a fala, implícita no grego.
- source_word: εἶπον
  choice: disseram
  rationale: Verbo narrativo simples que introduz a fala direta do versículo seguinte.
theological_decisions:
- issue: Força cultual de μιεροφαγῆσαι
  choice: a comer alimento que os tornaria impuros
  alternative: a comer alimento impuro; a comer alimento contaminado; a praticar uma refeição profanadora
  rationale: A escolha comunica que o consumo produziria impureza religiosa segundo a lei, evitando tanto reduzir a expressão a sujeira física quanto definir além do que o grego afirma.
- issue: Nuance antropológica de ψυχή
  choice: como se falassem da mesma alma
  alternative: como se tivessem uma só mente; como se fossem uma só alma
  rationale: «Alma» preserva a imagem forte de uma única fonte interior e a unidade de resolução, sem restringir ψυχή ao aspecto cognitivo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «A uma só voz» mantém a solenidade natural; «alimento que os tornaria impuros» torna acessível o sentido cultual sem recorrer a jargão técnico. Os marcadores [a] e [b] aparecem no texto principal.
