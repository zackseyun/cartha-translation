  yaml_path: translation/deuterocanon/4_maccabees/008/016.yaml
  text: 'And through their blessed courage they brought down his tyranny. Yet let us consider this: if some among them had been fainthearted and unmanly, what words would they have used? Would it not have been these?'
translation:
  language: pt
  text: 'E, por sua nobreza[a], derrubaram a tirania dele. Contudo, pensemos: se alguns entre eles fossem covardes e sem coragem viril[b], que palavras teriam usado? Não seriam estas?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego é raro. Também pode ser entendido como “por sua condição abençoada” ou “por sua excelência digna de louvor”; talvez designe uma qualidade elogiável, e não uma bênção pronunciada.
    reason: lexical_alternative
  - marker: b
    text: O grego emprega um termo marcado pelo gênero, relacionado à ausência da coragem considerada masculina na retórica antiga; também pode ser traduzido como “sem coragem” ou “covardes”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῆς εὐλογιστίας
  choice: por sua coragem digna de louvor
  rationale: O substantivo grego é raro e parece indicar aqui uma qualidade moral elogiável pela qual os mártires resistiram à tirania. A formulação portuguesa conserva a força positiva do termo e, pelo contexto, explicita a coragem, enquanto a nota registra alternativas genuínas.
- source_word: τὴν τυραννίδα αὐτοῦ κατέλυσαν
  choice: derrubaram a tirania dele
  rationale: καταλύω descreve figuradamente a ruína ou destituição de um poder opressor. “Derrubaram” é corrente e vigoroso em português.
- source_word: καίτοι λογισώμεθα
  choice: Contudo, pensemos
  rationale: Mantém o contraste de καίτοι e o subjuntivo exortativo, introduzindo com naturalidade o experimento retórico.
- source_word: δειλόψυχοί
  choice: covardes
  rationale: O composto caracteriza pessoas de ânimo fraco ou medroso. “Covardes” comunica de modo claro e direto essa censura moral.
- source_word: ἄνανδροι
  choice: pouco viris
  rationale: A palavra grega é explicitamente marcada pelo gênero e significa literalmente algo como “não masculinos” ou “sem hombridade”. “Pouco viris” preserva a retórica antiga sem recorrer a uma formulação excessivamente obscura.
- source_word: λόγοις
  choice: palavras
  rationale: Neste contexto, λόγοις se refere ao que eles teriam dito. “Palavras” mantém a amplitude do termo e aponta para a fala subsequente.
- source_word: οὐχὶ τούτοις;
  choice: Não seriam estas?
  rationale: A pergunta retórica aponta adiante para as palavras que seguem e espera resposta afirmativa.
theological_decisions:
- issue: Linguagem de virtude marcada pelo gênero em ἄνανδροι
  choice: pouco viris
  alternative: sem coragem
  rationale: A linguagem do autor associa deliberadamente coragem e virilidade. A tradução preserva essa característica histórica e retórica, enquanto a nota oferece uma equivalência não marcada pelo gênero.
- issue: Sentido do raro substantivo εὐλογιστία
  choice: coragem digna de louvor
  alternative: nobreza; condição abençoada; excelência digna de louvor
  rationale: O contexto favorece uma qualidade moral elogiável ligada à resistência dos mártires, mas a raridade do termo impede certeza lexical. Por isso, a tradução contextual é acompanhada de nota que preserva a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com construção retórica concisa. “Pouco viris” preserva a marca cultural do original, e as notas registram as principais ambiguidades sem sobrecarregar o texto.
