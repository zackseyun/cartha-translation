  yaml_path: translation/deuterocanon/4_maccabees/008/015.yaml
  text: But when they heard the inducements and saw the tortures[a], they not only were not afraid, but even reasoned philosophically with the tyrant[c][b],
translation:
  language: pt
  text: Eles, porém, ao ouvirem as tentativas de persuasão[a] e verem as torturas[b], não só não tiveram medo, mas até responderam ao tirano com argumentos filosóficos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os incentivos”, “os apelos” ou “as seduções”. O termo grego indica tentativas de levá-los a ceder, antes das ameaças ou junto delas.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “coisas terríveis”; neste contexto, são os suplícios ou horrores postos diante deles.
    reason: lexical_alternative
  - marker: c
    text: O verbo grego pode ser traduzido mais literalmente por “filosofaram contra o tirano”; ele destaca a resistência racional e filosófica dos irmãos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγωγὰς
  choice: as tentativas de persuasão
  rationale: O substantivo indica meios empregados para levar alguém a ceder ou conquistá-lo. A expressão preserva a ideia de pressão persuasiva sem restringi-la a simples argumentação verbal.
- source_word: δεινά
  choice: as torturas
  rationale: O termo significa literalmente “coisas terríveis”, mas, no contexto imediato do martírio, refere-se concretamente aos suplícios apresentados aos irmãos.
- source_word: οὐ μόνον οὐκ ἐφοβήθησαν
  choice: não só não tiveram medo
  rationale: Mantém a estrutura enfática da negação grega em português natural e claro.
- source_word: ἀντεφιλοσόφησαν
  choice: responderam ... com argumentos filosóficos
  rationale: O raro verbo composto expressa uma resposta de caráter filosófico e adversativo. A formulação conserva o vocabulário filosófico central ao livro sem produzir uma construção artificial em português.
- source_word: τῷ τυράννῳ
  choice: ao tirano
  rationale: Preserva a designação moralmente carregada do grego, em vez de suavizá-la para “rei”.
theological_decisions:
- issue: Tradução da linguagem formada com φιλοσοφ- em 4 Macabeus
  choice: Manter uma referência explícita a argumentos filosóficos no texto principal
  alternative: Traduzir de modo mais genérico, como “argumentaram com o tirano”
  rationale: 4 Macabeus descreve intencionalmente a resistência dos mártires em termos de razão e filosofia. Uma tradução genérica apagaria um elemento importante da argumentação do livro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tentativas de persuasão” explicita o sentido sem pressupor o tipo exato de oferta; “torturas” torna concreto o referente contextual, enquanto a nota preserva a amplitude literal. A expressão “responderam ao tirano com argumentos filosóficos” mantém tanto a resposta adversativa quanto a ênfase filosófica do original.
