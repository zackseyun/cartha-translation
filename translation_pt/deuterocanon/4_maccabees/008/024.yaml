    text: 'Ou: “em nosso próprio instrumento de tortura”. O termo grego designa um instrumento de tortura, especialmente o potro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γλυκέος κόσμου
  choice: do doce mundo
  rationale: Mantém a metáfora do grego, na qual o mundo presente é apresentado como atraente e agradável, sem reduzi-la a «mundo querido» ou explicá-la como «vida mundana».
- source_word: μὴ βιαζώμεθα τὴν ἀνάγκην
  choice: Não forcemos a necessidade
  rationale: Conserva a formulação comprimida e incomum do grego, bem como sua ambiguidade entre forçar, apressar ou violentar aquilo que é necessário ou inevitável.
- source_word: μηδὲ κενοδοξήσωμεν
  choice: nem busquemos glória vã
  rationale: Expressa o componente de vaidade contido no verbo κενοδοξέω com linguagem portuguesa natural, em vez de reduzi-lo ao sentido mais geral de vangloriar-se.
- source_word: ἐπὶ τῇ ἑαυτῶν στρέβλῃ
  choice: em nosso próprio potro de tortura
  rationale: «Potro de tortura» identifica de modo claro o instrumento designado por στρέβλη; «nosso próprio» preserva o reflexivo enfático ἑαυτῶν.
theological_decisions:
- issue: Sentido da exortação μὴ βιαζώμεθα τὴν ἀνάγκην
  choice: Preservar literalmente a exortação como «Não forcemos a necessidade».
  alternative: Explicitar como «não apressemos o inevitável» ou entender como «não resistamos à necessidade».
  rationale: A expressão grega é condensada e admite mais de uma relação entre a ação humana e a provação inevitável. A tradução principal não decide silenciosamente se o verbo significa apressar, intensificar, resistir ou violentar o que a necessidade impõe.
- issue: Natureza da glória associada à tortura
  choice: Traduzir κενοδοξήσωμεν como «busquemos glória vã».
  alternative: «nos vangloriemos» ou «nos gloriemos».
  rationale: O verbo reprova especificamente a vanglória vazia. A escolha evita apresentar o sofrimento como fundamento legítimo de glória e mantém a advertência moral do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. O início fragmentário («do doce mundo») foi mantido porque o texto fornecido continua a frase do versículo anterior. A expressão deliberadamente incomum «forcemos a necessidade» preserva a ambiguidade do original e é esclarecida em nota.
