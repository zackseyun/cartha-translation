translation:
  language: pt
  text: do doce mundo. Não forcemos a necessidade[a], nem busquemos glória vã em nosso próprio potro de tortura[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não apressemos o inevitável” ou “não violentemos a necessidade”. A expressão grega é condensada e pode advertir contra precipitar a provação inevitável.'
