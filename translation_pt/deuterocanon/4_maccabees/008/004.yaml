  yaml_path: translation/deuterocanon/4_maccabees/008/004.yaml
  text: When the tyrant saw them surrounding their mother in the middle as if in a chorus[a], he was impressed by them, and astonished at their good bearing and noble birth, he smiled at them; and calling them near, he said[b],
translation:
  language: pt
  text: 'Quando o tirano os viu ao redor da mãe, que estava no centro, como num coro[a], ficou impressionado com eles. Admirado com a boa aparência e o porte deles, bem como com sua origem nobre, sorriu para eles e, chamando-os para perto, disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “como numa dança em roda”; o termo grego pode designar um coro e também o grupo disposto para uma dança coletiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς ἰδὼν
  choice: Quando [...] os viu
  rationale: O particípio aoristo tem valor temporal e introduz naturalmente a sequência narrativa em português.
- source_word: ὁ τύραννος
  choice: o tirano
  rationale: Preserva a designação moralmente carregada dada pelo autor ao governante perseguidor.
- source_word: καθάπερ ἐν χορῷ
  choice: como num coro
  rationale: Mantém a comparação grega e a imagem de um conjunto disposto de maneira coordenada, possivelmente em círculo.
- source_word: περιέχοντας μέσην τὴν μητέρα
  choice: ao redor da mãe, que estava no centro
  rationale: 'Expressa com naturalidade a disposição espacial: os filhos cercavam a mãe, situada no meio.'
- source_word: ᾔσθετο ἐπʼ αὐτοῖς
  choice: ficou impressionado com eles
  rationale: Comunica uma reação marcante sem impor a intensidade ainda mais forte explicitada pelo particípio seguinte.
- source_word: τῆς εὐπρεπείας
  choice: sua presença distinta
  rationale: Abrange a aparência digna e o bom porte sugeridos por εὐπρέπεια, em linguagem portuguesa atual.
- source_word: τῆς εὐγενίας
  choice: sua origem nobre
  rationale: Preserva o sentido provável de nobreza de nascimento ou linhagem, sem convertê-lo em virtude moral.
- source_word: ἐκπλαγεὶς
  choice: Admirado
  rationale: Transmite forte surpresa e admiração, mantendo fluidez e evitando repetição pesada com a oração anterior.
- source_word: προσεμειδίασεν αὐτοῖς
  choice: sorriu para eles
  rationale: É a formulação portuguesa direta e idiomática para o gesto dirigido a eles.
- source_word: πλησίον καλέσας
  choice: chamando-os para perto
  rationale: Reproduz de modo claro o particípio circunstancial que antecede a fala.
- source_word: ἔφη
  choice: disse
  rationale: Verbo narrativo simples e natural para introduzir discurso direto.
