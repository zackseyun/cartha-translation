  text: Then[a], becoming deeply agitated, he ordered that others from among the Hebrews of that age be brought in; and if they would eat meat from the thigh, to release those who were brought in, but if they objected[c][b], to torture them more severely.
translation:
  language: pt
  text: Então, profundamente agitado, ele ordenou que trouxessem outros dentre os hebreus da mesma faixa etária[a] e que, se comessem carne da coxa[b], os soltassem; mas, se contestassem, os torturassem ainda mais severamente[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “outros dentre os hebreus daquela idade”. O grego faz referência explícita à idade ou etapa da vida.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega significa literalmente “comer carne da coxa”; em razão do contexto, também é entendida como referência a comer carne de porco.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “mais amargamente”, isto é, de modo mais cruel ou severo.
    reason: lexical_alternative
lexical_decisions:
- source_word: σφόδρα περιπαθὼς
  choice: profundamente agitado
  rationale: Expressa a forte perturbação emocional indicada pelo grego sem especificá-la indevidamente como ira ou aflição.
- source_word: ἄλλους ἐκ τῆς ἡλικίας τῶν Ἑβραίων
  choice: outros hebreus da mesma faixa etária
  rationale: Torna explícita a referência de ἡλικία à idade ou etapa da vida e produz uma formulação natural em português.
- source_word: ἀγαγεῖν
  choice: que trouxessem
  rationale: Infinitivo dependente da ordem do governante; em contexto judicial, 'trouxessem' comunica naturalmente a apresentação dos jovens diante dele.
- source_word: μηροφαγοῖεν
  choice: comessem carne da coxa
  rationale: Preserva a forma incomum e concreta do composto grego ligado a μηρός, 'coxa', sem substituí-la silenciosamente pela interpretação contextual 'carne de porco'.
- source_word: ἀπολύειν ἀγώντας
  choice: deveriam soltar os que haviam sido trazidos
  rationale: A forma transmitida é sintaticamente difícil. A tradução segue o fluxo narrativo, entendendo como objeto da soltura as pessoas trazidas para a prova.
- source_word: ἀντιλέγοιεν
  choice: se protestassem
  rationale: O verbo significa falar contra, contestar ou objetar; 'protestassem' conserva o caráter verbal da resistência, embora a recusa esteja implícita.
- source_word: πικρότερον βασανίζειν
  choice: torturá-los com severidade ainda maior
  rationale: No contexto, o comparativo literalmente associado à ideia de amargura indica tortura mais cruel ou severa; a formulação portuguesa preserva claramente o aumento de intensidade.
theological_decisions:
- issue: Natureza da emoção do governante em περιπαθὼς
  choice: agitado, sem identificar uma emoção específica
  alternative: enfurecido ou profundamente aflito
  rationale: O grego indica forte comoção emocional, mas não obriga a escolher exclusivamente ira ou aflição.
- issue: Identificação do alimento em μηροφαγοῖεν
  choice: carne da coxa no texto, com a interpretação contextual em nota
  alternative: carne de porco
  rationale: A redação preserva a expressão incomum do testemunho grego e não resolve no corpo do texto uma identificação lexical discutível, embora o contexto de coerção alimentar favoreça a interpretação ligada à carne suína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção narrativa direta. As notas preservam a estranheza lexical e as ambiguidades reais do grego sem sobrecarregar o versículo.
