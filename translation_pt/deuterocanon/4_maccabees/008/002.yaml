    issue: “Protestassem” é um pouco mais marcado pragmaticamente que o grego ἀντιλέγοιεν.
    rationale: O verbo significa falar contra, contradizer ou objetar. “Contestassem” conserva a oposição verbal sem sugerir necessariamente uma manifestação pública.
