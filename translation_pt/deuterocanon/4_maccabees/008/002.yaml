  naturalness: O texto é claro e de registro apropriado. Uma única construção coordenada sob “ordenou que” melhora a fluidez, torna inequívoco quem deve soltar ou torturar e evita a leve mudança de modalidade causada por “deveriam”.
  terminology: “Profundamente agitado”, “hebreus”, “carne da coxa” e “torturassem ... mais severamente” são adequados. “Contestassem” reproduz de modo mais direto a resistência verbal de ἀντιλέγοιεν do que “protestassem”, sem reduzir o verbo a mera recusa.
