base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/011.yaml
  text: And I pity your beauty. Will you not consider this—that nothing lies before you[a], if you disobey, except to die amid tortures?
translation:
  language: pt
  text: 'E tenho pena da beleza de vocês. Não vão considerar isto: que, se desobedecerem, nada lhes está reservado além de morrer em meio a torturas?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “morrer com torturas”; a expressão indica uma morte acompanhada de torturas.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐμορφίας
  choice: beleza
  rationale: O substantivo indica beleza ou boa aparência física. “Beleza” é natural em português e preserva o apelo manipulador do rei à aparência dos jovens.
- source_word: οἰκτείρομαι
  choice: tenho pena
  rationale: O verbo expressa pena ou compaixão. A formulação mantém a concisão e o tom manipulador do discurso.
- source_word: διαλογιεῖσθε
  choice: vão considerar
  rationale: O verbo pode significar ponderar, refletir ou raciocinar. Na pergunta retórica, “vão considerar” comunica de modo idiomático a ideia de avaliar seriamente o resultado.
- source_word: ἀπειθήσασιν
  choice: se desobedecerem
  rationale: O particípio concorda com o pronome plural e descreve os destinatários em sua desobediência. A construção condicional é natural em português; não se acrescenta “a mim”, pois o objeto não está expresso no grego.
- source_word: ἀπόκειται
  choice: está reservado
  rationale: O verbo significa estar guardado ou reservado e, neste contexto, aponta para o destino que os aguarda.
- source_word: στρεβλῶν
  choice: torturas
  rationale: O termo pode designar tormentos ligados à torção ou instrumentos de tortura. “Torturas” transmite com clareza o sentido contextual sem restringi-lo indevidamente a um único método.
- source_word: ἀποθανεῖν
  choice: morrer
  rationale: O infinitivo significa simplesmente “morrer”; o modo terrível da morte é especificado pela expressão seguinte.
