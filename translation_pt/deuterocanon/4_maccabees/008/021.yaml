lexical_decisions:
- source_word: γῆρας
  choice: velhice
  rationale: O substantivo designa a velhice ou idade avançada. A tradução direta preserva o caráter abrupto do fragmento grego, sem completar interpretativamente a oração anterior.
- source_word: ἐνθυμηθῶμεν
  choice: consideremos
  rationale: O subjuntivo exortativo na primeira pessoa do plural pede uma forma como «consideremos», natural e suficientemente deliberativa em português.
- source_word: ἀπειθοῦντες
  choice: se desobedecermos
  rationale: Embora seja formalmente um particípio («desobedecendo»), o contexto lhe confere valor circunstancial condicional. A oração com «se» comunica esse sentido com clareza em português.
- source_word: τεθνηξόμεθα
  choice: morreremos
  rationale: O futuro de θνῄσκω expressa diretamente a consequência prevista; «morreremos» é claro, atual e fiel.
