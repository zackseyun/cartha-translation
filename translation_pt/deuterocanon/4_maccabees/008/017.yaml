base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/017.yaml
  text: Alas for us! How miserable and utterly foolish we are! When the king urges us and calls us to receive a benefit[a], should we not be persuaded by him?
translation:
  language: pt
  text: Ai de nós! Como somos miseráveis e totalmente insensatos! Quando o rei nos exorta e nos chama para receber um benefício, não deveríamos deixar-nos persuadir por ele?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não deveríamos obedecer-lhe?» O grego πεισθείημεν pode significar ser persuadido e, por extensão, ceder ou obedecer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ τάλανες ἡμεῖς
  choice: Ai de nós! Como somos miseráveis
  rationale: A exclamação «Ai de nós!» preserva o lamento de Ὦ, enquanto «miseráveis» expressa o sentido de desventura e infelicidade de τάλανες em português atual.
- source_word: λίαν ἀνόητοι
  choice: totalmente insensatos
  rationale: «Totalmente» conserva a forte intensificação de λίαν, e «insensatos» comunica a falta de entendimento indicada por ἀνόητοι em registro digno e natural.
- source_word: βασιλέως
  choice: o rei
  rationale: O contexto identifica um rei específico; por isso, o artigo definido é apropriado em português.
- source_word: παρακαλοῦντος
  choice: nos exorta
  rationale: Aqui παρακαλέω indica apelo ou incentivo insistente. «Exorta» preserva essa força sem especificar indevidamente súplica ou ordem.
- source_word: ἐπὶ εὐεργεσίᾳ φωνοῦντος
  choice: nos chama para receber um benefício
  rationale: A formulação torna natural em português a ideia de um chamado associado à concessão de um favor, sem ocultar que o benefício é a alegação ou oferta do rei.
- source_word: μὴ πεισθείημεν αὐτῷ;
  choice: não deveríamos deixar-nos persuadir por ele?
  rationale: A pergunta retórica espera resposta afirmativa. «Deixar-nos persuadir» conserva o sentido primário passivo de πείθομαι e permite, sem impor, a extensão contextual de ceder ou obedecer.
