  text: So comply, and you will receive ruling offices over my affairs, if you renounce the ancestral ordinance of your way of life.
translation:
  language: pt
  text: Portanto, acreditem em mim[a], e receberão cargos de autoridade na administração dos meus assuntos, se renunciarem à norma ancestral do modo de vida de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “confiem em mim”. No contexto, isso implica aceitar e acatar a proposta do rei.'
    reason: Preserva a amplitude de πιστεύσατε entre confiança declarada e aceitação prática no contexto coercitivo.
lexical_decisions:
- source_word: πιστεύσατε
  choice: acreditem em mim
  rationale: O verbo significa primariamente “crer” ou “confiar”. O complemento “em mim” fica implícito no discurso e produz uma formulação natural em português, sem reduzi-lo diretamente a “obedeçam” ou “cedam”.
- source_word: ἀρχὰς ... ἡγεμονικὰς
  choice: cargos de autoridade
  rationale: A expressão designa posições ou funções dirigentes; “cargos de autoridade” conserva tanto a ideia institucional de ἀρχάς como a função governante indicada por ἡγεμονικάς.
- source_word: ἐπὶ τῶν ἐμῶν πραγμάτων
  choice: na administração dos meus assuntos
  rationale: πράγματα pode referir-se a assuntos, negócios ou domínios do governante. A formulação escolhida mantém a referência ampla aos assuntos do rei e se liga naturalmente aos cargos prometidos.
- source_word: τὸν πάτριον ὑμῶν τῆς πολιτείας θεσμόν
  choice: a norma ancestral do modo de vida de vocês
  rationale: θεσμός é uma norma, ordenança ou instituição estabelecida; πολιτεία aqui abrange o modo de vida comunitário e religioso. A tradução evita restringir indevidamente a expressão apenas a uma lei isolada ou à cidadania política.
theological_decisions:
- issue: Força de πιστεύσατε no apelo coercitivo do rei
  choice: acreditem em mim, com nota explicativa
  alternative: obedeçam; cedam; acatem
  rationale: Embora o contexto possa implicar aceitação prática da proposta, o verbo grego conserva a linguagem de crer ou confiar. A tradução mantém esse valor lexical e a nota registra a implicação contextual sem substituir o sentido por uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com construção compreensível tanto no Brasil como em outros contextos lusófonos. “Modo de vida” comunica a amplitude social e religiosa de πολιτεία sem jargão técnico.
