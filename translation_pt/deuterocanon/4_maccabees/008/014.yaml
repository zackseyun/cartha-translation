  text: But the tyrant interrupted and said[a], “Young men, be afraid, and the justice you revere will be merciful to you if, under compulsion, you break the law.”
translation:
  language: pt
  text: 'Puseram-nos diante deles. Mas o tirano tomou a palavra e disse: “Jovens, tenham medo! A justiça[a] que vocês reverenciam será favorável a vocês, se transgredirem a lei sob coação.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o juízo” ou “a punição”. O termo grego δίκη pode significar justiça, juízo ou punição.
    reason: lexical_alternative
lexical_decisions:
- source_word: προέθεσαν
  choice: Puseram-nos diante deles
  rationale: O aoristo indica que sujeitos não expressos apresentaram ou colocaram diante dos jovens os objetos mencionados no contexto anterior. Os pronomes necessários em português deixam essa referência contextual sem nomeá-la além do que o grego permite.
- source_word: ὑπολαβών
  choice: tomou a palavra
  rationale: Em diálogo narrativo, o particípio pode indicar que alguém retoma ou assume a fala, por vezes interrompendo. “Tomou a palavra” é natural e não afirma com certeza uma interrupção que o verbo, isoladamente, não exige.
- source_word: τύραννος
  choice: tirano
  rationale: Preserva a caracterização moralmente negativa do governante, em vez de neutralizá-la como “rei” ou “governante”.
- source_word: Μειράκια
  choice: Jovens
  rationale: Vocativo dirigido aos irmãos ainda jovens; é corrente em português e evita o sentido infantil de “meninos”.
- source_word: φοβήθητε
  choice: tenham medo
  rationale: Reproduz diretamente a força exortativa do imperativo aoristo.
- source_word: δίκην
  choice: justiça
  rationale: Com ἣν σέβεσθε, “justiça” expressa melhor aquilo que os jovens reverenciam, embora o substantivo também possa significar juízo ou punição; a ambiguidade é registrada em nota.
- source_word: σέβεσθε
  choice: vocês reverenciam
  rationale: Mantém o sentido de respeito religioso ou moral sem intensificá-lo necessariamente como culto formal.
- source_word: ἵλεως
  choice: será favorável a vocês
  rationale: Expressa a disposição benigna ou propícia indicada pelo adjetivo, sem impor que δίκη seja uma pessoa que demonstra misericórdia.
- source_word: διʼ ἀνάγκην
  choice: sob coação
  rationale: Indica pressão externa e compulsória como circunstância atenuante alegada pelo tirano.
- source_word: παρανομήσασιν
  choice: se transgredirem a lei
  rationale: O particípio aoristo dativo concorda com ὑμῖν e descreve os destinatários como transgressores sob coação. A oração condicional comunica naturalmente em português a lógica persuasiva da fala.
theological_decisions:
- issue: Sentido de δίκη no apelo moral do tirano
  choice: justiça
  alternative: juízo; punição
  rationale: A construção “que vocês reverenciam” favorece a noção de ordem ou justiça moral, mas o campo semântico grego permite também juízo ou punição. A tradução principal mantém “justiça” e a nota preserva as demais possibilidades.
- issue: Natureza da alegada indulgência por transgressão forçada
  choice: A fala é mantida como argumento do tirano, sem endossá-la nem explicá-la teologicamente.
  alternative: Explicitar que Deus perdoaria uma infração cometida à força.
  rationale: O texto apresenta uma tentativa persuasiva do tirano. Torná-la uma afirmação doutrinária objetiva eliminaria a tensão narrativa e acrescentaria uma identificação de δίκη com Deus que não está expressa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para clareza internacional e boa legibilidade brasileira. A abertura preserva προέθεσαν, ausente na camada inglesa fornecida, e “tomou a palavra” evita afirmar uma interrupção inequívoca.
