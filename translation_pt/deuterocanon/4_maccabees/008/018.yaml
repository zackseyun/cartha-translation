base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/018.yaml
  text: Why do we delight ourselves in empty schemes and dare a death-bringing disobedience?[a][b]
translation:
  language: pt
  text: Por que nos alegramos com planos vazios[a] e ousamos cometer uma desobediência que traz a morte?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “propósitos vãos” ou “planos inúteis”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “desobediência portadora de morte”; também se pode traduzir por “desobediência mortífera”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: Por que
  rationale: Na pergunta retórica, τί tem força de repreensão e pergunta pela razão da conduta, sendo naturalmente expresso por “Por que”.
- source_word: βουλήμασιν κενοῖς
  choice: com planos vazios
  rationale: βουλήμασιν designa planos, propósitos ou resoluções, enquanto κενοῖς os caracteriza como destituídos de conteúdo ou valor. “Planos vazios” preserva a imagem e soa claro em português atual.
- source_word: ἑαυτοὺς εὐφραινόμεν
  choice: nos alegramos
  rationale: A expressão reflexiva indica alegrar a si mesmo ou sentir prazer; “nos alegramos” conserva o valor reflexivo e a ironia moral do contexto.
- source_word: θανατηφόρον
  choice: que traz a morte
  rationale: O composto significa literalmente aquilo que porta ou produz morte. A formulação explicita essa imagem em português natural, sem reduzi-la apenas a “grave”.
- source_word: ἀπειθίαν
  choice: desobediência
  rationale: O substantivo indica recusa em obedecer. “Desobediência” é a correspondência direta e evita intensificações interpretativas como “rebelião”.
- source_word: τολμῶμεν
  choice: ousamos cometer
  rationale: τολμῶμεν exprime a audácia de empreender algo. Como o português não emprega naturalmente “ousar” seguido apenas de um substantivo nesse sentido, “cometer” torna explícita a ação implícita sem alterar seu conteúdo.
theological_decisions:
- issue: Caracterização moral de ἀπειθία
  choice: desobediência
  alternative: rebelião; desafio
  rationale: O texto condena a recusa de obedecer e associa essa conduta à morte, mas o termo grego não exige uma formulação teologicamente mais carregada. “Desobediência” preserva a advertência sem acrescentar nuance doutrinária.
- issue: Relação de θανατηφόρον com a morte
  choice: que traz a morte
  alternative: mortal; mortífera
  rationale: A tradução mantém a relação causal ou resultante expressa pelo composto grego, sem definir além do texto a natureza exata dessa morte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta retórica mantém seu tom de censura; a construção nominal “desobediência” e a imagem de algo que traz a morte foram preservadas.
