  yaml_path: translation/deuterocanon/4_maccabees/008/022.yaml
  text: But divine justice will also pardon us if[a], under compulsion, we become afraid of the king.
translation:
  language: pt
  text: Mas a justiça divina também nos perdoará[a], pois, sob coação, tivemos medo do rei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o julgamento divino também nos perdoará” ou “a punição divina também nos poupará”. A palavra grega δίκη pode significar justiça, julgamento ou punição.
    reason: lexical_alternative
lexical_decisions:
- source_word: συγγνώσεται
  choice: perdoará
  rationale: O futuro médio comunica a ideia de conceder perdão ou levar em consideração as circunstâncias; “perdoará” é natural no contexto moral e judicial.
- source_word: ἡ θεία δίκη
  choice: a justiça divina
  rationale: δίκη pode significar justiça, julgamento ou punição. “A justiça divina” conserva a amplitude semântica e a personificação presente na frase.
- source_word: διʼ ἀνάγκην
  choice: sob coação
  rationale: A expressão indica que a ação ocorreu por força de necessidade ou constrangimento externo; “sob coação” expressa isso de modo claro e conciso.
- source_word: τὸν βασιλέα
  choice: do rei
  rationale: βασιλεύς significa diretamente “rei” neste contexto.
- source_word: φοβηθεῖσιν
  choice: termos ... ficado com medo
  rationale: O particípio aoristo passivo, concordando com ἡμῖν, apresenta os destinatários como tomados de medo; a construção com infinitivo flexionado reproduz naturalmente em português a relação circunstancial com o verbo principal.
theological_decisions:
- issue: Se δίκη deve ser entendida no sentido punitivo de “julgamento/punição” ou no sentido mais amplo de “justiça”
  choice: a justiça divina
  alternative: o julgamento divino; a punição divina
  rationale: A formulação mais ampla preserva a tensão de uma justiça divina que pode conceder perdão levando em conta a coação, sem restringir δίκη a uma pena punitiva.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A formulação mantém a relação causal de διʼ ἀνάγκην e evita transformar a frase em uma condição hipotética não explicitada pelo grego.
