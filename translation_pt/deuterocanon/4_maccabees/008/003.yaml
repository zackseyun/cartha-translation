base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/003.yaml
  text: When the tyrant had given these orders[a], seven brothers were brought in with their aged mother[b], handsome and modest and noble and gracious in every way.
translation:
  language: pt
  text: Depois que o tirano deu essas ordens, sete irmãos foram trazidos[a] juntamente com sua mãe idosa; eram belos, modestos, nobres e encantadores em todos os aspectos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “compareceram enquanto eram conduzidos”; o grego combina a chegada deles com o fato de estarem sendo levados.
    reason: lexical_alternative
  - marker: b
    text: Ou “graciosos em todos os sentidos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα διαταξαμένου
  choice: Depois que ... deu essas ordens
  rationale: O genitivo absoluto indica uma ação anterior à chegada dos irmãos. “Deu essas ordens” expressa com naturalidade a força autoritativa de διατάσσω.
- source_word: τοῦ τυράννου
  choice: o tirano
  rationale: τύραννος é uma designação moralmente carregada no discurso da obra; “tirano” preserva essa avaliação, ao contrário de títulos neutros como “rei” ou “governante”.
- source_word: παρῆσαν ἀγόμενοι
  choice: foram levados à presença dele
  rationale: A construção reúne a chegada ou comparecimento com o fato de estarem sendo conduzidos. A forma escolhida preserva a passividade e sugere a condução compulsória sem reproduzir de modo artificial a sintaxe grega.
- source_word: μετὰ γεραιᾶς μητρός
  choice: com a mãe já idosa
  rationale: γεραιός indica idade avançada. “Já idosa” é atual, respeitoso e compatível com o tom solene.
- source_word: ἑπτὰ ἀδελφοί
  choice: sete irmãos
  rationale: O substantivo está no masculino plural e, no contexto, designa sete filhos homens da mesma mãe.
- source_word: καλοί
  choice: belos
  rationale: Na enumeração de qualidades pessoais, καλός provavelmente aponta primeiro para a boa aparência, embora possa ter sentido mais amplo. “Belos” mantém a concisão e a dignidade.
- source_word: αἰδήμονες
  choice: modestos
  rationale: O termo descreve pudor, recato e senso de decoro. “Modestos” comunica essa qualidade ética e social em português corrente.
- source_word: γενναῖοι
  choice: nobres
  rationale: γενναῖος pode abranger nobreza de origem, caráter elevado e coragem. “Nobres” mantém a amplitude do termo sem antecipar exclusivamente a bravura demonstrada depois.
- source_word: ἐν παντὶ χαρίεντες
  choice: agradáveis em todos os aspectos
  rationale: χαρίεις expressa encanto, graça ou uma qualidade cativante. “Agradáveis” é natural e evita a possível leitura teológica de “cheios de graça”; “em todos os aspectos” preserva a abrangência de ἐν παντί.
theological_decisions:
- issue: Caracterização retórica de Antíoco como τύραννος
  choice: o tirano
  alternative: o rei; o governante
  rationale: O texto emprega uma designação avaliativa, não um título político neutro. Mantê-la conserva a perspectiva moral do autor sem acrescentar uma interpretação externa.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A ordem descritiva do grego foi preservada, assim como o tom moralmente carregado de “tirano” e a amplitude das qualidades atribuídas aos irmãos.
