  text: But the young men[a], who were about to be tortured, said none of these things, nor did they even think them.
translation:
  language: pt
  text: Mas os jovens, que estavam prestes a ser torturados, não disseram nada disso, nem sequer pensaram nisso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem sequer cogitaram essas coisas”. O verbo grego pode significar pensar em algo ou considerá-lo interiormente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Introduz um contraste forte com o contexto anterior de modo natural em português.
- source_word: τούτων οὐδὲν
  choice: nada disso
  rationale: Retoma de forma idiomática as palavras ou ideias mencionadas anteriormente.
- source_word: οἱ νεανίαι
  choice: os jovens
  rationale: Designa os rapazes ou homens jovens com linguagem atual, clara e não excessivamente marcada.
- source_word: βασανίζεσθαι μέλλοντες
  choice: que estavam prestes a ser torturados
  rationale: A construção com μέλλω indica ação iminente, e o contexto de violência física judicial exige a força de 'torturados'.
- source_word: εἶπον
  choice: disseram
  rationale: Equivalente narrativo direto e natural do aoristo de λέγω.
- source_word: οὐδὲ ἐνεθυμήθησαν
  choice: nem sequer pensaram nisso
  rationale: Preserva a progressão enfática entre não dizer e nem mesmo conceber interiormente, mantendo em português a referência implícita a τούτων.
theological_decisions:
- issue: Intensidade de βασανίζεσθαι no contexto de martírio
  choice: torturados
  alternative: atormentados; submetidos à prova
  rationale: O contexto descreve violência física deliberada, por isso 'torturados' comunica a gravidade do termo sem acrescentar interpretação doutrinária.
- issue: Alcance mental de ἐνεθυμήθησαν
  choice: pensaram nisso
  alternative: cogitaram essas coisas; alimentaram tais pensamentos
  rationale: A formulação principal conserva a concisão e a ambiguidade lexical; a nota explicita que o verbo também pode indicar considerar ou acolher algo interiormente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi ajustada à sintaxe natural do português sem enfraquecer o contraste nem a progressão enfática do grego.
