base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/026.yaml
  text: Why has such contentiousness been instilled in us[a], and why does deadly endurance please us, when it is possible to live in tranquility by obeying the king, after becoming afraid of the tortures that lead to death?
translation:
  language: pt
  text: Por que se arraigou em nós tamanha disposição para a contenda[a], e por que nos agrada essa perseverança mortal, quando podemos viver tranquilos se obedecermos ao rei por medo das torturas que levam à morte?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A abertura do versículo é sintaticamente difícil no testemunho grego de Swete. O sentido parece ser que eles poderiam viver tranquilos se cedessem ao rei por medo das torturas que levam à morte.
    reason: textual_variant
lexical_decisions:
- source_word: πόθεν
  choice: Por que
  rationale: Introduz uma pergunta retórica sobre a causa ou origem da atitude; “Por que” é natural em português e preserva essa força causal.
- source_word: ἡ τοσαύτη ἐντέτηκεν φιλονεικία
  choice: se arraigou em nós tamanho espírito de contenda
  rationale: φιλονεικία expressa inclinação para disputa ou contenda, enquanto ἐντέτηκεν descreve uma disposição profundamente fixada. A formulação mantém o tom depreciativo do discurso sem reduzir a expressão à mera coragem.
- source_word: ἡ θανατηφόρος ... καρτερία
  choice: essa perseverança mortal
  rationale: καρτερία denota perseverança ou firmeza, e θανατηφόρος, aquilo que traz ou conduz à morte. “Mortal” conserva a concisão e alguma ambiguidade do grego.
- source_word: ἀρέσκει
  choice: nos agrada
  rationale: Mantém o sentido pessoal de algo que parece atraente ou satisfatório aos interlocutores.
- source_word: παρὸν
  choice: quando podemos
  rationale: Expressa a possibilidade disponível e introduz com naturalidade o contraste retórico.
- source_word: μετὰ ἀταραξίας ζῆν
  choice: viver tranquilos
  rationale: ἀταραξία indica ausência de perturbação; a expressão é corrente e conserva o sentido sem impor terminologia filosófica técnica.
- source_word: τῷ βασιλεῖ πεισθέντας
  choice: obedecendo ao rei
  rationale: Com o dativo da pessoa, πείθομαι pode significar dar ouvidos, ceder ou obedecer. No contexto da ordem real, “obedecendo” comunica adequadamente a submissão prática.
- source_word: θανατοῖ φοβηθέντας τὰ βασανιστήρια
  choice: por medo das torturas que levam à morte
  rationale: A construção preservada em Swete é sintaticamente difícil. A tradução comunica o sentido contextual provável — ceder ao rei por temor das torturas associadas à morte — sem propor uma reconstrução textual específica.
theological_decisions:
- issue: Caracterização da firmeza dos irmãos na fala do rei
  choice: Manter a retórica hostil em “espírito de contenda” e “perseverança mortal”.
  alternative: Empregar termos positivos como “zelo”, “coragem” ou “firmeza até a morte”.
  rationale: O rei procura desqualificar a resistência dos irmãos. A tradução deve preservar a perspectiva negativa do personagem, sem substituí-la pela avaliação favorável do narrador ou da obra como um todo.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A ordem da oração foi ajustada para clareza, preservando a dificuldade textual em nota e o tom depreciativo da fala.
