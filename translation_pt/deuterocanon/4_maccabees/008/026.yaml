  to: Por que se arraigou em nós tamanha disposição para a contenda[a], e por que nos agrada essa perseverança mortal, quando podemos viver tranquilos se obedecermos ao rei por medo das torturas que levam à morte?
  rationale: A revisão melhora a naturalidade de φιλονεικία e torna explícita a condição implícita na possibilidade de viver tranquilamente, preservando a ambiguidade sintática assinalada na nota e a retórica hostil do rei.
