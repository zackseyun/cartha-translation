base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/006.yaml
  text: I urge you, by agreeing with me, to enjoy my friendship[a]; for just as I have power to punish those who disobey my commands[b], so also to do good to those who obey me well.
translation:
  language: pt
  text: Exorto-os a desfrutar da minha amizade[b], concordando comigo[a]; pois tenho poder tanto para punir os que desobedecem às minhas ordens como para beneficiar os que prontamente me obedecem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cedendo a mim” ou “anuindo ao que digo”. O particípio grego é de interpretação um tanto difícil, mas claramente pede que os ouvintes se submetam à vontade de quem fala.
    reason: lexical_alternative
  - marker: b
    text: Neste contexto régio, “minha amizade” também pode ser entendida como “meu favor”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶ
  choice: Eu os exorto
  rationale: No contexto de uma fala régia, expressa um apelo insistente e autoritativo, não um simples pedido.
- source_word: συνείξαντάς μοι
  choice: ao cederem a mim
  rationale: O particípio é lexicalmente difícil, mas indica anuência, submissão ou conformidade com o governante. A formulação preserva sua função circunstancial sem transformá-lo em uma ordem independente.
- source_word: τῆς ἐμῆς ἀπολαῦσαι φιλίας
  choice: desfrutarem da minha amizade
  rationale: ἀπολαύω comunica desfrutar ou beneficiar-se de algo, enquanto φιλία conserva tanto o sentido pessoal de amizade quanto, neste contexto régio, a conotação de favor patronal.
- source_word: δύναμιν
  choice: tenho poder
  rationale: A construção elíptica afirma capacidade efetiva sustentada pela posição régia; “poder” abrange tanto capacidade quanto autoridade.
- source_word: κολάζειν
  choice: punir
  rationale: O contexto contrasta sanção régia e concessão de benefícios, tornando “punir” a opção mais direta.
- source_word: τοὺς ἀπειθοῦντάς μου τοῖς ἐπιτάγμασιν
  choice: os que desobedecem às minhas ordens
  rationale: ἀπειθέω com o dativo exprime recusa em obedecer, e ἐπιτάγματα são ordens ou determinações impostas.
- source_word: εὐεργετεῖν
  choice: beneficiar
  rationale: O verbo significa fazer o bem ou conferir benefícios, sem especificar que forma eles assumem.
- source_word: τοὺς εὐπειθοῦντάς μου
  choice: os que prontamente me obedecem
  rationale: “Prontamente” representa a nuance intensificadora de εὐ- e descreve obediência solícita, sem acrescentar uma recompensa explícita.
theological_decisions:
- issue: Natureza da φιλία oferecida pelo governante
  choice: amizade
  alternative: favor
  rationale: “Amizade” preserva o sentido lexical direto e a forma pessoal da oferta, enquanto a nota reconhece sua dimensão régia e patronal sem a impor como único sentido.
- issue: Força de συνείξαντάς μοι
  choice: cederem a mim
  alternative: concordarem comigo; anuírem a mim
  rationale: A expressão pede conformidade com o governante, mas seu matiz exato permanece incerto. O texto principal explicita a pressão de submissão, e a nota conserva alternativas menos fortes.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe de ampla compreensão no Brasil e em outros contextos lusófonos. O paralelismo entre punir e beneficiar foi explicitado com a repetição de “tenho poder”, natural em português e coerente com a elipse grega.
