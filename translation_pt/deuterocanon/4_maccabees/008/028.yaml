  text: For they were contemptuous of sufferings[b][a], and masters of pains.
translation:
  language: pt
  text: Pois eles desdenhavam os sofrimentos[a] e dominavam as dores[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “olhavam com desprezo para os sofrimentos”. O termo grego é forte e indica menosprezar os sofrimentos, não apenas suportá-los.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “eram senhores das dores” ou “tinham controle sobre as dores”. O grego ressalta domínio ou poder sobre a dor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περίφρονες
  choice: desdenhavam
  rationale: O adjetivo expressa uma atitude forte de olhar de cima ou tratar com desprezo. A forma verbal produz português natural sem enfraquecer essa força.
- source_word: τῶν παθῶν
  choice: os sofrimentos
  rationale: No contexto do martírio, πάθη designa sofrimentos suportados, não paixões interiores.
- source_word: αὐτοκράτορες
  choice: dominavam
  rationale: O termo comunica domínio efetivo ou controle. “Dominavam” preserva essa ideia em linguagem corrente e digna.
- source_word: τῶν ἀλγηδόνων
  choice: as dores
  rationale: ἀλγηδών se refere diretamente à dor, sobretudo corporal; “dores” evita intensificar o texto para “tormentos” ou “agonias”.
theological_decisions:
- issue: Relação entre domínio próprio e sofrimento corporal no contexto do martírio
  choice: A tradução afirma que eles desprezavam os sofrimentos e exerciam domínio sobre as dores, sem explicar filosoficamente como isso ocorria.
  alternative: Expandir a frase para destacar impassibilidade de caráter estoico ou o triunfo da razão sobre as paixões.
  rationale: O grego é conciso e descritivo. Convém preservar sua afirmação sobre resistência e domínio sem introduzir um sistema filosófico ou doutrinário que esta frase não explicita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura verbal paralela torna naturais em português os dois adjetivos gregos, preservando a força de desprezo e domínio.
