  yaml_path: translation/deuterocanon/4_maccabees/008/010.yaml
  text: Therefore have pity on yourselves[a], on whom even I, your enemy, have pity because of your age.
translation:
  language: pt
  text: Portanto, tenham compaixão de vocês mesmos, pois até eu, seu inimigo, tenho compaixão de vocês por causa da idade de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «por causa da juventude de vocês». O termo grego pode referir-se mais especificamente à etapa da vida.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελεήσατε
  choice: tenham compaixão
  rationale: O imperativo aoristo faz um apelo direto a um ato de compaixão; a expressão é natural, digna e preserva a força emotiva.
- source_word: ἑαυτούς
  choice: de si mesmos
  rationale: Mantém o sentido reflexivo de compaixão dirigida à própria pessoa.
- source_word: οὓς
  choice: de vocês, de quem
  rationale: Retoma enfaticamente os destinatários e conserva a construção relativa do grego, embora com explicitação necessária para clareza em português.
- source_word: ὁ πολέμιος
  choice: seu inimigo
  rationale: Embora literalmente seja «o inimigo», o contexto identifica o falante como inimigo dos destinatários; o possessivo torna explícita essa relação implícita.
- source_word: ἔγωγε
  choice: até eu
  rationale: 'Reproduz a ênfase retórica: até mesmo o falante, apesar de inimigo, afirma ter compaixão deles.'
- source_word: τῆς ἡλικίας
  choice: por causa da idade
  rationale: Preserva o sentido amplo de ἡλικία sem restringi-lo indevidamente a «juventude»; a nuance contextual mais específica fica na nota.
theological_decisions:
- issue: Nuance específica de ἡλικία
  choice: por causa da idade
  alternative: por causa da juventude
  rationale: O termo grego pode indicar idade ou etapa da vida e, no contexto, talvez enfatize a juventude. O texto principal mantém a amplitude lexical, sem resolver além da evidência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A duplicação «de si mesmos, de vocês, de quem» procura preservar a retomada relativa do grego, embora produza uma sintaxe deliberadamente formal.
