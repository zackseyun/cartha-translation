base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/012.yaml
  text: And as he said these things[a], he ordered the instruments of torture to be brought forward, so that even through fear he might persuade them to eat defiled food.
translation:
  language: pt
  text: Enquanto dizia essas coisas, ele ordenou que os instrumentos de tortura fossem postos à vista, a fim de persuadi-los, até mesmo pelo medo, a comer alimentos impuros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a comer alimentos contaminados”. O verbo grego indica comer algo que causa impureza ou contaminação, especialmente em sentido religioso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα δὲ λέγων
  choice: Enquanto dizia essas coisas
  rationale: A construção participial expressa simultaneidade com o verbo principal; esta formulação é natural em português e preserva a ligação temporal.
- source_word: ἐκέλευσεν
  choice: ele ordenou
  rationale: Expressa de modo direto e corrente a emissão de uma ordem.
- source_word: εἰς τὸ ἔμπροσθεν προτεθῆναι
  choice: que fossem colocados diante deles
  rationale: Comunica que os objetos deveriam ser postos à vista, à frente dos irmãos; o complemento 'deles' fica implícito no contexto grego e torna a cena clara em português.
- source_word: τὰ βασανιστήρια
  choice: os instrumentos de tortura
  rationale: O substantivo pode designar os meios ou aparelhos empregados para torturar, e não apenas os sofrimentos abstratos.
- source_word: ὅπως
  choice: a fim de
  rationale: Introduz claramente a finalidade da ordem.
- source_word: καὶ διὰ τοῦ φόβου
  choice: até mesmo pelo medo
  rationale: O καί tem valor intensificador neste contexto de escalada da pressão, enquanto διά indica o meio empregado.
- source_word: πείσειεν
  choice: persuadi-los
  rationale: Preserva o sentido normal de πείθω, 'persuadir', sem substituí-lo por 'forçar', embora o contexto seja coercitivo.
- source_word: μιεροφαγῆσαι
  choice: a comer alimentos impuros
  rationale: O verbo composto descreve comer aquilo que contamina ou torna impuro, especialmente no contexto da transgressão das normas alimentares judaicas. A formulação é clara e conserva a dimensão religiosa da impureza.
theological_decisions:
- issue: Sentido de μιεροφαγῆσαι no contexto do martírio judaico
  choice: a comer alimentos impuros
  alternative: a comer alimentos contaminados; a comer aquilo que os tornaria impuros
  rationale: A escolha preserva a ideia de impureza religiosa e moral sem limitar indevidamente o verbo a uma terminologia ritual técnica. A nota registra a nuance de alimento que contamina quem o consome.
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe mantém a progressão do grego: fala, ordem de exibir os instrumentos e finalidade intimidatória. O pronome explícito ''ele'' favorece a clareza isolada do versículo.'
