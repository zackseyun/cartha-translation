  footnotes:
  - marker: a
    text: 'O texto grego preservado deste versículo parece incompleto: termina com “e privamos a nós mesmos”, sem dizer de que se privam. Por isso, a tradução acompanha de perto o texto existente e deixa a frase inacabada, sem acrescentar conteúdo por conjectura.'
