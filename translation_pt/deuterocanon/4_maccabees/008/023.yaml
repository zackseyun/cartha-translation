lexical_decisions:
- source_word: τί
  choice: Por que
  rationale: Neste contexto de pergunta retórica deliberativa, τί tem naturalmente o sentido de “por que?”, não o de um simples “o quê?”.
- source_word: ἐξάγομεν ἑαυτοὺς
  choice: nos afastamos
  rationale: ἐξάγω significa literalmente “conduzir para fora”. Com o pronome reflexivo, “nos afastamos” expressa em português natural a ideia de retirar a si mesmo de uma condição ou esfera, sem ampliar o sentido.
- source_word: τοῦ ἡδίστου βίου
  choice: da vida mais agradável
  rationale: ἡδίστου é o superlativo de “agradável, prazeroso, doce”, e βίου designa a vida ou condição de vida. A formulação mantém o superlativo e permanece clara.
- source_word: καὶ
  choice: e
  rationale: Conserva a coordenação simples entre os dois verbos.
- source_word: ἀποστεροῦμεν ἑαυτοὺς
  choice: privamos a nós mesmos
  rationale: ἀποστερέω pode significar “privar, despojar, defraudar”. A construção enfática “a nós mesmos” preserva o objeto reflexivo expresso no grego e deixa perceptível que falta o complemento da privação.
