lexical_decisions:
- source_word: μεταλαβόντες
  choice: tendo adotado
  rationale: O particípio aoristo indica uma ação anterior ou concomitante à do contexto. Embora μεταλαμβάνω possa significar “participar de”, com o genitivo βίου comunica aqui a entrada ou adesão a determinada maneira de viver; “tendo adotado” expressa isso naturalmente.
- source_word: Ἑλληνικοῦ
  choice: grego
  rationale: O adjetivo designa aquilo que é grego ou helênico. “Grego” é a forma corrente, clara e não técnica em português.
- source_word: βίου
  choice: modo de vida
  rationale: Neste contexto, βίος se refere à maneira cultural e prática de viver, não apenas à vida em sentido biológico. “Modo de vida” conserva esse valor sem o tom excessivamente contemporâneo de “estilo de vida”.
