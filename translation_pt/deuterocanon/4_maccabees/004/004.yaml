  text: When Apollonius learned each of these things[a], he praised Simon for his loyalty to the king, but went up to Seleucus and reported the treasury of funds;
translation:
  language: pt
  text: Ao tomar conhecimento de cada uma dessas coisas, Apolônio elogiou Simão por seu zelo pelo rei; mas subiu até Seleuco e o informou sobre o tesouro de dinheiro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “relatou a Seleuco o tesouro de dinheiro”. O verbo grego pode significar informar ou relatar e, conforme o contexto, pode ter tom de denúncia. A expressão também pode ser traduzida mais literalmente como “o tesouro de dinheiro”.'
    reason: Preserva a alternativa lexical de κατήμηνυε sem impor uma acusação, e explicita a referência financeira concreta de τὸν τῶν χρημάτων θησαυρόν.
lexical_decisions:
- source_word: τούτων ἕκαστα γνούς
  choice: Depois de tomar conhecimento de cada uma dessas coisas
  rationale: Expressa o valor circunstancial do particípio aoristo γνούς e conserva o sentido distributivo de τούτων ἕκαστα, em português natural.
- source_word: ὁ Ἀπολλώνιος
  choice: Apolônio
  rationale: Forma portuguesa corrente do nome grego.
- source_word: τὴν ... Σίμωνι τῆς εἰς τὸν βασιλέα κηδεμονίας
  choice: Simão por seu zelo pelo rei
  rationale: κηδεμονία denota cuidado, solicitude ou dedicação. “Zelo” preserva essa ideia sem impor o sentido mais específico de tutela nem afirmar inequivocamente uma lealdade interior.
- source_word: ἐπαινεί
  choice: elogiou
  rationale: O presente histórico grego é vertido pelo pretérito perfeito, adequado à narrativa em português.
- source_word: πρὸς δὲ τὸν Σέλευκον ἀναβάς
  choice: mas subiu até Seleuco
  rationale: Mantém o contraste de δέ e o sentido espacial de ἀναβαίνω sem acrescentar uma explicação geográfica ausente do texto.
- source_word: κατήμηνυε
  choice: o informou sobre
  rationale: Traduz o ato de dar informação ou fazer uma comunicação, sem impor necessariamente o tom acusatório que o verbo também pode assumir.
- source_word: τὸν τῶν χρημάτων θησαυρόν
  choice: o tesouro de recursos
  rationale: “Tesouro” preserva θησαυρός como depósito ou reserva, e “recursos” comunica o valor financeiro amplo de χρήματα sem restringi-lo apenas a moedas.
- source_word: Σίμωνι / Σέλευκον
  choice: Simão / Seleuco
  rationale: Formas portuguesas tradicionais e reconhecíveis dos nomes próprios.
