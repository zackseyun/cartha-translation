revisions:
- from: Pois certo Simão, que fazia oposição a Onias — o homem que anteriormente exercera o sumo sacerdócio por toda a vida, homem nobre e bom —, depois de não conseguir prejudicá-lo em questões relativas à nação, embora o caluniasse de todas as maneiras, partiu como exilado[a], com a intenção de trair a própria pátria.
  to: Pois certo Simão, que fazia oposição a Onias — o homem que anteriormente exercera o sumo sacerdócio por toda a vida, homem nobre e bom —, como não conseguia prejudicá-lo em questões relativas à nação, embora o caluniasse de todas as maneiras, partiu como exilado[a], com a intenção de trair a própria pátria.
