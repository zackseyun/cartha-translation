  yaml_path: translation/deuterocanon/4_maccabees/004/001.yaml
  text: For a certain Simon[a], opposing Onias, who had once held the high priesthood for life, a noble and good man, when he was unable, though slandering him in every way, to harm him on behalf of the nation, went away as an exile[b], intending to betray his homeland.
translation:
  language: pt
  text: Pois certo Simão, que fazia oposição a Onias — o homem que anteriormente exercera o sumo sacerdócio por toda a vida, homem nobre e bom —, como não conseguia prejudicá-lo em questões relativas à nação, embora o caluniasse de todas as maneiras, partiu como exilado[a], com a intenção de trair a própria pátria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “partiu como fugitivo”; o grego φυγάς pode designar tanto um exilado quanto alguém em fuga.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιπολιτευόμενος
  choice: que fazia oposição
  rationale: Expressa oposição ativa, possivelmente com dimensão política, sem impor um sentido técnico que o contexto não exige.
- source_word: τὸν ποτε τὴν ἀρχιερωσύνην ἔχοντα διὰ βίου
  choice: o homem que anteriormente exercera o sumo sacerdócio por toda a vida
  rationale: Conserva tanto a anterioridade indicada por ποτε quanto a duração vitalícia ligada ao exercício do sumo sacerdócio.
- source_word: καλὸν καὶ ἀγαθὸν ἄνδρα
  choice: homem nobre e bom
  rationale: Mantém o elogio moral elevado da expressão grega em português natural e digno.
- source_word: διαβάλων
  choice: o caluniasse
  rationale: Traduz a ideia de acusações maliciosas ou difamatórias com vocabulário corrente.
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: em questões relativas à nação
  rationale: Preserva prudentemente a referência ao âmbito nacional ou público sem resolver de modo indevido a amplitude semântica de ὑπέρ.
- source_word: οὐκ ἴσχυεν κακῶσαι
  choice: não conseguir prejudicá-lo
  rationale: Reproduz de modo natural a incapacidade de causar dano; o objeto pronominal é suprido pelo contexto sintático.
- source_word: φυγὰς ᾤχετο
  choice: partiu como exilado
  rationale: φυγάς pode designar tanto exilado quanto fugitivo; a escolha se ajusta ao registro narrativo, mantendo a alternativa em nota.
- source_word: τὴν πατρίδα προδώσων
  choice: com a intenção de trair a própria pátria
  rationale: O particípio futuro indica propósito ou intenção, e pátria preserva a ressonância ancestral de πατρίς.
