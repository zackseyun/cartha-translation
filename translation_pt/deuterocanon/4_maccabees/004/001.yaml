  terminology: «Simão», «Onias», «sumo sacerdócio», «caluniar» e «pátria» são adequados. «Em questões relativas à nação» preserva prudentemente a amplitude de ὑπὲρ τοῦ ἔθνους. A nota sobre φυγάς está bem ancorada e apresenta uma alternativa lexical legítima.
