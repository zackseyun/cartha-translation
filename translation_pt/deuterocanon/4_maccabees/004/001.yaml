review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente os referentes, a oposição de Simão a Onias, o caráter vitalício e anterior do sumo sacerdócio, a calúnia, a incapacidade de causar dano, a partida e a intenção de trair a pátria. Contudo, «depois de não conseguir» torna principalmente temporal a relação introduzida por ἐπειδή, que aqui é mais naturalmente causal («como/visto que não conseguia»). O imperfeito ἴσχυεν também se expressa melhor por «não conseguia» do que pelo perfeito pontual «não conseguiu».
