base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/003.yaml
  text: Simon[a], being hostile to the king’s interests, reported that many tens of thousands of private funds had been stored in the treasuries of Jerusalem, not connected with the temple[c][b], but that these belonged to King Seleucus.
translation:
  language: pt
  text: Simão, que se opunha aos interesses do rei,[a] informou que muitas dezenas de milhares em recursos particulares estavam acumuladas nas câmaras do tesouro de Jerusalém, sem pertencer ao templo,[b] e que esses recursos pertenciam ao rei Seleuco.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A formulação grega é difícil e pode ser entendida, de modo mais literal, em relação aos “assuntos” ou à “causa do rei”; o texto transmitido traz uma construção incomum.
    reason: textual_and_lexical_ambiguity
  - marker: b
    text: Ou “sem serem compartilhados com o templo” ou “sem serem propriedade comum do templo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σίμων ὢν τοῖς τοῦ βασιλέως πράγμασιν ἥκω
  choice: Simão, que se opunha aos interesses do rei
  rationale: A construção grega transmitida é comprimida e gramaticalmente difícil, sobretudo pelo ἥκω em primeira pessoa. O contexto apresenta Simão agindo de modo adverso, e “interesses do rei” expressa naturalmente πράγματα neste contexto político. A nota conserva a incerteza da formulação.
- source_word: μηνύων
  choice: informou
  rationale: O particípio indica que Simão tornou conhecida uma informação, aqui com caráter de denúncia. “Informou” preserva o sentido sem intensificar indevidamente o tom.
- source_word: πολλὰς ἰδιωτικῶν χρημάτων μυριάδας
  choice: muitas dezenas de milhares em recursos particulares
  rationale: “Dezenas de milhares” mantém o valor numérico de μυριάδας, enquanto “recursos particulares” comunica que o dinheiro era de propriedade privada.
- source_word: ἐν τοῖς Ἱεροσολύμων γαζοφυλακίοις
  choice: nas câmaras do tesouro de Jerusalém
  rationale: γαζοφυλάκια designa recintos ou depósitos destinados a guardar riquezas. A expressão evita sugerir apenas uma instituição financeira abstrata.
- source_word: τεθησαυρίσθαι
  choice: estavam acumuladas
  rationale: O infinitivo perfeito retrata os recursos como já depositados e mantidos em reserva.
- source_word: τῷ ἱερῷ μὴ ἐπικοινωνούσας
  choice: sem pertencer ao templo
  rationale: A expressão distingue os recursos particulares dos bens comuns ou próprios do templo. A nota registra alternativas mais literais.
- source_word: προσήκειν
  choice: pertenciam
  rationale: No contexto jurídico-financeiro, o verbo exprime uma alegação de vínculo legítimo ou direito de posse.
- source_word: Σελεύκῳ τῷ βασιλεῖ
  choice: ao rei Seleuco
  rationale: Forma corrente e digna em português para o título seguido do nome próprio.
theological_decisions:
- issue: Natureza dos recursos guardados em Jerusalém
  choice: O texto distingue os depósitos particulares dos bens pertencentes ao templo.
  alternative: Os recursos apenas não eram compartilhados com o templo ou não estavam disponíveis para seu uso.
  rationale: ἰδιωτικῶν χρημάτων caracteriza os valores como particulares, e μὴ ἐπικοινωνούσας τῷ ἱερῷ os exclui de uma relação de propriedade comum com o templo. A tradução mantém essa distinção sem validar como verdadeira a alegação posterior de que pertenciam ao rei.
- issue: Status da reivindicação do rei
  choice: A afirmação de que os recursos pertenciam a Seleuco é apresentada como parte do informe de Simão.
  alternative: A voz narrativa confirma diretamente o direito de propriedade do rei.
  rationale: A construção infinitiva depende de μηνύων; portanto, o versículo relata o conteúdo da denúncia de Simão, não necessariamente uma conclusão endossada pelo narrador.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Câmaras do tesouro” preserva o cenário físico, e as notas mantêm as ambiguidades reais da construção grega e da relação dos depósitos com o templo.
