base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/010.yaml
  text: And when Apollonius came up with an armed force to seize the money[a], horse-mounted angels appeared beforehand from heaven[b], flashing around with their weapons and putting great fear and terror into them.
translation:
  language: pt
  text: Quando Apolônio avançava com um exército armado para se apoderar do dinheiro, anjos a cavalo[a] apareceram vindos do céu, relampejando ao redor com suas armas e incutindo neles grande medo e terror.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “anjos montados”.
    reason: A nota registra de forma concisa a construção grega e a imagem equestre expressa por ἔφιπποι.
lexical_decisions:
- source_word: ἀνιόντος
  choice: avançava
  rationale: No genitivo absoluto com Apolônio, o verbo indica movimento em direção ao alvo; “avançava” expressa com naturalidade o movimento militar sem exigir uma subida topográfica.
- source_word: καθωπλισμένης στρατιᾶς
  choice: um exército armado
  rationale: Preserva tanto o substantivo στρατιά, “exército”, como a ênfase do particípio em estar armado ou equipado.
- source_word: πρὸς τὴν τῶν χρημάτων ἁρπαγήν
  choice: para se apoderar do dinheiro
  rationale: ἁρπαγή denota tomada ou saque violento; “apoderar-se” conserva a ação hostil e soa natural em português.
- source_word: οὐρανόθεν προυφάνησαν
  choice: apareceram vindos do céu
  rationale: οὐρανόθεν indica procedência celeste, e προυφάνησαν descreve a manifestação; a formulação evita impor ao prefixo προ- um valor temporal incerto como “antecipadamente”.
- source_word: ἔφιπποι ἄγγελοι
  choice: anjos a cavalo
  rationale: ἔφιπποι significa montados, especificamente em cavalos no uso normal; a expressão comunica de modo claro tanto a identidade angélica quanto a imagem equestre.
- source_word: περιαστράπτοντες τοῖς ὅπλοις
  choice: relampejando ao redor com suas armas
  rationale: Mantém a imagem vívida de clarões semelhantes a relâmpagos em torno deles e deixa as armas como instrumento ou elemento associado, conforme o grego.
- source_word: πολὺν αὐτοῖς φόβον τε καὶ τρόμον ἐνιόντες
  choice: incutindo neles grande medo e terror
  rationale: ἐνίημι significa introduzir ou incutir; “medo e terror” preserva o par intensificador φόβος e τρόμος sem converter o segundo termo necessariamente em reação física.
theological_decisions:
- issue: Sentido de οὐρανόθεν na cena de intervenção sobrenatural
  choice: vindos do céu
  alternative: vindos do firmamento
  rationale: A identidade explícita das figuras como anjos favorece “céu” em seu sentido sobrenatural, sem acrescentar uma explicação doutrinária ausente do texto.
- issue: Identidade e forma dos seres descritos por ἔφιπποι ἄγγελοι
  choice: anjos a cavalo
  alternative: anjos montados
  rationale: A tradução conserva simultaneamente sua identidade angélica e sua apresentação marcial equestre, sem transformar os anjos em meros cavaleiros humanos.
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa fluida. “Apolônio” segue a forma portuguesa corrente. A tradução preserva a sequência de particípios do grego sem produzir uma frase artificial.
