  yaml_path: translation/deuterocanon/4_maccabees/004/012.yaml
  text: For he said that he had sinned, so that he was worthy even to die, and that, if he were saved, he would sing the blessedness of the holy place to all people.
translation:
  language: pt
  text: Pois ele dizia que havia pecado, de modo que merecia até morrer, e que, se fosse salvo, celebraria[a] diante de todos a bem-aventurança do lugar santo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cantaria louvores”. O verbo grego pode indicar louvor em forma de hino, mas não exige que se trate de canto literal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito grego apresenta a declaração em curso no contexto narrativo; “dizia” é natural em português e não força uma ideia de repetição.
- source_word: ἡμαρτηκώς
  choice: havia pecado
  rationale: O particípio perfeito indica um ato anterior cujos efeitos permanecem relevantes; o mais-que-perfeito composto expressa bem essa relação.
- source_word: ὥστε καὶ ἀποθανεῖν ἄξιος ὑπάρχειν
  choice: de modo que merecia até morrer
  rationale: “De modo que” conserva a relação de consequência, enquanto “merecia até morrer” traduz de forma idiomática ἄξιος com infinitivo e o valor intensificador de καί.
- source_word: σωθεὶς
  choice: se fosse salvo
  rationale: O particípio aoristo passivo tem valor condicional no contexto. “Salvo” preserva a amplitude do verbo grego, embora aqui a referência imediata seja ser poupado da morte.
- source_word: ὑμνήσειεν
  choice: celebraria
  rationale: O optativo em discurso indireto expressa o que ele faria caso fosse salvo. “Celebraria” comunica louvor público de modo natural, sem limitar necessariamente o ato ao canto literal.
- source_word: πᾶσίν τε ἀνθρώποις
  choice: diante de todos
  rationale: O dativo indica as pessoas perante as quais ou às quais o louvor seria dirigido; “diante de todos” soa natural e mantém o caráter público.
- source_word: τὴν τοῦ ἱεροῦ τόπου μακαριότητα
  choice: a bem-aventurança do lugar santo
  rationale: “Bem-aventurança” conserva o sentido elevado de μακαριότης, e “lugar santo” corresponde diretamente a ἱεροῦ τόπου sem substituir a expressão por uma identificação interpretativa como “santuário”.
theological_decisions:
- issue: Sentido de σωθεὶς no contexto
  choice: “se fosse salvo”, entendido imediatamente como ser livrado ou poupado da morte
  alternative: “se fosse poupado” ou uma leitura explicitamente espiritual de salvação
  rationale: O contexto narrativo aponta para livramento temporal, mas a tradução mantém a formulação ampla do grego e evita tanto impor uma doutrina posterior quanto eliminar desnecessariamente sua ressonância religiosa.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e vocabulário amplamente compreensível. A construção mantém o encadeamento argumentativo do grego sem rigidez excessiva.
