  text: And he permitted him to serve as high priest and to lead the nation[a].
translation:
  language: pt
  text: Mas ele lhe permitiu exercer o sumo sacerdócio e liderar a nação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «governar a nação». O verbo grego pode indicar a liderança exercida por um chefe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέτρεψεν
  choice: permitiu
  rationale: Expressa a concessão de permissão ou autorização sem sugerir, de modo mais forte, uma fórmula formal de nomeação.
- source_word: ἀρχιερασθαι
  choice: exercer o sumo sacerdócio
  rationale: O infinitivo indica o exercício da função de sumo sacerdote; esta formulação natural preserva a ideia de ofício, e não apenas de status.
- source_word: τοῦ ἔθνους
  choice: a nação
  rationale: Neste contexto judaico, designa o povo entendido como corpo nacional e comunitário.
- source_word: ἀφηγεῖσθαι
  choice: liderar
  rationale: Conserva o sentido amplo de conduzir como chefe, sem intensificá-lo necessariamente para 'governar' ou 'dominar'.
theological_decisions:
- issue: Âmbito da autoridade concedida
  choice: A permissão abrange tanto o exercício do sumo sacerdócio quanto a liderança da nação.
  alternative: 'A segunda função pode ser entendida em sentido político mais marcado: «governar a nação».'
  rationale: Os dois infinitivos gregos dependem do mesmo verbo de permissão. A tradução mantém juntas as dimensões religiosa e cívica sem definir além do texto a natureza exata da autoridade política.
translation_notes:
  register: Português moderno, digno e acessível, com construção concisa. «Exercer o sumo sacerdócio» soa mais natural e funcional do que uma reprodução rígida do infinitivo grego; «liderar» preserva a amplitude semântica do verbo.
