    text: 'Ou: “tendo-se espalhado o rumor de que ele havia morrido”. O grego φήμη pode significar notícia, rumor ou comentário público; no texto foi usado o termo mais neutro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: Pois, enquanto
  rationale: Conserva a função explicativa de γάρ e introduz com naturalidade a circunstância temporal em que ocorre a ação contínua.
- source_word: πολεμῶν ἦν κατʼ Αἴγυπτον Πτολεμαίῳ
  choice: guerreava contra Ptolemeu no Egito
  rationale: A construção perifrástica indica ação em curso; Ptolemeu é apresentado como o adversário, e κατʼ Αἴγυπτον indica naturalmente o cenário geográfico.
- source_word: ἠκούσέν τε
  choice: ele também ouviu
  rationale: O advérbio “também” representa o valor conectivo e aditivo de τε em português corrente.
- source_word: φήμης διαδοθείσης
  choice: tendo-se espalhado a notícia
  rationale: O genitivo absoluto expressa uma circunstância anterior ou concomitante. “Notícia” é uma opção neutra, sem decidir se a informação era mero rumor.
- source_word: περὶ τοῦ τεθνάναι αὐτόν
  choice: de que estava morto
  rationale: A oração finita é idiomática em português e expressa o estado resultante indicado pelo infinitivo perfeito τεθνάναι.
- source_word: ὡς ἔνι μάλιστα
  choice: o máximo possível
  rationale: Preserva a forte intensificação do idioma grego sem recorrer a linguagem rebuscada.
- source_word: χαίροιεν
  choice: se alegravam
  rationale: Mantém o sentido básico de χαίρω e representa naturalmente o optativo do discurso indireto.
- source_word: οἱ Ἱεροσολυμεῖται
  choice: os habitantes de Jerusalém
  rationale: Forma clara e atual para designar os moradores da cidade, evitando um gentílico pouco usual.
- source_word: ταχέως ἐπʼ αὐτοὺς ἀνέζευξεν
  choice: marchou rapidamente contra eles
  rationale: “Marchou” conserva o caráter militar do movimento, enquanto “contra eles” explicita sua direção hostil.
