base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/021.yaml
  text: For while he was waging war against Ptolemy in Egypt[a], he also heard that, when a report had spread that he was dead, the people of Jerusalem were rejoicing as much as possible; so he quickly marched up against them.
translation:
  language: pt
  text: Pois, enquanto guerreava no Egito contra Ptolemeu, ele também ouviu que, tendo-se espalhado a notícia[a] de que havia morrido, os habitantes de Jerusalém se alegravam muitíssimo; então marchou rapidamente contra eles.
  philosophy: optimal-equivalence
  footnotes:
