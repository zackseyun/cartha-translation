  text: He also sought out the nation and led it into every kind of lawlessness[a].
translation:
  language: pt
  text: Ele também procurou a nação e a conduziu a toda espécie de transgressão da lei[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conduziu a nação a toda forma de transgressão da lei”. O verbo grego pode indicar a formação de um modo de vida ou de uma conduta pública, e não apenas a prática de atos isolados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεζήτησεν
  choice: foi atrás de
  rationale: O verbo composto expressa uma busca ativa e deliberada. “Foi atrás de” é natural em português e, neste contexto, admite a ideia de ter a nação como alvo sem transformar explicitamente a ação em perseguição.
- source_word: τὸ ἔθνος
  choice: a nação
  rationale: Mantém o sentido coletivo, étnico e político do singular grego sem acrescentar “judaica”, identificação que o contexto fornece, mas que não aparece expressamente na frase.
- source_word: ἐξεπολίτευσεν
  choice: a levou a viver
  rationale: 'O verbo relacionado à vida cívica e à conduta pública parece aqui causativo: ele levou a nação a adotar certo modo de vida. A formulação evita tanto um literalismo obscuro quanto a imposição de coerção explícita não inequívoca no verbo.'
- source_word: ἐπὶ πᾶσαν παρανομίαν
  choice: em toda espécie de transgressão da lei
  rationale: A expressão indica ampla conduta contrária à lei. “Toda espécie de” comunica a extensão de πᾶσαν, enquanto “transgressão da lei” preserva a ligação lexical com a lei sem explicitar no texto principal que se trata da lei ancestral judaica.
theological_decisions:
- issue: Referência de παρανομία à lei no contexto judaico
  choice: transgressão da lei
  alternative: perversidade; ilegalidade; transgressão da Lei
  rationale: A escolha conserva a noção de conduta contrária à lei e sua provável ressonância com a lei ancestral, mas usa inicial minúscula para não resolver além do grego se o termo funciona aqui como referência técnica à Torá.
- issue: Grau de coerção em ἐξεπολίτευσεν
  choice: levou a viver
  alternative: forçou a viver; induziu a viver
  rationale: O contexto é hostil, mas o verbo destaca sobretudo a formação ou imposição de um modo de vida cívico. A tradução escolhida mantém aberta a intensidade exata da pressão exercida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Foi atrás da nação” evita a ambiguidade indesejada de “procurou a nação” em português e preserva a busca ativa; a nota esclarece a rara expressão ligada à conduta cívica.
