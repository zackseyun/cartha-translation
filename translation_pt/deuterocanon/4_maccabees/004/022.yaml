base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/022.yaml
  text: And when he had subdued them[a], he issued a decree that if any of them were found living according to the ancestral law, they should be put to death.
translation:
  language: pt
  text: Depois de os devastar, promulgou um decreto determinando que, se alguns deles fossem encontrados[a] vivendo segundo a lei ancestral, fossem mortos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fossem vistos conduzindo a vida segundo a lei ancestral”.'
    reason: O verbo grego pode significar “aparecessem” ou “fossem vistos”, e o particípio também admite a ideia de conduzir a própria vida sob essa lei.
lexical_decisions:
- source_word: ἐπόρθησεν
  choice: devastar
  rationale: O verbo expressa conquista acompanhada de devastação ou saque. “Devastar” preserva essa força, que seria atenuada por “subjugar”, sem especificar indevidamente uma modalidade concreta de destruição.
- source_word: δόγμα ἔθετο
  choice: promulgou um decreto
  rationale: A expressão indica o estabelecimento público de uma determinação oficial; “promulgou um decreto” é formal, claro e idiomático em português.
- source_word: φαίνοιεν
  choice: fossem encontrados
  rationale: Embora o verbo possa significar literalmente “aparecessem” ou “fossem vistos”, no contexto da aplicação de um decreto ele aponta para pessoas identificadas como vivendo dessa maneira.
- source_word: τῷ πατρίῳ ... νόμῳ
  choice: segundo a lei ancestral
  rationale: A formulação conserva o caráter herdado da lei judaica sem introduzir terminologia doutrinária posterior.
- source_word: πολιτευόμενοι
  choice: vivendo segundo
  rationale: O particípio descreve a maneira contínua de conduzir a vida sob determinada norma. “Vivendo segundo” comunica isso naturalmente, sem restringir o termo à cidadania política.
- source_word: θάνοιεν
  choice: fossem mortos
  rationale: No contexto de uma pena estabelecida por decreto, a forma expressa morte imposta, e não apenas o fato de morrer.
theological_decisions:
- issue: Identificação da norma judaica em πατρίῳ νόμῳ
  choice: lei ancestral
  alternative: lei de seus antepassados
  rationale: “Lei ancestral” preserva de modo conciso a continuidade étnica e religiosa indicada pelo grego, sem importar formulações confessionais posteriores.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe jurídica clara. A intensidade de ἐπόρθησεν foi mantida em “devastar”, e a alternativa lexical de φαίνοιεν foi registrada em nota sem eliminar a ambiguidade do original.
