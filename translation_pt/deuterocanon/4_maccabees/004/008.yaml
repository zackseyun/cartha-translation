  text: They were preventing him as much as they could[b][a]. But with threats Apollonius was going to the temple.
translation:
  language: pt
  text: Eles o impediam tanto quanto podiam. Mas Apolônio, fazendo ameaças, dirigia-se ao templo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, «templo» pode referir-se ao conjunto dos recintos do templo, e não somente ao santuário interior.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷόν τε ἦν
  choice: tanto quanto podiam
  rationale: A expressão idiomática indica o limite da capacidade ou possibilidade; esta formulação é natural em português e mantém o sentido de esforço até onde lhes era possível.
- source_word: ἐκώλυον
  choice: impediam
  rationale: O imperfeito expressa uma ação contínua ou tentativa persistente de obstrução. O contexto fornece naturalmente o objeto pronominal «o» em português.
- source_word: μετὰ ἀπειλῆς
  choice: fazendo ameaças
  rationale: Embora ἀπειλή esteja no singular, a expressão indica a maneira intimidatória como Apolônio avançava; o plural idiomático em português comunica isso sem sugerir necessariamente uma única ameaça específica.
- source_word: ἀπῄει
  choice: dirigia-se
  rationale: O imperfeito descreve movimento em curso. «Dirigia-se» preserva esse aspecto e combina naturalmente com o destino introduzido por εἰς.
- source_word: εἰς τὸ ἱερόν
  choice: ao templo
  rationale: ἱερόν pode designar o conjunto ou recinto do templo, não apenas o santuário interior. «Templo» é claro e natural no texto principal, com a extensão semântica registrada em nota.
- source_word: ὁ Ἀπολλώνιος
  choice: Apolônio
  rationale: Forma portuguesa consagrada do nome grego Ἀπολλώνιος.
