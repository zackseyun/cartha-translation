base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/013.yaml
  text: Distressed by these words[a], Onias the high priest, although otherwise being careful lest King Seleucus might ever think that Apollonius had been done away with by human plotting and not by divine justice[b], offered some prayer concerning him.
translation:
  language: pt
  text: Afligido por essas palavras, o sumo sacerdote Onias, embora também temesse que o rei Seleuco viesse algum dia a pensar que Apolônio tinha sido morto por uma conspiração humana, e não pela justiça divina[a], fez uma oração a respeito dele[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tinha sido eliminado por uma trama humana, e não por juízo divino”.'
    reason: Alternativas legítimas para ἀνηρῆσθαι, ἐπιβουλή e δίκη, preservando o contraste entre ação humana e justiça divina.
  - marker: b
    text: O grego diz literalmente que Onias “orou algo a respeito dele”, sem esclarecer por completo se a oração foi em favor de Apolônio ou acerca do caso que o envolvia.
    reason: A construção ηὔξατό τι περὶ αὐτοῦ é deliberadamente indefinida e permite mais de uma referência contextual.
lexical_decisions:
- source_word: ἐπαχθεὶς
  choice: Afligido
  rationale: O particípio comunica que Onias ficou emocionalmente oprimido ou angustiado pelas palavras anteriores; “afligido” preserva essa força em português claro e digno.
- source_word: τούτοις ... τοῖς λόγοις
  choice: por essas palavras
  rationale: A formulação conserva o demonstrativo e o valor causal do dativo, com expressão natural em português.
- source_word: καίπερ ἄλλως εὐλαβηθεὶς
  choice: embora, por outro lado, receasse
  rationale: εὐλαβέομαι indica aqui cautela apreensiva diante da possível interpretação do rei, e não primariamente reverência religiosa. “Por outro lado” representa ἄλλως sem tornar a construção excessivamente literal.
- source_word: μὴ ποτε νομίσειεν
  choice: que ... viesse a pensar
  rationale: A construção expressa receio diante de uma possível conclusão futura; o imperfeito do subjuntivo em português comunica adequadamente essa possibilidade temida.
- source_word: ἐξ ἀνθρωπίνης ἐπιβουλῆς
  choice: por uma conspiração humana
  rationale: ἐπιβουλή designa uma trama ou plano hostil. “Conspiração humana” é clara e mantém o contraste com a justiça divina.
- source_word: θείας δίκης
  choice: justiça divina
  rationale: A escolha preserva tanto o adjetivo θείας quanto o substantivo abstrato δίκη, sem explicitar “Deus” além da forma grega.
- source_word: ἀνηρῆσθαι
  choice: tinha sido morto
  rationale: No contexto, o perfeito infinitivo de ἀναιρέω se refere à morte de Apolônio. “Tinha sido morto” é direto e natural; a nota registra a alternativa formal “eliminado”.
- source_word: ηὔξατό τι περὶ αὐτοῦ
  choice: fez uma oração a respeito dele
  rationale: A formulação mantém a referência deliberadamente ampla de περὶ αὐτοῦ e evita decidir se Onias orou em favor de Apolônio ou acerca do caso que o envolvia.
theological_decisions:
- issue: Sentido de θείας δίκης
  choice: justiça divina
  alternative: juízo divino; justiça de Deus
  rationale: “Justiça divina” segue de perto o grego e conserva a afirmação de uma ação justa de origem divina sem substituir o adjetivo por uma identificação mais explícita.
- issue: Referência de περὶ αὐτοῦ após ηὔξατό τι
  choice: uma oração a respeito dele
  alternative: uma oração por ele; uma oração a respeito do caso
  rationale: O grego deixa em aberto se a oração foi em favor de Apolônio ou acerca dele e da situação. A tradução mantém essa ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem longa do período grego foi preservada sem sacrificar a clareza; as vírgulas destacam a ressalva introduzida por καίπερ ἄλλως.
