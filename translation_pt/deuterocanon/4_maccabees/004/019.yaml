  text: so that he not only built a gymnasium at the very citadel of our homeland[b][a], but also abolished the guardianship of the temple.
translation:
  language: pt
  text: de modo que ele não apenas construiu um ginásio na própria cidadela de nossa pátria[a], mas também aboliu a tutela do templo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na própria Acra de nossa pátria”, caso ἄκρα seja entendido como o nome específico da cidadela de Jerusalém.
    reason: alternative_reading
  - marker: b
    text: Ou “a supervisão do templo” ou “o cuidado do templo”. O grego se refere à abolição de uma custódia ou administração do templo, não à destruição física do templo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: de modo que
  rationale: Introduz o resultado das ações anteriores e preserva a força consecutiva da expressão grega.
- source_word: μὴ μόνον ... ἀλλὰ καὶ
  choice: não apenas ... mas também
  rationale: Reproduz com naturalidade o paralelismo enfático da construção correlativa grega.
- source_word: ἐπʼ αὐτῇ τῇ ἄκρᾳ
  choice: na própria cidadela
  rationale: ἄκρα pode designar uma cidadela ou altura fortificada; “própria” comunica a ênfase de αὐτῇ sem tornar a frase pesada.
- source_word: τῆς πατρίδος ἡμῶν
  choice: de nossa pátria
  rationale: πατρίς designa a terra ancestral ou natal; “pátria” é corrente, digna e conserva a dimensão coletiva da expressão.
- source_word: γυμνάσιον
  choice: ginásio
  rationale: Mantém a referência específica à instituição helenística de formação física, cultural e cívica, em vez de reduzi-la a uma academia esportiva moderna.
- source_word: κατασκευάσαι
  choice: construiu
  rationale: Expressa diretamente a ideia de fazer ou edificar; no contexto, é mais natural que uma formulação abstrata.
- source_word: καταλῦσαι
  choice: aboliu
  rationale: Como o objeto é uma tutela institucional, o verbo tem aqui o sentido de suprimir ou extinguir, não necessariamente de destruir fisicamente.
- source_word: κηδεμονίαν
  choice: tutela
  rationale: Comunica custódia, proteção e responsabilidade administrativa, preservando a amplitude de κηδεμονία.
- source_word: τοῦ ἱεροῦ
  choice: do templo
  rationale: Neste contexto, ἱερόν se refere ao templo ou complexo sagrado; “templo” é a forma mais clara para o leitor comum.
theological_decisions:
- issue: Sentido histórico de ἄκρα em relação a Jerusalém
  choice: cidadela
  alternative: Acra
  rationale: O substantivo grego admite o sentido descritivo de fortaleza ou cidadela, embora possa aludir à Acra de Jerusalém. O texto principal favorece a compreensão imediata, e a nota preserva a possibilidade do topônimo.
- issue: Natureza da κηδεμονία τοῦ ἱεροῦ
  choice: tutela do templo
  alternative: administração, supervisão ou cuidado do templo
  rationale: A expressão indica a custódia protetora ou administrativa ligada ao templo. A tradução evita sugerir que o edifício do templo tenha sido demolido e não define com precisão indevida qual estrutura institucional foi suprimida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Ginásio” preserva a instituição helenística e “tutela” mantém a nuance administrativa e protetora. Os marcadores foram posicionados junto às expressões a que se referem.
