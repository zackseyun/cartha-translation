lexical_decisions:
- source_word: ἐφʼ οἷς
  choice: Por causa dessas coisas
  rationale: Expressa com clareza a relação causal e remete às ações de Antíoco narradas anteriormente.
- source_word: ἀγανακτήσασα
  choice: indignada
  rationale: Preserva a forte desaprovação expressa pelo particípio e mantém sua relação circunstancial com o verbo principal em português natural.
- source_word: ἡ θεία δίκη
  choice: a justiça divina
  rationale: Conserva a personificação e a amplitude semântica de δίκη, que pode envolver justiça em ação, juízo ou retribuição, sem identificar diretamente a expressão com o próprio Deus.
- source_word: αὐτόν τοι τὸν Ἀντίοχον
  choice: o próprio Antíoco
  rationale: Reproduz naturalmente a ênfase que recai sobre Antíoco como alvo da ação.
- source_word: ἐπολέμησεν
  choice: guerreou contra
  rationale: Mantém a imagem marcial e a ação hostil da justiça divina personificada, em formulação concisa e digna.
theological_decisions:
- issue: Personificação de δίκη
  choice: Traduzir como «a justiça divina», que se indigna e guerreia
  alternative: «o castigo divino» ou «o juízo divino»
  rationale: A formulação preserva a personificação literária e a tensão teológica do grego, sem reduzi-la apenas à pena aplicada nem explicá-la como referência direta a Deus.
