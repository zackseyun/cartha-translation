base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/011.yaml
  text: So Apollonius[a], having fallen half-dead upon the lifeless court of the sanctuary, stretched out his hands to heaven and with tears begged the Hebrews to pray for him[c][b], so that they might appease the heavenly host.
translation:
  language: pt
  text: Assim, Apolônio, depois de cair semimorto sobre o átrio sem vida do santuário[a], estendeu as mãos para o céu e, em lágrimas, suplicou aos hebreus que orassem por ele[b], a fim de aplacarem o exército celestial[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o recinto do santuário”. O termo grego designa uma área sagrada delimitada ou cercada.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “que orassem a respeito dele”; no contexto, trata-se de oração em favor dele.
    reason: lexical_alternative
  - marker: c
    text: Ou “a hoste celestial” ou “o exército do céu”. O grego não identifica com maior precisão o referente dessa expressão.
    reason: alternative_reading
lexical_decisions:
- source_word: καταπεσὼν
  choice: depois de cair
  rationale: O particípio aoristo indica uma ação anterior à súplica; a formulação explicita essa sequência em português natural.
- source_word: ἡμιθανὴς
  choice: semimorto
  rationale: Reproduz de modo conciso e vívido o sentido literal do composto grego, sem enfraquecê-lo para apenas 'ferido'.
- source_word: ἄψυχον
  choice: sem vida
  rationale: Preserva a imagem incomum do grego, que caracteriza o espaço inanimado e cria contraste com Apolônio semimorto.
- source_word: τοῦ ἱεροῦ περίβολον
  choice: o átrio do santuário
  rationale: No contexto de um complexo sagrado, περίβολος pode designar a área delimitada ou o átrio; 'átrio' é claro e natural, enquanto a alternativa mais formal consta em nota.
- source_word: τὰς χεῖρας ἐκτείνων εἰς τὸν οὐρανὸν
  choice: estendeu as mãos para o céu
  rationale: Expressa naturalmente em português o gesto de súplica e mantém a direção indicada pelo grego.
- source_word: μετὰ δακρύων ... παρεκάλει
  choice: em lágrimas, suplicou
  rationale: Comunica a intensidade emocional da cena e a força contextual de παρακαλέω.
- source_word: ὅπως περὶ αὐτοῦ εὐξόμενοι
  choice: que orassem por ele
  rationale: Embora περὶ αὐτοῦ seja literalmente 'a respeito dele', o contexto indica oração intercessória; a nota registra a forma mais literal.
- source_word: ἐξευμενίσωνται
  choice: a fim de aplacarem
  rationale: O verbo significa tornar favorável ou aplacar; esta escolha é acessível e evita terminologia expiatória técnica.
- source_word: τὸν ἐπουράνιον στρατόν
  choice: o exército celestial
  rationale: Traduz diretamente o sentido coletivo e militar de στρατός, sem identificar de maneira indevida os integrantes ou o referente preciso.
theological_decisions:
- issue: Referente de τὸν ἐπουράνιον στρατόν
  choice: exército celestial, sem identificação adicional
  alternative: hoste celestial; exército do céu; uma designação reverencial do poder divino
  rationale: O grego apresenta um coletivo celestial, mas não especifica expressamente se se trata de seres angélicos ou de uma forma reverencial de falar do poder divino. A tradução e a nota preservam essa abertura.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe fluente e sem arcaísmos desnecessários. A imagem deliberadamente incomum de Apolônio semimorto sobre o átrio 'sem vida' foi preservada, assim como a ambiguidade do coletivo celestial.
