translation:
  language: pt
  text: De modo que até mulheres, por terem circuncidado seus filhos, eram atiradas para baixo[a] com seus bebês, embora soubessem de antemão que sofreriam isso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “eram precipitadas” ou “eram lançadas de uma altura”; o verbo grego indica um lançamento violento para baixo, provavelmente de um precipício ou de lugar elevado.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: de modo que
  rationale: Preserva o valor consecutivo da conjunção, ligando o acontecimento à política ou situação descrita anteriormente.
- source_word: γυναῖκας
  choice: mulheres
  rationale: É a correspondência direta do acusativo plural e não restringe indevidamente o referente a esposas, embora o contexto indique mães.
- source_word: ὅτι
  choice: por terem
  rationale: Expressa naturalmente em português a causa da punição, mantendo a anterioridade do ato em relação ao lançamento.
- source_word: περιέτεμον τὰ παιδία
  choice: terem circuncidado seus filhos
  rationale: Mantém explícita a circuncisão como motivo da perseguição. 'Filhos' é natural no contexto familiar, sem restringir lexicalmente παιδία a 'meninos'.
- source_word: μετὰ τῶν βρεφῶν
  choice: com seus bebês
  rationale: βρέφη designa crianças muito pequenas. O possessivo é inferido com segurança pelo contexto e torna clara a relação entre as mulheres e os bebês.
- source_word: κατακρημνίζεσθαι
  choice: eram precipitadas do alto
  rationale: Comunica a ação violenta de lançar para baixo, possivelmente de um precipício ou lugar elevado, sem fixar uma topografia que o verso não explicita.
- source_word: προειδυίας
  choice: embora soubessem de antemão
  rationale: O particípio modifica as mulheres e exprime conhecimento prévio; a construção concessiva transmite bem sua função contextual.
- source_word: τοῦτο πείσονται
  choice: que sofreriam isso
  rationale: πείσονται tem aqui o sentido de experimentar ou sofrer algo; o futuro em relação ao conhecimento prévio é representado pelo futuro do pretérito.
theological_decisions:
- issue: Contexto histórico-religioso da circuncisão sob perseguição
  choice: Manter 'circuncidado' de forma direta
  alternative: marcado seus filhos segundo a aliança; realizado o rito em seus filhos
  rationale: O texto apresenta a prática judaica da circuncisão como causa imediata da punição. A tradução direta preserva essa tensão histórica e teológica sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção preserva o encadeamento consecutivo, a violência da cena e o conhecimento prévio das mulheres, sem especificar além do grego o local exato da execução.
