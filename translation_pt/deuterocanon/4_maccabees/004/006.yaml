  yaml_path: translation/deuterocanon/4_maccabees/004/006.yaml
  text: with the accursed Simon and a very heavy force[a]. After coming forward, he said that he had come by the king’s commands[b], in order to take the private funds of the treasury.
translation:
  language: pt
  text: com o maldito Simão e um exército extremamente opressivo[a]. Apresentando-se, ele dizia ter vindo por ordem do rei, a fim de tomar os fundos particulares do tesouro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um exército muito numeroso” ou “uma força extremamente temível”. O grego diz literalmente “um exército extremamente pesado”, empregando “pesado” em sentido metafórico para uma força militar opressiva ou formidável.
    reason: lexical_alternative
  - marker: b
    text: A expressão se refere provavelmente a dinheiro de particulares guardado no tesouro, e não necessariamente a todos os recursos do tesouro.
    reason: cultural_note
lexical_decisions:
- source_word: καταράτου
  choice: maldito
  rationale: Preserva a forte condenação expressa pelo adjetivo grego e soa natural em narrativa portuguesa de registro elevado.
- source_word: βαρυτάτου στρατοῦ
  choice: um exército extremamente opressivo
  rationale: Mantém o sentido militar de στρατός e torna inteligível o uso metafórico de βαρύς, que pode indicar uma força pesada, opressora ou temível, sem reduzi-lo necessariamente ao tamanho do contingente.
- source_word: προσελθών
  choice: Apresentando-se
  rationale: Expressa a aproximação anterior à fala e se ajusta naturalmente a uma apresentação oficial perante os presentes.
- source_word: ταῖς τοῦ βασιλέως ἐντολαῖς
  choice: por ordem do rei
  rationale: Traduz o dativo como fundamento ou autorização da vinda; o singular coletivo é idiomático em português, embora o grego use o plural.
- source_word: ἥκειν ἔλεγεν
  choice: ele dizia ter vindo
  rationale: Conserva o discurso indireto e o valor resultativo de ἥκω, indicando que afirmava ter chegado em cumprimento da ordem.
- source_word: ὅπως ... λάβοι
  choice: a fim de tomar
  rationale: Reproduz de modo natural a finalidade expressa por ὅπως com o subjuntivo, sem intensificar λάβοι para 'confiscar' ou 'saquear'.
- source_word: τὰ ἰδιωτικὰ ... χρήματα
  choice: os fundos particulares depositados
  rationale: ἰδιωτικά contrasta esses valores particulares com bens públicos ou sagrados; 'depositados' explicita a relação natural com o tesouro sem sugerir que pertenciam ao próprio tesouro.
- source_word: τοῦ γαζοφυλακίου
  choice: no tesouro
  rationale: A construção é entendida como os fundos particulares mantidos no tesouro. Não se acrescenta 'do templo' no texto principal, pois isso vem do contexto e não do substantivo isoladamente.
theological_decisions:
- issue: Identificação do γαζοφυλάκιον como tesouro do templo
  choice: tesouro
  alternative: tesouro do templo
  rationale: Embora o contexto mais amplo indique o templo de Jerusalém, a cláusula traz apenas γαζοφυλακίου. A tradução evita inserir no texto principal uma especificação contextual não expressa aqui.
- issue: Relação entre os fundos particulares e o tesouro
  choice: fundos particulares depositados no tesouro
  alternative: fundos particulares do tesouro
  rationale: A formulação escolhida evita a possível impressão de que os fundos eram propriedade institucional do tesouro e preserva o contraste de ἰδιωτικά com valores públicos ou sagrados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. 'Opressivo' conserva no texto a metáfora militar de peso; as alternativas plausíveis ficam registradas em nota. A sintaxe do discurso indireto foi mantida sem rigidez excessiva.
