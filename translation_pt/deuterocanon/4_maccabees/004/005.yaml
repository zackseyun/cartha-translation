lexical_decisions:
- source_word: λαβὼν
  choice: depois de obter
  rationale: O particípio aoristo indica uma ação anterior à deslocação subsequente. «Depois de obter» expressa com naturalidade essa sequência e mantém o sentido de adquirir ou receber autoridade.
- source_word: τὴν περὶ αὐτῶν ἐξουσίαν
  choice: autoridade sobre eles
  rationale: ἐξουσία designa autoridade, direito ou poder; com περὶ αὐτῶν, a expressão indica autoridade exercida sobre as pessoas mencionadas.
- source_word: ταχὺ
  choice: rapidamente
  rationale: O advérbio indica rapidez, sem necessariamente implicar a imediatidade mais forte de «imediatamente».
- source_word: εἰς τὴν πατρίδα ἡμῶν
  choice: para a nossa pátria
  rationale: πατρίς refere-se à terra natal ou pátria. «Para a nossa pátria» é claro, digno e natural em português, preservando a perspectiva coletiva do narrador.
