base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/016.yaml
  text: He deposed Onias from the high priesthood and appointed Jason[a], his brother, as high priest, after he promised to give, if he would grant him the office, three thousand six hundred sixty talents per year.
translation:
  language: pt
  text: Ele destituiu Onias do sumo sacerdócio e nomeou Jasão, irmão de Onias, sumo sacerdote, depois que Jasão prometeu dar[a], caso lhe fosse concedido o cargo, três mil seiscentos e sessenta talentos por ano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «prometeu pagar»; o grego diz simplesmente «prometeu dar», deixando que o caráter corrupto do pagamento seja inferido do contexto.
    reason: Alternativa lexical que explicita a natureza financeira da entrega sem justificar a tradução mais forte «subornar».
lexical_decisions:
- source_word: καταλύσας
  choice: destituiu
  rationale: No contexto político e sacerdotal, o verbo indica a remoção formal de Onias do cargo, não destruição literal.
- source_word: τὸν Ὀνίαν τῆς ἀρχιερωσύνης
  choice: Onias do sumo sacerdócio
  rationale: A construção expressa que Onias foi privado do ofício de sumo sacerdote; esta formulação é clara e natural em português.
- source_word: κατέστησεν ἀρχιερέα
  choice: nomeou ... sumo sacerdote
  rationale: Expressa a designação oficial para o cargo sem acrescentar a ideia mais específica de uma cerimônia de instalação.
- source_word: ὑποσχόμενον δώσειν
  choice: depois que este prometeu dar-lhe
  rationale: O particípio refere-se a Jasão e apresenta sua promessa como circunstância da nomeação. O pronome «este» evita atribuir a promessa ao sujeito da oração principal, e «dar» preserva a formulação não interpretativa do grego.
- source_word: εἰ ἐπιτρέψειεν αὐτῷ τὴν ἀρχήν
  choice: caso lhe concedesse o cargo
  rationale: Neste contexto, ἀρχή designa o cargo ou autoridade pretendida, isto é, o sumo sacerdócio. A formulação mantém a condição e é idiomática.
- source_word: κατʼ ἐνιαυτόν
  choice: por ano
  rationale: Forma corrente e concisa para indicar a periodicidade anual.
- source_word: τρισχίλια ἑξακόσια ἑξήκοντα τάλαντα
  choice: três mil seiscentos e sessenta talentos
  rationale: Mantém o valor exato e a unidade monetária antiga, com o número por extenso em registro literário.
theological_decisions:
- issue: Caracterização moral do pagamento prometido por Jasão
  choice: Descrever a transação sem empregar «suborno» no texto principal.
  alternative: Traduzir interpretativamente como «prometeu pagar-lhe» ou «subornou-o».
  rationale: O grego afirma apenas que Jasão prometeu dar certa quantia anual caso recebesse o cargo. O caráter corrupto pode ser inferido do contexto, mas o versículo não usa um termo explícito para suborno.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Sumo sacerdócio» conserva a terminologia bíblica corrente; «este» esclarece que Jasão, e não o agente da destituição, fez a promessa.
