lexical_decisions:
- source_word: ὅθεν
  choice: Por isso
  rationale: Expressa naturalmente a inferência ou consequência marcada pelo advérbio grego.
- source_word: ἥκων
  choice: foi até
  rationale: O particípio presente de ἥκω indica a chegada ou ida à presença de Apolônio; em português corrente, a forma finita evita uma construção pesada sem alterar a sequência narrativa.
- source_word: στρατηγόν
  choice: governador
  rationale: No contexto administrativo helenístico, designa o dirigente ou autoridade regional; “governador” comunica melhor a função ao leitor comum do que o sentido estritamente militar de “general”.
- source_word: ἔλεγεν
  choice: lhe dizia
  rationale: Preserva o aspecto imperfeito do verbo, que introduz uma fala em desenvolvimento; o pronome explicita de modo natural que Apolônio é o destinatário.
