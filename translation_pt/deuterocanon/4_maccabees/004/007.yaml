  yaml_path: translation/deuterocanon/4_maccabees/004/007.yaml
  text: And when the nation was raging at the proposal and speaking against it[a], they considered it utterly dreadful if those who had entrusted their deposits to the sacred treasury should be deprived of them[b], since
translation:
  language: pt
  text: E, enquanto o povo se indignava com a proposta e protestava contra ela, eles consideraram absolutamente terrível que aqueles que haviam confiado seus depósitos ao tesouro sagrado[a] fossem privados deles, visto que[b]
  philosophy: optimal-equivalence
  footnotes:
