lexical_decisions:
- source_word: τοῦ ἔθνους
  choice: a nação
  rationale: Preserva o sentido coletivo e político de ἔθνος, que aqui designa a população judaica como um todo.
- source_word: πρὸς τὸν λόγον
  choice: com a proposta
  rationale: No contexto, λόγος se refere ao plano anunciado a respeito dos fundos guardados no templo; “proposta” expressa esse sentido prático sem o tornar excessivamente específico.
- source_word: σχετλιάζοντος
  choice: se indignava
  rationale: O verbo comunica indignação intensa; esta formulação é natural e digna em português, sem acrescentar a ideia específica de violência.
- source_word: ἀντιλέγοντός τε
  choice: e se manifestava contra ela
  rationale: Mantém a força verbal de ἀντιλέγω, distinguindo a oposição expressa da indignação emocional indicada pelo particípio anterior.
- source_word: πάνδεινον
  choice: absolutamente terrível
  rationale: Reproduz a forte intensificação do composto grego em português corrente.
- source_word: νομίσαντες
  choice: eles consideraram
  rationale: Introduz de modo claro o conteúdo do juízo expresso pelo particípio aoristo.
- source_word: οἱ τὰς παρακαταθήκας πιστεύσαντες
  choice: aqueles que haviam confiado seus depósitos
  rationale: Conserva tanto a ideia de bens entregues para custódia quanto o ato de confiar esses bens a uma instituição.
- source_word: τῷ ἱερῷ θησαυρῷ
  choice: ao tesouro sagrado
  rationale: Segue de perto o grego, preservando o caráter sagrado indicado por ἱερός; o contexto identifica esse tesouro com o do templo.
- source_word: στερηθήσονται
  choice: fossem privados deles
  rationale: Expressa adequadamente o passivo de στερέω e mantém o tom jurídico-financeiro da passagem.
- source_word: ὡς
  choice: visto que
  rationale: Sinaliza a explicação que começa no fim deste versículo e prossegue no seguinte, preservando a construção incompleta.
theological_decisions:
- issue: Linguagem relacionada ao templo sem importar nuances doutrinárias posteriores
  choice: tesouro sagrado
  alternative: tesouro do templo
  rationale: “Tesouro sagrado” preserva diretamente a qualificação ἱερός, enquanto a identificação com o templo pode ser esclarecida em nota sem substituir a formulação grega por uma explicitação contextual.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A coordenação “se indignava... e se manifestava contra” conserva a distinção entre reação emocional e oposição verbal. A terminação suspensa do versículo foi mantida, com nota explicativa.
