translation:
  language: pt
  text: Enquanto os sacerdotes, com mulheres e crianças, suplicavam no templo a Deus que defendesse o lugar que estava sendo tratado com desprezo[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o lugar desprezado» ou «o lugar desonrado». A expressão grega indica que o local sagrado estava sendo menosprezado ou tratado com desprezo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δὲ ἱερέων
  choice: Enquanto os sacerdotes
  rationale: O genitivo absoluto apresenta uma ação de fundo em andamento; «enquanto» expressa naturalmente essa relação, e «sacerdotes» é o termo padrão no contexto do templo judaico.
- source_word: μετὰ γυναικῶν καὶ παιδίων
  choice: com mulheres e crianças
  rationale: Mantém a formulação abrangente do grego sem acrescentar que as mulheres eram esposas dos sacerdotes.
- source_word: ἐν τῷ ἱερῷ
  choice: no templo
  rationale: Ἱερόν normalmente designa o templo ou seu complexo, sem limitar a referência ao santuário interior.
- source_word: ἱκετευόντων
  choice: suplicavam
  rationale: Transmite a petição intensa e reverente indicada pelo particípio, em linguagem portuguesa natural e digna.
- source_word: ὑπερασπίσαι
  choice: que defendesse
  rationale: O verbo indica defender ou proteger em favor de alguém ou algo; a oração com subjuntivo é a construção portuguesa natural após «suplicavam a Deus».
- source_word: τοῦ καταφρονουμένου τόπου
  choice: o lugar que estava sendo tratado com desprezo
  rationale: Explicita o valor passivo e contínuo do particípio e preserva «lugar», sem estreitar indevidamente a referência a uma parte específica do templo.
theological_decisions:
- issue: Referência de τόπος («lugar»)
  choice: Manter «lugar», com provável referência ao local sagrado do templo ameaçado
  alternative: Traduzir diretamente como «templo», «santuário» ou entender a cidade de modo mais amplo
  rationale: A menção imediata ao templo favorece a referência ao local sagrado, mas o substantivo grego é mais amplo; «lugar» conserva essa abertura sem apagar o contexto.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A frase conserva a forma de oração subordinada e a vírgula final porque o versículo é um segmento que continua no contexto.
