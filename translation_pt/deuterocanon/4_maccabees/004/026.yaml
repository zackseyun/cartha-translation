base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/026.yaml
  text: Therefore[a], since his decrees were being despised by the people, he himself was compelling each and every one of the nation, by tortures, after tasting defiling foods[b], to renounce Judaism.
translation:
  language: pt
  text: Portanto, visto que seus decretos eram desprezados pelo povo, ele próprio obrigava cada um dos membros da nação, mediante torturas, depois de provarem alimentos que causavam impureza ritual[a], a renunciar ao judaísmo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “alimentos impuros” ou “alimentos contaminados”. O termo grego ressalta a contaminação ritual.
    reason: lexical_alternative
  - marker: b
    text: Ou “a renegar sob juramento o judaísmo”. O verbo grego pode indicar uma renúncia formal feita sob juramento.
    reason: lexical_alternative
lexical_decisions:
- source_word: δόγματα
  choice: decretos
  rationale: Refere-se às determinações oficiais do governante; “decretos” preserva sua força autoritativa em português corrente.
- source_word: κατεφρονεῖτο
  choice: eram desprezados
  rationale: O imperfeito passivo indica rejeição contínua marcada por desprezo, e não mera desobediência.
- source_word: διὰ βασάνων
  choice: mediante torturas
  rationale: Expressa claramente o meio coercitivo indicado por διά com o genitivo.
- source_word: ἕνα ἕκαστον τοῦ ἔθνους
  choice: cada um dos membros da nação
  rationale: Reproduz a ênfase distributiva de ἕνα ἕκαστον sem sugerir que a nação, como entidade abstrata, fosse torturada.
- source_word: μιερῶν ... τροφῶν
  choice: alimentos que causavam impureza
  rationale: Comunica de modo natural o caráter ritual e contaminante de μιερός, evitando reduzir a expressão a uma simples categoria higiênica.
- source_word: ἀπογευομένους
  choice: a provar
  rationale: O particípio, dependente dos indivíduos coagidos, descreve a ingestão imposta como parte do processo de coerção; a coordenação em português torna a sequência inteligível.
- source_word: ἐξόμνυσθαι
  choice: a renunciar
  rationale: É uma formulação moderna e clara para a renúncia formal, enquanto a nota preserva a possível força de juramento.
- source_word: τὸν Ἰουδαϊσμόν
  choice: ao judaísmo
  rationale: Mantém a amplitude do termo grego, que pode abranger religião, práticas e identidade comunitária judaicas.
theological_decisions:
- issue: Amplitude de τὸν Ἰουδαϊσμόν
  choice: judaísmo
  alternative: modo de vida judaico; religião judaica
  rationale: “Judaísmo” evita restringir o referente somente à religião ou somente à identidade étnica e preserva a abrangência contextual.
- issue: Força de μιερῶν τροφῶν
  choice: alimentos que causavam impureza
  alternative: alimentos impuros; alimentos contaminados
  rationale: A expressão conserva a avaliação ritual do narrador e explicita que o consumo era entendido como contaminante, sem impor terminologia confessional posterior.
- issue: Relação sintática de ἀπογευομένους com ἠνάγκαζεν e ἐξόμνυσθαι
  choice: obrigava ... a provar ... e a renunciar
  alternative: obrigava ... depois de provarem ... a renunciar
  rationale: O acusativo plural do particípio se refere às pessoas coagidas. A redação escolhida deixa claro que tanto provar os alimentos quanto renunciar ao judaísmo integravam a coerção, preservando a sequência sem atribuir o ato ao perseguidor.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A construção foi reorganizada para evitar a ambiguidade artificial de que o próprio governante teria provado os alimentos, mantendo a coerção, a sequência dos atos e o aspecto contínuo do imperfeito grego.
