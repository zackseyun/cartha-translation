  yaml_path: translation/deuterocanon/4_maccabees/004/025.yaml
  text: Therefore[a], since his decrees were being despised by the people, he himself was forcing each one of the nation, by tortures, after tasting defiling foods, to renounce Judaism.
translation:
  language: pt
  text: Por isso, visto que seus decretos eram desprezados pelo povo, ele próprio obrigava, por meio de torturas, cada membro da nação, depois de provar alimentos que causavam impureza, a renunciar ao judaísmo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a abjurar, sob juramento, o judaísmo”. O verbo pode conter uma nuance ligada a juramento, embora “renunciar” expresse bem o sentido no contexto.
    reason: alternativa lexical
lexical_decisions:
- source_word: δόγματα
  choice: decretos
  rationale: No contexto político, designa determinações oficiais do governante; “decretos” preserva sua força autoritativa em português corrente.
- source_word: κατεφρονεῖτο
  choice: eram desprezados
  rationale: O imperfeito passivo expressa uma atitude contínua de desprezo ou desconsideração por parte do povo; “eram desprezados” conserva a intensidade do verbo.
- source_word: διὰ βασάνων
  choice: por meio de torturas
  rationale: Indica o uso de tormentos físicos como meio de coerção; o plural acompanha o grego e pode sugerir atos repetidos ou diversos.
- source_word: ἕνα ἕκαστον τοῦ ἔθνους
  choice: cada membro da nação
  rationale: Reproduz a ênfase distributiva no ataque a cada indivíduo, evitando a construção pouco natural “cada um da nação”.
- source_word: μιερῶν ... τροφῶν
  choice: alimentos que causavam impureza
  rationale: Expressa a qualidade profanadora ou ritualmente contaminante dos alimentos sem reduzi-la à mera sujeira física nem impor uma categoria técnica mais estreita.
- source_word: ἀπογευομένους
  choice: depois de provar
  rationale: O particípio indica que a prova dos alimentos antecedia a renúncia exigida; a construção no singular concorda naturalmente com “cada membro”.
- source_word: ἐξόμνυσθαι
  choice: renunciar
  rationale: É uma formulação clara e corrente para abandonar formalmente uma lealdade ou modo de vida; a possível nuance de juramento é preservada em nota.
- source_word: τὸν Ἰουδαϊσμόν
  choice: ao judaísmo
  rationale: É o equivalente direto do substantivo e mantém conjuntamente as dimensões de identidade, prática e lealdade religiosa sem restringi-las.
theological_decisions:
- issue: Alcance de τὸν Ἰουδαϊσμόν
  choice: judaísmo
  alternative: modo de vida judaico; religião judaica
  rationale: “Judaísmo” preserva a abrangência do termo grego no contexto de apostasia forçada, sem limitá-lo apenas a crenças religiosas ou apenas à identidade étnica.
- issue: Nuance de juramento em ἐξόμνυσθαι
  choice: renunciar, com nota explicativa
  alternative: abjurar sob juramento
  rationale: O contexto sustenta claramente a ideia de renúncia, enquanto a força ligada a juramento é lexicalmente possível, mas não precisa ser imposta no texto principal.
translation_notes:
  register: 'Português moderno, digno e amplamente inteligível, com fluidez brasileira. A ordem da frase conserva a progressão do grego: desprezo pelos decretos, coerção individual mediante torturas, prova de alimentos causadores de impureza e renúncia ao judaísmo.'
