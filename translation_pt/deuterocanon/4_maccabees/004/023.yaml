  text: And since he was in no way able to break the goodwill of the nation by means of decrees[a], but saw all his threats and punishments being nullified[b],
translation:
  language: pt
  text: E, visto que de modo algum conseguia abalar, por meio dos decretos[a], a boa vontade da nação, mas via todas as suas ameaças e punições serem anuladas[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio dos editos”. O grego δόγματα indica decretos ou determinações oficiais.
    reason: lexical_alternative
  - marker: b
    text: 'O grego repete palavras do grupo de καταλύω: ele não conseguia desfazer a boa vontade da nação, enquanto as suas próprias ameaças e punições estavam sendo anuladas ou desfeitas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: visto que
  rationale: Introduz uma circunstância com valor causal que conduz ao que vem a seguir; “visto que” preserva esse vínculo sem reduzi-lo a uma indicação meramente temporal.
- source_word: κατὰ μηδένα τρόπον
  choice: de modo algum
  rationale: Expressa a negação enfática e total do grego em português corrente e digno.
- source_word: ἴσχυεν καταλῦσαι
  choice: conseguia destruir
  rationale: Com o infinitivo, ἴσχυεν indica capacidade; “destruir” conserva a força de καταλύω aplicada aqui à boa vontade ou disposição favorável da nação.
- source_word: διὰ τῶν δογμάτων
  choice: por meio dos decretos
  rationale: δόγματα designa determinações oficiais; “decretos” é claro e historicamente apropriado.
- source_word: τὴν τοῦ ἔθνους εὔνοιαν
  choice: a boa vontade da nação
  rationale: Mantém o sentido básico de εὔνοια — boa vontade, disposição favorável ou lealdade — sem especificar indevidamente o objeto dessa disposição; “nação” corresponde a ἔθνος neste contexto.
- source_word: πάσας τὰς ἑαυτοῦ ἀπειλὰς καὶ τιμωρίας
  choice: todas as suas ameaças e punições
  rationale: Tradução direta e natural do par de medidas coercivas.
- source_word: ἑώρα καταλυομένας
  choice: via ... serem anuladas
  rationale: Retrata as ameaças e punições como tornadas ineficazes. A nota registra a repetição intencional do mesmo grupo lexical usado anteriormente.
