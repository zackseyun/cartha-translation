lexical_decisions:
- source_word: παραδόξως
  choice: contra toda expectativa
  rationale: Expressa de modo natural o caráter surpreendente e extraordinário da sobrevivência, sem afirmar explicitamente uma intervenção milagrosa.
- source_word: διασωθεὶς
  choice: havia sido salvo
  rationale: O particípio aoristo passivo indica que ele foi conduzido em segurança através do perigo; a formulação preserva a voz passiva e a relação temporal anterior à partida.
- source_word: ᾤχετο
  choice: partiu
  rationale: O verbo indica afastamento ou partida; “partiu” é conciso, digno e corrente em narrativa.
- source_word: δηλώσων
  choice: para contar
  rationale: O particípio futuro expressa propósito. “Para contar” comunica claramente que ele foi informar o rei, sem formalidade excessiva.
- source_word: τὰ συμβάντα αὐτῷ
  choice: o que lhe tinha acontecido
  rationale: Reproduz naturalmente o particípio substantivado e o dativo de pessoa afetada, mantendo a referência aos acontecimentos vividos por ele.
