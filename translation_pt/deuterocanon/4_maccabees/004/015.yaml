  text: When Seleucus the king had died[a], his son Antiochus Epiphanes succeeded to the rule, a proud and formidable man;
translation:
  language: pt
  text: Depois que o rei Seleuco morreu, seu filho Antíoco Epífanes o sucedeu no governo. Era um homem arrogante e temível.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “arrogante e formidável”. A palavra grega traduzida como “temível” pode ter sentidos como “formidável”, “terrível” ou “assustador”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τελευτήσαντος
  choice: Depois que ... morreu
  rationale: Expressa naturalmente em português a ação anterior do aoristo no genitivo absoluto, sem acrescentar um marcador discursivo ausente do grego.
- source_word: διάδεχεται
  choice: o sucedeu
  rationale: Comunica de modo idiomático a sucessão dinástica indicada pelo verbo, mantendo como objeto implícito o rei Seleuco.
- source_word: τὴν ἀρχήν
  choice: no governo
  rationale: Neste contexto, ἀρχή designa autoridade governamental ou exercício do poder; “governo” evita especificar indevidamente “reino” ou “soberania”.
- source_word: Ἐπιφανής
  choice: Epífanes
  rationale: Mantém em forma portuguesa consagrada o epíteto histórico de Antíoco, em vez de traduzi-lo como “Ilustre” ou “Manifesto”.
- source_word: ἀνὴρ
  choice: homem
  rationale: Reproduz o substantivo masculino explícito e introduz naturalmente a caracterização de Antíoco.
- source_word: ὑπερήφανος
  choice: arrogante
  rationale: Torna claro o sentido negativo de soberba ou altivez presente no contexto; “orgulhoso” poderia soar neutro ou positivo no português atual.
- source_word: δεινός
  choice: temível
  rationale: Preserva a caracterização ameaçadora sem restringir excessivamente o campo semântico, que pode incluir as ideias de terrível, perigoso e formidável.
