  text: For truly the contest that came about through them was divine[a].
translation:
  language: pt
  text: Pois foi verdadeiramente divina a luta que se realizou por meio deles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a luta divina realizada por eles”. A expressão grega pode enfatizar tanto que a luta se realizou por sua atuação como que se concretizou no caso deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀληθῶς
  choice: verdadeiramente
  rationale: Preserva a ênfase solene do advérbio grego e reforça a afirmação sem introduzir uma interpretação adicional.
- source_word: ἀγών
  choice: luta
  rationale: No contexto do sofrimento dos mártires, o termo evoca uma contenda pública ou atlética. “Luta” mantém essa imagem e soa natural em português atual.
- source_word: θεῖος
  choice: divina
  rationale: Traduz diretamente o adjetivo que caracteriza a luta como pertencente ao âmbito divino ou marcada por ele, sem explicitar além do que o grego afirma.
- source_word: ὁ διʼ αὐτῶν γεγενημένος
  choice: que se realizou por meio deles
  rationale: “Se realizou” representa o acontecimento expresso pelo particípio perfeito, enquanto “por meio deles” conserva o valor instrumental de διά com o genitivo e evita atribuir-lhes de modo inequívoco a origem da luta.
theological_decisions:
- issue: O papel dos mártires na expressão διʼ αὐτῶν
  choice: A luta se realizou “por meio deles”, destacando sua participação instrumental.
  alternative: A luta divina foi realizada por eles; ou a luta se manifestou no caso deles.
  rationale: 'A formulação mantém a tensão do texto: a luta é divina, mas se concretiza por meio do testemunho dos mártires, sem definir se a ênfase recai sobretudo em sua agência ou no que se realizou neles.'
translation_notes:
  register: Português moderno, claro e solene, com sintaxe natural e ampla legibilidade brasileira. A ordem “foi verdadeiramente divina” preserva a ênfase retórica, e a nota registra a ambiguidade genuína da expressão grega.
