  yaml_path: translation/deuterocanon/4_maccabees/017/013.yaml
  text: Eleazar was taking the lead in the contest[a]; the mother of the seven sons was competing like an athlete; and the brothers were contending.
translation:
  language: pt
  text: Eleazar ia à frente na luta[a]; a mãe dos sete filhos competia como atleta; e os irmãos lutavam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego emprega uma sequência de verbos ligados à competição e à luta: Eleazar «ia à frente na luta», a mãe «competia como atleta» e os irmãos «lutavam». A tradução mantém essa imagem comum com expressões ligeiramente variadas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προηγωνίζετο
  choice: ia à frente na luta
  rationale: O imperfeito de προαγωνίζομαι indica que Eleazar precedia os demais no enfrentamento, como pioneiro e exemplo. A formulação preserva tanto a ideia de precedência quanto a imagem de luta ou competição.
- source_word: ἐνήθλει
  choice: competia como atleta
  rationale: O verbo ἀθλέω pertence explicitamente ao campo atlético. Esta tradução torna perceptível essa metáfora sem produzir uma expressão artificial em português.
- source_word: ἠγωνίζοντο
  choice: travavam o combate
  rationale: ἀγωνίζομαι pode descrever competição, luta ou combate. A escolha mantém a imagem agonística e o contexto de martírio sem afirmar que os irmãos atacavam fisicamente seus algozes.
- source_word: μήτηρ τῶν ἑπτὰ παίδων
  choice: a mãe dos sete filhos
  rationale: Embora παῖδες possa significar genericamente «crianças» ou «filhos», o contexto identifica os sete como homens; «filhos» é, portanto, preciso e natural.
- source_word: ἀδελφοὶ
  choice: os irmãos
  rationale: O substantivo masculino plural refere-se aos sete irmãos do relato, e a tradução conserva essa especificidade.
theological_decisions:
- issue: Preservação da metáfora de competição e luta
  choice: Manter, nas três orações, a linguagem de luta, atletismo e combate
  alternative: Substituir a metáfora por termos gerais como «perseveravam» ou «suportavam o sofrimento»
  rationale: O grego emprega deliberadamente três verbos do campo agonístico para retratar o martírio como uma luta nobre. Suprimir essa sequência enfraqueceria a retórica do versículo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade no Brasil. «Ia à frente» comunica precedência sem o tom administrativo que «liderava» poderia sugerir; «como atleta» explicita a imagem presente no verbo grego.
