base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/007.yaml
  text: But if it were possible for us[a], as for a painter, to depict the godliness of your story, would not those who looked on shudder at a mother of seven children enduring varied tortures, because of godliness, all the way to death?
translation:
  language: pt
  text: Mas, se nos fosse possível retratar, como um pintor, a piedade[a] de sua história, não estremeceriam os que vissem uma mãe de sete filhos suportando vários suplícios, por causa da piedade, até a morte?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “devoção a Deus”; o mesmo termo grego é traduzido por “piedade” nas duas ocorrências deste versículo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ ἔξον ἡμῖν ἦν
  choice: Mas, se nos fosse possível
  rationale: Preserva a construção hipotética e admite o sentido de possibilidade de ἔξον, sem excluir por completo sua nuance de permissão.
- source_word: ὥσπερ τινός, ζωγραφῆσαι
  choice: como a um pintor, retratar
  rationale: A expressão grega é elíptica; “pintor” explicita naturalmente a pessoa subentendida, enquanto “retratar” mantém a metáfora visual própria de ζωγραφέω.
- source_word: τὴν τῆς ἱστορίας σου εὐσέβειαν
  choice: a piedade de sua história
  rationale: “Piedade” expressa reverência e fidelidade a Deus; “história” é natural no contexto do relato da mãe, e a construção conserva a ligação genitiva sem explicá-la além do texto.
- source_word: οὐκ ἂν ἔφριττον οἱ θεωροῦντες
  choice: não estremeceriam os que a contemplassem
  rationale: “Estremecer” comunica a reação física e horrorizada de φρίσσω; “contemplassem” preserva o sentido de observação atenta de θεωρέω e retoma a cena retratada.
- source_word: μητέρα ἑπτὰ τέκνων
  choice: uma mãe de sete filhos
  rationale: Embora τέκνα seja lexicalmente geral, “filhos” em português pode incluir descendentes de ambos os sexos e soa natural; o contexto narrativo identifica os sete como homens sem inserir aqui “sete filhos homens” ou “sete rapazes”.
- source_word: διʼ εὐσέβειαν
  choice: por causa da piedade
  rationale: διά com acusativo indica causa ou motivo. A repetição de “piedade” conserva a insistência temática do original.
- source_word: ποικίλας βασάνους
  choice: diversos suplícios
  rationale: “Diversos” mantém a ideia de variedade de ποικίλος, e “suplícios” comunica formas deliberadas de tortura no contexto do martírio.
- source_word: μέχρι θανάτου ὑπομενούσαν
  choice: suportava ... até a morte
  rationale: “Suportava” expressa perseverança sob sofrimento, e “até a morte” conserva o alcance extremo indicado por μέχρι θανάτου.
theological_decisions:
- issue: Tradução de εὐσέβεια no contexto do martírio
  choice: piedade
  alternative: devoção a Deus
  rationale: “Piedade” é uma forma digna e corrente de indicar reverência religiosa e fidelidade a Deus. A nota registra uma alternativa mais explícita sem limitar no texto principal a amplitude da virtude grega.
- issue: Relação causal entre a piedade e os suplícios
  choice: por causa da piedade
  alternative: por amor à piedade
  rationale: A formulação preserva o valor causal de διά com acusativo e deixa em aberto se a piedade é vista mais precisamente como motivo da resistência ou como causa da perseguição, sem resolver a tensão do original.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe retém a pergunta retórica, a metáfora pictórica e a repetição temática de “piedade”, evitando linguagem confessional específica.
