- from: Mas, se nos fosse possível, como a um pintor, retratar a piedade[a] de sua história, não estremeceriam os que a contemplassem diante de uma mãe de sete filhos que, por causa da piedade, suportava diversos suplícios até a morte?
  to: Mas, se nos fosse possível retratar, como um pintor, a piedade[a] de sua história, não estremeceriam os que vissem uma mãe de sete filhos suportando vários suplícios, por causa da piedade, até a morte?
  rationale: A revisão retira o objeto e a relação espacial não expressos no original, fazendo da mãe que suporta os suplícios o quadro diretamente observado. Também reorganiza a metáfora do pintor para obter português moderno e fluente, conservando a hipótese, a pergunta retórica, a causalidade de διά, a variedade dos tormentos e a repetição de εὐσέβεια.
