review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a hipótese retórica, a repetição de εὐσέβεια, os sete filhos, os suplícios variados e o limite «até a morte». Contudo, «os que a contemplassem diante de uma mãe» introduz um referente («a», presumivelmente a história ou a pintura) que não está no grego e desloca os observadores da mãe para uma cena artificial.
  naturalness: «Como a um pintor» é compreensível, mas pouco idiomático nessa posição. «Como um pintor» ligado diretamente a «retratar» torna a metáfora pictórica natural. A reformulação da oração dos observadores também elimina uma construção ambígua.
  terminology: «Piedade» pode verter εὐσέβεια e sua repetição é corretamente mantida. A nota alternativa «devoção a Deus» é útil. «Suplícios» comunica adequadamente βάσανοι neste contexto.
  issues:
  - severity: medium
    issue: Referente indevidamente acrescentado em «os que a contemplassem diante de uma mãe».
    rationale: οἱ θεωροῦντες não possui objeto expresso e é seguido diretamente por «uma mãe... suportando». A redação atual faz os observadores contemplarem algo feminino antes de se acharem «diante» da mãe, em vez de reagirem à visão da própria mãe.
  - severity: low
    issue: Construção comparativa pouco natural em «como a um pintor, retratar».
    rationale: Embora tente reproduzir a elipse de ὥσπερ τινός, a formulação portuguesa soa truncada. «Retratar, como um pintor» mantém a comparação sem atribuir conteúdo adicional.
  revised_text: Mas, se nos fosse possível retratar, como um pintor, a piedade[a] de sua história, não estremeceriam os que vissem uma mãe de sete filhos suportando vários suplícios, por causa da piedade, até a morte?
  revised_footnotes:
