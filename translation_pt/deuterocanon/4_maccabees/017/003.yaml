  text: For just as you[a], like a roof firmly established upon the pillar of the children, bravely bore the earthquake through tortures without wavering,
translation:
  language: pt
  text: Pois, como um teto firmemente assentado sobre a coluna de seus filhos[a], você suportou com coragem, sem vacilar, o terremoto por meio das torturas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “das crianças”. O termo grego pode significar “filhos”, “crianças” ou “meninos”, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Pois, assim como
  rationale: Preserva tanto a força explicativa de γάρ quanto a comparação introduzida por καθάπερ.
- source_word: στέγη
  choice: teto
  rationale: Mantém a imagem arquitetônica concreta; em português corrente, “teto” é mais natural que “cobertura” neste quadro metafórico.
- source_word: στύλου
  choice: coluna
  rationale: Designa o elemento estrutural que sustenta o teto e mantém com clareza a metáfora arquitetônica.
- source_word: τῶν παίδων
  choice: dos filhos
  rationale: No contexto, trata-se dos filhos da mãe; “filhos” expressa naturalmente essa relação, enquanto a nota registra a amplitude lexical do grego.
- source_word: γενναίως
  choice: com coragem
  rationale: Comunica de modo natural o valor adverbial de coragem e nobre firmeza.
- source_word: ἱδρυμένη
  choice: firmemente assentado
  rationale: Expressa algo colocado de modo estável e se harmoniza com a construção figurada.
- source_word: ἀκλινῶς
  choice: sem vacilar
  rationale: Conserva a ideia de firmeza inabalável diante da pressão, em linguagem portuguesa atual.
- source_word: ὑπήνεγκας
  choice: suportou
  rationale: Traduz a ideia de aguentar ou resistir sob um peso e funciona naturalmente com o objeto metafórico “terremoto”.
- source_word: διὰ τῶν βασάνων
  choice: provocado pelas torturas
  rationale: Explicita a relação instrumental ou causal das torturas com o terremoto figurado, evitando a formulação pouco natural “através das torturas”.
- source_word: σεισμόν
  choice: terremoto
  rationale: Retém o sentido concreto e prolonga a imagem arquitetônica de teto, coluna e abalo.
theological_decisions:
- issue: Descrição metafórica da mãe em relação aos filhos
  choice: Preservar as imagens de teto, coluna e terremoto
  alternative: Explicitar a figura como proteção materna e resistência aos sofrimentos dos filhos
  rationale: O grego emprega deliberadamente uma metáfora arquitetônica densa; mantê-la preserva a força retórica e evita impor uma interpretação única.
- issue: Referente de τῶν παίδων
  choice: dos filhos
  alternative: das crianças
  rationale: A narrativa identifica os παῖδες como filhos da mulher. A tradução contextual “filhos” é natural, e a nota conserva a possibilidade lexical mais ampla.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência brasileira sem regionalismos marcados. A ordem foi ajustada para fluidez, mas a metáfora arquitetônica e a tensão do original foram preservadas.
