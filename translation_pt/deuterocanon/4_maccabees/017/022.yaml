  yaml_path: translation/deuterocanon/4_maccabees/017/022.yaml
  text: as though they had become a ransom for the sin of the nation[a], and through the blood of those devout ones and their propitiatory death, divine providence preserved Israel[b], though it had been mistreated before.
translation:
  language: pt
  text: como se tivessem se tornado um resgate pelo pecado da nação[a], e, por meio do sangue daqueles devotos e de sua morte expiatória[b], a providência divina preservou Israel, que antes havia sido afligido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “uma vida substitutiva pelo pecado da nação” ou “uma vida dada em troca pelo pecado da nação”.
    reason: Preservar as possibilidades literais de ἀντίψυχον, termo que indica algo dado em troca de uma vida.
  - marker: b
    text: Ou “morte propiciatória”. O termo grego também pode designar, em outros contextos, o “propiciatório”, isto é, a tampa da arca da aliança.
    reason: Registrar a amplitude cultual de ἱλαστήριος sem impor ao contexto a referência concreta ao propiciatório.
lexical_decisions:
- source_word: ἀντίψυχον
  choice: um resgate
  rationale: O termo indica algo dado em troca de uma vida. “Resgate” comunica de modo conciso a ideia compensatória e substitutiva, enquanto a nota preserva traduções mais literais.
- source_word: ἁμαρτίας
  choice: pelo pecado
  rationale: Mantém o sentido moral e religioso do grego e expressa naturalmente em português a relação do resgate com o pecado da nação.
- source_word: εὐσεβῶν
  choice: devotos
  rationale: Designa pessoas reverentes para com Deus; “devotos” é atual, claro e conserva o peso religioso do termo.
- source_word: ἱλαστηρίου
  choice: expiatória
  rationale: Como adjetivo de “morte”, indica que a morte tem efeito de expiação ou propiciação. “Expiatória” é natural neste contexto sacrificial, e a alternativa “propiciatória” é registrada em nota.
- source_word: θεία πρόνοια
  choice: a providência divina
  rationale: Expressão idiomática que preserva a referência à ação providencial de Deus sem explicitar mais do que o grego.
- source_word: προκακωθέντα
  choice: que antes havia sido afligido
  rationale: Reproduz tanto o sentido passivo de sofrer males como a anterioridade indicada pelo prefixo προ-, sem exigir uma leitura concessiva.
- source_word: διέσωσεν
  choice: preservou
  rationale: O verbo composto descreve a preservação através do perigo; “preservou” se ajusta à libertação nacional no contexto.
theological_decisions:
- issue: Sentido de ἱλαστηρίου no contexto da morte dos mártires
  choice: sua morte expiatória
  alternative: sua morte propiciatória
  rationale: O adjetivo atribui à morte eficácia cultual de expiação ou propiciação. “Expiatória” é clara e idiomática em português, mas a nota conserva a alternativa para não resolver silenciosamente a tensão lexical.
- issue: Força substitutiva de ἀντίψυχον γεγονότας
  choice: como se tivessem se tornado um resgate pelo pecado da nação
  alternative: como se tivessem se tornado uma vida dada em troca pelo pecado da nação
  rationale: “Resgate” conserva a noção de troca e substituição sem definir o mecanismo preciso pelo qual a morte beneficia a nação; “como se” mantém a qualificação de ὥσπερ.
translation_notes:
  register: Português moderno, digno e acessível, com construção fluente e vocabulário religioso amplamente compreensível. O início em minúscula conserva o caráter de continuação do fragmento grego fornecido. Os marcadores [a] e [b] aparecem imediatamente após as expressões a que se referem.
