  text: These also vindicated the nation[a], looking to God and enduring torments even to death.
translation:
  language: pt
  text: Eles também obtiveram justiça para a nação[a], olhando para Deus e suportando torturas até a morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vingaram a nação” ou “vindicaram a nação”. O verbo grego pode ter sentido judicial ou retributivo; neste contexto de martírio, pode indicar que eles obtiveram justiça para a nação diante de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ καὶ
  choice: Eles também
  rationale: Retoma naturalmente, em português, as pessoas mencionadas no contexto anterior e preserva a força aditiva de καί.
- source_word: ἐξεδίκησαν
  choice: obtiveram justiça para
  rationale: O verbo pode expressar vingança, reivindicação ou obtenção de justiça. Esta formulação conserva sua força judicial sem sugerir que os mártires praticaram retaliação violenta.
- source_word: τὸ ἔθνος
  choice: a nação
  rationale: Preserva o sentido coletivo e nacional de ἔθνος, que aqui designa o povo judeu como corpo.
- source_word: εἰς θεὸν ἀφορῶντες
  choice: mantendo os olhos em Deus
  rationale: Expressa de modo natural a atenção continuamente dirigida para Deus, sem explicitar além do grego se essa orientação implica confiança, esperança ou apelo.
- source_word: τὰς βασάνους
  choice: as torturas
  rationale: No contexto de martírio, βάσανοι indica sofrimentos deliberadamente infligidos, e não apenas aflições gerais.
- source_word: μέχρι θανάτου ... ὑπομείναντες
  choice: suportando ... até a morte
  rationale: Preserva tanto a perseverança indicada pelo particípio quanto o limite extremo expresso por μέχρι θανάτου.
theological_decisions:
- issue: Sentido de ἐξεδίκησαν no contexto de martírio
  choice: Os mártires obtiveram justiça para a nação.
  alternative: Os mártires vingaram a nação; ou vindicaram a nação.
  rationale: A construção associa o ato à orientação para Deus e à resistência não violenta até a morte. A opção escolhida mantém a dimensão judicial ou retributiva do verbo, mas evita atribuir aos mártires uma ação violenta que o texto não declara.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A formulação conserva a ambiguidade judicial de ἐξεδίκησαν mediante nota, evitando linguagem denominacional.
