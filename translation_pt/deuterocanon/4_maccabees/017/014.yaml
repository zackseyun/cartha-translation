  text: The tyrant kept struggling[a], but the world and the life of mankind were watching.
translation:
  language: pt
  text: O tirano continuava a lutar[a], mas o mundo e a vida da humanidade observavam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «O tirano lutava; mas o mundo e a vida da humanidade observavam». O alvo da luta está implícito no contexto, mas não é expresso no grego.
    reason: Registra a formulação mais literal e esclarece a elipse do objeto de ἀντηγωνίζετο.
lexical_decisions:
- source_word: ὁ τύραννος
  choice: o tirano
  rationale: Preserva a força moral negativa de τύραννος no contexto, indicando um governante opressor.
- source_word: ἀντηγωνίζετο
  choice: continuava a lutar
  rationale: O imperfeito expressa uma ação em curso, e o verbo tem sentido de contender ou lutar em oposição. O alvo da luta permanece implícito, como no grego.
- source_word: ὁ δὲ κόσμος
  choice: mas o mundo
  rationale: δέ introduz aqui um contraste entre a luta do tirano e a observação do espetáculo; «mas» transmite essa mudança com naturalidade.
- source_word: ὁ τῶν ἀνθρώπων βίος
  choice: a vida da humanidade
  rationale: Mantém o caráter coletivo e elevado da expressão, evitando o uso potencialmente restrito de «dos homens».
- source_word: ἐθεώρει
  choice: observavam
  rationale: O imperfeito indica observação contínua. Embora o grego use o verbo no singular, o português requer normalmente o plural com os dois sujeitos coordenados.
theological_decisions:
- issue: Personificação do mundo e da vida da humanidade como espectadores
  choice: Conservar a personificação no texto principal.
  alternative: Reformular de modo abstrato, como «o mundo da vida humana observava».
  rationale: O grego apresenta o acontecimento como um espetáculo público de alcance universal. Preservar a personificação mantém sua força retórica sem acrescentar uma interpretação teológica.
- issue: Objeto implícito de ἀντηγωνίζετο
  choice: Não acrescentar «contra eles» ao texto principal; esclarecer a elipse em nota.
  alternative: Traduzir «continuava a lutar contra eles».
  rationale: O contexto identifica os adversários, mas o grego não os explicita. Manter o verbo sem objeto conserva a forma e a abertura do original, enquanto a nota oferece a informação contextual necessária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção «continuava a lutar» também permanece natural no português internacional. A imagem personificada e a tensão sintática do original foram preservadas.
