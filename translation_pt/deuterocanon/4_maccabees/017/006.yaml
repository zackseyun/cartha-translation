  text: For your childbearing was from Abraham the child[a].
translation:
  language: pt
  text: Pois a sua procriação procedia de Abraão, o servo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «Abraão, o filho». A palavra grega também pode significar «criança» ou «filho», embora «servo» pareça se ajustar melhor ao contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦ γὰρ
  choice: Pois ... vinha
  rationale: γάρ introduz a explicação; o imperfeito ἦ descreve uma realidade passada. Em conjunto com ἀπό, «vinha» expressa naturalmente a ideia de origem.
- source_word: ἡ παιδοποιία σου
  choice: a sua geração de filhos
  rationale: παιδοποιία designa a procriação ou o ato de gerar filhos. A formulação mantém o sentido concreto e dirige-se diretamente à mãe.
- source_word: ἀπὸ Ἀβραὰμ
  choice: de Abraão
  rationale: ἀπό indica fonte ou origem; no contexto, aponta para a descendência remontando a Abraão.
- source_word: τοῦ παιδός
  choice: o servo
  rationale: παῖς pode significar «criança/filho» ou «servo». Aplicado a Abraão neste contexto reverente, «servo» é a leitura mais natural, sem a conotação social mais forte de «escravo».
theological_decisions:
- issue: Sentido de παῖς aplicado a Abraão
  choice: Abraão, o servo
  alternative: Abraão, o filho / Abraão, a criança
  rationale: O título provavelmente apresenta Abraão como servo de Deus. A nota preserva a polissemia real do termo grego, sem ocultar a alternativa lexical.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. «Geração de filhos» evita o sentido predominantemente obstétrico que «parto» teria e conserva a referência à procriação e à linhagem.
