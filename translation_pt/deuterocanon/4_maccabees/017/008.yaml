  yaml_path: translation/deuterocanon/4_maccabees/017/008.yaml
  text: 'For it would indeed have been fitting to inscribe even these words on his very tombstone, spoken as a memorial for those of the nation:'
translation:
  language: pt
  text: 'Pois teria sido apropriado inscrever também estas palavras no próprio epitáfio[a], proferidas como memorial para os que pertencem à nação:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “no próprio monumento funerário”. O termo grego pode designar a inscrição funerária ou o monumento que a contém.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄξιον ἦν
  choice: teria sido apropriado
  rationale: Expressa de modo natural a construção impessoal grega e sua força retórica, sem a rigidez de uma tradução como “era digno”.
- source_word: ἐπὶ αὐτοῦ τοῦ ἐπιταφίου
  choice: no próprio epitáfio
  rationale: Preserva a ênfase de αὐτοῦ τοῦ (“no próprio”) e mantém a amplitude lexical de ἐπιτάφιον, que pode indicar a inscrição funerária ou o monumento que a contém.
- source_word: ἀναγράψαι
  choice: inscrever
  rationale: No contexto funerário, comunica com precisão a ideia de registrar por escrito de maneira pública ou duradoura.
- source_word: καὶ ταῦτα
  choice: também estas palavras
  rationale: O demonstrativo aponta provavelmente para a declaração que vem a seguir; “palavras” explicita naturalmente o referente implícito sem alterar o sentido.
- source_word: λεγόμενα
  choice: proferidas
  rationale: Conserva o caráter verbal do particípio e concorda naturalmente com “palavras” em português.
- source_word: εἰς μνείαν
  choice: como memorial
  rationale: Mantém o valor de finalidade ou função comemorativa da expressão grega.
- source_word: τοῖς ἀπὸ τοῦ ἔθνους
  choice: para os que pertencem à nação
  rationale: Reproduz o sentido coletivo de “os da nação” sem inserir “nosso povo” ou identificar explicitamente a nação além do que o texto declara.
