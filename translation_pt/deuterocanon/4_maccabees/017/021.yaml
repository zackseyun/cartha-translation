  text: and that the tyrant should be punished and the homeland purified.
translation:
  language: pt
  text: e que o tirano fosse punido e a pátria fosse purificada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τύραννον
  choice: o tirano
  rationale: Equivalente direto e natural que preserva a força moral e política da referência ao governante opressor.
- source_word: τιμωρηθῆναι
  choice: fosse punido
  rationale: O infinitivo aoristo passivo exprime a punição sofrida pelo tirano; a forma verbal é natural em português dentro da construção subordinada.
- source_word: πατρίδα
  choice: a pátria
  rationale: Preserva o sentido de terra ancestral ou comunidade nacional e corresponde de modo conciso ao valor afetivo e coletivo de πατρίς.
- source_word: καθαρισθῆναι
  choice: purificada
  rationale: Mantém a voz passiva e a amplitude ritual, moral e comunitária de καθαρίζω, sem reduzir o sentido a uma limpeza meramente física.
- source_word: καὶ ... καὶ
  choice: e ... e
  rationale: Reproduz a coordenação paralela dos dois resultados de maneira clara e idiomática.
theological_decisions:
- issue: Sentido da purificação da pátria
  choice: “a pátria, purificada” conserva um sentido amplo, que pode abranger purificação ritual, moral e comunitária
  alternative: “a pátria, limpa” ou “a nação, purificada”, que poderiam enfatizar, respectivamente, a remoção da impureza ou o povo em vez da terra ancestral
  rationale: O grego não limita a purificação a uma única dimensão; a formulação escolhida preserva essa amplitude e a tensão simbólica do texto.
translation_notes:
  register: Português moderno, digno e conciso, com boa legibilidade brasileira. A vírgula antes de “purificada” marca a elipse de “fosse” e evita a leitura de “pátria purificada” como simples sintagma nominal.
