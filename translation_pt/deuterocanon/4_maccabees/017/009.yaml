base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/009.yaml
  text: Here lie buried an aged priest[a], and an aged woman, and seven children, because of a tyrant’s violence, who wanted to abolish the commonwealth of the Hebrews.
translation:
  language: pt
  text: Aqui estão sepultados um sacerdote idoso, uma mulher idosa e sete filhos, por causa da violência de um tirano que queria acabar com a ordem de vida dos hebreus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a constituição dos hebreus” ou “a organização civil dos hebreus”. O termo grego abrange a vida comunitária ordenada de um povo, não apenas suas crenças particulares.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐντάφθα
  choice: Aqui
  rationale: Preserva o advérbio dêitico e o caráter solene, semelhante ao de uma inscrição funerária.
- source_word: γέρων ἱερεύς
  choice: um sacerdote idoso
  rationale: Expressa tanto a idade avançada quanto a função sacerdotal em linguagem natural e digna.
- source_word: γυνὴ γεραιά
  choice: uma mulher idosa
  rationale: Mantém o paralelismo com o sacerdote idoso e o tom comemorativo do texto.
- source_word: ἑπτὰ παῖδες
  choice: sete filhos
  rationale: Embora παῖδες possa significar crianças ou jovens, o contexto identifica os sete como descendentes da mulher; em português, “filhos” expressa naturalmente essa relação sem especificar a idade.
- source_word: ἐγκεκήδευνται
  choice: estão sepultados
  rationale: O perfeito passivo descreve o estado presente resultante do sepultamento; esta formulação o preserva com naturalidade.
- source_word: διὰ τυράννου βίαν
  choice: por causa da violência de um tirano
  rationale: διά com acusativo indica causa, e “violência” corresponde diretamente a βία.
- source_word: τὴν Ἑβραίων πολιτίαν
  choice: a ordem de vida dos hebreus
  rationale: πολιτεία abrange a organização comunitária, civil e legal de um povo. “Ordem de vida” evita reduzi-la à crença privada, embora a amplitude do termo exija nota.
- source_word: καταλῦσαι
  choice: acabar com
  rationale: Expressa de modo atual e claro a intenção de desfazer ou abolir uma ordem estabelecida.
- source_word: θέλοντος
  choice: que queria
  rationale: Converte o particípio genitivo referente ao tirano em oração relativa natural, preservando a ideia de intenção.
theological_decisions:
- issue: Sentido de πολιτεία no contexto do martírio judaico
  choice: a ordem de vida dos hebreus
  alternative: a constituição dos hebreus; a organização civil dos hebreus
  rationale: 'O termo designa mais que religião privada: inclui a vida comunitária do povo, organizada por suas leis e costumes. A tradução mantém essa abrangência sem impor uma formulação doutrinária específica.'
translation_notes:
  register: Português moderno, claro e solene, com cadência apropriada a uma declaração memorial. A repetição de “idoso/idosa” conserva o paralelismo grego; a nota preserva a amplitude semântica de πολιτεία.
