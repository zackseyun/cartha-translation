  text: Therefore take courage[a], O mother of a holy soul, holding fast the hope of endurance with noble courage toward God.
translation:
  language: pt
  text: Portanto, tenha coragem, ó mãe de alma santa[a], conservando com nobreza a esperança da perseverança voltada para Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ó mãe de alma consagrada”. O adjetivo grego ἱερόψυχε é uma expressão composta e compacta que descreve a alma ou o caráter interior como santo ou sagrado.'
    reason: alternativa lexical
lexical_decisions:
- source_word: θάρρει
  choice: tenha coragem
  rationale: O imperativo de θαρρέω exorta diretamente à coragem; a expressão é clara e idiomática em português atual.
- source_word: τοιγαροῦν
  choice: portanto
  rationale: A partícula introduz uma conclusão decorrente do contexto anterior.
- source_word: μῆτηρ
  choice: mãe
  rationale: Mantém de modo direto o vocativo dirigido à mulher da narrativa.
- source_word: ἱερόψυχε
  choice: de alma santa
  rationale: O composto associa ἱερό- à alma ou ao caráter interior; esta formulação conserva tanto o elemento sagrado quanto a referência à alma sem criar um adjetivo artificial.
- source_word: ἐλπίδα
  choice: esperança
  rationale: É o sentido usual e apropriado de ἐλπίς neste contexto.
- source_word: ὑπομονῆς
  choice: da perseverança
  rationale: Preserva a construção genitiva do grego e expressa de forma natural a constância em meio ao sofrimento, sem decidir se a perseverança é o conteúdo, a fonte ou a qualidade da esperança.
- source_word: γενναίως
  choice: com nobreza
  rationale: O advérbio pode indicar ação nobre ou valorosa; esta escolha retém sua dimensão moral sem repetir desnecessariamente 'coragem'.
- source_word: ἔχουσα
  choice: conservando
  rationale: Traduz o particípio de ἔχω como uma ação contínua de manter a esperança, sem acrescentar explicitamente a ideia de agarrar-se firmemente.
- source_word: πρὸς θεόν
  choice: voltada para Deus
  rationale: Preserva a orientação expressa por πρός com acusativo e evita substituí-la pela formulação teologicamente mais específica 'em Deus'.
theological_decisions:
- issue: Sentido do vocativo ἱερόψυχε
  choice: ó mãe de alma santa
  alternative: ó mãe de alma consagrada
  rationale: A tradução escolhida mantém explícitos tanto o caráter sagrado indicado por ἱερο- quanto a referência à ψυχή, sem reduzir o termo apenas a nobreza moral.
- issue: Orientação de πρὸς θεόν
  choice: voltada para Deus
  alternative: em Deus
  rationale: A formulação mantém a direção ou orientação do grego, sem converter silenciosamente a expressão numa afirmação mais definida sobre Deus como objeto ou fundamento da esperança.
- issue: Relação genitiva em ἐλπίδα τῆς ὑπομονῆς
  choice: a esperança da perseverança
  alternative: a esperança produzida pela perseverança
  rationale: A construção portuguesa conserva a concisão e certa ambiguidade do genitivo grego, em vez de especificar uma relação causal não explicitada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com vocativo solene adequado ao contexto. A ordem foi levemente ajustada para fluência, mas foram preservadas a construção genitiva e a orientação para Deus presentes no grego.
