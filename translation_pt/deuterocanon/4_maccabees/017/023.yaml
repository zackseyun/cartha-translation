base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/023.yaml
  text: For when the tyrant Antiochus saw their courage and virtue and their endurance in tortures[a], he proclaimed their endurance as an example to his soldiers.
translation:
  language: pt
  text: Pois, ao contemplar a coragem viril[a], a virtude e a perseverança deles em meio às torturas, o tirano Antíoco proclamou a perseverança deles como exemplo para os seus soldados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «bravura viril». O termo grego designa coragem ou fortaleza concebida como qualidade masculina.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνδρίαν
  choice: coragem viril
  rationale: Preserva tanto a ideia de coragem e fortaleza quanto a conotação explicitamente masculina do termo grego, sem recorrer ao menos natural «virilidade» isoladamente.
- source_word: ἀρετὴν
  choice: virtude
  rationale: Expressa de modo conciso a excelência moral ou nobreza elogiada no contexto.
- source_word: βασάνοις
  choice: torturas
  rationale: No contexto de martírio, refere-se a sofrimentos físicos deliberadamente infligidos, não a simples provas.
- source_word: ὑπομονὴν
  choice: perseverança
  rationale: Comunica constância firme sob sofrimento e funciona naturalmente nas duas ocorrências do versículo.
- source_word: ἀφιδὼν
  choice: ao contemplar
  rationale: Traduz o particípio com sentido de observar ou dirigir a atenção para algo, mantendo fluidez em português.
- source_word: ἀνεκήρυξεν
  choice: proclamou
  rationale: Conserva o caráter público e formal da declaração.
- source_word: ὑπόδειγμα
  choice: exemplo
  rationale: Representa naturalmente a ideia de modelo apresentado para imitação.
- source_word: στρατιώτας
  choice: soldados
  rationale: É a designação direta e corrente dos militares sob o comando de Antíoco.
theological_decisions:
- issue: Conotação masculina de ἀνδρία
  choice: coragem viril
  alternative: coragem; bravura; virilidade
  rationale: A formulação mantém na tradução principal a coloração masculina do conceito ético grego, ao mesmo tempo que deixa claro que o traço elogiado é a coragem, sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «perseverança» foi mantida porque também ocorre no grego e liga explicitamente a conduta dos mártires ao exemplo oferecido aos soldados.
