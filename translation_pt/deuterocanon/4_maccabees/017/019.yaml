review_pass:
  verdict: revise
  source_fidelity: 'A tradução reproduz adequadamente a santificação passiva, a honra recebida e o nexo causal ligado aos mártires. O final grego é sintaticamente anômalo na tradição transmitida: os dois grupos estão no acusativo. A interpretação contextual de que os inimigos não prevaleceram contra a nação é defensável, desde que a nota preserve explicitamente a alternativa formal.'
  naturalness: “Por meio de Deus” e a sequência “porque, por causa deles” soam pesadas em português moderno. “Por Deus” e “pelo fato de que, por causa deles” são mais naturais, sem perda relevante de sentido.
  terminology: “Santificados”, “honrados”, “honra”, “nação” e “inimigos” são escolhas adequadas e mantêm o registro bíblico-histórico. “Por Deus” expressa naturalmente a agência que διά com genitivo pode indicar; a alternativa mais literal pode ficar em nota.
  issues:
  - severity: low
    issue: Formulação pouco natural para διὰ θεοῦ
    rationale: “Por meio de Deus” é compreensível, mas em português sugere mais fortemente um instrumento intermediário. Neste contexto, “por Deus” é a formulação idiomática para a agência divina; a nota pode registrar “por meio de Deus” como alternativa.
  - severity: low
    issue: Redundância na introdução da segunda base de honra
    rationale: “Mas também porque, por causa deles” duplica a ligação causal. “Mas também pelo fato de que, por causa deles” representa melhor o artigo substantivando a oração infinitiva e flui naturalmente.
