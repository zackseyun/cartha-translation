  yaml_path: translation/deuterocanon/4_maccabees/017/019.yaml
  text: And so these men also[a], having been made holy through God, have been honored not only with this honor, but also because through them our nation did not let the enemies prevail,
translation:
  language: pt
  text: E assim também estes, tendo sido santificados por meio de Deus[a], foram honrados não somente com esta honra, mas também porque, por causa deles, os inimigos não prevaleceram contra a nossa nação[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por Deus”; no grego, διά com o genitivo pode indicar agência.
    reason: lexical_alternative
  - marker: b
    text: 'A construção grega transmitida é sintaticamente difícil, pois tanto “a nossa nação” como “os inimigos” aparecem no acusativo. Pelo contexto, o sentido mais provável é que os inimigos não prevaleceram contra a nação; formalmente, também se poderia entender: “a nossa nação não prevaleceu contra os inimigos”.'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: ἁγιασθέντες
  choice: tendo sido santificados
  rationale: Preserva o particípio aoristo passivo de ἁγιάζω e a linguagem explícita de santidade. “Santificados” é corrente no contexto bíblico e evita restringir o sentido a uma consagração cultual.
- source_word: διὰ θεοῦ
  choice: por meio de Deus
  rationale: διά com genitivo pode indicar agência ou meio. “Por meio de Deus” acompanha de perto a construção grega; “por Deus” é uma alternativa natural em português.
- source_word: τετίμηνται
  choice: foram honrados
  rationale: Expressa a voz passiva de τιμάω. Embora o perfeito grego destaque o estado resultante da honra recebida, “foram honrados” é a formulação portuguesa mais natural neste período narrativo.
- source_word: ταύτῃ τῇ τιμῇ
  choice: com esta honra
  rationale: Mantém a repetição lexical entre τετίμηνται e τιμή e traduz naturalmente o dativo.
- source_word: τῷ διʼ αὐτοὺς
  choice: porque, por causa deles
  rationale: 'O artigo com a oração infinitiva apresenta outro fundamento da honra. Aqui διά com acusativo indica causa: “por causa deles”.'
- source_word: τὸ ἔθνος ἡμῶν
  choice: a nossa nação
  rationale: ἔθνος designa aqui a comunidade nacional judaica; “nação” conserva esse sentido coletivo e histórico.
- source_word: τοὺς πολεμίους
  choice: os inimigos
  rationale: O substantivo com artigo refere-se ao grupo hostil entendido pelo contexto.
- source_word: μὴ ἐπικρατῆσαι
  choice: não prevaleceram contra
  rationale: ἐπικρατέω comunica a ideia de prevalecer, dominar ou obter superioridade. A tradução segue o sentido contextual de que os inimigos não dominaram a nação, sem introduzir a ideia causativa de que a própria nação “não os deixou” prevalecer.
theological_decisions:
- issue: Sentido de ἁγιασθέντες no contexto do martírio
  choice: Os mártires são descritos como tendo sido santificados por meio de Deus.
  alternative: Os mártires foram consagrados por Deus em sentido mais especificamente cultual.
  rationale: O texto atribui a eles uma condição de santidade vinculada à ação divina, mas não exige que essa condição seja definida como uma investidura cultual.
- issue: Agência divina em διὰ θεοῦ
  choice: por meio de Deus
  alternative: por Deus
  rationale: A escolha preserva o valor possível de διά com genitivo e sua forma mediada, enquanto a nota registra a tradução direta de agência.
- issue: Relação sintática entre a nação e os inimigos
  choice: Os inimigos não prevaleceram contra a nossa nação.
  alternative: A nossa nação não prevaleceu contra os inimigos.
  rationale: As duas expressões estão no acusativo na forma grega transmitida, o que torna a sintaxe formalmente difícil. O contexto de libertação nacional e a recepção antiga do período favorecem entender “os inimigos” como sujeito lógico e “a nossa nação” como aquilo contra o qual não prevaleceram; a ambiguidade textual é explicitada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. Conservou-se a repetição “honrados/honra” do grego. A tradução evita o causativo acrescentado na camada inglesa (“não deixou os inimigos prevalecer”), que não está expresso no texto grego, e sinaliza a dificuldade sintática real do final do versículo.
