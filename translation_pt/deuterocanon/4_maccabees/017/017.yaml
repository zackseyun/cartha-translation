  text: Indeed, the tyrant himself and all their council marveled at their endurance, because of which they now stand beside the divine throne and live the blessed age.
translation:
  language: pt
  text: De fato, tanto o próprio tirano como todo o conselho deles ficaram maravilhados com a perseverança deles, por causa da qual agora estão diante do trono divino[a] e vivem a era bem-aventurada.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao lado do trono divino”. O verbo grego com o dativo pode indicar comparecimento diante do trono ou posição próxima a ele.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “vivem a era bem-aventurada”; no contexto, a expressão provavelmente se refere a um estado eterno de bem-aventurança.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτός γέ τοι
  choice: De fato, ... o próprio
  rationale: A locução preserva a ênfase das partículas e do pronome intensivo em português natural.
- source_word: ὁ τύραννος
  choice: o tirano
  rationale: Mantém a caracterização hostil de Antíoco presente no termo grego, em vez de empregar um título político neutro.
- source_word: συνέδριον
  choice: conselho
  rationale: Designa adequadamente o corpo reunido ou tribunal do tirano sem especificar em excesso sua estrutura institucional.
- source_word: ἐξεθαύμασαν
  choice: ficaram maravilhados
  rationale: Expressa o forte assombro indicado pelo verbo e se ajusta naturalmente ao sujeito composto em português.
- source_word: ὑπομονήν
  choice: perseverança
  rationale: No contexto do martírio, comunica constância resistente em meio ao sofrimento, com peso moral adequado.
- source_word: διʼ ἣν
  choice: por causa da qual
  rationale: Preserva a relação causal explícita entre a perseverança e a condição descrita em seguida.
- source_word: τῷ θείῳ ... θρόνῳ
  choice: o trono divino
  rationale: Reproduz o adjetivo grego sem tornar a expressão mais explícita do que o original.
- source_word: παρεστήκασιν
  choice: estão diante de
  rationale: O perfeito descreve um estado presente de comparecimento ou assistência na presença do trono; a construção com dativo admite proximidade, registrada em nota.
- source_word: τὸν μακάριον ... αἰῶνα
  choice: a era bem-aventurada
  rationale: Mantém a imagem temporal de αἰών e evita substituí-la diretamente por uma formulação doutrinária como 'eternidade'.
- source_word: βιοῦσιν
  choice: vivem
  rationale: É o equivalente direto do verbo e conserva a formulação elevada e incomum do grego.
theological_decisions:
- issue: Natureza da recompensa dos mártires após a morte
  choice: Eles são apresentados como estando agora diante do trono divino e vivendo a era bem-aventurada.
  alternative: Eles estão ao lado do trono divino e desfrutam da eternidade bem-aventurada.
  rationale: A tradução conserva a linguagem de estado presente e a imagem de vindicação após a morte, sem convertê-las em categorias doutrinárias posteriores nem eliminar a ambiguidade espacial e temporal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com concordância natural do sujeito composto. A repetição de “deles” preserva os referentes pronominais do grego, embora mantenha a leve ambiguidade do original.
