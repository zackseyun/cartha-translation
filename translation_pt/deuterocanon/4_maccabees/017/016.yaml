  text: Who did not marvel at the athletes of the law of truth? Who was not astonished?[a]
translation:
  language: pt
  text: Quem não admirou os atletas da lei da verdade? Quem não ficou espantado?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “da verdadeira lei”. A expressão grega pode ser entendida como uma construção genitiva (“a lei da verdade”) ou como uma caracterização da lei como verdadeira.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμασαν
  choice: admirou
  rationale: O verbo expressa admiração acompanhada de assombro; “admirou” é natural em português e mantém o tom elogioso da pergunta retórica.
- source_word: ἀθλητάς
  choice: atletas
  rationale: Preserva a metáfora atlética recorrente em 4 Macabeus para a perseverança virtuosa dos mártires, sem interpretá-la como linguagem militar.
- source_word: νομοθεσίας
  choice: lei
  rationale: Embora possa designar legislação ou promulgação de leis, neste contexto “lei” comunica de modo claro e digno a ordem legal divina à qual os mártires permanecem fiéis.
- source_word: ἀληθείας
  choice: verdade
  rationale: Mantém o substantivo grego e seu peso moral e teológico, sem reduzir de forma definitiva a relação genitiva a um simples adjetivo.
- source_word: τῆς ἀληθείας νομοθεσίας
  choice: da lei da verdade
  rationale: Conserva a estrutura genitiva e a ambiguidade genuína da expressão grega, que também pode caracterizar a lei como verdadeira.
- source_word: ἐξεπλάγησαν
  choice: ficou assombrado
  rationale: Expressa uma reação intensa de espanto e distingue o segundo verbo do primeiro, preservando o paralelismo retórico.
- source_word: τίνες
  choice: Quem
  rationale: Nas duas perguntas retóricas, o singular genérico “Quem” é idiomático em português e transmite a força universalizante do plural grego.
theological_decisions:
- issue: Metáfora dos mártires como ἀθλητάς
  choice: Manter explicitamente a metáfora como “atletas”.
  alternative: Traduzir interpretativamente como “campeões”, “combatentes” ou “lutadores”.
  rationale: A imagem descreve os que competiram pela fidelidade à lei; preservá-la respeita a retórica do autor e evita impor um sentido militar ou meramente honorífico.
- issue: Sentido de τῆς ἀληθείας νομοθεσίας
  choice: Traduzir como “a lei da verdade”.
  alternative: “A verdadeira lei”.
  rationale: A formulação conserva a relação genitiva e a tensão semântica do grego, sem decidir silenciosamente se “verdade” indica pertencimento, qualidade ou caracterização atributiva.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. As perguntas retóricas e a metáfora atlética foram mantidas; “lei da verdade” conserva deliberadamente a ambiguidade do original.
