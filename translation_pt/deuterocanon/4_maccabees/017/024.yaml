  text: And it made them noble and courageous in infantry combat and siege warfare[a], and after sacking them[c][b], he conquered all the enemies.
translation:
  language: pt
  text: E isso os tornou nobres e corajosos no combate de infantaria e na guerra de cerco[a]; e, depois de saquear[b][c], ele venceu todos os inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “para a batalha a pé”; o termo grego se refere literalmente ao combate realizado a pé.
    reason: lexical_alternative
  - marker: b
    text: O particípio grego pode significar “depois de saquear” ou “depois de devastar” e costuma ter cidades ou fortificações como objeto.
    reason: lexical_alternative
  - marker: c
    text: O grego não expressa o objeto de “saquear” e deixa implícito o referente do sujeito masculino singular nesta oração; a tradução preserva essa forma abrupta, sem especificar os referentes com base no contexto mais amplo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσχεν
  choice: tornou
  rationale: Com αὐτούς seguido de adjetivos predicativos, ἔχω tem valor causativo ou resultativo. “Tornou” expressa isso com clareza em português.
- source_word: γενναίους
  choice: nobres
  rationale: Preserva a ideia de nobreza de caráter e evita fundi-la com a coragem marcial expressa pelo adjetivo seguinte.
- source_word: ἀνδρείους
  choice: corajosos
  rationale: Transmite valor e bravura sem reproduzir a conotação de gênero que uma tradução literal como “varonis” teria hoje.
- source_word: εἰς πεζομαχίαν
  choice: para o combate de infantaria
  rationale: πεζομαχία designa combate realizado a pé. “Combate de infantaria” preserva a referência militar sem restringi-la indevidamente a combate corpo a corpo.
- source_word: πολιορκίαν
  choice: a guerra de cerco
  rationale: O substantivo indica atividade militar de cerco; a expressão mantém o paralelismo com “combate de infantaria”.
- source_word: ἐκπορθήσας
  choice: depois de saquear
  rationale: O particípio indica ação anterior e pode significar saquear ou devastar, normalmente cidades ou fortificações. O objeto não é expresso no grego e permanece implícito.
- source_word: ἐνίκησεν
  choice: venceu
  rationale: νικάω significa vencer ou derrotar; “venceu” é natural e mantém o registro militar elevado.
- source_word: πάντας τοὺς πολεμίους
  choice: todos os inimigos
  rationale: Reproduz o artigo e o plural do grego sem acrescentar o possessivo “seus”, que não está expresso.
theological_decisions:
- issue: Referente do sujeito implícito em ἔσχεν e passagem para o particípio e o verbo masculinos no singular
  choice: Usar “isso” na primeira oração e “ele” na oração final, sem identificar nenhum dos referentes.
  alternative: Explicitar um único sujeito contextual, como “a razão” ou “a mãe”, e uniformizar toda a frase.
  rationale: 'O grego comprime os referentes: começa com um verbo no singular sem sujeito nominal expresso e prossegue com particípio e verbo masculinos no singular. A tradução conserva essa mudança e não resolve pelo contexto o que o versículo deixa implícito.'
translation_notes:
  register: Português moderno, digno e acessível, com terminologia militar clara. A sintaxe final é deliberadamente abrupta para preservar a compressão e a mudança de referente presentes no grego.
