  text: But godliness won[a], crowning its own athletes.
translation:
  language: pt
  text: Mas a devoção a Deus[a] triunfava, coroando os seus próprios atletas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a piedade». O grego personifica a devoção a Deus como alguém que triunfa e coroa os seus atletas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεοσέβεια
  choice: devoção a Deus
  rationale: Expressa de modo claro e atual a reverência ou devoção dirigida especificamente a Deus, evitando que «piedade» seja entendida apenas como compaixão.
- source_word: ἐνίκα
  choice: triunfava
  rationale: Preserva o aspecto imperfeito do verbo grego e a imagem de vitória em uma competição, com formulação natural em português.
- source_word: τοὺς ἑαυτῆς
  choice: os seus próprios
  rationale: 'Mantém a referência reflexiva: os atletas pertencem à devoção personificada.'
- source_word: ἀθλητάς
  choice: atletas
  rationale: Conserva diretamente a metáfora atlética do texto grego, sem antecipar o resultado chamando-os de «campeões».
- source_word: στεφανοῦσα
  choice: coroando
  rationale: Reproduz de forma concisa a concessão da coroa ou grinalda aos vencedores e mantém a ação simultânea do particípio.
theological_decisions:
- issue: Personificação de θεοσέβεια
  choice: Manter a devoção a Deus como sujeito que triunfa e coroa os seus atletas.
  alternative: Despersonificar a expressão, explicando que os devotos de Deus venceram e foram coroados.
  rationale: O grego personifica explicitamente a devoção religiosa; preservar essa figura mantém a tensão e a força retórica sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. «Triunfava» conserva o valor imperfectivo do grego; a metáfora atlética permanece explícita.
