base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/002.yaml
  text: O mother[a], who with your seven children brought down the tyrant’s violence, and nullified his evil schemes, and displayed the nobility of faith.
translation:
  language: pt
  text: Ó mãe, tu que, com teus sete filhos, derrubaste a violência do tirano, anulaste seus planos perversos e demonstraste a nobreza da fé![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a coragem da fé” ou “a nobreza da fidelidade”; a expressão grega pode destacar tanto a nobreza demonstrada pela fé como a firmeza corajosa de uma devoção fiel.
    reason: alternativa lexical
lexical_decisions:
- source_word: Ὦ μήτηρ
  choice: Ó mãe
  rationale: Preserva o vocativo exclamativo e o tom elevado do elogio, em linguagem ainda natural e compreensível.
- source_word: σὺν ἑπτὰ παισίν
  choice: com teus sete filhos
  rationale: παῖς pode significar criança ou filho; o contexto identifica os sete como filhos da mãe. O possessivo é explicitado naturalmente pelo discurso direto.
- source_word: καταλύσασα
  choice: derrubaste
  rationale: Expressa a ideia de fazer cair, desfazer ou vencer o poder da violência tirânica. A forma verbal finita reproduz em português, com fluidez, a sequência de particípios gregos.
- source_word: τὴν τοῦ τυράννου βίαν
  choice: a violência do tirano
  rationale: βία abrange força coerciva e violência; aqui, “violência” comunica melhor a opressão cruel do tirano.
- source_word: ἀκυρώσασα
  choice: anulaste
  rationale: O verbo significa tornar sem efeito ou invalidar; “anulaste” conserva esse sentido de frustrar completamente os planos.
- source_word: τὰς κακὰς ἐπινοίας αὐτοῦ
  choice: seus planos perversos
  rationale: ἐπινοία designa plano, propósito ou artifício. “Planos perversos” é claro, atual e reflete a avaliação moral de κακάς.
- source_word: ἐπιδείξασα
  choice: demonstraste
  rationale: Transmite a ideia de mostrar publicamente ou pôr em evidência, apropriada ao caráter exemplar do elogio.
- source_word: τὴν τῆς πίστεως γενναιότητα
  choice: a nobreza da fé
  rationale: γενναιότης pode indicar nobreza moral, grandeza de ânimo ou coragem. “Nobreza da fé” preserva a construção grega e sua amplitude sem escolher apenas uma dessas nuances.
theological_decisions:
- issue: Sentido de πίστις
  choice: fé
  alternative: fidelidade
  rationale: “Fé” é a correspondência mais direta e natural, enquanto o contexto de perseverança sob perseguição também permite a nuance de fidelidade, preservada na nota.
- issue: Nuance de γενναιότης na expressão τῆς πίστεως γενναιότητα
  choice: nobreza da fé
  alternative: coragem da fé
  rationale: A opção principal mantém a qualidade moral ampla do termo grego; “coragem” é possível, mas estreitaria o sentido ao aspecto de bravura.
translation_notes:
  register: Registro elevado e encomiástico, adequado ao vocativo retórico, sem arcaísmo excessivo. A sequência de particípios do grego foi vertida por verbos coordenados na segunda pessoa para produzir uma exclamação natural em português. O marcador da nota foi colocado junto à expressão a que efetivamente se refere.
