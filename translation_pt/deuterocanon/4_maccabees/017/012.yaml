base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/012.yaml
  text: For virtue was then presiding over the contest for those being tested through endurance; the victory was in incorruptibility[a], in long-lasting life.
translation:
  language: pt
  text: Pois então a virtude presidia à competição dos que demonstravam seu valor por meio da perseverança; a vitória estava na incorruptibilidade, em vida duradoura.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vida eterna”. O grego diz literalmente “vida de longa duração”; a expressão paralela “na incorruptibilidade” pode sugerir aqui uma vida sem fim.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀθλοθέτει
  choice: presidia a competição
  rationale: O verbo pertence à linguagem das competições e apresenta a virtude personificada como quem dirige ou arbitra a disputa, não apenas como quem entrega um prêmio.
- source_word: ἀρετή
  choice: a virtude
  rationale: Mantém o termo moral central do livro e sua personificação nesta frase.
- source_word: διʼ ὑπομονῆς
  choice: por meio da perseverança
  rationale: Expressa o valor instrumental de διά e a constância firme diante do sofrimento.
- source_word: δοκιμάζουσι
  choice: aos que demonstravam seu valor
  rationale: O particípio grego tem forma ativa e pode indicar os que se mostram aprovados sob provação. A formulação preserva a ideia de prova sem convertê-la silenciosamente em uma construção passiva.
- source_word: τὸ νῖκος
  choice: a vitória
  rationale: É o equivalente direto e dá continuidade à metáfora da competição.
- source_word: ἐν ἀφθαρσίᾳ
  choice: na incorruptibilidade
  rationale: Conserva o sentido de condição imperecível sem substituir o termo por 'imortalidade', que explicitaria uma interpretação possível.
- source_word: ἐν ζωῇ πολυχρονίῳ
  choice: numa vida duradoura
  rationale: Traduz naturalmente a ideia literal de uma vida de longa duração, sem fortalecer o grego para o termo teologicamente mais definido 'vida eterna'.
theological_decisions:
- issue: Se ζωῇ πολυχρονίῳ deve ser traduzido como 'vida eterna'
  choice: vida duradoura
  alternative: vida eterna
  rationale: πολυχρόνιος indica literalmente longa duração, não usa o adjetivo grego habitual para 'eterno'. Contudo, a associação com 'incorruptibilidade' permite que o contexto sugira uma vida sem fim; essa possibilidade é mantida em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora atlética foi mantida em 'presidia a competição', e a ordem final procura conservar o paralelismo das duas expressões introduzidas por ἐν.
