  terminology: “Piedade” é adequado para εὐσέβεια neste contexto. “Honrada diante de Deus” preserva a relação expressa por θεῷ sem especificar indevidamente se Deus é o agente da honra. “Céu” conserva a leitura contextual, enquanto a nota registra a alternativa imagética “firmamento”.
