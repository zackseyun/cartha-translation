base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/005.yaml
  text: Not so does the moon stand in majesty in heaven with the stars[a], as you, having guided your seven sons, equal to the stars, toward godliness[b], have come to stand honored before God and have been established in heaven with them.
translation:
  language: pt
  text: Não está a lua tão majestosa no céu com as estrelas quanto tu, que, tendo guiado rumo à piedade os teus sete filhos, iguais às estrelas,[a] te tornaste honrada diante de Deus e foste estabelecida no céu com eles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “semelhantes às estrelas”. O verbo traduzido por “tendo guiado” também pode significar “tendo iluminado” ou “tendo conduzido à luz”, prolongando a imagem da lua e das estrelas.'
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser entendida mais literalmente como “foste firmada no firmamento com eles”; neste contexto, porém, “céu” pode indicar a honra celestial da mãe junto de seus filhos.
    reason: alternative_reading
lexical_decisions:
- source_word: σελήνη
  choice: a lua
  rationale: Termo celeste direto; embora sem artigo no grego, em português a referência natural pede o artigo definido.
- source_word: σεμνὴ καθεστήκεν
  choice: se ergue tão majestosa
  rationale: Expressa o estado elevado e digno da lua em português natural, preservando a força comparativa e solene.
- source_word: ἰσαστέρους
  choice: semelhantes às estrelas
  rationale: O composto descreve os filhos em relação às estrelas. A formulação evita sugerir identidade literal, embora também possa significar 'iguais às estrelas'.
- source_word: παῖδας
  choice: filhos
  rationale: No contexto narrativo, refere-se aos sete descendentes homens da mãe.
- source_word: φωταγωγήσασα
  choice: conduziu
  rationale: O particípio pode evocar iluminar ou conduzir à luz; 'conduziu' comunica de modo natural a orientação dos filhos rumo à piedade, com a imagem luminosa registrada em nota.
- source_word: πρὸς τὴν εὐσέβειαν
  choice: à piedade
  rationale: εὐσέβεια designa devoção reverente a Deus manifestada em fidelidade; 'piedade' é conciso e adequado ao registro elevado.
- source_word: ἔντιμος ... θεῷ
  choice: honrada diante de Deus
  rationale: Transmite a estima ou honra da mãe em relação a Deus sem acrescentar uma ideia de recompensa não explicitada.
- source_word: ἐστήρισαι
  choice: foi estabelecida
  rationale: Preserva a forma passiva e o sentido de colocação firme ou permanente.
- source_word: ἐν οὐρανῷ σὺν αὐτοῖς
  choice: no céu com eles
  rationale: Mantém a formulação grega e sua possível referência à honra celestial da mãe junto dos filhos.
theological_decisions:
- issue: Sentido de οὐρανός na cláusula final
  choice: céu
  alternative: firmamento
  rationale: O contexto de vindicação dos mártires favorece 'céu', mas a nota preserva a possibilidade de referência mais literal ao firmamento dentro da imagem astral.
- issue: Força de φωταγωγήσασα
  choice: conduziu à piedade
  alternative: iluminou ou conduziu à luz para a piedade
  rationale: A tradução principal privilegia clareza idiomática sem definir o mecanismo dessa orientação; a nota conserva a metáfora luminosa e a ambiguidade lexical.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com sintaxe fluente para leitores brasileiros. A comparação astral foi preservada, assim como a passagem do céu visível à possível realidade celestial; as ambiguidades de φωταγωγήσασα, ἰσαστέρους e οὐρανός são documentadas nas notas.
