revisions:
- from: A lua não se ergue tão majestosa no céu entre as estrelas como você, que conduziu à piedade seus sete filhos, semelhantes às estrelas,[a] tornou-se honrada diante de Deus e foi estabelecida no céu com eles.[b]
  to: Não está a lua tão majestosa no céu com as estrelas quanto tu, que, tendo guiado rumo à piedade os teus sete filhos, iguais às estrelas,[a] te tornaste honrada diante de Deus e foste estabelecida no céu com eles.[b]
  rationale: A revisão substitui a noção dinâmica de “erguer-se” por “estar ... majestosa”, mais fiel ao perfeito de καθίστημι e ao paralelismo retórico do versículo. Também restitui a relação participial de φωταγωγήσασα mediante “tendo guiado”. As notas foram ajustadas para corresponder exatamente às escolhas do texto e mantêm as alternativas lexicais e contextuais sem resolver além do que o grego permite.
