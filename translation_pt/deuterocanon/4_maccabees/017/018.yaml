  text: For Moses says[b][a], “And all the holy ones are under your hands.”
translation:
  language: pt
  text: 'Pois também Moisés diz: “E todos os que foram santificados[a] estão sob as tuas mãos[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os consagrados” ou “os santos”. O termo grego indica pessoas que foram tornadas santas ou separadas.
    reason: lexical_alternative
  - marker: b
    text: A expressão “sob as tuas mãos” pode sugerir estar sob o poder, o cuidado ou a autoridade de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: diz
  rationale: Mantém o presente literário da fórmula grega de citação e soa natural em português.
- source_word: οἱ ἡγιασμένοι
  choice: os que foram santificados
  rationale: O particípio perfeito passivo de ἁγιάζω descreve pessoas que foram tornadas santas ou separadas; a construção verbal preserva com clareza o sentido passivo e resultante.
- source_word: ὑπὸ τὰς χεῖράς σου
  choice: sob as tuas mãos
  rationale: Conserva o plural e a imagem concreta do grego, sem reduzir a expressão interpretativamente a poder, cuidado ou autoridade.
- source_word: καὶ γάρ
  choice: Pois ... também
  rationale: Representa tanto a função explicativa de γάρ como o valor aditivo de καί em uma ordem idiomática em português.
theological_decisions:
- issue: Formulação da citação atribuída a Moisés
  choice: Manter a citação direta e a imagem de estar sob as mãos de Deus
  alternative: Parafrasear como “todos os santos estão sob o teu poder”
  rationale: O texto apresenta explicitamente Moisés como quem fala e preserva uma metáfora concisa, cuja possível referência a poder, cuidado ou autoridade não deve ser resolvida no corpo do texto.
- issue: Valor passivo de οἱ ἡγιασμένοι
  choice: “os que foram santificados”
  alternative: “os santos” ou “os consagrados”
  rationale: A forma escolhida preserva a ideia de que essas pessoas foram tornadas santas ou separadas, sem definir além do grego o agente, o modo ou a finalidade dessa santificação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A ordem foi ajustada para “Moisés também diz”, e a metáfora concreta do original foi preservada.
