base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/001.yaml
  text: Some of the king’s guards also said that when she too was about to be seized for death[b][a], she threw herself onto the pyre so that they might not touch any part of her body.
translation:
  language: pt
  text: Alguns dos guardas reais[a] também diziam[b] que, quando ela também estava prestes a ser capturada para ser morta, lançou-se sobre a pira, para que eles não tocassem em nenhuma parte do seu corpo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “guarda-costas” ou, mais literalmente, “portadores de lança”. O termo grego costuma designar guardas de um soberano.
    reason: lexical_alternative
  - marker: b
    text: O versículo apresenta o acontecimento como relato de alguns guardas, não como afirmação direta e incondicional do narrador.
    reason: narrative_qualification
lexical_decisions:
- source_word: δορυφόρων
  choice: guardas reais
  rationale: Embora o termo signifique literalmente “portadores de lança”, ele designa com frequência guardas ou guarda-costas de um soberano. “Guardas reais” comunica com clareza a função institucional indicada pelo contexto.
- source_word: συλλαμβάνεσθαι
  choice: ser capturada
  rationale: O infinitivo passivo descreve o ato de ela ser fisicamente detida. “Ser capturada” preserva a força da ação sem introduzir a conotação jurídica moderna de “ser presa” ou “ser detida”.
- source_word: πρὸς θάνατον
  choice: para ser morta
  rationale: A expressão aponta para a morte como finalidade da captura. Esta formulação é mais natural em português do que o decalque “para a morte” e não especifica além do grego o método ou o estatuto jurídico da morte.
- source_word: ψαύσειέν
  choice: tocassem
  rationale: ψαύω significa tocar ou pôr as mãos em algo. “Tocassem” expressa de modo direto o contato físico que ela pretendia impedir.
- source_word: τι τοῦ σώματος αὐτῆς
  choice: nenhuma parte do seu corpo
  rationale: A construção partitiva indica que ela queria impedir contato até mesmo com qualquer parte do corpo. A formulação escolhida é clara e idiomática em português.
- source_word: ἑαυτὴν ἔρριψεν
  choice: lançou-se
  rationale: A forma reflexiva e o verbo vigoroso indicam uma ação deliberada. “Lançou-se” conserva a força do grego em registro digno e natural.
- source_word: κατὰ τῆς πυρᾶς
  choice: sobre a pira
  rationale: πυρά designa especificamente uma pira, não apenas fogo em sentido genérico. “Sobre” expressa de modo natural o movimento dirigido à pira, sem apagar a imagem concreta.
theological_decisions:
- issue: Caracterização narrativa do ato final da mãe
  choice: Apresentar o ato como relato atribuído a alguns guardas, segundo o qual ela se lançou deliberadamente sobre a pira antes que a capturassem e tocassem seu corpo.
  alternative: Apresentar o acontecimento diretamente como declaração incondicional do narrador ou suavizar a violência do ato.
  rationale: A introdução ἔλεγον ... τινές, “alguns ... diziam”, cria distância narrativa e atribui a afirmação a testemunhas específicas. A tradução mantém essa qualificação sem atenuar nem explicar teologicamente o ato.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Pira” conserva a imagem específica do grego; “capturada para ser morta” torna natural a finalidade expressa por πρὸς θάνατον. Os marcadores [a] e [b] aparecem no texto principal.
