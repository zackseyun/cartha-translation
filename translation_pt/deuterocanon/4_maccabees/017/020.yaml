  text: e que o tirano fosse punido e a pátria fosse purificada[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «limpa». O grego pode indicar purificação de uma impureza em sentido ritual, moral ou nacional.'
