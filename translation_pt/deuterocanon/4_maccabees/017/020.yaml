lexical_decisions:
- source_word: τύραννον
  choice: o tirano
  rationale: Preserva a caracterização polêmica e moralmente negativa do governante, sem substituí-la pelo termo neutro «rei».
- source_word: τιμωρηθῆναι
  choice: fosse punido
  rationale: Expressa com naturalidade o infinitivo aoristo passivo e mantém seu sentido judicial ou retributivo sem especificar vingança.
- source_word: πατρίδα
  choice: a pátria
  rationale: Comunica a terra ancestral ou o país de origem e conserva a ressonância afetiva e coletiva do termo grego.
- source_word: καθαρισθῆναι
  choice: purificada
  rationale: Mantém o registro elevado e deixa em aberto as dimensões ritual, moral e nacional da purificação.
theological_decisions:
- issue: Sentido da purificação da pátria
  choice: «a pátria, purificada»
  alternative: «a pátria, limpa»
  rationale: «Purificada» preserva a amplitude de καθαρισθῆναι, que pode envolver remoção de impureza ritual, moral ou nacional, sem reduzir a expressão a libertação política ou limpeza física.
translation_notes:
  register: Português moderno, claro e digno. A elipse de «fosse» antes de «purificada» evita repetição pesada, sem alterar o paralelismo dos dois infinitivos passivos gregos.
