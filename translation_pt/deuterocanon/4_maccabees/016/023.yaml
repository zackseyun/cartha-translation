  rationale: 'A revisão restaura a estrutura sintática básica do grego: «é irracional» introduz a avaliação, enquanto «os que sabem ser piedosos» designa os envolvidos e «não resistam aos sofrimentos» é a ação avaliada. Assim, evita-se tanto inserir uma declaração independente sobre a racionalidade da piedade quanto transformar o enunciado em narrativa no passado. A formulação conserva a linguagem teológica tradicional, mas compreensível, de εὐσεβεῖν.'
