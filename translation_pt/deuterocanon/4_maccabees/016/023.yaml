  text: For[a], though they knew that reverence toward God is not irrational, they did not shrink back from the pains.
translation:
  language: pt
  text: Pois[a] é irracional que os que sabem ser piedosos não resistam aos sofrimentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Pois é irracional que, sabendo ser piedosos, não resistam aos sofrimentos”. O grego é condensado: o adjetivo “irracional” funciona como predicado impessoal da construção com “não resistir aos sofrimentos”.'
    reason: Esclarece a construção sintática comprimida e preserva o vínculo de “irracional” com a ação de não resistir, sem resolver além do necessário a nuance de εὐσεβεῖν.
lexical_decisions:
- source_word: ἀλόγιστον
  choice: não é irracional
  rationale: Preserva a negação e o sentido de algo contrário à razão, em harmonia com o tema recorrente do livro, sem substituir a formulação grega por uma afirmação positiva.
- source_word: εἰδότας
  choice: embora soubessem
  rationale: O particípio acusativo fornece a circunstância de fundo; a formulação concessiva expressa de modo natural a relação contextual com a disposição de enfrentar o sofrimento.
- source_word: εὐσεβεῖν
  choice: reverenciar a Deus
  rationale: O verbo indica agir piedosamente ou mostrar reverência; a explicitação de Deus torna claro para o leitor moderno o referente religioso implícito, sem introduzir conteúdo sectário.
- source_word: μὴ ἀνθίστασθαι
  choice: não recuaram diante de
  rationale: Embora o verbo signifique literalmente não resistir ou não se opor, junto de πόνοις a expressão idiomática comunica que eles não se retraíram perante os sofrimentos.
- source_word: τοῖς πόνοις
  choice: dos sofrimentos
  rationale: πόνος pode designar dor, aflição ou sofrimento. O plural 'sofrimentos' é natural no contexto dos mártires e evita intensificar indevidamente para 'torturas'.
theological_decisions:
- issue: Relação entre piedade e razão em 4 Macabeus
  choice: A reverência a Deus não é irracional.
  alternative: É irracional ser piedoso e não resistir aos sofrimentos.
  rationale: A sintaxe grega é compacta e admite dificuldade de segmentação, mas a leitura escolhida é a mais coerente com o argumento imediato e com a tese central de 4 Macabeus de que a razão piedosa domina as paixões. A nota conserva visível a forma mais literal e a ambiguidade sintática.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. 'Reverenciar a Deus' explicita com naturalidade a orientação religiosa de εὐσεβεῖν; 'não recuaram diante dos sofrimentos' comunica idiomaticamente a perseverança no contexto martirológico. O marcador [a] aparece no texto principal.
