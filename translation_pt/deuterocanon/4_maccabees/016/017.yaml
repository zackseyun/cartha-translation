  text: willingly for the ancestral law[a]. For it is shameful that this old man should endure the pains that come because of godliness[b], but you—
translation:
  language: pt
  text: de bom grado pela lei ancestral. Pois é vergonhoso que este ancião suporte as dores por causa da devoção a Deus[a], mas vocês—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa da piedade”. A palavra grega pode indicar reverência ou devoção fiel a Deus.
    reason: lexical_alternative
  - marker: b
    text: A frase fica incompleta neste versículo e continua no seguinte.
    reason: cross_reference
lexical_decisions:
- source_word: προθύμως
  choice: de bom grado
  rationale: Expressa disposição voluntária e pronta, sem intensificar indevidamente o aspecto emocional.
- source_word: ὑπὲρ τοῦ πατρίου νόμου
  choice: pela lei dos antepassados
  rationale: ὑπέρ com o genitivo indica agir ou sofrer em favor de algo; πατρίος designa o que foi recebido dos antepassados. A formulação é natural e preserva o contexto da lei judaica herdada.
- source_word: αἰσχρόν
  choice: vergonhoso
  rationale: Conserva o sentido de vergonha moral e a força exortativa da declaração.
- source_word: γέροντα
  choice: ancião
  rationale: Refere-se a um homem idoso e mantém, em português corrente e digno, o contraste retórico com os jovens interpelados.
- source_word: ὑπομεῖναι
  choice: suporte
  rationale: O infinitivo dependente de αἰσχρόν descreve perseverança sob sofrimento; o presente do subjuntivo produz uma construção portuguesa natural sem decidir além do grego se o foco recai no ato visto como fato ou exemplo.
- source_word: ἀλγηδόνας
  choice: as dores
  rationale: É a equivalência lexical direta; evita o reforço interpretativo de “torturas”, embora o contexto envolva sofrimento severo.
- source_word: διὰ τὴν εὐσέβειαν
  choice: por causa da devoção a Deus
  rationale: εὐσέβεια denota reverência ou devoção fiel, aqui orientada a Deus. A explicitação do referente torna o sentido claro em português moderno, sem reduzir a expressão à mera religiosidade exterior.
theological_decisions:
- issue: Sentido de εὐσέβεια no contexto do martírio
  choice: devoção a Deus
  alternative: piedade
  rationale: A expressão comunica reverência e fidelidade religiosa voltadas para Deus. “Piedade” é possível, mas pode ser entendida no português atual principalmente como compaixão; por isso, foi preservada em nota como alternativa lexical.
- issue: Incompletude sintática no fim do versículo
  choice: travessão após “enquanto vocês”
  alternative: completar a comparação com conteúdo do versículo seguinte
  rationale: O texto grego termina em ὑμᾶς δέ e deixa a contraposição em suspenso. O travessão preserva essa tensão sem importar para este versículo palavras do seguinte.
translation_notes:
  register: 'Português moderno, claro e digno, com boa legibilidade brasileira. “Ancião” evita a possível aspereza coloquial de “velho”, e o travessão final reproduz a interrupção do texto-fonte. Os marcadores foram associados ao conteúdo correto: [a] a εὐσέβεια e [b] à frase incompleta.'
