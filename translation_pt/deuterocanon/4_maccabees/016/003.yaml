base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/003.yaml
  text: And the lions around Daniel were not so savage[a], nor the blazing furnace with its fiercest fire against Mishael, as that mother's own nature was inflamed by love for her children when she saw her seven sons being tortured.
translation:
  language: pt
  text: E nem os leões ao redor de Daniel eram tão ferozes, nem a fornalha ardente contra Misael, com seu fogo violentíssimo, quanto se abrasava[a] a natureza daquela mãe, por amor aos filhos, ao ver seus sete filhos sendo torturados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ardia ainda mais intensamente”. O raro verbo grego emprega uma imagem de fogo para descrever a angústia interior da mãe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ περὶ Δανιὴλ λέοντες
  choice: os leões ao redor de Daniel
  rationale: A expressão idiomática οἱ περὶ com nome próprio indica os que estavam ao redor ou associados à pessoa; aqui, os leões do episódio de Daniel.
- source_word: ἄγριοι
  choice: ferozes
  rationale: Expressa a ferocidade ameaçadora dos leões de modo natural em português.
- source_word: Μισαὴλ
  choice: Misael
  rationale: Forma tradicional e amplamente reconhecível em português para o nome bíblico representado pelo grego Μισαήλ.
- source_word: ἐκφλεγομένη κάμινος
  choice: a fornalha ardente
  rationale: Mantém a imagem ativa de uma fornalha em chamas com formulação corrente e digna.
- source_word: λαβροτάτῳ πυρί
  choice: com seu fogo violentíssimo
  rationale: O superlativo intensifica a violência impetuosa do fogo; “violentíssimo” conserva explicitamente essa força.
- source_word: φιλοτεκνίας
  choice: por amor aos filhos
  rationale: O substantivo denota afeição pelos próprios filhos; a formulação é clara sem reduzir o termo a mero sentimento genérico.
- source_word: πειράλειεν
  choice: se abrasava
  rationale: O verbo raro emprega imagem de fogo para o sofrimento interior da mãe; “abrasava” preserva a metáfora e sustenta a comparação com a fornalha.
- source_word: ἐκείνη φύσις
  choice: a natureza daquela mãe
  rationale: Explicita o referente contextual de φύσις sem transformar a expressão em uma interpretação psicológica mais específica.
- source_word: ὁρῶσα
  choice: ao ver
  rationale: Reproduz de modo conciso o particípio circunstancial e mantém a ligação temporal e causal com a aflição materna.
- source_word: βασανιζομένους
  choice: sendo torturados
  rationale: No contexto do martírio, o verbo indica tortura física, não simples provação ou angústia.
theological_decisions:
- issue: Imagem metafórica do fogo aplicada ao estado interior da mãe
  choice: se abrasava
  alternative: era atormentada / ficava profundamente abalada
  rationale: A comparação retórica reúne leões, fornalha e sofrimento materno. Conservar a imagem de combustão evita achatar a tensão poética e não impõe uma explicação doutrinária ao estado da mãe.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A construção correlativa “nem... nem... quanto” conserva a comparação enfática do grego; “natureza daquela mãe” mantém φύσις sem substituir o termo por “coração” ou “sentimentos”.
