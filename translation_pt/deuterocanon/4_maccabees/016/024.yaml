  text: By these words the mother of seven[a], encouraging each one of her sons, persuaded them rather to die than to transgress the commandment of God[b];
translation:
  language: pt
  text: Com essas palavras[a], a mãe de sete filhos, encorajando[b] cada um de seus filhos, convenceu-os a morrer em vez de transgredir o mandamento de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por meio dessas palavras”.'
    reason: A construção grega pode indicar meio ou instrumentalidade.
  - marker: b
    text: 'Ou: “exortando”.'
    reason: O verbo grego pode abranger tanto encorajamento quanto exortação insistente.
lexical_decisions:
- source_word: Διὰ τούτων τῶν λόγων
  choice: Com essas palavras
  rationale: διά com o genitivo expressa aqui meio ou instrumentalidade. “Com essas palavras” é natural em português e mantém essa força sem tornar a relação mais causal do que o grego exige.
- source_word: ἡ ἑπτάμητωρ
  choice: a mãe de sete
  rationale: O composto grego designa de modo conciso uma mulher que é mãe de sete. A formulação preserva o epíteto retórico, enquanto “filhos” aparece explicitamente logo depois.
- source_word: ἕνα ἕκαστον τῶν υἱῶν
  choice: cada um de seus filhos
  rationale: A expressão é distributiva e enfática, destacando a atuação da mãe sobre cada filho individualmente. “Seus” é uma explicitação idiomática clara em português.
- source_word: παρακαλοῦσα
  choice: encorajando
  rationale: O particípio pode comunicar encorajamento, exortação ou apelo. No contexto, combina fortalecimento moral e estímulo à perseverança; a nota conserva a alternativa mais incisiva.
- source_word: ἔπεισε
  choice: convenceu-os
  rationale: πείθω significa persuadir ou convencer. O pronome retoma naturalmente os filhos mencionados na oração.
- source_word: μᾶλλον ἀποθανεῖν, ἢ παραβῆναι
  choice: a morrer em vez de transgredir
  rationale: A construção comparativa apresenta a morte como preferível à desobediência. “Em vez de” reproduz essa oposição de modo corrente, e “transgredir” mantém o peso moral e jurídico.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: o mandamento de Deus
  rationale: “Mandamento” preserva o sentido formal e religioso de ἐντολή e se ajusta ao registro bíblico sem acrescentar conteúdo doutrinário.
theological_decisions:
- issue: Explicitar “filhos” na tradução de ἑπτάμητωρ
  choice: a mãe de sete
  alternative: a mãe de sete filhos
  rationale: O epíteto grego não contém separadamente o termo “filhos”, que aparece na expressão seguinte. A escolha mantém a concisão retórica e evita repetição.
- issue: Registro de παραβῆναι τὴν ἐντολὴν τοῦ θεοῦ
  choice: transgredir o mandamento de Deus
  alternative: desobedecer ao mandamento de Deus
  rationale: “Transgredir” conserva a gravidade moral e legal da fidelidade ao mandamento sob perseguição, sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe mantém o movimento do período grego, mas evita construções artificiais; o vocabulário conserva o tom moral e religioso do contexto.
