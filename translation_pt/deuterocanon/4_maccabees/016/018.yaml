lexical_decisions:
- source_word: τοὺς νεωτέρους
  choice: os mais jovens
  rationale: O comparativo substantivado designa os membros mais jovens do grupo; a formulação evita acrescentar “homens” ou “irmãos”, termos não expressos neste trecho.
- source_word: καταπλαγῆναι τὰς βασάνους
  choice: fiquem aterrorizados com as torturas
  rationale: O infinitivo passivo indica ser tomado de medo ou choque, e βάσανοι designa aqui as torturas. A forma com “que ... fiquem” conserva a dependência sintática do fragmento grego.
- source_word: ἀναμνήσθητε
  choice: Lembrem-se
  rationale: Imperativo aoristo plural que convoca os destinatários a trazer deliberadamente algo à memória; “Lembrem-se” é corrente, claro e digno.
- source_word: διὰ τὸν θεὸν
  choice: por causa de Deus
  rationale: διά com acusativo exprime causa ou motivo. A tradução não acrescenta um título divino que o texto não torna sintaticamente inequívoco.
- source_word: τοῦ κόσμου μετελάβετε
  choice: vocês tiveram parte no mundo
  rationale: O genitivo τοῦ κόσμου pode funcionar como complemento de μετελάβετε, em paralelo com τοῦ βίου ἀπελαύσατε. “Tiveram parte no mundo” preserva essa construção e soa mais natural que “participaram do mundo”.
- source_word: τοῦ βίου ἀπελαύσατε
  choice: desfrutaram da vida
  rationale: ἀπολαύω com genitivo significa desfrutar ou obter o benefício de algo; a tradução reproduz diretamente esse sentido.
theological_decisions:
- issue: Relação sintática de τοῦ κόσμου
  choice: 'Ligar τοῦ κόσμου a μετελάβετε: “tiveram parte no mundo”'
  alternative: 'Ligar τοῦ κόσμου a θεόν: “por causa do Deus do mundo, vocês tiveram parte nisso”'
  rationale: A proximidade permite as duas análises, mas o paralelismo entre τοῦ κόσμου μετελάβετε e τοῦ βίου ἀπελαύσατε favorece tomar ambos os genitivos como complementos dos respectivos verbos. A nota registra a alternativa sem transformar “soberano” em parte explícita do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega “vocês” para a segunda pessoa plural, evita arcaísmos e conserva tanto o caráter fragmentário da primeira oração quanto a ambiguidade sintática de τοῦ κόσμου.
