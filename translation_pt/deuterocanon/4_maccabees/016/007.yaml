base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/007.yaml
  text: O seven futile pregnancies[a], and seven useless ten-month terms, and fruitless nursing[b], and miserable suckling.
translation:
  language: pt
  text: Ó sete gestações vãs, e sete períodos inúteis de dez meses[a], e amamentações sem fruto, e penosos cuidados de nutrir com leite![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sete períodos de dez meses”, segundo a antiga maneira de contar a duração normal da gestação.
    reason: cultural_note
  - marker: b
    text: O grego forma uma série de exclamações breves, sem verbos expressos; a tradução preserva esse estilo condensado de lamentação.
    reason: literary_form
lexical_decisions:
- source_word: μάταιοι
  choice: vãs
  rationale: Expressa que, na perspectiva do lamento materno, as gestações parecem ter acabado sem o resultado esperado; mantém o tom elevado sem afirmar que os filhos não tinham valor.
- source_word: κυοφορίαι
  choice: gestações
  rationale: Designa o ato ou período de trazer filhos no ventre; é claro e natural em português.
- source_word: ἀνόνητοι
  choice: inúteis
  rationale: Indica aquilo que não trouxe proveito; conserva a distinção em relação a ἄκαρποι.
- source_word: δεκάμηνοι
  choice: períodos de dez meses
  rationale: Preserva a referência literal à antiga contagem da duração da gestação, deixando a explicação cultural para a nota.
- source_word: ἄκαρποι
  choice: sem fruto
  rationale: Mantém a metáfora de ausência de resultado sem sugerir esterilidade literal.
- source_word: τιθηνίαι
  choice: cuidados de amamentação
  rationale: Abrange o cuidado de nutrir bebês, especialmente ao peito, e evita a possível leitura de que se trata de uma ama de leite.
- source_word: ταλαίπωροι
  choice: penosas
  rationale: Comunica sofrimento e aflição ligados ao esforço materno, em registro digno e corrente.
- source_word: γαλακτοτροφίαι
  choice: criações ao leite
  rationale: Reproduz o sentido do composto, nutrir ou criar com leite, distinguindo-o de τιθηνίαι sem recorrer a formulação clínica.
theological_decisions:
- issue: Série de exclamações sem verbo finito
  choice: Mantida como uma sequência compacta de sintagmas exclamativos.
  alternative: Expandir para frases como “minhas sete gestações foram vãs”.
  rationale: O grego apresenta uma lamentação elíptica; acrescentar verbos e possessivos resolveria uma ambiguidade formal que o texto não explicita.
- issue: Expressão gestacional antiga δεκάμηνοι
  choice: “períodos de dez meses”, com nota explicativa.
  alternative: “gestações completas” ou “meses de gravidez”.
  rationale: A tradução conserva a particularidade cultural do original sem induzir o leitor moderno a tomá-la como afirmação médica contemporânea.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência poética de lamento. “Ó” preserva a força exclamativa; os termos paralelos foram diferenciados para refletir a variação lexical do grego.
