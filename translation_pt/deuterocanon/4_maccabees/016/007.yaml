  naturalness: “Ó sete gestações vãs” preserva adequadamente o lamento elevado. “Períodos inúteis de dez meses” é claro, embora deliberadamente marcado pela nota cultural. “Amamentações sem fruto” e “penosos cuidados de nutrir com leite” soam mais idiomáticos e inteligíveis do que as formulações do rascunho.
