lexical_decisions:
- source_word: διὰ τοῦτο
  choice: por isso
  rationale: Retoma o argumento anterior e exprime sua consequência de forma natural e concisa em português.
- source_word: ὀφίλετε
  choice: vocês devem
  rationale: Expressa obrigação moral em tom exortativo, sem chegar à ideia de coerção absoluta.
- source_word: πάντα πόνον
  choice: todo sofrimento
  rationale: No contexto de martírio, πόνος abrange dor e aflição; 'todo sofrimento' é natural em português e mantém o valor abrangente de πάντα.
- source_word: ὑπομένειν
  choice: suportar
  rationale: Comunica permanecer firme sob o sofrimento e se encaixa naturalmente com o complemento escolhido.
- source_word: διὰ τὸν θεόν
  choice: por causa de Deus
  rationale: Preserva a relação de motivo ou causa expressa por διά com acusativo, sem acrescentar uma formulação devocional mais interpretativa.
theological_decisions:
- issue: Força da obrigação moral em ὀφίλετε
  choice: vocês devem
  alternative: vocês precisam
  rationale: '''Devem'' preserva a obrigação exortativa do grego; ''precisam'' poderia sugerir necessidade mais absoluta.'
- issue: Sentido de διὰ τὸν θεόν
  choice: por causa de Deus
  alternative: por amor a Deus
  rationale: A opção escolhida conserva a amplitude causal ou motivacional do grego; 'por amor a Deus' explicitaria uma motivação que o texto não nomeia diretamente.
translation_notes:
  register: Português moderno, claro e digno, com plural explícito em 'vocês'. A formulação é próxima do grego, mas evita a expressão pouco idiomática 'toda dor' neste contexto abrangente de sofrimento e martírio.
