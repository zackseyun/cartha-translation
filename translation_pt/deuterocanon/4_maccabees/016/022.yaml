  text: So you also[a], having the same faith toward God[b], do not be distressed.
translation:
  language: pt
  text: Portanto, vocês também, tendo a mesma fé em Deus[a], não se aflijam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a mesma confiança em Deus”. O termo grego também pode ter o sentido de confiança ou fidelidade, conforme o contexto.
    reason: lexical_alternative
  - marker: b
    text: Ou “não fiquem amargurados”, “não se irritem” ou “não se perturbem”. O verbo pode indicar aflição, irritação ou ira.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμεῖς οὖν
  choice: Portanto, vocês também
  rationale: Expressa de modo natural a inferência de οὖν, a continuidade de καί e a ênfase inclusiva de ὑμεῖς.
- source_word: τὴν αὐτὴν πίστιν
  choice: a mesma fé
  rationale: 'Mantém o sentido amplo de πίστις neste contexto: a postura de confiança e compromisso com Deus compartilhada com os mártires, sem reduzi-la apenas a fidelidade ou confiança subjetiva.'
- source_word: πρὸς τὸν θεόν
  choice: em Deus
  rationale: Embora πρός indique literalmente orientação ou relação para com Deus, “fé em Deus” é a formulação portuguesa corrente e comunica naturalmente essa relação.
- source_word: ἔχοντες
  choice: tendo
  rationale: Preserva a construção participial e sua relação circunstancial com a exortação seguinte.
- source_word: μὴ χαλεπαίνητε
  choice: não se aflijam
  rationale: Reproduz a ideia contextual de sofrimento, perturbação ou desgosto sem restringir o verbo ao sentido de ira.
theological_decisions:
- issue: Sentido de πίστις
  choice: fé
  alternative: confiança; fidelidade
  rationale: “Fé” conserva a amplitude lexical e a continuidade teológica do termo. Aqui se refere à postura dos ouvintes diante de Deus; as nuances de confiança e fidelidade permanecem possíveis e são registradas em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O uso de “vocês” torna explícito o plural de ὑμεῖς; “fé em Deus” privilegia a naturalidade sem eliminar em nota a amplitude de πίστις, e “não se aflijam” mantém aberto o campo emocional de χαλεπαίνω.
