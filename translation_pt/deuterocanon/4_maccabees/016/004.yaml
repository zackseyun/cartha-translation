  text: But by the reasoning of godliness the mother extinguished passions so many and so great[a][b].
translation:
  language: pt
  text: Mas, pelo raciocínio da devoção a Deus, a mãe extinguiu paixões tão numerosas e tão grandes.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “tantas e tão grandes paixões”.'
    reason: Preserva a formulação enfática dos dois correlativos gregos, enquanto o texto principal emprega uma ordem mais natural em português.
  - marker: b
    text: “Devoção a Deus” também pode ser traduzido por “piedade”. O termo grego indica reverência devota para com Deus.
    reason: Registra a alternativa lexical principal para εὐσέβεια sem enfraquecer o sentido religioso do termo.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca o forte contraste com o contexto anterior de modo conciso e natural em português.
- source_word: τῷ λογισμῷ
  choice: pelo raciocínio
  rationale: Preserva o dativo instrumental e o sentido de deliberação racional, termo central na argumentação de 4 Macabeus.
- source_word: τῆς εὐσεβείας
  choice: da devoção a Deus
  rationale: Expressa a reverência religiosa indicada por εὐσέβεια e evita que o leitor entenda uma devoção meramente humana ou genérica.
- source_word: κατέσβεσε
  choice: extinguiu
  rationale: Mantém a metáfora vívida de apagar ou sufocar algo como se apaga um fogo.
- source_word: τοσαῦτα καὶ τηλικαῦτα
  choice: tão numerosas e tão intensas
  rationale: Reproduz a ênfase dupla na quantidade e na magnitude, em formulação natural no português atual.
- source_word: πάθη
  choice: paixões
  rationale: No vocabulário filosófico de 4 Macabeus, designa emoções ou impulsos submetidos ao domínio da razão; “paixões” conserva esse valor técnico.
- source_word: ἡ μήτηρ
  choice: a mãe
  rationale: Segue diretamente o substantivo com artigo do grego, sem acrescentar um possessivo ausente do texto.
theological_decisions:
- issue: Relação entre λογισμός e εὐσέβεια
  choice: pelo raciocínio da devoção a Deus
  alternative: pela razão piedosa
  rationale: A formulação escolhida conserva os dois elementos e a relação genitiva entre eles, sem reduzir a devoção a simples racionalidade nem transformar de modo inequívoco o genitivo em mero adjetivo.
- issue: Sentido de πάθη
  choice: paixões
  alternative: sofrimentos
  rationale: O tema do livro favorece as emoções e impulsos dominados pela razão; ainda assim, “sofrimentos” é lexicalmente possível, por isso a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem inicial “pelo raciocínio...” acompanha a ênfase do grego; “devoção a Deus” esclarece o sentido religioso sem introduzir terminologia confessional.
