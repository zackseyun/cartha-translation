  text: For even when you were arrested with your children, you stood watching Eleazar being tortured, and—
translation:
  language: pt
  text: Pois, mesmo quando você foi presa com seus filhos, permaneceu de pé, vendo Eleazar ser torturado, e—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνελήμφθης
  choice: você foi presa
  rationale: O aoristo passivo de συλλαμβάνω, neste contexto, indica ser detida ou capturada; «foi presa» é natural e preciso em português.
- source_word: μετὰ τῶν παίδων
  choice: com seus filhos
  rationale: παῖδες pode significar crianças, filhos ou servos; o contexto da mãe e de seus sete filhos favorece claramente «seus filhos».
- source_word: εἱστήκεις
  choice: permaneceu de pé
  rationale: O mais-que-perfeito com valor estativo descreve a mulher em pé; «permaneceu de pé» conserva a postura e sugere sua constância sem acrescentar uma interpretação abstrata.
- source_word: ὁρῶσα
  choice: vendo
  rationale: 'O particípio presente feminino indica ação simultânea: ela permanecia em pé enquanto via o sofrimento de Eleazar.'
- source_word: βασανιζόμενον
  choice: ser torturado
  rationale: O particípio presente passivo expressa que Eleazar estava sendo submetido a tortura.
theological_decisions:
- issue: Frase interrompida no texto-fonte fornecido
  choice: encerrar com «e—»
  alternative: encerrar apenas com «e» ou completar a oração a partir do versículo seguinte
  rationale: O trecho grego termina em καί e está sintaticamente incompleto. O travessão preserva de modo transparente a continuação interrompida, sem importar palavras do versículo seguinte.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por «você» coerente com a apóstrofe direta à mãe. A redação preserva a estrutura incompleta do testemunho grego fornecido.
