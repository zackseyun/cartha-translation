base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/014.yaml
  text: O mother, soldier of devotion to God, though old and a woman, by endurance you conquered even a tyrant, and in deeds and words you were found stronger than a man.
translation:
  language: pt
  text: Ó mãe, soldado da devoção a Deus[a], embora idosa e mulher, pela perseverança venceste até mesmo um tirano e foste considerada, em atos e palavras, mais forte que um homem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “piedade para com Deus”. O termo grego pode indicar reverência, piedade ou devoção religiosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσέβειαν θεοῦ
  choice: devoção a Deus
  rationale: εὐσέβεια expressa reverência, piedade ou devoção religiosa; com θεοῦ, a formulação indica naturalmente devoção dirigida a Deus.
- source_word: στρατιῶτι
  choice: soldado
  rationale: Preserva a metáfora militar aplicada à mãe, sem ampliar o sentido para uma imagem mais livre como “guerreira”.
- source_word: πρεσβῦτι καὶ γυνή
  choice: embora idosa e mulher
  rationale: 'A construção concessiva torna explícita a força retórica do contexto: ela venceu apesar da idade avançada e de ser mulher, em contraste deliberado com “um homem” no fim do versículo.'
- source_word: διὰ καρτερίαν
  choice: pela perseverança
  rationale: καρτερία denota firmeza e resistência constante diante do sofrimento; “pela perseverança” conserva o valor causal ou instrumental de διά.
- source_word: τύραννον ἐνίκησας
  choice: venceste até mesmo um tirano
  rationale: “Venceste” traduz diretamente a ideia de vitória em ἐνίκησας; “até mesmo” comunica a ênfase retórica diante do poder aparentemente superior do tirano.
- source_word: ἔργοις ... καὶ λόγοις
  choice: em atos e palavras
  rationale: Mantém o paralelismo e o contraste entre aquilo que ela fez e aquilo que disse, em linguagem portuguesa clara e digna.
- source_word: δυνατωτέρα ... ἀνδρός
  choice: mais forte que um homem
  rationale: Conserva o comparativo explícito e o contraste de gênero presente no grego, sem neutralizá-lo.
- source_word: εὑρέθης
  choice: foste considerada
  rationale: Reproduz a forma passiva do grego e sua ideia de que ela foi reconhecida ou constatada como superior em força.
theological_decisions:
- issue: Sentido religioso de εὐσέβεια
  choice: devoção a Deus
  alternative: piedade para com Deus
  rationale: “Devoção a Deus” comunica de modo atual a reverência e fidelidade religiosa do termo sem transformá-lo em tecnicismo confessional; a alternativa legítima é registrada em nota.
- issue: Contraste entre mulher e homem
  choice: manter “mulher” e “um homem”
  alternative: neutralizar como “mais forte que qualquer pessoa”
  rationale: O contraste é parte intencional do argumento retórico do texto grego e deve ser preservado, embora reflita as categorias sociais pressupostas pelo autor.
translation_notes:
  register: Português moderno, amplamente compreensível e com legibilidade brasileira. Emprega-se a segunda pessoa do singular (“venceste”) por se tratar de apóstrofe direta e solene. “Soldado” mantém a metáfora militar do grego, ainda que esteja em aposição a uma mulher.
