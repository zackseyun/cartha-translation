  source_fidelity: A tradução preserva bem a firmeza expressa por ἀδάμαντινον, a referência ao número dos filhos, a intensificação de μᾶλλον e a dimensão religiosa de εὐσεβείας. Contudo, «na imortalidade» enfraquece a direção/objetivo de εἰς ἀθανασίαν; «rumo à imortalidade» a preserva melhor. A construção final também deve distinguir com maior clareza a exortação (προετρέπετο) da súplica concomitante (ἱκετεύουσα).
  naturalness: «Fazendo repercutir rumo à imortalidade o número de seus filhos» permanece deliberadamente incomum, como o grego, mas é compreensível com a nota. «Ela lhes suplicava ... que avançassem» torna a súplica o verbo principal e dilui a ideia de que ela os instava; «os exortava ... suplicando-lhes» é mais claro e natural.
  terminology: «Mente firme como diamante» e «devoção a Deus» são adequados em português moderno. «Devoção a Deus» comunica a orientação teológica de εὐσέβεια sem lhe atribuir sentido confessional específico.
