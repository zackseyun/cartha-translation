revisions:
- from: Mas, com a mente firme como diamante e fazendo repercutir na imortalidade o número de seus filhos[a], ela lhes suplicava com ainda mais insistência que avançassem para a morte por causa da devoção a Deus.
  to: Mas, com a mente firme como diamante e fazendo repercutir rumo à imortalidade o número de seus filhos[a], ela os exortava ainda mais a enfrentar a morte por causa da devoção a Deus, suplicando-lhes.
  rationale: A revisão troca «na imortalidade» por «rumo à imortalidade» para representar melhor εἰς e reformula a oração principal para que «exortava» traduza προετρέπετο, enquanto «suplicando-lhes» traduza o particípio ἱκετεύουσα. A formulação metafórica relativa ao número dos filhos é mantida, com nota que preserva a incerteza lexical.
