base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/013.yaml
  text: But[a], having a mind like adamant, and sending the number of her sons on to immortality, she was all the more urging them toward death for the sake of godliness, pleading with them.
translation:
  language: pt
  text: Mas, com a mente firme como diamante e fazendo repercutir rumo à imortalidade o número de seus filhos[a], ela os exortava ainda mais a enfrentar a morte por causa da devoção a Deus, suplicando-lhes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “encaminhando para a imortalidade o número de seus filhos”. O particípio grego é raro e metafórico, podendo sugerir impacto, resposta ou ressonância; por isso, a imagem exata é incerta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδάμαντινον
  choice: firme como diamante
  rationale: Preserva a imagem de dureza extrema e resistência inquebrantável, ao mesmo tempo que soa natural em português atual.
- source_word: νοῦν
  choice: mente
  rationale: Traduz diretamente a faculdade interior de pensamento e compreensão; “determinação” explicaria a ideia, mas reduziria a metáfora.
- source_word: ἀντικτυποῦσα
  choice: fazendo repercutir
  rationale: O particípio é raro e metafórico, com a ideia de produzir impacto, resposta ou ressonância. “Fazendo repercutir” conserva a imagem incomum sem impor uma explicação precisa demais.
- source_word: εἰς ἀθανασίαν
  choice: na imortalidade
  rationale: Expressa o movimento ou âmbito visado pela preposição εἰς. Em conjunto com “repercutir”, mantém a formulação metafórica do grego.
- source_word: τὸν τῶν υἱῶν ἀριθμόν
  choice: o número de seus filhos
  rationale: Mantém a referência coletiva e quantitativa do original; “seus” é fornecido naturalmente pelo contexto.
- source_word: μᾶλλον
  choice: com ainda mais insistência
  rationale: Comunica a intensificação comparativa da exortação de modo idiomático em português.
- source_word: εὐσεβείας
  choice: devoção a Deus
  rationale: Torna explícita a orientação divina do termo sem o transformar em formulação doutrinária técnica; no contexto, envolve fidelidade religiosa vivida até a morte.
- source_word: προετρέπετο
  choice: que avançassem
  rationale: No contexto da construção com ἐπὶ τὸν θάνατον, transmite a exortação ativa a seguir em direção à morte. A força exortativa também aparece em “suplicava”.
- source_word: ἱκετεύουσα
  choice: suplicava
  rationale: Preserva a intensidade emocional do particípio e sua relação com a insistente exortação materna.
theological_decisions:
- issue: Sentido de εὐσέβεια no contexto do martírio
  choice: devoção a Deus
  alternative: piedade; reverência; fidelidade religiosa
  rationale: A expressão conserva a orientação para Deus e a dimensão prática de fidelidade, sem importar um sentido confessional posterior.
- issue: Interpretação de καὶ εἰς ἀθανασίαν ἀντικτυποῦσα τὸν τῶν υἱῶν ἀριθμόν
  choice: fazendo repercutir na imortalidade o número de seus filhos
  alternative: encaminhando para a imortalidade o número de seus filhos
  rationale: O grego é denso, raro e metafórico. A tradução principal preserva sua imagem de impacto ou ressonância; a nota registra uma leitura direcional mais clara sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi ajustada para fluidez, mas a metáfora incomum ligada ao número dos filhos e à imortalidade foi deliberadamente preservada e esclarecida em nota.
