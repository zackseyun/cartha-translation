  yaml_path: translation/deuterocanon/4_maccabees/016/009.yaml
  text: O my children—some unmarried[a], and others married but childless—I will not see your children, nor will I be counted blessed when I am called grandmother.
translation:
  language: pt
  text: Ó meus filhos — uns solteiros, outros casados, mas sem filhos[a] —, não verei os filhos de vocês, nem serei considerada feliz quando for chamada de avó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O raro termo grego ἄνοιντοι provavelmente significa “sem filhos” ou “sem descendência”; a ideia é que nem mesmo os que se casaram lhe deixariam netos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ τῶν ἐμῶν παίδων
  choice: Ó meus filhos
  rationale: A expressão introduz um lamento materno dirigido à própria prole. “Meus filhos” é natural em português e mantém o sentido amplo de παῖδες sem especificar desnecessariamente o sexo.
- source_word: ἄγαμοι
  choice: solteiros
  rationale: Expressa de modo corrente o estado de quem não se casou; no paralelismo com “casados”, é mais natural que “não casados”.
- source_word: γαμήσαντες
  choice: casados
  rationale: O particípio indica os que contraíram matrimônio. A forma adjetival portuguesa preserva com clareza o contraste com “solteiros”.
- source_word: ἄνοιντοι
  choice: sem filhos
  rationale: O termo raro, neste contexto, provavelmente indica ausência de descendência. “Sem filhos” evita a conotação biológica e potencialmente enganosa de “estéreis”.
- source_word: οὐκ ὄψομαι ὑμῶν τέκνα
  choice: não verei os filhos de vocês
  rationale: Mantém a referência direta à geração seguinte e usa uma construção clara e corrente em português de ampla compreensão.
- source_word: μάμμη
  choice: avó
  rationale: É o equivalente familiar e moderno do termo grego para avó.
- source_word: κληθεῖσα μακαρισθήσομαι
  choice: serei considerada feliz por ser chamada
  rationale: μακαρισθήσομαι indica ser tida ou declarada feliz, não receber uma bênção. A formulação mantém a relação entre o reconhecimento como avó e a felicidade socialmente atribuída a isso.
