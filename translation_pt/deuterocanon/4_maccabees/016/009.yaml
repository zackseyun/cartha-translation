translation_notes:
  register: Português moderno, digno e emotivo, com legibilidade brasileira e vocabulário de compreensão internacional. O travessão preserva a interrupção explicativa do lamento, e “vocês” evita a artificialidade de “vossos” no uso brasileiro contemporâneo.
