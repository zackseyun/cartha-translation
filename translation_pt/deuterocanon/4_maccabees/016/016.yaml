  text: you were saying to the children in the Hebrew language[a], “O children, noble is the contest to which, having been called for the testimony of the nation[b], you must struggle earnestly.”
translation:
  language: pt
  text: 'Você dizia aos filhos, na língua hebraica: “Ó filhos, nobre é a luta para a qual, tendo sido chamados em favor do testemunho da nação,[a] lutem com todo o empenho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em favor da solene declaração da nação”. O termo grego διαμαρτυρία pode indicar testemunho, atestação ou declaração solene.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγες
  choice: Você dizia
  rationale: O imperfeito indica fala em andamento ou reiterada na cena recordada; “dizia” preserva naturalmente esse aspecto em português.
- source_word: τοῖς παισὶν / Ὦ παῖδες
  choice: aos filhos / Ó filhos
  rationale: Embora παῖς possa significar criança, o contexto é o de uma mãe dirigindo-se a seus descendentes masculinos; “filhos” comunica tanto a relação familiar quanto o referente masculino.
- source_word: ἐν τῇ Ἑβραΐδι φωνῇ
  choice: em língua hebraica
  rationale: Tradução clara e próxima da expressão grega que identifica a língua empregada.
- source_word: γενναῖος ὁ ἀγών
  choice: nobre é a luta
  rationale: “Nobre” preserva a elevação moral de γενναῖος. “Luta” mantém a imagem de ἀγών de modo mais natural em português do que “competição” neste contexto de martírio.
- source_word: ἐφʼ ὃν κληθέντες
  choice: para a qual vocês foram chamados
  rationale: Explicita de maneira natural a relação do particípio com o destinatário plural, sem acrescentar uma causa não expressa.
- source_word: ὑπὲρ τῆς διαμαρτυρίας τοῦ ἔθνους
  choice: em defesa do testemunho da nação
  rationale: ὑπέρ exprime atuação em favor ou defesa de algo; “testemunho” preserva a força pública ou comprobatória de διαμαρτυρία, e “da nação” evita inserir o possessivo “nossa”, ausente do grego.
- source_word: ἐναγωνίσασθε
  choice: lutem com todo o empenho
  rationale: O imperativo exorta a uma participação vigorosa na luta; a formulação também conserva a ligação lexical com ἀγών sem soar artificial.
theological_decisions:
- issue: Identidade dos destinatários em παῖδες
  choice: filhos
  alternative: crianças; meninos
  rationale: O contexto identifica os destinatários como os filhos homens da mãe. A opção mantém a precisão contextual e a força familiar sem transformar a idade deles em ponto explícito.
- issue: Sentido de διαμαρτυρία no contexto do martírio judaico
  choice: testemunho
  alternative: atestação; protesto solene
  rationale: “Testemunho” conserva a ambiguidade entre testemunho público e evidência solene, sem importar terminologia cristã posterior nem reduzir o termo a uma declaração jurídica.
- issue: Referência de τοῦ ἔθνους
  choice: da nação
  alternative: de nossa nação; do povo
  rationale: A tradução retém o artigo definido do grego e não acrescenta o possessivo contextual “nossa”; também preserva ἔθνος como “nação”, sem decidir de forma interpretativa entre entidade nacional e povo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A ordem enfática “nobre é a luta” preserva a elevação retórica do grego. O aspecto imperfeito de ἔλεγες foi mantido em “dizia”, e o imperativo vigoroso foi expresso sem arcaísmo.
