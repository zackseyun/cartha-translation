base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/021.yaml
  text: And Daniel the righteous man was thrown to the lions[a]; and Hananiah and Azariah and Mishael were hurled into a furnace of fire[b], and they endured because of God.
translation:
  language: pt
  text: E Daniel, o justo, foi lançado aos leões; e Hananias, Azarias e Misael[a] foram arremessados para dentro de uma fornalha de fogo[b] e perseveraram por causa de Deus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Estes são os nomes hebraicos dos três jovens, mais conhecidos como Sadraque, Mesaque e Abede-Nego.
    reason: alternative_reading
  - marker: b
    text: Uma tradução portuguesa mais tradicional seria “fornalha ardente”. O grego diz mais literalmente “fornalha de fogo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δίκαιος
  choice: o justo
  rationale: O adjetivo substantivado com artigo funciona como epíteto de Daniel. “O justo” preserva a caracterização moral e religiosa em português natural e conciso.
- source_word: εἰς λέοντας
  choice: aos leões
  rationale: Com ἐβλήθη, a expressão indica que Daniel foi entregue aos leões. “Lançado aos leões” é idiomático e evita acrescentar “cova”, ausente do grego.
- source_word: ἐβλήθη
  choice: foi lançado
  rationale: O aoristo passivo de βάλλω é vertido com clareza e mantém a força da ação sofrida por Daniel.
- source_word: ἀπεσφενδονήθησαν
  choice: foram arremessados
  rationale: O verbo é mais vívido que o simples βάλλω anterior e sugere um lançamento violento; “arremessados” preserva essa intensidade.
- source_word: εἰς κάμινον πυρὸς
  choice: para dentro de uma fornalha de fogo
  rationale: A formulação conserva explicitamente κάμινος e πυρός. “Para dentro de” expressa com naturalidade o movimento indicado por εἰς.
- source_word: ὑπέμειναν
  choice: perseveraram
  rationale: O verbo descreve constância sob provação. “Perseveraram” comunica essa resistência firme sem acrescentar um objeto que não consta no texto.
- source_word: διὰ τὸν θεόν
  choice: por causa de Deus
  rationale: Com acusativo, διά apresenta Deus como razão ou motivo da perseverança. A tradução mantém essa amplitude sem impor uma interpretação mais específica.
theological_decisions:
- issue: Uso dos nomes pessoais dos três jovens
  choice: Hananias, Azarias e Misael
  alternative: Sadraque, Mesaque e Abede-Nego
  rationale: O texto grego emprega os nomes hebraicos. Mantê-los respeita a evidência da fonte e evita substituí-los pelos nomes babilônicos mais conhecidos.
- issue: Sentido de δίκαιος como epíteto de Daniel
  choice: o justo
  alternative: o homem justo
  rationale: “O justo” reproduz a forma substantivada do grego e preserva sua caracterização moral e religiosa sem introduzir uma formulação doutrinária mais específica.
- issue: Relação expressa por διὰ τὸν θεόν
  choice: por causa de Deus
  alternative: por amor a Deus
  rationale: A opção escolhida conserva a possível tensão entre causa e motivo. “Por amor a Deus” tornaria explícita uma motivação afetiva que o grego não especifica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição de “e” acompanha a coordenação do grego sem tornar a frase artificial; “arremessados” preserva a vivacidade do segundo verbo, e “por causa de Deus” mantém a ambiguidade genuína da relação causal ou motivacional.
