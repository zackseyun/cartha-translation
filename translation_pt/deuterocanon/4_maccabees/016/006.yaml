base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/006.yaml
  text: Alas for me indeed[a], thrice-wretched many times over[b]! Though I bore seven children[c], I have become the mother of none.
translation:
  language: pt
  text: Ai de mim, eu, miserável e tantas vezes, três vezes desgraçada[b]! Embora tenha dado à luz sete filhos[c], tornei-me mãe de nenhum deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Literalmente, “muitas vezes três vezes desgraçada”, uma expressão intensificada de profundo sofrimento.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “sete crianças”. A palavra grega pode significar “crianças” ou “filhos”; o contexto mostra que se trata de filhos homens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ μελέα ἔγωγε
  choice: Ai de mim, de fato, miserável
  rationale: A exclamação expressa um lamento sobre si mesma. “Ai de mim” comunica naturalmente essa força em português; “miserável” preserva o sentido de μελέα, e “de fato” representa a ênfase pessoal de ἔγωγε.
- source_word: πολλάκις τρισαθλία
  choice: muitas vezes três vezes desgraçada
  rationale: 'Mantém as duas intensificações do grego: πολλάκις, “muitas vezes”, e τρισαθλία, literalmente “três vezes desgraçada”. A formulação incomum preserva a linguagem extrema do lamento.'
- source_word: ἥτις
  choice: Embora tenha
  rationale: A oração relativa apresenta a razão e o contraste doloroso do lamento. A construção concessiva é natural em português e conserva a tensão entre ter dado à luz e agora não ter nenhum filho.
- source_word: ἑπτὰ παῖδας
  choice: sete filhos
  rationale: παῖδας pode designar crianças ou filhos e, neste contexto, refere-se aos sete filhos homens. “Filhos” é natural na fala materna e mantém alguma amplitude lexical em português.
- source_word: τεκοῦσα
  choice: tenha dado à luz
  rationale: Expressa claramente o sentido materno e físico do particípio aoristo de τίκτω.
- source_word: οὐδενὸς μήτηρ γεγένημαι
  choice: tornei-me mãe de nenhum deles
  rationale: 'Preserva a força resultante do perfeito γεγένημαι e o paradoxo deliberado: depois de dar à luz sete filhos, ela se considera agora mãe de nenhum deles por causa da perda.'
theological_decisions:
- issue: Sentido do lamento da mãe após a morte dos sete filhos
  choice: 'O texto é apresentado como um paradoxo de luto: ela deu à luz sete filhos, mas, tendo perdido todos, tornou-se mãe de nenhum deles.'
  alternative: Traduzir de modo mais idiomático como “já não sou mãe de nenhum deles”.
  rationale: “Tornei-me” conserva melhor o estado resultante expresso pelo perfeito grego, sem explicar além do texto nem atenuar sua tensão retórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para soar natural, mas a intensidade incomum do grego e o paradoxo do luto foram mantidos.
