  yaml_path: translation/deuterocanon/4_maccabees/016/002.yaml
  text: So I have shown that not only did men master the passions[a], but even a woman despised the greatest tortures.
translation:
  language: pt
  text: Portanto, demonstrei que não só os homens dominaram as paixões, mas até uma mulher desprezou[a] as mais terríveis torturas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “considerou insignificantes”.'
    reason: Registra a nuance de ὑπερεφρόνησεν, que pode indicar tratar as torturas como algo de pouca importância ou indigno de consideração.
lexical_decisions:
- source_word: ἀπέδειξα
  choice: demonstrei
  rationale: O aoristo de ἀποδείκνυμι resume a argumentação anterior com o sentido de mostrar ou demonstrar; “demonstrei” preserva a força retórica sem exigir a linguagem mais técnica de uma prova formal.
- source_word: οὖν
  choice: portanto
  rationale: Marca a conclusão inferida do argumento precedente; “portanto” explicita com naturalidade essa conexão discursiva.
- source_word: τῶν παθῶν
  choice: as paixões
  rationale: Em 4 Macabeus, πάθη designa os impulsos e afetos sobre os quais a razão exerce domínio, não sofrimentos externos. “As paixões” mantém o vocabulário ético-filosófico da obra.
- source_word: ἄνδρες
  choice: os homens
  rationale: O termo se refere especificamente a homens e estabelece um contraste retórico com γυνή; a tradução preserva essa distinção.
- source_word: ἐπεκράτησαν
  choice: dominaram
  rationale: O verbo expressa prevalecer sobre algo ou mantê-lo sob controle; “dominaram” comunica de modo direto o governo exercido sobre as paixões.
- source_word: γυνή
  choice: uma mulher
  rationale: O singular sem artigo apresenta a mãe como exemplo e contrasta “uma mulher” com os homens mencionados antes.
- source_word: τῶν μεγίστων βασάνων
  choice: as mais terríveis torturas
  rationale: βάσανοι indica torturas ou tormentos no contexto de martírio. “As mais terríveis torturas” expressa idiomaticamente a intensidade superlativa de μεγίστων.
- source_word: ὑπερεφρόνησεν
  choice: desprezou
  rationale: O verbo comunica considerar algo inferior, sem importância ou indigno de temor; “desprezou” conserva sua força e se ajusta à coragem da mulher diante das torturas.
theological_decisions:
- issue: Sentido antropológico de πάθη em 4 Macabeus
  choice: as paixões
  alternative: os sofrimentos; as emoções
  rationale: A tese central da obra trata do domínio da razão sobre impulsos e afetos. Traduzir como “sofrimentos” confundiria esses movimentos interiores com as torturas externas mencionadas na segunda metade do versículo.
- issue: Contraste de gênero entre ἄνδρες e γυνή
  choice: os homens ... uma mulher
  alternative: as pessoas ... uma mulher
  rationale: O contraste é intencional na retórica grega e destaca o exemplo da mãe; uma formulação neutra apagaria esse elemento do texto.
- issue: Força de ὑπερεφρόνησεν diante das torturas
  choice: desprezou
  alternative: considerou insignificantes
  rationale: “Desprezou” preserva a atitude de superioridade e desdém expressa pelo verbo, enquanto a nota registra uma formulação que evidencia o juízo de pouca importância sem resolver em excesso sua nuance.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A estrutura conclusiva e o contraste retórico do grego foram preservados sem rigidez excessiva.
