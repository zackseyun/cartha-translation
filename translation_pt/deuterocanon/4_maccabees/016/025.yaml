  yaml_path: translation/deuterocanon/4_maccabees/016/025.yaml
  text: And even more, by seeing this—that after dying for God they live to God, just as Abraham and Isaac and Jacob, and all the patriarchs do—
translation:
  language: pt
  text: Além disso, ao verem isso—que, depois de morrerem por Deus, vivem para Deus[a], assim como Abraão, Isaque, Jacó e todos os patriarcas—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como “vivem em relação a Deus”. O grego não diz explicitamente “vivem com Deus”.
    reason: Preserva a amplitude do dativo grego e evita especificar em excesso o modo dessa vida.
lexical_decisions:
- source_word: ἔτι δὲ καὶ
  choice: Além disso
  rationale: Expressa de modo natural o valor aditivo e enfático da locução grega, sem tornar a frase pesada.
- source_word: ταῦτα ἰδόντες
  choice: ao verem isto
  rationale: Mantém a construção participial e toma o plural neutro ταῦτα coletivamente, como referência à realidade que se contempla.
- source_word: διὰ τὸν θεόν
  choice: por Deus
  rationale: 'No contexto de martírio, διά com acusativo indica causa ou motivo: morreram por causa de Deus, por fidelidade a ele.'
- source_word: ἀποθανόντες
  choice: depois de morrerem
  rationale: O particípio aoristo indica ação anterior ao verbo principal e é vertido com clareza em português.
- source_word: ζῶσιν τῷ θεῷ
  choice: eles vivem para Deus
  rationale: Preserva a formulação relacional do dativo grego sem introduzir a interpretação mais específica de que vivem 'com Deus'.
- source_word: ὥσπερ
  choice: assim como
  rationale: Introduz de maneira clara e idiomática a comparação.
- source_word: οἱ πατριάρχαι
  choice: os patriarcas
  rationale: É o termo tradicional e preciso para os antepassados fundadores mencionados no texto.
theological_decisions:
- issue: A vida dos mártires após a morte em sua relação com Deus
  choice: eles vivem para Deus
  alternative: eles vivem com Deus
  rationale: O texto afirma que os que morreram por Deus vivem em relação a ele, comparando-os a Abraão, Isaque, Jacó e aos demais patriarcas. A tradução não define além do grego a natureza ou o modo dessa vida.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O travessão final foi mantido porque o versículo funciona sintaticamente como parte de uma frase mais ampla no contexto.
