  text: If[a], then, even a woman—an old woman and a mother of children—endured the tortures up to death while seeing the sufferings of her children, godly reason is master of the passions.
translation:
  language: pt
  text: Se, portanto, até mesmo uma mulher — idosa e mãe de filhos — suportou as torturas até a morte enquanto via seus filhos lamentarem em alta voz[a], a razão piedosa é senhora das paixões.
