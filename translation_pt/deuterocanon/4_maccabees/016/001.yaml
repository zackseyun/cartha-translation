    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ τοίνυν
  choice: Se, portanto
  rationale: Conserva a transição condicional e inferencial do grego em português natural, sem acrescentar uma conclusão mais explícita do que a do texto.
- source_word: γυνὴ καὶ γεραιὰ καὶ ἐπὶ παιδῶν μήτηρ
  choice: uma mulher — idosa e mãe de filhos —
  rationale: Mantém a ênfase cumulativa na condição de mulher, na idade avançada e na maternidade, com uma construção clara e digna.
- source_word: ὑπέμεινεν
  choice: suportou
  rationale: Expressa perseverança firme sob sofrimento intenso e se ajusta naturalmente ao objeto “torturas”.
- source_word: τὰς μέχρι θανάτου βασάνους
  choice: as torturas até a morte
  rationale: βασάνοι designa tormentos infligidos, e μέχρι θανάτου indica seu limite ou alcance até a morte.
- source_word: ὁρῶσα τῶν τέκνων ὁλολυγμένων
  choice: enquanto via o sofrimento de seus filhos
  rationale: A sintaxe transmitida é comprimida; a formulação comunica a cena no contexto, enquanto a nota preserva o valor mais literal de ὁλολυγμένων, ligado a gritos ou lamentos fortes.
- source_word: αὐτοκράτωρ
  choice: é senhora
  rationale: A metáfora predicativa apresenta a razão piedosa como aquela que exerce domínio; “senhora” concorda naturalmente com “razão” em português.
- source_word: τῶν παθῶν
  choice: das paixões
  rationale: Preserva o termo filosófico recorrente para impulsos e afetos que devem ser governados, sem reduzi-lo a emoções neutras.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: a razão piedosa
  rationale: Expressa uma razão moldada pela reverência a Deus e mantém unidos os aspectos racional e religioso da expressão programática.
theological_decisions:
- issue: Sentido programático de ὁ εὐσεβὴς λογισμός em 4 Macabeus
  choice: a razão piedosa
  alternative: o raciocínio piedoso
  rationale: “Razão piedosa” é natural, conciso e preserva a afirmação de que a faculdade racional orientada pela reverência a Deus governa as paixões, sem impor uma leitura denominacional.
- issue: Metáfora de domínio em αὐτοκράτωρ τῶν παθῶν
  choice: é senhora das paixões
  alternative: domina as paixões
  rationale: A construção nominal conserva com maior nitidez a imagem do texto grego, sem explicar de modo excessivo a natureza desse domínio.
