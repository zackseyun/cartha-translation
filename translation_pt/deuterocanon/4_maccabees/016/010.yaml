  yaml_path: translation/deuterocanon/4_maccabees/016/010.yaml
  text: O I[a], the mother of many and of beautiful children, a widow and alone[b], much-lamenting woman!
translation:
  language: pt
  text: Ah, eu, mulher de muitos e belos filhos[a], viúva e sozinha, cheia de pranto[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “filhos admiráveis” ou “nobres filhos”. O termo grego pode indicar beleza ou excelência.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega também pode ser entendida como “muito lamentada”.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ὦ
  choice: Ah
  rationale: A interjeição introduz uma exclamação de lamento. “Ah” conserva essa força de modo natural e digno, sem ampliar o grego para uma frase como “ai de mim”.
- source_word: πολύπαις
  choice: de muitos filhos
  rationale: O composto descreve uma mulher que tem muitos filhos. A expressão portuguesa é clara e mantém a ligação com γυνή.
- source_word: καλλίπαις
  choice: de belos filhos
  rationale: Mantém o sentido mais direto do composto e deixa em aberto se a beleza indicada é física ou uma qualidade admirável; a nota registra essa amplitude.
- source_word: γυνή
  choice: mulher
  rationale: Traduz diretamente o substantivo grego, sem substituí-lo de forma interpretativa por “mãe”, embora a maternidade já esteja expressa nos adjetivos compostos.
- source_word: χήρα
  choice: viúva
  rationale: Equivalente direto e natural para a condição declarada pela mulher.
- source_word: μόνη
  choice: sozinha
  rationale: Expressa de modo corrente a solidão e o isolamento enfatizados pelo grego.
- source_word: πολύθρηνος
  choice: cheia de pranto
  rationale: Reproduz em português natural a intensidade do composto e seu campo semântico de lamentação, preservando na nota a possível nuance de alguém muito lamentada.
theological_decisions: []
translation_notes:
  register: Português moderno, solene e emotivo, com estrutura exclamativa próxima do grego. “Mulher” foi mantido para evitar transformar explicitamente γυνή em “mãe”; “cheia de pranto” evita um composto artificial em português.
