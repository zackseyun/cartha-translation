  text: who[a], even if I were not to die, would bury some one of my sons. But with this lament the holy and God-fearing mother bewailed none of them,
translation:
  language: pt
  text: 'Ela, que disse: “Mesmo se eu morrer, não terei sequer um dos meus filhos para me sepultar.”[a] Mas a santa mãe, temente a Deus, não lamentou nenhum deles com esse lamento;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego retoma a mãe por meio de um pronome relativo e passa abruptamente à primeira pessoa: literalmente, «mesmo se eu morrer, não terei um dos meus filhos para me sepultar». A apresentação como fala torna essa mudança de pessoa legível em português.'
    reason: Preservar a mudança de pessoa e esclarecer a construção condensada, sem eliminar a condição expressa no grego.
lexical_decisions:
- source_word: ἣ
  choice: eu, que
  rationale: O pronome relativo feminino retoma a mãe, mas a oração passa abruptamente à primeira pessoa; “eu, que” conserva esse movimento de discurso direto ou pensamento representado.
- source_word: οὐδʼ ἂν ἀποθάνω … ἕξω
  choice: nem quando morrer, terei
  rationale: ἀποθάνω é primeira pessoa do singular, e ἕξω é entendido como futuro de ἔχω, “terei”. A negação οὐδʼ incide naturalmente sobre a ideia de não ter sequer então um filho presente, e não significa que a mãe não morreria.
- source_word: θάπτοντα τῶν υἱῶν … τινά
  choice: um só dos meus filhos para me sepultar
  rationale: τινά seleciona um indivíduo entre os filhos, enquanto θάπτοντα descreve a função desse filho. “Para me sepultar” torna explícito em português o objeto subentendido pelo contexto.
- source_word: ἀλλὰ τούτῳ τῷ θρήνῳ
  choice: Mas … com esse lamento
  rationale: Mantém o contraste forte de ἀλλά e o sentido de θρῆνος como expressão verbal de luto.
- source_word: οὐδένα ὀλοφύρετο
  choice: não lamentou nenhum deles
  rationale: Preserva a negação enfática e o sentido de prantear ou lamentar alguém, em linguagem atual e digna.
- source_word: ἡ ἱερὰ καὶ θεοσεβὴς μήτηρ
  choice: a santa mãe, temente a Deus
  rationale: “Santa” conserva a elevação religiosa de ἱερά, e “temente a Deus” mantém o conteúdo explicitamente teocêntrico de θεοσεβής.
theological_decisions:
- issue: Sentido de θεοσεβής
  choice: temente a Deus
  alternative: piedosa; devota
  rationale: A opção explicita que a reverência da mãe se dirige a Deus, sem reduzir o termo a religiosidade genérica.
- issue: Mudança para a primeira pessoa
  choice: manter “eu” e “me”
  alternative: regularizar tudo na terceira pessoa
  rationale: As formas verbais gregas ἀποθάνω e ἕξω são de primeira pessoa. A tradução conserva a mudança abrupta em vez de apagar uma tensão real do texto.
- issue: Escopo da negação em οὐδʼ ἂν ἀποθάνω … ἕξω
  choice: “nem quando morrer, terei”
  alternative: “mesmo que eu não morresse”
  rationale: O grego não apresenta uma negação interna de “morrer”; οὐδʼ nega a expectativa de ter um filho que a sepulte, mesmo por ocasião de sua morte.
translation_notes:
  register: Português moderno, solene e acessível, com leitura natural no Brasil e compreensão internacional. As aspas sinalizam a voz ou o pensamento da mãe; o ponto e vírgula final preserva o caráter de continuação do período no contexto.
