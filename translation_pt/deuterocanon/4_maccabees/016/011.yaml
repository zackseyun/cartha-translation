    issue: «Eu, que» como início da fala entre aspas é sintaticamente opaco em português.
    rationale: ἣ é uma relativa que retoma a mãe no contexto anterior, enquanto as formas seguintes passam abruptamente à primeira pessoa. A tradução pode conservar ambas as características introduzindo a fala atribuída pela relativa, sem inventar conteúdo.
