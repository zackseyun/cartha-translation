  naturalness: O trecho entre aspas, «eu, que, nem quando morrer...», soa truncado em português de maneira que não esclarece a ruptura efetiva do grego. Uma citação direta após a relativa permite conservar a mudança de pessoa de modo legível.
  terminology: «santa mãe, temente a Deus» representa adequadamente ἡ ἱερὰ καὶ θεοσεβὴς μήτηρ. «Lamento» e «lamentou» mantêm o registro solene e o sentido de θρῆνος e ὀλοφύρομαι.
  issues:
