  text: Nor did she try to turn any of them away so that they might not die, nor did she grieve as they were dying.
translation:
  language: pt
  text: Ela também não procurou dissuadir nenhum deles para que não morresse, nem se entristeceu enquanto eles morriam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέτρεπεν
  choice: procurou dissuadir
  rationale: O imperfeito apresenta uma ação continuada ou considerada em seu desenrolar, e o verbo, neste contexto, indica tentar desviar alguém de um propósito. “Procurou dissuadir” comunica a tentativa sem sugerir que ela efetivamente os impediu.
- source_word: αὐτῶν τινα
  choice: nenhum deles
  rationale: Sob a negação οὐδέ, a expressão partitiva τινα αὐτῶν assume naturalmente o sentido de “nenhum deles”, formulação idiomática que preserva a referência distributiva.
- source_word: ἵνα μὴ ἀποθάνωσιν
  choice: para que não morresse
  rationale: A oração com ἵνα mantém seu valor de finalidade. O singular concorda distributivamente com “nenhum deles” e evita uma construção menos natural em português.
- source_word: ἐλυπήθη
  choice: se entristeceu
  rationale: O verbo exprime tristeza ou aflição. “Se entristeceu” é claro, atual e digno, sem restringir o sentido a uma lamentação posterior à morte.
- source_word: ὡς ἀποθνῃσκόντων
  choice: enquanto eles morriam
  rationale: O genitivo absoluto descreve uma circunstância simultânea, e o particípio presente ressalta o processo em curso. “Enquanto eles morriam” reproduz ambos os elementos com naturalidade.
theological_decisions:
- issue: Referente do sujeito implícito
  choice: Explicitar o sujeito como “ela”, referindo-se à mãe no contexto imediato.
  alternative: Manter o sujeito apenas implícito nas formas verbais portuguesas.
  rationale: Embora o grego não expresse o pronome, o contexto identifica a mãe. A explicitação na abertura torna a referência imediatamente clara sem acrescentar conteúdo interpretativo.
- issue: Sentido de ὡς na oração circunstancial
  choice: 'Traduzir como simultaneidade factual: “enquanto eles morriam”.'
  alternative: Traduzir de modo comparativo ou subjetivo, como “como se estivessem morrendo”.
  rationale: Com o genitivo absoluto e o particípio presente, o contexto favorece fortemente uma circunstância temporal contemporânea, não uma aparência irreal.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Dissuadir” preserva a precisão do verbo grego sem soar excessivamente técnico; a repetição de “morrer” reflete deliberadamente a repetição lexical do original.
