  text: In vain[a], O children, did I endure many birth pains for you, and the more grievous anxieties of raising you.
translation:
  language: pt
  text: Em vão[a], ó filhos, suportei por vocês muitas dores de parto e as preocupações ainda mais penosas de criá-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Foi para nada que...”.'
    reason: Alternativa lexical para μάτην, preservando com maior explicitude a ideia de esforço frustrado.
lexical_decisions:
- source_word: μάτην
  choice: Em vão
  rationale: Expressa inutilidade ou frustração do propósito; a formulação é concisa, natural e adequada ao lamento solene da mãe.
- source_word: ἐφʼ ὑμῖν
  choice: por vocês
  rationale: No contexto de sofrimento materno, indica aqueles por quem ou em relação a quem as dores foram suportadas.
- source_word: ὦ παῖδες
  choice: ó filhos
  rationale: O vocativo preserva o tom solene da apóstrofe. παῖδες pode significar “filhos” ou “crianças”; “filhos” é natural na fala da mãe e se ajusta ao contexto, sem acrescentar o possessivo “meus”, ausente no grego.
- source_word: πολλὰς ... ὠδῖνας
  choice: muitas dores de parto
  rationale: Mantém a imagem concreta dos sofrimentos do parto, em vez de generalizá-los como simples dores.
- source_word: ὑπέμεινα
  choice: suportei
  rationale: Comunica resistência perseverante diante do sofrimento e corresponde naturalmente ao aoristo grego.
- source_word: χαλεπωτέρας
  choice: ainda mais penosas
  rationale: 'Preserva o valor comparativo: os cuidados e preocupações da criação são apresentados como mais difíceis que as dores de parto.'
- source_word: φροντίδας
  choice: preocupações
  rationale: Realça o peso mental e emocional dos cuidados maternos, sem reduzir o termo a tarefas práticas.
- source_word: ἀνατροφῆς
  choice: de criá-los
  rationale: Verbaliza de modo natural em português a ideia de criação ou educação dos filhos e explicita o objeto já fornecido pelo contexto.
