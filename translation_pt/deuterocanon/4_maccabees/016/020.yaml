  naturalness: O texto é claro e de registro solene. “A mão paterna, empunhando a espada” é mais direto e natural do que “a mão paterna, armada com a espada”, pois uma mão empunha/porta uma arma; não é normalmente descrita como estando armada com ela. A revisão também torna a alternativa da nota b mais próxima do campo semântico de recuar-se ou acovardar-se por temor.
  terminology: “Abraão”, “Isaque”, “degolar”, “progenitor do povo” e “mão paterna” são aceitáveis. “Progenitor do povo” mantém o valor apositivo de ἐθνοπάτωρ e não atribui o título a Abraão. “Empunhando a espada” traduz com precisão o composto ξιφηφόρον.
