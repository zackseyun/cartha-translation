  text: for whose sake even our father Abraham hurried to slaughter Isaac[a], his son, the ancestor of the nation, and, seeing the ancestral hand bearing the sword descending upon him[b], did not shrink back.
translation:
  language: pt
  text: 20 Por causa de quem até nosso pai Abraão se apressou a degolar Isaque, seu filho, progenitor do povo[a]; e Isaque, vendo a mão paterna, empunhando a espada, descer sobre ele, não recuou de medo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pai da nação”. O termo grego composto ἐθνοπάτωρ designa o antepassado ou progenitor de um povo.
    reason: lexical_alternative
  - marker: b
    text: Ou “não se encolheu” ou “não se acovardou”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ὃν
  choice: por causa de quem
  rationale: Mantém o referente masculino e a dependência do contexto anterior, sem explicitar indevidamente o antecedente; também preserva a ideia de causa ou motivação.
- source_word: ἔσπευδεν
  choice: se apressou
  rationale: Reproduz tanto a prontidão quanto o movimento diligente expresso pelo verbo, em português corrente e digno.
- source_word: σφαγιάσαι
  choice: a degolar
  rationale: Conserva a força gráfica e o possível contexto sacrificial do verbo sem substituí-lo pelo termo teologicamente mais interpretativo “sacrificar”.
- source_word: τὸν ἐθνοπάτορα υἱὸν ... Ἰσαάκ
  choice: Isaque, seu filho, progenitor do povo
  rationale: Trata ἐθνοπάτορα como designação apositiva de Isaque e comunica que ele é o antepassado do povo, sem dar a entender que o título se refere a Abraão.
- source_word: πατρῴαν χεῖρα
  choice: a mão paterna
  rationale: Preserva o registro elevado e, no contexto, identifica a mão como a do pai de Isaque, Abraão.
- source_word: ξιφηφόρον
  choice: armada com a espada
  rationale: Expressa naturalmente em português a imagem literal da mão que porta a espada.
- source_word: καταφερομένην ἐπʼ αὐτόν
  choice: descer sobre ele
  rationale: Mantém a imagem dramática do movimento descendente dirigido contra Isaque.
- source_word: οὐκ ἔπτηξεν
  choice: não recuou de medo
  rationale: Abrange tanto o temor quanto a reação física de encolher-se ou recuar, adequando-se ao tema de firmeza do contexto.
theological_decisions:
- issue: Como traduzir a alusão a Abraão e Isaque sem importar a terminologia de Gênesis que não aparece nesta frase grega
  choice: “se apressou a degolar Isaque”
  alternative: “se dispôs a oferecer Isaque” ou “se apressou a sacrificar Isaque”
  rationale: O verbo grego é deliberadamente gráfico. A tradução conserva a violência retórica da passagem e evita suavizá-la ou inserir uma formulação teológica mais específica.
- issue: Referente de διʼ ὃν
  choice: “por causa de quem”, sem nomear o antecedente
  alternative: “por essa razão” ou explicitação do referente
  rationale: O pronome relativo masculino depende do contexto anterior. Não se deve resolver no texto uma ligação discursiva que o próprio versículo deixa implícita.
- issue: Sujeito de οὐκ ἔπτηξεν
  choice: Repetir “Isaque” na segunda oração
  alternative: Usar apenas “ele”
  rationale: A sintaxe grega indica Isaque como aquele que vê a mão descer e não recua. A repetição evita em português uma ambiguidade artificial com Abraão, sem alterar o sentido.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A formulação mantém a intensidade da cena e o encadeamento retórico do grego, mas repete “Isaque” para impedir que o leitor atribua a elevação da espada ou a reação final ao personagem errado.
