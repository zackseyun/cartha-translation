  yaml_path: translation/deuterocanon/4_maccabees/016/005.yaml
  text: 'For consider this also: if the woman had been fainthearted, though she was a mother, she would have wailed over them; and perhaps she would have spoken like this:'
translation:
  language: pt
  text: 'Pois considerem também isto: se aquela mulher fosse fraca de ânimo, embora fosse mãe, teria lamentado por eles; e talvez tivesse dito o seguinte:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλογίσασθαι
  choice: considerem
  rationale: O infinitivo introduz mais um ponto a ser ponderado. O imperativo plural torna natural em português a força exortativa implícita no contexto.
- source_word: δειλόψυχος
  choice: de coração tímido
  rationale: Expressa falta de ânimo ou coragem sem recorrer ao termo mais condenatório «covarde».
- source_word: γυνή
  choice: aquela mulher
  rationale: Mantém γυνή distinto da identificação concessiva que vem em seguida, «embora fosse mãe»; o demonstrativo dá naturalidade à referência contextual.
- source_word: καίπερ μήτηρ οὖσα
  choice: embora fosse mãe
  rationale: Reproduz claramente a força concessiva de καίπερ e preserva o destaque retórico dado à maternidade.
- source_word: ὠλοφύρετο
  choice: teria se lamentado
  rationale: Comunica lamento de dor em português corrente e digno; embora menos explicitamente sonoro que «teria pranteado», ajusta-se ao registro amplo pretendido.
- source_word: ἐπʼ αὐτοῖς
  choice: por eles
  rationale: É a regência portuguesa natural para o lamento motivado pela sorte dos filhos.
- source_word: ἴσως
  choice: talvez
  rationale: Preserva o caráter tentativo da introdução à fala hipotética.
- source_word: ταῦτα οὕτως εἶπεν
  choice: tivesse falado assim
  rationale: Introduz com naturalidade o discurso imaginado que vem a seguir, sem a redundância literal «estas coisas desta maneira».
theological_decisions:
- issue: Contraste concessivo entre a condição materna e a firmeza de ânimo
  choice: 'Manter a hipótese direta: se ela fosse de coração tímido, embora mãe, teria se lamentado.'
  alternative: Explicitar que o afeto materno naturalmente a levaria ao lamento.
  rationale: O grego apresenta uma tensão retórica, não uma explicação doutrinária. A formulação preserva essa tensão sem acrescentar juízo sobre o afeto materno ou sobre a razão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «De coração tímido» evita tanto o arcaísmo de «pusilânime» quanto a dureza interpretativa de «covarde». Não há notas textuais necessárias neste versículo.
