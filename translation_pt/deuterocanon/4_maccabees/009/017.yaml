  text: But he said, “Your device is not so strong, you limbs of a demon, as to lead my reason away. Cut off my limbs, and burn my flesh, and wrench my joints.”
translation:
  language: pt
  text: 'Mas ele disse: “O método de vocês não é forte o bastante, ó membros de um demônio, para desviar minha razão. Cortem meus membros, queimem minha carne e torçam minhas articulações.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρόπος
  choice: artifício
  rationale: No contexto, designa o recurso ou expediente empregado pelos torturadores. “Artifício” preserva o tom desafiador e corresponde à amplitude de τρόπος sem reduzi-lo apenas a um procedimento técnico.
- source_word: μεροὶ δαῖμον
  choice: membros de um demônio
  rationale: Reproduz diretamente a metáfora insultuosa do grego, na qual os torturadores são apresentados como partes ou agentes de um demônio.
- source_word: λογισμός
  choice: razão
  rationale: Expressa a faculdade racional e deliberativa central à obra, sem restringir o termo a um pensamento isolado.
- source_word: ἆξαι
  choice: desviar
  rationale: Neste contexto, o infinitivo de ἄγω indica levar a razão para longe de sua firme posição; “desviar” comunica isso de modo natural em português.
- source_word: στρεβλοῦτε τὰ ἄρθρα
  choice: torçam minhas articulações
  rationale: Mantém a ação física violenta de retorcer ou deslocar as juntas, com formulação clara e direta.
theological_decisions:
- issue: Personificação demoníaca dos torturadores
  choice: membros de um demônio
  alternative: agentes de um demônio
  rationale: A opção escolhida conserva a imagem corporal explícita de μέρη e sua relação retórica com “meus membros” na frase seguinte, sem explicar ou suavizar a metáfora.
translation_notes:
  register: Português moderno, claro e digno, com imperativos diretos que preservam o desafio enfático do mártir. O fragmento inicial τῶν βασάνων pertence sintaticamente ao contexto anterior e não foi incorporado à fala deste versículo, em concordância com a delimitação textual apresentada.
