  yaml_path: translation/deuterocanon/4_maccabees/009/023.yaml
  text: Imitate me[a], brothers, he said, on the rack; do not desert by abandoning the struggle when I have not left it, nor through me renounce the brotherhood of courage. Wage the holy and noble campaign for godliness[c][b],
translation:
  language: pt
  text: 'No cavalete de tortura,[a] ele disse: “Imitem-me, irmãos. Não desertem, abandonando a luta que eu não abandonei, nem, por minha causa, reneguem a irmandade de coragem.[b] Travem a santa e nobre campanha pela devoção a Deus.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sob tortura”. A expressão grega é difícil, mas evoca especificamente o cavalete ou instrumento de suplício.'
    reason: lexical_alternative
  - marker: b
    text: 'O verbo traduzido por “desertem” tem sentido militar: abandonar as fileiras ou agir como desertor. A relação expressa por “por minha causa” corresponde a uma construção grega difícil; ela também pode ser entendida de outras maneiras.'
    reason: lexical_and_syntactic_ambiguity
  - marker: c
    text: 'Ou: “pela piedade”. Aqui, “devoção a Deus” traduz εὐσέβεια, virtude central em 4 Macabeus que expressa fidelidade religiosa a Deus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρεβλὰς
  choice: no cavalete de tortura
  rationale: Embora a forma grega transmitida seja difícil, o contexto e o campo lexical apontam para o instrumento de suplício; a tradução conserva a imagem concreta em vez de generalizá-la como mera tortura.
- source_word: Μιμήσασθέ με
  choice: Imitem-me
  rationale: Reproduz diretamente o imperativo aoristo de μιμέομαι, pelo qual o orador chama os irmãos a seguir seu exemplo.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: A fala se dirige aos irmãos literais do mártir no contexto narrativo; portanto, mantém-se o masculino contextual do grego.
- source_word: μὴ λειπὼν τὸν ἀγῶνα λειποτακτήσητε
  choice: Não desertem, abandonando a luta que eu não abandonei
  rationale: Mantém tanto ἀγών como luta quanto o tom militar de λειποτακτέω, evitando acrescentar um posto não expresso no texto. A oração relativa torna clara em português a relação contrastiva com a perseverança do orador.
- source_word: μηδὲ ἐξομόσησθέ μου τὴν τῆς εὐψυχίας ἀδελφότητα
  choice: nem reneguem a irmandade de coragem que têm comigo
  rationale: “Reneguem” comunica a repudiação solene de ἐξομόσησθε; a formulação com “comigo” conserva a relação indicada por μου sem impor a leitura causal menos natural “por minha causa”.
- source_word: στρατείαν στρατεύσασθε
  choice: Empenhem-se na ... campanha
  rationale: A expressão preserva a metáfora militar e soa natural em português, ainda que a repetição etimológica do substantivo e verbo gregos não possa ser reproduzida sem artificialidade.
- source_word: ἱερὰν καὶ εὐγενῆ
  choice: santa e nobre
  rationale: Conserva as dimensões de consagração religiosa e honra social dos dois adjetivos.
- source_word: περὶ τῆς εὐσεβείας
  choice: pela devoção a Deus
  rationale: Torna explícito o referente divino inerente ao uso contextual de εὐσέβεια e comunica fidelidade religiosa de modo claro ao leitor moderno.
theological_decisions:
- issue: Sentido de εὐσέβεια no contexto do martírio
  choice: devoção a Deus
  alternative: piedade
  rationale: O termo abrange fidelidade religiosa demonstrada sob perseguição, e não apenas sentimento interior ou prática devocional. “Devoção a Deus” comunica esse referente sem introduzir uma formulação confessional específica.
- issue: Identidade dos destinatários em ἀδελφοί
  choice: irmãos
  alternative: irmãos e irmãs
  rationale: Neste episódio, os destinatários são os irmãos literais do orador, de modo que a forma masculina é histórica e contextualmente precisa.
- issue: Relação expressa por μου na irmandade de coragem
  choice: que têm comigo
  alternative: por minha causa
  rationale: O genitivo admite dificuldade sintática. A tradução preserva a associação pessoal entre o orador e seus irmãos sem converter silenciosamente a expressão em causalidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A fala direta melhora a clareza narrativa; as metáforas do suplício, da luta e da campanha militar foram mantidas. Evitaram-se tanto arcaísmos como explicitações doutrinárias denominacionais.
