base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/021.yaml
  text: And though the framework of his bones was already burned all around[a], the noble-minded and Abraham-like young man did not groan.
translation:
  language: pt
  text: E, embora já tivesse a estrutura dos ossos queimada por todos os lados[a], o jovem de espírito nobre e semelhante a Abraão não gemeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a estrutura dos ossos derretida por todos os lados». O grego apresenta a imagem vívida da armação óssea afetada pelo fogo em toda a volta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτετηγμένον
  choice: queimada por todos os lados
  rationale: O particípio perfeito descreve a estrutura óssea já afetada em toda a volta pelo calor intenso. No contexto da tortura pelo fogo, «queimada por todos os lados» comunica a imagem com naturalidade, enquanto a alternativa mais literal «derretida» é preservada em nota.
- source_word: πῆγμα
  choice: estrutura
  rationale: O substantivo designa algo armado, fixado ou compactado; com «dos ossos», refere-se à estrutura corporal formada por eles. «Estrutura» conserva a imagem concreta e é corrente em português.
- source_word: μεγαλόφρων
  choice: de espírito nobre
  rationale: Expressa elevação de ânimo, coragem e dignidade interior. «De espírito nobre» é claro, atual e mantém a força moral e psicológica do termo.
- source_word: Ἀβραμιαῖος
  choice: semelhante a Abraão
  rationale: O adjetivo caracteriza o jovem por sua semelhança com Abraão. Esta formulação é natural e evita que «abraâmico» seja entendido apenas em sentido étnico ou técnico posterior.
- source_word: νεανίας
  choice: jovem
  rationale: Designa um homem jovem; no contexto, «jovem» é natural e a referência masculina fica clara pelo artigo e pelos qualificativos.
- source_word: οὐκ ἐστέναξεν
  choice: não gemeu
  rationale: στενάζω indica gemer ou suspirar sob sofrimento. Em uma cena de tortura, «não gemeu» transmite adequadamente a ausência de manifestação audível da dor.
theological_decisions:
- issue: Sentido caracterizador de Ἀβραμιαῖος
  choice: semelhante a Abraão
  alternative: abraâmico; descendente de Abraão
  rationale: O contexto enaltece a coragem e a fidelidade do mártir por comparação com Abraão, não simplesmente sua ascendência. A tradução mantém a semelhança de caráter sem introduzir uma interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção concessiva representa καὶ com o particípio circunstancial sem eliminar a relação lógica implícita; a imagem corporal forte do grego foi mantida.
