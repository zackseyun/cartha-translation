lexical_decisions:
- source_word: περὶ ὃν
  choice: sobre ela
  rationale: A expressão retoma a roda ou instrumento de tortura mencionado no contexto. “Sobre ela” comunica naturalmente a posição do jovem esticado no aparelho; o pronome feminino concorda com “roda” em português.
- source_word: κατατεινόμενος
  choice: era esticado
  rationale: O particípio passivo descreve o jovem sendo estendido e mantido sob tensão no instrumento de tortura.
- source_word: εὐγενὴς
  choice: nobre
  rationale: “Nobre” preserva a possível referência tanto à origem distinta quanto ao caráter digno do jovem, sem restringir o sentido a uma classe social.
- source_word: νεανίας
  choice: jovem
  rationale: Termo corrente e digno para um homem jovem, sem acrescentar conotação militar.
- source_word: ἔξαρθρος ἐγίνετο
  choice: ia tendo as articulações deslocadas
  rationale: A formulação expressa o sentido de ficar fora das juntas e conserva o caráter progressivo do imperfeito, indicando o deslocamento corporal contínuo causado pela tortura.
