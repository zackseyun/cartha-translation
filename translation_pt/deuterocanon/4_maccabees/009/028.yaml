base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/028.yaml
  text: Dragging him by the tendons with their iron hands[a], the leopard-like beasts stripped away all his flesh, even to his beard, and the skin of his head; but as he endured this grievous pain steadfastly, he said[d][c][b],
translation:
  language: pt
  text: 'Puxando-o pelos tendões[a] com mãos de ferro[b], as feras semelhantes a leopardos[c] arrancaram toda a sua carne, até a barba, e a pele da cabeça[d]; ele, porém, suportando com firmeza essa dor atroz, dizia:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a partir dos tendões”. O grego apresenta os tendões como o ponto de onde começa o puxão ou a dilaceração.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com mãos de ferro”. A expressão pode aludir a instrumentos metálicos ou intensificar a imagem da força cruel dos algozes; o texto grego não especifica.
    reason: lexical_ambiguity
  - marker: c
    text: Ou “as feras semelhantes a panteras”. O adjetivo grego deriva do nome de um grande felino e qualifica as “feras”; não é simplesmente o substantivo “leopardos”.
    reason: lexical_alternative
  - marker: d
    text: Ou “o couro cabeludo”. O grego diz mais literalmente “a pele da cabeça”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῶν τενόντων
  choice: pelos tendões
  rationale: τένων designa tendão ou fibra resistente, e ἀπό indica o ponto de onde começa o puxão. “Pelos tendões” é natural em português e preserva o detalhe anatômico sem tornar a construção obscura.
- source_word: ταῖς σιδηραῖς χερσὶν
  choice: com mãos de ferro
  rationale: χείρ significa literalmente “mão”. A formulação mantém a imagem vívida do grego sem decidir se ela descreve instrumentos metálicos, garras ou, figuradamente, a força cruel dos algozes.
- source_word: ἐπισπασάμενοι
  choice: Puxando-o
  rationale: O particípio exprime a ação de puxar ou arrastar para si. “Puxando-o” liga-se com clareza a “pelos tendões” e prepara a descrição do que foi arrancado.
- source_word: μέχρι γε τῶν γενείων
  choice: até a barba
  rationale: γενεῖον pode designar o queixo ou a região da barba; γε reforça o limite alcançado. “Até a barba” conserva a imagem adotada sem eliminar a alternativa anatômica.
- source_word: τὴν σάρκα πᾶσαν
  choice: toda a sua carne
  rationale: σάρξ é literal neste contexto. O possessivo, embora implícito, é necessário para uma expressão natural e inequívoca em português.
- source_word: τὴν τῆς κεφαλῆς δορὰν
  choice: a pele da cabeça
  rationale: δορά significa pele ou couro. A tradução mais transparente preserva a formulação grega e evita restringi-la ao termo técnico “couro cabeludo”.
- source_word: οἱ παρδάλιοι θῆρες
  choice: as feras semelhantes a leopardos
  rationale: παρδάλιος é adjetivo e qualifica θῆρες. A tradução conserva essa relação, sem transformar inequivocamente os algozes em leopardos literais.
- source_word: ἀπέσυραν
  choice: arrancaram
  rationale: O verbo indica retirar puxando ou arrastar para fora. No contexto de carne e pele removidas, “arrancaram” comunica de modo direto e natural tanto a ação quanto sua violência.
- source_word: βαρέως ... καρτερῶν
  choice: suportando com firmeza essa dor atroz
  rationale: καρτερέω expressa perseverança ou resistência firme, enquanto βαρέως ressalta o peso ou a gravidade da experiência. A formulação distribui esses sentidos naturalmente, sem reduzir βαρέως a mera bravura.
- source_word: ἔλεγεν
  choice: dizia
  rationale: O imperfeito introduz uma fala no contexto narrativo e pode sugerir ação em curso. “Dizia” preserva esse aspecto melhor que o pontual “disse”.
