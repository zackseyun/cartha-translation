translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem foi levemente ajustada para clareza, mantendo a violência concreta da cena, a metáfora animal aplicada aos algozes e a continuidade indicada por “dizia” antes da fala do versículo seguinte.
