  yaml_path: translation/deuterocanon/4_maccabees/009/001.yaml
  text: What are you waiting for[b][a], O tyrant? For we are ready to die rather than transgress the commandments of our fathers.
translation:
  language: pt
  text: O que está esperando[a], ó tirano? Pois estamos prontos para morrer em vez de transgredir os mandamentos de nossos antepassados[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por que hesita?” A expressão grega pode indicar demora ou hesitação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “nossos mandamentos ancestrais”. Trata-se dos mandamentos recebidos da tradição dos antepassados.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί μέλλεις
  choice: O que está esperando
  rationale: A expressão funciona como um desafio retórico e pode indicar demora ou hesitação. A formulação escolhida é natural em português e permanece próxima da imagem verbal do grego.
- source_word: ὦ τύραννε
  choice: ó tirano
  rationale: Preserva o vocativo enfático e o sentido claramente pejorativo de τύραννος neste contexto.
- source_word: ἑτοῖμοι γάρ ἐσμεν ἀποθνήσκειν
  choice: Pois estamos prontos para morrer
  rationale: Mantém o valor explicativo de γάρ, a ideia de prontidão em ἑτοῖμοι e o sentido simples de ἀποθνήσκειν, sem explicitar indevidamente que serão executados.
- source_word: ἢ παραβαίνειν
  choice: em vez de transgredir
  rationale: No contraste entre morrer e violar os mandamentos, ἢ apresenta a alternativa rejeitada. “Em vez de” comunica essa preferência contextual sem acrescentar uma declaração explícita de vontade.
- source_word: τὰς πατρίους ἡμῶν ἐντολάς
  choice: os mandamentos de nossos antepassados
  rationale: Expressa com clareza que são mandamentos ancestrais recebidos por tradição; “antepassados” evita que “pais” seja entendido apenas como progenitores imediatos.
theological_decisions:
- issue: Caráter ancestral dos mandamentos em πατρίους ἡμῶν
  choice: de nossos antepassados
  alternative: nossos mandamentos ancestrais
  rationale: A escolha conserva a referência à tradição herdada, sem identificar os mandamentos com uma formulação denominacional específica. A alternativa adjetival é igualmente possível e consta em nota.
- issue: Relação entre morrer e transgredir marcada por ἢ
  choice: morrer em vez de transgredir
  alternative: morrer, e não transgredir
  rationale: O contexto exige contraste entre as duas possibilidades. A redação escolhida preserva a tensão do compromisso dos irmãos sem transformar a frase numa explicação teológica ampliada.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O vocativo “ó tirano” mantém a solenidade e a contundência do original; “transgredir” conserva o registro ético-religioso de παραβαίνειν.
