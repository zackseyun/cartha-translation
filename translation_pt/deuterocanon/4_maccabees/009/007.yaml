  yaml_path: translation/deuterocanon/4_maccabees/009/007.yaml
  text: Go on, then, tyrant; and if you kill our lives because of godliness, do not suppose that by torturing us you are harming us.
translation:
  language: pt
  text: Põe-nos à prova, então, tirano! E, se nos tirares a vida[a] por causa da nossa devoção a Deus, não penses que, ao nos torturar, estás nos fazendo mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “matares nossas almas”; aqui, “almas” tem o sentido de vidas ou pessoas.
    reason: Registra a expressão grega e a ambiguidade lexical de ψυχή, explicando a tradução idiomática no texto principal.
lexical_decisions:
- source_word: πεῖραζε
  choice: Põe-nos à prova
  rationale: O imperativo significa testar ou pôr à prova. O objeto não está expresso no grego, mas o contexto imediato aponta para os irmãos; a formulação é natural em português e preserva o tom desafiador.
- source_word: ψυχὰς
  choice: vida
  rationale: Embora o plural grego possa ser traduzido literalmente por “almas”, aqui θανατώσεις (“matares/tirares a vida”) favorece o sentido de vidas ou pessoas vivas. “Nos tirares a vida” evita sugerir uma afirmação técnica sobre a morte da alma.
- source_word: εὐσέβειαν
  choice: devoção a Deus
  rationale: No contexto religioso, o termo denota piedade ou devoção reverente. A expressão escolhida é clara em português atual e explicita o referente divino sem introduzir uma doutrina denominacional.
- source_word: βλάπτειν
  choice: fazendo mal
  rationale: Comunica de modo natural o sentido amplo de causar dano ou prejuízo, sem definir se o dano seria físico, moral ou último.
theological_decisions:
- issue: Sentido de ψυχή no contexto da morte
  choice: vida
  alternative: alma
  rationale: 'O verbo θανατόω indica matar, e ψυχή pode designar a vida. A escolha preserva a tensão do argumento: o tirano pode matar, mas não causar o dano que imagina. Uma nota registra a forma literal.'
- issue: Natureza do dano negado
  choice: manter “fazendo mal” sem qualificação
  alternative: “causando verdadeiro dano” ou “ferindo nossa alma”
  rationale: O texto não especifica a natureza ou o alcance do dano. Evita-se resolver a tensão acrescentando uma distinção teológica que não está expressa no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O imperativo e a exclamação preservam o desafio dirigido ao tirano; a segunda frase mantém a construção condicional e a tensão do original.
