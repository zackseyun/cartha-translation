  text: For we consider your pity for our unlawful deliverance to be harsher than death itself[a].
translation:
  language: pt
  text: Pois consideramos que, para você, a compaixão por nossa preservação contrária à Lei é mais penosa do que a própria morte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a misericórdia por nossa preservação ilegal” ou “a compaixão em vista de nos preservar de modo contrário à Lei”.'
    reason: Registra alternativas para ἔλεος e σωτηρία e a relação que ἐπί pode exprimir entre a compaixão e a preservação obtida mediante transgressão.
lexical_decisions:
- source_word: χαλεπώτερον
  choice: mais cruel
  rationale: O comparativo exprime algo mais duro, penoso ou severo. “Mais cruel” comunica naturalmente a gravidade moral e emocional da compaixão oferecida sob condição de transgressão, sem limitá-la à dor física.
- source_word: αὐτοῦ τοῦ θανάτου
  choice: que a própria morte
  rationale: Reproduz a comparação enfática, incluindo a força intensificadora de αὐτοῦ.
- source_word: νομίζομεν
  choice: consideramos
  rationale: Expressa avaliação ou juízo refletido e corresponde ao registro digno do discurso.
- source_word: ἔλεον
  choice: compaixão
  rationale: Mantém o sentido de piedade demonstrada ao poupar alguém, sem a carga teológica que “misericórdia” poderia adquirir.
- source_word: παρανόμῳ
  choice: contrária à Lei
  rationale: O adjetivo indica aquilo que viola a lei; a inicial maiúscula esclarece que, no contexto, se trata da Lei ancestral, e não apenas de uma norma civil genérica.
- source_word: σωτηρίᾳ
  choice: libertação
  rationale: Aqui designa ser livrado ou preservado da morte, não salvação em sentido doutrinário.
- source_word: ἐπὶ τῇ παρανόμῳ σωτηρίᾳ ἡμῶν
  choice: por nossa libertação contrária à Lei
  rationale: Conserva de modo conciso a relação da compaixão com a preservação da vida obtida mediante transgressão, sem definir em excesso se a preposição aponta para o motivo, o propósito ou a circunstância.
theological_decisions:
- issue: Se σωτηρία deve receber uma tradução explicitamente teológica
  choice: libertação
  alternative: salvação
  rationale: O contexto trata de escapar da morte por meio da violação da Lei, e não de salvação em sentido doutrinário.
- issue: Se παράνομος se refere à ilegalidade genérica ou à transgressão da Lei ancestral
  choice: contrária à Lei
  alternative: ilegal
  rationale: O contexto imediato é a recusa em desobedecer à Lei ancestral. A formulação escolhida torna essa referência perceptível sem acrescentar uma identificação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção principal preserva a tensão entre a oferta de compaixão e a libertação condicionada à transgressão; a nota explicita, sem resolver, a ambiguidade relacional da expressão grega.
