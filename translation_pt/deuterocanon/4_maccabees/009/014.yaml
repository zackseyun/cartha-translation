  text: And, being broken limb by limb, he kept accusing them, saying,
translation:
  language: pt
  text: 'E, enquanto era quebrado membro por membro, continuava a acusá-los[a], dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “continuava a denunciá-los” ou “a censurá-los”.'
    reason: Neste contexto, κατηγόρει pode indicar acusação, denúncia ou censura dirigida aos torturadores, sem exigir um sentido jurídico formal.
lexical_decisions:
- source_word: κατὰ πᾶν μέλος
  choice: membro por membro
  rationale: A expressão distributiva indica cada parte ou membro do corpo. “Membro por membro” preserva de modo natural a dimensão corporal e progressiva do suplício.
- source_word: κλώμενος
  choice: enquanto era quebrado
  rationale: O particípio presente passivo descreve a ação física em curso. “Era quebrado” mantém o sentido direto sem intensificá-lo para “despedaçado” ou “mutilado”.
- source_word: κατηγόρει
  choice: continuava a acusá-los
  rationale: O imperfeito indica ação continuada. “Acusá-los” conserva o sentido básico do verbo e sua possível conotação de denúncia ou censura no contexto.
- source_word: λέγων
  choice: dizendo
  rationale: O particípio introduz a fala do versículo seguinte e deixa a construção sintaticamente aberta.
