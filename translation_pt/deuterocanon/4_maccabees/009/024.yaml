  text: through which our righteous and ancestral providence[a], having become gracious to the nation[b], might punish the accursed tyrant.
translation:
  language: pt
  text: por meio da qual a nossa justa e ancestral providência, tendo-se tornado favorável à nação[a], pudesse castigar o tirano maldito[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “misericordiosa” ou “propícia”; o termo grego indica uma disposição benigna ou favorável.
    reason: lexical_alternative
  - marker: b
    text: Ou “o tirano funesto”; o termo grego também pode ter associações com vingança ou desgraça.
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ἧς
  choice: por meio da qual
  rationale: διά com o pronome relativo no genitivo tem valor instrumental e retoma um antecedente feminino no contexto anterior; a formulação conserva tanto essa referência quanto a ideia de meio.
- source_word: ἵλεως
  choice: favorável
  rationale: O adjetivo indica disposição benigna ou propícia. “Favorável” combina naturalmente com o dativo “à nação” sem restringir o sentido à compaixão nem introduzir terminologia técnica.
- source_word: ἡ δικαία καὶ πάτριος ἡμῶν πρόνοια
  choice: a nossa justa e ancestral providência
  rationale: πρόνοια mantém aqui seu elevado sentido teológico de cuidado providencial; πάτριος significa aquilo que pertence aos antepassados ou foi recebido deles, e não “paternal”.
- source_word: τῷ ἔθνει
  choice: à nação
  rationale: O dativo indica a coletividade para com a qual a providência se torna favorável; “nação” preserva o sentido coletivo de ἔθνος no contexto judaico.
- source_word: γενηθεῖσα
  choice: tendo-se tornado
  rationale: O particípio aoristo de γίνομαι apresenta a mudança ou o resultado anterior à ação de castigar e mantém visível a construção participial do grego.
- source_word: τιμωρήσειεν
  choice: pudesse castigar
  rationale: O optativo exprime possibilidade ou desejo no contexto retórico e semelhante a uma súplica; “pudesse” evita tornar a ação excessivamente categórica.
- source_word: τὸν ἀλάστορα τύραννον
  choice: o tirano maldito
  rationale: ἀλάστωρ pode caracterizar alguém como maldito, funesto ou ligado à vingança. “Tirano maldito” é natural em português e preserva o tom condenatório sem impor uma interpretação demonológica.
theological_decisions:
- issue: Referência de “a nossa justa e ancestral providência”
  choice: Manter “providência” como referência reverente ao cuidado providencial associado à fé ancestral de Israel, sem acrescentar explicitamente “de Deus”
  alternative: Entender πρόνοια como uma providência abstrata e impessoal
  rationale: O registro e o contexto favorecem uma dimensão teológica, mas o grego não nomeia Deus diretamente. A tradução conserva essa tensão em vez de explicitá-la.
- issue: Força modal do optativo τιμωρήσειεν
  choice: Traduzir por “pudesse castigar”
  alternative: “castigaria” ou “castigasse”
  rationale: A forma escolhida preserva a nuance potencial ou volitiva do optativo sem decidir de modo indevido entre simples possibilidade e desejo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe relativamente formal para acompanhar o tom elevado do original. “Ancestral” preserva a ligação com os antepassados; “providência” mantém o registro teológico sem explicitação doutrinária.
