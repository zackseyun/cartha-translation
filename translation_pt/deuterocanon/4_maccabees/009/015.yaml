  yaml_path: translation/deuterocanon/4_maccabees/009/015.yaml
  text: Most defiled tyrant[a], enemy of heavenly justice, and savage-minded man, you are not torturing me in this way because I have committed murder, nor because I have acted impiously, but because I am defending the divine law.
translation:
  language: pt
  text: 'Ó tirano imundíssimo, inimigo da justiça celestial[a] e de mente cruel, não me torturas desta maneira por eu ter cometido homicídio, nem por ter agido com impiedade, mas por defender a lei divina.


    [a] Ou: “do juízo celestial”. O termo grego pode se referir tanto à justiça em sentido amplo quanto ao juízo ou à punição judicial.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do juízo celestial”. O termo grego pode se referir tanto à justiça em sentido amplo quanto ao juízo ou à punição judicial.'
    reason: Alternativa lexical para δίκη, cuja amplitude semântica não deve ser eliminada na tradução.
lexical_decisions:
- source_word: μιερώτατε
  choice: imundíssimo
  rationale: O superlativo vocativo expressa contaminação ou impureza moral e religiosa. “Imundíssimo” conserva a força do insulto direto e soa natural em português.
- source_word: τῆς οὐρανίου δίκης
  choice: da justiça celestial
  rationale: δίκη pode significar justiça, juízo ou punição. “Justiça celestial” preserva o sentido moral e judicial amplo sem restringi-lo a um veredito ou momento específico.
- source_word: ὠμόφρον
  choice: de mente cruel
  rationale: O composto descreve uma disposição interior cruel ou brutal. A expressão mantém esse foco no caráter e é clara em português.
- source_word: καταικίζεις
  choice: me torturas
  rationale: No contexto de maus-tratos físicos sofridos pelo mártir, o verbo denota abuso violento; “torturas” comunica com precisão a ação concreta e sua intensidade.
- source_word: ἀνδροφονήσαντά
  choice: ter cometido homicídio
  rationale: O particípio denota matar um ser humano, com sentido de homicídio. A formulação preserva a linguagem de acusação criminal e o registro elevado.
- source_word: ἀσεβήσαντα
  choice: ter agido com impiedade
  rationale: O verbo indica conduta ímpia contra Deus ou contra deveres sagrados. A escolha conserva explicitamente sua dimensão religiosa.
- source_word: θείου νόμου
  choice: a lei divina
  rationale: Tradução próxima da expressão grega, adequada ao tom elevado do discurso e sem acrescentar uma identificação além do que o texto declara.
- source_word: προασπίζοντα
  choice: defender
  rationale: O verbo significa colocar-se em defesa de algo ou protegê-lo. “Defender” é direto, natural e preserva o contraste forense com as acusações negadas.
theological_decisions:
- issue: Sentido de δίκη em “inimigo da justiça celestial”
  choice: 'Sentido moral e judicial amplo: “justiça”'
  alternative: “juízo celestial” ou “punição celestial”
  rationale: O texto pode apresentar o tirano como inimigo tanto da ordem justa proveniente do céu quanto de sua ação judicial. “Justiça” preserva essa amplitude; a alternativa legítima é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com retórica direta apropriada à interpelação do mártir. O vocativo recebe “Ó” para fluidez; a construção paralela “não... nem... mas...” preserva o contraste enfático do grego.
