  to: Depois que todos admiraram sua firmeza de espírito, os guardas conduziram o segundo depois do primeiro em idade.[a] Depois de lhe colocarem mãos de ferro com garras afiadas,[b] prenderam-no aos instrumentos e à catapulta.[c]
  rationale: A revisão elimina duas construções pouco naturais em português, preservando a sintaxe narrativa, a identificação etária e as ambiguidades materiais do grego. Os marcadores permanecem junto às expressões a que se referem.
