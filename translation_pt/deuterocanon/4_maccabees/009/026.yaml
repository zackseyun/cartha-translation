base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/026.yaml
  text: And when all had marveled at his steadfast courage[a], the guards led in the second after the first in age, and after fitting iron claws onto his hands[c][b], they bound him to the instruments and the catapult.
translation:
  language: pt
  text: Depois que todos admiraram sua firmeza de espírito, os guardas conduziram o segundo depois do primeiro em idade.[a] Depois de lhe colocarem mãos de ferro com garras afiadas,[b] prenderam-no aos instrumentos e à catapulta.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o segundo em idade depois do primeiro”; a expressão identifica o irmão pela ordem de idade.
    reason: lexical_alternative
  - marker: b
    text: As “mãos de ferro com garras afiadas” provavelmente eram instrumentos de tortura dotados de projeções pontiagudas semelhantes a unhas ou garras.
    reason: cultural_note
  - marker: c
    text: Ou, possivelmente, “ao cavalete” ou a outra máquina de tortura; o termo grego significa literalmente “catapulta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: θαυμασάντων
  choice: Depois que ... admiraram
  rationale: O particípio aoristo em genitivo absoluto indica uma reação anterior à ação principal; a construção temporal é natural em português.
- source_word: καρτεροψυχίαν
  choice: firmeza de espírito
  rationale: Expressa a constância interior e a resistência corajosa diante do sofrimento, sem reduzir o termo apenas a bravura física.
- source_word: δορυφόροι
  choice: guardas
  rationale: Embora o sentido literal seja ‘porta-lanças’, o termo designa aqui os agentes ou guardas encarregados dos irmãos.
- source_word: τὸν καθʼ ἡλικίαν τοῦ προτέρου δεύτερον
  choice: o segundo mais velho, depois do primeiro
  rationale: Preserva a identificação do irmão segundo a ordem de idade, em formulação compreensível no português atual.
- source_word: σιδηρᾶς ... χεῖρας
  choice: mãos de ferro
  rationale: Mantém a imagem literal de instrumentos de ferro semelhantes a mãos, esclarecida pela menção imediata às garras afiadas.
- source_word: ὀξέσι τοῖς ὄνυξιν
  choice: com garras afiadas
  rationale: No contexto de tortura, ὄνυξ descreve melhor projeções curvas ou pontiagudas semelhantes a garras.
- source_word: ὀργάνοις
  choice: instrumentos
  rationale: Conserva o caráter geral do termo grego; o contexto deixa claro que se trata de instrumentos de tortura.
- source_word: καταπέλτῃ
  choice: catapulta
  rationale: É o sentido lexical direto do grego, embora neste contexto possa designar uma máquina de tortura, possibilidade registrada em nota.
- source_word: προσεδήσαν
  choice: o prenderam
  rationale: Traduz de modo direto o ato de amarrar ou fixar alguém aos aparelhos.
