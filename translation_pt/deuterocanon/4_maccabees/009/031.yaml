  text: For I, by the pleasures that come through virtue, lighten the pain.
translation:
  language: pt
  text: Pois eu alivio a dor com os prazeres agradáveis que vêm por meio da virtude.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδέσι ταῖς ... ἡδοναῖς
  choice: com os prazeres
  rationale: 'O dativo tem valor instrumental: os prazeres são o meio pelo qual o falante torna a dor mais leve. A expressão grega intensifica a ideia de prazer; em português, “com os prazeres” evita uma repetição artificial e preserva o paradoxo.'
- source_word: διὰ τὴν ἀρετήν
  choice: que vêm por meio da virtude
  rationale: διά com acusativo admite valor causal ou mediador. A formulação mantém a ligação entre os prazeres e a virtude sem reduzi-la apenas a finalidade.
- source_word: ἀρετήν
  choice: virtude
  rationale: No horizonte moral e filosófico de 4 Macabeus, o termo designa excelência ética e firmeza piedosa; “virtude” é a equivalência mais direta e reconhecível.
- source_word: τὸν πόνον
  choice: a dor
  rationale: Embora πόνος possa significar esforço ou sofrimento, o contexto imediato de tortura favorece a dor física.
- source_word: ἐπικουφίζομαι
  choice: alivio
  rationale: O verbo significa tornar mais leve ou mitigar. “Alivio” comunica naturalmente em português a redução da intensidade da dor.
theological_decisions:
- issue: Força moral e filosófica de ἀρετή
  choice: virtude
  alternative: excelência
  rationale: “Virtude” preserva o sentido ético do termo e sua relação com a piedade racional e a perseverança sob sofrimento, sem acrescentar uma leitura confessional.
- issue: Relação expressa por διὰ τὴν ἀρετήν
  choice: que vêm por meio da virtude
  alternative: por causa da virtude; em favor da virtude
  rationale: A tradução conserva a possível ideia de mediação ou origem e não resolve a expressão exclusivamente como causa ou finalidade.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase preserva a concisão e o paradoxo do original: a dor da tortura é aliviada pelos prazeres ligados à virtude.'
