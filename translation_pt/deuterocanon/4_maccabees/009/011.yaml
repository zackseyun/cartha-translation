  text: So[a], when they were ordered to do so, the torturers brought forward the eldest of them, and after tearing open his tunic, they bound his hands and arms on both sides with straps.
translation:
  language: pt
  text: Por isso, ao receberem a ordem, os torturadores[a] trouxeram à frente o mais velho deles e, depois de lhe rasgarem a túnica, amarraram-lhe as mãos e os braços com correias de ambos os lados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O substantivo grego aqui traduzido como “torturadores” apresenta uma forma textual e lexical incomum; o contexto indica claramente os homens do rei que executavam a tortura.
    reason: textual_variant
lexical_decisions:
- source_word: ὅθεν
  choice: Por isso
  rationale: Introduz a ação seguinte como consequência narrativa, em português natural e digno.
- source_word: τὸν πρεσβύτατον αὐτῶν
  choice: o mais velho deles
  rationale: Preserva o superlativo πρεσβύτατον e o sentido partitivo de αὐτῶν.
- source_word: κελευσθέντες
  choice: ao receberem a ordem
  rationale: Expressa de modo idiomático o particípio aoristo passivo e sua função circunstancial, sem explicitar quem deu a ordem além do que consta no verso.
- source_word: οἱ μιστισταί
  choice: os torturadores
  rationale: Embora a forma transmitida seja textual e lexicalmente incomum, o contexto aponta para os agentes encarregados de infligir a tortura.
- source_word: παρήγαγον
  choice: trouxeram à frente
  rationale: Comunica o ato de fazer o irmão mais velho avançar e ser apresentado no cenário público de tortura.
- source_word: διαρρήξαντες τὸν χιτῶνα
  choice: depois de lhe rasgarem a túnica
  rationale: χίτων designa uma túnica ou veste próxima ao corpo; 'rasgarem' preserva a violência da ação.
- source_word: διέδησαν
  choice: amarraram
  rationale: Verbo corrente e claro para o ato de prender firmemente com correias.
- source_word: τὰς χεῖρας αὐτοῦ καὶ τοὺς βραχίονας
  choice: as mãos e os braços
  rationale: Mantém sem especificação anatômica indevida os dois termos corporais do grego.
- source_word: ἱμᾶσιν
  choice: com correias
  rationale: ἱμάς indica correia ou tira, frequentemente de couro; 'correias' é preciso e natural em português moderno.
- source_word: ἑκατέρωθεν
  choice: de ambos os lados
  rationale: Preserva a ideia bilateral do advérbio, sem definir além do texto a disposição exata das amarras.
