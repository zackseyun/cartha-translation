  yaml_path: translation/deuterocanon/4_maccabees/009/012.yaml
  text: But when they grew weary from striking him with whips[a], accomplishing nothing[b], they put him on the wheel.
translation:
  language: pt
  text: Mas, quando se cansaram de golpeá-lo com chicotes, sem conseguir nada, colocaram-no sobre a roda[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “colocaram-no na roda”. A preposição grega pode destacar o movimento em direção ao instrumento.
    reason: lexical_alternative
  - marker: b
    text: A “roda” era um instrumento de tortura, não uma roda comum de carroça.
    reason: cultural_note
lexical_decisions:
- source_word: τύπτοντες
  choice: golpeá-lo
  rationale: O particípio indica golpes repetidos; “golpeá-lo” expressa a ação física com clareza, sem acrescentar intensidade ao grego.
- source_word: ταῖς μάστιξιν
  choice: com chicotes
  rationale: μάστιξ designa chicote ou açoite usado para flagelação. “Chicotes” é claro e corrente em português moderno.
- source_word: ἐκοπίασαν
  choice: se cansaram
  rationale: O verbo indica cansaço decorrente de esforço. A formulação é natural na narrativa e conserva a ironia de os torturadores se fatigarem.
- source_word: μηδὲν ἀνύοντες
  choice: sem conseguir nada
  rationale: A expressão indica que não alcançavam o resultado pretendido. A tradução preserva essa falta de êxito sem especificar qual era o objetivo.
- source_word: ἀνέβαλον
  choice: colocaram-no
  rationale: No contexto, o verbo descreve pôr ou erguer alguém sobre um instrumento. “Colocaram-no” é preciso e não sugere detalhes mecânicos ausentes do texto.
- source_word: ἐπὶ τὸν τροχόν
  choice: sobre a roda
  rationale: τροχός refere-se aqui a uma roda usada como instrumento de tortura; “sobre” representa naturalmente ἐπί com acusativo, embora o grego também possa realçar o movimento para cima do instrumento.
