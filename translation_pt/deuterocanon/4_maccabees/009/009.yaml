  text: But because of our sacred murder[a], you will, by divine justice[b], endure a sufficient eternal torment by fire.
translation:
  language: pt
  text: Mas você, por causa do assassinato sacrílego contra nós[a], suportará, pela justiça divina, um tormento eterno à altura[b], pelo fogo[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o assassinato de pessoas consagradas»; o termo grego associa o homicídio à profanação do que é sagrado.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «um tormento eterno suficiente» ou «adequado».
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «por meio do fogo».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μιεροφονίαν
  choice: assassinato sacrílego
  rationale: O composto designa um homicídio marcado por profanação ou impiedade. Com ἡμῶν, as vítimas são os falantes; por isso, «cometido contra nós» evita a leitura equivocada de que eles próprios praticaram o assassinato.
- source_word: αὐτάρκη καρτερήσεις
  choice: suportará ... um tormento ... à altura
  rationale: καρτερέω expressa suportar com firmeza ou aguentar, enquanto αὐτάρκη qualifica o tormento como suficiente, adequado ou plenamente correspondente. «À altura» comunica em português corrente essa suficiência retributiva sem omitir o adjetivo.
- source_word: ὑπὸ τῆς θείας δίκης
  choice: pela justiça divina
  rationale: ὑπό apresenta a justiça divina como agente da retribuição; δίκη abrange justiça, juízo e penalidade, de modo que «justiça divina» preserva sua amplitude judicial e moral.
- source_word: αἰώνιον βάσανον
  choice: um tormento eterno
  rationale: βάσανος indica tormento severo; αἰώνιος marca sua duração. A formulação mantém a força do grego sem substituir a expressão por terminologia doutrinária posterior.
- source_word: διὰ πυρός
  choice: por meio do fogo
  rationale: διά com genitivo indica meio ou instrumento. «Por meio do fogo» explicita esse valor instrumental, embora «pelo fogo» também seja possível.
theological_decisions:
- issue: Natureza e duração da retribuição
  choice: um tormento eterno ... por meio do fogo
  alternative: um castigo perpétuo no fogo
  rationale: A tradução conserva a linguagem explícita de tormento, eternidade e fogo, sem harmonizá-la com uma formulação sistemático-teológica específica.
- issue: Valor retributivo de αὐτάρκη
  choice: à altura
  alternative: suficiente
  rationale: A expressão indica que o tormento será adequado ou suficiente em relação ao crime. «À altura» preserva essa correspondência sem sugerir que o tormento terminará após alcançar determinada quantidade.
translation_notes:
  register: Português moderno, digno e acessível, com «você» adequado à fala direta e acusatória. A ordem foi levemente ajustada para fluidez, e as notas preservam as alternativas compactas e a estranheza lexical do grego.
