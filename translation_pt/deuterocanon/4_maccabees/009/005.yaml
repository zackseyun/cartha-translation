base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/005.yaml
  text: But you are trying to frighten us by threatening us with death through tortures[a], as though you had not learned from Eleazar a little while ago.
translation:
  language: pt
  text: Mas você tenta nos amedrontar, ameaçando-nos com a morte por meio de torturas, como se não tivesse aprendido com Eleazar pouco tempo atrás.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, como se o exemplo recente de Eleazar não lhe tivesse ensinado nada. A frase é retórica e sarcástica, não uma negação literal de que ele tenha aprendido com Eleazar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκφοβεῖς
  choice: tenta nos amedrontar
  rationale: O presente ativo indica causar medo; em contexto de repreensão retórica, «tenta nos amedrontar» soa natural e não presume que a intimidação tenha alcançado seu objetivo.
- source_word: βασάνων
  choice: torturas
  rationale: No contexto de martírio, o plural se refere aos procedimentos ou meios concretos de tortura, e não apenas a sofrimento genérico.
- source_word: θάνατον
  choice: a morte
  rationale: Tradução direta do substantivo, aqui a morte infligida mediante torturas.
- source_word: ἀπειλῶν
  choice: ameaçando-nos
  rationale: O particípio explica o meio pelo qual se procura causar medo; a forma gerundiva preserva essa relação de modo fluente em português.
- source_word: διὰ τῶν βασάνων
  choice: por meio de torturas
  rationale: διά com genitivo expressa meio ou instrumento; esta formulação preserva com clareza que a morte viria mediante tortura.
- source_word: πρὸ βραχέως
  choice: pouco tempo atrás
  rationale: Expressão temporal idiomática que indica um momento recente anterior.
- source_word: παρὰ Ἐλεαζάρου μαθών
  choice: aprendido com Eleazar
  rationale: παρά com genitivo após μανθάνω identifica a fonte do aprendizado e alude ao exemplo de Eleazar na narrativa anterior.
theological_decisions:
- issue: Força da comparação retórica introduzida por ὥσπερ οὐχί
  choice: como se não tivesse aprendido com Eleazar pouco tempo atrás
  alternative: embora tivesse aprendido com Eleazar pouco tempo atrás
  rationale: 'A formulação mantém o sarcasmo: o tirano age como se o exemplo recente de Eleazar nada lhe tivesse ensinado, sem converter a comparação em uma paráfrase concessiva.'
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O singular «você» representa o destinatário individual implícito na forma verbal grega; «amedrontar» preserva o tom de confronto sem soar excessivamente coloquial.
