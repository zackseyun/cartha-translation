base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/019.yaml
  text: They are unconquerable on behalf of virtue[a]. While he was still saying these things, they spread fire beneath him, and, by intensifying the wheel[c][b], they tightened it further.
translation:
  language: pt
  text: Em defesa da virtude[a], eles são invencíveis. Enquanto ele ainda dizia essas coisas, espalharam fogo debaixo dele e, intensificando a ação da roda[b], aumentaram ainda mais a tensão[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por causa da virtude” ou “em favor da virtude”. A expressão grega pode indicar aquilo em defesa do qual, ou por cuja causa, alguém age ou sofre.'
    reason: lexical_alternative
  - marker: b
    text: Isto é, a roda usada como instrumento de tortura.
    reason: cultural_note
  - marker: c
    text: O verbo grego é difícil neste contexto; indica que os torturadores aumentaram ainda mais o aperto ou o estiramento imposto pela roda.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ ἀρετῆς
  choice: em defesa da virtude
  rationale: Ὑπέρ com o genitivo exprime agir ou sofrer em favor de algo ou por sua causa. “Em defesa da virtude” é natural em português e conserva a ideia de perseverança pela virtude, sem reduzir a expressão a uma relação meramente causal.
- source_word: ἀνίκητοι
  choice: invencíveis
  rationale: O adjetivo indica aqueles que não podem ser vencidos. “Invencíveis” reproduz com concisão e força a afirmação grega.
- source_word: ταῦτα λέγων ἔτι
  choice: enquanto ele ainda dizia essas coisas
  rationale: A construção participial com ἔτι apresenta a fala como ainda em andamento quando começa a ação seguinte; “essas coisas” preserva o plural ταῦτα.
- source_word: πῦρ ἐπέστρωσαν
  choice: espalharam fogo debaixo dele
  rationale: O verbo pode descrever o ato de estender ou espalhar algo. O complemento “debaixo dele” é suprido pelo contexto do suplício e torna inteligível a disposição do fogo, sem alterar a ação principal.
- source_word: διερεθίζοντες τὸν τροχόν
  choice: intensificando a ação da roda
  rationale: Διερεθίζω comunica incitação, agitação ou intensificação. Como a roda é o objeto expresso, esta formulação conserva essa relação gramatical e evita introduzir a ideia não expressa de simplesmente girá-la.
- source_word: προσεπικατέτεινον
  choice: aumentaram ainda mais a tensão
  rationale: O verbo composto é intensivo e difícil neste contexto, mas indica um aumento adicional do estiramento ou aperto. A formulação preserva a escalada do suplício sem especificar indevidamente se apertaram a roda ou esticaram a vítima.
theological_decisions:
- issue: Tradução de ἀρετή no contexto filosófico e martirial
  choice: virtude
  alternative: excelência moral
  rationale: “Virtude” preserva o vocabulário moral-filosófico de 4 Macabeus, que associa excelência moral, piedade racional e domínio das paixões, sem importar terminologia confessional posterior.
- issue: Identificação explícita do τροχός como instrumento de tortura
  choice: a roda
  alternative: a roda de tortura
  rationale: O grego diz apenas “a roda”. A tradução mantém essa transparência no texto principal, enquanto a nota explica sua função contextual.
- issue: Objeto implícito e sentido do verbo προσεπικατέτεινον
  choice: aumentaram ainda mais a tensão
  alternative: apertaram-no ainda mais / esticaram-no ainda mais
  rationale: Como o objeto não está expresso e o verbo composto é raro e contextualmente difícil, a tradução preserva o sentido seguro de intensificação sem decidir entre apertar o instrumento e estirar a vítima.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o vocabulário filosófico de “virtude” e preserva a incerteza lexical da cláusula final em nota, sem tornar o texto principal obscuro.
