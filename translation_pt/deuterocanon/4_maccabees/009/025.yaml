  text: And after saying this[a], the devout young man breathed his last.
translation:
  language: pt
  text: E, depois de dizer isso, o jovem devoto deu o último suspiro[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “desprendeu a alma”. A expressão grega é uma maneira vívida e idiomática de dizer que ele morreu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: E
  rationale: Conjunção narrativa comum que liga esta ação à sequência anterior.
- source_word: ταῦτα εἰπών
  choice: depois de dizer isso
  rationale: O particípio aoristo indica naturalmente uma ação anterior à principal; esta formulação é clara e corrente em português.
- source_word: ὁ ἱεροπρεπὴς νεανίας
  choice: o jovem devoto
  rationale: ἱεροπρεπής descreve porte ou caráter condizente com o sagrado. “Devoto” comunica a qualidade religiosa sem sugerir que o jovem exercia um ofício sacerdotal.
- source_word: ἀπέρρηξεν τὴν ψυχήν
  choice: entregou a alma
  rationale: A expressão vívida significa que ele morreu. A tradução mantém a imagem e a referência explícita a ψυχή, enquanto a nota esclarece seu uso idiomático.
theological_decisions:
- issue: Sentido de ψυχή na expressão de morte
  choice: alma
  alternative: vida; deu o último suspiro
  rationale: A tradução conserva o termo concreto e a força da expressão grega sem transformar o verso numa afirmação técnica sobre a natureza ou separação da alma; a nota explicita que, no contexto, trata-se de uma maneira de dizer que ele morreu.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Jovem devoto” evita a rigidez de “jovem reverente” e não atribui ofício sacerdotal. A imagem incomum do grego é preservada no texto e esclarecida em nota.
