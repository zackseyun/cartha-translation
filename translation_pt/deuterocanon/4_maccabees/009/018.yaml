lexical_decisions:
- source_word: διὰ πασῶν ... τῶν βασάνων
  choice: por meio de todas as torturas
  rationale: Com o genitivo, διά pode indicar meio ou percurso. “Por meio de todas as torturas” conserva a relação sintática e a abrangência do plural grego sem especificar além do texto como elas produziriam a convicção.
- source_word: πείσω
  choice: convencerei
  rationale: O futuro ativo de πείθω expressa aqui a ideia de levar os interlocutores à convicção mediante a demonstração proporcionada pelas torturas.
- source_word: ὑμᾶς
  choice: vocês
  rationale: Representa com clareza o pronome de segunda pessoa do plural, sem decidir se a fala se dirige ao tirano, aos presentes ou a ambos.
- source_word: μόνοι
  choice: somente
  rationale: Mantém a exclusividade expressa por μόνοι e se liga naturalmente ao sintagma nominal que vem em seguida.
- source_word: οἱ παῖδες Ἑβραίων
  choice: os filhos dos hebreus
  rationale: παῖδες pode designar filhos, crianças, rapazes ou servos. No contexto dos irmãos mártires, “filhos” preserva a referência masculina e a construção genitiva, sem reduzir a expressão simplesmente a “jovens hebreus”.
theological_decisions:
- issue: Referência masculina em παῖδες
  choice: filhos
  alternative: crianças; jovens
  rationale: O contexto identifica os personagens como irmãos do sexo masculino. “Filhos” preserva essa especificidade contextual sem introduzir uma interpretação doutrinária.
- issue: Incompletude sintática da oração preservada
  choice: não completar o predicado após “os filhos dos hebreus”
  alternative: suprir a ideia presumida a partir do versículo seguinte
  rationale: A redação grega fornecida termina numa oração introduzida por ὅτι que permanece incompleta isoladamente. Acrescentar um predicado resolveria uma tensão que o texto desta unidade não resolve.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com uso de “vocês” para a segunda pessoa do plural. A construção deliberadamente incompleta no fim reproduz o estado sintático do trecho grego fornecido; as notas esclarecem tanto a amplitude lexical de παῖδες quanto a continuidade provável com o versículo seguinte.
