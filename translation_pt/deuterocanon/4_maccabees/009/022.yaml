  text: mas, como que transformado no fogo para a incorruptibilidade[a], suportou nobremente as…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para a imortalidade” ou “para um estado imperecível”.'
