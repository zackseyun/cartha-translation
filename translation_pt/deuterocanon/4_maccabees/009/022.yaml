lexical_decisions:
- source_word: ἀλλʼ
  choice: mas
  rationale: Conjunção adversativa que marca contraste com o contexto anterior.
- source_word: ὥσπερ
  choice: como que
  rationale: Introduz uma comparação sem afirmar que a transformação já ocorre literalmente.
- source_word: ἐν πυρί
  choice: no fogo
  rationale: Preserva de modo natural a imagem locativa do grego, embora um sentido instrumental também seja possível.
- source_word: μετασχηματιζόμενος
  choice: transformado
  rationale: Expressa a mudança de condição ou forma indicada pelo particípio presente médio/passivo; com “como que”, a construção fica fluente em português sem perder o caráter processual da imagem.
- source_word: εἰς ἀφθαρσίαν
  choice: para a incorruptibilidade
  rationale: Mantém a amplitude de ἀφθαρσία como estado não sujeito à corrupção ou perecimento, sem reduzi-lo apenas à duração infinita da vida.
- source_word: ὑπέμεινεν
  choice: suportou
  rationale: Verbo natural em português para a perseverança firme em meio ao sofrimento.
- source_word: εὐγενῶς
  choice: nobremente
  rationale: Conserva a avaliação moral elevada da conduta do mártir.
- source_word: τὰς
  choice: as…
  rationale: O texto grego fornecido termina no artigo definido feminino plural, sem o substantivo ou objeto que deveria acompanhá-lo; a reticência sinaliza honestamente a lacuna.
theological_decisions:
- issue: Sentido de εἰς ἀφθαρσίαν no contexto do martírio
  choice: para a incorruptibilidade
  alternative: para a imortalidade; para o estado imperecível
  rationale: “Incorruptibilidade” preserva tanto a dimensão escatológica quanto a amplitude lexical do termo grego, sem impor uma formulação doutrinária mais específica.
- issue: Caráter da transformação expressa por ὥσπερ μετασχηματιζόμενος
  choice: como que transformado
  alternative: como se estivesse sendo transformado
  rationale: A formulação mantém a força comparativa de ὥσπερ e não resolve como afirmação literal aquilo que o grego apresenta como imagem retórica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A ordem e a imagem retórica do grego foram preservadas, mas a construção participial foi levemente naturalizada. Não se traduziu τὰς como demonstrativo (“estas”), pois a forma grega é apenas um artigo definido; a reticência e a nota assinalam a incompletude do fragmento.
