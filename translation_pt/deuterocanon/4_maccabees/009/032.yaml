base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/032.yaml
  text: But you[a], by the threats of your ungodliness, are being tortured; and you will not escape, most defiled tyrant, the punishments of divine wrath.
translation:
  language: pt
  text: Mas você, sob as ameaças de sua impiedade, é atormentado[a]; e não escapará, tirano extremamente impuro, dos castigos da ira divina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será atormentado”. A frase grega é compacta, e o presente pode descrever um tormento já atuante ou antecipar o sofrimento futuro anunciado pelo contexto.'
    reason: ambiguidade temporal e sintática
lexical_decisions:
- source_word: βασανίζῃ
  choice: é atormentado
  rationale: Preserva o valor passivo e a forma presente do grego. O contexto pode projetar o tormento para o juízo futuro, mas a tradução mantém a tensão temporal sem converter explicitamente o verbo em futuro.
- source_word: ἐν ταῖς τῆς ἀσεβείας ἀπειλαῖς
  choice: sob as ameaças de sua impiedade
  rationale: ἀπειλαῖς significa propriamente “ameaças”. A preposição “sob” comunica em português a condição opressiva expressa pela construção com ἐν, enquanto “sua” explicita a relação com a impiedade do tirano indicada pelo contexto.
- source_word: ἀσεβείας
  choice: impiedade
  rationale: Termo corrente e digno que preserva a dimensão religiosa e moral de ἀσέβεια.
- source_word: μιερώτατε
  choice: extremamente impuro
  rationale: O superlativo exprime o grau máximo de contaminação moral e possivelmente ritual. “Impuro” conserva essa nuance melhor que o mais genérico “abominável”.
- source_word: τύραννε
  choice: tirano
  rationale: Equivalente direto e natural, com a mesma carga política e moral condenatória.
- source_word: τὰς ... δίκας
  choice: os castigos
  rationale: No contexto de juízo, δίκαι designa penas impostas justamente; “castigos” é claro e idiomático.
- source_word: θείας ὀργῆς
  choice: da ira divina
  rationale: Mantém o adjetivo θείας sem substituir a formulação grega pela expressão mais explícita “ira de Deus”.
theological_decisions:
- issue: Referente de θείας ὀργῆς
  choice: ira divina
  alternative: ira de Deus
  rationale: O grego emprega o adjetivo “divina”, não nomeia Deus diretamente. A tradução preserva essa forma, embora o referente divino esteja claro no contexto.
- issue: Relação temporal de βασανίζῃ com o juízo anunciado
  choice: é atormentado
  alternative: será atormentado
  rationale: A forma grega é presente, ao passo que a oração seguinte usa futuro. Preservar o presente evita resolver silenciosamente se o tormento já opera nas ameaças ímpias ou se antecipa o castigo futuro.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem vocativa foi mantida próxima do grego, e a formulação evita acrescentar uma interpretação confessional.
