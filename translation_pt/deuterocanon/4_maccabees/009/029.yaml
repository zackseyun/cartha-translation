  text: How sweet every kind of death is for our ancestral godliness! And he spoke to the tyrant,[a]
translation:
  language: pt
  text: 'Como é doce toda forma de morte por causa da nossa piedade ancestral![a] E disse ao tirano:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “devoção ancestral”. O grego ressalta a reverência religiosa recebida dos antepassados.
