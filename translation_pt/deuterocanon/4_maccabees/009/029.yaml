lexical_decisions:
- source_word: Ὡς
  choice: Como
  rationale: Introduz uma exclamação intensa e corresponde de modo natural à força exclamativa do grego.
- source_word: ἡδὺς
  choice: doce
  rationale: Preserva a imagem vívida e o paradoxo retórico de considerar a morte doce em razão da fidelidade religiosa.
- source_word: πᾶς τρόπος θανάτου
  choice: toda forma de morte
  rationale: 'Expressa de maneira idiomática o alcance distributivo da frase: qualquer modo pelo qual a morte possa ocorrer.'
- source_word: διὰ
  choice: por causa de
  rationale: Com o acusativo, indica aqui causa ou motivo; a locução torna essa relação explícita e natural em português.
- source_word: τὴν πάτριον ἡμῶν εὐσέβειαν
  choice: a nossa piedade ancestral
  rationale: “Piedade” comunica reverência e devoção a Deus, enquanto “ancestral” preserva a ideia de algo recebido dos antepassados.
- source_word: ἔφη τε
  choice: E disse
  rationale: Reproduz a ligação narrativa e introduz diretamente a fala que continua no versículo seguinte.
- source_word: πρὸς τὸν τύραννον
  choice: ao tirano
  rationale: Mantém a designação moralmente carregada do governante perseguidor, em vez de neutralizá-la como “rei”.
theological_decisions:
- issue: Sentido de εὐσέβεια no contexto do martírio
  choice: piedade
  alternative: devoção religiosa
  rationale: O termo abrange reverência a Deus manifestada na fidelidade à tradição ancestral. “Piedade” conserva essa dimensão religiosa sem reduzi-la a mero costume cultural; a nota esclarece o sentido para leitores modernos.
translation_notes:
  register: Português moderno, digno e de leitura ampla. Conserva-se o paradoxo “doce... morte” e usa-se dois-pontos no fim porque a oração introduz a fala que prossegue no versículo seguinte.
