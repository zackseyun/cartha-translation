  text: Counselor of lawlessness[a], tyrant, do not hate us; rather, have mercy on us more than on them.
translation:
  language: pt
  text: Conselheiro da transgressão da lei, tirano, não nos odeies mais do que a eles; tem misericórdia de nós.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego é sintaticamente condensado; mais literalmente: “Conselheiro, tirano da transgressão da lei, não nos odiando mais do que a eles, tem misericórdia de nós”. Embora a posição de “mais do que a eles” favoreça sua ligação a “odeies”, a expressão também pode ser entendida com “tem misericórdia”: “tem mais misericórdia de nós do que deles”. Também é possível entender ὑπέρ em sentido causal: “por causa deles”.'
    reason: Registra a construção comprimida e as leituras plausíveis de ὑπὲρ αὐτούς, sem ocultar que sua posição favorece a ligação com “odeies”.
lexical_decisions:
- source_word: σύμβουλε
  choice: conselheiro
  rationale: Vocativo singular de σύμβουλος. “Conselheiro” preserva a forma direta de tratamento e o sentido de quem aconselha ou promove determinada conduta.
- source_word: τύραννε
  choice: tirano
  rationale: Vocativo dirigido ao governante perseguidor. “Tirano” mantém a forte censura política e moral do grego.
- source_word: παρανομίας
  choice: da transgressão da lei
  rationale: O genitivo de παρανομία denota violação ou desprezo da lei. A expressão explicita o sentido para leitores modernos sem reduzi-lo à mera ilegalidade jurídica.
- source_word: μὴ … μισῶν
  choice: não nos odeies
  rationale: A construção proibitiva com particípio é vertida por um imperativo negativo natural em português.
- source_word: ὑπὲρ αὐτούς
  choice: mais do que deles
  rationale: Ὑπέρ com acusativo pode marcar comparação. Na leitura adotada, a expressão qualifica a misericórdia pedida, embora a ordem comprimida do grego permita outra ligação sintática.
- source_word: ἡμᾶς
  choice: nós / de nós
  rationale: O pronome ocorre duas vezes, primeiro como objeto de “odiar” e depois de “ter misericórdia”; a repetição é preservada de modo idiomático.
- source_word: ἐλέα
  choice: tem misericórdia
  rationale: Forma imperativa de ἐλεέω. “Ter misericórdia” conserva tanto a compaixão quanto o apelo por clemência.
theological_decisions:
- issue: Relação de ὑπὲρ αὐτούς com os verbos e força da repetição de ἡμᾶς
  choice: O tirano é instado a ter mais misericórdia de “nós” do que “deles”.
  alternative: “Não nos odeies mais do que a eles; tem misericórdia de nós” ou “não nos odeies por causa deles; tem misericórdia de nós”.
  rationale: O texto transmitido é sintaticamente comprimido. Ὑπέρ com acusativo admite valor comparativo, mas sua posição permite ligá-lo ao ódio ou, menos provavelmente, entendê-lo em sentido causal. A tradução principal segue a leitura comparativa aplicada à misericórdia e registra as demais na nota.
- issue: Ligação do genitivo παρανομίας
  choice: “Da transgressão da lei” qualifica “conselheiro”.
  alternative: “Conselheiro, tirano da transgressão da lei”.
  rationale: A sequência de vocativos e do genitivo permite alguma incerteza de ligação. A leitura principal produz uma acusação coerente — alguém que aconselha a transgressão — sem apagar a alternativa formalmente possível.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas verbais no singular para preservar o discurso direto ao tirano. “Antes” marca o contraste entre odiar e mostrar misericórdia sem tornar a frase excessivamente coloquial.
