base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/006.yaml
  text: But if the old men of the Hebrews died after enduring tortures because of godliness, how much more rightly should we, the young men, die, having disregarded the tortures of your compulsion, which the aged instructor also conquered.
translation:
  language: pt
  text: Mas, se os homens mais velhos entre os hebreus morreram depois de suportar torturas por causa da piedade, nós, os jovens, morreríamos mais justamente, desprezando as torturas que a sua coerção nos impõe, as quais também o velho mestre venceu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ γέροντες
  choice: os homens idosos
  rationale: Expressa diretamente a referência etária do plural grego, sem transformar o termo em título institucional como poderia sugerir «anciãos».
- source_word: εὐσέβειαν
  choice: devoção a Deus
  rationale: Neste contexto judaico, o termo indica piedade ou reverência religiosa dirigida a Deus; a explicitação produz português claro sem acrescentar uma doutrina específica.
- source_word: δικαιότερον
  choice: com muito mais razão
  rationale: 'Reproduz o comparativo no argumento: se os idosos assim morreram, é ainda mais justo ou apropriado que os jovens façam o mesmo.'
- source_word: τὰς βασάνους τῶν σῶν ἀναγκῶν
  choice: as torturas com que você procura nos obrigar
  rationale: 'Converte a compacta construção genitiva em uma relação verbal natural: as torturas são os meios de coerção empregados pelo interlocutor.'
- source_word: ὑπεριδόντες
  choice: desprezando
  rationale: Mantém a ideia de não dar importância, desafiar ou desconsiderar as torturas, e não apenas de suportá-las.
- source_word: ὁ παιδευτὴς γέρων
  choice: o idoso que nos instruiu
  rationale: Preserva tanto a idade quanto a função formadora de Eleazar no contexto, evitando o moderno sentido profissional restrito de «instrutor».
- source_word: ἐνίκησεν
  choice: foram vencidas
  rationale: Conserva a metáfora explícita de vitória sobre as torturas; a voz passiva permite ligação natural com o antecedente em português.
theological_decisions:
- issue: Sentido religioso de εὐσέβεια
  choice: devoção a Deus
  alternative: piedade
  rationale: A opção escolhida torna explícito o referente divino já pressuposto no contexto e evita que «piedade» seja entendida meramente como compaixão.
- issue: Força de δικαιότερον
  choice: com muito mais razão devemos
  alternative: seria mais justo que nós
  rationale: O optativo potencial com ἄν admite formulação modal; «devemos» comunica a conclusão moral dos jovens sem apresentar sua morte como ordem divina universal.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com tratamento por «você» para o tirano. A sintaxe longa do grego foi preservada em um único período, mas o travessão esclarece o referente da oração relativa final. Não há marcadores de nota, pois nenhuma nota foi necessária.
