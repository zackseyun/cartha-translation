revisions:
- from: Mas, se os homens idosos dos hebreus morreram depois de suportar torturas por causa da devoção a Deus, com muito mais razão devemos nós, os jovens, morrer, desprezando as torturas com que você procura nos obrigar — torturas que também foram vencidas pelo idoso que nos instruiu.
