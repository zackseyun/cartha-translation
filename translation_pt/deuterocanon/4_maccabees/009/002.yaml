  rationale: A revisão limita-se a substituir a coordenação não idiomática «conselheira e discernimento» por «conselheira e fonte de discernimento». Assim, mantém-se a obediência à Lei como guia personificado e como aquilo de que se obtém discernimento, sem impor uma interpretação doutrinária. A alternativa sintática e semântica permanece indicada na nota.
