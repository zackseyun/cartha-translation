base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/002.yaml
  text: For we would rightly bring shame on our ancestors if we did not make use of obedience to the law as our counselor and judgment[a].
translation:
  language: pt
  text: Pois desonraríamos, com razão, nossos antepassados se não recorrêssemos à obediência à Lei como nossa conselheira e fonte de discernimento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois, com razão, sentiríamos vergonha diante de nossos antepassados se não recorrêssemos à obediência à Lei para conselho e entendimento.”'
    reason: Preserva a possível leitura de αἰσχυνόμεθα como «sentir vergonha» e uma construção menos personificada de συμβούλῳ καὶ γνώσει.
lexical_decisions:
- source_word: αἰσχυνόμεθα
  choice: desonraríamos
  rationale: O sentido médio/passivo pode envolver sentir vergonha ou causar desonra. Com τοὺς προγόνους no acusativo, a leitura causativa, “desonraríamos”, expressa de modo conciso a desonra trazida sobre os antepassados.
- source_word: τοὺς προγόνους
  choice: nossos antepassados
  rationale: “Antepassados” é atual, claro e preserva a referência às gerações anteriores; o possessivo é exigido naturalmente pelo contexto em português.
- source_word: εἰκότως
  choice: com razão
  rationale: Comunica que tal desonra seria justificável ou apropriada, com naturalidade em português.
- source_word: τῇ τοῦ νόμου εὐπειθείᾳ
  choice: à obediência à Lei
  rationale: εὐπείθεια denota disposição para obedecer ou submissão obediente. “Obediência à Lei” preserva o foco ético e a referência à Lei recebida.
- source_word: συμβούλῳ
  choice: como nossa conselheira
  rationale: Preserva a personificação pela qual a obediência funciona como guia. O feminino concorda naturalmente com “obediência” em português.
- source_word: γνώσει
  choice: discernimento
  rationale: No par com συμβούλῳ, γνῶσις tem valor prático de compreensão ou discernimento; “discernimento” evita reduzir o termo a mera informação.
- source_word: χρησαίμεθα
  choice: se não recorrêssemos
  rationale: O verbo χρήομαι com dativo indica valer-se de algo. “Recorrer a” é idiomático e mantém a ideia de tomar a obediência como recurso orientador.
theological_decisions:
- issue: Relação moral com os antepassados em αἰσχυνόμεθα ... τοὺς προγόνους
  choice: A infidelidade à Lei desonraria os antepassados.
  alternative: Os falantes sentiriam vergonha diante dos antepassados.
  rationale: O acusativo τοὺς προγόνους favorece entendê-los como atingidos pela desonra, em harmonia com o apelo à fidelidade à herança ancestral. Como a forma verbal admite outra nuance, a alternativa é preservada em nota.
- issue: Função de συμβούλῳ καὶ γνώσει
  choice: A obediência à Lei é apresentada como conselheira e discernimento.
  alternative: A obediência à Lei é usada para conselho e entendimento.
  rationale: A formulação principal conserva a personificação e a coordenação compacta do grego, sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Lei” recebe inicial maiúscula por designar a Lei ancestral de Israel. A construção deliberadamente compacta “conselheira e discernimento” conserva a tensão sintática do grego; a nota oferece a alternativa mais explicativa.
