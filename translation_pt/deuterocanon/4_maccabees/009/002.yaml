  source_fidelity: 'A redação principal transmite adequadamente a leitura causativa mais provável de αἰσχυνόμεθα com τοὺς προγόνους: a desobediência desonraria os antepassados. «Obediência à Lei» corresponde bem a τῇ τοῦ νόμου εὐπειθείᾳ, e «recorrer a» comunica de modo aceitável o valor de χρήομαι. A nota preserva apropriadamente a alternativa em que o verbo expressa vergonha perante os antepassados.'
  naturalness: «Como nossa conselheira e discernimento» é pouco natural em português, pois «obediência» pode ser personificada como «conselheira», mas não funciona idiomaticamente como «discernimento». Uma pequena explicitação funcional torna a frase clara sem alterar seu sentido.
  terminology: «Antepassados», «obediência à Lei» e «discernimento» são termos modernos, compreensíveis e adequados ao registro. A maiúscula em «Lei» é defensável no contexto da lei ancestral judaica.
