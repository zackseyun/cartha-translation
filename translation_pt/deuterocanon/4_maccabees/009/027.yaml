  text: And when they asked whether he wished to eat before being tortured[a], they heard his noble resolve,
translation:
  language: pt
  text: E, quando lhe perguntaram se queria comer antes de ser torturado, ouviram sua nobre determinação[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seu nobre propósito”, “sua nobre disposição” ou “seu nobre modo de pensar”; o grego γνώμη pode indicar intenção, determinação ou maneira de pensar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δʼ εἰ
  choice: E, quando
  rationale: A expressão introduz a circunstância seguinte da narrativa; esta formulação mantém a ligação e oferece fluidez natural em português.
- source_word: φαγεῖν
  choice: comer
  rationale: O infinitivo significa diretamente “comer”, sem necessidade de expansão.
- source_word: βούλοιτο
  choice: queria
  rationale: Representa de modo natural o valor volitivo do optativo em uma pergunta indireta.
- source_word: πρὶν βασανίζεσθαι
  choice: antes de ser torturado
  rationale: No contexto do martírio, βασανίζω se refere à aplicação de tortura; a escolha conserva a gravidade e é clara em português atual.
- source_word: πυνθανόμενοι
  choice: quando lhe perguntaram
  rationale: O particípio de indagação é vertido como oração temporal, com o objeto indireto explicitado de modo idiomático.
- source_word: τὴν εὐγενῆ γνώμην
  choice: sua nobre resolução
  rationale: γνώμη aqui aponta para intenção ou disposição firme, e εὐγενής qualifica seu caráter como nobre; “resolução” preserva a dimensão volitiva sem reduzir o termo a mera opinião.
- source_word: ἤκουσαν
  choice: ouviram
  rationale: Tradução direta do aoristo de ἀκούω.
theological_decisions:
- issue: Sentido de γνώμη no contexto de martírio
  choice: resolução
  alternative: propósito; modo de pensar; disposição
  rationale: A passagem ressalta a determinação moral firme do mártir. “Resolução” comunica essa força ética e volitiva sem introduzir terminologia doutrinária posterior.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A vírgula final foi preservada porque o versículo forma uma unidade sintática que prossegue no contexto seguinte.
