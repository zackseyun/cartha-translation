  text: When they said these things[a], the tyrant was angered not only as against men who were disobedient, but was also enraged as against the ungrateful.
translation:
  language: pt
  text: Quando disseram essas coisas, o tirano se indignou com eles, vendo-os não apenas como desobedientes, mas também como ingratos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα αὐτῶν εἰπόντων
  choice: Quando eles disseram essas coisas
  rationale: A construção de genitivo absoluto tem valor temporal; “essas coisas” conserva o plural neutro e remete naturalmente às palavras anteriores dos irmãos.
- source_word: ὁ τύραννος
  choice: o tirano
  rationale: Mantém a avaliação negativa explícita de τύραννος, sem atenuá-la para “rei” ou “governante”.
- source_word: οὐ μόνον ... ἀλλʼ ... καί
  choice: não apenas ... mas também
  rationale: Reproduz a correlação retórica grega em português corrente.
- source_word: ὡς κατὰ ἀπειθούντων
  choice: com eles, considerando-os homens desobedientes
  rationale: “Considerando-os” preserva ὡς como a maneira pela qual o tirano os encarava, enquanto “com eles” expressa a postura hostil de κατά com genitivo. “Homens” explicita o referente masculino plural subentendido.
- source_word: ἐχαλέπαινεν
  choice: se irritou
  rationale: Expressa a ira intensa do tirano em português natural; o pretérito perfeito evita uma oposição aspectual artificial no contexto narrativo, embora o grego use o imperfeito.
- source_word: ὡς καὶ κατὰ ἀχαρίστων
  choice: mas também se enfureceu com eles, considerando-os ingratos
  rationale: Conserva a perspectiva acusatória do tirano e o sentido de ἀχάριστος como “ingrato”, sem afirmar diretamente que a acusação era verdadeira.
- source_word: ὠργίσθη
  choice: se enfureceu
  rationale: Distingue o segundo verbo do primeiro e transmite a força de ὀργίζομαι no desenvolvimento retórico da frase.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação “considerando-os” preserva a perspectiva do tirano indicada por ὡς, evitando apresentar “desobedientes” e “ingratos” como avaliações objetivas do narrador.
