base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/030.yaml
  text: Do you not think[a], O most savage tyrant of all, that you are now being tortured more than I am[b], seeing the proud reasoning of your tyranny being conquered by our endurance for the sake of godliness?
translation:
  language: pt
  text: Não acha, ó tirano mais cruel de todos, que agora está sendo torturado mais do que eu, ao ver o raciocínio arrogante[a] da sua tirania ser vencido pela nossa perseverança por causa de nossa devoção a Deus[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a mentalidade arrogante” ou “o desígnio arrogante”. O grego λογισμός pode indicar raciocínio, pensamento ou disposição mental dominante; “raciocínio” preserva o destaque que o livro dá à razão.
    reason: lexical_alternative
  - marker: b
    text: Ou “por causa de nossa piedade”. A expressão pode indicar que a perseverança deles é motivada por sua reverência e fidelidade a Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δοκεῖς
  choice: Você não acha
  rationale: Expressa de modo natural em português a pergunta retórica confrontadora do grego, sem enfraquecer sua força.
- source_word: ὦ πάντων ὠμότατε τύραννε
  choice: ó mais cruel de todos os tiranos
  rationale: Conserva o vocativo, o superlativo de ὠμός e a abrangência de πάντων em formulação portuguesa clara e digna.
- source_word: πλεῖον ἐμοῦ σε νῦν βασανίζεσθαι
  choice: que agora está sendo torturado mais do que eu
  rationale: 'Mantém a linguagem de tortura de βασανίζεσθαι e a inversão irônica: o tirano sofre tormento maior que sua vítima.'
- source_word: ὁρῶν
  choice: ao ver
  rationale: Reproduz o particípio circunstancial e permite tanto a relação temporal quanto a causal sugerida pelo contexto.
- source_word: τὸν τῆς τυραννίδος ὑπερήφανον λογισμὸν
  choice: o raciocínio arrogante da sua tirania
  rationale: “Raciocínio” preserva o campo conceitual recorrente de λογισμός em 4 Macabeus; “arrogante” comunica a altivez de ὑπερήφανον.
- source_word: ὑπὸ τῆς ... ὑπομονῆς
  choice: pela nossa perseverança
  rationale: Comunica a resistência constante sob sofrimento denotada por ὑπομονή e soa natural no contexto do martírio.
- source_word: διὰ τὴν εὐσέβειαν
  choice: por causa da devoção a Deus
  rationale: Explicita o referente religioso de εὐσέβεια sem acrescentar uma doutrina específica; a expressão indica que a devoção motiva a perseverança.
theological_decisions:
- issue: Sentido de εὐσέβεια no contexto do martírio
  choice: devoção a Deus
  alternative: piedade; reverência
  rationale: O termo denota fidelidade reverente a Deus que sustenta a perseverança. “Devoção a Deus” é claro no português atual e evita que “piedade” seja entendida apenas como compaixão.
- issue: Sentido de λογισμός em uma obra centrada no domínio racional
  choice: raciocínio
  alternative: modo de pensar; mentalidade; desígnio
  rationale: “Raciocínio” mantém a ligação lexical e temática da obra com a razão, sem eliminar a possibilidade contextual de se tratar da mentalidade ou do projeto dominador do tirano.
- issue: Relação de διὰ τὴν εὐσέβειαν com ὑπομονῆς
  choice: a perseverança ocorre por causa da devoção a Deus
  alternative: perseverança em favor da devoção a Deus
  rationale: 'A leitura causal é a mais natural: a devoção religiosa motiva a resistência dos mártires. A nota registra a alternativa sem transformar a frase em afirmação denominacional.'
translation_notes:
  register: Português moderno, claro e solene, com construção compreensível tanto no Brasil quanto em outros contextos lusófonos. O vocativo conserva a intensidade retórica; “está sendo torturado” preserva a ironia verbal do original, e as notas mantêm abertas as nuances de λογισμός e εὐσέβεια.
