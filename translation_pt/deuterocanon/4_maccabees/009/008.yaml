  yaml_path: translation/deuterocanon/4_maccabees/009/008.yaml
  text: For through this suffering and endurance[a], we will indeed carry off the prizes of virtue,
translation:
  language: pt
  text: Pois nós, por meio deste sofrimento e desta perseverança, conquistaremos os prêmios da virtude.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ganharemos as recompensas da excelência moral”. O grego emprega linguagem de competição; literalmente, “levaremos os prêmios da virtude”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς μὲν γὰρ
  choice: Pois ... nós ...
  rationale: «Pois» expressa o valor explicativo de γάρ; o pronome implícito na forma verbal portuguesa mantém a ênfase contextual de ἡμεῖς μὲν sem tornar a frase artificial.
- source_word: διὰ τῆσδε τῆς κακοπαθείας
  choice: por meio deste sofrimento
  rationale: Preserva o demonstrativo τῆσδε e o provável sentido instrumental de διά; «sofrimento» comunica com naturalidade a aflição dolorosa indicada por κακοπάθεια.
- source_word: ὑπομονῆς
  choice: perseverança
  rationale: Expressa a constância resistente diante do sofrimento e é natural no português contemporâneo.
- source_word: τὰ τῆς ἀρετῆς ἆθλα
  choice: os prêmios da virtude
  rationale: Mantém a linguagem de competição de ἆθλα e traduz ἀρετή pelo termo ético abrangente «virtude».
- source_word: οἴσομεν
  choice: conquistaremos
  rationale: Com ἆθλα, o futuro de φέρω tem o sentido idiomático de levar ou ganhar um prêmio; «conquistaremos» conserva a ideia de vitória com maior naturalidade em português.
theological_decisions:
- issue: Sentido de ἀρετή no contexto helenístico judaico do martírio
  choice: virtude
  alternative: excelência moral
  rationale: «Virtude» preserva o vocabulário ético central da obra sem introduzir categorias doutrinárias posteriores; «excelência moral» explicita legitimamente o sentido, mas é menos conciso.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A estrutura explicativa e a metáfora agonística do grego foram preservadas sem rigidez excessiva.
