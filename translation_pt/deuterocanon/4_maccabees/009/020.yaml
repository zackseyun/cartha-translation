  text: And the wheel was defiled all around with blood[a], and the heap of coals was being quenched by the drops of bodily fluids[c][b], and the flesh was flowing around the axles of the machine.
translation:
  language: pt
  text: E a roda ficava contaminada de sangue por todos os lados[a]; o monte de brasas se apagava com as gotas dos fluidos das feridas[b], e a carne escorria ao redor dos eixos do instrumento de tortura[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficava manchada de sangue por todos os lados”. O verbo grego também pode indicar mancha, mas pode ter o sentido mais forte de contaminação.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “com as gotas dos ícores”. O termo grego designa aqui o fluido que escorre de feridas.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “do aparato”. O termo grego designa um implemento, neste contexto usado para tortura.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμολύνετο
  choice: ficava contaminada
  rationale: Preserva a ideia de contaminação expressa pelo verbo, sem limitar o sentido à mera coloração; a construção também comunica o aspecto durativo do imperfeito.
- source_word: πάντοθεν αἵματι
  choice: de sangue por todos os lados
  rationale: Expressa com naturalidade tanto o dativo de meio quanto a abrangência espacial do advérbio.
- source_word: ὁ τροχός
  choice: a roda
  rationale: Correspondência direta e suficiente no contexto do instrumento de tortura.
- source_word: ὁ σωρὸς τῆς ἀνθρακιᾶς
  choice: o braseiro
  rationale: ἀνθρακιά designa brasas ou fogo de carvão, e σωρός enfatiza seu acúmulo; 'braseiro' oferece uma representação clara e idiomática do conjunto em português.
- source_word: τοῖς τῶν ἰχώρων ... σταλαγμοῖς
  choice: com as gotas dos fluidos das feridas
  rationale: ἰχώρ refere-se aqui ao fluido que escorre de feridas. A formulação evita o termo técnico e potencialmente mitológico 'icor', sem acrescentar um possessivo ausente do grego.
- source_word: ἐσβέννυτο
  choice: se apagava
  rationale: Mantém o caráter processual do imperfeito e soa natural para brasas em português.
- source_word: περὶ τοὺς ἄξονας
  choice: ao redor dos eixos
  rationale: Reproduz concretamente a relação espacial.
- source_word: τοῦ ὀργάνου
  choice: do instrumento de tortura
  rationale: ὄργανον significa instrumento ou aparato; o complemento contextual torna inequívoca sua função sem impor que se tratasse de uma máquina no sentido moderno.
- source_word: περιέρεον
  choice: escorria ao redor
  rationale: Comunica o movimento contínuo indicado pelo imperfeito e é idiomático para matéria corporal.
- source_word: αἱ σάρκες
  choice: a carne
  rationale: O singular coletivo é a forma natural em português para tecidos corporais, embora o grego empregue o plural.
