  text: For since our fathers had deep peace because of their law-abidingness[a], and prospered, so that even Seleucus Nicanor, the king of Asia, set apart money for them for the sacred service and approved their polity[b],
translation:
  language: pt
  text: Pois nossos antepassados desfrutavam de profunda paz por causa de sua boa ordem sob a lei[a] e prosperavam, de tal modo que até Seleuco Nicátor, rei da Ásia, lhes destinou recursos para o serviço sagrado e aprovou sua organização política[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por causa da boa ordem” ou “por causa da observância da lei”. O termo grego indica uma vida ordeira sob a lei e pode incluir implicitamente a fidelidade à lei judaica.
    reason: lexical_alternative
  - marker: b
    text: Ou “sua constituição” ou “sua ordem cívica”.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαθεῖαν εἰρήνην
  choice: profunda paz
  rationale: Preserva a metáfora de profundidade do grego e mantém o peso retórico da expressão.
- source_word: διὰ τὴν εὐνομίαν
  choice: graças à sua vida ordeira sob a lei
  rationale: Expressa a ideia de boa ordem regida pela lei sem limitar explicitamente o termo à observância da Lei mosaica; a nota registra alternativas mais concisas.
- source_word: ἔπραττον καλῶς
  choice: prosperavam
  rationale: O idiomatismo indica que lhes ia bem; “prosperavam” comunica naturalmente esse florescimento no contexto.
- source_word: ἀφορίσαι
  choice: destinou-lhes
  rationale: Transmite a separação ou alocação de recursos para uma finalidade específica em português natural.
- source_word: χρήματα εἰς τὴν ἱερουργίαν
  choice: recursos para o serviço sagrado
  rationale: Mantém a referência ampla ao serviço cultual ou sagrado sem restringi-la indevidamente a uma função sacerdotal específica.
- source_word: τὴν πολιτίαν αὐτῶν
  choice: sua organização política
  rationale: Representa o sentido cívico e institucional de πολιτεία em linguagem moderna e compreensível.
- source_word: ἀποδέχεσθαι
  choice: aprovou
  rationale: Comunica a aceitação favorável e oficial por parte do rei.
- source_word: βασιλέα Σέλευκον τὸν Νικάνορα
  choice: Seleuco Nicátor, rei da Ásia
  rationale: Usa as formas portuguesas tradicionais do nome e do epíteto e preserva a aposição do texto grego.
theological_decisions:
- issue: Relação de εὐνομία com a identidade e a Lei judaicas
  choice: vida ordeira sob a lei
  alternative: boa ordem; observância da lei
  rationale: O contexto provavelmente inclui fidelidade à lei judaica, mas εὐνομία é mais amplo e também denota ordem social sob a lei. A tradução preserva essa amplitude.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sintaxe foi levemente reorganizada para evitar uma construção excessivamente longa, mantendo a relação causal e o destaque dado ao apoio do rei.
