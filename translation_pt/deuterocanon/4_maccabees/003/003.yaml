  text: No one can cut anger out of your soul[a], but it is possible to help with anger.
translation:
  language: pt
  text: Ninguém pode arrancar a ira da alma de vocês, mas é possível ajudar a ira.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais interpretativo, “é possível fazer uso da ira” ou “direcionar a ira para bons fins”. O grego diz literalmente “ajudar a ira”.
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμόν / τῷ θυμῷ
  choice: ira / a ira
  rationale: “Ira” expressa de modo claro o impulso colérico de θυμός neste contexto ético e preserva a repetição do termo grego nas duas orações.
- source_word: ἐκκόψαι
  choice: arrancar
  rationale: O verbo significa literalmente cortar ou extirpar. “Arrancar” conserva a imagem vívida de retirar a ira do interior da alma sem produzir uma expressão artificial em português.
- source_word: ὑμῶν τῆς ψυχῆς
  choice: da alma de vocês
  rationale: ψυχή designa aqui a alma ou o ser interior. “De vocês” torna explícito o possessivo plural ὑμῶν, enquanto o singular “alma” acompanha τῆς ψυχῆς.
- source_word: δυνατὸν βοηθῆσαι
  choice: é possível ajudar
  rationale: A formulação reproduz de perto a possibilidade expressa por δυνατόν e o sentido básico de βοηθέω, “ajudar” ou “prestar auxílio”, sem decidir por si só como essa ajuda atua.
theological_decisions:
- issue: Sentido da oração final τῷ θυμῷ δυνατὸν βοηθῆσαι
  choice: Preservar a formulação paradoxal “é possível ajudar a ira”.
  alternative: “É possível fazer uso da ira”, “direcionar a ira para bons fins” ou “controlar a ira”.
  rationale: O grego diz de maneira concisa e surpreendente que é possível “ajudar” a ira. Explicitar uso, direcionamento ou controle resolveria uma ambiguidade que o próprio versículo deixa aberta.
translation_notes:
  register: Português atual, digno e acessível, com “vocês” para refletir o possessivo plural. A expressão incomum “ajudar a ira” foi mantida deliberadamente para preservar a tensão do grego; a nota oferece leituras interpretativas sem incorporá-las ao texto.
