base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/002.yaml
  text: For example[a], reason cannot cut off any one of your desires, but reason can make it possible not to be enslaved to desire.
translation:
  language: pt
  text: Por exemplo, ninguém entre vocês consegue extirpar o desejo, mas a razão pode tornar possível não ser escravizado pelo desejo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais formalmente: “mas a razão pode proporcionar que não se seja escravizado pelo desejo”.'
    reason: A nota registra a construção infinitiva impessoal e a nuance mais formal de παρασχέσθαι, enquanto o texto principal emprega uma formulação portuguesa mais natural.
lexical_decisions:
- source_word: οἷον
  choice: Por exemplo
  rationale: Introduz uma ilustração do argumento anterior de modo natural e fiel ao valor exemplificativo do grego.
- source_word: ἐπιθυμίαν / τῇ ἐπιθυμίᾳ
  choice: o desejo / por ele
  rationale: O singular tem sentido genérico. A retomada pronominal evita repetição pesada, sem alterar o referente.
- source_word: τις ὑμῶν
  choice: vocês
  rationale: A expressão indica alguém dentre os destinatários em formulação generalizante. O plural direto é natural em português e evita a leitura indevidamente restrita de que apenas uma pessoa específica seria incapaz.
- source_word: ἐκκόψαι
  choice: extirpar
  rationale: Preserva melhor que 'eliminar' a força concreta e metafórica de cortar ou retirar por completo, em português corrente e digno.
- source_word: δουλωθῆναι
  choice: ser escravizados
  rationale: Mantém explicitamente a metáfora de escravidão presente no passivo grego, sem suavizá-la para 'ser dominados'.
- source_word: ὁ λογισμός
  choice: a razão
  rationale: É o termo central da obra para a faculdade racional ou o juízo racional; 'a razão' conserva o registro filosófico com clareza.
- source_word: παρασχέσθαι
  choice: pode fazer com que
  rationale: Expressa de modo idiomático a ideia de proporcionar ou tornar possível que alguém não seja escravizado pelo desejo.
theological_decisions:
- issue: Relação entre razão e desejo
  choice: A pessoa não consegue extirpar o desejo, mas a razão pode impedir sua escravização a ele.
  alternative: A razão não consegue extirpar o desejo, mas pode impedir que a pessoa seja escravizada por ele.
  rationale: No grego, o sujeito da primeira oração é τις ὑμῶν ('alguém dentre vocês'), ao passo que ὁ λογισμός ('a razão') aparece como sujeito na segunda. A tradução mantém essa distinção, em vez de tornar a razão sujeito das duas orações, e preserva a tensão entre a permanência do desejo e seu governo racional.
translation_notes:
  register: Português moderno, amplo e legível no Brasil, com tom digno e filosófico. A formulação segue prioritariamente o grego e corrige a mudança de sujeito presente na camada inglesa consultiva. O marcador [a] aparece no texto principal.
