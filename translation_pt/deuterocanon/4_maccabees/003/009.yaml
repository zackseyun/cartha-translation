- source_word: οἱ ... ἄλλοι πάντες
  choice: todos os demais
  rationale: Expressa de modo natural e abrangente o grupo restante, preservando a força inclusiva de πάντες.
- source_word: μὲν οὖν
  choice: sem equivalente explícito
  rationale: A combinação de partículas dá continuidade e marca uma transição no discurso; neste fragmento breve, a pontuação e o fluxo do contexto cumprem essa função em português sem exigir um conectivo potencialmente mais forte.
- source_word: ἐπὶ τὸ δεῖπνον
  choice: no jantar
  rationale: δεῖπνον designa a refeição principal, e a construção indica presença nessa refeição. “No jantar” é corrente e evita acrescentar a ideia de que estavam reunidos ou sentados à mesa.
- source_word: ἦσαν
  choice: estavam
  rationale: Reproduz diretamente o imperfeito de εἰμί, sem explicitar além do texto se haviam chegado, se reunido ou se encontravam à mesa.
