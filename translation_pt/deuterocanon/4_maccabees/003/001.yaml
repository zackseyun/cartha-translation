base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/001.yaml
  text: But this line of reasoning is utterly ridiculous[a], for reason evidently does not prevail over its own passions[b], but over bodily ones.
translation:
  language: pt
  text: Mas essa linha de raciocínio é totalmente absurda[a], pois a razão, ao que parece, não domina suas próprias paixões, e sim as corporais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “argumento”. O grego λογισμός pode designar o ato de raciocinar, a faculdade racional ou o argumento apresentado.
    reason: lexical_alternative
  - marker: b
    text: Isto é, as paixões ou os impulsos corporais; no grego, o adjetivo “corporais” é usado como substantivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: κομιδῇ γελοῖος
  choice: totalmente absurda
  rationale: O advérbio κομιδῇ intensifica γελοῖος. “Totalmente absurda” transmite a forte censura do grego em português atual e digno.
- source_word: λογισμός
  choice: linha de raciocínio / razão
  rationale: Na primeira ocorrência, o termo aponta para o raciocínio que está sendo criticado; na segunda, para a faculdade racional. A variação em português preserva essa mudança retórica plausível.
- source_word: τῶν ἑαυτοῦ παθῶν
  choice: suas próprias paixões
  rationale: Mantém o reflexivo ἑαυτοῦ e verte πάθη como impulsos ou afetos que exercem força sobre a pessoa, sem reduzi-los apenas a desejos.
- source_word: φαίνεται
  choice: ao que parece
  rationale: Preserva a nuance de aparência ou inferência do verbo, evitando transformar a afirmação em certeza explícita.
- source_word: ἐπικρατεῖν
  choice: domina
  rationale: Expressa de modo natural a ideia de prevalecer ou exercer domínio sobre algo.
- source_word: τῶν σωματικῶν
  choice: as corporais
  rationale: O adjetivo substantivado retoma “paixões” por elipse e estabelece o contraste conciso presente no grego.
theological_decisions:
- issue: Contraste filosófico entre a razão e as paixões
  choice: Distinguir “linha de raciocínio” na primeira ocorrência de λογισμός e “razão” na segunda.
  alternative: Traduzir uniformemente as duas ocorrências como “raciocínio” ou “razão”.
  rationale: O texto parece primeiro censurar uma tese ou linha argumentativa e depois falar da faculdade racional. A distinção torna inteligível a mudança sem eliminar a tensão de a razão ter “suas próprias paixões”.
- issue: Valor epistêmico de φαίνεται
  choice: “ao que parece”
  alternative: “evidentemente”
  rationale: A formulação escolhida conserva a ambiguidade entre aparência e conclusão manifesta, sem fortalecer indevidamente a asseveração.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom permanece filosófico e enfático, sem arcaísmos; a coordenação “e sim” explicita o contraste οὐ… ἀλλά sem acrescentar a ideia de exclusividade além do texto.
