  text: Then indeed some[a], having stirred up revolt against the common harmony[b], made use of calamities in many ways.
translation:
  language: pt
  text: Então, de fato, alguns, tendo se insurgido[a] contra a concórdia comum, fizeram uso de calamidades[b] de diversas maneiras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tendo promovido uma revolta”. O verbo grego pode ter um sentido político mais forte do que “ter se insurgido”.
    reason: lexical_alternative
  - marker: b
    text: Ou “exploraram calamidades de diversas maneiras”. Literalmente, diz “fizeram uso de calamidades”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε δὴ
  choice: Então, de fato
  rationale: Preserva tanto a transição temporal de τότε quanto a ênfase de δή, em português atual e digno.
- source_word: τινες
  choice: alguns
  rationale: Mantém a referência plural indefinida sem acrescentar uma identificação ausente no grego.
- source_word: νεωτερίσαντες
  choice: tendo se insurgido
  rationale: O verbo pode indicar inovação subversiva, agitação ou revolta, sobretudo em contexto político ou comunitário. “Insurgido” comunica essa força sem especificar uma revolução formal.
- source_word: πρὸς τὴν κοινὴν ὁμόνοιαν
  choice: contra a concórdia comum
  rationale: Com νεωτερίσαντες, πρός tem sentido adversativo. “Concórdia comum” conserva a ideia de harmonia compartilhada pela comunidade.
- source_word: πολυτρόπως
  choice: de diversas maneiras
  rationale: Expressa com naturalidade a multiplicidade de modos indicada pelo advérbio.
- source_word: ἐχρήσαντο συμφοραῖς
  choice: fizeram uso de calamidades
  rationale: Mantém de perto a construção χράομαι com dativo e não elimina a possível ideia de aproveitamento oportunista, embora a expressão grega também possa ser entendida como lidar com ou passar por calamidades.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente internacional, com boa legibilidade brasileira. O tom é formal sem ser arcaico. A construção participial foi preservada, e a ambiguidade incomum de ἐχρήσαντο συμφοραῖς foi mantida no texto e explicitada em nota.
