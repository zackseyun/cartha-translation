  text: Therefore, while the defenders were indignant at the king’s desire, two young soldiers, steadfast men, ashamed by the king’s desire, armed themselves with full armor, and, taking a water jar, went over the enemy stockades.
translation:
  language: pt
  text: Por isso, enquanto os defensores se indignavam com o desejo do rei, dois jovens, soldados resolutos,[a] tomados de constrangimento diante do desejo do rei,[b] equiparam-se com suas armaduras completas e, levando um cântaro,[c] transpuseram as paliçadas dos inimigos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dois jovens soldados, homens perseverantes”. O grego reúne de forma compacta “jovens” e “soldados resolutos”, permitindo mais de uma estruturação da frase.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “envergonhados por causa do desejo do rei”. O termo grego pode indicar que eles foram movidos por vergonha, pudor ou consideração diante do desejo do rei.'
    reason: alternative_reading
  - marker: c
    text: O termo grego designa um cântaro ou jarro, provavelmente destinado a levar água.
    reason: cultural_note
lexical_decisions:
- source_word: ὅθεν
  choice: Por isso
  rationale: Introduz uma consequência ou inferência ligada à narrativa anterior, de modo natural em português.
- source_word: ὑπερασπιστῶν
  choice: defensores
  rationale: Preserva o sentido amplo de pessoas que defendem, sem especificar indevidamente que fossem guarda-costas.
- source_word: ἐπὶ τῇ τοῦ βασιλέως ἐπιθυμίᾳ
  choice: com o desejo do rei
  rationale: Mantém ἐπιθυμία em seu sentido neutro de desejo, deixando o contexto definir sua natureza.
- source_word: σχετλιάζόντων
  choice: se indignavam
  rationale: Expressa forte desagrado e indignação, conservando o valor circunstancial do particípio.
- source_word: δύο νεανίσκοι στρατιῶται καρτεροί
  choice: dois jovens, soldados resolutos
  rationale: Conserva a aposição compacta do grego e traduz καρτεροί como firmeza, resistência e coragem.
- source_word: καταιδεσθέντες
  choice: constrangidos
  rationale: O verbo pode indicar vergonha, respeito ou constrangimento moral; esta escolha preserva a reação sem afirmar de maneira rígida que eles consideravam vergonhoso o desejo em si.
- source_word: τὰς πανοπλίας καθωπλίσαντο
  choice: vestiram toda a sua armadura
  rationale: Reproduz naturalmente tanto a ideia de equipamento completo quanto a ação reflexiva de se equiparem.
- source_word: κάλπιν
  choice: um cântaro
  rationale: Designa um jarro ou recipiente, provavelmente usado para buscar água; 'cântaro' é concreto e compreensível.
- source_word: ὑπερέβησαν
  choice: transpuseram
  rationale: Expressa atravessar ou passar além de um obstáculo físico.
- source_word: χάρακας
  choice: paliçadas
  rationale: No contexto militar, refere-se a barreiras ou fortificações feitas com estacas.
