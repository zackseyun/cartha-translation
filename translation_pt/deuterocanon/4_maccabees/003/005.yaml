lexical_decisions:
- source_word: λογισμός
  choice: a razão
  rationale: No contexto filosófico de 4 Macabeus, designa a faculdade de deliberar e julgar racionalmente; “a razão” é natural e preserva o peso conceitual do termo.
- source_word: ἐκριζωτής
  choice: arranca ... pela raiz
  rationale: A formulação verbal comunica em português corrente a imagem concreta de extirpar pela raiz, sem recorrer ao substantivo pouco natural “desenraizador”.
- source_word: τῶν παθῶν
  choice: as paixões
  rationale: Neste contexto ético, πάθη são paixões ou impulsos afetivos que desafiam o juízo racional; “paixões” mantém o sentido filosófico tradicional sem reduzi-lo a meros sentimentos.
- source_word: ἀνταγωνιστής
  choice: luta contra elas
  rationale: Expressa aquele que combate ou contende contra algo e mantém o contraste com a erradicação completa, em linguagem clara e digna.
theological_decisions:
- issue: Relação entre a razão e as paixões
  choice: A razão não elimina completamente as paixões, mas luta contra elas.
  alternative: A razão não é a destruidora das paixões, mas sua adversária.
  rationale: 'A tradução preserva a tensão filosófica do grego: a razão resiste às paixões sem necessariamente suprimi-las ou erradicá-las.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A construção “arranca ... pela raiz” preserva a metáfora grega de maneira mais natural que um substantivo literal; “luta contra elas” torna explícito o objeto já indicado no contexto.
