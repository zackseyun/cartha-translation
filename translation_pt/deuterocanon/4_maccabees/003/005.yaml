  text: For reason is not the uprooter of the passions[b][a], but their adversary.
translation:
  language: pt
  text: Pois a razão não é quem arranca as paixões pela raiz[a], mas adversária delas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não elimina as paixões” ou “não é a erradicadora das paixões”. O grego conserva a imagem de arrancar algo pela raiz.'
