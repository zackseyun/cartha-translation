  text: And after escaping the notice of the gate guards[a], they kept going through, having made their way through the whole camp of the enemy.
translation:
  language: pt
  text: E, sem serem notados pelos guardas dos portões, continuaram atravessando todo o acampamento inimigo, depois de encontrarem um caminho através dele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego é condensado: literalmente, «tendo encontrado [algo] através de todo o acampamento inimigo». O objeto de «tendo encontrado» não é expresso; «um caminho» é inferido do contexto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαθόντες
  choice: sem serem notados
  rationale: O particípio aoristo de λανθάνω com objeto acusativo indica que eles escaparam à percepção dos guardas; a formulação é natural e preserva a ideia de movimento não detectado.
- source_word: τοὺς τῶν πυλῶν ἀκροφύλακας
  choice: pelos guardas dos portões
  rationale: Traduz de modo direto os vigias ou sentinelas encarregados dos portões, sem acrescentar uma especificação ausente no grego.
- source_word: διεξῄεσαν
  choice: continuaram avançando
  rationale: O imperfeito expressa movimento em curso, e o verbo composto indica avanço através de um espaço; a expressão conserva esse aspecto sem tornar a frase artificial.
- source_word: εὑράμενοι
  choice: depois de encontrarem passagem
  rationale: O particípio significa literalmente 'tendo encontrado'; 'passagem' explicita com cautela o complemento sugerido pelo contexto e pela construção comprimida.
- source_word: κατὰ πᾶν τὸ τῶν πολεμίων στρατόπεδον
  choice: por todo o acampamento inimigo
  rationale: κατά com o acusativo tem aqui valor espacial ou distributivo, abrangendo toda a extensão do acampamento; 'inimigo' funciona naturalmente como adjetivo em português.
