lexical_decisions:
- source_word: ἀνευράμενοι
  choice: depois de encontrarem
  rationale: O particípio aoristo indica uma ação anterior à do verbo principal; a construção explicita essa sequência com naturalidade em português.
- source_word: θαρραλέως
  choice: corajosamente
  rationale: Preserva a ideia de coragem ou ousadia expressa pelo advérbio no contexto.
- source_word: τὴν πηγὴν
  choice: a fonte
  rationale: πηγή designa aqui uma nascente ou fonte de água; «fonte» é corrente e natural em português.
- source_word: ἐξ αὐτῆς
  choice: nela
  rationale: Retoma diretamente a fonte e, com «encher», expressa de modo idiomático o lugar de onde a água foi tirada.
- source_word: ἐγέμισαν
  choice: encheram
  rationale: Traduz diretamente o aoristo de γεμίζω, preservando a ação concreta do texto grego.
- source_word: τῷ βασιλεῖ
  choice: para o rei
  rationale: Mantém o valor benefactivo mais direto do dativo grego, sem convertê-lo desnecessariamente em possessivo.
- source_word: τὸ ποτόν
  choice: o recipiente de bebida
  rationale: A expressão grega, literalmente «a bebida», ocorre como objeto de «encher» e parece empregar por metonímia o conteúdo pelo recipiente; a tradução torna compreensível a ação sem especificar que tipo de recipiente era.
