  text: and to wrestle down the pains of the body[a], though they are extreme, and by the nobility and goodness of reason to spurn all the dominion of the passions.
translation:
  language: pt
  text: e vencer na luta as dores do corpo, por mais intensas que sejam, e, pela nobreza e bondade da razão, desprezar[a] todo o domínio das paixões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “cuspir para longe”; o verbo grego descreve aqui uma rejeição com desprezo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλγηδόνας
  choice: dores
  rationale: O substantivo designa dores ou sofrimentos físicos; “dores” é claro e adequado à referência explícita ao corpo.
- source_word: καθʼ ὑπερβολὴν οὔσας
  choice: por mais intensas que sejam
  rationale: A formulação concessiva comunica com naturalidade que as dores atingem grau extraordinário.
- source_word: καταπαλαῖσαι
  choice: vencer na luta
  rationale: Preserva a imagem atlética de lutar corpo a corpo e subjugar, sem recorrer a uma expressão obscura em português.
- source_word: καλοκἀγαθίας
  choice: nobre excelência
  rationale: Expressa de modo compacto o ideal de nobreza e excelência moral contido no termo grego, evitando reduzir seu sentido simplesmente a “bondade”.
- source_word: λογισμοῦ
  choice: razão
  rationale: É o termo temático do livro para a faculdade racional ou o juízo refletido que governa as paixões.
- source_word: ἀποπτύσαι
  choice: desprezar
  rationale: Transmite a rejeição desdenhosa expressa pelo verbo; a imagem literal, pouco natural no corpo do texto em português, é preservada em nota.
- source_word: πάσας τὰς τῶν παθῶν ἐπικρατείας
  choice: todo o domínio das paixões
  rationale: Mantém a ideia do poder controlador exercido pelas paixões; o singular coletivo é mais natural em português.
theological_decisions:
- issue: Sentido filosoficamente carregado de λογισμός
  choice: razão
  alternative: juízo racional
  rationale: “Razão” conserva o termo central da argumentação de 4 Macabeus sem acrescentar tecnicismo nem restringir a faculdade descrita.
- issue: Relação entre razão e paixões
  choice: domínio das paixões
  alternative: poder controlador das paixões
  rationale: A tradução mantém a afirmação de que as paixões exercem domínio, sem definir além do grego a natureza moral ou psicológica desse poder.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção começa com “e” porque o versículo continua a frase do contexto anterior. O marcador foi colocado junto a “desprezar”, palavra à qual a nota lexical efetivamente se refere.
