  text: For when David, attacking the foreigners throughout the whole day, killed many of them along with the soldiers of the nation,
translation:
  language: pt
  text: Pois, enquanto Davi atacava os estrangeiros[a] durante todo o dia, matou muitos deles juntamente com os soldados da nação[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os filisteus”. O grego diz literalmente “os estrangeiros” (ἀλλόφυλοι), termo muitas vezes usado no grego bíblico para os filisteus, embora não seja aqui o nome étnico próprio.
