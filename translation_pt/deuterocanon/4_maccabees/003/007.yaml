lexical_decisions:
- source_word: ἐπεὶ γὰρ
  choice: Pois, ao
  rationale: “Pois” conserva a função explicativa de γάρ, enquanto a construção com “ao” integra naturalmente o valor circunstancial de ἐπεί e do particípio seguinte em português.
- source_word: διʼ ὅλης ἡμέρας
  choice: durante todo o dia
  rationale: Expressa com clareza a duração abrangente indicada pela preposição διά com o genitivo e por ὅλης.
- source_word: προσβάλλων
  choice: atacar
  rationale: O particípio descreve uma ação hostil em contexto militar. A construção “ao atacar” mantém sua relação circunstancial com o verbo principal sem tornar a frase pesada.
- source_word: τοῖς ἀλλοφύλοις
  choice: os estrangeiros
  rationale: ἀλλόφυλοι designa literalmente pessoas de outro povo. Na linguagem bíblica grega pode referir-se aos filisteus, mas o texto não emprega aqui o nome étnico próprio; por isso, a tradução preserva a formulação mais ampla.
- source_word: ὁ Δαυεὶδ
  choice: Davi
  rationale: Forma tradicional e amplamente reconhecida do nome em português.
- source_word: πολλοὺς αὐτῶν ἀπέκτεινεν
  choice: Davi matou muitos deles
  rationale: ἀποκτείνω significa diretamente “matar”; a repetição explícita do sujeito produz uma frase clara e natural em português.
- source_word: μετὰ τῶν τοῦ ἔθνους στρατιωτῶν
  choice: juntamente com os soldados da nação
  rationale: μετά com o genitivo indica companhia ou participação conjunta. “Da nação” mantém a expressão literal τοῦ ἔθνους sem acrescentar o possessivo “sua”, ausente do grego.
