  text: But the king[a], though very thirsty, even though he had abundant springs, was not able through them to relieve his thirst.
translation:
  language: pt
  text: Mas o rei, apesar da sede intensa e embora tivesse fontes em abundância, não conseguia, por meio delas, curar sua sede.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, saciar ou aliviar sua sede. O verbo grego traduzido como “curar” costuma significar “curar” ou “sarar”, preservando aqui uma metáfora médica.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ βασιλεὺς
  choice: Mas o rei
  rationale: δέ marca aqui uma transição com leve contraste; “Mas” mantém essa relação de modo natural em português.
- source_word: ὡς μάλιστα διψῶν
  choice: apesar da sede intensa
  rationale: A expressão intensifica fortemente a sede do rei. “Sede intensa” comunica o valor de ὡς μάλιστα sem recorrer a uma formulação artificial.
- source_word: καίπερ ἀφθόνους ἔχων πηγάς
  choice: embora tivesse fontes em abundância
  rationale: καίπερ introduz concessão, ἀφθόνους indica grande disponibilidade, e πηγάς conserva a imagem concreta de fontes de água.
- source_word: οὐκ ἠδύνατο διʼ αὐτῶν
  choice: não conseguia, por meio delas
  rationale: A formulação preserva tanto a incapacidade expressa por οὐκ ἠδύνατο quanto o sentido instrumental de διά com o pronome que retoma as fontes.
- source_word: ἰάσασθαι τὴν δίψαν
  choice: curar sua sede
  rationale: ἰάομαι significa normalmente “curar” ou “sarar”. A tradução mantém a metáfora médica deliberada, enquanto a nota esclarece a expressão idiomática esperada.
