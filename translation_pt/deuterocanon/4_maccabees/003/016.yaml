  text: Therefore[a], setting reason against desire, he poured out the drink as a libation to God.
translation:
  language: pt
  text: Por isso, opondo a razão ao desejo, derramou a bebida em libação a Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, «derramou a bebida a Deus». O verbo grego indica o ato de derramar uma libação, isto é, uma oferta líquida.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Por isso
  rationale: Introduz uma conclusão decorrente do argumento anterior e mantém a ligação lógica em português natural.
- source_word: ἀντιθεὶς
  choice: opondo
  rationale: Expressa a ação deliberada de colocar uma força contra outra, preservando de modo conciso o contraste do grego.
- source_word: τῇ ἐπιθυμίᾳ
  choice: ao desejo
  rationale: ἐπιθυμία designa aqui o desejo ou impulso apetitivo; «desejo» conserva a amplitude do termo sem restringi-lo ao apetite físico.
- source_word: τὸν λογισμόν
  choice: a razão
  rationale: Em 4 Macabeus, λογισμός é um termo central para a faculdade racional ou o juízo racional que governa os impulsos; «razão» preserva esse contraste filosófico.
- source_word: ἔσπεισεν
  choice: derramou ... como libação
  rationale: σπένδω indica especificamente derramar uma bebida em ato ritual; a formulação explicita essa nuance cultual sem transformar τὸ πόμα em termo técnico.
- source_word: τὸ πόμα
  choice: a bebida
  rationale: É o sentido direto do substantivo; a ideia de oferta ritual provém do verbo e é comunicada por «como libação».
- source_word: τῷ θεῷ
  choice: a Deus
  rationale: Representa de forma direta o dativo que indica o destinatário do ato cultual.
theological_decisions:
- issue: Nuance cultual de σπένδω em relação a τὸ πόμα
  choice: A oração é apresentada como um ato de libação dirigido a Deus.
  alternative: 'Traduzir de modo mais estritamente literal: «derramou a bebida a Deus».'
  rationale: O próprio verbo grego contém a noção de derramar uma oferta líquida. Torná-la explícita permite que leitores modernos reconheçam o caráter religioso do gesto sem acrescentar conteúdo teológico alheio ao texto.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão internacional. «Libação» conserva a precisão cultual e é esclarecido em nota; «razão» e «desejo» mantêm o contraste filosófico central do livro.
