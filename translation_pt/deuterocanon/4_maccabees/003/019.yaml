  terminology: «Autocontrole racional» comunica de modo claro σώφρων λογισμός no contexto argumentativo de 4 Macabeus, sem introduzir uma doutrina interpretativa. «História» é mantida, em conformidade com a trilha de auditoria inglesa e com ἱστορία.
