  source_fidelity: O rascunho preserva a chamada retórica e a noção de λογισμός sensato, mas «demonstração histórica» funde ἀπόδειξις e ἱστορία numa expressão adjetival e deixa de representar claramente a «história/relato» que o grego põe em genitivo. A revisão conserva a ambiguidade da construção e o sentido do registro inglês («history of rational self-control»).
