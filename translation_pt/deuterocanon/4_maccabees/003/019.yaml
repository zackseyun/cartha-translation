  text: E agora também chegou o momento de passarmos à demonstração da história do autocontrole racional.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤδη δὲ καὶ ὁ καιρός
  choice: E agora o próprio momento
  rationale: Expressa a transição enfática do grego de modo natural; «o próprio» comunica a força contextual de καί sem o artificial «também o momento».
- source_word: ἡμᾶς καλεῖ ἐπὶ
  choice: nos chama à
  rationale: Preserva diretamente a imagem verbal de convocação e a orientação para o assunto seguinte.
- source_word: ἀπόδειξιν τῆς ἱστορίας
  choice: demonstração histórica
  rationale: Mantém os dois elementos gregos, mas evita a sequência pouco natural «demonstração da história»; no contexto, a narrativa histórica fornece a demonstração.
- source_word: τοῦ σώφρονος λογισμοῦ
  choice: da razão sensata
  rationale: λογισμός designa aqui a faculdade racional ou o raciocínio, enquanto σώφρων indica sensatez, moderação e autocontrole. «Razão sensata» conserva a expressão compacta sem antecipar toda a tese do domínio das paixões.
theological_decisions:
- issue: O papel da razão na tese do livro
  choice: razão sensata
  alternative: autocontrole racional
  rationale: A opção escolhida não transforma a qualidade da razão em um resultado já estabelecido. Assim, preserva-se a progressão argumentativa na qual a narrativa demonstrará o poder dessa razão.
translation_notes:
  register: Português moderno, digno e conciso. A formulação conserva o tom de transição retórica para a seção narrativa e evita terminologia filosófica excessivamente técnica.
