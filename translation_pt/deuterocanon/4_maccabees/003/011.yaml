translation:
  language: pt
  text: Mas um desejo irracional pela água entre os inimigos[a], apertando-o, ressecava-o e, enquanto o debilitava[b], queimava-o intensamente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pela água no acampamento dos inimigos”. A expressão grega diz literalmente que a água estava “entre” ou “com os inimigos”.'
    reason: lexical_alternative
  - marker: b
    text: 'A imagem é condensada: o desejo é personificado como algo que o aperta, resseca, solta ou desfaz suas forças e o queima, descrevendo os efeitos físicos aparentemente contraditórios da sede intensa.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca de modo natural o contraste com o contexto anterior.
- source_word: τις ἀλόγιστος ἐπιθυμία
  choice: um desejo irracional
  rationale: O artigo indefinido comunica a indefinição de τις sem artificialidade; “irracional” preserva o contraste central da obra entre razão e paixão.
- source_word: τοῦ παρὰ τοῖς πολεμίοις ὕδατος
  choice: pela água que estava entre os inimigos
  rationale: Expressa a dependência de “desejo” e conserva o sentido locativo amplo de παρά com dativo, sem definir indevidamente se a água pertencia aos inimigos ou estava em seu acampamento.
- source_word: ἐπιτείνουσα
  choice: apertando-o
  rationale: Mantém a personificação e a imagem de tensão ou pressão exercida pelo desejo, em português claro.
- source_word: συνέφρυγε
  choice: ressecava-o
  rationale: Traduz a ideia de fazer secar ou definhar, particularmente adequada aos efeitos corporais da sede.
- source_word: λύουσα
  choice: enquanto o debilitava
  rationale: Comunica no contexto corporal o sentido metafórico de soltar, desfazer ou tirar as forças, evitando a formulação pouco inteligível “afrouxando-o”.
- source_word: κατέφλεγεν
  choice: consumia-o em chamas
  rationale: Preserva a força intensiva e a metáfora de ardor consumidor.
theological_decisions:
- issue: Terminologia da oposição entre razão e paixão em 4 Macabeus
  choice: “irracional” para ἀλόγιστος
  alternative: “insensato” ou “desprovido de razão”
  rationale: “Irracional” mantém de modo reconhecível a estrutura filosófica do livro, na qual a razão deve governar as paixões.
- issue: Imagem paradoxal dos efeitos do desejo
  choice: Conservar a sequência de apertar, ressecar, debilitar e consumir em chamas
  alternative: Simplificar como “atormentava-o e o consumia de sede”
  rationale: A redação grega sobrepõe imagens corporais tensas e aparentemente contraditórias; a tradução não deve harmonizá-las nem reduzir sua intensidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva a personificação e a sucessão vívida dos particípios gregos, mas evita construções excessivamente literais e obscuras.
