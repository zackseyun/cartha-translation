  yaml_path: translation/deuterocanon/4_maccabees/003/015.yaml
  text: And even while burning with thirst[b][a], he reasoned that it would be an utterly dreadful danger to the soul if the drink were regarded as equivalent to blood.
translation:
  language: pt
  text: Mesmo ardendo de sede, ele raciocinou que a bebida, se fosse considerada equivalente a sangue[b], representaria um perigo absolutamente terrível[a] para a alma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego traduzido por “absolutamente terrível” intensifica fortemente a ideia de perigo.
    reason: lexical_alternative
  - marker: b
    text: Isto é, ele julgou que tomar aquela bebida equivaleria a tratá-la como sangue.
    reason: cultural_note
lexical_decisions:
- source_word: διαπυρούμενος
  choice: ardendo
  rationale: Preserva a metáfora intensa de estar abrasado ou inflamado, que em português se combina naturalmente com “de sede”.
- source_word: δίψαν
  choice: sede
  rationale: É o equivalente direto e corrente do substantivo grego.
- source_word: ἐλογίσατο
  choice: raciocinou
  rationale: Mantém o destaque temático dado à deliberação racional em 4 Macabeus, em vez de reduzi-la a uma impressão ou sentimento.
- source_word: πάνδεινον
  choice: absolutamente terrível
  rationale: Reproduz de modo natural a forte intensificação expressa pelo composto grego, sem recorrer a uma formação artificial em português.
- source_word: κίνδυνον
  choice: perigo
  rationale: Equivalente direto, claro e adequado ao registro do texto.
- source_word: τῇ ψυχῇ
  choice: para a alma
  rationale: Preserva a dimensão moral do contexto e a amplitude de ψυχή, sem restringi-la à mera sobrevivência física.
- source_word: λογισθὲν
  choice: se fosse considerada
  rationale: Expressa o particípio passivo e deixa clara a avaliação hipotética aplicada à bebida, preservando a sintaxe condensada do grego.
- source_word: ἰσοδύναμον
  choice: equivalente
  rationale: Comunica com precisão igualdade de valor, peso ou efeito.
- source_word: τὸ ποτόν
  choice: a bebida
  rationale: Tradução direta e natural da expressão articular, referindo-se à bebida em questão.
- source_word: αἵματι
  choice: sangue
  rationale: Mantém literalmente o termo e a comparação ética central da frase.
theological_decisions:
- issue: Sentido de ψυχή no contexto de exortação moral
  choice: alma
  alternative: vida
  rationale: Embora ψυχή também possa significar “vida”, o contexto trata do dano moral resultante de uma decisão; “alma” conserva esse alcance sem lhe impor uma definição doutrinária posterior.
- issue: Relação entre a bebida e o sangue na oração final
  choice: a bebida, se fosse considerada equivalente a sangue
  alternative: a bebida, considerada equivalente a sangue
  rationale: O grego é sintaticamente condensado. A formulação condicional torna inteligível em português que o perigo decorre dessa avaliação da bebida, sem explicar além do texto por que ela seria equiparada a sangue.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da oração foi levemente ajustada para soar natural, mantendo a metáfora da sede ardente, a ênfase na deliberação racional e a comparação explícita entre a bebida e o sangue.
