base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/017.yaml
  text: For the self-controlled mind is able to conquer the compulsions of the passions[b][a], and to extinguish the burnings of desires.
translation:
  language: pt
  text: Pois a mente autocontrolada[a] é capaz de vencer as compulsões das paixões e apagar os ardores dos impulsos intensos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “razão autocontrolada”; o grego νοῦς pode designar a mente, o entendimento ou a faculdade racional.
    reason: lexical_alternative
  - marker: b
    text: O termo grego pode indicar impulsos frenéticos, aguilhoantes ou desejos intensos; não se limita necessariamente ao desejo sexual.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατὸς
  choice: é capaz
  rationale: O adjetivo predicativo expressa capacidade; esta formulação é natural e evita transformar a ideia em poder abstrato.
- source_word: σώφρων
  choice: disciplinada
  rationale: No contexto, descreve uma mente caracterizada por sensatez, moderação e autodomínio. “Disciplinada” comunica o governo de si em português atual.
- source_word: νοῦς
  choice: mente
  rationale: O termo pode designar a mente, o entendimento ou a faculdade racional. “Mente” é acessível e mantém a amplitude lexical, enquanto o contexto evidencia sua função governante.
- source_word: νικῆσαι
  choice: vencer
  rationale: Preserva a forte imagem de vitória e domínio sobre forças adversárias.
- source_word: ἀνάγκας
  choice: compulsões
  rationale: Aqui indica a pressão coercitiva exercida pelas paixões; “compulsões” expressa bem essa força interior.
- source_word: παθῶν
  choice: paixões
  rationale: No discurso ético helenístico, o termo se refere às paixões ou afecções que pressionam a razão; “paixões” conserva a terminologia e sua amplitude.
- source_word: σβέσαι
  choice: apagar
  rationale: Mantém de maneira clara e idiomática a metáfora de extinguir fogo.
- source_word: οἴστρων
  choice: impulsos desenfreados
  rationale: O substantivo pode indicar aguilhoamento, frenesi ou impulso intenso. A expressão escolhida comunica sua força sem restringi-lo indevidamente ao desejo sexual.
- source_word: φλεγμονάς
  choice: ardores
  rationale: Reproduz a imagem de calor ou inflamação em português natural e combina com o verbo “apagar”.
theological_decisions:
- issue: Sentido antropológico de νοῦς em 4 Macabeus
  choice: mente
  alternative: razão; entendimento
  rationale: O texto afirma a capacidade da faculdade racional e disciplinada de dominar as paixões. “Mente” preserva a amplitude do termo sem introduzir uma teoria antropológica mais específica.
- issue: Amplitude moral de οἴστρων
  choice: impulsos desenfreados
  alternative: desejos; frenesis; cobiças
  rationale: O grego abrange impulsos aguilhoantes ou frenéticos e não exige uma referência exclusivamente sexual. A tradução mantém essa amplitude.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe direta. “Mente disciplinada” e “impulsos desenfreados” tornam inteligível o contraste ético sem eliminar a ambiguidade dos termos gregos, registrada nas notas.
