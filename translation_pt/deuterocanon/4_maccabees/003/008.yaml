base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/008.yaml
  text: Then[a], when evening had come, sweating and very exhausted, he came to the royal tent[b], around which the whole army of his forefathers had encamped.
translation:
  language: pt
  text: Então, ao cair da tarde, suando e muito exausto, ele chegou à tenda real[a], ao redor da qual todo o exército de seus antepassados[b] estava acampado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à tenda do rei”. O adjetivo grego significa “real” e pode designar especificamente a tenda do governante no acampamento.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “todo o exército dos antepassados”. O pronome “seus” está implícito no contexto e foi acrescentado para dar clareza em português.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε δὴ
  choice: Então
  rationale: Introduz enfaticamente a sequência narrativa; em português, “Então” comunica o avanço do relato sem acrescentar uma conclusão ausente do grego.
- source_word: γενομένης ἑσπέρας
  choice: ao cair da tarde
  rationale: O genitivo absoluto expressa a circunstância temporal. A formulação é natural em português e indica a chegada do período da tarde/noite sem rigidez excessiva.
- source_word: ἱδρῶν
  choice: suando
  rationale: O particípio presente descreve vividamente o estado físico dele ao chegar.
- source_word: σφόδρα κεκμηκώς
  choice: muito exausto
  rationale: σφόδρα intensifica o particípio perfeito κεκμηκώς, que descreve um estado de cansaço resultante.
- source_word: ἐπὶ τὴν βασίλειον σκηνήν
  choice: à tenda real
  rationale: βασίλειος significa “real”, e σκηνή, “tenda”. A expressão direta se ajusta ao contexto de acampamento militar.
- source_word: περὶ ἣν
  choice: ao redor da qual
  rationale: περί indica aqui a disposição espacial do exército em torno da tenda.
- source_word: ὁ πᾶς τῶν προγόνων στρατός
  choice: todo o exército de seus antepassados
  rationale: A expressão grega é condensada. “Seus” torna explícita em português a relação contextual, enquanto “antepassados” preserva o sentido genealógico de προγόνων.
- source_word: ἐστρατοπέδευκεν
  choice: estava acampado
  rationale: O perfeito apresenta o exército no estado resultante de ter acampado; “estava acampado” expressa naturalmente esse estado no momento da chegada.
theological_decisions:
- issue: Referente de τῶν προγόνων (“dos antepassados”)
  choice: Manter a referência genealógica sem identificar os antepassados.
  alternative: Especificar um povo, personagens históricos ou “os antepassados de Israel”.
  rationale: O grego não nomeia os antepassados. Acrescentar uma identificação histórica resolveria indevidamente uma referência deixada implícita no texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário corrente. A ordem da frase conserva a progressão narrativa e os detalhes físicos do grego, sem identificar além do texto o personagem ou seus antepassados.
