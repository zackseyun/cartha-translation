lexical_decisions:
- source_word: ἔστιν γοῦν
  choice: Portanto, é possível
  rationale: ἔστιν com o infinitivo forma uma construção impessoal de possibilidade, enquanto γοῦν introduz uma conclusão ou confirmação inferencial. A formulação é natural em português e mantém ambas as forças.
- source_word: τοῦτο
  choice: isso
  rationale: O demonstrativo retoma o ponto exposto anteriormente sem acrescentar uma especificação ausente no grego.
- source_word: διὰ τῆς ... δίψης
  choice: por meio da sede
  rationale: 'διά com o genitivo expressa aqui meio ou instrumento: o episódio da sede serve para tornar o argumento mais claro.'
- source_word: Δαυεὶδ τοῦ βασιλέως
  choice: do rei Davi
  rationale: A forma idiomática portuguesa preserva a identificação de Davi como rei, embora reorganize naturalmente a aposição grega literal, 'Davi, o rei'.
- source_word: δίψης
  choice: sede
  rationale: O substantivo significa simplesmente 'sede'; não há no texto grego um modificador que justifique intensificá-lo.
- source_word: σαφέστερον
  choice: com mais clareza
  rationale: Traduz o comparativo adverbial, indicando que o exemplo permite compreender o ponto de maneira mais clara.
- source_word: ἐπιλογίσασθαι
  choice: compreender
  rationale: No contexto, o infinitivo denota chegar à percepção de algo mediante reflexão. 'Compreender' comunica esse resultado em português corrente, enquanto a nota preserva sentidos mais estritamente deliberativos ou inferenciais.
