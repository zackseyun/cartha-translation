base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/004.yaml
  text: Reason cannot cut off any one of your evil tendencies[c][b][a], but it is able to join in helping you not to bend to that evil tendency.
translation:
  language: pt
  text: Nenhum de vocês é capaz de extirpar uma inclinação má[a], mas a razão pode vir em auxílio para que não se deixe dobrar por essa inclinação[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “má índole”, “maldade” ou “malícia”. O termo grego indica uma disposição moral ruim, e não somente um ato mau isolado.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “não ser dobrado por essa inclinação”, isto é, não ceder a ela.
    reason: lexical_alternative
lexical_decisions:
- source_word: κακοήθειάν / τῇ κακοηθείᾳ
  choice: uma inclinação má / essa inclinação
  rationale: O substantivo designa uma disposição moral ruim, mau caráter ou malícia, não apenas um ato isolado. “Inclinação má” mantém o aspecto interior e permite conservar naturalmente a imagem de não se deixar dobrar por ela.
- source_word: τις ὑμῶν οὐ δύναται
  choice: Nenhum de vocês é capaz
  rationale: τις é nominativo e funciona como sujeito de δύναται; com a negação, a expressão significa “nenhum de vocês”. Não modifica o acusativo κακοήθειαν. Assim, corrige-se o descompasso sintático da camada inglesa.
- source_word: ἐκκόψαι
  choice: extirpar
  rationale: O verbo significa literalmente cortar ou arrancar para fora. “Extirpar” preserva a força metafórica e soa natural em referência a uma disposição moral.
- source_word: τὸ μὴ καμφθῆναι
  choice: para que não se deixe dobrar
  rationale: A forma passiva significa literalmente “não ser dobrado”. A construção portuguesa conserva a metáfora e, ao mesmo tempo, comunica a ideia moral de não ceder.
- source_word: ὁ λογισμός
  choice: a razão
  rationale: Em 4 Macabeus, λογισμός é termo temático para a faculdade de julgamento racional e moral. “A razão” é claro e não exige personificação tipográfica.
- source_word: συμμαχῆσαι
  choice: vir em auxílio
  rationale: O verbo evoca a ação de um aliado, literalmente lutar ao lado de alguém. “Vir em auxílio” mantém essa ideia de assistência sem impor uma formulação militar excessiva.
theological_decisions:
- issue: Relação entre a razão e a disposição má
  choice: O ser humano não consegue extirpar a inclinação má, mas a razão pode auxiliá-lo a não ceder a ela.
  alternative: 'Tomar “a razão” como sujeito também da primeira oração: “A razão não pode extirpar nenhuma de suas inclinações más”.'
  rationale: A morfologia grega faz de τις ὑμῶν (“alguém de vocês”), sob negação, o sujeito da primeira oração; ὁ λογισμός aparece como sujeito na segunda. A tradução preserva a tensão do texto entre a incapacidade de eliminar a disposição má e a capacidade real da razão de ajudar na resistência, sem acrescentar conclusões doutrinárias posteriores.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural para leitores brasileiros. A imagem de ser dobrado foi preservada; “vir em auxílio” retém a nuance de assistência aliada. Os marcadores [a] e [b] aparecem no texto principal.
