translation:
  language: pt
  text: Pois a Lei também prevalece sobre o afeto para com os pais[a], não traindo a virtude por causa deles[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a boa vontade para com os pais” ou “a dedicação aos pais”.
    reason: lexical_alternative
  - marker: b
    text: Ou “em consideração a eles”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νόμος
  choice: a Lei
  rationale: O artigo definido corresponde ao grego e, no contexto de 4 Macabeus, indica a Lei judaica como autoridade moral.
- source_word: τῆς πρὸς γονεῖς εὐνοίας
  choice: o afeto pelos pais
  rationale: εὔνοια pode significar boa vontade, afeição ou dedicação; “afeto” preserva aqui o sentido familiar sem acrescentar a ideia específica de obediência.
- source_word: κρατεῖ
  choice: prevalece sobre
  rationale: κρατέω exprime domínio ou superioridade; a formulação indica que a Lei tem prioridade quando o afeto filial poderia levar ao abandono da virtude.
- source_word: μὴ καταπροδιδοὺς
  choice: não traindo
  rationale: O particípio comunica não entregar ou não trair completamente; “não traindo” mantém a força ética e a concisão do grego.
- source_word: τὴν ἀρετήν
  choice: a virtude
  rationale: ἀρετή é termo filosófico-ético central para excelência moral; “virtude” conserva esse registro.
- source_word: δι᾽ αὐτούς
  choice: por causa deles
  rationale: διά com acusativo exprime causa ou motivo; a tradução mantém como referente os pais sem eliminar a possível nuance de agir em consideração a eles.
theological_decisions:
- issue: Hierarquia ética entre a Lei e o afeto filial
  choice: A Lei prevalece sobre o afeto pelos pais, de modo que a virtude não seja traída por causa deles.
  alternative: A Lei governa ou disciplina o afeto filial, sem necessariamente descrever um conflito direto em todos os casos.
  rationale: κρατεῖ indica domínio ou superioridade, enquanto o particípio negativo liga esse domínio à preservação da virtude. A tradução mantém a prioridade moral sem ampliar a afirmação para além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Lei” recebe inicial maiúscula para sinalizar a referência contextual à Lei judaica; “prevalece sobre” preserva o tom filosófico e a relação de superioridade do original.
