  yaml_path: translation/deuterocanon/4_maccabees/002/016.yaml
  text: For prudent reason drives away all these vicious passions[a], just as it also drives away anger; for it is master even over this.
translation:
  language: pt
  text: Pois a razão prudente[a] repele todas essas paixões perversas, assim como também repele a ira, pois domina até mesmo esta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a mente autocontrolada”. A expressão grega ὁ σώφρων νοῦς reúne as ideias de faculdade racional, prudência e domínio de si.
    reason: lexical_alternative
lexical_decisions:
- source_word: κακόηθη πάθη
  choice: paixões perversas
  rationale: No contexto ético-filosófico de 4 Macabeus, a expressão designa impulsos afetivos moralmente nocivos ou corrompidos, não sofrimentos em geral. “Paixões perversas” conserva tanto a força negativa do adjetivo quanto o caráter técnico de πάθη.
- source_word: ὁ σώφρων νοῦς
  choice: a razão prudente
  rationale: “Razão” representa νοῦς como faculdade racional no argumento do livro, enquanto “prudente” comunica a disciplina, sensatez e moderação de σώφρων sem reduzir a expressão apenas ao intelecto.
- source_word: ἀπωθεῖται
  choice: repele
  rationale: O verbo exprime afastar ou rechaçar ativamente. “Repele” é natural e preserva a imagem de resistência eficaz às paixões.
- source_word: θυμόν
  choice: a ira
  rationale: Neste contexto, θυμός é um afeto intenso submetido ao governo da razão. “Ira” preserva sua força melhor que o mais brando “irritação”.
- source_word: δεσπόζει
  choice: domina
  rationale: O verbo indica exercer senhorio ou controle efetivo. “Domina” transmite essa forte ideia de governo em português corrente.
theological_decisions:
- issue: Sentido antropológico e filosófico de ὁ σώφρων νοῦς
  choice: a razão prudente
  alternative: a mente autocontrolada
  rationale: A formulação escolhida mantém o foco do livro na faculdade racional que governa as paixões, sem apagar a dimensão de autocontrole presente em σώφρων. A alternativa legítima é registrada em nota para preservar a amplitude da expressão grega.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “repele” explicita o verbo elíptico na comparação e evita sugerir que a ira seja algo distinto da ação de afastar descrita na primeira oração.
