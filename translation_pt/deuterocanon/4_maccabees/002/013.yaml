  text: And do not think it strange that reason can prevail even over hostility for the sake of the law[b][a],
translation:
  language: pt
  text: E não considerem estranho[a] que, por causa da lei, a razão seja capaz de dominar até mesmo a hostilidade.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não considerem isso surpreendente” ou “paradoxal”. O termo grego descreve algo contrário à expectativa.'
    reason: lexical_alternative
  - marker: b
    text: 'Mais literalmente: “onde também a razão é capaz de dominar a hostilidade por causa da lei”. A construção grega é condensada, e “por causa da lei” também pode expressar motivação: “por amor à lei”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ νομίσητε
  choice: não considerem
  rationale: O verbo introduz uma avaliação; esta formulação preserva a proibição e soa natural em português atual.
- source_word: παράδοξον
  choice: estranho
  rationale: O adjetivo indica algo contrário à expectativa ou surpreendente; “estranho” é claro e idiomático sem impor o sentido técnico moderno de “paradoxal”.
- source_word: ὅπου
  choice: que
  rationale: Embora seu valor básico seja “onde”, aqui introduz de forma comprimida a circunstância ou o conteúdo que não deve causar estranheza; “que” produz uma construção natural em português.
- source_word: ἔχθραν
  choice: hostilidade
  rationale: O termo pode indicar inimizade, hostilidade ou ódio; “hostilidade” conserva sua amplitude sem o limitar a um sentimento interior.
- source_word: ὁ λογισμός
  choice: a razão
  rationale: Em 4 Macabeus, o termo designa a faculdade racional ou o juízo refletido e constitui um conceito central da argumentação do livro.
- source_word: ἐπικρατεῖν δύναται
  choice: seja capaz de dominar
  rationale: A expressão comunica capacidade efetiva de prevalecer ou exercer domínio sobre algo; a construção com subjuntivo se ajusta naturalmente à oração introduzida por “que”.
- source_word: καί
  choice: até mesmo
  rationale: Neste contexto, a partícula tem força enfática e ressalta que a hostilidade também pode ser submetida à razão.
- source_word: διὰ τὸν νόμον
  choice: por causa da lei
  rationale: διά com acusativo expressa aqui causa ou motivo. A formulação preserva essa relação sem decidir além do texto se a lei funciona como causa, motivação ou fundamento.
- source_word: νόμον
  choice: a lei
  rationale: A referência contextual é à lei judaica, mas a forma comum em minúscula preserva o grego e evita transformar desnecessariamente o substantivo em título formal.
theological_decisions:
- issue: Sentido filosófico-teológico de λογισμός em 4 Macabeus
  choice: a razão
  alternative: o raciocínio; o juízo racional
  rationale: “A razão” preserva a tese temática do livro sobre o domínio da razão piedosa sem importar terminologia filosófica posterior.
- issue: Força de διὰ τὸν νόμον
  choice: por causa da lei
  alternative: por amor à lei; em razão da lei
  rationale: O grego admite uma relação causal ou motivacional. A escolha conserva essa amplitude melhor do que uma formulação que definiria exclusivamente devoção, finalidade ou instrumentalidade.
- issue: Alcance de ἔχθρα
  choice: hostilidade
  alternative: inimizade; ódio
  rationale: “Hostilidade” mantém aberto se o texto se refere sobretudo a uma disposição, a uma relação de inimizade ou à sua manifestação, evitando reduzi-lo apenas à emoção do ódio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe grega condensada foi reorganizada sem eliminar a ambiguidade causal ou motivacional de διὰ τὸν νόμον; as alternativas relevantes ficam registradas em nota.
