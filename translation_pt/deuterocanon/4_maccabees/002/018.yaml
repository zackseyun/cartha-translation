  text: For, as I said, prudent reason is able to triumph over the passions, and to redirect some of them, and even to nullify others.
translation:
  language: pt
  text: Pois, como eu disse, a razão prudente é capaz de triunfar sobre as paixões, de redirecionar algumas delas e até de anular outras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σώφρων
  choice: prudente
  rationale: Ao qualificar νοῦς, indica discernimento sensato e disciplinado, não apenas autocontrole emocional.
- source_word: νοῦς
  choice: razão
  rationale: No argumento filosófico de 4 Macabeus, designa a faculdade racional que governa as paixões; “razão” expressa isso com mais precisão que o termo mais amplo “mente”.
- source_word: κατὰ τῶν παθῶν
  choice: sobre as paixões
  rationale: πάθη se refere aqui a paixões ou impulsos. Com ἀριστεῦσαι, a construção comunica superioridade e domínio.
- source_word: ἀριστεῦσαι
  choice: triunfar
  rationale: O verbo denota sobressair ou mostrar-se superior; “triunfar sobre” transmite naturalmente sua força neste contexto.
- source_word: μεταθεῖναι
  choice: redirecionando
  rationale: Indica mudar o curso ou a disposição de certas paixões, em contraste com torná-las sem efeito.
- source_word: ἀκυρῶσαι
  choice: anulando
  rationale: Expressa tornar ineficaz ou sem efeito e conserva o contraste mais forte com apenas redirecionar.
- source_word: τὰ μὲν αὐτῶν ... τὰ δὲ καί
  choice: algumas delas ... até ... outras
  rationale: 'Preserva a distinção entre dois resultados: certas paixões são redirecionadas, enquanto outras são anuladas.'
theological_decisions:
- issue: Enquadramento antropológico e filosófico de νοῦς e πάθη
  choice: Expressar o domínio racional sobre as paixões sem acrescentar categorias doutrinárias posteriores.
  alternative: Traduzir νοῦς por “mente” e πάθη por “emoções”.
  rationale: O versículo participa de um argumento judaico helenístico sobre o governo das paixões pela razão. “Razão” e “paixões” preservam esse campo conceitual sem resolver o texto por meio de uma antropologia confessional posterior.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário filosófico corrente. A construção com gerúndios apresenta redirecionar e anular como modos pelos quais a razão triunfa, acompanhando a relação sintática dos infinitivos gregos.
