  text: For although Moses was angered against Dathan and Abiron, he did nothing against them in anger, but with reason he restrained anger.
translation:
  language: pt
  text: Pois Moisés, embora estivesse irado contra Datã e Abeirão[a], não fez nada contra eles movido pela ira; pelo contrário, governou a ira pela razão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente, “Abirão”.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “conteve a ira por meio do juízo racional”. O grego ressalta o governo da razão sobre a paixão, tema central de 4 Macabeus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμούμενος
  choice: estivesse irado
  rationale: Preserva a afirmação de que Moisés realmente sentiu ira, sem sugerir que agiu impulsionado por ela.
- source_word: γέ τοι
  choice: embora
  rationale: No contexto do contraste entre sentir ira e não agir por ira, a conjunção concessiva expressa com naturalidade a força discursiva das partículas.
- source_word: κατὰ Δαθὰν καὶ Ἀβειρών
  choice: contra Datã e Abeirão
  rationale: κατά indica aqui a direção hostil da ira. Os nomes seguem formas portuguesas baseadas nas formas gregas do texto-fonte.
- source_word: οὐ θυμῷ τι κατ᾽ αὐτῶν ἐποίησεν
  choice: não fez nada contra eles movido pela ira
  rationale: 'A formulação torna explícito o valor modal ou instrumental de θυμῷ: a ira não foi o princípio que determinou a ação de Moisés.'
- source_word: λογισμῷ
  choice: pela razão
  rationale: Traduz de modo claro o termo central do argumento de 4 Macabeus, no qual a razão governa as paixões.
- source_word: τὸν θυμὸν διήτησεν
  choice: governou a ira
  rationale: O verbo comunica administração e controle, não eliminação da emoção. “Governou” preserva especialmente bem a ideia de domínio racional sobre a paixão.
theological_decisions:
- issue: Relação entre a razão e a ira de Moisés
  choice: governou a ira pela razão
  alternative: conteve a ira por meio do juízo racional
  rationale: A tradução mantém tanto a realidade da ira quanto seu governo pela razão, sem afirmar que a emoção foi inexistente ou simplesmente suprimida.
- issue: Forma do nome Ἀβειρών
  choice: Abeirão
  alternative: Abirão
  rationale: “Abeirão” representa em português a forma grega do texto-fonte; “Abirão” é a forma tradicional mais conhecida, derivada de outra tradição nominal.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe de contraste clara. “Movido pela ira” evita uma construção rígida, enquanto “governou a ira pela razão” preserva o vocabulário filosófico e a tensão entre experimentar uma paixão e dominá-la.
