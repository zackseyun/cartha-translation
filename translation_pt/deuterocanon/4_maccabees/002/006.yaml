base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/006.yaml
  text: And yet, when the law tells us not to desire, I could much more persuade you that reason is able to master desires, just as it also masters the passions that hinder righteousness.
translation:
  language: pt
  text: Contudo, quando a Lei nos diz que não devemos cobiçar, eu poderia convencer vocês muito mais de que a razão é capaz de dominar os desejos, assim como também domina as paixões que impedem a justiça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμεῖν / ἐπιθυμιῶν
  choice: cobiçar / desejos
  rationale: No primeiro caso, o infinitivo remete naturalmente à proibição da Lei e pede «cobiçar»; no segundo, o plural designa a categoria mais ampla dos desejos, evitando uma repetição artificial e preservando o argumento.
- source_word: ὁ λογισμός
  choice: a razão
  rationale: No contexto filosófico de 4 Macabeus, refere-se à faculdade racional capaz de governar as paixões.
- source_word: κρατεῖν
  choice: dominar
  rationale: Expressa governo ou controle efetivo sobre desejos e paixões.
- source_word: τῶν κωλυτικῶν τῆς δικαιοσύνης παθῶν
  choice: as paixões que impedem a justiça
  rationale: Reproduz com clareza a função impeditiva indicada pelo adjetivo grego, sem acrescentar uma interpretação confessional.
- source_word: πολὺ πλέον
  choice: com muito mais razão
  rationale: Traduz o reforço argumentativo de modo idiomático, indicando que a conclusão pode ser demonstrada de maneira ainda mais convincente.
theological_decisions:
- issue: Relação entre a proibição legal e o domínio racional das paixões
  choice: Manter a afirmação de que a razão pode dominar desejos e paixões
  alternative: Atenuar para «ajudar a controlar» ou atribuir explicitamente esse domínio à graça divina
  rationale: O grego afirma diretamente a capacidade do λογισμός; inserir uma qualificação teológica externa resolveria uma tensão que o texto não resolve.
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: «Justiça» preserva o equivalente lexical mais direto e deixa aberta a amplitude ética do termo.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Lei» recebe inicial maiúscula por designar a Lei mosaica no contexto. A construção «visto que» torna explícito o valor circunstancial de ὅτε sem forçar uma leitura meramente temporal; «vocês» oferece naturalidade ao plural ὑμᾶς.
