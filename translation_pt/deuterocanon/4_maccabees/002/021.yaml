  text: For when God constructed man, he implanted both his passions and his dispositions.
translation:
  language: pt
  text: Pois, quando Deus formou o ser humano, implantou nele tanto as paixões como as disposições de caráter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁπηνίκα
  choice: quando
  rationale: Introduz a circunstância temporal ligada ao aoristo; “quando” é natural e não sugere repetição.
- source_word: κατεσκεύασεν
  choice: formou
  rationale: Expressa a ação deliberada de fazer ou constituir sem o tom mecânico de “construiu” nem a especificidade teológica de um verbo grego para “criar”.
- source_word: τὸν ἄνθρωπον
  choice: o ser humano
  rationale: O singular articulado tem sentido genérico e designa a humanidade em sua condição representativa; esta formulação é clara e inclusiva sem alterar o referente.
- source_word: τὰ πάθη
  choice: as paixões
  rationale: No contexto filosófico, refere-se aos impulsos afetivos ou paixões que devem ser governados pela razão, não a sofrimentos externos.
- source_word: τὰ ἤθη
  choice: as disposições de caráter
  rationale: Torna explícito o sentido de traços ou inclinações relativamente estáveis do caráter, evitando os sentidos modernos inadequados de “costumes” ou “maneiras”.
- source_word: περιεφύτευσεν
  choice: implantou nele
  rationale: Preserva a metáfora de plantar ou inserir e explicita em português o complemento interno indicado pelo contexto e pelo pronome grego.
theological_decisions:
- issue: As paixões e as disposições de caráter como parte da formação divina do ser humano
  choice: Afirmar diretamente que Deus implantou ambas no ser humano.
  alternative: Atenuar a frase, falando apenas de capacidades neutras ou potenciais.
  rationale: O grego atribui explicitamente a Deus a implantação de τὰ πάθη e τὰ ἤθη; a tradução conserva essa tensão antropológica sem a resolver doutrinariamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Formou” soa mais natural do que “construiu” para uma pessoa e permanece próximo do sentido de κατεσκεύασεν. Não há marcadores de nota, pois nenhuma nota é necessária.
