  source_fidelity: A tradução reproduz com precisão a oração temporal (ὁπηνίκα γάρ), o ato deliberado de Deus em κατεσκεύασεν por “formou”, o uso genérico de τὸν ἄνθρωπον por “o ser humano” e a dupla τὰ πάθη καὶ τὰ ἤθη. “Implantou nele” comunica adequadamente a metáfora de περιεφύτευσεν e identifica naturalmente o ser humano como referente de αὐτοῦ.
  naturalness: “Pois, quando Deus formou o ser humano, implantou nele tanto as paixões como as disposições de caráter” é português moderno, claro e de registro adequado. A construção correlativa “tanto ... como ...” reflete bem o par coordenado grego.
