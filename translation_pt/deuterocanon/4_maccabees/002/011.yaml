  text: and he masters affection for his wife[a], reproving her because of lawlessness;
translation:
  language: pt
  text: e prevalece sobre o afeto pela esposa[a], repreendendo-a por transgredir a lei;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “domina o afeto pela esposa”. O verbo grego pode significar “prevalecer sobre” ou “exercer domínio sobre”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικρατεῖ
  choice: prevalece sobre
  rationale: O verbo expressa obter superioridade ou exercer domínio. “Prevalece sobre” conserva a força do argumento acerca do domínio da razão sem sugerir ausência de afeto.
- source_word: τῆς πρὸς γαμετὴν φιλίας
  choice: o afeto pela esposa
  rationale: γαμετή significa “esposa”, e φιλία indica aqui afeição ou vínculo afetivo no casamento, não especificamente desejo erótico.
- source_word: διὰ παρανομίαν
  choice: por transgredir a lei
  rationale: A expressão denota conduta contrária à lei. A formulação verbal é natural em português e mantém a força moral e legal de παρανομία.
- source_word: ἀπελέγχων
  choice: repreendendo
  rationale: O particípio indica censurar ou demonstrar a culpa de alguém; “repreendendo” comunica esse juízo moral com clareza.
- source_word: αὐτήν
  choice: -a
  rationale: O pronome feminino retoma γαμετήν, “esposa”; a forma enclítica evita repetição e é inequívoca no contexto.
theological_decisions:
- issue: O domínio da razão sobre o afeto conjugal
  choice: A razão prevalece até mesmo sobre o afeto pela esposa quando a transgressão da lei exige repreensão.
  alternative: Entender ἐπικρατεῖ em sentido mais brando, como apenas controlar ou moderar o afeto.
  rationale: O contexto de 4 Macabeus sustenta a forte afirmação de que a razão domina paixões e vínculos afetivos. A tradução preserva essa tensão ética sem introduzir categorias doutrinárias posteriores.
translation_notes:
  register: Português atual, digno e acessível, com sintaxe concisa que acompanha a continuidade do argumento. “Afeto” evita reduzir φιλία a amor romântico, e “transgredir a lei” torna natural a expressão abstrata grega sem enfraquecer seu teor moral-legal.
