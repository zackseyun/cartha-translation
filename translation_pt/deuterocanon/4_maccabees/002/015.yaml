base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/015.yaml
  text: 'And reason is seen to prevail even over the more violent passions: love of power[a], empty glory, boastfulness, arrogance[b], and envy.'
translation:
  language: pt
  text: 'E vê-se que a razão domina até mesmo as paixões mais violentas: o amor ao poder, a glória vazia[a], a jactância, a arrogância e a inveja[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “vanglória”. A expressão grega significa literalmente “glória vazia”.
    reason: lexical_alternative
  - marker: b
    text: “Inveja” também pode incluir a ideia de malevolência maliciosa ou de “mau-olhado”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῶν βιαιοτέρων ... παθῶν
  choice: as paixões mais violentas
  rationale: Com κρατεῖν, a expressão indica o âmbito sobre o qual a razão exerce domínio. πάθη refere-se aqui a paixões ou impulsos, e βιαιοτέρων destaca sua maior força ou violência.
- source_word: κρατεῖν
  choice: domina
  rationale: Expressa de modo natural e direto a superioridade e o controle da razão sobre as paixões, sem especificar indevidamente o mecanismo desse domínio.
- source_word: ὁ λογισμός
  choice: a razão
  rationale: Em 4 Macabeus, designa a faculdade racional ou o juízo refletido. “A razão” preserva o termo-chave filosófico de maneira clara e concisa.
- source_word: φαίνεται
  choice: vê-se
  rationale: Mantém a ideia de que o domínio da razão é manifesto ou observável e soa natural em português.
- source_word: φιλαρχίας
  choice: amor ao poder
  rationale: O composto denota desejo de governar, mandar ou ocupar posição de preeminência. “Amor ao poder” comunica claramente esse vício em linguagem atual.
- source_word: κενοδοξίας
  choice: glória vazia
  rationale: Preserva transparentemente os elementos do composto grego, literalmente ligados ao vazio e à glória, enquanto a nota oferece a alternativa tradicional “vanglória”.
- source_word: ἀλαζονίας
  choice: jactância
  rationale: Denota ostentação pretensiosa e autoafirmação vangloriosa. “Jactância” distingue esse vício da arrogância mencionada em seguida.
- source_word: μεγαλαυχίας
  choice: arrogância
  rationale: Refere-se à exaltação orgulhosa de si mesmo. “Arrogância” é atual, compreensível e preserva a distinção em relação à jactância.
- source_word: βασκανίας
  choice: inveja
  rationale: “Inveja” expressa o sentido central no catálogo de vícios; a nota preserva as nuances possíveis de malevolência e “mau-olhado”.
theological_decisions:
- issue: Tradução do termo filosófico central ὁ λογισμός
  choice: a razão
  alternative: o juízo racional; o raciocínio
  rationale: O livro argumenta que a faculdade racional disciplinada prevalece sobre as paixões. “A razão” conserva esse registro filosófico sem introduzir terminologia doutrinária posterior.
- issue: Distinção entre os vícios semanticamente próximos κενοδοξία, ἀλαζονία e μεγαλαυχία
  choice: glória vazia; jactância; arrogância
  alternative: vanglória; presunção; altivez
  rationale: A enumeração grega acumula vícios relacionados, mas distintos. A tradução evita reduzi-los todos a “orgulho” e mantém a progressão retórica e a tensão lexical do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação mantém o registro filosófico do texto e diferencia os vícios sobrepostos sem recorrer a linguagem denominacional.
