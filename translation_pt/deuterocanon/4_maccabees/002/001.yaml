lexical_decisions:
- source_word: τί θαυμαστόν
  choice: que há de surpreendente
  rationale: Expressa de modo idiomático em português a pergunta retórica grega, preservando sua força sem recorrer a uma formulação arcaica.
- source_word: ἐπιθυμίαι
  choice: desejos
  rationale: Termo amplo que abrange anseios e impulsos sem restringi-los a desejos corporais nem lhes atribuir de antemão um caráter moral negativo.
- source_word: ψυχῆς
  choice: da alma
  rationale: Preserva a linguagem antropológica do contexto filosófico judaico; “mente” seria estreito demais e “vida” não se ajustaria ao argumento.
- source_word: ἀκυροῦνται
  choice: são anulados
  rationale: Reproduz a forma passiva e a ideia de que os desejos são privados de validade ou eficácia, sem explicitar além do texto de que modo isso ocorre.
- source_word: πρὸς
  choice: no que diz respeito a
  rationale: Mantém a relação abstrata estabelecida pela preposição entre a anulação dos desejos e a participação na beleza, sem impor uma direção ou causalidade específica.
- source_word: τοῦ κάλλους
  choice: na beleza
  rationale: Traduz diretamente o substantivo abstrato κάλλος e evita interpretar a beleza especificamente como nobreza moral.
- source_word: μετουσίαν
  choice: participação
  rationale: Conserva o registro filosófico e a estrutura abstrata do grego; “partilha” seria mais corrente, mas um pouco menos precisa neste contexto.
theological_decisions:
- issue: Sentido antropológico de ψυχή no contexto filosófico judaico
  choice: alma
  alternative: ser interior
  rationale: “Alma” preserva o universo conceitual do autor e a tensão entre razão e desejos, sem reduzir ψυχή a uma categoria psicológica moderna.
- issue: Alcance moral e estético de κάλλος
  choice: beleza
  alternative: o que é belo
  rationale: O grego nomeia diretamente a beleza. Embora o contexto possa sugerir beleza moral ou nobreza, a tradução não deve incorporar essa interpretação ao texto principal.
- issue: Relação abstrata expressa por πρὸς τὴν τοῦ κάλλους μετουσίαν
  choice: no que diz respeito à participação na beleza
  alternative: quanto a tomar parte no que é belo
  rationale: A opção principal conserva a formulação abstrata e sua ambiguidade; a alternativa explicita a expressão em linguagem mais concreta, sem resolver sua referência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém deliberadamente o caráter abstrato do argumento filosófico, enquanto a nota oferece uma alternativa mais concreta.
