  yaml_path: translation/deuterocanon/4_maccabees/002/001.yaml
  text: And what is surprising if the desires of the soul are nullified in relation to participation in beauty?[a]
translation:
  language: pt
  text: E que há de surpreendente se os desejos da alma são anulados no que diz respeito à participação na beleza?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quanto a tomar parte no que é belo”. A expressão grega é abstrata e admite uma formulação mais explícita.'
