base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/019.yaml
  text: For why does our all-wise father Jacob blame those around Simeon and Levi for slaughtering the Shechemites en masse[a], not with reason, saying[b], “Cursed be their anger”?
translation:
  language: pt
  text: 'Pois por que nosso pai Jacó, tão sábio, censura — não segundo a razão? — os que estavam com Simeão e Levi por terem massacrado coletivamente os siquemitas, dizendo: “Maldita seja a ira deles”?[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega “não segundo a razão” é condensada e de ligação sintática discutida; também pode ser entendida como “sem razão”. No contexto, é provável que a censura de Jacó seja apresentada como justificada, sem que a frase determine de modo inequívoco a ligação da expressão.
    reason: lexical_alternative
  - marker: b
    text: A declaração retoma Gênesis 49:7.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπεὶ διὰ τί
  choice: Pois por que
  rationale: Conserva tanto a ligação explicativa com o argumento anterior quanto a força interrogativa da pergunta retórica.
- source_word: ὁ πάνσοφος ἡμῶν πατὴρ Ἰακὼβ
  choice: nosso pai Jacó, tão sábio
  rationale: Expressa o elogio enfático de πάνσοφος em português natural e digno, sem o possível sentido técnico de onisciência que “onissábio” poderia sugerir.
- source_word: τοὺς περὶ Συμεὼν καὶ Λευεὶν
  choice: os que estavam com Simeão e Levi
  rationale: Reflete o idioma grego para Simeão e Levi juntamente com seu grupo, sem definir de modo indevido quem o compunha.
- source_word: αἰτιᾶται
  choice: censura
  rationale: Transmite reprovação ou atribuição de culpa e se ajusta ao tom elevado da passagem.
- source_word: τοὺς Σικιμίτας
  choice: os siquemitas
  rationale: Forma portuguesa tradicional e clara para os habitantes de Siquém.
- source_word: ἐθνηδὸν
  choice: como um povo
  rationale: Preserva a ideia de que os siquemitas foram mortos coletivamente, como grupo étnico ou populacional.
- source_word: ἀποσφάξαντας
  choice: terem massacrado
  rationale: Mantém a força violenta do verbo composto grego sem recorrer a linguagem coloquial.
- source_word: μὴ λογισμῷ
  choice: não segundo a razão
  rationale: Mantém a formulação grega comprimida e sua ambiguidade de ligação sintática, deixando a nota esclarecer a leitura contextual provável.
- source_word: Ἐπικατάρατος ὁ θυμὸς αὐτῶν
  choice: Maldita seja a ira deles
  rationale: Preserva a força de maldição, o sentido de θυμός e a alusão verbal a Gênesis 49:7.
theological_decisions:
- issue: Relação de μὴ λογισμῷ com a censura de Jacó e com o massacre
  choice: Manter no texto a expressão comprimida “não segundo a razão”, sem fixar silenciosamente sua ligação sintática.
  alternative: 'Explicitar: “não os censura com razão?” ou “por terem agido sem razão”.'
  rationale: O grego transmitido admite dificuldade sintática, embora o contexto favoreça a ideia de que a razão condena a violência movida pela ira e, portanto, de que a censura de Jacó é justificada. A nota registra essa orientação sem eliminar a tensão do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período conserva o caráter retórico e filosófico do original; “tão sábio” evita uma forma artificial, e “como um povo” mantém a dimensão coletiva de ἐθνηδόν.
