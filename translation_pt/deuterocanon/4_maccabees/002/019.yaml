  verdict: revise
  source_fidelity: O texto representa bem a pergunta retórica, o epíteto de Jacó, o grupo associado a Simeão e Levi, a violência do ato e a citação de Gênesis. Contudo, a posição de “não segundo a razão” depois de “massacrado” torna em português a relação sintática ainda mais opaca e pode parecer qualificar diretamente o massacre, sem preservar de modo suficientemente legível a questão grega disputada.
  naturalness: “Pois por que” e “nosso pai Jacó, tão sábio” são naturais em registro elevado. “Como um povo” é compreensível, mas “coletivamente” expressa com maior naturalidade o valor adverbial de ἐθνηδόν sem sugerir que eles foram massacrados enquanto atuavam como um povo.
  terminology: “Simeão”, “Levi”, “siquemitas”, “ira” e “maldita seja” são adequados. “Censura” traduz bem αἰτιᾶται. A nota deve conservar explicitamente a ambiguidade de μὴ λογισμῷ e não declarar como certo que o massacre não foi governado pela razão, pois isso é uma explicação contextual, não uma relação sintática inequívoca do grego.
