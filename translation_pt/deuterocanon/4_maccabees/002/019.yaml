    rationale: No grego, μὴ λογισμῷ é uma formulação sintaticamente difícil. Na redação atual, a expressão vem imediatamente após “terem massacrado”, o que favorece uma leitura em que qualifica o massacre. A pontuação pode manter a ambiguidade sem sacrificar a legibilidade.
  - severity: low
