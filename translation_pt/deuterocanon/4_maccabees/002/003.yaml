  text: For while he was still young and in the prime of life for sexual union[a], he nullified by reason the sting of the passions.
translation:
  language: pt
  text: Pois, sendo jovem e estando em pleno vigor para a união sexual, ele anulou, pela razão, o aguilhão das paixões.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o impulso das paixões” ou “o frenesi das paixões”. A metáfora grega em οἶστρον pode indicar um aguilhão, uma incitação pungente ou um impulso arrebatador.
    reason: lexical_alternative
lexical_decisions:
- source_word: νέος
  choice: jovem
  rationale: Expressa diretamente a juventude, sem acrescentar ao adjetivo uma especificação desnecessária.
- source_word: ἀκμάζων
  choice: estando em pleno vigor
  rationale: O particípio indica estar no auge ou na plenitude das forças; a expressão é natural em português e se liga adequadamente à capacidade sexual mencionada em seguida.
- source_word: πρὸς συνουσιασμόν
  choice: para a união sexual
  rationale: Neste contexto, συνουσιασμός se refere à relação ou união sexual. A formulação é clara, digna e evita tanto a vagueza quanto um tom excessivamente clínico.
- source_word: ἠκύρωσεν
  choice: anulou
  rationale: O verbo indica tornar sem efeito ou sem poder; “anulou” preserva a força decisiva da ação.
- source_word: τῷ λογισμῷ
  choice: pela razão
  rationale: λόγισμος é um termo central em 4 Macabeus para a razão que governa as paixões. “Pela razão” conserva esse tema e soa natural em português.
- source_word: οἶστρον
  choice: aguilhão
  rationale: O substantivo pode evocar um inseto que pica, um aguilhão, um estímulo impetuoso ou um frenesi. “Aguilhão” preserva a metáfora de uma força que incita e impele.
- source_word: τῶν παθῶν
  choice: das paixões
  rationale: No vocabulário ético da obra, πάθη são os impulsos e afetos que a razão deve dominar. “Paixões” mantém essa amplitude conceitual.
theological_decisions:
- issue: Como traduzir λόγισμος sem perder o tema ético-filosófico central de 4 Macabeus
  choice: razão
  alternative: juízo racional; raciocínio
  rationale: “Razão” comunica de modo conciso a faculdade racional que governa as paixões, sem impor distinções filosóficas ou doutrinárias posteriores.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A ordem foi levemente ajustada para fluidez, preservando a relação entre juventude, vigor sexual, razão e domínio das paixões. O marcador da nota foi colocado após “aguilhão das paixões”, expressão à qual a nota efetivamente se refere.
