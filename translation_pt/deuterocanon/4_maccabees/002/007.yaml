  yaml_path: translation/deuterocanon/4_maccabees/002/007.yaml
  text: For how is a man who is by habit eating only one kind of food[a], and is a glutton and a drunkard, retrained, if it is not clear that reason is master of the passions?
translation:
  language: pt
  text: Pois, de que maneira um homem que, por hábito, só come um tipo de alimento[a], é glutão e beberrão é reeducado, a não ser que esteja claro que a razão domina as paixões?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “é exigente com a comida” ou “só quer pratos especiais”. O termo grego é raro e seu sentido exato é incerto.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Pois
  rationale: Introduz uma pergunta retórica que fundamenta o argumento anterior e preserva a conexão explicativa.
- source_word: τίνα τρόπον
  choice: de que maneira
  rationale: Mantém de forma natural a formulação interrogativa do grego.
- source_word: μονοφάγος
  choice: só come um tipo de alimento
  rationale: Reproduz o sentido formal mais imediato do termo raro, sem ocultar sua incerteza lexical; alternativas contextuais são registradas em nota.
- source_word: τὸ ἦθος
  choice: por hábito
  rationale: Expressa uma disposição ou conduta consolidada, e não um estado momentâneo.
- source_word: γαστρίμαργος
  choice: glutão
  rationale: Equivalente corrente para quem se caracteriza pelo apetite excessivo.
- source_word: μέθυσος
  choice: beberrão
  rationale: Designa alguém caracterizado pelo consumo excessivo de bebida, não apenas alguém embriagado em dado momento.
- source_word: μεταπαιδεύεται
  choice: é reeducado
  rationale: Preserva a ideia de educação ou treinamento que produz mudança de conduta.
- source_word: δῆλον
  choice: está claro
  rationale: Equivalente simples e idiomático no período condicional.
- source_word: κύριός
  choice: domina
  rationale: No contexto, indica governo ou controle, não um título divino; a forma verbal produz português natural.
- source_word: παθῶν
  choice: as paixões
  rationale: Conserva o sentido filosófico das paixões ou impulsos que devem ser governados.
- source_word: ὁ λογισμός
  choice: a razão
  rationale: Traduz o termo filosófico central do livro para a faculdade racional que governa a conduta.
theological_decisions:
- issue: Sentido de κύριος em contexto filosófico não divino
  choice: domina
  alternative: é senhora de; governa
  rationale: A construção afirma o domínio da razão sobre as paixões, sem empregar κύριος como título divino.
- issue: Masculino genérico em τις ὢν
  choice: um homem que
  alternative: alguém que; uma pessoa que
  rationale: Preserva a forma masculina singular do exemplo grego sem ampliar sua referência.
- issue: Relação entre razão e paixões
  choice: a razão domina as paixões
  alternative: a razão é senhora das paixões
  rationale: Mantém a afirmação filosófica de governo sem explicar ou suavizar sua tensão antropológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pergunta retórica e a terminologia filosófica foram preservadas; a raridade de μονοφάγος é sinalizada em nota.
