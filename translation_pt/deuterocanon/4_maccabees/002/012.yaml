  text: and it masters love for children[a], punishing them for their wickedness; and it rules over attachment to friends, reproving them for their evil.
translation:
  language: pt
  text: e domina o amor pelos filhos[a], castigando-os por sua maldade; e exerce domínio sobre o apego aos amigos, repreendendo-os por sua perversidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o amor dos filhos” e, mais adiante, “a familiaridade ou convivência dos amigos”; o sentido é a afeição ou o apego aos próprios filhos e amigos.
    reason: lexical_alternative
lexical_decisions:
- source_word: κυριεύει
  choice: domina
  rationale: Expressa o exercício de senhorio ou controle e mantém a força do verbo grego em português corrente.
- source_word: τῆς τέκνων φιλίας
  choice: o amor pelos filhos
  rationale: A construção genitiva indica naturalmente a afeição dirigida aos filhos; esta formulação é clara e preserva o caráter relacional de φιλία.
- source_word: διὰ κακίαν αὐτῶν
  choice: por sua maldade
  rationale: διά com acusativo apresenta a razão do castigo; “maldade” conserva o sentido moral de κακία sem o enfraquecer.
- source_word: κολάζων
  choice: castigando-os
  rationale: O particípio descreve uma ação punitiva contra os filhos; “castigando” transmite seu peso disciplinar e moral.
- source_word: τῆς φίλων συνηθείας
  choice: o apego aos amigos
  rationale: συνήθεια pode designar convivência habitual, intimidade ou vínculo formado pela familiaridade; “apego” comunica de modo natural o laço afetivo em vista.
- source_word: δεσπόζει
  choice: exerce domínio sobre
  rationale: Preserva a ideia forte de autoridade e domínio, em paralelo com κυριεύει, evitando uma repetição estilisticamente pesada de “domina”.
- source_word: διὰ πονηρίας
  choice: por sua perversidade
  rationale: A expressão indica a razão da repreensão; “perversidade” conserva a gravidade moral de πονηρία e a distingue verbalmente de κακία.
- source_word: ἐξελέγχων
  choice: repreendendo-os
  rationale: Com pessoas como objeto, o verbo pode significar censurar, convencer do erro ou desmascarar a culpa; “repreendendo” se ajusta ao contexto sem impor um cenário judicial.
theological_decisions:
- issue: Sujeito implícito dos verbos
  choice: Manter o sujeito implícito, como no grego, ligando a frase ao contexto anterior
  alternative: Explicitar “a razão” ou “o domínio da razão” no próprio versículo
  rationale: O versículo grego não repete um substantivo como sujeito. O português permite conservar essa continuidade sem introduzir no texto uma explicitação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo e a força dos dois verbos de domínio, ao mesmo tempo que distingue “maldade” de “perversidade”.
