base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/023.yaml
  text: And to him he gave a law[a], according to which, by conducting himself as a citizen[b], he would rule a kingdom that was self-controlled and just and good and courageous.
translation:
  language: pt
  text: E deu-lhe uma lei, segundo a qual, vivendo como cidadão[a], governaria um reino[b] moderado, justo, bom e corajoso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «conduzindo sua vida cívica»; o particípio grego conserva o sentido político de viver e agir como membro da comunidade.
    reason: lexical_alternative
  - marker: b
    text: Ou «uma realeza» ou «um reinado»; o termo grego pode indicar tanto o domínio governado quanto o exercício do poder real.
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: a ele
  rationale: O dativo indica o destinatário do verbo ἔδωκεν; «a ele» mantém clara a referência à pessoa mencionada anteriormente.
- source_word: νόμον
  choice: uma lei
  rationale: O substantivo anartro é naturalmente expresso de modo indefinido e designa uma norma ou lei orientadora.
- source_word: καθʼ ὃν
  choice: segundo a qual
  rationale: Preserva a ligação formal entre a lei recebida e a maneira de viver e governar.
- source_word: πολιτευόμενος
  choice: vivendo como cidadão
  rationale: Mantém o sentido cívico-político de πολιτεύομαι, isto é, conduzir a vida como membro da pólis, sem reduzi-lo simplesmente a «governando».
- source_word: βασιλεύσειε
  choice: governaria
  rationale: O optativo exprime aqui uma perspectiva ou resultado pretendido no contexto passado; o futuro do pretérito comunica isso naturalmente em português.
- source_word: βασιλείαν
  choice: um reino
  rationale: βασιλεία pode indicar reino, domínio ou exercício da realeza. «Reino» oferece o objeto mais natural de «governaria», enquanto a ambiguidade é registrada em nota.
- source_word: σώφρονά
  choice: moderado
  rationale: σώφρων envolve sensatez, temperança e domínio próprio. Aplicado a «reino», «moderado» soa natural e conserva o caráter ético.
- source_word: δικαίαν
  choice: justo
  rationale: No contexto cívico-político, «justo» expressa mais diretamente a justiça pública do que «reto».
- source_word: ἀγαθήν
  choice: bom
  rationale: É a equivalência ampla e direta, sem restringir o adjetivo a «beneficente» ou «nobre».
- source_word: ἀνδρείαν
  choice: corajoso
  rationale: Conserva a virtude da coragem sem reproduzir a conotação masculina etimológica que não precisa ser explicitada no contexto.
theological_decisions:
- issue: Sentido cívico de πολιτευόμενος em relação ao governo régio
  choice: vivendo como cidadão
  alternative: conduzindo sua vida pública; vivendo de acordo com a constituição
  rationale: A formulação preserva a tensão moral e política de um governante que também vive sob uma lei, sem converter o particípio em mera administração do Estado.
- issue: Alcance de βασιλείαν
  choice: um reino
  alternative: uma realeza; um reinado; um domínio
  rationale: O termo grego pode designar tanto o âmbito governado quanto o exercício do poder real. A tradução principal é idiomática, e a nota mantém aberta a alternativa.
- issue: Sentido de δικαίαν na lista de virtudes políticas
  choice: justo
  alternative: reto
  rationale: Como o termo caracteriza o reino ou governo, «justo» comunica melhor a dimensão pública e ética sem acrescentar uma leitura doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem da frase acompanha o argumento grego sem sacrificar a naturalidade. Os adjetivos foram mantidos como predicados do «reino», inclusive «corajoso», preservando a formulação incomum e a tensão retórica do original.
