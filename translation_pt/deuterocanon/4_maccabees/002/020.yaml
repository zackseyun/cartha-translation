lexical_decisions:
- source_word: εἰ μὴ γὰρ
  choice: Pois, se ... não
  rationale: Preserva a função explicativa de γάρ e a estrutura condicional de εἰ μή em português natural.
- source_word: ἐδύνατο
  choice: fosse capaz
  rationale: Expressa a capacidade indicada pelo imperfeito de δύναμαι e se ajusta à condição contrafactual.
- source_word: τῶν θυμῶν
  choice: as paixões
  rationale: Embora θυμός possa indicar ira ou impulso, o plural no contexto filosófico abrange os impulsos afetivos submetidos ao governo da razão.
- source_word: ὁ λογισμός
  choice: a razão
  rationale: Mantém o termo filosófico central de 4 Macabeus para a faculdade racional ou o juízo racional.
- source_word: κρατεῖν
  choice: dominar
  rationale: Comunica o exercício de controle ou superioridade sobre as paixões sem suavizar a força do verbo.
- source_word: οὐκ ἂν εἶπεν
  choice: não teria falado
  rationale: Reproduz a consequência contrária aos fatos expressa por ἄν com o aoristo.
- source_word: οὕτως
  choice: dessa maneira
  rationale: Retoma de modo natural a forma ou o conteúdo da declaração anterior.
theological_decisions:
- issue: Sentido filosófico-antropológico de λογισμός
  choice: a razão
  alternative: o raciocínio; a faculdade racional
  rationale: Preserva o argumento recorrente do livro de que a razão pode governar as paixões, sem tornar o texto excessivamente técnico.
- issue: Amplitude semântica de θυμοί
  choice: as paixões
  alternative: as iras; os impulsos
  rationale: O contexto favorece a categoria mais ampla dos impulsos afetivos, embora o termo grego também possa ter associação específica com a ira.
