translation:
  language: pt
  text: nem cortando as plantas cultivadas dos inimigos, mas preservando as dos adversários para os que as perderam[a] e levantando o que havia caído.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “preservando as dos adversários para os que as destruíram”. O particípio grego é ativo e deixa implícito o objeto; no contexto, pode referir-se às plantas ou a outros bens recém-mencionados por elipse.'
    reason: ambiguidade_lexical_e_sintática
lexical_decisions:
- source_word: μηδὲ
  choice: nem
  rationale: Dá continuidade à descrição negativa do contexto com uma coordenação breve e natural.
- source_word: δενδροτομῶν
  choice: cortando
  rationale: O verbo se refere a cortar árvores ou madeira; com φυτά como complemento, “cortando” evita restringir indevidamente a ação a derrubar árvores inteiras.
- source_word: τὰ ἥμερα ... φυτά
  choice: as plantas cultivadas
  rationale: ἥμερα indica vegetação domesticada ou cultivada, em contraste com a silvestre, e φυτά é mais amplo que “árvores”.
- source_word: τῶν πολεμίων
  choice: dos inimigos
  rationale: Reproduz diretamente o genitivo possessivo.
- source_word: τὰ δὲ τῶν ἐχθρῶν
  choice: mas ... para os adversários o que
  rationale: O artigo substantivado aponta para coisas pertencentes aos adversários; a formulação portuguesa explicita a relação sem especificar que tipo de bem era.
- source_word: τοῖς ἀπολέσασιν
  choice: o que eles haviam perdido
  rationale: ἀπολέσασιν é particípio aoristo ativo de ἀπόλλυμι e, neste contexto, significa “os que perderam”, com o objeto implícito; não é a forma passiva ou média esperada para “os que pereceram”.
- source_word: διασώζων
  choice: preservando
  rationale: Expressa conservar a salvo ou intacto, adequado à devolução ou proteção dos bens do adversário.
- source_word: τὰ πεπτωκότα
  choice: o que havia caído
  rationale: Mantém a formulação substantivada e geral do grego, sem explicitar se se trata de animal ou outra coisa.
- source_word: συνεγείρων
  choice: ajudando a levantar
  rationale: O composto sugere participar do ato de erguer; “ajudando a levantar” é natural no provável contexto de auxiliar com algo caído.
theological_decisions:
- issue: Conduta ética para com os bens dos inimigos
  choice: Apresentar a pessoa virtuosa como alguém que preserva para os adversários aquilo que eles perderam.
  alternative: Entender τοῖς ἀπολέσασιν como “para os que pereceram” ou “cujos donos foram destruídos”.
  rationale: A forma grega é ativa e admite naturalmente “os que perderam”, enquanto “os que pereceram” normalmente exigiria forma média. A sequência também ecoa mandamentos de proteção e auxílio relativos ao inimigo, sem necessidade de introduzir a ideia de donos mortos.
- issue: Identidade do que caiu
  choice: Conservar a expressão geral “o que havia caído”.
  alternative: Explicitar “o animal que havia caído”.
  rationale: O contexto legal pode aludir a um animal caído, mas o substantivo não aparece neste versículo; a tradução preserva a abertura do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição grega de termos para “inimigos” foi representada por “inimigos” e “adversários”. A tradução corrige a leitura passiva da camada inglesa, pois ἀπολέσασιν é morfologicamente ativo.
