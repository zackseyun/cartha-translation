    rationale: τὰ δὲ τῶν ἐχθρῶν significa literalmente «mas as [coisas/plantas] dos adversários», objeto de «preservando». «Preservando para os adversários o que eles haviam perdido» introduz uma referência pronominal e uma relação temporal que não estão explicitamente no grego.
  - severity: medium
    issue: A nota de rodapé caracteriza indevidamente a ambiguidade de ἀπολέσασιν.
    rationale: O particípio é ativo. «Os que as perderam» é uma possibilidade natural quando ἀπόλλυμι significa perder, mas o verbo também pode significar destruir; «os que pereceram» não corresponde à mesma voz sem uma justificativa textual adicional.
