  source_fidelity: A primeira cláusula traduz bem μηδὲ δενδροτομῶν τὰ ἥμερα τῶν πολεμίων φυτά. Na segunda, o grego mantém como objeto elíptico «as [plantas] dos adversários» e traz τοῖς ἀπολέσασιν, particípio aoristo ativo. A redação proposta torna esse objeto em «o que eles haviam perdido» e antecipa «para os adversários», alterando a estrutura e enfraquecendo a ligação entre «as [plantas] dos adversários» e «preservando». A opção «os que as perderam» preserva a voz ativa e a elipse; uma nota registra a alternativa lexical «as destruíram», sem decidir além do que o texto permite.
  naturalness: «Nem cortando ... mas preservando ... e levantando ...» é uma sequência participial natural e adequada ao registro sentencioso do contexto. «As dos adversários» é uma elipse corrente em português e evita acrescentar «bens» ou «donos». «Ajudando a levantar» introduz uma ideia de auxílio que não é expressa pelo particípio; «levantando» é mais direto.
  terminology: «Plantas cultivadas», «inimigos» e «adversários» são escolhas claras e fiéis. A alternância entre os dois termos hostis preserva a variação do grego sem criar diferença teológica ou técnica. A nota deve tratar ἀπολέσασιν como ativo e não apresentar «os que pereceram» como leitura gramaticalmente equivalente.
