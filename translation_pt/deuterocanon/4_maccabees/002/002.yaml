lexical_decisions:
- source_word: ταύτῃ γοῦν
  choice: Por isso
  rationale: Expressa de modo natural a força inferencial e retomadora da locução grega, ligando o exemplo de José ao argumento anterior.
- source_word: ὁ σώφρων
  choice: que tinha domínio próprio
  rationale: No contexto, σώφρων caracteriza José pela capacidade de governar as paixões; a formulação evita sugerir apenas prudência intelectual.
- source_word: Ἰωσὴφ
  choice: José
  rationale: Forma portuguesa tradicional do nome próprio.
- source_word: ἐπαινεῖται
  choice: é elogiado
  rationale: Reproduz diretamente o presente passivo grego em linguagem corrente e digna.
- source_word: τῷ λογισμῷ διανοίᾳ
  choice: por meio da razão
  rationale: A sequência transmitida por esta testemunha é sintaticamente difícil. A tradução reúne os termos em uma expressão idiomática que preserva a ideia central da faculdade racional em ação, sem criar uma duplicação artificial.
- source_word: περιεκράτησεν
  choice: dominou
  rationale: O verbo indica alcançar domínio ou prevalecer sobre algo; 'dominou' conserva a imagem de governo das paixões.
- source_word: τῆς ἡδυπαθείας
  choice: o desejo de prazer
  rationale: ἡδυπάθεια denota apego, busca ou indulgência no prazer. 'Desejo de prazer' é claro no contexto de José e não restringe indevidamente o termo à sensualidade.
theological_decisions:
- issue: Terminologia ético-filosófica sobre o governo das paixões
  choice: Traduzir σώφρων por 'que tinha domínio próprio' e λογισμός/διάνοια por 'razão'.
  alternative: '''prudente'' ou ''moderado'', e ''raciocínio'' ou ''entendimento'''
  rationale: A formulação destaca a tese recorrente de 4 Macabeus de que a razão governa as paixões, sem importar categorias doutrinárias posteriores nem apagar a tensão entre a faculdade racional e o desejo.
- issue: Natureza de ἡδυπάθεια
  choice: o desejo de prazer
  alternative: o amor ao prazer; a busca do prazer; a indulgência prazerosa
  rationale: A opção mantém a referência ampla à atração pelo prazer e se ajusta ao episódio de José, sem tornar explícita uma limitação sexual que o substantivo grego, isoladamente, não exige.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período mantém tom ético e digno, com terminologia acessível. A oração relativa 'que tinha domínio próprio' soa mais natural em português do que o substantivado 'o autocontrolado'.
