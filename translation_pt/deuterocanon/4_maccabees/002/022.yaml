  source_fidelity: A tradução preserva adequadamente a imagem de entronização, o caráter dirigente de ἡγεμών e o valor instrumental de διὰ τῶν αἰσθητηρίων. Contudo, «sobre todas as coisas» reproduz de modo mais direto e idiomático o escopo governante de περὶ πάντων do que «acima de todas as coisas». O δέ pode ser refletido sem peso excessivo por «também».
  naturalness: «Entronizou, acima de todas as coisas, a mente...» é compreensível, mas a intercalação torna a frase menos fluida e «acima de» pode sugerir sobretudo posição espacial ou hierárquica. «Entronizou ... a mente santa e governante sobre todas as coisas» mantém a metáfora e soa mais natural em português moderno.
  terminology: «Mente santa e governante» é uma boa solução para τὸν ἱερὸν ἡγεμόνα νοῦν e preserva a alternativa «razão» na nota. «Por meio dos sentidos» é apropriado para διὰ τῶν αἰσθητηρίων, sem decidir indevidamente entre órgãos e faculdades perceptivas.
