  text: And at that time he also enthroned the holy ruling mind over all things through the senses;[a]
translation:
  language: pt
  text: E então também entronizou, por meio dos sentidos, a mente santa e governante sobre todas as coisas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a santa razão governante”. O grego νοῦς pode designar a faculdade racional e moral, não apenas o intelecto em sentido moderno e restrito.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τηνικαῦτα
  choice: então
  rationale: O advérbio temporal assinala a sequência do argumento. “Então” é natural e evita sugerir um período longo ou precisamente delimitado.
- source_word: περὶ πάντων
  choice: acima de todas as coisas
  rationale: Junto de ἐνεθρόνισεν, a expressão indica posição de autoridade ou domínio. “Acima de todas as coisas” preserva essa relação sem reduzir a frase ao sentido meramente temático de “a respeito de”.
- source_word: τὸν ἱερὸν ἡγεμόνα νοῦν
  choice: a mente santa e governante
  rationale: νοῦς designa aqui a faculdade racional e moral; “mente” é clara em português e conserva uma amplitude maior que “intelecto”. ἡγεμόνα caracteriza essa mente como dirigente, e ἱερόν mantém a qualificação religiosa e moral de “santa”.
- source_word: διὰ τῶν αἰσθητηρίων
  choice: por meio dos sentidos
  rationale: A expressão pode designar os órgãos ou as faculdades da percepção. “Por meio dos sentidos” comunica com naturalidade a força instrumental de διά e preserva a abrangência do grego.
- source_word: ἐνεθρόνισεν
  choice: entronizou
  rationale: O verbo apresenta a instalação em autoridade mediante uma imagem régia vívida, conservada diretamente por “entronizou”.
theological_decisions:
- issue: Sentido antropológico de νοῦς como faculdade moral-racional
  choice: mente
  alternative: razão
  rationale: Em 4 Macabeus, νοῦς exerce domínio racional sobre as paixões. “Mente” é acessível e suficientemente ampla; a nota registra “razão” para tornar explícita a dimensão racional sem impor ao texto um tecnicismo filosófico exclusivo.
- issue: Alcance de περὶ πάντων na imagem de entronização
  choice: acima de todas as coisas
  alternative: a respeito de todas as coisas
  rationale: A construção com “entronizou” favorece o sentido de autoridade abrangente. A tradução mantém a imagem de governo, sem especificar além do grego quais realidades estão sujeitas à mente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A metáfora régia foi preservada em “entronizou”; “por meio dos sentidos” mantém a possível referência tanto às faculdades quanto aos órgãos da percepção.
