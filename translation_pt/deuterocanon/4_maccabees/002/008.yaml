base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/008.yaml
  text: Therefore[a], even if someone is money-loving, by living under the law he compels his own way of life, lending to those in need without interest, and when the seventh year arrives[b], canceling the debt.
translation:
  language: pt
  text: 'Portanto, mesmo que alguém ame o dinheiro, ao viver segundo a Lei, reprime sua própria inclinação: empresta aos necessitados sem cobrar juros e, quando chega o sétimo ano[a], abre mão do valor emprestado[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «quando chegam as semanas» ou «os grupos de sete». A expressão provavelmente alude ao ciclo legal de remissão das dívidas no sétimo ano.
    reason: cross_reference
  - marker: b
    text: Ou «cancela a dívida». O particípio grego também pode enfatizar que o credor suporta a perda decorrente de abrir mão do pagamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτίκα γοῦν
  choice: Portanto
  rationale: A expressão introduz uma consequência imediata do argumento anterior; «portanto» transmite com naturalidade sua força inferencial.
- source_word: τῷ νόμῳ πολιτευόμενος
  choice: ao viver segundo a Lei
  rationale: πολιτεύομαι descreve a conduta ou o modo de viver, e o dativo indica que a Lei rege essa vida. A formulação é natural e não sugere apenas uma condição jurídica abstrata.
- source_word: κἂν φιλάργυρός τις εἴη
  choice: ainda que alguém ame o dinheiro
  rationale: Preserva a concessão de κἄν e a imagem lexical de φιλάργυρος, evitando reduzir o termo ao mais interpretativo «ganancioso».
- source_word: βιάζεται τὸν ἑαυτοῦ τρόπον
  choice: força sua própria maneira de agir
  rationale: Mantém a força de βιάζεται e entende τρόπος como disposição ou padrão de conduta; a pessoa obriga a própria conduta a contrariar sua inclinação.
- source_word: τοῖς δεομένοις
  choice: aos necessitados
  rationale: No contexto de empréstimo e assistência, refere-se naturalmente aos que estão em necessidade.
- source_word: δανείζων χωρὶς τόκων
  choice: empresta ... sem cobrar juros
  rationale: Expressa em português corrente tanto o ato de emprestar como a ausência de juros, sem o sentido moderno mais estreito que «usura» poderia sugerir.
- source_word: τῶν ἑβδομάδων ἐνστασῶν
  choice: quando chega o período dos sete
  rationale: Conserva no texto a expressão comprimida e ambígua do grego, cujo plural ἑβδομάδων significa literalmente «semanas» ou «grupos de sete», enquanto a nota explica a provável alusão ao ciclo legal de remissão.
- source_word: χρεοκοπούμενος
  choice: abre mão do valor emprestado
  rationale: O particípio pode destacar a perda suportada pelo credor. Esta tradução comunica a renúncia ao recebimento sem resolver silenciosamente se o foco recai sobre o cancelamento jurídico da dívida ou sobre a perda financeira.
theological_decisions:
- issue: Alusão à remissão sabática em τῶν ἑβδομάδων ἐνστασῶν χρεοκοπούμενος
  choice: Manter no texto a imagem do «período dos sete» e explicar em nota a provável referência ao sétimo ano.
  alternative: Traduzir diretamente «quando chega o sétimo ano, cancela a dívida».
  rationale: O contexto legal favorece fortemente a remissão das dívidas no sétimo ano, mas o grego diz literalmente «quando chegam as semanas/os setes» e o particípio pode enfatizar a perda sofrida. Texto e notas preservam essa tensão em vez de transformar a interpretação contextual na única forma possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Lei» recebe inicial maiúscula por designar aqui a Lei que regula a conduta mencionada. A construção preserva a progressão do grego e usa notas para esclarecer, sem apagar, sua formulação incomum.
