  text: And reason is seen to prevail not only over the frenzy that drives pleasure[a], but also over every desire.
translation:
  language: pt
  text: E vê-se que a razão prevalece não apenas sobre o frenesi que impele à busca do prazer[a], mas também sobre todo desejo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o aguilhão da entrega aos prazeres» ou «o impulso enlouquecedor da busca do prazer». A expressão grega é excepcionalmente condensada e metafórica.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λογισμός
  choice: a razão
  rationale: No argumento de 4 Macabeus, designa a faculdade racional moralmente disciplinada; «a razão» preserva de modo claro e conciso sua força filosófica.
- source_word: φαίνεται
  choice: vê-se
  rationale: Expressa aquilo que se mostra evidente sem transformar a afirmação numa demonstração formal; mantém também a nuance perceptiva do grego.
- source_word: ἐπικρατεῖν
  choice: prevalece sobre
  rationale: Comunica superioridade e domínio efetivo, mantendo o registro filosófico e uma construção natural em português.
- source_word: τὴν τῆς ἡδυπαθείας οἰστρηλασίαν
  choice: o frenesi que impele à busca do prazer
  rationale: A expressão grega é rara, comprimida e metafórica. A tradução preserva tanto a agitação quase enlouquecedora de οἰστρηλασία quanto a orientação de ἡδυπάθεια para a busca indulgente do prazer.
- source_word: πάσης ἐπιθυμίας
  choice: todo desejo
  rationale: Preserva a amplitude universal de πάσης e o sentido amplo de ἐπιθυμία, sem restringi-lo a uma classe específica de desejos.
theological_decisions:
- issue: Afirmação antropológico-filosófica sobre o domínio da razão sobre as paixões
  choice: a razão é apresentada como prevalecendo sobre o impulso voltado ao prazer e sobre todo desejo
  alternative: a razão apenas parece prevalecer, ou domina somente certos desejos
  rationale: A formulação conserva a tese central do livro sobre a superioridade da razão disciplinada, mas mantém φαίνεται por meio de «vê-se», sem importar categorias doutrinárias posteriores nem eliminar a nuance do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Impele» mantém o tom literário sem ser arcaico; a nota conserva alternativas para a metáfora incomum do grego.
