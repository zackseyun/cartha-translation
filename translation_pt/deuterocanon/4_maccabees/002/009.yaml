base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/009.yaml
  text: 'And even if someone is stingy[a], he is restrained by the law through reason, neither gleaning the unharvested crops nor going over the vineyards again. And in other matters as well it is possible to recognize this: that reason is the master over the passions.'
translation:
  language: pt
  text: 'Mesmo que alguém seja avarento, é refreado pela lei mediante a razão: não colhe o que ficou por colher nas searas nem rebusca as vinhas.[a] Também em outros casos se pode reconhecer isto: a razão domina as paixões.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou seja, não recolhe o que ficou por colher nas searas nem volta a percorrer as vinhas para colher o que restou.
    reason: As duas expressões gregas são termos agrícolas; a segunda, em particular, refere-se à coleta posterior do que restou nas vinhas.
lexical_decisions:
- source_word: φειδωλός
  choice: avarento
  rationale: No contexto, descreve a inclinação de reter para si ou obter o máximo possível. “Avarento” conserva a conotação ética negativa sem sugerir a qualidade positiva que “econômico” ou “poupado” poderia ter.
- source_word: κρατεῖται
  choice: é refreado
  rationale: O passivo indica que a pessoa é mantida sob controle pela lei. “É refreado” é natural em português e preserva a ideia de contenção moral.
- source_word: διὰ τὸν λογισμόν
  choice: mediante a razão
  rationale: λογισμός é um termo central em 4 Macabeus para a faculdade racional que governa os impulsos. “Mediante a razão” expressa o meio pelo qual a lei refreia a pessoa.
- source_word: ἐπικαρπούμενος τοὺς ἀμήτους
  choice: não recolhe as sobras das searas
  rationale: A expressão agrícola aponta para a coleta do produto restante da colheita. Esta formulação torna clara a alusão às leis que exigiam deixar parte da produção, sem afirmar mais precisão técnica do que o grego permite.
- source_word: ἐπιρρωγολογούμενος τοὺς ἀμπελῶνας
  choice: nem rebusca as vinhas
  rationale: O verbo raro se refere a voltar à vinha para recolher as uvas que restaram. “Rebuscar” é o termo agrícola português conciso para essa segunda coleta.
- source_word: ἐπὶ τῶν ἑτέρων
  choice: Também em outros casos
  rationale: A expressão amplia o argumento para além do exemplo agrícola e fica clara em português corrente.
- source_word: ἐπιγνῶναι
  choice: se pode reconhecer
  rationale: O infinitivo indica perceber ou constatar a conclusão a partir de outros exemplos.
- source_word: παθῶν
  choice: as paixões
  rationale: Neste contexto filosófico, πάθη designa impulsos ou afetos que precisam ser governados. “Paixões” preserva o sentido moral-filosófico sem reduzi-lo apenas a emoções ou desejos.
- source_word: ὁ λογισμὸς κρατῶν
  choice: a razão domina
  rationale: A formulação direta conserva a força governante de κρατῶν e cria uma correspondência clara com a pessoa que antes é refreada pela lei.
theological_decisions:
- issue: Força filosófico-antropológica de λογισμός em 4 Macabeus
  choice: razão
  alternative: juízo racional; mente racional
  rationale: “Razão” mantém o fio temático do livro, no qual a faculdade racional governa as paixões, sem importar categorias filosóficas posteriores mais específicas.
- issue: Força ética de πάθη
  choice: paixões
  alternative: emoções; desejos; impulsos
  rationale: O texto trata de afetos e impulsos sujeitos ao governo da razão, não condena indistintamente todo sentimento. “Paixões” preserva essa tensão e o vocabulário filosófico do argumento.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. “Searas” conserva o cenário agrícola bíblico sem ser obscuro; “rebuscar” é preciso, e a nota esclarece seu sentido. O marcador [a] foi colocado junto às práticas agrícolas que a nota explica.
