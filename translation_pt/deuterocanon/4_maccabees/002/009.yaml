revisions:
- from: 'Mesmo que alguém seja avarento, é refreado pela lei mediante a razão: não recolhe as sobras das searas nem rebusca as vinhas.[a] Também em outros casos se pode reconhecer isto: a razão domina as paixões.'
  to: 'Mesmo que alguém seja avarento, é refreado pela lei mediante a razão: não colhe o que ficou por colher nas searas nem rebusca as vinhas.[a] Também em outros casos se pode reconhecer isto: a razão domina as paixões.'
  rationale: A revisão substitui uma formulação que apresentava os ἀμήτους como “sobras” por outra que traduz diretamente a ideia de produto não colhido. Também ajusta a nota para não tratar as duas expressões como se ambas especificassem igualmente uma coleta posterior à colheita principal. O restante do texto permanece fiel, natural e terminologicamente consistente.
