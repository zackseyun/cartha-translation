  text: For the law says[a], then, “You shall not desire your neighbor’s wife, nor anything that belongs to your neighbor.”
translation:
  language: pt
  text: 'Pois a lei diz: “Não cobice a esposa do seu próximo, nem coisa alguma que pertença ao seu próximo.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
