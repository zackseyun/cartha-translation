lexical_decisions:
- source_word: λέγει γοῦν
  choice: Pois ... diz
  rationale: O presente λέγει introduz a citação, e γοῦν tem aqui força confirmatória ou inferencial. “Pois” liga naturalmente o mandamento ao argumento anterior sem tornar a conclusão excessivamente rígida.
- source_word: ὁ νόμος
  choice: a lei
  rationale: Refere-se à lei mosaica enquanto fonte do mandamento citado. A minúscula é natural em português neste contexto, sem impedir que o leitor reconheça a referência às Escrituras.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: Não cobice
  rationale: No contexto do mandamento sobre aquilo que pertence ao próximo, “cobiçar” expressa com precisão o desejo indevido e corresponde ao vocabulário bíblico corrente. Também mantém a relação temática com o domínio dos desejos discutido na obra.
- source_word: τὴν γυναῖκα τοῦ πλησίον σου
  choice: a mulher do seu próximo
  rationale: γυνή pode significar “mulher” ou “esposa”; a construção possessiva, dentro da tradição do Decálogo, indica a esposa do próximo. “A mulher do seu próximo” é uma formulação bíblica clara e corrente em português.
- source_word: οὐδὲ ὅσα τῷ πλησίον σού ἐστιν
  choice: nem coisa alguma que pertença ao seu próximo
  rationale: O neutro plural ὅσα tem sentido abrangente, traduzido naturalmente por “coisa alguma”. A construção com εἰμί e dativo expressa posse, daí “pertença ao seu próximo”.
theological_decisions:
- issue: Sentido de ἐπιθυμέω na citação do Decálogo
  choice: Não cobice
  alternative: Não deseje
  rationale: O verbo pode designar simplesmente desejar, mas, nesta proibição dirigida ao que pertence ao próximo, “cobiçar” comunica o caráter moralmente indevido do desejo sem acrescentar uma doutrina particular. “Não deseje” preservaria mais diretamente a amplitude lexical e a ligação verbal com o tema das paixões, porém em português poderia soar como proibição de todo desejo.
- issue: Sentido marital de γυνή
  choice: a mulher do seu próximo
  alternative: a esposa do seu próximo
  rationale: O contexto do mandamento torna inequívoca a relação conjugal. A opção “mulher” conserva a formulação tradicional e a amplitude formal do substantivo grego, enquanto “esposa” explicitaria a relação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção de sabor bíblico sem arcaísmo. Emprega-se “seu próximo” conforme o uso brasileiro corrente; o contexto evita ambiguidade relevante. Não há marcadores de nota porque nenhuma nota é necessária para a publicação deste versículo.
