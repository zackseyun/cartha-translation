base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/001.yaml
  text: And Tobit his father counted each day[a]; and when the days of the journey were completed and they were not coming back[b],
translation:
  language: pt
  text: Tobit, seu pai, contava os dias[b]. Quando se completaram os dias de viagem e eles ainda não voltavam[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ainda não chegavam”. O imperfeito grego pode indicar que, mesmo depois de passado o tempo esperado para a viagem, eles ainda não tinham chegado. No contexto, trata-se da volta para casa.'
    reason: lexical_alternative
  - marker: b
    text: A tradição semítica paralela amplia a cena, mencionando a contagem dos dias e das noites e descrevendo a aflição dos pais. A tradução principal segue aqui a forma grega mais breve.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλογίζετο
  choice: contava
  rationale: No contexto de “cada dia”, o verbo indica calcular ou contar a passagem dos dias, não uma reflexão abstrata.
- source_word: ἑκάστης ἡμέρας
  choice: os dias, um por um
  rationale: 'Expressa com naturalidade a força distributiva da locução grega: Tobit acompanhava a passagem de cada dia.'
- source_word: ἐπληρώθησαν
  choice: se completaram
  rationale: Aplicado a um período de tempo, indica que os dias previstos chegaram ao fim, sem a possível conotação teológica de “se cumpriram”.
- source_word: αἱ ἡμέραι τῆς πορείας
  choice: os dias da viagem
  rationale: Mantém de perto a construção grega e aponta para a duração esperada da viagem.
- source_word: οὐκ ἤρχοντο
  choice: eles ainda não chegavam
  rationale: O imperfeito retrata uma chegada continuadamente esperada que não ocorria. “Ainda” torna explícita essa expectativa sem converter o verbo em um aoristo pontual.
- source_word: Καὶ
  choice: Quando
  rationale: Na segunda oração, a combinação καὶ ὡς introduz naturalmente a circunstância temporal. O primeiro καί foi omitido por não ser necessário no início isolado do versículo em português.
- source_word: Τωβεὶτ ὁ πατὴρ αὐτοῦ
  choice: Tobit, o pai dele
  rationale: Preserva a aposição do grego com pontuação natural em português.
