base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/011.yaml
  text: Then Raguel rose and gave him Sarah his wife[a], and half of his possessions—servants and livestock and silver—and after blessing them he sent them away, saying, “May the God of heaven prosper you, children[b], before I die.”
translation:
  language: pt
  text: 'Então Raguel se levantou e entregou-lhe Sara, sua esposa, e metade de seus bens — servos[a], animais de criação e prata. Depois de abençoá-los, mandou-os partir, dizendo: “Que o Deus do céu faça vocês prosperarem[b], filhos, antes de eu morrer.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escravos”; o grego diz literalmente “corpos” em uma lista de bens.
    reason: lexical_alternative
  - marker: b
    text: Ou “O Deus do céu fará vocês prosperarem”; a forma futura grega pode ser entendida como uma declaração, embora aqui funcione naturalmente como bênção.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναστὰς
  choice: se levantou
  rationale: O particípio aoristo de ἀνίστημι introduz a ação seguinte; “se levantou” é natural na narrativa e mantém a imagem do grego.
- source_word: ἔδωκεν αὐτῷ Σάρραν τὴν γυναῖκα αὐτοῦ
  choice: entregou-lhe Sara, sua esposa
  rationale: “Entregou-lhe” comunica o ato familiar e formal de confiar a esposa ao marido sem sugerir que Sara fosse parte dos bens enumerados em seguida.
- source_word: τὰ ἥμισυ τῶν ὑπαρχόντων
  choice: metade de seus bens
  rationale: ὑπάρχοντα designa aquilo que alguém possui; “bens” abrange adequadamente as categorias especificadas depois.
- source_word: σώματα
  choice: servos
  rationale: Literalmente “corpos”; em um inventário de propriedade, o termo designa pessoas em condição servil. “Servos” mantém alguma indeterminação jurídica, enquanto a nota registra explicitamente a possível tradução “escravos” e o sentido literal.
- source_word: κτήνη
  choice: animais de criação
  rationale: O termo abrange animais domésticos mantidos como propriedade; esta formulação evita restringi-lo apenas a gado bovino.
- source_word: ἀργύριον
  choice: prata
  rationale: Preserva o referente concreto do grego, embora a prata também pudesse funcionar como dinheiro.
- source_word: εὐλογήσας αὐτοὺς
  choice: depois de abençoá-los
  rationale: Expressa com naturalidade a ação anterior ao envio indicada pelo particípio aoristo.
- source_word: ἐξαπέστειλεν
  choice: mandou-os partir
  rationale: Comunica que Raguel os despediu para seguirem viagem, sem o possível tom hostil de “mandou-os embora”.
- source_word: Εὐοδώσει ὑμᾶς
  choice: Que ... faça vocês prosperarem
  rationale: No contexto de uma bênção de despedida, a forma futura funciona naturalmente como desejo ou invocação. A nota preserva a leitura formalmente preditiva.
- source_word: τέκνα
  choice: filhos
  rationale: Vocativo afetuoso e idiomático em português; não se acrescenta o possessivo “meus”, ausente do grego.
- source_word: ὁ θεὸς τοῦ οὐρανοῦ
  choice: o Deus do céu
  rationale: Mantém o título reverencial judaico em forma consagrada e clara.
- source_word: πρὸ τοῦ μὲ ἀποθανεῖν
  choice: antes de eu morrer
  rationale: Forma portuguesa natural para a construção infinitiva, com o sujeito recuperado do falante, Raguel.
theological_decisions:
- issue: Valor da forma futura Εὐοδώσει em uma fórmula de bênção
  choice: 'Desejo ou oração: “Que o Deus do céu faça vocês prosperarem”'
  alternative: 'Predição: “O Deus do céu fará vocês prosperarem”'
  rationale: A situação de bênção e despedida favorece a força optativa, mas o futuro grego também permite leitura preditiva; essa ambiguidade é preservada em nota.
- issue: Sentido social de σώματα no inventário de bens
  choice: “servos” no texto, com explicação em nota
  alternative: “escravos” ou, literalmente, “corpos”
  rationale: O contexto trata pessoas como parte do patrimônio, mas o substantivo não especifica por si só a categoria jurídica com a precisão de δοῦλοι. A nota evita ocultar a realidade de escravização e preserva a forma literal incomum.
translation_notes:
  register: Português atual, digno e narrativamente fluente, com boa legibilidade brasileira e vocabulário amplamente compreensível. A colocação pronominal conserva um tom literário moderado, enquanto “vocês” evita uma forma excessivamente lusitana ou arcaica. Os travessões esclarecem que a enumeração especifica os bens, não Sara.
