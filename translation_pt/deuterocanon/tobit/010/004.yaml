  yaml_path: translation/deuterocanon/tobit/010/004.yaml
  text: Then his wife said to him[a], “The child has perished, because he has been delayed.” And she began to mourn for him and said,
translation:
  language: pt
  text: 'Então sua mulher lhe disse: “O menino morreu, pois está demorando demais.” E começou a lamentar por ele[a] e disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego repete “ele” (“por ele, ele”), talvez por ênfase ou por repetição de copista; a tradução apresenta a expressão de modo natural em português.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπώλετο
  choice: morreu
  rationale: No contexto, a mãe conclui que o filho está morto e passa a pranteá-lo. “Morreu” transmite naturalmente em português a força contextual de ἀπόλλυμι sem especificar a maneira da morte.
- source_word: τὸ παιδίον
  choice: o menino
  rationale: Embora παιδίον também possa ser “a criança”, Tobias já viaja como jovem; “o menino” preserva o afeto materno e soa natural em português.
- source_word: διότι κεχρόνικεν
  choice: pois está demorando demais
  rationale: O perfeito de χρονίζω expressa uma demora que se prolongou até o presente. Esta formulação comunica tanto a duração excessiva quanto o raciocínio angustiado da mãe, sem sugerir necessariamente que um agente externo o deteve.
- source_word: ἤρξατο θρηνεῖν
  choice: começou a lamentar
  rationale: A construção indica o início do pranto ou lamento por alguém que se presume morto. “Lamentar por ele” é corrente e digno.
- source_word: αὐτὸν αὐτὸν
  choice: por ele
  rationale: A repetição transmitida de αὐτόν é pouco natural no corpo do texto português e pode ser enfática ou uma duplicação de copista; a tradução a suaviza e a registra em nota.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A fala preserva a conclusão abrupta e angustiada da mãe; “está demorando demais” evita o artificial “foi atrasado” e mantém o valor durativo do verbo grego.
