  text: Then Tobias said to Raguel[a], “Send me away, because my father and my mother no longer expect to see me.”
translation:
  language: pt
  text: 'Então Tobias disse a Raguel: “Deixe-me partir, pois meu pai e minha mãe já não esperam[a] me ver.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “já não têm esperança de me ver”. O verbo grego pode indicar tanto expectativa quanto esperança.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Então ... disse
  rationale: δέ funciona como conexão narrativa leve; “Então” expressa a progressão do relato sem introduzir contraste indevido.
- source_word: Τωβείας
  choice: Tobias
  rationale: Forma tradicional e amplamente reconhecida em português para o nome grego Τωβείας.
- source_word: τῷ Ῥαγουὴλ
  choice: a Raguel
  rationale: O dativo indica o destinatário da fala; “Raguel” é a forma portuguesa tradicional do nome.
- source_word: Ἐξαπόστειλόν με
  choice: Deixe-me partir
  rationale: O imperativo pede que Raguel permita e providencie a partida. A formulação é natural em português e preserva sua agência, sem a possível conotação negativa de “mande-me embora”.
- source_word: ὅτι
  choice: pois
  rationale: Introduz a razão do pedido de modo claro e natural no discurso direto.
- source_word: ὁ πατήρ μου καὶ ἡ μήτηρ μου
  choice: meu pai e minha mãe
  rationale: Mantém a menção explícita de ambos os pais, em vez de condensá-la em “meus pais”.
- source_word: οὐκέτι
  choice: já não
  rationale: Expressa naturalmente em português a cessação temporal indicada pelo grego.
- source_word: ἐλπίζουσιν
  choice: esperam
  rationale: O verbo ἐλπίζω pode indicar tanto esperança quanto expectativa. “Esperam” conserva em português essa sobreposição sem resolver indevidamente a nuance.
- source_word: ὄψεσθαί με
  choice: me ver
  rationale: Tradução idiomática do infinitivo futuro dependente de ἐλπίζουσιν.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. “Deixe-me partir” evita a conotação de expulsão que “mande-me embora” poderia sugerir. A nota preserva a ambiguidade lexical de ἐλπίζουσιν.
