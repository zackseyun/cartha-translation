lexical_decisions:
- source_word: λέγει
  choice: disse
  rationale: O grego emprega o presente histórico, literalmente «diz». Em narrativa, o português moderno normalmente usa o pretérito perfeito, sem alterar o sentido.
- source_word: Ἐξαπόστειλόν
  choice: Manda-me de volta
  rationale: O imperativo de ἐξαποστέλλω expressa mandar ou enviar alguém para fora ou para longe. «Manda-me de volta» é natural no contexto e explicita o retorno sugerido pela ida ao pai, embora «de volta» não esteja lexicalmente expresso no verbo isolado.
- source_word: πρὸς τὸν πατέρα μου
  choice: para meu pai
  rationale: πρός com acusativo indica movimento em direção a uma pessoa. A tradução evita acrescentar «casa», elemento ausente do grego.
- source_word: Τωβείας
  choice: Tobias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome pessoal grego Τωβείας.
