base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/012.yaml
  text: And he said to his daughter[a], “Honor your parents-in-law; they are now your parents. May I hear a good report about you.” And he kissed her. And Edna said to Tobiah, “Beloved brother, may the Lord of heaven restore you, and may he grant me to see children from you and from Sarah my daughter, so that I may rejoice before the Lord. And look, I entrust my daughter to you as a deposit[b]; do not grieve her.”
translation:
  language: pt
  text: 'E ele disse à sua filha: “Honre seu sogro e sua sogra; agora eles são seus pais. Que eu ouça boas notícias a seu respeito”. E a beijou. Edna disse a Tobias: “Irmão amado, que o Senhor do céu restaure você[a] e me conceda ver filhos seus com Sara, minha filha, para que eu me alegre diante do Senhor. E eis que confio minha filha à sua guarda[b]; não a entristeça”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Restaure você” também pode ter o sentido de “faça você voltar em segurança” neste contexto de viagem.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “confio minha filha a você como um depósito”, isto é, como alguém entregue à sua guarda e aos seus cuidados.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίμα
  choice: Honre
  rationale: Preserva o peso ético de τιμάω e expressa o dever familiar com linguagem portuguesa clara e digna.
- source_word: τοὺς πενθερούς σου
  choice: seu sogro e sua sogra
  rationale: Explicita que o plural grego designa os pais do marido, evitando a possível amplitude de “parentes por afinidade”.
- source_word: γονεῖς
  choice: pais
  rationale: Equivalente coletivo direto e natural do substantivo grego.
- source_word: ἀκούσαιμί σου ἀκοὴν καλήν
  choice: Que eu ouça boas notícias a seu respeito
  rationale: Transmite naturalmente o desejo de receber um relato favorável sobre a conduta e o bem-estar dela.
- source_word: ἀδελφὲ ἀγαπητέ
  choice: Irmão amado
  rationale: Mantém tanto o tratamento familiar quanto o tom afetuoso do grego.
- source_word: ἀποκαταστήσει σε
  choice: restaure você
  rationale: Conserva a amplitude do verbo, que pode indicar restauração do bem-estar ou retorno seguro, sem escolher silenciosamente apenas um sentido.
- source_word: ὁ κύριος τοῦ οὐρανοῦ
  choice: o Senhor do céu
  rationale: Reproduz de modo reverente e direto o título divino genitivo.
- source_word: δῴη μοι ἰδεῖν σου παιδία ἐκ Σάρρας τῆς θυγατρός μου
  choice: me conceda ver filhos seus com Sara, minha filha
  rationale: Expressa em português natural a descendência de Tobias proveniente de Sara, sem introduzir uma formulação biologicamente unilateral.
- source_word: ἵνα εὐφρανθῶ ἐνώπιον τοῦ κυρίου
  choice: para que eu me alegre diante do Senhor
  rationale: Mantém a finalidade e a orientação religiosa formal da expressão grega.
- source_word: παρατίθεμαί σοι ... ἐν παρακαταθήκῃ
  choice: confio minha filha à sua guarda
  rationale: Comunica com naturalidade o ato de entregar alguém aos cuidados de outro, enquanto a nota preserva a metáfora jurídica de depósito.
- source_word: μὴ λυπήσῃς αὐτήν
  choice: não a entristeça
  rationale: Mantém a construção causativa e o sentido afetivo de λυπέω de forma concisa.
theological_decisions:
- issue: Tradução de κύριος em um título divino grego deuterocanônico
  choice: Senhor
  alternative: SENHOR; Soberano
  rationale: “Senhor” identifica com reverência o título divino e corresponde diretamente a κύριος, sem acrescentar uma distinção tipográfica não presente no texto grego.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Empregou-se “seu sogro e sua sogra” para precisão cotidiana; “eis que” preserva a solenidade moderada de ἰδού. As notas mantêm as ambiguidades de ἀποκαθίστημι e a imagem jurídica de παρακαταθήκη.
