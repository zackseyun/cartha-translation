base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/002.yaml
  text: he said[a], “Could it be that he has been delayed? Or could it be that Gabael has died, and no one is giving him the money?”
translation:
  language: pt
  text: 'ele disse: “Será que ele foi humilhado?[a] Ou será que Gabael morreu e ninguém lhe entrega o dinheiro?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “foi envergonhado” ou “foi desonrado”. A expressão pode indicar algum revés humilhante ou uma tentativa frustrada, mas a circunstância exata não é informada.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μή ποτε
  choice: Será que
  rationale: Introduz perguntas retóricas marcadas por apreensão e incerteza, de modo natural em português.
- source_word: κατῄσχυνται
  choice: sofreu algum vexame
  rationale: Preserva a ideia de vergonha ou desonra expressa pelo perfeito passivo de καταισχύνω, sem definir qual teria sido o revés; a nota registra a forma mais literal.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: Verte diretamente o aoristo de ἀποθνῄσκω; em português, o pretérito perfeito expressa naturalmente a morte temida e seu resultado presente.
- source_word: Γαβαήλ
  choice: Gabael
  rationale: Translitera o nome grego sem confundi-lo com o nome distinto Gabriel.
- source_word: δίδωσιν αὐτῷ τὸ ἀργύριον
  choice: ninguém lhe entrega o dinheiro
  rationale: ἀργύριον designa aqui os fundos depositados; “dinheiro” é mais claro que “prata”, e “entrega” preserva o sentido de δίδωσιν sem especificar indevidamente pagamento ou restituição.
