translation_notes:
  register: Português atual, digno e de ampla compreensão, com fluidez brasileira. A repetição de “Será que” conserva a ansiedade das duas perguntas; “sofreu algum vexame” mantém a ambiguidade do grego sem importar a ideia específica de atraso.
