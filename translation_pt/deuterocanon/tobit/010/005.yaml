translation:
  language: pt
  text: Será que eu não me preocupo, meu filho, por ter deixado você partir, luz dos meus olhos?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Será que não me importa, meu filho, ter deixado você partir, luz dos meus olhos?” A formulação grega é uma pergunta retórica que expressa profunda aflição pessoal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ μέλει μοι
  choice: Não me importo
  rationale: Mantém a forma de pergunta retórica do grego e expressa a profunda preocupação pessoal da personagem; no conjunto da frase, não comunica indiferença, mas uma negação indignada dessa ideia.
- source_word: τέκνον
  choice: meu filho
  rationale: O termo é uma forma terna de tratamento, literalmente “criança/filho”. No contexto de Tobias, “meu filho” soa natural em português e explicita a relação afetiva sem alterar o referente.
- source_word: ἀφῆκά σε
  choice: ter deixado você partir
  rationale: ἀφίημι, neste contexto, indica permitir que alguém parta. A construção com infinitivo composto apresenta a partida como fato consumado que ainda causa sofrimento.
- source_word: τὸ φῶς τῶν ὀφθαλμῶν μου
  choice: a luz dos meus olhos
  rationale: Preserva a metáfora afetiva do grego, clara e expressiva em português, em vez de reduzi-la a uma paráfrase como “meu querido”.
