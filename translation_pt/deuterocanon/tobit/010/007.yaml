    rationale: Embora a nota mencione “está perdido”, o texto principal afirma morte de modo inequívoco. Uma tradução como “Meu menino está perdido” preserva a possibilidade de perda e o desespero da fala sem apresentá-la como confirmação do narrador.
  - severity: low
    issue: “que Raguel havia jurado fazê-lo passar ali” é pouco natural e pode sugerir coerção.
    rationale: A construção grega significa que Raguel jurara que Tobias passaria/permaneceria ali durante o período. Uma oração com “que ele passaria ali” comunica isso claramente.
