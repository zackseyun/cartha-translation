base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/007.yaml
  text: And she said to him[a], “Be quiet; do not mislead me. My child has perished.” And every day she would go out to the road by which he had departed, and by day she would eat no bread, and at night she did not cease mourning for Tobias her son, until the fourteen days of the wedding feast were completed[b], which Raguel had sworn that he should spend there.
translation:
  language: pt
  text: 'E disse-lhe: “Cale-se; não me iluda. Meu menino está perdido[a].” Todos os dias, ela saía para a estrada pela qual ele tinha partido. Durante o dia, não comia pão; e, à noite, não parava de lamentar por Tobias, seu filho, até que terminaram os catorze dias da festa de casamento[b], que Raguel havia jurado que ele passaria ali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meu menino morreu” ou “pereceu”. O verbo grego pode indicar tanto perda quanto perecimento; aqui, as palavras expressam a conclusão temerosa de quem fala, não uma confirmação do narrador.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os catorze dias do casamento”; a expressão se refere ao período das celebrações do casamento.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῇ
  choice: E disse-lhe
  rationale: O pronome grego significa literalmente “a ela”, embora o contexto e a tradição textual consultada entendam Ana como quem fala. A construção portuguesa “disse-lhe” evita impor no próprio texto a identidade do interlocutor e preserva a tensão da forma grega fornecida.
- source_word: Σίγα
  choice: Cale-se
  rationale: Imperativo abrupto que ordena silêncio; a forma é clara, atual e mantém a força da resposta.
- source_word: μὴ πλάνα με
  choice: não me iluda
  rationale: No contexto, trata-se de rejeitar uma esperança que a pessoa considera falsa. “Não me iluda” é natural em português e não exige a ideia de fraude deliberada.
- source_word: τὸ παιδίον μου
  choice: meu menino
  rationale: Preserva o tom afetivo e materno do diminutivo, além de evitar repetir imediatamente “meu filho”, expressão usada de modo explícito mais adiante.
- source_word: ἀπώλετο
  choice: morreu
  rationale: No contexto do lamento, expressa a conclusão temerosa de que Tobias pereceu. A nota conserva o sentido alternativo de estar perdido e esclarece que não se trata de confirmação do narrador.
- source_word: καθʼ ἡμέραν
  choice: Todos os dias
  rationale: Equivalente temporal corrente que comunica a ação habitual expressa pelo imperfeito.
- source_word: εἰς τὴν ὁδὸν ἔξω οἵας ἀπῆλθεν
  choice: saía para a estrada pela qual ele tinha partido
  rationale: Reproduz a imagem de ela ir repetidamente à rota tomada por Tobias, em português natural.
- source_word: ἡμέρας τε ἄρτον οὐκ ἤσθιεν
  choice: Durante o dia, não comia pão
  rationale: Mantém o substantivo concreto “pão” em vez de generalizá-lo como comida e preserva o contraste com as noites.
- source_word: τὰς δὲ νύκτας οὐ διέλιμπανεν θρηνοῦσα
  choice: à noite, não parava de lamentar
  rationale: Expressa de maneira natural a continuidade enfática do imperfeito com o particípio.
- source_word: αἱ δέκα τέσσαρες ἡμέραι τοῦ γάμου
  choice: os catorze dias da festa de casamento
  rationale: O contexto indica o período de celebração das núpcias, não apenas o estado matrimonial.
- source_word: ἃς ὤμοσεν Ῥαγουὴλ ποιῆσαι αὐτὸν ἐκεῖ
  choice: que Raguel havia jurado fazê-lo passar ali
  rationale: Torna legível a construção grega comprimida, mantendo a ideia de que Raguel jurara que Tobias permaneceria ali durante esse período.
