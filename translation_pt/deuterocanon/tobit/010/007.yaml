  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi suavemente reorganizada em frases menores para clareza narrativa. O tratamento “cale-se” mantém a brusquidão sem soar coloquial demais; “disse-lhe” conserva a forma do pronome grego sem resolver silenciosamente a dificuldade contextual.
