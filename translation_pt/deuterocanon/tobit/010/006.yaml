lexical_decisions:
- source_word: Σίγα
  choice: Fique quieta
  rationale: O imperativo pede silêncio de modo breve e direto. “Fique quieta” preserva essa forma, embora no contexto também tenha função tranquilizadora.
- source_word: μὴ λόγον ἔχε
  choice: não se preocupe
  rationale: A expressão, literalmente “não tenha palavra/assunto”, é idiomática e, no contexto da ansiedade de Ana, comunica naturalmente a ideia de não se preocupar.
- source_word: ὑγίαινε
  choice: Fique bem
  rationale: O imperativo de ὑγιαίνω se relaciona a saúde, integridade e bem-estar. “Fique bem” mantém essa nuance e soa natural em português.
- source_word: λέγει αὐτῇ
  choice: lhe disse
  rationale: O presente histórico grego foi vertido pelo pretérito, conforme o uso narrativo natural em português.
- source_word: Τωβείτ
  choice: Tobit
  rationale: Transliteração tradicional do nome próprio em português.
