  text: And Tobit said to her[a], “Be quiet; do not be anxious. Be well.”
translation:
  language: pt
  text: 'E Tobit lhe disse: “Fique quieta; não se preocupe.[a] Fique bem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego, literalmente: “não tenha palavra/assunto”.'
