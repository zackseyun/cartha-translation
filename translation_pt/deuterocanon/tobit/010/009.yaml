  text: Then his father-in-law said to him[a], “Stay with me, and I will send word to your father, and they will make known to him the things concerning you.”
translation:
  language: pt
  text: 'Então seu sogro lhe disse: “Fique comigo, e mandarei avisar seu pai, e lhe informarão[a] sobre você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego, o verbo está no plural: “e lhe informarão sobre as coisas relativas a você”. O sujeito pode ser indefinido ou referir-se às pessoas enviadas para levar a notícia.'
    reason: O plural de δηλώσουσιν não tem antecedente expresso; a nota preserva essa ambiguidade textual.
lexical_decisions:
- source_word: ὁ πενθερός
  choice: seu sogro
  rationale: πενθερός designa o pai por afinidade; no contexto, Raguel é o sogro de Tobias.
- source_word: Μεῖνον παρʼ ἐμοί
  choice: Fique comigo
  rationale: O imperativo de μένω com παρʼ ἐμοί expressa de modo natural o pedido para permanecer na companhia e na casa do falante.
- source_word: κἀγὼ ἐξαποστελῶ πρὸς τὸν πατέρα σου
  choice: e eu enviarei mensageiros a seu pai
  rationale: Embora o objeto de ἐξαποστελῶ esteja implícito, o plural seguinte, δηλώσουσιν, indica pessoas enviadas; explicitar “mensageiros” produz uma frase clara em português sem alterar o sentido.
- source_word: δηλώσουσιν αὐτῷ
  choice: e eles lhe contarão
  rationale: O plural grego é preservado e tem como referente natural os mensageiros implícitos no verbo anterior. “Contarão” comunica aqui o ato de dar informações.
- source_word: τὰ κατὰ σέ
  choice: como você está
  rationale: A expressão idiomática refere-se à situação da pessoa interpelada. Esta formulação corrente em português transmite o sentido sem o artificialismo de “as coisas a seu respeito”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O tratamento “você” evita regionalismos marcados; “seu sogro” mantém a relação familiar explícita. A construção preserva o plural de δηλώσουσιν ao explicitar os mensageiros subentendidos.
