  text: After these things Tobiah also went on his way[a], blessing God because he had made his journey successful, and he kept blessing Raguel and Edna his wife[b]. And he went on until they came near to Nineveh.
translation:
  language: pt
  text: Depois disso, Tobias seguiu viagem, bendizendo a Deus por ter levado sua jornada a bom termo[a]; e continuava abençoando Raguel e sua esposa Edna. Prosseguiu até que chegaram perto de Nínive.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em grego, literalmente, “fez prosperar o caminho dele”, expressão que significa que Deus concedeu bom êxito à sua jornada.
    reason: lexical_alternative
  - marker: b
    text: 'O grego traz uma construção incomum, com verbo no plural (“aproximaram-se”) e pronome no singular (“dele”). O texto principal apresenta o sentido narrativo aparente: os viajantes chegaram perto de Nínive.'
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Depois disso
  rationale: Expressa com naturalidade a transição temporal e retém a ligação com os acontecimentos anteriores.
- source_word: ἐπορεύετο
  choice: seguiu viagem / Prosseguiu
  rationale: O imperfeito descreve o deslocamento em curso; a variação evita repetição sem perder a ideia de continuidade.
- source_word: εὐλογῶν τὸν θεόν
  choice: bendizendo a Deus
  rationale: Mantém o sentido bíblico de εὐλογέω e o registro religioso, além de conservar a ligação lexical com κατευλόγει.
- source_word: ὅτι εὐώδωσεν τὴν ὁδὸν αὐτοῦ
  choice: por ter levado sua jornada a bom termo
  rationale: Transmite em português atual o idiomatismo de fazer prosperar um caminho, atribuindo a Deus o êxito da viagem.
- source_word: κατευλόγει
  choice: continuava abençoando
  rationale: Reflete o aspecto durativo ou reiterado do imperfeito, bem como a força intensiva possível do verbo composto.
- source_word: Ῥαγουὴλ καὶ Ἔδναν τὴν γυναῖκα αὐτοῦ
  choice: Raguel e Edna, mulher dele
  rationale: A aposição grega identifica Edna como mulher de Raguel. A formulação é clara e evita que o possessivo seja entendido como referência a Tobias.
- source_word: μέχρις οὗ ἤγγισαν αὐτὸν εἰς Νινευή
  choice: até que chegaram perto de Nínive
  rationale: Comunica o sentido narrativo aparente de que o grupo de viajantes se aproximou de Nínive, enquanto a irregularidade ou possível construção transitiva do grego é registrada em nota.
theological_decisions:
- issue: Agente do êxito da jornada
  choice: Deus levou a jornada de Tobias a bom termo
  alternative: Deus fez prosperar o caminho em sentido mais literal, ou favoreceu o empreendimento de modo geral
  rationale: O sujeito de εὐώδωσεν é Deus, e a expressão atribui claramente a ele o bom resultado da viagem, sem ampliar essa afirmação providencial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Bendizendo” e “abençoando” preservam o campo lexical religioso sem soar arcaicos; “levar a bom termo” traduz o idiomatismo de maneira natural. A mudança de singular para plural no fim segue o sentido aparente da narrativa e é explicitada em nota.
