  - severity: low
    issue: “Edna, mulher dele” é menos idiomático que uma aposição possessiva explícita.
    rationale: “Raguel e sua esposa Edna” é mais natural em português e deixa inequívoco que o possessivo se refere a Raguel, conforme a aposição grega.
