  yaml_path: translation/deuterocanon/tobit/005/014.yaml
  text: And he said to him[a], “May you come in health, brother; and do not be angry with me because I sought to learn your tribe and your family. And you indeed turn out to be my brother, from a good and noble lineage. For I knew Ananias and Jathan, the sons of Shemaiah the great, as we used to go together to Jerusalem to worship, bringing the firstborn and the tithes of the produce; and they were not led astray in the error of our brothers. You are from a good root[b], brother.”
translation:
  language: pt
  text: 'E ele lhe disse: “Que você chegue com saúde, irmão![a] Não fique zangado comigo por eu ter procurado saber qual é a sua tribo e a sua família. E acontece que você é meu irmão, de uma linhagem boa e nobre. Pois eu conheci Ananias e Jatã, filhos de Semeias, o Grande. Costumávamos ir juntos a Jerusalém para adorar, levando os animais primogênitos e os dízimos da produção; e eles não se deixaram levar pelo erro dos nossos irmãos.[b] Você vem de uma boa raiz, irmão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Vá com saúde”. O grego diz literalmente “Que você venha/chegue com saúde”, uma fórmula convencional de desejo de bem-estar ou de viagem segura.'
    reason: lexical_alternative
  - marker: b
    text: Aqui, “nossos irmãos” se refere aos parentes ou compatriotas israelitas, não necessariamente apenas a irmãos do sexo masculino.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑγιαίνων ἔλθοις
  choice: Que você chegue com saúde
  rationale: Preserva o verbo ἔλθοις (‘que venha/chegue’) e o desejo convencional de bem-estar, em português compreensível, sem transformá-lo silenciosamente numa despedida.
- source_word: φυλήν
  choice: tribo
  rationale: Mantém a afiliação tribal israelita, central à investigação genealógica do contexto.
- source_word: πατριάν
  choice: família
  rationale: Expressa de modo natural a casa ou linha ancestral, enquanto o contexto esclarece o sentido genealógico.
- source_word: τυγχάνεις ἀδελφός μου
  choice: De fato, você é meu irmão
  rationale: Comunica a constatação resultante da investigação; ‘irmão’ conserva a linguagem explícita de parentesco do grego.
- source_word: ἐκ τῆς καλῆς καὶ ἀγαθῆς γενεᾶς
  choice: vem de uma linhagem boa e honrada
  rationale: No contexto de ascendência, γενεά indica linhagem; ‘boa e honrada’ transmite a avaliação moral e social da expressão coordenada.
- source_word: κοινῶς
  choice: juntos
  rationale: Indica que viajavam em companhia, numa formulação simples e atual.
- source_word: προσκυνεῖν
  choice: para adorar
  rationale: A peregrinação a Jerusalém torna claro o sentido cultual do verbo, sem exigir explicitar o gesto físico de prostração.
- source_word: τὰ πρωτότοκα
  choice: os animais primogênitos
  rationale: Distingue os primeiros animais nascidos dos dízimos agrícolas mencionados em seguida e evita que ‘primogênitos’, isoladamente, pareça referir-se a pessoas.
- source_word: τὰς δεκάτας τῶν γενημάτων
  choice: os dízimos da produção
  rationale: Abrange a produção ou rendimento agrícola sem restringir indevidamente o referente a uma cultura específica.
- source_word: οὐκ ἐπλανήθησαν ἐν τῇ πλάνῃ
  choice: não se deixaram levar pelo erro
  rationale: Reproduz de maneira idiomática a ideia de não serem desencaminhados ou não participarem do desvio, sem definir a natureza exata desse erro.
- source_word: ἐκ ῥίζης καλῆς
  choice: vem de uma boa raiz
  rationale: Mantém a metáfora genealógica concreta de ‘raiz’, em harmonia com o destaque dado à ascendência.
theological_decisions:
- issue: Linguagem de parentesco e identidade genealógica
  choice: Conservar ‘irmão’, ‘tribo’, ‘família’, ‘linhagem’ e ‘raiz’
  alternative: Generalizar como ‘parente’, ‘grupo’ ou simplesmente ‘boa família’
  rationale: O versículo vincula ascendência israelita, parentesco e fidelidade no culto. A terminologia familiar preserva essa textura social e teológica sem impor uma definição denominacional.
- issue: Natureza do ‘erro dos nossos irmãos’
  choice: Manter a referência genérica ao erro, sem identificá-lo
  alternative: Explicitar uma apostasia ou prática cultual específica
  rationale: O texto deste versículo não define o erro. Preservar essa abertura evita resolver uma ambiguidade contextual por interpretação não expressa na fonte.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega ‘você’ para naturalidade contemporânea, conserva a metáfora ‘boa raiz’ e translitera os nomes gregos como Ananias, Jatã e Semeias. Os marcadores de nota foram posicionados junto às expressões que explicam.
