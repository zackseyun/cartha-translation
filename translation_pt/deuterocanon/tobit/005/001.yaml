  text: And Tobiah answered him[a], “Father, I will do everything that you have commanded me.”
translation:
  language: pt
  text: 'Tobias respondeu-lhe[a]: “Pai, farei tudo o que me ordenaste.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A testemunha paralela de forma semítica diz explicitamente: “Tobias respondeu a seu pai... tudo o que me ordenaste, meu pai, farei”. A principal testemunha grega traz a forma mais simples “respondeu-lhe” e o vocativo “Pai”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: respondeu
  rationale: O particípio narrativo introduz a fala; em português, a forma verbal finita é natural e preserva sua função discursiva.
- source_word: Τωβίας
  choice: Tobias
  rationale: Forma tradicional e amplamente reconhecida do nome em português, correspondente ao grego Τωβίας.
- source_word: αὐτῷ
  choice: a ele
  rationale: Traduz diretamente o pronome grego sem explicitar no texto principal um referente que o grego deixa pronominal; o vocativo seguinte identifica o pai.
- source_word: Πάτερ
  choice: Pai
  rationale: Reproduz o vocativo grego sem acrescentar o possessivo presente apenas na testemunha semítica paralela.
- source_word: ποιήσω
  choice: farei
  rationale: O futuro exprime a intenção firme de obedecer; “farei” é direto e idiomático.
- source_word: πάντα ὅσα
  choice: tudo o que
  rationale: Expressão portuguesa natural que preserva a abrangência da construção grega.
- source_word: ἐντέταλσαί
  choice: ordenou
  rationale: O verbo indica uma ordem ou incumbência já dada e ainda válida; o pretérito perfeito é a forma mais natural em português neste contexto.
- source_word: μοι
  choice: me
  rationale: Preserva de modo idiomático o objeto indireto da ordem na construção portuguesa “ordenou-me/o senhor me ordenou”.
