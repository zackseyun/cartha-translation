  terminology: «Tobias» é forma portuguesa estabelecida para Τωβίας; «Pai» traduz adequadamente o vocativo Πάτερ. «Ordenaste» representa bem ἐντέταλσαί no contexto de uma instrução já dada e ainda obrigatória.
