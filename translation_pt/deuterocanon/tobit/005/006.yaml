base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/006.yaml
  text: And the angel said to him[a], “I will go with you, and I am familiar with the way, and I have lodged with Gabael our brother.”
translation:
  language: pt
  text: 'E o anjo lhe disse: “Irei com você. Conheço bem o caminho[a] e já me hospedei com Gabael, nosso irmão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tenho experiência nesse caminho”, isto é, “conheço bem a rota”. O paralelo semítico também explicita o sentido de conhecer os caminhos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορεύσομαι μετὰ σοῦ
  choice: Irei com você
  rationale: O futuro de πορεύομαι, seguido de μετά com genitivo, expressa de modo direto a promessa de acompanhar Tobias. “Irei com você” é natural e fiel em português moderno.
- source_word: τῆς ὁδοῦ ἐμπειρῶ
  choice: Conheço bem o caminho
  rationale: A expressão grega compacta indica experiência prática ou familiaridade com a rota. Esta formulação comunica claramente esse sentido sem acrescentar detalhes ausentes do grego.
- source_word: ὁδοῦ
  choice: caminho
  rationale: ὁδός pode designar caminho, estrada ou rota. “Caminho” é idiomático no contexto de viagem e mantém a amplitude do termo.
- source_word: παρὰ Γαβαὴλ
  choice: com Gabael
  rationale: παρά com o nome de uma pessoa, em combinação com o verbo de hospedagem, indica permanência junto dela ou em sua casa; em português, “hospedar-se com Gabael” exprime isso naturalmente.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: nosso irmão
  rationale: Preserva o termo familiar ἀδελφός sem decidir se se trata de irmão biológico, parente ou membro do mesmo povo.
- source_word: ηὐλίσθην
  choice: já me hospedei
  rationale: O aoristo de αὐλίζομαι indica ter-se alojado ou passado a noite em algum lugar. “Já me hospedei” é corrente e adequado ao contexto de viagem.
theological_decisions:
- issue: Sentido de ὁ ἄγγελος
  choice: o anjo
  alternative: o mensageiro
  rationale: No contexto narrativo de Tobit, a personagem é um ser angélico, e “anjo” é a tradução natural de ἄγγελος aqui. Usa-se minúscula por ser substantivo comum.
- issue: Alcance de “nosso irmão”
  choice: manter a formulação literal sem explicar o parentesco no texto
  alternative: nosso parente ou compatriota
  rationale: O grego preserva uma relação familiar ou comunitária não especificada. Traduzir literalmente conserva a ambiguidade e evita identificar indevidamente o tipo de vínculo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por construções naturais no Brasil sem regionalismos marcados. A pontuação divide a resposta do anjo em frases curtas e claras; o marcador [a] aparece imediatamente após a expressão comentada.
