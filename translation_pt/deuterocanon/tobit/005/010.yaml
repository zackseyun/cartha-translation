translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. O marcador de nota foi colocado após a primeira oração, correspondente ao ponto em que se sinaliza a brevidade e a variante textual. A tradução segue prioritariamente o grego de Swete e não trata a retroversão hebraica moderna como testemunho antigo.
