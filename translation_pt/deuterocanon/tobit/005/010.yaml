  text: And he called him[a], and he went in, and they greeted one another.
translation:
  language: pt
  text: E ele o chamou[a]; ele entrou, e se cumprimentaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego aqui é breve: “E ele o chamou; ele entrou, e se cumprimentaram.” Uma tradição semítica mais extensa de Tobias preserva um diálogo mais completo nesta parte da narrativa, mas o texto principal segue o testemunho grego preservado usado nesta tradução.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: chamou
  rationale: O aoristo de καλέω indica aqui, de modo natural, que ele o chamou. “Convocou” seria formal e incisivo demais, enquanto “convidou” especificaria uma intenção que o grego não explicita.
- source_word: αὐτόν
  choice: o
  rationale: O pronome masculino singular retoma uma pessoa identificável pelo contexto. O pronome oblíquo “o” preserva a concisão do grego.
- source_word: εἰσῆλθεν
  choice: entrou
  rationale: O verbo significa entrar. “Entrou” é direto, natural em português e não acrescenta ao texto um ponto de vista espacial mais específico.
- source_word: ἠσπάσαντο
  choice: se cumprimentaram
  rationale: ἀσπάζομαι significa comumente saudar ou cumprimentar. A forma recíproca em português transmite naturalmente a ação mútua, sem acrescentar um abraço ou outro gesto físico não declarado.
- source_word: ἀλλήλους
  choice: os dois
  rationale: O pronome recíproco significa “um ao outro”. Como “se cumprimentaram” já expressa reciprocidade, “os dois” torna explícitos os participantes sem a redundância pouco natural de “cumprimentaram um ao outro”.
