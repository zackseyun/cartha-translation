base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/002.yaml
  text: But how will I be able to get the money[b][a], since I do not know him?
translation:
  language: pt
  text: Mas como poderei receber o dinheiro[a], se não o conheço?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “a prata”; aqui, a expressão se refere ao dinheiro entregue para ser guardado.
    reason: lexical_alternative
  - marker: b
    text: 'A tradição semítica paralela amplia a ideia: “Como poderei receber o dinheiro de Gabael? Ele não me reconhecerá, e eu não o reconheço...”, explicitando que nenhum dos dois conhece o outro.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mas
  rationale: Marca naturalmente a objeção ou dificuldade levantada em resposta à instrução anterior.
- source_word: πῶς δυνησομαι
  choice: como poderei
  rationale: Preserva tanto a pergunta sobre o modo de agir quanto a ideia futura de capacidade.
- source_word: λαβεῖν
  choice: receber
  rationale: No contexto, refere-se a reaver de quem o guarda o valor confiado; “receber” é natural e evita sugerir apropriação indevida.
- source_word: τὸ ἀργύριον
  choice: o dinheiro
  rationale: Embora ἀργύριον possa significar literalmente “a prata”, aqui designa o valor monetário depositado.
- source_word: καὶ
  choice: se
  rationale: O καί coordena formalmente a falta de conhecimento com a dificuldade anterior; em português, “se” expressa com naturalidade a circunstância que fundamenta a pergunta.
- source_word: οὐ γινώσκω αὐτόν
  choice: não o conheço
  rationale: Mantém a formulação concisa do grego e pode abranger falta de conhecimento pessoal ou de reconhecimento.
