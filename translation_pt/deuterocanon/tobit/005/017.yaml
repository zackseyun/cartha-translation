base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/017.yaml
  text: They agreed to this[a]. Then he said to Tobiah, “Get ready for the journey, and may your journey be prosperous.” So his son prepared what was needed for the journey. Then his father said to him, “Go with the man, and may God, who dwells in heaven, make your journey prosper, and may his angel go with you.” So both went out to depart[b], and the boy’s dog went with them.
translation:
  language: pt
  text: 'Eles concordaram com isso[a]. Então ele disse a Tobias: “Prepare-se para a viagem, e que vocês tenham uma viagem bem-sucedida[b].” Seu filho preparou o necessário para a viagem. Então seu pai lhe disse: “Vá com o homem. Que Deus, que habita no céu, faça prosperar a viagem de vocês, e que o seu anjo[c] os acompanhe.” Os dois saíram para seguir viagem, e o cachorro do rapaz foi com eles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles aprovaram isso”.'
    reason: lexical_alternative
  - marker: b
    text: O grego passa do singular em “prepare-se” para o plural em “vocês tenham”, incluindo aparentemente Tobias e seu acompanhante na bênção.
    reason: grammatical_ambiguity
  - marker: c
    text: A palavra grega também pode significar “mensageiro”, mas, no contexto de Tobit, o sentido celestial é o mais provável.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐδόκησαν
  choice: Eles concordaram
  rationale: No contexto, o verbo indica a aceitação do acordo proposto, não apenas satisfação emocional. “Concordaram” é claro e natural em português.
- source_word: Ἔτοιμος γίνου πρὸς τὴν ὁδόν
  choice: Prepare-se para a viagem
  rationale: Conserva a força do imperativo e entende ὁδός como a viagem que estava prestes a começar.
- source_word: εὐοδωθεῖητε
  choice: que vocês tenham uma viagem bem-sucedida
  rationale: O optativo expressa um desejo de êxito na viagem. A forma verbal grega está no plural, preservado por “vocês”, embora a ordem anterior seja dirigida a Tobias no singular.
- source_word: τὰ πρὸς τὴν ὁδόν
  choice: o necessário para a viagem
  rationale: A expressão abrange preparativos ou provisões sem especificar itens que o texto não identifica.
- source_word: ὁ ἐν τῷ οὐρανῷ οἰκῶν θεός
  choice: Deus, que habita no céu
  rationale: Mantém a descrição reverente e a imagem espacial do particípio grego em linguagem portuguesa digna e corrente.
- source_word: εὐοδώσει τὴν ὁδὸν ὑμῶν
  choice: faça prosperar a viagem de vocês
  rationale: Reproduz a ideia de Deus conceder êxito ao percurso e preserva o pronome plural do grego.
- source_word: ὁ ἄγγελος αὐτοῦ συμπορευθήτω ὑμῖν
  choice: que o seu anjo os acompanhe
  rationale: “Anjo” corresponde ao sentido celestial indicado pelo contexto narrativo de Tobit, enquanto “os acompanhe” expressa naturalmente a ideia de viajar junto.
- source_word: ἐξῆλθαν ἀμφότεροι ἀπελθεῖν
  choice: Os dois saíram para partir
  rationale: Preserva deliberadamente a leve redundância do grego, que combina sair com partir, sem alterar o movimento narrativo.
- source_word: ὁ κύων τοῦ παιδαρίου
  choice: o cachorro do rapaz
  rationale: “Rapaz” identifica o jovem Tobias de modo natural, sem sugerir necessariamente uma criança pequena; “cachorro” oferece ampla legibilidade brasileira.
theological_decisions:
- issue: Sentido de ἄγγελος
  choice: anjo
  alternative: mensageiro
  rationale: Embora ἄγγελος possa significar genericamente “mensageiro”, o enredo de Tobit identifica a figura acompanhante como um ser celestial. A tradução segue esse sentido contextual sem acrescentar uma definição doutrinária.
- issue: Número plural na bênção de viagem
  choice: vocês
  alternative: você
  rationale: A ordem “prepare-se” está no singular, mas εὐοδωθεῖητε e, depois, ὑμῶν/ὑμῖν estão no plural. Preservar o plural permite que a bênção alcance Tobias e seu acompanhante, em vez de harmonizar silenciosamente a mudança gramatical.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismos marcados. Mantiveram-se o singular da ordem a Tobias, o plural das bênçãos aos viajantes e a leve redundância narrativa de “saíram para partir” por serem traços relevantes do grego.
