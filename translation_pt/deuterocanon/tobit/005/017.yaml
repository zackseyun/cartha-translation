    rationale: A expressão é excessivamente literal e soa artificial em português. “Saíram para seguir viagem” mantém a saída e a partida, sem apagar o movimento narrativo.
  - severity: low
    issue: Pontuação final das falas
    rationale: Em português editorial, o ponto que encerra uma fala completa é normalmente posto antes das aspas de fechamento.
