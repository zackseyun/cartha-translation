  text: And Tobiah said to him[a], “Wait for me, and I will tell my father.”
translation:
  language: pt
  text: 'Então Tobias lhe disse[a]: “Espere por mim, e falarei com meu pai.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego é breve: “Então Tobias lhe disse: ‘Espere por mim, e falarei com meu pai.’” Uma testemunha paralela de forma semítica amplia a cena, dizendo que Tobias entrou e contou ao pai sobre o homem que havia encontrado; depois saiu para chamá-lo. O texto principal segue o grego, e a informação da forma mais extensa é preservada aqui.'
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπόμεινόν με
  choice: Espere por mim
  rationale: O imperativo aoristo de ὑπομένω, com o pronome με, pede que o homem espere por Tobias enquanto ele fala com o pai. A formulação é natural e clara em português moderno.
- source_word: καὶ ἐρῶ
  choice: enquanto vou falar
  rationale: Embora καί normalmente signifique “e”, aqui liga a espera à ação que Tobias realizará nesse intervalo. O futuro de λέγω pode significar “direi” ou “falarei”; “enquanto vou falar” expressa naturalmente a relação contextual sem especificar além do grego o conteúdo da fala.
- source_word: τῷ πατρί
  choice: com meu pai
  rationale: 'O artigo grego diante do termo de parentesco tem valor possessivo no contexto: trata-se do pai do próprio Tobias. Em português, “meu pai” explicita naturalmente essa relação.'
- source_word: Τωβίας
  choice: Tobias
  rationale: “Tobias” é a forma tradicional e amplamente reconhecível em português para o nome grego Τωβίας; o contexto distingue o filho de Tobit.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe direta. “Espere” é forma cortês e internacionalmente compreensível; “enquanto vou falar” torna explícita apenas a relação temporal implícita no contexto. O nome “Tobias” segue o uso bíblico português tradicional.
