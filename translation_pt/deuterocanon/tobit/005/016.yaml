  text: And I will add more to your wages[a], if you return in good health.
translation:
  language: pt
  text: E ավելcentarei mais ao seu pagamento, se vocês voltarem com saúde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “se vocês voltarem estando saudáveis”. O grego destaca o bem-estar físico dos viajantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι προσθήσω
  choice: ainda acrescentarei algo
  rationale: A combinação expressa uma adição futura ao valor já combinado. A formulação é natural em português e conserva a ideia de pagamento adicional.
- source_word: σοι ἐπὶ τὸν μισθόν
  choice: ao seu pagamento
  rationale: σοι identifica o beneficiário, e ἐπὶ τὸν μισθόν indica acréscimo ao pagamento acordado. “Pagamento” é claro e adequado ao contexto de contratação.
- source_word: ἐὰν
  choice: se
  rationale: Introduz diretamente a condição da promessa.
- source_word: ὑγιαίνοντες
  choice: com saúde
  rationale: O particípio indica que os viajantes estarão saudáveis ou em boas condições ao voltar, sem ampliar o sentido para uma noção genérica de segurança.
- source_word: ἐπιστρέψητε
  choice: vocês voltarem
  rationale: No contexto de uma viagem, o verbo significa regressar. O plural é preservado porque o verbo e o particípio gregos se referem aos viajantes.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural “vocês” explicita o número indicado pelas formas gregas.
