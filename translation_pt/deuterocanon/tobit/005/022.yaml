  text: For a good angel will go with him, and his journey will be successful, and he will return in good health.
translation:
  language: pt
  text: Pois um anjo bom irá com ele, sua viagem será bem-sucedida, e ele voltará com saúde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: anjo
  rationale: No contexto narrativo de Tobias, refere-se a um ser celestial, não apenas a um mensageiro humano.
- source_word: ἀγαθὸς
  choice: bom
  rationale: Qualifica de modo simples o caráter ou a atuação benéfica do anjo, sem acrescentar interpretação.
- source_word: συνπορεύσεται
  choice: irá com
  rationale: Expressa naturalmente em português o ato de seguir viagem junto com alguém e preserva a ideia de movimento.
- source_word: εὐοδωθήσεται
  choice: será bem-sucedida
  rationale: Transmite o sentido passivo de a viagem ter um desfecho favorável, em linguagem clara e atual.
- source_word: ἡ ὁδὸς αὐτοῦ
  choice: sua viagem
  rationale: Embora ὁδός possa significar caminho ou estrada, neste contexto designa o percurso da viagem.
- source_word: ὑποστρέψει
  choice: ele voltará
  rationale: 'Reproduz diretamente o sentido comum do verbo: retornar.'
- source_word: ὑγιαίνων
  choice: com saúde
  rationale: Preserva a ênfase específica do particípio em estar saudável, sem ampliá-la para segurança em sentido geral.
theological_decisions:
- issue: Natureza de ἄγγελος no contexto
  choice: anjo celestial
  alternative: mensageiro em sentido genérico
  rationale: No mundo narrativo de Tobias, a fala aponta para a proteção divina por meio de um companheiro angélico. A tradução «anjo» reflete esse referente provável sem acrescentar outras afirmações doutrinárias.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem das orações e a repetição do futuro acompanham a progressão do grego; «irá com ele» é mais corrente do que «acompanhará» e mantém a imagem concreta da viagem.
