base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/005.yaml
  text: And he said to him[a], “Can I travel with you to Rages of Media[b], and are you familiar with the places?”
translation:
  language: pt
  text: 'E ele lhe disse: “Posso viajar com você até Rages, na Média,[a][b] e você conhece bem aqueles lugares?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “em Rages”, mas, neste contexto de viagem, a expressão indica o destino; por isso, “até Rages”.
    reason: lexical_alternative
  - marker: b
    text: Rages era uma cidade da Média. O nome também aparece transliterado como “Rhages” em algumas tradições.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθῆναι μετὰ σοῦ
  choice: viajar com você
  rationale: Expressa de modo natural o ato de fazer a viagem na companhia do interlocutor, preservando tanto o movimento quanto a ideia de acompanhamento.
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: até Rages, na Média
  rationale: Embora ἐν normalmente signifique “em”, neste contexto de deslocamento a expressão indica o destino. “Até” comunica claramente o ponto de chegada, enquanto “na Média” identifica a região à qual a cidade pertencia.
- source_word: Ῥάγοις
  choice: Rages
  rationale: Transliteração simples da forma grega do nome da cidade, adequada ao português e sem incorporar a grafia inglesa tradicional “Rhages”.
- source_word: ἔμπειρος εἶ τῶν τόπων
  choice: você conhece bem aqueles lugares
  rationale: ἔμπειρος indica experiência ou familiaridade. A formulação escolhida é idiomática em português e preserva a referência plural aos lugares.
