base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/004.yaml
  text: And he went to look for a man[a], and he found Raphael, who was an angel, but he did not know it.
translation:
  language: pt
  text: Ele foi procurar um homem e encontrou Rafael, que era um anjo[a], mas Tobias não sabia disso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “mensageiro”. Aqui, o narrador se refere a um ser angelical.
    reason: Registra a alternativa lexical de ἄγγελος sem obscurecer seu sentido contextual.
lexical_decisions:
- source_word: ἐπορεύθη
  choice: foi
  rationale: O aoristo depoente de πορεύομαι indica ir; “foi” é direto e natural na sequência narrativa.
- source_word: ζητῆσαι
  choice: procurar
  rationale: O infinitivo expressa propósito, e “procurar” comunica naturalmente a busca por uma pessoa.
- source_word: ἄνθρωπον
  choice: um homem
  rationale: O substantivo masculino singular refere-se, no contexto, ao homem procurado como companheiro de viagem.
- source_word: εὗρεν
  choice: encontrou
  rationale: Equivalente narrativo comum e preciso de εὑρίσκω.
- source_word: Ῥαφαήλ
  choice: Rafael
  rationale: Forma tradicional e corrente do nome em português.
- source_word: ἄγγελος
  choice: anjo
  rationale: Embora o termo também possa designar um mensageiro, o narrador identifica Rafael como um ser angelical.
- source_word: οὐκ ᾔδει
  choice: ele não sabia disso
  rationale: O grego deixa implícito o complemento; “disso” retoma a identidade de Rafael como anjo sem acrescentar conteúdo novo.
theological_decisions:
- issue: Identidade de Rafael como ἄγγελος
  choice: Traduzir ἄγγελος como “anjo” no texto principal
  alternative: mensageiro
  rationale: No mundo narrativo de Tobit, Rafael é um ser celestial, não apenas um enviado humano. “Anjo” preserva a revelação dada pelo narrador, enquanto a nota registra a amplitude lexical do grego.
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa simples. A repetição de “ele” no fim preserva o sujeito masculino expresso no grego e torna explícito que Tobias desconhecia a identidade de Rafael.
