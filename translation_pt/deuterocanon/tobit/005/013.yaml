  yaml_path: translation/deuterocanon/tobit/005/013.yaml
  text: to learn your family line and your name. But he said[a], “I am Azarias, son of the great Ananias, of your brothers.”
translation:
  language: pt
  text: 'para conhecer sua linhagem e seu nome. Ele respondeu: “Eu sou Azarias, filho do grande Ananias, um dos seus irmãos[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um dos seus parentes” ou “um dos membros da sua parentela”. O grego diz literalmente “dos seus irmãos”; em português, “um dos” explicita o sentido partitivo. O termo pode indicar parentesco mais amplo neste contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνῶναι
  choice: conhecer
  rationale: O infinitivo expressa a obtenção de informações que permitam identificar a pessoa; “conhecer” é natural em português e mantém a força cognitiva do verbo.
- source_word: γένος
  choice: linhagem
  rationale: No contexto, refere-se à ascendência ou ao grupo familiar, não a uma espécie ou raça; “linhagem” preserva o sentido genealógico.
- source_word: ὄνομα
  choice: nome
  rationale: Equivalente direto e adequado ao contexto de identificação.
- source_word: Ἐγὼ Ἀζαρίας
  choice: Eu sou Azarias
  rationale: Mantém a forma grega do nome próprio e reproduz de modo natural a identificação enfática.
- source_word: Ἀνανίου
  choice: Ananias
  rationale: A forma portuguesa tradicional “Ananias” reflete adequadamente o nome grego no genitivo patronímico.
- source_word: τοῦ μεγάλου
  choice: do grande
  rationale: Preserva o sentido literal e possivelmente honorífico do adjetivo sem especificá-lo como “mais velho” ou “ilustre”.
- source_word: τῶν ἀδελφῶν σου
  choice: um dos seus irmãos
  rationale: O genitivo plural tem valor partitivo no contexto; “um dos seus irmãos” explicita em português a relação implícita e mantém o termo masculino de parentesco.
theological_decisions:
- issue: Amplitude do termo de parentesco ἀδελφῶν
  choice: irmãos
  alternative: parentes; membros da sua parentela
  rationale: “Irmãos” preserva a forma masculina e o idioma de parentesco do grego, enquanto a nota registra que o termo pode ter sentido familiar mais amplo neste contexto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação preserva a abertura do versículo como continuação sintática do anterior e mantém os nomes segundo as formas gregas tradicionalmente aportuguesadas.
