  yaml_path: translation/deuterocanon/tobit/005/018.yaml
  text: But Anna his mother wept and said to Tobit[a], “Why did you send our child away? Is he not the staff of our hand as he goes in and goes out before us?”
translation:
  language: pt
  text: 'Ana, porém, a mãe dele, chorou e disse a Tobit: “Por que mandou o nosso filho embora? Não é ele o cajado de nossa mão[a], ao entrar e sair diante de nós?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, de modo mais interpretativo, “o nosso apoio”. O texto mantém a metáfora do cajado presente no grego.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔκλαυσεν
  choice: chorou
  rationale: O aoristo de κλαίω expressa choro ou lamentação; “chorou” comunica diretamente a dor de Ana em português corrente.
- source_word: ἐξαπέστειλας
  choice: mandou ... embora
  rationale: O verbo composto indica enviar alguém para longe ou fazê-lo partir; a formulação escolhida é natural e mantém a carga emocional da separação.
- source_word: τὸ παιδίον ἡμῶν
  choice: o nosso filho
  rationale: Embora παιδίον signifique literalmente “criança” ou “menino”, o contexto identifica a relação familiar; “filho” soa natural na fala da mãe sem especificar indevidamente a idade.
- source_word: ῥάβδος τῆς χειρὸς ἡμῶν
  choice: o cajado de nossa mão
  rationale: A tradução conserva a metáfora concreta do grego e sua feição semítica, em vez de substituí-la no texto principal por uma interpretação abstrata como “apoio”.
- source_word: ἐν τῷ εἰσπορεύεσθαι αὐτὸν καὶ ἐκπορεύεσθαι
  choice: ao entrar e sair
  rationale: A expressão mantém o paralelismo de movimento do original e representa a atividade habitual do filho diante dos pais.
- source_word: ἐνώπιον ἡμῶν
  choice: diante de nós
  rationale: Equivalente direto e digno que se integra naturalmente à expressão “entrar e sair”.
