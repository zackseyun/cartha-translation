translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O sujeito pronominal foi omitido em “Por que mandou” para evitar tanto o regionalismo de “tu mandaste” quanto a repetição explícita de “você”. A metáfora deliberadamente incomum do cajado foi preservada e esclarecida em nota.
