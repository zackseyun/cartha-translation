  source_fidelity: A tradução capta a oposição entre verificar a identidade genealógica e contratar alguém para acompanhar o filho. Contudo, “procura saber a tribo e a linhagem” introduz “saber” já na pergunta, embora o grego apenas apresente os termos “tribo e linhagem”; a elipse é retomada somente na resposta de Tobit.
  naturalness: O texto é claro e de registro adequado, mas “uma tribo e uma linhagem” soaria artificial em português se reproduzido literalmente. “A que tribo e linhagem ele pertence” torna natural a pergunta e explicita somente o referente que o contexto exige.
  terminology: “Tribo”, “linhagem”, “homem contratado”, “acompanhe” e “irmão” são escolhas adequadas. “Homem contratado” reflete μίσθιον de modo mais direto que “trabalhador contratado”.
  issues:
