base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/012.yaml
  text: And he said to him[a], “Are you seeking a tribe and a family line, or a hired man who will go with your son?” And Tobit said to him, “I want to know[c][b], brother,”
translation:
  language: pt
  text: 'E ele lhe disse: “Você procura saber a que tribo e linhagem ele pertence[a], ou procura um homem contratado que acompanhe seu filho?” Tobit lhe respondeu: “Quero saber[b], irmão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz literalmente “tribo e linhagem”. A formulação “a que tribo e linhagem ele pertence” explicita em português a informação genealógica em questão.
    reason: lexical_alternative
  - marker: b
    text: 'O grego diz literalmente: “Quero, irmão”. “Saber” foi acrescentado com base na pergunta anterior para explicitar o sentido subentendido.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φυλὴν
  choice: tribo
  rationale: Preserva o sentido de agrupamento social e de parentesco próprio de φυλή.
- source_word: πατριὰν
  choice: linhagem
  rationale: Expressa a descendência familiar ou genealógica e forma um par natural com “tribo”.
- source_word: μίσθιον
  choice: trabalhador contratado
  rationale: Indica uma pessoa que presta serviço mediante pagamento, sem o tom depreciativo que algumas alternativas podem transmitir.
- source_word: συμπορεύσεται
  choice: acompanhe
  rationale: Comunica de modo natural a ideia de viajar ou seguir junto com o filho de Tobit.
- source_word: Βούλομαι
  choice: Quero saber
  rationale: O grego é elíptico (“Quero, irmão”); “saber” retoma a questão anterior e torna explícito em português o objeto subentendido.
- source_word: ἀδελφέ
  choice: irmão
  rationale: Mantém o sentido literal e a função de tratamento cortês no contexto.
