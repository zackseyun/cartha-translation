    issue: A pergunta introduz “saber” sem assinalá-lo como explicitação e desloca a elipse grega.
    rationale: O grego pergunta “Você procura tribo e linhagem, ou um homem contratado...?”, e a resposta elíptica “Quero, irmão” permite inferir “Quero saber”. Em português, a pergunta precisa de uma leve explicitação para ser idiomática, mas ela deve ser identificada na nota.
