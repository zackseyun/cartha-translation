base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/009.yaml
  text: And he went in and said to his father[a], “Look, I have found someone who will travel with me.” And he said, “Call him to me, so that I may learn what tribe he is from[c][b], and whether he is trustworthy to go with you.”
translation:
  language: pt
  text: 'Ele entrou e disse ao pai: “Veja, encontrei alguém que viajará comigo[a]”. O pai respondeu: “Chame-o aqui, para que eu saiba de que tribo ele é[b] e se é digno de confiança para ir com você[c]”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “alguém que me acompanhará”.'
    reason: lexical_alternative
  - marker: b
    text: A referência à tribo reflete a importância da identidade tribal israelita neste contexto.
    reason: cultural_note
  - marker: c
    text: 'Ou: “se ele é confiável para ir com você”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: Ele entrou
  rationale: O particípio aoristo indica uma ação anterior ou concomitante à fala; a coordenação em português comunica a sequência com naturalidade e sem paráfrase excessiva.
- source_word: Ἰδοὺ
  choice: Veja
  rationale: Mantém a função de chamar a atenção com linguagem atual e digna, evitando o arcaísmo de “Eis” neste diálogo.
- source_word: εὕρηκα
  choice: encontrei
  rationale: O perfeito grego apresenta uma descoberta com resultado presente. O pretérito perfeito português é a forma idiomática neste contexto.
- source_word: ὃς συμπορεύσεταί μοι
  choice: alguém que viajará comigo
  rationale: Expressa claramente a companhia durante a viagem e preserva o valor futuro do verbo.
- source_word: Φώνησον αὐτὸν πρὸς μέ
  choice: Chame-o aqui
  rationale: Transmite o pedido para que o homem venha até o pai; “aqui” é mais natural em português do que o literal “para mim”.
- source_word: ἐπιγνῶ
  choice: eu saiba
  rationale: No contexto, o verbo indica averiguar ou obter conhecimento definido sobre a identidade e a confiabilidade do companheiro.
- source_word: ποίας φυλῆς ἐστίν
  choice: de que tribo ele é
  rationale: Preserva φυλή como “tribo”, termo ligado à identidade ancestral israelita, sem generalizá-lo como família ou linhagem.
- source_word: πιστὸς
  choice: digno de confiança
  rationale: No contexto de uma viagem, descreve alguém em quem se pode confiar, sem impor ao termo um sentido doutrinário.
- source_word: τοῦ πορευθῆναι μετὰ σοῦ
  choice: para ir com você
  rationale: Expressa de modo natural o âmbito em que o homem deve mostrar-se digno de confiança.
theological_decisions:
- issue: Identidade social expressa por φυλή
  choice: tribo
  alternative: linhagem ou clã
  rationale: O grego nomeia explicitamente a tribo e o cenário israelita torna relevante essa identidade ancestral; uma expressão genérica enfraqueceria esse aspecto narrativo.
- issue: Sentido contextual de πιστός
  choice: digno de confiança
  alternative: fiel ou confiável
  rationale: A questão imediata é se o acompanhante merece confiança para a viagem. A formulação escolhida preserva a dimensão moral sem transformar o verso em afirmação doutrinária.
- issue: Identificação do falante em ὁ δὲ εἶπεν
  choice: O pai respondeu
  alternative: Ele respondeu
  rationale: O artigo com partícula adversativa retoma o outro participante do diálogo. Nomear o pai em português evita ambiguidade referencial sem alterar o sentido.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. O diálogo mantém tom simples e digno; evita tanto construções arcaicas quanto coloquialismos excessivos.
