  yaml_path: translation/deuterocanon/tobit/005/015.yaml
  text: But tell me, what wages shall I give you? A drachma a day, and your necessities, as for my own son?
translation:
  language: pt
  text: 'Mas diga-me: que pagamento devo dar a você?[a] Uma dracma por dia e o necessário para você, assim como para meu filho?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quanto devo pagar a você?” O grego pergunta diretamente que remuneração Tobit deve dar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθὸν
  choice: pagamento
  rationale: μισθός designa a remuneração por trabalho ou serviço. “Pagamento” é natural em português e se ajusta à pergunta direta sobre quanto Tobias deverá receber.
- source_word: δραχμὴν τῆς ἡμέρας
  choice: uma dracma por dia
  rationale: O genitivo expressa a taxa diária. A tradução mantém a antiga unidade monetária e comunica de modo idiomático a remuneração calculada por dia.
- source_word: τὰ δέοντά σοι
  choice: o necessário para você
  rationale: A expressão indica aquilo de que a pessoa necessita, provavelmente sustento ou provisões. A formulação é natural e não especifica além do grego.
- source_word: ὡς καὶ τῷ υἱῷ μου
  choice: como também para o meu filho
  rationale: 'ὡς καί estabelece uma comparação: Tobit se propõe a prover para o acompanhante como provê para seu filho. A tradução conserva a referência comparativa sem acrescentar “próprio”, ausente do grego.'
- source_word: τίνα σοὶ ἔσομαι ... διδόναι
  choice: que pagamento devo dar a você
  rationale: A construção com o futuro de εἰμί e o infinitivo exprime a ação pretendida ou devida. “Devo dar” preserva a deliberação direta e soa corrente em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Diga-me” mantém o tom direto; “você” evita regionalismo excessivo. A estrutura interrogativa final foi preservada por corresponder à forma do grego, embora também possa ser entendida como uma proposta de pagamento.
