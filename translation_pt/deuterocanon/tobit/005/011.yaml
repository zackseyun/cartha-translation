base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/011.yaml
  text: And Tobit said to him, “Brother, from what tribe and from what homeland are you? Show me.”
translation:
  language: pt
  text: 'E Tobit lhe disse: “Irmão, de que tribo e de que terra você é? Mostre-me.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδελφέ
  choice: Irmão
  rationale: Preserva a forma direta de tratamento, usada aqui em sentido social e cortês, sem exigir parentesco literal.
- source_word: φυλῆς
  choice: tribo
  rationale: Equivalente direto e natural para a identidade tribal ou ancestral perguntada por Tobit.
- source_word: πατρίδος
  choice: terra
  rationale: Expressa o lugar de origem ou terra natal sem restringir indevidamente o termo a um país no sentido moderno.
- source_word: ὑπόδειξόν μοι
  choice: Diga-me
  rationale: No contexto de uma pergunta sobre identidade e origem, o imperativo significa dar a conhecer ou informar; a formulação portuguesa é natural e mantém a força do pedido.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” para ampla legibilidade brasileira. A ordem das duas perguntas e o vocativo do grego foram preservados.
