  text: And he said to him[a], “Go, and do not delay.”
translation:
  language: pt
  text: 'E ele lhe disse[a]: “Vá e não se demore.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “Vá e não se demore.” O material semítico paralelo desta seção é mais amplo nos versículos ao redor, mas esta ordem é simples e não altera de modo relevante a tradução aqui.'
