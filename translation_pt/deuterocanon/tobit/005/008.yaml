lexical_decisions:
- source_word: Πορεύου
  choice: Vá
  rationale: O imperativo de πορεύομαι é uma ordem direta para partir. “Vá” é natural, atual e preserva a concisão do grego.
- source_word: μὴ χρονίσῃς
  choice: não se demore
  rationale: χρονίζω expressa demorar-se ou tardar. “Não se demore” comunica claramente a proibição sem recorrer a linguagem arcaica.
- source_word: καὶ
  choice: e
  rationale: A conjunção coordena a fórmula narrativa e, depois, as duas ordens; “e” preserva essa ligação simples sem impor uma sequência temporal mais forte.
- source_word: εἶπεν αὐτῷ
  choice: ele lhe disse
  rationale: Equivalente português natural da fórmula narrativa, mantendo implícita, como no contexto grego, a identidade do sujeito.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A forma de tratamento “Vá” evita regionalismos marcados e mantém a brevidade imperativa do original.
