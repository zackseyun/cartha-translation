base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/003.yaml
  text: And he gave him the written note and said to him[a], “Find for yourself a man who will go with you, and I will give him wages while I live[b]; then go and get the silver.”
translation:
  language: pt
  text: 'E entregou-lhe o documento manuscrito[a] e lhe disse: “Procure um homem que vá com você, e eu lhe pagarei enquanto eu viver. Depois, vá buscar a prata[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “documento manuscrito”. A tradição semítica paralela aponta para um sinal ou documento de identificação ligado ao depósito, mas não permite determinar com certeza sua forma jurídica.
    reason: cross_reference
  - marker: b
    text: Ou “o dinheiro”. A palavra grega ἀργύριον significa literalmente “prata”, mas aqui se refere aos valores depositados.
    reason: lexical_alternative
lexical_decisions:
- source_word: χειρόγραφον
  choice: documento escrito
  rationale: O termo designa algo escrito à mão. No contexto, trata-se do documento ligado ao depósito, mas o grego não especifica com certeza se era recibo, título ou outro instrumento legal.
- source_word: Ζήτησον σεαυτῷ ἄνθρωπον
  choice: Procure para você um homem
  rationale: Preserva o imperativo e o substantivo masculino singular ἄνθρωπον, mantendo linguagem portuguesa natural sem generalizá-lo como “alguém”.
- source_word: συμπορεύσεταί σοι
  choice: que viaje com você
  rationale: Expressa o sentido concreto de seguir viagem junto com Tobias; “acompanhe você” também seria possível.
- source_word: μισθὸν
  choice: pagarei pelo serviço
  rationale: μισθός indica remuneração por trabalho ou serviço. A formulação é mais natural em português atual do que “darei um salário”, sem sugerir necessariamente emprego contínuo.
- source_word: ἕως ζῶ
  choice: enquanto eu viver
  rationale: Reproduz de modo idiomático a duração expressa pelo grego, sem explicar além do texto como a promessa funcionaria.
- source_word: λάβε πορευθεὶς τὸ ἀργύριον
  choice: Depois, vá buscar a prata
  rationale: Converte o particípio em uma sequência natural de ordens. “Prata” conserva o valor lexical concreto de ἀργύριον, embora o contexto indique dinheiro depositado.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por construções naturais no Brasil. Mantém-se “homem” por corresponder ao substantivo masculino singular do grego e “prata” no texto principal para preservar a imagem lexical, esclarecida em nota.
