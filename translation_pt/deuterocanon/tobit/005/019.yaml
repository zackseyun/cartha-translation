  source_fidelity: A tradução preserva a repetição de ἀργύριον e reconhece corretamente o caráter elíptico de μὴ φθάσαι. Porém, «diante de nosso filho» torna a relação genitiva menos precisa e pode sugerir uma cena ou presença física. «Em comparação com nosso filho» explicita, sem excesso, a relação de valor que a expressão idiomática comunica. O forte sentido depreciativo de περίψημα é adequadamente transmitido por «lixo».
  naturalness: «Não se compare prata com prata» mantém deliberadamente a formulação proverbial incomum, e a nota é necessária para sua inteligibilidade. «Que ela se torne lixo em comparação com nosso filho» é claro, moderno e conserva o tom enfático. A versão revista melhora a ligação semântica que «diante de» deixava vaga.
  terminology: «Prata» conserva o termo concreto grego, que também pode denotar dinheiro; «lixo» comunica de modo acessível o valor depreciativo de περίψημα. Não é necessário introduzir um termo teológico como «resgate», pois o texto e a construção permanecem elípticos. A nota deve apresentar o literal como aproximação e não como uma equivalência portuguesa enganadora.
