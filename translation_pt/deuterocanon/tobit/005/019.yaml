  text: Do not value silver against silver[a], but let it become refuse for our child.
translation:
  language: pt
  text: Não se compare prata com prata[a]; antes, que ela se torne lixo em comparação com nosso filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente, de modo aproximado: “Que a prata não se adiante à prata, mas se torne lixo de nosso filho”. A frase é idiomática; a relação expressa de forma concisa por “de nosso filho” indica que o dinheiro não deve ter peso em comparação com o filho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριον τῷ ἀργυρίῳ μὴ φθάσαι
  choice: Não se compare prata com prata
  rationale: A expressão grega é comprimida e idiomática. φθάνω significa literalmente chegar antes ou adiantar-se; neste contexto, a frase adverte contra pôr cálculos de dinheiro em primeiro plano. “Comparar prata com prata” conserva a repetição concreta e o caráter proverbial sem impor um sentido econômico mais específico.
- source_word: ἀλλά
  choice: antes
  rationale: Introduz um contraste forte e, em português corrente e digno, apresenta a atitude que deve prevalecer.
- source_word: περίψημα
  choice: lixo
  rationale: Designa o que é removido ou lançado fora, como resíduos ou escória. “Lixo” comunica com clareza a forte desvalorização da prata em relação ao filho.
- source_word: τοῦ παιδίου ἡμῶν
  choice: diante de nosso filho
  rationale: O genitivo é conciso e admite relação ou referência. “Diante de nosso filho” expressa a comparação implícita sem restringi-la indevidamente a finalidade ou benefício.
- source_word: γένοιτο
  choice: que ela se torne
  rationale: Preserva o optativo de desejo ou resolução e retoma naturalmente “prata”, substantivo feminino em português.
theological_decisions:
- issue: Valor relativo da riqueza e do filho na expressão grega elíptica
  choice: A prata deve ser considerada lixo diante do valor do filho.
  alternative: Não se acrescente prata a prata, mas que ela seja lixo por causa de nosso filho.
  rationale: O foco é a insignificância da perda material em comparação com o filho. A tradução mantém a tensão e a concisão da frase sem transformar a construção em uma doutrina econômica específica.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição “prata com prata” preserva a força proverbial do grego; a nota esclarece a construção incomum.
