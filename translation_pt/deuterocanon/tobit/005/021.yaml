  yaml_path: translation/deuterocanon/tobit/005/021.yaml
  text: And Tobit said to her[a], “Do not worry, sister; he will return safe and sound, and your eyes will see him.”
translation:
  language: pt
  text: 'E Tobit lhe disse[a]: “Não se preocupe, irmã; ele voltará são e salvo, e os seus olhos o verão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmã” é a forma literal de tratamento no grego. Aqui, Tobit fala com sua esposa; o termo expressa tratamento familiar entre cônjuges, e não que fossem irmãos biológicos.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ λόγον ἔχε
  choice: Não se preocupe
  rationale: A expressão é idiomática e, neste contexto de consolo, comunica naturalmente a ideia de não ficar aflita, sem reproduzir de modo obscuro a formulação literal com λόγον.
- source_word: ἀδελφή
  choice: irmã
  rationale: Preserva a forma literal de tratamento do grego e sua coloração familiar, enquanto a nota esclarece que Tobit se dirige à esposa.
- source_word: ὑγιαίνων
  choice: são e salvo
  rationale: O particípio indica que ele virá bem, com saúde e em segurança; a expressão portuguesa é natural no contexto de uma viagem.
- source_word: ἐλεύσεται
  choice: voltará
  rationale: Embora o verbo signifique literalmente “virá”, o contexto indica o regresso do filho à casa, sentido que “voltará” expressa com clareza.
- source_word: οἱ ὀφθαλμοί σου ὄψονται αὐτόν
  choice: os seus olhos o verão
  rationale: Mantém a referência explícita aos olhos e a força vívida e afetiva da promessa no texto grego.
