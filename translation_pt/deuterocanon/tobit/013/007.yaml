  text: I exalt my God[a], and my soul rejoices in the King of heaven, and it will exult in his greatness.
translation:
  language: pt
  text: Exalto o meu Deus, e a minha alma se alegra no Rei do céu[a] e exultará em sua grandeza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A oração grega é elíptica; literalmente: «e a minha alma ao Rei do céu». A tradução acrescenta «se alegra no» para expressar o provável sentido poético no contexto.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑψῶ
  choice: Exalto
  rationale: O presente «Exalto» traduz diretamente a forma verbal grega e conserva a linguagem concisa de louvor.
- source_word: ψυχή
  choice: a minha alma
  rationale: Mantém a referência explícita à alma e o tom poético e devocional do original.
- source_word: βασιλεῖ τοῦ οὐρανοῦ
  choice: no Rei do céu
  rationale: Preserva o título divino e expressa em português a relação indicada pelo dativo na oração elíptica.
- source_word: ἀγαλλιάσεται
  choice: exultará
  rationale: O futuro comunica alegria intensa e mantém o tom elevado do hino.
- source_word: μεγαλοσύνην
  choice: grandeza
  rationale: É a correspondência mais direta e abrangente para o substantivo grego neste contexto de louvor.
- source_word: καὶ ἡ ψυχή μου τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: e a minha alma se alegra no Rei do céu
  rationale: A oração grega não traz verbo expresso. «Se alegra» explicita discretamente o provável sentido poético no contexto, sem ocultar a elipse, que é registrada em nota.
theological_decisions:
- issue: Oração intermediária elíptica, sem verbo expresso
  choice: Entendê-la como expressão poética de alegria no Rei do céu
  alternative: 'Traduzir como oração nominal: «e a minha alma é para o Rei do céu»'
  rationale: O contexto hínico favorece uma ideia de louvor ou alegria, mas a construção grega permanece ambígua; por isso, a tradução oferece uma leitura contextual e documenta a elipse em nota, sem transformá-la em conclusão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com cadência poética. O título «Rei do céu» conserva maiúscula reverencial por funcionar como designação de Deus. A nota foi colocada junto à oração elíptica a que se refere.
