base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/010.yaml
  text: Give thanks well to the Lord, and bless the King of the ages, so that his tent may again be built for you with joy; and so that he may gladden within you the captives and love within you the afflicted for all the generations of the age.
translation:
  language: pt
  text: Dá graças ao Senhor como convém[a] e bendize o Rei dos séculos, para que a sua tenda seja novamente edificada para ti, com alegria, e para que ele, em ti, alegre os cativos e ame os aflitos por todas as gerações.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: «bem». O verbo também pode ser traduzido por «louva» ou «confessa» neste contexto.'
    reason: Registra a forma adverbial incomum e a amplitude semântica de ἐξομολογέω.
  - marker: b
    text: 'Literalmente: «por todas as gerações da era»; também: «por todas as gerações do século».'
    reason: Registra a construção temporal grega sem introduzir o demonstrativo ausente no original.
lexical_decisions:
- source_word: ἐξομολόγου
  choice: Dá graças
  rationale: No contexto de louvor dirigido ao Senhor, o imperativo exprime agradecimento ou louvor público; «dá graças» é natural e mantém a força cultual do verbo.
- source_word: ἀγαθῶς
  choice: como convém
  rationale: O advérbio significa literalmente «bem». A formulação escolhida comunica em português corrente a ideia de fazê-lo devidamente, sem introduzir uma disposição emocional não expressa no grego.
- source_word: τὸν βασιλέα τῶν αἰώνων
  choice: o Rei dos séculos
  rationale: Preserva a expressão temporal plural e o título solene, sem convertê-la interpretativamente em «Rei eterno».
- source_word: ἡ σκηνὴ αὐτοῦ
  choice: a tenda dele
  rationale: Mantém a imagem concreta de σκηνή, que pode evocar a habitação divina, sem substituí-la por uma interpretação como «templo» ou «santuário».
- source_word: οἱ αἰχμάλωτοι
  choice: os cativos
  rationale: Equivalente direto e digno para os que estão em cativeiro.
- source_word: οἱ ταλαίπωροι
  choice: os aflitos
  rationale: Expressa sofrimento e condição desventurada em linguagem clara, sem restringir o termo à pobreza material.
- source_word: εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος
  choice: por todas as gerações desta era
  rationale: Conserva tanto «gerações» quanto o singular αἰῶνος, evitando achatar a frase em um simples «para sempre».
theological_decisions:
- issue: Referente espacial de ἐν σοί
  choice: em ti
  alternative: em teu meio
  rationale: O texto se dirige à cidade personificada. «Em ti» conserva a forma e a imagem do grego, sem eliminar a personificação.
- issue: Sujeito implícito de εὐφρᾶναι e ἀγαπήσαι
  choice: ele, retomando o Senhor/Rei
  alternative: a tenda dele
  rationale: A leitura com Deus como agente de alegrar e amar é a construção semanticamente mais coerente; a formulação não acrescenta um título nem especifica além do antecedente disponível.
- issue: Sentido de σκηνή
  choice: tenda
  alternative: templo
  rationale: A tradução evita identificar explicitamente a tenda com o templo, preservando a amplitude simbólica e teológica da imagem.
translation_notes:
  register: Português moderno, solene e acessível, com tratamento na segunda pessoa do singular para acompanhar a cidade personificada. Mantiveram-se as imagens «tenda», «em ti» e «Rei dos séculos», ainda que menos idiomáticas, porque são relevantes à textura poética e teológica do original.
