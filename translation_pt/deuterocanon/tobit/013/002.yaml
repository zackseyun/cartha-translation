base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/002.yaml
  text: For he afflicts and shows mercy; he brings down to Hades and brings up[a], and there is no one who will escape his hand.
translation:
  language: pt
  text: Pois ele castiga e mostra misericórdia; faz descer ao Hades e faz subir[a], e não há quem escape de sua mão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou “à sepultura” ou “ao mundo dos mortos”. Grego: “ao Hades”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαστιγοῖ
  choice: castiga
  rationale: O verbo pode significar literalmente açoitar, mas aqui expressa de modo mais amplo a ação severa de Deus ao infligir sofrimento ou disciplina. “Castiga” preserva a força sem impor uma imagem exclusivamente física.
- source_word: ἐλεᾷ
  choice: mostra misericórdia
  rationale: Tradução clara e corrente que mantém o contraste equilibrado com “castiga”.
- source_word: κατάγει
  choice: faz descer
  rationale: Preserva o movimento causativo e o paralelismo antitético com ἀνάγει.
- source_word: εἰς ᾅδην
  choice: ao Hades
  rationale: Representa diretamente o termo grego ᾅδης, sem reduzi-lo apenas à sepultura; alternativas explicativas ficam na nota.
- source_word: ἀνάγει
  choice: faz subir
  rationale: Mantém a correspondência verbal com “faz descer” e deixa em aberto se a imagem indica livramento da morte ou retorno do mundo dos mortos.
- source_word: οὐκ ἔστιν ὃς ἐκφεύξεται
  choice: não há quem escape
  rationale: Forma portuguesa natural que comunica a impossibilidade de escapar; o presente idiomático não apaga a força prospectiva do futuro grego.
- source_word: τὴν χεῖρα αὐτοῦ
  choice: de sua mão
  rationale: Conserva a metáfora bíblica concreta da mão como poder e domínio.
theological_decisions:
- issue: Sentido da descida ao Hades e da subida
  choice: Declaração geral da soberania de Deus sobre a morte e o mundo dos mortos, sem explicitar uma doutrina de ressurreição.
  alternative: Referência a levar alguém à beira da morte e restaurá-lo, ou afirmação explícita de ressurreição do mundo dos mortos.
  rationale: Os verbos paralelos afirmam o domínio divino sobre vida e morte, mas não obrigam a decidir entre livramento de perigo mortal e retorno efetivo do Hades; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo poético foi preservado em “faz descer… faz subir”, e “Hades” mantém o vínculo explícito com a fonte grega.
