base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/001.yaml
  text: Then Tobit wrote a prayer of rejoicing and said[a], “Blessed is the living God forever, and his kingdom.”
translation:
  language: pt
  text: 'Então Tobit escreveu uma oração de júbilo e disse: “Bendito é o Deus vivo para sempre, e o seu reino.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego termina abruptamente com “e o seu reino”. Algumas traduções acrescentam um predicado subentendido, como “é bendito”, ou ligam “para sempre” também ao reino. A formulação concisa foi mantida para não acrescentar o que a fonte não declara de modo explícito.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγραφεν
  choice: escreveu
  rationale: É a tradução direta de γράφω e introduz naturalmente a oração posta por escrito; “compôs” acrescentaria uma nuance literária desnecessária.
- source_word: προσευχὴν εἰς ἀγαλλίασιν
  choice: uma oração de júbilo
  rationale: “Oração” traduz diretamente προσευχή, e “de júbilo” comunica o caráter exultante expresso por εἰς ἀγαλλίασιν em português natural e digno.
- source_word: Εὐλογητὸς
  choice: Bendito seja
  rationale: Fórmula doxológica corrente em português bíblico; o verbo copulativo, exigido pela fluência da língua-alvo, não altera o sentido predicativo do adjetivo grego.
- source_word: ὁ θεὸς ὁ ζῶν
  choice: o Deus vivo
  rationale: Preserva a construção atributiva e a expressão bíblica convencional sem paráfrase.
- source_word: εἰς τοὺς αἰῶνας
  choice: para sempre
  rationale: Equivalente idiomático moderno para a expressão grega de duração sem fim.
- source_word: βασιλεία
  choice: reino
  rationale: Mantém a forma nominal e a ressonância bíblica; “reinado” seria possível, mas interpretaria mais explicitamente o domínio exercido.
theological_decisions:
- issue: Como entender a cláusula final sem verbo καὶ ἡ βασιλεία αὐτοῦ
  choice: 'Preservar a continuação elíptica: “e o seu reino”'
  alternative: “e bendito seja o seu reino”; “e o seu reino dura para sempre”; “e o seu reino seja bendito”
  rationale: O grego termina de modo abrupto, sem predicado explícito. A tradução conserva essa concisão e assinala a dificuldade em nota, evitando determinar se a bênção ou a expressão “para sempre” deve ser subentendida na cláusula final.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil, com dignidade litúrgica moderada. “Júbilo” conserva a intensidade celebrativa sem soar excessivamente arcaico. A pontuação deixa o marcador após a citação, associado à cláusula final discutida.
