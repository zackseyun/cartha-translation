  rationale: A revisão substitui o subjuntivo optativo “seja” pelo indicativo declarativo “é”. Assim, a primeira afirmação doxológica é traduzida de modo mais direto, enquanto a segunda cláusula continua deliberadamente elíptica, como no grego. A nota conserva e esclarece a ambiguidade sem impor uma solução interpretativa.
