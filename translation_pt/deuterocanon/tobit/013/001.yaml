    issue: “Bendito seja” acrescenta uma força optativa à declaração doxológica.
    rationale: O grego Εὐλογητὸς ὁ θεὸς é uma predicação sem cópula explícita, não um imperativo nem um desejo. Em português, o subjuntivo em “seja” pode ser entendido como “que Deus seja bendito”. “Bendito é” exprime mais diretamente a declaração, preservando ao mesmo tempo a elipse da cláusula final “e o seu reino”.
  - severity: low
    issue: A decisão lexical afirma que o verbo copulativo é exigido pela fluência e não distingue o valor do modo verbal escolhido.
    rationale: Um verbo pode tornar a frase natural em português, mas o subjuntivo não é neutro. A revisão usa o indicativo e ajusta a nota para explicar que a dificuldade textual permanece na cláusula final.
