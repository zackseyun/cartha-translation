  text: For Jerusalem will be built with sapphire and emerald[a], and your walls with precious stones, and the towers and battlements with pure gold[c][b],
translation:
  language: pt
  text: Pois Jerusalém será construída com safira e esmeralda[a]; tuas muralhas, com pedras preciosas; e as torres e as fortificações[b], com ouro puro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “será reconstruída”. O grego diz simplesmente “será construída”, mas o contexto de restauração pode sugerir uma reconstrução.
    reason: lexical_alternative
  - marker: b
    text: O termo grego se refere a estruturas defensivas; também poderia ser traduzido por “baluartes” ou “obras avançadas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομηθήσεται
  choice: será construída
  rationale: O futuro passivo de οἰκοδομέω significa literalmente “será construída”. Embora o contexto de restauração permita entender “será reconstruída”, o grego não explicita o prefixo de repetição; por isso, preserva-se a formulação simples.
- source_word: σαπφείρῳ καὶ σμαράγδῳ
  choice: com safira e esmeralda
  rationale: Os dativos podem indicar material ou meio. A construção portuguesa com “com” mantém naturalmente a imagem de edificação ou ornamentação mediante essas pedras.
- source_word: λίθῳ ἐντίμῳ
  choice: com pedras preciosas
  rationale: Embora a expressão grega esteja no singular, o valor material/coletivo admite o plural idiomático em português, mais natural neste contexto arquitetônico.
- source_word: τὰ τείχη σου
  choice: suas muralhas
  rationale: Mantém o possessivo de segunda pessoa, pois Jerusalém passa a ser interpelada diretamente no grego. “Muralhas” comunica melhor que “muros” o contexto defensivo da cidade.
- source_word: οἱ πύργοι
  choice: as torres
  rationale: Equivalente corrente e exato para as torres ligadas às defesas urbanas.
- source_word: οἱ προμαχῶνες
  choice: as fortificações
  rationale: O termo designa obras defensivas avançadas ou protetoras. “Fortificações” é claro e abrangente em português moderno, sem impor uma configuração arquitetônica excessivamente específica.
- source_word: χρυσίῳ καθαρῷ
  choice: com ouro puro
  rationale: Conserva o dativo de material e traduz diretamente o qualificativo καθαρῷ.
theological_decisions:
- issue: Imagens escatológicas ou de restauração referentes a Jerusalém
  choice: Manter a promessa poética de uma Jerusalém futura construída com materiais preciosos, sem definir a imagem como literal ou simbólica.
  alternative: Interpretar a descrição exclusivamente como arquitetura literal ou exclusivamente como símbolo da glória restaurada.
  rationale: O texto grego apresenta imagens grandiosas de construção, mas não determina sua modalidade interpretativa. A tradução conserva essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com pontuação que explicita as elipses do verbo sem alterar a estrutura poética. O tratamento direto de Jerusalém é preservado em “suas muralhas”. O singular grego de “pedra preciosa” foi vertido pelo plural coletivo mais idiomático “pedras preciosas”.
