translation:
  language: pt
  text: Todos os que odeiam você são malditos; todos os que amam você serão benditos para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικατάρατοι
  choice: Malditos sejam
  rationale: O adjetivo expressa a condição solene de estar sob maldição. A construção portuguesa preserva sua força declarativa e supre naturalmente a cópula ausente no grego.
- source_word: μισοῦντές
  choice: os que odeiam
  rationale: O particípio substantivado designa aqueles que odeiam a cidade personificada; esta é a correspondência mais direta e mantém o contraste com amar.
- source_word: εὐλογημένοι
  choice: benditos
  rationale: Neste contexto, o adjetivo passivo indica os que recebem bênção, não apenas elogio. “Benditos” também forma um contraste claro e solene com “malditos”.
- source_word: ἀγαπῶντές
  choice: os que amam
  rationale: O particípio substantivado é traduzido diretamente e conserva a oposição lexical entre odiar e amar.
- source_word: ἔσονται
  choice: serão
  rationale: Mantém explicitamente o futuro do verbo grego na segunda oração.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: É a forma corrente e natural de expressar em português a duração contínua do idioma grego.
theological_decisions:
- issue: Força das declarações de maldição e bênção dirigidas aos que odeiam ou amam Jerusalém
  choice: Manter a linguagem direta e solene de maldição e bênção
  alternative: Atenuar para desaprovação e aprovação humanas
  rationale: Os termos gregos exprimem verdadeira maldição e bênção; reduzi-los a sentimentos ou reputação social enfraqueceria o peso teológico do texto.
- issue: Valor temporal da primeira oração sem verbo expresso
  choice: Usar o subjuntivo declarativo “sejam”, em paralelo estilístico com a bênção futura
  alternative: 'Traduzir como estado presente: “são malditos”'
  rationale: O grego deixa a cópula implícita na primeira oração, permitindo mais de uma formulação portuguesa. “Malditos sejam” preserva a declaração solene sem apagar a assimetria, pois a segunda oração continua trazendo o futuro explícito “serão”.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Você” retoma naturalmente a cidade personificada no contexto; “benditos” e “malditos” preservam o paralelismo e o peso religioso do original.
