  text: And the streets of Jerusalem will be paved with beryl and carbuncle and stones from Suphir[a].
translation:
  language: pt
  text: E as ruas de Jerusalém serão pavimentadas com berilo, carbúnculo e pedras de Sufir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «pedras de Ofir», caso Σουφείρ seja entendido como o topônimo Ofir, em vez de ser transliterado diretamente do testemunho grego.
    reason: alternative_reading
lexical_decisions:
- source_word: πλατεῖαι
  choice: ruas
  rationale: O termo pode designar ruas largas ou espaços abertos da cidade. «Ruas» é natural em português e se ajusta à descrição urbana sem acrescentar uma especificação ausente no contexto imediato.
- source_word: βηρύλλῳ
  choice: berilo
  rationale: Mantém o nome tradicional da pedra preciosa e preserva a imagem de esplendor, sem pretender identificar com exatidão a classificação mineral moderna.
- source_word: ἄνθρακι
  choice: carbúnculo
  rationale: Neste contexto de pedras preciosas, ἄνθραξ indica uma gema brilhante, tradicionalmente chamada «carbúnculo», e não carvão comum.
- source_word: λίθῳ ἐκ Σουφεὶρ
  choice: pedras de Sufir
  rationale: A expressão indica pedra proveniente de Σουφείρ. O plural «pedras» soa natural na enumeração, e «Sufir» translitera diretamente a forma do testemunho grego.
- source_word: ψηφολογηθήσονται
  choice: serão pavimentadas
  rationale: O verbo se refere ao assentamento de pequenas pedras, inclusive em pavimento ou mosaico. «Serão pavimentadas» comunica com clareza o sentido arquitetônico em português atual.
