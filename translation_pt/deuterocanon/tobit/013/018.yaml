  text: And all her streets will say[a], ‘Hallelujah and praise!’ saying, ‘Blessed is God, who has exalted all the ages.’
translation:
  language: pt
  text: 'E todas as suas ruas dirão[a]: “Aleluia e louvor!”, dizendo: “Bendito é Deus, que exaltou todas as eras.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em sentido mais idiomático: “que é exaltado para sempre” ou “por todas as eras”. O grego diz literalmente “que exaltou todas as eras”, uma expressão incomum.'
    reason: Leitura alternativa e esclarecimento da formulação grega incomum.
lexical_decisions:
- source_word: ῥῦμαι
  choice: ruas
  rationale: O termo designa ruas, vielas ou passagens de uma cidade. “Ruas” é natural em português e preserva a personificação da cidade.
- source_word: ἀλληλουιά
  choice: Aleluia
  rationale: O grego conserva a transliteração litúrgica; “Aleluia” reproduz essa forma reconhecível em português.
- source_word: αἴνεσιν
  choice: louvor
  rationale: O substantivo significa “louvor”. O singular mantém de perto a forma grega e integra a exclamação litúrgica.
- source_word: Εὐλογητός
  choice: Bendito
  rationale: Como predicado de Deus numa declaração doxológica, “Bendito é Deus” preserva o caráter declarativo do grego, em vez de transformá-lo num desejo.
- source_word: ὕψωσεν
  choice: exaltou
  rationale: Traduz diretamente a ideia de elevar ou exaltar e conserva o registro solene.
- source_word: πάντας τοὺς αἰῶνας
  choice: todas as eras
  rationale: A expressão grega é incomum e diz literalmente “todas as eras”. A tradução preserva sua forma e tensão sem a reduzir silenciosamente ao sentido temporal mais idiomático de “para sempre”.
theological_decisions:
- issue: Sentido de πάντας τοὺς αἰῶνας na oração final
  choice: todas as eras
  alternative: para sempre; por todas as eras
  rationale: A formulação principal mantém o objeto explícito do verbo no grego, embora seja incomum. A nota registra possíveis entendimentos temporais sem decidir por eles no texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Mantém-se a personificação das ruas e a repetição entre “dirão” e “dizendo”, presente no texto grego.
