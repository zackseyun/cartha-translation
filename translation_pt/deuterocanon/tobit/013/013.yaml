  yaml_path: translation/deuterocanon/tobit/013/013.yaml
  text: Rejoice and exult over the sons of the righteous[a], because they will be gathered together and will bless the Lord of the righteous.
translation:
  language: pt
  text: Alegre-se e exulte por causa dos filhos dos justos[a], pois eles serão reunidos e bendirão o Senhor dos justos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os descendentes dos justos”. O grego diz literalmente “os filhos”, expressão que pode referir-se de modo mais amplo aos descendentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρηθι
  choice: Alegre-se
  rationale: Imperativo direto e natural em português, preservando o convite à alegria.
- source_word: ἀγαλλίασαι
  choice: exulte
  rationale: Mantém a intensificação da alegria expressa pelo segundo imperativo e conserva o tom elevado.
- source_word: ἐπὶ
  choice: por causa de
  rationale: Com o dativo, indica aqui o motivo ou a ocasião da alegria; esta formulação é clara e idiomática em português.
- source_word: τοῖς υἱοῖς τῶν δικαίων
  choice: dos filhos dos justos
  rationale: Preserva o substantivo masculino plural explícito do grego, sem excluir em nota o possível sentido mais amplo de descendência.
- source_word: συναχθήσονται
  choice: serão reunidos
  rationale: Conserva a voz passiva e a nuance comunitária ou restauradora do ajuntamento.
- source_word: εὐλογήσουσιν
  choice: bendirão
  rationale: Reflete o sentido lexical de abençoar ou bendizer e soa natural quando Deus é o objeto em registro bíblico.
- source_word: τὸν κύριον
  choice: o Senhor
  rationale: Emprega o título divino reverente convencional neste contexto judaico-escriturístico.
- source_word: τῶν δικαίων
  choice: dos justos
  rationale: Mantém a relação genitiva incomum, mas inteligível, sem transformá-la em uma caracterização do Senhor.
theological_decisions:
- issue: Linguagem masculina de descendência em τοῖς υἱοῖς τῶν δικαίων
  choice: os filhos dos justos
  alternative: os descendentes dos justos
  rationale: O grego usa explicitamente “filhos”, mas o termo pode ter alcance corporativo e abranger descendentes; a tradução principal preserva a forma e a nota registra a amplitude possível.
- issue: Sentido de τὸν κύριον τῶν δικαίων
  choice: o Senhor dos justos
  alternative: o Senhor justo
  rationale: A leitura mais direta preserva a relação genitiva entre o Senhor e os justos. Converter a expressão em adjetivo resolveria uma ambiguidade que o grego não exige resolver.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Exulte” e “bendirão” preservam o tom poético e bíblico sem recorrer a construção arcaica.
