base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/003.yaml
  text: Give thanks to him[a], O sons of Israel, before the nations, because he himself has scattered us among them.
translation:
  language: pt
  text: Deem graças a ele[a], ó filhos de Israel, diante das nações, porque foi ele mesmo quem nos espalhou entre elas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Reconheçam-no” ou “Louvem-no”; o verbo grego pode incluir os sentidos de reconhecimento, ação de graças e louvor.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: Deem graças
  rationale: No grego bíblico, o verbo pode exprimir confessar, reconhecer, agradecer ou louvar. Neste contexto de proclamação pública dos atos de Deus, “Deem graças” comunica naturalmente a exortação sem restringi-la à confissão de pecados; a nota preserva as alternativas legítimas.
- source_word: αὐτῷ
  choice: a ele
  rationale: Dativo que tem Deus como referente; vertido diretamente.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: ó filhos de Israel
  rationale: Mantém o substantivo masculino plural explícito no grego e comunica a força vocativa mediante “ó”, em registro bíblico digno e compreensível.
- source_word: ἐνώπιον τῶν ἐθνῶν
  choice: diante das nações
  rationale: Preserva o sentido espacial e público de “na presença de”, distinguindo esta expressão do posterior “entre elas”.
- source_word: ὅτι
  choice: porque
  rationale: Expressa claramente a relação causal que fundamenta a exortação.
- source_word: αὐτὸς
  choice: foi ele mesmo quem
  rationale: Reproduz a ênfase do pronome grego de modo idiomático em português, sem acrescentar a ideia de exclusividade.
- source_word: διέσπειρεν
  choice: espalhou
  rationale: Traduz o aoristo como ato passado de Deus e conserva a imagem bíblica da dispersão. O pretérito perfeito é natural em português e não impõe uma nuance aspectual ausente do grego.
- source_word: ἡμᾶς
  choice: nos
  rationale: Objeto direto de “espalhou”, vertido de maneira simples.
- source_word: ἐν αὐτοῖς
  choice: entre elas
  rationale: O pronome retoma “as nações”; “entre elas” exprime naturalmente a presença de Israel no meio desses povos.
theological_decisions:
- issue: A dispersão de Israel apresentada como ação de Deus
  choice: porque foi ele mesmo quem nos espalhou entre elas
  alternative: porque ele próprio nos dispersou entre elas
  rationale: O grego atribui explicitamente a dispersão a Deus. A tradução mantém essa afirmação e sua tensão teológica, sem suavizá-la nem acrescentar uma explicação causal ou justificativa.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. “Ó filhos de Israel” conserva a forma vocativa e o gênero do grego; “diante das nações” mantém o caráter público do testemunho. A ordem “foi ele mesmo quem” reproduz naturalmente a ênfase de αὐτός.
