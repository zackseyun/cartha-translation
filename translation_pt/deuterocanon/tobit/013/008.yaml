lexical_decisions:
- source_word: λεγέτωσαν
  choice: falem
  rationale: Imperativo de terceira pessoa do plural de λέγω. “Falem” conserva a amplitude e a força exortativa do grego sem especificar indevidamente o conteúdo como proclamação.
- source_word: πάντες
  choice: todos
  rationale: O adjetivo é usado substantivamente e expressa de modo conciso a universalidade do apelo.
- source_word: ἐξομολογείσθωσαν
  choice: deem graças
  rationale: No grego bíblico, o verbo pode indicar confessar, louvar ou agradecer. No contexto hínico e de culto de Tobit 13, “deem graças” comunica naturalmente o sentido devocional mais provável.
- source_word: αὐτῷ
  choice: lhe
  rationale: O pronome no dativo se refere a Deus; “lhe” expressa de forma natural em português a relação de objeto indireto.
- source_word: ἐν Ἱεροσολύμοις
  choice: em Jerusalém
  rationale: Equivalente português corrente da preposição ἐν com o nome da cidade no dativo.
theological_decisions:
- issue: Sentido de ἐξομολογείσθωσαν no contexto de culto
  choice: deem graças
  alternative: confessem diante dele; louvem-no
  rationale: O campo semântico do verbo inclui confissão, louvor e ação de graças. O contexto doxológico favorece “deem graças”, enquanto a nota preserva as possibilidades legítimas sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção exortativa “Que todos...” reproduz naturalmente os dois imperativos gregos de terceira pessoa; “lhe deem graças” evita rigidez e mantém o referente divino.
