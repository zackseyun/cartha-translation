translation:
  language: pt
  text: Que todos falem e lhe deem graças em Jerusalém[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o reconheçam” ou “o louvem”; conforme o contexto, o verbo grego pode ter qualquer um desses sentidos ligados ao culto.
