  to: 'Se vocês se voltarem para ele de todo o coração e de toda a alma, praticando a verdade diante dele[a], então ele se voltará para vocês e certamente não esconderá de vocês o seu rosto. Vejam o que ele fará com vocês e deem-lhe graças com todo o seu corpo[b]. Bendigam o Senhor da justiça[c] e exaltem o Rei dos séculos[d].


    Eu, na terra do meu cativeiro, dou-lhe graças e dou a conhecer sua força e sua grandeza às nações dos pecadores[e]. Voltem-se para ele, pecadores, e pratiquem a justiça diante dele. Quem sabe se ele terá prazer em vocês[f] e lhes mostrará misericórdia?'
