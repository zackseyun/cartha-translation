    rationale: δεικνύω significa primariamente «mostrar» ou «dar a conhecer». «Anunciar» é interpretativo e pode deslocar o foco da manifestação dessas qualidades.
  - severity: medium
    issue: «a nações de pecadores»
    rationale: Embora procure conservar o genitivo ἁμαρτωλῶν, a formulação é pouco idiomática e ambígua em português. «Às nações dos pecadores» conserva a construção, com uma nota para a leitura mais fluente «às nações pecadoras».
  - severity: low
    issue: «retidão» como tradução principal de δικαιοσύνη
    rationale: É possível, mas «justiça» é mais natural neste título e nesta exortação em português, sem reduzir necessariamente o termo à justiça forense.
