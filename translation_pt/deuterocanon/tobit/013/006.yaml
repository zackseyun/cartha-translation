base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/006.yaml
  text: If you turn to him with all your heart and with all your soul[a], to do what is true before him, then he will turn to you and will certainly not hide his face from you. See what he will do with you, and give thanks to him with your whole being; bless the Lord of righteousness[d][c][b], and exalt the King of the ages.
translation:
  language: pt
  text: 'Se vocês se voltarem para ele de todo o coração e de toda a alma, praticando a verdade diante dele[a], então ele se voltará para vocês e certamente não esconderá de vocês o seu rosto. Vejam o que ele fará com vocês e deem-lhe graças com todo o seu corpo[b]. Bendigam o Senhor da justiça[c] e exaltem o Rei dos séculos[d].


    Eu, na terra do meu cativeiro, dou-lhe graças e dou a conhecer sua força e sua grandeza às nações dos pecadores[e]. Voltem-se para ele, pecadores, e pratiquem a justiça diante dele. Quem sabe se ele terá prazer em vocês[f] e lhes mostrará misericórdia?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “fazendo a verdade diante dele”. A expressão de estilo semítico pode indicar viver com verdade ou agir fielmente na presença de Deus.
    reason: lexical_alternative
  - marker: b
    text: Ou “com todo o ser de vocês”. O grego diz literalmente “com todo o corpo de vocês”, ressaltando um agradecimento integral e corporal.
    reason: lexical_alternative
  - marker: c
    text: Ou “o Senhor da retidão”.
    reason: lexical_alternative
  - marker: d
    text: Ou “o Rei eterno”.
    reason: lexical_alternative
  - marker: e
    text: A construção grega é incomum e também pode ser entendida como “às nações pecadoras”.
    reason: syntactic_ambiguity
  - marker: f
    text: Literalmente, “se ele quererá vocês”; também pode significar “se ele lhes será favorável”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν ἐπιστρέψητε ... τότε ἐπιστρέψει
  choice: se vocês se voltarem ... então ele se voltará
  rationale: Mantém a repetição de ἐπιστρέφω e, assim, o movimento recíproco entre a conversão humana e a resposta divina.
- source_word: ἐν ὅλῃ καρδίᾳ ὑμῶν καὶ ἐν ὅλῃ τῇ ψυχῇ
  choice: de todo o coração e de toda a alma
  rationale: Preserva a fórmula bíblica de devoção integral em português natural e solene.
- source_word: ποιῆσαι ἐνώπιον αὐτοῦ ἀλήθειαν
  choice: praticando a verdade diante dele
  rationale: A expressão grega literalmente associa 'fazer/praticar' a 'verdade'. Esta formulação conserva o semitismo de modo compreensível, sem restringir ἀλήθεια apenas à fidelidade.
- source_word: οὐ μὴ κρύψῃ τὸ πρόσωπον αὐτοῦ ἀφʼ ὑμῶν
  choice: certamente não esconderá de vocês o seu rosto
  rationale: A construção οὐ μή é uma negação enfática; 'certamente não' comunica essa força e mantém a imagem bíblica do rosto oculto.
- source_word: θεάσασθε ἃ ποιήσει μεθʼ ὑμῶν
  choice: Vejam o que ele fará com vocês
  rationale: Traduz diretamente o imperativo de percepção atenta e deixa aberta a nuance relacional de μετά.
- source_word: ἐξομολογήσασθε αὐτῷ ... ἐξομολογοῦμαι αὐτῷ
  choice: deem-lhe graças ... dou-lhe graças
  rationale: No contexto de louvor, ἐξομολογέομαι exprime ação de graças ou louvor, não necessariamente confissão de pecados. A repetição foi mantida.
- source_word: ἐν ὅλῳ τῷ σώματι ὑμῶν
  choice: com todo o seu corpo
  rationale: Mantém explicitamente σώμα, 'corpo', e a dimensão corporal e integral do agradecimento.
- source_word: τὸν κύριον τῆς δικαιοσύνης
  choice: o Senhor da retidão
  rationale: '''Retidão'' preserva a amplitude moral de δικαιοσύνη e funciona naturalmente como título divino; ''justiça'' continua possível.'
- source_word: τὸν βασιλέα τῶν αἰώνων
  choice: o Rei dos séculos
  rationale: Preserva o genitivo plural αἰώνων e o registro doxológico elevado, em vez de convertê-lo diretamente em um adjetivo.
- source_word: δεικνύω τὴν ἰσχὺν καὶ τὴν μεγαλοσύνην αὐτοῦ
  choice: anuncio sua força e sua grandeza
  rationale: Embora δεικνύω seja literalmente 'mostro', neste contexto testemunhal 'anuncio' comunica a manifestação pública das obras e qualidades divinas sem alterar os objetos do verbo.
- source_word: ἔθνεσιν ἁμαρτωλῶν
  choice: a nações de pecadores
  rationale: Conserva a construção genitiva incomum do grego e evita decidir se o texto caracteriza as próprias nações como pecadoras.
- source_word: τίς γινώσκει εἰ θελήσει ὑμᾶς
  choice: Quem sabe se ele terá prazer em vocês
  rationale: θελήσει ὑμᾶς significa literalmente 'quererá vocês', mas aqui pode expressar disposição favorável ou agrado. A nota preserva a forma mais literal e a incerteza.
- source_word: ποιήσει ἐλεημοσύνην ὑμῖν
  choice: lhes mostrará misericórdia
  rationale: A expressão idiomática 'fazer misericórdia' é vertida naturalmente como 'mostrar misericórdia', sem introduzir a ideia mais estreita de esmola.
theological_decisions:
- issue: Sentido de δικαιοσύνη no título divino e na exortação ética
  choice: retidão
  alternative: justiça
  rationale: '''Retidão'' abrange a qualidade moral e a conduta correta sem excluir a dimensão de justiça. A alternativa é registrada porque δικαιοσύνη pode carregar ambas as nuances.'
- issue: Relação condicional entre conversão humana e resposta divina
  choice: manter a estrutura 'se... então' e a pergunta final sem explicação doutrinária
  alternative: parafrasear como promessa incondicional ou como mérito humano
  rationale: O grego apresenta uma condição explícita e termina com 'Quem sabe se...'. A tradução conserva essa tensão, sem transformá-la em sistema teológico.
- issue: θελήσει ὑμᾶς como atitude divina
  choice: terá prazer em vocês
  alternative: quererá vocês
  rationale: A escolha torna a frase inteligível em português, enquanto a nota retém a literalidade e evita definir com excessiva precisão a natureza do favor divino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com 'vocês' para o plural. Mantêm-se imagens bíblicas como o rosto de Deus, a repetição de 'voltar-se' e o título solene 'Rei dos séculos'. O segundo segmento presente no texto grego foi incluído integralmente, embora não apareça na camada inglesa fornecida.
