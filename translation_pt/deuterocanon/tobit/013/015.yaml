lexical_decisions:
- source_word: εὐλόγει
  choice: Bendiga
  rationale: O imperativo singular de εὐλογέω conserva a imagem bíblica de bendizer a Deus. «Louve» seria possível, mas estreitaria um pouco o campo semântico.
- source_word: τὸν θεὸν
  choice: a Deus
  rationale: O objeto acusativo com artigo é expresso naturalmente em português como «a Deus», sem reproduzir o artigo grego.
- source_word: τὸν βασιλέα
  choice: o Rei
  rationale: É um título em aposição que identifica Deus; a inicial maiúscula sinaliza seu uso como título divino sem acrescentar conteúdo.
- source_word: τὸν μέγαν
  choice: grande
  rationale: μέγας significa diretamente «grande»; «poderoso» enfatizaria de modo interpretativo apenas a força.
theological_decisions:
- issue: Tradução do título régio divino
  choice: o grande Rei
  alternative: o grande rei
  rationale: O grego apresenta «o rei, o grande» em aposição a Deus. «O grande Rei» preserva de maneira idiomática a designação régia exaltada, sem expansão doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A vírgula final foi mantida porque o trecho fornecido parece continuar no contexto poético.
