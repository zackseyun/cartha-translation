  yaml_path: translation/deuterocanon/tobit/013/005.yaml
  text: And he will scourge us for our injustices[a], and again he will show mercy and gather us from all the nations among which you were scattered.
translation:
  language: pt
  text: E ele nos castigará por nossas injustiças e, depois, terá misericórdia de nós e nos reunirá de todas as nações onde quer que vocês tenham sido dispersos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego passa de “nós/nossas” para “vocês” na oração final. Algumas traduções uniformizam a frase como “onde quer que tenhamos sido dispersos”, mas aqui se preserva a mudança de pessoa do texto-fonte.
    reason: alternative_reading
lexical_decisions:
- source_word: μαστιγώσει
  choice: castigará
  rationale: O verbo denota literalmente açoitar, mas aqui exprime metaforicamente uma disciplina divina severa. “Castigará” comunica esse sentido com naturalidade no português atual, sem sugerir necessariamente um açoite físico.
- source_word: ἐν ταῖς ἀδικίαις ἡμῶν
  choice: por nossas injustiças
  rationale: A preposição tem valor causal no contexto. “Injustiças” preserva o substantivo plural ἀδικίαις e evita generalizá-lo como “pecados”.
- source_word: πάλιν
  choice: depois, voltará a
  rationale: A formulação marca tanto a sequência quanto a reversão do castigo para a misericórdia, expressando em português natural a ideia de uma nova ação misericordiosa.
- source_word: ἐλεήσει
  choice: ter misericórdia
  rationale: Equivalente idiomático e direto para o verbo grego, mantendo explícita a ação misericordiosa de Deus.
- source_word: συνάξει
  choice: reunirá
  rationale: Expressa diretamente a reunião do povo disperso e mantém a imagem de restauração.
- source_word: ἐξ πάντων τῶν ἐθνῶν
  choice: dentre todas as nações
  rationale: O contexto aponta para as nações no meio das quais o povo foi disperso; “nações” é mais adequado que “gentios” e “dentre” comunica a procedência da reunião.
- source_word: οὗ ἐὰν σκορπισθῆτε ἐν αὐτοῖς
  choice: entre as quais vocês tiverem sido dispersos
  rationale: Preserva a referência às nações, a segunda pessoa do plural e a nuance eventual ou indefinida de ἐὰν com o subjuntivo aoristo, sem transformar a forma em um passado indicativo certo.
theological_decisions:
- issue: Mudança da primeira pessoa do plural para a segunda pessoa do plural na oração final
  choice: 'Preservar a mudança: “nos castigará... nossas injustiças... nos reunirá... vocês tiverem sido dispersos”.'
  alternative: 'Uniformizar tudo na primeira pessoa: “entre as quais tivermos sido dispersos”.'
  rationale: O grego passa de ἡμᾶς/ἡμῶν para σκορπισθῆτε. A mudança retórica é mantida em vez de ser harmonizada silenciosamente.
- issue: Valor temporal e modal de σκορπισθῆτε
  choice: “tiverem sido dispersos”
  alternative: “foram dispersos” ou “forem dispersos”
  rationale: A construção com ἐὰν e subjuntivo preserva uma nuance eventual ou indefinida. O futuro composto do subjuntivo comunica essa abertura melhor que um passado indicativo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “Vocês” torna inequívoca a segunda pessoa do plural presente no grego; “castigará” evita o arcaísmo e a possível leitura excessivamente física de “açoitará”. O ponto e vírgula deixa clara a passagem do castigo à misericórdia.
