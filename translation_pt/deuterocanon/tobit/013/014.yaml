base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/014.yaml
  text: Oh[a], blessed are those who love you; they will rejoice over your peace. Blessed are all who were grieved over your afflictions, because they will rejoice over you when they see all your glory; and my soul will rejoice forever.
translation:
  language: pt
  text: Como são felizes os que amam você! Eles se alegrarão com a sua paz. Felizes todos os que se entristeceram com as suas aflições[a], pois se alegrarão por sua causa quando contemplarem toda a sua glória; e a minha alma se alegrará para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “açoites”, “pragas” ou “castigos”. O grego μάστιξ pode designar literalmente um chicote ou, em sentido figurado, golpes de sofrimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: felizes
  rationale: Expressa de modo natural a declaração enfática de felicidade e favor, sem reduzir o termo a mera boa sorte. Na primeira ocorrência, ὦ é representado por “Como são felizes...!”.
- source_word: οἱ ἀγαπῶντές
  choice: os que amam
  rationale: Reproduz naturalmente o particípio substantivado e conserva o sentido relacional contínuo.
- source_word: χάρησονται / χαρήσονται
  choice: se alegrarão
  rationale: Mantém a repetição lexical do grego e comunica claramente a alegria futura.
- source_word: ἐπὶ τῇ εἰρήνῃ σου
  choice: com a sua paz
  rationale: Apresenta a paz da cidade como motivo ou ocasião da alegria, em português corrente.
- source_word: ὅσοι ἐλυπήθησαν
  choice: todos os que se entristeceram
  rationale: Preserva o alcance de ὅσοι e o sentido de tristeza de λυπέω sem acrescentar conotação especificamente funerária.
- source_word: μάστιξίν
  choice: aflições
  rationale: O termo pode indicar açoites literais ou, figuradamente, golpes de sofrimento; “aflições” se ajusta ao sofrimento de Jerusalém sem impor uma imagem corporal literal.
- source_word: θεασάμενοι
  choice: quando contemplarem
  rationale: Traduz o particípio com valor temporal e preserva a ideia de ver atentamente a glória restaurada.
- source_word: πᾶσαν τὴν δόξαν σου
  choice: toda a sua glória
  rationale: Conserva a força abrangente de πᾶσαν e o sentido de honra e esplendor restaurados.
- source_word: εὐφρανθήσεται
  choice: se alegrará
  rationale: Expressa a alegria intensa em linguagem clara e mantém a unidade temática do versículo.
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: Equivalente idiomático moderno para a duração permanente indicada pela expressão grega.
- source_word: ἡ ψυχή μου
  choice: a minha alma
  rationale: Preserva o registro pessoal e devocional e a referência ao ser interior do falante.
theological_decisions:
- issue: Referente dos pronomes femininos da segunda pessoa do singular
  choice: Manter a fala direta a Jerusalém/Zion sem nomeá-la no versículo
  alternative: Explicitar “Jerusalém” ou entender a referência mais amplamente como o povo de Deus
  rationale: O contexto do cântico personifica Jerusalém e fala de sua paz, suas aflições e sua glória. A tradução conserva os pronomes, evitando inserir no texto uma identificação que o próprio versículo deixa implícita.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. “Como são felizes” transmite de forma natural a exclamação inicial; as demais frases mantêm o paralelismo poético e a fala dirigida à cidade personificada.
