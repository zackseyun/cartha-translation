base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/009.yaml
  text: 'Jerusalem[a], city of the Holy One: he will scourge you for the works of your children[b], and again he will show mercy to the children of the righteous.'
translation:
  language: pt
  text: 'Jerusalém, cidade do Santo[a]: ele a castigará por causa das obras de teus filhos[b] e voltará a ter misericórdia dos filhos dos justos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “cidade de alguém santo”. O genitivo grego também pode ser entendido de modo mais geral, mas, no contexto, provavelmente se refere a Deus.
    reason: lexical_alternative
  - marker: b
    text: O grego usa o termo normalmente traduzido por “filhos”, que se refere propriamente a filhos do sexo masculino, nas duas ocorrências; aqui, porém, o sentido é coletivo.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἱεροσόλυμα
  choice: Jerusalém
  rationale: Forma portuguesa consagrada do nome da cidade.
- source_word: πόλις ἁγίου
  choice: cidade do Santo
  rationale: Mantém a construção genitiva e sua referência mais provável a Deus, sem transferir a santidade diretamente para a cidade.
- source_word: μαστιγώσει
  choice: castigará
  rationale: O verbo tem o sentido literal de açoitar, mas aqui exprime figuradamente castigo severo; “castigará” é natural em português e adequado ao contexto.
- source_word: ἐπὶ τὰ ἔργα
  choice: por causa das obras
  rationale: Expressa com clareza a relação causal indicada pela preposição com o acusativo.
- source_word: τῶν υἱῶν σου
  choice: de seus filhos
  rationale: Embora υἱοί signifique formalmente “filhos homens”, o contexto personifica Jerusalém e abrange coletivamente seus habitantes.
- source_word: πάλιν ἐλεήσει
  choice: voltará a ter misericórdia
  rationale: 'Comunica a reversão marcada por πάλιν: depois do castigo, haverá misericórdia renovada.'
- source_word: τοὺς υἱοὺς τῶν δικαίων
  choice: dos filhos dos justos
  rationale: Preserva a expressão familiar coletiva e verte δικαίων como substantivo plural moral e teológico.
theological_decisions:
- issue: Referente do sujeito implícito de μαστιγώσει e ἐλεήσει
  choice: Deus é representado pelo pronome “ele” como sujeito implícito dos dois verbos.
  alternative: Manter os verbos sem sujeito expresso ou entender Jerusalém apenas como foco gramatical.
  rationale: O grego não explicita o sujeito, mas o contexto de juízo e misericórdia e a expressão “cidade do Santo” apontam para Deus. O português admite sujeito oculto, porém sua explicitação aqui evita que Jerusalém seja entendida como agente.
- issue: Linguagem familiar masculina
  choice: “filhos” nas duas ocorrências de υἱοί, com nota explicativa.
  alternative: “descendentes”, “habitantes” ou uma formulação explicitamente inclusiva.
  rationale: “Filhos” conserva a imagem poética de Jerusalém como mãe de seu povo; a nota esclarece que o sentido é coletivo e não necessariamente restrito aos homens.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem poética do vocativo e o contraste entre castigo e misericórdia foram preservados; evitou-se o arcaísmo “açoitará” no texto principal, embora ele reflita mais literalmente a imagem verbal grega.
