base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/004.yaml
  text: There declare his greatness[a], and exalt him before every living being; for he is our Lord[c][b], and he is our God and our Father forever.
translation:
  language: pt
  text: Ali proclamem a grandeza dele[a] e o exaltem diante de todo ser vivo[b], pois ele é o nosso Senhor, e ele é o nosso Deus e nosso Pai para sempre.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «mostrem a majestade dele». O verbo grego pode significar «mostrar» ou «dar a conhecer», e o substantivo também pode ser traduzido por «majestade».
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «diante de todo vivente». A expressão é abrangente, embora, no contexto, se refira mais naturalmente a todas as pessoas vivas.
    reason: lexical_alternative
  - marker: c
    text: Ou «por todos os séculos». A expressão grega enfatiza uma duração sem fim.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖ
  choice: Ali
  rationale: Retoma o contexto geográfico do versículo anterior sem acrescentar uma identificação não expressa no grego.
- source_word: ὑποδείξατε
  choice: proclamem
  rationale: O imperativo plural pode significar mostrar ou dar a conhecer; no contexto de louvor público, «proclamem» comunica naturalmente a ideia de tornar conhecida.
- source_word: τὴν μεγαλοσύνην αὐτοῦ
  choice: a grandeza dele
  rationale: μεγαλοσύνη abrange grandeza e majestade; «grandeza» é clara, ampla e próxima da forma grega.
- source_word: ὑψοῦτε αὐτόν
  choice: o exaltem
  rationale: Preserva a imagem de elevar e é uma expressão portuguesa natural no contexto de honra e louvor a Deus.
- source_word: ἐνώπιον παντὸς ζῶντος
  choice: diante de todo ser vivo
  rationale: Mantém a formulação distributiva e abrangente do grego, sem restringi-la explicitamente aos seres humanos.
- source_word: καθότι
  choice: pois
  rationale: Introduz de modo claro e digno a razão das exortações anteriores.
- source_word: κύριος ἡμῶν
  choice: o nosso Senhor
  rationale: Tradução reverente e convencional de κύριος, preservando o predicado confessional.
- source_word: θεὸς αὐτὸς πατὴρ ἡμῶν
  choice: ele é o nosso Deus e nosso Pai
  rationale: Torna explícita em português a força enfática de αὐτός e aplica ambos os títulos à mesma pessoa, sem fundi-los.
- source_word: εἰς πάντας τοὺς αἰῶνας
  choice: para sempre
  rationale: Expressão portuguesa corrente para duração sem fim; a alternativa literal «por todos os séculos» fica registrada em nota.
theological_decisions:
- issue: Relação entre os predicados «nosso Senhor», «nosso Deus» e «nosso Pai»
  choice: ele é o nosso Senhor, e ele é o nosso Deus e nosso Pai
  alternative: ele é o nosso Senhor, e ele é Deus, nosso Pai
  rationale: A repetição de αὐτός confere ênfase, e θεός e πατήρ são apresentados como predicados do mesmo referente. A redação conserva a acumulação confessional e evita transformar «Pai» em simples explicação ambígua de «Deus».
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com imperativos no plural e vocabulário de louvor natural. «Ali» mantém a ligação com o contexto anterior; «todo ser vivo» conserva a abrangência formal do original.
