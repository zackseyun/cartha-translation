base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/011.yaml
  text: Many nations will come from far away to the name of the Lord God[a], carrying gifts in their hands, gifts for the King of heaven; generations of generations will give you exultation.
translation:
  language: pt
  text: Muitas nações virão de longe ao nome do Senhor Deus, trazendo presentes nas mãos, presentes para o Rei do céu; gerações de gerações te darão júbilo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “geração após geração trará júbilo a você”. O grego diz literalmente: “gerações de gerações te darão júbilo”.'
    reason: Registra uma alternativa portuguesa mais idiomática para a construção intensiva e incomum do grego.
lexical_decisions:
- source_word: ἔθνη πολλὰ
  choice: Muitas nações
  rationale: ἔθνη pode significar “nações” ou “povos”. “Nações” preserva o alcance internacional da peregrinação sem enfatizar indevidamente um contraste posterior entre judeus e gentios.
- source_word: μακρόθεν
  choice: de longe
  rationale: Expressa de modo natural e conciso a origem distante indicada pelo advérbio.
- source_word: ἥξει
  choice: virão
  rationale: O singular grego concorda gramaticalmente com o neutro plural ἔθνη, mas o português exige normalmente o plural com “muitas nações”. “Virão” conserva o sentido de movimento e peregrinação.
- source_word: πρὸς τὸ ὄνομα Κυρίου τοῦ θεοῦ
  choice: ao nome do Senhor Deus
  rationale: Mantém o idioma bíblico direcional do grego, sem reduzi-lo interpretativamente a “para adorar” nem a “por causa da fama”.
- source_word: δῶρα ἐν χερσὶν ἔχοντες
  choice: trazendo presentes nas mãos
  rationale: Formulação natural que preserva a imagem concreta de peregrinos com dádivas nas mãos.
- source_word: καὶ δῶρα τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: presentes para o Rei do céu
  rationale: Preserva a repetição enfática de δῶρα e apresenta com naturalidade o Rei do céu como destinatário.
- source_word: γενεαὶ γενεῶν
  choice: gerações de gerações
  rationale: Conserva a construção intensiva, de sabor semítico, e a textura poética do original, embora “geração após geração” seja mais idiomático.
- source_word: δώσουσίν σοι ἀγαλλίαμα
  choice: te darão júbilo
  rationale: Mantém a construção direta e incomum do grego. “Júbilo” comunica alegria exultante, e “te” preserva a alocução à cidade personificada sem inserir “Jerusalém” no texto.
theological_decisions:
- issue: Referente de σοι
  choice: Pronome de segunda pessoa dirigido a Jerusalém/S Sião personificada, sem explicitar o nome
  alternative: Entender a referência de modo mais amplo como Israel, ou tratar apenas da cidade sem realçar a personificação
  rationale: O contexto do cântico se dirige diretamente a Jerusalém. O pronome preserva essa voz poética sem acrescentar uma identificação ao versículo.
- issue: Sentido de “ao nome do Senhor Deus”
  choice: Conservar o idioma bíblico de aproximação reverente ao nome divino
  alternative: Traduzir explicativamente como “para adorar o Senhor Deus” ou “por causa da fama do Senhor Deus”
  rationale: A aproximação provavelmente envolve culto e reverência, mas o grego diz literalmente “ao nome”; a formulação escolhida não restringe a amplitude teológica da expressão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “presentes” e a expressão “gerações de gerações” foram mantidas deliberadamente para conservar a ênfase e a textura poética do grego. O uso de “te” sustenta a alocução direta à Jerusalém personificada; a nota oferece uma formulação mais idiomática sem substituir a ambiguidade e a força do texto principal.
