  text: And he called Sarah his daughter[a], and taking her by the hand he gave her to Tobiah as a wife, and he said, “See, according to the law of Moses, take her and bring her to your father.” And he blessed them.
translation:
  language: pt
  text: 'Então chamou Sara, sua filha, e, tomando-a pela mão, deu-a a Tobias como esposa. E disse: “Eis que, de acordo com a Lei de Moisés, receba-a[a] e leve-a até seu pai.” E os abençoou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “tome-a”. O verbo grego pode significar receber, tomar ou levar; o comando seguinte já expressa a ação de conduzi-la até o pai de Tobias.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν Σάρραν τὴν θυγατέρα αὐτοῦ
  choice: chamou sua filha Sara
  rationale: Expressa de modo natural a ação de chamar Sara e preserva explicitamente a relação familiar indicada pelo grego.
- source_word: λαβὼν τῆς χειρὸς αὐτῆς
  choice: tomando-a pela mão
  rationale: Preserva o gesto concreto e solene de conduzir a filha pela mão.
- source_word: παρέδωκεν αὐτὴν Τωβείᾳ γυναῖκα
  choice: deu-a a Tobias como esposa
  rationale: Neste contexto, παραδίδωμι descreve a entrega formal em casamento, não traição ou entrega hostil; γυναῖκα tem valor predicativo.
- source_word: Ἰδοὺ
  choice: Eis que
  rationale: Mantém o marcador de atenção e o tom solene sem recorrer a uma formulação obscura.
- source_word: κατὰ τὸν νόμον Μωυσέως
  choice: de acordo com a Lei de Moisés
  rationale: Conserva a referência explícita a Moisés e a fundamentação legal da união.
- source_word: κομίζου
  choice: receba-a
  rationale: O imperativo pode significar receber, tomar ou levar. Aqui, “receba-a” distingue a aceitação da noiva do movimento expresso pelo imperativo seguinte.
- source_word: ἄπαγε πρὸς τὸν πατέρα σου
  choice: leve-a para a casa de seu pai
  rationale: ἄπαγε expressa condução para longe do falante rumo ao pai de Tobias. “Para a casa de” explicita naturalmente em português o destino doméstico pressuposto pelo contexto, embora “até seu pai” seja mais estritamente literal.
- source_word: εὐλόγησεν αὐτούς
  choice: ele os abençoou
  rationale: Tradução direta que mantém o ato de bênção sobre o casal.
theological_decisions:
- issue: Referência à Lei de Moisés numa narrativa deuterocanônica
  choice: Manter “de acordo com a Lei de Moisés” sem atenuação nem comentário doutrinário.
  alternative: “de acordo com a lei” ou “segundo a nossa lei”
  rationale: O texto grego menciona Moisés explicitamente e apresenta o casamento como conforme à lei; a tradução não deve apagar nem ampliar essa afirmação narrativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Eis que” conserva a solenidade do discurso jurídico-familiar. O nome Τωβείας foi vertido pela forma portuguesa tradicional “Tobias”.
