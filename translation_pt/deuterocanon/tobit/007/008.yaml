  text: And Edna his wife and Sarah his daughter wept[a], and they welcomed them eagerly.
translation:
  language: pt
  text: E Edna, sua mulher, e Sara, sua filha choraram e os acolheram de bom grado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “calorosamente” ou “com toda a disposição”; o advérbio grego ressalta uma hospitalidade pronta e sincera.
