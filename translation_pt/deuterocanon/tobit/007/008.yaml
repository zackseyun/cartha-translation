lexical_decisions:
- source_word: Ἔδνα
  choice: Edna
  rationale: Nome próprio transliterado segundo a forma tradicional e corrente em português.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: sua mulher
  rationale: Neste contexto, γυνή indica claramente a relação conjugal; “sua mulher” é natural e amplamente compreensível em português.
- source_word: Σάρρα
  choice: Sara
  rationale: Emprega-se a forma tradicional portuguesa do nome próprio.
- source_word: ἡ θυγάτηρ αὐτοῦ
  choice: sua filha
  rationale: Designação familiar direta, com o possessivo expresso de modo idiomático.
- source_word: ἔκλαυσαν
  choice: choraram
  rationale: O aoristo descreve o ato de chorar sem exigir que se acrescente “começaram a”.
- source_word: ὑπεδέξαντο
  choice: acolheram
  rationale: O verbo denota receber ou acolher alguém, especialmente em contexto de hospitalidade; “acolheram” comunica bem essa dimensão relacional.
- source_word: αὐτοὺς
  choice: os
  rationale: Pronome objeto que retoma os visitantes, vertido de maneira concisa em português.
- source_word: προθύμως
  choice: de bom grado
  rationale: A expressão transmite disposição voluntária, pronta e cordial, preservando melhor a força do advérbio do que um simples “prontamente”.
