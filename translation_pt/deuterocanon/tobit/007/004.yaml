base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/004.yaml
  text: And he said to them[a], “Do you know Tobit our brother?”
translation:
  language: pt
  text: 'E ele lhes perguntou: “Vocês conhecem Tobit, nosso irmão[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nosso parente”. O grego diz literalmente “nosso irmão”, provavelmente usando “irmão” como termo de parentesco mais amplo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτοῖς
  choice: E ele lhes perguntou
  rationale: Embora εἶπεν signifique literalmente «disse», a fala introduzida é uma pergunta; «perguntou» expressa naturalmente em português a função da fórmula sem alterar seu conteúdo.
- source_word: Γινώσκετε
  choice: Vocês conhecem
  rationale: No contexto, o presente pergunta se os interlocutores conhecem pessoalmente Tobit. «Vocês conhecem» é claro e natural em português moderno.
- source_word: Τωβεὶτ
  choice: Tobit
  rationale: Mantém a forma tradicional e reconhecível do nome em português, correspondente ao grego Τωβεὶτ.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: nosso irmão
  rationale: Preserva a imagem familiar do grego. Aqui, «irmão» provavelmente indica parentesco mais amplo ou solidariedade de grupo, não necessariamente um irmão biológico.
theological_decisions:
- issue: Sentido de ἀδελφός como termo de parentesco, e não necessariamente irmão biológico
  choice: nosso irmão
  alternative: nosso parente
  rationale: A tradução principal conserva a expressão concreta e ambígua do grego, enquanto a nota esclarece o provável alcance social ou familiar sem impor uma relação genealógica específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com uso de «vocês» para o plural. A formulação evita rigidez excessiva e conserva a linguagem familiar do texto grego.
