base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/018.yaml
  text: And Raguel called Edna his wife and said to her[a], “Sister[b], prepare the other chamber and bring her in there.”
translation:
  language: pt
  text: 'Então Raguel chamou Edna, sua mulher, e lhe disse: “Irmã[a], prepare o outro quarto[b] e leve-a para lá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmã” é uma forma literal de Raguel se dirigir à esposa; não indica aqui parentesco biológico.
    reason: cultural_note
  - marker: b
    text: Ou “aposento interior”. O termo grego pode designar um quarto, aposento ou cômodo interno.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφή
  choice: Irmã
  rationale: Mantém o vocativo literal dirigido à esposa, característico da linguagem familiar antiga, sem acrescentar uma interpretação afetiva ausente do grego.
- source_word: ἑτοίμασον
  choice: prepare
  rationale: Expressa de modo natural e direto o imperativo de tornar o aposento pronto.
- source_word: τὸ ἕτερον ταμεῖον
  choice: o outro quarto
  rationale: Neste contexto doméstico e nupcial, “quarto” comunica com clareza o sentido de aposento interior de ταμεῖον; “outro” traduz diretamente ἕτερον.
- source_word: εἴσαγε αὐτήν
  choice: leve-a para lá
  rationale: Reproduz naturalmente a ordem de conduzir Sara para dentro do aposento mencionado, conservando a direção indicada pelo contexto.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluidez brasileira. “Quarto” foi preferido a “câmara” por ser mais natural no uso moderno, sem perder o contexto doméstico.
