  yaml_path: translation/deuterocanon/tobit/007/017.yaml
  text: Take courage[a], child; may the Lord of heaven and earth grant you favor instead of this sorrow of yours. Take courage, daughter.
translation:
  language: pt
  text: — Tenha coragem, criança! Que o Senhor do céu e da terra lhe conceda favor[a] em lugar desta sua tristeza. Tenha coragem, filha!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “graça”; o grego χάρις pode ter ambos os sentidos aqui.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θάρσει
  choice: Tenha coragem
  rationale: O imperativo de θαρσέω encoraja diretamente alguém em aflição. “Tenha coragem” é natural em português moderno e permite conservar a repetição do grego.
- source_word: τέκνον
  choice: minha filha
  rationale: τέκνον é uma forma afetuosa de tratamento filial e não especifica o sexo por si só; porém, o contexto imediato e o vocativo final θύγατερ identificam a destinatária como mulher. “Minha filha” soa natural em português nesse tipo de fala, embora o possessivo esteja implícito na relação, não expresso lexicalmente.
- source_word: ὁ κύριος
  choice: o Senhor
  rationale: Neste contexto judaico de bênção e oração, κύριος funciona como título divino e é adequadamente traduzido por “Senhor”.
- source_word: τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: do céu e da terra
  rationale: Mantém a expressão bíblica abrangente que apresenta Deus como Senhor de toda a criação.
- source_word: δῴη
  choice: Que ... conceda
  rationale: O optativo expressa desejo ou oração. A construção portuguesa com “Que” e o subjuntivo reproduz naturalmente essa força.
- source_word: σοι χάριν
  choice: lhe conceda favor
  rationale: χάρις designa aqui favor ou benefício gracioso numa bênção dirigida a alguém aflito. “Favor” evita impor um sentido teológico técnico, sem excluir a alternativa “graça”.
- source_word: ἀντὶ τῆς λύπης σου ταύτης
  choice: em lugar desta sua tristeza
  rationale: ἀντί indica substituição ou troca, e λύπη denota tristeza ou pesar. A formulação conserva tanto a ideia de substituição quanto a referência pessoal.
- source_word: θύγατερ
  choice: filha
  rationale: O vocativo feminino é mantido explicitamente, preservando o fechamento afetuoso e a repetição da exortação.
theological_decisions:
- issue: Tradução de χάρις numa oração a Deus
  choice: favor
  alternative: graça
  rationale: O contexto é uma bênção de consolo, não uma exposição doutrinária. “Favor” comunica uma dádiva benevolente de Deus sem sobrecarregar o termo com um sentido teológico posterior; “graça” continua sendo uma tradução lexicalmente possível e é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. O discurso direto é marcado por travessão. A repetição de “Tenha coragem” é preservada. Emprega-se “lhe” para a destinatária, evitando regionalismo excessivo na escolha entre “te” e “você”.
