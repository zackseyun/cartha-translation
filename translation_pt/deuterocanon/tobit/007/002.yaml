base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/002.yaml
  text: And Edna said to his wife[b][a], “How much the young man Tobit resembles my nephew!”
translation:
  language: pt
  text: 'E Edna disse à esposa dele[a]: “Como o jovem Tobit se parece com meu sobrinho[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego diz: “Edna disse à esposa dele”. No paralelo semítico, Raguel fala com Edna, sua esposa. O contexto pode indicar uma irregularidade textual ou de transmissão.'
    reason: textual_variant
  - marker: b
    text: Ou “meu primo”. O termo grego também pode ser usado de modo mais amplo para um parente próximo do sexo masculino.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν
  choice: E ... disse
  rationale: Mantém a ligação narrativa simples do grego e usa o pretérito perfeito, natural na narração em português.
- source_word: Ἔδνα
  choice: Edna
  rationale: Transliteração corrente do nome próprio.
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: à esposa dele
  rationale: γυνή significa claramente “esposa” neste contexto; “dele” preserva o possessivo masculino αὐτοῦ e, com isso, a dificuldade textual do grego, sem corrigi-la silenciosamente.
- source_word: Ὡς ὅμοιος
  choice: Como ... é parecido com
  rationale: Reproduz de forma natural o valor exclamativo de ὡς e a relação de semelhança expressa por ὅμοιος com dativo.
- source_word: ὁ νεανίσκος
  choice: este jovem
  rationale: νεανίσκος designa um homem jovem; o demonstrativo torna natural em português a exclamação feita diante dele, sem alterar o referente.
- source_word: Τωβεὶτ
  choice: Tobit
  rationale: Forma portuguesa de transliteração coerente com o nome grego e com a identificação do personagem.
- source_word: τῷ ἀνεψιῷ μου
  choice: meu sobrinho
  rationale: ἀνεψιός pode designar sobrinho ou, mais amplamente, primo/parente próximo; “sobrinho” preserva o sentido mais específico, enquanto a alternativa é registrada em nota.
theological_decisions:
- issue: Identificação de quem fala e referência do possessivo
  choice: 'Seguir o grego tal como transmitido: “Edna disse à esposa dele”.'
  alternative: “Raguel disse a Edna, sua esposa”.
  rationale: O texto grego nomeia Ἔδνα como sujeito e traz o possessivo masculino αὐτοῦ, produzindo uma formulação difícil. O paralelo semítico indireto apresenta Raguel falando a Edna, sua esposa. Como o grego é a âncora primária, a tradução conserva sua leitura e informa a irregularidade em nota, sem emenda silenciosa.
- issue: Grau de parentesco em ἀνεψιός
  choice: “meu sobrinho” no texto.
  alternative: “meu primo” ou “meu parente”.
  rationale: O termo grego admite alguma amplitude de parentesco. A tradução adota o sentido específico comum, mas preserva a ambiguidade lexical em nota.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A formulação deliberadamente incomum “à esposa dele” conserva a dificuldade do texto grego; as notas esclarecem tanto a variante textual quanto a amplitude do termo de parentesco.
