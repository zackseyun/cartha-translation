base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/006.yaml
  text: And Raguel sprang up, kissed him warmly, and wept.
translation:
  language: pt
  text: Então Raguel se levantou de um salto, beijou-o com carinho[a] e chorou.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego é mais intenso que o simples verbo “beijar” e indica marcada afeição; também pode sugerir beijos repetidos.
    reason: lexical_alternative
  - marker: b
    text: A referência semítica paralela fornecida é uma retroversão hebraica muito posterior e não determina a redação deste versículo; a tradução se baseia no testemunho grego.
    reason: textual_variant
lexical_decisions:
- source_word: ἀνεπήδησεν
  choice: se levantou de um salto
  rationale: Expressa a súbita e vigorosa reação de Raguel, preservando a vivacidade do verbo grego sem sugerir necessariamente um salto literal.
- source_word: κατεφίλησεν
  choice: beijou-o com carinho
  rationale: O verbo composto tem força maior que o simples φιλέω e comunica um beijo afetuoso, possivelmente insistente; a formulação preserva essa intensidade sem acrescentar um abraço.
- source_word: ἔκλαυσε
  choice: chorou
  rationale: É a forma narrativa mais natural e digna em português para o derramamento de lágrimas provocado pela emoção.
- source_word: Ῥαγουὴλ
  choice: Raguel
  rationale: Mantém a forma tradicional portuguesa correspondente à transliteração do nome grego.
- source_word: αὐτόν
  choice: -o
  rationale: O pronome masculino retoma, pelo contexto, Tobias, filho de Tobit.
