  text: And he called Edna his wife, and taking a document, he wrote out a marriage contract[a], and they sealed it.
translation:
  language: pt
  text: E ele chamou Edna, sua esposa; tomou um documento, redigiu um contrato de casamento[a] e eles o selaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um acordo por escrito” ou simplesmente “um contrato”. O termo grego se refere a um documento legal formal; “contrato de casamento” foi adotado por causa do contexto imediato.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: chamou
  rationale: Expressa diretamente o ato de chamar, sem impor uma formalidade maior que a indicada pelo grego.
- source_word: Ἔδναν τὴν γυναῖκα αὐτοῦ
  choice: Edna, sua esposa
  rationale: Neste contexto doméstico, γυνή significa claramente “esposa”; o nome próprio segue a forma tradicional Edna.
- source_word: λαβὼν βιβλίον
  choice: pegou um documento
  rationale: Embora βιβλίον possa designar livro ou rolo, aqui se trata do suporte escrito usado para formalizar e selar um acordo legal.
- source_word: ἔγραψεν συγγραφήν
  choice: redigiu um contrato de casamento
  rationale: συγγραφή designa um acordo formal por escrito; “redigiu” é natural para a elaboração do documento, e “de casamento” explicita a natureza do contrato indicada pelo contexto imediato.
- source_word: ἐσφραγίσαντο
  choice: eles o selaram
  rationale: A forma verbal está na terceira pessoa do plural e descreve concretamente a aposição de selo ao contrato; o pronome retoma “contrato”.
