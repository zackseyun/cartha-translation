base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/005.yaml
  text: They said[a], “He is alive and well.” And Tobiah said[b], “He is my father.”
translation:
  language: pt
  text: 'E eles disseram: “Ele está vivo e bem de saúde.” E Tobias disse: “Ele é meu pai.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ζῇ καὶ ὑγιαίνει
  choice: Sim, ele está vivo e passa bem
  rationale: A construção grega, literalmente “e vive e tem saúde”, constitui uma resposta afirmativa sobre a vida e o estado de saúde de Tobit. Em português corrente, “Sim, ele está vivo e passa bem” preserva os dois elementos e soa natural no diálogo.
- source_word: Πατήρ μου ἐστιν
  choice: Ele é meu pai
  rationale: A ordem natural em português explicita o sujeito pronominal e conserva sem ambiguidade a identificação feita por Tobias.
- source_word: Τωβίας
  choice: Tobias
  rationale: “Tobias” é a forma portuguesa tradicional, natural e amplamente reconhecida do nome grego Τωβίας; evita introduzir no português a forma inglesa “Tobiah”.
theological_decisions:
- issue: Forma do nome Τωβίας
  choice: Tobias
  alternative: Tobias (com tentativa de distinção gráfica moderna entre pai e filho)
  rationale: O grego emprega aqui Τωβίας, e a tradição portuguesa normalmente verte o nome como “Tobias”. O versículo identifica explicitamente o pai, de modo que não é necessário criar uma distinção nominal ausente desta forma grega.
translation_notes:
  register: Português moderno, digno e conversacional, com ampla legibilidade brasileira. A fórmula “está vivo e passa bem” reproduz idiomaticamente o par ζῇ καὶ ὑγιαίνει sem perder a referência explícita à vida e à saúde.
