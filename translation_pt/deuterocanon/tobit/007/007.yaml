  source_fidelity: O texto traduz com fidelidade o grego. A expressão inicial é elíptica (Ὁ τοῦ καλοῦ καὶ ἀγαθοῦ ἀνθρώπου), e o suprimento de “filho” é contextual e devidamente assinalado em nota. “Homem honrado e bom” mantém de modo natural a dupla qualificação καλός/ἀγαθός. “Havia perdido a visão” comunica idiomaticamente o sentido de ἀπώλεσεν τοὺς ὀφθαλμοὺς ἑαυτοῦ sem sugerir, em português, a remoção física dos olhos; a nota preserva a formulação concreta do grego. A sequência de tristeza e choro corresponde a ἐλυπήθη καὶ ἔκλαυσεν.
