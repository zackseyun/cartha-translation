base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/007.yaml
  text: And he said to him[a], “He is the son of a noble and good man.” And when he heard that Tobit had lost his eyes[b], he was grieved and wept.
translation:
  language: pt
  text: 'E ele lhe disse[a]: “Ele é filho de um homem honrado e bom.” Quando ouviu que Tobit havia perdido a visão[b], ficou triste e chorou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego é elíptico neste ponto; literalmente, algo como “o do homem honrado e bom”. A palavra “filho” foi suprida conforme o sentido provável no contexto.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “havia perdido os próprios olhos”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ τοῦ καλοῦ καὶ ἀγαθοῦ ἀνθρώπου
  choice: Ele é filho de um homem honrado e bom
  rationale: A expressão grega é elíptica e omite o termo que explicita a relação familiar. Pelo contexto, “filho” comunica com clareza o sentido provável, enquanto “honrado e bom” preserva a dupla qualificação sem repetição artificial.
- source_word: καλοῦ
  choice: honrado
  rationale: Na associação com ἀγαθοῦ, o adjetivo provavelmente destaca caráter digno ou respeitável. “Honrado” é natural em português e mantém distinção em relação a “bom”.
- source_word: ἀγαθοῦ
  choice: bom
  rationale: É a correspondência mais direta e abrangente para a qualidade moral expressa pelo adjetivo.
- source_word: ἀκούσας
  choice: quando ouviu
  rationale: A oração temporal traduz naturalmente o particípio aoristo e conserva a sequência narrativa.
- source_word: ἀπώλεσεν τοὺς ὀφθαλμοὺς ἑαυτοῦ
  choice: havia perdido a visão
  rationale: Embora o grego diga literalmente que Tobit “perdeu os próprios olhos”, em português essa formulação pode sugerir a perda física dos globos oculares. “Perdeu a visão” comunica de modo natural o sentido contextual, e a imagem concreta é registrada em nota.
- source_word: ἐλυπήθη
  choice: ficou triste
  rationale: Expressa com clareza e dignidade a reação de pesar, em linguagem corrente e natural.
- source_word: ἔκλαυσεν
  choice: chorou
  rationale: É a tradução direta, clara e atual do verbo, sem perda da força emocional.
theological_decisions:
- issue: Fórmula elíptica de identificação na oração inicial
  choice: Suprir “filho” no texto
  alternative: “Ele é do homem honrado e bom” ou uma reprodução igualmente elíptica
  rationale: O grego transmitido é abrupto e não nomeia a relação. A inserção mínima de “filho” corresponde ao sentido contextual mais provável, mas a nota preserva a incerteza textual.
- issue: Expressão concreta para a cegueira de Tobit
  choice: Traduzir no texto como “havia perdido a visão”
  alternative: “Havia perdido os olhos”
  rationale: A alternativa literal poderia ser entendida em português como perda física dos olhos. O texto principal comunica o sentido sem decidir além do necessário, enquanto a nota conserva a formulação concreta do grego.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno, porém acessível. “Honrado e bom” distingue os dois adjetivos gregos; “ficou triste e chorou” evita arcaísmo sem enfraquecer a emoção.
