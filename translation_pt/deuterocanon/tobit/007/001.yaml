base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/001.yaml
  text: And he came to Ecbatana and arrived at the house of Raguel[a], and Sarah also met him. She greeted him, and he greeted them[b], and he brought them into the house.
translation:
  language: pt
  text: Ele chegou a Ecbátana e foi à casa de Raguel. Sara também veio ao encontro dele e o cumprimentou; ele, por sua vez, cumprimentou-os. Depois, ele os levou para dentro da casa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego não identifica explicitamente o sujeito de «ele os levou para dentro da casa».
    reason: alternative_reading
lexical_decisions:
- source_word: ἦλθεν
  choice: chegou
  rationale: No contexto do deslocamento até Ecbátana, «chegou» expressa naturalmente a entrada na cidade.
- source_word: παρεγένετο
  choice: foi à
  rationale: Após «chegou a Ecbátana», indica o movimento até o destino específico, a casa de Raguel, sem repetir de modo artificial o verbo «chegar».
- source_word: οἰκίαν
  choice: casa
  rationale: Designa diretamente a residência física e é a opção mais clara no contexto.
- source_word: ὑπήντησεν
  choice: veio ao encontro
  rationale: O verbo pode indicar sair ou ir ao encontro de alguém; esta formulação o distingue do cumprimento mencionado em seguida.
- source_word: ἐχαιρέτισεν
  choice: cumprimentou
  rationale: Equivalente corrente e direto para o ato de saudar.
- source_word: αὐτὸς αὐτούς
  choice: ele, por sua vez, cumprimentou os dois
  rationale: Preserva a mudança para o sujeito masculino e torna claro que o plural αὐτούς se refere aos dois presentes do grupo anfitrião, sem nomeá-los além do que o grego permite.
- source_word: εἰσήγαγεν
  choice: levou para dentro
  rationale: Expressa com naturalidade o movimento de conduzir os visitantes ao interior da casa.
- source_word: Ἐκβάτανα
  choice: Ecbátana
  rationale: Forma portuguesa consagrada do nome geográfico.
- source_word: Ῥαγουήλ
  choice: Raguel
  rationale: Transliteração tradicional em português que corresponde à forma grega.
- source_word: Σάρρα
  choice: Sara
  rationale: Forma corrente em português para o nome bíblico representado pelo grego Σάρρα.
theological_decisions:
- issue: Referência do sujeito na oração final
  choice: ele os levou para dentro da casa
  alternative: Raguel os levou para dentro de casa
  rationale: O verbo grego εἰσήγαγεν está no singular, mas o sujeito não é nomeado. O pronome preserva essa indeterminação textual, em vez de identificar explicitamente Raguel ou Sara.
- issue: Referente do plural αὐτούς após a saudação de Sara
  choice: os dois
  alternative: os cumprimentou
  rationale: O objeto plural contrasta com o singular anterior («o cumprimentou»). «Os dois» comunica o número sem acrescentar nomes que o texto grego não fornece neste versículo.
translation_notes:
  register: Português atual, digno e acessível, com leitura natural no Brasil e compreensão internacional. A coordenação repetitiva do grego narrativo foi suavizada sem eliminar a sequência dos acontecimentos; manteve-se a ambiguidade do sujeito na oração final.
