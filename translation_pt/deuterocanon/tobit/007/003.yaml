base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/003.yaml
  text: And Raguel asked them[a], “Where are you from, brothers?” And they said to him, “We are from the sons of Naphtali[b], the captives from Nineveh.”
translation:
  language: pt
  text: 'Raguel lhes perguntou: “De onde vocês são, irmãos?” Eles lhe responderam: “Somos dos filhos de Naftali[a], os cativos de Nínive[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descendentes de Naftali” ou “da tribo de Naftali”. O grego diz literalmente “dos filhos de Naftali”.
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser entendida como “os cativos em Nínive”. O grego diz literalmente “os cativos de Nínive” e destaca a condição de pessoas deportadas.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἠρώτησεν
  choice: perguntou
  rationale: É o equivalente narrativo direto e natural do verbo grego, sem acrescentar a ideia de interrogatório.
- source_word: Πόθεν ἐστέ
  choice: De onde vocês são?
  rationale: Expressa em português corrente a pergunta sobre a origem dos interlocutores.
- source_word: ἀδελφοί
  choice: irmãos
  rationale: Mantém o vocativo masculino explícito do grego e seu tom cordial.
- source_word: Ἐκ τῶν υἱῶν Νεφθαλεὶ
  choice: Somos dos filhos de Naftali
  rationale: Conserva a imagem genealógica e tribal de υἱῶν, embora em contexto a expressão signifique descendência ou pertencimento à tribo.
- source_word: τῶν αἰχμαλώτων
  choice: os cativos
  rationale: Preserva a força coercitiva do termo grego, que designa pessoas levadas ou mantidas em cativeiro.
- source_word: ἐκ Νινευή
  choice: de Nínive
  rationale: Traduz diretamente a preposição ἐκ e preserva a concisão e a possível ambiguidade da relação entre os cativos e Nínive.
