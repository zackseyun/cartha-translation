  yaml_path: translation/deuterocanon/tobit/007/012.yaml
  text: And Raguel said[a], “Take her from now on according to the judgment. You are her brother, and she is yours[c][b]. And may the merciful God prosper what is best for you.”
translation:
  language: pt
  text: 'E Raguel disse: “Receba-a desde agora, conforme a decisão.[a] Você é irmão dela,[b] e ela é sua. Que o Deus misericordioso lhes conceda o que há de melhor.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “conforme a sentença” ou “conforme o julgamento”.
    reason: lexical_alternative
  - marker: b
    text: “Irmão” aqui é linguagem de parentesco e, neste contexto, provavelmente designa um parente próximo elegível para o casamento segundo o costume familiar, não um irmão literal.
    reason: cultural_note
  - marker: c
    text: 'Mais literalmente: “O Deus misericordioso fará prosperar para vocês as melhores coisas”. O futuro grego também pode ser entendido como uma declaração: “O Deus misericordioso lhes concederá o que há de melhor”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κομίζου
  choice: Receba-a
  rationale: O imperativo médio, no contexto da entrega de Sara em casamento, comunica a ideia de recebê-la como esposa. “Receba-a” é natural em português e evita sugerir mera posse física.
- source_word: ἀπὸ τοῦ νῦν
  choice: desde agora
  rationale: Expressa diretamente o início, naquele momento, da nova condição matrimonial.
- source_word: κατὰ τὴν κρίσιν
  choice: conforme a decisão
  rationale: κρίσις pode indicar juízo, sentença ou decisão. “Decisão” preserva o teor formal ou jurídico sem especificar além do que o grego permite.
- source_word: ἀδελφὸς
  choice: irmão
  rationale: Mantém o termo explícito do grego e sua linguagem de parentesco; uma nota esclarece que, neste contexto matrimonial, não se trata de irmão literal.
- source_word: ἐλεήμων
  choice: misericordioso
  rationale: Equivalente direto e teologicamente apropriado para aquele que demonstra misericórdia.
- source_word: εὐοδώσει
  choice: conceda
  rationale: No contexto de bênção, transmite de modo natural a ideia de Deus fazer prosperar ou levar a bom êxito, sem introduzir a conotação econômica moderna de “prosperar”.
- source_word: τὰ κάλλιστα
  choice: o que há de melhor
  rationale: Representa naturalmente o superlativo neutro plural, literalmente “as melhores coisas”, mantendo sua abrangência.
theological_decisions:
- issue: Termo de parentesco em contexto matrimonial
  choice: Manter “irmão” no texto principal e esclarecer seu sentido amplo em nota.
  alternative: Traduzir diretamente como “parente” ou “familiar”.
  rationale: O grego traz ἀδελφός. Preservar “irmão” retém a forma da linguagem familiar e a tensão do texto, enquanto a nota impede a leitura equivocada de que Sara seria irmã literal de Tobias.
- issue: Futuro do indicativo em fórmula de bênção
  choice: 'Traduzir como desejo ou oração: “Que o Deus misericordioso lhes conceda...”'
  alternative: 'Traduzir como afirmação futura: “O Deus misericordioso lhes concederá...”'
  rationale: Embora εὐοδώσει esteja no futuro do indicativo, no contexto da fala de bênção a formulação optativa em português comunica melhor a função pragmática, sem negar a possibilidade de leitura declarativa.
- issue: Alcance do pronome plural ὑμῖν
  choice: Usar “lhes”, referindo-se ao casal.
  alternative: Usar “a vocês” ou explicitar “aos dois”.
  rationale: “Lhes” preserva o plural do grego e aplica a bênção a Tobias e Sara sem acrescentar uma explicitação ausente do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construções naturais tanto no Brasil quanto em outros contextos lusófonos. “Receba-a” mantém a solenidade adequada à entrega matrimonial; “lhes conceda” evita a possível associação contemporânea de “prosperar” apenas com riqueza material. Os marcadores foram posicionados junto às expressões que explicam.
