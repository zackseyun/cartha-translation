  yaml_path: translation/deuterocanon/tobit/007/010.yaml
  text: And he conveyed the matter to Raguel. And Raguel said to Tobiah, “Eat, drink, and be glad, for it is fitting for you to take my child; but I will explain the truth.”
translation:
  language: pt
  text: 'E ele comunicou o assunto a Raguel. Então Raguel disse a Tobias: “Coma, beba e alegre-se, pois convém que você receba minha filha em casamento. Mas vou lhe explicar a verdade.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετέδωκεν τὸν λόγον
  choice: comunicou o assunto
  rationale: A expressão indica transmitir a questão ou proposta em pauta; “assunto” evita o literalismo pouco natural de “palavra”.
- source_word: ἡδέως γίνου
  choice: alegre-se
  rationale: Convite idiomático a estar contente e desfrutar da ocasião; preserva o tom acolhedor.
- source_word: καθήκει
  choice: é justo
  rationale: Exprime aquilo que convém, cabe ou é apropriado, aqui no contexto do direito ou adequação matrimonial.
- source_word: τὸ παιδίον μου λαβεῖν
  choice: receba minha filha em casamento
  rationale: Embora παιδίον seja formalmente neutro (“meu filho/minha criança”), o contexto identifica Sara; λαβεῖν, neste contexto, refere-se a tomá-la como esposa. A explicitação produz português natural sem importar uma conclusão externa ao relato.
- source_word: ὑποδείξω τὴν ἀλήθειαν
  choice: vou lhe contar a verdade
  rationale: ὑποδείκνυμι pode significar mostrar, explicar ou dar a conhecer; “contar” é natural diante da revelação verbal que se segue.
theological_decisions:
- issue: Natureza da reivindicação matrimonial de Tobias
  choice: “é justo que você receba minha filha em casamento”
  alternative: “cabe a você tomar minha filha”
  rationale: A tradução mantém a ideia de conveniência ou legitimidade expressa por καθήκει, sem especificar além do texto a base jurídica ou teológica dessa legitimidade.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” e imperativos naturais. O nome Τωβείαν foi vertido como “Tobias”, forma portuguesa tradicional e amplamente reconhecível; Raguel foi preservado.
