  text: I gave my child to seven men[a], and whenever they went in to her, they died during the night. But for now, be cheerful. And Tobiah said[b], “I will taste nothing here until you settle and conclude the matter with me.”
translation:
  language: pt
  text: '“Eu dei minha filha em casamento a sete homens[a], e, cada vez que eles se uniam a ela, morriam durante a noite. Mas, por enquanto, tenha ânimo.” Então Tobias disse[b]: “Não provarei nada aqui até que vocês estabeleçam e concluam comigo este acordo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “dei minha filha a sete homens”. Pelo contexto, trata-se de dá-la em casamento; “sete maridos” também é uma tradução possível.
    reason: lexical_alternative
  - marker: b
    text: 'A última oração é difícil no texto grego preservado aqui. A tradução expressa o sentido aparente: Tobias se recusa a comer até que o acordo matrimonial seja formalmente estabelecido com ele.'
    reason: textual_variant
lexical_decisions:
- source_word: τὸ παιδίον μου
  choice: minha filha
  rationale: Embora παιδίον signifique literalmente “criança” ou “filho”, o referente é Sara, filha de Raguel. Em português, “minha filha” é a forma familiar natural e evita a ambiguidade de gênero que “minha criança” criaria.
- source_word: ἑπτὰ ἀνδράσιν
  choice: a sete homens
  rationale: ἀνήρ pode significar “homem” ou “marido”. Mantém-se “homens” para não explicitar no substantivo mais do que a forma grega, enquanto “dei ... em casamento” torna clara a relação indicada pelo contexto.
- source_word: ἔδωκα
  choice: dei ... em casamento
  rationale: O verbo significa literalmente “dei”, mas, neste contexto, descreve a entrega da filha em casamento. A explicitação produz português natural sem transformar ἀνδράσιν em “maridos”.
- source_word: ὁπότε ἐὰν εἰσεπορεύοντο πρὸς αὐτήν
  choice: cada vez que eles se uniam a ela
  rationale: A expressão é um eufemismo de contexto conjugal e sexual. “Uniam-se a ela” preserva o caráter indireto e soa mais natural em português do que o decalque “entravam para junto dela”.
- source_word: ἀπέθνησκον ὑπὸ νύκτα
  choice: morriam durante a noite
  rationale: O imperfeito retrata o resultado repetido, e ὑπὸ νύκτα indica o período noturno.
- source_word: ἀλλὰ τὸ νῦν ἔχων ἡδέως γίνου
  choice: Mas, por enquanto, tenha ânimo
  rationale: A construção transmitida é pouco usual. “Tenha ânimo” comunica a exortação a uma disposição confiante ou favorável sem recorrer a linguagem arcaica.
- source_word: Οὐ γεύομαι οὐδὲν ὧδε
  choice: Não provarei nada aqui
  rationale: Preserva a imagem de γεύομαι, “provar”, que neste contexto expressa a recusa de comer.
- source_word: ἕως ἂν στήσητε καὶ σταθῆτε πρὸς μέ
  choice: até que vocês estabeleçam e concluam comigo este acordo
  rationale: A cláusula grega é difícil e seus dois verbos não admitem aqui um decalque claro. A tradução conserva a duplicidade verbal e expressa o sentido contextual provável de formalizar e completar o acordo matrimonial.
