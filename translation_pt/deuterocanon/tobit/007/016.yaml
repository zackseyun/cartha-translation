  text: And he did as he said and brought her in there[a], and she wept. Then he received the tears of his daughter and said to her,
translation:
  language: pt
  text: 'E ele fez como havia dito e a levou para lá; ela chorou. Então ele acolheu as lágrimas de sua filha[a] e lhe disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em grego, literalmente: “da filha dela”. Pelo contexto, trata-se da filha de Raguel, Sara.'
    reason: Registra a forma pronominal feminina do texto grego e explica a resolução contextual adotada na tradução.
lexical_decisions:
- source_word: ἐποίησεν ὡς εἶπεν
  choice: fez como havia dito
  rationale: Reproduz naturalmente a expressão grega e usa o mais-que-perfeito composto para deixar clara a anterioridade da fala no fluxo narrativo.
- source_word: εἰσήγαγεν αὐτὴν ἐκεῖ
  choice: a levou para lá
  rationale: Expressa o movimento de conduzir ou levar alguém para dentro do lugar mencionado, preservando o advérbio ἐκεῖ sem sugerir coerção.
- source_word: ἔκλαυσεν
  choice: ela chorou
  rationale: O sujeito implícito mais próximo e natural é a mulher que acaba de ser mencionada. “Chorou” é corrente e digno em português.
- source_word: ἀπεδέξατο τὰ δάκρυα
  choice: acolheu as lágrimas
  rationale: “Acolheu” preserva o valor figurado e compassivo de ἀποδέχομαι com “lágrimas” melhor do que o mais literal e pouco natural “recebeu”.
- source_word: τῆς θυγατρὸς αὐτῆς
  choice: de sua filha
  rationale: No contexto, a filha é Sara e o agente é Raguel; a formulação portuguesa comunica essa relação de modo natural, enquanto a nota registra a forma feminina do pronome grego.
- source_word: εἶπεν αὐτῇ
  choice: lhe disse
  rationale: Forma idiomática e concisa de introduzir a fala dirigida a ela, que continua no versículo seguinte.
theological_decisions:
- issue: Referência do pronome em τῆς θυγατρὸς αὐτῆς
  choice: Entender contextualmente como referência à filha de Raguel
  alternative: Traduzir de modo estritamente formal como “da filha dela”
  rationale: O pronome grego está no feminino, mas o encadeamento narrativo apresenta Raguel como aquele que age e se dirige a Sara. A leitura contextual evita introduzir outra relação materna sem apoio no episódio, sem ocultar a forma transmitida, que é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O ponto e vírgula organiza a sequência narrativa; “acolheu as lágrimas” mantém a imagem afetiva do grego. O marcador [a] aparece imediatamente após a expressão a que se refere.
