translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Mantêm-se os nomes Tobias, Rafael e Azarias conforme uso corrente. A repetição de “assunto” foi moderada por meio do pronome “ele”, preservando a referência clara ao mesmo tema.
