    rationale: A sequência grega é «Azarias, irmão»; a inversão proposta evita a possível conotação de título eclesiástico em português.
  - severity: low
    issue: Referência em «o assunto de que você falava»
    rationale: O relativo grego está no plural/neutro («as coisas sobre as quais falavas»), seguido de «o assunto» no singular. «O que você dizia» preserva essa transição sem especificar indevidamente o conteúdo.
