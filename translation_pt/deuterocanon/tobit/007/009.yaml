  yaml_path: translation/deuterocanon/tobit/007/009.yaml
  text: And they slaughtered a ram from the flock and set out many dishes. Then Tobiah said to Raphael, “Azariah, brother, speak about the matter you were talking about on the journey, and let the matter be brought to completion.”
translation:
  language: pt
  text: 'Então abateram um carneiro do rebanho e serviram muitos pratos. Tobias disse a Rafael: “Azarias, irmão, fale sobre o que você dizia durante a viagem, e que o assunto seja concluído.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθυσαν κριὸν προβάτων
  choice: mataram um carneiro do rebanho
  rationale: Neste contexto de preparação da refeição, ἔθυσαν indica o abate do animal; a tradução evita atribuir ao ato um caráter sacrificial não explicitado pelo contexto.
- source_word: παρέθηκαν ὄψα πλείονα
  choice: serviram muitos pratos
  rationale: παρέθηκαν significa pôr diante ou servir, enquanto ὄψα pode designar alimentos ou pratos preparados; a formulação é natural em português e preserva a ideia de abundância.
- source_word: λάλησον ὑπὲρ ὧν ἔλεγες
  choice: fale sobre o assunto de que você falava
  rationale: O relativo plural grego pode referir-se às coisas mencionadas, mas o contexto e τὸ πρᾶγμα na sequência permitem expressar o conteúdo como um único assunto, sem acrescentar especificidade.
- source_word: τελεσθήτω τὸ πρᾶγμα
  choice: que ele seja levado a termo
  rationale: Preserva a forma passiva e o sentido de fazer o assunto chegar à sua conclusão, sem explicitar antecipadamente qual é o acordo pretendido.
