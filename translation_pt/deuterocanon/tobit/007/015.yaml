  yaml_path: translation/deuterocanon/tobit/007/015.yaml
  text: And they began to eat[a]. Then Raguel called Edna his wife and said to her, “Sister[b], prepare the other room and bring her in.”
translation:
  language: pt
  text: 'E começaram a comer. Então Raguel chamou Edna, sua mulher, e lhe disse: “Irmã[a], prepare o outro quarto[b] e leve-a para dentro.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Irmã” é a forma literal de tratamento usada por Raguel para sua mulher; aqui funciona como expressão familiar e afetuosa entre marido e esposa.
    reason: cultural_note
  - marker: b
    text: Ou “o outro aposento”. O termo grego pode designar um cômodo interior ou uma câmara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο ἐσθίειν
  choice: começaram a comer
  rationale: Reproduz diretamente a construção ingressiva ἄρχομαι + infinitivo e mantém o sentido simples de ἐσθίω.
- source_word: ἐκάλεσεν
  choice: chamou
  rationale: É a forma natural no contexto doméstico e evita a formalidade excessiva de “convocou”.
- source_word: Ἀδελφή
  choice: Irmã
  rationale: Preserva a forma literal de tratamento dirigida à esposa e sua coloração cultural, explicada em nota.
- source_word: ἑτοίμασον
  choice: prepare
  rationale: Imperativo corrente, claro e semanticamente próximo do grego.
- source_word: τὸ ἕτερον ταμεῖον
  choice: o outro quarto
  rationale: ταμεῖον pode indicar aposento interior ou câmara; “quarto” é natural no contexto, enquanto “outro” traduz ἕτερον.
- source_word: εἴσαγε αὐτήν
  choice: leve-a para dentro
  rationale: Expressa o movimento de conduzir a mulher ao interior do aposento sem acrescentar um destino não explicitado no grego.
