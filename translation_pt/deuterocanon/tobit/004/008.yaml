  text: As much as you have[a], according to your abundance, give alms from it; and if you have little, do not be afraid to give alms according to that little.
translation:
  language: pt
  text: Conforme os seus recursos, dê esmolas em proporção à sua abundância; e, se você tiver pouco, não tenha medo de dar esmolas em proporção ao pouco que tem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς σοι ὑπάρχει κατὰ τὸ πλῆθος
  choice: Conforme os seus recursos... em proporção à sua abundância
  rationale: A formulação conserva a ideia de medida segundo aquilo que a pessoa possui e explicita o valor proporcional de κατά com acusativo. “Recursos” torna natural em português a referência implícita aos bens disponíveis.
- source_word: ποίησον ἐξ αὐτῶν ἐλεημοσύνην
  choice: dê esmolas
  rationale: No contexto judaico-grego de Tobit, ἐλεημοσύνη designa concretamente a ajuda material aos necessitados. “Dar esmolas” é idiomático e mantém esse sentido específico; a origem nos próprios bens já está expressa por “conforme os seus recursos”.
- source_word: ἐὰν ὀλίγον σοι ὑπάρχῃ
  choice: se você tiver pouco
  rationale: Tradução direta, clara e natural do contraste entre abundância e recursos limitados.
- source_word: κατὰ τὸ ὀλίγον
  choice: em proporção ao pouco que tem
  rationale: Preserva a repetição do princípio proporcional marcado por κατά e torna explícito, sem alterar o sentido, que se trata do pouco disponível à pessoa.
- source_word: μὴ φοβοῦ ποιεῖν ἐλεημοσύνην
  choice: não tenha medo de dar esmolas
  rationale: Mantém o sentido literal de φοβοῦ e a exortação para que a escassez não impeça a generosidade.
theological_decisions:
- issue: Sentido de ἐλεημοσύνη
  choice: esmolas / dar esmolas
  alternative: caridade; atos de misericórdia
  rationale: Em Tobit, o termo se refere especialmente à assistência material dada aos necessitados, e não apenas à caridade ou misericórdia em sentido amplo.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. O paralelismo entre abundância e escassez foi preservado, assim como a proporcionalidade da oferta.
