base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/004.yaml
  text: And do what is pleasing to her[a], and do not grieve her. Remember, child, that she faced many dangers because of you while you were in the womb; when she dies[b], bury her beside me in one grave.
translation:
  language: pt
  text: Faça o que lhe agrada e não a entristeça. Lembre-se, filho, de que ela enfrentou muitos perigos por sua causa enquanto você estava no ventre dela[a]. Quando ela morrer, sepulte-a junto de mim, numa só sepultura[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: “ela viu muitos perigos por sua causa no ventre”, expressão que se refere aos perigos que ela enfrentou enquanto o carregava durante a gestação.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “no mesmo túmulo”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ποίει τὸ ἀρεστὸν αὐτῇ
  choice: Faça o que lhe agrada
  rationale: Expressa de modo natural a ideia de fazer aquilo que é agradável ou aceitável à mãe, preservando o dativo αὐτῇ.
- source_word: μὴ λυπήσῃς αὐτήν
  choice: não a entristeça
  rationale: λυπέω indica causar tristeza, pesar ou aflição; “entristeça” é claro, atual e mantém o peso afetivo da exortação.
- source_word: μνήσθητι, παιδίον
  choice: Lembre-se, filho
  rationale: παιδίον é uma forma afetuosa de tratamento. “Filho” é natural no contexto da fala do pai a Tobias e identifica corretamente o referente, sem acrescentar o possessivo “meu”.
- source_word: πολλοὺς κινδύνους ἑόρακεν
  choice: ela enfrentou muitos perigos
  rationale: Embora a formulação grega seja literalmente “viu muitos perigos”, trata-se de uma expressão idiomática para experimentar ou enfrentar perigos.
- source_word: ἐπὶ σοὶ ἐν τῇ κοιλίᾳ
  choice: por sua causa enquanto você estava no ventre dela
  rationale: Torna explícitos em português o valor causal de ἐπὶ σοὶ e a referência de κοιλία ao ventre materno, sem apagar a ligação com a gestação.
- source_word: ὅταν ἀποθάνῃ
  choice: Quando ela morrer
  rationale: ὅταν com subjuntivo aponta para uma ocorrência futura esperada; “quando” é o equivalente português natural.
- source_word: θάψον αὐτὴν παρʼ ἐμοὶ
  choice: sepulte-a junto de mim
  rationale: παρά com dativo indica proximidade; no contexto funerário, “junto de mim” comunica o sepultamento ao lado do falante.
- source_word: ἐν ἑνὶ τάφῳ
  choice: numa só sepultura
  rationale: Conserva a ênfase de εἷς na unidade do local de sepultamento, enquanto “sepultura” abrange adequadamente τάφος.
theological_decisions:
- issue: Forma familiar de tratamento παιδίον
  choice: filho
  alternative: criança; meu filho
  rationale: “Criança” seria pouco natural como vocativo neste contexto, e “meu filho” acrescentaria um possessivo não expresso. “Filho” mantém o tom familiar e corresponde ao referente masculino conhecido.
- issue: Força idiomática de “viu muitos perigos”
  choice: ela enfrentou muitos perigos por sua causa enquanto você estava no ventre dela
  alternative: ela viu muitos perigos por sua causa no ventre
  rationale: A alternativa literal seria obscura e poderia sugerir que a mãe apenas observou perigos. A tradução escolhida comunica a experiência materna de risco sem especificar além do texto a natureza exata desses perigos.
- issue: Unidade do lugar de sepultamento
  choice: numa só sepultura
  alternative: no mesmo túmulo
  rationale: A formulação principal acompanha de perto ἐν ἑνὶ τάφῳ; a alternativa explicita que ambos seriam enterrados no mesmo local, possibilidade preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente compreensível. Os pronomes retomam a mãe mencionada no contexto. Os marcadores foram colocados junto às expressões efetivamente explicadas pelas notas.
