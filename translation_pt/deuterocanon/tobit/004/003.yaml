base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/003.yaml
  text: And calling him[a], he said, “Child, if I die, bury me, and do not neglect your mother; honor her all the days of your life,”
translation:
  language: pt
  text: 'E, chamando-o, disse: “Meu filho, se eu morrer, sepulte-me e não negligencie sua mãe[a]; honre-a todos os dias da sua vida.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não deixe de dar atenção à sua mãe” ou “não a desconsidere”. A tradição semítica paralela tem um sentido mais forte, como “não a abandone”.'
    reason: alternative_translation
lexical_decisions:
- source_word: καλέσας
  choice: chamando-o
  rationale: O particípio introduz a fala de Tobit. A construção preserva o encadeamento narrativo do grego e soa natural em português.
- source_word: Παιδίον
  choice: Meu filho
  rationale: O vocativo é afetuoso e familiar. Embora o grego não explicite o possessivo e o substantivo seja mais amplo, o contexto identifica o destinatário como filho; “meu filho” comunica naturalmente essa ternura em português.
- source_word: ἐὰν ἀποθάνω
  choice: se eu morrer
  rationale: Mantém o valor condicional de ἐάν com o subjuntivo, sem convertê-lo em “quando eu morrer”.
- source_word: θάψον με
  choice: sepulte-me
  rationale: Equivalente direto e digno do imperativo, apropriado ao registro bíblico moderno.
- source_word: μὴ ὑπερίδῃς
  choice: não negligencie
  rationale: Expressa a ideia de não deixar de considerar ou cuidar da mãe. Evita impor no texto principal o sentido mais forte de “abandonar” presente na tradição semítica paralela.
- source_word: τίμα
  choice: honre-a
  rationale: “Honrar” é a tradução ética tradicional e precisa, preservando a ressonância do dever filial.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς σου
  choice: todos os dias da sua vida
  rationale: Reproduz a abrangência solene da expressão grega em linguagem clara e corrente.
theological_decisions:
- issue: Uso da tradição semítica paralela, mais extensa e por vezes mais forte que o texto grego
  choice: Seguir de perto o texto grego e traduzir μὴ ὑπερίδῃς por “não negligencie”.
  alternative: Empregar “não abandone” ou acrescentar as instruções mais extensas da tradição semítica.
  rationale: A âncora textual fornecida é o grego de Swete. A tradição semítica paralela ajuda a confirmar a dimensão prática do dever para com a mãe, mas não justifica inserir cláusulas ausentes nem substituir silenciosamente a nuance do grego.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Emprega tratamento por “você” de forma implícita nas formas verbais e no possessivo “sua”; “sepulte-me” mantém solenidade sem arcaísmo excessivo.
