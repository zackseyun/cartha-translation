  terminology: «Pão», «roupas» e «esmola» correspondem bem aos termos gregos e ao contexto de auxílio material. «Mesquinho» no último membro comunica melhor o valor contextual de φθονεσάτω do que «avareza», sem eliminar a imagem do olho/olhar.
