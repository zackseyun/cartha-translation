base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/016.yaml
  text: Give from your bread to the hungry[a], and from your clothing to the naked. Whatever may abound to you, do as almsgiving[b], and do not let your eye be envious when you do almsgiving.
translation:
  language: pt
  text: Dê do seu pão a quem tem fome e das suas roupas aos que estão sem roupa.[a] Tudo o que lhe sobrar, dê em esmola;[b] e não deixe que seu olhar seja mesquinho ao dar esmola.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aos nus”; o termo também pode se referir aos que não têm roupa suficiente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Tudo o que você tiver em abundância, dê em esmola”.'
    reason: lexical_alternative
  - marker: c
    text: 'Literalmente: “que o seu olho não seja invejoso”; isto é, não seja mesquinho nem dê de má vontade.'
    reason: idiom_explanation
lexical_decisions:
- source_word: ἐκ τοῦ ἄρτου σου δίδου πεινῶντι
  choice: Dê do seu pão a quem tem fome
  rationale: Mantém a imagem concreta do pão e o valor partitivo de ἐκ, enquanto verte o particípio substantivado πεινῶντι de modo natural e inclusivo em português.
- source_word: ἐκ τῶν ἱματίων σου τοῖς γυμνοῖς
  choice: das suas roupas aos que estão sem roupa
  rationale: ‘Roupas’ é atual e acessível para ἱμάτια. A expressão ‘aos que estão sem roupa’ comunica o sentido social de γυμνοῖς sem soar como referência deliberada à nudez; a amplitude lexical é registrada em nota.
- source_word: πᾶν ὃ ἐὰν περισσεύσῃ σοι
  choice: Tudo o que lhe sobrar
  rationale: περισσεύω pode indicar excedente ou abundância. ‘O que lhe sobrar’ é idiomático e conserva a ideia de recursos além do necessário, sem excluir a leitura ‘o que tiver em abundância’.
- source_word: ποίει ἐλεημοσύνην
  choice: dê como esmola
  rationale: A combinação ποιέω + ἐλεημοσύνη descreve concretamente a prática de auxílio material aos necessitados. ‘Dê como esmola’ é mais natural em português do que uma reprodução mecânica de ‘fazer esmola’.
- source_word: μὴ φθονεσάτω σου ὁ ὀφθαλμός
  choice: não olhe com avareza
  rationale: A formulação preserva a imagem do olhar presente em ὁ ὀφθαλμός e expressa o valor contextual de φθονέω como relutância mesquinha em dar. A forma literal é indicada em nota.
- source_word: ἐν τῷ ποιεῖν σε ἐλεημοσύνην
  choice: quando der esmola
  rationale: A construção ἐν + infinitivo articular tem valor temporal. A tradução evita uma expressão artificial e conserva a referência específica à ajuda material.
theological_decisions:
- issue: Sentido de ἐλεημοσύνη
  choice: esmola
  alternative: ato de misericórdia; caridade
  rationale: Neste contexto de dar pão e roupas aos necessitados, o termo designa auxílio material concreto. ‘Esmola’ preserva essa especificidade sem reduzir o texto a uma disposição abstrata de misericórdia.
- issue: Imagem moral do olho em μὴ φθονεσάτω σου ὁ ὀφθαλμός
  choice: preservar a imagem por meio de ‘não olhe com avareza’
  alternative: não dê de má vontade; não seja mesquinho ao dar
  rationale: A imagem do olho integra a força retórica do texto e provavelmente reflete um idioma moral semítico. A tradução mantém a imagem, mas esclarece seu sentido contextual em português corrente.
- issue: Alcance de γυμνοῖς
  choice: aos que estão sem roupa
  alternative: aos nus; aos que estão malvestidos
  rationale: O termo pode descrever nudez ou falta grave de vestuário. A tradução não determina além do necessário o grau exato da privação, e a nota preserva a alternativa lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construções naturais para leitores brasileiros e internacionais. O tratamento por ‘você’ fica implícito nas formas verbais e nos possessivos, evitando regionalismos. A repetição de ‘esmola’ acompanha a repetição de ἐλεημοσύνη no grego.
