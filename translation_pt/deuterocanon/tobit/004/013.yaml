base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/013.yaml
  text: And now[a], child, love your brothers, and do not become proud in your heart over your brothers and the sons and daughters of your people, so as to take a wife for yourself from among them. For in pride there is ruin and much disorder, and in uselessness there is decline and great want[b]; for uselessness is the mother of famine.
translation:
  language: pt
  text: E agora, filho, ame seus irmãos e não se ensoberbeça em seu coração acima de seus irmãos e dos filhos e filhas de seu povo, ao tomar para si uma esposa dentre eles.[a] Pois no orgulho há ruína e muita desordem, e na ociosidade há decadência e grande necessidade;[b] porque a ociosidade é mãe da fome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não seja arrogante para com seus irmãos e com os filhos e filhas de seu povo quando tomar para si uma esposa dentre eles”. A sintaxe grega é condensada, e a relação entre a advertência contra o orgulho e a cláusula matrimonial pode ser entendida de mais de uma maneira.'
    reason: alternative_reading
  - marker: b
    text: “Ociosidade” também pode ser traduzida por “preguiça” ou, menos provavelmente neste contexto, “inutilidade”. As referências à decadência, à necessidade e à fome favorecem o sentido de inatividade improdutiva.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: filho
  rationale: Como tratamento afetuoso dirigido por Tobit a Tobias, «filho» é natural em português e adequado ao referente masculino, embora o substantivo grego seja diminutivo e possa ser traduzido mais literalmente por «criança».
- source_word: ἀγάπα
  choice: ame
  rationale: Imperativo direto de ἀγαπάω; «ame» preserva de modo claro e simples a força da exortação.
- source_word: ἀδελφούς
  choice: irmãos
  rationale: Mantém o plural masculino do grego; a expressão seguinte menciona explicitamente os filhos e as filhas do povo.
- source_word: ὑπερηφάνευε τῇ καρδίᾳ σου
  choice: não se ensoberbeça em seu coração
  rationale: Preserva tanto a ideia de exaltação orgulhosa quanto a referência ao coração como sede da disposição interior.
- source_word: ἀπὸ τῶν ἀδελφῶν σου καὶ τῶν υἱῶν καὶ θυγατέρων τοῦ λαοῦ σου
  choice: acima de seus irmãos e dos filhos e filhas de seu povo
  rationale: Com o verbo de orgulho, ἀπό indica a elevação da pessoa sobre os demais; «acima de» conserva essa relação sem reduzi-la a mero afastamento.
- source_word: λαβεῖν σεαυτῷ ἐξ αὐτῶν γυναῖκα
  choice: ao tomar para si uma esposa dentre eles
  rationale: Reproduz o idioma de «tomar esposa» e deixa a ligação sintática com a advertência sobre o orgulho suficientemente aberta, em vez de impor exclusivamente propósito ou resultado.
- source_word: ἀπώλεια
  choice: ruína
  rationale: Expressa o resultado desastroso no contexto sapiencial sem acrescentar conotação escatológica.
- source_word: ἀκαταστασία πολλή
  choice: muita desordem
  rationale: Tradução ampla e natural para instabilidade, confusão ou perturbação prática e social.
- source_word: ἀχρειότης
  choice: ociosidade
  rationale: Embora possa significar inutilidade ou indolência, as consequências econômicas e a referência à fome favorecem a ideia de inatividade improdutiva.
- source_word: ἐλάττωσις
  choice: decadência
  rationale: Comunica redução, declínio ou diminuição de condição e recursos, mantendo a formulação proverbial.
- source_word: ἔνδεια μεγάλη
  choice: grande necessidade
  rationale: Expressa falta e privação em português atual; «grande pobreza» também seria possível.
theological_decisions:
- issue: Relação entre a advertência contra o orgulho e a cláusula matrimonial
  choice: A formulação «ao tomar para si uma esposa dentre eles» liga o orgulho à escolha matrimonial sem determinar rigidamente a relação sintática.
  alternative: «Não seja arrogante para com... quando tomar para si uma esposa dentre eles» ou «não se ensoberbeça... de modo a tomar para si uma esposa dentre eles».
  rationale: A sintaxe grega é condensada e admite mais de uma compreensão. A tradução evita transformar o versículo numa formulação doutrinária mais ampla e inequívoca sobre endogamia.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A construção mantém o paralelismo sapiencial e a metáfora final. «Ensoberbeça» é formal, mas corrente em registro bíblico; «ao tomar» ajuda a conservar a ambiguidade da ligação do infinitivo grego.
