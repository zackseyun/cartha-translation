base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/005.yaml
  text: All the days[a], child, remember the Lord our God. Do not desire to transgress his commandments. Practice righteousness all the days of your life, and do not walk in the ways of unrighteousness.
translation:
  language: pt
  text: Todos os dias, meu filho, lembre-se do Senhor, nosso Deus. Não queira transgredir os seus mandamentos. Pratique a justiça[a] todos os dias da sua vida e não ande nos caminhos da injustiça.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Faça o que é justo”. Os termos gregos traduzidos por “justiça” e “injustiça” podem abranger tanto a conduta moral pessoal quanto as relações sociais.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσας τὰς ἡμέρας
  choice: Todos os dias
  rationale: Reproduz de modo natural a ideia de constância expressa pelo acusativo de duração.
- source_word: παιδίον
  choice: meu filho
  rationale: No contexto, trata-se da forma afetuosa com que o pai se dirige ao filho; o possessivo, embora implícito, torna a expressão natural em português sem alterar o referente.
- source_word: μνημόνευε
  choice: lembre-se
  rationale: O imperativo presente pede lembrança contínua; a forma pronominal é idiomática em português e mantém a força religiosa e ética.
- source_word: Κυρίου τοῦ θεοῦ ἡμῶν
  choice: do Senhor, nosso Deus
  rationale: Mantém os dois títulos e deixa claro que 'nosso Deus' identifica o Senhor.
- source_word: μὴ θελήσῃς παραβῆναι
  choice: Não queira transgredir
  rationale: Preserva tanto o elemento volitivo de θελήσῃς quanto a ação de παραβῆναι, sem reduzir a frase a uma simples proibição do ato.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: os seus mandamentos
  rationale: Emprega o termo bíblico corrente para ἐντολάς e conserva a referência ao Senhor.
- source_word: δικαιοσύνην ποίει
  choice: Pratique a justiça
  rationale: Expressa naturalmente a ação habitual indicada pelo imperativo presente. 'Justiça' abrange aqui conduta reta e dimensão social, sem restringir o termo a uma noção jurídica.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς σου
  choice: todos os dias da sua vida
  rationale: Preserva a repetição enfática e a extensão temporal integral da expressão grega.
- source_word: μὴ πορευθῇς
  choice: não ande
  rationale: Conserva a metáfora bíblica do andar como modo de vida ou conduta.
- source_word: ταῖς ὁδοῖς τῆς ἀδικίας
  choice: nos caminhos da injustiça
  rationale: Mantém a imagem plural dos caminhos e o contraste lexical direto com δικαιοσύνη.
theological_decisions:
- issue: Tradução do par ético δικαιοσύνη / ἀδικία
  choice: justiça / injustiça
  alternative: retidão / injustiça; prática do que é justo / prática do que é injusto
  rationale: Em português corrente, 'justiça/injustiça' preserva com clareza o contraste formal do grego e pode incluir tanto a retidão pessoal quanto a responsabilidade social. A nota explicita essa amplitude para evitar uma leitura apenas jurídica.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e ampla inteligibilidade internacional. Mantém a metáfora bíblica de andar em caminhos e a repetição enfática de 'todos os dias'.
