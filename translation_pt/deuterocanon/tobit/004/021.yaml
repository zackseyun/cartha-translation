base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/021.yaml
  text: And do not be afraid[a], child, because we have become poor; you have much, if you fear God and turn away from every sin and do what is pleasing before him.
translation:
  language: pt
  text: E não tenha medo, filho, porque ficamos pobres; você tem muito[a], se temer a Deus, se afastar de todo pecado e fizer o que é agradável diante dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «há muito para você». A expressão grega pode indicar tanto o que alguém possui quanto o que está disponível para essa pessoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ φοβοῦ
  choice: não tenha medo
  rationale: Expressa em português atual e idiomático a proibição no imperativo, preservando sua força.
- source_word: παιδίον
  choice: filho
  rationale: No contexto da fala de um pai ao filho, mantém o tom familiar e afetuoso do vocativo grego sem acrescentar o possessivo «meu».
- source_word: ἐπτωχεύσαμεν
  choice: ficamos pobres
  rationale: 'Preserva o sentido ingressivo do aoristo: eles passaram a uma condição de pobreza, em vez de apenas serem descritos como pobres.'
- source_word: ὑπάρχει σοι πολλὰ
  choice: você tem muito
  rationale: Reproduz de modo conciso a construção grega de posse ou disponibilidade, sem definir se o muito é material, moral ou espiritual.
- source_word: ἐὰν φοβηθῇς τὸν θεὸν
  choice: se temer a Deus
  rationale: Mantém a expressão bíblica tradicional de temor reverente a Deus e a condição expressa no grego.
- source_word: ἀποστῇς ἀπὸ πάσης ἁμαρτίας
  choice: afastar-se de todo pecado
  rationale: Comunica separação voluntária de todo pecado em linguagem natural, sem reduzir a expressão a pecados específicos.
- source_word: ποιήσῃς τὸ ἀρεστὸν
  choice: fizer o que é agradável
  rationale: Traduz naturalmente o adjetivo substantivado grego e preserva a ideia de agir de modo agradável a Deus.
- source_word: ἐνώπιον αὐτοῦ
  choice: diante dele
  rationale: Conserva a expressão relacional de estar sob a avaliação divina, com registro bíblico digno e claro.
theological_decisions:
- issue: Sentido de «você tem muito» em um contexto de pobreza
  choice: Manter a afirmação ampla, condicionada ao temor de Deus, ao afastamento do pecado e à prática do que lhe agrada, sem especificar a natureza desse «muito».
  alternative: Entender a frase como promessa de prosperidade material ou, no outro extremo, como referência exclusiva a riquezas morais ou espirituais.
  rationale: O grego não define a natureza do que a pessoa tem ou do que lhe está disponível. A formulação preserva essa abertura e evita tanto uma garantia de prosperidade quanto uma espiritualização indevida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Filho» soa natural como vocativo paterno; «diante dele» conserva o registro bíblico sem arcaísmo excessivo.
