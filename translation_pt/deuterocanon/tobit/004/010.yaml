  text: For almsgiving rescues from death and will not allow one to enter into the darkness[a][b].
translation:
  language: pt
  text: Pois dar esmolas[a] livra da morte e não permitirá entrar nas trevas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «praticar a caridade» ou «fazer obras de misericórdia»; o termo grego se refere especificamente à ajuda dada aos necessitados.
    reason: lexical_alternative
  - marker: b
    text: «As trevas» provavelmente evocam o domínio da morte ou uma profunda escuridão; o grego mantém a imagem breve e um tanto aberta.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεημοσύνη
  choice: dar esmolas
  rationale: No uso judaico helenístico, o substantivo denota concretamente a ajuda material dada aos necessitados. A locução verbal é mais natural e clara em português atual do que o substantivo técnico «esmola» ou «doação de esmolas».
- source_word: ἐκ θανάτου
  choice: da morte
  rationale: A preposição ἐκ indica livramento para fora do domínio ou perigo da morte; «da morte» é a formulação idiomática em português.
- source_word: ῥύεται
  choice: livra
  rationale: O verbo expressa resgate ou libertação de um perigo. «Livra» preserva a afirmação direta sem acrescentar conotações sistemáticas que «salva» poderia suscitar.
- source_word: οὐκ ἐάσει
  choice: não deixará
  rationale: O futuro de ἐάω indica que não permitirá a entrada. «Não deixará» é atual, natural e mantém o valor futuro do grego.
- source_word: εἰσελθεῖν
  choice: entrar
  rationale: Equivalente direto e idiomático do infinitivo grego.
- source_word: εἰς τὸ σκότος
  choice: nas trevas
  rationale: «Nas trevas» preserva a imagem definida e solene do grego, ao mesmo tempo que soa natural em português; não especifica se a imagem se refere à morte, ao mundo dos mortos ou à escuridão escatológica.
theological_decisions:
- issue: Se o versículo deve ser formulado como se dar esmolas merecesse a salvação
  choice: Manter a afirmação direta de que dar esmolas livra da morte, sem transformá-la numa formulação doutrinária sistemática.
  alternative: Restringir «morte» a um perigo temporal ou atenuar a declaração com «pode livrar».
  rationale: O grego faz a declaração sem qualificações. A tradução não deve enfraquecê-la nem harmonizá-la silenciosamente com sistemas teológicos posteriores.
- issue: Sujeito implícito de εἰσελθεῖν
  choice: Explicitar com «ninguém», em construção impessoal natural em português.
  alternative: Usar «a pessoa» ou repetir «quem dá esmolas».
  rationale: O grego não expressa o sujeito do infinitivo. «Ninguém» comunica naturalmente o efeito preventivo sem restringir a referência mais do que o contexto permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Dar esmolas» conserva o sentido concreto no contexto; «nas trevas» mantém a concisão e a abertura da metáfora.
