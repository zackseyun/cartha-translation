base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/020.yaml
  text: And now I am showing you the ten talents of silver that I deposited with Gabael son of Gabrias in Rages of Media[a].
translation:
  language: pt
  text: E agora mostro a você[a] os dez talentos de prata que depositei aos cuidados de Gabael, filho de Gabrias, em Rages da Média.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dou a conhecer a você”. O verbo grego pode significar apontar, mostrar ou comunicar algo, sem necessariamente indicar uma exibição física.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδεικνύω
  choice: mostro a você
  rationale: Mantém o presente e a amplitude do verbo grego, que pode significar tanto apontar ou mostrar quanto dar a conhecer. No contexto, não exige que as moedas estejam sendo exibidas fisicamente.
- source_word: τὰ δέκα τάλαντα τοῦ ἀργυρίου
  choice: os dez talentos de prata
  rationale: Preserva a quantidade, o metal e a antiga unidade de peso e valor, sem convertê-la de modo especulativo em moeda moderna.
- source_word: παρεθέμην
  choice: depositei
  rationale: O verbo médio descreve aqui a entrega do dinheiro a alguém para que o guardasse; “depositei” comunica com precisão essa relação financeira.
- source_word: Γαβαήλῳ
  choice: Gabael
  rationale: Translitera o nome pessoal da forma grega apresentada pelo testemunho de Swete.
- source_word: τῷ τοῦ Γαβρεία
  choice: filho de Gabrias
  rationale: Explicita a filiação subentendida pela construção grega com artigo e genitivo, conforme exige o português natural.
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: em Rages da Média
  rationale: Translitera o topônimo do texto grego e conserva a designação geográfica no genitivo.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. Mantiveram-se os nomes antigos e a unidade “talento”; a formulação evita sugerir, além do grego, que Tobit estivesse exibindo fisicamente a prata.
