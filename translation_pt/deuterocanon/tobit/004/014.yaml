review_pass:
  verdict: revise
  source_fidelity: A primeira frase traduz com precisão a proibição de deixar o salário do trabalhador passar a noite sem pagamento, e “imediatamente” reproduz bem παραυτίκα. A formulação “ele lhe retribuirá” torna explícito Deus como agente de um passivo grego (ἀποδοθήσεταί σοι). Embora essa leitura seja contextual e plausível, a voz passiva deve ser preservada para não eliminar essa nuance. “Meu” em “meu filho” não está expresso no vocativo παιδίον.
  naturalness: O texto é claro, fluente e adequado ao português moderno. “Tenha cuidado consigo mesmo” comunica πρόσεχε σεαυτῷ de modo mais idiomático do que “Cuide de si mesmo”, que pode sugerir sobretudo autocuidado físico.
  terminology: “Salário”, “pague-lhe”, “Deus”, “recompensado”, “filho”, “obras” e “conduta” mantêm registro digno e compreensível. “Seja instruído” reflete mais diretamente πεπαιδευμένος (“educado/formado/instruído”) do que “seja disciplinado”, sem excluir a dimensão ética do contexto.
  issues:
  - severity: low
    issue: Explicitação do agente no segundo enunciado
    rationale: ἀποδοθήσεταί σοι está na voz passiva. Deus é o antecedente contextual mais provável, mas o texto grego não o declara como sujeito gramatical; uma tradução passiva preserva melhor a forma e a nuance.
  - severity: low
    issue: Adição possessiva em “meu filho”
    rationale: παιδίον é “filho/criança” como vocativo; o possessivo não está expresso. Em um conselho paterno ele é compreensível, mas “filho” é mais estritamente fiel.
  - severity: low
    issue: “Disciplinado” para πεπαιδευμένος
    rationale: O particípio remete primariamente a ser educado, treinado ou instruído. “Instruído” preserva essa noção e funciona naturalmente com “conduta”.
  revised_text: Não deixe que o salário de ninguém que trabalhe para você fique até o dia seguinte sem pagamento; pague-lhe imediatamente. Se você servir a Deus, será recompensado. Tenha cuidado consigo mesmo, filho, em todas as suas obras e seja instruído em toda a sua conduta.
