base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/014.yaml
  text: Do not let the wages of any man who works for you stay overnight with you, but pay him at once. If you serve God, it will be repaid to you. Watch yourself, child, in all your works, and be disciplined in all your conduct.
translation:
  language: pt
  text: Não deixe que o salário de ninguém que trabalhe para você fique até o dia seguinte sem pagamento; pague-lhe imediatamente. Se você servir a Deus, será recompensado. Tenha cuidado consigo mesmo, filho, em todas as suas obras e seja instruído em toda a sua conduta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μισθὸς ... μὴ αὐλισθήτω
  choice: Não retenha até o dia seguinte o salário
  rationale: A imagem grega é a de o salário passar a noite com o empregador; a formulação portuguesa comunica naturalmente a proibição de atrasar o pagamento até o dia seguinte.
- source_word: παντὸς ἀνθρώπου ὃς ἐὰν ἐργάσηται παρὰ σοὶ
  choice: de ninguém que trabalhar para você
  rationale: ἄνθρωπος é inclusivo neste contexto; “ninguém que trabalhar para você” preserva a abrangência sem restringir o preceito a trabalhadores homens.
- source_word: παραυτίκα
  choice: imediatamente
  rationale: Expressa o sentido de pagamento sem demora.
- source_word: ἀποδοθήσεταί σοι
  choice: ele lhe retribuirá
  rationale: O passivo divino pode ser expresso naturalmente com Deus, mencionado na oração anterior, como agente; “retribuirá” mantém a reciprocidade lexical com ἀπόδος.
- source_word: παιδίον
  choice: meu filho
  rationale: No conselho paterno de Tobit, o vocativo afetivo é expresso de modo natural em português por “meu filho”.
- source_word: ἴσθι πεπαιδευμένος
  choice: seja disciplinado
  rationale: Preserva a ideia de formação moral e autodisciplina, sem reduzir o termo a mera instrução intelectual.
- source_word: ἐν πάσῃ ἀναστροφῇ σου
  choice: em toda a sua maneira de viver
  rationale: ἀναστροφή designa conduta ou modo de vida; esta redação é clara, abrangente e digna em português moderno.
theological_decisions:
- issue: Agente de ἀποδοθήσεταί σοι, um passivo que pode funcionar como passivo divino
  choice: ele lhe retribuirá
  alternative: isso lhe será retribuído
  rationale: Como Deus é o referente explícito imediatamente anterior, o pronome torna a frase natural e explicita o agente fortemente implícito, sem acrescentar uma identidade alheia ao contexto.
- issue: Relação entre servir a Deus e receber retribuição
  choice: Se você servir a Deus, ele lhe retribuirá
  alternative: Se servires a Deus, isso te será retribuído
  rationale: Mantém a declaração condicional e sua tensão teológica sem especificar a forma, o momento ou o mérito da retribuição.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. Emprega “você” de forma consistente, com tom paterno, claro e digno. Evita linguagem jurídica excessiva e conserva o paralelismo entre pagar ao trabalhador e receber retribuição de Deus.
