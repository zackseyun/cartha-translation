revisions:
- from: Não retenha até o dia seguinte o salário de ninguém que trabalhar para você; pague-lhe imediatamente. Se você servir a Deus, ele lhe retribuirá. Cuide de si mesmo, meu filho, em tudo o que fizer, e seja disciplinado em toda a sua maneira de viver.
  to: Não deixe que o salário de ninguém que trabalhe para você fique até o dia seguinte sem pagamento; pague-lhe imediatamente. Se você servir a Deus, será recompensado. Tenha cuidado consigo mesmo, filho, em todas as suas obras e seja instruído em toda a sua conduta.
  rationale: A revisão conserva o sentido integral do preceito sobre o pagamento imediato, preserva a voz passiva da promessa de retribuição e ajusta os vocábulos de conselho moral para refletirem mais de perto o grego, em português atual e natural.
