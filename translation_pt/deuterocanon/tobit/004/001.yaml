base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/001.yaml
  text: On that day Tobit remembered the silver that he had deposited with Gabael in Rages of Media[a][b].
translation:
  language: pt
  text: Naquele dia, Tobit se lembrou da prata[a] que havia deixado em depósito com Gabael, em Rages, na Média.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “do dinheiro”; no grego, “da prata”, termo que pode se referir a dinheiro em prata, cunhado ou pesado.
    reason: lexical_alternative
  - marker: b
    text: “Rages” também é tradicionalmente grafada “Rhages”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: Naquele dia
  rationale: Expressão temporal natural em português, preservando a referência definida do grego.
- source_word: ἐμνήσθη
  choice: se lembrou
  rationale: Reproduz naturalmente o sentido do aoristo médio, sem acrescentar nuance interpretativa.
- source_word: περὶ τοῦ ἀργυρίου
  choice: da prata
  rationale: Mantém o termo concreto do grego, embora ἀργύριον também possa designar dinheiro em prata.
- source_word: ὃ παρέθετο
  choice: que havia deixado em depósito
  rationale: Exprime com clareza o sentido contextual de confiar ou depositar bens com outra pessoa; o mais-que-perfeito composto indica que o depósito antecedeu a lembrança.
- source_word: Γαβαήλῳ
  choice: com Gabael
  rationale: Translitera o nome pessoal grego e emprega a preposição exigida naturalmente pela expressão portuguesa 'deixar em depósito com alguém'.
- source_word: ἐν Ῥάγοις
  choice: em Rages
  rationale: Translitera diretamente o topônimo grego; a grafia alternativa tradicional é registrada em nota.
- source_word: τῆς Μηδίας
  choice: na Média
  rationale: Identifica de maneira idiomática a região em que ficava Rages, preservando a relação geográfica expressa pelo genitivo.
