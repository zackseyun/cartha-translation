base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/012.yaml
  text: Guard yourself[a], child, from all sexual immorality, and first take a wife from the offspring of your fathers. Do not take a foreign woman who is not from the tribe of your father, because we are sons of the prophets. Remember, child, Noah, Abraham, Isaac, and Jacob, our fathers from of old, that they all took wives from among their brothers, and they were blessed in their children[b], and their offspring will inherit the land.
translation:
  language: pt
  text: 'Guarda-te, filho, de toda imoralidade sexual e, primeiro, toma para ti uma esposa da descendência de teus antepassados. Não tomes uma mulher estrangeira, que não seja da tribo de teu pai, pois somos filhos dos profetas.[a] Lembra-te, filho, de Noé, Abraão, Isaque e Jacó, nossos antepassados desde a antiguidade: todos eles tomaram esposas dentre seus irmãos,[b] foram abençoados em seus filhos, e a descendência deles herdará a terra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “somos descendentes dos profetas”. O grego diz literalmente “filhos dos profetas”.'
    reason: alternative_reading
  - marker: b
    text: Isto é, dentre seus parentes próximos ou membros do próprio clã, não dentre irmãos em sentido literal.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόσεχε σεαυτῷ
  choice: Guarda-te
  rationale: Expressa a vigilância pessoal e conserva a força reflexiva do grego em português claro e digno.
- source_word: παιδίον
  choice: filho
  rationale: No contexto da instrução paterna, é a forma vocativa mais natural e afetuosa em português, sem exigir o acréscimo de “meu”.
- source_word: πάσης πορνείας
  choice: de toda imoralidade sexual
  rationale: Abrange o sentido moral amplo de πορνεία sem recorrer a termos arcaicos ou excessivamente estreitos.
- source_word: γυναῖκα πρῶτον λάβε
  choice: primeiro, toma para ti uma esposa
  rationale: Mantém a prioridade expressa por πρῶτον e torna explícito o sentido matrimonial de λαμβάνω γυναῖκα.
- source_word: ἀπὸ τοῦ σπέρματος τῶν πατέρων σου
  choice: dentre a descendência de teus pais
  rationale: Traduz σπέρμα em seu sentido genealógico e preserva a referência direta aos pais ancestrais.
- source_word: γυναῖκα ἀλλοτρίαν
  choice: uma mulher estrangeira
  rationale: Conserva a alteridade indicada por ἀλλοτρίαν; o contexto imediato delimita essa condição em termos de tribo e linhagem, não apenas de nacionalidade.
- source_word: φυλῆς τοῦ πατρός σου
  choice: da tribo de teu pai
  rationale: Reproduz de modo direto a afiliação tribal paterna do texto grego.
- source_word: υἱοὶ προφητῶν ἐσμεν
  choice: somos filhos dos profetas
  rationale: Preserva a expressão incomum e teologicamente sugestiva do grego, deixando a leitura genealógica para a nota.
- source_word: ἀπὸ τοῦ αἰῶνος
  choice: desde a antiguidade
  rationale: Comunica a antiguidade dos patriarcas em linguagem atual, sem interpretar a expressão como referência absoluta ao princípio do mundo.
- source_word: ἐκ τῶν ἀδελφῶν αὐτῶν
  choice: dentre seus irmãos
  rationale: Mantém no texto a linguagem concreta de parentesco do grego, enquanto a nota esclarece seu alcance contextual.
- source_word: εὐλογήθησαν ἐν τοῖς τέκνοις αὐτῶν
  choice: foram abençoados em seus filhos
  rationale: Conserva a ambiguidade de ἐν, que pode indicar a esfera, o meio ou a manifestação da bênção.
- source_word: τὸ σπέρμα αὐτῶν κληρονομήσει γῆν
  choice: a descendência deles herdará a terra
  rationale: “Descendência” expressa o valor genealógico de σπέρμα, e “herdará a terra” preserva a formulação bíblica sem explicitar além do grego qual terra está em vista.
theological_decisions:
- issue: Sentido de “somos filhos dos profetas” numa lista de antepassados patriarcais
  choice: Manter “somos filhos dos profetas” no texto principal
  alternative: somos descendentes dos profetas
  rationale: A redação literal é distintiva e pode carregar mais que uma simples informação genealógica. A nota oferece o provável sentido de descendência sem eliminar a tensão entre “profetas” e os patriarcas logo mencionados.
- issue: Linguagem de parentesco na orientação matrimonial
  choice: Manter “irmãos” no texto principal e esclarecer em nota
  alternative: parentes; membros de seu clã
  rationale: O grego emprega ἀδελφοί, mas o contexto matrimonial aponta para o grupo de parentesco, não para irmãos literais. A tradução conserva a forma da fonte e a nota impede uma leitura indevida.
- issue: Natureza da bênção “em seus filhos”
  choice: Preservar a construção ambígua “em seus filhos”
  alternative: foram abençoados por meio de seus filhos; foram abençoados com filhos
  rationale: A preposição ἐν admite mais de uma relação semântica. Não se deve decidir silenciosamente se os filhos são o meio, o conteúdo ou a esfera da bênção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa coerentes (“guarda-te”, “tomes”, “lembra-te”) adequadas ao conselho paterno solene. A redação mantém expressões marcadas da fonte quando sua simplificação eliminaria ambiguidades relevantes.
