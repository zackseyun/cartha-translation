base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/015.yaml
  text: And what you hate[a], do to no one. Do not drink wine to drunkenness, and do not let drunkenness go with you on your way.
translation:
  language: pt
  text: E aquilo que você odeia[a], não faça a ninguém. Não beba vinho a ponto de se embriagar, e não deixe que a embriaguez acompanhe você no seu caminho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E o que é detestável para você, não faça a ninguém.”'
    reason: Alternativa lexical que explicita a possibilidade de entender ὃ μισεῖς qualitativamente, como na nota da trilha de auditoria inglesa.
lexical_decisions:
- source_word: ὃ μισεῖς
  choice: aquilo que você odeia
  rationale: A oração relativa é ampla e proverbial. A formulação preserva a segunda pessoa do singular e não redefine o objeto como algo abstratamente odioso.
- source_word: μηδενὶ ... ποίησης
  choice: não faça a ninguém
  rationale: O dativo indica a pessoa a quem não se deve fazer tal coisa; a construção mantém com clareza a força universal da proibição.
- source_word: οἶνον εἰς μέθην μὴ πίῃς
  choice: não beba vinho até se embriagar
  rationale: εἰς μέθην indica resultado ou extensão. Em português corrente, «até se embriagar» comunica naturalmente a progressão até a intoxicação sem suavizá-la como mero excesso.
- source_word: μὴ πορευθήτω μετὰ σοῦ μέθη
  choice: não deixe que a embriaguez acompanhe você
  rationale: Preserva a personificação grega da embriaguez como algo que vai junto da pessoa, ao mesmo tempo que verte naturalmente o imperativo de terceira pessoa.
- source_word: ἐν τῇ ὁδῷ σου
  choice: pelo seu caminho
  rationale: Mantém a imagem do caminho, que pode abranger tanto a jornada concreta quanto o curso da vida, sem resolver essa amplitude.
theological_decisions:
- issue: Formulação da máxima ética de reciprocidade
  choice: E aquilo que você odeia, não faça a ninguém.
  alternative: E o que é odioso para você, não faça a ninguém.
  rationale: O grego apresenta a máxima em forma negativa. A redação escolhida acompanha diretamente a construção verbal ὃ μισεῖς e preserva a tensão proverbial, enquanto a alternativa explicita uma possível leitura qualitativa.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por «você» para reproduzir a segunda pessoa singular de modo amplamente compreensível. A imagem personificada da embriaguez e a ambiguidade concreta/metafórica do caminho foram preservadas.
