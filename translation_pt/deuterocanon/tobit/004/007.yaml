base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/007.yaml
  text: From what you have[a], give alms, and do not let your eye be grudging when you give alms. Do not turn your face away from any poor person[c][b], and the face of God will not be turned away from you.
translation:
  language: pt
  text: Do que você possui, dê esmolas e, ao dar esmolas, não deixe que seu olhar seja mesquinho.[a] Não desvie o rosto de nenhum pobre,[b] e o rosto de Deus jamais se desviará de você.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “que o seu olho não inveje”; a expressão grega descreve um olhar mesquinho, relutante ou ressentido ao dar.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “de nenhuma pessoa pobre”. O grego emprega o masculino singular com sentido genérico e distributivo.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a presença de Deus”. O grego diz literalmente “o rosto de Deus”, repetindo a imagem de “seu rosto” na oração anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τῶν ὑπαρχόντων σοι
  choice: Do que você possui
  rationale: Expressa os bens ou recursos disponíveis da pessoa e mantém a construção partitiva do grego em português natural.
- source_word: ποίει ἐλεημοσύνην
  choice: dê esmolas
  rationale: Neste contexto, ἐλεημοσύνη designa ajuda material concreta aos necessitados. “Dar esmolas” é a formulação portuguesa tradicional e ainda clara.
- source_word: μὴ φθονεσάτω σου ὁ ὀφθαλμός
  choice: não olhe com avareza
  rationale: Preserva a imagem do olho/olhar e comunica a atitude mesquinha ou ressentida no ato de dar, sem reduzir o texto simplesmente a “não seja avarento”.
- source_word: ἐν τῷ ποιεῖν σε ἐλεημοσύνην
  choice: ao dar esmolas
  rationale: A construção infinitiva tem valor temporal e é vertida de modo corrente.
- source_word: μὴ ἀποστρέψῃς τὸ πρόσωπόν σου
  choice: Não desvie o rosto
  rationale: Mantém explicitamente “rosto”, essencial para o paralelismo com “o rosto de Deus” na oração seguinte.
- source_word: ἀπὸ παντὸς πτωχοῦ
  choice: de nenhum pobre
  rationale: O masculino singular grego tem força distributiva e genérica. Em português, “nenhum pobre” conserva a forma e é idiomático, sem exigir que a referência se limite a um indivíduo específico.
- source_word: οὐ μὴ ἀποστραφῇ
  choice: jamais se desviará
  rationale: “Jamais” transmite a negação enfática de οὐ μή, enquanto a forma pronominal conserva o paralelismo verbal com a ordem anterior.
- source_word: τὸ πρόσωπον τοῦ θεοῦ
  choice: o rosto de Deus
  rationale: A tradução literal preserva a linguagem antropomórfica e a correspondência deliberada entre o rosto humano e o divino.
theological_decisions:
- issue: Linguagem antropomórfica a respeito de Deus
  choice: o rosto de Deus
  alternative: a presença de Deus
  rationale: O grego repete πρόσωπον nas duas orações. Manter “rosto” conserva a reciprocidade literária e a tensão teológica, sem interpretar previamente a expressão como mera “presença”.
- issue: Referência masculina em πτωχοῦ
  choice: nenhum pobre
  alternative: nenhuma pessoa pobre
  rationale: O adjetivo grego está no masculino singular com sentido genérico e distributivo. A opção escolhida reflete essa forma em português natural, sem acrescentar uma restrição masculina ao sentido.
- issue: Relação entre a conduta humana e a resposta divina
  choice: e o rosto de Deus jamais se desviará de você
  alternative: para que o rosto de Deus não se desvie de você
  rationale: O texto apresenta uma afirmação coordenada, não uma oração final explícita. A tradução mantém essa forma e não redefine a relação como finalidade ou mérito causal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “esmolas” e a imagem do rosto foram mantidas por sua função retórica. “Você” oferece clareza internacional com leitura natural no Brasil; “jamais” reproduz a força da negação grega.
