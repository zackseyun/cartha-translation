  text: For you are storing up a good treasure for yourself for a day of need[a].
translation:
  language: pt
  text: Pois você está acumulando para si um bom tesouro para um dia de necessidade[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o dia da necessidade”, “para um tempo de aflição” ou “para um dia de dificuldade”. A expressão grega é ampla e pode indicar necessidade urgente ou adversidade.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέμα
  choice: tesouro
  rationale: O substantivo designa algo guardado ou depositado. “Tesouro” é natural em português e, junto de θησαυρίζεις, preserva a imagem de acumular algo valioso, sem reduzir o sentido a uma operação financeira.
- source_word: γὰρ
  choice: Pois
  rationale: Mantém a função explicativa da partícula e liga esta afirmação à exortação anterior.
- source_word: ἀγαθὸν
  choice: bom
  rationale: Qualifica diretamente o tesouro e preserva a amplitude do adjetivo, sem restringi-lo a valor monetário ou utilidade prática.
- source_word: θησαυρίζεις
  choice: você está acumulando
  rationale: Expressa com clareza o ato contínuo de ajuntar ou guardar como tesouro e conserva o aspecto presente do verbo.
- source_word: σεαυτῷ
  choice: para si
  rationale: Traduz o dativo reflexivo de benefício de modo conciso, natural e digno.
- source_word: εἰς ἡμέραν ἀνάγκης
  choice: para um dia de necessidade
  rationale: Segue de perto a expressão grega e mantém aberto se ἀνάγκη indica necessidade urgente, aflição ou dificuldade.
theological_decisions:
- issue: Força metafórica de acumular tesouro por meio da esmola
  choice: Manter a metáfora de acumular um bom tesouro sem explicar seu mecanismo teológico.
  alternative: Interpretar explicitamente como conquista de recompensa celestial ou como provisão prática para uma dificuldade futura.
  rationale: O grego afirma que um bom tesouro é acumulado para um dia de necessidade, mas não especifica aqui a natureza do tesouro nem como ele beneficia a pessoa. A tradução preserva essa tensão sem importar uma doutrina de mérito.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. “Você” oferece clareza contemporânea; “para si” e “Pois” mantêm um tom digno. A repetição semântica entre “tesouro” e “acumulando” conserva a imagem do grego sem soar artificial.
