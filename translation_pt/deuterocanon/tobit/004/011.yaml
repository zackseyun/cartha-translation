  text: For almsgiving is a good gift for all who do it before the Most High[a].
translation:
  language: pt
  text: Pois dar esmolas é uma boa dádiva[a] para todos os que o fazem diante do Altíssimo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma boa oferta”; a palavra grega pode designar uma dádiva em geral e, em certos contextos, uma oferta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δῶρον
  choice: dádiva
  rationale: O substantivo pode significar tanto uma dádiva em sentido geral quanto uma oferta. “Dádiva” preserva o sentido amplo sem impor uma conotação cultual.
- source_word: ἐλεημοσύνη
  choice: dar esmolas
  rationale: O termo designa concretamente a ajuda material dada aos necessitados. A forma verbal “dar esmolas” é clara e natural no português atual, evitando o sentido excessivamente amplo de “caridade”.
- source_word: πᾶσι τοῖς ποιοῦσιν αὐτήν
  choice: para todos os que o fazem
  rationale: Reproduz de modo direto o sentido de ποιέω com o pronome αὐτήν. O pronome português retoma a ação de dar esmolas.
- source_word: ἐνώπιον τοῦ ὑψίστου
  choice: diante do Altíssimo
  rationale: “Diante de” conserva a linguagem relacional de ἐνώπιον, e “o Altíssimo” mantém o título divino judaico tradicional sem acrescentar uma identificação ausente no grego.
theological_decisions:
- issue: Como entender a afirmação de que dar esmolas é uma “boa dádiva”
  choice: Traduzir a frase como uma avaliação positiva direta do ato de dar esmolas, sem explicitar uma doutrina de mérito salvífico.
  alternative: Entender a dádiva especificamente como recompensa celestial ou como oferta cultual feita a Deus.
  rationale: O grego afirma apenas que a esmola é uma boa dádiva para quem a pratica diante do Altíssimo. A tradução preserva essa tensão e não acrescenta uma formulação doutrinária que o versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. “Dar esmolas” comunica a ação concreta sem arcaísmo excessivo; “dádiva” mantém o registro reverente e a amplitude lexical do grego.
