base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/019.yaml
  text: And at all times bless the Lord God[a], and ask from him that your ways may be made straight and that all your paths and plans may prosper. For no nation has counsel, but the Lord himself gives all good things, and whomever he wills he humbles, just as he pleases. And now, child, remember my commandments[b], and do not let them be blotted out from your heart.
translation:
  language: pt
  text: E em todo tempo bendiga o Senhor Deus e peça a ele que seus caminhos se tornem retos e que todas as suas veredas e seus planos sejam bem-sucedidos.[a] Pois nenhuma nação tem conselho,[b] mas o próprio Senhor dá todas as coisas boas e humilha quem ele quer, conforme deseja. E agora, filho, lembre-se dos meus mandamentos, e que eles não sejam apagados do seu coração.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todas as suas veredas e seus conselhos prosperem”. O termo grego βουλαί pode significar “planos”, “propósitos” ou “conselhos”.'
    reason: lexical_alternative
  - marker: b
    text: A frase “nenhuma nação tem conselho” é abrupta no grego. Pode indicar que nenhum povo possui em si mesmo o conselho decisivo, em contraste com o Senhor, que concede o bem e humilha quem quer.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντὶ καιρῷ
  choice: em todo tempo
  rationale: Preserva a abrangência temporal da expressão grega e mantém um registro bíblico natural em português.
- source_word: εὐλόγει
  choice: bendiga
  rationale: Reproduz diretamente o sentido de abençoar, adequado ao idioma bíblico de bendizer a Deus, sem reduzi-lo apenas a louvar.
- source_word: Κύριον τὸν Θεόν
  choice: o Senhor Deus
  rationale: Traduz os dois títulos presentes no grego sem acrescentar o possessivo ausente no texto.
- source_word: παρʼ αὐτοῦ αἴτησον
  choice: peça a ele
  rationale: Expressa de modo natural que o pedido é dirigido a Deus; o contexto já deixa clara sua condição de fonte da dádiva.
- source_word: ὅπως αἱ ὁδοί σου εὐθεῖαι γένωνται
  choice: que seus caminhos se tornem retos
  rationale: Conserva a metáfora dos caminhos retos e traduz γένωνται sem impor uma passiva mais forte do que a forma grega exige.
- source_word: τρίβοι
  choice: veredas
  rationale: Mantém o paralelismo metafórico com caminhos e o registro digno, sendo termo compreensível no português bíblico moderno.
- source_word: βουλαὶ
  choice: planos
  rationale: No primeiro uso, refere-se naturalmente a intenções ou projetos práticos; planos é mais claro no português atual do que conselhos.
- source_word: εὐοδωθῶσιν
  choice: sejam bem-sucedidos
  rationale: Comunica o resultado favorável indicado pelo verbo de forma clara e idiomática, sem sugerir necessariamente prosperidade material.
- source_word: πᾶν ἔθνος οὐκ ἔχει βουλήν
  choice: nenhuma nação tem conselho
  rationale: Mantém a formulação abrupta e a repetição lexical de βουλή, preservando a contraposição entre o conselho humano e a ação soberana do Senhor.
- source_word: δίδωσιν πάντα τὰ ἀγαθὰ
  choice: dá todas as coisas boas
  rationale: Tradução direta e acessível, que conserva tanto a totalidade quanto a qualidade boa das dádivas.
- source_word: ὃ ἐὰν θέλῃ ταπεινοῖ
  choice: humilha quem ele quer
  rationale: Entende o relativo como pessoal, leitura coerente com o contexto de pessoas e nações, sem suavizar a afirmação.
- source_word: παιδίον
  choice: filho
  rationale: No contexto da exortação de Tobit a Tobias, filho é um vocativo natural e afetuoso em português; evita o vocativo pouco idiomático criança, sem acrescentar explicitamente meu.
- source_word: μὴ ἐξαλειφθήτωσαν ἐκ τῆς καρδίας σου
  choice: que eles não sejam apagados do seu coração
  rationale: Conserva a imagem forte de apagar os mandamentos do coração e o valor exortativo da forma grega.
theological_decisions:
- issue: Tradução de κύριος
  choice: Senhor
  alternative: Soberano
  rationale: Senhor é a correspondência bíblica normal para κύριος quando se refere a Deus e preserva o título sem inserir interpretação adicional.
- issue: Contraste entre o conselho das nações e a soberania divina
  choice: Preservar a afirmação forte de que nenhuma nação tem conselho, seguida pelo dar e humilhar do Senhor.
  alternative: Explicitar que nenhuma nação possui conselho último por si mesma ou suavizar para nenhuma nação tem pleno entendimento.
  rationale: O grego é abrupto e teologicamente tenso. A tradução não acrescenta qualificadores ausentes nem enfraquece a declaração sobre a liberdade divina de dar o bem e humilhar.
- issue: Objeto de ὃ ἐὰν θέλῃ ταπεινοῖ
  choice: quem ele quer
  alternative: o que ele quer
  rationale: A leitura pessoal produz sentido coerente no contexto de nações e de pessoas sujeitas à ação divina, mas não acrescenta uma explicação doutrinária da razão dessa humilhação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se as metáforas de caminhos e veredas, a repetição conceitual em torno de βουλή e a tensão da afirmação sobre a soberania divina. Os marcadores de nota foram colocados junto às expressões que efetivamente explicam.
