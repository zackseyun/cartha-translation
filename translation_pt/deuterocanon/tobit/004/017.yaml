translation:
  language: pt
  text: Derrame seus pães sobre o túmulo dos justos[a] e não dê aos pecadores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “junto ao túmulo dos justos”. A frase talvez se refira a um ato funerário ou memorial de caridade, mas aqui o grego foi mantido de forma literal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκχεον
  choice: Derrame
  rationale: Preserva a imagem concreta do imperativo grego, que significa literalmente derramar ou verter, sem substituir a expressão incomum por uma interpretação.
- source_word: τοὺς ἄρτους σου
  choice: os seus pães
  rationale: Mantém o plural concreto do grego. Em português, “pães” é natural e pode designar os alimentos distribuídos.
- source_word: ἐπὶ τὸν τάφον τῶν δικαίων
  choice: sobre o túmulo dos justos
  rationale: Reproduz de modo direto o sentido espacial de ἐπί com acusativo e conserva a imagem funerária sem decidir qual prática cultural está em vista.
- source_word: τῶν δικαίων
  choice: dos justos
  rationale: “Justos” é a equivalência bíblica corrente e preserva o sentido moral e religioso de δικαίων.
- source_word: καὶ μὴ δῷς
  choice: e não dê
  rationale: Reflete diretamente a conjunção καί e a proibição grega; o objeto permanece implícito, como no texto-fonte.
- source_word: τοῖς ἁμαρτωλοῖς
  choice: aos pecadores
  rationale: É a tradução direta, transparente e biblicamente familiar de ἁμαρτωλοῖς.
theological_decisions:
- issue: Interpretação da instrução funerária
  choice: Conservar no texto principal a imagem literal de derramar pães “sobre o túmulo dos justos”.
  alternative: Dar os pães no túmulo dos justos; oferecer alimento por ocasião do sepultamento dos justos.
  rationale: A prática cultural exata permanece incerta. A tradução não deve converter a formulação concreta em uma explicação sobre refeição funerária ou caridade memorial.
- issue: Alcance da proibição relativa aos pecadores
  choice: 'Manter o objeto da ação implícito: “não dê aos pecadores”.'
  alternative: Não dê desses pães aos pecadores; não participe de semelhante caridade funerária em favor de pecadores.
  rationale: O grego não repete o objeto na segunda oração. Mantê-lo implícito preserva a concisão e evita limitar interpretativamente a proibição além do que a sintaxe declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção incomum foi preservada porque pertence ao próprio texto grego; a nota apresenta a alternativa espacial e a possível referência cultural sem resolver a ambiguidade.
