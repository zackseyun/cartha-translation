base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/006.yaml
  text: For if you practice the truth[a], your works will prosper[b], and so will all who practice righteousness.
translation:
  language: pt
  text: Pois, se você praticar a verdade, seus atos terão bom êxito[b], e todos os que praticam a retidão[a] também terão bom êxito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “justiça”. O grego δικαιοσύνη pode indicar justiça ou retidão de conduta.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega é condensada e indica que seus atos terão bom andamento; não se refere necessariamente à prosperidade material.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιοῦντός σου τὴν ἀλήθειαν
  choice: se você praticar a verdade
  rationale: A construção grega é condensada. A formulação condicional se ajusta ao contexto de exortação, enquanto “praticar a verdade” preserva o caráter contínuo e ético da expressão.
- source_word: εὐοδίαι ἔσονται ἐν τοῖς ἔργοις σου
  choice: terá êxito em seus empreendimentos
  rationale: O substantivo εὐοδίαι comunica bom andamento ou sucesso; ἔργα, neste contexto, abrange aquilo que a pessoa realiza. Esta formulação é natural em português e evita sugerir exclusivamente prosperidade material.
- source_word: πᾶσι τοῖς ποιοῦσι τὴν δικαιοσύνην
  choice: todos os que praticam a justiça
  rationale: O particípio caracteriza uma conduta habitual. “Justiça” é a equivalência portuguesa mais direta de δικαιοσύνη e, no contexto, abrange a retidão ética.
theological_decisions:
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: “Justiça” preserva a correspondência lexical usual e a dimensão relacional e ética do termo. “Retidão” explicita o sentido moral mais amplo e é registrada como alternativa, sem reduzir o vocábulo a uma acepção meramente jurídica.
- issue: Relação entre conduta verdadeira e êxito
  choice: manter a afirmação sapiencial sem qualificá-la
  alternative: explicitar que se trata de um princípio geral, não de uma garantia absoluta
  rationale: O grego apresenta diretamente a relação entre praticar a verdade e ter bom êxito. Inserir uma ressalva interpretativa no texto resolveria uma tensão que o versículo deixa intacta.
translation_notes:
  register: Português moderno, digno e acessível, com construção natural para leitores brasileiros e compreensão ampla no mundo lusófono. A repetição de “praticar” preserva o paralelismo do grego.
