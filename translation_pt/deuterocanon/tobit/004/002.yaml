base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/002.yaml
  text: And he said within himself[a], “I have asked for death; why should I not call Tobiah my son, so that I may instruct him before I die?”
translation:
  language: pt
  text: 'E disse consigo mesmo[a]: “Eu pedi a morte. Por que não chamo meu filho Tobias, para orientá-lo antes de morrer?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A tradição semítica paralela amplia este pensamento: Tobit decide chamar Tobias para informá-lo, antes de morrer, sobre o dinheiro depositado com Gabael.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: disse consigo mesmo
  rationale: Preserva a imagem grega de falar interiormente e soa natural em português moderno, sem reduzir a expressão ao simples verbo «pensou».
- source_word: ᾐτησάμην θάνατον
  choice: pedi a morte
  rationale: O aoristo remete ao pedido anterior de Tobit. O verbo significa pedir ou solicitar; «pedi a morte» evita acrescentar ao verbo a ideia explícita de oração, embora o contexto anterior seja de prece.
- source_word: τί οὐ καλῶ
  choice: Por que não chamo
  rationale: Reproduz a pergunta deliberativa pela qual Tobit decide o que fazer. Em português corrente, a formulação expressa de modo natural a autoexortação do grego.
- source_word: Τωβείαν τὸν υἱόν μου
  choice: meu filho Tobias
  rationale: «Tobias» é a forma portuguesa tradicional e amplamente reconhecível do nome, empregada aqui sem implicar qualquer interpretação doutrinária.
- source_word: ὑποδείξω
  choice: orientá-lo
  rationale: O verbo pode significar mostrar, indicar, dar a conhecer ou instruir. No contexto das instruções de um pai antes da morte, «orientar» comunica a ideia diretiva sem introduzir no texto principal o conteúdo específico sobre o dinheiro presente na tradição semítica paralela.
- source_word: πρὶν ἀποθανεῖν με
  choice: antes de morrer
  rationale: Formulação temporal clara e idiomática em português; o sujeito permanece inequivocamente Tobit pelo contexto.
theological_decisions:
- issue: Uso da tradição semítica paralela para definir o conteúdo de ὑποδείξω
  choice: Manter no texto principal a formulação geral «para orientá-lo antes de morrer».
  alternative: Traduzir especificamente «para lhe falar do dinheiro antes de morrer».
  rationale: O texto grego primário não menciona aqui o depósito em poder de Gabael. A tradição semítica indireta contém essa explicitação, mas não deve substituir nem ampliar silenciosamente o testemunho grego; a informação é preservada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com fluência brasileira. A pontuação separa a lembrança do pedido de morte da deliberação seguinte. «Orientá-lo» mantém a amplitude semântica do grego e prepara naturalmente as instruções subsequentes.
