  text: Seek counsel from every wise man, and do not despise any useful advice.
translation:
  language: pt
  text: Busque conselho de toda pessoa sábia e não despreze nenhum conselho útil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “todo conselho útil”. O grego repete aqui a mesma palavra traduzida por “conselho” no início do versículo.'
    reason: Alternativa lexical e preservação da repetição do original.
lexical_decisions:
- source_word: συμβουλίαν ... συμβουλίας
  choice: conselho ... conselho
  rationale: A repetição de «conselho» reproduz a repetição do mesmo substantivo grego e mantém a ligação verbal entre as duas partes do versículo.
- source_word: παρὰ παντὸς φρονίμου
  choice: de toda pessoa sábia
  rationale: παρά com o genitivo indica a fonte do conselho. O adjetivo substantivado φρόνιμος designa alguém sábio ou prudente; «pessoa sábia» comunica naturalmente em português o sentido representativo da forma masculina grega sem acrescentar uma restrição de sexo que o contexto sapiencial não exige.
- source_word: ζήτησον
  choice: busque
  rationale: O imperativo aoristo pede uma ação deliberada de procurar ou obter conselho. «Busque» conserva a força exortativa e é claro no português moderno.
- source_word: μὴ καταφρονήσῃς
  choice: não despreze
  rationale: καταφρονέω expressa desprezo ou desconsideração; «não despreze» preserva a intensidade moral do verbo.
- source_word: ἐπὶ πάσης συμβουλίας χρησίμης
  choice: nenhum conselho útil
  rationale: Em uma proibição, «nenhum» expressa de modo idiomático o alcance distributivo de πάσης. χρησίμης caracteriza o conselho como útil, proveitoso ou benéfico.
