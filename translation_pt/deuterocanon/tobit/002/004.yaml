  yaml_path: translation/deuterocanon/tobit/002/004.yaml
  text: And I, before I had tasted anything, sprang up and removed him into a room until the sun set.
translation:
  language: pt
  text: Eu, antes de provar qualquer coisa, levantei-me de um salto e levei o morto para um cômodo, até o pôr do sol.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀγώ
  choice: Eu
  rationale: Mantém a mudança enfática para a ação do narrador; a conexão com o contexto pode ser expressa naturalmente sem um 'e' inicial obrigatório.
- source_word: πρὶν ἢ γεύσασθαί με
  choice: antes de provar qualquer coisa
  rationale: Reproduz a ideia de não ter começado a comer, em português natural, sem especificar comida onde o grego não a nomeia.
- source_word: ἀναπηδήσας
  choice: levantei-me de um salto
  rationale: Preserva a rapidez e a energia do particípio, de maneira idiomática.
- source_word: ἀνειλόμην αὐτόν
  choice: levei o morto
  rationale: No contexto, o pronome refere-se ao morto; 'levei' comunica a remoção para outro lugar sem sugerir indevidamente que ele ainda estava vivo.
- source_word: εἰς τι οἴκημα
  choice: para um cômodo
  rationale: τι torna o lugar indefinido; 'cômodo' é amplo e natural para οἴκημα neste contexto.
- source_word: ἕως οὗ ἔδυ ὁ ἥλιος
  choice: até o pôr do sol
  rationale: Expressão portuguesa idiomática que conserva o limite temporal do grego.
