  text: And on that very night[a], after I had gone out and buried him, I lay down to sleep in a defiled state beside the wall of the courtyard, and my face was uncovered.
translation:
  language: pt
  text: Naquela mesma noite, depois de sepultá-lo, voltei e me deitei para dormir, ritualmente impuro, junto ao muro do pátio; meu rosto estava descoberto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῇ τῇ νυκτί
  choice: naquela mesma noite
  rationale: A combinação do demonstrativo com a posição intensiva ressalta que isso aconteceu naquela própria noite; a formulação é natural em português.
- source_word: ἀνέλυσα
  choice: depois de sair
  rationale: No contexto, o verbo indica afastar-se ou partir. “Sair” preserva o movimento narrativo sem impor o sentido alternativo de “voltar”.
- source_word: θάψας
  choice: e sepultá-lo
  rationale: O particípio aoristo apresenta a sepultura como ação anterior; o pronome explicita o objeto já conhecido pelo contexto.
- source_word: ἐκοιμήθην
  choice: deitei-me para dormir
  rationale: A forma pode indicar dormir ou deitar-se para dormir; aqui a ação concreta prepara o incidente narrado em seguida.
- source_word: μεμιαμμένος
  choice: ritualmente impuro
  rationale: O particípio perfeito descreve o estado resultante do contato envolvido no sepultamento. A tradução distingue essa impureza ritual de culpa moral.
- source_word: παρὰ τὸν τοῖχον τῆς αὐλῆς
  choice: junto ao muro do pátio
  rationale: Reproduz de modo claro e corrente tanto a relação espacial quanto o ambiente doméstico.
- source_word: τὸ πρόσωπόν μου ἀκάλυπτον ἦν
  choice: com o rosto descoberto
  rationale: O grego especifica o rosto, não a cabeça. A construção portuguesa mantém esse detalhe, importante para o episódio seguinte.
theological_decisions:
- issue: Linguagem de impureza associada ao sepultamento
  choice: ritualmente impuro
  alternative: contaminado; impuro
  rationale: O contexto aponta para impureza cerimonial decorrente do sepultamento, não para culpa ou corrupção moral. A formulação explicita essa distinção sem atribuir ao texto condenação ética.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente ajustada para fluidez, sem apagar a sequência das ações nem o detalhe do rosto descoberto.
