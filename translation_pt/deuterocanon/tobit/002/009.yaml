  naturalness: O texto é claro e moderno. A revisão separa em coordenação explícita o retorno, o ato de deitar-se e a informação sobre o rosto, tornando a sequência narrativa mais natural sem perder concisão.
  terminology: «Ritualmente impuro» é adequado e evita sugerir culpa moral. «Muro do pátio» e «rosto descoberto» são precisos e idiomáticos. A nota mantém de modo útil a alternativa lexical e a explicação ritual.
