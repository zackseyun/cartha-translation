  text: But she said[a], “It was given to me as a gift in addition to my wages.” But I did not believe her, and I told her to give it back to its owners; and I was embarrassed before her. Then she answered and said to me, “Where are your acts of mercy and your righteous deeds? Behold[d][c][b], everything about you is known.”
translation:
  language: pt
  text: 'Mas ela disse: “Eu o recebi de presente, além do meu salário.”[a] Eu, porém, não acreditei nela e lhe dizia que o devolvesse aos donos; e fiquei envergonhado diante dela.[b] Então ela me respondeu: “Onde estão os seus atos de misericórdia e as suas obras de justiça?[c] Veja: tudo a seu respeito é conhecido.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “junto com o meu salário” ou “como parte do meu salário”. A expressão grega indica algo dado em conexão com a remuneração; pelo contexto, ela afirma que o animal foi um presente, não fruto de roubo.'
    reason: lexical_alternative
  - marker: b
    text: O grego se refere literalmente a ficar vermelho ou corar; aqui expressa vergonha ou constrangimento.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “as suas esmolas e os seus atos de retidão”. Os termos estão no plural e se referem a ações concretas.'
    reason: lexical_alternative
  - marker: d
    text: 'Literalmente, a frase final é concisa: “Veja, todas as coisas com você são conhecidas”. Ela também pode ser entendida como “tudo sobre você é conhecido” ou “tudo está evidente no seu caso”.'
    reason: ambiguity
lexical_decisions:
- source_word: Δῶρον δέδοταί μοι
  choice: Eu o recebi de presente
  rationale: Expressa naturalmente em português o perfeito passivo grego, mantendo a afirmação de que o objeto lhe foi dado, sem sugerir que ela o tomou.
- source_word: ἐπὶ τῷ μισθῷ
  choice: além do meu salário
  rationale: No contexto, a frase indica algo dado em conexão com a remuneração, provavelmente como acréscimo; a nota preserva as alternativas possíveis.
- source_word: οὐκ ἐπίστευον αὐτῇ
  choice: não acreditei nela
  rationale: Equivalente idiomático do imperfeito narrativo, coerente com a primeira pessoa indicada pelos verbos seguintes.
- source_word: ἀποδιδόναι αὐτὸ τοῖς κυρίοις
  choice: que o devolvesse aos donos
  rationale: ἀποδιδόναι significa devolver ou restituir; neste contexto econômico, κύριοι designa os proprietários, não senhores em sentido teológico.
- source_word: ἠρυθρίων πρὸς αὐτήν
  choice: fiquei envergonhado diante dela
  rationale: O verbo se refere literalmente a corar, mas comunica vergonha ou constrangimento na relação com ela.
- source_word: ἐλεημοσύναι
  choice: atos de misericórdia
  rationale: Mantém o sentido ético de obras misericordiosas, sem restringir necessariamente o termo a esmolas monetárias.
- source_word: δικαιοσύναι
  choice: obras de justiça
  rationale: O plural aponta para atos concretos de conduta justa, não para uma qualidade abstrata; 'obras de justiça' preserva também a ligação lexical com justiça.
- source_word: ἰδοὺ γνωστὰ πάντα μετὰ σοῦ
  choice: 'Veja: tudo o que diz respeito a você está às claras'
  rationale: Reproduz a força demonstrativa de ἰδού e a formulação grega comprimida sem decidir se a censura trata especificamente de reputação pública, juízo divino ou situação pessoal.
theological_decisions:
- issue: Sentido do plural δικαιοσύναι
  choice: obras de justiça
  alternative: atos de retidão; obras justas
  rationale: O plural descreve ações concretas. A tradução evita transformar o termo em uma declaração sobre justiça imputada ou estado jurídico.
- issue: Alcance da censura final de Ana
  choice: tudo o que diz respeito a você está às claras
  alternative: tudo sobre você é conhecido; tudo está evidente no seu caso
  rationale: A frase grega é ambígua e concisa. A opção mantém a censura sem especificar indevidamente quem conhece, nem afirmar que ela se refere exclusivamente ao caráter, às obras ou ao infortúnio de Tobit.
translation_notes:
  register: Português atual, digno e acessível, com construção narrativa natural para leitores brasileiros e compreensão internacional. 'Veja' conserva a função de ἰδού sem o tom arcaizante de 'eis'. Os marcadores foram posicionados junto às expressões a que suas notas se referem.
