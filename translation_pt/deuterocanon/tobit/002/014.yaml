  to: 'Mas ela disse: “Eu o recebi de presente, além do meu salário.”[a] Eu, porém, não acreditei nela e lhe dizia que o devolvesse aos donos; e fiquei envergonhado diante dela.[b] Então ela me respondeu: “Onde estão os seus atos de misericórdia e as suas obras de justiça?[c] Veja: tudo a seu respeito é conhecido.”[d]'
