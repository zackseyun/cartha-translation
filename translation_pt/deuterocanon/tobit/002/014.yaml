  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a fala de Ana, a suspeita de Tobit, a referência aos proprietários e a repreensão final. Contudo, «mandei» torna ἔλεγον («eu dizia») excessivamente pontual e autoritário; convém conservar o aspecto iterativo/narrativo. A cláusula final deve preferir «conhecido» a «está às claras», pois γνωστά expressa primariamente o que é conhecido, embora o alcance de μετὰ σοῦ permaneça comprimido e ambíguo.
  naturalness: O português é atual e claro. «Eu lhe dizia que o devolvesse» é mais próximo do grego e natural no contexto. «Tudo a seu respeito é conhecido» é uma formulação mais idiomática e semanticamente precisa do que «tudo o que diz respeito a você está às claras».
  terminology: «Atos de misericórdia» e «obras de justiça» representam bem os plurais éticos ἐλεημοσύναι e δικαιοσύναι, sem impor uma leitura doutrinária. «Donos» é apropriado para κυρίοις neste contexto de posse. «Fiquei envergonhado» comunica adequadamente o valor contextual de ἠρυθρίων, embora o verbo grego evoque literalmente corar.
